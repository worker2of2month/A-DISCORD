l_russian:
 VAL_Operational_Directorate: "Оперативное управление"
 VAL_Operational_Directorate_desc: "Соседей нельзя рассматривать как единую границу. Управление сведёт сведения о перевалах, рынках, гарнизонах и контролёрах регионов в одну постоянно обновляемую карту."
 VAL_Ministry_Of_Contract_Memory: "Министерство контрактной памяти"
 VAL_Ministry_Of_Contract_Memory_desc: "Государству нужны не только винтовки, но и право объяснять, почему каждый новый контракт был неизбежен. Министерство откроет один постоянный слот пропагандистских кампаний."
 VAL_Paid_Loyalty: "Оплаченная лояльность"
 VAL_Paid_Loyalty_desc: "Верность капитанов должна зависеть от реестра выплат, а не от личной близости к правителю."
 VAL_Provincial_Brokers: "Провинциальные посредники"
 VAL_Provincial_Brokers_desc: "Местные посредники будут отвечать за сбор заявок, набор подрядчиков и раннее предупреждение о недовольстве."
 VAL_Closed_Ledgers: "Закрытые реестры"
 VAL_Closed_Ledgers_desc: "Единая бухгалтерия лишит капитанов возможности скрывать людей и оружие в параллельных книгах."
 VAL_State_Above_Captains: "Государство выше капитанов"
 VAL_State_Above_Captains_desc: "Контрактная система переживёт своих создателей только тогда, когда ни одна рота не сможет считать себя равной государству."
 VAL_Quarterly_Contract_Norm: "Квартальный контрактный норматив"
 VAL_Quarterly_Contract_Norm_desc: "Раз в девяносто дней арсеналы обязаны передавать четыре тысячи винтовок на исполнение внешних заказов. Выполненный норматив поддерживает доверие и доходы; срыв разрушает кредитоспособность и может затянуть страну в долговую яму."

 VAL_Contract_Accounting_Office: "Управление контрактной отчётности"
 VAL_Contract_Accounting_Office_desc: "Промышленный план будет строиться по подтверждённым заказам, срокам и остаткам, а не по обещаниям фабрикантов."
 VAL_Salvage_Every_Barrel: "Собрать каждый ствол"
 VAL_Salvage_Every_Barrel_desc: "Разрозненные склады ещё хранят тысячи пригодных деталей. Инвентаризация быстро вернёт часть оружия в оборот."
 VAL_Standardize_Rifle_Lots: "Унифицировать партии винтовок"
 VAL_Standardize_Rifle_Lots_desc: "Единые допуски и маркировка упростят ремонт, экспорт и квартальные поставки."
 VAL_Merchant_Rail_Yards: "Торговые железнодорожные дворы"
 VAL_Merchant_Rail_Yards_desc: "Военные грузы должны покидать страну без недель ожидания на перегруженных станциях."
 VAL_Mobilize_Machine_Shops: "Мобилизовать машинные мастерские"
 VAL_Mobilize_Machine_Shops_desc: "Малые мастерские получат единые заказы и станут распределённой частью военного производства."
 VAL_Arsenal_Reserve: "Арсенальный резерв"
 VAL_Arsenal_Reserve_desc: "Часть выпуска нельзя продавать немедленно. Неприкосновенный запас позволит выполнять обязательства даже во время мобилизации."
 VAL_Westerholm_Concessions: "Вестерхольмские концессии"
 VAL_Westerholm_Concessions_desc: "Разработка месторождения в Вестерхольме даст Кефрейту дополнительные права на металл и доход от аренды. Пока Воркерланд способен соблюдать договор."

 VAL_Company_Rosters: "Реестры рот"
 VAL_Company_Rosters_desc: "Каждая наёмная рота будет внесена в единый реестр людей, вооружения и обязательств."
 VAL_Border_Survey_Corps: "Корпус пограничной разведки"
 VAL_Border_Survey_Corps_desc: "Небольшие группы заранее изучат дороги, мосты и перевалы на направлениях непосредственных амбиций."
 VAL_Contractor_Officers: "Офицеры-контрактники"
 VAL_Contractor_Officers_desc: "Лучшие командиры получат государственные контракты и единые требования к подготовке."
 VAL_Motorized_Columns: "Моторизованные колонны"
 VAL_Motorized_Columns_desc: "Операции за границей требуют быстрых колонн, способных снабжать разрозненные группы без стационарного тыла."
 VAL_Field_Repair_Corps: "Полевой ремонтный корпус"
 VAL_Field_Repair_Corps_desc: "Ремонтные команды будут следовать за ротами и возвращать технику в строй до того, как она попадёт в списание."
 VAL_Reserve_Battalions: "Резервные батальоны"
 VAL_Reserve_Battalions_desc: "Государство сформирует собственный резерв, не связанный с текущими частными заказами."
 VAL_Contract_General_Staff: "Контрактный генеральный штаб"
 VAL_Contract_General_Staff_desc: "Роты, склады и транспортные конторы впервые получат единый план применения."

 VAL_Watch_The_Old_Man: "Наблюдать за стариком"
 VAL_Watch_The_Old_Man_desc: "Пока старый порядок в Стеланде ещё держится, полезнее собирать сведения и покупать источники, чем делать громкие заявления."
 VAL_The_Guarantee_Weakens: "Гарантия слабеет"
 VAL_The_Guarantee_Weakens_desc: "Система внешних гарантий больше не выглядит безусловной. Кефрейт может осторожно проверить новые пределы допустимого."
 VAL_The_Passes_Are_Open: "Перевалы открыты"
 VAL_The_Passes_Are_Open_desc: "Гражданская война разорвала единый контроль над стеландскими высотами. Теперь карта меняется быстрее дипломатических заявлений."
 VAL_Recognize_The_New_Ledger: "Признать новый реестр"
 VAL_Recognize_The_New_Ledger_desc: "Победитель в Стеланде унаследует долги, дороги и потребность в оружии. Признание можно превратить в первый контракт нового порядка."
 VAL_Vorkerland_Contracts_Burn: "Воркерландские контракты горят"
 VAL_Vorkerland_Contracts_Burn_desc: "Постановки нарушаются одна за другой, платежи исчезают, а исполнители больше не признают прежние подписи. Сначала нужно определить масштаб потерь."
 VAL_Inventory_The_Empty_Yards: "Пересчитать пустые дворы"
 VAL_Inventory_The_Empty_Yards_desc: "После срыва поставок каждый ящик и пригодный ствол внутри страны имеет значение."

 VAL_military_operations: "Военные операции"
 VAL_military_operations_desc: "Локальная карта непосредственных амбиций Кефрейта и доступные операции за деньги, оружие и политическое влияние."
 VAL_propaganda_campaigns: "Пропагандистские кампании"
 VAL_propaganda_campaigns_desc: "Одновременно можно вести только столько кампаний, сколько доступно пропагандистских слотов."
 VAL_contract_obligations: "Контрактные обязательства"
 VAL_contract_obligations_desc: "Регулярные поставки, от которых зависят репутация, доходы и способность Кефрейта обслуживать долг."

 VAL_operations_panel_title: "КАРТА ВОЕННЫХ ОПЕРАЦИЙ"
 VAL_operations_panel_tt: "Карта охватывает только соседние направления непосредственных амбиций: Стеланд, Цинь, Осфарию и пограничные земли бывшей запретной зоны."
 VAL_operations_map_tt: "Цвет каждого выделенного региона меняется вместе с его фактическим контролёром. Бирюзовый — основной Стеланд; синий — сопротивление; оранжевый — партийная сторона; багровый — Кефрейт; серый — иной контролёр. Воркерланд намеренно не показан на этой локальной карте."
 VAL_operations_legend: "§3Стеланд§!  §CСопротивление§!  §OПартия§!  §RКефрейт§!  §gИной контролёр§!"
 VAL_focus_operations_map_unlock_tt: "Открывает категорию решений §Y«Военные операции»§! и интерактивную карту соседних регионов."

 VAL_ops_finance_cin_contacts: "Финансировать контакты в Цинь"
 VAL_ops_finance_cin_contacts_desc: "Потратить §Y25§! казны на сеть посредников и увеличить влияние в Цинь."
 VAL_ops_sell_rifles_to_cin: "Продать винтовки в Цинь"
 VAL_ops_sell_rifles_to_cin_desc: "Передать §Y2500 винтовок§!, получить §G15§! казны и усилить местные связи."
 VAL_ops_finance_osf_contacts: "Финансировать контакты в Осфарии"
 VAL_ops_finance_osf_contacts_desc: "Потратить §Y25§! казны на местных перевозчиков и посредников."
 VAL_ops_sell_rifles_to_osf: "Продать винтовки в Осфарию"
 VAL_ops_sell_rifles_to_osf_desc: "Передать §Y2500 винтовок§!, получить §G15§! казны и расширить сеть контрактов."

 VAL_campaign_rifles_and_bread: "Кампания «Винтовки и хлеб»"
 VAL_campaign_rifles_and_bread_desc: "На пятьдесят дней связать военное производство с обещанием повседневной обеспеченности. Занимает один пропагандистский слот."
 VAL_campaign_contracts_feed_families: "Кампания «Контракты кормят семьи»"
 VAL_campaign_contracts_feed_families_desc: "На шестьдесят дней представить контрактную экономику единственной гарантией занятости и порядка."
 VAL_campaign_no_promise_without_payment: "Кампания «Нет обещаний без оплаты»"
 VAL_campaign_no_promise_without_payment_desc: "На сорок пять дней превратить жёсткую деловую репутацию в политический и торговый ресурс."
 VAL_campaign_the_mine_was_stolen: "Кампания «У нас украли рудник»"
 VAL_campaign_the_mine_was_stolen_desc: "После потери Вестерхольма направить недовольство наружу и подготовить общество к борьбе за новый источник металла."

 VAL_quarterly_contract_deadline: "Срок квартального норматива"
 VAL_quarterly_contract_deadline_desc: "До конца квартала необходимо передать §Y4000 винтовок§!. Просрочка понизит контрактную репутацию на одну ступень и немедленно запустит следующий девяностодневный период."
 VAL_pay_quarterly_contract_norm: "Выполнить квартальный норматив"
 VAL_pay_quarterly_contract_norm_desc: "Списать §Y4000 винтовок§! и закрыть текущий норматив. Успешная поставка восстанавливает одну потерянную ступень репутации, но не выше максимальной."

 VAL_big_buyers: "Большие покупатели"
 VAL_big_buyers_desc: "Пока Воркерланд сохраняет единый рынок, крупные покупатели обеспечивают устойчивый поток заказов: §G+20§! к еженедельному доходу, §G+20%§! к доходу от торговли, §G+10%§! к доходу гражданской промышленности, §G+8%§! к доходу военной промышленности, §G+8%§! к инвестиционному доверию и §G+5%§! к приросту эффективности производства.\n\nЦена этой зависимости — §R+5%§! к социальным расходам, §R+5%§! к росту перегрузки государства, §R-5%§! к кредитоспособности и §R-3%§! к стабильности.\n\n    §RПри любых потрясениях у наших партнёров эта поддержка исчезнет.§!"
 VAL_westerholm_concession_income: "Вестерхольмская концессия"
 VAL_westerholm_concession_income_desc: "Кефрейт получает металл и арендный доход от разработки месторождения в Воркерланде."
 VAL_vorkerland_contract_disruptions: "Срыв воркерландских постановок"
 VAL_vorkerland_contract_disruptions_desc: "Гражданская война уничтожила платёжную дисциплину: большая часть внешних контрактных поступлений больше не доходит до Кефрейта."
 VAL_vorkerland_metal_shortage: "Дефицит воркерландского металла"
 VAL_vorkerland_metal_shortage_desc: "Потеря контроля над Вестерхольмом лишила промышленность привычного сырьевого канала."
 VAL_contract_reputation_3: "Безупречная контрактная репутация"
 VAL_contract_reputation_3_desc: "Кефрейт выполняет квартальные поставки точно в срок; покупатели и кредиторы считают его надёжным."
 VAL_contract_reputation_2: "Устойчивая контрактная репутация"
 VAL_contract_reputation_2_desc: "Недавние поставки в целом соблюдаются, но рынок больше не даёт Кефрейту прежней премии за надёжность."
 VAL_contract_reputation_1: "Подорванная контрактная репутация"
 VAL_contract_reputation_1_desc: "Повторные срывы уменьшают доходы, ухудшают кредитоспособность и повышают стоимость обслуживания долга."
 VAL_contract_reputation_0: "Контрактный дефолт"
 VAL_contract_reputation_0_desc: "Рынок больше не верит обещаниям Кефрейта. Доходы обрушились, кредит сжался, а старый долг стал тяжелее."

 VAL_Ministry_Auditors: "Инспекторы министерства"
 VAL_Ministry_Auditors_desc: "Инспекторы сверят договоры, платежи и реальные возможности исполнителей до того, как обязательство станет государственным."
 VAL_Central_Payment_Office: "Центральная платёжная палата"
 VAL_Central_Payment_Office_desc: "Расчёты по государственным заказам пройдут через единую палату, способную отличить временную задержку от системного срыва."
 VAL_Provincial_Contract_Courts: "Провинциальные контрактные суды"
 VAL_Provincial_Contract_Courts_desc: "Споры между фабрикантами, посредниками и ротами будут решаться по единому государственному порядку."
 VAL_Captains_Cannot_Veto: "Капитаны не имеют права вето"
 VAL_Captains_Cannot_Veto_desc: "Командиры сохранят голос в военных вопросах, но больше не смогут блокировать решения государства угрозой расторгнуть частный договор."
 VAL_State_Contract: "Государственный контракт"
 VAL_State_Contract_desc: "Платёжная палата, суды и подчинённые капитаны образуют устойчивую политическую систему, а не временный союз вокруг одного правителя."

 VAL_Wireless_Contract_Bureau: "Бюро контрактного вещания"
 VAL_Wireless_Contract_Bureau_desc: "Радио, листовки и фронтовые корреспонденты получат единый редакционный план и постоянное финансирование."
 VAL_Stories_From_The_Front: "Истории с передовой"
 VAL_Stories_From_The_Front_desc: "Вместо отвлечённых лозунгов бюро покажет конкретных людей, чьи семьи живут за счёт производства и службы."
 VAL_Two_Concurrent_Narratives: "Два параллельных нарратива"
 VAL_Two_Concurrent_Narratives_desc: "Разделение внутренней и внешней редакций позволит одновременно вести ещё одну пропагандистскую кампанию."

 VAL_Munitions_Board: "Боеприпасная коллегия"
 VAL_Munitions_Board_desc: "Коллегия сведёт заявки армии и экспортные обязательства в один производственный график."
 VAL_Export_Clearing_House: "Экспортная расчётная палата"
 VAL_Export_Clearing_House_desc: "Централизованный расчёт уменьшит задержки между передачей партии оружия и фактическим поступлением денег."
 VAL_Standard_Cartridges: "Единый патрон"
 VAL_Standard_Cartridges_desc: "Одинаковые патроны и упаковка сократят потери на складах и упростят снабжение контрактных рот."
 VAL_Three_Shift_Arsenals: "Арсеналы в три смены"
 VAL_Three_Shift_Arsenals_desc: "Мобилизованные мастерские перейдут на непрерывный выпуск по единому заказу."
 VAL_Reserve_Accounting: "Учёт неприкосновенного резерва"
 VAL_Reserve_Accounting_desc: "Отдельный реестр не позволит продать оружие, зарезервированное для квартальных обязательств и мобилизации."
 VAL_Industrial_Mobilization_Plan: "План промышленной мобилизации"
 VAL_Industrial_Mobilization_Plan_desc: "Арсеналы, расчётные палаты и резервные склады будут работать как единая военная промышленность."

 VAL_Company_Service_Code: "Устав контрактной службы"
 VAL_Company_Service_Code_desc: "Общие правила службы определят ответственность роты перед штабом, государством и соседними подразделениями."
 VAL_Contract_NCO_Schools: "Школы контрактных унтер-офицеров"
 VAL_Contract_NCO_Schools_desc: "Единая подготовка младших командиров позволит ротам действовать совместно, не теряя управление на марше."
 VAL_Logistics_Command: "Командование снабжения"
 VAL_Logistics_Command_desc: "Полевой ремонт, транспорт и склады подчинятся одному командованию с общей картиной запасов."
 VAL_Operational_Reserves: "Оперативные резервы"
 VAL_Operational_Reserves_desc: "Резервные батальоны получат штатное оружие и заранее определённые направления развёртывания."
 VAL_Army_Of_The_Ledger: "Армия единого реестра"
 VAL_Army_Of_The_Ledger_desc: "Контрактные роты окончательно становятся армией: с общим штабом, снабжением, резервом и системой командования."

 VAL_Foreign_Broker_Licences: "Лицензии иностранных посредников"
 VAL_Foreign_Broker_Licences_desc: "Проверенные посредники получат право заключать внешние сделки от имени Кефрейта под надзором расчётной палаты."
 VAL_Northern_Clearing_House: "Северная расчётная палата"
 VAL_Northern_Clearing_House_desc: "Отдельная палата будет обслуживать оружейные сделки и политические контакты на северном направлении."
 VAL_Contingency_Ledgers: "Резервные реестры"
 VAL_Contingency_Ledgers_desc: "На случай распада соседнего порядка государство заранее подготовит альтернативные маршруты, получателей и условия платежей."


 VAL_contract_administration_1: "Контрактная администрация I"
 VAL_contract_administration_1_desc: "Единые реестры улучшают сбор доходов и устойчивость государства."
 VAL_contract_administration_2: "Контрактная администрация II"
 VAL_contract_administration_2_desc: "Центральные расчёты и контрактные суды укрепляют налоги, торговлю и политическую управляемость."
 VAL_contract_administration_3: "Контрактная администрация III"
 VAL_contract_administration_3_desc: "Полностью собранная контрактная система повышает доходы и снижает перегрузку государственного аппарата."
 VAL_contract_industry_1: "Контрактная промышленность I"
 VAL_contract_industry_1_desc: "Проверенные заказы ускоряют рост эффективности оружейных линий."
 VAL_contract_industry_2: "Контрактная промышленность II"
 VAL_contract_industry_2_desc: "Стандартизация и учёт повышают выпуск и уменьшают потери от нехватки сырья."
 VAL_contract_industry_3: "Контрактная промышленность III"
 VAL_contract_industry_3_desc: "План мобилизации объединяет арсеналы в зрелую военную промышленность."
 VAL_contract_army_1: "Контрактная армия I"
 VAL_contract_army_1_desc: "Реестры рот создают основу общей организации и планирования."
 VAL_contract_army_2: "Контрактная армия II"
 VAL_contract_army_2_desc: "Единые офицерские требования, ремонт и снабжение повышают устойчивость войск."
 VAL_contract_army_3: "Контрактная армия III"
 VAL_contract_army_3_desc: "Общий штаб превращает отдельные роты в связанную и управляемую армию."
 VAL_contract_propaganda_office: "Бюро контрактной пропаганды"
 VAL_contract_propaganda_office_desc: "Постоянная редакция поддерживает порядок и готовность общества через связанные кампании."
 VAL_contract_propaganda_upgrade_tt: "Активирует скрытый постоянный бонус контрактного вещания."
 VAL_factory_cathedrals_drive_tt: "На §Y365 дней§!: скорость строительства военных заводов §G+10%§!. Бонус применяется скрыто."
