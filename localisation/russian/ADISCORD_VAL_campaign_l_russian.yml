l_russian:
 VAL_final_contract_preparations:0 "Подготовка окончательного взыскания"
 VAL_final_contract_preparations_desc:0 "Выбранная стратегия требует конкретных активов. Каждая операция занимает время и блокирует одновременную подготовку другого элемента."
 VAL_final_contract_war_decisions:0 "Исполнение военного контракта"
 VAL_final_contract_war_decisions_desc:0 "Решения текущей кампании превращают выбранную стратегию в практические преимущества и позволяют закрыть счёт после победы."
 VAL_prepare_contractor_depot:0 "Развернуть подрядный склад"
 VAL_prepare_contractor_depot_desc:0 "Потратить 50 единиц казны и 21 день на создание скрытого резерва снабжения. Актив будет получен только после завершения операции."
 VAL_purchase_stelander_pass_maps:0 "Приобрести карты стеландских перевалов"
 VAL_purchase_stelander_pass_maps_desc:0 "Потратить 25 единиц казны и 14 дней на проверку маршрутов, проводников и сезонных проходов."
 VAL_recruit_border_officers:0 "Перекупить пограничных офицеров"
 VAL_recruit_border_officers_desc:0 "Передать 2500 винтовок и за 21 день сформировать сеть местных военных кадров."
 VAL_test_nodrul_reaction:0 "Проверить реакцию Нодрула"
 VAL_test_nodrul_reaction_desc:0 "В течение 14 дней провести контролируемую провокацию и установить реальную готовность гаранта к вмешательству."
 VAL_mountain_contract_countdown:0 "Срок горного контракта"
 VAL_mountain_contract_countdown_desc:0 "Через 300 дней предложение защиты превращается в принудительное взыскание."
 VAL_resource_corridor_countdown:0 "Срок ресурсного коридора"
 VAL_resource_corridor_countdown_desc:0 "Через 180 дней Кефрейт начнёт ограниченную войну за маршруты и добывающие районы."
 VAL_deferred_invoice_countdown:0 "Срок отсроченного счёта"
 VAL_deferred_invoice_countdown_desc:0 "Через 300 дней отсрочка заканчивается и долг взыскивается силой."
 VAL_nodrul_war_countdown:0 "Срок северной большой войны"
 VAL_nodrul_war_countdown_desc:0 "Через 450 дней Кефрейт будет готов одновременно предъявить счёт Стеланду и его гаранту."
 VAL_buy_thirty_days:0 "Купить тридцать дней"
 VAL_buy_thirty_days_desc:0 "Потратить 50 единиц казны, чтобы один раз продлить активный срок окончательного взыскания."
 VAL_force_early_collection:0 "Начать взыскание досрочно"
 VAL_force_early_collection_desc:0 "Высокий контрактный авторитет позволяет отменить оставшуюся отсрочку и немедленно начать войну."
 VAL_install_mountain_bureaus:0 "Развернуть горные бюро"
 VAL_install_mountain_bureaus_desc:0 "Создать временную клиентскую администрацию и сеть местных посредников."
 VAL_strip_corridor_warehouses:0 "Опустошить коридорные склады"
 VAL_strip_corridor_warehouses_desc:0 "Изъять снабжение на заявленном маршруте и передать его армии."
 VAL_sell_the_future_notes:0 "Продать будущие расписки"
 VAL_sell_the_future_notes_desc:0 "Получить немедленное финансирование за счёт доверия к послевоенному взысканию."
 VAL_hire_the_northern_companies:0 "Нанять северные роты"
 VAL_hire_the_northern_companies_desc:0 "Оплатить дополнительный набор людей и оружия для широкой войны."
 VAL_close_the_stelander_account:0 "Закрыть стеландский счёт"
 VAL_close_the_stelander_account_desc:0 "Зафиксировать капитуляцию Стеланда как исполнение окончательного контракта."

 adiscord_val_campaign.1.t:0 "Первая книга открыта"
 adiscord_val_campaign.1.d:0 "На длинном столе лежат заводские ведомости, списки рот и неоплаченные расписки. Впервые они рассматриваются не как частные бумаги, а как черновик государства."
 adiscord_val_campaign.1.a:0 "Начать с тех, кто ставит подписи."
 adiscord_val_campaign.2.t:0 "Первое сведение счетов"
 adiscord_val_campaign.2.d:0 "Капитаны и фабриканты обнаружили, что их отдельные долги теперь образуют единую систему. Сольгалов больше не посредник между ними — он владелец самой книги."
 adiscord_val_campaign.2.a:0 "Пусть каждый увидит свою строку."
 adiscord_val_campaign.3.t:0 "Государственный контракт"
 adiscord_val_campaign.3.d:0 "Методы власти получили окончательную форму. Кефрейт знает, кто командует, кто платит и каким способом страна заставляет обязательство пережить человека."
 adiscord_val_campaign.3.a:0 "Контракт вступает в силу."
 adiscord_val_campaign.4.t:0 "Срок окончательного взыскания"
 adiscord_val_campaign.4.d:0 "Стратегия выбрана, подготовительные операции открыты, а дата внесена в закрытый реестр. Мир ещё продолжается, но теперь он имеет установленный срок."
 adiscord_val_campaign.4.a:0 "Оставшегося времени достаточно."
 adiscord_val_campaign.5.t:0 "Срок платежа наступил"
 adiscord_val_campaign.5.d:0 "Последняя отсрочка закончилась. Подготовленные склады открыты, карты выданы штабам, а дипломатические формулы заменены приказами."
 adiscord_val_campaign.5.a:0 "Предъявить счёт."
 adiscord_val_campaign.6.t:0 "Стеландский счёт закрыт"
 adiscord_val_campaign.6.d:0 "Архивариусы проводят последнюю черту под северной кампанией. Война стала доказательством того, что Кефрейт способен исполнить даже договор, который весь мир считал угрозой."
 adiscord_val_campaign.6.a:0 "Перенести итог в государственную книгу."

 VAL_The_Contract_State:0 "Государство исполненного слова"
 VAL_The_Contract_State_desc:0 "Кефрейт держится не на древнем праве и не на народном согласии, а на способности заставить обещание стать фактом. Первый государственный счёт определит, кто имеет право подписывать, платить и взыскивать."
 VAL_Open_The_Captains_Ledger:0 "Открыть реестр капитанов"
 VAL_Open_The_Captains_Ledger_desc:0 "Каждая рота, её командиры, долги, люди и оружие будут внесены в единую книгу. Власть начинается с понимания того, чем именно она располагает."
 VAL_Reconcile_The_State_Accounts:0 "Свести государственные счета"
 VAL_Reconcile_The_State_Accounts_desc:0 "Фабричные книги, военные кассы и посреднические обязательства должны перестать существовать в разных мирах. Государство впервые увидит собственную цену целиком."
 VAL_Paid_Loyalty:0 "Верность по ведомости"
 VAL_Paid_Loyalty_desc:0 "Капитанам не требуется любить Кефрейт — достаточно, чтобы жалованье приходило вовремя. Регулярная плата сделает порядок дороже мятежа."
 VAL_Captains_Cannot_Veto:0 "Капитаны не имеют права вето"
 VAL_Captains_Cannot_Veto_desc:0 "Роты могут спорить о доле добычи, но не о существовании государства. Их политическая автономия будет сломана до того, как она превратится в право на переворот."
 VAL_Company_Service_Code:0 "Устав государственной службы рот"
 VAL_Company_Service_Code_desc:0 "Частная верность будет ограничена публичной обязанностью. Общий служебный кодекс определит, когда приказ государства выше личного договора капитана."
 VAL_Hire_Out_War:0 "Сдавать войну в аренду"
 VAL_Hire_Out_War_desc:0 "Война остаётся главным экспортом Кефрейта. Государство сохранит рынок иностранных контрактов, но потребует свою долю с каждого знамени, пересёкшего границу."
 VAL_The_Weaponry_Baron:0 "Оружейный барон"
 VAL_The_Weaponry_Baron_desc:0 "Сольгалов больше не первый среди посредников. Реестр капитанов и сведённые счета превращают его личную сеть в каркас государства."
 VAL_State_Above_Captains:0 "Государство выше капитанов"
 VAL_State_Above_Captains_desc:0 "Регулярно оплаченные роты будут подчинены централизованной книге. Ни один капитан не должен быть достаточно богат, чтобы пережить государство."
 VAL_One_Ledger_One_Banner:0 "Одна книга, одно знамя"
 VAL_One_Ledger_One_Banner_desc:0 "Кефрейт станет федерацией вооружённых обязательств: капитаны сохранят самостоятельность, но общая книга и общее знамя определят границы их свободы."
 VAL_The_Mercenary_State:0 "Военный директорат"
 VAL_The_Mercenary_State_desc:0 "Армия перестанет обслуживать государство и станет его формой. Финансы, производство и администрация будут оцениваться по одному критерию — способности вести войну."
 VAL_Ministry_Auditors:0 "Министерство последних подписей"
 VAL_Ministry_Auditors_desc:0 "Новый режим нуждается не в ещё одном ведомстве, а в органе, способном проследить обязательство от кабинета до склада и назвать виновного, когда цепь рвётся."
 VAL_The_State_As_Creditor:0 "Государство как кредитор"
 VAL_The_State_As_Creditor_desc:0 "Центральная книга станет источником права. Любой долг перед государством будет важнее частного договора, а исполнение — важнее происхождения должника."
 VAL_The_State_As_Arbiter:0 "Государство как арбитр"
 VAL_The_State_As_Arbiter_desc:0 "Капитаны сохранят собственные сети, пока признают общий суд обязательств. Кефрейт будет силён не монополией, а незаменимостью посредника."
 VAL_The_State_As_Army:0 "Государство как армия"
 VAL_The_State_As_Army_desc:0 "Гражданская администрация будет встроена в мобилизационный аппарат. В мирное время страна готовит следующий поход; во время войны она просто раскрывает уже написанный приказ."
 VAL_State_Contract:0 "Государственный контракт"
 VAL_State_Contract_desc:0 "Политическая модель Кефрейта закреплена окончательно. Отныне власть считается законной, пока способна вести книги, оплачивать силу и взыскивать обещанное."

 VAL_Factories_Like_Cathedrals:0 "Заводы как соборы"
 VAL_Factories_Like_Cathedrals_desc:0 "В стране, где хлеба меньше, чем винтовок, арсенал становится главным общественным зданием. Производство получит статус государственной службы."
 VAL_Keep_The_Lines_Hot:0 "Не давать линиям остыть"
 VAL_Keep_The_Lines_Hot_desc:0 "Конвейер должен работать между заказами, а не только после них. Резервные партии и постоянные смены превратят промышленность в непрерывный процесс."
 VAL_Ballistics_Schools:0 "Баллистические школы"
 VAL_Ballistics_Schools_desc:0 "Кефрейт может продавать не только количество, но и точность. Школы расчёта, допуска и испытаний создадут собственную традицию оружейного качества."
 VAL_Brokered_Steel:0 "Сталь через посредников"
 VAL_Brokered_Steel_desc:0 "Недостающий металл будет найден в чужих шахтах, долгах и страхах. Сеть брокеров даст арсеналам сырьё без дорогой мечты об автаркии."
 VAL_Export_Rifles_Not_Promises:0 "Экспортировать винтовки, не обещания"
 VAL_Export_Rifles_Not_Promises_desc:0 "Внешний рынок верит Кефрейту лишь тогда, когда ящики приходят раньше оправданий. Производство и дипломатия будут связаны одним графиком поставок."
 VAL_Contract_Accounting_Office:0 "Управление контрактной отчётности"
 VAL_Contract_Accounting_Office_desc:0 "Заказы, просрочки, резервы и брак впервые окажутся в одной производственной картине. Фабрика будет отвечать не перед посредником, а перед всей цепью обязательств."
 VAL_Munitions_Board:0 "Боеприпасная коллегия"
 VAL_Munitions_Board_desc:0 "Военный приоритет будет установлен сверху. Коллегия распределит сталь и рабочие часы так, чтобы армия не зависела от настроения отдельных владельцев."
 VAL_Export_Clearing_House:0 "Экспортная расчётная палата"
 VAL_Export_Clearing_House_desc:0 "Кефрейт превратит внешние заказы в ликвидный рынок: посредники получат единый клиринг, а государство — контроль над деньгами и сроками."
 VAL_Quarterly_Contract_Norm:0 "Квартальный контрактный норматив"
 VAL_Quarterly_Contract_Norm_desc:0 "Каждые девяносто дней арсеналы обязаны подтвердить репутацию страны реальной поставкой. Выполненный норматив укрепит книгу; провал ударит по всей экономике."
 VAL_Arsenal_Reserve:0 "Арсенальный резерв"
 VAL_Arsenal_Reserve_desc:0 "Часть выпуска перестанет немедленно продаваться. Государственный запас защитит Кефрейт от момента, когда собственная война окажется важнее чужого заказа."
 VAL_Industrial_Mobilization_Plan:0 "План промышленной мобилизации"
 VAL_Industrial_Mobilization_Plan_desc:0 "Палаты, фабрики и резервы будут сведены в единый график военного развёртывания. Кефрейт сможет перейти к полной нагрузке без месяцев импровизации."
 VAL_Westerholm_Concessions:0 "Вестерхольмские концессии"
 VAL_Westerholm_Concessions_desc:0 "Пока Воркерланд ещё признаёт подписи, Кефрейт закрепит право на металл Вестерхольма. Доход велик, но зависимость станет будущим рычагом против нас."
 VAL_Vorkerland_Contracts_Burn:0 "Воркерландские контракты горят"
 VAL_Vorkerland_Contracts_Burn_desc:0 "Границы договоров исчезли вместе со старым порядком. Неисполненные подписи, потерянные шахты и сорванные маршруты должны быть признаны государственным убытком."
 VAL_Inventory_The_Empty_Yards:0 "Пересчитать пустые дворы"
 VAL_Inventory_The_Empty_Yards_desc:0 "После краха остаются вагоны, ящики, инструменты и люди без хозяина. Кефрейт соберёт всё, что ещё можно вернуть в книгу."

 VAL_Company_Rosters:0 "Реестры рот"
 VAL_Company_Rosters_desc:0 "Военная сила страны перестанет быть слухом. Полные списки людей, оружия и задолженности позволят планировать армию, а не угадывать её."
 VAL_Border_Survey_Corps:0 "Корпус пограничной разведки"
 VAL_Border_Survey_Corps_desc:0 "Перевалы, мосты и дороги станут частью мобилизационного плана. Карта будущей войны должна быть составлена до появления приказа о ней."
 VAL_Vorons_Companies:0 "Метод Ворона"
 VAL_Vorons_Companies_desc:0 "Малые роты, скрытые соглашения и работа через местных посредников позволят Кефрейту вмешиваться раньше, чем противник признает начало войны."
 VAL_Stahls_Schedules:0 "Метод Шталь"
 VAL_Stahls_Schedules_desc:0 "Армия будет побеждать расписанием. Единый ритм снабжения, ремонта и ротации сделает длительную кампанию предсказуемой для нас и невыносимой для врага."
 VAL_Gromovs_Assault_Tables:0 "Метод Громова"
 VAL_Gromovs_Assault_Tables_desc:0 "Штурм станет рассчитанной сделкой: допустимые потери, ожидаемая добыча и срок прорыва будут определены заранее."
 VAL_Morns_Supply_Trains:0 "Обозы Морн"
 VAL_Morns_Supply_Trains_desc:0 "Снабжение будет организовано как цепь взаимных обязательств, где каждый вагон и склад имеют ответственного и цену срыва."
 VAL_Field_Repair_Corps:0 "Полевой ремонтный корпус"
 VAL_Field_Repair_Corps_desc:0 "Техника должна возвращаться в строй быстрее, чем враг успевает записать её в потери. Ремонтные команды станут частью боевого порядка."
 VAL_Reserve_Battalions:0 "Резервные батальоны"
 VAL_Reserve_Battalions_desc:0 "Государственный резерв людей позволит не разрывать действующие роты ради восполнения потерь. Цена — более глубокое вмешательство в жизнь тыла."
 VAL_Logistics_Command:0 "Командование снабжения"
 VAL_Logistics_Command_desc:0 "Транспорт, склады и ремонт будут подчинены единому оперативному органу. Капитан сможет спорить о цели, но не о порядке получения патронов."
 VAL_Contract_General_Staff:0 "Контрактный генеральный штаб"
 VAL_Contract_General_Staff_desc:0 "Штаб объединит автономные роты, промышленный график и государственную книгу в один план кампании."
 VAL_Army_Of_The_Ledger:0 "Армия единого реестра"
 VAL_Army_Of_The_Ledger_desc:0 "Вооружённые силы Кефрейта окончательно становятся государственной системой: общий штаб, единое снабжение и измеримая ответственность за каждый приказ."

 VAL_The_Harvest_Of_Ash:0 "Урожай пепла"
 VAL_The_Harvest_Of_Ash_desc:0 "Военная экономика производит металл лучше, чем жизнь. Государству придётся решить, кого сохранять и кого превращать в ресурс следующего контракта."
 VAL_Field_Surgeons:0 "Полевые хирурги"
 VAL_Field_Surgeons_desc:0 "Редкие специалисты и опытные бойцы слишком дороги, чтобы терять их из-за дешёвой медицины. Сохранение кадров станет частью военной бухгалтерии."
 VAL_Bread_From_Barracks:0 "Хлеб из казарм"
 VAL_Bread_From_Barracks_desc:0 "Армейские склады и кухни возьмут на себя снабжение истощённого тыла. Общество будет жить за счёт военной логистики и всё сильнее от неё зависеть."
 VAL_Dead_Villages_Still_Count:0 "Мёртвые деревни всё ещё считаются"
 VAL_Dead_Villages_Still_Count_desc:0 "Пустая земля останется в реестре и в налоговой карте. Государство признает цену вымирания, но не позволит исчезнуть собственному праву на территорию."
 VAL_Ministry_Of_Contract_Memory:0 "Министерство контрактной памяти"
 VAL_Ministry_Of_Contract_Memory_desc:0 "Подпись должна пережить подписанта. Архивы, радио и официальные истории превратят исполненный договор в основу национальной памяти."
 VAL_Stories_From_The_Front:0 "Истории с передовой"
 VAL_Stories_From_The_Front_desc:0 "Лица капитанов, хирургов и рабочих заменят сухую статистику. Война будет рассказана как череда выполненных обязательств."
 VAL_Two_Concurrent_Narratives:0 "Два параллельных реестра"
 VAL_Two_Concurrent_Narratives_desc:0 "Внутренней аудитории покажут порядок и хлеб, внешней — надёжность и силу. Разные версии будут служить одному государственному счёту."
 VAL_The_Price_Is_Public:0 "Цена объявлена публично"
 VAL_The_Price_Is_Public_desc:0 "Кефрейт перестанет прятать связь между войной, зарплатой и выживанием. Открыто признанная цена станет сильнее лицемерного обещания мира."

 VAL_Operational_Directorate:0 "Оперативное управление"
 VAL_Operational_Directorate_desc:0 "Внешние сделки, разведывательные каналы и ограниченные вмешательства будут сведены на одной карте. Государство получит инструмент действий ниже порога войны."
 VAL_Watch_The_Old_Man:0 "Наблюдать за стариком"
 VAL_Watch_The_Old_Man_desc:0 "Пока Иванов удерживает Стеланд, Кефрейт будет считать его здоровье, окружение и способность Нодрула выполнять гарантию."
 VAL_The_Guarantee_Weakens:0 "Гарантия слабеет"
 VAL_The_Guarantee_Weakens_desc:0 "Гарантия имеет силу лишь пока гарант готов платить. Трещины в Стеланде открывают окно, в котором договор Нодрула можно превратить в нашу возможность."
 VAL_Trading_Partners:0 "Партнёры до последней подписи"
 VAL_Trading_Partners_desc:0 "Кефрейт предложит оружие, кредит и посредничество всем сторонам, сохраняя видимость нейтрального рынка."
 VAL_October_Of_2160:0 "Октябрь 2160-го"
 VAL_October_Of_2160_desc:0 "Стеландский кризис будет назван моментом, после которого старые обязательства утратили силу. Давление и тайные сделки заменят осторожную торговлю."
 VAL_The_Passes_Are_Open:0 "Перевалы открыты"
 VAL_The_Passes_Are_Open_desc:0 "Внутренняя война разрушила единую пограничную систему. Карты, проводники и местные соглашения превращают горы из стены в маршрут."
 VAL_Recognize_The_New_Ledger:0 "Признать новый реестр"
 VAL_Recognize_The_New_Ledger_desc:0 "Кефрейт признает победителя не из симпатии, а ради права первым определить действительность нового режима и его долги."
 VAL_Contingency_Ledgers:0 "Резервные реестры"
 VAL_Contingency_Ledgers_desc:0 "Для каждого исхода подготовлены отдельные договоры, маршруты и списки посредников. Теперь кризис можно перевести в конкретную стратегию."
 VAL_Offer_The_Mountain_Contract:0 "Предложить горный контракт"
 VAL_Offer_The_Mountain_Contract_desc:0 "Стеланду будет предложена защита ценой административной зависимости. Война наступит не ради аннексии, а ради исполнения навязанной подписи."
 VAL_Secure_The_Resource_Corridor:0 "Обеспечить ресурсный коридор"
 VAL_Secure_The_Resource_Corridor_desc:0 "Целью станут шахты, перевалы и склады, а не вся страна. Ограниченная формула войны должна дать Кефрейту именно то, чего не хватает его арсеналам."
 VAL_Negotiate_The_Deferred_Invoice:0 "Согласовать отсроченный счёт"
 VAL_Negotiate_The_Deferred_Invoice_desc:0 "Часть платы будет получена сейчас, но основной долг останется основанием будущей войны. Отсрочка покупает время, не отменяя взыскание."
 VAL_Let_Nodrul_Bleed:0 "Пусть Нодрул истекает кровью"
 VAL_Let_Nodrul_Bleed_desc:0 "Кефрейт заставит гаранта защищать Стеланд и готовится ударить по обоим фронтам. Это самый долгий и самый широкий вариант окончательного расчёта."
 VAL_The_Final_Clause:0 "Последний пункт договора"
 VAL_The_Final_Clause_desc:0 "Подготовка завершена, срок установлен, а выбранная стратегия переведена в обязательный график. Вопрос войны теперь состоит только в дате."

 VAL_The_Invoice_Comes_Due:0 "Срок платежа наступил"
 VAL_The_Invoice_Comes_Due_desc:0 "Отсрочка закончилась. Мирная книга закрыта, и все накопленные активы переходят в оперативный расчёт войны."
 VAL_War_Mountain_Protectorate:0 "Военный протекторат"
 VAL_War_Mountain_Protectorate_desc:0 "Военная кампания будет строиться как принуждение к зависимому договору, а не как бесформенная оккупация."
 VAL_War_Buy_The_Passes:0 "Право прохода"
 VAL_War_Buy_The_Passes_desc:0 "Местные проводники, чиновники и владельцы дорог получат свою цену. Контроль над перевалами будет куплен прежде, чем завоёван."
 VAL_War_Install_Client_Bureaus:0 "Администрация до оккупации"
 VAL_War_Install_Client_Bureaus_desc:0 "Клиентские бюро начнут распределять продовольствие, разрешения и долги ещё до окончательного падения старой власти."
 VAL_War_The_Signed_Capital:0 "Столица под подписью"
 VAL_War_The_Signed_Capital_desc:0 "Победа будет завершена актом, превращающим захваченную столицу в центр зависимого режима."
 VAL_War_Corridor_Clause:0 "Коридорная оговорка"
 VAL_War_Corridor_Clause_desc:0 "Кампания ограничивается пространством, необходимым для непрерывного движения ресурсов и войск."
 VAL_War_Seize_The_Depots:0 "Военная собственность коридора"
 VAL_War_Seize_The_Depots_desc:0 "Склады вдоль маршрута объявляются обеспечением долга и переходят под военное управление Кефрейта."
 VAL_War_Hold_The_Route:0 "Линия непрерывного снабжения"
 VAL_War_Hold_The_Route_desc:0 "Дорога важнее города. Инженеры и гарнизоны будут держать маршрут, даже если фронт уйдёт далеко вперёд."
 VAL_War_Thirty_Days_Of_Control:0 "Тридцать дней фактического права"
 VAL_War_Thirty_Days_Of_Control_desc:0 "Непрерывный контроль превращает военную претензию в новую реальность. Коридор считается нашим, пока мы способны его снабжать."
 VAL_War_Deferred_Collection:0 "Отсроченное взыскание"
 VAL_War_Deferred_Collection_desc:0 "Финансовые обязательства противника будут мобилизованы одновременно с армией. Долг станет оружием оперативного давления."
 VAL_War_Call_In_The_Notes:0 "Мобилизация обязательств"
 VAL_War_Call_In_The_Notes_desc:0 "Посредники и держатели расписок обязаны выбрать сторону. Кефрейт превратит старые бумаги в деньги, снабжение и политическое влияние."
 VAL_War_Break_The_Guarantors:0 "Лишить гарантов голоса"
 VAL_War_Break_The_Guarantors_desc:0 "Внешние обещания помощи будут объявлены соучастием в неисполнении. Кефрейт подорвёт политическую основу поддержки Стеланда."
 VAL_War_No_Invoice_Expires:0 "Счёт не имеет срока давности"
 VAL_War_No_Invoice_Expires_desc:0 "Победа закрепит принцип, на котором держится Кефрейт: обязательство не исчезает лишь потому, что должник пережил его подписанта."
 VAL_War_Two_Front_Ledger:0 "Книга двух фронтов"
 VAL_War_Two_Front_Ledger_desc:0 "Стеланд и Нодрул рассматриваются как единый военный баланс. Каждая операция на одном фронте должна менять цену другого."
 VAL_War_Bleed_The_Guarantor:0 "Изнурить гаранта"
 VAL_War_Bleed_The_Guarantor_desc:0 "Нодрул будет вынужден тратить людей и снабжение на чужую защиту, пока Кефрейт выбирает место окончательного удара."
 VAL_War_Keep_Steland_Pinned:0 "Связать Стеланд"
 VAL_War_Keep_Steland_Pinned_desc:0 "Стеландская армия должна оставаться прикованной к перевалам и не позволить Нодрулу сосредоточить силы."
 VAL_War_Close_The_Northern_Book:0 "Закрыть северную книгу"
 VAL_War_Close_The_Northern_Book_desc:0 "Два фронта сводятся к одному итогу: гарант разорён, зависимый режим сломлен, а Кефрейт определяет новую систему обязательств."
 VAL_War_The_Book_Under_Fire:0 "Книга под огнём"
 VAL_War_The_Book_Under_Fire_desc:0 "Если война приходит на нашу землю, обычные пределы договора перестают действовать. Государство готовится использовать последние активы."
 VAL_War_Open_The_Last_Reserve:0 "Открыть последний резерв"
 VAL_War_Open_The_Last_Reserve_desc:0 "Люди, предназначенные для восстановления после войны, будут отправлены на фронт. Это спасает настоящее ценой будущего."
 VAL_War_Strip_The_Arsenals:0 "Снять пломбы с арсеналов"
 VAL_War_Strip_The_Arsenals_desc:0 "Экспортные партии и страховые запасы переходят армии. Репутация Кефрейта теперь зависит лишь от выживания."
 VAL_War_Every_Contract_Ends_In_Blood:0 "Каждый контракт заканчивается кровью"
 VAL_War_Every_Contract_Ends_In_Blood_desc:0 "Чрезвычайная мобилизация стирает границу между гражданином, рабочим и солдатом. Государство исполняет последний договор — договор с самим собой."

 VAL_route_state_ledger_idea:0 "Государственная книга"
 VAL_route_state_ledger_idea_desc:0 "Центральный реестр постепенно подчиняет себе частные договоры, суды и сбор платежей."
 VAL_route_state_ledger_final_idea:0 "Монополия государственной книги"
 VAL_route_state_ledger_final_idea_desc:0 "Все значимые обязательства проходят через государственный реестр и получают силу только после его признания."
 VAL_route_captains_compact_idea:0 "Соглашение капитанов"
 VAL_route_captains_compact_idea_desc:0 "Автономные роты признают общий арбитраж, сохраняя собственные кассы, кадры и внешние связи."
 VAL_route_captains_compact_final_idea:0 "Федерация контрактных рот"
 VAL_route_captains_compact_final_idea_desc:0 "Капитаны делят власть, но единая книга, штаб и рынок связывают их интересы с существованием Кефрейта."
 VAL_route_war_directorate_idea:0 "Военный директорат"
 VAL_route_war_directorate_idea_desc:0 "Гражданские институты перестраиваются вокруг потребностей мобилизации и вооружённого экспорта."
 VAL_route_war_directorate_final_idea:0 "Государство-армия"
 VAL_route_war_directorate_final_idea_desc:0 "Промышленность, администрация и общество подчинены непрерывному военному циклу."
 VAL_war_mountain_contract_1:0 "Военный горный контракт"
 VAL_war_mountain_contract_1_desc:0 "Кампания сочетает принуждение, переговоры и подготовку зависимой администрации."
 VAL_war_mountain_contract_2:0 "Подписанный протекторат"
 VAL_war_mountain_contract_2_desc:0 "Оперативные и административные структуры уже работают как единая система будущего протектората."
 VAL_war_resource_corridor_1:0 "Операция ресурсного коридора"
 VAL_war_resource_corridor_1_desc:0 "Армия сосредоточена на маршрутах, складах и добывающих районах."
 VAL_war_resource_corridor_2:0 "Удерживаемый коридор"
 VAL_war_resource_corridor_2_desc:0 "Снабжение и производство перестроены вокруг постоянного контроля над захваченным маршрутом."
 VAL_war_deferred_invoice_1:0 "Военное взыскание долга"
 VAL_war_deferred_invoice_1_desc:0 "Финансовые обязательства используются для снабжения и политической изоляции противника."
 VAL_war_deferred_invoice_2:0 "Счёт без срока давности"
 VAL_war_deferred_invoice_2_desc:0 "Военная победа закрепляет приоритет Кефрейта как кредитора и арбитра обязательств."
 VAL_war_nodrul_ledger_1:0 "Книга двух фронтов"
 VAL_war_nodrul_ledger_1_desc:0 "Стеланд и Нодрул сведены в единый оперативный расчёт."
 VAL_war_nodrul_ledger_2:0 "Закрытая северная книга"
 VAL_war_nodrul_ledger_2_desc:0 "Армия адаптировалась к большой войне и использует взаимную зависимость двух вражеских фронтов."
 VAL_war_emergency_1:0 "Книга под огнём"
 VAL_war_emergency_1_desc:0 "Чрезвычайные меры высвобождают резервы, но разрушают внутреннюю устойчивость."
 VAL_war_emergency_2:0 "Последний государственный контракт"
 VAL_war_emergency_2_desc:0 "Все доступные люди и мощности направлены на выживание режима."
 VAL_asset_contractor_depot_idea:0 "Подрядный склад"
 VAL_asset_contractor_depot_idea_desc:0 "Заранее собранное снабжение снижает нагрузку на фронтовую логистику."
 VAL_asset_pass_maps_idea:0 "Карты перевалов"
 VAL_asset_pass_maps_idea_desc:0 "Проверенные маршруты и проводники ускоряют оперативное планирование."
 VAL_asset_border_officers_idea:0 "Пограничные офицеры"
 VAL_asset_border_officers_idea_desc:0 "Перебежчики и местные кадры помогают удерживать соединения и пополнять фронт."
 VAL_asset_nodrul_reaction_idea:0 "Проверенная реакция Нодрула"
 VAL_asset_nodrul_reaction_idea_desc:0 "Кефрейт заранее знает, какие политические и военные шаги предпримет гарант."
 VAL_war_pass_control:0 "Контроль перевалов"
 VAL_war_pass_control_desc:0 "Инженеры, гарнизоны и местные соглашения поддерживают движение через горные маршруты."

 VAL_campaign_authority_plus_5_tt:0 "§G+5§! контрактного авторитета."
 VAL_campaign_authority_plus_10_tt:0 "§G+10§! контрактного авторитета."
 VAL_campaign_authority_minus_5_tt:0 "§R-5§! контрактного авторитета."
 VAL_cost_t50:0 "§Y50 единиц казны§!"
