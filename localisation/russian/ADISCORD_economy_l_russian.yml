 ADISCORD_economy_postwar_demobilization: "Послевоенная демобилизация"
 ADISCORD_economy_postwar_demobilization_desc: "Армия, рабочая сила и государственные заказы возвращаются к мирному режиму. Гражданское строительство и восстановление получают приоритет, а военный выпуск временно сокращается. Военная усталость спадает быстрее."
 ADISCORD_economy_decrease_army_spending: "Сократить армейские расходы"
 ADISCORD_economy_increase_army_spending: "Увеличить армейские расходы"
 ADISCORD_business_center: "Деловой центр"
 ADISCORD_business_center_plural: "Деловые центры"
 ADISCORD_business_center_desc: "§YРоль: доход§!\nБазовый чистый бюджет: §G+0,90 в месяц§!. Расширяет долговую ёмкость, предел казны и помогает развитию. Даёт региону скорость строительства и дополнительные слоты; каждый следующий центр в стране строится дороже."
 ADISCORD_science_center: "Научный центр"
 ADISCORD_science_center_plural: "Научные центры"
 ADISCORD_science_center_desc: "§YРоль: исследования§!\nБазовый чистый бюджет: §R-0,42 в месяц§!. Ускоряет развитие, укрепляет управление, а сеть центров повышает скорость исследований. Даёт региону скорость строительства и дополнительные слоты; каждый следующий центр строится дороже."
 ADISCORD_industrial_cluster: "Промышленный кластер"
 ADISCORD_industrial_cluster_plural: "Промышленные кластеры"
 ADISCORD_industrial_cluster_desc: "§YРоль: местное военное производство§!\nКаждый уровень даёт §G+5% к выпуску исправных военных заводов в этом регионе§!. Текущий общегосударственный эквивалент: §G+[?ADISCORD_economy_cluster_factory_output_percent|1]%§!. Кластер без военных заводов этот бонус не создаёт.\n\nБазовый чистый бюджет: §G+0,08 в месяц§!, при доступном оружейном доходе — §G+0,16§!. Национальная сеть кластеров отдельно повышает выпуск заводов. Регион также получает скорость строительства и слоты, но его фабрики потребляют больше энергии; каждый следующий кластер строится дороже."
 ADISCORD_economy_cluster_local_factory_output: "Региональные промышленные кластеры"
 ADISCORD_economy_cluster_local_factory_output_desc: "Взвешенный эквивалент бонуса исправных военных заводов, расположенных в собственных подконтрольных регионах с промышленными кластерами."

