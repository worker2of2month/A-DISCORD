 ADISCORD_economy_auto_loan_popup_title: "ДЕФИЦИТ ПОКРЫТ АВТОЗАЙМОМ"
 ADISCORD_economy_auto_loan_popup_desc: "Казны не хватило для недельного расчёта. Государство автоматически заняло [?ADISCORD_economy_auto_loan_popup_amount|1] — ровно непокрытую часть дефицита.\n\n§RПоследствия уже применены:§! долг вырос, каждые 100 займа добавили 1 п.п. инфляции, а проценты вошли в будущие расходы.\n\nДолг: [?ADISCORD_economy_debt|0]  |  Инфляция: [?ADISCORD_economy_inflation|1]%\nПроценты: [?ADISCORD_economy_weekly_interest|2] в неделю ([?ADISCORD_economy_interest_share_income|1]% недельного дохода)\nДавление: [?ADISCORD_economy_debt_pressure|0]/100\n\nЧтобы не брать новый долг, верните недельный баланс в плюс или держите запас казны."
