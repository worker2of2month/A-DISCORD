 ADISCORD_economy_dashboard_player_summary: "§YПОЛОЖЕНИЕ§!\nЭкономика: [GetADISCORDEconomyModelLoc]\nСостояние: [GetADISCORDEconomyCycleLoc]\nРазвитие: уровень [?ADISCORD_economic_development_level|0]/5\nИнфляция: [?ADISCORD_economy_inflation|0]%\nПерегрузка: [?ADISCORD_economy_stretched_level|0]/4"
 ADISCORD_economy_dashboard_player_advice: "§YЧТО ВАЖНО СЕЙЧАС§!\n[GetADISCORDEconomyAdviceLoc]"
 ADISCORD_economy_dashboard_automation_note: "§LДоходы, расходы, обслуживание долга и автозайм считаются автоматически раз в месяц. Тяжёлый пересчёт регионов выполняется отдельно и не нагружает месячный тик. Подробности доступны в подсказках верхних показателей.§!"
 ADISCORD_economy_emergency_title: "РЕДКИЕ АНТИКРИЗИСНЫЕ МЕРЫ"
 ADISCORD_economy_emergency_hint: "§LНеактивная кнопка означает, что мера сейчас не нужна или её условия не выполнены.§!"

 ADISCORD_economy_debt_operations_title: "ДОЛГ И РЕЗЕРВЫ"
 ADISCORD_economy_debt_operations_status: "Долг: [?ADISCORD_economy_debt|0]/[?ADISCORD_economy_debt_capacity|0] ([?ADISCORD_economy_debt_ratio|0]%)\nСтавка: [?ADISCORD_economy_interest_rate|1]%\nОбслуживание: [?ADISCORD_economy_debt_service|R1]\nКредитоспособность: [?ADISCORD_economy_creditworthiness|0]\nАвтозайм: [GetADISCORDAutoLoanLoc]"
 ADISCORD_economy_debt_operations_hint: "§YПринцип§!\nВнутренние облигации дешевле внешнего займа. Реструктуризация снимает часть долга ценой доверия. Досрочное погашение требует развитого управления резервами и расходует до §Y100§! казны."
 ADISCORD_economy_monetary_operations_title: "ДЕНЬГИ И СТАБИЛИЗАЦИЯ"
 ADISCORD_economy_monetary_operations_status: "Эмиссия: [GetADISCORDEmissionLevelLoc]\nИнфляция: [?ADISCORD_economy_inflation|0]\nЦеновой шок: [?ADISCORD_economy_price_shock|0]\nДефицитное давление: [?ADISCORD_economy_deficit_pressure|0]\nФискальный стресс: [?ADISCORD_economy_fiscal_stress|0]"
 ADISCORD_economy_monetary_operations_hint: "§YПринцип§!\nЭмиссия даёт ликвидность немедленно, но ухудшает будущую стабильность. Стабилизационный пакет дорог, зато одновременно снижает инфляцию, ценовой шок, стресс и перегрузку."
 ADISCORD_economy_investment_operations_title: "ИНВЕСТИЦИИ И МОБИЛИЗАЦИЯ"
 ADISCORD_economy_investment_operations_status: "Государственный капитал: [?ADISCORD_economy_public_investment_stock|0]/10\nДеловые центры: [?ADISCORD_business_center_count|0]\nНаучные центры: [?ADISCORD_science_center_count|0]\nПромышленные кластеры: [?ADISCORD_industrial_cluster_count|0]\nПрогресс развития: [?ADISCORD_economic_development_progress|0]"
 ADISCORD_economy_investment_operations_hint: "§YПринцип§!\nГосударственный капитал даёт постоянный эффект. Гражданская и военная программы создают сильный 30-дневный импульс. Военные налоги быстро пополняют казну, но усиливают усталость и перегрузку."

 ADISCORD_economy_treasury_tt: "§YГосударственная казна§! — свободный бюджетный резерв страны. Казна используется для инвестиций, военных расходов, обслуживания долга и антикризисных мер.\n\nОбычные доходы и расходы исполняются раз в неделю. Разовые действия изменяют казну сразу и попадают в бухгалтерию следующей недели."
 ADISCORD_economy_stretched_tt: "§YПерегрузка государства§! отражает давление войны, дефицита, долга, инфляции, мобилизации и потерь на способность режима управлять экономикой. Чем выше перегрузка, тем слабее развитие и тем выше риск кризисных мер."
 ADISCORD_economy_development_multiplier_tt: "§YМультипликатор экономического развития§! умножает базовый органический прирост и добавочный рост от контента. Профицит, инвестиции, научные центры и эффективные институты ускоряют развитие; долг, инфляция, война и перегрузка его замедляют."
 ADISCORD_economy_model_tt: "§YМодель экономики§! задаётся отдельным законом экономической системы и связывает показатели HOI IV с казной A-DISCORD. Она определяет финансовые инструменты, специализацию зданий, инвестиций и мобилизационных мер.\n\nСильные стороны: [GetADISCORDEconomyModelUnlocksLoc]\nОграничения: [GetADISCORDEconomyModelPenaltiesLoc]"
 ADISCORD_economy_modifier_factors_tt: "§YМодификаторы экономики§!\nНалоговая эффективность: [?ADISCORD_economy_final_tax_collection_factor_bp|0]%\nДоход от торговли: [?ADISCORD_economy_final_trade_income_factor_bp|0]%\nГражданская промышленность: [?ADISCORD_economy_final_civilian_factory_income_factor_bp|0]%\nРасходы армии: [?ADISCORD_economy_final_army_expense_factor_bp|0]%\nСтроительные расходы: [?ADISCORD_economy_final_construction_expense_factor_bp|0]%\nДолговая ёмкость: [?ADISCORD_economy_final_debt_capacity_factor_bp|0]%\nОбслуживание долга: [?ADISCORD_economy_final_debt_service_factor_bp|0]%\nПроцентная ставка: [?ADISCORD_economy_final_interest_rate_factor_bp|0]%\nКредитоспособность: [?ADISCORD_economy_final_creditworthiness_factor_bp|0]%\nИнфляционное давление: [?ADISCORD_economy_final_inflation_pressure_factor_bp|0]%\nЭффективность эмиссии: [?ADISCORD_economy_final_money_printing_efficiency_factor_bp|0]%\nЦеновая стабильность: [?ADISCORD_economy_final_price_stability_factor_bp|0]%\nФискальный стресс: [?ADISCORD_economy_final_fiscal_stress_gain_factor_bp|0]% / [?ADISCORD_economy_final_fiscal_stress_resistance_factor_bp|0]%\nРост экономического развития: [?ADISCORD_country_development_final_economic_growth_factor_bp|0]%\n\n§LСтатические бонусы задаются фокусами, событиями и идеями через scripted economy API. Политические бонусы пересчитываются из действующих законов.§!"
 ADISCORD_economy_macro_tt: "§YМакроиндикаторы§! — это быстрый индикатор устойчивости, а не отдельная мини-игра. Дефицит сначала тратит казну. Если казны не хватает, автозайм покрывает только непокрытую часть в пределах долговой ёмкости. При отключённом автозайме или исчерпанной ёмкости растут дефицитное давление, фискальный стресс и перегрузка.\n\nДолг также появляется через явные действия игрока: облигации и внешний заём. В планово-бюрократической экономике рыночный цикл заменён плановым контуром: видимая инфляция слабее, но проблемы уходят в дефицит, очереди и перегрузку аппарата."
 ADISCORD_economy_last_month_accounting_tt: "§YБухгалтерия последней недели§!\nПроверочная формула:\nказна после = казна до + недельный баланс + разовые доходы - действия - здания + заёмное финансирование - погашение долга - списание сверх лимита.\n\n§YНеобъяснённая разница§! показывает настоящее расхождение между формулой и фактической казной после тика. Обычно она равна нулю."
 ADISCORD_economy_tax_burden_tt: "§YНалоговая нагрузка§! задаёт, насколько жёстко государство извлекает деньги из существующей налоговой системы. Низкая нагрузка оставляет больше пространства деловой активности, высокая быстрее наполняет казну, но усиливает перегрузку и тормозит развитие."
 ADISCORD_economy_army_spending_tt: "§YВоенный бюджет§! регулирует финансирование армии. Сокращения экономят казну, но бьют по готовности. Экстренный приоритет резко повышает расходы и может усилить военную усталость."
 ADISCORD_economy_construction_spending_tt: "§YСтроительное финансирование§! регулирует темп государственных строек и программ развития. Ускорение стоит дороже, но поддерживает экономическое развитие."

