 ADISCORD_economy_action_internal_bonds_tt: "§YВыпустить внутренние облигации§!\n§G+100§! к казне, §R+115§! к долгу. Мягко снижает дефицитное давление, но повышает фискальный стресс.\n\n§YТребование:§! технология долговых инструментов, управляемая долговая политика, долговая нагрузка ниже предела и отсутствие недавнего займа."
 ADISCORD_economy_action_external_loan_tt: "§YВзять внешний заём§!\n§G+150§! к казне, §R+190§! к долгу. Требует кредитоспособность §Y35§! и отсутствие тяжёлого долгового кризиса.\n\n§YТребование:§! технология долговых инструментов, кредитоспособность §Y35§!, управляемая долговая нагрузка и отсутствие недавнего займа."
 ADISCORD_economy_action_repay_debt_tt: "§YПогасить часть долга§!\nДо §R-50§! казны и столько же долга. Снижает фискальный стресс и перегрузку. Премия займа уже включена в сумму созданного долга, поэтому погашение всегда производится один к одному.\n\nТребуется казна §Y50§! и любой долг."
 ADISCORD_economy_action_early_repay_debt_tt: "§YДосрочно погасить крупную часть долга§!\nРасходует до §R100§! казны и один к одному уменьшает долг. Дополнительно снижает фискальный стресс и дефицитное давление.\n\n§YТребование:§! управление резервами, казна и долг не ниже §Y100§!."
 ADISCORD_economy_action_restructure_debt_tt: "§YРеструктурировать долг§!\nСписывает около §G15%§! текущего долга, но повышает фискальный стресс, перегрузку и штраф реструктуризации.\n\n§YТребование:§! развитая фискальная администрация, долг не ниже §Y100§!, высокий долговой кризис или долговая нагрузка."
 ADISCORD_economy_action_toggle_auto_loan_tt: "§YАвтозайм§!\nТекущий режим: [GetADISCORDAutoLoanLoc].\n\nЕсли включён, месячный дефицит после исчерпания казны автоматически покрывается займом только на непокрытую часть и только в пределах долговой ёмкости. Если выключен, непокрытый дефицит повышает фискальный стресс."
 ADISCORD_economy_action_expand_emission_tt: "§YРасширить эмиссию§!\nДаёт до §G35§! ликвидности немедленно и повышает уровень эмиссии, ценовой шок и будущую инфляцию. Развернуть эмиссию обратно можно только в следующем месяце.\n\n§YТребование:§! нет критической перегрузки, недавней эмиссии и чрезмерного фискального стресса."
 ADISCORD_economy_action_reduce_emission_tt: "§YСвернуть эмиссию§!\nСнижает уровень эмиссии, инфляцию и ценовой шок, но немного повышает краткосрочный фискальный стресс.\n\n§YТребование:§! активная эмиссия; предыдущий эмиссионный импульс длительностью 30 дней должен завершиться."
 ADISCORD_economy_action_stabilization_tt: "§YСтабилизационный пакет§!\n§R-100§! казны. Снижает инфляцию, фискальный стресс, дефицитное давление, ценовой шок и перегрузку.\n\n§YТребование:§! казна §Y100§! и заметное макроэкономическое давление."
 ADISCORD_economy_action_invest_reserves_tt: "§YСоздать производительный государственный капитал§!\n§R-50§! казны. Даёт прогресс развития и §G+1§! к запасу общественных инвестиций (максимум 10). Каждая единица постоянно повышает доход, предел резервов и темп развития, но требует содержания и разрушается при дефолте, перегрузке и тяжёлых бомбардировках.\n\n§YТребование:§! управление резервами, казна §Y50§!, нет недавних инвестиций и экономическая модель допускает инвестиционные программы."
 ADISCORD_economy_action_civilian_investment_tt: "§YГражданские инвестиции§!\n§R-50§! казны. Даёт на 30 дней гражданский инвестиционный дух и прогресс экономического развития.\n\n§YТребование:§! управление резервами, казна §Y50§!, нет недавних инвестиций и экономическая модель допускает инвестиционные программы."
 ADISCORD_economy_action_military_investment_tt: "§YВоенные инвестиции§!\n§R-50§! казны. Даёт прогресс армейского развития и военный инвестиционный дух на 30 дней, но повышает перегрузку.\n\n§YТребование:§! стандартизация вооружений, казна §Y50§!, нет недавнего военного финансирования и модель допускает мобилизационную экономику."
 ADISCORD_economy_action_war_taxes_tt: "§YВвести военные налоги§!\nДаёт от §G40§! до §G65§! казны в зависимости от модели экономики и создаёт 30-дневный мобилизационный эффект. Повышает перегрузку государства и военную усталость.\n\n§YТребование:§! модель экономики допускает чрезвычайное изъятие; военные налоги ещё не действуют."

 ADISCORD_economy_advice_critical: "§RСистемная угроза.§! Требуется немедленная стабилизация, сокращение чрезвычайных расходов и восстановление казны."
 ADISCORD_economy_advice_debt: "§RДолговая нагрузка опасна.§! Остановите новые заимствования и направляйте профицит на погашение."
 ADISCORD_economy_advice_inflation: "§OЦены выходят из-под контроля.§! Сверните эмиссию и подготовьте стабилизационный пакет."
 ADISCORD_economy_advice_deficit: "§YБюджет дефицитен.§! Повышайте налоги или снижайте расходы постепенно — новая политика фиксируется на расчётный период."
 ADISCORD_economy_advice_war: "§YВоенное напряжение растёт.§! Следите за военной усталостью и не держите чрезвычайный бюджет без необходимости."
 ADISCORD_economy_advice_growth: "§GЭкономика располагает резервом для роста.§! Можно расширять государственный капитал или снижать налоговую нагрузку."
 ADISCORD_economy_advice_balanced: "§GПоложение управляемо.§! Сохраняйте резерв казны и избегайте резких изменений сразу по нескольким направлениям."

