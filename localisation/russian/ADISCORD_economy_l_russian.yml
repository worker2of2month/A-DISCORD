 ADISCORD_economy_topbar_treasury_tooltip: "§YЭКОНОМИКА И КАЗНА§!\nСейчас: [?ADISCORD_economy_treasury|0] из [?ADISCORD_economy_treasury_cap|0]\nРекомендуемый запас: [?ADISCORD_economy_safe_reserve|Y0] (ориентир на 4 недели)\nЗа неделю приходит: [?ADISCORD_economy_weekly_income|G1]\nЗа неделю уходит: [?ADISCORD_economy_weekly_expenses|R1]\nИзменение казны: [?ADISCORD_economy_weekly_balance|=+1]\n\n§YКак это работает§!\nРаз в неделю баланс прибавляется к казне. §GПлюс§! создаёт резерв, §Rминус§! расходует его. Если денег не хватит, система автоматически займёт ровно недостающую сумму: вырастут долг, проценты и инфляция. Деньги выше предела казны теряются.\n\nДолг: [?ADISCORD_economy_debt|0] ([?ADISCORD_economy_debt_income_ratio|0]% годового дохода)\nПроценты за неделю: [?ADISCORD_economy_weekly_interest|2] ([?ADISCORD_economy_interest_share_income|1]% недельного дохода)\nДавление долга: [?ADISCORD_economy_debt_pressure|0]/100\nПоследний автозайм: [?ADISCORD_economy_last_auto_borrowing|Y1]\n\n§GЩёлкните, чтобы открыть управление экономикой.§!"
 ADISCORD_economy_budget_breakdown_tt: "§YОТКУДА БЕРЁТСЯ БАЛАНС§!\nНедельный доход: [?ADISCORD_economy_weekly_income|G1]\nНедельные расходы: [?ADISCORD_economy_weekly_expenses|R1]\n§YИтог за неделю:§! [?ADISCORD_economy_weekly_balance|=+1]\n\n§YДоходы — месячная база§!\nРесурсная рента: [?ADISCORD_economy_resource_income|G1]\nБизнес и торговля: [?ADISCORD_economy_business_income|G1]\nНалоги с населения: [?ADISCORD_economy_personal_income|G1]\nГражданская промышленность: [?ADISCORD_economy_consumer_goods_income|G1]\nВоенная промышленность: [?ADISCORD_economy_factory_income|G1]\nЭкономические здания: [?ADISCORD_economy_building_income|G1]\n\n§YРасходы — месячная база§!\nАрмия: [?ADISCORD_economy_army_expenses|R1]  Авиация: [?ADISCORD_economy_airforce_expenses|R1]  Флот: [?ADISCORD_economy_navy_expenses|R1]\nВоенная промышленность: [?ADISCORD_economy_military_factory_expenses|R1]\nСоциальный бюджет: [?ADISCORD_economy_social_expenses|R1]\nНаука: [?ADISCORD_economy_research_expenses|R1]\nСтроительство: [?ADISCORD_economy_construction_expenses|R1]\nУправление: [?ADISCORD_economy_admin_expenses|R1]\nРемонт: [?ADISCORD_economy_repair_expenses|R1]\nПроценты по долгу: [?ADISCORD_economy_debt_service|R1]\n\nМесячная база переводится в неделю по правилу §Y3/13§!. Меняйте только налоги и нужные бюджеты: остальное считается автоматически."
 ADISCORD_economy_balance_tt: "§YНЕДЕЛЬНЫЙ БАЛАНС§!\nДоход: [?ADISCORD_economy_weekly_income|G1]\nРасход: [?ADISCORD_economy_weekly_expenses|R1]\nИтог: [?ADISCORD_economy_weekly_balance|=+1]"
 ADISCORD_economy_balance_delayed_tt: "§YОТКУДА БЕРЁТСЯ БАЛАНС§!\nКазна: [?ADISCORD_economy_treasury|0]\nНедельный доход: [?ADISCORD_economy_weekly_income|G1]\nНедельные расходы: [?ADISCORD_economy_weekly_expenses|R1]\n§YИтог за неделю:§! [?ADISCORD_economy_weekly_balance|=+1]\nРекомендуемый запас: [?ADISCORD_economy_safe_reserve|Y0]\nЗапас при дефиците: [?ADISCORD_economy_deficit_runway|Y1] нед. (260 означает не меньше пяти лет).\n\n§YДоходы — месячная база§!\nРесурсная рента: [?ADISCORD_economy_resource_income|G1]\nБизнес и торговля: [?ADISCORD_economy_business_income|G1]\nНалоги с населения: [?ADISCORD_economy_personal_income|G1]\nГражданская промышленность: [?ADISCORD_economy_consumer_goods_income|G1]\nВоенная промышленность: [?ADISCORD_economy_factory_income|G1]\nЭкономические здания: [?ADISCORD_economy_building_income|G1]\n\n§YРасходы — месячная база§!\nАрмия: [?ADISCORD_economy_army_expenses|R1]  Авиация: [?ADISCORD_economy_airforce_expenses|R1]  Флот: [?ADISCORD_economy_navy_expenses|R1]\nВоенная промышленность: [?ADISCORD_economy_military_factory_expenses|R1]\nСоциальный бюджет: [?ADISCORD_economy_social_expenses|R1]\nНаука: [?ADISCORD_economy_research_expenses|R1]\nСтроительство: [?ADISCORD_economy_construction_expenses|R1]\nУправление: [?ADISCORD_economy_admin_expenses|R1]\nРемонт: [?ADISCORD_economy_repair_expenses|R1]\nПроценты по долгу: [?ADISCORD_economy_debt_service|R1]\n\nМесячная база переводится в неделю по точному правилу §Y3/13§!."
