 ADISCORD_economy_dashboard_tick_hint: "§LПрогноз обновляется при открытии окна и смене курса. Казна исполняется автоматически раз в неделю; решения ИИ и макропоказатели обновляются раз в месяц.§!"
 ADISCORD_economy_dashboard_advice_block: "§YОценка правительства§!\n[GetADISCORDEconomyAdviceLoc]"
 ADISCORD_economy_dashboard_policy_help: "§YКак управлять бюджетом§!\nУровни §Y1–5§! означают переход от минимального финансирования к чрезвычайному. Выбранная политика применяется минимум один полный расчётный период.\n\nАктивная ступень затемнена. Все остальные ступени блокируются до следующего экономического тика."
 ADISCORD_economy_budget_controls_title: "БЮДЖЕТНАЯ ПОЛИТИКА"
 ADISCORD_economy_budget_controls_tt: "§YПрямое управление бюджетом§!\nЧетыре регулятора меняются на одну ступень и фиксируются на три месячных расчёта. Экономика сама считает доходы и расходы; игрок выбирает только приоритеты."
 ADISCORD_economy_budget_tax_row: "§YНалоги:§! [GetADISCORDTaxBurdenModeLoc]"
 ADISCORD_economy_budget_army_row: "§YАрмия:§! [GetADISCORDArmySpendingModeLoc]"
 ADISCORD_economy_budget_construction_row: "§YСтроительство:§! [GetADISCORDConstructionSpendingModeLoc]"
 ADISCORD_economy_budget_social_row: "§YСоцбюджет:§! [GetADISCORDSocialSpendingModeLoc]"
 ADISCORD_economy_tax_controls_tt: "Налоги меняют доход казны и давление на население. Ступень можно менять раз в три месячных расчёта."
 ADISCORD_economy_army_controls_tt: "Военный бюджет меняет содержание армии и её готовность. Ступень можно менять раз в три месячных расчёта."
 ADISCORD_economy_construction_controls_tt: "Строительный бюджет меняет стоимость программы и скорость строительства. Ступень можно менять раз в три месячных расчёта."
 ADISCORD_economy_social_controls_tt: "Социальный бюджет масштабирует социальные расходы. Экономия снижает стабильность, расширенное финансирование её поддерживает."
 ADISCORD_economy_tax_decrease_tt: "Снизить налоговую нагрузку на одну ступень."
 ADISCORD_economy_tax_increase_tt: "Повысить налоговую нагрузку на одну ступень."
 ADISCORD_economy_army_decrease_tt: "Снизить военный бюджет на одну ступень."
