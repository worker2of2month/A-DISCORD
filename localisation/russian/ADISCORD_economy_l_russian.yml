 ADISCORD_economy_budget_controls_tt: "§YЧТО ЗДЕСЬ РЕШАЕТ ИГРОК§!\n§YНалоги§! меняют доход казны. §YАрмия§!, §Yнаука§! и §Yсоциальная поддержка§! обменивают деньги на игровые бонусы.\n\nСтрелка меняет курс на одну ступень. После изменения этот регулятор заблокирован на три месячных расчёта, поэтому не нужно возвращаться сюда каждую неделю."
 ADISCORD_economy_budget_tax_row: "§YНалоги:§! [GetADISCORDTaxBurdenModeLoc]"
 ADISCORD_economy_budget_army_row: "§YАрмия:§! [GetADISCORDArmySpendingModeLoc]"
 ADISCORD_economy_budget_research_row: "§YНаука:§! [GetADISCORDResearchSpendingModeLoc]"
 ADISCORD_economy_budget_social_row: "§YСоцбюджет:§! [GetADISCORDSocialSpendingModeLoc]"
 ADISCORD_economy_tax_controls_tt: "§YНАЛОГИ — деньги сейчас или рост потом§!\nТекущий уровень: [?ADISCORD_economy_tax_burden_mode|0]/5 — [GetADISCORDTaxBurdenModeLoc]\n\n[GetADISCORDTaxBurdenEffectsLoc]\n\nВысокие налоги улучшают баланс, но тормозят развитие и перегружают государство. Низкие делают обратное. До следующего изменения: [?ADISCORD_economy_tax_change_cooldown|0] мес."
 ADISCORD_economy_army_controls_tt: "§YВОЕННЫЙ БЮДЖЕТ — экономия или боеготовность§!\nТекущий уровень: [?ADISCORD_economy_army_spending_mode|0]/5 — [GetADISCORDArmySpendingModeLoc]\n\n[GetADISCORDArmySpendingEffectsLoc]\n\nСнижайте в мирное время ради баланса; повышайте перед тяжёлой войной. До следующего изменения: [?ADISCORD_economy_army_budget_change_cooldown|0] мес."
 ADISCORD_economy_research_controls_tt: "§YФИНАНСИРОВАНИЕ НАУКИ — расходы и темп исследований§!\nТекущий уровень: [?ADISCORD_economy_research_spending_mode|0]/5 — [GetADISCORDResearchSpendingModeLoc]\n\n[GetADISCORDResearchSpendingEffectsLoc]\n\nРасходы на науку по уровням 1–5: §G-40%§! / §G-20%§! / §Y0%§! / §R+30%§! / §R+60%§!.\nСкорость исследований: §R-8%§! / §R-3%§! / §Y0%§! / §G+3%§! / §G+5%§!. Только уровень 5 дополнительно даёт скорость строительства §G+2%§!.\n\nДо следующего изменения: [?ADISCORD_economy_research_budget_change_cooldown|0] мес."
 ADISCORD_economy_social_controls_tt: "§YСОЦИАЛЬНЫЙ БЮДЖЕТ — экономия или внутренняя устойчивость§!\nТекущий уровень: [?ADISCORD_economy_social_spending_mode|0]/5 — [GetADISCORDSocialSpendingModeLoc]\n\n[GetADISCORDSocialSpendingEffectsLoc]\n\nСокращение помогает бюджету, но бьёт по стабильности. Расширение покупает устойчивость ценой постоянных расходов. До следующего изменения: [?ADISCORD_economy_social_budget_change_cooldown|0] мес."
 ADISCORD_economy_tax_level_1_tt: "§YНалоги — уровень 1/5§!\n§GМинимальная налоговая нагрузка§!\n\n§WЭффект:§!\nДоходы населения §R-35%§!, бизнеса §R-15%§!, промышленности §R-10%§!; развитие §G+5 п.п.§!, нагрузка страны §G-3§!, ценовой шок §G-0,25/мес.§!"
