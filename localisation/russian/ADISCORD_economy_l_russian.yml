 ADISCORD_economy_treasury_tt: "§YКАЗНА§!\nСейчас: [?ADISCORD_economy_treasury|0] из [?ADISCORD_economy_treasury_cap|0]. Рекомендуемый запас: §Y[?ADISCORD_economy_safe_reserve|0]§! — примерно четыре недели текущих расходов. Это не обязательный лимит, а простой ориентир.\n\n§YКаждую неделю§! казна меняется на [?ADISCORD_economy_weekly_balance|=+1]. При нуле непокрытый дефицит автоматически превращается в долг, пока остаётся долговая ёмкость. Всё выше предела §Y[?ADISCORD_economy_treasury_cap|0]§! списывается, поэтому полный резерв лучше тратить на полезные меры."
 ADISCORD_economy_income_tt: "§YНЕДЕЛЬНЫЙ ДОХОД§!\nВсего: [?ADISCORD_economy_weekly_income|G1]. Казна получает эту сумму автоматически раз в неделю.\n\n§YМесячная база§!\nНаселение: [?ADISCORD_economy_personal_income|G1]\nБизнес и торговля: [?ADISCORD_economy_business_income|G1]\nГражданская промышленность: [?ADISCORD_economy_consumer_goods_income|G1]\nВоенная промышленность: [?ADISCORD_economy_factory_income|G1]\nРесурсная рента: [?ADISCORD_economy_resource_income|G1]\nЭкономические здания: [?ADISCORD_economy_building_income|G1]\n\nМесячная база переводится в недельную по правилу §Y3/13§!."
 ADISCORD_economy_expenses_tt: "§YНЕДЕЛЬНЫЕ РАСХОДЫ§!\nВсего: [?ADISCORD_economy_weekly_expenses|R1]. Казна оплачивает эту сумму автоматически раз в неделю.\n\n§YМесячная база§!\nВооружённые силы: армия [?ADISCORD_economy_army_expenses|R1], авиация [?ADISCORD_economy_airforce_expenses|R1], флот [?ADISCORD_economy_navy_expenses|R1]\nВоенная промышленность: [?ADISCORD_economy_military_factory_expenses|R1]\nСтроительство: [?ADISCORD_economy_construction_expenses|R1]\nСоциальная поддержка: [?ADISCORD_economy_social_expenses|R1]\nНаука: [?ADISCORD_economy_research_expenses|R1]\nУправление и ремонт: [?ADISCORD_economy_admin_expenses|R1] / [?ADISCORD_economy_repair_expenses|R1]\nПроценты по долгу: [?ADISCORD_economy_debt_service|R1]\n\nМесячная база переводится в недельную по правилу §Y3/13§!."
 ADISCORD_economy_summary_tt: "§YКАК ЧИТАТЬ ОКНО§!\n§YМодель§! — постоянный закон хозяйства. §YСостояние§! — короткий вывод: рост, равновесие, спад или кризис. §YРазвитие§! — долгосрочная сила экономики.\n\n§YНагрузка государства§! и §Yвоенная усталость§! — разные показатели. Нагрузка объединяет финансовые, административные и военные проблемы. Военная усталость показывает, насколько общество истощено войной. Наведите на каждую строку риска: там указаны причины, пороги и действующие штрафы."
 ADISCORD_economy_stretched_tt: "§YНАГРУЗКА СТРАНЫ — общий штраф за накопленные проблемы§!\nСейчас: [?ADISCORD_economy_stretched_score|0]/100, уровень [?ADISCORD_economy_stretched_level|0]/4. Это не деньги и не отдельный ресурс. Штраф усиливается только на порогах §Y20/40/60/80§!.\n\n§YТекущий штраф§!\n[GetADISCORDStateLoadEffectsLoc]\n\n§YЧто создаёт нагрузку сейчас§!\nДолг: [?ADISCORD_economy_debt_pressure|0]\nВоенная усталость: ур. [?ADISCORD_economy_war_fatigue_level|0]/4\nПотери населения: [?ADISCORD_economy_demographic_fatigue_score|0]/100\nЛюди вне гражданской экономики: ур. [?ADISCORD_economy_workforce_drain_level|0]/4\nФискальный стресс: [?ADISCORD_economy_fiscal_stress|0]/100\nДлительный дефицит: [?ADISCORD_economy_deficit_pressure|0]/100\nБомбардировки: ур. [?ADISCORD_economy_bombing_disruption_level|0]/4\nЧрезвычайные меры: [?ADISCORD_economy_action_overload_residue|0]\n\n§YКак снижать§!\nВерните недельный баланс в плюс, накопите казну и остановите рост долга с инфляцией. После войны автоматическая демобилизация снижает военный бюджет и мобилизационные законы."
 ADISCORD_economy_war_fatigue_tt: "§YВОЕННАЯ УСТАЛОСТЬ — истощение общества войной§!\nСейчас: [?ADISCORD_economy_war_fatigue_score|0]/100, уровень [?ADISCORD_economy_war_fatigue_level|0]/4. Потери за последний месяц: [?ADISCORD_economy_monthly_casualties_delta_k|0] тыс.\nДемобилизация: [GetADISCORDDemobilizationStatusLoc]\n\n§YЧто меняет показатель раз в месяц§!\nВойна даёт §R+2§!, чрезвычайный военный бюджет — ещё §R+2§!, тяжёлые потери — до §R+4§!. Мир снимает §G1§!, а послевоенная демобилизация — ещё §G4§!. Недавние потери могут замедлить восстановление в первый мирный месяц.\n\nУровни меняются на §Y15/30/50/75§!. Прямые штрафы начинаются со второго уровня; каждый уровень также добавляет §R8 пунктов§! к нагрузке страны.\n\n§YТекущий прямой штраф§!\n[GetADISCORDWarFatigueEffectsLoc]\n\n§YКак снижать§!\nЗакончите войну, не держите чрезвычайный военный бюджет без нужды и избегайте тяжёлых потерь."
 ADISCORD_economy_modifier_factors_tt: "§YПОСТОЯННЫЕ ОСОБЕННОСТИ СТРАНЫ§!\n§L100% — обычное значение. Выше 100% усиливает показатель; для расходов и инфляционного давления это обычно хуже.§!\n\nСбор налогов: [?ADISCORD_economy_final_tax_collection_factor_bp|0]%\nДоход торговли: [?ADISCORD_economy_final_trade_income_factor_bp|0]%\nДоход гражданской промышленности: [?ADISCORD_economy_final_civilian_factory_income_factor_bp|0]%\nРасходы армии: [?ADISCORD_economy_final_army_expense_factor_bp|0]%\nРасходы строительства: [?ADISCORD_economy_final_construction_expense_factor_bp|0]%\nДолговая ёмкость: [?ADISCORD_economy_final_debt_capacity_factor_bp|0]%\nСтоимость обслуживания долга: [?ADISCORD_economy_final_debt_service_factor_bp|0]%\nПроцентная ставка: [?ADISCORD_economy_final_interest_rate_factor_bp|0]%\nКредитоспособность: [?ADISCORD_economy_final_creditworthiness_factor_bp|0]%\nИнфляционное давление: [?ADISCORD_economy_final_inflation_pressure_factor_bp|0]%\nЦеновая стабильность: [?ADISCORD_economy_final_price_stability_factor_bp|0]%\nРост развития: [?ADISCORD_country_development_final_economic_growth_factor_bp|0]%\n\nЭти особенности приходят из законов, фокусов, идей и событий. Управлять ими каждую неделю не требуется."
 ADISCORD_economy_debt_tt: "§YДОЛГ — взятые страной деньги§!\nСумма: [?ADISCORD_economy_debt|0]\nБезопасная ёмкость: [?ADISCORD_economy_debt_capacity|0]\nНагрузка: [?ADISCORD_economy_debt_ratio|0]%\nСтавка: [?ADISCORD_economy_interest_rate|1]%\nПроценты в месячной базе: [?ADISCORD_economy_debt_service|2]\n\n§YКак читать§!\nЁмкость зависит от дохода, развития и финансовых зданий. Чем ближе нагрузка к 100%, тем хуже кредитоспособность и дороже новый долг. Проценты входят в недельные расходы в размере §Y3/13§! месячной базы.\n\nЕдиные ступени долга: §Y40/70/100/140%§! — предупреждение, бремя, кризис и дефолт. Очень высокий фискальный стресс или инфляция могут поднять оценку риска ещё на одну ступень.\n\n§YСейчас действует§!\n[GetADISCORDDebtEffectsLoc]"
 ADISCORD_economy_inflation_tt: "§YИНФЛЯЦИЯ — постоянный рост цен§!\nСейчас: [?ADISCORD_economy_inflation|1]%\nИзменение за последний месячный расчёт: [?ADISCORD_economy_inflation_delta_temp|=+2] п.п.\n\n§YОткуда берётся§!\nЕё повышают эмиссия, дефицитное давление, ценовые шоки, долговой кризис и война. Полный выпуск облигаций даёт §R+1 п.п.§!, внешний заём — §R+1,5 п.п.§!, автозайм — §R+1 п.п. за каждые 100§!.\n\n§YКак снижать§!\nВ рыночной экономике инфляция сама не исчезает от одного профицита. Стабилизация за 100 казны снимает §G8 п.п.§!, сокращение эмиссии — §G2 п.п.§!. Плановая экономика вместо роста цен получает дефицит товаров и нагрузку страны.\n\nШтрафы растут на §Y10/25/50/75%§!. Сейчас действует:\n[GetADISCORDInflationEffectsLoc]"
 ADISCORD_economy_debt_effect_none: "§GНиже 40%: отдельного штрафа нет.§! Проценты уже входят в расходы."
 ADISCORD_economy_debt_effect_warning: "§Y40–69%:§! прирост политвласти §R-0,02§! в день."
 ADISCORD_economy_debt_effect_burden: "§O70–99%:§! прирост политвласти §R-0,05§! в день, скорость исследований §R-1%§!."
 ADISCORD_economy_debt_effect_crisis: "§R100–139%:§! прирост политвласти §R-0,10§! в день, исследования §R-3%§!, строительство §R-4%§!, стабильность §R-3%§!."
 ADISCORD_economy_debt_effect_default: "§R140% и выше:§! прирост политвласти §R-0,18§! в день, исследования §R-7%§!, строительство §R-8%§!, выпуск заводов §R-5%§!, стабильность §R-8%§!."
 ADISCORD_economy_inflation_effect_none: "§GНиже 10%: отдельного штрафа нет.§!"
 ADISCORD_economy_inflation_effect_rising: "§Y10–24%:§! товары народного потребления §R+1%§!, строительство §R-1%§!."
 ADISCORD_economy_inflation_effect_high: "§O25–49%:§! товары народного потребления §R+4%§!, стабильность §R-3%§!, строительство §R-3%§!."
 ADISCORD_economy_inflation_effect_severe: "§R50–74%:§! товары народного потребления §R+8%§!, стабильность §R-6%§!, строительство §R-7%§!, выпуск заводов §R-3%§!."
 ADISCORD_economy_inflation_effect_hyper: "§R75% и выше:§! товары народного потребления §R+15%§!, стабильность §R-10%§!, строительство §R-12%§!, выпуск заводов §R-6%§!, исследования §R-5%§!."
 ADISCORD_economy_state_load_effect_0: "§GУровень 0: отдельных штрафов нет.§!"
 ADISCORD_economy_state_load_effect_1: "§YУровень 1:§! стабильность §R-1%§!, строительство §R-1%§!."
 ADISCORD_economy_state_load_effect_2: "§OУровень 2:§! стабильность §R-2%§!, поддержка войны §R-1%§!, строительство §R-3%§!, выпуск заводов §R-1%§!."
 ADISCORD_economy_state_load_effect_3: "§RУровень 3:§! стабильность §R-4%§!, поддержка войны §R-3%§!, строительство §R-5%§!, выпуск заводов §R-3%§!."
 ADISCORD_economy_state_load_effect_4: "§RУровень 4:§! стабильность §R-8%§!, поддержка войны §R-6%§!, политвласть §R-0,10§!/день, строительство §R-10%§!, выпуск заводов §R-6%§!, прирост населения §R-2%§!."
 ADISCORD_economy_war_fatigue_effect_0: "§GУровни 0–1: игровых штрафов нет.§! Первый уровень только предупреждает."
 ADISCORD_economy_war_fatigue_effect_2: "§OУровень 2:§! стабильность §R-2%§!, поддержка войны §R-3%§!, выпуск заводов §R-1%§!."
 ADISCORD_economy_war_fatigue_effect_3: "§RУровень 3:§! стабильность §R-5%§!, поддержка войны §R-7%§!, выпуск заводов §R-3%§!, восстановление армии §R-3%§!."
 ADISCORD_economy_war_fatigue_effect_4: "§RУровень 4:§! стабильность §R-8%§!, поддержка войны §R-12%§!, выпуск заводов §R-6%§!, восстановление армии §R-7%§!."
 ADISCORD_economy_demobilization_status_inactive: "§Lне проводится§!"
 ADISCORD_economy_demobilization_status_active: "§Gидёт§!, осталось [?ADISCORD_economy_postwar_demobilization_months|0] мес.\n§GМирный эффект:§! стабильность +2%, гражданское строительство +10%, расходы армии -10%, рост развития +5%; давление инфляции и нагрузка страны -10%.\n§RЦена перехода:§! выпуск заводов -8%, строительство военных заводов -15% и верфей -10%, поддержка войны -5%."
 ADISCORD_economy.2.t: "Началась послевоенная демобилизация"
 ADISCORD_economy.2.d: "Война закончилась, и страна автоматически возвращается к мирному режиму. Это не требует отдельного управления.\n\n§GЧто уже сделано§!\n• чрезвычайный военный бюджет снижен до штатного;\n• тотальная или военная экономика переведена на частичную мобилизацию;\n• чрезмерный призыв снижен до ограниченного.\n\n§YСледующие шесть месяцев§! люди и заказы будут возвращаться в гражданскую экономику. Базовое снижение военной усталости составит §G5 пунктов в месяц§! вместо 1, хотя недавние потери могут ослабить восстановление в первый месяц. Мирное строительство ускорится, но выпуск вооружений и поддержка войны временно снизятся. Точные эффекты показаны в подсказке военной усталости. Новая война немедленно остановит демобилизацию."
 ADISCORD_economy.2.a: "Вернуть страну к мирной жизни."
 ADISCORD_economy_auto_loan_popup_title: "ДЕФИЦИТ ПОКРЫТ АВТОЗАЙМОМ"
 ADISCORD_economy_auto_loan_popup_desc: "Казны не хватило для недельного расчёта. Государство автоматически заняло §Y[?ADISCORD_economy_auto_loan_popup_amount|1]§! — только непокрытую часть дефицита.\n\n§RПоследствия уже применены:§! долг вырос, каждые 100 займа добавили 1 п.п. инфляции, а проценты вошли в будущие расходы.\n\nДолг: §Y[?ADISCORD_economy_debt|0]§! ([?ADISCORD_economy_debt_ratio|0]%)  |  Инфляция: §Y[?ADISCORD_economy_inflation|1]%§!\nСтавка: §Y[?ADISCORD_economy_interest_rate|1]%§!\n\nЧтобы не брать новый долг, верните недельный баланс в плюс или держите запас казны."
 ADISCORD_economy_auto_loan_popup_ok: "ПОНЯТНО"
 ADISCORD_economy_button_internal_bonds: "Внутренние облигации"
 ADISCORD_economy_button_external_loan: "Внешний заём"
 ADISCORD_economy_button_repay_debt: "Погасить долг (50)"
 ADISCORD_economy_button_restructure_debt: "Реструктурировать"
 ADISCORD_economy_button_stabilization: "Стабилизация"
 ADISCORD_economy_button_war_taxes: "Военные налоги"

 ADISCORD_economy_action_internal_bonds_tt: "§YВыпустить внутренние облигации§!\n§GСразу:§! до +100 к казне.\n§RЦена:§! до +115 к долгу и +1,0 п.п. инфляции. Проценты списываются через недельные расходы, пока долг не погашен.\n\n§YСейчас§!\nКазна: [?ADISCORD_economy_treasury|0]/[?ADISCORD_economy_treasury_cap|0]\nДолг: [?ADISCORD_economy_debt|0]/[?ADISCORD_economy_debt_capacity|0] ([?ADISCORD_economy_debt_ratio|0]%)\nСтавка: [?ADISCORD_economy_interest_rate|1]%  Обслуживание: [?ADISCORD_economy_debt_service|2]\nШтрафы долга: §Y40/70/100/140%§!.\n\n§YДоступность сейчас§!\n[GetADISCORDInternalBondsAvailabilityLoc]\n\n§YВсе требования:§! нагрузка ниже §Y100%§!, место в казне и долговой ёмкости, в этом месяце ещё не брали заём."
 ADISCORD_economy_action_external_loan_tt: "§YВзять внешний заём§!\n§GСразу:§! до +150 к казне.\n§RЦена:§! до +190 к долгу и +1,5 п.п. инфляции, а также ценовой шок, фискальный стресс и нагрузка страны. Проценты списываются через недельные расходы, пока долг не погашен.\n\n§YСейчас§!\nКазна: [?ADISCORD_economy_treasury|0]/[?ADISCORD_economy_treasury_cap|0]\nДолг: [?ADISCORD_economy_debt|0]/[?ADISCORD_economy_debt_capacity|0] ([?ADISCORD_economy_debt_ratio|0]%)\nСтавка: [?ADISCORD_economy_interest_rate|1]%  Обслуживание: [?ADISCORD_economy_debt_service|2]\nКредитоспособность: [?ADISCORD_economy_creditworthiness|0]/35\nШтрафы долга: §Y40/70/100/140%§!.\n\n§YДоступность сейчас§!\n[GetADISCORDExternalLoanAvailabilityLoc]\n\n§YВсе требования:§! кредитоспособность не ниже §Y35§!, нагрузка ниже §Y100%§!, место в казне и долговой ёмкости, в этом месяце ещё не брали заём и нет тяжёлого долгового кризиса."
 ADISCORD_economy_loan_blocked_model: "§RНедоступно:§! раздробленное хозяйство не умеет обслуживать организованный долг."
 ADISCORD_economy_loan_blocked_ratio: "§RНедоступно:§! долговая нагрузка уже достигла 100% безопасной ёмкости. Сначала погасите или реструктурируйте долг."
 ADISCORD_economy_loan_blocked_cooldown: "§RНедоступно:§! в текущем месяце заём уже брали. Новый можно оформить после следующего месячного расчёта."
 ADISCORD_economy_loan_blocked_treasury_room: "§RНедоступно:§! в казне свободно меньше 50. Сначала потратьте часть резерва — заём не должен пропадать сверх её предела."
 ADISCORD_economy_loan_blocked_debt_room: "§RНедоступно:§! в долговой ёмкости не осталось места даже для минимального выпуска облигаций."
 ADISCORD_economy_loan_blocked_creditworthiness: "§RНедоступно:§! кредитоспособность ниже 35. Её снижают высокая долговая нагрузка, инфляция и фискальный стресс."
 ADISCORD_economy_loan_blocked_default: "§RНедоступно:§! страна находится в фактическом дефолте; внешние кредиторы больше не дают денег."
 ADISCORD_economy_loan_blocked_external_room: "§RНедоступно:§! долговой ёмкости недостаточно даже для минимального внешнего займа."
 ADISCORD_economy_loan_available_internal: "§GДоступно:§! внутренние облигации можно выпустить сейчас."
 ADISCORD_economy_loan_available_external: "§GДоступно:§! внешний заём можно взять сейчас."
 ADISCORD_economy_action_repay_debt_tt: "§YПогасить часть долга§!\nДо §R-50§! казны и столько же долга. Снижает фискальный стресс и нагрузку страны. Премия займа уже включена в сумму созданного долга, поэтому погашение всегда производится один к одному.\n\nТребуется казна §Y50§! и любой долг."
 ADISCORD_economy_action_restructure_debt_tt: "§YРеструктурировать долг§!\nСписывает около §G15%§! текущего долга, но повышает фискальный стресс, нагрузку страны и штраф реструктуризации.\n\n§YТребование:§! развитая фискальная администрация, долг не ниже §Y100§!, долговая нагрузка не ниже §Y80%§! или уже наступивший долговой кризис."
 ADISCORD_economy_action_stabilization_tt: "§YСтабилизационный пакет§!\n§R-100§! казны. Снижает инфляцию, фискальный стресс, дефицитное давление, ценовой шок и нагрузку страны.\n\n§YТребование:§! казна §Y100§! и заметное макроэкономическое давление."
 ADISCORD_economy_action_war_taxes_tt: "§YВвести военные налоги§!\nДаёт от §G40§! до §G65§! казны в зависимости от модели экономики и создаёт 30-дневный мобилизационный эффект. Повышает нагрузку страны и военную усталость.\n\n§YТребование:§! модель экономики допускает чрезвычайное изъятие; военные налоги ещё не действуют."

 ADISCORD_economy_advice_critical: "§RСистемная угроза.§! Требуется немедленная стабилизация, сокращение чрезвычайных расходов и восстановление казны."
 ADISCORD_economy_advice_debt: "§RДолговая нагрузка опасна.§! Остановите новые заимствования и направляйте профицит на погашение."
 ADISCORD_economy_advice_inflation: "§OЦены выходят из-под контроля.§! Не берите новые займы и накопите 100 казны на стабилизационный пакет."
 ADISCORD_economy_advice_deficit: "§YБюджет дефицитен.§! Повышайте налоги или снижайте расходы постепенно — новая политика фиксируется на расчётный период."
 ADISCORD_economy_advice_war: "§YВоенное напряжение растёт.§! Следите за военной усталостью и не держите чрезвычайный бюджет без необходимости."
 ADISCORD_economy_advice_growth: "§GЭкономика располагает резервом для роста.§! Стройте деловые, научные или промышленные объекты либо осторожно снижайте налоги."
 ADISCORD_economy_advice_balanced: "§GПоложение управляемо.§! Сохраняйте резерв казны и избегайте резких изменений сразу по нескольким направлениям."

