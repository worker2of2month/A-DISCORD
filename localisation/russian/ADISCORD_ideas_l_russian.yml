l_russian:
 #NOD
 NOD_hedonism_with_no_bondaries: "Политика гедонизма без границ"
 NOD_hedonism_with_no_bondaries_desc: "Государство перестало притворяться воспитателем и стало продавцом удовольствий. Границы открыты для капитала, пороков и туристов, а мораль заменена прайс-листом.\n\nПока витрины сияют, система учится одному: держать людей сытыми, занятыми и слегка одурманенными. Это работает - до тех пор, пока праздник не кончается и счет не приносят всем сразу."
 #VAL
 VAL_mercenary_state: "Государство наёмников"
 VAL_mercenary_state_desc: "Здесь верность измеряется не клятвой, а ставкой. Государство перестроило себя под контракт: быстрый набор, жесткая дисциплина, холодная эффективность.\n\nИдеология проста: кто платит - тот и прав. Но чем больше страна зарабатывает на войне, тем меньше она помнит, ради чего вообще стоит жить."
 VAL_worldwide_famous_weponry: "Всемирно известные оружейные фабрики"
 VAL_worldwide_famous_weponry_desc: "Заводы здесь - как соборы: шумные, горячие, священные. На конвейере рождается сталь, которая через месяц будет говорить вместо дипломатии.\n\nРепутация безупречна: точность, надежность, масштаб. Цена тоже безупречна - ее всегда платят чужой кровью."
 VAL_harvest_of_ash: "Урожай пепла"
 VAL_harvest_of_ash_desc: "Земля здесь проклята. Она больше не рождает жизнь, только колючую проволоку и сухие ветви, тянущиеся к небу, как костлявые руки мертвецов. Крестьяне собирают урожай из неразорвавшихся снарядов и костей предков. Здесь голод - не гость, а постоянный хозяин, и даже солнце на закате кажется болезненно-кровавым.\n\n £GFX_VAL_harvest_of_ash_banner \n\n"
 #WRK
 WRK_ashes_of_the_crown: "Пепел короны"
 WRK_ashes_of_the_crown_desc: "Старый порядок сгорел не красиво, а буднично - в бумагах, приказах и страхе. Корона стала пеплом, а вместе с ней - привычная система лояльностей.\n\nНам достались руины символов и толпа, которая помнит величие, но не помнит, как за него платить. Вакуум власти пахнет гарью: кто первым вдохнет - тот и начнет диктовать новую эпоху."
 WRK_hourglass_of_discord: "Песочные часы раздора"
 WRK_hourglass_of_discord_desc: "Песок в часах почти иссяк. Каждый удар маятника приближает нас к неизбежному финалу. Старые институты рушатся, экономика в агонии, а на улицах шепчутся о скором конце света. Мы не строим планы на пятилетки, мы пытаемся пережить следующий день. Это гонка со смертью, и смерть пока выигрывает. \n\n Слышишь этот звук? Это не биение сердца, это тиканье механизма, отсчитывающего последние минуты нашей эпохи. Песок в часах почти иссяк, и он раскален докрасна. Мы работаем не ради будущего - будущего нет. Мы работаем, чтобы пережить этот вечер. Каждая секунда промедления оплачивается сотнями жизней."
 WRK_constitution_of_the_republic: "Конституция республики"
 WRK_constitution_of_the_republic_desc: "Новая конституция - это попытка превратить хаос в процедуру. Прописать правила там, где вчера решали силой, и выдать стране хотя бы одну общую линию на карте смыслов.\n\nДокумент выглядит как спасение, но бумага не удерживает трещины сама по себе. Если республика не научится подчиняться собственным статьям, конституция станет не фундаментом, а надгробной плитой надежд."
 WRK_birthplace_of_the_first_revolution: "Родина Первой революции"
 WRK_birthplace_of_the_first_revolution_desc: "Воркерландская монархия не пережила Первую революцию. Императорский двор был разогнан, коронная администрация распущена, а новая республика объявила свержение престола своим учредительным актом. Для режима это не просто страница истории: право управлять страной выводится из победы над монархией.\n\nНо вместе с троном революционеры сломали и единую вертикаль. Армейские штабы спорят с партийными комитетами, округа удерживают чрезвычайные полномочия, а очищенные ведомства заполнены преданными, но неопытными кадрами. Любой компромисс легко объявить реставрацией, поэтому государство тратит силы не на восстановление, а на бесконечную охоту за контрреволюцией.\n\n§RЭтот национальный дух исчезнет, если власть перейдёт к идеологии, не связанной с воркеризмом.§!"
 WRK_birthplace_of_the_first_revolution_front_republic: "Фронтовая республика Первой революции"
 WRK_birthplace_of_the_first_revolution_front_republic_desc: "Съезд фронтовых советов заставил партийные комитеты, штабы и местные администрации признать общий порядок мобилизации. Республика всё ещё живёт чрезвычайными полномочиями, но теперь они распределены между учреждениями, способными отвечать за снабжение и пополнение частей."
 WRK_birthplace_of_the_first_revolution_renewed_mandate: "Обновлённый мандат Первой революции"
 WRK_birthplace_of_the_first_revolution_renewed_mandate_desc: "Фронтовая хартия превратила память о свержении престола из оправдания вечной чистки в конкретное соглашение: советы дают людей и налоги, центр гарантирует представительство и пределы чрезвычайной власти. Военная республика остаётся жёсткой, но её учреждения впервые усиливают друг друга."
#NOD
 NOD_home_of_hedonist_revolution: "Родина гедонистической революции"
 NOD_home_of_hedonist_revolution_desc: "Это место больше не страна - это манифест, упакованный в неон и дорогие ткани.\n\nЗдесь революцию не объявляли на площадях - её продали в виде образа жизни. Свобода стала товаром, удовольствие - гражданской обязанностью, а идеология - рекламным слоганом. Любой, кто сомневается, объявляется не врагом, а просто «скучным».\n\nСнаружи всё выглядит как триумф: вечеринки, витрины, туризм, деньги, льющиеся без остановки. Внутри же система держится на циничной сделке: государство гарантирует праздник, а народ не задаёт вопросов - ни о цене, ни о тех, кто исчезает за кулисами.\n\nИ пока играет музыка, партия улыбается миру. Но у каждой улыбки есть мышца, которая устаёт. Когда же свет погаснет, выяснится, что у революции удовольствия есть одна вечная проблема: она не умеет умирать тихо."

 #COUNTRY UNIQUE IDEAS
 RUS_national_spirit: "Вольница Руснии"
 RUS_national_spirit_desc: "Русния держится не на приказе, а на привычке спорить с любым приказом. Местные общины вооружены, упрямы и редко спрашивают столицу, можно ли им выжить.\n\nЭта вольница плохо собирает налоги и ещё хуже терпит начальство. Зато когда чужой сапог входит на их землю, вчерашние спорщики быстро вспоминают, что свобода иногда говорит залпами."
 VLA_national_spirit: "Восточная окружная администрация"
 VLA_national_spirit_desc: "Восточный военный округ пытается пережить конец старого мира через штабы, склады и временные комиссии. Окружные администраторы обещают порядок без лишнего пафоса: починить дороги, удержать арсеналы, договориться с теми, кто ещё готов слушать.\n\nНо власть, выросшая из чрезвычайного режима, редко выглядит законной. Каждый новый приказ держится на вопросе, который никто не произносит вслух: это уже государство или только военная канцелярия на руинах Воркерланда?"
 NAM_national_spirit: "Система наместников"
 NAM_national_spirit_desc: "Наместникленд построен как лестница, на каждой ступени которой стоит человек с печатью и правом сказать «нет». Центр видит всё через отчёты, ведомства и верных представителей.\n\nТакой порядок даёт дисциплину и собирает ресурсы, но платит за это тяжёлой ценой. Любая мысль должна пройти через канцелярию, а любая ошибка становится государственной тайной."
 DAN_national_spirit: "Коммунальная дисциплина"
 DAN_national_spirit_desc: "Данияленд не просит граждан верить в государство - он требует работать вместе с ним. Коммуны, дружины и заводские комитеты сведены в один суровый ритм, где личное мнение заканчивается у ворот цеха. Для многих это ещё и попытка удержать память о другом континенте, откуда пришла Экспедиционная группа #42 и где остались её первые приказы.\n\nЭта дисциплина делает страну стойкой и готовой к войне. Но чем ровнее марширует общество, тем громче слышно, как под строем хрустит усталость."
 PIV_national_spirit: "Праздник солода"
 PIV_national_spirit_desc: "Афрела превратила ремесло, торговлю и застолье в государственную философию. Здесь умеют продавать радость, мириться после спора и строить экономику вокруг кружки, которая всегда наполовину полна.\n\nПока музыка играет, страна стабильна и довольна. Проблема начинается тогда, когда праздник просят заменить мобилизацией, а тост - приказом."
 IVN_national_spirit: "Гуманистический щит"
 IVN_national_spirit_desc: "Итора верит, что государство должно защищать человека раньше, чем границу на карте. Эта вера выросла не в пустоте: память о нашем Воркерланде, его гарантиях, страхах и распаде до сих пор заставляет местных политиков выбирать осторожность вместо красивой авантюры.\n\nТакая вера даёт обществу внутренний стержень. Но щит тяжёл: его несут налогоплательщики, врачи, учителя и солдаты, которым приходится доказывать, что милосердие не равно слабость."
 APH_national_spirit: "Красная трапеза"
 APH_national_spirit_desc: "Антропофагорум живёт по закону добычи. Победа здесь не метафора, а пир, где страх противника становится частью военной машины, а поражение своих быстро превращается в урок для остальных.\n\nТакая культура рождает яростных бойцов и дешёвую храбрость. Но страна, привыкшая питаться врагами, плохо понимает труд, науку и саму идею будущего без крови."
 WIT_national_spirit: "Город быстрых соглашений"
 WIT_national_spirit_desc: "Римат выжил не потому, что был сильнее соседей, а потому, что быстрее считал цену конфликта. Торговые дома, префекты и цеховые посредники привыкли тушить кризисы сделками ещё до того, как те становятся приказами.\n\nЭтот порядок делает страну гибкой, образованной и сравнительно дешёвой в управлении. Но общество, привыкшее договариваться, тяжело переносит момент, когда вместо подписи требуется штык."
 # BEGIN GENERATED: tools.builders.build_adiscord_ainholm_mandate
 AIN_concession_economy: "Концессионная экономика"
 AIN_concession_economy_desc: "Промышленность, добыча и основные дороги Айнхольма переданы компаниям, связанным с Нодрульской республикой. В обмен колониальная администрация получает инвестиции и доступ к рынкам, однако значительная часть доходов и ресурсов уходит метрополии."
 # END GENERATED: tools.builders.build_adiscord_ainholm_mandate
 # BEGIN CONSOLIDATED: ADISCORD_inner_frontier_countries_l_russian
 BOR_itoran_relief_charter: "Иторская хартия помощи"
 BOR_itoran_relief_charter_desc: "Итора оплачивает часть дорог, больниц и складов Бореи. Помощь делает границу устойчивой, но связывает республиканский бюджет обязательствами перед иностранным покровителем."
 RIN_two_oaths: "Две несовместимые присяги"
 RIN_two_oaths_desc: "Северные дома клянутся Монтере, южные живут по воркерландским хартиям. Против внешнего давления они выступают вместе, но любое мирное решение нарушает одну из двух присяг."
 RIN_palace_guard: "Палатинская гвардия"
 RIN_palace_guard_desc: "Хорошо оплачиваемые полки охраняют двор, узлы связи и главные дороги. Их выучка высока, а содержание съедает средства, которых не хватает обычным гарнизонам."
 RIN_southern_charter_mobilization: "Ополчение южных хартий"
 RIN_southern_charter_mobilization_desc: "Города юга открыли арсеналы старых торговых домов и поставили дружины под единое командование. Хартии дают им общую цель, но не заменяют устойчивого государства."
 RIN_northern_crown_columns: "Колонны северной короны"
 RIN_northern_crown_columns_desc: "Северные дома свели дворянские дружины и палатинские части в походные колонны. Монтера снабжает их оружием, не превращая локальную войну в общий союзный фронт."
 RIN_charter_compact: "Хартия южных городов"
 RIN_charter_compact_desc: "Пережив раскол, города закрепили старые торговые хартии как основу общего права. Палатин сохраняет престол, но больше не может обещать одну страну двум внешним покровителям."
 RIN_crown_palatin: "Коронный палатинат"
 RIN_crown_palatin_desc: "Северная присяга стала государственным порядком. Двор получает оружие и защиту Монтеры, расплачиваясь зависимостью и обязанностью охранять имперские дороги."
 KRM_slag_road_compact: "Договор шлаковых дорог"
 KRM_slag_road_compact_desc: "Отвалы превращают в дорожное полотно, а каждая шахта обязана содержать участок пути до общего сортировочного узла. Лига получает сырьё и надёжную логистику, но население живёт среди пыли и тяжёлого транспорта."
 LMN_permanent_quarantine: "Вечный карантин"
 LMN_permanent_quarantine_desc: "Оборонительные линии, фильтрационные пункты и закрытые склады делают кордон трудной целью. Те же ограничения мешают свободному труду, переселению и нормальной мобилизации населения."
 RLY_closed_circuit: "Замкнутый контур"
 RLY_closed_circuit_desc: "Релейн окружён зоной отчуждения и вынужден повторно использовать воду, детали и тепло. Республика удивительно самодостаточна, но не способна быстро заменить потерянное оборудование или пережить открытие внешнего фронта."
 WCG_living_filter: "Живой фильтр"
 WCG_living_filter_desc: "Каждая дорога превращена в фильтрационный лагерь, каждый склад — в карантинный резерв, а каждый житель обязан одновременно работать и обслуживать кордон. Половину гражданской промышленности и большую часть военных заказов забирает Воркерланд. Оставшаяся экономика задыхается под пропусками, реквизициями и постоянной дозовой ротацией."
 # END CONSOLIDATED: ADISCORD_inner_frontier_countries_l_russian
 # BEGIN CONSOLIDATED: ADISCORD_northern_countries_l_russian
 BRN_polar_signal_line: "Полярная сигнальная линия"
 BRN_polar_signal_line_desc: "Радиомачты и промежуточные склады позволяют снабжать северные округа, однако вся система зависит от нескольких дорог и дисциплины местных гарнизонов."
 KHV_geothermal_colleges: "Коллегии глубинного тепла"
 KHV_geothermal_colleges_desc: "Инженерные школы связаны с шахтами и тепловыми станциями. Исследования быстро доходят до производства, хотя содержание сложной сети дорого обходится населению."
 ELN_census_engines: "Машины государственного счёта"
 ELN_census_engines_desc: "Сеть счётных станций ускоряет исследования и распределение заказов, но постоянные проверки и исправления вызывают раздражение даже у лояльных специалистов."
 HON_civic_compact: "Гражданский договор провинций"
 HON_civic_compact_desc: "Налоги, дороги и мобилизационные обязанности закреплены открытым договором. Провинции сохраняют голос, а центр получает предсказуемые средства для общей политики."
 SKN_reserve_districts: "Округа постоянного резерва"
 SKN_reserve_districts_desc: "Каждая администрация ведёт учёт людей, транспорта и складов. Мобилизация проходит быстро, но содержание системы постоянно отнимает часть мирного производства."
 LYS_bonded_warehouses: "Сеть залоговых складов"
 LYS_bonded_warehouses_desc: "Товар можно оставить под залог, перепродать в пути и быстро направить на нужную фабрику. Система ускоряет оборот, но усиливает власть владельцев складов."
 VES_border_charters: "Хартии пограничных дорог"
 VES_border_charters_desc: "Община получает землю и материалы в обмен на содержание участка дороги, склада и укреплённой позиции."
 MON_throne_of_fifteen_crowns: "Престол пятнадцати корон"
 MON_throne_of_fifteen_crowns_desc: "Побеждённые династии сохранили титулы, но присягнули Аркенам. Пышный двор укрепляет законность империи и одновременно поглощает огромные средства."
 MON_imperial_general_staff: "Имперский генеральный штаб"
 MON_imperial_general_staff_desc: "Единые карты, расписания и программы подготовки позволяют быстро разворачивать крупную армию на любом направлении."
 MON_arsenal_belt: "Арсенальный пояс Монтеры"
 MON_arsenal_belt_desc: "Южные города соединены военными заказами, железными дорогами и стандартизированными мастерскими. Производительность высока, но гражданская экономика вынуждена уступать армии."
 MON_hierarchy_of_peoples: "Имперская лестница народов"
 MON_hierarchy_of_peoples_desc: "Пропаганда обещает каждому сословию место в общем наступлении, но распределяет права и обязанности по происхождению. Система даёт много солдат и всё чаще рождает скрытое недовольство."
 # END CONSOLIDATED: ADISCORD_northern_countries_l_russian
 # BEGIN CONSOLIDATED: ADISCORD_southern_desert_l_russian
 KDR_law_of_a_thousand_miles: "Закон Солнечной дороги"
 KDR_law_of_a_thousand_miles_desc: "Каждая станция на великом тракте обязана снабжать караваны престола, содержать дозор и признавать верховную власть Кадира."
 RHM_cistern_parliament: "Хартия общего колодца"
 RHM_cistern_parliament_desc: "Вода Рахмы признана общим достоянием. Города совместно содержат цистерны и выбирают представителей для распределения запасов."
 SDR_dry_river_patrols: "Цепь дозоров сухого русла"
 SDR_dry_river_patrols_desc: "Небольшие заставы передают друг другу вести, сопровождают обозы и закрывают опасные переходы без громоздкого центрального аппарата."
 MZR_common_water_charter: "Хартия общего водного пайка"
 MZR_common_water_charter_desc: "Колодцы и водосборы считаются общественным ресурсом. Пайки меняются вместе с запасами, но единые правила защищают окраины от произвола местных владельцев."
 KYZ_free_qanat_compact: "Договор свободных кяризов"
 KYZ_free_qanat_compact_desc: "Каждая община обслуживает свой участок подземного канала, а крупные ремонты проводятся совместно по взаимной клятве, а не по приказу центральной власти."
 SHL_nine_furnaces_compact: "Пакт девяти печей"
 SHL_nine_furnaces_compact_desc: "Девять промышленных домов согласуют закупки, экспорт и цены на энергию, сохраняя прибыль и власть внутри замкнутого круга."
 GLP_prismatic_trade_code: "Портовый кодекс"
 GLP_prismatic_trade_code_desc: "Единые правила регулируют портовые сборы, страхование грузов и работу прибрежных мастерских."
 AZH_black_basin_levy: "Мобилизация Чёрного бассейна"
 AZH_black_basin_levy_desc: "Окружные администрации ведут общий воинский учёт, содержат резервные части и подчиняют снабжение центральному командованию."
 WEF_frontier_municipalism: "Программа общего результата"
 WEF_frontier_municipalism_desc: "Муниципалитеты сохраняют самостоятельность, но получают материалы только за проекты с доказанной пользой для снабжения, связи и безопасности Фенна."
 # END CONSOLIDATED: ADISCORD_southern_desert_l_russian

# BEGIN CONSOLIDATED: ADISCORD_STP_ideas_l_russian.yml
 # Национальные духи STP
 STP_hedonism_with_no_bondaries: "Политика гедонизма без границ"
 STP_hedonism_with_no_bondaries_desc: "Государство перестало притворяться воспитателем и стало продавцом удовольствий. Границы открыты для капитала, пороков и туристов, а мораль заменена прайс-листом.\n\nПока витрины сияют, система учится одному: держать людей сытыми, занятыми и слегка одурманенными. Это работает - до тех пор, пока праздник не кончается и счет не приносят всем сразу."
 STP_hedonism_army_restriction_tt: "§RШаблоны регулярной армии и полиции заморожены, а обучение новых обычных дивизий запрещено.§!\n§GАрмейские штабы не подпадают под это ограничение.§!"
 STP_hedonism_army_restriction_reason: "Регулярная армия ограничена политикой гедонизма без границ"

 STP_hidden_slaves_trade: "Широкая сеть работорговли"
 STP_hidden_slaves_trade_desc: "За фасадом «свободного рынка» работает рынок несвободных людей. Трафик идет тихо: через порты, склады, агентства, «контракты» и исчезающие имена.\n\nОфициально этого не существует. Неофициально - это один из самых эффективных каналов прибыли и контроля. В этом бизнесе товар не жалуется, потому что у товара нет голоса."
 STP_legalize: "Легалайз лёгких наркотиков"
 STP_legalize_desc: "Проблему недовольства решили не реформой, а обезболивающим. Лёгкие вещества стали легальными, рынок - регулируемым, бюджет - пополненным.\n\nТолпа стала тише, улицы - ярче, отчеты - красивее. Побочный эффект очевиден: общество учится не думать о будущем, а пережидать настоящее."
 STP_worldwide_famous_tourist_destination: "Экономическое чудо Стеланда"
 STP_worldwide_famous_tourist_destination_desc: "Стеланд превратили в бренд: курорт, витрину и легенду. Валюта течет рекой, сервис улыбается безупречно, а любая грязь вытирается до того, как попадет в кадр.\n\nЧудо держится на впечатлении. Пока турист видит фейерверк, он не спрашивает, кто таскал порох и кто выметал пепел."

 # Динамический модификатор здоровья лидера
 STP_fading_father: "Угасание отца режима"
 STP_fading_father_desc: "Состояние Петра Иванова напрямую влияет на политическую управляемость, стабильность и работу военного аппарата. Стадия меняется только через сохранённый API здоровья STP."
# END CONSOLIDATED: ADISCORD_STP_ideas_l_russian.yml

