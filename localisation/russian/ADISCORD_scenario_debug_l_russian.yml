# BEGIN CONSOLIDATED: ADISCORD_test_wars_l_russian.yml
 ADISCORD_test_wars_category: "Тестовые войны"
 ADISCORD_test_wars_category_desc: "Тестовые решения для проверки региональных конфликтов."
 APH_start_test_war_with_OSF: "Тест: война с OSF"
 APH_start_test_war_with_OSF_desc: "Начать последующий тестовый конфликт APH против OSF. При победе APH аннексирует OSF; при поражении границы не изменятся."
# END CONSOLIDATED: ADISCORD_test_wars_l_russian.yml

 ADISCORD_debug_war_log_on: "§RDEBUG:§! Включить журнал мирных договоров"
 ADISCORD_debug_war_log_on_desc: "Записывает настоящие вызовы капитуляции и мира в game.log. Только для отладки; выключите после проверки."
 ADISCORD_debug_war_log_off: "§RDEBUG:§! Выключить журнал мирных договоров"
 ADISCORD_debug_war_log_off_desc: "Останавливает автоматическую запись мира. Ручной снимок остаётся доступен."
 ADISCORD_debug_war_snapshot: "§RDEBUG:§! Снимок войн и территорий"
 ADISCORD_debug_war_snapshot_desc: "Записывает в game.log текущую страну, противников, альянсы, столицы, владельцев и контролёров областей. Отдельно показывает кампанию Кефрейта и восточные области. Карту не меняет."
 ADISCORD_debug_war_val_start: "§RDEBUG:§! Начать пограничную войну с [FROM.GetName]"
 ADISCORD_debug_war_val_start_desc: "Пропускает ультиматум и отказ, затем запускает настоящую кампанию Кефрейта: коалицию, мажоров и вступление в войну. Требует реального завершения войны в Стеландере и подходящих территорий; победу в гражданской войне не подделывает."
 ADISCORD_debug_war_val_check: "§RDEBUG:§! Перепроверить пограничный договор"
 ADISCORD_debug_war_val_check_desc: "Один раз запускает существующую проверку кампании по настоящим владельцам, контролёрам и участникам. Не помечает страны побеждёнными и не обходит живых союзников."
 ADISCORD_debug_war_val_abort: "§RDEBUG:§! Прервать пограничный тест"
 ADISCORD_debug_war_val_abort_desc: "Вызывает настоящую очистку кампании: завершает её войны, снимает её временных мажоров и добавленное ею членство в альянсе. Победу не выдаёт. Для повторения прежней карты загрузите довоенное сохранение."
 ADISCORD_debug_war_reserves: "§RDEBUG:§! Добавить армейские резервы для теста"
 ADISCORD_debug_war_reserves_desc: "Добавляет текущей стране 50 000 людских ресурсов и 10 000 единиц пехотного снаряжения. Не создаёт дивизии и не меняет результат кампании."
 ADISCORD_war_debug_faction: "Тестовая коалиция"
