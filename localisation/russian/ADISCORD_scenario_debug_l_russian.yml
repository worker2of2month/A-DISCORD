l_russian:
 ADISCORD_debug_add_vorkerland_war_exhaustion: "§RDEBUG:§! Добавить 25 ед. истощения"
 ADISCORD_debug_add_vorkerland_war_exhaustion_desc: "Добавляет текущему WRK или VAD 25 единиц истощения и немедленно обновляет национальный модификатор."
 ADISCORD_debug_reset_vorkerland_war_exhaustion: "§RDEBUG:§! Сбросить истощение"
 ADISCORD_debug_reset_vorkerland_war_exhaustion_desc: "Обнуляет истощение, обновляет снимок потерь и снимает национальный модификатор у текущего WRK или VAD."
 ADISCORD_scenario_debug_category: "§RDEBUG:§! Сценарии A-Discord"
 ADISCORD_scenario_debug_category_desc: "Компактные точки входа для проверки больших сценариев. Категория видна только при запуске игры в режиме отладки."
 ADISCORD_debug_start_vorkerland_collapse: "§RDEBUG:§! Начать распад Воркерланда"
 ADISCORD_debug_start_vorkerland_collapse_desc: "Немедленно запускает взрыв, перестройку карты, смену портретов и мобилизационную паузу. Использовать за WRK."
 ADISCORD_debug_form_vorkerland_joint_government: "§RDEBUG:§! Создать общее правительство WRK и VAD"
 ADISCORD_debug_form_vorkerland_joint_government_desc: "Принудительно включает редкий мирный исход и портрет Объединённого чрезвычайного совета."
 ADISCORD_debug_force_vorkerland_central_victory: "§RDEBUG:§! Закрепить победу центрального претендента"
 ADISCORD_debug_force_vorkerland_central_victory_desc: "Выдаёт текущему WRK, VAD или TVA только статус объединителя центра. Штаты окраин не переносятся."
 ADISCORD_debug_open_ivanland_intervention: "§RDEBUG:§! Открыть интервенцию Иванланда"
 ADISCORD_debug_open_ivanland_intervention_desc: "При необходимости сначала запускает распад Воркерланда, затем автоматически открывает единственную 240-дневную миссию Иванланда."
 ADISCORD_debug_resolve_ivanland_success: "§RDEBUG:§! Завершить интервенцию успехом"
 ADISCORD_debug_resolve_ivanland_success_desc: "Немедленно завершает интервенцию успехом и создаёт Норвейн во главе с Матвеем Матеуском. Повторный вызов не создаёт вторую армию или войну."
 ADISCORD_debug_resolve_ivanland_failure: "§RDEBUG:§! Завершить интервенцию провалом"
 ADISCORD_debug_resolve_ivanland_failure_desc: "Прекращает войны, переводит Иванланд к этатизму и включает второй портрет Вадима Иванчика."

# BEGIN CONSOLIDATED: ADISCORD_event_ui_test_l_russian.yml
 ADISCORD_event_ui_test.1.t: "Тестовая раскладка ивента"
 ADISCORD_event_ui_test.1.desc: "Проверка новой основы обычного ивента: широкая картинка, растягиваемая центральная часть и четыре варианта ответа."
 ADISCORD_event_ui_test.1.a: "Вариант первый"
 ADISCORD_event_ui_test.1.b: "Вариант второй"
 ADISCORD_event_ui_test.1.c: "Вариант третий"
 ADISCORD_event_ui_test.1.d: "Вариант четвёртый"
 ADISCORD_event_ui_test.2.t: "Короткое описание — один вариант"
 ADISCORD_event_ui_test.2.desc: "Короткая проверка динамической высоты окна."
 ADISCORD_event_ui_test.2.a: "Закрыть тест"
 ADISCORD_event_ui_test.3.t: "Длинное описание — четыре варианта"
 ADISCORD_event_ui_test.3.desc: "Это длинная проверка динамической высоты обычного ивента, которая должна растянуть бумажную середину ровно настолько, насколько этого требует текст. Здесь специально добавлено несколько предложений, чтобы описание заняло несколько строк и не столкнулось с report-картинкой или вариантами ответа. После изменения высоты середины весь нижний блок должен сдвинуться целиком, сохранив картинку, четыре кнопки и одинаковые интервалы между ними. Само окно должно перемещаться как единая конструкция без разъезда вложенных секций."
 ADISCORD_event_ui_test.3.a: "Принять первый вариант"
 ADISCORD_event_ui_test.3.b: "Принять второй вариант"
 ADISCORD_event_ui_test.3.c: "Принять третий вариант"
 ADISCORD_event_ui_test.3.d: "Принять четвёртый вариант"
 ADISCORD_event_ui_test.4.t: "Длинное описание — один вариант"
 ADISCORD_event_ui_test.4.desc: "Это отдельная проверка длинного текста с единственной кнопкой ответа. Описание должно занимать несколько строк, но не перекрывать report-картинку и не выталкивать кнопку за нижнюю границу окна. Растягиваться должна только бумажная середина, после которой изображение и единственный вариант ответа сдвигаются вместе. Фотография должна лежать прямо на общей бумажной подложке без отдельного пустого блока вокруг неё."
 ADISCORD_event_ui_test.4.a: "Завершить длинный тест"
 ADISCORD_event_ui_test.5.t: "Предельный тест: очень много skibidi"
 ADISCORD_event_ui_test.5.desc: "skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi skibidi