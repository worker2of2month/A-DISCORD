# BEGIN CONSOLIDATED: ADISCORD_test_wars_l_russian.yml
 ADISCORD_test_wars_category: "Тестовые войны"
 ADISCORD_test_wars_category_desc: "Тестовые решения для проверки региональных конфликтов."
 APH_start_test_war_with_OSF: "Тест: война с OSF"
 APH_start_test_war_with_OSF_desc: "Начать последующий тестовый конфликт APH против OSF. При победе APH аннексирует OSF; при поражении границы не изменятся."
# END CONSOLIDATED: ADISCORD_test_wars_l_russian.yml

 ADISCORD_debug_war_log_on: "§RDEBUG:§! Включить журнал мирных договоров"
 ADISCORD_debug_war_log_on_desc: "Записывает настоящие вызовы капитуляции и мира в game.log. Только для отладки; выключите после проверки."
 ADISCORD_debug_war_log_off: "§RDEBUG:§! Выключить журнал мирных договоров"
 ADISCORD_debug_war_log_off_desc: "Останавливает автоматическую запись мира. Ручной снимок остаётся доступен."
 ADISCORD_debug_war_snapshot: "§RDEBUG:§! Снимок войн и территорий"
 ADISCORD_debug_war_snapshot_desc: "Записывает в game.log текущую страну, противников, альянсы, столицы, владельцев и контролёров областей. Отдельно показывает кампанию Кефрейта и восточные области. Карту не меняет."
 ADISCORD_debug_war_val_start: "§RDEBUG:§! Начать пограничную войну с [FROM.GetName]"
 ADISCORD_debug_war_val_start_desc: "Пропускает ультиматум и отказ, затем запускает настоящую кампанию Кефрейта: коалицию, мажоров и вступление в войну. Требует реального завершения войны в Стеландере и подходящих территорий; победу в гражданской войне не подделывает."
 ADISCORD_debug_war_val_check: "§RDEBUG:§! Перепроверить пограничный договор"
 ADISCORD_debug_war_val_check_desc: "Один раз запускает существующую проверку кампании по настоящим владельцам, контролёрам и участникам. Не помечает страны побеждёнными и не обходит живых союзников."
 ADISCORD_debug_war_val_abort: "§RDEBUG:§! Прервать пограничный тест"
 ADISCORD_debug_war_val_abort_desc: "Вызывает настоящую очистку кампании: завершает её войны, снимает её временных мажоров и добавленное ею членство в альянсе. Победу не выдаёт. Для повторения прежней карты загрузите довоенное сохранение."
 ADISCORD_debug_war_sts_vs_val: "§RDEBUG:§! Сценарий: Шабрат против Кефрейта"
 ADISCORD_debug_war_sts_vs_val_desc: "Запускает чистую послевоенную войну, в которой Кефрейт нападает на Стеландер Шабрата. Используется штатное урегулирование капитуляции и кефрейтской администрации."
 ADISCORD_debug_war_sts_vs_nod: "§RDEBUG:§! Сценарий: Шабрат против Нодрула"
 ADISCORD_debug_war_sts_vs_nod_desc: "Запускает чистую послевоенную войну, в которой Нодрул нападает на Стеландер Шабрата. Кефрейт остаётся вне войны."
 ADISCORD_debug_war_sts_vs_val_nod: "§RDEBUG:§! Сценарий: Шабрат против Кефрейта и Нодрула"
 ADISCORD_debug_war_sts_vs_val_nod_desc: "Одновременно запускает ДВЕ НЕЗАВИСИМЫЕ войны: Кефрейт против Шабрата и Нодрул против Шабрата. Нужен для проверки, что мир с одним агрессором не удаляет и не поглощает вторую войну."
 ADISCORD_debug_war_stp_vs_val: "§RDEBUG:§! Сценарий: Партия против Кефрейта"
 ADISCORD_debug_war_stp_vs_val_desc: "Запускает чистую послевоенную войну, в которой Кефрейт нападает на партийный Стеландер. Используется штатный маршрут финальной кампании Кефрейта."
 ADISCORD_debug_war_stp_vs_nod: "§RDEBUG:§! Сценарий: Партия против Нодрула"
 ADISCORD_debug_war_stp_vs_nod_desc: "Запускает штатный послевоенный сценарий вторжения Нодрула против Партии, включая обычный флаг кампании и военный модификатор Нодрула."
 ADISCORD_debug_war_stp_vs_val_nod: "§RDEBUG:§! Сценарий: Партия против Кефрейта и Нодрула"
 ADISCORD_debug_war_stp_vs_val_nod_desc: "Одновременно запускает ДВЕ НЕЗАВИСИМЫЕ войны: Кефрейт против партийного Стеландера и штатное вторжение Нодрула против Партии. Главный тест мира после двух одновременных ультиматумов."
 ADISCORD_debug_war_frontier_with_nod: "§RDEBUG:§! Сценарий: северная война + Нодрул"
 ADISCORD_debug_war_frontier_with_nod_desc: "Запускает выбранную северную кампанию через штатный код Кефрейта и заранее отмечает истечение ультиматума Нодрулу. Обычный отложенный колбэк затем вводит Нодрул в войну как гаранта."
 ADISCORD_debug_war_val_join_sts_nod: "§RDEBUG:§! Сценарий: Шабрат + Кефрейт против Нодрула"
 ADISCORD_debug_war_val_join_sts_nod_desc: "Запускает войну Шабрата против Нодрула, а через один час вызывает штатную совместную кампанию: Шабрат и Кефрейт входят в один союз, после чего Кефрейт присоединяется К ЭТОЙ ЖЕ ВОЙНЕ. При победе южное ядро Нодрула получает Шабрат, а север оформляется как договорные администрации Кефрейта. Специальный раздел одноразовый; следующая война с Нодрулом использует обычный кефрейтский мир."
 ADISCORD_debug_war_val_vs_nod: "§RDEBUG:§! Сценарий: Кефрейт против Нодрула"
 ADISCORD_debug_war_val_vs_nod_desc: "Запускает отдельную финальную войну Кефрейта с Нодрулом после подчинения Стеландера. Нодрул регистрируется через штатную систему урегулирования финальной кампании."
 ADISCORD_debug_war_val_nod_victory: "§RDEBUG:§! Завершить войну с Нодрулом: победа Кефрейта"
 ADISCORD_debug_war_val_nod_victory_desc: "Принудительно проводит текущую войну Кефрейта с Нодрулом через штатный scripted settlement Нодрула. Прямой аннексии страны не делает."
 ADISCORD_debug_war_val_victory: "§RDEBUG:§! Завершить текущую войну Кефрейта победой"
 ADISCORD_debug_war_val_victory_desc: "Завершает активную тестовую войну Кефрейта через её штатное урегулирование: северную победу, совместный мир Шабрата с Нодрулом либо финальную администрацию STP/STS/NOD."
 ADISCORD_debug_war_val_nod_reconcile: "§RDEBUG:§! Пересчитать scripted peace с Нодрулом"
 ADISCORD_debug_war_val_nod_reconcile_desc: "Повторно запускает reconciliation финальной кампании и обработку зарезервированного мира Нодрула. Используйте на сохранении, где Нодрул уже капитулировал, но scripted peace не завершился."
 ADISCORD_debug_war_external_cleanup: "§RDEBUG:§! Прервать внешние тестовые войны"
 ADISCORD_debug_war_external_cleanup_desc: "Аварийная очистка для QA. Завершает активные войны VAL/NOD против STP или STS, закрывает текущую северную или финальную debug-кампанию, очищает флаги совместной войны и вторжения Нодрула против Партии. Не выдаёт награду за победу."
 ADISCORD_debug_war_reserves: "§RDEBUG:§! Добавить армейские резервы для теста"
 ADISCORD_debug_war_reserves_desc: "Добавляет текущей стране 50 000 людских ресурсов и 100 000 единиц пехотного снаряжения. Не создаёт дивизии и не меняет результат кампании."
 ADISCORD_war_debug_faction: "Тестовая коалиция"

 ADISCORD_debug_val_open_south_route: "§RDEBUG:§! Открыть южную концессию"
 ADISCORD_debug_val_open_south_route_desc: "Включает концессию Эфлора и обновляет реальные условия южного торгового маршрута."
 ADISCORD_debug_val_close_south_route: "§RDEBUG:§! Закрыть южный маршрут"
 ADISCORD_debug_val_close_south_route_desc: "Снимает отладочную концессию, комиссию и улучшение южного маршрута, затем обновляет сеть."
 ADISCORD_debug_val_upgrade_south_route: "§RDEBUG:§! Улучшить южный маршрут"
 ADISCORD_debug_val_upgrade_south_route_desc: "Отмечает южный маршрут улучшенным для проверки повышенного дохода."
 ADISCORD_debug_val_reset_corridor_project: "§RDEBUG:§! Сбросить стройку маршрута"
 ADISCORD_debug_val_reset_corridor_project_desc: "Возвращает залог текущей стройки и освобождает слот проекта."
 ADISCORD_debug_val_fund_treasury: "§RDEBUG:§! Выдать 5000 казны Кефрейту"
 ADISCORD_debug_val_fund_treasury_desc: "Устанавливает казну Кефрейта в 5000 и обновляет бюджетный кэш."
