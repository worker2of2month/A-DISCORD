 ADISCORD_vorkerland_csl_isolated_city: "Город без тыла"
 ADISCORD_vorkerland_csl_isolated_city_desc: "Слобода удерживает один перенаселённый городской узел между двумя армиями. У управы почти нет складов, резервов и безопасных путей снабжения."
