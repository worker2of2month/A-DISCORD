 ADISCORD_world_news.1.t: "Воркерланд охвачен войной"
 ADISCORD_world_news.1.d: "Спор о власти в Воркерланде перешёл в открытые бои. Бывшие федеральные части подчиняются разным штабам, железнодорожные узлы, склады и главные дороги переходят под контроль военных. Фронты возникли сразу в нескольких местах. Ни у одного из претендентов пока нет сил, чтобы восстановить единое правительство, и иностранные наблюдатели ожидают затяжной войны."
 ADISCORD_world_news.1.a: "Похоже, это надолго."

 ADISCORD_world_news.2.t: "Нодрул начал Северную войну"
 ADISCORD_world_news.2.d: "Нодрул объявил войну северной коалиции. Мобилизация идёт по всему региону, колонны обеих сторон движутся к главным дорогам и горным перевалам. Нодрульское командование сосредотачивает силы для долгой кампании, а коалиции ещё предстоит договориться о совместных действиях нескольких армий."
 ADISCORD_world_news.2.a: "Северная кампания началась."

 ADISCORD_world_news.3.t: "В Стеландере началась гражданская война"
 ADISCORD_world_news.3.d: "Политический кризис в Стеландере перерос в гражданскую войну. Правительственные войска и силы сопротивления подчиняются разным штабам, окружные администрации одна за другой выбирают сторону, арсеналы раздают оружие полевым частям. Первые бои идут на горных дорогах между крупнейшими городами страны."
 ADISCORD_world_news.3.a: "Стеландер раскололся."

 ADISCORD_world_news.4.t: "Кефрейт вступил в гражданскую войну Стеландера"
 ADISCORD_world_news.4.d: "Кефрейт перешёл от поставок оружия и политического давления к прямому участию в гражданской войне Стеландера. Кефрейтские войска открыли собственный фронт против одной из сторон. Местным армиям теперь приходится воевать не только друг с другом, но и с полноценной иностранной армией."
 ADISCORD_world_news.4.a: "Война стала международной."

 ADISCORD_world_news.5.t: "Итора вступила в войну на севере Воркерланда"
 ADISCORD_world_news.5.d: "Иторские войска пересекли границу северных территорий бывшего Воркерланда и вступили в бои с местными силами. Северные государства и без того воюют друг с другом, а теперь им приходится снимать части с местных фронтов, чтобы остановить иторское наступление."
 ADISCORD_world_news.5.a: "Итора вступила в войну."
