 ADISCORD_world_news.1.t: "В Воркерланде началась война"
 ADISCORD_world_news.1.d: "Между основными правительствами, претендующими на власть в Воркерланде, начались открытые бои. Бывшие федеральные части теперь подчиняются разным штабам, а железнодорожные узлы, склады и крупные дороги переходят под военный контроль. Одновременно возникло несколько фронтов, и ни один из претендентов пока не контролирует достаточно территории для восстановления единого центра."
 ADISCORD_world_news.1.a: "Воркерланд воюет сам с собой."

 ADISCORD_world_news.2.t: "Нодрул начал Северную войну"
 ADISCORD_world_news.2.d: "Нодрул вступил в открытую войну с северной коалицией. По региону идут приказы о мобилизации, а обе стороны перебрасывают войска к основным дорогам и горным проходам. Коалиции предстоит согласовывать действия нескольких армий, тогда как Нодрул концентрирует силы для длительной кампании на севере."
 ADISCORD_world_news.2.a: "Северная кампания началась."

 ADISCORD_world_news.3.t: "В Стеландере началась гражданская война"
 ADISCORD_world_news.3.d: "Политический кризис в Стеландере перешёл в гражданскую войну. Правительственные части и силы сопротивления теперь подчиняются отдельным штабам, местные администрации выбирают сторону, а оружейные склады передаются полевым соединениям. Бои начались на горных дорогах, связывающих основные населённые пункты."
 ADISCORD_world_news.3.a: "Стеландер раскололся на два лагеря."

 ADISCORD_world_news.4.t: "Кефрейт вступил в гражданскую войну Стеландера"
 ADISCORD_world_news.4.d: "Кефрейт начал прямые боевые действия в Стеландере. После периода поставок и политического давления его войска открыли отдельный фронт против одной из сторон гражданской войны. Теперь местным силам приходится учитывать не только внутреннего противника, но и полноценную внешнюю армию."
 ADISCORD_world_news.4.a: "Кефрейт стал участником войны."

 ADISCORD_world_news.5.t: "Итора вступила в войну на севере Воркерланда"
 ADISCORD_world_news.5.d: "Иторские войска пересекли границу северных территорий бывшего Воркерланда и начали боевые действия против местных сил. В регионе, уже разделённом между конкурирующими правительствами, появилась ещё одна армия. Северные государства перебрасывают части с локальных фронтов, чтобы прикрыть направление иторского наступления."
 ADISCORD_world_news.5.a: "Итора вступила в войну."
