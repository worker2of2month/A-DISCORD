 ADISCORD_world_news.1.t: "В Воркерланде начались боевые действия"
 ADISCORD_world_news.1.d: "Распад федеральной власти перестал быть политическим кризисом. Части, подчинённые главным претендентам на наследство Воркерланда, вступили в прямые столкновения. Железнодорожные узлы переводятся на военный режим, дороги перекрываются, а бывшие сослуживцы занимают позиции по разные стороны фронта. Вопрос о том, кто унаследует республику, теперь решается оружием."
 ADISCORD_world_news.1.a: "Распад перешёл в войну."

 ADISCORD_world_news.2.t: "Началась Северная война Нодрула"
 ADISCORD_world_news.2.d: "На севере Нодрула начались открытые боевые действия. Армия центрального правительства столкнулась с силами северной коалиции, и локальный кризис быстро превращается в полноценную кампанию. Мобилизационные распоряжения разосланы по региону, дороги и перевалы переходят под военный контроль. Исход войны способен изменить весь баланс сил на севере континента."
 ADISCORD_world_news.2.a: "Север снова горит."

 ADISCORD_world_news.3.t: "В Стеландере началась гражданская война"
 ADISCORD_world_news.3.d: "Политический раскол Стеландера перешёл в открытую войну. Правительственные части и силы сопротивления получили отдельные центры командования и вступили в бой за контроль над страной. Местные администрации выбирают сторону, склады вскрываются, а горные дороги превращаются в линии снабжения. Компромисс, ещё недавно казавшийся возможным, уступил место борьбе за само будущее Стеланда."
 ADISCORD_world_news.3.a: "Страна раскололась."

 ADISCORD_world_news.4.t: "Кефрейт вмешался в войну за Стеландер"
 ADISCORD_world_news.4.d: "Кефрейт перешёл от поставок, контрактов и политического давления к прямому военному вмешательству в Стеландере. Его войска открыли новый фронт против одной из сторон гражданской войны. Для соседних государств это означает, что внутренний конфликт окончательно перестал быть внутренним: борьба за Стеландер становится частью более широкого противостояния за регион."
 ADISCORD_world_news.4.a: "Война выходит за границы Стеландера."

 ADISCORD_world_news.5.t: "Итора вмешалась в войну за Воркерланд"
 ADISCORD_world_news.5.d: "Итора открыто вступила в борьбу за северные земли бывшего Воркерланда. Иторские части пересекли границу и начали боевые действия против местных сил, превратив и без того запутанную гражданскую войну в международный конфликт. Северные правительства теперь вынуждены воевать не только друг с другом, но и с внешней державой, имеющей собственные планы на послевоенное устройство региона."
 ADISCORD_world_news.5.a: "У войны появился новый участник."
