 ADISCORD_world_news.1.t: "В Воркерланде начались боевые действия"
 ADISCORD_world_news.1.d: "Между главными претендентами на власть в Воркерланде начались открытые боевые действия. Распад общего центра больше не ограничивается заявлениями о самостоятельности: бывшие части одной армии воюют за территории, с которых каждое правительство намерено начать восстановление страны.\n\nПредметом борьбы становится само право распоряжаться наследством Воркерланда. Контроль над городом означает доступ к его промышленности и запасам, а над железнодорожным узлом - возможность снабжать следующий фронт. Пока ни один из претендентов не подчинил остальных, прежняя государственная граница скрывает несколько конкурирующих военных порядков. Для соседей вопрос уже состоит не в сохранении старой власти, а в том, кто придёт ей на смену."
 ADISCORD_world_news.1.a: "Распад перешёл в войну."

 ADISCORD_world_news.2.t: "Началась Северная война Нодрула"
 ADISCORD_world_news.2.d: "Нодрул вступил в войну с государствами северной коалиции. Противостояние перешло в открытую кампанию, в которой центральному правительству предстоит столкнуться с отдельными армиями и различными системами управления северных соседей.\n\nДля коалиции общая угроза не отменяет необходимости согласовать оборону и снабжение. Потеря одного участка может открыть путь в тыл союзнику, а самостоятельное продолжение войны потребует собственных резервов. Для Нодрула исход кампании определит, удастся ли устранить организованное сопротивление на северном направлении или придётся надолго связать там армию. Начало боевых действий ещё не решает ни одного из этих вопросов."
 ADISCORD_world_news.2.a: "Север снова горит."

 ADISCORD_world_news.3.t: "В Стеландере началась гражданская война"
 ADISCORD_world_news.3.d: "Политический раскол Стеландера перешёл в открытую войну. Правительственные части и силы сопротивления получили отдельные центры командования и вступили в бой за контроль над страной. Местные администрации выбирают сторону, склады вскрываются, а горные дороги превращаются в линии снабжения. Компромисс, ещё недавно казавшийся возможным, уступил место борьбе за само будущее Стеланда."
 ADISCORD_world_news.3.a: "Страна раскололась."

 ADISCORD_world_news.4.t: "Кефрейт вмешался в войну за Стеландер"
 ADISCORD_world_news.4.d: "Кефрейт вступил в открытые боевые действия против Стеландского сопротивления. Военный курс получил прямое продолжение: теперь исход борьбы зависит не только от противников внутри Стеландера, но и от действий соседней державы.\n\nДля сопротивления возник отдельный фронт и необходимость распределять силы между внутренним противником и внешним вмешательством. Даже успех в борьбе за власть в Стеландере сам по себе не завершит войну с Кефрейтом. Политическое устройство страны и условия прекращения внешнего конфликта становятся двумя связанными, но разными вопросами."
 ADISCORD_world_news.4.a: "Война выходит за границы Стеландера."

 ADISCORD_world_news.5.t: "Итора вмешалась в войну за Воркерланд"
 ADISCORD_world_news.5.d: "Итора начала войну против одного из северных государств, возникших при распаде Воркерланда. В борьбу за наследство прежней державы вступила внешняя сила, способная влиять на исход местных конфликтов собственными войсками.\n\nДля северных правительств это меняет условия всей кампании. Силы, предназначенные для борьбы с соседними претендентами, могут понадобиться на иторском направлении; победа над внутренним соперником уже не гарантирует сохранения приобретённых земель. Будущее севера теперь зависит и от того, удастся ли остановить вмешательство, прежде чем местные войны определят окончательное соотношение сил."
 ADISCORD_world_news.5.a: "У войны появился новый участник."
