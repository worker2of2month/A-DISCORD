l_russian:
 vacant: "Вакантно"
 vacant_desc: "Должность пока не занята."

 # Law categories
 social_laws: "Общественные законы"
 social_laws_desc: "Законы, описывающие тип общества, информационную среду, социальные институты, образование, здравоохранение и культурную политику."
 economic_laws: "Экономические законы"
 economic_laws_desc: "Законы, задающие экономическую модель, торговлю и фискальную нагрузку."
 army_laws: "Военные законы"
 army_laws_desc: "Законы, определяющие мобилизацию и устройство вооружённых сил."
 ADISCORD_society_type_laws: "Общественный уклад"
 ADISCORD_society_type_laws_desc: "Категория определяет, на каких общественных институтах и хозяйственных навыках держится страна. Более сложный уклад расширяет возможности развития, но требует большего числа ресурсов и компетентного управления."
 ADISCORD_society_type_traditional: "Традиционное общество"
 ADISCORD_society_type_traditional_desc: "Общество держится на обычаях, семье, общинах и местных авторитетах. Оно устойчиво и дешево для слабого государства, но плохо принимает индустриализацию, массовое образование и быструю мобилизацию."
 ADISCORD_society_type_agrarian: "Аграрное общество"
 ADISCORD_society_type_agrarian_desc: "Большая часть населения связана с землей, сырьем и локальным хозяйством. Такой уклад дает демографическую и ресурсную опору, но ограничивает промышленную производительность, города и научный рывок."
 ADISCORD_society_type_industrial: "Индустриальное общество"
 ADISCORD_society_type_industrial_desc: "Фабрики, транспорт, массовая занятость и дисциплина труда становятся основой страны. Индустриальное общество ускоряет производство и военную промышленность, но требует инфраструктуры и управляемых городов."
 ADISCORD_society_type_post_industrial: "Постиндустриальное общество"
 ADISCORD_society_type_post_industrial_desc: "На первый план выходят услуги, образование, управление, сложные институты и технологические цепочки. Это ускоряет исследования и повышает гибкость экономики, но делает страну дороже и зависимее от компетентного аппарата."
 ADISCORD_society_type_information: "Информационное общество"
 ADISCORD_society_type_information_desc: "Страна опирается на данные, вычислительные сети, экспертные системы и высокую плотность знаний. Информационное общество превосходит обычный постиндустриальный уклад по эффективности и исследованиям, но требует развитого государства, энергии и устойчивой социальной инфраструктуры."

 ADISCORD_information_laws: "Информационная политика"
 ADISCORD_information_laws_desc: "Категория определяет правила работы прессы, публичных площадок и официальных сообщений. Более жёсткий контроль облегчает управление повесткой, но сужает независимый обмен мнениями."
 ADISCORD_taxation_laws: "Налоговая система"
 ADISCORD_taxation_laws_desc: "Категория задаёт порядок учёта и сбора обязательных платежей. Выбранная система меняет устойчивость государственных доходов и нагрузку на хозяйство."
 ADISCORD_military_organization_laws: "Военная организация"
 ADISCORD_military_organization_laws_desc: "Как армия устроена между местной инициативой, контрактом и штабной вертикалью."

 ADISCORD_information_open_press: "Свободная пресса"
 ADISCORD_information_open_press_desc: "Редакции и общественные площадки действуют без предварительного разрешения властей. Это поддерживает свободный обмен идеями, но осложняет контроль над общественными настроениями."
 ADISCORD_information_licensed_press: "Регулируемая пресса"
 ADISCORD_information_licensed_press_desc: "Газеты и каналы работают по государственным правилам и лицензиям. Власти получают более предсказуемую информационную среду, но редакционная независимость ограничена."
 ADISCORD_information_state_bulletins: "Государственная пресса"
 ADISCORD_information_state_bulletins_desc: "Основные новости распространяют официальные бюро и подотчётные им редакции. Правительству проще проводить единую линию, но доступ к альтернативной информации сокращается."
 ADISCORD_information_wartime_censorship: "Военная цензура"
 ADISCORD_information_wartime_censorship_desc: "Военные органы проверяют публикации о фронте, потерях и снабжении. Это ограничивает распространение опасных сведений в войну, но сокращает доступ общества к полной информации."
 ADISCORD_information_sealed_networks: "Государственный контроль информации"
 ADISCORD_information_sealed_networks_desc: "Связь, печать и публичные площадки находятся под прямым надзором государства. Контроль укрепляет управляемость в кризисе, но подавляет независимые источники и общественную инициативу."

 ADISCORD_taxation_light_dues: "Местное налогообложение"
 ADISCORD_taxation_light_dues_desc: "Местные платежи, пошлины и договорные взносы важнее единого центрального аппарата. Такая система легче для частной активности и слабого государства, но хуже наполняет казну в кризис."
 ADISCORD_taxation_balanced_register: "Единая налоговая система"
 ADISCORD_taxation_balanced_register_desc: "Платежи сведены в понятный реестр: кто должен, сколько должен и кому отчитываться. Это базовая предсказуемая система для государства со средней административной силой."
 ADISCORD_taxation_progressive_brackets: "Прогрессивная шкала"
 ADISCORD_taxation_progressive_brackets_desc: "Нагрузка распределяется по платежеспособности. Население воспринимает систему как более справедливую, но крупный бизнес вынужден закладывать больше резервов и рисков."
 ADISCORD_taxation_industrial_tariffs: "Протекционистские тарифы"
 ADISCORD_taxation_industrial_tariffs_desc: "Пошлины и льготы подталкивают заводы к нужным отраслям. Рост получается направленным, но не самым гибким."
 ADISCORD_taxation_extraction_quotas: "Чрезвычайные сборы"
 ADISCORD_taxation_extraction_quotas_desc: "Чрезвычайная система реквизиций и обязательных поставок. Она резко усиливает сбор ресурсов, но давит на гражданскую экономику, стабильность и перегружает государственный аппарат."

 ADISCORD_military_organization_militia_autonomy: "Территориальное ополчение"
 ADISCORD_military_organization_militia_autonomy_desc: "Местные отряды быстро собираются и знают свою землю. В единой линии фронта они держатся хуже регулярных частей."
 ADISCORD_military_organization_cadre_army: "Кадровая армия"
 ADISCORD_military_organization_cadre_army_desc: "Небольшое профессиональное ядро поддерживает порядок, обучает резерв и не перегружает общество."
 ADISCORD_military_organization_contract_brigades: "Контрактная служба"
 ADISCORD_military_organization_contract_brigades_desc: "Военная служба строится на контрактах с профессиональными военнослужащими. Боеспособность и готовность частей повышаются, однако содержание армии требует устойчивого финансирования."
 ADISCORD_military_organization_general_staff: "Централизованное командование"
 ADISCORD_military_organization_general_staff_desc: "Генеральный штаб централизует координацию и планирование, ускоряет мобилизацию и повышает организованность армии. При этом обучение личного состава занимает больше времени."
 ADISCORD_military_organization_total_defense_grid: "Система территориальной обороны"
 ADISCORD_military_organization_total_defense_grid_desc: "Государство разворачивает территориальную оборону и заранее готовит резервы к мобилизации. Оборона страны усиливается, но нагрузка на гражданское строительство и общественную стабильность возрастает."

 ADISCORD_welfare_laws: "Социальная защита"
 ADISCORD_welfare_laws_desc: "Категория определяет, какую помощь население получает при бедности, болезни и потере дохода. Более широкая защита повышает устойчивость общества, но требует постоянных расходов."
 ADISCORD_education_laws: "Образование"
 ADISCORD_education_laws_desc: "Категория определяет устройство школ и подготовку специалистов. Более развитая система даёт стране квалифицированные кадры, но требует времени и средств."
 ADISCORD_healthcare_laws: "Здравоохранение"
 ADISCORD_healthcare_laws_desc: "Категория определяет доступ населения к лечению и профилактике болезней. Развитая медицина укрепляет общество, но нуждается в устойчивом финансировании и кадрах."
 ADISCORD_cultural_policy_laws: "Культурная политика"
 ADISCORD_cultural_policy_laws_desc: "Категория определяет отношение государства к культуре, публичным обычаям и общественным объединениям. Поддержка выбранных практик может укреплять общие нормы, но ограничивает другие формы самовыражения."
 ADISCORD_industrial_policy_laws: "Промышленная политика"
 ADISCORD_industrial_policy_laws_desc: "Категория определяет, как государство направляет заводы, мастерские и производственные связи. Приоритетные отрасли получают больше внимания, но другие нужды хозяйства могут остаться без поддержки."
 ADISCORD_labor_policy_laws: "Трудовая политика"
 ADISCORD_labor_policy_laws_desc: "Категория определяет правила найма, рабочего времени и защиты работников. Более строгие нормы повышают предсказуемость труда, но ограничивают свободу предприятий."
 ADISCORD_infrastructure_laws: "Инфраструктура"
 ADISCORD_infrastructure_laws_desc: "Категория определяет порядок строительства и содержания дорог, узлов снабжения и коммуникаций. Выбранный подход меняет скорость развития сети и объём необходимых вложений."
 ADISCORD_officer_corps_laws: "Офицерский корпус"
 ADISCORD_officer_corps_laws_desc: "Как армия отбирает, продвигает и удерживает командиров."
 ADISCORD_logistics_laws: "Военная логистика"
 ADISCORD_logistics_laws_desc: "Как армия снабжает части, склады и фронтовые маршруты."
 ADISCORD_training_laws: "Военная подготовка"
 ADISCORD_training_laws_desc: "Как организованы обучение, сборы, нормативы и полевая подготовка."
 ADISCORD_internal_security_laws: "Внутренняя безопасность"
 ADISCORD_internal_security_laws_desc: "Как государство использует гарнизоны, полицию и службы порядка внутри страны."

 ADISCORD_welfare_basic_services: "Базовая социальная помощь"
 ADISCORD_welfare_basic_services_desc: "Государство поддерживает минимальную сеть пособий, приютов и социальных служб. Помощь смягчает наиболее тяжёлые последствия бедности, но охватывает не все нужды населения."
 ADISCORD_education_basic_schools: "Базовые школы"
 ADISCORD_education_basic_schools_desc: "Школы работают неравномерно, но государство сохраняет минимальную систему грамотности и подготовки кадров."
 ADISCORD_healthcare_basic_clinics: "Первичная медицинская помощь"
 ADISCORD_healthcare_basic_clinics_desc: "Первичная медицина доступна не всем и не всегда, но у страны есть каркас здравоохранения."
 ADISCORD_cultural_policy_public_entertainment: "Массовая культура"
 ADISCORD_cultural_policy_public_entertainment_desc: "Государство допускает и поддерживает доступные зрелища, праздники и популярные издания. Это создаёт общие формы досуга, но не даёт простора для независимых культурных инициатив."
 ADISCORD_industrial_policy_balanced_workshops: "Поддержка частного производства"
 ADISCORD_industrial_policy_balanced_workshops_desc: "Промышленная политика осторожна: государство поддерживает производство, не ломая рынок чрезмерным нажимом."
 ADISCORD_labor_policy_loose_contracts: "Гибкая занятость"
 ADISCORD_labor_policy_loose_contracts_desc: "Работодатели и работники договариваются гибко, но слабая защита труда иногда бьёт по стабильности."
 ADISCORD_infrastructure_patchwork_roads: "Местное дорожное хозяйство"
 ADISCORD_infrastructure_patchwork_roads_desc: "Инфраструктура ремонтируется по необходимости: без большого плана, зато быстро и дешево."
 ADISCORD_officer_corps_local_seniority: "Продвижение по выслуге"
 ADISCORD_officer_corps_local_seniority_desc: "Командиры растут из привычных кругов и старых частей. Система понятна армии, пусть и не всегда эффективна."
 ADISCORD_logistics_civilian_contracts: "Гражданские поставщики"
 ADISCORD_logistics_civilian_contracts_desc: "Армия частично опирается на гражданских поставщиков, склады и перевозчиков."
 ADISCORD_training_basic_drills: "Базовая муштра"
 ADISCORD_training_basic_drills_desc: "Солдаты получают минимально достаточную подготовку, чтобы армия могла держать строй."
 ADISCORD_internal_security_local_garrisons: "Территориальные гарнизоны"
 ADISCORD_internal_security_local_garrisons_desc: "Гарнизоны помогают держать порядок внутри страны, но отвлекают часть армейской энергии от фронтовой подготовки."

 ADISCORD_welfare_charity_relief: "Благотворительная помощь"
 ADISCORD_welfare_charity_relief_desc: "Помощь нуждающимся обеспечивают благотворительные фонды, общины и частные пожертвования. Государство тратит меньше средств, но поддержка зависит от местных возможностей и не охватывает всех."
 ADISCORD_welfare_social_insurance: "Социальное страхование"
 ADISCORD_welfare_social_insurance_desc: "Пособия и выплаты привязаны к труду, взносам и понятным правилам. Общество чувствует себя увереннее, хотя эта система требует финансирования и администрирования."
 ADISCORD_welfare_universal_provision: "Всеобщие социальные гарантии"
 ADISCORD_welfare_universal_provision_desc: "Государство предоставляет широкую помощь независимо от статуса получателя. Социальная защищённость растёт, но содержание такой системы требует значительных общественных ресурсов."
 ADISCORD_welfare_rationed_support: "Военное нормирование"
 ADISCORD_welfare_rationed_support_desc: "Помощь и основные товары распределяются по нормам, спискам и очередям. Такой порядок позволяет сосредоточить ресурсы в кризисе, но ограничивает потребление и привычный уклад жизни."
 ADISCORD_education_informal_instruction: "Местное образование"
 ADISCORD_education_informal_instruction_desc: "Знания передаются через семьи, мастерские, наставников и неформальные школы. Система почти ничего не стоит, но качество подготовки остаётся неравномерным."
 ADISCORD_education_civic_curriculum: "Гражданское образование"
 ADISCORD_education_civic_curriculum_desc: "Школы учат не только грамоте, но и общей политической рамке. Это укрепляет лояльность и порядок, хотя учебная система становится менее свободной."
 ADISCORD_education_technical_institutes: "Технические институты"
 ADISCORD_education_technical_institutes_desc: "Государство делает ставку на инженеров, мастеров и прикладные науки. Заводы получают нужные кадры, но образование становится более жестким и утилитарным."
 ADISCORD_education_elite_academies: "Элитные академии"
 ADISCORD_education_elite_academies_desc: "Отборные школы и академии готовят управленцев, военных специалистов и исследователей. Страна получает сильный кадровый резерв, но доступ к образованию остаётся узким."
 ADISCORD_healthcare_private_care: "Частная медицина"
 ADISCORD_healthcare_private_care_desc: "Лечение в основном оплачивают семьи, частные врачи и местные объединения. Государство сокращает расходы, но доступ к медицине зависит от дохода и места жительства."
 ADISCORD_healthcare_public_hospitals: "Государственные больницы"
 ADISCORD_healthcare_public_hospitals_desc: "Сеть больниц дает населению более надежный доступ к медицине. Система повышает устойчивость общества, но требует постоянного финансирования."
 ADISCORD_healthcare_preventive_medicine: "Профилактическая медицина"
 ADISCORD_healthcare_preventive_medicine_desc: "Санитарные службы наблюдают за заболеваниями и проводят профилактические меры. Болезни удаётся сдерживать раньше, но система требует специалистов, учёта и дополнительных расходов."
 ADISCORD_healthcare_military_medical_service: "Военно-медицинская служба"
 ADISCORD_healthcare_military_medical_service_desc: "Медицина перестраивается под нужды армии, тыла и раненых. В войну это спасает боеспособность, но мирные клиники получают меньше внимания."
 ADISCORD_cultural_policy_tolerated_subcultures: "Культурный плюрализм"
 ADISCORD_cultural_policy_tolerated_subcultures_desc: "Разные культурные и общественные группы могут открыто сохранять свои практики. Это расширяет обмен идеями, но ослабляет единые нормы и общий контроль над публичной жизнью."
 ADISCORD_cultural_policy_civic_festivals: "Общественные праздники"
 ADISCORD_cultural_policy_civic_festivals_desc: "Государство организует церемонии, городские события и общие памятные даты. Они поддерживают чувство общности, но требуют постоянных расходов и участия администрации."
 ADISCORD_cultural_policy_avant_garde_patronage: "Поддержка современного искусства"
 ADISCORD_cultural_policy_avant_garde_patronage_desc: "Государство финансирует новые художественные направления, выставки и культурные исследования. Такая политика поощряет творчество и обмен идеями, но вызывает сопротивление сторонников привычных форм."
 ADISCORD_cultural_policy_national_mythmaking: "Патриотическая культурная политика"
 ADISCORD_cultural_policy_national_mythmaking_desc: "Культура и образование строятся вокруг общих исторических образов и государственных символов. Это укрепляет коллективную идентичность, но сужает пространство для критики и иных трактовок прошлого."
 ADISCORD_industrial_policy_artisan_markets: "Ремесленное производство"
 ADISCORD_industrial_policy_artisan_markets_desc: "Малые мастерские и независимые производители обеспечивают местный спрос и занятость. Такая модель поддерживает частную инициативу, но не позволяет быстро нарастить крупную промышленность."
 ADISCORD_industrial_policy_civilian_expansion: "Приоритет гражданской промышленности"
 ADISCORD_industrial_policy_civilian_expansion_desc: "Промышленность направлена на жилье, фабрики и мирное производство. Экономика растет шире, но военные заводы не получают абсолютного приоритета."
 ADISCORD_industrial_policy_military_prioritization: "Приоритет военной промышленности"
 ADISCORD_industrial_policy_military_prioritization_desc: "Сырьё, оборудование и рабочая сила в первую очередь направляются на военные заказы. Оборонное производство растёт быстрее, но гражданские потребности и обычное потребление ограничиваются."
 ADISCORD_industrial_policy_state_planning_boards: "Промышленное планирование"
 ADISCORD_industrial_policy_state_planning_boards_desc: "Государственные органы распределяют заказы и координируют производственные связи. Предприятия действуют согласованнее, но хозяйство теряет часть гибкости и требует большего административного контроля."
 ADISCORD_labor_policy_guild_protections: "Профессиональные объединения"
 ADISCORD_labor_policy_guild_protections_desc: "Профессиональные объединения участвуют в защите условий труда и представляют работников. Социальная устойчивость повышается, но предприятия несут дополнительные обязательства и работают менее гибко."
 ADISCORD_labor_policy_regulated_shifts: "Трудовое регулирование"
 ADISCORD_labor_policy_regulated_shifts_desc: "Государство устанавливает правила рабочего времени, смен и условий на предприятиях. Труд становится более предсказуемым и безопасным, но производство теряет часть темпа."
 ADISCORD_labor_policy_technocratic_work_norms: "Научная организация труда"
 ADISCORD_labor_policy_technocratic_work_norms_desc: "Рабочие процессы организуют по единым стандартам, учёту и рациональному распределению задач. Предприятия используют ресурсы эффективнее, но управление трудом становится более жёстким и требовательным."
 ADISCORD_labor_policy_mobilized_labor: "Трудовая мобилизация"
 ADISCORD_labor_policy_mobilized_labor_desc: "Государство направляет работников на приоритетные стройки и производства административным порядком. Это позволяет быстро сосредоточить трудовые ресурсы, но ограничивает свободу выбора работы и повышает напряжение в обществе."
 ADISCORD_infrastructure_regional_roadworks: "Региональные инфраструктурные программы"
 ADISCORD_infrastructure_regional_roadworks_desc: "Региональные власти и подрядчики развивают дороги и объекты связи по утверждённым программам. Сеть растёт последовательно, но требует координации между территориями и постоянных вложений."
 ADISCORD_infrastructure_rail_corridors: "Железнодорожные коридоры"
 ADISCORD_infrastructure_rail_corridors_desc: "Приоритет отдан магистралям, узлам и перевозкам между ключевыми центрами. Снабжение становится надежнее, но такая сеть требует тяжелых вложений."
 ADISCORD_infrastructure_strategic_highways: "Стратегические шоссе"
 ADISCORD_infrastructure_strategic_highways_desc: "Трассы проектируются с расчетом на переброску войск, грузов и резервов. Мобилизация ускоряется, но мирная инфраструктура подчиняется военной логике."
 ADISCORD_infrastructure_military_depots: "Военные склады"
 ADISCORD_infrastructure_military_depots_desc: "Государство создаёт запасы вооружения, топлива и продовольствия в опорных узлах снабжения. Армия получает более устойчивое снабжение, но содержание складов отвлекает ресурсы от гражданского хозяйства."
 ADISCORD_officer_corps_merit_commissions: "Отбор по профессиональным качествам"
 ADISCORD_officer_corps_merit_commissions_desc: "Офицеров отбирают по результатам службы, экзаменам и профессиональной подготовке. Качество командного состава повышается, однако реформа замедляет подготовку и вызывает сопротивление в армии."
 ADISCORD_officer_corps_political_commissars: "Политические комиссары"
 ADISCORD_officer_corps_political_commissars_desc: "Над командирами ставят людей, отвечающих за линию, настроение и надежность частей. Лояльность растет, но чистая военная эффективность страдает."
 ADISCORD_officer_corps_general_staff_academy: "Академия Генштаба"
 ADISCORD_officer_corps_general_staff_academy_desc: "Высшее командование учится планировать кампании, снабжение и взаимодействие родов войск. Решения становятся грамотнее, но подготовка такой элиты стоит дорого."
 ADISCORD_officer_corps_emergency_promotions: "Повышения военного времени"
 ADISCORD_officer_corps_emergency_promotions_desc: "В условиях войны командиров быстрее назначают на вакантные должности. Мобилизационные возможности растут, однако менее проверенные назначения ослабляют организацию частей."
 ADISCORD_logistics_local_foraging: "Снабжение за счёт местных ресурсов"
 ADISCORD_logistics_local_foraging_desc: "Армия использует продовольствие и материалы местных территорий. Это снижает нагрузку на склады, но ухудшает отношения с населением и дисциплину частей."
 ADISCORD_logistics_centralized_depots: "Централизованная система снабжения"
 ADISCORD_logistics_centralized_depots_desc: "Снабжение армии ведётся через сеть крупных складов, подчинённых единому управлению. Расход ресурсов на фронте снижается, но система требует дополнительных административных и военных расходов."
 ADISCORD_logistics_motorized_supply: "Моторизованное снабжение"
 ADISCORD_logistics_motorized_supply_desc: "Моторизованная система делает снабжение надёжнее и эффективнее, помогая частям дольше сохранять организованность. Её эксплуатация увеличивает военные расходы и отвлекает часть промышленных мощностей."
 ADISCORD_logistics_emergency_requisitioning: "Чрезвычайные реквизиции"
 ADISCORD_logistics_emergency_requisitioning_desc: "Государство вводит обязательное изъятие продовольствия, материалов и транспорта для армии. Снабжение фронта улучшается, однако нагрузка на население и местное управление возрастает."
 ADISCORD_training_irregular_exercises: "Периодические военные сборы"
 ADISCORD_training_irregular_exercises_desc: "Военнообязанные проходят периодические сборы и местные учения. Резерв можно быстро развернуть, однако уровень подготовки и организованности частей остаётся ограниченным."
 ADISCORD_training_standardized_program: "Единая программа подготовки"
 ADISCORD_training_standardized_program_desc: "Учебные части работают по единым нормативам и расписаниям. Армия становится предсказуемее, а командиры лучше понимают, чего ждать от пополнения."
 ADISCORD_training_officer_led_wargames: "Командно-штабные учения"
 ADISCORD_training_officer_led_wargames_desc: "Командиры учатся воевать на картах, сценариях и разборе ошибок. Это развивает планирование, но требует времени, штабов и спокойной подготовки."
 ADISCORD_training_accelerated_bootcamps: "Ускоренная военная подготовка"
 ADISCORD_training_accelerated_bootcamps_desc: "Новобранцы проходят сокращённую программу перед направлением в войска. Пополнение и мобилизация ускоряются, однако организованность подразделений снижается."
 ADISCORD_internal_security_neighborhood_watch: "Добровольные патрули"
 ADISCORD_internal_security_neighborhood_watch_desc: "Добровольные патрули и местные наблюдатели помогают поддерживать общественный порядок. Внутренняя устойчивость повышается, однако часть армейских ресурсов отвлекается от боевой подготовки."
 ADISCORD_internal_security_investigative_bureaus: "Политическая полиция"
 ADISCORD_internal_security_investigative_bureaus_desc: "Специальные органы расследуют деятельность организованной оппозиции и политически неблагонадёжных групп. Внутренний контроль усиливается вместе с полномочиями репрессивного аппарата."
 ADISCORD_internal_security_emergency_patrols: "Чрезвычайные патрули"
 ADISCORD_internal_security_emergency_patrols_desc: "В кризис улицы, узлы связи и склады берутся под усиленный контроль. Это помогает удержать страну, но забирает людей и ресурсы у обычной армии."
 ADISCORD_internal_security_internal_directorate: "Государственная служба безопасности"
 ADISCORD_internal_security_internal_directorate_desc: "Единая служба координирует полицию, гарнизоны и политический надзор. Внутренняя устойчивость усиливается, но содержание централизованного аппарата требует значительных ресурсов."
