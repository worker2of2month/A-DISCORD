l_russian:
 ADISCORD_sp_combat_robots:0 "Автономные боевые роботы"
 ADISCORD_sp_combat_robots_desc:0 "Бронированный шагающий автомат с автономным управлением огнём. Проект открывает отдельное производство боевых роботов и набор роботизированных батальонов; обычное пехотное оружие их не заменяет."
 ADISCORD_combat_robots:0 "Боевые роботы"
 ADISCORD_combat_robots_desc:0 "Батальон из 100 боевых роботов и 250 операторов, техников и снабженцев. Требует отдельного производства роботов и 20 комплектов полевого снаряжения поддержки."
 ADISCORD_combat_robot_equipment:0 "Боевые роботы"
 ADISCORD_combat_robot_equipment_short:0 "Боевые роботы"
 ADISCORD_combat_robot_equipment_desc:0 "Автономные бронированные автоматы с вооружением и управляющей электроникой. Производятся отдельно для роботизированных батальонов; требуют редких компонентов и сплавов."
 ADISCORD_combat_robot_equipment_1:0 "БР-61 «Страж»"
 ADISCORD_combat_robot_equipment_1_short:0 "БР-61"
 ADISCORD_combat_robot_equipment_1_desc:0 "Серийный боевой робот с бронекорпусом, парным автоматическим вооружением и защищённым блоком управления. Люди обеспечивают обслуживание, целеуказание и снабжение."
 ADISCORD_sp_power_shields:0 "Силовые щиты"
 ADISCORD_sp_power_shields_desc:0 "Переносной силовой щит защищает штурмовую группу при переходе между укрытиями и входе в занятые здания. Проект открывает производство щитов, набор щитового спецназа и дальнейшие улучшения в дереве технологий. Кефрейт, Партия и Шабрат также могут завершить проект своими национальными фокусами."
 ADISCORD_power_shields_template_tt:0 "Создаёт редактируемый шаблон §Yщитовой штурмовой дивизии§!: §Y10§! щитовых батальонов, сапёры и артиллерийская поддержка. Ширина фронта: §Y20§!; штат: §Y10600§! £manpower_texticon. Набор расходует национальные запасы, включая §Y200§! силовых щитов."
