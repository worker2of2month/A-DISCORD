 VAL_resource_war_active_tt:0 "Ресурсная война продолжается"
 VAL_trade_routes:0 "Торговые пути"
 VAL_trade_routes_desc:0 "Охрана: §Y[?VAL_corridor_security|0]/3§!. £ADISCORD_economy_trade_texticon Серый рынок: §Y[?VAL_black_market_pressure|0]/100§!.\nПосредники: §Y[?VAL_broker_dependence|0]/3§!. Изменение за неделю: §Y[?VAL_black_market_last_delta|=0]§!.\nСерый рынок съел за неделю: £ADISCORD_economy_treasury_texticon §Y[?VAL_black_market_loss_last_week|1]§!.\nВсего потеряно: £ADISCORD_economy_treasury_texticon §Y[?VAL_black_market_loss_total|1]§!.\nПороги и причины потерь - при наведении на карту."
 VAL_trade_map_tt:0 "Железнодорожные участки показаны со шпалами. Пунктир соединяет узлы без непрерывной железной дороги. Цвет обозначает работу договорного коридора. Наведите курсор на название направления под картой.\n\n§YСерый рынок§! уводит регулярный доход казны в подпольный оборот. Потери применяются к обычному бюджету, положительным еженедельным надбавкам и выплатам коридоров. Разовые награды, кредиты и возврат залогов не затрагиваются.\n\nДействует только текущая ступень:\n§Y0-24§!: без потерь.\n§Y25-49§!: доход §Y-10%§!; расходы на управление §Y+2%§!; стабильность §Y-1%§!.\n§Y50-74§!: доход §Y-25%§!; расходы на управление §Y+5%§!; стабильность §Y-3%§!.\n§Y75-100§!: доход §Y-50%§!; расходы на управление §Y+10%§!; стабильность §Y-6%§!; политвласть §Y-0.05/день§!.\n\n«За неделю» - недополученный доход за последний завершённый бюджетный период; «всего» - накопленные потери с начала учёта. Дополнительные расходы на управление сюда не входят. Прогнозы и открытие панели не увеличивают счётчики. Суммы у маршрутов уже учитывают текущие потери.\n\nЕженедельное изменение:\n- +3 за каждый потерянный ранее работавший маршрут;\n- +2 при войне, +3 при переполнении жилья;\n- +1 за каждый уровень зависимости от посредников;\n- -2, если все введённые маршруты работают и открыт хотя бы один;\n- -1 за каждый уровень охраны.\nПри значении от 50 и охране ниже 3 работающие пути отмечены как находящиеся под угрозой; сама отметка не останавливает маршрут, но доход уменьшается по указанной шкале."
 VAL_trade_map_legend:0 "§GРаботает§!  §YПод угрозой§!  §RОстановлен§!\nСерый пунктир - ещё не введён"
