 VAL_northern_export_reserved_tt: "£infantry_equipment_texticon §Y[VALGetExportRifleQuantity]§! винтовок будут зарезервированы на §Y21 день§!. Получатель примет или отклонит груз. Согласие принесёт £ADISCORD_economy_treasury_texticon §G[VALGetExportIncome]§!."
 VAL_northern_export_cancelled_tt: "Зарезервированные винтовки вернутся на склад. Затраты £political_power_texticon §Y10§! не возвращаются."
 VAL_northern_contacts_reserved_tt: "£ADISCORD_economy_treasury_texticon §Y50§! будут вложены в развитие сети на §Y21 день§!. Успех добавит §G2%§! торгового дохода."
 VAL_northern_contacts_cancelled_tt: "Вложенные £ADISCORD_economy_treasury_texticon §Y50§! вернутся. Затраты £political_power_texticon §Y10§! не возвращаются."
 VAL_CIN_influence: "Ступень сети посредников в Цини"
 VAL_OSF_influence: "Ступень сети посредников в Осфарии"
 VAL_cw_offer_contract_formations: "Предложить два контрактных полка Шабрату"
 VAL_cw_offer_contract_formations_desc: "Предложим сопротивлению два подготовленных пехотных полка с сапёрами и £infantry_equipment_texticon §Y3200§! винтовок в резерв за £ADISCORD_economy_treasury_texticon §Y100§!. Весь пакет потребует от Кефрейта £manpower_texticon §Y12600§! человек, £infantry_equipment_texticon §Y4420§! винтовок, §Y96§! комплектов вооружения отделений и §Y60§! единиц дополнительного оснащения. Полки останутся до завершения войны; их состав и набор закреплены. Расчёт состоится после согласия покупателя и повторной проверки запасов. Доступна и обычная поставка за §Y50§! казны."
 VAL_cw_formations_offer_tt: "Предложим два укомплектованных пехотных полка с сапёрами и £infantry_equipment_texticon §Y3200§! винтовок за £ADISCORD_economy_treasury_texticon §Y100§!. Полки будут отозваны после войны. До согласия сопротивления ресурсы остаются у Кефрейта. Общий расход: £manpower_texticon §Y12600§! человек, £infantry_equipment_texticon §Y4420§! винтовок, §Y96§! комплектов вооружения отделений и §Y60§! единиц дополнительного оснащения."
 VAL_cw_buy_formations_tt: "Перечислим Кефрейту £ADISCORD_economy_treasury_texticon §Y100§!. Получим два пехотных полка с сапёрами, по £manpower_texticon §Y6300§! человек в каждом; ещё £infantry_equipment_texticon §Y3200§! винтовок поступят на склад. Полки останутся до завершения войны; их состав и набор закреплены. Людей и оснащение оплачивает Кефрейт. Если условия изменились, расчёт отменяется."
 ADISCORD_STP_cw.50.full: "Кефрейт предлагает прислать два контрактных пехотных полка с сапёрами. Части прибудут подготовленными и полностью укомплектованными. Ещё 3200 винтовок поступят на склад для пополнения армии. Полки останутся до завершения войны; менять их состав и набирать новые по этому шаблону нельзя.\n\nЗа весь пакет Кефрейт просит 100 из нашей казны. Его правительство разрешило отправку, но деньги, люди и снаряжение будут переданы только после нашего согласия и повторной проверки запасов. Вступления Кефрейта в войну договор не предусматривает."
 ADISCORD_STP_cw.50.c: "Принять полки и поставку за 100 казны."
 ADISCORD_STP_cw.51.accepted_full: "Сопротивление перечислило 100 из своей казны. Два полностью укомплектованных контрактных полка с сапёрами перешли под его командование до завершения войны. Ещё 3200 винтовок отправлены на склад армии Шабрата. Люди и оснащение оплачены из ресурсов Кефрейта; договор исполнен."

 VAL_bulk_exports_tt: "Следующие северные продажи: £infantry_equipment_texticon §Y5000§! вместо §Y2500§!, выручка £ADISCORD_economy_treasury_texticon §G30§! вместо §Y15§!. Уже оплаченные партии не меняются."
 VAL_export_clearing_margin_tt: "Выручка следующих северных продаж: £ADISCORD_economy_treasury_texticon §G20§! за обычную партию, §G40§! за оптовую. Уже согласованная цена не меняется."
 VAL_export_rerouting_tt: "Если первый северный покупатель выбудет, оплаченный груз получит второй допустимый покупатель на прежних условиях. Если недоступны оба, сработает возврат оружия."
 VAL_EXPORT_RIFLES_2500: "2500"
 VAL_EXPORT_RIFLES_5000: "5000"
 VAL_EXPORT_INCOME_15: "15"
 VAL_EXPORT_INCOME_20: "20"
 VAL_EXPORT_INCOME_30: "30"
 VAL_EXPORT_INCOME_40: "40"

VAL_reclamation: "Возвращение земли"
 VAL_reclamation_desc: "Начнём с пострадавших районов самого Кефрейта. Дорожные работы, очистка воды и возвращение жителей идут последовательно: каждый этап занимает 90 дней и стоит £ADISCORD_economy_treasury_texticon §Y500§!.\n\nОдна подрядная служба ведёт только один проект. Завершённые работы остаются в штате при смене власти. Если работающий участок будет потерян, неиспользованный залог вернётся полностью; начать работы заново можно после возвращения контроля. Чистые районы не требуют повторной очистки."
 VAL_reclamation_survey: "Бюро восстановления"
 VAL_reclamation_survey_desc: "Составим карту повреждённых дорог, водозаборов и оставленных поселений. Подрядчики получат измеримый объём работ и оплату после сдачи участка."
 VAL_reclamation_road_crews: "Дорожные артели"
 VAL_reclamation_road_crews_desc: "Объединим дорожников и ремонтные бригады в постоянную службу. Опыт первых расчисток пригодится при строительстве путей по всей стране."
 VAL_reclamation_clean_water: "Чистая вода"
 VAL_reclamation_clean_water_desc: "Поселениям нужны очищенные водозаборы, стоки и почва, на которой можно строить. После восстановления подъездов подрядчики смогут перейти к санитарным работам."
 VAL_reclamation_workshops: "Заказы для мастерских"
 VAL_reclamation_workshops_desc: "Договоримся о серийном выпуске насосов, строительных деталей и ремонтного инструмента. Мастерские получат устойчивый спрос, а стройки — снабжение."
 VAL_reclamation_return_home: "Жильё для возвращающихся"
 VAL_reclamation_return_home_desc: "На подготовленных участках построим жильё и предприятия для тех, кто решит вернуться. Одного приказа недостаточно: каждому району нужен оплаченный проект заселения."
 VAL_reclamation_land_register: "Земельный кадастр"
 VAL_reclamation_land_register_desc: "Закрепим границы участков, ответственность подрядчиков и права новых жителей. Земельные споры больше не должны останавливать каждую следующую стройку."
 VAL_reclamation_road_crews_idea: "Дорожные артели"
 VAL_reclamation_road_crews_idea_desc: "Постоянные бригады строят и обслуживают дороги Кефрейта."
 VAL_reclamation_workshops_idea: "Строительные мастерские"
 VAL_reclamation_workshops_idea_desc: "Единые заказы на детали и инструмент ускоряют строительство и ремонт предприятий."
 VAL_reclamation_land_register_idea: "Земельный кадастр"
 VAL_reclamation_land_register_idea_desc: "Права на восстановленную землю закреплены, а строительные участки размежёваны."
 VAL_reclamation_recovered_land: "Восстановленная земля"
 VAL_reclamation_recovered_land_desc: "Завершённые работы компенсируют часть последствий разрушения. После третьего этапа исходные штрафы загрязнения полностью возмещены; результат остаётся в этом штате при смене владельца."
 VAL_reclamation_roads: "Расчистить подъезды в [FROM.GetName]"
 VAL_reclamation_roads_desc: "Первый этап: восстановим подъездные пути и вывезем опасные завалы. Утрата владения или контроля отменяет текущую работу с полным возвратом залога."
 VAL_reclamation_water: "Очистить воду и почву в [FROM.GetName]"
 VAL_reclamation_water_desc: "Второй этап после расчистки дорог: восстановим водозаборы и подготовим участки под застройку. Утрата владения или контроля отменяет текущую работу с полным возвратом залога."
 VAL_reclamation_settlement: "Вернуть жителей в [FROM.GetName]"
 VAL_reclamation_settlement_desc: "Третий этап после санитарных работ: построим гражданское предприятие и завершим восстановление района. Утрата владения или контроля отменяет текущую работу с полным возвратом залога."
 VAL_reclamation_roads_result_tt: "Через §Y90 дней§! в [FROM.GetName]: §G+1§! инфраструктура (при пределе — §G+1§! ячейка строительства). Компенсируется треть исходных штрафов загрязнения."
 VAL_reclamation_water_result_tt: "Через §Y90 дней§! в [FROM.GetName]: §G+2§! ячейки строительства. Компенсация исходных штрафов загрязнения вырастет до двух третей."
 VAL_reclamation_settlement_result_tt: "Через §Y90 дней§! в [FROM.GetName]: §G+1§! ячейка строительства и §G1 гражданская фабрика§!. Исходные штрафы загрязнения будут полностью компенсированы."
 VAL_reclamation_idle_tt: "Подрядная служба свободна: нет другого оплаченного проекта восстановления."
 VAL_reclamation_refund_tt: "Незавершённый этап отменяется; залог £ADISCORD_economy_treasury_texticon §Y500§! возвращается Кефрейту. Завершённые этапы сохраняются."
 VAL_reclamation_cost: "£ADISCORD_economy_treasury_texticon §Y500§!"
 VAL_reclamation_cost_blocked: "£ADISCORD_economy_treasury_texticon §R500§!"
 VAL_reclamation_cost_tooltip: "Залог: £ADISCORD_economy_treasury_texticon §Y500§!. При сдаче работ он становится оплатой; при отмене возвращается полностью."
 VAL_reclamation_has_work_tt: "Кефрейт владеет и управляет хотя бы одним загрязнённым домашним районом, в котором восстановление ещё не завершено."
 VAL_frontier_demand_CIN:0 "Ультиматум: Пепельное племя"
 VAL_frontier_demand_CIN_desc:0 "Передать окончательные условия пограничного соглашения. Ответ ожидается в течение 21 дня. Отказ позволяет начать войну или отозвать требования; одновременные ультиматумы исключены."
 VAL_frontier_demand_CIN_tt:0 "Требуемые земли: $STATE_58$, $STATE_59$, $STATE_60$. Форма управления определяется выбранной веткой фокусов: комиссариат или прямое управление. Без независимого победившего Шабрата в войну могут вступить Нодрул и партия Стеландера."
 VAL_frontier_demand_OSF:0 "Ультиматум: Союз костоломов"
 VAL_frontier_demand_OSF_desc:0 "Передать окончательные условия пограничного соглашения. Ответ ожидается в течение 21 дня. Отказ позволяет начать войну или отозвать требования; одновременные ультиматумы исключены."
 VAL_frontier_demand_OSF_tt:0 "Требуемые земли: $STATE_61$, $STATE_62$, $STATE_63$. Форма управления определяется выбранной веткой фокусов: комиссариат или прямое управление. Без независимого победившего Шабрата в войну могут вступить Нодрул и партия Стеландера."
 VAL_frontier_demand_APH:0 "Ультиматум: Антропофагорум"
 VAL_frontier_demand_APH_desc:0 "Передать окончательные условия пограничного соглашения. Ответ ожидается в течение 21 дня. Отказ позволяет начать войну или отозвать требования; одновременные ультиматумы исключены."
 VAL_frontier_demand_APH_tt:0 "Требуемые земли: $STATE_64$, $STATE_65$. Форма управления определяется выбранной веткой фокусов: комиссариат или прямое управление. Без независимого победившего Шабрата в войну могут вступить Нодрул и партия Стеландера."
 VAL_frontier_demand_ERT:0 "Ультиматум: Восточные территории"
 VAL_frontier_demand_ERT_desc:0 "Передать окончательные условия пограничного соглашения. Ответ ожидается в течение 21 дня. Отказ позволяет начать войну или отозвать требования; одновременные ультиматумы исключены."
 VAL_frontier_demand_ERT_tt:0 "Требуемые земли: $STATE_168$. При согласии штат возвращается Кефрейту."
 VAL_frontier_conference:0 "Послевоенная конференция"
 VAL_frontier_conference_desc:0 "Победитель в Стеландере определил новую границу возможностей. Прежде чем посылать требования соседям, правительство должно согласовать цели с капитанами и оценить позицию Нодрула."
 VAL_frontier_logistics:0 "Снабжение экспедиционных сил"
 VAL_frontier_logistics_desc:0 "Дальняя война потребует собственных складов, ремонтных команд и оборотного запаса грузовиков. Снабженческие службы получают единый порядок перевозок."
 VAL_frontier_commissioners:0 "Полномочные комиссары"
 VAL_frontier_commissioners_desc:0 "Местные учреждения сохранят повседневную работу, но договоры и безопасность перейдут под надзор наших комиссаров. Ультиматум потребует подчинения, а не ликвидации государства."
 VAL_frontier_provincial_offices:0 "Провинциальные управления"
 VAL_frontier_provincial_offices_desc:0 "Требуемые районы войдут в единую систему налогов, снабжения и воинского учёта. Такое предложение труднее принять, зато правительству не придётся делить ответственность с местными властями."
 VAL_frontier_return_irem:0 "Возвращение восточного участка"
 VAL_frontier_return_irem_desc:0 "Переданный восточной администрации район остаётся частью нашего пограничного хозяйства. Мы готовы договориться о его возвращении, не предъявляя прав на остальные земли соседей."
 VAL_frontier_field_hospitals:0 "Эвакуационные колонны"
 VAL_frontier_field_hospitals_desc:0 "Опыт горных походов показывает цену каждой задержки. Подвижные госпитали и эвакуационные маршруты позволят ротам восстанавливать порядок после тяжёлого боя."
 VAL_frontier_security_plan:0 "Условия безопасности"
 VAL_frontier_security_plan_desc:0 "Передать соседям точные требования и дать срок для ответа. Если Шабрат не создал независимый буфер, за спиной племён могут встать Нодрул и партия. Генералы обязаны учитывать войну с ними ещё до отправки ультиматума."
 VAL_frontier_treaty_offices:0 "Исполнение договора"
 VAL_frontier_treaty_offices_desc:0 "Военная победа не заменяет работающие учреждения. После подписания соглашения контрактное ведомство закрепит торговые маршруты и порядок расчётов с новыми районами."
 VAL_frontier_defence_coalition:0 "Пограничная коалиция"
 VAL_frontier:0 "Пограничные договоры"
 VAL_frontier_desc:0 "После войны в Стеландере Кефрейт может добиваться нового устройства границ. Один ультиматум рассматривается за раз.\n\nБез независимого Шабрата Нодрул и победившая партия могут защитить племена. Победа требует занять заявленные районы; если вступили гаранты, понадобится также сломить сопротивление Стеландера (25% капитуляции), а при его отсутствии — Нодрула.\n\nПри 65% капитуляции Кефрейта генералы предложат Нодрулу перемирие с уступкой Приграничья и Эрстантпео. Полное поражение означает смену правительства."
 VAL_frontier_treaty_signed:0 "Подписано пограничное соглашение"
 VAL_frontier_idle_tt:0 "Нет другого неурегулированного ультиматума или пограничной войны."
 VAL_frontier_ultimatum_deadline:0 "Ответ на ультиматум"
 VAL_frontier_ultimatum_deadline_desc:0 "По истечении срока молчание будет сочтено отказом. Решение о войне остаётся за правительством Кефрейта."
 VAL_frontier_commissioners_tt:0 "При принятии ультиматума или победе племенная страна станет кефрейтским комиссариатом. Её территории не аннексируются. При посторонних завоеваниях или чужой оккупации договор ограничивается прямой передачей доступных заявленных районов; сторонние владения не входят в комиссариат."
 VAL_frontier_provinces_tt:0 "Условия ультиматума предусматривают передачу только перечисленных районов непосредственно Кефрейту."
 VAL_frontier_accept_tt:0 "Будут выполнены территориальные условия ультиматума: возврат района, подчинение комиссариату или передача перечисленных земель, согласно требованию Кефрейта."
 VAL_frontier_war_tt:0 "Кефрейт объявит войну выбранному адресату ультиматума. Если Шабрат не удержал независимый Стеландер, Нодрул и победившая партия могут вступить на стороне племён. После занятия требуемых районов и поражения гарантов будет заключён ограниченный мир."
 VAL_frontier_armistice_tt:0 "Пограничная война закончится. Приграничье и Эрстантпео перейдут партии Стеландера, если она участвовала в этой войне; остальные территории сохраняют своих владельцев. Кефрейт останется независимым."
 VAL_frontier_refuse_peace_tt:0 "Война продолжится. Полное поражение Кефрейта позволит создать зависимую партийную администрацию Допотройдска."
 VAL_frontier_medical_bonus:0 "Эвакуационные колонны"
 VAL_frontier_industry_bonus:0 "Переоснащение пустующих цехов"
 val_rework.100.t:0 "Покупатель исчез"
 val_rework.100.d:0 "Ведомость западных отгрузок вернулась почти пустой. Старые адресаты больше не отвечают, подписи посредников ничего не гарантируют, а вагоны с оплаченной продукцией стоят на запасных путях.\n\nБольшие покупатели ушли вместе с прежним Воркерландом. В течение полугода бюджет будет нести дополнительные потери от сорванных договоров. Затем останется новая реальность: работать придётся без старого экспортного рынка."
 val_rework.100.a:0 "Сохранить производство."
 val_rework.111.t:0 "Требования отклонены"
 val_rework.111.d:0 "Ответ не оставляет места для прежних условий. Капитаны готовы обсуждать операцию, но за племенными границами стоят интересы больших соседей. Независимая победа Шабрата закрывает им прямой путь к вмешательству; власть партии означает риск войны также с Нодрулом.\n\nОтзыв ультиматума сохранит мир. Приказ о наступлении обяжет правительство довести дело до военного соглашения."
 val_rework.113.t:0 "Предложение кефрейтских генералов"
 val_rework.113.d:0 "Кефрейтское командование предлагает остановить наступление. Генералы готовы вернуть партии Приграничье и Эрстантпео, отозвать экспедицию и признать прежнее положение остальных границ.\n\nСолгалов сохранит государство, но потеряет спорные районы. Отказ означает продолжение войны до смены власти в самом Кефрейте."
 val_rework.115.t:0 "Пограничное соглашение"
 val_rework.115.d:0 "На столе лежит подписанный договор. Военные представители сверяют районы передачи, а чиновники готовят порядок снабжения и управления. Остальные владения участников не включены в соглашение.\n\nТеперь правительству предстоит превратить выполненные требования в устойчивые торговые связи."
 val_rework.115.a:0 "Открыть договорные управления."
 val_rework.116.t:0 "Подписи под прекращением огня"
 val_rework.116.d:0 "Приказы о прекращении огня переданы штабам. Вопрос о спорных районах решён условиями соглашения, а части возвращаются к своим линиям снабжения. Цена кампании ещё долго будет видна в ведомостях казны и ротных списках."
 val_rework.116.a:0 "Начать восстановление."
 val_rework.110.t:0 "Ультиматум Кефрейта"
 val_rework.110.ert:0 "Кефрейт требует вернуть район, который ранее находился под его управлением: $STATE_168$. На остальные земли восточной администрации требования не распространяются.\n\nПравительство даёт срок для ответа. Согласие завершит спор передачей района; отказ оставит Кефрейту выбор между отступлением и войной."
 val_rework.110.commission:0 "Кефрейт требует признать верховенство своего комиссариата. Местные учреждения сохранят территорию и повседневную работу, но внешний курс и условия хозяйственных договоров будут определяться под надзором кефрейтской администрации.\n\nОтказ может привести к войне. Если Стеландер остался у партии, Кефрейту придётся считаться также с её интересами и Нодрулом.\n\nПри наличии посторонних завоеваний соглашение ограничится передачей заявленных племенных районов; остальные владения не войдут в него."
 val_rework.110.direct:0 "Кефрейт требует передать перечисленные в пограничном договоре районы под прямое провинциальное управление. Для племенного государства это означает потерю его основной территории.\n\nОтказ может привести к войне. Правительству придётся решить, помогут ли соседи сохранить независимость."
 val_rework.110.no:0 "Отклонить требования."
 val_rework.110.yes:0 "Принять условия."
 val_rework.closed:0 "Вопрос уже решён."
 val_rework.111.withdraw:0 "Отозвать ультиматум."
