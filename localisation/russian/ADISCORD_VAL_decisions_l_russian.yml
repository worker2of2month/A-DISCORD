 VAL_sign_annual_trade:0 "Торговый договор: [FROM.GetName]"

 VAL_sign_annual_trade_desc:0 "Договор на 365 дней. Доход Кефрейта: [VALTradeDecisionIncome] казны в неделю; партнёра: 1. Стоимость решения — 100 политической власти. При отказе, отсутствии ответа или невозможности заключения плата возвращается. После подписания договор исчезнет из списка до окончания срока."

 VAL_trade_decision_terms_tt:0 "Отправить предложение годового торгового договора. Стоимость уже учтена в решении; при согласии повторного списания нет, при отказе плата возвращается."

 VAL_trade_fee_prepaid:0 "Плата 100 политвласти внесена Кефрейтом при отправке предложения; при отказе она возвращается."

 VAL_trade_fee_legacy:0 "Это ранее отправленное предложение: Кефрейт потратит 100 политвласти только при согласии."

 VAL_trade_decision_available_tt:0 "Достаточно политвласти; с партнёром нет действующего договора, войны, ожидания ответа или паузы между обращениями."

 VAL_hire_partner_volunteers:0 "Нанять добровольцев: [FROM.GetName]"

 VAL_hire_partner_volunteers_desc:0 "Получить £manpower_texticon [VALHireDecisionPeople] человек из резерва партнёра за £ADISCORD_economy_treasury_texticon [VALHireDecisionPrice] казны.\n\nПри отправке предложения цена резервируется в казне Кефрейта. Партнёр получает деньги только после согласия и передачи людей. При отказе, истечении срока или срыве условий резерв возвращается. Повторный наём у этой страны — через 365 дней после сделки."

 VAL_hire_funds_tt:0 "В казне Кефрейта есть £ADISCORD_economy_treasury_texticon [VALHireDecisionPrice]."

 VAL_hire_reserve_tt:0 "В резерве партнёра есть £manpower_texticon [VALHireDecisionPeople] человек."

 VAL_hire_offer_ready_tt:0 "Обе стороны могут заключить договор; завершились пауза между наймами, срок между обращениями и ожидание ответа."

 VAL_hire_decision_result_tt:0 "Предложить партнёру передать £manpower_texticon [VALHireDecisionPeople] человек за £ADISCORD_economy_treasury_texticon [VALHireDecisionPrice] казны. Цена резервируется при отправке предложения; расчёт — после согласия. При срыве сделки резерв возвращается."

 VAL_quarterly_partner_supply:0 "Квартальные поставки: [FROM.GetName]"

 VAL_quarterly_partner_supply_desc:0 "Выбрать норматив: 25000 / 50000 / 100000 / 200000 винтовок в квартал за 500 / 1000 / 2250 / 5000 казны за партию. Доступные объёмы зависят от завершённых фокусов.\n\nЧетыре поставки за год. Оформление — £pol_power 100 после согласия покупателя; выбор норматива бесплатен. Аванса нет, оплата поступает при отгрузке. Нужны свободное место и открытый коридор. При срыве срока — 15 дней отсрочки, затем расторжение."

 VAL_quarterly_decision_ready_tt:0 "Есть 100 политвласти, свободное место и открытый коридор; нет задолженности по возвратам, действующего поставочного договора с этим покупателем или ожидания ответа."

 VAL_quarterly_decision_result_tt:0 "Открыть выбор квартального норматива. Предложение покупателю отправится после выбора партии."

 VAL_ready_partner_supply:0 "Продать готовое оружие: [FROM.GetName]"

 VAL_ready_partner_supply_desc:0 "Разовая поставка из имеющихся запасов: 25000 / 50000 / 100000 / 200000 винтовок за 500 / 1000 / 2250 / 5000 казны. Выбор партии бесплатен. Оружие и полная оплата передаются после согласия покупателя. Нужны открывающий фокус, свободное экспортное место, запасы Кефрейта и деньги покупателя."

 VAL_ready_decision_ready_tt:0 "Доступна хотя бы одна открытая фокусом партия: хватает оружия и денег покупателя, свободно место, нет остановленного коридора или ожидания ответа."

 VAL_ready_decision_result_tt:0 "Выбрать размер разовой поставки и отправить предложение покупателю."

