 VAL_ops_cin_contract: "Контракт в Цини"
 VAL_ops_cin_contract_desc: "Выберем одно направление работы в Цини. После оплаты посредник ответит через 21 день: согласие поднимет сеть на одну ступень, отказ вернёт казну. Одновременно можно вести только одну внешнюю операцию."
 VAL_ops_cin_contract_tt: "Откроется выбор семейства контракта. Цена: £political_power_texticon §Y10§! и £ADISCORD_economy_treasury_texticon §Y50§!. Через 21 день Цинь примет или отклонит предложение. Отказ вернёт казну."
 VAL_ops_osf_contract: "Контракт в Осфарии"
 VAL_ops_osf_contract_desc: "Выберем одно направление работы в Осфарии. После оплаты посредник ответит через 21 день: согласие поднимет сеть на одну ступень, отказ вернёт казну. Одновременно можно вести только одну внешнюю операцию."
 VAL_ops_osf_contract_tt: "Откроется выбор семейства контракта. Цена: £political_power_texticon §Y10§! и £ADISCORD_economy_treasury_texticon §Y50§!. Через 21 день Осфария примет или отклонит предложение. Отказ вернёт казну."
 VAL_ops_aph_contract: "Контракт в Антропофагоруме"
 VAL_ops_aph_contract_desc: "Выберем одно направление работы у Антропофагорума. После оплаты посредник ответит через 21 день: согласие поднимет сеть на одну ступень, отказ вернёт казну. Одновременно можно вести только одну внешнюю операцию."
 VAL_ops_aph_contract_tt: "Откроется выбор семейства контракта. Цена: £political_power_texticon §Y10§! и £ADISCORD_economy_treasury_texticon §Y50§!. Через 21 день Антропофагорум примет или отклонит предложение. Отказ вернёт казну."
 VAL_ops_family_market_tt: "Изучение рынка. При согласии сеть посредников вырастет на §Y1§! ступень, торговый доход - на §G2%§!."
 VAL_ops_family_arms_tt: "Оружейное посредничество. При согласии сеть посредников вырастет на §Y1§! ступень, торговый доход - на §G2%§!."
 VAL_ops_family_infra_tt: "Инфраструктурная концессия. При согласии сеть посредников вырастет на §Y1§! ступень, торговый доход - на §G2%§!."
 VAL_ops_family_captain_tt: "Наём местного капитана. При согласии сеть посредников вырастет на §Y1§! ступень, торговый доход - на §G2%§!."
 VAL_ops_family_terms_tt: "Отдельные условия. При согласии сеть посредников вырастет на §Y1§! ступень, торговый доход - на §G2%§!."
 val_contract.10.t: "Контракт для Цини"
 val_contract.10.d: "Посредники ждут указания, какую сделку вести. Оплата списывается сразу; ответ придёт через 21 день. Отказ вернёт казну, политические затраты останутся."
