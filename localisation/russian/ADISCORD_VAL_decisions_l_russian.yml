 VAL_reserves_title_aftermath: "Резервы после раскола"
 VAL_steel_title_trade: "Контракты на производство"
 VAL_steel_title_victory: "Арсеналы после победы"
 VAL_steel_title_review: "Пересмотр обязательств"
 VAL_stelander_status_defeated: "Кефрейт потерпел поражение. Прежний внешнеполитический курс закрыт."
 VAL_stelander_status_secured: "Окцидийская база закреплена. Доступен переход к договорной администрации и последующей интеграции при выполнении условий этих фокусов."
 VAL_stelander_status_repelled: "Окцидийская кампания закончилась поражением. Военный курс сам по себе не даёт наград за победу."
 VAL_stelander_status_campaign: "Идёт война с Союзом Возрождения Окцидии. Результат определяется войной, а не завершением фокуса."
 VAL_stelander_status_mobilizing: "Идёт 21-дневная мобилизация против Окцидии. Поставки сопротивлению не отменяют отдельную кампанию."
 VAL_stelander_status_settled: "Окцидийская кампания урегулирована. Итоговые награды зависят от исполненных поставок и реально удержанных районов."
 VAL_stelander_status_neutral: "Выбран нейтралитет: оружие и части остаются дома. Ветви поставок и вмешательства закрыты этим выбором."
 VAL_stelander_status_civil_war: "Сопротивление воюет с партийным правительством. Поставки требуют согласия покупателя и наличия ресурсов. Приказ о походе в Окцидию доступен не раньше 60-го дня после раскола и требует отдельной мобилизации."
 VAL_stelander_status_aftermath: "Стеландская гражданская война больше не идёт. Окно поставок сопротивлению закрыто; возможность отдельной окцидийской кампании определяется текущими условиями."
 VAL_stelander_status_prewar: "Гражданская война в Стеландере ещё не началась. Кризисная ветка откроется с началом боевых действий."
 VAL_arms_desc_delivered: "Поставки оплачены и исполнены. Закрепим полученный опыт и подготовим производственные контракты. Этот фокус не выдаёт оружие второй раз и не возобновляет закрытую сделку."
 VAL_arms_desc_war: "Пока сопротивление воюет с партийным правительством, предложим ему оружие или договорные формирования. Покупатель должен согласиться на цену; передаются реальные запасы и подготовленные части. Поставки совместимы с отдельной кампанией против Окцидии."
 VAL_arms_desc_aftermath: "Подведём итоги выбранного торгового курса и используем полученные полевые сведения. Новые поставки по программе гражданской войны уже недоступны. Производственное расширение потребует исполненного договора либо закреплённой окцидийской базы."
 VAL_passes_desc_secured: "Окцидийская база находится под нашим управлением. Сведём полевые отчёты и подготовим оформление завоеваний. Этот фокус не начинает войну повторно; договорная администрация и интеграция оформляются отдельно."
 VAL_passes_desc_review: "Военная кампания уже завершена. Сведём затраты и полевые отчёты. Сам выбор вмешательства не означает победу и не даёт права на чужие территории."
 VAL_passes_desc_war: "Кампания в Окцидии идёт. Согласуем работу штабов и обобщим боевой опыт. Мир и территориальные приобретения зависят от реального военного результата."
 VAL_passes_desc_prepare: "Подготовим командование к отдельной войне с Союзом Возрождения Окцидии. Приказ о 21-дневной мобилизации доступен спустя 60 дней после раскола Стеландера, пока сохраняется окно вмешательства. Победивший Стеландер может начать собственную подготовку спустя 90 дней после окончания гражданской войны и временно закрыть наше окно. Победа создаёт договорную администрацию из удержанных районов; соглашение по Ливонину урегулируется отдельно, без изъятия земель третьих стран."
 VAL_stelander_focus_unlocked_tt: "§YОткрыта стеландская кризисная ветка национальных фокусов.§! Вводный фокус занимает §Y14 дней§!, затем доступны курсы поставок, операции на перевалах или сохранения резервов — по §Y21 дню§!. Уже принятое правительством решение ограничивает выбор. Названия и описания меняются по текущей ситуации; окончание гражданской войны не скрывает итоговую ветку.\n\n[ROOT.VALGetStelanderCrisisStatus]"
 VAL_stelander_focus_current_status_tt: "[ROOT.VALGetStelanderCrisisStatus]"
 VAL_nod_ultimatum:0 "Ультиматум Нодрула: 100 дней"
 VAL_nod_ultimatum_desc:0 "Нодрул требует прекратить войну с северным альянсом. От получения ультиматума у Кефрейта есть §Y100 дней§!, чтобы разгромить всех участвующих каннибалов. Захвата одного союзника недостаточно.\n\nРазгром коалиции и выполнение территориальной цели закрывают угрозу. Если срок истечёт раньше, Нодрул вступит на стороне каннибалов в ту же войну; победившая партия Стеландера может присоединиться как его союзник. Мир, подчинение Кефрейта или устранение угрозы Нодрула отменяют миссию."
 VAL_nod_ultimatum_success_tt:0 "Северная коалиция разгромлена. Угроза вмешательства Нодрула закрывается; начинается урегулирование кампании."
 VAL_nod_ultimatum_timeout_tt:0 "Если северная коалиция ещё не разгромлена, Нодрул вступит в её войну против Кефрейта. Срок отсчитывается с получения ультиматума, а не с нажатия ответа."
 val_rework.118.t:0 "Ультиматум Нодрула"
 val_rework.118.d:0 "Посланник Нодрула передал Солгалову короткое требование: остановить экспедицию против северных племён. Требование подкреплено прямой угрозой: если война затянется, Нодрул вмешается на стороне каннибалов.\n\nШтаб получил сто дней с момента вручения ультиматума. За этот срок нужно разгромить весь участвующий северный альянс: падение одного его члена не завершит кампанию. До истечения срока Нодрул не вступает в эту войну по ультиматуму.\n\nОтсчёт уже начался. Задержка ответа не даст армии дополнительного времени."
 val_rework.118.a:0 "Передать срок штабу."
 val_rework.120.t:0 "Южный Цайген отнят"
 val_rework.120.d:0 "Первые надёжные донесения из Южного Цайгена пришли после рассвета. Колонны ERT вошли в город во время распада Воркерланда, заняли станцию и административные здания и сняли кефрейтские реестры раньше, чем пограничное командование успело отреагировать.\n\nНи один договор не передавал им этот район. Ни один контракт не освобождал его от наших обязательств. Карта изменилась только потому, что чужие солдаты оказались там первыми. В Цайгене и в кабинете теперь задают один вопрос: когда мы вернёмся?\n\nОтвет Солгалова короток. Южный Цайген не будущая добыча. Это незаконченный счёт."
 val_rework.120.a:0 "Мы вернём его."
 VAL_nod_ultimatum_objective_tt:0 "Все участвующие северные племена разгромлены, а территориальная цель кампании обеспечена. Освобождённого союзника нужно разгромить снова."
 VAL_nod_ultimatum_cancel_tt:0 "Кампания закрыта, Кефрейт капитулировал или утратил независимость, либо Нодрул больше не может предъявлять эту угрозу."

 VAL_subcontract_quarterly_norm:0 "Оплатить независимый подряд"

 VAL_subcontract_quarterly_norm_desc:0 "Заплатить 1000 из казны за исполнение заказа независимыми мастерскими. Наши винтовки останутся на складах, а контрактная репутация сохранится. Этот вариант не повышает репутацию и не даёт военного опыта. Выбор закрывает остальные способы исполнения текущего квартала."

 VAL_quarterly_delivery_result_tt:0 "В конце квартала: §G+1§! ступень репутации (до максимума), §G15§! опыта армии и §G15§! командного ресурса. Повторная оплата этого квартала исключена."

 VAL_quarterly_subcontract_result_tt:0 "Заказ исполнен подрядчиками: репутация сохранится без военной награды. Текущий срок квартала не меняется."

 VAL_reclamation_industrial_sites:0 "Предприятия на восстановленной земле"

 VAL_reclamation_industrial_sites_desc:0 "Очистка должна вернуть району работу. На восстановленных и размежёванных участках предложим оплаченные заказы на два гражданских предприятия. Каждый регион получает собственный договор: несколько площадок можно строить одновременно."

 VAL_reclamation_industry:0 "Построить предприятия в восстановленном районе"

 VAL_reclamation_industry_desc:0 "После трёх этапов восстановления вложить 1000 казны на 60 дней: два дополнительных строительных места и два гражданских предприятия. Требуются владение, контроль и не более 18 гражданских фабрик. При утрате условий залог возвращается полностью. Один промышленный договор на регион."

 VAL_reclamation_industry_result_tt:0 "В целевом регионе появятся §G2§! строительных места и §G2§! гражданских предприятия. Работы в других регионах могут идти параллельно."
 VAL_focus_reclamation_roads_preview_tt:0 "§YЧто делает решение:§! запускает в загрязнённом регионе §Y90-дневную§! расчистку за £ADISCORD_economy_treasury_texticon §Y500§!. После завершения: §G+1§! инфраструктура (или §G+1§! строительная ячейка при пределе) и компенсация §G1/3§! исходных штрафов загрязнения."
 VAL_focus_reclamation_water_preview_tt:0 "§YЧто делает решение:§! после дорожного этапа запускает §Y90-дневную§! очистку воды и почвы за £ADISCORD_economy_treasury_texticon §Y500§!. После завершения: §G+2§! строительные ячейки, а компенсация исходных штрафов загрязнения вырастет до §G2/3§!."
 VAL_focus_reclamation_settlement_preview_tt:0 "§YЧто делает решение:§! после очистки запускает §Y90-дневный§! этап возвращения жителей за £ADISCORD_economy_treasury_texticon §Y500§!. После завершения штрафы загрязнения снимаются полностью, регион получает §G+1§! строительную ячейку и §G+1§! гражданское предприятие, если их меньше 20."
 VAL_focus_reclamation_industry_preview_tt:0 "§YЧто делает решение:§! после полного восстановления позволяет вложить £ADISCORD_economy_treasury_texticon §Y1000§! на §Y60 дней§! и получить в выбранном регионе §G+2§! строительные ячейки и §G+2§! гражданских предприятия."

 VAL_reclamation_stage_1_tt:0 "Хотя бы в одном нашем контролируемом регионе завершены: дорожный этап."

 VAL_reclamation_stage_2_tt:0 "Хотя бы в одном нашем контролируемом регионе завершены: очистка воды."

 VAL_reclamation_stage_3_tt:0 "Хотя бы в одном нашем контролируемом регионе завершены: все три этапа восстановления."

 VAL_cost_treasury1000:0 "£ADISCORD_economy_treasury_texticon §Y1000§!"

 VAL_cost_treasury1000_blocked:0 "£ADISCORD_economy_treasury_texticon §R1000§!"

 VAL_cost_treasury1000_tooltip:0 "£ADISCORD_economy_treasury_texticon §Y1000§!"

 VAL_reclamation_industry_refund_tt:0 "Промышленный проект отменён: Кефрейту возвращается 1000 казны. Восстановленная земля сохраняется."

 VAL_QUARTERLY_SUBCONTRACTED:0 "§GИсполнено: независимый подряд.§! В конце квартала репутация сохранится."

 VAL_QUARTERLY_DELIVERED:0 "§GИсполнено: собственная поставка.§! Военная награда и рост репутации будут начислены в конце квартала."

 VAL_QUARTERLY_PENDING:0 "§YЗаказ ещё не исполнен.§!"

VAL_reclamation_industry_available_tt:0 "Регион принадлежит нам и контролируется нами, завершены три этапа восстановления, гражданских предприятий не более 18."

 VAL_negotiate_yubora:0 "Согласовать будущее Юбории"
 VAL_negotiate_yubora_desc:0 "Фронтир пережил северную войну, но Юбория осталась под властью Нодрула. Предложим совместный поход и раздел послевоенных полномочий: две юборские администрации получат покровительство Фронтира, две нодрульские — Кефрейта. Договор можно заключить и во время войны."
 VAL_nod_frontier_offer_possible_tt:0 "Фронтир независим, находится в мире с Кефрейтом и не состоит в союзе с Нодрулом; Нодрул победил в северной войне и удерживает Юборию."
 VAL_nod_frontier_no_pending_tt:0 "Нет незавершённых переговоров с Фронтиром или подготовки другой операции."
 VAL_nod_frontier_terms_tt:0 "Фронтир вступит на стороне Кефрейта в его войну против Нодрула. После победы две юборские договорные администрации — Исхайт и Дучебия — переходят под покровительство Фронтира. Нодрульский протекторат и Эсносская администрация остаются под Кефрейтом. Передача требует, чтобы Фронтир сохранял независимость и мир с Кефрейтом."
 VAL_frontier_refusal_war_tt:0 "Фронтир объявит войну Кефрейту. Договорные администрации Кефрейта вступят на его стороне."
 val_contract.350.t:0 "Два берега одного договора"
 val_contract.350.d:0 "Кефрейт готовит операцию против Нодрула и предлагает заранее определить, кто будет распоряжаться освобождённой Юборией. Его представители согласны оставить Исхайт и Дучебию в сфере Фронтира. Ашия, Куссингтон и Эснос перейдут под договорное управление Кефрейта.\n\nЕдиной Юбории договор не обещает: вместо неё появятся две местные администрации с общим покровителем. Но их внешняя политика и обязательства будут зависеть от нас, а не от нового победителя Нодрула. Отказ оставляет нам свободу потребовать иные условия после войны — без гарантии, что Кефрейт тогда уступит. Приняв договор, Фронтир обязуется вступить в войну на стороне Кефрейта, с началом его операции против Нодрула или немедленно, если война уже идёт."
 val_contract.350.refuse:0 "Мы не станем заранее признавать этот раздел."
 val_contract.350.accept:0 "Принять предложенные условия раздела."
 val_contract.351.t:0 "Ответ Фронтира"
 val_contract.351.accepted:0 "Фронтир принял договор и обязался вступить в войну против Нодрула вместе с Кефрейтом. После победы Исхайт и Дучебия перейдут под его покровительство. Нодрульский протекторат и Эсносская администрация останутся под Кефрейтом.\n\nЕсли Кефрейт уже воюет с Нодрулом, Фронтир присоединяется немедленно; иначе он выступит с началом операции. Земли не передаются заранее: договор определяет, кто примет управление после победы."
 val_contract.351.refused:0 "Фронтир не принял предварительный договор. Кефрейт может продолжить подготовку операции самостоятельно. Однако победа над Нодрулом не погасит юборский вопрос: после войны Фронтир сможет потребовать передачи обеих юборских администраций."
 val_contract.351.a:0 "Учитываем это в подготовке операции."
 val_contract.352.t:0 "Фронтир требует Юборию"
 val_contract.352.d:0 "Нодрул побеждён, но Фронтир не признаёт Кефрейт его наследником в Юбории. Посланники напоминают о прежней северной войне: поражение Юбории дало Нодрулу власть над ней, а не право передать эту власть следующему победителю.\n\nТребование касается двух администраций — Исхайта и Дучебии. Их границы и местные учреждения сохраняются; покровительство должно перейти Фронтиру. Нодрульский протекторат и Эсносская администрация остаются у Кефрейта.\n\nНа ответ отведён двадцать один день. Уступка завершит спор без войны. Отказ означает новую войну, теперь уже с Фронтиром. Если ответа не последует, делегация Кефрейта подпишет передачу."
 val_contract.352.accept:0 "Передать обе юборские администрации Фронтиру."
 val_contract.352.refuse:0 "Мы не уступим. Пусть попробуют забрать."
 val_contract.352.obsolete:0 "Прежние условия больше не действуют."
 val_contract.348.partition:0 "Вместо единой нодрульской системы учреждены четыре договорные администрации. Ашия и Куссингтон остаются в Нодрульском протекторате; Эснос, Бриоланд и Трея получают отдельный совет. На юборских землях управление разделено между Исхайтом и Дучебией.\n\nКоролевские знаки в Нодруле сменяет договорный флаг с северным солнцем и оливковой ветвью. Местные учреждения и уцелевшие войска сохраняются, но внешняя политика переходит покровителям. При заключённом договоре обе юборские администрации отходят Фронтиру; без договора они остаются у Кефрейта, и юборский вопрос ещё может привести к конфликту."
 ECA:0 "Эсносская договорная администрация"
