 NKA:0 "Северная договорная администрация"
 NKA_DEF:0 "Северная договорная администрация"
 NKA_ADJ:0 "Севернокефрейтск."
 NKA_Contract_Council:0 "Виктор Карст"
 autonomy_VAL_contract_administration:0 "Договорная администрация Кефрейта"
 VAL_create_northern_administration:0 "Оформить Северную договорную администрацию"
 VAL_create_northern_administration_desc:0 "Антолла, Фарейн и Химбер составят собственный ресурсный пояс Кефрейта. Пять остальных северных регионов объединятся в зависимую администрацию со столицей в Килнете. Договор передаёт Кефрейту 15% гражданских и 30% военных заводов, предоставляет 35% долю рекрутов в колониальных шаблонах и льготный доступ к сырью. Администрация сохраняет собственную армию."
 VAL_northern_administration_ready_tt:0 "Все восемь северных регионов принадлежат и подконтрольны Кефрейту или его подчинённым; Кефрейт и племенные государства находятся в мире. Администрация ещё не существует либо остаётся нашей мирной марионеткой и владеет частью ресурсного пояса. Для создания хотя бы один из пяти передаваемых регионов должен принадлежать Кефрейту либо стране с более чем одним регионом."
 VAL_northern_administration_tt:0 "Антолла, Фарейн и Химбер переходят под прямое владение Кефрейта. Медрон, Хеланд, Милхам, Килнет и Хебтава образуют Северную договорную администрацию с особым договорным статусом. Столица - Килнет. Владения вне восьми северных регионов не передаются."
 val_contract.346.t:0 "Северная договорная администрация"
 val_contract.346.d:0 "В Килнете собрали представителей пяти северных регионов и положили перед ними один общий устав. Антолла, Фарейн и Химбер Кефрейт оставляет под прямым управлением, считая их сырьевые предприятия частью собственной хозяйственной базы. Остальным территориям предлагают местную администрацию, собственный кадровый учёт и сохранение частей, если те войдут в новый договорный порядок.\n\nСистема намеренно устроена не как обычная оккупация. Местные чиновники остаются на местах, но внешняя политика и ключевые хозяйственные решения больше не являются их самостоятельным делом. Кефрейт получает долю производственных мощностей, право строить и льготный доступ к торговле.\n\nНа карте появляется Северная договорная администрация. В реестре она выглядит как клиент. Для жителей это будет государство, которое продолжает говорить местными голосами, но подписывает самые важные бумаги чужой печатью."
 val_contract.346.a:0 "Утвердить единую администрацию."
 OCA:0 "Окцидская договорная администрация"
 OCA_DEF:0 "Окцидская договорная администрация"
 OCA_ADJ:0 "Окцидск."
 OCA_Contract_Council:0 "Временная административная коллегия"
 VAL_Occidian_Registries:0 "Перепись окцидских округов"
 VAL_Occidian_Registries_desc:0 "Временная администрация должна восстановить земельные книги, учёт предприятий и службу местных чиновников. Пока округа управляются отдельно, её коллегия подготовит их к включению в кефрейтскую систему."
 VAL_Integrate_Occidia:0 "Присоединение Окцидии"
 VAL_Integrate_Occidia_desc:0 "Переведём Балчанск, Гавань и Шахтёрский посёлок из переходного управления в прямое подчинение Кефрейту. Если довоенное соглашение с Шабратом по Ливонину уже исполнено, этот округ останется у Стеланда. На согласование земельных прав, заводских счетов и гарнизонного снабжения потребуется 35 дней после завершения переписи. Ливонин включается в соглашение только как владение побеждённой Окцидии или Кефрейта; территория Стеландера и других стран сохраняется за владельцем."
 VAL_occidian_administration_secured_tt:0 "Окцидская администрация подчинена Кефрейту, не капитулировала и находится в мире. Балчанск, Гавань и Шахтёрский посёлок принадлежат ей и полностью ею контролируются. Если Ливонин принадлежит администрации, она должна полностью его контролировать."
 VAL_integrate_occidia_tt:0 "Балчанск, Гавань, Шахтёрский посёлок и удержанный Ливонин переходят в прямое владение и под контроль Кефрейта. Ливонин в составе Стеландера или другой страны не изымается. Если у временной администрации нет других владений, она упраздняется, а её войска передаются Кефрейту. Национальными территориями Кефрейта округа автоматически не становятся."
 VAL_create_occidian_administration:0 "Учредить временную администрацию Окцидии"
 VAL_create_occidian_administration_desc:0 "Закрепим переходное управление Балчанском, Гаванью и Шахтёрским посёлком. Перепись и последующая интеграция через фокусы позволят включить удержанные округа в Кефрейт. Ливонин включается в соглашение только как владение побеждённой Окцидии или Кефрейта; территория Стеландера и других стран сохраняется за владельцем."
 VAL_occidian_administration_ready_tt:0 "Балчанск, Гавань и Шахтёрский посёлок доступны для переходного управления. Чужая оккупация или продолжающаяся война откладывает передачу; мирный подчинённый Кефрейта может уступить округ только если после этого не исчезнет с карты. Интеграция ещё не завершена. Хотя бы один округ принадлежит стране с более чем одним регионом, позволяя безопасно учредить администрацию. Ливонин включается в соглашение только как владение побеждённой Окцидии или Кефрейта; территория Стеландера и других стран сохраняется за владельцем."
 VAL_occidian_administration_tt:0 "Балчанск, Гавань и Шахтёрский посёлок образуют Окцидскую договорную администрацию под властью Кефрейта. Довоенное соглашение может отдельно вернуть Ливонин Шабрату. Прямое присоединение удержанных округов станет доступно через фокусы «Перепись окцидских округов» и «Присоединение Окцидии». Ливонин включается в соглашение только как владение побеждённой Окцидии или Кефрейта; территория Стеландера и других стран сохраняется за владельцем."

 VAL_contract_industry:0 "Контрактная промышленность"

 VAL_contract_industry_desc:0 "Арсеналы и гражданские подрядчики работают по общим производственным договорам. Вложения повышают отдачу существующих предприятий."

 VAL_economic_collapse: "Экономический крах: разрыв поставок"

 VAL_economic_collapse_desc:0 "Гражданская война в Воркерланде оборвала заказы, платежи и доступ к металлу. Завершено антикризисных программ: [?VAL_economic_recovery_steps|0]/9. Первые шесть восстанавливают производство во время кризиса; последние три требуют победы, новой базы снабжения и возвращения заказчиков. Репутация фабрик восстанавливается отдельно."

 VAL_economic_miracle:0 "Восстановленная экономика"

 VAL_economic_miracle_desc:0 "Девять программ восстановили производство и расчёты. Победа позволила открыть новые торговые маршруты и заменить прежнюю зависимость от Воркерланда. Вложения в арсеналы и гражданские предприятия продолжают действовать."

 VAL_economic_recovery_delta:0 "Ослабление экономического краха"

 VAL_arsenal_investment_delta:0 "Развитие контрактной промышленности"

 VAL_civilian_investment_delta:0 "Развитие гражданских подрядчиков"

 VAL_economic_miracle_unlock_tt:0 "Девятая программа заменяет §YЭкономический крах§! на §GВосстановленную экономику§!. Накопленные вложения сохраняются."

 # --- Kefreyt post-defeat tree ---
 VAL_defeat_Returning_Columns:0 "Колонны возвращаются"
 VAL_defeat_Returning_Columns_desc:0 "Операция закончилась не переговорами и не выгодным контрактом, а отступлением. Колонны возвращаются без части людей, техники и прежней уверенности в том, что любой риск можно покрыть новой подписью. Сначала Кефрейт должен признать масштаб поражения."
 VAL_defeat_Commanders_Take_The_Ledger:0 "Командиры принимают реестр"
 VAL_defeat_Commanders_Take_The_Ledger_desc:0 "После падения кабинета Солгалова Совет командиров берёт под контроль армейские книги, склады и государственные счета. Его задача проста: не выиграть следующую войну, а не допустить распада страны после проигранной."
 VAL_defeat_Count_The_Remaining_Rifles:0 "Пересчитать оставшиеся винтовки"
 VAL_defeat_Count_The_Remaining_Rifles_desc:0 "После отхода важна не численность частей на бумаге, а то, сколько оружия действительно лежит на складах, сколько стволов можно починить и какие роты ещё способны держать строй."
 VAL_defeat_Reopen_The_Depots:0 "Открыть уцелевшие склады"
 VAL_defeat_Reopen_The_Depots_desc:0 "Запасы, которые раньше берегли для следующей экспедиции, теперь нужны заводам, железным дорогам и гарнизонам. Военная логистика должна снова работать на само государство."
 VAL_defeat_Articles_Of_Command:0 "Статьи военного управления"
 VAL_defeat_Articles_Of_Command_desc:0 "Совет командиров не должен превратиться в собрание конкурирующих штабов. Полномочия, ответственность за снабжение и право распоряжаться резервами будут записаны так же точно, как прежде записывались контракты."
 VAL_defeat_No_Second_Expedition:0 "Второго похода не будет"
 VAL_defeat_No_Second_Expedition_desc:0 "Повторить наступление только потому, что армия умеет наступать, значит повторить и поражение. Восточная граница закрывается для новых авантюр, пока Кефрейт восстанавливает людей, промышленность и управление."
 VAL_defeat_Field_Hospitals_First:0 "Сначала полевые госпитали"
 VAL_defeat_Field_Hospitals_First_desc:0 "Врачи и эвакуационные команды получают приоритет раньше новых наступательных штабов. Страна слишком мала, чтобы снова считать потери обычной строкой в договоре."
 VAL_defeat_Bring_The_Captains_Home:0 "Вернуть капитанов домой"
 VAL_defeat_Bring_The_Captains_Home_desc:0 "Опытные командиры нужны не на чужих перевалах, а в гарнизонах, учебных центрах и на складах Кефрейта. Совет собирает рассеянные кадры обратно в единую систему."
 VAL_defeat_Contracts_Without_Conquest:0 "Контракты без завоеваний"
 VAL_defeat_Contracts_Without_Conquest_desc:0 "Кефрейт останется государством контрактов, но контракт больше не обязан заканчиваться колонной через чужую границу. Экспорт, производство и платные услуги должны снова приносить больше, чем оккупация."
 VAL_frontier_postwar_ready_tt:0 "Кефрейт независим, не капитулировал и не выведен из регионального противостояния условиями поражения. Завершение стеландской гражданской войны не требуется."

 VAL_command_balance: "Генералитет и Солгалов"
 VAL_command_balance_category: "Распределение полномочий"
 VAL_general_staff_side: "Генералитет"
 VAL_solgalov_side: "Валера Солгалов"
 VAL_command_compromise: "Согласованное управление"
 VAL_general_staff_control: "Самостоятельность генерального штаба"
 VAL_solgalov_control: "Контроль Солгалова"
 VAL_staff_authority: "Расширить полномочия штаба"
 VAL_staff_authority_desc: "Передадим оперативное планирование и подготовку войск генералитету. Военные получат больше самостоятельности в распределении армейских заказов."
 VAL_solgalov_authority: "Утвердить полномочия Солгалова"
 VAL_solgalov_authority_desc: "Закрепим за правителем окончательное решение по государственным заказам. Единое управление ускорит производство, но ограничит самостоятельность армейского планирования."

# Договорные администрации и послевоенное содружество
 VAL_Andrei_Rudnev:0 "Андрей Руднев"
 NOD_VAL_Contract_Council:0 "Нодрульская договорная комиссия"
 autonomy_VAL_contract_administration_desc:0 "Договорная администрация\nМестные учреждения ведут хозяйство и комплектуют собственные войска. Кефрейт назначает руководство, получает договорную долю производства и определяет внешнюю политику. Самостоятельные войны и создание союзов недоступны."
 VAL_admin_restore_offices:0 "Вернуть учреждения к работе"
 VAL_admin_restore_offices_desc:0 "Откроем районные управления и возобновим учёт населения. Приказы новой администрации должны доходить до городов без посредничества полевых штабов."
 VAL_admin_reopen_workshops:0 "Возобновить работу мастерских"
 VAL_admin_reopen_workshops_desc:0 "Направим первый восстановительный заказ в столичный промышленный узел. Новый гражданский завод обеспечит администрацию собственными ремонтными мощностями."
 VAL_admin_local_guard:0 "Снабдить местную стражу"
 VAL_admin_local_guard_desc:0 "Получим 5000 винтовок для собственных частей и наладим подготовку командиров. Новые подразделения не появятся автоматически: людей и оставшееся оснащение предстоит выделить из местных резервов."
 VAL_admin_supply_depots:0 "Восстановить столичные дороги"
 VAL_admin_supply_depots_desc:0 "Свяжем склады и городские мастерские исправными дорогами. Инфраструктура столицы получит один уровень."
 VAL_admin_professional_service:0 "Профессиональная служба"
 VAL_admin_professional_service_desc:0 "Упорядочим службу в местных войсках. Штаб получит опыт и командный ресурс для подготовки собственных соединений."
 VAL_admin_ratify_charter:0 "Утвердить договорный устав"
 VAL_admin_ratify_charter_desc:0 "Закрепим полномочия гражданских учреждений, порядок снабжения армии и обязательства перед державой-покровителем. Устав даст администрации политическую опору для дальнейшего восстановления."
 VAL_receive_stelander_border:0 "Оформить передачу пограничных округов"
 VAL_receive_stelander_border_desc:0 "Завершим передачу округов, которая была отложена из-за чужой оккупации. Решение касается только земель подчинённой Стеландской администрации; нейтральные государства не теряют территорию."
 VAL_receive_stelander_border_tt:0 "Принадлежащие Стеландской администрации [46.GetName] и [29.GetName] перейдут Кефрейту, если находятся под контролем администрации или самого Кефрейта."
 VAL_stelander_victory_tt:0 "После военной победы будет учреждена Стеландская договорная администрация во главе с Андреем Рудневым. Принадлежащие побеждённой стране [46.GetName] и [29.GetName] отойдут Кефрейту; остальные её земли и армия останутся у марионетки. Чужая оккупация отсрочит передачу спорного округа. Кефрейт примет название «Кефрейтское содружество» и новый флаг."
 VAL_nod_victory_tt:0 "При самостоятельной победе Кефрейта Нодрул станет Нодрульской договорной администрацией. Если Шабрат уже воюет с Нодрулом, Кефрейт присоединится к его войне: после победы нодрульские штаты перейдут той из двух сторон, которая реально контролирует их в момент капитуляции; уже урегулированные северные территории сохранят прежний итог."
 val_contract.347.t:0 "Стеландская договорная администрация"
 val_contract.347.d:0 "Военная победа получила гражданское продолжение. Управление побеждённым Стеландером переходит к договорной администрации Андрея Руднева. Местные учреждения и армия сохраняются, но внешняя политика и назначение руководства теперь зависят от Кефрейта.\n\nДоговор предусматривает прямое присоединение округов [46.GetName] и [29.GetName], если они принадлежат побеждённой стране. Передача земли под чужой оккупацией откладывается до восстановления контроля. Остальная её территория остаётся под властью администрации; границы нейтральных стран сохраняются.\n\nНад учреждениями поднимают новый стеландский флаг. Кефрейт объявляет образование Кефрейтского содружества - объединения метрополии и её договорных государств."
 val_contract.347.a:0 "Закрепить договорное управление."
 val_contract.348.t:0 "Нодрульская договорная администрация"
 val_contract.348.d:0 "Военная власть Нодрула уступает место договорному управлению. Ашия и Куссингтон сохраняют центральные учреждения; Эснос, Бриоланд и Трея получают отдельный совет. Уцелевшие войска остаются у местных администраций. Королевские знаки сменяет договорный флаг с северным солнцем и оливковой ветвью Кефрейта."
 val_contract.348.a:0 "Север войдёт в содружество."
