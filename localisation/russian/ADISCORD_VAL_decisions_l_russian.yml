VAL_reclamation: "Возвращение земли"
 VAL_reclamation_desc: "Начнём с пострадавших районов самого Кефрейта. Дорожные работы, очистка воды и возвращение жителей идут последовательно: каждый этап занимает 90 дней и стоит £ADISCORD_economy_treasury_texticon §Y500§!.\n\nОдна подрядная служба ведёт только один проект. Завершённые работы остаются в штате при смене власти. Если работающий участок будет потерян, неиспользованный залог вернётся полностью; начать работы заново можно после возвращения контроля. Чистые районы не требуют повторной очистки."
 VAL_reclamation_survey: "Бюро восстановления"
 VAL_reclamation_survey_desc: "Составим карту повреждённых дорог, водозаборов и оставленных поселений. Подрядчики получат измеримый объём работ и оплату после сдачи участка."
 VAL_reclamation_road_crews: "Дорожные артели"
 VAL_reclamation_road_crews_desc: "Объединим дорожников и ремонтные бригады в постоянную службу. Опыт первых расчисток пригодится при строительстве путей по всей стране."
 VAL_reclamation_clean_water: "Чистая вода"
 VAL_reclamation_clean_water_desc: "Поселениям нужны очищенные водозаборы, стоки и почва, на которой можно строить. После восстановления подъездов подрядчики смогут перейти к санитарным работам."
 VAL_reclamation_workshops: "Заказы для мастерских"
 VAL_reclamation_workshops_desc: "Договоримся о серийном выпуске насосов, строительных деталей и ремонтного инструмента. Мастерские получат устойчивый спрос, а стройки - снабжение."
 VAL_reclamation_return_home: "Жильё для возвращающихся"
 VAL_reclamation_return_home_desc: "На подготовленных участках построим жильё и предприятия для тех, кто решит вернуться. Одного приказа недостаточно: каждому району нужен оплаченный проект заселения."
 VAL_reclamation_land_register: "Земельный кадастр"
 VAL_reclamation_land_register_desc: "Закрепим границы участков, ответственность подрядчиков и права новых жителей. Земельные споры больше не должны останавливать каждую следующую стройку."
 VAL_reclamation_road_crews_idea: "Дорожные артели"
 VAL_reclamation_road_crews_idea_desc: "Постоянные бригады строят и обслуживают дороги Кефрейта."
 VAL_reclamation_workshops_idea: "Строительные мастерские"
 VAL_reclamation_workshops_idea_desc: "Единые заказы на детали и инструмент ускоряют строительство и ремонт предприятий."
 VAL_reclamation_land_register_idea: "Земельный кадастр"
 VAL_reclamation_land_register_idea_desc: "Права на восстановленную землю закреплены, а строительные участки размежёваны."
 VAL_reclamation_recovered_land: "Восстановленная земля"
 VAL_reclamation_recovered_land_desc: "Завершённые работы компенсируют часть последствий разрушения. После третьего этапа исходные штрафы загрязнения полностью возмещены; результат остаётся в этом штате при смене владельца."
 VAL_reclamation_roads: "Расчистить подъезды в [FROM.GetName]"
 VAL_reclamation_roads_desc: "Первый этап: восстановим подъездные пути и вывезем опасные завалы. Утрата владения или контроля отменяет текущую работу с полным возвратом залога."
 VAL_reclamation_water: "Очистить воду и почву в [FROM.GetName]"
 VAL_reclamation_water_desc: "Второй этап после расчистки дорог: восстановим водозаборы и подготовим участки под застройку. Утрата владения или контроля отменяет текущую работу с полным возвратом залога."
 VAL_reclamation_settlement: "Вернуть жителей в [FROM.GetName]"
 VAL_reclamation_settlement_desc: "Третий этап после санитарных работ: построим гражданское предприятие и завершим восстановление района. Утрата владения или контроля отменяет текущую работу с полным возвратом залога."
 VAL_reclamation_roads_result_tt: "Через §Y90 дней§! в [FROM.GetName]: §G+1§! инфраструктура (при пределе - §G+1§! ячейка строительства). Компенсируется треть исходных штрафов загрязнения."
 VAL_reclamation_water_result_tt: "Через §Y90 дней§! в [FROM.GetName]: §G+2§! ячейки строительства. Компенсация исходных штрафов загрязнения вырастет до двух третей."
 VAL_reclamation_settlement_result_tt: "Через §Y90 дней§! в [FROM.GetName]: §G+1§! ячейка строительства и §G1 гражданская фабрика§!. Исходные штрафы загрязнения будут полностью компенсированы."
 VAL_reclamation_idle_tt: "Подрядная служба свободна: нет другого оплаченного проекта восстановления."
 VAL_reclamation_refund_tt: "Незавершённый этап отменяется; залог £ADISCORD_economy_treasury_texticon §Y500§! возвращается Кефрейту. Завершённые этапы сохраняются."
 VAL_reclamation_cost: "£ADISCORD_economy_treasury_texticon §Y500§!"
 VAL_reclamation_cost_blocked: "£ADISCORD_economy_treasury_texticon §R500§!"
 VAL_reclamation_cost_tooltip: "Залог: £ADISCORD_economy_treasury_texticon §Y500§!. При сдаче работ он становится оплатой; при отмене возвращается полностью."
 VAL_reclamation_has_work_tt: "Кефрейт владеет и управляет хотя бы одним загрязнённым домашним районом, в котором восстановление ещё не завершено."
 VAL_frontier_demand_CIN:0 "Единый ультиматум северным племенам"
 VAL_frontier_demand_CIN_desc:0 "Предъявим общие требования Пепельному племени, Союзу костоломов и Антропофагоруму. Один дипломатический адресат передаст ответ объединённой обороны. После отказа Кефрейт сможет готовить общую кампанию или отозвать требования.\n\nНодрул: [VALGetNodFrontierIntervention]"
 VAL_frontier_demand_CIN_tt:0 "Ультиматум обращён ко всем трём северным племенам. Доступные независимые участники объединяют оборону; после отказа начинается подготовка одной войны. Мир охватывает заявленные земли всех вступивших племён. Страны из несовместимых союзов не изымаются из них автоматически."
 VAL_frontier_demand_OSF:0 "Ультиматум: Союз костоломов"
 VAL_frontier_demand_OSF_desc:0 "Предъявить требования племенному правительству. Независимые племена собирают общую оборону и отвергают ультиматум. После ответа Кефрейт может подготовить экспедицию, начать войну или отозвать требования. Одновременно ведётся одна кампания."
 VAL_frontier_demand_OSF_tt:0 "Первоначальные требования: $STATE_61$, $STATE_62$, $STATE_63$. Ультиматум собирает доступные племена в общую коалицию; Нодрул и победившая партия могут вступить на их стороне. После войны договор затронет заявленные земли всех участвовавших племён. Форма управления определяется выбранной веткой фокусов."
 VAL_frontier_demand_APH:0 "Ультиматум: Антропофагорум"
 VAL_frontier_demand_APH_desc:0 "Предъявить требования племенному правительству. Независимые племена собирают общую оборону и отвергают ультиматум. После ответа Кефрейт может подготовить экспедицию, начать войну или отозвать требования. Одновременно ведётся одна кампания."
 VAL_frontier_demand_APH_tt:0 "Первоначальные требования: $STATE_64$, $STATE_65$. Ультиматум собирает доступные племена в общую коалицию; Нодрул и победившая партия могут вступить на их стороне. После войны договор затронет заявленные земли всех участвовавших племён. Форма управления определяется выбранной веткой фокусов."
 VAL_frontier_demand_ERT:0 "Ультиматум: Восточная республика"
 VAL_frontier_demand_ERT_desc:0 "Передать окончательные условия пограничного соглашения. Ответ ожидается в течение 21 дня. Отказ позволяет начать войну или отозвать требования; одновременные ультиматумы исключены."
 VAL_frontier_demand_ERT_tt:0 "Требуемые земли: $STATE_168$. При согласии штат возвращается Кефрейту."
 VAL_frontier_conference:0 "Доктрина северной экспансии"
 VAL_frontier_conference_desc:0 "После завершения стеландских войн Кефрейт может сосредоточиться на северных территориях. Торговая сеть или завершённая стеландская кампания дают основание для новой политики. Участие в гражданской войне не является обязательным."
 VAL_frontier_logistics:0 "Снабжение экспедиционных сил"
 VAL_frontier_logistics_desc:0 "Дальняя война потребует складов, ремонтных команд и оборотного запаса грузовиков. Помимо постоянного улучшения снабжения, ведомство сможет заключать оплаченные транспортные контракты на время пограничной кампании. Полевые госпитали улучшат восстановление организации и дадут бонус к исследованию вспомогательных технологий."
 VAL_frontier_commissioners:0 "Полномочные комиссары"
 VAL_frontier_commissioners_desc:0 "Местные учреждения сохранят повседневную работу, но договоры и безопасность перейдут под надзор наших комиссаров. Ультиматум потребует подчинения, а не ликвидации государства."
 VAL_frontier_provincial_offices:0 "Провинциальные управления"
 VAL_frontier_provincial_offices_desc:0 "Требуемые районы войдут в единую систему налогов, снабжения и воинского учёта. Такое предложение труднее принять, зато правительству не придётся делить ответственность с местными властями."
 VAL_frontier_return_irem:0 "Возвращение восточного участка"
 VAL_frontier_return_irem_desc:0 "Переданный восточной администрации район остаётся частью нашего пограничного хозяйства. Мы готовы договориться о его возвращении, не предъявляя прав на остальные земли соседей."
 VAL_frontier_field_hospitals:0 "Эвакуационные колонны"
 VAL_frontier_field_hospitals_desc:0 "Опыт горных походов показывает цену каждой задержки. Подвижные госпитали и эвакуационные маршруты позволят ротам восстанавливать порядок после тяжёлого боя."
 VAL_frontier_security_plan:0 "Мандат на северную кампанию"
 VAL_frontier_security_plan_desc:0 "Правительство утвердит цели экспедиции и выделит политический ресурс на первый ультиматум. Отказ племён откроет решение о начале наступления. Армия должна иметь действующие части и запас оружия, а не формально раздутое число дивизий."
 VAL_frontier_treaty_offices:0 "Исполнение договора"
 VAL_frontier_treaty_offices_desc:0 "Контрактное ведомство закрепит торговые маршруты и порядок расчётов с районами, полученными по пограничному соглашению.\n\nЧтобы открыть этот фокус, успешно завершите один из ультиматумов в разделе решений «$VAL_frontier$». После фокуса «$VAL_frontier_security_plan$» доступен «$VAL_frontier_demand_CIN$», а после «$VAL_frontier_return_irem$» — «$VAL_frontier_demand_ERT$».\n\nСоглашение оформляется автоматически, когда адресат принимает требования или поход заканчивается победой. В войне с племенами нужно разгромить всех племенных участников; захватывать Нодрул не требуется. Отзыв ультиматума и перемирие после поражения это условие не выполняют."
 VAL_frontier_defence_coalition:0 "Пограничная коалиция"
 VAL_frontier:0 "Пограничные договоры"
 VAL_frontier_desc:0 "Состояние: §Y[VALGetFrontierPhase]§!. Адресат: §Y[VALGetFrontierTarget]§!.\nПепельное племя: [VALGetFrontierCINStatus]\nСоюз костоломов: [VALGetFrontierOSFStatus]\nАнтропофагорум: [VALGetFrontierAPHStatus]\n\nУльтиматум собирает независимые племена в общую коалицию. Нодрул: [VALGetNodFrontierIntervention]. Победившая партия Стеландера также может вступить в ту же войну; участники несовместимых союзов не переходят из них автоматически.\n\nДля победы нужно разгромить всех вступивших племенных участников. Освобождённое племя вновь препятствует миру. Поражение племенного блока завершает поход белым миром с гарантами, без захвата их земель. Итоговый договор охватывает заявленные земли всех участвовавших племён.\n\nПосле отказа можно подготовить снабжение, начать наступление или отозвать требования. При более 65% капитуляции Кефрейта участвующий Нодрул получит предложение перемирия. Уступка Приграничья и Эрстантпео возможна только участвовавшей партии."
 VAL_frontier_treaty_signed:0 "Пограничный ультиматум завершён принятием требований или победой в походе"
 VAL_frontier_idle_tt:0 "Нет другого неурегулированного ультиматума или пограничной войны."
 VAL_frontier_ultimatum_deadline:0 "Ответ на ультиматум"
 VAL_frontier_ultimatum_deadline_desc:0 "По истечении срока молчание будет сочтено отказом. Решение о войне остаётся за правительством Кефрейта."
 VAL_frontier_commissioners_tt:0 "Побеждённые племенные правительства переходят под договорное подчинение. После закрепления восьми северных регионов Антолла, Фарейн и Химбер отходят Кефрейту напрямую; Медрон, Хеланд, Милхам, Килнет и Хебтава объединяются в Северную договорную администрацию. Войска поглощаемых подчинённых сохраняются; сторонние владения не затрагиваются."
 VAL_frontier_provinces_tt:0 "Победа передаст Кефрейту заявленные районы участвовавших племён. После закрепления всех восьми регионов Антолла, Фарейн и Химбер останутся Кефрейту, а пять остальных земель образуют Северную договорную администрацию. Сторонние владения и чужая оккупация исключены. Восточные требования ограничены одним районом."
 VAL_frontier_accept_tt:0 "Будут выполнены территориальные условия ультиматума: возврат района, подчинение комиссариату или передача перечисленных земель, согласно требованию Кефрейта."
 VAL_frontier_war_tt:0 "Кефрейт объявит войну адресату. Остальные племена общей коалиции вступят на его стороне в ту же войну, вместе с доступными гарантами - Нодрулом и победившей партией. Капитуляция одного племени не завершит кампанию. Поражение всех племенных участников завершит поход белым миром с гарантами: захватывать земли Нодрула или партии не требуется. Восточный участок остаётся отдельным двусторонним спором."
 VAL_frontier_armistice_tt:0 "Пограничная война закончится. Приграничье и Эрстантпео перейдут партии Стеландера, если она участвовала в этой войне; остальные территории сохраняют своих владельцев. Кефрейт останется независимым."
 VAL_frontier_refuse_peace_tt:0 "Война продолжится. Полное поражение Кефрейта позволит создать зависимую партийную администрацию Допотройдска. При полном поражении все национальные территории участвовавшего в войне Стеландера, принадлежащие Кефрейту и его субъектам, вернутся Стеландеру."
 VAL_frontier_medical_bonus:0 "Эвакуационные колонны"
 VAL_frontier_industry_bonus:0 "Переоснащение пустующих цехов"
 val_rework.100.t:0 "Покупатель исчез"
 val_rework.100.d:0 "Первый признак катастрофы появился не на фронте, а в бухгалтерии. Сразу несколько крупных переводов не пришли в назначенный день. Затем остановились воркерландские вагоны с металлом, а к концу недели арсеналы получили уведомления, что прежние закупочные ведомства больше не гарантируют ни заказов, ни расчётов. Единый западный рынок исчез вместе с государством, которое его связывало.\n\nНа заводах ещё горят печи, но теперь каждая смена работает против времени. Кефрейт зависел от чужого сырья и крупных покупателей сильнее, чем предпочитал признавать. Старой репутации оружейной державы недостаточно, если у клиента нет казначейства, а у поставщика нет железной дороги.\n\nПравительству придётся заново собрать хозяйственную систему: найти сырьё, вернуть доверие, открыть новые маршруты и решить, какие военные расходы страна способна нести без привычного западного счёта. Экономический кризис начинается раньше, чем закончились последние воркерландские выстрелы."
 val_rework.100.a:0 "Сохранить производство."
 val_rework.111.t:0 "Требования отклонены"
 val_rework.111.d:0 "Отказ пришёл сразу от нескольких пограничных правительств. По отдельности они спорили друг с другом о дорогах, границах и караванах. Кефрейтский ультиматум дал им редкую общую причину перестать спорить хотя бы на время. В северных штабах уже обмениваются картами, а Нодрул предлагает помощь тем, кто готов задержать продвижение Солгалова.\n\nКефрейт рассчитывал добиться уступок угрозой одной экспедиции. Теперь перед ним складывается коалиция, и каждый дополнительный день меняет цену возможной войны. Отозвать требования всё ещё можно. Можно также задержать удар и подготовить снабжение. Но если армия перейдёт границу, это будет уже не карательная операция против одного непокорного соседа, а полноценная региональная кампания."
 val_rework.113.t:0 "Предложение кефрейтских генералов"
 val_rework.113.d:0 "Предложение о перемирии пришло не из кабинета Солгалова, а через генералов. Кефрейтская армия понесла достаточно потерь, чтобы штаб начал считать продолжение наступления угрозой самому государству. Военные готовы вернуть партии Приграничье и Эрстантпео, отвести части и признать прежнее положение остальных рубежей.\n\nДля противников это шанс закончить войну, не разрушая Кефрейт полностью. Для Солгалова цена соглашения почти унизительна: государство сохранится, но спорные районы и образ непогрешимого контрактного порядка будут потеряны вместе.\n\nОтказ означает, что война продолжится уже не за границу. Она продолжится до тех пор, пока в Кефрейте не останется правительства, способного подписать другой мир."
 val_rework.115.t:0 "Пограничное соглашение"
 val_rework.115.d:0 "На пограничной станции поставили два одинаковых стола и разложили карты передачи территорий. Военные сверяли дороги и склады, чиновники переписывали списки имущества, а связисты отмечали линии, которые должны перестать быть фронтом к полуночи. Никто не произносил слов о примирении. Для начала было достаточно, чтобы обе стороны одинаково понимали, где завтра не должны стрелять.\n\nДоговор закрывает заявленные споры и оставляет остальные владения участников за пределами сделки. Теперь Кефрейту предстоит более трудная работа, чем занятие пункта на карте: превратить результат войны в границу, по которой снова поедут грузы."
 val_rework.115.a:0 "Открыть договорные управления."
 val_rework.116.t:0 "Подписи под прекращением огня"
 val_rework.116.d:0 "Последние приказы о прекращении огня передали по радио сразу нескольким штабам. На отдельных участках стрельба закончилась раньше, чем связисты успели подтвердить получение сигнала. Роты начали считать людей, ремонтные колонны пошли к брошенным машинам, казначеи открыли книги, которые во время наступления никто не хотел смотреть слишком внимательно.\n\nСпорные районы теперь распределены договором. Но настоящая цена кампании останется в другом месте: в потерянных людях, сорванных заказах и обязательствах, которые мирное правительство унаследует от военного штаба."
 val_rework.116.a:0 "Начать восстановление."
 val_rework.110.t:0 "Ультиматум Кефрейта"
 val_rework.110.ert:0 "Кефрейт требует вернуть район, который ранее находился под его управлением: $STATE_168$. На остальные земли восточной администрации требования не распространяются.\n\nПравительство даёт срок для ответа. Согласие завершит спор передачей района; отказ оставит Кефрейту выбор между отступлением и войной."
 val_rework.110.commission:0 "Кефрейт требует признать верховенство своего комиссариата. Местные учреждения сохранят территорию и повседневную работу, но внешний курс перейдёт под надзор кефрейтской администрации.\n\nДругие независимые племена собирают общую оборону. Нодрул готов использовать коалицию для сдерживания Солгалова. Отказ сохраняет возможность совместного сопротивления; согласие подчиняет нашу страну Кефрейту.\n\nПри наличии посторонних завоеваний соглашение ограничится заявленными племенными районами."
 val_rework.110.direct:0 "Кефрейт требует передать племенные земли под прямое провинциальное управление. Согласие означает потерю основной территории.\n\nДругие независимые племена собирают общую оборону, а Нодрул может поддержать её войсками. Мы можем отвергнуть требования и встретить экспедицию вместе с союзниками."
 val_rework.110.no:0 "Отклонить требования."
 val_rework.110.yes:0 "Принять условия."
