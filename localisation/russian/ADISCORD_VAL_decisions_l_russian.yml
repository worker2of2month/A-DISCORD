# BEGIN CONSOLIDATED: ADISCORD_national_focuses_l_russian.yml: live VAL focuses
  VAL_The_Contract_State: "Государство контракта"
  VAL_The_Contract_State_desc: "Кефрейт не просит верности и не верит в клятвы. Здесь власть начинается с подписи, ставки и человека, который готов проследить, чтобы договор исполнили."
  VAL_The_Weaponry_Baron: "Оружейный барон"
  VAL_The_Weaponry_Baron_desc: "Валера Солгалов держит страну не речами, а цепью заводов, посредников и капитанов. Его трон не позолочен - он смазан машинным маслом и пороховой гарью."
  VAL_Price_Of_Loyalty: "Цена верности"
  VAL_Price_Of_Loyalty_desc: "В Кефрейте лояльность не наследуют и не воспитывают. Её покупают, пересматривают и оплачивают снова, пока у государства хватает оружия, денег и страха."
  VAL_Count_The_Captains: "Пересчитать капитанов"
  VAL_Count_The_Captains_desc: "Каждая рота знает своего командира лучше, чем столицу. Прежде чем страна двинется дальше, Солгалову нужно понять, какие капитаны служат Кефрейту, а какие - только следующему заказу."
  VAL_One_Ledger_One_Banner: "Одна книга, одно знамя"
  VAL_One_Ledger_One_Banner_desc: "Разрозненные контракты должны стать государственным реестром. Кефрейт останется рынком войны, но этот рынок будет говорить одним голосом."
  VAL_Factories_Like_Cathedrals:0 "Модернизация оружейных заводов"
 VAL_Factories_Like_Cathedrals_desc:0 "Оружейные заводы остаются главным капиталом Кефрейта. Единый заказ на оборудование и ремонт позволит увеличить выпуск уже работающих арсеналов, не расходуя средства на пустующие корпуса."
  VAL_Keep_The_Lines_Hot:0 "Непрерывный производственный цикл"
  VAL_Keep_The_Lines_Hot_desc:0 "Сменные графики, запас комплектующих и общие стандарты обслуживания должны устранить простои. Существующие мощности будут работать устойчивее, а первая партия пополнит оружейный резерв."
  VAL_Ballistics_Schools: "Баллистические школы"
  VAL_Ballistics_Schools_desc: "Эйнар Толл и его ученики превращают ремесло войны в учебную дисциплину. Снаряд должен лететь не туда, куда молятся, а туда, куда рассчитали."
  VAL_Brokered_Steel: "Сталь через посредников"
  VAL_Brokered_Steel_desc: "Мир не обязан любить Кефрейт, чтобы покупать у него оружие. Мирон Саблев знает: между моралью и поставкой всегда можно поставить ещё одну подпись."
  VAL_Export_Rifles_Not_Promises:0 "Национальное экспортное бюро"
  VAL_Export_Rifles_Not_Promises_desc:0 "Экспорт требует не обещаний капитанов, а оплаченных заказов и надёжной поставки. Бюро связывает внешние контракты с реальными запасами оружия и не подменяет покупателя государственными субсидиями."
  VAL_The_Mercenary_State: "Единый реестр рот"
  VAL_The_Mercenary_State_desc: "Разрозненные наёмные роты должны стать частями контрактной системы. Их боевые свойства теперь определяются изменяемым авторитетом реестра, поэтому слабый центр не получит тех же преимуществ, что и единое командование."
  VAL_Hire_Out_War: "Сдать войну в аренду"
  VAL_Hire_Out_War_desc: "Чужие войны кормят кефрейтские семьи лучше, чем проклятая почва. Если кто-то хочет крови, Кефрейт предложит дисциплину, снаряжение и цену."
  VAL_Vorons_Companies: "Роты Ворона"
  VAL_Vorons_Companies_desc: "Кирилл Ворон предпочитает быстрые удары и людей, которые не задают лишних вопросов. Его роты появляются там, где контракт требует тишины."
  VAL_Stahls_Schedules: "Расписания Шталь"
  VAL_Stahls_Schedules_desc: "Эрика Шталь превращает наёмную массу в порядок: смены, маршруты, пайки, боевые окна. Даже грязная война должна идти по графику."
  VAL_Gromovs_Assault_Tables: "Штурмовые таблицы Громова"
  VAL_Gromovs_Assault_Tables_desc: "Борис Громов считает наступление арифметикой давления. Если цифры сходятся, люди идут вперёд; если нет - их заставляют сходиться."
  VAL_Morns_Supply_Trains: "Обозы Морн"
  VAL_Morns_Supply_Trains_desc: "Рената Морн знает, что контракт умирает не от пули, а от пустого склада. Её обозы держат кефрейтскую войну на колёсах."
  VAL_The_Harvest_Of_Ash: "Урожай пепла"
  VAL_The_Harvest_Of_Ash_desc: "Кефрейтская земля больше помнит снаряды, чем семена. Народ живёт среди сухих полей, костей и металла, который легче продать, чем превратить в хлеб."
  VAL_Field_Surgeons: "Полевые хирурги"
  VAL_Field_Surgeons_desc: "Лада Хром собирает людей обратно по частям, потому что Кефрейт не может позволить себе терять тела быстрее, чем подписывает контракты."
  VAL_Bread_From_Barracks: "Хлеб из казарм"
 VAL_Bread_From_Barracks_desc:0 "Когда деревни не кормят страну, государство кормит деревни через склады армии. Постоянные заказы гражданским подрядчикам ускорят строительство и поддержат тыл."
  VAL_Dead_Villages_Still_Count: "Мёртвые деревни всё ещё считаются"
  VAL_Dead_Villages_Still_Count_desc: "На карте Кефрейта есть места, где остались только списки жителей и ржавые колодцы. Государство может забыть их имена, но не может забыть, что пустота тоже имеет цену."
  VAL_Market_Roads_North:0 "Северные торговые маршруты"
  VAL_Market_Roads_North_desc:0 "Племенные рынки могут заменить часть утраченного сбыта. Откроем постоянные торговые представительства и подготовим северное направление внешней политики."
  VAL_Trading_Partners: "Торговые партнёры"
  VAL_Trading_Partners_desc: "WRK, NAM, IVN и WIT нужны поставки, а Кефрейту нужны рынки. Между ними нет любви, но есть взаимная привычка отвечать на запросы."
  VAL_October_Of_2160: "Октябрь 2160-го"
  VAL_October_Of_2160_desc: "Стеланд помнит октябрь иначе, чем Кефрейт. Одни называют его сделкой, другие - раной, но обе стороны знают, что старые подписи всё ещё бросают тень."
  VAL_Different_Views_On_Freedom: "Разные взгляды на свободу"
  VAL_Different_Views_On_Freedom_desc: "Для TFF свобода звучит как право не подчиняться. Для Кефрейта свобода слишком часто означает право подписать контракт и не спрашивать, кто будет умирать за его исполнение."
  VAL_Contracts_Outlive_Kings: "Контракты переживают королей"
 VAL_Contracts_Outlive_Kings_desc:0 "Лидеры стареют, партии трескаются, границы спорят с картами. Единая система договоров связывает государство, арсеналы и армию. Долгосрочные заказы повысят выпуск действующей промышленности."
 VAL_Stelander_Crisis_Opens: "Стеландерский кризис"
 VAL_Stelander_Crisis_Opens_desc: "В Стеландере власть уходит из рук Иванова. Изучим расположение частей и подготовим договоры, прежде чем выбирать между поставками сопротивлению и операцией против Суверенных республик."
 VAL_Arms_For_The_Burning: "Поставки сопротивлению"
 VAL_Arms_For_The_Burning_desc: "После раскола, пока сопротивление воюет с партийным правительством, предложим Шабрату оружие и добровольцев либо полный договор с двумя подготовленными пехотными частями. Его правительство должно принять цену; только после этого люди и оснащение будут переданы, а деньги поступят в казну. Отчёты с фронта помогут нашим оружейникам. Поставки не мешают отдельному походу против Союза Возрождения Окцидии: приказ о мобилизации можно отдать спустя 60 дней после раскола."
 VAL_Seize_The_Northern_Passes: "Операция на перевалах"
 VAL_Seize_The_Northern_Passes_desc:0 "Подготовим командование к отдельной войне с Союзом Возрождения Окцидии. Первые 60 дней после распада Стеландера республики остаются в мире; затем можно отдать приказ о 21-дневной мобилизации. После победы Балчанск, Гавань, Ливонин и Шахтёрский посёлок образуют временную договорную администрацию. Довоенное соглашение с Шабратом по Ливонину будет урегулировано отдельно. Прямое присоединение удержанных округов потребует последующих фокусов."
 VAL_The_Steel_Contract: "Контракты на производство"
 VAL_The_Steel_Contract_desc:0 "Исполненные поставки или успешная операция дают основание вкладываться в выпуск действующих арсеналов. Если кампания закончилась неудачно, займёмся восстановлением доверия к правительству и пересмотром обязательств."
 VAL_merchant_rail_yards_tt: "Проложена железная дорога §G3-го уровня§! между Депотодроном и Зойлонгом."
# END CONSOLIDATED: ADISCORD_national_focuses_l_russian.yml: live VAL focuses

 VAL_cw_crisis_active_tt: "В Стеландере началась борьба за наследство Иванова или гражданская война."
 VAL_cw_trade_course_available_tt: "Правительство не выбрало военное вмешательство или нейтралитет."
 VAL_cw_military_course_available_tt: "Правительство не выбрало поставки сопротивлению или нейтралитет."
 VAL_cw_campaign_result_tt: "Исполнен договор поставки, завершена операция Кефрейта или закончена гражданская война."
 VAL_cw_field_reports_bonus: "Отчёты стеландерского фронта"
 VAL_cw_sell_arms_to_resistance: "Предложить поставку Шабрату"
 VAL_cw_sell_arms_to_resistance_desc: "Предложим сопротивлению £infantry_equipment_texticon §Y3200§! винтовок за £ADISCORD_economy_treasury_texticon §Y50§!. Покупатель должен согласиться; оружие и деньги передаются вместе после повторной проверки запасов. Исполненный договор даст §Y5§! опыта армии и §Y5§! договорного авторитета. После отказа предложение можно повторить через 30 дней; исполнить — один раз."
 VAL_cw_arms_offer_tt: "Предложим сопротивлению £infantry_equipment_texticon §Y3200§! винтовок за £ADISCORD_economy_treasury_texticon §Y50§!. До его согласия оружие и деньги остаются у владельцев."
 VAL_cw_buy_arms_tt: "При сохранении условий получим £infantry_equipment_texticon §Y3200§! винтовок, перечислив Кефрейту £ADISCORD_economy_treasury_texticon §Y50§!."
 VAL_cw_begin_mobilization: "Начать мобилизацию на перевалах"
 VAL_cw_begin_mobilization_desc:0 "Отдадим приказ о вторжении в Союз Возрождения Окцидии. Мобилизация доступна спустя 60 дней после распада Стеландера и длится ещё 21 день. Поставки Шабрату не исключают этот поход. После победы Балчанск, Гавань, Ливонин и Шахтёрский посёлок передаются временной администрации под властью Кефрейта; судьба Ливонина затем отдельно определяется довоенным соглашением с Шабратом, а интеграция удержанных округов проходит через фокусы."
 ADISCORD_STP_cw.50.t: "Предложение Кефрейта"
 ADISCORD_STP_cw.50.d: "Кефрейт предлагает 3200 винтовок за 50 из нашей казны. Оружие и платёж будут переданы вместе после нашего согласия, если обе стороны сохранят необходимые запасы. Вступления Кефрейта в нашу войну договор не предусматривает."
 ADISCORD_STP_cw.50.a: "Принять условия поставки."
 ADISCORD_STP_cw.50.b: "Сейчас мы не готовы платить."
 ADISCORD_STP_cw.51.t: "Ответ по оружейному договору"
 ADISCORD_STP_cw.51.accepted: "Сопротивление приняло условия. Кефрейт передал 3200 винтовок, получив 50 в казну. Офицеры передадут заводам первые отчёты об использовании оружия на фронте."
 ADISCORD_STP_cw.51.refused: "Договор не был исполнен: сопротивление отказалось от предложения либо условия расчёта изменились. Деньги не перечислены, люди и части не переданы. Подготовленные к отправке запасы остаются у Кефрейта."
 ADISCORD_STP_cw.51.a: "Принято."
 VAL_Keep_The_Arsenals: "Сохранить резервы"
 VAL_Keep_The_Arsenals_desc: "Оставим оружие и части дома. Вместо стеландерской экспедиции проведём учения резервов и закрепим решение о нейтралитете. Правительство отказывается и от вмешательства, и от военных поставок сопротивлению."
 VAL_cw_neutral_course_available_tt: "Правительство не выбрало поставки сопротивлению или военное вмешательство."
 VAL_cw_arms_offer_pending: "Ожидается ответ сопротивления по оружейному договору"
 VAL_cw_trade_course: "Выбран курс на поставки сопротивлению"
 VAL_cw_military_course: "Выбран курс на отдельную войну с западными республиками"
 VAL_cw_refused: "Правительство объявило нейтралитет в Стеландере"
 VAL_cw_entered: "Кефрейт вступил в отдельную войну с Союзом Возрождения Окцидии"
 VAL_cw_mobilizing: "Идёт мобилизация против западных республик"
 VAL_cw_settled: "Западная операция Кефрейта завершена"
 VAL_cw_arms_contract_fulfilled: "Оружейный договор с сопротивлением исполнен"
 VAL_foreign_operation_active: "Слот внешней операции занят"
