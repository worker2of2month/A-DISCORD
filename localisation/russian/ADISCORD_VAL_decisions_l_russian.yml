 VAL_cw_field_reports_bonus: "Отчёты стеландерского фронта"
 VAL_cw_sell_arms_to_resistance: "Предложить поставку Шабрату"
 VAL_cw_sell_arms_to_resistance_desc: "Подготовка предложения стоит §Y35§! политической власти; эта плата не возвращается при отказе. Предложим сопротивлению £infantry_equipment_texticon §Y3200§! винтовок за £ADISCORD_economy_treasury_texticon §Y50§!. Покупатель должен согласиться; оружие и деньги передаются вместе после повторной проверки запасов. Исполненный договор даст §Y5§! опыта армии и §Y5§! договорного авторитета. После отказа предложение можно повторить через 30 дней; исполнить - один раз."
 VAL_cw_arms_offer_tt: "Предложим сопротивлению £infantry_equipment_texticon §Y3200§! винтовок за £ADISCORD_economy_treasury_texticon §Y50§!. До его согласия оружие и деньги остаются у владельцев."
 VAL_cw_buy_arms_tt: "При сохранении условий получим £infantry_equipment_texticon §Y3200§! винтовок, перечислив Кефрейту £ADISCORD_economy_treasury_texticon §Y50§!."
 VAL_cw_begin_mobilization: "Начать мобилизацию на перевалах"
 VAL_cw_begin_mobilization_desc:0 "Отдадим приказ о вторжении в Союз Возрождения Окцидии. Мобилизация доступна спустя 60 дней после распада Стеландера и длится ещё 21 день. Поставки Шабрату не исключают этот поход. После победы Балчанск, Гавань и Шахтёрский посёлок передаются временной администрации под властью Кефрейта; судьба Ливонина затем отдельно определяется довоенным соглашением с Шабратом, а интеграция удержанных округов проходит через фокусы.\n\nЕсли мы не начнём мобилизацию, через 90 дней после окончания стеландской гражданской войны победивший Стеландер сможет сам подготовить вторжение в Окцидию. Начало его подготовки закроет наше окно вмешательства до её отмены. Ливонин включается в соглашение только как владение побеждённой Окцидии или Кефрейта; территория Стеландера и других стран сохраняется за владельцем."
 ADISCORD_STP_cw.50.t: "Предложение Кефрейта"
 ADISCORD_STP_cw.50.d: "Кефрейт предлагает 3200 винтовок за 50 из нашей казны. Оружие и платёж будут переданы вместе после нашего согласия, если обе стороны сохранят необходимые запасы. Вступления Кефрейта в нашу войну договор не предусматривает."
 ADISCORD_STP_cw.50.a: "Принять условия поставки."
 ADISCORD_STP_cw.50.b: "Сейчас мы не готовы платить."
 ADISCORD_STP_cw.51.t: "Ответ по оружейному договору"
 ADISCORD_STP_cw.51.accepted: "Сопротивление приняло условия. Кефрейт передал 3200 винтовок, получив 50 в казну. Офицеры передадут заводам первые отчёты об использовании оружия на фронте."
 ADISCORD_STP_cw.51.refused: "Договор не был исполнен: сопротивление отказалось от предложения либо условия расчёта изменились. Деньги не перечислены, люди и части не переданы. Подготовленные к отправке запасы остаются у Кефрейта."
 ADISCORD_STP_cw.51.a: "Принято."
 VAL_Keep_The_Arsenals: "[ROOT.VALGetReservesFocusTitle]"
 VAL_Keep_The_Arsenals_desc: "Оставим оружие и части дома. Вместо стеландерской экспедиции проведём учения резервов и закрепим решение о нейтралитете. Правительство отказывается и от вмешательства, и от военных поставок сопротивлению.\n\n[ROOT.VALGetStelanderCrisisStatus]"
 VAL_cw_neutral_course_available_tt: "Правительство не выбрало поставки сопротивлению или военное вмешательство."
 VAL_cw_arms_offer_pending: "Ожидается ответ сопротивления по оружейному договору"
 VAL_cw_trade_course: "Выбран курс на поставки сопротивлению"
 VAL_cw_military_course: "Выбран курс на отдельную войну с Союзом Возрождения Окцидии"
 VAL_cw_refused: "Правительство объявило нейтралитет в Стеландере"
 VAL_cw_entered: "Кефрейт вступил в отдельную войну с Союзом Возрождения Окцидии"
 VAL_cw_mobilizing: "Идёт мобилизация против Союза Возрождения Окцидии"
