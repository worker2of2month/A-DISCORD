 VAL_resource_war_aid:0 "Ресурсная война"
 VAL_resource_war_aid_desc:0 "Выбранная сторона: [VALGetResourceAidSide]. Обязательства: [VALGetResourceAidStatus].\n\nПрава на добычу в Западном островном округе получим после победы выбранной стороны, если выполним договор. Смена стороны до конца войны невозможна. Добровольцы отправляются через дипломатическое окно выбранной страны.\n\nДоставлено винтовок: [?VAL_resource_aid_rifles|0]/50000. Отправлено наёмников: [?VAL_resource_aid_personnel|0]/2000. Две добровольческие дивизии на фронте: [?VAL_resource_aid_volunteer_days|0]/30 дней подряд."
 VAL_northern_war_aid:0 "Помощь северным странам"
 VAL_northern_war_aid_desc:0 "Получатели: [YPR.GetName], [COF.GetName] и [TFF.GetName]. Обязательства: [VALGetNorthernAidStatus].\n\nПомощь всем трём северным странам учитывается совместно. Можно распределять поставки и добровольцев между участниками, которые продолжают войну с Нодрулом. После выполнения обязательств поставки остаются доступны до исхода северной кампании.\n\nВсего доставлено винтовок: [?VAL_northern_aid_rifles|0]/50000. Отправлено наёмников: [?VAL_northern_aid_personnel|0]/2000. Не менее двух добровольческих дивизий суммарно: [?VAL_northern_aid_volunteer_days|0]/30 дней подряд."
 VAL_choose_northern_aid:0 "Обязаться помочь северной коалиции"
 VAL_choose_northern_aid_desc:0 "За 90 дней передадим северным союзникам в общей сложности 50000 винтовок или 2000 наёмников либо обеспечим присутствие не менее двух добровольческих дивизий суммарно 30 дней подряд. Помощь можно распределять между тремя странами. Победа коалиции принесёт временный бонус при выполненных обязательствах; поражение северной коалиции приведёт к временному штрафу. Мир без победителя закроет договор без награды."
 VAL_northern_aid_terms_tt:0 "Начнётся миссия на §Y90 дней§!. Общий счёт для [YPR.GetName], [COF.GetName] и [TFF.GetName]: §Y50000§! винтовок, §Y2000§! наёмников либо не менее §Y2§! добровольческих дивизий суммарно на §Y30 дней подряд§!. Полная помощь и победа коалиции: торговый доход §G+15%§! и поддержка войны §G+10%§! на §Y180 дней§!. Поражение коалиции: торговый доход и поддержка войны §R-5%§! на тот же срок. Мир без победителя не даёт бонуса."
 VAL_northern_aid_arms:0 "Отправить северную поставку: [FROM.GetName]"
 VAL_northern_aid_arms_desc:0 "Передать 25000 винтовок из наших запасов этой северной стране. Две партии любым участникам коалиции выполняют оружейный вариант общих обязательств. Дополнительные поставки доступны до конца северной кампании."
 VAL_northern_aid_personnel:0 "Отправить северный отряд: [FROM.GetName]"
 VAL_northern_aid_personnel_desc:0 "Передать 2000 человек в людской резерв этой северной страны и предоставить советников на 70 дней. Стоимость: 2000 людских ресурсов и 25 командного ресурса. Помощь засчитывается в общие обязательства перед коалицией. Новые дивизии автоматически не создаются; дополнительные отряды можно отправлять до конца северной кампании."
 VAL_aid_arms_delivery_tt:0 "[FROM.GetName] получит §Y25000§! винтовок из наших запасов. Поставка засчитается в действующий договор."
 VAL_aid_personnel_delivery_tt:0 "[FROM.GetName] получит §Y2000§! людских ресурсов и военных советников на §Y70 дней§!. Мы потратим §Y2000§! людских ресурсов и §Y25§! командного ресурса. Обязательства будут выполнены."
 VAL_resource_aid_deadline:0 "Выполнить договор ресурсной войны"
 VAL_resource_aid_deadline_desc:0 "Сторона: [VALGetResourceAidSide]. За 90 дней выполните один вариант помощи.\n\n- Винтовки: [?VAL_resource_aid_rifles|0]/50000.\n- Наёмники: [?VAL_resource_aid_personnel|0]/2000.\n- Две добровольческие дивизии: [?VAL_resource_aid_volunteer_days|0]/30 дней подряд.\n\nОтзыв дивизий до завершения 30 дней сбрасывает их срок. Невыполнение договора лишает прав на добычу даже при победе выбранной стороны."
 VAL_northern_aid_deadline:0 "Выполнить обязательства перед севером"
 VAL_northern_aid_deadline_desc:0 "Общий договор с [YPR.GetName], [COF.GetName] и [TFF.GetName]. За 90 дней выполните один вариант помощи суммарно для всех трёх стран.\n\n- Винтовки: [?VAL_northern_aid_rifles|0]/50000.\n- Наёмники: [?VAL_northern_aid_personnel|0]/2000.\n- Не менее двух добровольческих дивизий суммарно: [?VAL_northern_aid_volunteer_days|0]/30 дней подряд.\n\nЕсли суммарно останется меньше двух дивизий у действующих участников войны, срок сбросится. Без достаточной помощи победа коалиции не принесёт бонуса. Штраф применяется при поражении всей северной кампании, а не отдельного получателя."
 VAL_negotiate_efl_metals:0 "Поддержать коалицию Эфлора и Азхара"
 VAL_negotiate_efl_metals_desc:0 "Предложить Эфлору помощь в обмен на права на добычу в Западном островном округе после победы коалиции. После принятия договора перейти к наместнику уже нельзя. Подготовка предложения стоит 50 политической власти; отказ не возвращает эту плату."
 VAL_efl_concession_negotiable_tt:0 "Ресурсная война продолжается, сторона ещё не выбрана; Эфлор независим. Нет действующего предложения другой стороне или недавнего кефрейтского контракта с наместником."
 VAL_efl_concession_terms_tt:0 "После принятия договора: §Y90 дней§! на §Y50000§! винтовок, §Y2000§! наёмников либо присутствие §Y2§! добровольческих дивизий §Y30 дней подряд§!. Полная помощь и победа коалиции дадут права на добычу в §YЗападном островном округе§!, если Эфлор получит и удержит этот округ."
 val_contract.368.t:0 "Кефрейтская помощь коалиции"
 val_contract.368.d:0 "Кефрейт предлагает поддержать нашу коалицию в ресурсной войне. После её победы Эфлор предоставит права на добычу в Западном островном округе, если округ перейдёт под наше управление.\n\nЗа 90 дней Кефрейт должен передать 50000 винтовок или 2000 наёмников либо держать у нас две добровольческие дивизии 30 дней подряд. Невыполненные обязательства не дают права на концессию. После заключения договора Кефрейт не сможет снабжать наместника до окончания войны."
 val_contract.371.t:0 "Недостаточная помощь"
 val_contract.371.d:0 "Обещанный объём помощи не поступил вовремя. Отдельные поставки и краткое присутствие добровольцев не заменяют выполненного договора. Требовать награду за эту помощь Кефрейт уже не сможет."
 val_contract.371.a:0 "Условия договора не выполнены"
 val_contract.372.t:0 "Северный договор выполнен"
 val_contract.372.d:0 "Северная коалиция выдержала войну, а Нодрул потерпел поражение. Наши поставки и люди подтвердили надёжность кефрейтских обязательств. На 180 дней торговый доход повышается на 15%, а поддержка войны — на 10%."
 val_contract.372.a:0 "Наш вклад принёс результат"
 val_contract.373.t:0 "Поражение северной коалиции"
 val_contract.373.d:0 "Северная коалиция, которую мы обязались поддержать, проиграла кампанию против Нодрула. Неудача затронула торговые связи и доверие к внешним операциям. На 180 дней торговый доход и поддержка войны снижаются на 5%."
 val_contract.373.a:0 "Принять последствия"
 VAL_resource_volunteer_mandate:0 "Добровольцы ресурсной войны"
 VAL_resource_volunteer_mandate_desc:0 "Разрешена отправка добровольцев выбранной стороне ресурсной войны. Право действует до завершения конфликта. Дивизии отправляются через дипломатическое окно получателя."
 VAL_northern_aid_success:0 "Успех северной помощи"
 VAL_northern_aid_success_desc:0 "Полная помощь победившей северной коалиции укрепила торговые связи и поддержку внешней политики."
 VAL_northern_aid_failure:0 "Неудача северной помощи"
 VAL_northern_aid_failure_desc:0 "Поражение северной коалиции временно ослабило торговые связи и поддержку внешней политики."
