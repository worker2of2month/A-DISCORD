 val_contract.422.d:0 "Страна [FROM.GetName] приняла предложение. В резерв Кефрейта зачислено [VALHireDecisionPeople] добровольцев; партнёру перечислено [VALHireDecisionPrice] казны.\n\nПовторный наём у этой страны можно будет предложить через год."
