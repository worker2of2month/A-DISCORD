 val_contract.367.d:0 "Кефрейт предлагает поставить 200000 винтовок за 5000 казны. Это оружие из его действующих запасов. Согласие оплачивает всю партию и запускает её передачу; повторная проверка казны и складов не допускает неполной сделки.\n\nПредложение действует 35 дней. При отказе или отсутствии ответа деньги остаются в нашей казне, оружие — у продавца."

 VAL_Wasteland_Charter:0 "Хартия южной администрации"

 VAL_Wasteland_Charter_desc:0 "Учредить подчинённую Кефрейту администрацию на закреплённом плацдарме. Её границы будут расширяться только по мере успеха следующих военных операций."

 VAL_Southern_Expansion:0 "Расширение южного плацдарма"

 VAL_Southern_Expansion_desc:0 "Начать следующую войну против восточных остатков. После их капитуляции администрация получит доступные регионы 167, 170, 171, 184, 185 и 203. Территории, удерживаемые посторонними державами, не передаются."

 VAL_Eastern_Expansion:0 "Восточный пояс безопасности"

 VAL_Eastern_Expansion_desc:0 "С опорой на южные гарнизоны начать операцию против IRT. После победы администрации отходят доступные регионы 178, 180, 181, 182, 183, 193, 206 и 207 с карты военных операций. Удалённые владения IRT не входят в условия мира."

 VAL_perimeter_open_tt:0 "Периметр пал и южные территории открылись"

 VAL_wasteland_charter_tt:0 "Регион 169 образует §YЮжную контрактную администрацию§!, подчинённую Кефрейту. Ирем остаётся под прямым управлением VAL."
 VAL_wasteland_charter_available_tt:0 "Кефрейт контролирует регион 169, не воюет с Иремом и ещё не создал Южную контрактную администрацию."
 VAL_southern_expansion_available_tt:0 "Южная контрактная администрация существует, а Ирем готов к войне и не входит в чужой альянс."
 VAL_eastern_expansion_available_tt:0 "Южная администрация удерживает регионы 184 и 185; Ирем готов к войне, а Кефрейт не ведёт прежних пограничных войн."
 VAL_stelander_equal_pact_available_tt:0 "Кефрейт признал Стеландера равным партнёром; доступен мирный партнёр без войны и капитуляции."

 WCA:0 "Южная контрактная администрация"

 WCA_DEF:0 "Южная контрактная администрация"

 WCA_ADJ:0 "Южноконтрактн."

 WCA_Contract_Council:0 "Южная контрактная комиссия"
 VAL_partner_negotiations_ready_tt:0 "Обе страны существуют, не капитулировали и не воюют друг с другом; нет незавершённых переговоров. С предыдущего предложения этому партнёру прошло 30 дней."
 VAL_partner_desk_free_tt:0 "Договорная контора свободна: нет открытого экспортного предложения или незавершённой старой операции."
 VAL_partner_export_slot_tt:0 "Свободно экспортное место. Первое доступно после лицензирования, второе — после второго экспортного стола. Принятые заказы занимают место на 70 дней."
 VAL_partner_customer_ready_tt:0 "Доступен клиент: северный партнёр либо воюющее правительство из списка покупателей. Нет войны с Кефрейтом, капитуляции или другого обязательства; прошло 30 дней с предложения и 70 дней с покупки. Сопротивление Стеландера во время гражданской войны использует свои договоры."
 VAL_partner_arms_funds_tt:0 "Казна покупателя: не меньше £ADISCORD_economy_treasury_texticon §Y500§!."
 VAL_partner_arms_stock_tt:0 "На складе Кефрейта есть полная партия: не меньше £infantry_equipment_texticon §Y25000§! винтовок."
 VAL_partner_bulk_funds_tt:0 "Казна покупателя: не меньше £ADISCORD_economy_treasury_texticon §Y1000§!."
