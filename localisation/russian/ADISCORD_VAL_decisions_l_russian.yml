l_russian:
 #VAL decisions
 VAL_Operational_Directorate: "Оперативное управление"
 VAL_Operational_Directorate_desc: "Соседей нельзя рассматривать как единую границу. Управление сведёт сведения о перевалах, рынках, гарнизонах и контролёрах регионов в одну постоянно обновляемую карту."
 VAL_Ministry_Of_Contract_Memory: "Министерство контрактной памяти"
 VAL_Ministry_Of_Contract_Memory_desc: "Государству нужны не только винтовки, но и право объяснять, почему каждый новый контракт был неизбежен. Министерство откроет один постоянный слот пропагандистских кампаний."
 VAL_Paid_Loyalty: "Оплаченная лояльность"
 VAL_Paid_Loyalty_desc: "Верность капитанов должна зависеть от реестра выплат, а не от личной близости к правителю."
 VAL_Provincial_Brokers: "Провинциальные посредники"
 VAL_Provincial_Brokers_desc: "Местные посредники будут отвечать за сбор заявок, набор подрядчиков и раннее предупреждение о недовольстве."
 VAL_Closed_Ledgers: "Закрытые реестры"
 VAL_Closed_Ledgers_desc: "Единая бухгалтерия лишит капитанов возможности скрывать людей и оружие в параллельных книгах."
 VAL_State_Above_Captains: "Государство выше капитанов"
 VAL_State_Above_Captains_desc: "Контрактная система переживёт своих создателей только тогда, когда ни одна рота не сможет считать себя равной государству."
 VAL_Quarterly_Contract_Norm: "Квартальный контрактный норматив"
 VAL_Quarterly_Contract_Norm_desc: "Раз в девяносто дней арсеналы обязаны передавать четыре тысячи винтовок на исполнение внешних заказов. Выполненный норматив поддерживает доверие и доходы; срыв разрушает кредитоспособность и может затянуть страну в долговую яму."

 VAL_Contract_Accounting_Office:0 "Промышленный бюджет"
 VAL_Contract_Accounting_Office_desc:0 "Учёт государственных заказов объединит счета арсеналов, налоговые платежи и производственные планы. Реформа увеличивает постоянный доход казны и сокращает стоимость административного аппарата."
 VAL_Salvage_Every_Barrel:0 "Восстановление оружейных резервов"
 VAL_Salvage_Every_Barrel_desc:0 "Складские комиссии вернут пригодное оружие в оборот. Разбор списанного имущества позволит собрать резерв без отвлечения новых производственных линий."
 VAL_Standardize_Rifle_Lots: "Унифицировать партии винтовок"
 VAL_Standardize_Rifle_Lots_desc: "Единые допуски и маркировка упростят ремонт, экспорт и квартальные поставки."
 VAL_Merchant_Rail_Yards: "Торговые железнодорожные дворы"
 VAL_Merchant_Rail_Yards_desc: "Военные грузы должны покидать страну без недель ожидания на перегруженных станциях."
 VAL_Mobilize_Machine_Shops:0 "Программа станкостроения"
 VAL_Mobilize_Machine_Shops_desc:0 "Зависимость от привозного оборудования делает любой разрыв торговли промышленной катастрофой. Машинные мастерские получат общий план ремонта и выпуска станков для кефрейтских заводов."
 VAL_Arsenal_Reserve: "Арсенальный резерв"
 VAL_Arsenal_Reserve_desc: "Часть выпуска нельзя продавать немедленно. Неприкосновенный запас позволит выполнять обязательства даже во время мобилизации."
 VAL_Westerholm_Concessions:0 "Дополнительные воркерландские поставки"
 VAL_Westerholm_Concessions_desc:0 "Предложим Воркерланду расширить разработку месторождения в районе [38.GetName] и передать права на его сталь. Договор действует только до распада Воркерланда или потери района поставок."

 VAL_Company_Rosters: "Реестры рот"
 VAL_Company_Rosters_desc: "Каждая наёмная рота будет внесена в единый реестр людей, вооружения и обязательств."
 VAL_Border_Survey_Corps: "Корпус пограничной разведки"
 VAL_Border_Survey_Corps_desc: "Небольшие группы заранее изучат дороги, мосты и перевалы на направлениях непосредственных амбиций."
 VAL_Contractor_Officers: "Офицеры-контрактники"
 VAL_Contractor_Officers_desc: "Лучшие командиры получат государственные контракты и единые требования к подготовке. Реформа повышает организацию армии на §G3%§! сверх текущего уровня контрактных войск."
 VAL_Motorized_Columns: "Моторизованные колонны"
 VAL_Motorized_Columns_desc: "Подвижные колонны наладят доставку грузов разрозненным ротам. Расход снабжения армии снизится на §G3%§! независимо от других военных реформ."
 VAL_Field_Repair_Corps: "Полевой ремонтный корпус"
 VAL_Field_Repair_Corps_desc: "Ремонтные команды будут следовать за ротами и возвращать технику в строй. Восстановление организации армии ускорится на §G3%§! независимо от других военных реформ."
 VAL_Reserve_Battalions: "Резервные батальоны"
 VAL_Reserve_Battalions_desc: "Государство сформирует собственный резерв, не связанный с текущими частными заказами."
 VAL_Contract_General_Staff: "Контрактный генеральный штаб"
 VAL_Contract_General_Staff_desc: "Штаб объединит планы рот, транспортных контор и учёт трофеев. Скорость планирования вырастет на §G5%§!, захват снаряжения - на §G3%§! даже при полностью развитой контрактной армии."

 VAL_Vorkerland_Contracts_Burn:0 "Разрыв воркерландских поставок"
 VAL_Vorkerland_Contracts_Burn_desc:0 "Распад главного рынка оставил арсеналы без оплаты, а поставщиков без гарантий. Закроем наиболее опасные обязательства и направим высвобожденные резервы на сохранение производства. Первая из шести антикризисных программ."
 VAL_Inventory_The_Empty_Yards:0 "Инвентаризация промышленности"
 VAL_Inventory_The_Empty_Yards_desc:0 "Правительству нужны проверенные данные о станках, сырье и незавершённых заказах. Инвентаризация определит, какие предприятия можно вернуть к работе немедленно, а какие нуждаются в переоснащении."

 VAL_military_operations: "Военные операции"
 VAL_military_operations_desc:0 "Оперативная обстановка в Окцидии, северных землях и Южном Цайгене. Цвет соответствует текущему контролёру. Продажи находятся в разделе «Экспортные контракты»."
 VAL_propaganda_campaigns: "Пропагандистские кампании"
 VAL_propaganda_campaigns_desc: "Одновременно можно вести только столько кампаний, сколько доступно пропагандистских слотов."
 VAL_contract_obligations: "Контрактные обязательства"
 VAL_contract_obligations_desc: "Регулярные поставки, от которых зависят репутация, доходы и способность Кефрейта обслуживать долг."

 VAL_operations_panel_title:0 "КАРТА ОПЕРАЦИЙ"
 VAL_operations_panel_tt:0 "Карта показывает Стеланд, [CIN.GetName], [OSF.GetName] и северные пограничные земли. Названия участников соответствуют странам на основной карте."
 VAL_operations_map_tt:0 "Земли Кефрейта, Стеландера, Нодрула и каннибалов. Страны окрашены в свои национальные цвета по текущему контролю регионов. Внутренние границы и жёлтая штриховка разделённого контроля показаны только на территории под управлением Кефрейта.\n\nЭкономическое восстановление требует северной хозяйственной базы и присоединения Окцидии. Эртия не входит в обязательные условия восстановления."
 VAL_operations_legend:0 "§RКефрейт§! / светлее - администрация\n§BМестная власть§!   §OПротивник§!   §gИной контролёр§!"
 VAL_focus_operations_map_unlock_tt: "Открывает категорию решений §Y«Военные операции»§! и интерактивную карту соседних регионов."

 VAL_ops_finance_cin_contacts:0 "Связи с [CIN.GetNameDef]"
 VAL_ops_finance_cin_contacts_desc: "За £political_power_texticon §Y10§! и £ADISCORD_economy_treasury_texticon §Y50§! за §Y21 день§! [CIN.GetName] решит, допустить ли кефрейтских посредников. Согласие поднимет сеть на §Y1 ступень§! (§G+2%§! торгового дохода, предел §Y3§! / §G6%§!). Отказ, исчезновение, капитуляция или война вернут §Y50§!; политические затраты не возвращаются. Текущая сеть: §Y[?VAL_CIN_influence|0]/3§!."
 VAL_ops_sell_rifles_to_cin:0 "Винтовки для [CIN.GetNameDef]"
 VAL_ops_sell_rifles_to_cin_desc: "Зарезервировать £infantry_equipment_texticon §Y[VALGetExportRifleQuantity]§! винтовок. Через §Y21 день§! [CIN.GetName] примет или отклонит груз. Согласие даёт Кефрейту £ADISCORD_economy_treasury_texticon §G[VALGetExportIncome]§! и поднимает сеть покупателя на §Y2 ступени§! (до §Y3§!, по §G2%§! торгового дохода). Отказ, исчезновение, капитуляция или война вернут винтовки. После «Резервных реестров» предложение уйдёт второму северному покупателю, если он ещё может принять груз. £political_power_texticon §Y10§! не возвращаются. Объём и выручка фиксируются при резерве."
 VAL_ops_finance_osf_contacts:0 "Связи с [OSF.GetNameDef]"
 VAL_ops_finance_osf_contacts_desc: "За £political_power_texticon §Y10§! и £ADISCORD_economy_treasury_texticon §Y50§! за §Y21 день§! [OSF.GetName] решит, допустить ли кефрейтских посредников. Согласие поднимет сеть на §Y1 ступень§! (§G+2%§! торгового дохода, предел §Y3§! / §G6%§!). Отказ, исчезновение, капитуляция или война вернут §Y50§!; политические затраты не возвращаются. Текущая сеть: §Y[?VAL_OSF_influence|0]/3§!."
 VAL_ops_sell_rifles_to_osf:0 "Винтовки для [OSF.GetNameDef]"
 VAL_ops_sell_rifles_to_osf_desc: "Зарезервировать £infantry_equipment_texticon §Y[VALGetExportRifleQuantity]§! винтовок. Через §Y21 день§! [OSF.GetName] примет или отклонит груз. Согласие даёт Кефрейту £ADISCORD_economy_treasury_texticon §G[VALGetExportIncome]§! и поднимает сеть покупателя на §Y2 ступени§! (до §Y3§!, по §G2%§! торгового дохода). Отказ, исчезновение, капитуляция или война вернут винтовки. После «Резервных реестров» предложение уйдёт второму северному покупателю, если он ещё может принять груз. £political_power_texticon §Y10§! не возвращаются. Объём и выручка фиксируются при резерве."

 VAL_campaign_rifles_and_bread: "Кампания «Винтовки и хлеб»"
 VAL_campaign_rifles_and_bread_desc: "На пятьдесят дней связать военное производство с обещанием повседневной обеспеченности. Занимает один пропагандистский слот."
 VAL_campaign_contracts_feed_families: "Кампания «Контракты кормят семьи»"
 VAL_campaign_contracts_feed_families_desc: "На шестьдесят дней представить контрактную экономику единственной гарантией занятости и порядка."
 VAL_campaign_no_promise_without_payment: "Кампания «Нет обещаний без оплаты»"
 VAL_campaign_no_promise_without_payment_desc: "На сорок пять дней превратить жёсткую деловую репутацию в политический и торговый ресурс."
 VAL_campaign_the_mine_was_stolen: "Кампания «У нас украли рудник»"
 VAL_campaign_the_mine_was_stolen_desc: "После потери воркерландского металла направить недовольство наружу и подготовить общество к борьбе за новый источник металла."

 VAL_quarterly_contract_deadline: "Срок квартального норматива"
 VAL_quarterly_contract_deadline_desc: "До конца квартала необходимо передать §Y4000 винтовок§!. Просрочка понизит контрактную репутацию на одну ступень и немедленно запустит следующий девяностодневный период."
 VAL_pay_quarterly_contract_norm: "Выполнить квартальный норматив"
 VAL_pay_quarterly_contract_norm_desc: "Списать §Y4000 винтовок§! и закрыть текущий норматив. Успешная поставка восстанавливает одну потерянную ступень репутации, но не выше максимальной."

 VAL_big_buyers: "Большие покупатели"
 VAL_big_buyers_desc: "Пока Воркерланд сохраняет единый рынок, крупные покупатели обеспечивают устойчивый поток заказов: §G+20§! к еженедельному доходу, §G+20%§! к доходу от торговли, §G+10%§! к доходу гражданской промышленности, §G+8%§! к доходу военной промышленности, §G+8%§! к инвестиционному доверию и §G+5%§! к приросту эффективности производства.\n\nЦена этой зависимости - §R+5%§! к социальным расходам, §R+5%§! к росту перегрузки государства, §R-5%§! к кредитоспособности и §R-3%§! к стабильности.\n\n    §RПри любых потрясениях у наших партнёров эта поддержка исчезнет.§!\n\nКефрейт получает право на сталь района [33.GetName]. При гражданской войне в Воркерланде или утрате района поставки прекращаются. В родных землях Кефрейта есть только нефть."
 VAL_westerholm_concession_income: "Воркерландская концессия"
 VAL_westerholm_concession_income_desc: "Кефрейт получает металл и арендный доход от разработки месторождения в Воркерланде."
 VAL_vorkerland_contract_disruptions:0 "Разрыв воркерландских поставок"
 VAL_vorkerland_contract_disruptions_desc:0 "Потеря заказов и сырья обрушила доходы и загрузку заводов. Экспорт временно поддерживает казну. Штраф снимает фокус «Собственная база снабжения» после подчинения земель каннибалов и присоединения Окцидии: Балчанска, Гавани и Шахтёрского посёлка."
 VAL_vorkerland_metal_shortage: "Дефицит воркерландского металла"
 VAL_vorkerland_metal_shortage_desc: "Потеря контроля над воркерландским месторождением лишила промышленность привычного сырьевого канала."
 VAL_contract_reputation_3: "Безупречная контрактная репутация"
 VAL_contract_reputation_3_desc: "Кефрейт выполняет квартальные поставки точно в срок; покупатели и кредиторы считают его надёжным."
 VAL_contract_reputation_2: "Устойчивая контрактная репутация"
 VAL_contract_reputation_2_desc: "Недавние поставки в целом соблюдаются, но рынок больше не даёт Кефрейту прежней премии за надёжность."
 VAL_contract_reputation_1: "Подорванная контрактная репутация"
 VAL_contract_reputation_1_desc: "Повторные срывы уменьшают доходы, ухудшают кредитоспособность и повышают стоимость обслуживания долга."
 VAL_contract_reputation_0: "Контрактный дефолт"
 VAL_contract_reputation_0_desc: "Рынок больше не верит обещаниям Кефрейта. Доходы обрушились, кредит сжался, а старый долг стал тяжелее."

 VAL_Ministry_Auditors: "Инспекторы министерства"
 VAL_Ministry_Auditors_desc: "Инспекторы сверят экспортные договоры и платежи, чтобы вернуть пропущенные сборы в бюджет. Торговый доход вырастет на §G5%§! независимо от уровня контрактной администрации."
 VAL_Central_Payment_Office: "Центральная платёжная палата"
 VAL_Central_Payment_Office_desc: "Расчёты по государственным заказам пройдут через единую палату, способную отличить временную задержку от системного срыва."
 VAL_Provincial_Contract_Courts: "Провинциальные контрактные суды"
 VAL_Provincial_Contract_Courts_desc: "Споры между фабрикантами, посредниками и ротами будут решаться по единому государственному порядку."
 VAL_Captains_Cannot_Veto: "Капитаны не имеют права вето"
 VAL_Captains_Cannot_Veto_desc: "Командиры сохранят голос в военных вопросах, но больше не смогут блокировать решения государства угрозой расторгнуть частный договор."
 VAL_State_Contract: "Государственный контракт"
 VAL_State_Contract_desc: "Платёжная палата, суды и подчинённые капитаны образуют устойчивую политическую систему, а не временный союз вокруг одного правителя."

 VAL_Wireless_Contract_Bureau: "Бюро контрактного вещания"
 VAL_Wireless_Contract_Bureau_desc: "Радио, листовки и фронтовые корреспонденты получат единый редакционный план и постоянное финансирование."
 VAL_Stories_From_The_Front: "Истории с передовой"
 VAL_Stories_From_The_Front_desc: "Вместо отвлечённых лозунгов бюро покажет конкретных людей, чьи семьи живут за счёт производства и службы."
 VAL_Two_Concurrent_Narratives: "Два параллельных нарратива"
 VAL_Two_Concurrent_Narratives_desc: "Разделение внутренней и внешней редакций позволит одновременно вести ещё одну пропагандистскую кампанию."

 VAL_Munitions_Board: "Боеприпасная коллегия"
 VAL_Munitions_Board_desc: "Коллегия сведёт заявки армии и экспортные обязательства в один производственный график."
 VAL_Export_Clearing_House:0 "Расчёты без посредников"
 VAL_Export_Clearing_House_desc:0 "Экспортная палата сведёт встречные обязательства и направит платежи в государственный бюджет без цепочки частных сборщиков. Доходная база расширится, административные издержки сократятся."
 VAL_Standard_Cartridges: "Единый патрон"
 VAL_Standard_Cartridges_desc: "Одинаковые патроны и упаковка сократят потери на складах и упростят снабжение контрактных рот."
 VAL_Three_Shift_Arsenals:0 "Расширение серийного производства"
 VAL_Three_Shift_Arsenals_desc:0 "Восстановленные станки должны выпускать совместимые изделия крупными сериями. Переход на устойчивый сменный режим закрепит результат промышленной реконструкции."
 VAL_Reserve_Accounting:0 "Система стратегических запасов"
 VAL_Reserve_Accounting_desc:0 "Запасы сырья и оружия будут учитывать по общим нормам. Это позволит снабжать действующую армию, выполнять внешние заказы и не останавливать заводы при очередном срыве поставок."
 VAL_Industrial_Mobilization_Plan:0 "Новая промышленная политика"
 VAL_Industrial_Mobilization_Plan_desc:0 "Сведём чрезвычайные меры в общий производственный план. Это последняя из шести первоначальных программ: часть штрафов сохранится до победы, восстановления торговли и послевоенного урегулирования долгов."

 VAL_Company_Service_Code: "Устав контрактной службы"
 VAL_Company_Service_Code_desc: "Общие правила службы определят ответственность роты перед штабом, государством и соседними подразделениями."
 VAL_Contract_NCO_Schools: "Школы контрактных унтер-офицеров"
 VAL_Contract_NCO_Schools_desc: "Единая подготовка младших командиров позволит ротам действовать совместно, не теряя управление на марше."
 VAL_Logistics_Command: "Командование снабжения"
 VAL_Logistics_Command_desc: "Полевой ремонт, транспорт и склады подчинятся одному командованию с общей картиной запасов."
 VAL_Operational_Reserves: "Оперативные резервы"
 VAL_Operational_Reserves_desc: "Резервные батальоны получат штатное оружие и заранее определённые направления развёртывания."
 VAL_Army_Of_The_Ledger: "Армия единого реестра"
 VAL_Army_Of_The_Ledger_desc: "Контрактные роты окончательно становятся армией: с общим штабом, снабжением, резервом и системой командования."

 VAL_Foreign_Broker_Licences: "Лицензии иностранных посредников"
 VAL_Foreign_Broker_Licences_desc:0 "Откроем единую экспортную контору. Воюющие правительства на севере, в Стеландере и Воркерланде смогут покупать наши винтовки. Короткие контракты помогут пережить разрыв прежних поставок."
 VAL_Northern_Clearing_House:0 "Второй экспортный стол"
 VAL_Northern_Clearing_House_desc:0 "Отдельная группа расчётов позволит обслуживать второй оружейный контракт. Каждый договор по-прежнему требует собственного покупателя, его согласия на оплату и реальной партии оружия."
 VAL_Contingency_Ledgers:0 "Контракты военных советников"
 VAL_Contingency_Ledgers_desc:0 "Опыт кефрейтских штабов тоже имеет цену. Разрешим одну платную миссию советников: получатель приобретёт военную помощь, казна - временный доход."


 VAL_contract_administration_1: "Контрактная администрация I"
 VAL_contract_administration_1_desc: "Единые реестры улучшают сбор доходов и устойчивость государства."
 VAL_contract_administration_2: "Контрактная администрация II"
 VAL_contract_administration_2_desc: "Центральные расчёты и контрактные суды укрепляют налоги, торговлю и политическую управляемость."
 VAL_contract_administration_3: "Контрактная администрация III"
 VAL_contract_administration_3_desc: "Полностью собранная контрактная система повышает доходы и снижает перегрузку государственного аппарата."
 VAL_contract_industry_1: "Контрактная промышленность I"
 VAL_contract_industry_1_desc: "Проверенные заказы ускоряют рост эффективности оружейных линий."
 VAL_contract_industry_2: "Контрактная промышленность II"
 VAL_contract_industry_2_desc: "Стандартизация и учёт повышают выпуск и уменьшают потери от нехватки сырья."
 VAL_contract_industry_3: "Контрактная промышленность III"
 VAL_contract_industry_3_desc: "План мобилизации объединяет арсеналы в зрелую военную промышленность."
 VAL_contract_army_1: "Контрактная армия I"
 VAL_contract_army_1_desc: "Реестры рот создают основу общей организации и планирования."
 VAL_contract_army_2: "Контрактная армия II"
 VAL_contract_army_2_desc: "Единые офицерские требования, ремонт и снабжение повышают устойчивость войск."
 VAL_contract_army_3: "Контрактная армия III"
 VAL_contract_army_3_desc: "Общий штаб превращает отдельные роты в связанную и управляемую армию."
 VAL_contract_propaganda_office: "Бюро контрактной пропаганды"
 VAL_contract_propaganda_office_desc: "Постоянная редакция поддерживает порядок и готовность общества через связанные кампании."
 VAL_contract_propaganda_upgrade_tt: "Активирует скрытый постоянный бонус контрактного вещания."
 VAL_factory_cathedrals_drive_tt: "На §Y365 дней§!: скорость строительства военных заводов §G+10%§!."
 VAL_hot_production_lines_tt: "Максимальная эффективность производства §G+3%§!."
 VAL_northern_roads_drive_tt: "На §Y365 дней§!: скорость строительства инфраструктуры §G+10%§!."
 VAL_focus_contract_board_tt: "Открывает доступ к §Yконтрактной доске§! и внешним операциям."
 VAL_focus_authority_5_tt: "§G+5§! к §Yконтрактному авторитету§!."
 VAL_focus_authority_10_tt: "§G+10§! к §Yконтрактному авторитету§!."
 VAL_focus_captain_retainers_tt: "Разблокирует §Yкапитанов-ретейнеров§! для специальных контрактов."
 VAL_focus_count_captains_tt: "Открывает возможность §Yпересчёта и аудита§! капитанов."
 VAL_focus_foreign_operations_tt: "Разблокирует §Yвнешние операции§! на интерактивной карте."
 VAL_focus_quality_arsenal_tt: "Активирует специализацию §Yкачественного арсенала§! для контрактного государства."
 VAL_focus_broad_resource_network_tt: "Активирует специализацию §Yширокой ресурсной сети§! для контрактного государства."
 VAL_focus_supply_contracts_tt: "Активирует специализацию §Yснабженческих контрактов§! для контрактного государства."
 VAL_focus_resource_raider_tt: "Активирует доктрину §Yресурсного рейдера§! Громова."
 VAL_focus_manpower_preservation_tt: "Активирует модель §Yсохранения людских ресурсов§! урожая пепла."
 VAL_focus_rear_mobilization_tt: "Активирует модель §Yтыловой мобилизации§! урожая пепла."
 VAL_focus_north_coercive_tt: "Активирует специализацию §Yпринудительных мер§! для северной политики."
 VAL_focus_northern_operations_tt: "Разблокирует §Yсеверные операции§! на карте военных действий."

 VAL_rework_debug: "§RDEBUG:§! Кефрейт"
 VAL_rework_debug_desc: "Служебные переключатели новой системы Кефрейта. Видны только в режиме отладки."
 VAL_debug_initialize_systems: "§RDEBUG:§! Инициализировать системы"
 VAL_debug_initialize_systems_desc: "Повторно запускает безопасную инициализацию экономики, пропаганды, квартального норматива и ресурсных состояний."
 VAL_debug_unlock_operations_map: "§RDEBUG:§! Открыть карту операций"
 VAL_debug_unlock_operations_map_desc: "Принудительно включает категорию военных операций и её интерактивную карту."
 VAL_debug_disrupt_vorkerland_contracts: "§RDEBUG:§! Сорвать воркерландские контракты"
 VAL_debug_disrupt_vorkerland_contracts_desc: "Включает потерю воркерландских доходов и открывает соответствующую аварийную ветку."
 VAL_debug_lose_westerholm_metal: "§RDEBUG:§! Потерять металл воркерландского металла"
 VAL_debug_lose_westerholm_metal_desc: "Имитирует потерю ресурсных прав и включает дефицит металла."
 VAL_debug_reputation_maximum: "§RDEBUG:§! Максимальная репутация"
 VAL_debug_reputation_maximum_desc: "Устанавливает контрактную репутацию на максимальную ступень."
 VAL_debug_reputation_minimum: "§RDEBUG:§! Контрактный дефолт"
 VAL_debug_reputation_minimum_desc: "Устанавливает контрактную репутацию на минимальную ступень."
 VAL_debug_grant_contract_reserves: "§RDEBUG:§! Выдать тестовые резервы"
 VAL_debug_grant_contract_reserves_desc: "Добавляет казну, винтовки и вспомогательное снаряжение для проверки решений."
 VAL_debug_reset_rework_state: "§RDEBUG:§! Сбросить отладочные состояния"
 VAL_debug_reset_rework_state_desc: "Убирает только отладочные стадии кризиса и тестовые штрафы Воркерланда, не трогая прохождение фокусов."


 VAL_contract_state: "Контрактное государство"
 VAL_contract_state_desc: "Параметры государства определяются авторитетом контрактной системы. Производственные, доктринальные и административные специализации напрямую меняют показатели этого духа."
 VAL_CONTRACT_AUTHORITY_DOMINANT: "единое командование"
 VAL_CONTRACT_AUTHORITY_COHERENT: "устойчивая система"
 VAL_CONTRACT_AUTHORITY_BROKERED: "согласованный рынок"
 VAL_CONTRACT_AUTHORITY_FRAGMENTED: "разрозненные капитаны"
 val_contract.300.t: "Кефрейтская сеть с [CIN.GetNameDef]"
 val_contract.300.d: "Местный посредник принёс ответ не на официальной бумаге, а в собственной записной книжке. Он готов связать кефрейтские конторы с людьми, которые контролируют склады, рынок и часть местной администрации. Взамен хочет, чтобы следующие сделки тоже проходили через его сеть.\n\nТак Кефрейт обычно и входит в чужую экономику. Сначала один знакомый предлагает провести груз быстрее обычного. Затем появляются постоянные счета, свои переводчики и чиновник, который уже не помнит, как работал без кефрейтского расчётного дома.\n\nОстаётся решить, стоит ли превращать этот контакт в ещё одно звено внешней сети."
 val_contract.300.a: "Разрешить сделку"
 val_contract.300.b: "Заблокировать посредников"
 val_contract.301.t: "Кефрейтская сеть с [OSF.GetNameDef]"
 val_contract.301.d: "$val_contract.300.d$"
 val_contract.301.a: "$val_contract.300.a$"
 val_contract.301.b: "$val_contract.300.b$"
 val_contract.302.t: "Кефрейтская сеть в Антропофагоруме"
 val_contract.302.d: "$val_contract.300.d$"
 val_contract.302.a: "$val_contract.300.a$"
 val_contract.302.b: "$val_contract.300.b$"

# BEGIN CONSOLIDATED: ADISCORD_national_focuses_l_russian.yml: live VAL focuses
  VAL_The_Contract_State: "Государство контракта"
  VAL_The_Contract_State_desc: "Кефрейт не просит верности и не верит в клятвы. Здесь власть начинается с подписи, ставки и человека, который готов проследить, чтобы договор исполнили."
  VAL_The_Weaponry_Baron: "Оружейный барон"
  VAL_The_Weaponry_Baron_desc: "Валера Солгалов держит страну не речами, а цепью заводов, посредников и капитанов. Его трон не позолочен - он смазан машинным маслом и пороховой гарью."
  VAL_Price_Of_Loyalty: "Цена верности"
  VAL_Price_Of_Loyalty_desc: "В Кефрейте лояльность не наследуют и не воспитывают. Её покупают, пересматривают и оплачивают снова, пока у государства хватает оружия, денег и страха."
  VAL_Count_The_Captains: "Пересчитать капитанов"
  VAL_Count_The_Captains_desc: "Каждая рота знает своего командира лучше, чем столицу. Прежде чем страна двинется дальше, Солгалову нужно понять, какие капитаны служат Кефрейту, а какие - только следующему заказу."
  VAL_One_Ledger_One_Banner: "Одна книга, одно знамя"
  VAL_One_Ledger_One_Banner_desc: "Разрозненные контракты должны стать государственным реестром. Кефрейт останется рынком войны, но этот рынок будет говорить одним голосом."
  VAL_Factories_Like_Cathedrals:0 "Модернизация оружейных заводов"
 VAL_Factories_Like_Cathedrals_desc:0 "Оружейные заводы остаются главным капиталом Кефрейта. Единый заказ на оборудование и ремонт позволит увеличить выпуск уже работающих арсеналов, не расходуя средства на пустующие корпуса. Дополнительно подготовим 500 винтовок и закрепим непрерывную загрузку производственных линий."
  VAL_Keep_The_Lines_Hot:0 "Непрерывный производственный цикл"
  VAL_Keep_The_Lines_Hot_desc:0 "Сменные графики, запас комплектующих и общие стандарты обслуживания должны устранить простои. Существующие мощности будут работать устойчивее, а первая партия пополнит оружейный резерв."
  VAL_Ballistics_Schools: "Баллистические школы"
  VAL_Ballistics_Schools_desc: "Эйнар Толл и его ученики превращают ремесло войны в учебную дисциплину. Снаряд должен лететь не туда, куда молятся, а туда, куда рассчитали."
  VAL_Brokered_Steel: "Сталь через посредников"
  VAL_Brokered_Steel_desc: "Мир не обязан любить Кефрейт, чтобы покупать у него оружие. Мирон Саблев знает: между моралью и поставкой всегда можно поставить ещё одну подпись."
  VAL_Export_Rifles_Not_Promises:0 "Национальное экспортное бюро"
  VAL_Export_Rifles_Not_Promises_desc:0 "Экспорт требует не обещаний капитанов, а оплаченных заказов и надёжной поставки. Бюро связывает внешние контракты с реальными запасами оружия и не подменяет покупателя государственными субсидиями."
  VAL_The_Mercenary_State: "Единый реестр рот"
  VAL_The_Mercenary_State_desc: "Разрозненные наёмные роты должны стать частями контрактной системы. Их боевые свойства теперь определяются изменяемым авторитетом реестра, поэтому слабый центр не получит тех же преимуществ, что и единое командование."
  VAL_Hire_Out_War: "Сдать войну в аренду"
  VAL_Hire_Out_War_desc: "Чужие войны кормят кефрейтские семьи лучше, чем проклятая почва. Если кто-то хочет крови, Кефрейт предложит дисциплину, снаряжение и цену."
  VAL_Vorons_Companies: "Роты Ворона"
  VAL_Vorons_Companies_desc: "Кирилл Ворон предпочитает быстрые удары и людей, которые не задают лишних вопросов. Его роты появляются там, где контракт требует тишины."
  VAL_Stahls_Schedules: "Расписания Шталь"
  VAL_Stahls_Schedules_desc: "Эрика Шталь превращает наёмную массу в порядок: смены, маршруты, пайки, боевые окна. Даже грязная война должна идти по графику."
  VAL_Gromovs_Assault_Tables: "Штурмовые таблицы Громова"
  VAL_Gromovs_Assault_Tables_desc: "Борис Громов считает наступление арифметикой давления. Если цифры сходятся, люди идут вперёд; если нет - их заставляют сходиться."
  VAL_Morns_Supply_Trains: "Обозы Морн"
  VAL_Morns_Supply_Trains_desc: "Рената Морн знает, что контракт умирает не от пули, а от пустого склада. Её обозы держат кефрейтскую войну на колёсах."
  VAL_The_Harvest_Of_Ash: "Урожай пепла"
  VAL_The_Harvest_Of_Ash_desc: "Кефрейтская земля больше помнит снаряды, чем семена. Народ живёт среди сухих полей, костей и металла, который легче продать, чем превратить в хлеб."
  VAL_Field_Surgeons: "Полевые хирурги"
  VAL_Field_Surgeons_desc: "Лада Хром собирает людей обратно по частям, потому что Кефрейт не может позволить себе терять тела быстрее, чем подписывает контракты."
  VAL_Bread_From_Barracks: "Хлеб из казарм"
 VAL_Bread_From_Barracks_desc:0 "Когда деревни не кормят страну, государство кормит деревни через склады армии. Постоянные заказы гражданским подрядчикам ускорят строительство и поддержат тыл."
  VAL_Dead_Villages_Still_Count: "Мёртвые деревни всё ещё считаются"
  VAL_Dead_Villages_Still_Count_desc: "На карте Кефрейта есть места, где остались только списки жителей и ржавые колодцы. Государство может забыть их имена, но не может забыть, что пустота тоже имеет цену."
  VAL_Market_Roads_North:0 "Северные торговые маршруты"
  VAL_Market_Roads_North_desc:0 "Племенные рынки могут заменить часть утраченного сбыта. Откроем постоянные торговые представительства и подготовим северное направление внешней политики."
  VAL_Trading_Partners: "Торговые партнёры"
  VAL_Trading_Partners_desc: "WRK, NAM, IVN и WIT нужны поставки, а Кефрейту нужны рынки. Между ними нет любви, но есть взаимная привычка отвечать на запросы."
  VAL_October_Of_2160: "Октябрь 2160-го"
  VAL_October_Of_2160_desc: "Стеланд помнит октябрь иначе, чем Кефрейт. Одни называют его сделкой, другие - раной, но обе стороны знают, что старые подписи всё ещё бросают тень."
  VAL_Different_Views_On_Freedom: "Разные взгляды на свободу"
  VAL_Different_Views_On_Freedom_desc: "Для TFF свобода звучит как право не подчиняться. Для Кефрейта свобода слишком часто означает право подписать контракт и не спрашивать, кто будет умирать за его исполнение."
  VAL_Contracts_Outlive_Kings: "Контракты переживают королей"
 VAL_Contracts_Outlive_Kings_desc:0 "Лидеры стареют, партии трескаются, границы спорят с картами. Единая система договоров связывает государство, арсеналы и армию. Долгосрочные заказы повысят выпуск действующей промышленности."
 VAL_Stelander_Crisis_Opens: "[ROOT.VALGetStelanderFocusTitle]"
 VAL_Stelander_Crisis_Opens_desc: "Изучим расположение частей и подготовим договоры после распада Стеландера. Военные действия и обязательства перед покупателями остаются отдельными решениями.\n\n[ROOT.VALGetStelanderCrisisStatus]"
 VAL_Arms_For_The_Burning: "[ROOT.VALGetArmsFocusTitle]"
 VAL_Arms_For_The_Burning_desc: "[ROOT.VALGetArmsFocusDescription]\n\n[ROOT.VALGetStelanderCrisisStatus]"
 VAL_Seize_The_Northern_Passes: "[ROOT.VALGetPassesFocusTitle]"
 VAL_Seize_The_Northern_Passes_desc: "[ROOT.VALGetPassesFocusDescription]\n\n[ROOT.VALGetStelanderCrisisStatus]"
 VAL_The_Steel_Contract: "[ROOT.VALGetSteelContractTitle]"
 VAL_The_Steel_Contract_desc: "Исполненные поставки или успешная операция дают основание вкладываться в выпуск действующих арсеналов. Если кампания закончилась неудачно, займёмся восстановлением доверия к правительству и пересмотром обязательств.\n\n[ROOT.VALGetStelanderCrisisStatus]"
 VAL_merchant_rail_yards_tt: "Проложена железная дорога §G3-го уровня§! между Депотодроном и Зойлонгом."
