 NOD_VAL_administration_etatism:0 "Нодрульский протекторат"
 NOD_VAL_administration_etatism_DEF:0 "Нодрульский протекторат"
 NOD_VAL_administration_etatism_ADJ:0 "Нодрульск"
 VAL_ratify_postwar_administration:0 "Утвердить договорную администрацию"
 VAL_ratify_postwar_administration_desc:0 "Учредим особый договорный режим в уже подчинённой стране. Её руководство, флаг и восстановительная программа будут приведены в соответствие с послевоенным уставом."

 VAL_Audit_Lost_Contracts:0 "Разобрать сорванные контракты"
 VAL_Audit_Lost_Contracts_desc:0 "Распад Воркерланда оставил неоплаченные счета и грузы без получателей. Отделим исполненные обязательства от утраченных заказов и опубликуем порядок возмещения. Возвращение доверия начинается с признания собственных долгов."

 VAL_Guarantee_Deliveries:0 "Гарантировать сроки поставок"
 VAL_Guarantee_Deliveries_desc:0 "Кефрейт слишком долго продавал уверенность вместе с оружием, а затем заставлял покупателя верить объяснениям задержек. Теперь под каждый подписанный заказ заранее резервируются металл, детали и место в производственном графике. Дата отгрузки становится частью обязательства, а её нарушение отражается в тех же книгах, что и прибыль.\n\nКонтрактное государство вернёт доверие не рекламой арсеналов, а привычкой выполнять обещанное в назначенный день."
 VAL_Independent_Trials:0 "Независимая приёмка"
 VAL_Independent_Trials_desc:0 "Допустим представителей заказчиков к испытаниям оружия. Единые требования к качеству и открытые протоколы приёмки вернут фабрикам доверие, утраченное вместе с западным рынком."

 VAL_Returning_Buyers:0 "Возвращение заказчиков"
 VAL_Returning_Buyers_desc:0 "Подтверждённое качество и соблюдение сроков дают первые повторные заказы. Их авансы вернут часть оборотных средств. Это выход из изоляции, но для прежней известности нужны безопасные торговые пути и окончание войны."

 VAL_Reopen_Trade_Routes:0 "Открыть послевоенные маршруты"
 VAL_Reopen_Trade_Routes_desc:0 "Военная карта после победы мало похожа на торговую. Разбитый мост не становится полезнее от того, что над ним висит наш флаг, а занятый склад ничего не значит без регулярного каравана. Инженеры и контрактные конторы заново сведут северные месторождения, окцидские администрации и арсеналы в одну сеть перевозок.\n\nНовые маршруты должны заменить зависимость от воркерландских посредников не лозунгом о самостоятельности, а грузом, который действительно приходит на завод каждую неделю."
 VAL_Settle_Industrial_Debts:0 "Урегулировать промышленные долги"
 VAL_Settle_Industrial_Debts_desc:0 "За время войны заводы жили на авансах, реквизициях и обещаниях, которые разные ведомства записывали в разные книги. Капитаны считают часть расходов военным риском. Владельцы цехов называют их государственным долгом. Казначейство не сможет строить мирную систему, пока каждый держит собственную версию счёта.\n\nКомиссия сведёт обязательства, спишет то, что было ценой кампании, и закрепит постоянный график расчётов. Кефрейт умеет требовать исполнения договора от других. Теперь ему придётся применить то же правило к себе."
 VAL_Return_To_World_Market:0 "Снова известны во всём мире"
 VAL_Return_To_World_Market_desc:0 "Мир заключён, долги урегулированы, а новые маршруты обеспечивают заводы сырьём. Проверенные контракты возвращают оружейным фабрикам международную известность. Последняя программа завершает экономическое восстановление и повышает предельную эффективность производства."

 VAL_Veterans_Of_The_Campaign:0 "Опыт победившей армии"
 VAL_Veterans_Of_The_Campaign_desc:0 "Победа оставила Кефрейту не только новые дороги и списки потерь. Командиры рот впервые провели длительную кампанию в общей системе снабжения, единых штабных сроках и под контролем государственного реестра. Этот опыт слишком дорог, чтобы снова растворить его по частным компаниям.\n\nСергей Волков соберёт разборы операций и превратит привычки победивших частей в программу подготовки. Ветеран должен возвращаться из войны не со своей маленькой армией, а с инструкцией для следующей."
 VAL_arsenal_reputation:0 "Репутация оружейных заводов"
 VAL_arsenal_reputation_desc:0 "Доверие заказчиков: [?VAL_arsenal_reputation_stage|0]/5. Гражданская война в Воркерланде обнуляет прежнюю известность. Четыре программы восстанавливают доверие, а возвращение на мировой рынок после победы открывает последнюю ступень и повышает предельную эффективность производства. Соблюдение квартальных поставок учитывается отдельно."
 VAL_arsenal_reputation_delta:0 "Возвращение доверия заказчиков"
 VAL_arsenal_quality_delta:0 "Международное признание качества"
 VAL_quality_trials_bonus:0 "Независимая приёмка оружия"

 VAL_econ_development_fund:0 "Фонд промышленного развития"
 VAL_econ_development_fund_desc:0 "Откроем долгосрочное финансирование крупных промышленных программ. Государственные банки и предприятия согласуют инвестиции и поставки оборудования."
 VAL_econ_precision_industry:0 "Прецизионное станкостроение"
 VAL_econ_precision_industry_desc:0 "Точные станки определяют качество всей производственной цепи. Соберём единый заказ на оборудование и подготовим предприятия к его установке."
 VAL_econ_special_metallurgy:0 "Контракты специальной металлургии"
 VAL_econ_special_metallurgy_desc:0 "Редкие сплавы и электронные компоненты требуют устойчивого снабжения. Единые стандарты поставок свяжут собственные заводы и внешние закупки с реальными потребностями промышленности."
 VAL_econ_automation:0 "Автоматизированные арсеналы"
 VAL_econ_automation_desc:0 "Разрешим программу автоматизации. Сам фокус только открывает проект: автоматизация будет установлена после отдельного оплаченного промышленного решения, нескольких месяцев работ и выделения материалов."
 VAL_econ_logistics:0 "Промышленная транспортная сеть"
 VAL_econ_logistics_desc:0 "Производству нужны защищённые перевозки. Фокус разрешает оплаченные заказы грузового транспорта и бронированных поездов из уже освоенных моделей; техника поступит только после завершения промышленного контракта."
 VAL_econ_computing:0 "Вычислительная сеть Кефрейта"
 VAL_econ_computing_desc:0 "Разрешим создание общего вычислительного комплекса. Фокус открывает программу, но постоянный эффект появится только после завершения отдельно оплаченного проекта."
 VAL_econ_defense_orders:0 "Высокотехнологичные военные заказы"
 VAL_econ_defense_orders_desc:0 "Согласуем с предприятиями серийный выпуск разведывательных машин и боевых платформ. Военные специалисты подготовят единые требования к новой технике."
 VAL_econ_export_finance:0 "Финансирование промышленного экспорта"
 VAL_econ_export_finance_desc:0 "Переход от разовых сделок к экспортному финансированию даст предприятиям предсказуемые расчёты. Доходы от внешней торговли должны поддерживать следующую волну инвестиций."
 VAL_econ_integrated_economy:0 "Контрактная экономика полного цикла"
 VAL_econ_integrated_economy_desc:0 "Объединим точное производство, транспорт и вычислительные мощности в единую систему. Предприятия будут согласовывать снабжение и развитие всей производственной цепи."

 VAL_Bezhaysk_Operation:0 "Операция против Бежайска"
 VAL_Bezhaysk_Operation_desc:0 "Разгром Стеландера открывает дорогу к Бежайску. После завершения государственных реформ подготовим отдельную операцию против столичного владения и отдадим приказ о наступлении."
 VAL_bezhaysk_operation_available_tt:0 "Стеландер разгромлен и его земли закреплены за Кефрейтом или его администрациями. Кефрейт независим и находится в мире; Бежайск существует, независим, не капитулировал и не состоит с нами в одном альянсе."

 VAL_vorkerland_aid:0 "Помощь Воркерланду"
 VAL_vorkerland_aid_desc:0 "Воркерланд остаётся важным покупателем и поставщиком кефрейтских заводов. Мы можем выделять ему оружие и снаряжение из собственных резервов. Каждая поставка оформляется отдельно и не требует ответной оплаты.\n\nНа карте показана историческая территория Воркерланда, включая отколовшиеся страны. Это справочная иллюстрация: она не отображает ход войны."
 VAL_aid_wrk_rifles:0 "Отправить Воркерланду 1000 винтовок"
 VAL_aid_wrk_rifles_desc:0 "Передадим Воркерланду 1000 единиц пехотного снаряжения из наших запасов. Повторная отправка доступна через 30 дней."
 VAL_aid_wrk_support:0 "Отправить Воркерланду 100 единиц снаряжения поддержки"
 VAL_aid_wrk_support_desc:0 "Передадим Воркерланду 100 единиц снаряжения поддержки из наших запасов для оснащения вспомогательных рот. Повторная отправка доступна через 30 дней."
 VAL_can_aid_vorkerland_tt:0 "Кефрейт и Воркерланд независимы и не капитулировали. Кефрейт не воюет с Воркерландом или участниками его альянса."

 VAL_Resource_War_Contracts:0 "Контракты ресурсной войны"
 VAL_Resource_War_Contracts_desc:0 "Наместнику Светлогорья и правительству Эфлора нужны оружие и подготовленные люди. Откроем отдельные контракты для воюющих сторон: поставки из арсеналов и отправку наёмников со штабными инструкторами. Условия каждого договора должен принять сам покупатель."
 VAL_resource_war_arms:0 "Предложить оружие: [FROM.GetName]"
 VAL_resource_war_arms_desc:0 "Подготовка предложения стоит §Y20§! политической власти; эта плата не возвращается при отказе. Предложим 2500 винтовок за 100 казны. При принятии покупатель платит сразу, винтовки уходят со склада, а экспортный слот остаётся занят на 70 дней."
 VAL_resource_war_personnel:0 "Предложить наёмников и инструкторов: [FROM.GetName]"
 VAL_resource_war_personnel_desc:0 "Подготовка предложения стоит §Y30§! политической власти; эта плата не возвращается при отказе. Предложим 2000 военнослужащих и инструкторов за 100 казны. При принятии Кефрейт сразу получает оплату, расходует 2000 людских ресурсов и 25 командного ресурса; получатель получает людей и советников на 70 дней."
 VAL_resource_war_arms_offer_tt:0 "Предложение на 14 дней: 2500 винтовок за 100 казны. Передача и оплата - только после согласия покупателя; Кефрейт получает доход от оружейного контракта на 70 дней."
 VAL_resource_war_personnel_offer_tt:0 "Предложение на 14 дней: 2000 военнослужащих в людской резерв и военные советники на 70 дней за 100 казны. После принятия Кефрейт расходует 2000 людских ресурсов и 25 командного ресурса."
 val_contract.341.personnel:0 "В этот раз кефрейтский пакет шире обычной штабной миссии. Вместе с инструкторами предлагается две тысячи военнослужащих для пополнения людского резерва. Они прибудут организованно, со своими списками и офицерами связи, а специалисты останутся при штабе на срок контракта. Общая цена составляет сто единиц казны.\n\nКефрейт не называет это братской помощью. Люди, обучение и риск занесены в одну ведомость, а покупатель получает именно то, за что платит. Для страны, которая сейчас считает каждого доступного бойца, такая сухая формулировка может оказаться привлекательнее любой речи о солидарности."
 VAL_resource_war_personnel_accepted_tt:0 "За 100 казны мы получим 2000 людских ресурсов и кефрейтских военных советников на 70 дней. Кефрейт расходует 2000 людских ресурсов и 25 командного ресурса, получая +10 еженедельного дохода на 70 дней."

 VAL_negotiate_nam_metals:0 "Обсудить островную концессию с наместником"
 VAL_negotiate_nam_metals_desc:0 "Предложим наместнику обменять будущие права на островную металлургию на нашу помощь в ресурсной войне. После принятия договора и получения 2500 винтовок либо 2000 военнослужащих с инструкторами победившее Светлогорье передаст нам права на добычу стали в Западном островном округе. Ранее принятая помощь в этой войне также засчитывается."
 VAL_nam_concession_negotiable_tt:0 "Ресурсная война продолжается; Кефрейт и Светлогорье независимы, не капитулировали и не воюют друг с другом. Наместник владеет Западным островным округом и контролирует его. У Эфлора нет действующего кефрейтского контракта или наших советников. Островной договор ещё не заключён."
 VAL_nam_concession_terms_tt:0 "После согласия наместника Кефрейт прекращает новые поставки Эфлору. Если Светлогорье получит от нас 2500 винтовок либо 2000 военнослужащих с инструкторами и выиграет ресурсную войну, Кефрейт получит права на добычу в Западном островном округе: базовый запас - 16 стали. Ещё 16 стали на Среднем острове остаются наместнику. Владение островами не меняется. Поражение наместника или война с Кефрейтом отменяют договор; потеря округа или контроля прекращает действующую концессию."
 VAL_register_nam_concession:0 "Оформить островную концессию"
 VAL_register_nam_concession_desc:0 "Если победа уже достигнута, но передаче прав мешала оккупация, оформим добычу после возвращения контроля наместнику."
 VAL_nam_concession_ready_tt:0 "Наместник принял договор, получил оговорённую помощь и победил в ресурсной войне. Западный островной округ принадлежит независимому Светлогорью и контролируется им. Кефрейт независим и не воюет со Светлогорьем; права ещё не переданы."
 VAL_nam_concession_reward_tt:0 "Кефрейт получает права на ресурсы Западного островного округа с базовым запасом 16 стали. Округ остаётся у Светлогорья."
 val_contract.349.t:0 "Кефрейт предлагает островной договор"
 val_contract.349.d:0 "На стол положили карту двух островов и образец руды из западного месторождения. Кефрейт предлагает связать будущую военную помощь с концессией, которая начнёт действовать только после победы в ресурсной войне. Если Светлогорье воспользуется хотя бы одним кефрейтским договором на оружие или людей и удержит страну, права на добычу стали в Западном островном округе перейдут к кефрейтской стороне.\n\nСуверенитет над островом не меняется. Средний остров и его собственное месторождение остаются у Светлогорья. Кефрейт также обязуется не снабжать Эфлор новыми контрактами. Для правительства это способ получить помощь сейчас, расплатившись не территорией, а будущим доходом с ресурса.\n\nЮристы называют такую сделку аккуратной. Геологи смотрят на карту заметно дольше."
 val_contract.349.accept:0 "Согласовать условия концессии"
 val_contract.349.refuse:0 "Не связывать месторождения договором"

 VAL_frontier_nod_forecast_tt:0 "Нодрул: [VALGetNodFrontierIntervention]"
 VAL_nod_frontier_joined:0 "§Rуже участвует на стороне племён§!"
 VAL_nod_frontier_expected:0 "§YНодрул предъявит ультиматум и даст Кефрейту 100 дней на завершение племенной кампании.§!"
 VAL_nod_frontier_unavailable:0 "§Gсейчас не вступит: условия участия или совместимость союзов не выполнены§!"

 VAL_postwar_administration:0 "Послевоенное управление"
 VAL_postwar_administration_desc:0 "Кефрейт интегрирует непосредственно удерживаемые земли как непрерывно расширяющуюся административную границу. Национализировать можно только принадлежащий и контролируемый Кефрейтом ненациональный регион, который граничит с уже национальной территорией. Одновременно идёт только одна программа; после её завершения новый core открывает для следующего шага собственных соседей. Автономные договорные администрации остаются отдельными до прямого присоединения их земель."
 VAL_nationalise_region:0 "Национализировать пограничный регион: [FROM.GetName]"
 VAL_nationalise_region_desc:0 "Распространить систему гражданства, налогов и воинского учёта Кефрейта дальше по административной границе. Регион должен напрямую принадлежать и контролироваться Кефрейтом, не быть core и граничить с уже национальной территорией. Через §Y120 дней§! он станет core и откроет для национализации собственных соседей. Одновременно можно обрабатывать только один регион. При утрате условий §Y50§! политической власти возвращаются."

 VAL_proclaim_commonwealth:0 "Провозгласить Кефрейтское содружество"
 VAL_proclaim_commonwealth_desc:0 "Закрепить послевоенное устройство общим государственным договором. Кефрейт получит новое название и флаг; автономные администрации сохранят свои территории и особый статус."
 VAL_commonwealth_requirements_tt:0 "Завершён фокус «Контракты переживают королей»; Кефрейт независим, не капитулировал и находится в мире; северные племена, Нодрул и Стеландер подчинены согласно целям кампании; северный ресурсный пояс удерживается; регионы §Y[29.GetName]§! и §Y[46.GetName]§! принадлежат Кефрейту и контролируются им; стабильность не ниже §Y50%§!"
 VAL_commonwealth_proclaimed_tt:0 "Государство получит название §YКефрейтское содружество§! и новый флаг. Статус и территории марионеток сохранятся."
 VAL_staff_influence:0 "Совещательный голос генералитета"
 VAL_staff_dominance:0 "Диктат генерального штаба"
 VAL_solgalov_influence:0 "Преимущество Солгалова"
 VAL_solgalov_dominance:0 "Личная власть Солгалова"
 VAL_command_balance_category_desc:0 "Генералитет требует самостоятельности в военных вопросах, Солгалов - контроля над заказами и назначениями. Умеренное влияние даёт преимущества; крайнее господство любой стороны снижает стабильность.\n\nПотеря принадлежащей нам национальной области во время войны сдвигает баланс на §Y10%§! к генералитету. Возвращение такой области восстанавливает §Y5%§! влияния Солгалова. Повторная потеря той же области без её возвращения не учитывается."
 VAL_staff_operational_mandate:0 "Передать штабу оперативное руководство"
 VAL_staff_operational_mandate_desc:0 "На время войны делегировать планирование операций генералитету. Требуется §Y25§! командного ресурса. Полномочия действуют §Y90 дней§! и прекращаются раньше при наступлении мира."
 VAL_staff_war_mandate:0 "Оперативная самостоятельность штаба"
 VAL_staff_war_mandate_desc:0 "Командование вправе согласовывать операции без отдельных разрешений канцелярии. Временный мандат прекращается с окончанием войны."
 VAL_contract_audit:0 "Провести проверку военных контрактов"
 VAL_contract_audit_desc:0 "В мирное время проверить расходы штабов и закрепить гражданский контроль над военными заказами."
 VAL_reconcile_command:0 "Созвать согласительную комиссию"
 VAL_reconcile_command_desc:0 "Согласовать полномочия канцелярии и генерального штаба. Баланс сдвинется на §Y20%§! от господствующей стороны к середине."
 VAL_settle_command_crisis:0 "Пересмотреть распределение полномочий"
 VAL_settle_command_crisis_desc:0 "Крайняя концентрация власти мешает работе государства. Пересмотр мандатов сдвинет баланс на §Y40%§! от господствующей стороны к середине."
 VAL_focus_export_market_open_tt:0 "Открывает адресные предложения §Yвоенного экспорта§!. Покупатель должен сейчас воевать, не находиться в войне с Кефрейтом и сохранять возможность оплатить сделку в момент принятия."
 VAL_focus_adviser_contracts_ready_tt:0 "Открывает платные контракты военных советников. Они используют отдельный слот: одновременно может действовать только одна кефрейтская миссия советников."
 VAL_focus_paid_program_authorization_tt:0 "§YТолько разрешение:§! указанную промышленную программу ещё нужно отдельно оплатить и завершить через решения §Y«Промышленные программы»§!, прежде чем будет получена материальная награда."
 VAL_occidian_registries_reward_tt:0 "§YОкцидийская договорная администрация§! получит §G+5% стабильности§! и §G+50 политической власти§!."
 VAL_frontier_nationalisation_chain_tt:0 "Открывает повторяемую национализацию на карте для непосредственно удерживаемых §Yрегионов, соседних с уже национальной территорией Кефрейта§!. Каждый новый core открывает следующий пояс соседних регионов."
 VAL_nationalise_region_complete_tt:0 "Регион становится §Yнациональной территорией Кефрейта§!. Его непосредственно удерживаемые соседи теперь могут стать доступны для следующей программы национализации."
 VAL_fund_contract_chancery:0 "Финансировать контрактную канцелярию"
 VAL_fund_contract_chancery_desc:0 "Купить административную пропускную способность вместо ожидания, пока политический аппарат восстановится сам. Потратить средства казны на чиновников, провинциальные управления и обработку договоров, чтобы получить политическую власть. Решение можно повторять раз в 90 дней."


 # Stelander crisis focus presentation
 VAL_stelander_title_war: "Гражданская война в Стеландере"
 VAL_stelander_title_aftermath: "После стеландского раскола"
 VAL_arms_title_delivered: "Исполненные поставки"
 VAL_arms_title_war: "Поставки сопротивлению"
 VAL_arms_title_aftermath: "Итоги оружейных поставок"
 VAL_passes_title_secured: "Закрепить перевалы"
 VAL_passes_title_review: "Разбор окцидийской кампании"
 VAL_passes_title_war: "Операция на перевалах"
 VAL_passes_title_mobilizing: "Развёртывание к перевалам"
 VAL_passes_title_prepare: "План операции на перевалах"
 VAL_reserves_title_war: "Сохранить резервы"
 VAL_reserves_title_aftermath: "Резервы после раскола"
 VAL_steel_title_trade: "Контракты на производство"
 VAL_steel_title_victory: "Арсеналы после победы"
 VAL_steel_title_review: "Пересмотр обязательств"
 VAL_stelander_status_defeated: "Кефрейт потерпел поражение. Прежний внешнеполитический курс закрыт."
 VAL_stelander_status_secured: "Окцидийская база закреплена. Доступен переход к договорной администрации и последующей интеграции при выполнении условий этих фокусов."
 VAL_stelander_status_repelled: "Окцидийская кампания закончилась поражением. Военный курс сам по себе не даёт наград за победу."
 VAL_stelander_status_campaign: "Идёт война с Союзом Возрождения Окцидии. Результат определяется войной, а не завершением фокуса."
 VAL_stelander_status_mobilizing: "Идёт 21-дневная мобилизация против Окцидии. Поставки сопротивлению не отменяют отдельную кампанию."
 VAL_stelander_status_settled: "Окцидийская кампания урегулирована. Итоговые награды зависят от исполненных поставок и реально удержанных районов."
 VAL_stelander_status_neutral: "Выбран нейтралитет: оружие и части остаются дома. Ветви поставок и вмешательства закрыты этим выбором."
 VAL_stelander_status_civil_war: "Сопротивление воюет с партийным правительством. Поставки требуют согласия покупателя и наличия ресурсов. Приказ о походе в Окцидию доступен не раньше 60-го дня после раскола и требует отдельной мобилизации."
 VAL_stelander_status_aftermath: "Стеландская гражданская война больше не идёт. Окно поставок сопротивлению закрыто; возможность отдельной окцидийской кампании определяется текущими условиями."
 VAL_stelander_status_prewar: "Гражданская война в Стеландере ещё не началась. Кризисная ветка откроется с началом боевых действий."
 VAL_arms_desc_delivered: "Поставки оплачены и исполнены. Закрепим полученный опыт и подготовим производственные контракты. Этот фокус не выдаёт оружие второй раз и не возобновляет закрытую сделку."
 VAL_arms_desc_war: "Пока сопротивление воюет с партийным правительством, предложим ему оружие или договорные формирования. Покупатель должен согласиться на цену; передаются реальные запасы и подготовленные части. Поставки совместимы с отдельной кампанией против Окцидии."
 VAL_arms_desc_aftermath: "Подведём итоги выбранного торгового курса и используем полученные полевые сведения. Новые поставки по программе гражданской войны уже недоступны. Производственное расширение потребует исполненного договора либо закреплённой окцидийской базы."
 VAL_passes_desc_secured: "Окцидийская база находится под нашим управлением. Сведём полевые отчёты и подготовим оформление завоеваний. Этот фокус не начинает войну повторно; договорная администрация и интеграция оформляются отдельно."
 VAL_passes_desc_review: "Военная кампания уже завершена. Сведём затраты и полевые отчёты. Сам выбор вмешательства не означает победу и не даёт права на чужие территории."
 VAL_passes_desc_war: "Кампания в Окцидии идёт. Согласуем работу штабов и обобщим боевой опыт. Мир и территориальные приобретения зависят от реального военного результата."
 VAL_passes_desc_prepare: "Подготовим командование к отдельной войне с Союзом Возрождения Окцидии. Приказ о 21-дневной мобилизации доступен спустя 60 дней после раскола Стеландера, пока сохраняется окно вмешательства. Победивший Стеландер может начать собственную подготовку спустя 90 дней после окончания гражданской войны и временно закрыть наше окно. Победа создаёт договорную администрацию из удержанных районов; соглашение по Ливонину урегулируется отдельно, без изъятия земель третьих стран."
 VAL_stelander_focus_unlocked_tt: "§YОткрыта стеландская кризисная ветка национальных фокусов.§! Вводный фокус занимает §Y14 дней§!, затем доступны курсы поставок, операции на перевалах или сохранения резервов — по §Y21 дню§!. Уже принятое правительством решение ограничивает выбор. Названия и описания меняются по текущей ситуации; окончание гражданской войны не скрывает итоговую ветку.\n\n[ROOT.VALGetStelanderCrisisStatus]"
 VAL_stelander_focus_current_status_tt: "[ROOT.VALGetStelanderCrisisStatus]"
 VAL_nod_ultimatum:0 "Ультиматум Нодрула: 100 дней"
 VAL_nod_ultimatum_desc:0 "Нодрул требует прекратить войну с северным альянсом. От получения ультиматума у Кефрейта есть §Y100 дней§!, чтобы разгромить всех участвующих каннибалов. Захвата одного союзника недостаточно.\n\nРазгром коалиции и выполнение территориальной цели закрывают угрозу. Если срок истечёт раньше, Нодрул вступит на стороне каннибалов в ту же войну; победившая партия Стеландера может присоединиться как его союзник. Мир, подчинение Кефрейта или устранение угрозы Нодрула отменяют миссию."
 VAL_nod_ultimatum_success_tt:0 "Северная коалиция разгромлена. Угроза вмешательства Нодрула закрывается; начинается урегулирование кампании."
 VAL_nod_ultimatum_timeout_tt:0 "Если северная коалиция ещё не разгромлена, Нодрул вступит в её войну против Кефрейта. Срок отсчитывается с получения ультиматума, а не с нажатия ответа."
 val_rework.118.t:0 "Ультиматум Нодрула"
 val_rework.118.d:0 "Посланник Нодрула передал Солгалову короткое требование: остановить экспедицию против северных племён. Требование подкреплено прямой угрозой: если война затянется, Нодрул вмешается на стороне каннибалов.\n\nШтаб получил сто дней с момента вручения ультиматума. За этот срок нужно разгромить весь участвующий северный альянс: падение одного его члена не завершит кампанию. До истечения срока Нодрул не вступает в эту войну по ультиматуму.\n\nОтсчёт уже начался. Задержка ответа не даст армии дополнительного времени."
 val_rework.118.a:0 "Передать срок штабу."
 VAL_nod_ultimatum_objective_tt:0 "Все участвующие северные племена разгромлены, а территориальная цель кампании обеспечена. Освобождённого союзника нужно разгромить снова."
 VAL_nod_ultimatum_cancel_tt:0 "Кампания закрыта, Кефрейт капитулировал или утратил независимость, либо Нодрул больше не может предъявлять эту угрозу."

 VAL_subcontract_quarterly_norm:0 "Оплатить независимый подряд"

 VAL_subcontract_quarterly_norm_desc:0 "Заплатить 1000 из казны за исполнение заказа независимыми мастерскими. Наши винтовки останутся на складах, а контрактная репутация сохранится. Этот вариант не повышает репутацию и не даёт военного опыта. Выбор закрывает остальные способы исполнения текущего квартала."

 VAL_quarterly_delivery_result_tt:0 "В конце квартала: §G+1§! ступень репутации (до максимума), §G15§! опыта армии и §G15§! командного ресурса. Повторная оплата этого квартала исключена."

 VAL_quarterly_subcontract_result_tt:0 "Заказ исполнен подрядчиками: репутация сохранится без военной награды. Текущий срок квартала не меняется."

 VAL_reclamation_industrial_sites:0 "Предприятия на восстановленной земле"

 VAL_reclamation_industrial_sites_desc:0 "Очистка должна вернуть району работу. На восстановленных и размежёванных участках предложим оплаченные заказы на два гражданских предприятия. Каждый регион получает собственный договор: несколько площадок можно строить одновременно."

 VAL_reclamation_industry:0 "Построить предприятия в восстановленном районе"

 VAL_reclamation_industry_desc:0 "После трёх этапов восстановления вложить 1000 казны на 60 дней: два дополнительных строительных места и два гражданских предприятия. Требуются владение, контроль и не более 18 гражданских фабрик. При утрате условий залог возвращается полностью. Один промышленный договор на регион."

 VAL_reclamation_industry_result_tt:0 "В целевом регионе появятся §G2§! строительных места и §G2§! гражданских предприятия. Работы в других регионах могут идти параллельно."
 VAL_focus_reclamation_roads_preview_tt:0 "§YЧто делает решение:§! запускает в загрязнённом регионе §Y90-дневную§! расчистку за £ADISCORD_economy_treasury_texticon §Y500§!. После завершения: §G+1§! инфраструктура (или §G+1§! строительная ячейка при пределе) и компенсация §G1/3§! исходных штрафов загрязнения."
 VAL_focus_reclamation_water_preview_tt:0 "§YЧто делает решение:§! после дорожного этапа запускает §Y90-дневную§! очистку воды и почвы за £ADISCORD_economy_treasury_texticon §Y500§!. После завершения: §G+2§! строительные ячейки, а компенсация исходных штрафов загрязнения вырастет до §G2/3§!."
 VAL_focus_reclamation_settlement_preview_tt:0 "§YЧто делает решение:§! после очистки запускает §Y90-дневный§! этап возвращения жителей за £ADISCORD_economy_treasury_texticon §Y500§!. После завершения штрафы загрязнения снимаются полностью, регион получает §G+1§! строительную ячейку и §G+1§! гражданское предприятие, если их меньше 20."
 VAL_focus_reclamation_industry_preview_tt:0 "§YЧто делает решение:§! после полного восстановления позволяет вложить £ADISCORD_economy_treasury_texticon §Y1000§! на §Y60 дней§! и получить в выбранном регионе §G+2§! строительные ячейки и §G+2§! гражданских предприятия."

 VAL_reclamation_stage_1_tt:0 "Хотя бы в одном нашем контролируемом регионе завершены: дорожный этап."

 VAL_reclamation_stage_2_tt:0 "Хотя бы в одном нашем контролируемом регионе завершены: очистка воды."

 VAL_reclamation_stage_3_tt:0 "Хотя бы в одном нашем контролируемом регионе завершены: все три этапа восстановления."

