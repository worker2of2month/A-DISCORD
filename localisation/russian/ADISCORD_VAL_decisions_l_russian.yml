 VAL_party_administration:0 "Партийная администрация"
 VAL_dopotroydsk:0 "Допотройдск"
 VAL_dopotroydsk_DEF:0 "Допотройдск"
 VAL_dopotroydsk_ADJ:0 "Допотройдск."
 VAL_factory_cathedrals_drive: "Арсенальные соборы"
 VAL_factory_cathedrals_drive_desc: "Пока линии не остыли, военные заводы растут быстрее обычного."
 VAL_hot_production_lines: "Горячие линии"
 VAL_hot_production_lines_desc: "Непрерывный выпуск повышает потолок эффективности оружейных цехов."
 VAL_northern_roads_drive: "Северные дороги"
 VAL_northern_roads_drive_desc: "Караванные тракты и перевалы получают приоритет в строительных работах."
 VAL_APH_influence: "Ступень сети посредников в Антропофагоруме"
 VAL_ops_cin_contract: "Контракт в Цини"
 VAL_ops_cin_contract_desc: "Выберем одно направление работы в Цини. После оплаты посредник ответит через 21 день: согласие поднимет сеть на одну ступень, отказ вернёт казну. Одновременно можно вести только одну внешнюю операцию."
 VAL_ops_cin_contract_tt: "Откроется выбор семейства контракта. Цена: £political_power_texticon §Y10§! и £ADISCORD_economy_treasury_texticon §Y50§!. Через 21 день Цинь примет или отклонит предложение. Отказ вернёт казну."
 VAL_ops_osf_contract: "Контракт в Осфарии"
 VAL_ops_osf_contract_desc: "Выберем одно направление работы в Осфарии. После оплаты посредник ответит через 21 день: согласие поднимет сеть на одну ступень, отказ вернёт казну. Одновременно можно вести только одну внешнюю операцию."
 VAL_ops_osf_contract_tt: "Откроется выбор семейства контракта. Цена: £political_power_texticon §Y10§! и £ADISCORD_economy_treasury_texticon §Y50§!. Через 21 день Осфария примет или отклонит предложение. Отказ вернёт казну."
 VAL_ops_aph_contract: "Контракт в Антропофагоруме"
 VAL_ops_aph_contract_desc: "Выберем одно направление работы у Антропофагорума. После оплаты посредник ответит через 21 день: согласие поднимет сеть на одну ступень, отказ вернёт казну. Одновременно можно вести только одну внешнюю операцию."
 VAL_ops_aph_contract_tt: "Откроется выбор семейства контракта. Цена: £political_power_texticon §Y10§! и £ADISCORD_economy_treasury_texticon §Y50§!. Через 21 день Антропофагорум примет или отклонит предложение. Отказ вернёт казну."
 VAL_ops_family_market_tt: "Изучение рынка. При согласии сеть посредников вырастет на §Y1§! ступень, торговый доход - на §G2%§!."
 VAL_ops_family_arms_tt: "Оружейное посредничество. При согласии сеть посредников вырастет на §Y1§! ступень, торговый доход - на §G2%§!."
 VAL_ops_family_infra_tt: "Инфраструктурная концессия. При согласии сеть посредников вырастет на §Y1§! ступень, торговый доход - на §G2%§!."
 VAL_ops_family_captain_tt: "Наём местного капитана. При согласии сеть посредников вырастет на §Y1§! ступень, торговый доход - на §G2%§!."
 VAL_ops_family_terms_tt: "Отдельные условия. При согласии сеть посредников вырастет на §Y1§! ступень, торговый доход - на §G2%§!."
 val_contract.10.t: "Контракт для Цини"
 val_contract.10.d: "Посредники ждут указания, какую сделку вести. Оплата списывается сразу; ответ придёт через 21 день. Отказ вернёт казну, политические затраты останутся."
 val_contract.11.t: "Контракт для Осфарии"
 val_contract.11.d: "$val_contract.10.d$"
 val_contract.12.t: "Контракт для Антропофагорума"
 val_contract.12.d: "$val_contract.10.d$"
 val_contract.family.market: "Изучить рынок"
 val_contract.family.arms: "Предложить оружие"
 val_contract.family.infra: "Купить концессию"
 val_contract.family.captain: "Нанять капитана"
 val_contract.family.terms: "Выторговать отдельные условия"
 val_contract.family.cancel: "Отложить сделку"
 VAL_cw_neutral_srp_tt: "Если республики уже существуют и не воюют, их мобилизационные заказы будут закрыты: Кефрейт не станет их заказчиком."
 val_rework.2.t: "Подписи вместо клятв"
 val_rework.2.d: "В зале учёта нет трона. Есть стол, печать и очередь капитанов, которые пришли не клясться, а сверить ставки.\n\nСолгалов не обещает им родину. Он обещает оплату, патроны и человека, который придёт, если договор сорвут."
 val_rework.2.a: "Открыть книгу."
 val_rework.3.t: "Урожай пепла"
 val_rework.3.d: "За околицами ещё лежат гильзы и пересохшие борозды. Народ умеет жить среди металла лучше, чем среди зерна.\n\nТеперь государство должно решить, что важнее сохранить: людей, которые ещё могут держать винтовку, или дворы, которые ещё могут кормить цеха."
 val_rework.3.a: "Считать остатки."
 val_rework.4.t: "Контракты переживают королей"
 val_rework.4.d: "Реестр больше не зависит от одного человека. Капитаны, цеха и штабы сведены в одну книгу, и эта книга переживёт любого барона, который поставит под ней печать."
 val_rework.4.a: "Оставить систему."
 val_rework.5.t: "Итог стальной книги"
 val_rework.5.trade: "Стеландские поставки оплачены и исполнены. Арсеналы получают основание расширить выпуск, а казна - долю с чужой войны."
 val_rework.5.military: "Северные перевалы стали военным счётом. Штабы требуют новых линий и оставляют полевой опыт тем, кто вёл колонны."
 val_rework.5.neutral: "Кефрейт не стал стороной стеландской войны. Внутренний порядок удержан, но арсеналы не получили чужого заказа."
 val_rework.5.a: "Закрыть ведомость."
 val_rework.6.t: "Соборы из цеха"
 val_rework.6.d: "В Кефрейте храм - это смена, которая не остыла. Своды цехов держат копоть лучше, чем любая молитва, а сталь выходит из огня уже с адресом покупателя.\n\nСолгалов не строит собор для верующих. Он ставит ещё одну линию, чтобы страна могла платить за хлеб тем же языком, которым пугает соседей."
 val_rework.6.a: "Зажечь печи."
 val_rework.7.t: "Роты в одной книге"
 val_rework.7.d: "Капитаны привыкли считать роту своей лавкой. Теперь лавка получает номер, ставку и человека, который спросит, куда делись патроны.\n\nРеестр не делает их патриотами. Он делает их предсказуемыми: кто стоит в книге, тот получает оплату; кто выпал - остаётся с пустым обозом."
 val_rework.7.a: "Открыть реестр."
 val_rework.8.t: "Тень октября"
 val_rework.8.d: "Стеланд помнит октябрь как рану. Кефрейт помнит его как подпись, которую до сих пор можно предъявить.\n\nНовая северная дорога не требует любви. Ей достаточно, чтобы старый счёт всё ещё пугал тех, кто когда-то поставил печать."
 val_rework.8.a: "Держать бумагу."
 val_rework.9.t: "Окно в горах"
 val_rework.9.d: "Иванов больше не держит Стеландер одной рукой. В ущельях считают склады, а не лозунги, и каждая сторона уже ищет, кто продаст ей время.\n\nКефрейт не обязан выбирать сегодня. Он обязан знать перевалы, цены и то, сколько дней осталось до чужой мобилизации."
 val_rework.9.a: "Сверить карты."
 val_rework.10.t: "Покупатель сгорел"
 val_rework.10.d: "Западные адреса больше не отвечают. Вагоны стоят на запасных путях, а посредники предлагают те же подписи, которые уже ничего не значат.\n\nКефрейт умеет жить без друзей. Без рынка - нет. Пока пепел Воркерланда ещё горяч, нужно решить, кто заплатит за следующие смены."
 val_rework.10.a: "Переписать маршруты."
 val_rework.11.t: "Война в аренду"
 val_rework.11.d: "Чужая кровь дешевле собственной земли. Рота уходит с пайком, винтовкой и сроком, а казна получает то, чего поле Кефрейта не вырастит.\n\nСолгалов не продаёт славу. Он продаёт дисциплину на срок и требует, чтобы оплата пришла раньше, чем похоронные списки."
 val_rework.11.a: "Выставить цену."
 VAL_ops_family_remaining_tt: "Осталось семейство контракта, которое ещё можно предложить."
 VAL_northern_export_buyer_choice_tt: "Получатель решит, принять ли груз. Отказ вернёт винтовки."
 VAL_northern_export_accepted_tt: "Груз принят. Кефрейт получает оговорённую выручку, получатель - винтовки."
 VAL_northern_export_refused_tt: "Получатель отказался. Зарезервированные винтовки вернутся в запас Кефрейта."
 VAL_northern_finance_buyer_choice_tt: "Хозяин рынка решит, допустить ли кефрейтских посредников. Отказ вернёт казну."
 VAL_northern_finance_accepted_tt: "Сеть посредников расширится на одну ступень."
 VAL_northern_finance_refused_tt: "Допуск закрыт. Вложенные §Y50§! вернутся в казну."
 VAL_westerholm_offer_tt: "Воркерланд получит предложение уступить права на сталь Вестерхольма. Согласие откроет концессию; отказ оставит месторождение у них."
 VAL_westerholm_accepted_tt: "Права на сталь Вестерхольма переходят Кефрейту."
 VAL_westerholm_refused_tt: "Воркерланд отклонил концессию. Права на месторождение не меняются."
 val_contract.310.t: "Кефрейтский груз"
 val_contract.310.d: "На границе стоит кефрейтская колонна с винтовками. Принять груз - значит взять оружие; выручку по уже заключённой цене получит Кефрейт. Отказ отправит вагоны обратно."
 val_contract.310.a: "Принять поставку."
 val_contract.310.b: "Вернуть колонну."
 val_contract.311.t: "Кефрейтский груз"
 val_contract.320.t: "Концессия Вестерхольма"
 val_contract.320.d: "Кефрейт предлагает выкуп прав на сталь западного месторождения. Согласие сохранит формальное владение районом, но руду и ренту заберёт кефрейтская книга. Отказ оставит жилу у нас."
 val_contract.320.a: "Уступить права."
 val_contract.320.b: "Отклонить концессию."
 val_contract.330.t: "Кефрейтские посредники"
 val_contract.330.d: "Кефрейтские конторы просят постоянный допуск на рынок. Согласие расширит их сеть. Отказ вернёт им казну, но не политические затраты."
 val_contract.330.a: "Допустить конторы."
 val_contract.330.b: "Закрыть допуск."
 val_contract.331.t: "Кефрейтские посредники"
 VAL_liberated: "Освобождённый Кефрейт"
 VAL_liberated_DEF: "Освобождённого Кефрейта"
 VAL_liberated_ADJ: "кефрейтск."

# --- livonn_settlement_localisation ---
 VAL_livonn_settlement_category: "Судьба Ливонинского округа"
 VAL_livonn_settlement_category_desc: "После разгрома горных республик Кефрейт установил военную администрацию и в §Y[45.GetName]§!. Довоенный договор с Шабратом предусматривал передачу округа сопротивлению. Теперь Кефрейт должен решить, считать ли подпись обязательством после победы."
 VAL_honor_livonn_agreement: "Соблюсти договор с Шабратом"
 VAL_honor_livonn_agreement_desc: "Передать §Y[45.GetName]§! стороне Шабрата, как было обещано до вмешательства. Остальные территории, занятые Кефрейтом по итогам кампании, останутся под нашим контролем."
 VAL_keep_livonn: "Оставить Ливонин Кефрейту"
 VAL_keep_livonn_desc: "Объявить довоенную договорённость утратившей силу. §Y[45.GetName]§! останется под администрацией Кефрейта."
 VAL_frontier_transport_contract:0 "Нанять транспортные колонны"
 VAL_frontier_transport_contract_desc:0 "Оплатить перевозчиков и передать им 100 грузовиков из армейского резерва. На 180 дней расход снабжения армии уменьшится на 10%. Контракт закончится раньше при отзыве ультиматума или завершении пограничной кампании. Казна и грузовики расходуются без возврата; новый контракт возможен после окончания прежнего."
 VAL_frontier_transport_columns:0 "Экспедиционные транспортные колонны"
 VAL_frontier_transport_columns_desc:0 "Оплаченные перевозчики и выделенные грузовики обслуживают пограничную экспедицию. Контракт действует не более 180 дней и прекращается вместе с кампанией."
 VAL_frontier_transport_cost: "£ADISCORD_economy_treasury_texticon §Y50§!  £motorized_texticon §Y100§!"
 VAL_frontier_transport_cost_blocked: "£ADISCORD_economy_treasury_texticon §R50§!  £motorized_texticon §R100§!"
 VAL_frontier_transport_cost_tooltip: "Цена: £ADISCORD_economy_treasury_texticon §Y50§!  £motorized_texticon §Y100§!."
 VAL_frontier_begin_offensive:0 "Начать пограничную операцию"
 VAL_frontier_begin_offensive_desc:0 "Отказ получен. Начать войну с текущим адресатом и его коалицией; подготовка снабжения больше не откладывает наступление."
 VAL_frontier_withdraw_demand:0 "Отозвать пограничный ультиматум"
 VAL_frontier_withdraw_demand_desc:0 "Закрыть текущую кампанию и прекратить оплаченный транспортный контракт. Повторный ультиматум тому же адресату возможен после исходного срока в 180 дней."
 VAL_frontier_withdraw_tt:0 "Требования отозваны; временная оборонительная коалиция и транспортный контракт завершаются. Оплаченная подготовка не возмещается."
 val_rework.111.prepare:0 "Сначала подготовить экспедицию."
 VAL_frontier_prepare_tt:0 "Ультиматум остаётся в силе. Решения позволяют подготовить снабжение, начать войну или отозвать требования. Военные действия ещё не начинаются."
 VAL_FRONTIER_AWAITING:0 "ожидание ответа"
 VAL_FRONTIER_PREPARING:0 "отказ получен; подготовка экспедиции"
 VAL_FRONTIER_FIGHTING:0 "война"
 VAL_FRONTIER_IDLE:0 "нет действующей кампании"
 VAL_FRONTIER_NO_TARGET:0 "не выбран"
 VAL_FRONTIER_CIN:0 "Пепельное племя"
 VAL_FRONTIER_OSF:0 "Союз костоломов"
 VAL_FRONTIER_APH:0 "Антропофагорум"
 VAL_FRONTIER_ERT:0 "Восточные территории"
 VAL_FRONTIER_NOT_MEMBER:0 "не участвует"
 VAL_FRONTIER_DEFEATED:0 "§Gразгромлено§!"
 VAL_FRONTIER_RESISTING:0 "§Rсопротивляется§!"
 VAL_FRONTIER_MOBILIZING:0 "§Yготовится к войне§!"

 VAL_frontier_workshops: "Открыть ремонтные мастерские: [FROM.GetName]"
 VAL_frontier_workshops_desc: "Вложить 500 казны в местную ремонтную базу. Через 90 дней [FROM.GetName] получит одну дополнительную площадку и один военный завод. Предприятие принадлежит владельцу района: Кефрейту при прямом управлении или местному комиссариату. Потеря контроля, выход владельца из подчинения или новая война отменят проект и вернут 500 казны. Можно вести работы в разных районах одновременно."
 VAL_frontier_workshop_cost: "£ADISCORD_economy_treasury_texticon §Y500§!"
 VAL_frontier_workshop_cost_blocked: "£ADISCORD_economy_treasury_texticon §R500§!"
 VAL_frontier_workshop_cost_tooltip: "Цена: £ADISCORD_economy_treasury_texticon §Y500§!."
 VAL_frontier_workshop_result_tt: "В районе [FROM.GetName] появятся одна площадка и один военный завод для текущего владельца. При недействительных условиях платёж вернётся Кефрейту."
 VAL_frontier_workshop_refund_tt: "Оплаченные 500 казны вернутся Кефрейту; предприятие не будет построено."
 VAL_frontier_workshop_idle_tt: "В этом районе нет уже оплаченного проекта мастерских."

 VAL_foreign_sales:0 "Экспортные контракты"
 VAL_foreign_sales_desc:0 "Короткие договоры с воюющими странами временно поддерживают казну. Оружие передаётся после согласия покупателя, платёж поступает Кефрейту частями через временную идею. Доступны два оружейных контракта и одна миссия советников. Расчётная палата открывает второй контракт, резервные реестры - советников."
 VAL_export_income_1:0 "Платежи по оружейному контракту"
 VAL_export_income_1_desc:0 "Договор действует 70 дней. Платёж покупателя распределён по сроку договора. Продление требует нового заказа."
 VAL_export_income_2:0 "Второй оружейный контракт"
 VAL_export_income_2_desc:0 "Договор действует 70 дней. Платёж покупателя распределён по сроку договора. Продление требует нового заказа."
 VAL_advisors_income:0 "Платная военная миссия"
 VAL_advisors_income_desc:0 "Договор действует 70 дней. Платёж покупателя распределён по сроку договора. Продление требует нового заказа."
 VAL_paid_military_advisors:0 "Кефрейтские военные советники"
 VAL_paid_military_advisors_desc:0 "Договор действует 70 дней. Военные специалисты обучают штабы и налаживают восстановление частей."
 VAL_export_arms:0 "Продать оружие: [FROM.GetName]"
 VAL_export_arms_desc:0 "Предложить 2500 винтовок за 100 казны. Покупатель получает оружие сразу, Кефрейт - +10 еженедельного дохода на 70 дней. Оружие остаётся на складе до согласия; при ответе запасы проверяются повторно."
 VAL_export_arms_offer_tt:0 "Получатель получит предложение на 14 дней. До согласия оружие, деньги и командный ресурс не списываются. Цена и срок договора фиксированы."
 val_contract.340.t:0 "Предложение Кефрейта: вооружение"
 val_contract.340.d:0 "Кефрейт предлагает 2500 винтовок за единовременную оплату 100 казны. Оружие будет передано после подписания. Платёж продавец получит через расчётный дом в течение 70 дней.\n\nПредложение действительно 14 дней. Война с продавцом, капитуляция или нехватка ресурсов закрывают возможность оплаты."
 VAL_export_arms_accepted_tt:0 "За 100 казны страна получит 2500 винтовок со складов Кефрейта. Кефрейт получает +10 еженедельного дохода на 70 дней."
 VAL_export_advisors:0 "Направить советников: [FROM.GetName]"
 VAL_export_advisors_desc:0 "Предложить военную миссию за 100 казны. После согласия Кефрейт расходует 25 командного ресурса и получает +10 еженедельного дохода на 70 дней; на тот же срок собственная скорость планирования снижается на 5%. Получатель приобретает идею военных советников."
 VAL_export_advisors_offer_tt:0 "Получатель получит предложение на 14 дней. До согласия оружие, деньги и командный ресурс не списываются. Цена и срок договора фиксированы."
 val_contract.341.t:0 "Предложение Кефрейта: военные советники"
 val_contract.341.d:0 "Кефрейт предлагает на 70 дней группу штабных инструкторов. Цена - 100 казны. Миссия ускорит планирование на 10%, восстановление организации на 5% и накопление армейского опыта на 5%.\n\nПредложение действительно 14 дней. Война с продавцом, капитуляция или нехватка ресурсов закрывают возможность оплаты."
 VAL_export_advisors_accepted_tt:0 "За 100 казны страна получит идею «Кефрейтские военные советники» на 70 дней. Кефрейт расходует 25 командного ресурса. Кефрейт получает +10 еженедельного дохода на 70 дней."
 VAL_export_decline:0 "Отклонить или закрыть предложение."
 VAL_export_accept:0 "Подписать и оплатить договор."
 VAL_export_second_slot_tt:0 "Можно одновременно получать доход от двух оружейных контрактов. Второй требует отдельной партии в 2500 винтовок и согласия покупателя."

 VAL_northern_volunteers:0 "Добровольцы против Нодрула"
 VAL_northern_volunteers_desc:0 "Разрешить отправку действующих дивизий на северный фронт и Шабрату, пока они воюют с Нодрулом. Отправка выбирается в дипломатическом окне получателя; пополнение и техника остаются расходом Кефрейта. Части отзываются после завершения именно этой войны, даже если получатель продолжает другой конфликт."
 VAL_northern_volunteer_mandate:0 "Северная добровольческая миссия"
 VAL_northern_volunteer_mandate_desc:0 "Разрешена помощь противникам Нодрула на севере и войскам Шабрата. Используются существующие дивизии Кефрейта."
 VAL_northern_volunteers_tt:0 "В дипломатии доступны добровольцы для северных противников Нодрула и Шабрата. Выберите существующие дивизии. После окончания их войны против Нодрула части отзываются; проверка оставшихся фронтов проводится раз в неделю."

 VAL_New_Supply_Base:0 "Собственная база снабжения"
 VAL_New_Supply_Base_desc:0 "Соединим собственный северный ресурсный пояс с мастерскими и дорогами присоединённой Окцидии. Для этого нужно завершить переходное управление Балчанском, Гаванью и Шахтёрским посёлком. Эти территории заменят воркерландские поставки; временные экспортные платежи перестанут быть единственной опорой бюджета."
 VAL_Northern_Settlement:0 "Разгромить Нодрул"
 VAL_Northern_Settlement_desc:0 "Вмешательство Нодрула не закончится отдельным пограничным договором. Подготовим самостоятельный поход, который лишит его возможности диктовать условия северу."
 VAL_Stelander_Ultimatum:0 "Ультиматум Стеландеру"
 VAL_Stelander_Ultimatum_desc:0 "Потребуем признания кефрейтских границ в Окцидии. Дружественное правительство может принять торговое соглашение; Шабрат считает западные земли частью своего будущего государства. Отказ открывает подготовку новой войны."
 VAL_Campaign_Secured:0 "Кефрейтский порядок"
 VAL_Campaign_Secured_desc:0 "Кампания завершена, когда Нодрул и Стеландер утратили самостоятельную военную силу, а земли каннибалов находятся в нашей сфере. Исчезновения государств с карты недостаточно: их хозяйственная база должна действительно подчиняться Кефрейту."
 VAL_supply_base_secured_tt:0 "Все восемь земель каннибалов принадлежат и подконтрольны Кефрейту или его подчинённым. Антолла, Фарейн, Химбер, Балчанск, Гавань и Шахтёрский посёлок принадлежат и подконтрольны самому Кефрейту."
 VAL_campaign_objectives_tt:0 "Кефрейт независим и находится в мире. Северный ресурсный пояс принадлежит ему напрямую, остальные земли каннибалов - ему или его подчинённым. Нодрул, партия Стеландера и государство Шабрата разгромлены либо подчинены, их основная территория находится в сфере Кефрейта. Мирные республики в округах, полученных при расколе Стеландера, и земли, уступленные Яперту по северному миру, не требуют нового завоевания."
 VAL_campaign_against_nod:0 "Подготовить поход на Нодрул"
 VAL_campaign_against_nod_desc:0 "Мобилизация длится 30 дней и стоит 50 политического ресурса. Затем начнётся отдельная война против выбранного государства. Исчезновение, подчинение или вступление цели в нашу фракцию отменяет подготовку. Завершение других войн не считается победой над этой целью."
 VAL_campaign_against_stelander:0 "Подготовить войну: [FROM.GetName]"
 VAL_campaign_against_stelander_desc:0 "Мобилизация длится 30 дней и стоит 50 политического ресурса. Затем начнётся отдельная война против выбранного государства. Исчезновение, подчинение или вступление цели в нашу фракцию отменяет подготовку. Завершение других войн не считается победой над этой целью."
 VAL_campaign_preparation_tt:0 "Через 30 дней начнётся война с выбранной страной, если условия сохранятся. На время подготовки другой такой поход недоступен."
 VAL_campaign_cancelled_tt:0 "Подготовка отменена. Политические расходы не возвращаются."
 VAL_stelander_ultimatum:0 "Предъявить условия: [FROM.GetName]"
 VAL_stelander_ultimatum_desc:0 "После гражданской войны потребуем признания Окцидии. Получатель ответит в течение 21 дня. Лидер, отношения и прежние поставки влияют на решение ИИ. Согласие даёт торговый договор на 180 дней; отказ открывает 30-дневную подготовку похода. Договор не считается полной победой в кампании."
 VAL_stelander_offer_tt:0 "Получатель имеет 21 день на ответ. По истечении срока неотвеченный ультиматум считается отклонённым."
 VAL_stelander_terms_tt:0 "Признаются границы Кефрейта в Окцидии. Принадлежащие и подконтрольные получателю западные округа уступаются Кефрейту; все три закреплённых региона образуют временную договорную администрацию, если интеграция ещё не завершена. Обе страны получают +5% торгового дохода на 180 дней; Кефрейт не может начать этот поход до окончания договора. Независимость Стеландера сохраняется."
 VAL_stelander_trade_terms:0 "Торговый договор с соседями"
 VAL_stelander_trade_terms_desc:0 "Стороны временно признали границы в Окцидии и согласовали условия торговли."
 val_contract.343.t:0 "Кефрейт требует признания границ"
 val_contract.343.shabrat:0 "Кефрейт требует признать его власть в Окцидии и уступить контролируемые нами западные округа, если они ещё остаются у нас. Взамен предлагается торговое соглашение на полгода.\n\nШабрат видит в этом закрепление распада Стеландера. Прежние поставки оружия не давали продавцу права распоряжаться его территориями. Отказ позволит Кефрейту готовить новый поход; собственный реванш остаётся делом нашего правительства."
 val_contract.343.friendly:0 "Кефрейт предлагает закрепить западную границу и открыть торговлю на полгода. Хорошие отношения дают возможность договориться без новой войны, но признание означает отказ от притязаний на Окцидию. Если западные округа ещё принадлежат и подконтрольны нам, их потребуют передать.\n\nСогласие сохраняет независимость. Отказ оставляет Кефрейту возможность подготовить поход."
 val_contract.343.d:0 "Кефрейт требует признать его власть в Окцидии. За подпись предлагается торговое соглашение на полгода; за отказом может последовать военная подготовка. Принадлежащие и подконтрольные нам западные округа потребуется уступить.\n\nУсловия действуют 21 день. Промедление будет истолковано как отказ."
 val_contract.343.refuse:0 "Не признавать условия. Закрыть предложение."
 val_contract.343.accept:0 "Признать границу и подписать договор."
 VAL_regional_settlement:0 "Региональная система договоров"
 VAL_regional_settlement_desc:0 "Подчинённые территории и общие расчётные правила обеспечивают устойчивый доход кефрейтской казне."
 val_contract.345.t:0 "Кампания Кефрейта завершена"
 val_contract.345.d:0 "Нодрул больше не определяет положение на севере. Самостоятельный военный центр Стеландера сломлен, а земли каннибалов включены в кефрейтскую систему. Склады, дороги и мастерские связаны договорами, которые теперь подкреплены силой.\n\nГлавные цели кампании достигнуты. Игра продолжается: удержать приобретённое предстоит теми же армией, снабжением и казной."
 val_contract.345.a:0 "Закрепить новый порядок."

