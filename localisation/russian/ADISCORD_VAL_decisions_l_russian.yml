 VAL_Company_Mandates:0 "Представительство рот"
 VAL_Company_Mandates_desc:0 "Командиры продают военную службу, но не могут каждый раз заново торговаться о своих правах. Избранные представителями рот уполномоченные будут согласовывать общие требования с правительством. Единый порядок переговоров укрепит политическое влияние контрактного государства."
 VAL_Contract_Arbitration:0 "Контрактный арбитраж"
 VAL_Contract_Arbitration_desc:0 "Споры о жалованье и условиях службы не должны превращаться в неповиновение. Совместная арбитражная комиссия государства и рот получит право разбирать претензии и закреплять обязательные решения. Признание этих решений даст правительству устойчивую опору среди наёмников."

 VAL_Armored_Design_Bureau:0 "Конструкторское бюро бронетехники"
 VAL_Armored_Design_Bureau_desc:0 "Ротам нужны машины, рассчитанные на затяжную службу и ремонт вдали от заводов. Объединим инженеров оружейного комбината в отдельное бюро, которое займётся шасси, бронезащитой и вооружением новых танков."
 VAL_Serial_Armor_Production:0 "Серийное производство танков"
 VAL_Serial_Armor_Production_desc:0 "Каждая рота привыкла заказывать собственную машину, а затем искать к ней редкие запчасти. Общие стандарты узлов и долгосрочные заказы позволят заводам выпускать бронетехнику сериями и снизят стоимость каждой машины."
 VAL_Tank_Crew_School:0 "Школа танковых экипажей"
 VAL_Tank_Crew_School_desc:0 "Механику-водителю, наводчику и командиру нужно действовать как одному экипажу. Создадим учебную роту с полигоном: здесь будут готовить инструкторов и проверять новые машины до передачи в войска."
 VAL_Armored_Contract_Companies:0 "Бронетанковые контракты"
 VAL_Armored_Contract_Companies_desc:0 "Закрепим долгосрочные поставки танков для контрактной армии. Согласованные планы закупок позволят расширить серии, а договоры на обслуживание установят единые требования к запчастям и приёмке техники. Заводы смогут снижать стоимость машин без потери надёжности."
 VAL_armor_serial_production:0 "Серийное бронепроизводство"
 VAL_armor_serial_production_desc:0 "Единые узлы и устойчивые заказы снижают производственную стоимость разведывательных, боевых и тяжёлых бронеплатформ."
 VAL_armor_contract_production:0 "Контракты на бронетехнику"
 VAL_armor_contract_production_desc:0 "Серийные заказы, унифицированные запасные части и обязательная приёмка снижают стоимость бронеплатформ и повышают их надёжность."

 VAL_final_war:0 "Финальная война: [ROOT.VALGetFinalEnemy]"
 VAL_final_war_desc:0 "[ROOT.VALGetFinalPhase]\nНапряжение: §Y[?VAL_final_escalation|0]/100§!. В мирное время оно растёт на §R5§! в неделю. При 100 начинается война; переговоры снижают напряжение на 15. Другая война или незавершённый северный поход приостанавливают рост.\n\nСнабжение: [ROOT.VALGetFinalSupply]\nРазведка: [ROOT.VALGetFinalRecon]\nПри напряжении 25 открывается разведывательная подготовка, при 50 - расширение резервных контрактов. Подготовленные бонусы действуют до окончания кризиса и войны. При союзе Нодрула со Стеландером придётся победить обоих участников.\n\nБеженцев можно принять и обучить в категории «Люди и серые рынки». Каждая региональная кампания даёт до трёх волн; подготовка добровольцев занимает 35 дней."
 VAL_FINAL_ENEMY_COALITION:0 "Нодрул и Стеландер"
 VAL_FINAL_ENEMY_NOD:0 "Нодрул"
 VAL_FINAL_PHASE_PREPARING:0 "§YПодготовка к столкновению.§!"
 VAL_FINAL_PHASE_WAR:0 "§RВойна началась.§!"
 VAL_FINAL_PHASE_VICTORY:0 "§GФинальная кампания завершена победой.§!"
 VAL_FINAL_PHASE_CLOSED:0 "Кризис завершён. Временные военные приготовления сняты."
 VAL_FINAL_PHASE_WAITING:0 "Подготовка откроется после завершения северного похода, если Нодрул остаётся самостоятельным противником."
 VAL_FINAL_PREPARATION_READY:0 "§Gготово§!"
 VAL_FINAL_PREPARATION_MISSING:0 "не подготовлено"
 VAL_final_reduce_tension:0 "Возобновить переговоры с Нодрулом"
 VAL_final_reduce_tension_desc:0 "Ограниченные уступки и оплата посредников позволят выиграть три недели. Внутри страны переговоры воспримут как признак слабости."
 VAL_final_reduce_tension_tt:0 "Напряжение снизится на §G15§!. При обычном росте это даёт ещё три недели подготовки."
 VAL_final_register_reserves:0 "Составить реестр резервистов"
 VAL_final_register_reserves_desc:0 "За 28 дней военные комиссары переведут добровольческий набор на ограниченный призыв. Уже установленный более высокий закон не будет понижен. При отмене или самостоятельной смене закона политвласть возвращается."
 VAL_final_reserve_registration_tt:0 "Через §Y28 дней§! будет введён §Yограниченный призыв§!. При отмене или уже повышенном законе возвращается §Y150§! политвласти."
 VAL_final_stockpile_supplies:0 "Подготовить армейские склады"
 VAL_final_stockpile_supplies_desc:0 "Закупим и распределим запасы для длительной кампании. Подготовка занимает 35 дней и продолжится, если война начнётся раньше. При прекращении кризиса до доставки деньги возвращаются."
 VAL_final_supply_preparation_tt:0 "Через §Y35 дней§! расход снабжения армии снизится на §G10%§! до окончания кризиса и войны. При отмене возвращается §Y500§! монет."
 VAL_final_supply_ready_tt:0 "Расход снабжения армии: §G-10%§! до окончания кризиса и войны."
 VAL_final_reconnaissance:0 "Разведать направления наступления"
 VAL_final_reconnaissance_desc:0 "За 21 день штаб сведёт карты, данные агентуры и разведывательные донесения. Подготовка ускорит планирование и даст сведения об армии Нодрула. При отмене политвласть возвращается."
 VAL_final_reconnaissance_start_tt:0 "Через §Y21 день§!: армейские разведданные по Нодрулу §G+20§! и скорость планирования §G+15%§! до окончания кризиса и войны. При отмене возвращается §Y75§! политвласти."
 VAL_final_reconnaissance_ready_tt:0 "Скорость планирования: §G+15%§! до окончания кризиса и войны."
 VAL_final_expand_reserve_contracts:0 "Расширить резервные контракты"
 VAL_final_expand_reserve_contracts_desc:0 "Предложим срочные контракты тем, кто прежде не входил в действующий резерв. За 28 дней расширим мобилизационную базу на один процент населения. Набор продолжает действовать до окончания кризиса и войны, после чего чрезвычайные обязательства прекращаются."
 VAL_final_reserve_contracts_start_tt:0 "Через §Y28 дней§!: доля призывного населения §G+1,00 процентного пункта§! до окончания кризиса и войны. При отмене возвращается §Y100§! политвласти."
 VAL_final_reserve_contracts_ready_tt:0 "Доля призывного населения: §G+1,00 процентного пункта§! до окончания кризиса и войны."
 VAL_final_war_preparation:0 "Подготовка к финальной войне"
 VAL_final_war_preparation_desc:0 "Оплаченные склады, разведка и резервные контракты обеспечивают подготовку Кефрейта к противостоянию с Нодрулом. Временные бонусы прекращаются вместе с кризисом и войной."

 VAL_regional_administration_campaign:0 "Наладить гражданское управление во всех регионах"
 VAL_regional_administration_campaign_desc:0 "Единая программа для всех принадлежащих нам и подконтрольных ненациональных регионов, где подчиняемость ниже 60 или сопротивление не ниже 20. За 50 политической власти каждый подходящий регион сразу получает +15 подчиняемости и -10 сопротивления. Повторная программа доступна через 90 дней. Регионы с уже действующей программой интеграции не участвуют."

# Campaign briefing
 VAL_startup_country:0 "§YКЕФРЕЙТ§!\n\nКефрейт живёт контрактом, арсеналом и готовностью продавать силу. Оружейные заводы и наёмные компании дают ему влияние далеко за пределами границ, но каждая новая обязанность требует оплаты и снабжения.\n\nЗа промышленной мощью стоят слабая социальная опора, последствия прежних войн и собственные интересы командиров. Государству предстоит связать эти силы едиными обязательствами — или вновь уступить место частным договорённостям.\n\n§YПервые задачи§!\nУкрепляйте контрактную систему, проверяйте бюджет и потребности армии. На севере предстоит выбрать между торговым сближением и политикой давления. Производство оружия полезно лишь вместе с надёжными маршрутами и покупателями."
 VAL_startup_guide:0 "§YКонтракт должен быть обеспечен§!\n\nСледите за контрактной властью и возможностями бюджета. Сильная промышленность не снимает расходов на армию и внутреннее управление.\n\nРазвивайте торговые маршруты и проверяйте, какие коридоры действительно работают. Их состояние зависит от доступности территории и инфраструктуры; открытая когда-то дорога не гарантирует постоянный оборот.\n\nПеред оружейной сделкой проверьте запасы и получателя. Проданное вооружение не останется для пополнения собственных частей. Серые брокеры могут дать краткосрочную выгоду, но рост теневого рынка имеет последствия.\n\nНа севере торговая и силовая ветки исключают друг друга. В обоих случаях дальнейшие операции открываются через фокусы и оплачиваются по условиям решений.\n\n§YЭкспансия расположена в центре под «$VAL_Contracts_Outlive_Kings$».§! Начните с «$VAL_frontier_conference$», подготовьте снабжение и выберите администрацию, затем «$VAL_frontier_security_plan$» откроет северный ультиматум через решения. Доступ возможен и через ранние северные или окцидийские договоры; стеландская гражданская война северную ветку не блокирует."
 VAL_startup_path_0_title:0 "Торговые партнёры"
 VAL_startup_path_1_title:0 "Октябрь 2160-го"
 VAL_startup_path_0:0 "§YТОРГОВЫЕ ПАРТНЁРЫ§!\n\nРасширяйте северное влияние через торговые связи и контрактные институты. Этот выбор укрепляет экономическую сторону сотрудничества и ведёт к дальнейшей работе с северными соседями.\n\nМаршрут подходит для последовательного расширения возможностей государства через оборот, производство и оплаченные операции. Он не означает автоматического мира со всеми соседями.\n\nВыбор закрывает альтернативную северную ветку «Октябрь 2160-го»."
 VAL_startup_path_1:0 "§YОКТЯБРЬ 2160-ГО§!\n\nПодкрепите контрактную политику силой и готовностью к давлению на севере. Выбор усиливает военную составляющую курса, сохраняя необходимость снабжать части и оплачивать последующие операции.\n\nЭта ветка не заменяет сюжетные условия объявления войны: конкретные действия доступны через свои фокусы, решения и события.\n\nВыбор закрывает альтернативную северную ветку «Торговые партнёры»."
 VAL_startup_path_0_details:0 "§YТОРГОВЛЯ: КАК ОТКРЫВАЕТСЯ ВЕТКА§!\n\nПосле фокуса «Северные торговые маршруты» выберите «Торговые партнёры». Альтернативный «Октябрь 2160-го» станет недоступен.\n\nЗатем общий фокус «Разные взгляды на свободу» продолжает северную линию. Торговый выбор даёт в нём денежный результат; сам общий фокус открывает операции по финансированию контактов у северных соседей. Их цена и доступность проверяются отдельно.\n\nЭто выбор северной политики, а не кнопка выбора стороны стеландерской гражданской войны. Вмешательство в Стеландере имеет собственную сюжетную цепочку."
 VAL_startup_path_1_details:0 "§YДАВЛЕНИЕ: КАК ОТКРЫВАЕТСЯ ВЕТКА§!\n\nПосле фокуса «Северные торговые маршруты» выберите «Октябрь 2160-го». Он исключает «Торговых партнёров» и даёт военную подготовку, включая артиллерию и поддержку войны.\n\nДалее общий фокус «Разные взгляды на свободу» даёт этому курсу командный ресурс и поддержку войны, а также открывает операции с северными контактами. Расходы на сами решения не оплачиваются выбором ветки.\n\nВоенная специализация компаний и участие в стеландерском конфликте определяются другими фокусами и событиями. Не считайте эту развилку немедленным объявлением войны."
 VAL_Balchansk_Charter:0 "Балчанская хартия"
 VAL_Balchansk_Charter_desc:0 "Закрепим самостоятельное договорное управление Балчанска вместо прямого присоединения Окцидии. Администрация получит собственную хартию и политический ресурс; Кефрейт сохранит транзитные договоры. Этот путь исключает прямую интеграцию."
 VAL_Balchansk_Clearing_House:0 "Балчанская расчётная палата"
 VAL_Balchansk_Clearing_House_desc:0 "Общая расчётная палата свяжет Балчанскую администрацию с кефрейтскими арсеналами и торговыми конторами. Администрация получит хозяйственный институт, а Кефрейт - промышленный исследовательский бонус и политический ресурс."
