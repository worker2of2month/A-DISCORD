 val_contract.10.t:0 "Договор с [CIN.GetNameDef]"
 val_contract.10.d:0 "Контора подготовила три разных предложения. Годовое торговое представительство стоит 200 казны и приносит недельный доход в течение 365 дней. Оружейный заказ продаёт 25000 винтовок за 500 казны. Наём переводит реальных добровольцев из резерва партнёра в наш.\n\nУсловия зависят от страны; в подсказках указаны полные суммы. Недоступные предложения не показываются. Партнёр вправе отказаться. При отказе или отсутствии ответа ресурсы остаются у владельцев."
 val_contract.11.t:0 "Договор с [OSF.GetNameDef]"
 val_contract.11.d:0 "Контора подготовила три разных предложения. Годовое торговое представительство стоит 200 казны и приносит недельный доход в течение 365 дней. Оружейный заказ продаёт 25000 винтовок за 500 казны. Наём переводит реальных добровольцев из резерва партнёра в наш.\n\nУсловия зависят от страны; в подсказках указаны полные суммы. Недоступные предложения не показываются. Партнёр вправе отказаться. При отказе или отсутствии ответа ресурсы остаются у владельцев."
 val_contract.12.t:0 "Договор с [APH.GetNameDef]"
 val_contract.12.d:0 "Контора подготовила три разных предложения. Годовое торговое представительство стоит 200 казны и приносит недельный доход в течение 365 дней. Оружейный заказ продаёт 25000 винтовок за 500 казны. Наём переводит реальных добровольцев из резерва партнёра в наш.\n\nУсловия зависят от страны; в подсказках указаны полные суммы. Недоступные предложения не показываются. Партнёр вправе отказаться. При отказе или отсутствии ответа ресурсы остаются у владельцев."
