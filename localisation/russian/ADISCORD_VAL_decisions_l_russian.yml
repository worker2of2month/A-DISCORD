 NOD_VAL_administration_etatism_DEF:0 "Нодрульский протекторат"
 NOD_VAL_administration_etatism_ADJ:0 "Нодрульск"
 VAL_ratify_postwar_administration:0 "Утвердить договорную администрацию"
 VAL_ratify_postwar_administration_desc:0 "Учредим особый договорный режим в уже подчинённой стране. Её руководство, флаг и восстановительная программа будут приведены в соответствие с послевоенным уставом."

 VAL_Audit_Lost_Contracts:0 "Разобрать сорванные контракты"
 VAL_Audit_Lost_Contracts_desc:0 "Распад Воркерланда оставил неоплаченные счета и грузы без получателей. Отделим исполненные обязательства от утраченных заказов и опубликуем порядок возмещения. Возвращение доверия начинается с признания собственных долгов."

 VAL_Guarantee_Deliveries:0 "Гарантировать сроки поставок"
 VAL_Guarantee_Deliveries_desc:0 "Кефрейт слишком долго продавал уверенность вместе с оружием, а затем заставлял покупателя верить объяснениям задержек. Теперь под каждый подписанный заказ заранее резервируются металл, детали и место в производственном графике. Дата отгрузки становится частью обязательства, а её нарушение отражается в тех же книгах, что и прибыль.\n\nКонтрактное государство вернёт доверие не рекламой арсеналов, а привычкой выполнять обещанное в назначенный день."
 VAL_Independent_Trials:0 "Независимая приёмка"
 VAL_Independent_Trials_desc:0 "Допустим представителей заказчиков к испытаниям оружия. Единые требования к качеству и открытые протоколы приёмки вернут фабрикам доверие, утраченное вместе с западным рынком."

 VAL_Returning_Buyers:0 "Возвращение заказчиков"
 VAL_Returning_Buyers_desc:0 "Подтверждённое качество и соблюдение сроков дают первые повторные заказы. Их авансы вернут часть оборотных средств. Это выход из изоляции, но для прежней известности нужны безопасные торговые пути и окончание войны."

 VAL_Reopen_Trade_Routes:0 "Открыть послевоенные маршруты"
 VAL_Reopen_Trade_Routes_desc:0 "Военная карта после победы мало похожа на торговую. Разбитый мост не становится полезнее от того, что над ним висит наш флаг, а занятый склад ничего не значит без регулярного каравана. Инженеры и контрактные конторы заново сведут северные месторождения, окцидские администрации и арсеналы в одну сеть перевозок.\n\nНовые маршруты должны заменить зависимость от воркерландских посредников не лозунгом о самостоятельности, а грузом, который действительно приходит на завод каждую неделю.\n\n$VAL_economic_settlement_ready_tt$"
 VAL_Settle_Industrial_Debts:0 "Урегулировать промышленные долги"
 VAL_Settle_Industrial_Debts_desc:0 "За время войны заводы жили на авансах, реквизициях и обещаниях, которые разные ведомства записывали в разные книги. Капитаны считают часть расходов военным риском. Владельцы цехов называют их государственным долгом. Казначейство не сможет строить мирную систему, пока каждый держит собственную версию счёта.\n\nКомиссия сведёт обязательства, спишет то, что было ценой кампании, и закрепит постоянный график расчётов. Кефрейт умеет требовать исполнения договора от других. Теперь ему придётся применить то же правило к себе.\n\n$VAL_economic_settlement_ready_tt$"
 VAL_Return_To_World_Market:0 "Снова известны во всём мире"
 VAL_Return_To_World_Market_desc:0 "Мир заключён, долги урегулированы, а новые маршруты обеспечивают заводы сырьём. Проверенные контракты возвращают оружейным фабрикам международную известность. Последняя программа завершает экономическое восстановление и повышает предельную эффективность производства.\n\n$VAL_economic_settlement_ready_tt$"

 VAL_Veterans_Of_The_Campaign:0 "Опыт победившей армии"
 VAL_Veterans_Of_The_Campaign_desc:0 "Победа оставила Кефрейту не только новые дороги и списки потерь. Командиры рот впервые провели длительную кампанию в общей системе снабжения, единых штабных сроках и под контролем государственного реестра. Этот опыт слишком дорог, чтобы снова растворить его по частным компаниям.\n\nСергей Волков соберёт разборы операций и превратит привычки победивших частей в программу подготовки. Ветеран должен возвращаться из войны не со своей маленькой армией, а с инструкцией для следующей."
 VAL_arsenal_reputation:0 "Репутация оружейных заводов"
 VAL_arsenal_reputation_desc:0 "Доверие заказчиков: [?VAL_arsenal_reputation_stage|0]/5. Гражданская война в Воркерланде обнуляет прежнюю известность. Четыре программы восстанавливают доверие, а возвращение на мировой рынок после победы открывает последнюю ступень и повышает предельную эффективность производства. Соблюдение квартальных поставок учитывается отдельно."
 VAL_arsenal_reputation_delta:0 "Возвращение доверия заказчиков"
 VAL_arsenal_quality_delta:0 "Международное признание качества"
 VAL_quality_trials_bonus:0 "Независимая приёмка оружия"

 VAL_econ_development_fund:0 "Фонд промышленного развития"
 VAL_econ_development_fund_desc:0 "Откроем долгосрочное финансирование крупных промышленных программ. Государственные банки и предприятия согласуют инвестиции и поставки оборудования."
 VAL_econ_precision_industry:0 "Прецизионное станкостроение"
 VAL_econ_precision_industry_desc:0 "Точные станки определяют качество всей производственной цепи. Соберём единый заказ на оборудование и подготовим предприятия к его установке."
 VAL_econ_special_metallurgy:0 "Контракты специальной металлургии"
 VAL_econ_special_metallurgy_desc:0 "Редкие сплавы и электронные компоненты требуют устойчивого снабжения. Единые стандарты поставок свяжут собственные заводы и внешние закупки с реальными потребностями промышленности."
 VAL_econ_automation:0 "Автоматизированные арсеналы"
 VAL_econ_automation_desc:0 "Разрешим программу автоматизации. Сам фокус только открывает проект: автоматизация будет установлена после отдельного оплаченного промышленного решения, нескольких месяцев работ и выделения материалов."
 VAL_econ_logistics:0 "Промышленная транспортная сеть"
 VAL_econ_logistics_desc:0 "Производству нужны защищённые перевозки. Фокус разрешает оплаченные заказы грузового транспорта и бронированных поездов из уже освоенных моделей; техника поступит только после завершения промышленного контракта."
 VAL_econ_computing:0 "Вычислительная сеть Кефрейта"
 VAL_econ_computing_desc:0 "Разрешим создание общего вычислительного комплекса. Фокус открывает программу, но постоянный эффект появится только после завершения отдельно оплаченного проекта."
 VAL_econ_defense_orders:0 "Высокотехнологичные военные заказы"
 VAL_econ_defense_orders_desc:0 "Согласуем с предприятиями серийный выпуск разведывательных машин и боевых платформ. Военные специалисты подготовят единые требования к новой технике."
 VAL_econ_export_finance:0 "Финансирование промышленного экспорта"
 VAL_econ_export_finance_desc:0 "Переход от разовых сделок к экспортному финансированию даст предприятиям предсказуемые расчёты. Доходы от внешней торговли должны поддерживать следующую волну инвестиций."
 VAL_econ_integrated_economy:0 "Контрактная экономика полного цикла"
 VAL_econ_integrated_economy_desc:0 "Объединим точное производство, транспорт и вычислительные мощности в единую систему. Предприятия будут согласовывать снабжение и развитие всей производственной цепи."

 VAL_Bezhaysk_Operation:0 "Операция против Бежайска"
 VAL_Bezhaysk_Operation_desc:0 "Разгром Стеландера открывает дорогу к Бежайску. После завершения государственных реформ подготовим отдельную операцию против столичного владения и отдадим приказ о наступлении."
 VAL_bezhaysk_operation_available_tt:0 "Стеландер разгромлен и его земли закреплены за Кефрейтом или его администрациями. Кефрейт независим и находится в мире; Бежайск существует, независим, не капитулировал и не состоит с нами в одном альянсе."


 VAL_Resource_War_Contracts:0 "Контракты ресурсной войны"
 VAL_Resource_War_Contracts_desc:0 "Выберем сторону ресурсной войны и предложим помощь в обмен на права на добычу после её победы. Договор должен принять получатель. Оружие и наёмники оплачиваются нашими запасами; одних обещаний для концессии недостаточно."
 VAL_resource_war_arms:0 "Отправить оружие: [FROM.GetName]"
 VAL_resource_war_arms_desc:0 "Передать 25000 винтовок из наших запасов выбранной стороне. Поставка сразу засчитывается в обязательства. Для выполнения оружейного варианта нужны две такие партии. Получатель не платит казной: вознаграждением служит послевоенная концессия."
 VAL_resource_war_personnel:0 "Отправить наёмников: [FROM.GetName]"
 VAL_resource_war_personnel_desc:0 "Передать 2000 человек в людской резерв выбранной стороны и предоставить советников на 70 дней. Кефрейт расходует 2000 людских ресурсов и 25 командного ресурса. Это полностью выполняет обязательства по помощи; новые дивизии автоматически не создаются."
 VAL_resource_war_arms_offer_tt:0 "Предложение на 14 дней: 25000 винтовок за 100 казны. Передача и оплата - только после согласия покупателя; Кефрейт получает доход от оружейного контракта на 70 дней."
 VAL_resource_war_personnel_offer_tt:0 "Предложение на 14 дней: 2000 военнослужащих в людской резерв и военные советники на 70 дней за 100 казны. После принятия Кефрейт расходует 2000 людских ресурсов и 25 командного ресурса."
 val_contract.341.personnel:0 "В этот раз кефрейтский пакет шире обычной штабной миссии. Вместе с инструкторами предлагается две тысячи военнослужащих для пополнения людского резерва. Они прибудут организованно, со своими списками и офицерами связи, а специалисты останутся при штабе на срок контракта. Общая цена составляет сто единиц казны.\n\nКефрейт не называет это братской помощью. Люди, обучение и риск занесены в одну ведомость, а покупатель получает именно то, за что платит. Для страны, которая сейчас считает каждого доступного бойца, такая сухая формулировка может оказаться привлекательнее любой речи о солидарности."
 VAL_resource_war_personnel_accepted_tt:0 "За 100 казны мы получим 2000 людских ресурсов и кефрейтских военных советников на 70 дней. Кефрейт расходует 2000 людских ресурсов и 25 командного ресурса, получая +10 еженедельного дохода на 70 дней."

 VAL_negotiate_nam_metals:0 "Обсудить островную концессию с наместником"
 VAL_negotiate_nam_metals_desc:0 "Предложить наместнику помощь в обмен на права на добычу в Западном островном округе после его победы. После принятия договора перейти к коалиции уже нельзя. Подготовка предложения стоит 50 политической власти; отказ не возвращает эту плату."
 VAL_nam_concession_negotiable_tt:0 "Ресурсная война продолжается, сторона ещё не выбрана; наместник независим и удерживает Западный островной округ. Нет действующего предложения другой стороне или недавнего кефрейтского контракта с Эфлором."
 VAL_nam_concession_terms_tt:0 "После принятия договора: §Y90 дней§! на §Y50000§! винтовок, §Y2000§! наёмников либо присутствие §Y2§! добровольческих дивизий §Y30 дней подряд§!. Полная помощь и победа наместника дадут права на добычу в §YЗападном островном округе§!."
 VAL_register_nam_concession:0 "Оформить островную концессию"
 VAL_register_nam_concession_desc:0 "Если победа уже достигнута, но передаче прав мешала оккупация, оформим добычу после возвращения контроля наместнику."
 VAL_nam_concession_ready_tt:0 "Наместник принял договор, получил оговорённую помощь и победил в ресурсной войне. Западный островной округ принадлежит независимому Светлогорью и контролируется им. Кефрейт независим и не воюет со Светлогорьем; права ещё не переданы."
 VAL_nam_concession_reward_tt:0 "Кефрейт получает права на ресурсы Западного островного округа с базовым запасом 16 стали. Округ остаётся у Светлогорья."
 val_contract.349.t:0 "Кефрейт предлагает островной договор"
 val_contract.349.d:0 "Кефрейт предлагает помощь в ресурсной войне в обмен на права на добычу в Западном островном округе после нашей победы. Суверенитет над островом не меняется.\n\nВ течение 90 дней после согласования Кефрейт должен передать 50000 винтовок или 2000 наёмников либо держать у нас две добровольческие дивизии 30 дней подряд. Без выполнения одного из этих условий обязательств по концессии не возникнет. Кефрейт также обязуется не снабжать противоположную сторону до окончания войны."
 val_contract.349.accept:0 "Согласовать условия концессии"
 val_contract.349.refuse:0 "Не связывать месторождения договором"

 VAL_frontier_nod_forecast_tt:0 "Нодрул: [VALGetNodFrontierIntervention]"
 VAL_nod_frontier_joined:0 "§Rуже участвует на стороне племён§!"
 VAL_nod_frontier_expected:0 "§YНодрул предъявит ультиматум и даст Кефрейту 100 дней на завершение племенной кампании.§!"
 VAL_nod_frontier_unavailable:0 "§Gсейчас не вступит: условия участия или совместимость союзов не выполнены§!"

 VAL_postwar_administration:0 "Послевоенное управление"
 VAL_postwar_administration_desc:0 "Кефрейт интегрирует непосредственно удерживаемые земли как непрерывно расширяющуюся административную границу. Национализировать можно только принадлежащий и контролируемый Кефрейтом ненациональный регион, который граничит с уже национальной территорией. Одновременно идёт только одна программа; после её завершения новый core открывает для следующего шага собственных соседей. Автономные договорные администрации остаются отдельными до прямого присоединения их земель."
 VAL_nationalise_region:0 "Национализировать пограничный регион: [FROM.GetName]"
 VAL_nationalise_region_desc:0 "Распространить систему гражданства, налогов и воинского учёта Кефрейта дальше по административной границе. Регион должен напрямую принадлежать и контролироваться Кефрейтом, не быть core и граничить с уже национальной территорией. Через §Y120 дней§! он станет core и откроет для национализации собственных соседей. Одновременно можно обрабатывать только один регион. При утрате условий §Y50§! политической власти возвращаются."

 VAL_proclaim_commonwealth:0 "Провозгласить Кефрейтское содружество"
 VAL_proclaim_commonwealth_desc:0 "Закрепить послевоенное устройство общим государственным договором. Кефрейт получит новое название и флаг; автономные администрации сохранят свои территории и особый статус."
 VAL_commonwealth_requirements_tt:0 "Завершён фокус «Контракты переживают королей»; Кефрейт независим, не капитулировал и находится в мире; северные племена, Нодрул и Стеландер подчинены согласно целям кампании; северный ресурсный пояс удерживается; регионы §Y[29.GetName]§! и §Y[46.GetName]§! принадлежат Кефрейту и контролируются им; стабильность не ниже §Y50%§!"
 VAL_commonwealth_proclaimed_tt:0 "Государство получит название §YКефрейтское содружество§! и новый флаг. Статус и территории марионеток сохранятся."
 VAL_staff_influence:0 "Совещательный голос генералитета"
 VAL_staff_dominance:0 "Диктат генерального штаба"
 VAL_solgalov_influence:0 "Преимущество Солгалова"
 VAL_solgalov_dominance:0 "Личная власть Солгалова"
 VAL_command_balance_category_desc:0 "Генералитет требует самостоятельности в военных вопросах, Солгалов - контроля над заказами и назначениями. Умеренное влияние даёт преимущества; крайнее господство любой стороны снижает стабильность.\n\nПотеря принадлежащей нам национальной области во время войны сдвигает баланс на §Y10%§! к генералитету. Возвращение такой области восстанавливает §Y5%§! влияния Солгалова. Повторная потеря той же области без её возвращения не учитывается."
 VAL_staff_operational_mandate:0 "Передать штабу оперативное руководство"
 VAL_staff_operational_mandate_desc:0 "На время войны делегировать планирование операций генералитету. Требуется §Y25§! командного ресурса. Полномочия действуют §Y90 дней§! и прекращаются раньше при наступлении мира."
 VAL_staff_war_mandate:0 "Оперативная самостоятельность штаба"
 VAL_staff_war_mandate_desc:0 "Командование вправе согласовывать операции без отдельных разрешений канцелярии. Временный мандат прекращается с окончанием войны."
 VAL_contract_audit:0 "Провести проверку военных контрактов"
 VAL_contract_audit_desc:0 "В мирное время проверить расходы штабов и закрепить гражданский контроль над военными заказами."
 VAL_reconcile_command:0 "Созвать согласительную комиссию"
 VAL_reconcile_command_desc:0 "Согласовать полномочия канцелярии и генерального штаба. Баланс сдвинется на §Y20%§! от господствующей стороны к середине."
 VAL_settle_command_crisis:0 "Пересмотреть распределение полномочий"
 VAL_settle_command_crisis_desc:0 "Крайняя концентрация власти мешает работе государства. Пересмотр мандатов сдвинет баланс на §Y40%§! от господствующей стороны к середине."
 VAL_focus_export_market_open_tt:0 "Открывает оружейные сделки по 25000 винтовок за 500 казны и путь к крупным заказам. Северные партнёры могут покупать в мирное время."
 VAL_focus_adviser_contracts_ready_tt:0 "Открывает платные контракты военных советников. Они используют отдельный слот: одновременно может действовать только одна кефрейтская миссия советников."
 VAL_focus_paid_program_authorization_tt:0 "§YТолько разрешение:§! указанную промышленную программу ещё нужно отдельно оплатить и завершить через решения §Y«Промышленные программы»§!, прежде чем будет получена материальная награда."
 VAL_occidian_registries_reward_tt:0 "§YОкцидийская договорная администрация§! получит §G+5% стабильности§! и §G+50 политической власти§!."
 VAL_frontier_nationalisation_chain_tt:0 "Открывает повторяемую национализацию на карте для непосредственно удерживаемых §Yрегионов, соседних с уже национальной территорией Кефрейта§!. Каждый новый core открывает следующий пояс соседних регионов."
 VAL_nationalise_region_complete_tt:0 "Регион становится §Yнациональной территорией Кефрейта§!. Его непосредственно удерживаемые соседи теперь могут стать доступны для следующей программы национализации."
 VAL_fund_contract_chancery:0 "Финансировать контрактную канцелярию"
 VAL_fund_contract_chancery_desc:0 "Купить административную пропускную способность вместо ожидания, пока политический аппарат восстановится сам. Потратить средства казны на чиновников, провинциальные управления и обработку договоров, чтобы получить политическую власть. Решение можно повторять раз в 90 дней."


