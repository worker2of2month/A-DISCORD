 val_contract.family.terms: "Выторговать отдельные условия"
 val_contract.family.cancel: "Отложить сделку"
 VAL_cw_neutral_srp_tt: "Если республики уже существуют и не воюют, их мобилизационные заказы будут закрыты: Кефрейт не станет их заказчиком."
 val_rework.2.t: "Подписи вместо клятв"
 val_rework.2.d: "В зале учёта нет трона. Есть стол, печать и очередь капитанов, которые пришли не клясться, а сверить ставки.\n\nСолгалов не обещает им родину. Он обещает оплату, патроны и человека, который придёт, если договор сорвут."
 val_rework.2.a: "Открыть книгу."
 val_rework.3.t: "Урожай пепла"
 val_rework.3.d: "За околицами ещё лежат гильзы и пересохшие борозды. Народ умеет жить среди металла лучше, чем среди зерна.\n\nТеперь государство должно решить, что важнее сохранить: людей, которые ещё могут держать винтовку, или дворы, которые ещё могут кормить цеха."
 val_rework.3.a: "Считать остатки."
 val_rework.4.t: "Контракты переживают королей"
 val_rework.4.d: "Реестр больше не зависит от одного человека. Капитаны, цеха и штабы сведены в одну книгу, и эта книга переживёт любого барона, который поставит под ней печать."
 val_rework.4.a: "Оставить систему."
 val_rework.5.t: "Итог стальной книги"
 val_rework.5.trade: "Стеландские поставки оплачены и исполнены. Арсеналы получают основание расширить выпуск, а казна - долю с чужой войны."
 val_rework.5.military: "Северные перевалы стали военным счётом. Штабы требуют новых линий и оставляют полевой опыт тем, кто вёл колонны."
 val_rework.5.neutral: "Кефрейт не стал стороной стеландской войны. Внутренний порядок удержан, но арсеналы не получили чужого заказа."
 val_rework.5.a: "Закрыть ведомость."
 VAL_ops_family_remaining_tt: "Осталось семейство контракта, которое ещё можно предложить."
 VAL_northern_export_buyer_choice_tt: "Получатель решит, принять ли груз. Отказ вернёт винтовки."
 VAL_northern_export_accepted_tt: "Груз принят. Кефрейт получает оговорённую выручку, получатель - винтовки."
 VAL_northern_export_refused_tt: "Получатель отказался. Зарезервированные винтовки вернутся в запас Кефрейта."
 VAL_northern_finance_buyer_choice_tt: "Хозяин рынка решит, допустить ли кефрейтских посредников. Отказ вернёт казну."
 VAL_northern_finance_accepted_tt: "Сеть посредников расширится на одну ступень."
 VAL_northern_finance_refused_tt: "Допуск закрыт. Вложенные §Y50§! вернутся в казну."
 VAL_westerholm_offer_tt: "Воркерланд получит предложение уступить права на сталь Вестерхольма. Согласие откроет концессию; отказ оставит месторождение у них."
 VAL_westerholm_accepted_tt: "Права на сталь Вестерхольма переходят Кефрейту."
 VAL_westerholm_refused_tt: "Воркерланд отклонил концессию. Права на месторождение не меняются."
 val_contract.310.t: "Кефрейтский груз"
 val_contract.310.d: "На границе стоит кефрейтская колонна с винтовками. Принять груз - значит взять оружие; выручку по уже заключённой цене получит Кефрейт. Отказ отправит вагоны обратно."
 val_contract.310.a: "Принять поставку."
 val_contract.310.b: "Вернуть колонну."
 val_contract.311.t: "Кефрейтский груз"
 val_contract.320.t: "Концессия Вестерхольма"
 val_contract.320.d: "Кефрейт предлагает выкуп прав на сталь западного месторождения. Согласие сохранит формальное владение районом, но руду и ренту заберёт кефрейтская книга. Отказ оставит жилу у нас."
 val_contract.320.a: "Уступить права."
 val_contract.320.b: "Отклонить концессию."
 val_contract.330.t: "Кефрейтские посредники"
 val_contract.330.d: "Кефрейтские конторы просят постоянный допуск на рынок. Согласие расширит их сеть. Отказ вернёт им казну, но не политические затраты."
 val_contract.330.a: "Допустить конторы."
 val_contract.330.b: "Закрыть допуск."
 val_contract.331.t: "Кефрейтские посредники"
