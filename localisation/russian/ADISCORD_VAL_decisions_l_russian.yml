 val_rework.2.t: "Подписи вместо клятв"
 val_rework.2.d: "В зале учёта действительно нет трона. Есть длинный стол, печать казначейства и очередь капитанов, которые пришли не клясться, а сверить ставки. Один требует доплату за потери, другой спорит о цене транспорта, третий приносит список людей, которых считает своей собственностью до конца контракта.\n\nСолгалов не просит никого любить Кефрейт. Он предлагает более проверяемую вещь: деньги приходят в срок, склад выдаёт обещанное, спор разбирает тот, чья подпись стоит на договоре. В стране, где почти каждая вооружённая группа помнит время частных войн, такая скучная предсказуемость и есть государственная власть.\n\nПечать опускается на первую страницу нового реестра. Следующий капитан уже ждёт своей очереди."
 val_rework.2.a: "Открыть книгу."
 val_rework.3.t: "Урожай пепла"
 val_rework.3.d: "За последними домами земля быстро становится серой. Между пересохшими бороздами до сих пор находят осколки, обрывки проволоки и старые корпуса снарядов. На некоторых полях легче собрать металлолом, чем урожай. Кефрейт научился жить с этим настолько хорошо, что целое поколение считает такую землю обычной.\n\nВ деревенской школе комиссия записывает две цифры: сколько молодых людей можно отправить в роты и сколько семей ещё способны удерживать хозяйство. Обе нужны государству. Если забрать первых, фабрики получат солдат и рабочих. Если потерять вторых, ещё один район станет зависеть от привозного хлеба.\n\n«Урожай пепла» оказался не красивой метафорой. Это бухгалтерская задача, которую война оставила тем, кто выжил."
 val_rework.3.a: "Считать остатки."
 val_rework.4.t: "Контракты переживают королей"
 val_rework.4.d: "Новый государственный реестр занял несколько шкафов и потребовал больше бумаги, чем ожидало министерство. В нём рядом стоят частные роты, арсеналы, транспортные конторы, долги, сроки и имена людей, имеющих право поставить подпись от их имени. То, что раньше существовало как личная договорённость с Солгаловым, теперь получает номер и место в общей системе.\n\nКапитан может умереть. Посредник может сбежать. Даже оружейный барон однажды исчезнет из собственного кабинета. Контрактное государство станет настоящим только тогда, когда после этого следующий платёж, приказ и поставка всё равно найдут адресата.\n\nКнига закрывается на ночь. Утром её откроет уже не личный секретарь правителя, а обычный служащий."
 val_rework.4.a: "Оставить систему."
 val_rework.5.t: "Итог стальной книги"
 val_rework.5.trade: "В расчётной палате поставили последнюю отметку напротив стеландских поставок. Оружие ушло по договору, деньги пришли, посредники получили свою долю, а заводы впервые смогли сравнить обещанный спрос с реальным. Чужая гражданская война оказалась для Кефрейта не только риском, но и подтверждением того, что его главный товар всё ещё нужен.\n\nСолгалов приказал не праздновать слишком громко. Один хороший контракт не заменяет потерянный рынок. Но теперь арсеналы могут расширять выпуск, опираясь не на рекламу старой славы, а на свежую подпись покупателя."
 val_rework.5.military: "В штабе северных операций сняли со стены карту перевалов и положили её рядом с ведомостью расходов. В ней война выглядела иначе: горючее, потерянные машины, оплата рот, ремонт орудий, дни простоя заводов. Каждый захваченный узел имел цену, и впервые эту цену можно было сравнить с тем, что страна получила взамен.\n\nОфицеры принесли домой больше, чем опыт боя. Они вернули сведения о дорогах, снабжении и том, где контрактная армия перестаёт быть набором рот и начинает работать как единая система. Теперь этот опыт предстоит превратить в следующую реформу."
 val_rework.5.neutral: "В расчётной палате закрывают стеландскую ведомость. Без исполненного оружейного договора или закреплённой окцидийской базы правительство не может предъявить арсеналам новый рынок как свершившийся факт. У одних рот сохранились резервы, другие вернулись из неудачной кампании; обещание само по себе не оплачивает расширение производства.\n\nТеперь предстоит сверить обязательства, восстановить доверие к решениям правительства и привести оставшиеся ресурсы в порядок."
 val_rework.5.a: "Закрыть ведомость."
 val_rework.6.t: "Соборы из цеха"
 val_rework.6.d: "Ночная смена начинается раньше, чем заканчивается вечерняя. Через высокие окна цехов видно раскалённые печи, крановые балки и ряды деталей, которые уже несут к следующему участку. В городе можно закрыть театр, отменить парад или перенести заседание. Остановившийся оружейный завод заметят раньше всего.\n\nПоэтому в Кефрейте заводы действительно напоминают соборы, только молитва здесь измеряется температурой металла и количеством готовых стволов. Солгалов не строит святыню. Он расширяет систему, которая позволяет отравленной земле покупать хлеб, топливо и влияние тем товаром, который она умеет делать лучше всего.\n\nНовая линия запускается без колоколов. Её первый заказ уже имеет номер."
 val_rework.6.a: "Зажечь печи."
 val_rework.7.t: "Роты в одной книге"
 val_rework.7.d: "Капитаны привыкли считать роту продолжением собственной фамилии. Людей нанимали через знакомых, боеприпасы записывали в личные книги, потери объясняли тем, кому хватало влияния задавать вопросы. Новый реестр ломает не эту традицию, а её безнаказанность.\n\nТеперь каждая рота получает номер, штат, ставку и человека, отвечающего за расхождение между складом и полем. Капитан сохраняет своих людей и привычки, пока выполняет договор. Государство сохраняет право знать, за что именно платит.\n\nРеестр не делает наёмников патриотами. Он делает их предсказуемыми. Для Кефрейта это полезнее."
 val_rework.7.a: "Открыть реестр."
 val_rework.8.t: "Тень октября"
 val_rework.8.d: "В архиве октябрьские документы лежат отдельно. Одни называют их спасением торговли, другие первым случаем, когда Кефрейт доказал соседям, что подпись под угрозой всё равно остаётся подписью. Стеланд помнит те недели как унижение. Кефрейт хранит их как прецедент.\n\nТеперь северная дорога снова становится важной. Старые участники постарели, часть границ изменилась, но бумага всё ещё работает в переговорах, потому что за ней стоит память о том, что произошло после отказа.\n\nСолгалову не нужна любовь соседей к старому договору. Ему достаточно, чтобы они помнили цену его нарушения."
 val_rework.8.a: "Держать бумагу."
 val_rework.9.t: "Стеландер: новые направления"
 val_rework.9.d: "Из Стеландера пришло подтверждение открытых боёв между партийными войсками и сопротивлением. Разведывательные сводки превращаются в заявки: посредники ищут покупателей, капитаны уточняют маршруты, арсеналы считают свободные партии оружия.\n\nВ дереве национальных фокусов открылась стеландская кризисная ветка. Она позволяет оформить курс поставок, подготовить отдельную операцию на перевалах или оставить резервы дома. Уже принятые обязательства сохраняются; это сообщение само по себе не выбирает курс и не объявляет войну.\n\n[ROOT.VALGetStelanderCrisisStatus]"
 val_rework.9.a: "Ознакомиться с направлениями."
 val_rework.10.t: "Покупатель сгорел"
 val_rework.10.d: "Западные адреса перестали отвечать один за другим. Сначала задержался платёж, затем вернулся вагон без разгрузочной ведомости, потом посредник сообщил, что учреждения, с которыми подписывали контракт, больше не существуют в прежнем виде. На запасных путях скопились грузы, произведённые для покупателя, которого уже нельзя найти на карте.\n\nКефрейт привык считать отсутствие друзей преимуществом. Отсутствие рынка оказалось совсем другим. Арсеналы продолжают платить сменам, армия требует снабжения, а привозной хлеб не становится дешевле только потому, что соседняя империя рухнула.\n\nСолгалов приказал открыть все внешние книги. Если старый покупатель сгорел, государству придётся найти несколько новых раньше, чем остановятся печи."
 val_rework.10.a: "Переписать маршруты."
 val_rework.11.t: "Война в аренду"
 val_rework.11.d: "На столе лежит типовой договор: численность роты, срок службы, перечень вооружения, ответственность покупателя и сумма, после которой кефрейтский капитан перестаёт задавать вопросы о чужой политике. Для одних государств такой документ выглядит цинично. В Кефрейте его считают честнее обещаний о братской помощи.\n\nРота уходит с собственным командованием и возвращается, когда заканчивается оплаченный срок. Казна получает валюту и доступ к рынку, заводы получают новый заказ. Цена тоже записана заранее: имена тех, кто может не вернуться.\n\nСолгалов не продаёт славу. Он продаёт дисциплину на срок и требует, чтобы оплата пришла раньше похоронных списков."
 val_rework.11.a: "Выставить цену."
 VAL_ops_family_remaining_tt: "Осталось семейство контракта, которое ещё можно предложить."
 VAL_northern_export_buyer_choice_tt: "Получатель решит, принять ли груз. Отказ вернёт винтовки."
 VAL_northern_export_accepted_tt: "Груз принят. Кефрейт получает оговорённую выручку, получатель - винтовки."
 VAL_northern_export_refused_tt: "Получатель отказался. Зарезервированные винтовки вернутся в запас Кефрейта."
 VAL_northern_finance_buyer_choice_tt: "Хозяин рынка решит, допустить ли кефрейтских посредников. Отказ вернёт казну."
 VAL_northern_finance_accepted_tt: "Сеть посредников расширится на одну ступень."
 VAL_northern_finance_refused_tt: "Допуск закрыт. Вложенные §Y50§! вернутся в казну."
 VAL_westerholm_offer_tt:0 "Воркерланд получит предложение расширить разработку стали в районе [38.GetName] и передать права Кефрейту. Согласие откроет дополнительные поставки до гражданской войны."
 VAL_westerholm_accepted_tt:0 "Кефрейт получает права на сталь района [38.GetName] до распада Воркерланда или потери месторождения."
 VAL_westerholm_refused_tt:0 "Воркерланд отклонил расширение поставок. Права на месторождение не меняются."
 val_contract.310.t: "Кефрейтский груз"
 val_contract.310.d: "К границе подошла колонна с кефрейтскими пломбами. В кузовах лежат винтовки из уже оплаченной партии, в кабинах сидят водители, которым всё равно, какая фракция победит через месяц. Их задача заканчивается подписью получателя в накладной.\n\nПринять груз значит получить оружие сейчас и подтвердить, что контракт исполнен. Отказ отправит колонну обратно, а Кефрейт вернёт зарезервированный товар в собственный оборот. На этой сделке никто не просит политической благодарности. Только подпись внизу страницы."
 val_contract.310.a: "Принять поставку."
 val_contract.310.b: "Вернуть колонну."
 val_contract.311.t: "Кефрейтский груз"
 val_contract.320.t: "Концессия воркерландского металла"
 val_contract.320.d: "Кефрейтские юристы приехали к месторождению раньше геологов. Они не требуют менять флаг над районом и не спорят о том, кому принадлежит сама земля. Предложение касается более узкой вещи: права добывать сталь, вывозить её по согласованному маршруту и получать ренту по долгосрочной концессии.\n\nДля владельца территории это деньги без формальной уступки границы. Для Кефрейта возможность превратить чужую жилу в часть собственной промышленной системы. Бумага выглядит мирно, но срок её действия переживёт многие военные договоры.\n\nРешение сводится к старому вопросу: что важнее, сохранить контроль над ресурсом или продать право пользоваться им тому, кто готов платить сейчас."
 val_contract.320.a: "Уступить права."
 val_contract.320.b: "Отклонить концессию."
 val_contract.330.t: "Кефрейтские посредники"
 val_contract.330.d: "Посредники больше не просят провести одну конкретную сделку. Они предлагают постоянное место для кефрейтских контор: счета в местных банках, доступ к торговым домам и людей, которые будут заранее предупреждать о новых заказах. Взамен сеть обещает приводить покупателей и брать на себя часть риска.\n\nСогласие не превращает страну в клиента Кефрейта за один день. Оно делает более важную вещь: создаёт группу людей, для которых следующий кефрейтский контракт выгоднее отсутствия Кефрейта вообще. Отказ закроет этот путь, пока посредники ещё готовы уйти без скандала."
 val_contract.330.a: "Допустить конторы."
 val_contract.330.b: "Закрыть допуск."
 val_contract.331.t: "Кефрейтские посредники"
 VAL_liberated: "Освобождённый Кефрейт"
 VAL_liberated_DEF: "Освобождённого Кефрейта"
 VAL_liberated_ADJ: "кефрейтск."

