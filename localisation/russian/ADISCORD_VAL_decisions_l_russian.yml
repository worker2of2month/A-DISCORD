 VAL_livonn_settlement_category: "Судьба Ливонинского округа"
 VAL_livonn_settlement_category_desc: "После разгрома горных республик Кефрейт установил военную администрацию и в §Y[45.GetName]§!. Довоенный договор с Шабратом предусматривал передачу округа сопротивлению. Теперь Кефрейт должен решить, считать ли подпись обязательством после победы."
 VAL_honor_livonn_agreement: "Соблюсти договор с Шабратом"
 VAL_honor_livonn_agreement_desc: "Передать §Y[45.GetName]§! стороне Шабрата, как было обещано до вмешательства. Остальные территории, занятые Кефрейтом по итогам кампании, останутся под нашим контролем."
 VAL_keep_livonn: "Оставить Ливонин Кефрейту"
 VAL_keep_livonn_desc: "Объявить довоенную договорённость утратившей силу. §Y[45.GetName]§! останется под администрацией Кефрейта."
 VAL_frontier_transport_contract:0 "Нанять транспортные колонны"
 VAL_frontier_transport_contract_desc:0 "Оплатить перевозчиков и передать им 100 грузовиков из армейского резерва. На 180 дней расход снабжения армии уменьшится на 10%. Контракт закончится раньше при отзыве ультиматума или завершении пограничной кампании. Казна и грузовики расходуются без возврата; новый контракт возможен после окончания прежнего."
 VAL_frontier_transport_columns:0 "Экспедиционные транспортные колонны"
 VAL_frontier_transport_columns_desc:0 "Оплаченные перевозчики и выделенные грузовики обслуживают пограничную экспедицию. Контракт действует не более 180 дней и прекращается вместе с кампанией."
 VAL_frontier_transport_cost: "£ADISCORD_economy_treasury_texticon §Y50§!  £motorized_texticon §Y100§!"
 VAL_frontier_transport_cost_blocked: "£ADISCORD_economy_treasury_texticon §R50§!  £motorized_texticon §R100§!"
 VAL_frontier_transport_cost_tooltip: "Цена: £ADISCORD_economy_treasury_texticon §Y50§!  £motorized_texticon §Y100§!."
 VAL_frontier_begin_offensive:0 "Начать пограничную операцию"
 VAL_frontier_begin_offensive_desc:0 "Начать войну с текущим адресатом и его северным альянсом. Нодрул сначала предъявит ультиматум: после него у Кефрейта будет 100 дней на разгром коалиции до вмешательства."
 VAL_frontier_withdraw_demand:0 "Отозвать пограничный ультиматум"
 VAL_frontier_withdraw_demand_desc:0 "Закрыть текущую кампанию и прекратить оплаченный транспортный контракт. Повторный ультиматум тому же адресату возможен после исходного срока в 180 дней."
 VAL_frontier_withdraw_tt:0 "Требования отозваны; временные участники коалиции и транспортный контракт завершают участие. Собственный альянс северных племён сохраняется. Оплаченная подготовка не возмещается."
 val_rework.111.prepare:0 "Сначала подготовить экспедицию."
 VAL_frontier_prepare_tt:0 "Ультиматум остаётся в силе. Решения позволяют подготовить снабжение, начать войну или отозвать требования. Военные действия ещё не начинаются."
 VAL_FRONTIER_AWAITING:0 "ожидание ответа"
 VAL_FRONTIER_PREPARING:0 "отказ получен; подготовка экспедиции"
 VAL_FRONTIER_FIGHTING:0 "война"
 VAL_FRONTIER_IDLE:0 "нет действующей кампании"
 VAL_FRONTIER_NO_TARGET:0 "не выбран"
 VAL_FRONTIER_CIN:0 "Пепельное племя"
 VAL_FRONTIER_OSF:0 "Союз костоломов"
 VAL_FRONTIER_APH:0 "Антропофагорум"
 VAL_FRONTIER_ERT:0 "Восточная республика"
 VAL_FRONTIER_NOT_MEMBER:0 "не участвует"
 VAL_FRONTIER_DEFEATED:0 "§Gразгромлено§!"
 VAL_FRONTIER_RESISTING:0 "§Rсопротивляется§!"
 VAL_FRONTIER_MOBILIZING:0 "§Yготовится к войне§!"

 VAL_frontier_workshops: "Открыть ремонтные мастерские: [FROM.GetName]"
 VAL_frontier_workshops_desc: "Вложить 500 казны в ремонтную базу на собственной территории Кефрейта. Через 90 дней [FROM.GetName] получит одну дополнительную площадку и один военный завод. Земли подчинённых администраций не участвуют в программе. Потеря владения или контроля, капитуляция либо новая война отменят проект и вернут 500 казны. Можно вести работы в разных районах одновременно."
 VAL_frontier_workshop_cost: "£ADISCORD_economy_treasury_texticon §Y500§!"
 VAL_frontier_workshop_cost_blocked: "£ADISCORD_economy_treasury_texticon §R500§!"
 VAL_frontier_workshop_cost_tooltip: "Цена: £ADISCORD_economy_treasury_texticon §Y500§!."
 VAL_frontier_workshop_result_tt: "В собственном районе [FROM.GetName] появятся одна площадка и один военный завод Кефрейта. При утрате условий платёж вернётся Кефрейту."
 VAL_frontier_workshop_refund_tt: "Оплаченные 500 казны вернутся Кефрейту; предприятие не будет построено."
 VAL_frontier_workshop_idle_tt: "В этом районе нет уже оплаченного проекта мастерских."

 VAL_foreign_sales:0 "Внешняя торговля и коридоры"
 VAL_foreign_sales_desc: "Обычными покупателями могут быть только страны, которые сейчас воюют. Экспорт продаёт партию винтовок; советники идут отдельной 70-дневной миссией и расходуют командный ресурс. Подготовка предложения стоит политической власти, но оружие, казна и командный ресурс переходят только после согласия покупателя. Расчётная палата позволяет одновременно получать доход от двух оружейных контрактов. Фокусы лишь разрешают сделки — автоматически договор не подписывается.\n\n$VAL_trade_corridors_desc$"
 VAL_export_income_1:0 "Действующий оружейный контракт"
 VAL_export_income_1_desc:0 "Экспортный стол занят на 70 дней после оплаты и отправки. Покупатель полностью рассчитался при принятии договора; для продления нужен новый заказ."
 VAL_export_income_2:0 "Второй оружейный контракт"
 VAL_export_income_2_desc:0 "Второй экспортный стол занят на 70 дней после оплаты и отправки. Покупатель полностью рассчитался при принятии договора; для продления нужен новый заказ."
 VAL_advisors_income:0 "Платная военная миссия"
 VAL_advisors_income_desc:0 "Миссия занимает возможности Кефрейта по отправке советников на 70 дней. Оплата поступает полностью при принятии договора; пока штаб работает за рубежом, собственное планирование Кефрейта ухудшается."
 VAL_paid_military_advisors:0 "Кефрейтские военные советники"
 VAL_paid_military_advisors_desc:0 "Договор действует 70 дней. Военные специалисты обучают штабы и налаживают восстановление частей."
 VAL_export_arms:0 "Продать оружие: [FROM.GetName]"
 VAL_export_arms_desc:0 "Подготовка предложения стоит §Y20§! политической власти; эта плата не возвращается при отказе. Предложить 2500 винтовок за 100 казны. При принятии покупатель платит сразу, Кефрейт получает §G100 казны§!, а партия уходит со склада. Экспортный стол остаётся занят на 70 дней."
 VAL_export_arms_offer_tt:0 "Получатель получит предложение на 14 дней. До согласия оружие, деньги и командный ресурс не списываются. Цена и срок договора фиксированы."
 val_contract.340.t:0 "Предложение Кефрейта: вооружение"
 val_contract.340.d:0 "Кефрейтский представитель открыл ящик прямо в переговорной и положил на стол одну из винтовок. Оружие из той же партии уже проверено на арсеналах, транспорт готов, расчётный дом приложил подтверждение цены. Предложение простое: две с половиной тысячи винтовок за сто единиц казны.\n\nЗдесь нет политического пакета и требования менять внешнюю политику. Кефрейт продаёт то, что умеет производить, покупателю, которому оружие нужно сейчас. Условия сделки и последствия принятия уже внесены в контракт. Остаётся решить, стоит ли подпись быстрее собственной производственной линии."
 VAL_export_arms_accepted_tt:0 "За 100 казны страна получит 2500 винтовок со складов Кефрейта. Кефрейт сразу получает §G100 казны§!, а экспортный стол остаётся занят на 70 дней."
 VAL_export_advisors:0 "Направить советников: [FROM.GetName]"
 VAL_export_advisors_desc:0 "Подготовка предложения стоит §Y30§! политической власти; эта плата не возвращается при отказе. Предложить 70-дневную военную миссию за 100 казны. При принятии Кефрейт сразу получает §G100 казны§!, расходует 25 командного ресурса и на срок миссии теряет 5% скорости планирования. Получатель получает идею кефрейтских советников."
 VAL_export_advisors_offer_tt:0 "Получатель получит предложение на 14 дней. До согласия оружие, деньги и командный ресурс не списываются. Цена и срок договора фиксированы."
 val_contract.341.t:0 "Предложение Кефрейта: военные советники"
 val_contract.341.d:0 "Кефрейт предлагает не оружие, а людей, которые умеют заставить чужой штаб работать по кефрейтскому расписанию. Группа инструкторов займётся планированием, организацией снабжения и разбором операций. Цена договора составляет сто единиц казны.\n\nСоветники не получают командование армией и не остаются навсегда. Они приезжают как оплаченные специалисты, передают методы и уезжают после выполнения контракта. Для покупателя это способ купить опыт быстрее, чем его обычно оплачивают поражениями."
 VAL_export_advisors_accepted_tt:0 "За 100 казны страна получит идею «Кефрейтские военные советники» на 70 дней. Кефрейт сразу получает §G100 казны§!, расходует 25 командного ресурса и занимает слот советников на тот же срок."
 VAL_export_decline:0 "Отклонить или закрыть предложение."
 VAL_export_accept:0 "Подписать и оплатить договор."
 VAL_export_second_slot_tt:0 "Можно одновременно получать доход от двух оружейных контрактов. Второй требует отдельной партии в 2500 винтовок и согласия покупателя."

 VAL_northern_volunteers:0 "Добровольцы против Нодрула"
 VAL_northern_volunteers_desc:0 "Разрешить отправку действующих дивизий на северный фронт и Шабрату, пока они воюют с Нодрулом. Отправка выбирается в дипломатическом окне получателя; пополнение и техника остаются расходом Кефрейта. Части отзываются после завершения именно этой войны, даже если получатель продолжает другой конфликт."
 VAL_northern_volunteer_mandate:0 "Северная добровольческая миссия"
 VAL_northern_volunteer_mandate_desc:0 "Разрешена помощь противникам Нодрула на севере и войскам Шабрата. Используются существующие дивизии Кефрейта."
 VAL_northern_volunteers_tt:0 "В дипломатии доступны добровольцы для северных противников Нодрула и Шабрата. Выберите существующие дивизии. После окончания их войны против Нодрула части отзываются; проверка оставшихся фронтов проводится раз в неделю."

 VAL_New_Supply_Base:0 "Собственная база снабжения"
 VAL_New_Supply_Base_desc:0 "Соединим собственный северный ресурсный пояс с мастерскими и дорогами присоединённой Окцидии. Для этого нужно завершить переходное управление Балчанском, Гаванью и Шахтёрским посёлком. Эти территории заменят воркерландские поставки; временные экспортные платежи перестанут быть единственной опорой бюджета."
 VAL_Northern_Settlement:0 "Разгромить Нодрул"
 VAL_Northern_Settlement_desc:0 "Вмешательство Нодрула не закончится отдельным пограничным договором. Подготовим самостоятельный поход, который лишит его возможности диктовать условия северу."
 VAL_Stelander_Ultimatum:0 "Ультиматум Стеландеру"
 VAL_Stelander_Ultimatum_desc:0 "Потребуем признания кефрейтских границ в Окцидии. Дружественное правительство может принять торговое соглашение; Шабрат считает западные земли частью своего будущего государства. Отказ открывает подготовку новой войны."
 VAL_Campaign_Secured:0 "Кефрейтский порядок"
 VAL_Campaign_Secured_desc:0 "Кампания завершена, когда Нодрул и Стеландер утратили самостоятельную военную силу, а земли каннибалов находятся в нашей сфере. Исчезновения государств с карты недостаточно: их хозяйственная база должна действительно подчиняться Кефрейту."
 VAL_supply_base_secured_tt:0 "Все восемь земель каннибалов принадлежат и подконтрольны Кефрейту или его подчинённым. Антолла, Фарейн, Химбер, Балчанск, Гавань и Шахтёрский посёлок принадлежат и подконтрольны самому Кефрейту."
 VAL_campaign_objectives_tt:0 "Кефрейт независим и находится в мире. Северный ресурсный пояс принадлежит ему напрямую, остальные земли каннибалов - ему или его подчинённым. Нодрул, партия Стеландера и государство Шабрата разгромлены либо подчинены, их основная территория находится в сфере Кефрейта. Мирные республики в округах, полученных при расколе Стеландера, и земли, уступленные Яперту по северному миру, не требуют нового завоевания."
 VAL_campaign_against_nod:0 "Подготовить поход на Нодрул"
 VAL_campaign_against_nod_desc:0 "Мобилизация длится 30 дней и стоит 75 политического ресурса. Если Шабрат уже воюет с Нодрулом, Кефрейт вступит в ту же войну; иначе начнётся отдельная война. Исчезновение, подчинение или вступление цели в нашу фракцию отменяет подготовку. Завершение других войн не считается победой над этой целью."
 VAL_campaign_against_stelander:0 "Подготовить войну: [FROM.GetName]"
 VAL_campaign_against_stelander_desc:0 "Мобилизация длится 30 дней и стоит 75 политического ресурса. Затем начнётся отдельная война против выбранного государства. Исчезновение, подчинение или вступление цели в нашу фракцию отменяет подготовку. Завершение других войн не считается победой над этой целью."
 VAL_campaign_preparation_tt:0 "Через 30 дней начнётся война с выбранной страной, если условия сохранятся. На время подготовки другой такой поход недоступен."
 VAL_campaign_cancelled_tt:0 "Подготовка отменена. Политические расходы не возвращаются."
 VAL_stelander_ultimatum:0 "Предъявить условия: [FROM.GetName]"
 VAL_stelander_ultimatum_desc:0 "После гражданской войны потребуем признания Окцидии. Получатель ответит в течение 21 дня. Лидер, отношения и прежние поставки влияют на решение ИИ. Согласие даёт торговый договор на 180 дней; отказ открывает 30-дневную подготовку похода. Договор не считается полной победой в кампании."
 VAL_stelander_offer_tt:0 "Получатель имеет 21 день на ответ. По истечении срока неотвеченный ультиматум считается отклонённым."
 VAL_stelander_terms_tt:0 "Признаются границы Кефрейта в Окцидии. Принадлежащие и подконтрольные получателю западные округа уступаются Кефрейту; все три закреплённых региона образуют временную договорную администрацию, если интеграция ещё не завершена. Обе страны получают +5% торгового дохода на 180 дней; Кефрейт не может начать этот поход до окончания договора. Независимость Стеландера сохраняется."
 VAL_stelander_trade_terms:0 "Торговый договор с соседями"
 VAL_stelander_trade_terms_desc:0 "Стороны временно признали границы в Окцидии и согласовали условия торговли."
 val_contract.343.t:0 "Кефрейт требует признания границ"
 val_contract.343.shabrat:0 "Кефрейтская делегация разложила карту Окцидии поверх старого соглашения о поставках сопротивлению. Требование оказалось именно тем, чего Шабрат ожидал: признать кефрейтскую власть на западе и передать те округа, которые Стеланд всё ещё удерживает там фактически. Взамен предлагается открыть торговлю и закрыть спор без новой войны.\n\nШабрат сразу отделил две вещи. Кефрейт действительно продавал ему оружие, когда партия ещё держала столицу. Но оплаченная помощь не давала продавцу права определять послевоенную границу. Подписать соглашение значит признать распад старого Стеландера частью нового порядка. Отказ оставит Кефрейту возможность снова доказывать свои претензии армией."
 val_contract.343.friendly:0 "На этот раз кефрейтская нота пришла без языка ультиматума. Солгалов предлагает признать сложившуюся западную границу, передать удерживаемые спорные округа и открыть торговлю между двумя государствами. Дипломаты подчёркивают, что соглашение не затрагивает внутренний строй и не превращает Стеланд в клиента Кефрейта.\n\nЦена мира всё равно заметна на карте. Подпись означает окончательно отказаться от притязаний на Окцидию. Отказ сохраняет эти притязания, но вместе с ними сохраняет и риск ещё одной кампании через перевалы."
 val_contract.343.d:0 "Кефрейт требует признать сложившуюся власть в Окцидии и передать те западные округа, которые ещё остаются под нашим фактическим контролем. За подпись предлагается торговое соглашение и закрытие пограничного спора.\n\nТекст составлен так, чтобы выглядеть как окончательная сверка собственности после войны, а не новый ультиматум. Но за ним стоит армия, уже доказавшая готовность превращать хозяйственные претензии в военную операцию. Принятие закрепит границу. Отказ оставит вопрос открытым."
 val_contract.343.refuse:0 "Не признавать условия. Закрыть предложение."
 val_contract.343.accept:0 "Признать границу и подписать договор."
 VAL_regional_settlement:0 "Региональная система договоров"
 VAL_regional_settlement_desc:0 "Подчинённые территории и общие расчётные правила обеспечивают устойчивый доход кефрейтской казне."
 val_contract.345.t:0 "Кампания Кефрейта завершена"
 val_contract.345.d:0 "В главном штабе сняли сразу несколько карт. Нодрул больше не способен диктовать северный порядок, самостоятельный военный центр Стеландера сломлен, земли каннибалов включены в кефрейтскую систему снабжения и договоров. То, что начиналось как набор отдельных претензий, впервые выглядит как связанная зона влияния.\n\nСолгалов отказался называть кампанию завоеванием. В официальном сообщении речь идёт о выполненных обязательствах, безопасных маршрутах и гарантиях контрактов. На местах разница менее изящна: новые гарнизоны, новые администрации и чиновники, которые теперь сверяют книги по кефрейтским правилам.\n\nВойна закончилась. Теперь приобретённое придётся удерживать теми же инструментами, которыми Кефрейт обычно удерживает всё остальное: деньгами, снабжением и способностью выполнить собственную подпись."
 val_contract.345.a:0 "Закрепить новый порядок."

