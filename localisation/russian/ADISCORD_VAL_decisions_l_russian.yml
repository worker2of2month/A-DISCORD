 VAL_northern_finance_refused_tt: "Допуск закрыт. Вложенные §Y50§! вернутся в казну."
 VAL_westerholm_offer_tt:0 "Воркерланд получит предложение расширить разработку стали в районе [38.GetName] и передать права Кефрейту. Согласие откроет дополнительные поставки до гражданской войны."
 VAL_westerholm_accepted_tt:0 "Кефрейт получает права на сталь района [38.GetName] до распада Воркерланда или потери месторождения."
 VAL_westerholm_refused_tt:0 "Воркерланд отклонил расширение поставок. Права на месторождение не меняются."
 val_contract.310.t: "Кефрейтский груз"
 val_contract.310.d: "К границе подошла колонна с кефрейтскими пломбами. В кузовах лежат винтовки из уже оплаченной партии, в кабинах сидят водители, которым всё равно, какая фракция победит через месяц. Их задача заканчивается подписью получателя в накладной.\n\nПринять груз значит получить оружие сейчас и подтвердить, что контракт исполнен. Отказ отправит колонну обратно, а Кефрейт вернёт зарезервированный товар в собственный оборот. На этой сделке никто не просит политической благодарности. Только подпись внизу страницы."
 val_contract.310.a: "Принять поставку."
 val_contract.310.b: "Вернуть колонну."
 val_contract.311.t: "Кефрейтский груз"
 val_contract.320.t: "Концессия воркерландского металла"
 val_contract.320.d: "Кефрейтские юристы приехали к месторождению раньше геологов. Они не требуют менять флаг над районом и не спорят о том, кому принадлежит сама земля. Предложение касается более узкой вещи: права добывать сталь, вывозить её по согласованному маршруту и получать ренту по долгосрочной концессии.\n\nДля владельца территории это деньги без формальной уступки границы. Для Кефрейта возможность превратить чужую жилу в часть собственной промышленной системы. Бумага выглядит мирно, но срок её действия переживёт многие военные договоры.\n\nРешение сводится к старому вопросу: что важнее, сохранить контроль над ресурсом или продать право пользоваться им тому, кто готов платить сейчас."
 val_contract.320.a: "Уступить права."
 val_contract.320.b: "Отклонить концессию."
 val_contract.330.t: "Кефрейтские посредники"
 val_contract.330.d: "Посредники больше не просят провести одну конкретную сделку. Они предлагают постоянное место для кефрейтских контор: счета в местных банках, доступ к торговым домам и людей, которые будут заранее предупреждать о новых заказах. Взамен сеть обещает приводить покупателей и брать на себя часть риска.\n\nСогласие не превращает страну в клиента Кефрейта за один день. Оно делает более важную вещь: создаёт группу людей, для которых следующий кефрейтский контракт выгоднее отсутствия Кефрейта вообще. Отказ закроет этот путь, пока посредники ещё готовы уйти без скандала."
 val_contract.330.a: "Допустить конторы."
 val_contract.330.b: "Закрыть допуск."
 val_contract.331.t: "Кефрейтские посредники"
