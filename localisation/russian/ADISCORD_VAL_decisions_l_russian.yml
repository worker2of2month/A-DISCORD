 NKA:0 "Северная договорная администрация"
 NKA_DEF:0 "Северная договорная администрация"
 NKA_ADJ:0 "Севернокефрейтск."
 NKA_Contract_Council:0 "Договорная коллегия"
 autonomy_VAL_contract_administration:0 "Договорная администрация Кефрейта"
 VAL_create_northern_administration:0 "Оформить Северную договорную администрацию"
 VAL_create_northern_administration_desc:0 "Антолла, Фарейн и Химбер составят собственный ресурсный пояс Кефрейта. Пять остальных северных регионов объединятся в зависимую администрацию со столицей в Килнете. Договор передаёт Кефрейту 15% гражданских и 30% военных заводов, предоставляет 35% долю рекрутов в колониальных шаблонах и льготный доступ к сырью. Администрация сохраняет собственную армию."
 VAL_northern_administration_ready_tt:0 "Все восемь северных регионов принадлежат и подконтрольны Кефрейту или его подчинённым; Кефрейт и племенные государства находятся в мире. Администрация ещё не существует либо остаётся нашей мирной марионеткой и владеет частью ресурсного пояса. Для создания хотя бы один из пяти передаваемых регионов должен принадлежать Кефрейту либо стране с более чем одним регионом."
 VAL_northern_administration_tt:0 "Антолла, Фарейн и Химбер переходят под прямое владение Кефрейта. Медрон, Хеланд, Милхам, Килнет и Хебтава образуют Северную договорную администрацию с особым договорным статусом. Столица - Килнет. Владения вне восьми северных регионов не передаются."
 val_contract.346.t:0 "Северная договорная администрация"
 val_contract.346.d:0 "Северные договоры сведены в единую систему управления. Антолла, Фарейн и Химбер остаются под прямой властью Кефрейта: их сырьевые предприятия входят в собственную хозяйственную базу страны.\n\nПять остальных регионов переданы Северной договорной администрации со столицей в Килнете. Она сохраняет местные части и кадровый учёт; Кефрейт получает 15% гражданских и 30% военных заводов, доступ к строительству и льготную торговлю. Самостоятельная военная политика договором исключена."
 val_contract.346.a:0 "Утвердить единую администрацию."
 OCA:0 "Окцидская договорная администрация"
 OCA_DEF:0 "Окцидская договорная администрация"
 OCA_ADJ:0 "Окцидск."
 OCA_Contract_Council:0 "Временная административная коллегия"
 VAL_Occidian_Registries:0 "Перепись окцидских округов"
 VAL_Occidian_Registries_desc:0 "Временная администрация должна восстановить земельные книги, учёт предприятий и службу местных чиновников. Пока округа управляются отдельно, её коллегия подготовит их к включению в кефрейтскую систему."
 VAL_Integrate_Occidia:0 "Присоединение Окцидии"
 VAL_Integrate_Occidia_desc:0 "Переведём Балчанск, Гавань, Ливонин и Шахтёрский посёлок из переходного управления в прямое подчинение Кефрейту. Если довоенное соглашение с Шабратом по Ливонину уже исполнено, этот округ останется у Стеланда. На согласование земельных прав, заводских счетов и гарнизонного снабжения потребуется 35 дней после завершения переписи."
 VAL_occidian_administration_secured_tt:0 "Окцидская администрация подчинена Кефрейту, не капитулировала и находится в мире. Балчанск, Гавань и Шахтёрский посёлок принадлежат ей и полностью ею контролируются. Ливонин также находится в администрации либо уже передан Стеланду по довоенному соглашению."
 VAL_integrate_occidia_tt:0 "Балчанск, Гавань, Шахтёрский посёлок и удержанный Ливонин переходят в прямое владение и под контроль Кефрейта. Ливонин, уже переданный Стеланду по соглашению, не изымается. Если у временной администрации нет других владений, она упраздняется, а её войска передаются Кефрейту. Национальными территориями Кефрейта округа автоматически не становятся."
 VAL_create_occidian_administration:0 "Учредить временную администрацию Окцидии"
 VAL_create_occidian_administration_desc:0 "Закрепим переходное управление Балчанском, Гаванью, Ливонином и Шахтёрским посёлком. Перепись и последующая интеграция через фокусы позволят включить удержанные округа в Кефрейт."
 VAL_occidian_administration_ready_tt:0 "Балчанск, Гавань, Ливонин и Шахтёрский посёлок доступны для переходного управления. Чужая оккупация или продолжающаяся война откладывает передачу; мирный подчинённый Кефрейта может уступить округ только если после этого не исчезнет с карты. Интеграция ещё не завершена. Хотя бы один округ принадлежит стране с более чем одним регионом, позволяя безопасно учредить администрацию."
 VAL_occidian_administration_tt:0 "Балчанск, Гавань, Ливонин и Шахтёрский посёлок образуют Окцидскую договорную администрацию под властью Кефрейта. Довоенное соглашение может отдельно вернуть Ливонин Шабрату. Прямое присоединение удержанных округов станет доступно через фокусы «Перепись окцидских округов» и «Присоединение Окцидии»."

 VAL_contract_industry:0 "Контрактная промышленность"

 VAL_contract_industry_desc:0 "Арсеналы и гражданские подрядчики работают по общим производственным договорам. Вложения повышают отдачу существующих предприятий."

 VAL_economic_collapse:0 "Экономический крах"

 VAL_economic_collapse_desc:0 "Распад Воркерланда лишил Кефрейт заказов, платежей и привычных поставок. Заводы простаивают, строительство замерло, а бюджет продолжает оплачивать обязательства. Завершено антикризисных программ: [?VAL_economic_recovery_steps|0]/6. Штрафы снимаются промышленными фокусами и не исчезают со временем."

 VAL_economic_miracle:0 "Экономическое чудо"

 VAL_economic_miracle_desc:0 "Шесть программ восстановления вернули промышленности устойчивый выпуск, а бюджету — торговые доходы. Рост остаётся умеренным: новые договоры повышают эффективность действующих предприятий. Утраченные права на вестерхольмский металл требуют отдельной замены."

 VAL_economic_recovery_delta:0 "Ослабление экономического краха"

 VAL_arsenal_investment_delta:0 "Развитие контрактной промышленности"

 VAL_civilian_investment_delta:0 "Развитие гражданских подрядчиков"

 VAL_economic_miracle_unlock_tt:0 "Последняя из шести программ заменяет §YЭкономический крах§! на §GЭкономическое чудо§!. Накопленные вложения сохраняются."

 # --- Kefreyt post-defeat tree ---
 VAL_defeat_Returning_Columns:0 "Колонны возвращаются"
 VAL_defeat_Returning_Columns_desc:0 "Операция закончилась не переговорами и не выгодным контрактом, а отступлением. Колонны возвращаются без части людей, техники и прежней уверенности в том, что любой риск можно покрыть новой подписью. Сначала Кефрейт должен признать масштаб поражения."
 VAL_defeat_Commanders_Take_The_Ledger:0 "Командиры принимают реестр"
 VAL_defeat_Commanders_Take_The_Ledger_desc:0 "После падения кабинета Солгалова Совет командиров берёт под контроль армейские книги, склады и государственные счета. Его задача проста: не выиграть следующую войну, а не допустить распада страны после проигранной."
 VAL_defeat_Count_The_Remaining_Rifles:0 "Пересчитать оставшиеся винтовки"
 VAL_defeat_Count_The_Remaining_Rifles_desc:0 "После отхода важна не численность частей на бумаге, а то, сколько оружия действительно лежит на складах, сколько стволов можно починить и какие роты ещё способны держать строй."
 VAL_defeat_Reopen_The_Depots:0 "Открыть уцелевшие склады"
 VAL_defeat_Reopen_The_Depots_desc:0 "Запасы, которые раньше берегли для следующей экспедиции, теперь нужны заводам, железным дорогам и гарнизонам. Военная логистика должна снова работать на само государство."
 VAL_defeat_Articles_Of_Command:0 "Статьи военного управления"
 VAL_defeat_Articles_Of_Command_desc:0 "Совет командиров не должен превратиться в собрание конкурирующих штабов. Полномочия, ответственность за снабжение и право распоряжаться резервами будут записаны так же точно, как прежде записывались контракты."
 VAL_defeat_No_Second_Expedition:0 "Второго похода не будет"
 VAL_defeat_No_Second_Expedition_desc:0 "Повторить наступление только потому, что армия умеет наступать, значит повторить и поражение. Западная граница закрывается для новых авантюр, пока Кефрейт восстанавливает людей, промышленность и управление."
 VAL_defeat_Field_Hospitals_First:0 "Сначала полевые госпитали"
 VAL_defeat_Field_Hospitals_First_desc:0 "Врачи и эвакуационные команды получают приоритет раньше новых наступательных штабов. Страна слишком мала, чтобы снова считать потери обычной строкой в договоре."
 VAL_defeat_Bring_The_Captains_Home:0 "Вернуть капитанов домой"
 VAL_defeat_Bring_The_Captains_Home_desc:0 "Опытные командиры нужны не на чужих перевалах, а в гарнизонах, учебных центрах и на складах Кефрейта. Совет собирает рассеянные кадры обратно в единую систему."
 VAL_defeat_Contracts_Without_Conquest:0 "Контракты без завоеваний"
 VAL_defeat_Contracts_Without_Conquest_desc:0 "Кефрейт останется государством контрактов, но контракт больше не обязан заканчиваться колонной через чужую границу. Экспорт, производство и платные услуги должны снова приносить больше, чем оккупация."
 VAL_frontier_postwar_ready_tt:0 "Стеландские войны завершены; Кефрейт независим, не капитулировал и не выведен из регионального противостояния условиями поражения."
