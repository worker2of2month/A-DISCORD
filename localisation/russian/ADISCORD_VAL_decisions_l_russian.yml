 VAL_factory_cathedrals_drive: "Арсенальные соборы"
 VAL_factory_cathedrals_drive_desc: "Пока линии не остыли, военные заводы растут быстрее обычного."
 VAL_hot_production_lines: "Горячие линии"
 VAL_hot_production_lines_desc: "Непрерывный выпуск повышает потолок эффективности оружейных цехов."
 VAL_northern_roads_drive: "Северные дороги"
 VAL_northern_roads_drive_desc: "Караванные тракты и перевалы получают приоритет в строительных работах."
 VAL_APH_influence: "Ступень сети посредников в Антропофагоруме"
 VAL_ops_cin_contract: "Контракт с [CIN.GetNameDef]"
 VAL_ops_cin_contract_desc: "Выберем одно направление сотрудничества с [CIN.GetNameDef]. После оплаты посредник ответит через 21 день: согласие поднимет сеть на одну ступень, отказ вернёт казну. Одновременно можно вести только одну внешнюю операцию."
 VAL_ops_cin_contract_tt: "Откроется выбор семейства контракта. Цена: £political_power_texticon §Y10§! и £ADISCORD_economy_treasury_texticon §Y50§!. Через 21 день [CIN.GetName] примет или отклонит предложение. Отказ вернёт казну."
 VAL_ops_osf_contract: "Контракт с [OSF.GetNameDef]"
 VAL_ops_osf_contract_desc: "Выберем одно направление сотрудничества с [OSF.GetNameDef]. После оплаты посредник ответит через 21 день: согласие поднимет сеть на одну ступень, отказ вернёт казну. Одновременно можно вести только одну внешнюю операцию."
 VAL_ops_osf_contract_tt: "Откроется выбор семейства контракта. Цена: £political_power_texticon §Y10§! и £ADISCORD_economy_treasury_texticon §Y50§!. Через 21 день [OSF.GetName] примет или отклонит предложение. Отказ вернёт казну."
 VAL_ops_aph_contract: "Контракт в Антропофагоруме"
 VAL_ops_aph_contract_desc: "Выберем одно направление работы у Антропофагорума. После оплаты посредник ответит через 21 день: согласие поднимет сеть на одну ступень, отказ вернёт казну. Одновременно можно вести только одну внешнюю операцию."
 VAL_ops_aph_contract_tt: "Откроется выбор семейства контракта. Цена: £political_power_texticon §Y10§! и £ADISCORD_economy_treasury_texticon §Y50§!. Через 21 день Антропофагорум примет или отклонит предложение. Отказ вернёт казну."
 VAL_ops_family_market_tt: "Изучение рынка. При согласии сеть посредников вырастет на §Y1§! ступень, торговый доход - на §G2%§!."
 VAL_ops_family_arms_tt: "Оружейное посредничество. При согласии сеть посредников вырастет на §Y1§! ступень, торговый доход - на §G2%§!."
 VAL_ops_family_infra_tt: "Инфраструктурная концессия. При согласии сеть посредников вырастет на §Y1§! ступень, торговый доход - на §G2%§!."
 VAL_ops_family_captain_tt: "Наём местного капитана. При согласии сеть посредников вырастет на §Y1§! ступень, торговый доход - на §G2%§!."
 VAL_ops_family_terms_tt: "Отдельные условия. При согласии сеть посредников вырастет на §Y1§! ступень, торговый доход - на §G2%§!."
 val_contract.10.t: "Контракт для [CIN.GetNameDef]"
 val_contract.10.d: "В комнате над кефрейтской торговой конторой разложили пять папок. Одна касалась доступа к рынку, другая поставок оружия, третья дорог и складов, четвёртая местных капитанов, последняя условий долгосрочного присутствия. Посредник напротив не обещал ничего заранее. Он только перечислил людей, с которыми способен свести стороны.\n\nКефрейтские операции редко начинаются с флага или официальной миссии. Сначала появляется оплаченный знакомый, затем договор, затем человек, которому становится выгодно, чтобы следующий договор тоже прошёл через него. Выбрать нужно не цель всей политики, а дверь, в которую государство попробует войти первой."
