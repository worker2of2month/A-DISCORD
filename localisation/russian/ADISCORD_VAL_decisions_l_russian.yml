 VAL_Company_Mandates:0 "Представительство рот"
 VAL_Company_Mandates_desc:0 "Командиры продают военную службу, но не могут каждый раз заново торговаться о своих правах. Избранные представителями рот уполномоченные будут согласовывать общие требования с правительством. Единый порядок переговоров укрепит политическое влияние контрактного государства."
 VAL_Contract_Arbitration:0 "Контрактный арбитраж"
 VAL_Contract_Arbitration_desc:0 "Споры о жалованье и условиях службы не должны превращаться в неповиновение. Совместная арбитражная комиссия государства и рот получит право разбирать претензии и закреплять обязательные решения. Признание этих решений даст правительству устойчивую опору среди наёмников."

 VAL_Armored_Design_Bureau:0 "Конструкторское бюро бронетехники"
 VAL_Armored_Design_Bureau_desc:0 "Ротам нужны машины, рассчитанные на затяжную службу и ремонт вдали от заводов. Объединим инженеров оружейного комбината в отдельное бюро, которое займётся шасси, бронезащитой и вооружением новых танков."
 VAL_Serial_Armor_Production:0 "Серийное производство танков"
 VAL_Serial_Armor_Production_desc:0 "Каждая рота привыкла заказывать собственную машину, а затем искать к ней редкие запчасти. Общие стандарты узлов и долгосрочные заказы позволят заводам выпускать бронетехнику сериями и снизят стоимость каждой машины."
 VAL_Tank_Crew_School:0 "Школа танковых экипажей"
 VAL_Tank_Crew_School_desc:0 "Механику-водителю, наводчику и командиру нужно действовать как одному экипажу. Создадим учебную роту с полигоном: здесь будут готовить инструкторов и проверять новые машины до передачи в войска."
 VAL_Armored_Contract_Companies:0 "Бронетанковые контракты"
 VAL_Armored_Contract_Companies_desc:0 "Закрепим долгосрочные поставки танков для контрактной армии. Согласованные планы закупок позволят расширить серии, а договоры на обслуживание установят единые требования к запчастям и приёмке техники. Заводы смогут снижать стоимость машин без потери надёжности."
 VAL_armor_serial_production:0 "Серийное бронепроизводство"
 VAL_armor_serial_production_desc:0 "Единые узлы и устойчивые заказы снижают производственную стоимость разведывательных, боевых и тяжёлых бронеплатформ."
 VAL_armor_contract_production:0 "Контракты на бронетехнику"
 VAL_armor_contract_production_desc:0 "Серийные заказы, унифицированные запасные части и обязательная приёмка снижают стоимость бронеплатформ и повышают их надёжность."

 VAL_final_war:0 "Финальная война: [ROOT.VALGetFinalEnemy]"
 VAL_final_war_desc:0 "[ROOT.VALGetFinalPhase]\nНапряжение: §Y[?VAL_final_escalation|0]/100§!. В мирное время оно растёт на §R5§! в неделю. При 100 начинается война; переговоры снижают напряжение на 15. Другая война или незавершённый северный поход приостанавливают рост.\n\nСнабжение: [ROOT.VALGetFinalSupply]\nРазведка: [ROOT.VALGetFinalRecon]\nПри напряжении 25 открывается разведывательная подготовка, при 50 - расширение резервных контрактов. Подготовленные бонусы действуют до окончания кризиса и войны. При союзе Нодрула со Стеландером придётся победить обоих участников.\n\nБеженцев можно принять и обучить в категории «Люди и серые рынки». Каждая региональная кампания даёт до трёх волн; подготовка добровольцев занимает 35 дней."
 VAL_FINAL_ENEMY_COALITION:0 "Нодрул и Стеландер"
 VAL_FINAL_ENEMY_NOD:0 "Нодрул"
 VAL_FINAL_PHASE_PREPARING:0 "§YПодготовка к столкновению.§!"
 VAL_FINAL_PHASE_WAR:0 "§RВойна началась.§!"
 VAL_FINAL_PHASE_VICTORY:0 "§GФинальная кампания завершена победой.§!"
 VAL_FINAL_PHASE_CLOSED:0 "Кризис завершён. Временные военные приготовления сняты."
 VAL_FINAL_PHASE_WAITING:0 "Подготовка откроется после завершения северного похода, если Нодрул остаётся самостоятельным противником."
 VAL_FINAL_PREPARATION_READY:0 "§Gготово§!"
 VAL_FINAL_PREPARATION_MISSING:0 "не подготовлено"
 VAL_final_reduce_tension:0 "Возобновить переговоры с Нодрулом"
 VAL_final_reduce_tension_desc:0 "Ограниченные уступки и оплата посредников позволят выиграть три недели. Внутри страны переговоры воспримут как признак слабости."
 VAL_final_reduce_tension_tt:0 "Напряжение снизится на §G15§!. При обычном росте это даёт ещё три недели подготовки."
 VAL_final_register_reserves:0 "Составить реестр резервистов"
 VAL_final_register_reserves_desc:0 "За 28 дней военные комиссары переведут добровольческий набор на ограниченный призыв. Уже установленный более высокий закон не будет понижен. При отмене или самостоятельной смене закона политвласть возвращается."
 VAL_final_reserve_registration_tt:0 "Через §Y28 дней§! будет введён §Yограниченный призыв§!. При отмене или уже повышенном законе возвращается §Y150§! политвласти."
 VAL_final_stockpile_supplies:0 "Подготовить армейские склады"
 VAL_final_stockpile_supplies_desc:0 "Закупим и распределим запасы для длительной кампании. Подготовка занимает 35 дней и продолжится, если война начнётся раньше. При прекращении кризиса до доставки деньги возвращаются."
 VAL_final_supply_preparation_tt:0 "Через §Y35 дней§! расход снабжения армии снизится на §G10%§! до окончания кризиса и войны. При отмене возвращается §Y500§! монет."
 VAL_final_supply_ready_tt:0 "Расход снабжения армии: §G-10%§! до окончания кризиса и войны."
 VAL_final_reconnaissance:0 "Разведать направления наступления"
 VAL_final_reconnaissance_desc:0 "За 21 день штаб сведёт карты, данные агентуры и разведывательные донесения. Подготовка ускорит планирование и даст сведения об армии Нодрула. При отмене политвласть возвращается."
 VAL_final_reconnaissance_start_tt:0 "Через §Y21 день§!: армейские разведданные по Нодрулу §G+20§! и скорость планирования §G+15%§! до окончания кризиса и войны. При отмене возвращается §Y75§! политвласти."
 VAL_final_reconnaissance_ready_tt:0 "Скорость планирования: §G+15%§! до окончания кризиса и войны."
 VAL_final_expand_reserve_contracts:0 "Расширить резервные контракты"
 VAL_final_expand_reserve_contracts_desc:0 "Предложим срочные контракты тем, кто прежде не входил в действующий резерв. За 28 дней расширим мобилизационную базу на один процент населения. Набор продолжает действовать до окончания кризиса и войны, после чего чрезвычайные обязательства прекращаются."
 VAL_final_reserve_contracts_start_tt:0 "Через §Y28 дней§!: доля призывного населения §G+1,00 процентного пункта§! до окончания кризиса и войны. При отмене возвращается §Y100§! политвласти."
 VAL_final_reserve_contracts_ready_tt:0 "Доля призывного населения: §G+1,00 процентного пункта§! до окончания кризиса и войны."
 VAL_final_war_preparation:0 "Подготовка к финальной войне"
 VAL_final_war_preparation_desc:0 "Оплаченные склады, разведка и резервные контракты обеспечивают подготовку Кефрейта к противостоянию с Нодрулом. Временные бонусы прекращаются вместе с кризисом и войной."

 VAL_regional_administration_campaign:0 "Наладить гражданское управление во всех регионах"
 VAL_regional_administration_campaign_desc:0 "Единая программа для всех принадлежащих нам и подконтрольных ненациональных регионов, где подчиняемость ниже 60 или сопротивление не ниже 20. За 50 политической власти каждый подходящий регион сразу получает +15 подчиняемости и -10 сопротивления. Повторная программа доступна через 90 дней. Регионы с уже действующей программой интеграции не участвуют."

# Campaign briefing
 VAL_startup_country:0 "§YКЕФРЕЙТ§!\n\nКефрейт живёт контрактом, арсеналом и готовностью продавать силу. Оружейные заводы и наёмные компании дают ему влияние далеко за пределами границ, но каждая новая обязанность требует оплаты и снабжения.\n\nЗа промышленной мощью стоят слабая социальная опора, последствия прежних войн и собственные интересы командиров. Государству предстоит связать эти силы едиными обязательствами — или вновь уступить место частным договорённостям.\n\n§YПервые задачи§!\nУкрепляйте контрактную систему, проверяйте бюджет и потребности армии. На севере предстоит выбрать между торговым сближением и политикой давления. Производство оружия полезно лишь вместе с надёжными маршрутами и покупателями."
 VAL_startup_guide:0 "§YПлан Кефрейта§!\n\n§Y1. Соберите основу.§! $VAL_The_Contract_State$ -> $VAL_The_Weaponry_Baron$ -> $VAL_One_Ledger_One_Banner$ открывают главную систему. После этого выберите промышленную и армейскую специализацию.\n\n§Y2. Выберите северный курс.§! $VAL_Trading_Partners$ развивают обмен; $VAL_October_Of_2160$ усиливает давление. Эти ветки взаимоисключающие.\n\n§Y3. Считайте цену сделки.§! Перед экспортом проверьте казну, запасы оружия и свободный коридор. Проданное вооружение не пополнит ваши части, а занятый контрактный слот нельзя использовать повторно до его освобождения.\n\n§Y4. Переживите кризис Стеландера.§! В ветке кризиса выберите один курс: оружие сопротивлению, северный поход или сохранение арсеналов. После $VAL_The_Steel_Contract$ откроется послевоенная линия.\n\n§Y5. Откройте послевоенные решения.§! $VAL_Contracts_Outlive_Kings$ -> $VAL_frontier_conference$ -> логистика и одна из двух администраций -> $VAL_frontier_security_plan$ открывают северный ультиматум. После поражения Нодрула его отдельная война с Бежайском закрывается в рамках кефрейтского договора; капитуляция Бежайска нужна только для его собственного послевоенного исхода. Южная линия начинается с $VAL_Return_Southern_Tsaygen$, затем выходит за Периметр через $VAL_frontier_return_irem$. Дальнейшие южные и восточные операции требуют контроля нужных регионов.\n\n§YКоротко§!: экономика оплачивает контракты, армия удерживает их результат, а рабочие коридоры решают, дойдёт ли поставка."
 VAL_startup_path_0_title:0 "Торговые партнёры"
 VAL_startup_path_1_title:0 "Октябрь 2160-го"
 VAL_startup_path_0:0 "§YТОРГОВЫЕ ПАРТНЁРЫ§!\n\nРасширяйте северное влияние через торговые связи и контрактные институты. Этот выбор укрепляет экономическую сторону сотрудничества и ведёт к дальнейшей работе с северными соседями.\n\nМаршрут подходит для последовательного расширения возможностей государства через оборот, производство и оплаченные операции. Он не означает автоматического мира со всеми соседями.\n\nВыбор закрывает альтернативную северную ветку «Октябрь 2160-го»."
 VAL_startup_path_1:0 "§YОКТЯБРЬ 2160-ГО§!\n\nПодкрепите контрактную политику силой и готовностью к давлению на севере. Выбор усиливает военную составляющую курса, сохраняя необходимость снабжать части и оплачивать последующие операции.\n\nЭта ветка не заменяет сюжетные условия объявления войны: конкретные действия доступны через свои фокусы, решения и события.\n\nВыбор закрывает альтернативную северную ветку «Торговые партнёры»."
 VAL_startup_path_0_details:0 "§YТОРГОВЛЯ: КАК ОТКРЫВАЕТСЯ ВЕТКА§!\n\nПосле фокуса «Северные торговые маршруты» выберите «Торговые партнёры». Альтернативный «Октябрь 2160-го» станет недоступен.\n\nОбщий фокус «Разные взгляды на свободу» определяет условия будущего сотрудничества с Фронтиром. Компромисс предлагает ему обе юборские администрации, жёсткий курс - только Исхайт, сохраняя Дучебию за Кефрейтом. Фронтир отвечает самостоятельно; предварительное согласие облегчает последующие военные переговоры.\n\nВоенный договор предлагается отдельно после «Северного урегулирования». Участие в стеландерской гражданской войне определяется собственной сюжетной цепочкой."
 VAL_startup_path_1_details:0 "§YДАВЛЕНИЕ: КАК ОТКРЫВАЕТСЯ ВЕТКА§!\n\nПосле фокуса «Северные торговые маршруты» выберите «Октябрь 2160-го». Он исключает «Торговых партнёров» и даёт артиллерию и поддержку войны.\n\nВ общем фокусе «Разные взгляды на свободу» можно настоять на сохранении Дучебии за Кефрейтом, предложив Фронтиру только Исхайт. Согласовать такой раздел сложнее. Доступен и компромисс с передачей обеих администраций: предыдущая ветка не навязывает ответ.\n\nЭто предварительные переговоры. Вступление Фронтира в войну требует отдельного соглашения после «Северного урегулирования». Отказ оставляет риск послевоенных требований к обеим администрациям."
 VAL_Balchansk_Charter:0 "Балчанская хартия"
 VAL_Balchansk_Charter_desc:0 "Закрепим самостоятельное договорное управление Балчанска вместо прямого присоединения Окцидии. Администрация получит собственную хартию и политический ресурс; Кефрейт сохранит транзитные договоры. Этот путь исключает прямую интеграцию."
 VAL_Balchansk_Clearing_House:0 "Балчанская расчётная палата"
 VAL_Balchansk_Clearing_House_desc:0 "Общая расчётная палата свяжет Балчанскую администрацию с кефрейтскими арсеналами и торговыми конторами. Администрация получит хозяйственный институт, а Кефрейт - промышленный исследовательский бонус и политический ресурс."

 VAL_defer_northern_expansion:0 "Отложить северную экспансию"
 VAL_defer_northern_expansion_desc:0 "Пограничные приобретения не должны останавливать торговлю и восстановление. Отложим поход против северных племён и продолжим работу через возвращение покупателей и внешние расчёты. К северному ультиматуму можно вернуться позднее."
 VAL_defer_northern_expansion_ready_tt:0 "План пограничной безопасности завершён; Кефрейт независим, не капитулировал и не воюет. Нет активного пограничного ультиматума, кампании или мобилизации. Северное соглашение ещё не заключено."
 VAL_defer_northern_expansion_tt:0 "Фокус «$VAL_frontier_treaty_offices$» будет пропущен без его наград. Экономическое восстановление можно продолжить после фокусов «$VAL_Returning_Buyers$» и «$VAL_Contingency_Ledgers$». Дипломатия со Стеландером остаётся доступной, но отдельный поход на Нодрул потребует вернуться к северной экспансии и закрепить племенной плацдарм. Обход не даёт территорий, ресурсов, военных наград или права провозгласить новое государство. Новый северный ультиматум отменяет этот выбор."
 VAL_northern_expansion_deferred_tt:0 "Северная экспансия явно отложена; план пограничной безопасности завершён, нет войны, активного ультиматума или мобилизации."
 VAL_economic_settlement_ready_tt:0 "Выполнены реальные цели военной кампании либо северная экспансия отложена и завершены «$VAL_Returning_Buyers$» и «$VAL_Contingency_Ledgers$» при независимом мирном Кефрейте."

 VAL_defeat_Revise_The_Settlement: "Пересмотреть условия мира"
 VAL_defeat_Revise_The_Settlement_desc: "Совет может принять поражение и отказаться от нового похода — либо объявить условия мира временными. Реванш потребует восстановленных складов, перевооружённых частей и возвращения командиров. Новое поражение обернётся уже не сменой правительства, а потерей независимости Кефрейта."
 VAL_defeat_Refit_For_Return: "Перевооружить вернувшиеся части"
 VAL_defeat_Refit_For_Return_desc: "Повторный поход нельзя начинать с теми же пустыми складами. Восстановленные арсеналы передадут оружие полевым частям, а командиры пересмотрят подготовку с учётом поражения в горах."
 VAL_defeat_Return_To_The_Passes: "Вернуться к перевалам"
 VAL_defeat_Return_To_The_Passes_desc: "Подготовка завершена. Совет отдаёт приказ о новой войне против Стеландера Шабрата. Победа подчинит Стеландер контрактной администрации; поражение позволит Шабрату полностью присоединить Кефрейт. Второго ограниченного мира не будет."
 VAL_council_revanche_available_tt: "После поражения Кефрейтом правит независимый Совет командиров. Шабрат по-прежнему возглавляет независимый Стеландер; обе страны не капитулировали и не состоят в одном альянсе."
 VAL_council_revanche_launch_available_tt: "Совет и Стеландер Шабрата остаются независимыми противниками. Кефрейт не ведёт войн; завершены пересмотр мира, перевооружение, возвращение командиров, подготовка горной кампании, арсеналов и запасов для второго похода."
 VAL_council_revanche_stakes_tt: "§YОткрывается путь подготовки реванша против Стеландера.§!\n§RПри повторном поражении Шабрат полностью аннексирует Кефрейт.§! Мирный путь «Второго похода не будет» станет недоступен."
 VAL_council_revanche_war_tt: "§RКефрейт объявит войну Стеландеру Шабрата.§!\n§YПобеда Кефрейта:§! подчинённая контрактная администрация в Стеландере.\n§RПобеда Шабрата:§! полная аннексия Кефрейта вместо ограниченного мира."

 VAL_defeat_Rebuild_The_Registry: "Восстановить гражданский реестр"
 VAL_defeat_Rebuild_The_Registry_desc: "Совет унаследовал страну, а не только остатки экспедиционной армии. Восстановленный гражданский реестр позволит национализировать удерживаемые пограничные регионы и после смены правительства."
 VAL_defeat_Repair_The_Workshops: "Вернуть станки в работу"
 VAL_defeat_Repair_The_Workshops_desc: "Поставить ремонт и гражданские заказы выше новой экспедиции. Вложения в гражданскую промышленность сохранятся при дальнейшем выборе политики Совета."
 VAL_defeat_Restore_Freight_Routes: "Восстановить грузовые маршруты"
 VAL_defeat_Restore_Freight_Routes_desc: "Армии и мастерским нужны одни и те же дороги. Начнём с участка собственной транспортной сети, нуждающегося в развитии; полностью развитая сеть высвободит средства для управления."
 VAL_defeat_Veterans_Register: "Учёт вернувшихся ветеранов"
 VAL_defeat_Veterans_Register_desc: "Установить судьбу рассеянных подразделений, восстановить личные дела и вернуть годных ветеранов в организованный резерв. Поддержка семей укрепит доверие к Совету."
 VAL_defeat_Staff_College: "Штабная школа Совета"
 VAL_defeat_Staff_College_desc: "Собрать опыт поражения в программу штабной подготовки. Её выпускники будут полезны и оборонительной армии, и новому походу — без привязки к личной судьбе Шабрата."
 VAL_defeat_Civilian_Contracts: "Гражданские контракты"
 VAL_defeat_Civilian_Contracts_desc: "Заказ должен оплачиваться поставкой, а не новой оккупацией. Расширим гражданское производство и направим доходы на внутреннее восстановление."
 VAL_defeat_Technical_Institute: "Институт прикладных технологий"
 VAL_defeat_Technical_Institute_desc: "Часть штабной и заводской подготовки должна работать на мирные исследования. Институт объединит инженеров и инструкторов в постоянную исследовательскую программу."
 VAL_defeat_Mountain_Exercises: "Разбор горной кампании"
 VAL_defeat_Mountain_Exercises_desc: "Недостаточно заменить потерянные винтовки. Подготовка должна учесть горные проходы, разрыв колонн и взаимодействие с инженерными частями."
 VAL_defeat_Frontline_Arsenals: "Арсеналы второго похода"
 VAL_defeat_Frontline_Arsenals_desc: "Реванш не должен держаться на одноразовой выдаче оружия. Подготовим устойчивую промышленную базу для вооружения и пополнения полевых частей."
 VAL_defeat_Supply_For_The_Return: "Запасы для возвращения"
 VAL_defeat_Supply_For_The_Return_desc: "До приказа о войне накопим оружие, артиллерию и имущество обеспечения. Совет не отправит части к перевалам, пока не завершены транспортная и штабная программы."
 VAL_defeat_Recovered_State: "Устойчивое управление"
 VAL_defeat_Recovered_State_desc: "Независимо от выбранного внешнего курса Совет должен завершить внутреннее восстановление. После окончания войн транспорт, гражданский учёт и промышленность будут работать по единому бюджету."
 VAL_council_recovery_available_tt: "После поражения у власти остаётся Совет командиров; Кефрейт независим и не капитулировал."
 VAL_council_recovered_state_available_tt: "Совет командиров управляет независимым Кефрейтом; страна не капитулировала и больше не участвует в войнах."
 VAL_raise_mountain_contractors_tt: "Будут развёрнуты §Y2 горнострелковые дивизии§! по §Y6300 человек§! в одном из принадлежащих нам подконтрольных регионов. Каждая состоит из §Y6 горнострелковых батальонов§! и инженерной роты, с §Y100%§! личного состава и оснащения. Люди и снаряжение входят в награду и не списываются из свободных резервов. Шаблон закреплён, обычный набор разрешён. Выдача однократная."
 VAL_raise_reserve_battalions_tt: "Будут развёрнуты §Y2 резервные пехотные дивизии§! по §Y6300 человек§! в одном из принадлежащих нам подконтрольных регионов. Каждая состоит из §Y6 пехотных батальонов§! и инженерной роты, с §Y100%§! личного состава и оснащения. Люди и снаряжение входят в награду и не списываются из свободных резервов. Шаблон закреплён, обычный набор разрешён. Выдача однократная."
 VAL_contract_service: "Служба по контракту"
 VAL_contract_service_desc: "Армию Кефрейта комплектуют оплачиваемые добровольцы. Контракт определяет срок службы, жалованье и обязанности бойца; постоянные кадры ускоряют подготовку операций и восстановление боеспособности рот, а опыт службы сокращает небоевые потери. Такой порядок даёт профессиональную армию, но ограничивает круг доступных новобранцев."
 VAL_contract_service_locked_tt: "Служба по контракту может быть заменена только фокусом или событием."

 VAL_partner_contract:0 "Особое соглашение: [FROM.GetName]"
 VAL_partner_contract_desc:0 "Доступные особые соглашения с выбранным партнёром: военный подряд, советники, помощь, ресурсные концессии или транзит. В меню показаны только подходящие этой стране варианты. Найм, торговые договоры и поставки оформляются отдельными решениями."
 VAL_partner_menu_tt:0 "Открыть доступные партнёру особые соглашения: военные услуги, помощь, ресурсы и транзит."
 VAL_partner_trade:0 "Заключить торговый договор - £pol_power 100"
 VAL_partner_arms:0 "Продать 25000 винтовок"
 VAL_partner_hire:0 "Нанять местных добровольцев"
 VAL_partner_trade_tt:0 "Цена Кефрейту: £pol_power 100 при согласии партнёра. Срок: 365 дней. Недельный доход Кефрейта: [VALMarketQuoteIncome]; партнёра: 1. Без автопродления. Война или капитуляция прекращает доход досрочно; плата не возвращается."
 VAL_partner_hire_tt:0 "Кефрейт оплачивает наём, партнёр передаёт людей из своего резерва: Пепельное племя и Культ Детей Леса — £manpower_texticon §Y3000§! за £ADISCORD_economy_treasury_texticon §Y300§!; Союз костоломов и Вольный Фронтир — §Y4000§! за §Y400§!; Антропофагорум — §Y2000§! за §Y200§!; Юборская Народная Республика — §Y5000§! за §Y500§!. Повторный наём у той же страны — через §Y180 дней§!."
 VAL_partner_offer_unavailable_tt:0 "Сейчас предложение недоступно: проверьте казну, запасы, экспортное место и действующие переговоры."
 VAL_partner_trade_accepted_tt:0 "Договор даёт нам 1 казны в неделю в течение 365 дней. [VALTradeFeeTerms] Автопродления нет."
 VAL_partner_hire_accepted_tt:0 "Передать Кефрейту 5000 добровольцев из нашего резерва и получить 500 казны. Расчёт состоится только при сохранении условий сделки."
 VAL_partner_market_income:0 "Доход от торгового договора"
 VAL_partner_market_income_desc:0 "Годовой торговый договор с Кефрейтом приносит 1 казну в неделю до истечения срока или досрочного прекращения."
 VAL_Bulk_Arms_Contracts:0 "Оптовые оружейные контракты"
 VAL_Bulk_Arms_Contracts_desc:0 "Перейдём от отдельных поставок к вооружению целых соединений. Контора сможет предлагать покупателям 50000 винтовок за 1000 казны. Каждая партия требует реального запаса и согласия покупателя."
 VAL_Army_Arsenal_Orders:0 "Заказы для армейских арсеналов"
 VAL_Army_Arsenal_Orders_desc:0 "Крупные армии закупают оружие для пополнения потерь и мобилизации. Откроем заказы на 100 000 винтовок за 2250 казны. Договоры используют обычные экспортные места."
 VAL_Strategic_Arms_Exports:0 "Стратегические поставки оружия"
 VAL_Strategic_Arms_Exports_desc:0 "Государственный заказ на перевооружение позволяет арсеналам продавать партии по 200 000 винтовок за 5000 казны. Покупатель должен располагать полной суммой; Кефрейт — полной партией. При отказе оружие остаётся на складах."
 VAL_Market_Roads_North_desc:0 "Откроем переговоры с Пепельным племенем, Союзом костоломов, Антропофагорумом, Культом Детей Леса, Вольным Фронтиром и Юборской Народной Республикой. Представительства принесут недельный доход, местные добровольцы пополнят резерв. Продажа оружия станет доступна после лицензирования посредников."
 val_contract.361.t:0 "Особые соглашения: [VALMenuPartnerName]"
 val_contract.361.d:0 "Контора подготовила три разных предложения. Годовое торговое представительство стоит 200 казны и приносит недельный доход в течение 365 дней. Оружейный заказ продаёт 25000 винтовок за 500 казны. Наём переводит реальных добровольцев из резерва партнёра в наш.\n\nУсловия зависят от страны; в подсказках указаны полные суммы. Недоступные предложения не показываются. Партнёр вправе отказаться. При отказе или отсутствии ответа ресурсы остаются у владельцев."
 val_contract.362.t:0 "Предложение Кефрейта"
 val_contract.362.d:0 "Кефрейт предлагает торговый договор на 365 дней. Наш доход составит 1 казны в неделю. Война или капитуляция прекращает доход досрочно. [VALTradeFeeTerms]\n\nПредложение действует 35 дней. Отсутствие ответа означает отказ. Автопродления договора нет."
 val_contract.364.t:0 "Предложение Кефрейта"
 val_contract.364.d:0 "Кефрейт предлагает 500 казны за 5000 добровольцев из нашего свободного резерва. Деньги и люди передаются одновременно после согласия.\n\nПредложение действует 35 дней. При отказе или срыве условий зарезервированные деньги возвращаются Кефрейту."
 VAL_partner_arms_tt:0 "Предложить покупателю £infantry_equipment_texticon §Y25000§! винтовок за £ADISCORD_economy_treasury_texticon §G500§!. После согласия деньги переходят Кефрейту, оружие отправляется с его склада. Сделка занимает одно экспортное место на §Y14 дней§!. До согласия ресурсы не списываются."
 VAL_partner_arms_accepted_tt:0 "Мы платим Кефрейту £ADISCORD_economy_treasury_texticon §Y500§! и получаем £infantry_equipment_texticon §G25000§! винтовок из его запасов. Сумма и объём не меняются при завершении новых фокусов. Отправка использует обычный механизм передачи снаряжения."
 VAL_export_arms_order:0 "Продать 25000 винтовок: [FROM.GetName]"
 VAL_export_arms_order_desc:0 "$VAL_partner_arms_tt$"
 val_contract.363.t:0 "Кефрейт: партия из 25000 винтовок"
 val_contract.363.d:0 "Кефрейт предлагает поставить 25000 винтовок за 500 казны. Это оружие из его действующих запасов. Согласие оплачивает всю партию и запускает её передачу; повторная проверка казны и складов не допускает неполной сделки.\n\nПредложение действует 35 дней. При отказе или отсутствии ответа деньги остаются в нашей казне, оружие — у продавца."
 VAL_partner_bulk_tt:0 "Предложить покупателю £infantry_equipment_texticon §Y50000§! винтовок за £ADISCORD_economy_treasury_texticon §G1000§!. После согласия деньги переходят Кефрейту, оружие отправляется с его склада. Сделка занимает одно экспортное место на §Y14 дней§!. До согласия ресурсы не списываются."
