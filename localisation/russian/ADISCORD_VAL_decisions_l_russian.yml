 VAL_military_terms_tt:0 "Требуется фактическое участие: минимум две добровольческие дивизии либо участие на одной стороне согласованной войны. Заказчик резервирует 500 казны: 125 за начало службы, 375 за успех. Цена Кефрейта: 25 командного ресурса. При неуспехе премия возвращается заказчику. Истечение договора не выводит страну из войны."
