 VAL_market_menu_desc:0 "Партнёр: [VALMenuPartnerName].\n\nГодовой торговый договор оформляется отдельным решением «Торговый договор» стоимостью 100 политвласти.\n\nЗдесь можно нанять добровольцев: люди переходят из резерва партнёра за казну. Численность, цена и причины недоступности указаны при наведении."

 VAL_weapons_menu_desc:0 "Партнёр: [VALMenuPartnerName].\n\nГотовая партия - разовая продажа за полную оплату. Квартальный договор - четыре поставки за год; оформление стоит 100 политвласти. Аванса и пассивного дохода нет. Покупателю не обязательно воевать.\n\nКвартальные поставки: [VALOrderMenuStatus]"

 VAL_ready_menu_desc:0 "Готовые партии: 25000 / 50000 / 100000 / 200000 винтовок за 500 / 1000 / 2250 / 5000 казны. Покупатель получает оружие, Кефрейт - оплату.\n\nНужны открывающий фокус, свободное место, запас оружия и деньги покупателя. Недоступные партии скрыты. Крупные партии вынесены на следующую страницу."

 VAL_orders_menu_desc:0 "Партнёр: [VALMenuPartnerName].\n\n[VALOrderMenuStatus]\n\nЦена договора: £pol_power 100 при согласии покупателя. Четыре поставки за год, без аванса. Оплата только при отгрузке. Первая партия - за 90 дней; досрочная отгрузка не открывает следующий квартал. При срыве срока даётся 15 дней отсрочки, затем договор расторгается. Размер и цена каждой партии указаны в предложении."

 VAL_support_menu_desc:0 "Партнёр: [VALMenuPartnerName].\n\nВоенные заказы и услуги оплачиваются через контракты и казну покупателя. Ресурсные соглашения доступны выбранной стороне войны.\n\nТранзитное соглашение открывает доступ через узлы партнёра после двух исполненных договоров. Оно не передаёт земли."
 VAL_concessions_menu_desc:0 "Ресурсные соглашения требуют соответствующего фокуса, активной войны за ресурсный узел и выбора стороны. Оплата политической властью открывает отдельные переговоры с Намалском или Эфлором."
 VAL_orders_locked_focus:0 "Сначала завершите фокус, открывающий экспортные лицензии."

 VAL_orders_no_destination:0 "Для этого партнёра нет производственного коридора. Доступны готовые поставки или ресурсное соглашение."

 VAL_orders_invalid_partner:0 "Заказ недоступен из-за войны, капитуляции, выбора стороны или долга этому партнёру."

 VAL_orders_closed_route:0 "Торговый коридор к партнёру не работает. Откройте путь в разделе торговых путей."

