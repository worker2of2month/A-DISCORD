l_russian:
 VAL_livonn_settlement_category: "Судьба Ливонинского округа"
 VAL_livonn_settlement_category_desc: "После разгрома горных республик Кефрейт установил военную администрацию и в §Y[45.GetName]§!. Довоенный договор с Шабратом предусматривал передачу округа сопротивлению. Теперь Кефрейт должен решить, считать ли подпись обязательством после победы."
 VAL_honor_livonn_agreement: "Соблюсти договор с Шабратом"
 VAL_honor_livonn_agreement_desc: "Передать §Y[45.GetName]§! стороне Шабрата, как было обещано до вмешательства. Остальные территории, занятые Кефрейтом по итогам кампании, останутся под нашим контролем."
 VAL_keep_livonn: "Оставить Ливонин Кефрейту"
 VAL_keep_livonn_desc: "Объявить довоенную договорённость утратившей силу. §Y[45.GetName]§! останется под администрацией Кефрейта."
