 vorkernsberg: "Воркенсберг"
 vorkernsberg_desc: "Плотная городская конгломерация с многоярусной застройкой, транспортными развязками и промышленными кварталами. Манёвр здесь затруднён, а оборона опирается на инфраструктуру города."
 contaminated: "Заражённая зона"
 contaminated_desc: "Местность, заражённая опасными химическими и радиоактивными веществами. Разрушенные дороги, необходимость в защитном снаряжении и постоянная угроза облучения резко затрудняют передвижение, снабжение и ведение боевых действий."
 water_strongest_current: "Сильнейшее течение"
 water_strongest_current_desc: "Неумолимое течение от полюса до полюса, рвущееся между западным и центральным континентами. Веками оно разбивало или уносило любой корабль, пытавшийся пересечь его, поэтому берега так и не встретились. Флотам здесь трудно держать строй и замечать противника, зато дрейфующие мины уносит течением."
# END CONSOLIDATED: ADISCORD_terrain_l_russian.yml
 reactor_zone: "Реакторная зона"
 reactor_zone_desc: "Когда-то здесь находился промышленный центр Воркерланда: огромные заводские комплексы питались энергией реактора нулевой точки. Теперь над мёртвыми цехами возвышаются руины разрушенного реактора. Почва, вода и воздух настолько отравлены выбросами из его разорванного ядра, что проникновение в реакторную зону означает мгновенную смерть. Здесь невозможно ни жить, ни вести работы, ни провести войска: бывшее сердце промышленности превратилось в непроходимую мёртвую землю."
 desert_city: "Пустынный город"
 desert_city_desc: "Низкая плотная застройка из глины и песчаника вокруг колодцев и рынков. Открытые песчаные подступы почти не дают укрытия наступающим, а жара и нехватка воды изматывают гарнизоны, зато город остаётся узлом караванных дорог."
 hill_city: "Холмистый город"
 hill_city_desc: "Каменные кварталы террасами поднимаются по склонам холмов, улицы превращаются в лестницы и узкие подъёмы. Каждый штурм идёт в гору, технике негде развернуться, а защитники держат высоты над соседними кварталами."
 fada_city: "Фада"
 fada_city_desc: "Столица Стеландера спускается от гор к морю: Бронзовый конгресс, площади и набережные окружены тяжёлыми каменными зданиями. Столичная гвардия держит каждый квартал, а широкие подъездные пути связывают город с портом и провинциями."
 dopotoydron_city: "Допотойдрон сити"
 dopotoydron_city_desc: "Столица Кефрейта выросла вокруг оружейного комбината: цеха, склады и сортировочные станции тянутся на многие кварталы. Между корпусами проходит техника, запасы надёжно укрыты, но огромные заводские крыши хорошо видны с воздуха."
 south_harbour_city: "Южная гавань"
 south_harbour_city_desc: "Портовая столица Светлогорского наместничества на пустынном берегу. Причалы, маяк и склады держат снабжение даже под обстрелом, но низкая набережная почти не даёт укрытия, а жара изматывает гарнизоны."
 svetlogorye_town: "Светлогорский город"
 svetlogorye_town_desc: "Невысокие нефтяные города среди сухих холмов. Кварталы разбросаны вокруг промыслов и труб, улицы открыты ветру и пыли, а длинные дороги между посёлками изнашивают транспорт."
 kefreyt_city: "Кефрейтский город"
 kefreyt_city_desc: "Тесные кварталы доходных домов, где автобусы, грузовики и толпы стоят в одной пробке. Технике негде развернуться, а защитники прячутся в каждом дворе и подворотне."
 stelander_city: "Стеландерский город"
 stelander_city_desc: "Старые города Стеландера взбираются по склонам: лестницы, террасы и узкие крутые улицы. Каждый штурм идёт в гору, а защитники держат верхние кварталы над наступающими."
 rich_city: "Богатый город"
 rich_city_desc: "Бульвары, пассажи и каменные фасады богатых городов Нодрула и Стеландера. Широкие проспекты открывают фронт для наступления, но массивная застройка по-прежнему укрывает защитников от авиации."
