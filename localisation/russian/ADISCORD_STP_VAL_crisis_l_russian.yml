 val_contract.411.b: "$val_contract.410.b$"
 val_contract.420.t: "Кефрейт предлагает северное соглашение"
 val_contract.420.d: "Вместо нового фронта предлагается временное договорное сосуществование."
 val_contract.420.a: "Принять прагматичное соглашение"
 val_contract.420.b: "Отвергнуть сделку"
 val_contract.430.t: "Два срока сталкиваются"
 val_contract.430.d: "Северная кампания не закончена, но окончательный счёт Стеландеру уже наступил."
 val_contract.430.a: "Закрыть северную кампанию сценарием"
