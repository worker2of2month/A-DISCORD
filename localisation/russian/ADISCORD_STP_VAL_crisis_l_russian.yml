 NOD_support_stp_full: "Защитить нодрулский мандат"
 NOD_support_stp_full_desc: "Вступить в войну на стороне подконтрольного аппарата, если армия и перевалы позволяют рискнуть."

 STP_Crisis_Rally_The_Provinces: "Поднять провинции"
 STP_Crisis_Rally_The_Provinces_desc: "Собрать политический и людской резерв там, где центральная власть уже раскололась."
 STP_Crisis_Secure_The_Depots: "Взять склады под охрану"
 STP_Crisis_Secure_The_Depots_desc: "Не дать противнику превратить довоенные запасы в мгновенное преимущество."
 STP_Crisis_Hold_The_Capital_Road: "Удержать столичную дорогу"
 STP_Crisis_Hold_The_Capital_Road_desc: "Контроль дороги определит, смогут ли подкрепления пройти между горами и столицей."
 STP_Crisis_Request_External_Supplies: "Запросить внешние поставки"
 STP_Crisis_Request_External_Supplies_desc: "Обратиться к уже подготовленным партнёрам, принимая политическую цену их помощи."
 STP_Shabrat_Count_The_Surviving_Regiments: "Пересчитать уцелевшие полки"
 STP_Shabrat_Count_The_Surviving_Regiments_desc: "Победа не отменяет потерь: новая власть должна узнать, какие части ещё существуют."
 STP_Shabrat_Open_The_Archives: "Открыть архивы режима"
 STP_Shabrat_Open_The_Archives_desc: "Доказательства преступлений аппарата дадут легитимность, но раскроют слишком многих соучастников."
 STP_Shabrat_Break_The_Mandate: "Разорвать нодрулский мандат"
 STP_Shabrat_Break_The_Mandate_desc: "Убрать последние формы внешнего контроля перед неизбежной войной с Кефрейтом."
 STP_Shabrat_Buy_The_Desert_Season: "Купить сезон в пустыне"
 STP_Shabrat_Buy_The_Desert_Season_desc: "Временно рассчитаться с Кефрейтом уступками и выиграть время для восстановления."
 STP_Shabrat_Fortify_The_Resource_Road: "Укрепить ресурсную дорогу"
 STP_Shabrat_Fortify_The_Resource_Road_desc: "Подготовить регионы 45 и 88 к удару, который Кефрейт всё равно нанесёт."
 STP_Sotnikov_The_Military_Committee: "Военный комитет Сотникова"
 STP_Sotnikov_The_Military_Committee_desc: "Переходная власть будет опираться на командование, пока гражданские институты не восстановлены."
 STP_Sotnikov_Rebuild_The_General_Staff: "Восстановить генеральный штаб"
 STP_Sotnikov_Rebuild_The_General_Staff_desc: "Свести разрозненные штабы и фронтовые группы в единую систему приказов."
 STP_Sotnikov_Arm_The_Northern_Passes: "Вооружить северные перевалы"
 STP_Sotnikov_Arm_The_Northern_Passes_desc: "Не позволить Нодрулу или его соседям воспользоваться послевоенной слабостью."
 STP_Sotnikov_War_On_Two_Maps: "Война на двух картах"
 STP_Sotnikov_War_On_Two_Maps_desc: "Один штаб следит за Кефрейтом, другой — за реакцией Нодрула и северных стран."
 STP_Hedersett_The_Party_After_The_Father: "Партия после Отца"
 STP_Hedersett_The_Party_After_The_Father_desc: "Хедерсетт должен доказать, что аппарат способен жить без голоса и подписи Иванова."
 STP_Hedersett_End_The_Lists: "Закрыть старые списки"
 STP_Hedersett_End_The_Lists_desc: "Прекратить бесконечные проверки, чтобы вернуть управляемость уцелевшим учреждениям."
 STP_Hedersett_One_Last_Purge: "Последняя чистка"
 STP_Hedersett_One_Last_Purge_desc: "Устранить тех, кого аппарат не сможет контролировать во время внешней войны."
 STP_Hedersett_Renew_The_Nodrul_Mandate: "Обновить нодрулский мандат"
 STP_Hedersett_Renew_The_Nodrul_Mandate_desc: "Сохранить внешнюю опору ценой автономии и обязательств перед Нодрулом."
 STP_Hedersett_Pay_The_Deferred_Invoice: "Оплатить отсроченный счёт"
 STP_Hedersett_Pay_The_Deferred_Invoice_desc: "Заключить временный контракт с Кефрейтом и отложить войну ради восстановления."
 STP_Hedersett_Rebuild_The_Festival_Army: "Восстановить фестивальную армию"
 STP_Hedersett_Rebuild_The_Festival_Army_desc: "Превратить прежние внутренние силы порядка в соединения для защиты границы."

 VAL_Offer_The_Mountain_Contract: "Предложить горный контракт"
 VAL_Offer_The_Mountain_Contract_desc: "Войти в гражданскую войну как временный союзник за уступки, права и более поздний окончательный расчёт."
 VAL_Secure_The_Resource_Corridor: "Закрепить стеландские поставки"
 VAL_Secure_The_Resource_Corridor_desc: "Вместо сомнительной войны за коридор Кефрейт вложит деньги и оружие в местных контролёров, способных обеспечить временный доступ к металлу."
 VAL_Negotiate_The_Deferred_Invoice: "Обсудить отсроченный счёт"
 VAL_Negotiate_The_Deferred_Invoice_desc: "Дать победителю короткую передышку за реальные договорные уступки."
 VAL_Let_Nodrul_Bleed: "Пусть Нодрул истечёт кровью"
 VAL_Let_Nodrul_Bleed_desc: "Не вмешиваться преждевременно и позволить соседним войнам истощить защитника Стеландера."
 VAL_Present_The_Final_Invoice: "Предъявить окончательный счёт"
 VAL_Present_The_Final_Invoice_desc: "Завершить подготовку к войне, не создавая дополнительного таймера и не отменяя действующий срок."

 STP_fading_father: "Угасающий Отец мира"
 STP_fading_father_desc: "Эффекты меняются вместе с канонической стадией здоровья Иванова."
 STP_underground_network: "Подпольная сеть"
 STP_underground_network_desc: "Сила духа зависит от готовности сопротивления, а не от постоянного набора статичных бонусов."
 STP_security_pressure: "Давление служб безопасности"
 STP_security_pressure_desc: "Чем выше подозрение, тем дороже ошибки и тяжелее действовать скрытно."
 VAL_contract_state: "Контрактное государство"
 VAL_contract_state_desc: "Параметры государства определяются авторитетом контрактной системы. Выбранные производственные, доктринальные, социальные и внешнеполитические специализации напрямую меняют показатели этого духа."
 VAL_focus_contract_board_tt: "Открывает §YВоенный реестр Кефрейта§! и связанные с ним решения."
 VAL_focus_authority_5_tt: "§YАвторитет реестра§! изменится на §G+5§!; параметры §YКонтрактного государства§! будут пересчитаны."
 VAL_focus_authority_10_tt: "§YАвторитет реестра§! изменится на §G+10§!; параметры §YКонтрактного государства§! будут пересчитаны."
 VAL_focus_captain_retainers_tt: "Специализация §Yкапитанские свиты§!: прирост командного ресурса §G+10%§!."
 VAL_focus_count_captains_tt: "§YРеестр капитанов§! открывает оценку переговорной позиции и даёт §G+0,10§! ед. политической власти в день."
 VAL_focus_foreign_operations_tt: "Открывает подготовительные операции против Стеландера. Проводить их можно лишь после начала стеландской гражданской войны."
 VAL_focus_quality_arsenal_tt: "Специализация §Yкачественный арсенал§!: объём заводского производства §G+5%§!, захват снаряжения §G+2%§!."
 VAL_focus_broad_resource_network_tt: "Специализация §Yширокая ресурсная сеть§!: потребление припасов §G-3%§!, доход от торговли §G+5%§!."
 VAL_focus_supply_contracts_tt: "Специализация §Yконтракты снабжения§!: доход военной промышленности §G+5%§!, армейские расходы §G-3%§!."
 VAL_focus_covert_intervention_tt: "Доктрина §Yскрытого вмешательства§!: скорость планирования §G+5%§!, захват снаряжения §G+3%§!."
 VAL_focus_sustained_supply_tt: "Доктрина §Yнепрерывного снабжения§!: восстановление организации §G+3%§!, потребление припасов §G-5%§!."
 VAL_focus_resource_raider_tt: "Доктрина §Yресурсного рейда§!: атака дивизий §G+4%§!, захват снаряжения §G+5%§!, защита дивизий §R-2%§!."
 VAL_focus_manpower_preservation_tt: "Модель §Yсбережения людей§!: коэффициент военнообязанного населения §G+5%§!, восстановление организации §G+2%§!."
 VAL_focus_rear_mobilization_tt: "Модель §Yмобилизации тыла§!: объём заводского производства §G+5%§!, товары народного потребления §Y-3%§!."
 VAL_focus_open_market_tt: "Северный курс §Yоткрытого рынка§!: доход от торговли §G+7%§!, политическая власть §G+0,10§! в день."
 VAL_focus_north_coercive_tt: "Северный курс §Yпринуждения§!: доход военной промышленности §G+7%§!, атака дивизий §G+2%§!, стабильность §R-2%§!."
 VAL_focus_northern_operations_tt: "Открывает операции влияния в §YCIN§!, §YOSF§! и §YAPH§!. Одновременно может проводиться только одна зарубежная операция."
 VAL_focus_crisis_strategy_tt: "Открывает ограниченную ветвь стратегии по Стеландеру. Доступные варианты будут зависеть от гражданской войны, позиции Нодрула и накопленных резервов."
 VAL_focus_preparation_5_tt: "§YПодготовка к окончательной войне§!: §G+5§!."
 VAL_focus_preparation_10_tt: "§YПодготовка к окончательной войне§!: §G+10§!."
 VAL_focus_preparation_15_tt: "§YПодготовка к окончательной войне§!: §G+15§!."
 VAL_focus_leverage_10_tt: "§YРычаг давления на Стеландер§!: §G+10§!."
 VAL_focus_mountain_contract_tt: "Открывает решение о временном контракте с одной из сторон стеландской гражданской войны. Сделка отсрочит окончательную войну, но создаст взаимные обязательства."
 VAL_focus_resource_corridor_tt: "Открывает ограниченную войну за ресурсный коридор. Её границы и завершение определяются сценарными условиями, без мирной конференции."
 VAL_focus_deferred_invoice_tt: "Открывает переговоры об отсроченном счёте: временная помощь в гражданской войне обменивается на уступки и более поздний срок войны."
 VAL_focus_nodrul_bleed_tt: "Подготовка к войне изменится на §G+20§!, если Нодрул уже отвлечён войной или активным соседним курсом; на §G+5§!, если он спокойно охраняет мандат; иначе на §G+10§!."
 VAL_focus_final_invoice_tt: "Фиксирует окончательный план вторжения. Конкретный срок и расстановка сторон сохранят результаты прежних операций и сделки со Стеландером."
 VAL_stelander_campaign_plan: "План стеландской кампании"
 VAL_stelander_campaign_plan_desc: "Временный динамический дух действует только в финальной войне. Его свойства определяет накопленная готовность кампании: неподготовленное вторжение получает штрафы снабжения и планирования, а связный план — реальные боевые преимущества."
 STP_officer_preparation_1: "Офицерская подготовка: начальная"
 STP_officer_preparation_1_desc: "Первые надёжные штабные и гарнизонные связи пережили кризис."
 STP_officer_preparation_2: "Офицерская подготовка: развитая"
 STP_officer_preparation_2_desc: "Офицерская сеть уже способна поддерживать крупные операции и мобилизацию."
 STP_officer_preparation_3: "Офицерская подготовка: полная"
 STP_officer_preparation_3_desc: "Подготовленная командная вертикаль готова к гражданской и внешней войне."
 STP_sotnikov_rebuilt_general_staff: "Восстановленный генеральный штаб"
 STP_sotnikov_rebuilt_general_staff_desc: "Сотников вернул разрозненным соединениям единую систему планирования."
 STP_hedersett_lists_production: "Производство по спискам Хедерсетта"
 STP_hedersett_lists_production_desc: "Аппарат распределяет заказы и сырьё через проверенные списки лояльности."
 STP_crisis_war_logistics: "Логистика гражданской войны"
 STP_crisis_war_logistics_desc: "Временная система снабжения помогает удерживать расколотые дороги и склады."
 STP_nodrul_limited_support: "Ограниченная поддержка Нодрула"
 STP_nodrul_limited_support_desc: "Нодрул помогает, но сохраняет основные резервы для собственных границ."
 STP_transition_preparations: "Подготовка к переходу власти"
 STP_transition_preparations_desc: "Сводный результат административных, силовых и мобилизационных программ. Подозрение служб одновременно ухудшает эффект; отдельные внутренние показатели игроку не выводятся."
 STP_last_banquet_plan: "План операции «Последний банкет»"
 STP_last_banquet_plan_desc: "Маршруты к Бронзовому конгрессу, порядок командования и резервные линии снабжения были подготовлены заранее."
 STP_last_banquet_momentum: "Бронзовый конгресс занят"
 STP_last_banquet_momentum_desc: "Захват политического центра разрушил план партии и дал сопротивлению оперативную инициативу."
 STP_bronze_congress_lost: "Потеря Бронзового конгресса"
 STP_bronze_congress_lost_desc: "Партия лишилась главного политического центра и части командной связи."
 STP_last_banquet_delayed: "Срыв первоначального графика"
 STP_last_banquet_delayed_desc: "Сопротивление не сумело быстро занять Бронзовый конгресс; партия получила время на перегруппировку и запрос внешней помощи."
 STP_last_banquet_secure_bronze_congress: "Занять Бронзовый конгресс"
 STP_last_banquet_secure_bronze_congress_desc: "Установите военный контроль над §Yштатом 28§!, где расположен Бронзовый конгресс, в течение §Y90 дней§!. Провал позволит Нодрулу вмешаться, если его армия готова, границы удерживаются, а правительство придерживается позиции гаранта."
 stp_crisis.48.t: "Шабрат не вышел из заключения"
 stp_crisis.48.d: "После ареста Максима Шабрата партия несколько недель отрицала, что он находится под стражей. Затем его имя исчезло из тюремных списков. Офицерам сопротивления передали короткое сообщение: приговор приведён в исполнение, тело не будет выдано. Политическую сеть теперь должен возглавить Григорий Сотников."
 stp_crisis.48.a: "Командование принимает Сотников"
 stp_crisis.60.t: "Бронзовый конгресс занят"
 stp_crisis.60.d: "Передовые части сопротивления вошли в квартал Конгресса и установили контроль над залом заседаний, архивом и узлом правительственной связи. Партия потеряла возможность изображать гражданскую войну как провинциальный мятеж. Операция «Последний банкет» выполнена в установленный срок."
 stp_crisis.60.a: "Продолжить наступление"
 stp_crisis.61.t: "Первоначальный план сорван"
 stp_crisis.61.intervention: "Девяносто дней истекли, а Бронзовый конгресс остаётся у партии. Нодрул сохранил армию, удерживает пограничные районы и выполняет роль гаранта: его части вступают в войну на стороне Хедерсетта."
 stp_crisis.61.limited: "Девяносто дней истекли, а Бронзовый конгресс остаётся у партии. Нодрул не готов к прямой войне, но направляет Хедерсетту вооружение, советников и ограниченный контингент снабжения."
 stp_crisis.61.distracted: "Девяносто дней истекли, а Бронзовый конгресс остаётся у партии. Нодрул занят собственной войной, потерял возможность действовать как гарант или не располагает необходимыми силами. Прямого вмешательства не будет, но партия успела укрепиться."
 stp_crisis.61.a: "Пересмотреть план кампании"
 NOD_ypr_trade_rights: "Пограничные торговые права YPR"
 NOD_ypr_trade_rights_desc: "Сценарный мир закрепил ограниченные права вместо полного раздела YPR."
 NOD_cof_reparations: "Репарации COF"
 NOD_cof_reparations_desc: "COF выплачивает цену за завершение ограниченной кампании без мирной конференции."
 NOD_beshay_trade_concession: "Бешайская торговая уступка"
 NOD_beshay_trade_concession_desc: "Местный режим сохранился, но открыл Нодрулу выгодный договорный доступ."
 VAL_factory_cathedrals_drive: "Заводы как соборы"
 VAL_factory_cathedrals_drive_desc: "Временная производственная кампания подчиняет гражданские мощности оружейному реестру."
 VAL_hot_production_lines: "Горячие производственные линии"
 VAL_hot_production_lines_desc: "Заводы поддерживают высокий темп выпуска ценой гибкости и ресурсов."
 VAL_northern_roads_drive: "Северные контрактные дороги"
 VAL_northern_roads_drive_desc: "Дороги и склады обслуживают торговое проникновение в северные страны."
 STP_val_contract_advisers: "Кефрейтские контрактные советники"
 STP_val_contract_advisers_desc: "Советники помогают воевать, одновременно закрепляя кефрейтские требования."
 VAL_STP_postwar_contract_income: "Доход от стеландского контракта"
 VAL_STP_postwar_contract_income_desc: "Кефрейт получает платежи до наступления окончательного договорного срока."
 STP_VAL_postwar_contract_cost: "Цена кефрейтского контракта"
 STP_VAL_postwar_contract_cost_desc: "Временная помощь оплачивается производством и послевоенными обязательствами."
 VAL_northern_two_front_overstretch: "Перенапряжение двух фронтов"
 VAL_northern_two_front_overstretch_desc: "Одновременная северная и стеландская война растягивает снабжение и командование."

 autonomy_contract_protectorate: "Контрактный протекторат"
 autonomy_contract_protectorate_desc: "Формально самостоятельное правительство, чья оборона, внешние договоры и ресурсные обязательства подчинены контрактному реестру Кефрейта."
 autonomy_contract_client: "Контрактное клиентское государство"
 autonomy_contract_client_desc: "Зависимый режим, встроенный в кефрейтскую систему снабжения, гарнизонов и обязательных поставок."

 stp_crisis.41.t: "Службы замечают закономерность"
 stp_crisis.41.palace: "Перехваченные сообщения указывают на подготовку внутри дворцового контура. Мы знаем направление угрозы, но не точный план."
 stp_crisis.41.garrison: "В гарнизонах повторяются необычные переводы людей и имущества. За этим может стоять организованная кража вооружения."
 stp_crisis.41.mountains: "Патрули находят следы новых маршрутов и тайников в горах. Сеть ещё не раскрыта полностью."
 stp_crisis.41.street: "Уличные группы меняют места встреч и сигналы. Вероятно, готовится массовое действие."
 stp_crisis.41.external: "Слишком многие посредники одновременно ищут выходы на Нодрул и Кефрейт. Иностранный канал становится заметным."
 stp_crisis.41.a: "У нас есть двадцать восемь дней на ответ"
 stp_crisis.52.t: "Цена кефрейтского предложения"
 stp_crisis.52.d: "Кефрейт предлагает оружие и временное участие в гражданской войне, но требует уступок и обещает вернуться с окончательным счётом после победы."
 stp_crisis.52.a: "Принять временный контракт"
 stp_crisis.52.b: "Отказаться от кефрейтской удавки"

 val_contract.1.t: "Горный канал открыт"
 val_contract.1.d: "Кефрейт предлагает помощь против общего врага, но ожидает конкретных уступок после войны."
 val_contract.1.a: "Выслушать условия"
 val_contract.1.b: "Закрыть канал"
 val_contract.3.t: "Контракт на столе"
 val_contract.3.d: "Список уступок определит и участие Кефрейта, и срок до будущего окончательного счёта."
 val_contract.3.a: "Принять условия"
 val_contract.3.b: "Потребовать встречных уступок"
 val_contract.3.c: "Оборвать переговоры"
 val_contract.4.t: "Встречное предложение"
 val_contract.4.d: "Партнёр требует уменьшить цену. Ещё одна затяжка разрушит канал."
 val_contract.4.a: "Передать пересмотренные условия"
 val_contract.5.t: "Последнее слово Кефрейта"
 val_contract.5.d: "Сделка либо вступает в силу сейчас, либо гражданская война продолжится без кефрейтских рот."
 val_contract.5.a: "Подписать контракт"
 val_contract.5.b: "Уйти со стола"
