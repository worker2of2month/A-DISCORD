 STP_operation_palace_channel: "Открыть канал во дворец"
 STP_operation_palace_channel_desc: "Провести доверенного связного к людям, которые всё ещё имеют доступ к Иванову и столичной охране."
 STP_operation_recruit_young_officers: "Перевербовать молодых офицеров"
 STP_operation_recruit_young_officers_desc: "Потратить оружие и влияние на сеть в гарнизонах; повторяемая схема будет замечена."
 STP_operation_mountain_caches: "Развернуть горные тайники"
 STP_operation_mountain_caches_desc: "Спрятать вооружение и связное имущество до того, как партия перекроет перевалы."
 STP_operation_steal_black_ledger: "Похитить чёрную книгу"
 STP_operation_steal_black_ledger_desc: "Попытаться получить клиентские архивы Нижнего рынка и рычаг против партийных посредников."
 STP_operation_silent_march: "Подготовить молчаливый марш"
 STP_operation_silent_march_desc: "Проверить уличную сеть демонстрацией, которую труднее разогнать без политической цены."
 STP_operation_nodrul_disinformation: "Дезинформировать Нодрул"
 STP_operation_nodrul_disinformation_desc: "Создать ложную картину сил и намерений, расходуя часть вооружения сети."
 STP_operation_nodrul_disinformation_convoys: "Оплатить дезинформацию конвоями"
 STP_operation_nodrul_disinformation_convoys_desc: "Сохранить оружие, но пожертвовать транспортом для той же рискованной схемы."
 STP_operation_val_secret_channel: "Открыть тайный канал с Кефрейтом"
 STP_operation_val_secret_channel_desc: "Узнать цену временной помощи, не раскрывая Кефрейту весь план сопротивления."
 STP_operation_seal_palace: "Запечатать дворцовое крыло"
 STP_operation_seal_palace_desc: "Аппарат отрежет Иванова от непроверенных посетителей и последней независимой информации."
 STP_operation_rotate_garrisons: "Провести ротацию гарнизонов"
 STP_operation_rotate_garrisons_desc: "Разорвать личные связи молодых офицеров до того, как они превратятся в организованную силу."
 STP_operation_targeted_raid: "Нанести точечный удар"
 STP_operation_targeted_raid_desc: "Атаковать наблюдаемое семейство подпольной подготовки. Неверно выбранная цель оставит другие узлы нетронутыми."
 STP_operation_burn_client_archives: "Сжечь клиентские архивы"
 STP_operation_burn_client_archives_desc: "Уничтожить доказательства и обесценить операции сопротивления на Нижнем рынке."
 STP_operation_arm_festival_police: "Вооружить фестивальную полицию"
 STP_operation_arm_festival_police_desc: "Превратить службу порядка в уличный резерв партийного аппарата."
 STP_operation_request_nodrul_advisers: "Запросить нодрулских советников"
 STP_operation_request_nodrul_advisers_desc: "Получить внешнюю помощь ценой ещё большей зависимости от мандата Нодрула."
 STP_operation_false_val_channel: "Подставить кефрейтский канал"
 STP_operation_false_val_channel_desc: "Направить сопротивление к контролируемому посреднику и заставить его раскрыть связи."
 STP_party_market_sabotage: "Саботировать Нижний рынок"
 STP_party_market_sabotage_desc: "Аппарат попытается закрыть финансовые и архивные маршруты подполья."

 VAL_contract_campaign: "Военный реестр Кефрейта"
 VAL_contract_campaign_desc: "До начала §Yгражданской войны в Стеландере§! Кефрейт не может проводить операции на его территории: Ивановский режим и Нодрул закрывают перевалы. Когда порядок расколется, каждый успешно подготовленный участок усилит будущую кампанию, а каждый провал уменьшит уже накопленный темп.\n\n§YАвторитет реестра§!: [?VAL_contract_authority|0]% — [VALGetContractAuthorityBand]\n§YГотовность против Стеландера§!: [?VAL_STP_campaign_readiness|0]% — [VALGetCampaignReadinessBand]\n§YДоговорные рычаги§!: [?VAL_STP_leverage|0]%\n§YСостояние Стеландера§!: [VALGetSTPCrisisPhase]\n§YНодрул§!: [VALGetNODAssessment]\n§YАктивная зарубежная операция§!: [VALGetForeignOperationStatus]\n\n§gРазные направления подготовки складываются. Повтор одной операции даёт меньше пользы, повышает раскрытие и может сообщить о планах Нодрулу.§!"
 VAL_STP_map_mountain_passes: "Составить оперативную карту перевалов"
 VAL_STP_map_mountain_passes_desc: "Во время стеландской гражданской войны определить маршруты к регионам 43, 44, 45 и 88. Первый успех даёт §G+10§! базовой подготовки и раскрывает текущую конфигурацию обороны; повтор лишь повышает риск контрмер."
 VAL_STP_build_contractor_depot: "Развернуть приграничную базу снабжения"
 VAL_STP_build_contractor_depot_desc: "Вложить винтовки в склады, транспорт и проводников. Первый успех даёт §G+15§! базовой подготовки и договорный рычаг, но ротируемые гарнизоны способны перехватить поставку."
 VAL_STP_offer_mountain_concession: "Купить ресурсные обязательства"
 VAL_STP_offer_mountain_concession_desc: "Проверить, какая сторона раскола готова заранее заложить горные ресурсы. Это прежде всего увеличивает договорные рычаги; военная подготовка растёт лишь умеренно."
 VAL_STP_buy_border_officers: "Вербовать пограничное командование"
 VAL_STP_buy_border_officers_desc: "Потратить командный ресурс и поддержку на клиентскую сеть в гарнизонах. Первый успех даёт §G+15§! базовой подготовки и является обязательным условием самого жёсткого послевоенного клиента."
 VAL_STP_test_nodrul_red_line: "Спровоцировать реакцию Нодрула"
 VAL_STP_test_nodrul_red_line_desc: "Результат зависит от реального поведения Нодрула. Отвлечённая республика создаст крупное окно, выжидающая — ограниченное, а готовый защитник превратит проверку в потерю темпа."
 VAL_open_mountain_contract: "Открыть горный контракт"
 VAL_open_mountain_contract_desc: "Предложить одной стороне гражданской войны временный союз, уступки и отсрочку окончательного счёта."
 VAL_negotiate_deferred_invoice: "Обсудить отсроченный счёт"
 VAL_negotiate_deferred_invoice_desc: "Использовать короткое послевоенное окно для сделки без повторного запуска кризиса."
 VAL_start_resource_corridor: "Начать операцию «Ресурсный коридор»"
 VAL_start_resource_corridor_desc: "Во время гражданской войны попытаться захватить регион 45, 88 или оба. В обычном состоянии Стеландер и Нодрул не допустят вторжения."
 VAL_resource_corridor_control_30: "Удержать ресурсный коридор"
 VAL_resource_corridor_control_30_desc: "Сохранять контроль тридцать дней, после чего потребовать сценарную уступку и завершить только эту войну."
 VAL_STP_adviser_factory_obligation: "Обязательство советников"
 VAL_STP_adviser_factory_obligation_desc: "Часть кефрейтской промышленности занята исполнением военного контракта."
 VAL_STP_arms_debt_day_30: "Первый оружейный платёж"
 VAL_STP_arms_debt_day_30_desc: "Стеландская сторона должна выполнить первый этап оружейного долга."
 VAL_STP_arms_debt_day_90: "Второй оружейный платёж"
 VAL_STP_arms_debt_day_90_desc: "Просрочка ослабит договор и приблизит окончательный счёт."
 VAL_STP_arms_debt_day_150: "Последний оружейный платёж"
 VAL_STP_arms_debt_day_150_desc: "Последняя договорная поставка до послевоенного расчёта."
 VAL_northern_campaign: "Северная контрактная кампания"
