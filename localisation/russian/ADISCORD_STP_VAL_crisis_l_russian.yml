 val_contract.40.d: "Разные владельцы регионов 45 и 88 требуют ограничить первый удар одной целью."
 val_contract.40.a: "Ударить по региону 45"
 val_contract.40.b: "Ударить по региону 88"
 val_contract.50.t: "Кефрейт удерживает оба ресурсных региона"
 val_contract.50.d: "Противник требует передать регионы 45 и 88 и завершить только войну за коридор."
