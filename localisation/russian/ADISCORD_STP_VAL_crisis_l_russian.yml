 ADISCORD_VAL_contract_panel_title: "Военный реестр Кефрейта"
 ADISCORD_VAL_contract_panel_title_tt: "Промышленность, капитаны и зарубежные договоры сводятся в один план. Операции создают реальные условия будущей войны, но повторяемые схемы раскрываются противнику."
 VAL_contract_authority_text: "Авторитет контрактной системы: [?VAL_contract_authority|0]% — [VALGetContractAuthorityBand]"
 VAL_contract_authority_tt: "Авторитет отражает способность центрального реестра подчинять капитанов общей стратегии. Он меняет свойства динамического национального духа «Контрактное государство»."
 VAL_contract_readiness_text: "Готовность стеландской кампании: [?VAL_STP_campaign_readiness|0]% — [VALGetCampaignReadinessBand]"
 VAL_contract_readiness_tt: "Готовность рассчитывается из оперативной подготовки, рычагов давления, разведанных перевалов, завербованных гарнизонов, ресурсных прав, северных сетей и фактической свободы действий Нодрула. В финальной войне она напрямую меняет атаку, оборону, планирование и снабжение."
 VAL_contract_stp_phase: "§YСтеландер:§! [VALGetSTPCrisisPhase]"
 VAL_contract_stp_phase_tt: "До гражданской войны открытое вторжение политически невозможно. После консолидации запускается единый срок до полноценной войны."
 VAL_contract_nod_assessment: "§YНодрул:§! [VALGetNODAssessment]"
 VAL_contract_nod_assessment_tt: "Нодрул не позволит безнаказанно войти в подконтрольный Стеландер, пока сохраняет армию, перевалы и свободу действий. Его можно отвлечь, но нельзя просто отключить решением."
 VAL_contract_influence_header: "Северные договорные сети"
 VAL_contract_influence_tt: "Влияние растёт только от разных успешно завершённых семейств операций. Повторение одной схемы создаёт блокировку и тратит общий зарубежный слот."
 VAL_contract_cin_influence: "CIN\n[VALGetCINInfluence]"
 VAL_contract_osf_influence: "OSF\n[VALGetOSFInfluence]"
 VAL_contract_aph_influence: "APH\n[VALGetAPHInfluence]"
 VAL_contract_state_45: "§YРегион 45:§! [VALGetState45Status]"
 VAL_contract_state_88: "§YРегион 88:§! [VALGetState88Status]"
 VAL_contract_resource_states_tt: "Ресурсные регионы можно получить по договору, захватить во время ограниченного коридора или закрепить итогом финальной войны. Все такие войны завершаются сценарным миром без конференции."
 VAL_contract_deal_status: "§YСделка со Стеландером:§! [VALGetDealStatus]"
 VAL_contract_deal_status_tt: "Сделка может временно сделать Кефрейт союзником одной стороны гражданской войны и отсрочить большую войну. Цена зависит от выбранных уступок."
 VAL_contract_countdown_status: "§YСрок до окончательного счёта:§! [VALGetCountdownStatus]"
 VAL_contract_countdown_status_tt: "Существует только один канонический таймер. Фокусы подготовки не создают второй срок и не позволяют бесконечно откладывать войну."
 VAL_contract_foreign_operation: "§YОбщий зарубежный слот:§! [VALGetForeignOperationStatus]"
 VAL_contract_foreign_operation_tt: "Операции против Стеландера, CIN, OSF и APH используют один слот. Пока операция идёт, другую начать нельзя."
 VAL_contract_war_concept: "§YБудущий замысел войны:§! [VALGetWarConcept]"
 VAL_contract_war_concept_tt: "Замысел формируется доктриной, договорами, северным влиянием и текущим состоянием противников. Он не гарантирует победу и может стать невыгодным после изменения обстановки."

