 val_contract.60.t: "Срок по кефрейтскому контракту подходит"
 val_contract.60.d: "Окончательный счёт не отменён: Кефрейт заканчивает подготовку к войне."
 val_contract.64.t: "Контрактный срок нарушен"
 val_contract.64.d: "Переговоры закончены. До полномасштабной войны остаются считаные дни."
 val_contract.warning.a: "Мы знали, что этот день придёт"
 val_contract.70.t: "Кефрейт предъявляет окончательный счёт"
 val_contract.70.d: "Срок истёк. Мобилизационные планы переходят из архива в штабы."
 val_contract.deadline.a: "Начать окончательную подготовку"
 val_contract.80.t: "Кефрейт начинает войну со Стеландером"
 val_contract.80.d: "Отсрочки и временные союзы закончились. Теперь спор решит полномасштабная война."
 val_contract.82.t: "Кефрейт навязывает контрактный порядок"
 val_contract.82.d: "Сценарный мир закрепляет ресурсные районы и создаёт особую договорную зависимость вместо обычной мирной конференции."
 val_contract.83.t: "Стеландер отбил окончательный счёт"
 val_contract.83.d: "Кефрейт вынужден отказаться от войны, а временные договорные права и доступ очищаются сценарием."
 val_contract.outcome.a: "Зафиксировать новый порядок"
 val_contract.90.t: "Кефрейт атаковал слишком рано"
 val_contract.90.d: "Стеландер ещё не расколот гражданской войной. Нодрул должен решить, защищать ли свой мандат напрямую."
 val_contract.90.a: "Вступить в защиту Стеландера"
 val_contract.90.b: "Ограничиться поставками"
 val_contract.410.t: "Отдельные условия для региона 59"
 val_contract.410.d: "Кефрейт предлагает ограниченную уступку вместо полного разгрома и обычной мирной конференции."
 val_contract.410.a: "Принять отдельные условия"
 val_contract.410.b: "Продолжать войну"
