l_russian:
 ADISCORD_STP_crisis_panel_title: "Наследство Отца мира"
 ADISCORD_STP_crisis_panel_title_tt: "Сводка содержит только сведения, доступные участникам кризиса. Точные расчёты служб безопасности и намерения иностранных держав скрыты."
 STP_crisis_health_text: "Состояние Иванова:\n[STPGetLeaderHealthStageName]"
 STP_crisis_health_portrait_tt: "[STPGetLeaderHealthTooltip]"
 STP_crisis_readiness_text: "Готовность: [?STP_resistance_readiness|0]% — [STPGetReadinessBand]"
 STP_crisis_readiness_tt: "Готовность складывается из надёжности ячеек, офицерских связей, снабжения и уже проведённых операций. Высокое значение само по себе не гарантирует успех."
 STP_crisis_suspicion_text: "Подозрение: [?STP_party_suspicion|0]% — [STPGetSuspicionBand]"
 STP_crisis_suspicion_tt: "Подозрение растёт от повторяющихся схем, проваленных операций и заметной подготовки. При высоком давлении службы меняют контрмеры, а Шабрат рискует исчезнуть."
 STP_crisis_nod_assessment: "§YНодрул:§! [STPGetNODAssessment]"
 STP_crisis_nod_assessment_tt: "Нодрул контролирует политическую архитектуру Стеландера, но его готовность вмешаться зависит от собственных войн, запасов и выбранной линии."
 STP_crisis_val_assessment: "§YКефрейт:§! [STPGetVALAssessment]"
 STP_crisis_val_assessment_tt: "Кефрейт не способен открыто действовать до начала внутренней войны, однако заранее собирает разведданные, связи и договорные права."
 STP_crisis_countermeasure: "§YЗамеченная контрмера:§! [STPGetObservedCountermeasure]"
 STP_crisis_countermeasure_tt: "Это наблюдаемый ответ противника, а не раскрытие его скрытой установки. Повтор одной и той же схемы облегчает адаптацию служб."
 STP_crisis_operations_header: "Текущая подготовка"
 STP_crisis_major_operation: "§YОсновная операция:§!\n[STPGetActiveMajorOperation]"
 STP_crisis_aux_operation: "§YВспомогательная операция:§!\n[STPGetActiveAuxOperation]"
 STP_crisis_operation_tt: "Одновременно можно вести только одну основную и одну вспомогательную операцию. Подготовленные противником контрмеры меняют результат."
 STP_crisis_outcomes_header: "Разведывательная оценка исходов"
 STP_crisis_outcomes_tt: "Карточки не показывают вероятность. Статус «подтверждён» означает уже сложившийся исход, «скомпрометирован» — утрату данного пути, а «неясен» — сохраняющуюся неопределённость."
 STP_crisis_bloodless_title: "Переворот\nбез войны"
 STP_crisis_shabrat_war_title: "Шабрат\nподнимает горы"
 STP_crisis_sotnikov_title: "Сотников\nберёт командование"
 STP_crisis_party_title: "Аппарат\nсохраняет власть"
 STP_crisis_bloodless_intel: "[STPGetBloodlessOutcomeIntel]"
 STP_crisis_shabrat_war_intel: "[STPGetShabratWarOutcomeIntel]"
 STP_crisis_sotnikov_intel: "[STPGetSotnikovOutcomeIntel]"
 STP_crisis_party_intel: "[STPGetPartyOutcomeIntel]"
 STP_crisis_bloodless_card_tt: "Самый трудный путь: дворец, столичная охрана, офицеры, рынок и Нодрул должны одновременно оказаться в подходящем состоянии."
 STP_crisis_shabrat_war_card_tt: "Если сеть жизнеспособна, но момент для бескровного захвата упущен, Шабрат может начать гражданскую войну с подготовленными опорными районами."
 STP_crisis_sotnikov_card_tt: "Потеря Шабрата не завершает сопротивление автоматически. При сохранённых офицерских и горных связях командование может принять Григорий Сотников."
 STP_crisis_party_card_tt: "Аппарат способен удержаться мирно либо начать войну против уцелевшего сопротивления. Его положение зависит от лояльности гарнизонов и помощи Нодрула."
 STP_crisis_intel_warning: "§gРазведка описывает возможности, но не выдаёт формулу победы.§!"

