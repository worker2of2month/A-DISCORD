 nod_crisis.1.t: "Стеландский мандат под угрозой"
 nod_crisis.1.d: "Смерть Иванова и рост подполья заставляют определить, сколько сил Нодрул готов потратить на подконтрольную республику."
 nod_crisis.1.a: "Выбрать линию по обстановке"
 nod_crisis.10.t: "BHG предлагает уступку"
 nod_crisis.10.d: "Ограниченная кампания может закончиться сейчас без мирной конференции и без захвата всей страны."
 nod_crisis.10.a: "Принять торговую уступку"
 nod_crisis.10.b: "Продолжать давление"
