 ADISCORD_rin_crisis.1.t: "Две присяги требуют ответа"
 ADISCORD_rin_crisis.1.d: "Война в Воркерланде разорвала торговые договоры, на которых держался юг, и одновременно убедила Монтеру потребовать исполнения северной присяги. Дворяне Палатинского Двора уже поднимают коронные знамёна; городские советы Рины отвечают, что ни один чужой престол не отменит их хартии. Аларик IV должен выбрать - или признать, что единого палатината больше нет."
 ADISCORD_rin_crisis.1.a: "Хартии переживут корону"
 ADISCORD_rin_crisis.1.b: "Присяга Монтере остаётся в силе"
 # END CONSOLIDATED: ADISCORD_inner_frontier_countries_l_russian

# BEGIN CONSOLIDATED: ADISORD_news_l_russian.yml
  news.0.t: "В Воркерланде началась гражданская война"
  news.0.d: "Распад Конфедерации перерос в открытую войну между районными правительствами Воркерланда. Гарнизоны, ещё недавно подчинявшиеся одному командованию, теперь занимают железнодорожные узлы, склады и административные здания для разных властей. Сразу несколько районов начали мобилизацию.\n\nБашня Единства по-прежнему стоит в столице, но институты, которые она символизировала, больше не контролируют страну. Местные правительства отдают собственные приказы, перебрасывают войска и силой оспаривают право определять будущее Воркерланда."
  news.0.a: "Гражданская война началась."
  ADISCORD_vorkerland_news.1.t: "Итора одержала победу в северной кампании"
  ADISCORD_vorkerland_news.1.d: "Итора объявила о завершении северной операции и распустила временный оборонительный фронт. На занятых территориях сформированы два новых режима. Норвейн возглавил Матвей Матеуска, Крайтскую директорию Антон Селевёстров. Оба правительства сохраняют тесную зависимость от Иторы.\n\nОперация изменила карту, но не завершила северные войны. Уцелевшие республики возвращаются к прежним конфликтам за границы и дороги, а новые администрации начинают строить собственные армии. Итора получила буферные государства вместо прямой оккупации, однако устойчивость созданного порядка ещё предстоит проверить."
  ADISCORD_vorkerland_news.1.a: "Север получил новые границы, но не мир."
  ADISCORD_vorkerland_news.2.t: "Итора потерпела поражение в северной кампании"
  ADISCORD_vorkerland_news.2.d: "Попытка Иторы закрепить новый порядок на севере закончилась неудачей. Норвейн и зависимая Крайтская директория так и не стали устойчивыми государствами. Спорные территории возвращены Грейну и Ривенделлу, а временный Северный оборонительный фронт распущен.\n\nПравительство Вадима Иванчика объявило чрезвычайный курс после поражения. Северные администрации тем временем возобновляют собственные войны. Для соседей исход кампании стал первым наглядным пределом возможностей Иторы после распада Воркерланда."
  ADISCORD_vorkerland_news.2.a: "Новые карты пришлось убрать со столов."
  news.1.t: "Стеланд провозгласил империю"
  news.1.d: "Максим Шабрат подписал акт о преобразовании Стеланда в империю. Послевоенная избирательная система упразднена, а глава государства больше не связан временным мандатом, созданным после гражданской войны. Сохранившиеся республиканские институты теперь подчиняются имперской исполнительной власти.\n\nПравительство представляет реформу как постоянную систему управления расширившимся государством. Сторонники Шабрата поддержали акт, тогда как часть бывших участников сопротивления осудила отказ от республиканского устройства. Иностранные правительства пересматривают отношения со Стеландом после изменения его конституционного строя."
  news.1.a: "Стеланд стал империей."
# END CONSOLIDATED: ADISORD_news_l_russian.yml

 ADISCORD_rin_crisis.10.t: "Ринский палатинат раскололся"
 ADISCORD_rin_crisis.10.d: "Кризис двух присяг завершился вооружённым расколом Рины. Северные дома, связанные клятвой Монтере, выступили против южных городов, отстаивающих свои воркерландские хартии. Часть армии перешла под знамёна северного двора; прежняя граница между правовыми традициями стала линией фронта.\n\nРаспад Воркерланда лишил старый компромисс опоры. Для городских советов хартии остаются основанием самостоятельного управления, для северной знати верность короне важнее решений юга. Теперь ни одна сторона не признаёт за другой права говорить от имени всего палатината. Война должна решить, какая из двух присяг станет государственным порядком."
 ADISCORD_rin_crisis.10.a: "Две присяги, два командования."

 ADISCORD_rin_crisis.11.t: "Южные города победили в Рине"
 ADISCORD_rin_crisis.11.d: "Сторонники южных хартий одержали победу в ринской гражданской войне. Северный двор больше не составляет отдельного военного центра, а устройство палатината определяется соглашением городов. Две несовместимые присяги уступают место единому правовому порядку.\n\nПобеда не означает отмены престола: палатин сохраняется, но старые торговые хартии становятся основой общего права. Его власть больше не может держаться на одновременных обязательствах перед городами и внешней короной. После военного объединения победителям предстоит восстановить управление севером и добиться исполнения соглашения за пределами поддержавших их городов."
 ADISCORD_rin_crisis.11.a: "Теперь хартии должны объединить страну."

 ADISCORD_rin_crisis.12.t: "Северный двор победил в Рине"
 ADISCORD_rin_crisis.12.d: "Гражданская война в Рине завершилась победой северного двора. Вооружённое сопротивление южных городов сломлено, а коронный палатинат утверждается как общий порядок для страны. Сторонники северной присяги получили возможность распространить власть двора за пределы своих прежних владений.\n\nДля городов это поражение попытки сделать хартии высшим основанием государственной власти. Победителям предстоит управлять территориями, которые недавно отвергли их требования. Военный исход решён; прочность восстановленного палатината будет зависеть от того, сможет ли двор удержать юг после окончания боёв."
 ADISCORD_rin_crisis.12.a: "Корона вернула власть над палатинатом."

 ADISCORD_rin_crisis.13.t: "Перемирие закрепило раздел Рины"
 ADISCORD_rin_crisis.13.d: "Противоборствующие стороны Рины прекратили войну, сохранив раздельное управление. Северный двор удерживает свои земли, южные города продолжают жить по общему соглашению хартий. Единого победителя у кризиса двух присяг не оказалось.\n\nПеремирие прекращает борьбу за весь палатинат, но не возвращает довоенное устройство. Присяга короне и городские вольности теперь существуют по разные стороны границы. Для жителей это конец текущих боёв; для двух правительств - необходимость выстраивать отношения с соседом, чьи права они ещё недавно оспаривали оружием."
 ADISCORD_rin_crisis.13.a: "Боевые действия прекращены. Раздел остаётся."

 ADISCORD_rin_crisis.14.t: "Рина подтвердила присягу Монтере"
 ADISCORD_rin_crisis.14.d: "Ринский двор подтвердил верность Монтере, отказавшись поддержать южные города в споре о двух присягах. На фоне распада Воркерланда палатин сделал выбор в пользу коронного порядка и сохранения зависимости от северного покровителя.\n\nВооружённого раскола удалось избежать, однако уступка не устраняет противоречия между двором и городскими хартиями. Южные советы лишились возможности определять внешний курс страны, а корона приняла на себя ответственность за сохранение внутреннего порядка. Старый компромисс закончился решением двора, а не соглашением обеих сторон."
 ADISCORD_rin_crisis.14.a: "Палатин выбрал северную присягу."
