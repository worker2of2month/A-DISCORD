 ADISCORD_rin_crisis.1.t: "Две присяги требуют ответа"
 ADISCORD_rin_crisis.1.d: "Война в Воркерланде разорвала торговые договоры, на которых держался юг, и одновременно убедила Монтеру потребовать исполнения северной присяги. Дворяне Палатинского Двора уже поднимают коронные знамёна; городские советы Рины отвечают, что ни один чужой престол не отменит их хартии. Аларик IV должен выбрать — или признать, что единого палатината больше нет."
 ADISCORD_rin_crisis.1.a: "Хартии переживут корону"
 ADISCORD_rin_crisis.1.b: "Присяга Монтере остаётся в силе"
 # END CONSOLIDATED: ADISCORD_inner_frontier_countries_l_russian

# BEGIN CONSOLIDATED: ADISORD_news_l_russian.yml
  news.0.t: "Конец единого Воркерланда"
  news.0.d: "Центральный комплекс Воркерланда уничтожен. В течение нескольких часов связь с федеральным руководством прекратилась, а республиканские администрации начали переходить на чрезвычайные протоколы. Гарнизоны получают приказы уже из местных штабов, железнодорожные узлы меняют маршруты без согласования с центром, государственные ведомства теряют единую цепь подчинения.\n\nКонфедерация годами сохраняла целостность благодаря общей административной машине. После исчезновения её центра выяснилось, что заранее признанного порядка преемственности не существует. Округа и республики заявляют, что будут действовать самостоятельно до восстановления законной власти. Пока никто не способен сказать, кто имеет право эту власть восстановить."
  news.0.a: "Воркерланд перестал быть единым государством."
  ADISCORD_vorkerland_news.1.t: "Итора закрепилась на севере Воркерланда"
  ADISCORD_vorkerland_news.1.d: "Итора объявила о завершении северной операции и распустила временный оборонительный фронт. На занятых территориях сформированы два новых режима. Норвейн возглавил Матвей Матеуска, Крайтскую директорию Антон Селевёстров. Оба правительства сохраняют тесную зависимость от Иторы.\n\nОперация изменила карту, но не завершила северные войны. Уцелевшие республики возвращаются к прежним конфликтам за границы и дороги, а новые администрации начинают строить собственные армии. Итора получила буферные государства вместо прямой оккупации, однако устойчивость созданного порядка ещё предстоит проверить."
  ADISCORD_vorkerland_news.1.a: "Север получил новые границы, но не мир."
  ADISCORD_vorkerland_news.2.t: "Северная операция Иторы завершилась отступлением"
  ADISCORD_vorkerland_news.2.d: "Попытка Иторы закрепить новый порядок на севере закончилась неудачей. Норвейн и зависимая Крайтская директория так и не стали устойчивыми государствами. Спорные территории возвращены Грейну и Ривенделлу, а временный Северный оборонительный фронт распущен.\n\nПравительство Вадима Иванчика объявило чрезвычайный курс после поражения. Северные администрации тем временем возобновляют собственные войны. Для соседей исход кампании стал первым наглядным пределом возможностей Иторы после распада Воркерланда."
  ADISCORD_vorkerland_news.2.a: "Новые карты пришлось убрать со столов."
  news.1.t: "В Стеланде провозглашена империя"
  news.1.d: "Максим Шабрат подписал акт о преобразовании Стеланда в империю. Переходные республиканские институты сохраняются лишь в той мере, в какой не ограничивают новую верховную власть. Прежний избирательный порядок прекращён, а полномочия главы государства больше не связаны с послевоенным сроком или чрезвычайным мандатом.\n\nПравительство объясняет реформу тем, что республика была создана для выхода из гражданской войны, тогда как расширившемуся государству требуется постоянный центр командования. Сторонники Шабрата называют провозглашение империи завершением борьбы за суверенитет. Бывшие союзники по сопротивлению, не принявшие новый курс, говорят о превращении временной власти победителя в постоянную систему.\n\nЧеловек, который пришёл к власти с обещанием вернуть стране право решать собственную судьбу, теперь сосредоточил это право в одном институте. Для соседей спор о характере режима уже вторичен: Стеланд открыто заявляет, что считает себя силой, способной определять порядок за пределами собственных гор."
  news.1.a: "Сопротивление стало государством. Государство стало империей."
# END CONSOLIDATED: ADISORD_news_l_russian.yml
