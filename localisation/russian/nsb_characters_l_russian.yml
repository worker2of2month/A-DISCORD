 VEL_Marten_Rovel: "Мартен Ровель"
 VEL_Marten_Rovel_desc: "Бывший распорядитель горных переправ, Мартен Ровель убедил северные кантоны учредить общую казну и выборный совет. Каждая долина сохраняет собственный сход и ополчение; пошлины с перевалов оплачивают дороги и общую стражу. Ровель председательствует лишь до следующего съезда и не может собрать чрезвычайный налог без согласия кантонов. Для южных коммун он слишком похож на правителя, для Монтарской империи — слишком зависим от своих избирателей."
