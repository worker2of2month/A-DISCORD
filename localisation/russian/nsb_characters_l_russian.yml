 AIN_Elias_Marven: "Элиас Марвен"
 AIN_Elias_Marven_desc: "Нодрульский юрист и управляющий концессиями Марвен превратил временный договор об охране Айнхольма в бессрочный мандат. Выборы здесь проходят регулярно, но право попасть в бюллетень, открыть предприятие или покинуть долину выдаёт одна и та же лицензионная палата."
 # END GENERATED: tools.builders.build_adiscord_ainholm_mandate
 # BEGIN CONSOLIDATED: ADISCORD_inner_frontier_countries_l_russian
 BOR_Elena_Borey: "Елена Борей"
 BOR_Elena_Borey_desc: "Елена Борей координировала иторские госпитальные колонны ещё до того, как разрозненные поселения объявили себя республикой. Она умеет договариваться с Иторой, местными старостами и военными заставами, но каждый новый договор напоминает Борее, насколько её безопасность зависит от восточного соседа."
 DOL_Marko_Doln: "Марко Дольн"
 DOL_Marko_Doln_desc: "Марко Дольн не основал государство — он убедил пять дорожных округов одновременно чинить мосты и признавать одни весовые меры. Союз держится на полезности общего управления и может рассыпаться, если центр потребует от общин больше, чем вернёт им дорогами и безопасностью."
 RIN_Alaric_IV_Ren: "Аларик IV Рен"
 RIN_Alaric_IV_Ren_desc: "Аларик IV сохранил трон, обещая Монтере верность северной короне, а воркерландским торговцам — неприкосновенность старых хартий. Обе стороны считают его временным союзником, поэтому палатин превратил дворцовую гвардию в единственный институт, которому доверяет без оговорок."
 KRM_Ivo_Kremen: "Иво Кремень"
 KRM_Ivo_Kremen_desc: "После распада Внешнего заслона Иво Кремень собрал управляющих шахтами, перевозчиков и городских пайщиков в Промышленную палату. Он оценивает решения по тоннажу, срокам и числу сохранённых рабочих мест, оставляя вопросы справедливости тем, кто сумеет выразить их в производственном плане."
 LMN_Vera_Lemann: "Вера Леманн"
 LMN_Vera_Lemann_desc: "Вера Леманн руководила южным сектором Внешнего заслона. Когда Воркерланд перестал присылать приказы и жалование, она подчинила себе фильтрационные пункты Лемана и превратила временные инструкции в законы нового кордона."
 RLY_Relay_Assembly_17: "Станционный совет Релейна"
 RLY_Relay_Assembly_17_desc: "В Релейне нет единоличного главы. Начальники смен, инженеры очистки и хранители архива заседают в Станционном совете, совместно утверждая аварийные протоколы и порядок использования уцелевшей инфраструктуры."
 WCG_Edgar_Raut: "Эдгар Раут"
 WCG_Edgar_Raut_desc: "Эдгар Раут никогда не называл себя правителем. Его должность — главный комендант, его столица — цепь штабных вагонов, а его полномочия начинаются там, где заканчивается право человека пройти дальше. Воркерланд поручил ему принимать на себя беженцев, заражённые грузы и всё, что центр не желает видеть у собственных городов."
 # END CONSOLIDATED: ADISCORD_inner_frontier_countries_l_russian
 # BEGIN CONSOLIDATED: ADISCORD_northern_countries_l_russian
 BRN_Emilia_Brandt: "Эмилия Брандт"
 BRN_Emilia_Brandt_desc: "Эмилия Брандт превратила цепь метеостанций, радиомачт и складов в единую администрацию. В Брайне приказ ценят не за торжественность, а за способность дойти до самого удалённого гарнизона до начала бури."
 KRL_Edvard_Karel: "Эдвард Карель"
 KRL_Edvard_Karel_desc: "Король Эдвард Карель удерживает островные ярлства браками, пожалованиями и личным контролем над ледовыми портами. Двор расточителен, но пограничные дружины умеют пережидать зиму там, где регулярная армия теряет дороги."
 VRA_Alrik_Varn: "Альрик Варн"
 VRA_Alrik_Varn_desc: "Альрик Варн представляет советы двух удалённых островов, связанных маяками, лоцманскими семьями и общим спасательным флотом. Уния не стремится управлять материком и требует от соседей лишь свободного прохода через северные проливы."
 FRS_Mikael_Frost: "Микаэль Фрост"
 FRS_Mikael_Frost_desc: "Микаэль Фрост председательствует на съезде округов, которые признают общий бюджет лишь на дороги, спасательные службы и оборону. Федерация устойчива в быту, но медленно собирает силы для большой войны."
 KHV_Ilva_Havren: "Ильва Хаврен"
 KHV_Ilva_Havren_desc: "Ильва Хаврен возглавляет коллегию геологов и энергетиков, выросшую вокруг глубоких тёплых скважин. Конклав обеспечивает города энергией, но измеряет общественные потребности теми же таблицами, что и давление в трубах."
 SRV_Eira_Sarven: "Эйра Сарвен"
 SRV_Eira_Sarven_desc: "Эйра Сарвен координирует вытянутую цепь островных станций, где каждая гавань зависит от общего ремонта дорог, генераторов и радиомачт. Коллегия ценит измеримый результат, но почти не оставляет места политике вне технических комиссий."
 ELN_Taal_Elander: "Тааль Эландер"
 ELN_Taal_Elander_desc: "Тааль Эландер построил власть на всеобщей переписи мастерских, запасов и трудовых бригад. Его директория эффективна, пока реальная жизнь совпадает с отчётами, и беспощадна к тем, кто в них не помещается."
 AUR_Sofia_Aurell: "София Аурелль"
 AUR_Sofia_Aurell_desc: "София Аурелль добилась равного представительства горных и прибрежных общин. Республика богаче соседей институтами, чем оружием, и рассчитывает удержать мир договорами и подготовленным ополчением."
 HON_Honter_Woke: "Хонтер Уок"
 HON_Honter_Woke_desc: "Хонтер Уок стал компромиссным кандидатом дорожных коммун, профсоюзов и городских советов. Он расширил участие провинций в управлении, не позволив бесконечным обсуждениям остановить восстановление страны."
 SVL_Marta_Seval: "Марта Севаль"
 SVL_Marta_Seval_desc: "Марта Севаль добилась самостоятельности острова после многолетних споров о шахтных налогах и снабжении. Её республика невелика, но местные общины контролируют добычу, склады и береговую оборону без далёкой хонорийской администрации."
 NVR_Leif_Norven: "Лейф Норвен"
 NVR_Leif_Norven_desc: "Лейф Норвен координирует округа, чьи дороги ежегодно меняются вместе с разливами и снегом. Федерация избегает громких доктрин и поддерживает только те учреждения, которые доказали практическую пользу."
 SKN_Ren_Skad: "Рен Скад"
 SKN_Ren_Skad_desc: "Маршал Рен Скад объединил гарнизонные округа после серии приграничных налётов. Его система быстро выставляет резервистов, но подчиняет гражданское хозяйство требованиям штабов."
 TMR_Mira_Timer: "Мира Тимер"
 TMR_Mira_Timer_desc: "Мира Тимер распределяет средства между округами по измеримой отдаче от дорог, школ и мастерских. Палата умеет экономить, но плохо понимает проекты, выгода которых проявится лишь через поколение."
 LYS_Cassian_Lys: "Кассиан Лис"
 LYS_Cassian_Lys_desc: "Кассиан Лис представляет дома, контролирующие склады, переправы и кредит северо-восточного побережья. Лига открыта для торговли, пока её правила сохраняют прибыль старых компаний."
 KDL_Oren_Kadel: "Орен Кадель"
 KDL_Oren_Kadel_desc: "Орен Кадель председательствует в палате двух островных портов, отказавшихся подчинять местные сборы торговым домам Лисмара. Республика живёт каботажем, ремонтом судов и осторожными соглашениями с каждым, кто способен защитить морские пути."
 VES_Oskar_Vest: "Оскар Вест"
 VES_Oskar_Vest_desc: "Оскар Вест связал четыре обширных округа цепью застав и дорожных обязательств. Вестмар невелик населением, зато его оборона опирается на заранее подготовленные рубежи."
 DRV_Council_of_Free_Valleys: "Сход свободных долин"
 DRV_Council_of_Free_Valleys_desc: "Дравен не имеет постоянного правительства: делегаты долин собираются для ремонта дорог, разрешения споров и общей обороны. Такая система плохо переносит долгую централизацию, но почти не оставляет места далёкой бюрократии."
 ORV_Anton_Orval: "Антон Орваль"
 ORV_Anton_Orval_desc: "Антон Орваль поддерживает коалицию городов, фермерских округов и транспортных артелей, обещая каждому только достижимое. Союз редко действует быстро, зато не тратит силы на недоступные цели."
 ARS_Lina_Arsal: "Лина Арсаль"
 ARS_Lina_Arsal_desc: "Лина Арсаль объединила восточные округа после распада Орвальского союза. Республика опирается на выборную Национальную палату, осторожный бюджет и самостоятельные местные администрации."
 VLD_Irma_Vald: "Ирма Вальд"
 VLD_Irma_Vald_desc: "Ирма Вальд представляет три южные общины, для которых охрана нефтяных складов и прибрежной дороги важнее политики Орвальского союза. Новый совет невелик, но способен быстро собрать ополчение вокруг единственного промышленного узла."
 MON_Marius_II_Arken: "Марий II Аркен"
 MON_Marius_II_Arken_desc: "Марий II завершил Войну пяти знамён и объявил Монтеру наследницей всех северных корон. Император опирается на профессиональную армию, арсенальный пояс и жёсткую лестницу народов: полные права принадлежат ядру империи, а покорённым землям отведено служить её величию."
 # END CONSOLIDATED: ADISCORD_northern_countries_l_russian
 # BEGIN CONSOLIDATED: ADISCORD_southern_desert_l_russian
 KDR_Rashid_al_Kadir: "Рашид аль-Кадир"
 KDR_Rashid_al_Kadir_desc: "Рашид аль-Кадир подчинил караванные дружины Солнечному престолу и объявил главную дорогу священной осью Кадира. Теперь торговля, стража и сбор дани служат одной власти."
 RHM_Faris_Rahma: "Фарис Рахма"
 RHM_Faris_Rahma_desc: "Фарис Рахма был избран первым голосом Круга колодцев — открытого собрания городов красной земли и речных поселений. Его власть держится на согласии общин, а не на праве владеть водой."
 SDR_Hamid_Sahr: "Хамид Сахр"
 SDR_Hamid_Sahr_desc: "Хамид Сахр связал поселения вдоль ломаного сухого русла сетью дозоров и взаимных обязательств. Союз признаёт только те правила, которые помогают пережить очередной сезон пыльных бурь."
 MZR_Ration_Assembly: "Собрание распределителей"
 MZR_Ration_Assembly_desc: "Мазар подчинил хозяйство простому принципу: каждая капля должна принести наибольшую пользу большинству. Представители поселений выбирают распределителей по результатам их работы с запасами и водовозами."
 KYZ_Qanat_Assembly: "Собрание арычных общин"
 KYZ_Qanat_Assembly_desc: "Поселения Кейзана не признают постоянной столицы. Делегаты сходятся у главного водосбора лишь для решения споров о каналах, пастбищах и общей обороне."
 SHL_Jalil_Nur: "Джалиль Нур"
 SHL_Jalil_Nur_desc: "Джалиль Нур представляет девять богатейших промышленных домов Шахрабада. За симметричными золотыми воротами конклава они делят сырьё, рынки и привилегии, недоступные рабочим кварталам."
 GLP_Miran_Veyr: "Миран Вейр"
 GLP_Miran_Veyr_desc: "Миран Вейр представляет торговые дома побережья и судоремонтные предприятия столицы."
 AZH_Samir_Azhar: "Самир Ажар"
 AZH_Samir_Azhar_desc: "Самир Ажар превратил красные округа вокруг Чёрного бассейна в единую военную директорию. Золотое кольцо на знамени обозначает власть центра над землёй, гарнизонами и запасами топлива."
 WEF_Elina_Fenn: "Элина Фенн"
 WEF_Elina_Fenn_desc: "После разрыва с Эфлором Элина Фенн объединила дорожные бригады, муниципалитеты и склады вокруг измеримой программы восстановления. Каждый проект оценивают по тому, сколько людей он соединит и снабдит."
 # END CONSOLIDATED: ADISCORD_southern_desert_l_russian

