 ADISCORD_startup_guide_note:0 "Точные цены, сроки и текущие условия указаны в подсказках фокусов и решений. Справка объясняет, на что обратить внимание."
 ADISCORD_startup_paths_note:0 "§YНАПРАВЛЕНИЯ КАМПАНИИ§!\n\nВыберите путь, чтобы прочитать о нём. Подробные условия скрыты до раскрытия спойлеров.\n\nПросмотр справки не выбирает политический курс."
 ADISCORD_startup_guide_budget:0 "§YСначала проверьте бюджет§!\n\nОткройте экономическую панель через показатель казны. Смотрите не только на остаток денег, но и на доходы, расходы и долговую нагрузку: крупная казна не означает устойчивый бюджет.\n\nДержите резерв на национальные решения. Казна и политическая власть - разные ресурсы; операция может требовать оба, а также людей и оружие. Перед оплатой прочитайте всю строку цены.\n\nНе расходуйте весь запас на одновременные проекты. Учитывайте текущие обязательства и ближайшие сюжетные сроки; платная подготовка полезна только тогда, когда её удастся завершить."
 ADISCORD_startup_guide_army:0 "§YСнабжение важнее числа дивизий§!\n\nПроверьте нехватку вооружения в логистике, пополнение существующих частей и запас людских ресурсов. Новые формирования конкурируют с действующей армией за реальные ресурсы.\n\nСопоставляйте производственные линии с составом своих дивизий. Пехотное вооружение, поддержка и артиллерия должны поступать туда, где уже есть потребность; лишние планы набора не создают запасы.\n\nПеред наступлением проверьте пути снабжения и пропускную способность железных дорог. Удалённые фронты и повреждённые узлы могут остановить даже хорошо вооружённую армию.\n\nОбещанные, оплаченные и уже развёрнутые формирования - разные вещи. Читайте условия их выдачи и получателя."
 ADISCORD_startup_guide_diplomacy:0 "§YДипломатия проходит через сюжет§!\n\nОбъявление войны, создание альянса и вступление в него доступны через предусмотренные фокусы, решения и события. Обычные дипломатические кнопки не заменяют эти действия.\n\nПроверяйте, что открывает выбранный фокус: немедленный результат, предложение другой стране или отдельное платное решение. Полученное предложение ещё не означает заключённую сделку. В дереве Кефрейта строка §GДЕРЕВО ФОКУСОВ§! прямо перечисляет скрытые фокусы, которые может раскрыть текущий фокус. Жёлтая строка прогрессии означает, что нужны дополнительные фокусы или условия мира.\n\nПеред выбором стороны прочитайте условия мира и участия союзников. Внешняя война может продолжаться после завершения внутреннего конфликта.\n\nСледите за активными миссиями и сроками: ожидание удобного момента не обязательно останавливает сюжетный кризис."
