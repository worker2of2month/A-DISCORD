 ADISCORD_startup_world_body:0 "§YКАК МИР ПРИШЁЛ К 2160 ГОДУ§!\n\n§YВейранская эпоха§!\nДолгое время главной силой Форула была Вейранская империя. Её монархии опирались на наследственные привилегии, коронные учреждения и армию. Экспансия создавала зависимые территории, гарнизоны и дороги, связывавшие их с центром. Реакторный проект обещал энергию городам и производству, но доступ к новым технологиям контролировала прежняя власть.\n\n§YКатастрофа 2130 года§!\nРазрушение реактора оставило вокруг него разорённый промышленный пояс. Погибли люди, семьи потеряли связь друг с другом, уцелевшие искали убежище под землёй. Вслед за катастрофой пришла Первая революция. Она изменила политическое устройство страны, но не устранила оставленные бедствием разрушения.\n\n§YПервая революция§!\nМонархия Вейранской империи была свергнута. Императорский двор разогнали, коронную администрацию распустили, а новая республика получила название Воркерланд. Победа над престолом стала основанием её законности.\n\nВместе со старой властью была сломана единая система управления. Армейские штабы спорили с партийными комитетами, округа сохраняли чрезвычайные полномочия, а после чисток ведомствам не хватало опытных служащих. Компромисс с противниками легко объявляли попыткой реставрации.\n\n§YПереход без конечной даты§!\nНикита Уоркер обещал удержать страну до завершения революции и восстановления хозяйства. Конституция и конфедеративное устройство должны были согласовать полномочия центра, автономных республик и зависимых администраций. Однако восстановление стало основанием снова откладывать выборы и продлевать чрезвычайную власть.\n\nРеспублика проводила принудительную унификацию: местные языки и названия вытеснялись из школ и реестров, общины теряли земли, людей переселяли. Смена режима не разрешила противоречий между общегосударственным порядком и правами населения.\n\n§YХозяйство после потрясений§!\nКонтинент сохранил реакторы, авиацию, вычислительные комплексы и оружейные заводы. Развитая промышленность соседствовала с повреждёнными дорогами и поселениями, зависевшими от одного исправного источника воды. Власть приходилось подтверждать поставками, ремонтом и работающей связью. Истощённая конфедерация всё чаще заменяла долгие проекты аварийными мерами, пока местные администрации удерживали ресурсы для собственных нужд.\n\n§Y1 января 2160 года§!\nВоркерланд ещё объединяет разнородные территории, но их отчёты расходятся в налогах, воинских обязательствах и действующих указах. У округов есть собственные администрации и войска, а надёжная передача общей власти не закреплена. Ослабление государства, десятилетиями определявшего положение континента, ставит под вопрос договоры и хозяйственные связи далеко за его границами. С этим наследством Форул вступает в новую эпоху."
