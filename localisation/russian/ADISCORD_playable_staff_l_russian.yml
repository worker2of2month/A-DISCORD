l_russian:
 STP_qol_baseline_tt: "Открываются базовые специалисты, промышленные компании и конструкторы. Назначения оплачиваются отдельно политической властью; новые штатные командиры прибывают один раз."
 STP_qol_elite_administration_tt: "Открываются ведущие специалисты администрации. Их можно назначить отдельно за §Y125§! £political_power_texticon; существующий кабинет не заменяется автоматически."
