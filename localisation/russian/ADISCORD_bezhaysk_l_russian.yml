l_russian:
 ADISCORD_bezhaysk_postwar_operations:0 "Бежайские послевоенные операции"
 ADISCORD_bezhaysk_postwar_operations_desc:0 "После падения Бежайска соседние территории можно подчинять через зависимые администрации, не разрушая местную карту прямой аннексией."
 ADISCORD_bezhaysk_subjugate_forest_val:0 "Операция против Культа Детей Леса"
 ADISCORD_bezhaysk_subjugate_forest_val_desc:0 "Флаем Прана и Хибара деда Лишая остаются за пределами нового порядка. Кефрейт может провести отдельную позднюю кампанию и после победы оформить территорию как договорную администрацию."
 ADISCORD_bezhaysk_subjugate_forest_nod:0 "Подчинить Культ Детей Леса"
 ADISCORD_bezhaysk_subjugate_forest_nod_desc:0 "Старая ограниченная северная кампания не предполагала ликвидацию Культа. После бежайского урегулирования Нодрул может начать отдельную войну и установить над Флаем Праной постоянное попечительство."
 autonomy_NOD_protected_administration:0 "Нодрульское попечительство"
