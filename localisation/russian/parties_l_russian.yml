  steland_liberationism: "Стеландский либерационизм"
  steland_liberationism_desc: "§YСтеландский либерационизм§!\n\nСтеландский либерационизм вырастает из сопротивления партийной опеке, внешней зависимости и рабству. Освобождение страны считается незавершённым, пока её жители зависят от произвола нового победителя. Военная заслуга даёт право быть услышанным, но не право бессрочно говорить от имени всего Стеланда.\n\nСторонники этого курса стремятся передать политический мандат представительному собранию, закрепить полномочия учреждений и поставить личный указ ниже общего закона. Горные советы, города и люди, вернувшиеся из зависимости, должны получить место в восстановленной стране. Хозяйственное восстановление оценивается также по тому, возвращает ли оно человеку самостоятельность и возможность свободно трудиться.\n\nОтказ от личной гегемонии не означает отказа от борьбы с работорговлей. Либерационистам приходится совместить освободительные обязательства с контролем над собственной армией и правительством. Их проект выдержит проверку лишь тогда, когда несогласие с руководством перестанет считаться предательством самой свободы."
  steland_military_etatism: "Стеландский военный этатизм"
  steland_military_etatism_desc: "§YСтеландский военный этатизм§!\n\nСтеландский военный этатизм ставит организованную службу выше соперничества партийных домов. Военная коллегия Августа Вейла видит в армии учреждение, способное удержать страну, когда личные связи и политические сделки перестают действовать. Право командовать должно подтверждаться дисциплиной, подготовкой и ответственностью за исполнение приказа.\n\nСнабжение, восстановление дорог и распределение ресурсов подчиняются потребностям единой государственной системы. Гражданские учреждения сохраняются, но их отношения со штабом требуют ясного разграничения полномочий. В одном устройстве армия становится профессиональной службой под общим законом; в другом командование получает постоянное право вмешиваться в управление ради порядка.\n\nДля сторонников военная организация обещает защиту от распада и произвола влиятельных фамилий. Её слабость заключается в соблазне применять командный метод к любому общественному спору. Будущее этого курса зависит от того, остаётся ли офицер ответственным перед государством или само государство становится продолжением офицерской коллегии."
  steland_security_etatism: "Стеландский охранный этатизм"
  steland_security_etatism_desc: "§YСтеландский охранный этатизм§!\n\nСтеландский охранный этатизм связывает устойчивость государства с непрерывной работой службы безопасности. Для Веры Корвиной угроза начинается задолго до открытого мятежа: в непрозрачных назначениях, частных сетях влияния и учреждениях, исполняющих чужие распоряжения. Власть должна знать, кому доверены полномочия и кто несёт ответственность за их использование.\n\nПартия превращается в опору единого управления, а проверка кадров, учёт решений и предупреждение внутренних угроз становятся повседневной практикой. Такая система стремится защитить снабжение и администрацию от захвата отдельными покровителями. При этом положение самой службы может определяться судебным надзором или закреплённой неприкосновенностью её сотрудников.\n\nОхранный порядок обещает преемственность там, где всё прежде зависело от личной верности. Но закрытость сведений даёт их хранителям возможность решать, что считать опасностью. Если обвинение невозможно оспорить, безопасность учреждений незаметно превращается в безопасность тех, кто контролирует проверку."
  steland_military_directory: "Стеландская военная директория"
  steland_military_directory_desc: "§YСтеландская военная директория§!\n\nСтеландская военная директория обосновывает свою власть необходимостью удержать страну в переходный период. Штаб принимает управление на названный срок, пока последствия войны мешают передать его устойчивым гражданским учреждениям. Мандат принадлежит военному руководству как временному органу, а не партии или основателю с пожизненным правом решения.\n\nПервоочередными задачами становятся единое командование, снабжение, безопасность дорог и возвращение администрации к работе. Директория стремится сохранить собранную армию и предотвратить борьбу местных сил за оставшиеся ресурсы. Политическое переустройство откладывается до условий, в которых его результат можно будет исполнить на всей территории страны.\n\nИменно временный характер отличает этот порядок от постоянной военной опеки. Однако готовность общества к гражданскому правлению оценивают те же люди, которые пока осуществляют власть. Достоверность обещания зависит от того, останется ли срок обязательством или очередная угроза позволит штабу снова перенести передачу полномочий."
  national_legitimism: "Национальный легитимизм"
  national_legitimism_desc: "§YНациональный легитимизм§!\n\nНациональный легитимизм связывает законность государства с мандатом основателя, способного выразить общую волю страны в момент её освобождения. В стеландском движении таким основанием становится борьба Максима Шабрата против партийного порядка и внешней зависимости. Единство народа понимается как продолжение этого дела, а верность его руководителю - как гарантия от возвращения прежних хозяев.\n\nУчреждения, армия и хозяйственное восстановление выстраиваются вокруг личной ответственности главы государства. Местные представители могут участвовать в управлении, однако последнее решение сохраняется за носителем освободительного мандата. Борьба с рабством, укрепление самостоятельности и поддержка сторонников служат доказательствами того, что историческое поручение ещё исполняется.\n\nСила такой системы заключается в узнаваемом центре власти и общей памяти сопротивления. Её уязвимость обнаруживается там, где невозможно отделить интерес страны от воли основателя. Без признанного способа ограничить или передать мандат каждое несогласие рискует стать проверкой верности, а вопрос преемственности - новым государственным кризисом."
  tff_emergency_war_coordinator: "Чрезвычайный военный координатор"
  tff_emergency_war_coordinator_desc: "§YЧрезвычайный военный координатор§!\n\nВольный Фронтир не признаёт необходимости постоянного правительства, но совместная оборона требует согласованных действий. Чрезвычайный военный координатор получает ограниченный мандат общин: свести разрозненные отряды, наладить снабжение и организовать сопротивление общей угрозе. Это полномочие на определённую работу, а не право распоряжаться всей жизнью поселений.\n\nАссамблея сохраняет политическую роль, местные общины - собственное управление. Координатор связывает рейнджеров, склады и пути сообщения, добивается исполнения согласованных обязательств и представляет общие военные потребности. Его авторитет зависит от доверия участников и способности защищать их свободу без превращения добровольного союза в подчинённую территорию.\n\nЗатяжная война испытывает этот порядок особенно тяжело. Контроль над оружием и распределением припасов может дать штабу больше власти, чем предусмотрено мандатом. Для Фронтира успех обороны поэтому включает и сохранение возможности отозвать полномочия человека, которому пришлось доверить её руководство."
  VEL_pragmatism_party: "Совет кантонов"
