  humanism_ideology: "Гуманизм"
  humanism_ideology_desc: "§YГуманизм§!\n\nПосле войн, распада держав и торговли людьми гуманисты отстаивают право человека не быть собственностью правителя, рода или государства. Достоинство не требуется заслуживать происхождением, полезностью или верностью вождю. Власть получает право управлять лишь постольку, поскольку защищает жизнь, личную свободу и равенство перед законом.\n\nГуманистический порядок опирается на представительные собрания, независимый суд и возможность сменить правительство без войны. Образование, медицинская помощь и защита труда должны сделать эти права доступными за пределами благополучных кварталов. Сторонники могут спорить о собственности и роли рынка, но отвергают рабство и превращение чрезвычайных полномочий в постоянную привилегию.\n\nНа Форуле подобная программа сталкивается с разрушенными учреждениями, вооружёнными соседями и обществами, привыкшими искать защитника вместо закона. Главная проверка гуманизма наступает тогда, когда безопасность требует ограничений: сможет ли республика защитить своих жителей, сохранив за ними право возражать самой республике?"
  utilitarism_ideology: "Утилитаризм"
  utilitarism_ideology_desc: "§YУтилитаризм§!\n\nУтилитаристы предлагают судить о власти по последствиям её решений. Накормленные города, восстановленные дороги и предотвращённые смерти значат больше, чем древность династии или красота политического лозунга. Правильным считается устройство, которое приносит наибольшее общее благо при доступных ресурсах.\n\nТакой подход отдаёт важную роль плановым комитетам, учёту потребностей и отбору руководителей по результатам работы. Промышленность, снабжение и общественные службы рассматриваются как части одной системы; частную инициативу поддерживают или ограничивают в зависимости от её пользы. Юборский комитет производства выражает эту традицию особенно ясно: коллективная ведомость должна пережить любого отдельного руководителя.\n\nОднако общая польза не распределяется поровну. За улучшением средних показателей могут скрываться истощённые рабочие, забытые поселения и решения, принятые без согласия тех, кто заплатит за них. Главный спор утилитаризма касается права определять меру блага и тех жертв, которых государство вправе требовать ради будущего результата."
  utilitarian_accelerationism: "Утилитарный акселерационизм"
  utilitarian_accelerationism_desc: "§YУтилитарный акселерационизм§!\n\nУтилитарный акселерационизм Антона Багли связывает законность власти с проверяемой поставкой: продовольствием, оружием, работающими предприятиями. Наследство и революционная риторика не заменяют выполненного обязательства. Государство должно ускорить восстановление настолько, чтобы общество ощутило результат раньше, чем иссякнет его готовность терпеть лишения.\n\nПравительство публикует паёк, нормы выработки и сроки, связывая администрацию собственными обещаниями. Производственные комитеты сводят потребности фронта и тыла, перераспределяют труд и требуют отчёта за срыв снабжения. Успех отдельного учреждения оценивают по его вкладу в общую программу, а замедление рассматривают как угрозу существованию республики.\n\nОткрытая ведомость позволяет увидеть провал, но не решает, насколько справедлива сама норма. Стремление непрерывно ускорять выпуск способно превратить рабочего в расходный ресурс, а несогласие - в помеху поставкам. Спор вокруг этого курса касается предела жертв, которые можно требовать сегодня во имя измеримого благополучия завтра."
  pragmatism_ideology: "Прагматизм"
  pragmatism_ideology_desc: "§YПрагматизм§!\n\nПрагматизм ставит сохранение работающего порядка выше верности единой доктрине. После крушения старых держав его сторонники ищут решения, которые позволят открыть склады, договориться с местными властями и удержать дороги. Право управлять доказывается способностью решать ближайшие задачи и приспосабливаться к изменившимся обстоятельствам.\n\nПрагматическое правительство может сочетать выборные учреждения с сильной исполнительной властью, частное производство с государственными заказами, старые должности с новыми соглашениями. Реформы оценивают по их выполнимости, а компромисс считают обычным инструментом политики. Поэтому под общим названием соседствуют весьма разные режимы, объединённые недоверием к обещаниям окончательного переустройства мира.\n\nГибкость помогает пережить кризис, но сама по себе не устанавливает пределов власти. Временные меры легко становятся привычными, а необходимость - оправданием любого удобного решения. Судьба такого порядка зависит от того, существуют ли правила, по которым общество может потребовать отчёта у людей, объявивших себя незаменимыми управляющими."
  vorkerism: "Воркеризм"
  vorkerism_desc: "§YВоркеризм§!\n\nВоркеризм - официальная идеология Воркерланда, получившего это название после революции и падения Вейранской империи. Она утверждает, что первая революция не завершена: пока страна не восстановлена, центральная власть вправе откладывать выборы, продлевать чрезвычайные полномочия и управлять республиками через временные администрации. Переход не имеет конечной даты, а любое возражение можно объявить угрозой ещё не построенному порядку.\n\nКонфедерацию удерживают личный авторитет Никиты Уоркера, связь между учреждениями и распределение ресурсов через общий центр. Республиканское обещание сосуществует с унаследованными способами управления, а самостоятельность территорий - с требованием подчиняться очередной чрезвычайной задаче. Работающая система снабжения становится повседневным доказательством необходимости продолжать переход.\n\nРежим неустойчив по самой своей конструкции: округа уже располагают собственными администрациями и вооружёнными силами, тогда как общая власть не закрепила независимого от руководителя порядка преемственности. Стоит прерваться связи или поставкам, и временное неповиновение может превратиться в постоянную границу.\n\n\n\n\n\n £GFX_vorkerism_banner \n\n\n"
  neo_vorkerism: "Неоворкеризм"
  neo_vorkerism_desc: "§YНеоворкеризм§!\n\nНеоворкеризм - мобилизационное продолжение воркеризма после разрушения Башни Единства и новой революции. Старую конфедерацию больше не считают действующим договором. Её предстоит собрать заново вокруг уцелевшего центра, советов лоялистов и личного мандата Никиты Уоркера, представленного последним носителем общего республиканского дела.\n\nЧрезвычайные полномочия и военное управление становятся основой возвращения отколовшихся республик. Хозяйство подчиняют снабжению верных частей и восстановлению связи, политическое участие связывают с готовностью защищать революцию. Прежние компромиссы с местными элитами пересматриваются как уступки, позволившие разрушить единство страны.\n\nСторонники видят в этом очищение республики от имперской инерции и измены. Для противников это осаждённый режим, в котором культ Уоркера заменяет обещанный переход к правлению по закону. Чем дольше длится борьба за объединение, тем труднее назвать момент, когда чрезвычайная власть должна будет закончиться.\n\n\n\n\n\n £GFX_neo_vorkerism_banner \n\n\n"
  imperial_restorationism: "Имперский реставрационизм"
  imperial_restorationism_desc: "§YИмперский реставрационизм§!\n\nИмперский реставрационизм Влада Петрищева утверждает, что после распада нужно восстановить прежде всего непрерывность власти. Законный порядок для его сторонников - это иерархия должностей, прав и обязанностей, способная действовать независимо от настроения площади. Вейранская империя оставила учреждения, которые ещё можно заставить работать, даже если прежняя корона не вернётся.\n\nКанцелярия возвращает себе право указа, офицерские дома - владения и звания, гражданская администрация - обязанность исполнять решения центра. Реестры, коронные комиссии и признанная служба становятся основаниями полномочий. Восстановление дорог, сборов и снабжения должно заново связать территории единой системой управления.\n\nЭтот курс обещает предсказуемость людям, уставшим от временных правительств и разорванных обязательств. Вместе с учреждениями, однако, возвращаются сословные преимущества и зависимость от тех, кто удостоверяет законность чужих прав. Республика рискует сохранить своё имя лишь как оболочку имперского порядка.\n\n\n\n\n\n £GFX_imperial_restorationism_banner \n\n\n"
  technocracy_ideology: "Технократия"
  technocracy_ideology_desc: "§YТехнократия§!\n\nТехнократия исходит из убеждения, что сложное общество должно управляться людьми, понимающими устройство его систем. Энергетика, медицина, транспорт и промышленность требуют знаний, которых не дают ни наследственный титул, ни популярность на площади. Основанием власти объявляются доказанная компетентность и способность принимать проверяемые решения.\n\nВ управлении преобладают инженерные коллегии, исследовательские учреждения и профессиональная администрация. Ресурсы направляются на образование, восстановление инфраструктуры и внедрение разработок; проекты проходят расчёт и испытания. В разрушенных странах Форула обещание вернуть воду, свет и связь нередко убеждает сильнее любой политической программы.\n\nНо знание того, как построить систему, ещё не определяет, кому она должна служить. Замкнутая коллегия способна подменить общественный выбор техническим заключением, а неудобные потребности - плохими данными. Различие между подотчётной службой специалистов и их несменяемой властью проходит по праву обычного человека оспорить решение эксперта."
  dorian_technocracy: "Акселерационистская технократия"
  dorian_technocracy_desc: "§YАкселерационистская технократия§!\n\nДориан Воркс связывает право управлять с доказанной способностью восстановить разрушенную страну. Инженеры, статистики и опытные служащие должны вернуть энергетику, транспорт и производство в рабочее состояние. Его программа требует публичной отчётности и прямой ответственности администрации за использованные ресурсы и полученный результат.\n\nДиректория объединяет исследовательские учреждения, заводские конструкторские бюро и гражданские службы. Их задача - ускорять научное и промышленное развитие, сокращая путь от открытия через испытание к массовому внедрению. Каждая успешная разработка должна расширять возможности для следующего шага, чтобы восстановление страны переходило в непрерывное технологическое преобразование. Решения опираются на измеримые данные и контролируемые испытания; неудачи требуют пересмотра программы. Ни авторитет руководителя, ни вывод алгоритма не снимают ответственности за последствия. Объединение Воркерланда понимается как создание общей сети работающих учреждений, способной поддерживать восстановление страны.\n\nСторонники Воркса видят в профессиональном управлении выход из соперничества личных мандатов. Но отчёт о выполненном проекте ещё не заменяет согласия с его целью. Директории предстоит доказать, что компетентность служит обществу, а общество сохраняет право выбирать задачи, ради которых работают её специалисты."
  anarchism_ideology: "Анархия"
  anarchism_ideology_desc: "§YАнархизм§!\n\nАнархисты видят в постоянной власти над человеком источник зависимости, войн и присвоения общего труда. Они предлагают строить общество из самоуправляющихся общин, собраний и добровольных союзов. Решения должны приниматься теми, кого они затрагивают, а делегат не получает права навсегда распоряжаться доверившимися ему людьми.\n\nЕдиного анархического уклада на Форуле нет. Поселения Вольного Фронтира связывают свободу с местной самостоятельностью и защитой дорог; лесные общины опираются на взаимопомощь, обычай и знание своей земли. Производство, обмен и оборону согласуют через договорённости между участниками, не признавая за далёкой столицей безусловного права на налог и мобилизацию.\n\nОтсутствие общего центра затрудняет захват страны, но осложняет и совместный ответ на голод или вторжение. Вооружённый защитник, богатый посредник либо почитаемый хранитель может приобрести власть без официальной должности. Поэтому сохранение свободы требует следить не только за появлением государства, но и за неформальным господством внутри самой общины."
  etatism_ideology: "Этатизм"
  etatism_ideology_desc: "§YЭтатизм§!\n\nДля этатистов государство является условием самого существования общества. Пока никто не способен охранять границу, исполнять закон и обеспечивать снабжение, свободы и договоры остаются обещаниями без защиты. Поэтому восстановление единой власти получает приоритет над соперничеством партий, местными привилегиями и частными интересами.\n\nЭтатистический порядок опирается на постоянную администрацию, силовые учреждения и обязательную службу. Стратегические отрасли подчиняются государственным задачам, хотя собственность может оставаться частной. На Форуле это убеждение объединяет дисциплинированные республики, военные правительства и режимы, связывающие безопасность с личной верностью начальству.\n\nСильные учреждения позволяют собрать ресурсы и пережить угрозу, перед которой отдельная община бессильна. Однако аппарат легко начинает охранять собственное положение вместо общества. Главный вопрос этатизма - кто устанавливает границы государственной необходимости и может ли гражданин добиться защиты от тех, кто обязан его защищать."
  appanage_revanchism: "Удельный реваншизм"
  appanage_revanchism_desc: "§YУдельный реваншизм§!\n\nУдельный реваншизм объявляет империи главным бедствием человеческой истории. Собирая земли под одной короной, они вырывают общины из привычного уклада, подчиняют местных правителей далёким столицам и превращают целые народы в расходный материал завоеваний. Его сторонники требуют уничтожить имперские центры и вернуть мир к наследственным уделам, личным клятвам и сословным обязанностям.\n\nНа месте единого закона должны стоять местный обычай и вассальный договор, на месте имперской бюрократии - двор владельца, на месте массовых армий - дружины и ополчения. Земля и труд связываются с обязанностями перед сеньором. Ради этого возвращения допускается последнее объединённое войско, призванное сокрушить державы, способные вновь собрать мир воедино.\n\nПобедой реваншисты считают мир множества владений, где ни один престол не возвышается над всеми остальными. Но обещанное освобождение принадлежит прежде всего самим уделам: человеку внутри них отведено место в сословной лестнице. Остаётся и другое противоречие: кто заставит победоносное общее войско отказаться от власти, необходимой для уничтожения империй?\n\n\n\n\n\n £GFX_appanage_revanchism_banner \n\n\n"
  contractual_etatism: "Контрактный этатизм"
  contractual_etatism_desc: "§YКонтрактный этатизм§!\n\nКонтрактный этатизм Государственной партии Кефрейта рассматривает государство как верховного гаранта обязательств между фабриками, военными ротами, посредниками и гражданами. В стране, где отравленная земля производит винтовки лучше, чем хлеб, исполненный договор становится условием выживания. Власть Валеры Солгалова опирается на способность придать обещанию обязательную силу.\n\nЕдиный реестр, согласованные ставки и доступ к арсеналам связывают капитанов с центром. Государство охраняет производство, взыскивает долги и обеспечивает внешние поставки, превращая военную силу в оплачиваемую услугу. Чужие конфликты дают Кефрейту рынки сбыта, продовольствие и влияние; концессии и охранные обязательства закрепляют присутствие там, где одной торговли уже недостаточно.\n\nПредсказуемая цена делает этот порядок удобным для заказчика, но не гарантирует равенства договаривающихся сторон. Тот, кто контролирует оружие и взыскание, способен навязать сами условия. Зависимость страны от военного спроса означает, что прекращение чужой войны может угрожать её благополучию почти так же сильно, как поражение в собственной.\n\n\n\n\n\n £GFX_contractual_etatism_banner \n\n\n"
  hedonism_ideology: "Классический Гедонизм"
  hedonism_ideology_desc: "§YКлассический гедонизм§!\n\nГедонизм провозглашает достойную, приятную жизнь самостоятельной целью политики. Человеку не следует бесконечно жертвовать настоящим ради будущей победы, величия государства или долга перед предками. Мир, телесная свобода, искусство и доступ к удовольствиям становятся основаниями общественного согласия.\n\nНа Форуле этот язык особенно силён там, где поколения жили под угрозой войны. Торговля, курорты, зрелища и производство предметов потребления дают власти видимое доказательство успеха. Нодрулская революция превратила подобное обещание в политическую традицию, влияние которой распространилось далеко за пределы самой республики.\n\nРазличные гедонистические течения спорят прежде всего о том, кому доступно благополучие и кто оплачивает его сохранение. Личная свобода может соседствовать с закрытой политикой, а роскошь - с принудительным трудом за её фасадом. Поэтому изобилие само по себе ещё не отвечает на вопрос, распространяется ли обещанное право на счастливую жизнь на всех жителей страны."
  radical_hedonism: "Радикальный гедонизм"
  radical_hedonism_desc: "§YРадикальный гедонизм§!\n\nРадикальный гедонизм объявляет наслаждение жизнью правом, которое старая аристократия присвоила себе. Руфус Хедерсетт обещает открыть закрытые сады, клубы и праздничные площади, распространив благополучие за пределы избранных фамилий. Свобода личных нравов и доступ к удовольствиям становятся языком политического освобождения.\n\nГосударство должно обеспечить изобилие и зрелища, а партия - устранить препятствия перед этим обещанием. Перераспределение доступа к роскоши требует работающих мастерских, поставщиков, портов и новых способов оплачивать массовое потребление. На место наследственного покровительства могут прийти более широкое участие либо новые связи между аппаратом и распорядителями праздника.\n\nРадикальность программы проверяется судьбой тех, кто обслуживает чужое удовольствие. Открытые ворота дворца мало меняют, если зависимость работников остаётся прежней. Движение рискует сменить круг привилегированных, сохранив порядок, в котором лояльность покупается доступом к благам, а власть определяет цену участия."
  commercial_hedonism: "Коммерческий гедонизм"
  commercial_hedonism_desc: "§YКоммерческий гедонизм§!\n\nКоммерческий гедонизм связывает благополучие общества с оборотом товаров, услуг и удовольствий. Для Павла Ланского процветание начинается с работающего порта, надёжного кредита и исполненного договора. Стремление людей к удобству и роскоши должно создавать спрос, обеспечивающий мастерские заказами, а жителей - заработком.\n\nГосударство охраняет собственность, разрешает споры и поддерживает торговую инфраструктуру. Его успех выражается в устойчивости расчётов и возможности превратить предприимчивость в достаток. Этот порядок способен опираться как на независимых производителей, так и на крупные торговые Дома, которые финансируют восстановление в обмен на влияние и гарантии.\n\nРост оборота не обязательно означает рост самостоятельности. Долги могут связать страну с кредиторами, а владение причалами и складами - закрыть рынок для новых участников. Поэтому главный спор коммерческого гедонизма касается доступа к источникам богатства: насколько широко распределяются плоды торговли и кто получает право устанавливать её условия."
  patronal_hedonism: "Патрональный гедонизм"
  patronal_hedonism_desc: "§YПатрональный гедонизм§!\n\nПатрональный гедонизм оправдывает власть способностью покровителя сохранить привычный уклад и вернуть утраченное благополучие. Эдгар Реннер предлагает Стеландеру восстановление под защитой Нодрула: помощь, специалистов и гарантии в обмен на признание северных интересов. Безопасность и достаток становятся содержанием личной и государственной зависимости.\n\nМестные элиты сохраняют своё положение, пока исполняют обязательства перед покровителем и поддерживают порядок. Советники, кредит и внешние связи помогают вернуть хозяйство к работе, одновременно определяя пределы самостоятельной политики. Собственные учреждения могут постепенно расширять пространство для решений; передача полномочий представителям покровителя закрепляет опеку.\n\nСторонники видят в таком соглашении посильную цену за мир и восстановление. Противники указывают, что помощь трудно отличить от управления, когда её прекращение угрожает самому существованию режима. Устойчивость регентства зависит от способности превращать поддержку в собственные силы, а не в бесконечное продление чужих гарантий."
  aristocratic_hedonism: "Аристократический гедонизм"
  aristocratic_hedonism_desc: "§YАристократический гедонизм§!\n\nАристократический гедонизм выражает убеждение Высших Домов в том, что власть принадлежит признанным фамилиям, собственникам и хранителям культурной традиции. Земля, богатство, покровительство искусствам и воспитанный вкус служат основаниями общественного положения. Сохранение безопасной и прекрасной жизни объявляется высшим достижением цивилизации.\n\nПалата защищает имущественные права, связывает назначения с поручительством влиятельных семей и поддерживает торговлю, курорты и индустрию удовольствий. Обычному жителю обещают мир, заработок и бытовую свободу в обмен на политическое доверие к элите. В Стеландере этот договор питается памятью о бомбардировках: страх возвращения войны поддерживает порядок даже там, где его процветание скрывает зависимость и торговлю людьми.\n\nСогласие между Домами требует определить цену их привилегий. Общие налоги, публичный реестр и ответственность перед округами способны ограничить покровителей; наследственные кресла и местные льготы закрепляют их обособленность. Спор идёт о пределах обязанностей элиты и о том, кому позволено потребовать их исполнения.\n\n\n\n\n\n £GFX_aristocratic_hedonism_banner \n\n\n"
  chauvinism_ideology: "Шовинизм"
  chauvinism_ideology_desc: "§YШовинизм§!\n\nШовинизм разделяет общество на тех, кому принадлежит страна, и тех, чьё присутствие нуждается в оправдании. Основанием превосходства могут служить нация, культура, происхождение или сословие. Государство призвано охранять первенство избранной общности, а равенство перед законом уступает место различию между своими и чужими.\n\nНа Форуле эта идея принимает разные формы: от требования единой национальной территории до защиты наследственного ранга и военной чести правящих домов. Власть укрепляет общий исторический миф, требует дисциплины и направляет хозяйство на сохранение силы. Внутреннее несогласие легко объявить изменой, а соседнюю землю - частью утраченного наследства.\n\nОбещание единства привлекает людей, переживших поражение, распад или зависимость. Но расширение круга врагов становится удобным способом объяснять бедность и неудачи правителей. Порядок, основанный на неравной ценности людей, нуждается в постоянном принуждении и оставляет мало места для примирения с теми, кого однажды исключили из политического сообщества.\n\n\n\n\n\n £GFX_chauvinism_banner \n\n\n"

