l_russian:
  superevent_vorkerland_civilwar_title: "Гражданская война в Воркерланде"
  superevent_vorkerland_civilwar_quote: "Война лишает людей лёгкого удовлетворения повседневных нужд и потому оказывается суровым учителем.\n\n- Фукидид, \"История\", III, 82"
  superevent_vorkerland_civilwar_comment: "Государство оказалось менее прочным, чем его границы"

  superevent_vorkerland_dirty_opening_title: "Падение Периметра"
  superevent_vorkerland_dirty_opening_quote: "Я покажу тебе страх в горсти праха.\n\n- Т. С. Элиот, \"Бесплодная земля\""
  superevent_vorkerland_dirty_opening_comment: "За Периметром снова появились дороги, карты и претенденты"

  superevent_vorkerland_worker_victory_title: "Возрождение Конфедерации"
  superevent_vorkerland_worker_victory_quote: "Согласием малые государства возвышаются, раздором величайшие рушатся.\n\n- Саллюстий, \"Югуртинская война\""
  superevent_vorkerland_worker_victory_comment: "Воркер собрал Конфедерацию заново"

  superevent_vorkerland_utilitarian_victory_title: "Утилитарная республика"
  superevent_vorkerland_utilitarian_victory_quote: "Величайшее счастье величайшего числа - мера правильного и неправильного.\n\n- Иеремия Бентам"
  superevent_vorkerland_utilitarian_victory_comment: "Антон Багли подчинил новый порядок измеримой общественной пользе"

  superevent_vorkerland_vlad_victory_title: "Имперская реставрация"
  superevent_vorkerland_vlad_victory_quote: "Где они создают пустыню, они называют это миром.\n\n- Тацит, \"Агрикола\", 30"
  superevent_vorkerland_vlad_victory_comment: "Влад Петричев вернул единство на штыках"

  superevent_vorkerland_dorian_victory_title: "Воркеландское поле экспериментов"
  superevent_vorkerland_dorian_victory_quote: "Управление людьми заменяется управлением вещами и руководством процессами производства.\n\n- Фридрих Энгельс, \"Анти-Дюринг\""
  superevent_vorkerland_dorian_victory_comment: "Воркерланд передан тем, кто умеет считать, строить и управлять"

  superevent_stelander_empire_title: "Провозглашение стеландского имперского союза!"
  superevent_stelander_empire_quote: "Самый дешёвый вид гордости - национальная гордость.\n\n- Артур Шопенгауэр, \"Афоризмы житейской мудрости\""
  superevent_stelander_empire_comment: "Стеландер снова поднимает голову"

  superevent_stelander_party_victory_title: "Победа партии в Стеландере"
  superevent_stelander_party_victory_quote: "Цель власти - власть.\n\n- Джордж Оруэлл, \"1984\""
  superevent_stelander_party_victory_comment: "Партийная власть сохранена"

  superevent_stelander_shabrat_victory_title: "Победа Шабрата в Стеландере"
  superevent_stelander_shabrat_victory_quote: "Всё прошлое - лишь пролог.\n\n- Уильям Шекспир, \"Буря\""
  superevent_stelander_shabrat_victory_comment: "Гражданская война окончена"

  superevent_nam_resource_war_title: "Ресурсная война"
  superevent_nam_resource_war_quote: "Немногие наживаются - многие платят.\n\n- Смедли Батлер, \"Война - это рэкет\""
  superevent_nam_resource_war_comment: "За месторождения платят кровью"

  superevent_rus_last_empire_title: "Последняя империя"
  superevent_rus_last_empire_quote: "Соглашения без меча - лишь слова.\n\n- Томас Гоббс, \"Левиафан\""
  superevent_rus_last_empire_comment: "Хан занял императорский престол"

  superevent_val_commonwealth_title: "Провозглашено Кефрейтское содружество!"
  superevent_val_commonwealth_quote: "Республика есть дело народа.\n\n- Цицерон, \"О государстве\""
  superevent_val_commonwealth_comment: "Солгалов связал договорные администрации в единый порядок"

 # Cicero, De legibus III.8: https://www.thelatinlibrary.com/cicero/leg3.shtml
 superevent_val_council_proclamation_title:0 "[VAL.GetName]"
 superevent_val_council_proclamation_quote:0 "Благо народа да будет высшим законом.\n\n- Цицерон, \"О законах\", III, 8"
 superevent_val_council_proclamation_comment:0 "За страну отвечаем мы."

 superevent_south_war_title: "Война за Юг"
 superevent_south_war_quote: "Война есть лишь продолжение политики другими средствами.\n\n- Карл фон Клаузевиц, \"О войне\", I, 1"
 superevent_south_war_comment: "Пустыня снова стала фронтом."

  superevent_stelander_great_title: "Провозглашён Великий Стеландер!"
  superevent_stelander_great_quote: "$superevent_stelander_party_victory_quote$"
  superevent_stelander_great_comment: "Северные правительства подчинены единому центру"

  superevent_inactive_title: ""
  superevent_inactive_quote: ""
  superevent_inactive_comment: ""
 superevent_rus_black_banner_title:0 "ИМПЕРИЯ ЧЁРНОГО ЗНАМЕНИ"
 superevent_rus_black_banner_quote:0 "Смотри на солдат как на своих детей, и они пойдут за тобой в самые глубокие долины.\n\n- Сунь-цзы, \"Искусство войны\", X"
 superevent_rus_black_banner_comment:0 "Держать общий строй."
 superevent_rus_restoration_title:0 "ПОСЛЕДНЯЯ ИМПЕРИЯ"
 superevent_rus_restoration_quote:0 "Знание и могущество человека совпадают.\n\n- Фрэнсис Бэкон, \"Новый Органон\", I, 3"
 superevent_rus_restoration_comment:0 "Открыть мастерские."

 superevent_itora_vorkerland_war_title:0 "Вторая Иторско-Воркерландская война"
 superevent_itora_vorkerland_war_quote:0 "Мы ведём войну, чтобы жить в мире.\n\n- Аристотель, \"Никомахова этика\""
 superevent_itora_vorkerland_war_vlad_quote:0 "Войны нельзя избежать, можно лишь оттянуть её - к выгоде противника.\n\n- Никколо Макиавелли, \"Государь\""
 superevent_itora_vorkerland_war_dorian_quote:0 "Итак, война - это акт насилия, имеющий целью заставить противника выполнить нашу волю.\n\n- Карл фон Клаузевиц, \"О войне\""
 superevent_itora_vorkerland_war_anton_quote:0 "Война за правое дело - не величайшее зло, какое может постигнуть народ.\n\n- Джон Стюарт Милль, 1862"
 superevent_itora_vorkerland_war_comment:0 "На западном фронте снова война"

 superevent_itora_civilwar_title:0 "Гражданская война в Иторе"
 superevent_itora_civilwar_quote:0 "Дом, разделившийся сам в себе, не устоит.\n\n- Авраам Линкольн, 1858"
 superevent_itora_civilwar_comment:0 "Теперь фронт проходит через каждый дом"

 superevent_rus_khan_defeated_title:0 "Падение империи"
 superevent_rus_khan_defeated_quote:0 "Взгляните на мои творения, сильные мира, и отчаивайтесь! Больше ничего не осталось.\n\n- Перси Биши Шелли, \"Озимандия\""
 superevent_rus_khan_defeated_comment:0 "Последняя империя стала прошлым"


 superevent_stelander_sotnikov_civilwar_title:0 "ПОБЕДА СОТНИКОВА"
 # Source: Second Inaugural Address, 4 March 1865 (excerpt). https://www.nps.gov/linc/learn/historyculture/lincoln-second-inaugural.htm Russian translation for this localisation.
 superevent_stelander_sotnikov_civilwar_quote:0 "Давайте стремиться завершить начатое нами дело, залечить раны нации.\n\n- Авраам Линкольн"
 superevent_stelander_sotnikov_civilwar_comment:0 "Сопротивление победило"

 superevent_stelander_sotnikov_directory_title:0 "ДИРЕКТОРИЯ МЕЧА"
 # Source: Leviathan, chapter XVII, 1651. https://www.gutenberg.org/files/73957/73957-h/73957-h.htm Russian translation for this localisation.
 superevent_stelander_sotnikov_directory_quote:0 "Договоры без меча - лишь слова, не способные обеспечить человеку безопасность.\n\n- Томас Гоббс"
 superevent_stelander_sotnikov_directory_comment:0 "Приказ действует и после победы"

 superevent_stelander_sotnikov_charter_title:0 "ГЕНЕРАЛ ПОД ХАРТИЕЙ"
 # Source: First Inaugural Address, 4 March 1801 (excerpt). https://avalon.law.yale.edu/19th_century/jefinau1.asp Russian translation for this localisation.
 superevent_stelander_sotnikov_charter_quote:0 "Верховенство гражданской власти над военной.\n\n- Томас Джефферсон"
 superevent_stelander_sotnikov_charter_comment:0 "Государство отвечает перед живыми"

 superevent_stelander_shabrat_republic_title:0 "СТЕЛАНДСКИЙ СОЮЗ"
 # Source: The Social Contract, book I, chapter VIII, 1762; English translation by G. D. H. Cole (excerpt). https://www.gutenberg.org/cache/epub/46333/pg46333-images.html Russian translation for this localisation.
 superevent_stelander_shabrat_republic_quote:0 "Подчинение закону, который мы сами себе предписываем, есть свобода.\n\n- Жан-Жак Руссо"
 superevent_stelander_shabrat_republic_comment:0 "Свободные граждане. Общая судьба."

 superevent_stelander_tikhoreva_title:0 "МЕРА ОБЩЕГО БЛАГА"
 # Source: Utilitarianism, chapter II, 1861 (excerpt). https://www.gutenberg.org/files/11224/old/11224-h/11224-h.htm Russian translation for this localisation.
 superevent_stelander_tikhoreva_quote:0 "Приумножение счастья, согласно утилитарной этике, составляет цель добродетели.\n\n- Джон Стюарт Милль"
 superevent_stelander_tikhoreva_comment:0 "Ни одна жизнь не останется за итоговой строкой"

  superevent_nam_resource_war_service_title: "Ресурсная война: приказ наместников"
  superevent_nam_resource_war_service_quote: "Искусство войны жизненно важно для государства.\n\n- Сунь-цзы, \"Искусство войны\", I"
  superevent_nam_resource_war_service_comment: "Наместники берут промыслы под охрану"

  superevent_nam_resource_war_district_title: "Ресурсная война: ополчение округов"
  superevent_nam_resource_war_district_quote: "Победит тот, чья армия во всех своих рядах проникнута единым духом.\n\n- Сунь-цзы, \"Искусство войны\", III"
  superevent_nam_resource_war_district_comment: "Ночная смена остаётся на промыслах"

  superevent_stelander_party_victory_houses_title: "Высшие Дома правят Стеландером"
  superevent_stelander_party_victory_houses_quote: "Если мы хотим, чтобы всё осталось как есть, нужно, чтобы всё изменилось.\n\n- Джузеппе Томази ди Лампедуза, \"Леопард\""
  superevent_stelander_party_victory_houses_comment: "Сайан Кроу и Палата получают победу"

  superevent_stelander_party_victory_staff_title: "Генералы Стеландера берут власть"
  superevent_stelander_party_victory_staff_quote: "Кто желает мира, пусть готовится к войне.\n\n- Флавий Вегеций Ренат, \"Краткое изложение военного дела\""
  superevent_stelander_party_victory_staff_comment: "Август Вейль вводит мир по уставу"

  superevent_stelander_party_victory_wallets_title: "Стеландская витрина снова открыта"
  superevent_stelander_party_victory_wallets_quote: "Нервы войны - неисчислимые деньги.\n\n- Марк Туллий Цицерон, \"Филиппики\", V, 5"
  superevent_stelander_party_victory_wallets_comment: "Павел Ланской открывает сезон"

  superevent_stelander_party_victory_silence_title: "Тишина над Стеландером"
  superevent_stelander_party_victory_silence_quote: "Где они создают пустыню, они называют это миром.\n\n- Тацит, \"Агрикола\", 30"
  superevent_stelander_party_victory_silence_comment: "Вера Корвина хранит тишину"

  superevent_stelander_party_victory_regent_title: "Нодрул празднует стеландскую победу"
  superevent_stelander_party_victory_regent_quote: "Сильные делают то, что могут, а слабые терпят то, что должны.\n\n- Фукидид, \"История\""
  superevent_stelander_party_victory_regent_comment: "Эдгар Реннер подписывает за Стеландер"

  superevent_stelander_party_victory_festival_title: "Праздник продолжается!"
  superevent_stelander_party_victory_festival_quote: "Хлеба и зрелищ.\n\n- Ювенал, \"Сатиры\""
  superevent_stelander_party_victory_festival_comment: "Руфус Хедерсетт празднует победу"

  superevent_south_houses_title: "Цена Юга"
  superevent_south_houses_quote: "Всё для себя и ничего для других - таков, по-видимому, во все времена был гнусный девиз властителей человечества.\n\n- Адам Смит, \"Богатство народов\", III, IV"
  superevent_south_houses_comment: "Дома получат свою долю."

  superevent_south_cities_title: "Юг вольных городов"
  superevent_south_cities_quote: "Народ, подчиняющийся законам, должен быть их автором.\n\n- Жан-Жак Руссо, \"Об общественном договоре\", II, 6"
  superevent_south_cities_comment: "Нам самим решать."

  superevent_south_nur_title: "Приказ из Хазара"
  superevent_south_nur_quote: "Главные основы всех государств, новых, старых или смешанных, - хорошие законы и хорошее войско.\n\n- Никколо Макиавелли, \"Государь\", XII"
  superevent_south_nur_comment: "Хазару подчинятся все."

  superevent_south_regency_title: "Земля за верность"
  superevent_south_regency_quote: "Благодеяния следует оказывать понемногу, чтобы их вкус ощущался дольше.\n\n- Никколо Макиавелли, \"Государь\", VIII"
  superevent_south_regency_comment: "Верность будет вознаграждена."

  superevent_south_commune_title: "Наш огонь"
  superevent_south_commune_quote: "Свободное развитие каждого является условием свободного развития всех.\n\n- Карл Маркс и Фридрих Энгельс, \"Манифест Коммунистической партии\""
  superevent_south_commune_comment: "Теперь мы здесь хозяева."

  superevent_south_conclave_title: "Девять хозяев"
  superevent_south_conclave_quote: "Разговор заканчивается сговором против общества или какой-нибудь уловкой для повышения цен.\n\n- Адам Смит, \"Богатство народов\", I, X"
  superevent_south_conclave_comment: "Все девять остались на своих местах."

  superevent_south_service_title: "Воля наместников"
  superevent_south_service_quote: "Цель повиновения - защита.\n\n- Томас Гоббс, \"Левиафан\", XXI"
  superevent_south_service_comment: "Наместник ответит перед Светлогорском."

  superevent_south_charter_title: "Под одной хартией"
  superevent_south_charter_quote: "Никто не может быть выведен из этого состояния и подчинён политической власти другого без собственного согласия.\n\n- Джон Локк, \"Второй трактат о правлении\", 95"
  superevent_south_charter_comment: "Каждый округ имеет голос."

  superevent_south_contracts_title: "Сделка заключена"
  superevent_south_contracts_quote: "Люди должны выполнять заключённые ими соглашения.\n\n- Томас Гоббс, \"Левиафан\", XV"
  superevent_south_contracts_comment: "Слово дано."

  superevent_south_rump_title: "Снова на материке"
  superevent_south_rump_quote: "В наших силах начать мир заново.\n\n- Томас Пейн, \"Здравый смысл\""
  superevent_south_rump_comment: "Наш берег снова рядом."

  superevent_south_revenge_title: "Обратный поход"
  superevent_south_revenge_quote: "Пусть главной целью войны будет победа, а не затяжные походы.\n\n- Сунь-цзы, \"Искусство войны\", II"
  superevent_south_revenge_comment: "Мы помнили дорогу."

  superevent_south_radical_title: "Добыча победителей"
  superevent_south_radical_quote: "Грабя чужую землю, разделяй добычу между своими людьми.\n\n- Сунь-цзы, \"Искусство войны\", VII"
  superevent_south_radical_comment: "Победитель забирает своё."

  superevent_south_free_islands_title: "Мы вернулись"
  superevent_south_free_islands_quote: "Нет для человека ничего дороже родной земли и родителей.\n\n- Гомер, \"Одиссея\", IX"
  superevent_south_free_islands_comment: "Теперь можно домой."

  superevent_south_boards_title: "Родина с молотка"
  superevent_south_boards_quote: "Современная государственная власть - это лишь комитет, управляющий общими делами всего класса буржуазии.\n\n- Карл Маркс и Фридрих Энгельс, \"Манифест Коммунистической партии\""
  superevent_south_boards_comment: "Всё имеет цену."

  superevent_south_restitution_title: "Здесь проходит рубеж"
  superevent_south_restitution_quote: "Цель закона - не упразднять или ограничивать свободу, а сохранять и расширять её.\n\n- Джон Локк, \"Второй трактат о правлении\", 57"
  superevent_south_restitution_comment: "Дальше они не пройдут."

  superevent_west_worker_title: "Запад входит в Конфедерацию"
  superevent_west_worker_quote: "Согласием малые государства возвышаются, раздором величайшие рушатся.\n\n- Саллюстий, \"Югуртинская война\", 10"
  superevent_west_worker_comment: "Республики открывают заседание"

  superevent_west_petrichev_title: "Победа имперского Воркерланда"
  superevent_west_petrichev_quote: "Гораздо надёжнее внушать страх, чем любовь, если приходится отказаться от одного из двух.\n\n- Никколо Макиавелли, \"Государь\", XVII"
  superevent_west_petrichev_comment: "Запад переходит под имперский мандат"

  superevent_west_veyran_title: "Восстановление Вейранской империи"
  superevent_west_veyran_quote: "Всё прошлое - лишь пролог.\n\n- Уильям Шекспир, \"Буря\", II, 1"
  superevent_west_veyran_comment: "Акт о восстановлении подписан"

  superevent_west_dorian_title: "Технический союз Форула"
  superevent_west_dorian_quote: "Природу побеждают, лишь подчиняясь ей.\n\n- Фрэнсис Бэкон, \"Новый Органон\", I, 3"
  superevent_west_dorian_comment: "Сеть приняла нагрузку"

  superevent_west_anton_title: "Запад Антона Багли"
  superevent_west_anton_quote: "Мерило здесь - не наибольшее счастье самого действующего лица, а наибольшее общее количество счастья.\n\n- Джон Стюарт Милль, \"Утилитаризм\", II"
  superevent_west_anton_comment: "Первые больницы открыты"

  superevent_west_shield_title: "Победа Гуманистического щита"
  superevent_west_shield_quote: "И всё это должно служить лишь миру, безопасности и общественному благу народа.\n\n- Джон Локк, \"Второй трактат о правлении\", 131"
  superevent_west_shield_comment: "Гарантии вступили в силу"

  superevent_west_emergency_title: "Чрезвычайная опека Иторы"
  superevent_west_emergency_quote: "Где нет общей власти, нет закона; где нет закона, нет несправедливости.\n\n- Томас Гоббс, \"Левиафан\", XIII"
  superevent_west_emergency_comment: "Комиссары принимают управление"

  superevent_west_revanche_title: "Иторский реванш"
  superevent_west_revanche_quote: "Обиды следует наносить все разом, чтобы, ощущаемые меньше, они меньше задевали.\n\n- Никколо Макиавелли, \"Государь\", VIII"
  superevent_west_revanche_comment: "Границы пересмотрены"

  superevent_west_committee_title: "Западный мир Комитета Иторы"
  superevent_west_committee_quote: "Обязанность подданных перед сувереном длится лишь до тех пор, пока существует власть, способная их защищать.\n\n- Томас Гоббс, \"Левиафан\", XXI"
  superevent_west_committee_comment: "Коридор передан Иторе"

  superevent_vorkerland_world_empire_title: "Мировая империя Воркерланда"
  superevent_vorkerland_world_empire_quote: "Имя моё - Озимандия, царь царей.\n\n- Перси Биши Шелли, \"Озимандия\""
  superevent_vorkerland_world_empire_comment: "Выпуск уходит в печать"

  superevent_south_iron_title: "Последняя ступень"
  superevent_south_iron_quote: "Люди скорее забывают смерть отца, чем потерю наследства.\n\n- Никколо Макиавелли, \"Государь\", XVII"
  superevent_south_iron_comment: "Приказы не обсуждаются."

  superevent_south_civil_service_title: "На службе республики"
  superevent_south_civil_service_quote: "Равная и беспристрастная справедливость для всех людей, независимо от их положения, религиозных или политических убеждений.\n\n- Томас Джефферсон, первая инаугурационная речь"
  superevent_south_civil_service_comment: "Власть должна служить."

  superevent_south_federation_title: "Союз равных"
  superevent_south_federation_quote: "Власть можно передать, но волю - нельзя.\n\n- Жан-Жак Руссо, \"Об общественном договоре\", II, 1"
  superevent_south_federation_comment: "Никто не решит за нас."

  superevent_south_oil_union_title: "Великая смена"
  superevent_south_oil_union_quote: "Пролетариям нечего терять, кроме своих цепей. Приобретут же они весь мир.\n\n- Карл Маркс и Фридрих Энгельс, \"Манифест Коммунистической партии\""
  superevent_south_oil_union_comment: "Промыслы в наших руках."

  superevent_south_contract_republic_title: "Республика держит слово"
  superevent_south_contract_republic_quote: "Где кончается закон, начинается тирания.\n\n- Джон Локк, \"Второй трактат о правлении\", 202"
  superevent_south_contract_republic_comment: "Договор касается и правителя."

  superevent_south_directorate_title: "Большая сделка"
  superevent_south_directorate_quote: "Потребление - единственная цель и назначение всякого производства.\n\n- Адам Смит, \"Богатство народов\", IV, VIII"
  superevent_south_directorate_comment: "Победа должна приносить доход."

  superevent_south_nam_title: "Юг за нами"
  superevent_south_nam_quote: "Не бывало, чтобы затяжная война приносила стране пользу.\n\n- Сунь-цзы, \"Искусство войны\", II"
  superevent_south_nam_comment: "Война за Юг окончена."

  superevent_west_council_title: "Запад под мандатом Чрезвычайного совета"
  superevent_west_council_quote: "Если бы люди были ангелами, никакое правительство не было бы нужно.\n\n- Джеймс Мэдисон, \"Федералист\", 51"
  superevent_west_council_comment: "Совет утвердил мандат"
 superevent_west_world_empire_title: "Мировая империя Воркерланда победила Итору"
 superevent_west_world_empire_quote: "Гордых смирять, освобождать раба от цепей - вот достойное тебя искусство империи.\n\n- Вергилий, \"Энеида\", VI (по переводу Джона Драйдена)"
 superevent_west_world_empire_comment: "Западная линия открыта"

 superevent_nam_veyran_proclamation_title:0 "Провозглашение Вейранской империи"
 superevent_nam_veyran_proclamation_quote:0 "Репутация могущества есть могущество.\n\n- Томас Гоббс, \"Левиафан\", X"
 superevent_nam_veyran_proclamation_comment:0 "Союзная грамота подписана"

 # Virgil, Aeneid I.279: https://dcc.dickinson.edu/vergil-aeneid/vergil-aeneid-i-272-296
 superevent_itora_legion_victory_title:0 "РОЖДЕНИЕ ВЕЧНОГО ИМПЕРИУМА"
 superevent_itora_legion_victory_quote:0 "Imperium sine fine dedi.\nЯ даровал им власть без конца.\n- Вергилий, \"Энеида\", I, 279 (перевод с латинского)"
 superevent_itora_legion_victory_comment:0 "Империум восстанет из пепла."

 # Thomas Hobbes, Leviathan XVII: https://www.gutenberg.org/cache/epub/3207/pg3207-images.html
 superevent_itora_committee_victory_title:0 "ПОБЕДА ЧРЕЗВЫЧАЙНОГО КОМИТЕТА"
 superevent_itora_committee_victory_quote:0 "А соглашения без меча - лишь слова, которые не в силах гарантировать человеку безопасность.\n- Томас Гоббс, \"Левиафан\", XVII"
 superevent_itora_committee_victory_comment:0 "Порядок будет восстановлен."

 # Leonid Stalk secret ending: the opening of a portal to another world.
 # H. P. Lovecraft, From Beyond: https://www.hplovecraft.com/writings/texts/fiction/fb.aspx
 superevent_itora_stalk_portal_title:0 "ПО ТУ СТОРОНУ МИРА"
 superevent_itora_stalk_portal_quote:0 "Я заглянул за пределы бесконечности и вызвал демонов со звёзд.\n- Г. Ф. Лавкрафт, \"Извне\" (перевод с английского)"
 superevent_itora_stalk_portal_comment:0 "Порог пройден."
