l_russian:
  superevent_vorkerland_civilwar_title: "Гражданская война в Воркерланде"
  superevent_vorkerland_civilwar_quote: "Когда слова перестают соответствовать вещам, рушатся королевства, слабеют и угасают империи.\n\n- Эзра Паунд"
  superevent_vorkerland_civilwar_comment: "Государство оказалось менее прочным, чем его границы"

  superevent_vorkerland_dirty_opening_title: "Падение Периметра"
  superevent_vorkerland_dirty_opening_quote: "Я покажу тебе страх в горсти праха.\n\n- Т. С. Элиот, «Бесплодная земля»"
  superevent_vorkerland_dirty_opening_comment: "За Периметром снова появились дороги, карты и претенденты"

  superevent_vorkerland_worker_victory_title: "Возрождение Конфедерации"
  superevent_vorkerland_worker_victory_quote: "Согласием малые государства возвышаются, раздором величайшие рушатся.\n\n- Саллюстий, «Югуртинская война»"
  superevent_vorkerland_worker_victory_comment: "Воркер собрал Конфедерацию заново"

  superevent_vorkerland_utilitarian_victory_title: "Утилитарная республика"
  superevent_vorkerland_utilitarian_victory_quote: "Величайшее счастье величайшего числа - мера правильного и неправильного.\n\n- Иеремия Бентам"
  superevent_vorkerland_utilitarian_victory_comment: "Антон Багли подчинил новый порядок измеримой общественной пользе"

  superevent_vorkerland_vlad_victory_title: "Имперская реставрация"
  superevent_vorkerland_vlad_victory_quote: "Они создают пустыню и называют её миром.\n\n- Тацит, «Агрикола»"
  superevent_vorkerland_vlad_victory_comment: "Влад Петричев вернул единство на штыках"

  superevent_vorkerland_dorian_victory_title: "Воркеландское поле экспериментов"
  superevent_vorkerland_dorian_victory_quote: "Управление людьми заменяется управлением вещами и руководством процессами производства.\n\n- Фридрих Энгельс, «Анти-Дюринг»"
  superevent_vorkerland_dorian_victory_comment: "Воркерланд передан тем, кто умеет считать, строить и управлять"

  superevent_stelander_empire_title: "Провозглашение стеландского имперского союза!"
  superevent_stelander_empire_quote: "Когда у человека не остаётся ничего, чем можно гордиться, он начинает гордиться своей этнической принадлежностью. \n\n- Артур Шопенгауэр "
  superevent_stelander_empire_comment: "Стеландер снова поднимает голову"

  superevent_stelander_party_victory_title: "Победа партии в Стеландере"
  superevent_stelander_party_victory_quote: "Цель власти - власть.\n\n- Джордж Оруэлл, «1984»"
  superevent_stelander_party_victory_comment: "Партийная власть сохранена"
  superevent_stelander_party_victory_houses_title: "Высшие Дома правят Стеландером"
  superevent_stelander_party_victory_houses_quote: "Если мы хотим, чтобы всё осталось как есть, нужно, чтобы всё изменилось.\n\n- Джузеппе Томази ди Лампедуза, «Леопард»"
  superevent_stelander_party_victory_houses_comment: "Сайан Кроу и Палата получают победу"
  superevent_stelander_party_victory_festival_title: "Праздник продолжается!"
  superevent_stelander_party_victory_festival_quote: "Хлеба и зрелищ.\n\n- Ювенал, «Сатиры»"
  superevent_stelander_party_victory_festival_comment: "Руфус Хедерсетт празднует победу"
  superevent_stelander_party_victory_staff_title: "Генералы Стеландера берут власть"
  superevent_stelander_party_victory_staff_quote: "Кто желает мира, пусть готовится к войне.\n\n- Флавий Вегеций Ренат, «Краткое изложение военного дела»"
  superevent_stelander_party_victory_staff_comment: "Август Вейль вводит мир по уставу"
  superevent_stelander_party_victory_wallets_title: "Стеландская витрина снова открыта"
  superevent_stelander_party_victory_wallets_quote: "Бесконечные деньги - нерв войны.\n\n- Марк Туллий Цицерон, «Филиппики»"
  superevent_stelander_party_victory_wallets_comment: "Павел Ланской открывает сезон"
  superevent_stelander_party_victory_silence_title: "Тишина над Стеландером"
  superevent_stelander_party_victory_silence_quote: "Они создают пустыню и называют это миром.\n\n- Публий Корнелий Тацит, «Агрикола»"
  superevent_stelander_party_victory_silence_comment: "Вера Корвина хранит тишину"
  superevent_stelander_party_victory_regent_title: "Нодрул празднует стеландскую победу"
  superevent_stelander_party_victory_regent_quote: "Сильные делают то, что могут, а слабые терпят то, что должны.\n\n- Фукидид, «История»"
  superevent_stelander_party_victory_regent_comment: "Эдгар Реннер подписывает за Стеландер"

  superevent_stelander_shabrat_victory_title: "Победа Шабрата в Стеландере"
  superevent_stelander_shabrat_victory_quote: "Всё прошлое - лишь пролог.\n\n- Уильям Шекспир, «Буря»"
  superevent_stelander_shabrat_victory_comment: "Гражданская война окончена"
  superevent_stelander_shabrat_victory_staff_title: "Штаб Шабрата берёт Стеландер"
  superevent_stelander_shabrat_victory_staff_quote: "Война есть лишь продолжение политики иными средствами.\n\n- Карл фон Клаузевиц, «О войне»"
  superevent_stelander_shabrat_victory_staff_comment: "Директория офицеров обещает порядок"
  superevent_stelander_shabrat_victory_councils_title: "Горные советы входят в Фаду"
  superevent_stelander_shabrat_victory_councils_quote: "Человек рождается свободным, а между тем он везде в оковах.\n\n- Жан-Жак Руссо, «Об общественном договоре»"
  superevent_stelander_shabrat_victory_councils_comment: "Перевалы получают голос"
  superevent_stelander_shabrat_victory_truth_title: "Суд правды в Фаде"
  superevent_stelander_shabrat_victory_truth_quote: "И познаете истину, и истина сделает вас свободными.\n\n- Евангелие от Иоанна, 8:32"
  superevent_stelander_shabrat_victory_truth_comment: "Архивы Нижнего рынка выносят на площадь"

  superevent_nam_resource_war_title: "Ресурсная война"
  superevent_nam_resource_war_quote: "Немногие наживаются - многие платят.\n\n- Смедли Батлер, «Война - это рэкет»"
  superevent_nam_resource_war_comment: "За месторождения платят кровью"

  superevent_rus_last_empire_title: "Последняя империя"
  superevent_rus_last_empire_quote: "Соглашения без меча - лишь слова.\n\n- Томас Гоббс, «Левиафан»"
  superevent_rus_last_empire_comment: "Хан занял императорский престол"

  superevent_val_commonwealth_title: "Провозглашено Кефрейтское содружество!"
  superevent_val_commonwealth_quote: "Республика есть дело народа.\n\n- Цицерон, «О государстве»"
  superevent_val_commonwealth_comment: "Солгалов связал договорные администрации в единый порядок"

  superevent_stelander_great_title: "Провозглашён Великий Стеландер!"
  superevent_stelander_great_quote: "$superevent_stelander_party_victory_quote$"
  superevent_stelander_great_comment: "Северные правительства подчинены единому центру"

  superevent_inactive_title: ""
  superevent_inactive_quote: ""
  superevent_inactive_comment: ""
 superevent_rus_black_banner_title:0 "ИМПЕРИЯ ЧЁРНОГО ЗНАМЕНИ"
 superevent_rus_black_banner_quote:0 "«Штаб существует, пока последний солдат знает, кто держит соседний рубеж».\n- Марк Рустан"
 superevent_rus_black_banner_comment:0 "Держать общий строй."
 superevent_rus_restoration_title:0 "ПОСЛЕДНЯЯ ИМПЕРИЯ"
 superevent_rus_restoration_quote:0 "«Страна начинается там, где завтрашний хлеб перестают считать чудом».\n- Марк Рустан"
 superevent_rus_restoration_comment:0 "Открыть мастерские."

 superevent_itora_vorkerland_war_title:0 "Вторая Иторско-Воркерландская война"
 superevent_itora_vorkerland_war_quote:0 "Мы ведём войну, чтобы жить в мире.\n\n- Аристотель, «Никомахова этика»"
 superevent_itora_vorkerland_war_vlad_quote:0 "Войны нельзя избежать, можно лишь оттянуть её - к выгоде противника.\n\n- Никколо Макиавелли, «Государь»"
 superevent_itora_vorkerland_war_dorian_quote:0 "Итак, война - это акт насилия, имеющий целью заставить противника выполнить нашу волю.\n\n- Карл фон Клаузевиц, «О войне»"
 superevent_itora_vorkerland_war_anton_quote:0 "Война за правое дело - не величайшее зло, какое может постигнуть народ.\n\n- Джон Стюарт Милль, 1862"
 superevent_itora_vorkerland_war_comment:0 "На западном фронте снова война"

 superevent_itora_civilwar_title:0 "Гражданская война в Иторе"
 superevent_itora_civilwar_quote:0 "Дом, разделившийся сам в себе, не устоит.\n\n- Авраам Линкольн, 1858"
 superevent_itora_civilwar_comment:0 "Теперь фронт проходит через каждый дом"

 superevent_rus_khan_defeated_title:0 "Хан повержен"
 superevent_rus_khan_defeated_quote:0 "Взгляните на мои творения, сильные мира, и отчаивайтесь! Больше ничего не осталось.\n\n- Перси Биши Шелли, «Озимандия»"
 superevent_rus_khan_defeated_comment:0 "Последняя империя стала прошлым"

  superevent_vorkerland_joint_victory_title: "Чрезвычайный совет"
  superevent_vorkerland_joint_victory_quote: "Одно честолюбие должно сдерживать другое.\n\n- Джеймс Мэдисон, «Федералист № 51»"
  superevent_vorkerland_joint_victory_comment: "Победители не поделили страну - они поделили власть"
