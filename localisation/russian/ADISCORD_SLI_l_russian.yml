 SLI_Island_Council:0 "Островной совет"
 VAL_Island_Treaty:0 "Договор со Стеландскими островами"
 VAL_Island_Treaty_desc:0 "Гражданская война на материке положила конец нодрульскому мандату. Островной совет объявил независимость, но его гавани по-прежнему зависят от соседних рынков. Мы предложим островам войти в Кефрейт по договору. Последнее слово останется за их советом."
 VAL_Island_Operation:0 "Занять Стеландские острова"
 VAL_Island_Operation_desc:0 "Договор о присоединении не состоялся. Если островной совет отказывается признать нашу власть, вопрос можно решить высадкой. Приказ начнёт войну; острова придётся занять и удержать."
 VAL_island_treaty_available_tt:0 "Гражданская война в Стеландере началась. Кефрейт независим и не капитулировал. Стеландские острова независимы, не состоят в альянсе, не воюют и полностью контролируют свой архипелаг."
 VAL_island_treaty_offer_tt:0 "Островной совет получит предложение войти в состав Кефрейта. Согласие передаст его территории и войска; отказ откроет фокус «Занять Стеландские острова»."
 VAL_island_operation_available_tt:0 "Договор о присоединении не состоялся. Кефрейт независим и не капитулировал; острова независимы, не состоят в альянсе, не воюют и полностью контролируют архипелаг."
 SLI_join_kefreyt_tt:0 "Островное государство войдёт в состав Кефрейта вместе со всеми территориями и войсками."
 SLI_refuse_kefreyt_tt:0 "Острова сохранят независимость. Кефрейт сможет подготовить военную операцию через отдельный фокус."
 ADISCORD_SLI.1.t:0 "Стеландские острова объявили независимость"
 ADISCORD_SLI.1.d:0 "Начало гражданской войны в Стеландере отозвалось и на островах. Островной совет объявил, что прежний порядок больше не обеспечивает безопасность архипелага, и прекратил действие нодрульского мандата. Над гаванью спущен флаг администрации, сохранявший стеландскую символику. Его сменило синее полотнище с семью белыми звёздами.\n\nСовет заявил, что острова будут управляться самостоятельно. Пока на материке формируются фронты, молодой республике предстоит определить отношения с Нодрулом и Кефрейтом: формальная независимость ещё не гарантирует ни безопасности судоходства, ни снабжения."
 ADISCORD_SLI.1.a:0 "У архипелага теперь собственный флаг."
 ADISCORD_SLI.2.t:0 "Кефрейт предлагает присоединение"
 ADISCORD_SLI.2.d:0 "Кефрейтская делегация представила островному совету договор о присоединении. Архипелаг должен войти в состав Кефрейта, а его вооружённые силы — перейти под общее командование. Взамен острова получат доступ к материковой системе снабжения и защите побережья.\n\nДля совета это выбор между недавно провозглашённой самостоятельностью и включением в более крупное государство. Делегаты не скрывают, что отказ может привести к военной операции. Но подписать документ без решения островного совета они не могут."
 ADISCORD_SLI.2.a:0 "Подписать договор о присоединении."
 ADISCORD_SLI.2.b:0 "Мы сохраним независимость."
 ADISCORD_SLI.2.c:0 "Обстоятельства изменились; договор закрыт."
 ADISCORD_SLI.3.t:0 "Ответ островного совета"
 ADISCORD_SLI.3.accepted:0 "Островной совет принял договор о присоединении. Стеландские острова вошли в состав Кефрейта, а местные силы перешли под наше командование. Гавани и гражданская администрация начинают работу в общей системе."
 ADISCORD_SLI.3.refused:0 "Островной совет отклонил договор о присоединении. Республика сохраняет самостоятельность. Теперь командование может подготовить отдельную операцию по занятию архипелага, если правительство решит продолжить давление."
 ADISCORD_SLI.3.a:0 "Ответ получен."
