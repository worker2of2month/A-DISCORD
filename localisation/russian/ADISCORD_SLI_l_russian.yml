 VAL_Island_Treaty:0 "Договор со Стеландскими островами"
 VAL_Island_Treaty_desc:0 "Гражданская война на материке положила конец нодрульскому мандату. Островной совет объявил независимость, но его гавани по-прежнему зависят от соседних рынков. Решение немедленно присоединит Стеландские острова к Кефрейту вместе с их территориями и войсками, без войны и ожидания ответа совета."
 VAL_island_treaty_available_tt:0 "Гражданская война в Стеландере началась. Кефрейт независим и не капитулировал. Стеландские острова независимы, не состоят в альянсе, не воюют и полностью контролируют свой архипелаг."
 ADISCORD_SLI.1.t:0 "Стеландские острова объявили независимость"
 ADISCORD_SLI.1.d:0 "Начало гражданской войны в Стеландере отозвалось и на островах. Островной совет объявил, что прежний порядок больше не обеспечивает безопасность архипелага, и прекратил действие нодрульского мандата. Над гаванью спущен флаг администрации, сохранявший стеландскую символику. Его сменило синее полотнище с семью белыми звёздами.\n\nСовет заявил, что острова будут управляться самостоятельно. Пока на материке формируются фронты, молодой республике предстоит определить отношения с Нодрулом и Кефрейтом: формальная независимость ещё не гарантирует ни безопасности судоходства, ни снабжения."
 ADISCORD_SLI.1.a:0 "У архипелага теперь собственный флаг."
 ADISCORD_SLI.3.t:0 "Ответ островного совета"
 ADISCORD_SLI.3.accepted:0 "Островной совет принял договор о присоединении. Стеландские острова вошли в состав Кефрейта, а местные силы перешли под наше командование. Гавани и гражданская администрация начинают работу в общей системе."
 ADISCORD_SLI.3.a:0 "Ответ получен."
