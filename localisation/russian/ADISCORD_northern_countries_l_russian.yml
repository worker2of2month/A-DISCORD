l_russian:
 BRN: "Брайн"
 BRN_DEF: "Северный протекторат Брайн"
 BRN_ADJ: "брайнск."
 BRN_etatism: "Северный протекторат Брайн"
 BRN_etatism_party: "Управление полярной линии"
 BRN_Emilia_Brandt: "Эмилия Брандт"
 BRN_Emilia_Brandt_desc: "Эмилия Брандт превратила цепь метеостанций, радиомачт и складов в единую администрацию. В Брайне приказ ценят не за торжественность, а за способность дойти до самого удалённого гарнизона до начала бури."
 BRN_polar_signal_line: "Полярная сигнальная линия"
 BRN_polar_signal_line_desc: "Радиомачты и промежуточные склады позволяют снабжать северные округа, однако вся система зависит от нескольких дорог и дисциплины местных гарнизонов."

 KRL: "Карлёд"
 KRL_DEF: "Королевство Карлёд"
 KRL_ADJ: "карлёдск."
 KRL_hedonism: "Королевство Карлёд"
 KRL_hedonism_party: "Двор зимней короны"
 KRL_Edvard_Karel: "Эдвард Карель"
 KRL_Edvard_Karel_desc: "Король Эдвард Карель удерживает островные ярлства браками, пожалованиями и личным контролем над ледовыми портами. Двор расточителен, но пограничные дружины умеют пережидать зиму там, где регулярная армия теряет дороги."
 KRL_winter_crown: "Зимняя корона"
 KRL_winter_crown_desc: "Карель знает цену терпению, укреплённому складу и верности родов, чьи владения месяцами отрезаны снегом."

 FRS: "Фростен"
 FRS_DEF: "Фростенская Федерация"
 FRS_ADJ: "фростенск."
 FRS_pragmatism: "Фростенская Федерация"
 FRS_pragmatism_party: "Съезд северных округов"
 FRS_Mikael_Frost: "Микаэль Фрост"
 FRS_Mikael_Frost_desc: "Микаэль Фрост председательствует на съезде округов, которые признают общий бюджет лишь на дороги, спасательные службы и оборону. Федерация устойчива в быту, но медленно собирает силы для большой войны."

 KHV: "Хаврен"
 KHV_DEF: "Хавренский конклав"
 KHV_ADJ: "хавренск."
 KHV_technocracy: "Хавренский конклав"
 KHV_technocracy_party: "Коллегия глубинного тепла"
 KHV_Ilva_Havren: "Ильва Хаврен"
 KHV_Ilva_Havren_desc: "Ильва Хаврен возглавляет коллегию геологов и энергетиков, выросшую вокруг глубоких тёплых скважин. Конклав обеспечивает города энергией, но измеряет общественные потребности теми же таблицами, что и давление в трубах."
 KHV_geothermal_colleges: "Коллегии глубинного тепла"
 KHV_geothermal_colleges_desc: "Инженерные школы связаны с шахтами и тепловыми станциями. Исследования быстро доходят до производства, хотя содержание сложной сети дорого обходится населению."

 ELN: "Эленар"
 ELN_DEF: "Эленарская директория"
 ELN_ADJ: "эленарск."
 ELN_technocracy: "Эленарская директория"
 ELN_technocracy_party: "Дирекция государственного счёта"
 ELN_Taal_Elander: "Тааль Эландер"
 ELN_Taal_Elander_desc: "Тааль Эландер построил власть на всеобщей переписи мастерских, запасов и трудовых бригад. Его директория эффективна, пока реальная жизнь совпадает с отчётами, и беспощадна к тем, кто в них не помещается."
 ELN_census_engines: "Машины государственного счёта"
 ELN_census_engines_desc: "Сеть счётных станций ускоряет исследования и распределение заказов, но постоянные проверки и исправления вызывают раздражение даже у лояльных специалистов."

 AUR: "Аур"
 AUR_DEF: "Аурская республика"
 AUR_ADJ: "аурск."
 AUR_humanism: "Аурская республика"
 AUR_humanism_party: "Гражданский форум Аура"
 AUR_Sofia_Aurell: "София Аурелль"
 AUR_Sofia_Aurell_desc: "София Аурелль добилась равного представительства горных и прибрежных общин. Республика богаче соседей институтами, чем оружием, и рассчитывает удержать мир договорами и подготовленным ополчением."

 HON: "Хонория"
 HON_DEF: "Хонорийская республика"
 HON_ADJ: "хонорийск."
 HON_humanism: "Хонорийская республика"
 HON_humanism_party: "Союз гражданских советов"
 HON_Honter_Woke: "Хонтер Уок"
 HON_Honter_Woke_desc: "Хонтер Уок стал компромиссным кандидатом дорожных коммун, профсоюзов и городских советов. Он расширил участие провинций в управлении, не позволив бесконечным обсуждениям остановить восстановление страны."
 HON_first_citizen: "Первый гражданин"
 HON_first_citizen_desc: "Уок умеет превращать разногласия советов в устойчивые решения и лично отвечает за исполнение согласованной программы."
 HON_civic_compact: "Гражданский договор провинций"
 HON_civic_compact_desc: "Налоги, дороги и мобилизационные обязанности закреплены открытым договором. Провинции сохраняют голос, а центр получает предсказуемые средства для общей политики."

 NVR: "Норвейн"
 NVR_DEF: "Норвейнская федерация"
 NVR_ADJ: "норвейнск."
 NVR_pragmatism: "Норвейнская федерация"
 NVR_pragmatism_party: "Совет сезонных дорог"
 NVR_Leif_Norven: "Лейф Норвен"
 NVR_Leif_Norven_desc: "Лейф Норвен координирует округа, чьи дороги ежегодно меняются вместе с разливами и снегом. Федерация избегает громких доктрин и поддерживает только те учреждения, которые доказали практическую пользу."

 SKN: "Скад"
 SKN_DEF: "Скадская военная директория"
 SKN_ADJ: "скадск."
 SKN_etatism: "Скадская военная директория"
 SKN_etatism_party: "Главное управление округов"
 SKN_Ren_Skad: "Рен Скад"
 SKN_Ren_Skad_desc: "Маршал Рен Скад объединил гарнизонные округа после серии приграничных налётов. Его система быстро выставляет резервистов, но подчиняет гражданское хозяйство требованиям штабов."
 SKN_iron_marshal: "Железный маршал"
 SKN_iron_marshal_desc: "Скад требует от штабов точных планов и от страны — ресурсов для их исполнения, даже когда военная дисциплина тормозит гражданские решения."
 SKN_reserve_districts: "Округа постоянного резерва"
 SKN_reserve_districts_desc: "Каждая администрация ведёт учёт людей, транспорта и складов. Мобилизация проходит быстро, но содержание системы постоянно отнимает часть мирного производства."

 TMR: "Тимер"
 TMR_DEF: "Тимерская палата"
 TMR_ADJ: "тимерск."
 TMR_utilitarism: "Тимерская палата"
 TMR_utilitarism_party: "Палата общественного результата"
 TMR_Mira_Timer: "Мира Тимер"
 TMR_Mira_Timer_desc: "Мира Тимер распределяет средства между округами по измеримой отдаче от дорог, школ и мастерских. Палата умеет экономить, но плохо понимает проекты, выгода которых проявится лишь через поколение."

 LYS: "Лисмар"
 LYS_DEF: "Лисмарская торговая лига"
 LYS_ADJ: "лисмарск."
 LYS_hedonism: "Лисмарская торговая лига"
 LYS_hedonism_party: "Палата торговых домов"
 LYS_Cassian_Lys: "Кассиан Лис"
 LYS_Cassian_Lys_desc: "Кассиан Лис представляет дома, контролирующие склады, переправы и кредит северо-восточного побережья. Лига открыта для торговли, пока её правила сохраняют прибыль старых компаний."
 LYS_bonded_warehouses: "Сеть залоговых складов"
 LYS_bonded_warehouses_desc: "Товар можно оставить под залог, перепродать в пути и быстро направить на нужную фабрику. Система ускоряет оборот, но усиливает власть владельцев складов."

 VES: "Вестмар"
 VES_DEF: "Вестмарская пограничная лига"
 VES_ADJ: "вестмарск."
 VES_etatism: "Вестмарская пограничная лига"
 VES_etatism_party: "Совет западных застав"
 VES_Oskar_Vest: "Оскар Вест"
 VES_Oskar_Vest_desc: "Оскар Вест связал четыре обширных округа цепью застав и дорожных обязательств. Вестмар невелик населением, зато его оборона опирается на заранее подготовленные рубежи."
 VES_warden_of_western_gates: "Страж западных ворот"
 VES_warden_of_western_gates_desc: "Вест лично объезжает заставы и требует, чтобы каждая дорога имела запасной склад и подготовленную позицию."
 VES_border_charters: "Хартии пограничных дорог"
 VES_border_charters_desc: "Община получает землю и материалы в обмен на содержание участка дороги, склада и укреплённой позиции."

 DRV: "Дравен"
 DRV_DEF: "Дравенские свободные коммуны"
 DRV_ADJ: "дравенск."
 DRV_anarchism: "Дравенские свободные коммуны"
 DRV_anarchism_party: "Сход свободных долин"
 DRV_Council_of_Free_Valleys: "Сход свободных долин"
 DRV_Council_of_Free_Valleys_desc: "Дравен не имеет постоянного правительства: делегаты долин собираются для ремонта дорог, разрешения споров и общей обороны. Такая система плохо переносит долгую централизацию, но почти не оставляет места далёкой бюрократии."

 ORV: "Орваль"
 ORV_DEF: "Орвальский союз"
 ORV_ADJ: "орвальск."
 ORV_pragmatism: "Орвальский союз"
 ORV_pragmatism_party: "Коалиция окружных старост"
 ORV_Anton_Orval: "Антон Орваль"
 ORV_Anton_Orval_desc: "Антон Орваль поддерживает коалицию городов, фермерских округов и транспортных артелей, обещая каждому только достижимое. Союз редко действует быстро, зато не тратит силы на недоступные цели."

 MON: "Монтера"
 MON_DEF: "Монтарская Империя"
 MON_ADJ: "монтарск."
 MON_chauvinism: "Монтарская Империя"
 MON_chauvinism_party: "Имперский престол Аркенов"
 MON_Marius_II_Arken: "Марий II Аркен"
 MON_Marius_II_Arken_desc: "Марий II завершил Войну пяти знамён и объявил Монтеру наследницей всех северных корон. Император опирается на профессиональную армию, арсенальный пояс и жёсткую лестницу народов: полные права принадлежат ядру империи, а покорённым землям отведено служить её величию."
 MON_emperor_of_the_northern_marches: "Император северных марок"
 MON_emperor_of_the_northern_marches_desc: "Марий соединяет личный авторитет победителя с властью над штабом и двором. Его решения быстры, а несогласие легко объявляется изменой общей судьбе империи."
 MON_throne_of_fifteen_crowns: "Престол пятнадцати корон"
 MON_throne_of_fifteen_crowns_desc: "Побеждённые династии сохранили титулы, но присягнули Аркенам. Пышный двор укрепляет законность империи и одновременно поглощает огромные средства."
 MON_imperial_general_staff: "Имперский генеральный штаб"
 MON_imperial_general_staff_desc: "Единые карты, расписания и программы подготовки позволяют быстро разворачивать крупную армию на любом направлении."
 MON_arsenal_belt: "Арсенальный пояс Монтеры"
 MON_arsenal_belt_desc: "Южные города соединены военными заказами, железными дорогами и стандартизированными мастерскими. Производительность высока, но гражданская экономика вынуждена уступать армии."
 MON_hierarchy_of_peoples: "Имперская лестница народов"
 MON_hierarchy_of_peoples_desc: "Пропаганда обещает каждому сословию место в общем наступлении, но распределяет права и обязанности по происхождению. Система даёт много солдат и всё чаще рождает скрытое недовольство."
