 SHL_supply_off: "ручной"
 SHL_furnace_select_tt: "Выбрать печь. Оплаченные работы сохраняют свою первоначальную цель."
 SHL_supply_furnace: "Закупить сырьё для выбранной печи"
 SHL_supply_furnace_desc: "Доставка одного пакета сырья занимает 7 дней. До завершения нельзя оплатить другую работу по той же печи. При утрате контроля депозит возвращается."
 SHL_repair_furnace: "Обслужить выбранную печь"
 SHL_repair_furnace_desc: "За 14 дней ремонтная служба снизит износ на 30. Вспомогательные участки обслуживаются по очереди; главная печь продолжает производство."
 SHL_training_furnace: "Обучить смену выбранной печи"
 SHL_training_furnace_desc: "За 35 дней смена освоит программу школы мастеров. Прирост износа за обеспеченный производственный период постоянно снизится на 1. Повторное обучение той же смены не оплачивается."
 SHL_restart_furnace: "Повторно запустить выбранную печь"
 SHL_restart_furnace_desc: "Сначала определите собственника и подготовьте сырьё. Через 21 день печь возобновит работу с износом 20. Передача владения сама по себе не оплачивает запуск."
 SHL_site_available_tt: "Шахрабад владеет районом, контролирует его и не оплатил другую работу по этой печи."
 SHL_owner_settled_tt: "После погашения выбран новый собственник."
 SHL_transport_ready_tt: "Спор о транспортном доступе урегулирован оплатой соглашения или собственным транспортом."
 SHL_supply_result_tt: "Через §Y7 дней§!: §G+1§! пакет сырья выбранной печи."
 SHL_repair_result_tt: "Через §Y14 дней§!: §G-30§! износа выбранной печи без её погашения."
 SHL_training_result_tt: "Через §Y35 дней§!: прирост износа выбранной печи §G-1§! за обеспеченный период."
 SHL_restart_result_tt: "Через §Y21 день§!: выбранная печь возобновит работу с износом §Y20§!."
 SHL_shift_ordinary: "Обычная производственная смена"
 SHL_shift_overtime: "Усиленная производственная смена"
 SHL_shift_careful: "Бережная производственная смена"
 SHL_shift_ordinary_tt: "На работающую печь за 28 дней: §Y1§! пакет сырья, §Y+6§! износа, §G35§! £ADISCORD_economy_treasury_texticon."
 SHL_shift_overtime_tt: "На работающую печь за 28 дней: §Y2§! пакета сырья, §R+10§! износа, §G50§! £ADISCORD_economy_treasury_texticon."
 SHL_shift_careful_tt: "На работающую печь за 28 дней: §Y1§! пакет сырья, §Y+3§! износа, §G25§! £ADISCORD_economy_treasury_texticon."
 SHL_buy_reserve: "Подготовить аварийный резерв"
 SHL_buy_reserve_desc: "Два пакета пополняют общий резерв. Их можно немедленно направить выбранной печи или использовать для первой плавки. При споре с поставщиками одна закупка стоит 70 вместо 60; надбавка исчезает после покупки или создания железной дороги."
 SHL_use_reserve: "Передать резерв выбранной печи"
 SHL_use_reserve_tt: "§Y1§! пакет общего резерва немедленно переходит выбранной печи."
 SHL_reserve_result_tt: "Общий резерв: §G+2§! пакета сырья."
 SHL_allow_extinction: "Разрешить погашение выбранной печи"
 SHL_allow_extinction_desc: "Главная печь прекратит производство. Дом потеряет наследственный голос, а предприятие перейдёт городу. Здания остаются на месте; повторный запуск требует отдельного решения и оплаты."
 SHL_extinction_result_tt: "§RВыбранная печь погаснет и перестанет приносить доход.§! Дом потеряет голос; город получит владение."
 SHL_return_house: "Вернуть предприятие промышленному дому"
 SHL_return_house_tt: "Дом вернёт владение. Гражданская опора: §R-5§! при возврате городского предприятия. Давление гербов: §G-4§!. Голос восстановится после оплаченного запуска."
 SHL_city_ownership: "Закрепить городское владение"
 SHL_city_ownership_tt: "Город сохранит предприятие. После запуска его производство вернётся, но наследственный голос дома не восстановится. Давление гербов: §R+4§!, если в стране не установлена коммуна."
 SHL_state_ownership: "Передать предприятие дирекции"
 SHL_state_ownership_tt: "Владение переходит промышленной дирекции. Запуск оплачивается отдельно."
 SHL_project_engineers: "Собрать инженерное товарищество"
 SHL_project_foundation: "Подготовить участок десятой печи"
 SHL_project_construction: "Построить комплекс десятой печи"
 SHL_project_first_pour: "Провести первую плавку"
 SHL_project_engineers_tt: "Через §Y35 дней§! инженерная команда завершит проект. Депозит возвращается при отмене."
 SHL_project_foundation_tt: "Через §Y42 дня§!: §G+1§! инфраструктура в [294.GetName]. При уже максимальной инфраструктуре участок засчитывается, деньги возвращаются."
 SHL_project_construction_tt: "Через §Y70 дней§!: §G+1§! гражданская фабрика в [294.GetName]. Если при доставке нет места, депозит возвращается, этап остаётся доступным."
 SHL_project_first_pour_tt: "Через §Y14 дней§! десятая печь включится в производство. Отмена возвращает деньги и пакет сырья."
 SHL_supply_tenth: "Снабдить десятую печь"
 SHL_supply_tenth_tt: "§Y1§! пакет резерва переходит десятой печи."
 SHL_service_tenth: "Обслужить десятую печь"
 SHL_service_tenth_tt: "Через §Y14 дней§!: износ десятой печи §G-30§!. При утрате площадки [294.GetName] депозит возвращается."
 SHL_restart_tenth: "Повторно запустить десятую печь"
 SHL_restart_tenth_tt: "Через §Y21 день§!: десятая печь возобновит работу с износом §Y20§!. При утрате площадки [294.GetName] депозит возвращается."
 SHL_tenth_stopped_tt: "Десятая печь погасла. Подготовьте сырьё и оплатите повторный запуск."
 SHL_planned_supply: "Наладить плановый подвоз"
 SHL_planned_supply_desc: "В начале каждого производственного периода страна купит недостающие целые пакеты для действующих печей. Цена пакета — 25 казны. Служба не занимает ремонтные слоты, не берёт кредит и не тратит больше доступных средств. Ручные поставки и аварийный резерв остаются доступны."
 SHL_planned_supply_tt: "Недостающее сырьё действующих печей закупается раз в 28 дней по цене §Y25§! £ADISCORD_economy_treasury_texticon за пакет, в пределах казны."
 SHL_stop_planned_supply: "Приостановить плановый подвоз"
 SHL_stop_supply_tt: "Будущие автоматические закупки прекращаются. Уже доставленное сырьё остаётся на печах."
 SHL_census_tt: "Общий резерв: §G+2§! пакета сырья."
 SHL_common_fund_tt: "Общий резерв: §G+2§! пакета. Владельцы линий предложат условия доступа к строительству."
 SHL_workers_charter_tt: "Гражданская опора: §G+10§!. Недовольство кварталов: §G-10§!. Давление гербов: §R+10§!."
 SHL_course_house_tt: "Десятая печь получает наследственный голос во время работы. Вместимость казны: §G+10%§!. Давление гербов: §G-15§!. Недовольство кварталов: §R+10§!."
 SHL_course_city_tt: "Печи Шахрабада переходят городам. Представительство отделяется от непрерывной плавки. Стабильность: §G+3%§!. Давление гербов: §R+15§!."
 SHL_course_state_tt: "Печи Шахрабада переходят дирекции. Промышленное управление: §G+0.05§! £political_power_texticon в день. Давление гербов: §R+20§!."
 SHL_pressure_wait_tt: "До собственного транспорта строительство может быть закрыто спором о доступе. Завершённый транспортный фокус сохраняет свой результат."
 SHL_pressure_pay_tt: "Урегулировать доступ: §Y40§! £ADISCORD_economy_treasury_texticon."
 SHL_conclave_industry: "Непрерывная промышленность"
 SHL_conclave_industry_desc: "Промышленный вклад зависит от работающих печей под контролем Шахрабада. До политической реформы каждый действующий голос дома поддерживает прирост политической власти. Смена собственника не заменяет обслуживание и снабжение."
 SHL_country_operable: "Промышленное управление действует"
 SHL_project_idle: "Столичный участок доступен, другая работа не оплачена"
 SHL_furnace_site_idle: "Район доступен, другая работа по печи не оплачена"
 SHL_furnace_site_controlled: "Район принадлежит Шахрабаду и находится под его контролем"
 SHL_furnace_stock: "Пакеты сырья"
 SHL_furnace_wear: "Износ печи"
 SHL_furnace_running: "Печь работает"
 SHL_furnace_training: "Смена обучена"
 SHL_project_stage: "Этап десятой печи"
 SHL_reserve_stock: "Общий резерв сырья"
 SHL_regular_supply: "Плановый подвоз"
 SHL_shift_policy: "Режим смены"
 SHL_political_course: "Политический курс"
 ADISCORD_SHL.2.t: "Пока горит огонь"
 ADISCORD_SHL.2.d: "В зале Конклава девять гербов расположены выше кресла Джалиля Нура. На каждом изображён знак дома, но право сидеть под ним подтверждает не родословная: за городскими стенами должна работать его главная печь. Закон непрерывного огня появился, когда хозяева ещё могли бросить предприятие и оставить жителей без средств к жизни. Теперь он защищает владельцев от самого вопроса, кому принадлежит город.\n\nНур получил общую ведомость. В ней нет торжественных дат: только запасы, состояние кладки и люди следующей смены. Через двадцать восемь дней Конклав увидит первый производственный итог. До того печам нужны поставки, а старым мастерам — право открыто говорить о неисправностях."
 ADISCORD_SHL.2.a: "Открыть ведомость девяти печей."
 ADISCORD_SHL.3.t: "Состав не пришёл"
 ADISCORD_SHL.3.d: "На разгрузочной площадке остались пустые вагонетки. Управляющий предлагает работать с тем, что сохранилось в бункерах; мастер смены отказывается записывать пустой склад как выполненную поставку. Впервые общая ведомость показывает простой, который дома привыкли скрывать за праздничным отчётом.\n\nОдин необеспеченный период ещё можно пережить. Второй подряд погасит главную печь. Ручная поставка займёт семь дней, резерв поможет сразу, а транспортная служба сможет закупать недостающее сырьё перед будущими сменами."
 ADISCORD_SHL.3.a: "Проверить запасы и направить подвоз."
 ADISCORD_SHL.4.t: "Погасший герб"
 ADISCORD_SHL.4.d: "Дым над одним из заводских городов исчез. Печь не уничтожена: кладка и цеха стоят на месте, рабочие продолжают приходить к воротам. Но в Конклаве теперь спорят о праве занимать кресло под гербом её дома.\n\nГородская администрация предъявила старую статью закона. Когда главная печь погасла, владение вернулось городу. Дом предлагает оплатить запуск в обмен на возвращение прав; мастера требуют сохранить нового владельца. Нур должен закрепить собственность, прежде чем страна оплатит повторную плавку."
 ADISCORD_SHL.4.a: "Определить владельца и условия запуска."
 ADISCORD_SHL.5.t: "Первая плавка"
 ADISCORD_SHL.5.d: "Новый комплекс запустили без наследственного герба над воротами. Первую смену составили мастера разных городов, а под ведомостью поставок стоят подписи товарищества. Когда металл пошёл в изложницы, спор о возможности построить десятую печь закончился. Остался спор о её правах.\n\nСтарые дома готовы признать нового владельца одним из своих. Городские представители требуют открыть Конклав всем самостоятельным промышленным общинам. Нур предлагает единую дирекцию. Каждый вариант оставляет печь работать — и каждый по-разному отвечает на вопрос, кому принадлежит новая власть."
 ADISCORD_SHL.5.a: "Представители десятой печи войдут в зал."
 ADISCORD_SHL.6.t: "Цена транспортного доступа"
 ADISCORD_SHL.6.d: "Владельцы линий прислали общий договор: тяжёлое оборудование пропустят к новому комплексу после согласования доступа. Сумма невелика рядом с полной стоимостью стройки, но подпись признает право старых домов отдельно продавать разрешение на каждое новое предприятие.\n\nНур может оплатить соглашение или дождаться собственной транспортной службы. Инженерная работа и подготовка земли продолжаются в любом случае. Если независимый транспорт уже создан, открытое письмо не отменяет завершённого решения."
 ADISCORD_SHL.6.a: "Продолжить подготовку собственного транспорта."
 ADISCORD_SHL.6.b: "Оплатить доступ к линиям."
