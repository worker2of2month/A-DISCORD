 SHL_south_house: "Дома: фабрика; при заполненных слотах - 2700 винтовок владельцу района."
 SHL_south_city: "Города: инфраструктура +1; при максимуме - переселение 2000 рекрутов владельцу. Поддержка +10; наш район станет национальным, союзный сохранит независимость."
 SHL_south_directorate: "Дирекция: военный завод; при заполненных слотах - 32 комплекта оружия отделения владельцу района."
 SHL_south_regent: "Регентство: печь возвращается дому; обучение до 2, износ -30; организация армии +5%. Давление -15, недовольство +10. Долги сохраняются."
 SHL_south_commune: "Коммуна: инфраструктура +1 до максимума; владелец района получает одну полностью оплаченную дружину из наших рекрутов и оружия."
