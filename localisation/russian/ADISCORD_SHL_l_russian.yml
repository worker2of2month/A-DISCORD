l_russian:
 SHL_conclave: "Конклав печей"
 SHL_conclave_desc: "Дома сохраняют наследственные права, пока работают их главные печи. Каждые 28 дней производство расходует сырьё, приносит доход и увеличивает износ. Выберите печь на панели, чтобы организовать поставку, обучение или ремонт. Погашение меняет собственника, но не уничтожает город и его заводы."
 SHL_tenth_project: "Десятая печь"
 SHL_tenth_project_desc: "Товарищество мастеров строит новое производство в столице. Каждый этап оплачивается отдельно. Потеря участка или невозможность выдать оплаченный завод возвращает депозит и позволяет повторить работу."
 SHL_panel_title: "КОНКЛАВ ПЕЧЕЙ"
