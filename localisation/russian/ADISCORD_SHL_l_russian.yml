 SHL_tenth_condition_pending: "Каждый этап проекта оплачивается отдельно."
 SHL_civic_mandate_tt: "Гражданская опора: не менее 30. Рабочая хартия даёт 10; переход погасшей печи от дома к городу даёт 5."
 SHL_masters_ready_tt: "Спор о мастерах урегулирован оплатой соглашения или собственной школой."
 SHL_masters_wait_tt: "Подготовка участка ждёт соглашения с мастерами. Школа мастеров решит спор без отдельной оплаты."
 SHL_masters_pay_tt: "§Y40§! £ADISCORD_economy_treasury_texticon: соглашение с мастерами закрывает спор."
 SHL_suppliers_wait_tt: "Следующая закупка двух пакетов резерва стоит §Y70§! £ADISCORD_economy_treasury_texticon вместо §Y60§!. Железная дорога домов снимет надбавку."
 SHL_suppliers_pay_tt: "§Y15§! £political_power_texticon: согласовать прежнюю цену резерва."
 SHL_price_70: "§Y70§!"
 SHL_price_70_red: "§R70§!"
 SHL_reserve_affordable: "В казне достаточно средств для закупки резерва."
 ADISCORD_SHL.7.t: "Чьи мастера?"
 ADISCORD_SHL.7.d: "Старые дома признали расчёты Товарищества мастеров и инженеров, но отказались считать мастеров свободными участниками новой стройки. Письмо подписали Ширин Шарим и Хосров Арбин: лучшие смены Шахрабада обучались у их печей, и переход опытных людей на площадку в Девятипечье они связывают с отдельным соглашением. Проект уже существует; никто не вправе повторно взыскать деньги за завершённые чертежи, и Рауф Дарбан напомнил об этом первым.\n\nФарид Мехр предлагает другой путь: школа мастеров при печах Конклава подготовит собственные кадры, и ни один дом не сможет назвать их своими. Это дольше, но оставляет людей свободными. Голшан Лоран, которому нужен металл десятой печи для экспортных договоров, советует просто заплатить и не терять сезон.\n\nТоварищество может оплатить соглашение или подготовить собственных мастеров. До решения спора участок ждёт начала работ. Если школа уже действует, открытое письмо не изменит её полномочий."
 ADISCORD_SHL.7.a: "Подготовим собственных мастеров."
 ADISCORD_SHL.7.b: "Согласовать переход специалистов."
 ADISCORD_SHL.8.t: "Особая цена резерва"
 ADISCORD_SHL.8.d: "Поставщики готовы признать общий аварийный резерв Конклава, но называют его внеочередной закупкой и требуют надбавку к ближайшему заказу. Тахмурас Байрат объясняет это спокойно: по отдельности каждый дом получал прежнюю цену, потому что платил вперёд и возил сам; общий резерв Хазара платит после и требует вагоны. Ферейдун Кердан соглашается возить, но по тарифу своей дороги.\n\nОбщая ведомость впервые превращает девять привычных договоров в один публичный спор. Лейла Надири подсчитала, во что обходится надбавка на одну закупку, а Амин Рашад предупредил, что уступка станет правилом, если её не оговорить. Железная дорога домов, если Конклав её построит, сняла бы вопрос о тарифе целиком.\n\nДжалиль Нур может потратить политическое влияние на соглашение, принять надбавку для одной закупки или дождаться дороги. Уже оплаченные поставки сохраняют свою цену. Действующая транспортная служба не уступит полномочия из-за задержанного письма."
 ADISCORD_SHL.8.a: "Следующий заказ выдержит надбавку."
 ADISCORD_SHL.8.b: "Согласовать прежнюю цену."
