 SHL_status_pressure_calm: "Дома ждут решения."
 SHL_status_water_war: "§RВойна за кяризы.§!"
 SHL_status_water_open: "§RСпор о воде.§! Плавка в Арбине, Сафире и Лоране даёт §R+4§! износа, если у печи нет оборотного охлаждения."
 SHL_status_water_quota: "Водная квота: §R-3§! £ADISCORD_economy_treasury_texticon с каждой печи."
 SHL_status_water_wells: "Скважины обеспечивают печи водой."
 SHL_status_water_taken: "Пограничные кяризы под контролем Шахрабада."
 SHL_status_water_brotherhood: "Братство кяризов: вода без квоты."
 SHL_status_water_quiet: "До спора в Арбине, Сафире и Лоране можно провести воду к печи или во дворы. Выберите округ на карте Конклава печей."
 SHL_status_veyr_war: "§RПортовая война.§!"
 SHL_status_veyr_duty: "§RВейрский сбор: -5 £ADISCORD_economy_treasury_texticon с каждой печи.§!"
 SHL_status_veyr_union: "Торговый союз с Вейром."
 SHL_status_veyr_harbour: "Гавань Кердана обходит вейрский сбор."
 SHL_status_veyr_taken: "Норан и Кассен перешли Шахрабаду."
 SHL_status_veyr_quiet: "Сбора нет."
 SHL_status_keizan_war: "§RКейзан наступает на Зарханский округ.§!"
