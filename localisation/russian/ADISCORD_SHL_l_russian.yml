# Keizan border pact and neutrality
 SHL_kyz_border_pact_faction: "Пограничный договор Кейзана"
 SHL_negotiate_kyz_neutrality: "Согласовать нейтралитет соседа"
 SHL_negotiate_kyz_neutrality_desc: "Посланники везут соседям предложение о примирении. Прежде чем говорить о новой войне, придётся вспомнить прежние обиды."
 SHL_kyz_neutrality_funds_tt: "Есть §Y100§! £ADISCORD_economy_treasury_texticon для компенсации при подписании"
 SHL_kyz_neutrality_idle_tt: "Сосед не рассматривает другое наше предложение о нейтралитете"
 SHL_kyz_neutrality_offer_tt: "Сосед получит предложение о нейтралитете. Только при его согласии и до начала войны: §R-100§! £ADISCORD_economy_treasury_texticon из нашей казны и §R-30§! £political_power_texticon; сосед получит §G100§! £ADISCORD_economy_treasury_texticon и откажется от участия на стороне Кейзана. Средства повторно проверяются при подписании."
 SHL_kyz_pact_accept_tt: "При начале объявленной войны мы вступим на стороне Кейзана против Шахрабада. Договор действует только на эту войну: её исход определяется миром Шахрабада с Кейзаном. До объявления войны можно принять компенсацию Шахрабада и сохранить нейтралитет."
 SHL_kyz_neutrality_accept_tt: "Получить от Шахрабада §G100§! £ADISCORD_economy_treasury_texticon. Шахрабад также потратит §R30§! £political_power_texticon. Наше участие в кейзанском пограничном договоре отменяется; прежняя военная претензия урегулирована. Передача состоится только при наличии всей суммы и до начала войны."
 SHL_kyz_flank_none: "Дополнительный противник не заявлен."
 SHL_kyz_flank_negotiating: "Предложение о нейтралитете ожидает ответа; до согласия угроза сохраняется."
 SHL_kyz_flank_mzr_pending: "Мазар рассматривает вступление на стороне Кейзана: под угрозой юго-восточная граница у Зархана."
 SHL_kyz_flank_glp_pending: "Вейр рассматривает вступление на стороне Кейзана: под угрозой восточная граница."
 SHL_kyz_flank_mzr_signed: "§RМазар согласился открыть юго-восточный фронт у Зархана на стороне Кейзана.§!"
 SHL_kyz_flank_glp_signed: "§RВейр согласился открыть восточный фронт на стороне Кейзана.§!"
 SHL_kyz_flank_mzr_war: "§RМазар воюет на стороне Кейзана. Общий мир завершит его участие.§!"
 SHL_kyz_flank_glp_war: "§RВейр воюет на стороне Кейзана. Общий мир завершит его участие.§!"
 ADISCORD_SHL.124.t: "Второй край войны"
 ADISCORD_SHL.124.d: "[FROM.GetName] ведёт переговоры с Собранием арычных общин. После нашего отказа платить паёк обещание кейзанской защиты нашло внимательных слушателей, и Бахрам Каве подтверждает: посланники общин уже дважды проезжали через соседнюю столицу. Пока договор не подписан, но Арман Теймур обязан учитывать ещё одно направление, а Бехруз Вейран - делить гвардии пограничного дома на два фронта.\n\nДо начала войны мы можем предложить соседу компенсацию и нейтралитет через решение \"Согласовать нейтралитет соседа\". Рамин Фарзан готов везти предложение, но предупреждает, что согласие не гарантировано: сосед помнит, кто первым взялся за оружие. Подписание потребует 100 £ADISCORD_economy_treasury_texticon и 30 £political_power_texticon; при отказе деньги останутся у нас. Дарий Сафир считает цену низкой рядом со вторым фронтом; Тахмурас Байрат - высокой рядом с тем, что сосед может взять её и всё равно подписать с Кейзаном.\n\nКейзан не станет искать замену этому участнику в течение нынешней подготовки. Один раз закрытая дверь останется закрытой до конца кампании."
 ADISCORD_SHL.124.a: "Учесть угрозу и начать переговоры."
 ADISCORD_SHL.125.t: "Кейзан предлагает защиту"
 ADISCORD_SHL.125.d: "Шахрабад уже пытался навязать нам свою волю силой: его стража стояла у наших колодцев и портов, а гвардии дома Вейран - у наших границ. Теперь Собрание арычных общин предлагает встретить следующую войну вместе. Когда Кейзан и Шахрабад начнут боевые действия, наша армия откроет соседний фронт, и Конклаву придётся делить девять гвардий и одну стражу на два направления.\n\nЭто ограниченный военный договор. Капитуляция Кейзана или согласованный им мир завершат наше участие; один пограничный поход не должен поглотить всю внешнюю политику страны. Делегаты общин не обещают ни земли, ни воды - только то, что Шахрабад будет занят.\n\nДо объявления войны остаётся возможность принять шахрабадскую компенсацию и сохранить нейтралитет: посланник Рамина Фарзана ждёт ответа с суммой в руках. Подписать договор - значит выбрать Кейзан. Остаться в стороне - значит ждать, кто из соседей победит, и говорить с победителем."
 ADISCORD_SHL.125.a: "Подписать пограничный договор."
 ADISCORD_SHL.125.b: "Остаться в стороне."
 ADISCORD_SHL.126.t: "Цена нейтралитета"
 ADISCORD_SHL.126.d: "Шахрабад предлагает компенсацию за прежний военный конфликт в обмен на наш отказ участвовать в кейзанском походе. Рамин Фарзан привёз предложение лично и не скрывал, кто его оплачивает: казна Конклава, а не казна дома, который начинал войну. Мы сохраним независимость, а 100 £ADISCORD_economy_treasury_texticon поступят после подписания. Территориальная граница останется прежней - ни уступок, ни возврата.\n\nСоглашение возможно, пока война с Кейзаном не началась и Шахрабад располагает всей объявленной суммой. Посланник честно предупредил, что Конклав не будет повторять предложение после первого выстрела: Арман Теймур уже делит стражу по направлениям, и Хазар хочет знать, сколько их будет.\n\nПоддержать Кейзан, принять компенсацию или остаться в стороне - решение принадлежит нам. Деньги Шахрабада не вернут того, что он взял силой; но и Собрание арычных общин не обещает ничего, кроме общего врага."
 ADISCORD_SHL.126.a: "Принять компенсацию и нейтралитет."
 ADISCORD_SHL.126.b: "Не подписывать соглашение."
 ADISCORD_SHL.127.t: "Одна граница спокойнее"
 ADISCORD_SHL.127.d: "[FROM.GetName] принял наше предложение. Компенсация перечислена, договорённость с Кейзаном отменена, и Бахрам Каве подтверждает, что посланники общин уехали из соседней столицы без подписи. На подготовку соглашения израсходованы 100 £ADISCORD_economy_treasury_texticon и 30 £political_power_texticon; Лейла Надири записала обе суммы отдельной строкой - как цену второго фронта, которого не будет.\n\nАрман Теймур вернул стражу на одно направление, Бехруз Вейран - гвардии пограничного дома к Зарханскому округу. Дарий Сафир считает, что заплатили дёшево; Тахмурас Байрат - что заплатили за то, чего сосед всё равно не сделал бы. Рамин Фарзан просит Конклав помнить, что подпись соседа стоит ровно столько, сколько наше поведение после неё.\n\nПрежний пограничный конфликт урегулирован. Новое нападение с нашей стороны вновь даст соседу основание искать защиту; нынешний договор не оправдывает дальнейшего насилия. Теперь сосредоточимся на Кейзане."
 ADISCORD_SHL.127.a: "Теперь сосредоточимся на Кейзане."
 ADISCORD_SHL.128.t: "Соглашение не подписано"
 ADISCORD_SHL.128.d: "Переговоры о нейтралитете завершились без соглашения. Компенсация не перечислена, политическая власть не потрачена; Рамин Фарзан вернулся в Хазар с тем же кошелём, с которым уезжал, и с письмом, в котором сосед благодарит за внимание и ничего не обещает. Бахрам Каве доложил, что посланники Собрания арычных общин по-прежнему в соседней столице.\n\nАрман Теймур оставил план на два направления, а Бехруз Вейран - гвардии дома у обоих краёв границы. Дарий Сафир предлагает поднять сумму; Тахмурас Байрат - не платить вовсе и показать соседу стражу. Мехран Арбин напоминает, что сосед помнит, кто первым взялся за оружие, и деньгами такую память не стирают - только временем.\n\nТекущее положение соседа указано в сводке пограничных кризисов. Пока подготовка продолжается, мы можем вернуться к переговорам после перерыва. Кейзан за это время тоже не будет сидеть сложа руки."
 ADISCORD_SHL.128.a: "Учитывать это в наших планах."
 SHL_startup_region:0 "§YЮЖНЫЕ ПУСТЫНИ: ОКРУЖЕНИЕ ШАХРАБАДА§!\n\nОбстановка к началу 2160 года.\n\n§YКейзан: вода для печей и водный паёк§!\nСобрание арычных общин не признаёт постоянной столицы. Поселения обслуживают свои участки кяризов и договариваются об общих работах через делегатов. Эти водные пути питают и западные печи Шахрабада, и общины считают шахрабадский металл платой за свою воду: назначенный ими водный паёк превращается в требование, а затем в ультиматум Зарханскому округу, к которому выходит Табар. Промышленная мощь Лиги зависит от отношений с общинами, не желающими подчиняться чужому центру.\n\n§YВейр: выход к морю§!\nТорговая палата объединяет порты, мастерские и судоремонт. Портовый кодекс регулирует сборы и страхование, а металл Шахрабада проходит через эту систему к внешним рынкам. Для домов цена вывоза продукции не менее важна, чем цена руды.\n\n§YМазар: общий паёк за дальней границей§!\nПалата общего пайка распределяет воду и припасы по принципу общей пользы и касается Шахрабада лишь цистернами Ресана у Зарханского округа. Сама она требований не предъявляет, но смотрит на спор Кейзана с Шахрабадом как на дело всей пустыни: её отряды могут встать рядом с общинами, а её нейтралитет можно купить. Для южного курса Мазар остаётся соседом, которого приглашают в договор или присоединяют.\n\n§YСветлогорье и северный нефтяной бассейн§!\nНаместническая администрация Светлогорья опирается на воркерландское наследство, нефтяные поля и гарнизоны. Эфлор и Ажар оспаривают земли, отнятые прежней империей. Для Шахрабада положение на севере определяет, кто будет контролировать топливо и обладать силой для борьбы за влияние на Юге. Нефтяной контракт Светлогорья удешевляет сырьё для печей, эмбарго делает каждый пакет дороже.\n\n§YДальние покупатели§!\nКефрейт, Стеландер и Земля Хана не граничат с пустынями, но покупают металл Золотых ворот: контракт на поставки одной печи приносит казне плату каждый цикл и переживает всё, кроме войны и неуплаты.\n\n§YКарта Шахрабада§!\nДевять печных областей носят имена своих домов: Арбин, Сафир, Лоран, Нуран, Байрат, Кердан, Шарим, Девятипечье и Вейран; столица - Хазар, южный рубеж - Зарханский округ с Зарханом и Зархан-калой. За печными городами лежат четыре сельские области: Сафирское взморье с портом Сафир-бандар, Лоранские пески с Лоран-дехом, Байратские копи с рудничным Байрат-каном и Вейранская граница с Вейран-калой у рубежа Вейра."
 SHL_startup_country: "§YЛИГА ШАХРАБАДА В 2160 ГОДУ§!\n\n§YГород зависел от печи§!\nПромышленный Шахрабад сложился вокруг предприятий, от которых зависели заработок и снабжение жителей. Владелец мог оставить завод и лишить город средств к жизни. Закон непрерывного огня должен был связать право собственности с обязанностью сохранять производство.\n\nГлавная печь стала мерой этой обязанности. Пока она работала, дом сохранял завод и место в Конклаве. Если огонь гас, владение возвращалось городу. Остановка не означала уничтожения цехов: тот же завод мог продолжать существовать с другим хозяином. Поэтому закон регулировал не только хозяйство, но и право говорить от имени города.\n\n§YОт обязанности к привилегии§!\nСо временем норма, защищавшая жителей от брошенного предприятия, стала основанием власти промышленных домов. Наследственное имя, богатство и владение производством образовали единый порядок. Рабочим кварталам обещали заработок и снабжение, городам - защиту, а правящим семьям оставались прибыль и привычная роскошь.\n\nДевять домов замкнули в своём кругу согласование закупок, экспорта и цен на энергию. Работающая печь подтверждала их политические права, и спор о ремонте превращался в спор о праве управлять. О состоянии оборудования судили не только как о техническом вопросе: признание неисправности могло поставить под угрозу положение семьи.\n\n§YХозяйство отдельных домов§!\nХазар стал столицей Лиги, печной район - её промышленным сердцем. Байрат давно снабжает печи рудой, но шахты связаны старыми договорами каждого дома. Общая зависимость от металла и перевозок не уничтожила отдельных владений и интересов.\n\nТак возникло хозяйство, части которого нужны друг другу, но не распоряжаются ресурсами как единое предприятие. Поставка пересекала чужие участки, заводская стража защищала своих владельцев, а доход распределялся между домами, кварталами и общей властью. Люди за пределами официальных реестров оставались с меньшим политическим весом, чем те, кто распоряжался их работой.\n\nВ Конклаве решения оплачивались уступками семьям, державшим наследственные места. За его стенами домовые, цеховые и городские списки не совпадали: житель мог годами работать у печи, но оставаться чужим для учреждения в соседнем квартале. Промышленная связь городов оказалась прочнее общей системы гражданских прав.\n\n§YДевять гербов над креслом§!\nК 2160 году гербы домов висят в Конклаве выше кресла Джалиля Нура. Лига располагает действующими заводами и многочисленным населением, но её устройство по-прежнему опирается на старое условие: огонь даёт собственность и голос. Под этой устойчивой формулой накопились износ, споры о снабжении и недовольство кварталов. Закон, некогда призванный защищать город от хозяина, теперь служит и оправданием власти хозяина над городом."
 SHL_startup_guide_furnaces_title: "Печи и производство"
 SHL_startup_guide_furnaces: "§YКАК РАБОТАЮТ ПЕЧИ§!\n\n§YПанель и цикл§!\nОткройте \"$SHL_conclave$\" и выберите объект. Каждые 28 дней работающая печь расходует сырьё, приносит доход и получает износ. Обычная смена тратит 1 пакет, усиленная - 2. Без сырья печь простаивает и быстрее изнашивается. Износ 100 или два простоя подряд гасят её.\n\n§YДва разных склада§!\nМестный запас расходует только выбранная печь. Общий резерв сам по печам не распределяется: отдельная кнопка сразу переносит из него 1 пакет выбранному объекту. Это можно сделать и при занятой местной операции. Обычная покупка сырья приходит через 7 дней; её цена показана на панели и зависит от Светлогорья: нефтяной контракт удешевляет пакет, эмбарго - удорожает.\n\n§YУ каждой печи своя очередь§!\nПоставка, обслуживание и обучение смены занимают один местный слот. Две такие работы у одной печи одновременно не идут, но другая печь может выполнять свой заказ. Обслуживание длится 14 дней и снимает 30 износа без остановки производства. Не оставляйте ремонт до цикла, в котором износ достигнет предела.\n\n§YАвтоподвоз§!\nЗавершите $SHL_law_of_continuous_fire$ и включите подвоз. В начале цикла он докупает недостающие пакеты только для работающих печей. К ручной цене прибавляется 5 £ADISCORD_economy_treasury_texticon за 1 £SHL_packet_texticon. После фокуса $SHL_houses_railway$ обе цены равны. Если денег на заказ печи не хватает, её смена пропустит плавку.\n\n§YМеталл на продажу§!\nСвободная экспортная печь может работать на контракт: решение \"$SHL_metal_contract_offer$\" предлагает Кефрейту, Стеландеру, Земле Хана и другим покупателям металл Золотых ворот за плату каждый цикл. Контракт держится, пока покупатель платит и между сторонами нет войны.\n\n§YРежим и собственность§!\nБережная плавка уменьшает износ ценой дохода, усиленная требует двойного сырья ради большей выручки. Режимы открывает промышленная ветка. Погашение лишает дом голоса, завод остаётся городу; повторный запуск оплачивается отдельно.\n\n§YДесятая печь§!\nТоварищество, земля, строительство и первая плавка - отдельные оплачиваемые этапы, открываемые фокусами. Планируйте их вместе с содержанием девяти действующих печей."
 SHL_startup_guide_fire_title: "Раздел огня и кварталы"
 SHL_startup_guide_fire: "§YКОМУ ОТДАТЬ ПЛАВКУ§!\n\n§YОдин получатель для каждой печи§!\nВыберите печь и назначьте экспорт, арсенал, кварталы или герб. Назначение сохраняется; сырьё расходуется и результат выдаётся только в успешную смену. Десятая печь выбирается отдельно.\n\n§YЦена выбора§!\nЭкспорт даёт 60 / 90 / 25 казны до удержаний. Арсенал вместо денег даёт 2700 / 5400 / 1350 винтовок. Кварталы снижают недовольство на 4 / 6 / 2, гербы снижают давление на 4 / 6 / 2. Порядок: обычная / усиленная / бережная смена. Сырьё и ремонт оплачиваются отдельно.\n\n§YКурс и заказы§!\nДома и регентство усиливают поставки гербам; города и коммуна - кварталам. Города удешевляют городские заказы, дирекция - арсенальные. Платный заказ занимает одну печь и один общий слот: обычной поставки вдобавок нет. Цена и возврат фиксируются при оплате. После расчёта печь продолжает снабжать получателя заказа.\n\n§YПоддержка домов§!\nДом с правом голоса поддерживает нас после фактической поставки гербу. Большинство даёт гарантии Конклава без §Y40§! £political_power_texticon. Компенсация после смены собственника не возвращает голос. При коммуне поставки гербам закрыты.\n\n§YСледите за сроками§!\nНедовольство и давление от 60 могут открыть кризис. Поставки не отменяют фонового роста шкал. Износ от 90 грозит аварией: оставляйте резерв на ремонт и ответы на события."
 SHL_startup_guide_wars_title: "Подготовка к войне"
 SHL_startup_guide_wars: "§YОТ ЗАВОДСКОЙ СТРАЖИ К ОБОРОНЕ§!\n\n§YСрок первой угрозы§!\nПервое требование Кейзана назначено на 168-й день от начала кампании. Подготовка армии и снабжения должна идти рядом с политическим строительством. Ожидание десятой печи не останавливает соседний кризис.\n\n§YСоберите реальные силы§!\n\"Охрана железной дороги\", \"Заводская стража\" и \"Южная стража\" помогают подготовить оборону. Проверьте, что открыл каждый фокус: доступное решение ещё нужно исполнить. Военный мандат курса и \"Две плавки для фронта\" дают дополнительные возможности. Сверяйте полученные формирования с запасами для пополнения.\n\n§YСодержите печи во время подготовки§!\nАрмейские расходы конкурируют с сырьём и ремонтом. Проверьте местные запасы, время до следующего цикла и резерв казны. Поставки арсеналу заменяют выручку выбранных печей; сохраняйте деньги на подвоз и ремонт.\n\n§YОтвет на требование§!\nКогда Кейзан потребует платы за воду под угрозой Зарханскому округу, сравните цену платежа и выкупа спора с готовностью к отказу и войне. Конкретные суммы и сроки указаны в предложении. После столкновения \"Цена наступившего мира\" открывает восстановление выбранного района.\n\n§YВнешние решения§!\nСпоры о воде и морском выходе открывают соответствующие фокусы. Смотрите доступные договоры и условия в решениях. Обычные дипломатические кнопки объявления войны и создания союза отключены: внешние действия оформляются фокусами, решениями и событиями.\n\nСведения о соседях находятся в \"Регионе\", политические варианты южной кампании - в \"Путях\". Здесь главное - успеть подготовить оплаченные силы, сохранить производство и ответить на действующие сроки."
 SHL_startup_guide_plan_title: "Первые шаги"
 SHL_startup_guide: "§YПЕРВЫЕ ШАГИ ЗА ШАХРАБАД§!\n\n§Y1. Осмотрите девять печей.§! Откройте \"$SHL_conclave$\". В начале у каждой печи 2 £SHL_packet_texticon, в общем резерве ещё 2 £SHL_packet_texticon. Проверьте износ, режим смены и время до ближайшего 28-дневного цикла.\n\n§Y2. Запланируйте третью плавку.§! Двух местных пакетов хватает на два обычных цикла. До третьего нужны новые поставки, передача резерва или работающее плановое снабжение. Покупка идёт 7 дней; общий резерв можно передать сразу.\n\n§Y3. Не путайте резерв со снабжением.§! После переписи девяти печей общий резерв получает 4 £SHL_packet_texticon. Печи не получают их автоматически. Распределяйте запас туда, где он нужен раньше всего.\n\n§Y4. Сопоставьте стройку и содержание.§! После \"Правил Конклава\" выбирается политический курс, а ствол ведёт к десятой печи. Её этапы оплачиваются отдельно. Сначала оставьте деньги на сырьё и ближайший ремонт, затем назначайте новую стройку.\n\n§Y5. Готовьте оборону заранее.§! Первое требование Кейзана приходится на 168-й день. Проверяйте открытые военные решения и реальные сроки подготовки, не откладывая армию до завершения всего политического курса.\n\n§Y6. Проверяйте шкалы и баланс.§! Раздел \"$SHL_quarters_and_borders$\" показывает недовольство кварталов, давление гербов и шкалу \"$SHL_conclave_balance$\". Шкалы ведут к кризисам, баланс решает, какой курс можно ратифицировать. При начале кризиса прочитайте миссию и ответьте до окончания таймера. Курсы и их исходы описаны в \"Путях\".\n\n§Y7. Читайте Конклав.§! Книга печей раз в несколько месяцев открывает хронику Закона непрерывного огня, Архив Конклава и короткие сцены жизни печей показывают дома и кварталы, а \"$SHL_festival_of_fire$\" раз в год собирает город у Золотых ворот. Это истории, а не задачи; главу можно закрыть на любой странице."
 SHL_startup_path_0_title:0 "Дома: Конклав десяти"
 SHL_startup_path_0:0 "§YДЕСЯТЫЙ ДОМ§!\n\nВыберите компромисс с домами и сохраните их перевес в Конклаве. Товарищество получит место среди гербов, а Джалиль Нур останется посредником между владельцами печей.\n\nЭтот курс строится на торговле, кредите и частных гвардиях. Вы будете выбирать устройство картеля, охрану контрактов и хозяйственные связи с соседями. Зависимость Юга от поставок металла превращается в политический инструмент.\n\nПосле войны за Юг открываются Светлогорская концессия, южная биржа или банк и Корона торговли.\n\nПод спойлерами - цепочка ратификации, требования к балансу и различия политических итогов."
 SHL_startup_path_0_details:0 "§YДОМА: ВХОД И ТОРГОВАЯ ГЕГЕМОНИЯ§!\n\n§YКак открыть§!\nВыведите гербы вперёд и соберите за поставки больше половины голосов занятых мест. При равновесии принятый $SHL_house_compromise$ удержит этот мандат за домами. Постройка десятой печи ведётся отдельно.\n\n§YЧем управлять§!\nГербы находятся слева на шкале \"$SHL_conclave_balance$\". \"$SHL_heralds_table$\" и открываемый им \"$SHL_house_banquet$\" помогают укреплять их позиции. Приём одновременно снижает давление домов: баланс власти и готовность к мятежу - разные показатели.\n\n§YРазвилки§!\nВыберите твёрдую цену картеля или биржу металла, гвардии домов или наёмную стражу. \"$SHL_houses_prog_ending_a$\" усиливает торговые и административные возможности; \"$SHL_houses_prog_ending_b$\" делает ставку на стабильность и производственную эффективность. Это два итога внутри курса домов.\n\n§YСоседи и финал§!\nДолговая сеть, торговые протектораты и дорога к морю позволяют собирать Юг через экономическую зависимость. \"$SHL_south_oil_for_furnaces$\" готовит выступление в общей войне за Юг. После победы \"$SHL_h_concession_of_svetlogorye$\" открывает выкуп подходящих зависимых стран за казну; затем выбирайте биржу или банк Юга и завершайте торговую гегемонию через \"$SHL_h_crown_of_trade$\". Условия общей войны вынесены на последнюю страницу."
 SHL_startup_path_1_title:0 "Города: Южный договор"
 SHL_startup_path_1:0 "§YОТКРЫТЫЙ КОНКЛАВ§!\n\nВыберите городские хартии, укрепите гражданскую опору и перевес кварталов. После ратификации Мехран Арбин сменит Нура во главе Южного договора.\n\nКурс развивает представительство городов, общественные службы, кооперативы и инфраструктуру. Вам предстоит определить, кто представляет жителей и кто защищает договор, а затем выбрать гражданский или производственный приоритет.\n\nСоседям предлагаются хартии и общий союз. Победа в войне за Юг открывает объединение по согласию, Совет Юга либо развитие общин и итоговый Договор Юга.\n\nВ спойлерах указаны нужные фокусы, гражданская опора и политические развилки."
 SHL_startup_path_1_details:0 "§YГОРОДА: ХАРТИИ И ОБЩИЙ ДОГОВОР§!\n\n§YКак открыть§!\nДоведите поддержку городов до 30 и добейтесь перевеса кварталов. При равновесии городам поможет принятый $SHL_city_charters$. Победа приведёт к власти Мехрана Арбина.\n\n§YКак подготовить условия§!\nКварталы находятся справа на шкале Конклава. \"$SHL_quarter_listening$\" и передача печей кварталам укрепляют их положение. Действующие печи с городскими хартиями наращивают гражданскую опору и снижают недовольство. Следите за давлением домов: городские реформы могут вызвать их ультиматум.\n\n§YРазвилки§!\nВыберите делегатов городов или собрание смен, дружины кварталов или договорную армию. \"$SHL_cities_prog_ending_a$\" поддерживает инфраструктуру и стабильность; \"$SHL_cities_prog_ending_b$\" - военное строительство и эффективность производства. Оба продолжают городской путь. Хозяйственная ветка даёт школы, больницы, кооперативный банк и водные либо портовые работы.\n\n§YСоседи и финал§!\nХартии колодцев и свободный тракт собирают партнёров Южного договора. Договор вступает в силу после согласия партнёра. \"$SHL_south_war_of_charters$\" готовит общую войну за Юг. После победы \"$SHL_c_svetlogorye_charter$\" открывает объединение подходящих зависимых стран по согласию. Совет Юга или общины ведут к \"$SHL_c_treaty_of_the_south$\". Условия войны - на последней странице."
 SHL_startup_paths_note:0 "Просмотр не выбирает курс. Условия входа и финалы - в спойлерах."
 SHL_startup_path_2_title:0 "Дирекция Нура"
 SHL_startup_path_2:0 "§YГОСУДАРСТВО ПЕЧЕЙ§!\n\nВыберите дирекцию и удержите равновесие между гербами и кварталами. Джалиль Нур превратит роль посредника в государственную власть над печами.\n\nКурс связывает производство, снабжение и армию единым управлением. Внутри него остаётся выбор между государственными печами и концессиями, военными заказами и строительством. Железные дороги, склады и мастерские готовят страну к большой кампании.\n\nНа Юге дирекция опирается на ультиматумы и Железный марш. Победа ведёт к генерал-губернаторству и Железному венцу.\n\nВ спойлерах - порядок ратификации, нужный баланс и варианты развития дирекции."
 SHL_startup_path_2_details:0 "§YДИРЕКЦИЯ: РАВНОВЕСИЕ И ПРИКАЗ§!\n\n§YКак открыть§!\nЕсли ни дома, ни кварталы не соберут большинство, Нур получит мандат на создание дирекции. Сверяйте прогноз в разделе $SHL_quarters_and_borders$, особенно после поставок и городских реформ.\n\n§YКак удержать вход§!\nПредварительный выбор дирекции сам не выравнивает шкалу. Компенсируйте накопленный перевес решениями и политикой печей, проверяя текущий диапазон перед ратификацией. Давление гербов и недовольство кварталов остаются самостоятельными угрозами даже при равновесии.\n\n§YРазвилки§!\nВыберите \"$SHL_d_state_furnaces_law$\" или \"$SHL_d_concessions_law$\", затем дирекцию вооружений или строительства. \"$SHL_directorate_prog_ending_a$\" усиливает производственные возможности и управление; \"$SHL_directorate_prog_ending_b$\" поддерживает организацию и оборону армии. Железная дорога, банк печей, топливные склады и заводские программы обеспечивают материальную подготовку.\n\n§YСоседи и финал§!\nПраво на воду, выход к морю и Железный марш ведут к подчинению региона. \"$SHL_south_last_pour$\" готовит выступление в войне за Юг. После победы \"$SHL_d_general_governorate$\" позволяет включать подходящие зависимые земли под государственное управление. Выберите южную железную дорогу или гарнизоны, затем \"$SHL_d_iron_crown$\"; дальнейшие фокусы закрепляют дирекцию и научное наследие Нура. Общие условия войны - на последней странице."
 SHL_startup_path_3_title:0 "Регентство Сафира"
 SHL_startup_path_3:0 "§YСОВЕТ ГЕРБОВ§!\n\nЭтот курс открывается через кризис домов. Когда гербы держат Конклав и предъявляют ультиматум, вы можете передать печать Дарию Сафиру.\n\nРегентство возвращает аристократические привилегии и строит власть на залогах, частных армиях и долговых обязательствах. Выберите, как восстановить устройство домов и кому доверить вооружённую силу.\n\nЮжная политика превращает долги и династические связи в подчинение. После победы земли распределяются как лены; развитие ведёт к Империи долгов или Империи гербов и Венцу гербов.\n\nПод спойлерами - условия ультиматума и передачи власти, включая ограничения перехода из других курсов."
 SHL_startup_path_3_details:0 "§YРЕГЕНТСТВО: КАК ПРИВЕСТИ САФИРА§!\n\n§YПодготовьте два условия§!\nНужны активный ультиматум домов и диапазон \"$SHL_balance_crests_dominance$\" на шкале Конклава. Простого перевеса гербов недостаточно. Ультиматум запускается при давлении домов не ниже 60 на проверке производственного цикла, когда закончилась передышка после предыдущего кризиса.\n\nНовый ультиматум возможен до ратификации, на городском курсе или при дирекции. Уже ратифицированный курс домов сам новый ультиматум не запускает. Дома усиливают давление из-за незавершённой десятой печи, городских реформ и изъятия своих печей. Одновременно сдерживайте сдвиг баланса к кварталам; \"$SHL_heralds_table$\" и приёмы гербов помогают шкале, но приёмы снижают давление.\n\n§YМомент выбора§!\nВ событии \"$ADISCORD_SHL.30.t$\" выберите \"$SHL_back_crests$\". При выполненных условиях ждать провала миссии не требуется. Альтернативная точка входа - \"$ADISCORD_SHL.31.t$\" с ответом \"$ADISCORD_SHL.31.a$\". Одно ожидание не гарантирует регентство: нужный диапазон и активный кризис всё равно обязательны. Сафир сменяет прежнюю власть, и в дереве Шахрабада открывается раздел регентства. Из коммуны перейти так нельзя; вернуться к открытым курсам после этого тоже нельзя.\n\n§YРазвилки и итог§!\nВыберите возврат привилегий или новый реестр гербов, частные армии или регентскую гвардию. \"$SHL_regency_prog_ending_a$\" усиливает военную опору; \"$SHL_regency_prog_ending_b$\" - торговлю и политическое управление. Залоги и концессии дают средства, но требуют следить за долгом.\n\n\"$SHL_south_war_of_arms$\" готовит южную кампанию. После победы \"$SHL_r_fiefs_of_the_south$\" связывает интеграцию владений с выручкой и новым долгом. Империя долгов или Империя гербов ведёт к \"$SHL_r_crown_of_crests$\" и \"$SHL_r_regent_forever$\"."
 SHL_startup_path_4_title:0 "Коммуна огня"
 SHL_startup_path_4:0 "§YВЛАСТЬ СОВЕТОВ СМЕН§!\n\nКоммуна рождается из стачки при господстве кварталов. Передайте власть советам смен: Нур уйдёт, а печи станут основой рабочего самоуправления.\n\nКурс предлагает выбор между делегатами и постоянным советом, рабочим владением печами и очередностью плавок. Общая казна, снабжение и кооперация мастерских поддерживают производство и вооружённые смены.\n\nНа Юге коммуна ищет союзников среди советов и нефтяников. Победа позволяет объединить советы и выбрать нефтяное или печное развитие, завершив путь Огнём Юга.\n\nВ спойлерах описаны условия стачки, нужный перевес кварталов и точный ответ для перехода."
 SHL_startup_path_4_details:0 "§YКОММУНА: ОТ СТАЧКИ К СОЮЗУ СОВЕТОВ§!\n\n§YПодготовьте два условия§!\nНужны действующая холодная смена и диапазон \"$SHL_balance_quarters_dominance$\" на шкале Конклава. Простого перевеса кварталов недостаточно. Стачка запускается при недовольстве не ниже 60 на проверке производственного цикла, если закончилась передышка после предыдущей стачки.\n\nУсиленные смены, незарегистрированные кварталы и простои повышают недовольство. Городская опора, арбитраж и работающие печи с хартиями его уменьшают. Для политического перевеса используйте \"$SHL_quarter_listening$\" и передачу печей кварталам. Недовольство само по себе власть на шкале не заменяет.\n\n§YМомент выбора§!\nВ событии \"$ADISCORD_SHL.20.t$\" выберите \"$SHL_back_shift_councils$\". Переход доступен уже в первую стачку: проваливать переговоры не нужно. Другой вход - событие \"$ADISCORD_SHL.21.t$\" и ответ \"$ADISCORD_SHL.21.a$\" при тех же условиях. Выплата требований или подавление может закрыть стачку; силовой ответ также двигает баланс к гербам.\n\nКурс доступен до ратификации и из любого из трёх открытых курсов, но не из регентства. Нур уходит, советы смен выбирают Салима Дарзи представителем Коммуны огня и главой кабинета. В дереве Шахрабада открывается раздел коммуны. Обратного выбора открытого курса или регентства нет.\n\n§YРазвилки и финал§!\nВыберите делегатов или постоянный совет, передачу печей рабочим или плавку по очереди. \"$SHL_commune_prog_ending_a$\" поддерживает мобилизацию и стабильность, \"$SHL_commune_prog_ending_b$\" - эффективность производства.\n\nСоветы за рубежом и подполье Светлогорья ведут к \"$SHL_south_oil_uprising$\". После победы \"$SHL_k_union_of_councils$\" объединяет подходящие зависимые владения. Нефтяная или печная коммуна ведёт к \"$SHL_k_no_more_crests$\" и \"$SHL_k_fire_of_the_south$\". Война проходит через общий порядок подготовки, описанный на последней странице."
 SHL_startup_path_5_title:0 "Кризисы и война за Юг"
 SHL_startup_path_5:0 "§YОТ КОНКЛАВА К БОРЬБЕ ЗА ЮГ§!\n\nКонклав считает голоса в конце сессии. Поставки, баланс сил и городская поддержка определяют победителя. Кризис может привести к регентству или коммуне.\n\nНовый раздел не отменяет хозяйство печей: нужны сырьё, ремонт и средства на программы. У каждого курса свои способы собрать соседей, подготовить армию и распорядиться победой.\n\nВойна за Юг начинается после завершения ресурсного вопроса и подготовки сторон, но не позже §Y[ADISCORDSouthDeadlineDate]§!. Самого выбора политического курса для неё недостаточно. На время войны страна получает отдельное военное дерево \"Поход печей\" с веткой своего курса, а после войны возвращается к дереву Шахрабада.\n\nПод спойлерами - общие ограничения смены власти, подготовительные фокусы и порядок объявления войны."
 SHL_startup_path_5_details:0 "§YОБЩИЕ ПРАВИЛА ПУТЕЙ§!\n\n§YВыбор и ратификация§!\nПроизводственные и политические программы меняют расклад голосов. Конклав считает их по истечении 280 дней. Победивший курс открывает свою ветвь дерева.\n\n§YКризисная смена власти§!\nРегентство и коммуна требуют не просто большого давления или недовольства, а активного кризиса и власти соответствующей стороны Конклава. После закрытия кризиса новая проверка ждёт четыре производственных цикла. Скрытый курс может сменить открытый, но регентство и коммуна не переходят друг в друга. Несовместимые оплаченные операции закрываются по правилам возврата их неиспользованного платежа.\n\n§YРазвитие и соседи§!\nПроизводственный цикл длится 28 дней: поддерживайте сырьё и ремонт, следите за обязательствами печей. Фокусы открывают оплачиваемые программы, их ещё нужно запускать решениями. После ратификации требования домов или кварталов продолжаются. Кампании консолидации соседей имеют собственные миссии и сроки; принятие договора, союз, подчинение и военная победа - разные результаты. Проверяйте текущую цель кампании в \"$SHL_quarters_and_borders$\".\n\n§YКогда придёт большая война§!\nДля готовности Шахрабада нужны \"$SHL_conclave_rules$\", \"$SHL_metal_market$\" и \"$SHL_conclave_army$\". Северная сторона тоже должна подготовиться, а ресурсный вопрос и связанные сюжетные войны - завершиться. Раньше срока война начинается после §Y180§! дней подготовки, готовности обеих сторон и 56-дневного предупреждения. Не позже §Y[ADISCORDSouthDeadlineDate]§! она начинается и без готовности, а неготовая сторона получает штраф; победы Шахрабада переносят эту дату раньше. Военный фокус курса готовит приказ и его особую поддержку, но не обходит это предупреждение. Пропуск фокуса не отменяет автоматическую войну, когда общие условия выполнены.\n\n§YДерево войны§!\nС объявлением войны Шахрабад переходит на отдельное дерево \"Поход печей\": общие ветки армии, печей, песков и тыла и военная ветка текущего курса. Завершённые фокусы прежнего дерева сохраняются, и после окончания войны страна возвращается к дереву Шахрабада.\n\n§YПосле победы§!\nОбщий \"$SHL_south_crown_of_the_south$\" открывает эпилог победившего курса. Его интеграция действует только на подходящие зависимые страны и учитывает согласие, цену или последствия выбранной политики."
