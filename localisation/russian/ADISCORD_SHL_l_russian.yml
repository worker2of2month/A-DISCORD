 SHL_copi_prospected_tt:0 "Доставлено меньше §Y2§! разведочных экспедиций"
 SHL_cost_engineers:0 "[SHLGetEngineersPrice] £ADISCORD_economy_treasury_texticon / [SHLGetPP25] £political_power_texticon"
 SHL_cost_engineers_blocked:0 "[SHLGetEngineersPrice] £ADISCORD_economy_treasury_texticon / [SHLGetPP25] £political_power_texticon"
 SHL_cost_engineers_tooltip:0 "[SHLGetEngineersPrice] £ADISCORD_economy_treasury_texticon / [SHLGetPP25] £political_power_texticon\nЦена списывается при выборе и возвращается при отмене."
 SHL_price_engineers:0 "§Y[?SHL_engineers_price|0]§!"
 SHL_price_engineers_red:0 "§R[?SHL_engineers_price|0]§!"
 SHL_nam_fuel_treaty_tt:0 "Пока нет эмбарго и войны со Светлогорьем, пакет топлива для Шахрабада дешевле на §G10§! £ADISCORD_economy_treasury_texticon"
 SHL_planned_supply_description_rules_tt:0 "В начале плавки подвоз докупает недостающее сырьё для каждой работающей печи. Если денег на её смену не хватает, заказ пропускают. Местная очередь работ остаётся свободной."
 SHL_supply_furnace_description_rules_tt:0 "Доставка одного пакета сырья занимает 7 дней. До завершения нельзя оплатить другую работу по той же печи. При утрате контроля депозит возвращается."
 SHL_repair_furnace_description_rules_tt:0 "За 14 дней ремонтная служба снизит износ на 30. Вспомогательные участки обслуживаются по очереди; главная печь продолжает производство."
 SHL_training_furnace_description_rules_tt:0 "За 35 дней смена освоит программу школы мастеров. Прирост износа за обеспеченный производственный период постоянно снизится на 1. Повторное обучение той же смены не оплачивается."
 SHL_restart_furnace_description_rules_tt:0 "Сначала определите собственника и подготовьте сырьё. Через 21 день печь возобновит работу с износом 20. Передача владения сама по себе не оплачивает запуск."
 SHL_buy_reserve_description_rules_tt:0 "В общий резерв поступит §G2§! £SHL_packet_texticon. Из него можно сразу снабдить выбранную печь или выделить сырьё для первой плавки."
 SHL_allow_extinction_description_rules_tt:0 "Главная печь прекратит производство. Дом потеряет наследственный голос, а предприятие перейдёт городу. Здания остаются на месте; повторный запуск требует отдельного решения и оплаты."
 SHL_mobilisation_quota_description_rules_tt:0 "Дирекция закрепляет плавку выбранной печи за арсеналом. Владелец печи сохраняет её, но два цикла не распоряжается металлом."
 SHL_state_concession_description_rules_tt:0 "Казённая печь сдаётся прежнему дому в аренду. Дирекция получает деньги сразу, дом - право голоса и обязанность держать огонь."
 SHL_debt_tribunal_description_rules_tt:0 "Суд гербов не ждёт срока залога. Решение о взыскании выносится за один день, и печь переходит городу раньше, чем дом успевает собрать деньги."
 SHL_register_quarters_description_rules_tt:0 "Свести домовые, фабричные и городские списки без отмены уже выданных документов. Дух \"Кварталы вне реестра\" исчезнет; платёж доступен до принятия рабочей хартии."
 SHL_back_shift_councils_description_rules_tt:0 "Признать советы политической властью и открыть курс рабочей коммуны. Нур уйдёт в отставку. Этот выбор доступен с первой стачки и не требует проваливать переговоры."
 SHL_back_crests_description_rules_tt:0 "Передать власть Дарию Сафиру и открыть регентство домов. Нур уйдёт в отставку. Этот выбор доступен с первого ультиматума и не требует ждать его провала."
 SHL_strike_mission_description_rules_tt:0 "Стачечный комитет держит печи на минимальном огне. Пока стачка продолжается, каждая работающая печь приносит на §R10§! £ADISCORD_economy_treasury_texticon меньше."
 SHL_raise_furnace_guard_description_rules_tt:0 "Печи оплачивают винтовки, города дают людей. Через 21 день в Шахрабаде будет сформирована дивизия заводской стражи: 2 пехотных батальона и ополчение."
 SHL_war_orders_description_rules_tt:0 "Выбранная печь перестаёт приносить обычную выручку и производит оружие. Оплачены две партии: каждая реальная плавка поставляет половину заказа. Усиленная смена выпускает обе сразу. Недостаток сырья, оккупация и остановка печи задерживают поставки. При отмене возвращается только цена ещё не изготовленных партий."
 SHL_negotiate_kyz_neutrality_description_rules_tt:0 "[SHLGetKeizanFlankStatus]\n\nПредложим компенсацию за прежний пограничный конфликт в обмен на отказ поддержать Кейзан. Переговоры доступны до начала войны. Сосед вправе отказать; отказ и утрата актуальности предложения не расходуют средства."
 SHL_keizan_deadline_description_rules_tt:0 "Собрание арычных общин дало Шахрабаду 60 дней. Затем его отряды войдут в Зарханский округ со стороны Табара."
 SHL_keizan_last_ration_description_rules_tt:0 "Поздний платёж дороже, но закрывает требование Кейзана навсегда."
 SHL_export_contract_description_rules_tt:0 "Выбранный дом получает аванс за металл двух плавок. На исполнение отводятся три ближайших производственных цикла; усиленная смена выполняет две плавки за один цикл. Сырьё и обслуживание оплачиваются обычно. Выручка этой печи до исполнения уходит в заказ. Оккупация и простой не останавливают срок. При срыве можно один раз продлить договор или вернуть аванс со штрафом."
 SHL_debt_shift_description_rules_tt:0 "Городская касса выдаёт регентству деньги под будущую выручку выбранного дома. В погашение уходит только фактический доход этой печи после удержаний. Простой задерживает платёж; усиленная смена перечисляет свою настоящую выручку, а не условную двойную выплату. За досрочное закрытие взыскивается остаток обязательства. Закон о долговых сменах позволит передать саму печь городской кассе в счёт долга."
 SHL_common_cauldron_description_rules_tt:0 "Работающая городская печь берёт шефство над другим предприятием. Затем выберите на панели нуждающуюся печь и назначьте её получателем. Пока получатель недоступен, донор сохраняет обычную выручку. Когда помощь возможна, две его плавки уйдут на восстановление получателя. Это цена солидарности: металл нельзя одновременно продать."
 SHL_civic_order_description_rules_tt:0 "Мосты, водоводы и ремонтные мастерские требуют металла местной печи. Две успешные плавки дадут району один уровень инфраструктуры. До завершения печь не перечисляет обычную выручку в казну. Если район уже достиг максимума, платёж вернётся. Оккупация приостанавливает работу; смена собственника или власти рассчитывает незавершённый заказ."
 SHL_relief_recipient_description_rules_tt:0 "Получателем может стать другая городская печь с износом не ниже 30 или с погашенным огнём. Ей нужен свободный слот оплаченных работ; погашенной печи также требуется один пакет сырья для запуска. Если начинается обычный ремонт, помощь ждёт его расчёта. Оплаченный чужой ремонт не перехватывается. Получатель закрепляется до исполнения или отмены всей ведомости."
 SHL_close_obligation_description_rules_tt:0 "Завершённые поставки оружия остаются на складе; незавершённая городская стройка возвращает депозит. Экспорт и залог требуют погашения остатка, указанного в ведомости. Если казны не хватает, разница становится обычным государственным долгом. Отданные плавки и сырьё не возвращаются."
 SHL_foreclose_furnace_description_rules_tt:0 "Городская касса принимает работающую печь вместо оставшегося долга. Дом теряет владение и наследственный голос; производство продолжается. Это выход для регента, которому важнее сохранить казну, чем единство гербов."
 SHL_renew_golden_offer_description_rules_tt:0 "Партнёрство с Вейром позволяет вновь предложить общий союз. Решение остаётся за его правительством; новый отказ не закрывает будущие переговоры."
 SHL_renew_southern_offer_description_rules_tt:0 "Предложить Кейзану войти в Южный договор. Отказ оставляет страну независимой, а через 60 дней переговоры можно возобновить."
 SHL_renew_veyr_partnership_description_rules_tt:0 "Предложить торговое партнёрство повторно. Согласие Вейра после учреждения Конклава десяти также откроет предложение союза. Уже построенная гавань и результаты войны сохраняются."
 SHL_forge_campaign_convoy_description_rules_tt:0 "Выбранная печь отдаст две плавки походному заказу. До завершения её обычная выручка недоступна. Смена власти сохраняет заказ; потеря печи или окончание войны возвращает неиспользованную оплату."
 SHL_demobilise_campaign_convoy_description_rules_tt:0 "Готовый, но ещё не отправленный обоз можно вернуть на склады в виде оружия. После отправки на фронт это невозможно."
 SHL_march_on_keizan_description_rules_tt:0 "За 28 дней подготовить объявление войны Кейзану за два района цистерн. Если угроза исчезнет или Шахрабад вступит в другую войну, подготовка отменяется с возвратом 50 £political_power_texticon."
 SHL_house_campaign_aid_description_rules_tt:0 "Один пакет помощи на текущую кампанию. Дома дадут казне деньги немедленно, но государственный долг вырастет на большую сумму."
 SHL_city_campaign_aid_description_rules_tt:0 "Один пакет помощи на кампанию. Города передадут две полностью вооружённые дружины; казна оплачивает оружие, рекруты поступают из общего резерва, а собрания теряют часть поддержки."
 SHL_directorate_campaign_aid_description_rules_tt:0 "Один пакет помощи на кампанию. Готовый обоз и дополнительное сырьё обеспечат усиление на первые 45 дней войны. Недовольство смен возрастёт."
 SHL_regent_campaign_aid_description_rules_tt:0 "Один пакет помощи на кампанию. Две дружины вооружаются в счёт действующего залога. Выручка связанной печи продолжит погашать увеличенный долг."
 SHL_commune_campaign_aid_description_rules_tt:0 "Один пакет помощи на кампанию. Дружина получает только оплаченные со складов оружие и людской состав. Общая служба снижает недовольство кварталов."
 SHL_offer_cistern_charter_description_rules_tt:0 "Вернуть оба занятых района Кейзану в обмен на его добровольное вступление в Южный договор. При отказе земля остаётся у Шахрабада; через 60 дней предложение можно повторить."
 SHL_reconstruct_south_description_rules_tt:0 "Один оплаченный проект на 56 дней. [SHLGetSouthProgramme]\n\nПолучатель построек - текущий владелец выбранного района. Начало войны, смена курса или потеря доступа отменяют проект и возвращают оплату. Другой заказ нельзя открыть, пока первый не завершён."
 SHL_cistern_concession_description_rules_tt:0 "Вернуть оба занятых района Кейзану и получить стоимость концессионных прав. Действующий залог погашается первым; остаток поступает в казну."
 SHL_council_election_description_rules_tt:0 "Каждые полгода города выбирают делегатов Открытого Конклава. Итог зависит от того, верят ли кварталы Конклаву."
 SHL_cons_charter_round_description_rules_tt:0 "Открытый Конклав ждёт ответов на приглашения. Через пять месяцев отказавшим пришлют второе письмо."
 SHL_cons_ultimatum_description_rules_tt: "После истечения срока неподчинившиеся Кейзан и Вейр получат требование войти в прямые владения Шахрабада; отказ приведёт к войне."
 SHL_cons_toll_term_description_rules_tt:0 "Регентство ждёт, пока должники по пошлинам признают сюзерена. Пять месяцев - и требование станет жёстче."
 SHL_cons_councils_description_rules_tt:0 "Коммуна ждёт, когда советы Мазара или Вейра приведут свою страну в союз. Полгода - и приглашение повторят."
 SHL_house_demand_description_rules_tt:0 "Отказ получен. Теперь у Конклава полтора месяца, чтобы привести печь в порядок, иначе дом уйдёт в оппозицию."
 SHL_metal_contract_end_description_rules_tt:0 "Конклав отзывает обязательство картеля перед этим покупателем. Отгрузки прекращаются с ближайшего цикла; уже полученные платежи остаются в казне."
 SHL_furnace_bonds_description_rules_tt:0 "Деньги сейчас под залог будущих плавок. Выплаты будут стоить Конклаву политического веса."
 SHL_metal_dumping_description_rules_tt:0 "Два пакета сырья из резерва продаются на рынке."
 SHL_crisis_fund_description_rules_tt:0 "Отложенные деньги закроют следующее происшествие без потерь."
 SHL_crisis_prevention_description_rules_tt:0 "Проверки цехов и караванов на полгода вперёд."
 SHL_ultimatum_veyr_description_rules_tt:0 "Если палата не отменит сбор, Шахрабад заберёт рудники Кассена и дорогу через Норан."
 # War for the South tree
 SHL_sw_war_conclave:0 "Военный совет печей"
 SHL_sw_war_conclave_desc:0 "В Хазаре собирается военный совет: те, кто держит печи, те, кто держит казну, и те, кто поведёт колонны. На столе лежит карта пустыни с нефтяным поясом на севере, и спор идёт уже не о том, воевать ли, а о том, сколько огня отдать фронту.\n\nК рассвету решение записано в ведомость. Север не продаст печам ни бочки нефти, пока стоит, и у Юга будет только один сюзерен."
 SHL_sw_desert_columns:0 "Колонны пустыни"
 SHL_sw_desert_columns_desc:0 "Пустыня не прощает пехоты, бредущей пешком от колодца к колодцу. Мастерские Хазара снимают кузова с рудовозов и ставят на шасси пулемёты, бочки с водой и запасные колёса. Командиры стражи учат экипажи ходить ночью, днём прятаться в тени барханов и не терять друг друга в пыльной буре.\n\nПервые колонны уходят к Зарханскому округу под рёв моторов, которые ещё вчера возили руду Байрата."
 SHL_sw_quarter_levies:0 "Ополчение кварталов"
 SHL_sw_quarter_levies_desc:0 "Война приходит в кварталы повестками. Глашатаи читают списки на площадях у печей, и смены строятся в колонны прямо в рабочих робах. Винтовки выдают у ворот цехов, командиров назначают из старших мастеров, а учения идут в перерывах между плавками.\n\nВ кварталах говорят, что если печь требует их крови, ей придётся выслушать и их голос. Пока эти слова записывают только в рабочие журналы."
 SHL_sw_guard_columns:0 "Колонны стражи"
 SHL_sw_guard_columns_desc:0 "Мастера не уйдут от печей: войну поведут те, кого для неё нанимали. Бригады пустынной стражи получают контракты на всю кампанию, собственные грузовики и офицеров, которые знают каждый колодец между Зарханом и нефтяным поясом. В цехах их провожают спокойно: от печей не забрали ни одного рабочего.\n\nНа плацу у Золотых ворот наёмники клянутся не гербу и не совету, а подписи под контрактом."
 SHL_sw_column_staff:0 "Штаб колонн"
 SHL_sw_column_staff_desc:0 "Кто бы ни шёл в колоннах, ополченцы кварталов или наёмная стража, без общего штаба они растеряются в песках. В старой конторе ведомостей у вокзала Хазара счетоводы печей ведут учёт воды и патронов так же, как прежде вели учёт руды, а связисты получают по радиостанции на каждую колонну.\n\nНа стене штаба висит карта, где у каждого колодца стоит дата последней проверки."
 SHL_sw_field_hospitals:0 "Полевые госпитали"
 SHL_sw_field_hospitals_desc:0 "Песок убивает раненых быстрее пуль: жара, жажда и долгая дорога до Хазара. Врачи из больниц при печах, привыкшие к ожогам и обвалам, собирают передвижные госпитали в кузовах грузовиков. Сёстры из кварталов учатся накладывать шины в тени брезента.\n\nТеперь из Зархана приходят не только похоронные списки, но и люди, которых врачи успели спасти."
 SHL_sw_desert_raids:0 "Рейды по пескам"
 SHL_sw_desert_raids_desc:0 "Нефтяной пояс укреплён, но пустыня вокруг него открыта. Штаб решает не биться лбом о северные позиции: лёгкие колонны уходят в пески на недели, живут с собственных цистерн, режут дороги и появляются там, где их не ждут.\n\nКомандиры рейдов получают одну инструкцию: не задерживаться у цели дольше, чем горит подожжённый склад."
 SHL_sw_siege_of_the_belt:0 "Осада пояса"
 SHL_sw_siege_of_the_belt_desc:0 "Нефтяной пояс возьмут не пески, а пушки. Штаб выбирает медленную войну: колонны закрепляются перед северными районами, сапёры готовят позиции, а печи льют стволы для тяжёлых батарей. Каждый день осады должен обходиться Северу дороже, чем Шахрабаду.\n\nНа совещаниях больше не говорят о налётах. Говорят о дальности, о сменах расчётов и о том, сколько снарядов даёт одна плавка."
 SHL_sw_heavy_batteries:0 "Тяжёлые батареи"
 SHL_sw_heavy_batteries_desc:0 "Обычные стволы не пробивают бетон северных нефтехранилищ. Инженеры Девятипечья берутся за орудия, каких Шахрабад ещё не отливал: толстостенные гаубицы на тягачах для рудных платформ. Первую отливку проверяют три смены подряд, прежде чем мастер ставит своё клеймо.\n\nНа пробных стрельбах за Хазаром старые рабочие узнают в грохоте звук обрушенной кладки."
 SHL_sw_sapper_companies:0 "Сапёрные роты"
 SHL_sw_sapper_companies_desc:0 "Осада держится на лопате не меньше, чем на пушке. Горняки Байрата, привыкшие к штольням и взрывчатке, записываются в сапёрные роты. Они роют ходы к северным позициям, наводят мосты через сухие русла и снимают мины на подходах к нефтяному поясу.\n\nОфицеры сначала смеются над горняками в касках вместо фуражек, но быстро перестают."
 SHL_sw_veterans_of_the_sands:0 "Ветераны песков"
 SHL_sw_veterans_of_the_sands_desc:0 "Кто пережил штурм нефтяного пояса, уже не новобранец. Ветеранов не отправляют по домам: их ставят старшими в каждое отделение, и молодые учатся у них беречь воду, слушать ветер и окапываться за минуты.\n\nВ кварталах их узнают по выгоревшим на солнце нашивкам. Дети спорят, чей отец первым дошёл до промыслов."
 SHL_sw_desert_air_wing:0 "Пустынное крыло"
 SHL_sw_desert_air_wing_desc:0 "Над песками колонны видны издалека, и северные самолёты уже нашли к ним дорогу. За Хазаром ровняют взлётные полосы из утрамбованного шлака, а на крышах цехов встают зенитные расчёты. Лётчиков немного, и многие из них прежде водили почтовые машины между городами пустыни.\n\nПервый воздушный бой над Зарханом печи слушают по радио, остановив смену."
 SHL_sw_all_furnaces_to_arms:0 "Все печи - оружию"
 SHL_sw_all_furnaces_to_arms_desc:0 "Казна может подождать, фронт ждать не может. Цеха Хазара и Девятипечья переводят на оружейный металл, экспортные заказы откладывают, а на воротах складов вешают новые замки. Торговцы у Золотых ворот впервые видят пустые причалы и не находят, кому пожаловаться.\n\nВ кварталах становится меньше посуды, ткани и мыла. Зато на фронт каждый день уходит состав, гружёный тем, что вчера было бы товаром."
 SHL_sw_keep_the_markets:0 "Сохранить рынки"
 SHL_sw_keep_the_markets_desc:0 "Шахрабад воюет на металл, проданный вчера, и на тот, что будет продан завтра. В Хазаре решают не душить торговлю ради одной кампании: экспортные цеха работают по старым договорам, караваны уходят к соседям, а выручка идёт на жалованье колоннам.\n\nГенералы недовольны. Им отвечают, что армия без казны проживёт ровно до первой невыплаченной недели."
 SHL_sw_shell_lines:0 "Снарядные линии"
 SHL_sw_shell_lines_desc:0 "Печи, отданные оружию, нужно научить работать иначе. Мастера перестраивают литейные залы под поток: одна смена льёт гильзы, другая сверлит стволы, третья набивает ящики патронами. Старые мастера ворчат, что металл больше не помнит своего литейщика.\n\nЗато колонны у Зархана больше не считают патроны поштучно."
 SHL_sw_rail_to_the_front:0 "Колея на фронт"
 SHL_sw_rail_to_the_front_desc:0 "Между Хазаром и Зарханским округом лежит единственная рудная ветка, и её не хватает. Путейцы кварталов кладут вторую колею вдоль старой насыпи, ставят водокачки на разъездах и собирают паровозы из запасных частей рудовозов. Работа идёт и ночью, при свете факелов на печном газе.\n\nПервый воинский состав доходит до Зархана без единой остановки, и машинист долго не отпускает свисток."
 SHL_sw_market_convoys:0 "Торговые конвои"
 SHL_sw_market_convoys_desc:0 "Война закрыла сухопутные дороги на север, но не дорогу к морю. Караваны металла идут к портам и дальше на кораблях, которые Шахрабад фрахтует под своими флагами. Каждый рейс сопровождают вооружённые катера, а капитаны получают маршруты в запечатанных конвертах.\n\nВыручка возвращается в Хазар раньше, чем на север доходят слухи о новом рейсе."
 SHL_sw_fuel_from_ash:0 "Топливо из золы"
 SHL_sw_fuel_from_ash_desc:0 "У Шахрабада нет своей нефти, зато есть горы печной золы, смолы и угольной пыли, которые десятилетиями вывозили за город. Инженеры Девятипечья строят перегонные колонны, где из этого мусора получают тяжёлое, вонючее, но горящее топливо.\n\nГрузовики колонн теперь пахнут смолой. Водители шутят, что ездят на дыму собственных печей, и больше не ждут северных цистерн."
 SHL_sw_furnace_artels:0 "Артели печников"
 SHL_sw_furnace_artels_desc:0 "Война изнашивает кладку быстрее любой усиленной смены. Старые печники, давно ушедшие на покой, собираются в артели и обходят цеха с мастерками и ведомостями износа. Они чинят своды, перекладывают летки и учат молодых слышать трещину раньше, чем она пойдёт по стене.\n\nЗа работу артели просят немного: место у огня и право ставить своё клеймо на отремонтированной печи."
 SHL_sw_desert_workshops:0 "Пустынные мастерские"
 SHL_sw_desert_workshops_desc:0 "Торговые караваны возвращаются не только с выручкой, но и со станками, купленными у соседей. На караванных станциях за Хазаром вырастают мастерские, где чинят грузовики колонн, меняют рессоры, разбитые на песчаных гребнях, и собирают новые машины из привезённых частей.\n\nМеханики работают под навесами из выгоревшего брезента, и ни одна колонна не уходит на север, не пройдя через их руки."
 SHL_sw_arsenal_of_the_south:0 "Арсенал Юга"
 SHL_sw_arsenal_of_the_south_desc:0 "Всё, чему печи научились за войну, сходится в одном месте. В Хазаре и Байрате закладывают новые оружейные цеха, и впервые металл Шахрабада льют не для дома, не для города и не для казны, а для всей войны сразу.\n\nНад воротами нового арсенала выбивают не герб и не печать, а карту Юга от нефтяного пояса до Золотых ворот."
 SHL_sw_sands_choose:0 "Пески выбирают"
 SHL_sw_sands_choose_desc:0 "У Шахрабада и Севера нет общей границы, и фронт проходит через чужие колодцы и караванные станции. Государства пустыни, ещё сохранившие свои знамёна, уже выбрали стороны. В Хазаре пишут письма каждому, кто встал рядом: гонцы везут их по тракту Кадира, к колодцам Рахмы и к дозорам сухого русла.\n\nТем, кто выбрал Север, писем не пишут. Их имена заносят в другую ведомость."
 SHL_sw_buy_the_sands:0 "Купить пески"
 SHL_sw_buy_the_sands_desc:0 "В пустыне верность продаётся, и Хазар готов платить. Казначеи везут союзным вождям серебро Золотых ворот, оплачивают ремонт колодцев вдоль тракта и выкупают долги караванщиков. Друга, которого кормишь, не нужно охранять.\n\nСтарые казначеи морщатся над ведомостями, но вслух не спорят: купленный союзник обходится дешевле погибшего сына."
 SHL_sw_break_the_sands:0 "Сломить пески"
 SHL_sw_break_the_sands_desc:0 "Пустыня уважает только силу, и Хазар больше не намерен покупать то, что можно взять. В занятых оазисах и на станциях вводят военные порядки: оружие сдаётся, караваны ходят по пропускам, а за выстрел в спину колонне отвечает вся деревня.\n\nВ Хазаре говорят, что страх надёжнее серебра. В оазисах молчат и запоминают."
 SHL_sw_desert_subsidies:0 "Пустынные субсидии"
 SHL_sw_desert_subsidies_desc:0 "Союзники держат фронт там, где у Шахрабада нет ни одной колонны, и Хазар больше не спрашивает, сколько стоит их верность. Интенданты союзных вождей приезжают прямо на склады у печей, а казначеи подписывают их счета не торгуясь.\n\nПо тракту тянутся обозы под чужими знамёнами, и только клеймо на ящиках выдаёт, чьи печи их снарядили."
 SHL_sw_caravan_pacts:0 "Караванные договоры"
 SHL_sw_caravan_pacts_desc:0 "Тракт Кадира кормил пустыню задолго до войны и прокормит её после. Хазар подписывает с караванщиками договоры: их верблюды и грузовики везут на север военные грузы, а обратно - товар, которого ждут рынки Шахрабада. Пошлины на станциях делят пополам.\n\nКараванщики довольны: впервые война приносит им больше, чем мир."
 SHL_sw_punitive_columns:0 "Карательные колонны"
 SHL_sw_punitive_columns_desc:0 "Тем, кто стреляет в спину колоннам, отвечают колоннами. По пустыне идут отряды без обозов: они окружают оазисы, где прятались налётчики, сжигают склады и уводят старейшин в Хазар. Командиров выбирают из тех, кто уже терял людей в засадах.\n\nДороги становятся тише. Никто не говорит, чего это стоит самим оазисам."
 SHL_sw_occupation_ultimatums:0 "Ультиматумы занятым районам"
 SHL_sw_occupation_ultimatums_desc:0 "Каждому занятому району Хазар вручает одну и ту же бумагу: признать власть Шахрабада, выдать оружие и людей Севера, открыть колодцы для колонн. Ответ ждут до заката. Глашатаи читают ультиматум на рыночных площадях, и рядом с ними всегда стоит взвод.\n\nБольшинство подписывает. Тех, кто не подписал, в следующий раз уже не спрашивают."
 SHL_sw_desert_envoys:0 "Послы пустыни"
 SHL_sw_desert_envoys_desc:0 "Деньгами или силой, но пустыня усвоила, на чьей стороне стоять. Теперь Хазар отправляет к соседям не казначеев и не карателей, а послов: старых караванщиков, писцов и судей, которые знают обычаи каждого колодца. Они улаживают споры о воде, разбирают обиды и говорят о войне, которая когда-нибудь закончится.\n\nВ шатрах вождей их принимают настороженно, но уже не как чужих."
 SHL_sw_war_correspondents:0 "Военные корреспонденты"
 SHL_sw_war_correspondents_desc:0 "Война, о которой не пишут, кажется кварталам чужой. Газеты Хазара отправляют корреспондентов в колонны, и с фронта приходят не сводки, а имена: кто из какого квартала, у какой печи работал, где ранен и кого спас. Фотографии из Зархана висят у ворот цехов рядом с расписанием смен.\n\nДаже в соседних оазисах читают эти листки и пересказывают их у колодцев."
 SHL_sw_southern_league:0 "Южная лига"
 SHL_sw_southern_league_desc:0 "Союз, скреплённый серебром или страхом, держится до первого поражения. В Хазаре собираются вожди и посланники всех, кто воюет на стороне Шахрабада, и подписывают общую грамоту: Юг воюет вместе, делит воду вместе и не заключает с Севером отдельного мира.\n\nГрамоту выбивают на медной доске и вешают в зале совета. Под ней оставлено место для каждого нового имени."
 SHL_sw_quarters_at_war:0 "Кварталы на войне"
 SHL_sw_quarters_at_war_desc:0 "Фронт далеко, но война уже пришла в кварталы: в очередях у пекарен, в пустых койках общежитий, в письмах, которые читают вслух всем подъездом. Старосты кварталов впервые садятся за один стол с городскими счетоводами, чтобы решить, как прожить эту войну и не дать печам погаснуть.\n\nНа стенах появляются списки ушедших на фронт. Их читают по утрам, по пути на смену."
 SHL_sw_ration_cards:0 "Карточная система"
 SHL_sw_ration_cards_desc:0 "Хлеба, воды и масла на всех не хватает, и делить их будет не цена, а бумага. Каждая семья в кварталах получает карточки: рабочему у печи - больше, вдове солдата - столько же, торговцу - как всем. Пекарни открываются по расписанию, у дверей стоят счетоводы с печатями.\n\nОчереди не исчезают, но драк в них становится меньше. Кварталы ворчат на скудный паёк и признают, что он хотя бы честный."
 SHL_sw_furnace_martial_law:0 "Военное положение у печей"
 SHL_sw_furnace_martial_law_desc:0 "Война не оставляет времени на споры о сменах. У ворот цехов встают патрули, стачки объявлены изменой, а опоздание на смену разбирает дежурный офицер, а не мастер. Комендантский час гасит огни кварталов раньше, чем гаснет вечерняя плавка.\n\nВ цехах стало тихо. Слишком тихо, говорят старые мастера, и продолжают работать, не поднимая глаз."
 SHL_sw_widows_fund:0 "Вдовья касса"
 SHL_sw_widows_fund_desc:0 "Похоронные списки из Зархана приходят каждую неделю, и за каждым именем остаётся семья без кормильца. Кварталы открывают вдовью кассу: деньги идут из общей казны, а распределяют их старосты, которые знают каждую семью в лицо. Сирот берут в ученики при печах, вдов - в конторы и госпитали.\n\nНа дверь кассы никто не вешает замка. Её охраняют те, кому она помогла."
 SHL_sw_crest_war_tax:0 "Военный налог гербов"
 SHL_sw_crest_war_tax_desc:0 "Кварталы отдают войне сыновей, и в Хазаре всё громче спрашивают, что отдают ей гербы. Счетоводы печей открывают ведомости домов и назначают каждому гербу военный налог по числу горящих печей. Сафир платит молча, Лоран - с жалобой, малые дома - в долг.\n\nВ особняках за Золотыми воротами говорят о грабеже. В кварталах говорят, что давно пора."
 SHL_sw_street_tribunals:0 "Уличные трибуналы"
 SHL_sw_street_tribunals_desc:0 "Военное положение требует быстрого суда. На площадях кварталов ставят столы под навесами: офицер, писец и двое свидетелей за час разбирают кражи со складов, спекуляцию хлебом и подстрекательство к стачке. Перед тем же судом встают и приказчики гербов, прятавшие металл от фронта.\n\nСпекулянты исчезают с рынков. Вместе с ними исчезают и те, кто слишком громко спорил с офицером."
 SHL_sw_quarter_kitchens:0 "Кухни кварталов"
 SHL_sw_quarter_kitchens_desc:0 "Налог гербов приходит в кварталы горячей похлёбкой. В заброшенных складах и при общежитиях открываются общие кухни: смена ест у печи, дети - после школы, старики - в полдень. Повара - те же женщины, что вчера стояли в очередях.\n\nУ котлов собираются люди, которые раньше не знали друг друга. Здесь записываются в госпитали, на стройки и на фронт."
 SHL_sw_home_guard:0 "Стража кварталов"
 SHL_sw_home_guard_desc:0 "Колонны ушли на север, и Хазар остаётся под охраной стариков, подростков и рабочих ночных смен. На деньги гербов им выдают винтовки и нарукавные повязки, учат держать перекрёстки и тушить пожары после налётов. Каждый квартал строит свои баррикады из рудных вагонеток и шлаковых блоков.\n\nЕсли Север дойдёт до печей, ему придётся брать каждую улицу."
 SHL_sw_march_on_the_oil_belt:0 "Марш на нефтяной пояс"
 SHL_sw_march_on_the_oil_belt_desc:0 "Северные позиции трещат, и штаб больше не довольствуется налётами и осадой. Колонны собираются у Зархана в одну армию, и впервые за войну Шахрабад идёт на нефтяной пояс не ради склада или дороги, а ради самих промыслов.\n\nНа броне грузовиков мелом пишут названия северных месторождений. Водители обещают стереть их только на месте."
 SHL_sw_the_last_line:0 "Последний рубеж"
 SHL_sw_the_last_line_desc:0 "Север отступает к последнему рубежу, и в Хазаре уже чертят карту послевоенного Юга. Писцы составляют описи северных районов: промыслы, станции, колодцы, всё, за что заплачено кровью колонн. От армии штаб требует одного - не дать противнику опомниться.\n\nСолдаты, дошедшие сюда от Зархана, знают, что это последний рубеж не только для Севера."
 SHL_sw_not_one_step_back:0 "Ни шагу назад"
 SHL_sw_not_one_step_back_desc:0 "Север подошёл к печам ближе, чем кто-либо за сто лет. В Хазаре объявлен общий сбор: в строй встают смены, конторщики, ученики мастеров и стража гербов. Улицы перегораживают шлаком, на крышах цехов ставят пулемёты, а у ворот каждой печи - людей, которые у неё работали.\n\nЛистки на стенах говорят одно: за Хазаром не осталось пустыни, в которую можно отступить."
 SHL_sw_crown_campaign:0 "Корона Юга"
 SHL_sw_crown_campaign_desc:0 "Север почти сломлен, и в Хазаре никто уже не спрашивает, ради чего шла эта война. Арсенал, союзники и колонны сходятся в последнем походе: у Юга будет один сюзерен, и на нём будет печное клеймо. На площадях читают обращение ко всем государствам пустыни, а мастера отливают из трофейного металла знак будущей короны.\n\nНикто ещё не знает, кто её наденет. Но все знают, где её отлили."
 SHL_h_concession_war_bonds:0 "Военные облигации концессий"
 SHL_h_concession_war_bonds_desc:0 "Конклав десяти воюет как торговый дом. Картель Золотых ворот выпускает военные облигации под залог будущих концессий на Севере: купцы Вейра, банкиры портов и сами дома покупают бумаги с печатью десяти печей. Деньги приходят сразу, а долг подождёт победы.\n\nВ конторах шутят, что Шахрабад впервые продаёт металл, которого ещё не отлил, за нефть, которой ещё не взял."
 SHL_h_presell_northern_fields:0 "Предпродажа северных промыслов"
 SHL_h_presell_northern_fields_desc:0 "Дома давно поделили нефтяной пояс на бумаге, и теперь картель продаёт эти доли. Каждый герб получает право первой руки на свой промысел, если внесёт деньги сейчас. Старые соперники за столом Конклава вдруг становятся союзниками: никто не хочет, чтобы война кончилась без его вышки.\n\nКарта Севера в зале совета расчерчена цветами гербов задолго до того, как туда дошла первая колонна."
 SHL_c_city_militias:0 "Городские ополчения"
 SHL_c_city_militias_desc:0 "Южный договор обещал городам самоуправление, и города отвечают тем, что защищают себя сами. Хазар и районы с хартиями собирают ополчения из своих жителей: командиров выбирают на собраниях, оружие хранят в ратушах, а присягу приносят хартии, а не дому.\n\nМехран Арбин объезжает гарнизоны и говорит каждому одно и то же: город, который держит свою стену, никому не должен своей свободы."
 SHL_c_assembly_of_free_cities:0 "Собрание свободных городов"
 SHL_c_assembly_of_free_cities_desc:0 "Посреди войны договор созывает то, о чём прежде говорили только в кварталах: собрание всех свободных городов Юга. Делегаты приезжают из Хазара, из оазисов, из районов, занятых колоннами, и спорят о воде, налогах и мире так же громко, как о фронте.\n\nМехран Арбин открывает первое заседание словами о том, что эта война ведётся не за печи, а за право городов решать самим."
 SHL_d_iron_march_norms:0 "Нормы железного марша"
 SHL_d_iron_march_norms_desc:0 "Дирекция печей мерит войну нормами. Рауф Дарбан вывешивает в каждом цехе новые таблицы выработки: столько-то стволов за смену, столько-то снарядов за цикл и ни одного дня простоя. Мастер, не выполнивший норму, отвечает перед инспектором, а не перед советом.\n\nКварталы работают на износ. В рабочих журналах всё чаще пишут одно слово: устали."
 SHL_d_full_requisition:0 "Полная реквизиция"
 SHL_d_full_requisition_desc:0 "Дирекции мало заказов: ей нужно всё, что есть в городе. Инспекторы с охраной обходят склады домов, лавки и мастерские кварталов, описывают металл, топливо и оружие и увозят их на фронт под расписку с печатью Нура.\n\nТорговцы прячут товар, кварталы прячут хлеб. Джалиль Нур отвечает на жалобы коротко: после победы дирекция вернёт долги, а без победы возвращать будет нечего."
 SHL_r_regent_takes_command:0 "Регент принимает командование"
 SHL_r_regent_takes_command_desc:0 "Дарий Сафир не доверяет войну наёмным генералам. Регент сам выезжает к Зархану, ставит свой шатёр рядом со штабом колонн и подписывает приказы гербом Сафира. Офицеры, служившие частным гвардиям, теперь отвечают перед одним человеком.\n\nВ лагере говорят, что регент спит три часа в сутки и знает по имени каждого командира роты. В Хазаре говорят, что он просто не доверяет никому, кроме себя."
 SHL_r_noble_retinues:0 "Дружины гербов"
 SHL_r_noble_retinues_desc:0 "Регентство вернуло домам печи и привилегии, и теперь гербы должны оплатить этот долг. Каждый дом выставляет на фронт свою дружину: сыновей семьи во главе, стражу печей под знаменем, наёмников на жалованье дома. Сафир первым ведёт своих людей к Зархану, и остальным приходится не отставать.\n\nСтарые семьи вспоминают, что когда-то право на печь давали не ведомости, а меч."
 SHL_k_rifles_for_the_uprising:0 "Винтовки для восстания"
 SHL_k_rifles_for_the_uprising_desc:0 "Подполье Ярослава Вебера вышло из тени: в Светлогорском округе нефтяники держат улицы и смотрят на юг. Советы смен решают, что это восстание - их собственная война, и в цехах Хазара собирают груз, который не прошёл бы ни одну таможню.\n\nПроводники ведут караваны ночами по сухим руслам, где не ходят северные патрули. На той стороне ящики открывают люди, которые никогда не видели Хазара, но уже называют его своим."
 SHL_k_front_councils:0 "Фронтовые советы"
 SHL_k_front_councils_desc:0 "В колоннах коммуны нет офицеров по праву рождения. Каждая рота избирает фронтовой совет, который решает, как делить воду, кого ставить в дозор и когда идти в атаку; командир выполняет решение и отвечает за него перед товарищами. Делегаты фронта ездят в Хазар и садятся рядом с делегатами печей.\n\nСалим Дарзи говорит, что у коммуны теперь одна смена - от печи до окопа."
 SHL_n_emergency_conclave:0 "Чрезвычайный Конклав"
 SHL_n_emergency_conclave_desc:0 "Война пришла раньше, чем Конклав успел решить, кому принадлежит Шахрабад. Спор о десятой печи откладывают: Джалиль Нур созывает чрезвычайное заседание, и главы домов впервые за много лет садятся за стол без ведомостей и без счёта голосов.\n\nРешают одно: пока идёт война, у Шахрабада один совет. Все понимают, что тот, кто заплатит за победу, поведёт страну и после неё, но об этом заговорят потом."
 SHL_n_house_war_chest:0 "Военная казна домов"
 SHL_n_house_war_chest_desc:0 "Гербы открывают свои сундуки. Сафир, Лоран и Байрат вносят в общую казну серебро, копившееся поколениями, а малые дома закладывают своё будущее под проценты. Взамен они просят немногого: чтобы за столом войны их голос звучал первым.\n\nНур принимает деньги и понимает, что вместе с ними принимает и условия. После войны дома придут за долгом."
 SHL_n_directors_war_plan:0 "Военный план директоров"
 SHL_n_directors_war_plan_desc:0 "Инженеры Девятипечья приносят Конклаву не деньги, а план: все печи по единому графику, все склады под единой печатью, каждый ствол на учёте. Рауф Дарбан ведёт военное производство так же, как когда-то вёл стройку десятой печи, и не спрашивает разрешения у гербов.\n\nДома возмущаются, но фронт получает оружие в срок. В Хазаре всё чаще говорят, что войну выигрывает не тот, кто платит, а тот, кто считает."
 SHL_sw_raise_quarter_levy:0 "Призыв кварталов"
 SHL_sw_raise_quarter_levy_desc:0 "Глашатаи снова выходят на площади у печей. Новый список зачитывают медленно, имя за именем, и смены провожают своих у ворот цехов. Матери приносят к сборному пункту хлеб и воду в кожаных флягах, мастера - пару слов напутствия.\n\nК вечеру колонна уходит на север, а в рабочем журнале появляется ещё одна страница пустых строк."
 SHL_sw_siege_battery:0 "Обстрел: [FROM.GetName]"
 SHL_sw_siege_battery_desc:0 "Тяжёлые батареи выкатываются на позиции у соседнего района. Расчёты сверяют дальность по карте колодцев, наблюдатели забираются на гребни барханов, и к рассвету первые снаряды уходят за линию фронта, туда, где противник держит свои склады и мастерские.\n\nКогда дым рассеивается, батареи уже снимаются с места, пока северные пушки не нашли их в ответ."
 SHL_sw_market_caravans:0 "Рыночные караваны"
 SHL_sw_market_caravans_desc:0 "У Золотых ворот собирается новый караван: металл, посуда и ткани из цехов, которые всё ещё работают на торговлю. Караванщики проверяют пропуска и запасы воды, охрана садится на крыши грузовиков, и колонна уходит по тракту к соседним рынкам.\n\nВ Хазаре её возвращения ждут так же нетерпеливо, как вестей с фронта."
 SHL_sw_ash_fuel:0 "Перегонка золы"
 SHL_sw_ash_fuel_desc:0 "Отвалы за Девятипечьем снова приходят в движение. Рабочие грузят золу и смолу в вагонетки, перегонные колонны гудят всю ночь, и к утру в цистернах плещется тяжёлое чёрное топливо с запахом печного дыма.\n\nВодители колонн встречают первые бочки у ворот завода и расписываются в ведомости смоляными пальцами."
 SHL_sw_quarter_relief:0 "Помощь кварталам"
 SHL_sw_quarter_relief_desc:0 "Из общей казны в кварталы идут подводы с мукой, маслом и углём. Старосты раздают их по спискам, начиная с семей, чей кормилец ушёл на фронт, и в общежитиях на время снова становится тепло и сытно.\n\nВ рабочих журналах на этой неделе меньше жалоб. Кто-то даже приписывает на полях: помнят."
 SHL_sw_martial_tribunal:0 "Военный трибунал"
 SHL_sw_martial_tribunal_desc:0 "Патрули стягивают задержанных к комендатуре у главных печей. Трибунал заседает без перерыва: зачинщики стачек, спекулянты и дезертиры проходят перед офицерским столом один за другим, и приговоры зачитывают тут же, на ступенях.\n\nКварталы затихают. Но тишина эта тяжёлая, и мастера всё реже смотрят патрулям в глаза."
 SHL_sw_arm_the_uprising:0 "Оружие восстанию"
 SHL_sw_arm_the_uprising_desc:0 "В цехах Хазара снова заколачивают ящики без клейма. Караван уходит ночью, проводники ведут его сухими руслами в обход северных застав, а на той стороне пустыни люди Вебера уже ждут у условленного колодца.\n\nКаждая такая поставка - это ещё одна улица Светлогорска, которая не вернётся под власть Севера без боя."
