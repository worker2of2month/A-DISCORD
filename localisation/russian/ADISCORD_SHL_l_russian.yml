 SHL_road_send_rifles_desc: "Оружейники оборачивают затворы промасленной бумагой. На крышке каждого ящика писарь оставляет место для печати покупателя."
 SHL_road_send_kits_desc: "У ворот мастерских укладывают в фургоны лебёдки, инструмент и запасные части. Образцы лежат у самого борта, где их сможет осмотреть покупатель."
