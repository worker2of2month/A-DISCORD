 SHL_tenth_condition_pending: "Каждый этап проекта оплачивается отдельно."
 SHL_civic_mandate_tt: "Гражданская опора: не менее 30. Рабочая хартия даёт 10; переход погасшей печи от дома к городу даёт 5."
 SHL_masters_ready_tt: "Спор о мастерах урегулирован оплатой соглашения или собственной школой."
 SHL_masters_wait_tt: "Подготовка участка ждёт соглашения с мастерами. Школа мастеров решит спор без отдельной оплаты."
 SHL_masters_pay_tt: "§Y40§! £ADISCORD_economy_treasury_texticon: соглашение с мастерами закрывает спор."
 SHL_suppliers_wait_tt: "Следующая закупка двух пакетов резерва стоит §Y70§! £ADISCORD_economy_treasury_texticon вместо §Y60§!. Железная дорога домов снимет надбавку."
 SHL_suppliers_pay_tt: "§Y15§! £political_power_texticon: согласовать прежнюю цену резерва."
 SHL_price_70: "§Y70§!"
 SHL_price_70_red: "§R70§!"
 SHL_reserve_affordable: "В казне достаточно средств для закупки резерва."
 ADISCORD_SHL.7.t: "Чьи мастера?"
 ADISCORD_SHL.7.d: "Старые дома признали инженерные расчёты, но отказались считать мастеров свободными участниками нового товарищества. Их письмо связывает переход опытных смен на столичную площадку с отдельным соглашением. Проект уже существует; никто не вправе повторно взыскать деньги за завершённые чертежи.\n\nТоварищество может оплатить соглашение или подготовить собственные кадры через школу мастеров. До решения спора участок ждёт начала работ. Если школа уже действует, открытое письмо не изменит её полномочий."
 ADISCORD_SHL.7.a: "Подготовим собственных мастеров."
 ADISCORD_SHL.7.b: "Согласовать переход специалистов."
 ADISCORD_SHL.8.t: "Особая цена резерва"
 ADISCORD_SHL.8.d: "Поставщики готовы признать общий аварийный резерв, но называют его внеочередной закупкой и требуют надбавку к ближайшему заказу. По отдельности каждый дом получал прежнюю цену. Общая ведомость впервые превращает девять привычных договоров в один публичный спор.\n\nНур может потратить политическое влияние на соглашение, принять надбавку для одной закупки или наладить перевозки через железную дорогу домов. Уже оплаченные поставки сохраняют свою цену. Действующая транспортная служба не уступит полномочия из-за задержанного письма."
 ADISCORD_SHL.8.a: "Следующий заказ выдержит надбавку."
 ADISCORD_SHL.8.b: "Согласовать прежнюю цену."
