 SHL_ratify_needs_equilibrium_tt: "Баланс Конклава в равновесии"
 SHL_quarters_and_borders_desc: "Курс: [SHLGetPoliticalCourse]\nНедовольство кварталов: §Y[?SHL_unrest|0]§! / 100. [SHLGetQuartersStatus]\nДавление гербов: §Y[?SHL_house_pressure|0]§! / 100. [SHLGetCrestsStatus]\nБаланс Конклава показывает, кто держит зал: ратификация курса домов требует перевеса гербов, курса городов - перевеса кварталов, дирекции - равновесия.\n\nКяризы: [SHLGetWaterStatus]\nВейр: [SHLGetVeyrStatus]\nМазар: [SHLGetMazarStatus]\n[SHLGetMazarFlankStatus]\n\nШкалы меняются в конце каждого 28-дневного цикла. До регистрации кварталов недовольство растёт на §R5§! за цикл. До завершения десятой печи действующие наследственные голоса добавляют §R5§! давления гербов за цикл, кроме курса коммуны. Курс, смены и раздел огня изменяют этот итог. При 60 кварталы начинают стачку, а гербы предъявляют ультиматум. Удержания из выручки печей: §Y[?SHL_income_deduction|0]§! £ADISCORD_economy_treasury_texticon с каждой работающей печи.\n\nОбоз: [SHLGetCampaignReserve]. Итог: [SHLGetCampaignOutcome].\nПосле мира: [SHLGetSouthProgress].\n\nКампания консолидации: [SHLGetConsolidationStatus]\nТребование печи: [SHLGetHouseDemandStatus]\nЭкспорт металла: [SHLGetExportMode]"
