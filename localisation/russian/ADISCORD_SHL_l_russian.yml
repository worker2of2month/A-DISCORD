 # ----- stage4_script -----
 SHL_convene_conclave: "Созвать Конклав"
 SHL_convene_conclave_desc: "Десять кресел под куполом Золотых ворот пустуют большую часть года: главы домов правят из своих контор и шлют вместо себя письма. Созыв заставляет их приехать, сесть за один стол и подписать общую ведомость поставок, пока город смотрит на двери зала. Собранный Конклав всегда щедрее переписки, но согласие держится ровно до следующей ссоры."
 SHL_quarter_charter: "Квартальная хартия"
 SHL_quarter_charter_desc: "Хартия закрепляет за кварталом при печи его собственный совет, кассу взаимопомощи и право говорить с владельцем от имени всех смен. Писцы Конклава три недели сверяют списки домов и семей, прежде чем печать ляжет на пергамент. Пока печь горит и остаётся в руках города или дома, хартия живёт вместе с ней."
 SHL_dispatch_order: "Диспетчерский наряд"
 SHL_dispatch_order_desc: "Общая диспетчерская служба впервые видит все девять складов одной таблицей. Наряд снимает лишний пакет сырья с полного двора и отправляет его туда, где бункер пуст, не спрашивая дом-владельца. Караван идёт неделю по городским улицам, и к его приходу картина запасов может уже измениться."
 SHL_arbitration_act: "Арбитражный акт"
 SHL_arbitration_act_desc: "Арбитраж смен разбирает накопившиеся жалобы: невыплаченные ночные, спорные увольнения, драку у весов. Акт, подписанный арбитром и двумя старостами кварталов, закрывает дела одним списком. Кварталы выдыхают, а дома получают три месяца тишины, прежде чем ящик с жалобами наполнится снова."
 SHL_house_audit: "Ревизия Счётной палаты"
 SHL_house_audit_desc: "Счётная палата присылает на печь своих людей с печатями и гирями. Три недели они пересчитывают сырьё, сверяют записи мастеров с показаниями весов и заставляют владельца устранить то, что он привык не замечать. Дом переживает ревизию как оскорбление, печь - как долгожданный ремонт."
 SHL_desert_embassy: "Посольство в пустыне"
 SHL_desert_embassy_desc: "Шахрабад впервые отправляет к соседу не торговца, а постоянного посланника с грамотой Конклава. Две недели пути через песок, подарки для двора, дом с флагом над воротами. Сосед, у которого есть к кому обратиться в Шахрабаде, спорит реже и соглашается легче."
 SHL_integrate_satellite_decision: "Принять в Лигу"
 SHL_integrate_satellite_decision_desc: "Корона Юга обещает соседям место внутри Лиги, а не рядом с ней. Договор о вхождении месяц обсуждают в обоих столицах: дома выкупают долю, дирекция издаёт указ, регентство платит бывшим правителям, коммуна ставит вопрос на голосование советов, а города ждут, пока сосед сам скажет да. Пока бумаги не подписаны, сосед вправе уйти."
 SHL_war_orders_all: "Военные наряды всем печам"
 SHL_war_orders_all_desc: "Железный Шахрабад отменяет на один цикл выбор получателей: экспорт, кварталы и гербы ждут, пока весь металл города идёт в арсенал. Девять диспетчеров получают одинаковую телеграмму, и девять дворов начинают один и тот же плав. Через цикл прежние заказы возвращаются сами."
 SHL_convene_conclave_tt: "§G+1§! пакет сырья каждой работающей домовой печи, давление гербов §G-5§!."
 SHL_quarter_charter_tt: "Через §Y21§! день печь получает квартальную хартию: за каждый цикл работы §G+1§! опоры городов и §G-1§! недовольства кварталов. Хартия исчезает вместе с районом или при переходе печи государству. Если печь будет потеряна раньше, цена вернётся."
 SHL_dispatch_order_tt: "Печь-донор сразу отдаёт §Y1§! пакет сырья; через §Y7§! дней он поступает работающей печи с наименьшим запасом. Если такой печи нет, пакет возвращается донору."
 SHL_arbitration_act_tt: "Недовольство кварталов §G-6§!."
 SHL_house_audit_tt: "Через §Y21§! день износ печи §G-10§!, недостачи обнулены, давление гербов §R+5§!. Если печь будет потеряна, политическое влияние вернётся."
 SHL_desert_embassy_tt: "Через §Y14§! дней у соседа открывается постоянное посольство: мнение о Шахрабаде §G+20§!, он охотнее принимает требования Юга. Если посольство не доедет, цена вернётся."
 SHL_integrate_satellite_tt: "Через §Y30§! дней сателлит входит в состав Лиги. Если он перестанет быть сателлитом раньше, цена вернётся."
 SHL_war_orders_all_tt: "Каждая работающая печь без квоты, заказа и обязательства на один цикл отдаёт металл в арсенал; прежние получатели восстанавливаются после плава."
 SHL_conclave_attention_free_tt: "Конклав не занят другой мерой"
 SHL_house_votes_present_tt: "В Конклаве есть хотя бы один наследственный голос"
 SHL_charters_room_tt: "Действует меньше трёх хартий ([?SHL_charters_active|0] / 3)"
 SHL_charter_site_tt: "Печь принадлежит дому или городу и не имеет хартии"
 SHL_dispatch_donor_tt: "Запас печи-донора не меньше §Y2§! пакетов"
 SHL_embassy_slot_tt: "Предыдущее посольство прибыло"
 SHL_integration_slot_tt: "Предыдущее вхождение завершено"
 SHL_integration_price_tt: "Цена курса оплачена: дома §Y300§! £ADISCORD_economy_treasury_texticon, дирекция §Y100§! £political_power_texticon, регентство §Y200§! £ADISCORD_economy_treasury_texticon, коммуна §Y50§! £political_power_texticon, города - согласие сателлита"
 SHL_war_orders_all_site_tt: "Есть работающая печь без квоты, заказа и обязательства"
 SHL_measures: "Меры Конклава"
 SHL_measures_desc: "Ратифицированный курс даёт Конклаву право на меры: кампании в кварталах, суды, ярмарки и указы, каждая на §Y60§! дней. Мера занимает политическое внимание Конклава: пока одна идёт, другую начать нельзя, и созыв Конклава с арбитражем ждут её окончания."
 SHL_measure_crest_patronage: "Покровительство гербов"
 SHL_measure_crest_patronage_desc: "Совет десяти берёт под опеку младшие дома: оплачивает их долги перед поставщиками, выдаёт дочерей замуж в нужные семьи и напоминает кварталам, кто кормит город. Два месяца внимание Конклава принадлежит гербам, и улицы это чувствуют."
 SHL_measure_golden_fair: "Ярмарка Золотых ворот"
 SHL_measure_golden_fair_desc: "Картель объявляет большую ярмарку металла: караваны покупателей встают лагерем под стенами, цены держатся твёрдо, а каждый экспортный двор получает свою долю праздничного торга. Два месяца Конклав занят только гостями и весами."
 SHL_measure_quarter_assembly: "Собрание кварталов"
 SHL_measure_quarter_assembly_desc: "Делегаты смен собираются в зале Конклава на открытое заседание: читают наказы, спорят о хлебе и очередях, выбирают старост. Шестьдесят дней зал принадлежит кварталам, и гербы вынуждены слушать."
 SHL_measure_open_books: "Открытые книги"
 SHL_measure_open_books_desc: "Договорное собрание публикует счета Конклава: что получено с печей, что ушло на дороги и караулы, кому списаны долги. Переписчики два месяца сидят в архиве, а кварталы впервые видят, куда идут деньги города."
 SHL_measure_directorate_decree: "Указ дирекции"
 SHL_measure_directorate_decree_desc: "Директор подписывает указ о чрезвычайном снабжении: государственные дворы получают сырьё первыми, смены переводятся на жёсткий график, а гербы напоминают о себе только письменно. Два месяца город живёт по указу, а не по обычаю."
 SHL_measure_war_bonds: "Военный заём"
 SHL_measure_war_bonds_desc: "Железная корона выпускает заём на нужды арсенала. Подписные листы лежат в каждом квартале, глашатаи читают имена жертвователей, а казначейство принимает деньги вперёд под обещание вернуть с процентом. Долг останется городу, когда праздник подписки закончится."
 SHL_measure_crest_court: "Суд гербов"
 SHL_measure_crest_court_desc: "Регентство возвращает домам право судить споры о пошлинах и наследстве под собственными гербами. Два месяца судебные дни собирают на площади просителей и зевак; кварталы недовольны, но платят."
 SHL_measure_fief_grant: "Пожалование лена"
 SHL_measure_fief_grant_desc: "Регент жалует верному дому земли и доходы бывшего коронного имения. Церемония длится не один день: грамоты, присяги, пир для соседей-гербов. Дома видят, что служба короне вознаграждается, и давление в зале спадает."
 SHL_measure_common_assembly: "Общее собрание"
 SHL_measure_common_assembly_desc: "Коммуна собирает всех делегатов смен на общее собрание города: доклады советов, споры о распределении сырья, выборы постоянного совета. Шестьдесят дней зал гудит с утра до ночи, и гербам в нём больше нет места."
 SHL_measure_shift_reserve: "Резерв смен"
 SHL_measure_shift_reserve_desc: "Без гербов советы сами распоряжаются складами. Смены откладывают часть сырья в общий резерв коммуны, чтобы ни одна печь не остановилась из-за опоздавшего каравана. Два месяца кладовщики пересчитывают пакеты и спорят о нормах."
 SHL_measure_crest_patronage_tt: "Через §Y60§! дней: баланс Конклава §Y-0.05§! к гербам, давление гербов §G-5§!."
 SHL_measure_golden_fair_tt: "Через §Y60§! дней: §G+30§! £ADISCORD_economy_treasury_texticon за каждую работающую экспортную печь."
 SHL_measure_quarter_assembly_tt: "Через §Y60§! дней: баланс Конклава §Y+0.05§! к кварталам, опора городов §G+3§!."
 SHL_measure_open_books_tt: "Через §Y60§! дней: недовольство кварталов §G-5§!, стабильность §G+1%§!."
 SHL_measure_directorate_decree_tt: "Через §Y60§! дней: давление гербов §G-5§!, недовольство кварталов §R+3§!, §G+1§! пакет сырья государственной печи с наименьшим запасом."
 SHL_measure_war_bonds_tt: "Через §Y60§! дней: §G+200§! £ADISCORD_economy_treasury_texticon, государственный долг §R+300§!."
 SHL_measure_crest_court_tt: "Через §Y60§! дней: баланс Конклава §Y-0.05§! к гербам, недовольство кварталов §R+4§!."
 SHL_measure_fief_grant_tt: "Через §Y60§! дней: давление гербов §G-10§!, баланс Конклава §Y-0.03§! к гербам."
 SHL_measure_common_assembly_tt: "Через §Y60§! дней: баланс Конклава §Y+0.05§! к кварталам, недовольство кварталов §G-4§!."
 SHL_measure_shift_reserve_tt: "Через §Y60§! дней: общий резерв §G+2§! пакета сырья."
