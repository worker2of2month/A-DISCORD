 ADISCORD_SHL.110.t: "Пыль на кейзанской дороге"
 ADISCORD_SHL.110.d: "Первым заметил перемену погонщик водяного каравана из Зарханского округа. У кейзанских цистерн Табара теперь стояли не смотрители кяризов, а вооружённые люди общин. Они переписывали объём бочек и спрашивали, сколько дней потребуется, чтобы наполнить их снова. На обратном пути погонщик увидел ещё одну колонну и рассказал о ней не дому, а страже Бехруза Вейрана.\n\nНа заседании Конклава никто не назвал это войной. Дарий Сафир потребовал считать расходы, Мехран Арбин - готовить убежища в кварталах, а Арман Теймур попросил хотя бы одну ведомость, в которой девять разных командиров означали бы одну армию. Бахрам Каве подтвердил: колонны общин идут к цистернам не за водой. Откладывать выбор бесконечно уже нельзя.\n\nДо первого требования остаётся несколько производственных циклов. Можно оплачивать стражу, отдать две плавки под походный обоз или собрать деньги на окончательный расчёт. Если придётся воевать, целью станет коридор двух цистерн - Севир и Табар, - а не бесконечный поход в пустыню."
 ADISCORD_SHL.110.a: "Положить карту рядом с ведомостью."
 ADISCORD_SHL.111.t: "Шахрабад собирает колонны"
 ADISCORD_SHL.111.d: "Из Шахрабада пришло извещение: Конклав начал подготовку похода к двум цистернам. На заводских путях Хазара уже разгружают походное снаряжение, печи Дарбана и Шарима отливают металл для обоза, а гвардии пограничного дома Вейран стягиваются к Зарханскому округу. Через двадцать восемь дней, если спор не будет закрыт раньше и война не начнётся по иной причине, охрана караванов станет наступающей армией.\n\nДелегаты Собрания арычных общин знают Шахрабад по водным ведомостям: девять домов, девять гвардий, девять споров. Но извещение подписал не дом, а Конклав, и командует подготовкой не глава герба, а Арман Теймур, начальник общегосударственной стражи. Девять привычек командования сведены в одну, и это новое.\n\nКейзану предстоит удержать дороги к воде. Потеря обеих цистерн при сохранении шахрабадского пограничья даст противнику возможность навязать ограниченный мир. Собрание может заплатить Шахрабаду его цену, искать союзника у соседей или готовить подступы к Севиру и Табару."
 ADISCORD_SHL.111.a: "Готовить подступы."
 ADISCORD_SHL.112.t: "Хартия возвращённых цистерн"
 ADISCORD_SHL.112.d: "Шахрабад предлагает вернуть оба района цистерн - Севир и Табар - под власть Кейзана. Условие одно: добровольное вступление в Южный договор. Предложение привёз Мехран Арбин от имени городских собраний Шахрабада; ни наместника, ни передачи казны оно не предусматривает. Кейзан сохранит независимость, собственные отряды и собственное Собрание.\n\nДелегаты общин помнят, как стража Шахрабада вошла в Севир, и спрашивают, почему победитель отдаёт воду. Ответ делегации прост: цистерны поят не только Кейзан, и Южный договор хочет, чтобы воду делили собрания, а не гарнизоны. За военным соглашением может последовать оплаченная Шахрабадом программа восстановления дорог; её ещё предстоит выбрать и профинансировать отдельно.\n\nОтказ оставит прежнюю границу мира: цистерны у Шахрабада, общины - в стороне. Согласие вернёт землю только в том случае, если правительство Шахрабада по-прежнему готово соблюдать договор к моменту подписи."
 ADISCORD_SHL.112.a: "Вернуть землю и подписать договор."
 ADISCORD_SHL.112.b: "Оставить действующий мир в силе."
 ADISCORD_SHL.113.t: "На дороге сняли второй шлагбаум"
 ADISCORD_SHL.113.d: "На кейзанской дороге встретились два каравана. Первый вёз домой стражу Армана Теймура, второй - писарей Лейлы Надири, которым предстояло заново сверить земельные книги Севира и Табара. Цистерны вернулись Кейзану; на карте Южного договора появилась ещё одна независимая страна, и Мехран Арбин подписал хартию рядом с делегатами общин, которые год назад считали металл Шахрабада платой за свою воду.\n\nБехруз Вейран не приехал на подписание: пограничный дом отдал цистерны без единого слова, но запомнил, кто их отдал. Голшан Лоран спросил, сколько стоила Шахрабаду вода, которую он вернул. Самира Хади ответила раньше делегатов: лазарет в Табаре остаётся, и в нём лечат обе стороны.\n\nТеперь Конклаву предстоит решить, что стоит за подписью. Оплаченное восстановление дорог и, для коммуны, передача оружия соседним общинам превратят военное соглашение в повседневную связь. За эти работы придётся отвечать собственной казной, и Лейла Надири уже открыла ведомость."
 ADISCORD_SHL.113.a: "Открыть ведомость восстановления."
 ADISCORD_SHL.114.t: "Подписи не сошлись"
 ADISCORD_SHL.114.d: "Хартия не вступила в силу: Кейзан отказался от предложения, либо условия успели измениться до ответа. Передачи земли не произошло. Севир и Табар остаются у Шахрабада, стража Армана Теймура - у цистерн, а действующий мир сохраняется в прежних границах.\n\nМехран Арбин вернулся из Кейзана с письмом, в котором делегаты общин благодарят за честь и отказываются делить воду с теми, кто её отобрал. Голшан Лоран не скрывал удовлетворения: цистерны дают воду, а вода в пустыне - товар. Бехруз Вейран велел гвардиям дома оставаться в Табаре. Рамин Фарзан напомнил, что отказ общин не отменяет мира и не даёт повода к новой войне.\n\nЕсли обе стороны вновь смогут выполнить свои обязательства, Конклав вернётся к переговорам. До этого распоряжаться районами цистерн и начинать собственное восстановление предстоит на основании существующих границ, и каждая ведомость Лейлы Надири будет считать воду шахрабадской."
 ADISCORD_SHL.114.a: "Сохранить действующие договорённости."
 ADISCORD_SHL.115.t: "То, что осталось после похода"
 ADISCORD_SHL.115.d: "В Конклав принесли последнюю ведомость южной программы. На ней не было победного лозунга: только строки имущества, обязательств и получателей, выведенные рукой Лейлы Надири. За каждой строкой стоял выбор, сделанный тогда, когда металл мог стать выручкой, оружием или дорогой. Арман Теймур расписался за стражу, Рауф Дарбан - за арсенальные плавки, Бехруз Вейран - за гвардии пограничного дома, которые первыми встретили Кейзан.\n\n[SHLGetSouthernEpilogue]\n\nСтрана встретила кейзанскую угрозу, определила условия мира и оплатила собственное представление о будущем. Печи продолжат работать; теперь их огонь поддерживает порядок, у которого есть не только герб, но и исполненные обязательства. Амин Рашад подшил ведомость к делу и, в виде исключения, поставил на ней дату."
 ADISCORD_SHL.115.a: "Закрыть походную ведомость."
 ADISCORD_SHL.73.b: "Вернуть цистерны за концессию."
 ADISCORD_SHL.73.c: "Предложить независимому Кейзану хартию."
 SHL_epilogue_house: "Дома вложили военный результат в торговлю и новое производство. Территориальный выбор остался за Конклавом: удерживать коридор или обменять его на концессионные права. Государственный заём не исчезает от одного слова \"победа\"."
 SHL_epilogue_city: "Городские собрания получили дорогу, за которую заплатили открыто. Если хартия была принята, Кейзан остался самостоятельным партнёром; если коридор удержали, его жители получили место в общем политическом пространстве."
 SHL_epilogue_directorate: "Дирекция связала военное командование с новым арсеналом. Приобретённую землю она предпочла удерживать; после менее удачного мира производство восстановили на собственной территории. У приказа теперь есть промышленное обеспечение."
 SHL_epilogue_regent: "Регентство оплатило обучение домовой гвардии и восстановление действующей печи. Её голос снова опирается на работающую смену; непогашенные военные обязательства остаются в ведомости. Привилегия получила и представительство, и обязанность служить."
 SHL_epilogue_commune: "Коммуна оплатила местную дружину собственными рекрутами и оружием. Её получил владелец выбранного района: свои кварталы или независимые кейзанские общины после хартии. Солидарность приобрела вес настоящих формирований и проложенного пути."
