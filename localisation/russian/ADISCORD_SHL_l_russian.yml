 SHL_quarter_gauge: "£SHL_quarters_texticon  Кварталы\nНедовольство  §Y[?SHL_unrest|0]/100§!\n[SHLGetQuartersStatus]"
 SHL_crest_gauge: "£SHL_crest_texticon  Дома\nДавление  §Y[?SHL_house_pressure|0]/100§!\n[SHLGetCrestsStatus]"
 SHL_quarter_tension_tt: "§YКварталы§!\nКаждые 28 дней незарегистрированные кварталы получают §R+5§! недовольства. Смены, простой печей, выбранный курс и поставки кварталам меняют итог. При §Y60§! недовольства возможна стачка."
 SHL_crest_tension_tt: "§YДома§!\nДавление равно 100 минус средняя верность домов на землях Шахрабада. Дом с верностью ниже §Y40§! покидает зал. При давлении §Y60§! дома могут предъявить ультиматум.\n\nПока десятая печь не готова и в зале есть наследственные голоса, дома теряют §R5§! верности за 28 дней. При коммуне или упразднённых гербах эта потеря прекращается. Курс и получатель плавки тоже влияют на верность."
