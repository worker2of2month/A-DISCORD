 SHL_soup_kitchens: "Общие столовые"
 SHL_soup_kitchens_desc: "Горячая еда у заводских ворот не решает спор о смене, но даёт кварталам причину подождать."
 SHL_soup_kitchens_tt: "Недовольство кварталов: §G-10§!."
 SHL_house_banquet: "Приём гербов"
 SHL_house_banquet_desc: "Нур собирает наследников домов за одним столом, пока их поверенные не собрали подписи против Конклава."
 SHL_house_banquet_tt: "Давление гербов: §G-10§!."
 SHL_shift_mediation: "Переговоры с мастерами"
 SHL_shift_mediation_desc: "Старшие мастера смен знают, какие требования стачечного комитета можно выполнить за неделю."
 SHL_shift_mediation_tt: "Недовольство кварталов: §G-8§!."
 SHL_nur_audience: "Аудиенция у Нура"
 SHL_nur_audience_desc: "Каждый дом получает отдельную встречу и отдельное обещание. Ультиматум слабеет, когда его подписанты перестают доверять друг другу."
 SHL_nur_audience_tt: "Давление гербов: §G-8§!."
 SHL_strike_mission: "Холодная смена"
 SHL_strike_mission_desc: "Стачечный комитет держит печи на минимальном огне. Пока стачка продолжается, каждая работающая печь приносит на §R10§! £ADISCORD_economy_treasury_texticon меньше."
 SHL_strike_goal_tt: "Недовольство кварталов ниже §Y45§!"
 SHL_strike_success_tt: "Стачка закончится. Следующая возможна не раньше чем через 4 цикла."
 SHL_strike_timeout_tt: "§RКомитет потребует власти для советов смен.§!"
 SHL_conspiracy_mission: "Ультиматум гербов"
 SHL_conspiracy_mission_desc: "Девять гербов требуют вернуть им прежние права. Если давление не спадёт, дома попытаются взять Конклав без Нура."
 SHL_conspiracy_goal_tt: "Давление гербов ниже §Y45§!"
 SHL_conspiracy_success_tt: "Ультиматум распадётся. Следующий возможен не раньше чем через 4 цикла."
 SHL_conspiracy_timeout_tt: "§RДома попытаются сместить Нура.§!"
 SHL_raise_furnace_guard: "Набрать заводскую стражу"
 SHL_raise_furnace_guard_desc: "Печи оплачивают винтовки, города дают людей. Через 21 день в Шахрабаде будет сформирована дивизия заводской стражи: 2 пехотных батальона и ополчение."
 SHL_raise_guard_tt: "Через §Y21§! день в Хазаре появится дивизия «Furnace Levy». Если столица будет потеряна, цена вернётся полностью."
 SHL_guard_slot_tt: "Прежний набор завершён"
 SHL_war_orders: "Арсенальный заказ: [FROM.GetName]"
 SHL_war_orders_desc: "Выбранная печь перестаёт приносить обычную выручку и производит оружие. Оплачены две партии: каждая реальная плавка поставляет половину заказа. Усиленная смена выпускает обе сразу. Недостаток сырья, оккупация и остановка печи задерживают поставки. При отмене возвращается только цена ещё не изготовленных партий."
 SHL_offer_water_treaty: "Предложить «воду за металл»"
 SHL_offer_water_treaty_desc: "Общины Кейзана получат металл для своих водоводов, а печи — воду по согласованной квоте."
 SHL_offer_water_treaty_tt: "Кейзан рассмотрит предложение. Если он согласится: §R-100§! £ADISCORD_economy_treasury_texticon сразу и §R-3§! £ADISCORD_economy_treasury_texticon с каждой работающей печи за цикл. Спор о воде закончится."
 SHL_offer_pending_tt: "Нет неотвеченного предложения Кейзану"
 SHL_water_treaty_money_tt: "В казне не меньше §Y100§! £ADISCORD_economy_treasury_texticon"
 SHL_artesian_wells: "Артезианские скважины"
 SHL_artesian_wells_desc: "Бурение глубоких скважин у Арбина, Сафира и Лорана освободит печи от кяризов соседа."
 SHL_artesian_wells_tt: "Через §Y84§! дня спор о воде закончится без квоты. Если к этому времени спор уже закрыт, цена вернётся."
 SHL_project_slot_tt: "Этот проект ещё не оплачен"
 SHL_seize_qanats: "Взять кяризы"
 SHL_seize_qanats_desc: "Охрана водоводов перейдёт границу и займёт головные колодцы Севира, Табара, Нарвана и Ормиса."
 SHL_seize_qanats_tt: "§RШахрабад объявит войну Кейзану§! с целью занять Севир, Табар, Нарван и Ормис. Кейзан получит 3 дивизии стражи кяризов. Через 270 дней без капитуляции наступит перемирие."
 SHL_seize_qanats_ready_tt: "Спор о воде открыт, Шахрабад и Кейзан не воюют, Кейзан владеет пограничными кяризами"
 SHL_harbour_project: "Гавань Кердана"
 SHL_harbour_project_desc: "Собственные причалы позволят вывозить металл, не платя вейрской торговой палате."
 SHL_harbour_project_tt: "Через §Y90§! дней вейрский сбор перестанет удерживаться из выручки. Если в Кердане есть место, будет построена верфь. Если сбор уже отменён или Кердан потерян, цена вернётся."
 SHL_ultimatum_veyr: "Ультиматум Вейру"
 SHL_ultimatum_veyr_desc: "Если палата не отменит сбор, Шахрабад заберёт рудники Кассена и дорогу через Норан."
 SHL_ultimatum_veyr_tt: "§RШахрабад объявит войну Вейру§! с целью занять Норан и Кассен, а после «Ключа к морю» — ещё Тирву и Вейрский округ. Вейр получит 3 дивизии призматической стражи. Через 270 дней без капитуляции наступит перемирие."
 SHL_ultimatum_veyr_ready_tt: "Вейрский сбор действует, Шахрабад и Вейр не воюют, Вейр владеет Нораном или Кассеном"
 SHL_mazar_deadline: "Ультиматум Мазара"
 SHL_mazar_deadline_desc: "Палата общего пайка дала Шахрабаду 60 дней. Затем её отряды войдут в Шахрабадский округ."
 SHL_mazar_deadline_timeout_tt: "§RМазар объявит войну за Шахрабадский округ§!, если он не воюет в другом месте. Иначе требование будет отложено на 4 цикла."
 SHL_mazar_last_ration: "Выплатить паёк в последний день"
 SHL_mazar_last_ration_desc: "Поздний платёж дороже, но закрывает требование Мазара навсегда."
 SHL_mazar_last_ration_tt: "Ультиматум будет снят, а требования Мазара закрыты."
 SHL_export_contract: "Подписать экспортный заказ: [FROM.GetName]"
 SHL_export_contract_desc: "Выбранный дом получает аванс за металл двух плавок. На исполнение отводятся три ближайших производственных цикла; усиленная смена выполняет две плавки за один цикл. Сырьё и обслуживание оплачиваются обычно. Выручка этой печи до исполнения уходит в заказ. Оккупация и простой не останавливают срок. При срыве можно один раз продлить договор или вернуть аванс со штрафом."
 SHL_export_contract_tt: "Сейчас: §G60§! £ADISCORD_economy_treasury_texticon. За §Y2§! плавки до конца третьего цикла: ещё §G120§! £ADISCORD_economy_treasury_texticon. Обычная выручка печи перенаправляется. Расторжение: §R90§! £ADISCORD_economy_treasury_texticon, непокрытая часть становится долгом."
 SHL_export_furnaces_tt: "Работает не меньше §Y6§! печей"
 SHL_debt_shift: "Заложить доход дома: [FROM.GetName]"
 SHL_debt_shift_desc: "Городская касса выдаёт регентству деньги под будущую выручку выбранного дома. В погашение уходит только фактический доход этой печи после удержаний. Простой задерживает платёж; усиленная смена перечисляет свою настоящую выручку, а не условную двойную выплату. За досрочное закрытие взыскивается остаток обязательства. Закон о долговых сменах позволит передать саму печь городской кассе в счёт долга."
 SHL_debt_shift_tt: "Сейчас: §G150§! £ADISCORD_economy_treasury_texticon, §R+8§! недовольство. Выручка печи погашает §Y180§! £ADISCORD_economy_treasury_texticon. Остаток последней выплаты возвращается в казну. Отмена взыскивает непогашенный остаток."
 SHL_common_cauldron: "Назначить печь-донор: [FROM.GetName]"
 SHL_common_cauldron_desc: "Работающая городская печь берёт шефство над другим предприятием. Затем выберите на панели нуждающуюся печь и назначьте её получателем. Пока получатель недоступен, донор сохраняет обычную выручку. Когда помощь возможна, две его плавки уйдут на восстановление получателя. Это цена солидарности: металл нельзя одновременно продать."
 SHL_common_cauldron_tt: "Выберите получателя отдельным решением. §Y2§! плавки донора заменят его выручку ремонтом другой городской печи. Подвоз и обслуживание донора сохраняются."
 # Event answers
 SHL_strike_concede_tt: "£ADISCORD_economy_treasury_texticon §R-150§!. Недовольство кварталов: §G-35§!. Давление гербов: §R+10§!. Гражданская опора: §G+5§!. Стачка закончится."
 SHL_strike_wait_tt: "Начнётся 42-дневная миссия. Пока идёт стачка, каждая печь приносит на §R10§! £ADISCORD_economy_treasury_texticon меньше. Если недовольство не упадёт ниже §Y45§!, комитет потребует власти."
 SHL_strike_suppress_tt: "Недовольство кварталов: §G-25§!. Гражданская опора: §R-10§!. Вторая расправа сразу приведёт к требованию советов смен."
 SHL_commune_course_tt: "§YНур уйдёт в отставку. Власть перейдёт Совету смен, а печи — рабочим.§! Откроется путь «Рабочая коммуна»."
 SHL_martial_law_tt: "Недовольство кварталов станет §Y30§!. Давление гербов: §G-10§!. Стачка закончится."
 SHL_conspiracy_guarantees_tt: "Давление гербов: §G-25§!. Недовольство кварталов: §R+10§!. Гражданская опора: §R-5§!."
 SHL_conspiracy_wait_tt: "Начнётся 42-дневная миссия. Если давление гербов не упадёт ниже §Y45§!, дома попытаются сместить Нура."
 SHL_conspiracy_arrests_tt: "Давление гербов: §G-30§!. Недовольство кварталов: §G-5§!. Печи Хазара и Вейрана, если ими владеют дома, перейдут дирекции."
 SHL_regency_course_tt: "§YНур уйдёт в отставку. Регентом станет Дарий Сафир.§! Давление гербов: §G-30§!. Недовольство кварталов: §R+15§!. Откроется путь «Регентство домов»."
 SHL_resist_crests_tt: "Давление гербов станет §Y40§!. Нур сохранит власть."
 SHL_accident_site_tt: "§RАварийная печь погаснет, а её цеха будут повреждены.§!"
 SHL_accident_house_tt: "Давление гербов: §R+10§!. Гражданская опора: §G+5§!. Недовольство кварталов: §G-10§!."
 SHL_accident_masters_tt: "Недовольство кварталов: §R+15§!. Давление гербов: §G-5§!."
 SHL_accident_commission_tt: "Недовольство кварталов: §G-5§!. Давление гербов: §R+5§!. Смена этой печи будет считаться обученной."
 SHL_water_crisis_tt: "Пока спор не решён, Арбин, Сафир и Лоран получают §R+4§! износа за цикл. Решения появятся в категории «Кварталы и границы»."
 SHL_kyz_accepts_treaty_tt: "Шахрабад заплатит 100 и будет отдавать металл по квоте; печи получат воду."
 SHL_kyz_refuses_tt: "Шахрабад получит отказ."
 SHL_kyz_accepts_brotherhood_tt: "Спор о воде закончится без квоты."
 SHL_armistice_tt: "Стороны заключат белый мир. Земля останется у прежних владельцев."
 SHL_veyr_crisis_tt: "Пока сбор действует, каждая работающая печь приносит на §R5§! £ADISCORD_economy_treasury_texticon меньше."
 SHL_glp_accepts_union_tt: "Вейр отменит сбор и станет торговым партнёром Шахрабада."
 SHL_glp_refuses_tt: "Шахрабад получит отказ."
 SHL_mazar_pay_first_tt: "£ADISCORD_economy_treasury_texticon §R-250§!, £political_power_texticon §R-30§!. Мазар вернётся с новым требованием через 10 циклов."
 SHL_mazar_refuse_tt: "Начнётся 60-дневный ультиматум. Затем Мазар объявит войну за Шахрабадский округ. Во время отсрочки можно набрать стражу или выплатить паёк по высокой цене."
 SHL_mazar_pay_final_tt: "£ADISCORD_economy_treasury_texticon §R-400§!. Требования Мазара будут закрыты."
 SHL_partner_joins_tt: "Страна вступит в союз Шахрабада."
 # Focus rewards
 SHL_quarter_listening_tt: "Недовольство кварталов: §G-10§!."
 SHL_heralds_table_tt: "Давление гербов: §G-10§!."
 SHL_shift_arbitration_tt: "Каждый цикл недовольство кварталов снижается ещё на §G1§!."
 SHL_water_question_tt: "Спор о воде с Кейзаном начнётся сейчас, если ещё не начался."
 SHL_veyr_duties_tt: "Спор о вейрском сборе начнётся сейчас, если ещё не начался."
 SHL_golden_gate_cartel_tt: "Вместимость казны: §G+5%§!."
 SHL_house_guards_tt: "Дома оплатят §Y2§! дивизии заводской стражи в Шахрабаде. Давление гербов: §G-15§!."
 SHL_veyr_partner_available_tt: "Вейр существует, не воюет с Шахрабадом и не рассматривает другое предложение"
 SHL_veyr_partnership_tt: "Вейр получит предложение торгового союза. Если он согласится, сбор будет отменён."
 SHL_golden_gate_offer_tt: "Вейр получит приглашение в союз Золотых ворот."
 SHL_council_of_cities_tt: "Недовольство кварталов: §G-20§!. Гражданская опора: §G+10§!."
 SHL_kyz_brotherhood_available_tt: "Кейзан существует, не воюет с Шахрабадом и не рассматривает другое предложение"
 SHL_kyz_brotherhood_offer_tt: "Кейзан получит предложение братства кяризов. Если он согласится, спор о воде закончится без квоты."
 SHL_workers_brigades_tt: "Города выставят §Y2§! дивизии заводской стражи в Шахрабаде. Недовольство кварталов: §G-5§!."
 SHL_southern_compact_offer_tt: "Кейзан получит приглашение в Южный договор."
 SHL_key_to_sea_tt: "Ультиматум Вейру будет включать Тирву и Вейрский округ."
 SHL_restore_privileges_tt: "Все печи Шахрабада вернутся домам; погасшие будут готовы к оплаченному запуску. Давление гербов: §G-20§!. Недовольство кварталов: §R+10§!."
 SHL_private_armies_tt: "Дома выставят §Y3§! дивизии заводской стражи в Шахрабаде. Недовольство кварталов: §R+5§!."
 SHL_hereditary_republic_tt: "Давление гербов: §G-20§!."
 SHL_furnaces_to_workers_tt: "Все печи Шахрабада перейдут городам; погасшие будут готовы к оплаченному запуску. Недовольство кварталов: §G-20§!. Гражданская опора: §G+15§!."
 SHL_common_smelting_tt: "Усиленная смена больше не увеличивает недовольство кварталов."
 # Focuses
 SHL_quarter_listening: "Слушать кварталы"
 SHL_quarter_listening_desc: "В рабочих кварталах о печах знают больше, чем в залах Конклава. Нур открывает приёмную для делегатов смен, пока их жалобы не превратились в требования."
 SHL_heralds_table: "Стол гербов"
 SHL_heralds_table_desc: "Дома привыкли решать споры за закрытыми дверями. Общий стол гербов делает их обиды видимыми и позволяет гасить их раньше ультиматума."
 SHL_shift_arbitration: "Сменный арбитраж"
 SHL_shift_arbitration_desc: "Постоянная комиссия мастеров и управляющих разбирает споры о сменах до того, как они выходят за ворота завода."
 SHL_factory_militia: "Заводская стража"
 SHL_factory_militia_desc: "Охрана станций может стать ядром армии, если печи возьмут на себя оплату винтовок, а города дадут людей."
 SHL_southern_watch: "Южная стража"
 SHL_southern_watch_desc: "Палата общего пайка Мазара считает чужой металл общим пайком. Шахрабадский округ должен встретить её отряды подготовленными позициями."
 SHL_mobilise_furnaces: "Мобилизация печей"
 SHL_mobilise_furnaces_desc: "Каждая печь получает военный заказ, который можно выполнить без остановки гражданской смены."
 SHL_water_question: "Водный вопрос"
 SHL_water_question_desc: "Печи Арбина, Сафира и Лорана пьют воду кяризов Кейзана. Мы начнём разговор о воде сами, пока общины не начали его перекрытием водоводов."
 SHL_qanat_guard: "Охрана водоводов"
 SHL_qanat_guard_desc: "Если переговоры не дадут воды, головные колодцы на границе придётся взять под охрану Шахрабада."
 SHL_veyr_duties: "Вейрские пошлины"
 SHL_veyr_duties_desc: "Торговая палата Вейра берёт сбор с каждого вагона металла, идущего к морю. Мы откроем этот спор и подготовим собственную гавань."
 SHL_veyr_ultimatum: "Ультиматум палате"
 SHL_veyr_ultimatum_desc: "Рудники Кассена и дорога через Норан дают Вейру власть над нашей выручкой. Если палата не уступит, Шахрабад заберёт их."
 SHL_golden_gate_cartel: "Картель Золотых ворот"
 SHL_golden_gate_cartel_desc: "Десять домов договариваются о единых ценах на вывоз. Конклав становится не только собранием владельцев, но и общей торговой конторой."
 SHL_house_guards: "Гвардии домов"
 SHL_house_guards_desc: "Каждый дом выставляет охрану своих печей. Под общим командованием эти отряды станут армией, которую оплачивают сами владельцы."
 SHL_veyr_partnership: "Торговый союз с Вейром"
 SHL_veyr_partnership_desc: "Вейру нужен наш металл так же, как нам его причалы. Картель предложит палате долю в вывозе вместо сбора."
 SHL_conclave_of_ten: "Конклав десяти"
 SHL_conclave_of_ten_desc: "Десятый дом занял своё кресло, картель торгует от имени всех, а Золотые ворота открыты партнёрам, готовым защищать общий рынок."
 SHL_council_of_cities: "Совет городов"
 SHL_council_of_cities_desc: "Самостоятельные города получают постоянный совет рядом с Конклавом. Кварталы впервые видят своих представителей в зале решений."
 SHL_fire_and_water: "Огонь и вода"
 SHL_fire_and_water_desc: "Общины Кейзана и города Шахрабада управляются собраниями. Мы предложим делить воду и металл по общему договору без квоты и без силы."
 SHL_workers_brigades: "Рабочие дружины"
 SHL_workers_brigades_desc: "Города сами набирают дружины из смен. Их оружие куплено выручкой печей, а командиров выбирают цеха."
 SHL_southern_compact: "Южный договор"
 SHL_southern_compact_desc: "Открытый Конклав и союз арычных общин могут защищать друг друга от Палаты общего пайка, если согласятся на общий договор."
 SHL_war_directorate: "Военная дирекция"
 SHL_war_directorate_desc: "Дирекция Нура распоряжается печами как единым арсеналом. Первая государственная линия выпуска станет оружейной."
 SHL_right_to_water: "Право на воду"
 SHL_right_to_water_desc: "Государственным печам нужна гарантированная вода. Дирекция объявляет головные кяризы границы частью промышленной системы Шахрабада."
 SHL_key_to_sea: "Ключ к морю"
 SHL_key_to_sea_desc: "Без Тирвы и Вейрского округа любой договор с палатой можно отменить одним сбором. Дирекция требует всей дороги к морю."
 SHL_iron_shahrabad: "Железный Шахрабад"
 SHL_iron_shahrabad_desc: "Печи больше не должны останавливаться из-за чужого решения о воде или причалах. Дирекция отвечает за действующее снабжение — обеспеченное договором, собственной стройкой или военной победой. Её силу измеряют работающие цеха и оружие на складе."
 SHL_regency_council: "Регентский совет"
 SHL_regency_council_desc: "Дарий Сафир правит от имени девяти гербов. Первые решения регентства должны показать, что дома едины."
 SHL_restore_privileges: "Возврат привилегий"
 SHL_restore_privileges_desc: "Все главные печи возвращаются наследственным домам. Городские комиссии распускаются, а погасшие предприятия переходят к прежним владельцам."
 SHL_private_armies: "Частные гвардии"
 SHL_private_armies_desc: "Дома больше не просят казну об охране. Каждая семья содержит собственный отряд, а регент сводит их в общий строй."
 SHL_debt_shifts: "Долговые смены"
 SHL_debt_shifts_desc: "Регентство оплачивает свои обещания будущими сменами рабочих кварталов."
 SHL_hereditary_republic: "Наследственная республика"
 SHL_hereditary_republic_desc: "Конклав становится республикой гербов: закон непрерывного огня защищает не город, а право домов на него."
 SHL_shift_councils: "Советы смен"
 SHL_shift_councils_desc: "Стачечные комитеты становятся властью. Каждая печь выбирает делегатов, а Совет смен заменяет Конклав."
 SHL_furnaces_to_workers: "Печи — рабочим"
 SHL_furnaces_to_workers_desc: "Наследственные права отменены. Каждая главная печь принадлежит городу, чьи люди держат её огонь."
 SHL_common_smelting: "Общая плавка"
 SHL_common_smelting_desc: "Смены сами решают, когда работать сверх нормы. Усиленная плавка больше не означает чужой приказ."
 SHL_qanat_brotherhood: "Братство кяризов"
 SHL_qanat_brotherhood_desc: "Коммуна огня протягивает руку союзу арычных общин: вода и металл должны принадлежать тем, кто их добывает."
 SHL_commune_of_fire: "Коммуна огня"
 SHL_commune_of_fire_desc: "Шахрабад без гербов и без регента. Печи горят для городов, а оборона держится на выборных дружинах и союзниках."
 # Spirits
 SHL_martial_law: "Военное положение"
 SHL_martial_law_desc: "Заводская охрана патрулирует кварталы. Смены выходят на работу, но Конклав теряет доверие."
 SHL_broken_conclave: "Расколотый Конклав"
 SHL_broken_conclave_desc: "Нур удержал власть, но половина гербов отказывается подписывать его решения."
 SHL_captured_qanats: "Захваченные кяризы"
 SHL_captured_qanats_desc: "Головные колодцы границы работают на печи Шахрабада. Общины Кейзана помнят, как их отняли."
 SHL_veyr_bondage: "Вейрская кабала"
 SHL_veyr_bondage_desc: "Поражение в порту заставило Шахрабад платить палате Вейра по её расценкам."
 SHL_mazar_ration: "Паёк Мазара"
 SHL_mazar_ration_desc: "Палата общего пайка забрала часть казны и требует металл для своих распорядителей."
 SHL_victory_over_ration: "Победа над пайком"
 SHL_victory_over_ration_desc: "Отряды Мазара отступили за свою границу, а Шахрабад получил земли Ресана и Сехвана."
 SHL_southern_watch_idea: "Южная стража"
 SHL_southern_watch_idea_desc: "Посты на перевалах Шахрабадского округа готовы встретить наступление."
 SHL_conclave_of_ten_idea: "Конклав десяти"
 SHL_conclave_of_ten_idea_desc: "Десять гербов торгуют от имени общего картеля."
 SHL_southern_compact_idea: "Южный договор"
 SHL_southern_compact_idea_desc: "Города Шахрабада и собрания соседей договариваются о воде, металле и обороне."
 SHL_iron_shahrabad_idea: "Железный Шахрабад"
 SHL_iron_shahrabad_idea_desc: "Государственные печи работают на армию, а армия защищает воду и дорогу к морю."
 SHL_hereditary_republic_idea: "Наследственная республика"
 SHL_hereditary_republic_idea_desc: "Гербы вернули себе власть над печами и городами."
 SHL_commune_of_fire_idea: "Коммуна огня"
 SHL_commune_of_fire_idea_desc: "Печи принадлежат городам, а решения принимают выборные советы смен."
 # Characters, traits, parties, alliances
 SHL_Darius_Safir: "Дарий Сафир"
 SHL_Darius_Safir_desc: "Глава дома Сафир и самый богатый из девяти гербов. Он называет регентство временным, но первым делом вернул домам все печи."
 SHL_Shift_Councils: "Совет смен"
 SHL_Shift_Councils_desc: "Выборные делегаты всех главных печей. Совет не имеет постоянного председателя; его решения подписывает дежурный мастер."
 SHL_regent_of_the_crests: "Регент гербов"
 SHL_regent_of_the_crests_desc: "Правит от имени домов и в их интересах."
 SHL_voice_of_the_shifts: "Голос смен"
 SHL_voice_of_the_shifts_desc: "Власть, которую можно отозвать на следующем собрании цеха."
 SHL_anarchism: "Коммуна Шахрабада"
 SHL_anarchism_DEF: "Коммуна Шахрабада"
 SHL_anarchism_party: "Советы смен"
 SHL_southern_compact_faction: "Южный договор"
 SHL_golden_gate_faction: "Союз Золотых ворот"
 # Events
 ADISCORD_SHL.20.t: "Холодная смена"
 ADISCORD_SHL.20.d: "Утренний гудок прозвучал над пустыми проходными. Смены пришли к воротам, но не вошли в цеха: стачечный комитет оставил у каждой печи по одному кочегару, чтобы кладка не остыла, и вывесил список требований на воротах Конклава.\n\nТребования просты: оплата сверхурочных, свободные дни после усиленных смен и право знать, куда уходит выручка. Дома требуют прислать охрану. Мастера просят денег и времени. Пока огонь держат на минимуме, каждая печь выдаёт меньше металла."
 ADISCORD_SHL.20.a: "Оплатить требования из казны."
 ADISCORD_SHL.20.b: "Ждать и вести переговоры."
 ADISCORD_SHL.20.c: "Прислать охрану железной дороги."
 ADISCORD_SHL.21.t: "Советы смен требуют власти"
 ADISCORD_SHL.21.d: "Стачка перестала быть спором о деньгах. Комитеты всех главных печей собрались в одном цеху и объявили себя Советом смен. Они не просят отставки Нура: они сообщают, что Конклав больше не нужен.\n\nГорода поддерживают советы, дома готовят свою охрану. У Нура осталось два ответа. Признать советы значит отдать печи тем, кто держит их огонь. Военное положение сохранит Конклав, но стоить это будет доверия кварталов."
 ADISCORD_SHL.21.a: "Признать Совет смен."
 ADISCORD_SHL.21.b: "Объявить военное положение."
 ADISCORD_SHL.22.t: "Смена вернулась"
 ADISCORD_SHL.22.d: "Кочегары снова подняли огонь до рабочей температуры. Комитет не распущен, но его делегаты вернулись к печам, а список требований сняли с ворот Конклава. В ведомости следующего цикла впервые записано, сколько смен было оплачено сверх нормы."
 ADISCORD_SHL.22.a: "Печи снова работают."
 ADISCORD_SHL.30.t: "Ультиматум гербов"
 ADISCORD_SHL.30.d: "Поверенные девяти домов принесли в Конклав общее письмо. Они требуют вернуть наследственные права, отменить городские комиссии и подтвердить, что ни одна печь не перейдёт государству без согласия её дома.\n\nПод письмом стоят подписи, которые обычно не встречаются рядом. Если дома договорились между собой, у них хватит охраны и денег, чтобы править без посредника."
 ADISCORD_SHL.30.a: "Дать гарантии домам."
 ADISCORD_SHL.30.b: "Выдержать давление."
 ADISCORD_SHL.30.c: "Арестовать зачинщиков."
 ADISCORD_SHL.31.t: "Ночь гербов"
 ADISCORD_SHL.31.d: "Ночью охрана домов заняла мосты и телеграф. Утром Дарий Сафир пришёл в зал Конклава с решением девяти гербов: Нур остаётся посредником по имени, а регентский совет принимает власть над печами, казной и охраной.\n\nЧасть городской охраны ещё верна Нуру. Сопротивление сохранит Конклав, но расколет его надолго."
 ADISCORD_SHL.31.a: "Уступить регентству."
 ADISCORD_SHL.31.b: "Сопротивляться."
 ADISCORD_SHL.32.t: "Письмо без подписей"
 ADISCORD_SHL.32.d: "Общий ультиматум распался. Каждый дом получил отдельное обещание, и уже через неделю поверенные спорили друг с другом громче, чем с Нуром. Письмо осталось в архиве Конклава без новых подписей."
 ADISCORD_SHL.32.a: "Гербы разошлись."
 ADISCORD_SHL.40.t: "Авария на главной печи"
 ADISCORD_SHL.40.d: "Изношенная кладка не выдержала очередной плавки. Металл прорвался в литейный пролёт, людей удалось вывести, но печь придётся гасить, а цеха вокруг неё — восстанавливать.\n\nДом утверждает, что мастера работали сверх нормы. Мастера говорят, что дом годами откладывал ремонт. Город ждёт, кого Конклав назовёт виновным."
 ADISCORD_SHL.40.a: "Виноват дом."
 ADISCORD_SHL.40.b: "Виноваты мастера."
 ADISCORD_SHL.40.c: "Назначить комиссию."
 ADISCORD_SHL.50.t: "Кяризы пересыхают"
 ADISCORD_SHL.50.d: "Общины Кейзана закрыли боковые отводы кяризов, питавшие печи Арбина, Сафира и Лорана. Их собрание сообщает: печи Шахрабада пьют воду, которой общины поливают поля, и за это никто не платит.\n\nБез охлаждения кладка стареет быстрее. Можно договориться о квоте, пробурить собственные скважины или взять головные колодцы силой."
 ADISCORD_SHL.50.a: "Спор о воде нужно решить."
 ADISCORD_SHL.52.t: "Шахрабад предлагает воду за металл"
 ADISCORD_SHL.52.d: "Посланники Конклава предлагают общинам металл для водоводов и регулярную долю выручки печей. Взамен Шахрабад просит открыть отводы кяризов для Арбина, Сафира и Лорана."
 ADISCORD_SHL.52.a: "Принять договор."
 ADISCORD_SHL.52.b: "Отказать."
 ADISCORD_SHL.53.t: "Кейзан согласился"
 ADISCORD_SHL.53.d: "Собрание арычных общин приняло предложение. Отводы кяризов снова открыты, и печи на западной границе получают воду."
 ADISCORD_SHL.53.a: "Вода вернулась."
 ADISCORD_SHL.54.t: "Кейзан отказал"
 ADISCORD_SHL.54.d: "Собрание арычных общин не приняло предложение Шахрабада или договор нельзя выполнить: не хватает денег, либо стороны уже воюют."
 ADISCORD_SHL.54.a: "Искать другой путь."
 ADISCORD_SHL.55.t: "Братство кяризов"
 ADISCORD_SHL.55.d: "Города Шахрабада предлагают общинам общий договор: воду и металл делят собрания, без квот и без охраны на колодцах. Если договор будет принят, спор о воде закончится."
 ADISCORD_SHL.55.a: "Принять братство."
 ADISCORD_SHL.55.b: "Отказать."
 ADISCORD_SHL.56.t: "Перемирие у водоводов"
 ADISCORD_SHL.56.d: "Бои за колодцы затянулись. Обе стороны устали, и старейшины общин предлагают перемирие на прежней границе. Спор о воде остаётся нерешённым."
 ADISCORD_SHL.56.a: "Согласиться на перемирие."
 ADISCORD_SHL.57.t: "Кяризы под охраной Шахрабада"
 ADISCORD_SHL.57.d: "Общины Кейзана признали поражение. Севир, Табар, Нарван и Ормис переходят под власть Шахрабада, а головные колодцы охраняют заводские стражники."
 ADISCORD_SHL.57.a: "Вода принадлежит печам."
 ADISCORD_SHL.58.t: "Поражение у водоводов"
 ADISCORD_SHL.58.d: "Шахрабад не удержал фронт. Общины заняли Арбин и выставили условие: остальные печи получат воду только по квоте."
 ADISCORD_SHL.58.a: "Принять условия."
 ADISCORD_SHL.60.t: "Вейрский сбор"
 ADISCORD_SHL.60.d: "Торговая палата Вейра объявила новый сбор с металла, идущего через её порты. Каждый вагон с проката теперь проходит через весы палаты.\n\nСбор невелик для одной партии, но он уменьшает выручку каждой печи. Его можно обойти собственной гаванью, отменить договором или силой."
 ADISCORD_SHL.60.a: "Нужно решить вопрос со сбором."
 ADISCORD_SHL.61.t: "Шахрабад предлагает торговый союз"
 ADISCORD_SHL.61.d: "Картель Золотых ворот предлагает палате Вейра долю в вывозе металла вместо сбора. Порты получат постоянный грузопоток, а Шахрабад — свободный путь к морю."
 ADISCORD_SHL.61.a: "Принять союз."
 ADISCORD_SHL.61.b: "Отказать."
 ADISCORD_SHL.62.t: "Вейр принял союз"
 ADISCORD_SHL.62.d: "Палата отменила сбор для металла Шахрабада. Её поверенные теперь сидят за столом картеля."
 ADISCORD_SHL.62.a: "Путь к морю открыт."
 ADISCORD_SHL.63.t: "Вейр отказал"
 ADISCORD_SHL.63.d: "Палата Вейра не приняла предложение Шахрабада или договор невозможен, потому что стороны воюют."
 ADISCORD_SHL.63.a: "Искать другой путь."
 ADISCORD_SHL.65.t: "Перемирие в порту"
 ADISCORD_SHL.65.d: "Война за дорогу к морю не принесла решающей победы. Палата предлагает перемирие на прежних границах; сбор остаётся."
 ADISCORD_SHL.65.a: "Согласиться на перемирие."
 ADISCORD_SHL.66.t: "Дорога к морю"
 ADISCORD_SHL.66.d: "Вейр признал поражение. Рудники Кассена и дорога через Норан переходят Шахрабаду, а сбор палаты больше не действует."
 ADISCORD_SHL.66.a: "Металл пойдёт к морю."
 ADISCORD_SHL.67.t: "Поражение в порту"
 ADISCORD_SHL.67.d: "Шахрабад не удержал фронт. Палата забирает Салик и навязывает свои расценки на вывоз металла."
 ADISCORD_SHL.67.a: "Принять условия."
 ADISCORD_SHL.70.t: "Паёк Мазара"
 ADISCORD_SHL.70.d: "Посланник Палаты общего пайка прибыл с расчётом: металл Шахрабада нужен водосборам Мазара, и палата считает его частью общего пайка. Мазар требует платежа и напоминает, что Шахрабадский округ лежит у его границы.\n\nМожно заплатить. Можно отказать и подготовиться к войне: палата даст 60 дней."
 ADISCORD_SHL.70.a: "Выплатить паёк."
 ADISCORD_SHL.70.b: "Отказать Мазару."
 ADISCORD_SHL.71.t: "Мазар выступил"
 ADISCORD_SHL.71.d: "Срок ультиматума истёк. Отряды Мазара перешли границу Шахрабадского округа. Палата объявила, что заберёт свой паёк сама."
 ADISCORD_SHL.71.a: "К оружию."
 ADISCORD_SHL.72.t: "Перемирие с Мазаром"
 ADISCORD_SHL.72.d: "Наступление Мазара выдохлось, а Шахрабад не смог его отбросить. Палата соглашается на перемирие на прежней границе и снимает требование пайка."
 ADISCORD_SHL.72.a: "Согласиться на перемирие."
 ADISCORD_SHL.73.t: "Мазар разбит"
 ADISCORD_SHL.73.d: "Палата общего пайка признала поражение. Ресан и Сехван переходят Шахрабаду, а требования пайка сняты."
 ADISCORD_SHL.73.a: "Шахрабад устоял."
 ADISCORD_SHL.74.t: "Паёк взят силой"
 ADISCORD_SHL.74.d: "Шахрабад капитулировал. Мазар не забирает печи, но его распорядители вывозят две пятых казны и остаются следить за выплатами."
 ADISCORD_SHL.74.a: "Печи продолжают работать."
 ADISCORD_SHL.75.t: "Мазар требует снова"
 ADISCORD_SHL.75.d: "Палата общего пайка вернулась. Прежний платёж она называет задатком и теперь требует окончательный паёк в размере 400. После этого Мазар обещает закрыть вопрос навсегда."
 ADISCORD_SHL.75.a: "Заплатить окончательно."
 ADISCORD_SHL.75.b: "Отказать Мазару."
 ADISCORD_SHL.90.t: "Южный договор"
 ADISCORD_SHL.90.d: "Шахрабад предлагает общинам Кейзана союз: общая оборона от Мазара и общий совет по воде и металлу."
 ADISCORD_SHL.90.a: "Вступить в договор."
 ADISCORD_SHL.90.b: "Отказать."
 ADISCORD_SHL.91.t: "Союз Золотых ворот"
 ADISCORD_SHL.91.d: "Картель Шахрабада предлагает палате Вейра стать членом союза: общий рынок будет защищён общей армией."
 ADISCORD_SHL.91.a: "Вступить в союз."
 ADISCORD_SHL.91.b: "Отказать."
 ADISCORD_SHL.92.t: "Союз заключён"
 ADISCORD_SHL.92.d: "Приглашение Шахрабада принято. Новый союзник будет защищать общие границы."
 ADISCORD_SHL.92.a: "Хорошо."
 ADISCORD_SHL.93.t: "Союз отклонён"
 ADISCORD_SHL.93.d: "Приглашение Шахрабада отклонено или союз больше невозможен."
 ADISCORD_SHL.93.a: "Понятно."
 SHL_obligation_idle_tt: "Ведомость обязательств свободна. Обслуживание и подвоз печей доступны отдельно."
 SHL_obligation_site_ready: "Печь работает в своём контролируемом районе"
 SHL_obligation_idle: "Ведомость свободна"
 SHL_civic_order: "Городской заказ: [FROM.GetName]"
 SHL_civic_order_desc: "Мосты, водоводы и ремонтные мастерские требуют металла местной печи. Две успешные плавки дадут району один уровень инфраструктуры. До завершения печь не перечисляет обычную выручку в казну. Если район уже достиг максимума, платёж вернётся. Оккупация приостанавливает работу; смена собственника или власти рассчитывает незавершённый заказ."
 SHL_civic_order_tt: "За §Y2§! плавки: §G+1§! инфраструктура выбранного района, §G+5§! гражданская опора, §G-5§! недовольство. Выручка печи перенаправляется; усиленная смена выполняет две плавки. Отмена возвращает §Y120§! £ADISCORD_economy_treasury_texticon."
 SHL_arsenal_order_tt: "За плавку: §G750§! £infantry_equipment_texticon и §G5§! ед. оружия отделения; всего две партии. Выручка перенаправляется. Усиленная смена выпускает обе партии; отмена возвращает по §Y60§! £ADISCORD_economy_treasury_texticon за невыпущенную."
 SHL_relief_recipient: "Помочь печи: [FROM.GetName]"
 SHL_relief_recipient_desc: "Получателем может стать другая городская печь с износом не ниже 30 или с погашенным огнём. Ей нужен свободный слот оплаченных работ; погашенной печи также требуется один пакет сырья для запуска. Если начинается обычный ремонт, помощь ждёт его расчёта. Оплаченный чужой ремонт не перехватывается. Получатель закрепляется до исполнения или отмены всей ведомости."
 SHL_relief_ready_tt: "Другая городская печь под контролем, без оплаченной работы: работает с износом от 30 или погашена и имеет 1 пакет сырья."
 SHL_relief_delivery_tt: "После §Y2§! плавок донора: §G-30§! износа получателя. Погашенная печь вместо этого запустится с износом §Y20§!, израсходовав §Y1§! свой пакет. Недовольство: §G-8§!."
 SHL_close_obligation: "Рассчитать незавершённое обязательство"
 SHL_close_obligation_desc: "Завершённые поставки оружия остаются на складе; незавершённая городская стройка возвращает депозит. Экспорт и залог требуют погашения остатка, указанного в ведомости. Если казны не хватает, разница становится обычным государственным долгом. Отданные плавки и сырьё не возвращаются."
 SHL_close_obligation_tt: "Возврат депозита: §Y[?SHL_obligation_deposit|0]§! £ADISCORD_economy_treasury_texticon. К погашению: §Y[?SHL_obligation_liability|0]§! £ADISCORD_economy_treasury_texticon; нехватка станет государственным долгом. Ведомость освобождается."
 SHL_foreclose_furnace: "Передать залог городской кассе"
 SHL_foreclose_furnace_desc: "Городская касса принимает работающую печь вместо оставшегося долга. Дом теряет владение и наследственный голос; производство продолжается. Это выход для регента, которому важнее сохранить казну, чем единство гербов."
 SHL_foreclose_furnace_tt: "Остаток залога списывается. Заложенная печь переходит городу, дом теряет голос. Давление гербов: §R+15§!; недовольство кварталов: §G-8§!."
 SHL_extend_export_tt: "Ещё §Y2§! цикла, только один раз. Окончательная выплата уменьшается до §Y90§! £ADISCORD_economy_treasury_texticon; цена расторжения растёт на §R30§! £ADISCORD_economy_treasury_texticon. Недовольство: §R+8§!."
 SHL_industrial_independence_tt: "Водный и портовый споры урегулированы либо не возникли: сосед больше не может предъявить требования. Работает не менее 6 печей."
 SHL_ledger_idle: "Ведомость свободна: выберите печь для своего курса."
 SHL_ledger_export: "Экспорт: [SHLGetOrderSite]. Плавки [?SHL_obligation_progress|0]/2.\nСрок: цикл [?SHL_obligation_deadline|0]. Сейчас [?SHL_cycle_number|0]."
 SHL_ledger_civic: "Городской заказ: [SHLGetOrderSite]. Плавки [?SHL_obligation_progress|0]/2.\nДепозит: [?SHL_obligation_deposit|0] £ADISCORD_economy_treasury_texticon."
 SHL_ledger_arsenal: "Арсенал: [SHLGetOrderSite]. Партии [?SHL_obligation_progress|0]/2.\nОстаток оплаты: [?SHL_obligation_deposit|0] £ADISCORD_economy_treasury_texticon."
 SHL_ledger_pledge: "Залог: [SHLGetOrderSite].\nК погашению: [?SHL_obligation_liability|0] £ADISCORD_economy_treasury_texticon."
 SHL_ledger_relief: "Помощь: [SHLGetOrderSite] → [SHLGetReliefSite].\nПлавки донора: [?SHL_obligation_progress|0]/2."
 SHL_ledger_overdue: "§RЭкспорт просрочен.§! [SHLGetOrderSite]: [?SHL_obligation_progress|0]/2.\nК погашению: [?SHL_obligation_liability|0] £ADISCORD_economy_treasury_texticon. Решите судьбу договора."
 SHL_ledger_choose: "выберите получателя"
 SHL_panel_ledger: "[SHLGetOrderLedger]"
 ADISCORD_SHL.100.t: "Кому достанется следующая плавка"
 ADISCORD_SHL.100.house: "Посланник Золотых ворот положил на стол кошель раньше, чем писарь закончил читать договор. Домам понравился этот жест: новый порядок говорил на знакомом им языке. Но мастер Арбина попросил назвать печь, которая ответит за обещанный металл. В зале стало тише. Подпись Конклава могла связать всю страну; работать предстояло одной смене.\n\nНур велел завести отдельную ведомость. Аванс можно потратить немедленно, но за три производственных цикла выбранная печь должна выполнить две плавки для покупателя. Её обычная выручка на это время исчезнет из общего счёта. Усиленная смена позволит успеть быстрее, если найдутся сырьё и люди, готовые принять износ.\n\nЭто ещё не десятый голос. Прежде чем товарищество получит наследственный герб, ему придётся доказать, что его подпись означает больше, чем право брать деньги."
 ADISCORD_SHL.100.city: "Городские делегаты принесли в Конклав не герб, а чертёж перехода через сухое русло. Каждую весну здесь теряли телеги, каждое лето жители носили воду в обход обвалившейся кладки. Хозяин ближайшей печи спросил, сколько принесёт новая дорога. Делегат ответил: впервые прибыль не будет единственным условием строительства.\n\nГородской заказ оставляет металл дома. Казна оплачивает работу, а две плавки выбранной печи превращаются в инфраструктуру её района. На это время правительству придётся обойтись без обычной выручки предприятия. Дорога останется даже в случае, если Конклав позднее откажет городам в голосе.\n\nПредставительство ещё предстоит утвердить после первой плавки десятого комплекса. До того города смогут предъявить не обещания, а построенное собственными силами."
 ADISCORD_SHL.100.state: "Начальник охраны положил перед Нуром затвор с трещиной. В реестре он числился исправным: казна оплатила заказ, склад принял ящики, ведомство поставило печать. Никто не записал, какая печь отливала металл и кто проверял последнюю партию.\n\nДирекция начинает с простого требования: у каждого заказа будет конкретное производство. Оплата двух партий останется в ведомости. Первая успешная плавка даст половину оружия, вторая закроет заказ. Пока цех работает на арсенал, его выручка не пополняет казну. Усиленная смена может сделать обе партии сразу; остановившаяся печь не сделает ни одной.\n\nНур пока не получил права распоряжаться всеми домами. Но первая военная ведомость уже заставляет выбирать, чем страна готова поступиться ради исправного оружия."
 ADISCORD_SHL.100.a: "Внести первую печь в ведомость."
 ADISCORD_SHL.101.t: "Пустое место в караване"
 ADISCORD_SHL.101.d: "У ворот стояли телеги покупателя, а в ведомости не хватало оплаченного металла. Писарь мог перечислить причины: сырьё, остановка, закрытая дорога. Купец выслушал всё, после чего снова развернул лист с подписью Конклава. На нём не было оговорки о том, что аванс возвращается только при удобных обстоятельствах.\n\nПервый выход — закрыть договор и рассчитаться по оставшемуся обязательству. Если денег не хватит, задолженность перейдёт в государственный счёт. Второй — просить ещё два цикла. Покупатель согласится лишь один раз, уменьшит окончательный платёж и потребует большей компенсации при повторном срыве. Рабочие уже слышали, что наверху обсуждают новый срок.\n\nПока стороны не договорятся, печь вернётся к обычной продаже своей продукции. Старая подпись при этом никуда не исчезнет."
 ADISCORD_SHL.101.a: "Закрыть договор и рассчитаться."
 ADISCORD_SHL.101.b: "Попросить последнюю отсрочку."
 ADISCORD_SHL.101.c: "Ведомость уже закрыта."
 SHL_renew_golden_offer: "Вернуться к союзу Золотых ворот"
 SHL_renew_southern_offer: "Вернуться к Южному договору"
 SHL_renew_golden_offer_desc: "Партнёрство с Вейром позволяет вновь предложить общий союз. Решение остаётся за его правительством; новый отказ не закрывает будущие переговоры."
 SHL_renew_southern_offer_desc: "Предложить Кейзану войти в Южный договор. Отказ оставляет страну независимой, а через 60 дней переговоры можно возобновить."
 SHL_alliance_offer_free_tt: "Предыдущее предложение союза уже рассмотрено."
 SHL_renew_alliance_offer_tt: "Партнёр получит предложение союза. При согласии он вступит также в текущую оборонительную войну Шахрабада против Мазара."
 SHL_regency_independent_tt: "Не менее 7 действующих голосов домов; действующий залог погашен или урегулирован."
 SHL_renew_veyr_partnership: "Возобновить переговоры с Вейром"
 SHL_renew_veyr_partnership_desc: "Предложить торговое партнёрство повторно. Согласие Вейра после учреждения Конклава десяти также откроет предложение союза. Уже построенная гавань и результаты войны сохраняются."
 SHL_partner_joins_mazar_tt: "Страна вступит в текущую войну против Мазара на стороне Шахрабада."
 SHL_hereditary_seats: "Наследственные места"
 SHL_hereditary_seats_desc: "Девять домов умеют собирать большинство, но каждое решение оплачивается уступками их семьям. Дух снимается при утверждении нового политического устройства."
 SHL_divided_guard: "Девять штабов"
 SHL_divided_guard_desc: "Заводская стража подчиняется владельцам печей. Командиры умеют охранять склады, но ещё не научились вести общую войну. Фокус «Южный дозор» создаст единое командование."
 SHL_external_freight: "Чужие пути снабжения"
 SHL_external_freight_desc: "Вода и выход к морю зависят от соседей. Собственный транспорт и урегулирование обоих соседских споров снимут зависимость."
 SHL_prepared_columns: "Обоз непрерывного огня"
 SHL_prepared_columns_desc: "Две оплаченные плавки стали запасными частями и походным снаряжением. Обоз помогает снабжать армию 90 дней с момента вступления в войну; мир завершает его службу раньше."
 SHL_forced_columns: "Форсированный марш"
 SHL_forced_columns_desc: "Дополнительное сырьё и перегруженные смены обеспечили первые 45 дней наступления. Скорость развёртывания оплачивается повышенным расходом снабжения."
 SHL_house_war_mandate: "Заём девяти гербов"
 SHL_house_war_mandate_desc: "Дома согласны оплатить поход, если государство признает военный долг. Победа позволит обменять занятые цистерны на концессию; оставленные себе земли потребуют собственных вложений."
 SHL_city_war_mandate: "Мандат городских дружин"
 SHL_city_war_mandate_desc: "Города выделят две дружины, но поддержка собраний не безгранична. Их война должна закончиться безопасными дорогами и договором, за который не придётся расплачиваться независимостью соседа."
 SHL_directorate_war_mandate: "План первого удара"
 SHL_directorate_war_mandate_desc: "Дирекция превращает готовый обоз в средство наступления. Дополнительные пакеты сырья дадут преимущество в начале войны, но перенапряжение цехов отзовётся недовольством."
 SHL_regent_war_mandate: "Полки под залог"
 SHL_regent_war_mandate_desc: "Регент способен вооружить две дружины, увеличив обязательство действующей печи. После войны ему предстоит погасить залог или возвращать домам утраченные голоса без списания старых долгов."
 SHL_commune_war_mandate: "Вооружённая смена"
 SHL_commune_war_mandate_desc: "Коммуна передаст дружине собственное оружие и людей. Общее дело снизит недовольство, но каждый выданный ствол исчезнет со склада. После победы помощь соседним общинам тоже потребует настоящих поставок."
 SHL_campaign_logistics: "Две плавки для фронта"
 SHL_campaign_logistics_desc: "Одна печь получит оплаченный походный заказ. Пока она готовит обоз, её металл не продаётся на обычном рынке. Усиленная смена ускорит поставку ценой сырья и износа."
 SHL_no_more_rations: "Последний паёк"
 SHL_no_more_rations_desc: "Шахрабад может сам назначить срок столкновения с Мазаром. Цель похода — удержать обе цистерны и защитить собственный округ, после чего навязать ограниченный мир."
 SHL_peace_has_a_price: "Цена наступившего мира"
 SHL_peace_has_a_price_desc: "Война или расчёт с Мазаром закрывают требование пайка, но не определяют устройство юга. Казна оплатит один проект, смысл которого зависит от победившего политического курса."
 SHL_southern_horizon: "За линией цистерн"
 SHL_southern_horizon_desc: "Итог кампании измеряется тем, что осталось после демобилизации: землёй, договорами, работающими предприятиями и правом распоряжаться огнём."
 SHL_forge_campaign_convoy: "Заказать походный обоз"
 SHL_forge_campaign_convoy_desc: "Выбранная печь отдаст две плавки походному заказу. До завершения её обычная выручка недоступна. Смена власти сохраняет заказ; потеря печи или окончание войны возвращает неиспользованную оплату."
 SHL_demobilise_campaign_convoy: "Разобрать неиспользованный обоз"
 SHL_demobilise_campaign_convoy_desc: "Готовый, но ещё не отправленный обоз можно вернуть на склады в виде оружия. После отправки на фронт это невозможно."
 SHL_march_on_mazar: "Выступить к цистернам"
 SHL_march_on_mazar_desc: "За 28 дней подготовить объявление войны Мазару за два района цистерн. Если угроза исчезнет или Шахрабад вступит в другую войну, подготовка отменяется с возвратом 50 £political_power_texticon."
 SHL_secure_cistern_corridor: "Закрепить коридор цистерн"
 SHL_secure_cistern_corridor_desc: "Удерживать оба района цистерн и свой пограничный округ 14 дней. Потеря любой цели прервёт закрепление. Успех завершает эту войну передачей двух районов Шахрабаду."
 SHL_house_campaign_aid: "Открыть военный заём домов"
 SHL_house_campaign_aid_desc: "Один пакет помощи на текущую кампанию. Дома дадут казне деньги немедленно, но государственный долг вырастет на большую сумму."
 SHL_city_campaign_aid: "Созвать две городские дружины"
 SHL_city_campaign_aid_desc: "Один пакет помощи на кампанию. Города передадут две полностью вооружённые дружины; казна оплачивает оружие, рекруты поступают из общего резерва, а собрания теряют часть поддержки."
 SHL_directorate_campaign_aid: "Форсировать начало похода"
 SHL_directorate_campaign_aid_desc: "Один пакет помощи на кампанию. Готовый обоз и дополнительное сырьё обеспечат усиление на первые 45 дней войны. Недовольство смен возрастёт."
 SHL_regent_campaign_aid: "Увеличить военный залог"
 SHL_regent_campaign_aid_desc: "Один пакет помощи на кампанию. Две дружины вооружаются в счёт действующего залога. Выручка связанной печи продолжит погашать увеличенный долг."
 SHL_commune_campaign_aid: "Выдать оружие сменной дружине"
 SHL_commune_campaign_aid_desc: "Один пакет помощи на кампанию. Дружина получает только оплаченные со складов оружие и людской состав. Общая служба снижает недовольство кварталов."
 SHL_offer_cistern_charter: "Предложить хартию цистерн"
 SHL_offer_cistern_charter_desc: "Вернуть оба занятых района Мазару в обмен на его добровольное вступление в Южный договор. При отказе земля остаётся у Шахрабада; через 60 дней предложение можно повторить."
 SHL_cistern_concession: "Обменять цистерны на концессию"
 SHL_cistern_concession_desc: "Вернуть оба занятых района Мазару и получить стоимость концессионных прав. Действующий залог погашается первым; остаток поступает в казну."
 SHL_reconstruct_south: "Устроить юг: [From.GetName]"
 SHL_reconstruct_south_desc: "Один оплаченный проект на 56 дней. [SHLGetSouthProgramme]\n\nПолучатель построек — текущий владелец выбранного района. Начало войны, смена курса или потеря доступа отменяют проект и возвращают оплату. Другой заказ нельзя открыть, пока первый не завершён."
 SHL_campaign_convoy_tt: "Две плавки выбранной печи → обоз. При вступлении в войну: 90 дней расход снабжения -15%, восстановление организации +8%."
 SHL_demobilise_convoy_tt: "Обоз → §G1500§! £infantry_equipment_texticon. Усиление форсированного марша также отменяется."
 SHL_march_ready_tt: "Мазар независим, угрожает Шахрабаду и не занят другой войной; наша армия ещё не выступила."
