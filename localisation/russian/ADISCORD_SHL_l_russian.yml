 SHL_soup_kitchens: "Общие столовые"
 SHL_soup_kitchens_desc: "Горячая еда у заводских ворот не решает спор о смене, но даёт кварталам причину подождать."
 SHL_soup_kitchens_tt: "Недовольство кварталов: §G-10§!."
 SHL_house_banquet: "Приём гербов"
 SHL_house_banquet_desc: "Нур собирает наследников домов за одним столом, пока их поверенные не собрали подписи против Конклава."
 SHL_house_banquet_tt: "Давление гербов: §G-10§!."
 SHL_shift_mediation: "Переговоры с мастерами"
 SHL_shift_mediation_desc: "Старшие мастера смен знают, какие требования стачечного комитета можно выполнить за неделю."
 SHL_shift_mediation_tt: "Недовольство кварталов: §G-8§!."
 SHL_nur_audience: "Аудиенция у Нура"
 SHL_nur_audience_desc: "Каждый дом получает отдельную встречу и отдельное обещание. Ультиматум слабеет, когда его подписанты перестают доверять друг другу."
 SHL_nur_audience_tt: "Давление гербов: §G-8§!."
 SHL_strike_mission: "Холодная смена"
 SHL_strike_mission_desc: "Стачечный комитет держит печи на минимальном огне. Пока стачка продолжается, каждая работающая печь приносит на §R10§! £ADISCORD_economy_treasury_texticon меньше."
 SHL_strike_goal_tt: "Недовольство кварталов ниже §Y45§!"
 SHL_strike_success_tt: "Стачка закончится. Следующая возможна не раньше чем через 4 цикла."
 SHL_strike_timeout_tt: "§RКомитет потребует власти для советов смен.§!"
 SHL_conspiracy_mission: "Ультиматум гербов"
 SHL_conspiracy_mission_desc: "Девять гербов требуют вернуть им прежние права. Если давление не спадёт, дома попытаются взять Конклав без Нура."
 SHL_conspiracy_goal_tt: "Давление гербов ниже §Y45§!"
 SHL_conspiracy_success_tt: "Ультиматум распадётся. Следующий возможен не раньше чем через 4 цикла."
 SHL_conspiracy_timeout_tt: "§RДома попытаются сместить Нура.§!"
 SHL_raise_furnace_guard: "Набрать заводскую стражу"
 SHL_raise_furnace_guard_desc: "Печи оплачивают винтовки, города дают людей. Через 21 день в Шахрабаде будет сформирована дивизия заводской стражи: 2 пехотных батальона и ополчение."
 SHL_raise_guard_tt: "Через §Y21§! день в Хазаре появится дивизия \"Furnace Levy\". Если столица будет потеряна, цена вернётся полностью."
 SHL_guard_slot_tt: "Прежний набор завершён"
 SHL_war_orders: "Арсенальный заказ: [FROM.GetName]"
 SHL_war_orders_desc: "Выбранная печь перестаёт приносить обычную выручку и производит оружие. Оплачены две партии: каждая реальная плавка поставляет половину заказа. Усиленная смена выпускает обе сразу. Недостаток сырья, оккупация и остановка печи задерживают поставки. При отмене возвращается только цена ещё не изготовленных партий."
 SHL_offer_water_treaty: "Предложить \"воду за металл\""
 SHL_offer_water_treaty_desc: "Общины Кейзана получат металл для своих водоводов, а печи - воду по согласованной квоте."
 SHL_offer_water_treaty_tt: "Кейзан рассмотрит предложение. Если он согласится: §R-100§! £ADISCORD_economy_treasury_texticon сразу и §R-3§! £ADISCORD_economy_treasury_texticon с каждой работающей печи за цикл. Спор о воде закончится."
 SHL_offer_pending_tt: "Нет неотвеченного предложения Кейзану"
 SHL_water_treaty_money_tt: "В казне не меньше §Y100§! £ADISCORD_economy_treasury_texticon"
 SHL_artesian_wells: "Артезианские скважины"
 SHL_artesian_wells_desc: "Бурение глубоких скважин у Арбина, Сафира и Лорана освободит печи от кяризов соседа."
 SHL_artesian_wells_tt: "Через §Y84§! дня спор о воде закончится без квоты. Если к этому времени спор уже закрыт, цена вернётся."
 SHL_project_slot_tt: "Этот проект ещё не оплачен"
 SHL_seize_qanats: "Взять кяризы"
 SHL_seize_qanats_desc: "Охрана водоводов перейдёт границу и займёт головные колодцы Севира, Табара, Нарвана и Ормиса."
 SHL_seize_qanats_tt: "§RШахрабад объявит войну Кейзану§! с целью занять Севир, Табар, Нарван и Ормис. Кейзан получит 3 дивизии стражи кяризов. Через 270 дней без капитуляции наступит перемирие. Нападение даст Кейзану основание вступить на стороне Мазара, пока претензия не урегулирована."
 SHL_seize_qanats_ready_tt: "Спор о воде открыт, Шахрабад и Кейзан не воюют, Кейзан владеет пограничными кяризами"
 SHL_harbour_project: "Гавань Кердана"
 SHL_harbour_project_desc: "Собственные причалы позволят вывозить металл, не платя вейрской торговой палате."
 SHL_harbour_project_tt: "Через §Y90§! дней вейрский сбор перестанет удерживаться из выручки. Если в Кердане есть место, будет построена верфь. Если сбор уже отменён или Кердан потерян, цена вернётся."
 SHL_ultimatum_veyr: "Ультиматум Вейру"
 SHL_ultimatum_veyr_desc: "Если палата не отменит сбор, Шахрабад заберёт рудники Кассена и дорогу через Норан."
 SHL_ultimatum_veyr_tt: "§RШахрабад объявит войну Вейру§! с целью занять Норан и Кассен, а после \"Ключа к морю\" - ещё Тирву и Вейрский округ. Вейр получит 3 дивизии призматической стражи. Через 270 дней без капитуляции наступит перемирие. Нападение даст Вейру основание вступить на стороне Мазара, пока претензия не урегулирована."
 SHL_ultimatum_veyr_ready_tt: "Вейрский сбор действует, Шахрабад и Вейр не воюют, Вейр владеет Нораном или Кассеном"
 SHL_mazar_deadline: "Ультиматум Мазара"
 SHL_mazar_deadline_desc: "Палата общего пайка дала Шахрабаду 60 дней. Затем её отряды войдут в Зарханский округ."
 SHL_mazar_deadline_timeout_tt: "§RМазар объявит войну за Зарханский округ§!, если он не воюет в другом месте. Иначе требование будет отложено на 4 цикла. Согласившийся на пограничный договор сосед вступит на стороне Мазара. [SHLGetMazarFlankStatus]"
 SHL_mazar_last_ration: "Выплатить паёк в последний день"
 SHL_mazar_last_ration_desc: "Поздний платёж дороже, но закрывает требование Мазара навсегда."
 SHL_mazar_last_ration_tt: "Ультиматум будет снят, а требования Мазара закрыты."
 SHL_export_contract: "Подписать экспортный заказ: [FROM.GetName]"
 SHL_export_contract_desc: "Выбранный дом получает аванс за металл двух плавок. На исполнение отводятся три ближайших производственных цикла; усиленная смена выполняет две плавки за один цикл. Сырьё и обслуживание оплачиваются обычно. Выручка этой печи до исполнения уходит в заказ. Оккупация и простой не останавливают срок. При срыве можно один раз продлить договор или вернуть аванс со штрафом."
 SHL_export_furnaces_tt: "Работает не меньше §Y6§! печей"
 SHL_debt_shift: "Заложить доход дома: [FROM.GetName]"
 SHL_debt_shift_desc: "Городская касса выдаёт регентству деньги под будущую выручку выбранного дома. В погашение уходит только фактический доход этой печи после удержаний. Простой задерживает платёж; усиленная смена перечисляет свою настоящую выручку, а не условную двойную выплату. За досрочное закрытие взыскивается остаток обязательства. Закон о долговых сменах позволит передать саму печь городской кассе в счёт долга."
 SHL_debt_shift_tt: "Сразу 150 £ADISCORD_economy_treasury_texticon и +8 недовольства. Новый долг: [?SHL_pledge_price|0] £ADISCORD_economy_treasury_texticon. Выручка печи идёт кредитору; остаток последнего платежа возвращается в казну. Переназначение доступно после погашения или отмены с расчётом долга."
 SHL_common_cauldron: "Назначить печь-донор: [FROM.GetName]"
 SHL_common_cauldron_desc: "Работающая городская печь берёт шефство над другим предприятием. Затем выберите на панели нуждающуюся печь и назначьте её получателем. Пока получатель недоступен, донор сохраняет обычную выручку. Когда помощь возможна, две его плавки уйдут на восстановление получателя. Это цена солидарности: металл нельзя одновременно продать."
 SHL_common_cauldron_tt: "Отдельно выберите другую городскую печь для помощи. Две плавки донора восстанавливают её; при Союзе мастерских нужна одна. Обычной поставки во время заказа нет; затем донор снабжает кварталы."
 # Event answers
 SHL_strike_concede_tt: "§R-150§! £ADISCORD_economy_treasury_texticon. Недовольство кварталов: §G-35§!. Давление гербов: §R+10§!. Гражданская опора: §G+5§!. Стачка закончится."
 SHL_strike_wait_tt: "Начнётся 42-дневная миссия. Пока идёт стачка, каждая печь приносит на §R10§! £ADISCORD_economy_treasury_texticon меньше. Если недовольство не упадёт ниже §Y45§!, комитет потребует власти."
 SHL_strike_suppress_tt: "Недовольство кварталов: §G-25§!. Гражданская опора: §R-10§!. §Y-10%§! $SHL_conclave_balance$. Вторая расправа сразу приведёт к требованию советов смен."
 SHL_commune_course_tt: "Нур уйдёт в отставку. Власть перейдёт Совету смен. Недовольство кварталов: §G-30§!, давление гербов обнулится. §Y+30%§! $SHL_conclave_balance$. Откроется путь \"Рабочая коммуна\"; передачу печей рабочим закрепит фокус \"$SHL_furnaces_to_workers$\". Несовместимые заказы закроются с возвратом неиспользованной оплаты."
 SHL_martial_law_tt: "Недовольство кварталов станет §Y30§!. Давление гербов: §G-10§!. Стачка закончится."
 SHL_conspiracy_guarantees_tt: "Давление гербов -25; недовольство +10; гражданская опора -5. Цена: 40 £political_power_texticon; бесплатно, если большинство голосующих домов получило плавку в прошлом цикле."
 SHL_conspiracy_wait_tt: "Начнётся 42-дневная миссия. Если давление гербов не упадёт ниже §Y45§!, дома попытаются сместить Нура."
 SHL_conspiracy_arrests_tt: "Давление гербов: §G-30§!. Недовольство кварталов: §G-5§!. Печи Нурана и Вейрана, если ими владеют дома, перейдут дирекции."
 SHL_regency_course_tt: "§YНур уйдёт в отставку. Регентом станет Дарий Сафир.§! Давление гербов: §G-30§!. Недовольство кварталов: §R+15§!. §Y-30%§! $SHL_conclave_balance$. Откроется путь \"Регентство домов\"."
 SHL_resist_crests_tt: "Давление гербов станет §Y40§!. Нур сохранит власть."
 SHL_accident_site_tt: "§RАварийная печь погаснет, а её цеха будут повреждены.§!"
 SHL_accident_house_tt: "Давление гербов: §R+10§!. Гражданская опора: §G+5§!. Недовольство кварталов: §G-10§!."
 SHL_accident_masters_tt: "Недовольство кварталов: §R+15§!. Давление гербов: §G-5§!."
 SHL_accident_commission_tt: "Недовольство кварталов: §G-5§!. Давление гербов: §R+5§!. Смена этой печи будет считаться обученной."
 SHL_water_crisis_tt: "Пока спор не решён, Арбин, Сафир и Лоран получают §R+4§! износа за цикл. Решения появятся в категории \"Кварталы и границы\"."
 SHL_kyz_accepts_treaty_tt: "Шахрабад заплатит 100 и будет отдавать металл по квоте; печи получат воду."
 SHL_kyz_refuses_tt: "Шахрабад получит отказ."
 SHL_kyz_accepts_brotherhood_tt: "Спор о воде закончится без квоты."
 SHL_armistice_tt: "Стороны заключат белый мир. Земля останется у прежних владельцев."
 SHL_veyr_crisis_tt: "Пока сбор действует, каждая работающая печь приносит на §R5§! £ADISCORD_economy_treasury_texticon меньше."
 SHL_glp_accepts_union_tt: "Вейр отменит сбор и станет торговым партнёром Шахрабада."
 SHL_glp_refuses_tt: "Шахрабад получит отказ."
 SHL_mazar_pay_first_tt: "§R-250§! £ADISCORD_economy_treasury_texticon, §R-30§! £political_power_texticon. Мазар вернётся с новым требованием через 10 циклов."
 SHL_mazar_refuse_tt: "Начнётся 60-дневный ультиматум. Затем Мазар объявит войну за Зарханский округ. Во время отсрочки можно набрать стражу или выплатить паёк по высокой цене. Мазар может пригласить одного соседа, ранее атакованного Шахрабадом. Мы получим предупреждение и возможность предложить нейтралитет до войны."
 SHL_mazar_pay_final_tt: "§R-400§! £ADISCORD_economy_treasury_texticon. Требования Мазара будут закрыты."
 SHL_partner_joins_tt: "Страна вступит в союз Шахрабада."
 # Focus rewards
 SHL_quarter_listening_tt: "Недовольство кварталов: §G-10§!."
 SHL_heralds_table_tt: "Давление гербов: §G-10§!."
 SHL_shift_arbitration_tt: "Каждый цикл недовольство кварталов снижается ещё на §G1§!."
 SHL_water_question_tt: "Спор о воде с Кейзаном начнётся сейчас, если ещё не начался."
 SHL_veyr_duties_tt: "Спор о вейрском сборе начнётся сейчас, если ещё не начался."
 SHL_golden_gate_cartel_tt: "Вместимость казны: §G+5%§!."
 SHL_house_guards_tt: "Дома оплатят §Y2§! дивизии заводской стражи в Шахрабаде. Давление гербов: §G-15§!."
 SHL_veyr_partner_available_tt: "Вейр существует, не воюет с Шахрабадом и не рассматривает другое предложение"
 SHL_veyr_partnership_tt: "Вейр получит предложение торгового союза. Если он согласится, сбор будет отменён."
 SHL_golden_gate_offer_tt: "Вейр получит приглашение в союз Золотых ворот."
 SHL_council_of_cities_tt: "Недовольство кварталов: §G-20§!. Гражданская опора: §G+10§!."
 SHL_kyz_brotherhood_available_tt: "Кейзан существует, не воюет с Шахрабадом и не рассматривает другое предложение"
 SHL_kyz_brotherhood_offer_tt: "Кейзан получит предложение братства кяризов. Если он согласится, спор о воде закончится без квоты."
 SHL_workers_brigades_tt: "Города выставят §Y2§! дивизии заводской стражи в Шахрабаде. Недовольство кварталов: §G-5§!."
 SHL_southern_compact_offer_tt: "Кейзан получит приглашение в Южный договор."
 SHL_key_to_sea_tt: "Ультиматум Вейру будет включать Тирву и Вейрский округ."
 SHL_restore_privileges_tt: "Все печи Шахрабада вернутся домам; погасшие будут готовы к оплаченному запуску. Давление гербов: §G-20§!. Недовольство кварталов: §R+10§!."
 SHL_private_armies_tt: "Дома выставят §Y3§! дивизии заводской стражи в Шахрабаде. Недовольство кварталов: §R+5§!."
 SHL_hereditary_republic_tt: "Давление гербов: §G-20§!."
 SHL_furnaces_to_workers_tt: "Все печи Шахрабада перейдут городам; погасшие будут готовы к оплаченному запуску. Недовольство кварталов: §G-20§!. Гражданская опора: §G+15§!."
 SHL_common_smelting_tt: "Усиленная смена больше не увеличивает недовольство кварталов."
 # Focuses
 SHL_quarter_listening: "Слушать кварталы"
 SHL_quarter_listening_desc: "В рабочих кварталах о печах знают больше, чем в залах Конклава. Нур открывает приёмную для делегатов смен, пока их жалобы не превратились в требования."
 SHL_heralds_table: "Стол гербов"
 SHL_heralds_table_desc: "Дома привыкли решать споры за закрытыми дверями. Общий стол гербов делает их обиды видимыми и позволяет гасить их раньше ультиматума."
 SHL_shift_arbitration: "Сменный арбитраж"
 SHL_shift_arbitration_desc: "Постоянная комиссия мастеров и управляющих разбирает споры о сменах до того, как они выходят за ворота завода."
 SHL_factory_militia: "Заводская стража"
 SHL_factory_militia_desc: "Охрана станций может стать ядром армии, если печи возьмут на себя оплату винтовок, а города дадут людей."
 SHL_southern_watch: "Южная стража"
 SHL_southern_watch_desc: "Палата общего пайка Мазара считает чужой металл общим пайком. Зарханский округ должен встретить её отряды подготовленными позициями."
 SHL_mobilise_furnaces: "Мобилизация печей"
 SHL_mobilise_furnaces_desc: "Каждая печь получает военный заказ, который можно выполнить без остановки гражданской смены."
 SHL_water_question: "Водный вопрос"
 SHL_water_question_desc: "Печи Арбина, Сафира и Лорана пьют воду кяризов Кейзана. Мы начнём разговор о воде сами, пока общины не начали его перекрытием водоводов."
 SHL_qanat_guard: "Охрана водоводов"
 SHL_qanat_guard_desc: "Если переговоры не дадут воды, головные колодцы на границе придётся взять под охрану Шахрабада."
 SHL_veyr_duties: "Вейрские пошлины"
 SHL_veyr_duties_desc: "Торговая палата Вейра берёт сбор с каждого вагона металла, идущего к морю. Мы откроем этот спор и подготовим собственную гавань."
 SHL_veyr_ultimatum: "Ультиматум палате"
 SHL_veyr_ultimatum_desc: "Рудники Кассена и дорога через Норан дают Вейру власть над нашей выручкой. Если палата не уступит, Шахрабад заберёт их."
 SHL_golden_gate_cartel: "Картель Золотых ворот"
 SHL_golden_gate_cartel_desc: "Десять домов договариваются о единых ценах на вывоз. Конклав становится не только собранием владельцев, но и общей торговой конторой."
 SHL_house_guards: "Гвардии домов"
 SHL_house_guards_desc: "Каждый дом выставляет охрану своих печей. Под общим командованием эти отряды станут армией, которую оплачивают сами владельцы."
 SHL_veyr_partnership: "Торговый союз с Вейром"
 SHL_veyr_partnership_desc: "Вейру нужен наш металл так же, как нам его причалы. Картель предложит палате долю в вывозе вместо сбора."
 SHL_conclave_of_ten: "Конклав десяти"
 SHL_conclave_of_ten_desc: "Десятый дом занял своё кресло, картель торгует от имени всех, а Золотые ворота открыты партнёрам, готовым защищать общий рынок."
 SHL_council_of_cities: "Совет городов"
 SHL_council_of_cities_desc: "Самостоятельные города получают постоянный совет рядом с Конклавом. Кварталы впервые видят своих представителей в зале решений."
 SHL_fire_and_water: "Огонь и вода"
 SHL_fire_and_water_desc: "Общины Кейзана и города Шахрабада управляются собраниями. Мы предложим делить воду и металл по общему договору без квоты и без силы."
 SHL_workers_brigades: "Рабочие дружины"
 SHL_workers_brigades_desc: "Города сами набирают дружины из смен. Их оружие куплено выручкой печей, а командиров выбирают цеха."
 SHL_southern_compact: "Южный договор"
 SHL_southern_compact_desc: "Открытый Конклав и союз арычных общин могут защищать друг друга от Палаты общего пайка, если согласятся на общий договор."
 SHL_war_directorate: "Военная дирекция"
 SHL_war_directorate_desc: "Дирекция Нура распоряжается печами как единым арсеналом. Первая государственная линия выпуска станет оружейной."
 SHL_right_to_water: "Право на воду"
 SHL_right_to_water_desc: "Государственным печам нужна гарантированная вода. Дирекция объявляет головные кяризы границы частью промышленной системы Шахрабада."
 SHL_key_to_sea: "Ключ к морю"
 SHL_key_to_sea_desc: "Без Тирвы и Вейрского округа любой договор с палатой можно отменить одним сбором. Дирекция требует всей дороги к морю."
 SHL_iron_shahrabad: "Железный Шахрабад"
 SHL_iron_shahrabad_desc: "Печи больше не должны останавливаться из-за чужого решения о воде или причалах. Дирекция отвечает за действующее снабжение - обеспеченное договором, собственной стройкой или военной победой. Её силу измеряют работающие цеха и оружие на складе."
 SHL_regency_council: "Регентский совет"
 SHL_regency_council_desc: "Дарий Сафир правит от имени девяти гербов. Первые решения регентства должны показать, что дома едины."
 SHL_restore_privileges: "Возврат привилегий"
 SHL_restore_privileges_desc: "Все главные печи возвращаются наследственным домам. Городские комиссии распускаются, а погасшие предприятия переходят к прежним владельцам."
 SHL_private_armies: "Частные гвардии"
 SHL_private_armies_desc: "Дома больше не просят казну об охране. Каждая семья содержит собственный отряд, а регент сводит их в общий строй."
 SHL_debt_shifts: "Долговые смены"
 SHL_debt_shifts_desc: "Регентство оплачивает свои обещания будущими сменами рабочих кварталов."
 SHL_hereditary_republic: "Наследственная республика"
 SHL_hereditary_republic_desc: "Конклав становится республикой гербов: закон непрерывного огня защищает не город, а право домов на него."
 SHL_shift_councils: "Советы смен"
 SHL_shift_councils_desc: "Стачечные комитеты становятся властью. Каждая печь выбирает делегатов, а Совет смен заменяет Конклав."
 SHL_furnaces_to_workers: "Печи - рабочим"
 SHL_furnaces_to_workers_desc: "Наследственные права отменены. Каждая главная печь принадлежит городу, чьи люди держат её огонь."
 SHL_common_smelting: "Общая плавка"
 SHL_common_smelting_desc: "Смены сами решают, когда работать сверх нормы. Усиленная плавка больше не означает чужой приказ."
 SHL_qanat_brotherhood: "Братство кяризов"
 SHL_qanat_brotherhood_desc: "Коммуна огня протягивает руку союзу арычных общин: вода и металл должны принадлежать тем, кто их добывает."
 SHL_commune_of_fire: "Коммуна огня"
 SHL_commune_of_fire_desc: "Шахрабад без гербов и без регента. Печи горят для городов, а оборона держится на выборных дружинах и союзниках."
 # Spirits
 SHL_martial_law: "Военное положение"
 SHL_martial_law_desc: "Заводская охрана патрулирует кварталы. Смены выходят на работу, но Конклав теряет доверие."
 SHL_broken_conclave: "Расколотый Конклав"
 SHL_broken_conclave_desc: "Нур удержал власть, но половина гербов отказывается подписывать его решения."
 SHL_captured_qanats: "Захваченные кяризы"
 SHL_captured_qanats_desc: "Головные колодцы границы работают на печи Шахрабада. Общины Кейзана помнят, как их отняли."
 SHL_veyr_bondage: "Вейрская кабала"
 SHL_veyr_bondage_desc: "Поражение в порту заставило Шахрабад платить палате Вейра по её расценкам."
 SHL_mazar_ration: "Паёк Мазара"
 SHL_mazar_ration_desc: "Палата общего пайка забрала часть казны и требует металл для своих распорядителей."
 SHL_victory_over_ration: "Победа над пайком"
 SHL_victory_over_ration_desc: "Отряды Мазара отступили за свою границу, а Шахрабад получил земли Ресана и Далира."
 # Characters, traits, parties, alliances
 SHL_Darius_Safir: "Дарий Сафир"
 SHL_Darius_Safir_desc: "Глава дома Сафир и самый богатый из девяти гербов. Он называет регентство временным, но первым делом вернул домам все печи."
 SHL_Shift_Councils: "Совет смен"
 SHL_Shift_Councils_desc: "Выборные делегаты всех главных печей. Совет не имеет постоянного председателя; его решения подписывает дежурный мастер."
 SHL_regent_of_the_crests: "Регент гербов"
 SHL_regent_of_the_crests_desc: "Правит от имени домов и в их интересах."
 SHL_voice_of_the_shifts: "Голос смен"
 SHL_voice_of_the_shifts_desc: "Власть, которую можно отозвать на следующем собрании цеха."
 SHL_anarchism: "Коммуна Шахрабада"
 SHL_anarchism_DEF: "Коммуна Шахрабада"
 SHL_anarchism_party: "£GFX_generic_anarchism_artel_union_party_texticon Советы смен"
 SHL_southern_compact_faction: "Южный договор"
 SHL_golden_gate_faction: "Союз Золотых ворот"
 # Events
 ADISCORD_SHL.20.t: "Холодная смена"
 ADISCORD_SHL.20.d: "Утренний гудок прозвучал над пустыми проходными. Смены пришли к воротам, но не вошли в цеха. Стачечный комитет оставил у каждой из девяти печей по одному кочегару, чтобы кладка не остыла, и вывесил список требований на воротах Конклава в Хазаре. Первой остановилась печь Шарима - там смены самые тяжёлые, и журнал Салимы Дарзи давно считал сверхурочные часы, которые дом не оплачивал.\n\nТребования просты: оплата сверхурочных, свободные дни после усиленных смен и право знать, куда уходит выручка. Ширин Шарим требует прислать стражу и называет стачку грабежом; Бехруз Вейран предлагает свои гвардии. Хосров Арбин и Камран Нур просят не торопиться: кочегары у печей - те же люди, что завтра должны поднять огонь. Арман Теймур напоминает, что охрана железной дороги умеет держать ворота, а не плавить металл.\n\nПока огонь держат на минимуме, каждая печь выдаёт меньше металла, и Лейла Надири ежедневно пересчитывает убыток. Казна может оплатить требования, Конклав может ждать и вести переговоры, а стража - открыть ворота силой."
 ADISCORD_SHL.20.a: "Оплатить требования из казны."
 ADISCORD_SHL.20.b: "Ждать и вести переговоры."
 ADISCORD_SHL.20.c: "Прислать охрану железной дороги."
 ADISCORD_SHL.21.t: "Советы смен требуют власти"
 ADISCORD_SHL.21.d: "Стачка перестала быть спором о деньгах. Комитеты всех главных печей собрались в литейном цеху Шарима и объявили себя Советом смен. Их решение подписала дежурный мастер Салима Дарзи. Они не просят отставки Джалиля Нура: они сообщают, что Конклав больше не нужен. Печи держат те, кто стоит у огня; гербы над креслами - только память о том, чьи деды их разожгли.\n\nГородские собрания Мариам Арбин поддержали советы, хотя сама она не подписала их воззвания. Дома готовят ответ: Бехруз Вейран стягивает гвардии к Хазару, Дарий Сафир обещает оплатить любую стражу, Ширин Шарим требует вернуть её печь силой. Арман Теймур доложил, что общегосударственная стража удержит столицу, но не удержит девять заводских городов разом.\n\nУ Нура осталось два ответа. Признать советы - значит отдать печи тем, кто держит их огонь, и закончить Конклав девяти домов. Военное положение сохранит Конклав, но стоить это будет доверия кварталов, которые сегодня стоят у ворот."
 ADISCORD_SHL.21.a: "Признать Совет смен."
 ADISCORD_SHL.21.b: "Объявить военное положение."
 ADISCORD_SHL.22.t: "Смена вернулась"
 ADISCORD_SHL.22.d: "Кочегары снова подняли огонь до рабочей температуры. Первой заработала печь Шарима, последней - Вейрана, где гвардии дома до последнего стояли у ворот. Комитет не распущен: его делегаты вернулись к печам, а список требований сняли с ворот Конклава, но Салима Дарзи унесла рабочий журнал с собой, и в нём записано, кто и что обещал.\n\nВ ведомости следующего цикла Лейла Надири впервые отдельной строкой указала, сколько смен было оплачено сверх нормы. Ширин Шарим отказалась подписывать эту страницу; Хосров Арбин и Камран Нур подписали. Голшан Лоран подсчитал, сколько экспортных партий Шахрабад потерял за дни холодной смены, и положил расчёт рядом.\n\nАмин Рашад закрыл дело в архиве Конклава, но не убрал папку далеко. Кварталы узнали, что печи можно остановить, не разрушая; дома узнали, что без кочегаров герб над креслом - только рисунок. Обе стороны будут помнить это дольше, чем оплату сверхурочных."
 ADISCORD_SHL.22.a: "Печи снова работают."
 ADISCORD_SHL.30.t: "Ультиматум гербов"
 ADISCORD_SHL.30.d: "Поверенные девяти домов принесли в Конклав общее письмо. Они требуют вернуть наследственные права, отменить городские комиссии и подтвердить, что ни одна печь не перейдёт государству без согласия её дома. Первой стоит подпись Дария Сафира; за ней - Голшана Лорана, Ширин Шарим и Бехруза Вейрана. Ниже, мельче, подписались Байрат, Кердан и Арбин. Даже Камран Нур поставил имя малого дома, хотя посредник сидит в том же зале.\n\nПодписи, которые обычно не встречаются рядом, означают одно: дома договорились между собой раньше, чем с Конклавом. У Сафира есть казна, у Вейрана - гвардии, у Лорана - покупатели за Золотыми воротами, которым всё равно, кто подписывает накладные. Если гербы правят вместе, посредник им не нужен.\n\nАмин Рашад прочитал письмо вслух и положил печать рядом. Бахрам Каве доложил, что гвардии Вейрана уже получили приказ о сборе. Джалиль Нур может дать домам гарантии, выдержать давление и ждать, пока союз гербов распадётся, или арестовать зачинщиков - если дирекция готова к последствиям."
 ADISCORD_SHL.30.a: "Дать гарантии домам."
 ADISCORD_SHL.30.b: "Выдержать давление."
 ADISCORD_SHL.30.c: "Арестовать зачинщиков."
 ADISCORD_SHL.31.t: "Ночь гербов"
 ADISCORD_SHL.31.d: "Ночью гвардии Бехруза Вейрана заняли мосты через сухое русло и телеграф Хазара. Люди Ширин Шарим выставили посты у печного округа, а казна Сафира оплатила каждому караулу двойное жалованье вперёд. К утру ни один приказ посредника не вышел за пределы зала Конклава.\n\nДарий Сафир пришёл в зал с решением девяти гербов: Джалиль Нур остаётся посредником по имени, а Совет гербов во главе с регентом принимает власть над печами, казной и стражей. Голшан Лоран держал в руках готовый акт; Рауф Дарбан и Хосров Арбин стояли позади, не глядя на кресло. Амин Рашад не отдал печать и не спрятал её: он ждал слова Нура.\n\nАрман Теймур доложил, что часть городской стражи ещё верна посреднику и готова удержать площадь. Мариам Арбин прислала из собраний короткую записку: города выйдут, если их позовут. Сопротивление сохранит Конклав, но расколет его надолго. Уступка отдаст Шахрабад регентству, которое называет себя временной мерой."
 ADISCORD_SHL.31.a: "Уступить регентству."
 ADISCORD_SHL.31.b: "Сопротивляться."
 ADISCORD_SHL.32.t: "Письмо без подписей"
 ADISCORD_SHL.32.d: "Общий ультиматум распался. Каждый дом получил отдельное обещание, и уже через неделю поверенные спорили друг с другом громче, чем с посредником. Тахмурас Байрат получил гарантии по рудным договорам и первым отозвал подпись. Ферейдун Кердан добился, чтобы дорога к морю осталась в ведении дома, и ушёл следом. Камран Нур объяснил Конклаву, что малый дом подписывал письмо только ради единства гербов, а раз единства нет, нет и подписи.\n\nДарий Сафир и Ширин Шарим держались дольше всех, но Голшан Лоран уже торговал с Хазаром от своего имени, а гвардии Бехруза Вейрана вернулись к границе: Бахрам Каве доложил, что сборы Мазара беспокоят дом больше городских комиссий.\n\nПисьмо осталось в архиве Конклава без новых подписей. Амин Рашад подшил его к делу и отметил дату: гербы разошлись, но каждый унёс с собой обещание, которое Конклаву предстоит исполнять."
 ADISCORD_SHL.32.a: "Гербы разошлись."
 ADISCORD_SHL.40.t: "Авария на главной печи"
 ADISCORD_SHL.40.d: "Изношенная кладка не выдержала очередной плавки. Металл прорвался в литейный пролёт, залил желоба и подъездные пути; людей удалось вывести, но печь придётся гасить, а цеха вокруг неё - восстанавливать. Самира Хади увезла обожжённых в лазарет при печи и в городскую больницу, не спрашивая, в каком реестре они числятся.\n\nДом утверждает, что мастера работали сверх нормы и перегрели печь ради усиленной смены. Мастера говорят, что дом годами откладывал ремонт и подписывал ведомости с заниженным износом. Лейла Надири подняла промышленную ведомость Конклава: записи о состоянии кладки есть, но подпись дома и подпись мастера стоят под разными цифрами. Арман Теймур поставил караул у развалин, чтобы никто не вынес ни улик, ни металла.\n\nГород ждёт, кого Конклав назовёт виновным. Обвинить дом - значит поддержать кварталы против герба. Обвинить мастеров - значит поддержать герб против тех, кто завтра встанет к огню. Комиссия займёт время и политический вес, но даст ответ, который подпишут обе стороны."
 ADISCORD_SHL.40.a: "Виноват дом."
 ADISCORD_SHL.40.b: "Виноваты мастера."
 ADISCORD_SHL.40.c: "Назначить комиссию."
 ADISCORD_SHL.50.t: "Кяризы пересыхают"
 ADISCORD_SHL.50.d: "Общины Кейзана закрыли боковые отводы кяризов, питавшие печи Арбина, Сафира и Лорана. Хосров Арбин узнал об этом первым: его охладительные каналы обмелели за одну ночь, и мастера западной печи начали считать часы до перегрева кладки. Собрание арычных общин прислало в Хазар письмо без угроз: печи Шахрабада пьют воду, которой общины поливают поля, и за это никто не платит.\n\nДарий Сафир требует от Конклава немедленных мер - его печь стоит на той же воде. Голшан Лоран предлагает заплатить металлом: у общин нет своих водоводов, а у Лорана есть прокат. Бехруз Вейран говорит о головных колодцах, которые можно занять за несколько дней. Рамин Фарзан напоминает, что Кейзан - не одно правительство, а собрание, и договор с ним нужно вести так, чтобы его признали все общины.\n\nБез охлаждения кладка стареет быстрее, и три печи из девяти ждут решения. Можно договориться о квоте, пробурить собственные артезианские скважины или взять головные колодцы силой."
 ADISCORD_SHL.50.a: "Спор о воде нужно решить."
 ADISCORD_SHL.52.t: "Шахрабад предлагает воду за металл"
 ADISCORD_SHL.52.d: "Посланники Конклава Шахрабада прибыли к собранию арычных общин с предложением, которое подписали три дома, пьющие воду кяризов: Хосров Арбин, Дарий Сафир и Голшан Лоран. Шахрабад предлагает металл для водоводов - трубы, задвижки и прокат из печей Лорана - и регулярную долю выручки трёх печей, записанную в промышленную ведомость Конклава, а не в частные обещания домов.\n\nВзамен Шахрабад просит открыть боковые отводы кяризов для Арбина, Сафира и Лорана в прежнем объёме. Рамин Фарзан, говоривший от имени Хазара, подчеркнул, что головные колодцы остаются у общин и что никаких стражников на водоводах Конклав не предлагает: квота - это договор, а не оккупация.\n\nСобрание слушало долго. Металл нужен каждой общине, но вода, отданная печам, не вернётся на поля. Старейшины спрашивают, что будет с квотой, когда в Хазаре сменится власть, и кто ответит, если дома сочтут долю выручки слишком щедрой. Ответ Кейзана определит, пойдёт ли вода к печам по договору или по другому пути."
 ADISCORD_SHL.52.a: "Принять договор."
 ADISCORD_SHL.52.b: "Отказать."
 ADISCORD_SHL.53.t: "Кейзан согласился"
 ADISCORD_SHL.53.d: "Собрание арычных общин приняло предложение Шахрабада. Отводы кяризов снова открыты, и печи Арбина, Сафира и Лорана получают воду в прежнем объёме. Первые трубы из проката Лорана уже ушли к головным колодцам, а Лейла Надири внесла долю выручки трёх печей отдельной строкой в промышленную ведомость Конклава.\n\nХосров Арбин приехал в Хазар впервые за много месяцев и подписал договор лично: западная печь дома была ближе всех к перегреву. Дарий Сафир подписал через поверенного, а Голшан Лоран - с оговоркой, что металл для водоводов Кейзана засчитывается в счёт экспортных обязательств дома. Рамин Фарзан принял оговорку, но потребовал внести её в текст, чтобы общины не узнали о ней позже.\n\nСпор о воде закрыт договором. Старейшины общин сохранили колодцы, Конклав - печи, и ни одному стражнику не пришлось выходить к кяризам. Что будет с квотой, если власть в Хазаре сменится, предстоит выяснить тем, кто её сменит."
 ADISCORD_SHL.53.a: "Вода вернулась."
 ADISCORD_SHL.54.t: "Кейзан отказал"
 ADISCORD_SHL.54.d: "Собрание арычных общин не приняло предложение Шахрабада, либо договор нельзя выполнить: в казне не хватает обещанной доли, или стороны уже воюют. Рамин Фарзан вернулся в Хазар с письмом, в котором старейшины благодарят за металл и отказываются от квоты: вода, отданная печам, не вернётся на поля, а обещания домов общины помнят с прежних лет.\n\nХосров Арбин принял отказ тяжелее всех. Его западная печь первой почувствует нехватку охлаждения, и дом уже обсуждает, не купить ли воду у общин напрямую, минуя Конклав. Дарий Сафир требует от посредника иного решения и готов оплатить его из своей казны. Бехруз Вейран напоминает, что головные колодцы охраняют крестьяне с ружьями, а не армия.\n\nСпор о воде остаётся открытым. Конклав может пробурить собственные артезианские скважины, вернуться к переговорам позже или взять колодцы силой в ограниченной войне. Каждый путь стоит денег, времени или крови, и три печи из девяти ждут, какой из них выберет Хазар."
 ADISCORD_SHL.54.a: "Искать другой путь."
 ADISCORD_SHL.55.t: "Братство кяризов"
 ADISCORD_SHL.55.d: "Делегаты Шахрабада приехали к собранию арычных общин не от домов, а от городов и советов смен. Их письмо подписали Мариам Арбин от городских собраний и Салима Дарзи от советов смен; ни одного герба под ним нет. Шахрабад предлагает общинам общий договор: воду и металл делят собрания, без квот, без доли выручки и без стражников на колодцах.\n\nБратство кяризов означает, что печи Арбина, Сафира и Лорана получат воду как участники общего дела, а общины - металл для водоводов и место за одним столом с кварталами Шахрабада. Хосров Арбин, чья печь первой страдает от закрытых отводов, не подписывал письма, но дочь говорит от его города.\n\nСтарейшины общин помнят прежние обещания домов и спрашивают, устоит ли братство, если в Хазаре снова возьмут верх гербы. Делегаты отвечают честно: это зависит и от Кейзана. Если договор будет принят, спор о воде закончится не квотой, а общим правом на неё."
 ADISCORD_SHL.55.a: "Принять братство."
 ADISCORD_SHL.55.b: "Отказать."
 ADISCORD_SHL.56.t: "Перемирие у водоводов"
 ADISCORD_SHL.56.d: "Бои за головные колодцы затянулись. Отряды Шахрабада заняли подступы к кяризам, но общины ушли в поля и ночами разбирали то, что днём чинили сапёры Конклава; Бехруз Вейран потерял у водоводов больше людей, чем обещал Конклаву. Хосров Арбин, ради печи которого начиналась война, первым сказал вслух, что воды от этого не прибавилось.\n\nСтарейшины общин предлагают перемирие на прежней границе. Рамин Фарзан привёз их условия в Хазар: стороны отводят отряды, колодцы остаются у общин, отводы кяризов - закрытыми. Арман Теймур докладывает, что стража устала, а Лейла Надири - что каждый день войны стоит казне больше, чем любая квота.\n\nДарий Сафир и Голшан Лоран требуют продолжать, но их печи стоят на той же воде, что и печь Арбина, и доводы иссякают вместе с ней. Спор о воде остаётся нерешённым. Перемирие даст печам время, но не даст им охлаждения."
 ADISCORD_SHL.56.a: "Согласиться на перемирие."
 ADISCORD_SHL.57.t: "Кяризы под охраной Шахрабада"
 ADISCORD_SHL.57.d: "Общины Кейзана признали поражение. Севир, Табар, Нарван и Ормис переходят под власть Шахрабада, а головные колодцы кяризов охраняют заводские стражники Конклава. Отводы к печам Арбина, Сафира и Лорана открыты полностью, и впервые за много лет западная печь Хосрова Арбина работает без расчёта часов до перегрева.\n\nБехруз Вейран привёл гвардии дома обратно к границе и потребовал записать в ведомость, сколько они стоили. Голшан Лоран уже отправил прокат на водоводы занятых общин: металл, который раньше предлагали за квоту, теперь идёт в счёт восстановления. Самира Хади просит открыть лазареты в Табаре и Нарване для раненых обеих сторон. Рамин Фарзан предупреждает, что собрание общин не распущено, а лишь ушло из занятых посёлков дальше на запад.\n\nВода принадлежит печам. Старейшины помнят, что кяризы веками чинили их руки, а не руки стражников, и Конклаву предстоит узнать, сколько стоит охранять воду, которую никто не хочет отдавать."
 ADISCORD_SHL.57.a: "Вода принадлежит печам."
 ADISCORD_SHL.58.t: "Поражение у водоводов"
 ADISCORD_SHL.58.d: "Шахрабад не удержал фронт. Отряды общин, которых в Хазаре считали крестьянами с ружьями, обошли посты Вейрана по старым руслам кяризов и заняли Арбин. Западная печь Хосрова Арбина стоит под охраной тех, кто перекрыл ей воду; сам глава дома уехал в Хазар и впервые сидит в зале Конклава без права голоса - печь погасла, а с ней и герб.\n\nСтарейшины выставили условие: остальные печи получат воду только по квоте, которую назначит собрание. Дарий Сафир и Голшан Лоран подписали его первыми - их печи ждать не могут. Бехруз Вейран отказался и увёл гвардии дома к своей границе. Арман Теймур доложил, что стража не в состоянии вернуть Арбин без новой войны, а Лейла Надири - что казна её не выдержит.\n\nМариам Арбин вернулась в город отца с делегацией собраний: общины готовы говорить с городами, но не с гербами. Конклав принимает условия. Вода пойдёт к печам, но решать, сколько её будет, теперь станет Кейзан."
 ADISCORD_SHL.58.a: "Принять условия."
 ADISCORD_SHL.60.t: "Вейрский сбор"
 ADISCORD_SHL.60.d: "Торговая палата Вейра объявила новый сбор с металла, идущего через её стеклянные порты. Каждый вагон с проката теперь проходит через весы палаты, и Ферейдун Кердан, чья дорога к морю везёт этот металл, получил тариф раньше, чем Конклав - уведомление. Бехруз Вейран, чьи земли граничат с портами, добавил, что сборщики палаты стоят уже на его разъездах.\n\nСбор невелик для одной партии, но он уменьшает выручку каждой из девяти печей. Голшан Лоран подсчитал, сколько потеряют экспортные договоры Золотых ворот за год, и потребовал ответа. Дарий Сафир предлагает выкупить сбор долей в вывозе - палата торгует, а не воюет. Рауф Дарбан напоминает о собственной гавани: дорого, долго, но навсегда. Бехруз Вейран говорит о ключе к морю, который можно взять силой.\n\nРамин Фарзан просит Конклав выбрать один путь, прежде чем палата решит, что Шахрабад готов платить. Сбор можно обойти собственной гаванью, отменить договором или снять силой."
 ADISCORD_SHL.60.a: "Нужно решить вопрос со сбором."
 ADISCORD_SHL.61.t: "Шахрабад предлагает торговый союз"
 ADISCORD_SHL.61.d: "Картель Золотых ворот предлагает Торговой палате Вейра долю в вывозе шахрабадского металла вместо сбора. Предложение привёз Рамин Фарзан, но составлял его Голшан Лоран, а подписали Ферейдун Кердан, по чьей дороге идёт металл, и Дарий Сафир, чья казна гарантирует выплаты. Порты получат постоянный грузопоток и место за столом картеля; Шахрабад - свободный путь к морю без весов палаты на каждом вагоне.\n\nПалата знает, что девять печей не могут возить металл иначе, чем через её порты, и потому сбор был оправдан. Но знает и то, что Конклав обсуждал собственную гавань и что гвардии Бехруза Вейрана стоят у границы портов. Доля в вывозе - это доход без риска; сбор - доход с риском войны или потери грузопотока.\n\nЧлены палаты спорят, можно ли доверять картелю, в котором одни дома торгуют, а другие держат гвардии. Ответ Вейра определит, пойдёт ли металл к морю по договору или по другой дороге."
 ADISCORD_SHL.61.a: "Принять союз."
 ADISCORD_SHL.61.b: "Отказать."
 ADISCORD_SHL.62.t: "Вейр принял союз"
 ADISCORD_SHL.62.d: "Торговая палата Вейра отменила сбор для металла Шахрабада. Весы палаты убрали с разъездов, а её поверенные теперь сидят за столом картеля Золотых ворот рядом с Голшаном Лораном и Дарием Сафиром. Ферейдун Кердан получил то, за что его дом годами платил из своей казны: дорога к морю открыта по договору, а не по тарифу.\n\nЛейла Надири внесла долю палаты в экспортную ведомость Конклава, а Рамин Фарзан проследил, чтобы договор упоминал все девять печей, а не только три дома, которые его подписали. Бехруз Вейран отозвал гвардии от границы портов, хотя сделал это не сразу: пограничный дом не любит соглашений, которые подписаны без него.\n\nМариам Арбин спросила в собрании, кто будет считать долю палаты - картель или Конклав. Вопрос остался открытым, но путь к морю открыт. Металл Шахрабада идёт в порты без сбора, и это первое соглашение, которое дома заключили от имени всей страны, а не каждый за себя."
 ADISCORD_SHL.62.a: "Путь к морю открыт."
 ADISCORD_SHL.63.t: "Вейр отказал"
 ADISCORD_SHL.63.d: "Торговая палата Вейра не приняла предложение Шахрабада, либо договор невозможен, потому что стороны воюют. Рамин Фарзан вернулся с письмом, в котором палата благодарит картель за честь и оставляет сбор в силе: порты предпочитают известный тариф доле в чужом предприятии, где дома спорят друг с другом громче, чем с соседями.\n\nГолшан Лоран принял отказ как личное оскорбление: его экспортные договоры по-прежнему проходят через весы палаты. Ферейдун Кердан мрачно заметил, что его дорога не первый год платит этот сбор и Конклав вспомнил о нём только теперь. Дарий Сафир предлагает поднять долю и повторить предложение; Бехруз Вейран - показать палате гвардии у границы портов. Рауф Дарбан молча положил на стол смету собственной гавани.\n\nСбор остаётся. Конклав может построить свою дорогу к морю, вернуться к переговорам позже или снять сбор силой в ограниченной войне за ключ к морю. Пока Хазар выбирает, каждый вагон проката по-прежнему проходит через весы Вейра."
 ADISCORD_SHL.63.a: "Искать другой путь."
 ADISCORD_SHL.65.t: "Перемирие в порту"
 ADISCORD_SHL.65.d: "Война за дорогу к морю не принесла решающей победы. Отряды Шахрабада дошли до предгорий у Салика, но стеклянные порты остались за палатой, а её наёмные команды каждую ночь рвали пути на дороге Ферейдуна Кердана. Бехруз Вейран, чьи гвардии шли первыми, доложил Конклаву, что пограничный дом больше не может держать фронт за свой счёт.\n\nПалата предлагает перемирие на прежних границах. Рамин Фарзан привёз условия: отряды отводятся, порты остаются у Вейра, сбор остаётся на каждом вагоне. Голшан Лоран требует продолжать - экспортные договоры Золотых ворот горят, - но Лейла Надири показала ему, во что обошёлся каждый день войны, и Дарий Сафир отказался платить дальше.\n\nАрман Теймур просит дать страже время восстановить роты. Перемирие вернёт металл на дорогу к морю, но весы палаты останутся на ней. Ключ к морю Шахрабад не получил; получил лишь счёт за попытку."
 ADISCORD_SHL.65.a: "Согласиться на перемирие."
 ADISCORD_SHL.66.t: "Дорога к морю"
 ADISCORD_SHL.66.d: "Торговая палата Вейра признала поражение. Рудники Кассена и дорога через Норан переходят Шахрабаду, а сбор палаты больше не действует. Ферейдун Кердан впервые проехал всю дорогу от своей печи до моря, не встретив ни одних чужих весов, и велел записать это в хронику дома.\n\nТахмурас Байрат уже отправил горных мастеров в Кассен: новые рудники разгрузят его шахты, но потребуют тех же людей и того же порядка. Голшан Лоран переписывает экспортные договоры без строки о сборе, а Лейла Надири - промышленную ведомость с новыми районами. Бехруз Вейран привёл гвардии дома обратно к границе и потребовал оплатить каждый день похода из общей казны, а не из его. Рамин Фарзан напоминает, что палата не распущена и порты по-прежнему её: Шахрабад взял дорогу, а не море.\n\nМеталл пойдёт к морю. Палата будет помнить, кто снял её весы с дороги, и ждать дня, когда Конклав займётся чем-нибудь другим."
 ADISCORD_SHL.66.a: "Металл пойдёт к морю."
 ADISCORD_SHL.67.t: "Поражение в порту"
 ADISCORD_SHL.67.d: "Шахрабад не удержал фронт. Наёмные команды палаты и портовые дружины прошли через предгорья и заняли Салик, перерезав дорогу Ферейдуна Кердана в её самом узком месте. Гвардии Бехруза Вейрана отошли к своей границе, не дождавшись подкреплений: стража Конклава застряла в Хазаре без обоза.\n\nПалата забирает Салик и навязывает свои расценки на вывоз металла. Голшан Лоран подписал новые тарифы первым - без вывоза его дом не существует. Ферейдун Кердан подписал последним и ушёл из зала, не дождавшись печати. Дарий Сафир потребовал от посредника объяснить, за что платила его казна, а Лейла Надири - записать проигранную войну в ведомость отдельной строкой, чтобы следующий Конклав видел цену.\n\nМариам Арбин сказала в собрании то, что дома не хотели слышать: ключ к морю нельзя взять гвардиями одного пограничного дома. Шахрабад принимает условия. Металл пойдёт к морю через весы Вейра, и весы теперь стоят на шахрабадской земле."
 ADISCORD_SHL.67.a: "Принять условия."
 ADISCORD_SHL.70.t: "Паёк Мазара"
 ADISCORD_SHL.70.d: "Посланник Палаты общего пайка прибыл в Хазар с расчётом: металл Шахрабада нужен водосборам Мазара, и палата считает его частью общего пайка пустыни. Мазар требует платежа и напоминает, что Зарханский округ лежит у его границы. Бехруз Вейран, чьи земли первыми встретят отряды Мазара, прочитал письмо дважды и попросил Конклав не считать это торговлей.\n\nРамин Фарзан объяснил залу: палата не продаёт и не покупает, она распределяет, и Шахрабад для неё - сосед, который взял из общей чаши больше других. Дарий Сафир готов оплатить требование из своей казны, лишь бы не трогать печи. Тахмурас Байрат против: заплатить раз - значит платить всегда. Арман Теймур доложил, что страже нужны шестьдесят дней, чтобы занять позиции в Зарханском округе, и что ровно столько палата обещает подождать.\n\nМожно заплатить и закрыть вопрос на время. Можно отказать и подготовиться к войне: палата даст шестьдесят дней, и ни днём больше."
 ADISCORD_SHL.70.a: "Выплатить паёк."
 ADISCORD_SHL.70.b: "Отказать Мазару."
 ADISCORD_SHL.71.t: "Мазар выступил"
 ADISCORD_SHL.71.d: "Срок ультиматума истёк. На рассвете отряды Мазара перешли границу Зарханского округа у водяных цистерн и двинулись к печному округу. Палата общего пайка объявила, что заберёт свой паёк сама. Бехруз Вейран поднял гвардии дома по тревоге раньше, чем из Хазара пришёл приказ: пограничный дом ждал этого дня с первого письма.\n\nАрман Теймур докладывает Конклаву: стража стоит на подготовленных позициях у Зархана, обоз собран, но резервов нет. Бахрам Каве перехватил расписание мазарских колонн - распорядители палаты идут за отрядами с ведомостями и уже знают, какие печи ближе к границе. Рауф Дарбан предлагает отдать арсенальные плавки под фронт без очереди. Ширин Шарим просит вывести смены из Шарима, если фронт подойдёт.\n\nДжалиль Нур собрал всех девятерых глав домов в одном зале. Споры о воде, сборах и кварталах не исчезли, но сегодня у Конклава один враг, и печи будут работать на него. К оружию."
 ADISCORD_SHL.71.a: "К оружию."
 ADISCORD_SHL.72.t: "Перемирие с Мазаром"
 ADISCORD_SHL.72.d: "Наступление Мазара выдохлось у печного округа, а Шахрабад не смог отбросить его обратно за Зархан. Отряды палаты держат цистерны, стража Конклава - подходы к Шариму и Вейрану; между ними лежат выжженные караванные дороги, по которым никто не возит ни воду, ни металл.\n\nПалата общего пайка соглашается на перемирие на прежней границе и снимает требование пайка. Рамин Фарзан привёз условия и добавил своё мнение: распорядители палаты устали считать убытки так же, как Лейла Надири. Бехруз Вейран против перемирия - его земли первыми приняли удар, и он хочет вернуть каждый разъезд. Арман Теймур за: стража держится на старых унтер-офицерах и не выдержит ещё одного наступления.\n\nДарий Сафир подвёл итог просто: паёк не выплачен, печи работают, граница на месте. Конклав принимает перемирие. Мазар отступает к цистернам и запоминает, что Шахрабад умеет держать позиции, но не умеет наступать."
 ADISCORD_SHL.72.a: "Согласиться на перемирие."
 ADISCORD_SHL.73.t: "Мазар разбит"
 ADISCORD_SHL.73.d: "Палата общего пайка признала поражение. Ресан и Далир - оба района цистерн - переходят Шахрабаду, а требования пайка сняты. Стража Конклава вошла в Ресан под командованием Армана Теймура; гвардии Бехруза Вейрана, первыми встретившие отряды Мазара, первыми же вошли в Далир и подняли над цистернами флаг дома раньше, чем флаг Конклава.\n\nРаспорядители палаты передали ведомости воды и ушли на юг. Самира Хади открыла лазарет в Далире для обеих сторон; Бахрам Каве доложил, что палата не распущена и соседи - Кейзан, Вейр, Кадир - смотрят, что Шахрабад сделает с цистернами. Голшан Лоран уже считает, сколько стоит вода пустыни на рынке Золотых ворот. Мариам Арбин напоминает, что цистерны поят не только Мазар, и спрашивает, кем Шахрабад хочет быть для соседей: хозяином воды или её распорядителем.\n\nШахрабад устоял. Конклав может удерживать коридор, вернуть цистерны за концессию или предложить независимому Мазару хартию. Каждый ответ запомнят все, кто пьёт из этих цистерн."
 ADISCORD_SHL.73.a: "Шахрабад устоял."
 ADISCORD_SHL.74.t: "Паёк взят силой"
 ADISCORD_SHL.74.d: "Шахрабад капитулировал. Отряды Мазара не пошли дальше печного округа, и распорядители палаты объяснили почему: Палата общего пайка не забирает печи - ей нужен металл, который они дают. Вместо этого распорядители вывезли из Хазара две пятых казны и остались в городе следить за выплатами, с ведомостями и охраной.\n\nДарий Сафир потребовал от Конклава объяснить, почему казна его дома считается казной Шахрабада, и не получил ответа. Бехруз Вейран увёл гвардии к границе, которую больше не признаёт своей. Лейла Надири передала распорядителям копии промышленной ведомости - они потребовали подлинники. Амин Рашад сохранил печать, но подписывать ею пришлось чужие расчёты.\n\nПечи продолжают работать. Ширин Шарим первой подняла огонь в полную силу: распорядители считают металл, и остановка смены теперь обошлась бы дороже, чем её оплата. Конклав жив, но Мазар сидит в его зале, и каждая плавка проходит через чужую ведомость."
 ADISCORD_SHL.74.a: "Печи продолжают работать."
 ADISCORD_SHL.75.t: "Мазар требует снова"
 ADISCORD_SHL.75.d: "Палата общего пайка вернулась. Прежний платёж распорядители называют задатком и теперь требуют окончательный паёк в размере 400, после чего Мазар обещает закрыть вопрос навсегда. Посланник передал расчёт Амину Рашаду с той же вежливостью, что и в прошлый раз, и с тем же напоминанием о Зарханском округе.\n\nТахмурас Байрат первым сказал вслух то, что думали все: первый платёж не купил мира, а лишь показал палате, что Шахрабад платит. Дарий Сафир готов заплатить и в этот раз - его казна выдержит, а печи дороже. Голшан Лоран подсчитал, что сумма равна выручке двух печей за цикл, и назвал её терпимой. Бехруз Вейран и Арман Теймур считают иначе: стража с прошлого раза успела подготовить позиции у Зархана, и отказ сегодня стоит меньше, чем год назад.\n\nМожно заплатить окончательно и поверить обещанию палаты. Можно отказать и встретить Мазар на подготовленных позициях. Палата снова даст шестьдесят дней."
 ADISCORD_SHL.75.a: "Заплатить окончательно."
 ADISCORD_SHL.75.b: "Отказать Мазару."
 ADISCORD_SHL.90.t: "Южный договор"
 ADISCORD_SHL.90.d: "Шахрабад предлагает общинам Кейзана союз. Письмо привезла Мариам Арбин от имени Южного договора: общая оборона от Мазара и общий совет по воде и металлу, в котором собрание арычных общин сидит рядом с городскими собраниями Шахрабада, а не напротив гербов.\n\nКейзан помнит, как печи Арбина, Сафира и Лорана пили воду кяризов и кто закрывал отводы. Делегация не скрывает этого: Хосров Арбин не подписывал письма, но его дочь говорит от городов, и договор обещает, что спор о воде будут решать те, кто её пьёт, а не те, кто ею владеет. Палата общего пайка угрожает обоим соседям, и Мазар не спрашивает, из чьих кяризов берёт воду.\n\nСтарейшины спрашивают, кто поведёт общую оборону и чьи отряды придут первыми, если отряды Мазара перейдут границу общин. Ответ Шахрабада: стража Армана Теймура, а не гвардии домов. Вступить в договор - значит связать судьбу кяризов с судьбой печей. Отказать - значит остаться одной границей между Шахрабадом и Мазаром."
 ADISCORD_SHL.90.a: "Вступить в договор."
 ADISCORD_SHL.90.b: "Отказать."
 ADISCORD_SHL.91.t: "Союз Золотых ворот"
 ADISCORD_SHL.91.d: "Картель Золотых ворот предлагает Торговой палате Вейра стать членом союза: общий рынок будет защищён общей армией. Предложение привёз Рамин Фарзан, составил Голшан Лоран, а гарантировал Дарий Сафир; подпись Ферейдуна Кердана подтверждает, что дорога к морю открыта для палаты в обе стороны.\n\nПалата уже сидит за столом картеля и получает долю в вывозе металла. Союз добавляет к доле обязательство: отряды Вейра встанут рядом со стражей Шахрабада, если Мазар или кто-то другой перейдёт общую границу, а гвардии Бехруза Вейрана будут защищать порты так же, как разъезды своего дома. Члены палаты спорят, стоит ли торговому городу армия соседа, и помнят, что Шахрабад недавно воевал за дорогу к морю.\n\nРамин Фарзан отвечает прямо: палата может торговать с Конклавом и без союза, но тогда в день войны порты будут защищать себя сами. Вступить в союз - значит стать частью Золотых ворот. Отказать - значит остаться их покупателем."
 ADISCORD_SHL.91.a: "Вступить в союз."
 ADISCORD_SHL.91.b: "Отказать."
 ADISCORD_SHL.92.t: "Союз заключён"
 ADISCORD_SHL.92.d: "Приглашение Шахрабада принято. Новый союзник будет защищать общие границы, а его отряды войдут в общий план обороны, который Арман Теймур уже разворачивает на столе Конклава. Рамин Фарзан подписал акт от имени Хазара и проследил, чтобы в нём стояли подписи всех, кто обещал войска, а не только тех, кто обещал деньги.\n\nДома приняли новость по-разному. Голшан Лоран и Дарий Сафир считают союз продолжением торговли; Бехруз Вейран - лишней обузой для гвардий, которым теперь придётся охранять чужие границы; Хосров Арбин и Камран Нур - первым за много лет случаем, когда Шахрабад говорит с соседом не через ультиматум. Мариам Арбин потребовала, чтобы собрания знали, за кого воюют их сыновья, и Амин Рашад внёс договор в открытый протокол.\n\nБахрам Каве передал в Хазар первые сводки от союзника. Общая граница стала длиннее, но за ней теперь стоят не только гвардии одного пограничного дома."
 ADISCORD_SHL.92.a: "Хорошо."
 ADISCORD_SHL.93.t: "Союз отклонён"
 ADISCORD_SHL.93.d: "Приглашение Шахрабада отклонено, либо союз больше невозможен: сосед выбрал другую сторону, стороны воюют или условия изменились до ответа. Рамин Фарзан привёз письмо, в котором благодарят за честь и желают Конклаву спокойных границ. Амин Рашад подшил его к делу рядом с предложением.\n\nБехруз Вейран не скрыл облегчения: гвардии дома останутся на своей границе, а не на чужой. Голшан Лоран и Дарий Сафир раздражены - торговля с соседом продолжается, но без общей армии каждая партия металла идёт через земли, которые никто не обязан защищать. Арман Теймур вернулся к старому плану обороны, где Шахрабад стоит один, и попросил Конклав хотя бы оплатить его.\n\nМариам Арбин заметила, что соседи помнят, как Шахрабад говорил с ними прежде, и одного письма недостаточно, чтобы это забыть. Переговоры можно возобновить позже, если обе стороны снова смогут выполнить обязательства. До тех пор общую границу держат только свои."
 ADISCORD_SHL.93.a: "Понятно."
 SHL_obligation_idle_tt: "Ведомость обязательств свободна. Обслуживание и подвоз печей доступны отдельно."
 SHL_obligation_site_ready: "Печь работает в своём контролируемом районе"
 SHL_obligation_idle: "Ведомость свободна"
 SHL_civic_order: "Городской заказ: [FROM.GetName]"
 SHL_civic_order_desc: "Мосты, водоводы и ремонтные мастерские требуют металла местной печи. Две успешные плавки дадут району один уровень инфраструктуры. До завершения печь не перечисляет обычную выручку в казну. Если район уже достиг максимума, платёж вернётся. Оккупация приостанавливает работу; смена собственника или власти рассчитывает незавершённый заказ."
 SHL_civic_order_tt: "За 2 плавки: +1 инфраструктура района, +5 гражданская опора, -5 недовольство. Цена: [?SHL_civic_price|0] £ADISCORD_economy_treasury_texticon, фиксируется при оплате. Усиленная смена выполняет обе плавки. Отмена возвращает неизрасходованный залог. Обычной поставки во время заказа нет; после него печь снабжает кварталы."
 SHL_arsenal_order_tt: "Каждая из двух оплаченных партий: 6750 £infantry_equipment_texticon и 5 ед. оружия отделения. Общая цена: [?SHL_arsenal_price|0] £ADISCORD_economy_treasury_texticon, фиксируется при оплате. Усиленная смена выпускает обе партии; отмена возвращает долю цены за невыпущенные партии. Обычной поставки вдобавок нет; после заказа печь снабжает арсенал."
 SHL_relief_recipient: "Помочь печи: [FROM.GetName]"
 SHL_relief_recipient_desc: "Получателем может стать другая городская печь с износом не ниже 30 или с погашенным огнём. Ей нужен свободный слот оплаченных работ; погашенной печи также требуется один пакет сырья для запуска. Если начинается обычный ремонт, помощь ждёт его расчёта. Оплаченный чужой ремонт не перехватывается. Получатель закрепляется до исполнения или отмены всей ведомости."
 SHL_relief_ready_tt: "Другая городская печь под контролем, без оплаченной работы: работает с износом от 30 или погашена и имеет 1 пакет сырья."
 SHL_relief_delivery_tt: "После §Y2§! плавок донора: §G-30§! износа получателя. Погашенная печь вместо этого запустится с износом §Y20§!, израсходовав §Y1§! свой пакет. Недовольство: §G-8§!."
 SHL_close_obligation: "Рассчитать незавершённое обязательство"
 SHL_close_obligation_desc: "Завершённые поставки оружия остаются на складе; незавершённая городская стройка возвращает депозит. Экспорт и залог требуют погашения остатка, указанного в ведомости. Если казны не хватает, разница становится обычным государственным долгом. Отданные плавки и сырьё не возвращаются."
 SHL_close_obligation_tt: "Возврат депозита: §Y[?SHL_obligation_deposit|0]§! £ADISCORD_economy_treasury_texticon. К погашению: §Y[?SHL_obligation_liability|0]§! £ADISCORD_economy_treasury_texticon; нехватка станет государственным долгом. Ведомость освобождается."
 SHL_foreclose_government_tt:0 "Управление печами действует; Шахрабад не капитулировал"
 SHL_pledged_furnace_controlled_tt:0 "Заложенная печь в регионе [SHLGetOrderSite] принадлежит Шахрабаду и находится под его контролем"
 SHL_foreclose_furnace: "Передать залог городской кассе"
 SHL_foreclose_furnace_desc: "Городская касса принимает работающую печь вместо оставшегося долга. Дом теряет владение и наследственный голос; производство продолжается. Это выход для регента, которому важнее сохранить казну, чем единство гербов."
 SHL_foreclose_furnace_tt: "Остаток залога списывается. Заложенная печь переходит городу, дом теряет голос. Давление гербов: §R+15§!; недовольство кварталов: §G-8§!."
 SHL_extend_export_tt: "Ещё §Y2§! цикла, только один раз. Окончательная выплата уменьшается до §Y90§! £ADISCORD_economy_treasury_texticon; цена расторжения растёт на §R30§! £ADISCORD_economy_treasury_texticon. Недовольство: §R+8§!."
 SHL_industrial_independence_tt: "Водный и портовый споры урегулированы либо не возникли: сосед больше не может предъявить требования. Работает не менее 6 печей."
 SHL_ledger_idle: "Ведомость свободна: выберите печь для своего курса."
 SHL_ledger_export: "Экспорт: [SHLGetOrderSite]. Плавки [?SHL_obligation_progress|0]/2.\nСрок: цикл [?SHL_obligation_deadline|0]. Сейчас [?SHL_cycle_number|0]."
 SHL_ledger_civic: "Городской заказ: [SHLGetOrderSite]. Плавки [?SHL_obligation_progress|0]/2.\nДепозит: [?SHL_obligation_deposit|0] £ADISCORD_economy_treasury_texticon."
 SHL_ledger_arsenal: "Арсенал: [SHLGetOrderSite]. Партии [?SHL_obligation_progress|0]/2.\nОстаток оплаты: [?SHL_obligation_deposit|0] £ADISCORD_economy_treasury_texticon."
 SHL_ledger_pledge: "Залог: [SHLGetOrderSite].\nК погашению: [?SHL_obligation_liability|0] £ADISCORD_economy_treasury_texticon."
 SHL_ledger_relief: "Помощь: [SHLGetOrderSite] -> [SHLGetReliefSite].\nПлавки донора: [?SHL_obligation_progress|0]/2."
 SHL_ledger_overdue: "§RЭкспорт просрочен.§! [SHLGetOrderSite]: [?SHL_obligation_progress|0]/2.\nК погашению: [?SHL_obligation_liability|0] £ADISCORD_economy_treasury_texticon. Решите судьбу договора."
 SHL_ledger_choose: "выберите получателя"
 SHL_panel_ledger: "[SHLGetOrderLedger]"
 ADISCORD_SHL.100.t: "Кому достанется следующая плавка"
 ADISCORD_SHL.100.house: "Посланник картеля Золотых ворот положил на стол кошель раньше, чем писарь закончил читать договор. Голшану Лорану понравился этот жест: новый порядок говорил на знакомом ему языке. Дарий Сафир кивнул, не глядя на кошель. Но мастер Арбина попросил назвать печь, которая ответит за обещанный металл, и в зале стало тише. Подпись Конклава могла связать всю страну; работать предстояло одной смене.\n\nДжалиль Нур велел Лейле Надири завести отдельную ведомость. Аванс можно потратить немедленно, но за три производственных цикла выбранная печь должна выполнить две плавки для покупателя. Её обычная выручка на это время исчезнет из общего счёта. Усиленная смена позволит успеть быстрее, если найдутся сырьё Байрата и люди, готовые принять износ.\n\nЭто ещё не десятый голос. Прежде чем Товарищество мастеров и инженеров получит наследственный герб, ему придётся доказать, что его подпись означает больше, чем право брать деньги."
 ADISCORD_SHL.100.city: "Городские делегаты принесли в Конклав не герб, а чертёж перехода через сухое русло. Каждую весну здесь теряли телеги, каждое лето жители носили воду в обход обвалившейся кладки. Ферейдун Кердан, хозяин ближайшей печи, спросил, сколько принесёт новая дорога. Мариам Арбин ответила за делегатов: впервые прибыль не будет единственным условием строительства.\n\nГородской заказ оставляет металл дома. Казна оплачивает работу, а две плавки выбранной печи превращаются в дорогу, мост или водовод её района. На это время правительству придётся обойтись без обычной выручки предприятия. Лейла Надири записала заказ в ведомость, а Самира Хади попросила, чтобы первый переход вёл к лазарету. Дорога останется даже в случае, если Конклав позднее откажет городам в голосе.\n\nПредставительство ещё предстоит утвердить после принятия рабочей хартии. До того города смогут предъявить не обещания, а построенное собственными силами."
 ADISCORD_SHL.100.state: "Арман Теймур положил перед Джалилем Нуром затвор с трещиной. В реестре он числился исправным: казна оплатила заказ, склад принял ящики, ведомство поставило печать. Никто не записал, какая печь отливала металл и кто проверял последнюю партию. Рауф Дарбан перевернул затвор и назвал печь по клейму раньше, чем писарь нашёл накладную.\n\nДирекция начинает с простого требования: у каждого заказа будет конкретное производство. Оплата двух партий останется в ведомости Лейлы Надири. Первая успешная плавка даст половину оружия, вторая закроет заказ. Пока цех работает на арсенал, его выручка не пополняет казну. Усиленная смена может сделать обе партии сразу; остановившаяся печь не сделает ни одной.\n\nНур пока не получил права распоряжаться всеми домами, и Дарий Сафир напомнил об этом вслух. Но первая военная ведомость уже заставляет выбирать, чем страна готова поступиться ради исправного оружия."
 ADISCORD_SHL.100.a: "Внести первую печь в ведомость."
 ADISCORD_SHL.101.t: "Пустое место в караване"
 ADISCORD_SHL.101.d: "У Золотых ворот стояли телеги покупателя, а в ведомости не хватало оплаченного металла. Лейла Надири могла перечислить причины: сырьё Байрата пришло с опозданием, печь стояла на ремонте, дорога Кердана была закрыта. Купец выслушал всё, после чего снова развернул лист с подписью Конклава. На нём не было оговорки о том, что аванс возвращается только при удобных обстоятельствах. Голшан Лоран, чьё имя стоит на экспортных договорах дома, смотрел в сторону.\n\nПервый выход - закрыть договор и рассчитаться по оставшемуся обязательству. Если денег не хватит, задолженность перейдёт в государственный счёт, и Дарий Сафир уже спросил, из чьей казны. Второй - просить ещё два цикла. Покупатель согласится лишь один раз, уменьшит окончательный платёж и потребует большей компенсации при повторном срыве. Смены уже слышали, что наверху обсуждают новый срок, и Салима Дарзи записала это в журнал.\n\nПока стороны не договорятся, печь вернётся к обычной продаже своей продукции. Старая подпись при этом никуда не исчезнет."
 ADISCORD_SHL.101.a: "Закрыть договор и рассчитаться."
 ADISCORD_SHL.101.b: "Попросить последнюю отсрочку."
 ADISCORD_SHL.101.c: "Ведомость уже закрыта."
 SHL_renew_golden_offer: "Вернуться к союзу Золотых ворот"
 SHL_renew_southern_offer: "Вернуться к Южному договору"
 SHL_renew_golden_offer_desc: "Партнёрство с Вейром позволяет вновь предложить общий союз. Решение остаётся за его правительством; новый отказ не закрывает будущие переговоры."
 SHL_renew_southern_offer_desc: "Предложить Кейзану войти в Южный договор. Отказ оставляет страну независимой, а через 60 дней переговоры можно возобновить."
 SHL_alliance_offer_free_tt: "Предыдущее предложение союза уже рассмотрено."
 SHL_renew_alliance_offer_tt: "Партнёр получит предложение союза. При согласии он вступит также в текущую оборонительную войну Шахрабада против Мазара."
 SHL_regency_independent_tt: "Не менее 7 действующих голосов домов; действующий залог погашен или урегулирован."
 SHL_renew_veyr_partnership: "Возобновить переговоры с Вейром"
 SHL_renew_veyr_partnership_desc: "Предложить торговое партнёрство повторно. Согласие Вейра после учреждения Конклава десяти также откроет предложение союза. Уже построенная гавань и результаты войны сохраняются."
 SHL_partner_joins_mazar_tt: "Страна вступит в текущую войну против Мазара на стороне Шахрабада."
 SHL_hereditary_seats: "Наследственные места"
 SHL_hereditary_seats_desc: "Девять домов умеют собирать большинство, но каждое решение оплачивается уступками их семьям. Дух снимается при утверждении нового политического устройства."
 SHL_divided_guard: "Девять штабов"
 SHL_divided_guard_desc: "Заводская стража подчиняется владельцам печей. Командиры умеют охранять склады, но ещё не научились вести общую войну. Фокус \"Южный дозор\" создаст единое командование."
 SHL_external_freight: "Чужие пути снабжения"
 SHL_external_freight_desc: "Вода и выход к морю зависят от соседей. Собственный транспорт и урегулирование обоих соседских споров снимут зависимость."
 SHL_prepared_columns: "Обоз непрерывного огня"
 SHL_prepared_columns_desc: "Две оплаченные плавки стали запасными частями и походным снаряжением. Обоз помогает снабжать армию 90 дней с момента вступления в войну; мир завершает его службу раньше."
 SHL_forced_columns: "Форсированный марш"
 SHL_forced_columns_desc: "Дополнительное сырьё и перегруженные смены обеспечили первые 45 дней наступления. Скорость развёртывания оплачивается повышенным расходом снабжения."
 SHL_house_war_mandate: "Заём девяти гербов"
 SHL_house_war_mandate_desc: "Дома согласны оплатить поход, если государство признает военный долг. Победа позволит обменять занятые цистерны на концессию; оставленные себе земли потребуют собственных вложений."
 SHL_city_war_mandate: "Мандат городских дружин"
 SHL_city_war_mandate_desc: "Города выделят дружины, но поддержка собраний не безгранична. Их война должна закончиться безопасными дорогами и договором, за который не придётся расплачиваться независимостью соседа."
 SHL_directorate_war_mandate: "План первого удара"
 SHL_directorate_war_mandate_desc: "Дирекция превращает готовый обоз в средство наступления. Дополнительное сырьё уйдёт на начало войны, но перенапряжение цехов отзовётся недовольством."
 SHL_regent_war_mandate: "Полки под залог"
 SHL_regent_war_mandate_desc: "Регент способен вооружить дружины, увеличив обязательство действующей печи. После войны ему предстоит погасить залог или возвращать домам утраченные голоса без списания старых долгов."
 SHL_commune_war_mandate: "Вооружённая смена"
 SHL_commune_war_mandate_desc: "Коммуна передаст дружине собственное оружие и людей. После победы помощь соседним общинам тоже потребует поставок."
 SHL_campaign_logistics: "Две плавки для фронта"
 SHL_campaign_logistics_desc: "Одна печь получит оплаченный походный заказ. Пока она готовит обоз, её металл не продаётся на обычном рынке. Усиленная смена ускорит поставку ценой сырья и износа."
 SHL_no_more_rations: "Последний паёк"
 SHL_no_more_rations_desc: "Шахрабад может сам назначить срок столкновения с Мазаром. Цель похода - удержать обе цистерны и защитить собственный округ, после чего навязать ограниченный мир."
 SHL_peace_has_a_price: "Цена наступившего мира"
 SHL_peace_has_a_price_desc: "Война или расчёт с Мазаром закрывают требование пайка, но не определяют устройство юга."
 SHL_southern_horizon: "За линией цистерн"
 SHL_southern_horizon_desc: "Итог кампании измеряется тем, что осталось после демобилизации: землёй, договорами, работающими предприятиями и правом распоряжаться огнём."
 SHL_forge_campaign_convoy: "Заказать походный обоз"
 SHL_forge_campaign_convoy_desc: "Выбранная печь отдаст две плавки походному заказу. До завершения её обычная выручка недоступна. Смена власти сохраняет заказ; потеря печи или окончание войны возвращает неиспользованную оплату."
 SHL_demobilise_campaign_convoy: "Разобрать неиспользованный обоз"
 SHL_demobilise_campaign_convoy_desc: "Готовый, но ещё не отправленный обоз можно вернуть на склады в виде оружия. После отправки на фронт это невозможно."
 SHL_march_on_mazar: "Выступить к цистернам"
 SHL_march_on_mazar_desc: "За 28 дней подготовить объявление войны Мазару за два района цистерн. Если угроза исчезнет или Шахрабад вступит в другую войну, подготовка отменяется с возвратом 50 £political_power_texticon."
 SHL_secure_cistern_corridor: "Закрепить коридор цистерн"
 SHL_secure_cistern_corridor_desc: "Удерживать оба района цистерн и свой пограничный округ 14 дней. Потеря любой цели прервёт закрепление. Успех завершает эту войну передачей двух районов Шахрабаду."
 SHL_house_campaign_aid: "Открыть военный заём домов"
 SHL_house_campaign_aid_desc: "Один пакет помощи на текущую кампанию. Дома дадут казне деньги немедленно, но государственный долг вырастет на большую сумму."
 SHL_city_campaign_aid: "Две городские дружины"
 SHL_city_campaign_aid_desc: "Один пакет помощи на кампанию. Города передадут две полностью вооружённые дружины; казна оплачивает оружие, рекруты поступают из общего резерва, а собрания теряют часть поддержки."
 SHL_directorate_campaign_aid: "Форсировать начало похода"
 SHL_directorate_campaign_aid_desc: "Один пакет помощи на кампанию. Готовый обоз и дополнительное сырьё обеспечат усиление на первые 45 дней войны. Недовольство смен возрастёт."
 SHL_regent_campaign_aid: "Увеличить военный залог"
 SHL_regent_campaign_aid_desc: "Один пакет помощи на кампанию. Две дружины вооружаются в счёт действующего залога. Выручка связанной печи продолжит погашать увеличенный долг."
 SHL_commune_campaign_aid: "Вооружить дружину"
 SHL_commune_campaign_aid_desc: "Один пакет помощи на кампанию. Дружина получает только оплаченные со складов оружие и людской состав. Общая служба снижает недовольство кварталов."
 SHL_offer_cistern_charter: "Предложить хартию цистерн"
 SHL_offer_cistern_charter_desc: "Вернуть оба занятых района Мазару в обмен на его добровольное вступление в Южный договор. При отказе земля остаётся у Шахрабада; через 60 дней предложение можно повторить."
 SHL_cistern_concession: "Обменять цистерны на концессию"
 SHL_cistern_concession_desc: "Вернуть оба занятых района Мазару и получить стоимость концессионных прав. Действующий залог погашается первым; остаток поступает в казну."
 SHL_reconstruct_south: "Устроить юг: [From.GetName]"
 SHL_reconstruct_south_desc: "Один оплаченный проект на 56 дней. [SHLGetSouthProgramme]\n\nПолучатель построек - текущий владелец выбранного района. Начало войны, смена курса или потеря доступа отменяют проект и возвращают оплату. Другой заказ нельзя открыть, пока первый не завершён."
 SHL_campaign_convoy_tt: "Две плавки выбранной печи -> обоз. При вступлении в войну: 90 дней расход снабжения -15%, восстановление организации +8%."
 SHL_demobilise_convoy_tt: "Обоз -> §G13500§! £infantry_equipment_texticon. Усиление форсированного марша также отменяется."
 SHL_march_ready_tt: "Мазар независим, угрожает Шахрабаду и не занят другой войной; наша армия ещё не выступила."
 SHL_march_on_mazar_tt: "Через §Y28 дней§! Шахрабад объявит войну Мазару за [269.GetName] и [268.GetName]. Мазар может пригласить одного соседа, ранее атакованного Шахрабадом. Предупреждение и переговоры о нейтралитете доступны с начала подготовки."
 SHL_cistern_objectives_tt: "Удерживаем [269.GetName], [268.GetName] и свой [707.GetName] в текущей войне с Мазаром."
 SHL_secure_cistern_corridor_tt: "Удержите цели §Y14 дней§!: мир и переход [269.GetName] и [268.GetName] Шахрабаду."
 SHL_house_aid_ready_tt: "Идёт подготовка или война; помощь курса ещё не использована; столица под нашим контролем."
 SHL_city_aid_ready_tt: "Помощь не использована; столица удерживается; поддержка городов не ниже 35 и хватает средств и рекрутов."
 SHL_directorate_aid_ready_tt: "Помощь не использована; столица удерживается; готов обоз и два пакета сырья."
 SHL_regent_aid_ready_tt: "Помощь не использована; столица удерживается; есть действующий залог и достаточно рекрутов."
 SHL_commune_aid_ready_tt: "Помощь не использована; столица удерживается; хватает оружия и рекрутов для одной дружины."
 SHL_house_aid_tt: "§G400§! £ADISCORD_economy_treasury_texticon сейчас; государственный долг §R+500§!."
 SHL_city_aid_tt: "Две дружины \"Печной сбор\" в столице. Поддержка городов §R-15§!."
 SHL_directorate_aid_tt: "Недовольство §R+8§!. При начале войны: атака дивизий §G+8%§!, расход снабжения §R+10%§! на §Y45 дней§!."
 SHL_regent_aid_tt: "Две дружины в столице. Обязательство печи §R+180§! £ADISCORD_economy_treasury_texticon; недовольство §R+15§!."
 SHL_commune_aid_tt: "Одна оплаченная дружина в столице. Недовольство §G-12§!."
 SHL_cistern_charter_ready_tt: "Оба района удерживаются после победы; Мазар независим и без союза; послевоенный проект ещё не оплачен."
 SHL_cistern_concession_ready_tt: "Оба района удерживаются после победы; Мазар независим; послевоенный проект ещё не оплачен."
 SHL_cistern_charter_tt: "Мазар получит выбор: вернуть оба района и вступить в наш союз. До его согласия передача не происходит."
 SHL_cistern_accept_tt: "Мазар получит оба района цистерн и вступит в Южный договор, сохранив независимость."
 SHL_cistern_concession_tt: "Оба района возвращаются Мазару. 450 £ADISCORD_economy_treasury_texticon концессии сначала гасят действующий залог; остаток поступает в казну."
 SHL_south_programme_ready_tt: "Мазарский спор закрыт; мир; утверждён политический курс; нет другого проекта; район доступен и ещё получит материальное улучшение."
 SHL_south_programme_tt: "Через §Y56 дней§!: [SHLGetSouthProgramme] При отмене возвращаются все внесённые средства и оружие."
 SHL_southern_programme_complete_tt: "Послевоенная программа оплачена и завершена."
 SHL_mazar_warning_tt: "Первое требование возможно с §Y10-го цикла§!; после отказа остаётся §Y60 дней§!. Подготовьте стражу и обоз или средства на урегулирование."
 SHL_ledger_convoy: "Походный обоз: [SHLGetOrderSite]. Плавки [?SHL_obligation_progress|0]/2.\nОплата: [?SHL_obligation_deposit|0] £ADISCORD_economy_treasury_texticon."
 SHL_campaign_reserve_ready: "§Gготов§!"
