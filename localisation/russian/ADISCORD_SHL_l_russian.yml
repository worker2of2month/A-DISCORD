 # Book of furnaces and news
 ADISCORD_shl_book.read_on: "Читать дальше."
 ADISCORD_shl_book.put_away: "Отложить книгу."
 ADISCORD_shl_book.close: "Закрыть книгу."
 ADISCORD_shl_book.1.t: "Книга печей. Первый огонь"
 ADISCORD_shl_book.1.d: "Книга печей хранится в архиве Конклава под той же крышей, что и промышленная ведомость, но читают её реже. Это не хроника домов и не летопись побед: секретари Конклава веками записывали в неё, когда и почему зажигали и гасили печи Шахрабада. Первая запись сделана рукой, имени которой никто не знает, и начинается не с имени дома, а с имени города.\n\nХазар стоял на краю пустыни задолго до первой печи. Город жил караванами и водой - той водой, что текла по кяризам с запада, - и не нуждался ни в гербах, ни в металле. Первую печь поставил на окраине пришлый мастер, чьё имя Книга записывает по-разному; важно не имя, а то, что печь работала, и к ней пришли люди. За десять лет вокруг неё вырос квартал, за двадцать - второй, и когда мастер умер, печь досталась его сыновьям, а квартал - никому.\n\nСыновья поссорились. Книга описывает это сухо: один хотел продавать металл караванам, другой - городу, и пока они судились, печь остыла. Кварталы остались без работы и без хлеба, город - без металла, а кладка, остывшая до конца, трескается так, что её легче сложить заново, чем починить. Хазар узнал первое правило печей: печь, которая гаснет, убивает не хозяина, а тех, кто у неё работал.\n\nТогда город собрал старшин кварталов, мастеров и тех из купцов, кто вложил деньги в руду, и записал закон, который с тех пор не менялся: Закон непрерывного огня. Печь принадлежит тому, кто держит её огонь. Пока она горит, владелец распоряжается ею, её выручкой и её людьми. Если она гаснет, владение возвращается городу вместе с правом говорить от имени печи. Цеха и люди остаются на месте; меняется только собственник.\n\nКнига отмечает, что закон писали против хозяев, а не для них. Он должен был защитить квартал от брошенного завода. О том, что тот же закон однажды защитит хозяина от города, никто из писавших не подумал - или подумал и промолчал."
 ADISCORD_shl_book.11.d: "Вторая печь Хазара была зажжена уже по закону. Книга записывает, что её ставил купец, вложивший руду в первую, и что он прежде всего спросил у города письменное подтверждение: печь его, пока горит. Город подтвердил. Купец нанял мастеров первой печи, обучил смены и первым ввёл порядок, который Книга называет циклом: двадцать восемь дней от загрузки до разгрузки, расчёт выручки, расчёт износа. Он же первым записал, что усиленные смены дают больше металла и быстрее изнашивают кладку, и первым понял, что это не техническая запись, а политическая.\n\nПечи множились вдоль кяризов и вдоль дороги к морю. Каждая новая зажигалась с письменным подтверждением города, и каждое подтверждение город подписывал всё охотнее: металл кормил кварталы, кварталы платили городу, и Хазар богател быстрее, чем успевал считать. Книга отмечает первый спор о воде - третья печь перехватила канал четвёртой - и первый случай, когда хозяин погасил печь сам, чтобы не платить мастерам, и потерял её по закону. После этого хозяева научились не гасить печей ни при каких обстоятельствах.\n\nЗдесь Книга впервые употребляет слово \"дом\". Хозяева печей передавали их детям, дети - внукам, и владение, которое закон связывал с огнём, на деле оказалось связано с фамилией: огонь не гас, значит, фамилия оставалась. Фамилии взяли себе гербы, гербы повесили над воротами цехов, а потом - над креслами в зале, где город когда-то собирал старшин кварталов. Зал стал называться Конклавом, а старшин кварталов в нём больше не было.\n\nПоследняя запись первой части сделана другим почерком. Она короткая: \"Закон не изменился. Изменилось, кто его читает.\""
 ADISCORD_shl_book.2.t: "Книга печей. Девять кресел"
 ADISCORD_shl_book.2.d: "Вторая часть Книги печей начинается с перечня. Секретарь, который её вёл, записал девять главных печей в том порядке, в каком их гербы висят в зале Конклава, и с тех пор порядок не менялся, хотя дома не раз пытались его оспорить.\n\nПервая печь - дом Арбин. Она стоит западнее всех, у самых кяризов, и первой чувствует, когда Кейзан закрывает отводы. Книга пишет, что Арбины ставили печь там, где вода, а не там, где руда, и потому всегда были богаче водой, чем металлом. Хосров Арбин, нынешний глава, первым из домов узнаёт о засухе и последним - о ценах за Золотыми воротами.\n\nВторая - дом Сафир. Самый богатый герб и самая старая казна; Книга отмечает, что Сафиры не раз оплачивали чужие ремонты и всегда записывали, чьи. Дарий Сафир держит эти записи и помнит, кто из домов ему должен.\n\nТретья - дом Лоран. Золотые ворота, через которые металл уходит караванам, стоят у печи Лорана, и дом с тех пор считает экспорт своим делом, а внутренний рынок - чужим. Голшан Лоран знает цену каждого каравана и не знает, сколько стоит хлеб в кварталах Шарима.\n\nЧетвёртая - дом Нур. Печь в Нуране самая малая из девяти, и Книга не скрывает, что Нуры попали в Конклав потому, что никто не счёл их опасными. Именно это сделало дом Нур посредником: Джалиль Нур сидит в середине стола потому, что его печь не может стать первой. Камран Нур представляет дом, пока дядя представляет Конклав.\n\nПятая - дом Байрат. Рудники, а не печь, сделали Байратов домом: руда Байрата идёт во все девять печей, и Тахмурас Байрат может погасить любой спор, задержав один состав. Книга отмечает, что он никогда этого не делал - и что все об этом помнят."
 ADISCORD_shl_book.12.d: "Шестая - дом Кердан. Дорога к морю начинается у печи Кердана и кончается в стеклянных портах Вейра, и дом платит сборы палаты за каждый обоз с тех пор, как эти сборы существуют. Ферейдун Кердан давно считает спор с Вейром делом всего Конклава; Конклав давно считает его делом Кердана.\n\nСедьмая - дом Шарим. Самые тяжёлые смены в Шахрабаде; Книга приводит число несчастных случаев за каждое поколение, и число это растёт. Ширин Шарим отвечает на это лазаретами при цехах и жёстким порядком, а советы смен отвечают ей дежурным мастером Салимой Дарзи, которая выросла у той же печи.\n\nВосьмая - дом Дарбан, в Девятипечье. Инженерный дом: Дарбаны строили и чинили чужие печи раньше, чем получили свою, и чертежи всех девяти хранятся у них, а не в архиве Конклава. Рауф Дарбан считает приказ законченным после доставки и держит у себя чертёж десятой печи, которой ещё нет.\n\nДевятая - дом Вейран. Пограничный дом, последний по счёту и первый по гвардиям: печь Вейрана стоит ближе всех к Мазару, и дом содержит собственную стражу с тех пор, как Палата общего пайка впервые пересчитала шахрабадский металл. Бехруз Вейран уверен, что безопасность Конклава начинается у его ворот и оплачивается из его казны.\n\nКнига пишет, что дома не равны и никогда не были. Сафир и Лоран оплачивают Конклав, Байрат кормит его рудой, Вейран охраняет, Дарбан строит, Нур мирит. Арбин, Сафир и Лоран пьют воду Кейзана; Кердан и Вейран платят Вейру; Шарим первым встречает стачку. Девять голосов считаются по горящим печам, и семь из девяти - полное согласие гербов. Семи голосов, отмечает секретарь, за всю историю Конклава собиралось трижды, и каждый раз - против кого-то."
 ADISCORD_shl_book.3.t: "Книга печей. Кварталы и журналы"
 ADISCORD_shl_book.3.d: "Третья часть Книги печей написана не секретарём. Это признают сами секретари: почерк другой, бумага другая, и первая страница начинается словами \"нас нет в ведомости\". Как эта часть попала в архив Конклава, Книга не объясняет; её не вырвали, и этого достаточно.\n\nРабочие кварталы Шахрабада не зарегистрированы. У них нет голоса в Конклаве, нет своих ведомостей и своей стражи. Дом ведёт список своих рабочих, цех - своих, город - своих, и списки не совпадают: один человек может числиться в трёх реестрах под тремя написаниями имени и не числиться нигде, когда попадает в лазарет. Кварталы выросли вокруг печей быстрее, чем Конклав научился их считать, и Конклав предпочёл не учиться.\n\nСила кварталов - в сменах. Печь не может работать без людей, которые знают её кладку, и люди эти передают знание не домам, а друг другу. При каждой главной печи есть совет смен: его избирают цеха, он ведёт рабочий журнал - кто вышел, кто не вышел, кто обожжён, кому не заплатили, - и его решения подписывает дежурный мастер. Дежурный мастер - не должность, а очередь: подписывает тот, чья смена. В Шариме эта очередь чаще других выпадает Салиме Дарзи.\n\nЖурналы советов смен - единственная ведомость Шахрабада, которую не ведут дома. Книга приводит выдержки: в них нет лозунгов, только числа. Сколько часов, сколько ожогов, сколько обещано и сколько выплачено. Дома называют журналы доносами, кварталы - памятью. Конклав долго не читал их вовсе, пока не выяснилось, что при аварии подпись дома и подпись мастера стоят под разными цифрами износа, и верной оказывается вторая."
 ADISCORD_shl_book.13.d: "Холодная стачка - изобретение не кварталов, а закона. Закон непрерывного огня говорит, что погасшая печь возвращается городу, и ни один дом не допустит, чтобы его печь погасла. Советы смен поняли это раньше домов: если смены не выйдут в цех, но оставят у каждой печи одного кочегара, чтобы кладка не остыла, печь не погаснет, а металла не будет. Дом сохранит герб и потеряет выручку. Город не получит печь, но получит аргумент.\n\nПервую холодную стачку Книга датирует временем, когда гербы уже висели над креслами. Требования были те же, что и теперь: оплата сверхурочных, свободные дни после усиленных смен и право знать, куда уходит выручка. Дома прислали стражу; стража встала у ворот и обнаружила, что охранять нечего - цеха пусты, кочегары на месте, огонь горит. Через девять дней дома заплатили. Через девять лет забыли.\n\nКнига пишет, что советы смен никогда не требовали власти, пока им не отказывали во всём остальном. Если Конклав не уступает и не пережидает стачку, советы собираются вместе и объявляют себя Советом смен - уже не при печи, а над печами. Такого в истории Шахрабада ещё не было; Книга описывает это как возможность, а не как событие. Против кварталов стоят гербы с их Ночью - ультиматумом, за которым гвардии и казна Сафира. Между ними стоит кабинет: секретарь с печатью, координатор стражи, счетовод печей, врач, наставник, шифровальщик и посланник. Кому из них служить - решает не кабинет.\n\nПоследняя страница третьей части - список имён. Это не делегаты и не старосты: это кочегары, которые держали огонь во время первой холодной стачки. Книга замечает, что ни один дом их не записал."
 ADISCORD_shl_book.4.t: "Книга печей. Посредник и десятая печь"
 ADISCORD_shl_book.4.d: "Четвёртая часть Книги печей посвящена креслу, над которым нет герба. Посредник Конклава не правит Шахрабадом: он ведёт заседания, считает голоса горящих печей, подписывает то, что решили дома, и мирит их, когда они не решили ничего. Книга перечисляет посредников с первой записи; большинство из них - главы малых домов, которых большие дома терпели именно потому, что те не могли стать первыми.\n\nДжалиль Нур занял кресло так же. Дом Нур держит в Нуране самую малую из девяти печей, и когда Сафир и Лоран не смогли договориться, кому вести Конклав, оба назвали Нура: слишком беден, чтобы спорить, слишком стар, чтобы ждать. Книга отмечает, что Нур принял кресло без возражений и первым делом попросил у секретаря промышленную ведомость - не для себя, а чтобы читать её вслух.\n\nПосредничество Нура Книга описывает по делам. Спор Арбина и Сафира о кяризе он закрыл, заставив обоих подписать общий договор с Кейзаном. Спор Кердана с Вейром о сборе он не закрыл, но впервые назвал его делом Конклава, а не дома. Стачку в Шариме он пережидал девять дней, не прислав стражи, и дом Шарим не простил ему этого до сих пор. Ни одно из этих дел не сделало Нура сильнее; каждое сделало его нужнее.\n\nИ всё же посредник - не власть. Книга пишет об этом прямо: у Нура нет ни гвардий, ни казны, ни голоса, которого бы не было у его племянника Камрана. У него есть ведомость и привычка домов приходить к нему, когда они не могут договориться. Этого хватает, пока дома спорят. Чего не хватит, когда они договорятся, показала бы Ночь гербов - если бы случилась."
 ADISCORD_shl_book.14.d: "Десятая печь началась не с Конклава. Товарищество мастеров и инженеров - цеховое объединение, выросшее при печи Дарбана в Девятипечье, - подало посреднику чертёж с одной подписью: Рауф Дарбан, от имени товарищества, а не дома. Чертёж предлагал построить в Девятипечье десятый комплекс без наследственного владельца. Книга хранит пометку Нура на полях: \"Кому принадлежит?\" - и ответ Дарбана ниже: \"Тому, кто решит Конклав.\"\n\nИнженерный расчёт был прост. Девять печей изношены неравномерно, и каждый цикл кто-то из домов работает на пределе; десятая печь приняла бы на себя заказы, которые девять не успевают, и дала бы Конклаву металл, не принадлежащий ни одному гербу. Политический расчёт был сложнее, и Книга не скрывает, что товарищество понимало его лучше, чем показывало. Печь без дома - это кресло без герба, и кто его займёт, решит, кому принадлежит Шахрабад.\n\nДома ответили по-разному. Лоран и Сафир предложили признать товарищество десятым домом: кресло, герб, прежний порядок, одним голосом больше. Городские собрания Мариам Арбин потребовали открыть Конклав всем промышленным общинам, а не одной новой фамилии. Советы смен не ответили ничего, но Книга отмечает, что первая смена десятой печи была записана в журнал Шарима раньше, чем в ведомость Конклава. Сам Нур предложил третье: единую дирекцию, которой подчинялись бы все печи, включая десятую, - и впервые за историю посредничества сказал это как своё мнение, а не как итог спора.\n\nКнига завершает четвёртую часть словами, которые секретарь приписывает Дарбану: \"Печь мы построим. Кому она достанется, строить не нам.\" Пока стройка идёт поэтапно - товарищество, основание, кладка, первая плавка, - у Конклава есть время решить. Книга не уверена, что времени столько, сколько кажется."
 ADISCORD_shl_book.5.t: "Книга печей. Соседи"
 ADISCORD_shl_book.5.d: "Пятая часть Книги печей написана на другой бумаге: её вели не в архиве Конклава, а в канцелярии посланников, и она пахнет дорогой. Секретари переписали её в Книгу, потому что ни одна печь Шахрабада не горит сама по себе. Вода приходит с запада, дорога уходит на восток, а с юга приходят те, кто считает металл Шахрабада своим.\n\nКейзан. Собрание арычных общин не имеет столицы и не хочет её. Общины обслуживают свои участки кяризов - подземных каналов, веками выводивших воду с гор в пустыню, - и договариваются об общих работах через делегатов. Кяризы Кейзана питают печи Арбина, Сафира и Лорана, и Книга честно пишет, что Шахрабад никогда за это не платил: вода текла, пока текла. Общины могут закрыть отводы, и тогда три печи из девяти начинают считать часы до перегрева. Конклав может купить квоту, пробурить артезианские скважины или взять головные колодцы силой; города и советы смен предлагают четвёртое - братство кяризов, где воду и металл делят собрания. Книга отмечает, что Кейзан помнит каждое обещание домов и ни одному не верит.\n\nВейр. Торговая палата стеклянных портов не владеет землёй, зато владеет весами. Металл Шахрабада идёт к морю по дороге Кердана и проходит через порты Вейра, и палата берёт сбор с каждого вагона с тех пор, как существуют вагоны. Сбор невелик, но он уменьшает выручку всех девяти печей, и Книга пишет, что дома ссорились из-за него чаще, чем из-за воды. Палату можно сделать партнёром, дав ей долю в вывозе; можно обойти собственной гаванью; можно снять весы силой в ограниченной войне за ключ к морю. Книга замечает, что палата торгует и не воюет - пока ей не приходится."
 ADISCORD_shl_book.15.d: "Мазар. Палата общего пайка - самый странный сосед Шахрабада, и Книга признаёт, что секретари долго не понимали его. Палата не покупает и не продаёт: она распределяет воду и припасы пустыни по принципу общей пользы, и шахрабадский металл считает частью этого пайка - так же, как воду своих цистерн. Получив отказ, палата не торгуется; она даёт шестьдесят дней и переходит границу Зарханского округа. Книга описывает три прежних случая: дважды Шахрабад платил, один раз встретил отряды Мазара подготовленными позициями и пережил это. После каждого случая палата возвращалась с новым расчётом.\n\nДальше на юг - Кадир, Рахма и Сардан: караванный тракт, Круг колодцев и дозоры сухого русла. Книга называет их не соседями, а дорогой: по ним Шахрабад и Светлогорье смотрят друг на друга через пустыню, не имея общей границы. Они станут должниками, членами договора, подданными дирекции или ленами домов - в зависимости от того, кто придёт первым и с чем.\n\nСветлогорье. Нефтяной Север продаёт печам топливо и может перекрыть его эмбарго; наместническая лестница Светлогорья - единственная сила Юга, равная Конклаву. Книга пишет об этом коротко, потому что секретари знали мало, и честно: на Юге будет один сюзерен, и им станет либо Шахрабад, либо Светлогорье. Нейтральный договор двух равных невозможен не потому, что его не хотят, а потому, что пустыня между ними не бывает ничьей.\n\nПоследняя запись Книги печей сделана в год, когда заложили десятую печь. Секретарь не подписал её. Она гласит: \"Печи горят. Кому - решат те, кто читает эту книгу.\""
 ADISCORD_SHL_news.1.t: "Шахрабад: Конклав десяти"
 ADISCORD_SHL_news.1.d: "Из Хазара сообщают: Конклав Шахрабада ратифицировал устав Конклава десяти. Товарищество мастеров и инженеров, построившее десятую печь в Девятипечье, признано десятым наследственным домом с креслом и гербом в зале Конклава. Джалиль Нур остаётся посредником, а глава кабинета - секретарь Амин Рашад - объявил, что картель Золотых ворот отныне торгует металлом от имени всех десяти печей.\n\nПосланники Торговой палаты Вейра присутствовали при ратификации и назвали её хорошей новостью для портов. Собрание арычных общин Кейзана не прислало никого. В рабочих кварталах Шахрабада ратификацию встретили тихо: советы смен не выступили против, но дежурный мастер Шарима Салима Дарзи записала в журнал, что десятый герб висит над печью, которую строили её люди.\n\nСоседи Шахрабада отмечают, что Конклав десяти говорит языком договоров и кредитов, и ждут первых предложений. Светлогорье пока не ответило."
 ADISCORD_SHL_news.1.a: "Десять гербов."
 ADISCORD_SHL_news.2.t: "Шахрабад: Южный договор"
 ADISCORD_SHL_news.2.d: "Из Хазара сообщают: Конклав Шахрабада ратифицировал Южный договор. Городские собрания получили представительство, и впервые за историю Конклава печать приняла не рука дома: главой государства стала Мариам Арбин, председатель городских собраний и дочь Хосрова Арбина, главы первого дома. Джалиль Нур передал ей кресло посредника по акту, зачитанному вслух; её отец на передачу не пришёл.\n\nНовое правительство объявило открытые часы приёма, публикацию протоколов и хартии колодцев для соседей. Собрание арычных общин Кейзана прислало делегатов и названо первым приглашённым членом договора. Торговая палата Вейра ответила сдержанно; Палата общего пайка Мазара - молчанием.\n\nДома сохранили печи, но не голос над выручкой. Голшан Лоран назвал договор опытом, который оплатят Золотые ворота. Советы смен поддержали ратификацию; гербы в зале остались на стенах, но ниже кресел делегатов."
 ADISCORD_SHL_news.2.a: "Договор подписан."
 ADISCORD_SHL_news.3.t: "Шахрабад: Дирекция печей"
 ADISCORD_SHL_news.3.d: "Из Хазара сообщают: Конклав Шахрабада ратифицировал Дирекцию печей. Все девять главных печей и десятая в Девятипечье переходят государству; Джалиль Нур принял печать как директор печей и назначил главой кабинета Рауфа Дарбана, главу инженерного дома Дарбан. Первым распоряжением Дирекции стала единая смета всех печей и график поставок для общегосударственной стражи Армана Теймура.\n\nДома сохранили доходы по концессиям, но не право распоряжаться печами. Дарий Сафир и Голшан Лоран покинули зал до конца чтения акта; Бехруз Вейран передал гвардии пограничного дома в общий реестр под протест. Советы смен получили ровные смены и надзор.\n\nСоседи прочитали ратификацию внимательно. Железный Шахрабад объявил, что спор о кяризах, сборах и пайке - теперь дело одного приказа, а не девяти домов. Кейзан, Вейр и Мазар ждут ультиматумов; Светлогорье перечитывает договоры о топливе."
 ADISCORD_SHL_news.3.a: "Один приказ."
 ADISCORD_SHL_news.4.t: "Шахрабад: Совет гербов"
 ADISCORD_SHL_news.4.d: "Из Хазара сообщают: после Ночи гербов Конклав Шахрабада признал регентство. Дарий Сафир, глава богатейшего дома, принял печать как регент Совета гербов; Джалиль Нур остаётся посредником по имени. Гвардии Бехруза Вейрана сняли посты с мостов и телеграфа Хазара лишь после того, как акт был подписан. Регент назвал меру временной и не назвал срока.\n\nВсе печи возвращены домам вместе с привилегиями; городские комиссии распущены, советы смен не признаны, залоги выручки объявлены основой казны. Мариам Арбин покинула Хазар; Салима Дарзи, дежурный мастер Шарима, не покинула печи и не подписала ничего.\n\nСоседи встретили новость по-разному. Престол Кадира прислал поздравления первым. Торговая палата Вейра напомнила о долгах. Собрание арычных общин Кейзана закрыло отводы на день - в знак траура по Конклаву, как сказано в письме. Светлогорье отметило, что говорить теперь придётся с одним домом, а не с девятью."
 ADISCORD_SHL_news.4.a: "Временная мера."
 ADISCORD_SHL_news.5.t: "Шахрабад: Коммуна огня"
 ADISCORD_SHL_news.5.d: "Из Хазара сообщают: после выигранной холодной стачки Конклав Шахрабада признал Совет смен. Советы при главных печах взяли печи, и дежурный мастер Салима Дарзи из Шарима подписала акт от имени коммуны. Гербы девяти домов сняли со стены зала; на их месте повесили рабочие журналы. Джалиль Нур передал печать и ушёл; Амин Рашад сдал её и остался при архиве.\n\nДома ответили по-разному: Дарий Сафир и Бехруз Вейран уехали из Шахрабада, Голшан Лоран торгует металлом коммуны за комиссию, Хосров Арбин сдал печь совету и остался при ней как мастер кяризов. Мариам Арбин ведёт собрания, но подписывает за них коммуна.\n\nСоседи встревожены. Собрание арычных общин Кейзана первым ответило согласием на братство кяризов. Торговая палата Вейра закрыла порты для делегатов советов. Палата общего пайка Мазара не ответила. Светлогорье усилило охрану нефтяных промыслов: советы смен уже пишут туда."
 ADISCORD_SHL_news.5.a: "Печи рабочим."
 ADISCORD_SHL_news.6.t: "Шахрабад объявил ограниченную войну"
 ADISCORD_SHL_news.6.d: "Из Хазара сообщают: Конклав Шахрабада впервые объявил ограниченную войну соседу. Спор, который прежде решали посланники Рамина Фарзана, письма домов и шестидесятидневные сроки, Конклав решил стражей: общегосударственная стража Армана Теймура и гвардии пограничного дома Вейран выступили к границе под одним приказом. Девять домов подписали объявление вместе - такого Хазар не видел давно.\n\nОбъявление называет цели войны ограниченными: колодцы, дорога или цистерны, а не столица соседа. Шахрабад обещает мир на прежних условиях тем, кто его примет, и перемирие, если война затянется. Соседи сосчитали срок и поняли, что Конклав не рассчитывает на долгий поход.\n\nКейзан, Вейр и Мазар получили извещения в один день. Светлогорье заметило, что Шахрабад научился воевать одним приказом, и запомнило дату."
 ADISCORD_SHL_news.6.a: "Срок пошёл."
 ADISCORD_SHL_news.7.t: "Корона Юга"
 ADISCORD_SHL_news.7.d: "Из Хазара сообщают: Шахрабад принял корону Юга. Война за Юг закончена, и единственным сюзереном пустынь между кяризами Кейзана и нефтяным поясом Светлогорья стал Конклав печей. Кадир, Рахма и Сардан, Кейзан, Вейр и Мазар признали первенство Хазара каждый на своих условиях - договором, концессией, леном или советом, - и ни одно из них не оспаривает корону.\n\nСветлогорье, единственный соперник Шахрабада за Юг, более не претендует на пустыни. Нефтяной Север сохранил промыслы, но потерял наместническую лестницу, и его топливо теперь идёт к печам по условиям Хазара.\n\nПечи горят. Кто подписал корону - Джалиль Нур, Мариам Арбин, Дарий Сафир или дежурный мастер советов смен, - соседи узнали из текста акта. Закон непрерывного огня впервые действует за пределами Шахрабада."
 ADISCORD_SHL_news.7.a: "Юг един."
 ADISCORD_SHL_news.8.t: "Южный поход отражён"
 ADISCORD_SHL_news.8.d: "Из Хазара сообщают: поход на Шахрабад с юга отражён. Отряды Палаты общего пайка, перешедшие границу Зарханского округа ради своего пайка, остановлены у печного округа и отошли к цистернам. Общегосударственная стража Армана Теймура держала подготовленные позиции, гвардии пограничного дома Вейран первыми приняли удар, печи Дарбана и Шарима отливали металл для фронта, не останавливая смен.\n\nТребование пайка снято. Шахрабад впервые за историю Конклава встретил соседа не платежом и не письмом, а одним приказом для девяти домов, и соседи это заметили. Собрание арычных общин Кейзана и Торговая палата Вейра пересматривают свои расчёты; Светлогорье отмечает, что печи умеют защищаться.\n\nВ Хазаре Лейла Надири внесла войну в промышленную ведомость отдельной строкой. Печи продолжают работать."
 ADISCORD_SHL_news.8.a: "Печи устояли."

