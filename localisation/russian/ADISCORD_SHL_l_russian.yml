 SHL_cellar_wines: "Дорогие вина из Шахрабада"
 SHL_cellar_wines_desc: "Бутылки с печатями шахрабадских погребов открывают к городским праздникам. За общим столом находятся места даже для тех, кто обычно приходит на площадь спорить."
 ADISCORD_SHL.206.ten: "Купить 10 000 £infantry_equipment_texticon за 300 £ADISCORD_economy_treasury_texticon."
 SHL_road_buy_ten_tt: "Наш склад получит 10 000 £infantry_equipment_texticon из обоза. Оплата поступит в казну Шахрабада по возвращении каравана."
 ADISCORD_SHL.206.twenty: "Купить 20 000 £infantry_equipment_texticon за 540 £ADISCORD_economy_treasury_texticon."
