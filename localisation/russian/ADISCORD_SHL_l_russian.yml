l_russian:
 industrial_aristocratism: "Промышленный аристократизм"
 industrial_aristocratism_desc: "§YПромышленный аристократизм§!\n\nПраво управлять принадлежит домам, поддерживающим непрерывный огонь промышленных печей. Богатство, наследственное положение и владение производством образуют единое основание власти. Пока печи работают, Конклав сохраняет свои привилегии.\n\nВ Шахрабаде девять промышленных домов делят рынки, сырьё и места в Конклаве. Благополучие правящих семей объявляется плодом их ответственности за производство: рабочим кварталам обещают заработок и снабжение, городам - порядок и защиту, владельцам - неприкосновенность собственности и привычную роскошь.\n\nНо наследственное имя само по себе не удерживает власть. Погасшая печь ставит под сомнение право дома распоряжаться предприятием и говорить от имени города. Спор о ремонте, запасах и рабочих сменах становится спором о том, кому принадлежит Шахрабад и кто вправе требовать отчёта от его хозяев."
 SHL_conclave: "Конклав печей"
 SHL_conclave_desc: "Дома сохраняют наследственные права, пока работают их главные печи. Каждые 28 дней производство расходует сырьё, приносит доход и увеличивает износ. Выберите печь на панели, чтобы организовать поставку, обучение или ремонт. Погашение меняет собственника, но не уничтожает город и его заводы."
 SHL_tenth_project: "Десятая печь"
 SHL_tenth_project_desc: "Товарищество мастеров строит новое производство в промышленном районе [294.GetName]. Каждый этап оплачивается отдельно. Потеря участка или невозможность выдать оплаченный завод возвращает депозит и позволяет повторить работу."
 SHL_panel_title: "КОНКЛАВ ПЕЧЕЙ"
 SHL_panel_totals: "Работает: §Y[?SHL_running_count|0]§! / Голоса: §Y[?SHL_house_votes|0]§! / За нас: §Y[?SHL_crest_support|0]§!"
 SHL_panel_selection: "ВЫБРАНА ПЕЧЬ §Y[?SHL_selected_furnace|0]§!"
 SHL_panel_selected_details: "[SHLGetSelectedOwner] / Износ: §Y[?SHL_selected_wear|0]%§!\nСырьё: §Y[?SHL_selected_stock|0]§! пак. / Резерв: §Y[?SHL_reserve_stock|0]§! пак."
