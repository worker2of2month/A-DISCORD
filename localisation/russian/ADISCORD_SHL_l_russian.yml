 SHL_south_war_dynamic:0 "Поход печей"
 SHL_south_war_dynamic_desc:0 "Всё, что Шахрабад отдал войне за Юг, - заводы, колонны, пайки и клятвы - держится, пока идёт поход."
 SHL_sw_break_the_sands_war_tt:0 "Перебежчика можно склонять уже при поддержке войны ниже §Y40%§!."
 autonomy_SHL_furnace_administration: "Наместничество печей"
 SFD: "Дирекция кяризов"
 SCD: "Дирекция Большого тракта"
 SMD: "Дирекция побережья"
 SOD: "Дирекция нефтяного пояса"
 SFD_DEF: "Дирекция кяризов"
 SFD_ADJ: "Дирекционн."
 SFD_Farhad_Mehr: "Фархад Мехр"
 SFD_Farhad_Mehr_desc: "Фархад Мехр начинал смотрителем подземных водоводов и десятилетиями разбирал споры о воде. Конклав ценит его за точные ведомости и нелюбовь к громким обещаниям. Во главе Дирекции кяризов он намерен подчинить местных старшин единому порядку распределения воды, хотя каждый колодец здесь хранит собственную историю обязательств."
 SCD_DEF: "Дирекция Большого тракта"
 SCD_ADJ: "Дирекционн."
 SCD_Nadir_Vezran: "Надир Везран"
 SCD_Nadir_Vezran_desc: "Надир Везран прошёл путь от станционного диспетчера до начальника военных перевозок. Его назначение на Большой тракт означает приход людей, привыкших отвечать за каждый опоздавший состав. Везран верит в расписание сильнее, чем в клятвы местных правителей, и требует, чтобы распоряжения столицы доходили до самой дальней станции."
 SMD_DEF: "Дирекция побережья"
 SMD_ADJ: "Дирекционн."
 SMD_Laleh_Sorani: "Лале Сорани"
 SMD_Laleh_Sorani_desc: "Лале Сорани руководила портовой канцелярией, где встречались интересы судовладельцев, таможни и складских артелей. Она умеет выслушать всех и оставить последнее слово за собой. Получив прибрежное наместничество, Сорани переносит эту привычку на целый край: капитаны могут спорить о фрахте, но гавани должны признавать одну власть."
 SOD_DEF: "Дирекция нефтяного пояса"
 SOD_ADJ: "Дирекционн."
 SOD_Bahram_Kord: "Бахрам Корд"
 SOD_Bahram_Kord_desc: "Бахрам Корд вырос среди буровых бригад и выдвинулся во время тяжёлых промысловых аварий. Рабочие помнят, что он лично спускался к повреждённым насосам; управляющие помнят его непримиримость к сокрытым потерям. Наместник нефтяного пояса смотрит на подчинённые города как на звенья одного большого промысла, которому нельзя останавливаться."
 SHL_integrate_furnace_administration_tt: "После завершения оформления земли сателлита распределяются между прямыми владениями Шахрабада и наместничествами печей по новой карте, а его армия переходит Дирекции. При прекращении зависимости до завершения операции оплата возвращается."
 SDA: "Дирекция Сухого русла"
 SDA_DEF: "Дирекция Сухого русла"
 SDA_ADJ: "Дирекционн."
 SDA_Samira_Radan: "Самира Радан"
 SDA_Samira_Radan_desc: "Самира Радан составляла дорожные соглашения между караванными дворами Сардана и Рахмы. Она знает, где заканчивается власть печати и начинается слово проводника. Назначенная в Дирекцию Сухого русла, Радан связывает разрозненные поселения сетью договорённостей, но за её спокойными переговорами неизменно стоит воля Шахрабада."
# ----- Under the namestnik's seal: defeat chapter -----
 SHL_seal_conclave: "Конклав под печатью"
 SHL_seal_conclave_desc: "Последняя сессия Конклава проходит при закрытых дверях. На столе председателя лежит печать наместника, и каждый указ дома подписывают под её оттиском. Старики молчат, молодые смотрят в окна, где над Хазаром поднимается чужой флаг."
 SHL_seal_count_the_cold: "Счёт остывших печей"
 SHL_seal_count_the_cold_desc: "Мастера обходят цеха с фонарями и мелом. На каждой остывшей печи появляется цифра, на каждой живой - имя смены, которая её удержала. Счёт выходит горьким, но впервые с войны он честный."
 SHL_seal_houses_in_mourning: "Дома в трауре"
 SHL_seal_houses_in_mourning_desc: "Над воротами девяти домов висят чёрные полотна. Гвардия, ушедшая на север, вернулась не вся, и вдовы стоят у дверей Конклава, требуя ответа: кто заплатит за кровь, пролитую ради чужого поражения."
 SHL_redeem_furnaces_of_the_lease: "Печи в аренде"
 SHL_redeem_furnaces_of_the_lease_desc: "Наместник не гасит печи - он берёт их в аренду. Унизительный договор оставляет Шахрабаду огонь, мастеров и надежду вернуть своё по одной печи. Конклав подписывает его молча: живой компромисс лучше мёртвой гордости."
 SHL_cold_fire: "Холодный огонь"
 SHL_cold_fire_desc: "В золе кварталов тлеют угли. Сменщики шепчутся у остывших печей, курьеры носят записки в подошвах, а старые мастера учат молодых держать язык за зубами. Огонь не погас - он ушёл под пепел и ждёт ветра."
 SHL_redeem_lease_ledger: "Арендная книга"
 SHL_redeem_lease_ledger_desc: "В подвале казначейства заводят толстую книгу в кожаном переплёте. В ней записан каждый слиток, ушедший наместнику, и каждая печь, которую город намерен вернуть. Писцы называют её книгой долга, мастера - книгой надежды."
 SHL_redeem_namestnik_audience: "Приём у наместника"
 SHL_redeem_namestnik_audience_desc: "Делегация Конклава ждёт в приёмной резиденции три часа. Наместник выслушивает её стоя, долго вертит в руках прошение о безопасности кварталов и, к общему удивлению, приглашает мастеров остаться к чаю."
 SHL_redeem_by_coin: "Выкуп монетой"
 SHL_redeem_by_coin_desc: "Дома распечатывают семейные сундуки. Серебро, отложенное на свадьбы и похороны, уходит в казну выкупа: лучше заплатить сейчас, чем годами смотреть, как чужие руки черпают из своих печей."
 SHL_redeem_by_service: "Выкуп службой"
 SHL_redeem_by_service_desc: "Денег у Шахрабада нет, но есть руки. У горна смены и мастера до глубокой ночи спорят об одном слове - кабала. К утру спор стихает, и мастера выходят к печи без жалоб."
 SHL_redeem_quiet_quarters: "Тихие кварталы"
 SHL_redeem_quiet_quarters_desc: "Конклав обещает кварталам работу вместо патрулей. На окраине Хазара закладывают мастерские, и подростки, вчера бросавшие камни в чужих солдат, сегодня носят кирпич."
 SHL_redeem_guarantor_houses: "Дома-поручители"
 SHL_redeem_guarantor_houses_desc: "Главы домов ставят печати под поручительством: если город не выплатит долг, ответят их имена. Старые соперники впервые сидят за одним столом и подписывают одну бумагу."
 SHL_redeem_supervised_repairs: "Ремонт под надзором"
 SHL_redeem_supervised_repairs_desc: "Инженеры наместника ходят по цехам с блокнотами, и мастера скрипят зубами. Но ремонт идёт, кирпич привозят вовремя, а дороги к печам впервые за годы засыпают щебнем."
 SHL_redeem_charter: "Выкупленная хартия"
 SHL_redeem_charter_desc: "Последний оттиск печати наместника срезают с хартии Конклава ножом для бумаги. Над площадью Хазара звонят колокола, и мастера несут к печам свежие венки. Шахрабад заплатил за свою свободу - монетой, службой и терпением."
 SHL_cold_ash_cells: "Ячейки в золе"
 SHL_cold_ash_cells_desc: "В каждой смене находятся трое, кто знает больше остальных. Они встречаются у золоотвалов, где шум вентиляторов глушит голоса, и учатся остужать печь так, чтобы надсмотрщик ничего не заметил."
 SHL_cold_quarter_couriers: "Курьеры кварталов"
 SHL_cold_quarter_couriers_desc: "Мальчишки-водоносы и торговки лепёшками переносят по городу больше, чем воду и хлеб. Сеть курьеров связывает кварталы, и слухи о патрулях опережают сами патрули."
 SHL_cold_hidden_armouries: "Тайные оружейные"
 SHL_cold_hidden_armouries_desc: "Под полами старых складов роют ниши, стены выкладывают в два кирпича. Винтовки, которые должны были уйти наместнику, ложатся в промасленную ветошь и ждут своего часа."
 SHL_cold_letters_to_the_sands: "Письма в пески"
 SHL_cold_letters_to_the_sands_desc: "Караванщики увозят в пустыню запечатанные письма. Шахрабад напоминает соседям: сегодня печать наместника лежит на его печах, а завтра может лечь на их колодцы."
 SHL_cold_shifts: "Холодные смены"
 SHL_cold_shifts_desc: "Ночные смены работают медленнее положенного, и плавка уходит не туда, куда записано в ведомости. Надсмотрщики жалуются на износ, а в тайниках прибавляется металла."
 SHL_cold_desert_drill: "Учения в барханах"
 SHL_cold_desert_drill_desc: "Под видом охоты и перегона скота молодёжь кварталов уходит в барханы. Там ветераны северной войны учат её стрелять, окапываться и уходить от погони по песку."
 SHL_cold_raid_martyrs: "Мученики облав"
 SHL_cold_raid_martyrs_desc: "Каждая облава оставляет новые имена на стенах кварталов. Матери арестованных приносят хлеб к воротам тюрьмы, а город учится молчать ещё крепче."
 SHL_cold_night_of_fire: "Ночь холодного огня"
 SHL_cold_night_of_fire_desc: "В полночь гаснут все фонари Хазара, и на крышах загораются сигнальные костры. Из тайников достают винтовки, из подвалов выходят ячейки. Холодный огонь поднимается из-под пепла."
 SHL_cold_fire_without_masters: "Огонь без хозяев"
 SHL_cold_fire_without_masters_desc: "Чужие гарнизоны ушли, и печи горят для тех, кто их отстоял. На стене Конклава высекают имена павших, а под ними - слова: огонь не принадлежит никому, кроме тех, кто его хранит."
 SHL_cold_embers_under_seal: "Угли под печатью"
 SHL_cold_embers_under_seal_desc: "Восстание подавлено, и печать наместника снова лежит на всех девяти печах. Но пленных отпускают по домам, а в золе кварталов ещё тлеют угли. Шахрабад будет возвращать свою свободу медленно, но он её не забыл."
 SHL_seal_terms_tt: "Условия аренды: в аренде у наместника §Y[?SHL_seal_leased_count|0]§! печей, его доля денежной выручки арендованной печи - §Y[?SHL_seal_lease_share|%0]§!, выкуп одной печи - §Y[?SHL_seal_buyback_price|0]§! £ADISCORD_economy_treasury_texticon. За последний цикл наместник получил §Y[?SHL_seal_cycle_lease|0]§! £ADISCORD_economy_treasury_texticon."
 SHL_seal_stock_free_sites_tt: "Каждая работающая печь под контролем Шахрабада вне аренды: §G+1§! £SHL_packet_texticon на склад."
 SHL_seal_unrest_down_tt: "Недовольство кварталов: §G-10§!."
 SHL_cold_heat_opened_tt: "Появляется подпольный жар: §Y10§! из §Y100§!. Он растёт с каждым циклом печей; от §Y30§! начинаются облавы, от §Y80§! можно поднять восстание."
 SHL_seal_buy_back_unlock_tt: "Арендованную печь, выбранную на карте печей, можно выкупить у наместника по прошению; наместник может отказать."
 SHL_redeem_namestnik_audience_tt: "Если Хазар принадлежит Шахрабаду и контролируется им: §G+1§! дивизия печного ополчения в Хазаре."
 SHL_seal_coin_price_tt: "Цена выкупа арендованной печи: §G-20%§!."
 SHL_seal_service_unlock_tt: "Арендованную печь можно выкупить без денег: она отдаёт наместнику всю выручку за §Y4§! рабочих цикла, после чего возвращается Шахрабаду."
 SHL_redeem_quiet_quarters_tt: "Недовольство кварталов: §G-15§!."
 SHL_seal_bond_unlock_tt: "Дома-поручители дают заём на выкуп: §G250§! £ADISCORD_economy_treasury_texticon сразу, затем §R25§! £ADISCORD_economy_treasury_texticon за каждый цикл печей в течение §Y12§! циклов."
 SHL_redeem_guarantor_houses_tt: "Верность каждого дома: §G+15§! (давление гербов §G-15§!)."
 SHL_seal_maintain_leased_tt: "Каждая арендованная печь: износ §G-20§!, §G+1§! £SHL_packet_texticon на склад."
 SHL_seal_all_redeemed_tt: "Все печи выкуплены из аренды (сейчас в аренде: §Y[?SHL_seal_leased_count|0]§!)."
 SHL_cold_forge_unlock_tt: "Ячейки могут остудить выбранную арендованную печь: её следующая плавка уйдёт в тайники, а не наместнику."
 SHL_cold_heat_5_tt: "Подпольный жар: §Y+5§! (сейчас §Y[?SHL_underground_heat|0]§!/80)."
 SHL_cold_heat_8_tt: "Подпольный жар: §Y+8§! (сейчас §Y[?SHL_underground_heat|0]§!/80)."
 SHL_cold_heat_10_tt: "Подпольный жар: §Y+10§! (сейчас §Y[?SHL_underground_heat|0]§!/80)."
 SHL_cold_growth_tt: "Подпольный жар растёт на §Y1§! быстрее за каждый цикл печей."
 SHL_cold_free_cell_tt: "Ячейки: §G+1§!. В тайники: §G1500§! £infantry_equipment_texticon."
 SHL_cold_pledges_sent_tt: "Письма получат независимые соседи вне союза со Светлогорьем: [EFL.GetName], [AZH.GetName], [KYZ.GetName], [GLP.GetName] и [MZR.GetName]. Каждый, кто пообещает винтовки, вступит в войну, когда Шахрабад поднимется."
 SHL_cold_courier_unlock_tt: "К соседям, промолчавшим в ответ на письмо, можно отправить гонца снова."
 SHL_cold_shifts_tt: "Каждая работающая арендованная печь под контролем Шахрабада: следующая плавка уйдёт в тайники (§G300§! £infantry_equipment_texticon), а не наместнику; износ §R+6§!. Недовольство кварталов: §R+5§!."
 SHL_cold_desert_drill_tt: "Ячейки: §G+1§!."
 SHL_cold_raid_guard_tt: "Вероятность облавы в каждом цикле печей: §G-40%§!."
 SHL_cold_heat_readout_tt: "Подпольный жар не ниже §Y80§! (сейчас §Y[?SHL_underground_heat|0]§!)."
 SHL_cold_capital_held_tt: "Хазар принадлежит Шахрабаду и контролируется им."
 SHL_cold_cache_free_tt: "Ни один тайный склад не строится."
 SHL_cold_rising_tt: "Шахрабад выходит из подчинения Светлогорью и объявляет войну за независимость. Каждая ячейка становится дивизией печного ополчения в Хазаре за §Y3000§! £manpower_texticon (без призывников - §G2700§! £infantry_equipment_texticon в арсенал), винтовки из тайников переходят в арсенал, соседи, давшие обещание, вступают в войну. Исход решит капитуляция одной из сторон."
 SHL_cold_rising_won_tt: "Холодный огонь победил: Шахрабад вышел из-под печати Светлогорья."
 SHL_cold_rising_crushed_tt: "Восстание холодного огня подавлено: печать Светлогорья снова лежит на печах Шахрабада."
 SHL_under_seal: "Под печатью наместника"
 SHL_under_seal_desc: "Печать Светлогорья лежит на столе Конклава, но дома и кварталы ещё ищут, чем расплатиться за свободу и где спрятать огонь."
 SHL_seal_buy_back_furnace: "Выкупить печь"
 SHL_seal_buy_back_furnace_desc: "Казначей Конклава несёт в резиденцию наместника прошение и тяжёлый кошель. В прошении - имя печи, которую дом раздувал поколениями, и имена мастеров, которые ждут её у ворот цеха."
 SHL_seal_redeem_by_service: "Отработать печь"
 SHL_seal_redeem_by_service_desc: "Мастера надевают старые цеховые кафтаны и несут прошение на холм, к резиденции. За их спинами смены молча стоят у горна и ждут ответа."
 SHL_cold_forge: "Остудить печь"
 SHL_cold_forge_desc: "Ночная смена работает медленнее положенного, и металл уходит не туда, куда записано в ведомости. Надсмотрщик утром найдёт только остывший шлак."
 SHL_seal_house_bond: "Заём домов-поручителей"
 SHL_seal_house_bond_desc: "Главы домов открывают семейные кассы под общее поручительство. Серебро, отложенное на свадьбы и приданое, ложится на стол казначея, и каждый глава своей рукой вписывает в книгу, сколько дал."
 SHL_cold_hidden_cache: "Тайный склад"
 SHL_cold_hidden_cache_desc: "Под полом старого склада роют нишу, стены кладут в два кирпича. Работают ночью, без фонарей, а землю выносят в корзинах из-под фиников."
 SHL_cold_courier_to_sands: "Гонец в пески"
 SHL_cold_courier_to_sands_desc: "Ответа на первое письмо не было. Караванщик снова уходит в барханы с запечатанным свёртком в седельной сумке."
 SHL_seal_cost_buyback: "§Y[?SHL_seal_buyback_price|0]§! £ADISCORD_economy_treasury_texticon / §Y25§! £political_power_texticon"
 SHL_seal_cost_buyback_blocked: "§R[?SHL_seal_buyback_price|0]§! £ADISCORD_economy_treasury_texticon / §R25§! £political_power_texticon"
 SHL_seal_cost_buyback_tooltip: "§Y[?SHL_seal_buyback_price|0]§! £ADISCORD_economy_treasury_texticon / §Y25§! £political_power_texticon\nЦена удерживается в залоге до ответа Светлогорья."
 SHL_seal_cost_service: "§Y25§! £political_power_texticon"
 SHL_seal_cost_service_blocked: "§R25§! £political_power_texticon"
 SHL_seal_cost_service_tooltip: "§Y25§! £political_power_texticon\nОчки удерживаются до ответа Светлогорья."
 SHL_cold_cost_cache: "§Y150§! £ADISCORD_economy_treasury_texticon / §Y30§! £political_power_texticon"
 SHL_cold_cost_cache_blocked: "§R150§! £ADISCORD_economy_treasury_texticon / §R30§! £political_power_texticon"
 SHL_cold_cost_cache_tooltip: "§Y150§! £ADISCORD_economy_treasury_texticon / §Y30§! £political_power_texticon\nЦена удерживается, пока склад строится."
 SHL_seal_overlord_present_tt: "Шахрабад подчинён Светлогорью."
 SHL_seal_office_free_tt: "У наместника нет другого прошения Шахрабада."
 SHL_seal_petition_cooldown_tt: "Наместник не отказывал по этой печи в последние §Y180§! дней."
 SHL_seal_service_running_tt: "Печь ещё не отрабатывает выкуп."
 SHL_seal_buy_back_start_tt: "Цена выкупа и §Y25§! £political_power_texticon удерживаются в залоге, пока Светлогорье решает. При согласии залог уходит наместнику, а печь возвращается Шахрабаду; при отказе залог возвращается. Прошение без ответа считается принятым."
 SHL_seal_service_start_tt: "§Y25§! £political_power_texticon удерживаются, пока Светлогорье решает. При согласии печь отдаёт наместнику всю денежную выручку за §Y4§! рабочих цикла и затем возвращается Шахрабаду; при отказе очки возвращаются. Прошение без ответа считается принятым."
 SHL_seal_petition_result_tt: "Прошение решено ответом Светлогорья: при согласии залог уходит наместнику, а печь выкупается или начинает отработку; при отказе залог возвращается, а отказ закрывает печь для прошений на §Y180§! дней. Прошение без ответа считается принятым."
 SHL_seal_refund_tt: "Прошение отменено: залог и §Y25§! £political_power_texticon возвращаются."
 SHL_cold_forge_pending_tt: "Следующая плавка этой печи ещё не обещана тайникам."
 SHL_cold_forge_tt: "Следующая плавка печи уходит в тайники: §G300§! £infantry_equipment_texticon вместо доли наместника, износ §R+6§!. Подпольный жар: §Y+4§!."
 SHL_seal_bond_open_tt: "Прежний заём домов погашен."
 SHL_seal_bond_tt: "Казна: §G+250§! £ADISCORD_economy_treasury_texticon сразу. Возврат: §R25§! £ADISCORD_economy_treasury_texticon за каждый цикл печей в течение §Y12§! циклов, всего §R300§! £ADISCORD_economy_treasury_texticon."
 SHL_cold_before_rising_tt: "Восстание ещё не началось."
 SHL_cold_cells_cap_tt: "Ячеек меньше §Y6§! (сейчас §Y[?SHL_cold_cache_cells|0]§!)."
 SHL_cold_cache_start_tt: "Склад строят в тайне; при отмене цена возвращается полностью."
 SHL_cold_cache_result_tt: "Ячейки: §G+1§!. Подпольный жар: §Y+2§!."
 SHL_cold_cache_refund_tt: "Склад брошен: §G150§! £ADISCORD_economy_treasury_texticon и §G30§! £political_power_texticon возвращаются."
 SHL_cold_courier_open_tt: "Сосед независим, не связан со Светлогорьем союзом, не воюет ни с ним, ни с Шахрабадом и ещё не ответил на письмо."
 SHL_cold_courier_tt: "Сосед получит письмо Шахрабада и решит, обещать ли винтовки. Давший обещание вступит в войну, когда Шахрабад поднимется."
 SHL_seal_houses_sheltered_tt: "Верность каждого дома: §G+20§! (давление гербов §G-20§!)."
 SHL_seal_houses_pay_tt: "Казна: §G+200§! £ADISCORD_economy_treasury_texticon. Верность каждого дома: §R-15§! (давление гербов §R+15§!). Поддержка городов: §G+10§!."
 SHL_seal_consent_coin_tt: "При решении прошения Светлогорье получит §G[?FROM.SHL_seal_petition_deposit|0]§! £ADISCORD_economy_treasury_texticon, а печь вернётся Шахрабаду."
 SHL_seal_consent_service_tt: "Печь будет отдавать Светлогорью всю денежную выручку за §Y4§! рабочих цикла, затем вернётся Шахрабаду."
 SHL_seal_lease_closes_contract_tt: "Это последняя арендованная печь: с её возвращением Шахрабад выходит из подчинения Светлогорью."
 SHL_seal_lease_closes_charter_tt: "Это последняя арендованная печь: с её возвращением нефтяная хартия сменяется хозяйственным договором."
 SHL_seal_lease_closes_namestnik_tt: "Это последняя арендованная печь: с её возвращением Шахрабад переходит на нефтяную хартию."
 SHL_seal_refuse_tt: "Залог возвращается Шахрабаду, печь закрыта для прошений на §Y180§! дней."
 SHL_cold_raid_surrender_tt: "Ячейки: §R-1§!. Винтовки в тайниках: §R-50%§!. Подпольный жар: §Y-10§!."
 SHL_cold_raid_deeper_tt: "Подпольный жар: §Y-20§!. Недовольство кварталов: §R+10§!."
 SHL_cold_pledge_given_tt: "Когда Шахрабад поднимется, мы вступим в войну против Светлогорья на его стороне. Подпольный жар Шахрабада: §Y+5§!."
 SHL_recipient_lease: "Аренда"
 SHL_seal_story_contract: "Светлогорье берёт немного: три печи - Сафира, Байрата и Шарима - уходят в аренду, а остальное остаётся городу. Купцы наместника говорят о договоре, а не о добыче, и это слово звучит в зале почти как утешение."
 SHL_seal_story_charter: "Нефтяная хартия забирает четыре печи: к Сафиру, Байрату и Шариму прибавляется горн Арбина у кяризов. Остальные остаются Конклаву, но каждый понимает, что хартию пишут для того, чтобы её можно было переписать."
 SHL_seal_story_puppet: "Шесть печей из девяти уходят в аренду - две трети огня Шахрабада. Наместник оставляет городу Лоран, Кердан и Дарбан, словно кость, брошенную собаке, и напоминает, что щедрость Светлогорья не бесконечна."
 SHL_seal_story_namestnik: "Канцелярия наместника забирает все девять печей и десятую вместе с ними. Дома остаются хозяевами только на бумаге: каждый слиток, каждая плавка и каждый пакет руды теперь записываются в книгах Светлогорья."
 ADISCORD_SHL.200.t: "Последняя сессия Конклава"
 ADISCORD_SHL.200.d: "Зал Конклава в Хазаре впервые за сто лет заседает без гербов над креслами. Их сняли ночью по приказу офицеров Светлогорья, и теперь на голых крюках висят только тени. Девять глав домов сидят там, где сидели их отцы, но перед председателем лежит не хартия, а печать наместника - тяжёлый медный круг с чужим солнцем.\n\nСекретарь наместника читает условия ровным голосом, не поднимая глаз. [SHLGetSealTermsStory]\n\nКогда чтение заканчивается, никто не встаёт. Старый Арбин долго смотрит на свои руки, потом берёт перо и подписывает первым. За ним, один за другим, подписывают остальные. Печи за окнами горят по-прежнему, но в эту ночь мастера впервые не знают, для кого льют металл."
 ADISCORD_SHL.200.a: "Печать поставлена."
 ADISCORD_SHL.201.t: "Судьбы домов"
 ADISCORD_SHL.201.d: "У ворот Конклава с утра стоят вдовы гвардейцев. Они пришли не плакать: в руках у них списки - имена мужей и сыновей, ушедших на север под гербами домов и не вернувшихся. Каждая требует ответа: кто заплатит за кровь, пролитую ради чужого поражения?\n\nВ зале спорят до хрипоты. Казначей предлагает взять долг с самих домов - пусть гербы, отправлявшие людей в поход, раскроют свои сундуки. Старшие главы отвечают, что дома и так потеряли больше всех, и если Конклав сейчас отвернётся от них, завтра никто не встанет у печей по зову герба.\n\nДо вечера нужно решить, кого Конклав укроет, а с кого спросит."
 ADISCORD_SHL.201.a: "Укрыть дома."
 ADISCORD_SHL.201.b: "Пусть дома платят."
 ADISCORD_SHL.202.t: "Прошение шахрабадских печей"
 ADISCORD_SHL.202.d: "В приёмную наместника в Хазаре приносят прошение, переплетённое в кожу и запечатанное печатью Конклава. Шахрабадцы просят вернуть им одну из арендованных печей. Писцы приложили к прошению опись: годы службы горна, имена мастеров, число плавок, отданных Светлогорью с начала аренды.\n\nСоветники наместника расходятся во мнениях. Одни говорят, что каждая возвращённая печь - шаг к тому дню, когда Шахрабад снова закроет ворота перед чиновниками Светлогорья. Другие напоминают, что казна пуста, а договор, который соблюдают обе стороны, держит Юг крепче гарнизонов. Наместник откладывает бумагу и просит принести чай: ответ нужен до конца недели."
 ADISCORD_SHL.202.a: "Согласиться."
 ADISCORD_SHL.202.b: "Отказать."
 ADISCORD_SHL.203.t: "Облава в холодных кварталах"
 ADISCORD_SHL.203.d: "Перед рассветом в квартал литейщиков входят солдаты Светлогорья. Они ломают двери складов, поднимают половицы в мастерских, выводят на улицу сонных подмастерьев и ставят их лицом к стене. Кто-то донёс: в золе за третьей печью нашли промасленную ветошь, а в ней - затвор от винтовки.\n\nК полудню в квартале не остаётся ни одного дома, куда не заглянули бы чужие офицеры. Старшие ячеек собираются в подвале пекарни и спорят шёпотом. Можно отдать часть тайников, чтобы солдаты ушли с добычей и успокоились. А можно увести людей ещё глубже, оставить кварталам страх и пустые склады - и ждать, пока облава схлынет сама."
 ADISCORD_SHL.203.a: "Отдать тайники."
 ADISCORD_SHL.203.b: "Уйти глубже."
 ADISCORD_SHL.204.t: "Письмо из Шахрабада"
 ADISCORD_SHL.204.d: "Караванщик из Шахрабада привозит запечатанное письмо без подписи. Внутри - несколько строк, написанных старательным почерком писца: город под печатью наместника не забыл своих соседей и просит их не забыть его. Когда Шахрабад поднимется, ему понадобятся винтовки, хлеб и чужие знамёна на его стороне.\n\nПисьмо читают в узком кругу. Одни советники говорят, что Светлогорье, проглотив Шахрабад, рано или поздно потянется и к их колодцам. Другие напоминают, что обещание, данное повстанцам, станет поводом для войны, если наместник о нём узнает. Караванщик ждёт ответа у ворот и делает вид, что торгует финиками."
 ADISCORD_SHL.204.a: "Остаться в стороне."
 ADISCORD_SHL.204.b: "Обещать винтовки."
 ADISCORD_SHL_news.11.t: "[SHLGetSealNewsTitle]"
 SHL_seal_news_title_rising: "Шахрабад поднимается"
 SHL_seal_news_title_free: "Шахрабад сбросил печать"
 SHL_seal_news_title_crushed: "Восстание в Шахрабаде подавлено"
 SHL_seal_news_title_redeemed: "Шахрабад выкупил свои печи"
 ADISCORD_SHL_news.11.d_rising: "В полночь над Хазаром погасли фонари, а на крышах литейных кварталов вспыхнули сигнальные костры. К утру ячейки, которые больше года прятались в золе и подвалах, вышли на улицы с винтовками из тайников. Гарнизоны Светлогорья отступили к воротам, а Конклав объявил, что печать наместника больше не имеет силы.\n\nВ столицах Юга эту новость читают по-разному. Одни видят в ней начало большой войны за пески, другие - отчаяние города, который слишком долго терпел. Ясно одно: Шахрабад снова сам решает, для кого горят его печи, и теперь ему придётся отстоять это решение оружием."
 ADISCORD_SHL_news.11.d_free: "Война за Шахрабад окончена. Светлогорье, исчерпав силы, отзывает гарнизоны из литейных кварталов, а печать наместника, снятая с дверей Конклава, лежит в музее при ратуше рядом со старыми гербами. На площади Хазара мастера жгут арендные книги, и пепел от них уносит ветер с барханов.\n\nСоседи Шахрабада осторожно поздравляют город. Купцы уже подсчитывают, сколько металла пойдёт на рынки без посредников наместника, а военные - сколько стоил городу этот год. Девять печей снова горят для тех, кто их отстоял, и Юг привыкает к мысли, что Шахрабад научился воевать не только чужими руками."
 ADISCORD_SHL_news.11.d_crushed: "Восстание в Шахрабаде подавлено. После недель уличных боёв гарнизоны Светлогорья снова стоят у ворот литейных кварталов, а Конклав подписал новую клятву верности наместнику. Все девять печей переданы в аренду, и чиновники Светлогорья заново переписывают мастеров, склады и плавки.\n\nПленных, к удивлению многих, отпускают по домам. В столицах Юга говорят, что наместник не хочет делать из повстанцев мучеников. Но в кварталах никто не верит, что всё кончено: на стенах ещё видны следы сигнальных костров, а в золе за печами, как шепчутся торговки, ещё тлеют угли."
 ADISCORD_SHL_news.11.d_redeemed: "Шахрабад заплатил за свои печи. Последняя арендная грамота возвращена в Конклав, и оттиск печати наместника срезан с хартии ножом для бумаги. Над площадью Хазара звонят колокола, мастера несут к печам свежие венки, а казначеи домов подсчитывают, во что обошлась городу эта свобода - серебром, службой и годами терпения.\n\nВ Светлогорье новость встречают спокойно: договор исполнен, деньги получены. Соседи же видят в ней урок. Город, проигравший войну, вернул себе огонь, не сделав ни одного выстрела, и теперь торгует металлом так, словно поражения и не было."
 ADISCORD_SHL_news.11.a: "Огонь Шахрабада снова в чужих разговорах."
 SHL_redeem_lease_dynamic: "Печи в аренде"
 SHL_redeem_lease_dynamic_desc: "Шахрабад платит наместнику огнём своих печей и выкупает их одну за другой, пока на хартии Конклава не останется чужой печати."
 SHL_cold_fire_dynamic: "Холодный огонь"
 SHL_cold_fire_dynamic_desc: "Под пеплом кварталов тлеют угли: ячейки учатся, копят винтовки и ждут ночи, когда над Хазаром погаснут фонари."
 SHL_redeemed_conclave: "Выкупленный Конклав"
 SHL_redeemed_conclave_desc: "Конклав вернул свои печи серебром и терпением. Дома, поручившиеся друг за друга, впервые за поколение говорят одним голосом."
 SHL_cold_fire_without_masters_idea: "Огонь без хозяев"
 SHL_cold_fire_without_masters_idea_desc: "Печи горят для тех, кто их отстоял. На стене Конклава высечены имена павших, и никто в Шахрабаде не забудет, чего стоил этот огонь."
 SHL_cold_ashes_idea: "Пепел холодного огня"
 SHL_cold_ashes_idea_desc: "Восстание подавлено, и кварталы молчат. Патрули наместника ходят по улицам днём и ночью, а мастера стоят у печей, не поднимая глаз."
 SHL_cold_fire_faction: "Холодный огонь"

 SHL_conclave_ballot: "Сессия Конклава - [SHLGetBallotLeader]"
 SHL_conclave_ballot_desc: "На столе секретаря лежат две книги. В одной дома расписываются за поставки, в другую писари заносят наказы кварталов. Нур велел оставить между ними место для последнего протокола."
 SHL_ballot_houses: "впереди дома"
 SHL_ballot_cities: "впереди кварталы"
 SHL_ballot_nur: "преимущество у Нура"
 SHL_ballot_open_tt: "Конклав подведёт итоги через §Y280§! дней с открытия сессии. Если отложить этот фокус, сессию созовут в конце первого производственного цикла. Прогноз виден в категории \"$SHL_quarters_and_borders$\"."
 SHL_ballot_result_only_tt: "Конклав завершит этот фокус при соответствующем исходе голосования."
 SHL_ballot_rules_tt: "Сейчас [SHLGetBallotLeader]. Дома побеждают при перевесе гербов, если за поставки голосует больше половины занятых мест (сейчас §Y[?SHL_crest_support|0]§! из §Y[?SHL_house_votes|0]§!). Кварталам нужен перевес на шкале и поддержка городов от §Y30§! (сейчас §Y[?SHL_city_support|0]§!). При равновесии §Y$SHL_house_compromise$§! или §Y$SHL_city_charters$§! дают соответствующей стороне перевес, если у неё есть нужные голоса. Если большинство не собрано, власть получает дирекция Нура."
 SHL_stelander_party: "Связи со Партией Стеландера"
 SHL_stelander_party_desc: "Закупщики партии держат в Хазаре контору у весовой. Рядом с торговыми книгами на их столе лежат письма с фронта."
 SHL_offer_party_rifles: "Предложить Партии 2700 винтовок"
 SHL_offer_party_rifles_desc: "Партийный закупщик просит показать клейма на затворах. Казначей Конклава кладёт перед ним накладную и ждёт подписи."
 SHL_party_diplomacy_open_tt: "Шахрабад независим и может вести переговоры с Партией. Война Партии с Шабратом продолжается."
 SHL_party_funds_tt: "У Партии есть §Y100§! £ADISCORD_economy_treasury_texticon на закупку."
 SHL_party_front_tt: "Решения доступны во время войны Партии Стеландера с Шабратом."
 SHL_party_offer_free_tt: "После последнего предложения прошло 30 дней."
 SHL_party_quote_tt: "Предложить партии §Y2700§! £infantry_equipment_texticon за §Y100§! £ADISCORD_economy_treasury_texticon. Оплата и поставка произойдут при согласии покупателя."
 SHL_party_purchase_tt: "Казна заплатит §R100§! £ADISCORD_economy_treasury_texticon Шахрабаду. На наш склад поступит §G2700§! £infantry_equipment_texticon."
 ADISCORD_SHL.205.t: "Накладная из Хазара"
 ADISCORD_SHL.205.d: "Закупщик прислал в партийный штаб накладную с печатью шахрабадского арсенала. На обороте он приписал от руки, что сам вскрыл один из ящиков и сверил номера винтовок. Поперёк листа остался бурый след от ружейного масла. В штабе бумагу сперва приняли за очередную сводку о недостаче и подшили к донесениям с фронта.\n\nТеперь накладная лежит у казначея. Ветер со двора перелистывает книгу расходов. Посыльный придерживает страницу ладонью и смотрит на дверь: поезд в Хазар отходит вечером, а на станции ему ещё предстоит найти товарный вагон.\n\n[SHLGetPartyInvoice]"
 ADISCORD_SHL.205.a: "Подписать накладную."
 ADISCORD_SHL.205.b: "Закрыть заказ."
 SHL_offer_party_rifles_bulk: "Предложить Партии эшелон из 13 500 винтовок"
 SHL_offer_party_rifles_bulk_desc: "На этот раз партийный закупщик привёл с собой железнодорожника. Пока казначей пересчитывает ящики, тот меряет дверной проём вагона и сверяется с расписанием эшелонов."
 SHL_party_bulk_funds_tt: "У Партии есть §Y300§! £ADISCORD_economy_treasury_texticon на закупку."
 SHL_party_bulk_quote_tt: "Предложить Партии §Y13500§! £infantry_equipment_texticon за §Y300§! £ADISCORD_economy_treasury_texticon. Оплата и поставка произойдут при согласии покупателя."
 SHL_party_bulk_purchase_tt: "Казна заплатит §R300§! £ADISCORD_economy_treasury_texticon Шахрабаду. На наш склад поступит §G13500§! £infantry_equipment_texticon."
 SHL_party_standard_invoice: "В накладной указаны 2700 винтовок. Сумма к оплате из казны составляет 100."
 SHL_party_bulk_invoice: "В накладной указаны 13 500 винтовок. Оптовая цена за всю партию составляет 300 из казны."
 SHL_party_invoice_closed: "Закупочная контора закрыла эту накладную."
 ADISCORD_SHL.205.c: "Подписать накладную на весь эшелон."
 SHL_authorise_party_volunteers: "Разрешить отправку добровольцев к партии"
 SHL_authorise_party_volunteers_desc: "Офицеры гарнизона просят разрешения выступить под партийными знамёнами. Из Шабрата уже пришла нота с требованием назвать фамилии тех, кто подпишет приказ."
 SHL_party_dispatch_tt: "Добровольцев можно отправить Партии Стеландера из своих дивизий через дипломатию. Мандат заканчивается вместе с гражданской войной, а также при вступлении Шахрабада в войну, капитуляции или утрате независимости."
 SHL_party_volunteer_mandate: "Мандат на помощь Партии Стеландера"
 SHL_party_volunteer_mandate_desc: "На приказе стоит печать Конклава. В списках добровольцев против каждой фамилии указана часть, в которую офицер вернётся домой."
 SHL_backed_party: "Шахрабад поддержал наших противников"
 SHL_shahrabad_army: "Армия Шахрабада"
 SHL_shahrabad_army_desc: "У станционной охраны и заводских дружин свои командиры. Когда приходит общий приказ, каждый сперва ждёт печати своего дома.\n\nФокусы \"$SHL_railway_guard$\" и \"$SHL_southern_watch$\" налаживают общее командование. Фокус \"$SHL_conclave_army$\" улучшает подготовку штабов."
 SHL_cartel_influence: "Высокое влияние картелей"
 SHL_cartel_influence_desc: "Поставщики делят заказы ещё до торгов. Пока писцы сверяют накладные, лучшие вагоны и сталь уходят давним партнёрам домов.\n\nКартели теряют часть влияния после фокуса \"$SHL_shift_arbitration$\" или \"$SHL_counting_chamber$\". Фокус \"$SHL_incident_office$\" лишает их оставшихся привилегий."
