 ADISCORD_SHL.110.t: "Пыль на мазарской дороге"
 ADISCORD_SHL.110.d: "Первым заметил перемену погонщик водяного каравана. У мазарских цистерн теперь стояли не сборщики пошлины, а солдаты. Они переписывали объём бочек и спрашивали, сколько дней потребуется, чтобы наполнить их снова. На обратном пути погонщик увидел ещё одну колонну.\n\nНа заседании Конклава никто не назвал это войной. Дома потребовали считать расходы, городские делегаты — готовить убежища, а начальник стражи попросил хотя бы одну ведомость, в которой девять разных командиров означали бы одну армию. Откладывать выбор бесконечно уже нельзя.\n\nДо первого требования остаётся несколько производственных циклов. Можно оплачивать стражу, отдать две плавки под походный обоз или собрать деньги на окончательный расчёт. Если придётся воевать, целью станет коридор двух цистерн, а не бесконечный поход в пустыню."
 ADISCORD_SHL.110.a: "Положить карту рядом с ведомостью."
 ADISCORD_SHL.111.t: "Шахрабад собирает колонны"
 ADISCORD_SHL.111.d: "Из Шахрабада пришло извещение: Конклав начал подготовку похода к двум цистернам. На заводских путях уже разгружают походное снаряжение. Через двадцать восемь дней, если спор не будет закрыт раньше и война не начнётся по иной причине, охрана караванов станет наступающей армией.\n\nМазару предстоит удержать дороги к воде. Потеря обеих цистерн при сохранении шахрабадского пограничья даст противнику возможность навязать ограниченный мир."
 ADISCORD_SHL.111.a: "Готовить подступы."
 ADISCORD_SHL.112.t: "Хартия возвращённых цистерн"
 ADISCORD_SHL.112.d: "Шахрабад предлагает вернуть оба района цистерн под власть Мазара. Условие — добровольное вступление в Южный договор. Ни наместника, ни передачи казны предложение не предусматривает: Мазар сохранит независимость и собственную армию.\n\nЗа военным соглашением может последовать оплаченная Шахрабадом программа восстановления дорог. Её ещё предстоит выбрать и профинансировать отдельно. Отказ оставит прежнюю границу мира; согласие вернёт землю только в том случае, если правительство Шахрабада по-прежнему готово соблюдать договор."
 ADISCORD_SHL.112.a: "Вернуть землю и подписать договор."
 ADISCORD_SHL.112.b: "Оставить действующий мир в силе."
 ADISCORD_SHL.113.t: "На дороге сняли второй шлагбаум"
 ADISCORD_SHL.113.d: "На мазарской дороге встретились два каравана. Первый вёз солдат домой, второй — писарей, которым предстояло заново сверить земельные книги. Цистерны вернулись Мазару; на карте Южного договора появилась ещё одна независимая страна.\n\nТеперь Конклаву предстоит решить, что стоит за подписью. Оплаченное восстановление дорог и, для коммуны, передача оружия соседним общинам превратят военное соглашение в повседневную связь. За эти работы придётся отвечать собственной казной."
 ADISCORD_SHL.113.a: "Открыть ведомость восстановления."
 ADISCORD_SHL.114.t: "Подписи не сошлись"
 ADISCORD_SHL.114.d: "Хартия не вступила в силу: Мазар отказался от предложения либо условия успели измениться до ответа. Передачи земли не произошло. Действующий мир сохраняется.\n\nЕсли обе стороны вновь смогут выполнить свои обязательства, Конклав вернётся к переговорам. До этого распоряжаться районами и начинать собственное восстановление предстоит на основании существующих границ."
 ADISCORD_SHL.114.a: "Сохранить действующие договорённости."
 ADISCORD_SHL.115.t: "То, что осталось после похода"
 ADISCORD_SHL.115.d: "В Конклав принесли последнюю ведомость южной программы. На ней не было победного лозунга: только строки имущества, обязательств и получателей. За каждой строкой стоял выбор, сделанный тогда, когда металл мог стать выручкой, оружием или дорогой.\n\n[SHLGetSouthernEpilogue]\n\nСтрана встретила мазарскую угрозу, определила условия мира и оплатила собственное представление о будущем. Печи продолжат работать; теперь их огонь поддерживает порядок, у которого есть не только герб, но и исполненные обязательства."
 ADISCORD_SHL.115.a: "Закрыть походную ведомость."
 ADISCORD_SHL.73.b: "Вернуть цистерны за концессию."
 ADISCORD_SHL.73.c: "Предложить независимому Мазару хартию."
 SHL_epilogue_house: "Дома вложили военный результат в торговлю и новое производство. Территориальный выбор остался за Конклавом: удерживать коридор или обменять его на концессионные права. Государственный заём не исчезает от одного слова «победа»."
 SHL_epilogue_city: "Городские собрания получили дорогу, за которую заплатили открыто. Если хартия была принята, Мазар остался самостоятельным партнёром; если коридор удержали, его жители получили место в общем политическом пространстве."
 SHL_epilogue_directorate: "Дирекция связала военное командование с новым арсеналом. Приобретённую землю она предпочла удерживать; после менее удачного мира производство восстановили на собственной территории. У приказа теперь есть промышленное обеспечение."
 SHL_epilogue_regent: "Регентство оплатило обучение домовой гвардии и восстановление действующей печи. Её голос снова опирается на работающую смену; непогашенные военные обязательства остаются в ведомости. Привилегия получила и представительство, и обязанность служить."
 SHL_epilogue_commune: "Коммуна оплатила местную дружину собственными рекрутами и оружием. Её получил владелец выбранного района: свои кварталы или независимые мазарские общины после хартии. Солидарность приобрела вес настоящих формирований и проложенного пути."
