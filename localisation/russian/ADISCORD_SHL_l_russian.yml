 ADISCORD_SHL.206.t: "Обоз из Шахрабада"
 ADISCORD_SHL.206.d: "У рыночных весов остановился фургон под выцветшим шахрабадским вымпелом. Приказчик откинул борт, показал образец и раскрыл книгу на чистой строке. Приказчик кладёт у чернильницы две печати. Первой он заверяет денежные сделки, второй - меновые.\n\n[SHLGetRoadInvitation]"
 SHL_road_invitation_open: "На продажу   [SHL.SHLGetRoadLot]\nЦена   75 £ADISCORD_economy_treasury_texticon   или   [SHL.SHLGetRoadBarter]"
 SHL_road_invitation_closed: "Торги окончены. Приказчик закрыл книгу."
 ADISCORD_SHL.206.a: "Отпустить обоз."
 ADISCORD_SHL.206.b: "Заплатить 75 £ADISCORD_economy_treasury_texticon."
 ADISCORD_SHL.206.c: "Выменять за [SHL.SHLGetRoadBarter]."
 SHL_road_purchase_tt: "На наш склад поступит [SHL.SHLGetRoadLot]. Расчёт состоится сразу."
 ADISCORD_SHL.207.t: "Обоз у родных ворот"
 ADISCORD_SHL.207.d: "У шахрабадских ворот караульный узнал выгоревший вымпел и отодвинул засов. Возчики распрягли уставших лошадей, а приказчик понёс в контору книгу с печатями дальних рынков. К вечеру писарь свёл накладные и оставил итог рейса в журнале караванов.[SHLGetRoadReturnReceipt]"
 SHL_road_return_receipt: "\n\nОстаток груза   [?SHL_road_rifles|0] £infantry_equipment_texticon   [?SHL_road_kits|0] £support_equipment_texticon [SHLGetRoadWine]\nВыручка   [?SHL_road_cash|0] £ADISCORD_economy_treasury_texticon   [?SHL_road_trucks|0] £ADISCORD_motorized_texticon   [?SHL_road_guns|0] £ADISCORD_artillery_texticon   [?SHL_road_fuel|0] £fuel_texticon [SHLGetRoadHomeReceipt]"
 ADISCORD_SHL.207.a: "Принять обоз."
