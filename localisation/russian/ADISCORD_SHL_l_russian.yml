 SHL_project_busy: "§Yработы оплачены§!"
 SHL_project_stage_0: "чертежи"
 SHL_project_stage_1: "инженеры готовы"
 SHL_project_stage_2: "участок подготовлен"
 SHL_project_stage_3: "комплекс построен"
 SHL_project_stage_4: "§Gпервая плавка завершена§!"
 SHL_shift_overtime_label: "Усиленная смена"
 SHL_shift_careful_label: "Бережная смена"
 SHL_shift_ordinary_label: "Обычная смена"
 SHL_supply_on: "§Gавто§!"
 SHL_supply_off: "ручной"
 SHL_furnace_select_tt: "Выбрать печь. Оплаченные работы сохраняют свою первоначальную цель."
 SHL_supply_furnace: "Закупить сырьё для выбранной печи"
 SHL_supply_furnace_desc: "Караван с сырьём входит на печной двор. Кладовщики проверяют пломбы, а смена готовит место для разгрузки."
 SHL_repair_furnace: "Обслужить выбранную печь"
 SHL_repair_furnace_desc: "Ремонтники осматривают кладку и изношенные механизмы. У каждой печи есть шрамы, которые нельзя оставлять без внимания."
 SHL_training_furnace: "Обучить смену выбранной печи"
 SHL_training_furnace_desc: "Опытные мастера собирают смену у учебного горна. Здесь расскажут о том, чему не учат поспешные распоряжения владельца."
 SHL_restart_furnace: "Повторно запустить выбранную печь"
 SHL_restart_furnace_desc: "У погасшей печи вновь собираются люди. Мастера проверяют заслонки и готовят первый огонь."
 SHL_site_available_tt: "Шахрабад владеет районом, контролирует его и не оплатил другую работу по этой печи."
 SHL_owner_settled_tt: "После погашения выбран новый собственник."
 SHL_transport_ready_tt: "Спор о транспортном доступе урегулирован оплатой соглашения или собственным транспортом."
 SHL_supply_result_tt: "Через §Y7 дней§! выбранная печь получит §G+1§! £SHL_packet_texticon."
 SHL_repair_result_tt: "Через §Y14 дней§!: §G-30§! износа выбранной печи без её погашения."
 SHL_training_result_tt: "Через §Y35 дней§!: прирост износа выбранной печи §G-1§! за обеспеченный период."
 SHL_restart_result_tt: "Через §Y21 день§!: выбранная печь возобновит работу с износом §Y20§!."
 SHL_shift_ordinary: "Обычная производственная смена"
 SHL_shift_ordinary_desc: "Мастера возвращают печи к привычному ритму: смена сменяет смену по гудку, а шлак вывозят до рассвета, как было заведено ещё при дедах."
 SHL_shift_overtime: "Усиленная производственная смена"
 SHL_shift_overtime_desc: "Гудки звучат чаще, и у заводских ворот выстраиваются очереди из тех, кто готов стоять у огня вторую смену подряд."
 SHL_shift_careful: "Бережная производственная смена"
 SHL_shift_careful_desc: "Старшие мастера сбавляют жар и сами обходят кладку перед каждой плавкой. В кварталах замечают, что рабочие впервые за долгое время возвращаются домой засветло."
 SHL_shift_ordinary_tt: "На работающую печь за 28 дней: §Y1§! £SHL_packet_texticon, §Y+6§! износа, §G60§! £ADISCORD_economy_treasury_texticon до удержаний. Обычная смена сохраняет устойчивую денежную выручку."
 SHL_shift_overtime_tt: "На работающую печь за 28 дней: §Y2§! £SHL_packet_texticon, §R+10§! износа, §G90§! £ADISCORD_economy_treasury_texticon до удержаний. Недовольство: §R+4§! за цикл до \"Общей плавки\". Производственный заказ получает две партии вместо одной; предназначенный ему металл не приносит обычную выручку."
 SHL_shift_careful_tt: "На работающую печь за 28 дней: §Y1§! £SHL_packet_texticon, §Y+3§! износа, §G25§! £ADISCORD_economy_treasury_texticon до удержаний. Недовольство: §G-6§! за цикл."
 SHL_buy_reserve: "Подготовить аварийный резерв"
 SHL_buy_reserve_desc: "Кладовщики принимают сырьё в общий резерв. Запертые амбары должны стать надёжной опорой для печных дворов."
 SHL_use_reserve: "Передать резерв выбранной печи"
 SHL_use_reserve_desc: "Кладовщики открывают общий амбар, и упряжки с рудой и углём уходят к печному двору, где мастера уже считают часы до остановки."
 SHL_use_reserve_tt: "С общего склада на выбранную печь сразу поступит §Y1§! £SHL_packet_texticon."
 SHL_reserve_result_tt: "Общий резерв: §G+2§! £SHL_packet_texticon."
 SHL_allow_extinction: "Разрешить погашение выбранной печи"
 SHL_allow_extinction_desc: "Огонь главной печи угасает. Над пустеющим двором снимают герб дома, и городские писцы принимают хозяйственные книги."
 SHL_extinction_result_tt: "§RВыбранная печь погаснет и перестанет приносить доход.§! Дом потеряет голос; город получит владение."
 SHL_return_house: "Вернуть предприятие промышленному дому"
 SHL_return_house_desc: "Над воротами предприятия снова вешают герб старого дома. Управляющие возвращаются с ключами и прежними книгами, а рабочие ждут, на каких условиях их примут обратно."
 SHL_return_house_tt: "Дом вернёт владение. Гражданская опора: §R-5§! при возврате городского предприятия. Верность дома: §G+12§!. Голос восстановится после оплаченного запуска."
 SHL_city_ownership: "Закрепить городское владение"
 SHL_city_ownership_desc: "Городское собрание заносит предприятие в свои книги. Писцы составляют опись цехов, а у ворот вместо гербовой стражи встают дружинники кварталов."
 SHL_city_ownership_tt: "Город сохранит предприятие. После запуска его производство вернётся, но наследственный голос дома не восстановится. Верность дома: §R-12§!."
 SHL_state_ownership: "Передать предприятие дирекции"
 SHL_state_ownership_desc: "Чиновники дирекции принимают предприятие по описи. На воротах появляется печать Конклава, а расчёты смен теперь сводят в Хазаре."
 SHL_state_ownership_tt: "Владение переходит промышленной дирекции. Запуск оплачивается отдельно. Верность дома: §R-12§!."
 SHL_project_engineers: "Собрать инженерное товарищество"
 SHL_project_engineers_desc: "Мастера, чертёжники и каменщики собираются в одном зале и делят между собой работу над десятой печью. Товарищество впервые подписывает договор от собственного имени."
 SHL_project_foundation: "Подготовить участок десятой печи"
 SHL_project_foundation_desc: "Землекопы размечают участок, а возчики прокладывают к нему колею. Пустырь за городской стеной впервые становится стройкой."
 SHL_project_construction: "Построить комплекс десятой печи"
 SHL_project_construction_desc: "На площадке поднимаются стены цехов и кладка будущей печи. Каменщики работают в две смены, а инженеры ночуют прямо в конторе у лесов."
 SHL_project_first_pour: "Провести первую плавку"
 SHL_project_first_pour_desc: "Десятую печь разжигают медленно, по старому обычаю мастеров. У ворот собираются горожане, чтобы увидеть, как из нового жёлоба пойдёт первый металл."
 SHL_project_engineers_tt: "Через §Y35 дней§! инженерная команда завершит проект. Депозит возвращается при отмене."
 SHL_project_foundation_tt: "Через §Y42 дня§!: §G+1§! инфраструктура в [294.GetName]. При уже максимальной инфраструктуре участок засчитывается, деньги возвращаются."
 SHL_project_construction_tt: "Через §Y70 дней§!: §G+1§! гражданская фабрика в [294.GetName]. Если при доставке нет места, депозит возвращается, этап остаётся доступным."
 SHL_project_first_pour_tt: "Через §Y14 дней§! десятая печь включится в производство. Отмена возвращает деньги и 1 £SHL_packet_texticon."
 SHL_supply_tenth: "Снабдить десятую печь"
 SHL_supply_tenth_desc: "Обоз с рудой и углём сворачивает к десятой печи. Мастера товарищества встречают его у ворот и сами принимают каждый мешок."
 SHL_supply_tenth_tt: "Со склада на десятую печь поступит §Y1§! £SHL_packet_texticon."
 SHL_service_tenth: "Обслужить десятую печь"
 SHL_service_tenth_desc: "Каменщики поднимаются на леса у десятой печи и перекладывают прогоревшие ряды, пока огонь держат на малом жару."
 SHL_service_tenth_tt: "Через §Y14 дней§!: износ десятой печи §G-30§!. При утрате площадки [294.GetName] депозит возвращается."
 SHL_restart_tenth: "Повторно запустить десятую печь"
 SHL_restart_tenth_desc: "Остывший двор десятой печи снова наполняется людьми. Мастера вычищают горн и готовят кладку к новому огню."
 SHL_restart_tenth_tt: "Через §Y21 день§!: десятая печь возобновит работу с износом §Y20§!. При утрате площадки [294.GetName] депозит возвращается."
 SHL_tenth_stopped_tt: "Десятая печь погасла. Подготовьте сырьё и оплатите повторный запуск."
 SHL_supply_toggle_button: "Подвоз: [SHLGetSupply]"
 SHL_supply_packet_quote: "1 £SHL_packet_texticon = §Y[?SHL_auto_packet_price|0]§! £ADISCORD_economy_treasury_texticon"
 SHL_supply_toggle_help: "После фокуса \"Закон непрерывного огня\" нажмите, чтобы сменить режим подвоза. При автоподвозе снабженцы покупают для действующих печей только недостающее к плавке сырьё. Переключение бесплатно."
 SHL_railway_auto_supply_tt: "Железная дорога снимает надбавку за срочный подвоз. Экономия при автозакупке составляет §G5§! £ADISCORD_economy_treasury_texticon за 1 £SHL_packet_texticon."
 SHL_planned_supply: "Наладить плановый подвоз"
 SHL_planned_supply_desc: "Снабженцы сводят заявки печей в общую ведомость. Караваны должны приходить по расписанию, а не вслед за тревожным письмом мастера."
 SHL_planned_supply_tt: "Цена автоподвоза 1 £SHL_packet_texticon  §Y[?SHL_auto_packet_price|0]§! £ADISCORD_economy_treasury_texticon.[SHLGetPacketPriceNote]"
 SHL_stop_planned_supply: "Приостановить плановый подвоз"
 SHL_stop_planned_supply_desc: "Снабженцы сворачивают общую ведомость и отзывают караванщиков. Печные дворы снова сами договариваются о сырье."
 SHL_stop_supply_tt: "Будущие автоматические закупки прекращаются. Уже доставленное сырьё остаётся на печах."
 SHL_census_tt: "Общий резерв  §G+4§! £SHL_packet_texticon"
 SHL_common_fund_tt: "Общий резерв: §G+2§! £SHL_packet_texticon. Владельцы линий предложат условия доступа к строительству."
 SHL_workers_charter_tt: "Гражданская опора: §G+10§!. Недовольство кварталов: §G-10§!. Верность каждого дома: §R-10§! (давление гербов §R+10§!)."
 SHL_course_house_tt: "Курс домов ратифицирован. Десятая печь получит наследственный голос после запуска и сохранит его во время работы. Вместимость казны: §G+10%§!. Давление гербов: §G-15§!. Недовольство кварталов: §R+10§!. §Y-15%§! $SHL_conclave_balance$. Откроется путь \"Конклав десяти\"."
 SHL_course_city_tt: "Печи Шахрабада переходят городам. Представительство отделяется от непрерывной плавки. Советы смен смогут открыто выдвигать делегатов от своей партии. Стабильность: §G+3%§!. Верность каждого дома, кроме дома Арбин: §R-15§!. §Y+15%§! $SHL_conclave_balance$. Откроется путь \"Южный договор\"."
 SHL_course_state_tt: "Печи Шахрабада переходят дирекции. Промышленное управление: §G+0.05§! £political_power_texticon в день. Верность каждого дома, кроме дома Дарбан: §R-20§!. Откроется путь \"Дирекция печей\"."
 SHL_rename_house_tt: "Страна принимает название §YКонклав десяти§!."
 SHL_rename_city_tt: "Страна принимает название §YЮжный договор§!."
 SHL_rename_state_tt: "Страна принимает название §YДирекция печей§!."
 SHL_rename_regency_tt: "Страна принимает название §YНаследственная республика§!."
 SHL_rename_commune_tt: "Страна принимает название §YКоммуна огня§!."
 SHL_provisional_house_tt: "Предварительный курс домов действует сразу: давление гербов §G-2§! за цикл. Права нового дома зависят от итогов голосования."
 SHL_provisional_city_tt: "Предварительный городской курс действует сразу: недовольство §G-2§!, давление гербов §R+3§! за цикл. Итоговое голосование определит владельцев печей и состав кабинета."
 SHL_provisional_state_tt: "Предварительный курс дирекции действует сразу: давление гербов §R+3§! за цикл. Итоговое голосование определит владельцев печей и состав кабинета."
 SHL_back_shift_councils: "Опереться на советы смен"
 SHL_back_shift_councils_desc: "Советы смен требуют голоса в управлении городом. Их делегаты входят в зал, где прежде заседали только главы домов."
 SHL_back_crests: "Опереться на гербы"
 SHL_back_crests_desc: "Дома обращаются к Дарию Сафиру. Под сводами Конклава вновь звучат слова о наследном долге и власти гербов."
 SHL_crisis_already_resolved: "Кризис уже разрешён."
 SHL_course_provisional_house: "дома - предварительный курс"
 SHL_course_provisional_city: "города - предварительный курс"
 SHL_course_provisional_state: "дирекция - предварительный курс"
 SHL_course_ratified_house: "дома - курс ратифицирован"
 SHL_course_ratified_city: "города - курс ратифицирован"
 SHL_course_ratified_state: "дирекция - курс ратифицирован"
