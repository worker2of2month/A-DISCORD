 ADISCORD_SHL.100.t: "Кому достанется следующая плавка"
 ADISCORD_SHL.100.house: "Посланник картеля Золотых ворот положил на стол кошель раньше, чем писарь закончил читать договор. Голшану Лорану понравился этот жест: новый порядок говорил на знакомом ему языке. Дарий Сафир кивнул, не глядя на кошель. Но мастер Арбина попросил назвать печь, которая ответит за обещанный металл, и в зале стало тише. Подпись Конклава могла связать всю страну; работать предстояло одной смене.\n\nДжалиль Нур велел Лейле Надири завести отдельную ведомость. Аванс можно потратить немедленно, но за три производственных цикла выбранная печь должна выполнить две плавки для покупателя. Её обычная выручка на это время исчезнет из общего счёта. Усиленная смена позволит успеть быстрее, если найдутся сырьё Байрата и люди, готовые принять износ.\n\nЭто ещё не десятый голос. Прежде чем Товарищество мастеров и инженеров получит наследственный герб, ему придётся доказать, что его подпись означает больше, чем право брать деньги."
 ADISCORD_SHL.100.city: "Городские делегаты принесли в Конклав не герб, а чертёж перехода через сухое русло. Каждую весну здесь теряли телеги, каждое лето жители носили воду в обход обвалившейся кладки. Ферейдун Кердан, хозяин ближайшей печи, спросил, сколько принесёт новая дорога. Мехран Арбин ответил за делегатов: впервые прибыль не будет единственным условием строительства.\n\nГородской заказ оставляет металл дома. Казна оплачивает работу, а две плавки выбранной печи превращаются в дорогу, мост или водовод её района. На это время правительству придётся обойтись без обычной выручки предприятия. Лейла Надири записала заказ в ведомость, а Самира Хади попросила, чтобы первый переход вёл к лазарету. Дорога останется даже в случае, если Конклав позднее откажет городам в голосе.\n\nПредставительство ещё предстоит утвердить после принятия рабочей хартии. До того города смогут предъявить не обещания, а построенное собственными силами."
 ADISCORD_SHL.100.state: "Арман Теймур положил перед Джалилем Нуром затвор с трещиной. В реестре он числился исправным: казна оплатила заказ, склад принял ящики, ведомство поставило печать. Никто не записал, какая печь отливала металл и кто проверял последнюю партию. Рауф Дарбан перевернул затвор и назвал печь по клейму раньше, чем писарь нашёл накладную.\n\nДирекция начинает с простого требования: у каждого заказа будет конкретное производство. Оплата двух партий останется в ведомости Лейлы Надири. Первая успешная плавка даст половину оружия, вторая закроет заказ. Пока цех работает на арсенал, его выручка не пополняет казну. Усиленная смена может сделать обе партии сразу; остановившаяся печь не сделает ни одной.\n\nНур пока не получил права распоряжаться всеми домами, и Дарий Сафир напомнил об этом вслух. Но первая военная ведомость уже заставляет выбирать, чем страна готова поступиться ради исправного оружия."
 ADISCORD_SHL.100.a: "Внести первую печь в ведомость."
 ADISCORD_SHL.101.t: "Пустое место в караване"
 ADISCORD_SHL.101.d: "У Золотых ворот стояли телеги покупателя, а в ведомости не хватало оплаченного металла. Лейла Надири могла перечислить причины: сырьё Байрата пришло с опозданием, печь стояла на ремонте, дорога Кердана была закрыта. Купец выслушал всё, после чего снова развернул лист с подписью Конклава. На нём не было оговорки о том, что аванс возвращается только при удобных обстоятельствах. Голшан Лоран, чьё имя стоит на экспортных договорах дома, смотрел в сторону.\n\nПервый выход - закрыть договор и рассчитаться по оставшемуся обязательству. Если денег не хватит, задолженность перейдёт в государственный счёт, и Дарий Сафир уже спросил, из чьей казны. Второй - просить ещё два цикла. Покупатель согласится лишь один раз, уменьшит окончательный платёж и потребует большей компенсации при повторном срыве. Смены уже слышали, что наверху обсуждают новый срок, и Салим Дарзи записал это в журнал.\n\nПока стороны не договорятся, печь вернётся к обычной продаже своей продукции. Старая подпись при этом никуда не исчезнет."
 ADISCORD_SHL.101.a: "Закрыть договор и рассчитаться."
 ADISCORD_SHL.101.b: "Попросить последнюю отсрочку."
 ADISCORD_SHL.101.c: "Ведомость уже закрыта."
 SHL_renew_golden_offer: "Вернуться к союзу Золотых ворот"
 SHL_renew_southern_offer: "Вернуться к Южному договору"
 SHL_renew_golden_offer_desc: "Посланники вновь отправляются в Вейр с союзной грамотой. Прежний разговор ещё не забыт по обе стороны границы."
 SHL_renew_southern_offer_desc: "Кейзанские старейшины вновь приглашены к переговорам. Наши представители предлагают вернуться к Южному договору."
 SHL_alliance_offer_free_tt: "Предыдущее предложение союза уже рассмотрено."
 SHL_renew_alliance_offer_tt: "Партнёр получит предложение союза. При согласии он вступит также в текущую оборонительную войну Шахрабада против Кейзана."
 SHL_regency_independent_tt: "Не менее 7 действующих голосов домов; действующий залог погашен или урегулирован."
 SHL_renew_veyr_partnership: "Возобновить переговоры с Вейром"
 SHL_renew_veyr_partnership_desc: "Купцы вновь ищут общего языка с Вейром. В письмах соседям говорится о торговле, гаванях и взаимном доверии."
 SHL_partner_joins_keizan_tt: "Страна вступит в текущую войну против Кейзана на стороне Шахрабада."
 SHL_hereditary_seats: "Наследственные места"
 SHL_hereditary_seats_desc: "Девять домов умеют собирать большинство, но каждое решение оплачивается уступками их семьям. По старому уставу мастера могли выбирать делегатов у каждой печи, но девять домов запрещали им выступать единой партией. Дух снимается при утверждении нового политического устройства."
 SHL_divided_guard: "$SHL_shahrabad_army$"
 SHL_divided_guard_desc: "$SHL_shahrabad_army_desc$"
 SHL_external_freight: "Чужие пути снабжения"
 SHL_external_freight_desc: "Вода и выход к морю зависят от соседей. Собственный транспорт и урегулирование обоих соседских споров снимут зависимость."
 SHL_prepared_columns: "Обоз непрерывного огня"
 SHL_prepared_columns_desc: "Две оплаченные плавки стали запасными частями и походным снаряжением. Обоз помогает снабжать армию 90 дней с момента вступления в войну; мир завершает его службу раньше."
 SHL_forced_columns: "Форсированный марш"
 SHL_forced_columns_desc: "Дополнительное сырьё и перегруженные смены обеспечили первые 45 дней наступления. Скорость развёртывания оплачивается повышенным расходом снабжения."
 SHL_house_war_mandate: "Заём девяти гербов"
 SHL_house_war_mandate_desc: "Поверенные домов приходят в Конклав с книгами и векселями. Гербы говорят о своём долге перед страной, а их счетоводы - о долге страны перед гербами."
 SHL_city_war_mandate: "Мандат городских дружин"
 SHL_city_war_mandate_desc: "Городские собрания до ночи спорят о войне. Делегаты готовы отпустить дружины, но требуют, чтобы поход закончился безопасными дорогами и договором, а не чужой независимостью, отнятой силой."
 SHL_directorate_war_mandate: "План первого удара"
 SHL_directorate_war_mandate_desc: "Дирекция превращает готовый обоз в средство наступления. Диспетчеры переписывают графики, склады отдают сырьё походным мастерским, а в цехах всё чаще говорят о сменах, которым не видно конца."
 SHL_regent_war_mandate: "Полки под залог"
 SHL_regent_war_mandate_desc: "Регент собирает глав домов в своём особняке. Дома приводят дружины, Сафир обещает им оружие, а его поверенные молча раскладывают на столе закладные, под которыми каждый из гостей уже однажды подписался."
 SHL_commune_war_mandate: "Вооружённая смена"
 SHL_commune_war_mandate_desc: "Коммуна вооружает дружину из собственных складов и собственных смен. Делегаты печей провожают её у ворот и помнят, что за пустыней помощи ждут и соседние общины."
 SHL_campaign_logistics: "Две плавки для фронта"
 SHL_campaign_logistics_desc: "Печные мастера принимают походный заказ. Металлургам предстоит работать рядом с военными приёмщиками и обозными."
 SHL_no_more_rations: "Последний паёк"
 SHL_no_more_rations_desc: "Спор с Кейзаном дошёл до штабных карт. Военачальники готовятся вести части к цистернам, от которых зависит жизнь приграничья."
 SHL_peace_has_a_price: "Цена наступившего мира"
 SHL_peace_has_a_price_desc: "Спор о пайке с Кейзаном позади, но южные города присылают в Хазар не благодарности, а сметы: разбитые дороги, пустые цистерны, сожжённые дворы. Конклав спорит, чьим станет восстановленный юг."
 SHL_southern_horizon: "За линией цистерн"
 SHL_southern_horizon_desc: "Итог кампании измеряется тем, что осталось после демобилизации: землёй, договорами, работающими предприятиями и правом распоряжаться огнём."
 SHL_forge_campaign_convoy: "Заказать походный обоз"
 SHL_forge_campaign_convoy_desc: "На печном дворе готовят походный обоз. Военные приёмщики сверяют заказ, пока мастера разливают металл."
 SHL_demobilise_campaign_convoy: "Разобрать неиспользованный обоз"
 SHL_demobilise_campaign_convoy_desc: "Обозные возвращают ящики в арсенал. На складских книгах появляются отметки о закрытом походном наряде."
 SHL_march_on_keizan: "Выступить к цистернам"
 SHL_march_on_keizan_desc: "Штаб изучает дороги к кейзанским цистернам. Пограничная стража готовит проводников для выступающих частей."
 SHL_house_campaign_aid: "Открыть военный заём домов"
 SHL_house_campaign_aid_desc: "Дома обсуждают военный заём. Их поверенные прибыли с книгами и длинным перечнем будущих обязательств."
 SHL_city_campaign_aid: "Две городские дружины"
 SHL_city_campaign_aid_desc: "Городские собрания проводят дружины на фронт. На площадях прощаются с родными и зачитывают имена добровольцев."
 SHL_directorate_campaign_aid: "Форсировать начало похода"
 SHL_directorate_campaign_aid_desc: "Дирекция требует подготовить походные склады. Смены спорят о новых нарядах, а диспетчеры торопят обозных."
 SHL_regent_campaign_aid: "Увеличить военный залог"
 SHL_regent_campaign_aid_desc: "Регент призывает дружины домов. Поверенные обсуждают с казной оружие и содержание выступающих людей."
 SHL_commune_campaign_aid: "Вооружить дружину"
 SHL_commune_campaign_aid_desc: "Советы смен собирают добровольцев. Соседи помогают с походным снаряжением и провожают отряд к городским воротам."
 SHL_offer_cistern_charter: "Предложить хартию цистерн"
 SHL_offer_cistern_charter_desc: "За столом переговоров вновь разложены карты цистерн. Делегаты ищут договор, который заменит пограничные караулы взаимными обязательствами."
 SHL_cistern_concession: "Обменять цистерны на концессию"
 SHL_cistern_concession_desc: "Поверенные обсуждают права на цистерны и возвращение занятых земель. В договоре предстоит согласовать каждую границу и каждую подпись."
 SHL_reconstruct_south: "Устроить юг: [From.GetName]"
 SHL_reconstruct_south_desc: "Южные города присылают просьбы о восстановлении. Инженеры осматривают разрушенные дороги и здания."
 SHL_campaign_convoy_tt: "Две плавки выбранной печи -> обоз. При вступлении в войну: 90 дней расход снабжения -15%, восстановление организации +8%."
 SHL_demobilise_convoy_tt: "Обоз -> §G13500§! £infantry_equipment_texticon. Усиление форсированного марша также отменяется."
 SHL_march_ready_tt: "Кейзан независим, угрожает Шахрабаду и не занят другой войной; наша армия ещё не выступила."
 SHL_march_on_keizan_tt: "Через §Y28 дней§! Шахрабад объявит войну Кейзану за [280.GetName] и [284.GetName]. Кейзан может пригласить одного соседа: Мазар, поддержавший требование, или Вейр после пограничной войны. Предупреждение и переговоры о нейтралитете доступны с начала подготовки."
 SHL_house_aid_ready_tt: "Идёт подготовка или война; помощь курса ещё не использована; столица под нашим контролем."
 SHL_city_aid_ready_tt: "Помощь не использована; столица удерживается; поддержка городов не ниже 35 и хватает средств и рекрутов."
 SHL_directorate_aid_ready_tt: "Помощь не использована; столица удерживается; готов обоз и 2 £SHL_packet_texticon."
 SHL_regent_aid_ready_tt: "Помощь не использована; столица удерживается; есть действующий залог и достаточно рекрутов."
 SHL_commune_aid_ready_tt: "Помощь не использована; столица удерживается; хватает оружия и рекрутов для одной дружины."
 SHL_house_aid_tt: "§G400§! £ADISCORD_economy_treasury_texticon сейчас; государственный долг §R+500§!."
 SHL_city_aid_tt: "Две дружины \"Печной сбор\" в столице. Поддержка городов §R-15§!."
 SHL_directorate_aid_tt: "Недовольство §R+8§!. При начале войны: атака дивизий §G+8%§!, расход снабжения §R+10%§! на §Y45 дней§!."
 SHL_regent_aid_tt: "Две дружины в столице. Обязательство печи §R+180§! £ADISCORD_economy_treasury_texticon; недовольство §R+15§!."
 SHL_commune_aid_tt: "Одна оплаченная дружина в столице. Недовольство §G-12§!."
 SHL_cistern_charter_ready_tt: "Оба района удерживаются после победы; Кейзан независим и без союза; послевоенный проект ещё не оплачен."
 SHL_cistern_concession_ready_tt: "Оба района удерживаются после победы; Кейзан независим; послевоенный проект ещё не оплачен."
 SHL_cistern_charter_tt: "Кейзан получит выбор: вернуть оба района и вступить в наш союз. До его согласия передача не происходит."
 SHL_cistern_accept_tt: "Кейзан получит оба района цистерн и вступит в Южный договор, сохранив независимость."
 SHL_cistern_concession_tt: "Оба района возвращаются Кейзану. 450 £ADISCORD_economy_treasury_texticon концессии сначала гасят действующий залог; остаток поступает в казну."
 SHL_south_programme_ready_tt: "Спор о пайке Кейзана закрыт; мир; утверждён политический курс; нет другого проекта; район доступен и ещё получит материальное улучшение."
 SHL_south_programme_tt: "Через §Y56 дней§!: [SHLGetSouthProgramme] При отмене возвращаются все внесённые средства и оружие."
 SHL_southern_programme_complete_tt: "Послевоенная программа оплачена и завершена."
 SHL_keizan_warning_tt: "Первое требование возможно с §Y10-го цикла§!; после отказа остаётся §Y60 дней§!. Подготовьте стражу и обоз или средства на урегулирование."
 SHL_ledger_convoy: "Походный обоз: [SHLGetOrderSite]. Плавки [?SHL_obligation_progress|0]/2.\nОплата: [?SHL_obligation_deposit|0] £ADISCORD_economy_treasury_texticon."
 SHL_campaign_reserve_ready: "§Gготов§!"
 SHL_campaign_reserve_empty: "не подготовлен"
 SHL_south_house: "Дома: фабрика; при заполненных слотах - 2700 винтовок владельцу района."
 SHL_south_city: "Города: инфраструктура +1; при максимуме - переселение 2000 рекрутов владельцу. Поддержка +10; наш район станет национальным, союзный сохранит независимость."
 SHL_south_directorate: "Дирекция: военный завод; при заполненных слотах - 32 комплекта оружия отделения владельцу района."
 SHL_south_regent: "Регентство: печь возвращается дому; обучение до 2, износ -30; организация армии +5%. Давление -15, недовольство +10. Долги сохраняются."
 SHL_south_commune: "Коммуна: инфраструктура +1 до максимума; владелец района получает одну полностью оплаченную дружину из наших рекрутов и оружия."
 SHL_south_unratified: "Сначала утвердите политический курс."
 SHL_south_pending: "\nПосле мира - идёт оплаченный проект"
 SHL_south_complete: "\nПосле мира - проект завершён"
 SHL_south_open: "\nПосле мира - выберите послевоенный проект"
