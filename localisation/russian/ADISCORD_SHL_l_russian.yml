 SHL_favour_arbin_tt: "Дом Арбин: верность §R-15§!.\nКаждая горящая печь у кяризов (I-III): износ §G-10§! (§G-15§! во время водного кризиса).\nСледующая услуга дома - через §Y168§! дней."
