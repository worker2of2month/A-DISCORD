 SHL_road_unlock_fairs_tt: "Новые рейсы заходят на рынки Фады в Стеландере и Ирима в Кефрейте. Дорога через четыре рынка занимает 210 дней, с дозорами - 168."
 SHL_road_unlock_relays_tt: "Сменные упряжки сокращают каждый новый перегон на §G20%§!. Круг через Севир и Барак занимает 72 дня, до Ирима - 168, до Светлогорска - 292. Караван в пути получит свежую упряжку на следующей остановке."
 SHL_road_unlock_factors_tt: "На остановках большого каравана покупатель сможет взять 20 000 £infantry_equipment_texticon и 1 £SHL_wine_texticon вместе за 620 £ADISCORD_economy_treasury_texticon. Это также доступно рейсам, которые уже в пути."
 SHL_road_unlock_charter_tt: "К следующим рейсам добавятся Марен, Нижний Лорен и Светлогорск. Полный круг проходит через семь рынков и занимает 365 дней, со сменными станциями - 292."
