# Mazar border pact and neutrality
 SHL_mzr_border_pact_faction: "Пограничный договор Мазара"
 SHL_negotiate_mzr_neutrality: "Согласовать нейтралитет соседа"
 SHL_negotiate_mzr_neutrality_desc: "[SHLGetMazarFlankStatus]\n\nПредложим компенсацию за прежний пограничный конфликт в обмен на отказ поддержать Мазар. Переговоры доступны до начала войны. Сосед вправе отказать; отказ и утрата актуальности предложения не расходуют средства."
 SHL_mzr_neutrality_funds_tt: "Есть §Y100§! £ADISCORD_economy_treasury_texticon для компенсации при подписании"
 SHL_mzr_neutrality_idle_tt: "Сосед не рассматривает другое наше предложение о нейтралитете"
 SHL_mzr_neutrality_offer_tt: "Сосед получит предложение о нейтралитете. Только при его согласии и до начала войны: §R-100§! £ADISCORD_economy_treasury_texticon из нашей казны и §R-30§! £political_power_texticon; сосед получит §G100§! £ADISCORD_economy_treasury_texticon и откажется от участия на стороне Мазара. Средства повторно проверяются при подписании."
 SHL_mzr_pact_accept_tt: "При начале объявленной войны мы вступим на стороне Мазара против Шахрабада. Договор действует только на эту войну: её исход определяется миром Шахрабада с Мазаром. До объявления войны можно принять компенсацию Шахрабада и сохранить нейтралитет."
 SHL_mzr_neutrality_accept_tt: "Получить от Шахрабада §G100§! £ADISCORD_economy_treasury_texticon. Шахрабад также потратит §R30§! £political_power_texticon. Наше участие в мазарском пограничном договоре отменяется; прежняя военная претензия урегулирована. Передача состоится только при наличии всей суммы и до начала войны."
 SHL_mzr_flank_none: "Дополнительный противник не заявлен."
 SHL_mzr_flank_negotiating: "Предложение о нейтралитете ожидает ответа; до согласия угроза сохраняется."
 SHL_mzr_flank_kyz_pending: "Кейзан рассматривает вступление на стороне Мазара: под угрозой западная граница."
 SHL_mzr_flank_glp_pending: "Вейр рассматривает вступление на стороне Мазара: под угрозой восточная граница."
 SHL_mzr_flank_kyz_signed: "§RКейзан согласился открыть западный фронт на стороне Мазара.§!"
 SHL_mzr_flank_glp_signed: "§RВейр согласился открыть восточный фронт на стороне Мазара.§!"
 SHL_mzr_flank_kyz_war: "§RКейзан воюет на стороне Мазара. Общий мир завершит его участие.§!"
 SHL_mzr_flank_glp_war: "§RВейр воюет на стороне Мазара. Общий мир завершит его участие.§!"
 ADISCORD_SHL.124.t: "Второй край войны"
 ADISCORD_SHL.124.d: "[FROM.GetName] ведёт переговоры с Палатой общего пайка. После нашей попытки решить пограничный спор оружием обещание мазарской защиты нашло внимательных слушателей, и Бахрам Каве подтверждает: посланники палаты уже дважды проезжали через соседнюю столицу. Пока договор не подписан, но Арман Теймур обязан учитывать ещё одно направление, а Бехруз Вейран - делить гвардии пограничного дома на два фронта.\n\nДо начала войны мы можем предложить соседу компенсацию и нейтралитет через решение \"Согласовать нейтралитет соседа\". Рамин Фарзан готов везти предложение, но предупреждает, что согласие не гарантировано: сосед помнит, кто первым взялся за оружие. Подписание потребует 100 £ADISCORD_economy_treasury_texticon и 30 £political_power_texticon; при отказе деньги останутся у нас. Дарий Сафир считает цену низкой рядом со вторым фронтом; Тахмурас Байрат - высокой рядом с тем, что сосед может взять её и всё равно подписать с Мазаром.\n\nМазар не станет искать замену этому участнику в течение нынешней подготовки. Один раз закрытая дверь останется закрытой до конца кампании."
 ADISCORD_SHL.124.a: "Учесть угрозу и начать переговоры."
 ADISCORD_SHL.125.t: "Мазар предлагает защиту"
 ADISCORD_SHL.125.d: "Шахрабад уже пытался навязать нам свою волю силой: его стража стояла у наших колодцев и портов, а гвардии дома Вейран - у наших границ. Теперь Палата общего пайка предлагает встретить следующую войну вместе. Когда Мазар и Шахрабад начнут боевые действия, наша армия откроет соседний фронт, и Конклаву придётся делить девять гвардий и одну стражу на два направления.\n\nЭто ограниченный военный договор. Капитуляция Мазара или согласованный им мир завершат наше участие; один пограничный поход не должен поглотить всю внешнюю политику страны. Распорядители палаты не обещают ни земли, ни пайка - только то, что Шахрабад будет занят.\n\nДо объявления войны остаётся возможность принять шахрабадскую компенсацию и сохранить нейтралитет: посланник Рамина Фарзана ждёт ответа с суммой в руках. Подписать договор - значит выбрать Мазар. Остаться в стороне - значит ждать, кто из соседей победит, и говорить с победителем."
 ADISCORD_SHL.125.a: "Подписать пограничный договор."
 ADISCORD_SHL.125.b: "Остаться в стороне."
 ADISCORD_SHL.126.t: "Цена нейтралитета"
 ADISCORD_SHL.126.d: "Шахрабад предлагает компенсацию за прежний военный конфликт в обмен на наш отказ участвовать в мазарском походе. Рамин Фарзан привёз предложение лично и не скрывал, кто его оплачивает: казна Конклава, а не казна дома, который начинал войну. Мы сохраним независимость, а 100 £ADISCORD_economy_treasury_texticon поступят после подписания. Территориальная граница останется прежней - ни уступок, ни возврата.\n\nСоглашение возможно, пока война с Мазаром не началась и Шахрабад располагает всей объявленной суммой. Посланник честно предупредил, что Конклав не будет повторять предложение после первого выстрела: Арман Теймур уже делит стражу по направлениям, и Хазар хочет знать, сколько их будет.\n\nПоддержать Мазар, принять компенсацию или остаться в стороне - решение принадлежит нам. Деньги Шахрабада не вернут того, что он взял силой; но и Палата общего пайка не обещает ничего, кроме общего врага."
 ADISCORD_SHL.126.a: "Принять компенсацию и нейтралитет."
 ADISCORD_SHL.126.b: "Не подписывать соглашение."
 ADISCORD_SHL.127.t: "Одна граница спокойнее"
 ADISCORD_SHL.127.d: "[FROM.GetName] принял наше предложение. Компенсация перечислена, договорённость с Мазаром отменена, и Бахрам Каве подтверждает, что посланники палаты уехали из соседней столицы без подписи. На подготовку соглашения израсходованы 100 £ADISCORD_economy_treasury_texticon и 30 £political_power_texticon; Лейла Надири записала обе суммы отдельной строкой - как цену второго фронта, которого не будет.\n\nАрман Теймур вернул стражу на одно направление, Бехруз Вейран - гвардии пограничного дома к Зарханскому округу. Дарий Сафир считает, что заплатили дёшево; Тахмурас Байрат - что заплатили за то, чего сосед всё равно не сделал бы. Рамин Фарзан просит Конклав помнить, что подпись соседа стоит ровно столько, сколько наше поведение после неё.\n\nПрежний пограничный конфликт урегулирован. Новое нападение с нашей стороны вновь даст соседу основание искать защиту; нынешний договор не оправдывает дальнейшего насилия. Теперь сосредоточимся на Мазаре."
 ADISCORD_SHL.127.a: "Теперь сосредоточимся на Мазаре."
 ADISCORD_SHL.128.t: "Соглашение не подписано"
 ADISCORD_SHL.128.d: "Переговоры о нейтралитете завершились без соглашения. Компенсация не перечислена, политическая власть не потрачена; Рамин Фарзан вернулся в Хазар с тем же кошелём, с которым уезжал, и с письмом, в котором сосед благодарит за внимание и ничего не обещает. Бахрам Каве доложил, что посланники Палаты общего пайка по-прежнему в соседней столице.\n\nАрман Теймур оставил план на два направления, а Бехруз Вейран - гвардии дома у обоих краёв границы. Дарий Сафир предлагает поднять сумму; Тахмурас Байрат - не платить вовсе и показать соседу стражу. Мариам Арбин напоминает, что сосед помнит, кто первым взялся за оружие, и деньгами такую память не стирают - только временем.\n\nТекущее положение соседа указано в сводке пограничных кризисов. Пока подготовка продолжается, мы можем вернуться к переговорам после перерыва. Мазар за это время тоже не будет сидеть сложа руки."
 ADISCORD_SHL.128.a: "Учитывать это в наших планах."
 SHL_startup_region:0 "§YЮЖНЫЕ ПУСТЫНИ: ОКРУЖЕНИЕ ШАХРАБАДА§!\n\nОбстановка к началу 2160 года.\n\n§YКейзан: вода для печей§!\nСоюз арычных общин не признаёт постоянной столицы. Поселения обслуживают свои участки кяризов и договариваются об общих работах через делегатов. Эти водные пути питают и западные печи Шахрабада: промышленная мощь Лиги зависит от отношений с общинами, не желающими подчиняться чужому центру.\n\n§YВейр: выход к морю§!\nТорговая палата объединяет порты, мастерские и судоремонт. Портовый кодекс регулирует сборы и страхование, а металл Шахрабада проходит через эту систему к внешним рынкам. Для домов цена вывоза продукции не менее важна, чем цена руды.\n\n§YМазар: металл и общий паёк§!\nПалата общего пайка распределяет воду и припасы по принципу общей пользы. Она рассматривает шахрабадский металл как часть необходимых региону ресурсов. Спор затрагивает снабжение и безопасность Зарханского округа, где интересы распределителей сталкиваются с правами промышленных домов.\n\n§YСветлогорье и северный нефтяной бассейн§!\nНаместническая администрация Светлогорья опирается на воркерландское наследство, нефтяные поля и гарнизоны. Эфлор и Ажар оспаривают земли, отнятые прежней империей. Для Шахрабада положение на севере определяет, кто будет контролировать топливо и обладать силой для борьбы за влияние на Юге. Нефтяной контракт Светлогорья удешевляет сырьё для печей, эмбарго делает каждый пакет дороже.\n\n§YДальние покупатели§!\nКефрейт, Стеландер и Земля Хана не граничат с пустынями, но покупают металл Золотых ворот: контракт на поставки одной печи приносит казне плату каждый цикл и переживает всё, кроме войны и неуплаты.\n\n§YКарта Шахрабада§!\nДевять печных областей носят имена своих домов: Арбин, Сафир, Лоран, Нуран, Байрат, Кердан, Шарим, Девятипечье и Вейран; столица - Хазар, южный рубеж - Зарханский округ с Зарханом и Зархан-калой. За печными городами лежат четыре сельские области: Сафирское взморье с портом Сафир-бандар, Лоранские пески с Лоран-дехом, Байратские копи с рудничным Байрат-каном и Вейранская граница с Вейран-калой у рубежа Вейра."
 SHL_startup_country: "§YЛИГА ШАХРАБАДА В 2160 ГОДУ§!\n\n§YГород зависел от печи§!\nПромышленный Шахрабад сложился вокруг предприятий, от которых зависели заработок и снабжение жителей. Владелец мог оставить завод и лишить город средств к жизни. Закон непрерывного огня должен был связать право собственности с обязанностью сохранять производство.\n\nГлавная печь стала мерой этой обязанности. Пока она работала, дом сохранял завод и место в Конклаве. Если огонь гас, владение возвращалось городу. Остановка не означала уничтожения цехов: тот же завод мог продолжать существовать с другим хозяином. Поэтому закон регулировал не только хозяйство, но и право говорить от имени города.\n\n§YОт обязанности к привилегии§!\nСо временем норма, защищавшая жителей от брошенного предприятия, стала основанием власти промышленных домов. Наследственное имя, богатство и владение производством образовали единый порядок. Рабочим кварталам обещали заработок и снабжение, городам - защиту, а правящим семьям оставались прибыль и привычная роскошь.\n\nДевять домов замкнули в своём кругу согласование закупок, экспорта и цен на энергию. Работающая печь подтверждала их политические права, и спор о ремонте превращался в спор о праве управлять. О состоянии оборудования судили не только как о техническом вопросе: признание неисправности могло поставить под угрозу положение семьи.\n\n§YХозяйство отдельных домов§!\nХазар стал столицей Лиги, печной район - её промышленным сердцем. Байрат давно снабжает печи рудой, но шахты связаны старыми договорами каждого дома. Общая зависимость от металла и перевозок не уничтожила отдельных владений и интересов.\n\nТак возникло хозяйство, части которого нужны друг другу, но не распоряжаются ресурсами как единое предприятие. Поставка пересекала чужие участки, заводская стража защищала своих владельцев, а доход распределялся между домами, кварталами и общей властью. Люди за пределами официальных реестров оставались с меньшим политическим весом, чем те, кто распоряжался их работой.\n\nВ Конклаве решения оплачивались уступками семьям, державшим наследственные места. За его стенами домовые, цеховые и городские списки не совпадали: житель мог годами работать у печи, но оставаться чужим для учреждения в соседнем квартале. Промышленная связь городов оказалась прочнее общей системы гражданских прав.\n\n§YДевять гербов над креслом§!\nК 2160 году гербы домов висят в Конклаве выше кресла Джалиля Нура. Лига располагает действующими заводами и многочисленным населением, но её устройство по-прежнему опирается на старое условие: огонь даёт собственность и голос. Под этой устойчивой формулой накопились износ, споры о снабжении и недовольство кварталов. Закон, некогда призванный защищать город от хозяина, теперь служит и оправданием власти хозяина над городом."
 SHL_startup_guide_furnaces_title: "Печи и производство"
 SHL_startup_guide_furnaces: "§YКАК РАБОТАЮТ ПЕЧИ§!\n\n§YПанель и цикл§!\nОткройте \"$SHL_conclave$\" и выберите объект. Каждые 28 дней работающая печь расходует сырьё, приносит доход и получает износ. Обычная смена тратит 1 пакет, усиленная - 2. Без сырья печь простаивает и быстрее изнашивается. Износ 100 или два простоя подряд гасят её.\n\n§YДва разных склада§!\nМестный запас расходует только выбранная печь. Общий резерв сам по печам не распределяется: отдельная кнопка сразу переносит из него 1 пакет выбранному объекту. Это можно сделать и при занятой местной операции. Обычная покупка сырья приходит через 7 дней; её цена показана на панели и зависит от Светлогорья: нефтяной контракт удешевляет пакет, эмбарго - удорожает.\n\n§YУ каждой печи своя очередь§!\nПоставка, обслуживание и обучение смены занимают один местный слот. Две такие работы у одной печи одновременно не идут, но другая печь может выполнять свой заказ. Обслуживание длится 14 дней и снимает 30 износа без остановки производства. Не оставляйте ремонт до цикла, в котором износ достигнет предела.\n\n§YПлановые закупки§!\nФокус \"$SHL_houses_railway$\" открывает решение включения планового снабжения. При производственном цикле оно покупает недостающие 1 или 2 пакета по текущей цене, если хватает денег. Это регулярные расходы казны, а не бесплатный резерв.\n\n§YМеталл на продажу§!\nСвободная экспортная печь может работать на контракт: решение \"$SHL_metal_contract_offer$\" предлагает Кефрейту, Стеландеру, Земле Хана и другим покупателям металл Золотых ворот за плату каждый цикл. Контракт держится, пока покупатель платит и между сторонами нет войны.\n\n§YРежим и собственность§!\nБережная плавка уменьшает износ ценой дохода, усиленная требует двойного сырья ради большей выручки. Режимы открывает промышленная ветка. Погашение лишает дом голоса, завод остаётся городу; повторный запуск оплачивается отдельно.\n\n§YДесятая печь§!\nТоварищество, земля, строительство и первая плавка - отдельные оплачиваемые этапы, открываемые фокусами. Планируйте их вместе с содержанием девяти действующих печей."
 SHL_startup_guide_fire_title: "Раздел огня и кварталы"
 SHL_startup_guide_fire: "§YКОМУ ОТДАТЬ ПЛАВКУ§!\n\n§YОдин получатель для каждой печи§!\nВыберите печь и назначьте экспорт, арсенал, кварталы или герб. Назначение сохраняется; сырьё расходуется и результат выдаётся только в успешную смену. Десятая печь выбирается отдельно.\n\n§YЦена выбора§!\nЭкспорт даёт 60 / 90 / 25 казны до удержаний. Арсенал вместо денег даёт 2700 / 5400 / 1350 винтовок. Кварталы снижают недовольство на 4 / 6 / 2, гербы снижают давление на 4 / 6 / 2. Порядок: обычная / усиленная / бережная смена. Сырьё и ремонт оплачиваются отдельно.\n\n§YКурс и заказы§!\nДома и регентство усиливают поставки гербам; города и коммуна - кварталам. Города удешевляют городские заказы, дирекция - арсенальные. Платный заказ занимает одну печь и один общий слот: обычной поставки вдобавок нет. Цена и возврат фиксируются при оплате. После расчёта печь продолжает снабжать получателя заказа.\n\n§YПоддержка домов§!\nДом с правом голоса поддерживает нас после фактической поставки гербу. Большинство даёт гарантии Конклава без §Y40§! £political_power_texticon. Компенсация после смены собственника не возвращает голос. При коммуне поставки гербам закрыты.\n\n§YСледите за сроками§!\nНедовольство и давление от 60 могут открыть кризис. Поставки не отменяют фонового роста шкал. Износ от 90 грозит аварией: оставляйте резерв на ремонт и ответы на события."
 SHL_startup_guide_wars_title: "Подготовка к войне"
 SHL_startup_guide_wars: "§YОТ ЗАВОДСКОЙ СТРАЖИ К ОБОРОНЕ§!\n\n§YСрок первой угрозы§!\nПервый мазаранский вызов назначен на 168-й день от начала кампании. Подготовка армии и снабжения должна идти рядом с политическим строительством. Ожидание десятой печи не останавливает соседний кризис.\n\n§YСоберите реальные силы§!\n\"Охрана железной дороги\", \"Заводская стража\" и \"Южная стража\" помогают подготовить оборону. Проверьте, что открыл каждый фокус: доступное решение ещё нужно исполнить. Военный мандат курса и \"Две плавки для фронта\" дают дополнительные возможности. Сверяйте полученные формирования с запасами для пополнения.\n\n§YСодержите печи во время подготовки§!\nАрмейские расходы конкурируют с сырьём и ремонтом. Проверьте местные запасы, время до следующего цикла и резерв казны. Поставки арсеналу заменяют выручку выбранных печей; сохраняйте деньги на подвоз и ремонт.\n\n§YОтвет на требование§!\nКогда Мазар потребует плату за безопасность южного округа, сравните цену платежа и выкупа спора с готовностью к отказу и войне. Конкретные суммы и сроки указаны в предложении. После столкновения \"Цена наступившего мира\" открывает восстановление выбранного района.\n\n§YВнешние решения§!\nСпоры о воде и морском выходе открывают соответствующие фокусы. Смотрите доступные договоры и условия в решениях. Обычные дипломатические кнопки объявления войны и создания союза отключены: внешние действия оформляются фокусами, решениями и событиями.\n\nСведения о соседях находятся в \"Регионе\", политические варианты южной кампании - в \"Путях\". Здесь главное - успеть подготовить оплаченные силы, сохранить производство и ответить на действующие сроки."
 SHL_startup_guide_plan_title: "Первые шаги"
 SHL_startup_guide: "§YПЕРВЫЕ ШАГИ ЗА ШАХРАБАД§!\n\n§Y1. Осмотрите девять печей.§! Откройте \"$SHL_conclave$\". В начале у каждой печи 2 пакета сырья, в общем резерве ещё 2. Проверьте износ, режим смены и время до ближайшего 28-дневного цикла.\n\n§Y2. Запланируйте третью плавку.§! Двух местных пакетов хватает на два обычных цикла. До третьего нужны новые поставки, передача резерва или работающее плановое снабжение. Покупка идёт 7 дней; общий резерв можно передать сразу.\n\n§Y3. Не путайте резерв со снабжением.§! \"Перепись девяти печей\" и \"Резерв на следующую смену\" добавляют по 2 пакета в общий запас. Печи не получают их автоматически. Распределяйте запас туда, где он нужен раньше всего.\n\n§Y4. Сопоставьте стройку и содержание.§! После \"Правил Конклава\" выбирается политический курс, а ствол ведёт к десятой печи. Её этапы оплачиваются отдельно. Сначала оставьте деньги на сырьё и ближайший ремонт, затем назначайте новую стройку.\n\n§Y5. Готовьте оборону заранее.§! Первый вызов Мазара приходится на 168-й день. Проверяйте открытые военные решения и реальные сроки подготовки, не откладывая армию до завершения всего политического курса.\n\n§Y6. Проверяйте шкалы и баланс.§! Раздел \"$SHL_quarters_and_borders$\" показывает недовольство кварталов, давление гербов и шкалу \"$SHL_conclave_balance$\". Шкалы ведут к кризисам, баланс решает, какой курс можно ратифицировать. При начале кризиса прочитайте миссию и ответьте до окончания таймера. Курсы и их исходы описаны в \"Путях\".\n\n§Y7. Читайте Конклав.§! Книга печей раз в несколько месяцев открывает хронику Закона непрерывного огня, Архив Конклава и короткие сцены жизни печей показывают дома и кварталы, а \"$SHL_festival_of_fire$\" раз в год собирает город у Золотых ворот. Это истории, а не задачи; главу можно закрыть на любой странице."
 SHL_startup_path_0_title: "Пять курсов Конклава"
 SHL_startup_path_0: "§YПЯТЬ КУРСОВ КОНКЛАВА§!\n\nДесятая печь в Девятипечье не принадлежит ни одному дому. Кому она достанется, решает, кому принадлежит Шахрабад. Три курса выбираются в дереве открыто, два открываются только кризисом.\n\n§YДесятый дом - Конклав десяти§!\nТоварищество становится десятым гербом. Джалиль Нур остаётся посредником, картель Золотых ворот торгует от имени всех домов, а Юг собирается долговой сетью и торговыми протекторатами.\n\n§YОткрытый Конклав - Южный договор§!\nГорода получают хартии и голос. Мариам Арбин ведёт Южный договор: советы и выборы, хартии колодцев, свободный тракт. Кейзан становится первым членом договора.\n\n§YДирекция Нура - Дирекция печей§!\nПечи переходят государству. Нур меняет кресло посредника на кабинет директора, Рауф Дарбан связывает цех, склад и фронт единым приказом. Железный марш присоединяет соседей, не согласившихся на договор.\n\n§YРегентство - Совет гербов§! (скрытый курс)\nПосле проигранной Ночи гербов Дарий Сафир возвращает домам печи и привилегии; частные армии и залоги выручки заменяют государство.\n\n§YКоммуна огня§! (скрытый курс)\nПосле выигранной стачки советы смен берут печи; кабинет коммуны ведёт Салима Дарзи из Шарима. Советы за рубежом и подполье Светлогорья готовят восстание нефтяников.\n\n§YДевять домов§!\nДом носит имя области своей главной печи: Арбин, Сафир, Лоран, Нур (Нуран), Байрат, Кердан, Шарим, Дарбан (Девятипечье) и Вейран. Глава дома сидит в Конклаве и может войти в кабинет, пока его печь горит и принадлежит дому.\n\nРатификация любого курса загружает собственное дерево фокусов, меняет лидера, партию и название Лиги. Какой курс можно ратифицировать, определяет баланс Конклава: гербы против кварталов."
 SHL_startup_path_0_details: "§YКУРСЫ: БАЛАНС, РАТИФИКАЦИЯ, ДЕРЕВО§!\n\n§Y1. Предварительный курс.§! После \"$SHL_conclave_rules$\" выберите \"$SHL_new_house$\", \"$SHL_open_conclave$\" или \"$SHL_nur_directorate$\": они исключают друг друга. Выбор сразу сдвигает баланс Конклава к гербам, к кварталам или оставляет его на месте и открывает производственный заказ курса.\n\n§Y2. Баланс Конклава.§! Шкала \"$SHL_conclave_balance$\" в разделе \"$SHL_quarters_and_borders$\" показывает, кто держит зал: гербы домов или кварталы. Её двигают передача погасших печей, \"$SHL_workers_charter$\", выбор между \"$SHL_heralds_table$\" и \"$SHL_quarter_listening$\", банкеты и общие котлы, исход стачек и ультиматумов. Каждый диапазон даёт свои модификаторы и открывает или закрывает ратификацию.\n\n§Y3. Ратификация.§! \"$SHL_admit_tenth_house$\" требует перевеса или власти гербов; \"$SHL_rights_without_fire$\" - перевеса или власти кварталов и гражданской опоры; \"$SHL_state_furnaces$\" - равновесия. Все три требуют \"$SHL_workers_charter$\"; десятая печь остаётся отдельной стройкой. Регентство и коммуна ратифицируются не фокусом, а выбором в событии кризиса (см. следующую страницу).\n\n§Y4. Новое дерево.§! Ратификация заменяет дерево Конклава деревом курса; завершённые фокусы подготовки сохраняются. У курса свой лидер, партия, название, дух и суперсобытие. Дерево делится на устройство (две развилки политики), хозяйство (программы с ценой и сроком), консолидацию Юга, общий фронт войны за Юг и эпилог после победы.\n\n§Y5. Кому служит огонь.§! Дома и регентство усиливают поставки гербам, города и коммуна - кварталам; дирекция удешевляет арсенальные заказы, города - городские. Погасшая или отобранная печь лишает дом его советника в кабинете, а дом без печи теряет голос в Конклаве."
 SHL_startup_path_1_title: "Кризисы и война за Юг"
 SHL_startup_path_1: "§YКОГДА КОНКЛАВ ЛОМАЕТСЯ§!\n\nДва курса нельзя выбрать в дереве: их открывает кризис, а разрешает - баланс Конклава.\n\n§YХолодная смена§!\nНедовольство кварталов растёт от усиленных смен и простоев. Когда оно переходит порог, советы смен останавливают печи без разрушения. Конклав может уступить, переждать или послать стражу. Если стачка не сломлена и кварталы держат зал, советы требуют власти: Нур уходит, печи переходят рабочим, страна становится Коммуной огня.\n\n§YУльтиматум гербов§!\nДавление гербов растёт от городских реформ и отобранных печей. Дома предъявляют ультиматум, за которым стоят частные гвардии и казна Сафира. Если Конклав не ответит и гербы держат зал, наступает Ночь гербов: Дарий Сафир становится регентом, страна - Советом гербов.\n\n§YПосле ратификации§!\nЦикл печей идёт дальше: каждые 28 дней печь расходует сырьё, приносит казну и изнашивается. Каждые четыре цикла дом с худшей печью (в курсах городов и коммуны - совет смен худшего квартала) предъявляет Конклаву требование. Сосед, проигравший ограниченную войну, через год возвращается с претензией.\n\n§YКонсолидация и война§!\nКаждый курс ведёт две кампании с миссиями и сроками: ультиматумы, союзы, ограниченные войны. Завершённые кампании и цикл печей наполняют кризис Юга. Когда он созреет, начинается война со Светлогорьем: её объявляет финальный фокус курса или сам кризис."
 SHL_startup_path_1_details: "§YКРИЗИСЫ И ВТОРАЯ ФАЗА: ПОДРОБНОСТИ§!\n\n§Y1. Вход в коммуну.§! Нужна действующая холодная смена и власть кварталов на шкале \"$SHL_conclave_balance$\". В событиях \"Холодная смена\" и \"Советы смен требуют власти\" появляется вариант \"$SHL_back_shift_councils$\": баланс уходит к кварталам, Нур в отставку, загружается дерево коммуны. Силовая расправа со стачкой, напротив, толкает баланс к гербам.\n\n§Y2. Вход в регентство.§! Нужен действующий ультиматум и власть гербов. В событиях \"Ультиматум гербов\" и \"Ночь гербов\" появляется вариант \"$SHL_back_crests$\": Дарий Сафир принимает печать, баланс уходит к гербам, загружается дерево регентства. Скрытый курс может заменить даже уже ратифицированный открытый курс; несовместимые заказы закрываются с возвратом неиспользованной оплаты.\n\n§Y3. Второй акт.§! После ратификации каждые четыре цикла приходит \"Требование у печи\": заплатить казной, уступить голос (баланс сдвигается в сторону требующих) или отказать. Отказ начинает миссию \"$SHL_house_demand$\": если печь не отремонтировать в срок, дом уходит в оппозицию, и его глава на время покидает кабинет. Розыгрыш аварий и караванов продолжается отдельно.\n\n§Y4. Соседи после войны.§! Проигравший сосед через год присылает событие \"Год после мира\": претензию можно выкупить или оставить записанной. Проигранный спор не закрывает консолидацию: такой сосед остаётся её целью со штрафом к согласию.\n\n§Y5. Консолидация Юга.§! Кампании открываются первым фокусом устройства курса и не ждут Светлогорья. Миссия кампании выполнена, когда цели подчинились или вступили в союз; по таймауту следует требование присоединения или повторное приглашение. Состояние кампаний показано в разделе \"$SHL_quarters_and_borders$\". Победа в кампании поднимает кризис Юга так же, как принятое подчинение.\n\n§Y6. Война за Юг.§! Фронтовой слой общий для всех курсов, повод и военные решения - свои: нефтяное эмбарго, война хартий, последняя плавка, война гербов, восстание нефтяников. Финальный фокус войны ждёт созревшего кризиса и мира; затянувшуюся войну решает удержание ключевых районов. Победитель получает корону Юга и эпилог курса: концессию, хартию, генерал-губернаторство, лены или слияние советов."
