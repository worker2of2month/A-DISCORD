 SHL_road_send_wholesale_desc: "Двор загромождён ящиками с клеймами оружейных мастерских. Винный торговец выставил перед погонщиками пять плетёных корзин с сургучными печатями. Свои корзины он доверяет обозу под подпись казначея."
