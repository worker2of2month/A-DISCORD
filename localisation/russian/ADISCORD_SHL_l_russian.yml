 SHL_r_regent_forever_tt: "Регентство списывает долги домов: государственный долг §G-500§! £ADISCORD_economy_treasury_texticon, верность каждого дома §G+20§! (давление гербов §G-20§!)."
 SHL_c_open_seats_tt: "Открытые места в совете: гражданская опора §G+20§!, недовольство кварталов §G-15§!."
 SHL_d_directorate_eternal_tt: "Дирекция обучает смены всех девяти печей: подготовка каждой печи §G+1§! (не выше 2)."
 SHL_k_duty_master_tt: "Дежурный мастер распределяет общий запас: каждая работающая печь получает §G+1§! £SHL_packet_texticon (не выше 3)."
 ADISCORD_SHL.130.c: "На 2 года - 15 £ADISCORD_economy_treasury_texticon каждые 28 дней"
 SHL_metal_accept_two_years_tt: "Контракт на 730 дней. Каждые 28 дней: -15 £ADISCORD_economy_treasury_texticon в пользу Шахрабада. Два неоплаченных цикла или война с Шахрабадом прекращают поставки."
 SHL_metal_contracts: "Поставки металла из Шахрабада"
 SHL_metal_contracts_desc: "Договор с картелем Золотых ворот обеспечивает заводы металлом из шахрабадских печей.\n\nКаждые §Y28§! дней: §R-[?SHL_metal_cycle_price|0]§! £ADISCORD_economy_treasury_texticon. Неоплаченных циклов: [?SHL_metal_arrears|0]/2. Война с Шахрабадом или два неоплаченных цикла прекращают договор."
 SHL_metal_contract_year: "Годовой контракт на металл"
 SHL_metal_contract_two_years: "Двухлетний контракт на металл"
 SHL_metal_contract_year_desc: "Караваны картеля доставляют металл по подписанному договору. Заводы выстраивают работу вокруг надёжных поставок."
 SHL_metal_contract_two_years_desc: "Долгосрочный договор связывает заводские планы с отгрузками Золотых ворот."
 SHL_metal_term_finished_tt: "Срок договора истекает: поставки, их бонусы и платежи прекращаются. Новый договор потребует нового предложения Шахрабада."

