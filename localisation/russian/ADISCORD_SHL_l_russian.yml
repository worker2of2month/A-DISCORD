 SHL_c_mariam_cabinet: "Кабинет Мариам Арбин"
 SHL_c_mariam_cabinet_desc: "Мариам Арбин собирает кабинет не из глав домов, а из тех, кто вёл городские ведомости, когда их ещё никто не признавал. Секретарь Рашад приносит печать, счетовод Надири - книги, и впервые за долгие годы бумаги Конклава подписывает не посредник, а глава договора."
 SHL_c_council_delegates: "Делегаты городов"
 SHL_c_council_delegates_desc: "Совет городов избирают городские собрания: по делегату от каждого города с собственной ведомостью. Дома сохраняют свои кресла, но рядом с ними садятся люди, за которыми стоят не печи, а улицы."
 SHL_c_shift_assembly: "Собрание смен"
 SHL_c_shift_assembly_desc: "Делегатов в совет выдвигают советы смен при печах. Рабочие журналы становятся избирательными списками, а дежурный мастер каждой печи получает право говорить от имени квартала. Гербы называют это переворотом в тетрадях."
 SHL_c_shift_assembly_tt: "Недовольство кварталов: §G-10§!. Гражданская опора: §G+10§!."
 SHL_c_regular_elections: "Регулярные выборы"
 SHL_c_regular_elections_desc: "Совет городов перестаёт быть собранием по случаю: раз в полгода делегаты возвращаются к тем, кто их послал, и либо получают мандат снова, либо уступают место. Договор живёт, пока его подтверждают."
 SHL_c_regular_elections_tt: "Каждые §Y180§! дней совет переизбирается: при гражданской опоре не ниже §Y40§! мандат подтверждён, иначе баланс сдвигается к гербам и кварталы ропщут."
 SHL_c_quarter_militia: "Дружины кварталов"
 SHL_c_quarter_militia_desc: "Кварталы, получившие голос, получают и право на собственную стражу. Дружины набирают из смен, оружие покупают на выручку печей, а командиров утверждает совет. Это армия, которая знает, какие улицы защищает."
 SHL_c_quarter_militia_tt: "Города выставят §Y2§! дивизии заводской стражи в Шахрабаде."
 SHL_c_compact_army: "Договорная армия"
 SHL_c_compact_army_desc: "Вместо дружин по кварталам договор нанимает уставы и инструкторов. Единая армия договора подчиняется совету, а не печи, и учится воевать строем, а не толпой у заводских ворот."
 SHL_c_compact_army_bonus: "Договорная армия"
 SHL_c_registry_of_all: "Реестр для всех"
 SHL_c_registry_of_all_desc: "Писцы договора обходят рабочие кварталы с книгами и чернилами. Каждый двор получает запись, каждая смена - страницу. Отныне в Шахрабаде нет людей, которых не существует для казны и для совета."
 SHL_c_registry_of_all_tt: "Гражданская опора: §G+10§!."
 SHL_c_open_ledger: "Открытая ведомость"
 SHL_c_open_ledger_desc: "Казначейская палата договора вывешивает счета печей и городов на площадях. Кто сколько получил и кто сколько должен, читают все грамотные, а неграмотным читают вслух. Воровать из открытой книги труднее, чем из закрытой."
 SHL_c_open_ledger_tt: "Коррупционные кризисы казначейства больше не случаются."
 SHL_c_charter_of_cities: "Хартия городов"
 SHL_c_charter_of_cities_desc: "Устройство договора записано в одну хартию: кто избирает, кто считает, кто защищает. Хартию подписывают города, советы смен и те дома, которые решили остаться за общим столом. Остальные читают её с другой стороны площади."
 SHL_c_civic_orders_plus: "Заказы своему району"
 SHL_c_civic_orders_plus_desc: "Городские заказы печам становятся обычным делом договора: совет оплачивает металл для своих мастерских заранее и берёт на себя часть риска. Печи знают, что город купит плавку, и льют спокойнее."
 SHL_c_civic_orders_plus_tt: "Депозит городского заказа печи меньше на §G30§! казны."
 SHL_c_furnace_schools: "Школы при печах"
 SHL_c_furnace_schools_desc: "При каждой печи открывается школа смен: грамота, счёт и ремесло в одном дворе. Мастера учат подростков тому, чему их самих учили у горна, а договор платит за доски, книги и тёплое помещение."
 SHL_c_furnace_schools_tt: "Школа при выбранной печи поднимает обучение её смен на ступень."
 SHL_c_quarter_hospitals: "Больницы кварталов"
 SHL_c_quarter_hospitals_desc: "Ожоги, лёгкие и спины литейщиков лечат теперь не знахари у стены, а больницы при кварталах. Договор нанимает врачей и платит им из городской казны, а не из милости домов."
 SHL_c_quarter_hospitals_tt: "Больница при печи снижает недовольство её кварталов и укрепляет гражданскую опору; по одной на область."
 SHL_c_cooperative_bank: "Кооперативный банк"
 SHL_c_cooperative_bank_desc: "Города и советы смен объединяют кассы в один банк договора. Он выдаёт кредиты мастерским, хранит выручку городских заказов и впервые даёт Шахрабаду казну, которой не распоряжаются девять домов."
 SHL_c_cooperative_bank_tt: "Казна: §G+150§!. Предел казны: §G+5%§!."
 SHL_c_water_works: "Водные работы"
 SHL_c_water_works_desc: "Банк договора финансирует воду для кварталов: цистерны, водоводы и буровые бригады для артезианских горизонтов. Вода перестаёт быть вопросом, который решают только с Кейзаном."
 SHL_c_water_works_tt: "Решение \"Артезианские скважины\" стоит §Y200§! казны вместо §Y250§!. Недовольство кварталов: §G-5§!."
 SHL_c_harbour_works: "Портовые работы"
 SHL_c_harbour_works_desc: "Банк договора вкладывается в дорогу к морю: причалы Кердана, склады и собственные суда для металла. Договор хочет торговать с миром, не спрашивая разрешения у Вейра."
 SHL_c_harbour_works_tt: "Решение \"Гавань Кердана\" стоит §Y250§! казны вместо §Y300§!."
 SHL_c_common_rail: "Общая дорога"
 SHL_c_common_rail_desc: "Железная дорога договора соединяет Нуран и Шарим с Хазаром. Её строят городские артели, а не дома, и первый состав везёт не металл, а делегатов на заседание совета."
 SHL_c_charter_round: "Срок хартий"
 SHL_c_charter_round_desc: "Приглашение в договор не может лежать на столах соседей вечно. Совет городов назначает срок: кто подпишет хартию колодцев до его истечения, станет членом договора, остальным предложат ещё раз - уже без первых условий."
 SHL_c_charter_round_tt: "Миссия на §Y150§! дней: договор ждёт двух союзников; по истечении срока отказавшим направят второе предложение."
 SHL_c_compact_court: "Суд договора"
 SHL_c_compact_court_desc: "Споры между членами договора решает общий суд, а не сильнейший из них. Судей присылают города, заседания открыты, и соседи впервые видят Шахрабад не как кредитора, а как сторону, готовую проиграть дело."
 SHL_c_cistern_charter: "Хартия цистерн"
 SHL_c_cistern_charter_desc: "Мазару, считавшему шахрабадский металл частью своего пайка, договор предлагает другую арифметику: общие цистерны Зарханского округа и место в совете вместо дани. Пока отряды Мазара не перешли границу, эту бумагу ещё можно подписать."
 SHL_c_cistern_charter_tt: "Хартию цистерн можно предложить Мазару до войны, пока он не враг Шахрабада."
 SHL_c_charters_for_occupied: "Хартии занятых районов"
 SHL_c_charters_for_occupied_desc: "За линией фронта договор не ставит наместников. В каждый занятый район приезжают писцы с той же хартией, что получили Хазар и Кейзан: местный совет, местная ведомость, местная стража. Жителям проще принять бумагу, чем гарнизон."
 SHL_c_compact_volunteers: "Добровольцы договора"
 SHL_c_compact_volunteers_desc: "Советы смен объявляют запись добровольцев. Идут те, кто голосовал за хартию и теперь готов защищать её на фронте; оружие им выдают из городских запасов, командиров они выбирают сами."
 SHL_c_compact_volunteers_tt: "В Хазаре формируются §Y2§! полностью вооружённые дружины."
 SHL_c_svetlogorye_charter: "Хартия Светлогорья"
 SHL_c_svetlogorye_charter_desc: "Побеждённое Светлогорье получает не наместника, а хартию: нефтяники выбирают свой совет, промыслы работают на общих условиях договора, а бывшие сателлиты Севера решают сами, в какой столице заседать."
 SHL_c_svetlogorye_charter_tt: "Южные сателлиты интегрируются по согласию: самоуправляемые хартии Светлогорья и его бывших подданных входят в Южный договор."
 SHL_c_southern_council: "Совет Юга"
 SHL_c_southern_council_desc: "В Хазаре открывается совет учёных и мастеров всего Юга: инженеры Девятипечья, нефтяники Севера, гидравлики Кейзана. Договор впервые думает о пустыне как об одной мастерской."
 SHL_c_southern_commons: "Общины Юга"
 SHL_c_southern_commons_desc: "Вместо академии договор вкладывается в дороги и дворы: артели Хазара, Арбина и Вейрана строят то, что раньше обещали, но не строили дома. Победа должна быть видна с улицы."
 SHL_c_compact_assembly: "Собрание договора"
 SHL_c_compact_assembly_desc: "Делегаты всех членов договора собираются в одном зале. Совет Юга становится собранием, перед которым отчитывается и Хазар, и гербы, и кварталы впервые видят, что их голос слышен за пределами города."
 SHL_c_open_seats: "Открытые кресла"
 SHL_c_open_seats_desc: "В зале совета ставят кресла без имён: любой член договора может занять их, когда решается его вопрос. Гербы ворчат, что это базар, а не Конклав, но на базаре давно не было так спокойно."
 SHL_c_treaty_of_the_south: "Договор Юга"
 SHL_c_treaty_of_the_south_desc: "Хартия городов становится договором всего Юга. Шахрабад не короновал себя - он подписал бумагу вместе со всеми, и именно поэтому его подпись стоит первой."

 # ----- commune -----
 SHL_k_delegates: "Делегаты смен"
 SHL_k_delegates_desc: "Каждая печь присылает в Хазар своих делегатов на срок одной плавки. Никто не сидит в совете дольше, чем горит его смена, и кварталы впервые видят, что власть можно отозвать так же просто, как выдать."
 SHL_k_standing_council: "Постоянный совет"
 SHL_k_standing_council_desc: "Делегаты расходятся по печам, а в Хазаре остаётся дежурный мастер - Салима Дарзи из Шарима, той самой печи, где смены были тяжелее всего. Совет работает круглые сутки, как и печи, которые он представляет."
 SHL_k_standing_council_tt: "Дежурный мастер §YСалима Дарзи§! возглавляет постоянный совет коммуны вместо коллективного Совета смен."
 SHL_k_rotating_smelting: "Плавка по очереди"
 SHL_k_rotating_smelting_desc: "Девять печей переходят городам без праздника и без уступок: кварталы требовали не отдыха, а порядка. Советы составляют общую очередь плавок, и ни одна печь больше не стоит, пока соседняя задыхается от заказов."
 SHL_k_rotating_smelting_tt: "Все печи Шахрабада перейдут городам; погасшие будут готовы к оплаченному запуску."
 SHL_k_no_crests: "Без гербов"
 SHL_k_no_crests_desc: "Совет вычёркивает из ведомостей последнюю графу - герб владельца. Дома могут хранить свои печати в сундуках, но в Шахрабаде больше нет стола, за который их можно было бы положить."
 SHL_k_no_crests_tt: "Давление гербов обнуляется и больше не растёт: наследственные дома не предъявляют коммуне требований."
 SHL_k_shift_school: "Школа смен"
 SHL_k_shift_school_desc: "Самые опытные мастера уходят от печей в учебные цеха. Смена, которая раньше училась на собственных ожогах, получает наставников и журналы, из которых видно, где кладка сдаст раньше."
 SHL_k_shift_school_tt: "Школа обучает смены печи с наибольшим износом."
 SHL_k_common_treasury: "Общая казна"
 SHL_k_common_treasury_desc: "Сундуки Сафира и Лорана вскрывают при делегатах. Выручка печей больше не оседает в домах: совет записывает каждый расход в открытую ведомость, и кварталы впервые знают, сколько стоит их металл."
 SHL_k_common_treasury_tt: "Казна: §G+100§! £ADISCORD_economy_treasury_texticon. Вместимость казны: §G+5%§!."
 SHL_k_commune_charter: "Хартия коммуны"
 SHL_k_commune_charter_desc: "Делегаты записывают то, что уже стало обычаем: печи принадлежат сменам, совет отчитывается перед кварталами, а оружие коммуны лежит в руках тех, кто льёт металл. Хартия короткая - её читают вслух у каждой печи."
 SHL_k_brotherly_supply: "Братские поставки"
 SHL_k_brotherly_supply_desc: "Печь с полным складом не ждёт, пока соседняя остынет без руды. Караван уходит ночью, без накладных и без платы: завтра очередь может быть обратной."
 SHL_k_brotherly_supply_tt: "Печь с запасом сырья передаёт один пакет соседней без оплаты."
 SHL_k_cauldron_plus: "Общий котёл"
 SHL_k_cauldron_plus_desc: "Ремонтные бригады коммуны берут кладку шире, чем требовал старый регламент домов. Печь, которая вышла из общего котла, стоит дольше следующей смены."
 SHL_k_cauldron_plus_tt: "Общий котёл снимает §G40§! износа вместо §Y30§!."
 SHL_k_workers_rail: "Рельсы рабочих"
 SHL_k_workers_rail_desc: "Смены Шарима и Арбина кладут путь между своими печами в свободные часы. Дорога, построенная руками тех, кто по ней повезёт руду, не нуждается в подряде дома."
 SHL_k_workers_wells: "Скважины кварталов"
 SHL_k_workers_wells_desc: "Вода кяризов принадлежит общинам Кейзана, а не домам. Советы предлагают кварталам свой ответ: артезианские скважины, пробуренные без казны и без долга."
 SHL_k_workers_wells_available_tt: "Открыт §Yвопрос воды§!, и спор о кяризах ещё не закрыт"
 SHL_k_workers_wells_tt: "Бурение артезианских скважин не требует казны."
 SHL_k_arms_for_shifts: "Оружие сменам"
 SHL_k_arms_for_shifts_desc: "Арсенальная плавка идёт не на склад Конклава, а прямо в кварталы. Каждая смена знает, где лежат её винтовки, и каждая печь сама решает, кто будет их держать."
 SHL_k_councils_term: "Срок советов"
 SHL_k_councils_term_desc: "Приглашение не может висеть в воздухе вечно. Совет называет день: к этому сроку правительства Мазара и Вейра либо встанут рядом с советами, либо их рабочие услышат другое предложение."
 SHL_k_councils_term_tt: "Начинается миссия §YСрок советов§! на §Y180§! дней. Если к сроку ни Мазар, ни Вейр не вступят в союз, приглашение будет повторено с новыми условиями."
 SHL_k_strike_support: "Поддержка стачек"
 SHL_k_strike_support_desc: "Докеры Вейра и рабочие пайка в Мазаре читают листовки Хазара, но стачка держится не на словах. Коммуна посылает им деньги, хлеб и людей, которые знают, как останавливать печи, не ломая их."
 SHL_k_strike_support_tt: "Поддержка советов в выбранной стране растёт; при высокой поддержке её правительство получает предложение союза повторно."
 SHL_k_weber_contact: "Связь с Вебером"
 SHL_k_weber_contact_desc: "Первый караван к подполью Ярослава Вебера везёт не армию, а доверие: несколько ящиков винтовок, шифр и имя человека на той стороне пустыни. Большая поставка пойдёт по уже проверенной дороге."
 SHL_k_weber_contact_tt: "Подполье Светлогорья получает связь с коммуной и первые винтовки; они достанутся восставшим нефтяникам в первый день войны за Юг.\nНедовольство кварталов: §G-5§!."
 SHL_k_shift_brigades: "Бригады смен"
 SHL_k_shift_brigades_desc: "Печи не останавливаются, но половина каждой смены уходит на фронт. Бригада строится у своей печи, под своим знаменем, и уносит с собой винтовки собственной плавки."
 SHL_k_shift_brigades_tt: "Смены выставят §Y2§! дивизии заводской стражи в Шахрабаде."
 SHL_k_strikes_on_fields: "Стачки на промыслах"
 SHL_k_strikes_on_fields_desc: "Налёты на нефтяной пояс больше не нужно согласовывать: нефтяники Севера сами гасят вышки, едва колонны коммуны подходят к промыслам."
 SHL_k_strikes_on_fields_tt: "Решение §YНалёт на промыслы§! больше не требует политической власти."
 SHL_k_union_of_councils: "Слияние советов"
 SHL_k_union_of_councils_desc: "Победа не даёт коммуне подданных. Советы освобождённых районов входят в общее собрание на тех же правах, что и смены Хазара, и Юг впервые управляется из одного зала без единого герба на стене."
 SHL_k_union_of_councils_tt: "Южные сателлиты Шахрабада входят в коммуну по правилам слияния советов."
 SHL_k_oil_commune: "Нефтяная коммуна"
 SHL_k_oil_commune_desc: "Вышки Светлогорского пояса переходят советам нефтяников. Восставшие, которых коммуна вооружала через пустыню, теперь сами ведут добычу и отправляют топливо печам без лестницы печатей."
 SHL_k_furnace_commune: "Печная коммуна"
 SHL_k_furnace_commune_desc: "Юг кормит печи, а не наоборот. Нефть и руда освобождённых районов идут в Хазар, где смены ставят новые цеха рядом со старыми печами."
 SHL_k_no_more_crests: "Гербов больше нет"
 SHL_k_no_more_crests_desc: "Последние дома Юга распускают свои гвардии и сдают печати. Никто их не преследует: гербам просто не осталось ни одной печи, за которой можно было бы стоять."
 SHL_k_duty_master: "Дежурный мастер Юга"
 SHL_k_duty_master_desc: "Советы всего Юга признают один порядок дежурства. Мастер, подписывающий решения в Хазаре, отвечает теперь за все печи и вышки от Золотых ворот до нефтяного пояса."
 SHL_k_fire_of_the_south: "Огонь Юга"
 SHL_k_fire_of_the_south_desc: "Коммуна огня перестала быть городом и стала Югом. Печи горят для всех, кто их держит, вода и нефть принадлежат общинам, а гербы остались в учебниках истории."

 # ----- directorate -----
 SHL_d_nur_director: "Нур - директор"
 SHL_d_nur_director_desc: "Джалиль Нур двадцать лет мирил девять домов, не владея ничем, кроме малой печи Нурана. Теперь посредник подписывает приказы: кабинет Конклава становится канцелярией дирекции, а секретарь Рашад переносит печать из зала гербов в здание на площади Хазара."
 SHL_d_state_furnaces_law: "Закон о государственных печах"
 SHL_d_state_furnaces_law_desc: "Закон непрерывного огня переписан одной строкой: печь горит для Шахрабада. Дома сохраняют имена и дворы, но ведомости, смены и сырьё ведёт инженерная коллегия Дарбана. Погасшая печь больше никому не возвращается - она и так государственная."
 SHL_d_state_furnaces_law_tt: "Все печи Шахрабада закреплены за дирекцией."
 SHL_d_concessions_law: "Закон о концессиях"
 SHL_d_concessions_law_desc: "Дирекция не хочет содержать девять дворов. Дом, готовый платить, получает свою печь назад в аренду - с государственной ведомостью, государственным инспектором и правом дирекции расторгнуть договор одним приказом. Гербы называют это возвращением, Нур - учётом."
 SHL_d_concessions_law_tt: "Аренда возвращает печь дому за плату в казну; каждая концессия усиливает голос гербов в Конклаве."
 SHL_d_darban_engineers: "Инженеры Дарбана"
 SHL_d_darban_engineers_desc: "Рауф Дарбан строил десятую печь, пока остальные спорили, кому она достанется. Его инженерный дом становится техническим штабом дирекции: чертежи цехов, нормы кладки и расчёты тяги расходятся по всем девяти печам как приказы."
 SHL_d_military_directorate: "Дирекция вооружений"
 SHL_d_military_directorate_desc: "Первый спор нового государства - что строить. Дарбан требует оружейных цехов при Девятипечье: пока соседи считают сборы и пайки, дирекция должна считать винтовки. Гражданские заказы подождут."
 SHL_d_industrial_directorate: "Дирекция строительства"
 SHL_d_industrial_directorate_desc: "Нур выбирает иначе: государство без собственных заводов и дорог не удержит и печей. Хазар получает первую государственную фабрику, а дорожные партии дирекции выходят на тракты раньше оружейников."
 SHL_d_directorate_courts: "Суды дирекции"
 SHL_d_directorate_courts_desc: "Ночь гербов научила Нура не ждать ультиматумов. Промышленные суды дирекции разбирают дела домов о сокрытой выручке и остановленных сменах, а приговор исполняет стража Конклава. Кварталы замечают, что судят только гербы, и спрашивают, кто будет судить дирекцию."
 SHL_d_directorate_courts_tt: "Давление гербов: §G-10§!. Недовольство кварталов: §R+5§!."
 SHL_d_quotas_law: "Закон о квотах"
 SHL_d_quotas_law_desc: "Каждая печь получает мобилизационную норму: столько металла и столько смен, сколько скажет дирекция. Квота объявляется приказом, а не договором; кварталы, которым достаются усиленные смены без доплаты, запоминают, чей это приказ."
 SHL_d_quotas_law_tt: "Квота переводит выбранную печь на арсенал на два цикла и даёт §Y600§! £infantry_equipment_texticon сверх плавки; кварталы этой печи ответят недовольством."
 SHL_d_iron_charter: "Железная хартия"
 SHL_d_iron_charter_desc: "Хартия закрепляет то, что уже стало привычкой: печи, склады, дороги и стража подчиняются одному приказу. Шахрабад называет себя Железным не ради оружия - ради порядка, в котором ни один дом и ни один квартал не может остановить огонь."
 SHL_d_directorate_railway: "Железная дорога дирекции"
 SHL_d_directorate_railway_desc: "Дарбан кладёт рельсы от Девятипечья к Хазару: металл с печей - на склады столицы, уголь и руда - обратно. Для дирекции дорога важнее договора: по ней идут приказы."
 SHL_d_directorate_railway_tt: "Стройка поднимет инфраструктуру Девятипечья и Хазара."
 SHL_d_state_bank: "Государственный банк печей"
 SHL_d_state_bank_desc: "Выручку печей больше не хранят в сундуках домов. Банк дирекции собирает её в Хазаре и выдаёт только под приказ: на сырьё, на дорогу, на оружие. Счетовод Надири впервые видит все девять ведомостей на одном столе."
 SHL_d_state_bank_tt: "Казна: §G+200§! £ADISCORD_economy_treasury_texticon."
 SHL_d_arsenal_orders_plus: "Арсенальные заказы"
 SHL_d_arsenal_orders_plus_desc: "Арсенал дирекции перестаёт быть покупателем. Он назначает цену, а печь обязана отлить. Оружейные заказы становятся дешевле не потому, что металл подешевел, а потому, что торговаться больше не с кем."
 SHL_d_arsenal_orders_plus_tt: "Арсенальные заказы печам дешевле на §Y30§! £ADISCORD_economy_treasury_texticon."
 SHL_d_fuel_depots: "Топливные склады"
 SHL_d_fuel_depots_desc: "Нефть Севера приходит в Шахрабад караванами и может перестать приходить в любой день. Дирекция строит в Хазаре государственные хранилища и заполняет их, пока Светлогорье ещё продаёт."
 SHL_d_cannon_works: "Пушечные цеха"
 SHL_d_cannon_works_desc: "Литейщики Девятипечья умеют лить не только прокат. Дирекция ставит при печи Дарбана орудийный цех: первые батареи дирекции собираются из металла, который вчера шёл на экспорт."
 SHL_d_truck_works: "Грузовые мастерские"
 SHL_d_truck_works_desc: "Пустыня съедает обозы быстрее, чем враг. Дирекция собирает в Хазаре грузовые мастерские: машины дирекции повезут металл, снаряды и воду туда, где караваны не успевают."
 SHL_d_evacuation_plan: "План эвакуации"
 SHL_d_evacuation_plan_desc: "Инженеры Дарбана расписывают каждый цех по вагонам: что вывозить первым, кто остаётся гасить печь, куда едут чертежи. План, составленный на случай поражения, впервые собирает всё знание печей в одном месте."
 SHL_d_ultimatum_term: "Срок ультиматума"
 SHL_d_ultimatum_term_desc: "Кейзан и Вейр получили требование и теперь тянут время. Дирекция назначает срок: сто двадцать дней на ответ. Тех, кто промолчит, Железный Шахрабад больше не будет спрашивать."
 SHL_d_ultimatum_term_tt: "Начинается миссия §YСрок ультиматума§!: через §Y120§! дней Кейзан и Вейр, не вошедшие в Шахрабад, получают требование присоединения, за которым следует война."
 SHL_d_march_logistics: "Обоз марша"
 SHL_d_march_logistics_desc: "Железный марш идёт через пески, где нет ни дорог, ни колодцев. Дирекция забирает у печей две плавки на запасные части и походное снаряжение по казённой цене: дома, которым раньше платили за обоз, теперь получают приказ."
 SHL_d_march_logistics_tt: "Обоз похода у печи стоит §Y90§! £ADISCORD_economy_treasury_texticon вместо 120."
 SHL_d_occupation_administration: "Администрация занятых земель"
 SHL_d_occupation_administration_desc: "Там, куда приходит дирекция, остаётся её канцелярия. Присоединённые округа получают инспектора, ведомость и стражу Конклава раньше, чем воду и хлеб. Сопротивление встречают учётом, а не переговорами."
 SHL_d_war_orders_all: "Военные заказы всем печам"
 SHL_d_war_orders_all_desc: "С началом войны за Юг арсенал дирекции не ждёт плавок по очереди. Склады Хазара выдают фронту всё, что накоплено за годы заказов, а каждая печь получает военную норму."
 SHL_d_guard_to_front: "Заводская стража на фронт"
 SHL_d_guard_to_front_desc: "Стража печей охраняла цеха от стачек и гербов. Теперь дирекция ставит её под знамёна: дивизии заводской стражи выходят из Хазара на юг, а охрану цехов принимают сами кварталы."
 SHL_d_guard_to_front_tt: "Дирекция выставит §Y2§! дивизии заводской стражи в Хазаре."
 SHL_d_general_governorate: "Генерал-губернаторство"
 SHL_d_general_governorate_desc: "Юг получает одного администратора. Побеждённые столицы становятся резиденциями генерал-губернаторов дирекции; их советы распущены, ведомости переписаны по образцу Хазара, печати сданы в канцелярию Нура."
 SHL_d_general_governorate_tt: "Побеждённые государства Юга интегрируются как генерал-губернаторства дирекции по условиям мира за Юг."
 SHL_d_iron_south_rail: "Железная дорога Юга"
 SHL_d_iron_south_rail_desc: "От Хазара через Кердан к нефтяному поясу ложится одна линия. Дорога дирекции соединяет печи с промыслами, которые вчера принадлежали Светлогорью: металл идёт на юг, топливо - на север, оба по государственному расписанию."
 SHL_d_iron_south_garrisons: "Гарнизоны Юга"
 SHL_d_iron_south_garrisons_desc: "Дорога подождёт: сначала нужно удержать взятое. Дирекция формирует гарнизонные дивизии заводской стражи для присоединённых округов и ставит их там, где ещё вчера стояли дозоры сухого русла."
 SHL_d_iron_south_garrisons_tt: "Дирекция выставит §Y3§! дивизии заводской стражи в Хазаре для гарнизонной службы на Юге."
 SHL_d_iron_crown: "Железный венец"
 SHL_d_iron_crown_desc: "Шахрабад не коронует Нура - дирекция не знает корон. Но Юг от кяризов до нефтяного пояса живёт по одному расписанию, и старые дома признают, что посредник, которого они терпели, стал государством."
 SHL_d_directorate_eternal: "Дирекция навсегда"
 SHL_d_directorate_eternal_desc: "Временное управление печами, объявленное на год, не отменяется никогда. Дирекция становится формой государства: гербы и кварталы спорят о квотах, но никто больше не спрашивает, кому принадлежит огонь."
 SHL_d_nur_legacy: "Наследие Нура"
 SHL_d_nur_legacy_desc: "Джалиль Нур уходит из зала гербов так же тихо, как вошёл в него. Его наследие - не дом и не печь, а канцелярия, которая работает без него: приказы подписывают инженеры, а огонь горит по расписанию."

 # ----- houses -----
 SHL_h_cartel_price: "Твёрдая цена картеля"
 SHL_h_cartel_price_desc: "Лоран и Сафир настаивают: покупатель должен знать цену металла на год вперёд. Картель объявляет единый тариф у Золотых ворот и отказывается торговаться с каждым караваном отдельно."
 SHL_h_cartel_price_tt: "Экспортная печь продаёт плавку по твёрдой цене §Y60§! £ADISCORD_economy_treasury_texticon за цикл."
 SHL_h_metal_exchange: "Биржа металла"
 SHL_h_metal_exchange_desc: "Кердан и Дарбан считают твёрдую цену подарком покупателю. У Золотых ворот открывается биржа: курс металла меняется с каждой плавкой, а вместе с ним - выручка и риск домов."
 SHL_h_metal_exchange_tt: "Выручка экспортной печи следует биржевому курсу: от §Y45§! до §Y75§! £ADISCORD_economy_treasury_texticon за цикл вместо твёрдых §Y60§!."
 SHL_h_guild_schools: "Школы гильдий"
 SHL_h_guild_schools_desc: "Мастера картеля открывают школы при цеховых гильдиях. Ученики учатся не у одного дома, а у всех десяти, и уносят с собой приёмы лучших плавильщиков Шахрабада."
 SHL_h_house_guards_charter: "Хартия гвардий домов"
 SHL_h_house_guards_charter_desc: "Конклав записывает права и обязанности частных гвардий: кто кормит стражу, кому она подчиняется на марше и где кончается двор дома. Гербы получают закон вместо подозрений."
 SHL_h_house_guards_charter_tt: "Дома оплатят §Y2§! дивизии заводской стражи в Хазаре. Давление гербов: §G-10§!."
 SHL_h_conclave_mercenaries: "Наёмная стража Конклава"
 SHL_h_conclave_mercenaries_desc: "Вместо того чтобы вооружать каждый двор, Конклав заключает договоры с бригадами пустынной стражи. Платит общая касса картеля, и бригады отвечают перед посредником, а не перед гербом."
 SHL_h_conclave_mercenaries_tt: "Наём пустынной стражи обходится на §G25%§! дешевле: §Y225§! £ADISCORD_economy_treasury_texticon вместо 300."
 SHL_h_golden_gate_festival: "Праздник Золотых ворот"
 SHL_h_golden_gate_festival_desc: "В день открытия торгового сезона картель раздаёт металл городу: решётки, лампы, колодезные вороты. Кварталы помнят, кто льёт металл, пока за воротами выстраиваются караваны."
 SHL_h_heralds_court: "Суд гербов"
 SHL_h_heralds_court_desc: "Дома учреждают собственный суд над заговорами внутри Конклава. Арестовать герб теперь может не только дирекция: достаточно решения семи печей. Кварталы видят в этом новый сговор владельцев."
 SHL_h_heralds_court_tt: "В кризисе гербов домам доступны аресты заговорщиков, прежде доступные лишь дирекции. Недовольство кварталов: §R+5§!."
 SHL_h_council_of_ten: "Совет десяти"
 SHL_h_council_of_ten_desc: "Десятая печь получает не только кресло, но и голос. Протокол Конклава переписан: отныне согласие гербов считается от десяти огней, и посредник Нур ведёт счёт сам."
 SHL_h_council_of_ten_tt: "Десятая печь Девятипечья считается голосом дома при подсчёте голосов Конклава."
 SHL_h_tenth_house_seat: "Кресло десятого дома"
 SHL_h_tenth_house_seat_desc: "Герб десятого дома вывешивают в зале Конклава рядом с девятью старыми. Товарищество инженеров, строившее печь без хозяина, становится домом с хозяином, и Конклав девяти окончательно уходит в прошлое."
 SHL_h_export_houses: "Экспортные дома"
 SHL_h_export_houses_desc: "Дома, работающие на вывоз, получают общую контору у Золотых ворот: посредники картеля подписывают договоры и выдают аванс ещё до того, как плавка остынет."
 SHL_h_export_houses_tt: "Аванс по экспортному договору: §Y90§! £ADISCORD_economy_treasury_texticon вместо 60."
 SHL_h_rail_to_sea: "Дорога к морю"
 SHL_h_rail_to_sea_desc: "Кердан и Салик лежат на пути металла к причалам Вейра. Картель вкладывает выручку в насыпи и станции на этом отрезке, чтобы караваны не зависели от сезона."
 SHL_h_rail_to_qanats: "Дорога к кяризам"
 SHL_h_rail_to_qanats_desc: "Арбин и Лоран пьют воду Кейзана и кормят западные печи. Картель укладывает дорогу вдоль кяризов, чтобы руда, вода и уголь шли к печам без задержек."
 SHL_h_cargo_insurance: "Страхование грузов Вейра"
 SHL_h_cargo_insurance_desc: "Каждый потерянный в песках груз раньше ложился на один дом. Теперь контора у Золотых ворот страхует караваны и суда за общий взнос, а Вейр отвечает за причалы."
 SHL_h_cargo_insurance_tt: "Страховая программа: за взнос казны дома получают §Y5§! конвоев и дух страхования грузов на §Y180§! дней."
 SHL_h_house_credit: "Кредит домов соседям"
 SHL_h_house_credit_desc: "Соседи, которым нечем платить за металл, получают его в долг. Контора записывает каждый караван в книгу, и книга тяжелеет быстрее, чем кошельки должников."
 SHL_h_house_credit_tt: "Кредит делает соседа должником домов и возвращает §Y25§! £ADISCORD_economy_treasury_texticon шесть циклов подряд."
 SHL_h_veyr_harbour_share: "Доля в причалах Вейра"
 SHL_h_veyr_harbour_share_desc: "Торговый союз закреплён камнем: дома выкупают долю в стеклянных портах и получают собственные причалы. Палата Вейра зовёт это партнёрством, картель - залогом."
 SHL_h_veyr_harbour_share_available_tt: "Вейр - торговый партнёр Шахрабада и не воюет с ним"
 SHL_h_bank_of_houses: "Банк домов"
 SHL_h_bank_of_houses_desc: "Контора у Золотых ворот становится банком: вклады десяти домов, страховые взносы и долговые книги соседей хранятся в одном подвале под одной печатью."
 SHL_h_bank_of_houses_tt: "Казна: §G+200§! £ADISCORD_economy_treasury_texticon. Вместимость казны: §G+5%§!."
 SHL_h_debt_term: "Срок долга"
 SHL_h_debt_term_desc: "Долговые книги Рахмы и Сардана закрываются датой. До неё дома готовы разговаривать о протекторате; после неё разговаривать будут посланники с охраной."
 SHL_h_debt_term_tt: "Миссия §YСрок долга§!: у Рахмы и Сардана §Y180§! дней, чтобы принять протекторат или вступить в союз. Иначе дома потребуют присоединения."
 SHL_h_kerdan_trading_house: "Торговый дом в Кердане"
 SHL_h_kerdan_trading_house_desc: "Дом Кердан открывает в своей столице торговый дом для палаты Вейра. Партнёру предлагают войти под руку Конклава десяти, сохранив порты и палату, - без войны за ключ к морю."
 SHL_h_kerdan_trading_house_tt: "§YВейр§! получает предложение стать сателлитом Шахрабада под гарантии торгового союза."
 SHL_h_road_stations: "Станции великой дороги"
 SHL_h_road_stations_desc: "Караванные станции тракта Кадира переходят под управление картеля. Там, где дорога уже принадлежит домам, их отстраивают; там, где осталась чужой, дома продают свои права тому, кто платит."
 SHL_h_road_stations_available_tt: "Спор с Кадиром закрыт: он подчинился, вступил в союз или присоединён"
 SHL_h_road_stations_tt: "Станции тракта остались у Кадира: их права можно продать один раз за §Y150§! £ADISCORD_economy_treasury_texticon."
 SHL_h_hired_contracts: "Наёмные контракты"
 SHL_h_hired_contracts_desc: "Война за Юг снимает запреты: картель подписывает контракты с любой бригадой пустынной стражи, готовой идти на север, и не ждёт, пока вернётся предыдущая."
 SHL_h_hired_contracts_tt: "На время войны за Юг пустынную стражу можно нанимать без ожидания между наймами."
 SHL_h_buy_garrisons: "Выкуп гарнизонов"
 SHL_h_buy_garrisons_desc: "Дома выкупают у городов гарнизонную службу: стража кварталов уходит на фронт, а её место занимают оплаченные картелем дружины."
 SHL_h_buy_garrisons_tt: "Дома оплатят §Y2§! дивизии заводской стражи в Хазаре."
 SHL_h_concession_of_svetlogorye: "Светлогорская концессия"
 SHL_h_concession_of_svetlogorye_desc: "Промыслы Севера больше не чужое государство, а концессия домов. Картель выкупает у наместников их долю, сажает своих управляющих и проводит границу Шахрабада по нефтяному поясу."
 SHL_h_concession_of_svetlogorye_tt: "Сателлиты Шахрабада на Юге присоединяются выкупом по условиям курса домов."
 SHL_h_southern_exchange: "Биржа Юга"
 SHL_h_southern_exchange_desc: "В Хазаре открывается биржа всего Юга: нефть, металл и вода пустынь торгуются под одной крышей, и крыша эта принадлежит картелю."
 SHL_h_southern_bank: "Банк Юга"
 SHL_h_southern_bank_desc: "Банк домов становится банком Юга. Казна соседей хранится в подвалах Хазара, и каждая сделка пустынь оставляет в них свою долю."
 SHL_h_southern_bank_tt: "Казна: §G+400§! £ADISCORD_economy_treasury_texticon. Вместимость казны: §G+10%§!."
 SHL_h_crown_of_trade: "Корона торговли"
 SHL_h_crown_of_trade_desc: "Юг признаёт сюзерена, который не носит короны: Конклав десяти правит договорами, долгами и ценой металла. Караваны идут, куда скажет картель, и этого достаточно."
 SHL_h_ten_crests_forever: "Десять гербов навеки"
 SHL_h_ten_crests_forever_desc: "Гербы десяти домов высечены над Золотыми воротами. Кварталы по-прежнему держат печи, но вопрос о том, кому принадлежит Шахрабад, Конклав считает закрытым."
 SHL_h_veyr_junior_partner: "Младший партнёр Вейр"
 SHL_h_veyr_junior_partner_desc: "Палата Вейра сохраняет порты, флаг и собственную книгу сборов. Взамен она признаёт, что ключ к морю отныне хранится в Хазаре."
 SHL_h_veyr_junior_partner_tt: "Вейр остаётся сателлитом Шахрабада и сохраняет свою палату."

 # ----- regency -----
 SHL_r_safir_cabinet: "Кабинет Сафира"
 SHL_r_safir_cabinet_desc: "Регент не распускает кабинет Конклава - он пересаживает его. Секретарь, координатор стражи и счетовод печей получают новые печати с гербом Сафира и прежние столы. Ведомства работают как раньше, только подписи под их бумагами теперь ставит дом, а не посредник."
 SHL_r_new_registry: "Новый реестр гербов"
 SHL_r_new_registry_desc: "Дарий Сафир отказывается возвращать всё всем. В Совет гербов вписывают дома, чья печь горит сегодня; погасшие предприятия остаются у тех, кто их держит, и их прежние хозяева получают не кресло, а обещание. Старые семьи называют это предательством, города - здравым смыслом."
 SHL_r_new_registry_tt: "Горящие печи домов возвращаются их гербам, погасшие остаются у нынешних владельцев. Голоса Совета гербов пересчитываются по работающим печам."
 SHL_r_regent_guard: "Регентская гвардия"
 SHL_r_regent_guard_desc: "Вместо девяти частных отрядов - одна гвардия под гербом Сафира. Дома платят в общую казну регента, а он набирает людей, вооружает их заводскими винтовками и расписывает по караулам. Гвардия Вейрана служит образцом и первой присягает регенту."
 SHL_r_regent_guard_tt: "Регент набирает дружины за казну и людей страны; первая дружина возвращает гвардию домов в строй."
 SHL_r_crest_press: "Печать гербов"
 SHL_r_crest_press_desc: "Типографии Хазара получают нового заказчика. Ведомости печей, объявления кабинета и рабочие листки выходят с гербовой печатью регентства, а всё, что печати не получило, снимают с лотков. Кварталы читают свои журналы вслух, чтобы не забыть, что в них было."
 SHL_r_crest_press_tt: "Недовольство кварталов: §R+5§!."
 SHL_r_debt_courts: "Долговые суды"
 SHL_r_debt_courts_desc: "Залог выручки больше не ждёт срока. Регентские суды заседают при печах, читают ведомости и выносят взыскание в тот же день, если дом сочтёт, что обязательство не исполняется. Судьи назначаются гербами и отчитываются только перед ними."
 SHL_r_hereditary_seats_restored: "Наследственные места"
 SHL_r_hereditary_seats_restored_desc: "Кресло в Совете гербов снова переходит по наследству, а не по итогам ведомости. Регент возвращает домам то, что Конклав десятилетиями считал временной уступкой, и закрепляет это грамотой, которую подписывают все девять глав."
 SHL_r_regency_charter: "Регентская хартия"
 SHL_r_regency_charter_desc: "Хартия закрепляет то, что Дарий Сафир называл временной мерой: регент правит от имени гербов, Совет гербов утверждает кабинет, печи принадлежат домам, а Закон непрерывного огня защищает не город, а право дома на огонь. Временное стало наследственным."
 SHL_r_sell_concessions: "Продажа будущих концессий"
 SHL_r_sell_concessions_desc: "Казна регента полна обещаний и пуста деньгами. Сафир продаёт право на будущие печи, будущие рудники и будущие пошлины тому, кто платит сегодня. Дома покупают охотно: каждая концессия - это ещё одно место за столом, которое никто не отберёт."
 SHL_r_pledge_plus: "Льготный залог"
 SHL_r_pledge_plus_desc: "Дома, закладывающие выручку печи, получают от регента льготу: обязательство записывают дешевле, чем раньше, а разницу берёт на себя казна Сафира. Залог становится не крайней мерой, а обычной статьёй домашнего бюджета."
 SHL_r_pledge_plus_tt: "Долг по новым залогам выручки - §Y150§! вместо прежней ставки."
 SHL_r_crest_bank: "Банк гербов"
 SHL_r_crest_bank_desc: "Девять домов складывают часть выручки в общий банк под гарантией регента. Банк выдаёт казне первый заём, а в залог берёт то же, что и всегда: будущие плавки и будущие голоса. Над дверью банка висит герб Сафира, а не Конклава."
 SHL_r_crest_bank_tt: "Казна: §G+250§! £ADISCORD_economy_treasury_texticon. Государственный долг: §R+200§!."
 SHL_r_house_mines: "Рудники домов"
 SHL_r_house_mines_desc: "Байрат получает концессию на новые штольни в обмен на долю руды для казны регента. Инженеры Дарбана размечают пласты, рабочие Шарима уходят в шахты, а дом Байрат впервые за поколение расширяет свои владения под землёй."
 SHL_r_house_rails: "Пути домов"
 SHL_r_house_rails_desc: "Сафир и Вейран строят ветки от своих печей к пограничному тракту. Дорога принадлежит домам, вагоны - домам, пошлины за проезд - домам; казна получает свою долю лишь потому, что регент подписал концессию. Печи Сафира и Вейрана перестают зависеть от общих дорог Конклава."
 SHL_r_tolls: "Пошлины гербов"
 SHL_r_tolls_desc: "На дорогах домов ставят заставы. Каждый караван, каждый возчик и каждый торговец платит гербу за проезд, и часть этих денег дома отдают регенту, чтобы казна меньше тратила на кварталы. Пошлина заменяет налог, а герб - казначея."
 SHL_r_kadir_marriage: "Брак с Кадиром"
 SHL_r_kadir_marriage_desc: "Солнечный престол Кадира и дом Сафир скрепляют союз старым способом. Дочь регента едет в Кадир с приданым из металла, а Шахрабад получает в родственники престол, через земли которого идёт караванный тракт к Светлогорью. Если престол уже в союзе, брак лишь скрепляет договор; если нет - это второе, настойчивое приглашение."
 SHL_r_kadir_marriage_tt: "§YКадир§! получает повторное приглашение в союз Шахрабада как родственный престол."
 SHL_r_toll_term: "Срок пошлин"
 SHL_r_toll_term_desc: "Регент называет день. Сардан и Рахма должны признать долг по пошлинам и войти под руку Шахрабада до этого срока; дальше с ними будут говорить не счетоводы, а гвардия. Письма с печатью Сафира уходят в оба двора одновременно."
 SHL_r_toll_term_tt: "Начинается миссия \"Срок пошлин\": §Y150§! дней на подчинение Сардана и Рахмы. По истечении срока неподчинившимся предъявляется требование присоединения."
 SHL_r_fief_promises: "Обещание ленов"
 SHL_r_fief_promises_desc: "Регент обещает домам то, чего у него ещё нет: земли Юга, разделённые на лены по числу гербов. Каждый дом знает, какой тракт, какой колодец и какая дорога отойдут ему после победы, и выставляет людей не за казну, а за наследство."
 SHL_r_fief_promises_tt: "Давление гербов: §R+10§!."
 SHL_r_hire_armies: "Наёмные армии"
 SHL_r_hire_armies_desc: "Война отменяет очередь на контракты пустынной стражи. Дома нанимают всех, кто готов идти за металл, и первый такой отряд выставляют за свой счёт - как доказательство, что обещанные лены стоят жизни."
 SHL_r_hire_armies_tt: "Контракты пустынной стражи заключаются без ожидания между наймами, пока идёт война за Юг. Дома выставляют одну дружину сразу."
 SHL_r_sell_future: "Продажа будущего"
 SHL_r_sell_future_desc: "Пока идёт война, регент продаёт концессии на всё, что ещё не завоёвано: нефть Юга, колодцы Рахмы, порты Вейра. Покупатели платят сегодня и получают бумагу, которая стоит ровно столько, сколько стоят победы гвардии."
 SHL_r_sell_future_tt: "Продажа концессий доступна без ожидания между сделками, пока идёт война за Юг."
 SHL_r_fiefs_of_the_south: "Лены Юга"
 SHL_r_fiefs_of_the_south_desc: "Победа оплачивает обещания. Побеждённые земли делят на лены между гербами: каждый дом получает тракт, колодец или дорогу, а регент - присягу новых вассалов. Карта Юга перечерчивается под девять печатей."
 SHL_r_fiefs_of_the_south_tt: "Сателлиты Шахрабада интегрируются как лены домов по итогам войны за Юг."
 SHL_r_kadir_junior: "Младший престол"
 SHL_r_kadir_junior_desc: "Солнечный престол сохраняет корону и двор. Кадир остаётся младшим партнёром регентства: его караванный тракт служит Шахрабаду, но его земли не делят на лены, а его правитель сидит за столом гербов как родственник, а не как подданный."
 SHL_r_kadir_junior_tt: "§YКадир§! сохраняет престол: интеграция ленов его не касается."
 SHL_r_debt_empire: "Империя долгов"
 SHL_r_debt_empire_desc: "Новые лены закладываются раньше, чем начинают приносить доход. Регент берёт под них заём у банка гербов и под него же - у соседей, и казна наполняется деньгами, за которые Юг будет расплачиваться поколениями."
 SHL_r_debt_empire_tt: "Казна: §G+500§! £ADISCORD_economy_treasury_texticon. Государственный долг: §R+300§!."
 SHL_r_crest_empire: "Империя гербов"
 SHL_r_crest_empire_desc: "Регент отказывается от займов и правит тем, что есть: девять гербов, их лены и их гвардии. Кварталы Юга получают порядок без обещаний, а Совет гербов - такую власть, какой у Конклава не было никогда."
 SHL_r_crown_of_crests: "Венец гербов"
 SHL_r_crown_of_crests_desc: "Дарий Сафир принимает корону Юга от имени девяти домов. Регентство, начавшееся как временная мера после Ночи гербов, становится наследственной властью над пустынями от Золотых ворот до нефтяного пояса."
 SHL_r_regent_forever: "Регент навсегда"
 SHL_r_regent_forever_desc: "Никто больше не спрашивает, когда регентство закончится. Совет гербов постановляет, что должность регента наследуется в доме Сафир, и записывает это в хартию тем же почерком, которым когда-то записал слово \"временно\"."

 # ----- script -----
 SHL_furnace_school: "Печная школа"
 SHL_furnace_school_desc: "Мастера выбранной печи берут учеников из своего квартала. Пока идёт набор, у кладки стоят лишние люди, зато следующий сезон смену ведут те, кто знает эту печь."
 SHL_furnace_school_tt: "Через §Y42§! дня обученность печи §G+1§! (не выше 2), недовольство кварталов §G-2§!. Если печь будет потеряна, цена вернётся."
 SHL_training_room_tt: "Печь ещё может принять обученную смену"
 SHL_quarter_hospital: "Квартальная лечебница"
 SHL_quarter_hospital_desc: "Ожоги и лёгочная пыль печных кварталов до сих пор лечились в домовых лазаретах. Городская лечебница у ворот печи принимает всех по очереди смен."
 SHL_quarter_hospital_tt: "Через §Y56§! дней в области появится лечебница: недовольство кварталов §G-4§!, поддержка городов §G+3§!. Одна лечебница на область."
 SHL_hospital_once_tt: "В этой области ещё нет лечебницы"
 SHL_mobilisation_quota: "Мобилизационная квота"
 SHL_mobilisation_quota_desc: "Дирекция закрепляет плавку выбранной печи за арсеналом. Владелец печи сохраняет её, но два цикла не распоряжается металлом."
 SHL_mobilisation_quota_tt: "На §Y2§! цикла печь поставляет металл только в арсенал; недовольство кварталов §R+4§!. По истечении срока: §G+600§! £infantry_equipment_texticon сверх плавки."
 SHL_quota_free_tt: "На печи нет квоты и заказа"
 SHL_state_concession: "Концессия дому"
 SHL_state_concession_desc: "Казённая печь сдаётся прежнему дому в аренду. Дирекция получает деньги сразу, дом - право голоса и обязанность держать огонь."
 SHL_state_concession_tt: "Печь возвращается дому-владельцу; казна §G+100§! £ADISCORD_economy_treasury_texticon; баланс Конклава §R-0.05§! к гербам."
 SHL_state_furnace_tt: "Печь принадлежит казне"
 SHL_debt_tribunal: "Долговой трибунал"
 SHL_debt_tribunal_desc: "Суд гербов не ждёт срока залога. Решение о взыскании выносится за один день, и печь переходит городу раньше, чем дом успевает собрать деньги."
 SHL_debt_tribunal_tt: "Залог взыскивается немедленно: печь переходит городу, залоговый договор закрывается. Недовольство кварталов §R+8§!, давление гербов §R+15§!."
 SHL_brotherly_supply: "Братская поставка"
 SHL_brotherly_supply_desc: "Советы смен делят сырьё между своими печами без казны: вагон уходит оттуда, где запас есть, туда, где его нет."
 SHL_brotherly_supply_tt: "Первая городская печь с запасом не меньше §Y2§! пакетов отдаёт §Y1§! пакет; он прибывает через §Y7§! дней. Недовольство кварталов §G-2§!. Если получатель будет потерян, пакет вернётся донору."
 SHL_brotherly_slot_tt: "Предыдущая поставка доставлена"
 SHL_brotherly_need_tt: "У печи не больше §Y1§! пакета сырья"
 SHL_cargo_insurance: "Страхование грузов"
 SHL_cargo_insurance_desc: "Дома страхуют караваны и суда у общей кассы Золотых ворот. Страховая премия возвращается спокойствием: перевозчики больше не держат запасы впрок."
 SHL_cargo_insurance_tt: "Через §Y60§! дней: §G+5§! конвоев и дух §YЗастрахованный груз§! на §Y180§! дней."
 SHL_insurance_slot_tt: "Прежняя страховка не действует"
 SHL_house_credit: "Кредит домов"
 SHL_house_credit_desc: "Дома дают соседу заём под его будущие поставки. Долг возвращается по частям, а должник надолго запоминает, у кого занимал."
 SHL_house_credit_tt: "Страна становится должником домов и значительно охотнее примет торговый протекторат. Казна возвращает §G+25§! £ADISCORD_economy_treasury_texticon в каждом из §Y6§! следующих циклов."
 SHL_metal_exchange_toggle: "Переключить режим экспорта"
 SHL_metal_exchange_toggle_desc: "Биржа металла принимает цену рынка, картель держит свою. Конклав выбирает, чем торговать: уверенностью или удачей."
 SHL_metal_exchange_toggle_tt: "Сейчас: [SHLGetExportMode]. Картель: экспортная печь приносит §Y60§! за цикл. Биржа: цена цикла §Y45-75§!."
 SHL_export_mode_exchange: "§Yбиржа§! (цена цикла §Y[?SHL_exchange_price|0]§!)"
 SHL_export_mode_cartel: "§Yкартель§! (цена §Y60§!)"
 SHL_sell_stations: "Продать станции тракта"
 SHL_sell_stations_desc: "Станции Великой дороги, взятые у Кадира, обходятся дороже, чем приносят. Торговые дома предлагают продать их обратно за наличные."
 SHL_sell_stations_tt: "Казна §G+150§! £ADISCORD_economy_treasury_texticon. Если Кадир существует, станции §Y234§! и §Y240§! возвращаются ему."
 SHL_directorate_railway: "Железная дорога Дирекции"
 SHL_directorate_railway_desc: "Дирекция строит ветку от Девятипечья к Хазару за счёт казны. Рельсы кладут инженеры Дарбана, не спрашивая дома о тарифе."
 SHL_directorate_railway_tt: "Через §Y70§! дней: §G+1§! инфраструктура в §YДевятипечье§! и §YХазаре§!, где ещё есть место. Цена вернётся, если страна капитулирует."
 SHL_railway_room_tt: "Хотя бы в одной из областей есть место для инфраструктуры"
 SHL_sell_concessions: "Продать концессии"
 SHL_sell_concessions_desc: "Регент продаёт будущие доходы гербов вперёд. Деньги приходят сегодня, а счёт по ним - потом."
 SHL_sell_concessions_tt: "Казна §G+300§! £ADISCORD_economy_treasury_texticon, государственный долг §R+500§!, давление гербов §G-5§!. Следующая продажа через §Y180§! дней; во время войны за Юг с фокусом \"Продать будущее\" срока нет."
 SHL_concessions_sold_tt: "Прежняя продажа ещё не закрыта"
 SHL_regent_guard: "Гвардия регента"
 SHL_regent_guard_desc: "Регент набирает собственную дружину из людей домов. Гвардия подчиняется Сафиру лично, а не Конклаву."
 SHL_regent_guard_tt: "Через §Y21§! день в Хазаре появится дружина \"Furnace Levy\" и дух §YВосстановленная домовая гвардия§!, если его ещё нет. Если столица будет потеряна, цена вернётся."
 SHL_shift_school: "Школа смен"
 SHL_shift_school_desc: "Коммуна учит смену там, где печь изношена сильнее всего: именно там опытные руки нужнее денег."
 SHL_shift_school_tt: "Через §Y35§! дней обученность §G+1§! у работающей печи с наибольшим износом (не выше 2). Если такой печи не будет, цена вернётся."
 SHL_strike_support: "Поддержать стачку"
 SHL_strike_support_desc: "Советы смен Шахрабада посылают деньги и людей стачечным комитетам соседа. Чем дольше держится стачка, тем громче требование союза."
 SHL_strike_support_tt: "Через §Y60§! дней поддержка советов в стране §G+25§!. При §Y75§! советы снова предлагают союз с Шахрабадом, и согласие даётся легче. Если страна исчезнет или начнёт войну с нами, цена вернётся."
 SHL_strike_support_slot_tt: "В этой стране нет незавершённой поддержки"
 SHL_cons_debt_term: "Срок долговой сети"
 SHL_cons_debt_term_desc: "Дома назначили должникам срок. Рахма и Сардан либо принимают протекторат, либо услышат требование присоединения."
 SHL_cons_debt_term_goal_tt: "§YРахма§! и §YСардан§! подчинились Шахрабаду или вступили в союз"
 SHL_cons_debt_term_timeout_tt: "§RРахма и Сардан получат требование присоединения.§!"
 SHL_cons_charter_round: "Круг хартий"
 SHL_cons_charter_round_desc: "Открытый Конклав ждёт ответов на приглашения. Через пять месяцев отказавшим пришлют второе письмо."
 SHL_cons_charter_round_goal_tt: "Двое из §YРахмы§!, §YМазара§! и §YСардана§! вступили в союз Шахрабада"
 SHL_cons_charter_round_timeout_tt: "§YРахма§!, §YМазар§! и §YСардан§! получат приглашение повторно, если ещё не в союзе."
 SHL_cons_ultimatum: "Срок ультиматума"
 SHL_cons_ultimatum_desc: "Дирекция дала Кейзану и Вейру четыре месяца. Кто не подчинится, услышит требование полного присоединения."
 SHL_cons_ultimatum_goal_tt: "§YКейзан§! и §YВейр§! подчинились Шахрабаду или вступили в союз"
 SHL_cons_ultimatum_timeout_tt: "§RКейзан и Вейр получат требование присоединения.§!"
 SHL_cons_toll_term: "Срок пошлин"
 SHL_cons_toll_term_desc: "Регентство ждёт, пока должники по пошлинам признают сюзерена. Пять месяцев - и требование станет жёстче."
 SHL_cons_toll_term_goal_tt: "§YСардан§! и §YРахма§! подчинились Шахрабаду или вступили в союз"
 SHL_cons_toll_term_timeout_tt: "§RСардан и Рахма получат требование присоединения.§!"
 SHL_cons_councils: "Советы за рубежом"
 SHL_cons_councils_desc: "Коммуна ждёт, когда советы Мазара или Вейра приведут свою страну в союз. Полгода - и приглашение повторят."
 SHL_cons_councils_goal_tt: "§YМазар§! или §YВейр§! вступил в союз Шахрабада"
 SHL_cons_councils_timeout_tt: "§YМазар§! и §YВейр§! получат приглашение повторно, если ещё не в союзе."
 SHL_cons_success_tt: "Кампания завершена: §G+25§! £political_power_texticon."
 SHL_council_election: "Выборы совета"
 SHL_council_election_desc: "Каждые полгода города выбирают делегатов Открытого Конклава. Итог зависит от того, верят ли кварталы Конклаву."
 SHL_council_election_timeout_tt: "При поддержке городов не ниже §Y40§!: §G+50§! £political_power_texticon, стабильность §G+3%§!, баланс Конклава §G+0.03§! к кварталам. Иначе баланс §R-0.05§!, недовольство кварталов §R+5§!. Следующие выборы через §Y180§! дней."
 SHL_house_demand: "Срок требования"
 SHL_house_demand_desc: "Отказ получен. Теперь у Конклава полтора месяца, чтобы привести печь в порядок, иначе дом уйдёт в оппозицию."
 SHL_house_demand_goal_tt: "Износ печи [SHLGetDemandHouse] ниже §Y40§!"
 SHL_house_demand_success_tt: "Требование снято: давление гербов или недовольство кварталов §G-5§!."
 SHL_house_demand_timeout_tt: "§RДом уходит в оппозицию на 180 дней: его глава недоступен в кабинете.§! Давление гербов или недовольство кварталов §R+10§!."
 SHL_house_demand_refuse_tt: "Давление гербов §R+15§! (в курсах городов и коммуны - недовольство кварталов §R+10§!). Начинается миссия \"Срок требования\": §Y45§! дней на ремонт печи."
 SHL_house_demand_pay_tt: "Казна §R-100§! £ADISCORD_economy_treasury_texticon. Требование закрыто."
 SHL_house_demand_yield_tt: "Баланс Конклава §Y0.05§! в сторону требующих: к гербам в курсах домов, дирекции и регентства, к кварталам в курсах городов и коммуны. Требование закрыто."
