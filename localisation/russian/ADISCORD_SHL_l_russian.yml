 SHL_law_of_continuous_fire: "Закон непрерывного огня"
 SHL_law_of_continuous_fire_desc: "Конклав признаёт только те дома, чьи печи продолжают работать. Нур требует отделить производственную непрерывность от права хозяев скрывать состояние оборудования."
 SHL_census_of_nine: "Перепись девяти печей"
 SHL_census_of_nine_desc: "Писцы Конклава обходят девять печных дворов. Они сверяют запасы, состояние кладки и договоры рабочих смен, и впервые все девять ведомостей ложатся на один стол в Хазаре. Кладовщики Конклава запирают общий амбар и заводят для него отдельную книгу. Резерв принадлежит стране, а каждая выдача записывается за конкретной печью, чтобы помощь одному дому не стала его постоянной привилегией."
 SHL_conclave_rules: "Правила Конклава"
 SHL_conclave_rules_desc: "Нур выносит в зал старый вопрос: когда дом теряет право на своё предприятие. Главы домов спорят до ночи, а городские писцы записывают каждую оговорку, понимая, что однажды им придётся принимать погасшие дворы."
 SHL_common_industrial_account: "Общий промышленный счёт"
 SHL_common_industrial_account_desc: "Счетовод Лейла Надири сводит выручку девяти печей в одну публичную книгу. Владельцы и города впервые видят, кто получает доход и кто платит за следующую смену, и спорят уже о цифрах, а не о слухах."
 SHL_houses_railway: "Железная дорога домов"
 SHL_houses_railway_desc: "Один незапланированный перегон способен остановить несколько предприятий. Конклав сводит перевозчиков девяти домов в общую диспетчерскую, ставит на запасных путях резервные составы и вывешивает в Хазаре единое расписание поставок."
 SHL_houses_railway_premium_tt: "Спор с поставщиками закрыт: надбавка к закупке резерва снимается."
 SHL_school_of_masters: "Школа мастеров"
 SHL_school_of_masters_desc: "Квалифицированная смена слышит неисправность до аварии. Старые мастера девяти печей впервые учат вместе, в общих учебных мастерских, и ученики уносят знание не в свой дом, а к любой печи, куда их позовут."
 SHL_school_of_masters_dispute_tt: "Спор с мастерами закрыт: подготовка участка десятой печи больше не ждёт их соглашения."
 SHL_baryat_mines: "Рудники Байрата"
 SHL_baryat_mines_desc: "Байрат давно кормит печи рудой, но шахты работают по старым договорам каждого дома. Тахмурас Байрат соглашается на общую концессию, и проходчики Конклава спускаются к пластам, которые деды считали выработанными."
 SHL_baryat_mines_packet_tt: "Пока Байрат в руках Конклава, пакет сырья дешевле на §G5§! £ADISCORD_economy_treasury_texticon."
 SHL_metal_brokers: "Маклеры металла"
 SHL_metal_brokers_desc: "Маклеры Золотых ворот больше не ждут караванов: они скупают слитки прямо на дворах печей и приводят покупателей, до которых тракт никогда не доходил. Тахмурас Байрат ворчит, что руду теперь продают раньше, чем её добудут, но подписывает общий реестр сделок вместе с остальными домами."
 SHL_metal_brokers_tt: "Каждый оплаченный контракт на металл приносит ещё §G+15§! £ADISCORD_economy_treasury_texticon за цикл печей."
 SHL_metal_brokers_advance_tt: "§G+100§! £ADISCORD_economy_treasury_texticon: задаток маклеров."
 SHL_ore_prospecting: "Разведка недр"
 SHL_ore_prospecting_desc: "Изыскатели Конклава уходят в Лоран, Шарим и Вейран. Там, где дома видели только песок, лежат вольфрам, бокситы и хром для новых сплавов."
 SHL_smelter_quarters: "Литейные кварталы"
 SHL_smelter_quarters_desc: "Руда должна становиться товаром рядом с печами. Конклав строит литейные кварталы во втором городе Лиги и в Шариме, чтобы металл уходил на рынок готовыми изделиями."
 SHL_furnace_arsenals: "Арсеналы при печах"
 SHL_furnace_arsenals_desc: "Цеха, готовые к эвакуации, можно и развернуть. Хазар и печной район получают оружейные мастерские, которые в мирное время льют трубы, а в войну - стволы."
 SHL_cannon_foundries: "Пушечные литейни"
 SHL_cannon_foundries_desc: "Металлурги Шахрабада умеют лить то, чего нет у соседей. Первые полевые орудия отливаются для домовых караулов, а чертежи передаются инженерам."
 SHL_conclave_army: "Армия Конклава"
 SHL_conclave_army_desc: "Караулы печей, заводская стража и все, кого Конклав сумел вооружить или нанять, сводятся под одно знамя. У Конклава появляется армия, которая служит не гербу, а печам."
 SHL_repair_without_extinction_tt: "Износ каждой работающей печи под контролем Шахрабада: §G-15§!."
 SHL_conclave_army_tt: "Конклав выставит §Y2§! дивизии заводской стражи в Хазаре."
 SHL_careful_smelting: "Бережная плавка"
 SHL_careful_smelting_desc: "Старые мастера помнят печи, которые прожили по полвека. Они просят не гнать плавку: давать кладке остыть между выпусками, держать ровный жар и не торопить смену ради одного каравана."
 SHL_overtime_shift: "Усиленная смена"
 SHL_overtime_shift_desc: "Купцы у Золотых ворот ждут металла, и управляющие требуют второй выпуск за смену. Литейщики встают к печи затемно, а возчики гонят к дворам лишние вагоны руды."
 SHL_repair_without_extinction: "Ремонт без погашения"
 SHL_repair_without_extinction_desc: "Каменщики учатся чинить печь, не гася её: перекладывают вспомогательные участки по одному, пока главный горн продолжает плавку. Старики называют это работой в пасти дракона."
 SHL_engineer_society: "Инженерное товарищество"
 SHL_engineer_society_desc: "Мастера предлагают построить печь, которой не будет владеть ни один старый дом. Сначала им нужен общий проект, инженерная команда и проверяемый порядок расходов."
 SHL_right_to_land: "Право на землю"
 SHL_right_to_land_desc: "Город выделит землю и оформит доступ к промышленному водоснабжению. Чертёж должен стать участком с законным владельцем, прежде чем на него придут подрядчики."
 SHL_common_fund: "Общий фонд"
 SHL_common_fund_desc: "Города и мастера складывают общий фонд проекта. Владельцы транспортных линий приходят на собрание со своими счетами за перевозку тяжёлого оборудования, и товарищество спорит, платить ли за их согласие или строить дорогу своими руками."
 SHL_own_transport: "Собственный транспорт"
 SHL_own_transport_desc: "Товарищество покупает старые платформы, нанимает машинистов из кварталов и прокладывает к площадке собственный подъездной путь. Владельцы линий смотрят, как оборудование для десятой печи проходит мимо их застав."
 SHL_own_transport_dispute_tt: "Спор о доступе к строительству закрыт: владельцы линий больше не могут остановить работы."
 SHL_workers_charter: "Рабочая хартия"
 SHL_workers_charter_desc: "Рабочая хартия определит условия смены работодателя, обучения и участия в управлении. Даже будущему десятому дому придётся начинать с понятного договора с собственным городом."
 SHL_build_tenth_complex: "Строительство комплекса"
 SHL_build_tenth_complex_desc: "На площадке нового комплекса разгружают оборудование. Будущие мастера обходят цеха, где ещё слышен стук строительных молотков."
 SHL_first_pour_focus: "Первая плавка"
 SHL_first_pour_focus_desc: "Инженеры готовы проверить комплекс под нагрузкой. Первая плавка должна стать производственным результатом, а не одной церемонией."
 SHL_tenth_voice: "Десятый голос"
 SHL_tenth_voice_desc: "Десятая печь работает, но её представители стоят у дверей Конклава. Стране предстоит определить, превращается ли товарищество в новый дом или меняется само основание политического права."
 SHL_new_house: "Новый промышленный дом"
 SHL_new_house_desc: "Товарищество получает право стать самостоятельным промышленным домом. Это даёт ему защиту существующего порядка, но превращает его руководителей в наследников тех самых привилегий, которым они бросали вызов."
 SHL_house_compromise: "Соглашение десяти"
 SHL_house_compromise_desc: "Согласуем полномочия нового дома и городские гарантии. Конклав сохранит порядок представительства, приняв ещё одного участника."
 SHL_admit_tenth_house: "Право нового дома"
 SHL_admit_tenth_house_desc: "Конклав закрепляет за товариществом право на наследственный голос."
 SHL_open_conclave: "Открытый Конклав"
 SHL_open_conclave_desc: "Производство может заслужить представительство без наследственного титула. Городам предстоит получить собственный порядок выбора представителей."
 SHL_city_charters: "Городские хартии"
 SHL_city_charters_desc: "Хартии определят доступ жителей к управлению предприятиями и общим службам. Городское владение должно уметь содержать производство, а не только сменить имя на печати."
 SHL_rights_without_fire: "Право вне огня"
 SHL_rights_without_fire_desc: "Городские собрания требуют записать в закон то, что улицы давно знают: голос города принадлежит его жителям, а не огню одной печи. Мехран Арбин зачитывает акт с трибуны, и гербы слушают его стоя."
 SHL_nur_directorate: "Директория Нура"
 SHL_nur_directorate_desc: "Нур предлагает единое управление резервом, ремонтами и главными производствами. Государство принимает обязанности, которыми дома оправдывали своё особое положение."
 SHL_common_dispatch: "Единая диспетчерская"
 SHL_common_dispatch_desc: "Диспетчеры Нура занимают зал у вокзала Хазара. На стене висит таблица смен и поставок всех печей, и каждый наряд подписывают с именем получателя и суммой, которую за него заплатят."
 SHL_state_furnaces: "Государственные печи"
 SHL_state_furnaces_desc: "Промышленная дирекция получает право управлять погасшими предприятиями. Её результатом должна стать работающая промышленность, а не новая форма личной собственности."
 SHL_railway_guard: "Охрана железной дороги"
 SHL_railway_guard_desc: "Промышленная охрана должна защищать станции и составы. Подготовим связь и снабжение для существующих частей, не превращая каждый дом в отдельную армию."
 SHL_factory_air_defence: "ПВО заводских городов"
 SHL_factory_air_defence_desc: "Плотная застройка вокруг печей требует собственной воздушной защиты. Развернём батареи промышленного района и подготовим расчёты к охране промышленного района."
 SHL_industrial_evacuation: "Служба промышленной эвакуации"
 SHL_industrial_evacuation_desc: "Инженеры составляют описи цехов: что грузить первым, кто сопровождает чертежи, где ждут вагоны. Служба эвакуации учится вывозить оборудование и специалистов, надеясь, что это никогда не понадобится."
 SHL_panel_forecast: "[SHLGetSelectedOwner]\n[SHLGetDeliveryBlock]\nПлавка: [?SHL_selected_delivery_cash|0] £ADISCORD_economy_treasury_texticon / [?SHL_selected_delivery_rifles|0] £infantry_equipment_texticon\nНедовольство -[?SHL_selected_delivery_quarters|0] / [SHLGetLoyaltyForecast]\nСырьё [?SHL_selected_period_cost|0] / износ +[?SHL_selected_period_wear|0][SHLGetWaterworks]"
