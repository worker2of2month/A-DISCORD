 SHL_quarters_and_borders_desc: "£SHL_crest_texticon  §YКонклав§!\nКурс - [SHLGetPoliticalCourse][SHLGetBallotBulletin][SHLGetHouseDemandStatus][SHLGetConsolidationStatus]\n\n£balance_of_power_texticon  §YЮжная граница§!\nКяризы - [SHLGetWaterStatus]\nВейр - [SHLGetVeyrStatus]\nКейзан - [SHLGetKeizanStatus]\n[SHLGetKeizanFlankStatus]\n\n£SHL_ledger_texticon  §YСнабжение и торговля§!\nОбоз - [SHLGetCampaignReserve]\nЮжный поход - [SHLGetCampaignOutcome][SHLGetSouthProgress]\nЭкспорт - [SHLGetExportMode]. Удержание с печи - §Y[?SHL_income_deduction|0]§! £ADISCORD_economy_treasury_texticon"
 SHL_ballot_bulletin: "\n£SHL_ballot_texticon До голосования §Y[?days_mission_timeout@SHL_conclave_ballot|0]§! дн.   Прогноз - §Y[SHLGetBallotLeader]§!"
