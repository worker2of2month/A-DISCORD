 SHL_crisis_3_b_tt: "Недовольство кварталов: §R+10§!, давление гербов: §G-3§!."
 SHL_crisis_4_b_tt: "Давление гербов: §R+8§!, недовольство кварталов: §G-5§!."
 SHL_crisis_5_a_tt: "Казна: §G+100§! £ADISCORD_economy_treasury_texticon (§G+250§! со счётной палатой)."
