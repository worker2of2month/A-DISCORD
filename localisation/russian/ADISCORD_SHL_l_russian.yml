 SHL_road_dispatch_tt: "[SHLGetRoadPlan]\nНа каждом рынке караван предлагает четверть исходного груза за §Y75§! £ADISCORD_economy_treasury_texticon или местный товар. У покупателя 7 дней на ответ. При отказе, войне с покупателем или недоступности рынка партия остаётся в обозе. Выручка и остаток груза поступят домой по возвращении.\n\n§YМена за одну партию§!\n[SHLGetRoadBarterTable]\n\n[SHLGetRoadHomeTerms]"
 SHL_road_stop_tt: "По прибытии караван предложит партию властям, которые контролируют рынок. Остаток груза продолжит путь."
 SHL_road_home_market_terms: "Рынок у Ворот выкупает до половины исходного груза. За 2 500 £infantry_equipment_texticon или 500 £support_equipment_texticon купцы платят 50 £ADISCORD_economy_treasury_texticon. Когда осталось до четверти груза, шанс сделки 80%, до половины - 60%, свыше половины - 40%."
 SHL_road_home_market_locked: "Выкуп остатков у Ворот откроет фокус $SHL_chancery_of_the_gate$."
 SHL_road_home_sold_rifles: "\nРынок у Ворот выкупил [?SHL_road_home_rifles|0] £infantry_equipment_texticon за [?SHL_road_home_cash|0] £ADISCORD_economy_treasury_texticon."
 SHL_road_home_sold_kits: "\nРынок у Ворот выкупил [?SHL_road_home_kits|0] £support_equipment_texticon за [?SHL_road_home_cash|0] £ADISCORD_economy_treasury_texticon."
 SHL_road_home_no_bid: "\nУ Ворот не нашлось покупателей."
 SHL_road_return_tt: "Казна получит выручку. Непроданный груз и выменянное снаряжение вернутся на склад, а топливо поступит в хранилища в пределах их ёмкости."
 SHL_road_to_fada: "Караван - Фада"
 SHL_road_to_fada_desc: "Караванщики спрашивают у встречных дорогу к стеландерским торговым рядам. В первом фургоне уже отвязали выставочный ящик."
