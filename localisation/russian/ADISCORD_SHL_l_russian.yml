 SHL_map_legend: "£SHL_stopped_texticon Погасла  £SHL_occupied_texticon Захват  £SHL_shortage_texticon Нет сырья  £SHL_wear_texticon Износ"
 SHL_map_legend_tt: "£SHL_stopped_texticon Печь погасла.   £SHL_occupied_texticon Утрачен контроль.\n£SHL_shortage_texticon Нехватка сырья.   £SHL_wear_texticon Износ от 75%.\n\nСкобы отмечают выбранную печь. Наведите на номер, чтобы сверить склад, износ и получателя. Две печи Девятипечья отмечены по сторонам от их общей площадки. Выберите Арбин, Сафир или Лоран, чтобы распределить воду между печью и дворами в решениях под картой."
 SHL_convoy_status: "[SHLGetConvoyStatus]"
 SHL_convoy_free: "Окружной обоз   /   готов к рейсу"
 SHL_convoy_sent_waterworks: "Обоз доставил секции водовода"
 SHL_fit_cooling_loop: "Закольцевать охлаждение в округе [FROM.GetName]"
 SHL_fit_cooling_loop_desc: "Мастер ведёт меловую черту от литейного двора обратно к отстойнику. Тёплая вода годами уходила в песок за стеной. Теперь её ждут у горна."
 SHL_fit_standpipe: "Провести воду во дворы округа [FROM.GetName]"
 SHL_fit_standpipe_desc: "Утром Самира Хади проводила водовоза от ворот до последнего двора. К тому времени бочка была пуста. На плане мастера она поставила крест там, где женщины ждали с вёдрами."
 SHL_fit_cooling_loop_tt: "У этой печи износ за успешную плавку снижается на §G2§! (минимум 0). Замкнутый контур также снимает местную надбавку за засуху (§R+4§!). Водовод округа закрепляется за печью. Три испытанных контура позволят Конклаву ограничить водозабор и закрыть спор без квоты."
 SHL_fit_standpipe_tt: "Каждая поставка этой печи кварталам дополнительно снижает недовольство на §G3§!, во время стачки на §G8§!. У оплаченного производственного заказа приоритет. Водовод округа закрепляется за дворами. Мирный исход через три оборотных контура станет недоступен."
 SHL_waterworks_trip_tt: "Окружной обоз свободен. Рейс займёт его до следующей общей плавки."
 SHL_waterworks_site_tt: "Водный спор ещё не урегулирован. Шахрабад владеет работающей пограничной печью и контролирует её. Водовод свободен, на печи нет оплаченных работ, заказа, аренды или квоты."
 SHL_cost_waterworks: "§Y2§! £SHL_packet_texticon"
 SHL_cost_waterworks_blocked: "§R2§! £SHL_packet_texticon"
 SHL_cost_waterworks_tooltip: "Со склада печи в округе [FROM.GetName] сразу списываются §Y2§! £SHL_packet_texticon. На складе §Y[?FROM.SHL_furnace_stock|0]/3§! £SHL_packet_texticon."
 SHL_cooling_loop_status: "\nОборотное охлаждение. $SHL_fit_cooling_loop_tt$"
 SHL_standpipe_status: "\nДворовые колонки. $SHL_fit_standpipe_tt$"
 SHL_waterworks_open_status: "\nВодовод свободен. В решениях под картой можно подвести воду к печи или во дворы."
 SHL_waterworks_no_status: ""
 SHL_limit_water_intake: "Ограничить забор воды из кяризов"
 SHL_limit_water_intake_desc: "Лейла Надири раскладывает на столе три журнала плавок. У каждого своя подпись мастера и одна и та же запись у стрелки расходомера. Нур просит писца занести в протокол черту, выше которой западные печи больше не поднимут затворы."
 SHL_limit_water_intake_tt: "Шахрабад оставляет боковые отводы закрытыми. Водный спор заканчивается без платы металлом и без квоты."
 SHL_water_limit_dispute_tt: "Спор о кяризах открыт. Шахрабад и Кейзан в мире, предложений о воде на рассмотрении нет, бурение скважин не идёт."
 SHL_water_loop_in_service_tt: "Печь работает под контролем Шахрабада вне аренды. Оборотный контур выдержал хотя бы одну плавку с сырьём."
 SHL_status_water_recirculation: "Конклав ограничил водозабор. Все три печи испытали оборотное охлаждение."
 SHL_cooling_loop_untested: "\nОборотное охлаждение смонтировано. Испытание пройдёт при первой плавке с сырьём."
 SHL_arbin_water_recirculating: "Хосров Арбин узнал об этом первым. Ночью вода ушла ниже зарубки на затворе. Утром он сам прошёл вдоль обратной трубы и положил перед Конклавом схему своего охлаждения."
 SHL_convoy_sent_ore: "Обоз доставил руду из Байрата"
 SHL_convoy_sent_masons: "Каменщики Дарбана укрепили кладку"
 SHL_convoy_sent_sale: "Обоз продал груз в Лоране"
 SHL_convoy_help: "Один рейс на всю страну. Обоз снова готов после очередной плавки. Выберите печь на карте. Груз и оплата передаются сразу. Обе печи должны работать под контролем Шахрабада. Оплаченные работы занимают площадку. Заказ или мобилизационная квота защищают склад отправителя."
 SHL_convoy_ore: "V   £SHL_ore_texticon Подвоз руды"
 SHL_convoy_masons: "VIII   Каменщики"
 SHL_convoy_sale: "III   Продажа"
 SHL_convoy_ore_tt: "Из Байрата (V) на другую печь: §Y1§! £SHL_packet_texticon с местного склада. В Байрате сейчас §Y[?SHL_stock_5|0]§! £SHL_packet_texticon, у получателя §Y[?SHL_selected_stock|0]/3§! £SHL_packet_texticon."
 SHL_convoy_masons_tt: "Каменщики везут огнеупорный кирпич из Дарбана (VIII) на выбранную печь. Расход §Y1§! £SHL_packet_texticon, запас Дарбана §Y[?SHL_stock_8|0]§! £SHL_packet_texticon. Износ выбранной печи уменьшится на §G15§! п. п. Требуются износ от §Y15%§! и фокус \"$SHL_repair_without_extinction$\"."
 SHL_convoy_sale_tt: "Продать §Y1§! £SHL_packet_texticon со склада выбранной печи через ворота Лорана (III) за §G40§! £ADISCORD_economy_treasury_texticon. Дома получают рычаг на бирже: давление гербов §R+3§!. Склад продавца и ворота Лорана должны быть свободны от обязательств."
