 SHL_extinction_pressure_tt: "Дом этой печи: верность §R-14§!, и ещё §R-10§!, если печью владел дом."
 SHL_soup_kitchens: "Общие столовые"
 SHL_soup_kitchens_desc: "У заводских ворот дымят котлы с горячей похлёбкой. Стачечники едят молча, и разговоры в очереди идут уже не только о сменах."
 SHL_soup_kitchens_tt: "Недовольство кварталов: §G-10§!."
 SHL_house_banquet: "Приём гербов"
 SHL_house_banquet_desc: "Нур собирает наследников домов за одним столом, пока их поверенные не собрали подписи против Конклава."
 SHL_house_banquet_tt: "Верность каждого дома: §G+10§! (давление гербов §G-10§!)."
 SHL_shift_mediation: "Переговоры с мастерами"
 SHL_shift_mediation_desc: "Старшие мастера смен знают, какие требования стачечного комитета можно выполнить за неделю."
 SHL_shift_mediation_tt: "Недовольство кварталов: §G-8§!."
 SHL_nur_audience: "Аудиенция у Нура"
 SHL_nur_audience_desc: "Каждый дом получает отдельную встречу и отдельное обещание. Нур принимает глав домов по одному, и из его кабинета они выходят, уже не глядя друг на друга."
 SHL_nur_audience_tt: "Верность каждого дома: §G+8§! (давление гербов §G-8§!)."
 SHL_strike_mission: "Холодная смена"
 SHL_strike_mission_desc: "Стачечный комитет собирает людей у заводских ворот. Над печами держится слабый дым, а мастера ждут исхода переговоров."
 SHL_strike_goal_tt: "Недовольство кварталов ниже §Y45§!"
 SHL_strike_success_tt: "Стачка закончится. Следующая возможна не раньше чем через 4 цикла."
 SHL_strike_timeout_tt: "§RКомитет потребует власти для советов смен.§!"
 SHL_conspiracy_mission: "Ультиматум гербов"
 SHL_conspiracy_mission_desc: "Девять гербов требуют вернуть им прежние права. Гвардии домов стоят у мостов Хазара, а в особняках за Золотыми воротами шепчутся о Конклаве без Нура."
 SHL_conspiracy_goal_tt: "Давление гербов ниже §Y45§!"
 SHL_conspiracy_success_tt: "Ультиматум распадётся. Следующий возможен не раньше чем через 4 цикла."
 SHL_conspiracy_timeout_tt: "§RДома попытаются сместить Нура.§!"
 SHL_raise_furnace_guard: "Набрать заводскую стражу"
 SHL_raise_furnace_guard_desc: "У печных ворот вывешены списки заводской стражи. Рабочие приходят на сборы прямо после смены."
 SHL_raise_guard_tt: "Через §Y21§! день в Хазаре появится дивизия \"Furnace Levy\". Если столица будет потеряна, цена вернётся полностью."
 SHL_guard_slot_tt: "Прежний набор завершён"
 SHL_war_orders: "Арсенальный заказ: [FROM.GetName]"
 SHL_war_orders_desc: "Арсенал прислал чертежи и приёмщиков. На печном дворе готовят металл, которому предстоит стать оружием."
 SHL_offer_water_treaty: "Предложить \"воду за металл\""
 SHL_offer_water_treaty_desc: "Общины Кейзана получат металл для своих водоводов, а печи - воду по согласованной квоте."
 SHL_offer_water_treaty_tt: "Кейзан рассмотрит предложение. Если он согласится: §R-100§! £ADISCORD_economy_treasury_texticon сразу и §R-3§! £ADISCORD_economy_treasury_texticon с каждой работающей печи за цикл. Спор о воде закончится."
 SHL_offer_pending_tt: "Нет неотвеченного предложения Кейзану"
 SHL_water_treaty_money_tt: "В казне не меньше §Y100§! £ADISCORD_economy_treasury_texticon"
 SHL_artesian_wells: "Артезианские скважины"
 SHL_artesian_wells_desc: "Буровые бригады выходят к Арбину, Сафиру и Лорану. Мастера ищут глубокие горизонты, где вода не принадлежит ни кяризам Кейзана, ни его общинам."
 SHL_artesian_wells_tt: "Через §Y84§! дня спор о воде закончится без квоты. Если к этому времени спор уже закрыт, цена вернётся."
 SHL_project_slot_tt: "Этот проект ещё не оплачен"
 SHL_seize_qanats: "Взять кяризы"
 SHL_seize_qanats_desc: "Охрана водоводов перейдёт границу и займёт головные колодцы Севира, Табара, Нарвана и Ормиса."
 SHL_seize_qanats_tt: "§RШахрабад объявит войну Кейзану§! с целью занять Севир, Табар, Нарван и Ормис. Кейзан получит 3 дивизии стражи кяризов. Через 270 дней без капитуляции наступит перемирие. Пока идёт эта война, Собрание арычных общин не предъявляет требования пайка; победа лишает его основания."
 SHL_seize_qanats_ready_tt: "Спор о воде открыт, Шахрабад и Кейзан не воюют, Кейзан владеет пограничными кяризами"
 SHL_harbour_project: "Гавань Кердана"
 SHL_harbour_project_desc: "Инженеры размечают у берега будущие причалы, склады и подъездные пути. Шахрабад хочет вывозить металл с собственного мола, а не через конторы вейрской торговой палаты."
 SHL_harbour_project_tt: "Через §Y90§! дней вейрский сбор перестанет удерживаться из выручки. Если в Кердане есть место, будет построена верфь. Если сбор уже отменён или Кердан потерян, цена вернётся."
 SHL_ultimatum_veyr: "Ультиматум Вейру"
 SHL_ultimatum_veyr_desc: "Вейрская палата получила требование об отмене сбора. Наши посланники ждут ответа, пока штабы изучают дороги к рудникам."
 SHL_ultimatum_veyr_tt: "§RШахрабад объявит войну Вейру§! с целью занять Норан и Кассен, а после \"Ключа к морю\" - ещё Тирву и Вейрский округ. Вейр получит 3 дивизии призматической стражи. Через 270 дней без капитуляции наступит перемирие. Нападение даст Вейру основание вступить на стороне Кейзана, пока претензия не урегулирована."
 SHL_ultimatum_veyr_ready_tt: "Вейрский сбор действует, Шахрабад и Вейр не воюют, Вейр владеет Нораном или Кассеном"
 SHL_keizan_deadline: "Ультиматум Кейзана"
 SHL_keizan_deadline_desc: "Собрание арычных общин требует ответа. На дорогах из Табара всё чаще замечают вооружённые отряды."
 SHL_keizan_deadline_timeout_tt: "§RКейзан объявит войну за Зарханский округ§!, если он не воюет в другом месте. Иначе требование будет отложено на 4 цикла. Согласившийся на пограничный договор сосед вступит на стороне Кейзана. [SHLGetKeizanFlankStatus]"
 SHL_keizan_last_ration: "Выплатить паёк в последний день"
 SHL_keizan_last_ration_desc: "Переговорщики возвращаются к спорным счетам за воду. Даже запоздалое соглашение лучше новой вражды у колодцев."
 SHL_keizan_last_ration_tt: "Ультиматум будет снят, а требования Кейзана закрыты."
 SHL_export_contract: "Подписать экспортный заказ: [FROM.GetName]"
 SHL_export_contract_desc: "Дом заключает экспортный договор. Купцы сверяют печати, а мастера обсуждают с ними будущие поставки металла."
 SHL_export_furnaces_tt: "Работает не меньше §Y6§! печей"
 SHL_debt_shift: "Заложить доход дома: [FROM.GetName]"
 SHL_debt_shift_desc: "Регентские поверенные обсуждают с городской кассой залог. Будущие плавки становятся предметом долгого торга."
 SHL_debt_shift_tt: "Сразу 150 £ADISCORD_economy_treasury_texticon и +8 недовольства. Новый долг: [?SHL_pledge_price|0] £ADISCORD_economy_treasury_texticon. Выручка печи идёт кредитору; остаток последнего платежа возвращается в казну. Переназначение доступно после погашения или отмены с расчётом долга."
 SHL_common_cauldron: "Назначить печь-донор: [FROM.GetName]"
 SHL_common_cauldron_desc: "Советы смен предлагают помочь соседнему предприятию. На общем собрании вспоминают, как сами пережили остановку печи."
 SHL_common_cauldron_tt: "Отдельно выберите другую городскую печь для помощи. Две плавки донора восстанавливают её; при Союзе мастерских нужна одна. Обычной поставки во время заказа нет; затем донор снабжает кварталы."
 # Event answers
 SHL_strike_concede_tt: "§R-150§! £ADISCORD_economy_treasury_texticon. Недовольство кварталов: §G-35§!. Давление гербов: §R+10§!. Гражданская опора: §G+5§!. Стачка закончится."
 SHL_strike_wait_tt: "Начнётся 42-дневная миссия. Пока идёт стачка, каждая печь приносит на §R10§! £ADISCORD_economy_treasury_texticon меньше. Если недовольство не упадёт ниже §Y45§!, комитет потребует власти."
 SHL_strike_suppress_tt: "Недовольство кварталов: §G-25§!. Гражданская опора: §R-10§!. §Y-10%§! $SHL_conclave_balance$. Вторая расправа сразу приведёт к требованию советов смен."
 SHL_commune_course_tt: "Нур уйдёт в отставку. Власть перейдёт Совету смен. Недовольство кварталов: §G-30§!, давление гербов обнулится. §Y+30%§! $SHL_conclave_balance$. Откроется путь \"Рабочая коммуна\"; передачу печей рабочим закрепит фокус \"$SHL_furnaces_to_workers$\". Несовместимые заказы закроются с возвратом неиспользованной оплаты."
 SHL_martial_law_tt: "Недовольство кварталов станет §Y30§!. Давление гербов: §G-10§!. Стачка закончится."
 SHL_conspiracy_guarantees_tt: "Давление гербов -25; недовольство +10; гражданская опора -5. Цена: 40 £political_power_texticon; бесплатно, если большинство голосующих домов сохраняет верность не ниже 55."
 SHL_conspiracy_wait_tt: "Начнётся 42-дневная миссия. Если давление гербов не упадёт ниже §Y45§!, дома попытаются сместить Нура."
 SHL_conspiracy_arrests_tt: "Давление гербов: §G-30§!. Недовольство кварталов: §G-5§!. Печи Нурана и Вейрана, если ими владеют дома, перейдут дирекции, а верность этих домов упадёт на §R40§!."
 SHL_regency_course_tt: "§YНур уйдёт в отставку. Регентом станет Дарий Сафир.§! Верность каждого дома: §G+30§!; дом Сафир: ещё §G+10§!. Недовольство кварталов: §R+15§!. §Y-30%§! $SHL_conclave_balance$. Откроется путь \"Регентство домов\"."
 SHL_resist_crests_tt: "Давление гербов станет §Y40§!. Нур сохранит власть."
 SHL_accident_site_tt: "§RАварийная печь погаснет, а её цеха будут повреждены.§!"
 SHL_accident_house_tt: "Дом этой печи: верность §R-30§!. Гражданская опора: §G+5§!. Недовольство кварталов: §G-10§!."
 SHL_accident_masters_tt: "Недовольство кварталов: §R+15§!. Дом этой печи: верность §G+15§!."
 SHL_accident_commission_tt: "Недовольство кварталов: §G-5§!. Дом этой печи: верность §R-15§!. Смена этой печи будет считаться обученной."
 SHL_water_crisis_tt: "$SHL_status_water_open$ Пока спор продолжается, в Конклаве печей можно распределить оставшиеся водоводы. Переговоры с Кейзаном ведутся в категории \"Кварталы и границы\"."
 SHL_kyz_accepts_treaty_tt: "Шахрабад заплатит 100 и будет отдавать металл по квоте; печи получат воду."
 SHL_kyz_refuses_tt: "Шахрабад получит отказ."
 SHL_kyz_accepts_brotherhood_tt: "Спор о воде закончится без квоты."
 SHL_armistice_tt: "Стороны заключат белый мир. Земля останется у прежних владельцев."
 SHL_armistice_edge_tt: "Районы соседа, которые держат войска Шахрабада, переходят Шахрабаду. Через год сосед предъявит на них претензии."
 SHL_armistice_enemy_edge_tt: "Сосед получает занятые им округа Шахрабада, но не больше одной печи, а после фокуса §Y$SHL_furnace_garrisons$§! - ни одной. Через год (через полгода после фокуса §Y$SHL_border_settlement_office$§!) Конклав сможет предложить выкуп."
 SHL_return_wells_tt: "[280.GetName], [284.GetName], [285.GetName] и [286.GetName] возвращаются Кейзану. Спор о воде закрыт, договор о нейтралитете с Кейзаном на §Y730§! дней, §Y$SHL_captured_qanats$§! снимается, давление гербов §G-10§!. Кейзан не будет требовать реванша."
 SHL_harbour_union_tt: "Занятые порты Вейра возвращаются палате. Вейр становится торговым партнёром Конклава, спор о портах закрыт договором, Вейр не будет требовать реванша."
 SHL_veyr_crisis_tt: "Пока сбор действует, каждая работающая печь приносит на §R5§! £ADISCORD_economy_treasury_texticon меньше."
 SHL_glp_accepts_union_tt: "Вейр отменит сбор и станет торговым партнёром Шахрабада."
 SHL_glp_refuses_tt: "Шахрабад получит отказ."
 SHL_keizan_pay_first_tt: "§R-250§! £ADISCORD_economy_treasury_texticon, §R-30§! £political_power_texticon. Кейзан вернётся с новым требованием через 10 циклов."
 SHL_water_treaty_discount_tt: "§R-125§! £ADISCORD_economy_treasury_texticon, §R-30§! £political_power_texticon. Договор \"вода за металл\" уменьшает первый платёж вдвое. Кейзан вернётся с новым требованием через 10 циклов."
 SHL_keizan_refuse_tt: "Начнётся 60-дневный ультиматум. Затем Кейзан объявит войну за Зарханский округ. Во время отсрочки можно набрать стражу или выплатить паёк по высокой цене. Кейзан может пригласить одного соседа: Мазар, поддержавший требование, или Вейр после пограничной войны. Мы получим предупреждение и возможность предложить нейтралитет до войны."
 SHL_keizan_pay_final_tt: "§R-400§! £ADISCORD_economy_treasury_texticon. Требования Кейзана будут закрыты."
 SHL_partner_joins_tt: "Страна вступит в союз Шахрабада."
 # Focus rewards
 SHL_quarter_listening_tt: "Недовольство кварталов: §G-10§!."
 SHL_heralds_table_tt: "Верность каждого дома: §G+10§! (давление гербов §G-10§!)."
 SHL_campaign_first_slot_tt: "Открывается первое место для кампаний §YГолоса печей§!."
 SHL_shift_arbitration_tt: "Каждый цикл недовольство кварталов снижается ещё на §G1§!."
 SHL_water_question_tt: "Спор о воде с Кейзаном начнётся сейчас, если ещё не начался."
 SHL_veyr_duties_tt: "Спор о вейрском сборе начнётся сейчас, если ещё не начался."
 SHL_golden_gate_cartel_tt: "Вместимость казны: §G+5%§!."
 SHL_house_guards_tt: "Дома оплатят §Y2§! дивизии заводской стражи в Шахрабаде. Верность каждого дома: §G+15§! (давление гербов §G-15§!)."
 SHL_veyr_partner_available_tt: "Вейр существует, не воюет с Шахрабадом и не рассматривает другое предложение"
 SHL_veyr_partnership_tt: "Вейр получит предложение торгового союза. Если он согласится, сбор будет отменён."
 SHL_golden_gate_offer_tt: "Вейр получит приглашение в союз Золотых ворот."
 SHL_council_of_cities_tt: "Недовольство кварталов: §G-20§!. Гражданская опора: §G+10§!.\nКонклав девяти печей входит в правящую коалицию Южного договора."
 SHL_kyz_brotherhood_available_tt: "Кейзан существует, не воюет с Шахрабадом и не рассматривает другое предложение"
 SHL_kyz_brotherhood_offer_tt: "Кейзан получит предложение братства кяризов. Если он согласится, спор о воде закончится без квоты."
 SHL_workers_brigades_tt: "Города выставят §Y2§! дивизии заводской стражи в Шахрабаде. Недовольство кварталов: §G-5§!."
 SHL_southern_compact_offer_tt: "Кейзан получит приглашение в Южный договор."
 SHL_key_to_sea_tt: "Ультиматум Вейру будет включать Тирву и Вейрский округ."
 SHL_restore_privileges_tt: "Все печи Шахрабада вернутся домам; погасшие будут готовы к оплаченному запуску. Давление гербов: §G-20§!. Недовольство кварталов: §R+10§!."
 SHL_private_armies_tt: "Дома выставят §Y3§! дивизии заводской стражи в Шахрабаде. Недовольство кварталов: §R+5§!."
 SHL_hereditary_republic_tt: "Верность каждого дома: §G+20§! (давление гербов §G-20§!)."
 SHL_furnaces_to_workers_tt: "Все печи Шахрабада перейдут городам; погасшие будут готовы к оплаченному запуску. Недовольство кварталов: §G-20§!. Гражданская опора: §G+15§!."
 SHL_common_smelting_tt: "Усиленная смена больше не увеличивает недовольство кварталов."
 # Focuses
 SHL_quarter_listening: "Слушать кварталы"
 SHL_quarter_listening_desc: "В рабочих кварталах о печах знают больше, чем в залах Конклава. Нур открывает приёмную для делегатов смен, пока их жалобы не превратились в требования."
 SHL_heralds_table: "Стол гербов"
 SHL_heralds_table_desc: "Дома привыкли решать споры за закрытыми дверями. Нур ставит в зале общий стол гербов, и главы домов впервые произносят свои обиды вслух, перед всеми девятью печатями."
 SHL_shift_arbitration: "Сменный арбитраж"
 SHL_shift_arbitration_desc: "Постоянная комиссия мастеров и управляющих разбирает споры о сменах до того, как они выходят за ворота завода."
 SHL_factory_militia: "Заводская стража"
 SHL_factory_militia_desc: "Охрана станций собирается на плацу у Девятипечья. Печи присылают ящики с винтовками, города - людей после смены, и вчерашние сторожа впервые учатся ходить строем."
 SHL_southern_watch: "Южная стража"
 SHL_southern_watch_desc: "Собрание арычных общин Кейзана считает чужой металл платой за свою воду. Зарханский округ должен встретить его отряды подготовленными позициями."
 SHL_mobilise_furnaces: "Мобилизация печей"
 SHL_mobilise_furnaces_desc: "Военные приёмщики приходят на каждый печной двор с чертежами и списками. Мастера ищут, как отлить заказ арсенала между гражданскими выпусками, не остановив ни одной смены."
 SHL_water_question: "Водный вопрос"
 SHL_water_question_desc: "Печи Арбина, Сафира и Лорана пьют воду кяризов Кейзана. Мы начнём разговор о воде сами, пока общины не начали его перекрытием водоводов."
 SHL_qanat_guard: "Охрана водоводов"
 SHL_qanat_guard_desc: "Если переговоры не дадут воды, головные колодцы на границе придётся взять под охрану Шахрабада."
 SHL_veyr_duties: "Вейрские пошлины"
 SHL_veyr_duties_desc: "Торговая палата Вейра берёт сбор с каждого вагона металла, идущего к морю. Мы откроем этот спор и подготовим собственную гавань."
 SHL_veyr_ultimatum: "Ультиматум палате"
 SHL_veyr_ultimatum_desc: "Рудники Кассена и дорога через Норан дают Вейру власть над нашей выручкой. Если палата не уступит, Шахрабад заберёт их."
 SHL_golden_gate_cartel: "Картель Золотых ворот"
 SHL_golden_gate_cartel_desc: "Десять домов договариваются о единых ценах на вывоз. Конклав становится не только собранием владельцев, но и общей торговой конторой."
 SHL_house_guards: "Гвардии домов"
 SHL_house_guards_desc: "Каждый дом выставляет охрану своих печей. Под общим командованием эти отряды станут армией, которую оплачивают сами владельцы."
 SHL_veyr_partnership: "Торговый союз с Вейром"
 SHL_veyr_partnership_desc: "Вейру нужен наш металл так же, как нам его причалы. Картель предложит палате долю в вывозе вместо сбора."
 SHL_conclave_of_ten: "Конклав десяти"
 SHL_conclave_of_ten_desc: "Десятый дом занял своё кресло, картель торгует от имени всех, а Золотые ворота открыты партнёрам, готовым защищать общий рынок."
 SHL_council_of_cities: "Совет городов"
 SHL_council_of_cities_desc: "Самостоятельные города получают постоянный совет рядом с Конклавом. Кварталы впервые видят своих представителей в зале решений."
 SHL_fire_and_water: "Огонь и вода"
 SHL_fire_and_water_desc: "Общины Кейзана и города Шахрабада управляются собраниями. Мы предложим делить воду и металл по общему договору без квоты и без силы."
 SHL_workers_brigades: "Рабочие дружины"
 SHL_workers_brigades_desc: "Города сами набирают дружины из смен. Их оружие куплено выручкой печей, а командиров выбирают цеха."
 SHL_southern_compact: "Южный договор"
 SHL_southern_compact_desc: "Открытый Конклав зовёт союз арычных общин за один стол. Вместо пайка и ультиматумов делегаты обеих сторон садятся над общей картой воды и металла."
 SHL_war_directorate: "Военная дирекция"
 SHL_war_directorate_desc: "Дирекция Нура распоряжается печами как единым арсеналом. Первая государственная линия выпуска станет оружейной."
 SHL_right_to_water: "Право на воду"
 SHL_right_to_water_desc: "Государственным печам нужна гарантированная вода. Дирекция объявляет головные кяризы границы частью промышленной системы Шахрабада."
 SHL_key_to_sea: "Ключ к морю"
 SHL_key_to_sea_desc: "Без Тирвы и Вейрского округа любой договор с палатой можно отменить одним сбором. Дирекция требует всей дороги к морю."
 SHL_iron_shahrabad: "Дирекция печей"
 SHL_iron_shahrabad_desc: "Печи больше не должны останавливаться из-за чужого решения о воде или причалах. Дирекция объявляет Шахрабад Железным: склады, дороги и стража отвечают перед одним приказом, а инспекторы Нура меряют силу страны работающими цехами и оружием на складе."
 SHL_regency_council: "Регентский совет"
 SHL_regency_council_desc: "Дарий Сафир правит от имени девяти гербов. Первые решения регентства должны показать, что дома едины."
 SHL_restore_privileges: "Возврат привилегий"
 SHL_restore_privileges_desc: "Все главные печи возвращаются наследственным домам. Городские комиссии распускаются, а погасшие предприятия переходят к прежним владельцам."
 SHL_private_armies: "Частные гвардии"
 SHL_private_armies_desc: "Дома больше не просят казну об охране. Каждая семья содержит собственный отряд, а регент сводит их в общий строй."
 SHL_debt_shifts: "Долговые смены"
 SHL_debt_shifts_desc: "Регентство оплачивает свои обещания будущими сменами рабочих кварталов."
 SHL_hereditary_republic: "Наследственная республика"
 SHL_hereditary_republic_desc: "Конклав становится республикой гербов: закон непрерывного огня защищает не город, а право домов на него."
 SHL_shift_councils: "Советы смен"
 SHL_shift_councils_desc: "Стачечные комитеты становятся властью. Каждая печь выбирает делегатов, а Совет смен заменяет Конклав."
 SHL_furnaces_to_workers: "Печи - рабочим"
 SHL_furnaces_to_workers_desc: "Наследственные права отменены. Каждая главная печь принадлежит городу, чьи люди держат её огонь."
 SHL_common_smelting: "Общая плавка"
 SHL_common_smelting_desc: "Смены сами решают, когда работать сверх нормы. Усиленная плавка больше не означает чужой приказ."
 SHL_qanat_brotherhood: "Братство кяризов"
 SHL_qanat_brotherhood_desc: "Коммуна огня протягивает руку союзу арычных общин: вода и металл должны принадлежать тем, кто их добывает."
 SHL_commune_of_fire: "Коммуна огня"
 SHL_commune_of_fire_desc: "Шахрабад без гербов и без регента. Печи горят для городов, а оборона держится на выборных дружинах и союзниках."
 # Spirits
 SHL_martial_law: "Военное положение"
 SHL_martial_law_desc: "Заводская охрана патрулирует кварталы. Смены выходят на работу, но Конклав теряет доверие."
 SHL_broken_conclave: "Расколотый Конклав"
 SHL_broken_conclave_desc: "Нур удержал власть, но половина гербов отказывается подписывать его решения."
 SHL_captured_qanats: "Захваченные кяризы"
 SHL_captured_qanats_desc: "Головные колодцы границы работают на печи Шахрабада. Общины Кейзана помнят, как их отняли."
 SHL_veyr_bondage: "Вейрская кабала"
 SHL_veyr_bondage_desc: "Поражение в порту заставило Шахрабад платить палате Вейра по её расценкам."
 SHL_keizan_ration: "Паёк Кейзана"
 SHL_keizan_ration_desc: "Собрание арычных общин забрало часть казны и требует металл в уплату за воду своих кяризов."
 SHL_victory_over_ration: "Победа над пайком"
 SHL_victory_over_ration_desc: "Отряды Кейзана отступили за свою границу, а Шахрабад получил земли Севира и Табара."
 # Characters, traits, parties, alliances
 SHL_Nawal_Haddad: "Наваль Хаддад"
 SHL_Nabil_Mansur: "Набиль Мансур"
 SHL_Lina_Sabbagh: "Лина Саббаг"
 SHL_Yunus_Hamdan: "Юнус Хамдан"
 SHL_Mazin_Barakat: "Мазин Баракат"
 SHL_Rima_Khoury: "Рима Хури"
 SHL_Darius_Safir: "Дарий Сафир"
 SHL_Darius_Safir_desc: "Глава дома Сафир и самый богатый из девяти гербов. Он называет регентство временным, но первым делом вернул домам все печи."
 SHL_regent_of_the_crests: "Регент гербов"
 SHL_regent_of_the_crests_desc: "Правит от имени домов и в их интересах."
 SHL_voice_of_the_shifts: "Голос смен"
 SHL_voice_of_the_shifts_desc: "Власть, которую можно отозвать на следующем собрании цеха."
 SHL_anarchism: "Коммуна Шахрабада"
 SHL_anarchism_DEF: "Коммуна Шахрабада"
 SHL_anarchism_party: "£GFX_generic_anarchism_artel_union_party_texticon Советы смен"
 SHL_southern_compact_faction: "Южный договор"
 SHL_golden_gate_faction: "Союз Золотых ворот"
 SHL_house_arbin_qanat_masters: "Мастера кяризов"
 SHL_house_arbin_qanat_masters_desc: "Дом Арбин держит воду и дороги запада."
 SHL_house_safir_purse: "Кошелёк Конклава"
 SHL_house_safir_purse_desc: "Сафиры платят за Конклав и помнят каждую монету."
 SHL_house_loran_golden_gate: "Золотые ворота"
 SHL_house_loran_golden_gate_desc: "Через двор Лоранов идёт металл к побережью."
 SHL_house_nur_mediators: "Посредники Нура"
 SHL_house_nur_mediators_desc: "Малый дом, который мирит большие."
 SHL_house_bayrat_ore_lords: "Рудные господа"
 SHL_house_bayrat_ore_lords_desc: "Руда Байрата кормит все девять печей."
 SHL_house_kerdan_sea_road: "Морская дорога"
 SHL_house_kerdan_sea_road_desc: "Обозы Кердана знают каждый колодец до Вейра."
 SHL_house_sharim_heavy_shifts: "Тяжёлые смены"
 SHL_house_sharim_heavy_shifts_desc: "У печи VII работают дольше и учатся быстрее."
 SHL_house_darban_engineers: "Инженеры Девятипечья"
 SHL_house_darban_engineers_desc: "Дарбаны строят то, что другие дома только заказывают."
 SHL_house_veyran_guards: "Пограничная гвардия"
 SHL_house_veyran_guards_desc: "Заставы Вейрана стоят там, где кончается Шахрабад."
 # Events
 ADISCORD_SHL.20.t: "Холодная смена"
 ADISCORD_SHL.20.d: "Утренний гудок прозвучал над пустыми проходными. Смены пришли к воротам, но не вошли в цеха. Стачечный комитет оставил у каждой из девяти печей по одному кочегару, чтобы кладка не остыла, и вывесил список требований на воротах Конклава в Хазаре. Первой остановилась печь Шарима - там смены самые тяжёлые, и журнал Салима Дарзи давно считал сверхурочные часы, которые дом не оплачивал.\n\nТребования просты: оплата сверхурочных, свободные дни после усиленных смен и право знать, куда уходит выручка. Ширин Шарим требует прислать стражу и называет стачку грабежом; Бехруз Вейран предлагает свои гвардии. Хосров Арбин и Камран Нур просят не торопиться: кочегары у печей - те же люди, что завтра должны поднять огонь. Арман Теймур напоминает, что охрана железной дороги умеет держать ворота, а не плавить металл.\n\nПока огонь держат на минимуме, каждая печь выдаёт меньше металла, и Лейла Надири ежедневно пересчитывает убыток. Казна может оплатить требования, Конклав может ждать и вести переговоры, а стража - открыть ворота силой."
 ADISCORD_SHL.20.a: "Оплатить требования из казны."
 ADISCORD_SHL.20.b: "Ждать и вести переговоры."
 ADISCORD_SHL.20.c: "Прислать охрану железной дороги."
 ADISCORD_SHL.21.t: "Советы смен требуют власти"
 ADISCORD_SHL.21.d: "Стачка перестала быть спором о деньгах. Комитеты всех главных печей собрались в литейном цеху Шарима и объявили себя Советом смен. Их решение подписал дежурный мастер Салим Дарзи. Они не просят отставки Джалиля Нура: они сообщают, что Конклав больше не нужен. Печи держат те, кто стоит у огня; гербы над креслами - только память о том, чьи деды их разожгли.\n\nГородские собрания Мехрана Арбина поддержали советы, хотя сам он не подписал их воззвания. Дома готовят ответ: Бехруз Вейран стягивает гвардии к Хазару, Дарий Сафир обещает оплатить любую стражу, Ширин Шарим требует вернуть её печь силой. Арман Теймур доложил, что общегосударственная стража удержит столицу, но не удержит девять заводских городов разом.\n\nУ Нура осталось два ответа. Признать советы - значит отдать печи тем, кто держит их огонь, и закончить Конклав девяти домов. Военное положение сохранит Конклав, но стоить это будет доверия кварталов, которые сегодня стоят у ворот."
 ADISCORD_SHL.21.a: "Признать Совет смен."
 ADISCORD_SHL.21.b: "Объявить военное положение."
 ADISCORD_SHL.22.t: "Смена вернулась"
 ADISCORD_SHL.22.d: "Кочегары снова подняли огонь до рабочей температуры. Первой заработала печь Шарима, последней - Вейрана, где гвардии дома до последнего стояли у ворот. Комитет не распущен: его делегаты вернулись к печам, а список требований сняли с ворот Конклава, но Салим Дарзи унёс рабочий журнал с собой, и в нём записано, кто и что обещал.\n\nВ ведомости следующего цикла Лейла Надири впервые отдельной строкой указала, сколько смен было оплачено сверх нормы. Ширин Шарим отказалась подписывать эту страницу; Хосров Арбин и Камран Нур подписали. Голшан Лоран подсчитал, сколько экспортных партий Шахрабад потерял за дни холодной смены, и положил расчёт рядом.\n\nАмин Рашад закрыл дело в архиве Конклава, но не убрал папку далеко. Кварталы узнали, что печи можно остановить, не разрушая; дома узнали, что без кочегаров герб над креслом - только рисунок. Обе стороны будут помнить это дольше, чем оплату сверхурочных."
 ADISCORD_SHL.22.a: "Печи снова работают."
 ADISCORD_SHL.30.t: "Ультиматум гербов"
 ADISCORD_SHL.30.d: "Поверенные девяти домов принесли в Конклав общее письмо. Они требуют вернуть наследственные права, отменить городские комиссии и подтвердить, что ни одна печь не перейдёт государству без согласия её дома. Первой стоит подпись Дария Сафира; за ней - Голшана Лорана, Ширин Шарим и Бехруза Вейрана. Ниже, мельче, подписались Байрат, Кердан и Арбин. Даже Камран Нур поставил имя малого дома, хотя посредник сидит в том же зале.\n\nПодписи, которые обычно не встречаются рядом, означают одно: дома договорились между собой раньше, чем с Конклавом. У Сафира есть казна, у Вейрана - гвардии, у Лорана - покупатели за Золотыми воротами, которым всё равно, кто подписывает накладные. Если гербы правят вместе, посредник им не нужен.\n\nАмин Рашад прочитал письмо вслух и положил печать рядом. Бахрам Каве доложил, что гвардии Вейрана уже получили приказ о сборе. Джалиль Нур может дать домам гарантии, выдержать давление и ждать, пока союз гербов распадётся, или арестовать зачинщиков - если дирекция готова к последствиям."
 ADISCORD_SHL.30.a: "Дать гарантии домам."
 ADISCORD_SHL.30.b: "Выдержать давление."
 ADISCORD_SHL.30.c: "Арестовать зачинщиков."
 ADISCORD_SHL.31.t: "Ночь гербов"
 ADISCORD_SHL.31.d: "Ночью гвардии Бехруза Вейрана заняли мосты через сухое русло и телеграф Хазара. Люди Ширин Шарим выставили посты у печного округа, а казна Сафира оплатила каждому караулу двойное жалованье вперёд. К утру ни один приказ посредника не вышел за пределы зала Конклава.\n\nДарий Сафир пришёл в зал с решением девяти гербов: Джалиль Нур остаётся посредником по имени, а Совет гербов во главе с регентом принимает власть над печами, казной и стражей. Голшан Лоран держал в руках готовый акт; Рауф Дарбан и Хосров Арбин стояли позади, не глядя на кресло. Амин Рашад не отдал печать и не спрятал её: он ждал слова Нура.\n\nАрман Теймур доложил, что часть городской стражи ещё верна посреднику и готова удержать площадь. Мехран Арбин прислал из собраний короткую записку: города выйдут, если их позовут. Сопротивление сохранит Конклав, но расколет его надолго. Уступка отдаст Шахрабад регентству, которое называет себя временной мерой."
 ADISCORD_SHL.31.a: "Уступить регентству."
 ADISCORD_SHL.31.b: "Сопротивляться."
 ADISCORD_SHL.32.t: "Письмо без подписей"
 ADISCORD_SHL.32.d: "Общий ультиматум распался. Каждый дом получил отдельное обещание, и уже через неделю поверенные спорили друг с другом громче, чем с посредником. Тахмурас Байрат получил гарантии по рудным договорам и первым отозвал подпись. Ферейдун Кердан добился, чтобы дорога к морю осталась в ведении дома, и ушёл следом. Камран Нур объяснил Конклаву, что малый дом подписывал письмо только ради единства гербов, а раз единства нет, нет и подписи.\n\nДарий Сафир и Ширин Шарим держались дольше всех, но Голшан Лоран уже торговал с Хазаром от своего имени, а гвардии Бехруза Вейрана вернулись к границе: Бахрам Каве доложил, что отряды Кейзана у цистерн беспокоят дом больше городских комиссий.\n\nПисьмо осталось в архиве Конклава без новых подписей. Амин Рашад подшил его к делу и отметил дату: гербы разошлись, но каждый унёс с собой обещание, которое Конклаву предстоит исполнять."
 ADISCORD_SHL.32.a: "Гербы разошлись."
 ADISCORD_SHL.40.t: "Авария на главной печи"
 ADISCORD_SHL.40.d: "Изношенная кладка не выдержала очередной плавки. Металл прорвался в литейный пролёт, залил желоба и подъездные пути; людей удалось вывести, но печь придётся гасить, а цеха вокруг неё - восстанавливать. Самира Хади увезла обожжённых в лазарет при печи и в городскую больницу, не спрашивая, в каком реестре они числятся.\n\nДом утверждает, что мастера работали сверх нормы и перегрели печь ради усиленной смены. Мастера говорят, что дом годами откладывал ремонт и подписывал ведомости с заниженным износом. Лейла Надири подняла промышленную ведомость Конклава: записи о состоянии кладки есть, но подпись дома и подпись мастера стоят под разными цифрами. Арман Теймур поставил караул у развалин, чтобы никто не вынес ни улик, ни металла.\n\nГород ждёт, кого Конклав назовёт виновным. Обвинить дом - значит поддержать кварталы против герба. Обвинить мастеров - значит поддержать герб против тех, кто завтра встанет к огню. Комиссия займёт время и политический вес, но даст ответ, который подпишут обе стороны."
 ADISCORD_SHL.40.a: "Виноват дом."
 ADISCORD_SHL.40.b: "Виноваты мастера."
 ADISCORD_SHL.40.c: "Назначить комиссию."
 ADISCORD_SHL.50.t: "Кяризы пересыхают"
 ADISCORD_SHL.50.d: "Общины Кейзана закрыли боковые отводы кяризов, питавшие печи Арбина, Сафира и Лорана. [SHLGetArbinWaterReport] Собрание арычных общин прислало в Хазар письмо без угроз: печи Шахрабада пьют воду, которой общины поливают поля, и за это никто не платит.\n\nДарий Сафир требует от Конклава немедленных мер - его печь стоит на той же воде. Голшан Лоран предлагает заплатить металлом: у общин нет своих водоводов, а у Лорана есть прокат. Бехруз Вейран говорит о головных колодцах, которые можно занять за несколько дней. Рамин Фарзан напоминает, что Кейзан - не одно правительство, а собрание, и договор с ним нужно вести так, чтобы его признали все общины.\n\nБез охлаждения кладка стареет быстрее, и три печи из девяти ждут решения. Можно договориться о квоте, пробурить собственные артезианские скважины или взять головные колодцы силой. Лейла Надири разворачивает схемы трёх западных округов. Прежде чем посылать ответ, она просит мастеров назвать, сколько воды вернётся к горнам и сколько уже обещано дворам."
 SHL_arbin_water_exposed: "Хосров Арбин узнал об этом первым: его охладительные каналы обмелели за одну ночь, и мастера западной печи начали считать часы до перегрева кладки."
 ADISCORD_SHL.50.a: "Спор о воде нужно решить."
 ADISCORD_SHL.52.t: "Шахрабад предлагает воду за металл"
 ADISCORD_SHL.52.d: "Посланники Конклава Шахрабада прибыли к собранию арычных общин с предложением, которое подписали три дома, пьющие воду кяризов: Хосров Арбин, Дарий Сафир и Голшан Лоран. Шахрабад предлагает металл для водоводов - трубы, задвижки и прокат из печей Лорана - и регулярную долю выручки трёх печей, записанную в промышленную ведомость Конклава, а не в частные обещания домов.\n\nВзамен Шахрабад просит открыть боковые отводы кяризов для Арбина, Сафира и Лорана в прежнем объёме. Рамин Фарзан, говоривший от имени Хазара, подчеркнул, что головные колодцы остаются у общин и что никаких стражников на водоводах Конклав не предлагает: квота - это договор, а не оккупация.\n\nСобрание слушало долго. Металл нужен каждой общине, но вода, отданная печам, не вернётся на поля. Старейшины спрашивают, что будет с квотой, когда в Хазаре сменится власть, и кто ответит, если дома сочтут долю выручки слишком щедрой. Ответ Кейзана определит, пойдёт ли вода к печам по договору или по другому пути."
 ADISCORD_SHL.52.a: "Принять договор."
 ADISCORD_SHL.52.b: "Отказать."
 ADISCORD_SHL.53.t: "Кейзан согласился"
 ADISCORD_SHL.53.d: "Собрание арычных общин приняло предложение Шахрабада. Отводы кяризов снова открыты, и печи Арбина, Сафира и Лорана получают воду в прежнем объёме. Первые трубы из проката Лорана уже ушли к головным колодцам, а Лейла Надири внесла долю выручки трёх печей отдельной строкой в промышленную ведомость Конклава.\n\nХосров Арбин приехал в Хазар впервые за много месяцев и подписал договор лично: западная печь дома была ближе всех к перегреву. Дарий Сафир подписал через поверенного, а Голшан Лоран - с оговоркой, что металл для водоводов Кейзана засчитывается в счёт экспортных обязательств дома. Рамин Фарзан принял оговорку, но потребовал внести её в текст, чтобы общины не узнали о ней позже.\n\nСпор о воде закрыт договором. Старейшины общин сохранили колодцы, Конклав - печи, и ни одному стражнику не пришлось выходить к кяризам. Что будет с квотой, если власть в Хазаре сменится, предстоит выяснить тем, кто её сменит."
 ADISCORD_SHL.53.a: "Вода вернулась."
 ADISCORD_SHL.54.t: "Кейзан отказал"
 ADISCORD_SHL.54.d: "Собрание арычных общин не приняло предложение Шахрабада, либо договор нельзя выполнить: в казне не хватает обещанной доли, или стороны уже воюют. Рамин Фарзан вернулся в Хазар с письмом, в котором старейшины благодарят за металл и отказываются от квоты: вода, отданная печам, не вернётся на поля, а обещания домов общины помнят с прежних лет.\n\nХосров Арбин принял отказ тяжелее всех. Его западная печь первой почувствует нехватку охлаждения, и дом уже обсуждает, не купить ли воду у общин напрямую, минуя Конклав. Дарий Сафир требует от посредника иного решения и готов оплатить его из своей казны. Бехруз Вейран напоминает, что головные колодцы охраняют крестьяне с ружьями, а не армия.\n\nСпор о воде остаётся открытым. Конклав может пробурить собственные артезианские скважины, вернуться к переговорам позже или взять колодцы силой в ограниченной войне. Каждый путь стоит денег, времени или крови, и три печи из девяти ждут, какой из них выберет Хазар."
 ADISCORD_SHL.54.a: "Искать другой путь."
 ADISCORD_SHL.55.t: "Братство кяризов"
 ADISCORD_SHL.55.d: "Делегаты Шахрабада приехали к собранию арычных общин не от домов, а от городов и советов смен. Их письмо подписали Мехран Арбин от городских собраний и Салим Дарзи от советов смен; ни одного герба под ним нет. Шахрабад предлагает общинам общий договор: воду и металл делят собрания, без квот, без доли выручки и без стражников на колодцах.\n\nБратство кяризов означает, что печи Арбина, Сафира и Лорана получат воду как участники общего дела, а общины - металл для водоводов и место за одним столом с кварталами Шахрабада. Хосров Арбин, чья печь первой страдает от закрытых отводов, не подписывал письма, но сын говорит от его города.\n\nСтарейшины общин помнят прежние обещания домов и спрашивают, устоит ли братство, если в Хазаре снова возьмут верх гербы. Делегаты отвечают честно: это зависит и от Кейзана. Если договор будет принят, спор о воде закончится не квотой, а общим правом на неё."
 ADISCORD_SHL.55.a: "Принять братство."
 ADISCORD_SHL.55.b: "Отказать."
 ADISCORD_SHL.56.t: "Перемирие у водоводов"
 ADISCORD_SHL.56.d: "Бои за головные колодцы затянулись. Отряды Шахрабада заняли подступы к кяризам, но общины ушли в поля и ночами разбирали то, что днём чинили сапёры Конклава; Бехруз Вейран потерял у водоводов больше людей, чем обещал Конклаву. Хосров Арбин, ради печи которого начиналась война, первым сказал вслух, что воды от этого не прибавилось.\n\nСтарейшины общин предлагают перемирие на прежней границе. Рамин Фарзан привёз их условия в Хазар: стороны отводят отряды, колодцы остаются у общин, отводы кяризов - закрытыми. Арман Теймур докладывает, что стража устала, а Лейла Надири - что каждый день войны стоит казне больше, чем любая квота.\n\nДарий Сафир и Голшан Лоран требуют продолжать, но их печи стоят на той же воде, что и печь Арбина, и доводы иссякают вместе с ней. Спор о воде остаётся нерешённым. Перемирие даст печам время, но не даст им охлаждения."
 ADISCORD_SHL.56.a: "Согласиться на перемирие."
 ADISCORD_SHL.56.b: "Закрепить занятые районы."
 ADISCORD_SHL.56.c: "Уступить то, что не удержали."
 ADISCORD_SHL.56.d_edge: "Бои за головные колодцы затихли сами собой: у обеих сторон кончились люди, готовые ночами лезть в кяризы. Но карта в зале Конклава уже не похожа на ту, с которой начиналась война. Стража Армана Теймура стоит у колодцев общин, сапёры Бехруза Вейрана засыпали обходные ходы, а над водоводами Арбина впервые за годы висит не дым перегрева, а пыль от телег с камнем.\n\nСтарейшины общин просят перемирия и не спорят о линии: они знают, где стоят чужие караулы. Рамин Фарзан привёз их условия в Хазар без единой поправки. Лейла Надири уже внесла занятые районы в ведомость отдельной строкой, а Хосров Арбин требует не отдавать ни одного колодца, который стоил его дому столько крови.\n\nДарий Сафир напоминает, что общины не забывают уступок, сделанных под ружьём, и через год придут за ответом. Конклав подписывает перемирие на той границе, которую провели его солдаты."
 ADISCORD_SHL.56.d_enemy: "Перемирие у водоводов подписывают не в Хазаре, а у выжженной заставы под Арбином. Общины Кейзана не только удержали свои колодцы: их отряды прошли по сухим арыкам до печных дворов и встали у стен, где ещё недавно стояли караулы Конклава. Хосров Арбин видел их огни со своей крыши и впервые не стал спорить с теми, кто говорил о мире.\n\nРамин Фарзан привёз условия старейшин: каждая сторона остаётся там, где стоит. Арман Теймур докладывает, что выбить общины без новых рот невозможно, а Лейла Надири - что новых рот казна не оплатит. Бехруз Вейран молчит, и его молчание тяжелее любых доводов.\n\nКонклав принимает перемирие. Граница проходит теперь по земле, которую Шахрабад считал своей, и старейшины уверены, что их внуки будут называть её кейзанской."
 ADISCORD_SHL.57.t: "Кяризы под охраной Шахрабада"
 ADISCORD_SHL.57.d: "Общины Кейзана признали поражение. Севир, Табар, Нарван и Ормис переходят под власть Шахрабада, а головные колодцы кяризов охраняют заводские стражники Конклава. Отводы к печам Арбина, Сафира и Лорана открыты полностью, и впервые за много лет западная печь Хосрова Арбина работает без расчёта часов до перегрева.\n\nБехруз Вейран привёл гвардии дома обратно к границе и потребовал записать в ведомость, сколько они стоили. Голшан Лоран уже отправил прокат на водоводы занятых общин: металл, который раньше предлагали за квоту, теперь идёт в счёт восстановления. Самира Хади просит открыть лазареты в Табаре и Нарване для раненых обеих сторон. Рамин Фарзан предупреждает, что собрание общин не распущено, а лишь ушло из занятых посёлков дальше на запад.\n\nВода принадлежит печам. Старейшины помнят, что кяризы веками чинили их руки, а не руки стражников, и Конклаву предстоит узнать, сколько стоит охранять воду, которую никто не хочет отдавать."
 ADISCORD_SHL.57.a: "Вода принадлежит печам."
 ADISCORD_SHL.57.b: "Вернуть колодцы общинам."
 ADISCORD_SHL.58.t: "Поражение у водоводов"
 ADISCORD_SHL.58.d: "Шахрабад не удержал фронт. Отряды общин, которых в Хазаре считали крестьянами с ружьями, обошли посты Вейрана по старым руслам кяризов и заняли Арбин. Западная печь Хосрова Арбина стоит под охраной тех, кто перекрыл ей воду; сам глава дома уехал в Хазар и впервые сидит в зале Конклава без права голоса - печь погасла, а с ней и герб.\n\nСтарейшины выставили условие: остальные печи получат воду только по квоте, которую назначит собрание. Дарий Сафир и Голшан Лоран подписали его первыми - их печи ждать не могут. Бехруз Вейран отказался и увёл гвардии дома к своей границе. Арман Теймур доложил, что стража не в состоянии вернуть Арбин без новой войны, а Лейла Надири - что казна её не выдержит.\n\nМехран Арбин вернулся в город отца с делегацией собраний: общины готовы говорить с городами, но не с гербами. Конклав принимает условия. Вода пойдёт к печам, но решать, сколько её будет, теперь станет Кейзан."
 ADISCORD_SHL.58.a: "Принять условия."
 ADISCORD_SHL.60.t: "Вейрский сбор"
 ADISCORD_SHL.60.d: "Торговая палата Вейра объявила новый сбор с металла, идущего через её стеклянные порты. Каждый вагон с проката теперь проходит через весы палаты, и Ферейдун Кердан, чья дорога к морю везёт этот металл, получил тариф раньше, чем Конклав - уведомление. Бехруз Вейран, чьи земли граничат с портами, добавил, что сборщики палаты стоят уже на его разъездах.\n\nСбор невелик для одной партии, но он уменьшает выручку каждой из девяти печей. Голшан Лоран подсчитал, сколько потеряют экспортные договоры Золотых ворот за год, и потребовал ответа. Дарий Сафир предлагает выкупить сбор долей в вывозе - палата торгует, а не воюет. Рауф Дарбан напоминает о собственной гавани: дорого, долго, но навсегда. Бехруз Вейран говорит о ключе к морю, который можно взять силой.\n\nРамин Фарзан просит Конклав выбрать один путь, прежде чем палата решит, что Шахрабад готов платить. Сбор можно обойти собственной гаванью, отменить договором или снять силой."
 ADISCORD_SHL.60.a: "Нужно решить вопрос со сбором."
 ADISCORD_SHL.61.t: "Шахрабад предлагает торговый союз"
 ADISCORD_SHL.61.d: "Картель Золотых ворот предлагает Торговой палате Вейра долю в вывозе шахрабадского металла вместо сбора. Предложение привёз Рамин Фарзан, но составлял его Голшан Лоран, а подписали Ферейдун Кердан, по чьей дороге идёт металл, и Дарий Сафир, чья казна гарантирует выплаты. Порты получат постоянный грузопоток и место за столом картеля; Шахрабад - свободный путь к морю без весов палаты на каждом вагоне.\n\nПалата знает, что девять печей не могут возить металл иначе, чем через её порты, и потому сбор был оправдан. Но знает и то, что Конклав обсуждал собственную гавань и что гвардии Бехруза Вейрана стоят у границы портов. Доля в вывозе - это доход без риска; сбор - доход с риском войны или потери грузопотока.\n\nЧлены палаты спорят, можно ли доверять картелю, в котором одни дома торгуют, а другие держат гвардии. Ответ Вейра определит, пойдёт ли металл к морю по договору или по другой дороге."
 ADISCORD_SHL.61.a: "Принять союз."
 ADISCORD_SHL.61.b: "Отказать."
 ADISCORD_SHL.62.t: "Вейр принял союз"
 ADISCORD_SHL.62.d: "Торговая палата Вейра отменила сбор для металла Шахрабада. Весы палаты убрали с разъездов, а её поверенные теперь сидят за столом картеля Золотых ворот рядом с Голшаном Лораном и Дарием Сафиром. Ферейдун Кердан получил то, за что его дом годами платил из своей казны: дорога к морю открыта по договору, а не по тарифу.\n\nЛейла Надири внесла долю палаты в экспортную ведомость Конклава, а Рамин Фарзан проследил, чтобы договор упоминал все девять печей, а не только три дома, которые его подписали. Бехруз Вейран отозвал гвардии от границы портов, хотя сделал это не сразу: пограничный дом не любит соглашений, которые подписаны без него.\n\nМехран Арбин спросил в собрании, кто будет считать долю палаты - картель или Конклав. Вопрос остался открытым, но путь к морю открыт. Металл Шахрабада идёт в порты без сбора, и это первое соглашение, которое дома заключили от имени всей страны, а не каждый за себя."
 ADISCORD_SHL.62.a: "Путь к морю открыт."
 ADISCORD_SHL.63.t: "Вейр отказал"
 ADISCORD_SHL.63.d: "Торговая палата Вейра не приняла предложение Шахрабада, либо договор невозможен, потому что стороны воюют. Рамин Фарзан вернулся с письмом, в котором палата благодарит картель за честь и оставляет сбор в силе: порты предпочитают известный тариф доле в чужом предприятии, где дома спорят друг с другом громче, чем с соседями.\n\nГолшан Лоран принял отказ как личное оскорбление: его экспортные договоры по-прежнему проходят через весы палаты. Ферейдун Кердан мрачно заметил, что его дорога не первый год платит этот сбор и Конклав вспомнил о нём только теперь. Дарий Сафир предлагает поднять долю и повторить предложение; Бехруз Вейран - показать палате гвардии у границы портов. Рауф Дарбан молча положил на стол смету собственной гавани.\n\nСбор остаётся. Конклав может построить свою дорогу к морю, вернуться к переговорам позже или снять сбор силой в ограниченной войне за ключ к морю. Пока Хазар выбирает, каждый вагон проката по-прежнему проходит через весы Вейра."
 ADISCORD_SHL.63.a: "Искать другой путь."
 ADISCORD_SHL.65.t: "Перемирие в порту"
 ADISCORD_SHL.65.d: "Война за дорогу к морю не принесла решающей победы. Отряды Шахрабада дошли до предгорий у Салика, но стеклянные порты остались за палатой, а её наёмные команды каждую ночь рвали пути на дороге Ферейдуна Кердана. Бехруз Вейран, чьи гвардии шли первыми, доложил Конклаву, что пограничный дом больше не может держать фронт за свой счёт.\n\nПалата предлагает перемирие на прежних границах. Рамин Фарзан привёз условия: отряды отводятся, порты остаются у Вейра, сбор остаётся на каждом вагоне. Голшан Лоран требует продолжать - экспортные договоры Золотых ворот горят, - но Лейла Надири показала ему, во что обошёлся каждый день войны, и Дарий Сафир отказался платить дальше.\n\nАрман Теймур просит дать страже время восстановить роты. Перемирие вернёт металл на дорогу к морю, но весы палаты останутся на ней. Ключ к морю Шахрабад не получил; получил лишь счёт за попытку."
 ADISCORD_SHL.65.a: "Согласиться на перемирие."
 ADISCORD_SHL.65.b: "Закрепить занятые порты."
 ADISCORD_SHL.65.c: "Уступить то, что не удержали."
 ADISCORD_SHL.65.d_edge: "Война за дорогу к морю закончилась не капитуляцией палаты, а усталостью обеих сторон. Отряды Шахрабада стоят на пристанях, которые ещё весной принадлежали Торговой палате Вейра, и сборщики палаты больше не выходят к вагонам Ферейдуна Кердана. Голшан Лоран уже ищет капитанов, готовых везти металл без чужих печатей.\n\nПалата предлагает перемирие и не требует отвода войск: её счётчики знают, что занятые причалы им сейчас не вернуть. Рамин Фарзан советует принять условия, пока в Вейре не нашли новых наёмников. Бехруз Вейран требует оплатить гарнизоны в портах из общей казны, а Лейла Надири подсчитывает, сколько сбора удастся сберечь за год.\n\nКонклав подписывает перемирие на линии своих караулов. В конторах палаты эту линию уже называют временной."
 ADISCORD_SHL.65.d_enemy: "Портовая война обернулась против тех, кто её начал. Наёмные команды Торговой палаты Вейра не только удержали стеклянные порты, но и перешли границу: их весы стоят теперь на дорогах Конклава, а флаги палаты - над складами, где Ферейдун Кердан хранил металл для моря. Ширин Шарим каждую ночь отправляет гонцов в Хазар с одним вопросом: кто будет оборонять её печь.\n\nПалата предлагает перемирие, и её условия просты: каждая сторона держит то, что держит. Арман Теймур признаёт, что выбить наёмников без новых рот невозможно. Лейла Надири отвечает, что новых рот не будет, пока дорога к морю закрыта, а без дороги нет и денег на роты.\n\nКонклав подписывает перемирие. Палата получила больше, чем требовала до войны, и Шахрабаду придётся решать, выкупать ли потерянное или ждать другой войны."
 ADISCORD_SHL.66.t: "Дорога к морю"
 ADISCORD_SHL.66.d: "Торговая палата Вейра признала поражение. Рудники Кассена и дорога через Норан переходят Шахрабаду, а сбор палаты больше не действует. Ферейдун Кердан впервые проехал всю дорогу от своей печи до моря, не встретив ни одних чужих весов, и велел записать это в хронику дома.\n\nТахмурас Байрат уже отправил горных мастеров в Кассен: новые рудники разгрузят его шахты, но потребуют тех же людей и того же порядка. Голшан Лоран переписывает экспортные договоры без строки о сборе, а Лейла Надири - промышленную ведомость с новыми районами. Бехруз Вейран привёл гвардии дома обратно к границе и потребовал оплатить каждый день похода из общей казны, а не из его. Рамин Фарзан напоминает, что палата не распущена и порты по-прежнему её: Шахрабад взял дорогу, а не море.\n\nМеталл пойдёт к морю. Палата будет помнить, кто снял её весы с дороги, и ждать дня, когда Конклав займётся чем-нибудь другим."
 ADISCORD_SHL.66.a: "Металл пойдёт к морю."
 ADISCORD_SHL.66.b: "Открыть портовый союз."
 ADISCORD_SHL.67.t: "Поражение в порту"
 ADISCORD_SHL.67.d: "Шахрабад не удержал фронт. Наёмные команды палаты и портовые дружины прошли через предгорья и заняли Салик, перерезав дорогу Ферейдуна Кердана в её самом узком месте. Гвардии Бехруза Вейрана отошли к своей границе, не дождавшись подкреплений: стража Конклава застряла в Хазаре без обоза.\n\nПалата забирает Салик и навязывает свои расценки на вывоз металла. Голшан Лоран подписал новые тарифы первым - без вывоза его дом не существует. Ферейдун Кердан подписал последним и ушёл из зала, не дождавшись печати. Дарий Сафир потребовал от посредника объяснить, за что платила его казна, а Лейла Надири - записать проигранную войну в ведомость отдельной строкой, чтобы следующий Конклав видел цену.\n\nМехран Арбин сказал в собрании то, что дома не хотели слышать: ключ к морю нельзя взять гвардиями одного пограничного дома. Шахрабад принимает условия. Металл пойдёт к морю через весы Вейра, и весы теперь стоят на шахрабадской земле."
 ADISCORD_SHL.67.a: "Принять условия."
 ADISCORD_SHL.70.t: "Паёк Кейзана"
 ADISCORD_SHL.70.d: "Посланник Собрания арычных общин прибыл в Хазар с расчётом: печи Арбина, Сафира и Лорана пьют воду кяризов Кейзана, и общины считают шахрабадский металл платой за неё - водным пайком, который Шахрабад задолжал. Кейзан требует платежа и напоминает, что Зарханский округ лежит у границы Табара. Бехруз Вейран, чьи земли первыми встретят отряды общин, прочитал письмо дважды и попросил Конклав не считать это торговлей.\n\nРамин Фарзан объяснил залу: Собрание не продаёт и не покупает, оно делит воду, и Шахрабад для него - сосед, который взял из общих кяризов больше других и ничем не заплатил. Дарий Сафир готов оплатить требование из своей казны, лишь бы не трогать печи. Тахмурас Байрат против: заплатить раз - значит платить всегда. Арман Теймур доложил, что страже нужны шестьдесят дней, чтобы занять позиции в Зарханском округе, и что ровно столько Собрание обещает подождать.\n\nМожно заплатить и закрыть вопрос на время. Можно отказать и подготовиться к войне: общины дадут шестьдесят дней, и ни днём больше."
 ADISCORD_SHL.70.a: "Выплатить паёк."
 ADISCORD_SHL.70.b: "Отказать Кейзану."
 ADISCORD_SHL.71.t: "Кейзан выступил"
 ADISCORD_SHL.71.d: "Срок ультиматума истёк. На рассвете отряды Кейзана перешли границу Зарханского округа со стороны Табара, у головных цистерн, и двинулись к печному округу. Собрание арычных общин объявило, что возьмёт свой водный паёк само. Бехруз Вейран поднял гвардии дома по тревоге раньше, чем из Хазара пришёл приказ: пограничный дом ждал этого дня с первого письма.\n\nАрман Теймур докладывает Конклаву: стража стоит на подготовленных позициях у Зархана, обоз собран, но резервов нет. Бахрам Каве перехватил расписание кейзанских колонн - делегаты общин идут за отрядами с водными ведомостями и уже знают, какие печи ближе к границе. Рауф Дарбан предлагает отдать арсенальные плавки под фронт без очереди. Ширин Шарим просит вывести смены из Шарима, если фронт подойдёт.\n\nДжалиль Нур собрал всех девятерых глав домов в одном зале. Споры о воде, сборах и кварталах не исчезли, но сегодня у Конклава один враг, и печи будут работать на него. К оружию."
 ADISCORD_SHL.71.a: "К оружию."
 ADISCORD_SHL.72.t: "Перемирие с Кейзаном"
 ADISCORD_SHL.72.d: "Наступление Кейзана выдохлось у печного округа, а Шахрабад не смог отбросить его обратно за Зархан. Отряды общин держат цистерны Севира и Табара, стража Конклава - подходы к Шариму и Вейрану; между ними лежат выжженные караванные дороги, по которым никто не возит ни воду, ни металл.\n\nСобрание арычных общин соглашается на перемирие на прежней границе и снимает требование пайка. Рамин Фарзан привёз условия и добавил своё мнение: делегаты общин устали считать убытки так же, как Лейла Надири. Бехруз Вейран против перемирия - его земли первыми приняли удар, и он хочет вернуть каждый разъезд. Арман Теймур за: стража держится на старых унтер-офицерах и не выдержит ещё одного наступления.\n\nДарий Сафир подвёл итог просто: паёк не выплачен, печи работают, граница на месте. Конклав принимает перемирие. Кейзан отступает к цистернам и запоминает, что Шахрабад умеет держать позиции, но не умеет наступать."
 ADISCORD_SHL.72.a: "Согласиться на перемирие."
 ADISCORD_SHL.72.b: "Закрепить занятые районы."
 ADISCORD_SHL.72.c: "Уступить то, что не удержали."
 ADISCORD_SHL.72.d_edge: "Наступление Кейзана захлебнулось у Зархана, а затем покатилось назад. Стража Армана Теймура вошла в посёлки у цистерн, и делегаты Собрания арычных общин встречают посланников Конклава уже не у границы Зарханского округа, а в собственных колодезных дворах. Бехруз Вейран, чьи земли первыми приняли удар, теперь сам выбирает, где ставить разъезды.\n\nСобрание предлагает перемирие и снимает требование пайка. Рамин Фарзан передаёт: старейшины согласны подписать мир на линии, где стоят войска, лишь бы прекратить бои у цистерн. Лейла Надири предупреждает, что содержать занятые районы будет дорого, а Дарий Сафир - что соседи не прощают земли, взятой без победы.\n\nКонклав принимает перемирие. Паёк не выплачен, Зархан удержан, а часть цистерн осталась за караулами Шахрабада. Кейзан запомнит и это."
 ADISCORD_SHL.72.d_enemy: "Зарханский округ пал раньше, чем подошли подкрепления. Отряды Собрания арычных общин прошли по караванным дорогам до печей, и теперь их делегаты встречают посланников Конклава в Зархане как хозяева. Беженцы из округа заполнили дворы Шарима и Вейрана; Самира Хади развернула лазареты прямо у литейных пролётов.\n\nСобрание предлагает перемирие на линии, где стоят его отряды, и больше не говорит о пайке: ему хватает того, что оно взяло. Арман Теймур докладывает, что стража не выдержит нового наступления. Бехруз Вейран требует не подписывать ничего, пока его земли в чужих руках, но у него не осталось гвардий, чтобы вернуть их силой.\n\nКонклав подписывает перемирие. Граница проходит теперь по округу, который Шахрабад обещал защищать, и в Хазаре все понимают, что этот долг ещё придётся вернуть."
 ADISCORD_SHL.73.t: "Кейзан разбит"
 ADISCORD_SHL.73.d: "Собрание арычных общин признало поражение. Севир и Табар - оба района головных цистерн - переходят Шахрабаду, а требования пайка сняты. Стража Конклава вошла в Севир под командованием Армана Теймура; гвардии Бехруза Вейрана, первыми встретившие отряды Кейзана, первыми же вошли в Табар и подняли над цистернами флаг дома раньше, чем флаг Конклава.\n\nДелегаты общин передали водные ведомости и ушли к Нарвану. Самира Хади открыла лазарет в Табаре для обеих сторон; Бахрам Каве доложил, что Собрание не распущено и соседи - Мазар, Вейр, Кадир - смотрят, что Шахрабад сделает с цистернами. Голшан Лоран уже считает, сколько стоит вода пустыни на рынке Золотых ворот. Мехран Арбин напоминает, что цистерны поят не только Кейзан, и спрашивает, кем Шахрабад хочет быть для соседей: хозяином воды или её распорядителем.\n\nШахрабад устоял. Конклав может удерживать коридор, вернуть цистерны за концессию или предложить независимому Кейзану хартию. Каждый ответ запомнят все, кто пьёт из этих цистерн."
 ADISCORD_SHL.73.a: "Шахрабад устоял."
 ADISCORD_SHL.74.t: "Паёк взят силой"
 ADISCORD_SHL.74.d: "Шахрабад капитулировал. Отряды Кейзана не пошли дальше печного округа, и делегаты общин объяснили почему: Собрание арычных общин не забирает печи - ему нужен металл, который они дают, в уплату за воду. Вместо этого делегаты вывезли из Хазара две пятых казны и остались в городе следить за выплатами, с водными ведомостями и охраной.\n\nДарий Сафир потребовал от Конклава объяснить, почему казна его дома считается казной Шахрабада, и не получил ответа. Бехруз Вейран увёл гвардии к границе, которую больше не признаёт своей. Лейла Надири передала делегатам копии промышленной ведомости - они потребовали подлинники. Амин Рашад сохранил печать, но подписывать ею пришлось чужие расчёты.\n\nПечи продолжают работать. Ширин Шарим первой подняла огонь в полную силу: общины считают металл, и остановка смены теперь обошлась бы дороже, чем её оплата. Конклав жив, но Кейзан сидит в его зале, и каждая плавка проходит через чужую ведомость."
 ADISCORD_SHL.74.a: "Печи продолжают работать."
 ADISCORD_SHL.75.t: "Кейзан требует снова"
 ADISCORD_SHL.75.d: "Собрание арычных общин вернулось. Прежний платёж делегаты называют задатком и теперь требуют окончательный водный паёк в размере 400, после чего Кейзан обещает закрыть вопрос навсегда. Посланник передал расчёт Амину Рашаду с той же вежливостью, что и в прошлый раз, и с тем же напоминанием о Зарханском округе.\n\nТахмурас Байрат первым сказал вслух то, что думали все: первый платёж не купил мира, а лишь показал общинам, что Шахрабад платит. Дарий Сафир готов заплатить и в этот раз - его казна выдержит, а печи дороже. Голшан Лоран подсчитал, что сумма равна выручке двух печей за цикл, и назвал её терпимой. Бехруз Вейран и Арман Теймур считают иначе: стража с прошлого раза успела подготовить позиции у Зархана, и отказ сегодня стоит меньше, чем год назад.\n\nМожно заплатить окончательно и поверить обещанию Собрания. Можно отказать и встретить Кейзан на подготовленных позициях. Общины снова дадут шестьдесят дней."
 ADISCORD_SHL.75.a: "Заплатить окончательно."
 ADISCORD_SHL.75.b: "Отказать Кейзану."
 ADISCORD_SHL.90.t: "Южный договор"
 ADISCORD_SHL.90.d: "Шахрабад предлагает общинам Кейзана союз. Письмо привёз Мехран Арбин от имени Южного договора: общий совет по воде и металлу, в котором собрание арычных общин сидит рядом с городскими собраниями Шахрабада, а не напротив гербов, и общая оборона границ, которые больше не придётся делить ультиматумами.\n\nКейзан помнит, как печи Арбина, Сафира и Лорана пили воду кяризов и кто закрывал отводы. Делегация не скрывает этого: Хосров Арбин не подписывал письма, но его сын говорит от городов, и договор обещает, что спор о воде будут решать те, кто её пьёт, а не те, кто ею владеет. Общины сами называли шахрабадский металл платой за воду; договор предлагает вместо пайка общую ведомость, в которой у Кейзана столько же строк, сколько у Хазара.\n\nСтарейшины спрашивают, кто поведёт общую оборону и чьи отряды придут первыми, если чужие отряды перейдут границу общин. Ответ Шахрабада: стража Армана Теймура, а не гвардии домов. Вступить в договор - значит связать судьбу кяризов с судьбой печей. Отказать - значит остаться с Шахрабадом по разные стороны одной воды."
 ADISCORD_SHL.90.a: "Вступить в договор."
 ADISCORD_SHL.90.b: "Отказать."
 ADISCORD_SHL.91.t: "Союз Золотых ворот"
 ADISCORD_SHL.91.d: "Картель Золотых ворот предлагает Торговой палате Вейра стать членом союза: общий рынок будет защищён общей армией. Предложение привёз Рамин Фарзан, составил Голшан Лоран, а гарантировал Дарий Сафир; подпись Ферейдуна Кердана подтверждает, что дорога к морю открыта для палаты в обе стороны.\n\nПалата уже сидит за столом картеля и получает долю в вывозе металла. Союз добавляет к доле обязательство: отряды Вейра встанут рядом со стражей Шахрабада, если Кейзан или кто-то другой перейдёт общую границу, а гвардии Бехруза Вейрана будут защищать порты так же, как разъезды своего дома. Члены палаты спорят, стоит ли торговому городу армия соседа, и помнят, что Шахрабад недавно воевал за дорогу к морю.\n\nРамин Фарзан отвечает прямо: палата может торговать с Конклавом и без союза, но тогда в день войны порты будут защищать себя сами. Вступить в союз - значит стать частью Золотых ворот. Отказать - значит остаться их покупателем."
 ADISCORD_SHL.91.a: "Вступить в союз."
 ADISCORD_SHL.91.b: "Отказать."
 ADISCORD_SHL.92.t: "Союз заключён"
 ADISCORD_SHL.92.d: "Приглашение Шахрабада принято. Новый союзник будет защищать общие границы, а его отряды войдут в общий план обороны, который Арман Теймур уже разворачивает на столе Конклава. Рамин Фарзан подписал акт от имени Хазара и проследил, чтобы в нём стояли подписи всех, кто обещал войска, а не только тех, кто обещал деньги.\n\nДома приняли новость по-разному. Голшан Лоран и Дарий Сафир считают союз продолжением торговли; Бехруз Вейран - лишней обузой для гвардий, которым теперь придётся охранять чужие границы; Хосров Арбин и Камран Нур - первым за много лет случаем, когда Шахрабад говорит с соседом не через ультиматум. Мехран Арбин потребовал, чтобы собрания знали, за кого воюют их сыновья, и Амин Рашад внёс договор в открытый протокол.\n\nБахрам Каве передал в Хазар первые сводки от союзника. Общая граница стала длиннее, но за ней теперь стоят не только гвардии одного пограничного дома."
 ADISCORD_SHL.92.a: "Хорошо."
 ADISCORD_SHL.93.t: "Союз отклонён"
 ADISCORD_SHL.93.d: "Приглашение Шахрабада отклонено, либо союз больше невозможен: сосед выбрал другую сторону, стороны воюют или условия изменились до ответа. Рамин Фарзан привёз письмо, в котором благодарят за честь и желают Конклаву спокойных границ. Амин Рашад подшил его к делу рядом с предложением.\n\nБехруз Вейран не скрыл облегчения: гвардии дома останутся на своей границе, а не на чужой. Голшан Лоран и Дарий Сафир раздражены - торговля с соседом продолжается, но без общей армии каждая партия металла идёт через земли, которые никто не обязан защищать. Арман Теймур вернулся к старому плану обороны, где Шахрабад стоит один, и попросил Конклав хотя бы оплатить его.\n\nМехран Арбин заметил, что соседи помнят, как Шахрабад говорил с ними прежде, и одного письма недостаточно, чтобы это забыть. Переговоры можно возобновить позже, если обе стороны снова смогут выполнить обязательства. До тех пор общую границу держат только свои."
 ADISCORD_SHL.93.a: "Понятно."
