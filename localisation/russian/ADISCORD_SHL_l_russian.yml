 # ----- stage5_branches -----
 SHL_four_districts:0 "Четыре округа"
 SHL_four_districts_desc:0 "За девятью печными городами лежат четыре округа, которые Конклав десятилетиями считал дорогой, а не землёй: взморье Сафира, пески Лорана, копи Байрата и граница Вейрана. Амин Рашад впервые выносит их на стол отдельной ведомостью. Дома спорят, чьи это земли; писцы отвечают, что землю ещё предстоит сделать чьей-то."
 SHL_salt_pans_of_safir:0 "Солеварни Сафира"
 SHL_salt_pans_of_safir_desc:0 "На взморье Сафира соль собирали рыбацкие семьи, пока дом Сафир не заметил, сколько её уходит в Вейр без пошлины. Конклав выкупает участки, ставит выпарные бассейны и склады и нанимает тех же рыбаков уже за плату. Соль идёт в литейные кварталы и на рынки соседей раньше, чем кто-то спросит, кому принадлежало побережье."
 SHL_safir_customs:0 "Сафирская таможня"
 SHL_safir_customs_desc:0 "Торговая палата Вейра привыкла считать Сафирское взморье своей внешней гаванью. Таможенный пост Конклава с весами и печатями меняет привычку: каждая лодка платит Хазару, а не стеклянным портам. Голшан Лоран доволен цифрами; письма из Вейра становятся короче и холоднее."
 SHL_safir_smugglers:0 "Контрабандисты взморья"
 SHL_safir_smugglers_desc:0 "Ночные лодки давно возят на взморье топливо, минуя и вейрскую пошлину, и светлогорский контракт. Конклав предпочитает не замечать их, а договориться: причал в тихой бухте, молчание стражи и твёрдая цена за бочку. Бочки идут к печам без накладных, а в Хазаре шепчутся, что непрерывный огонь теперь горит и от чужих фонарей."
 SHL_safir_bandar_port:0 "Порт Сафир-бандар"
 SHL_safir_bandar_port_desc:0 "Рыбацкая бухта у мыса получает каменный мол, маяк и склады Конклава. Впервые металл Шахрабада уходит к морю не по дороге Кердана и не через вейрские порты, а с собственного причала. Дарий Сафир называет новый порт именем своего дома; смены, строившие мол, называют его просто бандаром."
 SHL_loran_cisterns:0 "Цистерны Лорана"
 SHL_loran_cisterns_desc:0 "Караванная дорога через пески Лорана держится на цепочке старых цистерн, половина которых пересохла при дедах нынешних владельцев. Конклав восстанавливает кладку, ставит водоподъёмники и назначает смотрителей. Там, где вода стоит в цистерне круглый год, дорога перестаёт быть риском, а бурение новых колодцев - чудом."
 SHL_desert_caravanserai:0 "Караван-сарай в песках"
 SHL_desert_caravanserai_desc:0 "На полпути между Хазаром и Зарханским округом вырастает каменный двор с конюшнями, складами и постоялым домом. Караваны из Кейзана, Мазара и дальних станций тракта останавливаются здесь, платят за воду и ночлег и оставляют новости. Лоран получает доход от каждого проходящего верблюда, а Конклав - уши в пустыне.\n\nВ конторах у рынка приказчик ведёт две книги. В одной стоят номера оружейных ящиков, в другой - печати винных погребов. Теперь обе книги лежат на одном прилавке."
 SHL_sand_patrols:0 "Дозоры песков"
 SHL_sand_patrols_desc:0 "Пески Лорана охраняли караванщики сами, пока не стали пропадать целые обозы. Конклав собирает из бывших проводников и заводской стражи постоянные дозоры с верблюдами и колодезными картами. Теперь между цистернами ходит не только торговля, но и власть Хазара.\n\nНа дорожных станциях ставят по второй коновязи. Пока одна упряжка отдыхает в тени, конюх выводит другую к воротам и передаёт возчику тёплую ещё лепёшку."
 SHL_loran_deh_growth:0 "Лоранские дехи"
 SHL_loran_deh_growth_desc:0 "Вокруг восстановленных цистерн возвращаются дехи - деревни, покинутые при высыхании воды. Семьи с окраин Хазара и из переполненных кварталов Шарима получают надел, дом и место в караванной службе. Пески Лорана перестают быть пустым местом на карте Конклава."
 SHL_bayrat_copi_survey:0 "Разведка Байратских копей"
 SHL_bayrat_copi_survey_desc:0 "Тахмурас Байрат добывал руду в тех же штольнях, что и его прадед, и не желал слышать о других. Изыскатели Конклава уходят дальше, в сухие ущелья за рудниками, с бурами и журналами. Первые пробы показывают, что дом Байрат сидел на краю жилы и не знал об этом."
 SHL_mine_colonies:0 "Рудничные посёлки"
 SHL_mine_colonies_desc:0 "Копи кормили сезонных рабочих, которые уходили в город с первым жаром. Конклав строит при штольнях постоянные посёлки с водой, лавками и школой для детей рудокопов. Семьи остаются, а вместе с ними остаётся и плавильный двор, которому больше не нужно возить руду через полпустыни."
 SHL_nomad_leases:0 "Аренда у кочевников"
 SHL_nomad_leases_desc:0 "Лучшие выходы руды лежат на землях, по которым кочевые роды гоняют стада со времён до Конклава. Вместо тяжбы Конклав предлагает аренду: ежегодную плату, право на воду и подпись старейшин под договором."
 SHL_copi_railway:0 "Рудничная ветка"
 SHL_copi_railway_desc:0 "От копей до печи Байрата руду везли вьюками и телегами по тракту, который размывал каждый ливень. Конклав прокладывает узкую рудничную ветку с разъездами и погрузочными эстакадами. Вагонетки идут к печи ночью, и Лейла Надири впервые видит в ведомости поставки руды без слова \"задержка\"."
 SHL_veyran_forts:0 "Вейранские форты"
 SHL_veyran_forts_desc:0 "Граница с Вейром держалась на частных гвардиях дома Вейран и на привычке соседей не ссориться всерьёз. Конклав ставит вдоль неё каменные форты с цистернами и складами, где стража может держаться, не оглядываясь на Хазар. Бехруз Вейран принимает ключи от фортов с тем лицом, с каким дом принимает чужие деньги на своей земле."
 SHL_border_watch:0 "Пограничная стража"
 SHL_border_watch_desc:0 "На границе служит тот, кому платит дом Вейран, и сколько их на самом деле, не знает даже Арман Теймур. Конклав получает право набирать собственную пограничную стражу из округа, вооружать её из арсеналов Хазара и ставить над ней своего начальника. Гвардии дома остаются; рядом с ними встаёт стража страны."
 SHL_border_market:0 "Пограничный базар"
 SHL_border_market_desc:0 "Там, где прежде стояли только дозоры, Конклав открывает еженедельный базар под охраной обеих сторон. Погонщики Вейра везут соль и рыбу стеклянных портов, купцы Вейрана - железо и ткани, и Торговая палата Вейра впервые берёт свою долю не сбором с вагонов, а торгом у границы. Пошлины с базара идут в Хазар, а разговоры о войне на границе становятся тише."
 SHL_veyran_kala:0 "Вейранская кала"
 SHL_veyran_kala_desc:0 "Старая глинобитная крепость на перекрёстке пограничных дорог получает новые стены, склады и мастерские. Кала становится опорой для всего, что движется вдоль границы: обозов, стражи, караванов и почты Конклава. Отсюда войну на границе можно вести и кормить, не оглядываясь на Хазар."
 SHL_desert_assembly:0 "Собрание пустыни"
 SHL_desert_assembly_desc:0 "Четыре округа присылают в Хазар своих представителей: солеваров, смотрителей цистерн, рудокопов и пограничников. Собрание пустыни заседает не под гербами, а в зале ведомостей, и говорит о дорогах, воде и ценах. Конклав впервые слышит, что у страны есть земля за пределами девяти городов, и у этой земли есть голос."
 SHL_chancery_of_the_gate:0 "Канцелярия Ворот"
 SHL_chancery_of_the_gate_desc:0 "Внешними делами Шахрабада занимались торговые дома, каждый со своими посланниками и своими обещаниями. Рамин Фарзан получает отдельную канцелярию у Золотых ворот с писцами, переводчиками и печатью Конклава. Теперь соседям пишет страна, а не чей-то герб, и ответы приходят на один адрес.\n\nУ ворот бухтуют верёвки и сушат парусину. Из Фады пришло письмо с оттисками ярмарочных старост, а на полях кто-то старательно нарисовал въезд во двор, где принимают шахрабадские обозы."
 SHL_damir_road:0 "Дамирская дорога"
 SHL_damir_road_desc:0 "Между Сафиром и эфлорским Дамиром лежит старый караванный путь, который обе стороны годами чинили поочерёдно и неохотно. Конклав предлагает Эфлору общую дорожную службу: мосты через сухие русла, станции с водой, единые пошлины. Республика Единой Земли отвечает согласием, потому что дорога ведёт к её собственному городу."
 SHL_eflor_investment:0 "Эфлорские вложения"
 SHL_eflor_investment_desc:0 "Канцелярия Ворот предлагает Эфлору то, чего не предлагал ни один дом: долю в сафирском заводе в обмен на эфлорские деньги. Для республики, запертой между пустыней и собственными границами, это выход к литейным дворам Юга. Для Конклава - первый случай, когда чужая казна строит в Шахрабаде."
 SHL_damir_customs:0 "Дамирская пошлина"
 SHL_damir_customs_desc:0 "Дамирская дорога может быть общей, а может быть источником дохода. Конклав ставит у Сафира таможенный двор и берёт с каждого эфлорского каравана пошлину за въезд на земли Лиги. Казна Хазара довольна; в Дамире вспоминают, что Эфлор чинил эту дорогу своими руками."
 SHL_eflor_accord:0 "Соглашение с Эфлором"
 SHL_eflor_accord_desc:0 "Рамин Фарзан везёт в Эфлор большой договор: Конклав оплачивает участие республики в развитии Сафирского взморья, а эфлорские подрядчики строят на побережье заводы, которых у Шахрабада не хватает. Это соглашение равных, где каждая сторона платит и получает. Подпись Эфлора под ним стоит дорого, но дороже стоит берег без заводов."
 SHL_fuel_ledger:0 "Топливная ведомость"
 SHL_fuel_ledger_desc:0 "Топливо для печей закупали дома по отдельности, и Светлогорье знало цену каждого. Лейла Надири сводит закупки в одну ведомость, а Конклав строит в Хазаре общее хранилище. Когда покупатель один и запасы его известны ему самому, торговаться с Севером становится проще."
 SHL_nam_fuel_treaty:0 "Договор о топливе"
 SHL_nam_fuel_treaty_desc:0 "Канцелярия Ворот предлагает Светлогорью долгосрочный договор: твёрдые объёмы, твёрдая цена и обязательство Конклава не искать топливо у контрабандистов. Наместник Севера видит в этом надёжного покупателя; Конклав - цену, которую не меняют каждый цикл. Обе стороны подписывают его, хорошо помня, сколько стоит нефтяной пояс."
 SHL_own_distillery:0 "Собственная перегонка"
 SHL_own_distillery_desc:0 "Инженеры Дарбана давно утверждают, что печи можно кормить не только светлогорской нефтью. Конклав строит в Хазаре перегонный завод, который делает топливо из того, что пустыня даёт сама. Севера это не заменит, но каждая бочка своего топлива - это бочка, за которую не платят наместнику."
 SHL_northern_road:0 "Северная дорога"
 SHL_northern_road_desc:0 "Дорога от Хазара через Зарханский округ к северу была караванной тропой, а не путём для обозов. Конклав расширяет её, ставит станции и мосты и впервые делает возможным движение колонн в оба направления. Светлогорье замечает, что дорога ведёт к нему, и не знает, радоваться ли этому.\n\nСветлогорские портовики прислали хартию, завёрнутую в просмолённую ткань. На последней странице рядом с печатью Конклава оставлено место для подписи старшего у причальных весов."
 SHL_table_of_treaties:0 "Стол договоров"
 SHL_table_of_treaties_desc:0 "Старый спор с соседом закрыт грамотой, и Канцелярия Ворот ставит в зале Конклава отдельный стол, где лежат подписанные грамоты. Стол договоров напоминает домам, что сосед может быть не только истцом или добычей. Кварталы читают грамоты на стенах и впервые верят, что война с Кейзаном или Вейром не обязательна."
 SHL_kyz_communities_seat:0 "Кресло арычных общин"
 SHL_kyz_communities_seat_desc:0 "Спор о кяризах закрыт, и Конклав приглашает Собрание арычных общин держать в Хазаре постоянного представителя с правом голоса по вопросам воды. Для общин это признание, какого они не видели от соседей; для Шахрабада - люди, которые знают, где под песком течёт вода. Семьи из Кейзана переселяются к западным печам, где всегда не хватало рук."
 SHL_veyr_glass_contract:0 "Стеклянный контракт"
 SHL_veyr_glass_contract_desc:0 "Спор о дороге к морю решён, и Торговая палата Вейра предлагает то, за чем изначально шла: долгий контракт на металл в обмен на стекло, страхование грузов и место в своих портах. Голшан Лоран подписывает его от имени картеля. Кердан получает дорогу без шлагбаумов, Вейр - сталь без войны."
 SHL_southern_customs_union:0 "Южный таможенный союз"
 SHL_southern_customs_union_desc:0 "Канцелярия Ворот собирает соседей на общую таможенную конференцию: единые пошлины, общие весы, признанные печати. Союз не требует ни подданства, ни войска - только согласия торговать по одним правилам. Картель Золотых ворот получает рынки, до которых прежде не доезжали караваны."
 SHL_voice_of_the_south:0 "Голос Юга"
 SHL_voice_of_the_south_desc:0 "Договоры, посольства и округа складываются в то, чего у Шахрабада не было: внешнюю политику. Канцелярия Ворот говорит от имени всей пустыни, и соседи слушают, потому что за словами стоят дороги, товар и стража. Светлогорье впервые получает из Хазара письмо, написанное как равному."
 SHL_written_fire:0 "Записанный огонь"
 SHL_written_fire_desc:0 "Закон непрерывного огня передавали устно: мастер мастеру, глава дома наследнику. Конклав поручает писцам записать обычаи печей, права домов и обязанности смен в единую книгу. Записанное можно читать, спорить с ним и учить по нему детей; устное принадлежало только тем, кто помнил."
 SHL_archive_of_the_conclave:0 "Архив Конклава"
 SHL_archive_of_the_conclave_desc:0 "Чертежи печей, журналы плавок и ремонтные ведомости за сто лет лежали в сундуках девяти домов. Конклав собирает их в общий архив при Золотых воротах с хранителями и каталогом. Инженер, который прежде начинал с чистого листа, теперь начинает с опыта девяти поколений."
 SHL_masters_university:0 "Университет мастеров"
 SHL_masters_university_desc:0 "Школа мастеров учила тому, что нужно печи сегодня. Университет при Девятипечье учит тому, что понадобится печи завтра: металлургии, механике, химии топлива. Дома посылают туда младших сыновей, кварталы - лучших учеников, и впервые они сидят на одной скамье."
 SHL_apprentice_decree:0 "Указ об учениках"
 SHL_apprentice_decree_desc:0 "Ученичество при печах было делом семьи и дома: мастер брал кого хотел и учил чему хотел. Указ Конклава делает подготовку государственной: технические классы при каждой печи, общий экзамен, свидетельство с печатью. Мастера ворчат, что бумага не заменит руки; к концу года их классы переполнены."
 SHL_engineers_of_the_tenth:0 "Инженеры десятой печи"
 SHL_engineers_of_the_tenth_desc:0 "Инженерное товарищество, строящее десятую печь, получает от Конклава признание и постоянное содержание. Его мастера больше не наёмники, а служба страны с правом требовать от домов чертежи и доступ к цехам. Десятая печь становится не только спором о власти, но и школой для всех остальных."
 SHL_heralds_press:0 "Печатня глашатаев"
 SHL_heralds_press_desc:0 "Новости в Шахрабаде разносили глашатаи домов, и каждый дом слышал свои. Конклав ставит у Золотых ворот печатню, которая выпускает листки для всех кварталов разом. Теперь город узнаёт о плавках, ценах и решениях из одного источника и спорит об одном и том же."
 SHL_open_press:0 "Открытая печать"
 SHL_open_press_desc:0 "Печатня принимает листки от кого угодно: советов смен, городских собраний, недовольных домов. Конклав отказывается читать их до выхода и отвечает только на то, что уже напечатано. Кварталы получают голос, гербы - повод для жалоб, а посредник - больше правды о своей стране, чем ему хотелось бы."
 SHL_conclave_bulletins:0 "Бюллетени Конклава"
 SHL_conclave_bulletins_desc:0 "Печатня выпускает только то, что подписал секретарь Конклава: бюллетени о плавках, решениях и наградах. Амин Рашад называет это порядком, Салим Дарзи - цензурой, и оба правы. Город читает одну версию событий и знает, чья она."
 SHL_chronicle_of_the_south:0 "Хроника Юга"
 SHL_chronicle_of_the_south_desc:0 "Хранители архива принимаются за второй том Книги печей: не об обычаях, а о событиях, не о домах, а о стране. Хроника записывает споры, войны и договоры такими, какими их видели в Хазаре. Народ, у которого есть собственная история, иначе смотрит на соседей и на собственное будущее."
 SHL_law_of_the_written_fire:0 "Закон записанного огня"
 SHL_law_of_the_written_fire_desc:0 "Книга печей, архив, университет и печатня становятся частью закона: Конклав признаёт записанное знание основанием права наравне с горящей печью. Дом, который не ведёт журналов, теряет голос так же, как дом с погасшим огнём. Шахрабад, который умел только лить металл, учится помнить."
 SHL_regency_of_crests:0 "Регентство гербов"
 SHL_regency_of_crests_desc:0 "Дарий Сафир предлагает Конклаву не бунт, а порядок: вернуть печи домам, гвардии - гербам, а власть - тому, кто её оплачивает. Ночь гербов уже показала, что дома могут действовать вместе. Регентство предлагается как временная мера, и все в зале понимают, что значит это слово."
 SHL_commune_of_shift_councils:0 "Коммуна советов смен"
 SHL_commune_of_shift_councils_desc:0 "Советы смен держат печи горящими, пока Конклав спорит, и однажды спрашивают, зачем им Конклав. Салим Дарзи приносит в зал решение советов: печи - тем, кто у них стоит, власть - тем, кого выбрали смены. Холодная стачка показала, что у советов есть сила; коммуна - это сила, записанная в закон."
 SHL_four_districts_tt:0 "Открываются четыре колонки округов: §YСафирское взморье§!, §YЛоранские пески§!, §YБайратские копи§! и §YВейранская граница§!."
 SHL_cycle_income_plus_5_tt:0 "§G+5§! £ADISCORD_economy_treasury_texticon за цикл печей"
 SHL_cycle_income_plus_8_tt:0 "§G+8§! £ADISCORD_economy_treasury_texticon за цикл печей"
 SHL_cycle_income_plus_10_tt:0 "§G+10§! £ADISCORD_economy_treasury_texticon за цикл печей"
 SHL_cycle_income_plus_12_tt:0 "§G+12§! £ADISCORD_economy_treasury_texticon за цикл печей"
 SHL_cycle_income_minus_5_tt:0 "§R-5§! £ADISCORD_economy_treasury_texticon за цикл печей"
 SHL_sand_patrols_tt:0 "В Лоранских песках встаёт §Y1§! гарнизонная дивизия дозоров."
 SHL_wells_discount_tt:0 "Артезианские скважины дешевле на §G50§! £ADISCORD_economy_treasury_texticon."
 SHL_smuggler_fuel_tt:0 "Цена пакета сырья: §G-5§! £ADISCORD_economy_treasury_texticon."
 SHL_reserve_discount_tt:0 "Цена аварийного резерва: §G-5§! £ADISCORD_economy_treasury_texticon."
 SHL_fuel_treaty_tt:0 "Светлогорье получает предложение договора о топливе. При согласии цена пакета сырья §G-10§! £ADISCORD_economy_treasury_texticon, пока нет эмбарго и войны между странами."
 SHL_distillery_fuel_tt:0 "Цена пакета сырья: §G-5§! £ADISCORD_economy_treasury_texticon."
 SHL_convoy_discount_tt:0 "Залог походного обоза: §G-30§! £ADISCORD_economy_treasury_texticon."
 SHL_engineers_discount_tt:0 "Инженерное товарищество десятой печи дешевле на §G25%§!."
 SHL_metal_clients_plus_tt:0 "Картель может держать ещё §G+1§! договор на поставку металла."
 SHL_book_second_volume_tt:0 "Открывается второй том Книги печей."
 SHL_voice_of_the_south_tt:0 "Южные соседи получают известие о голосе Юга."
 SHL_eflor_investment_tt:0 "Эфлор получает предложение вложений. При согласии в Сафире начинается строительство §G+1§! гражданской фабрики, а Эфлор получает §G+60§! £ADISCORD_economy_treasury_texticon."
 SHL_eflor_accord_tt:0 "Казна платит §Y80§! £ADISCORD_economy_treasury_texticon. При согласии Эфлора на Сафирском взморье начинается строительство §G+2§! гражданских фабрик; при отказе деньги возвращаются."
 SHL_eflor_accord_price_tt:0 "В казне есть §Y80§! £ADISCORD_economy_treasury_texticon"
 SHL_treaty_closed_tt:0 "Закрыт хотя бы один спор с Кейзаном или Вейром: договором, братством, союзом, победой или перемирием. Ограничение водозабора тремя печами также закрывает спор."
 SHL_kyz_settled_tt:0 "Подписан договор \"вода за металл\", заключено братство кяризов или Кейзан побеждён"
 SHL_glp_settled_tt:0 "Заключён союз с Вейром, достроена собственная гавань или Вейр побеждён"
 SHL_regency_entry_tt:0 "Идёт кризис гербов, и гербы преобладают в балансе Конклава"
 SHL_commune_entry_tt:0 "Идёт кризис кварталов, и кварталы преобладают в балансе Конклава"

 # ----- stage5_script -----
 SHL_prospect_copi:0 "Разведать Байратские копи"
 SHL_prospect_copi_desc:0 "Изыскатели Конклава уходят за рудники Байрата с бурами, вьючными верблюдами и журналами проб. Они ночуют в сухих ущельях и возвращаются с мешками породы, которую плавильщики Дарбана проверяют на хром."
 SHL_prospect_copi_tt:0 "Через §Y70§! дней: §G+3§! £resources_strip|6 в Байратских копях. Разведку можно оплатить не более двух раз."
 SHL_cost_copi:0 "§Y120§! £ADISCORD_economy_treasury_texticon"
 SHL_cost_copi_blocked:0 "§R120§! £ADISCORD_economy_treasury_texticon"
 SHL_cost_copi_tooltip:0 "§Y120§! £ADISCORD_economy_treasury_texticon\nЦена списывается при выборе и возвращается при отмене."
 SHL_raise_border_watch:0 "Поднять пограничную стражу"
 SHL_raise_border_watch_desc:0 "Начальник пограничной стражи объявляет набор по дехам и фортам Вейранской границы. Новобранцы получают оружие из арсеналов Хазара и учатся держать строй рядом с гвардиями дома Вейран. Стража служит стране, а не гербу, и Бехрузу Вейрану напоминают об этом чаще, чем ему хотелось бы."
 SHL_raise_border_watch_tt:0 "Через §Y30§! дней на Вейранской границе встаёт §Y1§! гарнизонная дивизия. Если округ будет потерян раньше, цена вернётся."
 SHL_trade_mission:0 "Торговая миссия: [FROM.GetName]"
 SHL_trade_mission_desc:0 "Канцелярия Ворот отправляет к соседу торговую миссию: писца с печатью Конклава, двух купцов картеля и образцы металла в кожаных футлярах. Миссия живёт при чужом дворе, торгуется о пошлинах, слушает жалобы и обещает передать их в Хазар."
 SHL_trade_mission_tt:0 "Через §Y30§! дней: мнение §G+15§! в обе стороны. Следующую миссию к этому соседу можно отправить через §Y90§! дней."
 ADISCORD_SHL.150.t:0 "Вложения из Хазара"
 ADISCORD_SHL.150.d:0 "Посланник Канцелярии Ворот приехал в столицу по Дамирской дороге и привёз предложение, которого от Шахрабада никто не ждал. Конклав печей зовёт республику вложить казну в сафирский завод: наши деньги строят литейный двор в области Сафир, наши подрядчики получают долю в заказах, а Хазар признаёт Эфлор партнёром, а не покупателем. Посланник Рамин Фарзан говорит ровно, без торговых уловок, и ссылается на дорогу, которую обе страны чинили вместе.\n\nМинистерства разошлись во мнениях. Казначейство видит в этом вывод денег из республики в чужой город, где девять домов привыкли делить доходы между собой. Торговое ведомство напоминает, что Дамир живёт караванами и что доля в шахрабадском заводе - первый выход республики к литейным дворам Юга. Партия Единой Земли требует, чтобы границы и подчинение центру не пострадали; посланник отвечает, что речь идёт о заводе, а не о границе.\n\nДеньги уйдут сразу, завод будет строиться не один цикл, а доля в заказах зависит от того, насколько честно Конклав станет вести общую ведомость. Шахрабад ждёт ответа до отъезда посланника."
 ADISCORD_SHL.150.a:0 "Вложить казну."
 ADISCORD_SHL.150.b:0 "Дамир обойдётся своими караванами."
 ADISCORD_SHL.151.t:0 "Соглашение о взморье"
 ADISCORD_SHL.151.d:0 "Второе письмо из Хазара короче первого и дороже. Конклав печей предлагает республике соглашение о Сафирском взморье: Шахрабад оплачивает участие Эфлора и переводит деньги вперёд, а эфлорские подрядчики возводят на побережье заводы под общим управлением. Деньги уже лежат у нашего посла в Хазаре; Рамин Фарзан просит только подпись и инженеров.\n\nДля республики это непривычная роль. Эфлор привык строить у себя и защищать то, что построил; теперь его бригады поедут на чужой берег, под чужую стражу, к людям, у которых право голоса определяется дымом над печью. Казначейство довольно суммой, армия спрашивает, кто будет охранять подрядчиков, а Партия Единой Земли требует, чтобы в соглашении не было ни слова о границах.\n\nОтказ вернёт Шахрабаду его деньги и оставит взморье без заводов. Согласие связывает республику с Югом надолго: заводы на чужом берегу не вывезешь обратно, и Конклав это понимает не хуже нас."
 ADISCORD_SHL.151.a:0 "Подписать соглашение."
 ADISCORD_SHL.151.b:0 "Эфлор строит только на своей земле."
 ADISCORD_SHL.152.t:0 "Эфлор отказал"
 ADISCORD_SHL.152.d:0 "Ответ из Эфлора пришёл по той же Дамирской дороге, по которой уезжал посланник. Республика благодарит Конклав за внимание и отказывается: казна Эфлора остаётся в Эфлоре, подрядчики - на своей земле, а Дамир будет жить караванами, как жил. Рамин Фарзан прочитал письмо вслух в Канцелярии Ворот и положил его в папку, где уже лежали отказы Кейзана и Вейра.\n\nДарий Сафир считает, что предлагать нужно было больше. Мехран Арбин напоминает, что Партия Единой Земли не доверяет никому за своей границей и что дело не в сумме. Лейла Надири записала несостоявшееся соглашение отдельной строкой: деньги, если они были отложены, вернулись в казну, а сафирский берег остался таким, каким был.\n\nДорога в Эфлор открыта, и канцелярия может вернуться к разговору позже. Пока же взморье придётся строить своими руками."
 ADISCORD_SHL.152.a:0 "Построим сами."
 ADISCORD_SHL.153.t:0 "Пакеты для печей"
 ADISCORD_SHL.153.d:0 "Канцелярия Ворот Шахрабада прислала в столицу проект договора о топливе. Конклав печей предлагает покупать топливо для своих печей на твёрдых условиях: постоянные объёмы, цена ниже той, что платят случайные покупатели, и обязательство Хазара не искать топливо у контрабандистов взморья. Посланник Рамин Фарзан просит ответа до конца месяца и не скрывает, что дома устали от цены, которая меняется каждый цикл.\n\nДля Севера это надёжный покупатель на годы вперёд. Печи Шахрабада горят непрерывно, и каждый их цикл - это бочки, оплаченные вперёд, а не обещания. Распорядители промыслов замечают и другое: единый покупатель с единой ведомостью торгуется твёрже девяти домов, а твёрдая цена связывает руки, если однажды придётся давить на Хазар эмбарго.\n\nДоговор действует, пока между странами нет войны и Север не закрывает отводы. Он не мешает ни одной стороне готовиться к чему угодно; он только делает первый шаг дороже."
 ADISCORD_SHL.153.a:0 "Подписать договор о топливе."
 ADISCORD_SHL.153.b:0 "Цену назначает Север."
 ADISCORD_SHL.154.t:0 "Светлогорье отказало"
 ADISCORD_SHL.154.d:0 "Ответ Севера пришёл без подписи. Светлогорье благодарит Конклав за предложение и сообщает, что цену на топливо устанавливают промыслы, а не покупатели, и что постоянный договор с одним городом не в интересах нефтяного пояса. Рамин Фарзан передал письмо Лейле Надири, и та сложила его к ведомости закупок, в которой цена пакета осталась прежней.\n\nГолшан Лоран предлагает покупать у контрабандистов открыто, раз Север не хочет торговать честно. Рауф Дарбан напоминает о собственной перегонке и о том, что каждая бочка своего топлива - аргумент в следующем разговоре. Амин Рашад записал в протокол, что Светлогорье впервые отказало Шахрабаду как равному, и это тоже результат.\n\nПечи горят на том топливе, которое есть. Канцелярия Ворот может вернуться к договору, когда у Хазара будет что положить на стол рядом с подписью."
 ADISCORD_SHL.154.a:0 "Печи горят и без договора."
 ADISCORD_SHL.155.t:0 "Подпись соседа"
 ADISCORD_SHL.155.d:0 "[FROM.GetName] принял предложение Конклава. Посланник вернулся в Хазар с подписанным экземпляром, и Рамин Фарзан положил его на стол договоров рядом с грамотами, которых прежде было немного. Канцелярия Ворот впервые довела до подписи соглашение, которое предлагала страна, а не отдельный дом, и соседи это заметили.\n\nЛейла Надири перенесла условия в ведомость: что Шахрабад платит, что получает и с какого цикла. Дарий Сафир спросил, кто будет следить за исполнением; Амин Рашад ответил, что та же канцелярия, которая писала письмо. Мехран Арбин напомнил, что подпись соседа стоит ровно столько, сколько наше поведение после неё, и никто в зале не возразил.\n\nУсловия соглашения вступают в силу. Пока обе стороны их соблюдают, у Шахрабада на одного соседа меньше, с которым нужно говорить через стражу."
 ADISCORD_SHL.155.a:0 "Внести соглашение в ведомость."
 ADISCORD_SHL_news.9.t:0 "Шахрабад: голос Юга"
 ADISCORD_SHL_news.9.d:0 "Из Хазара сообщают: Конклав Шахрабада объявил, что внешними делами Лиги отныне ведает Канцелярия Ворот, а не торговые дома. Рамин Фарзан зачитал под куполом Золотых ворот список соглашений, заключённых от имени страны: дорожные договоры, торговые миссии, таможенные конференции и посольства, открытые в соседних столицах. Прежде соседи получали из Шахрабада письма девяти гербов; теперь они получают одно письмо с одной печатью.\n\nЗа канцелярией стоят четыре округа, которых прежде не было на карте Конклава: взморье Сафира с собственным причалом, пески Лорана с восстановленными цистернами, копи Байрата и форты Вейранской границы. Хазар говорит от имени всей пустыни, и у его слов появилась земля.\n\nКейзан, Вейр, Мазар и Эфлор получили извещения в один день. Светлогорье отметило, что письмо из Хазара написано как равному, и не торопится с ответом."
 ADISCORD_SHL_news.9.a:0 "Юг слушает."
