 SHL_favour_arbin_gui: "Мастера кяризов: §Y15§! верности, §Y40§! £ADISCORD_economy_treasury_texticon"
 SHL_favour_safir: "Кошелёк дома Сафир"
 SHL_favour_safir_desc: "Дарий Сафир подписывает заём под имя своего дома. Банкиры Хазара не спрашивают залога: имя Сафиров само по себе залог."
 SHL_favour_safir_tt: "Дом Сафир: верность §R-20§!.\nКазна §G+120§! £ADISCORD_economy_treasury_texticon.\nСледующая услуга дома - через §Y168§! дней."
 SHL_cost_favour_safir: "§Y25§! £political_power_texticon"
 SHL_cost_favour_safir_blocked: "§R25§! £political_power_texticon"
 SHL_cost_favour_safir_tooltip: "§Y25§! £political_power_texticon\nЦена списывается при выборе."
 SHL_favour_safir_gui: "Кошелёк Сафира: §Y20§! верности, §Y25§! £political_power_texticon"
 SHL_favour_loran: "Ярмарка Золотых ворот"
 SHL_favour_loran_desc: "Голшан Лоран открывает ворота своего двора для купцов с побережья. За один день металл Шахрабада меняет столько рук, сколько обычно меняет за сезон."
 SHL_favour_loran_tt: "Дом Лоран: верность §R-15§!.\nКаждая горящая печь, продающая металл на экспорт: казна §G+30§! £ADISCORD_economy_treasury_texticon.\nСледующая услуга дома - через §Y168§! дней."
 SHL_favour_loran_open_tt: "Хотя бы одна горящая печь продаёт металл на экспорт"
 SHL_cost_favour_loran: "§Y20§! £political_power_texticon"
 SHL_cost_favour_loran_blocked: "§R20§! £political_power_texticon"
 SHL_cost_favour_loran_tooltip: "§Y20§! £political_power_texticon\nЦена списывается при выборе."
 SHL_favour_loran_gui: "Ярмарка Лорана: §Y15§! верности, §Y20§! £political_power_texticon"
 SHL_favour_nur: "Посредники дома Нур"
 SHL_favour_nur_desc: "Камран Нур едет туда, где обида глубже всего. Он не обещает ничего от имени Конклава, но умеет слушать так, что хозяева сами находят, чем закончить спор."
 SHL_favour_nur_tt: "Дом Нур: верность §R-10§!.\nДом, покинувший зал, а если такого нет - наименее верный другой дом на землях Шахрабада: верность §G+20§!.\nСледующая услуга дома - через §Y168§! дней."
 SHL_favour_nur_open_tt: "Верность другого дома на землях Шахрабада ниже §Y80§!"
 SHL_cost_favour_nur: "§Y30§! £political_power_texticon"
 SHL_cost_favour_nur_blocked: "§R30§! £political_power_texticon"
 SHL_cost_favour_nur_tooltip: "§Y30§! £political_power_texticon\nЦена списывается при выборе."
 SHL_favour_nur_gui: "Посредники Нура: §Y10§! верности, §Y30§! £political_power_texticon"
 SHL_favour_bayrat: "Руда дома Байрат"
 SHL_favour_bayrat_desc: "Тахмурас Байрат открывает свои отвалы. Возчики дома знают, у какой печи склад пуст, раньше, чем об этом узнаёт Конклав."
 SHL_favour_bayrat_tt: "Дом Байрат: верность §R-15§!.\nОбоз развозит 3 £SHL_packet_texticon. Каждая поставка идёт к горящей печи с наименьшим запасом.\nСледующая услуга дома - через §Y168§! дней."
 SHL_favour_bayrat_open_tt: "Склад хотя бы одной горящей печи меньше §Y3§! £SHL_packet_texticon"
 SHL_cost_favour_bayrat: "§Y30§! £ADISCORD_economy_treasury_texticon"
 SHL_cost_favour_bayrat_blocked: "§R30§! £ADISCORD_economy_treasury_texticon"
 SHL_cost_favour_bayrat_tooltip: "§Y30§! £ADISCORD_economy_treasury_texticon\nЦена списывается при выборе."
 SHL_favour_bayrat_gui: "Руда Байрата: §Y15§! верности, §Y30§! £ADISCORD_economy_treasury_texticon"
 SHL_favour_kerdan: "Морская дорога дома Кердан"
 SHL_favour_kerdan_desc: "Ферейдун Кердан отправляет в Вейр собственный обоз с серебром. Таможенники стеклянных портов считают монеты дважды и пропускают металл Шахрабада без вопросов."
 SHL_favour_kerdan_tt: "Дом Кердан: верность §R-15§!.\nДве следующие плавки всех печей не платят сбор Вейра: удержание с каждой печи на §G5§! £ADISCORD_economy_treasury_texticon меньше.\nСледующая услуга дома - через §Y168§! дней."
 SHL_favour_kerdan_open_tt: "Вейр взимает сбор, и дом Кердан ещё не оплатил его"
 SHL_cost_favour_kerdan: "§Y40§! £ADISCORD_economy_treasury_texticon"
 SHL_cost_favour_kerdan_blocked: "§R40§! £ADISCORD_economy_treasury_texticon"
 SHL_cost_favour_kerdan_tooltip: "§Y40§! £ADISCORD_economy_treasury_texticon\nЦена списывается при выборе."
 SHL_favour_kerdan_gui: "Дорога Кердана: §Y15§! верности, §Y40§! £ADISCORD_economy_treasury_texticon"
 SHL_favour_sharim: "Тяжёлые смены дома Шарим"
 SHL_favour_sharim_desc: "Ширин Шарим посылает своих старших сменных туда, где печь работает тяжелее всего. Они учат молодых не геройству, а тому, как пережить смену."
 SHL_favour_sharim_tt: "Дом Шарим: верность §R-15§!.\nСамая изношенная горящая печь с обучением ниже 2: обучение смены §G+1§!.\nНедовольство кварталов §G-5§!.\nСледующая услуга дома - через §Y168§! дней."
 SHL_favour_sharim_open_tt: "Обучение хотя бы одной горящей печи ниже §Y2§!"
 SHL_cost_favour_sharim: "§Y50§! £ADISCORD_economy_treasury_texticon"
 SHL_cost_favour_sharim_blocked: "§R50§! £ADISCORD_economy_treasury_texticon"
 SHL_cost_favour_sharim_tooltip: "§Y50§! £ADISCORD_economy_treasury_texticon\nЦена списывается при выборе."
 SHL_favour_sharim_gui: "Смены Шарим: §Y15§! верности, §Y50§! £ADISCORD_economy_treasury_texticon"
 SHL_favour_darban: "Инженеры дома Дарбан"
 SHL_favour_darban_desc: "Рауф Дарбан приводит инженеров Девятипечья. Они разбирают худшую кладку до основания и кладут её заново, не останавливая соседних печей."
 SHL_favour_darban_tt: "Дом Дарбан: верность §R-15§!.\nСамая изношенная горящая печь: износ §G-30§!.\nСледующая услуга дома - через §Y168§! дней."
 SHL_cost_favour_darban: "§Y40§! £ADISCORD_economy_treasury_texticon"
 SHL_cost_favour_darban_blocked: "§R40§! £ADISCORD_economy_treasury_texticon"
 SHL_cost_favour_darban_tooltip: "§Y40§! £ADISCORD_economy_treasury_texticon\nЦена списывается при выборе."
 SHL_favour_darban_gui: "Инженеры Дарбана: §Y15§! верности, §Y40§! £ADISCORD_economy_treasury_texticon"
 SHL_favour_veyran: "Гвардия дома Вейран"
 SHL_favour_veyran_desc: "Бехруз Вейран снимает с границы одну из своих застав. Люди приходят со своими винтовками и своими песнями и становятся под знамя печей."
 SHL_favour_veyran_tt: "Дом Вейран: верность §R-20§!.\nОдна дивизия ополчения печей в [295.GetName]; если район не под нашим контролем - в Хазаре или другом нашем коренном районе.\nСледующая услуга дома - через §Y168§! дней."
 SHL_cost_favour_veyran: "§Y60§! £ADISCORD_economy_treasury_texticon"
 SHL_cost_favour_veyran_blocked: "§R60§! £ADISCORD_economy_treasury_texticon"
 SHL_cost_favour_veyran_tooltip: "§Y60§! £ADISCORD_economy_treasury_texticon\nЦена списывается при выборе."
 SHL_favour_veyran_gui: "Гвардия Вейрана: §Y20§! верности, §Y60§! £ADISCORD_economy_treasury_texticon"
 SHL_house_ledgers: "Книги домов"
 SHL_house_ledgers_desc: "Писцы переносят в отдельные книги долги, обиды и услуги каждого из девяти домов. Конклав впервые видит, кто кому обязан и с кем из глав можно говорить напрямую."
 SHL_house_ledgers_tt: "На карточках печей открываются услуги девяти домов: дом с верностью не ниже §Y60§! раз в §Y168§! дней оказывает услугу за часть своей верности."
 SHL_house_ledgers_loyalty_tt: "Верность каждого дома: §G+8§! (давление гербов §G-8§!)."
# ----- Limited border wars: focuses, fronts, terms and return of districts -----
 SHL_border_foundries: "Пограничные литейни"
 SHL_border_foundries_desc: "Печи на границе с Кейзаном и Вейром первыми слышат чужие караулы. Их мастера откладывают заказы домов и льют полевые орудия, которые можно выкатить прямо с литейного двора на гребень у дороги."
 SHL_border_foundries_unlock_tt: "Батареи у границы ставят печи Арбина, Сафира и Лорана во время войны с Кейзаном, печи Шарима и Вейрана - во время войны с Вейром."
 SHL_siege_founders: "Осадные литейщики"
 SHL_siege_founders_desc: "Литейщики Арбина вспоминают ремесло, которое их деды берегли для войн за колодцы: тяжёлые стволы на песчаных лафетах и ядра, от которых трескаются глинобитные стены. Нур отдаёт им лучшие формы Девятипечья и запрещает выносить их чертежи за ворота."
 SHL_siege_founders_battery_tt: "Каждая батарея у границы даёт ещё §G+12§! £ADISCORD_artillery_texticon, а её обстрел выводит из строя и военные заводы соседнего округа."
 SHL_furnace_garrisons: "Гарнизоны печей"
 SHL_furnace_garrisons_desc: "У стен каждой печи встают караулы, которые не уходят на марш и не продаются домам. Мастера роют окопы между шлаковыми отвалами, а жители кварталов приносят солдатам хлеб из той же пекарни, что кормит смену."
 SHL_furnace_garrisons_watch_tt: "Конклав сразу выставляет §Y2§! дивизии пограничной стражи: в песках Лорана и на границе Вейрана (в столице, если округ потерян)."
 SHL_furnace_garrisons_terms_tt: "Ни перемирие, ни условия победившего соседа не могут отнять у Шахрабада округ с печью."
 SHL_border_settlement_office: "Палата пограничных договоров"
 SHL_border_settlement_office_desc: "В Хазаре открывается палата, где пишут не приказы, а договоры о границе. Писари сверяют старые межевые камни с картами караванщиков, и послы соседей впервые приходят не к главам домов, а к одному столу Конклава."
 SHL_border_settlement_office_tt: "Верность каждого дома: §G+10§! (давление гербов §G-10§!).\nПересмотр претензий соседа: §Y90§! £ADISCORD_economy_treasury_texticon вместо §Y150§!.\nПредложение о возврате уступленного округа приходит через §Y180§! дней вместо §Y365§!, выкуп стоит §Y200§! £ADISCORD_economy_treasury_texticon вместо §Y250§!.\nВыплаты контрибуции больше не снижают верность домов."
 SHL_border_war_dynamic: "Ограниченная война: фронты"
 SHL_kyz_front_hold: "Фронт Кейзана: цели в наших руках"
 SHL_kyz_front_hold_desc: "Караулы Конклава стоят у головных колодцев, и каждое утро гонцы сверяют, чьи флаги висят над водоводами. Старейшины общин ещё надеются отбить своё."
 SHL_kyz_front_hold_timeout_tt: "Если к концу срока Шахрабад и его союзники всё ещё держат цели войны с Кейзаном, Кейзан признаёт поражение: районы цели войны переходят Шахрабаду, уступленные ранее округа возвращаются."
 SHL_kyz_front_lost: "Фронт Кейзана: печи в чужих руках"
 SHL_kyz_front_lost_desc: "Отряды общин стоят у стен печного округа. Мастера уводят семьи в глубь страны, а стража Конклава собирает роты для контрудара."
 SHL_kyz_front_lost_timeout_tt: "Если к концу срока Кейзан или его союзник по пакту всё ещё держит печь Шахрабада (в войне пайка - и [707.GetName]), а Шахрабад не удерживает ни [280.GetName], ни [284.GetName], война проиграна: давление гербов §R+15§! (в войне за кяризы дома Арбин, Сафир и Лоран теряют ещё §R10§! верности, в войне пайка все дома - §R5§!), недовольство §R+5§!, баланс Конклава смещается к гербам, поддержка войны §R-5%§!. Кейзан выбирает условия мира: металлическую десятину, занятые округа или договор о нейтралитете.\nПосле поражения Шахрабад §Y365§! дн. не может начать новую войну с Кейзаном."
 SHL_glp_front_hold: "Фронт Вейра: порты в наших руках"
 SHL_glp_front_hold_desc: "Над пристанями подняты знамёна Конклава, и сборщики палаты смотрят на них с другого берега залива. Капитаны ждут, чья печать будет стоять на следующем грузе."
 SHL_glp_front_hold_timeout_tt: "Если к концу срока Шахрабад всё ещё держит [297.GetName] и [299.GetName] (при морской цели - и [708.GetName]), а Вейр не держит ни одного округа Шахрабада, Вейр признаёт поражение: районы цели войны переходят Шахрабаду, уступленные ранее округа возвращаются."
 SHL_glp_front_lost: "Фронт Вейра: граница прорвана"
 SHL_glp_front_lost_desc: "Наёмные команды палаты перешли границу и ставят свои весы на дорогах Конклава. Ширин Шарим каждую ночь шлёт гонцов в Хазар."
 SHL_glp_front_lost_timeout_tt: "Если к концу срока Вейр всё ещё держит округ Шахрабада, а Шахрабад не удерживает ни [297.GetName], ни [299.GetName], война проиграна: давление гербов §R+15§! (дома Кердан и Вейран теряют ещё §R10§! верности), недовольство §R+5§!, баланс Конклава смещается к гербам, поддержка войны §R-5%§!. Вейр выбирает условия мира: металлическую десятину, занятые округа или договор о нейтралитете.\nПосле поражения Шахрабад §Y365§! дн. не может начать новую войну с Вейром."
 SHL_status_kyz_front_hold: "§GЦели войны в наших руках - победа через [?days_mission_timeout@SHL_kyz_front_hold|0] дн.§!"
 SHL_status_kyz_front_lost: "§RПечи в руках Кейзана - поражение через [?days_mission_timeout@SHL_kyz_front_lost|0] дн.§!"
 SHL_status_glp_front_hold: "§GПорты в наших руках - победа через [?days_mission_timeout@SHL_glp_front_hold|0] дн.§!"
 SHL_status_glp_front_lost: "§RГраница прорвана Вейром - поражение через [?days_mission_timeout@SHL_glp_front_lost|0] дн.§!"
 SHL_front_battery: "Батарея у границы"
 SHL_front_battery_desc: "Литейщики выкатывают со двора ещё тёплые стволы, а возчики гонят упряжки к гребню, откуда видны чужие караулы. Мастера ночуют у орудий и проверяют каждый лафет сами."
 SHL_front_battery_description_rules_tt: "Пока батарея готовится, площадка печи занята: другие работы на этой печи недоступны. Если Шахрабад потеряет округ, залог возвращается полностью."
 SHL_front_battery_result_tt: "По готовности: §G+36§! £ADISCORD_artillery_texticon (§G+48§! после фокуса §Y$SHL_siege_founders$§!), износ печи §R+10§!. Если война на этой границе ещё идёт, батарея обстреливает соседние районы, которые противник держит сам: инфраструктура §R-1§!, а после фокуса §Y$SHL_siege_founders$§! - и военный завод §R-1§!."
 SHL_front_battery_wear_tt: "Износ печи ниже §Y80%§!"
 SHL_cost_front_battery: "[SHLGetPrice100] £ADISCORD_economy_treasury_texticon / [SHLGetPP20] £political_power_texticon"
 SHL_cost_front_battery_blocked: "§R100§! £ADISCORD_economy_treasury_texticon / §R20§! £political_power_texticon"
 SHL_cost_front_battery_tooltip: "§Y100§! £ADISCORD_economy_treasury_texticon / §Y20§! £political_power_texticon\nЦена списывается при выборе."
 SHL_settle_indemnity: "Выкупить контрибуцию"
 SHL_settle_indemnity_desc: "Лейла Надири приносит в зал Конклава одну строку из ведомости и предлагает вычеркнуть её разом. Казначеи домов спорят, чьё серебро пойдёт на это первым."
 SHL_settle_indemnity_tt: "Весь остаток контрибуции переходит получателю одним платежом; выплаты из печей прекращаются."
 SHL_indemnity_peace_tt: "Получатель контрибуции существует, независим и не воюет с Шахрабадом."
 SHL_cost_indemnity: "[SHLGetIndemnityPrice] £ADISCORD_economy_treasury_texticon / [SHLGetPP25] £political_power_texticon"
 SHL_cost_indemnity_blocked: "§R[?SHL_indemnity_due|0]§! £ADISCORD_economy_treasury_texticon / §R25§! £political_power_texticon"
 SHL_cost_indemnity_tooltip: "§Y[?SHL_indemnity_due|0]§! £ADISCORD_economy_treasury_texticon / §Y25§! £political_power_texticon\nЦена списывается при выборе."
 SHL_price_indemnity: "§Y[?SHL_indemnity_due|0]§!"
 SHL_price_indemnity_red: "§R[?SHL_indemnity_due|0]§!"
 SHL_border_treaty_indemnity: "Контрибуция: осталось §Y[?SHL_indemnity_due|0]§! £ADISCORD_economy_treasury_texticon."
 SHL_border_treaty_neutral: "Действует договор о нейтралитете с соседом."
 SHL_border_treaty_ceded: "Уступленный округ ждёт возвращения."
 SHL_border_treaty_none: "Пограничных обязательств нет."
 ADISCORD_SHL.161.t: "Шахрабад просит мира"
 ADISCORD_SHL.161.d: "Посланники Конклава приехали без охраны и без гербов. Рамин Фарзан, который ещё весной объяснял, почему Шахрабад имеет право на чужую воду и чужие дороги, теперь просит назвать цену мира. Наши отряды стоят на земле, которую Конклав считал своей, и в Хазаре больше никто не делает вид, что война идёт по его плану.\n\nСовет спорит о том, что взять. Одни хотят металла: печи Шахрабада горят и будут гореть, а значит, каждый их цикл может приносить нам часть выплавки. Другие требуют земли, занятой нашими людьми, - без неё победа останется словами в протоколе. Самые осторожные помнят, что чужая земля требует гарнизонов, а договор о мире позволяет годами не думать о границе.\n\nФарзан ждёт ответа. Каким бы он ни был, Шахрабад запомнит этот день так же хорошо, как мы."
 ADISCORD_SHL.161.a: "Взять металлическую десятину."
 ADISCORD_SHL.161.b: "Взять занятые округа."
 ADISCORD_SHL.161.c: "Подписать договор о нейтралитете."
 SHL_terms_tithe_qanat_tt: "Шахрабад выплачивает §Y240§! £ADISCORD_economy_treasury_texticon: каждая его горящая печь отдаёт §Y8§! за цикл, пока долг не погашен или не выкуплен. Пока мы воюем с Шахрабадом, выплаты стоят."
 SHL_terms_tithe_ration_tt: "Шахрабад выплачивает §Y320§! £ADISCORD_economy_treasury_texticon: каждая его горящая печь отдаёт §Y8§! за цикл, пока долг не погашен или не выкуплен. Пока мы воюем с Шахрабадом, выплаты стоят."
 SHL_terms_tithe_veyr_tt: "Шахрабад выплачивает §Y240§! £ADISCORD_economy_treasury_texticon: каждая его горящая печь отдаёт §Y8§! за цикл, пока долг не погашен или не выкуплен. Пока мы воюем с Шахрабадом, выплаты стоят."
 SHL_terms_land_qanat_tt: "Шахрабад уступает округ с печью, который держат наши отряды (не больше одной печи). Через год Конклав сможет предложить его выкуп."
 SHL_terms_land_ration_tt: "Шахрабад уступает [707.GetName], если наши отряды его держат, и не больше одной занятой печи. Через год Конклав сможет предложить выкуп."
 SHL_terms_land_veyr_tt: "Шахрабад уступает [296.GetName] и [733.GetName], если наши команды их держат, и не больше одной занятой печи. Через год Конклав сможет предложить выкуп."
 SHL_terms_treaty_qanat_tt: "Договор о нейтралитете на §Y730§! дней: Шахрабад не начнёт новую войну за воду, а мы не требуем пайка. Шахрабад принимает водную квоту."
 SHL_terms_treaty_ration_tt: "Договор о нейтралитете на §Y730§! дней: ни новой войны за воду, ни требований пайка. Шахрабад получает §Y$SHL_keizan_ration$§! на §Y540§! дней."
 SHL_terms_treaty_veyr_tt: "Договор о нейтралитете на §Y730§! дней: Шахрабад не начнёт новую портовую войну. Шахрабад получает §Y$SHL_veyr_bondage$§! на §Y365§! дней."
 ADISCORD_SHL.162.t: "Условия мира"
 ADISCORD_SHL.162.d_tithe: "[From.GetNameDef] назвал цену мира, не торгуясь: металл. Не землю и не заложников, а часть каждой плавки, пока долг не будет закрыт. Его посланники выслушали Рамина Фарзана до конца и не уступили ни слова. Лейла Надири открыла новую графу в промышленной ведомости и долго не могла подобрать ей название; в итоге написала одно слово - дань.\n\nДома восприняли условия по-разному. Голшан Лоран считает, что платить дешевле, чем воевать, и уже прикидывает, какие печи понесут основную тяжесть. Хосров Арбин и Дарий Сафир требуют найти деньги и выкупить долг разом, чтобы соседи не привыкли получать металл Конклава даром. В кварталах говорят прямо: печи работают на чужую казну.\n\nМир подписан. Пока горят печи, часть их огня принадлежит победителю, и каждый цикл будет напоминать Конклаву о проигранной войне."
 ADISCORD_SHL.162.d_land: "[From.GetNameDef] не захотел ни металла, ни договора. Его посланники разложили на столе Конклава карту и обвели на ней то, что их отряды уже держат. Рамин Фарзан пытался спорить о каждой линии, но спорить было не о чем: границу проводило не перо, а караулы, стоявшие там с начала перемирия.\n\nВ Хазаре этот день запомнят надолго. Семьи из уступленных округов тянутся по дорогам к Шариму и Лорану, мастера увозят инструменты, а у остывающих печей остаются только сторожа нового хозяина. Бехруз Вейран заявил, что его дом не признает новой границы, а Джалиль Нур ответил, что признавать её придётся всем, пока Шахрабад не найдёт силы или денег её изменить.\n\nДоговор подписан. Старые межевые камни остались на прежних местах, и каждый, кто проходит мимо, помнит, чья это земля."
 ADISCORD_SHL.162.d_treaty: "[From.GetNameDef] выбрал не металл и не землю, а время. Договор о нейтралитете запрещает обеим сторонам поднимать оружие друг на друга два года и закрепляет хозяйственные условия, о которых спорили ещё до войны. Рамин Фарзан подписал его первым и сказал Конклаву, что это лучший мир из возможных.\n\nДома приняли договор без радости. Дарий Сафир называет его отсрочкой, Голшан Лоран - передышкой для рынка, а Арман Теймур - единственной возможностью восстановить стражу. В кварталах рады уже тому, что сыновья вернутся домой. Лейла Надири переписывает ведомость: условия соседа будут стоить печам денег, но война обходилась дороже.\n\nМир заключён на бумаге и на два года. Что будет после, решат те, кто успеет за это время стать сильнее."
 ADISCORD_SHL.162.a: "Мир подписан."
 SHL_terms_report_tithe_tt: "Контрибуция: §R[?SHL_indemnity_due|0]§! £ADISCORD_economy_treasury_texticon. Каждая горящая печь отдаёт §R8§! за цикл, а без фокуса §Y$SHL_border_settlement_office$§! каждая выплата добавляет давление гербов §R+2§!. Остаток можно выкупить решением."
 SHL_terms_report_land_tt: "Через §Y365§! дней (через §Y180§! после фокуса §Y$SHL_border_settlement_office$§!) Конклав сможет предложить выкуп уступленных округов. Победа в новой войне с этим соседом вернёт их."
 SHL_terms_report_treaty_tt: "Договор о нейтралитете на §Y730§! дней: война и требования с этим соседом приостановлены, хозяйственные условия договора уже действуют."
 ADISCORD_SHL.163.t: "Год у межевых камней"
 ADISCORD_SHL.163.d: "Прошёл срок, который мастера уступленных округов отсчитывали по плавкам соседних печей. [SHLGetReturnNeighbour] обжился на новой земле: поставил свои караулы, назначил старост, переписал колодцы и дороги в свои реестры. Но семьи, ушедшие в Шарим и Лоран, по-прежнему называют брошенные дворы своими, а их дети знают дорогу к старым печам лучше, чем к новым.\n\nРамин Фарзан докладывает, что сосед устал держать гарнизоны на чужой земле и может согласиться на выкуп, если Конклав предложит его честно и сразу. Лейла Надири подсчитала, сколько казна может отдать, не останавливая печей. Бехруз Вейран против любых денег: землю, взятую силой, говорит он, надо возвращать силой.\n\nКонклав должен решить, признать ли новую границу и закрыть этот спор навсегда или отправить посланников с предложением, от которого соседу будет трудно отказаться."
 ADISCORD_SHL.163.a: "Признать новую границу."
 ADISCORD_SHL.163.b: "Предложить выкуп."
 SHL_return_accept_tt: "Шахрабад отказывается от претензий на округа, уступленные соседу ([SHLGetReturnNeighbour]): предложений о выкупе больше не будет. Давление гербов §G-5§!."
 SHL_redemption_offer_tt: "[SHLGetReturnNeighbour] получает предложение выкупа: §Y250§! £ADISCORD_economy_treasury_texticon и §Y25§! £political_power_texticon списываются сразу и хранятся до ответа. При отказе или без ответа за §Y40§! дней всё возвращается."
 SHL_redemption_offer_office_tt: "[SHLGetReturnNeighbour] получает предложение выкупа: §Y200§! £ADISCORD_economy_treasury_texticon и §Y25§! £political_power_texticon списываются сразу и хранятся до ответа. При отказе или без ответа за §Y40§! дней всё возвращается."
 ADISCORD_SHL.164.t: "Выкуп округов"
 ADISCORD_SHL.164.d: "Посланники Шахрабада привезли не угрозы, а сундук. Конклав предлагает выкупить округа, отошедшие к нам после войны: деньги уже отсчитаны и опечатаны, и посланники готовы оставить их здесь сегодня же, если мы вернём землю. Рамин Фарзан говорит спокойно и не торопит: он знает, во что нам обходятся гарнизоны на чужих дворах.\n\nСовет разделился. Одни считают, что земля, взятая кровью, не продаётся и что Шахрабад, получив её обратно, снова начнёт спорить о воде и дорогах. Другие напоминают, что опустевшие печные округа не приносят ничего, кроме расходов, а серебро Конклава можно потратить на собственные колодцы и пристани. Самые осторожные спрашивают только одно: что будет, если мы откажемся.\n\nПосланники ждут ответа. Отказ сохранит землю, но Конклав воспримет его как вызов."
 ADISCORD_SHL.164.a: "Принять выкуп."
 ADISCORD_SHL.164.b: "Земля не продаётся."
 SHL_redemption_accept_tt: "Выкуп поступает в нашу казну, уступленные округа возвращаются Шахрабаду."
 SHL_redemption_refuse_tt: "Шахрабад получает выкуп обратно, и Конклав сможет снова начать войну за эти округа."
 ADISCORD_SHL.165.t: "Округа возвращены"
 ADISCORD_SHL.165.d: "[From.GetNameDef] принял выкуп. Посланники соседа передали Рамину Фарзану ключи от управ и списки колодцев, а их караулы ушли с уступленной земли так же тихо, как когда-то пришли. Первыми в округа вернулись мастера: они шли пешком за телегами с инструментом, не дожидаясь приказа Конклава, и к вечеру над старыми печами поднялся дым.\n\nЛейла Надири вычеркнула из ведомости строку, которая год напоминала Конклаву о поражении. Бехруз Вейран не скрывает недовольства тем, что за свою землю пришлось платить, но и он признаёт, что серебро обошлось дешевле новой войны. В кварталах устраивают праздник, а Самира Хади отправляет врачей во дворы, где за год никто не лечил людей.\n\nГраница вернулась к прежним межевым камням. Конклав заплатил за свою ошибку и закрыл этот счёт."
 ADISCORD_SHL.165.a: "Земля снова наша."
 ADISCORD_SHL.166.t: "Сосед отказал"
 ADISCORD_SHL.166.d: "[From.GetNameDef] отверг выкуп. Посланники вернулись в Хазар с тем же сундуком, который везли туда: печати не тронуты, деньги пересчитаны и сданы Лейле Надири. На словах сосед передал коротко: что взято войной, отдают только войной.\n\nВ зале Конклава этот ответ встретили по-разному. Рамин Фарзан считает, что сосед лишь поднимает цену и через год согласится. Бехруз Вейран и Хосров Арбин говорят, что сосед сам закрыл дорогу переговорам и оставил Конклаву один путь. Арман Теймур молча раскладывает на столе карту пограничных дорог и считает роты, которые можно собрать к новому походу.\n\nДеньги вернулись в казну. Спор о земле снова открыт, и теперь Конклаву решать, когда и как его продолжить."
 ADISCORD_SHL.166.a: "Значит, решим это иначе."
 SHL_redemption_refused_tt: "Выкуп и §Y25§! £political_power_texticon вернулись. Решение о войне с этим соседом снова доступно, если готова соответствующая ветка фокусов."
 ADISCORD_SHL_news.10.t: "Шахрабад принимает условия соседа"
 ADISCORD_SHL_news.10.d: "Из Хазара сообщают: Конклав печей Шахрабада подписал мир на условиях, которые продиктовал [From.GetNameDef]. Пограничная война, которую Конклав начинал как короткий спор за воду или дорогу к морю, закончилась так, как в Хазаре не ждали: соседи удержали поле, а посланники Шахрабада сами приехали просить мира.\n\nПодробности условий в столице печей открыто не обсуждают. Купцы Золотых ворот говорят о металле, который пойдёт соседу вместо пошлины, беженцы с границы - о брошенных дворах, дипломаты - о договоре, связавшем руки обеим сторонам. Ясно одно: девять домов впервые со времени основания Конклава подписали мир не как победители.\n\nВ пустыне эту новость читают внимательно. Сильнейшая промышленная держава юга показала, что её можно остановить, и каждый сосед теперь пересчитывает свои силы и чужие печи."
 ADISCORD_SHL_news.10.a: "Даже печи можно остановить."
# ----- Metal contracts and oil price -----
 SHL_packet_price_base: ""
 SHL_packet_price_contract: "\nЦена сырья снижена: нефтяной контракт Светлогорья."
 SHL_packet_price_embargo: "\nЦена сырья повышена: эмбарго Светлогорья."
 SHL_metal_contract_offer: "[SHLGetMetalOfferTitle]"
 SHL_metal_offer_target_title: "[FROM.GetName] - предложить металл"
 SHL_metal_offer_unlock_title: "Предложить контракт на металл"
 SHL_caravan_contracts_locked: "\n\n£SHL_caravan_contract_texticon §YКонтракты на металл§!\nПереговоры откроет фокус \"Маклеры металла\" или \"Рынок металла\". В военном дереве переговоры открывает фокус \"Сохранить рынки\"."
 SHL_metal_contract_offer_desc: "Посланник разложил на столе образцы слитков. Управляющий перевернул ближайший из них, сверил оттиск печи со своей книгой и придвинул чернильницу."
 SHL_metal_export_free_tt: "Хотя бы одна работающая печь свободна от заказов и обязательств"
 SHL_metal_clients_limit_tt: "Меньше §Y[?SHL_metal_max_clients|0]§! действующих контрактов на металл"
 SHL_metal_offer_tt: "[From.GetNameDefCap] получит предложение и выберет контракт на 1 или 2 года. Каждые §Y28§! дней покупатель платит §Y20§! £ADISCORD_economy_treasury_texticon по годовому договору или §Y15§! £ADISCORD_economy_treasury_texticon по двухлетнему. Поставки дают §G+15%§! прироста эффективности производства и §G+5%§! к её пределу."
 SHL_metal_contract_end: "[FROM.GetName] - прекратить поставки"
 SHL_metal_contract_end_desc: "Картель готовит письма о прекращении поставок. Купцам предстоит закрыть книги по договору и известить караванщиков."
 SHL_metal_end_tt: "[From.GetNameDefCap] теряет металл Шахрабада: платежи §Y[?FROM.SHL_metal_cycle_price|0]§! £ADISCORD_economy_treasury_texticon за цикл прекращаются."
 SHL_metal_accept_tt: "Контракт на 365 дней. Каждые 28 дней: -20 £ADISCORD_economy_treasury_texticon в пользу Шахрабада. Два неоплаченных цикла или война с Шахрабадом прекращают поставки."
 SHL_metal_decline_tt: "Шахрабад получит отказ и больше не будет предлагать нам контракт на поставку металла."
 SHL_metal_supply: "Металл Шахрабада"
 SHL_metal_supply_desc: "Печи Золотых ворот отгружают металл по контракту с Конклавом. Поставки идут, пока покупатель платит каждый цикл и пока между сторонами нет войны."
 ADISCORD_SHL.130.t: "Металл Золотых ворот"
 ADISCORD_SHL.130.d: "Посланник Конклава Шахрабада привёз в столицу проект договора, скреплённый печатями картеля Золотых ворот. Девять домов предлагают металл своих печей: каждые четыре недели одна из них будет лить сталь для нас, а плата пойдёт в Хазар.\n\nПосланник не торгуется. На два года картель отдаёт металл дешевле, а домов, готовых отгружать металл чужой стране, у Конклава немного. Он напоминает, что печи Шахрабада горят непрерывно уже не первое поколение и ни одна из них ещё не подвела заказчика, пока ему платили в срок.\n\nВ министерствах считают иначе: сталь Шахрабада облегчит освоение новых линий на заводах, но свяжет часть казны с городом, чьи дома привыкли торговать и с друзьями, и с врагами."
 ADISCORD_SHL.130.a: "На 1 год - 20 £ADISCORD_economy_treasury_texticon каждые 28 дней"
 ADISCORD_SHL.130.b: "Обойдёмся своим металлом."
 ADISCORD_SHL.131.t: "Контракт подписан"
 ADISCORD_SHL.131.d: "[From.GetNameDefCap] принимает условия картеля. В Хазаре посланник Конклава ставит вторую печать, и писцы Золотых ворот вносят новую строку в книгу отгрузок: одна из печей отныне льёт металл для чужой страны, и её плата должна приходить без напоминаний.\n\nДома довольны. Контракт даёт казне деньги, не зависящие от настроения кварталов и от цены сырья, а чужая страна становится заинтересована в том, чтобы огонь Шахрабада не гас.\n\nСтаршие мастера напоминают о другом: каждое обязательство перед чужими - это печь, которую нельзя погасить, пока договор жив, и покупатель, который однажды сочтёт её своей."
 ADISCORD_SHL.131.a: "Пусть льют."
 ADISCORD_SHL.132.t: "Ответ покупателя"
 ADISCORD_SHL.132.d: "[From.GetNameDefCap] отказывается от контракта. Посланник возвращается в Хазар с нераспечатанным договором: в чужих министерствах предпочли не связывать свои заводы с металлом, который приходит из-за пустыни и зависит от спокойствия чужих кварталов.\n\nКартель принимает отказ без обиды. Печи работают, рынок Юга велик, и Золотые ворота ещё откроются тому, кто придёт к ним сам. Печь, которую картель держал для этого договора, остаётся при обычной выручке, и Конклав волен предложить её другому покупателю."
 ADISCORD_SHL.132.d_lapsed: "[From.GetNameDefCap] соглашается на контракт, но к моменту подписания у картеля не осталось свободной печи: заказы, обязательства и другие договоры заняли всё, что горит. Посланник извиняется и обещает вернуться к разговору, когда одна из печей освободится.\n\nВ Хазаре спор короткий. Обещать металл, которого нет, Конклав не станет: слово картеля стоит дороже одного контракта. Пока ни одна печь не освободится от заказа или обязательства, новых обещаний Золотые ворота не дают."
 ADISCORD_SHL.132.a: "Принято к сведению."
 ADISCORD_SHL.133.t: "Контракт прекращён"
 ADISCORD_SHL.133.d: "[From.GetNameDefCap] второй цикл подряд не платит за металл Золотых ворот. Писцы картеля закрывают строку в книге отгрузок, и печь, работавшая на чужую страну, возвращается к обычной выручке.\n\nКонклав не требует возмещения. В Шахрабаде давно знают: металл, за который не платят, лучше оставить себе, а покупателя, который не платит, лучше не искать. Печь, которую картель держал для этого договора, снова льёт для рынка Юга, и Конклав волен предложить её другому."
 ADISCORD_SHL.133.d_war: "[From.GetNameDefCap] теперь воюет с Шахрабадом, и контракт на металл разорван. Печь, лившая сталь для чужой страны, переходит на обычную выручку; счета картеля закрываются без расчёта.\n\nНи одна из сторон не называет это предательством. Металл Золотых ворот всегда шёл за торговлей, а не за союзами, и торговля закончилась вместе с миром. Печь, лившая для этого покупателя, теперь работает на рынок Юга или на собственные арсеналы Шахрабада."
 ADISCORD_SHL.133.a: "Так и запишем."

# ----- Life of the furnaces -----
 ADISCORD_shl_life.1.t: "Архив Конклава: перепись девяти"
 ADISCORD_shl_life.1.d: "Писцы Лейлы Надири вышли из Хазара на рассвете и за двадцать дней обошли все девять печей, от кяризов Арбина до застав Вейрана. В каждой они делали одно и то же: считали кладку, пакеты сырья в складах и людей следующей смены, а потом просили дежурного мастера подписать лист. В Сафире их встретили обедом и не подпустили к складу; в Шариме Ширин Шарим сама провела их по пролётам и показала лазарет, но смена отказалась называть имена незарегистрированных. В Байрате Тахмурас открыл книгу долгов и спросил, запишут ли в ведомость, кто из домов не платил за руду три цикла.\n\nИтог лёг на стол Конклава одной таблицей. Девять печей, девять столбцов, и впервые видно, что Нуран изношен сильнее всех, а Шарим держит две смены там, где у Лорана одна. Амин Рашад поставил печать, не дожидаясь возражений гербов. Перепись не изменила ни одного закона, но с этого дня каждый спор в зале начинается с вопроса, что написано в столбце."
 ADISCORD_shl_life.1.a: "Подшить к ведомости."
 ADISCORD_shl_life.2.t: "Архив Конклава: экзамен в Шариме"
 ADISCORD_shl_life.2.d: "Школа мастеров приняла первый выпуск в Шариме, в старом пролёте седьмой печи, где смены самые тяжёлые и ошибки видны сразу. Экзамен принимали трое: мастер дома, присланный Ширин Шарим, старый кочегар из совета смен и писец Конклава с чистым листом. Ученик должен был по цвету пламени назвать температуру, по звуку кладки - где трещина, и сказать, когда печь надо остановить, даже если дом прикажет лить дальше.\n\nПоследний вопрос вызвал спор. Мастер дома считал, что ученик обязан отвечать \"никогда\", кочегар - что обязан назвать признаки, при которых огонь убьёт смену. Писец записал оба ответа и отметил, что Закон непрерывного огня не запрещает ни один из них. Из двенадцати учеников выпустили девять. Трое остались на второй срок при печи, и Салим Дарзи внёс их имена в журнал смены отдельной строкой: впервые Конклав признал, что мастером можно стать, а не только родиться."
 ADISCORD_shl_life.2.a: "Выпуск состоялся."
 ADISCORD_shl_life.3.t: "Архив Конклава: ствол Тахмураса Байрата"
 ADISCORD_shl_life.3.d: "Тахмурас Байрат спустился в новый ствол первым, как делает всегда, и поднялся через четыре часа с мешком породы, который сам высыпал на стол Конклава в Хазаре. Руда была хороша. Байрат сказал об этом коротко и добавил то, ради чего приехал: ствол дал жилу, которой хватит всем девяти печам, и дом хочет знать, кто будет платить за неё в срок, а кто снова попросит в долг.\n\nСекретарь Амин Рашад записал вопрос в ведомость. Хосров Арбин напомнил, что его печи платили всегда; Дарий Сафир промолчал, и молчание заметили все. Тахмурас не стал ждать ответа. Шахтёры Байрата живут в бараках у устья, зимой там холодно, а летом вода из цистерн стоит дороже руды, и дом собирается ставить для них посёлок, если выручка пойдёт без задержек. Конклав занёс рудник в промышленную ведомость как общее достояние девяти печей. Байрат согласился с формулировкой и попросил добавить одну строку: достояние девяти, а долги - каждого."
 ADISCORD_shl_life.3.a: "Записать строку."
 ADISCORD_shl_life.4.t: "Архив Конклава: первый поезд через солончаки"
 ADISCORD_shl_life.4.d: "Первый состав по дороге домов вышел из Сафира ночью, чтобы к рассвету пройти солончаки, пока соль не раскалилась. Ферейдун Кердан ехал на площадке паровоза; машинист - из рудных обозов Байрата, кочегар - из смены Шарима, и никто из них раньше не вёл поезд по этой насыпи. За Сафиром полотно идёт по белой равнине, где нет ни одного ориентира, кроме столбов с номерами, и на тридцатом столбе состав остановился: соль просела под шпалами, и бригада два часа подбивала насыпь при свете фонарей.\n\nВ Байрат поезд пришёл к полудню. Тахмурас встретил его на рудничном дворе, пересчитал вагоны и приказал грузить сразу, не дожидаясь бумаг. Обратно состав вёз руду для трёх печей и письмо Кердана Конклаву: насыпь нужно поднять, а на солончаках поставить обходчиков, иначе дорога домов будет дорогой до первого ветра. Лейла Надири внесла письмо в ведомость следующего цикла и приписала рядом цену обоза, которую больше не надо платить."
 ADISCORD_shl_life.4.a: "Дорога открыта."
 ADISCORD_shl_life.5.t: "Архив Конклава: биржа Золотых ворот на рассвете"
 ADISCORD_shl_life.5.d: "Биржа Золотых ворот открывается до восхода, когда металл последней плавки ещё тёплый. Под аркой ставят девять столов, по одному на дом, и десятый - для писца Конклава, который записывает цену первого слитка. Голшан Лоран приходит первой и первой называет цену; остальные дома торгуются от неё, покупатели из Кадира и Вейра ждут у ворот, и до полудня каждый слиток находит обоз.\n\nВ тот день писец Конклава впервые записал цену не от Лоран, а от общего листа: Конклав установил рынок металла, и биржа торгует от имени всех девяти печей. Голшан приняла это спокойно и попросила лишь, чтобы столбец дома остался в листе. Сложнее было с покупателями: караванщик из Кадира не понял, почему слиток Шарима стоит столько же, сколько слиток Сафира, если дорога до Шарима длиннее. Писец объяснил, что дорога теперь дело Конклава, а не покупателя. Караванщик заплатил, но на следующей неделе привёл вдвое больше верблюдов, чтобы проверить, правда ли это."
 ADISCORD_shl_life.5.a: "Цена записана."
 ADISCORD_shl_life.6.t: "Архив Конклава: журнал смены, прочитанный вслух"
 ADISCORD_shl_life.6.d: "В пролёте седьмой печи вечером смена собралась не у огня, а у стола, на котором лежал журнал совета смен. Его читал вслух Салим Дарзи, по одной записи на каждый цикл: кто заболел, сколько раз печь работала усиленной сменой, когда последний раз чинили кладку, кому дом обещал жалованье и когда выплатил. Писец Конклава сидел в стороне и записывал то, что слышал. Это и было единственным условием Конклава: слушать и не спорить.\n\nЧтение заняло три часа. Половину записей смена знала наизусть, но слышать их при человеке с печатью было иначе: некоторые записи оказались в промышленной ведомости впервые. Когда Салим закрыл журнал, старый кочегар спросил писца, что Конклав сделает с услышанным. Писец ответил честно: занесёт в ведомость, а дальше решат дома. Кочегар кивнул и сказал, что этого достаточно, если ведомость будут читать так же вслух. Смена разошлась к печи; журнал остался на столе открытым, и писец переписал из него ещё две страницы, прежде чем уйти."
 ADISCORD_shl_life.6.a: "Занести в ведомость."
 ADISCORD_shl_life.7.t: "Архив Конклава: ночь на линии у Зархана"
 ADISCORD_shl_life.7.d: "Железнодорожная стража заступила на линию у Зархана в первую ночь без луны. Пост стоит там, где дорога домов выходит из печного округа к границе, и до сих пор здесь не было никого, кроме обходчика с фонарём. Теперь на разъезде стоит дрезина, у стрелки - двое с винтовками, а начальник поста, бывший старшина гвардии Вейрана, обходит полотно до двадцатого столба и обратно каждые два часа.\n\nВ третьем часу обходчик услышал шаги на насыпи. Стража подняла фонари; на полотне стоял караванщик из Зархан-калы, искавший воду для верблюдов, потому что цистерны у границы Кейзана в этом году закрыли на замок. Его напоили, записали в журнал поста и проводили до тракта. Начальник поста отметил в донесении, что ночь прошла спокойно, и приписал, что караванщик знал про замки на цистернах больше, чем знает Конклав. Арман Теймур прочёл донесение утром и велел повесить его в зале стражи: линия держится не на винтовках, а на том, что ночью на ней кто-то слушает."
 ADISCORD_shl_life.7.a: "Ночь прошла спокойно."
 ADISCORD_shl_life.8.t: "Архив Конклава: вышки против цистерн Кейзана"
 ADISCORD_shl_life.8.d: "Южная стража поставила первые вышки на гребне над сухим руслом, откуда видны цистерны Кейзана: пять каменных куполов Табара у границы Зарханского округа, вокруг которых Собрание арычных общин держит свои отряды. Днём с вышки видно, как к цистернам подходят повозки и как отряды общин меняют караулы; ночью видно только огни, и по их числу стража считает, сколько людей стоит у воды.\n\nБехруз Вейран приехал принять вышки сам. Он поднялся на крайнюю, долго смотрел на купола и сказал, что знает каждого из начальников караулов по имени: пограничный дом десять лет торговал с ними водой, пока Собрание не назвало металл Шахрабада платой за неё. Начальник стражи спросил, стрелять ли, если отряд Кейзана подойдёт к руслу. Вейран ответил, что сначала надо записать, сколько их и что они несут, а стрелять Конклав прикажет сам. Донесение с вышки с того дня приходит в Хазар каждое утро: число огней, число повозок и одна строка о ветре, потому что ветер с юга несёт песок на печи раньше, чем отряды."
 ADISCORD_shl_life.8.a: "Донесения - каждое утро."
 ADISCORD_shl_life.20.t: "Ночная смена в Шариме"
 ADISCORD_shl_life.20.d: "Седьмая печь не гаснет и ночью, и в Шариме это знают по звуку: когда город затихает, слышно, как дышит кладка. Ночная смена в этом цикле стоит у огня восьмой раз подряд, и Салим Дарзи записал в журнале, что люди засыпают стоя. Ширин Шарим прислала в пролёт два ящика лампового масла и ничего больше; лазарет при печи держит двери открытыми до утра.\n\nПисец Конклава, проходя мимо на рассвете, видел, как смена делит один котёл похлёбки на двадцать человек, и занёс это в ведомость как наблюдение, а не как жалобу. Конклав может оставить запись в ведомости или оплатить ночной смене горячий котёл из казны: мелочь для Хазара и первая строка в журнале смены, где Конклав назван по имени без злобы."
 ADISCORD_shl_life.20.a: "Записи в ведомости достаточно."
 ADISCORD_shl_life.20.b: "Оплатить ночной смене горячий котёл."
 SHL_life_20_b_tt: "Казна: §R-30§! £ADISCORD_economy_treasury_texticon. Недовольство кварталов: §G-2§!."
 ADISCORD_shl_life.21.t: "Караван Байрата"
 ADISCORD_shl_life.21.d: "Караван Байрата пришёл в Хазар с рудой раньше срока и привёз больше, чем заказали печи: новый ствол дал жилу богаче, чем считали, и Тахмурас не стал держать породу в отвалах. Погонщики разгрузились у складов Конклава и ждут, пока дома разберут излишек. Сафир торгуется, Лоран предлагает взять в долг, Нуран просит отсрочку до следующего цикла.\n\nТахмурас передал через старшего погонщика, что излишек уйдёт тому, кто заплатит сегодня, а если не заплатит никто, караван повезёт руду обратно, и в следующий раз дома получат ровно столько, сколько заказали. Лейла Надири считает, что Конклав может выкупить пакет в резерв сам: цена ниже рыночной, а резерв пригодится первой же печи, у которой сорвётся подвоз."
 ADISCORD_shl_life.21.a: "Пусть дома разбирают сами."
 ADISCORD_shl_life.21.b: "Выкупить излишек в резерв Конклава."
 SHL_life_21_b_tt: "Казна: §R-40§! £ADISCORD_economy_treasury_texticon. Резерв сырья: §G+1§! £SHL_packet_texticon."
 ADISCORD_shl_life.22.t: "Свадьба в доме Лоран"
 ADISCORD_shl_life.22.d: "Дом Лоран выдаёт замуж младшую дочь Голшан, и Золотые ворота на три дня закрыты для торговли: под аркой ставят столы, а биржу переносят во двор. Приглашены все девять домов, и все девять приехали, включая Тахмураса Байрата, который не покидал рудники с прошлой зимы. Жених из Кердана, и Ферейдун уже сказал за столом, что дорога к морю и Золотые ворота теперь одна семья.\n\nДжалиль Нур сидит на месте посредника и слушает: за свадебным столом дома говорят друг с другом так, как не говорят в зале Конклава. Голшан ждёт от Конклава подарка, не ради вещи, а ради записи в книге дома. Амин Рашад подготовил два письма: одно с поздравлением, другое с поздравлением и даром от имени всех печей. Разница между ними небольшая, но её заметят все девять гербов."
 ADISCORD_shl_life.22.a: "Передать поздравление."
 ADISCORD_shl_life.22.b: "Послать дар от имени Конклава."
 SHL_life_22_b_tt: "Дом Лоран: верность §G+6§!."
 ADISCORD_shl_life.23.t: "Ярмарка у Золотых ворот"
 ADISCORD_shl_life.23.d: "Раз в год, когда казна Конклава полна и последняя плавка продана, под аркой Золотых ворот ставят ярмарку: купцы Кадира привозят ткани, караваны Рахмы - соль и финики, а дома выставляют то, что не берёт биржа: мелкую кованую утварь, ножи, ламповые горелки. Три дня город торгует без писца, и писец Конклава приходит на ярмарку просто посмотреть.\n\nВ этом году старшины кварталов попросили о своём ряде: у смен есть что продать, но за место под аркой дома берут плату, которой у кварталов нет. Голшан Лоран не против, если Конклав оплатит ряд из казны; тогда ярмарка впервые станет общей, а не гербовой. Деньги небольшие, и выручка с них не вернётся в казну, зато кварталы впервые встанут под аркой рядом с домами."
 ADISCORD_shl_life.23.a: "Пусть торгуют, как торговали."
 ADISCORD_shl_life.23.b: "Оплатить ряд кварталов под аркой."
 SHL_life_23_b_tt: "Казна: §R-20§! £ADISCORD_economy_treasury_texticon. Гражданская опора: §G+2§!."
 ADISCORD_shl_life.24.t: "Кяризная вода"
 ADISCORD_shl_life.24.d: "Весенняя вода пришла по кяризам Кейзана в срок, и писцы Арбина записали её в водяную ведомость литр за литром: сколько ушло на печи, сколько в кварталы, сколько потерялось в отводах. Потери в этом году больше обычного. Общины Кейзана держат головные колодцы чистыми, но отводы на шахрабадской стороне заилены, и до кварталов Арбина вода доходит мутной и поздней.\n\nХосров Арбин считает, что чистка отводов - дело города, а не дома: печи свою воду получили. Старшины кварталов считают иначе и уже спросили писца Конклава, кому жаловаться. Мехран Арбин, как говорят, прислал отцу водяную ведомость с подчёркнутой строкой потерь. Конклав может оплатить чистку отводов до следующей воды или оставить вопрос дому и городу, как оставлял всегда."
 ADISCORD_shl_life.24.a: "Оставить дому и городу."
 ADISCORD_shl_life.24.b: "Оплатить чистку отводов."
 SHL_life_24_b_tt: "Казна: §R-25§! £ADISCORD_economy_treasury_texticon. Недовольство кварталов: §G-2§!."
 ADISCORD_shl_life.25.t: "Песчаная буря над Вейраном"
 ADISCORD_shl_life.25.d: "Буря пришла с юга в середине цикла, и Вейран первым принял её на себя: три дня над девятой печью не было видно неба, посты гвардии дома у границы засыпало по крыши, а дорогу домов на участке у Зархана пришлось откапывать дважды. Печь не погасла - кочегары Вейрана держали огонь при закрытых заслонках, - но кладка после бури требует осмотра, а посты гвардии стоят без крыш.\n\nБехруз Вейран не просит помощи: пограничный дом привык платить за свою границу сам. Но Арман Теймур напоминает, что посты гвардии Вейрана первыми видят отряды Кейзана, и если дом будет восстанавливать их на свои деньги до следующего цикла, граница всё это время будет слепа. Конклав может оплатить восстановление постов из казны. Вейран примет это не как милость, а как признание, что граница дома - граница всех девяти печей."
 ADISCORD_shl_life.25.a: "Дом справится сам."
 ADISCORD_shl_life.25.b: "Оплатить восстановление постов гвардии."
 SHL_life_25_b_tt: "Казна: §R-30§! £ADISCORD_economy_treasury_texticon. Дом Вейран: верность §G+6§!."
 ADISCORD_shl_life.26.t: "Чтение у печи"
 ADISCORD_shl_life.26.d: "В Нуране по вечерам у четвёртой печи читают. Начал это старый писец дома Нур, который после смены читал ученикам промышленную ведомость, потому что другой книги в пролёте не было; теперь читают всё, что привозят караваны: газеты Светлогорья, книгу печей, письма с дороги к морю. Приходят из соседних кварталов, садятся на тёплую кладку, и дежурный мастер следит, чтобы не мешали смене.\n\nКамран Нур спросил посредника, стоит ли Конклаву вмешаться: кварталы слушают чужие газеты у печи малого дома, и Сафир уже назвал это школой стачки. Джалиль Нур ответил, что чтение у печи старше Конклава. Но есть способ не запрещать, а участвовать: присылать в пролёт печатную ведомость Конклава, чтобы кварталы читали не только чужие газеты, но и то, что Хазар пишет о них самих."
 ADISCORD_shl_life.26.a: "Пусть читают."
 ADISCORD_shl_life.26.b: "Присылать в пролёт ведомость Конклава."
 SHL_life_26_b_tt: "Гражданская опора: §G+2§!."
 ADISCORD_shl_life.27.t: "Старый мастер Дарбана"
 ADISCORD_shl_life.27.d: "Старый мастер дома Дарбан, клавший восьмую печь ещё при отце Рауфа, пришёл на площадку десятой с собственной линейкой и провёл там весь день, ничего не говоря. Вечером он попросил чертежи, посмотрел на них при лампе и сказал инженерам товарищества, что они кладут правильно, а потом показал три места, где кладка треснет через десять лет, если не изменить шов.\n\nРауф Дарбан велел исправить. Мастер отказался от платы, но согласился продиктовать писцу Конклава всё, что помнит о восьми печах, которые клал: как выбирали камень, как ставили заслонки, какие печи гасли и почему. Писец говорит, что это лучшая книга о печах, какую ему доводилось записывать. Конклав может издать записки мастера за счёт казны: дома получат книгу, которой нет ни у одного соседа, а имя Конклава встанет на обложке рядом с именем Дарбана."
 ADISCORD_shl_life.27.a: "Поблагодарить мастера."
 ADISCORD_shl_life.27.b: "Издать записки мастера за счёт казны."
 SHL_life_27_b_tt: "Казна: §R-20§! £ADISCORD_economy_treasury_texticon. §G+25§! £political_power_texticon."
 ADISCORD_shl_life.30.t: "Праздник огня"
 ADISCORD_shl_life.30.d: "В ночь праздника Золотые ворота зажгли все девять домов. Первым огонь поднял Арбин: западные печи ближе всех к воротам. За ним Сафир и Лоран, чьи факелы были выше остальных; Нур зажёг свой от факела Арбина, как делает посредник; Байрат привёз огонь с рудников в закрытой лампе; Кердан - с дороги к морю. Шарим зажёг последним, потому что его смена шла до полуночи, и когда факел Шарима поднялся над аркой, кварталы закричали громче, чем на все остальные. Дарбан принёс огонь с площадки десятой печи, и никто в толпе не спросил, имеет ли он на это право. Вейран зажёг от огня пограничного поста.\n\nПод аркой стояли столы, и дома ели рядом со сменами. Джалиль Нур не произнёс речи. Он поднял лампу, в которой горел огонь всех девяти, и поставил её на стол писца Конклава рядом с промышленной ведомостью. Утром ворота открылись для торговли как обычно, но огонь в лампе не погасили: Амин Рашад велел держать его до следующего праздника."
 ADISCORD_shl_life.30.a: "Пусть горит."
 SHL_festival_of_fire: "Праздник огня"
 SHL_festival_of_fire_desc: "Раз в год Конклав зажигает Золотые ворота огнём всех девяти печей. Дома приносят факелы от своих печей, смены выходят из цехов, и три ночи город ест и торгует под аркой, не спрашивая, кто в каком реестре записан."
 SHL_cost_festival: "§Y60§! £ADISCORD_economy_treasury_texticon / §Y25§! £political_power_texticon"
 SHL_cost_festival_blocked: "§R60§! £ADISCORD_economy_treasury_texticon / §R25§! £political_power_texticon"
 SHL_cost_festival_tooltip: "§Y60§! £ADISCORD_economy_treasury_texticon / §Y25§! £political_power_texticon\nЦена списывается при выборе."
 SHL_festival_begin_tt: "Через §Y14§! дней ворота зажгут: недовольство кварталов §G-5§!, давление гербов §G-3§!."
 SHL_festival_result_tt: "Недовольство кварталов: §G-5§!. Верность каждого дома: §G+3§! (давление гербов §G-3§!)."

