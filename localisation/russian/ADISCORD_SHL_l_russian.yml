 SHL_road_cost_wholesale_tooltip: "Груз   100 000 £infantry_equipment_texticon любых моделей\nЗаправка   400 £fuel_texticon\nДорога   10 £ADISCORD_economy_treasury_texticon\nВозвратный залог за пять ящиков вина   100 £ADISCORD_economy_treasury_texticon"
 SHL_road_wholesale_tt: "[SHLGetRoadPlan]\nНа каждом рынке покупатель выбирает одну покупку за 7 дней.\n10 000 £infantry_equipment_texticon   за 300 £ADISCORD_economy_treasury_texticon\n20 000 £infantry_equipment_texticon   за 540 £ADISCORD_economy_treasury_texticon (скидка 10%)\n1 £SHL_wine_texticon ящик дорогих вин   за 80 £ADISCORD_economy_treasury_texticon. Покупателю даётся +5% стабильности на 90 дней.\nШахрабад получит выручку и непроданные винтовки по возвращении. Поставщик вернёт по 20 £ADISCORD_economy_treasury_texticon залога за каждый непроданный ящик.[SHLGetRoadFairOrder]\n\n[SHLGetRoadHomeTerms]"
