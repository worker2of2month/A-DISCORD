 SHL_panel_policy: "[SHLGetShift] / Подвоз: [SHLGetSupply]\nВыручка последнего цикла: §Y[?SHL_last_cycle_income|0]§! £ADISCORD_economy_treasury_texticon\nГражданская опора: §Y[?SHL_city_support|0]§! / Открытый Конклав: §Y30§!"
