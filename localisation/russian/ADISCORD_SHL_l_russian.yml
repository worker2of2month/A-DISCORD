 ADISCORD_SHL.5.settled: "Десятую печь в Девятипечье запустили по правилам, которые Конклав успел закрепить до окончания стройки. Первую смену составили мастера разных городов, а под ведомостью поставок стоят подписи Товарищества мастеров и инженеров. Рауф Дарбан провёл Джалиля Нура вдоль литейного пролёта: когда металл пошёл в изложницы, спор о возможности построить десятый комплекс закончился. Предстояло проверить, выдержат ли принятые решения настоящую работу.\n\nУ ворот стояли те, кто спорил об этой печи с первого дня: Голшан Лоран и Дарий Сафир от гербов, Мехран Арбин от городских собраний, Салим Дарзи от советов смен. Каждый помнил, чего требовал от стройки; никто не мог заменить очередную поставку своей подписью. Новая печь должна была обеспечить следующий цикл, сохранить мастеров и выполнить обещанные заказы.\n\nПолитический порядок уже определён. Его прочность теперь зависит от того, что Шахрабад сделает с полученным металлом."
 SHL_pressure_wait_tt: "До собственного транспорта строительство может быть закрыто спором о доступе. Завершённый транспортный фокус сохраняет свой результат."
 SHL_pressure_pay_tt: "Урегулировать доступ: §Y40§! £ADISCORD_economy_treasury_texticon."
 SHL_conclave_industry: "Промышленность Шахрабада"
 SHL_conclave_industry_desc: "Промышленный вклад зависит от работающих печей под контролем Шахрабада. До политической реформы каждый действующий голос дома поддерживает прирост политической власти. Смена собственника не заменяет обслуживание и снабжение. Заводы ждут вагонов с рудой, а стройки простаивают без проката.\n\nФокусы \"$SHL_houses_railway$\" и \"$SHL_metal_market$\" восстанавливают снабжение заводов и строек."
