 SHL_export_contract_tt: "Сразу §Y[?SHL_export_advance|0]§! £ADISCORD_economy_treasury_texticon, затем 120 за две плавки. Срок: три цикла; для новых договоров Республики гербов - четыре. Обычной поставки во время договора нет. Отмена возвращает аванс и 30 сверху; нехватка становится долгом. Затем печь продолжает экспорт."
 SHL_insured_cargo: "Застрахованный груз"
 SHL_insured_cargo_desc: "Караваны и суда домов идут под страховкой общей кассы, и перевозчики перестали возить запас впрок."
 SHL_charter_occupation: "Хартии занятым районам"
 SHL_charter_occupation_desc: "Открытый Конклав обещает занятым районам те же хартии, что и своим кварталам, пока идёт война за Юг."
 SHL_general_governorate: "Генерал-губернаторство"
 SHL_general_governorate_desc: "Дирекция управляет занятыми районами через назначенных губернаторов и печные гарнизоны."
 SHL_conclave_of_ten_spirit: "Конклав десяти"
 SHL_conclave_of_ten_spirit_desc: "Десятая печь получила герб и голос. Конклав домов снова полный, а его решения - быстрые и дорогие."
 SHL_crown_of_trade_spirit: "Корона торговли"
 SHL_crown_of_trade_spirit_desc: "Юг платит домам Шахрабада пошлинами, кредитами и уважением к Золотым воротам."
 SHL_southern_compact_spirit: "Южный договор"
 SHL_southern_compact_spirit_desc: "Хартия городов превратила Конклав в собрание делегатов. Решения даются медленнее, зато кварталы растут."
 SHL_treaty_of_the_south_spirit: "Договор Юга"
 SHL_treaty_of_the_south_spirit_desc: "Города Юга подписали общий договор с Открытым Конклавом и держат его."
 SHL_iron_directorate_spirit: "Железная дирекция"
 SHL_iron_directorate_spirit_desc: "Железная хартия закрепила власть Дирекции: приказы исполняются, вопросы задаются позже."
 SHL_hereditary_republic_spirit: "Наследственная республика"
 SHL_hereditary_republic_spirit_desc: "Регентская хартия вернула гербам право решать и обязанность платить."
 SHL_crown_of_crests_spirit: "Корона гербов"
 SHL_crown_of_crests_spirit_desc: "Гербы Шахрабада носят корону Юга, и лены соседей платят регенту."
 SHL_commune_of_fire_spirit: "Коммуна огня"
 SHL_commune_of_fire_spirit_desc: "Хартия коммуны передала печи советам смен. Смены охотнее идут и к печи, и в строй."
 SHL_fire_of_the_south_spirit: "Огонь Юга"
 SHL_fire_of_the_south_spirit_desc: "Советы Юга слились с советами Шахрабада; печи горят для всех."
 SHL_compact_court_opinion: "Суд договора"
 ADISCORD_SHL_harbour_share: "Доля в гавани Кердана"
 ADISCORD_SHL_junior_partner: "Младший партнёр Шахрабада"
 ADISCORD_SHL.140.t: "Требование у печи"
 ADISCORD_SHL.140.d: "Делегация пришла в Хазар без предупреждения: [SHLGetDemandHouse]. Печь работает, но кладка держится на подпорках, износ дошёл до §Y[?SHL_demand_wear|0]§!, и каждая смена заканчивается раньше положенного. Старшина делегации выложил на стол ведомость: сколько металла недодано, сколько людей обожглось, сколько раз письмо в Конклав оставалось без ответа.\n\nТребование простое. Либо Конклав платит за ремонт из общей казны, либо признаёт, что голос этой печи в зале весит больше, чем сейчас. Третий путь делегация назвала сама: отказ. Тогда они уйдут и будут ждать полтора месяца. Если за это время печь приведут в порядок, ссора забудется; если нет, их глава перестанет приходить на заседания, и Конклаву придётся обходиться без него.\n\nДжалиль Нур слушал молча. Он знал, что ведомость верна: в книге печей эта кладка значится худшей не первый цикл."
 ADISCORD_SHL.140.a: "Казна оплатит ремонт."
 ADISCORD_SHL.140.b: "Конклав не торгуется с ультиматумами."
 ADISCORD_SHL.140.c: "Признать их голос."
 ADISCORD_SHL.76.t: "Год после мира"
 ADISCORD_SHL.76.d: "Ровно год назад [SHLGetRevancheNeighbour] подписал мир, по которому пограничные области отошли Шахрабаду. Год сосед молчал: хоронил, восстанавливал дороги, менял командиров. Теперь его посланник привёз в Хазар бумагу, составленную по всем правилам: уступленные земли объявлены неотъемлемыми, их возвращение - делом чести.\n\nПосланник не угрожает. Он предлагает пересмотр: Шахрабад признаёт потери соседа деньгами, и бумага о претензиях исчезает из архива. Сумма названа заранее и не обсуждается. Если Конклав откажется, претензия останется записанной, и каждый новый спор на границе начнётся с неё.\n\nВ зале разделились. Одни считают, что платить за уже выигранную войну унизительно; другие напоминают, что печи работают лучше, когда граница спокойна."
 ADISCORD_SHL.76.a: "Заплатить за спокойную границу."
 ADISCORD_SHL.76.b: "Мир подписан, пересматривать нечего."
# ----- Metal contracts and oil price -----
 SHL_packet_price_base: ""
 SHL_packet_price_contract: "\nЦена сырья снижена: нефтяной контракт Светлогорья."
 SHL_packet_price_embargo: "\nЦена сырья повышена: эмбарго Светлогорья."
 SHL_metal_contract_offer: "Предложить контракт на металл"
 SHL_metal_contract_offer_desc: "Картель Золотых ворот ищет покупателей на металл своих печей. Посланник Конклава везёт проект срочного договора, оставляя покупателю выбор между коротким и долгим обязательством."
 SHL_metal_export_free_tt: "Хотя бы одна работающая печь свободна от заказов и обязательств"
 SHL_metal_clients_limit_tt: "Меньше §Y3§! действующих контрактов на металл"
 SHL_metal_offer_tt: "[From.GetNameDefCap] получит предложение и выберет контракт на 1 или 2 года. Каждые §Y28§! дней покупатель платит §Y60§! £ADISCORD_economy_treasury_texticon. Поставки дают §G+15%§! прироста эффективности производства и §G+5%§! к её пределу."
 SHL_metal_contract_end: "Разорвать контракт на металл"
 SHL_metal_contract_end_desc: "Конклав отзывает обязательство картеля перед этим покупателем. Отгрузки прекращаются с ближайшего цикла; уже полученные платежи остаются в казне."
 SHL_metal_end_tt: "[From.GetNameDefCap] теряет металл Шахрабада: платежи §Y60§! £ADISCORD_economy_treasury_texticon за цикл прекращаются."
 SHL_metal_accept_tt: "Контракт на 365 дней. Каждые 28 дней: -60 £ADISCORD_economy_treasury_texticon в пользу Шахрабада. Два неоплаченных цикла или война с Шахрабадом прекращают поставки."
 SHL_metal_decline_tt: "Шахрабад получит отказ."
 SHL_metal_supply: "Металл Шахрабада"
 SHL_metal_supply_desc: "Печи Золотых ворот отгружают металл по контракту с Конклавом. Поставки идут, пока покупатель платит каждый цикл и пока между сторонами нет войны."
 ADISCORD_SHL.130.t: "Металл Золотых ворот"
 ADISCORD_SHL.130.d: "Посланник Конклава Шахрабада привёз в столицу проект договора, скреплённый печатями картеля Золотых ворот. Девять домов предлагают металл своих печей: каждые четыре недели одна из них будет лить сталь для нас, а плата пойдёт в Хазар.\n\nПосланник не торгуется. Цена одна для всех покупателей, а домов, готовых отгружать металл чужой стране, у Конклава немного. Он напоминает, что печи Шахрабада горят непрерывно уже не первое поколение и ни одна из них ещё не подвела заказчика, пока ему платили в срок.\n\nВ министерствах считают иначе: сталь Шахрабада облегчит освоение новых линий на заводах, но свяжет часть казны с городом, чьи дома привыкли торговать и с друзьями, и с врагами."
 ADISCORD_SHL.130.a: "Подписать контракт на год."
 ADISCORD_SHL.130.b: "Обойдёмся своим металлом."
 ADISCORD_SHL.131.t: "Контракт подписан"
 ADISCORD_SHL.131.d: "[From.GetNameDefCap] принимает условия картеля. В Хазаре посланник Конклава ставит вторую печать, и писцы Золотых ворот вносят новую строку в книгу отгрузок: одна из печей отныне льёт металл для чужой страны, и её плата должна приходить без напоминаний.\n\nДома довольны. Контракт даёт казне деньги, не зависящие от настроения кварталов и от цены сырья, а чужая страна становится заинтересована в том, чтобы огонь Шахрабада не гас.\n\nСтаршие мастера напоминают о другом: каждое обязательство перед чужими - это печь, которую нельзя погасить, пока договор жив, и покупатель, который однажды сочтёт её своей."
 ADISCORD_SHL.131.a: "Пусть льют."
 ADISCORD_SHL.132.t: "Ответ покупателя"
 ADISCORD_SHL.132.d: "[From.GetNameDefCap] отказывается от контракта. Посланник возвращается в Хазар с нераспечатанным договором: в чужих министерствах предпочли не связывать свои заводы с металлом, который приходит из-за пустыни и зависит от спокойствия чужих кварталов.\n\nКартель принимает отказ без обиды. Печи работают, рынок Юга велик, и Золотые ворота ещё откроются тому, кто придёт к ним сам. Печь, которую картель держал для этого договора, остаётся при обычной выручке, и Конклав волен предложить её другому покупателю."
 ADISCORD_SHL.132.d_lapsed: "[From.GetNameDefCap] соглашается на контракт, но к моменту подписания у картеля не осталось свободной печи: заказы, обязательства и другие договоры заняли всё, что горит. Посланник извиняется и обещает вернуться к разговору, когда одна из печей освободится.\n\nВ Хазаре спор короткий. Обещать металл, которого нет, Конклав не станет: слово картеля стоит дороже одного контракта. Пока ни одна печь не освободится от заказа или обязательства, новых обещаний Золотые ворота не дают."
 ADISCORD_SHL.132.a: "Принято к сведению."
 ADISCORD_SHL.133.t: "Контракт прекращён"
 ADISCORD_SHL.133.d: "[From.GetNameDefCap] второй цикл подряд не платит за металл Золотых ворот. Писцы картеля закрывают строку в книге отгрузок, и печь, работавшая на чужую страну, возвращается к обычной выручке.\n\nКонклав не требует возмещения. В Шахрабаде давно знают: металл, за который не платят, лучше оставить себе, а покупателя, который не платит, лучше не искать. Печь, которую картель держал для этого договора, снова льёт для рынка Юга, и Конклав волен предложить её другому."
 ADISCORD_SHL.133.d_war: "[From.GetNameDefCap] теперь воюет с Шахрабадом, и контракт на металл разорван. Печь, лившая сталь для чужой страны, переходит на обычную выручку; счета картеля закрываются без расчёта.\n\nНи одна из сторон не называет это предательством. Металл Золотых ворот всегда шёл за торговлей, а не за союзами, и торговля закончилась вместе с миром. Печь, лившая для этого покупателя, теперь работает на рынок Юга или на собственные арсеналы Шахрабада."
 ADISCORD_SHL.133.a: "Так и запишем."

# ----- Life of the furnaces -----
 ADISCORD_shl_life.1.t: "Архив Конклава: перепись девяти"
 ADISCORD_shl_life.1.d: "Писцы Лейлы Надири вышли из Хазара на рассвете и за двадцать дней обошли все девять печей, от кяризов Арбина до застав Вейрана. В каждой они делали одно и то же: считали кладку, пакеты сырья в складах и людей следующей смены, а потом просили дежурного мастера подписать лист. В Сафире их встретили обедом и не подпустили к складу; в Шариме Ширин Шарим сама провела их по пролётам и показала лазарет, но смена отказалась называть имена незарегистрированных. В Байрате Тахмурас открыл книгу долгов и спросил, запишут ли в ведомость, кто из домов не платил за руду три цикла.\n\nИтог лёг на стол Конклава одной таблицей. Девять печей, девять столбцов, и впервые видно, что Нуран изношен сильнее всех, а Шарим держит две смены там, где у Лорана одна. Амин Рашад поставил печать, не дожидаясь возражений гербов. Перепись не изменила ни одного закона, но с этого дня каждый спор в зале начинается с вопроса, что написано в столбце."
 ADISCORD_shl_life.1.a: "Подшить к ведомости."
 ADISCORD_shl_life.2.t: "Архив Конклава: экзамен в Шариме"
 ADISCORD_shl_life.2.d: "Школа мастеров приняла первый выпуск в Шариме, в старом пролёте седьмой печи, где смены самые тяжёлые и ошибки видны сразу. Экзамен принимали трое: мастер дома, присланный Ширин Шарим, старый кочегар из совета смен и писец Конклава с чистым листом. Ученик должен был по цвету пламени назвать температуру, по звуку кладки - где трещина, и сказать, когда печь надо остановить, даже если дом прикажет лить дальше.\n\nПоследний вопрос вызвал спор. Мастер дома считал, что ученик обязан отвечать \"никогда\", кочегар - что обязан назвать признаки, при которых огонь убьёт смену. Писец записал оба ответа и отметил, что Закон непрерывного огня не запрещает ни один из них. Из двенадцати учеников выпустили девять. Трое остались на второй срок при печи, и Салима Дарзи внесла их имена в журнал смены отдельной строкой: впервые Конклав признал, что мастером можно стать, а не только родиться."
 ADISCORD_shl_life.2.a: "Выпуск состоялся."
 ADISCORD_shl_life.3.t: "Архив Конклава: ствол Тахмураса Байрата"
 ADISCORD_shl_life.3.d: "Тахмурас Байрат спустился в новый ствол первым, как делает всегда, и поднялся через четыре часа с мешком породы, который сам высыпал на стол Конклава в Хазаре. Руда была хороша. Байрат сказал об этом коротко и добавил то, ради чего приехал: ствол дал жилу, которой хватит всем девяти печам, и дом хочет знать, кто будет платить за неё в срок, а кто снова попросит в долг.\n\nСекретарь Амин Рашад записал вопрос в ведомость. Хосров Арбин напомнил, что его печи платили всегда; Дарий Сафир промолчал, и молчание заметили все. Тахмурас не стал ждать ответа. Шахтёры Байрата живут в бараках у устья, зимой там холодно, а летом вода из цистерн стоит дороже руды, и дом собирается ставить для них посёлок, если выручка пойдёт без задержек. Конклав занёс рудник в промышленную ведомость как общее достояние девяти печей. Байрат согласился с формулировкой и попросил добавить одну строку: достояние девяти, а долги - каждого."
 ADISCORD_shl_life.3.a: "Записать строку."
 ADISCORD_shl_life.4.t: "Архив Конклава: первый поезд через солончаки"
 ADISCORD_shl_life.4.d: "Первый состав по дороге домов вышел из Сафира ночью, чтобы к рассвету пройти солончаки, пока соль не раскалилась. Ферейдун Кердан ехал на площадке паровоза; машинист - из рудных обозов Байрата, кочегар - из смены Шарима, и никто из них раньше не вёл поезд по этой насыпи. За Сафиром полотно идёт по белой равнине, где нет ни одного ориентира, кроме столбов с номерами, и на тридцатом столбе состав остановился: соль просела под шпалами, и бригада два часа подбивала насыпь при свете фонарей.\n\nВ Байрат поезд пришёл к полудню. Тахмурас встретил его на рудничном дворе, пересчитал вагоны и приказал грузить сразу, не дожидаясь бумаг. Обратно состав вёз руду для трёх печей и письмо Кердана Конклаву: насыпь нужно поднять, а на солончаках поставить обходчиков, иначе дорога домов будет дорогой до первого ветра. Лейла Надири внесла письмо в ведомость следующего цикла и приписала рядом цену обоза, которую больше не надо платить."
 ADISCORD_shl_life.4.a: "Дорога открыта."
 ADISCORD_shl_life.5.t: "Архив Конклава: биржа Золотых ворот на рассвете"
 ADISCORD_shl_life.5.d: "Биржа Золотых ворот открывается до восхода, когда металл последней плавки ещё тёплый. Под аркой ставят девять столов, по одному на дом, и десятый - для писца Конклава, который записывает цену первого слитка. Голшан Лоран приходит первой и первой называет цену; остальные дома торгуются от неё, покупатели из Кадира и Вейра ждут у ворот, и до полудня каждый слиток находит обоз.\n\nВ тот день писец Конклава впервые записал цену не от Лоран, а от общего листа: Конклав установил рынок металла, и биржа торгует от имени всех девяти печей. Голшан приняла это спокойно и попросила лишь, чтобы столбец дома остался в листе. Сложнее было с покупателями: караванщик из Кадира не понял, почему слиток Шарима стоит столько же, сколько слиток Сафира, если дорога до Шарима длиннее. Писец объяснил, что дорога теперь дело Конклава, а не покупателя. Караванщик заплатил, но на следующей неделе привёл вдвое больше верблюдов, чтобы проверить, правда ли это."
 ADISCORD_shl_life.5.a: "Цена записана."
 ADISCORD_shl_life.6.t: "Архив Конклава: журнал смены, прочитанный вслух"
 ADISCORD_shl_life.6.d: "В пролёте седьмой печи вечером смена собралась не у огня, а у стола, на котором лежал журнал совета смен. Его читала вслух Салима Дарзи, по одной записи на каждый цикл: кто заболел, сколько раз печь работала усиленной сменой, когда последний раз чинили кладку, кому дом обещал жалованье и когда выплатил. Писец Конклава сидел в стороне и записывал то, что слышал. Это и было единственным условием Конклава: слушать и не спорить.\n\nЧтение заняло три часа. Половину записей смена знала наизусть, но слышать их при человеке с печатью было иначе: некоторые записи оказались в промышленной ведомости впервые. Когда Салима закрыла журнал, старый кочегар спросил писца, что Конклав сделает с услышанным. Писец ответил честно: занесёт в ведомость, а дальше решат дома. Кочегар кивнул и сказал, что этого достаточно, если ведомость будут читать так же вслух. Смена разошлась к печи; журнал остался на столе открытым, и писец переписал из него ещё две страницы, прежде чем уйти."
 ADISCORD_shl_life.6.a: "Занести в ведомость."
 ADISCORD_shl_life.7.t: "Архив Конклава: ночь на линии у Зархана"
 ADISCORD_shl_life.7.d: "Железнодорожная стража заступила на линию у Зархана в первую ночь без луны. Пост стоит там, где дорога домов выходит из печного округа к границе, и до сих пор здесь не было никого, кроме обходчика с фонарём. Теперь на разъезде стоит дрезина, у стрелки - двое с винтовками, а начальник поста, бывший старшина гвардии Вейрана, обходит полотно до двадцатого столба и обратно каждые два часа.\n\nВ третьем часу обходчик услышал шаги на насыпи. Стража подняла фонари; на полотне стоял караванщик из Зархан-калы, искавший воду для верблюдов, потому что цистерны у границы Мазара в этом году закрыли на замок. Его напоили, записали в журнал поста и проводили до тракта. Начальник поста отметил в донесении, что ночь прошла спокойно, и приписал, что караванщик знал про замки на цистернах больше, чем знает Конклав. Арман Теймур прочёл донесение утром и велел повесить его в зале стражи: линия держится не на винтовках, а на том, что ночью на ней кто-то слушает."
 ADISCORD_shl_life.7.a: "Ночь прошла спокойно."
 ADISCORD_shl_life.8.t: "Архив Конклава: вышки против цистерн Мазара"
 ADISCORD_shl_life.8.d: "Южная стража поставила первые вышки на гребне над сухим руслом, откуда видны цистерны Мазара: пять каменных куполов у границы Зарханского округа, вокруг которых Палата общего пайка держит свои отряды. Днём с вышки видно, как к цистернам подходят повозки и как отряды Мазара меняют караулы; ночью видно только огни, и по их числу стража считает, сколько людей стоит у воды.\n\nБехруз Вейран приехал принять вышки сам. Он поднялся на крайнюю, долго смотрел на купола и сказал, что знает каждого из начальников караулов по имени: пограничный дом десять лет торговал с ними водой, пока Палата не объявила металл Шахрабада частью своего пайка. Начальник стражи спросил, стрелять ли, если отряд Мазара подойдёт к руслу. Вейран ответил, что сначала надо записать, сколько их и что они несут, а стрелять Конклав прикажет сам. Донесение с вышки с того дня приходит в Хазар каждое утро: число огней, число повозок и одна строка о ветре, потому что ветер с юга несёт песок на печи раньше, чем отряды."
 ADISCORD_shl_life.8.a: "Донесения - каждое утро."
 ADISCORD_shl_life.20.t: "Ночная смена в Шариме"
 ADISCORD_shl_life.20.d: "Седьмая печь не гаснет и ночью, и в Шариме это знают по звуку: когда город затихает, слышно, как дышит кладка. Ночная смена в этом цикле стоит у огня восьмой раз подряд, и Салима Дарзи записала в журнале, что люди засыпают стоя. Ширин Шарим прислала в пролёт два ящика лампового масла и ничего больше; лазарет при печи держит двери открытыми до утра.\n\nПисец Конклава, проходя мимо на рассвете, видел, как смена делит один котёл похлёбки на двадцать человек, и занёс это в ведомость как наблюдение, а не как жалобу. Конклав может оставить запись в ведомости или оплатить ночной смене горячий котёл из казны: мелочь для Хазара и первая строка в журнале смены, где Конклав назван по имени без злобы."
 ADISCORD_shl_life.20.a: "Записи в ведомости достаточно."
 ADISCORD_shl_life.20.b: "Оплатить ночной смене горячий котёл."
 SHL_life_20_b_tt: "Казна: §R-30§! £ADISCORD_economy_treasury_texticon. Недовольство кварталов: §G-2§!."
 ADISCORD_shl_life.21.t: "Караван Байрата"
 ADISCORD_shl_life.21.d: "Караван Байрата пришёл в Хазар с рудой раньше срока и привёз больше, чем заказали печи: новый ствол дал жилу богаче, чем считали, и Тахмурас не стал держать породу в отвалах. Погонщики разгрузились у складов Конклава и ждут, пока дома разберут излишек. Сафир торгуется, Лоран предлагает взять в долг, Нуран просит отсрочку до следующего цикла.\n\nТахмурас передал через старшего погонщика, что излишек уйдёт тому, кто заплатит сегодня, а если не заплатит никто, караван повезёт руду обратно, и в следующий раз дома получат ровно столько, сколько заказали. Лейла Надири считает, что Конклав может выкупить пакет в резерв сам: цена ниже рыночной, а резерв пригодится первой же печи, у которой сорвётся подвоз."
 ADISCORD_shl_life.21.a: "Пусть дома разбирают сами."
 ADISCORD_shl_life.21.b: "Выкупить излишек в резерв Конклава."
 SHL_life_21_b_tt: "Казна: §R-40§! £ADISCORD_economy_treasury_texticon. Резерв сырья: §G+1§! пакет."
 ADISCORD_shl_life.22.t: "Свадьба в доме Лоран"
 ADISCORD_shl_life.22.d: "Дом Лоран выдаёт замуж младшую дочь Голшан, и Золотые ворота на три дня закрыты для торговли: под аркой ставят столы, а биржу переносят во двор. Приглашены все девять домов, и все девять приехали, включая Тахмураса Байрата, который не покидал рудники с прошлой зимы. Жених из Кердана, и Ферейдун уже сказал за столом, что дорога к морю и Золотые ворота теперь одна семья.\n\nДжалиль Нур сидит на месте посредника и слушает: за свадебным столом дома говорят друг с другом так, как не говорят в зале Конклава. Голшан ждёт от Конклава подарка, не ради вещи, а ради записи в книге дома. Амин Рашад подготовил два письма: одно с поздравлением, другое с поздравлением и даром от имени всех печей. Разница между ними небольшая, но её заметят все девять гербов."
 ADISCORD_shl_life.22.a: "Передать поздравление."
 ADISCORD_shl_life.22.b: "Послать дар от имени Конклава."
 SHL_life_22_b_tt: "Давление гербов: §G-2§!."
 ADISCORD_shl_life.23.t: "Ярмарка у Золотых ворот"
 ADISCORD_shl_life.23.d: "Раз в год, когда казна Конклава полна и последняя плавка продана, под аркой Золотых ворот ставят ярмарку: купцы Кадира привозят ткани, караваны Рахмы - соль и финики, а дома выставляют то, что не берёт биржа: мелкую кованую утварь, ножи, ламповые горелки. Три дня город торгует без писца, и писец Конклава приходит на ярмарку просто посмотреть.\n\nВ этом году старшины кварталов попросили о своём ряде: у смен есть что продать, но за место под аркой дома берут плату, которой у кварталов нет. Голшан Лоран не против, если Конклав оплатит ряд из казны; тогда ярмарка впервые станет общей, а не гербовой. Деньги небольшие, и выручка с них не вернётся в казну, зато кварталы впервые встанут под аркой рядом с домами."
 ADISCORD_shl_life.23.a: "Пусть торгуют, как торговали."
 ADISCORD_shl_life.23.b: "Оплатить ряд кварталов под аркой."
 SHL_life_23_b_tt: "Казна: §R-20§! £ADISCORD_economy_treasury_texticon. Гражданская опора: §G+2§!."
 ADISCORD_shl_life.24.t: "Кяризная вода"
 ADISCORD_shl_life.24.d: "Весенняя вода пришла по кяризам Кейзана в срок, и писцы Арбина записали её в водяную ведомость литр за литром: сколько ушло на печи, сколько в кварталы, сколько потерялось в отводах. Потери в этом году больше обычного. Общины Кейзана держат головные колодцы чистыми, но отводы на шахрабадской стороне заилены, и до кварталов Арбина вода доходит мутной и поздней.\n\nХосров Арбин считает, что чистка отводов - дело города, а не дома: печи свою воду получили. Старшины кварталов считают иначе и уже спросили писца Конклава, кому жаловаться. Мариам Арбин, как говорят, прислала отцу водяную ведомость с подчёркнутой строкой потерь. Конклав может оплатить чистку отводов до следующей воды или оставить вопрос дому и городу, как оставлял всегда."
 ADISCORD_shl_life.24.a: "Оставить дому и городу."
 ADISCORD_shl_life.24.b: "Оплатить чистку отводов."
 SHL_life_24_b_tt: "Казна: §R-25§! £ADISCORD_economy_treasury_texticon. Недовольство кварталов: §G-2§!."
 ADISCORD_shl_life.25.t: "Песчаная буря над Вейраном"
 ADISCORD_shl_life.25.d: "Буря пришла с юга в середине цикла, и Вейран первым принял её на себя: три дня над девятой печью не было видно неба, посты гвардии дома у границы засыпало по крыши, а дорогу домов на участке у Зархана пришлось откапывать дважды. Печь не погасла - кочегары Вейрана держали огонь при закрытых заслонках, - но кладка после бури требует осмотра, а посты гвардии стоят без крыш.\n\nБехруз Вейран не просит помощи: пограничный дом привык платить за свою границу сам. Но Арман Теймур напоминает, что посты гвардии Вейрана первыми видят отряды Мазара, и если дом будет восстанавливать их на свои деньги до следующего цикла, граница всё это время будет слепа. Конклав может оплатить восстановление постов из казны. Вейран примет это не как милость, а как признание, что граница дома - граница всех девяти печей."
 ADISCORD_shl_life.25.a: "Дом справится сам."
 ADISCORD_shl_life.25.b: "Оплатить восстановление постов гвардии."
 SHL_life_25_b_tt: "Казна: §R-30§! £ADISCORD_economy_treasury_texticon. Давление гербов: §G-2§!."
 ADISCORD_shl_life.26.t: "Чтение у печи"
 ADISCORD_shl_life.26.d: "В Нуране по вечерам у четвёртой печи читают. Начал это старый писец дома Нур, который после смены читал ученикам промышленную ведомость, потому что другой книги в пролёте не было; теперь читают всё, что привозят караваны: газеты Светлогорья, книгу печей, письма с дороги к морю. Приходят из соседних кварталов, садятся на тёплую кладку, и дежурный мастер следит, чтобы не мешали смене.\n\nКамран Нур спросил посредника, стоит ли Конклаву вмешаться: кварталы слушают чужие газеты у печи малого дома, и Сафир уже назвал это школой стачки. Джалиль Нур ответил, что чтение у печи старше Конклава. Но есть способ не запрещать, а участвовать: присылать в пролёт печатную ведомость Конклава, чтобы кварталы читали не только чужие газеты, но и то, что Хазар пишет о них самих."
 ADISCORD_shl_life.26.a: "Пусть читают."
 ADISCORD_shl_life.26.b: "Присылать в пролёт ведомость Конклава."
 SHL_life_26_b_tt: "Гражданская опора: §G+2§!."
 ADISCORD_shl_life.27.t: "Старый мастер Дарбана"
 ADISCORD_shl_life.27.d: "Старый мастер дома Дарбан, клавший восьмую печь ещё при отце Рауфа, пришёл на площадку десятой с собственной линейкой и провёл там весь день, ничего не говоря. Вечером он попросил чертежи, посмотрел на них при лампе и сказал инженерам товарищества, что они кладут правильно, а потом показал три места, где кладка треснет через десять лет, если не изменить шов.\n\nРауф Дарбан велел исправить. Мастер отказался от платы, но согласился продиктовать писцу Конклава всё, что помнит о восьми печах, которые клал: как выбирали камень, как ставили заслонки, какие печи гасли и почему. Писец говорит, что это лучшая книга о печах, какую ему доводилось записывать. Конклав может издать записки мастера за счёт казны: дома получат книгу, которой нет ни у одного соседа, а имя Конклава встанет на обложке рядом с именем Дарбана."
 ADISCORD_shl_life.27.a: "Поблагодарить мастера."
 ADISCORD_shl_life.27.b: "Издать записки мастера за счёт казны."
 SHL_life_27_b_tt: "Казна: §R-20§! £ADISCORD_economy_treasury_texticon. §G+25§! £political_power_texticon."
 ADISCORD_shl_life.30.t: "Праздник огня"
 ADISCORD_shl_life.30.d: "В ночь праздника Золотые ворота зажгли все девять домов. Первым огонь поднял Арбин: западные печи ближе всех к воротам. За ним Сафир и Лоран, чьи факелы были выше остальных; Нур зажёг свой от факела Арбина, как делает посредник; Байрат привёз огонь с рудников в закрытой лампе; Кердан - с дороги к морю. Шарим зажёг последним, потому что его смена шла до полуночи, и когда факел Шарима поднялся над аркой, кварталы закричали громче, чем на все остальные. Дарбан принёс огонь с площадки десятой печи, и никто в толпе не спросил, имеет ли он на это право. Вейран зажёг от огня пограничного поста.\n\nПод аркой стояли столы, и дома ели рядом со сменами. Джалиль Нур не произнёс речи. Он поднял лампу, в которой горел огонь всех девяти, и поставил её на стол писца Конклава рядом с промышленной ведомостью. Утром ворота открылись для торговли как обычно, но огонь в лампе не погасили: Амин Рашад велел держать его до следующего праздника."
 ADISCORD_shl_life.30.a: "Пусть горит."
 SHL_festival_of_fire: "Праздник огня"
 SHL_festival_of_fire_desc: "Раз в год Конклав зажигает Золотые ворота огнём всех девяти печей. Дома приносят факелы от своих печей, смены выходят из цехов, и три ночи город ест и торгует под аркой, не спрашивая, кто в каком реестре записан."
 SHL_cost_festival: "§Y60§! £ADISCORD_economy_treasury_texticon / §Y25§! £political_power_texticon"
 SHL_cost_festival_blocked: "§Y60§! £ADISCORD_economy_treasury_texticon / §Y25§! £political_power_texticon"
 SHL_cost_festival_tooltip: "§Y60§! £ADISCORD_economy_treasury_texticon / §Y25§! £political_power_texticon\nЦена списывается при выборе."
 SHL_festival_begin_tt: "Через §Y14§! дней ворота зажгут: недовольство кварталов §G-5§!, давление гербов §G-3§!."
 SHL_festival_result_tt: "Недовольство кварталов: §G-5§!. Давление гербов: §G-3§!."

