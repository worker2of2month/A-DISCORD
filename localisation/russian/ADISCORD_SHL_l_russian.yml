 SHL_law_of_continuous_fire: "Закон непрерывного огня"
 SHL_law_of_continuous_fire_desc: "Конклав признаёт только те дома, чьи печи продолжают работать. Нур требует отделить производственную непрерывность от права хозяев скрывать состояние оборудования."
 SHL_census_of_nine: "Перепись девяти печей"
 SHL_census_of_nine_desc: "Сверим запасы, состояние кладки и договоры рабочих смен. Общий реестр позволит направлять резерв туда, где следующий период действительно под угрозой."
 SHL_reserve_for_next_shift: "Резерв на следующую смену"
 SHL_reserve_for_next_shift_desc: "Резерв принадлежит стране, а его выдача закрепляется за конкретной печью. Это позволит пережить задержку поставки, не превращая помощь одному дому в его постоянную привилегию."
 SHL_conclave_rules: "Правила Конклава"
 SHL_conclave_rules_desc: "Городская администрация должна знать, когда прекращается право дома на предприятие. Обслуживание вспомогательных участков не равнозначно погашению главной печи."
 SHL_common_industrial_account: "Общий промышленный счёт"
 SHL_common_industrial_account_desc: "Промышленный доход должен оставаться доступным для ремонта и новых вложений. Публичный счёт облегчает согласование работ, не превращая девять предприятий в один бесконечный спор."
 SHL_houses_railway: "Железная дорога домов"
 SHL_houses_railway_desc: "Один незапланированный перегон способен остановить несколько предприятий. Общая диспетчерская служба и запасные составы дадут городам возможность снабжать печи без постоянных переговоров с владельцами участков."
 SHL_school_of_masters: "Школа мастеров"
 SHL_school_of_masters_desc: "Квалифицированная смена умеет замечать неисправность до аварии. Учебные мастерские предоставят печам общую программу подготовки вместо торговли отдельными специалистами."
 SHL_baryat_mines: "Рудники Байрата"
 SHL_baryat_mines_desc: "Байрат давно кормит печи рудой, но шахты работают по старым договорам каждого дома. Общая концессия вскроет новые пласты и даст печам металл, который не придётся покупать у соседей."
 SHL_ore_prospecting: "Разведка недр"
 SHL_ore_prospecting_desc: "Изыскатели Конклава уходят в Лоран, Шарим и Вейран. Там, где дома видели только песок, лежат вольфрам, бокситы и хром для новых сплавов."
 SHL_smelter_quarters: "Литейные кварталы"
 SHL_smelter_quarters_desc: "Руда должна становиться товаром рядом с печами. Конклав строит литейные кварталы во втором городе Лиги и в Шариме, чтобы металл уходил на рынок готовыми изделиями."
 SHL_furnace_arsenals: "Арсеналы при печах"
 SHL_furnace_arsenals_desc: "Цеха, готовые к эвакуации, можно и развернуть. Хазар и печной район получают оружейные мастерские, которые в мирное время льют трубы, а в войну - стволы."
 SHL_cannon_foundries: "Пушечные литейни"
 SHL_cannon_foundries_desc: "Металлурги Шахрабада умеют лить то, чего нет у соседей. Первые полевые орудия отливаются для домовых караулов, а чертежи передаются инженерам."
 SHL_conclave_army: "Армия Конклава"
 SHL_conclave_army_desc: "Девять караулов, заводская стража и наёмники пустыни сводятся под одно знамя. У Конклава появляется армия, которая служит не гербу, а печам."
 SHL_repair_without_extinction_tt: "Износ каждой работающей печи под контролем Шахрабада: §G-15§!."
 SHL_conclave_army_tt: "Конклав выставит §Y2§! дивизии заводской стражи в Хазаре."
 SHL_careful_smelting: "Бережная плавка"
 SHL_careful_smelting_desc: "Бережный режим снижает износ ценой части дохода."
 SHL_overtime_shift: "Усиленная смена"
 SHL_overtime_shift_desc: "Ускоренная плавка требует дополнительных поставок. Металлургам предстоит устранять дополнительный износ."
 SHL_repair_without_extinction: "Ремонт без погашения"
 SHL_repair_without_extinction_desc: "Вспомогательные участки можно обслуживать по очереди. Программа планового ремонта сохраняет непрерывную работу главной печи и даёт Конклаву способ вмешаться до потери голоса."
 SHL_engineer_society: "Инженерное товарищество"
 SHL_engineer_society_desc: "Мастера предлагают построить печь, которой не будет владеть ни один старый дом. Сначала им нужен общий проект, инженерная команда и проверяемый порядок расходов."
 SHL_right_to_land: "Право на землю"
 SHL_right_to_land_desc: "Город выделит землю и оформит доступ к промышленному водоснабжению. Чертёж должен стать участком с законным владельцем, прежде чем на него придут подрядчики."
 SHL_common_fund: "Общий фонд"
 SHL_common_fund_desc: "Города и мастера согласуют общий фонд проекта. Владельцы транспортных линий требуют собственную долю за перевозку тяжёлого оборудования; товарищество должно решить, заплатить ли за согласие или построить независимую службу."
 SHL_own_transport: "Собственный транспорт"
 SHL_own_transport_desc: "Собственная транспортная служба завершит спор о доступе к проекту."
 SHL_workers_charter: "Рабочая хартия"
 SHL_workers_charter_desc: "Рабочая хартия определит условия смены работодателя, обучения и участия в управлении. Даже будущему десятому дому придётся начинать с понятного договора с собственным городом."
 SHL_build_tenth_complex: "Строительство комплекса"
 SHL_build_tenth_complex_desc: "Проект готов к монтажу оборудования. В промышленном районе [294.GetName] появится новая фабрика."
 SHL_first_pour_focus: "Первая плавка"
 SHL_first_pour_focus_desc: "Инженеры готовы проверить комплекс под нагрузкой. Первая плавка должна стать производственным результатом, а не одной церемонией."
 SHL_tenth_voice: "Десятый голос"
 SHL_tenth_voice_desc: "Десятая печь работает, но её представители стоят у дверей Конклава. Стране предстоит определить, превращается ли товарищество в новый дом или меняется само основание политического права."
 SHL_new_house: "Новый промышленный дом"
 SHL_new_house_desc: "Товарищество получает право стать самостоятельным промышленным домом. Это даёт ему защиту существующего порядка, но превращает его руководителей в наследников тех самых привилегий, которым они бросали вызов."
 SHL_house_compromise: "Соглашение десяти"
 SHL_house_compromise_desc: "Согласуем полномочия нового дома и городские гарантии. Конклав сохранит порядок представительства, приняв ещё одного участника."
 SHL_admit_tenth_house: "Право нового дома"
 SHL_admit_tenth_house_desc: "Конклав закрепляет за товариществом право на наследственный голос. Кресло займут после запуска новой печи: её непрерывная работа станет тем же условием власти, которому подчинены остальные дома."
 SHL_open_conclave: "Открытый Конклав"
 SHL_open_conclave_desc: "Производство может заслужить представительство без наследственного титула. Городам предстоит получить собственный порядок выбора представителей."
 SHL_city_charters: "Городские хартии"
 SHL_city_charters_desc: "Хартии определят доступ жителей к управлению предприятиями и общим службам. Городское владение должно уметь содержать производство, а не только сменить имя на печати."
 SHL_rights_without_fire: "Право вне огня"
 SHL_rights_without_fire_desc: "Гражданское представительство перестаёт зависеть от непрерывности одной печи. Остановка остаётся хозяйственной проблемой, но больше не лишает город политического голоса."
 SHL_nur_directorate: "Директория Нура"
 SHL_nur_directorate_desc: "Нур предлагает единое управление резервом, ремонтами и главными производствами. Государство принимает обязанности, которыми дома оправдывали своё особое положение."
 SHL_common_dispatch: "Единая диспетчерская"
 SHL_common_dispatch_desc: "Единая служба согласует смены и поставки. Её полномочия сопровождаются обязанностью оплачивать работы и показывать получателей помощи."
 SHL_state_furnaces: "Государственные печи"
 SHL_state_furnaces_desc: "Промышленная дирекция получает право управлять погасшими предприятиями. Её результатом должна стать работающая промышленность, а не новая форма личной собственности."
 SHL_railway_guard: "Охрана железной дороги"
 SHL_railway_guard_desc: "Промышленная охрана должна защищать станции и составы. Подготовим связь и снабжение для существующих частей, не превращая каждый дом в отдельную армию."
 SHL_factory_air_defence: "ПВО заводских городов"
 SHL_factory_air_defence_desc: "Плотная застройка вокруг печей требует собственной воздушной защиты. Развернём батареи промышленного района и подготовим расчёты к охране промышленного района."
 SHL_industrial_evacuation: "Служба промышленной эвакуации"
 SHL_industrial_evacuation_desc: "Заранее подготовленная служба умеет вывозить оборудование, документы и специалистов. Её инженерные группы продолжат работу и в мирное время."
