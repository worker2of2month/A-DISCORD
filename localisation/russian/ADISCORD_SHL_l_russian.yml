 SHL_restored_house_guard: "Домовая гвардия нового устава"
 SHL_restored_house_guard_desc: "Оплаченная реформа связала обучение гвардии с действующей печью. Дом сохраняет голос, а армия получает постоянную организацию без списания военных обязательств."
 SHL_campaign_no_threat: "Мазарская угроза утратила основание; устройте мирный юг"
 SHL_convoy_slot_tt: "Обоз ещё не готов; ведомость свободна; мазарская угроза или одна из южных войн продолжается."

 SHL_unregistered_quarters: "Кварталы вне реестра"
 SHL_unregistered_quarters_desc: "В двадцатимиллионной стране учёт жителей по-прежнему разделён между домами, цехами и городами. Государство теряет людей в несовместимых ведомостях, а кварталы - доступ к учреждениям. Общий реестр за 80 £ADISCORD_economy_treasury_texticon или рабочая хартия снимают этот дух."
 SHL_register_quarters: "Признать квартальные реестры"
 SHL_register_quarters_desc: "Свести домовые, фабричные и городские списки без отмены уже выданных документов. Дух \"Кварталы вне реестра\" исчезнет; платёж доступен до принятия рабочей хартии."
 SHL_registers_result_tt: "Снять дух \"Кварталы вне реестра\". Поддержка городов §G+8§!, давление домов §R+5§!. §Y+5%§! $SHL_conclave_balance$."
 SHL_recognise_registers_tt: "80 £ADISCORD_economy_treasury_texticon: снять дух \"Кварталы вне реестра\"; поддержка городов +8, давление домов +5."
 SHL_cabinet_public_minutes_tt: "Поддержка городов +5; давление домов +5."
 ADISCORD_SHL.120.t: "Семь папок на столе"
 ADISCORD_SHL.120.d: "В Хазар привезли семь одинаковых папок. На первой было имя Амина Рашада; на остальных - оборона, хозяйство, медицина, школы, разведка и внешние дела. До полудня секретарь Конклава не позволял вносить в зал семейные гербы: на первом заседании кабинета они заняли бы больше места, чем доклады.\n\nАрман Теймур принёс несовместимые уставы караулов. Лейла Надири - счета за оборудование, которое три дома считали своим. Самира Хади положила рядом список пациентов без признанных документов. Фарид Мехр спросил, в какую школу пойдут их дети. Бахрам Каве молча передвинул к Рамину Фарзану копию перехваченного расписания каравана.\n\nРашад предложил начать с простого: у каждой обязанности должен быть исполнитель, а у каждого решения - запись. Спор возник о читателях этих записей. Домам хватало закрытого архива; кварталы хотели видеть, что правительство вообще приступило к работе. Если новый порядок уже ратифицирован, эту первую ведомость останется принять как начало его истории."
 ADISCORD_SHL.120.a: "Открыть протоколы для городских собраний."
 ADISCORD_SHL.120.b: "Пока оставить протоколы у секретаря."
 ADISCORD_SHL.120.c: "Принять ведомость кабинета."
 ADISCORD_SHL.121.t: "Люди, которых нет в ведомости"
 ADISCORD_SHL.121.d: "Самира Хади привела на заседание переписчицу из восточного квартала Хазара. Та принесла три удостоверения одного рабочего: фабричное, домовое и городское. В каждом по-разному писалось его имя. Когда мужчина попал в лазарет, дом отказался оплачивать чужого человека, а город не нашёл его в своём списке.\n\nТакие случаи повторялись от портовых улиц до посёлков у печей. Двадцать миллионов жителей не умещались в устройстве государства, привыкшего считать голосующие дома. Спор шёл не о новой переписи с нуля: кварталы уже знали своих людей. Они просили признать собственные записи и связать их с государственными учреждениями.\n\nЛейла Надири оценила работу в восемьдесят единиц казны: переписчики, сверка архивов, открытые столы жалоб. Старшины домов возражали против утраты исключительного права подтверждать личность. Решение можно принять сейчас, вернуться к нему через \"Кварталы и границы\" или закрепить тот же принцип рабочей хартией."
 ADISCORD_SHL.121.a: "Оплатить сверку и признать квартальные записи."
 ADISCORD_SHL.121.b: "Принять доклад; вопрос решит действующий порядок."
 ADISCORD_SHL.122.t: "Присяга на площади Хазара"
 ADISCORD_SHL.122.d: "Первый оплаченный набор общегосударственной стражи закончил подготовку. Это была не первая вооружённая сила Шахрабада: домовые караулы давно охраняли печи и дороги. Впервые новое соединение собрали по общей ведомости, с одним снабжением и без девяти отдельных разрешений на поход.\n\nНа площади Хазара Арман Теймур заметил, что солдаты по привычке ищут глазами знаменосца своего дома. Он велел старым унтер-офицерам встать впереди строя и прочитать приказ вместе. Чужого опыта у них не отнимали; отныне за этот опыт отвечало общее командование.\n\nУ казарменных ворот спорили о названии части. В платёжной книге уже стояло сухое \"Печная дружина\". На площади говорили проще: стража, которой не понадобится собрание старшин, чтобы защитить соседа."
 ADISCORD_SHL.122.a: "Принять присягу и выдать походные ведомости."
 ADISCORD_SHL.123.t: "Кому передают печать"
 ADISCORD_SHL.123.d: "В Хазаре смена власти началась с передачи ключей. Подвалы с архивами открывались теми же замками; в коридоре ждали те же просители. Новый порядок должен был решить, кому теперь отвечают люди за министерскими столами.\n\n[SHLGetCabinetStory]\n\nНа обороте акта передачи оставили перечень действующих обязательств. Ведомства продолжали работу; прежние платежи, заказы и долги не исчезали от смены подписи. Даже если следующий политический поворот снова изменит состав кабинета, эта запись останется в архиве."
 ADISCORD_SHL.123.a: "Передать печать вместе с обязательствами."
 SHL_cabinet_story_house: "Джалиль Нур остался в кресле посредника, а Амин Рашад сохранил печать и получил пост главы кабинета. Конклав десяти признал новый устав, но каждый дом хотел видеть в нём продолжение собственного права: Голшан Лоран - картель Золотых ворот, Дарий Сафир - неприкосновенность казны, Бехруз Вейран - гвардии. Рашад зачитал одинаковое для всех правило: спор о старшинстве не останавливает исполнение уже подписанного заказа, и десятый герб отвечает за свою печь так же, как девять старых. Одни услышали гарантию собственности, другие - первое ограничение семейного произвола."
 SHL_cabinet_story_city: "Мариам Арбин приняла печать как глава Южного договора, и впервые за историю Конклава её получила не рука дома. Она принесла в кабинет протокол городского собрания вместо рекомендательного письма отца, Хосрова Арбина, который на передачу не пришёл. Первым распоряжением она открыла часы приёма и велела публиковать решения о расходах. Министры сохранили свои ведомства - Арман Теймур стражу, Лейла Надири счета, Самира Хади лазареты, - но отныне обязаны объяснять работу представителям улиц, которые прежде оставались за дверями Конклава."
 SHL_cabinet_story_state: "Джалиль Нур принял печать уже не как посредник, а как директор печей, и первым его распоряжением стало назначение Рауфа Дарбана главой кабинета Дирекции. Дарбан развернул на столе диспетчерскую схему: для него государственная власть означала право связать цех, склад и фронт единым приказом. Начальники ведомств получили сроки сверки запасов; Лейла Надири - первую общую смету всех печей, Арман Теймур - график поставок для стражи. Дома могли спорить о будущем, однако распоряжение Дирекции уже требовало назвать ответственного за следующую поставку."
 SHL_cabinet_story_regent: "Дарий Сафир принял печать как регент Совета гербов и возглавил кабинет лично, не доверив его секретарю. Старшины домов ждали возвращения привычных привилегий; регент напомнил им об обязанностях работающей печи и содержании гвардии. На стол положили гербы девяти домов, но Лейла Надири оставила рядом счета, и Сафир не велел их убрать. Амин Рашад сохранил место секретаря, однако печать теперь лежала у регента. Даже наследственная власть должна была решить, кто оплатит её обещания."
 SHL_cabinet_story_commune: "Печать приняли советы смен, и держать её поручили дежурному мастеру Салиме Дарзи. Она пришла из Шарима с рабочим журналом под мышкой и первой проверила запись о невыплаченном заказе: государственная печать не могла превратить вчерашний труд в подарок новому режиму. Советы получили политический голос, а министры - обязанность сверять планы с людьми, которые будут их выполнять. Арман Теймур остался при страже, Самира Хади при лазаретах; Амин Рашад сдал печать и остался при архиве. Гербы домов сняли со стены, но не уничтожили: журнал учитывает и их."
 SHL_cabinet_story_unratified: "Секретари подготовили акт передачи, но окончательное устройство власти ещё не было закреплено. До ратификации ведомства сохраняли текущие обязанности; печать оставалась у секретаря Конклава."
 minister_SHL_Amin_Rashad: "Амин Рашад"
 minister_SHL_Amin_Rashad_desc: "Секретарь Конклава знает, какая подпись стоит денег, а какая - обязательства. Он соединяет ведомства до ратификации нового порядка и сохраняет этот пост при власти домов."
 minister_SHL_Mariam_Arbin: "Мариам Арбин"
 minister_SHL_Mariam_Arbin_desc: "Председатель городских собраний начинала с водяных ведомостей Арбина. Она требует, чтобы расходы кабинета можно было объяснить тем, кто оплачивает их своими сменами."
 minister_SHL_Rauf_Darban: "Рауф Дарбан"
 minister_SHL_Rauf_Darban_desc: "Начальник диспетчерского управления считает приказ законченным лишь после доставки. В кабинете Дирекции он связывает нормы выпуска, железные дороги и армейские заказы."
 minister_SHL_Darius_Safir: "Дарий Сафир"
 minister_SHL_Darius_Safir_desc: "Регент представляет старшин домов и лично возглавляет их кабинет. Его власть опирается на наследственные обязательства: печь даёт привилегию, но требует содержания и службы."
 minister_SHL_Salima_Darzi: "Салима Дарзи"
 minister_SHL_Salima_Darzi_desc: "Делегат сменных советов сверяет правительственный план с журналами цехов. Она возглавляет кабинет коммуны, не передавая министерские полномочия владельцам печей."
 minister_SHL_Arman_Teymur: "Арман Теймур"
 minister_SHL_Arman_Teymur_desc: "Бывший начальник караванного караула обучает общегосударственную стражу. Ему предстоит собрать девять привычек командования в одну цепь приказов, сохранив опыт местных офицеров."
 minister_SHL_Leyla_Nadiri: "Лейла Надири"
 minister_SHL_Leyla_Nadiri_desc: "Экономист печных товариществ отделяет государственную кассу от семейных счетов. Она отвечает за оборудование и выпуск, даже когда Конклав спорит о том, кому принадлежит готовый металл."
 minister_SHL_Samira_Hadi: "Самира Хади"
 minister_SHL_Samira_Hadi_desc: "Врач рабочих кварталов соединяет фабричные лазареты с городской медициной. Для неё перепись - прежде всего возможность найти больного и вернуть выздоровевшего домой."
 minister_SHL_Farid_Mehr: "Фарид Мехр"
 minister_SHL_Farid_Mehr_desc: "Мастер-наставник добивается общих учебных программ для детей домов и кварталов. Его школы готовят техников и грамотных унтер-офицеров, не подменяя настоящую подготовку выдачей свидетельств."
 minister_SHL_Bahram_Kaveh: "Бахрам Каве"
 minister_SHL_Bahram_Kaveh_desc: "Бывший железнодорожный шифровальщик ищет угрозы в маршрутах грузов и сбоях связи. Его служба защищает расписания, проверяет донесения и не обещает всеведения."
 minister_trait_SHL_cabinet_secretary: "Секретарь девяти домов"
 minister_trait_SHL_city_chair: "Председатель городских собраний"
 minister_trait_SHL_state_dispatcher: "Главный диспетчер Дирекции"
 minister_trait_SHL_house_regent: "Регент наследственных обязательств"
 minister_trait_SHL_shift_delegate: "Делегат сменных советов"
 minister_trait_SHL_guard_coordinator: "Координатор общей стражи"
 minister_trait_SHL_furnace_accountant: "Экономист печных товариществ"
 minister_trait_SHL_shift_physician: "Врач рабочих кварталов"
 minister_trait_SHL_master_instructor: "Наставник технических школ"
 minister_trait_SHL_rail_observer: "Железнодорожный шифровальщик"
 SHL_south_final_ready_tt: "Наступил 2165 год, ключевые фокусы обеих сторон завершены, предупреждение о войне началось. Кампании возвращения и предшествующие войны должны быть закончены."
 SHL_south_oil_for_furnaces: "Нефть для печей"
 SHL_south_oil_for_furnaces_desc: "Светлогорье держит цену на нефть, от которой зависит каждая печь Шахрабада. Конклав десяти больше не будет покупать сырьё у наместников: дома оплатят войну, а промыслы станут их концессией."
 SHL_south_oil_for_furnaces_tt: "Фокус готовит объявление §Yвойны за Юг§! после окончания общего предупреждения. Каждое независимое государство пустынь выберет сторону. При победе северный противник станет §Yнефтяной концессией домов§!, а его союзники - сателлитами Шахрабада."
 SHL_south_war_of_charters: "Война хартий"
 SHL_south_war_of_charters_desc: "Южный договор не может соседствовать с лестницей наместников. Совет городов предлагает каждому району за линией фронта ту же хартию, что получили Хазар и Кейзан."
 SHL_south_war_of_charters_tt: "Фокус готовит объявление §Yвойны за Юг§! после окончания общего предупреждения. Каждое независимое государство пустынь выберет сторону. При победе побеждённые сохранят собственные администрации и войдут в §YХартию Южного договора§!."
 SHL_south_last_pour: "Последняя плавка"
 SHL_south_last_pour_desc: "Дирекция Нура переводит печи на фронт. Железный марш должен закончиться у нефтяного пояса: на Юге останется одна смета и один распорядитель."
 SHL_south_last_pour_tt: "Фокус готовит объявление §Yвойны за Юг§! после окончания общего предупреждения. Каждое независимое государство пустынь выберет сторону. При победе Шахрабад §Yприсоединит§! всех побеждённых."
 SHL_south_war_of_arms: "Война гербов"
 SHL_south_war_of_arms_desc: "Регент обещает домам лены за линией фронта. Гвардии гербов идут за своей долей, а наследственная республика - за правом распоряжаться всем Югом."
 SHL_south_war_of_arms_tt: "Фокус готовит объявление §Yвойны за Юг§! после окончания общего предупреждения. Каждое независимое государство пустынь выберет сторону. При победе Шахрабад §Yприсоединит§! всех побеждённых."
 SHL_south_oil_uprising: "Восстание нефтяников"
 SHL_south_oil_uprising_desc: "Коммуна огня зовёт нефтяников Светлогорья освободиться от лестницы печатей. Её война идёт не за новую границу, а против самой наместнической системы."
 SHL_south_oil_uprising_tt: "Фокус готовит объявление §Yвойны за Юг§! после окончания общего предупреждения. Каждое независимое государство пустынь выберет сторону. При победе Шахрабад §Yприсоединит§! всех побеждённых, а Светлогорское восстание войдёт в коммуну."
 SHL_south_debt_network: "Долговая сеть"
 SHL_south_debt_network_desc: "Дома не воюют с теми, кому можно дать в долг. Кредиты Рахме и Сардану оплачивают их водоводы и караваны, а векселя Конклава делают отказ от протектората слишком дорогим."
 SHL_south_debt_network_tt: "Расход: §Y200§! £ADISCORD_economy_treasury_texticon.\n§YРахма§! и §YСардан§! становятся должниками домов: они значительно охотнее примут торговый протекторат."
 SHL_south_trade_protectorates: "Торговые протектораты"
 SHL_south_trade_protectorates_desc: "Должник, который не может платить, платит суверенитетом. Конклав предлагает Рахме и Сардану стать торговыми протекторатами Золотых ворот."
 SHL_south_trade_protectorates_tt: "§YРахма§! и §YСардан§! получают требование стать сателлитами Шахрабада. Если страна откажется, мы объявим ей войну за полное присоединение."
 SHL_south_great_road: "Великая дорога"
 SHL_south_great_road_desc: "Солнечный престол облагает данью каждый караван на пути к морю. Дома требуют, чтобы Кадир принял их надзор над станциями тракта."
 SHL_south_great_road_tt: "§YКадир§! получает требование стать сателлитом Шахрабада. Если страна откажется, мы объявим ей войну за полное присоединение."
 SHL_south_wells_charters: "Хартии колодцев"
 SHL_south_wells_charters_desc: "Южный договор открыт для каждого, кто признаёт общую воду и право городов на самоуправление. Совет городов приглашает Рахму, Мазар и Сардан."
 SHL_south_wells_charters_tt: "§YРахма§!, §YМазар§! и §YСардан§! получают приглашение вступить в союз Шахрабада. Отказ не ведёт к войне."
 SHL_south_compact_staff: "Штаб договора"
 SHL_south_compact_staff_desc: "Городские дружины получают общий штаб, единые уставы и склады в Хазаре. Договор должен уметь защищать то, что обещает."
 SHL_south_compact_staff_tt: "В Хазаре формируются §Yдве§! полностью вооружённые дружины."
 SHL_south_free_road: "Свободный тракт"
 SHL_south_free_road_desc: "Солнечный престол держит великую дорогу в руках одной семьи. Договор требует, чтобы станции тракта управлялись хартией, а Кадир вошёл в число её членов."
 SHL_south_free_road_tt: "§YКадир§! получает требование войти в Южный договор как сателлит с хартией. Если страна откажется, мы объявим ей войну за полное присоединение."
 SHL_south_water_and_sea: "Земли воды и моря"
 SHL_south_water_and_sea_desc: "Дирекция больше не торгуется за кяризы и порты. Кейзан и Вейр должны войти в состав Шахрабада, чтобы вода и море служили одной смете."
 SHL_south_water_and_sea_tt: "§YКейзан§! и §YВейр§! получают требование присоединиться к Шахрабаду. Если страна откажется, мы объявим ей войну за полное присоединение."
 SHL_south_last_ration: "Последний паёк"
 SHL_south_last_ration_desc: "Палата общего пайка считает металл Шахрабада частью своего распределения. Дирекция отвечает, что распределять будет она."
 SHL_south_last_ration_tt: "§YМазар§! получает требование присоединиться к Шахрабаду. Если страна откажется, мы объявим ей войну за полное присоединение."
 SHL_south_iron_march: "Железный марш"
 SHL_south_iron_march_desc: "Между печами и нефтяным поясом лежат Сардан и Рахма. Железный марш не может оставить в тылу независимые дороги и колодцы."
 SHL_south_iron_march_tt: "§YСардан§! и §YРахма§! получают требование присоединиться к Шахрабаду. Если страна откажется, мы объявим ей войну за полное присоединение."
 SHL_south_throne_and_crests: "Престол и гербы"
 SHL_south_throne_and_crests_desc: "Регент предлагает Солнечному престолу союз старых домов: долю южной дороги в обмен на мечи Кадира в войне за будущие лены."
 SHL_south_throne_and_crests_tt: "§YКадир§! получает приглашение вступить в союз Шахрабада. Отказ не ведёт к войне."
 SHL_south_toll_debtors: "Неплательщики пошлин"
 SHL_south_toll_debtors_desc: "Сардан и Рахма пропускают караваны без пошлин, которые дома считают своими. Регентство требует признать долг и власть гербов."
 SHL_south_toll_debtors_tt: "§YСардан§! и §YРахма§! получают требование стать сателлитами Шахрабада. Если страна откажется, мы объявим ей войну за полное присоединение."
 SHL_south_veyr_debt: "Долг Вейра"
 SHL_south_veyr_debt_desc: "Торговая палата Вейра много лет страховала грузы домов в долг. Регент предъявляет счёт: порты станут залогом наследственной республики."
 SHL_south_veyr_debt_tt: "§YВейр§! получает требование стать сателлитом Шахрабада. Если страна откажется, мы объявим ей войну за полное присоединение."
 SHL_south_councils_abroad: "Советы за рубежом"
 SHL_south_councils_abroad_desc: "Рабочие Мазара и докеры Вейра читают те же листовки, что и смены Хазара. Коммуна предлагает их правительствам встать рядом с советами, пока их не сменили сами рабочие."
 SHL_south_councils_abroad_tt: "§YМазар§! и §YВейр§! получают приглашение вступить в союз Шахрабада. Отказ не ведёт к войне."
 SHL_south_oil_underground: "Подполье Светлогорья"
 SHL_south_oil_underground_desc: "Подпольщики Ярослава Вебера ждут оружия. Каждая винтовка, переправленная через пустыню сейчас, поднимет нефтяников в первый день войны за Юг."
 SHL_south_oil_underground_tt: "Если Светлогорье ведёт северный лагерь и удерживает §YСветлогорский округ§!, в первый день войны за Юг там поднимается §YСветлогорское восстание§! на стороне Шахрабада и получает переданные винтовки.\nПодписанный Светлогорьем договор районов лишит подполье опоры: тогда вернётся §Y13500§! £infantry_equipment_texticon."
 SHL_conclave_power_dynamic: "Сила Конклава"
 SHL_conclave_power_dynamic_desc: "Политическое устройство, гвардии и промышленные союзы Шахрабада складываются в одну власть, которую Конклав может обратить в войну или мир."
 SHL_south_furnaces_to_front: "Печи на фронт"
 SHL_south_furnaces_to_front_desc: "Война за Юг идёт не только на передовой. Каждая плавка теперь может стать винтовкой, если казна оплатит сырьё."
 SHL_south_raid_oil_fields: "Налёты на промыслы"
 SHL_south_raid_oil_fields_desc: "Противник живёт нефтью. Летучие отряды бьют по складам и дорогам Северных месторождений."
 SHL_south_desert_convoys: "Обозы пустыни"
 SHL_south_desert_convoys_desc: "Караванные станции превращаются в армейские склады. Пустыня перестаёт быть препятствием для снабжения."
 SHL_south_storm_oil_belt: "Штурм нефтяного пояса"
 SHL_south_storm_oil_belt_desc: "Противник ослаблен, обозы готовы. Армия Шахрабада идёт на нефтяной пояс."
 SHL_south_crown_of_the_south: "Корона Юга"
 SHL_south_crown_of_the_south_desc: "Юг признаёт первенство печей. Конклав закрепляет общий порядок отношений с сателлитами, концессиями и членами договора, сохраняя их территории и местные правительства."
 SHL_south_raid_oil_tt: "Северный лидер теряет §Y4000§! £fuel_texticon. Если §YСеверные месторождения§! удерживает северный лагерь, там разрушается §Y1§! уровень инфраструктуры."
 SHL_south_war_pour: "Военная плавка"
 SHL_south_war_pour_desc: "Печи переводятся на оружейный металл. Казна оплачивает сырьё, армия получает партию винтовок и снаряжения поддержки."
 SHL_south_raid_oil: "Налёт на промыслы"
 SHL_south_raid_oil_desc: "Летучий отряд выходит к складам Северных месторождений."
 SHL_south_desert_convoys_idea: "Обозы пустыни"
 SHL_south_desert_convoys_idea_desc: "Караванные станции снабжают армию до конца войны за Юг."
 SHL_south_storm_idea: "Штурм нефтяного пояса"
 SHL_south_storm_idea_desc: "Армия Шахрабада наступает на нефтяной пояс."
 SHL_public_campaigns: "Голос печей"
 SHL_public_campaigns_desc: "Цеховые листки, гербовые глашатаи и собрания смен рассказывают Шахрабаду, ради чего горит огонь. Одновременно идёт столько кампаний, сколько открыто мест.\n\nСвободных мест для кампаний: §Y[?ADISCORD_available_campaign_slots|0]§!"
 SHL_campaign_slot_available_tt: "Есть свободное место для кампании: §Y[?ADISCORD_available_campaign_slots|0]§!"
 SHL_campaign_second_slot_tt: "Открывается второе место для кампаний §YГолоса печей§!."
 SHL_campaign_fire_never_sleeps: "§YПРОПАГАНДА:§! Огонь не гаснет"
 SHL_campaign_fire_never_sleeps_desc: "Каждая смена знает, что её плавка кормит город. Мастера держат темп, а цеха гордятся тем, что печи не стоят."
 SHL_campaign_bread_from_furnaces: "§YПРОПАГАНДА:§! Хлеб от печей"
 SHL_campaign_bread_from_furnaces_desc: "Листки рассказывают, сколько хлеба, воды и жилья купила последняя плавка. Кварталы видят, что их работа возвращается к ним."
 SHL_campaign_bread_from_furnaces_result_tt: "По завершении недовольство кварталов снижается на §Y6§!."
 SHL_campaign_honour_of_crests: "§YПРОПАГАНДА:§! Честь гербов"
 SHL_campaign_honour_of_crests_desc: "Глашатаи напоминают, что дома построили первые печи и держали огонь в худшие годы. Гербы чувствуют уважение и меньше требуют."
 SHL_campaign_honour_of_crests_result_tt: "По завершении давление гербов снижается на §Y6§!."
 SHL_campaign_golden_gates_open: "§YПРОПАГАНДА:§! Золотые ворота открыты"
 SHL_campaign_golden_gates_open_desc: "Дома зовут купцов со всего Юга: металл Шахрабада продаётся по честной цене тем, кто платит вовремя."
 SHL_campaign_a_voice_for_every_shift: "§YПРОПАГАНДА:§! Каждой смене - голос"
 SHL_campaign_a_voice_for_every_shift_desc: "Собрания смен решают, кто пойдёт в дружины и как делить выручку. Люди охотнее защищают то, чем управляют сами."
 SHL_campaign_iron_budget: "§YПРОПАГАНДА:§! Железная смета"
 SHL_campaign_iron_budget_desc: "Дирекция обещает одну смету без гербовых привилегий и цеховых поблажек. Заводы работают ровнее, а страна привыкает к мобилизации."
 SHL_campaign_the_south_is_one: "§YПРОПАГАНДА:§! Юг един"
 SHL_campaign_the_south_is_one_desc: "Печи Шахрабада обещают пустыням металл, воду и защиту. Наместническая лестница Светлогорья изображается старой имперской цепью."
 SHL_receive_250_tt: "Казна: §G+250§! £ADISCORD_economy_treasury_texticon."
 SHL_houses_prog_ending_a: "Республика гербов"
 SHL_houses_prog_ending_a_desc: "Гербы становятся государством. Кварталы и мастера теряют вес в Конклаве."
 SHL_houses_prog_ending_b: "Конклав равных"
 SHL_houses_prog_ending_b_desc: "Дома признают мастеров и кварталы равными участниками Конклава."
 SHL_cities_prog_ending_a: "Республика городов"
 SHL_cities_prog_ending_a_desc: "Кварталы получают решающий голос. Дома остаются лишь владельцами своих печей."
 SHL_cities_prog_ending_b: "Технократический Конклав"
 SHL_cities_prog_ending_b_desc: "Мастера управляют печами и государством. Гербы теряют свою власть."
 SHL_directorate_prog_ending_a: "Дирекция Шахрабада"
 SHL_directorate_prog_ending_a_desc: "Дирекция становится государством. Гербы теряют последние привилегии."
 SHL_directorate_prog_ending_b: "Военная дирекция"
 SHL_directorate_prog_ending_b_desc: "Гвардии получают решающий голос. Шахрабад живёт по законам военного времени."
 SHL_regency_prog_ending_a: "Наследственная диктатура"
 SHL_regency_prog_ending_a_desc: "Гвардии становятся государством. Кварталы молчат."
 SHL_regency_prog_ending_b: "Республика долгов"
 SHL_regency_prog_ending_b_desc: "Дома правят через долговые книги. Всё в Шахрабаде кому-то заложено."
 SHL_commune_prog_ending_a: "Огненная коммуна"
 SHL_commune_prog_ending_a_desc: "Кварталы правят Шахрабадом. От власти гербов не осталось и следа."
 SHL_commune_prog_ending_b: "Союз мастерских"
 SHL_commune_prog_ending_b_desc: "Мастерские объединяются в союз, и гербы теряют последние печи."
 ADISCORD_shl_fire.11.t: "Новое устройство Шахрабада"
 ADISCORD_shl_fire.11.a: "Таков новый Шахрабад."
 ADISCORD_shl_fire.11.d_houses_prog_ending_a: "Республика гербов.\n\nГербы стали государством. Конклав десяти закрепил за наследственными домами право говорить от имени Шахрабада, и десятый герб Товарищества мастеров и инженеров висит в зале рядом с девятью старыми, ничем от них не отличаясь. Голшан Лоран ведёт картель Золотых ворот как министерство торговли, Дарий Сафир - казну как собственный дом, Бехруз Вейран - гвардии как армию. Амин Рашад подписывает за кабинет, Джалиль Нур - за Конклав.\n\nКварталы и мастера потеряли вес в зале: их реестры признаны, но голоса нет. Салима Дарзи ведёт журнал советов смен в Шариме, и журнал этот читают внимательнее, чем прежде, - дома помнят холодную смену. Мариам Арбин распустила городские собрания и вернулась к водяным ведомостям отца.\n\nШахрабад богат, спокоен и принадлежит десяти семьям. Закон непрерывного огня защищает их от города так же, как когда-то защищал город от них."
 ADISCORD_shl_fire.11.d_houses_prog_ending_b: "Конклав равных.\n\nДома признали мастеров и кварталы равными участниками Конклава. Десятый герб достался Товариществу мастеров и инженеров, но вместе с ним в зал вошли делегаты советов смен и городских собраний - без гербов над креслами и с правом голоса по промышленной ведомости. Джалиль Нур по-прежнему посредник, только мирить ему теперь приходится не девять домов, а три сословия.\n\nГолшан Лоран назвал это концом Золотых ворот, но его картель работает; Дарий Сафир - концом казны, но она полна. Хосров Арбин сидит в одном зале с дочерью и признаёт, что город отца и собрания дочери спорят о тех же кяризах. Салима Дарзи подписывает решения советов рядом с подписью Ширин Шарим, и обе не стали от этого друзьями.\n\nШахрабад остался Конклавом, но гербы в нём больше не единственный язык. Закон непрерывного огня теперь читают вслух при всех."
 ADISCORD_shl_fire.11.d_cities_prog_ending_a: "Республика городов.\n\nКварталы получили решающий голос. Южный договор превратил городские собрания в государство: Мариам Арбин ведёт Шахрабад из Хазара, протоколы собраний печатаются раньше ведомостей домов, а делегаты кварталов заседают в зале, где когда-то висели только гербы. Самира Хади получила больницы, Фарид Мехр - школы, Лейла Надири - открытую казну.\n\nДома остались лишь владельцами своих печей. Закон непрерывного огня действует, но даёт собственность, а не голос: Голшан Лоран торгует, Тахмурас Байрат копает, Бехруз Вейран охраняет границу - и ни один из них не решает, куда уходит выручка. Хосров Арбин подписал договор последним и отдельной строкой, как глава дома, а не как отец.\n\nШахрабад стал страной городов, и соседям - Кейзану, Вейру, Мазару - предложено войти в тот же договор. Хартии колодцев заменили ультиматумы; надолго ли, покажут собрания."
 ADISCORD_shl_fire.11.d_cities_prog_ending_b: "Технократический Конклав.\n\nМастера управляют печами и государством. Южный договор отдал Конклав Товариществу мастеров и инженеров и советам смен: кресла занимают не гербы и не делегаты улиц, а те, кто отвечает за кладку, сырьё и выпуск. Рауф Дарбан ведёт промышленность, Фарид Мехр - школы мастеров, Лейла Надири - единую смету, а Мариам Арбин подписывает за государство то, что мастера уже решили в цехах.\n\nГербы потеряли свою власть. Дома владеют печами на бумаге, но ремонт, смены и подвоз назначает Конклав, и Ширин Шарим узнаёт о графике своей печи из журнала Салимы Дарзи. Дарий Сафир называет это экспроприацией по ведомости; Голшан Лоран продолжает продавать металл, потому что иначе не умеет.\n\nШахрабад управляется как одно предприятие. Закон непрерывного огня по-прежнему связывает голос с печью, только голос теперь принадлежит смене, а не фамилии."
 ADISCORD_shl_fire.11.d_directorate_prog_ending_a: "Дирекция Шахрабада.\n\nДирекция стала государством. Все печи переданы Дирекции печей, Джалиль Нур называется директором, а Рауф Дарбан - главой кабинета, и приказ из Хазара доходит до каждого цеха без согласия дома. Арман Теймур получил стражу, Лейла Надири - единую смету, Бахрам Каве - право читать расписания всех караванов. Гербы висят в зале как память.\n\nДома потеряли последние привилегии. Дарий Сафир сохранил казну, но не право ею распоряжаться; Голшан Лоран торгует по квотам Дирекции; Бехруз Вейран сдал гвардии в общий реестр. Кварталы получили ровные смены и закрытый журнал: Салима Дарзи ведёт его, но читает его теперь Дирекция.\n\nШахрабад работает как единый завод. Закон непрерывного огня переписан: печь горит для государства, и голос принадлежит тому, кто подписывает смету."
 ADISCORD_shl_fire.11.d_directorate_prog_ending_b: "Военная дирекция.\n\nГвардии получили решающий голос. Дирекция печей оказалась дирекцией арсеналов: Джалиль Нур носит титул директора, но смету, стражу и очередь плавок определяют Арман Теймур и Рауф Дарбан, а Бехруз Вейран ввёл гвардии пограничного дома в общий реестр и возглавил его. Бахрам Каве читает каждое письмо, уходящее из Хазара.\n\nШахрабад живёт по законам военного времени. Печи отливают оружие раньше проката, Голшан Лоран продаёт то, что осталось, Дарий Сафир финансирует то, что приказано. Кварталы получили военный паёк и запрет стачек; Салима Дарзи ведёт журнал советов смен под надзором стражи. Мариам Арбин уехала из Хазара к печи отца.\n\nЗакон непрерывного огня действует: печи горят, Конклав молчит, Дирекция приказывает. Соседям объяснено, что железный марш - не угроза, а расписание."
 ADISCORD_shl_fire.11.d_regency_prog_ending_a: "Наследственная диктатура.\n\nГвардии стали государством. Дарий Сафир правит как регент Совета гербов, и совет этот собирается редко: казна Сафира платит гвардиям Бехруза Вейрана, гвардии охраняют печи домов, дома молчат, потому что их печи горят. Джалиль Нур - посредник по имени; Амин Рашад хранит архив, но не печать.\n\nКварталы молчат. Советы смен распущены, журнал Салимы Дарзи изъят, Шарим работает усиленными сменами под караулом. Мариам Арбин уехала из Хазара, и собрания закрыты. Голшан Лоран торгует как прежде, Тахмурас Байрат отгружает руду как прежде, и только Хосров Арбин, глядя на пустые кресла, говорит, что Конклав был лучше.\n\nЗакон непрерывного огня стал законом о собственности: печь горит, значит, дом прав. Кто гасит печи, выясняет гвардия."
 ADISCORD_shl_fire.11.d_regency_prog_ending_b: "Республика долгов.\n\nДома правят через долговые книги. Регентство Дария Сафира не отобрало ничего силой: оно дало взаймы. Печи заложены под выручку, кварталы - под смены, соседи - под пошлины, и каждая закладная лежит в казне Сафира. Лейла Надири ведёт книгу залогов вместо промышленной ведомости; Голшан Лоран скупает долги Вейра, Ферейдун Кердан - долги дороги к морю.\n\nВсё в Шахрабаде кому-то заложено. Джалиль Нур должен Сафиру за кресло посредника, Хосров Арбин - за воду, Рауф Дарбан - за десятую печь, которая строилась на кредит. Советы смен не распущены, но их журнал - тоже закладная: долг кварталов списывают за тихие смены. Мариам Арбин ведёт собрания, у которых нет денег.\n\nЗакон непрерывного огня читается теперь иначе: печь горит, пока оплачен процент. Кто не платит, тот гаснет."
 ADISCORD_shl_fire.11.d_commune_prog_ending_a: "Огненная коммуна.\n\nКварталы правят Шахрабадом. Советы смен взяли печи, и дежурный мастер Салима Дарзи подписывает за коммуну то, что решили цеха. Гербы сняли со стены зала Конклава; на их месте висят рабочие журналы девяти печей, и десятая запись - Девятипечье - сделана первой. Самира Хади ведёт лазареты, Фарид Мехр - школы смен, Арман Теймур - стражу, которая теперь называется дружиной.\n\nОт власти гербов не осталось и следа. Дарий Сафир уехал в Вейр, Бехруз Вейран увёл гвардии за границу, Ширин Шарим осталась в Шариме как мастер, а не как хозяйка. Хосров Арбин сдал печь совету и, к удивлению дочери, остался при ней: кяризы он знает лучше всех. Мариам Арбин ведёт собрания, но подписывает за них коммуна.\n\nЗакон непрерывного огня действует буквально: печь принадлежит тем, кто держит её огонь. Соседям предложено то же самое."
 ADISCORD_shl_fire.11.d_commune_prog_ending_b: "Союз мастерских.\n\nМастерские объединились в союз, и гербы потеряли последние печи. Коммуна огня не стала государством одной столицы: каждая печь - свой совет, каждый совет - свой журнал, а Салима Дарзи как дежурный мастер подписывает только то, что согласовали все девять. Десятая печь в Девятипечье - общая, и спор о ней закрыт тем, что ею владеет союз.\n\nДома ушли из Хазара. Голшан Лоран торгует металлом союза за комиссию, потому что иначе не умеет; Тахмурас Байрат остался в рудниках как мастер; Дарий Сафир и Бехруз Вейран уехали за границу и пишут оттуда соседям. Рауф Дарбан вошёл в союз как инженер и ведёт десятую печь. Мариам Арбин распустила собрания: в союзе мастерских нет городов, есть цеха.\n\nЗакон непрерывного огня стал уставом союза: печь горит, значит, совет в силе. Общие котлы заменили казну, братские поставки - экспорт."
 SHL_desert_guard_contracts: "Контракты пустынной стражи"
 SHL_desert_guard_contracts_desc: "Наёмная стража пустыни готова служить Конклаву за плату."
 SHL_metal_market: "Рынок металла"
 SHL_metal_market_desc: "Излишки сырья можно продать на рынке, когда казне нужны деньги."
 SHL_incident_office: "Служба происшествий"
 SHL_incident_office_desc: "Взрывы, стачки и скандалы больше не застают Конклав врасплох. Служба держит аварийный фонд и гасит происшествия прежде, чем они разрастутся."
 SHL_counting_chamber: "Счётная палата"
 SHL_counting_chamber_desc: "Палата проверяет дивиденды, сметы и караванные накладные. Из найденных денег оплачиваются пожарные дружины цехов и мировые посредники смен."
 SHL_incident_office_tt: "Происшествия случаются §Gвдвое реже§!."
 SHL_counting_chamber_tt: "Взрыв в цехе и поиск пропавшего каравана обходятся без затрат казны.\nУступка бастующей смене стоит §Y100§! £ADISCORD_economy_treasury_texticon вместо §Y250§!.\nСкандал дивидендов можно замять за §Y30§! £political_power_texticon вместо §Y60§!, а расследование казнокрадства возвращает §G250§! £ADISCORD_economy_treasury_texticon вместо §G100§!."
 SHL_treasury: "Казна Конклава"
 SHL_treasury_desc: "Казна: §Y[?ADISCORD_economy_treasury|0]§! £ADISCORD_economy_treasury_texticon\n\nДеньги и политическая власть обмениваются друг на друга. Каждый цикл печей несёт небольшой риск происшествия; чрезвычайная казна закрывает любое из них без потерь."
 SHL_bond_payments: "Выплаты по облигациям"
 SHL_bond_payments_desc: "Конклав расплачивается с держателями облигаций печей."
 SHL_furnace_bonds: "Облигации печей"
 SHL_furnace_bonds_desc: "Деньги сейчас под залог будущих плавок. Выплаты будут стоить Конклаву политического веса."
 SHL_decree_levy: "Чрезвычайный сбор"
 SHL_decree_levy_desc: "Конклав вводит разовый сбор указом."
 SHL_hire_desert_guard: "Нанять пустынную стражу"
 SHL_hire_desert_guard_desc: "Отряд наёмной стражи прибывает в Хазар."
 SHL_hire_desert_guard_tt: "В Хазаре формируется §Yодна§! вооружённая дружина."
 SHL_metal_dumping: "Продать сырьё"
 SHL_metal_dumping_desc: "Два пакета сырья из резерва продаются на рынке."
 SHL_metal_dumping_tt: "Резерв сырья: §R-2§!. Казна: §G+250§! £ADISCORD_economy_treasury_texticon."
 SHL_crisis_fund: "Пополнить чрезвычайную казну"
 SHL_crisis_fund_desc: "Отложенные деньги закроют следующее происшествие без потерь."
 SHL_crisis_prevention: "Профилактика происшествий"
 SHL_crisis_prevention_desc: "Проверки цехов и караванов на полгода вперёд."
 SHL_crisis_fund_tt: "Следующее происшествие можно закрыть §Gбез потерь§!."
 SHL_crisis_prevention_tt: "Происшествия не случаются §Y180§! дней."
 SHL_crisis_fund_used_tt: "Расходуется чрезвычайная казна."
 SHL_crisis_free_tt: "Обходится без затрат."
 SHL_crisis_pay_250_tt: "Казна: §R-250§! £ADISCORD_economy_treasury_texticon."
 SHL_crisis_pay_100_tt: "Казна: §R-100§! £ADISCORD_economy_treasury_texticon."
 ADISCORD_shl_crisis.1.t: "Взрыв в цехе"
 ADISCORD_shl_crisis.1.d: "В одном из цехов печного округа взорвался котёл. Пар сорвал крышу литейного пролёта, есть раненые; Самира Хади увезла их в лазарет при печи, не спрашивая, в чьём реестре они числятся. Печь не погасла - кочегары удержали огонь, - но цех вокруг неё стоит, и смены ждут, кто оплатит восстановление.\n\nРабочие кварталы требуют, чтобы Конклав заплатил: котёл числился в промышленной ведомости исправным, и подпись дома под этой записью видели все. Дом отвечает, что смена перегрела котёл ради усиленной плавки. Лейла Надири подняла ведомость: ремонт откладывали три цикла подряд. Салима Дарзи уже записала в журнал советов смен имена раненых.\n\nКонклав может оплатить восстановление из казны и закрыть вопрос, или оставить цех дому и его сменам - пусть чинят сами и помнят, кто отказал. Если в чрезвычайной казне есть деньги, происшествие закроется без спора."
 ADISCORD_shl_crisis.1.a: "Оплатить восстановление."
 ADISCORD_shl_crisis.1.b: "Пусть цех чинят сами."
 ADISCORD_shl_crisis.1.z: "Чрезвычайная казна."
 ADISCORD_shl_crisis.2.t: "Караван пропал в пустыне"
 ADISCORD_shl_crisis.2.d: "Караван с рудой из рудников Байрата не дошёл до Хазара. Погонщики должны были пройти сухое русло за три дня; на пятый день в Хазар пришёл один верблюд без вьюка. Тахмурас Байрат клянётся, что руда была отгружена и записана, и требует, чтобы Конклав искал свой груз сам: рудники за пустыню не отвечают.\n\nБахрам Каве перебирает донесения: песчаная буря, обвал в русле, налётчики из-за границы или просто погонщик, продавший руду в Кейзане. Бехруз Вейран предлагает отряд гвардии - за плату. Лейла Надири подсчитала стоимость поисков и стоимость потерянного груза; суммы близки, и выбор между ними - вопрос не денег, а того, захотят ли следующие караваны идти через русло.\n\nКонклав может снарядить поиски и вернуть то, что найдёт, или списать груз и взять два пакета из общего резерва, чтобы следующая смена не осталась без сырья. Чрезвычайная казна, если она есть, закроет вопрос без потерь."
 ADISCORD_shl_crisis.2.a: "Снарядить поиски."
 ADISCORD_shl_crisis.2.b: "Списать груз."
 ADISCORD_shl_crisis.2.z: "Чрезвычайная казна."
 ADISCORD_shl_crisis.3.t: "Ночная стачка"
 ADISCORD_shl_crisis.3.d: "Ночная смена не вышла к печам. Старосты цехов Шарима и Кердана собрались у ворот и требуют прибавки за ночной труд: дневные смены оплачены по ведомости, ночные - по старой домовой норме, которую Ширин Шарим не пересматривала с прошлого цикла. Кочегары держат огонь, металл не идёт.\n\nЭто не холодная смена и не Совет смен - старосты не просят власти, они просят денег. Но Салима Дарзи стоит среди них с журналом, и в нём записано, сколько ночей дом не оплатил. Ширин Шарим требует от Конклава не вмешиваться: это дело дома. Хосров Арбин напоминает, что ночные смены есть у всех девяти печей, и завтра у его ворот будут стоять те же старосты. Лейла Надири подсчитала прибавку и сравнила с потерей ночной плавки.\n\nКонклав может уступить сменам и оплатить прибавку из казны, или перетерпеть и дать дому справиться с ночными сменами самому. Чрезвычайная казна закроет вопрос без следа в журнале."
 ADISCORD_shl_crisis.3.a: "Уступить сменам."
 ADISCORD_shl_crisis.3.b: "Перетерпеть."
 ADISCORD_shl_crisis.3.z: "Чрезвычайная казна."
 ADISCORD_shl_crisis.4.t: "Скандал дивидендов"
 ADISCORD_shl_crisis.4.d: "Листки кварталов пишут, что дома получили дивиденды из денег, отложенных на ремонт печей. Подпись под листком не стоит, но цифры взяты из промышленной ведомости, и Лейла Надири признаёт, что ведомость верна: два дома провели ремонт по бумагам и выплатили разницу гербам. Какие именно дома, листки называют - Сафир и Лоран, - а Конклав ещё нет.\n\nДарий Сафир требует найти, кто вынес ведомость из архива. Голшан Лоран объясняет, что дивиденды оплатили экспортные договоры, а ремонт сделают в следующем цикле. Мариам Арбин зачитала листок в собрании вслух. Бахрам Каве знает, откуда утечка, но спрашивает, нужно ли Конклаву это знать. Амин Рашад напоминает, что ведомость для того и велась, чтобы её читали.\n\nДело можно замять - это стоит политического веса и даст домам понять, что архив закрыт. Можно открыть ведомость целиком: кварталы успокоятся, гербы запомнят. Чрезвычайная казна закроет вопрос тихо."
 ADISCORD_shl_crisis.4.a: "Замять дело."
 ADISCORD_shl_crisis.4.b: "Открыть ведомость."
 ADISCORD_shl_crisis.4.z: "Чрезвычайная казна."
 ADISCORD_shl_crisis.5.t: "Казнокрадство в дирекции"
 ADISCORD_shl_crisis.5.d: "Ревизоры Счётной палаты нашли расхождения в сметах дирекции: арсенальные заказы оплачены дважды, подвоз сырья - по тарифу, которого нет ни у Байрата, ни у Кердана. Лейла Надири принесла обе ведомости в Конклав; Рауф Дарбан, отвечающий за дирекцию, потребовал назвать имена прежде, чем обвинять его ведомство. Имена есть, и часть из них принадлежит домам.\n\nРасследование потребует политического веса: придётся допрашивать поверенных Сафира и управляющих Лорана, а Бахрам Каве предупреждает, что след уходит к экспортным договорам, которых Конклав не хотел бы трогать. Но деньги вернутся - часть сразу, часть после. Замять дело проще: ведомости перепишут, сметы сойдутся, и кварталы узнают об этом из листков.\n\nКонклав может расследовать и вернуть казне то, что найдёт, или замять и заплатить стабильностью. Салима Дарзи уже спросила в журнале, куда ушли деньги на подвоз."
 ADISCORD_shl_crisis.5.a: "Расследовать."
 ADISCORD_shl_crisis.5.b: "Замять."
 SHL_crisis_1_b_tt: "Недовольство кварталов: §R+8§!."
