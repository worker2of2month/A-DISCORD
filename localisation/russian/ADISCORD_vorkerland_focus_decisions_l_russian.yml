l_russian:
 ADISCORD_vorkerland_focus_operations_category:0 "Последняя кампания Воркерланда"
 ADISCORD_vorkerland_focus_operations_category_desc:0 "Открытые фокусами меры для центральной схватки и последующего контролируемого воссоединения."
 ADISCORD_vorkerland_allied_support_category:0 "Поддержка союзного фронта"
 ADISCORD_vorkerland_allied_support_category_desc:0 "Ограниченные поставки уже существующему военному союзнику. Эти меры не создают альянсы и не втягивают нейтральные страны в войну."

 ADISCORD_vorkerland_focus_central_minor_front_deadline:0 "Завершить текущий фронт консолидации"
 ADISCORD_vorkerland_focus_central_minor_front_deadline_desc:0 "Подтверждённая кампания против указанной центральной цели будет принудительно завершена через 240 дней и не сможет навсегда заблокировать следующий этап."

 ADISCORD_vorkerland_consolidate_eyr:0 "Открыть Эйрмийский фронт"
 ADISCORD_vorkerland_consolidate_eyr_desc:0 "После суточной проверки выхода из фракций открыть наш единственный действующий фронт консолидации против Республики Эйрми."
 ADISCORD_vorkerland_consolidate_egc:0 "Открыть Зшатский фронт"
 ADISCORD_vorkerland_consolidate_egc_desc:0 "После суточной проверки выхода из фракций открыть наш единственный действующий фронт консолидации против Зшатской хунты."
 ADISCORD_vorkerland_consolidate_riv:0 "Открыть Ривенский фронт"
 ADISCORD_vorkerland_consolidate_riv_desc:0 "После суточной проверки выхода из фракций открыть наш единственный действующий фронт консолидации против Ривена."
 ADISCORD_vorkerland_consolidate_rev:0 "Открыть Ревельский фронт"
 ADISCORD_vorkerland_consolidate_rev_desc:0 "После суточной проверки выхода из фракций открыть наш единственный действующий фронт консолидации против Ревеля."
 ADISCORD_vorkerland_consolidate_yor:0 "Открыть Йорский фронт"
 ADISCORD_vorkerland_consolidate_yor_desc:0 "После суточной проверки выхода из фракций открыть наш единственный действующий фронт консолидации против Йорской республики."
 ADISCORD_vorkerland_consolidate_ndn:0 "Открыть Норденский фронт"
 ADISCORD_vorkerland_consolidate_ndn_desc:0 "После суточной проверки выхода из фракций открыть наш единственный действующий фронт консолидации против Нордена."
 ADISCORD_vorkerland_consolidate_swb:0 "Открыть Староворкенсбергский фронт"
 ADISCORD_vorkerland_consolidate_swb_desc:0 "После суточной проверки выхода из фракций открыть наш единственный действующий фронт консолидации против Старого Воркенсберга."
 ADISCORD_vorkerland_consolidate_vhv:0 "Открыть Верховский фронт"
 ADISCORD_vorkerland_consolidate_vhv_desc:0 "После суточной проверки выхода из фракций открыть наш единственный действующий фронт консолидации против Верховья."
 ADISCORD_vorkerland_consolidate_osv:0 "Открыть Оствинский фронт"
 ADISCORD_vorkerland_consolidate_osv_desc:0 "После суточной проверки выхода из фракций открыть наш единственный действующий фронт консолидации против Оствина."
 ADISCORD_vorkerland_commit_to_central_showdown:0 "Вступить в центральную схватку"
 ADISCORD_vorkerland_commit_to_central_showdown_desc:0 "После завершения всех девяти центральных войн и закрытия последнего фронта консолидации передать одновременный запуск трёх рёбер общему контроллеру фаз."
 ADISCORD_vorkerland_wkr_retreat_levy_1:0 "Созвать первый рабочий резерв"
 ADISCORD_vorkerland_wkr_retreat_levy_1_desc:0 "Через семь дней в удерживаемой столице соберётся один плохо оснащённый отряд ополчения."
 ADISCORD_vorkerland_wkr_retreat_levy_2:0 "Созвать последний рабочий резерв"
 ADISCORD_vorkerland_wkr_retreat_levy_2_desc:0 "Последний и ещё более слабый столичный резерв. После него новые отряды этой линии недоступны."
 ADISCORD_vorkerland_vad_retreat_levy_1:0 "Созвать первый резерв канцелярии"
 ADISCORD_vorkerland_vad_retreat_levy_1_desc:0 "Через семь дней в удерживаемой столице соберётся один плохо оснащённый охранный отряд."
 ADISCORD_vorkerland_vad_retreat_levy_2:0 "Созвать последний резерв канцелярии"
 ADISCORD_vorkerland_vad_retreat_levy_2_desc:0 "Последний и ещё более слабый столичный резерв. После него новые отряды этой линии недоступны."
 ADISCORD_vorkerland_tva_retreat_levy_1:0 "Созвать первый технический резерв"
 ADISCORD_vorkerland_tva_retreat_levy_1_desc:0 "Через семь дней в удерживаемой столице соберётся один плохо оснащённый технический отряд."
 ADISCORD_vorkerland_tva_retreat_levy_2:0 "Созвать последний технический резерв"
 ADISCORD_vorkerland_tva_retreat_levy_2_desc:0 "Последний и ещё более слабый столичный резерв. После него новые отряды этой линии недоступны."
 ADISCORD_vorkerland_restore_core_claimant_homes:0 "Восстановить земли претендентов"
 ADISCORD_vorkerland_restore_core_claimant_homes_desc:0 "Вернуть общие земли претендентов после установления владения и контроля над всем точным пакетом. Это решение не зависит от остальных линий восстановления."
 ADISCORD_vorkerland_restore_core_central_historical:0 "Восстановить исторический центр"
 ADISCORD_vorkerland_restore_core_central_historical_desc:0 "Восстановить администрацию WRK во всём историческом центральном пакете независимо от окраинных территорий."
 ADISCORD_vorkerland_restore_core_rimat:0 "Интегрировать Римат"
 ADISCORD_vorkerland_restore_core_rimat_desc:0 "Вернуть национальную территорию WRK в Римате после установления полного владения и контроля над регионом."
 ADISCORD_vorkerland_restore_core_techlar:0 "Интегрировать Техлар"
 ADISCORD_vorkerland_restore_core_techlar_desc:0 "Вернуть национальную территорию WRK в Техларе после установления полного владения и контроля над регионом."
 ADISCORD_vorkerland_restore_core_ebern:0 "Интегрировать Эберн"
 ADISCORD_vorkerland_restore_core_ebern_desc:0 "Вернуть национальную территорию WRK в Эберне после установления полного владения и контроля над регионом."
 ADISCORD_vorkerland_restore_core_solar:0 "Интегрировать Соларский округ"
 ADISCORD_vorkerland_restore_core_solar_desc:0 "Вернуть три национальные территории Соларского округа после установления полного владения и контроля; существование правительства SOL не требуется."
 ADISCORD_vorkerland_send_vla_support_tranche_1:0 "Снабдить вспомогательный фронт Вольнограда"
 ADISCORD_vorkerland_send_vla_support_tranche_1_desc:0 "После принятия союза WKR и VLA передать действующему фронту Вольнограда 300 единиц пехотного и 30 единиц вспомогательного снаряжения. Следующую поставку можно готовить лишь через 90 дней."
 ADISCORD_vorkerland_send_vla_support_tranche_2:0 "Возобновить поддержку Вольнограда"
 ADISCORD_vorkerland_send_vla_support_tranche_2_desc:0 "Отправить Вольнограду вторую и последнюю ограниченную партию снаряжения."
 ADISCORD_vorkerland_send_sol_support_tranche_1:0 "Снабдить союзный фронт Солнечной"
 ADISCORD_vorkerland_send_sol_support_tranche_1_desc:0 "После союза VAD и SOL либо подтверждённого восстановления передать действующему союзному фронту SOL 300 единиц пехотного и 30 единиц вспомогательного снаряжения. Следующую поставку можно готовить лишь через 90 дней."
 ADISCORD_vorkerland_send_sol_support_tranche_2:0 "Возобновить поддержку Солнечной"
 ADISCORD_vorkerland_send_sol_support_tranche_2_desc:0 "Отправить Солнечной вторую и последнюю ограниченную партию снаряжения."
 ADISCORD_vorkerland_allied_supply_advisers:0 "Советники по союзному снабжению"
 ADISCORD_vorkerland_allied_supply_advisers_desc:0 "Временная группа советников распределяет доставленное имущество и координирует его переброску на фронт."
