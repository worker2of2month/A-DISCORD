l_russian:
 ADISCORD_vorkerland_focus_operations_category:0 "Последняя кампания Воркерланда"
 ADISCORD_vorkerland_focus_operations_category_desc:0 "Ранние кампании в центральных округах, гражданское устройство занятых земель и подготовка к решающей войне претендентов."
 ADISCORD_vorkerland_allied_support_category:0 "Поддержка союзного фронта"
 ADISCORD_vorkerland_allied_support_category_desc:0 "Ограниченные поставки уже существующему военному союзнику. Эти меры не создают альянсы и не втягивают нейтральные страны в войну."

 ADISCORD_vorkerland_focus_central_minor_front_deadline:0 "Завершить текущий фронт консолидации"
 ADISCORD_vorkerland_focus_central_minor_front_deadline_desc:0 "Если текущая центральная кампания не завершится за 240 дней, чрезвычайное командование принудительно присоединит земли противника и закроет фронт."

 ADISCORD_vorkerland_consolidate_eyr:0 "Открыть Эйрмийский фронт"
 ADISCORD_vorkerland_consolidate_eyr_desc:0 "Изолировать Республику Эйрми и начать единственную действующую кампанию по подчинению центральных земель. Следующий фронт можно открыть лишь после завершения этого."
 ADISCORD_vorkerland_consolidate_egc:0 "Открыть Зшатский фронт"
 ADISCORD_vorkerland_consolidate_egc_desc:0 "Изолировать Зшатскую хунту и начать единственную действующую кампанию по подчинению центральных земель. Следующий фронт можно открыть лишь после завершения этого."
 ADISCORD_vorkerland_consolidate_riv:0 "Открыть Ривенский фронт"
 ADISCORD_vorkerland_consolidate_riv_desc:0 "Изолировать Ривен и начать единственную действующую кампанию по подчинению центральных земель. Следующий фронт можно открыть лишь после завершения этого."
 ADISCORD_vorkerland_consolidate_rev:0 "Открыть Ревельский фронт"
 ADISCORD_vorkerland_consolidate_rev_desc:0 "Изолировать Ревель и начать единственную действующую кампанию по подчинению центральных земель. Следующий фронт можно открыть лишь после завершения этого."
 ADISCORD_vorkerland_consolidate_yor:0 "Открыть Йорский фронт"
 ADISCORD_vorkerland_consolidate_yor_desc:0 "Изолировать Йорскую республику и начать единственную действующую кампанию по подчинению центральных земель. Следующий фронт можно открыть лишь после завершения этого."
 ADISCORD_vorkerland_consolidate_ndn:0 "Открыть Норденский фронт"
 ADISCORD_vorkerland_consolidate_ndn_desc:0 "Изолировать Норден и начать единственную действующую кампанию по подчинению центральных земель. Следующий фронт можно открыть лишь после завершения этого."
 ADISCORD_vorkerland_consolidate_swb:0 "Открыть Староворкенсбергский фронт"
 ADISCORD_vorkerland_consolidate_swb_desc:0 "Изолировать Старый Воркенсберг и начать единственную действующую кампанию по подчинению центральных земель. Следующий фронт можно открыть лишь после завершения этого."
 ADISCORD_vorkerland_consolidate_vhv:0 "Открыть Верховский фронт"
 ADISCORD_vorkerland_consolidate_vhv_desc:0 "Изолировать Верховье и начать единственную действующую кампанию по подчинению центральных земель. Следующий фронт можно открыть лишь после завершения этого."
 ADISCORD_vorkerland_consolidate_osv:0 "Открыть Оствинский фронт"
 ADISCORD_vorkerland_consolidate_osv_desc:0 "Изолировать Оствин и начать единственную действующую кампанию по подчинению центральных земель. Следующий фронт можно открыть лишь после завершения этого."
 ADISCORD_vorkerland_integrate_eyr_district:0 "Учредить гражданскую администрацию Эйрми"
 ADISCORD_vorkerland_integrate_eyr_district_desc:0 "Провести перепись, восстановить окружные учреждения и включить все занятые земли Эйрми в нашу систему управления."
 ADISCORD_vorkerland_integrate_egc_district:0 "Учредить гражданскую администрацию Зшата"
 ADISCORD_vorkerland_integrate_egc_district_desc:0 "Заменить распущенное гарнизонное командование обычными окружными учреждениями на всей занятой территории Зшата."
 ADISCORD_vorkerland_integrate_riv_district:0 "Учредить гражданскую администрацию Ривена"
 ADISCORD_vorkerland_integrate_riv_district_desc:0 "Восстановить окружное управление и включить все занятые земли Ривена в нашу административную систему."
 ADISCORD_vorkerland_integrate_rev_district:0 "Учредить гражданскую администрацию Ревеля"
 ADISCORD_vorkerland_integrate_rev_district_desc:0 "Восстановить окружное управление и включить все занятые земли Ревеля в нашу административную систему."
 ADISCORD_vorkerland_integrate_yor_district:0 "Учредить гражданскую администрацию Йора"
 ADISCORD_vorkerland_integrate_yor_district_desc:0 "Восстановить окружное управление и включить все занятые земли Йора в нашу административную систему."
 ADISCORD_vorkerland_integrate_ndn_district:0 "Учредить гражданскую администрацию Нордена"
 ADISCORD_vorkerland_integrate_ndn_district_desc:0 "Восстановить местные учреждения и включить полностью занятый Норденский округ в нашу административную систему."
 ADISCORD_vorkerland_integrate_swb_district:0 "Учредить администрацию Старого Воркенсберга"
 ADISCORD_vorkerland_integrate_swb_district_desc:0 "Восстановить местные учреждения и включить полностью занятый округ Старого Воркенсберга в нашу административную систему."
 ADISCORD_vorkerland_integrate_vhv_district:0 "Учредить гражданскую администрацию Верховья"
 ADISCORD_vorkerland_integrate_vhv_district_desc:0 "Восстановить окружное управление и включить все занятые земли Верховья в нашу административную систему."
 ADISCORD_vorkerland_integrate_osv_district:0 "Учредить гражданскую администрацию Оствина"
 ADISCORD_vorkerland_integrate_osv_district_desc:0 "Восстановить окружное управление и включить все занятые земли Оствина в нашу административную систему."
 ADISCORD_vorkerland_integrate_central_district_tt:0 "После завершения работ все земли округа станут национальной территорией. Необходимо сохранять полное владение и контроль."
 ADISCORD_vorkerland_central_districts_integrated_tt:0 "Все девять центральных округов интегрированы и остаются во владении и под контролем трёх претендентов"
 ADISCORD_vorkerland_commit_to_central_showdown:0 "Вступить в центральную схватку"
 ADISCORD_vorkerland_commit_to_central_showdown_desc:0 "Девять центральных правительств ликвидированы, округа прошли гражданскую интеграцию, и ни одна кампания не остаётся открытой. Отдать окончательный приказ о начале войны между тремя претендентами."
 ADISCORD_vorkerland_wkr_retreat_levy_1:0 "Созвать первый рабочий резерв"
 ADISCORD_vorkerland_wkr_retreat_levy_1_desc:0 "Через семь дней в удерживаемой столице соберётся один плохо оснащённый отряд ополчения."
 ADISCORD_vorkerland_wkr_retreat_levy_2:0 "Созвать последний рабочий резерв"
 ADISCORD_vorkerland_wkr_retreat_levy_2_desc:0 "Последний и ещё более слабый столичный резерв. После него новые отряды этой линии недоступны."
 ADISCORD_vorkerland_vad_retreat_levy_1:0 "Созвать первый резерв канцелярии"
 ADISCORD_vorkerland_vad_retreat_levy_1_desc:0 "Через семь дней в удерживаемой столице соберётся один плохо оснащённый охранный отряд."
 ADISCORD_vorkerland_vad_retreat_levy_2:0 "Созвать последний резерв канцелярии"
 ADISCORD_vorkerland_vad_retreat_levy_2_desc:0 "Последний и ещё более слабый столичный резерв. После него новые отряды этой линии недоступны."
 ADISCORD_vorkerland_tva_retreat_levy_1:0 "Созвать первый технический резерв"
 ADISCORD_vorkerland_tva_retreat_levy_1_desc:0 "Через семь дней в удерживаемой столице соберётся один плохо оснащённый технический отряд."
 ADISCORD_vorkerland_tva_retreat_levy_2:0 "Созвать последний технический резерв"
 ADISCORD_vorkerland_tva_retreat_levy_2_desc:0 "Последний и ещё более слабый столичный резерв. После него новые отряды этой линии недоступны."
 ADISCORD_vorkerland_restore_core_claimant_homes:0 "Восстановить земли претендентов"
 ADISCORD_vorkerland_restore_core_claimant_homes_desc:0 "Вернуть земли трёх военных правительств после восстановления владения и контроля объединённой страны над всеми указанными регионами."
 ADISCORD_vorkerland_restore_core_central_historical:0 "Восстановить исторический центр"
 ADISCORD_vorkerland_restore_core_central_historical_desc:0 "Восстановить администрацию объединённого государства в историческом центре независимо от окраинных территорий."
 ADISCORD_vorkerland_restore_core_oitfort:0 "Интегрировать Оитфорт"
 ADISCORD_vorkerland_restore_core_oitfort_desc:0 "Вернуть национальную территорию в Оитфорте лишь после того, как суверенный округ позднее окажется в полном владении и под полным контролем."
 ADISCORD_vorkerland_restore_core_rimat:0 "Интегрировать Римат"
 ADISCORD_vorkerland_restore_core_rimat_desc:0 "Вернуть Римат в состав восстановленного государства после установления полного владения и контроля над регионом."
 ADISCORD_vorkerland_restore_core_techlar:0 "Интегрировать Техлар"
 ADISCORD_vorkerland_restore_core_techlar_desc:0 "Вернуть Техлар в состав восстановленного государства после установления полного владения и контроля над регионом."
 ADISCORD_vorkerland_restore_core_ebern:0 "Интегрировать Эберн"
 ADISCORD_vorkerland_restore_core_ebern_desc:0 "Вернуть Эберн в состав восстановленного государства после установления полного владения и контроля над регионом."
 ADISCORD_vorkerland_restore_core_solar:0 "Интегрировать Соларский округ"
 ADISCORD_vorkerland_restore_core_solar_desc:0 "Вернуть три национальные территории округа Солярино после установления полного владения и контроля; существование правительства Солярино не требуется."
 ADISCORD_vorkerland_recognize_free_republics:0 "Признать свободные республики"
 ADISCORD_vorkerland_recognize_free_republics_desc:0 "Официально признать уцелевшие независимые республики Фреалора и Золоторечья и заключить с ними пакты о ненападении."
 ADISCORD_vorkerland_send_vla_support_tranche_1:0 "Снабдить вспомогательный фронт Вольнограда"
 ADISCORD_vorkerland_send_vla_support_tranche_1_desc:0 "После заключения союза с Вольноградом передать его действующему фронту 300 единиц пехотного и 30 единиц вспомогательного снаряжения. Следующую поставку можно готовить лишь через 90 дней."
 ADISCORD_vorkerland_send_vla_support_tranche_2:0 "Возобновить поддержку Вольнограда"
 ADISCORD_vorkerland_send_vla_support_tranche_2_desc:0 "Отправить Вольнограду вторую и последнюю ограниченную партию снаряжения."
 ADISCORD_vorkerland_send_sol_support_tranche_1:0 "Снабдить союзный фронт Солярино"
 ADISCORD_vorkerland_send_sol_support_tranche_1_desc:0 "После союза с Солярино или восстановления республики под нашей защитой передать её действующему фронту 300 единиц пехотного и 30 единиц вспомогательного снаряжения. Следующую поставку можно готовить лишь через 90 дней."
 ADISCORD_vorkerland_send_sol_support_tranche_2:0 "Возобновить поддержку Солярино"
 ADISCORD_vorkerland_send_sol_support_tranche_2_desc:0 "Отправить Солярино вторую и последнюю ограниченную партию снаряжения."
 ADISCORD_vorkerland_allied_supply_advisers:0 "Советники по союзному снабжению"
 ADISCORD_vorkerland_allied_supply_advisers_desc:0 "Временная группа советников распределяет доставленное имущество и координирует его переброску на фронт."
