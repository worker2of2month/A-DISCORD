l_russian:
 NOD_Naval_Command:0 "Морское командование Нодрула"
 NOD_Naval_Command_desc:0 "Торговые пути и зависимые побережья требуют постоянного флота. Соберём морской штаб, подготовим экипажи и начнём обновление корабельных проектов."
 NOD_Cussington_Naval_Yards:0 "Верфи Куссингтона"
 NOD_Cussington_Naval_Yards_desc:0 "Два новых стапеля в контролируемом порту обеспечат программу морского строительства. Верфи будут пополнять флот и поддерживать перевозки между нашими владениями."
 NOD_Sea_Lane_Escorts:0 "Охрана морских путей"
 NOD_Sea_Lane_Escorts_desc:0 "Введём в строй четыре восстановленных эсминца и сорок транспортов. Они прикроют снабжение армии и позволят содержать силы за пределами материка."
 NOD_Submarine_Blockade:0 "Подводная блокада"
 NOD_Submarine_Blockade_desc:0 "Четыре подлодки получат экипажи и войдут в строй. Они будут перехватывать вражеские перевозки, пока надводные силы прикрывают наши маршруты."
 NOD_Landing_Staff:0 "Морская пехота Нодрула"
 NOD_Landing_Staff_desc:0 "Учредим школу морской пехоты и утвердим штат бригады из шести батальонов с инженерами. Десантный штаб подготовит перевозку и снабжение частей; их набор потребует людей и оружия."
 NOD_Blockade_Squadron:0 "Эскадра морской блокады"
 NOD_Blockade_Squadron_desc:0 "Восстановим два тяжёлых крейсера. Вместе с кораблями охранения они смогут удерживать морские районы и поддерживать действия у вражеских портов."
 ADISCORD_tech_nodrul_marine_corps:0 "Морская пехота Нодрула"
 ADISCORD_tech_nodrul_marine_corps_desc:0 "Подготовка морских батальонов для захвата портов и удержания плацдармов."
