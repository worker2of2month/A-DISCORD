l_russian:
 STP_NECTAR_OF_GODS: "Нектар богов"
 STP_NECTAR_OF_GODS_desc: "Порядок Иванова кажется прочным именно потому, что мало кто ещё задаётся вопросом, на чём он держится."

 STP_SMILE_YOU_ARE_WELCOME: "Улыбайтесь, вас принимают"
 STP_SMILE_YOU_ARE_WELCOME_desc: "Фестивали, открытые набережные и оживлённые порты должны показать Стелендер спокойным, современным и гостеприимным."

 STP_STATE_OF_THE_REPUBLIC: "Положение республики"
 STP_STATE_OF_THE_REPUBLIC_desc: "За благополучным фасадом остаются бюджетные перекосы, слабые округа, кадровый дефицит и вопросы безопасности."

 STP_2160_program: "Программа 2160"
 STP_2160_program_desc: "Правительство сводит накопившиеся проблемы в единую программу на последний спокойный год старого порядка."

 STP_2160_budget: "Бюджет 2160 года"
 STP_2160_budget_desc: "Кабинету предстоит определить, сколько государство может потратить на сохранение текущего порядка и сколько — на его перестройку."

 STP_current_spending: "Закрыть текущие расходы"
 STP_current_spending_desc: "Накопившиеся обязательства нельзя бесконечно переносить на следующий отчётный период."

 STP_internal_investment: "Внутренние инвестиции"
 STP_internal_investment_desc: "Часть средств следует направить в проекты, которые дадут стране новые мощности, а не только закроют старые счета."

 STP_BALANCED_APPROPRIATIONS: "Свести ассигнования"
 STP_BALANCED_APPROPRIATIONS_desc: "После споров между ведомствами бюджет наконец можно свести в единую систему приоритетов."

 STP_highland_program: "Программа горных округов"
 STP_highland_program_desc: "Горные округа требуют отдельной политики снабжения, инфраструктуры и отношений с местной администрацией."

 STP_regional_agreements: "Соглашения с округами"
 STP_regional_agreements_desc: "Местные власти получат формальные обязательства центра в обмен на более предсказуемое сотрудничество."

 STP_central_district_funding: "Центральное финансирование округов"
 STP_central_district_funding_desc: "Столица возьмёт на себя большую долю расходов и вместе с ними — большую долю контроля."

 STP_HIGHLAND_SETTLEMENT: "Горный компромисс"
 STP_HIGHLAND_SETTLEMENT_desc: "Новая схема должна связать местные интересы с ресурсами центрального правительства."

 STP_port_reform: "Реформа портов"
 STP_port_reform_desc: "Торговые гавани слишком важны для государства, чтобы продолжать жить по набору временных правил."

 STP_private_port_management: "Частное управление портами"
 STP_private_port_management_desc: "Частные операторы получат больше свободы в обмен на оборот, инвестиции и скорость."

 STP_state_port_oversight: "Государственный надзор за портами"
 STP_state_port_oversight_desc: "Портовая система останется под прямым контролем государства, даже если это обойдётся дороже."

 STP_PORT_AUTHORITY_2160: "Портовое управление 2160"
 STP_PORT_AUTHORITY_2160_desc: "После выбора модели управления можно собрать разрозненные гавани в единую административную систему."

 STP_personnel_policy: "Кадровая политика"
 STP_personnel_policy_desc: "Расширение программы упирается не только в деньги, но и в людей, способных ею управлять."

 STP_foreign_specialists: "Иностранные специалисты"
 STP_foreign_specialists_desc: "Приглашённые инженеры и администраторы быстро закроют дефицит компетенций, но создадут новую зависимость."

 STP_local_training: "Подготовка собственных кадров"
 STP_local_training_desc: "Собственная школа займёт больше времени, зато позволит постепенно отказаться от внешних специалистов."

 STP_CIVIL_SERVICE_REGISTER: "Единый реестр службы"
 STP_CIVIL_SERVICE_REGISTER_desc: "Новая кадровая система должна превратить временные назначения в устойчивый государственный аппарат."

 STP_defense_budget: "Оборонный бюджет"
 STP_defense_budget_desc: "Армии необходимо определить, что важнее в ближайшие годы: постоянное присутствие или способность быстро развернуться."

 STP_garrison_funding: "Финансирование гарнизонов"
 STP_garrison_funding_desc: "Существующие части получат людей, снабжение и средства для постоянного присутствия в ключевых районах."

 STP_mobilization_reserve: "Мобилизационный резерв"
 STP_mobilization_reserve_desc: "Запасы, транспорт и подготовленные резервы позволят армии расти быстрее, когда мирное время закончится."

 STP_READINESS_REVIEW: "Проверка готовности"
 STP_READINESS_REVIEW_desc: "Гарнизоны и резервы будут сведены в единый план развёртывания на случай внезапного кризиса."

 STP_nodrul_agreement: "Соглашение с Нодрулом"
 STP_nodrul_agreement_desc: "Нодрульское присутствие остаётся частью системы безопасности Стеландера, но его условия больше нельзя оставлять неопределёнными."

 STP_extend_nodrul_missions: "Расширить миссии Нодрула"
 STP_extend_nodrul_missions_desc: "Дополнительные советники укрепят действующую систему и одновременно усилят зависимость от внешнего гаранта."

 STP_reduce_nodrul_presence: "Сократить присутствие Нодрула"
 STP_reduce_nodrul_presence_desc: "Стелендер начнёт возвращать себе функции, которые годами выполняли нодрульские структуры."

 STP_FRONTIER_PROTOCOL_2160: "Протокол приграничной безопасности"
 STP_FRONTIER_PROTOCOL_2160_desc: "После политического решения стороны смогут формально закрепить новый порядок на границе."

 STP_ADRESS_PARTY_CRISIS: "Разобраться с партийным кризисом"
 STP_ADRESS_PARTY_CRISIS_desc: "То, что ещё недавно выглядело аппаратной ссорой, начинает мешать нормальной работе государства."

 STP_PRESIDENT_REMAINS_IN_OFFICE: "Президент остаётся в должности"
 STP_PRESIDENT_REMAINS_IN_OFFICE_desc: "Пока Иванов способен поставить подпись, официальная конструкция власти не должна измениться."

 STP_CONTINUITY_OF_AUTHORITY: "Непрерывность власти"
 STP_CONTINUITY_OF_AUTHORITY_desc: "Распоряжения должны продолжать проходить через аппарат так, словно наверху ничего не изменилось."

 STP_Govern_In_His_Name: "Править от его имени"
 STP_Govern_In_His_Name_desc: "Если президент больше не способен удерживать систему лично, это сделает партия."

 STP_Show_Him_The_Truth: "Показать ему правду"
 STP_Show_Him_The_Truth_desc: "Шабрата ещё можно допустить к Иванову — и заставить старика увидеть, что происходит с созданным им государством."

 STP_PARTY_DISCIPLINE: "Партийная дисциплина"
 STP_PARTY_DISCIPLINE_desc: "Хедерсетт требует прекратить личные игры и вернуть аппарат к единой линии."

 STP_SEAL_THE_WESTERN_WING: "Закрыть западное крыло"
 STP_SEAL_THE_WESTERN_WING_desc: "Доступ к президенту станет вопросом допуска, а не старых знакомств."

 STP_ROTATE_DISTRICT_COMMAND: "Ротация окружного командования"
 STP_ROTATE_DISTRICT_COMMAND_desc: "Командующие, слишком долго просидевшие на одном месте, успели обзавестись собственными связями."

 STP_BURN_THE_CLIENT_ARCHIVES: "Сжечь клиентские архивы"
 STP_BURN_THE_CLIENT_ARCHIVES_desc: "Некоторые документы опаснее сохранить, чем уничтожить."

 STP_GUARANTEE_MINISTERS: "Гарантировать полномочия министров"
 STP_GUARANTEE_MINISTERS_desc: "Сохранение действующего кабинета удержит аппарат от паники и даст понятную цепочку ответственности."

 STP_EMERGENCY_APPOINTMENTS: "Чрезвычайные назначения"
 STP_EMERGENCY_APPOINTMENTS_desc: "В кризисе должности должны занимать люди, готовые выполнять приказ без долгих согласований."

 STP_DISTRICT_GOVERNMENT: "Управление округами"
 STP_DISTRICT_GOVERNMENT_desc: "Центр должен решить, насколько далеко можно доверять существующей местной администрации."

 STP_CONFIRM_DISTRICT_ADMINISTRATIONS: "Подтвердить окружные администрации"
 STP_CONFIRM_DISTRICT_ADMINISTRATIONS_desc: "Местные правительства сохранят полномочия и ответственность за порядок."

 STP_PRESIDENTIAL_COMMISSIONERS: "Президентские комиссары"
 STP_PRESIDENTIAL_COMMISSIONERS_desc: "В ключевые округа отправятся представители центра с прямым мандатом президентской администрации."

 STP_PUBLIC_INFORMATION_POLICY: "Политика публичной информации"
 STP_PUBLIC_INFORMATION_POLICY_desc: "Власть должна установить, что именно страна имеет право знать о происходящем наверху."

 STP_MEDICAL_BULLETINS: "Медицинские бюллетени"
 STP_MEDICAL_BULLETINS_desc: "Регулярные сообщения врачей должны ограничить слухи и показать, что ситуация находится под контролем."

 STP_RESTRICT_HEALTH_INFORMATION: "Ограничить сведения о здоровье"
 STP_RESTRICT_HEALTH_INFORMATION_desc: "Состояние президента становится вопросом государственной устойчивости, а не общественного любопытства."

 STP_FADA_PACT: "Пакт ФАДА"
 STP_FADA_PACT_desc: "Внешние гарантии следует подтвердить прежде, чем соседи решат, что внутренний кризис открыл окно возможностей."

 STP_RENEW_THE_CULTURAL_MANDATE: "Продлить культурный мандат"
 STP_RENEW_THE_CULTURAL_MANDATE_desc: "Старые связи с Нодрулом можно использовать как доказательство того, что международная конструкция Иванова переживёт самого Иванова."

 STP_THE_PARTY_CLOSES_RANKS: "Партия смыкает ряды"
 STP_THE_PARTY_CLOSES_RANKS_desc: "Аппарат готовится встретить момент, когда президентская подпись перестанет прикрывать реальные центры власти."

 STP_Count_The_Loyalists: "Пересчитать лояльных"
 STP_Count_The_Loyalists_desc: "Шабрата интересуют не заявления о верности, а люди, которые действительно выполнят приказ, когда цепочка командования расколется."

 STP_The_Last_Confession: "Последняя исповедь"
 STP_The_Last_Confession_desc: "Несколько минут наедине с Ивановым могут оказаться важнее недель публичной политики."

 STP_Call_For_Shabrat: "Позвать Шабрата"
 STP_Call_For_Shabrat_desc: "Имя, которое старались не произносить в президентском крыле, снова появляется в официальном расписании."

 STP_Turn_The_Young_Officers: "Перетянуть молодых офицеров"
 STP_Turn_The_Young_Officers_desc: "Молодые командиры меньше обязаны старому аппарату и гораздо внимательнее смотрят на то, кто будет отдавать приказы завтра."

 STP_Garrisons_Hesitate: "Гарнизоны колеблются"
 STP_Garrisons_Hesitate_desc: "Ни один приказ не имеет значения, пока неизвестно, кто на самом деле исполнит его в округах."

 STP_Rumours_In_The_Highlands: "Слухи в горах"
 STP_Rumours_In_The_Highlands_desc: "В горных округах политические слухи быстро превращаются в маршруты, тайники и списки надёжных людей."

 STP_The_Mountain_Printing_House: "Горная типография"
 STP_The_Mountain_Printing_House_desc: "Несколько старых машин способны напечатать больше, чем листовки, если власть внезапно потеряет голос."

 STP_The_Silent_Mountain_March: "Тихий марш"
 STP_The_Silent_Mountain_March_desc: "Никаких лозунгов и демонстраций — только люди, которые должны оказаться в нужных местах в нужный день."

 STP_The_Lower_Market: "Нижний рынок"
 STP_The_Lower_Market_desc: "Там, где официальные ведомства обмениваются бумагами, нижний рынок обменивается услугами, долгами и секретами."

 STP_Steal_The_Black_Ledger: "Украсть чёрную бухгалтерию"
 STP_Steal_The_Black_Ledger_desc: "Один реестр способен связать партийных посредников, подрядчиков и тех, кто предпочёл бы никогда не встретиться в одном документе."

 STP_The_First_Witness: "Первый свидетель"
 STP_The_First_Witness_desc: "Документы полезны, но живой человек иногда способен разрушить тщательно выстроенную версию событий."

 STP_Kefreite_Security_Offer: "Предложение Кефрейта"
 STP_Kefreite_Security_Offer_desc: "Кефрейт готов помочь — и, как всегда, уже знает цену будущей услуги."

 STP_No_Mercenaries_In_Our_Mountains: "Никаких наёмников в наших горах"
 STP_No_Mercenaries_In_Our_Mountains_desc: "Шабрата можно обвинить во многом, но он не обязан отдавать будущее страны первому иностранцу с контрактом."

 STP_THE_MOUNTAIN_WINDOW: "Горное окно"
 STP_THE_MOUNTAIN_WINDOW_desc: "Сеть существует. Вопрос теперь не в том, можно ли действовать, а в том, когда откроется единственное подходящее окно."

 STP_INCAPACITY_PROTOCOL: "Протокол недееспособности"
 STP_INCAPACITY_PROTOCOL_desc: "Государство должно заранее определить, кто подписывает приказы, если президент больше не может этого делать."

 STP_EMERGENCY_PRESIDIUM: "Чрезвычайный президиум"
 STP_EMERGENCY_PRESIDIUM_desc: "Коллегиальный орган должен удержать формальную непрерывность власти в последние часы старого порядка."

 STP_THE_FATHER_OF_PEACE_IS_GONE: "Отца мира больше нет"
 STP_THE_FATHER_OF_PEACE_IS_GONE_desc: "Подпись Иванова больше не появится ни под одним документом. Всё, что он удерживал личным авторитетом, теперь принадлежит тем, кто сумеет это взять."

 STP_PARTY_INHERITS_THE_STATE: "Партия наследует государство"
 STP_PARTY_INHERITS_THE_STATE_desc: "Хедерсетт получает не трон, а аппарат — и считает это куда более ценным наследством."

 STP_NO_ONE_CONTROLS_THE_TRANSITION: "Никто не контролирует переход"
 STP_NO_ONE_CONTROLS_THE_TRANSITION_desc: "Приказы расходятся, гарнизоны выбирают стороны, а политический спор превращается в борьбу за саму территорию государства."

 STP_SHABRAT_AT_THE_PALACE: "Шабрата во дворец"
 STP_SHABRAT_AT_THE_PALACE_desc: "Столица меняет хозяина раньше, чем успевает понять, что старая система уже закончилась."

 STP_SOTNIKOV_TAKES_COMMAND: "Сотников принимает командование"
 STP_SOTNIKOV_TAKES_COMMAND_desc: "Когда политический план рушится, остаются офицеры, склады и человек, готовый превратить их в новую цепочку приказов."
