 #Battle for Stelander
 STP_battle_for_stelander: "Битва за Стеландер"
 STP_battle_for_stelander_desc: "Шабрат не собирает абстрактные очки поддержки. Он выясняет, чья подпись откроет склад, чей приказ исполнит гарнизон и кто встретит рассвет с другим флагом. Партия каждые §Y40 дней§! выбирает штат для проверки; недавняя активность и сильная сеть делают регион более вероятной целью.\n\n§YПолитические действия:§! свободно §C[?STP_political_action_slots_available|0]§! из §Y[?STP_political_action_slots_total|0]§!.\n\n§YПоследний ход Партии:§! [STPGetLastPartyResponse]"
 STP_regions_panel_title: "Кому подчинится Стеландер?"
 STP_regions_panel_tt: "Цвет показывает не формального владельца, а силу, способную навязать региону свою волю в момент раскола."
 STP_regions_map_tt: "§7Серый§! — спорный регион; §Cсиний§! — Сопротивление; §0фиолетовый§! — Партия; §Yжёлтый§! — местные силы. Яркий оттенок означает закреплённую позицию."
 STP_regions_legend: "§7СПОРНЫЙ§!   §CСОПРОТИВЛЕНИЕ§!   §0ПАРТИЯ§!   §YМЕСТНЫЕ СИЛЫ§!"

 #Event
 ADISCORD_STP_regions.1.t: "Страна во втором экземпляре"
 ADISCORD_STP_regions.1.d: "На столе перед Шабратом лежит не карта фронта, а карта подчинения. В одном штате решающей окажется подпись начальника, в другом — слово совета, в третьем — ключ от склада. Партия ещё считает эти земли единой страной и потому будет посылать комиссии туда, где сеть выдаёт себя громче всего. До раскола необходимо решить, что важнее в каждом регионе: забрать его себе, вытеснить оттуда Партию руками местных или оставить спорным, но подготовить один решающий актив."
 ADISCORD_STP_regions.1.a: "Начать Битву за Стеландер"

