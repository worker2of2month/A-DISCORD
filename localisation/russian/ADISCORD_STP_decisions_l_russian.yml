 #Regional decisions
 STP_recruit_regional_official: "Найти подпись в нужном кабинете"
 STP_recruit_regional_official_desc: "В администрации [FROM.GetName] есть люди, которые устали ждать конца эпохи. Их нельзя превратить в солдат, но одна своевременная подпись способна оставить гарнизон без приказа, а склад — без пломбы.\n\n§YРезультат:§! контакт в администрации, §C+8§! влияния Сопротивления, §R+6§! подозрения."
 STP_bargain_with_local_councils: "Пусть совет вспомнит о собственном голосе"
 STP_bargain_with_local_councils_desc: "Местные старейшины не обязаны любить Шабрата, чтобы перестать слушать Партию. Деньги, гарантии и право не отдавать людей чужим комиссарам помогут выбить центр из [FROM.GetName], но создадут самостоятельную силу, с которой придётся считаться после победы.\n\n§YРезультат:§! договор с местным советом, §Y+10§! влияния местных сил, §R+3§! подозрения."
 STP_prepare_false_trail: "Подбросить ложный след"
 STP_prepare_false_trail_desc: "Проверяющие уже идут в [FROM.GetName]. Им можно оставить правдоподобную цепочку имён и адресов, но ради неё придётся отдать часть настоящей сети. При низком подозрении след чаще уводит Партию в сторону; при высоком он способен привести контрразведку прямо к нашим людям.\n\n§YНемедленно:§! Партия получает §R3§! влияния.\n\n§YШансы исходов — чистый след / шумный след / задержан связной / прорыв контрразведки:§!\nПодозрение ниже 25: §C60§! / 30 / 10 / 0\n25–49: §C35§! / 40 / 20 / §R5§!\n50–69: 15 / 35 / 35 / §R15§!\n70 и выше: 5 / 20 / 40 / §R35§!"

 STP_region_unique_operation_2: "Ночная смена отвечает Шабрату"
 STP_region_unique_operation_2_desc: "Телефонные узлы Новой Монаии ночью обслуживают те же люди, что слушают партийные распоряжения днём. Если сменить несколько фамилий в графике, в решающую ночь гарнизон услышит другой голос.\n\n§YАктив:§! связь с гарнизоном. §C+8§! влияния Сопротивления, §R+7§! подозрения."
 STP_region_unique_operation_3: "Топливо переждёт Отца мира"
 STP_region_unique_operation_3_desc: "Ниансаские скважины и старые хранилища позволяют спрятать запас, которого хватит на первые недели войны. Главное — провести цистерны раньше, чем ведомости попадут в Фаду.\n\n§YАктив:§! запас и маршрут снабжения. §C+6§! влияния Сопротивления, §R+5§! подозрения."
 STP_region_unique_operation_29: "Другой мастер у того же станка"
 STP_region_unique_operation_29_desc: "Крейденские цеха подчиняются не речам, а мастерам смен. Несколько таких людей могут остановить отгрузку Партии и открыть заводские ворота тем, кто придёт с приказом Шабрата.\n\n§YАктив:§! связь с гарнизоном и рабочими командами. §C+10§! влияния Сопротивления, §R+8§! подозрения."
 STP_region_unique_operation_45: "Ливонин помнит обещания"
 STP_region_unique_operation_45_desc: "Местные силы Ливонина уже готовы жить без Фады. Теперь им нужно доказать, что место в новом Стеландере надёжнее чужого пограничного покровительства. Решение доступно только после договора с советом.\n\n§YАктив:§! контакт в будущей администрации. §C+12§! влияния Сопротивления, §R+4§! подозрения."
 STP_region_unique_operation_46: "У гавани есть вторые ключи"
 STP_region_unique_operation_46_desc: "В Хосхейте каждый склад имеет официальный ключ и тот, которым пользуются после закрытия конторы. Второй комплект должен оказаться у людей Шабрата раньше партийской описи.\n\n§YАктив:§! портовый маршрут снабжения. §C+8§! влияния Сопротивления, §R+6§! подозрения."
 STP_region_unique_operation_53: "Старые дороги не прощают"
 STP_region_unique_operation_53_desc: "Лесные дороги Старой Фады слишком узки для колонны и слишком знакомы тем, кто здесь вырос. Спрятанные заряды не помогут до начала войны — зато однажды могут задержать партийские резервы на несколько дней.\n\n§YАктив:§! подготовленный саботаж. §C+6§! влияния Сопротивления, §R+10§! подозрения."

 #Party inspections
 STP_party_inspection_state_2: "Проверка чиновников штата «Новая Монаии»"
 STP_party_inspection_state_3: "Проверка чиновников штата «Ниансаская область»"
 STP_party_inspection_state_29: "Проверка чиновников штата «Крейден»"
 STP_party_inspection_state_45: "Проверка чиновников штата «Ливонинский округ»"
 STP_party_inspection_state_46: "Проверка чиновников штата «Хосхейт»"
 STP_party_inspection_state_53: "Проверка чиновников штата «Старый фадский лес»"
 STP_party_inspection_state_2_desc: "Партийная комиссия сверяет назначения, пропуска и телефонные журналы Новой Монаии. Через §Y40 дней§! она ударит по самому заметному активу или просто укрепит аппарат. Ложный след меняет набор возможных исходов."
 STP_party_inspection_state_3_desc: "Партийная комиссия проверяет ведомости, цистерны и районных чиновников Ниансаской области. Через §Y40 дней§! она ударит по самому заметному активу или просто укрепит аппарат. Ложный след меняет набор возможных исходов."
 STP_party_inspection_state_29_desc: "Партийная комиссия пересчитывает смены, пропуска и заводские печати Крейдена. Через §Y40 дней§! она ударит по самому заметному активу или просто укрепит аппарат. Ложный след меняет набор возможных исходов."
 STP_party_inspection_state_45_desc: "Партийная комиссия выясняет, с кем совет Ливонина обсуждает будущее без Фады. Через §Y40 дней§! она ударит по самому заметному активу или просто укрепит аппарат. Ложный след меняет набор возможных исходов."
 STP_party_inspection_state_46_desc: "Партийная комиссия сверяет портовые ключи, складские книги и списки ночных смен Хосхейта. Через §Y40 дней§! она ударит по самому заметному активу или просто укрепит аппарат. Ложный след меняет набор возможных исходов."
 STP_party_inspection_state_53_desc: "Партийная комиссия расспрашивает лесничих, дорожных мастеров и старост Старой Фады. Через §Y40 дней§! она ударит по самому заметному активу или просто укрепит аппарат. Ложный след меняет набор возможных исходов."

 #DEBUG
 STP_debug_start_battle_for_stelander: "§RDEBUG:§! Начать Битву за Стеландер"
 STP_debug_start_battle_for_stelander_desc: "Вызывает вводное событие, выбирает сторону Шабрата, создаёт региональные переменные и запускает сорокадневную паузу перед первой проверкой."
 STP_debug_reset_battle_for_stelander: "§RDEBUG:§! Сбросить Битву за Стеландер"
 STP_debug_reset_battle_for_stelander_desc: "Удаляет все региональные активы и влияние, затем создаёт систему заново с исходными значениями."
 STP_debug_end_battle_for_stelander: "§RDEBUG:§! Завершить Битву за Стеландер"
 STP_debug_end_battle_for_stelander_desc: "Удаляет региональные переменные, флаги и активную партийную проверку."

