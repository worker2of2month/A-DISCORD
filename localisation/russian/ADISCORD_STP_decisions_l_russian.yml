l_russian:
 # Партийные выборы и подозрение спецслужб
 STP_elections_in_the_party: "Выборы в партии"
 STP_elections_in_the_party_desc: "Партийный аппарат сохраняет внешнее единство, однако здоровье Петра Иванова и внимание спецслужб определяют, насколько свободно могут действовать участники будущей борьбы за власть.[PeterHealth][STP_display_party_suspicion]"
 STP_display_party_suspicion_loc: "\n\n§YОперативная сводка§!\n £STP_suspicion §YПодозрение спецслужб§!: [STPGetSuspicionValue] — [STPGetSuspicionBand].\n[STPGetSuspicionExplanation]"
 stp_party_suspicion: "[stp_party_suspicion_loc]"
 stp_party_suspicion_loc_bad: "Высокий уровень подозрения спецслужб"
 stp_party_suspicion_loc_good: "Низкий уровень подозрения спецслужб"
 STP_SUSPICION_VALUE_LOW: "§G[?STP_party_suspicion|0]%§!"
 STP_SUSPICION_VALUE_MEDIUM: "§Y[?STP_party_suspicion|0]%§!"
 STP_SUSPICION_VALUE_HIGH: "§R[?STP_party_suspicion|0]%§!"
 STP_SUSPICION_BAND_HIDDEN: "сеть не обнаружена"
 STP_SUSPICION_BAND_NOTICED: "службы замечают несоответствия"
 STP_SUSPICION_BAND_WATCHED: "установлено наблюдение"
 STP_SUSPICION_BAND_COMPROMISED: "сеть частично раскрыта"
 STP_SUSPICION_BAND_MANHUNT: "идёт активный розыск"
 STP_SUSPICION_EXPLANATION_HIDDEN: "§gСлужбы ещё не видят общей системы в отдельных контактах и перемещениях. Новые действия почти не связываются с единой подпольной сетью.§!"
 STP_SUSPICION_EXPLANATION_NOTICED: "§gАналитики замечают повторяющиеся несоответствия. Неосторожные операции будут быстрее привлекать внимание, хотя структура сети пока остаётся скрытой.§!"
 STP_SUSPICION_EXPLANATION_WATCHED: "§gЗа подозрительными контактами установлено наблюдение. Любая новая активность может раскрыть участников и каналы связи.§!"
 STP_SUSPICION_EXPLANATION_COMPROMISED: "§gЧасть сети уже установлена. Службы сопоставляют имена, маршруты и источники финансирования, приближаясь к организаторам.§!"
 STP_SUSPICION_EXPLANATION_MANHUNT: "§gСпецслужбы ведут активный розыск. Сеть действует в условиях почти полного раскрытия, а каждый следующий шаг может привести силовиков к её руководству.§!"

 # Динамическая сводка о здоровье Иванова внутри категории решений
 STP_PETER_HEALTH_STAGE_1_DESC:0 "\n\n§YЗдоровье лидера§!: §G[?STP_leader_health|0]%§! — устойчивое.\n§YТекущие эффекты§!: [STPGetLeaderHealthEffects]"
