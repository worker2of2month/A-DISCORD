 STP_SUSPICION_EXPLANATION_HIDDEN: "§gСлужбы ещё не видят общей системы в отдельных контактах и перемещениях. Подполье может действовать свободно, не расходуя политический ресурс на постоянное прикрытие.§!"
 STP_SUSPICION_EXPLANATION_NOTICED: "§gАналитики замечают повторяющиеся несоответствия. Новые операции уже требуют осторожности, но структура сети всё ещё скрыта.§!"
 STP_SUSPICION_EXPLANATION_WATCHED: "§gЗа подозрительными контактами установлено наблюдение. Политическая работа начинает вязнуть в проверках, слежке и необходимости менять каналы связи.§!"
 STP_SUSPICION_EXPLANATION_COMPROMISED: "§gЧасть сети установлена. Службы сопоставляют имена, маршруты и источники финансирования, заставляя подполье тратить всё больше сил на выживание.§!"
 STP_SUSPICION_EXPLANATION_MANHUNT: "§gСпецслужбы ведут активный розыск. Любое новое действие рискует привести силовиков к руководству сети, а политическая работа становится крайне дорогой.§!"
