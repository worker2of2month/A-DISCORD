 ADISCORD_non_participating_minor_optimization_desc: "Эта страна под управлением ИИ не участвует в активных конфликтах. Её стартовые войска сохраняются, но дальнейшие исследования, производство и подготовка дивизий приостановлены для снижения нагрузки. Если страна вступит в войну, ограничение будет снято автоматически."
