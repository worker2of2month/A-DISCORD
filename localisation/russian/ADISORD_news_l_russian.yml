l_russian:
  news.0.t: "Конец единого Воркерланда"
  news.0.d: "Центральный комплекс уничтожен. Связь с руководством конфедерации потеряна, окружные администрации вводят чрезвычайное положение, а единая система командования распадается."
  news.0.a: "Конфедерация распадается."
  ADISCORD_vorkerland_news.1.t: "Провозглашён Норвейн"
  ADISCORD_vorkerland_news.1.d: "Иванланд завершил ограниченную операцию на воркерландской границе. В занятом коридоре Матвей Матеуск провозгласил Норвейн — зависимую пограничную республику под защитой Иванланда."
  ADISCORD_vorkerland_news.1.a: "На границе появился новый режим."
  ADISCORD_vorkerland_news.2.t: "Иванланд отступает из Норвейна"
  ADISCORD_vorkerland_news.2.d: "Операция Иванланда сорвалась. Войска покинули занятый коридор, проект Норвейна распущен, а правительство Вадима Иванчика объявило чрезвычайный курс после поражения."
  ADISCORD_vorkerland_news.2.a: "Коридор снова свободен."
