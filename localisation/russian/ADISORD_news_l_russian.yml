l_russian:
  news.0.t: "Конец единого Воркерланда"
  news.0.d: "Центральный комплекс уничтожен. Связь с руководством конфедерации потеряна, окружные администрации вводят чрезвычайное положение, а единая система командования распадается."
  news.0.a: "Конфедерация распадается."
  ADISCORD_vorkerland_news.1.t: "Провозглашён Норвейн"
  ADISCORD_vorkerland_news.1.d: "Иванланд завершил северную операцию и распустил временный оборонительный фронт. Норвейн Матвея Матеуска получил штаты 90 и 91, а Крайтская директория Антона Селевёстрова — штаты 93 и 94. Оба режима зависят от Иторы, а уцелевшие северные республики уже возобновляют прерванную войну."
  ADISCORD_vorkerland_news.1.a: "На границе появился новый режим."
  ADISCORD_vorkerland_news.2.t: "Иванланд отступает из Норвейна"
  ADISCORD_vorkerland_news.2.d: "Операция Иванланда сорвалась. Норвейн не был создан, зависимая Крайтская директория сохранила штат 91, а временный Северный оборонительный фронт распущен. Остальные северные администрации возобновили междоусобные войны. Правительство Вадима Иванчика объявило чрезвычайный курс после поражения."
  ADISCORD_vorkerland_news.2.a: "Север снова воюет сам с собой."
