 RUS_restore_wasteland:0 "Освоить [GetRUSReclamationTargetName]"
 RUS_reclamation_target_ash_arc:0 "Пепельную дугу"
 RUS_reclamation_target_mardar_rift:0 "Мардарский разлом"
 RUS_reclamation_target_name:0 "[FROM.GetName]"
 RUS_restore_wasteland_desc:0 "Инженеры проложат дороги, очистят площадки и наладят водоснабжение в области [FROM.GetName]. После этих работ здесь можно будет создавать постоянные поселения и предприятия.\n\nРаботы: §Y120 дней§!. Тип области: §Yпустошь§! -> §Yсельская область§!. Инфраструктура: §G+1§! уровень, не выше 5.\nОдновременно восстанавливается одна область. Нехватка денег и оснащения не скрывает решение. При утрате владения или контроля, смене типа области до завершения либо прекращении правления Хана заказ отменяется с полным возвратом оплаты. Завершённые работы сохраняются в области при смене владельца."
 RUS_reclamation_slot_free_tt:0 "Нет другого оплаченного проекта восстановления области."
 RUS_restore_wasteland_result_tt:0 "При успешном завершении область [FROM.GetName] получает тип §Yсельская область§! вместо пустоши и §G+1§! уровень инфраструктуры, не выше 5."
 RUS_restore_wasteland_refund_tt:0 "При отмене возвращаются §G75§! £political_power_texticon, §G335§! £ADISCORD_economy_treasury_texticon и §G200§! £support_equipment_texticon. Улучшения не выдаются."
 ADISCORD_rus_crisis.24.t:0 "Новые границы на чужих картах"
 ADISCORD_rus_crisis.24.d:0 "Первое донесение с новых рубежей принесли вместе с торговой ведомостью. Купцы уже меняли маршруты, пограничные писари переписывали названия застав, а посольства запрашивали сведения о ханских гарнизонах. Степь перестала быть для соседей неподвижной строкой в старом атласе.\n\nРустан ещё не провозгласил империю. Но за пределами его земель уже обсуждали, сколько людей он может вооружить и куда направит их дальше. Канцелярия может появиться позднее; чужие наблюдатели ждать её открытия не будут.\n\nУчёные предлагают показать гражданские мастерские. Военные готовы рассредоточить сборные пункты. Послы просят средства на переговоры. Теперь каждое новое приготовление будут замечать, и скрывать его придётся за собственный счёт."
 ADISCORD_rus_crisis.24.a:0 "Пусть соседи видят меньше, чем мы готовим."
 ADISCORD_rus_crisis.17.rumours.t:0 "Утечка из ханских ведомостей"
 ADISCORD_rus_crisis.17.observers.t:0 "Требования соседей"
