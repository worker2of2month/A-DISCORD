 ADISCORD_rus_crisis.4.government.t:0 "Распад единой державы"
 ADISCORD_rus_crisis.4.army.d:0 "Чёрное Знамя опущено. Чёрная армия Хана потерпела поражение, Марк Рустан отстранён, а единый штаб больше не связывает западные республики в одно государство. Местные правления возвращаются на земли распавшейся империи.\n\nСотники сдают печати поодиночке, каждый своему аймаку. Оружие у них осталось, приказов нет. Наше правительство должно решить, где хватит местной власти, а где на дорогах к реактору понадобятся собственные заставы. Земли соседних государств в этот раздел не входят."
 ADISCORD_rus_crisis.4.reconstruction.d:0 "Последняя империя не выдержала войны. Учёный совет Хана распущен, Марк Рустан отстранён, а общие учреждения больше не связывают западные республики. Местные правления возвращаются к собственным границам и бюджетам.\n\nОсколки унаследовали от империи мастерские, школы и ведомости, но не деньги на них. Округа уже просят помощи и боятся её условий. Наше правительство должно решить, какие из них справятся сами, а где у реакторных дорог понадобится особое управление. Земли соседних государств в этот раздел не входят."
