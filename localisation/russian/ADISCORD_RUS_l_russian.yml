 RUS_proclaim_the_last_empire_no_plot_tt:0 "Против Хана не готовится заговор."
 RUS_coup_channel_closed_tt:0 "§RОрбитальная программа закрыта навсегда:§! Последней империи, войны коалиции и удара не будет."
 RUS_coup_scientists_branch_tt:0 "Открывается ветка §YСовета реакторного пояса§!."
 RUS_coup_black_army_branch_tt:0 "Открывается ветка §YКараульного государства§!."
 RUS_sci_channel_night:0 "Ночь отсоединённого канала"
 RUS_sci_channel_night_desc:0 "Оружейный блок снят со стойки, но реактор продолжает работать. Ток, который предназначался спутнику, пойдёт в мастерские и на стройки, а инженеры, ещё вчера считавшие траекторию, сядут за план восстановления поверхности."
 RUS_sci_channel_night_power_tt:0 "Сразу: §G+1§! £energy_consumption_texticon мощности бункера."
 RUS_ba_guard_order:0 "Приказ по караулу"
 RUS_ba_guard_order_desc:0 "Мансуров распространил устав караула на всю страну. Каждый пост отвечает за свой участок, каждый командир - за свой пост. Армия, которая свергла Хана, теперь должна доказать, что умеет держать границу без него."
 RUS_ba_guard_order_delta:0 "Изменение \"Чёрной Армии\""
 ADISCORD_rus_campaign.46.scientists.t:0 "Совет без Хана"
 ADISCORD_rus_campaign.46.scientists.d:0 "Совещание в реакторном зале закончилось раньше, чем пришёл Хан. Когда Марк Рустан вошёл, инженеры уже расходились, а на столе лежал протокол с подписями всего совета. Его подписи там не ждали.\n\nВечером начальник караула доложил: смену у пульта связи Корнеев набирает сам, а ключи от нижних горизонтов теперь хранятся у дежурного инженера. Приказов никто не нарушил. Просто приказы больше никому не нужны."
 ADISCORD_rus_campaign.46.army.t:0 "Караул у дверей"
 ADISCORD_rus_campaign.46.army.d:0 "Утром у кабинета Хана стояли новые часовые. Марк Рустан не подписывал этой смены. Тагир Мансуров объяснил, что после последних донесений с фронта охрану усилили по уставу.\n\nК обеду в Ставке перестали появляться инженеры. Их вызовы возвращались с пометкой \"по согласованию с командованием\". Армия ещё отдаёт Хану честь, но решает уже без него."
 ADISCORD_rus_campaign.46.a:0 "Нужно вернуть равновесие."
 ADISCORD_rus_campaign.47.scientists.t:0 "Совет берёт пульт"
 ADISCORD_rus_campaign.47.scientists.d:0 "Пульт отключили в третьем часу ночи. Глеб Корнеев сам снял оружейный блок со стойки и положил его на стол перед Ханом, как кладут сданную смену.\n\nМарк Рустан не стал звать караул. Караул уже стоял за дверью, и в нём не было ни одного человека Мансурова. Совет объявил, что реактор отныне работает на сеть, мастерские и поля, а связь со спутником не будет восстановлена ни по чьему приказу.\n\nУтром аймаки получили короткую телеграмму: Хан отошёл от дел, страной руководит совет."
 ADISCORD_rus_campaign.47.scientists.a:0 "Реактор будет давать ток, а не огонь."
 ADISCORD_rus_campaign.47.army.t:0 "Чёрная армия берёт Ставку"
 ADISCORD_rus_campaign.47.army.d:0 "Тагир Мансуров вошёл без доклада. За ним шли двое караульных и начальник связи с ключами от пульта. Марк Рустан успел спросить только, чей это приказ.\n\nИнженеров взяли в реакторном зале. Корнеев не сопротивлялся; когда его выводили, пульт спутника уже не отвечал, а в журнале смены стояла его последняя запись. Мансуров прочитал её и велел опечатать зал.\n\nК рассвету по всем заставам передали приказ: власть принадлежит армии, граница становится фронтом."
 ADISCORD_rus_campaign.47.army.a:0 "Армия удержит то, что взяла."
 ADISCORD_rus_campaign.48.t:0 "Переворот в Земле Хана"
 ADISCORD_rus_campaign.48.scientists.d:0 "Из бункера Хана пришла телеграмма за подписью совета инженеров. Марк Рустан отошёл от дел, страной руководит Глеб Корнеев. Совет сообщает соседям, что оружейный канал разобран и восстановлен не будет.\n\nОб армии Хана в телеграмме не сказано ни слова. Она по-прежнему стоит на границе."
 ADISCORD_rus_campaign.48.army.d:0 "Заставы Хана передали на всех частотах один и тот же приказ: власть принадлежит Чёрной армии, Марк Рустан смещён. Подписал приказ Тагир Мансуров.\n\nПо данным разведки, связь бункера со спутником прервана. Зато на дорогах к границе стало больше колонн."
 ADISCORD_rus_campaign.48.a:0 "Посмотрим, что они станут делать."
 # --- rus_scientists_regime ---
 RUS_reactor_council_category:0 "Совет реакторного пояса"
 RUS_reactor_council_category_desc:0 "Совет Корнеева правит из того же бункера, что и Хан, но смотрит на карту иначе. Реакторы, лаборатории и кордоны вокруг зоны для него не трофеи, а части одной машины. Её нужно собрать раньше, чем это сделают соседи."
 RUS_sci_engineers_commission:0 "Инженерная комиссия"
 RUS_sci_engineers_commission_desc:0 "Совет не может управлять страной по журналу смены. Корнеев созывает комиссию из начальников мастерских, лабораторий и реакторного зала: каждый отвечает за свой участок и докладывает не Хану, а друг другу."
 RUS_sci_amnesty_for_guard:0 "Амнистия караулу"
 RUS_sci_amnesty_for_guard_desc:0 "Чёрная армия проиграла спор, но не исчезла. Совет предлагает командирам сохранить звания и части, если они присягнут новому правительству. Армия останется сильной, но её верность придётся заслужить."
 RUS_sci_disarm_guard:0 "Разоружение Чёрной армии"
 RUS_sci_disarm_guard_desc:0 "Сотни, которые держали входы в бункер при Хане, распускают по аймакам. Офицеров, отказавшихся сдать оружие, переводят на дальние заставы. Армия станет слабее, зато в Ставке больше никто не будет ждать удобной ночи."
 RUS_sci_object_register:0 "Опись объектов"
 RUS_sci_object_register_desc:0 "Довоенные схемы реакторного пояса лежат в архиве вперемешку с донесениями разведки. Инженеры сводят их в одну опись: где стоит реактор, где лаборатория, где цех, который можно запустить за месяц, если не разбить его при штурме."
 RUS_sci_reactor_contour:0 "Реакторный контур"
 RUS_sci_reactor_contour_desc:0 "Реактор, лаборатории и линии между ними строили как единую систему. Совет восстанавливает её чертежи и требует, чтобы склады и мастерские работали по одному графику с реакторным залом."
 RUS_sci_grid_for_neighbours:0 "Сеть для соседей"
 RUS_sci_grid_for_neighbours_desc:0 "Ток, который Хан берёг для спутника, можно продать. Инженеры тянут новые линии к границе: соседям, которые получают свет из бункера, труднее решиться на войну с ним."
 RUS_sci_technical_districts:0 "Технические округа"
 RUS_sci_technical_districts_desc:0 "Занятые земли получают не наместников, а инженеров округа. Они чинят водопровод и подстанции раньше, чем начинают собирать налоги. Аймаки охотнее подчиняются тем, кто вернул им свет, но в армию оттуда идут неохотно."
 RUS_sci_factory_republics:0 "Заводские республики"
 RUS_sci_factory_republics_desc:0 "Республики зоны не нужно держать гарнизонами, если они сами захотят работать на реактор. Совет готов вернуть им самоуправление в обмен на заводы, ток и общий договор с бункером."
 RUS_sci_outer_cordon:0 "Внешний заслон"
 RUS_sci_outer_cordon_desc:0 "Внешний заслон годами держит кордон вокруг зоны. Его фильтрационные лагеря и карантинные склады - единственная работающая система очистки по эту сторону от реактора. Совету нужна эта система, а не стены."
 RUS_sci_precise_operations:0 "Точные операции"
 RUS_sci_precise_operations_desc:0 "Объект, разрушенный при штурме, не стоит крови, пролитой за него. Совет готовит небольшие отряды, которые идут впереди армии и берут цеха и лаборатории до того, как гарнизон успеет их взорвать."
 RUS_sci_energy_blockade:0 "Энергетическая блокада"
 RUS_sci_energy_blockade_desc:0 "Противник, получающий ток с той же сети, воюет на чужом свету. Инженеры учатся отключать целые узлы одним приказом, а мастерские врага останавливаются без единого выстрела."
 RUS_sci_montera_claim:0 "Притязания Монтеры"
 RUS_sci_montera_claim_desc:0 "Монтера никогда не скрывала, что считает реакторный пояс своим. При Хане она ждала удобного часа. Теперь, когда бункером правит совет инженеров, в Монтере решили, что этот час близок."
 RUS_sci_reactor_war:0 "Реакторная война"
 RUS_sci_reactor_war_desc:0 "Совет не станет ждать, пока полки Монтеры подойдут к реакторному залу. Если войне быть, она начнётся в день, выбранный в бункере."
 RUS_sci_city_above_reactor:0 "Город над реактором"
 RUS_sci_city_above_reactor_desc:0 "Спор о реакторе решён. Совет впервые за много лет строит не казематы, а дома: над реакторным залом поднимаются цеха, школы и общежития. Под землёй остаются только машины."
 RUS_sci_survey_object:0 "Разведать объект: [FROM.GetName]"
 RUS_sci_survey_object_desc:0 "Инженерная разведка уходит за линию фронта с теодолитами и старыми схемами. Ей нужно найти, что уцелело, и пометить, куда нельзя стрелять."
 RUS_sci_launch_object:0 "Запустить объект: [FROM.GetName]"
 RUS_sci_launch_object_desc:0 "Разведанный объект перешёл к нам целым. Бригады совета расчищают цеха, проверяют проводку и ставят машины на прежние места."
 RUS_sci_charter_factory_republic:0 "Учредить заводскую республику"
 RUS_sci_charter_factory_republic_desc:0 "Делегаты аймаков подписывают договор с советом: самоуправление в своих границах, общий ток и заказы для мастерских бункера."
 RUS_sci_cordon_war:0 "Война за Внешний заслон"
 RUS_sci_cordon_war_desc:0 "Заслон не отдаст свои лагеря и склады по просьбе. Совет готов взять их силой, пока кордон не уничтожил то, ради чего его стоит брать."
 RUS_sci_adopt_living_filter:0 "Перенять \"Живой фильтр\""
 RUS_sci_adopt_living_filter_desc:0 "Карантинные пункты Заслона работают на людях, а не на машинах. Инженеры совета переписывают их порядок для своих округов: те же посты, те же проверки, но вместо оцепления - очистка."
 RUS_sci_power_blockade:0 "Отключить ток: [FROM.GetName]"
 RUS_sci_power_blockade_desc:0 "Диспетчеры реакторного зала ждут одного приказа. После него узлы на чужой стороне фронта гаснут один за другим."
 RUS_sci_guard_loyalty:0 "Верность караула"
 RUS_sci_guard_loyalty_desc:0 "Амнистированные командиры несут службу при совете, но многие из них ещё недавно стояли у двери Мансурова. Если совет покажет слабость, караул вспомнит, кому он присягал раньше."
 RUS_sci_montera_deadline:0 "Монтера готовит удар"
 RUS_sci_montera_deadline_desc:0 "Разведка докладывает о колоннах на дорогах Монтеры и о новых складах у границы. Если совет не выберет день сам, его выберут за него."
 RUS_sci_guard_loyalty_start_tt:0 "Начинается миссия §YВерность караула§!: если к её концу стабильность будет ниже §Y35%§!, караул поднимет мятеж (§R-10000§! £manpower_texticon, §R-3000§! £infantry_equipment_texticon, §R-5%§! стабильности и поддержки войны)."
 RUS_sci_guard_loyalty_tt:0 "Стабильность ниже §Y35%§!: мятеж караула. Иначе караул остаётся верен совету: §G+25§! £army_experience, §G+5%§! поддержки войны."
 RUS_sci_zone_pressed_tt:0 "Выполнен фокус §YНажать на закрытую зону§!."
 RUS_sci_object_register_tt:0 "Объекты: реакторный пояс и лаборатории, столица Внешнего заслона и промышленный рубеж Монтеры."
 RUS_sci_reactor_contour_tt:0 "Реактор и четыре лаборатории реакторного пояса сразу считаются §Yразведанными§!."
 RUS_sci_grid_for_neighbours_tt:0 "Сразу: §G+2§! £energy_consumption_texticon мощности бункера. §G+1§! место для энергетического контракта."
 RUS_sci_factory_republics_tt:0 "Поглощённую республику зоны, столицей которой мы владеем, можно учредить заново как нашего субъекта."
 RUS_sci_precise_operations_tt:0 "При запуске объекта в области дополнительно строится §Y1§! военный завод."
 RUS_sci_energy_blockade_power_tt:0 "Сразу: §G+1§! £energy_consumption_texticon мощности бункера."
 RUS_sci_montera_claim_tt:0 "Начинается миссия §YМонтера готовит удар§!: если до её конца реакторная война не начнётся, Монтера объявит войну сама, когда будет свободна от других войн."
 RUS_sci_reactor_war_tt:0 "Мы объявляем Монтере §Yреакторную войну§!. Её капитуляция отдаёт нам промышленный рубеж Монтеры; наша капитуляция отдаёт Монтере реакторный пояс, но не бункер."
 RUS_sci_montera_deadline_tt:0 "Монтера объявляет нам §Yреакторную войну§!, если свободна от войны с Кефрейтом и северного кризиса."
 RUS_sci_survey_reach_tt:0 "Область граничит с контролируемой нами областью."
 RUS_sci_survey_object_tt:0 "Инженерная разведка уходит к объекту."
 RUS_sci_survey_object_done_tt:0 "Объект §Yразведан§!: когда область станет нашей, его можно будет запустить."
 RUS_sci_launch_controlled_tt:0 "Мы контролируем область."
 RUS_sci_launch_object_tt:0 "Бригады совета восстанавливают объект."
 RUS_sci_factory_republic_eligible_tt:0 "Есть поглощённая республика зоны, столицей которой мы владеем."
 RUS_sci_charter_factory_republic_tt:0 "Первая подходящая республика зоны становится нашим субъектом и получает свои коренные области."
 RUS_sci_cordon_war_tt:0 "Мы объявляем войну §YВнешнему заслону§!. Его капитуляция передаёт нам все его области."
 RUS_sci_wcg_free_tt:0 "Внешний заслон существует, независим и не воюет с нами."
 RUS_sci_no_reactor_war_tt:0 "Реакторная война не идёт."
 RUS_sci_borders_wcg_tt:0 "Мы граничим с Внешним заслоном."
 RUS_sci_living_filter_site_tt:0 "Мы владеем столицей Внешнего заслона и контролируем её."
 RUS_sci_adopt_living_filter_tt:0 "Инженеры совета перенимают карантинный порядок Заслона."
 RUS_sci_living_filter_food_tt:0 "§G+1§! к выработке еды бункера."
 RUS_sci_power_blockade_free_tt:0 "Противник ещё не отключён от сети."
 RUS_sci_montera_available_tt:0 "Монтера независима, не капитулировала, не воюет с нами и с Кефрейтом; северный кризис присяги закончен."
 RUS_sci_borders_mon_tt:0 "Мы граничим с Монтерой."
 RUS_sci_montera_question_closed_tt:0 "Реакторная война закончена, или Монтеры больше нет, или она стала чьим-то субъектом."
 ADISCORD_rus_campaign.49.t:0 "Мятеж караула"
 ADISCORD_rus_campaign.49.d:0 "Ночью две сотни у нижних горизонтов не сменились. Утром их нашли у складов: командиры раздали людям оружие и потребовали вернуть армии прежние права.\n\nСовет не стал торговаться. К вечеру мятежников разоружили верные части, но склады пусты, а в казармах теперь больше охраны, чем солдат."
 ADISCORD_rus_campaign.49.a:0 "Совет не уступит."
 ADISCORD_rus_campaign.50.t:0 "Караул присягнул"
 ADISCORD_rus_campaign.50.d:0 "Последний из амнистированных командиров подписал присягу совету в реакторном зале, при инженерах. Никто не произносил речей. Командир попросил только, чтобы его сотне вернули номер, который она носила при Хане.\n\nКорнеев согласился. Армия, которая знает своё место, полезнее армии, которую приходится сторожить."
 ADISCORD_rus_campaign.50.a:0 "Пусть служат."
 ADISCORD_rus_campaign.51.t:0 "Реакторная война"
 ADISCORD_rus_campaign.51.d:0 "Граница с Монтерой закрыта. По всем заставам прошёл один приказ: держать реакторный пояс, что бы ни случилось с остальной страной.\n\nКорнеев провёл ночь в диспетчерской. Он знает, что Монтере нужен не бункер, а реактор, и что проигрыш этой войны оставит совету подземный город без тока."
 ADISCORD_rus_campaign.51.a:0 "Реактор останется нашим."
 ADISCORD_rus_campaign.52.t:0 "Война за реакторный пояс"
 ADISCORD_rus_campaign.52.d:0 "Совет инженеров, сменивший Хана, не отдаст реакторный пояс. На границе с зоной начались бои. Если бункер капитулирует, реактор перейдёт к нам; если капитулируем мы, совет заберёт наш промышленный рубеж."
 ADISCORD_rus_campaign.52.a:0 "Реактор будет нашим."
 ADISCORD_rus_campaign.53.t:0 "Монтера отступает"
 ADISCORD_rus_campaign.53.d:0 "Послы Монтеры подписали мир в пограничной сторожке, где когда-то стоял шлагбаум Хана. Монтера отказалась от притязаний на реакторный пояс и отдала совету свой промышленный рубеж.\n\nКорнеев приказал первым делом проверить подстанции на новых землях. Люди, которые месяц назад стреляли в инженеров, теперь ждут от них света."
 ADISCORD_rus_campaign.53.a:0 "Теперь можно строить."
 ADISCORD_rus_campaign.54.t:0 "Поражение в реакторной войне"
 ADISCORD_rus_campaign.54.d:0 "Наша армия не смогла пробиться к реактору. Мир подписан: промышленный рубеж у границы зоны переходит к совету инженеров."
 ADISCORD_rus_campaign.54.a:0 "Горький мир."
 ADISCORD_rus_campaign.55.t:0 "Реакторный пояс потерян"
 ADISCORD_rus_campaign.55.d:0 "Монтера получила то, за чем пришла. Реакторный пояс и лаборатории переходят к ней, а бункер остаётся с советом - без реактора, без запасного тока, с машинами, которые теперь нечем кормить.\n\nКорнеев не стал оправдываться. На первом заседании после мира он положил на стол новый план: жить на том, что осталось, и строить наверху то, что нельзя было построить внизу."
 ADISCORD_rus_campaign.55.a:0 "Начнём с того, что есть."
 ADISCORD_rus_campaign.56.t:0 "Реактор взят"
 ADISCORD_rus_campaign.56.d:0 "Совет инженеров капитулировал. Реакторный пояс и его лаборатории переходят к нам; бункер остаётся у совета."
 ADISCORD_rus_campaign.56.a:0 "Реактор наш."
 RUS_coup_faction_warning_tt:0 "Если до провозглашения империи перевес §Yучёных§! или §YЧёрной армии§! достигнет §Y60%§!, фракция начнёт заговор. Через §Y60§! дней, если перевес не опустится, она свергнет Марка Рустана."
 RUS_scientists_dominance_plot_tt:0 "Если Хан уже начал экспансию и ещё не провозгласил империю, §Yучёные§! начинают заговор: через §Y60§! дней, если их перевес не опустится ниже §Y60%§!, они свергнут Марка Рустана."
 RUS_black_army_dominance_plot_tt:0 "Если Хан уже начал экспансию и ещё не провозгласил империю, §YЧёрная армия§! начинает заговор: через §Y60§! дней, если её перевес не опустится ниже §Y60%§!, она свергнет Марка Рустана."
 ADISCORD_rus_campaign.57.t:0 "Учёные хотят последней империи"
 ADISCORD_rus_campaign.57.d:0 "Глеб Корнеев принёс Хану не схему, а записку на двух страницах. Инженеры, писал он, не против единой власти - они против того, чтобы она снова оказалась в руках одного человека и одного войска. Империи сменяли друг друга, и каждая оставляла после себя новую выжженную землю. Совет предлагает построить последнюю: единую техническую директорию, где заводы, ток и хлеб распределяют по расчёту, а не по присяге. После неё империй не будет.\n\nХан прочитал записку дважды. Он тоже собирался сделать свою империю последней, только иначе: его спутник должен выжечь все троны сразу, вместе с теми, кто на них сидит. Корнеев знает об этом. Пока совет нужен Хану, инженеры молчат. Но если они почувствуют силу, то решат, что директории Хан не нужен."
 ADISCORD_rus_campaign.57.a:0 "Совет нужен, но не над Ханом."
 ADISCORD_rus_campaign.58.t:0 "Чёрная армия помнит"
 ADISCORD_rus_campaign.58.d:0 "Тагир Мансуров редко говорит о прошлом. Но у каждого в караульной есть своя история: деревня, которой больше нет на картах, родня, ушедшая за кордон и не вернувшаяся, могилы, к которым нельзя подойти без противогаза. Эту землю отравили не соседи и не случай. Её отравил Воркерланд, а потом объявил закрытой и забыл о ней.\n\nЧёрная армия не хочет сжечь мир. Спутник Хана убьёт виноватых вместе с непричастными и не оставит никого, кто должен ответить. Армия хочет другого: дойти до Воркерланда своими ногами и заставить его заплатить за каждую выжженную долину. Пока Хан ведёт их к войне, они идут за ним. Если армия решит, что Хан ведёт их к пеплу, она найдёт себе другого командира."
 ADISCORD_rus_campaign.58.a:0 "Армия пойдёт туда, куда укажет Хан."
 # --- rus_black_army_regime ---
 RUS_guard_state_category:0 "Империя Чёрного Знамени"
 RUS_guard_state_category_desc:0 "Армия Мансурова правит из бункера по уставу караула. Каждая застава знает свой участок, каждый командир - свой пост. Но всё это только подготовка: Чёрная армия помнит, кто отравил эту землю, и ведёт счёт не дням, а шагам до Воркерланда."
 RUS_ba_levy_burden:0 "Комендантский набор"
 RUS_ba_gate_staff:0 "Штаб у ворот"
 RUS_ba_gate_staff_desc:0 "Ставка переезжает из реакторного зала к главным воротам бункера. Мансуров не доверяет залу, где ещё вчера сидели инженеры. Штаб у ворот видит всё, что входит и выходит, и готовит полки не к обороне, а к походу."
 RUS_ba_purge_laboratories:0 "Чистка лабораторий"
 RUS_ba_purge_laboratories_desc:0 "Лаборатории, построившие пульт Хана, закрывают. Инженеров, которые знали коды спутника, отправляют на дальние заставы, а залы опечатывают. Армия теряет мастерские, зато никто больше не сможет повернуть небо против неё."
 RUS_ba_labs_under_escort:0 "Лаборатории под конвоем"
 RUS_ba_labs_under_escort_desc:0 "Мансуров оставляет лаборатории открытыми, но у каждой двери ставит караул. Учёные будут работать на армию: новые винтовки, броня, боеприпасы. Им это не нравится, и в бункере это знают."
 RUS_ba_commandants:0 "Военные коменданты"
 RUS_ba_commandants_desc:0 "Аймаки зоны получают комендантов вместо выборных старшин. Комендант отвечает за дорогу, за склад и за то, сколько людей уйдёт с его участка в армию."
 RUS_ba_western_breach:0 "Пролом на запад"
 RUS_ba_western_breach_desc:0 "Дорога к Воркерланду идёт через чужие земли: кордон Внешнего заслона и Золоторевскую республику. Армия не будет просить пропуска. Если стены стоят на пути, их нужно проломить."
 RUS_ba_reconnaissance_in_force:0 "Разведка боем"
 RUS_ba_reconnaissance_in_force_desc:0 "Караульные сотни учатся уходить за линию фронта на одну ночь: сжечь склад, обрушить мост, вернуться до рассвета. Противник должен бояться не только наступления, но и тишины."
 RUS_ba_aimaq_militia:0 "Аймачное ополчение"
 RUS_ba_aimaq_militia_desc:0 "Каждый аймак выставляет свою сотню. Это не лучшие солдаты, но их много, и каждый из них знает, чьи руки отравили его землю."
 RUS_ba_shock_hundreds:0 "Ударные сотни"
 RUS_ba_shock_hundreds_desc:0 "Армия не станет брать числом. Лучших караульных сводят в ударные сотни с противогазами и химическим снаряжением: они пройдут там, где обычная пехота задохнётся."
 RUS_ba_revenge_oath:0 "Клятва мести"
 RUS_ba_revenge_oath_desc:0 "На плацу перед воротами армия приносит новую присягу. В ней нет слов о Хане и о спутнике. Есть только имя страны, которую армия поклялась заставить ответить, и названия долин, которые она отравила."
 RUS_ba_march_on_vorkerland:0 "Поход возмездия"
 RUS_ba_march_on_vorkerland_desc:0 "Колонны Чёрной армии выходят на западную дорогу. Хан хотел сжечь Воркерланд вместе со всем миром. Мансуров хочет, чтобы Воркерланд увидел своих судей в лицо."
 RUS_ba_military_districts:0 "Военные округа"
 RUS_ba_military_districts_desc:0 "Завоёванную землю не отдают обратно и не оставляют чужим правителям. Пограничные провинции побеждённых станут военными округами Чёрного Знамени."
 RUS_ba_guard_marches:0 "Караульные марки"
 RUS_ba_guard_marches_desc:0 "Армии не нужно управлять каждой деревней врага. Побеждённые сохранят свои столицы, но будут держать границу под знаменем Мансурова и платить за это своими гарнизонами."
 RUS_ba_black_banner_east:0 "Чёрное знамя на востоке"
 RUS_ba_black_banner_east_desc:0 "Месть свершилась или стала невозможна, а армия, которая привыкла идти, не умеет останавливаться. На востоке поднялась новая сила, и Чёрное знамя не потерпит рядом с собой другой империи."
 RUS_ba_guard_state:0 "Караульное государство"
 RUS_ba_guard_state_desc:0 "Войны закончились. Заставы стоят там, где их поставила армия, и устав караула стал законом страны. Империя Чёрного Знамени не строит над землёй городов, но её границу никто больше не переступит без спроса."
 RUS_ba_commandant_levy:0 "Комендантский набор: [FROM.GetName]"
 RUS_ba_commandant_levy_desc:0 "Комендант собирает мужчин аймака на площади и зачитывает список. Кто не придёт сам, за тем придут."
 RUS_ba_breach_war:0 "Пролом: [FROM.GetName]"
 RUS_ba_breach_war_desc:0 "Этот сосед стоит на дороге к Воркерланду. Армия пройдёт сквозь него."
 RUS_ba_raid:0 "Разведка боем: [FROM.GetName]"
 RUS_ba_raid_desc:0 "Ночью сотня уходит за линию фронта и к утру возвращается. За ней остаются горящие склады и разбитые дороги."
 RUS_ba_levy_controlled_tt:0 "Мы контролируем эту область."
 RUS_ba_breach_target_tt:0 "Сосед граничит с нами, независим, не капитулировал и не воюет с нами."
 RUS_ba_breach_war_tt:0 "Мы объявляем войну соседу. Его капитуляция передаёт нам все его области."
 RUS_ba_raid_reach_tt:0 "Противник владеет областью у нашей линии контроля."
 RUS_ba_commandants_tt:0 "Набор в области зоны: §G+3000§! £manpower_texticon и §G+600§! £infantry_equipment_texticon. Область на §Y180§! дней теряет половину местных рекрутов и часть производства."
 RUS_ba_march_on_vorkerland_tt:0 "Мы объявляем §Yвойну возмездия§! Воркерланду. Его капитуляция отдаёт нам пограничные с нами области или делает его нашим субъектом после §YКараульных марок§!; наша капитуляция возвращает Воркерланду Внешний заслон и Золоторевск."
 RUS_ba_military_districts_tt:0 "Побеждённые в войне возмездия и в восточной войне отдают нам свои пограничные с нами области."
 RUS_ba_guard_marches_tt:0 "Побеждённые в войне возмездия и в восточной войне становятся нашими субъектами."
 RUS_ba_black_banner_east_tt:0 "Мы объявляем войну восточной державе: региональному гегемону или Кефрейту. Её капитуляция исполняет наши условия; наша капитуляция отдаёт ей Восточную республику и внутренние земли зоны."
 RUS_ba_vorkerland_settled_tt:0 "Распад Воркерланда закончился, и западная война за него не идёт."
 RUS_ba_vorkerland_free_tt:0 "Воркерланд независим, не капитулировал и не воюет с нами."
 RUS_ba_borders_vorkerland_tt:0 "Мы граничим с Воркерландом."
 RUS_ba_vorkerland_question_closed_tt:0 "Война возмездия закончена, или Воркерланда больше нет, или он стал чьим-то субъектом."
 RUS_ba_kefreyt_campaign_quiet_tt:0 "Кефрейт не ведёт последнюю войну и спор за республики зоны."
 RUS_ba_east_candidate_tt:0 "Есть восточная держава, с которой мы или её субъекты граничим и не воюем: региональный гегемон или Кефрейт."
 RUS_ba_wars_closed_tt:0 "Война возмездия закончена, а восточная война закончена или невозможна."
 ADISCORD_rus_campaign.59.t:0 "Поход возмездия"
 ADISCORD_rus_campaign.59.d:0 "Колонны вышли до рассвета. Мансуров ехал в головной машине и не оглядывался на бункер. На первом привале он приказал прочитать вслух список: долины, деревни, колодцы, которые больше нельзя пить. Список читали полчаса.\n\nВоркерланд получил ноту в тот же день. В ней не было требований. Армия не собиралась ни о чём договариваться."
 ADISCORD_rus_campaign.59.a:0 "Пусть ответят."
 ADISCORD_rus_campaign.60.t:0 "Чёрное знамя на западной дороге"
 ADISCORD_rus_campaign.60.d:0 "Армия, свергнувшая Хана, объявила нам войну. Её командиры называют это местью за зону. Если мы капитулируем, Чёрная армия заберёт пограничные земли или поставит нас под своё знамя; если капитулирует она, Внешний заслон и Золоторевск вернутся к нам."
 ADISCORD_rus_campaign.60.a:0 "Мы их остановим."
 ADISCORD_rus_campaign.61.t:0 "Воркерланд ответил"
 ADISCORD_rus_campaign.61.d:0 "Мир подписали в Золоторевске, в здании бывшей таможни. Послы Воркерланда не поднимали глаз. Мансуров выслушал текст договора и подписал его, не садясь.\n\nВечером в бункере не праздновали. Караульные молча зачитали тот же список, что и в день выступления, и после каждого названия кто-то из командиров отвечал: \"Отомщено\"."
 ADISCORD_rus_campaign.61.a:0 "Отомщено."
 ADISCORD_rus_campaign.62.t:0 "Западная дорога закрыта"
 ADISCORD_rus_campaign.62.d:0 "Армия не дошла. Воркерланд вернул себе Внешний заслон и Золоторевск, а колонны Чёрного знамени отходят к зоне.\n\nМансуров не сменил ни одного командира. Он сказал только, что месть отложена, а не отменена, и приказал строить заставы на новой границе."
 ADISCORD_rus_campaign.62.a:0 "Месть отложена."
 ADISCORD_rus_campaign.63.t:0 "Чёрное знамя на востоке"
 ADISCORD_rus_campaign.63.d:0 "Армия повернула на восток. Ставка у ворот работала всю ночь: пересчитывали полки, склады, дороги. Мансуров знает, что восточная держава сильнее Воркерланда. Знает он и то, что армия, которая остановилась, начинает искать себе нового командира."
 ADISCORD_rus_campaign.63.a:0 "Вперёд."
 ADISCORD_rus_campaign.64.t:0 "Война с Чёрной армией"
 ADISCORD_rus_campaign.64.d:0 "Армия, правящая землёй Хана, объявила нам войну. Если мы капитулируем, Чёрная армия заберёт пограничные области или сделает нас своим субъектом; если капитулирует она, к нам отойдут Восточная республика и внутренние земли зоны."
 ADISCORD_rus_campaign.64.a:0 "Они пожалеют."
 ADISCORD_rus_campaign.65.t:0 "Восток под знаменем"
 ADISCORD_rus_campaign.65.d:0 "Восточная держава подписала мир. Над её пограничными заставами теперь висит чёрное полотнище, и караул сменяется по уставу бункера.\n\nМансуров впервые за много месяцев спал больше четырёх часов. Утром он приказал составить новый список - не мёртвых, а тех, кто будет держать эту границу."
 ADISCORD_rus_campaign.65.a:0 "Держать строй."
 ADISCORD_rus_campaign.66.t:0 "Восточный фронт рухнул"
 ADISCORD_rus_campaign.66.d:0 "Восточная держава оказалась сильнее. Восточная республика и внутренние земли зоны уходят к ней, и армия отступает к бункеру.\n\nВ караульных говорят тихо. Армию держит устав, но устав не объясняет, зачем идти дальше."
 ADISCORD_rus_campaign.66.a:0 "Устав остаётся."
 RUS_bunker_guard_description_rules_tt:0 "Строительство: §Y28 дней§!. Один вариант на слой.\nСодержание: §Y1§! £supply_texticon в неделю.\n\n[GetRUSBunkerForecastguard]"
 RUS_bunker_shelter_description_rules_tt:0 "Строительство: §Y28 дней§!. Один вариант на слой.\nСодержание: §Y1§! £supply_texticon в неделю.\n\n[GetRUSBunkerForecastshelter]"
 RUS_bunker_water_description_rules_tt:0 "Строительство: §Y28 дней§!. Один вариант на слой.\nСодержание: §Y1§! £supply_texticon в неделю.\n\n[GetRUSBunkerForecastwater]"
 RUS_bunker_signals_description_rules_tt:0 "Строительство: §Y28 дней§!. Один вариант на слой.\nСодержание: §Y1§! £supply_texticon в неделю.\n\n[GetRUSBunkerForecastsignals]"
 RUS_bunker_workshop_description_rules_tt:0 "Строительство: §Y28 дней§!. Один вариант на слой.\nСодержание: §Y1§! £supply_texticon в неделю.\n\nПлатные программы при действующем арсенале: \"Заказ инженерного оснащения\" - §G150§! £support_equipment_texticon вместо 100; \"Обучение мастеров и подмастерьев\" - §G+40§! £ADISCORD_country_development_texticon экономики вместо 25.\n\n[GetRUSBunkerForecastworkshop]"
 RUS_bunker_granary_description_rules_tt:0 "Строительство: §Y28 дней§!. Один вариант на слой.\nСодержание: §Y1§! £supply_texticon в неделю.\n\n[GetRUSBunkerForecastgranary]"
 RUS_bunker_clinic_description_rules_tt:0 "Строительство: §Y28 дней§!. Один вариант на слой.\nСодержание: §Y1§! £supply_texticon в неделю.\n\nПлатная программа при действующем медблоке: \"Подготовить окружных фельдшеров\" - §G+40§! £ADISCORD_country_development_texticon социальной системы вместо 25.\n\n[GetRUSBunkerForecastclinic]"
 RUS_bunker_laboratory_description_rules_tt:0 "Строительство: §Y28 дней§!. Один вариант на слой.\nСодержание: §Y1§! £supply_texticon в неделю.\n\n\"Реакторные сплавы\": ещё §G50%§! ускорения одного исследования технологий поддержки, если лаборатория работает при завершении проекта. Воздушный линкор доступен и с медблоком.\n\n[GetRUSBunkerForecastlaboratory]"
 RUS_bunker_archive_description_rules_tt:0 "Строительство: §Y28 дней§!. Один вариант на слой.\nСодержание: §Y1§! £supply_texticon в неделю.\n\nПосле \"Подготовки управленцев\" действующий архив добавляет §G+15§! £ADISCORD_country_development_texticon государственного аппарата к каждой оплаченной программе чиновников.\n\n[GetRUSBunkerForecastarchive]"
 RUS_bunker_command_description_rules_tt:0 "Строительство: §Y28 дней§!. Один вариант на слой.\nСодержание: §Y1§! £supply_texticon в неделю.\n\n[GetRUSBunkerForecastcommand]"
 RUS_engineering_order_description_rules_tt:0 "Оплата и поставка немедленные; повторный заказ через 60 дней.\n\nПоставка: §G100§! £support_equipment_texticon, с действующей подземной мастерской - §G150§! за ту же цену."
 RUS_vorkerland_airlift_description_rules_tt:0 "Каждые §Y50§! дней прилетает новая партия: сначала большая, потом меньше, потом совсем скромная. Если в Воркерланде начнётся смута, мост оборвётся раньше."
 RUS_bunker_mushroom_farm_description_rules_tt:0 "Каждая ферма даёт §G+2§! £supply_texticon в неделю и постоянно занимает §Y1§! £energy_consumption_texticon. Можно построить до §Y3§! ферм, по одной за раз. Ферм сейчас: §Y[?RUS_bunker_farms|0]§!/3."
 RUS_civil_factory_order_description_rules_tt:0 "Срок: 45 дней. Результат: одна гражданская фабрика. Строительство и артиллерийские заказы занимают одну общую очередь. После завершения действует перерыв 180 дней. Утрата контроля, власти Хана или свободного места возвращает всю оплату."
 RUS_artillery_order_description_rules_tt:0 "Срок: 30 дней. На склад поступят 120 единиц базовой артиллерии. Заказ использует ту же очередь, что и гражданская фабрика. После завершения действует перерыв 90 дней. При утрате контроля над бункером или власти Хана вся оплата возвращается."
 RUS_district_relief_description_rules_tt:0 "Помощь поступает сразу. Повторение через 90 дней. После провозглашения империи выполнение обещаний также восстанавливает мораль армии."
 RUS_restore_reactor_works_description_rules_tt:0 "Работы длятся 120 дней."
 RUS_reactor_sortie_description_rules_tt:0 "Группа уходит на 30 дней; защитное оснащение расходуется при выходе, люди из резерва не списываются. Повторение через 60 дней."
 RUS_lab_reactor_alloys_description_rules_tt:0 "Проект даёт промышленный задел и материал для корпуса будущего воздушного линкора. Работы длятся 60 дней.\n\nРаботающая подземная лаборатория при завершении проекта дополнительно даёт §G50%§! ускорение одного исследования технологий поддержки."
 RUS_lab_zeppelin_description_rules_tt:0 "Экипаж набирается сразу. Второй корабль построить не удастся, а потерянный корпус нечем заменить. Работы длятся 150 дней.\n\nПроект доступен при учёном и военном курсе, включая крайние значения баланса власти."
 RUS_rifle_order_description_rules_tt:0 "Формирования получают людей и снаряжение обычным порядком.\n\nОплата и поставка немедленные; повторный заказ через 60 дней."
 RUS_market_surplus_description_rules_tt:0 "Снаряжение списывается из настоящего национального запаса.\n\nОплата и поставка немедленные; повторный заказ через 60 дней."
 RUS_bunker_food_convoy_description_rules_tt:0 "Принимаются только полные партии: на складе должно быть место под всю поставку.\n\nОбоз сразу добавляет §G40§! £supply_texticon (§G60§! после \"Резерва тяжёлых перевозок\") за §Y15§! £political_power_texticon и §Y165§! £ADISCORD_economy_treasury_texticon.\n\nКаждый оснащённый слой расходует 1 еды в неделю; беженцы, ополчение и новые области добавляют едоков. Пустой склад вызывает дух \"Голод в галереях\" (стабильность §R-20%§!, поддержка войны §R-10%§!, организация армии §R-15%§!, выпуск военных заводов §R-15%§!, исследования §R-10%§!, §R-0.25§! £political_power_texticon в день). Склад, заполненный на 75% и больше (60% после \"Резерва между сменами\"), даёт сытость: +5% стабильности и +5% скорости пополнения. Излишки можно продать аймакам. Потеря бункера останавливает расход и производство; оставшийся запас сохраняется."
 RUS_bunker_food_sale_description_rules_tt:0 "Продажа опустошает склад и может лишить бункер сытости. Повторение через 30 дней."
 RUS_bunker_silence_trial_description_rules_tt:0 "Тридцать дней склад не должен опустеть, а своды - ослабнуть ниже §Y60§! £fort_texticon."
 RUS_bunker_research_bureau_description_rules_tt:0 "Выделенные средства позволят открыть бюро и вести ещё одно исследование одновременно. Решение доступно один раз; ячейка открывается сразу после оплаты."
 RUS_aimaq_food_requisition_description_rules_tt:0 "Повторение через 90 дней."
 RUS_aimaq_levy_description_rules_tt:0 "Это не армия: ополченцы плохо держат удар и разойдутся по домам с концом войны. Зато они не уводят людей из призывных списков."
 RUS_defensive_preparation_description_rules_tt:0 "Подготовка действует 120 дней; следующий цикл можно оплатить после её окончания. Программа применяется во время войны и прекращается при наступлении мира."
 RUS_mobile_preparation_description_rules_tt:0 "Подготовка действует 120 дней; следующий цикл можно оплатить после её окончания. Программа применяется во время войны и прекращается при наступлении мира."
 RUS_aimaq_public_works_description_rules_tt:0 "На 180 дней страна получит +5% скорости строительства; инфраструктура региона [66.GetName] вырастет на один уровень, если ещё не достигла 5. При максимальных дорогах артели продолжают работать на других стройках. Результат выдаётся при оплате, новый заказ - после окончания службы артелей."
 RUS_civil_service_training_description_rules_tt:0 "Полученный опыт остаётся у государственного аппарата. Повторная программа доступна через 90 дней.\n\nБазовый результат: §G+25§! £ADISCORD_country_development_texticon государственного развития. \"Устав аймачной службы\" добавляет §G+15§! £ADISCORD_country_development_texticon развития общества; \"Испытание государственной службой\" - §G+15§! £ADISCORD_country_development_texticon государственного развития.\n\n\"Подготовка управленцев\" добавляет §G+10§! £ADISCORD_country_development_texticon государственного развития; при ней работающий архив аймаков даёт ещё §G+15§! £ADISCORD_country_development_texticon. Цена и перерыв между программами сохраняются."
 RUS_workshop_training_description_rules_tt:0 "Общие чертежи, проверка деталей и обучение работе со станками дадут хозяйству знания, которые сохранятся после окончания программы. Повторная программа доступна через 90 дней."
 RUS_campaign_bread_and_shelter_description_rules_tt:0 "Кампания помогает организации тыла; продовольствие в бункер по-прежнему доставляют отдельным заказом."
 RUS_campaign_last_order_description_rules_tt:0 "Эта кампания действует только пока страна воюет. При наступлении мира она прекращается и освобождает место; потраченная политическая власть не возвращается."
 RUS_bop_relief_description_rules_tt:0 "Сытые смены работают спокойнее, а учёные получают больше голоса в распределении запасов. Пища списывается сразу; опустошённый склад может вызвать голод в оснащённых помещениях. Повторение через 90 дней."
 RUS_bop_reserve_description_rules_tt:0 "Страна получает резервистов, а армия - больше влияния на распределение запасов. Это люди для пополнения и набора, а не готовые вооружённые дивизии. Пища списывается сразу; опустошённый склад может вызвать голод. Повторение через 90 дней."
 RUS_bop_mediation_description_rules_tt:0 "Согласование полномочий приближает стороны к компромиссу, и обе уходят с ощущением, что Хан их услышал. Повторение через 90 дней."
 RUS_favour_shock_fist_description_rules_tt:0 "Применяется только во время войны и прекращается при наступлении мира."
 RUS_favour_guard_instructors_description_rules_tt:0 "Армия станет опытнее, а Чёрная армия - обиднее: её лучших людей используют как учителей."
 RUS_favour_night_shifts_description_rules_tt:0 "Исследования ускорятся, а усталость лабораторий ляжет на их отношение к правительству."
 RUS_favour_prototypes_description_rules_tt:0 "Заводы получат готовые решения, учёные - ощущение, что у них забрали работу на полпути."
 RUS_favour_reactor_current_description_rules_tt:0 "Станки заработают быстрее, а опыты подождут, и учёные этого не забудут."
 RUS_suspicion_energy_cover_description_rules_tt:0 "Соседи увидят стройку электростанции, а не оружие. Подозрение сейчас: §Y[?RUS_suspicion|0]§!/100 £RUS_suspicion_texticon. Повторение через 60 дней."
 RUS_suspicion_disperse_musters_description_rules_tt:0 "Подозрение сейчас: §Y[?RUS_suspicion|0]§!/100 £RUS_suspicion_texticon. Повторение через 60 дней."
 RUS_suspicion_envoys_description_rules_tt:0 "Монтарские штабы не перестанут считать дивизии, но отложат часть приготовлений. Подозрение сейчас: §Y[?RUS_suspicion|0]§!/100 £RUS_suspicion_texticon. Повторение через 120 дней."
 RUS_suspicion_ration_aid_description_rules_tt:0 "Пища списывается сразу; опустошённый склад может вызвать голод. Подозрение сейчас: §Y[?RUS_suspicion|0]§!/100 £RUS_suspicion_texticon. Повторение через 60 дней."
 RUS_suspicion_border_bribes_description_rules_tt:0 "Подозрение сейчас: §Y[?RUS_suspicion|0]§!/100 £RUS_suspicion_texticon. Повторение через 90 дней."
 RUS_suspicion_press_tour_description_rules_tt:0 "Подозрение сейчас: §Y[?RUS_suspicion|0]§!/100 £RUS_suspicion_texticon. Повторение через 60 дней."
 RUS_suspicion_reactor_camouflage_description_rules_tt:0 "Пища списывается сразу. Подозрение сейчас: §Y[?RUS_suspicion|0]§!/100 £RUS_suspicion_texticon. Повторение через 90 дней."
 RUS_suspicion_border_commission_description_rules_tt:0 "Пища списывается сразу. Подозрение сейчас: §Y[?RUS_suspicion|0]§!/100 £RUS_suspicion_texticon. Повторение через 120 дней."
 RUS_shadow_rifles_description_rules_tt:0 "Подозрение сейчас: §Y[?RUS_suspicion|0]§!/100 £RUS_suspicion_texticon. Повторение через 90 дней."
 RUS_shadow_designs_description_rules_tt:0 "Учёные получат готовые решения, а соседи - доказательство, что у Хана есть уши в их цехах. Подозрение сейчас: §Y[?RUS_suspicion|0]§!/100 £RUS_suspicion_texticon. Повторение через 120 дней."
 RUS_shadow_engineers_description_rules_tt:0 "Подозрение сейчас: §Y[?RUS_suspicion|0]§!/100 £RUS_suspicion_texticon. Повторение через 120 дней."
 RUS_crisis_player_attack_description_rules_tt:0 "Региональная победа позволяет выступить против Хана, не дожидаясь провозглашения его империи или раскрытия орбитальной программы. Это решение доступно, когда обеими странами управляют игроки. Если вмешательство уже началось, мы вступим в общую войну против Хана."
 RUS_imperial_frontier_campaign_description_rules_tt:0 "Начать войну за присоединение соседней страны. Нужна общая граница; цель должна быть независима и не входить в альянс. Империя открывает один фронт за раз. Подготовка и ведение последнего похода против гегемона временно закрывают новые пограничные войны."
 RUS_crisis_invasion_countdown_description_rules_tt:0 "Через 90 дней после раскрытия программы независимые Монтарская империя, Вальдский союз, Тимерская палата и Свободная республика Байринж выступят против Хана. Победитель юга и гегемон востока присоединятся, если они независимы и завершили свои войны. Байринж, Монтарская империя и Тимерская палата образуют Реакторный пакт, если ещё не связаны другими союзами. Участники приводят своих союзников и зависимые страны на общую сторону войны с Ханом, сохраняя прежние альянсы. Страна, воюющая с уже вступившим участником, не сможет присоединиться к его стороне. Ранее начавшаяся отдельная война против Хана сохранит свою развязку. Состав проверяется в день вмешательства; закрытие событий не меняет срок."
 RUS_crisis_defence_countdown_description_rules_tt:0 "До запуска отведено 455 дней с раскрытия программы: 90 дней на подготовку вмешательства и 365 дней на борьбу. Захватите весь реакторный периметр ($STATE_176$, $STATE_177$, $STATE_188$, $STATE_192$), чтобы навсегда сорвать программу, либо разгромите Хана. Каждая армия действует в составе своего союза; прежние войны продолжаются. Освобождение уже капитулировавшего участника возвращает его в борьбу."
 RUS_crisis_laser_countdown_description_rules_tt:0 "Реактор заряжает орбитальную систему. Последний луч должен ударить в его ядро и вызвать катастрофу, которая разрушит промышленный мир. От раскрытия программы до запуска - 455 дней. Удерживайте хотя бы одну из четырёх реакторных зон ($STATE_176$, $STATE_177$, $STATE_188$, $STATE_192$). Потеря всего периметра или падение власти Хана окончательно срывает запуск. Военная победа над коалицией не останавливает подготовку удара."
 RUS_crisis_establish_special_zone_description_rules_tt:0 "Учредить санитарно-пограничное управление на землях этого восстановленного осколка. Он станет нашей зависимой страной; остальные осколки сохранят самостоятельность, пока мы не примем отдельное решение."
 RUS_campaign_rza_description_rules_tt:0 "Союз Реакторной зоны держит заражённый промышленный узел. Ханская армия берёт его только при общей границе и свободном фронте."
 RUS_campaign_mlr_description_rules_tt:0 "Республика Малой низины лежит на следующем участке после Старолесья. Её берут отдельно, не смешивая с другими войнами."
 RUS_campaign_ert_description_rules_tt:0 "Восточная республика становится целью только когда ханские владения уже касаются её границы."
 RUS_campaign_irt_description_rules_tt:0 "Республика Внутренних земель открывается тем же правилом: общая граница и полный захват."
 RUS_campaign_sca_description_rules_tt:0 "Южная федерация - дальний сосед. Решение появляется только после того, как ханская земля дошла до её рубежа."
 RUS_proclaim_the_last_empire_description_rules_tt:0 "Аймаки и покорённые земли признают общую власть Хана. При наличии доступа к реакторному периметру провозглашение открывает орбитальную программу: 90 дней до вмешательства и 455 дней до удара. Военная победа не отменяет отсчёт. При полном раскрытии тайны вмешательство начинается без срока подготовки."
 RUS_bunker_energy_sale_description_rules_tt:0 "Подключить поселения к генераторам бункера. За §Y90 дней§! поставок покупатели платят §G100§! £ADISCORD_economy_treasury_texticon сразу. Контракт занимает §Y1§! £energy_consumption_texticon свободной мощности: она недоступна для новых помещений до конца поставок. Одновременно действует один контракт. При потере контроля над бункером или прекращении правления Хана аванс возвращается."
 RUS_restore_wasteland_description_rules_tt:0 "Восстановление области [FROM.GetName]: §Y120 дней§!.\nРезультат: §Yпустошь -> сельская область§!; §G+1§! уровень инфраструктуры, максимум §Y5§!. Одновременно идёт одна стройка.\n\n§RОтмена§! при потере владения или контроля, смене типа области либо прекращении правления Хана. §GВся оплата возвращается.§!\nГотовые улучшения сохраняются при смене владельца."
 RUS_chancery_reconstruction_description_rules_tt:0 "Инспекционная палата оплатит ввод новой оружейной линии в регионе [66.GetName]. Один военный завод появляется сразу после оплаты и занимает обычную ячейку строительства. Следующий заказ - через 180 дней."
 RUS_surface_industrial_contract_description_rules_tt:0 "Наземный промышленный договор вводит гражданскую фабрику в регионе [66.GetName] сразу после оплаты. Предприятие занимает обычную ячейку строительства. Следующий договор можно заключить через 180 дней."
 RUS_subterranean_supply_contract_description_rules_tt:0 "Подземный фонд закупит оборудование для переработки и хранения пищи. Каждый из двух контуров увеличивает постоянный выпуск и ёмкость запасов. Монтаж выполняется при оплате; второй контракт доступен через 60 дней. Построено: [?RUS_bunker_autonomy_contracts|0]/2."
 RUS_community_assemblies_description_rules_tt:0 "Оплатить развитие общества: §G25§! £ADISCORD_country_development_texticon за §Y35§! £ADISCORD_economy_treasury_texticon и §Y25§! £political_power_texticon. Повторная программа доступна через §Y90 дней§!."
 RUS_public_reading_rooms_description_rules_tt:0 "Оплатить развитие культуры: §G25§! £ADISCORD_country_development_texticon за §Y35§! £ADISCORD_economy_treasury_texticon и §Y25§! £political_power_texticon. Повторная программа доступна через §Y90 дней§!."
 RUS_regimental_training_description_rules_tt:0 "Оплатить развитие армии: §G25§! £ADISCORD_country_development_texticon за §Y35§! £ADISCORD_economy_treasury_texticon и §Y25§! £political_power_texticon. Повторная программа доступна через §Y90 дней§!."
 RUS_machine_reserve_release_description_rules_tt:0 "Отдать инструменты мастерским и открыть резервный бюджет. Выдача использует весь машинный резерв; аварийный ремонт за его счёт станет недоступен."
 RUS_machine_reserve_repair_description_rules_tt:0 "Аварийная служба заменит повреждённые насосы и затворы из неприкосновенного запаса. Ремонт доступен при прочности не выше 40 и выполняется сразу, не занимая и не отменяя оплаченную строительную очередь. Оставшаяся часть запаса поступит в распоряжение страны. Повторно использовать резерв нельзя."
 RUS_bunker_strip_1_description_rules_tt:0 "Демонтировать действующее помещение и освободить его мощность. Глубина и прочность сохраняются; стоимость монтажа не возвращается. После демонтажа можно оплатить любую специализацию этого слоя заново."
 RUS_bunker_strip_2_description_rules_tt:0 "Демонтировать действующее помещение и освободить его мощность. Глубина и прочность сохраняются; стоимость монтажа не возвращается. После демонтажа можно оплатить любую специализацию этого слоя заново."
 RUS_bunker_strip_3_description_rules_tt:0 "Демонтировать действующее помещение и освободить его мощность. Глубина и прочность сохраняются; стоимость монтажа не возвращается. После демонтажа можно оплатить любую специализацию этого слоя заново."
 RUS_bunker_strip_4_description_rules_tt:0 "Демонтировать действующее помещение и освободить его мощность. Глубина и прочность сохраняются; стоимость монтажа не возвращается. После демонтажа можно оплатить любую специализацию этого слоя заново."
 RUS_bunker_strip_5_description_rules_tt:0 "Демонтировать действующее помещение и освободить его мощность. Глубина и прочность сохраняются; стоимость монтажа не возвращается. После демонтажа можно оплатить любую специализацию этого слоя заново."
 RUS_bunker_upgrade_1_description_rules_tt:0 "Существующее помещение получает вторую очередь оборудования. Назначение слоя сохраняется.\n\nРаботы: §Y28 дней§!.\n\n[GetRUSBunkerForecastUpgrade1]"
 RUS_bunker_upgrade_2_description_rules_tt:0 "Существующее помещение получает вторую очередь оборудования. Назначение слоя сохраняется.\n\nРаботы: §Y28 дней§!.\n\n[GetRUSBunkerForecastUpgrade2]"
 RUS_bunker_upgrade_3_description_rules_tt:0 "Существующее помещение получает вторую очередь оборудования. Назначение слоя сохраняется.\n\nРаботы: §Y28 дней§!.\n\n[GetRUSBunkerForecastUpgrade3]"
 RUS_bunker_upgrade_4_description_rules_tt:0 "Существующее помещение получает вторую очередь оборудования. Назначение слоя сохраняется.\n\nРаботы: §Y28 дней§!.\n\n[GetRUSBunkerForecastUpgrade4]"
