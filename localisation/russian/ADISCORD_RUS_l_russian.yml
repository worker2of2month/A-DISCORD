 RUS_morale_status:0 "§YМораль армии:§! §Y[?RUS_army_morale|0]§!/100\nВ месяц: потери §R-1§! за каждые [GetRUSMoraleCasualtyStep] тысяч, не больше §R-10§![GetRUSMoralePeaceGrowth][GetRUSMoraleKitchens][GetRUSMoraleArmyGrowth].\nПотеря области: §R-1§!, коренной §R-3§!, реакторной зоны §R-8§!, столицы §R-15§!; возвращение восстанавливает [GetRUSMoraleRecovery]. При §Y60§!, §Y35§! и §Y15§! армия ропщет, бежит и готовит заговор. При §Y0§! во время войны Хан погибнет, а империя распадётся."
