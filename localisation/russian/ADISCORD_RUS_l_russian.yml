 RUS_bunker_food_convoy:0 "Обоз продовольствия"
 RUS_bunker_food_convoy_desc:0 "Грузовики с крупой, солью и консервами разгружаются у верхнего шлюза. Принимаются только полные партии: на складе должно быть место под всю поставку.\n\nОбоз сразу добавляет §G40§! £supply_texticon (§G60§! после «Резерва тяжёлых перевозок») за §Y15§! £political_power_texticon и §Y165§! £ADISCORD_economy_treasury_texticon.\n\nКаждый оснащённый слой расходует 1 еды в неделю; беженцы, ополчение и новые области добавляют едоков. Пустой склад вызывает дух «Голод в галереях» (стабильность §R-20%§!, поддержка войны §R-10%§!, организация армии §R-15%§!, выпуск военных заводов §R-15%§!, исследования §R-10%§!, §R-0.25§! £political_power_texticon в день). Склад, заполненный на 75% и больше (60% после «Резерва между сменами»), даёт сытость: +5% стабильности и +5% скорости пополнения. Излишки можно продать аймакам. Потеря бункера останавливает расход и производство; оставшийся запас сохраняется."
 RUS_bunker_food_convoy_available_tt:0 "Бункер работает; на складе есть место под всю поставку: 40 £supply_texticon, после «Резерва тяжёлых перевозок» - 60."
 RUS_bunker_food_convoy_tt:0 "Продовольственный запас: §G+40§! £supply_texticon."
 RUS_bunker_food_convoy_large_tt:0 "Продовольственный запас: §G+60§! £supply_texticon."
 RUS_bunker_rations_fed:0 "§GСытость: +5% стабильности и пополнения§!"
 RUS_bunker_food_sale:0 "Продать излишки аймакам"
 RUS_bunker_food_sale_desc:0 "Склады бункера не резиновые: всё, что не помещается, портится у шлюза. Аймаки охотно купят крупу и консервы, если их везут не по реквизиции, а по честной цене. Продажа опустошает склад и может лишить бункер сытости. Повторение через 30 дней."
 RUS_bunker_food_sale_available_tt:0 "Бункер работает; на складе есть не менее 40 £supply_texticon."
 RUS_bunker_food_sale_cost:0 "§Y40§! £supply_texticon"
 RUS_bunker_food_sale_cost_blocked:0 "§R40§! £supply_texticon"
 RUS_bunker_food_sale_cost_tooltip:0 "Нужно 40 £supply_texticon на складе бункера."
 RUS_bunker_food_sale_tt:0 "Казна: §G+100§! £ADISCORD_economy_treasury_texticon."
 RUS_repair_depots_spirit:0 "Ремонтные депо пояса"
 RUS_repair_depots_spirit_desc:0 "Выездные бригады чинят станки прямо в цехах, а не ждут, пока деталь привезут из столицы. Заводы промышленного пояса работают ровнее и дольше держат налаженный ритм.\n\n\n\n\n\n £GFX_ADISCORD_industry_banner \n\n\n"
 RUS_strategic_freight_reserve_convoy_tt:0 "Обоз продовольствия доставляет §G60§! £supply_texticon вместо 40 по прежней цене."
 RUS_bunker_food_cost_cash_ok:0 "§Y165§! £ADISCORD_economy_treasury_texticon"
 RUS_bunker_food_cost_cash_low:0 "§R165§! £ADISCORD_economy_treasury_texticon"
 RUS_bunker_food_cost:0 "[GetRUSBunker31pp]  [GetRUSBunkerFoodCash]"
 RUS_bunker_food_cost_blocked:0 "[GetRUSBunker31pp]  [GetRUSBunkerFoodCash]"
 RUS_bunker_food_cost_tooltip:0 "[GetRUSBunker31pp]  [GetRUSBunkerFoodCash]"
 RUS_bunker_rations_ok:0 "§GРацион обеспечен§!"
 RUS_bunker_rations_empty:0 "§RГолод: нет продовольствия§!"
 RUS_district_ledger:0 "Одна книга на все аймаки"
 RUS_district_ledger_desc:0 "Перепись дала каждому подданному имя, но округа всё ещё используют несовместимые ведомости. Единая книга поставок свяжет мастерские, склады и инженерную службу. Учёт хозяйств обеспечит регулярные сборы, а новые производственные стандарты - исследовательскую работу."
 RUS_courier_stations:0 "Станции ханской почты"
 RUS_courier_stations_desc:0 "Приказ, который приходит после зимы, уже не приказ. Свяжем окружные канцелярии регулярной автомобильной почтой и выделим диспетчерам действующие машины. На этих же станциях армейские связные смогут менять экипажи и передавать срочные донесения."
 RUS_district_paramedics:0 "Фельдшер каждого округа"
 RUS_district_paramedics_desc:0 "Дорожные лечебницы должны работать и тогда, когда столица забывает прислать врача. Окружные школы подготовят фельдшеров, знакомых с местными болезнями и военной эвакуацией. Санитарные обозы получат оснащение из центра, а новые приёмы станут достоянием всей службы."
 RUS_district_paramedics_progress_tt:0 "Прогресс развития социальной системы: §G+20§!."
 RUS_covenant_of_service:0 "Хартия служилых людей"
 RUS_covenant_of_service_desc:0 "Верность Хану должна пережить смену начальника. Жалование, срок службы и помощь семьям закрепляются в единой хартии; суды аймаков получают право требовать её исполнения. Мы покупаем не молчание подданных, а уверенность в том, что данное государством слово чего-нибудь стоит."
 RUS_recovery_depots:0 "Возвращать станки в строй"
 RUS_recovery_depots_desc:0 "В промышленном поясе уже достаточно заводов, чтобы неисправная деталь могла остановить целый район. Центральное ремонтное депо соберёт выездные бригады, запас инструментов и транспорт. Первым в строй вернётся старый консервный цех: бункеру нужна еда не меньше, чем фронту - станки."
 RUS_interchangeable_parts:0 "Одинаковая резьба"
 RUS_interchangeable_parts_desc:0 "Мастерские Хана унаследовали десятки несовместимых стандартов. Коллегия инженеров утвердит общие допуски, размеры и чертежи. Две очереди переоснащения позволят постепенно связать старые станки с новым производством, не останавливая всю промышленность ради одного образцового цеха."
 RUS_second_arsenal_shift:0 "Вторая смена арсенала"
 RUS_second_arsenal_shift_desc:0 "Серийное производство требует собственной линии, а не ночных часов на чужом станке. Новый оружейный цех в столичном районе примет выпуск деталей по единым чертежам. Государство расширит площадку заранее, чтобы военный заказ не вытеснил гражданские мастерские."
 RUS_strategic_freight_reserve:0 "Резерв тяжёлых перевозок"
 RUS_strategic_freight_reserve_desc:0 "Завод не поможет фронту, если его продукция останется на погрузочной площадке. Отделим стратегический резерв локомотивов и грузовиков от ежедневных перевозок. Те же машины будут водить продовольственные обозы к бункеру: больше груза за рейс и новые склады у шлюза."
 RUS_field_evacuation_service:0 "Эшелоны возвращения"
 RUS_field_evacuation_service_desc:0 "Профессиональная армия обязана возвращать раненых с фронта. Санитарные эшелоны и полевые пункты получат собственное оснащение; их не придётся собирать заново перед каждой войной. Пусть путь бойца домой начинается ещё у передового перевязочного поста."
 RUS_rifle_inspection_board:0 "Приёмка ханского оружия"
 RUS_rifle_inspection_board_desc:0 "Разные аймаки принесли в армию разные винтовки и разные привычки. Приёмочная комиссия проверит надёжность оружия в пыли, морозе и длительном походе. Её выводы лягут в основу следующего образца вооружения, а испытательные партии пополнят учебные склады."
 RUS_artillery_observers:0 "Глаза батарей"
 RUS_artillery_observers_desc:0 "Орудия должны стрелять туда, где противник находится сейчас. Учебные батареи получат собственные наблюдательные группы, средства связи и практические таблицы корректировки. Совместные занятия пехоты и артиллеристов превратят огневую поддержку из удачи в ремесло."
 RUS_staff_field_exercise:0 "Учения без предупреждения"
 RUS_staff_field_exercise_desc:0 "Штабам предстоит действовать без заранее написанной развязки: потерянная переправа, оборванная связь, неожиданное наступление. Хан потребует разбирать ошибки до следующей войны. Полководец, умеющий менять замысел на ходу, ценнее красивого плана на стене."
 RUS_bunker_closed_cycle:0 "Замкнутый продовольственный цикл"
 RUS_bunker_closed_cycle_desc:0 "Пять оснащённых слоёв уже похожи на город, но город каждый день ест. Грибные камеры, переработка пищевых остатков и строгий санитарный контроль дадут дополнительный еженедельный рацион."
 RUS_bunker_reserve_turbine:0 "Независимая турбина"
 RUS_bunker_reserve_turbine_desc:0 "Расширение подземной ставки не должно каждый раз начинаться с отключения лаборатории или госпиталя. Дополнительная турбина получит отдельную линию питания и собственную смену механиков. Она увеличит доступную мощность комплекса, оставив место для будущей модернизации слоёв."
 RUS_bunker_cold_stores:0 "Подземные мастерские"
 RUS_bunker_cold_stores_desc:0 "Городу под землёй нужны собственные мастерские. Здесь будут собирать насосы, чинить станки и готовить оборудование для новых строек. Отдельная гражданская фабрика в столичном регионе даст этим работам постоянную производственную базу, а мастерам - место за пределами военных заказов."
 RUS_bunker_machine_depot:0 "Машинный запас под землёй"
 RUS_bunker_machine_depot_desc:0 "Каждый лифт, насос и гермозатвор однажды потребует ремонта. Соберём отдельный запас инструментов для инженерной службы, чтобы монтаж следующего слоя не оставлял действующие помещения без обслуживания."
 RUS_bunker_emergency_rations:0 "Неприкосновенный рацион"
 RUS_bunker_emergency_rations_desc:0 "Для неприкосновенного рациона выделят новые камеры хранения. Закупленная партия длительного хранения полностью пополнит подземный резерв: новые помещения вместят её даже при заполненных старых кладовых. Этот запас даст время пережить остановку производства, но не отменит постоянного расхода пищи жителями оснащённых слоёв."
 RUS_bunker_systems_college:0 "Училище подземных систем"
 RUS_bunker_systems_college_desc:0 "Бункер переживёт своих создателей только в том случае, если следующая смена понимает его устройство. Инженеры объединят схемы силовой сети, вентиляции и мастерских в учебный курс. Выпускники перенесут эти знания на наземные предприятия и помогут совершенствовать промышленное оборудование всей страны."
 RUS_bunker_food_output_focus_tt:0 "Продовольствие бункера: §G+2§! £supply_texticon в неделю."
 RUS_bunker_power_focus_tt:0 "Мощность бункера: §G+4§! £energy_consumption_texticon."
 RUS_bunker_food_capacity_focus_tt:0 "Ёмкость продовольственного резерва: §G+40§! £supply_texticon."
 RUS_bunker_food_reserve_focus_tt:0 "Ёмкость резерва: §G+80§! £supply_texticon. Запас: §G+80§! £supply_texticon. Новые камеры вмещают всю поставку даже при полном складе."
 RUS_bunker_college_active_tt:0 "Бонус училища к скорости исследований действует, пока бункер работает."
 RUS_bunker_closed_cycle_tt:0 "Продовольствие бункера: §G+3§! £supply_texticon в неделю."
 RUS_bunker_unfitted:0 "Нет помещения"
 RUS_bunker_other_room:0 "Занято другим помещением"
 RUS_bunker_need_depth:0 "Сначала пройдите этот слой"
 RUS_bunker_need_focus:0 "§gНе изучен нужный фокус§!"
 RUS_bunker_need_power:0 "§RМало мощности§!"
 RUS_bunker_need_funds:0 "§RНе хватает ресурсов§!"
 RUS_bunker_need_slot:0 "§gБригада занята§!"
 RUS_bunker_need_operational:0 "Комплекс не работает"
 RUS_bunker_rations_offline:0 "Пищевой запас сохранён"
 RUS_bunker_guard_compact:0 "Караул"
 RUS_bunker_guard_ui_tt:0 "§YКазармы стражи§!\n\n§G+12%§! организации всех дивизий; §G-8%§! времени обучения.\n\n§YПостроить за 21 день§!\n[GetRUSBunker11pp]  [GetRUSBunker11cash]  [GetRUSBunker11equipment]\n\nПитание оборудования: §Y2§! £energy_consumption_texticon мощности. Паёк смены: §Y1§! £supply_texticon в неделю.\n\n[GetRUSBunkerRoomguard]\n\n[GetRUSBunkerForecastguard]"
 RUS_bunker_shelter_compact:0 "Убежища"
 RUS_bunker_shelter_ui_tt:0 "§YЖилой ярус§!\n\n§G+10%§! стабильности страны; §G+0.10§! £political_power_texticon в день.\n\n§YПостроить за 21 день§!\n[GetRUSBunker12pp]  [GetRUSBunker12cash]  [GetRUSBunker12equipment]\n\nПитание оборудования: §Y1§! £energy_consumption_texticon мощности. Паёк смены: §Y1§! £supply_texticon в неделю.\n\n[GetRUSBunkerRoomshelter]\n\n[GetRUSBunkerForecastshelter]"
 RUS_bunker_upgrade_1_ui_tt:0 "§YУлучшить установленное помещение§!\n\n[GetRUSBunkerUpgradeReward1]\n\n§YРаботы займут 21 день§!\n[GetRUSBunker30pp]  [GetRUSBunker30cash]  [GetRUSBunker30equipment]\n\nМощность и расход пищи не увеличатся.\n\n[GetRUSBunkerUpgrade1]. Требуется фокус «[GetRUSBunkerRecipe1]».\n[GetRUSBunkerForecastUpgrade1]"
 RUS_bunker_water_compact:0 "Водоочистка"
 RUS_bunker_water_ui_tt:0 "§YВодоочистка§!\n\n§G-10%§! небоевых потерь техники от истощения.\nПродовольствие: §G+2§! £supply_texticon в неделю в запас бункера.\n\n§YПостроить за 21 день§!\n[GetRUSBunker13pp]  [GetRUSBunker13cash]  [GetRUSBunker13equipment]\n\nПитание оборудования: §Y1§! £energy_consumption_texticon мощности. Паёк смены: §Y1§! £supply_texticon в неделю.\n\n[GetRUSBunkerRoomwater]. Доступно после фокуса «[GetRUSBunkerRecipe2]».\n\n[GetRUSBunkerForecastwater]"
 RUS_bunker_signals_compact:0 "Связь"
 RUS_bunker_signals_ui_tt:0 "§YУзел связи§!\n\n§G+18%§! к скорости подготовки планов наступления.\n\n§YПостроить за 21 день§!\n[GetRUSBunker14pp]  [GetRUSBunker14cash]  [GetRUSBunker14equipment]\n\nПитание оборудования: §Y2§! £energy_consumption_texticon мощности. Паёк смены: §Y1§! £supply_texticon в неделю.\n\n[GetRUSBunkerRoomsignals]. Доступно после фокуса «[GetRUSBunkerRecipe2]».\n\n[GetRUSBunkerForecastsignals]\n\nПосле «Единой связи частей»: ещё +1 п.п. вступления резервов в бой. После «Постов воздушного наведения»: ещё +3% эффективности авиационных заданий."
 RUS_bunker_upgrade_2_ui_tt:0 "§YУлучшить установленное помещение§!\n\n[GetRUSBunkerUpgradeReward2]\n\n§YРаботы займут 21 день§!\n[GetRUSBunker30pp]  [GetRUSBunker30cash]  [GetRUSBunker30equipment]\n\nМощность и расход пищи не увеличатся.\n\n[GetRUSBunkerUpgrade2]. Требуется фокус «[GetRUSBunkerRecipe2]».\n[GetRUSBunkerForecastUpgrade2]"
 RUS_bunker_workshop_compact:0 "Мастерские"
 RUS_bunker_workshop_ui_tt:0 "§YПодземный арсенал§!\n\n§G+15%§! к выпуску снаряжения на всех военных заводах страны.\nНа общий склад каждую неделю: §G+4§! £infantry_equipment_texticon и §G+1§! £support_equipment_texticon.\n\nПока арсенал действует, в решениях доступны платные программы: «Заказ инженерного оснащения» выдаёт §G150§! £support_equipment_texticon вместо 100, «Обучение мастеров и подмастерьев» даёт §G+40§! прогресса экономики вместо 25.\n\n§YПостроить за 21 день§!\n[GetRUSBunker15pp]  [GetRUSBunker15cash]  [GetRUSBunker15equipment]\n\nПитание оборудования: §Y3§! £energy_consumption_texticon мощности. Паёк смены: §Y1§! £supply_texticon в неделю.\n\n[GetRUSBunkerRoomworkshop]. Доступно после фокуса «[GetRUSBunkerRecipe3]».\n\n[GetRUSBunkerForecastworkshop]\n\nПосле «Серийных заказов»: ещё +3% выпуска военных заводов. После «Авиационных мастерских»: ещё +3% скорости роста эффективности производства."
 RUS_bunker_granary_compact:0 "Амбары"
 RUS_bunker_granary_ui_tt:0 "§YПродовольственные камеры§!\n\n§G-5%§! товаров народного потребления: больше фабрик свободно для строительства.\nПродовольствие: §G+5§! £supply_texticon в неделю в запас бункера.\n\n§YПостроить за 21 день§!\n[GetRUSBunker16pp]  [GetRUSBunker16cash]  [GetRUSBunker16equipment]\n\nПитание оборудования: §Y1§! £energy_consumption_texticon мощности. Паёк смены: §Y1§! £supply_texticon в неделю.\n\n[GetRUSBunkerRoomgranary]. Доступно после фокуса «[GetRUSBunkerRecipe3]».\n\n[GetRUSBunkerForecastgranary]"
 RUS_bunker_upgrade_3_ui_tt:0 "§YУлучшить установленное помещение§!\n\n[GetRUSBunkerUpgradeReward3]\n\n§YРаботы займут 21 день§!\n[GetRUSBunker30pp]  [GetRUSBunker30cash]  [GetRUSBunker30equipment]\n\nЕщё §Y1§! £energy_consumption_texticon мощности.\n\n[GetRUSBunkerUpgrade3]. Требуется фокус «[GetRUSBunkerRecipe3]».\n[GetRUSBunkerForecastUpgrade3]"
 RUS_bunker_clinic_compact:0 "Клиника"
 RUS_bunker_clinic_ui_tt:0 "§YХирургический ярус§!\n\n§G+16%§! возвращения боевых потерь в людской резерв.\n\nПока медблок действует, в решениях доступна платная программа «Подготовить окружных фельдшеров»: §G+40§! прогресса социальной системы вместо 25.\n\n§YПостроить за 21 день§!\n[GetRUSBunker17pp]  [GetRUSBunker17cash]  [GetRUSBunker17equipment]\n\nПитание оборудования: §Y2§! £energy_consumption_texticon мощности. Паёк смены: §Y1§! £supply_texticon в неделю.\n\n[GetRUSBunkerRoomclinic]. Доступно после фокуса «[GetRUSBunkerRecipe4]».\n\n[GetRUSBunkerForecastclinic]\n\nПосле «Возвращения раненых»: ещё +5% возврата боевых потерь в людской резерв."
 RUS_bunker_laboratory_compact:0 "Лаборатория"
 RUS_bunker_laboratory_ui_tt:0 "§YЛаборатория§!\n\n§G+10%§! скорости всех исследований страны.\n\nЕсли лаборатория действует при завершении «Реакторных сплавов», проект дополнительно даёт §G50%§! ускорения одного исследования технологий поддержки. Воздушный линкор доступен и при выборе медблока.\n\n§YПостроить за 21 день§!\n[GetRUSBunker18pp]  [GetRUSBunker18cash]  [GetRUSBunker18equipment]\n\nПитание оборудования: §Y3§! £energy_consumption_texticon мощности. Паёк смены: §Y1§! £supply_texticon в неделю.\n\n[GetRUSBunkerRoomlaboratory]. Доступно после фокуса «[GetRUSBunkerRecipe4]».\n\n[GetRUSBunkerForecastlaboratory]\n\nПосле «Общего плана наземного боя»: вероятность авиационных аварий ниже на 5%."
 RUS_bunker_upgrade_4_ui_tt:0 "§YУлучшить установленное помещение§!\n\n[GetRUSBunkerUpgradeReward4]\n\n§YРаботы займут 21 день§!\n[GetRUSBunker30pp]  [GetRUSBunker30cash]  [GetRUSBunker30equipment]\n\nЕщё §Y1§! £energy_consumption_texticon мощности.\n\n[GetRUSBunkerUpgrade4]. Требуется фокус «[GetRUSBunkerRecipe4]».\n[GetRUSBunkerForecastUpgrade4]"
 RUS_bunker_archive_compact:0 "Архив"
 RUS_bunker_archive_ui_tt:0 "§YАрхив§!\n\n§G+0.35§! £political_power_texticon в день.\n\n§YПостроить за 21 день§!\n[GetRUSBunker19pp]  [GetRUSBunker19cash]  [GetRUSBunker19equipment]\n\nПитание оборудования: §Y1§! £energy_consumption_texticon мощности. Паёк смены: §Y1§! £supply_texticon в неделю.\n\n[GetRUSBunkerRoomarchive]. Доступно после фокуса «[GetRUSBunkerRecipe5]».\n\n[GetRUSBunkerForecastarchive]\n\nПосле «Подготовки управленцев» архив добавляет 15 очков государственного развития к каждой оплаченной программе чиновников."
 RUS_bunker_command_compact:0 "Командный зал"
 RUS_bunker_command_ui_tt:0 "§YКомандный зал§!\n\n§G+8%§! максимального бонуса планирования; §G+8%§! защиты всех дивизий.\n\n§YПостроить за 21 день§!\n[GetRUSBunker20pp]  [GetRUSBunker20cash]  [GetRUSBunker20equipment]\n\nПитание оборудования: §Y2§! £energy_consumption_texticon мощности. Паёк смены: §Y1§! £supply_texticon в неделю.\n\n[GetRUSBunkerRoomcommand]. Доступно после фокуса «[GetRUSBunkerRecipe5]».\n\n[GetRUSBunkerForecastcommand]\n\nПосле «Ответственности командования»: ещё +3% скорости планирования."
 RUS_bunker_upgrade_5_ui_tt:0 "§YУлучшить установленное помещение§!\n\n[GetRUSBunkerUpgradeReward5]\n\n§YРаботы займут 21 день§!\n[GetRUSBunker30pp]  [GetRUSBunker30cash]  [GetRUSBunker30equipment]\n\nМощность и расход пищи не увеличатся.\n\n[GetRUSBunkerUpgrade5]. Требуется фокус «[GetRUSBunkerRecipe5]».\n[GetRUSBunkerForecastUpgrade5]"
 RUS_bunker_food_ui_tt:0 "§YПродовольственный обоз§!\nЦена: [GetRUSBunker31pp]  [GetRUSBunkerFoodCash]\n\nСразу доставляет [GetRUSBunkerConvoyAmount]. Нужен работающий комплекс и место под всю партию.\n\nСейчас: [GetRUSBunkerFoodState]\nОбоз пополнит запас и снимет голод. Если запас достигнет §Y[?RUS_bunker_food_fed_line|0]§! £supply_texticon, оснащённый комплекс получит сытость: +5% стабильности и +5% скорости пополнения. Недельный баланс останется [?RUS_bunker_food_balance|=+0] £supply_texticon. Строительная бригада не занята подвозом."
 RUS_bunker_guard_gui_reward_tt:0 "§G+12%§! организации всех дивизий; §G-8%§! времени обучения."
 RUS_bunker_shelter_gui_reward_tt:0 "§G+10%§! стабильности страны; §G+0.10§! £political_power_texticon в день."
 RUS_bunker_water_gui_reward_tt:0 "§G-10%§! небоевых потерь техники от истощения."
 RUS_bunker_signals_gui_reward_tt:0 "§G+18%§! к скорости подготовки планов наступления."
 RUS_bunker_workshop_gui_reward_tt:0 "§G+15%§! к выпуску снаряжения на всех военных заводах страны."
 RUS_bunker_granary_gui_reward_tt:0 "§G-5%§! товаров народного потребления: больше фабрик свободно для строительства."
 RUS_bunker_clinic_gui_reward_tt:0 "§G+16%§! возвращения боевых потерь в людской резерв."
 RUS_bunker_laboratory_gui_reward_tt:0 "§G+10%§! скорости всех исследований страны."
 RUS_bunker_archive_gui_reward_tt:0 "§G+0.35§! £political_power_texticon в день."
 RUS_bunker_command_gui_reward_tt:0 "§G+8%§! максимального бонуса планирования; §G+8%§! защиты всех дивизий."
 RUS_bunker_metric_power:0 "МОЩНОСТЬ"
 RUS_bunker_metric_food:0 "ПРОДОВОЛЬСТВИЕ"
 RUS_bunker_metric_integrity:0 "СВОДЫ"
 RUS_bunker_metric_depth:0 "СЛОИ\n[?RUS_bunker_depth|0]/[?RUS_bunker_depth_limit|0] открыто\n[?RUS_bunker_fitted|0]/5 оснащено"
 RUS_bunker_metric_power_tt:0 "§YМощность оборудования§!\nЗанято: §Y[?RUS_bunker_used_power|0]§! £energy_consumption_texticon. Всего: §Y[?RUS_bunker_power|0]§!. Свободно: §Y[?RUS_bunker_free_power|0]§!.\n\nЭто предел подключения помещений, а не расходуемый запас. Нулевая свободная мощность не отключает уже работающие помещения, но не позволяет подключить новые. Сам по себе резерв бонусов не даёт.\n\nДва расширения генераторов добавляют по 4; резервная турбина добавляет ещё 2. Демонтаж освобождает мощность помещения и его модернизации.\nПо договору поставки занято: §Y[?RUS_bunker_energy_export_power|0]§! £energy_consumption_texticon. Эта мощность входит в используемую и освобождается по завершении 90 дней."
 RUS_bunker_metric_food_tt:0 "§YПродовольствие§!\nЗапас: §Y[?RUS_bunker_food|0]/[?RUS_bunker_food_capacity|0]§! £supply_texticon. Сытость с §Y[?RUS_bunker_food_fed_line|0]§!.\nПоступает за неделю: §G+[?RUS_bunker_food_output|0]§!. Расход: §R-[?RUS_bunker_food_use|0]§!. Баланс: §Y[?RUS_bunker_food_balance|0]§!.\n\nКаждое оснащённое помещение расходует 1. Ещё §Y[?RUS_bunker_mouths|0]§! едоков вне помещений: беженцы под землёй, созванное ополчение, падёж скота и новые области (1 при 4 областях, затем по 1 за каждые 3, не больше 6). Раз в два месяца портится 10% запаса сверх 75% ёмкости (5% после «Неприкосновенного рациона»), в последний раз: §R[?RUS_bunker_food_spoiled|0]§!. Пустой склад - дух «Голод в галереях» (стабильность §R-20%§!, поддержка войны §R-10%§!, организация армии §R-15%§!, выпуск военных заводов §R-15%§!, исследования §R-10%§!, §R-0.25§! £political_power_texticon в день). Склад от 75% ёмкости - сытость: +5% стабильности и +5% скорости пополнения. Обоз пополняет склад, продажа излишков аймакам приносит казну.\n\nСейчас: [GetRUSBunkerFoodState]\nПоложительный недельный баланс наполняет склад до предела; отрицательный постепенно расходует запас. Обоз помогает сразу, водоочистка и амбары обеспечивают постоянный приток. При заполненном складе излишек недельного притока теряется."
 RUS_bunker_metric_integrity_tt:0 "§YПрочность сводов§!\nТекущее состояние: §Y[?RUS_bunker_integrity|0]/100§! £fort_texticon.\n\nОбычная проходка снимает 20, ускоренная 35. Укрепление восстанавливает 40, максимум 100; доступно при прочности 60 и ниже. Ниже 40: -5% выпуска военных заводов и -5% организации армии. Обычная проходка требует хотя бы 40, ускоренная 55.\n\nПрочность расходуется при завершении проходки. Ожидание само по себе её не уменьшает. Прочность выше порога убирает аварийный штраф; накопление до 100 не даёт дополнительного боевого бонуса. Для ввода пяти оснащённых слоёв нужно не менее 60."
 RUS_bunker_metric_depth_tt:0 "§YГотовность комплекса§!\nОснащено помещений: §Y[?RUS_bunker_fitted|0]§!. Пройдено слоёв: §Y[?RUS_bunker_depth|0]§!. Разрешённая глубина: §Y[?RUS_bunker_depth_limit|0]§!.\n\n1. Пройдите новый слой.\n2. Нажмите на его изображение.\n3. Выберите одно из двух помещений.\n4. Улучшите готовое помещение.\n\nПроходка и монтаж оплачиваются отдельно. Один пустой слой даёт +1% к пределу капитуляции.\n\nПольза выбранных помещений действует на всю страну через «Систему бункеров». Для торжественного ввода нужны пять оснащённых слоёв, не менее 60 прочности и свободная бригада."
 RUS_bunker_queue_ui_tt:0 "§YСтроительная бригада§!\nЗаказ: [GetRUSBunkerProjectName].\n\nОдновременно идёт одна работа. Срок показан на активном решении ниже. Отмена возвращает всю оплату.\n\nНа каждом слое помещается одна комната. Демонтаж убирает её бонусы и улучшение, освобождает мощность и не возвращает стоимость постройки.\n\nПотеря комплекса, подчинение, капитуляция или падение законного правительства отменяют незавершённый заказ с возвратом оплаты."
 RUS_bunker_status_ui_tt:0 "§YСостояние подземной столицы§!\n[GetRUSBunkerStatus]\n[GetRUSBunkerCondition]\n[GetRUSBunkerRations]\n\nПри аварийных сводах: -5% выпуска военных заводов и -5% организации. При голоде страна получает дух «Голод в галереях» (стабильность §R-20%§!, поддержка войны §R-10%§!, организация армии §R-15%§!, выпуск военных заводов §R-15%§!, исследования §R-10%§!, §R-0.25§! £political_power_texticon в день).\n\nКомплекс работает, пока законное правительство управляет независимой страной и полностью владеет и контролирует регион [66.GetName]. При временной потере сохраняются планировка и продовольствие; бонусы, расход и производство пищи приостанавливаются."
 RUS_bunker_excavate_button_label:0 "[GetRUSBunkerNextFloor]"
 RUS_bunker_excavate_ui_tt:0 "§YПройти следующий слой§!\nЦена: [GetRUSBunker1pp]  [GetRUSBunker1cash]  [GetRUSBunker1equipment]\nСрок: §Y42 дн.§!\n\nСоздаёт пустой слой, снимает §R20§! £fort_texticon. Требуется прочность не ниже §Y40§!, свободная бригада и глубина меньше текущего разрешённого предела. Пустой слой даёт +1% к пределу капитуляции; помещение выбирается отдельно. При отмене заказа вся оплата возвращается.\n\n[GetRUSBunkerForecastexcavate]"
 RUS_bunker_ui_rock:0 "Не пройден"
 RUS_bunker_ui_empty:0 "Пустой слой"
 RUS_bunker_queue_empty:0 "Бригада свободна"
 RUS_entrenched_reserves:0 "Подготовленные рубежи"
 RUS_entrenched_reserves_desc:0 "Позиционная доктрина требует заранее выбранной земли, складов и оплаченной инженерной работы. Оборонная программа позволит превращать ресурсы государства в готовый рубеж. Командиры получат конкретную линию подготовки вместо приказа держаться любой ценой."
 RUS_fortress_engineers:0 "Инженеры укреплённых районов"
 RUS_fortress_engineers_desc:0 "Земляные работы не заканчиваются после появления первого окопа. Подготовим инженеров, способных обслуживать укрепления, рассредоточивать склады и приспосабливать укрытия к местности. Учебное оснащение поступит в действующий запас инженерной службы."
 RUS_railway_coverage:0 "Резерв за второй линией"
 RUS_railway_coverage_desc:0 "Удержать рубеж помогает не только его гарнизон. Отдельный парк локомотивов обеспечит переброску подкреплений и боеприпасов из глубины страны."
 RUS_mobile_supply_columns:0 "Колонна следует за армией"
 RUS_mobile_supply_columns_desc:0 "Маневренное соединение бесполезно, если его бензовозы и ремонтники остались у прежнего штаба. Мобильная программа сведёт подготовку транспорта, снабжения и командиров в оплаченный цикл. Генеральный штаб сможет готовить движение всей колонны, а не только её авангарда."
 RUS_motor_pool_dispatch:0 "Диспетчеры моторного парка"
 RUS_motor_pool_dispatch_delta:0 "$RUS_motor_pool_dispatch$"
 RUS_motor_pool_dispatch_desc:0 "Каждая исправная машина должна иметь задачу и сменного водителя. Диспетчерская служба разделит учебный, ремонтный и действующий парк, а государство передаст ей первую дополнительную партию транспорта. Грузовики смогут поддержать снабжение или комплектование войск. Единый график перевозок сократит постоянный расход припасов армии."
 RUS_combined_arms_trials:0 "Подвижные ремонтные группы"
 RUS_combined_arms_trials_desc:0 "Темп наступления ограничен не самым быстрым грузовиком, а временем ремонта последнего. Испытаем полевые мастерские вместе с пехотой и артиллерией. Две исследовательские программы превратят удачные решения в стандартное оснащение вспомогательных подразделений."
 RUS_local_service_committees:0 "Комитеты местных работ"
 RUS_local_service_committees_desc:0 "Совет аймаков получает смысл тогда, когда жители видят результат своих решений. Первой задачей станут оплаченные работы на столичном транспортном узле, от которого зависят поставки в аймаки."
 RUS_assembly_budget:0 "Казна совета"
 RUS_assembly_budget_desc:0 "Местное самоуправление без выделенных средств превращается в спор о чужих обещаниях. Совет получит стартовый фонд для своих программ. Деньги поступят в общую казну, и Хану предстоит решить, какой округ получит работу первым."
 RUS_assembly_budget_tt:0 "Казна: §G+300§! £ADISCORD_economy_treasury_texticon. Общественные работы совета требуют §Y15§! £political_power_texticon вместо §Y25§! £political_power_texticon."
 RUS_single_supply_register_treasury_tt:0 "Казна: §G+100§! £ADISCORD_economy_treasury_texticon."
 RUS_civil_service_society_bonus_tt:0 "Учебные сборы окружных служащих дополнительно дают §G+15§! £ADISCORD_country_development_texticon прогресса развития общества."
 RUS_civil_service_state_bonus_tt:0 "Учебные сборы окружных служащих дополнительно дают §G+15§! £ADISCORD_country_development_texticon прогресса развития государственного аппарата."
 RUS_aimaq_public_works_cost:0 "[GetRUSAimaqPublicWorksPP]; [GetRUSBunker15cash]; [GetRUSBunker15equipment]"
 RUS_aimaq_public_works_cost_blocked:0 "[GetRUSAimaqPublicWorksPP]; [GetRUSBunker15cash]; [GetRUSBunker15equipment]"
 RUS_aimaq_public_works_cost_tooltip:0 "[GetRUSAimaqPublicWorksPP]; [GetRUSBunker15cash]; [GetRUSBunker15equipment]"
 RUS_regional_self_help:0 "Окружные санитарные артели"
 RUS_regional_self_help_desc:0 "Аймаки способны содержать собственные санитарные службы, если получают знания и инструменты. Артели объединят помощь семьям с подготовкой полевых пунктов. Центр передаст оборудование и откроет исследовательский курс по вспомогательным службам."
 RUS_inspection_chamber:0 "Палата строительной ревизии"
 RUS_inspection_chamber_desc:0 "Ханская канцелярия должна знать, какие здания существуют на земле, а какие лишь в ведомостях. Инспекторы сопоставят отчёты с потребностями округов. После ревизии правительство сможет оплачивать строительство военных цехов в столичном районе. Для первого заказа будет заранее выделена дополнительная площадка."
 RUS_single_supply_register:0 "Единый реестр поставок"
 RUS_single_supply_register_desc:0 "Разрозненные закупки переплачивают посредникам и оставляют строителей без инструмента. Сведём договоры в общую книгу, вернём неиспользованные средства в казну и передадим инженерной службе учтённые запасы. Реестр должен оплачивать реальные работы, а не новые реестры."
 RUS_provincial_commissioners:0 "Комиссары дорожной службы"
 RUS_provincial_commissioners_desc:0 "Дорога принадлежит всем ведомствам, и потому прежде за неё не отвечало ни одно. Канцелярия назначит комиссаров, которые связывают окружные склады и столицы аймаков. Их автомобильный парк станет доступен государственной системе снабжения."
 RUS_surface_contracts:0 "Ставка на дневную смену"
 RUS_surface_contracts_desc:0 "Разрушенные мастерские должны вновь работать при дневном свете. Поверхностный курс направит крупные оплаченные заказы на развитие обычной промышленности."
 RUS_open_freight_exchange:0 "Открытая грузовая биржа"
 RUS_open_freight_exchange_desc:0 "Новый завод должен получить сырьё и отправить продукцию заказчику. Грузовая биржа объединит расписания крупных предприятий с реальным транспортным резервом. Государственная партия локомотивов и машин обеспечит первую очередь перевозок."
 RUS_underground_fund:0 "Фонд подземной автономии"
 RUS_underground_fund_desc:0 "Укрытие, полностью зависящее от ежедневной поставки с поверхности, остаётся заложником первой осады. Подземный фонд направит средства на автономное снабжение комплекса."
 RUS_autonomous_workshops:0 "Служба автономных мастерских"
 RUS_autonomous_workshops_desc:0 "Автономии нужны собственные механики и запас мощности, а не только закрытая дверь. Мастерские получат дополнительное питание, а кладовые - резервное пространство."
 RUS_bunker_layer_service_school:0 "Бригада каждого яруса"
 RUS_bunker_layer_service_school_desc:0 "Работающий комплекс нуждается в постоянной инженерной службе. Подготовим отдельную бригаду и передадим ей оснащение для монтажа и модернизации. Программа обучения создаст задел для исследований служб обеспечения."
 RUS_bunker_reserve_shaft:0 "Резервная энергетическая шахта"
 RUS_bunker_reserve_shaft_desc:0 "Пока проходчики заняты глубиной, энергетики проложат независимую линию обслуживания."
 RUS_bunker_water_recycling:0 "Повторный водяной цикл"
 RUS_bunker_water_recycling_desc:0 "Вода уходит не только в трубы жилых отсеков, но и в производство продовольствия. Дополнительная ступень очистки вернёт часть расхода в хозяйственный цикл. Она увеличит недельный выпуск пищи при действующем комплексе и поможет кормить более глубокие слои."
 RUS_bunker_contingency_reservoir:0 "Резерв между сменами"
 RUS_bunker_contingency_reservoir_desc:0 "Даже работающий производственный ярус иногда останавливается. Устроим дополнительные кладовые и передадим первую партию длительного хранения. Запас даст жителям время дождаться ремонта, а увеличенная ёмкость останется после того, как последние пайки будут израсходованы."
 RUS_autonomous_workshops_tt:0 "Мощность бункера: §G+2§! £energy_consumption_texticon. Ёмкость продовольственного резерва: §G+40§! £supply_texticon."
 RUS_bunker_reserve_shaft_tt:0 "Мощность бункера: §G+2§! £energy_consumption_texticon. Можно заключить ещё §Y1§! энергоконтракт."
 RUS_bunker_airlocks_tt:0 "Прочность сводов: §G+20§! £fort_texticon сразу. «Укрепить своды» восстанавливает §G60§! £fort_texticon вместо §Y40§!."
 RUS_bunker_layer_service_school_tt:0 "Форсированная проходка снимает §R20§! £fort_texticon прочности вместо §R35§! и доступна с прочности §Y40§! вместо §Y55§!."
 RUS_bunker_utilities_rooms_tt:0 "Система бункеров, второй слой: при водоочистке §G-5%§! небоевых потерь, при узле связи §G+5%§! к скорости планирования."
 RUS_bunker_working_heart_rooms_tt:0 "Система бункеров, третий слой: при мастерской §G+5%§! выпуска военных заводов, при амбарах §G-3%§! потребительских товаров."
 RUS_bunker_science_wing_rooms_tt:0 "Система бункеров, четвёртый слой: при клинике §G+5%§! возврата раненых, при лаборатории §G+5%§! к скорости исследований."
 RUS_bunker_memory_vault_rooms_tt:0 "Система бункеров, пятый слой: при архиве §G+0.10§! £political_power_texticon в день, при командном пункте §G+5%§! к максимальному планированию."
 RUS_bunker_silence_trial:0 "Испытание тишиной"
 RUS_bunker_silence_trial_desc:0 "Комиссия проверяет, сможет ли бункер жить без помощи сверху. Тридцать дней склад не должен опустеть, а своды - ослабнуть ниже §Y60§! £fort_texticon."
 RUS_bunker_silence_trial_start_tt:0 "Начинается §YИспытание тишиной§! на §Y30§! дней. Если за это время склад ни разу не опустеет, а прочность к концу останется не ниже §Y60§! £fort_texticon: §G+5%§! стабильности, §G+50§! £political_power_texticon, §G+20§! £supply_texticon к ёмкости и запасу. Иначе §R-5%§! стабильности."
 RUS_bunker_silence_trial_outcome_tt:0 "Итог испытания: при успехе §G+5%§! стабильности, §G+50§! £political_power_texticon и §G+20§! £supply_texticon к ёмкости и запасу; при провале §R-5%§! стабильности."
 RUS_bunker_water_recycling_tt:0 "Производство продовольствия: §G+2§! £supply_texticon в неделю."
 RUS_bunker_contingency_reservoir_tt:0 "Ёмкость продовольственного резерва: §G+60§! £supply_texticon. Запас: §G+60§! £supply_texticon в пределах новой ёмкости. Сытость наступает с §Y60%§! ёмкости вместо §Y75%§!."
 RUS_development_programmes:0 "Государственные программы Хана"
 RUS_development_programmes_desc:0 "Выбранный курс определяет, какие работы правительство может оплатить. Заказы выполняются при оплате, повторный заказ доступен после указанного перерыва. Постройки появляются в столичном регионе [66.GetName]; оснащение списывается из действующего запаса армии. Учебные программы дают постоянный прогресс стране и не требуют удержания столичного региона. Повышение уровня происходит в ближайший месячный пересчёт."
 RUS_defensive_preparation:0 "Подготовить рубежи"
 RUS_defensive_preparation_desc:0 "Инженерные партии оборудуют позиции и рассредоточат запасы на случай удара. Подготовка действует 120 дней; следующий цикл можно оплатить после её окончания."
 RUS_defensive_preparation_available_tt:0 "Законное правительство управляет независимой страной и контролирует столичный комплекс; открыта программа укреплённых рубежей, предыдущая подготовка завершена."
 RUS_defensive_preparation_spirit:0 "Подготовленные оборонительные рубежи"
 RUS_defensive_preparation_spirit_desc:0 "Инженерные команды размечают запасные позиции, проверяют подступы и оборудуют укрытия для частей первого эшелона. Подвезённый инструмент и заранее распределённые работы позволяют войскам лучше оборудовать позиции и увереннее держать рубеж. Оплаченная программа действует 120 дней."
 RUS_mobile_preparation:0 "Собрать маршевые колонны"
 RUS_mobile_preparation_desc:0 "Ремонтные группы и подвижные склады подготовят снабжение наступления. Подготовка действует 120 дней; следующий цикл можно оплатить после её окончания."
 RUS_mobile_preparation_available_tt:0 "Законное правительство управляет независимой страной и контролирует столичный комплекс; открыта программа мобильного снабжения, предыдущая подготовка завершена."
 RUS_mobile_preparation_spirit:0 "Подготовленные маршевые колонны"
 RUS_mobile_preparation_spirit_desc:0 "Обозы получают маршруты, ремонтные команды - места сбора, а промежуточные склады - нормы выдачи. Колонна может продолжать движение, пока тыл подвозит припасы и возвращает технику в строй. Подготовленная сеть ускоряет переброску войск и сокращает расход снабжения на 120 дней."
 RUS_aimaq_public_works:0 "Оплатить дороги аймака"
 RUS_aimaq_public_works_desc:0 "Местные комитеты соберут строительные артели и передадут им инструменты. На 180 дней страна получит +5% скорости строительства; инфраструктура региона [66.GetName] вырастет на один уровень, если ещё не достигла 5. При максимальных дорогах артели продолжают работать на других стройках. Результат выдаётся при оплате, новый заказ - после окончания службы артелей."
 RUS_aimaq_public_works_available_tt:0 "Законное правительство управляет независимой страной, полностью владеет и контролирует регион [66.GetName]; открыты местные комитеты, предыдущая строительная программа завершена."
 RUS_chancery_reconstruction:0 "Расширить столичный арсенал"
 RUS_chancery_reconstruction_desc:0 "Инспекционная палата оплатит ввод новой оружейной линии в регионе [66.GetName]. Один военный завод появляется сразу после оплаты и занимает обычную ячейку строительства. Следующий заказ - через 180 дней."
 RUS_chancery_reconstruction_available_tt:0 "Законное правительство управляет независимой страной, полностью владеет и контролирует регион [66.GetName]; открыта инспекционная палата, в регионе есть свободная ячейка военного завода."
 RUS_surface_industrial_contract:0 "Оплатить наземную фабрику"
 RUS_surface_industrial_contract_desc:0 "Наземный промышленный договор вводит гражданскую фабрику в регионе [66.GetName] сразу после оплаты. Предприятие занимает обычную ячейку строительства. Следующий договор можно заключить через 180 дней."
 RUS_surface_industrial_contract_available_tt:0 "Законное правительство управляет независимой страной, полностью владеет и контролирует регион [66.GetName]; выбран наземный промышленный курс, в регионе есть свободная ячейка фабрики."
 RUS_subterranean_supply_contract:0 "Оплатить пищевой контур"
 RUS_subterranean_supply_contract_desc:0 "Подземный фонд закупит оборудование для переработки и хранения пищи. Каждый из двух контуров увеличивает постоянный выпуск и ёмкость запасов. Монтаж выполняется при оплате; второй контракт доступен через 60 дней. Построено: [?RUS_bunker_autonomy_contracts|0]/2."
 RUS_subterranean_supply_contract_available_tt:0 "Законное правительство управляет независимой страной и контролирует столичный комплекс; выбран подземный фонд, оплачено меньше двух автономных контуров."
 RUS_subterranean_supply_reward_tt:0 "Постоянный выпуск: §G+1§! £supply_texticon в неделю. Ёмкость запаса: §G+20§! £supply_texticon. Оборудование сохраняется при временной потере комплекса; производство работает только в действующем бункере."
 RUS_public_campaigns:0 "Голос Хана"
 RUS_public_campaigns_desc:0 "Радио, печатные листки и собрания аймаков могут поддержать разные задачи государства.\n\nСвободно общих мест для кампаний: §Y[?ADISCORD_available_campaign_slots|0]§!. Каждое обращение занимает одно место до конца своего срока. Две редакции дают возможность вести два обращения одновременно.\n\nПри утрате Ханом самостоятельной власти действующие обращения прекращаются; место освобождается, но политическая власть за уже начатую агитацию не возвращается. Военная кампания «Последний приказ» завершается также при наступлении мира."
 RUS_public_campaign_slot_available_tt:0 "Есть свободное место для кампании: §Y[?ADISCORD_available_campaign_slots|0]§!. Первое место даёт фокус «$RUS_khan_broadcast_service$», второе - «$RUS_parallel_public_addresses$»."
 RUS_public_campaign_first_slot_tt:0 "Одна редакция: §G+1§! место в общем пуле оплаченных кампаний."
 RUS_public_campaign_second_slot_tt:0 "Вторая редакция: ещё §G+1§! место в общем пуле оплаченных кампаний."
 RUS_campaign_voice_of_the_aimaqs:0 "Один голос всех аймаков"
 RUS_campaign_voice_of_the_aimaqs_desc:0 "Столичный диктор передаст эфир старостам дальних аймаков. Их голоса расскажут о соседях, ремонте дорог и решённых спорах: государство должно быть слышно не только тогда, когда оно требует подчинения."
 RUS_campaign_bread_and_shelter:0 "Хлеб и крыша для каждой семьи"
 RUS_campaign_bread_and_shelter_desc:0 "Сводки о снабжении, очередях и работе убежищ займут место пустых обещаний. Семьи должны знать, ради чего приходится экономить сегодня и кто отвечает за завтрашнюю поставку. Кампания помогает организации тыла; продовольствие в бункер по-прежнему доставляют отдельным заказом."
 RUS_campaign_rifles_protect_home:0 "Эта винтовка защищает твой дом"
 RUS_campaign_rifles_protect_home_desc:0 "На заводских стендах появятся письма частей, которые получили их оружие. Имя рабочего, номер винтовки и благодарность бойца свяжут длинную смену с защитой конкретного дома."
 RUS_campaign_the_khan_keeps_his_word:0 "Власть отвечает за своё слово"
 RUS_campaign_the_khan_keeps_his_word_desc:0 "Редакция будет зачитывать исполненные решения вместе с именами ответственных. Громкое обещание получит дату, место и проверяемый результат: порядок держится на доверии к слову правителя."
 RUS_campaign_surface_trade:0 "Открытые дороги, работающие мастерские"
 RUS_campaign_surface_trade_desc:0 "Торговые вести, объявления подрядчиков и отчёты о новых стройках вернут движение на поверхность. Каравану нужен покупатель, мастерской - заказ, а строительной бригаде - уверенность в поставке материалов."
 RUS_campaign_last_order:0 "Последний приказ: удержать свой дом"
 RUS_campaign_last_order_desc:0 "Во время войны обращения фронтовиков и прямой приказ Хана поддержат боевой дух частей. Эта кампания действует только пока страна воюет. При наступлении мира она прекращается и освобождает место; потраченная политическая власть не возвращается."
 RUS_khan_broadcast_service:0 "Голос столицы в каждом аймаке"
 RUS_khan_broadcast_service_desc:0 "Слух добирается до дальнего аймака быстрее официального приказа. Радиослужба свяжет столичную редакцию с окружными громкоговорителями, а листки с текстами обращений достигнут тех, у кого нет приёмника. Первая редакционная смена ведёт кампании об единстве аймаков и снабжении."
 RUS_parallel_public_addresses:0 "Две редакции - один эфир"
 RUS_parallel_public_addresses_desc:0 "Фронту нужны одни слова, семьям в тылу - другие. Вторая редакция и собственная печатная смена позволят одновременно вести два разных обращения. Хан расширяет возможности службы, а какие обещания прозвучат в эфире, определит правительство."
 RUS_foreign_press_bureau:0 "Бюро иностранной печати"
 RUS_foreign_press_bureau_desc:0 "Чужие корреспонденты всё равно будут писать о степи. Пусть лучше пишут о том, что им покажут: бюро при радиослужбе выдаст пропуска, проводников и готовые сводки о мирных мастерских. Учёные получат право решать, что увидят гости."
 RUS_quiet_perimeter:0 "Тихий периметр"
 RUS_quiet_perimeter_desc:0 "Чем меньше чужих глаз у реактора, тем меньше вопросов. Чёрная армия закроет подходы к реакторному поясу, уберёт с дорог лишние колонны и будет пускать к работам только своих. Тишину придётся оплачивать пайками караулов."
 RUS_good_neighbour_charter:0 "Грамота добрососедства"
 RUS_good_neighbour_charter_desc:0 "Хан подпишет грамоту о границах и пригласит соседей проверять заставы вместе с ханскими писарями. Совместная комиссия не снимет всех подозрений, но каждый её выезд отнимает у соседских штабов ещё один довод за войну."
 RUS_public_works_spirit:0 "Артели общественных работ"
 RUS_public_works_spirit_desc:0 "Общины направляют в артели плотников, каменщиков и возчиков. Казна оплачивает инструмент и работу, а местные мастера передают опыт соседним бригадам. Согласованные поставки и постоянные рабочие руки ускоряют стройки по всей стране; программа рассчитана на 180 дней."
 RUS_black_army_bookmark:0 "$RUS_black_army$"
 RUS_black_army_bookmark_desc:0 "$RUS_black_army_desc$"
 RUS_bunker_complex_bookmark:0 "$RUS_bunker_complex$"
 RUS_bunker_complex_bookmark_desc:0 "$RUS_bunker_complex_desc$"
 RUS_black_army:0 "Чёрная Армия"
 RUS_black_army_desc:0 "Под чёрными знамёнами сходятся отряды, которые ещё вчера подчинялись разным старшинам. Люди приносят собственное оружие, знают соседей в строю и готовы защищать родной аймак. За его пределами выясняется, насколько различаются их порядки, подготовка и представления о долге.\n\nЧёрная Армия должна научиться воевать как единое целое. Полковые книги, подготовленный резерв и общая служба связывают дружины со ставкой; выбранная доктрина определяет, станут ли они держать укреплённые рубежи или наступать подвижными колоннами. С ростом армии её командование получает всё больше оснований требовать собственного голоса в судьбе страны."
 RUS_black_army_state_tt:0 "Организация: §Y[GetRUSArmyOrganization]§!\nДоктрина: §Y[GetRUSArmyDoctrine]§!\nЧёрная Армия получает §G+5%§! атаки, а военные фокусы и ветка Чёрной армии изменяют остальные параметры духа. Бонусы помещений показаны отдельно в «Системе бункеров». Временная подготовка войск действует до окончания своего срока. Влияние учёных и Чёрной армии показано в балансе власти."
 RUS_bunker_system_state_tt:0 "[GetRUSBunkerStatus]\nОснащено слоёв: §Y[?RUS_bunker_fitted|0]/5§!; прочность: §Y[?RUS_bunker_integrity|0]/100§! £fort_texticon\nМощность: §Y[?RUS_bunker_used_power|0]/[?RUS_bunker_power|0]§! £energy_consumption_texticon; запас: §Y[?RUS_bunker_food|0]/[?RUS_bunker_food_capacity|0]§! £supply_texticon\nПодземный рынок и аренда генераторов: §G+[?RUS_bunker_income|0]§! £ADISCORD_economy_treasury_texticon в месяц (§Y12§! и §Y3§! за каждый оснащённый слой); поступает в казну полностью, без поправок бюджета.\nПостройка и модернизация помещений изменяют этот дух. Армейские реформы сохраняются независимо от комплекса."
 RUS_army_doctrine_patient:0 "Терпеливая война"
 RUS_army_doctrine_swift:0 "Подвижные колонны"
 RUS_army_doctrine_undecided:0 "Не выбрана"
 RUS_army_organization_regular:0 "Общая военная служба"
 RUS_army_organization_reserves:0 "Подготовленный резерв"
 RUS_army_organization_registers:0 "Единые списки частей"
 RUS_army_organization_hosts:0 "Аймачные отряды"
 RUS_bunker_depth_2_tt:0 "Разрешает проходку до второго слоя. Проходка и оснащение оплачиваются отдельно."
 RUS_army_organization_delta:0 "Изменение «Чёрной Армии»"
 RUS_army_empire_delta:0 "Изменение «Чёрной Армии»"
 RUS_state_balance:0 "Учёные - Чёрная армия"
 RUS_state_balance_category:0 "Учёные и Чёрная армия"
 RUS_state_balance_category_desc:0 "Под землёй спорят две силы. §YЧёрная армия§! держит входы и фронт, требуя людей, пайков и единого командования. §YУчёные§! держат свет, воду и лаборатории, без которых подземная страна не переживёт зиму. Обе стороны присягнули Хану: Чёрную армию возглавляет $RUS_black_army_leader$, учёных - $RUS_scientists_leader$.\n\nПоддержка Чёрной армии: §Y[?RUS_black_army_support|%0]§!\nПоддержка учёных: §Y[?RUS_scientists_support|%0]§!\n\n[GetRUSSuspicionStatus][GetRUSMoraleStatus]"
 RUS_state_balance_measures_category:0 "Меры баланса"
 RUS_favour_shock_fist:0 "Ударный кулак Рустана"
 RUS_favour_shock_fist_desc:0 "Рустан отдаст лучшие роты под общий приказ Хана и сам поведёт их на прорыв. Чёрная армия выполнит просьбу, но запомнит, что её командир снова ходил в атаку за чужую политику."
 RUS_favour_black_army_musters:0 "Сборы Чёрной армии"
 RUS_favour_black_army_musters_desc:0 "Сборные пункты Чёрной армии откроют свои списки: резервисты, которых армия держала для себя, перейдут в общий призыв. Командиры подчинятся, но будут считать каждого отданного человека."
 RUS_favour_guard_instructors:0 "Гвардейские инструкторы"
 RUS_favour_guard_instructors_desc:0 "Ветераны гвардии на время оставят свои части и разойдутся инструкторами по полкам. Армия станет опытнее, а Чёрная армия - обиднее: её лучших людей используют как учителей."
 RUS_favour_night_shifts:0 "Ночные смены лабораторий"
 RUS_favour_night_shifts_desc:0 "Учёные согласятся работать в две смены, если Хан не станет спрашивать, сколько ещё они выдержат. Исследования ускорятся, а усталость лабораторий ляжет на их отношение к правительству."
 RUS_favour_prototypes:0 "Опытные образцы"
 RUS_favour_prototypes_desc:0 "Лаборатории отдадут в мастерские свои незаконченные образцы станков и приборов. Заводы получат готовые решения, учёные - ощущение, что у них забрали работу на полпути."
 RUS_favour_reactor_current:0 "Реакторный ток для заводов"
 RUS_favour_reactor_current_desc:0 "Учёные переключат часть реакторного тока с лабораторий на заводские линии. Станки заработают быстрее, а опыты подождут, и учёные этого не забудут."
 RUS_favour_army_20_cost:0 "§Y20%§! поддержки Чёрной армии"
 RUS_favour_army_20_cost_blocked:0 "§R20%§! поддержки Чёрной армии"
 RUS_favour_army_20_cost_tooltip:0 "Нужно не меньше §Y20%§! поддержки Чёрной армии."
 RUS_favour_army_20_tt:0 "Поддержка Чёрной армии: §R-20%§!. Ниже 50% фракция перестаёт давать £political_power_texticon и тянуть баланс к себе."
 RUS_favour_army_15_cost:0 "§Y15%§! поддержки Чёрной армии"
 RUS_favour_army_15_cost_blocked:0 "§R15%§! поддержки Чёрной армии"
 RUS_favour_army_15_cost_tooltip:0 "Нужно не меньше §Y15%§! поддержки Чёрной армии."
 RUS_favour_army_15_tt:0 "Поддержка Чёрной армии: §R-15%§!. Ниже 50% фракция перестаёт давать £political_power_texticon и тянуть баланс к себе."
 RUS_favour_science_20_cost:0 "§Y20%§! поддержки учёных"
