 RUS_bunker_clinic_delta:0 "Хирургический ярус"
 RUS_bunker_clinic:0 "Слой 4: хирургический ярус"
 RUS_bunker_clinic_desc:0 "Впервые полевые хирурги получат свет, стерильную воду и место для возвращения раненых к жизни. Ханская ведомость научится считать спасённых.\n\nСтроительство: 21 день. Один вариант на слой.\nСодержание: §Y1§! £supply_texticon в неделю.\n\n[GetRUSBunkerForecastclinic]\n\nДействующий медблок открывает подготовку окружных фельдшеров и увеличивает её результат до §G40§! очков развития социальной системы вместо 25. Полученные знания сохраняются за пределами бункера.\n\nПосле «Возвращения раненых»: ещё +5% возврата боевых потерь в людской резерв."
