 # Civil development programmes
 RUS_aimaq_service_charter:0 "Устав аймачной службы"
 RUS_aimaq_service_charter_desc:0 "Совет аймаков договорится о правилах службы, действующих за пределами одного селения. Писец сможет передать дела преемнику, община - потребовать отчёт, а должность перестанет быть личной собственностью старейшины. Учебные сборы будут готовить людей для этой работы."
 RUS_civil_service_examinations:0 "Испытание государственной службой"
 RUS_civil_service_examinations_desc:0 "Печать Хана открывает любую дверь, но не учит вести счета и разбирать жалобы. Канцелярия введёт испытания для новых служащих и практику в окружных управлениях. Рустану нужны чиновники, способные исполнить приказ без нового приказа на каждый шаг."
 RUS_civil_service_growth_tt:0 "Постоянный базовый прирост развития государственного аппарата: §G+2§! очка в месяц до модификаторов страны."
 RUS_civil_service_training:0 "Учебные сборы окружных служащих"
 RUS_civil_service_training_desc:0 "Оплатить преподавателей, учебные книги и выезды писцов в округа. Полученный опыт остаётся у государственного аппарата. Повторная программа доступна через 90 дней.\n\nБазовый результат: §G+25§! £ADISCORD_country_development_texticon государственного развития. «Устав аймачной службы» добавляет §G+15§! £ADISCORD_country_development_texticon развития общества; «Испытание государственной службой» - §G+15§! £ADISCORD_country_development_texticon государственного развития.\n\n«Подготовка управленцев» добавляет §G+10§! £ADISCORD_country_development_texticon государственного развития; при ней работающий архив аймаков даёт ещё §G+15§! £ADISCORD_country_development_texticon. Цена и перерыв между программами сохраняются."
 RUS_district_health_programme:0 "Подготовить окружных фельдшеров"
 RUS_district_health_programme_desc:0 "Лазаретам нужны люди, умеющие распознать болезнь, вести учёт лекарств и обучить помощника. Государство оплатит подготовку и распределение новых фельдшеров. Повторная программа доступна через 90 дней."
 RUS_workshop_training:0 "Обучение мастеров и подмастерьев"
 RUS_workshop_training_desc:0 "Машинная школа отправит наставников в мастерские. Общие чертежи, проверка деталей и обучение работе со станками дадут хозяйству знания, которые сохранятся после окончания программы. Повторная программа доступна через 90 дней."
 RUS_development_programme_cost:0 "§Y25§! £political_power_texticon  §Y35§! £ADISCORD_economy_treasury_texticon"
 RUS_development_programme_cost_blocked:0 "§R25§! £political_power_texticon  §R35§! £ADISCORD_economy_treasury_texticon"
 RUS_development_programme_cost_tooltip:0 "Стоимость: §Y25§! £political_power_texticon и §Y35§! £ADISCORD_economy_treasury_texticon. Оплата и зачисление прогресса происходят сразу."
 RUS_civil_service_training_ready_tt:0 "Развитие государственного аппарата ниже уровня 5; нет ожидающего месячного пересчёта повышения уровня."
 RUS_civil_service_training_result_tt:0 "Прогресс развития государственного аппарата: §G+25§! £ADISCORD_country_development_texticon. Текущий уровень: [?ADISCORD_state_development_level|0]/5; прогресс: [?ADISCORD_state_development_progress|1]/100. Повышение уровня учитывается при ближайшем месячном пересчёте."
 RUS_district_health_programme_ready_tt:0 "Развитие социальной системы ниже уровня 5; нет ожидающего месячного пересчёта повышения уровня."
 RUS_district_health_programme_result_tt:0 "Прогресс развития социальной системы: §G+25§! £ADISCORD_country_development_texticon (§G+40§! £ADISCORD_country_development_texticon при действующем подземном медблоке). Текущий уровень: [?ADISCORD_social_system_development_level|0]/5; прогресс: [?ADISCORD_social_system_development_progress|1]/100. Повышение уровня учитывается при ближайшем месячном пересчёте."
 RUS_workshop_training_ready_tt:0 "Развитие экономики ниже уровня 5; нет ожидающего месячного пересчёта повышения уровня. Нагрузка ниже 3, давление долга ниже 60, инфляция ниже 40; переход с уровня 4 требует государственного аппарата уровня 4."
 RUS_workshop_training_result_tt:0 "Прогресс развития экономики: §G+25§! £ADISCORD_country_development_texticon (§G+40§! £ADISCORD_country_development_texticon при действующей подземной мастерской). Текущий уровень: [?ADISCORD_economic_development_level|0]/5; прогресс: [?ADISCORD_economic_development_progress|1]/100. Повышение уровня учитывается при ближайшем месячном пересчёте."

# --- rus_country_content ---
 RUS_crisis_laser_countdown: "Программа «Последнее небо»"
 RUS_crisis_laser_countdown_desc: "Реактор заряжает орбитальную систему. Последний луч должен ударить в его ядро и вызвать катастрофу, которая разрушит промышленный мир. От раскрытия программы до запуска - 455 дней. Удерживайте хотя бы одну из четырёх реакторных зон ($STATE_176$, $STATE_177$, $STATE_188$, $STATE_192$). Потеря всего периметра или падение власти Хана окончательно срывает запуск. Военная победа над коалицией не останавливает подготовку удара."
 ADISCORD_rus_crisis.10.t: "Небо останется тёмным"
 ADISCORD_rus_crisis.10.d: "Орбитальная программа потеряла необходимую опору: реакторный периметр оказался недоступен либо власть Хана прекратилась. Последовательность запуска сорвана. Повторное занятие реакторных зон уже не восстановит её.\n\nЕсли война коалиции началась, она продолжается до военного исхода. Уничтожение программы спасло города от удара, но не решило судьбу Последней империи."
 ADISCORD_rus_crisis.10.a: "Удар отменён."
 ADISCORD_rus_crisis.15.t: "Девяносто дней до удара"
 ADISCORD_rus_crisis.15.d: "Первые армии, выступившие против Хана, не остановили его программу. До орбитального удара осталось девяносто дней. Если реактор проработает до конца срока, удар придётся и по нашим городам.\n\nПравительства, ведущие войну с империей, просят нас выступить немедленно. Мы можем вступить в общую войну вместе со своими союзниками и зависимыми странами или остаться в стороне и ограничиться добровольцами."
 ADISCORD_rus_crisis.15.a: "Выступить против Хана."
 ADISCORD_rus_crisis.15.b: "Остаться в стороне."
 RUS_crisis_second_wave_join_tt: "Вступим в войну против Хана вместе со своими союзниками и зависимыми странами. Если первая волна вмешательства уже разгромлена, война начнётся заново. Срок удара не изменится."
 RUS_crisis_second_wave_stay_tt: "Не вступаем в войну. Пока продолжается война коалиции с Ханом, мы сможем отправлять добровольцев на облегчённых условиях."
 ADISCORD_rus_crisis.16.t: "Вторая волна"
 ADISCORD_rus_crisis.16.d: "[FROM.GetNameDefCap] вступает в войну против империи. До завершения программы осталось девяносто дней, и новые армии выходят к реакторному периметру, пока часы ещё идут."
 ADISCORD_rus_crisis.16.a: "Держать периметр."
 ADISCORD_rus_crisis.17.t: "Чужие глаза над степью"
 ADISCORD_rus_crisis.17.rumours.d: "В столицах соседей о реакторе говорят всё чаще. Купцы пересказывают слухи о ночных эшелонах, монтарские газеты печатают карты реакторного пояса, а в Тимерской палате спрашивают, зачем Хану столько инженеров.\n\nПока это только разговоры. Но если слухи сложатся в доказательства, соседи не станут ждать, пока Хан сам объявит свои планы.\n\nТеперь к слухам прибавилась копия ханской ведомости: чужая печать на сопроводительном письме доказывает, что сведения уже прошли через несколько посольств. Следующую подготовку будет труднее выдать за обычную хозяйственную работу.\n\nВслед за письмом к границе выехала смешанная комиссия соседей. Учёные предлагают показать ей турбины и лаборатории, интенданты - спрятать работы под землю, казначейство - купить расположение проверяющих, а Чёрная армия - просто не пустить их дальше застав."
 ADISCORD_rus_crisis.17.observers.d: "Монтарская империя отправила к нашим границам наблюдателей, а её союзники обмениваются донесениями о каждом эшелоне, идущем к реактору. Штабы соседей уже составляют планы похода.\n\nЕщё немного - и их подготовка закончится без всякого объявления. Тогда войну начнут они, а не мы.\n\nВ новом письме требуют объяснить движение военных грузов и допустить представителей к гражданским объектам. Ответ можно подготовить через посольство, но одних заверений будет недостаточно: наблюдатели продолжат считать эшелоны.\n\nНа этот раз наблюдатели приехали с полномочиями комиссии и ждут ответа у ворот. Учёные готовы провести их по гражданским цехам, интенданты - спрятать всё лишнее, казначейство - заплатить, а Чёрная армия требует выставить их за границу."
 ADISCORD_rus_crisis.17.truth:0 "Показать комиссии часть правды."
 ADISCORD_rus_crisis.17.hide:0 "Спрятать работы до её приезда."
 ADISCORD_rus_crisis.17.bribe:0 "Купить расположение комиссии."
 ADISCORD_rus_crisis.17.expel:0 "Закрыть перед комиссией ворота."
 ADISCORD_rus_crisis.18.murmur.t: "Ропот в окопах"
 ADISCORD_rus_crisis.18.murmur.d: "Сотники доносят одно и то же: бойцы Чёрной армии больше не верят сводкам. Пайки урезаны, раненых везут в тыл по три дня, а о потерянных аймаках говорят у каждого костра. Пока это только разговоры, но офицеры уже не останавливают их.\n\nСтавка может выдать фронту двойной паёк из резервов или потребовать терпения. Второй раз такой выбор может обойтись дороже."
 ADISCORD_rus_crisis.18.desertion.t: "Пустые окопы"
 ADISCORD_rus_crisis.18.desertion.d: "По ночам целые десятки уходят с позиций в родные аймаки. Ополченцы бросают винтовки у переправ, а сотники перестали отправлять в ставку списки пропавших. Чёрная армия требует права судить беглецов на месте.\n\nМожно поставить заградительные посты и отдать армии больше власти, а можно отпустить ополченцев по домам и сохранить ядро войска."
 ADISCORD_rus_crisis.18.conspiracy.t: "Заговор в ставке"
 ADISCORD_rus_crisis.18.conspiracy.d: "Охрана перехватила записку без подписи: несколько командиров обсуждают, кто примет печать, если Хан не доживёт до весны. Имена не названы, но почерк знаком. Армия больше не уверена, что Хан выведет её из этой войны.\n\nХан может вычистить ставку, рискуя оставить фронт без опытных командиров, или передать Чёрной армии командование и купить её верность. Если ничего не изменится, следующего предупреждения не будет."
 ADISCORD_rus_crisis.18.rations: "Выдать фронту двойной паёк."
 ADISCORD_rus_crisis.18.endure: "Пусть терпят."
 ADISCORD_rus_crisis.18.barriers: "Поставить заградительные посты."
 ADISCORD_rus_crisis.18.release: "Отпустить ополченцев по домам."
 ADISCORD_rus_crisis.18.purge: "Вычистить ставку."
 ADISCORD_rus_crisis.18.yield: "Отдать армии командование."
 ADISCORD_rus_crisis.20.t: "Смерть Хана"
 ADISCORD_rus_crisis.20.d: "Из-за линии фронта пришла весть, которую сначала приняли за уловку: Марк Рустан мёртв. Одни донесения говорят о выстреле в ставке, другие - о яде в походной кухне. Кто бы ни отдал приказ, Чёрная армия больше не служит общей державе.\n\nАймаки отзывают свои сотни, гарнизоны сдают крепости без боя, а реакторный периметр остаётся без хозяина. Последняя империя распадается на самостоятельные владения так же быстро, как была собрана."
 ADISCORD_rus_crisis.20.a: "Империя пережила своего Хана ненадолго."
 RUS_suspicion_warning_tt: "Подозрение соседей: §Y[?RUS_suspicion|0]§!/100 £RUS_suspicion_texticon. При §Y100§! £RUS_suspicion_texticon коалиция нападёт без 90-дневного сбора."
 ADISCORD_rus_crisis.1.exposed.d: "Разведывательные донесения больше не нужно сводить: доказательства лежат на столах всех штабов. Хан собирает орбитальную систему, питаемую реактором, и в списках его целей стоят промышленные районы, узлы связи и столицы.\n\nВремени на подготовку не будет. Монтарская империя, Вальдский союз, Тимерская палата и Свободная республика Байринж выступают немедленно; к ним могут присоединиться независимые победители юга и запада и гегемон востока, завершившие свои войны. Хан вынужден провозгласить державу открыто. До расчётного запуска остаётся четыреста пятьдесят пять дней."
 ADISCORD_rus_crisis.2.exposed.d: "Тайну удержать не удалось. Соседи узнали о программе раньше, чем Хан успел объявить её сам, и не стали ждать: их армии выступают без положенных девяноста дней сбора.\n\nХан провозглашает державу под огнём. Реактор по-прежнему питает орбитальную систему, а инженеры называют прежний общий срок - четыреста пятьдесят пять дней. Пока сохраняется хотя бы одна из четырёх доступных реакторных зон, работы продолжаются."
 RUS_crisis_exposed_warning_tt: "Коалиция выступает §Yнемедленно§!. Орбитальный удар последует через §Y455 дней§! с раскрытия программы, если Хан сохранит власть и доступ к реактору."
 RUS_crisis_strike_caption: "«Теперь я стал Смертью, разрушителем миров».\n- Роберт Оппенгеймер, цитируя «Бхагавадгиту»"
 RUS_crisis_close_superevent: "Закрыть"
 RUS_crisis_epilogue_caption: "ПОСЛЕДНЕЕ НЕБО\nЛуч направлен в сердце реактора."
 RUS_crisis_watch_epilogue: "Эпилог"
 RUS_crisis_epilogue_next: "Далее"
 RUS_crisis_epilogue_finish: "Завершить чтение"
 RUS_crisis_epilogue_2_title: "ПОСЛЕДНИЙ ПРИКАЗ"
 RUS_crisis_epilogue_2_body: "Луч вошёл в реактор, и на несколько мгновений исчезли тени. Затем ударная волна прошла через корпуса, улицы и укрытия. Там, где только что работали люди, остались раскалённые обломки. Над комплексом поднялся чёрный столб с белым светом внутри.\n\nВ городах гасли окна. На последних частотах просили о помощи, повторяли адреса, называли имена. Голоса обрывались посреди слова. Пепел оседал на воде и хлебе; его приносили в убежища на одежде и волосах. Люди, которым удалось спастись от огня, ещё не знали, что опасность уже была с ними.\n\nКатастрофа унесла миллиарды жизней. Одни погибли в огне и под обломками, другие не пережили последовавшие голод, болезни и холод. Считать потери было уже некому."
 RUS_crisis_epilogue_3_title: "НАСЛЕДСТВО ВОРКСА"
 RUS_crisis_epilogue_3_body: "Реактор нулевой точки когда-то изобрёл Дориан Воркс. В его чертежах была заключена сила, которой хватало для городов, заводов и машин. Теперь эти листы лежали под обломками, а имя изобретателя осталось на табличках у мёртвых пультов.\n\nВзрыв реактора породил мощный электромагнитный импульс. Далеко за пределами огня погасли приборы, оборвалась связь, остановилось оборудование. Люди в уцелевших убежищах крутили ручки приёмников и меняли батареи. Некоторые ещё слышали чужие голоса. Большинство слышало только треск.\n\nПервые спасшиеся выходили наружу с фонарями. Они искали входы в заваленные подвалы и звали тех, кто не успел подняться. К утру фонари начали гаснуть."
 RUS_crisis_epilogue_4_title: "МИР БЕЗ СТОЛИЦ"
 RUS_crisis_epilogue_4_body: "Стеландер и Кефрейт ещё передавали приказы. На западе и юге закрывали границы, обещали помощь и требовали ждать. Поезда не пришли. За колоннами беженцев тянулись пустые дороги; впереди стояли солдаты, которым уже нечем было кормить свои семьи.\n\nГосударства умирали по частям: сначала дальние гарнизоны, потом города, затем столицы. У колодцев появились вооружённые хозяева. За чашку воды отдавали инструменты, землю, свободу. Детям запрещали подходить к незнакомым людям. Старые карты жгли в печах. Ни одна граница больше никого не защищала."
 RUS_crisis_epilogue_5_title: "ЗЕМЛЯ И ПРИСЯГА"
 RUS_crisis_epilogue_5_body: "На месте больших государств установилась феодальная раздробленность. Бывший командир удерживал мост, хозяин зернохранилища собирал дань с деревень, гарнизон убежища объявлял своей всю землю до соседнего холма. За право жить у колодца требовали урожай, работу и сыновей в дружину.\n\nОбещания защиты записывали на обороте старых приказов. Клятвы приносили людям, у которых оставались оружие и запасы. Их дети наследовали ключи от складов вместе с властью над теми, кто приходил просить хлеба.\n\nПо вечерам в поселениях считали вернувшихся с полей. Потом закрывали ворота. За ними лежала дорога, по которой когда-то можно было проехать через целую страну."
 RUS_crisis_epilogue_6_title: "ПОСЛЕДНИЙ БУНКЕР"
 RUS_crisis_epilogue_6_body: "Под землёй Хан слушал вентиляцию. За стенами ещё работали генераторы, часовые сменяли друг друга, писари ставили печати на новых приказах. Двери не открывали. Даже когда снаружи стучали. Со временем стук прекратился.\n\nНа карте уцелело одно государство. Его пределами стали бетон, сталь и запас воздуха. Наверху люди делили остатки мира, но здесь каждое утро продолжали составлять донесения о победе. Радист вызывал столицы по старому списку. После каждого названия он ждал ответа. Хан приказал не сокращать паузы."
 RUS_crisis_epilogue_7_title: "ПОСЛЕДНЯЯ ЧАСТОТА"
 RUS_crisis_epilogue_7_body: "В бункере берегли запасные лампы и предохранители. Передатчик получал питание даже тогда, когда в жилых отсеках сокращали свет. Каждый сеанс начинался одинаково: позывной, приказ подтвердить приём, длинная пауза.\n\nОднажды сквозь помехи донёсся человеческий голос. Он просил лекарств и объяснял, где искать переправу. Радист спросил, кто командует округом. Незнакомец не понял вопроса. Связь пропала прежде, чем удалось узнать его имя.\n\nВ журнал внесли: контакт не установлен. Хану подали очередной список молчащих столиц. Он задержал палец на одной строке и велел вызвать снова. Наверху уже передавали другие названия, но в бункере их некому было нанести на карту."
 RUS_crisis_epilogue_8_title: "СИГНАЛ ПОТЕРЯН"
 RUS_crisis_epilogue_8_body: "Хан жив.\nЗа гермодверями - анархия, голод и пепел. Последняя империя погребена под землёй.\n\nПередатчик продолжает работать.\nОтвета не будет.\n\nEsc - открыть меню игры."
 RUS_crisis_regional_wars_available_tt: "Заключительный эпилог ещё не наступил."
 ADISCORD_rus_campaign.11.active_project: "На стол Рустана положили схему реакторного комплекса. На полях оставались исправления: перенесённый кабель, запасной генератор, участок дороги, по которому больше нельзя было провести колонну. За каждой пометкой стояли люди, продолжавшие работу под угрозой наступления.\n\nИнженеры доложили о готовности системы наведения. Штаб подтвердил размещение гарнизонов. Никто не обещал, что периметр выдержит, но каждый знал, что должен удерживать. Реактор продолжал заряжать орбитальную систему; последний луч должен был вернуться в его собственное ядро. До назначенного срока ещё оставалось время.\n\nХан подписал приказ. За дверью спорили о ремонте моста и выдаче продовольствия рабочим. Эти распоряжения тоже требовали его подписи. Рустан велел продолжать снабжение до последнего дня. После этого дня, по его расчётам, единой империи уже не понадобится ни мост, ни канцелярия."
 ADISCORD_rus_campaign.11.active_project.a: "Продолжать подготовку удара."
 RUS_crisis_programme_focus_available_tt: "Орбитальная программа действует: Хан у власти и удерживает хотя бы одну реакторную зону."
 RUS_crisis_reactor_guard: "Караул последнего неба"
 RUS_crisis_reactor_guard_desc: "Гарнизоны удерживают позиции и экономят снабжение до завершения орбитальной программы. Разгром интервентов не отменяет караул; отключение лазера или падение Хана снимает его задачи."
 RUS_crisis_volunteer_mandate: "Добровольцы против Хана"
 RUS_crisis_volunteer_mandate_desc: "Правительство не вступило в войну с Ханом, но разрешает добровольцам отправляться к реакторному периметру. Ограничения на отправку ослаблены, пока идёт война коалиции."
 ADISCORD_rus_last_sky_plan: "Оборона орбитальной программы"
 RUS_crisis_launch_clock_active: "До орбитального удара: §Y[?RUS.days_mission_timeout@RUS_crisis_laser_countdown|0]§! дн."
 RUS_crisis_launch_clock_inactive: "Отсчёт запуска не идёт."
 RUS_reactor_sortie_equipment_full:0 "40"
 RUS_reactor_sortie_equipment_decontaminated:0 "20"
 RUS_hazard_brigades_2_tt:0 "В столице появятся §Y2 бригады РХБ§! по §Y3 батальона§! с полными людьми и оснащением. Шаблон доступен для обычного набора; его состав закреплён."
 RUS_hazard_brigades_1_tt:0 "В столице появится ещё §Y1 бригада РХБ§! из §Y3 батальонов§! с полными людьми и оснащением."
 RUS_reactor_sortie_slot_free_tt:0 "Предыдущая реакторная вылазка завершена."
 RUS_bunker_protection_research:0 "Прикладная РХБ-защита"
 RUS_campaign_broadcast_required_tt:0 "Для запуска обращения нужно свободное место кампании. Первое место открывает фокус «$RUS_khan_broadcast_service$»."

 # Государственная служба, развитие войск и авиация.
 RUS_permanent_government:0 "Постоянное правительство"
 RUS_permanent_government_desc:0 "Марк Рустан не может лично разбирать каждую жалобу и каждый заказ. Канцелярия получит постоянный состав, а ведомства - круг обязанностей, который не меняется с приездом очередного посланца."
 RUS_state_budget:0 "Государственная смета"
 RUS_state_budget_desc:0 "Аймаки присылают счета в разное время и по разным правилам. Единая смета покажет, какие расходы уже оплачены, и прекратит содержание нескольких контор для одного дела."
 RUS_district_representation:0 "Представительство округов"
 RUS_district_representation_desc:0 "За столом совета найдётся место людям, которые отвечают за воду, жильё и мастерские. Их право докладывать Хану ограничит власть местных покровителей и сделает решения совета понятнее округам."
 RUS_civil_construction_board:0 "Гражданское строительство"
 RUS_civil_construction_board_desc:0 "Совет сведёт заказы на фабрики в общую очередь. Инженеры смогут использовать одни чертежи, перевозить бригады между площадками и готовить следующий фундамент до завершения текущей стройки."
 RUS_trained_administrators_tt:0 "Подготовка чиновников даёт 35 очков государственного развития вместо 25. Работающий архив аймаков добавляет ещё 15 очков при оплате программы."
 RUS_trained_administrators:0 "Подготовка управленцев"
 RUS_trained_administrators_desc:0 "Совет откроет постоянные курсы для окружных управлений. В архиве бункера хранятся земельные дела и старые сметы: на них будущие чиновники научатся проверять документ, прежде чем ставить печать."
 RUS_military_governors:0 "Военные губернаторы"
 RUS_military_governors_desc:0 "Командующий округом получит ясный мобилизационный план и обязанность согласовать его с местной администрацией. Сбор людей перестанет зависеть от того, какой приказ первым дошёл до старшины."
 RUS_military_contract_board:0 "Заказы военного ведомства"
 RUS_military_contract_board_desc:0 "Штаб объединит небольшие заказы полков в устойчивую производственную программу. Заводы смогут держать одну серию дольше, а приёмщики будут отвечать за поставки всей армии."
 RUS_command_accountability_synergy_tt:0 "Работающий зал последнего приказа дополнительно даёт §G+3%§! скорости планирования. Усиление действует и при последующей постройке зала."
 RUS_command_accountability:0 "Ответственность командования"
 RUS_command_accountability_desc:0 "Военная власть требует ответа за людей и имущество. Хан установит порядок разбора приказов: командир получит свободу действовать, но уже не сможет объяснить потери тем, что соседнее ведомство промолчало."
 RUS_staff_college:0 "Подготовка штабистов"
 RUS_staff_college_desc:0 "Сотнику недостаточно знать собственную сотню. Курсы научат штабистов сводить донесения, оценивать готовность соседей и заранее распределять задачи между частями."
 RUS_integrated_signals_synergy_tt:0 "Работающий узел связи дополнительно даёт §G+1§! п.п. вероятности вступления резервов в бой. Усиление действует и при последующей постройке узла."
 RUS_integrated_signals:0 "Единая связь частей"
 RUS_integrated_signals_desc:0 "Каждая часть получит одинаковые таблицы позывных и время передачи донесений. Подземный узел связи сможет направлять резервы по общей картине боя, если его включить в новую сеть."
 RUS_field_hospitals:0 "Полевые госпитали"
 RUS_field_hospitals_desc:0 "Медицинские пункты получат транспорт, перевязочный материал и единый порядок эвакуации. Раненый должен попасть к хирургу до того, как его запишут в безвозвратные потери."
 RUS_wounded_return_service_synergy_tt:0 "Работающий хирургический ярус дополнительно возвращает §G5%§! боевых потерь в людской резерв. Усиление действует и при последующей постройке яруса."
 RUS_wounded_return_service:0 "Возвращение раненых"
 RUS_wounded_return_service_desc:0 "После госпиталя солдату нужны восстановление и повторная подготовка. Свяжем полевые пункты с постоянной медицинской службой; хирургический ярус бункера сможет принимать самые тяжёлые случаи."
 RUS_battery_training:0 "Подготовка батарей"
 RUS_battery_training_desc:0 "Батареи будут учиться вместе с наблюдателями и пехотой. Общие таблицы стрельбы станут основой для освоения новых орудий и приборов управления огнём."
 RUS_serial_ordnance_orders_synergy_tt:0 "Работающий подземный арсенал дополнительно даёт §G+3%§! выпуска военных заводов. Усиление действует и при последующей постройке арсенала."
 RUS_serial_ordnance_orders:0 "Серийные заказы"
 RUS_serial_ordnance_orders_desc:0 "Приёмка утвердит длинные серии вместо постоянной смены образцов. Подземный арсенал получит общие допуски и сможет передавать наземным заводам готовый инструмент."
 RUS_armoured_trial_company:0 "Испытательная бронерота"
 RUS_armoured_trial_company_desc:0 "Инструкторы соберут небольшую учебную группу для испытания шасси и тактики бронетехники. Её задача - выбрать пригодные машины до того, как страна оплатит оснащение целых соединений."
 RUS_armoured_repair_service:0 "Ремонтная служба войск"
 RUS_armoured_repair_service_desc:0 "Повреждённая машина не должна оставаться у дороги из-за одной сломанной детали. Подвижные мастерские и тягачи будут сопровождать колонны, возвращая технику в строй и сокращая расход запасов."
 RUS_airfield_capacity_tt:0 "В столичном регионе [66.GetName] остаётся место для двух уровней аэродрома."
 RUS_flight_school:0 "Лётная школа Хана"
 RUS_flight_school_desc:0 "Уцелевшие самолёты бесполезны без людей, которые умеют возвращать их на полосу. Соберём инструкторов, введём учебный журнал и разберём каждую аварию прежде, чем она повторится."
 RUS_capital_airfields:0 "Аэродромы столичного округа"
 RUS_capital_airfields_desc:0 "Расчистим запасные полосы, восстановим подъездные дороги и оборудуем стоянки. Первые эскадрильи должны получить место для работы ещё до начала похода."
 RUS_fighter_cover:0 "Истребительное прикрытие"
 RUS_fighter_cover_desc:0 "Мастерские подготовят первую партию истребителей, а школа выделит пилотов для дежурных звеньев. Их задача - прикрывать столицу, переправы и войска от чужой авиации."
 RUS_assault_squadrons:0 "Штурмовые эскадрильи"
 RUS_assault_squadrons_desc:0 "Соберём самолёты непосредственной поддержки и научим экипажи отличать свой передний край от чужого. Наземные командиры впервые смогут рассчитывать на удар с воздуха по указанной цели."
 RUS_aviation_fuel_reserve:0 "Топливо для учебных вылетов"
 RUS_aviation_fuel_reserve_desc:0 "Лётная школа не должна отменять занятия после каждой задержки обоза. Отдельное хранилище и первая поставка топлива обеспечат учебные полёты и дежурство истребителей."
 RUS_aircraft_workshops_synergy_tt:0 "Работающий подземный арсенал дополнительно даёт §G+3%§! скорости роста эффективности производства. Усиление действует и при последующей постройке арсенала."
 RUS_aircraft_workshops:0 "Авиационные мастерские"
 RUS_aircraft_workshops_desc:0 "Самолёт требует одинаково точной работы на земле и в воздухе. Новый военный цех займётся авиационными заказами; инструмент подземного арсенала поможет быстрее наладить серийное производство."
 RUS_air_control_network_synergy_tt:0 "Работающий узел связи дополнительно даёт §G+3%§! эффективности авиационных заданий. Усиление действует и при последующей постройке узла."
 RUS_air_control_network:0 "Посты воздушного наведения"
 RUS_air_control_network_desc:0 "Посты наблюдения будут передавать сведения на аэродромы по общей сети. Узел связи бункера сможет держать сводную карту обстановки и направлять самолёты туда, где они нужны сейчас."
 RUS_air_ground_coordination_synergy_tt:0 "Работающая лаборатория дополнительно снижает вероятность авиационных аварий на §G5%§!. Усиление действует и при последующей постройке лаборатории."
 RUS_air_ground_coordination:0 "Общий план наземного боя"
 RUS_air_ground_coordination_desc:0 "Лётчики и командиры частей будут готовить один план боя. Лаборатория бункера сможет проверять приборы и разбирать отказы, чтобы поддержка не превращалась в опасность для своих."
 RUS_government_service:0 "Государственная служба"
 RUS_government_service_desc:0 "Постоянные ведомства, общий бюджет и правила назначения служащих связывают аймаки со столицей. Выбранный политический курс определяет задачи этой службы."
 RUS_government_service_state_tt:0 "Политический курс: §Y[GetRUSGovernmentMandate]§!.[GetRUSGovernmentDepots]"
 RUS_government_mandate_unselected:0 "не выбран"
 RUS_government_depots_active:0 "\nРемонтные депо пояса включены в государственную службу."
 RUS_government_depots_empty:0 ""
 RUS_civil_service_training_bonus_tt:0 "Подготовка управленцев: ещё §G+10§! £ADISCORD_country_development_texticon государственного развития."
 RUS_civil_service_archive_bonus_tt:0 "Архив аймаков: ещё §G+15§! очков государственного развития."
 ADISCORD_rus_campaign.12.t:0 "Дела на общем столе"
 ADISCORD_rus_campaign.12.d:0 "Первое заседание новых управленцев началось с ящика старых дел. Здесь были расписки за несуществовавший мост, две грамоты на один участок и просьба о водяном насосе, которую три года пересылали между округами. Учёные ожидали разговора о приборах. Старшины - о податях. Рустан приказал начать с насоса.\n\nК вечеру ответственный был назван, срок записан, а копии решения отправлены в округ и в архив. Совет ещё не стал единодушным, но теперь спор имел предмет и документ, по которому можно было спросить за исполнение. Старшина из дальнего округа попросил вторую копию для тех, кто собирал деньги на насос. Писец потянулся за чистым листом; прежде просителю просто указывали на дверь."
 ADISCORD_rus_campaign.12.a:0 "Пусть за подписью следует работа."
 ADISCORD_rus_campaign.13.t:0 "Приказ с подписью"
 ADISCORD_rus_campaign.13.d:0 "Командиры пришли с картами, на которых соседние части занимали разные позиции в один и тот же час. В каждом штабе находилось объяснение: поздний гонец, пропавшая ведомость, чужой участок ответственности. Хан выслушал всех и велел положить рядом приказы, выданные перед боем.\n\nНовый порядок не запрещал инициативу. Он требовал назвать, кому передана задача, чем она обеспечена и кто отвечает за её отмену. Военные губернаторы сохраняли власть в своих округах, но их подписи отныне оставались в общей книге командования. Самый молодой командир задержался у книги: в его донесении не сходилось число вернувшихся. Рустан велел дождаться переклички. Пустую строку оставили до утра."
 ADISCORD_rus_campaign.13.a:0 "Полномочия требуют ответа."
 RUS_society_development_reform_tt:0 "Развитие общества: §G+25§! £ADISCORD_country_development_texticon сразу; базовый прирост: §G+2§! £ADISCORD_country_development_texticon/мес. Порог уровня: §Y100§! £ADISCORD_country_development_texticon; излишек сохраняется."
 RUS_social_system_development_reform_tt:0 "Развитие социальной системы: §G+25§! £ADISCORD_country_development_texticon сразу; базовый прирост: §G+2§! £ADISCORD_country_development_texticon/мес. Порог уровня: §Y100§! £ADISCORD_country_development_texticon; излишек сохраняется."
 RUS_army_development_reform_tt:0 "Развитие армии: §G+25§! £ADISCORD_country_development_texticon сразу; базовый прирост: §G+2§! £ADISCORD_country_development_texticon/мес. Порог уровня: §Y100§! £ADISCORD_country_development_texticon; излишек сохраняется."
 RUS_cultural_development_reform_tt:0 "Развитие культуры: §G+25§! £ADISCORD_country_development_texticon сразу; базовый прирост: §G+2§! £ADISCORD_country_development_texticon/мес. Порог уровня: §Y100§! £ADISCORD_country_development_texticon; излишек сохраняется."
 RUS_state_development_reform_tt:0 "Развитие государственного аппарата: §G+25§! £ADISCORD_country_development_texticon сразу; базовый прирост: §G+2§! £ADISCORD_country_development_texticon/мес. Порог уровня: §Y100§! £ADISCORD_country_development_texticon; излишек сохраняется."
 RUS_economic_development_reform_tt:0 "Развитие экономики: §G+25§! £ADISCORD_country_development_texticon сразу; базовый прирост: §G+2§! £ADISCORD_country_development_texticon/мес. Порог уровня: §Y100§! £ADISCORD_country_development_texticon; излишек сохраняется."
 RUS_community_assemblies:0 "Собрания служилых общин"
 RUS_community_assemblies_desc:0 "Оплатить развитие общества: §G25§! £ADISCORD_country_development_texticon за §Y35§! £ADISCORD_economy_treasury_texticon и §Y25§! £political_power_texticon. Повторная программа доступна через §Y90 дней§!."
 RUS_community_assemblies_ready_tt:0 "Завершён профильный фокус; уровень ниже 5 и прогресс ниже 100."
 RUS_community_assemblies_result_tt:0 "Прогресс развития общества: §G+25§! £ADISCORD_country_development_texticon. Текущий уровень: [?ADISCORD_society_development_level|0]/5; прогресс: [?ADISCORD_society_development_progress|1]/100. Повышение уровня учитывается при ближайшем месячном пересчёте; излишек сохраняется."
 RUS_public_reading_rooms:0 "Окружные читальни"
 RUS_public_reading_rooms_desc:0 "Оплатить развитие культуры: §G25§! £ADISCORD_country_development_texticon за §Y35§! £ADISCORD_economy_treasury_texticon и §Y25§! £political_power_texticon. Повторная программа доступна через §Y90 дней§!."
 RUS_public_reading_rooms_ready_tt:0 "Завершён профильный фокус; уровень ниже 5 и прогресс ниже 100."
 RUS_public_reading_rooms_result_tt:0 "Прогресс развития культуры: §G+25§! £ADISCORD_country_development_texticon. Текущий уровень: [?ADISCORD_cultural_development_level|0]/5; прогресс: [?ADISCORD_cultural_development_progress|1]/100. Повышение уровня учитывается при ближайшем месячном пересчёте; излишек сохраняется."
 RUS_regimental_training:0 "Полковые учебные сборы"
 RUS_regimental_training_desc:0 "Оплатить развитие армии: §G25§! £ADISCORD_country_development_texticon за §Y35§! £ADISCORD_economy_treasury_texticon и §Y25§! £political_power_texticon. Повторная программа доступна через §Y90 дней§!."
 RUS_regimental_training_ready_tt:0 "Завершён профильный фокус; уровень ниже 5 и прогресс ниже 100."
 RUS_regimental_training_result_tt:0 "Прогресс развития армии: §G+25§! £ADISCORD_country_development_texticon. Текущий уровень: [?ADISCORD_army_development_level|0]/5; прогресс: [?ADISCORD_army_development_progress|1]/100. Повышение уровня учитывается при ближайшем месячном пересчёте; излишек сохраняется."
 RUS_bunker_energy_sale:0 "Продать энергию"
 RUS_bunker_energy_sale_desc:0 "Подключить поселения к генераторам бункера. За §Y90 дней§! поставок покупатели платят §G100§! £ADISCORD_economy_treasury_texticon сразу. Контракт занимает §Y1§! £energy_consumption_texticon свободной мощности: она недоступна для новых помещений до конца поставок. Одновременно действует один контракт. При потере контроля над бункером или прекращении правления Хана аванс возвращается."
 RUS_bunker_energy_contract_free_tt:0 "Нет действующего договора поставки энергии."
 RUS_bunker_energy_sale_cost:0 "§Y1§! £energy_consumption_texticon / 90 дней"
 RUS_bunker_energy_sale_cost_blocked:0 "§R1§! £energy_consumption_texticon / 90 дней"
 RUS_bunker_energy_sale_cost_tooltip:0 "Требуется §Y1§! £energy_consumption_texticon свободной мощности. Мощность резервируется на §Y90 дней§!, затем возвращается бункеру."
