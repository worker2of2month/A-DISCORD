 RUS_bunker_signals_desc:0 "Сходящиеся в одном зале кабели превращают крики гонцов в проверенные донесения. Приказ должен прийти раньше, чем его получатель погибнет.\n\nСтроительство: 21 день. Один вариант на слой.\nСодержание: §Y1§! £supply_texticon в неделю.\n\n[GetRUSBunkerForecastsignals]\n\nПосле «Единой связи частей»: ещё +1 п.п. вступления резервов в бой. После «Постов воздушного наведения»: ещё +3% эффективности авиационных заданий."
