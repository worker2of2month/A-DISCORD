 RUS_bunker_benefits_details_active:0 "Организация армии: [?RUS_bunker_army_org_factor|=+0%]\nЗащита армии: [?RUS_bunker_army_defence_factor|=+0%]\nВремя обучения: [?RUS_bunker_training_time_army_factor|=-0%]\nИстощение: [?RUS_bunker_attrition|=-0%]\nВозвращение потерь: [?RUS_bunker_casualty_trickleback|=+0%]\nВыпуск военных заводов: [?RUS_bunker_industrial_capacity_factory|=+0%]\nТовары народного потребления: [?RUS_bunker_consumer_goods_factor|=-0%]\nСкорость исследований: [?RUS_bunker_research_speed_factor|=+0%]\nСкорость планирования: [?RUS_bunker_planning_speed|=+0%]\nМаксимальное планирование: [?RUS_bunker_max_planning_factor|=+0%]\nСтабильность: [?RUS_bunker_stability_factor|=+0%]\nСкорость пополнения: [?RUS_bunker_reinforce_rate|=+0%]\nПредел капитуляции: [?RUS_bunker_surrender_limit|=+0%]\n[?RUS_bunker_political_power_gain|=+2] £political_power_texticon в день\n\nЭто итог помещений, модернизаций, глубины, пайков и аварийных штрафов. Остальные национальные духи сюда не входят.\n[GetRUSBunkerFoodState]\n[GetRUSBunkerIntegrityEffect]"
