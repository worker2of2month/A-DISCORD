 RUS_suspicion_status:0 "§YПодозрение соседей: [?RUS_suspicion|0]/100§! £RUS_suspicion_texticon\n§RПри раскрытии [MON.GetName] и союзники нападут без 90 дней подготовки. Хан будет вынужден провозгласить державу.§!\nУсловия раскрытия (все одновременно):\n- §Y100§! £RUS_suspicion_texticon.\n- Контроль всех доступных земель Грязной зоны, кроме занятых Кефрейтом и его марионетками.\n- Контроль хотя бы одной реакторной зоны.\n- Нет текущих войн.\n\nРост в месяц: базовый §R+3§! £RUS_suspicion_texticon[GetRUSSuspicionArmyGrowth][GetRUSSuspicionBroadcastRelief][GetRUSSuspicionThroneRelief][GetRUSSuspicionBureauRelief][GetRUSSuspicionEnergyRelief]."
