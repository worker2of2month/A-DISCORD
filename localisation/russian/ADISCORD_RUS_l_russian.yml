 RUS_bunker_upgrade_1_ui_tt:0 "§YУлучшить установленное помещение§!\n[GetRUSBunkerUpgradeReward1]\n\nЦена: [GetRUSBunker30pp]  [GetRUSBunker30cash]  [GetRUSBunker30equipment]\nСрок: §Y28 дн.§!\nМощность и расход пищи не увеличатся.\n\n[GetRUSBunkerUpgrade1]\nНужен фокус \"[GetRUSBunkerRecipe1]\".\n\n[GetRUSBunkerForecastUpgrade1]"
 RUS_bunker_water_compact:0 "Водоочистка"
 RUS_bunker_water_ui_tt:0 "§YВодоочистка§!\n§G-10%§! небоевых потерь техники от истощения.\nПродовольствие: §G+2§! £supply_texticon в неделю.\n\nЦена: [GetRUSBunker13pp]  [GetRUSBunker13cash]  [GetRUSBunker13equipment]\nСрок: §Y28 дн.§!\nСодержание: §Y1§! £energy_consumption_texticon; §Y1§! £supply_texticon в неделю.\n\n[GetRUSBunkerRoomwater]\nНужен фокус \"[GetRUSBunkerRecipe2]\".\n\n[GetRUSBunkerForecastwater]"
 RUS_bunker_signals_compact:0 "Связь"
