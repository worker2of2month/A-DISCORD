 RUS_favour_science_20_tt:0 "Поддержка учёных: §R-20%§!. Ниже 50% фракция перестаёт давать £political_power_texticon и тянуть баланс к себе."
 RUS_favour_science_15_cost:0 "§Y15%§! поддержки учёных"
 RUS_favour_science_15_cost_blocked:0 "§R15%§! поддержки учёных"
 RUS_favour_science_15_cost_tooltip:0 "Нужно не меньше §Y15%§! поддержки учёных."
 RUS_favour_science_15_tt:0 "Поддержка учёных: §R-15%§!. Ниже 50% фракция перестаёт давать £political_power_texticon и тянуть баланс к себе."
 RUS_state_balance_compromise:0 "Присяга обеих сил"
 RUS_state_balance_government_tt:0 "Страной правит Марк Рустан; страна независима, не капитулировала, империя не распалась."
 RUS_bop_relief:0 "Усиленный паёк научных смен"
 RUS_bop_relief_desc:0 "Передать часть подземных запасов сменам, которые обслуживают насосы, фильтры и лаборатории. Сытые смены работают спокойнее, а учёные получают больше голоса в распределении запасов. Пища списывается сразу; опустошённый склад может вызвать голод в оснащённых помещениях. Повторение через 90 дней."
 RUS_bop_relief_room_tt:0 "Влияние учёных ещё не достигло 85% своей стороны шкалы."
 RUS_bop_reserve:0 "Выдать пайки резерву Чёрной армии"
 RUS_bop_reserve_desc:0 "Обеспечить питание добровольцев на сборных пунктах Чёрной армии. Страна получает резервистов, а армия - больше влияния на распределение запасов. Это люди для пополнения и набора, а не готовые вооружённые дивизии. Пища списывается сразу; опустошённый склад может вызвать голод. Повторение через 90 дней."
 RUS_bop_reserve_room_tt:0 "Влияние Чёрной армии ещё не достигло 85% своей стороны шкалы."
 RUS_bop_mediation:0 "Созвать совет армии и учёных"
 RUS_bop_mediation_desc:0 "Оплатить общее собрание командиров Чёрной армии, учёных и казначейства. Согласование полномочий приближает стороны к компромиссу, и обе уходят с ощущением, что Хан их услышал. Повторение через 90 дней."
 RUS_bop_mediation_needed_tt:0 "Баланс находится за пределами центрального диапазона от -10% до +10%."
 RUS_bop_mediation_result_tt:0 "Баланс власти сдвинется на §Y15%§! к середине шкалы. Поддержка §YУчёных§! и §YЧёрной армии§!: §G+5%§!."
 RUS_bop_relief_cost:0 "§Y30§! £supply_texticon"
 RUS_bop_relief_cost_blocked:0 "§R30§! £supply_texticon"
 RUS_bop_relief_cost_tooltip:0 "Нужно 30 £supply_texticon из запасов бункера."
 RUS_bop_reserve_cost:0 "§Y40§! £supply_texticon"
 RUS_bop_reserve_cost_blocked:0 "§R40§! £supply_texticon"
 RUS_bop_reserve_cost_tooltip:0 "Нужно 40 £supply_texticon из запасов бункера."
 RUS_bop_mediation_cost:0 "§Y20§! £political_power_texticon  §Y65§! £ADISCORD_economy_treasury_texticon"
 RUS_bop_mediation_cost_blocked:0 "§R20§! £political_power_texticon  §R65§! £ADISCORD_economy_treasury_texticon"
 RUS_bop_mediation_cost_tooltip:0 "Нужно 20 £political_power_texticon и 65 £ADISCORD_economy_treasury_texticon."
 RUS_suspicion_opens_tt:0 "После первого территориального приобретения открывается шкала §Yподозрения соседей§! с начальным значением §Y10§! £RUS_suspicion_texticon. Она растёт каждый месяц, а также от работ у реактора, лабораторий и походов. При §Y100§! £RUS_suspicion_texticon, после захвата всех доступных областей Грязной зоны, не занятых Кефрейтом или его марионетками, и окончания текущих войн, Монтарская империя и её союзники нападут без 90-дневного сбора, а Хан будет вынужден провозгласить державу."
 RUS_suspicion_focus_relief_tt:0 "Пока открыта шкала подозрения соседей, её ежемесячный рост: §G-1§! £RUS_suspicion_texticon."
 RUS_suspicion_gain_4_tt:0 "Подозрение соседей: §R+4§! £RUS_suspicion_texticon."
 RUS_suspicion_gain_6_tt:0 "Подозрение соседей: §R+6§! £RUS_suspicion_texticon."
 RUS_suspicion_gain_8_tt:0 "Подозрение соседей: §R+8§! £RUS_suspicion_texticon."
 RUS_suspicion_gain_10_tt:0 "Подозрение соседей: §R+10§! £RUS_suspicion_texticon."
 RUS_suspicion_gain_12_tt:0 "Подозрение соседей: §R+12§! £RUS_suspicion_texticon."
 RUS_suspicion_relief_15_tt:0 "Подозрение соседей: §G-15§! £RUS_suspicion_texticon."
 RUS_suspicion_relief_8_tt:0 "Подозрение соседей: §G-8§! £RUS_suspicion_texticon."
 RUS_suspicion_relief_12_tt:0 "Подозрение соседей: §G-12§! £RUS_suspicion_texticon."
 RUS_inspection_hide_cost_tt:0 "Пайки: §R-20§! £supply_texticon; работы у реактора замирают, часть резервистов распускают по домам: §R-500§! £manpower_texticon."
 RUS_inspection_bribe_cost_tt:0 "Казна: §R-65§! £ADISCORD_economy_treasury_texticon."
 RUS_suspicion_relief_25_tt:0 "Подозрение соседей: §G-25§! £RUS_suspicion_texticon."
 RUS_suspicion_relief_10_tt:0 "Подозрение соседей: §G-10§! £RUS_suspicion_texticon."
 RUS_suspicion_relief_20_tt:0 "Подозрение соседей: §G-20§! £RUS_suspicion_texticon."
 RUS_suspicion_positive_tt:0 "Подозрение соседей выше нуля."
 RUS_suspicion_open_tt:0 "Соседи уже следят за Ханом: открыта шкала подозрения."
 RUS_suspicion_status:0 "§YПодозрение соседей:§! §Y[?RUS_suspicion|0]§!/100 £RUS_suspicion_texticon\nРост в месяц: базовый §R+3§! £RUS_suspicion_texticon[GetRUSSuspicionArmyGrowth][GetRUSSuspicionBroadcastRelief][GetRUSSuspicionThroneRelief][GetRUSSuspicionBureauRelief][GetRUSSuspicionEnergyRelief].\nПри §Y100§! £RUS_suspicion_texticon, после захвата всех доступных областей Грязной зоны, не занятых Кефрейтом или его марионетками, и окончания текущих войн, Монтарская империя и её союзники нападут без 90-дневного сбора, а Хан будет вынужден провозгласить державу."
 RUS_suspicion_status_closed:0 ""
 RUS_suspicion_growth_none:0 ""
 RUS_suspicion_growth_army_influence:0 ", перевес Чёрной армии §R+2§! £RUS_suspicion_texticon"
 RUS_suspicion_growth_army_dominance:0 ", господство Чёрной армии §R+4§! £RUS_suspicion_texticon"
 RUS_suspicion_growth_broadcast:0 ", «Две редакции - один эфир» §G-1§! £RUS_suspicion_texticon"
 RUS_suspicion_growth_sealed_throne:0 ", «Ставка под горой» §G-1§! £RUS_suspicion_texticon"
 RUS_suspicion_growth_press_bureau:0 ", «Бюро иностранной печати» §G-1§! £RUS_suspicion_texticon"
 RUS_suspicion_energy_cover:0 "Выдать реактор за энергетическую программу"
 RUS_suspicion_energy_cover_desc:0 "Учёные покажут иностранным наблюдателям турбины, сети и мастерские, а орбитальные расчёты на время уйдут в закрытые архивы. Соседи увидят стройку электростанции, а не оружие. Подозрение сейчас: §Y[?RUS_suspicion|0]§!/100 £RUS_suspicion_texticon. Повторение через 60 дней."
 RUS_suspicion_energy_cover_cost:0 "§Y60§! £ADISCORD_economy_treasury_texticon"
 RUS_suspicion_energy_cover_cost_blocked:0 "§R60§! £ADISCORD_economy_treasury_texticon"
 RUS_suspicion_energy_cover_cost_tooltip:0 "Нужно 60 £ADISCORD_economy_treasury_texticon."
 RUS_suspicion_energy_cover_support_tt:0 "Поддержка §YУчёных§!: §G+5%§!."
 RUS_suspicion_disperse_musters:0 "Рассредоточить армейские сборы"
 RUS_suspicion_disperse_musters_desc:0 "Сборные пункты у реакторного периметра слишком заметны. Чёрная армия распустит часть резервистов по домам и перенесёт учения в дальние аймаки, оставив у реактора обычные караулы. Подозрение сейчас: §Y[?RUS_suspicion|0]§!/100 £RUS_suspicion_texticon. Повторение через 60 дней."
 RUS_suspicion_disperse_musters_cost:0 "§Y15§! £supply_texticon  §Y500§! £manpower_texticon"
 RUS_suspicion_disperse_musters_cost_blocked:0 "§R15§! £supply_texticon  §R500§! £manpower_texticon"
 RUS_suspicion_disperse_musters_cost_tooltip:0 "Нужно 15 £supply_texticon из запасов бункера и 500 £manpower_texticon."
 RUS_suspicion_disperse_musters_support_tt:0 "Поддержка §YЧёрной армии§!: §G+5%§!."
 RUS_suspicion_envoys:0 "Послы в Монтарскую империю"
 RUS_suspicion_envoys_desc:0 "Ханские послы повезут в Монтарскую империю заверения в мирных намерениях, подарки и приглашение на открытие новых мастерских. Монтарские штабы не перестанут считать дивизии, но отложат часть приготовлений. Подозрение сейчас: §Y[?RUS_suspicion|0]§!/100 £RUS_suspicion_texticon. Повторение через 120 дней."
 RUS_suspicion_envoys_cost:0 "§Y30§! £political_power_texticon  §Y85§! £ADISCORD_economy_treasury_texticon"
 RUS_suspicion_envoys_cost_blocked:0 "§R30§! £political_power_texticon  §R85§! £ADISCORD_economy_treasury_texticon"
 RUS_suspicion_envoys_cost_tooltip:0 "Нужно 30 £political_power_texticon и 85 £ADISCORD_economy_treasury_texticon."
 RUS_suspicion_ration_aid:0 "Отправить пайки в голодные приграничья"
 RUS_suspicion_ration_aid_desc:0 "Подземные склады отдадут часть пайков голодающим посёлкам по ту сторону границы. Трудно звать к войне против тех, кто кормит твоих людей. Пища списывается сразу; опустошённый склад может вызвать голод. Подозрение сейчас: §Y[?RUS_suspicion|0]§!/100 £RUS_suspicion_texticon. Повторение через 60 дней."
 RUS_suspicion_ration_aid_cost:0 "§Y30§! £supply_texticon"
 RUS_suspicion_ration_aid_cost_blocked:0 "§R30§! £supply_texticon"
 RUS_suspicion_ration_aid_cost_tooltip:0 "Нужно 30 £supply_texticon из запасов бункера."
 RUS_suspicion_border_bribes:0 "Купить молчание пограничных постов"
 RUS_suspicion_border_bribes_desc:0 "Казна щедро заплатит чужим писарям, начальникам застав и купцам, которые носят донесения в соседние штабы. Деньги не меняют чужих планов, но надолго задерживают тревожные сводки. Подозрение сейчас: §Y[?RUS_suspicion|0]§!/100 £RUS_suspicion_texticon. Повторение через 90 дней."
 RUS_suspicion_border_bribes_cost:0 "§Y200§! £ADISCORD_economy_treasury_texticon"
 RUS_suspicion_border_bribes_cost_blocked:0 "§R200§! £ADISCORD_economy_treasury_texticon"
 RUS_suspicion_border_bribes_cost_tooltip:0 "Нужно 200 £ADISCORD_economy_treasury_texticon."
 RUS_suspicion_press_tour:0 "Провести пресс-тур по мирным мастерским"
 RUS_suspicion_press_tour_desc:0 "Бюро иностранной печати повезёт корреспондентов по турбинным залам, школам и мастерским, а учёные ответят на вопросы о реакторе так, чтобы ответы звучали скучно. Подозрение сейчас: §Y[?RUS_suspicion|0]§!/100 £RUS_suspicion_texticon. Повторение через 60 дней."
 RUS_suspicion_press_tour_cost:0 "§Y50§! £ADISCORD_economy_treasury_texticon"
 RUS_suspicion_press_tour_cost_blocked:0 "§R50§! £ADISCORD_economy_treasury_texticon"
 RUS_suspicion_press_tour_cost_tooltip:0 "Нужно 50 £ADISCORD_economy_treasury_texticon."
 RUS_suspicion_reactor_camouflage:0 "Скрыть работы у реактора"
 RUS_suspicion_reactor_camouflage_desc:0 "Караулы Чёрной армии переведут работы в ночные смены, закроют площадки маскировочными сетями и разведут колонны по дальним дорогам. Караулам нужны пайки, а сетям - деньги. Пища списывается сразу. Подозрение сейчас: §Y[?RUS_suspicion|0]§!/100 £RUS_suspicion_texticon. Повторение через 90 дней."
 RUS_suspicion_reactor_camouflage_cost:0 "§Y40§! £supply_texticon  §Y50§! £ADISCORD_economy_treasury_texticon"
 RUS_suspicion_reactor_camouflage_cost_blocked:0 "§R40§! £supply_texticon  §R50§! £ADISCORD_economy_treasury_texticon"
 RUS_suspicion_reactor_camouflage_cost_tooltip:0 "Нужно 40 £supply_texticon из запасов бункера и 50 £ADISCORD_economy_treasury_texticon."
 RUS_suspicion_border_commission:0 "Созвать пограничную комиссию"
 RUS_suspicion_border_commission_desc:0 "По грамоте добрососедства соседские офицеры вместе с ханскими писарями объедут заставы, сверят карты и пообедают в гарнизонах за счёт Хана. Пища списывается сразу. Подозрение сейчас: §Y[?RUS_suspicion|0]§!/100 £RUS_suspicion_texticon. Повторение через 120 дней."
 RUS_suspicion_border_commission_cost:0 "§Y20§! £supply_texticon  §Y65§! £ADISCORD_economy_treasury_texticon"
 RUS_suspicion_border_commission_cost_blocked:0 "§R20§! £supply_texticon  §R65§! £ADISCORD_economy_treasury_texticon"
 RUS_suspicion_border_commission_cost_tooltip:0 "Нужно 20 £supply_texticon из запасов бункера и 65 £ADISCORD_economy_treasury_texticon."
 RUS_shadow_rifles:0 "Перекупить оружие с чужих складов"
 RUS_shadow_rifles_desc:0 "Интенданты соседних застав продают списанные винтовки и запчасти за наличные, если покупатель не спрашивает накладных. Сделка быстрая, но каждый ящик на чужом складе кто-то пересчитает заново. Подозрение сейчас: §Y[?RUS_suspicion|0]§!/100 £RUS_suspicion_texticon. Повторение через 90 дней."
 RUS_shadow_rifles_cost:0 "§Y35§! £ADISCORD_economy_treasury_texticon"
 RUS_shadow_rifles_cost_blocked:0 "§R35§! £ADISCORD_economy_treasury_texticon"
 RUS_shadow_rifles_cost_tooltip:0 "Нужно 35 £ADISCORD_economy_treasury_texticon."
 RUS_shadow_rifles_room_tt:0 "Подозрение соседей ниже §Y92§! £RUS_suspicion_texticon: после сделки оно останется ниже §Y100§! £RUS_suspicion_texticon."
 RUS_shadow_designs:0 "Выкрасть чертежи соседей"
 RUS_shadow_designs_desc:0 "Свои люди в соседних мастерских перепишут чертежи затворов и лафетов за одну ночь. Учёные получат готовые решения, а соседи - доказательство, что у Хана есть уши в их цехах. Подозрение сейчас: §Y[?RUS_suspicion|0]§!/100 £RUS_suspicion_texticon. Повторение через 120 дней."
 RUS_shadow_designs_cost:0 "§Y15§! £political_power_texticon"
 RUS_shadow_designs_cost_blocked:0 "§R15§! £political_power_texticon"
 RUS_shadow_designs_cost_tooltip:0 "Нужно 15 £political_power_texticon."
 RUS_shadow_designs_room_tt:0 "Подозрение соседей ниже §Y88§! £RUS_suspicion_texticon: после кражи оно останется ниже §Y100§! £RUS_suspicion_texticon."
 RUS_stolen_designs:0 "Выкраденные чертежи"
 RUS_shadow_engineers:0 "Переманить инженеров"
 RUS_shadow_engineers_desc:0 "Соседские инженеры давно сидят без жалованья. Хан предложит им паёк, жильё под землёй и работу по специальности, а их бывшие начальники быстро поймут, куда исчезли лучшие люди. Подозрение сейчас: §Y[?RUS_suspicion|0]§!/100 £RUS_suspicion_texticon. Повторение через 120 дней."
 RUS_shadow_engineers_cost:0 "§Y25§! £supply_texticon"
 RUS_shadow_engineers_cost_blocked:0 "§R25§! £supply_texticon"
 RUS_shadow_engineers_cost_tooltip:0 "Нужно 25 £supply_texticon из запасов бункера."
 RUS_shadow_engineers_room_tt:0 "Подозрение соседей ниже §Y90§! £RUS_suspicion_texticon: после найма оно останется ниже §Y100§! £RUS_suspicion_texticon."
 RUS_shadow_engineers_ready_tt:0 "Экономическое развитие ещё может расти."
 RUS_shadow_engineers_result_tt:0 "Прогресс экономического развития: §G+20§!."
 RUS_energy_contract:0 "Энергосеть: [FROM.GetName]"
 RUS_energy_contract_desc:0 "Генераторы бункера дают больше тока, чем нужно подземным залам. Соседние посёлки заплатят за свет и насосы, а зависимость от ханской сети сделает их осторожнее в разговорах о войне."
 RUS_energy_contract_cost:0 "§Y1§! £energy_consumption_texticon"
 RUS_energy_contract_cost_blocked:0 "§R1§! £energy_consumption_texticon"
 RUS_energy_contract_cost_tooltip:0 "Нужна §Y1§! £energy_consumption_texticon свободной мощности бункера."
 RUS_energy_contract_result_tt:0 "Контракт занимает §Y1§! £energy_consumption_texticon мощности и приносит §G+8§! £ADISCORD_economy_treasury_texticon в месяц. Пока он действует, рост подозрения соседей: §G-1§! £RUS_suspicion_texticon в месяц. Одновременно действуют не больше §Y2§! контрактов (§Y3§! после «Рынка у верхнего шлюза»).\nЕсли начнётся война с [FROM.GetName], ток отключат: на §Y90§! дней покупатель получит «Отключённый ток» (промышленность §R-15%§!, скорость строительства §R-20%§!, организация армии §R-5%§!)."
 RUS_energy_contract_end:0 "Отключить: [FROM.GetName]"
 RUS_energy_contract_end_desc:0 "Отключить линию без войны и вернуть мощность бункеру."
 RUS_energy_contract_end_tt:0 "Контракт расторгнут: мощность возвращается бункеру, доход §G+8§! £ADISCORD_economy_treasury_texticon в месяц и снижение роста подозрения пропадают. Штрафа «Отключённый ток» нет."
 RUS_power_cut:0 "Отключённый ток"
 RUS_suspicion_growth_energy:0 ", энергоконтракты §G-[?RUS_energy_contracts|0]§! £RUS_suspicion_texticon"
 RUS_war_spoils_full_tt:0 "Трофеи: §G+100§! £ADISCORD_economy_treasury_texticon, §G+3000§! £infantry_equipment_texticon, §G+1500§! £manpower_texticon, §G+30§! £supply_texticon в запасы бункера."
 RUS_war_spoils_half_tt:0 "Трофеи: §G+50§! £ADISCORD_economy_treasury_texticon, §G+1500§! £infantry_equipment_texticon, §G+750§! £manpower_texticon, §G+15§! £supply_texticon в запасы бункера."
 RUS_aimaq_levy:0 "Созвать аймачное ополчение"
 RUS_aimaq_levy_desc:0 "Старейшины аймаков приведут пастухов, возчиков и охотников, если бункер накормит их и выдаст оружие. Это не армия: ополченцы плохо держат удар и разойдутся по домам с концом войны. Зато они не уводят людей из призывных списков."
 RUS_aimaq_levy_cost:0 "§Y30§! £supply_texticon  §Y2700§! £infantry_equipment_texticon"
 RUS_aimaq_levy_cost_blocked:0 "§R30§! £supply_texticon  §R2700§! £infantry_equipment_texticon"
 RUS_aimaq_levy_cost_tooltip:0 "Нужно 30 £supply_texticon из запасов бункера и 2700 £infantry_equipment_texticon на складе."
 RUS_aimaq_levy_room_tt:0 "Идёт война, и лимит ополчения за неё не исчерпан: §Y3§! созыва, §Y+2§! после «Суда до выстрела», §Y+1§! после «Гарнизона под горой»."
 RUS_aimaq_levy_result_tt:0 "В столице появляются §Y2§! дивизии «Aimaq Levy» (по §Y3§! батальона ополчения, половина винтовок). Люди не берутся из призывного резерва. После окончания всех войн ополчение распускается без возврата людей и винтовок. Пока созыв под ружьём, бункер кормит его: расход пайков §R+1§! £supply_texticon в неделю."
 RUS_refugees_food_tt:0 "Пайки: до §R-30§! £supply_texticon из запасов бункера."
 RUS_refugees_settle_cost_tt:0 "Казна: §R-35§! £ADISCORD_economy_treasury_texticon."
 RUS_refugees_settle_result_tt:0 "Прогресс общественного развития: §G+15§!."
 RUS_winter_tt:0 "Зима: расход пайков в бункере §R+3§! £supply_texticon в неделю на §Y90§! дней (§R+1§! после «Зимних ведомостей»)."
 RUS_winter_food_tt:0 "Пайки: §G+30§! £supply_texticon в запасы бункера."
 RUS_winter_grain_cost_tt:0 "Казна: §R-50§! £ADISCORD_economy_treasury_texticon."
 ADISCORD_rus_crisis.31.t:0 "Беженцы у ворот"
 ADISCORD_rus_crisis.31.d:0 "После падения соседних застав по дорогам к бункеру потянулись семьи: телеги с домашним скарбом, старики на руках у сыновей, дети, которые ещё не видели подземных городов. Они бегут от войны, которую принёс Хан, и просят защиты у него же.\n\nВ галереях хватит места для рабочих рук, но каждый новый рот съест часть зимнего запаса. Можно поселить людей в аймаках за счёт казны или закрыть ворота и оставить их степи."
 ADISCORD_rus_crisis.31.a:0 "Принять всех под землю."
 ADISCORD_rus_crisis.31.b:0 "Расселить по аймакам."
 ADISCORD_rus_crisis.31.c:0 "Закрыть ворота."
 ADISCORD_rus_crisis.32.t:0 "Зима над степью"
 ADISCORD_rus_crisis.32.d:0 "Первый снег закрыл дороги к дальним аймакам. Насосы работают дольше, в галереях жгут больше света, а сменам у генераторов нужен двойной паёк. Интенданты считают, что запасов хватит только при строгой экономии.\n\nСтаршие смены предлагают отправить экспедиции на поверхность: в брошенных посёлках ещё остались склады, но каждый выход заметят чужие разъезды. Казначейство может купить зерно у соседей, если в казне найдутся деньги."
 ADISCORD_rus_crisis.32.a:0 "Затянуть пояса до весны."
 ADISCORD_rus_crisis.32.b:0 "Отправить экспедиции на поверхность."
 ADISCORD_rus_crisis.32.c:0 "Купить зерно у соседей."
 ADISCORD_rus_crisis.33.a:0 "Весна."
 RUS_vorkerland_airlift:0 "Гуманитарный мост Воркерланда"
 RUS_vorkerland_airlift_desc:0 "Транспортники Воркерланда сбрасывают над степью мешки с крупой и ящики консервов. Пилоты не спрашивают о Хане: кого кормят сегодня, тот не уйдёт к чужим завтра. Но в Воркерланде всё громче говорят о собственных трудностях, и каждый следующий сброс может оказаться меньше прежнего.\n\nКаждые §Y50§! дней прилетает новая партия: сначала большая, потом меньше, потом совсем скромная. Если в Воркерланде начнётся смута, мост оборвётся раньше."
 RUS_vorkerland_airlift_next_tt:0 "Над бункером проходит очередной сброс гуманитарной помощи Воркерланда."
 RUS_bunker_mushroom_farm:0 "Заложить грибную ферму"
 RUS_bunker_mushroom_farm_desc:0 "В сырых выработках за старой переборкой можно растить грибы на опилках и кухонных отходах. Ферме не нужно солнце, но светильники, вентиляция и насосы работают круглые сутки.\n\nКаждая ферма даёт §G+2§! £supply_texticon в неделю и постоянно занимает §Y1§! £energy_consumption_texticon. Можно построить до §Y3§! ферм, по одной за раз. Ферм сейчас: §Y[?RUS_bunker_farms|0]§!/3."
 RUS_bunker_mushroom_farm_cost:0 "§Y65§! £ADISCORD_economy_treasury_texticon  §Y1§! £energy_consumption_texticon"
 RUS_bunker_mushroom_farm_cost_blocked:0 "§R65§! £ADISCORD_economy_treasury_texticon  §R1§! £energy_consumption_texticon"
 RUS_bunker_mushroom_farm_cost_tooltip:0 "Нужно 65 £ADISCORD_economy_treasury_texticon в казне и 1 £energy_consumption_texticon свободной мощности бункера."
 RUS_bunker_mushroom_farm_tt:0 "Казна: §R-65§! £ADISCORD_economy_treasury_texticon. Мощность §Y1§! £energy_consumption_texticon занята с начала работ.\nЧерез §Y45§! дней продовольствие бункера: §G+2§! £supply_texticon в неделю."
 RUS_bunker_mushroom_farm_done_tt:0 "Грибная ферма готова: продовольствие бункера §G+2§! £supply_texticon в неделю, мощность §Y1§! £energy_consumption_texticon занята постоянно."
 RUS_bunker_mushroom_farm_cancel_tt:0 "Бункер потерян: работы прекращены, §G65§! £ADISCORD_economy_treasury_texticon возвращаются в казну."
 RUS_bunker_farm_ready_tt:0 "Хан правит, бункер работает, пройдено не меньше §Y2§! слоёв, ферм меньше §Y3§!, и другая ферма сейчас не строится."
 RUS_aimaq_food_requisition:0 "Продовольственная разверстка в аймаках"
 RUS_aimaq_food_requisition_desc:0 "Ханские писцы обойдут присоединённые аймаки и опишут амбары. Каждый двор отдаст бункеру долю зерна и вяленого мяса. Склады наполнятся быстро, но степь запомнит, кто забрал её хлеб, а соседи увидят обозы с реквизицией. Повторение через 90 дней."
 RUS_food_requisition_tt:0 "Продовольствие бункера: §G+40§! £supply_texticon; всё, что не помещается на склад, теряется."
 RUS_food_requisition_ready_tt:0 "Хан правит, бункер работает, и под контролем страны больше §Y3§! областей."
 RUS_refugees_mouths_tt:0 "Расход пайков в бункере: §R+1§! £supply_texticon в неделю навсегда."
 RUS_bunker_spoil_focus_tt:0 "Раз в два месяца портится §G5%§! запаса сверх 75% ёмкости склада вместо §R10%§!."
 RUS_airlift_food_60_tt:0 "Продовольствие бункера: §G+60§! £supply_texticon; всё, что не помещается на склад, теряется."
 RUS_airlift_food_35_tt:0 "Продовольствие бункера: §G+35§! £supply_texticon; всё, что не помещается на склад, теряется."
 RUS_airlift_food_15_tt:0 "Продовольствие бункера: §G+15§! £supply_texticon; всё, что не помещается на склад, теряется."
 RUS_airlift_cash_75_tt:0 "Груз продают аймакам: казна §G+75§! £ADISCORD_economy_treasury_texticon."
 RUS_airlift_cash_45_tt:0 "Груз продают аймакам: казна §G+45§! £ADISCORD_economy_treasury_texticon."
 RUS_airlift_cash_20_tt:0 "Груз продают аймакам: казна §G+20§! £ADISCORD_economy_treasury_texticon."
 RUS_disaster_food_25_tt:0 "Продовольствие бункера: §R-25§! £supply_texticon."
 RUS_disaster_cash_65_tt:0 "Казна: §R-65§! £ADISCORD_economy_treasury_texticon."
 RUS_disaster_cash_35_tt:0 "Казна: §R-35§! £ADISCORD_economy_treasury_texticon."
 RUS_disaster_granary_40_tt:0 "Под завалом остаётся §R40%§! запасов бункера."
 RUS_disaster_granary_10_tt:0 "Под завалом остаётся §R10%§! запасов бункера."
 RUS_disaster_granary_15_tt:0 "Под завалом остаётся §R15%§! запасов бункера."
 RUS_disaster_cattle_tt:0 "Расход пайков в бункере: §R+3§! £supply_texticon в неделю на §Y60§! дней."
 ADISCORD_rus_crisis.34.t:0 "Первый сброс над степью"
 ADISCORD_rus_crisis.34.d:0 "Утром над бункером прошли три транспортника с эмблемой Воркерланда. Над пустошью раскрылись парашюты, и караулы Чёрной армии до темноты собирали мешки с крупой, ящики консервов и бочки с маслом. В записке командира звена говорилось только одно: помощь будет и дальше, пока у Воркерланда есть топливо.\n\nИнтенданты предлагают сразу спустить груз на склады. Казначеи возражают: аймаки дадут за такие консервы хорошие деньги, а казне деньги нужнее."
 ADISCORD_rus_crisis.34.a:0 "Спустить груз на склады."
 ADISCORD_rus_crisis.34.b:0 "Продать груз аймакам."
 ADISCORD_rus_crisis.35.t:0 "Второй сброс"
 ADISCORD_rus_crisis.35.d:0 "Самолёты пришли снова, но теперь их два, а парашютов вдвое меньше. Лётчики, севшие у бункера на дозаправку, говорят неохотно: в Воркерланде урезают пайки собственным гарнизонам, а топливо распределяют комиссии. Половина груза - крупа прошлогоднего помола.\n\nЕсли так пойдёт и дальше, следующий сброс станет последним."
 ADISCORD_rus_crisis.35.a:0 "Спустить груз на склады."
 ADISCORD_rus_crisis.35.b:0 "Продать груз аймакам."
 ADISCORD_rus_crisis.36.t:0 "Последний самолёт"
 ADISCORD_rus_crisis.36.d:0 "Над степью прошёл один транспортник. Он сбросил несколько мешков и, не делая второго круга, ушёл на запад. Позже радисты разобрали перехваченные переговоры: в Воркерланде командиры делят склады, гарнизоны занимают аэродромы, а остатки топлива берегут для собственной войны. Гуманитарная помощь закончена.\n\nВпредь бункер может рассчитывать только на свои фермы, аймаки и обозы."
 ADISCORD_rus_crisis.36.a:0 "Спустить на склады то, что есть."
 ADISCORD_rus_crisis.36.b:0 "Продать остатки аймакам."
 ADISCORD_rus_crisis.37.t:0 "Небо опустело"
 ADISCORD_rus_crisis.37.d:0 "Назначенный день прошёл, но самолёты Воркерланда так и не появились. На западных частотах слышны только приказы, ругань и позывные частей, которые больше не подчиняются столице. В Воркерланде началась смута, и о голодных соседях там больше никто не вспомнит.\n\nОтныне бункер может рассчитывать только на свои фермы, аймаки и обозы."
 ADISCORD_rus_crisis.37.a:0 "Значит, будем кормиться сами."
 ADISCORD_rus_crisis.38.t:0 "Заражённая вода"
 ADISCORD_rus_crisis.38.d:0 "Насосы водоочистки подняли из скважины мутную воду с запахом железа и гнили. Санитары нашли в фильтрах дохлых крыс и следы старой утечки с нижних горизонтов. Несколько смен уже слегли с лихорадкой.\n\nМожно перекрыть насосы и промывать систему, пока галереи пьют из запасов. Можно купить на поверхности новые фильтры. А можно пить то, что есть, и надеяться, что лихорадка пройдёт сама."
 ADISCORD_rus_crisis.38.a:0 "Перекрыть насосы и пить из запасов."
 ADISCORD_rus_crisis.38.b:0 "Купить новые фильтры."
 ADISCORD_rus_crisis.38.c:0 "Пить как есть."
 ADISCORD_rus_crisis.39.t:0 "Обвал в амбаре"
 ADISCORD_rus_crisis.39.d:0 "Ночью свод зернохранилища на третьем слое не выдержал. Под камнем и бетоном оказались мешки, бочки и стеллажи с консервами. Инженеры говорят, что часть запаса ещё можно спасти, если немедленно поставить крепь и не ждать, пока порода осядет.\n\nЧёрная армия предлагает бросить в завал своих людей. Инженеры просят денег на крепь и полномочий снять рабочих с других участков."
 ADISCORD_rus_crisis.39.a:0 "Списать засыпанное."
 ADISCORD_rus_crisis.39.b:0 "Поставить крепь."
 ADISCORD_rus_crisis.39.c:0 "Пусть копает Чёрная армия."
 ADISCORD_rus_crisis.40.t:0 "Падёж скота"
 ADISCORD_rus_crisis.40.d:0 "Из присоединённых аймаков приходят дурные вести: по стадам прошёл мор. Пастухи режут больных животных и просят у бункера крупу, чтобы пережить сезон, иначе они уйдут с земель вместе с семьями.\n\nВетеринаров в ставке хватит на один аймак, лекарства придётся покупать у соседей. Можно и забрать уцелевший скот силой, пока пастухи не забили его сами."
 ADISCORD_rus_crisis.40.a:0 "Кормить аймаки из запасов."
 ADISCORD_rus_crisis.40.b:0 "Купить лекарства."
 ADISCORD_rus_crisis.40.c:0 "Забрать уцелевший скот."
 ADISCORD_rus_crisis.30.t:0 "Трофеи похода"
 ADISCORD_rus_crisis.30.d:0 "Последние заставы сдались, и обозы Чёрной армии потянулись к бункеру. В описях - касса уездной управы, склад винтовок, мешки с зерном и колонна пленных, которых можно поставить на работы под землёй.\n\nИнтенданты предлагают вывезти всё до последнего ящика. Старейшины аймаков просят оставить часть людям, которым жить на этой земле уже под ханской властью. Соседи будут судить о Хане по тому, что останется на месте."
 ADISCORD_rus_crisis.30.a:0 "Вывезти всё до последнего ящика."
 ADISCORD_rus_crisis.30.b:0 "Оставить часть аймакам."
