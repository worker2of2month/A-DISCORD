 RUS_bunker_laboratory_delta:0 "Лаборатория глубин"
 RUS_bunker_laboratory:0 "Слой 4: лаборатория глубин"
 RUS_bunker_laboratory_desc:0 "Под землёй нет звёзд, зато есть тишина для вычислений. Инженеры потребовали отдельную линию питания и право писать в отчётах неприятную правду.\n\nСтроительство: 21 день. Один вариант на слой.\nСодержание: §Y1§! £supply_texticon в неделю.\n\n[GetRUSBunkerForecastlaboratory]\n\nЕсли лаборатория работает при завершении «Реакторных сплавов», страна дополнительно получает §G50%§! ускорение одного исследования технологий поддержки. Открытие воздушного линкора не зависит от выбора помещения или политического курса.\n\nПосле «Общего плана наземного боя»: вероятность авиационных аварий ниже на 5%."
