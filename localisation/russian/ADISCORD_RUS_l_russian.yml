 RUS_bunker_generator:0 "Расширить машинный зал"
 RUS_bunker_generator_desc:0 "Резервные генераторы подключат через независимые щиты. Мощность нужна не нарисованным на плане комнатам, а работающим насосам, станкам и лампам.\n\nРаботы: 28 дн."
