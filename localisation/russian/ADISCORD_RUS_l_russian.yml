 RUS_scientists_plot:0 "Заговор учёных"
 RUS_scientists_plot_desc:0 "Инженеры перестали спорить на совещаниях. Глеб Корнеев приходит к Хану с журналом смены и уходит молча, а в реакторном поясе распоряжения Ставки исполняют только после подписи совета."
 RUS_black_army_plot:0 "Заговор Чёрной армии"
 RUS_black_army_plot_desc:0 "Командиры приходят в Ставку при оружии и не ждут вызова. Тагир Мансуров сам расставляет посты у кабинета Хана и сам решает, кого пускать."
 RUS_scientists_plot_broken_tt:0 "Перевес §Yучёных§! опустится ниже §Y60%§!."
 RUS_black_army_plot_broken_tt:0 "Перевес §YЧёрной армии§! опустится ниже §Y60%§!."
 RUS_coup_plot_dispersed_tt:0 "Заговорщики теряют поддержку; Марк Рустан сохраняет власть."
 RUS_scientists_plot_coup_tt:0 "§RУчёные свергают Марка Рустана.§! Страной руководит Глеб Корнеев, оружейный канал разобран."
 RUS_black_army_plot_coup_tt:0 "§RЧёрная армия свергает Марка Рустана.§! Страной руководит Тагир Мансуров, пульт спутника выведен из строя."
