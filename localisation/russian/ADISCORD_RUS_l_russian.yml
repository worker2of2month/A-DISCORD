 RUS_bunker_granary_delta:0 "Зерновые камеры"
 RUS_bunker_granary:0 "Слой 3: зерновые камеры"
 RUS_bunker_granary_desc:0 "Сухие камеры и учёт запасов избавят столицу от панических закупок. У хорошего склада нет героического вида: у него есть срок хранения и второй ключ.\n\nСтроительство: 21 день. Один вариант на слой.\nСодержание: §Y1§! £supply_texticon в неделю.\n\n[GetRUSBunkerForecastgranary]"
