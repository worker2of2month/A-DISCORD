 RUS_Viktor_Belov:0 "Виктор Белов"
 RUS_Aleksei_Tumanov:0 "Алексей Туманов"
 RUS_black_banner_empire:0 "Империя Чёрного Знамени"
 RUS_black_banner_empire_DEF:0 "Империи Чёрного Знамени"
 RUS_black_banner_empire_ADJ:0 "чернознамёнск."
 RUS_restoration_state:0 "Последняя империя"
 RUS_restoration_state_DEF:0 "Последней империи"
 RUS_restoration_state_ADJ:0 "имперск."
 ADISCORD_rus_crisis.4.government.t:0 "Распад единой державы"
 ADISCORD_rus_crisis.4.army.d:0 "Чёрное Знамя опущено. Чёрная армия Хана потерпела поражение, Марк Рустан отстранён, а единый штаб больше не связывает западные республики в одно государство. Местные правления возвращаются на земли распавшейся империи.\n\nНаше правительство может оставить эти осколки самостоятельными или по отдельности учредить в них санитарно-пограничные управления. Каждая спецзона оформляется отдельным решением; земли соседних государств в этот раздел не входят."
 ADISCORD_rus_crisis.4.reconstruction.d:0 "Последняя империя не выдержала войны. Учёный совет Хана распущен, Марк Рустан отстранён, а общие учреждения больше не связывают западные республики. Местные правления возвращаются к собственным границам и бюджетам.\n\nНаше правительство может оставить эти осколки самостоятельными или по отдельности учредить в них санитарно-пограничные управления. Каждая спецзона оформляется отдельным решением; земли соседних государств в этот раздел не входят."
 RUS_bunker_feedback_offline:0 "§RКомплекс недоступен.§!\nБонусы и снабжение приостановлены."
 RUS_bunker_integrity_danger:0 "§RАвария: <40§!"
 RUS_bunker_integrity_low:0 "§YНужен крепёж§!"
 RUS_bunker_integrity_safe:0 "§GУстойчиво§!"
 RUS_bunker_food_state_empty:0 "Помещений ещё нет: расход пищи и эффекты пайков отсутствуют."
 RUS_bunker_food_state_hungry:0 "§RГолод в галереях: склад пуст, действует тяжёлый национальный дух.§!"
 RUS_bunker_hunger:0 "Голод в галереях"
 RUS_bunker_hunger_desc:0 "Склады бункера пусты. Смены у насосов получают воду вместо пайка, в караулах засыпают на ногах, а в очередях за хлебом говорят о Хане то, что раньше шептали только о соседях. Пока продовольствие не вернётся, страна работает на последнем дыхании."
 RUS_bunker_food_state_normal:0 "Обычный рацион: бонусов и штрафов от пайков нет."
 RUS_bunker_food_state_fed:0 "§GСытость: +5% стабильности и +5% скорости пополнения.§!"
 RUS_bunker_food_badge_empty:0 "Нет жителей"
 RUS_bunker_food_badge_hungry:0 "§RГолод§!"
 RUS_bunker_food_badge_fed:0 "§GСытость§!"
 RUS_bunker_food_badge_normal:0 "Норма"
 RUS_bunker_food_badge_offline:0 "§RНет доступа§!"
 RUS_bunker_priority_integrity:0 "§RСводы дают штрафы.§!\nЗакажите укрепление галерей."
 RUS_bunker_priority_hungry:0 "§RГолод даёт штрафы.§!\nПодвезите продовольствие."
 RUS_bunker_priority_food:0 "§YСклад расходуется.§!\nУвеличьте приток или закажите обоз."
 RUS_bunker_priority_busy:0 "§YБригада работает.§!\nЗаказ и срок - в решениях ниже."
 RUS_bunker_priority_excavate:0 "§YНачните с проходки.§!\nЗатем выберите помещение."
 RUS_bunker_priority_power:0 "§YМощность занята.§!\nДля новых подключений нужен резерв."
 RUS_bunker_priority_fit:0 "§YЕсть пустые этажи.§!\nВыберите этаж и помещение под разрезом."
