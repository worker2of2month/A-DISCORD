 RUS_suspicion_ration_aid:0 "Отправить пайки в голодные приграничья"
 RUS_suspicion_ration_aid_desc:0 "Подземные склады отдадут часть пайков голодающим посёлкам по ту сторону границы. Трудно звать к войне против тех, кто кормит твоих людей."
 RUS_suspicion_ration_aid_cost:0 "§Y30§! £supply_texticon"
 RUS_suspicion_ration_aid_cost_blocked:0 "§R30§! £supply_texticon"
 RUS_suspicion_ration_aid_cost_tooltip:0 "Нужно 30 £supply_texticon из запасов бункера."
 RUS_suspicion_border_bribes:0 "Купить молчание пограничных постов"
 RUS_suspicion_border_bribes_desc:0 "Казна щедро заплатит чужим писарям, начальникам застав и купцам, которые носят донесения в соседние штабы. Деньги не меняют чужих планов, но надолго задерживают тревожные сводки."
 RUS_suspicion_border_bribes_cost:0 "§Y200§! £ADISCORD_economy_treasury_texticon"
 RUS_suspicion_border_bribes_cost_blocked:0 "§R200§! £ADISCORD_economy_treasury_texticon"
 RUS_suspicion_border_bribes_cost_tooltip:0 "Нужно 200 £ADISCORD_economy_treasury_texticon."
 RUS_suspicion_press_tour:0 "Провести пресс-тур по мирным мастерским"
 RUS_suspicion_press_tour_desc:0 "Бюро иностранной печати повезёт корреспондентов по турбинным залам, школам и мастерским, а учёные ответят на вопросы о реакторе так, чтобы ответы звучали скучно."
 RUS_suspicion_press_tour_cost:0 "§Y50§! £ADISCORD_economy_treasury_texticon"
 RUS_suspicion_press_tour_cost_blocked:0 "§R50§! £ADISCORD_economy_treasury_texticon"
 RUS_suspicion_press_tour_cost_tooltip:0 "Нужно 50 £ADISCORD_economy_treasury_texticon."
 RUS_suspicion_reactor_camouflage:0 "Скрыть работы у реактора"
 RUS_suspicion_reactor_camouflage_desc:0 "Караулы Чёрной армии переведут работы в ночные смены, закроют площадки маскировочными сетями и разведут колонны по дальним дорогам. Караулам нужны пайки, а сетям - деньги."
 RUS_suspicion_reactor_camouflage_cost:0 "§Y40§! £supply_texticon  §Y50§! £ADISCORD_economy_treasury_texticon"
 RUS_suspicion_reactor_camouflage_cost_blocked:0 "§R40§! £supply_texticon  §R50§! £ADISCORD_economy_treasury_texticon"
 RUS_suspicion_reactor_camouflage_cost_tooltip:0 "Нужно 40 £supply_texticon из запасов бункера и 50 £ADISCORD_economy_treasury_texticon."
 RUS_suspicion_border_commission:0 "Созвать пограничную комиссию"
 RUS_suspicion_border_commission_desc:0 "По грамоте добрососедства соседские офицеры вместе с ханскими писарями объедут заставы, сверят карты и пообедают в гарнизонах за счёт Хана."
 RUS_suspicion_border_commission_cost:0 "§Y20§! £supply_texticon  §Y65§! £ADISCORD_economy_treasury_texticon"
 RUS_suspicion_border_commission_cost_blocked:0 "§R20§! £supply_texticon  §R65§! £ADISCORD_economy_treasury_texticon"
 RUS_suspicion_border_commission_cost_tooltip:0 "Нужно 20 £supply_texticon из запасов бункера и 65 £ADISCORD_economy_treasury_texticon."
 RUS_shadow_rifles:0 "Перекупить оружие с чужих складов"
 RUS_shadow_rifles_desc:0 "Интенданты соседних застав продают списанные винтовки и запчасти за наличные, если покупатель не спрашивает накладных. Сделка быстрая, но каждый ящик на чужом складе кто-то пересчитает заново."
 RUS_shadow_rifles_cost:0 "§Y35§! £ADISCORD_economy_treasury_texticon"
 RUS_shadow_rifles_cost_blocked:0 "§R35§! £ADISCORD_economy_treasury_texticon"
 RUS_shadow_rifles_cost_tooltip:0 "Нужно 35 £ADISCORD_economy_treasury_texticon."
 RUS_shadow_rifles_room_tt:0 "Подозрение соседей ниже §Y92§! £RUS_suspicion_texticon: после сделки оно останется ниже §Y100§! £RUS_suspicion_texticon."
 RUS_shadow_designs:0 "Выкрасть чертежи соседей"
 RUS_shadow_designs_desc:0 "Свои люди в соседних мастерских перепишут чертежи затворов и лафетов за одну ночь."
 RUS_shadow_designs_cost:0 "§Y15§! £political_power_texticon"
 RUS_shadow_designs_cost_blocked:0 "§R15§! £political_power_texticon"
