 RUS_suspicion_disperse_musters:0 "Рассредоточить армейские сборы"
 RUS_suspicion_disperse_musters_desc:0 "Сборные пункты у реакторного периметра слишком заметны. Чёрная армия распустит часть резервистов по домам и перенесёт учения в дальние аймаки, оставив у реактора обычные караулы."
 RUS_suspicion_disperse_musters_cost:0 "§Y15§! £supply_texticon  §Y500§! £manpower_texticon"
