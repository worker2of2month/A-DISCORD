# --- rus_country_content ---
 RUS_crisis_laser_countdown: "Программа \"Последнее небо\""
 RUS_crisis_laser_countdown_desc: "В реакторных залах нарастает гул. Операторы сверяют расчёты орбитального удара, пока за бетонными стенами идёт война."
 ADISCORD_rus_crisis.10.t: "Небо останется тёмным"
 ADISCORD_rus_crisis.10.d: "Последовательность запуска сорвана. Реакторный периметр больше не связан со спутником, а приказы, которые должны были довести отсчёт до конца, некому исполнять. Инженеры доложили, что восстановить расчёт уже нельзя: даже если зоны снова займут, спутник не примет прежнюю команду.\n\nГорода спасены от удара. Судьба Последней империи этим не решена."
 ADISCORD_rus_crisis.10.disconnected.d:0 "Марк Рустан сам приказал отсоединить оружейный канал. Глеб Корнеев выполнил распоряжение при свидетелях и вслух прочитал журнал отключения, строку за строкой. Спутник перестал отвечать на служебной частоте. Реактор продолжает давать ток мастерским и посёлкам.\n\nПочему Хан передумал, в бункере не знает никто. Савва Ключарёв записал в книгу только дату и время. Восстановить последовательность уже нельзя: прежний код уничтожен, а расчёты возвратного импульса сожгли в той же печи, где жгли старые бланки."
 ADISCORD_rus_crisis.10.a: "Удар отменён."
 ADISCORD_rus_crisis.15.t: "Девяносто дней до удара"
 ADISCORD_rus_crisis.15.d: "Первые армии, выступившие против Хана, не остановили его программу. Посланник коалиции привёз в нашу столицу карту с кругами поражения, начерченными вокруг наших городов, и ничего не стал к ней добавлять. До орбитального удара осталось девяносто дней.\n\nПравительства, ведущие войну с империей, просят нас выступить немедленно. Штаб считает дороги до реактора, казначейство - цену похода. Если реактор проработает до конца срока, нейтралитет не защитит ни одной из этих улиц."
 ADISCORD_rus_crisis.15.a: "Выступить против Хана."
 ADISCORD_rus_crisis.15.b: "Остаться в стороне."
 RUS_crisis_second_wave_join_tt: "Вступим в войну против Хана вместе со своими союзниками и зависимыми странами. Если первая волна вмешательства уже разгромлена, война начнётся заново. Срок удара не изменится."
 RUS_crisis_second_wave_stay_tt: "Не вступаем в войну. Пока продолжается война коалиции с Ханом, мы сможем отправлять добровольцев на облегчённых условиях."
 ADISCORD_rus_crisis.16.t: "Вторая волна"
 ADISCORD_rus_crisis.16.d: "[FROM.GetNameDefCap] вступает в войну против империи. До завершения программы осталось девяносто дней, и новые армии выходят к реакторному периметру, пока часы ещё идут.\n\nТагир Мансуров перенёс на карту новые стрелы и передвинул флажок последнего резерва ближе к входу в бункер."
 ADISCORD_rus_crisis.16.a: "Держать периметр."
 ADISCORD_rus_crisis.17.t: "Чужие глаза над степью"
 ADISCORD_rus_crisis.17.rumours.d: "В столицах соседей о реакторе говорят всё чаще. Купцы пересказывают слухи о ночных эшелонах, монтарские газеты печатают карты реакторного пояса, а в Тимерской палате спрашивают, зачем Хану столько инженеров.\n\nРазговоры стали доказательством, когда в одном из посольств всплыла копия ханской ведомости. Чужая печать на сопроводительном письме показывает, что бумага прошла через несколько рук, прежде чем попасть к дипломатам. Вслед за письмом к границе выехала смешанная комиссия соседей. Она ждёт у заставы и пока просит, а не требует.\n\nВ ставке у каждого свой ответ. Глеб Корнеев готов провести проверяющих по турбинам и лабораториям. Интенданты берутся за ночь спрятать работы под землю. Казначейство считает, во что обойдётся расположение комиссии. Чёрная армия хочет просто не пустить её дальше застав."
 ADISCORD_rus_crisis.17.observers.d: "Монтарская империя отправила к нашим границам наблюдателей, а её союзники обмениваются донесениями о каждом эшелоне, идущем к реактору. Штабы соседей уже составляют планы похода. Если их подготовка закончится раньше нашей, войну начнут они.\n\nНа этот раз комиссия приехала с полномочиями и письмом: от Хана требуют объяснить движение военных грузов и допустить представителей к гражданским объектам. Заверений через посольство ей мало. Наблюдатели продолжат считать эшелоны, что бы им ни ответили.\n\nТагир Мансуров доложил, что гости третий час ждут у ворот и записывают номера проезжающих машин. Корнеев снова предлагает показать гражданские цеха. Интенданты хотят спрятать всё лишнее, казначейство - заплатить, а Чёрная армия требует выставить комиссию за границу."
 ADISCORD_rus_crisis.17.truth:0 "Показать комиссии часть правды."
 ADISCORD_rus_crisis.17.hide:0 "Спрятать работы до её приезда."
 ADISCORD_rus_crisis.17.bribe:0 "Купить расположение комиссии."
 ADISCORD_rus_crisis.17.expel:0 "Закрыть перед комиссией ворота."
 ADISCORD_rus_crisis.18.murmur.t: "Ропот в окопах"
 ADISCORD_rus_crisis.18.murmur.d: "Сотники доносят одно и то же: бойцы Чёрной армии больше не верят сводкам. Пайки урезаны, раненых везут в тыл по три дня, а о потерянных аймаках говорят у каждого костра. Пока это только разговоры, но офицеры уже не останавливают их.\n\nОдин сотник приложил к рапорту сухарь из последней выдачи - без объяснений. Интенданты уверяют, что резервы ещё есть. Сотник просит не резервы, а ответ, который можно будет прочитать вслух у костра."
 ADISCORD_rus_crisis.18.desertion.t: "Пустые окопы"
 ADISCORD_rus_crisis.18.desertion.d: "По ночам целые десятки уходят с позиций в родные аймаки. Ополченцы бросают винтовки у переправ, а сотники перестали отправлять в ставку списки пропавших. Чёрная армия требует права судить беглецов на месте.\n\nТагир Мансуров положил перед Ханом последний полный список, присланный с фронта. Половина фамилий в нём совпала с переписью тех аймаков, откуда приходили жалобы на сбор. Люди уходили не к врагу, а домой, к посевной, о которой им обещали подумать после отправки обоза."
 ADISCORD_rus_crisis.18.conspiracy.t: "Заговор в ставке"
 ADISCORD_rus_crisis.18.conspiracy.d: "Охрана перехватила записку без подписи: несколько командиров обсуждают, кто примет печать, если Хан не доживёт до весны. Имена не названы, но почерк знаком. Армия больше не уверена, что Хан выведет её из этой войны.\n\nРустан узнал почерк раньше, чем Мансуров успел назвать подозреваемых, но не сказал, чей он. Записку убрали в папку с донесениями, а не в дело следствия. Если ничего не изменится, следующего предупреждения не будет."
 ADISCORD_rus_crisis.18.rations: "Выдать фронту двойной паёк."
 ADISCORD_rus_crisis.18.endure: "Пусть терпят."
 ADISCORD_rus_crisis.18.barriers: "Поставить заградительные посты."
 ADISCORD_rus_crisis.18.release: "Отпустить ополченцев по домам."
 ADISCORD_rus_crisis.18.purge: "Вычистить ставку."
 ADISCORD_rus_crisis.18.yield: "Отдать армии командование."
 ADISCORD_rus_crisis.20.t: "Смерть Хана"
 ADISCORD_rus_crisis.20.d: "Из-за линии фронта пришла весть, которую сначала приняли за уловку: Марк Рустан мёртв. Одни донесения говорят о выстреле в ставке, другие - о яде в походной кухне. Кто бы ни отдал приказ, Чёрная армия больше не служит общей державе.\n\nАймаки отзывают свои сотни, гарнизоны сдают крепости без боя, а реакторный периметр остаётся без хозяина. Последняя империя распадается на самостоятельные владения так же быстро, как была собрана."
 ADISCORD_rus_crisis.20.a: "Империя пережила своего Хана ненадолго."
 RUS_suspicion_warning_tt: "Подозрение соседей: §Y[?RUS_suspicion|0]§!/100 £RUS_suspicion_texticon. При §Y100§! £RUS_suspicion_texticon коалиция нападёт без 90-дневного сбора."
 ADISCORD_rus_crisis.1.exposed.d: "Разведывательные донесения больше не нужно сводить: доказательства лежат на столах всех штабов. Утечка из ханских ведомостей дошла до газет раньше, чем до дипломатов. Хан собирает орбитальную систему, питаемую реактором, и в списках его целей стоят промышленные районы, узлы связи и столицы.\n\nВремени на подготовку не осталось. Монтарская империя, Вальдский союз, Тимерская палата и Свободная республика Байринж выступают немедленно; к ним могут присоединиться независимые победители юга и запада и гегемон востока, завершившие свои войны. Хан, застигнутый раньше срока, провозглашает свою державу открыто.\n\nВ штабах больше не спорят, верить ли донесениям. Спорят о том, чьи армии первыми дойдут до реакторного периметра."
 ADISCORD_rus_crisis.2.exposed.d: "В эфире передавали выдержки из закрытого приказа Хана. Разведка соседей добралась до программы раньше её публичного объявления. Тагир Мансуров сообщил о выступлении чужих армий. Рустан приказал установить связь со спутником.\n\nГлеб Корнеев не вводил код. Он ещё раз объяснил, что последний удар придётся по самому реактору. Разрушение не остановится у столиц и заводов: расчёт не даёт безопасной границы, катастрофа может охватить весь мир. Укрытия не гарантируют спасения. Хан велел говорить дальше.\n\nКорнеев предложил отсоединить оружейный канал и оставить реактор для снабжения. Связь со спутником ещё можно не устанавливать. Люди уже строят дома, возвращаются к станкам и просят открыть школы. Для этого система им не нужна.\n\nРустан спросил, сколько времени пройдёт, прежде чем новые хозяева заводов соберут новые армии. Инженер ответил, что не умеет считать чужие решения. Он умеет отключить этот передатчик.\n\nХан посмотрел на тёмный экран. Ему предлагали оставить людям возможность снова устроить мир без его разрешения. Он приказал ввести код. Корнеев повторил предупреждение о масштабе удара. Рустан дождался конца и повторил приказ. Инженер ввёл код теми же пальцами, которыми когда-то чертил проход для носилок. На экране появилось подтверждение приёма."
 RUS_crisis_exposed_warning_tt: "Коалиция выступает §Yнемедленно§!. Орбитальный удар последует через §Y455 дней§! с раскрытия программы, если Хан сохранит власть и доступ к реактору."
 RUS_crisis_programme_hold_tt:0 "Удержание хотя бы одной из §Y4§! доступных реакторных зон сохраняет программу; потеря всего периметра срывает её навсегда."
 RUS_crisis_war_rules_tt:0 "Срок удара не меняется. Захват всего реакторного периметра сорвёт программу, но войну завершит только военный исход: падение Хана рассыплет империю на самостоятельные владения, а разгром всех участников вмешательства присоединит их земли к империи."
 RUS_crisis_programme_closed_tt:0 "Орбитальный запуск отменён окончательно. Отсчёт не возобновится, даже если реактор снова окажется в руках прежних хозяев."
 RUS_crisis_strike_cancelled_tt:0 "Орбитальный удар отменён навсегда; повторное занятие реакторных зон не восстановит программу. Начатая война с коалицией продолжается до военного исхода."
 RUS_crisis_envoy_refused_tt:0 "Орбитальная программа продолжается. Коалиция выступит по окончании подготовки."
 RUS_crisis_disconnect_preparation_tt:0 "§RОрбитальный удар будет отменён навсегда.§! Реактор останется источником энергии, а коалиция откажется от похода на империю."
 RUS_crisis_disconnect_war_tt:0 "§RОрбитальный удар будет отменён навсегда.§! Реактор останется источником энергии. Начатая война с коалицией продолжится до военного исхода; если вмешательство ещё не началось, коалиция откажется от похода."
 RUS_crisis_strike_caption: "\"Теперь я стал Смертью, разрушителем миров\".\n- Роберт Оппенгеймер, цитируя \"Бхагавадгиту\""
 RUS_crisis_close_superevent: "Закрыть"
 RUS_crisis_epilogue_caption: "ПОСЛЕДНЕЕ НЕБО\nЛуч направлен в сердце реактора."
 RUS_crisis_watch_epilogue: "Эпилог"
 RUS_crisis_epilogue_next: "Далее"
 RUS_crisis_epilogue_finish: "Завершить чтение"
 RUS_crisis_epilogue_2_title: "ПОСЛЕДНИЙ ПРИКАЗ"
 RUS_crisis_epilogue_2_body: "Луч вошёл в реактор, и на несколько мгновений исчезли тени. Затем ударная волна прошла через корпуса, улицы и укрытия. Там, где только что работали люди, остались раскалённые обломки. Над комплексом поднялся чёрный столб с белым светом внутри.\n\nВ городах гасли окна. На последних частотах просили о помощи, повторяли адреса, называли имена. Голоса обрывались посреди слова. Пепел оседал на воде и хлебе; его приносили в убежища на одежде и волосах. Люди, которым удалось спастись от огня, ещё не знали, что опасность уже была с ними.\n\nКатастрофа унесла миллиарды жизней. Одни погибли в огне и под обломками, другие не пережили последовавшие голод, болезни и холод. Считать потери было уже некому."
 RUS_crisis_epilogue_3_title: "НАСЛЕДСТВО ВОРКСА"
 RUS_crisis_epilogue_3_body: "Реактор нулевой точки когда-то изобрёл Дориан Воркс. В его чертежах была заключена сила, которой хватало для городов, заводов и машин. Теперь эти листы лежали под обломками, а имя изобретателя осталось на табличках у мёртвых пультов.\n\nВзрыв реактора породил мощный электромагнитный импульс. Далеко за пределами огня погасли приборы, оборвалась связь, остановилось оборудование. Люди в уцелевших убежищах крутили ручки приёмников и меняли батареи. Некоторые ещё слышали чужие голоса. Большинство слышало только треск.\n\nПервые спасшиеся выходили наружу с фонарями. Они искали входы в заваленные подвалы и звали тех, кто не успел подняться. К утру фонари начали гаснуть."
 RUS_crisis_epilogue_4_title: "МИР БЕЗ СТОЛИЦ"
 RUS_crisis_epilogue_4_body: "Стеландер и Кефрейт ещё передавали приказы. На западе и юге закрывали границы, обещали помощь и требовали ждать. Поезда не пришли. За колоннами беженцев тянулись пустые дороги; впереди стояли солдаты, которым уже нечем было кормить свои семьи.\n\nГосударства умирали по частям: сначала дальние гарнизоны, потом города, затем столицы. У колодцев появились вооружённые хозяева. За чашку воды отдавали инструменты, землю, свободу. Детям запрещали подходить к незнакомым людям. Старые карты жгли в печах. Ни одна граница больше никого не защищала."
 RUS_crisis_epilogue_5_title: "ЗЕМЛЯ И ПРИСЯГА"
 RUS_crisis_epilogue_5_body: "На месте больших государств установилась феодальная раздробленность. Бывший командир удерживал мост, хозяин зернохранилища собирал дань с деревень, гарнизон убежища объявлял своей всю землю до соседнего холма. За право жить у колодца требовали урожай, работу и сыновей в дружину.\n\nОбещания защиты записывали на обороте старых приказов. Клятвы приносили людям, у которых оставались оружие и запасы. Их дети наследовали ключи от складов вместе с властью над теми, кто приходил просить хлеба.\n\nПо вечерам в поселениях считали вернувшихся с полей. Потом закрывали ворота. За ними лежала дорога, по которой когда-то можно было проехать через целую страну."
 RUS_crisis_epilogue_6_title: "ПОСЛЕДНИЙ БУНКЕР"
 RUS_crisis_epilogue_6_body: "Под землёй Хан слушал вентиляцию. Генераторы работали, часовые сменяли друг друга. После удара двери не открывали. Даже когда снаружи стучали. Со временем стук прекратился.[GetRUSCrisisEpilogueScience][GetRUSCrisisEpilogueArmy]\n\nНа карте уцелело одно государство. Его пределами стали бетон, сталь и запас воздуха. Радист вызывал столицы по старому списку. После каждого названия он ждал ответа. Хан приказал не сокращать паузы."
 RUS_crisis_epilogue_7_title: "ПОСЛЕДНЯЯ ЧАСТОТА"
 RUS_crisis_epilogue_7_body: "Передатчик получал питание даже тогда, когда в жилых отсеках сокращали свет. Каждый сеанс начинался одинаково: позывной, приказ подтвердить приём, длинная пауза.[GetRUSCrisisEpilogueDistricts]\n\nОднажды сквозь помехи донёсся человеческий голос. Он просил лекарств и объяснял, где искать переправу. Радист спросил, кто командует округом. Незнакомец не понял вопроса. Связь пропала прежде, чем удалось узнать его имя.\n\nВ журнал внесли: контакт не установлен. Хану подали список молчащих столиц. Он задержал палец на одной строке и велел вызвать снова. Наверху уже передавали другие названия."
 RUS_crisis_epilogue_8_title: "СИГНАЛ ПОТЕРЯН"
 RUS_crisis_epilogue_8_body: "Хан жив.\nЗа гермодверями - анархия, голод и пепел. Последняя империя погребена под землёй.\n\nПередатчик продолжает работать.\nОтвета не будет.\n\nEsc - открыть меню игры."
 RUS_crisis_regional_wars_available_tt: "Заключительный эпилог ещё не наступил."
 ADISCORD_rus_campaign.11.active_project: "На стол Рустана положили схему реакторного комплекса. На полях оставались исправления: перенесённый кабель, запасной генератор, участок дороги, по которому больше нельзя было провести колонну. За каждой пометкой стояли люди, продолжавшие работу под угрозой наступления.\n\nИнженеры доложили о готовности системы наведения. Штаб подтвердил размещение гарнизонов. Никто не обещал, что периметр выдержит, но каждый знал, что должен удерживать. Реактор продолжал заряжать орбитальную систему; последний луч должен был вернуться в его собственное ядро. До назначенного срока ещё оставалось время.\n\nХан подписал приказ. За дверью спорили о ремонте моста и выдаче продовольствия рабочим. Эти распоряжения тоже требовали его подписи. Рустан велел продолжать снабжение до последнего дня. После этого дня, по его расчётам, единой империи уже не понадобится ни мост, ни канцелярия."
 ADISCORD_rus_campaign.11.active_project.a: "Продолжать подготовку удара."
 RUS_crisis_programme_focus_available_tt: "Орбитальная программа действует: Хан у власти и удерживает хотя бы одну реакторную зону."
 RUS_crisis_reactor_guard: "Караул последнего неба"
 RUS_crisis_reactor_guard_desc: "Гарнизоны удерживают позиции и экономят снабжение до завершения орбитальной программы. Разгром интервентов не отменяет караул; отключение лазера или падение Хана снимает его задачи."
 RUS_crisis_volunteer_mandate: "Добровольцы против Хана"
 RUS_crisis_volunteer_mandate_desc: "Правительство не вступило в войну с Ханом, но разрешает добровольцам отправляться к реакторному периметру. Ограничения на отправку ослаблены, пока идёт война коалиции."
 ADISCORD_rus_last_sky_plan: "Оборона орбитальной программы"
 RUS_crisis_launch_clock_active: "До орбитального удара: §Y[?RUS.days_mission_timeout@RUS_crisis_laser_countdown|0]§! дн."
 RUS_crisis_launch_clock_inactive: "Отсчёт запуска не идёт."
 RUS_reactor_sortie_equipment_full:0 "40"
 RUS_reactor_sortie_equipment_decontaminated:0 "20"
 RUS_hazard_brigades_2_tt:0 "В столице появятся §Y2 бригады РХБ§! по §Y3 батальона§! с полными людьми и оснащением. Шаблон доступен для обычного набора; его состав закреплён."
 RUS_hazard_brigades_1_tt:0 "В столице появится ещё §Y1 бригада РХБ§! из §Y3 батальонов§! с полными людьми и оснащением."
 RUS_reactor_sortie_slot_free_tt:0 "Предыдущая реакторная вылазка завершена."
 RUS_bunker_protection_research:0 "Прикладная РХБ-защита"
 RUS_campaign_broadcast_required_tt:0 "Для запуска обращения нужно свободное место кампании. Первое место открывает фокус \"$RUS_khan_broadcast_service$\"."

 # Государственная служба, развитие войск и авиация.
 RUS_permanent_government:0 "Постоянная канцелярия"
 RUS_permanent_government_desc:0 "Просители возвращаются к закрытым дверям: писец уехал со старшиной, смету забрали в штаб, за выданный аванс некому расписаться. Канцелярия получит постоянных служащих, общую расходную книгу и часы приёма. Дело останется здесь даже после отъезда человека, который его начал."
 RUS_district_representation:0 "Представительство округов"
 RUS_district_representation_desc:0 "За столом совета найдётся место людям, которые отвечают за воду, жильё и мастерские. Их право докладывать Хану ограничит власть местных покровителей и сделает решения совета понятнее округам."
 RUS_civil_construction_board:0 "Гражданское строительство"
 RUS_civil_construction_board_desc:0 "Совет сведёт заказы на фабрики в общую очередь. Инженеры смогут использовать одни чертежи, перевозить бригады между площадками и готовить следующий фундамент до завершения текущей стройки."
 RUS_trained_administrators_tt:0 "Подготовка чиновников даёт 35 очков государственного развития вместо 25. Работающий архив аймаков добавляет ещё 15 очков при оплате программы."
 RUS_trained_administrators:0 "Подготовка управленцев"
 RUS_trained_administrators_desc:0 "Совет откроет постоянные курсы для окружных управлений. В архиве бункера хранятся земельные дела и старые сметы: на них будущие чиновники научатся проверять документ, прежде чем ставить печать."
 RUS_military_governors:0 "Военные губернаторы"
 RUS_military_governors_desc:0 "Командующий округом получит ясный мобилизационный план и обязанность согласовать его с местной администрацией. Сбор людей перестанет зависеть от того, какой приказ первым дошёл до старшины."
 RUS_military_contract_board:0 "Заказы военного ведомства"
 RUS_military_contract_board_desc:0 "Штаб объединит небольшие заказы полков в устойчивую производственную программу. Заводы смогут держать одну серию дольше, а приёмщики будут отвечать за поставки всей армии."
 RUS_command_accountability_synergy_tt:0 "Работающий зал последнего приказа дополнительно даёт §G+3%§! скорости планирования. Усиление действует и при последующей постройке зала."
 RUS_command_accountability:0 "Ответственность командования"
 RUS_command_accountability_desc:0 "Военная власть требует ответа за людей и имущество. Хан установит порядок разбора приказов: командир получит свободу действовать, но уже не сможет объяснить потери тем, что соседнее ведомство промолчало."
 RUS_staff_college:0 "Подготовка штабистов"
 RUS_staff_college_desc:0 "Сотнику недостаточно знать собственную сотню. Курсы научат штабистов сводить донесения, оценивать готовность соседей и заранее распределять задачи между частями."
 RUS_integrated_signals_synergy_tt:0 "Работающий узел связи дополнительно даёт §G+1§! п.п. вероятности вступления резервов в бой. Усиление действует и при последующей постройке узла."
 RUS_integrated_signals:0 "Единая связь частей"
 RUS_integrated_signals_desc:0 "Каждая часть получит одинаковые таблицы позывных и время передачи донесений. Подземный узел связи сможет направлять резервы по общей картине боя, если его включить в новую сеть."
 RUS_field_hospitals:0 "Возвращение раненых"
 RUS_field_hospitals_desc:0 "Свяжем перевязочные посты, вывоз раненых и восстановление после госпиталя в одну службу. Ей передадут оснащение и подготовят медиков."
 RUS_field_hospitals_synergy_tt:0 "Работающий хирургический ярус дополнительно возвращает §G5%§! боевых потерь в людской резерв. Усиление действует и при последующей постройке яруса."
 RUS_serial_ordnance_orders_synergy_tt:0 "Работающий подземный арсенал дополнительно даёт §G+3%§! выпуска военных заводов. Усиление действует и при последующей постройке арсенала."
 RUS_serial_ordnance_orders:0 "Серийные заказы"
 RUS_serial_ordnance_orders_desc:0 "Приёмка утвердит длинные серии вместо постоянной смены образцов. Подземный арсенал получит общие допуски и сможет передавать наземным заводам готовый инструмент."
 RUS_armoured_trial_company:0 "Испытательная бронерота"
 RUS_armoured_trial_company_desc:0 "Инструкторы соберут небольшую учебную группу для испытания шасси и тактики бронетехники. Её задача - выбрать пригодные машины до того, как страна оплатит оснащение целых соединений."
 RUS_armoured_repair_service:0 "Ремонтная служба войск"
 RUS_armoured_repair_service_desc:0 "Повреждённую машину нельзя бросать из-за одной детали. Мобильные мастерские идут вслед за колоннами, а эвакуационные команды ищут уцелевшую технику на поле боя."
 RUS_airfield_capacity_tt:0 "В столичном регионе [66.GetName] остаётся место для двух уровней аэродрома."
 RUS_flight_school:0 "Лётная школа Хана"
 RUS_flight_school_desc:0 "Уцелевшие самолёты бесполезны без людей, которые умеют возвращать их на полосу. Соберём инструкторов, введём учебный журнал и разберём каждую аварию прежде, чем она повторится."
 RUS_capital_airfields:0 "Аэродромы столичного округа"
 RUS_capital_airfields_desc:0 "Расчистим запасные полосы, восстановим подъездные дороги и оборудуем стоянки. Первые эскадрильи должны получить место для работы ещё до начала похода."
 RUS_fighter_cover:0 "Истребительное прикрытие"
 RUS_fighter_cover_desc:0 "Мастерские подготовят первую партию истребителей, а школа выделит пилотов для дежурных звеньев. Их задача - прикрывать столицу, переправы и войска от чужой авиации."
 RUS_assault_squadrons:0 "Штурмовые эскадрильи"
 RUS_assault_squadrons_desc:0 "Соберём самолёты непосредственной поддержки и научим экипажи отличать свой передний край от чужого. Наземные командиры впервые смогут рассчитывать на удар с воздуха по указанной цели."
 RUS_aviation_fuel_reserve:0 "Топливо для учебных вылетов"
 RUS_aviation_fuel_reserve_desc:0 "Лётная школа не должна отменять занятия после каждой задержки обоза. Отдельное хранилище и первая поставка топлива обеспечат учебные полёты и дежурство истребителей."
 RUS_aircraft_workshops_synergy_tt:0 "Работающий подземный арсенал дополнительно даёт §G+3%§! скорости роста эффективности производства. Усиление действует и при последующей постройке арсенала."
 RUS_aircraft_workshops:0 "Авиационные мастерские"
 RUS_aircraft_workshops_desc:0 "Самолёт требует одинаково точной работы на земле и в воздухе. Новый военный цех займётся авиационными заказами; инструмент подземного арсенала поможет быстрее наладить серийное производство."
 RUS_air_control_network_synergy_tt:0 "Работающий узел связи дополнительно даёт §G+3%§! эффективности авиационных заданий. Усиление действует и при последующей постройке узла."
 RUS_air_control_network:0 "Посты воздушного наведения"
 RUS_air_control_network_desc:0 "Посты наблюдения будут передавать сведения на аэродромы по общей сети. Узел связи бункера сможет держать сводную карту обстановки и направлять самолёты туда, где они нужны сейчас."
 RUS_air_ground_coordination_synergy_tt:0 "Работающая лаборатория дополнительно снижает вероятность авиационных аварий на §G5%§!. Усиление действует и при последующей постройке лаборатории."
 RUS_air_ground_coordination:0 "Общий план наземного боя"
 RUS_air_ground_coordination_desc:0 "Лётчики и командиры частей будут готовить один план боя. Лаборатория бункера сможет проверять приборы и разбирать отказы, чтобы поддержка не превращалась в опасность для своих."
 RUS_government_service:0 "Государственная служба"
 RUS_government_service_desc:0 "Постоянные ведомства, общий бюджет и правила назначения служащих связывают аймаки со столицей. Выбранный политический курс определяет задачи этой службы.\n\n\n\n\n\n £GFX_RUS_chancery_mandate_banner \n\n\n"
 RUS_government_service_state_tt:0 "Политический курс: §Y[GetRUSGovernmentMandate]§!.[GetRUSGovernmentDepots]"
 RUS_government_mandate_unselected:0 "не выбран"
 RUS_government_depots_active:0 "\nРемонтные депо пояса включены в государственную службу."
 RUS_government_depots_empty:0 ""
 RUS_civil_service_training_bonus_tt:0 "Подготовка управленцев: ещё §G+10§! £ADISCORD_country_development_texticon государственного развития."
 RUS_civil_service_archive_bonus_tt:0 "Архив аймаков: ещё §G+15§! очков государственного развития."
 ADISCORD_rus_campaign.12.t:0 "Дела на общем столе"
 ADISCORD_rus_campaign.12.d:0 "Первое заседание новых управленцев началось с ящика старых дел. Здесь были расписки за несуществовавший мост, две грамоты на один участок и просьба о водяном насосе, которую три года пересылали между округами. Учёные ожидали разговора о приборах. Старшины - о податях. Рустан приказал начать с насоса.\n\nК вечеру ответственный был назван, срок записан, а копии решения отправлены в округ и в архив. Совет ещё не стал единодушным, но теперь спор имел предмет и документ, по которому можно было спросить за исполнение. Старшина из дальнего округа попросил вторую копию для тех, кто собирал деньги на насос. Савва Ключарёв потянулся за чистым листом; прежде просителю просто указывали на дверь."
 ADISCORD_rus_campaign.12.a:0 "Пусть за подписью следует работа."
 ADISCORD_rus_campaign.13.t:0 "Приказ с подписью"
 ADISCORD_rus_campaign.13.d:0 "Командиры пришли с картами, на которых соседние части занимали разные позиции в один и тот же час. В каждом штабе находилось объяснение: поздний гонец, пропавшая ведомость, чужой участок ответственности. Хан выслушал всех и велел положить рядом приказы, выданные перед боем.\n\nНовый порядок не запрещал инициативу. Он требовал назвать, кому передана задача, чем она обеспечена и кто отвечает за её отмену. Военные губернаторы сохраняли власть в своих округах, но их подписи отныне оставались в общей книге командования. Самый молодой командир задержался у книги: в его донесении не сходилось число вернувшихся. Рустан велел дождаться переклички. Пустую строку оставили до утра."
 ADISCORD_rus_campaign.13.a:0 "Полномочия требуют ответа."
 RUS_society_development_reform_tt:0 "Развитие общества: §G+25§! £ADISCORD_country_development_texticon сразу; базовый прирост: §G+2§! £ADISCORD_country_development_texticon/мес. Порог уровня: §Y100§! £ADISCORD_country_development_texticon; излишек сохраняется."
 RUS_social_system_development_reform_tt:0 "Развитие социальной системы: §G+25§! £ADISCORD_country_development_texticon сразу; базовый прирост: §G+2§! £ADISCORD_country_development_texticon/мес. Порог уровня: §Y100§! £ADISCORD_country_development_texticon; излишек сохраняется."
 RUS_army_development_reform_tt:0 "Развитие армии: §G+25§! £ADISCORD_country_development_texticon сразу; базовый прирост: §G+2§! £ADISCORD_country_development_texticon/мес. Порог уровня: §Y100§! £ADISCORD_country_development_texticon; излишек сохраняется."
 RUS_cultural_development_reform_tt:0 "Развитие культуры: §G+25§! £ADISCORD_country_development_texticon сразу; базовый прирост: §G+2§! £ADISCORD_country_development_texticon/мес. Порог уровня: §Y100§! £ADISCORD_country_development_texticon; излишек сохраняется."
 RUS_state_development_reform_tt:0 "Развитие государственного аппарата: §G+25§! £ADISCORD_country_development_texticon сразу; базовый прирост: §G+2§! £ADISCORD_country_development_texticon/мес. Порог уровня: §Y100§! £ADISCORD_country_development_texticon; излишек сохраняется."
 RUS_economic_development_reform_tt:0 "Развитие экономики: §G+25§! £ADISCORD_country_development_texticon сразу; базовый прирост: §G+2§! £ADISCORD_country_development_texticon/мес. Порог уровня: §Y100§! £ADISCORD_country_development_texticon; излишек сохраняется."
 RUS_community_assemblies:0 "Собрания служилых общин"
 RUS_community_assemblies_desc:0 "Старосты собирают жителей на окружные собрания. За общим столом обсуждают заботы, которые не доходят до столичной канцелярии."
 RUS_community_assemblies_ready_tt:0 "Завершён профильный фокус; уровень ниже 5 и прогресс ниже 100."
 RUS_community_assemblies_result_tt:0 "Прогресс развития общества: §G+25§! £ADISCORD_country_development_texticon. Текущий уровень: [?ADISCORD_society_development_level|0]/5; прогресс: [?ADISCORD_society_development_progress|1]/100. Повышение уровня учитывается при ближайшем месячном пересчёте; излишек сохраняется."
 RUS_public_reading_rooms:0 "Окружные читальни"
 RUS_public_reading_rooms_desc:0 "В читальни привозят книги и свежие газеты. По вечерам за освещёнными окнами собираются ученики и рабочие."
 RUS_public_reading_rooms_ready_tt:0 "Завершён профильный фокус; уровень ниже 5 и прогресс ниже 100."
 RUS_public_reading_rooms_result_tt:0 "Прогресс развития культуры: §G+25§! £ADISCORD_country_development_texticon. Текущий уровень: [?ADISCORD_cultural_development_level|0]/5; прогресс: [?ADISCORD_cultural_development_progress|1]/100. Повышение уровня учитывается при ближайшем месячном пересчёте; излишек сохраняется."
 RUS_regimental_training:0 "Полковые учебные сборы"
 RUS_regimental_training_desc:0 "Полковые инструкторы выводят новобранцев на учебный плац. Старые солдаты показывают им, как держать строй и беречь товарища."
 RUS_regimental_training_ready_tt:0 "Завершён профильный фокус; уровень ниже 5 и прогресс ниже 100."
 RUS_regimental_training_result_tt:0 "Прогресс развития армии: §G+25§! £ADISCORD_country_development_texticon. Текущий уровень: [?ADISCORD_army_development_level|0]/5; прогресс: [?ADISCORD_army_development_progress|1]/100. Повышение уровня учитывается при ближайшем месячном пересчёте; излишек сохраняется."
 RUS_bunker_energy_sale:0 "Продать энергию"
 RUS_bunker_energy_sale_desc:0 "Посёлки на поверхности ждут электричества. Монтажники прокладывают линию от бункерных генераторов к первым домам."
 RUS_bunker_energy_contract_free_tt:0 "Нет действующего договора поставки энергии."
 RUS_bunker_energy_sale_cost:0 "§Y1§! £energy_consumption_texticon / 90 дней"
 RUS_bunker_energy_sale_cost_blocked:0 "§R1§! £energy_consumption_texticon / 90 дней"
 RUS_bunker_energy_sale_cost_tooltip:0 "Требуется §Y1§! £energy_consumption_texticon свободной мощности. Мощность резервируется на §Y90 дней§!, затем возвращается бункеру."
 RUS_bunker_energy_sale_result_tt:0 "Сразу: §G+100§! £ADISCORD_economy_treasury_texticon. Свободная мощность: §R-1§! £energy_consumption_texticon на §Y90 дней§!. Действующие помещения продолжают работать."
 RUS_bunker_energy_sale_finish_tt:0 "Поставки завершены. Свободная мощность: §G+1§! £energy_consumption_texticon. Оплата остаётся в казне."
 RUS_bunker_energy_sale_cancel_tt:0 "Поставки сорваны: вернуть §R100§! £ADISCORD_economy_treasury_texticon аванса и освободить §Y1§! £energy_consumption_texticon мощности."

# --- rus_perimeter_story ---
 ADISCORD_rus_campaign.14.t:0 "Ночная смена"
 ADISCORD_rus_campaign.14.d:0 "Телефон на заброшенном пропускном пункте зазвонил после полуночи. Полевой кабель обрывался в канаве, поэтому караульный сперва решил, что звук идёт из соседней комнаты. В трубке попросили открыть ворота ремонтной смене. Голос говорил буднично, устало, словно звонил сюда каждую ночь.\n\nНа рассвете к периметру подошёл грузовик без знаков. У водителя оказались новые фильтры, старый пропуск Воркерланда и точное название поста, стёртое с вывески много лет назад. Увидев чужой караул, он развернулся. Дозорные не стали преследовать машину за предупредительными столбами.\n\nХану передали телефон и донесение. Связист нашёл внутри отдельный приёмник: кто-то сохранил связь там, где официально не осталось ничего живого. На обороте пропуска водитель успел оставить отпечаток мокрого пальца. Рядом читалось название службы: периметр \"Мёртвая зона\". Рустан велел нанести пост на карту. Ночью телефон снова зазвонил, уже в его канцелярии."
 ADISCORD_rus_campaign.14.a:0 "Запишите каждое слово."
 ADISCORD_rus_campaign.15.t:0 "Две накладные"
 ADISCORD_rus_campaign.15.d:0 "Посредник пришёл предлагать следующую поставку. Он разложил образцы патронов и объяснил, что заказы с переправы и с соседнего берега должны идти отдельно. Если свести их в один обоз, прежней цены не будет. Начальник снабжения спросил, почему за общую дорогу надо платить больше. Посредник ответил, что таково условие склада.\n\nПисец принёс две накладные, купленные у западной границы. Одну выписали защитникам переправы, другую - людям, которые третью зиму пытались её сжечь. Номера ящиков шли подряд. Посредник узнал почерк и убрал со стола один из образцов.\n\n- Они платят за товар, - сказал он. - Кому его выдавать, решаю не я.\nХан попросил назвать того, кто решает. Посредник назвал воркерландский склад. Писец показал расчёт: патроны, лекарства и детали уходили обеим сторонам, но запасы не позволяли ни одной закончить войну. После попыток договориться поставки возобновлялись.\n\nВ последнем распоряжении склада стояло: \"Не допускать устойчивого объединения маршрутов\". Ниже были оплачены похороны проводника, собиравшего общую экспедицию к реактору. Посредник сказал, что к похоронам отношения не имел.\n\nРустан оставил у себя образцы и адрес склада. На новую цену он не согласился. Посредник у дверей ещё раз напомнил, что без отдельных заказов поставки могут прекратиться. Начальник снабжения смотрел на патроны: его караулу они тоже были нужны."
 ADISCORD_rus_campaign.15.a:0 "Найдите тех, кто сводил эти счета."
 ADISCORD_rus_campaign.16.t:0 "Имя на чертеже"
 ADISCORD_rus_campaign.16.d:0 "Опись реакторного пояса началась с бумаг заводского архива. На ранних чертежах нулевой точки имя Дориана Воркса стояло рядом с должностью научного руководителя. Он работал учёным Вейранской империи, рассчитывал узлы, спорил с подрядчиками и лично подписывал изменения. Это было его создание.\n\nВ пояснительных записках он обещал энергию городам и производству. На полях экземпляра, оставленного в архиве, шёл другой разговор. Напротив сметы дворцовой подстанции было написано: \"Ещё сто лет света тем же окнам\". Напротив требования ограничить доступ к разработке - длинный перечень монархий и наследственных привилегий. Последняя запись занимала всего одну строку: \"Они купят у будущего электричество, чтобы оно никогда не наступило\".\n\nХан провёл пальцем по фамилии. До сих пор реактор представлялся ему чужой развалиной, оставшейся после чужой ошибки. Теперь у развалины появился создатель, а у создателя - причина ненавидеть тех, кому он служил."
 ADISCORD_rus_campaign.16.a:0 "Сохранить чертежи вместе с пометками."
 ADISCORD_rus_campaign.17.t:0 "По ту сторону породы"
 ADISCORD_rus_campaign.17.d:0 "В дальней галерее рабочие услышали три коротких удара и один длинный. Проходчик ответил рукоятью инструмента. Из породы постучали снова, на этот раз с другой стороны. По плану там не было ни выработки, ни трубы.\n\nИнженер остановил машины и проверил старый служебный кабель, уходивший к западным объектам. По броне действительно могла передаваться вибрация. Объяснение успокоило смену, пока из отключённого переговорного устройства не попросили принести сухую одежду. Голос назвал номер реакторного цеха. В списках эвакуации этот цех значился потерянным.\n\nХан потребовал записать услышанное без пересказов. В протоколе появились время, имена свидетелей и слова человека, которого никто не видел. Последним расписался старый мастер. Он попросил не оставлять в галерее одного дежурного: следующей ночью голос может оказаться знакомым. Рустан разрешил парный пост. Объяснять, чего именно они будут охранять, он не стал."
 ADISCORD_rus_campaign.17.a:0 "Никто не спускается один."
 ADISCORD_rus_campaign.18.t:0 "Подпись под взрывом"
 ADISCORD_rus_campaign.18.d:0 "В ящике технических документов, переданных на хранение в бункер, лежала копия аварийного журнала. Между обычными распоряжениями обнаружился отдельный лист: отключить защиту внешних контуров, вывести выбранные группы специалистов, сохранить глубинный узел. Под ним стояла подпись Дориана Воркса.\n\nЭто не было заключением комиссии, написанным после катастрофы. Приказ предшествовал ей. Запись переговоров подтверждала, что создатель реактора сам тайно руководил его подрывом. Дежурный дважды спрашивал об эвакуации остальных смен. Воркс потребовал продолжать последовательность. После второго вопроса в записи остался только шум.\n\nКопию сопровождала записка о политических последствиях. Гибель комплекса должна была сломать власть монархий Вейранской империи и открыть путь Воркеру. Дориан называл это началом опыта. Хан дочитал лист стоя. На полях журнала кто-то успел записать фамилии людей, оставшихся в цехах. Возле одной фамилии был нарисован маленький дом."
 ADISCORD_rus_campaign.18.a:0 "Эта подпись останется в архиве."
 ADISCORD_rus_campaign.19.t:0 "Экспедиция, которая не вышла"
 ADISCORD_rus_campaign.19.d:0 "Проводник дошёл до стоянки, увидел знаки соседнего поселения на грузовике и положил плату обратно. В одной колонне с этими людьми он не поедет. Командир решил, что старик требует прибавки. Тогда тот достал карту прежней экспедиции. На ней стояли подписи трёх поселений: одни давали машины, другие - продовольствие, третьи знали служебные дороги к реактору.\n\nПеред выходом каждому пришло предупреждение. Первым сообщили, что соседи продадут их охране периметра. Вторым - что машины заминированы. Третьим прислали имена детей, которых якобы уже взяли в заложники. На последнем собрании начали стрелять. Через неделю по той же дороге прошёл ремонтный караван с воркерландскими пропусками.\n\nПроводник сохранил все три письма. На каждом одна буква была отпечатана с одинаковым сколом. Рустан спросил, почему их не сравнили тогда.\n- У меня брат остался у их ворот. Я потом туда только за телом ходил.\n\nХан придвинул письма друг к другу. Старик не спорил, что их обманули. Он спросил, кто объяснит это людям у грузовика: на похоронах они обвиняли его поселение. Командир уже звал следующего проводника. Рустан остановил его и велел позвать водителя.\n\nПока ждали, старик показал на карте место, где дорога уходила за внутреннее кольцо. Туда он ещё мог провести. Вернуть три подписи под общим обещанием оказалось труднее."
 ADISCORD_rus_campaign.19.a:0 "Копии предупреждений раздать командирам."
 ADISCORD_rus_campaign.20.t:0 "Содержать клетку"
 ADISCORD_rus_campaign.20.d:0 "- Это не санитарный устав, - сказала старшая группы обеззараживания и положила перед Ханом найденную инструкцию службы периметра. Первые страницы действительно были обычными: смена фильтров, проверка воды, дозиметрический контроль. Затем начинались запрещённые работы. Не восстанавливать непрерывное питание внутренних линий. Не объединять местные администрации. Не допускать исследовательских групп к глубинному узлу.\n\nПоследнее приложение объясняло, зачем Воркерланд сохранял \"Мёртвую зону\". Под разрушенным комплексом уцелел остаток реактора нулевой точки. Его нельзя было считать погасшим. Служба должна была поддерживать разрыв дорог, связи и власти вокруг него, пропуская только собственные смены по узким коридорам. Большинство постов получало лишь санитарные инструкции; полное назначение периметра знали немногие.\n\nВнизу стояло распоряжение Воркса: сохранять изоляцию даже при потере связи с центром и смене правительства. Отдельной строкой запрещалось разбирать ядро. Хан задержался на приписке карандашом: \"Разрушение оболочки не означает прекращения процесса\". Люди жили возле клетки и считали её развалинами."
 ADISCORD_rus_campaign.20.a:0 "Сначала понять, что удерживают эти стены."
 ADISCORD_rus_campaign.21.t:0 "Спутник без государства"
 ADISCORD_rus_campaign.21.d:0 "При разборе старых схем связи инженер нашёл линию, которая не заканчивалась ни в одном наземном узле. Она уходила к станции сопровождения спутника. В каталоге Воркерланда аппарат значился выведенным из эксплуатации; в закрытом журнале оставались поправки его орбиты и расписание сеансов после официального списания.\n\nНа схеме реакторного комплекса та же линия была обозначена как канал управления Лучом. Орбитальная установка принадлежала старому Воркерланду. Её не уничтожили вместе с наземными сооружениями, а исключили из открытых ведомостей. В одном из расчётов направление передачи энергии было обращено обратно: со спутника в глубинный узел реактора. Последнюю страницу из папки вырезали.\n\nХан вышел из командной комнаты и поднялся к караулу. Небо было ясным. Он спросил, можно ли увидеть аппарат без приборов. Инженер ответил, что для этого нужно знать, куда смотреть. Рустан ещё немного постоял у входа, запрокинув голову. Потом распорядился сохранить расписание и ничего не передавать на найденной частоте."
 ADISCORD_rus_campaign.21.a:0 "Пока только слушать."
 ADISCORD_rus_campaign.22.t:0 "Предел опыта"
 ADISCORD_rus_campaign.22.d:0 "Начальник лаборатории попросил принять его ночью, без секретаря. Он принёс копии закрытых расчётов Дориана Воркса и разложил их по годам. В ранней таблице последствия подрыва ограничивались реакторным комплексом и прилегающими территориями. Поздняя таблица была исписана исправлениями. На месте прежнего предела стояло слово \"не установлен\".\n\nСохранившаяся нулевая точка могла принять внешний импульс. При определённом воздействии энергия не рассеивалась в разрушенной оболочке, а возвращалась в процесс. Воркс отдельно рассматривал удар Луча со старого спутника Воркерланда. Расчёт не давал безопасной границы: разрушение реактора грозило катастрофой мирового масштаба. Под заключением стояло требование исключить любой доступ к запуску.\n\nВ записке к службе периметра Дориан уже не рассуждал о прогрессе. Он требовал находить пропавшие чертежи и задерживать людей, способных прочитать их. Последняя фраза была подчёркнута несколько раз: \"Опыт не должен получить второго автора\". Рустан попросил оставить ему копию. Начальник лаборатории впервые не сразу выполнил приказ."
 ADISCORD_rus_campaign.22.a:0 "Положите её передо мной."
 ADISCORD_rus_campaign.23.t:0 "Передатчик был отключён"
 ADISCORD_rus_campaign.23.d:0 "Связисты свели записи старых частот периметра. Часть голосов оказалась служебной библиотекой: просьбы о помощи, переклички смен, команды эвакуации. Передатчики включали их на дорогах, которые следовало удерживать пустыми. В журнале отмечали, после какой записи проводники отказывались вести людей дальше.\n\nНо одна смена подала жалобу на передачу, которой не было в библиотеке. Женский голос называл охранников по именам и просил не закрывать дверь. Начальник поста приказал отключить установку. Голос продолжал звучать ещё одиннадцать минут. Техник приложил акт снятия питания и отдельно отметил: резервная батарея находилась у него на столе.\n\nХан спросил, нельзя ли было передавать с соседнего поста. Связист ответил, что можно. Тогда Рустан указал на последнюю строку. Один из названных охранников был принят на службу через девять дней после происшествия. В журнале его фамилию сначала зачеркнули, затем вписали снова другим почерком."
 ADISCORD_rus_campaign.23.a:0 "Оставьте обе записи."
 ADISCORD_rus_campaign.24.t:0 "Резерв для следующей власти"
 ADISCORD_rus_campaign.24.d:0 "Мастер литейной пришёл жаловаться на пустые станочные гнёзда: по старым описям в цехах стояло вдвое больше машин. Писцы нашли ведомость законсервированных станков. Оборудование выводили из общего хозяйства небольшими партиями. Вместе с ним исчезали запасы инструмента и личные дела специалистов. Получателем числился технический резерв Дориана Воркса.\n\nК ведомости была подшита записка, составленная ещё до прихода Воркера к власти. Дориан ожидал, что его идеи разрушат снабжение и столкнут между собой учреждения страны. Для каждого предполагаемого кризиса были подготовлены свои люди, склады и вооружённые группы. Воркс собирался выступить, когда власть Воркера потеряет опору, и занять центры управления раньше остальных претендентов.\n\nНа полях стояла фраза: \"Население должно сначала исчерпать доверие к альтернативам\". Рустан перечитал её вслух. В комнате никто не ответил. Человек, подписавший бумагу, собирался дождаться чужого голода с полными складами и предъявить их как доказательство своего права править. Исполнится ли его прогноз, решали уже живые люди за пределами этой папки."
 ADISCORD_rus_campaign.24.a:0 "У его ожидания были склады и гарнизоны."
 ADISCORD_rus_campaign.25.t:0 "Страх неподвижного мира"
 ADISCORD_rus_campaign.25.d:0 "Для училища разобрали собрание старых научных докладов. В закрытом приложении к одному из них Дориан Воркс рассуждал о мире, который научился бесконечно продлевать собственное существование, ничего в себе не меняя. Династии наследуют электростанции, чиновники - запреты, дети - место родителей. Даже бессмертие в таком мире он называл усовершенствованным заключением.\n\nДалее шли заметки о Воркерланде. Падение монархий Вейранской империи, правление Воркера, ожидаемый крах его идей и наступление подготовленной технической власти были перечислены как стадии одного опыта. Дориан боялся, что без толчка история остановится. Право выбрать силу этого толчка он оставлял себе.\n\nХан попросил преподавателя прочитать последнюю страницу. Там Воркс сравнивал людей с поколениями исследователей: одни начинают работу, другие получают результат. Между строк не было места для тех, кто не хотел участвовать. Рустан закрыл папку и долго молчал. Потом спросил, чем отличается от Воркса правитель, решивший, что только его собственный порядок способен дать миру будущее. Преподаватель не стал отвечать за него."
 ADISCORD_rus_campaign.25.a:0 "Пусть этот вопрос останется открытым."

# Campaign briefing
 RUS_startup_region:0 "§YЗЕМЛЯ ХАНА И ЗАПАДНЫЙ ФОРУЛ§!\n\nОбстановка к началу 2160 года.\n\n§YАймаки среди государств§!\nОбщины Земли Хана привыкли сами защищать пастбища, дороги и поселения. Соседние общества также ищут способы удержаться вне единого имперского порядка, но опираются на другие учреждения. Для Рустана общий голос аймаков ещё предстоит превратить в силу, с которой будут считаться за границей.\n\n§YИтора§!\nИтора строит гуманистическое государство защиты. Её политический порядок связывает власть с обязанностью обеспечивать безопасность людей. Рядом с вооружённой самостоятельностью аймаков это другой ответ на ту же потребность: как защитить население, не отдавая его на произвол сильнейшего.\n\n§YРимат и Афрела§!\nРимат держится на торговых домах, префектах и быстрых соглашениях. Афрела связывает ремесло, торговлю и общественный мир с достатком и праздником. Обе страны зависят от работающего обмена; закрытая дорога или военное давление затрагивают саму основу их устойчивости.\n\n§YВоркерландское наследство§!\nНа западном направлении остаются земли, учреждения и инфраструктура прежней имперской системы. Ослабление конфедерации не уничтожает её гарнизоны, старые претензии и последствия войн. Контроль над дорогой, водой и исправными сооружениями здесь может значить больше, чем формальная линия границы."
 RUS_startup_country:0 "§YЗЕМЛЯ ХАНА В 2160 ГОДУ§!\n\n§YУбежище 2130 года§!\nСтарый подземный комплекс строили как убежище. На ранних планах были вентиляционные шахты, резервуары и ряды спальных мест с проходами для носилок. После реакторной катастрофы 2130 года сюда прибывали уцелевшие. В журнале считали людей, воду и исправные фильтры; рядом записывали просьбы узнать о родственниках, на которые с поверхности не приходило ответа.\n\nПосле катастрофы и революции менялись начальники, печати и назначение помещений. Семейные комнаты становились складами, затем караульными. Под новыми номерами оставались закрашенные надписи прежних служб. К ханскому времени комплекс уже нёс следы нескольких порядков, каждый из которых приспосабливал уцелевшее пространство к своим нуждам.\n\n§YАймаки и общий договор§!\nНа поверхности общины сохраняли собственный уклад. Аймаки выбирали старшин, содержали вооружённые отряды и определяли долю урожая для общих амбаров. Их самостоятельность пережила не одну смену границ. Ни подземное убежище, ни власть над столицей сами по себе не отменяли этих местных прав.\n\nМарк Рустан закрепил договор между общинами и столичной властью. Столица обязалась защищать дороги и землю, аймаки - выставлять людей на общий военный сбор. Так местная самостоятельность оказалась связана с властью Хана взаимными обязательствами. Этот порядок давал общинам причину защищать общую землю, но сохранял споры о налогах и затяжные сборы.\n\n§YСтража и хранители бункера§!\nЧёрная армия выросла из сотен, охранявших входы в убежище. Верность Рустану и опыт совместной службы сделали её военной опорой ханской власти. Рядом с солдатами годами работали инженеры, химики и врачи: они поддерживали насосы, фильтры и генераторы, от которых зависела жизнь под землёй. Их знания не давали им соразмерного голоса в делах страны.\n\nДля солдат безопасность означала защищённый вход и надёжный караул; для технических специалистов - работающую вентиляцию, чистую воду и сохранённые знания. Обе службы позволяли убежищу оставаться обитаемым.\n\nОбщий договор не создал единого хозяйственного учёта. Разрозненные закупки кормили посредников, а строителям не хватало инструмента. Грамотный человек был ценен тем, что мог сверить смету, прочитать чертёж и обнаружить подлог. Сохранение старых знаний помогало поддерживать убежище, но не устраняло зависимости от отдельных знающих людей.\n\n§YК началу 2160 года§!\nУ Рустана есть войско и право отдавать приказы о дорогах и границах. Однако столица опирается на договорённости с аймаками, чьи списки жителей не всегда совпадают с общими ведомостями. Подземный комплекс обжит, но изучен не полностью. Земля Хана соединяет старую самостоятельность общин, наследство убежища и личную власть человека, сумевшего связать их одним договором."
