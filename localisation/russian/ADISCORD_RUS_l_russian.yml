 RUS_suspicion_opens_tt:0 "§RПри раскрытии [MON.GetName] и союзники нападут без 90 дней подготовки. Хан будет вынужден провозгласить державу.§!\nУсловия раскрытия (все одновременно):\n- §Y100§! £RUS_suspicion_texticon.\n- Контроль всех доступных земель Грязной зоны, кроме занятых Кефрейтом и его марионетками.\n- Контроль хотя бы одной реакторной зоны.\n- Нет текущих войн.\n\nПервое территориальное приобретение открывает шкалу с §Y10§! £RUS_suspicion_texticon. Подозрение растёт ежемесячно, от реакторных работ, лабораторий и походов."
