 RUS_bunker_reinforce:0 "Укрепить своды"
 RUS_bunker_reinforce_desc:0 "Бригада возвращается в уже пройденные галереи. Новых метров в отчёте не будет: её работа измеряется теми, кто вернётся из следующей смены.\n\nРаботы: 21 дн."
