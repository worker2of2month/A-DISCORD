 RUS_bunker_hunger:0 "Голод в галереях"
 RUS_bunker_hunger_desc:0 "Склады бункера пусты. Смены у насосов получают воду вместо пайка, в караулах засыпают на ногах, а в очередях за хлебом говорят о Хане то, что раньше шептали только о соседях. Пока продовольствие не вернётся, страна работает на последнем дыхании."
