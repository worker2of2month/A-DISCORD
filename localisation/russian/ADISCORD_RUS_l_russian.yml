 RUS_bunker_command_delta:0 "Зал последнего приказа"
 RUS_bunker_command:0 "Слой 5: зал последнего приказа"
 RUS_bunker_command_desc:0 "Отсюда видна вся страна - условными знаками на стене. За каждым знаком остаются живые люди, и теперь любая ошибка на карте тоже принадлежит Хану.\n\nСтроительство: 21 день. Один вариант на слой.\nСодержание: §Y1§! £supply_texticon в неделю.\n\n[GetRUSBunkerForecastcommand]\n\nПосле «Ответственности командования»: ещё +3% скорости планирования."
