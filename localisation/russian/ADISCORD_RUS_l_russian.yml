 RUS_bunker_shelter_desc:0 "Семьи строителей должны жить рядом с тем, что они защищают. В списке жителей впервые появятся не только номера пропусков, но и имена детей.\n\nСтроительство: 21 день. Один вариант на слой.\nСодержание: §Y1§! £supply_texticon в неделю.\n\n[GetRUSBunkerForecastshelter]"
