 RUS_bunker_archive_delta:0 "Архив аймаков"
 RUS_bunker_archive:0 "Слой 5: архив аймаков"
 RUS_bunker_archive_desc:0 "Договоры, переписи и карты будут храниться рядом, а не в сундуках влиятельных семей. Государству нужна память, которой нельзя единолично владеть.\n\nСтроительство: 21 день. Один вариант на слой.\nСодержание: §Y1§! £supply_texticon в неделю.\n\n[GetRUSBunkerForecastarchive]\n\nПосле «Подготовки управленцев» архив добавляет 15 очков государственного развития к каждой оплаченной программе чиновников."
