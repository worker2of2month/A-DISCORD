 RUS_restore_wasteland_refund_tt:0 "При отмене возвращаются §G75§! £political_power_texticon, §G335§! £ADISCORD_economy_treasury_texticon и §G200§! £support_equipment_texticon. Улучшения не выдаются."
 ADISCORD_rus_crisis.24.t:0 "Новые границы на чужих картах"
 ADISCORD_rus_crisis.24.d:0 "Первое донесение с новых рубежей принесли вместе с торговой ведомостью. Купцы уже меняли маршруты, пограничные писари переписывали названия застав, а посольства запрашивали сведения о ханских гарнизонах. Степь перестала быть для соседей неподвижной строкой в старом атласе.\n\nРустан ещё не провозгласил империю. Но за пределами его земель уже обсуждали, сколько людей он может вооружить и куда направит их дальше. Канцелярия может появиться позднее; чужие наблюдатели ждать её открытия не будут.\n\nГлеб Корнеев предлагает не прятать турбины, а показывать их: гражданская энергия объясняет многое. Тагир Мансуров предпочёл бы разогнать сборные пункты по аймакам. Послы просят денег на переговоры. Бесплатным не будет ни одно из этих средств: теперь соседи замечают каждое новое приготовление."
 ADISCORD_rus_crisis.24.a:0 "Пусть соседи видят меньше, чем мы готовим."
 ADISCORD_rus_crisis.17.rumours.t:0 "Утечка из ханских ведомостей"
 ADISCORD_rus_crisis.17.observers.t:0 "Требования соседей"
