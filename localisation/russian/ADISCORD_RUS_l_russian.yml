l_russian:
# --- rus_last_empire_l_russian ---
 RUS_khan:0 "Хан"
 RUS_summon_the_aimaqs: "Собрать аймаки"
 RUS_summon_the_aimaqs_desc: "Вольные аймаки терпят общего представителя только когда чужая армия уже стоит у пастбищ. Ханский стяг поднимают не ради столичной канцелярии, а чтобы соседи поняли, кто будет говорить за степь."
 RUS_arm_the_border_hosts: "Вооружить пограничные сотни"
 RUS_arm_the_border_hosts_desc: "Общины и так держат оружие. Нужно только собрать винтовки, людей и тех, кто ещё помнит, как вести сотню не по своему улусу, а по чужой дороге."
 RUS_watch_the_western_scar:0 "Защищённые дозоры"
 RUS_watch_the_western_scar_desc: "Западный край молчит слишком давно. Если Грязная зона откроется, первыми это увидят не столицы претендентов, а дозоры Земли Хана."
 RUS_claim_the_opened_zone: "Заявить права на открытую зону"
 RUS_claim_the_opened_zone_desc: "Поселения Грязной зоны появились без хозяина. Ханская земля не будет ждать, пока кто-то другой назовёт их буфером или протекторатом."
 RUS_drive_starolesye_back: "Отбросить Старолесье"
 RUS_drive_starolesye_back_desc: "Старолесская республика встала на западном поясе. Пока она держит соседние штаты, любая ханская армия остаётся запертой в бункере."
 RUS_press_the_closed_zone: "Нажать на закрытую зону"
 RUS_press_the_closed_zone_desc: "Соседи Грязной зоны живут порознь и воюют порознь. Земля Хана может брать их по одному, не втягиваясь в чужую войну за Башню."
 RUS_seat_the_khan_chancery:0 "Операция \"Последний закат\""
 RUS_seat_the_khan_chancery_desc:0 "На картах Хана покорённые земли уже окрашены одним цветом. Теперь гарнизоны, арсеналы и реакторные узлы должны подчиниться единому приказу. Имперская канцелярия сведёт их в общую систему, а за дверями бункера начнётся подготовка операции \"Последний закат\".\n\nПодданным обещают державу, которая положит конец войнам. В закрытых расчётах учёных это обещание приобретает иной смысл. До провозглашения империи ещё остаётся время; затем реактору предстоит питать оружие, для которого больше не будет ни границ, ни безопасного тыла. Хан готовится поставить последнюю подпись. Мир пока ждёт рассвета."
 RUS_summon_the_aimaqs_tt: "Аймаки принимают общий сбор как защиту земли, а не как новую столичную власть."
 RUS_watch_the_western_scar_tt: "Дозоры ждут открытия Грязной зоны. Сама война начнётся только отдельными решениями."
 RUS_claim_the_opened_zone_tt: "Земля Хана заявляет права на западный пояс Грязной зоны. Войны открываются решениями, а не этим фокусом."
 RUS_claim_the_opened_zone_available_tt: "Грязная зона должна быть уже открыта."
 RUS_drive_starolesye_back_available_tt: "Старолесье должно существовать либо уже идёт ханская пограничная война."
 RUS_press_the_closed_zone_available_tt: "Старолесье должно быть поглощено либо уже не существовать."
 RUS_seat_the_khan_chancery_available_tt: "Нужно удержать хотя бы два соседних образования Грязной зоны."
 ADISCORD_vorkerland_rus_dirty_campaign_category: "Ханский поход"
 ADISCORD_vorkerland_rus_dirty_campaign_category_desc: "Земля Хана может вести несколько походов в Грязной зоне одновременно. Новый поход требует сухопутной границы с целью; каждая республика покоряется отдельно."
 RUS_campaign_sla: "Добить Старолесье"
 RUS_campaign_sla_desc: "Пограничная война оставила республику без западного пояса. Теперь Земля Хана забирает оставшиеся старолесские земли."
 RUS_campaign_rza: "Идти на реакторный пояс"
 RUS_campaign_rza_desc: "Руины промышленного узла лежат за рубежами Союза Реакторной зоны. Ханские штабы готовят поход в заражённые земли."
 RUS_campaign_mlr: "Занять малую низину"
 RUS_campaign_mlr_desc: "За Старолесьем лежат земли Малой низины. Ханские разведчики изучают дороги, ведущие к её городам."
 RUS_campaign_ert: "Потребовать Восточную республику"
 RUS_campaign_ert_desc: "Восточная республика встречает ханских посланников настороженно. В штабах уже разложены карты будущего похода."
 RUS_campaign_irt: "Потребовать внутренние земли"
 RUS_campaign_irt_desc: "Караваны приносят вести из Внутренних земель. Ханские военачальники расспрашивают проводников о дорогах и переправах."
 RUS_campaign_sca: "Потребовать Южную федерацию"
 RUS_campaign_sca_desc: "Южная федерация привыкла считать Хана далёкой угрозой. Теперь его посланники стоят у её ворот."
 RUS_proclaim_the_last_empire:0 "Провозгласить общую державу"
 RUS_proclaim_the_last_empire_desc:0 "Аймаки и покорённые земли собираются под общим знаменем. Хан принимает присягу правителей и объявляет новый имперский титул."
 RUS_campaign_sla_tt: "Объявляет войну Старолесью и требует все его земли."
 RUS_campaign_rza_tt: "Объявляет войну Союзу Реакторной зоны и требует все его земли."
 RUS_campaign_mlr_tt: "Объявляет войну Республике Малой низины и требует все её земли."
 RUS_campaign_ert_tt: "Объявляет войну Восточной республике и требует все её земли."
 RUS_campaign_irt_tt: "Объявляет войну Республике Внутренних земель и требует все её земли."
 RUS_campaign_sca_tt: "Объявляет войну Южной федерации и требует все её земли."
 RUS_campaign_sla_not_active_tt: "Полный поход против Старолесья ещё не объявлен."
 RUS_campaign_sla_border_tt: "Нужна сухопутная граница со Старолесьем."
 RUS_campaign_rza_border_tt: "Нужна сухопутная граница с Союзом Реакторной зоны."
 RUS_campaign_mlr_border_tt: "Нужна сухопутная граница с Республикой Малой низины."
 RUS_campaign_ert_border_tt: "Нужна сухопутная граница с Восточной республикой."
 RUS_campaign_irt_border_tt: "Нужна сухопутная граница с Республикой Внутренних земель."
 RUS_campaign_sca_border_tt: "Нужна сухопутная граница с Южной федерацией."
 RUS_proclaim_the_last_empire_available_tt: "Нужно контролировать все доступные области Грязной зоны во всех шести поясах, кроме областей под контролем Кефрейта или его марионеток."
 RUS_proclaim_the_last_empire_prepared_tt: "Сначала завершите военную подготовку: \"Второй сбор аймаков\" и \"Вооружить пограничные сотни\" дадут пять и три стрелковые бригады до начала кризиса."
 RUS_proclaim_programme_tt:0 "§RВозможные участники коалиции: [MON.GetName], [VLD.GetName], [TMR.GetName] и [BTL.GetName].§! К ним могут присоединиться победители региональных войн и их союзники.\n\nПри контроле хотя бы одной реакторной зоны начинается отсчёт: §R90 дней до вмешательства коалиции§! и §R455 дней до орбитального удара§!. Если периметр будет занят позднее, отсчёт начнётся тогда.\n\n§RПобеда в войне не отменяет удар. Удар разрушит мир и завершит обычную кампанию.§! Потеря всего реакторного периметра навсегда срывает программу."
 RUS_arm_the_border_hosts_tt: "Формирует три стрелковые бригады в столице из выделенных людей и винтовок."
 RUS_proclaim_the_last_empire_peace_tt: "Нужен мир на всех фронтах, не только закрытый поход по Грязной зоне."

# --- rus_crisis_l_russian ---
 RUS_world_anarchy: "Анархия"
 RUS_world_anarchy_DEF: "анархия"
 RUS_world_anarchy_ADJ: "Разрушенн"
 RUS_last_bunker: "Бункер Хана"
 RUS_last_bunker_DEF: "бункер Хана"
 RUS_last_bunker_ADJ: "Бункерск"
 RUS_crisis_player_attack: "Напасть на Хана"
 RUS_crisis_player_attack_desc: "Штабы готовят выступление против Хана. Пока дипломаты обмениваются нотами, офицеры размечают маршруты на картах."
 RUS_crisis_player_attack_tt: "Начнём войну против Хана. Если вмешательство уже идёт, присоединимся к нему вместе со своими союзниками. Решение не запускает орбитальную программу и не изменяет её сроки."
 RUS_crisis_player_attack_side_tt: "Мы не воюем с участниками вмешательства против Хана."
 RUS_crisis_reactor_alliance: "Реакторный пакт"
 RUS_last_empire_crisis: "Последнее небо"
 RUS_last_empire_crisis_desc: "[GetRUSCrisisPhase]\n[GetRUSCrisisLaunchClock]\n\n§RПобеда над коалицией не отменяет орбитальный удар. Потеря всего реакторного периметра навсегда срывает программу.§!\n\nВозможные участники коалиции: §R[MON.GetName], [VLD.GetName], [TMR.GetName], [BTL.GetName]§! и победители региональных войн. Поздние участники могут прислать добровольцев и получают предложение вступить за §Y90 дней§! до удара. Прежние союзы сохраняются.\n\n§RПоражение Хана расколет империю. Удар разрушит мир и завершит обычную кампанию.§!"
 RUS_crisis_phase_preparing:0 "Этап: подготовка вмешательства коалиции."
 RUS_crisis_phase_war:0 "Этап: противостояние коалиции."
 RUS_crisis_phase_victory:0 "Этап: коалиция разгромлена."
 RUS_crisis_phase_inactive:0 "Этап: кризис не идёт."
 RUS_crisis_programme_stopped_tt:0 "Хан утратил власть или независимость, капитулировал либо завершил или отключил орбитальную программу"
 RUS_crisis_reactor_access_lost_tt:0 "Хан не контролирует ни одной из четырёх реакторных зон"
 RUS_crisis_invasion_stage_closed_tt:0 "Этап подготовки к вмешательству региональных держав завершён или прекращён"
 RUS_crisis_invasion_countdown: "До вмешательства региональных держав"
 RUS_crisis_invasion_countdown_desc: "Весть об орбитальной программе разошлась по чужим столицам. Дипломаты торопятся согласовать ответ, а штабы готовят армии к походу."
 RUS_crisis_defence_countdown: "До орбитального удара"
 RUS_crisis_defence_countdown_desc: "Армии коалиции выступают к реакторному поясу. За укреплениями Хана скрыта угроза всему промышленному миру."
 RUS_crisis_establish_special_zone: "Спецзона: [FROM.GetName]"
 RUS_crisis_establish_special_zone_desc: "На восстановленных землях открываются санитарные посты и пограничные канцелярии. Новая администрация принимает дела у военного командования."
 RUS_crisis_fragment_available_tt: "Осколок независим, вне союза и войны."
 RUS_empire_proclaimed_tt:0 "Общая держава Марка Рустана провозглашена."
 RUS_crisis_course_open_tt: "Подготовка обороны доступна до запуска лазера или падения империи."
 ADISCORD_rus_crisis.4.nod: "Последние ханские приказы остались без исполнителей. Северные войска заняли узлы управления, а подчинённые аймаки отказываются продолжать войну за погибшую империю. Старые области восстановят собственные администрации в пределах владений Хана. Нодрул сможет заключать отдельные договоры о специальном управлении, но победа сама по себе не превращает каждую освобождённую страну в зависимую территорию."
 RUS_imperial_frontier_campaign: "Поход: [FROM.GetName]"
 RUS_imperial_frontier_campaign_desc: "Имперские посланники предъявляют соседям новые притязания. Вслед за их грамотами к границе выходят войска."
 RUS_imperial_frontier_not_crisis_tt:0 "Орбитальная программа ещё не раскрыта либо окончательно прекращена; война коалиции завершена."
 RUS_crisis_war_active_tt: "Региональные державы ведут войну против Последней империи."
 RUS_crisis_won_tt: "Все участники вмешательства и их вступившие в войну союзники побеждены."
 RUS_crisis_warning_tt: "Региональные державы проверят готовность к вмешательству через §Y90 дней§!. Орбитальный удар последует через §Y455 дней§! с раскрытия программы, если Хан сохранит власть и доступ к реактору."
 ADISCORD_rus_crisis.1.t: "Под одним небом"
 ADISCORD_rus_crisis.1.d: "Офицер разведки разложил на столе снимки реакторного пояса и перехваченный список целей. Целиком он его зачитывать не стал. Промышленные районы, узлы связи, столицы. Стеландер и Кефрейт стояли в первых строках, но список продолжался дальше, за границы любого союза. Хан собирает орбитальную систему, питаемую реактором, и в его расчётах после удара не остаётся государств.\n\nВ Монтарской империи, Вальдском союзе, Тимерской палате и Свободной республике Байринж уже готовят поход. Независимые победители юга и запада и гегемон востока ждут своего решения. Байринж предложил Монтару и Тимеру закрепить общее выступление Реакторным пактом. Свободные от других союзов участники объединят командование; прежние альянсы и фронты продолжат жить по своим приказам.\n\nПоследним офицер положил на стол расчёт срока. Оспаривать его никто не стал. Каждое правительство, которое решится вмешаться, должно успеть привести своих союзников к реакторному периметру, пока у этой войны ещё есть смысл."
 ADISCORD_rus_crisis.1.a: "Сначала остановить Хана."
 ADISCORD_rus_crisis.2.t: "Последнее небо"
 ADISCORD_rus_crisis.2.d: "Из помещения связи вывели посторонних. На пульте ждала первая команда спутнику; рядом стоял Тагир Мансуров. Приказ о начале программы уже был подписан Ханом.\n\nГлеб Корнеев не вводил код. Он ещё раз объяснил, что последний удар придётся по самому реактору. Разрушение не остановится у столиц и заводов: расчёт не даёт безопасной границы, катастрофа может охватить весь мир. Укрытия не гарантируют спасения. Хан велел говорить дальше.\n\nКорнеев предложил отсоединить оружейный канал и оставить реактор для снабжения. Связь со спутником ещё можно не устанавливать. Люди уже строят дома, возвращаются к станкам и просят открыть школы. Для этого система им не нужна.\n\nРустан спросил, сколько времени пройдёт, прежде чем новые хозяева заводов соберут новые армии. Инженер ответил, что не умеет считать чужие решения. Он умеет отключить этот передатчик.\n\nХан посмотрел на тёмный экран. Ему предлагали оставить людям возможность снова устроить мир без его разрешения. Он приказал ввести код. Корнеев повторил предупреждение о масштабе удара. Рустан дождался конца и повторил приказ. Инженер ввёл код теми же пальцами, которыми когда-то чертил проход для носилок. На экране появилось подтверждение приёма."
 ADISCORD_rus_crisis.2.a: "Приказ передан."
 ADISCORD_rus_crisis.3.t: "Война за оставшееся время"
 ADISCORD_rus_crisis.3.d: "Срок подготовки истёк. Над реакторным поясом прошли первые разведчики, на дорогах к периметру встали колонны, а в штабах перестали говорить о переговорах. Правительства, сохранившие возможность вмешаться, отдают приказы о наступлении на Последнюю империю. Их союзники и зависимые страны выступают на общей стороне, сохраняя свои штабы.\n\nЗа этой войной по-прежнему идут другие. Старые фронты никто не закрыл, и солдатам, которых везут к реактору, приходится проезжать мимо собственных незаконченных сражений. Часы орбитальной программы продолжают идти."
 ADISCORD_rus_crisis.3.a: "Часы идут."
 ADISCORD_rus_crisis.4.other: "Имперская армия разбита, а власть Хана исчезает вместе с ней. Подчинённые правительства разрывают присягу, прежние завоевания выходят из-под власти столицы. На землях самого Хана вновь возникают самостоятельные администрации и вооружённые владения.\n\nНикто не получает готовую империю в наследство. Вместо единого противника остаётся раздробленный край: местные правители делят дороги, склады и право отдавать приказы. Победа устранила Хана, но порядок на его землях придётся создавать заново."
 ADISCORD_rus_crisis.4.t: "Империя осталась без Хана"
 ADISCORD_rus_crisis.4.val: "Ханская армия потерпела поражение. Приказы из бункера больше не связывают западные республики в одно государство: местные правления возвращаются на земли распавшейся империи. Сам Хан отстранён от власти, а его имперская канцелярия распущена.\n\nВ Кефрейте карты бывшей империи разложили в отделе санитарных границ. Чиновники спорят не о флагах, а о дорогах к реактору: кто будет держать заставы, проверять грузы и отвечать, если в осколках снова появится свой Хан. Земли соседних государств в этот раздел не входят."
 ADISCORD_rus_crisis.4.sts: "Последняя империя распалась вместе с властью Хана. Покорённые республики восстанавливают свои учреждения, а бывший ханский центр переходит под местное управление. Единой ханской державы больше нет.\n\nВ Стеландере первыми о судьбе осколков заговорили не дипломаты, а интенданты: через бывшие аймаки идут дороги, по которым теперь возвращаются беженцы и уходит оружие. Каждую территорию придётся решать отдельно, не трогая земель тех, кто в империю не входил."
 ADISCORD_rus_crisis.4.a: "Определить устройство границы."
 ADISCORD_rus_crisis.5.t: "Вмешательство разгромлено"
 ADISCORD_rus_crisis.5.d: "Последние участники вмешательства сложили оружие. Их земли вместе с владениями вступивших в войну союзников и зависимых стран перешли под власть империи.\n\nНачальник штаба вошёл к Хану без сводки потерь. Он попросил снять чрезвычайные распоряжения и передать транспорт восстановительным бригадам. Реакторная программа уже сорвана, боевых задач для неё больше нет. Теперь надо было довезти продовольствие до занятых городов и вернуть людей с дорог.\n\nРустан велел принести ведомость перевозок. На этот раз в ней требовались адреса доставки, а не цели удара."
 ADISCORD_rus_crisis.5.a: "Принять донесение."
 ADISCORD_rus_crisis.6.t: "Программа закрыта"
 ADISCORD_rus_crisis.6.d: "Из реакторного пояса пришли последние донесения: передатчик молчит, расчёты спутника больше не обновляются, а инженеры на периметре разбирают пульты. Разведка трижды перепроверила сведения, прежде чем штаб им поверил.\n\nВ городах так и не узнают, как близко подошёл конец. Газеты напишут о победе дипломатии или оружия - смотря кто будет писать. Штабисты свернули карты с кругами поражения и впервые за много месяцев ушли домой до полуночи."
 ADISCORD_rus_crisis.6.a: "Принять к сведению."
 ADISCORD_rus_crisis.41.t:0 "Посланник Байринжа"
 ADISCORD_rus_crisis.41.d:0 "Посланник Свободной республики Байринж приехал без охраны, на гражданской машине с белым флажком на антенне. Тагир Мансуров продержал его у ворот два часа, потом провёл вниз с завязанными глазами. Повязку сняли только в комнате для приёма. Посланник первым делом посмотрел на вентиляционную решётку и сказал, что у них в убежищах такие же.\n\nОн не угрожал. Он положил на стол копию списка целей, добытую разведкой, и рядом - короткий лист условий: отсоединить оружейный канал, допустить к передатчику инженеров коалиции, оставить реактор для снабжения. Об аймаках, границах и занятых землях в листе не было ни слова.\n- Об этом мы будем воевать, - сказал он. - Как обычные люди. О небе - нет.\n\nГлеб Корнеев стоял у стены и не вмешивался. Рустан спросил посланника, кто в Байринже будет решать, когда снова строить армии. Тот ответил, что не знает: у них выборы. Хан кивнул, словно услышал именно то, чего ждал.\n\nПосланник ждал ответа до вечера. Перед отъездом он попросил передать Хану, что его штаб считает дни так же, как ханский."
 ADISCORD_rus_crisis.41.a:0 "Ответа не будет."
 ADISCORD_rus_crisis.41.b:0 "Отсоединить оружейный канал."
 ADISCORD_rus_crisis.42.t:0 "Журнал без подписи"
 ADISCORD_rus_crisis.42.d:0 "Глеб Корнеев пришёл к Хану сам, в рабочей куртке, с журналом смены под мышкой. О передатчике он доложил так же подробно, как прежде докладывал о сводах и подъёмниках: напряжение, ход расчёта, время до следующего сеанса. Потом положил журнал на стол и сказал, что больше подписывать его не будет.\n\nМилости он не просил. Он объяснил, что весь бункер, от вентиляции до лестниц, строился для того, чтобы люди внизу пережили случившееся наверху. Теперь наверху должно случиться то, чего не переживёт никто.\n- Я сохранил проход для носилок, - сказал он. - Мне больше не для кого его сохранять.\n\nТагир Мансуров ждал у двери. Нина Шалаева, которую вызвали к раненым, остановилась в коридоре и не уходила. Рустан долго смотрел на журнал. Почерк в нём был ровный до последней строки, без единой помарки. Хан знал, что расчёт доведут и без Корнеева: машины уже считали сами. Корнеев тоже это знал. Он пришёл не остановить отсчёт, а отказаться в нём участвовать.\n\nВ соседней комнате на экране продолжал идти отсчёт."
 ADISCORD_rus_crisis.42.console:0 "Он останется у пульта."
 ADISCORD_rus_crisis.42.evacuation:0 "Отправить его к эвакуационным спискам."
 ADISCORD_rus_crisis.42.guard:0 "Передать его караулу."
 ADISCORD_rus_crisis.42.disconnect:0 "Пусть отключит канал."
 ADISCORD_rus_crisis.43.t:0 "Последняя строка"
 ADISCORD_rus_crisis.43.army.d:0 "Командиры собрались в ставке на ночной разбор. Карты лежали неровно, сводки опаздывали, и только одна папка была собрана безупречно: список частей, которые больше не отвечали на позывные. Её принёс самый молодой из командиров - тот, что когда-то оставил в общей книге командования пустую строку до утренней переклички.\n\nРустан узнал почерк сразу: тот же, что в перехваченной записке. Он дочитал список до конца, отметил две ошибки в нумерации и вернул папку. Командир принял её обеими руками. Тагир Мансуров стоял у двери и смотрел не на Хана, а на кобуру командира. Хан не позвал караул.\n\nВыстрел услышали в нижних галереях. Первой в комнату вбежала Нина Шалаева. Она долго держала пальцы на шее Рустана, хотя всё было понятно сразу. Командир сидел на полу у стены; оружие у него никто не отбирал. Он сказал только, что его люди не вернулись с переклички и считать их больше некому.\n\nУтром Савва Ключарёв открыл общую книгу на последней странице переписи. Строка с именем Марка Рустана стояла так же, как тысячи других, без титула. Писец обмакнул перо и вписал дату в графу для умерших. Хорошая книга должна была годиться и после него."
 ADISCORD_rus_crisis.43.d:0 "Ужин принесли поздно, как обычно в дни тяжёлых сводок. Рустан ел, не отрываясь от бумаг: потери по аймакам, перечень оставленных переправ, прошения о возвращении ополченцев к посевной. Под прошениями лежала записка без подписи, перехваченная охраной неделей раньше. Следователям Хан её так и не отдал.\n\nК полуночи у него начали неметь пальцы. Он отложил перо, но дежурного не позвал. Тагир Мансуров заглянул в комнату по привычке и увидел, что Хан сидит неподвижно, прижав ладонь к щеке, к старому шраму. Мансуров позвал Нину Шалаеву. Она пришла быстро. Слишком поздно.\n\nКто подмешал яд, установить не смогли. Повар клялся, что котёл охраняли. Офицеры, которых подозревали, к утру уже были на пути в свои аймаки, и задерживать их никто не стал. Империи, которую следовало бы защищать от убийц, больше не существовало.\n\nУтром Савва Ключарёв открыл общую книгу на последней странице переписи. Строка с именем Марка Рустана стояла так же, как тысячи других, без титула. Писец обмакнул перо и вписал дату в графу для умерших. Хорошая книга должна была годиться и после него."
 ADISCORD_rus_crisis.43.a:0 "Записать в книгу."
 RUS_imperial_general_staff: "Генеральный штаб империи"
 RUS_imperial_general_staff_desc: "Аймачные командиры привыкли отвечать только за собственные сотни. Теперь общий штаб сведёт их донесения в единую карту обороны и откроет военную кампанию \"Последний приказ\"."
 RUS_western_supply_lines: "Снабжение периметра"
 RUS_western_supply_lines_desc: "Поезда и автомобильные колонны свяжут гарнизоны с тыловыми складами."
 RUS_imperial_arsenals: "Имперский арсенал"
 RUS_imperial_arsenals_desc: "Ханская канцелярия объединит заказы сотен в постоянную программу вооружения. Столичный арсенал получит собственные производственные цеха."
 RUS_aimaq_reserve: "Второй сбор аймаков"
 RUS_aimaq_reserve_desc: "Первый сбор позволил создать империю. Второй должен дать ей людей, винтовки, комплект стрелкового оружия и переносные зенитные расчёты, чтобы выдержать войну с противником, уже подчинившим своих соседей."
 RUS_break_the_hegemon: "Оборона реакторного периметра"
 RUS_break_the_hegemon_desc: "Штабы внешних держав готовятся выступить против Хана. Пока инженеры работают над орбитальной системой, армия должна развернуть заслоны, снабдить гарнизоны и перекрыть дороги к реактору. Новые бригады займут позиции вокруг комплекса."
 RUS_register_conquered_lands: "Опись установок"
 RUS_register_conquered_lands_desc: "Инженеры сведут уцелевшие установки, кабели и распределительные узлы в единую схему. Ремонтные части получат имущество и подвижной состав, чтобы доставлять оборудование туда, где ещё держится периметр."
 RUS_empire_without_rivals: "Орбитальные расчёты"
 RUS_empire_without_rivals_desc: "Траектория, запас энергии и момент возвратного импульса должны сойтись в одном расчёте. Новое научное управление получит постоянное место в исследовательской программе империи."

