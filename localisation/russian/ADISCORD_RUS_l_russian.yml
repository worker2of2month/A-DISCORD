 RUS_bunker_clinic:0 "Слой 4: хирургический ярус"
 RUS_bunker_clinic_desc:0 "Впервые полевые хирурги получат свет, стерильную воду и место для возвращения раненых к жизни. Ханская ведомость научится считать спасённых."
