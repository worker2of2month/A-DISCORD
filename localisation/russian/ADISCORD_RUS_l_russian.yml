 ADISCORD_rus_crisis.34.t:0 "Первый сброс над степью"
 ADISCORD_rus_crisis.34.d:0 "Утром над бункером прошли три транспортника с эмблемой Воркерланда. Над пустошью раскрылись парашюты, и караулы Чёрной армии до темноты собирали мешки с крупой, ящики консервов и бочки с маслом. В записке командира звена было только одно: помощь будет и дальше, пока у Воркерланда есть топливо.\n\nНа одном ящике кто-то вывел мелом: \"Детям у ворот\". Интенданты хотят спустить груз на склады. Казначеи напоминают, что аймаки дадут за воркерландские консервы хорошие деньги, а казне деньги нужнее."
 ADISCORD_rus_crisis.34.a:0 "Спустить груз на склады."
 ADISCORD_rus_crisis.34.b:0 "Продать груз аймакам."
 ADISCORD_rus_crisis.35.t:0 "Второй сброс"
 ADISCORD_rus_crisis.35.d:0 "Самолёты пришли снова, но теперь их два, а парашютов вдвое меньше. Один транспортник сел у бункера на дозаправку. Лётчик долго не выходил из кабины, потом спросил караульного, правда ли, что у Хана кормят тех, кто пришёл сам. В Воркерланде урезают пайки собственным гарнизонам, а топливо распределяют комиссии. Половина груза - крупа прошлогоднего помола.\n\nЛётчик улетел, не дождавшись ответа. Если так пойдёт и дальше, следующий сброс станет последним."
 ADISCORD_rus_crisis.35.a:0 "Всё до мешка - на склады."
 ADISCORD_rus_crisis.35.b:0 "Продать крупу перекупщикам."
 ADISCORD_rus_crisis.36.t:0 "Последний самолёт"
 ADISCORD_rus_crisis.36.d:0 "Над степью прошёл один транспортник. Он сбросил несколько мешков и, не делая второго круга, ушёл на запад. Позже радисты разобрали перехваченные переговоры: в Воркерланде командиры делят склады, гарнизоны занимают аэродромы, а остатки топлива берегут для собственной войны.\n\nВ одном мешке вместо крупы оказались письма. Кто-то из аэродромной команды собрал почту для родственников, живущих у Хана, и не нашёл другого способа её отправить. Писем больше не будет. Крупы тоже."
 ADISCORD_rus_crisis.36.a:0 "Спустить на склады то, что есть."
 ADISCORD_rus_crisis.36.b:0 "Продать остатки, письма - адресатам."
 ADISCORD_rus_crisis.37.t:0 "Небо опустело"
 ADISCORD_rus_crisis.37.d:0 "Назначенный день прошёл, но самолёты Воркерланда так и не появились. На западных частотах слышны только приказы, ругань и позывные частей, которые больше не подчиняются столице. В Воркерланде началась смута, и о голодных соседях там больше никто не вспомнит.\n\nКараульные ещё неделю выходили по утрам на поле сброса. Потом Тагир Мансуров снял пост и велел списать запасную стропу на хозяйственные нужды."
 ADISCORD_rus_crisis.37.a:0 "Значит, будем кормиться сами."
 ADISCORD_rus_crisis.38.t:0 "Заражённая вода"
 ADISCORD_rus_crisis.38.d:0 "Насосы водоочистки подняли из скважины мутную воду с запахом железа и гнили. Санитары нашли в фильтрах дохлых крыс и следы старой утечки с нижних горизонтов. Несколько смен уже слегли с лихорадкой.\n\nНина Шалаева требует перекрыть насосы, пока систему не промоют. Глеб Корнеев напоминает, что запас питьевой воды не бесконечен, а годных фильтров на складе нет. Начальники смен молчат: их люди третий день пьют то, что течёт из крана."
 ADISCORD_rus_crisis.38.a:0 "Перекрыть насосы и пить из запасов."
 ADISCORD_rus_crisis.38.b:0 "Купить новые фильтры."
 ADISCORD_rus_crisis.38.c:0 "Пить как есть."
 ADISCORD_rus_crisis.39.t:0 "Обвал в амбаре"
 ADISCORD_rus_crisis.39.d:0 "Ночью свод зернохранилища на третьем слое не выдержал. Под камнем и бетоном оказались мешки, бочки и стеллажи с консервами. Глеб Корнеев говорит, что часть запаса ещё можно спасти, если немедленно поставить крепь и не ждать, пока порода осядет.\n\nЧёрная армия уже прислала людей с лопатами и готова лезть в завал без крепи. Инженеры просят денег, времени и права снять рабочих с других участков. Порода над завалом продолжает потрескивать."
 ADISCORD_rus_crisis.39.a:0 "Списать засыпанное."
 ADISCORD_rus_crisis.39.b:0 "Поставить крепь."
 ADISCORD_rus_crisis.39.c:0 "Пусть копает Чёрная армия."
 ADISCORD_rus_crisis.40.t:0 "Падёж скота"
 ADISCORD_rus_crisis.40.d:0 "Из присоединённых аймаков приходят дурные вести: по стадам прошёл мор. Пастухи режут больных животных и просят у бункера крупу, чтобы пережить сезон. Иначе они уйдут с этих земель вместе с семьями.\n\nВетеринаров в ставке хватит на один аймак, лекарства придётся покупать у соседей. Сотники напоминают, что уцелевший скот ещё можно забрать, пока пастухи не забили его сами. Старшина, приехавший с вестью, слышал это и так и не сел."
 ADISCORD_rus_crisis.40.a:0 "Кормить аймаки из запасов."
 ADISCORD_rus_crisis.40.b:0 "Купить лекарства."
 ADISCORD_rus_crisis.40.c:0 "Забрать уцелевший скот."
 ADISCORD_rus_crisis.30.t:0 "Трофеи похода"
 ADISCORD_rus_crisis.30.d:0 "Последние заставы сдались, и обозы Чёрной армии потянулись к бункеру. В описях - касса уездной управы, склад винтовок, мешки с зерном и колонна пленных, которых интенданты уже распределили по нижним проходкам.\n\nСтарейшины аймаков пришли к ставке без приглашения. С победой они не спорили; они спрашивали, чем жить зимой людям, которые теперь платят подать Хану. Савва Ключарёв положил перед Рустаном две описи: полную и той части, что можно оставить на месте. Соседи будут судить о Хане по второй."
 ADISCORD_rus_crisis.30.a:0 "Вывезти всё, пленных - на проходку."
 ADISCORD_rus_crisis.30.b:0 "Оставить часть аймакам."
