 RUS_bunker_strip_1:0 "Слой 1: переоборудование"
 RUS_bunker_strip_1_desc:0 "Бригады разбирают оборудование и выносят его к подъёмнику. В опустевших залах остаются следы прежних мастерских."
 RUS_bunker_strip_2:0 "Слой 2: переоборудование"
 RUS_bunker_strip_2_desc:0 "Бригады разбирают оборудование и выносят его к подъёмнику. В опустевших залах остаются следы прежних мастерских."
 RUS_bunker_strip_3:0 "Слой 3: переоборудование"
 RUS_bunker_strip_3_desc:0 "Бригады разбирают оборудование и выносят его к подъёмнику. В опустевших залах остаются следы прежних мастерских."
 RUS_bunker_strip_4:0 "Слой 4: переоборудование"
 RUS_bunker_strip_4_desc:0 "Бригады разбирают оборудование и выносят его к подъёмнику. В опустевших залах остаются следы прежних мастерских."
 RUS_bunker_strip_5:0 "Слой 5: переоборудование"
 RUS_bunker_strip_5_desc:0 "Бригады разбирают оборудование и выносят его к подъёмнику. В опустевших залах остаются следы прежних мастерских."
 RUS_khan_governing_tt:0 "Страной руководит Марк Рустан; она независима и не капитулировала."
 RUS_bunker_operational_tt:0 "Марк Рустан управляет независимой страной, которая не капитулировала, и владеет регионом [66.GetName], полностью контролируя его."
 RUS_bunker_slot_free_tt:0 "Строительная бригада свободна."
 RUS_bunker_contract_tt:0 "Оплата резервируется при начале работ; повторного списания при сдаче нет. Одновременно выполняется один заказ. Потеря владения или контроля региона [66.GetName], подчинение, капитуляция либо падение законного правительства отменяют заказ с полным возвратом оплаты. Готовая планировка при временной потере сохраняется, но её эффекты не действуют. Законная смена Хана на Оскола или Ниву сохраняет и стройку, и оплату."
 RUS_bunker_refunded_tt:0 "Незавершённый подземный заказ отменён. Вся зарезервированная оплата возвращается ровно один раз."
 RUS_bunker_strip_tt:0 "Помещение демонтировано без возврата его цены. Модернизация также утрачивается. Мощность освобождается; глубина и прочность не меняются."
 RUS_bunker_complex:0 "Система бункеров"
 RUS_bunker_complex_desc:0 "Подземная столица начинается с чертежа и первой проходки. За гермодверями должны разместиться жильё, мастерские, лазареты, запасы и ставка - целый город, способный пережить гибель поверхности. Каждый оборудованный слой приближает это обещание, занимая место и требуя энергии, пищи и труда.\n\nСистема бункеров растёт вместе с построенными помещениями и их модернизациями. Её назначение определят хозяева: убежище для жителей, опора армии или закрытый центр власти. Действующие помещения дают стране свои преимущества, пока комплекс удерживается и работает; повреждённые своды и пустые склады превращают подземную жизнь в испытание."
 RUS_bunker_online:0 "§GКомплекс действует§!"
 RUS_bunker_offline:0 "§RКомплекс недоступен§!"
 RUS_bunker_safe:0 "§GСводы устойчивы§!"
 RUS_bunker_danger:0 "§RАварийные своды§!"
 RUS_bunker_idle:0 "§Gсвободна§!"
 RUS_bunker_busy:0 "§Yзанята§!"
 RUS_bunker_empty:0 "Пустая галерея"
 RUS_bunker_budget_row:0 "Подземный рынок бункера: [?ADISCORD_economy_direct_income|G1] (без поправок)\n"
 RUS_bunker_budget_row_none:0 ""
 RUS_bunker_rock:0 "Неразведанный массив"
 RUS_bunker_depth_3_tt:0 "Разрешает проходку до третьего слоя. Проходка и оснащение каждого слоя оплачиваются отдельно."
 RUS_bunker_depth_5_tt:0 "Разрешает проходку до пятого слоя. Проходка и оснащение каждого слоя оплачиваются отдельно."
 RUS_bunker_five_tt:0 "Пять слоёв оснащены; прочность не ниже 60; нет незавершённых работ."
 RUS_bunker_three_tt:0 "Оснащены хотя бы три слоя; прочность не ниже 40."
 RUS_bunker_construction:0 "Подземная столица - пять слоёв"
 RUS_bunker_construction_desc:0 "На схеме - проекты этажей. Их текущее назначение и состояние указаны над рисунками."
 RUS_count_the_hearths:0 "Пересчитать очаги"
 RUS_count_the_hearths_desc:0 "Рустан знает имена вождей, но не знает числа дворов, которые они называют своими. Переписчики поедут в аймаки с чистыми книгами и приказом считать людей, а не обещания."
 RUS_council_mandate:0 "Совет аймаков"
 RUS_council_mandate_desc:0 "Старшины привозят в столицу списки нужд и обещаний своих общин. Решение совета проходит через долгий спор, зато вернувшийся домой делегат отвечает за него перед собственными людьми. Согласие аймаков укрепляет власть и внутренний мир; общий военный сбор приходится ждать дольше, чем хотелось бы ставке."
 RUS_chancery_mandate:0 "Единая ханская печать"
 RUS_chancery_mandate_desc:0 "Единая печать придаёт столичному приказу силу во всех аймаках. Канцелярия назначает сроки, сводит разрозненные ведомости и требует исполнения, не ожидая нового совета старшин. Власть быстрее собирает людей и проводит решения, но каждая такая победа напоминает общинам о правах, которыми пришлось поступиться.\n\n\n\n\n\n £GFX_RUS_chancery_mandate_banner \n\n\n"
 RUS_written_oaths:0 "Клятвы на бумаге"
 RUS_written_oaths_desc:0 "Совет и канцелярия по-разному распределяют полномочия, но оба обязаны отвечать за обещанные поставки. Письменные обязательства закрепят выдачу инженерного оснащения окружным службам. Клятва становится убедительной, когда за ней следует оборудование, которое действительно можно использовать; после этого редакция сможет отчитываться о выполненных обещаниях."
 RUS_written_oaths_support_tt:0 "Чиновники присягают Хану, а не фракциям: поддержка §YЧёрной армии§! и §YУчёных§! §G+5%§! каждой."
 RUS_pay_the_officials:0 "Жалованье вместо кормления"
 RUS_pay_the_officials_desc:0 "Писарь, живущий с каждой подписи, неизбежно продаёт государство по листку. Регулярное жалованье дорого, зато теперь можно требовать точности."
 RUS_winter_granaries:0 "Зимние ведомости"
 RUS_winter_granaries_desc:0 "Учесть зерно прежде, чем ударит мороз, значит обойтись без зимних реквизиций. Копия складской книги останется у тех, кто наполняет амбары."
 RUS_winter_granaries_tt:0 "Склад бункера: §G+40§! £supply_texticon вместимости, поступление §G+2§! £supply_texticon в неделю. Зима добавляет к недельному расходу только §Y1§! £supply_texticon вместо §Y3§!."
 RUS_district_courts:0 "Суд до выстрела"
 RUS_district_courts_desc:0 "Не всякая ссора о земле должна кончаться походом. Разъездные суды закрепят примирение между общинами и освободят людей от обязанности участвовать в междоусобицах. Те, кто прежде охранял спорные межи, смогут вернуться на государственную службу; решение с печатью окажется полезнее ещё одного набега."
 RUS_district_courts_levy_tt:0 "Аймачное ополчение можно созывать до §Y5§! раз за войну вместо §Y3§!."
 RUS_school_of_scribes:0 "Школа писцов и механиков"
 RUS_school_of_scribes_desc:0 "Для Хана грамотный человек давно означает полезного человека. Теперь за одним столом учатся составлять смету, читать чертёж и замечать подделку."
 RUS_roadside_clinics:0 "Лазареты у дорог"
 RUS_roadside_clinics_desc:0 "Подводе с раненым нужен адрес, а не надежда встретить лекаря. Сеть маленьких лазаретов соединит разбросанные поселения лучше громких манифестов."
 RUS_a_country_of_names:0 "Страна собственных имён"
 RUS_a_country_of_names_desc:0 "В последней книге переписи больше нет строки \"прочие\". Рустан узнаёт цену настоящей власти: каждый, кого он велит защитить, становится кем-то определённым."
 RUS_surface_workshops:0 "Мастерские над бункером"
 RUS_surface_workshops_desc:0 "Подземное убежище не проживёт без людей снаружи. Старые ремонтные сараи соберут в фабричный двор, где можно изготовить крепёж, тележку и новую дверь."
 RUS_treasury_135_tt:0 "Казна получает §G135§! £ADISCORD_economy_treasury_texticon."
 RUS_salvage_inventory:0 "Реестр уцелевших станков"
 RUS_salvage_inventory_desc:0 "Станок без паспорта - не лом. Приёмщики разберутся, что можно восстановить, прежде чем самые предприимчивые хозяева продадут его по весу."
 RUS_machine_school:0 "Училище наладчиков"
 RUS_machine_school_desc:0 "Один исправный станок бесполезен без человека, который умеет его остановить вовремя. Училище займёт пустой склад рядом с первым цехом."
 RUS_power_grid:0 "Сеть над землёй"
 RUS_power_grid_desc:0 "Провода свяжут мастерские и посёлки в общий хозяйственный круг. Подземные генераторы останутся отдельным делом: полагаться на единственный рубильник было бы слишком удобно для врага."
 RUS_freight_yards:0 "Разгрузочные дворы"
 RUS_freight_yards_desc:0 "Ворота столицы должны принимать поезд с грузом, а не очередь обозов. Диспетчерам нужны локомотивы, а мастерским - запас узлов для их ремонта."
 RUS_standard_calibres:0 "Единый калибр заказа"
 RUS_standard_calibres_desc:0 "Слишком часто новая партия патронов не подходит к старой партии винтовок. Единая приёмка прекратит это дорогое разнообразие."
 RUS_civilian_shift:0 "Вторая гражданская смена"
 RUS_civilian_shift_desc:0 "У военного заказа больше голосов, чем у мирного. Хан закрепит рабочую смену за гражданским производством, иначе ремонт столицы так и останется военным обещанием."
 RUS_precision_lathes:0 "Станки точного хода"
 RUS_precision_lathes_desc:0 "Разброс деталей измеряется не только металлом: это задержки и потерянные жизни. Новая линия будет делать меньше разных вещей, зато взаимозаменяемых."
 RUS_treasury_100_tt:0 "Казна получает §G100§! £ADISCORD_economy_treasury_texticon."
 RUS_industrial_belt:0 "Рабочее кольцо столицы"
 RUS_industrial_belt_desc:0 "Посёлки вокруг бункера стали городом, пока канцелярия всё ещё считала их временным лагерем. Пора признать этот город и подвести к нему постоянные службы."
 RUS_engineers_collegium:0 "Коллегия инженеров"
 RUS_engineers_collegium_desc:0 "При Хане появится совет, которому позволено сказать: \"это не выдержит\". Право спорить с приказом там, где речь идёт о расчёте, станет новым государственным обычаем."
 RUS_treasury_165_tt:0 "Казна получает §G165§! £ADISCORD_economy_treasury_texticon."
 RUS_bunker_survey:0 "Чертёж подземной столицы"
 RUS_bunker_survey_desc:0 "Проходчики могут начать работу уже сейчас. Государственное обследование даст им карту грунтов, первую крупную выплату и инженерное оснащение для оплаченных работ."
 RUS_bunker_airlocks:0 "Две двери до света"
 RUS_bunker_airlocks_desc:0 "Теперь герметичные переходы позволят устроить дополнительные кладовые у входа. Их постоянная ёмкость и первая партия пищи помогут снабжать комплекс после появления новых жителей."
 RUS_bunker_power_school:0 "Машинный зал"
 RUS_bunker_power_school_desc:0 "Главный инженер записал внизу плана четыре единицы мощности. На верхнем листе пожеланий уже двенадцать. Обещаниям придётся подчиниться генераторам."
 RUS_bunker_shift_work:0 "Две подземные смены"
 RUS_bunker_shift_work_desc:0 "Дополнительные смены позволят ускорить проходку. Прораб требует записать в приказе цену: меньше времени на закрепление означает более слабые своды."
 RUS_bunker_deep_gallery:0 "За старой переборкой"
 RUS_bunker_deep_gallery_desc:0 "Первые пробы позволяют продолжить шахту до третьего горизонта. Там достаточно места для коммуникаций и производства, если не забывать укреплять верхние галереи."
 RUS_bunker_utilities:0 "Вода или провод"
 RUS_bunker_utilities_desc:0 "Инженеры спорят за второй ярус. Для одних основа жизни - чистая вода, для других основа обороны - своевременный приказ. Окончательный выбор сделает заказ на монтаж."
 RUS_treasury_65_tt:0 "Казна получает §G65§! £ADISCORD_economy_treasury_texticon."
 RUS_bunker_working_heart:0 "Хлеб или сталь"
 RUS_bunker_working_heart_desc:0 "Третий ярус не сможет вместить одновременно полноценный арсенал и достаточные зерновые камеры. Теперь подземная смета станет политическим решением."
 RUS_bunker_lower_horizons:0 "Нижние горизонты"
 RUS_bunker_lower_horizons_desc:0 "За третьим горизонтом начинается незнакомая порода. Геологи изучают пробы, а проходчики прислушиваются к каждому новому звуку в глубине."
 RUS_bunker_science_wing:0 "Свет на четвёртом слое"
 RUS_bunker_science_wing_desc:0 "Доктора и исследователи просят одинакового: чистоты, надёжного света и тишины. Им придётся договориться, чья работа первой получит место под защитой скалы."
 RUS_bunker_memory_vault:0 "Память или приказ"
 RUS_bunker_memory_vault_desc:0 "На последнем ярусе будет сердце комплекса. Архив сохранит страну после смерти её правителя. Командный зал поможет правителю не допустить этой смерти вместе со страной."
 RUS_bunker_commission:0 "Принять подземный комплекс"
 RUS_bunker_commission_desc:0 "Комиссия спускается в оснащённые галереи. Службы принимают помещения, а строители готовят последний акт о завершении подземного комплекса."
 RUS_open_city_policy:0 "Город для живых"
 RUS_open_city_policy_desc:0 "Через гермодвери проходят семьи, врачи и преподаватели. Подземную столицу строят для жизни: её жители получают место в общем будущем, а исследователи - возможность работать рядом с мастерскими. Такой порядок укрепляет доверие и науку, хотя государству труднее требовать от граждан бесконечной осады. Принятые гражданские права действуют и за пределами комплекса."
 RUS_bunker_open_city:0 "Город для живых"
 RUS_bunker_open_city_desc:0 "На плане ещё нет жилых комнат, но семьи проходчиков уже спрашивают о местах. Хан включит гражданские службы и жильё в проект убежища. Продовольственная служба начнёт готовить постоянные поставки; полный городской порядок вступит в силу после оснащения пяти слоёв. Право людей жить здесь придётся соблюдать и тогда, когда оно помешает приказу."
 RUS_bunker_surface_market:0 "Рынок у верхнего шлюза"
 RUS_bunker_surface_market_desc:0 "У верхнего шлюза уже торгуют без разрешения: меняют фильтры на зерно, батареи на соль. Открытый рынок с весами и писарем превратит этот обмен в доход бункера, а соседей - в постоянных покупателей ханского тока."
 RUS_bunker_surface_market_tt:0 "Подземный рынок приносит ещё §G+8§! £ADISCORD_economy_treasury_texticon в месяц, пока комплекс работает; первые пошлины сразу дают §G+65§! £ADISCORD_economy_treasury_texticon. Одновременно могут действовать §Y3§! энергоконтракта вместо §Y2§!."
 RUS_bunker_refugee_quarters:0 "Дома для беженцев"
 RUS_bunker_refugee_quarters_desc:0 "Верхние галереи, брошенные после первой зимы, снова заселят. Беженцы получат угол, паёк и работу, а город под горой - людей, которые сами выбрали его своим домом."
 RUS_bunker_refugee_quarters_tt:0 "Прогресс общественного развития: §G+15§!. Если беженцев принимают под землю, бункер получает §G+6000§! £manpower_texticon вместо §Y4000§! и тратит только §Y15§! £supply_texticon вместо §Y30§!."
 RUS_bunker_city_charter:0 "Устав подземного города"
 RUS_bunker_city_charter_desc:0 "Бункер перестал быть убежищем и стал городом: в нём учатся, торгуют и спорят о том, кто будет говорить от имени нижних кварталов. Устав закрепит права жителей и даст учёным место в городском совете."
 RUS_bunker_deep_casemates:0 "Глубокие казематы"
 RUS_bunker_deep_casemates_desc:0 "Под нижними горизонтами вырубят казематы, о которых не будет знать даже большая часть гарнизона. Если враг дойдёт до ворот, бункер не сдастся вместе со столицей."
 RUS_bunker_mountain_garrison:0 "Гарнизон под горой"
 RUS_bunker_mountain_garrison_desc:0 "Каждый аймак пришлёт в бункер свою сотню, и каждая сотня будет знать свой проход. Чёрная армия получит постоянный гарнизон, а Хан - людей, которых можно поднять за одну ночь."
 RUS_bunker_mountain_garrison_tt:0 "Аймачное ополчение можно созывать на §Y1§! раз за войну больше."
 RUS_bunker_eternal_headquarters:0 "Ставка, которая переживёт мир"
 RUS_bunker_eternal_headquarters_desc:0 "Ставка под горой готовится пережить не войну, а конец света: свои склады, свои карты и свой неприкосновенный рацион. Если над степью ничего не останется, Хан всё равно будет отдавать приказы."
 RUS_bunker_eternal_headquarters_tt:0 "Неприкосновенный рацион: при пустом складе вместо \"Голода в галереях\" действует ослабленный дух \"Голод на рационе\"."
 RUS_bunker_research_bureau:0 "Открыть исследовательское бюро ставки"
 RUS_bunker_research_bureau_desc:0 "Ставке нужны собственные исследователи и оборудованные рабочие места."
 RUS_bunker_research_bureau_cost:0 "§Y500§! £ADISCORD_economy_treasury_texticon"
 RUS_bunker_research_bureau_cost_blocked:0 "§R500§! £ADISCORD_economy_treasury_texticon"
 RUS_bunker_research_bureau_cost_tooltip:0 "Необходимо 500 £ADISCORD_economy_treasury_texticon. При принятии решения средства списываются один раз."
 RUS_bunker_hunger_rationed:0 "Голод на рационе"
 RUS_bunker_hunger_rationed_desc:0 "Склады пусты, но ставка держится на неприкосновенном рационе. Смены сокращены, караулы получают половину пайка, и каждый день без обоза стоит дороже предыдущего."
 RUS_refugees_food_quarters_tt:0 "Пайки: до §R-15§! £supply_texticon из запасов бункера."
 RUS_sealed_throne_policy:0 "Трон под горой"
 RUS_sealed_throne_policy_desc:0 "Доступ в глубинные залы определяют пропуска и приказ ставки. Запасы, связь и защищённые помещения подчинены задаче выдержать осаду и сохранить командование, когда поверхность станет полем боя. Эта дисциплина усиливает оборону и готовность продолжать войну, но у жителей остаётся всё меньше влияния на собственную судьбу. Установленный порядок распространяется на всё государство."
 RUS_bunker_sealed_throne:0 "Ставка под горой"
 RUS_bunker_sealed_throne_desc:0 "Командование обсуждает оборону после потери поверхности. Под скалой готовят помещения для ставки и караула, которому придётся охранять последние двери."
 RUS_muster_books:0 "Полковые книги"
 RUS_muster_books_desc:0 "Вождь приводит дружину, но штаб должен знать, сколько в ней людей и сколько винтовок. Единая ведомость позволит отправить помощь туда, где её действительно не хватает."
 RUS_quartermaster_service:0 "Служба обозов"
 RUS_quartermaster_service_desc:0 "Отряд, который живёт за счёт ближайшего двора, скоро остаётся без дворов. Постоянный обоз позволит армии пройти дальше, не превращая тыл в пустыню."
 RUS_patient_doctrine_delta:0 "Изменение \"Чёрной Армии\""
 RUS_patient_doctrine_delta_desc:0 "Оборона и экономия снабжения ценой скорости наступления."
 RUS_patient_war:0 "Терпеливая война"
 RUS_patient_war_desc:0 "Ставка не обязана отвечать на каждый вызов немедленно. Подготовленные позиции, накопленные припасы и точный расчёт позволят армии выбирать время удара."
 RUS_swift_doctrine_delta:0 "Изменение \"Чёрной Армии\""
 RUS_swift_doctrine_delta_desc:0 "Подвижное наступление требует больше припасов."
 RUS_swift_columns:0 "Быстрые колонны"
 RUS_swift_columns_desc:0 "Пока сосед ищет на карте главную дорогу, ханский отряд должен уже быть у следующего перекрёстка."
 RUS_officer_courses:0 "Курсы сотников"
 RUS_officer_courses_desc:0 "Сотник должен уметь не только первым подняться в атаку, но и последним сверить ведомость потерь. Курсы оставят командиру меньше красивых оправданий."
 RUS_field_sappers:0 "Полевая инженерная служба"
 RUS_field_sappers_desc:0 "Мост, окоп и зимняя дорога - разные ответы на один вопрос: как довести людей до следующего дня. Сапёров перестанут разбирать по чужим штабам."
 RUS_artillery_tables:0 "Артиллерийская программа"
 RUS_artillery_tables_desc:0 "Учебные батареи получат орудия, общие таблицы стрельбы и занятия с пехотными наблюдателями."
 RUS_reserve_rotations:0 "Очередь резерва"
 RUS_reserve_rotations_desc:0 "Люди, вернувшиеся с фронта, не должны исчезать из полковой книги. Чередование службы даст армии резерв, комплект стрелкового оружия и оставит хозяйству хотя бы часть рабочих рук."
 RUS_anti_air_posts:0 "Небо над ставкой"
 RUS_anti_air_posts_desc:0 "Самолёт видит входы в бункер лучше, чем карту его коридоров. Наблюдательные посты и зенитные батареи защитят то, без чего даже глубокое убежище станет ловушкой."
 RUS_professional_service_delta:0 "Изменение \"Чёрной Армии\""
 RUS_professional_service_delta_desc:0 "Регулярная подготовка связывает аймаки единой военной системой."
 RUS_army_of_the_khanate:0 "Войско, которое вернётся"
 RUS_army_of_the_khanate_desc:0 "Теперь приказы требуют плана не только боя, но и возвращения. Чёрная Армия перестаёт быть собранием дружин, чья судьба кончается за ближайшим холмом."
 RUS_postwar_roads: "Защищённые линии питания"
 RUS_postwar_roads_desc: "Подстанции и кабельные трассы нельзя оставить перед наступающей армией без прикрытия. На удерживаемых реакторных участках появятся укрепления и стационарная противовоздушная оборона; войска получат дополнительные зенитные средства."
 RUS_imperial_academy: "Система наведения"
 RUS_imperial_academy_desc: "Вычислители должны удержать луч на цели сквозь помехи, потери связи и повреждения наземных узлов. Инженеры отработают производственные решения, а штаб - порядок действий при переходе на резервное управление."
 RUS_tomorrow_above_ground: "Последний приказ"
 RUS_tomorrow_above_ground_desc: "Расчёты переданы, линии питания защищены, караулы знают свои рубежи. Хану осталось подтвердить приказ, ради которого существует вся программа. До назначенного срока армия будет удерживать периметр."
 RUS_oath_of_the_empire:0 "Присяга Последней империи"
 RUS_oath_of_the_empire_desc:0 "Сотни, которые шли за ханским стягом, присягали своим аймакам. Теперь каждый боец повторит слова о единой державе, а знамя Чёрной армии впервые встанет рядом с печатью империи."
 RUS_imperial_field_kitchens:0 "Полевые кухни империи"
 RUS_imperial_field_kitchens_desc:0 "Армия, которая ест из котлов своего аймака, воюет только до первой голодной недели. Имперские обозы повезут горячую пищу на каждый участок фронта, и солдаты увидят, что держава кормит тех, кто её защищает."
 RUS_black_army_tribunals:0 "Трибуналы Чёрной армии"
 RUS_black_army_tribunals_desc:0 "Чёрная армия получит право судить трусов и дезертиров у самой линии фронта. Потери перестанут быть поводом для ропота: о них будут молчать."
 RUS_scientists_at_headquarters:0 "Учёные при штабах"
 RUS_scientists_at_headquarters_desc:0 "Инженеры и врачи учёного совета поедут в штабы корпусов. Каждую отбитую область сразу восстановят: связь, воду, госпиталь. Армия увидит, что возвращённая земля снова служит ей."
 RUS_reserve_of_the_aimaqs:0 "Последний резерв аймаков"
 RUS_reserve_of_the_aimaqs_desc:0 "В дальних аймаках ещё остались люди, которых не звали на прошлые сборы. Империя призовёт их сейчас, пока у фронта есть время принять новые бригады."
 RUS_imperial_treasury:0 "Имперская казна"
 RUS_imperial_treasury_desc:0 "Подати новых владений больше не оседают в сундуках вождей. Единая казна империи примет их напрямую и оплатит войну, которую ведут все аймаки."
 RUS_levy_of_the_new_aimaqs:0 "Набор в новых аймаках"
 RUS_levy_of_the_new_aimaqs_desc:0 "Земли, вошедшие в империю, дадут ей не только хлеб и подати. Ханские писцы составят списки призывников в каждом присоединённом аймаке."
 RUS_reactor_current_for_arsenals:0 "Ток реактора для арсеналов"
 RUS_reactor_current_for_arsenals_desc:0 "Пока реактор в руках Хана, часть его мощности можно отдать станкам. Столичные арсеналы получат новые цеха, питаемые прямо от реакторных линий."
 RUS_imperial_railways:0 "Имперские магистрали"
 RUS_imperial_railways_desc:0 "Столица и реакторный пояс должны быть связаны не тропами обозов, а железной дорогой. По новым путям к периметру пойдут эшелоны с войсками и снарядами."
 RUS_treasury_75_tt:0 "Казна получает §G75§! £ADISCORD_economy_treasury_texticon."
 RUS_engineering_order_cost:0 "[GetRUSOrderengineering_orderpp]; [GetRUSOrderengineering_ordercash]"
 RUS_engineering_order_cost_blocked:0 "[GetRUSOrderengineering_orderpp]; [GetRUSOrderengineering_ordercash]"
 RUS_engineering_order_cost_tooltip:0 "[GetRUSOrderengineering_orderpp]; [GetRUSOrderengineering_ordercash]"
 RUS_engineering_order:0 "Заказ инженерного оснащения"
 RUS_engineering_order_desc:0 "Мастерские собирают насосы, крепёж, кабель и инструмент для строительных бригад и полевых сапёров."
 RUS_rifle_order_cost:0 "[GetRUSOrderrifle_orderpp]; [GetRUSOrderrifle_ordercash]"
 RUS_rifle_order_cost_blocked:0 "[GetRUSOrderrifle_orderpp]; [GetRUSOrderrifle_ordercash]"
 RUS_rifle_order_cost_tooltip:0 "[GetRUSOrderrifle_orderpp]; [GetRUSOrderrifle_ordercash]"
 RUS_rifle_order:0 "Заказ единого калибра"
 RUS_rifle_order_desc:0 "Приёмка выкупает согласованную партию оружия для штатного набора и пополнения частей."
 RUS_market_surplus_cost:0 "[GetRUSOrdermarket_surpluspp]; [GetRUSOrdermarket_surplusrifles]"
 RUS_market_surplus_cost_blocked:0 "[GetRUSOrdermarket_surpluspp]; [GetRUSOrdermarket_surplusrifles]"
 RUS_market_surplus_cost_tooltip:0 "[GetRUSOrdermarket_surpluspp]; [GetRUSOrdermarket_surplusrifles]"
 RUS_market_surplus:0 "Продать излишки со складов"
 RUS_market_surplus_desc:0 "После сверки складов оружие из избыточных запасов можно продать местным охранным артелям."
 ADISCORD_rus_campaign.1.t:0 "Пять слоёв тишины"
 ADISCORD_rus_campaign.1.d:0 "У входа в убежище караульный не пропускал женщину с двумя мешками. Муж работал на нижней проходке; она принесла его вещи и просила оставить детей в тепле до конца смены. В списке допущенных стоял только муж. Когда появился Рустан, караульный отступил от двери.\n\nХан велел проводить семью в верхний коридор. Начальник караула Тагир Мансуров спросил, что делать завтра с остальными. Рустан задержался у стола. В книге было двадцать семь таких заявок. Он разрешил разместить семьи на ночь и приказал утром принести план всего убежища. Женщина уже ушла и последнего распоряжения не слышала.\n\nУтром пришёл инженер Глеб Корнеев. Плана он не принёс: ниже первого слоя никто не спускался много лет, и рисовать там было нечего. Сначала нужна проходка, потом обследование, и только потом разговор о том, для кого готовить нижние помещения. Мансуров уже знал ответ - защищённая ставка. Люди у входа знали другой.\n\nРустан оставил книгу заявок у себя. Он помнил, каково ждать перед чужой дверью. Теперь ни один пост не мог отказать человеку вопреки его приказу. Отдавать кому-нибудь это право Хан не собирался."
 ADISCORD_rus_campaign.1.a:0 "Начнём с тех, кто живёт наверху."
 ADISCORD_rus_campaign.2.t:0 "Человек за цифрой"
 ADISCORD_rus_campaign.2.d:0 "Первая ведомость принесла меньше дворов, чем обещали вожди, и больше людей, чем ожидала казна. Некоторые семьи прятались от сборщиков годами; другие продолжали платить за сыновей, давно ушедших из дома.\n\nСтарый писец Савва Ключарёв положил перед Ханом две книги. В одной получалась сильная страна: ровные числа, исправные поставки, никаких пустых строк. Во второй - настоящая. Рустан провёл пальцем по исправлениям и распорядился хранить обе. \"Первую - чтобы помнить, как нам врут. Вторую - чтобы было чем править\".\n\nЗа дверью уже спорили о новом совете и новой печати. На этот раз спор начнётся с известного числа живых людей."
 ADISCORD_rus_campaign.2.a:0 "Оставьте исправления видимыми."
 ADISCORD_rus_campaign.3.t:0 "Ещё один горизонт"
 ADISCORD_rus_campaign.3.d:0 "Последнюю тележку выкатили к подъёмнику уже под утро. За временным ограждением лежал новый слой - без отделки, без мебели, с лампами на открытом кабеле.\n\nПрораб не разрешил церемонию. Он перечислил трещины, показал отметки крепежа и только потом отдал акт проходки. Пустой зал ещё не был ни казармой, ни больницей, ни арсеналом. Теперь Хану предстояло решить, чья работа получит это пространство и сколько энергии можно ей обещать.\n\nНа стене рядом с номером слоя кто-то написал мелом имена ночной смены. Рустан велел не стирать их до окончания монтажа."
 ADISCORD_rus_campaign.3.a:0 "Сначала проверим своды."
 ADISCORD_rus_campaign.4.t:0 "Подпись без титула"
 ADISCORD_rus_campaign.4.d:0 "На последней странице новой переписи Рустан нашёл собственное имя. Савва Ключарёв не добавил ни титула, ни особого цвета чернил. Строка выглядела так же, как тысячи других.\n\nХан позвал старика. Тот попытался объяснить, что образец книги не предусматривает исключений, и замолчал. Рустан спросил, есть ли в образце место для умерших. Ключарёв кивнул. \"Тогда оставь так. Хорошая книга должна годиться и после меня\". Писец уже приготовил нож, чтобы выскоблить строку, и всё ещё держал его над бумагой. Рустан отодвинул лезвие к краю стола.\n\nПриказ переписали без этой фразы. Но Ключарёв её запомнил."
 ADISCORD_rus_campaign.4.a:0 "Книга остаётся."
 ADISCORD_rus_campaign.5.t:0 "Право сказать \"нет\""
 ADISCORD_rus_campaign.5.d:0 "Первое заседание коллегии закончилось отказом. Инженеры вернули военному ведомству проект перегруженного моста. Штаб прислал бумагу с ханской печатью. Коллегия приложила расчёт и вернула бумагу ещё раз.\n\nРустану предложили наказать дерзость. Он попросил прочитать расчёт вслух, дождался неловкой тишины и подписал новую смету. Государство, где каждый соглашается с правителем, слишком часто строит мосты в один конец. Военный посланник забрал обе бумаги. У дверей он спросил инженера, какой груз мост всё-таки выдержит, и впервые за заседание записал ответ.\n\nНа следующий день в мастерские впервые пришёл приказ с исправлением, заверенным той же печатью, что и первоначальная ошибка."
 ADISCORD_rus_campaign.5.a:0 "Расчёт сильнее спешки."
 ADISCORD_rus_campaign.6.t:0 "План, который можно выполнить"
 ADISCORD_rus_campaign.6.d:0 "Глеб Корнеев раскатал план на длинном столе. Для каждого из пяти слоёв он принёс два расчёта размещения оборудования. Тагир Мансуров сразу выбрал казармы у входа. Фельдшер Нина Шалаева положила поверх чертежа список семей: если люди будут жить снаружи, их придётся впускать при каждой тревоге.\n\nСпорили до смены дежурных. Корнеев несколько раз возвращал разговор к общему подъёмнику: пока везут крепёж, станки останутся наверху. Он отказался подписать обещание одновременной работы на двух слоях. Рустан перечеркнул этот пункт.\n\nПлан оставили на столе. На полях Шалаева карандашом обвела лестницу, Мансуров - командный коридор. Хан долго смотрел на обе пометки. Убежище не могло стать сразу городом и ставкой, и люди за столом понимали: от его выбора будет зависеть, кого впустят вниз при следующей тревоге."
 ADISCORD_rus_campaign.6.a:0 "Бригаде - первый заказ."
 ADISCORD_rus_campaign.7.t:0 "За шумом машин"
 ADISCORD_rus_campaign.7.d:0 "Верхние этажи уже жили по собственному расписанию. За закрытой дверью работали механики, в коридоре спорили кладовщики, дежурный ругался на чужой кабель. Бункер перестал быть пустотой, которую предстояло заполнить.\n\nНижний горизонт оказался тише. Геолог передал Хану кусок тёмной породы и предложил остановиться на достигнутом. Не потому, что дальше нельзя. Потому, что дальше каждый метр будет дороже.\n\nРустан оставил камень на столе рядом с печатью. Разрешение на два новых слоя он подписал без праздничного обращения. Страна уже заплатила за право выбирать. Теперь предстояло научиться выбирать без торопливости."
 ADISCORD_rus_campaign.7.a:0 "У нижних этажей тоже будет смета."
 ADISCORD_rus_campaign.8.t:0 "Перед испытанием"
 ADISCORD_rus_campaign.8.d:0 "Комиссия прошла все пять слоёв. У каждой двери сверили назначение помещения и имя ответственного. Строители передали ключи службам, а Тагир Мансуров получил утверждённый порядок доступа. Теперь выбранный проект стал действующим городом или ставкой.\n\nПоследний акт Глеб Корнеев подписывать не стал. Он попросил тридцать дней: посмотреть, хватит ли снабжения работающим помещениям и удержат ли своды нынешнюю нагрузку. В кладовой отметили начальный остаток. Дежурным приказали записывать каждую недостачу, даже если её успеют закрыть к утру.\n\nХан назначил дату следующего доклада. Праздничные флаги оставили в ящике. Люди уже работали внизу; комиссия ещё не могла обещать им, что всё выдержит."
 ADISCORD_rus_campaign.8.a:0 "Остаётся решить, кому служат двери."
 ADISCORD_rus_campaign.9.t:0 "Открытая лестница"
 ADISCORD_rus_campaign.9.d:0 "Нина Шалаева пришла за ответом до начала смены. Она ожидала разрешения поставить ещё несколько коек в коридоре. Вместо этого Корнеев показал ей места для будущего жилья и спросил, какой проход нужен носилкам. Мансуров потребовал сохранить отдельный вход в командные помещения. На плане появились две двери.\n\nРустан утвердил гражданский проект и постоянную поставку продовольствия. Шалаева спросила, придётся ли каждой семье снова просить его разрешения после окончания стройки. Хан велел записать правила допуска для всех.\n\nОна взяла свою копию. Старый список временно размещённых остался у Рустана. Имена он уже выучил; напротив одного стояла просьба отпустить семью к родным. Хан попросил сначала выяснить, почему они хотят уехать."
 ADISCORD_rus_campaign.9.a:0 "Пусть приходят по своим делам."
 ADISCORD_rus_campaign.10.t:0 "Трон под горой"
 ADISCORD_rus_campaign.10.d:0 "Тагир Мансуров разложил на плане карточки постов. При потере верхнего входа связь с армией должна была сохраниться. Глеб Корнеев отвёл для неё вспомогательную линию питания и потребовал не подключать к ней жилые комнаты. На этот раз спорить было не о чем: генератор не выдержал бы обе нагрузки.\n\nРустан утвердил проект ставки. Командир попросил внести семьи дежурных в список эвакуации. Хан согласился, затем спросил, кто проверит список. Командир назвал своего заместителя. Рустан велел приносить его лично.\n\nУ выхода ждали люди, которым обещали временное жильё. Мансуров объяснил новый порядок и записал их имена. Никого не выгнали. Никому не сказали, сколько продлится временное размещение."
 ADISCORD_rus_campaign.10.a:0 "Связь с поверхностью не отключать."
 ADISCORD_rus_campaign.11.t: "Последний приказ"
 ADISCORD_rus_campaign.11.d:0 "На карте больше не было соседнего гегемона, который мог приказать Хану отступить. Победные ведомости сложили в архив; трофейные знамёна убрали из проходов, потому что они мешали носить мебель.\n\nУтром к Рустану пришли с обычными делами. Требовался мост. В училище не хватало места. В новом округе спорили о цене зерна. Хан слушал и постепенно понимал, что именно эти просьбы означают победу сильнее, чем присоединённые земли. Люди рассчитывали не переждать его царствование, а жить в нём.\n\nОн поднялся на поверхность до смены караула. Над рабочими посёлками стоял дым, по дороге шёл первый грузовик. Последняя империя встретила ещё один день, и этот день не требовал последнего приказа."
 ADISCORD_rus_campaign.11.a:0 "Поставьте мост первым в повестке."
