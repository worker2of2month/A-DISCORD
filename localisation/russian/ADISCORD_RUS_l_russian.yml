 RUS_stolen_designs:0 "Выкраденные чертежи"
 RUS_shadow_engineers:0 "Переманить инженеров"
 RUS_shadow_engineers_desc:0 "Соседские инженеры давно сидят без жалованья. Хан предложит им паёк, жильё под землёй и работу по специальности, а их бывшие начальники быстро поймут, куда исчезли лучшие люди."
