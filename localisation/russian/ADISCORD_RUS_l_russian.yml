 RUS_faction_support:0 "Поддержка учёных и Чёрной армии"
 RUS_faction_support_state_tt:0 "Поддержка Чёрной армии: §Y[?RUS_black_army_support|%0]§!, учёных: §Y[?RUS_scientists_support|%0]§!. Поддержка выше 50% приносит £political_power_texticon и тянет баланс к своей стороне."
