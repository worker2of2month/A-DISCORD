 ADISCORD_rus_campaign.36.t:0 "Часы приёма"
 ADISCORD_rus_campaign.36.d:0 "Расписку я завернула в платок, чтобы не промочить. За мужа снова требовали подать. Он умер осенью, старшина это знал, сборщик тоже, но в новой книге против нашего двора стояло двое взрослых. В канцелярии сказали принести старую книгу. Старая сгорела ещё до прихода ханских людей. Сын стоял рядом, натянув рукава на пальцы. Я сидела под дверью и перебирала объяснения. Ни одно не казалось достаточно убедительным.\n\nМать рассказывала, что до катастрофы у каждого документа было своё место. Люди могли уехать в другой город, написать домой, получить ответ. Потом случилась катастрофа реактора. 2130-й она до смерти называла просто \"тем годом\". Вслед за ним пришли вести о революции в Воркерланде. Менялись печати, названия, люди с оружием. У нас оставались чужие бумаги, по которым требовали зерно. Мать учила хранить все: никогда не знаешь, какая власть вернётся.\n\nКогда в коридоре замолчали, я решила, что приём окончен. Писец встал. Караульный убрал руку с пояса. В дверях был человек, которого я прежде не видела, и мне не понадобилось спрашивать, кто это. О Хане говорили, что он не стареет, что под землёй ему слышно каждое произнесённое имя. Соседка уверяла, что видела его много лет назад. Потом отказывалась рассказывать. Я смотрела на край его рукава и боялась поднять глаза.\n\nОн спросил, зачем я пришла. Я сбилась на слове \"муж\" и протянула платок вместе с бумагой. Хан не взял его. Писец прочитал вслух, объяснил ошибку, начал обещать взыскание со сборщика. Хан перебил:\n- Мёртвого вы считаете. Живых кто считает?\nОн спросил, сколько у меня детей, кто работает, чем кормимся. Я отвечала так быстро, будто от промедления ответы могли стать неверными. Писец открыл другую ведомость.\n\nСын всё это время стоял у стены. Когда Хан повернулся, он вытянулся и спрятал руки за спину, словно его застали за дурным делом. Хан посмотрел на слишком длинные рукава. Хотел что-то сказать, но помедлил. Потом указал на скамью:\n- Сядь.\nМальчик посмотрел на караульного. Хан повторил тише. Сам подвинул лежавшую на скамье папку и дождался, пока сын сядет. Я уже открыла рот, чтобы поблагодарить, но он отвернулся к писцу.\n\nПодать велели исправить. У выхода я прижала расписку к груди, и караульный нетерпеливо показал на дверь. Я шла сюда доказать, что муж умер. Теперь в канцелярии знали, сколько нас осталось, где мы живём и что можем делать. За спиной ещё скрипело перо. Я не обернулась."
 ADISCORD_rus_campaign.36.a:0 "Только бы больше не позвали."
 ADISCORD_rus_campaign.37.t:0 "Под старой краской"
 ADISCORD_rus_campaign.37.d:0 "На самом старом плане бункера не было ни ханской печати, ни командного зала. Были вентиляционные шахты, резервуары и ряды одинаковых прямоугольников. Я долго принимал их за ящики. Потом нашёл пояснение: спальные места. Человек, чертивший этот лист, старался разместить как можно больше людей и всё-таки оставил между рядами проход для носилок. Фамилия в углу выцвела. Размеры ещё читались.\n\nВ шкафу строительной службы сохранился журнал за 2130 год. После первых записей о реакторной катастрофе в нём перестали указывать должности прибывших. Писали число людей, состояние фильтров, остаток воды. Несколько страниц занимали просьбы узнать о родственниках. На одной дежурный вывел: \"Ответа с поверхности нет\". Ниже другой рукой было добавлено то же самое. Я провёл пальцем по краю листа. Его столько раз переворачивали, что бумага стала мягкой, как ткань.\n\nДальше шли листы с новыми печатями. В годы после катастрофы и революции в Воркерланде здесь менялись начальники и назначение комнат. В бывшем помещении для семей устроили склад, потом караульную. Старые подписи закрашивали, поверх писали новые. Теперь мы снимали эту краску под кабель, и из стены проступало слово \"выдача\". Чего выдача, уже нельзя было разобрать. Рабочий спросил, оставлять ли надпись. Я велел пока не трогать.\n\nХану я принёс только чертёж. Он слушал молча, пока я объяснял расширение лестницы. Когда заговорил о носилках, поднял глаза:\n- Сколько человек вы потеряете, если проход останется таким?\nЯ назвал примерное число. Он потребовал точное. Пришлось объяснить, что это зависит от аварии, смены, места обвала. Хан подождал, пока я закончу, и велел переделать смету. Ни одного вопроса о том, кто здесь жил прежде, он не задал.\n\nВернувшись, я увидел, что рабочий уже приготовил кисть. На стене ждали места для нового номера помещения. Я снял размеры со старой надписи и перенёс их в блокнот, сам не зная зачем. Потом разрешил красить. Завтра сюда придут люди, которым понадобятся свет, воздух и достаточно широкий проход. На плане будет стоять другая печать. Я постараюсь сохранить хотя бы проход."
 ADISCORD_rus_campaign.37.a:0 "Сохранить ширину прохода."
 ADISCORD_rus_campaign.38.t:0 "Что слышно наверху"
 ADISCORD_rus_campaign.38.d:0 "Из трубки слышно, как караульный торопливо поднимается. Докладывает о воротах, смене, патронах. Я спрашиваю о погоде. Он замолкает, и я представляю, как смотрит на начальника поста: не пропустил ли чего, не сказал ли лишнего. Потом отвечает, что идёт дождь. Где-то рядом скрипит стул. Караульный начинает доклад сначала. Я позволяю ему закончить.\n\nВ 2130 году ещё можно было надеяться, что самое страшное уже произошло. Реактор разрушен, родных больше нет, но я жив, брат жив; если добраться до следующего дня, что-нибудь останется. Я помню это ожидание лучше лиц. Сначала ждёшь известий. Потом ищешь человека, который мог видеть твоих близких. Потом перестаёшь спрашивать, потому что заранее узнаёшь выражение, с которым тебе ответят. От семьи нас осталось двое. Во время революции в Воркерланде погиб и брат, Ян. Ему было девятнадцать.\n\nЛюди наверху ничего этого не знают. Для них я всегда был Ханом. Они передают друг другу рассказы, которые не решились бы повторить при моём карауле. Пусть. В этих рассказах я не жду ответа, не опаздываю, не стою перед чужой дверью с бесполезным вопросом. Они придумали мне удобное прошлое. Настоящее принадлежит мне одному. Имя Марк некому произнести так, как произносили дома.\n\nКараульный всё ещё ждёт. На заднем плане кто-то кашляет, затем резко затихает. Передо мной утренние ведомости. В одной шестеро не вернулись с работ; ниже начальник участка написал: \"Допустимые потери\". Я обвёл последнее слово. Пусть принесёт наряды, фамилии, время выхода каждой смены. Пусть покажет, где я это допустил. Он уже присылал исправленный итог, но я вернул бумагу. Шесть человек не могли исчезнуть между двумя столбцами.\n\nИногда среди просителей оказывается ребёнок, который прячет руки в рукава и ждёт разрешения сесть. Я замечаю его раньше, чем успеваю решить, зачем смотрю. Мне хочется усадить его, накормить, убрать от него взрослых, перед которыми он так старательно стоит прямо. На несколько мгновений я знаю, чего он боится, без всякого доклада. Тогда приходится следить за голосом: от моего окрика он вздрогнет так же, как от чужого. Даже взяв хлеб, он продолжает стоять. Я отхожу к окну, чтобы он наконец начал есть.\n\nБункер выдержал испытание. Насосы работают, на нижних этажах сухо. Под ведомостями лежит просьба нескольких семей отпустить их к родственникам до зимы. Писец приложил список: двое слесарей, фельдшер, остальные заняты на складах. Я отодвигаю лист. Сначала нужно закончить нижний горизонт. Потом понадобятся люди для монтажа. На полях оставляю короткое: \"Повторно не подавать. Вызвать по окончании работ\". Дату не ставлю.\n\n- Продолжать службу, - говорю я.\nВ трубке немедленно отвечают. Я ещё несколько секунд держу её у уха. Ни одного знакомого голоса там не будет."
 ADISCORD_rus_campaign.38.a:0 "Продолжать службу."
 ADISCORD_rus_campaign.39.t:0 "По ту сторону периметра"
 ADISCORD_rus_campaign.39.d:0 "Первое донесение принесли ещё до смены караула. На старой дороге больше не проверяли пропуска, у заграждений стояли брошенные машины, а пограничный телефон отвечал голосом человека, который не знал прежних позывных. Следом заговорили другие посты. Периметр не был прорван в одном сражении: служба, державшая его закрытым, распалась на отдельные гарнизоны, и каждый теперь решал сам, кого пропускать и чьи приказы исполнять.\n\nВ ханской ставке развернули карты западного пояса. Под штриховкой, годами обозначавшей запретную землю, обнаружились дороги, склады и жилые посёлки. За ними стояли свои советы, командиры и вооружённые отряды. Грязная зона оказалась не пустотой, которую можно занять одним приказом, а целым краем, где уже делили власть. Теперь его дороги вели и к Земле Хана.\n\nРустан долго слушал доклады, не отрывая взгляда от карты. Потом придвинул к себе список пограничных сотен и велел собрать представителей аймаков. Пока соседи выясняли, кто имеет право говорить от имени открывшихся земель, Хан собирался предъявить собственные притязания. Оставалось решить, какие дороги занять первыми и хватит ли сил удержать то, что лежит за ними."
 ADISCORD_rus_campaign.39.a:0 "Пора смотреть дальше наших застав."
 RUS_dirty_zone_focuses_unlocked_tt:0 "Открыта новая ветка национальных фокусов по освоению Грязной зоны, начиная с \"§Y$RUS_claim_the_opened_zone$§!\". Далее следуют \"§Y$RUS_drive_starolesye_back$§!\" и \"§Y$RUS_press_the_closed_zone$§!\". Предыдущие фокусы и условия каждого этапа по-прежнему обязательны. Походы открываются соответствующими фокусами и начинаются отдельными решениями."

 RUS_favours_status_requires_war:0 "§RДоступно только во время войны.§!"
 RUS_bunker_open_city_project_tt:0 "Сразу: §G+1§! £supply_texticon производства пищи в неделю. После \"Принять подземный комплекс\" вводится городской порядок; затем доступны гражданские программы бункера. Выбор не строит помещения и не меняет оплаченные работы."
 RUS_bunker_sealed_throne_project_tt:0 "Сразу: §G+1§! £energy_consumption_texticon мощности. После \"Принять подземный комплекс\" вводится режим ставки; затем доступны её резервные программы. Выбор не строит помещения и не меняет оплаченные работы."
 ADISCORD_rus_campaign.40.t:0 "Кто вправе остановить работу"
 ADISCORD_rus_campaign.40.d:0 "Первое заседание совета началось с остановленного насоса. Командир требовал снова запустить насос: без воды его люди не могли уйти на сбор. Глеб Корнеев отказался. Внутри корпуса оставался рабочий.\n\nРустан вызвал начальника смены. Тот подтвердил, что люди ещё не вышли. Командиру велели ждать. Когда насос запустили, сбор уже опоздал на несколько часов.\n\nСтаршина предложил записать, кто может остановить такую работу в следующий раз. Корнеев настоял на подписи ответственного специалиста; старшина - на праве общины прислать своего представителя. Хан согласился поручить совету гражданские службы и обучение. Общий сбор будет идти медленнее, зато возражение больше не нужно нести к самому караулу.\n\nПеред уходом Рустан потребовал копии всех остановленных нарядов. Корнеев уточнил, нужно ли ждать его разрешения на безопасный пуск. Хан ответил, что приказа ждать не нужно. Копии всё равно должны лежать на его столе."
 ADISCORD_rus_campaign.40.a:0 "Записать полномочия совета."
 ADISCORD_rus_campaign.41.t:0 "До рассмотрения жалобы"
 ADISCORD_rus_campaign.41.d:0 "Караван пришёл ночью без двух повозок. Старшина утверждал, что лошади нужны на посевной; командир показывал приказ о сборе. Утром оба ждали у дверей Хана. За ними сидел возчик с перевязанной рукой: его побили, когда он попытался забрать упряжь.\n\nРустан приказал Нине Шалаевой осмотреть возчика. Командиру велел принять две недостающие упряжки из резерва. Общинных лошадей, уже приведённых на сбор, возвращать не стали. Затем положил перед ним книгу окружных заявок. Отныне военная канцелярия должна была назначать исполнителей и отвечать за снабжение общего сбора. Ссылаться на устный приказ старшины больше не позволялось.\n\nСтаршина спросил, кто вернёт общине лошадей. Командир назвал срок. Хан велел записать его и дать старшине копию. Но жалобу разрешили разбирать только после отправки обоза. Старшина взял бумагу, перечитал дату и спросил, чем до тех пор пахать. В комнате уже обсуждали следующую поставку."
 ADISCORD_rus_campaign.41.a:0 "Канцелярия отвечает за исполнение."
 ADISCORD_rus_campaign.42.t:0 "Учительница из Старолесья"
 ADISCORD_rus_campaign.42.d:0 "Пленных со старолесской заставы привели к ставке под утро. Среди ополченцев была женщина в шинели не по росту. На допросе она назвала себя учительницей: школа стояла в двух километрах от межи, и старшие ученики ушли на заставу вместе с ней.\n\nОфицер разведки разложил на столе её планшет. Карт в нём не оказалось - только классный журнал. Против многих фамилий стояли отметки о болезни, против некоторых - короткое слово \"застава\". Последние строки были заполнены другими чернилами, наспех.\n\nРустан спросил, почему Старолесье держит межу, если Воркерланда больше нет. Учительница ответила не сразу. При Воркерланде по этой дороге приходили люди периметра со списками, кого увезти на работы. Теперь пришли люди Хана с такими же списками и другими печатями. Её ученики не стали ждать, чем новые списки отличаются от старых.\n\nХан взял журнал. Он долго смотрел на графу, где прежде отмечали происхождение ученика: её заклеили полоской бумаги, и под полоской ещё проступали буквы. Рустан спросил, кто её заклеил.\n- Я, - сказала она. - В первый год после революции.\n\nОн приказал накормить пленных и держать их отдельно до конца похода. Учительница попросила разрешения написать родителям тех, кто не вернулся с заставы. Хан согласился и потребовал копию списка. Вечером Савва Ключарёв переписал фамилии в общую книгу потерь. Против каждой Рустан поставил ту же отметку, что и против своих."
 ADISCORD_rus_campaign.42.a:0 "Пусть пишет родителям."
 ADISCORD_rus_campaign.43.t:0 "Перепись в занятом городе"
 ADISCORD_rus_campaign.43.d:0 "Переписчики пришли на третий день после того, как ушли пушки. Двое с книгами и один с винтовкой, который всё время смотрел на наши окна. Они сели в бывшей почте, где при прежней власти выдавали пропуска, и повесили на дверь бумагу с ханской печатью. Печать была новой. Гвоздь остался старым.\n\nОчередь стояла до вечера. Впереди меня мужчина объяснял, что его дом записан на брата, а брат ушёл с ополчением. Писец не спорил. Он спросил, жив ли брат, и, не дождавшись ответа, оставил пустую строку. Потом то же повторилось с женщиной, у которой забрали корову, и со стариком, который не помнил года рождения. Пустых строк становилось больше, чем заполненных.\n\nКогда подошла моя очередь, я назвал дочь и жену. Писец спросил, кем я работал. Я сказал: на насосной, пока она работала. Он кивнул так, словно знал, что насосную снова запустят, и записал меня туда раньше, чем я успел согласиться. Мне выдали карточку на паёк. На обороте стояли часы приёма жалоб.\n\nВечером соседи собрались во дворе. Одни говорили, что при Хане хотя бы считают. Другие - что при Воркерланде тоже считали, а потом увозили по списку. Учитель из нашей школы молчал: школу заняли под казарму, и парты вынесли во двор. Моя дочь сидела на одной из них и болтала ногами. Ботинки не доставали до земли.\n\nНочью я перечитывал карточку. Моё имя было написано аккуратно, без ошибок, тем же почерком, что и чужие пустые строки. Я не знал, радоваться ли этому. Утром у почты уже стояли люди с жалобами, и солдат пропускал их по одному."
 ADISCORD_rus_campaign.43.a:0 "Явиться на насосную к утру."
 ADISCORD_rus_campaign.44.t:0 "Опыт без второго автора"
 ADISCORD_rus_campaign.44.d:0 "Операцию назвали \"Последний закат\" штабисты; Рустан название не исправил. Ночью он потребовал все папки Дориана Воркса, прошедшие через бункер, и расписание сеансов спутника. Глеб Корнеев принёс их сам и остался у двери.\n\nХан читал не расчёты. Он искал в бумагах место, где Воркс сомневался. Такого места не было. Был человек, который решил, что мир застыл, и присвоил себе право его толкнуть. Рустан помнил вопрос, оставленный открытым в училище: чем от Воркса отличается правитель, уверенный, что будущее возможно только при его порядке. Теперь он отвечал себе сам.\n\nВоркс верил, что опыт можно продолжить: после взрыва придут другие поколения и получат результат. Рустан в продолжение не верил. Он видел, что бывает после каждой революции. Гербы сбивают, бланки сжигают, а нижнюю строку всё равно заполняют первой. Новые хозяева заводов соберут новые армии, новые учителя будут проверять манжеты раньше урока. Любой порядок, который он оставит, переживёт его ровно настолько, чтобы стать чужим.\n\nКорнеев спросил, что объявить подданным о целях операции. Хан ответил, что подданным объявят о конце войн. Это была правда. Инженер долго молчал, потом спросил, как люди поймут, что всё закончилось. Сигнала не будет: после удара не останется ни приборов, ни тех, кто прочтёт показания.\n\nРустан закрыл последнюю папку.\n- Будет, - сказал он. - Звонок.\nКорнеев не понял. Хан не стал объяснять. Он подписал распоряжение готовить канцелярию к провозглашению и впервые за много месяцев не попросил принести утренние ведомости."
 ADISCORD_rus_campaign.44.a:0 "Готовить провозглашение."
 ADISCORD_rus_campaign.45.t:0 "Коммутатор внутреннего кольца"
 ADISCORD_rus_campaign.45.d:0 "Химическая сотня вошла в узел связи периметра на второй день похода. Здание стояло за внутренним кольцом заграждений и снаружи казалось брошенным. Внутри горел свет. За коммутатором сидела пожилая телефонистка в форме службы, которой больше не существовало. Оружия она не испугалась. Она попросила не наступать на кабели.\n\nОна работала здесь с 2130 года: сначала со сменой, потом одна. Каждую ночь обзванивала посты по списку и просила открыть ворота ремонтной смене, как полагалось по инструкции. Когда на карте появлялся новый пост, его номер вписывали в список. Так линия дошла до ханской канцелярии. Телефонистка удивилась, что там отвечают.\n\nВ соседней комнате связисты нашли библиотеку записей. Голоса для пустых дорог служба собирала заранее: родственников эвакуированных, будущих охранников, людей, которых собиралась принять на службу. Новичку на посту включали голос матери, называвший его по имени, и смотрели, откроет ли он дверь. Тех, кто открывал, не брали. А по служебному кабелю, уходившему к реакторным цехам, по ночам говорили живые: несколько семей так и остались в старых мастерских внутреннего кольца.\n\nХану передали трубку. Телефонистка спросила, кто теперь командует округом, чтобы записать в журнал. Рустан назвал себя. Она записала, повторила по буквам и попросила подтвердить приём следующей смены.\n\nОн подтвердил. Потом приказал оставить её на посту, выдать паёк и отправить в мастерские сухую одежду. Связист спросил, отключать ли линию в канцелярию. Хан ответил, что не нужно. Ночью телефон зазвонил снова, ровно в тот же час."
 ADISCORD_rus_campaign.45.a:0 "Подтвердить приём."
 RUS_crisis_epilogue_science_accepted: "\n\nВ деле об эвакуации лежали отметки о прибытии: врачи, преподаватели, семьи, архивные ящики. Транспорт вывез их до удара, принимающая служба подтвердила размещение. Учитель приложил список книг, которые взял для детей. Позднейших донесений в деле не было."
 RUS_crisis_epilogue_science_declined: "\n\nВ описи остался перечёркнутый список врачей, преподавателей и архивных ящиков: в перевозке было отказано. Дежурный искал знакомые фамилии среди тех, кто успел пройти в бункер другим путём. Сверить список было не с кем."
 RUS_crisis_epilogue_science_unsettled: ""
 RUS_crisis_epilogue_army_accepted: "\n\nПоследняя ведомость резервов подтверждала: раненых приняли, смену накормили и дали ей отдых. Затем людей снова отправили к частям. После удара донесений от этих частей не поступало."
 RUS_crisis_epilogue_army_declined: "\n\nК последней ведомости резервов был подшит приказ оставить кадровую смену в общей очереди довольствия. Начальник службы вновь запросил отдельное размещение и отдых для тех же людей. Ответ на повторную заявку так и не составили."
 RUS_crisis_epilogue_army_unsettled: ""
 RUS_crisis_epilogue_districts_accepted: "\n\nВ журнале лежало последнее подтверждение с дороги: оплаченный обоз дошёл, продовольствие раздали, деньги передали на укрытия. Сообщение приняли до удара. Радист снова вызывал станцию, где за него расписались. Теперь она молчала."
 RUS_crisis_epilogue_districts_declined: "\n\nМежду страницами журнала осталась просьба округов о продовольствии и деньгах на укрытия. На ней стоял отказ. Посланцы увезли обратно ханские грамоты; у радиста сохранились их позывные. Теперь они молчали."
 RUS_crisis_epilogue_districts_unsettled: ""
 ADISCORD_rus_crisis.5.active_project:0 "Последние участники вмешательства сложили оружие. Их земли вместе с владениями вступивших в войну союзников и зависимых стран перешли под власть империи.\n\nНачальник штаба пришёл к Хану с Глебом Корнеевым. Он попросил остановить чрезвычайную программу и передать транспорт восстановительным бригадам. Вражеских армий, ради которых требовали последнего усилия, больше не осталось. Корнеев подтвердил: передатчик можно отключить.\n\nРустан спросил, остались ли в захваченных городах заводы. Начальник штаба ответил, что теперь они работают на империю. Хан спросил, на кого они будут работать после него.\n\nШтабист положил на стол список тех, кто ждал возвращения домой. Хан не взял его. Он вызвал дежурного связиста и потребовал подтвердить прежний график. Корнеев напомнил, что в расчёте остаются и покорённые города. Рустан ответил, что список целей менять не надо.\n\nСвязист передал распоряжение."
