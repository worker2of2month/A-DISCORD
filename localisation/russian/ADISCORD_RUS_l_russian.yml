 RUS_bunker_upgrade_2_ui_tt:0 "§YУлучшить установленное помещение§!\n[GetRUSBunkerUpgradeReward2]\n\nЦена: [GetRUSBunker30pp]  [GetRUSBunker30cash]  [GetRUSBunker30equipment]\nСрок: §Y28 дн.§!\nМощность и расход пищи не увеличатся.\n\n[GetRUSBunkerUpgrade2]\nНужен фокус \"[GetRUSBunkerRecipe2]\".\n\n[GetRUSBunkerForecastUpgrade2]"
 RUS_bunker_workshop_compact:0 "Мастерские"
 RUS_bunker_workshop_ui_tt:0 "§YПодземный арсенал§!\n§G+15%§! к выпуску снаряжения на всех военных заводах страны.\nНа склад еженедельно: §G+36§! £infantry_equipment_texticon и §G+1§! £support_equipment_texticon.\n\nЦена: [GetRUSBunker15pp]  [GetRUSBunker15cash]  [GetRUSBunker15equipment]\nСрок: §Y28 дн.§!\nСодержание: §Y3§! £energy_consumption_texticon; §Y1§! £supply_texticon в неделю.\n\nПлатные программы при действующем арсенале: \"Заказ инженерного оснащения\" - §G150§! £support_equipment_texticon вместо 100; \"Обучение мастеров и подмастерьев\" - §G+40§! £ADISCORD_country_development_texticon экономики вместо 25.\n\n[GetRUSBunkerRoomworkshop]\nНужен фокус \"[GetRUSBunkerRecipe3]\".\n\n[GetRUSBunkerForecastworkshop]"
 RUS_bunker_granary_compact:0 "Амбары"
 RUS_bunker_granary_ui_tt:0 "§YПродовольственные камеры§!\n§G-5%§! товаров народного потребления: больше фабрик свободно для строительства.\nПродовольствие: §G+5§! £supply_texticon в неделю.\n\nЦена: [GetRUSBunker16pp]  [GetRUSBunker16cash]  [GetRUSBunker16equipment]\nСрок: §Y28 дн.§!\nСодержание: §Y1§! £energy_consumption_texticon; §Y1§! £supply_texticon в неделю.\n\n[GetRUSBunkerRoomgranary]\nНужен фокус \"[GetRUSBunkerRecipe3]\".\n\n[GetRUSBunkerForecastgranary]"
 RUS_bunker_upgrade_3_ui_tt:0 "§YУлучшить установленное помещение§!\n[GetRUSBunkerUpgradeReward3]\n\nЦена: [GetRUSBunker30pp]  [GetRUSBunker30cash]  [GetRUSBunker30equipment]\nСрок: §Y28 дн.§!\nЕщё §Y1§! £energy_consumption_texticon мощности; расход пищи не увеличится.\n\n[GetRUSBunkerUpgrade3]\nНужен фокус \"[GetRUSBunkerRecipe3]\".\n\n[GetRUSBunkerForecastUpgrade3]"
 RUS_bunker_clinic_compact:0 "Клиника"
 RUS_bunker_clinic_ui_tt:0 "§YХирургический ярус§!\n§G+16%§! возвращения боевых потерь в людской резерв.\n\nЦена: [GetRUSBunker17pp]  [GetRUSBunker17cash]  [GetRUSBunker17equipment]\nСрок: §Y28 дн.§!\nСодержание: §Y2§! £energy_consumption_texticon; §Y1§! £supply_texticon в неделю.\n\nПлатная программа при действующем медблоке: \"Подготовить окружных фельдшеров\" - §G+40§! £ADISCORD_country_development_texticon социальной системы вместо 25.\n\n[GetRUSBunkerRoomclinic]\nНужен фокус \"[GetRUSBunkerRecipe4]\".\n\n[GetRUSBunkerForecastclinic]"
 RUS_bunker_laboratory_compact:0 "Лаборатория"
 RUS_bunker_laboratory_ui_tt:0 "§YЛаборатория§!\n§G+10%§! скорости всех исследований страны.\n\nЦена: [GetRUSBunker18pp]  [GetRUSBunker18cash]  [GetRUSBunker18equipment]\nСрок: §Y28 дн.§!\nСодержание: §Y3§! £energy_consumption_texticon; §Y1§! £supply_texticon в неделю.\n\n\"Реакторные сплавы\": ещё §G50%§! ускорения одного исследования технологий поддержки, если лаборатория работает при завершении проекта. Воздушный линкор доступен и с медблоком.\n\n[GetRUSBunkerRoomlaboratory]\nНужен фокус \"[GetRUSBunkerRecipe4]\".\n\n[GetRUSBunkerForecastlaboratory]"
 RUS_bunker_upgrade_4_ui_tt:0 "§YУлучшить установленное помещение§!\n[GetRUSBunkerUpgradeReward4]\n\nЦена: [GetRUSBunker30pp]  [GetRUSBunker30cash]  [GetRUSBunker30equipment]\nСрок: §Y28 дн.§!\nЕщё §Y1§! £energy_consumption_texticon мощности; расход пищи не увеличится.\n\n[GetRUSBunkerUpgrade4]\nНужен фокус \"[GetRUSBunkerRecipe4]\".\n\n[GetRUSBunkerForecastUpgrade4]"
 RUS_bunker_archive_compact:0 "Архив"
 RUS_bunker_archive_ui_tt:0 "§YАрхив§!\n§G+0.35§! £political_power_texticon в день.\n\nЦена: [GetRUSBunker19pp]  [GetRUSBunker19cash]  [GetRUSBunker19equipment]\nСрок: §Y28 дн.§!\nСодержание: §Y1§! £energy_consumption_texticon; §Y1§! £supply_texticon в неделю.\n\nПосле \"Подготовки управленцев\" действующий архив добавляет §G+15§! £ADISCORD_country_development_texticon государственного аппарата к каждой оплаченной программе чиновников.\n\n[GetRUSBunkerRoomarchive]\nНужен фокус \"[GetRUSBunkerRecipe5]\".\n\n[GetRUSBunkerForecastarchive]"
 RUS_bunker_command_compact:0 "Командный зал"
 RUS_bunker_command_ui_tt:0 "§YКомандный зал§!\n§G+8%§! максимального бонуса планирования; §G+8%§! защиты всех дивизий.\n\nЦена: [GetRUSBunker20pp]  [GetRUSBunker20cash]  [GetRUSBunker20equipment]\nСрок: §Y28 дн.§!\nСодержание: §Y2§! £energy_consumption_texticon; §Y1§! £supply_texticon в неделю.\n\n[GetRUSBunkerRoomcommand]\nНужен фокус \"[GetRUSBunkerRecipe5]\".\n\n[GetRUSBunkerForecastcommand]"
 RUS_bunker_upgrade_5_ui_tt:0 "§YУлучшить установленное помещение§!\n[GetRUSBunkerUpgradeReward5]\n\nЦена: [GetRUSBunker30pp]  [GetRUSBunker30cash]  [GetRUSBunker30equipment]\nСрок: §Y28 дн.§!\nМощность и расход пищи не увеличатся.\n\n[GetRUSBunkerUpgrade5]\nНужен фокус \"[GetRUSBunkerRecipe5]\".\n\n[GetRUSBunkerForecastUpgrade5]"
 RUS_bunker_food_ui_tt:0 "§YПродовольственный обоз§!\nЦена: [GetRUSBunker31pp]  [GetRUSBunkerFoodCash]\n\nСразу доставляет [GetRUSBunkerConvoyAmount]. Нужен работающий комплекс и место под всю партию.\n\nСейчас: [GetRUSBunkerFoodState]\nОбоз пополнит запас и снимет голод. Если запас достигнет §Y[?RUS_bunker_food_fed_line|0]§! £supply_texticon, оснащённый комплекс получит сытость: +5% стабильности и +5% скорости пополнения. Недельный баланс останется [?RUS_bunker_food_balance|=+0] £supply_texticon. Строительная бригада не занята подвозом."
