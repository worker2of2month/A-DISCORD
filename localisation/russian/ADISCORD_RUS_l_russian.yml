 RUS_bunker_guard_desc:0 "Стража получает постоянные казармы и учебный двор под бетонным небом. Дисциплина начинается с кровати, которую солдат не делит с ящиком патронов.\n\nСтроительство: 21 день. Один вариант на слой.\nСодержание: §Y1§! £supply_texticon в неделю.\n\n[GetRUSBunkerForecastguard]"
