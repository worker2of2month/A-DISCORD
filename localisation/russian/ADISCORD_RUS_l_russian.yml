 RUS_last_sky_closed_tt:0 "Программа завершена или ответ уже получен. Закрыть обращение без последствий."
 ADISCORD_rus_crisis.21.t:0 "Список на вывоз"
 ADISCORD_rus_crisis.21.d:0 "Глеб Корнеев принёс к столу Хана две папки. В одной лежали расчёты орбитальной системы, в другой - списки врачей, преподавателей и хранителей архивов. Вторую папку не включили в план перевозок.\n\nЛюди, которых государство учило читать чертежи и лечить раненых, теперь просят места для семей и ящиков с записями. Корнеев не спорит о приказе. Он спрашивает, кому понадобятся расчёты, если некому будет объяснить их детям."
 ADISCORD_rus_crisis.21.course.d:0 "Учёный совет собрался в том же помещении, где Хан когда-то обещал сделать знания государственным делом. Теперь на столе лежат списки врачей и преподавателей, описи архивов и заявки на транспорт. Мастерские продолжают выполнять военные заказы; свободных машин для этих людей не оставили.\n\nДокладчик просит сохранить хотя бы тех, кто ещё сможет лечить и учить. Ни один член совета не произносит вслух вопрос о том, что останется наверху. Хан слышит только шелест бумаги."
 ADISCORD_rus_crisis.21.decline:0 "Оставить транспорт в распоряжении фронта."
 ADISCORD_rus_crisis.21.accept:0 "Выделить машины и подготовить помещения."
 RUS_last_sky_science_accept_tt:0 "Расход: §R50§! £ADISCORD_economy_treasury_texticon и §R50§! £support_equipment_texticon. Поддержка учёных: §G+10 п.п.§!. Мораль армии: §G+5§!. Срок удара не меняется."
 RUS_last_sky_science_decline_tt:0 "Поддержка учёных: §R-10 п.п.§!. Запасы остаются у страны. Срок удара не меняется."
 ADISCORD_rus_crisis.22.t:0 "Те, кто должен сменить караул"
 ADISCORD_rus_crisis.22.d:0 "Из полков пришли одинаковые просьбы: дать инструкторам отдых, собрать раненых командиров и накормить людей, которых готовят на смену. Офицерская школа продолжает выпускать младших начальников, но всё чаще их отправляют к подразделениям без положенного обоза.\n\nНачальник службы резервов положил перед Ханом ведомость. В ней нет новых дивизий. Есть фамилии людей, которые уже служат и которым обещали подготовленную смену. Он просит оплатить размещение и открыть продовольственный склад."
 ADISCORD_rus_crisis.22.course.d:0 "В штабе Чёрной армии ещё помнят день присяги. Тогда каждый аймак обещал людей, а столица - снабжение и общий резерв. Теперь командиры принесли обратно копию этого приказа. На полях появились фамилии погибших инструкторов и номера рот, которым некем заменить уставших начальников.\n\nОни не требуют снять караулы с периметра. Они требуют накормить и разместить кадровую смену, пока её ещё можно подготовить. Хан смотрит на собственную печать под старым обещанием."
 ADISCORD_rus_crisis.22.decline:0 "Резерв получит довольствие в общей очереди."
 ADISCORD_rus_crisis.22.accept:0 "Открыть склад для кадровой смены."
 RUS_last_sky_army_accept_tt:0 "Расход: §R35§! £ADISCORD_economy_treasury_texticon и §R30§! £supply_texticon. Поддержка Чёрной армии: §G+10 п.п.§!. Мораль армии: §G+8§!. Срок удара не меняется."
 RUS_last_sky_army_decline_tt:0 "Поддержка Чёрной армии: §R-10 п.п.§!. Мораль армии: §R-5§!. Запасы остаются у страны."
 ADISCORD_rus_crisis.23.t:0 "Обещание над землёй"
 ADISCORD_rus_crisis.23.d:0 "К воротам бункера принесли пачку ханских грамот. На бумаге значились почтовые станции, школы, лазареты и дома, которым обещали защиту. Посланцы не знали, какие из этих обещаний ещё действуют. Они просили отправить продовольствие и деньги для укрытий до закрытия дорог.\n\nРадист приготовил обращение о стойкости. Один из посланцев спросил, можно ли вместо нового обращения получить обоз. Ответа в подготовленном тексте не оказалось.\n\nСреди посланцев стояла женщина с расчётной книжкой, завёрнутой в платок. Рядом с ней - подросток, которому рукава старой куртки стали коротки. Руки он держал на виду и разрешения сесть не просил."
 ADISCORD_rus_crisis.23.course.d:0 "Представители округов заняли свои места за общим столом. Когда их впервые допустили к Хану, они докладывали о воде, жилье и мастерских. Сегодня все ведомости заканчиваются одной строкой: сколько людей ещё можно разместить под крышей и чем их кормить.\n\nУ каждого есть копия грамоты о представительстве. Никто не размахивает ею. Старший кладёт документ рядом со списком нуждающихся и просит выполнить хотя бы эту заявку до закрытия дорог. За дверью уже ждёт радиослужба с очередным обращением к аймакам."
 ADISCORD_rus_crisis.23.decline:0 "Запасы должны остаться под землёй."
 ADISCORD_rus_crisis.23.accept:0 "Отправить обещанную помощь."
 RUS_last_sky_districts_accept_tt:0 "Расход: §R35§! £ADISCORD_economy_treasury_texticon и §R40§! £supply_texticon. Стабильность: §G+3%§!. Поддержка каждой стороны: §G+5 п.п.§!. Мораль армии: §G+5§!. Срок удара не меняется."
 RUS_last_sky_districts_decline_tt:0 "Стабильность: §R-3%§!. Поддержка учёных и Чёрной армии: §R-5 п.п.§! каждой. Запасы остаются у страны."
