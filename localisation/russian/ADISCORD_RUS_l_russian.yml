 RUS_aimaq_food_requisition:0 "Продовольственная разверстка в аймаках"
 RUS_aimaq_food_requisition_desc:0 "Ханские писцы обойдут присоединённые аймаки и опишут амбары. Каждый двор отдаст бункеру долю зерна и вяленого мяса. Склады наполнятся быстро, но степь запомнит, кто забрал её хлеб, а соседи увидят обозы с реквизицией."
