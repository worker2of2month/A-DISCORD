 RUS_bunker_food_sale_cost:0 "§Y40§! £supply_texticon"
 RUS_bunker_food_sale_cost_blocked:0 "§R40§! £supply_texticon"
 RUS_bunker_food_sale_cost_tooltip:0 "Нужно 40 £supply_texticon на складе бункера."
 RUS_bunker_food_sale_tt:0 "Казна: §G+100§! £ADISCORD_economy_treasury_texticon."
 RUS_repair_depots_spirit:0 "Ремонтные депо пояса"
 RUS_repair_depots_spirit_desc:0 "Выездные бригады чинят станки прямо в цехах, а не ждут, пока деталь привезут из столицы. Заводы промышленного пояса работают ровнее и дольше держат налаженный ритм.\n\n\n\n\n\n £GFX_ADISCORD_industry_banner \n\n\n"
 RUS_strategic_freight_reserve_convoy_tt:0 "Обоз продовольствия доставляет §G60§! £supply_texticon вместо 40 по прежней цене."
 RUS_bunker_food_cost_cash_ok:0 "§Y165§! £ADISCORD_economy_treasury_texticon"
 RUS_bunker_food_cost_cash_low:0 "§R165§! £ADISCORD_economy_treasury_texticon"
 RUS_bunker_food_cost:0 "[GetRUSBunker31pp]  [GetRUSBunkerFoodCash]"
 RUS_bunker_food_cost_blocked:0 "[GetRUSBunker31pp]  [GetRUSBunkerFoodCash]"
 RUS_bunker_food_cost_tooltip:0 "[GetRUSBunker31pp]  [GetRUSBunkerFoodCash]"
 RUS_bunker_rations_ok:0 "§GРацион обеспечен§!"
 RUS_bunker_rations_empty:0 "§RГолод: нет продовольствия§!"
 RUS_district_ledger:0 "Одна книга на все аймаки"
 RUS_district_ledger_desc:0 "Перепись дала каждому подданному имя, но округа всё ещё используют несовместимые ведомости. Единая книга поставок свяжет мастерские, склады и инженерную службу. Учёт хозяйств обеспечит регулярные сборы, а новые производственные стандарты - исследовательскую работу."
 RUS_courier_stations:0 "Станции ханской почты"
 RUS_courier_stations_desc:0 "Приказ, который приходит после зимы, уже не приказ. Свяжем окружные канцелярии регулярной автомобильной почтой и выделим диспетчерам действующие машины. На этих же станциях армейские связные смогут менять экипажи и передавать срочные донесения."
 RUS_district_paramedics:0 "Фельдшер каждого округа"
 RUS_district_paramedics_desc:0 "Дорожные лечебницы должны работать и тогда, когда столица забывает прислать врача. Окружные школы подготовят фельдшеров, знакомых с местными болезнями и военной эвакуацией. Санитарные обозы получат оснащение из центра, а новые приёмы станут достоянием всей службы."
 RUS_district_paramedics_progress_tt:0 "Прогресс развития социальной системы: §G+20§!."
 RUS_covenant_of_service:0 "Хартия служилых людей"
 RUS_covenant_of_service_desc:0 "Верность Хану должна пережить смену начальника. Жалование, срок службы и помощь семьям закрепляются в единой хартии; суды аймаков получают право требовать её исполнения. Мы покупаем не молчание подданных, а уверенность в том, что данное государством слово чего-нибудь стоит."
 RUS_recovery_depots:0 "Возвращать станки в строй"
 RUS_recovery_depots_desc:0 "В промышленном поясе уже достаточно заводов, чтобы неисправная деталь могла остановить целый район. Центральное ремонтное депо соберёт выездные бригады, запас инструментов и транспорт. Первым в строй вернётся старый консервный цех: бункеру нужна еда не меньше, чем фронту - станки."
 RUS_interchangeable_parts:0 "Одинаковая резьба"
 RUS_interchangeable_parts_desc:0 "Мастерские Хана унаследовали десятки несовместимых стандартов. Коллегия инженеров утвердит общие допуски, размеры и чертежи. Переоснащение позволит постепенно связать старые станки с новым производством, не останавливая всю промышленность ради одного образцового цеха."
 RUS_second_arsenal_shift:0 "Вторая смена арсенала"
 RUS_second_arsenal_shift_desc:0 "Серийное производство требует собственной линии. Столичные мастера готовят новый оружейный цех и сверяют чертежи с инженерной коллегией."
 RUS_strategic_freight_reserve:0 "Резерв тяжёлых перевозок"
 RUS_strategic_freight_reserve_desc:0 "Завод не поможет фронту, если его продукция останется на погрузочной площадке. Отделим стратегический резерв локомотивов и грузовиков от ежедневных перевозок."
 RUS_rifle_inspection_board:0 "Приёмка ханского оружия"
 RUS_rifle_inspection_board_desc:0 "Разные аймаки принесли в армию разные винтовки и разные привычки. Приёмочная комиссия проверит надёжность оружия в пыли, морозе и длительном походе. Её выводы лягут в основу следующего образца вооружения, а испытательные партии пополнят учебные склады."
 RUS_staff_field_exercise:0 "Учения без предупреждения"
 RUS_staff_field_exercise_desc:0 "Штабам предстоит действовать без заранее написанной развязки: потерянная переправа, оборванная связь, неожиданное наступление. Хан потребует разбирать ошибки до следующей войны. Полководец, умеющий менять замысел на ходу, ценнее красивого плана на стене."
 RUS_bunker_closed_cycle:0 "Замкнутый продовольственный цикл"
 RUS_bunker_closed_cycle_desc:0 "Пять оснащённых слоёв уже похожи на город, но город каждый день ест. Грибные камеры, переработка пищевых остатков и строгий санитарный контроль дадут дополнительный еженедельный рацион."
 RUS_bunker_reserve_turbine:0 "Независимая турбина"
 RUS_bunker_reserve_turbine_desc:0 "Расширение подземной ставки не должно каждый раз начинаться с отключения лаборатории или госпиталя. Дополнительная турбина получит отдельную линию питания и собственную смену механиков."
 RUS_bunker_cold_stores:0 "Подземные мастерские"
 RUS_bunker_cold_stores_desc:0 "Городу под землёй нужны собственные мастерские. Здесь будут собирать насосы, чинить станки и готовить оборудование для новых строек. Отдельная гражданская фабрика в столичном регионе даст этим работам постоянную производственную базу, а мастерам - место за пределами военных заказов."
 RUS_bunker_machine_depot:0 "Машинный запас под землёй"
 RUS_bunker_machine_depot_desc:0 "Каждый лифт, насос и гермозатвор однажды потребует ремонта. Соберём отдельный запас инструментов для инженерной службы, чтобы монтаж следующего слоя не оставлял действующие помещения без обслуживания."
 RUS_bunker_emergency_rations:0 "Неприкосновенный рацион"
 RUS_bunker_emergency_rations_desc:0 "Кладовщики готовят камеры для неприкосновенного рациона. В подземных залах складывают ящики, которые не откроют ради обычной смены."
 RUS_bunker_systems_college:0 "Училище подземных систем"
 RUS_bunker_systems_college_desc:0 "Бункер переживёт своих создателей только в том случае, если следующая смена понимает его устройство. Инженеры объединят схемы силовой сети, вентиляции и мастерских в учебный курс. Выпускники перенесут эти знания на наземные предприятия и помогут совершенствовать промышленное оборудование всей страны."
 RUS_bunker_food_output_focus_tt:0 "Продовольствие бункера: §G+2§! £supply_texticon в неделю."
 RUS_bunker_power_focus_tt:0 "Мощность бункера: §G+3§! £energy_consumption_texticon. Вместе с линией, выделенной при выборе ставки: §G+4§! £energy_consumption_texticon."
 RUS_bunker_food_capacity_focus_tt:0 "Ёмкость продовольственного резерва: §G+40§! £supply_texticon."
 RUS_bunker_food_reserve_focus_tt:0 "Ёмкость резерва: §G+80§! £supply_texticon. Запас: §G+80§! £supply_texticon. Новые камеры вмещают всю поставку даже при полном складе."
 RUS_bunker_college_active_tt:0 "Бонус училища к скорости исследований действует, пока бункер работает."
 RUS_bunker_closed_cycle_tt:0 "Производство пищи: §G+2§! £supply_texticon в неделю. Вместе с поставками, назначенными при выборе города: §G+3§! £supply_texticon в неделю."
