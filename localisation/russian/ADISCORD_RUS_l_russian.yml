 RUS_bunker_command:0 "Слой 5: зал последнего приказа"
 RUS_bunker_command_desc:0 "Отсюда видна вся страна - условными знаками на стене. За каждым знаком остаются живые люди, и теперь любая ошибка на карте тоже принадлежит Хану."
