 RUS_startup_guide_state:0 "§YКАК РАБОТАЕТ ВЛАСТЬ ХАНА§!\n\n§YВыбор курса§!\nПосле «Пересчитать очаги» открываются «Учёный совет при Хане» и «Присяга Чёрной армии». Они взаимоисключающие: выбрать обе государственные программы нельзя. Рустан остаётся главой страны при любом выборе.\n\n§YБаланс и поддержка - разные показатели§!\nСлева на балансе находятся учёные, справа - Чёрная армия. Положение определяет действующие преимущества и издержки государства. Поддержка каждой силы учитывается отдельно: выше 50% она приносит политическую власть и еженедельно тянет баланс к своей стороне; ниже 50% отнимает политическую власть. Фокусы, политические меры и лабораторные проекты меняют эти показатели.\n\nУмеренный перевес учёных ускоряет исследования и рост производственной эффективности ценой части призывного населения. Сильный перевес дополнительно снижает организацию армии и стабильность. Военный перевес улучшает подготовку и организацию; крайняя власть армии повышает расход снабжения и административные расходы, замедляет исследования и снижает стабильность. Равновесие поддерживает устойчивость государства.\n\n§YМодернизация§!\nГосударство, общество, армия, социальная система, экономика и культура развиваются отдельно. Общие ветки создают аппарат, образование, трудовые правила и гражданские службы; фокусы открывают оплачиваемые программы. Изучайте результат каждого закона и текущую скорость развития: одна фабрика не меняет весь общественный уклад.\n\nКазна оплачивает разовые проекты, а недельный баланс показывает постоянную нагрузку. Сравнивайте содержание новых учреждений с доходами до начала следующей программы."
 RUS_startup_guide_bunker:0 "§YБУНКЕР КАК ЧАСТЬ СТРАНЫ§!\n\n§YСлои и помещения§!\nПроходка открывает новые слои, а оснащение задаёт их назначение. У каждого слоя есть альтернативы: например, мастерская помогает промышленности, медблок возвращает раненых, лаборатория ускоряет исследования. Перед заказом прочитайте его требования, цену, срок и итоговый эффект.\n\n§YМощность§!\nГенераторы определяют, сколько оборудования может работать. Свободная мощность нужна для новых помещений и улучшений. Договор продажи энергии приносит деньги сразу, но на свой срок занимает часть свободной мощности; действующие помещения продолжают работать. Не обещайте одну и ту же мощность и стройке, и покупателю.\n\n§YПродовольствие§!\nЗапас, вместимость склада и недельный баланс отвечают на разные вопросы: сколько еды осталось, сколько можно принять и растёт ли резерв. Оснащённые слои расходуют продовольствие. Обоз пополняет склад разово, производство и пайки меняют дальнейший баланс. Пустой склад при работающих помещениях вызывает голод и штрафы стране.\n\n§YПрочность§!\nПроходка повреждает своды. Ниже 40 прочности возникают штрафы к организации армии и выпуску военных заводов. Укрепление возвращает безопасность; ускоренная проходка требует большего запаса прочности. Ориентируйтесь на показанный прогноз после заказа.\n\n§YСвязь с поверхностью§!\nРаботающие мастерская, медблок и лаборатория помогают соответствующим программам развития. Бункер поддерживает модернизацию страны; строительство комнат само по себе не заменяет школы, гражданскую промышленность и реформы."
 RUS_startup_guide_campaign:0 "§YОТ ПОГРАНИЧНЫХ ПОХОДОВ К ИМПЕРИИ§!\n\n§YПоходы против соседей§!\nНачальная цепочка собирает аймаки, вооружает пограничные силы и следит за распадом соседнего порядка. Фокусы открывают возможности, а походы начинаются отдельными решениями при выполнении их условий. В Грязной зоне можно вести несколько походов одновременно, не дожидаясь завершения предыдущей войны. Обычные дипломатические кнопки объявления войны и создания альянса здесь недоступны.\n\n§YПровозглашение империи§!\nДля решения нужны подготовленная власть, контроль всех доступных областей Грязной зоны и мир. Области под контролем Кефрейта или его марионеток не требуется отвоёвывать до провозглашения. Название державы зависит от текущего баланса: перевес Чёрной армии ведёт к Империи Чёрного Знамени, учёные или равновесие - к Последней империи. Дальнейшие пограничные и региональные кампании имеют собственные условия; южное и западное направления требуют предварительной победы над восточным гегемоном.\n\n§RПеред провозглашением прочитайте это§!\nКогда империя провозглашена и Хан контролирует хотя бы одну область реакторного периметра, орбитальный кризис начинается автоматически. Это не отдельная лабораторная покупка и не награда только одного политического курса. Получение доступа позднее тоже может запустить кризис.\n\nНа подготовку вмешательства отведено 90 дней; общий срок до удара составляет 455 дней с раскрытия программы. Среди возможных противников - Монтарская империя, Вальдский союз, Тимерская палата, Байринж и победители других регионов. Их вступление зависит от текущего положения.\n\nПотеря всего реакторного периметра навсегда срывает программу, но сама по себе не завершает войну. Поражение Хана раскалывает империю. Победа над интервентами не останавливает действующий отсчёт. Для игрока завершение программы ведёт к разрушению мира и заключительному эпилогу. Подготовьте армию и хозяйство до шага, который запускает эти часы."
 RUS_startup_guide:0 "§YПЕРВЫЕ ШАГИ ЗА ХАНА§!\n\n§Y1. Посмотрите на хозяйство.§! Сверьте казну, недельный баланс и текущие законы. Планируйте расходы бункера вместе с поверхностным строительством.\n\n§Y2. Проведите перепись и выберите опору.§! Учёный совет даёт гражданскую и техническую программу, Чёрная армия - военную и административную. Общие ветки остаются полезны обоим путям.\n\n§Y3. Снабдите бункер до расширения.§! Сопоставьте свободную мощность, недельный расход еды и прочность. Новое помещение должно не только достроиться, но и работать.\n\n§Y4. Создавайте постоянные возможности.§! Школы, служба снабжения, аппарат и программы развития постепенно выводят страну из стартовой отсталости. Проверяйте, какое решение открыл каждый фокус.\n\n§Y5. Следите за обеими силами.§! Поддержка и баланс не замирают после выбора курса. Крайний перевес даёт сильные преимущества вместе с постоянными издержками.\n\n§Y6. Готовьте каждый поход.§! Проверьте людей, оружие, пополнение и дороги. Политический фокус не оплачивает снабжение уже существующих дивизий.\n\n§Y7. Планируйте позднюю игру заранее.§! РХБ-подготовка и воздушный линкор доступны обоим курсам. Империя с доступом к реакторному периметру запускает общий кризис автоматически; не принимайте её провозглашение за простую смену флага."
 RUS_startup_path_0_title:0 "Учёный совет"
 RUS_startup_path_1_title:0 "Чёрная армия"
 RUS_startup_path_0:0 "§YУЧЁНЫЙ СОВЕТ ПРИ ХАНЕ§!\n\nИнженеры, химики и врачи годами удерживали подземный комплекс в рабочем состоянии. Теперь их знания становятся основанием государственной программы. Рустан возглавляет совет и связывает власть с теми, кто способен дать стране свет, хлеб и подготовленных специалистов.\n\n§YЧто меняется в игре§!\nНачальные фокусы дают помощь промышленным исследованиям, гражданскую фабрику, дополнительную мощность и производство продовольствия в бункере. Образование можно довести до технических институтов. Через совет аймаков открывается продолжение с местными службами, общим бюджетом и уставом службы.\n\nЭтот курс удобен для последовательного восстановления: сначала люди и учреждения, затем производство и более сложные проекты. Он не отменяет армию и завоевания, но делает гражданскую экономику и знания главной опорой Хана. Перевес учёных на балансе усиливает исследования ценой мобилизационных и военных возможностей.\n\n§YОбщее будущее§!\nПромышленный пояс, общая армейская подготовка, РХБ-направление и воздушный линкор доступны и здесь. Планировку бункера и тактику армии вы выбираете отдельно. Провозглашение империи и орбитальный кризис подчиняются общим условиям: научная программа сама по себе не гарантирует мирного исхода.\n\nПодробности показывают конкретные награды, ограничения и поздние последствия."
 RUS_startup_path_1:0 "§YПРИСЯГА ЧЁРНОЙ АРМИИ§!\n\nХан делает государственной опорой сотни, которые охраняли бункер и границы аймаков. Личная присяга связывает их с Рустаном, а общий штаб превращает разрозненные отряды в постоянную силу. Требование армии просто: приказ должен опираться на людей, склады и работающие арсеналы.\n\n§YЧто меняется в игре§!\nНачальная цепочка даёт людской резерв и вспомогательное оснащение, затем военный завод. Устав усиливает организацию, защиту и планирование; ранние способы снабжения заменяются централизованными депо. Через ханскую канцелярию открываются инспекции, единый учёт снабжения и провинциальные комиссары.\n\nЭтот курс подходит для государства, которое готовится воевать и управлять через дисциплину аппарата. Военный перевес на балансе усиливает армию, но требует больше снабжения и денег на управление. Крайнее господство Чёрной армии замедляет исследования и снижает стабильность.\n\n§YОбщее будущее§!\nГражданская промышленность, школы, программы развития, бункер и лабораторные проекты сохраняют значение. Военный курс не закрывает РХБ-подготовку и воздушный линкор. При провозглашении державы текущий перевес армии может дать имя Империи Чёрного Знамени; поздний реакторный кризис остаётся общей угрозой обоих путей.\n\nПодробности раскрывают награды, независимые развилки и границу между обычной экспансией и финалом кампании."
 RUS_startup_path_0_details:0 "§YУЧЁНЫЕ: НАГРАДЫ И ОГРАНИЧЕНИЯ§!\n\nПосле «Пересчитать очаги» выберите «Учёный совет при Хане». «Присяга Чёрной армии» и её собственное продолжение станут недоступны. Изменение баланса позднее не снимает эту взаимоисключаемость.\n\n§YНачальная программа§!\n- «Учёный совет при Хане»: один бонус 50% к промышленному исследованию, сдвиг баланса к учёным и рост их поддержки.\n- «Мастерские учёного совета»: одна гражданская фабрика в столичном районе при его владении и контроле.\n- «Свет и хлеб подземелья»: §G+1§! £energy_consumption_texticon мощности бункера и §G+1§! £supply_texticon производства еды в неделю; технические институты заменяют ранние образовательные законы, более специализированное образование сохраняется.\n\n§YГосударственная ветка§!\nСовет аймаков ведёт к местным службам, бюджету собрания, взаимопомощи и уставу службы. Общий аппарат и социально-экономическое развитие также требуют собственных фокусов и оплаченных программ. Выбор учёных не выдаёт все реформы сразу.\n\n§YДругие выборы§!\n«Город для живых» и «Ставка под горой» определяют устройство бункера; поверхностные контракты и подземный фонд - хозяйственный приоритет; позиционная подготовка и подвижные колонны - военный подход. Это отдельные развилки, а не дополнительные варианты выбора учёных или армии.\n\n§YПоздние проекты§!\nВоздушный линкор требует открытых экспериментальных лабораторий, доступа к реакторному периметру и оплаты проекта. Он доступен обоим курсам даже при крайнем балансе; единственный корпус нельзя построить повторно после потери.\n\n§RИмперия и реактор§!\nПровозглашённая империя при контроле хотя бы одной из областей периметра автоматически открывает кризис. Отсчёт - 455 дней; вмешательство начинается после первых 90. Победа над коалицией не отменяет удар. Потеря всего периметра срывает программу навсегда, поражение Хана распускает империю, а завершение программы игроком ведёт к разрушению мира."
 RUS_startup_path_1_details:0 "§YЧЁРНАЯ АРМИЯ: НАГРАДЫ И ОГРАНИЧЕНИЯ§!\n\nПосле «Пересчитать очаги» выберите «Присяга Чёрной армии». Учёный совет и его собственное продолжение закроются. Обе политические опоры остаются под руководством Марка Рустана; военный курс не назначает другого правителя.\n\n§YНачальная программа§!\n- «Присяга Чёрной армии»: 2000 £manpower_texticon и 80 £support_equipment_texticon, сдвиг баланса к армии и рост её поддержки.\n- «Штаб Чёрной армии»: один военный завод в столичном районе при его владении и контроле.\n- «Устав Чёрного Знамени»: +3% организации, +5% защиты и +3% планирования через постоянную реформу армии. Централизованные депо заменяют ранние законы снабжения; более специализированный закон сохраняется.\n\n§YКанцелярия и дисциплина§!\nХанская канцелярия ведёт к инспекциям, единому реестру снабжения, комиссарам и подготовке чиновников. При этом перепись, школы, мастерские, социальные программы и общая индустриализация доступны независимо от выбранной опоры.\n\n§YБаланс не равен выбору фокуса§!\nВоенный курс и текущее влияние армии - разные вещи. Меры поддержки способны сдвинуть баланс после выбора ветки. При провозглашении империи именно перевес армии более 10% определяет имя Империи Чёрного Знамени; учёные и область равновесия дают Последнюю империю.\n\n§YСамостоятельные развилки§!\nТактика, поверхностные контракты или подземный фонд, открытый город или закрытая ставка выбираются своими фокусами. Лаборатории, РХБ-подготовка и единственный воздушный линкор не требуют перехода к учёному курсу.\n\n§RПоздняя война§!\nПосле провозглашения империи доступ к реакторному периметру автоматически запускает общий кризис. Через 90 дней начинается вмешательство; до удара всего 455 дней от раскрытия программы. Разгром интервентов не выключает отсчёт. Утрата всего периметра навсегда срывает программу, но война продолжается. Поражение Хана раскалывает державу; доведённая игроком до конца программа разрушает мир."

# --- rus_starting_ideas ---
 RUS_aimaq_compact: "Договор аймаков"
 RUS_aimaq_compact_desc: "Аймаки Руснии сами выбирают старшин, содержат вооружённые отряды и решают, какую долю урожая отправить в общие амбары. Договор, закреплённый Марком Рустаном, обязывает столичную власть защищать дороги и землю, а общины - выставлять людей на общий сбор. Каждый новый приказ приходится согласовывать с теми, кто будет его исполнять.\n\nЭтот порядок пережил не одну смену границ. Он даёт аймакам вескую причину защищать свою землю, но оборачивается спорами о налогах, затяжными сборами и слабостью столичного управления. Чтобы превратить союз общин в государство, придётся убедить их, что общий закон стоит утраченной самостоятельности."
 RUS_last_empire_spirit:0 "Имперские учреждения"
 RUS_last_empire_spirit_desc:0 "На дорогах появились общие заставы, в городах - казначейства и суды. Земли, ещё недавно связанные лишь военным походом, получают единые реестры, подати и служебные обязанности. За столичной печатью теперь стоят люди, способные довести приказ до самого дальнего округа.\n\nИмперские учреждения дают государству устойчивые доходы и власть над покорённой территорией. От того, как эта власть обращается с аймаками, зависит долговечность нового порядка: привычка повиноваться может вырасти из доверия, оплаченной службы или страха перед гарнизоном."
 RUS_crisis_world_ended_title:0 "КОНЕЦ СВЕТА"

 ADISCORD_rus_campaign.26.t:0 "До конца урока"
 ADISCORD_rus_campaign.26.d:0 "Во сне он всегда сначала замечал рукава. Тогда эта земля ещё не называлась Воркерландом. На школьных тетрадях печатали «Вейранская империя», а под гербом оставляли две строки: для имени ученика и для его касты. Нижнюю следовало заполнять первой. Учительница говорила, что так проще избежать недоразумений. После революции гербы сбили, улицы переименовали, старые бланки пустили на растопку. Марк Рустан видел, как горят такие тетради. Ему казалось, что теперь он сможет забыть. Но во сне нижняя строка всегда была заполнена.\n\nРукава были белые, с двумя перламутровыми пуговицами у запястья. Детям его касты полагалась одна, костяная. По утрам учительница проверяла манжеты раньше, чем спрашивала урок. Она брала маленькую руку двумя пальцами, поворачивала к свету и отпускала. Некоторым после этого поправляла воротник. Остальным велела отойти.\n\nОни стояли между шкафом с картами и дверью класса. Старший мальчик ел яблоко. Кожуру он снимал тонкой непрерывной лентой, и Марк следил, как она покачивается у его ботинка. Смотреть в лицо считалось дерзостью. Смотреть в пол означало, что скрываешь дурные намерения. Правильного места для глаз он так и не нашёл. За дверью объясняли устройство Вейранской империи.\n- Каждому сословию вверено своё служение.\n\nМальчик попросил его поднять подбородок. Голос был скучающий, почти ласковый. Таким голосом просили подержать учебники, пока завязывают шнурок.\n\nМарк посмотрел в конец коридора. Там стояла учительница младших классов. Она видела нож. Он понял это по тому, как её глаза опустились к чужой руке, а потом поднялись к белым манжетам. Она вошла в учительскую. Осторожно повернула ручку, чтобы дверь не хлопнула.\n\n- Не двигайся, - сказал мальчик. - Криво получится.\nМарк отступил до шкафа. Дальше отступать было некуда. Когда стало больно, он удивился, что урок за дверью продолжается. Учитель произносил те же слова, дети переворачивали страницы. Он почему-то ждал, что всё остановится."
 ADISCORD_rus_campaign.26.a:0 "Проснуться"
 ADISCORD_rus_campaign.26.continue:0 "Войти в класс"
 ADISCORD_rus_campaign.27.d:0 "В класс он вошёл, прижимая ладонь к щеке. Учитель замолчал на середине фразы. Посмотрел на него, затем на мальчика в дверях. Тот убрал нож и продолжал держать яблоко.\n- Что произошло?\nМарк начал отвечать.\n- Я спрашиваю старшего.\nСтарший сказал, что они играли. Учитель кивнул. Так быстро, словно только этих слов и ждал. Потом попросил кого-нибудь закрыть дверь: из коридора тянуло.\n\nМарк всё ещё стоял перед первой партой. Если убрать руку, учитель увидит. Он обязательно увидит, насколько это серьёзно.\n- Выйди и приведи себя в порядок.\nНа стене висела таблица прав и обязанностей. Марк знал свою строку наизусть. Читать остальные разрешалось, но задавать по ним вопросы учитель не любил.\n- Мне больно, - сказал он.\nНесколько детей оглянулись. Учитель дождался, пока они снова сядут прямо.\n- Это не освобождает тебя от правил поведения.\n\nВо сне дальше всегда наступала тишина. Учитель подходил, брал его за запястье и отводил ладонь от лица. Внимательно осматривал щёку. Марк переставал дышать от облегчения. Теперь увидел. Учитель доставал платок. Вытирал собственные пальцы.\n- Завтра принесёшь тряпку. За собой нужно убирать.\nИ возвращался к доске.\n\nМарк пытался выйти, но дверь открывалась в тот же класс. Он снова стоял перед первой партой. Учитель снова смотрел на манжеты. Где-то за шкафом начинал плакать ребёнок, и Марк узнавал свой голос раньше, чем открывал рот. Потом звенел звонок. Учитель ждал, пока тот стихнет. Звонок не стихал.\n\nПроснувшись, Марк ещё долго сидел в темноте, прижимая ладонь к лицу. За дверью переминался дежурный.\n- Вы звали?\nОн хотел попросить воды. Простое слово никак не выходило. Сначала нужно было разрешение."
 ADISCORD_rus_campaign.27.a:0 "Урок окончен"

 ADISCORD_rus_campaign.28.t:0 "Чистая страница"
 ADISCORD_rus_campaign.28.d:0 "Марк Рустан не помнил, кто отвёл его к школьному смотрителю. Во сне он всегда уже сидел на стуле перед столом. Ноги не доставали до пола. На щеке стягивалась повязка, и он боялся пошевелить ртом: казалось, под тканью что-то снова разойдётся. Смотритель положил перед собой чистый лист.\n- Рассказывай. Только по порядку.\nМарк начал со шкафа с картами. С яблока. С учительницы в конце коридора. Смотритель слушал внимательно, иногда кивал. Уточнил время, попросил назвать свидетелей. Когда Марк сбился, даже предложил воды. Впервые за всё утро ему стало немного легче.\n\nЗа спиной смотрителя висели герб Вейранской империи и школьное расписание. Под ними стоял шкаф с личными делами. Верхние полки закрывались стеклом. Нижние, куда убирали бумаги детей его касты, были забиты так плотно, что некоторые папки приходилось вталкивать коленом.\n\nСмотритель спросил фамилию старшего мальчика. Перо остановилось. Он ещё раз посмотрел на Марка. Потом достал другой бланк и положил поверх первого.\n- Ты понимаешь, что это серьёзное обвинение?\nМарк кивнул.\n- Тогда постарайся больше ничего не перепутать.\n\nУчительница младших классов пришла почти сразу. В кабинете она пахла холодным воздухом и мылом. Марк повернулся к ней всем телом. Она стояла у двери совсем близко. Теперь ей не нужно было входить в коридор или отнимать нож. Достаточно было сказать.\n- Вы видели происшествие?\n- Я видела, как дети разговаривали.\n- Оружие?\nОна поправила манжету.\n- У старших воспитанников разрешены личные столовые приборы.\nСмотритель записал ответ.\n\nПотом пришёл учитель. Он подтвердил, что Марк вошёл в класс без разрешения, прервал объяснение и отказался немедленно выйти. Про щёку смотритель спросил отдельно.\n- В каком состоянии находился ученик?\n- Возбуждён. Говорил несвязно.\nМарк хотел возразить, но смотритель поднял палец. Он ещё не закончил записывать. Оба учителя ушли. Ни один не посмотрел на него перед тем, как закрыть дверь."
 ADISCORD_rus_campaign.28.a:0 "Проснуться"
 ADISCORD_rus_campaign.28.continue:0 "Выслушать смотрителя"
 ADISCORD_rus_campaign.29.d:0 "- Послушай внимательно, - сказал смотритель. - Здесь тебе хотят помочь. Но помощь начинается с честности.\nОн прочёл написанное. Получалось, что Марк пристал к старшему воспитаннику, получил замечание, а затем пытался опорочить его семью. Повязка упоминалась тоже: «Явился с закрытой частью лица».\n- Но под ней…\n- Сними.\n\nМарк послушался. Смотритель наклонился ближе. Долго смотрел на щёку. Потом подвинул к нему маленькое зеркало. Кожа была целой. Марк провёл по ней пальцами. Ещё раз. Боль оставалась точно там, где ей полагалось быть. Смотритель терпеливо ждал.\n- Теперь понимаешь, почему нельзя торопиться со словами?\n\nЗа стеной заплакал ребёнок. Марк поднял голову. Там был чулан без окон. Он однажды помогал относить туда сломанные парты и знал, что второй двери нет. Ребёнок говорил сквозь плач. Рассказывал про шкаф с картами, про яблоко, про учительницу.\n\nСмотритель придвинул чернильницу.\n- Здесь напиши, что претензий не имеешь.\nЗа стеной спросили фамилию старшего мальчика. Плач оборвался.\n\nМарк посмотрел на лист. Теперь тот был совершенно чистым. Ни показаний, ни обвинения, ни места для подписи. Смотритель всё равно показал пальцем, где писать. Перо царапало бумагу. Чернила не оставляли следа.\n- Сильнее нажимай.\nМарк нажал. Под столом что-то тихо всхлипнуло. Смотритель накрыл лист ладонью.\n- Вот и хорошо. Теперь этого не было.\n\nПроснувшись, Марк долго ощупывал щёку. Проводил пальцем по неровному рубцу, возвращался к его началу и проводил снова. Только когда за дверью послышались утренние шаги, он позволил себе убрать руку."
 ADISCORD_rus_campaign.29.a:0 "Я помню"

 ADISCORD_rus_campaign.30.t:0 "Место у окна"
 ADISCORD_rus_campaign.30.d:0 "Марк Рустан узнал школу по запаху мокрой шерсти. За годы он забыл её адрес, цвет крыши, даже число этажей. Но этот запах сохранился: детские пальто сохли возле печи, и младшим не разрешали отодвигаться, пока ткань не перестанет парить. У детей старших каст была отдельная раздевалка. Их вещи принимала женщина с тёплыми руками.\n\nТеперь у входа стояла его охрана. Марк не помнил, зачем приказал привезти себя сюда. Один из сопровождающих уже держал дверь. Другой ждал распоряжений у лестницы. Всё было как положено: сначала проверяют здание, потом входит он.\n- Внутри никого, - доложил офицер.\nНа втором этаже передвинули стул. Марк поднялся без сопровождения. Он знал, какая ступень скрипнет. Переступил через неё ещё до того, как вспомнил.\n\nНа стенах оставались светлые прямоугольники от снятых портретов. Только над дверью класса герб был на месте. Под ним золотыми буквами: «Вейранская империя». Ни пыли, ни следов, оставленных революцией. Кто-то недавно протёр табличку. На нижнем краю ещё держалась капля воды.\n\nОн открыл дверь. Дети встали. Все были прежнего возраста. Девочка у печи прятала пальцы в рукава. На второй парте лежал пенал с отломанной крышкой. Мальчик в заднем ряду придерживал ладонью ухо, хотя Марк уже не помнил почему. Учитель стоял возле доски.\n- Мы вас ждали.\n\nМарк посмотрел на шкаф с картами. Тот был закрыт. У двери, где он когда-то стоял с ладонью на щеке, пол выскоблили до светлого дерева.\n- Продолжайте, - сказал Марк.\nУчитель не двинулся. Дети стояли. Марк повторил громче. Девочка у печи вздрогнула, но никто не сел. Тогда учитель осторожно показал на свободную парту у окна.\n- Ваше место.\n\nМарк сразу узнал его. Здесь сидел мальчик с белыми манжетами. Отсюда хорошо было видно двор; зимой возле этой парты ставили дополнительную жаровню. Соседям запрещалось заслонять свет.\n- Я сидел в другом месте.\nУчитель посмотрел в конец класса, туда, где крайняя парта почти упиралась в стену.\n- В журнале уже исправлено.\n\nМарк хотел сказать, что исправлять ничего не нужно. Но дети всё ещё стояли. Один мальчик начал медленно приседать, не удержавшись на затёкших ногах. Учитель заметил. Марк сел. Стулья опустились разом."
 ADISCORD_rus_campaign.30.a:0 "Проснуться"
 ADISCORD_rus_campaign.30.continue:0 "Посмотреть на парту"
 ADISCORD_rus_campaign.31.d:0 "Парта была слишком маленькой. Колени упирались в дерево. На крышке лежало яблоко, очищенное длинной непрерывной лентой. Рядом стоял раскрытый пенал. Нож лежал внутри.\n\nМарк повернулся к двери. Его офицеры сидели на заднем ряду. Шинели были застёгнуты, руки сложены перед собой. Один встретился с ним взглядом и немедленно посмотрел на доску.\n- Сегодня у нас новый ученик, - сказал учитель.\nВ дверях стоял мальчик в слишком больших ботинках. Марк не мог разглядеть его лицо. Он смотрел на одну костяную пуговицу у запястья. На другую руку, которой мальчик придерживал слишком длинный рукав.\n\n- Подойди, - сказал учитель.\nМальчик подошёл к первой парте.\n- Представься.\nОн что-то произнёс. Марк не услышал.\n- Громче. Здесь тебя никто не обидит.\n\nМарк положил ладонь на пенал, закрывая нож. Мальчик перестал говорить. Учитель проследил за его взглядом и улыбнулся той терпеливой улыбкой, которую приберегал для объяснения простых вещей.\n- Не нужно смотреть на чужие принадлежности.\n\nМарк встал. Все вскочили следом. Он хотел обойти парту, но мальчик отступил к шкафу с картами. Точно знал, куда идти. Затылок уже касался дерева.\n- Я только…\nМарк услышал свой голос. Низкий, взрослый, раздражённый тем, что его снова не поняли. Учитель взял мальчика за плечи.\n- Стой спокойно, когда с тобой разговаривают.\n\nМарк посмотрел на собственные руки. Пенал остался на столе. Нож был у него.\n\nПроснувшись, он резко отдёрнул ладонь от края постели. За дверью скрипнул стул: дежурный поднялся на шум. Марк сидел, пока дыхание не стало ровным. Потом попросил его сесть. За дверью ответили:\n- Слушаюсь.\nСтул больше не скрипнул."
 ADISCORD_rus_campaign.31.a:0 "Я сюда не за этим пришёл"

 ADISCORD_rus_campaign.32.t:0 "До звонка"
 ADISCORD_rus_campaign.32.d:0 "В этот раз Марк Рустан успел. Он поймал чужое запястье прежде, чем лезвие коснулось щеки. Сам не понял как. Просто знал, когда мальчик перестанет жевать, когда чуть наклонит голову, когда произнесёт знакомые слова.\n- Не двигайся.\nМарк уже держал его руку.\n\nНесколько мгновений ничего не происходило. За дверью продолжался урок. В конце коридора стояла учительница младших классов. Всё было на своих местах, но боль не приходила. Марк осторожно коснулся щеки свободной рукой. Кожа была целой. Он едва не засмеялся.\n\nМальчик дёрнулся, пытаясь освободиться. Перламутровые пуговицы ударили Марка по пальцам. Нож остался раскрытым.\n- Отпусти.\nМарк сжал крепче. Впервые старший посмотрел ему прямо в глаза. Без скуки. Без той уверенности, с которой показывал нож. Теперь он тоже ждал, что кто-нибудь подойдёт.\n\n- Учитель! - позвал Марк.\nЗа дверью замолчали. Он позвал ещё раз, уже громче. Учительница в конце коридора повернулась к ним. Марк успел подумать, что сейчас она снова уйдёт, осторожно прикрыв за собой дверь. Но она подошла.\n\nСледом вышел учитель. За ним появился смотритель с ключами на цепочке. Пришла женщина из раздевалки старших каст, вытирая руки о передник. Даже директор, которого Марк прежде видел только на праздниках, спустился со своего этажа. Они встали полукругом. Все смотрели на нож.\n\nМарк специально повернул чужую руку так, чтобы лезвие было видно каждому. Боялся, что кто-нибудь потом скажет: отсюда нельзя было разглядеть.\n- Он хотел меня порезать.\nУчитель кивнул. Марк замолчал от неожиданности.\n- Мы видим, - сказал директор.\nВ коридоре было светло. Под потолком висел герб Вейранской империи. На этот раз никто не заслонял его плечом, никто не делал вид, что занят. Марк видел каждое лицо. Теперь всё должно было закончиться. Он подождал.\n\nМальчик снова потянул руку. У Марка начали дрожать пальцы.\n- Заберите у него.\nНикто не двинулся. Директор посмотрел на смотрителя. Тот перевёл взгляд на учителя. Учитель поправил воротник и спросил:\n- Ты можешь пока подержать?\nМарк не понял.\n- Чтобы он никого не поранил.\nОн кивнул. Конечно, мог. Ещё немного мог. Взрослые заметно успокоились.\n\nИз класса выглядывали дети. Учительница велела им не толпиться в дверях. Кто-то спросил, скоро ли перемена. Она ответила, что нужно потерпеть. Марк держал."
 ADISCORD_rus_campaign.32.a:0 "Проснуться"
 ADISCORD_rus_campaign.32.continue:0 "Ещё немного"
 ADISCORD_rus_campaign.33.d:0 "Пальцы постепенно немели. Запястье старшего мальчика сделалось скользким, и Марку пришлось обхватить его второй рукой. Теперь он уже не мог проверить щёку.\n- Я больше не могу.\nУчитель присел перед ним. Так близко Марк ещё никогда не видел его лица. Усталые глаза. Маленькая трещина на нижней губе. На щеке след от подушки: утром учитель, должно быть, спал дольше обычного.\n- Только до звонка.\nОн произнёс это тихо, почти доверительно. Как будто они вдвоём понимали что-то, чего остальные понять не могли.\n\nМарк посмотрел на часы. Минутной стрелки не было. Он хотел показать учителю, но тот уже выпрямился.\n\nВзрослых стало больше. Они стояли вдоль стен, оставляя посередине узкий проход. Все соблюдали порядок. Те, у кого на манжетах было по одной пуговице, держались ближе к лестнице. Никто не уходил. Никто не помогал.\n\nСтарший мальчик больше не пытался вырваться. Он смотрел на собственную руку с таким выражением, словно она принадлежала кому-то другому.\n- Мне больно, - сказал он.\nУчитель немедленно наклонился.\n- Ты слышал? Осторожнее.\nМарк попробовал ослабить хватку. Нож сразу двинулся к его лицу. Он снова сжал запястье обеими руками. Кто-то среди взрослых неодобрительно вздохнул.\n\nМарк хотел закричать, но боялся, что от крика разожмутся пальцы. Поэтому он только смотрел на них по очереди. На учителя. На смотрителя. На женщину с тёплыми руками. Директор достал часы, открыл крышку и, не взглянув на циферблат, убрал обратно.\n- Ну что же, - сказал он. - Пока всё спокойно.\n\nМарк проснулся с руками, сведёнными у груди. Он долго разжимал пальцы по одному. В комнате было темно. Шрам на щеке болел, хотя он к нему не прикасался. За дверью негромко разговаривали дежурные.\n- Будить?\n- Не надо. Пока всё спокойно."
 ADISCORD_rus_campaign.33.a:0 "Когда будет звонок?"

 ADISCORD_rus_campaign.34.t:0 "Можно идти"
 ADISCORD_rus_campaign.34.d:0 "Звонок прозвенел, когда Марк Рустан открыл дверь. Обычный школьный звонок. Немного дребезжащий, с коротким надрывом перед концом. Марк помнил этот звук, хотя во всех прежних снах тот либо не начинался, либо не мог закончиться. Теперь закончилось.\n\nДвери классов распахнулись. Дети вышли в коридор, разговаривая и толкаясь плечами. Кто-то бежал по лестнице, придерживая сумку. Учительница сделала замечание, но без прежней строгости: занятия завершились, и нарушение уже не имело большого значения. Марк стоял у стены, пропуская их. Никто его не боялся. Никто не вставал при его приближении. Девочка задела его локтем, пробормотала извинение и побежала дальше. Впервые он подумал, что сможет уйти вместе со всеми.\n\nВнизу принимали пальто. Женщина с тёплыми руками застёгивала младшим пуговицы. Через открытые двери было видно улицу. Там шёл снег. У ограды ждали родители, переминались лошади, извозчик поправлял попону. На стене висел герб Вейранской империи. Он был маленьким. Обычная жестяная табличка с потемневшими краями. Марк почему-то представлял его гораздо больше.\n\nСмотритель спускался последним. Под мышкой он нёс журнал, другой рукой перебирал ключи.\n- Вы ещё здесь?\nМарк посмотрел на открытую дверь.\n- Мне можно идти?\nСмотритель удивился.\n- Конечно. Всё уже закончилось.\nОн прошёл мимо. Ключи звякнули возле самого уха, и Марк почувствовал такое облегчение, что пришлось опереться ладонью о стену.\n\nПотом наверху передвинули стул. Марк поднял голову.\n- Там кто-то остался.\nСмотритель остановился у выхода.\n- Один ученик. За ним пока не пришли.\n- Кто?\n- Вы его знаете.\nСнаружи позвали смотрителя. Тот поднял воротник и вышел. Дверь осталась открытой. Марк мог видеть улицу всю дорогу до лестницы.\n\nНа втором этаже уже погасили свет. Только в знакомом классе горела лампа над учительским столом. Из-под двери тянулась узкая жёлтая полоса. Мальчик сидел на последней парте. Ботинки не доставали до пола. Один рукав был подвёрнут, другой закрывал пальцы. Повязку со щеки сняли. Марк видел неровную линию, которую потом будет каждый день находить на собственном лице. На парте лежал чистый лист. Ножа нигде не было.\n\n- Пойдём, - сказал Марк.\nМальчик поднял голову. Он не удивился. Будто ждал именно его и уже начинал опасаться, что тот не придёт.\n- Урок окончен, - повторил Марк.\n- Я слышал.\n- Тогда вставай."
 ADISCORD_rus_campaign.34.a:0 "Проснуться"
 ADISCORD_rus_campaign.34.continue:0 "Протянуть руку"
 ADISCORD_rus_campaign.35.d:0 "Мальчик послушно слез со стула. Подошёл к двери и остановился перед порогом. Марк протянул руку. Маленькие пальцы легли ему в ладонь. Холодные, немного липкие. Он потянул осторожно, потом сильнее. Мальчик не сдвинулся. Не сопротивлялся. Не держался за косяк. Просто оставался по ту сторону, сколько бы Марк ни тянул.\n\n- Мне не разрешили.\nМарк почувствовал, как начинает злиться.\n- Я разрешаю.\nМальчик посмотрел на него снизу вверх.\n- А вы кто?\n\nМарк открыл рот. Он мог назвать своё имя. Мог назвать должность, перечислить людей, которые выполнят его приказ. Внизу его ждала охрана. Где-то существовал телефон, по которому достаточно было сказать несколько слов. Но здесь всё это прозвучало бы так, как всегда звучало в этом коридоре. Он опустился на колени.\n- Я пришёл за тобой.\n\nМальчик посмотрел на его щёку. Потом осторожно прикоснулся к шраму одним пальцем.\n- Всё-таки останется?\nМарк кивнул.\n\nЗа спиной щёлкнул выключатель. Коридор сделался темнее. У лестницы стояла учительница младших классов.\n- Нам нужно закрывать.\nМарк не обернулся.\n- Он не может выйти.\n- Да.\nОна произнесла это без удивления. Марк сжал детскую руку.\n- Тогда я останусь.\n\nУчительница подождала. Она всегда умела ждать, когда ребёнок сам поймёт, насколько неудобно ведёт себя. Внизу хлопнула входная дверь. Марк больше не видел улицу.\n- У вас утром дела, - сказала она.\nОн хотел ответить, что никаких дел нет. Но уже вспомнил стол в бункере, приготовленные папки, людей, которые будут ждать его пробуждения. Вспомнил, как давно не спал до утра.\n\nМальчик всё ещё держал его за руку.\n- Ты опять придёшь?\nМарк посмотрел на него. Нужно было сказать «да». Учительница стояла рядом с выключателем. Марк почувствовал, как маленькие пальцы разжимаются. Не сразу. По одному, словно мальчик старался сделать это так, чтобы взрослому не пришлось высвобождать руку самому.\n- Я подожду, - сказал он.\n\nМарк вышел в коридор. Перед тем как закрыть дверь, оглянулся. Мальчик уже сидел на последней парте, положив руки перед собой. Марк осторожно повернул ручку, чтобы дверь не хлопнула.\n\nУтром он проснулся раньше дежурного. Впервые за много месяцев руки не болели. Подушка была сухой. Он лежал неподвижно, прислушиваясь к вентиляции, и знал, что больше в эту школу не вернётся. Когда принесли завтрак, Марк попросил не закрывать дверь. Дежурный остановился на пороге.\n- Ожидаете кого-нибудь?\nМарк долго смотрел мимо него, в пустой коридор."
 ADISCORD_rus_campaign.35.a:0 "Оставьте открытой"

 # National commissions and the final requests
 RUS_work_order_idle_tt:0 "Строительная и артиллерийская службы свободны от оплаченного заказа."
 RUS_work_order_refund_tt:0 "При утрате контроля над бункером или прекращении правления Хана заказ отменяется с полным возвратом оплаты. Стройка также отменяется, если площадка занята."
 RUS_civil_factory_order:0 "Заказать фабрику"
 RUS_civil_factory_order_desc:0 "Строительное ведомство подготовит площадку в [66.GetName] и доставит станки по общему заказу.\n\nСрок: 45 дней. Результат: одна гражданская фабрика. Строительство и артиллерийские заказы занимают одну общую очередь. После завершения действует перерыв 180 дней. Утрата контроля, власти Хана или свободного места возвращает всю оплату."
 RUS_civil_factory_order_site_tt:0 "Хан сохраняет власть; бункер в [66.GetName] принадлежит нам и контролируется нами; для фабрики есть свободное место."
 RUS_civil_factory_order_result_tt:0 "Через §Y45 дней§!: §G+1§! гражданская фабрика в [66.GetName]. Занимает общую очередь заказов."
 RUS_artillery_order:0 "Заказать батарейный комплект"
 RUS_artillery_order_desc:0 "Подготовленные батареи получат серийную партию орудий и инструментов.\n\nСрок: 30 дней. На склад поступят 120 единиц базовой артиллерии. Заказ использует ту же очередь, что и гражданская фабрика. После завершения действует перерыв 90 дней. При утрате контроля над бункером или власти Хана вся оплата возвращается."
 RUS_artillery_order_site_tt:0 "Хан сохраняет власть; бункер в [66.GetName] принадлежит нам и контролируется нами."
 RUS_artillery_order_result_tt:0 "Через §Y30 дней§!: §G120§! единиц базовой артиллерии на общий склад. Занимает общую очередь заказов."
 RUS_district_relief:0 "Выполнить заявки округов"
 RUS_district_relief_desc:0 "Представители округов свели в одну ведомость заявки на продовольствие и ремонт общественных зданий. Совет распределит помощь из запасов бункера.\n\nПомощь поступает сразу. Повторение через 90 дней. После провозглашения империи выполнение обещаний также восстанавливает мораль армии."
 RUS_district_relief_available_tt:0 "Работает представительство округов; Хан сохраняет власть и контроль над бункером."
 RUS_district_relief_result_tt:0 "Стабильность: §G+2%§!. Поддержка учёных: §G+5 п.п.§!. После провозглашения империи мораль армии: §G+5§!."
 RUS_machine_reserve_granted_tt:0 "Подготовлен один машинный резерв. Его можно выдать производству целиком или частично израсходовать на аварийный ремонт бункера. Выбор доступен в решениях развития страны."
 RUS_machine_reserve_release:0 "Передать машинный резерв производству"
 RUS_machine_reserve_release_desc:0 "Отдать инструменты мастерским и открыть резервный бюджет. Выдача использует весь машинный резерв; аварийный ремонт за его счёт станет недоступен."
 RUS_machine_reserve_release_available_tt:0 "Бункер работает, а машинный резерв ещё не использован."
 RUS_machine_reserve_release_result_tt:0 "На общий склад: §G400§! £support_equipment_texticon. В казну: §G600§! £ADISCORD_economy_treasury_texticon. Машинный резерв расходуется полностью."
 RUS_machine_reserve_repair:0 "Направить машинный резерв на аварийный ремонт"
 RUS_machine_reserve_repair_desc:0 "Аварийная служба заменит повреждённые насосы и затворы из неприкосновенного запаса. Ремонт доступен при прочности не выше 40 и выполняется сразу, не занимая и не отменяя оплаченную строительную очередь. Оставшаяся часть запаса поступит в распоряжение страны. Повторно использовать резерв нельзя."
 RUS_machine_reserve_repair_available_tt:0 "Бункер работает, машинный резерв не использован, прочность не выше 40."
 RUS_machine_reserve_repair_result_tt:0 "Прочность бункера: §G+60§! (не выше 100). На склад: §G200§! £support_equipment_texticon. В казну: §G300§! £ADISCORD_economy_treasury_texticon. Машинный резерв расходуется полностью."
 RUS_last_sky_closed_tt:0 "Программа завершена или ответ уже получен. Закрыть обращение без последствий."
 ADISCORD_rus_crisis.21.t:0 "Список на вывоз"
 ADISCORD_rus_crisis.21.d:0 "Инженер принёс к столу Хана две папки. В одной лежали расчёты орбитальной системы, в другой - списки врачей, преподавателей и хранителей архивов. Вторую папку не включили в план перевозок.\n\nЛюди, которых государство учило читать чертежи и лечить раненых, теперь просят места для семей и ящиков с записями. Инженер не спорит о приказе. Он спрашивает, кому понадобятся расчёты, если некому будет объяснить их детям.\n\nДля перевозки и размещения нужны 50 £ADISCORD_economy_treasury_texticon и 50 £support_equipment_texticon. Эвакуация не остановит орбитальный отсчёт."
 ADISCORD_rus_crisis.21.course.d:0 "Учёный совет собрался в том же помещении, где Хан когда-то обещал сделать знания государственным делом. Теперь на столе лежат списки врачей и преподавателей, описи архивов и заявки на транспорт. Мастерские продолжают выполнять военные заказы; свободных машин для этих людей не оставили.\n\nДокладчик просит сохранить хотя бы тех, кто ещё сможет лечить и учить. Ни один член совета не произносит вслух вопрос о том, что останется наверху. Хан слышит только шелест бумаги.\n\nДля перевозки и размещения нужны 50 £ADISCORD_economy_treasury_texticon и 50 £support_equipment_texticon. Эвакуация не остановит орбитальный отсчёт."
 ADISCORD_rus_crisis.21.decline:0 "Оставить транспорт в распоряжении фронта."
 ADISCORD_rus_crisis.21.accept:0 "Выделить машины и подготовить помещения."
 RUS_last_sky_science_accept_tt:0 "Расход: §R50§! £ADISCORD_economy_treasury_texticon и §R50§! £support_equipment_texticon. Поддержка учёных: §G+10 п.п.§!. Мораль армии: §G+5§!. Срок удара не меняется."
 RUS_last_sky_science_decline_tt:0 "Поддержка учёных: §R-10 п.п.§!. Запасы остаются у страны. Срок удара не меняется."
 ADISCORD_rus_crisis.22.t:0 "Те, кто должен сменить караул"
 ADISCORD_rus_crisis.22.d:0 "Из полков пришли одинаковые просьбы: дать инструкторам отдых, собрать раненых командиров и накормить людей, которых готовят на смену. Офицерская школа продолжает выпускать младших начальников, но всё чаще их отправляют к подразделениям без положенного обоза.\n\nНачальник службы резервов положил перед Ханом ведомость. В ней нет новых дивизий. Есть фамилии людей, которые уже служат и которым обещали подготовленную смену. Он просит оплатить размещение и открыть продовольственный склад.\n\nПотребуются 35 £ADISCORD_economy_treasury_texticon и 30 £supply_texticon из запасов бункера. Действующие части сохранят свои позиции; приказ не создаёт новые формирования."
 ADISCORD_rus_crisis.22.course.d:0 "В штабе Чёрной армии ещё помнят день присяги. Тогда каждый аймак обещал людей, а столица - снабжение и общий резерв. Теперь командиры принесли обратно копию этого приказа. На полях появились фамилии погибших инструкторов и номера рот, которым некем заменить уставших начальников.\n\nОни не требуют снять караулы с периметра. Они требуют накормить и разместить кадровую смену, пока её ещё можно подготовить. Хан смотрит на собственную печать под старым обещанием.\n\nПотребуются 35 £ADISCORD_economy_treasury_texticon и 30 £supply_texticon из запасов бункера. Действующие части сохранят свои позиции; приказ не создаёт новые формирования."
 ADISCORD_rus_crisis.22.decline:0 "Резерв получит довольствие в общей очереди."
 ADISCORD_rus_crisis.22.accept:0 "Открыть склад для кадровой смены."
 RUS_last_sky_army_accept_tt:0 "Расход: §R35§! £ADISCORD_economy_treasury_texticon и §R30§! £supply_texticon. Поддержка Чёрной армии: §G+10 п.п.§!. Мораль армии: §G+8§!. Срок удара не меняется."
 RUS_last_sky_army_decline_tt:0 "Поддержка Чёрной армии: §R-10 п.п.§!. Мораль армии: §R-5§!. Запасы остаются у страны."
 ADISCORD_rus_crisis.23.t:0 "Обещание над землёй"
 ADISCORD_rus_crisis.23.d:0 "К воротам бункера принесли пачку ханских грамот. На бумаге значились почтовые станции, школы, лазареты и дома, которым обещали защиту. Посланцы не знали, какие из этих обещаний ещё действуют. Они просили отправить продовольствие и деньги для укрытий до закрытия дорог.\n\nРадист приготовил обращение о стойкости. Один из посланцев спросил, можно ли вместо нового обращения получить обоз. Ответа в подготовленном тексте не оказалось.\n\nДля помощи нужны 35 £ADISCORD_economy_treasury_texticon и 40 £supply_texticon из запасов бункера. Обоз поможет людям сейчас; он не отменит приказ об ударе."
 ADISCORD_rus_crisis.23.course.d:0 "Представители округов заняли свои места за общим столом. Когда их впервые допустили к Хану, они докладывали о воде, жилье и мастерских. Сегодня все ведомости заканчиваются одной строкой: сколько людей ещё можно разместить под крышей и чем их кормить.\n\nУ каждого есть копия грамоты о представительстве. Никто не размахивает ею. Старший кладёт документ рядом со списком нуждающихся и просит выполнить хотя бы эту заявку до закрытия дорог. За дверью уже ждёт радиослужба с очередным обращением к аймакам.\n\nДля помощи нужны 35 £ADISCORD_economy_treasury_texticon и 40 £supply_texticon из запасов бункера. Обоз поможет людям сейчас; он не отменит приказ об ударе."
 ADISCORD_rus_crisis.23.decline:0 "Запасы должны остаться под землёй."
 ADISCORD_rus_crisis.23.accept:0 "Отправить обещанную помощь."
