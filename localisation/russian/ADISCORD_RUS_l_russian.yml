 RUS_bunker_workshop_delta:0 "Подземный арсенал"
 RUS_bunker_workshop:0 "Слой 3: подземный арсенал"
 RUS_bunker_workshop_desc:0 "Станки опускают по одному, разобрав до последнего кожуха. Здесь смена не прекратится из-за воздушной тревоги, но каждый двигатель потребует своей доли энергии.\n\nСтроительство: 21 день. Один вариант на слой.\nСодержание: §Y1§! £supply_texticon в неделю.\n\n[GetRUSBunkerForecastworkshop]\n\nДействующая мастерская открывает заказ инженерного оснащения и обучение мастеров: заказ даёт §G150§! £support_equipment_texticon вместо 100, обучение - §G40§! очков развития экономики вместо 25. Полученные оснащение и знания принадлежат стране.\n\nПосле «Серийных заказов»: ещё +3% выпуска военных заводов. После «Авиационных мастерских»: ещё +3% скорости роста эффективности производства."
