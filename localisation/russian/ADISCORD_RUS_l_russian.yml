 RUS_suspicion_energy_cover:0 "Выдать реактор за энергетическую программу"
 RUS_suspicion_energy_cover_desc:0 "Учёные покажут иностранным наблюдателям турбины, сети и мастерские, а орбитальные расчёты на время уйдут в закрытые архивы."
