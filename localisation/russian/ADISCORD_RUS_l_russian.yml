# --- rus_perimeter_story ---
 ADISCORD_rus_campaign.14.t:0 "Ночная смена"
 ADISCORD_rus_campaign.14.d:0 "Телефон на заброшенном пропускном пункте зазвонил после полуночи. Полевой кабель обрывался в канаве, поэтому караульный сперва решил, что звук идёт из соседней комнаты. В трубке попросили открыть ворота ремонтной смене. Голос говорил буднично, устало, словно звонил сюда каждую ночь.\n\nНа рассвете к периметру подошёл грузовик без знаков. У водителя оказались новые фильтры, старый пропуск Воркерланда и точное название поста, стёртое с вывески много лет назад. Увидев чужой караул, он развернулся. Дозорные не стали преследовать машину за предупредительными столбами.\n\nХану передали телефон и донесение. Связист нашёл внутри отдельный приёмник: кто-то сохранил связь там, где официально не осталось ничего живого. На обороте пропуска водитель успел оставить отпечаток мокрого пальца. Рядом читалось название службы: периметр «Мёртвая зона». Рустан велел нанести пост на карту. Ночью телефон снова зазвонил, уже в его канцелярии."
 ADISCORD_rus_campaign.14.a:0 "Запишите каждое слово."
 ADISCORD_rus_campaign.15.t:0 "Две накладные"
 ADISCORD_rus_campaign.15.d:0 "Среди бумаг, собранных скупщиками у западной границы, нашлись две накладные. Одна принадлежала отряду, охранявшему переправу. Другая - людям, которые уже третью зиму пытались эту переправу сжечь. Различались имена посредников и цвет печатей. Номера ящиков шли подряд.\n\nПисец проследил платежи до одного воркерландского склада. Оттуда выдавали патроны, лекарства и запасные части обеим сторонам, но никогда не отправляли столько, чтобы одна могла окончательно победить. После каждой попытки договориться появлялась новая поставка и новое известие о предательстве соседей.\n\nНа последнем листе вместо получателя было написано: «Не допускать устойчивого объединения маршрутов». Ниже стояли расходы на похороны проводника. Человек собирался провести общую экспедицию к реактору и погиб на дороге, которую обе стороны считали безопасной. Рустан долго смотрел на одинаковые номера. Чужая война оказалась чьей-то аккуратно оплаченной работой."
 ADISCORD_rus_campaign.15.a:0 "Найдите тех, кто сводил эти счета."
 ADISCORD_rus_campaign.16.t:0 "Имя на чертеже"
 ADISCORD_rus_campaign.16.d:0 "Опись реакторного пояса началась с бумаг заводского архива. На ранних чертежах нулевой точки имя Дориана Воркса стояло рядом с должностью научного руководителя. Он работал учёным Вейранской империи, рассчитывал узлы, спорил с подрядчиками и лично подписывал изменения. Это было его создание.\n\nВ пояснительных записках он обещал энергию городам и производству. На полях экземпляра, оставленного в архиве, шёл другой разговор. Напротив сметы дворцовой подстанции было написано: «Ещё сто лет света тем же окнам». Напротив требования ограничить доступ к разработке - длинный перечень монархий и наследственных привилегий. Последняя запись занимала всего одну строку: «Они купят у будущего электричество, чтобы оно никогда не наступило».\n\nХан провёл пальцем по фамилии. До сих пор реактор представлялся ему чужой развалиной, оставшейся после чужой ошибки. Теперь у развалины появился создатель, а у создателя - причина ненавидеть тех, кому он служил."
 ADISCORD_rus_campaign.16.a:0 "Сохранить чертежи вместе с пометками."
 ADISCORD_rus_campaign.17.t:0 "По ту сторону породы"
 ADISCORD_rus_campaign.17.d:0 "В дальней галерее рабочие услышали три коротких удара и один длинный. Проходчик ответил рукоятью инструмента. Из породы постучали снова, на этот раз с другой стороны. По плану там не было ни выработки, ни трубы.\n\nИнженер остановил машины и проверил старый служебный кабель, уходивший к западным объектам. По броне действительно могла передаваться вибрация. Объяснение успокоило смену, пока из отключённого переговорного устройства не попросили принести сухую одежду. Голос назвал номер реакторного цеха. В списках эвакуации этот цех значился потерянным.\n\nХан потребовал записать услышанное без пересказов. В протоколе появились время, имена свидетелей и слова человека, которого никто не видел. Последним расписался старый мастер. Он попросил не оставлять в галерее одного дежурного: следующей ночью голос может оказаться знакомым. Рустан разрешил парный пост. Объяснять, чего именно они будут охранять, он не стал."
 ADISCORD_rus_campaign.17.a:0 "Никто не спускается один."
 ADISCORD_rus_campaign.18.t:0 "Подпись под взрывом"
 ADISCORD_rus_campaign.18.d:0 "В ящике технических документов, переданных на хранение в бункер, лежала копия аварийного журнала. Между обычными распоряжениями обнаружился отдельный лист: отключить защиту внешних контуров, вывести выбранные группы специалистов, сохранить глубинный узел. Под ним стояла подпись Дориана Воркса.\n\nЭто не было заключением комиссии, написанным после катастрофы. Приказ предшествовал ей. Запись переговоров подтверждала, что создатель реактора сам тайно руководил его подрывом. Дежурный дважды спрашивал об эвакуации остальных смен. Воркс потребовал продолжать последовательность. После второго вопроса в записи остался только шум.\n\nКопию сопровождала записка о политических последствиях. Гибель комплекса должна была сломать власть монархий Вейранской империи и открыть путь Воркеру. Дориан называл это началом опыта. Хан дочитал лист стоя. На полях журнала кто-то успел записать фамилии людей, оставшихся в цехах. Возле одной фамилии был нарисован маленький дом."
 ADISCORD_rus_campaign.18.a:0 "Эта подпись останется в архиве."
 ADISCORD_rus_campaign.19.t:0 "Экспедиция, которая не вышла"
 ADISCORD_rus_campaign.19.d:0 "При подготовке реакторных вылазок проводник принёс папку прежней экспедиции. Три поселения собирались выступить вместе: одно давало машины, другое - продовольствие, третье - людей, знавших старые служебные дороги. Они успели согласовать всё, кроме дня выхода.\n\nЗатем каждому пришло предупреждение. Первым сообщили, что соседи продадут их охране периметра. Вторым - что машины заминированы. Третьим прислали список заложников с именами их детей. Собрание закончилось стрельбой. Через неделю по тем же дорогам прошёл ремонтный караван с воркерландскими пропусками.\n\nПроводник сохранил предупреждения. На всех трёх листах одна буква была отпечатана с одинаковым сколом. Хан спросил, почему бумаги не сравнили раньше. Старик ответил, что после похорон люди перестали ходить друг к другу. В папке лежала общая карта с тремя подписями. Дорога к реактору на ней была прочерчена уверенно, до самого внутреннего кольца."
 ADISCORD_rus_campaign.19.a:0 "Копии предупреждений раздать командирам."
 ADISCORD_rus_campaign.20.t:0 "Содержать клетку"
 ADISCORD_rus_campaign.20.d:0 "Специалистам по обеззараживанию передали найденную инструкцию службы периметра. Первые страницы были обычными: смена фильтров, проверка воды, дозиметрический контроль. Затем начинались запрещённые работы. Не восстанавливать непрерывное питание внутренних линий. Не объединять местные администрации. Не допускать исследовательских групп к глубинному узлу.\n\nПоследнее приложение объясняло, зачем Воркерланд сохранял «Мёртвую зону». Под разрушенным комплексом уцелел остаток реактора нулевой точки. Его нельзя было считать погасшим. Служба должна была поддерживать разрыв дорог, связи и власти вокруг него, пропуская только собственные смены по узким коридорам. Большинство постов получало лишь санитарные инструкции; полное назначение периметра знали немногие.\n\nВнизу стояло распоряжение Воркса: сохранять изоляцию даже при потере связи с центром и смене правительства. Отдельной строкой запрещалось разбирать ядро. Хан задержался на приписке карандашом: «Разрушение оболочки не означает прекращения процесса». Люди жили возле клетки и считали её развалинами."
 ADISCORD_rus_campaign.20.a:0 "Сначала понять, что удерживают эти стены."
 ADISCORD_rus_campaign.21.t:0 "Спутник без государства"
 ADISCORD_rus_campaign.21.d:0 "При разборе старых схем связи инженер нашёл линию, которая не заканчивалась ни в одном наземном узле. Она уходила к станции сопровождения спутника. В каталоге Воркерланда аппарат значился выведенным из эксплуатации; в закрытом журнале оставались поправки его орбиты и расписание сеансов после официального списания.\n\nНа схеме реакторного комплекса та же линия была обозначена как канал управления Лучом. Орбитальная установка принадлежала старому Воркерланду. Её не уничтожили вместе с наземными сооружениями, а исключили из открытых ведомостей. В одном из расчётов направление передачи энергии было обращено обратно: со спутника в глубинный узел реактора. Последнюю страницу из папки вырезали.\n\nХан вышел из командной комнаты и поднялся к караулу. Небо было ясным. Он спросил, можно ли увидеть аппарат без приборов. Инженер ответил, что для этого нужно знать, куда смотреть. Рустан ещё немного постоял у входа, запрокинув голову. Потом велел сохранить расписание, ничего не передавая на найденной частоте."
 ADISCORD_rus_campaign.21.a:0 "Пока только слушать."
 ADISCORD_rus_campaign.22.t:0 "Предел опыта"
 ADISCORD_rus_campaign.22.d:0 "В лабораторию поступили копии закрытых расчётов Дориана Воркса. В ранней таблице последствия подрыва ограничивались реакторным комплексом и прилегающими территориями. Поздняя таблица была исписана исправлениями. На месте прежнего предела стояло слово «не установлен».\n\nСохранившаяся нулевая точка могла принять внешний импульс. При определённом воздействии энергия не рассеивалась в разрушенной оболочке, а возвращалась в процесс. Воркс отдельно рассматривал удар Луча со старого спутника Воркерланда. Расчёт не давал безопасной границы: разрушение реактора грозило катастрофой мирового масштаба. Под заключением стояло требование исключить любой доступ к запуску.\n\nВ записке к службе периметра Дориан уже не рассуждал о прогрессе. Он требовал находить пропавшие чертежи и задерживать людей, способных прочитать их. Последняя фраза была подчёркнута несколько раз: «Опыт не должен получить второго автора». Рустан попросил оставить ему копию. Начальник лаборатории впервые не сразу выполнил приказ."
 ADISCORD_rus_campaign.22.a:0 "Положите её передо мной."
 ADISCORD_rus_campaign.23.t:0 "Передатчик был отключён"
 ADISCORD_rus_campaign.23.d:0 "Связисты свели записи старых частот периметра. Часть голосов оказалась служебной библиотекой: просьбы о помощи, переклички смен, команды эвакуации. Передатчики включали их на дорогах, которые следовало удерживать пустыми. В журнале отмечали, после какой записи проводники отказывались вести людей дальше.\n\nНо одна смена подала жалобу на передачу, которой не было в библиотеке. Женский голос называл охранников по именам и просил не закрывать дверь. Начальник поста приказал отключить установку. Голос продолжал звучать ещё одиннадцать минут. Техник приложил акт снятия питания и отдельно отметил: резервная батарея находилась у него на столе.\n\nХан спросил, нельзя ли было передавать с соседнего поста. Связист ответил, что можно. Тогда Рустан указал на последнюю строку. Один из названных охранников был принят на службу через девять дней после происшествия. В журнале его фамилию сначала зачеркнули, затем вписали снова другим почерком."
 ADISCORD_rus_campaign.23.a:0 "Оставьте обе записи."
 ADISCORD_rus_campaign.24.t:0 "Резерв для следующей власти"
 ADISCORD_rus_campaign.24.d:0 "В документах по снабжению литейных нашлась ведомость законсервированных станков. Оборудование выводили из общего хозяйства небольшими партиями. Вместе с ним исчезали запасы инструмента и личные дела специалистов. Получателем числился технический резерв Дориана Воркса.\n\nК ведомости была подшита записка, составленная ещё до прихода Воркера к власти. Дориан ожидал, что его идеи разрушат снабжение и столкнут между собой учреждения страны. Для каждого предполагаемого кризиса были подготовлены свои люди, склады и вооружённые группы. Воркс собирался выступить, когда власть Воркера потеряет опору, и занять центры управления раньше остальных претендентов.\n\nНа полях стояла фраза: «Население должно сначала исчерпать доверие к альтернативам». Рустан перечитал её вслух. В комнате никто не ответил. Человек, подписавший бумагу, собирался дождаться чужого голода с полными складами и предъявить их как доказательство своего права править. Исполнится ли его прогноз, решали уже живые люди за пределами этой папки."
 ADISCORD_rus_campaign.24.a:0 "У его ожидания были склады и гарнизоны."
 ADISCORD_rus_campaign.25.t:0 "Страх неподвижного мира"
 ADISCORD_rus_campaign.25.d:0 "Для училища разобрали собрание старых научных докладов. В закрытом приложении к одному из них Дориан Воркс рассуждал о мире, который научился бесконечно продлевать собственное существование, ничего в себе не меняя. Династии наследуют электростанции, чиновники - запреты, дети - место родителей. Даже бессмертие в таком мире он называл усовершенствованным заключением.\n\nДалее шли заметки о Воркерланде. Падение монархий Вейранской империи, правление Воркера, ожидаемый крах его идей и наступление подготовленной технической власти были перечислены как стадии одного опыта. Дориан боялся, что без толчка история остановится. Право выбрать силу этого толчка он оставлял себе.\n\nХан попросил преподавателя прочитать последнюю страницу. Там Воркс сравнивал людей с поколениями исследователей: одни начинают работу, другие получают результат. Между строк не было места для тех, кто не хотел участвовать. Рустан закрыл папку и долго молчал. Потом спросил, чем отличается от Воркса правитель, решивший, что только его собственный порядок способен дать миру будущее. Преподаватель не стал отвечать за него."
 ADISCORD_rus_campaign.25.a:0 "Пусть этот вопрос останется открытым."

# Campaign briefing
 RUS_startup_country:0 "§YЗЕМЛЯ ХАНА В 2160 ГОДУ§!\n\nМарк Рустан объединяет аймаки, пограничные сотни и людей подземного комплекса. За пределами своего поселения старые договорённости быстро теряют силу: стране нужны общий учёт, постоянное снабжение и учреждения, способные исполнить приказ. Хан начинает с земли, которую ещё предстоит превратить в государство.\n\n§YДве опоры одной власти§!\nЧёрная армия охраняет входы и границы, требуя резервов и единого командования. Учёные поддерживают генераторы, воду и лаборатории. Обе силы подчиняются Рустану, но по-разному представляют будущее. Выбор между ними определит государственную программу; их поддержка и положение на балансе власти продолжат меняться по ходу кампании.\n\n§YПод землёй и на поверхности§!\nБункер даёт стране защиту и прикладные возможности, но требует мощности, продовольствия и крепких сводов. Поверхность нуждается в школах, дорогах, мастерских и врачах. Уход от аграрного хозяйства и традиционного общества достигается фокусами, законами и оплачиваемыми программами развития.\n\n§YЗа западным рубежом§!\nРаспад Воркерланда открывает дорогу в Грязную зону. Пограничные походы могут привести к провозглашению империи и новым войнам. Чем дальше простирается власть Хана, тем важнее понимать последствия следующего шага: реакторный периметр связан с поздним кризисом всей кампании."
 RUS_startup_guide_state_title:0 "Государство и развитие"
 RUS_startup_guide_bunker_title:0 "Бункер и его ресурсы"
