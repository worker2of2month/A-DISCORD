 RUS_machine_reserve_repair:0 "Направить машинный резерв на аварийный ремонт"
 RUS_machine_reserve_repair_desc:0 "Аварийная служба спускается к повреждённым насосам. В галереях разворачивают запасные узлы и проверяют крепления."
