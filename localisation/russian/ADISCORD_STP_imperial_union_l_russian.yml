l_russian:
 STP_imperial_union_category: "Стеландский Имперский Союз"
 STP_imperial_union_category_desc: "Гегемония перестаёт быть доктриной в тот момент, когда её границы становятся фактом. После разгрома Кефрейта и Нодрула Шабрат может закрепить новый порядок только тогда, когда весь заявленный пояс территорий принадлежит Стеланду и находится под его контролем."
 STP_proclaim_imperial_union: "Провозгласить Имперский союз"
 STP_proclaim_imperial_union_desc: "Войны дали Стеланду пространство, но ещё не дали ему формы. Собрав заявленные земли под одной властью, Шабрат может отказаться от временного языка послевоенного государства и провозгласить Стеландский Имперский Союз. Решение не передаёт территории автоматически: границы Союза должны быть завоёваны заранее."
 STP_imperial_union_kefreyt_defeated: "Кефрейт побеждён"
 STP_imperial_union_nodrul_defeated: "Нодрул побеждён"
 STP_imperial_union_required_states_controlled: "Все земли будущего Имперского союза принадлежат нам и находятся под нашим контролем"
 STP_imperial_union_requirements_met: "Выполнены условия провозглашения Имперского союза"
 STP_imperial_union_proclaimed: "Стеландский Имперский Союз провозглашён"
