 IVN_exercitus_imperialis:0 "Exercitus Imperialis"
 IVN_exercitus_imperialis_desc:0 "Имперская армия. Полки Легиона становятся ядром единого военного командования; флот и авиация принимают общий устав и присягу Империуму."
 IVN_oeconomia_solis_nigri:0 "Oeconomia Solis Nigri"
 IVN_oeconomia_solis_nigri_desc:0 "Экономика Чёрного Солнца. Военные мастерские, верфи и гражданские предприятия связывает единая система имперских заказов. Возрождение страны становится государственной обязанностью."
