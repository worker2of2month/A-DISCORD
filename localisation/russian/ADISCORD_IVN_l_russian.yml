# Committee and staff, trust of the frontier marches
 IVN_marches_initialize_tt:0 "Открываются баланс §YКомитет и штаб§! и §Yдоверие приграничных марок§!. Влияние штаба определяет долю армии Военной директории при гражданской войне; доверие влияет на местные программы и переход гарнизонов."
 IVN_command_bop:0 "Комитет и штаб"
 IVN_command_category:0 "Комитет и штаб"
 IVN_command_category_desc:0 "Чрезвычайный комитет и Штаб марок спорят о власти над армией. Легион освобождения получает 35% регулярных частей при расколе. Директория Карна получает 10%, 5% после его отстранения или 15% при продвижении Карна либо перевесе штаба. Общины и автономисты получают 8% и 7%; оставшаяся армия сохраняется у Комитета."
 IVN_committee_side:0 "Комитет"
 IVN_staff_side:0 "Штаб марок"
 IVN_command_compromise:0 "Равновесие властей"
 IVN_committee_influence:0 "Голос Комитета"
 IVN_committee_control:0 "Гражданский контроль армии"
 IVN_committee_dominance:0 "Генералы отстранены"
 IVN_staff_influence:0 "Голос штаба"
 IVN_staff_control:0 "Армия решает сама"
 IVN_staff_dominance:0 "Власть штаба"
 IVN_staff_leads_tt:0 "Баланс §YКомитет и штаб§! на стороне штаба"
 IVN_committee_leads_tt:0 "Баланс §YКомитет и штаб§! на стороне Комитета"
 IVN_cabinet_won_tt:0 "Кабинет победил в войне марок"
 IVN_march_loyal:0 "Верная марка"
 IVN_march_disloyal:0 "Ненадёжная марка"
 IVN_march_trust_now_tt:0 "Доверие марки [FROM.GetName] к столице: §Y[?FROM.IVN_march_trust|0]§! из §Y100§!"
 IVN_march_measure_ready_tt:0 "В марке не идёт другая мера и не было меры в последние §Y30§! дней"
 IVN_march_trust_plus_10_tt:0 "Доверие марки [FROM.GetName]: §G+10§!"
 IVN_march_trust_plus_12_tt:0 "Доверие марки [FROM.GetName]: §G+12§!"
 IVN_march_trust_plus_15_tt:0 "Доверие марки [FROM.GetName]: §G+15§!"
 IVN_march_trust_minus_8_tt:0 "Доверие марки [FROM.GetName]: §R-8§!"
 IVN_march_trust_minus_15_tt:0 "Доверие марки [FROM.GetName]: §R-15§!"
 IVN_march_hospital_train:0 "Госпитальный поезд: [FROM.GetName]"
 IVN_march_hospital_train_desc:0 "Санитарный поезд Комитета стоит на станции марки три недели. Врачи принимают всех, кто придёт, и не спрашивают, за кого голосовала деревня."
 IVN_march_veterans_fund:0 "Касса ветеранов: [FROM.GetName]"
 IVN_march_veterans_fund_desc:0 "Ветераны марки получают пенсии и землю из общей кассы. Многие из них возвращаются в резерв."
 IVN_march_school_grant:0 "Школьная субсидия: [FROM.GetName]"
 IVN_march_school_grant_desc:0 "Комитет оплачивает учителей и дорогу к новой школе. Дети марки будут учиться по книгам столицы."
 IVN_march_commissar:0 "Комиссар Комитета: [FROM.GetName]"
 IVN_march_commissar_desc:0 "В марку едет комиссар с правом подписи. Он решает споры с гарнизоном от имени гражданской власти."
 IVN_march_officer_assembly:0 "Офицерское собрание: [FROM.GetName]"
 IVN_march_officer_assembly_desc:0 "Офицеры гарнизона собираются с главами общин марки. Армия обещает защищать, марка - кормить."
 IVN_march_levy:0 "Набор в марке: [FROM.GetName]"
 IVN_march_levy_desc:0 "Призывная комиссия приезжает в марку раньше срока. Семьи провожают сыновей и запоминают, кто их забрал."

# Balance decisions
 IVN_command_staff_conference:0 "Совещание в штабе марок"
 IVN_command_staff_conference_desc:0 "Комитет приглашает генералов изложить свои планы. Те, кого выслушали, охотнее подчиняются."
 IVN_command_committee_hearings:0 "Слушания в Комитете"
 IVN_command_committee_hearings_desc:0 "Депутаты вызывают генералов на открытые слушания. Армия отчитывается перед республикой."
 IVN_command_budget_to_staff:0 "Оборонный бюджет штабу"
 IVN_command_budget_to_staff_desc:0 "Штаб получает право тратить оборонный бюджет без согласования. Через два месяца у армии будут новые орудия и винтовки - и новые привычки."
 IVN_command_civil_audit:0 "Гражданский аудит армии"
 IVN_command_civil_audit_desc:0 "Ревизоры Комитета проверяют склады штаба. То, что числилось списанным, возвращается в арсеналы."

# Expedition
 IVN_expedition_category:0 "Северная экспедиция"
 IVN_expedition_category_desc:0 "Программы корпуса, которые можно применить в выбранный момент, пока идёт северная экспедиция."
 IVN_expedition_supply_columns:0 "Обозы экспедиции"
 IVN_expedition_supply_columns_desc:0 "Колонны грузовиков идут за корпусом по дорогам коридора. Солдаты получают хлеб и патроны там, где воюют."
 IVN_expedition_storm_assault:0 "Штурмовые колонны"
 IVN_expedition_storm_assault_desc:0 "Лучшие роты корпуса идут в первой волне. Их задача - войти в город раньше, чем противник опомнится."
 IVN_expedition_krait_bridgehead:0 "Плацдарм у Крайта"
 IVN_expedition_krait_bridgehead_desc:0 "Сапёры наводят переправы у Крайта. Корпус переходит реку одним броском, а за ним остаются мосты."

# Revolt of the marches: the cabinet
 IVN_civil_war_category:0 "Мятеж марок"
 IVN_civil_war_category_desc:0 "Чрезвычайный кабинет воюет с Иторским легионом освобождения. Марки, которые ещё доверяют столице, можно вернуть без боя."
 IVN_march_borders_our_lines_tt:0 "Марка граничит с землёй, которую мы контролируем"
 IVN_cw_amnesty_trust_tt:0 "Доверие марки к столице не ниже §Y60§!"
 IVN_cw_amnesty_offer:0 "Амнистия: [FROM.GetName]"
 IVN_cw_amnesty_offer_desc:0 "Посланцы кабинета обещают гарнизону марки прощение и жалованье. Если марка ещё верит столице, она откроет ворота."
 IVN_cw_amnesty_offer_tt:0 "Через §Y30§! дней марка [FROM.GetName] перейдёт к нам, если по-прежнему будет у легиона, сохранит доверие от §Y60§! и будет граничить с нашей землёй. Её гарнизон приведёт §Y3000§! £manpower_texticon, а легион столько же потеряет. Иначе цена вернётся."
 IVN_cw_capital_militia:0 "Ополчение Старой марки"
 IVN_cw_capital_militia_desc:0 "Рабочие кварталы столицы выставляют ополчение. Оно плохо обучено, но знает каждую улицу."
 IVN_cw_issue_war_bonds:0 "Военный заём"
 IVN_cw_issue_war_bonds_desc:0 "Кабинет выпускает облигации обороны. Деньги идут на заводы, а долг ляжет на мирное время."
 IVN_cw_rimat_arms:0 "Оружие Римата"
 IVN_cw_rimat_arms_desc:0 "Торговые дома Римата продают кабинету винтовки и орудия из своих запасов. Римат помнит, кто гарантировал его свободу."
 IVN_cw_military_tribunals:0 "Военные трибуналы"
 IVN_cw_military_tribunals_desc:0 "Полковники вводят трибуналы за дезертирство и измену. Фронт держится, но марки запоминают приговоры."
 IVN_cw_tribunals_trust_tt:0 "Доверие всех приграничных марок: §R-5§!"
 IVN_cw_island_convoys:0 "Островные конвои"
 IVN_cw_island_convoys_desc:0 "Корабли Островного управления везут на материк резервистов и оружие со складов, приготовленных на чёрный день."

# Revolt of the marches: the legion
 IVC_legion_category:0 "Иторский легион освобождения"
 IVC_legion_category_desc:0 "Легион воюет за счёт своих марок. Гарнизоны кабинета, которые не верят столице, можно позвать к себе."
 IVC_garrison_appeal_trust_tt:0 "Доверие марки к столице ниже §Y40§!"
 IVC_garrison_appeal:0 "Воззвание к гарнизону: [FROM.GetName]"
 IVC_garrison_appeal_desc:0 "Бывшие сослуживцы пишут гарнизону марки: столица предала корпус, легион своих не бросает."
 IVC_garrison_appeal_tt:0 "Через §Y30§! дней марка [FROM.GetName] перейдёт к легиону, если по-прежнему будет у кабинета, её доверие к столице останется ниже §Y40§! и она будет граничить с нашей землёй. Её гарнизон приведёт §Y3000§! £manpower_texticon, а кабинет столько же потеряет. Иначе цена вернётся."
 IVC_requisition_march:0 "Реквизиция: [FROM.GetName]"
 IVC_requisition_march_desc:0 "Интенданты легиона забирают хлеб, металл и мужчин призывного возраста под расписки будущей власти."
 IVC_veterans_muster:0 "Сбор ветеранов"
 IVC_veterans_muster_desc:0 "Ветераны северной экспедиции получают повестки легиона. Большинство приходит без повторного вызова."
 IVC_march_on_the_capital:0 "Наступление на столицу"
 IVC_march_on_the_capital_desc:0 "Легион бросает все силы в наступление на юг. Если удар не удастся, второго такого случая может не быть."
 IVC_border_smugglers:0 "Контрабанда через границу"
 IVC_border_smugglers_desc:0 "Караваны везут патроны и орудия через борейские перевалы и северный коридор."
 IVC_border_smugglers_closed_tt:0 "Кабинет не закрыл борейскую границу"
 IVC_legion_dynamic:0 "Порядок легиона"
 IVC_legion_dynamic_desc:0 "Итог решений Иторского легиона освобождения: армия, марки и обещания Леонида Сталка."

# Spirits of the revolt
 IVN_cw_divided_army:0 "Расколотая армия"
 IVN_cw_divided_army_desc:0 "Полки, присягавшие одной республике, стреляют друг в друга. Командиры не знают, чей приказ выполнят их солдаты."
 IVN_cw_loyal_officers:0 "Верные офицеры"
 IVN_cw_loyal_officers_desc:0 "Офицеры, которых не повёл за собой Карн, держат армию кабинета вместе."
 IVN_cw_war_bonds:0 "Облигации обороны"
 IVN_cw_war_bonds_desc:0 "Деньги военного займа идут на заводы, а граждане покупают меньше и ждут победы."
 IVN_cw_counterstroke_idea:0 "Контрудар кабинета"
 IVN_cw_counterstroke_idea_desc:0 "Резервы и артиллерия собраны для одного удара. Армия кабинета наступает."
 IVN_cw_storm_of_vedrina:0 "Штурм Ведрины"
 IVN_cw_storm_of_vedrina_desc:0 "Армия кабинета идёт на столицу легиона."
 IVC_legion_vow:0 "Клятва легиона"
 IVC_legion_vow_desc:0 "Солдаты марок присягнули земле, которую защищали. Они будут драться до конца, но марки содержат их из своего кармана."
 IVC_storm_of_the_capital:0 "Штурм столицы"
 IVC_storm_of_the_capital_desc:0 "Легион бросает всё в последний удар на Старую марку."
 IVN_rule_of_the_legion_council:0 "Власть совета легиона"
 IVN_rule_of_the_legion_council_desc:0 "Итора управляется советом командиров, победивших в войне марок. Порядок здесь строгий, а политика - лишняя."
 IVN_rule_of_the_patriotic_union:0 "Власть Патриотического союза"
 IVN_rule_of_the_patriotic_union_desc:0 "Иторский Патриотический Союз пришёл к власти вместе с легионом. Его митинги собирают целые города, а его враги молчат."

# Events
 ADISCORD_ivn.6.t:0 "Возвращение экспедиции"
 ADISCORD_ivn.6.d:0 "Северный корпус возвращается домой без победы. Эшелоны с ранеными стоят на станциях Ведрины и Талары, а газеты столицы уже ищут виноватых. В штабе марок говорят о предательстве депутатов, в Комитете - о самоуверенности генералов.\n\nКабинет должен ответить сейчас. Через месяц полки придут в казармы и решат, кому подчиняться, - и они будут помнить, что сказала столица в день их возвращения."
 ADISCORD_ivn.6.a:0 "Штаб провалил поход."
 ADISCORD_ivn.6.a_tt:0 "Доверие северных марок [92.GetName], [95.GetName], [96.GetName] и [97.GetName]: §R-10§!"
 ADISCORD_ivn.6.b:0 "Кабинет берёт вину на себя."
 ADISCORD_ivn.6.b_tt:0 "Доверие всех приграничных марок: §G+10§!"
 ADISCORD_ivn.6.c:0 "Наградить вернувшихся."
 ADISCORD_ivn.6.c_tt:0 "Доверие северных марок [92.GetName], [95.GetName], [96.GetName] и [97.GetName]: §G+15§!"
 ADISCORD_ivn.7.t:0 "Марка сменила сторону"
 ADISCORD_ivn.7.d:0 "Гарнизон [IVN_defected_march.GetName] открыл ворота врагу. Солдаты ушли вместе с городом, а наши посты на дорогах узнали о переходе последними."
 ADISCORD_ivn.7.a:0 "Её ещё можно вернуть."
 ADISCORD_ivn.8.t:0 "Генералы молчат"
 ADISCORD_ivn.8.d:0 "Комитет взял армию под полный контроль. Приказы подписывают депутаты, а штаб марок отвечает на них коротко и с опозданием. Офицеры говорят, что их превратили в писарей, и некоторые уже пишут прошения об отставке.\n\nМожно вернуть штабу часть полномочий. Можно принять отставки и вырастить новых командиров - но армия запомнит, как с ней обошлись."
 ADISCORD_ivn.8.a:0 "Вернуть штабу право голоса."
 ADISCORD_ivn.8.b:0 "Принять отставки."
 ADISCORD_ivn.8.b_tt:0 "Доверие северных марок [92.GetName], [95.GetName], [96.GetName] и [97.GetName]: §R-5§!"
 ADISCORD_ivn.9.t:0 "Ультиматум штаба"
 ADISCORD_ivn.9.d:0 "Штаб марок больше не просит, а требует: отдельный бюджет, право назначать командиров и закрыть газеты, которые пишут об армии. В приёмной Комитета ждут полковники, и никто не знает, сколько полков стоит за ними.\n\nКомитет может принять условия и сохранить мир в столице. Может созвать депутатов и напомнить армии, кому она служит, - если армия ещё готова это слушать."
 ADISCORD_ivn.9.a:0 "Принять условия штаба."
 ADISCORD_ivn.9.a_tt:0 "Доверие северных марок [92.GetName], [95.GetName], [96.GetName] и [97.GetName]: §G+5§!"
 ADISCORD_ivn.9.b:0 "Созвать Комитет."

# Focuses of the frontier, the command, the islands, the revolt and the legion
 IVN_lakora_textile_mills:0 "Ткацкие фабрики Лакоры"
 IVN_lakora_textile_mills_desc:0 "Лакора шьёт шинели и бинты для всей республики. Работа на фабриках держит приграничные семьи ближе к столице, чем любые воззвания."
 IVN_trust_lakora_5_tt:0 "Доверие марки [99.GetName]: §G+5§!"
 IVN_moressa_foundries:0 "Литейные Морессы"
 IVN_moressa_foundries_desc:0 "Старые литейные Морессы снова льют стволы и плиты. Комитет платит за каждую плавку, и город впервые за десять лет видит деньги столицы."
 IVN_trust_moressa_5_tt:0 "Доверие марки [98.GetName]: §G+5§!"
 IVN_ilvan_canal:0 "Ильванский канал"
 IVN_ilvan_canal_desc:0 "Канал соединяет Ильван и Ольсию с рекой Старой марки. Баржи везут зерно на юг и лес на север, а приграничье перестаёт быть тупиком республики."
 IVN_trust_ilvan_olsia_5_tt:0 "Доверие марок [100.GetName] и [101.GetName]: §G+5§!"
 IVN_committee_war_economy:0 "Хозяйство комитета"
 IVN_committee_war_economy_desc:0 "Плановое бюро получает право распределять сырьё между марками. Заводы спорят уже не с комитетом, а с цифрами общего плана."
 IVN_expedition_supply_trains:0 "Обозы экспедиции"
 IVN_expedition_supply_trains_desc:0 "Корпус пойдёт по разбитым дорогам коридора. Комитет собирает грузовики, полевые кухни и склады вдоль границы, чтобы солдаты не остались без хлеба на третий день."
 IVN_expedition_storm_columns:0 "Штурмовые колонны"
 IVN_expedition_storm_columns_desc:0 "Штаб марок отбирает лучшие роты в штурмовые колонны. Им предстоит первыми войти в города коридора, пока северные республики не успели окопаться."
 IVN_expedition_krait_crossing:0 "Переправа у Крайта"
 IVN_expedition_krait_crossing_desc:0 "Сапёры изучают броды и мосты у Крайта. Если корпус удержит переправу, южные земли коридора окажутся отрезаны от своих столиц."
 IVN_expedition_field_hospitals:0 "Полевые госпитали"
 IVN_expedition_field_hospitals_desc:0 "Врачи марок едут за корпусом. Раненые возвращаются домой не в списках потерь, а в санитарных поездах, и семьи на границе знают, что республика не бросила их сыновей."
 IVN_trust_northern_10_tt:0 "Доверие северных марок [92.GetName], [95.GetName], [96.GetName] и [97.GetName]: §G+10§!"
 IVN_frontier_audit:0 "Ревизия приграничья"
 IVN_frontier_audit_desc:0 "Комиссия комитета объезжает восемь приграничных марок. Её отчёт честен до неприличия: в Ведрине столицу не любят, в Серенге не верят, а в Ольсии ещё ждут."
 IVN_trust_all_5_tt:0 "Доверие всех приграничных марок: §G+5§!"
 IVN_frontier_veterans_fund:0 "Касса ветеранов"
 IVN_frontier_veterans_fund_desc:0 "Ветераны распада Воркерланда получают пенсии из общей кассы. Ведрина и Талара впервые слышат от комитета не приказы, а обещания, которые выполняются."
 IVN_trust_vedrina_talara_10_tt:0 "Доверие марок [95.GetName] и [96.GetName]: §G+10§!"
 IVN_frontier_school_grants:0 "Школьные субсидии"
 IVN_frontier_school_grants_desc:0 "Школы марок получают деньги на учителей и дороги к ним. Дети пограничья учатся по тем же книгам, что и дети столицы."
 IVN_trust_moressa_lakora_5_tt:0 "Доверие марок [98.GetName] и [99.GetName]: §G+5§!"
 IVN_frontier_commissars:0 "Комиссары комитета"
 IVN_frontier_commissars_desc:0 "В каждую марку едет комиссар с правом подписи. Он отвечает перед комитетом, а не перед штабом, и гарнизоны впервые видят над собой гражданскую власть."
 IVN_frontier_officer_councils:0 "Офицерские собрания"
 IVN_frontier_officer_councils_desc:0 "Офицеры гарнизонов сами решают нужды своих марок. Приграничье получает голос, но этот голос звучит из казарм."
 IVN_frontier_vedrina_charter:0 "Хартия Ведрины"
 IVN_frontier_vedrina_charter_desc:0 "Ведрина - город полков и старых обид. Хартия признаёт её права на местный совет и собственный бюджет, а комитет обещает больше не решать за неё в столице."
 IVN_trust_vedrina_15_tt:0 "Доверие марки [95.GetName]: §G+15§!"
 IVN_frontier_border_police:0 "Пограничная стража"
 IVN_frontier_border_police_desc:0 "Границу с коридором охраняют уже не гарнизоны штаба, а стража марок. Местные служат у своих домов и знают каждую тропу."
 IVN_trust_serenga_talara_5_tt:0 "Доверие марок [92.GetName] и [96.GetName]: §G+5§!"
 IVN_frontier_lakora_settlers:0 "Переселенцы внутренних марок"
 IVN_frontier_lakora_settlers_desc:0 "Беженцы из Воркерланда получают землю в Морессе, Лакоре, Ильване и Ольсии. Новые хозяйства обязаны республике всем, что у них есть."
 IVN_trust_inner_8_tt:0 "Доверие внутренних марок [98.GetName], [99.GetName], [100.GetName] и [101.GetName]: §G+8§!"
 IVN_frontier_pact_of_marches:0 "Пакт марок"
 IVN_frontier_pact_of_marches_desc:0 "Восемь приграничных марок подписывают с комитетом общий пакт. Он не отменяет старых обид, но даёт им место за одним столом, а не на улице."
 IVN_trust_all_10_tt:0 "Доверие всех приграничных марок: §G+10§!"
 IVN_command_question:0 "Кто командует армией"
 IVN_command_question_desc:0 "Конституция Иторы молчит о том, кто отдаёт приказы армии марок в чрезвычайное время. Комитет и штаб отвечают на этот вопрос по-разному, и ответ нужен до того, как начнётся поход."
 IVN_command_civil_control:0 "Гражданский контроль"
 IVN_command_civil_control_desc:0 "Армия подчиняется комитету, и точка. Генералы получают бюджет и уважение, но приказы о походах подписывает гражданская власть."
 IVN_command_staff_autonomy:0 "Автономия штаба"
 IVN_command_staff_autonomy_desc:0 "Штаб марок сам планирует оборону и поход на север. Комитет утверждает цели, но не вмешивается в то, как армия их достигает."
 IVN_command_war_ministry_civilians:0 "Гражданский министр обороны"
 IVN_command_war_ministry_civilians_desc:0 "Министерство обороны возглавляет депутат, а не генерал. Первым делом он открывает склады, которые штаб числил пустыми."
 IVN_command_parliament_oversight:0 "Парламентский надзор"
 IVN_command_parliament_oversight_desc:0 "Солдаты марок могут писать жалобы прямо депутатам. Письма из казарм читают вслух на заседаниях, и офицеры учатся отвечать за своих людей."
 IVN_command_general_inspectorate:0 "Генеральная инспекция"
 IVN_command_general_inspectorate_desc:0 "Инспекторы штаба проверяют каждый полк марок. Слабых командиров снимают без суда, сильных повышают без согласования с комитетом."
 IVN_command_staff_academy:0 "Академия штаба"
 IVN_command_staff_academy_desc:0 "В Старой марке открывается академия штаба. Её выпускники знают коридор по картам и разборам кампаний распада, а не по слухам."
 IVN_command_promote_karn:0 "Карн во главе корпуса"
 IVN_command_promote_karn_desc:0 "Генерал Ростислав Карн - лучший командир марок и самый опасный человек в Ведрине. Комитет отдаёт ему северный корпус: пусть его честолюбие работает на республику."
 IVN_command_promote_karn_tt:0 "При гражданской войне Военная директория Карна получит §Y15%§! регулярной армии вместо §Y10%§!, дополнительные §Y10000§! £manpower_texticon и §Y25§! £army_experience"
 IVN_trust_vedrina_10_tt:0 "Доверие марки [95.GetName]: §G+10§!"
 IVN_command_sideline_karn:0 "Карна в отставку"
 IVN_command_sideline_karn_desc:0 "Комитет отправляет генерала Карна в почётную отставку. Ведрина считает это оскорблением, но корпус возглавят офицеры, которые помнят присягу."
 IVN_command_sideline_karn_tt:0 "При гражданской войне Военная директория получит §Y5%§! регулярной армии вместо §Y10%§! и на §Y10000§! £manpower_texticon меньше. Комитет получит дух §YВерные офицеры§! на §Y180§! дней."
 IVN_trust_vedrina_minus_10_tt:0 "Доверие марки [95.GetName]: §R-10§!"
 IVN_command_unified_command:0 "Единое командование"
 IVN_command_unified_command_desc:0 "Спор о власти над армией закончен, по крайней мере на бумаге. У марок один штаб, одни карты и одна цепочка приказов."
 IVN_islands_survey:0 "Опись островов"
 IVN_islands_survey_desc:0 "Островное управление впервые за годы принимает гостей из столицы. Комиссия считает причалы, склады и людей, на которых республика сможет опереться, если материк загорится."
 IVN_islands_naval_station:0 "Военно-морская станция"
 IVN_islands_naval_station_desc:0 "Рейдаль получает причалы для кораблей республики. Конвои между материком и островами больше не зависят от погоды и рыбацких лодок."
 IVN_islands_fisheries:0 "Рыбные артели"
 IVN_islands_fisheries_desc:0 "Островные артели получают государственный заказ на рыбу и консервы. Города материка едят дешевле, а острова богатеют на поставках."
 IVN_islands_refuge:0 "Острова-убежище"
 IVN_islands_refuge_desc:0 "На островах готовят склады, школы и казармы на случай беды на материке. Если марки восстанут, отсюда придут люди и оружие для кабинета."
 IVN_islands_refuge_tt:0 "Во время мятежа марок острова пришлют кабинету пополнение и оружие."
 IVN_islands_fortress:0 "Островная крепость"
 IVN_islands_fortress_desc:0 "Берега Рейдаля закрывают батареи. Кто бы ни пришёл с моря, острова останутся республикой."
 IVN_islands_charter:0 "Островная хартия"
 IVN_islands_charter_desc:0 "Хартия закрепляет права Островного управления и его долг перед республикой. Острова знают, за что воюют, а столица - на что может рассчитывать."
 IVN_cw_cabinet_at_war:0 "Кабинет военного времени"
 IVN_cw_cabinet_at_war_desc:0 "Полки Ведрины идут на юг, а в столице заседает кабинет, который ещё месяц назад отвечал за провал экспедиции. Теперь он отвечает за то, останется ли Итора одной страной."
 IVN_cw_defend_the_old_march:0 "Оборона Старой марки"
 IVN_cw_defend_the_old_march_desc:0 "Столица копает рвы на окраинах. Рабочие кварталы строят баррикады, а в школах устраивают сборные пункты ополчения."
 IVN_cw_lakora_line:0 "Лакорская линия"
 IVN_cw_lakora_line_desc:0 "Между Морессой, Лакорой и полками легиона встаёт линия окопов. Она проходит по полям, где ещё весной сеяли хлеб."
 IVN_cw_armoured_trains:0 "Бронепоезда"
 IVN_cw_armoured_trains_desc:0 "Мастерские Старой марки обшивают составы листовой сталью. Железные дороги, построенные для экспедиции, теперь возят пушки против своих."
 IVN_cw_reserve_divisions:0 "Резервные дивизии"
 IVN_cw_reserve_divisions_desc:0 "Резервисты южных марок получают винтовки на вокзалах и уходят на фронт через неделю. Их учат в пути."
 IVN_cw_artillery_parks:0 "Артиллерийские парки"
 IVN_cw_artillery_parks_desc:0 "Кабинет собирает орудия со всех складов республики. Легион ушёл с лучшими полками, но пушки остались в арсеналах столицы."
 IVN_cw_counterstroke:0 "Контрудар"
 IVN_cw_counterstroke_desc:0 "Резервы и пушки собраны. Штаб кабинета готовит удар, который должен отбросить легион за Канторию."
 IVN_cw_take_vedrina:0 "Штурм Ведрины"
 IVN_cw_take_vedrina_desc:0 "Легион держится в своей столице. Чтобы закончить войну, кабинету придётся взять город, где родилась армия марок."
 IVN_cw_emergency_powers:0 "Чрезвычайные полномочия"
 IVN_cw_emergency_powers_desc:0 "Кабинет получает право издавать законы без депутатов на время мятежа. Вопрос только в том, кто будет пользоваться этим правом."
 IVN_cw_government_of_colonels:0 "Правительство полковников"
 IVN_cw_government_of_colonels_desc:0 "Верные кабинету полковники берут министерства. Они воюют против своих бывших товарищей и не собираются возвращать власть депутатам до победы."
 IVN_cw_return_of_the_committee:0 "Возвращение Комитета"
 IVN_cw_return_of_the_committee_desc:0 "Куливанов распускает чрезвычайный кабинет и возвращает власть Комитету. Республика будет воевать как республика - с депутатами, газетами и выборами после войны."
 IVN_cw_return_of_the_committee_tt:0 "Правительство возвращается к §Yгуманизму§!. После победы над легионом снова откроется курс §YГуманистический щит§!."
 IVN_cw_war_ministry_of_colonels:0 "Военное министерство полковников"
 IVN_cw_war_ministry_of_colonels_desc:0 "Министерство работает как штаб: доклады утром, приказы к обеду, расстрелы за саботаж к вечеру."
 IVN_cw_martial_law:0 "Военное положение"
 IVN_cw_martial_law_desc:0 "Военное положение распространяется на всю республику. Призывные комиссии работают круглосуточно, а газеты печатают только сводки."
 IVN_cw_citizens_committees:0 "Гражданские комитеты"
 IVN_cw_citizens_committees_desc:0 "В каждом городе создаются комитеты обороны из депутатов, врачей и учителей. Они собирают добровольцев и не дают армии забыть, за кого она воюет."
 IVN_trust_inner_5_tt:0 "Доверие внутренних марок [98.GetName], [99.GetName], [100.GetName] и [101.GetName]: §G+5§!"
 IVN_cw_red_cross_of_the_marches:0 "Красный крест марок"
 IVN_cw_red_cross_of_the_marches_desc:0 "Санитары Комитета работают по обе стороны фронта. В Ведрине и Таларе их пускают в госпитали легиона, и солдаты мятежа узнают, что их семьи кормит столица."
 IVN_cw_victory_programme:0 "Программа победы"
 IVN_cw_victory_programme_desc:0 "Кабинет публикует программу: всё для фронта, но после войны - восстановление марок за счёт республики. Заводы работают в три смены."
 IVN_cw_appeal_to_the_marches:0 "Обращение к маркам"
 IVN_cw_appeal_to_the_marches_desc:0 "Куливанов говорит по радио с солдатами легиона: кто вернётся домой, тот не будет судим. Не все верят, но многие слушают."
 IVN_trust_northern_5_tt:0 "Доверие северных марок [92.GetName], [95.GetName], [96.GetName] и [97.GetName]: §G+5§!"
 IVN_cw_war_loan:0 "Военный заём"
 IVN_cw_war_loan_desc:0 "Граждане столицы покупают облигации обороны. Деньги идут на заводы, а облигации - в каждый дом, который теперь заинтересован в победе."
 IVN_cw_rimat_and_neighbours:0 "Римат и соседи"
 IVN_cw_rimat_and_neighbours_desc:0 "Итора гарантировала Римату независимость, и теперь просит об ответной услуге. Торговые дома Римата готовы продавать оружие - за деньги и будущие договоры."
 IVN_cw_factories_to_the_front:0 "Заводы - фронту"
 IVN_cw_factories_to_the_front_desc:0 "Мастерские Старой и Южной марок переходят на патроны и винтовки. Республика больше не может ждать, пока легион устанет."
 IVN_cw_close_the_boreyan_border:0 "Закрыть борейскую границу"
 IVN_cw_close_the_boreyan_border_desc:0 "Контрабандисты возят легиону патроны через борейские перевалы. Кабинет договаривается с пограничниками республики и перекрывает тропы."
 IVN_cw_close_the_boreyan_border_tt:0 "Легион больше не сможет закупать оружие решением §YКонтрабанда через границу§!."
 IVN_cw_propaganda_of_unity:0 "Одна Итора"
 IVN_cw_propaganda_of_unity_desc:0 "Плакаты, листовки и радио повторяют одно: марки и столица - одна страна. Легион ещё силён, но его солдаты начинают спрашивать, за что воюют."
 IVN_cw_marches_united_again:0 "Марки снова едины"
 IVN_cw_marches_united_again_desc:0 "Последние полки легиона сдали оружие. Над Ведриной снова флаг республики, но на улицах города ещё долго будут смотреть на столичных солдат как на чужих."
 IVN_pw_marches_reunited:0 "После мятежа"
 IVN_pw_marches_reunited_desc:0 "Война марок закончилась, но в каждой семье приграничья есть кто-то, кто воевал на другой стороне. Новой власти предстоит решить, что делать с побеждёнными."
 IVN_pw_amnesty:0 "Амнистия"
 IVN_pw_amnesty_desc:0 "Побеждённых отпускают по домам. Офицеров лишают званий, солдат - нет. Многие из них вернутся в армию, которая ещё вчера была врагом."
 IVN_trust_all_15_tt:0 "Доверие всех приграничных марок: §G+15§!"
 IVN_pw_tribunals:0 "Трибуналы"
 IVN_pw_tribunals_desc:0 "Зачинщиков судят открыто, приговоры печатают в газетах. Новая власть показывает, что больше никто не поднимет полки против столицы безнаказанно."
 IVN_trust_all_minus_10_tt:0 "Доверие всех приграничных марок: §R-10§!"
 IVN_pw_rebuild_vedrina:0 "Восстановить Ведрину"
 IVN_pw_rebuild_vedrina_desc:0 "Ведрина и Талара лежат в руинах после штурмов. Республика отстраивает их первыми, чтобы приграничье увидело: столица пришла не только с войсками."
 IVN_pw_veterans_settlement:0 "Ветераны двух войн"
 IVN_pw_veterans_settlement_desc:0 "Солдаты северной экспедиции и мятежа служат теперь в одних полках. У них общая память о поражениях и общий счёт к северу."
 IVN_pw_frontier_garrisons:0 "Гарнизоны границы"
 IVN_pw_frontier_garrisons_desc:0 "Северную границу снова занимают гарнизоны, но теперь ими командуют офицеры, проверенные войной марок."
 IVN_pw_charter_of_the_marches:0 "Устав марок"
 IVN_pw_charter_of_the_marches_desc:0 "Новый устав закрепляет права приграничных марок и обязанности столицы. Его пишут победители, но подписывают все."
 IVN_pw_memory_of_the_retreat:0 "Память об отступлении"
 IVN_pw_memory_of_the_retreat_desc:0 "Итора пережила поражение на севере и войну с собой. Теперь она снова смотрит на запад и знает цену каждому походу."
 IVC_legion_oath:0 "Клятва легиона"
 IVC_legion_oath_desc:0 "На площади Ведрины полки марок присягают не кабинету и не Комитету, а земле, которую они защищали. Леонид Сталк читает клятву первым."
 IVC_veterans_of_the_expedition:0 "Ветераны экспедиции"
 IVC_veterans_of_the_expedition_desc:0 "Солдаты, вернувшиеся с севера, не простили столице отступления. Легион зовёт их в строй под своими старыми знамёнами."
 IVC_assault_companies:0 "Штурмовые роты"
 IVC_assault_companies_desc:0 "Лучшие роты северного корпуса становятся ударным кулаком легиона. Они знают, как брать города, - их учили этому в коридоре."
 IVC_trophy_depots:0 "Склады приграничья"
 IVC_trophy_depots_desc:0 "Склады северных марок, собранные для экспедиции, достались легиону. Кабинет готовил их для войны на севере - легион найдёт им применение ближе."
 IVC_vedrina_passes:0 "Проходы Ведрины"
 IVC_vedrina_passes_desc:0 "Холмы вокруг Ведрины превращаются в укреплённый район. Если кабинет придёт за столицей легиона, он заплатит за каждый склон."
 IVC_frontier_cavalry:0 "Подвижные отряды"
 IVC_frontier_cavalry_desc:0 "Грузовики и мотоциклы пограничной стражи собраны в подвижные отряды. Легион воюет быстрее, чем кабинет успевает читать сводки."
 IVC_march_on_the_old_march:0 "Поход на Старую марку"
 IVC_march_on_the_old_march_desc:0 "Столица - не крепость, а город, который устал от кабинета. Штаб легиона планирует наступление на юг."
 IVC_storm_the_capital:0 "Штурм столицы"
 IVC_storm_the_capital_desc:0 "Легион у окраин Старой марки. Ещё один удар - и кабинет либо сдастся, либо уйдёт на острова."
 IVC_karn_takes_command:0 "Сталк принимает командование"
 IVC_karn_takes_command_desc:0 "Леонид Сталк не просил власти, но и не отказался от неё. Легиону нужен один голос, и этот голос звучит из штаба в Ведрине."
 IVC_council_of_the_legion:0 "Совет легиона"
 IVC_council_of_the_legion_desc:0 "Легионом правит совет командиров полков. Никаких партий и митингов: офицеры решают, солдаты исполняют, марки ждут победы."
 IVC_council_of_the_legion_tt:0 "Если легион победит, Итора получит дух §YВласть совета легиона§!."
 IVC_patriotic_union:0 "Патриотический союз"
 IVC_patriotic_union_desc:0 "Иторский Патриотический Союз выходит из подполья и становится партией легиона. Он обещает маркам не приказы, а голос, - громкий и злой."
 IVC_patriotic_union_tt:0 "Если легион победит, Итора получит дух §YВласть Патриотического союза§!."
 IVC_council_field_courts:0 "Полевые суды"
 IVC_council_field_courts_desc:0 "Мародёров и дезертиров судят в тот же день. Марки боятся легиона, но и уважают: в его тылу нет грабежа."
 IVC_council_officers_cabinet:0 "Кабинет офицеров"
 IVC_council_officers_cabinet_desc:0 "Совет легиона назначает министров из штабных офицеров. Управление марками ведётся как снабжение армии - точно и без споров."
 IVC_union_mass_rallies:0 "Митинги союза"
 IVC_union_mass_rallies_desc:0 "На площадях марок выступают ораторы союза. Молодёжь записывается в легион целыми улицами."
 IVC_union_patriotic_press:0 "Патриотическая печать"
 IVC_union_patriotic_press_desc:0 "Газеты союза расходятся и в землях кабинета. В каждой марке читают, как столица бросила северный корпус."
 IVN_trust_cabinet_held_minus_5_tt:0 "Доверие приграничных марок кабинета: §R-5§!"
 IVC_new_itora:0 "Новая Итора"
 IVC_new_itora_desc:0 "Легион больше не мятеж, а правительство в ожидании столицы. Его указы уже исполняют в половине марок."
 IVC_requisitions_of_the_marches:0 "Реквизиции марок"
 IVC_requisitions_of_the_marches_desc:0 "У легиона нет казны, есть только марки. Интенданты берут хлеб, сталь и лошадей под расписки, которые оплатит будущая власть."
 IVC_smuggling_routes:0 "Контрабандные пути"
 IVC_smuggling_routes_desc:0 "Через борейские перевалы и северный коридор идут караваны с патронами. Платят за них трофеями экспедиции."
 IVC_vedrina_workshops:0 "Мастерские Ведрины"
 IVC_vedrina_workshops_desc:0 "Ремонтные мастерские полков становятся оружейными заводами. Ведрина делает винтовки сама."
 IVC_roads_of_the_legion:0 "Дороги легиона"
 IVC_roads_of_the_legion_desc:0 "Сапёры легиона чинят дороги между полками. Подкрепления доходят до фронта за сутки, а не за неделю."
 IVC_war_economy_of_the_marches:0 "Военное хозяйство марок"
 IVC_war_economy_of_the_marches_desc:0 "Каждая фабрика марок работает по нарядам легиона. Хозяева недовольны, но спорить с интендантом при винтовке трудно."
 IVC_captured_arsenals:0 "Захваченные арсеналы"
 IVC_captured_arsenals_desc:0 "Арсеналы, которые кабинет не успел вывезти, переходят к легиону вместе со сторожами и описями."
 IVC_shame_of_the_expedition:0 "Позор экспедиции"
 IVC_shame_of_the_expedition_desc:0 "Легион не устаёт напоминать: корпус не проиграл на севере, его предали в столице. Эту историю рассказывают в каждом трактире марок."
 IVC_appeal_to_the_garrisons:0 "Воззвание к гарнизонам"
 IVC_appeal_to_the_garrisons_desc:0 "Гарнизоны кабинета получают письма от бывших сослуживцев. Легион не требует измены - он предлагает вернуться к своим."
 IVC_legion_newspaper:0 "Газета легиона"
 IVC_legion_newspaper_desc:0 "\"Голос марок\" печатается в Ведрине каждый день. Её читают в окопах обеих сторон."
 IVC_agents_in_the_old_march:0 "Агенты в Старой марке"
 IVC_agents_in_the_old_march_desc:0 "Сторонники легиона в столице распространяют слухи, срывают поставки и пишут на стенах имя Сталка."
 IVC_veterans_letters:0 "Письма ветеранов"
 IVC_veterans_letters_desc:0 "Ветераны пишут домой: легион кормит, лечит и держит слово. Семьи марок начинают верить Ведрине больше, чем столице."
 IVN_trust_legion_held_minus_5_tt:0 "Доверие марок легиона к столице: §R-5§!"
 IVC_the_marches_rise:0 "Марки поднимаются"
 IVC_the_marches_rise_desc:0 "Восстание перестаёт быть делом одних полков. В приграничье поднимаются деревни, депо и рабочие посёлки."
 IVC_northern_contacts:0 "Северные связи"
 IVC_northern_contacts_desc:0 "Офицеры легиона воевали в коридоре и знают тамошних командиров. Старые враги договариваются быстрее, чем старые союзники."
 IVC_boreyan_volunteers:0 "Добровольцы из-за перевала"
 IVC_boreyan_volunteers_desc:0 "Из-за борейской границы приходят наёмники и беглецы. Легион не спрашивает, от кого они бегут."
 IVC_corridor_veterans:0 "Опыт коридора"
 IVC_corridor_veterans_desc:0 "Легион разбирает бои северной экспедиции. Его офицеры знают, почему корпус проиграл, - и не собираются повторять ошибок."
 IVC_promise_of_revanche:0 "Обещание реванша"
 IVC_promise_of_revanche_desc:0 "Сталк обещает: после столицы легион пойдёт на север и закончит то, что не дал закончить кабинет."
 IVN_parliament_sessions:0 "Сессия парламента"
 IVN_parliament_sessions_desc:0 "Впервые после распада Воркерланда парламент Иторы собирается на полную сессию. Комитет отчитывается перед депутатами, а партии делят места в новых комиссиях."
 IVN_parliament_coalition_pragmatists:0 "Коалиция с прагматиками"
 IVN_parliament_coalition_pragmatists_desc:0 "Гуманисты договариваются с Партией стабилизации. Новая коалиция считает деньги, ремонтирует дороги и не любит генералов, которые просят больше."
 IVN_parliament_coalition_etatists:0 "Коалиция с этатистами"
 IVN_parliament_coalition_etatists_desc:0 "Гуманисты делят власть с Чрезвычайным комитетом этатистов. Государство становится сильнее, а штаб марок получает союзников в правительстве."
 IVN_parliament_budget_reform:0 "Бюджетная реформа"
 IVN_parliament_budget_reform_desc:0 "Парламент переписывает бюджет: меньше чрезвычайных статей, больше денег маркам. Восточная марка получает первую большую стройку за десять лет."
 IVN_parliament_defence_law:0 "Закон об обороне"
 IVN_parliament_defence_law_desc:0 "Новый закон обязывает каждую марку держать обученный резерв. Призывные комиссии получают списки, а штаб - людей."
 IVN_parliament_press_freedom:0 "Свобода печати"
 IVN_parliament_press_freedom_desc:0 "Газеты марок пишут о столице всё, что думают. Комитету неприятно, но приграничье впервые чувствует, что его слышат."
 IVN_parliament_emergency_statute:0 "Статут чрезвычайного положения"
 IVN_parliament_emergency_statute_desc:0 "Парламент заранее пишет правила на случай войны: кто вводит военное положение, кто его снимает и сколько оно может длиться."
 IVN_parliament_ban_the_union:0 "Запретить Патриотический союз"
 IVN_parliament_ban_the_union_desc:0 "Иторский Патриотический Союз объявлен вне закона. Его клубы закрыты, газеты конфискованы, а вожди уходят в Ведрину - к полкам, которые их слушают."
 IVN_parliament_ban_the_union_tt:0 "Если марки восстанут, §YИторский легион освобождения§! получит на §Y5000§! £manpower_texticon меньше."
 IVN_trust_northern_minus_5_tt:0 "Доверие северных марок [92.GetName], [95.GetName], [96.GetName] и [97.GetName]: §R-5§!"
 IVN_parliament_tolerate_the_union:0 "Терпеть Патриотический союз"
 IVN_parliament_tolerate_the_union_desc:0 "Союз остаётся в парламенте и на улицах. Пока его ораторы ругают столицу с трибуны, а не с баррикад, Комитет готов их слушать."
 IVN_parliament_tolerate_the_union_tt:0 "Если марки восстанут, отделения союза сразу поддержат §YИторский легион освобождения§!: он получит ещё §Y5000§! £manpower_texticon."
 IVN_parliament_republic_of_marches:0 "Республика марок"
 IVN_parliament_republic_of_marches_desc:0 "Парламент принимает поправку: марки - не провинции столицы, а её основа. Итора входит в западный вопрос страной, которая знает, кто в ней решает."
 IVN_rc_reconstruction_council:0 "Совет восстановления"
 IVN_rc_reconstruction_council_desc:0 "Северный вопрос закрыт, и республика впервые за много лет может думать не о следующей беде, а о следующем десятилетии. Совет восстановления собирает в одном зале министров, инженеров и посланцев марок."
 IVN_rc_revolt_settled_tt:0 "Мятеж марок не идёт и уже не может начаться"
 IVN_rc_industry_census:0 "Промышленная перепись"
 IVN_rc_industry_census_desc:0 "Счётчики совета обходят каждый цех, рудник и склад марок. Впервые у республики есть честная карта того, что уцелело, что разграблено и что можно поднять за год."
 IVN_rc_civilian_priority:0 "Гражданский приоритет"
 IVN_rc_civilian_priority_desc:0 "Совет отдаёт первые станки мирным заводам. Моресса и Ильван будут делать плуги, ткани и грузовики, а оружие подождёт, пока у людей появится хлеб."
 IVN_rc_military_priority:0 "Военный приоритет"
 IVN_rc_military_priority_desc:0 "Запад не забудет Итору, пока у неё слабая армия. Станки идут в Лакору и Восточную марку, где из руды марок снова будут делать стволы и снаряды."
 IVN_rc_consumer_cooperatives:0 "Потребительские кооперативы"
 IVN_rc_consumer_cooperatives_desc:0 "Лавки внутренних марок объединяются в кооперативы с общими складами и общими ценами. Крестьянин Ольсии больше не отдаёт урожай перекупщику за бесценок."
 IVN_rc_export_offices:0 "Экспортные конторы"
 IVN_rc_export_offices_desc:0 "Конторы республики продают ткани и зерно марок соседям и привозят обратно чертежи и станки. Каждая сделка учит инженеров Иторы тому, чего они не видели за годы войн."
 IVN_rc_arms_workshops:0 "Оружейные мастерские"
 IVN_rc_arms_workshops_desc:0 "Мастерские Восточной марки работают в три смены. Первые партии винтовок идут не на склады, а прямо в полки, где их ждут с самой войны."
 IVN_rc_state_arms_orders:0 "Казённые заказы"
 IVN_rc_state_arms_orders_desc:0 "Республика заказывает орудия на годы вперёд. Завод в Старомарской пуще получает гарантированный заказ, а конструкторы - право на ошибку."
 IVN_rc_steel_of_the_marches:0 "Сталь марок"
 IVN_rc_steel_of_the_marches_desc:0 "Затопленные в смуту шахты Лакоры и Западной марки откачивают и крепят заново. Узкоколейка из Западной марки везёт руду к печам, которые больше не простаивают."
 IVN_rc_synthetic_plant:0 "Синтетический завод"
 IVN_rc_synthetic_plant_desc:0 "У Иторы нет ни нефти, ни каучука, зато есть уголь и химики. В Срединной марке строят завод, который превратит одно в другое."
 IVN_rc_upper_march_quarries:0 "Карьеры Верхней марки"
 IVN_rc_upper_march_quarries_desc:0 "Геологи совета находят в Верхней марке бокситы и хромовую руду. К карьерам тянут дорогу, и в горных сёлах снова появляется работа."
 IVN_rc_private_concessions:0 "Частные концессии"
 IVN_rc_private_concessions_desc:0 "Совет сдаёт верфи и мастерские взморья в концессию тем, кто готов вложить в них свои деньги. Прагматики довольны, а комитет надеется, что прибыль останется в марках."
 IVN_rc_state_trusts:0 "Государственные тресты"
 IVN_rc_state_trusts_desc:0 "Заводы марок объединяются в тресты под управлением столицы. Этатисты получают то, о чём говорили годами: одно хозяйство, один план и одну ответственность."
 IVN_rc_industrial_cluster:0 "Промышленный узел Старой марки"
 IVN_rc_industrial_cluster_desc:0 "Вокруг столицы вырастает пояс заводов, связанных общими дорогами, электростанцией и школами мастеров. Итора больше не страна разрозненных мастерских."
 IVN_rc_roads_commission:0 "Дорожная комиссия"
 IVN_rc_roads_commission_desc:0 "Дороги Иторы помнят ещё колонны распада: разбитые мосты, сгоревшие станции, брошенные переезды. Комиссия начинает с самых глухих марок, куда грузовики не доходят и летом."
 IVN_rc_northern_military_roads:0 "Военные дороги на север"
 IVN_rc_northern_military_roads_desc:0 "Новые пути ведут к Серенге и Кантории, к границе коридора. Если Запад снова загорится, армия марок будет у границы через дни, а не через недели."
 IVN_rc_southern_trade_roads:0 "Торговые дороги юга"
 IVN_rc_southern_trade_roads_desc:0 "Совет вкладывает деньги туда, где они быстрее вернутся: в дороги Южной марки и Северного берега. По ним пойдут товары, а не полки."
 IVN_rc_vedrina_depot:0 "Депо Ведрины"
 IVN_rc_vedrina_depot_desc:0 "Паровозное депо Ведрины снова собирает составы, в том числе бронированные. Город полков получает работу, которая не зависит от милости штаба."
 IVN_rc_trust_vedrina_5_tt:0 "Доверие марки [95.GetName]: §G+5§!"
 IVN_rc_corridor_staging:0 "Сборные пункты у коридора"
 IVN_rc_corridor_staging_desc:0 "У северной границы строят стоянки для грузовиков и казармы для частей на марше. Полк, пришедший к коридору, не ночует в поле."
 IVN_rc_coastal_road:0 "Береговой тракт"
 IVN_rc_coastal_road_desc:0 "Дорога вдоль Южного взморья связывает рыбацкие посёлки с городами марок. Вокруг пристаней вырастают склады и консервные цеха."
 IVN_rc_seaboard_fair:0 "Ярмарка взморья"
 IVN_rc_seaboard_fair_desc:0 "На первую после войн ярмарку взморья съезжаются купцы из всех марок и от соседей. Люди видят полные прилавки и начинают верить, что мир продлится."
 IVN_rc_capital_development:0 "Застройка Старой марки"
 IVN_rc_capital_development_desc:0 "Столица расчищает пустыри распада под новые кварталы и заводские площадки. Старая марка снова растёт, а не латает дыры."
 IVN_rc_eastern_line:0 "Восточная линия"
 IVN_rc_eastern_line_desc:0 "Вдоль границы с Борейской республикой прокладывают рокаду и ставят доты. Соседи дружелюбны, но совет помнит, как быстро меняются соседи."
 IVN_rc_bridge_engineers:0 "Мостостроители"
 IVN_rc_bridge_engineers_desc:0 "Сапёрные роты, восстановившие мосты марок, становятся постоянным корпусом. Они умеют строить быстро и знают, где мост понадобится армии."
 IVN_rc_transport_network:0 "Единая транспортная сеть"
 IVN_rc_transport_network_desc:0 "Дороги, пути и мосты марок сводят в одну сеть с одним расписанием. Самая дальняя застава теперь в двух днях пути от столицы."
 IVN_rc_academy_of_the_marches:0 "Академия марок"
 IVN_rc_academy_of_the_marches_desc:0 "Учёные, разбежавшиеся по провинциям в годы смуты, получают общий дом в Старой марке. Академия обещает им лаборатории, жалованье и право работать без оглядки на фронт."
 IVN_rc_applied_institutes:0 "Прикладные институты"
 IVN_rc_applied_institutes_desc:0 "Академия работает на заводы: каждая лаборатория прикреплена к цеху, каждая тема утверждается советом. Наука становится частью плана восстановления."
 IVN_rc_free_universities:0 "Свободные университеты"
 IVN_rc_free_universities_desc:0 "Университеты марок получают самоуправление и право выбирать темы сами. Гуманисты называют это возвращением республики, а заводы ворчат, что ждать результата придётся долго."
 IVN_rc_radio_laboratory:0 "Радиолаборатория"
 IVN_rc_radio_laboratory_desc:0 "Инженеры академии собирают полевые рации и аппаратуру для штабов. Армия марок впервые сможет говорить со своими полками без гонцов."
 IVN_rc_medical_faculty:0 "Медицинский факультет"
 IVN_rc_medical_faculty_desc:0 "В Лакоре открывается медицинский факультет с клиникой для всей марки. Врачи, выученные здесь, поедут в полки и в сёла, где их не видели с войны."
 IVN_rc_science_center:0 "Научный городок"
 IVN_rc_science_center_desc:0 "За чертой столицы строят научный городок с лабораториями, общежитиями и опытными мастерскими. Итора больше не догоняет соседей, а готовится их обгонять."
 IVN_rc_weapons_bureau:0 "Оружейное бюро"
 IVN_rc_weapons_bureau_desc:0 "Конструкторы бюро разбирают трофеи всех войн марок и ищут лучшее. Новая винтовка Иторы будет проще, легче и надёжнее старых."
 IVN_rc_motor_bureau:0 "Моторное бюро"
 IVN_rc_motor_bureau_desc:0 "Бюро получает первые грузовики собственной сборки и задание сделать из них бронемашину. Инженеры спорят о броне, моторах и о том, выдержат ли их дороги марок."
 IVN_rc_cipher_bureau:0 "Шифровальное бюро"
 IVN_rc_cipher_bureau_desc:0 "Математики академии работают над шифрами штаба и над перехваченными депешами соседей. О бюро не пишут газеты, но его отчёты читает весь совет."
 IVN_rc_republic_of_scholars:0 "Республика учёных"
 IVN_rc_republic_of_scholars_desc:0 "Выпускники академии возглавляют заводы, штабы и министерства. Итора, которая годами жила войной, учится жить знанием."
 IVN_rc_social_ministry:0 "Министерство восстановления жизни"
 IVN_rc_social_ministry_desc:0 "Новое министерство отвечает не за заводы, а за людей: за жильё, больницы, пенсии и школы. Его первые чиновники едут в приграничье, а не в кабинеты столицы."
 IVN_rc_universal_pensions:0 "Всеобщие пенсии"
 IVN_rc_universal_pensions_desc:0 "Пенсию получает каждый старик марок, воевал он или нет. Это дорого, но впервые государство приходит в каждый дом не с повесткой, а с деньгами."
 IVN_rc_veterans_first:0 "Сначала ветераны"
 IVN_rc_veterans_first_desc:0 "Деньги совета идут прежде всего тем, кто воевал за марки, по какую бы сторону они ни стояли. Ветераны возвращаются в полки, зная, что об их семьях позаботятся."
 IVN_rc_district_hospitals:0 "Окружные больницы"
 IVN_rc_district_hospitals_desc:0 "В каждом округе марок открывается больница с хирургом и родильным отделением. В Серенге и Таларе это первые больницы за двадцать лет."
 IVN_rc_public_schools:0 "Народные школы"
 IVN_rc_public_schools_desc:0 "Школа становится обязательной для каждого ребёнка марок, а учитель получает жалованье от республики. Через десять лет у Иторы будет поколение, которое умеет читать чертежи."
 IVN_rc_invalid_workshops:0 "Мастерские инвалидов войны"
 IVN_rc_invalid_workshops_desc:0 "В Кантории открываются мастерские, где работают покалеченные в войнах марок. Они шьют, чинят и собирают, а город перестаёт прятать своих ветеранов."
 IVN_rc_trust_kantoria_10_tt:0 "Доверие марки [97.GetName]: §G+10§!"
 IVN_rc_veterans_colonies:0 "Ветеранские посёлки"
 IVN_rc_veterans_colonies_desc:0 "Ветераны получают землю в Старомарской пуще и ссуду на дом. Посёлки бывших солдат становятся резервом, который всегда знает, куда идти по тревоге."
 IVN_rc_social_contract:0 "Общественный договор марок"
 IVN_rc_social_contract_desc:0 "Совет публикует простой договор: республика обязуется лечить, учить и кормить, марки - работать и служить. Его зачитывают на площадях каждого города."
 IVN_rc_refugee_return:0 "Возвращение беженцев"
 IVN_rc_refugee_return_desc:0 "Семьи, бежавшие из Серенги и Ведрины в годы смуты, получают проезд домой и ссуду на восстановление. Пустые улицы северных марок снова заселяются."
 IVN_rc_trust_vedrina_serenga_10_tt:0 "Доверие марок [92.GetName] и [95.GetName]: §G+10§!"
 IVN_rc_labour_code:0 "Трудовой кодекс"
 IVN_rc_labour_code_desc:0 "Восьмичасовой день, страховка от увечий и право на профсоюз становятся законом. Заводы теряют дешёвые руки, но получают рабочих, которые не уходят."
 IVN_rc_march_councils:0 "Советы марок"
 IVN_rc_march_councils_desc:0 "Социальные деньги распределяют выборные советы марок, а не столичные чиновники. Приграничье получает власть над своей жизнью, а столица - меньше рычагов."
 IVN_rc_capital_governors:0 "Губернаторы столицы"
 IVN_rc_capital_governors_desc:0 "Каждой марке назначают губернатора из столицы с правом распоряжаться социальными фондами. Деньги доходят быстрее, но приграничье снова чувствует себя под присмотром."
 IVN_rc_trust_all_minus_5_tt:0 "Доверие всех приграничных марок: §R-5§!"
 IVN_rc_welfare_republic:0 "Республика заботы"
 IVN_rc_welfare_republic_desc:0 "Итора выходит из восстановления страной, где у солдата есть дом, у вдовы - пенсия, а у ребёнка - школа. За такую республику марки готовы стоять, если Запад придёт снова."
 IVN_rc_army_reform:0 "Реформа армии марок"
 IVN_rc_army_reform_desc:0 "Армия, прошедшая северный поход и смуту, знает о своих слабостях больше любого штаба. Комиссия по реформе собирает её опыт, прежде чем он забудется."
 IVN_rc_mass_reserve:0 "Массовая резервная армия"
 IVN_rc_mass_reserve_desc:0 "Каждый мужчина марок проходит службу и остаётся в резерве до сорока лет. Итора не сможет купить лучшую армию Запада, но сможет выставить самую многочисленную."
 IVN_rc_professional_army:0 "Профессиональная мобильная армия"
 IVN_rc_professional_army_desc:0 "Армия марок становится меньше, но служат в ней по контракту, ездят на грузовиках и учатся годами. Такая армия не удержит всю границу, зато успеет туда, где решается война."
 IVN_rc_territorial_regiments:0 "Территориальные полки"
 IVN_rc_territorial_regiments_desc:0 "Резервисты приписаны к полкам своих марок и знают свои рубежи. Если враг перейдёт границу, его встретят люди, защищающие собственные дома."
 IVN_rc_reserve_officer_school:0 "Школа офицеров запаса"
 IVN_rc_reserve_officer_school_desc:0 "Учителя, инженеры и агрономы марок проходят курсы офицеров запаса. Массовой армии нужны командиры, и республика готовит их заранее."
 IVN_rc_motorised_brigades:0 "Моторизованные бригады"
 IVN_rc_motorised_brigades_desc:0 "Первые бригады армии марок пересаживаются на грузовики и получают противотанковые батареи. Они учатся проходить за сутки то, что пехота проходит за неделю."
 IVN_rc_staff_war_games:0 "Штабные игры"
 IVN_rc_staff_war_games_desc:0 "Офицеры профессиональной армии разыгрывают на картах войну за Запад десятки раз. Каждая проигранная партия становится новым параграфом устава."
 IVN_rc_artillery_regiments:0 "Артиллерийские полки"
 IVN_rc_artillery_regiments_desc:0 "Пушки, лежавшие по складам марок, сводят в полки с собственными тягачами и зенитным прикрытием. Пехота Иторы больше не идёт в атаку без огня за спиной."
 IVN_rc_western_war_plan:0 "План войны за Запад"
 IVN_rc_western_war_plan_desc:0 "Штаб составляет план на случай большой войны с Воркерландом: направления, сроки, рубежи. Республика надеется, что он не понадобится, но держит его в сейфе."
 IVN_rc_border_fortresses:0 "Пограничные крепости"
 IVN_rc_border_fortresses_desc:0 "Серенга и Ведрина, через которые всегда шли войны с севера, получают доты и укреплённые узлы. Коридор больше не открытая дверь в Итору."
 IVN_rc_army_of_the_republic:0 "Армия республики"
 IVN_rc_army_of_the_republic_desc:0 "Армия марок больше не сборище гарнизонов и ополчений. У республики есть войско с одним уставом, одним оружием и одной присягой."
 IVN_rc_air_and_sea:0 "Небо и берег"
 IVN_rc_air_and_sea_desc:0 "Совет впервые выделяет отдельные деньги на авиацию и флот. Их немного, и лётчики с моряками сразу начинают спорить, кому они нужнее."
 IVN_rc_air_wing:0 "Авиакрыло марок"
 IVN_rc_air_wing_desc:0 "Деньги получают лётчики. У Лакоры и Ведрины расширяют аэродромы, и над приграничьем появляются патрули республики."
 IVN_rc_coastal_navy:0 "Береговой флот"
 IVN_rc_coastal_navy_desc:0 "Деньги получают моряки. Гавань Старой марки углубляют, а торговые суда республики получают право на защиту военных кораблей."
 IVN_rc_flight_schools:0 "Лётные школы"
 IVN_rc_flight_schools_desc:0 "Аэроклубы марок становятся лётными школами с инструкторами из ветеранов. Молодые пилоты учатся на машинах, которые собирают тут же, в мастерских аэродрома."
 IVN_rc_seaboard_shipyard:0 "Верфь взморья"
 IVN_rc_seaboard_shipyard_desc:0 "На Южном взморье закладывают верфь для сторожевых кораблей. Её первые стапели строят те же рабочие, что недавно чинили рыбацкие шхуны."
 IVN_rc_coastal_defence_zone:0 "Зона береговой обороны"
 IVN_rc_coastal_defence_zone_desc:0 "Взморье и столицу прикрывают береговые батареи и зенитные посты. С моря и с неба Итору больше не застанут врасплох."
 IVN_rc_joint_staff:0 "Объединённый штаб"
 IVN_rc_joint_staff_desc:0 "Лётчики, моряки и пехота марок впервые садятся за один стол. Отныне операции на побережье планируют вместе, а не каждый в своём ведомстве."
 IVN_reconstruction_category:0 "Восстановление республики"
 IVN_reconstruction_category_desc:0 "Совет восстановления распределяет деньги и людей между стройками, лабораториями и полками марок. Каждая программа требует времени, и совет сам выбирает, с чего начать."
 IVN_rc_mine_survey:0 "Разведка рудника"
 IVN_rc_mine_survey_desc:0 "Геологи совета едут в марку с бурами и картами старых выработок. Если жила подтвердится, шахта откроется ещё до зимы."
 IVN_rc_mine_survey_ready_tt:0 "В этой марке ещё не открыт рудник и не идёт разведка"
 IVN_rc_fen_drainage:0 "Осушение Ринвальских топей"
 IVN_rc_fen_drainage_desc:0 "Каналы и насосные станции должны превратить топи в поля и строительные площадки. Работы займут не один сезон, а осушенная земля станет домом для новых посёлков."
 IVN_rc_laboratory_contracts:0 "Лабораторные контракты"
 IVN_rc_laboratory_contracts_desc:0 "Академия марок получает заказ на конкретную задачу и деньги на её решение. Учёные работают под сроком, а заводы ждут готовых чертежей."
 IVN_rc_laboratory_contracts_limit_tt:0 "Заключено контрактов: §Y[?IVN_rc_laboratory_contracts_done|0]§! из §Y3§!"
 IVN_rc_housing_programme:0 "Жилищная программа"
 IVN_rc_housing_programme_desc:0 "В марку едут строительные артели с кирпичом, лесом и чертежами типовых домов. Семьи, жившие в землянках и бараках, получают крышу над головой."
 IVN_rc_housing_ready_tt:0 "В марке ещё не проводилась жилищная программа"
 IVN_rc_reserve_musters:0 "Сборы резервистов"
 IVN_rc_reserve_musters_desc:0 "Резервисты марок оставляют поля и мастерские и на два месяца возвращаются в казармы. Старые солдаты вспоминают службу, молодые учатся у них."
 IVN_rc_field_manoeuvres:0 "Полевые манёвры"
 IVN_rc_field_manoeuvres_desc:0 "Бригады профессиональной армии выходят на большие манёвры у границы. Посредники штаба отмечают каждую ошибку, чтобы её не повторили в настоящей войне."
 IVN_rc_reserve_drilled:0 "Обученный резерв"
 IVN_rc_reserve_drilled_desc:0 "Резервисты недавно прошли сборы и помнят свои роты, рубежи и сигналы тревоги."
 IVN_rc_manoeuvre_lessons:0 "Уроки манёвров"
 IVN_rc_manoeuvre_lessons_desc:0 "Разборы последних манёвров ещё лежат на столах штаба, и командиры бригад знают, где они ошиблись."
 IVN_sh_league_secretariat:0 "Секретариат Лиги"
 IVN_sh_league_secretariat_desc:0 "В Старой марке открывается постоянный секретариат Лиги свободных республик. Его чиновники пишут письма в Римат, Норвейн и коридор чаще, чем министерство иностранных дел."
 IVN_sh_rimat_compact:0 "Риматский договор"
 IVN_sh_rimat_compact_desc:0 "Итора гарантировала Римату свободу ещё в годы распада. Теперь гарантия обретает дорогу через Талару и склады с оружием для городской милиции."
 IVN_sh_rimat_compact_tt:0 "Склонность [WIT.GetName] сдвигается к Иторе на §Y10§!."
 IVN_sh_charter_of_free_republics:0 "Хартия свободных республик"
 IVN_sh_charter_of_free_republics_desc:0 "Депутаты пишут хартию, которую сможет подписать любая республика Запада. Право на выборы, на суд и на собственную милицию в ней стоит раньше, чем право на союз."
 IVN_sh_civil_defence_council:0 "Совет гражданской обороны"
 IVN_sh_civil_defence_council_desc:0 "Город за городом марки выбирают советы гражданской обороны. Учителя и почтальоны учатся тушить пожары и стрелять по самолётам, которых Итора ещё не видела."
 IVN_sh_open_league:0 "Открытая Лига"
 IVN_sh_open_league_desc:0 "Двери Лиги открыты для всех, кто подпишет хартию, даже для вчерашних соперников. Итора готова спорить с соседями на заседаниях, а не на границе."
 IVN_sh_open_league_tt:0 "Склонность всех государств Запада сдвигается к Иторе на §Y5§!."
 IVN_sh_armed_covenant:0 "Вооружённый ковенант"
 IVN_sh_armed_covenant_desc:0 "Лига - это не клуб, а клятва. Те, кто уже стоит рядом с Иторой, получают оружие и общие планы обороны раньше, чем новые подписи под хартией."
 IVN_sh_northern_friends:0 "Друзья на севере"
 IVN_sh_northern_friends_desc:0 "Северные республики помнят, кто стоял у Крайта в годы распада. Лига присылает им полевые телефоны, санитарные машины и людей, умеющих ими пользоваться."
 IVN_sh_northern_friends_tt:0 "Склонность [IBA.GetName] и [IBL.GetName] сдвигается к Иторе на §Y10§!."
 IVN_sh_corridor_mediation:0 "Посредничество в коридоре"
 IVN_sh_corridor_mediation_desc:0 "Лига предлагает районам коридора то, чего не предложит Воркерланд: суд, где их спор с соседом разберут без солдат. Заодно Итора чинит дороги, по которым к ним поедут судьи."
 IVN_sh_push_corridor_10_tt:0 "Склонность [PWR.GetName], [PSD.GetName] и [ZAO.GetName] сдвигается к Иторе на §Y10§!."
 IVN_sh_officer_exchange:0 "Обмен офицерами"
 IVN_sh_officer_exchange_desc:0 "Офицеры Иторы служат в штабах союзников, а офицеры союзников - в штабах марок. Через год у ковенанта общие уставы и общие карты."
 IVN_sh_reserve_of_the_republic:0 "Резерв республики"
 IVN_sh_reserve_of_the_republic_desc:0 "Каждый гражданин марок проходит месяц сборов и уносит домой винтовку. Республика, которая не хочет войны, должна уметь собрать армию за неделю."
 IVN_sh_league_congress:0 "Конгресс Лиги"
 IVN_sh_league_congress_desc:0 "Делегаты свободных республик впервые собираются в одном зале. Они спорят три недели и расходятся с общим словом о Воркерланде, которое можно напечатать во всех газетах Запада."
 IVN_sh_free_press_of_the_west:0 "Свободная печать Запада"
 IVN_sh_free_press_of_the_west_desc:0 "Типографии Лиги печатают газеты на всех наречиях Запада. В них нет приказов, только новости, и потому им верят."
 IVN_sh_free_press_of_the_west_tt:0 "Склонность [WPA.GetName] и [WPS.GetName] сдвигается к Иторе на §Y10§!."
 IVN_sh_defence_in_depth:0 "Оборона в глубину"
 IVN_sh_defence_in_depth_desc:0 "За приграничной линией встаёт вторая, у Кантории и Лакоры. Если Воркерланд прорвётся, его встретят там, где у марок есть время собраться."
 IVN_sh_mobile_reserve:0 "Подвижный резерв"
 IVN_sh_mobile_reserve_desc:0 "Лучшие батальоны марок пересаживаются на грузовики. Их место не в окопах, а на дорогах, ведущих к любому участку границы."
 IVN_sh_league_railway:0 "Железная дорога Лиги"
 IVN_sh_league_railway_desc:0 "Новая ветка связывает Морессу и Канторию с северной линией. По ней резервисты доедут до фронта за сутки, а хлеб - до союзников за двое."
 IVN_sh_shield_of_free_republics:0 "Щит свободных республик"
 IVN_sh_shield_of_free_republics_desc:0 "Итора больше не просит соседей о доверии - она его заслужила. Если Воркерланд придёт на Запад, он встретит не одну республику, а их общую волю."
 IVN_sh_league_at_war:0 "Лига на войне"
 IVN_sh_league_at_war_desc:0 "Секретариат Лиги становится её военным советом. Добровольцы из Римата и северных республик записываются в полки марок прямо на вокзалах."
 IVN_sh_west_war_tt:0 "Идёт война за Запад, и Итора воюет с Воркерландом"
 IVN_sh_league_field_hospitals:0 "Госпитали Лиги"
 IVN_sh_league_field_hospitals_desc:0 "Врачи свободных республик разворачивают госпитали в тылу марок. Раненый солдат возвращается в строй, а не в списки погибших."
 IVN_sh_hold_the_line:0 "Держать линию"
 IVN_sh_hold_the_line_desc:0 "Лига не будет наступать первой. Марки зарываются в землю у Серенги и ждут, пока Воркерланд разобьёт о них свои полки."
 IVN_sh_relief_of_the_corridor:0 "Помощь коридору"
 IVN_sh_relief_of_the_corridor_desc:0 "Районы коридора ждут, придёт ли Лига на помощь. Подвижный резерв марок переходит границу, чтобы ответить им до того, как ответит Воркерланд."
 IVN_sh_volunteers_of_free_republics:0 "Добровольцы свободных республик"
 IVN_sh_volunteers_of_free_republics_desc:0 "Со всего Запада в марки идут люди, которые не хотят жить под воркерландской опекой. Они приносят с собой мастерские, пушки и упрямство."
 IVN_sh_confederation_of_the_west:0 "Конфедерация Запада"
 IVN_sh_confederation_of_the_west_desc:0 "Война окончена, и Лига становится конфедерацией. Её члены сохраняют свои советы и законы, а Итора отвечает за то, чтобы ни один из них больше не воевал с соседом."
 IVN_sh_west_won_tt:0 "Итора победила в войне за Запад"
 IVN_em_cabinet_of_national_defence:0 "Кабинет национальной обороны"
 IVN_em_cabinet_of_national_defence_desc:0 "Чрезвычайный кабинет заседает каждый день, а его решения вступают в силу в тот же вечер. Министры отчитываются не перед депутатами, а перед сроками."
 IVN_em_state_arsenals:0 "Государственные арсеналы"
 IVN_em_state_arsenals_desc:0 "В Южной марке строится казённый арсенал. Кабинет не ждёт, пока частные заводы договорятся о цене, - он платит сам и сам назначает норму."
 IVN_em_decrees_of_the_cabinet:0 "Декреты кабинета"
 IVN_em_decrees_of_the_cabinet_desc:0 "Указы кабинета печатают на первых полосах, а законы парламента - на последних. Страна быстро привыкает к тому, кто здесь решает."
 IVN_em_border_commissariat:0 "Пограничный комиссариат"
 IVN_em_border_commissariat_desc:0 "Кабинет создаёт комиссариат по делам коридора. Его уполномоченные приезжают к соседям не с просьбами, а со списками того, что Итора считает своими интересами."
 IVN_em_war_tribunals:0 "Военные трибуналы"
 IVN_em_war_tribunals_desc:0 "Спекулянтов, дезертиров и болтунов судят за один день. Порядок наводится быстро, а приграничье запоминает, кого увозили первыми."
 IVN_em_trust_all_minus_5_tt:0 "Доверие всех приграничных марок: §R-5§!"
 IVN_em_council_of_industrialists:0 "Совет промышленников"
 IVN_em_council_of_industrialists_desc:0 "Владельцы заводов получают места в совете при кабинете. Они выполняют военный заказ без споров, но за это их товары идут в лавки раньше солдатских пайков."
 IVN_em_rail_requisition:0 "Реквизиция дорог"
 IVN_em_rail_requisition_desc:0 "Железные дороги переходят в ведение кабинета. Пассажирские поезда ходят реже, зато воинские эшелоны доходят до Ведрины по расписанию."
 IVN_em_labour_conscription:0 "Трудовая повинность"
 IVN_em_labour_conscription_desc:0 "Каждый взрослый житель марок обязан отработать месяц на стройках обороны. Дороги и склады растут быстро, а в Морессе и Лакоре всё громче ропщут."
 IVN_em_trust_inner_minus_5_tt:0 "Доверие внутренних марок [98.GetName], [99.GetName], [100.GetName] и [101.GetName]: §R-5§!"
 IVN_em_war_contracts:0 "Военные контракты"
 IVN_em_war_contracts_desc:0 "Совет промышленников подписывает контракты на год вперёд. Склады марок наполняются раньше, чем казна успевает подсчитать долг."
 IVN_em_trusteeship_plans:0 "Планы опеки"
 IVN_em_trusteeship_plans_desc:0 "В комиссариате уже готовят списки чиновников для западного округа Воркерланда. Местные начальники узнают об этом и задумываются, кому служить завтра."
 IVN_em_trusteeship_plans_tt:0 "Склонность [ZAO.GetName] сдвигается к Иторе на §Y15§!."
 IVN_em_war_economy_law:0 "Закон о военной экономике"
 IVN_em_war_economy_law_desc:0 "Кабинет объявляет хозяйство марок военным. Каждый завод получает план, каждый план - срок, а каждый срок - ответственного."
 IVN_em_northern_depots:0 "Северные склады"
 IVN_em_northern_depots_desc:0 "У Талары вырастают склады и полевой аэродром. Армия, которая пойдёт в коридор, найдёт там всё, кроме времени на сборы."
 IVN_em_shock_army:0 "Ударная армия"
 IVN_em_shock_army_desc:0 "Кабинет делает ставку на немногих: лучшие полки получают лучших офицеров и право ударить первыми. Остальная армия будет держать то, что они возьмут."
 IVN_em_total_mobilisation:0 "Всеобщая мобилизация"
 IVN_em_total_mobilisation_desc:0 "Повестки получают все, кто может держать винтовку. Итора не будет лучше Воркерланда - она будет больше."
 IVN_em_occupation_administration:0 "Оккупационная администрация"
 IVN_em_occupation_administration_desc:0 "Комиссариат учит офицеров управлять занятыми городами: кормить, считать и наказывать. Опека над Западом начнётся в первый день войны."
 IVN_em_state_of_emergency:0 "Чрезвычайное государство"
 IVN_em_state_of_emergency_desc:0 "Чрезвычайное положение больше не временная мера. Это и есть Итора: страна, которая живёт так, будто война начнётся завтра утром."
 IVN_em_war_cabinet_in_session:0 "Кабинет в ставке"
 IVN_em_war_cabinet_in_session_desc:0 "Кабинет переезжает в ставку штаба. Министры спят в вагонах, а решения о снабжении принимаются у карты фронта."
 IVN_em_armoured_train_columns:0 "Бронепоездные колонны"
 IVN_em_armoured_train_columns_desc:0 "Реквизированные дороги получают своих хозяев: бронепоезда кабинета идут к границе коридора впереди пехоты."
 IVN_em_storm_the_corridor:0 "Штурм коридора"
 IVN_em_storm_the_corridor_desc:0 "Кабинет требует результата к следующему заседанию. Полки марок идут в коридор, не дожидаясь, пока подтянутся тылы."
 IVN_em_front_requisitions:0 "Фронтовые реквизиции"
 IVN_em_front_requisitions_desc:0 "Комиссары забирают в прифронтовых марках всё, что может стрелять или везти. Армия вооружена, а деревни запомнят эту зиму."
 IVN_em_military_governors:0 "Военные губернаторы"
 IVN_em_military_governors_desc:0 "В каждый занятый город кабинет назначает губернатора в погонах. Местные мужчины идут либо на работы, либо в иторские вспомогательные роты."
 IVN_em_emergency_trusteeship:0 "Чрезвычайная опека"
 IVN_em_emergency_trusteeship_desc:0 "Побеждённый Запад переходит под опеку кабинета. Его заводы работают на Итору, его дороги чинят иторские сапёры, а его выборы откладываются до лучших времён."
 IVN_rv_legion_government:0 "Правительство легиона"
 IVN_rv_legion_government_desc:0 "Легион победил и теперь правит. В министерствах сидят офицеры Ведрины, и каждое утро они спрашивают не о бюджете, а о том, когда армия пойдёт на север."
 IVN_rv_council_staff_regulations:0 "Устав совета"
 IVN_rv_council_staff_regulations_desc:0 "Совет легиона пишет новый устав для всей армии Иторы. В нём нет места митингам и речам - только приказу, плану и ответственности командира."
 IVN_rv_council_rules_tt:0 "Итора управляется §Yсоветом легиона§!"
 IVN_rv_book_of_grievances:0 "Книга обид"
 IVN_rv_book_of_grievances_desc:0 "Легион издаёт книгу обо всём, что марки потеряли из-за Воркерланда: о сожжённых сёлах, брошенных гарнизонах и проваленном походе. Её читают вслух в каждой казарме."
 IVN_rv_union_mass_rallies:0 "Массовые митинги"
 IVN_rv_union_mass_rallies_desc:0 "Патриотический союз выводит на площади целые города. Ораторы говорят о севере так, будто граница уже перенесена, и толпа им верит."
 IVN_rv_union_rules_tt:0 "У власти в Иторе §YПатриотический союз§!"
 IVN_rv_council_military_districts:0 "Военные округа"
 IVN_rv_council_military_districts_desc:0 "Марки делятся на военные округа, и в каждом правит не губернатор, а командующий. Дороги к границе строят по приказу штаба, а не по жалобам жителей."
 IVN_rv_coerce_the_corridor:0 "Давление на коридор"
 IVN_rv_coerce_the_corridor_desc:0 "Легион не уговаривает соседей, а ставит их перед выбором. Делегации коридора уезжают из Старой марки бледными и сговорчивыми."
 IVN_rv_coerce_the_corridor_tt:0 "Склонность [PWR.GetName], [PSD.GetName] и [ZAO.GetName] сдвигается к Иторе на §Y15§!."
 IVN_rv_arm_the_frontier:0 "Вооружить приграничье"
 IVN_rv_arm_the_frontier_desc:0 "Ведрина, колыбель легиона, получает собственный оружейный завод. Город, поднявший мятеж, теперь куёт оружие для реванша."
 IVN_rv_union_militia_of_the_marches:0 "Дружины союза"
 IVN_rv_union_militia_of_the_marches_desc:0 "Союз создаёт свои дружины в каждой марке. Их учат наспех, но они приходят на сборы целыми улицами."
 IVN_rv_council_karns_general_staff:0 "Генштаб Карна"
 IVN_rv_council_karns_general_staff_desc:0 "Генерал Карн собирает генеральный штаб из тех, кто воевал с ним против кабинета. Они уже однажды взяли Старую марку и знают, как брать города."
 IVN_rv_corridor_fifth_column:0 "Пятая колонна"
 IVN_rv_corridor_fifth_column_desc:0 "В городах коридора появляются люди, которые говорят на наречии марок и знают, где стоят чужие склады. Когда легион придёт, его встретят проводники."
 IVN_rv_vedrina_gun_works:0 "Пушечный двор Ведрины"
 IVN_rv_vedrina_gun_works_desc:0 "Завод в Ведрине начинает лить орудийные стволы. Первые пушки уходят не на склад, а сразу на учебный полигон у границы."
 IVN_rv_union_patriotic_labour:0 "Патриотический труд"
 IVN_rv_union_patriotic_labour_desc:0 "Союз выводит людей не только на митинги, но и на стройки. Лакора получает новый завод, построенный по воскресеньям руками добровольцев."
 IVN_rv_army_of_revenge:0 "Армия реванша"
 IVN_rv_army_of_revenge_desc:0 "Полки кабинета и полки легиона сливаются в одну армию. У неё одна присяга, одна обида и одна цель за северной границей."
 IVN_rv_storm_battalions:0 "Штурмовые батальоны"
 IVN_rv_storm_battalions_desc:0 "Ветераны мятежа становятся ядром штурмовых батальонов. Им дают грузовики и право выбирать себе офицеров."
 IVN_rv_forward_bases:0 "Передовые базы"
 IVN_rv_forward_bases_desc:0 "У Серенги строят аэродром, у Ведрины - зенитные батареи. Легион готовит границу не к обороне, а к прыжку."
 IVN_rv_legion_of_the_west:0 "Легион Запада"
 IVN_rv_legion_of_the_west_desc:0 "Иторский легион освобождения больше не армия одной провинции. Он называет себя легионом всего Запада и обещает вернуть марки туда, где они стояли до распада."
 IVN_rv_the_march_begins:0 "Поход начинается"
 IVN_rv_the_march_begins_desc:0 "Легион снова идёт на север, но теперь за ним вся Итора. На вокзалах играют марши, которые полгода назад звучали только в Ведрине."
 IVN_rv_council_operational_plan:0 "Оперативный план Карна"
 IVN_rv_council_operational_plan_desc:0 "Генштаб Карна расписывает наступление по дням. Каждая дивизия знает, где она будет через неделю, и почти всегда там оказывается."
 IVN_rv_lightning_march:0 "Молниеносный марш"
 IVN_rv_lightning_march_desc:0 "Колонны легиона идут без остановок, бросая отставших. Кто первым войдёт в города коридора, тот и будет их хозяином."
 IVN_rv_methodical_advance:0 "Методичное наступление"
 IVN_rv_methodical_advance_desc:0 "Легион не спешит. Сначала говорят пушки Ведрины, потом идёт пехота, и ни один взятый холм не отдаётся обратно."
 IVN_rv_union_levee_en_masse:0 "Народное ополчение"
 IVN_rv_union_levee_en_masse_desc:0 "Союз объявляет, что каждый патриот обязан встать в строй. Дружины уходят на фронт целыми городами, оставляя марки без рабочих рук."
 IVN_rv_total_war_of_the_marches:0 "Тотальная война марок"
 IVN_rv_total_war_of_the_marches_desc:0 "Реванш не терпит полумер. Итора воюет всем, что у неё есть, и не собирается останавливаться у границ коридора."
 IVN_rv_annexation_of_the_west:0 "Присоединение Запада"
 IVN_rv_annexation_of_the_west_desc:0 "Побеждённые не становятся союзниками или подопечными - они становятся марками. Легион ставит своих комендантов от Старой марки до бывшей столицы Воркерланда."
 IVN_shield_course_category:0 "Гуманистический щит"
 IVN_shield_course_category_desc:0 "Лига свободных республик собирает Запад вокруг Иторы словом, хлебом и общей обороной."
 IVN_emergency_course_category:0 "Чрезвычайный порядок"
 IVN_emergency_course_category_desc:0 "Чрезвычайный кабинет готовит марки к войне за Запад, не спрашивая, во что это обойдётся."
 IVN_revanche_course_category:0 "Реванш марок"
 IVN_revanche_course_category_desc:0 "Правительство легиона превращает обиды марок в армию, заводы и план похода на север."
 IVN_sh_league_assembly:0 "Ассамблея Лиги"
 IVN_sh_league_assembly_desc:0 "Делегаты свободных республик съезжаются в Старую марку. Пока идут заседания, вся Итора слушает их речи по радио."
 IVN_sh_league_assembly_tt:0 "Склонность всех государств Запада сдвигается к Иторе на §Y8§!."
 IVN_sh_west_unresolved_tt:0 "Война за Запад ещё не закончилась"
 IVN_sh_volunteer_brigades:0 "Добровольческие бригады"
 IVN_sh_volunteer_brigades_desc:0 "Советы гражданской обороны собирают добровольцев со всех марок. Их учат по воскресеньям, в школах и на заводских дворах."
 IVN_em_requisition_drive:0 "Реквизиционная кампания"
 IVN_em_requisition_drive_desc:0 "Уполномоченные кабинета объезжают склады, мастерские и лавки. То, что пригодится армии, уезжает на военные склады."
 IVN_em_border_exercises:0 "Пограничные манёвры"
 IVN_em_border_exercises_desc:0 "Полки марок проводят учения у самой границы коридора. Соседи видят их костры по ночам и делают выводы."
 IVN_em_west_before_war_tt:0 "Война за Запад ещё не началась"
 IVN_rv_arsenal_shift:0 "Вторая смена арсеналов"
 IVN_rv_arsenal_shift_desc:0 "Арсеналы марок работают днём и ночью. Рабочие спят у станков, а лавки пустеют, потому что всё железо уходит на войну."
 IVN_rv_staff_war_games:0 "Штабные игры совета"
 IVN_rv_staff_war_games_desc:0 "Генштаб Карна разыгрывает поход на север на картах и макетах. Каждая ошибка на столе - это полк, сохранённый в поле."
 IVN_rv_union_rallies:0 "§YПРОПАГАНДА:§! Митинги союза"
 IVN_rv_union_rallies_desc:0 "Патриотический союз проводит митинги во всех марках. Ораторы обещают реванш, а у трибун записывают добровольцев."
 IVN_sh_spirit_shield_of_free_republics:0 "Щит свободных республик"
 IVN_sh_spirit_shield_of_free_republics_desc:0 "Итора стоит за свободу Запада не силой, а доверием соседей, и это доверие делает её сильнее."
 IVN_em_spirit_state_of_emergency:0 "Чрезвычайное государство"
 IVN_em_spirit_state_of_emergency_desc:0 "Кабинет правит указами, заводы работают по военным планам, а страна живёт так, будто война начнётся завтра."
 IVN_rv_spirit_legion_of_the_west:0 "Легион Запада"
 IVN_rv_spirit_legion_of_the_west_desc:0 "Легион называет себя армией всего Запада и обещает вернуть марки туда, где они стояли до распада."
 IVN_sh_unbroken_line:0 "Несломленная линия"
 IVN_sh_unbroken_line_desc:0 "Марки зарылись в землю и ждут удара. Каждый окоп знает, кто стоит справа и слева."
 IVN_sh_liberation_offensive:0 "Помощь коридору"
 IVN_sh_liberation_offensive_desc:0 "Подвижный резерв Лиги идёт в коридор, и местные жители показывают ему дороги."
 IVN_em_storm_of_the_corridor:0 "Штурм коридора"
 IVN_em_storm_of_the_corridor_desc:0 "Кабинет требует быстрых результатов, и армия бросает в бой всё, что у неё есть."
 IVN_rv_karns_operational_plan:0 "Оперативный план Карна"
 IVN_rv_karns_operational_plan_desc:0 "Наступление расписано по дням, и дивизии легиона идут точно по графику."
 IVN_rv_lightning_march_spirit:0 "Молниеносный марш"
 IVN_rv_lightning_march_spirit_desc:0 "Колонны легиона идут без остановок, и тылы едва успевают за ними."
 IVN_rv_methodical_advance_spirit:0 "Методичное наступление"
 IVN_rv_methodical_advance_spirit_desc:0 "Сначала говорят пушки, потом идёт пехота, и ни один взятый рубеж не отдаётся."
 IVC_legion_general_staff:0 "Генеральный штаб легиона"
 IVC_legion_general_staff_desc:0 "Штаб северного корпуса переезжает в здание ведринской гимназии. На партах лежат карты марок, а на доске мелом расписаны полки, которых у легиона пока нет."
 IVC_assault_groups:0 "Штурмовые группы"
 IVC_assault_groups_desc:0 "Роты делят на группы по двадцать человек: сапёры, пулемётчики, гранатомётчики. Каждая группа берёт один дом, один окоп, одну переправу."
 IVC_legion_batteries:0 "Батареи легиона"
 IVC_legion_batteries_desc:0 "Орудия, которые северный корпус тащил из коридора, сводят в батареи. Наводчиков учат стрелять по картам марок, а не по чужим квадратам."
 IVC_fire_and_assault:0 "Огонь и штурм"
 IVC_fire_and_assault_desc:0 "Штурмовые группы идут в атаку за огневым валом, а не после него. Артиллеристы и пехотинцы впервые сидят на одном совещании."
 IVC_hill_war_of_vedrina:0 "Война на холмах Ведрины"
 IVC_hill_war_of_vedrina_desc:0 "Холмы вокруг Ведрины изрезаны оврагами и старыми выработками. Полки марок знают здесь каждую тропу, а войска кабинета видят их только на картах."
 IVC_mountain_rifles:0 "Горные стрелки"
 IVC_mountain_rifles_desc:0 "Охотники, лесники и горняки Ведрины становятся стрелками легиона. Им выдают облегчённые винтовки и верёвки, а остальному они научат себя сами."
 IVC_ridge_flak_posts:0 "Зенитные посты на гребнях"
 IVC_ridge_flak_posts_desc:0 "Самолёты остались у кабинета, но гребни холмов остались у легиона. На каждой высоте ставят зенитный пост и телефон в штаб."
 IVC_anti_tank_companies:0 "Противотанковые роты"
 IVC_anti_tank_companies_desc:0 "Кабинет обшивает поезда сталью и выводит из парков бронемашины. Легиону нужны люди, которые не побегут, когда на окоп поедет железо."
 IVC_motorised_columns:0 "Моторизованные колонны"
 IVC_motorised_columns_desc:0 "Лесовозы, автобусы и почтовые фургоны марок получают номера легиона. Пехота едет на фронт, а не идёт к нему неделю."
 IVC_armoured_train_hunters:0 "Охотники за бронепоездами"
 IVC_armoured_train_hunters_desc:0 "Бронепоезда кабинета сильны, пока под ними есть рельсы. Подвижные группы легиона учатся подрывать пути и бить по паровозам из засад."
 IVC_legion_campaign_plan:0 "План кампании"
 IVC_legion_campaign_plan_desc:0 "В штабе спорят две школы. Одни хотят держать марки и обескровить кабинет, другие - идти на столицу, пока у кабинета не кончились сомнения."
 IVC_war_on_the_frontier:0 "Война на рубеже"
 IVC_war_on_the_frontier_desc:0 "Легион не пойдёт на столицу через минные поля. Пусть кабинет сам приходит в марки и платит за каждый холм, пока его солдаты не спросят, за что они воюют."
 IVC_decisive_march:0 "Решительный марш"
 IVC_decisive_march_desc:0 "Каждый месяц войны работает на кабинет: у него склады, порты и острова. Сталк решает бить сейчас, пока столица не привыкла к мысли, что её можно защитить."
 IVC_hold_every_ridge:0 "Держать каждый гребень"
 IVC_hold_every_ridge_desc:0 "Оборона легиона строится не линией, а сетью: окопы на склонах, пулемёты в оврагах, резервы за каждой высотой."
 IVC_counterattacks_from_the_hills:0 "Контрудары с высот"
 IVC_counterattacks_from_the_hills_desc:0 "Когда наступление кабинета выдыхается у подножия холмов, резервы легиона спускаются вниз. Пленных отправляют в Ведрину строить новые окопы."
 IVC_columns_to_the_south:0 "Колонны на юг"
 IVC_columns_to_the_south_desc:0 "Колонны легиона идут ночами, без привалов и без обозов. Отставших подбирают грузовики, раненых оставляют в деревнях, которые уже подняли флаг марок."
 IVC_break_the_lakora_line:0 "Прорыв Лакорской линии"
 IVC_break_the_lakora_line_desc:0 "Окопы между Морессой и Лакорой - последнее, что стоит между легионом и южными марками. Штаб стягивает к ним все орудия, какие может найти."
 IVC_army_of_the_marches:0 "Армия марок"
 IVC_army_of_the_marches_desc:0 "Мятежные полки стали армией: со своими уставами, госпиталями и героями. В марках её уже называют не легионом, а просто армией."
 IVC_general_offensive_plan:0 "План общего наступления"
 IVC_general_offensive_plan_desc:0 "Сталк собирает командиров полков в последний раз перед большим ударом. Срок наступления знают трое, остальные узнают его по сигнальной ракете."
 IVC_artillery_preparation:0 "Артиллерийская подготовка"
 IVC_artillery_preparation_desc:0 "К фронту везут снаряды, которые берегли с начала мятежа. Огонь будет коротким, но таким, что окопы кабинета запомнят его до конца войны."
 IVC_offensive_supply_dumps:0 "Склады наступления"
 IVC_offensive_supply_dumps_desc:0 "За линией фронта ночами вырастают штабеля ящиков: патроны, бинты, сухари, бензин. Интенданты считают их дни, а не тонны."
 IVC_last_reserves:0 "Последние резервы"
 IVC_last_reserves_desc:0 "Из госпиталей выписывают выздоравливающих, из тыловых гарнизонов забирают каждого второго. Марки отдают легиону последних, кого могут отдать."
 IVC_the_last_push:0 "Последний рывок"
 IVC_the_last_push_desc:0 "Ракета взлетает над Ведриной в четыре утра. Легион поднимается из окопов весь сразу - второго такого утра у него не будет."
 IVC_hunt_for_the_cabinet:0 "Охота за кабинетом"
 IVC_hunt_for_the_cabinet_desc:0 "Министры жгут бумаги и ищут места на пароходах до островов. Разъезды легиона перекрывают дороги к побережью раньше, чем кабинет успевает решить, бежать ли ему."
 IVC_council_military_governors:0 "Военные губернаторы"
 IVC_council_military_governors_desc:0 "В каждую марку легиона совет назначает губернатора в погонах. Бургомистры остаются на местах, но печать теперь хранится в комендатуре."
 IVC_trust_legion_held_minus_10_tt:0 "Доверие марок легиона к столице: §R-10§!"
 IVC_amnesty_needs_trust_tt:0 "Кабинет может предложить амнистию марке легиона, только пока её доверие к столице не ниже §Y60§!."
 IVC_council_staff_academy:0 "Штабная академия"
 IVC_council_staff_academy_desc:0 "Совет открывает в Ведрине курсы для младших офицеров. Лекции читают полковники, которые ещё прошлой весной командовали корпусом в коридоре."
 IVC_council_war_production_board:0 "Военно-промышленное бюро"
 IVC_council_war_production_board_desc:0 "Заводы марок получают не просьбы, а наряды с подписью совета. Директор, сорвавший наряд, отвечает перед полевым судом."
 IVC_council_letters_to_old_comrades:0 "Письма старым товарищам"
 IVC_council_letters_to_old_comrades_desc:0 "Офицеры совета пишут бывшим однокашникам, служащим кабинету. Они не зовут к измене - они спрашивают, кому те будут подчиняться после войны."
 IVC_council_military_railway:0 "Военная железная дорога"
 IVC_council_military_railway_desc:0 "Железнодорожники марок переходят в подчинение штаба. Расписание составляют по фронтовым сводкам, а пассажирские поезда ходят, когда остаётся место."
 IVC_council_cross_of_the_marches:0 "Крест марок"
 IVC_council_cross_of_the_marches_desc:0 "Совет учреждает собственную награду: железный крест на ленте цветов приграничья. Её вручают на плацу, при всём полку, и только за бой."
 IVC_council_professional_cadres:0 "Профессиональные кадры"
 IVC_council_professional_cadres_desc:0 "Совет не хочет толпы с винтовками. В легион берут тех, кто прошёл отбор, а остальных отправляют рыть окопы и чинить дороги."
 IVC_council_strategic_reserve:0 "Стратегический резерв"
 IVC_council_strategic_reserve_desc:0 "Совет держит за Ведриной несколько полков, о которых не знают даже командиры дивизий. Их поведут в бой только по приказу Сталка."
 IVC_council_rule_of_the_staff:0 "Власть штаба"
 IVC_council_rule_of_the_staff_desc:0 "Совет легиона больше не совещается - он отдаёт приказы. Марки управляются как одна дивизия, и у этой дивизии один штаб."
 IVC_council_terms_for_the_capital:0 "Условия для столицы"
 IVC_council_terms_for_the_capital_desc:0 "Совет объявляет свои условия: офицеры кабинета сохранят звания, если сложат оружие до конца месяца. Министров эти условия не касаются."
 IVC_union_militia_of_the_marches:0 "Ополчение марок"
 IVC_union_militia_of_the_marches_desc:0 "Союз собирает ополчение по улицам и цехам. Командиров выбирают на собраниях, а винтовки раздают прямо из вагонов."
 IVC_union_cells_in_the_old_march:0 "Ячейки в Старой марке"
 IVC_union_cells_in_the_old_march_desc:0 "В столице и южных марках у союза остались тысячи членов. Теперь они собираются по квартирам и ждут сигнала из Ведрины."
 IVC_union_workers_detachments:0 "Рабочие дружины"
 IVC_union_workers_detachments_desc:0 "Мастерские Талары переходят под управление рабочих дружин союза. Они работают в две смены и сами охраняют цеха от диверсантов кабинета."
 IVC_union_youth_battalions:0 "Молодёжные батальоны"
 IVC_union_youth_battalions_desc:0 "Школьники старших классов уходят в легион целыми выпусками. Учителя провожают их на вокзале и не знают, гордиться им или плакать."
 IVC_union_lists_of_traitors:0 "Списки предателей"
 IVC_union_lists_of_traitors_desc:0 "Союз вывешивает на площадях имена тех, кто ждёт возвращения кабинета. Их дома переходят к семьям легионеров, а сами они - на дороги к югу."
 IVC_union_great_rally:0 "Большой митинг в Ведрине"
 IVC_union_great_rally_desc:0 "На главной площади Ведрины собираются сто тысяч человек. Сталк говорит недолго, но его слова потом неделю повторяют во всех марках."
 IVC_union_marching_columns:0 "Походные колонны союза"
 IVC_union_marching_columns_desc:0 "Колонны союза идут к фронту с песнями и знамёнами. Командиры легиона морщатся, но такие роты не отступают, пока поют."
 IVC_union_agitators_to_the_south:0 "Агитаторы на юг"
 IVC_union_agitators_to_the_south_desc:0 "Ораторы союза переходят линию фронта с котомками листовок. В южных марках их ловят, но на место каждого пойманного приходят двое."
 IVC_trust_cabinet_held_minus_10_tt:0 "Доверие приграничных марок кабинета к столице: §R-10§!"
 IVC_union_peoples_legion:0 "Народный легион"
 IVC_union_peoples_legion_desc:0 "Легион больше не армия офицеров. Союз превратил его в народ с оружием, и этот народ знает, куда идти."
 IVC_union_march_of_the_marches:0 "Поход марок"
 IVC_union_march_of_the_marches_desc:0 "Союз зовёт всех, кто может идти, к столице. За полками легиона по дорогам тянутся тысячи людей с флагами, и кабинет видит их с крыш Старой марки."
 IVC_legion_quartermaster_corps:0 "Интендантский корпус"
 IVC_legion_quartermaster_corps_desc:0 "Интенданты северного корпуса берут на учёт всё, что катится, стреляет и кормит. Тыл легиона начинается с ведомостей."
 IVC_requisition_committees:0 "Реквизиционные комитеты"
 IVC_requisition_committees_desc:0 "В каждой волости легион ставит комитет из трёх человек: офицер, писарь и местный ветеран. Комитет решает, сколько зерна и людей деревня отдаст фронту."
 IVC_fair_purchase:0 "Честная закупка"
 IVC_fair_purchase_desc:0 "Сталк запрещает брать у марок даром. Интенданты платят расписками, которые можно предъявить в любой комендатуре, и марки держат легион за своих."
 IVC_confiscated_workshops:0 "Конфискованные мастерские"
 IVC_confiscated_workshops_desc:0 "Мастерские хозяев, бежавших к кабинету, переходят к легиону вместе со станками и рабочими. Рабочим платят пайком."
 IVC_labour_service:0 "Трудовая повинность"
 IVC_labour_service_desc:0 "Мужчины, не годные в строй, выходят на работы: окопы у Серенги, мосты, дороги. Отказавшихся записывают в те же списки, что и дезертиров."
 IVC_legion_receipts:0 "Расписки легиона"
 IVC_legion_receipts_desc:0 "Расписки интендантов ходят по маркам как деньги. Лавочники принимают их охотнее, чем бумажки кабинета, - за ними стоит армия, а не обещание."
 IVC_workshop_contracts:0 "Подряды мастерским"
 IVC_workshop_contracts_desc:0 "Легион заключает подряды с мастерскими Кантории. Хозяева остаются хозяевами, но работают на фронт и получают за это сполна."
 IVC_workshops_of_the_marches:0 "Мастерские марок"
 IVC_workshops_of_the_marches_desc:0 "Ремонтные депо Серенги и ведринские артели становятся заводами. Марки легиона впервые делают для войны больше, чем тратят."
 IVC_field_hospitals:0 "Полевые госпитали"
 IVC_field_hospitals_desc:0 "Монастыри и школы марок превращаются в госпитали. Раненые легионеры возвращаются в строй, а их матери видят, что легион не бросает своих."
 IVC_answer_to_the_amnesty:0 "Ответ на амнистию"
 IVC_answer_to_the_amnesty_desc:0 "Кабинет обещает прощение тем маркам, что вернутся к столице. Легион отвечает списком деревень, сожжённых карателями кабинета во время экспедиции."
 IVC_rear_of_the_legion_secured:0 "Тыл легиона"
 IVC_rear_of_the_legion_secured_desc:0 "У легиона появился тыл: склады, госпитали, мастерские и люди, которые знают, зачем всё это. Мятеж стал государством на военном положении."
 IVC_agitators_across_the_front:0 "Агитаторы за линией фронта"
 IVC_agitators_across_the_front_desc:0 "Легион отправляет за линию фронта своих людей: коробейников, почтальонов, дьячков. Они несут не оружие, а новости, которых нет в газетах кабинета."
 IVC_leaflets_over_moressa:0 "Листовки над Морессой"
 IVC_leaflets_over_moressa_desc:0 "Ветер с холмов несёт на Морессу и Лакору листовки легиона. В них нет призывов - только имена солдат этих марок, погибших в коридоре."
 IVC_trust_moressa_lakora_minus_10_tt:0 "Доверие марок [98.GetName] и [99.GetName] к столице: §R-10§!"
 IVC_depot_saboteurs:0 "Подрывники складов"
 IVC_depot_saboteurs_desc:0 "Сочувствующие легиону железнодорожники знают, где кабинет держит патроны. Склады горят по ночам, и столица ищет виноватых среди своих."
 IVC_radio_vedrina:0 "Радио Ведрины"
 IVC_radio_vedrina_desc:0 "Передатчик на ведринской колокольне вещает по вечерам на всю республику. Сводки легиона слушают даже в казармах столицы, закрыв окна."
 IVC_strikes_in_the_old_march:0 "Забастовки в Старой марке"
 IVC_strikes_in_the_old_march_desc:0 "Рабочие столичных заводов требуют хлеба и конца войны. Кабинет посылает к проходным солдат, и каждая такая рота - подарок для газеты легиона."
 IVC_capital_loses_the_marches:0 "Столица теряет марки"
 IVC_capital_loses_the_marches_desc:0 "В марках кабинета перестают вывешивать портреты Куливанова. Старосты отвечают на приказы столицы молчанием и ждут, кто придёт первым."
 IVC_deserters_welcome:0 "Дезертиров принимают"
 IVC_deserters_welcome_desc:0 "Легион объявляет: каждый солдат кабинета, перешедший линию с винтовкой, получит паёк и место в полку своей марки. Переходят ночами, по одному и взводами."
 IVC_rumours_of_the_islands:0 "Слухи об островах"
 IVC_rumours_of_the_islands_desc:0 "По столице ползёт слух: министры уже держат каюты на пароходах до островов. Опровержения кабинета только подтверждают его."
 IVC_couriers_to_the_corridor:0 "Курьеры в коридор"
 IVC_couriers_to_the_corridor_desc:0 "Через перевалы Серенги и Талары в коридор уходят курьеры легиона. Северные командиры не любят Итору, но любят иторское золото."
 IVC_corridor_black_market:0 "Чёрный рынок коридора"
 IVC_corridor_black_market_desc:0 "На рынках коридора продаётся всё, что осталось от северных войн. Легион покупает противотанковые ружья и полевые телефоны оптом."
 IVC_northern_instructors:0 "Северные инструкторы"
 IVC_northern_instructors_desc:0 "Несколько офицеров, против которых корпус воевал в коридоре, приезжают в Ведрину учить легионеров. Им платят вдвое и не задают вопросов."
 IVC_quiet_northern_border:0 "Тихая северная граница"
 IVC_quiet_northern_border_desc:0 "С севера легиону больше никто не угрожает. Гарнизоны пограничных застав грузятся в эшелоны и едут на юг."
 IVC_northern_debt:0 "Долг перед севером"
 IVC_northern_debt_desc:0 "Север даёт легиону оружие в долг под обещание будущих поставок зерна и леса. Сталк подписывает, не торгуясь, - платить будет победившая Итора."
 IVC_legion_war_category:0 "Война легиона"
 IVC_legion_war_category_desc:0 "Штаб в Ведрине ведёт войну не только приказами. Учения, подряды, караваны с севера и люди за линией фронта решают её не меньше, чем полки."
 IVC_assault_group_drill:0 "Учения штурмовых групп"
 IVC_assault_group_drill_desc:0 "Батальоны отводят с передовой на полигон под Ведриной. Там они месяц берут макеты окопов и домов, пока каждый боец не будет знать своё место в группе."
 IVC_fortify_march:0 "Укрепить марку"
 IVC_fortify_march_desc:0 "Сапёры легиона и местные артели роют окопы и ставят доты на подступах к марке. Работа идёт днём и ночью, пока противник не подошёл ближе."
 IVC_requisition_columns:0 "Реквизиционные колонны"
 IVC_requisition_columns_desc:0 "Колонны комитетов объезжают волости марок легиона. Они забирают винтовки из охотничьих домов, грузовики из артелей и мужчин из деревень."
 IVC_fair_purchase_contracts:0 "Закупочные подряды"
 IVC_fair_purchase_contracts_desc:0 "Интенданты легиона заключают с мастерскими и складами марок подряды и платят по ним сполна. Поставки идут медленнее, но без жалоб."
 IVC_propaganda_cabinet_marches:0 "§YПРОПАГАНДА:§! Правда о кабинете"
 IVC_propaganda_cabinet_marches_desc:0 "Легион печатает списки погибших в коридоре, приказы кабинета об отступлении и письма солдат. Всё это расходится по маркам, которые ещё подчиняются столице."
 IVC_depot_sabotage:0 "Подрыв складов кабинета"
 IVC_depot_sabotage_desc:0 "Железнодорожники и кладовщики, сочувствующие легиону, готовят поджог складов в тылу кабинета. Им нужны деньги, взрывчатка и несколько недель."
 IVC_northern_arms_caravan:0 "Караван из коридора"
 IVC_northern_arms_caravan_desc:0 "Курьеры легиона договариваются с северными командирами о новой партии оружия. Караван пойдёт через перевалы, пока легион держит марки у границы коридора."
 IVC_officer_defection_talks:0 "Переговоры с офицерами кабинета"
 IVC_officer_defection_talks_desc:0 "Совет легиона тайно встречается с командирами полков кабинета. Тем, кто перейдёт со своими людьми, обещают звания, жалованье и забвение."
 IVC_trust_cabinet_held_minus_8_tt:0 "Доверие приграничных марок кабинета к столице: §R-8§!"
 IVC_northern_caravan_route_tt:0 "Мы контролируем [92.GetName], [95.GetName] или [96.GetName] на границе коридора"
 IVC_assault_groups_idea:0 "Штурмовые группы"
 IVC_assault_groups_idea_desc:0 "Батальоны, прошедшие учения под Ведриной, идут в атаку группами и берут окопы раньше, чем противник успевает понять, откуда удар."
 IVC_defence_in_depth_idea:0 "Оборона в глубину"
 IVC_defence_in_depth_idea_desc:0 "Окопы на склонах, пулемёты в оврагах и резервы за каждой высотой. Прорвать оборону легиона можно только по частям."
 IVC_forced_march_idea:0 "Форсированный марш"
 IVC_forced_march_idea_desc:0 "Колонны легиона идут ночами без привалов. Они устают, но приходят туда, где их не ждут."
 IVC_offensive_staff_work_idea:0 "Подготовка общего наступления"
 IVC_offensive_staff_work_idea_desc:0 "Штаб легиона расписывает наступление по часам: кто, когда и за каким огневым валом идёт вперёд."
 IVC_artillery_preparation_idea:0 "Артиллерийская подготовка"
 IVC_artillery_preparation_idea_desc:0 "Сбережённые снаряды легиона обрушиваются на окопы кабинета перед каждой атакой."
 IVC_offensive_supply_dumps_idea:0 "Склады наступления"
 IVC_offensive_supply_dumps_idea_desc:0 "Ящики с патронами, бинтами и бензином стоят прямо за передовой. Наступающим полкам не нужно ждать обозов."
 IVC_last_push_idea:0 "Последний рывок"
 IVC_last_push_idea_desc:0 "Легион поднялся из окопов весь сразу. Второго такого утра у него не будет, и каждый солдат это знает."
 IVC_march_momentum_idea:0 "Порыв марша"
 IVC_march_momentum_idea_desc:0 "Колонны решительного марша не останавливаются у разбитых позиций и идут дальше, пока кабинет собирает резервы."
 IVC_hill_counteroffensive_idea:0 "Контрнаступление с высот"
 IVC_hill_counteroffensive_idea_desc:0 "Полки, выдержавшие войну на рубеже, спускаются с холмов. Они знают каждый склон, по которому пойдут вперёд."
 IVC_council_unified_command_idea:0 "Единое командование"
 IVC_council_unified_command_idea_desc:0 "Совет легиона управляет марками как одной дивизией. Приказ из Ведрины доходит до роты за несколько часов."
 IVC_union_fervour_idea:0 "Порыв союза"
 IVC_union_fervour_idea_desc:0 "Роты союза идут в бой с песнями и знамёнами. Их трудно остановить, пока они поют."
 IVN_nm_mandate_council:0 "Мандатный совет"
 IVN_nm_mandate_council_desc:0 "В Норвейне собирается совет мандата: иторские уполномоченные, люди Матвея Матеуска и посланцы Антона Селевёстрова. Коридором впервые за годы управляют не приказы с фронта, а протоколы одного стола."
 IVN_nm_clients_ready_tt:0 "[IBA.GetName] или [IBL.GetName] остаётся нашим подданным"
 IVN_nm_arms_for_norvane:0 "Оружие для клиентов"
 IVN_nm_arms_for_norvane_desc:0 "Армии Норвейна и Крайта собраны из ополченцев и остатков северных гарнизонов. Арсеналы марок отдают им пушки и полевое снаряжение, чтобы новые правительства пережили первую зиму."
 IVN_nm_corridor_survey:0 "Обследование коридора"
 IVN_nm_corridor_survey_desc:0 "Инженеры марок проходят коридор от Норвейна до Крайта. Мосты, взорванные в войнах распада, отмечены на картах, и первые бригады уже чинят полотно."
 IVN_nm_mandate_liaison:0 "Офицеры связи"
 IVN_nm_mandate_liaison_desc:0 "При штабах Норвейна и Крайта служат офицеры марок. Они учат новые армии читать карты и ждать приказов, а заодно приучают их смотреть на юг, в сторону Иторы."
 IVN_nm_lean_clients_10_tt:0 "Склонность [IBA.GetName] и [IBL.GetName] сдвигается к Иторе на §Y10§!."
 IVN_nm_corridor_refugees:0 "Возвращение беженцев"
 IVN_nm_corridor_refugees_desc:0 "Лагеря беженцев из коридора стояли в Морессе и Лакоре с первых дней распада. Теперь эшелоны везут людей домой, и внутренние марки впервые за долгое время вздыхают свободно."
 IVN_nm_direct_administration:0 "Прямое управление"
 IVN_nm_direct_administration_desc:0 "Иторские комиссары садятся в министерствах Норвейна и Крайта. Матеуск и Селевёстров подписывают то, что им приносят, а коридор превращается в тыл армии марок."
 IVN_nm_lean_clients_20_tt:0 "Склонность [IBA.GetName] и [IBL.GetName] сдвигается к Иторе на §Y20§!."
 IVN_nm_client_self_government:0 "Самоуправление клиентов"
 IVN_nm_client_self_government_desc:0 "Комитет решает, что коридор удержат не комиссары, а собственные советы. Норвейн и Крайт получают право на свои законы, а Итора - соседей, которые не ждут удобного часа, чтобы от неё отвернуться."
 IVN_nm_corridor_garrisons:0 "Гарнизоны коридора"
 IVN_nm_corridor_garrisons_desc:0 "Вдоль северной кромки коридора встают укреплённые посты. Уцелевшие республики снова воюют между собой, и мандату нужна граница, через которую их войны не перекинутся на юг."
 IVN_nm_corridor_volunteers:0 "Добровольцы коридора"
 IVN_nm_corridor_volunteers_desc:0 "Комиссары открывают в городах коридора вербовочные пункты армии марок. Молодёжь Норвейна и Крайта идёт за жалованьем и пайком, хотя старшие называют это новой мобилизацией под чужим флагом."
 IVN_nm_mandate_arsenal:0 "Арсенал мандата"
 IVN_nm_mandate_arsenal_desc:0 "В Серенге, на дороге в коридор, строят арсенал для гарнизонов мандата. Снаряды и винтовки больше не везут через всю республику из Старой марки."
 IVN_nm_corridor_councils:0 "Советы коридора"
 IVN_nm_corridor_councils_desc:0 "В городах Норвейна и Крайта выбирают местные советы. Комитет посылает наблюдателей, а не списки кандидатов, и северяне впервые голосуют без солдат у дверей участка."
 IVN_nm_corridor_trade_treaty:0 "Торговый договор"
 IVN_nm_corridor_trade_treaty_desc:0 "Итора открывает рынки марок для леса и угля коридора, а взамен строит в Норвейне и Крайте мастерские. Торговля связывает клиентов с республикой крепче любого гарнизона."
 IVN_nm_norvane_charter:0 "Норвейнская хартия"
 IVN_nm_norvane_charter_desc:0 "Хартия закрепляет права коридора и обязательства Иторы перед ним. Матеуск называет её первой конституцией севера, написанной не под диктовку победителя."
 IVN_nm_lean_clients_15_tt:0 "Склонность [IBA.GetName] и [IBL.GetName] сдвигается к Иторе на §Y15§!."
 IVN_nm_corridor_telegraph:0 "Телеграф коридора"
 IVN_nm_corridor_telegraph_desc:0 "Вдоль железной дороги тянут провода от Старой марки до Крайта. Приказ из штаба доходит до северной заставы за час, а не за три дня с курьером."
 IVN_nm_northern_trunk_line:0 "Северная магистраль"
 IVN_nm_northern_trunk_line_desc:0 "Железная дорога снова идёт из Старой марки через Ведрину в коридор. По ней возят зерно и уголь, а при нужде - дивизии, которые за неделю окажутся на северной кромке мандата."
 IVN_nm_corridor_depots:0 "Склады коридора"
 IVN_nm_corridor_depots_desc:0 "На узловых станциях магистрали закладывают армейские склады. Если северу снова понадобится армия марок, она найдёт запасы в нескольких днях пути, а не в столице."
 IVN_nm_krait_university:0 "Крайтский университет"
 IVN_nm_krait_university_desc:0 "В Крайте открывается университет с иторскими профессорами и северными студентами. Через несколько лет коридором будут управлять люди, учившиеся по книгам республики."
 IVN_nm_northern_neighbours:0 "Соседи мандата"
 IVN_nm_northern_neighbours_desc:0 "За кромкой коридора лежат республики, которые недавно воевали с корпусом марок. Комитет предлагает им торговлю через Крайт и посредничество в их собственных спорах."
 IVN_nm_lean_north_10_tt:0 "Склонность [PWR.GetName], [PSD.GetName], [WPA.GetName] и [WPS.GetName] сдвигается к Иторе на §Y10§!."
 IVN_nm_northern_shield:0 "Северный щит"
 IVN_nm_northern_shield_desc:0 "Коридор больше не брешь в границе республики, а её северный щит. Норвейн и Крайт стоят между марками и войнами севера, и Итора знает, что за их спиной - её собственные города."
 IVN_nm_retreat_inquiry:0 "Комиссия по отступлению"
 IVN_nm_retreat_inquiry_desc:0 "Депутаты, офицеры и вдовы садятся за один стол разбирать, почему корпус ушёл из коридора. Комиссия заседает открыто: республика, которая прячет свои поражения, проиграет и следующую войну."
 IVN_nm_rearmament_plan:0 "План перевооружения"
 IVN_nm_rearmament_plan_desc:0 "Корпус бросил в коридоре пушки, грузовики и половину винтовок. Плановое бюро считает потери и впервые пишет военный заказ не на поход, а на оборону своих марок."
 IVN_nm_northern_border_line:0 "Северная пограничная линия"
 IVN_nm_northern_border_line_desc:0 "Вдоль границы с коридором роют окопы там, где ещё летом шли колонны экспедиции. Север теперь не цель похода, а сторона, откуда может прийти беда."
 IVN_nm_veterans_of_the_north:0 "Ветераны северного похода"
 IVN_nm_veterans_of_the_north_desc:0 "Вернувшиеся из коридора солдаты ждут не наград, а честного слова о том, что их поход не был напрасным. Комитет встречает их на вокзалах Ведрины и Серенги и сполна платит долги по жалованью."
 IVN_nm_expedition_prisoners:0 "Обмен пленными"
 IVN_nm_expedition_prisoners_desc:0 "В лагерях северных республик остались тысячи солдат корпуса. Комитет торгуется за каждого - зерном, деньгами и обещанием больше не входить в коридор с оружием."
 IVN_nm_lean_corridor_10_tt:0 "Склонность [PWR.GetName] и [PSD.GetName] сдвигается к Иторе на §Y10§!."
 IVN_nm_new_rifle_pattern:0 "Новый образец винтовки"
 IVN_nm_new_rifle_pattern_desc:0 "Винтовки корпуса клинило в грязи коридора. Оружейники Морессы получают заказ на образец, который выдержит северную осень."
 IVN_nm_artillery_school:0 "Артиллерийская школа"
 IVN_nm_artillery_school_desc:0 "Корпус шёл на север почти без пушек и платил за это пехотой. В Старой марке открывают артиллерийскую школу, и её первые выпускники едут прямо на северную линию."
 IVN_nm_northern_air_watch:0 "Воздушный дозор севера"
 IVN_nm_northern_air_watch_desc:0 "Над коридором летали чужие разведчики, а у корпуса не было ни одного аэродрома ближе столицы. В Кантории строят полевой аэродром и ставят зенитные батареи."
 IVN_nm_purge_officer_corps:0 "Чистка офицерского корпуса"
 IVN_nm_purge_officer_corps_desc:0 "Комиссия называет имена, и Комитет не ищет оправданий. Командиры, бросившие полки в коридоре, уходят под суд, а северные гарнизоны видят в этом расправу над своими."
 IVN_nm_rehabilitate_officers:0 "Реабилитация корпуса"
 IVN_nm_rehabilitate_officers_desc:0 "Штаб марок отвечает комиссии: армия сделала всё, что могла, с тем, что ей дали. Опальные командиры возвращаются в строй, и гарнизоны севера снова верят, что столица их не сдаст."
 IVN_nm_citizen_officers:0 "Офицеры из граждан"
 IVN_nm_citizen_officers_desc:0 "Место снятых командиров занимают учителя, инженеры и резервисты из внутренних марок. Они хуже знают устав, но присягали республике, а не штабу."
 IVN_nm_court_of_honour:0 "Суд чести"
 IVN_nm_court_of_honour_desc:0 "Офицерское собрание само судит своих, без депутатов и газет. Оправданные выходят из зала героями Серенги и Талары, осуждённые - без погон, но и без позора трибунала."
 IVN_nm_trust_serenga_talara_10_tt:0 "Доверие марок [92.GetName] и [96.GetName]: §G+10§!"
 IVN_nm_new_field_manual:0 "Новый полевой устав"
 IVN_nm_new_field_manual_desc:0 "Разбор отступления становится уставом. Новые наставления учат полки держать линию, отходить без паники и не отрываться от обозов на разбитых дорогах севера."
 IVN_nm_anti_armour_lessons:0 "Уроки броневиков"
 IVN_nm_anti_armour_lessons_desc:0 "Северные республики гнали корпус броневиками и грузовиками с пулемётами. Марки отвечают противотанковыми батареями на каждой станции."
 IVN_nm_mobile_reserve:0 "Подвижный резерв"
 IVN_nm_mobile_reserve_desc:0 "Резерв марок пересаживают на грузовики. Ему не придётся неделю идти пешком к прорыву, как шёл корпус к Крайту."
 IVN_nm_serenga_fortress:0 "Серенгская крепость"
 IVN_nm_serenga_fortress_desc:0 "Серенга стоит на главной дороге с севера. Её превращают в крепость с батареями и подземными складами, чтобы следующий враг остановился у её валов."
 IVN_nm_trust_serenga_5_tt:0 "Доверие марки [92.GetName]: §G+5§!"
 IVN_nm_northern_rokada:0 "Северная рокада"
 IVN_nm_northern_rokada_desc:0 "Вдоль границы прокладывают дорогу из Серенги на Талару и Канторию. По ней резервы пойдут вдоль фронта, а не по разбитым трактам через столицу."
 IVN_nm_invalid_homes:0 "Дома для увечных"
 IVN_nm_invalid_homes_desc:0 "В каждой марке открывают дом для солдат, вернувшихся без ног и без работы. Приграничье видит, что республика помнит их не только в день похорон."
 IVN_nm_veterans_settlements:0 "Посёлки ветеранов"
 IVN_nm_veterans_settlements_desc:0 "Ветераны получают землю и мастерские в Ильване. Новые посёлки строят те же сапёры, что наводили мосты у Крайта."
 IVN_nm_loyal_garrisons:0 "Верные гарнизоны"
 IVN_nm_loyal_garrisons_desc:0 "Не все полки севера ушли за Карном. Кабинет платит верным гарнизонам двойное жалованье и печатает их имена в столичных газетах."
 IVN_nm_revolt_active_tt:0 "Идёт мятеж марок"
 IVN_nm_trust_cabinet_held_10_tt:0 "Доверие приграничных марок кабинета: §G+10§!"
 IVN_nm_letter_to_vedrina:0 "Письмо в Ведрину"
 IVN_nm_letter_to_vedrina_desc:0 "Матери и вдовы солдат легиона пишут открытое письмо: вернитесь домой, вас не будут судить за чужие ошибки. Кабинет печатает его тиражом больше, чем любую листовку."
 IVN_nm_trust_legion_held_10_tt:0 "Доверие марок легиона к столице: §G+10§!"
 IVN_nm_army_after_defeat:0 "Армия после поражения"
 IVN_nm_army_after_defeat_desc:0 "Через год после отступления армия марок снова похожа на армию: у неё есть устав, резерв и дороги к границе. Она не забыла коридор - и именно поэтому его не повторит."
 IVN_nm_frontier_reconciliation:0 "Примирение приграничья"
 IVN_nm_frontier_reconciliation_desc:0 "Полки и марки, которые делили вину за север, наконец говорят друг с другом без оружия. Комитет объявляет день памяти экспедиции, и Ведрина отмечает его вместе со столицей."
 IVN_nm_lesson_of_the_north:0 "Урок севера"
 IVN_nm_lesson_of_the_north_desc:0 "Республика выучила то, что стоило ей корпуса: поход начинают только с прочным тылом и единой армией. Теперь у Иторы есть и то, и другое."
 IVN_mandate_category:0 "Мандат коридора"
 IVN_mandate_category_desc:0 "Норвейн и Крайтская директория держатся на иторских винтовках, иторских деньгах и иторском терпении. Совет мандата решает, сколько каждого из них коридор получит в этом месяце."
 IVN_retreat_category:0 "Уроки отступления"
 IVN_retreat_category_desc:0 "Корпус вернулся из коридора без победы. Комиссия, штаб и плановое бюро превращают его поражение в устав, заказы и укрепления, пока марки ещё помнят, чем оно обошлось."
 IVN_nm_mandate_mission:0 "Миссия мандата"
 IVN_nm_mandate_mission_desc:0 "Делегация совета мандата едет в столицу клиента с подарками, ревизорами и длинным списком обещаний. Её принимают тем теплее, чем ближе стоят гарнизоны марок."
 IVN_nm_mandate_arms_convoy:0 "Оружейный эшелон"
 IVN_nm_mandate_arms_convoy_desc:0 "Заводы марок собирают отдельный заказ для армии клиента. Эшелон уходит на север под охраной, и до его прибытия никто в коридоре не знает, сколько в нём вагонов."
 IVN_nm_corridor_roadworks:0 "Дорожные работы в коридоре"
 IVN_nm_corridor_roadworks_desc:0 "Сапёрная бригада марок чинит мосты и полотно в одной из земель коридора. Местные власти дают рабочих, Итора - инженеров и рельсы."
 IVN_nm_mandate_officers:0 "Иторские роты"
 IVN_nm_mandate_officers_desc:0 "Роты из марок переходят на службу клиента вместе с офицерами и знамёнами. Комиссары называют это помощью, северяне - присмотром."
 IVN_nm_client_credit:0 "Кредит самоуправлению"
 IVN_nm_client_credit_desc:0 "Совет мандата открывает клиенту кредит. Подряд выполняют иторские строители, а долг гасят товарами, которые северяне научатся делать сами."
 IVN_nm_client_credit_limit_tt:0 "[FROM.GetName] получила по кредитам меньше §Y2§! фабрик"
 IVN_nm_mission_lean_tt:0 "Склонность [FROM.GetName] сдвигается к Иторе на §Y10§!."
 IVN_nm_retreat_debriefing:0 "Опрос вернувшихся"
 IVN_nm_retreat_debriefing_desc:0 "Комиссия опрашивает очередную роту, вернувшуюся из коридора. Солдаты рассказывают о брошенных обозах, о приказах, которые приходили с опозданием на сутки, и о том, как их всё-таки вывели."
 IVN_nm_debriefing_limit_tt:0 "Опрос проводился меньше §Y3§! раз"
 IVN_nm_rearmament_order:0 "Заказ на перевооружение"
 IVN_nm_rearmament_order_desc:0 "Плановое бюро размещает заказ на то, чего корпусу не хватило в коридоре: противотанковые пушки, зенитки и полевое снаряжение. Заводы, ещё вчера шившие шинели, переходят на стволы и лафеты."
 IVN_nm_border_works:0 "Пограничные укрепления"
 IVN_nm_border_works_desc:0 "Сапёры укрепляют участок северной границы: бетонируют огневые точки, роют ходы сообщения и минируют броды."
 IVN_nm_veterans_reenlistment:0 "Повторный набор ветеранов"
 IVN_nm_veterans_reenlistment_desc:0 "Ветеранов северного похода зовут обратно в полки. Многие возвращаются, но в деревнях севера всё громче спрашивают, сколько ещё раз столица будет просить их сыновей."
 IVN_nm_ensign_school:0 "Школа прапорщиков"
 IVN_nm_ensign_school_desc:0 "Ускоренные курсы готовят младших командиров из резервистов и студентов. Из них выходят офицеры, которые присягали Комитету, а не старому штабу."
 IVN_nm_recall_disgraced_officers:0 "Возвращение опальных офицеров"
 IVN_nm_recall_disgraced_officers_desc:0 "Штаб пересматривает ещё одно дело командира, снятого после отступления. Оправданный офицер получает полк обратно, а его товарищи - доказательство, что штаб своих не бросает."
 IVN_nm_mandate_commissioners:0 "Иторские комиссары"
 IVN_nm_mandate_commissioners_desc:0 "Министерства и штабы страны работают под присмотром комиссаров Иторы. Армия получает оружие и порядок, правительство - всё меньше права решать само."
 IVN_nm_corridor_self_rule:0 "Самоуправление коридора"
 IVN_nm_corridor_self_rule_desc:0 "Итора доверяет стране собственные советы и законы. Местная власть держится не на чужих штыках, а на согласии своих городов."
 IVN_nm_officer_purge:0 "Чистка офицерского корпуса"
 IVN_nm_officer_purge_desc:0 "Полки потеряли командиров, которых судят за отступление. Новые офицеры ещё не знают своих солдат, а штаб - своих новых офицеров."
 IVN_cb_loyal_fleet:0 "Флот остаётся с республикой"
 IVN_cb_loyal_fleet_desc:0 "Ни один корабль не ушёл в Ведрину: моряки присягали республике, а не генералам марок. У кабинета есть то, чего нет у легиона, - море и острова за ним."
 IVN_cb_raidal_lifeline:0 "Рейдальский мост"
 IVN_cb_raidal_lifeline_desc:0 "Каждую ночь из Рейдаля на материк уходят транспорты с добровольцами и винтовками островных складов. Острова, которые столица долго не замечала, теперь кормят её фронт."
 IVN_cb_southern_dockyards:0 "Верфи Южного взморья"
 IVN_cb_southern_dockyards_desc:0 "Мастерские Южного взморья переходят с рыбацких шхун на сторожевые катера. Их строят быстро и грубо, но легиону нечем на них ответить."
 IVN_cb_coastal_blockade:0 "Морская блокада"
 IVN_cb_coastal_blockade_desc:0 "Катера флота перехватывают каботажные суда, которые везут легиону патроны из чужих гаваней. Каждая потопленная баржа - это рота мятежников без патронов."
 IVN_cb_ship_guns_ashore:0 "Корабельные орудия - на берег"
 IVN_cb_ship_guns_ashore_desc:0 "Пушки старых крейсеров снимают с палуб и ставят на железнодорожные платформы. Комендоры флота учат армейских артиллеристов стрелять по цели, которой они не видят."
 IVN_cb_air_arm:0 "Воздушные силы кабинета"
 IVN_cb_air_arm_desc:0 "Часть эскадрилий улетела в Ведрину вместе с лётчиками. Кабинет собирает оставшиеся машины на аэродромах Старой марки и учит новых пилотов прямо в бою."
 IVN_cb_air_reconnaissance:0 "Разведка с воздуха"
 IVN_cb_air_reconnaissance_desc:0 "Лёгкие самолёты каждое утро проходят над позициями легиона. К обеду в штабе кабинета лежат свежие карты, и полки Сталка уже не могут незаметно перебросить резервы."
 IVN_cb_rail_strikes:0 "Удары по узлам"
 IVN_cb_rail_strikes_desc:0 "Бомбардировщики идут на станции Ведрины и Кантории. Легион держится на железной дороге, и каждый разрушенный мост останавливает его эшелоны на неделю."
 IVN_cb_capital_air_defence:0 "Небо над столицей"
 IVN_cb_capital_air_defence_desc:0 "На крышах Старой марки ставят зенитки, а в Южной марке роют укрытия. Налёты легиона больше не застанут столицу врасплох."
 IVN_cb_behind_the_lines:0 "Тыл легиона"
 IVN_cb_behind_the_lines_desc:0 "В марках легиона остались учителя, железнодорожники и вдовы, которые не верят Сталку. Кабинет посылает к ним связных, деньги и надежду на скорое возвращение республики."
 IVN_cb_trust_legion_10_tt:0 "Доверие марок легиона к столице: §G+10§!"
 IVN_cb_underground_committees:0 "Подпольные комитеты"
 IVN_cb_underground_committees_desc:0 "Подполье не взрывает мостов: оно печатает списки амнистированных, прячет дезертиров и ведёт переговоры с усталыми ротами. Марки готовятся вернуться без боя."
 IVN_cb_trust_legion_15_tt:0 "Доверие марок легиона к столице: §G+15§!"
 IVN_cb_sabotage_detachments:0 "Диверсионные отряды"
 IVN_cb_sabotage_detachments_desc:0 "Офицеры кабинета уходят за линию фронта со взрывчаткой и картами складов. Легион почувствует войну в своём тылу, но жителям марок придётся платить за каждую облаву."
 IVN_cb_refugee_columns:0 "Колонны беженцев"
 IVN_cb_refugee_columns_desc:0 "С севера по всем дорогам идут семьи, бежавшие от мобилизации легиона. Кабинет встречает их на станциях, кормит и записывает мужчин в резерв."
 IVN_cb_trust_cabinet_5_tt:0 "Доверие приграничных марок кабинета: §G+5§!"
 IVN_cb_northern_battalions:0 "Батальоны северных марок"
 IVN_cb_northern_battalions_desc:0 "Беглецы из Ведрины, Талары и Кантории просят оружия. Из них формируют батальоны, которые знают каждую тропу по ту сторону фронта."
 IVN_cb_ring_around_vedrina:0 "Кольцо вокруг Ведрины"
 IVN_cb_ring_around_vedrina_desc:0 "Флот перекрыл море, авиация - небо, а подполье - дороги тыла. Легиону осталось только то, что он может удержать штыками."
 IVN_wl_victors_of_the_west:0 "Победители Запада"
 IVN_wl_victors_of_the_west_desc:0 "Воркерланд подписал мир на условиях Старой марки. Итора, которую ещё недавно считали провинцией распавшейся державы, теперь решает, каким будет Запад."
 IVN_wl_hegemon_ivn_tt:0 "Итора победила в войне за Запад"
 IVN_wl_corridor_administration:0 "Комендатуры коридора"
 IVN_wl_corridor_administration_desc:0 "Районы коридора отошли Иторе по мирному договору. В каждом городе открывается комендатура, и её первая задача - чтобы здесь перестали ждать возвращения прежних хозяев."
 IVN_wl_corridor_census:0 "Перепись коридора"
 IVN_wl_corridor_census_desc:0 "Переписчики обходят хутора и станции коридора. Впервые за годы распада у каждого жителя есть бумага, где написано, чей он гражданин."
 IVN_wl_corridor_census_tt:0 "За каждый район коридора, которым мы владеем: §G+2500§! £manpower_texticon"
 IVN_wl_corridor_roads:0 "Дороги коридора"
 IVN_wl_corridor_roads_desc:0 "Разбитые войной дороги коридора ремонтируют сапёры, которые ещё недавно их минировали. По ним пойдут уже не колонны, а грузовики с зерном."
 IVN_wl_fate_of_vorkerland:0 "Судьба Воркерланда"
 IVN_wl_fate_of_vorkerland_desc:0 "Держава, из обломков которой выросла Итора, теперь зависит от её решений. Старая марка должна показать, что победитель Запада умеет не только побеждать."
 IVN_wl_western_congress:0 "Конгресс Запада"
 IVN_wl_western_congress_desc:0 "Делегации западных республик съезжаются в Старую марку. Они приехали не к побеждённому Воркерланду, а к Иторе, и каждая хочет понять, чего стоит её дружба."
 IVN_wl_push_all_15_tt:0 "Склонность всех западных стран сдвигается к Иторе на §Y15§!. Страны со склонностью к нам от §Y50§! открыты для научного обмена и войдут в §YСовет Запада§!."
 IVN_wl_rimat_compact:0 "Договор с Риматом"
 IVN_wl_rimat_compact_desc:0 "Римат был единственным соседом, на которого Итора могла рассчитывать в худшие дни. Новый договор открывает границу у Талары для торговли и обещает Римату голос в делах Запада."
 IVN_wl_push_rimat_tt:0 "Склонность [WIT.GetName] сдвигается к Иторе на §Y25§!."
 IVN_wl_northern_republics:0 "Северные республики"
 IVN_wl_northern_republics_desc:0 "Республики севера помнят, что Итора дважды приходила в коридор с войсками. Теперь она приходит с торговыми агентами и врачами, и это действует лучше любой армии."
 IVN_wl_push_north_tt:0 "Склонность [PWR.GetName], [PSD.GetName] и [ZAO.GetName] сдвигается к Иторе на §Y20§!."
 IVN_wl_concert_of_the_west:0 "Совет Запада"
 IVN_wl_concert_of_the_west_desc:0 "Республики Запада садятся за один стол с Иторой. Это ещё не союз, но уже порядок, в котором споры решают на совете, а не на марше."
 IVN_wl_concert_of_the_west_tt:0 "За каждую суверенную западную страну, которая склоняется к нам не меньше чем на §Y50§! или состоит с нами в союзе: §G+15§! £political_power_texticon и §G+1500§! £manpower_texticon добровольцев, а сама страна получает §G+3%§! стабильности."
 IVN_wl_army_after_victory:0 "Армия победителей"
 IVN_wl_army_after_victory_desc:0 "Полки возвращаются в казармы под музыку и цветы. Через неделю после парада республике придётся решить, что делать с армией, которая ей больше не нужна - или нужна как никогда."
 IVN_wl_demobilisation:0 "Демобилизация"
 IVN_wl_demobilisation_desc:0 "Солдаты возвращаются к станкам и полям. Республика рискует остаться без армии, но марки, уставшие от двух войн, наконец получают своих сыновей обратно."
 IVN_wl_standing_army:0 "Постоянная армия"
 IVN_wl_standing_army_desc:0 "Штаб убеждает Комитет: мир на Западе держится на дивизиях, а не на договорах. Кадровые полки остаются под ружьём и уходят в гарнизоны коридора."
 IVN_wl_veterans_land:0 "Земля ветеранам"
 IVN_wl_veterans_land_desc:0 "Демобилизованные получают участки и ссуды в Ильване и Ольсии. Там, где стояли запасные полки, вырастают мастерские и хутора."
 IVN_wl_army_of_the_west:0 "Армия Запада"
 IVN_wl_army_of_the_west_desc:0 "Арсеналы Старой марки работают и после войны. Республика, которая решила стать гегемоном, должна вооружать свою армию сама."
 IVN_wl_peace_of_the_victors:0 "Мир победителей"
 IVN_wl_peace_of_the_victors_desc:0 "Спор об армии закончен. Теперь у республики есть свой ответ на вопрос, с которым к ней придёт следующий кризис на Западе."
 IVN_wl_hegemony_of_the_marches:0 "Гегемония марок"
 IVN_wl_hegemony_of_the_marches_desc:0 "Маленькая республика марок стала центром Запада. Её флаг висит в столицах, где ещё недавно о ней не слышали, а её законы читают в городах коридора."
 IVN_wl_under_the_hegemon:0 "Под рукой гегемона"
 IVN_wl_under_the_hegemon_desc:0 "Армия марок сложила оружие, а в Старую марку приехали уполномоченные Воркерланда. Итора проиграла войну, но ещё не проиграла себя."
 IVN_wl_hegemon_wrk_tt:0 "Воркерланд победил в войне за Запад"
 IVN_wl_count_the_losses:0 "Счёт потерь"
 IVN_wl_count_the_losses_desc:0 "Правительство публикует списки погибших, пропавших и пленных. Честный счёт горек, но семьи марок хотя бы знают, кого ещё ждать."
 IVN_wl_trust_held_10_tt:0 "Доверие приграничных марок, оставшихся у Иторы: §G+10§!"
 IVN_wl_quiet_resistance:0 "Тихое сопротивление"
 IVN_wl_quiet_resistance_desc:0 "Офицеры уходят в запас, но не в отставку. Склады пустеют на бумаге, а не на деле, и каждый мобилизационный план пишут в двух экземплярах."
 IVN_wl_accommodation:0 "Жить с победителем"
 IVN_wl_accommodation_desc:0 "Правительство говорит маркам правду: Воркерланд пришёл надолго. Лучше торговать с гегемоном и строить, чем ждать войны, которую Итора уже проиграла."
 IVN_wl_hidden_depots:0 "Скрытые склады"
 IVN_wl_hidden_depots_desc:0 "Часть арсеналов не попала в описи комиссии. Винтовки лежат в смазке в подвалах школ и монастырей, пока не понадобятся снова."
 IVN_wl_lost_lands_underground:0 "Подполье потерянных земель"
 IVN_wl_lost_lands_underground_desc:0 "В землях, которые теперь числятся за Воркерландом, остались люди, помнящие республику. Через границу идут связные, а обратно - молодые люди, не желающие служить чужой армии."
 IVN_wl_staff_in_reserve:0 "Штаб в запасе"
 IVN_wl_staff_in_reserve_desc:0 "Распущенный штаб марок продолжает собираться на частных квартирах. Его офицеры разбирают проигранную войну и готовят ту армию, которой у Иторы пока нет."
 IVN_wl_federal_contracts:0 "Федеральные заказы"
 IVN_wl_federal_contracts_desc:0 "Заводам марок предлагают заказы Воркерланда. Республика работает на победителя, но станки, рабочие и умения остаются в Иторе."
 IVN_wl_order_without_commissioners:0 "Порядок без комиссаров"
 IVN_wl_order_without_commissioners_desc:0 "Местные советы марок сами выполняют условия мира, не дожидаясь чужих инспекторов. Гегемон доволен, а марки сохраняют своих чиновников."
 IVN_wl_trust_held_5_tt:0 "Доверие приграничных марок, оставшихся у Иторы: §G+5§!"
 IVN_wl_hegemons_engineers:0 "Инженеры гегемона"
 IVN_wl_hegemons_engineers_desc:0 "Воркерландские инженеры приезжают на заводы марок, а иторские студенты едут в их институты. Победитель учит побеждённого, сам того не желая."
 IVN_wl_rebuild_old_march:0 "Отстроить Старую марку"
 IVN_wl_rebuild_old_march_desc:0 "Столица латает крыши, мосты и цеха. Её восстановление - первое, что Итора после войны делает своими руками и для себя."
 IVN_wl_frontier_refugees:0 "Беженцы приграничья"
 IVN_wl_frontier_refugees_desc:0 "Из потерянных и разорённых марок на юг идут семьи с узлами. Ильван даёт им землю и работу на новых фабриках."
 IVN_wl_university_of_the_marches:0 "Университет марок"
 IVN_wl_university_of_the_marches_desc:0 "В Старой марке открывается университет, где учат инженеров, врачей и учителей. Итора проиграла войну оружием и не собирается проигрывать её знанием."
 IVN_wl_marches_endure:0 "Марки выстояли"
 IVN_wl_marches_endure_desc:0 "Итора живёт под чужой гегемонией, но живёт. Её школы открыты, заводы работают, а память о республике передаётся от отцов к детям."
 IVN_wl_armed_truce:0 "Вооружённое перемирие"
 IVN_wl_armed_truce_desc:0 "Война за Запад кончилась без победителя. Армии стоят там, где их застал срок, и никто не верит, что этот мир продлится долго."
 IVN_wl_truce_tt:0 "Война за Запад закончилась перемирием без победителя"
 IVN_wl_truce_commission:0 "Комиссия по перемирию"
 IVN_wl_truce_commission_desc:0 "Офицеры обеих сторон встречаются на станции в коридоре, чтобы обменять пленных и провести линию разграничения. Каждый километр этой линии стоит часов спора."
 IVN_wl_line_of_the_marches:0 "Линия марок"
 IVN_wl_line_of_the_marches_desc:0 "Штаб предлагает простое решение: если мира нет, нужна стена. Северные марки превращаются в укреплённую полосу, через которую не пройдёт ни один внезапный удар."
 IVN_wl_open_corridor:0 "Открытый коридор"
 IVN_wl_open_corridor_desc:0 "Комитет делает ставку на торговлю. Пока через коридор идут грузы, обеим сторонам есть что терять, и новая война становится слишком дорогой."
 IVN_wl_northern_forts:0 "Северные форты"
 IVN_wl_northern_forts_desc:0 "Над Серенгой, Таларой и Канторией встают бетонные форты. Их строят на века, как будто граница больше никогда не сдвинется."
 IVN_wl_observation_posts:0 "Посты наблюдения"
 IVN_wl_observation_posts_desc:0 "На высотах у Ведрины ставят наблюдательные посты, аэродромы и зенитные батареи. Ни одна колонна по ту сторону линии не пройдёт незамеченной."
 IVN_wl_frontier_reserve:0 "Резерв границы"
 IVN_wl_frontier_reserve_desc:0 "В приграничных городах создают склады и сборные пункты резерва. Если линия загорится, полки поднимутся за сутки."
 IVN_wl_customs_on_the_highway:0 "Таможня на тракте"
 IVN_wl_customs_on_the_highway_desc:0 "У Серенги открывается таможня для товаров коридора. Пошлины пополняют казну, а таможенники знают о соседях больше любой разведки."
 IVN_wl_southern_harbours:0 "Южные гавани"
 IVN_wl_southern_harbours_desc:0 "Пока коридор под прицелом, товары идут морем. Южное взморье строит склады и причалы для торговли с Риматом и дальними берегами."
 IVN_wl_mixed_commissions:0 "Смешанные комиссии"
 IVN_wl_mixed_commissions_desc:0 "Инженеры двух сторон вместе чинят мосты и водопроводы приграничья. Они не договорятся о мире, но договорятся о том, как не дать городам умереть."
 IVN_wl_peace_without_victory:0 "Мир без победы"
 IVN_wl_peace_without_victory_desc:0 "Итора не выиграла войну за Запад, но и не проиграла её. Марки учатся жить на границе, которая в любой день может снова стать фронтом."
 IVN_wl_border_armoured_trains:0 "Пограничные бронепоезда"
 IVN_wl_border_armoured_trains_desc:0 "По рокадной дороге вдоль линии ходят бронепоезда. Они не заменят армию, но позволят быстро перебросить её туда, где начнётся беда."
 IVN_wl_towns_of_the_border:0 "Города границы"
 IVN_wl_towns_of_the_border_desc:0 "Талара и Кантория получают новые фабрики. Граница, на которой живут и работают, держится крепче той, где только стоят солдаты."
 IVN_wl_long_truce:0 "Долгое перемирие"
 IVN_wl_long_truce_desc:0 "Год за годом перемирие продлевают ещё на год. Итора стоит на своей границе, достаточно сильная, чтобы её не трогали, и достаточно спокойная, чтобы не трогать других."
 IVN_cb_partisan_supply:0 "Снабжение подполья"
 IVN_cb_partisan_supply_desc:0 "Связные кабинета везут за линию фронта деньги, листовки и винтовки. Подполье марки получит их ночью, на лесной станции, и спрячет до своего часа."
 IVN_cb_partisan_supply_rifles_tt:0 "На складах есть §Y1800§! £infantry_equipment_texticon для подполья"
 IVN_cb_partisan_supply_tt:0 "Подполье получит §Y1800§! £infantry_equipment_texticon. Через §Y30§! дней доверие марки [FROM.GetName] к столице вырастет на §G+15§!, а её дороги пострадают от диверсий. Если марка до этого уйдёт от легиона или мятеж закончится, цена и винтовки вернутся."
 IVN_cb_sabotage_raid:0 "Налёт диверсантов"
 IVN_cb_sabotage_raid_desc:0 "Группа диверсантов уходит в марку легиона с картами складов и мастерских. К утру там горят цеха, а патрули Сталка обыскивают каждый дом."
 IVN_cb_sabotage_raid_trust_tt:0 "Доверие марки [FROM.GetName] к столице: §R-5§!. В марке §Y30§! дней нельзя проводить другие меры."
 IVN_west_legacy_category:0 "Наследие Запада"
 IVN_west_legacy_category_desc:0 "Война за Запад закончилась. Теперь Итора живёт с её итогом и строит на нём своё будущее."
 IVN_wl_integrate_district:0 "Включить район в республику"
 IVN_wl_integrate_district_desc:0 "Комендатуру сменяет гражданская управа, а в школах района начинают учить законы республики. Через несколько месяцев здесь перестанут говорить о прежних хозяевах."
 IVN_wl_integrate_district_tt:0 "Через §Y120§! дней район [FROM.GetName] станет нашим национальным регионом и получит §Y1§! уровень инфраструктуры. Если к этому времени мы потеряем район, цена вернётся."
 IVN_wl_western_exchange:0 "Научный обмен с соседом"
 IVN_wl_western_exchange_desc:0 "Профессора и инженеры двух республик меняются кафедрами и лабораториями. Дружба, скреплённая общими чертежами, держится дольше договоров."
 IVN_wl_western_exchange_limit_tt:0 "Проведено меньше §Y4§! научных обменов"
 IVN_wl_western_friend_tt:0 "Страна не воюет с нами и склоняется к нам не меньше чем на §Y50§! или состоит с нами в союзе"
 IVN_wl_western_exchange_tt:0 "Через §Y60§! дней мы получим бонус к исследованию промышленности, а [FROM.GetName] - §G+2%§! стабильности. Если страна к тому времени исчезнет или начнёт с нами войну, цена вернётся."
 IVN_wl_veterans_cooperatives:0 "Артели демобилизованных"
 IVN_wl_veterans_cooperatives_desc:0 "Роты, вернувшиеся с войны, не расходятся по домам, а складываются в артели. Им дают ссуду, станки и старый склад у станции."
 IVN_wl_veterans_cooperatives_limit_tt:0 "Создано меньше §Y3§! артелей"
 IVN_wl_veterans_manpower_tt:0 "В резерве есть §Y5000§! £manpower_texticon демобилизованных"
 IVN_wl_veterans_cooperatives_tt:0 "Резерв теряет §Y5000§! £manpower_texticon. Через §Y60§! дней в национальном регионе с местом появится §Y1§! гражданский завод. Если места не останется, вернутся §Y40§! £political_power_texticon и §Y5000§! £manpower_texticon."
 IVN_wl_corridor_garrison:0 "Гарнизон в районе"
 IVN_wl_corridor_garrison_desc:0 "Кадровая рота занимает казармы на окраине и начинает с того, что роет. Через месяц на границе района стоят доты, а в городе знают, кто здесь охраняет порядок."
 IVN_wl_corridor_garrison_rifles_tt:0 "На складах есть §Y1800§! £infantry_equipment_texticon для гарнизона"
 IVN_wl_corridor_garrison_tt:0 "Гарнизон получит §Y1800§! £infantry_equipment_texticon. Через §Y30§! дней на границе района [FROM.GetName] появится §Y1§! уровень укреплений. Если мы потеряем район, вернутся цена и винтовки."
 IVN_wl_lost_march_sabotage:0 "Удар подполья"
 IVN_wl_lost_march_sabotage_desc:0 "Подполье потерянной земли готовит удар по заводам гегемона. Его люди работают в тех же цехах, которые им предстоит остановить."
 IVN_wl_lost_march_sabotage_tt:0 "Через §Y30§! дней заводы в [FROM.GetName] будут повреждены и станут чиниться медленнее, к нам уйдут §Y1500§! £manpower_texticon, а облавы обойдутся нам в §R-2%§! стабильности. Если земля к тому времени уйдёт от Воркерланда, цена вернётся."
 IVN_wl_federal_orders:0 "Заказ гегемона"
 IVN_wl_federal_orders_desc:0 "Воркерланд размещает военный заказ на заводах марок. Платит победитель, но цех, станки и мастера остаются в Иторе."
 IVN_wl_vorkerland_subject_tt:0 "Итора подчинена Воркерланду"
 IVN_wl_federal_orders_limit_tt:0 "Выполнено меньше §Y3§! заказов"
 IVN_wl_federal_orders_tt:0 "Через §Y90§! дней в национальном регионе с местом появится §Y1§! военный завод. Если места не останется, вернутся §Y50§! £political_power_texticon."
 IVN_wl_frontier_alert:0 "Тревога на линии"
 IVN_wl_frontier_alert_desc:0 "По линии разграничения объявлена тревога. Резервисты получают повестки, гарнизоны занимают окопы, а штаб проверяет, сколько часов займёт настоящая мобилизация."

# Five-sided civil war and negotiated reunification.
