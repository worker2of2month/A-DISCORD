l_russian:
 IVN_order_dynamic: "Порядок Иторы"
 IVN_order_dynamic_desc: "Итог реформ Чрезвычайного комитета: больницы, школы марок, армия и подготовка к западному вопросу."
 IVN_committee_report: "Доклад Чрезвычайного комитета"
 IVN_committee_report_desc: "Комитет Иторы собрал отчёты всех марок. Республика знает, сколько у неё больниц, складов и солдат, - и сколько ей не хватает."
 IVN_hospital_registers: "Реестры больниц"
 IVN_hospital_registers_desc: "Каждая марка получает список больниц и убежищ, за которые отвечает перед комитетом."
 IVN_school_of_the_marches: "Школы марок"
 IVN_school_of_the_marches_desc: "Приграничные школы готовят инженеров, врачей и связистов для всей республики."
 IVN_social_insurance_offices: "Конторы социального страхования"
 IVN_social_insurance_offices_desc: "Страхование, введённое после распада Воркерланда, становится государственной службой с собственными конторами."
 IVN_committee_mandate: "Мандат комитета"
 IVN_committee_mandate_desc: "Комитет получает от марок мандат на решение западного вопроса. Осталось выбрать, каким будет ответ."
 IVN_humanist_shield: "Гуманистический щит"
 IVN_humanist_shield_desc: "Итора будет защищать людей, а не линии на карте. Её союзниками станут свободные республики Запада."
 IVN_emergency_order: "Чрезвычайный порядок"
 IVN_emergency_order_desc: "Комитет приостанавливает выборы и переводит марки на военное положение. Итора больше не ждёт, пока Запад решат за неё."
 IVN_shield_league_of_republics: "Лига свободных республик"
 IVN_shield_league_of_republics_desc: "Итора приглашает Римат и свободные республики в общий оборонительный союз."
 IVN_shield_territorial_defence: "Территориальная оборона"
 IVN_shield_territorial_defence_desc: "Приграничье у северного коридора получает укреплённые рубежи."
 IVN_shield_red_cross_corridors: "Коридоры милосердия"
 IVN_shield_red_cross_corridors_desc: "Беженцы из Воркерланда получают защищённые дороги. Многие из них остаются служить Иторе."
 IVN_shield_marches_militia: "Ополчение марок"
 IVN_shield_marches_militia_desc: "Каждая марка выставляет обученное ополчение для обороны собственной земли."
 IVN_shield_over_the_west: "Щит над Западом"
 IVN_shield_over_the_west_desc: "Итора требует от Воркерланда гарантий для коридора и свободных республик. Отказ будет означать войну."
 IVN_emergency_war_ministry: "Военное министерство"
 IVN_emergency_war_ministry_desc: "Генеральный штаб марок становится министерством с правом прямых приказов."
 IVN_emergency_requisitions: "Чрезвычайные реквизиции"
 IVN_emergency_requisitions_desc: "Фабрики марок переходят на военные заказы без согласования с советами."
 IVN_emergency_corridor_claims: "Претензии на коридор"
 IVN_emergency_corridor_claims_desc: "Комитет объявляет северный коридор естественной границей Иторы."
 IVN_emergency_general_levy: "Всеобщий призыв"
 IVN_emergency_general_levy_desc: "Чрезвычайный порядок требует, чтобы каждая марка выставила полный контингент."
 IVN_emergency_march_west: "Поход на запад"
 IVN_emergency_march_west_desc: "Итора нанесёт удар первой, пока объединённый Воркерланд не собрал силы."
 IVN_west_heritage: "Наследие Запада"
 IVN_west_heritage_desc: "Война окончена. Итора должна превратить победу в устройство всего Запада."
 IVN_march_reconstruction: "Восстановление Старой марки"
 IVN_march_reconstruction_desc: "Столичная марка получает новые мастерские и склады."
 IVN_upper_march_mines: "Рудники Верхней марки"
 IVN_upper_march_mines_desc: "Старые рудники Верхней марки снова дают сталь."
 IVN_old_march_railways: "Железные дороги марок"
 IVN_old_march_railways_desc: "Дороги между марками перестраиваются под военные перевозки."
 IVN_war_industry_plan: "План военной промышленности"
 IVN_war_industry_plan_desc: "Комитет утверждает план военных заводов в Старой и Верхней марках."
 IVN_frontier_fortifications: "Пограничные укрепления"
 IVN_frontier_fortifications_desc: "Восточная марка и приграничье получают укреплённые рубежи."
 IVN_coastal_dockyards: "Прибрежные верфи"
 IVN_coastal_dockyards_desc: "Порт Старой марки получает верфь для защиты островного управления."
 IVN_research_council: "Научный совет"
 IVN_research_council_desc: "Инженеры, врачи и связисты марок объединяются в единый научный совет."
 IVN_marches_general_staff: "Генеральный штаб марок"
 IVN_marches_general_staff_desc: "Гарнизоны марок получают общий штаб и единые планы обороны."
 IVN_mountain_rangers: "Горные стрелки"
 IVN_mountain_rangers_desc: "Нагорья Иторы - лучший учитель для пехоты, которой предстоит воевать в коридоре."
 IVN_citizen_reserve: "Гражданский резерв"
 IVN_citizen_reserve_desc: "Каждый гражданин, прошедший обучение, остаётся в резерве своей марки."
 IVN_northern_corps: "Северный корпус"
 IVN_northern_corps_desc: "Лучшие части марок сводятся в корпус для действий на севере."
 IVN_air_cover_of_the_marches: "Воздушное прикрытие марок"
 IVN_air_cover_of_the_marches_desc: "Старая марка получает аэродромы и школу пилотов."
 IVN_coastal_flotilla: "Прибрежная флотилия"
 IVN_coastal_flotilla_desc: "Флотилия охраняет связь с островным управлением."
 IVN_west_war_council: "Военный совет Запада"
 IVN_west_war_council_desc: "Комитет создаёт военный совет для войны за Запад."
 IVN_west_counterstroke: "Контрудар"
 IVN_west_counterstroke_desc: "Резервы марок готовы встретить наступление Воркерланда контрударом."
 IVN_watch_the_unity_tower: "Наблюдать за Башней Единства"
 IVN_watch_the_unity_tower_desc: "Разведка комитета следит за столицей Воркерланда. Если Башня падёт, Итора должна узнать первой."
 IVN_northern_expedition_plan: "План северной экспедиции"
 IVN_northern_expedition_plan_desc: "Генеральный штаб готовит запасы для возможной интервенции на север."
 IVN_norvane_mandate: "Норвейнский мандат"
 IVN_norvane_mandate_desc: "Норвейн и Крайт стали клиентами Иторы. Комитет вооружает их для будущих испытаний."
 IVN_lessons_of_the_retreat: "Уроки отступления"
 IVN_lessons_of_the_retreat_desc: "Провал интервенции научил армию больше, чем любая победа."
 IVN_west_question: "Западный вопрос"
 IVN_west_question_desc: "Воркерланд снова един. Итора должна решить, как она встретит его возвращение."
 IVN_humanist_shield_tt: "Итора выбирает §Yгуманистический щит§!: оборону свободных республик и коридора. В войне за Запад Воркерланд при победе Иторы станет конфедерацией под её гарантией."
 IVN_emergency_order_tt: "Выборы приостановлены, правительство переходит к этатистам. В войне за Запад Воркерланд при победе Иторы перейдёт под её чрезвычайную опеку."
 IVN_shield_league_of_republics_tt: "Итора возглавляет §YЛигу свободных республик§! и приглашает в неё Римат, Фреалор и Золоторевск. Каждый вступивший добавляет §Y10§! к западному счёту.\nЗападный счёт: §Y+10§!."
 IVN_shield_over_the_west_tt: "Начинается §Yвойна за Запад§! против Воркерланда."
 IVN_emergency_march_west_tt: "Начинается §Yвойна за Запад§! против Воркерланда."
 IVN_west_crisis_add_tt: "Западный счёт: §Y+10§!."
 IVN_west_final_ready_tt: "Воркерланд объединён, западный вопрос открыт, интервенция Иторы завершена и война за Запад ещё не начата"
 IVN_west_question_open_tt: "Западный вопрос открыт или идёт война за Запад"
 IVN_west_wrk_reunified_tt: "Один из претендентов объединил Воркерланд"
