l_russian:
 IVN_order_dynamic: "Порядок Иторы"
 IVN_order_dynamic_desc: "Итог реформ Чрезвычайного комитета: больницы, школы марок, армия и подготовка к западному вопросу."
 IVN_committee_report: "Доклад Чрезвычайного комитета"
 IVN_committee_report_desc: "Комитет Иторы собрал отчёты всех марок. Республика знает, сколько у неё больниц, складов и солдат, - и сколько ей не хватает."
 IVN_hospital_registers: "Реестры больниц"
 IVN_hospital_registers_desc: "Каждая марка получает список больниц и убежищ, за которые отвечает перед комитетом."
 IVN_school_of_the_marches: "Школы марок"
 IVN_school_of_the_marches_desc: "Приграничные школы готовят инженеров, врачей и связистов для всей республики."
 IVN_social_insurance_offices: "Конторы социального страхования"
 IVN_social_insurance_offices_desc: "Страхование, введённое после распада Воркерланда, становится государственной службой с собственными конторами."
 IVN_committee_mandate: "Мандат комитета"
 IVN_committee_mandate_desc: "Комитет получает от марок мандат на решение западного вопроса. Осталось выбрать, каким будет ответ."
 IVN_humanist_shield: "Гуманистический щит"
 IVN_humanist_shield_desc: "Итора будет защищать людей, а не линии на карте. Её союзниками станут свободные республики Запада, а помощь беженцам и соседям станет главным доводом комитета."
 IVN_emergency_order: "Чрезвычайный порядок"
 IVN_emergency_order_desc: "Комитет приостанавливает выборы и переводит марки на военное положение. Итора больше не ждёт, пока Запад решат за неё, и говорит с соседями языком силы."
 IVN_shield_league_of_republics: "Лига свободных республик"
 IVN_shield_league_of_republics_desc: "Итора открывает двери Лиги свободных республик для каждого соседа, который готов стоять с ней. Приглашение получает тот, кто уже склоняется к Иторе."
 IVN_shield_territorial_defence: "Территориальная оборона"
 IVN_shield_territorial_defence_desc: "Приграничье у северного коридора получает укреплённые рубежи."
 IVN_shield_red_cross_corridors: "Коридоры милосердия"
 IVN_shield_red_cross_corridors_desc: "Беженцы из Воркерланда получают защищённые дороги. Многие остаются служить Иторе, а гуманитарные конвои марок готовы идти к соседям."
 IVN_shield_marches_militia: "Ополчение марок"
 IVN_shield_marches_militia_desc: "Каждая марка выставляет обученное ополчение для обороны собственной земли."
 IVN_shield_over_the_west: "Щит над Западом"
 IVN_shield_over_the_west_desc: "Итора требует от Воркерланда гарантий для коридора и свободных республик. Отказ будет означать войну."
 IVN_emergency_war_ministry: "Военное министерство"
 IVN_emergency_war_ministry_desc: "Генеральный штаб марок становится министерством с правом прямых приказов."
 IVN_emergency_requisitions: "Чрезвычайные реквизиции"
 IVN_emergency_requisitions_desc: "Фабрики марок переходят на военные заказы без согласования с советами."
 IVN_emergency_corridor_claims: "Претензии на коридор"
 IVN_emergency_corridor_claims_desc: "Комитет объявляет северный коридор естественной границей Иторы."
 IVN_emergency_general_levy: "Всеобщий призыв"
 IVN_emergency_general_levy_desc: "Чрезвычайный порядок требует, чтобы каждая марка выставила полный контингент."
 IVN_emergency_march_west: "Поход на запад"
 IVN_emergency_march_west_desc: "Итора нанесёт удар первой, пока объединённый Воркерланд не собрал силы."
 IVN_west_heritage: "Наследие Запада"
 IVN_west_heritage_desc: "Война окончена. Итора должна превратить победу в устройство всего Запада."
 IVN_march_reconstruction: "Восстановление Старой марки"
 IVN_march_reconstruction_desc: "Столичная марка получает новые мастерские и склады, а комитет утверждает программу строительства по всем маркам."
 IVN_upper_march_mines: "Рудники Верхней марки"
 IVN_upper_march_mines_desc: "Старые рудники Верхней марки снова дают сталь."
 IVN_old_march_railways: "Железные дороги марок"
 IVN_old_march_railways_desc: "Дороги между марками перестраиваются под военные перевозки."
 IVN_war_industry_plan: "План военной промышленности"
 IVN_war_industry_plan_desc: "Комитет утверждает план военных заводов в Старой и Верхней марках."
 IVN_frontier_fortifications: "Пограничные укрепления"
 IVN_frontier_fortifications_desc: "Восточная марка и приграничье получают укреплённые рубежи."
 IVN_coastal_dockyards: "Прибрежные верфи"
 IVN_coastal_dockyards_desc: "Порт Старой марки получает верфь для защиты островного управления."
 IVN_research_council: "Научный совет"
 IVN_research_council_desc: "Инженеры, врачи и связисты марок объединяются в единый научный совет."
 IVN_marches_general_staff: "Генеральный штаб марок"
 IVN_marches_general_staff_desc: "Гарнизоны марок получают общий штаб и единые планы обороны."
 IVN_mountain_rangers: "Горные стрелки"
 IVN_mountain_rangers_desc: "Нагорья Иторы - лучший учитель для пехоты, которой предстоит воевать в коридоре."
 IVN_citizen_reserve: "Гражданский резерв"
 IVN_citizen_reserve_desc: "Каждый гражданин, прошедший обучение, остаётся в резерве своей марки. В нужный момент комитет может призвать резерв целиком."
 IVN_northern_corps: "Северный корпус"
 IVN_northern_corps_desc: "Лучшие части марок сводятся в корпус для действий на севере."
 IVN_air_cover_of_the_marches: "Воздушное прикрытие марок"
 IVN_air_cover_of_the_marches_desc: "Старая марка получает аэродромы и школу пилотов."
 IVN_coastal_flotilla: "Прибрежная флотилия"
 IVN_coastal_flotilla_desc: "Флотилия охраняет связь с островным управлением."
 IVN_west_war_council: "Военный совет Запада"
 IVN_west_war_council_desc: "Комитет создаёт военный совет для войны за Запад."
 IVN_west_counterstroke: "Контрудар"
 IVN_west_counterstroke_desc: "Резервы марок готовы встретить наступление Воркерланда контрударом."
 IVN_watch_the_unity_tower: "Наблюдать за Башней Единства"
 IVN_watch_the_unity_tower_desc: "Разведка комитета следит за столицей Воркерланда. Если Башня падёт, Итора должна узнать первой."
 IVN_northern_expedition_plan: "План северной экспедиции"
 IVN_northern_expedition_plan_desc: "Генеральный штаб готовит запасы для возможной интервенции на север."
 IVN_norvane_mandate: "Норвейнский мандат"
 IVN_norvane_mandate_desc: "Норвейн и Крайт стали клиентами Иторы. Комитет вооружает их и закрепляет союз, начатый интервенцией."
 IVN_lessons_of_the_retreat: "Уроки отступления"
 IVN_lessons_of_the_retreat_desc: "Провал интервенции научил армию больше, чем любая победа."
 IVN_west_question: "Западный вопрос"
 IVN_west_question_desc: "Воркерланд снова един. Итора должна решить, как она встретит его возвращение."
 IVN_humanist_shield_tt: "Итора выбирает §Yгуманистический щит§!: оборону свободных республик и коридора. В войне за Запад Воркерланд при победе Иторы станет конфедерацией под её гарантией."
 IVN_emergency_order_tt: "Выборы приостановлены, правительство переходит к этатистам. В войне за Запад Воркерланд при победе Иторы перейдёт под её чрезвычайную опеку."
 IVN_shield_over_the_west_tt: "Начинается §Yвойна за Запад§! против Воркерланда."
 IVN_emergency_march_west_tt: "Начинается §Yвойна за Запад§! против Воркерланда."
 IVN_west_crisis_add_tt: "Западный счёт: §Y+10§!."
 IVN_west_final_ready_tt: "Воркерланд объединён, западный вопрос открыт, интервенция Иторы завершена и война за Запад ещё не начата"
 IVN_west_question_open_tt: "Западный вопрос открыт или идёт война за Запад"
 IVN_west_wrk_reunified_tt: "Один из претендентов объединил Воркерланд"
 IVN_west_reconstruction_ready_tt:0 "После объединения Воркерланда прошло не менее 180 дней"

# Courses, programmes and the western states
 IVN_emergency_protectorates:0 "Протектораты марок"
 IVN_emergency_protectorates_desc:0 "Чрезвычайный комитет объявляет приграничных соседей зоной ответственности Иторы. Кто не хочет протектората, получит ультиматум."
 IVN_march_fair:0 "Ярмарка марок"
 IVN_march_fair_desc:0 "Последние средства плана уходят на гражданские фабрики Восточной марки. Республика будет богаче, чем её противник."
 IVN_arms_contracts:0 "Оружейные подряды"
 IVN_arms_contracts_desc:0 "Последние средства плана уходят на оружейные заводы Верхней марки. Республика будет вооружена лучше, чем её противник."
 IVN_marches_planning_board:0 "Плановое бюро марок"
 IVN_marches_planning_board_desc:0 "Заводы, рудники и мастерские марок получают общее бюро заказов и стандарты."
 IVN_norvane_mandate_tt:0 "Склонность [IBA.GetName] и [IBL.GetName] сдвигается к Иторе на §Y20§!."
 IVN_envoys_to_the_districts:0 "Посланники в округа"
 IVN_envoys_to_the_districts_desc:0 "Бывшие административные округа Воркерланда держат коридор. Комитет отправляет к ним посланников раньше, чем туда придут имперские комиссары."
 IVN_envoys_to_the_districts_tt:0 "Склонность [PWR.GetName], [PSD.GetName] и [ZAO.GetName] сдвигается к Иторе на §Y15§!."
 IVN_old_friends_of_rimat:0 "Старые друзья Римата"
 IVN_old_friends_of_rimat_desc:0 "Римат помнит гарантии Иторы, а Фреалор и Золоторевск - её госпитали. Комитет напоминает им об этом."
 IVN_old_friends_of_rimat_tt:0 "Склонность [WIT.GetName] сдвигается к Иторе на §Y20§!, [ROM.GetName] и [TRU.GetName] - на §Y10§!."
 IVN_western_press_bureau:0 "Западное бюро печати"
 IVN_western_press_bureau_desc:0 "Газеты и радио марок вещают на весь Запад. Каждое посольство и каждый договор Иторы теперь сопровождает её собственный голос."
 IVN_influence_power_5_tt:0 "Сила нашего влияния на Западе: §Y+5§!."
 IVN_influence_power_10_tt:0 "Сила нашего влияния на Западе: §Y+10§!."
 IVN_marches_category:0 "Марки Иторы"
 IVN_marches_category_desc:0 "Программы комитета по строительству и резерву марок."
 IVN_march_workshops:0 "Мастерские марок"
 IVN_march_workshops_desc:0 "Комитет оплачивает строительство мастерских в одной из марок. Работы занимают два месяца."
 IVN_march_workshops_tt:0 "Через §Y60§! дней в национальном регионе с местом появится §Y1§! гражданский завод. Если места не останется, программа вернёт §Y50§! £political_power_texticon."
 IVN_march_workshops_limit_tt:0 "Программа выполнена меньше §Y3§! раз"
 IVN_march_workshops_site_tt:0 "Есть контролируемый национальный регион с местом для гражданского завода"
 IVN_reserve_call_up:0 "Сбор гражданского резерва"
 IVN_reserve_call_up_desc:0 "Резервисты марок проходят сборы и возвращаются в строй. Через полтора месяца армия получит обученное пополнение."

# Revolt of the marches and revanche
 IVC:0 "Иторский легион освобождения"
 IVC_DEF:0 "Иторский легион освобождения"
 IVC_ADJ:0 "Легионерск."
 IVC_chauvinism_party:0 "£GFX_generic_chauvinism_national_front_party_texticon Иторский Патриотический Союз"
 IVC_chauvinism_party_long:0 "£GFX_generic_chauvinism_national_front_party_texticon Иторский Патриотический Союз"
 IVN_northern_question_settled_tt:0 "Северная экспедиция завершена или больше не может начаться"
 IVN_expedition_not_failed_tt:0 "Северная экспедиция не закончилась провалом, или кабинет вернул власть Комитету"
 IVN_expedition_not_won_tt:0 "Северная экспедиция не завершилась победой"
 IVN_revolt_over_tt:0 "Мятеж марок не идёт"
 IVN_cabinet_survived_tt:0 "После провала экспедиции чрезвычайный кабинет подавил мятеж марок"
 IVN_revanche_of_the_marches:0 "Реванш марок"
 IVN_revanche_of_the_marches_desc:0 "Легион взял столицу, а Иторский Патриотический Союз - власть. Позор северной экспедиции не будет забыт: марки вернут себе север и заставят Воркерланд заплатить за отступление."
 IVN_revanche_of_the_marches_tt:0 "Итора выбирает §Yреванш§!. В войне за Запад армия получит дух §YЛегион марок§!, а побеждённые будут присоединены к Иторе."
 IVN_revanche_legion_veterans:0 "Ветераны легиона"
 IVN_revanche_legion_veterans_desc:0 "Солдаты мятежа становятся кадровым ядром новой армии. Они уже воевали против своих и не дрогнут перед Воркерландом."
 IVN_revanche_iron_protectorate:0 "Железный протекторат"
 IVN_revanche_iron_protectorate_desc:0 "Соседи узнают, что новая Итора не просит союзников, а назначает их. Кто не примет протекторат, получит ультиматум."
 IVN_revanche_arsenals:0 "Арсеналы реванша"
 IVN_revanche_arsenals_desc:0 "Верхняя марка переходит на военное производство. Каждый завод работает на будущий поход."
 IVN_revanche_corridor_by_force:0 "Коридор силой"
 IVN_revanche_corridor_by_force_desc:0 "Северный коридор объявлен землёй марок. Его жители могут выбрать сторону, пока Итора ещё спрашивает."
 IVN_revanche_march_on_vorkerland:0 "Поход на Воркерланд"
 IVN_revanche_march_on_vorkerland_desc:0 "Легион идёт туда, откуда отступила экспедиция. На этот раз марки не остановятся у коридора."
 IVN_revanche_march_on_vorkerland_tt:0 "Начинается §Yвойна за Запад§! против Воркерланда."
 ADISCORD_ivn.2.t:0 "Пять знамён над Иторой"
 ADISCORD_ivn.2.d:0 "Северная экспедиция вернулась без победы. Пока чрезвычайный кабинет закрывал газеты и созывал резервы, приграничные полки отказались складывать оружие. В Ведрине, Серенге, Таларе и Кантории Леонид Сталк объявил о создании Иторского легиона освобождения. Он обвиняет Комитет в гибели солдат и требует новой власти.\n\nВадим возглавил Чрезвычайный комитет Иторы. Но у восстания нет единого штаба: Ростислав Карн собирает Военную директорию в Северной марке, Ильван и Ольсия провозглашают Союз свободных общин, а восточные администрации создают Совет автономных марок. Генерал требует подчинения армии, общины защищают выборные советы, управленцы - самостоятельность своих земель.\n\nКомитет требует верности столице. Легион зовёт к её освобождению. Между их линиями ещё проходят посланники, но пять правительств уже раздают оружие. Итора вступает в гражданскую войну."
 ADISCORD_ivn.2.a:0 "Остаться с Вадимом и Комитетом."
 ADISCORD_ivn.2.a_tt:0 "Мы возглавим §YЧрезвычайный комитет Иторы§!. Начнётся гражданская война пяти сторон."
 ADISCORD_ivn.2.b:0 "Повести Легион освобождения за Сталком."
 ADISCORD_ivn.2.b_tt:0 "Мы возглавим §YИторский легион освобождения§! Леонида Сталка. Начнётся гражданская война пяти сторон."
 ADISCORD_ivn.3.t:0 "Гражданская война в Иторе"
 ADISCORD_ivn.3.d:0 "Возвращение разбитой северной экспедиции раскололо Итору. Вадим удерживает столицу от имени Чрезвычайного комитета, а Леонид Сталк ведёт Иторский легион освобождения из Ведрины. Северный штаб Ростислава Карна, свободные общины Ильвана и Ольсии и Совет автономных марок объявили собственные правительства.\n\nНикто не признаёт права остальных говорить от имени всей страны. На дорогах появляются новые заставы, гарнизоны делят склады и семьи провожают солдат под разными знамёнами. Пока армии занимают позиции, посланники ищут тех, с кем ещё можно договориться."
 ADISCORD_ivn.3.a:0 "Марки против столицы."
 ADISCORD_ivn.4.t:0 "Комитет вновь объединяет Итору"
 ADISCORD_ivn.4.d:0 "Последний самостоятельный противник Чрезвычайного комитета прекратил борьбу. Вадим объявляет Итору единой, а верные столице части возвращаются в свои марки. За военными сводками следуют списки пропавших, разрушенных мастерских и дорог, которые предстоит восстановить.\n\nПобеда не отменяет заключённых соглашений. Представители примирившихся сторон прибывают в столицу с подписанными гарантиями, и Комитету предстоит доказать, что его обещания переживут чрезвычайное положение."
 ADISCORD_ivn.4.a:0 "Порядок восстановлен."
 ADISCORD_ivn.5.t:0 "Провозглашение Вечного Империума"
 ADISCORD_ivn.5.d:0 "Чрезвычайный комитет пал, а оставшиеся самостоятельные правительства марок прекратили борьбу. Леонид Сталк принимает власть в объединённой Иторе от имени Легиона освобождения и провозглашает Вечный Империум. Ветераны проходят по столице; за ними возвращаются жители, покинувшие город во время боёв.\n\nНовое правительство обещает вернуть стране достоинство после северной катастрофы. Но теперь перед ним стоят не только военные задачи: восстановление марок, судьба побеждённых и исполнение договоров с теми, кто согласился сложить оружие."
 ADISCORD_ivn.5.a:0 "Марки требуют реванша."

 IVC_humanism_party: "£GFX_IVN_roar_of_freedom_party_texticon Рёв свободы"
 IVC_humanism_party_long: "£GFX_IVN_roar_of_freedom_party_texticon Рёв свободы"
 IVC_utilitarism_party: "£GFX_generic_utilitarism_planning_party_texticon Комитет Спасения Иторы"
