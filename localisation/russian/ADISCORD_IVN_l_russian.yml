 IVN_Commune_Council:0 "Совет делегатов общин"
 IVN_Marches_Council:0 "Совет марочных управленцев"
 IMD:0 "Военная директория марок"
 IMD_DEF:0 "Военная директория марок"
 IMD_ADJ:0 "Директорск."
 IFC:0 "Союз свободных общин"
