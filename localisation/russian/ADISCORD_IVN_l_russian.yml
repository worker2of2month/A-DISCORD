 IFC_ADJ:0 "Общинн."
 IAM:0 "Совет автономных марок"
 IAM_DEF:0 "Совет автономных марок"
 IAM_ADJ:0 "Марочн."
 IMD_etatism_party:0 "Военный штаб марок"
 IFC_anarchism_party:0 "Совет свободных общин"
 IAM_pragmatism_party:0 "Союз марочных управленцев"
 IVN_cw_committee:0 "Чрезвычайный комитет Иторы"
 IVN_cw_committee_DEF:0 "Чрезвычайный комитет Иторы"
 IVN_cw_committee_ADJ:0 "Иторск."
 IVN_unified_legion:0 "Вечный Империум"
 IVN_unified_directory:0 "Иторская военная директория"
 IVN_unified_communes:0 "Федерация иторских общин"
 IVN_unified_marches:0 "Содружество иторских марок"
 ADISCORD_ivn.2.c:0 "Встать под знамя Карна."
 ADISCORD_ivn.2.e:0 "За свободные общины!"
 ADISCORD_ivn.2.f:0 "Марки сами определят свою судьбу."
 ADISCORD_ivn.2.c_tt:0 "Мы возглавим §YВоенную директорию марок§! Ростислава Карна. Начнётся гражданская война пяти сторон."
 ADISCORD_ivn.2.e_tt:0 "Мы возглавим §YСоюз свободных общин§!. Начнётся гражданская война пяти сторон."
 ADISCORD_ivn.2.f_tt:0 "Мы возглавим §YСовет автономных марок§!. Начнётся гражданская война пяти сторон."
 IVN_cw_diplomacy_category:0 "Гражданская война в Иторе"
 IVN_cw_diplomacy_category_desc:0 "Пять правительств оспаривают будущее Иторы. Комитет и Легион освобождения требуют единства страны; Директория, общины и автономные марки могут признать их власть по договору. Договорное объединение сохраняет войска и вводит постоянные гарантии. Разгром одного участника не завершает войну: объединение наступает после исчезновения всех остальных независимых претендентов."
 IVN_cw_send_offer:0 "Предложить объединение: [FROM.GetName]"
 IVN_cw_send_offer_desc:0 "Посланники пересекают линию фронта с проектом общего правительства. Признание центральной власти должно опираться на обещания, которые переживут саму войну."
 IVN_cw_offer_price_tt:0 "В распоряжении есть §Y75§! £political_power_texticon для принятого договора"
 IVN_cw_offer_ready_tt:0 "Делегация готова к новым переговорам"
 IVN_cw_offer_terms_tt:0 "[FROM.GetName] получит предложение добровольного объединения. Только при согласии будет списано §Y75§! £political_power_texticon. Его территория, армия, запасы и казна перейдут нам; обязательства по договору сохранятся после войны. Незавершённые оплаченные программы закрываются с возвратом вложений в объединённую страну. На ответ отводится §Y7 дней§!; отказ и истечение срока не требуют оплаты."
 IVN_cw_accept_offer_tt:0 "Мы признаем общее командование [FROM.GetName]. Страна и её войска объединятся с инициатором договора, который оплатит §Y75§! £political_power_texticon и сохранит наши гарантии. При игре за эту сторону управление перейдёт объединённой стране. Неисполненные оплаченные программы закрываются с возвратом вложений."
 IVN_cw_emergency_arms:0 "Открыть местные оружейные склады"
 IVN_cw_emergency_arms_desc:0 "В мастерских ещё остались исправные винтовки, а в городах - люди, готовые защищать свой дом. Командование собирает их под одним знаменем."
 IVN_cw_military_guarantees:0 "Представительство военного штаба"
 IVN_cw_military_guarantees_desc:0 "Карн признал общее командование в обмен на постоянное участие офицерского корпуса в управлении страной."
 IVN_cw_communal_guarantees:0 "Гарантии свободных общин"
 IVN_cw_communal_guarantees_desc:0 "Общины сохраняют выборные советы и право участвовать в решениях о мобилизации своих жителей."
 IVN_cw_regional_guarantees:0 "Хартия автономных марок"
 IVN_cw_regional_guarantees_desc:0 "Марки признали единую страну, сохранив собственные администрации и оговорённую долю местных доходов."
 ADISCORD_ivn.11.t:0 "Предложение общего правительства"
 ADISCORD_ivn.11.d:0 "Делегация [FROM.GetName] прибыла под белым флагом. Посланники предлагают прекратить междоусобицу, объединить войска и признать единое правительство. Они готовы закрепить права наших представителей в соглашении, которое останется в силе и после войны.\n\nДля военных речь идёт о месте штаба в управлении страной, для общин - о выборных советах и участии в решениях о призыве, для марок - о собственной администрации и местных доходах. За дверью спорят командиры. Одни видят в договоре спасение, другие - отказ от дела, ради которого подняли оружие."
 ADISCORD_ivn.11.a:0 "Мы продолжим борьбу самостоятельно."
 ADISCORD_ivn.11.b:0 "Признать общее правительство на этих условиях."
 ADISCORD_ivn.12.t:0 "Итора вновь объединена"
 ADISCORD_ivn.12.d:0 "Последнее независимое военное правительство Иторы прекратило существование. [IVN.GetLeader] объявляет о восстановлении единой страны. На дорогах снимают блокпосты, в столице собирают представителей марок, а пережившие войну части получают общие приказы.\n\nИтог борьбы определили не только сражения. Заключённые в годы междоусобицы соглашения входят в устройство нового государства. Семьи ищут пропавших, мастерские возвращаются к работе, и Иторе ещё предстоит научиться жить с памятью о пяти знамёнах."
 ADISCORD_ivn.12.a:0 "Начинается другая Итора."
