l_russian:
 autonomy_STP_provisional_administration:0 "Стеландская временная администрация"

 STP_pc_heg_administrations:0 "Администрации гегемонии"
 STP_pc_heg_administrations_desc:0 "Гегемонии недостаточно оккупационных карт. Побеждённые правительства можно преобразовать во временные администрации, а территории под прямым контролем Стеланда национализировать через уже существующую региональную программу."
 STP_pc_heg_final_north:0 "Сломать северное кольцо"
 STP_pc_heg_final_north_desc:0 "Независимые центры силы на севере несовместимы с претензией Стеланда на региональное первенство. Нодрул, Юбор и Фронтир войдут в новый порядок силой, если не подчинились раньше."
 STP_pc_heg_final_kefreyt:0 "Последний контракт"
 STP_pc_heg_final_kefreyt_desc:0 "После завершения северной кампании только Кефрейт способен оспаривать стеландскую региональную систему. Вторая и последняя война определит, кто устанавливает правила."

 STP_heg_nationalisation_unlock_tt:0 "Путь гегемонии получает доступ к уже существующей повторяемой национализации регионов."
 STP_heg_administration_unlock_tt:0 "Открывает временные администрации для побеждённых §YНодрула§!, §YЮбора§!, §YФронтира§! и §YКефрейта§!. Каждую администрацию затем можно аннексировать отдельным решением за 90 дней."
 STP_heg_northern_war_tt:0 "Начинает финальную северную войну против независимых §YНодрула§!, §YЮбора§! и §YФронтира§!. Уже подчинённые Стеланду правительства повторно не атакуются."
 STP_heg_northern_resolved_tt:0 "Северная кампания начата, и Стеланд больше не воюет с Нодрулом, Юбором или Фронтиром."
 STP_heg_kefreyt_war_tt:0 "Начинает вторую финальную войну против независимого §YКефрейта§!."
 STP_heg_annex_complete_tt:0 "Временная администрация распущена, а её территория включена в состав Стеланда."

 STP_hegemony_administration:0 "Управление гегемонии"
 STP_hegemony_administration_desc:0 "Гегемония может сохранить побеждённое государство как временную администрацию, а затем оставить его зависимым или полностью поглотить."

 STP_heg_establish_nod_administration:0 "Создать временную администрацию Нодрула"
 STP_heg_establish_nod_administration_desc:0 "Заменить побеждённое правительство Нодрула временной администрацией, подчинённой Стеланду."
 STP_heg_annex_nod_administration:0 "Аннексировать администрацию Нодрула"
 STP_heg_annex_nod_administration_desc:0 "Начать 90-дневную интеграцию временной администрации Нодрула."

 STP_heg_establish_ypr_administration:0 "Создать временную администрацию Юбора"
 STP_heg_establish_ypr_administration_desc:0 "Заменить побеждённое правительство Юбора временной администрацией, подчинённой Стеланду."
 STP_heg_annex_ypr_administration:0 "Аннексировать администрацию Юбора"
 STP_heg_annex_ypr_administration_desc:0 "Начать 90-дневную интеграцию временной администрации Юбора."

 STP_heg_establish_tff_administration:0 "Создать временную администрацию Фронтира"
 STP_heg_establish_tff_administration_desc:0 "Заменить побеждённое правительство Фронтира временной администрацией, подчинённой Стеланду."
 STP_heg_annex_tff_administration:0 "Аннексировать администрацию Фронтира"
 STP_heg_annex_tff_administration_desc:0 "Начать 90-дневную интеграцию временной администрации Фронтира."

 STP_heg_establish_val_administration:0 "Создать временную администрацию Кефрейта"
 STP_heg_establish_val_administration_desc:0 "Заменить побеждённое правительство Кефрейта временной администрацией, подчинённой Стеланду."
 STP_heg_annex_val_administration:0 "Аннексировать администрацию Кефрейта"
 STP_heg_annex_val_administration_desc:0 "Начать 90-дневную интеграцию временной администрации Кефрейта."
