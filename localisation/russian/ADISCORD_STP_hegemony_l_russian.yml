l_russian:
 autonomy_STP_provisional_administration:0 "Стеландская временная администрация"

 STP_pc_heg_administrations:0 "Администрации гегемонии"
 STP_pc_heg_administrations_desc:0 "Гегемонии недостаточно оккупационных карт. Побеждённые правительства можно преобразовать во временные администрации, сохранив их собственные территории. Для земель, непосредственно принадлежащих Стеланду, открывается отдельная программа национализации соседних регионов. Если она уже открыта через «Единое гражданство», её условия и стоимость сохраняются."
 STP_pc_heg_final_north:0 "Сломать северное кольцо"
 STP_pc_heg_final_north_desc:0 "Независимые центры силы на севере несовместимы с претензией Стеланда на региональное первенство. Нодрул, Юбор и Фронтир войдут в новый порядок силой, если не подчинились раньше."
 STP_pc_heg_final_kefreyt:0 "Последний контракт"
 STP_pc_heg_final_kefreyt_desc:0 "После завершения северной кампании независимый Кефрейт ещё может оспаривать стеландскую региональную систему. Последний контракт означает войну за его подчинение, если этот вопрос не решён предыдущей кампанией. Уже подчинённый Кефрейт повторно не атакуется; ограниченный мир, сохранивший его независимость, не завершает борьбу за гегемонию."

 STP_heg_nationalisation_unlock_tt:0 "Путь гегемонии получает доступ к уже существующей повторяемой национализации регионов."
 STP_heg_administration_unlock_tt:0 "Открывает временные администрации для побеждённых §YНодрула§!, §YЮбора§!, §YФронтира§! и §YКефрейта§!."
 STP_heg_northern_war_tt:0 "Начинает финальную северную войну против независимых §YНодрула§!, §YЮбора§! и §YФронтира§!. Уже подчинённые Стеланду правительства повторно не атакуются."
 STP_heg_northern_resolved_tt:0 "Северный этап завершён или обойдён; Стеланд находится в мире с Нодрулом, Юбором, Фронтиром и Кефрейтом."
 STP_heg_kefreyt_war_tt:0 "Начинает финальную войну за подчинение независимого §YКефрейта§!. Победа установит стеландскую временную администрацию."

 STP_hegemony_administration:0 "Управление гегемонии"
 STP_hegemony_administration_desc:0 "Гегемония сохраняет побеждённые государства как зависимые администрации со своими территориями и правительствами."

 STP_heg_establish_nod_administration:0 "Создать временную администрацию Нодрула"
 STP_heg_establish_nod_administration_desc:0 "Заменить побеждённое правительство Нодрула временной администрацией, подчинённой Стеланду."

 STP_heg_establish_ypr_administration:0 "Создать временную администрацию Юбора"
 STP_heg_establish_ypr_administration_desc:0 "Заменить побеждённое правительство Юбора временной администрацией, подчинённой Стеланду."

 STP_heg_establish_tff_administration:0 "Создать временную администрацию Фронтира"
 STP_heg_establish_tff_administration_desc:0 "Заменить побеждённое правительство Фронтира временной администрацией, подчинённой Стеланду."

 STP_heg_establish_val_administration:0 "Создать временную администрацию Кефрейта"
 STP_heg_establish_val_administration_desc:0 "Заменить побеждённое правительство Кефрейта временной администрацией, подчинённой Стеланду."
 STP_pc_heg_frontier_ain: "Айнхольм под управлением Фронтира"
 STP_pc_heg_frontier_ain_desc: "Независимый Айнхольм остаётся за пределами установленного нами порядка. Вместо ещё одной отдельной администрации его земли можно передать под управление зависимого Фронтира. Для этого потребуется военный поход: новое подчинение начнётся с победы, а не с подписи на карте."
 STP_pc_heg_frontier_cof: "Лесные земли Фронтира"
 STP_pc_heg_frontier_cof_desc: "Власть Культа детей леса не вписывается в систему подчинённых нам администраций. Поход против культа позволит расширить владения Фронтира и возложить на его правительство управление завоёванными землями. Фронтиру предстоит участвовать в войне, итогами которой он воспользуется."
 STP_heg_frontier_ain_war_tt: "Объявляет войну независимому Айнхольму и привлекает марионеточный Фронтир на нашу сторону. После победы над Айнхольмом его земли перейдут Фронтиру, если тот останется нашей некапитулировавшей марионеткой."
 STP_heg_frontier_cof_war_tt: "Объявляет войну независимому Культу детей леса и привлекает марионеточный Фронтир на нашу сторону. После победы над культом его земли перейдут Фронтиру, если тот останется нашей некапитулировавшей марионеткой."

 NKA_STS_administration:0 "Северная военная администрация"
 NKA_STS_administration_DEF:0 "Северная военная администрация"
 NKA_STS_administration_ADJ:0 "Северн."
 STP_pc_heg_northern_administration:0 "Единое северное управление"
 STP_pc_heg_northern_administration_desc:0 "После подчинения Кефрейта северная граница требует отдельного управления. Ирим и Ерстантпео станут его тыловой опорой: отсюда дороги ведут к Антолле, Фарейну и Химберу, а дальше - к каннибальским землям. Вместо нескольких зависимых правительств создадим единую военную администрацию. Уже подчинённые каннибальские территории войдут в неё без нового похода; независимые останутся за границей до военной победы."
 STP_heg_northern_administration_tt:0 "Создаёт зависимую §YСеверную военную администрацию§! с отдельным главой. Передаёт ей §YИрим§!, §YЕрстантпео§! и уже подчинённые каннибальские земли. Независимые страны и чужая оккупация исключены. Подчинённые каннибальские правительства без внешних владений объединяются с сохранением войск."
 STP_pc_heg_cannibal_campaign:0 "Закрыть каннибальскую границу"
 STP_pc_heg_cannibal_campaign_desc:0 "Единое управление не остановит набеги, пока по другую сторону границы сохраняются независимые каннибальские владения. Северная администрация станет тылом общего похода. Побеждённые земли перейдут под её власть, а пограничные гарнизоны получат единую цепь снабжения. Если Кефрейт уже покорил эти страны и их территории вошли в наш порядок, повторная война не нужна."
 STP_heg_cannibal_campaign_tt:0 "Начинает общую войну против оставшихся независимых государств §Y$CIN$§!, §Y$OSF$§! и §Y$APH$§!: побеждённые страны присоединяются к §YСеверной военной администрации§!. Уже подчинённые и отсутствующие страны пропускаются. При отсутствии независимых целей фокус обходится."
