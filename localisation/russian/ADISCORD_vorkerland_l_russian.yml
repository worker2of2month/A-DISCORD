 RUS_bunker_upgrade_2_requirements_tt:0 "Слой 2 оснащён и ещё не модернизирован. Свободная мощность: 0.\nВодоочистка: ещё -2% истощения. Узел связи: ещё +4% скорости планирования."
 RUS_bunker_upgrade_3:0 "Модернизация слоя 3"
 RUS_bunker_upgrade_3_desc:0 "Существующее помещение получает вторую очередь оборудования. Назначение слоя сохраняется.\n\nМастерские: ещё +3% выпуска заводов. Амбары: ещё -1.25% товаров народного потребления и +2 еды в неделю. Дополнительно занимает 1 мощности.\nСрок: 21 дн.\n$RUS_bunker_contract_tt$"
 RUS_bunker_upgrade_3_requirements_tt:0 "Слой 3 оснащён и ещё не модернизирован. Свободная мощность: 1.\nМастерские: ещё +3% выпуска заводов. Амбары: ещё -1.25% товаров народного потребления и +2 еды в неделю. Дополнительно занимает 1 мощности."
 RUS_bunker_upgrade_4:0 "Модернизация слоя 4"
