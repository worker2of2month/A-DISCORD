 TVA_programme_cancellation_tt:0 "При утрате условий вся оплата возвращается. При объединении возврат получает Воркерланд."
 TVA_maintenance_programme:0 "Остановить перегруженные узлы на обслуживание"
 TVA_maintenance_programme_desc:0 "Диспетчеры снимают с линии самые изношенные узлы. Ремонтные бригады получают время добраться до контактов, которые до сих пор меняли под напряжением."
 TVA_maintenance_programme_tt:0 "После обслуживания нагрузка сети снизится на §G[GetTVAMaintenanceReduction]§!, до нижнего предела §Y0§!."
 TVA_maintenance_result_tt:0 "Нагрузка сети: §G-[GetTVAMaintenanceReduction]§!, до нижнего предела §Y0§!."
 TVA_cadre_training_programme:0 "Подготовить смену инженеров и диспетчеров"
 TVA_cadre_training_programme_desc:0 "Рядом с каждым незаменимым специалистом должен встать ученик. Советы предприятий согласуют смены и освобождают наставников от авральных заданий."
 TVA_cadre_training_programme_tt:0 "После обучения кадровый резерв вырастет на §G[GetTVACadreTrainingGain]§!, до предела §Y100§!; нагрузка сети снизится на §G5§!, баланс сдвинется на §Y10%§! к согласию."
 TVA_cadre_training_result_tt:0 "Кадровый резерв: §G+[GetTVACadreTrainingGain]§!, до предела §Y100§!. Нагрузка сети: §G-5§!."
 TVA_emergency_series_programme:0 "Назначить внеочередную оружейную серию"
 TVA_emergency_series_programme_desc:0 "Коллегия пересчитывает график в пользу оружейных цехов. Другие заявки отходят в конец очереди, а опытные смены остаются у станков до сдачи партии."
 TVA_emergency_series_programme_tt:0 "[GetTVASeriesProgramme]"
 TVA_emergency_series_result_tt:0 "Нагрузка сети: §R+20§!. Кадровый резерв: §R-10§!."
 TVA_confirm_schedule:0 "Подтвердить обязательный график коллегии"
 TVA_confirm_schedule_desc:0 "Единый график получает силу приказа. Начальники цехов обязаны объяснять отклонения от расчёта, даже когда причиной стали нужды города."
 TVA_hear_councils:0 "Выслушать инженерные и городские советы"
 TVA_hear_councils_desc:0 "В диспетчерскую допускают представителей тех, кто выполняет её распоряжения. Спор о сменах и городском питании становится частью управления."
 ADISCORD_vorkerland_claimant.25.t:0 "Партия выдержала проверку"
 ADISCORD_vorkerland_claimant.25.d:0 "На стол Воркса положили журналы с передовой. Отметки инженеров совпали с донесениями командиров: опытная партия выдержала то, чего от неё требовал расчёт. Конструкторы получили не обещание, а проверенное решение.\n\nДиспетчерская уже готовит обычный график для испытательных бригад. Даже удачный опыт оставляет после себя изношенные узлы и людей, которым нужна смена."
 ADISCORD_vorkerland_claimant.25.a:0 "Передать проверенные решения конструкторам."
 ADISCORD_vorkerland_claimant.26.t:0 "Слабое место"
 ADISCORD_vorkerland_claimant.26.d:0 "Полевые журналы не подтвердили расчёт. Где-то не выдержали контакты, где-то экипажу потребовалось больше времени, чем допускал график. Бригада вернула подробную ведомость отказов.\n\nВоркс потребовал сохранить записи без исправлений. Следующая партия начнётся с этих страниц, но сначала придётся вернуть испытателей в обычную работу и привести сеть в порядок."
 ADISCORD_vorkerland_claimant.26.a:0 "Учесть каждый отказ."
