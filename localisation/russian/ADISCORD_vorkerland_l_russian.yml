 RUS_bunker_strip_1:0 "Слой 1: переоборудование"
 RUS_bunker_strip_1_desc:0 "Демонтировать действующее помещение и освободить его мощность. Глубина и прочность сохраняются; стоимость монтажа не возвращается. После демонтажа можно оплатить любую специализацию этого слоя заново."
 RUS_bunker_strip_2:0 "Слой 2: переоборудование"
 RUS_bunker_strip_2_desc:0 "Демонтировать действующее помещение и освободить его мощность. Глубина и прочность сохраняются; стоимость монтажа не возвращается. После демонтажа можно оплатить любую специализацию этого слоя заново."
 RUS_bunker_strip_3:0 "Слой 3: переоборудование"
 RUS_bunker_strip_3_desc:0 "Демонтировать действующее помещение и освободить его мощность. Глубина и прочность сохраняются; стоимость монтажа не возвращается. После демонтажа можно оплатить любую специализацию этого слоя заново."
 RUS_bunker_strip_4:0 "Слой 4: переоборудование"
 RUS_bunker_strip_4_desc:0 "Демонтировать действующее помещение и освободить его мощность. Глубина и прочность сохраняются; стоимость монтажа не возвращается. После демонтажа можно оплатить любую специализацию этого слоя заново."
 RUS_bunker_strip_5:0 "Слой 5: переоборудование"
 RUS_bunker_strip_5_desc:0 "Демонтировать действующее помещение и освободить его мощность. Глубина и прочность сохраняются; стоимость монтажа не возвращается. После демонтажа можно оплатить любую специализацию этого слоя заново."
 RUS_khan_governing_tt:0 "Страной руководит Марк Рустан; она независима и не капитулировала."
 RUS_bunker_operational_tt:0 "Марк Рустан управляет независимой страной, которая не капитулировала, и владеет регионом 66, полностью контролируя его."
 RUS_bunker_slot_free_tt:0 "Строительная бригада свободна: нет другого оплаченного подземного заказа."
 RUS_bunker_contract_tt:0 "Оплата резервируется при начале работ; повторного списания при сдаче нет. Одновременно выполняется один заказ. Потеря владения или контроля региона 66, подчинение, капитуляция либо падение законного правительства отменяют заказ с полным возвратом оплаты. Готовая планировка при временной потере сохраняется, но её эффекты не действуют. Законная смена Хана на Оскола или Ниву сохраняет и стройку, и оплату."
 RUS_bunker_refunded_tt:0 "Незавершённый подземный заказ отменён. Вся зарезервированная оплата возвращается ровно один раз."
 RUS_bunker_strip_tt:0 "Помещение демонтировано без возврата его цены. Модернизация также утрачивается. Мощность освобождается; глубина и прочность не меняются."
 RUS_bunker_complex:0 "Система бункеров"
 RUS_bunker_complex_desc:0 "Подземная столица начинается с чертежа и первой проходки. За гермодверями должны разместиться жильё, мастерские, лазареты, запасы и ставка — целый город, способный пережить гибель поверхности. Каждый оборудованный слой приближает это обещание, занимая место и требуя энергии, пищи и труда.\n\nСистема бункеров растёт вместе с построенными помещениями и их модернизациями. Её назначение определят хозяева: убежище для жителей, опора армии или закрытый центр власти. Действующие помещения дают стране свои преимущества, пока комплекс удерживается и работает; повреждённые своды и пустые склады превращают подземную жизнь в испытание."
 RUS_bunker_online:0 "§GКомплекс действует§!"
 RUS_bunker_offline:0 "§RКомплекс недоступен§!"
 RUS_bunker_safe:0 "§GСводы устойчивы§!"
 RUS_bunker_danger:0 "§RАварийные своды§!"
 RUS_bunker_idle:0 "§Gсвободна§!"
 RUS_bunker_busy:0 "§Yзанята§!"
 RUS_bunker_empty:0 "Пустая галерея"
 RUS_bunker_rock:0 "Неразведанный массив"
 RUS_bunker_depth_3_tt:0 "Разрешает проходку до третьего слоя. Проходка и оснащение каждого слоя оплачиваются отдельно."
 RUS_bunker_depth_5_tt:0 "Разрешает проходку до пятого слоя. Проходка и оснащение каждого слоя оплачиваются отдельно."
 RUS_bunker_five_tt:0 "Пять слоёв оснащены; прочность не ниже 60; нет незавершённых работ."
 RUS_bunker_three_tt:0 "Оснащены хотя бы три слоя; прочность не ниже 40."
 RUS_bunker_construction:0 "Подземная столица - пять слоёв"
 RUS_bunker_construction_desc:0 "Стройка доступна с первого дня. Выберите изображение слоя, чтобы оснастить или улучшить его. Цены, сроки и требования показаны при наведении."
 RUS_count_the_hearths:0 "Пересчитать очаги"
 RUS_count_the_hearths_desc:0 "Рустан знает имена вождей, но не знает числа дворов, которые они называют своими. Переписчики поедут в аймаки с чистыми книгами и приказом считать людей, а не обещания."
 RUS_council_mandate:0 "Совет аймаков"
 RUS_council_mandate_desc:0 "Старшины привозят в столицу списки нужд и обещаний своих общин. Решение совета проходит через долгий спор, зато вернувшийся домой делегат отвечает за него перед собственными людьми. Согласие аймаков укрепляет власть и внутренний мир; общий военный сбор приходится ждать дольше, чем хотелось бы ставке."
 RUS_aimaq_council:0 "Места у общего огня"
 RUS_aimaq_council_desc:0 "Вожди получат право спорить в одном зале. За признанные полномочия они отвечают поставками, судом и именами тех, кто подписал приказ."
 RUS_chancery_mandate:0 "Единая ханская печать"
 RUS_chancery_mandate_desc:0 "Единая печать придаёт столичному приказу силу во всех аймаках. Канцелярия назначает сроки, сводит разрозненные ведомости и требует исполнения, не ожидая нового совета старшин. Власть быстрее собирает людей и проводит решения, но каждая такая победа напоминает общинам о правах, которыми пришлось поступиться."
 RUS_seal_chancery:0 "Одна печать"
 RUS_seal_chancery_desc:0 "Право говорить от имени Хана нельзя раздавать вместе с дорожными грамотами. Канцелярия сведёт приказы в единую цепь и возьмёт на себя ответственность за её жёсткость."
 RUS_written_oaths:0 "Клятвы на бумаге"
 RUS_written_oaths_desc:0 "Совет и канцелярия по-разному распределяют полномочия, но оба обязаны отвечать за обещанные поставки. Письменные обязательства закрепят выдачу инженерного оснащения окружным службам. Клятва становится убедительной, когда за ней следует оборудование, которое действительно можно использовать; после этого редакция сможет отчитываться о выполненных обещаниях."
 RUS_paid_administration:0 "Оплаченная служба"
 RUS_paid_administration_desc:0 "Писарь получает жалование за исправный реестр, сборщик — за доставленные в казну деньги. Постоянная служба даёт чиновникам занятие и содержание, а государству — возможность спрашивать с них за результат. Меньше средств оседает между столичной ведомостью и окружным амбаром, и содержание управления обходится дешевле."
 RUS_pay_the_officials:0 "Жалованье вместо кормления"
 RUS_pay_the_officials_desc:0 "Писарь, живущий с каждой подписи, неизбежно продаёт государство по листку. Регулярное жалованье дорого, зато теперь можно требовать точности."
 RUS_winter_granaries:0 "Зимние ведомости"
 RUS_winter_granaries_desc:0 "Учесть зерно прежде, чем ударит мороз, значит обойтись без зимних реквизиций. Копия складской книги останется у тех, кто наполняет амбары."
 RUS_district_courts:0 "Суд до выстрела"
 RUS_district_courts_desc:0 "Не всякая ссора о земле должна кончаться походом. Разъездные суды закрепят примирение между общинами и освободят людей от обязанности участвовать в междоусобицах. Те, кто прежде охранял спорные межи, смогут вернуться на государственную службу; решение с печатью окажется полезнее ещё одного набега."
 RUS_school_of_scribes:0 "Школа писцов и механиков"
 RUS_school_of_scribes_desc:0 "Для Хана грамотный человек давно означает полезного человека. Теперь за одним столом учатся составлять смету, читать чертёж и замечать подделку."
 RUS_roadside_clinics:0 "Лазареты у дорог"
 RUS_roadside_clinics_desc:0 "Подводе с раненым нужен адрес, а не надежда встретить лекаря. Сеть маленьких лазаретов соединит разбросанные поселения лучше громких манифестов."
 RUS_a_country_of_names:0 "Страна собственных имён"
 RUS_a_country_of_names_desc:0 "В последней книге переписи больше нет строки «прочие». Рустан узнаёт цену настоящей власти: каждый, кого он велит защитить, становится кем-то определённым."
 RUS_surface_workshops:0 "Мастерские над бункером"
 RUS_surface_workshops_desc:0 "Подземное убежище не проживёт без людей снаружи. Старые ремонтные сараи соберут в фабричный двор, где можно изготовить крепёж, тележку и новую дверь. Вместе с мастерскими открывается торговая агитация: караваны получат заказы, а казна — деньги на следующий слой."
 RUS_treasury_400_tt:0 "Казна получает §G400§! £ADISCORD_economy_treasury_texticon."
 RUS_salvage_inventory:0 "Реестр уцелевших станков"
 RUS_salvage_inventory_desc:0 "Станок без паспорта - не лом. Приёмщики разберутся, что можно восстановить, прежде чем самые предприимчивые хозяева продадут его по весу."
 RUS_machine_school:0 "Училище наладчиков"
 RUS_machine_school_desc:0 "Один исправный станок бесполезен без человека, который умеет его остановить вовремя. Училище займёт пустой склад рядом с первым цехом."
 RUS_power_grid:0 "Сеть над землёй"
 RUS_power_grid_desc:0 "Провода свяжут мастерские и посёлки в общий хозяйственный круг. Подземные генераторы останутся отдельным делом: полагаться на единственный рубильник было бы слишком удобно для врага."
 RUS_freight_yards:0 "Разгрузочные дворы"
 RUS_freight_yards_desc:0 "Ворота столицы должны принимать поезд с грузом, а не очередь обозов. Диспетчерам нужны локомотивы, а мастерским - запас узлов для их ремонта."
 RUS_standard_calibres:0 "Единый калибр заказа"
 RUS_standard_calibres_desc:0 "Слишком часто новая партия патронов не подходит к старой партии винтовок. Единая приёмка прекратит это дорогое разнообразие."
 RUS_civilian_shift:0 "Вторая гражданская смена"
 RUS_civilian_shift_desc:0 "У военного заказа больше голосов, чем у мирного. Хан закрепит рабочую смену за гражданским производством, иначе ремонт столицы так и останется военным обещанием."
 RUS_precision_lathes:0 "Станки точного хода"
 RUS_precision_lathes_desc:0 "Разброс деталей измеряется не только металлом: это задержки и потерянные жизни. Новая линия будет делать меньше разных вещей, зато взаимозаменяемых."
 RUS_treasury_300_tt:0 "Казна получает §G300§! £ADISCORD_economy_treasury_texticon."
 RUS_industrial_belt:0 "Рабочее кольцо столицы"
 RUS_industrial_belt_desc:0 "Посёлки вокруг бункера стали городом, пока канцелярия всё ещё считала их временным лагерем. Пора признать этот город и подвести к нему постоянные службы."
 RUS_engineers_collegium:0 "Коллегия инженеров"
 RUS_engineers_collegium_desc:0 "При Хане появится совет, которому позволено сказать: «это не выдержит». Право спорить с приказом там, где речь идёт о расчёте, станет новым государственным обычаем."
 RUS_treasury_500_tt:0 "Казна получает §G500§! £ADISCORD_economy_treasury_texticon."
 RUS_bunker_survey:0 "Чертёж подземной столицы"
 RUS_bunker_survey_desc:0 "Проходчики могут начать работу уже сейчас. Государственное обследование даст им карту грунтов, первую крупную выплату и инженерное оснащение для оплаченных работ. Хан получит средства выбирать между глубиной, мощностью и прочностью, а не разрешение впервые открыть строительную площадку."
 RUS_bunker_airlocks:0 "Две двери до света"
 RUS_bunker_airlocks_desc:0 "Первые казармы или жилой ярус уже доступны строительной службе. Теперь герметичные переходы позволят устроить дополнительные кладовые у входа. Их постоянная ёмкость и первая партия пищи помогут снабжать комплекс после появления новых жителей."
 RUS_bunker_power_school:0 "Машинный зал"
 RUS_bunker_power_school_desc:0 "Главный инженер записал внизу плана четыре единицы мощности. На верхнем листе пожеланий уже двенадцать. Обещаниям придётся подчиниться генераторам."
 RUS_bunker_shift_work:0 "Две подземные смены"
 RUS_bunker_shift_work_desc:0 "Дополнительные смены позволят ускорить проходку. Прораб требует записать в приказе цену: меньше времени на закрепление означает более слабые своды."
 RUS_bunker_deep_gallery:0 "За старой переборкой"
 RUS_bunker_deep_gallery_desc:0 "Первые пробы позволяют продолжить шахту до третьего горизонта. Там достаточно места для коммуникаций и производства, если не забывать укреплять верхние галереи."
 RUS_bunker_utilities:0 "Вода или провод"
 RUS_bunker_utilities_desc:0 "Инженеры спорят за второй ярус. Для одних основа жизни - чистая вода, для других основа обороны - своевременный приказ. Окончательный выбор сделает заказ на монтаж."
 RUS_treasury_200_tt:0 "Казна получает §G200§! £ADISCORD_economy_treasury_texticon."
 RUS_bunker_working_heart:0 "Хлеб или сталь"
 RUS_bunker_working_heart_desc:0 "Третий ярус не сможет вместить одновременно полноценный арсенал и достаточные зерновые камеры. Теперь подземная смета станет политическим решением."
 RUS_bunker_lower_horizons:0 "Нижние горизонты"
 RUS_bunker_lower_horizons_desc:0 "За третьим слоем начинается незнакомая порода. Шахта сможет уйти глубже лишь после того, как верхние этажи станут действующим комплексом, а не победной фотографией пустых стен."
 RUS_bunker_science_wing:0 "Свет на четвёртом слое"
 RUS_bunker_science_wing_desc:0 "Доктора и исследователи просят одинакового: чистоты, надёжного света и тишины. Им придётся договориться, чья работа первой получит место под защитой скалы."
 RUS_bunker_memory_vault:0 "Память или приказ"
 RUS_bunker_memory_vault_desc:0 "На последнем ярусе будет сердце комплекса. Архив сохранит страну после смерти её правителя. Командный зал поможет правителю не допустить этой смерти вместе со страной."
 RUS_bunker_commission:0 "Испытание тишиной"
 RUS_bunker_commission_desc:0 "На сутки внешний рубильник отключат. Если комплекс выдержит, его жители впервые услышат не работу строителей, а собственную жизнь. Если нет - торжество подождёт."
 RUS_open_city_policy:0 "Город для живых"
 RUS_open_city_policy_desc:0 "Через гермодвери проходят семьи, врачи и преподаватели. Подземную столицу строят для жизни: её жители получают место в общем будущем, а исследователи — возможность работать рядом с мастерскими. Такой порядок укрепляет доверие и науку, хотя государству труднее требовать от граждан бесконечной осады. Принятые гражданские права действуют и за пределами комплекса."
 RUS_bunker_open_city:0 "Город для живых"
 RUS_bunker_open_city_desc:0 "Рустан велит снять часть пропускных постов и оставить нижние двери открытыми для гражданской службы. Убежище станет столицей, если люди смогут приходить сюда по делу, а не по приказу."
 RUS_sealed_throne_policy:0 "Трон под горой"
 RUS_sealed_throne_policy_desc:0 "Доступ в глубинные залы определяют пропуска и приказ ставки. Запасы, связь и защищённые помещения подчинены задаче выдержать осаду и сохранить командование, когда поверхность станет полем боя. Эта дисциплина усиливает оборону и готовность продолжать войну, но у жителей остаётся всё меньше влияния на собственную судьбу. Установленный порядок распространяется на всё государство."
 RUS_bunker_sealed_throne:0 "Ставка под горой"
 RUS_bunker_sealed_throne_desc:0 "Последние двери закроют, и каждая получит имя ответственного. Правительство строило место, из которого можно управлять даже концом света. Теперь ему предстоит не перепутать управление с ожиданием конца."
 RUS_muster_books:0 "Полковые книги"
 RUS_muster_books_desc:0 "Вождь приводит дружину, но штаб должен знать, сколько в ней людей и сколько винтовок. Единая ведомость позволит отправить помощь туда, где её действительно не хватает. Полковые плакаты и именные списки откроют кампанию «Эта винтовка защищает твой дом», а склад получит оружие для новых бригад."
 RUS_quartermaster_service:0 "Служба обозов"
 RUS_quartermaster_service_desc:0 "Отряд, который живёт за счёт ближайшего двора, скоро остаётся без дворов. Постоянный обоз позволит армии пройти дальше, не превращая тыл в пустыню."
 RUS_patient_doctrine_delta:0 "Изменение «Чёрной Армии»"
 RUS_patient_doctrine_delta_desc:0 "Оборона и экономия снабжения ценой скорости наступления."
 RUS_patient_war:0 "Терпеливая война"
 RUS_patient_war_desc:0 "Ставка не обязана отвечать на каждый вызов немедленно. Подготовленные позиции, накопленные припасы и точный расчёт позволят армии выбирать время удара."
 RUS_swift_doctrine_delta:0 "Изменение «Чёрной Армии»"
 RUS_swift_doctrine_delta_desc:0 "Подвижное наступление требует больше припасов."
 RUS_swift_columns:0 "Быстрые колонны"
 RUS_swift_columns_desc:0 "Пока сосед ищет на карте главную дорогу, ханский отряд должен уже быть у следующего перекрёстка. За эту скорость придётся платить дополнительным снабжением."
 RUS_officer_courses:0 "Курсы сотников"
 RUS_officer_courses_desc:0 "Сотник должен уметь не только первым подняться в атаку, но и последним сверить ведомость потерь. Курсы оставят командиру меньше красивых оправданий."
 RUS_field_sappers:0 "Полевая инженерная служба"
 RUS_field_sappers_desc:0 "Мост, окоп и зимняя дорога - разные ответы на один вопрос: как довести людей до следующего дня. Сапёров перестанут разбирать по чужим штабам."
 RUS_artillery_tables:0 "Таблицы огня"
 RUS_artillery_tables_desc:0 "Старые батареи знают дальность каждой пушки по памяти расчёта. Общие таблицы позволят сохранять это знание, когда расчёт сменяется."
 RUS_reserve_rotations:0 "Очередь резерва"
 RUS_reserve_rotations_desc:0 "Люди, вернувшиеся с фронта, не должны исчезать из полковой книги. Чередование службы даст армии резерв, комплект стрелкового оружия и оставит хозяйству хотя бы часть рабочих рук."
 RUS_anti_air_posts:0 "Небо над ставкой"
 RUS_anti_air_posts_desc:0 "Самолёт видит входы в бункер лучше, чем карту его коридоров. Наблюдательные посты и зенитные батареи защитят то, без чего даже глубокое убежище станет ловушкой. Батареи получают 180 боеприпасов сразу и собирают ещё 2 единицы зенитного снаряжения каждую неделю."
 RUS_professional_service_delta:0 "Изменение «Чёрной Армии»"
 RUS_professional_service_delta_desc:0 "Регулярная подготовка связывает аймаки единой военной системой."
 RUS_army_of_the_khanate:0 "Войско, которое вернётся"
 RUS_army_of_the_khanate_desc:0 "Теперь приказы требуют плана не только боя, но и возвращения. Чёрная Армия перестаёт быть собранием дружин, чья судьба кончается за ближайшим холмом."
 RUS_postwar_roads:0 "Дороги после похода"
 RUS_postwar_roads_desc:0 "Военный тракт должен стать дорогой, по которой ходят без конвоя. Первая послевоенная смета начнётся с возвращения рабочих на гражданские стройки."
 RUS_imperial_academy:0 "Академия последней империи"
 RUS_imperial_academy_desc:0 "Победа дала Хану карты чужих столиц. Академия должна научить его наследников читать на этих картах больше, чем направление следующего похода."
 RUS_treasury_600_tt:0 "Казна получает §G600§! £ADISCORD_economy_treasury_texticon."
 RUS_tomorrow_above_ground:0 "Завтра над землёй"
 RUS_tomorrow_above_ground_desc:0 "Последняя империя построена. На верхней ступени бункера Хан впервые слышит вопрос, на который не ответить приказом: что будет после последней победы? Ответом станет работа завтрашнего утра."
 RUS_treasury_220_tt:0 "Казна получает §G220§! £ADISCORD_economy_treasury_texticon."
 RUS_engineering_order_cost:0 "[GetRUSOrderengineering_orderpp]; [GetRUSOrderengineering_ordercash]"
 RUS_engineering_order_cost_blocked:0 "[GetRUSOrderengineering_orderpp]; [GetRUSOrderengineering_ordercash]"
 RUS_engineering_order_cost_tooltip:0 "[GetRUSOrderengineering_orderpp]; [GetRUSOrderengineering_ordercash]"
 RUS_engineering_order:0 "Заказ инженерного оснащения"
 RUS_engineering_order_desc:0 "Мастерские собирают насосы, крепёж, кабель и инструмент для строительных бригад и полевых сапёров.\n\nОплата и поставка немедленные; повторный заказ через 60 дней."
 RUS_rifle_order_cost:0 "[GetRUSOrderrifle_orderpp]; [GetRUSOrderrifle_ordercash]"
 RUS_rifle_order_cost_blocked:0 "[GetRUSOrderrifle_orderpp]; [GetRUSOrderrifle_ordercash]"
 RUS_rifle_order_cost_tooltip:0 "[GetRUSOrderrifle_orderpp]; [GetRUSOrderrifle_ordercash]"
 RUS_rifle_order:0 "Заказ единого калибра"
 RUS_rifle_order_desc:0 "Приёмка выкупает согласованную партию оружия для штатного набора и пополнения частей. Формирования получают людей и снаряжение обычным порядком.\n\nОплата и поставка немедленные; повторный заказ через 60 дней."
 RUS_market_surplus_cost:0 "[GetRUSOrdermarket_surpluspp]; [GetRUSOrdermarket_surplusrifles]"
 RUS_market_surplus_cost_blocked:0 "[GetRUSOrdermarket_surpluspp]; [GetRUSOrdermarket_surplusrifles]"
 RUS_market_surplus_cost_tooltip:0 "[GetRUSOrdermarket_surpluspp]; [GetRUSOrdermarket_surplusrifles]"
 RUS_market_surplus:0 "Продать излишки со складов"
 RUS_market_surplus_desc:0 "После сверки складов оружие из избыточных запасов можно продать местным охранным артелям. Снаряжение списывается из настоящего национального запаса.\n\nОплата и поставка немедленные; повторный заказ через 60 дней."
 ADISCORD_rus_campaign.1.t:0 "Пять слоёв тишины"
 ADISCORD_rus_campaign.1.d:0 "Ночью Рустан проснулся от стука в стене. За бетоном работали люди: снимали старую обшивку, искали воду, спорили о том, выдержит ли потолок ещё одну зиму. Хан долго слушал, прежде чем позвать дежурного.\n\nНа стол принесли план убежища. Три разных почерка называли один коридор тремя разными именами. Нижних помещений на плане не было вообще. «Это не столица, - сказал инженер. - Это место, в котором мы надеемся переждать». Рустан ответил не сразу. Он привык отдавать приказы о дорогах, границах и чужой верности. Здесь речь шла о том, что останется под его собственными ногами.\n\nУтром вожди аймаков получат приглашение. Писцы начнут считать дворы, мастерские - собирать инструменты, а инженеры - проверять своды. У Хана есть армия и имя. Ему предстоит построить страну, которая проживёт дольше очередного похода.\n\nСтроительная служба уже получила двадцать единиц инженерного оснащения и аванс на первую проходку. Работы можно заказать сразу в подземной столице, не дожидаясь государственного обследования."
 ADISCORD_rus_campaign.1.a:0 "Начнём с тех, кто живёт наверху."
 ADISCORD_rus_campaign.2.t:0 "Человек за цифрой"
 ADISCORD_rus_campaign.2.d:0 "Первая ведомость принесла меньше дворов, чем обещали вожди, и больше людей, чем ожидала казна. Некоторые семьи прятались от сборщиков годами; другие продолжали платить за сыновей, давно ушедших из дома.\n\nСтарый писец положил перед Ханом две книги. В одной получалась сильная страна: ровные числа, исправные поставки, никаких пустых строк. Во второй - настоящая. Рустан провёл пальцем по исправлениям и велел хранить обе. «Первую - чтобы помнить, как нам врут. Вторую - чтобы было чем править».\n\nЗа дверью уже спорили о новом совете и новой печати. На этот раз спор начнётся с известного числа живых людей."
 ADISCORD_rus_campaign.2.a:0 "Оставьте исправления видимыми."
 ADISCORD_rus_campaign.3.t:0 "Ещё один горизонт"
 ADISCORD_rus_campaign.3.d:0 "Последнюю тележку выкатили к подъёмнику уже под утро. За временным ограждением лежал новый слой - без отделки, без мебели, с лампами на открытом кабеле.\n\nПрораб не разрешил церемонию. Он перечислил трещины, показал отметки крепежа и только потом отдал акт проходки. Пустой зал ещё не был ни казармой, ни больницей, ни арсеналом. Теперь Хану предстояло решить, чья работа получит это пространство и сколько энергии можно ей обещать.\n\nНа стене рядом с номером слоя кто-то написал мелом имена ночной смены. Рустан велел не стирать их до окончания монтажа."
 ADISCORD_rus_campaign.3.a:0 "Сначала проверим своды."
 ADISCORD_rus_campaign.4.t:0 "Подпись без титула"
 ADISCORD_rus_campaign.4.d:0 "На последней странице новой переписи Рустан нашёл собственное имя. Писец не добавил ни титула, ни особого цвета чернил. Строка выглядела так же, как тысячи других.\n\nХан позвал автора. Тот попытался объяснить, что образец книги не предусматривает исключений, и замолчал. Рустан спросил, есть ли в образце место для умерших. Писец кивнул. «Тогда оставь так. Хорошая книга должна годиться и после меня».\n\nПриказ переписали без этой фразы. Но писец её запомнил."
 ADISCORD_rus_campaign.4.a:0 "Книга остаётся."
 ADISCORD_rus_campaign.5.t:0 "Право сказать «нет»"
 ADISCORD_rus_campaign.5.d:0 "Первое заседание коллегии закончилось отказом. Инженеры вернули военному ведомству проект перегруженного моста. Штаб прислал бумагу с ханской печатью. Коллегия приложила расчёт и вернула бумагу ещё раз.\n\nРустану предложили наказать дерзость. Он попросил прочитать расчёт вслух, дождался неловкой тишины и подписал новую смету. Государство, где каждый соглашается с правителем, слишком часто строит мосты в один конец.\n\nНа следующий день в мастерские впервые пришёл приказ с исправлением, заверенным той же печатью, что и первоначальная ошибка."
 ADISCORD_rus_campaign.5.a:0 "Расчёт сильнее спешки."
 ADISCORD_rus_campaign.6.t:0 "План, который можно выполнить"
 ADISCORD_rus_campaign.6.d:0 "Главный инженер положил пять листов один под другим. Первый - входы и жильё. Второй - вода или связь. Третий - хлеб или сталь. Четвёртый - медицина или исследования. Пятый он оставил почти пустым.\n\n«Сначала пройдём породу, затем поставим оборудование. Одну бригаду нельзя отправить в два забоя. Один генератор нельзя посчитать дважды. И если спешить, своды начнут платить за нас». Хан спросил, где будет трон. Инженер указал на верхний этаж: пока что там, откуда можно видеть стройку.\n\nНа полях сметы появились первый запас денег и первая выдача оснащения. Впервые бункер получил будущее, записанное не в пожеланиях, а в цене и сроке."
 ADISCORD_rus_campaign.6.a:0 "Бригаде - первый заказ."
 ADISCORD_rus_campaign.7.t:0 "За шумом машин"
 ADISCORD_rus_campaign.7.d:0 "Верхние этажи уже жили по собственному расписанию. За закрытой дверью работали механики, в коридоре спорили кладовщики, дежурный ругался на чужой кабель. Бункер перестал быть пустотой, которую предстояло заполнить.\n\nНижний горизонт оказался тише. Геолог передал Хану кусок тёмной породы и предложил остановиться на достигнутом. Не потому, что дальше нельзя. Потому, что дальше каждый метр будет дороже.\n\nРустан оставил камень на столе рядом с печатью. Разрешение на два новых слоя он подписал без праздничного обращения. Страна уже заплатила за право выбирать. Теперь предстояло научиться выбирать без торопливости."
 ADISCORD_rus_campaign.7.a:0 "У нижних этажей тоже будет смета."
 ADISCORD_rus_campaign.8.t:0 "Сутки без поверхности"
 ADISCORD_rus_campaign.8.d:0 "Внешний рубильник отключили в полдень. Несколько ламп моргнули, насосы сменили тон, и дежурный доложил, что комплекс держится на собственном питании.\n\nПервые часы все прислушивались. К вечеру перестали. Ночная смена пошла на работу, внизу закрыли ведомости, у лестницы кто-то уснул, положив свёрток под голову. Испытание прошло успешно в тот момент, когда люди забыли, что оно идёт.\n\nХан обошёл пять слоёв пешком. Возле последней двери он задержался. Здесь можно спрятать власть от страны. А можно дать стране место, в котором она продолжится даже в худший день. Бетон не сделает этот выбор за него."
 ADISCORD_rus_campaign.8.a:0 "Остаётся решить, кому служат двери."
 ADISCORD_rus_campaign.9.t:0 "Открытая лестница"
 ADISCORD_rus_campaign.9.d:0 "Новый приказ оказался короче всех строительных смет. Часть внутренних постов снималась; гражданские службы получали постоянный приём; список допуска заменялся расписанием работы.\n\nКомандир стражи предупредил, что так труднее обеспечить безопасность. Хан согласился. Инженер заметил, что теперь люди будут чаще ходить по лестницам. Хан согласился и с ним. На третье возражение Рустан не стал отвечать: у входа уже ждали люди, которым нужен был не правитель, а работающая канцелярия.\n\nБункер стал городом не в день открытия. Он стал им, когда первый человек вошёл без страха, что за ним закроют дверь."
 ADISCORD_rus_campaign.9.a:0 "Пусть приходят по своим делам."
 ADISCORD_rus_campaign.10.t:0 "Трон под горой"
 ADISCORD_rus_campaign.10.d:0 "Двери закрывали последовательно, сверху вниз. На каждом посту сверяли ключи и имена. Последний доклад прозвучал почти шёпотом, хотя в командном зале не было причин говорить тихо.\n\nСтены выдержат удар. Кабели сохранят приказ. Запасы позволят ждать. Рустан получил именно то, чего требовал от строителей: место, из которого нельзя просто выбить его власть. Но чем прочнее становилась эта уверенность, тем дальше казались голоса над землёй.\n\nХан оставил на столе связку от верхних дверей. Убежище готово. Теперь только он отвечает за то, чтобы не сделать из него собственную могилу при жизни."
 ADISCORD_rus_campaign.10.a:0 "Связь с поверхностью не отключать."
 ADISCORD_rus_campaign.11.t:0 "После последней победы"
 ADISCORD_rus_campaign.11.d:0 "На карте больше не было соседнего гегемона, который мог приказать Хану отступить. Победные ведомости сложили в архив; трофейные знамёна убрали из проходов, потому что они мешали носить мебель.\n\nУтром к Рустану пришли с обычными делами. Требовался мост. В училище не хватало места. В новом округе спорили о цене зерна. Хан слушал и постепенно понимал, что именно эти просьбы означают победу сильнее, чем присоединённые земли. Люди рассчитывали не переждать его царствование, а жить в нём.\n\nОн поднялся на поверхность до смены караула. Над рабочими посёлками стоял дым, по дороге шёл первый грузовик. Последняя империя встретила ещё один день, и этот день не требовал последнего приказа."
 ADISCORD_rus_campaign.11.a:0 "Поставьте мост первым в повестке."

