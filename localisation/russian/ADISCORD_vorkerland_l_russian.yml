 RUS_bunker_laboratory_desc:0 "Под землёй нет звёзд, зато есть тишина для вычислений. Инженеры потребовали отдельную линию питания и право писать в отчётах неприятную правду.\n\nСрок: 21 дн. Требуемая свободная мощность: 3. После сдачи слой занимает 3 мощности и даёт показанные ниже постоянные эффекты. На этом слое можно выбрать только одно помещение.\n$RUS_bunker_contract_tt$"
