 VAD_coalition_guarantees:0 "Предложить коалиционный договор: [FROM.GetName]"
 VAD_coalition_guarantees_desc:0 "Местная победа оставляет за собой спорные границы и недоверие соседей. Представители канцелярии везут договор о совместной войне и место за столом коалиции."
 VAD_foreign_observers:0 "Пригласить наблюдателей: [FROM.GetName]"
 VAD_foreign_observers_desc:0 "Для иностранных офицеров готовят маршруты по фронтовым штабам. Нашим командирам предстоит не только показывать удачные операции, но и отвечать на неудобные вопросы."
 VAD_coalition_guarantees_focus_tt:0 "Началась подготовка к центральной войне или сама война; администрация действует, VAD может возглавить коалицию и существует независимый местный победитель вне блоков."
 VAD_foreign_observers_focus_tt:0 "Администрация действует, VAD участвует в войне за Воркерланд и существует подходящий независимый партнёр среди SOL, ROM и TRU."
 VAD_coalition_guarantees_available_tt:0 "$VAD_coalition_guarantees_focus_tt$ Выбранная страна удерживает столицу, не воюет, не имеет оставшегося местного соперника и не рассматривает другое наше предложение."
 VAD_foreign_observers_available_tt:0 "$VAD_foreign_observers_focus_tt$ Выбранная страна не капитулировала, не воюет с VAD, ещё не присылала наблюдателей и не рассматривает другое наше предложение."
 VAD_coalition_guarantees_unlock_tt:0 "Открывает переговоры о вступлении местного победителя в коалицию и войны VAD. Требуется его согласие."
 VAD_foreign_observers_unlock_tt:0 "Открывает военные миссии: опыт армии и легитимность в обмен на доступ партнёра к разведданным о VAD. Требуется его согласие."
 VAD_coalition_guarantees_result_tt:0 "После подготовки [FROM.GetName] получит предложение и до 14 дней на ответ. При согласии страна вступит в коалицию VAD и присоединится на нашей стороне к текущим войнам. До завершения кампании она станет обязательной великой державой: коалицию нельзя победить, оставив её в строю. Залог расходуется после подтверждения вступления."
 VAD_foreign_observers_result_tt:0 "После подготовки [FROM.GetName] получит приглашение и до 14 дней на ответ. Только при согласии применяются показанные ниже результаты, а легитимность VAD растёт на §G+6§! п.п. Партнёр получает разведданные о нашей армии. Один отчёт от каждой страны за кампанию."
 VAD_foreign_offer_refund_tt:0 "Отказ, утрата условий или окончание кампании возвращают весь неиспользованный залог VAD; при передаче страны возврат получает её преемник. Если ответ не может быть доставлен, возврат произойдёт не позднее 30 дней после оплаты. Пока открыто прежнее предложение, новое к тому же партнёру недоступно."
 VAD_coalition_guarantees_accept_tt:0 "Вступить в коалицию VAD и на её стороне во все текущие войны. До завершения кампании наша страна считается обязательной великой державой. Договор оплачивает VAD; наши ресурсы не списываются."
 VAD_foreign_observers_accept_tt:0 "Передать военный отчёт: VAD получает также 6 п.п. легитимности. Наши ресурсы не списываются. Повторный отчёт в этой кампании недоступен."
 VAD_oath_pending_coalition_guarantees:0 "Коалиционный договор: [event_target:VAD_foreign_partner.GetName]"
 VAD_oath_pending_foreign_observers:0 "Военные наблюдатели: [event_target:VAD_foreign_partner.GetName]"
