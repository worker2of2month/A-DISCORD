 WRK_VAD_Joint_Council: "Объединённый чрезвычайный совет"
 faction_ebern_afrela_compact: "Эбернско-Афрельский пакт"
 ADISCORD_vorkerland_civil_war_exhaustion: "Истощение гражданской войны"
 ADISCORD_vorkerland_civil_war_exhaustion_desc: "Затяжная борьба за центр Воркерланда и новые потери истощают именно эту сторону конфликта. Истощение не уменьшается во время пауз между фронтами и исчезает только после центральной развязки гражданской войны."
 ADISCORD_vorkerland_civil_war_exhaustion_score_tt: "Текущее истощение: §Y[?ADISCORD_vorkerland_civil_war_exhaustion|0]/100§!"
 ADISCORD_vorkerland_organized_defence: "Организованная оборона"
 ADISCORD_vorkerland_organized_defence_desc: "Отступать больше некуда, и это упрощает решения. Штабы перестают спорить о наступлении, тыловые части уходят в окопы вместе с линейными, а склады, которые берегли до лучших времён, вскрываются сегодня. Сопротивление на грани поражения всегда упорнее, чем в середине победоносной кампании, - и именно поэтому добить претендента труднее, чем оттеснить."
 ADISCORD_vorkerland_legitimacy_dynamic: "Легитимность притязания"
 ADISCORD_vorkerland_legitimacy_dynamic_desc: "Ни одна из сторон не унаследовала бесспорного права говорить от имени Воркерланда, поэтому каждая доказывает его по-своему: рабочие советы - работающими заводами, реставрация - удержанием исторических столиц, директорат - наукой и восстановлением. Признание населения, армии и округов сходится в одну величину: чем она выше, тем охотнее за эту власть воюют и тем спокойнее живёт тыл. Потерянная легитимность возвращается медленнее, чем теряется."
 ADISCORD_vorkerland_legitimacy_score_tt: "Легитимность: §Y[?ADISCORD_vorkerland_legitimacy|2]§! §G(от -1.00 до 1.00)§!"
 EXZ_pragmatism_party: "Местные поселения"
 EXZ_No_Authority: "Центральная власть отсутствует"
 EXZ_No_Authority_desc: "Разрозненные поселения существуют без единой администрации, постоянной связи и общих вооружённых сил."
 ADISCORD_dirty_zone_title_tt: "§YЗона отчуждения§!"
 ADISCORD_dirty_zone_desc_tt: "Централизованная власть здесь отсутствует. Уцелевшие поселения изолированы друг от друга, а заражённая территория остаётся закрытой для внешнего мира."
 ADISCORD_dirty_zone_diplomacy_tt: "С этой территорией невозможно вести обычные дипломатические отношения."
 ADISCORD_DIRTY_ZONE_SCREEN_TITLE: "ЗОНА ОТЧУЖДЕНИЯ"
 ADISCORD_DIRTY_ZONE_SCREEN_STATUS: "§RДОСТУП ЗАКРЫТ§!"
 ADISCORD_DIRTY_ZONE_PROTOCOL_TITLE: "КАРАНТИННЫЙ ПРОТОКОЛ N-7"
 ADISCORD_DIRTY_ZONE_PROTOCOL_DESC: "Единое правительство и подтверждённый дипломатический адрес отсутствуют. Любой переход внешнего периметра запрещён до отдельного распоряжения."
 ADISCORD_DIRTY_ZONE_SIGNAL_TITLE: "СОСТОЯНИЕ КАНАЛА"
 ADISCORD_DIRTY_ZONE_SIGNAL_STATUS: "§G> ПРИЁМ СИГНАЛА...§!\n§R> ИСТОЧНИК ВНУТРИ ЗАКРЫТОГО СЕКТОРА.§!"
 ADISCORD_DIRTY_ZONE_SIGNAL_DESC: "Автоматическая станция принимает обрывочные аварийные передачи. Проверить отправителя, полномочия или координаты невозможно; двусторонняя связь не установлена."
 ADISCORD_DIRTY_ZONE_LOCK_STATUS: "§RДИПЛОМАТИЧЕСКИЕ ДЕЙСТВИЯ ЗАБЛОКИРОВАНЫ§!"
 ADISCORD_DIPLOMACY_RELATIONS_HEADER: "СВЯЗИ И ОБЯЗАТЕЛЬСТВА"
 ADISCORD_DIPLOMACY_ACTIONS_HEADER: "ДИПЛОМАТИЧЕСКИЕ КАНАЛЫ"
 ZAO_keep_the_western_registers_running: "Сохранить работу западных реестров"
 ZAO_keep_the_western_registers_running_desc: "Пока прежнее государство распадается, администрация Бассама Зогби не может позволить себе громких деклараций. Выплата жалования, распределение пайков и распоряжения муниципалитетам должны продолжаться, даже если столица больше не отвечает."
 ZAO_open_the_railway_storehouses: "Открыть железнодорожные склады"
 ZAO_open_the_railway_storehouses_desc: "На западных железнодорожных складах достаточно оружия, топлива и запчастей для местной обороны. Но сперва разрозненные запасы нужно поставить на гражданский учёт, пока их не растащили конкурирующие штабы."
 ZAO_form_municipal_defence_boards: "Создать муниципальные советы обороны"
 ZAO_form_municipal_defence_boards_desc: "Городские советы зарегистрируют добровольцев, организуют охраняемые узлы связи и согласуют резервы с уцелевшими кадровыми офицерами. Советы будут подчиняться гражданской администрации, а не импровизированной военной хунте."
 ZAO_keep_zaozersk_sovereign: "Сохранить суверенитет Заозерска"
 ZAO_keep_zaozersk_sovereign_desc: "Выстоявшая западная администрация получила мандат, который не может отменить ни один далёкий претендент. Заозерск готов сотрудничать с соседями, но его реестры, советы и вооружённые силы останутся под собственной юрисдикцией."
 ADISCORD_vorkerland_join_claimant_coalition: "Встать под руку [From.GetName]"
 ADISCORD_vorkerland_join_claimant_coalition_desc: "Наша собственная распря окончена. Соседняя администрация, оспаривавшая нашу власть, больше не воюет под своим флагом, и штаб округа впервые с распада прежнего государства может смотреть дальше ближайшей долины. За Воркерланд в целом всё ещё сражается один из центральных претендентов, и он готов принять нас как партнёра, а не как занятую территорию: наши офицеры сохраняют свои части, наши советы - свои реестры, а наши дивизии встают на фронт коалиции, вместо того чтобы открывать собственную войну. Милосердия здесь нет ни с одной стороны. Им нужны люди области, которая уже доказала, что умеет держать позиции, а нам нужна столица, которая всё ещё способна выдавать снаряжение."
 ADISCORD_vorkerland_join_claimant_coalition_tt:0 "Вступить в союз §Y[From.GetName]§! и воевать на его стороне. Мы сохраняем свою страну и территорию после победы. Федеральная столица передаётся восстановленному Воркерланду. Пока наша коалиция воюет, капитуляция её лидера не завершает нашу борьбу."
 faction_vorkerland_emergency_coalition: "Коалиция Чрезвычайного комитета"
 faction_vorkerland_central_administration_bloc: "Блок центральной администрации"
 faction_vorkerland_directorate_union: "Директоратский союз"
 ADISCORD_vorkerland_regional_autonomy: "Областная автономия"
 ADISCORD_vorkerland_regional_autonomy_desc: "Округом управляют те, кто в нём родился. Склады, железнодорожные тупики и списки резервистов составлены теми же чиновниками, которые ими сейчас и распоряжаются, а каждая дорога известна прежде, чем появится на карте. Строить здесь на время войны никто ничего не будет: мастерские, которые могли бы поднять новые цеха, вместо этого дают патроны и сапоги. Преимущество существует только на этой земле - оно принадлежит области, а не армии, поэтому претендент, занявший округ, получает обычную провинцию, а не наш дом."
 ADISCORD_vorkerland_macri_volunteer_corps: "Афрельский добровольческий корпус"
 ADISCORD_vorkerland_macri_volunteer_corps_desc: "Афрела решила, что уцелевший Влад Макри стоит большего, чем символический жест. Корпус набирают открыто, отправляют сформированным контингентом, а не струйкой отбившихся, и требование держать армию дома отменено на всё время эбернского кризиса."
 ADISCORD_vorkerland_civil_war_attrition: "Истощение центрального фронта"

# --- diplomacy_l_russian ---
 ADISCORD_vorkerland_regional_diplomacy_category: "Союзники за центральным фронтом"
 ADISCORD_vorkerland_regional_diplomacy_category_desc: "Суверенные победители в Солярино и Вольнограде могут присоединиться к претенденту до или во время решающей войны. Их ответ не задерживает центральную схватку."
 ADISCORD_vorkerland_vad_invite_victorious_sol: "Пригласить Солярино в реставрационный альянс"
 ADISCORD_vorkerland_vad_invite_victorious_sol_desc: "Солярино победило в собственной войне. Мы можем признать его победу и предложить полноценный военный союз."
 ADISCORD_vorkerland_wkr_invite_victorious_vla: "Пригласить Вольноградскую республику"
 ADISCORD_vorkerland_wkr_invite_victorious_vla_desc: "Победивший Вольноград может вступить в союз свободных республик, сохранив суверенитет."
 ADISCORD_vorkerland_vad_restore_sol_by_force: "Восстановить Солярино силой"
 ADISCORD_vorkerland_vad_restore_sol_by_force_desc: "Лоялисты проиграли. Когда Арми получит выход к Солярино, мы сможем свергнуть местного победителя и восстановить протекторат. Цель должна оставаться вне коалиций. Подготовка занимает 7 дней; если операция отменена или войну не удалось начать, §Y50§! £political_power_texticon возвращаются."
 ADISCORD_vorkerland_wkr_counter_solar_restoration: "Оспорить соляринский протекторат"
 ADISCORD_vorkerland_wkr_counter_solar_restoration_desc: "Марионеточное правительство Арми у нашей границы неприемлемо. Вмешательство ускорит общую войну трёх претендентов, а не создаст отдельный затяжной фронт."
 ADISCORD_vorkerland_solar_counter_preparation: "Подготовка к контрвмешательству в Солярино"
 ADISCORD_vorkerland_solar_restoration_alliance: "Соляринский реставрационный альянс"
 ADISCORD_vorkerland_free_republics_alliance: "Лига свободных республик"
 SOL_vorkerland_worker_protectorate: "Рабочий протекторат Солярино"
 SOL_vorkerland_worker_protectorate_DEF: "Рабочий протекторат Солярино"
 SOL_vorkerland_worker_protectorate_ADJ: "Соляринск."
 ADISCORD_vorkerland_diplomacy.2.t: "Приглашение из Арми"
 ADISCORD_vorkerland_diplomacy.2.d: "Правительство Арми предлагает признать нашу победу и совместно вести борьбу за Воркерланд. Соглашение сохраняет суверенитет Солярино, но направит его армию на действующие фронты Арми, если центральная война уже началась."
 ADISCORD_vorkerland_diplomacy.2.a: "Вступить в реставрационный альянс"
 ADISCORD_vorkerland_diplomacy.2.b: "Солярино справится само"
 ADISCORD_vorkerland_diplomacy.3.t: "Приглашение из Воркерланда"
 ADISCORD_vorkerland_diplomacy.3.d: "Чрезвычайное правительство рабочей республики предлагает Лигу свободных республик. Вольноград сохранит суверенитет и присоединится к действующим фронтам союзника, даже если решающая война уже началась."
 ADISCORD_vorkerland_diplomacy.3.a: "Вступить в лигу"
 ADISCORD_vorkerland_diplomacy.3.b: "Отклонить договор"
 RECALL_VOLUNTEERS_TITLE: "Отозвать добровольцев"
 RECALL_VOLUNTEERS_ACTION_DESC: "Немедленно вернуть отправленный в эту страну добровольческий контингент."
 RECALL_VOLUNTEERS_TOOLTIP: "§Y[This.GetNameWithFlag]§!: §Rв этой стране нет наших добровольцев, которых можно отозвать.§!"
 RECALL_VOLUNTEERS_TOOLTIP_G: "§Y[This.GetNameWithFlag]§!: отозвать наш добровольческий контингент."

# --- focus_decisions_l_russian ---
 ADISCORD_vorkerland_focus_operations_category:0 "Последняя кампания Воркерланда"
 ADISCORD_vorkerland_focus_operations_category_desc:0 "Ранние кампании в центральных округах, гражданское устройство занятых земель и подготовка к решающей войне претендентов."
 ADISCORD_vorkerland_allied_support_category:0 "Поддержка союзного фронта"
 ADISCORD_vorkerland_allied_support_category_desc:0 "Ограниченные поставки уже существующему военному союзнику. Эти меры не создают альянсы и не втягивают нейтральные страны в войну."

 ADISCORD_vorkerland_focus_central_minor_front_deadline:0 "Затянувшаяся волна кампании"
 ADISCORD_vorkerland_focus_central_minor_front_deadline_desc:0 "Командование учитывает каждую войну, открытую этой волной. Через 240 дней оперативная запись будет закрыта, но каждый действующий фронт продолжится до настоящей капитуляции или мира."

 ADISCORD_vorkerland_launch_central_minor_wave:0 "Открыть центральную волну кампании"
 ADISCORD_vorkerland_launch_central_minor_wave_desc:0 "После однодневной оперативной паузы одновременно объявить войну всем жизнеспособным центральным правительствам на нашей нынешней границе. Следующая волна начнётся лишь после завершения всех записанных фронтов и перегруппировки армии."
 ADISCORD_vorkerland_integrate_eyr_district:0 "Учредить гражданскую администрацию Эйрми"
 ADISCORD_vorkerland_integrate_eyr_district_desc:0 "Провести перепись, восстановить окружные учреждения и включить все занятые земли Эйрми в нашу систему управления."
 ADISCORD_vorkerland_integrate_egc_district:0 "Учредить гражданскую администрацию Зшата"
 ADISCORD_vorkerland_integrate_egc_district_desc:0 "Заменить распущенное гарнизонное командование обычными окружными учреждениями на всей занятой территории Зшата."
 ADISCORD_vorkerland_integrate_riv_district:0 "Учредить гражданскую администрацию Ривена"
 ADISCORD_vorkerland_integrate_riv_district_desc:0 "Восстановить окружное управление и включить все занятые земли Ривена в нашу административную систему."
 ADISCORD_vorkerland_integrate_rev_district:0 "Учредить гражданскую администрацию Ревеля"
 ADISCORD_vorkerland_integrate_rev_district_desc:0 "Восстановить окружное управление и включить все занятые земли Ревеля в нашу административную систему."
 ADISCORD_vorkerland_integrate_yor_district:0 "Учредить гражданскую администрацию Йора"
 ADISCORD_vorkerland_integrate_yor_district_desc:0 "Восстановить окружное управление и включить все занятые земли Йора в нашу административную систему."
 ADISCORD_vorkerland_integrate_ndn_district:0 "Учредить гражданскую администрацию Нордена"
 ADISCORD_vorkerland_integrate_ndn_district_desc:0 "Восстановить местные учреждения и включить полностью занятый Норденский округ в нашу административную систему."
 ADISCORD_vorkerland_integrate_swb_district:0 "Учредить администрацию Старого Воркенсберга"
 ADISCORD_vorkerland_integrate_swb_district_desc:0 "Восстановить местные учреждения и включить полностью занятый округ Старого Воркенсберга в нашу административную систему."
 ADISCORD_vorkerland_integrate_vhv_district:0 "Учредить гражданскую администрацию Верховья"
 ADISCORD_vorkerland_integrate_vhv_district_desc:0 "Восстановить окружное управление и включить все занятые земли Верховья в нашу административную систему."
 ADISCORD_vorkerland_integrate_osv_district:0 "Учредить гражданскую администрацию Оствина"
 ADISCORD_vorkerland_integrate_osv_district_desc:0 "Восстановить окружное управление и включить все занятые земли Оствина в нашу административную систему."
 ADISCORD_vorkerland_integrate_central_district_tt:0 "После завершения работ округ станет нашей национальной территорией, если прежнее правительство исчезло, а мы сохраняем владение и контроль. При утрате условий возвращается полная оплата. Незавершённая интеграция при восстановлении Воркерланда отменяется с возвратом оплаты новому правительству."
 ADISCORD_vorkerland_central_showdown_command_ready_tt:0 "Претендент санкционировал решающую войну и подготовил центральный фронт"
 ADISCORD_vorkerland_central_showdown_campaigns_closed_tt:0 "Все девять окружных кампаний завершены, а семидневная задержка повторного приказа истекла"
 ADISCORD_vorkerland_central_districts_integrated_tt:0 "Все девять центральных округов интегрированы и остаются во владении и под контролем трёх претендентов"
 ADISCORD_vorkerland_central_showdown_no_live_intervention_tt:0 "В Солярино не продолжается отдельная война одного из претендентов"
 ADISCORD_vorkerland_commit_to_central_showdown:0 "Вступить в центральную схватку"
 ADISCORD_vorkerland_commit_to_central_showdown_desc:0 "Подготовка центрального фронта завершена. Приказать начать войну между тремя претендентами, не дожидаясь общего срока. Независимые округа сохраняют свои территории; союзники участвуют на стороне своей коалиции. Гражданская интеграция завоёванных земель проводится отдельно и возможна после победы."
 ADISCORD_vorkerland_wkr_retreat_levy_1:0 "Созвать первый рабочий резерв"
 ADISCORD_vorkerland_wkr_retreat_levy_1_desc:0 "Через семь дней в удерживаемой столице соберётся один плохо оснащённый отряд ополчения."
 ADISCORD_vorkerland_wkr_retreat_levy_2:0 "Созвать последний рабочий резерв"
 ADISCORD_vorkerland_wkr_retreat_levy_2_desc:0 "Последний и ещё более слабый столичный резерв. После него новые отряды этой линии недоступны."
 ADISCORD_vorkerland_vad_retreat_levy_1:0 "Созвать первый резерв канцелярии"
 ADISCORD_vorkerland_vad_retreat_levy_1_desc:0 "Через семь дней в удерживаемой столице соберётся один плохо оснащённый охранный отряд."
 ADISCORD_vorkerland_vad_retreat_levy_2:0 "Созвать последний резерв канцелярии"
 ADISCORD_vorkerland_vad_retreat_levy_2_desc:0 "Последний и ещё более слабый столичный резерв. После него новые отряды этой линии недоступны."
 ADISCORD_vorkerland_tva_retreat_levy_1:0 "Созвать первый технический резерв"
 ADISCORD_vorkerland_tva_retreat_levy_1_desc:0 "Через семь дней в удерживаемой столице соберётся один плохо оснащённый технический отряд."
 ADISCORD_vorkerland_tva_retreat_levy_2:0 "Созвать последний технический резерв"
 ADISCORD_vorkerland_tva_retreat_levy_2_desc:0 "Последний и ещё более слабый столичный резерв. После него новые отряды этой линии недоступны."
 ADISCORD_vorkerland_vad_continue_imperial_reunification:0 "Продолжить имперское воссоединение"
 ADISCORD_vorkerland_vad_continue_imperial_reunification_desc:0 "Победа над центральными претендентами не вернула страну целиком. Имперская канцелярия будет последовательно предъявлять требования уцелевшим администрациям бывшего Воркерланда и ликвидировать их по одной, не распыляя армию на десяток одновременных войн."
 ADISCORD_vorkerland_restore_core_claimant_homes:0 "Восстановить земли претендентов"
 ADISCORD_vorkerland_restore_core_claimant_homes_desc:0 "Вернуть земли трёх военных правительств после восстановления владения и контроля объединённой страны над всеми указанными регионами."
 ADISCORD_vorkerland_restore_core_central_historical:0 "Восстановить исторический центр"
 ADISCORD_vorkerland_restore_core_central_historical_desc:0 "Восстановить администрацию объединённого государства в историческом центре независимо от окраинных территорий."
 ADISCORD_vorkerland_restore_core_oitfort:0 "Интегрировать Оитфорт"
 ADISCORD_vorkerland_restore_core_oitfort_desc:0 "Ойтфорт уже включён в объединённый Воркерланд после ликвидации военного технического комитета. Теперь, когда штат полностью принадлежит и контролируется центральным правительством, его можно оформить как национальную территорию."
 ADISCORD_vorkerland_restore_core_rimat:0 "Интегрировать Римат"
 ADISCORD_vorkerland_restore_core_rimat_desc:0 "Вернуть Римат в состав восстановленного государства после установления полного владения и контроля над регионом."
 ADISCORD_vorkerland_restore_core_techlar:0 "Интегрировать Техлар"
 ADISCORD_vorkerland_restore_core_techlar_desc:0 "Вернуть Техлар в состав восстановленного государства после установления полного владения и контроля над регионом."
 ADISCORD_vorkerland_restore_core_ebern:0 "Интегрировать Эберн"
 ADISCORD_vorkerland_restore_core_ebern_desc:0 "Вернуть Эберн в состав восстановленного государства после установления полного владения и контроля над регионом."
 ADISCORD_vorkerland_restore_core_solar:0 "Интегрировать Соларский округ"
 ADISCORD_vorkerland_restore_core_solar_desc:0 "Вернуть три национальные территории округа Солярино после установления полного владения и контроля; существование правительства Солярино не требуется."
 ADISCORD_vorkerland_recognize_free_republics:0 "Признать свободные республики"
 ADISCORD_vorkerland_recognize_free_republics_desc:0 "Официально признать уцелевшие независимые республики Фреалора и Золоторечья и заключить с ними пакты о ненападении."
 ADISCORD_vorkerland_send_vla_support_tranche_1:0 "Снабдить вспомогательный фронт Вольнограда"
 ADISCORD_vorkerland_send_vla_support_tranche_1_desc:0 "После заключения союза с Вольноградом передать его действующему фронту 3000 единиц пехотного и 30 единиц вспомогательного снаряжения. Следующую поставку можно готовить лишь через 90 дней."
 ADISCORD_vorkerland_send_vla_support_tranche_2:0 "Возобновить поддержку Вольнограда"
 ADISCORD_vorkerland_send_vla_support_tranche_2_desc:0 "Отправить Вольнограду вторую и последнюю ограниченную партию снаряжения."
 ADISCORD_vorkerland_send_sol_support_tranche_1:0 "Снабдить союзный фронт Солярино"
 ADISCORD_vorkerland_send_sol_support_tranche_1_desc:0 "После союза с Солярино или восстановления республики под нашей защитой передать её действующему фронту 3000 единиц пехотного и 30 единиц вспомогательного снаряжения. Следующую поставку можно готовить лишь через 90 дней."
 ADISCORD_vorkerland_send_sol_support_tranche_2:0 "Возобновить поддержку Солярино"
 ADISCORD_vorkerland_send_sol_support_tranche_2_desc:0 "Отправить Солярино вторую и последнюю ограниченную партию снаряжения."
 ADISCORD_vorkerland_allied_supply_advisers:0 "Советники по союзному снабжению"
 ADISCORD_vorkerland_allied_supply_advisers_desc:0 "Временная группа советников распределяет доставленное имущество и координирует его переброску на фронт."

 ADISCORD_vorkerland_consolidation_deadline:0 "Распад общего командования"
 ADISCORD_vorkerland_consolidation_deadline_desc:0 "На создание собственного командования и договорённости с окружными правительствами остаётся не более 180 дней. После истечения срока три претендента начнут большую войну. Победители местных конфликтов могут вступить в коалицию; присоединение округов не обязательно. Подготовленный претендент может начать войну раньше отдельным решением."
# --- postwar_ideas_l_russian ---
 ADISCORD_vorkerland_worker_constitutional_settlement:0 "Конституционное соглашение"
 ADISCORD_vorkerland_worker_constitutional_settlement_desc:0 "Представительство республик, права рабочих организаций и защита вернувшихся общин теперь опираются на постоянный закон, а не на чрезвычайные указы."
 ADISCORD_vorkerland_reunification_settlement:0 "Соглашение о воссоединении"
 ADISCORD_vorkerland_reunification_settlement_desc:0 "Общая канцелярия, подотчётные военные округа и единое право связывают восстановленное государство."
 ADISCORD_vorkerland_measurable_republic:0 "Технократическая республика"
 ADISCORD_vorkerland_measurable_republic_desc:0 "Профессиональная администрация, открытые бюджеты и техническая оценка связывают политику восстановления с фактами и общественными результатами."
 ADISCORD_vorkerland_worker_reconstruction_compact_1:0 "Чрезвычайный пакт о восстановлении"
 ADISCORD_vorkerland_worker_reconstruction_compact_1_desc:0 "Советы согласуют срочный ремонт во временном порядке, который быстро направляет ресурсы, но нагружает гражданский бюджет и политическое управление."
 ADISCORD_vorkerland_worker_reconstruction_compact_2:0 "Республиканский пакт о восстановлении"
 ADISCORD_vorkerland_worker_reconstruction_compact_2_desc:0 "Открытая отчётность, представительство республик и общие нормы помощи превращают чрезвычайный ремонт в устойчивую кооперативную программу."
 ADISCORD_vorkerland_worker_housing_guarantee:0 "Жилищная гарантия возвращения"
 ADISCORD_vorkerland_worker_housing_guarantee_desc:0 "Объединённая республика гарантирует жильё и основные услуги вернувшимся общинам на время разрешения имущественных споров."
 ADISCORD_vorkerland_worker_local_reconstruction_grants:0 "Гранты советам на восстановление"
 ADISCORD_vorkerland_worker_local_reconstruction_grants_desc:0 "Местные советы получают прозрачные гранты на проекты, которые можно открыть быстрее всего, сохраняя инициативу у восстанавливаемых общин."
 ADISCORD_vorkerland_joint_restoration_authority_1:0 "Временное управление восстановления"
 ADISCORD_vorkerland_joint_restoration_authority_1_desc:0 "Армейские и гражданские чиновники делят импровизированную систему командования, расплачиваясь административными затруднениями за скорость."
 ADISCORD_vorkerland_joint_restoration_authority_2:0 "Единое управление восстановления"
 ADISCORD_vorkerland_joint_restoration_authority_2_desc:0 "Восстановленная канцелярия связывает окружные штабы, гражданское право и государственные реестры одной подотчётной иерархией."
 ADISCORD_vorkerland_joint_civilian_transition:0 "Переход округов к гражданскому порядку"
 ADISCORD_vorkerland_joint_civilian_transition_desc:0 "Окружная полиция возвращается гражданской власти, укрепляя законность, пока армия отказывается от части чрезвычайных полномочий."
 ADISCORD_vorkerland_joint_emergency_inspectorate:0 "Чрезвычайная окружная инспекция"
 ADISCORD_vorkerland_joint_emergency_inspectorate_desc:0 "Центральные инспекторы временно сохраняют власть над арсеналами и гарнизонами, повышая готовность ценой умеренных политических издержек."
 ADISCORD_vorkerland_technical_reconstruction_mandate_2:0 "Подотчётный мандат на реконструкцию"
 ADISCORD_vorkerland_technical_reconstruction_mandate_2_desc:0 "Открытые реестры и проверяемые показатели служб расширяют возможности инженерной директории при меньшем чрезвычайном бремени."
 ADISCORD_vorkerland_public_utility_priority:0 "Приоритет коммунальных служб"
 ADISCORD_vorkerland_public_utility_priority_desc:0 "Жильё и важнейшие службы первыми получают энергию и транспортную мощность, укрепляя повседневную устойчивость ценой гражданских расходов."
 ADISCORD_vorkerland_industrial_recovery_priority:0 "Приоритет промышленного восстановления"
 ADISCORD_vorkerland_industrial_recovery_priority_desc:0 "Заводы первыми получают отремонтированные станки и мощности энергосети, быстро наращивая выпуск, пока гражданский спрос ждёт."
 ADISCORD_vorkerland_tva_mobile_repair_trains:0 "Подвижные ремонтные поезда"
 ADISCORD_vorkerland_tva_mobile_repair_trains_desc:0 "Железнодорожные мастерские перебрасывают инженеров и запасные части между повреждёнными узлами вслед за подвижным фронтом."
 ADISCORD_vorkerland_tva_emergency_output_board:0 "Чрезвычайная производственная коллегия"
 ADISCORD_vorkerland_tva_emergency_output_board_desc:0 "Инженеры и руководители предприятий согласуют выполнимые военные нормы, принимая умеренную нагрузку на гражданское хозяйство ради устойчивого выпуска."
 ADISCORD_vorkerland_tva_operational_audit:0 "Оперативная проверка"
 ADISCORD_vorkerland_tva_operational_audit_desc:0 "Единые отчёты о снабжении, ремонте и потерях позволяют штабу исправлять планы до того, как местные сбои распространятся по всему фронту."
 ADISCORD_vorkerland_technical_reconstruction_mandate:0 "Технический мандат на реконструкцию"
 ADISCORD_vorkerland_technical_reconstruction_mandate_desc:0 "Временный кабинет инженеров и гражданских администраторов получает ресурсы для быстрого восстановления вместе со строгой обязанностью отчитываться об их использовании."
 ADISCORD_vorkerland_national_power_standard:0 "Национальный энергетический стандарт"
 ADISCORD_vorkerland_national_power_standard_desc:0 "Единое напряжение, приоритеты нагрузки и порядок ремонта упрощают обслуживание энергосети и снабжение промышленности."
 ADISCORD_vorkerland_public_engineering_service:0 "Государственная инженерная служба"
 ADISCORD_vorkerland_public_engineering_service_desc:0 "Постоянные инженерные ведомства испытывают государственное оборудование, сохраняют специалистов и переносят результаты исследований в серийное производство."
 ADISCORD_vorkerland_statistical_administration:0 "Статистическая администрация"
 ADISCORD_vorkerland_statistical_administration_desc:0 "Региональные ведомства используют единые публичные реестры и стандарты услуг, обеспечивая центру достоверные сведения и ясное распределение ответственности."
 ADISCORD_vorkerland_ivanland_expeditionary_command:0 "Экспедиционное командование Иванланда"
 ADISCORD_vorkerland_ivanland_expeditionary_command_desc:0 "Временный штаб координирует ограниченную северную экспедицию Иванланда, сосредотачивая управление и снабжение без создания постоянной оккупационной армии."

# --- recovery_l_russian ---
 WKR: "Воркерландский чрезвычайный комитет"
 WKR_DEF: "Воркерландский чрезвычайный комитет"
 WKR_ADJ: "Воркерландск."
 WKR_vorkerland_emergency: "Чрезвычайная республика Воркерланда"
 WKR_vorkerland_emergency_DEF: "Чрезвычайная республика Воркерланда"
 WKR_vorkerland_emergency_ADJ: "Воркерландск."
 WRK_technocracy: "Технократическая республика Воркерланда"
 WRK_technocracy_DEF: "Технократическая республика Воркерланда"
 WRK_technocracy_ADJ: "Воркерландск."
 WKR_pragmatism_party: "Рабочая революционная партия"
 WKR_pragmatism_party_long: "Рабочая революционная партия"
 WKR_utilitarism_party: "Партия Норматива"
 WKR_utilitarism_party_long: "Воркерландский директорат нормативного восстановления"
 WKR_Emergency_Coordination_Committee: "Чрезвычайный координационный комитет"
 ADISCORD_vorkerland_phase.1.t: "Выбор претендента"
 ADISCORD_vorkerland_phase.1.d:0 "Республика вот-вот распадётся. Этот выбор меняет только страну под управлением игрока: судьба Уоркера и местные войны определяются независимо. Можно возглавить сторонников Уоркера, Влада и Арми или директорат Дориана. Договорённости с автономиями сохраняют своё значение, но не навязывают сторону гражданской войны. Если не сделать выбор в течение 14 дней, управление перейдёт к сторонникам Уоркера."
 ADISCORD_vorkerland_phase.1.a: "Играть за чрезвычайные комитеты Уоркера."
 ADISCORD_vorkerland_phase.1.b: "Играть за коалицию Влада и Арми."
 ADISCORD_vorkerland_phase.1.c: "Играть за техническую администрацию Дориана Воркса."
 ADISCORD_vorkerland_phase.1.e: "Соблюсти чрезвычайный пакт Уоркера и Вадла."

# --- rom_tru_l_russian ---
 ADISCORD_vorkerland_rom_tru_category: "Южные республики в огне"

 ADISCORD_vorkerland_rom_desert_eagle_staff: "Штаб Пустынного Орла"
 ADISCORD_vorkerland_rom_desert_eagle_staff_desc: "Романовский собрал вокруг фреалорского штаба офицеров старой конфедерации, связистов и проводников долин. Их мало, но приказы доходят до рот быстрее, чем распадаются линии снабжения."
 ADISCORD_vorkerland_rom_valley_columns: "Долинные колонны"
 ADISCORD_vorkerland_rom_valley_columns_desc: "Сводные отряды Фреалора получили единый график наступления, полевые мастерские и право без промедления реквизировать транспорт."
 ADISCORD_vorkerland_rom_stalled_offensive: "Застрявшее наступление"
 ADISCORD_vorkerland_rom_stalled_offensive_desc: "Штаб обещал быструю операцию, но долины поглотили людей и припасы. В частях растёт недоверие к новым приказам."
 ADISCORD_vorkerland_rom_valley_compact: "Фреалорский долинный пакт"
 ADISCORD_vorkerland_rom_valley_compact_desc: "Военные и долинные советы закрепили раздел полномочий: штаб отвечает за оборону, общины - за снабжение и восстановление хозяйства."

 ADISCORD_vorkerland_tru_emergency_river_council: "Чрезвычайный речной совет"
 ADISCORD_vorkerland_tru_emergency_river_council_desc: "Золотореченские заводы, речные артели и штаб Трумена сведены в единый мобилизационный совет. Каждый мост, склад и литейный цех теперь работает по фронтовому расписанию."
 ADISCORD_vorkerland_tru_crossing_columns: "Колонны речных переправ"
 ADISCORD_vorkerland_tru_crossing_columns_desc: "Мобильные группы заранее распределили понтоны, ремонтные команды и резервы между ключевыми переправами."
 ADISCORD_vorkerland_tru_stalled_offensive: "Сорванный речной график"
 ADISCORD_vorkerland_tru_stalled_offensive_desc: "Обещанный быстрый разгром временной администрации не состоялся. Заводы требуют нового плана, а части теряют веру в расписания штаба."
 ADISCORD_vorkerland_tru_river_congress: "Золотореченский конгресс"
 ADISCORD_vorkerland_tru_river_congress_desc: "Представители городов, заводов и фронтовых частей превратили чрезвычайную мобилизацию в устойчивый республиканский порядок."

 ADISCORD_vorkerland_rom_assemble_valley_columns: "Собрать долинные колонны"
 ADISCORD_vorkerland_rom_assemble_valley_columns_desc: "За двадцать один день штаб сведёт разрозненные резервы в ещё одну линейную бригаду и подготовит короткое наступательное окно."
 ADISCORD_vorkerland_rom_break_valley_administration: "Сломить долинную администрацию"
 ADISCORD_vorkerland_rom_break_valley_administration_desc: "У Фреалора есть 180 дней, чтобы ликвидировать Долинную администрацию. Победа укрепит республику; затяжная война подорвёт доверие к штабу."
 ADISCORD_vorkerland_rom_charter_valley_councils: "Утвердить хартию долинных советов"
 ADISCORD_vorkerland_rom_charter_valley_councils_desc: "После победы необходимо договориться с возвращёнными общинами, пока военная администрация не стала новой оккупационной властью."

 ADISCORD_vorkerland_tru_arm_river_battalions: "Вооружить речные батальоны"
 ADISCORD_vorkerland_tru_arm_river_battalions_desc: "Гражданские артели передадут армии людей, транспорт и ремонтные комплекты, а заводы соберут дополнительную линейную бригаду."
 ADISCORD_vorkerland_tru_break_zlatorech_administration: "Разгромить временную администрацию"
 ADISCORD_vorkerland_tru_break_zlatorech_administration_desc: "За 150 дней Золоторечье должно вернуть западный берег. Иначе чрезвычайный совет потеряет право диктовать республике фронтовой ритм."
 ADISCORD_vorkerland_tru_convene_river_congress: "Созвать Золотореченский конгресс"
 ADISCORD_vorkerland_tru_convene_river_congress_desc: "Победа позволяет заменить временные приказы соглашением городов, заводов и фронтовых частей о будущем республики."

 ADISCORD_vorkerland_rom_tru.1.t: "Пустынный Орёл раскрывает карты"
 ADISCORD_vorkerland_rom_tru.1.d: "Долинная администрация отвергла приказы Фреалора и закрыла дороги на юг. Ервин фон Романовский объявил, что республика не переживёт ещё одного раздела: штаб собирает старых офицеров, местные советы открывают склады, а колонны выходят к перевалам. Война должна быть короткой - иначе тот самый штаб станет для Фреалора новой обузой."
 ADISCORD_vorkerland_rom_tru.1.a: "Свести колонны в единый кулак."
 ADISCORD_vorkerland_rom_tru.2.t: "Река больше не разделит республику"
 ADISCORD_vorkerland_rom_tru.2.d: "Временная администрация закрепилась на западном берегу и объявила себя единственной законной властью Золоторечья. Никита Трумен созвал директоров заводов, командиров и представителей речных артелей. Их чрезвычайный совет переводит переправы и литейные цеха на военный график - с обещанием вернуть полномочия гражданам после победы."
 ADISCORD_vorkerland_rom_tru.2.a: "Запустить речной мобилизационный план."

# --- stalemate_l_russian ---
 ADISCORD_vorkerland_ai_breakthrough_window:0 "Чрезвычайное оперативное окно"
 ADISCORD_vorkerland_ai_breakthrough_window_desc:0 "На семьдесят пять дней измотанные штабы наступающей стороны получают приоритет на железных дорогах, мобильные ремонтные бригады и полномочия добиться развязки на уцелевшем фронте."

# --- story_l_russian ---
 ADISCORD_vorkerland_story.1.t: "Претенденты вступают в войну"
 ADISCORD_vorkerland_story.1.d: "Последние аварийные каналы связи между уцелевшими правительствами Воркерланда замолчали. Претенденты прекратили переговоры и считают друг друга противниками. Бои идут на всех направлениях: началась война за центр страны."
 ADISCORD_vorkerland_story.1.a: "Переговоры закончились."
 ADISCORD_vorkerland_story.2.t: "Регион Гранд-Воркенсберга пал"
 ADISCORD_vorkerland_story.2.d: "Войска [ROOT.GetNameDef] и их союзников взяли под контроль весь регион Гранд-Воркенсберга. Рабочее правительство потеряло не только столицу, но и все округа своей исходной территории. Чрезвычайные комитеты ещё могут продолжать войну в других местах, но свою опорную базу они утратили."
 ADISCORD_vorkerland_story.2.a: "Гранд-Воркенсберг пал."
 ADISCORD_vorkerland_story.3.t: "Регион Изаии пал"
 ADISCORD_vorkerland_story.3.d: "Войска [ROOT.GetNameDef] и их союзников заняли весь регион Изаии - исходную территорию военной коалиции Влада. Потерю одной ставки ещё можно было выдать за временное отступление, но теперь коалиция лишилась всех своих опорных округов."
 ADISCORD_vorkerland_story.3.a: "Изаия пала."
 ADISCORD_vorkerland_story.4.t: "Регион Нордверка пал"
 ADISCORD_vorkerland_story.4.d: "Войска [ROOT.GetNameDef] и их союзников заняли весь регион Нордверка. Технократическая администрация доктора Дориана Воркса может продолжать войну с рассредоточенных объектов, но её исходная территория и сеть местных командных узлов потеряны."
 ADISCORD_vorkerland_story.4.a: "Нордверк пал."
 ADISCORD_vorkerland_story.5.t: "Захваченный командный аппарат"
 ADISCORD_vorkerland_story.5.d: "Первый соперничающий претендент капитулировал. В нашем распоряжении оказались штабные офицеры, шифровальщики и начальники снабжения. Часть из них можно включить в победившее командование; другие предупреждают, что вместе с аппаратом поражённого режима переживут и его распри."
 ADISCORD_vorkerland_story.5.a: "Включить полезные штабы в нашу структуру."
 ADISCORD_vorkerland_story.5.b: "Распустить аппарат и освободить служащих."
 ADISCORD_vorkerland_story.6.t: "После канонады"
 ADISCORD_vorkerland_story.6.worker.d: "Воркерланд снова един под руководством [ROOT.GetLeader]. Лоялисты Воркера и чрезвычайные администраторы Антона Багли согласны, что военное государство должно измениться, но спорят, кто поведёт восстановление - штабная сеть или гражданские учреждения."
 ADISCORD_vorkerland_story.6.joint.d: "Воркерланд снова един под руководством [ROOT.GetLeader]. Коалиция Влада и уцелевшие рядом с ней совместные советы должны решить, будет ли объединением управлять единое командование или гарантии, выданные провинциям."
 ADISCORD_vorkerland_story.6.worx.d: "Воркерланд снова един под властью доктора Дориана Воркса. Технократическая администрация может сохранить военные директораты как орудия восстановления либо подвергнуть чрезвычайные лаборатории и плановые бюро официальной проверке."
 ADISCORD_vorkerland_story.6.worker.a: "Сохранить чрезвычайный штаб для восстановления."
 ADISCORD_vorkerland_story.6.worker.b: "Вернуть полномочия гражданским министерствам."
 ADISCORD_vorkerland_story.6.joint.a: "Подчинить советы общему командованию."
 ADISCORD_vorkerland_story.6.joint.b: "Издать хартию провинциальных гарантий."
 ADISCORD_vorkerland_story.6.worx.a: "Доктор Воркс сохранит технократические директораты."
 ADISCORD_vorkerland_story.6.worx.b: "Проверить чрезвычайные лаборатории."
 ADISCORD_vorkerland_story.7.t: "Рабочее правительство объединяет Воркерланд"
 ADISCORD_vorkerland_story.7.d: "Последний фронт в центре страны закрыт. Рабочая республика под руководством [ROOT.GetLeader] восстановила единую администрацию Воркерланда и начала преобразовывать чрезвычайные комитеты в органы мирного восстановления."
 ADISCORD_vorkerland_story.7.a: "Рабочая республика выиграла войну."
 ADISCORD_vorkerland_story.8.t: "Коалиция Влада объединяет Воркерланд"
 ADISCORD_vorkerland_story.8.d: "Последний фронт в центре страны закрыт. Коалиция Влада и уцелевшие совместные советы восстановили единый Воркерланд. Новой власти предстоит найти равновесие между центральным командованием и обещаниями, которые во время войны давали провинциальным союзникам."
 ADISCORD_vorkerland_story.8.a: "Коалиция Влада выиграла войну."
 ADISCORD_vorkerland_story.9.t: "Доктор Воркс объединяет Воркерланд"
 ADISCORD_vorkerland_story.9.d: "Последний фронт в центре страны закрыт. Доктор Дориан Воркс объединил Воркерланд под управлением технократической администрации. Военные директораты уже составляют планы восстановления в показателях выработки энергии, перевозок и производства."
 ADISCORD_vorkerland_story.9.a: "Технократы выиграли войну."
 ADISCORD_vorkerland_story.10.t: "Уоркер жив и находится у лоялистов"
 ADISCORD_vorkerland_story.10.d: "Через сутки после взрыва в Башне Единства охрана вывела Никиту Уоркера из нижних ярусов комплекса. Запись его обращения передали фронтовые радиостанции: центральное радио больше не работает. Председатель заявил, что переходный период не завершён, чрезвычайные полномочия остаются в силе, а любой, кто говорит от имени республики помимо него, является мятежником. Округа, всю неделю ждавшие известий о его смерти, теперь должны решить, как относиться к живому председателю."
 ADISCORD_vorkerland_story.10.a: "Председатель выжил."
 ADISCORD_vorkerland_story.11.t: "Петрищев вывозит Уоркера из-под обломков"
 ADISCORD_vorkerland_story.11.d: "Колонна Центрального округа добралась до оцепления у Башни Единства раньше столичных чрезвычайных комитетов. Никиту Уоркера вынесли живым, но обожжённым, без охраны и без связи с собственным правительством. Влад Петрищев объявил, что законный глава государства находится под защитой армии, и в тот же день учредил при нём Объединённый чрезвычайный совет. В Гранд-Воркенсберге это сообщение восприняли иначе: там считают, что председателя не спасли, а захватили. Официальных разъяснений о том, кто из двоих теперь кому подчиняется, не последовало."
 ADISCORD_vorkerland_story.11.a: "Спасение или арест?"
 ADISCORD_vorkerland_story.12.t: "Уоркер пропал без вести"
 ADISCORD_vorkerland_story.12.d: "Спасательные команды разобрали три яруса Башни Единства, но не нашли ни председателя, ни его охраны, ни тела. Официальное сообщение повторяет вчерашнюю формулировку об «утрате связи с руководством». За сутки появились четыре версии, противоречащие друг другу: Уоркера вывезли служебным тоннелем на север; он остался под завалами нижних ярусов; в тот день его вообще не было в комплексе; его удерживает один из округов, который ещё не решил, как с ним поступить. Ни одна версия не подтверждена. Пока судьба председателя неизвестна, вопрос о преемнике остаётся открытым."
 ADISCORD_vorkerland_story.12.a: "Где Уоркер?"
 ADISCORD_vorkerland_story.13.t: "Никита Уоркер погиб"
 ADISCORD_vorkerland_story.13.d: "Тело председателя опознали на нижних ярусах Башни Единства, в нескольких десятках метров от зала, где двадцать пять лет подписывались все акты переходного периода. Сообщение о гибели короткое: без подробностей и без даты похорон. Никита Уоркер оставался последним, кто имел право говорить от имени всей конфедерации, а порядок преемственности был завязан лично на него. Законной процедуры передачи власти в Воркерланде больше нет, и округа, всю неделю ждавшие указаний из столицы, теперь будут решать сами."
 ADISCORD_vorkerland_story.13.a: "Уоркер погиб."
 ADISCORD_vorkerland_story.41.t: "Рабочее правительство капитулировало"
 ADISCORD_vorkerland_story.41.d: "Рабочая республика прекратила организованное сопротивление. Чрезвычайные комитеты, считавшие себя законными преемниками конституции, распускаются или переходят под чужое командование. Их архивы, штабы и списки достаются победителю. Сторонников федеративного Воркерланда больше не защищает ни одна армия."
 ADISCORD_vorkerland_story.41.a: "Одним претендентом меньше."
 ADISCORD_vorkerland_story.42.t: "Коалиция Влада капитулировала"
 ADISCORD_vorkerland_story.42.d: "Военная коалиция Изаии прекратила организованное сопротивление. Канцелярия, офицерские штабы и окружные склады переходят к победителю, а вместе с ними и вся вертикаль власти, которую Влад Петрищев выстраивал взамен распавшихся учреждений. Коалиция утверждала, что армия - последний работающий институт страны, но выиграть войну эта армия не смогла."
 ADISCORD_vorkerland_story.42.a: "Одним претендентом меньше."
 ADISCORD_vorkerland_story.43.t: "Директорат Воркса капитулировал"
 ADISCORD_vorkerland_story.43.d: "Технократическая администрация прекратила организованное сопротивление. Расчёты, чертежи и диспетчерские сети директоратов достаются победителю почти нетронутыми: их берегли тщательнее, чем дивизии. Проект, обещавший восстановить страну по плану, проиграл на фронте."
 ADISCORD_vorkerland_story.43.a: "Одним претендентом меньше."
 ADISCORD_vorkerland_story.31.t: "Уоркер объявил переходный период незавершённым"
 ADISCORD_vorkerland_story.31.d: "Никита Уоркер выступил перед фронтовыми советами и заявил, что переходный период не завершён, а значит, чрезвычайные полномочия остаются в силе. Прежнюю конфедерацию он назвал черновиком: страну предстоит собрать заново через фронтовые комитеты и личную верность председателю, минуя округа и их чиновников. В той же речи объявлены конкретные меры: рабочий призыв, набор добровольцев для свободных республик и обещание в итоге передать весь мандат одному человеку. Председатель прямо признал, что ради этого готов пожертвовать устойчивостью тыла."
 ADISCORD_vorkerland_story.31.a: "Чрезвычайное положение продлено."
 ADISCORD_vorkerland_story.32.t: "Багли делает ставку на снабжение"
 ADISCORD_vorkerland_story.32.d: "Антон Багли, возглавивший рабочее правительство после взрыва в Башне Единства, отказался от революционной риторики. Правительство обязуется публиковать нормы пайка и выработки, сроки поставок и открыто признавать ответственность, если они сорваны. Законность своей власти Багли предлагает оценивать по выполненным обязательствам, а не по преемству или личной верности. Наступление при таком курсе пойдёт медленнее, зато тыл должен выдержать долгую войну."
 ADISCORD_vorkerland_story.32.a: "Посмотрим, сдержит ли он слово."
 ADISCORD_vorkerland_story.33.t: "Петрищев требует имперского мандата"
 ADISCORD_vorkerland_story.33.d: "Влад Петрищев заявил, что восстанавливать нужно не республику, а порядок, и что единственная надёжная форма порядка - иерархия. Канцелярия возвращает себе право издавать указы, офицерским семьям возвращают прежние владения и звания, гражданская администрация становится исполнительным аппаратом при штабах. Курс ведёт к реставрации империи - без прежней династии, но с прежним устройством. Штабы от этого выиграют, а в тылу вырастет недовольство. Иностранным партнёрам Петрищев предлагает признать его правительство законным в обмен на предсказуемого соседа."
 ADISCORD_vorkerland_story.33.a: "Петрищев метит в императоры."
 ADISCORD_vorkerland_story.34.t: "В Изаии созвано двухпалатное собрание"
 ADISCORD_vorkerland_story.34.d: "Объединённый чрезвычайный совет объявил, что спасённый председатель и окружная гвардия будут управлять страной совместно, и созвал в Изаии двухпалатное собрание. Одна палата представляет округа и командование, другая - рабочие районы. Открыты районные списки, и вместе с ними объявлен широкий призыв. Такое устройство громоздко, и армия будет наступать медленно, зато государство не рухнет от одного удара по столице."
 ADISCORD_vorkerland_story.34.a: "Власть поделили на двоих."
 ADISCORD_vorkerland_story.35.t: "Директорат объявляет непрерывную мобилизацию"
 ADISCORD_vorkerland_story.35.d: "Воркенсбергский директорат опубликовал расчёт, согласно которому главный дефицит в этой войне - время, а не люди и станки. Гражданская энергосеть переводится на нужды фронта, население учитывается в балансе как рабочая сила, исследовательские программы сокращаются ради выпуска продукции. Доктор Дориан Воркс подписал документ без оговорок. План предполагает сознательный износ промышленности и победу до того, как она остановится; ошибка в сроках может погубить всю систему."
 ADISCORD_vorkerland_story.35.a: "Всё для фронта."
 ADISCORD_vorkerland_story.36.t: "Директорат вводит протокол сохранения"
 ADISCORD_vorkerland_story.36.d: "Воркенсбергский директорат опубликовал противоположный расчёт: главный дефицит - обученные специалисты, и тратить их ради темпа наступления запрещено. Конструкторские бюро эвакуируют вглубь страны, специалистов отзывают с фронтовых работ, оборону строят с расчётом на минимальные затраты, а исследования продолжаются во время войны. По словам доктора Дориана Воркса, республика может проиграть на карте и всё равно выиграть в знаниях. В тексте протокола прямо сказано, что наступательные возможности армии заметно снизятся."
 ADISCORD_vorkerland_story.36.a: "Директорат бережёт кадры."
# --- rus_last_empire_l_russian ---
 RUS_summon_the_aimaqs: "Собрать аймаки"
 RUS_summon_the_aimaqs_desc: "Вольные аймаки терпят общего представителя только когда чужая армия уже стоит у пастбищ. Ханский стяг поднимают не ради столичной канцелярии, а чтобы соседи поняли, кто будет говорить за степь."
 RUS_arm_the_border_hosts: "Вооружить пограничные сотни"
 RUS_arm_the_border_hosts_desc: "Общины и так держат оружие. Нужно только собрать винтовки, людей и тех, кто ещё помнит, как вести сотню не по своему улусу, а по чужой дороге."
 RUS_watch_the_western_scar: "Сторожить западный рубеж"
 RUS_watch_the_western_scar_desc: "Западный край молчит слишком давно. Если Грязная зона откроется, первыми это увидят не столицы претендентов, а дозоры Земли Хана."
 RUS_claim_the_opened_zone: "Заявить права на открытую зону"
 RUS_claim_the_opened_zone_desc: "Поселения Грязной зоны появились без хозяина. Ханская земля не будет ждать, пока кто-то другой назовёт их буфером или протекторатом."
 RUS_drive_starolesye_back: "Отбросить Старолесье"
 RUS_drive_starolesye_back_desc: "Старолесская республика встала на западном поясе. Пока она держит соседние штаты, любая ханская армия остаётся запертой в бункере."
 RUS_press_the_closed_zone: "Нажать на закрытую зону"
 RUS_press_the_closed_zone_desc: "Соседи Грязной зоны живут порознь и воюют порознь. Земля Хана может брать их по одному, не втягиваясь в чужую войну за Башню."
 RUS_seat_the_khan_chancery:0 "Учредить имперскую канцелярию"
 RUS_seat_the_khan_chancery_desc: "Если аймаки удержат захваченные земли, вольница должна получить постоянную канцелярию. Иначе победа останется набегом."
 RUS_summon_the_aimaqs_tt: "Аймаки принимают общий сбор как защиту земли, а не как новую столичную власть."
 RUS_watch_the_western_scar_tt: "Дозоры ждут открытия Грязной зоны. Сама война начнётся только отдельными решениями."
 RUS_claim_the_opened_zone_tt: "Земля Хана заявляет права на западный пояс Грязной зоны. Войны открываются решениями, а не этим фокусом."
 RUS_claim_the_opened_zone_available_tt: "Грязная зона должна быть уже открыта."
 RUS_drive_starolesye_back_available_tt: "Старолесье должно существовать либо уже идёт ханская пограничная война."
 RUS_press_the_closed_zone_available_tt: "Старолесье должно быть поглощено либо уже не существовать."
 RUS_seat_the_khan_chancery_available_tt: "Нужно удержать хотя бы два соседних образования Грязной зоны."
 ADISCORD_vorkerland_rus_dirty_campaign_category: "Ханский поход"
 ADISCORD_vorkerland_rus_dirty_campaign_category_desc: "Земля Хана берёт соседей Грязной зоны по одному фронту. Новая война не начинается, пока не закрыта предыдущая."
 RUS_campaign_sla: "Добить Старолесье"
 RUS_campaign_sla_desc: "Пограничная война оставила республику без западного пояса. Теперь Земля Хана забирает оставшиеся старолесские земли."
 RUS_campaign_rza: "Идти на реакторный пояс"
 RUS_campaign_rza_desc: "Союз Реакторной зоны держит заражённый промышленный узел. Ханская армия берёт его только при общей границе и свободном фронте."
 RUS_campaign_mlr: "Занять малую низину"
 RUS_campaign_mlr_desc: "Республика Малой низины лежит на следующем участке после Старолесья. Её берут отдельно, не смешивая с другими войнами."
 RUS_campaign_ert: "Потребовать Восточную республику"
 RUS_campaign_ert_desc: "Восточная республика становится целью только когда ханские владения уже касаются её границы."
 RUS_campaign_irt: "Потребовать внутренние земли"
 RUS_campaign_irt_desc: "Республика Внутренних земель открывается тем же правилом: общая граница, один фронт, полный захват."
 RUS_campaign_sca: "Потребовать Южную федерацию"
 RUS_campaign_sca_desc: "Южная федерация - дальний сосед. Решение появляется только после того, как ханская земля дошла до её рубежа."
 RUS_proclaim_the_last_empire:0 "Провозгласить общую державу"
 RUS_proclaim_the_last_empire_desc:0 "После объединения соседей правительство закрепляет устройство новой державы. Перевес Чёрной армии даст Империю Чёрного Знамени, перевес учёных - Державу Восстановления, а равновесие - Последнюю империю. Марк Рустан остаётся у власти, а внешнее противостояние с гегемоном остаётся общим испытанием."
 RUS_campaign_sla_tt: "Объявляет войну Старолесью и требует все его земли."
 RUS_campaign_rza_tt: "Объявляет войну Союзу Реакторной зоны и требует все его земли."
 RUS_campaign_mlr_tt: "Объявляет войну Республике Малой низины и требует все её земли."
 RUS_campaign_ert_tt: "Объявляет войну Восточной республике и требует все её земли."
 RUS_campaign_irt_tt: "Объявляет войну Республике Внутренних земель и требует все её земли."
 RUS_campaign_sca_tt: "Объявляет войну Южной федерации и требует все её земли."
 RUS_campaign_sla_border_tt: "Нужна сухопутная граница со Старолесьем."
 RUS_campaign_rza_border_tt: "Нужна сухопутная граница с Союзом Реакторной зоны."
 RUS_campaign_mlr_border_tt: "Нужна сухопутная граница с Республикой Малой низины."
 RUS_campaign_ert_border_tt: "Нужна сухопутная граница с Восточной республикой."
 RUS_campaign_irt_border_tt: "Нужна сухопутная граница с Республикой Внутренних земель."
 RUS_campaign_sca_border_tt: "Нужна сухопутная граница с Южной федерацией."
 RUS_proclaim_the_last_empire_available_tt: "Нужно удержать не меньше трёх соседей Грязной зоны либо не оставить там самостоятельных республик."
 RUS_proclaim_last_empire_prepared_tt: "Сначала завершите военную подготовку: «Второй сбор аймаков» и «Вооружить пограничные заставы» дадут пять и три стрелковые бригады до начала кризиса."
 RUS_last_empire_cosmetic_tt:0 "Держава принимает имя по перевесу сил: Империя Чёрного Знамени при перевесе Чёрной армии, Держава Восстановления при перевесе учёных или Последняя империя при равновесии. Марк Рустан и его идеология сохраняются."
 RUS_arm_the_border_hosts_tt: "Формирует три стрелковые бригады в столице из выделенных людей и винтовок."
 RUS_proclaim_the_last_empire_peace_tt: "Нужен мир на всех фронтах, не только закрытый поход по Грязной зоне."

