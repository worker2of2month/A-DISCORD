 ADISCORD_vorkerland_phase_side_committees_tt:0 "Пакет комитетов (влияние §Y[?global.ADISCORD_vorkerland_camp_committees|0]§!): от §Y50§! - §Y6000§! £infantry_equipment_texticon и §Y50§! £political_power_texticon, от §Y75§! - ещё §Y5000§! £manpower_texticon и §Y40§! единиц снаряжения поддержки. Пакет получает претендент этого лагеря, кем бы вы ни играли."
