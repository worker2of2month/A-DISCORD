 ADISCORD_vorkerland_prep_military_evacuation:0 "Поручить эвакуацию канцелярии Влада: [FROM.GetName]"
 ADISCORD_vorkerland_prep_military_evacuation_desc:0 "Завершённая цепочка обеспечит спасение Уоркера Владом и создание совместного правительства. Поддерживаемый претендент не меняется.\n\nПолучатель: [ROOT.GetVorkerlandPrepPatron]. Второй проект этого объекта станет недоступен. После завершения потребуется защитить приказ от встречного распоряжения."
