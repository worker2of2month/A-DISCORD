 faction_vorkerland_free_republics_league: "Лига свободных республик"

 ADISCORD_vorkerland_news.3.t: "Выборы в Воркерланде"
 ADISCORD_vorkerland_news.3.worker.d: "Избирательные комиссии Воркерланда объявили победу Никиты Уоркера. После победы в гражданской войне он вынес вопрос о своих полномочиях на голосование и сохранил руководство страной. Неоворкеризм остаётся государственной идеологией.\n\nЧрезвычайное правительство получило выборный мандат. Для соседних республик этот результат означает сохранение прежнего руководства в восстановленном Воркерланде."
 ADISCORD_vorkerland_news.3.yastrebtsev.d: "Избирательные комиссии Воркерланда объявили победу Марка Ястребцева. Никита Уоркер уступает руководство страной по итогам голосования, проведённого после окончания гражданской войны. Гуманисты получают правительственный мандат.\n\nСмена власти завершает правление чрезвычайного кабинета. Восстановление страны теперь возглавит новое правительство."
 ADISCORD_vorkerland_news.3.filopo.d: "Избирательные комиссии Воркерланда объявили победу Некро Филопо. Голосование, назначенное после окончания гражданской войны, лишило Никиту Уоркера руководства страной и привело к власти шовинистов.\n\nНовому правительству достаётся государство, едва пережившее распад. Его политический курс будут внимательно отслеживать как бывшие участники конфедерации, так и внешние соседи."
 ADISCORD_vorkerland_news.3.a: "Результат объявлен."

 ADISCORD_vorkerland_news.4.t: "Воркерланд восстанавливает Башню Единства"
 ADISCORD_vorkerland_news.4.d: "После окончания гражданской войны правительство [ROOT.GetNameDef] объявило о восстановлении Башни Единства. Рабочие, инженеры и архивисты возвращают комплексу его прежний силуэт и готовят его снова стать центром управления, связи и памяти объединённой страны. Для каждого из претендентов этот проект означает своё: восстановить республику можно только вместе с её символами."
 ADISCORD_vorkerland_news.4.a: "Башня снова станет символом единства."
