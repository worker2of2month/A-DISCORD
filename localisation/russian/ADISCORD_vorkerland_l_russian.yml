 RUS_scientists_side:0 "Учёные"
 RUS_black_army_side:0 "Чёрная армия"
 RUS_scientists_influence:0 "Вес лабораторий"
 RUS_scientists_dominance:0 "Власть учёных"
 RUS_black_army_influence:0 "Вес Чёрной армии"
 RUS_black_army_dominance:0 "Власть Чёрной армии"
 RUS_faction_support:0 "Поддержка учёных и Чёрной армии"
 RUS_faction_support_state_tt:0 "Поддержка Чёрной армии: §Y[?RUS_black_army_support|%0]§!, учёных: §Y[?RUS_scientists_support|%0]§!. Поддержка выше 50% приносит £political_power_texticon и тянет баланс к своей стороне."
 RUS_bop_relief_support_tt:0 "Поддержка §YУчёных§!: §G+15%§!. Поддержка §YЧёрной армии§!: §R-10%§!."
 RUS_bop_reserve_support_tt:0 "Поддержка §YЧёрной армии§!: §G+15%§!. Поддержка §YУчёных§!: §R-10%§!."
 RUS_black_army_banner_delta:0 "Изменение «Чёрной Армии»"
 RUS_course_scientists_10_tt:0 "Баланс власти: §Y10%§! в сторону §YУчёных§!."
 RUS_course_scientists_15_tt:0 "Баланс власти: §Y15%§! в сторону §YУчёных§!."
 RUS_course_black_army_10_tt:0 "Баланс власти: §Y10%§! в сторону §YЧёрной армии§!."
 RUS_course_black_army_15_tt:0 "Баланс власти: §Y15%§! в сторону §YЧёрной армии§!."
 RUS_support_scientists_10_tt:0 "Поддержка §YУчёных§!: §G+10%§!."
 RUS_support_black_army_10_tt:0 "Поддержка §YЧёрной армии§!: §G+10%§!."
 RUS_scientists_council:0 "Учёный совет при Хане"
 RUS_scientists_council_desc:0 "Перепись показала, что бункер держится не только на солдатах. Инженеры, химики и врачи годами чинили насосы, фильтры и генераторы, не имея голоса в делах страны. Марк Рустан соберёт их в учёный совет и сам возглавит его заседания: знания подземелья станут государственным делом, а не частной заботой отдельных мастерских."
 RUS_scientists_workshops:0 "Мастерские учёного совета"
 RUS_scientists_workshops_desc:0 "Совет сведёт разрозненные сметы мастерских в один фонд. Деньги поступят в казну и смогут оплатить конкретные работы, а в столичном районе заранее отведут площадку под следующий цех. Учёные получают средства, за которые придётся отчитываться перед Ханом."
 RUS_scientists_power_compact:0 "Свет и хлеб подземелья"
 RUS_scientists_power_compact_desc:0 "Учёные направят инженеров на дополнительное питание комплекса и постоянное производство продовольствия. Эти мощности принадлежат бункеру целиком и останутся полезны при любой планировке его слоёв. Чем лучше работают машины, тем весомее голос тех, кто их понимает."
 RUS_scientists_power_compact_tt:0 "Мощность бункера: §G+1§! £energy_consumption_texticon. Производство продовольствия: §G+1§! £supply_texticon в неделю."
 RUS_black_army_oath:0 "Присяга Чёрной армии"
 RUS_black_army_oath_desc:0 "Чёрная армия выросла из сотен, которые защищали входы в бункер. Теперь Марк Рустан лично принимает её присягу: каждый аймак назовёт людей для общего резерва, а столичная служба снабдит их инженерным оснащением. Армия получает настоящую опору, а Хан - войско, которое отвечает только перед ним."
 RUS_black_army_staff:0 "Штаб Чёрной армии"
 RUS_black_army_staff_desc:0 "Штаб начинает с хозяйства фронта: склады должны иметь ответственных, эшелоны - расписание, инженерные части - инструмент. Отдельная поставка даст командованию средства превратить приказы в работающий тыл."
 RUS_black_army_banner:0 "Устав Чёрного Знамени"
 RUS_black_army_banner_desc:0 "Единый устав свяжет разведку, эшелонированную оборону и подготовку общего наступления. Ни одна сотня не оставит соседнюю без помощи, а штаб обязан заранее готовить рубежи. Устав превратит армию Хана в силу, с которой придётся считаться и учёным."
 RUS_experimental_laboratories:0 "Экспериментальные лаборатории"
 RUS_experimental_laboratories_desc:0 "Научное крыло бункера выросло, но настоящие образцы лежат не под землёй. Вокруг разрушенного реактора нулевой точки остались цеха, склады сплавов и уцелевшие компоненты старого Воркерланда. Учёные Хана откроют полевые лаборатории у границы реакторной зоны и возьмутся за проекты, которые прежде считались невозможными."
 RUS_experimental_laboratories_tt:0 "Проекты лабораторий требуют контроля хотя бы одной реакторной зоны. После «Реакторных сплавов» станет доступен единственный §Yвоздушный линкор§!."
 RUS_experimental_labs_category:0 "Экспериментальные лаборатории"
 RUS_experimental_labs_category_desc:0 "Полевые лаборатории берут образцы из руин старого промышленного центра вокруг реактора. Одновременно идёт только один проект. Работы возможны, пока Хан контролирует хотя бы одну реакторную зону - Северную, Восточную, Западную или Южную - и пока Чёрная армия не подчинила себе государство. Если все реакторные зоны или столица будут потеряны, проект прервётся, а оплата вернётся полностью."
 RUS_lab_reactor_alloys:0 "Реакторные сплавы"
 RUS_lab_reactor_alloys_desc:0 "Учёные извлекут из руин реакторного комплекса образцы лёгких жаропрочных сплавов и восстановят способы их обработки. Проект даёт промышленный задел и материал для корпуса будущего воздушного линкора. Работы длятся 60 дней."
 RUS_lab_reactor_alloys_cost:0 "§Y50§! £political_power_texticon  §Y300§! £ADISCORD_economy_treasury_texticon"
 RUS_lab_reactor_alloys_cost_blocked:0 "§R50§! £political_power_texticon  §R300§! £ADISCORD_economy_treasury_texticon"
 RUS_lab_reactor_alloys_cost_tooltip:0 "Нужно 50 £political_power_texticon и 300 £ADISCORD_economy_treasury_texticon."
 RUS_lab_reactor_alloys_support_tt:0 "Поддержка §YУчёных§!: §G+10%§!. Поддержка §YЧёрной армии§!: §R-5%§!.\nОткрывает проект §YВоздушный линкор§!."
 RUS_lab_zeppelin:0 "Воздушный линкор"
 RUS_lab_zeppelin_desc:0 "В архивах старого Воркерланда сохранились чертежи бронированного дирижабля, который так и не поднялся в воздух. С реакторными сплавами и уцелевшими двигателями учёные могут собрать единственный корпус. Экипаж набирается сразу. Второй корабль построить не удастся, а потерянный корпус нечем заменить. Работы длятся 150 дней."
 RUS_lab_zeppelin_cost:0 "§Y100§! £political_power_texticon  §Y1000§! £ADISCORD_economy_treasury_texticon  §Y400§! £manpower_texticon"
 RUS_lab_zeppelin_cost_blocked:0 "§R100§! £political_power_texticon  §R1000§! £ADISCORD_economy_treasury_texticon  §R400§! £manpower_texticon"
 RUS_lab_zeppelin_cost_tooltip:0 "Нужно 100 £political_power_texticon, 1000 £ADISCORD_economy_treasury_texticon и 400 £manpower_texticon на экипаж."
 RUS_lab_zeppelin_result_tt:0 "В столице появится §YВоздушный линкор «Цепелин»§! с полным экипажем и вооружением. Поддержка §YУчёных§! и §YЧёрной армии§!: §G+10%§!."
 RUS_lab_reactor_access_tt:0 "Хан контролирует хотя бы одну реакторную зону: Северную, Восточную, Западную или Южную."
 RUS_lab_slot_free_tt:0 "В лабораториях не идёт другой проект."
 RUS_lab_not_under_black_army_tt:0 "Чёрная армия не подчинила себе государство: баланс не дальше 60% в её сторону."
 RUS_lab_cancel_warning_tt:0 "Если Хан потеряет все реакторные зоны или столицу, проект прервётся, а вся оплата вернётся."
 RUS_lab_refunded_tt:0 "Проект прерван. Политическая власть, казна и экипаж возвращены."
 RUS_reactor_belt_inventory:0 "Опись реакторного пояса"
 RUS_reactor_belt_inventory_desc:0 "Вокруг реактора стоят остовы заводов старого Воркерланда. Под обрушенными перекрытиями лежат станы, печи и склады металла, до которых никто не добирался с аварии. Инженеры Хана составят опись: что можно поднять, что придётся резать и где ещё держатся несущие стены. Первые трофеи пойдут в казну сразу."
 RUS_reactor_foundries:0 "Литейные пояса"
 RUS_reactor_foundries_desc:0 "Восстановленный цех - только начало. Рядом с ним можно поставить литейную, которая будет перерабатывать поднятый металл на месте, а не везти лом через полстраны. Каждый поднятый завод пояса получит собственный военный цех."
 RUS_reactor_foundries_tt:0 "Каждый уже восстановленный завод пояса, которым мы владеем и управляем: §G+1§! слот и §G+1§! военный завод. Заводы, восстановленные позже, получат то же сразу."
 RUS_reactor_sorties:0 "Вылазки в реактор"
 RUS_reactor_sorties_desc:0 "Самое ценное лежит там, где нельзя жить: в цехах у самого ядра. Добровольцы в защитных костюмах будут уходить за периметр на несколько дней и возвращаться с приборами, сплавами и документами. Возвращаются не все."
 RUS_reactor_decontamination:0 "Дезактивационные бригады"
 RUS_reactor_decontamination_desc:0 "Учёные научили вылазочные группы мыть снаряжение, менять фильтры и выходить из зоны по проверенным коридорам. Потерь становится меньше, а добыча - тяжелее."
 RUS_reactor_decontamination_tt:0 "Вылазки в реактор: потери §G500§! £manpower_texticon вместо 1000, добыча §G+250§! £ADISCORD_economy_treasury_texticon вместо 150."
 RUS_reactor_belt_category:0 "Реакторный пояс"
 RUS_reactor_belt_category_desc:0 "Шесть регионов вокруг реактора - Северная, Восточная, Западная и Южная реакторные зоны, Восточная Серая полоса и Марден - хранят погребённые запасы старой промышленности. Сейчас там разрабатывается лишь лом с поверхности.\n\nВосстановление завода возвращает региону погребённые ресурсы, слот и гражданский завод. Одновременно восстанавливается один регион; при его потере проект отменяется, а оплата возвращается. Вылазки в реактор требуют контроля хотя бы одной реакторной зоны."
 RUS_restore_reactor_works:0 "Восстановить заводы: [FROM.GetName]"
 RUS_restore_reactor_works_desc:0 "Разобрать завалы, укрепить уцелевшие пролёты и запустить цех заново. Работы длятся 120 дней."
 RUS_restore_reactor_works_cost:0 "§Y50§! £political_power_texticon  §Y400§! £ADISCORD_economy_treasury_texticon"
 RUS_restore_reactor_works_cost_blocked:0 "§R50§! £political_power_texticon  §R400§! £ADISCORD_economy_treasury_texticon"
 RUS_restore_reactor_works_cost_tooltip:0 "Нужно 50 £political_power_texticon и 400 £ADISCORD_economy_treasury_texticon."
 RUS_reactor_works_idle_tt:0 "В поясе не восстанавливается другой завод."
 RUS_reactor_works_cancel_tt:0 "Если регион будет потерян, работы прекратятся, а вся оплата вернётся."
 RUS_reactor_works_refund_tt:0 "Работы прекращены. Политическая власть и казна возвращены."
 RUS_reactor_works_result_tt:0 "Регион получает обратно погребённые ресурсы, §G+1§! слот и §G+1§! гражданский завод. После «Литейных пояса» - ещё §G+1§! слот и §G+1§! военный завод."
 RUS_reactor_sortie:0 "Вылазка в реактор"
 RUS_reactor_sortie_desc:0 "Отправить группу добровольцев к ядру реактора за приборами, сплавами и архивами. Группа уходит на 30 дней; часть людей не вернётся при любом исходе. Повторение через 60 дней."
 RUS_reactor_sortie_cost:0 "§Y25§! £political_power_texticon  §Y[GetRUSReactorSortieCrew]§! £manpower_texticon"
 RUS_reactor_sortie_cost_blocked:0 "§R25§! £political_power_texticon  §R[GetRUSReactorSortieCrew]§! £manpower_texticon"
 RUS_reactor_sortie_cost_tooltip:0 "Нужно 25 £political_power_texticon и [GetRUSReactorSortieCrew] £manpower_texticon: эти люди потеряны для резерва."
 RUS_reactor_sortie_crew_full:0 "1000"
 RUS_reactor_sortie_crew_decontaminated:0 "500"
 RUS_reactor_sortie_losses_tt:0 "Людские потери списываются при выходе группы и не возвращаются."
 RUS_reactor_sortie_cancel_tt:0 "Группа отозвана без добычи. Потери не возвращаются."
 RUS_reactor_sortie_result_tt:0 "Казна: §G+150§! £ADISCORD_economy_treasury_texticon (§G+250§! после «Дезактивационных бригад»). Поддержка §YУчёных§!: §G+5%§!."
 RUS_Varlam_Oskol:0 "Варлам Оскол"
 RUS_black_banner_empire:0 "Империя Чёрного Знамени"
 RUS_black_banner_empire_DEF:0 "Империи Чёрного Знамени"
 RUS_black_banner_empire_ADJ:0 "чернознамёнск."
 RUS_restoration_state:0 "Держава Восстановления"
 RUS_restoration_state_DEF:0 "Державы Восстановления"
 RUS_restoration_state_ADJ:0 "восстановленч."
 ADISCORD_rus_crisis.4.government.t:0 "Распад единой державы"
 ADISCORD_rus_crisis.4.army.d:0 "Чёрное Знамя опущено. Чёрная армия Хана потерпела поражение, Марк Рустан отстранён, а единый штаб больше не связывает западные республики в одно государство. Местные правления возвращаются на земли распавшейся империи.\n\nНаше правительство может оставить эти осколки самостоятельными или по отдельности учредить в них санитарно-пограничные управления. Каждая спецзона оформляется отдельным решением; земли соседних государств в этот раздел не входят."
 ADISCORD_rus_crisis.4.reconstruction.d:0 "Держава Восстановления не выдержала войны. Учёный совет Хана распущен, Марк Рустан отстранён, а общие учреждения больше не связывают западные республики. Местные правления возвращаются к собственным границам и бюджетам.\n\nНаше правительство может оставить эти осколки самостоятельными или по отдельности учредить в них санитарно-пограничные управления. Каждая спецзона оформляется отдельным решением; земли соседних государств в этот раздел не входят."
