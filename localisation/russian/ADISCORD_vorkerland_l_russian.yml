 WKR_assault_column_programme:0 "Подготовить ударную рабочую колонну"
 WKR_assault_column_programme_desc:0 "Делегаты двух советов сверяют списки у ворот сборного лагеря. Вчера эти люди встречались на общих собраниях, сегодня им предстоит действовать как одна часть. Командиры начинают с самого трудного: добиться, чтобы каждый отряд слышал приказ, обращённый ко всей колонне."
 WKR_assault_column_unlock_tt:0 "Открывает обычный набор ударных колонн и отдельную оплачиваемую подготовку одной колонны из двух рабочих советов."
 WKR_assault_column_order_tt:0 "Два совета прекращают работу в цехах. После подготовки WKR получит в своей столице одну ударную колонну из шести ополченческих батальонов, полностью укомплектованную оплаченными людьми и винтовками. Начальный опыт: §Y30%§!."
 WKR_assault_column_result_tt:0 "WKR получит в своей столице одну ударную колонну: §Y6§! ополченческих батальонов, полная комплектность, начальный опыт §Y30%§!."
 WKR_assault_column_pending:0 "Готовится §Y1§! ударная колонна из §Y6§! ополченческих батальонов; занято §Y2§! совета. Оплачено: §Y[?WKR_council_order_pp|0]§! £political_power_texticon §Y[?WKR_council_order_manpower|0]§! £population_texticon §Y[?WKR_council_order_rifles|0]§! £infantry_equipment_texticon. Это подготовка, а не развёрнутая часть."
 WKR_assault_column_unit:0 "Ударная рабочая колонна"
 WKR_assault_column_cost:0 "§Y60§! £political_power_texticon §Y6000§! £population_texticon §Y5400§! £infantry_equipment_texticon"
 WKR_assault_column_cost_blocked:0 "§R60§! £political_power_texticon §R6000§! £population_texticon §R5400§! £infantry_equipment_texticon"
 WKR_assault_column_cost_tooltip:0 "§Y60§! £political_power_texticon §Y6000§! £population_texticon §Y5400§! £infantry_equipment_texticon"

 WKR_volunteer_expedition_unlock_tt:0 "Допуск действует до завершения гражданской кампании. В мирное время можно предложить воюющей стране свои существующие дивизии через отправку добровольцев; требуются её согласие и соблюдение обычных ограничений этой дипломатической акции."
 WKR_pattern_contract_unlock_tt:0 "Заказ доставляет §G100§! £support_equipment_texticon, промышленный исследовательский бонус и временную программу освоения зарубежных образцов."
 VAD_guards_programme:0 "Сформировать гвардейский полк в округе"
 VAD_guards_programme_desc:0 "Окружные списки открывают рядом с полковым знаменем. Кадровые солдаты принимают местное пополнение, инженеры проверяют обоз, а канцелярия закрепляет за полком его первый гарнизон."
 VAD_local_militia_programme:0 "Организовать местное ополчение"
 VAD_local_militia_programme_desc:0 "Совет выбирает командиров среди тех, кого знают на улицах округа. Совместные патрули сменяют безымянные караулы, и за приказом коменданта впервые появляются подписи соседей."
 VAD_guards_doctrine_context_tt:0 "Действует независимое имперское правительство Петричева; гражданская кампания продолжается."
 VAD_local_militia_doctrine_context_tt:0 "Действует независимое совместное правительство Уоркера и Петричева; гражданская кампания продолжается."
 VAD_guards_focus_site_tt:0 "Удерживаем хотя бы один округ с действующей хартией, неиспользованным набором и без восстания или демилитаризации."
 VAD_local_militia_focus_site_tt:0 "Удерживаем хотя бы одну действующую комендатуру без восстания, местного ополчения или демилитаризации."
 VAD_guards_available_tt:0 "Имперское правительство продолжает гражданскую кампанию. Округ принадлежит нам и удерживается, имеет хартию и неиспользованный набор; нет восстания или демилитаризации."
 VAD_local_militia_available_tt:0 "Совместный кабинет продолжает гражданскую кампанию. Округ принадлежит нам и удерживается; действует комендатура, нет восстания, местного ополчения или демилитаризации."
 VAD_guards_unlock_tt:0 "Открывает подготовку гвардейского полка из четырёх пехотных батальонов и инженеров: §Y3000§! £population_texticon поступают из неиспользованного окружного набора, остальной личный состав и вооружение оплачиваются заказом."
 VAD_local_militia_unlock_tt:0 "Местное ополчение снижает рост недовольства комендатурой и расширяет окружной призыв, занимая часть местных предприятий."
 VAD_guards_result_tt:0 "В области §Y[FROM.GetName]§! будет сформирован один полностью укомплектованный гвардейский полк: четыре пехотных батальона и инженеры, §Y4300§! £population_texticon, начальный опыт §Y35%§!. Окружной набор даст §Y3000§! £population_texticon и будет использован; $VAD_crown_recruitment_disruption_tt$ Из оплаченного оснащения §Y60§! £support_equipment_texticon расходуются на организацию местного набора."
 VAD_local_militia_result_tt:0 "В области §Y[FROM.GetName]§! появится местное ополчение: недовольство §G-20§!, его ежемесячный рост §G-10§! (не ниже нуля), $MODIFIER_LOCAL_MANPOWER$ §G+10%§!, $MODIFIER_LOCAL_FACTORIES$ §R-5%§!. Оплаченные люди и вооружение остаются в окружной охране; полевая дивизия не создаётся. Действует до утраты администрации или конца гражданской кампании."
 VAD_doctrine_order_cancellation_tt:0 "При отмене вся оплата возвращается; окружной набор не расходуется. При объединении незавершённую оплату получает страна-преемник."
 VAD_local_militia:0 "Местное ополчение совместного кабинета"
 VAD_local_militia_desc:0 "Совет округа участвует в охране улиц и складов вместе с комендатурой."
 VAD_local_militia_tt:0 "Ежемесячный рост недовольства комендатурой: §G-10§! (не ниже нуля)."
 VAD_guard_regiment_unit:0 "Гвардейский полк восстановления"
 VAD_oath_pending_guards:0 "§YГвардейский полк: [var:VAD_oath_state.GetName]§! - окружной набор зарезервирован, оружие и дополнительный личный состав оплачены."
 VAD_oath_pending_local_militia:0 "§YМестное ополчение: [var:VAD_oath_state.GetName]§! - оплаченные люди и вооружение направлены в окружную охрану."
