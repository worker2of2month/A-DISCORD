 VAD_restore_district_order:0 "Восстановить порядок в округе"
 VAD_restore_district_order_desc:0 "Комендант запросил смену усталого караула. Штаб направит новые команды, восстановит связь с посёлками и вновь откроет дорогу к окружным складам."
 VAD_district_order_available_tt:0 "Округ действует и полностью удерживает область с комендатурой; недовольство не ниже 40, другой местной операции нет."
 VAD_district_order_result_tt:0 "Недовольство области снизится на §G60§!, до минимума §Y0§!. Местное восстание прекратится, комендатура сохранится и возобновит свою работу. Месячный прирост недовольства продолжится."
 VAD_district_order_cost:0 "§Y25§! £political_power_texticon §Y500§! £population_texticon"
