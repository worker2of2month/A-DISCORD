 ADISCORD_vorkerland_prep_concede_object_desc:0 "Наш пакет: [FROM.GetVorkerlandPrepRecipient]. Претендент соперничающего ведомства: [FROM.GetVorkerlandPrepRival].\n\n$ADISCORD_vorkerland_prep_yield_tt$"
 ADISCORD_vorkerland_prep_specialists_bonus:0 "Сохранённые специалисты Конфедерации"
 ADISCORD_vorkerland_preparation.1.t:0 "Кому доверить последний приказ"
 ADISCORD_vorkerland_preparation.1.d:0 "Ведомства ещё пользуются одной печатью, но подчиняются уже разным людям. Заводские советы требуют права защищать свои цеха. Канцелярия Влада собирает подписи командиров. Дориан Воркс предлагает передать аварийное управление тем, кто поддерживает связь и производство.\n\nНужно выбрать аппарат, которому будут адресованы подготовленные нами пакеты. Этот выбор открывает шесть объектов и два параллельных направления подготовки. Каждое завершённое распоряжение придётся защитить от соперничающего ведомства. При расколе можно возглавить любого претендента, но договоры и имущество сохранят своих получателей."
