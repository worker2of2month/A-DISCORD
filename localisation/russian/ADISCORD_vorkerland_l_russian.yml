 ADISCORD_vorkerland_prep_civil_evacuation:0 "Подготовить гражданскую эвакуацию: [FROM.GetName]"
 ADISCORD_vorkerland_prep_civil_evacuation_desc:0 "Завершённая и защищённая цепочка сохранит Уоркера у его сторонников. Уступка военной канцелярии заменит её спасением силами Влада.\n\nПолучатель: [ROOT.GetVorkerlandPrepPatron]. Второй проект этого объекта станет недоступен. После завершения потребуется защитить приказ от встречного распоряжения."
