 RUS_bunker_command_delta:0 "Зал последнего приказа"
 RUS_bunker_command:0 "Слой 5: зал последнего приказа"
 RUS_bunker_command_desc:0 "Отсюда видна вся страна - условными знаками на стене. За каждым знаком остаются живые люди, и теперь любая ошибка на карте тоже принадлежит Хану.\n\nСрок: 21 дн. Требуемая свободная мощность: 2. После сдачи слой занимает 2 мощности и даёт показанные ниже постоянные эффекты. На этом слое можно выбрать только одно помещение.\n$RUS_bunker_contract_tt$"
