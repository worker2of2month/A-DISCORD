 RUS_bunker_shelter_delta:0 "Жилой ярус"
 RUS_bunker_shelter:0 "Слой 1: жилой ярус"
 RUS_bunker_shelter_desc:0 "Семьи строителей должны жить рядом с тем, что они защищают. В списке жителей впервые появятся не только номера пропусков, но и имена детей.\n\nСрок: 21 дн. Требуемая свободная мощность: 1. После сдачи слой занимает 1 мощности и даёт показанные ниже постоянные эффекты. На этом слое можно выбрать только одно помещение.\n$RUS_bunker_contract_tt$"
