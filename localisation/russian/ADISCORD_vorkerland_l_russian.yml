 ADISCORD_vorkerland_prep_offer_eyr_desc:0 "Местные советы сохраняют свою страну и администрацию после общей победы. За союз получат 13500 £infantry_equipment_texticon.\n\nОплата списывается только после согласия другой страны и повторной проверки обеих сторон. Отказ бесплатен. До раскола договор заключён в пользу [ROOT.GetVorkerlandPrepPatron]: после независимости автономия вступит в его коалицию. Поздний договор действует сразу. Другой союз или война с этим штабом срывают вступление. Победа партнёра закрепляет самостоятельность."
 ADISCORD_vorkerland_prep_offer_eyr_tt:0 "Местные советы сохраняют свою страну и администрацию после общей победы. За союз получат 13500 £infantry_equipment_texticon. Сначала будет запрошено согласие правительства."
 ADISCORD_vorkerland_preparation.20.eyr.d:0 "[FROM.GetName] предлагает союз на следующих условиях. Местные советы сохраняют свою страну и администрацию после общей победы. За союз получат 13500 винтовок.\n\n[GetVorkerlandTreatyTiming] Другой союз или война с обещанным партнёром срывают договор. Он обязуется сохранить нашу страну после победы. Оплата и поставка произойдут одновременно при согласии; если обстановка уже изменилась, можно только закрыть предложение."
 ADISCORD_vorkerland_prep_cost_35_0_0_100_0_0:0 "§Y35§! £political_power_texticon §Y100§! £support_equipment_texticon"
 ADISCORD_vorkerland_prep_cost_35_0_0_100_0_0_blocked:0 "§R35§! £political_power_texticon §R100§! £support_equipment_texticon"
 ADISCORD_vorkerland_prep_cost_35_0_0_100_0_0_tooltip:0 "§Y35§! £political_power_texticon §Y100§! £support_equipment_texticon"
 ADISCORD_vorkerland_prep_offer_egc:0 "Зшат: признание окружного командования"
 ADISCORD_vorkerland_prep_offer_egc_desc:0 "Окружные офицеры сохраняют командование своей армией на время гражданской войны. За союз получат 100 £support_equipment_texticon. После объединения Зшатская хунта вместе со всей территорией и армией войдёт в восстановленный Воркерланд независимо от победившего претендента.\n\nОплата списывается только после согласия другой страны и повторной проверки обеих сторон. Отказ бесплатен. До раскола договор заключён в пользу [ROOT.GetVorkerlandPrepPatron]: после независимости автономия вступит в его коалицию. Поздний договор действует сразу. Другой союз или война с этим штабом срывают вступление. Договор не даёт послевоенной самостоятельности."
 ADISCORD_vorkerland_prep_offer_egc_tt:0 "На время войны хунта сохраняет своё командование и получает 100 £support_equipment_texticon. При объединении её территория и армия перейдут Воркерланду даже при действующем договоре. Сначала будет запрошено согласие правительства."
 ADISCORD_vorkerland_preparation.20.egc.d:0 "[FROM.GetName] предлагает союз на следующих условиях. Окружные офицеры сохраняют командование своей армией на время гражданской войны. За союз получат 100 £support_equipment_texticon. После объединения наша страна вместе со всей территорией и армией войдёт в восстановленный Воркерланд независимо от победившего претендента.\n\n[GetVorkerlandTreatyTiming] Другой союз или война с обещанным партнёром срывают договор. Договор не гарантирует послевоенной самостоятельности. Оплата и поставка произойдут одновременно при согласии; если обстановка уже изменилась, можно только закрыть предложение."
