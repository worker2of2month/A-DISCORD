 RUS_bunker_rush:0 "Форсировать проходку"
 RUS_bunker_rush_desc:0 "Две смены, дополнительные заряды и меньше времени на укрепление. Подземелье можно заставить уступить быстрее, но нельзя отменить его вес.\n\nСрок: 21 дн. Требуется прочность не ниже 55. По завершении: следующий слой; прочность -35. Ниже 40 включится аварийный режим: -5% выпуска военных заводов и -5% организации армии.\n$RUS_bunker_contract_tt$"
