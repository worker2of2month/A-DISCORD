 # Confederation preparation
 ADISCORD_vorkerland_prep_slot_tt:0 "Свободно одно из двух направлений подготовки"
 ADISCORD_vorkerland_prep_project_tt:0 "Объект под нашим контролем, и для него ещё не выбран проект"
 ADISCORD_vorkerland_prep_begin_tt:0 "Оплата закреплена за объектом. Незавершённая работа при потере области или расколе возвращает все вложенные ресурсы. Готовый проект вызовет спор о подчинении на 21 день."
 ADISCORD_vorkerland_prep_recipient_tt:0 "Получатель готового пакета: [FROM.GetVorkerlandPrepRecipient]. Смена игровой стороны не переносит пакет."
 ADISCORD_vorkerland_prep_finish_tt:0 "Проект готов. В течение 21 дня нужно защитить распоряжение или уступить объект сопернику. Молчание означает уступку."
 ADISCORD_vorkerland_prep_refund_tt:0 "Незавершённый проект возвращает все внесённые ресурсы и освобождает направление подготовки."
 ADISCORD_vorkerland_prep_yield_tt:0 "Готовый пакет и оплаченные материалы получит [FROM.GetVorkerlandPrepRival]. Повторного списания не будет."
 ADISCORD_vorkerland_prep_defend_tt:0 "Первоначальный получатель сохраняет объект. Спор закрывается окончательно."
 ADISCORD_vorkerland_prep_site_arsenal:0 "Центральный арсенал"
 ADISCORD_vorkerland_prep_cost_35_0_0_60_0_0:0 "§Y35§! £political_power_texticon §Y60§! £support_equipment_texticon"
 ADISCORD_vorkerland_prep_cost_35_0_0_60_0_0_blocked:0 "§R35§! £political_power_texticon §R60§! £support_equipment_texticon"
