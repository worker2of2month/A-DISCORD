 WRK_worx_civil_science_available_tt:0 "Самостоятельная директория действует; чрезвычайный режим не введён; совет контролирует институты"
 WRK_worx_operation_grand_programme:0 "§Y1 / 1§!: Программа коррекции"
 WRK_worx_grand_programme_available_tt:0 "Самостоятельная директория действует; чрезвычайный режим не введён; полномочия Уоркса не ограничены"
 WRK_worx_operation_restore_obedience:0 "§Y1 / 1§!: Чрезвычайные комиссары"
 WRK_worx_restore_obedience_available_tt:0 "Самостоятельная директория действует, Уоркс сохраняет личную власть и ультиматум ещё не истёк"
 ADISCORD_vorkerland_postwar.24.t:0 "Право записать возражение"
 ADISCORD_vorkerland_postwar.24.d:0 "Секретарь остановился на последней строке протокола. По прежнему порядку здесь следовало написать, что решение принято единогласно. На этот раз один из директоров попросил оставить его возражение. Уоркс долго смотрел на лист, затем поставил подпись в соседней графе.\n\nДля институтов это небольшая победа: отрицательный результат можно предъявить без признания в саботаже. Для доктора - первое напоминание, что восстановленная им страна умеет отвечать. Совет ещё не контролирует охрану и финансирование, но теперь его разногласия существуют на бумаге."
 ADISCORD_vorkerland_postwar.24.a:0 "Оставить в протоколе."
 ADISCORD_vorkerland_postwar.25.t:0 "Единственная подпись"
 ADISCORD_vorkerland_postwar.25.d:0 "На дверях кабинета больше нет часов приёма. Руководители институтов входят по вызову, оставляют отчёты и ждут новых распоряжений. Общий совет собирается реже: решения приходят раньше заседаний.\n\nУоркс называет это освобождением науки от канцелярии. В первый же день он возвращает программу с пометкой: согласования исключить, сроки сократить. Подпись доктора стала достаточным основанием. Объяснять последствия исполнителям придётся самостоятельно."
 ADISCORD_vorkerland_postwar.25.a:0 "Приступить немедленно."
 ADISCORD_vorkerland_postwar.26.t:0 "Тридцать пять дней"
 ADISCORD_vorkerland_postwar.26.d:0 "Доктор положил на стол два сорванных отчёта и объявил их частью одного заговора. Комиссарам предписано вернуть институты к единому порядку. На это отведено тридцать пять дней самостоятельной работы правительства.\n\nСовет не распускается. Его члены остаются в столице и собирают подписи под актом передачи управления на случай нового провала. Уоркс уверен, что времени достаточно. Исполнителям ещё предстоит найти средства, освободить исследовательский слот и завершить поручение до истечения срока."
 ADISCORD_vorkerland_postwar.26.a:0 "Отсчёт уже идёт."
 ADISCORD_vorkerland_postwar.27.t:0 "Институты отвечают"
 ADISCORD_vorkerland_postwar.27.d:0 "Комиссары вернулись с подписанными приказами и новой сеткой подчинения. Последние руководители, отказавшиеся признать полномочия доктора, покинули кабинеты. Отчёты снова поступают вовремя.\n\nУоркс объявил, что сопротивление было предусмотрено. Чрезвычайная директория сохраняет научные возможности, но её спокойствие держится на подчинении. Программы доктора продолжаются, а вслед за ними неизбежно вернутся новые требования."
 ADISCORD_vorkerland_postwar.27.a:0 "Продолжить работу."
 ADISCORD_vorkerland_postwar.28.t:0 "Без его разрешения"
 ADISCORD_vorkerland_postwar.28.d:0 "Срок истёк. Начальник охраны передал ключи представителям совета; распоряжения из личного кабинета больше не принимаются к исполнению. Уоркс требует вызвать руководителей институтов, но впервые никто не приходит.\n\nДоктор формально остаётся главой государства. Управление и принудительные программы у него отняты. Смена власти оставила разорванные производственные цепочки, взаимные обвинения и учреждения без руководителей. Совет остановил личное безумие, но восстановление управления потребует от страны новых усилий."
 ADISCORD_vorkerland_postwar.28.a:0 "Принять управление."
 ADISCORD_vorkerland_postwar.29.t:0 "Объект исследования"
 ADISCORD_vorkerland_postwar.29.d:0 "В новом государственном плане нет даты окончания. Уоркс вычеркнул её собственноручно: исправление человечества не может зависеть от календаря. Институты получают постоянные штаты, а ведомства - обязательства по участию в программе.\n\nГражданская война в официальных отчётах названа последним доказательством непригодности прежнего человека. Доктор обещает общество без повторяющихся ошибок. Людям, которым предстоит оплатить это обещание, места за столом не оставили."
 ADISCORD_vorkerland_postwar.29.a:0 "Утвердить бессрочно."
 ADISCORD_vorkerland_postwar.30.t:0 "Наука после доктора"
 ADISCORD_vorkerland_postwar.30.d:0 "На заседании обсуждали гранты, оборудование и право участников отказаться от исследования. Уоркс присутствовал, задавал вопросы и спорил с докладчиками. Его замечания внесли в протокол на общих основаниях.\n\nИнституты сохранили специалистов и архивы. Личная воля больше не заменяет решения совета, а подчинённые территории получат гражданские хартии с меньшими производственными обязательствами. Никто не обещает безошибочного будущего. Теперь ошибку хотя бы можно признать."
 ADISCORD_vorkerland_postwar.30.a:0 "Перейти к следующему вопросу."
 WRK_worx_government_tt:0 "Самостоятельная директория под формальным руководством Уоркса действует"
 WRK_worx_response_time_tt:0 "До конца ультиматума остаётся более 14 дней"

 # Extended postwar directorate
 WRK_worx_extended_normal_tt:0 "Директория действует самостоятельно; чрезвычайный ультиматум завершён."
 WRK_worx_focus_relief_10_tt:0 "При личной власти Уоркса: безумие §G-10§!. Требовательность не меняется."
 WRK_worx_missing_signatures:0 "В списках отсутствуют"
 WRK_worx_missing_signatures_desc:0 "Совет получил власть над лабораторией, но не над её прошлым. Поиск пропавших начинается с приказов, под которыми никто не захотел поставить подпись."
 WRK_worx_open_minutes:0 "В протоколе этого не было"
 WRK_worx_open_minutes_desc:0 "Открытые материалы позволят университетам проверить выводы директории. Вместе с полезными данными наружу выйдут имена ответственных."
 WRK_worx_delta_sealed_minutes:0 "Изменение устройства директории"
 WRK_worx_sealed_minutes:0 "Только для служебного пользования"
 WRK_worx_sealed_minutes_desc:0 "Архив останется у комиссии. Чиновники вернутся к работе, зная, что их прошлое находится в надёжном и запертом шкафу."
 WRK_worx_public_hearing:0 "Свидетель имеет имя"
 WRK_worx_public_hearing_desc:0 "Даже закрытый архив не отменяет право быть услышанным. Комиссия примет показания живых людей, а не выдержки из истории болезни."
 WRK_worx_delta_right_of_appeal:0 "Изменение устройства директории"
 WRK_worx_right_of_appeal:0 "Решение можно обжаловать"
 WRK_worx_right_of_appeal_desc:0 "У подписи директора появляется адресат для жалобы. Такая процедура замедлит управление, зато приказ перестанет быть последним словом."
 WRK_worx_delta_constitution_lives:0 "Изменение устройства директории"
 WRK_worx_constitution_lives:0 "Инструкция переживёт автора"
 WRK_worx_constitution_lives_desc:0 "Уорксу оставят кабинет и возможность работать. Страна получит правила, которые действуют и тогда, когда доктор с ними не согласен."
 WRK_worx_delta_temporary_forever:0 "Изменение устройства директории"
 WRK_worx_focus_pressure_0_05_tt:0 "При личной власти Уоркса: ежедневный рост безумия §R+0.05§!."
 WRK_worx_temporary_forever:0 "Временно - значит навсегда"
 WRK_worx_temporary_forever_desc:0 "Чрезвычайные полномочия оказались удобнее конституции. Доктор не видит причин возвращать их людям, которые всё ещё задают вопросы."
 WRK_worx_delta_signed_absence:0 "Изменение устройства директории"
 WRK_worx_signed_absence:0 "Подписи больше не нужны"
 WRK_worx_signed_absence_desc:0 "Аппарат будет исполнять предполагаемую волю доктора. Ответственность исчезнет между распоряжением и его устным подтверждением."
 WRK_worx_delta_one_signature:0 "Изменение устройства директории"
 WRK_worx_focus_relief_5_tt:0 "При личной власти Уоркса: безумие §G-5§!. Требовательность не меняется."
 WRK_worx_one_signature:0 "Одна подпись на всех"
 WRK_worx_one_signature_desc:0 "Ни один опыт не начнётся без личной резолюции Уоркса. Очередь документов вырастет, но доктор снова почувствует, что контролирует каждую мелочь."
 WRK_worx_no_exceptions:0 "Исключений не предусмотрено"
 WRK_worx_no_exceptions_desc:0 "Распоряжения теперь распространяются и на семьи директоров. Страх перед общим правилом заменит верность отдельным начальникам."
 WRK_worx_doctor_remembers:0 "Доктор всё помнит"
 WRK_worx_doctor_remembers_desc:0 "Личный архив сводит возражения, отчёты и промедления в единую картотеку. Каждая найденная ошибка требует нового доказательства правоты доктора."
 WRK_worx_delta_world_not_ready:0 "Изменение устройства директории"
 WRK_worx_world_not_ready:0 "Мир ещё не готов"
 WRK_worx_world_not_ready_desc:0 "Общество не выдержало встречи с будущим. Значит, по мнению Уоркса, менять следует общество, а не его расчёты."
 WRK_worx_laboratory_inventory:0 "За стеклом тоже страна"
 WRK_worx_laboratory_inventory_desc:0 "После войны институты существуют на бумаге, а оборудование разбросано по складам. Инвентаризация вернёт лабораториям хотя бы их инструменты."
 WRK_worx_measuring_silence:0 "Тишина тоже показатель"
 WRK_worx_measuring_silence_desc:0 "Уоркса раздражает отсутствие результатов. Первые измерительные стенды дадут проверяемые данные раньше, чем он потребует очередную серию опытов."
 WRK_worx_control_group:0 "Контрольная группа"
 WRK_worx_control_group_desc:0 "Сначала проверим уже собранные материалы. Повторный анализ успокаивает доктора слабее нового опыта, но не повышает его требовательность."
 WRK_worx_names_obstruct:0 "Имена мешают статистике"
 WRK_worx_names_obstruct_desc:0 "В карточках останутся только номера. Каждая новая серия приносит результаты и короткую передышку, за которую страна платит людьми."
 WRK_worx_delta_duplicate_records:0 "Изменение устройства директории"
 WRK_worx_duplicate_records:0 "Сверить с оригиналом"
 WRK_worx_duplicate_records_desc:0 "Нельзя строить теорию на переписанной ошибке. Копии лабораторных журналов будут сверяться до того, как попадут на стол директора."
 WRK_worx_night_shift:0 "Ночью вопросы проще"
 WRK_worx_night_shift_desc:0 "Ночной персонал получит отдельный запас приборов и право заканчивать начатую работу. Непрерывный поток отчётов ненадолго избавит Уоркса от тишины."
 WRK_worx_delta_glass_walls:0 "Изменение устройства директории"
 WRK_worx_glass_walls:0 "Стеклянные стены"
 WRK_worx_glass_walls_desc:0 "Соседние лаборатории увидят методику друг друга. Проверка станет медленнее, зато неудачу будет труднее спрятать."
 WRK_worx_black_boxes:0 "Чёрные ящики"
 WRK_worx_black_boxes_desc:0 "Каждая группа отвечает только за свой участок. Полную картину знает один доктор, и каждое несовпадение превращается в его личную тревогу."
 WRK_worx_comparable_results:0 "При прочих равных"
 WRK_worx_comparable_results_desc:0 "Единые условия измерений позволят сравнивать лаборатории, а не красноречие их заведующих."
 WRK_worx_focus_relief_15_tt:0 "При личной власти Уоркса: безумие §G-15§!. Требовательность не меняется."
 WRK_worx_returned_reports:0 "Вернуть на доработку"
 WRK_worx_returned_reports_desc:0 "Отрицательный результат перестанет означать отсутствие работы. Директор получит объяснения ошибок вместо пустых граф."
 WRK_worx_new_material:0 "Материал сопротивляется"
 WRK_worx_new_material_desc:0 "Техники требуют изучать свойства сплавов, прежде чем винить исполнителей. Для этого придётся выделить им собственные стенды."
 WRK_worx_delta_honest_failure:0 "Изменение устройства директории"
 WRK_worx_honest_failure:0 "Отрицательный результат"
 WRK_worx_honest_failure_desc:0 "Общая методика допускает неудачу без уничтожения журнала. Доктору это не нравится, но воспроизводимые результаты убеждают даже его."
 WRK_worx_delta_no_final_version:0 "Изменение устройства директории"
 WRK_worx_no_final_version:0 "Окончательной версии нет"
 WRK_worx_no_final_version_desc:0 "Каждая модель останется открытой для пересмотра. Наука не обязана закончиться вместе с рабочим днём её руководителя."
 WRK_worx_delta_perfect_specimen:0 "Изменение устройства директории"
 WRK_worx_perfect_specimen:0 "Образец признан совершенным"
 WRK_worx_perfect_specimen_desc:0 "Уоркс утвердит эталон, которому производство обязано соответствовать. Отклонения будут исправляться новыми испытаниями, а не пересмотром эталона."
 WRK_worx_tomorrow_test:0 "Завтра повторить"
 WRK_worx_tomorrow_test_desc:0 "Лабораторная сеть получила метод, персонал и бюджет. Теперь она способна продолжать работу без нового приказа каждое утро."
 WRK_worx_delta_mind_without_sleep:0 "Изменение устройства директории"
 WRK_worx_focus_relief_20_tt:0 "При личной власти Уоркса: безумие §G-20§!. Требовательность не меняется."
 WRK_worx_mind_without_sleep:0 "Разум не нуждается во сне"
 WRK_worx_mind_without_sleep_desc:0 "Дежурные научные коллегии будут отвечать на вопросы доктора круглые сутки. Это дорого, но молчание лабораторий обходится стране ещё дороже."
 WRK_worx_delta_grid_ledger:0 "Изменение устройства директории"
 WRK_worx_grid_ledger:0 "Счётчик не умеет лгать"
 WRK_worx_grid_ledger_desc:0 "Директория сопоставит расход энергии с настоящим выпуском заводов. Несуществующие цеха исчезнут из отчётности вместе с их пайками."
 WRK_worx_delta_light_for_machines:0 "Изменение устройства директории"
 WRK_worx_light_for_machines:0 "Свет нужен оборудованию"
 WRK_worx_light_for_machines_desc:0 "Приоритет лабораторий и цехов оставит жилые кварталы в темноте. Доктор сочтёт это достаточным основанием требовать ещё больше результатов."
 WRK_worx_delta_city_serves_complex:0 "Изменение устройства директории"
 WRK_worx_city_serves_complex:0 "Город обслуживает комплекс"
 WRK_worx_city_serves_complex_desc:0 "Жильё и транспорт станут частью производственного плана. Даже директория вынуждена признать, что рабочие не появляются у станка из воздуха."
 WRK_worx_serial_numbers:0 "У каждого винта свой номер"
 WRK_worx_serial_numbers_desc:0 "Единый заказ свяжет ремонтные мастерские с арсеналами. Оплаченная партия потребует времени и инструментов, зато даст измеримый запас оружия и машин."
 WRK_worx_standard_parts:0 "Подходит без доработки"
 WRK_worx_standard_parts_desc:0 "Взаимозаменяемость деталей избавит мастерские от бесконечной подгонки. Это скучная работа, на которой держится обещанное будущее."
 WRK_worx_counted_reserves:0 "На складе, а не в отчёте"
 WRK_worx_counted_reserves_desc:0 "Проверка запасов вернёт в оборот технику, забытую между ведомствами. Заводские накладные наконец встретятся с реальными ящиками."
 WRK_worx_delta_waste_has_value:0 "Изменение устройства директории"
 WRK_worx_waste_has_value:0 "Брак тоже принадлежит государству"
 WRK_worx_waste_has_value_desc:0 "Отбракованные детали отправятся на разбор, а причины отказов - в лабораторию. Доктор увидит пользу даже в том, что вчера требовал уничтожить."
 WRK_worx_tooling_upgrade_tt:0 "Заказ стандартизированной партии дополнительно доставляет §G200§! £support_equipment_texticon без изменения цены и срока."
 WRK_worx_conveyor_memory:0 "Конвейер запоминает"
 WRK_worx_conveyor_memory_desc:0 "Повторяемые операции будут закреплены в оснастке. Каждая следующая партия даст больше готовых инструментов из прежнего набора заготовок."
 WRK_worx_civilian_batch:0 "Сначала для тех, кто остался"
 WRK_worx_civilian_batch_desc:0 "Гражданский завод займётся восстановлением внутреннего рынка. Его продукция не попадёт в армейский рапорт, но вернёт смысл мирной работе."
 WRK_worx_arsenal_batch:0 "Мир подождёт своей очереди"
 WRK_worx_arsenal_batch_desc:0 "Новый арсенал получит помещение и персонал раньше гражданских предприятий. Западные границы не станут ждать окончания реконструкции."
 WRK_worx_delivery_schedule:0 "Сроки являются частью изделия"
 WRK_worx_delivery_schedule_desc:0 "Для готовой продукции выделят транспорт, а для перевозчиков - исполнимый график. Изделие, оставшееся на заводском дворе, ничего не меняет."
 WRK_worx_delta_repair_before_replace:0 "Изменение устройства директории"
 WRK_worx_repair_before_replace:0 "Ремонт дешевле нового мира"
 WRK_worx_repair_before_replace_desc:0 "Инженеры получат право восстанавливать старое оборудование. Не всякая поломка требует очередной революции в конструкции."
 WRK_worx_delta_reserve_capacity:0 "Изменение устройства директории"
 WRK_worx_reserve_capacity:0 "Запасная линия"
 WRK_worx_reserve_capacity_desc:0 "Резервная оснастка позволит сохранять серию при остановке цеха. Часть ресурсов будет простаивать именно для того, чтобы не простаивала вся страна."
 WRK_worx_delta_no_idle_state:0 "Изменение устройства директории"
 WRK_worx_no_idle_state:0 "Простоев не зарегистрировано"
 WRK_worx_no_idle_state_desc:0 "Цепочка от измерения до доставки замкнулась. За сухой строкой отчёта стоят люди, которых директория по-прежнему предпочитает не замечать."
 WRK_worx_staff_after_battle:0 "После боя заполнить форму"
 WRK_worx_staff_after_battle_desc:0 "Штаб научится отличать опыт войны от удобных объяснений поражения. Донесение должно возвращаться с передовой даже тогда, когда расчёт подвёл."
 WRK_worx_soldier_returns:0 "Солдат должен вернуться"
 WRK_worx_soldier_returns_desc:0 "Медицинская служба получит право возвращать раненых к жизни, а не только к службе. Для доктора это подозрительное расходование лабораторного времени."
 WRK_worx_return_unplanned:0 "Возврат не предусмотрен"
 WRK_worx_return_unplanned_desc:0 "Подготовка штурмовых групп станет ещё одной серией испытаний. Доктору нужны результаты, а штабу придётся учитывать людей как израсходованный ресурс."
 WRK_worx_lesson_paid:0 "За урок уже заплачено"
 WRK_worx_lesson_paid_desc:0 "Усвоим опыт подготовки до следующего наступления. Цена уже внесена; повторение той же ошибки не сделает её научнее."
 WRK_worx_ambulance_columns:0 "Дорога в обратную сторону"
 WRK_worx_ambulance_columns_desc:0 "За каждым маршрутом снабжения закрепят обратный рейс. Раненых и повреждённую технику больше не придётся вывозить случайным транспортом."
 WRK_worx_calibrated_fire:0 "Поправка на живую цель"
 WRK_worx_calibrated_fire_desc:0 "Артиллерийским расчётам выдадут исправные орудия и обновлённые таблицы. Уоркс согласится признать погрешность там, где её можно измерить."
 WRK_worx_delta_orders_arrive:0 "Изменение устройства директории"
 WRK_worx_orders_arrive:0 "Приказ должен дойти"
 WRK_worx_orders_arrive_desc:0 "Связисты объединят полевые сети штабов и ремонтных частей. Самый точный приказ бесполезен, если его некому принять."
 WRK_worx_delta_break_model:0 "Изменение устройства директории"
 WRK_worx_break_model:0 "Вскрыть по линии разреза"
 WRK_worx_break_model_desc:0 "Сосредоточим силы на выбранном участке. Наступление потребует больше снабжения, зато модель противника перестанет описывать происходящее."
 WRK_worx_delta_patient_front:0 "Изменение устройства директории"
 WRK_worx_patient_front:0 "Подождём, пока ошибутся"
 WRK_worx_patient_front_desc:0 "Подвижные резервы и эшелонированная оборона заставят противника первым нарушить свой план. Мы будем готовы воспользоваться этой ошибкой."
 WRK_worx_map_survives:0 "Карта пережила совещание"
 WRK_worx_map_survives_desc:0 "Командиры получат согласованный порядок действий. Доктрина наконец будет описывать доступные войска, а не желаемую армию будущего."
 WRK_worx_enough_shells:0 "Боекомплект на завтра"
 WRK_worx_enough_shells_desc:0 "Выделим резерв вооружения для восполнения потерь. Наступление не должно заканчиваться вместе с первым расходным рапортом."
 WRK_worx_radio_discipline:0 "В эфире только цифры"
 WRK_worx_radio_discipline_desc:0 "Унифицированные радиограммы сократят задержки и ошибки связи. Доктор получит непрерывный поток данных, а командиры - понятные донесения."
 WRK_worx_delta_proof_in_service:0 "Изменение устройства директории"
 WRK_worx_proof_in_service:0 "Принято на вооружение"
 WRK_worx_proof_in_service_desc:0 "Проверенные инструкции станут частью подготовки пополнений. Новым солдатам не придётся заново оплачивать каждый урок."
 WRK_worx_delta_war_has_end:0 "Изменение устройства директории"
 WRK_worx_war_has_end:0 "У войны должен быть конец"
 WRK_worx_war_has_end_desc:0 "Штаб получит задачу завершать кампании, а не бесконечно подтверждать расчёты директора. Снабжение будет строиться под достижимые цели войны."
 WRK_worx_population_is_here:0 "Население всё ещё здесь"
 WRK_worx_population_is_here_desc:0 "На картах директории снова появились города, но их жители пока не нашли места в расчётах. Начнём с признания того, что они существуют."
 WRK_worx_census_without_names:0 "Пересчитать оставшихся"
 WRK_worx_census_without_names_desc:0 "Послевоенная перепись определит потребности округов. Уоркс получит данные, которые не меняются от настроения местного директора."
 WRK_worx_compulsory_welfare:0 "Ваше благополучие обязательно"
 WRK_worx_compulsory_welfare_desc:0 "Государственные клиники займутся обычными болезнями и последствиями войны. Доктор раздражён: его оборудование снова используют для лечения."
 WRK_worx_complaints_deviations:0 "Жалобы и другие отклонения"
 WRK_worx_complaints_deviations_desc:0 "Обращения граждан станут материалом для поведенческих серий. Директория обещает устранить причины недовольства и не уточняет, кого считает причиной."
 WRK_worx_delta_normal_range:0 "Изменение устройства директории"
 WRK_worx_normal_range:0 "В пределах нормы"
 WRK_worx_normal_range_desc:0 "Сводные сведения позволят увидеть различия между округами. Спор о допустимых отклонениях теперь ведётся на языке таблиц."
 WRK_worx_school_of_answers:0 "Вопросы после урока"
 WRK_worx_school_of_answers_desc:0 "Технические школы откроют набор для детей рабочих. Учителям предписано воспитывать самостоятельное мышление по утверждённому плану."
 WRK_worx_delta_housing_grid:0 "Изменение устройства директории"
 WRK_worx_housing_grid:0 "Ключи выдадут по списку"
 WRK_worx_housing_grid_desc:0 "Жилые кварталы будут восстанавливать рядом с местами работы. Человеку полагается адрес, даже если директория предпочитает его табельный номер."
 WRK_worx_ordinary_day:0 "Обычный рабочий день"
 WRK_worx_ordinary_day_desc:0 "Предсказуемый распорядок заменит мобилизационную суету. Для людей это возвращение к жизни; для доктора - уменьшение числа неизвестных."
 WRK_worx_delta_human_face:0 "Изменение устройства директории"
 WRK_worx_human_face:0 "Лицо на удостоверении"
 WRK_worx_human_face_desc:0 "Местные комиссии получат право учитывать обстоятельства конкретного человека. В системе останется место для случая, не помещающегося в графу."
 WRK_worx_delta_no_individual:0 "Изменение устройства директории"
 WRK_worx_no_individual:0 "Личное дело вместо личности"
 WRK_worx_no_individual_desc:0 "Единая картотека заменит решения местных комиссий. Каждое исключение станет ошибкой системы, требующей вмешательства доктора."
 WRK_worx_paper_citizens:0 "Бумага всё стерпит"
 WRK_worx_paper_citizens_desc:0 "Районные учреждения получат общие формы и совместимые архивы. Даже безупречный учёт не сделает жизнь простой, но хотя бы перестанет терять людей между столами."
 WRK_worx_delta_family_leave:0 "Изменение устройства директории"
 WRK_worx_family_leave:0 "Домой до отбоя"
 WRK_worx_family_leave_desc:0 "Выходные и семейные отпуска перестанут зависеть от личного разрешения начальника. Отдохнувшие люди возвращаются к работе без конвоя."
 WRK_worx_delta_institutional_childhood:0 "Изменение устройства директории"
 WRK_worx_institutional_childhood:0 "Государство воспитает"
 WRK_worx_institutional_childhood_desc:0 "Закрытые учебные комплексы будут готовить кадры для армии и производства. Родителям объяснят, что будущее детей слишком важно для частных решений."
 WRK_worx_citizen_by_schedule:0 "Гражданин согласно расписанию"
 WRK_worx_citizen_by_schedule_desc:0 "Транспорт свяжет жильё, школы и предприятия. Впервые расписание будет составлено для реальных расстояний, а не для отчёта о выполнении плана."
 WRK_worx_delta_permission_to_live:0 "Изменение устройства директории"
 WRK_worx_permission_to_live:0 "Разрешено жить"
 WRK_worx_permission_to_live_desc:0 "Директория утвердит минимальные гарантии снабжения и отдыха. В документе нет слова достоинство, но его последствия люди почувствуют без подсказки."
 WRK_worx_clinic_upgrade_tt:0 "Окружные клиники дополнительно возвращают §G400§! £manpower_texticon; программа реестра даёт дополнительные §G10§! £army_experience."
 WRK_worx_safety_confirmed:0 "Безопасность подтверждена"
 WRK_worx_safety_confirmed_desc:0 "Общая сеть учреждений научилась доводить программы до результата. Уоркс назовёт это доказательством своей правоты, независимо от того, какой путь выбрала страна."
 WRK_worx_maps_have_weight:0 "У карты есть вес"
 WRK_worx_maps_have_weight_desc:0 "Линии западных маршрутов превратятся в оплаченные запасы транспорта и инструментов. Директория должна снабжать свои планы за собственный счёт."
 WRK_worx_help_has_terms:0 "Помощь имеет условия"
 WRK_worx_help_has_terms_desc:0 "Инженерные делегации подготовят общие спецификации. Каждое обещание помощи будет сопровождаться сметой, а не правом забрать чужой склад."
 WRK_worx_delta_border_means_customs:0 "Изменение устройства директории"
 WRK_worx_border_means_customs:0 "Граница означает таможню"
 WRK_worx_border_means_customs_desc:0 "Совместимые документы упростят торговлю без отмены соседних правительств. Сборы и разрешения останутся предметом договора."
 WRK_worx_border_means_range:0 "Граница означает дальность"
 WRK_worx_border_means_range_desc:0 "Штаб переведёт дипломатические расстояния в нормы снабжения. Противник должен понимать, что за расчётами стоят настоящие орудия."
 WRK_worx_corridor_upgrade_tt:0 "Программа коридорных складов дополнительно доставляет §G200§! £motorized_texticon без изменения цены и срока."
 WRK_worx_delta_corridor_dispatch:0 "Изменение устройства директории"
 WRK_worx_corridor_dispatch:0 "Доставка до границы"
 WRK_worx_corridor_dispatch_desc:0 "Согласуем внутренние перевозки с западными маршрутами. Запас машин позволит исполнять договоры и снабжать войска одним проверенным путём."
 WRK_worx_after_final_account:0 "После окончательного расчёта"
 WRK_worx_after_final_account_desc:0 "Западное урегулирование состоялось. Теперь директории предстоит поддерживать порядок там, где одного объявления победы недостаточно."
 WRK_worx_local_signatures:0 "Пусть подпишут сами"
 WRK_worx_local_signatures_desc:0 "Гражданские хартии закрепят местное управление в технических подопечных государствах. Обязанности директории станут частью того же документа."
 WRK_worx_delta_appointed_custodians:0 "Изменение устройства директории"
 WRK_worx_appointed_custodians:0 "Ответственного назначат"
 WRK_worx_appointed_custodians_desc:0 "Представители директории будут координировать промышленность технических подопечных территорий в рамках действующего урегулирования. За единым графиком неизбежно последуют новые конфликты."
 WRK_worx_common_gauge:0 "Одинаковая ширина колеи"
 WRK_worx_common_gauge_desc:0 "Общие технические нормы свяжут западные хозяйства с Воркерландом. Для начала придётся доставить собственное оборудование к новым узлам."
 WRK_worx_southern_estimates:0 "Юг не помещается в смету"
 WRK_worx_southern_estimates_desc:0 "Эберн и Афрела требуют отдельных расчётов. Резерв транспорта и ремонтного имущества подготовит уже разрешённые южные кампании."
 WRK_worx_delta_distant_service:0 "Изменение устройства директории"
 WRK_worx_distant_service:0 "Обслуживание за пределами гарантии"
 WRK_worx_distant_service_desc:0 "Походные мастерские будут работать за пределами привычной сети снабжения. Продолжительность кампании не должна определяться одной сломанной машиной."
 WRK_worx_world_preselected:0 "Мир прошёл предварительный отбор"
 WRK_worx_world_preselected_desc:0 "Директория сопоставит опыт договоров, подопечных территорий и военных поставок. За пределами лаборатории обнаружились переменные, которые нельзя просто вычеркнуть."
 WRK_worx_delta_export_method:0 "Изменение устройства директории"
 WRK_worx_export_method:0 "Экспортировать метод"
 WRK_worx_export_method_desc:0 "Межгосударственные технические советы будут обмениваться проверенными решениями. Влияние директории сможет расти без нового приказа о наступлении."
 WRK_worx_delta_export_model:0 "Изменение устройства директории"
 WRK_worx_export_model:0 "Экспортировать образец"
 WRK_worx_export_model_desc:0 "Уоркс предъявит собственную страну как обязательный образец. Каждое несовпадение за границей станет для него очередным вызовом."
 WRK_worx_terms_accepted:0 "Условия приняты к исполнению"
 WRK_worx_terms_accepted_desc:0 "За внешним курсом появится постоянный аппарат. Его полномочия ограничены заключёнными соглашениями и действующими планами кампаний."
 WRK_worx_delta_end_of_observation:0 "Изменение устройства директории"
 WRK_worx_end_of_observation:0 "Наблюдение продолжается"
 WRK_worx_end_of_observation_desc:0 "Доктор смотрит на карту так же, как прежде смотрел на лабораторный стол. Страна стала больше; вопрос о том, кому принадлежит её будущее, никуда не исчез."
 WRK_worx_archive_audit:0 "Повторная проверка архивов"
 WRK_worx_archive_audit_desc:0 "Срок: 21 дн. Программа занимает общий лабораторный слот. Безумие §G-12§! при личной власти. Требовательность не растёт. При утрате самостоятельности, смене власти или чрезвычайном ультиматуме оплаченные ресурсы возвращаются; новые опыты также отменяются при установлении надзора совета."
 WRK_worx_archive_audit_result_tt:0 "Через 21 дн.: Безумие §G-12§! при личной власти. Требовательность не растёт."
 WRK_worx_archive_audit_available_tt:0 "Программа открыта; директория самостоятельна и вне чрезвычайного ультиматума."
 WRK_worx_archive_audit_price:0 "§Y75§! £political_power_texticon"
 WRK_worx_archive_audit_price_blocked:0 "§R75§! £political_power_texticon"
 WRK_worx_archive_audit_price_tooltip:0 "§Y75§! £political_power_texticon"
 WRK_worx_clinical_series:0 "Закрытая клиническая серия"
 WRK_worx_clinical_series_desc:0 "Срок: 21 дн. Программа занимает общий лабораторный слот. Безумие §G-35§!, стабильность §R-2%§!, один научный результат и бонус §G25%§! к одному исследованию электроники. Люди и оборудование расходуются. При утрате самостоятельности, смене власти или чрезвычайном ультиматуме оплаченные ресурсы возвращаются; новые опыты также отменяются при установлении надзора совета."
 WRK_worx_clinical_series_result_tt:0 "Через 21 дн.: Безумие §G-35§!, стабильность §R-2%§!, один научный результат и бонус §G25%§! к одному исследованию электроники. Люди и оборудование расходуются."
 WRK_worx_clinical_series_available_tt:0 "Программа открыта; директория самостоятельна и вне чрезвычайного ультиматума. Уоркс сохраняет личную власть без надзора совета."
 WRK_worx_clinical_series_price:0 "§Y125§! £political_power_texticon §Y100§! £manpower_texticon §Y50§! £support_equipment_texticon"
 WRK_worx_clinical_series_price_blocked:0 "§R125§! £political_power_texticon §R100§! £manpower_texticon §R50§! £support_equipment_texticon"
 WRK_worx_clinical_series_price_tooltip:0 "§Y125§! £political_power_texticon §Y100§! £manpower_texticon §Y50§! £support_equipment_texticon"
 WRK_worx_tooling_order:0 "Заказ стандартизированной партии"
 WRK_worx_tooling_order_desc:0 "Срок: 35 дн. Программа занимает общий лабораторный слот. Доставка: §G1000§! £infantry_equipment_texticon, §G300§! £motorized_texticon и §G100§! £support_equipment_texticon. После фокуса \"Конвейер запоминает\" дополнительно §G200§! £support_equipment_texticon. При утрате самостоятельности, смене власти или чрезвычайном ультиматуме оплаченные ресурсы возвращаются; новые опыты также отменяются при установлении надзора совета."
 WRK_worx_tooling_order_result_tt:0 "Через 35 дн.: Доставка: §G1000§! £infantry_equipment_texticon, §G300§! £motorized_texticon и §G100§! £support_equipment_texticon. После фокуса \"Конвейер запоминает\" дополнительно §G200§! £support_equipment_texticon."
 WRK_worx_tooling_order_available_tt:0 "Программа открыта; директория самостоятельна и вне чрезвычайного ультиматума."
 WRK_worx_tooling_order_price:0 "§Y150§! £political_power_texticon §Y100§! £support_equipment_texticon"
 WRK_worx_tooling_order_price_blocked:0 "§R150§! £political_power_texticon §R100§! £support_equipment_texticon"
