# District air infrastructure
 VAD_forward_airfield_programme:0 "Оборудовать полевой аэродром"
 VAD_forward_airfield_programme_desc:0 "Окружная управа отвела землю под лётное поле. Теперь инженерам предстоит выровнять полосу, провести подъездную дорогу и подготовить укрытия для прибывающих машин."
 VAD_district_air_defence_programme:0 "Развернуть окружные зенитные позиции"
 VAD_district_air_defence_programme_desc:0 "Над дорогами и заводскими кварталами поднимаются наблюдательные вышки. Гарнизон размечает огневые позиции, связывая их проводом с командным пунктом округа."
 VAD_forward_airfield_district_tt:0 "Есть управляемый округ без аэродрома, с местом для двух его уровней, без мятежа и демилитаризации."
 VAD_district_air_defence_district_tt:0 "Есть управляемый округ с местом для двух уровней ПВО, без мятежа и демилитаризации."
 VAD_forward_airfield_available_tt:0 "Действует независимая окружная администрация; выбранный округ принадлежит нам, находится под нашим контролем и имеет хартию или комендатуру. Нет аэродрома, мятежа или демилитаризации; свободно место для двух уровней аэродрома."
 VAD_district_air_defence_available_tt:0 "Действует независимая окружная администрация; выбранный округ принадлежит нам, находится под нашим контролем и имеет хартию или комендатуру. Нет мятежа или демилитаризации; свободно место для двух уровней ПВО."
 VAD_forward_airfield_unlock_tt:0 "Позволяет построить аэродром §Y2-го уровня§! в выбранном управляемом округе."
 VAD_district_air_defence_unlock_tt:0 "Позволяет добавить §Y2 уровня§! стационарной ПВО в выбранном управляемом округе."
 VAD_forward_airfield_result_tt:0 "Через §Y28 дней§! область §Y[FROM.GetName]§! получит аэродром §Y2-го уровня§!. Построенный аэродром сохранится после завершения войны."
 VAD_district_air_defence_result_tt:0 "Через §Y35 дней§! область §Y[FROM.GetName]§! получит §Y2 уровня§! стационарной ПВО. Построенные позиции сохранятся после завершения войны."
 VAD_air_infrastructure_cancellation_tt:0 "При утрате округа, его администрации или условий строительства, подчинении, капитуляции либо завершении кампании незавершённый заказ отменяется с полным возвратом оплаты; новые сооружения не создаются."
