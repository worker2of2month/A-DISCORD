l_russian:
# --- dirty_zone_l_russian ---
 ADISCORD_vorkerland_dirty_zone.1.t: "Из Грязной зоны снова приходят новости"
 ADISCORD_vorkerland_dirty_zone.1.d: "Впервые за много лет из-за периметра Грязной зоны поступают сообщения, которые удаётся проверить. Открываются старые дороги, снова работают линии связи, считавшиеся мёртвыми, на картах появляются границы местных администраций. Территория, которую снаружи привыкли считать заражённой пустошью, оказалась населена: там есть свои правительства и свои войны. Соседние государства начинают выяснять, с кем им теперь придётся иметь дело."
 ADISCORD_vorkerland_dirty_zone.1.a: "Зона оказалась обитаемой."

 ADISCORD_debug_open_vorkerland_dirty_zone: "§RDEBUG:§! Открыть Грязную зону"
 ADISCORD_debug_open_vorkerland_dirty_zone_desc: "Пропускает трёхлетнее ожидание и запускает штатный сценарий открытия Грязной зоны."

# --- civil_war_focus_l_russian ---
 ADISCORD_vorkerland_wrk_preparations_carry_over_tt: "§GПосле распада Конфедерации§! результаты этой подготовки перейдут чрезвычайному правительству."
 ADISCORD_vorkerland_unlock_core_restoration_decisions_tt: "§GОткроет решения§! по восстановлению национальных территорий отдельными региональными пакетами. Для каждого пакета требуется полное владение и контроль."
 WRK_worker_recognize_free_republics_tt: "§GОткроет дипломатические решения§! для признания уцелевших независимых республик Воркерланда."
 WRK_worker_write_constitutional_guarantees_tt: "§GОкончательно устранит§! последствия политики стирания народов и закрепит постоянное конституционное соглашение."
 TVA_technocratic_directorate_tt: "Дориан Воркс возглавляет §Yтехнократическую директорию§!, основанную на инженерной экспертизе, публичной отчётности и прямой ответственности администрации."
 WRK_technocratic_reconstruction_mandate_tt: "Учреждает §Yвременный мандат на реконструкцию§!. Созданные им профильные ведомства будут объединены последним фокусом маршрута."
 WRK_technocratic_republic_settlement_tt: "Заменяет временные органы реконструкции §Gпостоянным технократическим устройством§!."
 ADISCORD_vorkerland_stabilize_claimant_regime: "Удержать центр"
 ADISCORD_vorkerland_stabilize_claimant_regime_desc: "Конфедерация распалась, но вслед за ней не должна исчезнуть управляемость. Приказы, продовольственные ведомости и цепь командования обязаны пережить первые дни."
 ADISCORD_vorkerland_mobilize_field_forces: "Собрать полевые колонны"
 ADISCORD_vorkerland_mobilize_field_forces_desc: "Разрозненные отряды охраны и добровольцев будут сведены в небольшой подотчётный резерв, а не в очередное бесконтрольное ополчение."
 ADISCORD_vorkerland_fortify_home_region: "Укрепить столичный район"
 ADISCORD_vorkerland_fortify_home_region_desc: "Штабная подготовка и один опорный пункт у столицы закрепят оборонительную линию, не превращая весь центр страны в пояс крепостей."
 WKR_affirm_worker_mandate: "Определить западный чрезвычайный мандат"
 WKR_affirm_worker_mandate_desc: "Западному претенденту нужна общая военная и промышленная основа, а реальное правительство решит, будет ли власть принадлежать верным Никите Уоркеру советам или чрезвычайному исполкому Антона Бэгли."
 VAD_proclaim_joint_charter: "Провозгласить хартию восстановления"
 VAD_proclaim_joint_charter_desc: "Лагерь Влада обещает восстановить единое право и управляемую республику, опираясь на канцелярию и окружную армию. Если Никита Уоркер был спасён, редкое совместное правительство закрепит в хартии гарантии рабочих."
 TVA_codify_utilitarian_directorate: "Оформить технократическую программу Воркса"
 TVA_codify_utilitarian_directorate_desc: "Доктор Дориан Воркс объединит инженеров, статистиков и опытных служащих в подотчётном военном кабинете. Власть будет опираться на доказанную компетентность, контролируемые испытания и способность поддерживать общественные системы."
 ADISCORD_vorkerland_claimant_focus_phase_tt: "Доступно, пока действует система временных претендентов"
 ADISCORD_vorkerland_central_showdown_phase_tt: "Доступно после начала войны между центральными претендентами"
 WRK_measure_confederation_fault_lines: "Измерить трещины Конфедерации"
 WRK_measure_confederation_fault_lines_desc: "Окружные отчёты уже расходятся в налогах, воинских обязательствах и даже в перечне действующих указов. Республика должна понять, где сломается конструкция, прежде чем та рухнет."
 WRK_convene_council_of_republics: "Созвать Совет республик"
 WRK_convene_council_of_republics_desc: "Последнее совещание позволит получить письменные обязательства республик и поставить конституционную преемственность выше импровизации."
 WRK_inventory_emergency_stores: "Пересчитать аварийные запасы"
 WRK_inventory_emergency_stores_desc: "Оружие, продовольствие и железнодорожные детали будут учтены и распределены, пока один захват складов не лишил центр всего сразу."
 WRK_bind_districts_to_charter: "Связать округа хартией"
 WRK_bind_districts_to_charter_desc: "Хартия не остановит кризис, но подписанные обязательства дадут лояльным администраторам общий порядок действий, когда центр замолчит."
 WRK_disperse_railway_reserves: "Рассредоточить резервы у железных дорог"
 WRK_disperse_railway_reserves_desc: "Запасные винтовки и ремонтное имущество покинут столичные склады и окажутся в охраняемых депо вдоль уцелевших магистралей."
 WRK_issue_continuity_orders: "Издать приказы о преемственности"
 WRK_issue_continuity_orders_desc: "Запечатанные приказы объяснят армии и ведомствам, с кем связываться, что сохранять и как действовать при исчезновении конфедеративной цепи командования."
 VAD_review_district_obligations: "Пересмотреть обязательства округа"
 VAD_review_district_obligations_desc: "Окружная администрация сверит обязательства перед центром с тем, что ещё может выполнить. Снабжение гарнизонов, сбор налогов и работа местных учреждений должны продолжаться даже при разрыве связи со столицей."
 VAD_open_continuity_registers: "Открыть реестры преемственности"
 VAD_open_continuity_registers_desc: "Старые списки служащих и транспортные ведомости сохранят административную цепь, даже если федеральные министерства перестанут отвечать."
 VAD_drill_district_guard: "Обучить окружную гвардию"
 VAD_drill_district_guard_desc: "Небольшая гвардия, подчинённая окружному штабу, полезнее массового ополчения, которое разбежится после первого противоречивого приказа."
 VAD_secure_administrative_archives: "Обезопасить административные архивы"
 VAD_secure_administrative_archives_desc: "Личные дела, налоговые списки и государственные печати будут скопированы и вынесены из-под угрозы одного налёта на окружную столицу."
 VAD_disperse_eastern_depots: "Рассредоточить окружные склады"
 VAD_disperse_eastern_depots_desc: "Снаряжение уйдёт в небольшие защищённые депо, откуда гвардия сможет получать его без разрешения конфедеративного интендантства."
 VAD_form_emergency_chancery: "Учредить чрезвычайную канцелярию"
 VAD_form_emergency_chancery_desc: "Временная канцелярия свяжет выбранный план преемственности единой открытой цепью приказов, сохранит его реестры и даст окружной гвардии признанный чрезвычайный мандат."
 WKR_convene_front_soviets: "Созвать фронтовые советы Никиты"
 WKR_convene_front_soviets_desc: "Пока Никита Уоркер находится среди верных ему сил, солдаты, железнодорожники и заводские делегаты смогут превратить обещание Первой революции в действующую военную республику."
 WKR_organize_factory_battalions: "Организовать заводские батальоны"
 WKR_organize_factory_battalions_desc: "Фабричные комитеты предоставят проверенных добровольцев и кадры пополнения, приняв краткий производственный сбой ради немедленного усиления."
 WKR_put_railways_under_councils: "Передать железные дороги советам"
 WKR_put_railways_under_councils_desc: "Местные советы согласуют ремонт и воинские перевозки, сохраняя пути отхода без передачи всей сети бесконтрольному штабу."
 WKR_authorize_retreat_levies: "Разрешить ополчения при отступлении"
 WKR_authorize_retreat_levies_desc: "Тыловые округа смогут создавать ограниченные чрезвычайные части при прорыве фронта. Это последний резерв, а не новая бесконтрольная армия."
 WKR_form_revolutionary_supply_commission: "Учредить революционную комиссию снабжения"
 WKR_form_revolutionary_supply_commission_desc: "Железнодорожные советы, кооперативные склады и полевые интенданты сведут снабжение в общий реестр и передадут фронту ограниченный резерв."
 WKR_train_shopfloor_officers: "Обучить цеховых командиров"
 WKR_train_shopfloor_officers_desc: "Опытные мастера и профсоюзные организаторы пройдут короткие штабные курсы, чтобы чрезвычайные ополчения получили командиров, знающих людей и технику."
 WKR_open_free_republics_channel: "Открыть республиканский канал Никиты"
 WKR_open_free_republics_channel_desc: "Правительство Никиты превратит идейную близость с Вольноградом в ограниченное военное сотрудничество, сохранив подотчётность фронта публичным советам."
 WKR_empower_front_executive: "Усилить фронтовой исполком Бэгли"
 WKR_empower_front_executive_desc: "Резервная администрация Антона Бэгли временно передаст исполкому управление резервами и железнодорожными приоритетами. Этот технический мандат ограничен чрезвычайным положением."
 WKR_reopen_collective_workshops: "Открыть коллективные мастерские"
 WKR_reopen_collective_workshops_desc: "Кооперативные мастерские и заброшенные сборочные цеха войдут в единую подотчётную сеть: она создаст постоянную линию выпуска либо выдаст последний запас, если столичный район уже потерян."
 WKR_publish_emergency_constitution: "Опубликовать чрезвычайную конституцию Никиты"
 WKR_publish_emergency_constitution_desc: "Верные советы опубликуют пределы командной власти, права делегатов и обязательный пересмотр всех исключительных полномочий после войны."
 WKR_authorize_normative_command: "Утвердить нормативное командование"
 WKR_authorize_normative_command_desc: "Исполком Бэгли установит единую измеримую цепь управления резервами, железными дорогами и полевыми штабами, не выдавая её за постоянную конституцию."
 WKR_bind_workshops_to_directive: "Подчинить мастерские директиве"
 WKR_bind_workshops_to_directive_desc: "Производственные коллегии получат чёткие приоритеты, сроки и порядок проверки от чрезвычайного аппарата Антона Бэгли."
 WKR_settle_front_authority: "Определить власть фронта"
 WKR_settle_front_authority_desc: "Публичный мандат Никиты или директивный аппарат Бэгли теперь определит, как политические решения достигают общей армии и промышленной базы."
 WKR_coordinate_counterattack_cells: "Согласовать ячейки контрудара"
 WKR_coordinate_counterattack_cells_desc: "Заводские батальоны, цеховые командиры и ополчения отхода будут сведены в малые резервы для усиления угрожаемых узлов без оголения всего фронта."
 WKR_stockpile_interchange_reserves: "Накопить резервы на узловых станциях"
 WKR_stockpile_interchange_reserves_desc: "Железнодорожные советы и коллективные мастерские разместят ограниченный запас инструментов, вагонов и вспомогательного снаряжения на западных узлах."
 WKR_republic_fights_as_one: "Западный претендент сражается как единое целое"
 WKR_republic_fights_as_one_desc: "При советах Никиты Уоркера или утилитарном резервном правительстве Антона Бэгли западный претендент получил единую власть, полевую систему и промышленный график для борьбы за центр."
 WKR_establish_workers_air_command: "Учредить рабочее воздушное командование"
 WKR_establish_workers_air_command_desc: "Лётчики, механики и наземные наблюдатели войдут в единое небольшое командование, которое прикроет западную армию, а не станет беречь самолёты у столицы."
 WKR_keep_frontline_sorties_flying: "Поддерживать фронтовые вылеты"
 WKR_keep_frontline_sorties_flying_desc: "Отдельные линии выпуска истребителей и штурмовиков, запасные машины и защищённый лимит топлива позволят авиации пережить первые бои."
 WKR_raise_mobile_fortification_crews: "Собрать подвижные фортификационные бригады"
 WKR_raise_mobile_fortification_crews_desc: "Железнодорожные инженерные бригады подготовят неглубокую линию на существующем фронте вместо бетонного пояса вокруг вчерашнего штаба."
 WKR_secure_the_southern_corridor: "Обезопасить южный коридор"
 WKR_secure_the_southern_corridor_desc: "Западные узлы получат восстановленные дороги, охраняемые склады и общий график движения для армии, направленной к Солярино."
 WKR_rehearse_operation_southbound: "Отрепетировать операцию «На юг»"
 WKR_rehearse_operation_southbound_desc: "Авианаводчики, полевые инженеры и колонны снабжения отработают единое наступление до того, как правительство откроет новый фронт."
 WKR_intervene_in_solyarino: "Вмешаться в Солярино"
 WKR_intervene_in_solyarino_desc: "Западное правительство обезопасит южный путь даже после начала центральной схватки. Кампания не уничтожит Солярино: победа соберёт пять заданных штатов в рабочий протекторат под властью $WKR$."
 WKR_intervene_in_solyarino_available_tt: "Должна идти подготовка к центральной войне или сама центральная схватка. $VAD$ не должен зарезервировать или начать собственное вмешательство в Солярино, соглашение о реставрации не должно ожидать исполнения, а $WKR$ обязан контролировать сухопутный подход хотя бы к одной допустимой цели. Одновременная война с $VAD$ этот фокус не блокирует."
 WKR_intervene_in_solyarino_effect_tt: "Объявит отдельные войны всем подходящим уцелевшим правительствам: §YСолярино, Республике Солвейн и Слободской городской управе§!. Каждое объявление будет проверено на следующий день и повторено не более одного раза. После начала общей войны §YАрми§! сможет открыть фронт против тех же неприсоединившихся южных правительств. Война между претендентами начинается по общей процедуре. После победы ровно §Yпять заданных штатов Солярино§! будут собраны в §Y$SOL$§! как рабочий протекторат $WKR$."
 WKR_open_the_remaining_fronts: "Открыть оставшиеся фронты"
 WKR_open_the_remaining_fronts_desc: "Если западное правительство застряло на уцелевшем центральном округе или соперничающем претенденте, оно больше не будет ждать соседнего подхода. Оставшиеся независимые центральные малые государства и уцелевшие центральные претенденты открываются как одновременные войны."
 WKR_open_the_remaining_fronts_available_tt: "Должен существовать хотя бы один независимое центральное малое государство или соперничающий центральный претендент, с которым $WKR$ ещё не воюет. Должна идти центральная война. Малое государство должно оставаться вне коалиций. $WKR$ уже должен открыть центральную войну, отрепетировать южную операцию, вмешаться в Солярино либо не иметь допустимой цели в Солярино."
 WKR_open_the_remaining_fronts_effect_tt: "Объявит отдельные войны на аннексию всем оставшимся независимым центральным малым государствам: §Y$EYR$, $EGC$, $RIV$, $REV$, $YOR$, $NDN$, $SWB$, $VHV$ и $OSV$§!, а также оставшимся соперничающим претендентам §Y$VAD$ и $TVA$§!. Расстояние объявлению не мешает. Доступно после начала центральной войны. Автономии в коалициях не становятся отдельными целями; союзники сохраняют своё положение."
 VAD_open_imperial_registers: "Открыть имперские реестры"
 VAD_open_imperial_registers_desc: "Канцелярия использует унаследованные списки служащих и транспорта, чтобы ускорить мобилизацию и готовить продуманные операции."
 VAD_form_field_commandantures: "Созвать совет спасённых рабочих"
 VAD_form_field_commandantures_desc: "Только редкое правительство, возникшее после спасения Никиты Уоркера, может дать рабочим делегатам формальное место рядом с канцелярией Влада и армейским командованием."
 VAD_invite_sol_delegation: "Определить политику в Солярино"
 VAD_invite_sol_delegation_desc: "Этот фокус выбирает политику, но не начинает войну. Победившую республику можно пригласить в коалицию Влада; победа её региональных противников вместо этого разрешит интервенцию и восстановление Солярино под защитой Арми."
 VAD_establish_mobile_headquarters: "Создать подвижный штаб"
 VAD_establish_mobile_headquarters_desc: "Штаб, способный оставить угрожаемую канцелярию без потери реестров, сохранит управление окружной армией даже при отступлении."
 VAD_dispatch_solland_liaison_mission: "Направить миссию связи в Солярино"
 VAD_dispatch_solland_liaison_mission_desc: "Миссия установит связь с победителем соляринской войны и подготовит официальный договор либо план будущего вмешательства."
 VAD_standardize_district_logistics: "Стандартизировать окружную логистику"
 VAD_standardize_district_logistics_desc: "Единые реквизиционные бланки, складская маркировка и графики перевозок сохранят снабжение комендатур при переезде штаба."
 VAD_reconstitute_district_guard: "Воссоздать окружную гвардию"
 VAD_reconstitute_district_guard_desc: "Уцелевшие кадры гвардии будут собраны в территориальные части, связанные с подвижным штабом, а не распределены между местными покровителями."
 VAD_inventory_eastern_works: "Провести учёт восточных предприятий"
 VAD_inventory_eastern_works_desc: "Канцелярия пересчитает станки, защищённые склады и транспортные бригады, прежде чем обещать восточным округам то, чего они не смогут произвести."
 VAD_reopen_armament_depots: "Открыть оружейные склады"
 VAD_reopen_armament_depots_desc: "Проверенная цепь мастерских и охраняемых депо даст армии восстановления постоянную производственную базу либо выдаст оставшийся запас, если округ уже захвачен."
 VAD_restore_crown_commissions: "Восстановить коронные комиссии"
 VAD_restore_crown_commissions_desc: "Влад возродит старые комиссии как учётные органы республиканского восстановления, а не частные военные дворы."
 VAD_bind_officers_to_chancery: "Подчинить офицеров канцелярии"
 VAD_bind_officers_to_chancery_desc: "Каждый приказ обычного правительства восстановления получит именной гражданский мандат и вернётся отчётом в канцелярию Влада."
 VAD_guarantee_worker_committees: "Гарантировать рабочие комитеты"
 VAD_guarantee_worker_committees_desc: "Спасённый Уоркер и Влад защитят избранные комитеты от военного роспуска, пока совместное правительство действует в условиях войны."
 VAD_ratify_joint_command: "Утвердить совместное командование"
 VAD_ratify_joint_command_desc: "Рабочие делегаты и офицеры восстановления утвердят единое ограниченное соглашение, не уничтожая ни один источник легитимности."
 VAD_settle_restoration_authority: "Определить власть восстановления"
 VAD_settle_restoration_authority_desc: "Обычная канцелярия Влада или редкий совместный совет определит политическую власть над общей восточной армией, логистикой и дипломатической программой."
 VAD_balance_council_and_command: "Завершить военное государство восстановления"
 VAD_balance_council_and_command_desc: "Выбранное политическое устройство, подвижный штаб, восточные склады и миссия в Солярино образовали единого претендента, готового бороться за центр."
 VAD_assemble_joint_general_staff: "Собрать совместный генеральный штаб"
 VAD_assemble_joint_general_staff_desc: "Гражданские администраторы и полевые коменданты подчинятся единому оперативному расписанию перед борьбой за центр."
 VAD_restore_prefectural_courts: "Восстановить префектурные суды"
 VAD_restore_prefectural_courts_desc: "Возобновившие работу суды превратят чрезвычайные реквизиции в учтённые решения и дадут мобилизации Влада законную цепь, способную пережить новое смещение фронта."
 VAD_issue_crown_mobilization_warrants: "Издать коронные мобилизационные ордера"
 VAD_issue_crown_mobilization_warrants_desc: "Именные ордера призовут резервные роты, откроют проверенные запасы оружия и подчинят каждый чрезвычайный набор канцелярии восстановления."
 VAD_turn_the_chancery_into_a_war_cabinet: "Превратить канцелярию в военный кабинет"
 VAD_turn_the_chancery_into_a_war_cabinet_desc: "Влад заменит разрозненные временные органы постоянным кабинетом, который соединит право, мобилизацию и полевое командование ценой ужесточения чрезвычайного режима."
 VAD_elect_district_commissars: "Избрать окружных комиссаров"
 VAD_elect_district_commissars_desc: "Совместное правительство позволит окружным собраниям избрать комиссаров, которые внесут гарантии рабочих в административную цепь армии."
 VAD_merge_guard_and_worker_rolls: "Объединить списки гвардии и рабочих"
 VAD_merge_guard_and_worker_rolls_desc: "Списки гвардии и заводские реестры станут единым проверяемым резервом, чтобы офицеры и комитеты не мобилизовали одних людей дважды."
 VAD_sign_the_dual_authority_protocol: "Подписать протокол двоевластия"
 VAD_sign_the_dual_authority_protocol_desc: "Постоянный протокол разделит гражданский надзор и оперативное командование между делегатами спасённого Уоркера и штабом Влада, не парализуя ни одну сторону."
 VAD_map_the_solar_corridors: "Нанести соляринские коридоры на карту"
 VAD_map_the_solar_corridors_desc: "Доклады миссии связи превратятся в маршрутные таблицы, обследования мостов и разведывательные досье на оба соперничающих правительства Солярино."
 VAD_preposition_restoration_columns: "Заранее развернуть колонны восстановления"
 VAD_preposition_restoration_columns_desc: "Подвижные колонны снабжения и управления соберутся у восточных дорог, готовые поддержать союзника либо последовать на юг за армией восстановления."
 VAD_define_the_solar_settlement: "Определить устройство Солярино"
 VAD_define_the_solar_settlement_desc: "Коалиция восстановления должна закрепить соляринскую политику открытым решением: соглашением с уцелевшей республикой либо ограниченной интервенцией против её узурпаторов."
 VAD_open_the_remaining_fronts: "Открыть оставшиеся фронты"
 VAD_open_the_remaining_fronts_desc: "Если правительство восстановления застряло на уцелевшем центральном округе или соперничающем претенденте, оно откроет все оставшиеся центральные фронты сразу, а не будет ждать соседнего коридора."
 VAD_open_the_remaining_fronts_available_tt: "Должен существовать хотя бы один независимое центральное малое государство или соперничающий центральный претендент, с которым $VAD$ ещё не воюет. Должна идти центральная война. Малое государство должно оставаться вне коалиций. $VAD$ уже должен открыть центральную войну, подписать двоевластие, нанести соляринские коридоры на карту либо объявить имперское или двухпалатное устройство."
 VAD_open_the_remaining_fronts_effect_tt: "Объявит отдельные войны на аннексию всем оставшимся независимым центральным малым государствам: §Y$EYR$, $EGC$, $RIV$, $REV$, $YOR$, $NDN$, $SWB$, $VHV$ и $OSV$§!, а также оставшимся соперничающим претендентам §Y$WKR$ и $TVA$§!. Расстояние объявлению не мешает. Доступно после начала центральной войны. Автономии в коалициях не становятся отдельными целями; союзники сохраняют своё положение."
 VAD_reconcile_emergency_district_rolls: "Сверить чрезвычайные окружные списки"
 VAD_reconcile_emergency_district_rolls_desc: "Военные, трудовые и продовольственные списки будут сверены по округам, чтобы правительство восстановления знало, на кого ещё может рассчитывать."
 VAD_restore_eastern_supply_corridors: "Восстановить восточные коридоры снабжения"
 VAD_restore_eastern_supply_corridors_desc: "Ремонтные колонны вновь откроют восточные дороги и склады, связывающие администрацию Влада с оставшимися центральными фронтами."
 VAD_convert_emergency_workshops: "Перевести ремонтные мастерские на военный выпуск"
 VAD_convert_emergency_workshops_desc: "Восточные ремонтные цеха будут перестроены в скромный, но надёжный источник оружия и полевого снаряжения."
 VAD_publish_interim_restoration_register: "Опубликовать временный реставрационный реестр"
 VAD_publish_interim_restoration_register_desc: "Открытый реестр округов, командований и чрезвычайных обязательств превратит коалицию восстановления в правительство, способное пережить войну."
 TVA_reroute_city_grid: "Перенаправить городскую сеть"
 TVA_reroute_city_grid_desc: "Инженеры Воркса распределят энергию между мастерскими, насосами и железнодорожными подстанциями по единому измеримому аварийному графику."
 TVA_deploy_field_laboratories: "Развернуть полевые лаборатории"
 TVA_deploy_field_laboratories_desc: "Небольшие технические группы при армии будут испытывать ремонтные решения и тактику на месте сбоя, не дожидаясь столичного отчёта."
 TVA_raise_technical_battalions: "Подготовить технический резерв"
 TVA_raise_technical_battalions_desc: "Инженеры и обученные рабочие составят ограниченный резерв для участков, где разрушенная инфраструктура опасна не меньше противника."
 TVA_seal_the_approaches: "Обследовать оборонительные рубежи"
 TVA_seal_the_approaches_desc: "Инженеры обследуют рубежи отхода, мосты и железнодорожные узлы, чтобы армия могла защитить столицу без бессмысленной траты людей на импровизированный крепостной пояс."
 TVA_issue_emergency_output_norms: "Ввести чрезвычайные нормы выпуска"
 TVA_issue_emergency_output_norms_desc: "Директория опубликует выполнимые аварийные нормы и выдаст ограниченный запас снаряжения, не истощая все мастерские сразу."
 TVA_build_mobile_repair_trains: "Создать подвижные ремонтные поезда"
 TVA_build_mobile_repair_trains_desc: "Железнодорожные бригады будут перебрасывать инструменты и инженеров между повреждёнными узлами, сохраняя технический резерв армии при движении фронта."
 TVA_publish_operational_metrics: "Унифицировать оперативную отчётность"
 TVA_publish_operational_metrics_desc: "Штабы, склады и полевые мастерские будут использовать единый краткий отчёт о снабжении, ремонте, потерях и резервах. Решения можно будет исправлять по фактам, а не по противоречивым оценкам."
 TVA_optimize_for_throughput: "Оптимизировать валовый выпуск"
 TVA_optimize_for_throughput_desc: "Директория примет удлинённые смены и ускоренный износ, чтобы немедленно наполнить склады оружием. Показатели вырастут, но общественную цену не станут скрывать."
 TVA_protect_irreplaceable_specialists: "Сберечь незаменимых специалистов"
 TVA_protect_irreplaceable_specialists_desc: "Инженеров и приборостроителей нельзя заменить очередным призывом. Защищённые группы сохранят технические знания даже ценой немедленного выпуска."
 TVA_standardize_emergency_administration: "Унифицировать чрезвычайную администрацию"
 TVA_standardize_emergency_administration_desc: "Какой бы приоритет ни был выбран, все ведомства перейдут на единые таблицы потерь, пределы полномочий и порядок проверки. Полевая директория станет настоящим правительством."
 TVA_delegate_to_algorithmic_board: "Передать расчёты алгоритмической коллегии"
 TVA_delegate_to_algorithmic_board_desc: "Инженеры и статистики рассчитают приоритеты по опубликованным ограничениям, но Воркс сохранит ответственность за исходные допущения и не спрячется за результатом."
 TVA_select_trial_protocol: "Выбрать протокол полевых испытаний"
 TVA_select_trial_protocol_desc: "Доктор Воркс потребует одного контролируемого боевого эксперимента до распространения технической доктрины на всю армию."
 TVA_test_remote_fire_control: "Испытать дистанционное управление огнём"
 TVA_test_remote_fire_control_desc: "Полевые лаборатории испытают проводное наблюдение, уточнённые таблицы стрельбы и удалённую координацию на одном ограниченном участке."
 TVA_test_adaptive_logistics: "Испытать адаптивную логистику"
 TVA_test_adaptive_logistics_desc: "Ремонтные группы проверят гибкие складские графики и правила перенаправления на реальных перебоях фронта."
 TVA_integrate_field_results: "Внедрить результаты испытаний"
 TVA_integrate_field_results_desc: "Результаты выбранного опыта будут проверены, ошибки сохранены в отчёте, а армии передадут только воспроизводимые процедуры."
 TVA_harden_switching_stations: "Укрепить коммутационные станции"
 TVA_harden_switching_stations_desc: "Ремонтные поезда заранее разместят детали и обходные схемы у энергетических и железнодорожных узлов, наиболее уязвимых для удара."
 TVA_close_operational_loop: "Связать штаб и производство"
 TVA_close_operational_loop_desc: "Генеральный штаб, железнодорожная администрация и производственные коллегии перейдут на единый график. К борьбе за центр правительство Воркса подходит как дисциплинированная техническая администрация, а не импровизированный штаб лабораторий."
 TVA_unattended_shifts: "Разрешить безлюдные смены"
 TVA_unattended_shifts_desc: "Оснащённые приборами линии смогут работать ночью сокращённым составом, если коллегия признает аварийные остановки, износ станков и нагрузку на городскую сеть измеримой ценой."
 TVA_delegate_fire_plans_to_board: "Передать огневые планы коллегии"
 TVA_delegate_fire_plans_to_board_desc: "Алгоритмическая коллегия сопоставит боезапас, донесения наблюдателей и расчётное движение противника, а затем выдаст единый огневой график всем участвующим батареям."
 TVA_bunker_specialist_cadres: "Сформировать кадры специалистов по укреплениям"
 TVA_bunker_specialist_cadres_desc: "Защищённых инженеров сведут в небольшие группы, обученные размечать сектора огня, усиливать существующие укрытия и готовить пехоту к обороне городских узлов."
 TVA_standardize_assault_teams: "Стандартизировать штурмовые группы"
 TVA_standardize_assault_teams_desc: "Технические батальоны получат единый штат инженеров, стрелковых групп, связных и пополнения. Потрёпанные отряды смогут восстанавливаться без новой импровизации."
 TVA_network_observation_posts: "Связать наблюдательные посты в сеть"
 TVA_network_observation_posts_desc: "Полевые телефоны, измеренные ориентиры и резервные каналы донесений превратят разрозненных наблюдателей в единую систему управления огнём."
 TVA_mandate_modular_repair: "Предписать модульный ремонт"
 TVA_mandate_modular_repair_desc: "Депо перестанут восстанавливать каждую повреждённую машину как уникальный образец. Стандартные узлы можно заменить в поле, а неисправные вернуть в строй позже."
 TVA_print_interchangeable_repair_modules: "Напечатать чертежи взаимозаменяемых узлов"
 TVA_print_interchangeable_repair_modules_desc: "Лучшие результаты выбранной метрики и полевого испытания превратятся в допуски, перечни деталей и технологические карты, доступные любому депо директората."
 TVA_preposition_switching_crews: "Выдвинуть переключающие бригады"
 TVA_preposition_switching_crews_desc: "Подвижные бригады, запасные реле и защищённые маршрутные таблицы разместятся за фронтом, чтобы сразу перенаправить энергию и поезда при смене направления операции."
 TVA_cross_validate_trial_logs: "Перекрёстно проверить журналы испытаний"
 TVA_cross_validate_trial_logs_desc: "Лабораторные записи, полевые донесения и производственные ведомости сравнят построчно. Расхождения важнее удобных средних показателей."
 TVA_authorize_iteration_two: "Разрешить вторую итерацию"
 TVA_authorize_iteration_two_desc: "Когда каждая ошибка записана, а каждый узел воспроизводим, Воркс сможет ввести второй оперативный протокол - временную, но цельную систему для следующей кампании."
 TVA_open_the_remaining_fronts: "Открыть оставшиеся фронты"
 TVA_open_the_remaining_fronts_desc: "Если дирекция застряла на уцелевшем центральном округе или соперничающем претенденте, она будет считать оставшиеся независимые правительства одним оперативным набором и откроет их вместе."
 TVA_open_the_remaining_fronts_available_tt: "Должен существовать хотя бы один независимое центральное малое государство или соперничающий центральный претендент, с которым $TVA$ ещё не воюет. Должна идти центральная война. Малое государство должно оставаться вне коалиций. $TVA$ уже должен открыть центральную войну либо разрешить вторую итерацию."
 TVA_open_the_remaining_fronts_effect_tt: "Объявит отдельные войны на аннексию всем оставшимся независимым центральным малым государствам: §Y$EYR$, $EGC$, $RIV$, $REV$, $YOR$, $NDN$, $SWB$, $VHV$ и $OSV$§!, а также оставшимся соперничающим претендентам §Y$WKR$ и $VAD$§!. Расстояние объявлению не мешает. Доступно после начала центральной войны. Автономии в коалициях не становятся отдельными целями; союзники сохраняют своё положение."
 WRK_worker_convene_reunification_congress: "Созвать Конгресс воссоединения"
 WRK_worker_convene_reunification_congress_desc: "Победившее рабочее правительство предложит уцелевшим советам и республикам определить объединение как возобновлённое согласие, а не указ завоевателя."
 WRK_worker_restore_unity_tower: "Восстановить Башню Единства"
 WRK_worker_restore_unity_tower_desc: "Рабочее правительство вернёт Башне её прежний силуэт и превратит руины в общедоступный центр республики."
 WRK_worker_west_mandate_offices: "Конституционные бюро Запада"
 WRK_worker_west_mandate_offices_desc: "Конгресс открывает бюро, которые объясняют жителям Иторы и Римата, что значит место в общем доме."
 WRK_worker_west_solidarity_committees: "Комитеты солидарности"
 WRK_worker_west_solidarity_committees_desc: "Рабочие комитеты готовы идти за мандатом конфедерации туда, куда не дошли её депутаты."
 WRK_worker_west_mandate_for_itora: "Мандат для Иторы"
 WRK_worker_west_mandate_for_itora_desc: "Конфедерация предлагает Иторе вступить в общий дом. Отказ будет означать войну."
 WRK_worker_west_confederate_charter: "Хартия западных республик"
 WRK_worker_west_confederate_charter_desc: "Новые конфедеративные республики получают хартию, которая определяет их место в общем доме."
 WRK_joint_restore_unity_tower: "Восстановить Башню по хартии"
 WRK_joint_restore_unity_tower_desc: "Совместная канцелярия восстановит Башню как общий символ закона, армии и округов."
 WRK_joint_west_frontier_commands: "Пограничные командования"
 WRK_joint_west_frontier_commands_desc: "Империя создаёт командования для марок, которые она считает своими."
 WRK_joint_west_imperial_columns: "Имперские колонны"
 WRK_joint_west_imperial_columns_desc: "Колонны собираются у северного коридора."
 WRK_joint_west_return_of_the_marches: "Возвращение марок"
 WRK_joint_west_return_of_the_marches_desc: "Петричев требует вернуть марки Иторы в состав империи."
 WRK_joint_west_imperial_settlement: "Имперское урегулирование"
 WRK_joint_west_imperial_settlement_desc: "Империя устраивает завоёванный Запад по единому уставу."
 WRK_utilitarian_restore_unity_tower: "Реконструировать Башню по чертежам"
 WRK_utilitarian_restore_unity_tower_desc: "Директорат восстановит Башню по сохранившимся расчётам, вернув ей роль узла связи и управления."
 WRK_utilitarian_west_corridor_survey: "Изыскания коридора"
 WRK_utilitarian_west_corridor_survey_desc: "Инженеры Воркса обследуют северный коридор и составляют план его включения в общую сеть."
 WRK_utilitarian_west_engineer_battalions: "Инженерные батальоны"
 WRK_utilitarian_west_engineer_battalions_desc: "Сапёры, связисты и ремонтные бригады сводятся в батальоны, которые пойдут впереди дивизий."
 WRK_utilitarian_west_engineering_border: "Инженерная граница"
 WRK_utilitarian_west_engineering_border_desc: "Дирекция требует передать приграничье Иторы в общую сеть. Отказ будет означать войну."
 WRK_utilitarian_west_technical_trusteeship: "Техническая опека"
 WRK_utilitarian_west_technical_trusteeship_desc: "Промышленность побеждённых переходит под управление инженерных коллегий."
 WRK_west_crisis_add_tt: "Западный счёт: §Y+10§!."
 WRK_west_final_ready_tt: "Западный вопрос открыт, Итора не ведёт интервенцию и война за Запад ещё не начата"
 WRK_worker_west_war_tt: "Начинается §Yвойна за Запад§! против Иторы. При победе Итора и её союзники станут конфедеративными республиками."
 WRK_joint_west_war_tt: "Начинается §Yвойна за Запад§! против Иторы. При победе Итора и её союзники будут присоединены."
 WRK_utilitarian_west_war_tt: "Начинается §Yвойна за Запад§! против Иторы. При победе её приграничье отойдёт Воркерланду, а Итора перейдёт под техническую опеку."
 WRK_worker_open_erased_nations_archives: "Открыть архивы стёртых народов"
 WRK_worker_open_erased_nations_archives_desc: "Скрытые реестры и свидетельства будут опубликованы, чтобы изгнанные сообщества смогли доказать, кем они были и что у них отняли."
 WRK_worker_recognize_free_republics: "Признать свободные республики"
 WRK_worker_recognize_free_republics_desc: "Конгресс откажется считать все уцелевшие республики мятежными провинциями. Те, кто сохранил независимость и не выступил против нового порядка, смогут получить официальный договор вместо требования безусловного подчинения."
 WRK_worker_fund_cooperative_reconstruction: "Финансировать кооперативное восстановление"
 WRK_worker_fund_cooperative_reconstruction_desc: "Железнодорожники и местные кооперативы получат скромный фонд общественных работ, чтобы вновь связать общины до окончательного устройства границ."
 WRK_worker_restore_displaced_councils: "Вернуть советы переселенцев"
 WRK_worker_restore_displaced_councils_desc: "Представительные советы вернутся до окончательного урегулирования границ и ведомств, облегчая наследие насильственного стирания."
 WRK_worker_authorize_homecoming_commissions: "Уполномочить комиссии по возвращению"
 WRK_worker_authorize_homecoming_commissions_desc: "Смешанные местные комиссии зафиксируют права возвращающихся и откроют управляемый порядок восстановления национальных территорий объединённого государства."
 WRK_worker_prioritize_housing_guarantees: "Сначала гарантировать жильё"
 WRK_worker_prioritize_housing_guarantees_desc: "Вернувшимся семьям нужны крыша, коммунальные услуги и правовая защита ещё до разрешения всех споров о собственности. Первые расходы возьмёт на себя общегосударственная гарантия."
 WRK_worker_devolve_reconstruction_grants: "Передать гранты местным советам"
 WRK_worker_devolve_reconstruction_grants_desc: "Местные советы лучше знают, какие мосты, больницы и мастерские можно открыть первыми. Конгресс даст им прямое финансирование в обмен на открытый отчёт."
 WRK_worker_ratify_republican_compact: "Ратифицировать республиканский пакт"
 WRK_worker_ratify_republican_compact_desc: "Помощь переселенцам и местное восстановление станут общим пактом: республики сохранят голос, а объединённое государство гарантирует равные права и совместное возрождение."
 WRK_worker_write_constitutional_guarantees: "Записать конституционные гарантии"
 WRK_worker_write_constitutional_guarantees_desc: "Конституция закрепит представительство республик, права рабочих организаций и защиту вернувшихся общин. Чрезвычайный порядок переселения уступит место постоянному праву."
 WRK_joint_convene_restoration_council: "Созвать Совет восстановления"
 WRK_joint_convene_restoration_council_desc: "Победившая коалиция Арми созовёт совет, соединяющий правовую преемственность с властью армии, вернувшей центр. Если Никита Уоркер пережил распад благодаря Владу, их чрезвычайный компромисс станет основой нового правительства."
 WRK_joint_publish_amnesty_registers: "Опубликовать реестры амнистии"
 WRK_joint_publish_amnesty_registers_desc: "Названные участники войны после сдачи оружия вернутся к мирной жизни, но организаторы массовых преступлений останутся вне амнистии."
 WRK_joint_establish_military_districts: "Учредить военные округа"
 WRK_joint_establish_military_districts_desc: "Объединённые земли будут разделены на подотчётные военные округа, способные исполнять приказы без возрождения частных армий."
 WRK_joint_reopen_district_rail_commands: "Восстановить окружное железнодорожное управление"
 WRK_joint_reopen_district_rail_commands_desc: "Гражданские инженеры и окружные штабы совместно вернут железнодорожные управления, связывающие гарнизоны, склады и восстановленные администрации."
 WRK_joint_issue_integration_warrants: "Выдать ордера на интеграцию"
 WRK_joint_issue_integration_warrants_desc: "Совет восстановления выдаст отдельные ордера для каждого региона вместо безусловного признания территориальных прав одним общим указом."
 WRK_joint_restore_central_chancery: "Восстановить центральную канцелярию"
 WRK_joint_restore_central_chancery_desc: "Новая канцелярия сведёт армейские приказы, окружные отчёты и гражданское право в единый долговечный государственный реестр."
 WRK_joint_civilianize_district_police: "Передать окружную полицию гражданским"
 WRK_joint_civilianize_district_police_desc: "Повседневный порядок вернётся к подготовленным гражданским управлениям, а армия займётся границами и чрезвычайными угрозами вместо обычного управления."
 WRK_joint_retain_emergency_inspectorate: "Сохранить чрезвычайную инспекцию"
 WRK_joint_retain_emergency_inspectorate_desc: "Небольшая центральная инспекция продолжит проверять арсеналы, гарнизоны и окружные штабы, пока восстановленное государство не сможет доверять всей цепи командования."
 WRK_joint_codify_single_chain_of_command: "Закрепить единую цепь командования"
 WRK_joint_codify_single_chain_of_command_desc: "Независимо от скорости перехода к гражданскому порядку каждый чиновник и офицер будет подчиняться одной опубликованной иерархии и одному своду законов."
 WRK_joint_impose_reunification_settlement: "Закрепить соглашение о воссоединении"
 WRK_joint_impose_reunification_settlement_desc: "Амнистия и единый закон заменят военные администрации. Республикам предложат порядок возвращения, но внутри восстановленного государства больше не останется конкурирующих армий и суверенитетов."
 WRK_utilitarian_form_reconstruction_directorate: "Учредить Директорию восстановления"
 WRK_utilitarian_form_reconstruction_directorate_desc: "Воркс наделит инженеров и гражданских администраторов временным мандатом на восстановление энергетики, транспорта, жилья и промышленности. Директория обязана опубликовать программу и отчитаться за использованные ресурсы."
 WRK_utilitarian_standardize_power_grid: "Стандартизировать энергосеть"
 WRK_utilitarian_standardize_power_grid_desc: "Единое напряжение, ремонтные протоколы и порядок распределения нагрузки свяжут восстановленную столицу с национальной системой."
 WRK_utilitarian_rebuild_machine_tool_pool: "Восстановить станочный резерв"
 WRK_utilitarian_rebuild_machine_tool_pool_desc: "Учтённый запас станков и стандартных запасных частей перезапустит один промышленный центр и поддержит дальнейшие промышленные исследования."
 WRK_utilitarian_expand_national_laboratories: "Учредить Государственную инженерную службу"
 WRK_utilitarian_expand_national_laboratories_desc: "Бывшие полевые лаборатории станут постоянной гражданской службой, испытывающей энергетическое, связное и промышленное оборудование до начала государственных закупок."
 WRK_utilitarian_publish_integration_metrics: "Проверить региональные администрации"
 WRK_utilitarian_publish_integration_metrics_desc: "Государство опубликует, действительно ли каждая региональная администрация контролирует свою территорию и обеспечивает транспорт, энергетику, учёт и общественный порядок. Выполнение этих условий откроет законный путь к восстановлению национального статуса."
 WRK_utilitarian_rationalize_districts: "Пересмотреть служебные округа"
 WRK_utilitarian_rationalize_districts_desc: "Административные границы и полномочия будут следовать транспорту, населению и реальному охвату государственных служб, а не фронтам, оставшимся после гражданской войны."
 WRK_utilitarian_prioritize_public_utilities: "Отдать приоритет коммунальным службам"
 WRK_utilitarian_prioritize_public_utilities_desc: "Энергия, вода и транспортная мощность сначала пойдут жилым районам и важнейшим службам, даже если заводам придётся ждать следующего цикла распределения."
 WRK_utilitarian_prioritize_industrial_recovery: "Отдать приоритет промышленности"
 WRK_utilitarian_prioritize_industrial_recovery_desc: "Надёжное массовое производство ускорит все последующие программы. Директория примет временную нагрузку на гражданское хозяйство ради первоочередного восстановления выпуска."
 WRK_utilitarian_publish_reconstruction_ledger: "Опубликовать реестр восстановления"
 WRK_utilitarian_publish_reconstruction_ledger_desc: "Единый открытый реестр покажет распределение ресурсов, задержки, ремонт и измеримые результаты, превратив чрезвычайный мандат в подотчётную общегосударственную программу."
 WRK_utilitarian_build_measurable_republic: "Учредить технократическую республику"
 WRK_utilitarian_build_measurable_republic_desc: "Чрезвычайная директория уступит место постоянным институтам: профессиональной государственной службе, открытым бюджетам, технической оценке решений и правительству, отвечающему за конкретные общественные результаты."
 ADISCORD_vorkerland_claimant.1.t: "Кто говорит от имени фронта?"
 ADISCORD_vorkerland_claimant.1.d: "Первый конгресс после распада переполнен железнодорожными делегатами, измученными офицерами и заводскими организаторами с несовместимыми перечнями срочных нужд. Республика должна решить, чьи записи станут общей правдой."
 ADISCORD_vorkerland_claimant.1.a: "Пусть делегаты опубликуют списки."
 ADISCORD_vorkerland_claimant.1.b: "Фронту нужен единый оперативный график."
 ADISCORD_vorkerland_claimant.2.t: "Власть за баррикадами"
 ADISCORD_vorkerland_claimant.2.d: "Советы спорят, спасут ли чрезвычайную республику добровольные союзники или усиленный внутренний исполком. Даже после конституционного выбора его практические пределы ещё предстоит определить."
 ADISCORD_vorkerland_claimant.2.a: "Легитимность должна оставаться публичной."
 ADISCORD_vorkerland_claimant.2.b: "Переговоры останутся в штабной комнате."
 ADISCORD_vorkerland_claimant.3.t: "Мастерские требуют приоритета"
 ADISCORD_vorkerland_claimant.3.d: "Открытые мастерские не могут одновременно чинить локомотивы, вытачивать оружейные детали и заменять гражданские насосы. Советы требуют письменного приоритета перед следующей сменой."
 ADISCORD_vorkerland_claimant.3.a: "Первую партию получит фронт."
 ADISCORD_vorkerland_claimant.3.b: "Сохраним ремонтную сеть."
 ADISCORD_vorkerland_claimant.4.t: "Западный мандат обретает форму"
 ADISCORD_vorkerland_claimant.4.nikita.d: "Верные Никите Уоркеру советы удержались достаточно долго, чтобы записать пределы чрезвычайной власти. Делегаты спорят, что важнее: публичный контроль или оперативная проверка."
 ADISCORD_vorkerland_claimant.4.anton.d: "Резервный исполком Антона Бэгли связал железные дороги, мастерские и полевое командование единой директивой. Теперь аппарат выбирает между централизацией и материальным резервом."
 ADISCORD_vorkerland_claimant.4.nikita.a: "Сохранить публичный мандат."
 ADISCORD_vorkerland_claimant.4.nikita.b: "Дать делегатам право военной проверки."
 ADISCORD_vorkerland_claimant.4.anton.a: "Централизовать директивную коллегию."
 ADISCORD_vorkerland_claimant.4.anton.b: "Защитить материальный резерв."
 ADISCORD_vorkerland_claimant.10.t: "Чернила на хартии восстановления"
 ADISCORD_vorkerland_claimant.10.d: "Юристы хотят занести каждое чрезвычайное полномочие в реестр канцелярии. Полевые командиры отвечают, что печать бесполезна, если дорога для её доставки уже потеряна."
 ADISCORD_vorkerland_claimant.10.a: "Никакой власти без записанного ордера."
 ADISCORD_vorkerland_claimant.10.b: "Подвижному штабу нужна свобода действий."
 ADISCORD_vorkerland_claimant.11.t: "Донесения из Солярино"
 ADISCORD_vorkerland_claimant.11.d: "Миссия связи вернулась с неполными картами, соперничающими делегациями и несколькими несовместимыми версиями того, кто ещё вправе говорить за Солярино. Канцелярия должна решить, какую часть отчёта публиковать."
 ADISCORD_vorkerland_claimant.11.a: "Опубликовать дипломатическую оценку."
 ADISCORD_vorkerland_claimant.11.b: "Военное приложение отправить генеральному штабу."
 ADISCORD_vorkerland_claimant.12.t: "Ключи от восточных складов"
 ADISCORD_vorkerland_claimant.12.d: "Кладовщики откроют ворота только после именных ордеров. Армия требует выдать резерв до того, как новое отступление перережет дорогу."
 ADISCORD_vorkerland_claimant.12.a: "Выдать проверенный резерв."
 ADISCORD_vorkerland_claimant.12.b: "Сохранить распределённую сеть депо."
 ADISCORD_vorkerland_claimant.13.t: "Власть за восточной армией"
 ADISCORD_vorkerland_claimant.13.joint.d: "Канцелярия Влада и делегаты спасённого Уоркера согласились править вместе до конца чрезвычайного положения. Им предстоит выбрать между гражданскими гарантиями и единством штаба."
 ADISCORD_vorkerland_claimant.13.vlad.d: "Обычное правительство Влада восстановило цепь от коронных комиссий до полевого штаба. Канцелярия выбирает между письменным мандатом и немедленным командованием."
 ADISCORD_vorkerland_claimant.13.joint.a: "Закрепить гражданские гарантии."
 ADISCORD_vorkerland_claimant.13.joint.b: "Защитить полномочия совместного штаба."
 ADISCORD_vorkerland_claimant.13.vlad.a: "Каждому приказу нужен коронный мандат."
 ADISCORD_vorkerland_claimant.13.vlad.b: "Пусть канцелярия командует чрезвычайным положением."
 ADISCORD_vorkerland_claimant.14.t: "Устройство Солярино"
 ADISCORD_vorkerland_claimant.14.joint.d: "Перед совместным советом лежат карты миссии связи, планы резервных колонн и итоговый доклад о региональной войне в Солярино. Делегаты рабочих требуют открытого соглашения, а штаб восстановления не желает оставлять южные дороги в руках враждебного преемника."
 ADISCORD_vorkerland_claimant.14.vlad.d: "Кабинет Влада свёл вопрос Солярино к записанному мандату. Уцелевшая республика сможет войти в коалицию восстановления; победившего узурпатора встретят подготовленные колонны, а старая республика будет возвращена под защитой Арми."
 ADISCORD_vorkerland_claimant.14.joint.a: "Выдать мандат на соляринское соглашение."
 ADISCORD_vorkerland_claimant.14.vlad.a: "Скрепить мандат восстановления печатью."
 ADISCORD_vorkerland_claimant.20.t: "Первые честные таблицы"
 ADISCORD_vorkerland_claimant.20.d: "Первый сводный отчёт директории хуже прежних оценок: пропавшие инструменты, дважды учтённые батальоны и подстанции. Воркс отказывается исправлять цифры указом."
 ADISCORD_vorkerland_claimant.20.a: "Опубликовать поправки и вернуть доверие."
 ADISCORD_vorkerland_claimant.20.b: "Немедленно ввести единую оперативную таблицу."
 ADISCORD_vorkerland_claimant.21.t: "Правительство измеримых пределов"
 ADISCORD_vorkerland_claimant.21.d: "Производственные коллегии и защищённые группы специалистов теперь отвечают одной администрации. Их разногласие стало измеримым, но не исчезло."
 ADISCORD_vorkerland_claimant.21.a: "Потери должны оставаться видимыми."
 ADISCORD_vorkerland_claimant.21.b: "Подробные таблицы получат только командиры."
 ADISCORD_vorkerland_claimant.22.t: "Энергия для мастерских"
 ADISCORD_vorkerland_claimant.22.d: "Отремонтированная линия может питать оружейные предприятия или стабилизировать несколько жилых районов. Оба решения обоснованы, но следующую партию трансформаторов получит только одно направление."
 ADISCORD_vorkerland_claimant.22.a: "Сначала запитать оружейную линию."
 ADISCORD_vorkerland_claimant.22.b: "Стабилизировать гражданскую сеть."
 ADISCORD_vorkerland_claimant.23.t: "Воркс выбирает полевое испытание"
 ADISCORD_vorkerland_claimant.23.d: "До центральной кампании лаборатории смогут провести лишь один полноценный контролируемый опыт. Доктор Дориан Воркс требует сделать выбор явным и сохранить в отчёте все неудачи."
 ADISCORD_vorkerland_claimant.23.a: "Испытать батальоны технического резерва."
 ADISCORD_vorkerland_claimant.23.b: "Испытать дистанционное управление огнём."
 ADISCORD_vorkerland_claimant.23.c: "Испытать адаптивную логистику."
 ADISCORD_vorkerland_claimant.24.t: "Расхождение трёх ведомостей"
 ADISCORD_vorkerland_claimant.24.d: "Лаборатория, полевой штаб и производственная коллегия по-разному описывают одно испытание. Воркс отказывается скрывать расхождение средним значением: вторая итерация должна начаться с одной признанной причины ошибки."
 ADISCORD_vorkerland_claimant.24.a: "Исправить методику аудита."
 ADISCORD_vorkerland_claimant.24.b: "Явно учитывать полевой разброс."
 ADISCORD_vorkerland_claimant.24.c: "Пересчитать производственные допуски."
 ADISCORD_vorkerland_claimant.30.t: "Западный претендент готов к борьбе за центр"
 ADISCORD_vorkerland_claimant.30.d: "Политическая власть, полевые офицеры, железнодорожные советы и мастерские подчинены единой чрезвычайной системе. При публичном мандате Никиты или директивном аппарате Бэгли западный претендент больше не является импровизированным комитетом обороны."
 ADISCORD_vorkerland_claimant.30.a: "Теперь за западным мандатом стоит армия."
 ADISCORD_vorkerland_claimant.31.t: "Государство восстановления обретает форму"
 ADISCORD_vorkerland_claimant.31.d: "Канцелярия способна проследить приказ от выбранного политического устройства до подвижного штаба и восточного склада. Обычное восстановление Влада или редкий совместный совет теперь способны бороться за центр."
 ADISCORD_vorkerland_claimant.31.a: "Право и командование пойдут вместе."
 ADISCORD_vorkerland_claimant.32.t: "Оперативный контур замкнут"
 ADISCORD_vorkerland_claimant.32.d: "Впервые одни и те же цифры направляют штаб, диспетчеров энергосети, лаборатории и ремонтные поезда. Директория Воркса готова отвечать за результат."
 ADISCORD_vorkerland_claimant.32.a: "Грядущая кампания станет нашей мерой."
 ADISCORD_vorkerland_claimant.100.t: "Западный претендент готовится бороться за центр Воркерланда"
 ADISCORD_vorkerland_claimant.100.d: "Западная военная администрация объявила о едином чрезвычайном командовании, опирающемся на заводские батальоны, железнодорожные советы и вновь открытые мастерские. Наблюдатели спорят, выдержит ли кампанию публичный мандат Никиты Уоркера или директивный аппарат Антона Бэгли."
 ADISCORD_vorkerland_claimant.100.a: "Ещё один претендент готов."
 ADISCORD_vorkerland_claimant.101.t: "Восточная коалиция завершила создание военной администрации"
 ADISCORD_vorkerland_claimant.101.d: "Канцелярия Влада, возможный совместный совет, подвижный штаб и восточные склады теперь действуют по выбранной хартии. Сторонники называют это законным восстановлением; соперники видят дисциплинированного претендента, готового навязать свой порядок."
 ADISCORD_vorkerland_claimant.101.a: "Восточный претендент обрёл форму."
 ADISCORD_vorkerland_claimant.102.t: "Воркс связал директорию с фронтом"
 ADISCORD_vorkerland_claimant.102.d: "Техническая директория Дориана Воркса объединила производственные отчёты, полевые лаборатории, распределение энергии и ремонтные поезда в одну оперативную систему. Её право управлять будет испытано в центре."
 ADISCORD_vorkerland_claimant.102.a: "Цифрам предстоит встретиться с полем боя."
 ADISCORD_vorkerland_prewar_compact_requires_both_tt:0 "Центр после подписания получает 5000 ед. пехотного снаряжения и +3% стабильности. Каждый из четырёх округов подписывает договор отдельно и после ратификации обеими сторонами получает 2500 ед. пехотного снаряжения и +3% стабильности. Отказ другого округа не отменяет наш договор. Подписавшие округа чаще поддерживают коалицию Уоркера; игрок сохраняет свободный выбор."
 ADISCORD_vorkerland_showdown_focus_live_war_tt: "Должна идти §Yцентральная схватка§!, а этот претендент должен всё ещё воевать с другим участником центральной войны."

 WRK_open_worker_vadl_backchannel: "Созвать представителей автономий"
 WRK_open_worker_vadl_backchannel_desc: "Эйрмия, гарнизонный округ, Ривен и Йор уже располагают собственными учреждениями. Центр предложит им общие правила снабжения и работы администраций на случай потери связи со столицей."
 WRK_offer_emergency_compact: "Предложить чрезвычайный пакт"
 WRK_offer_emergency_compact_desc: "Общие гарантии вступят в силу после отдельных решений центра и четырёх окружных администраций. Они сохранят местные учреждения и дадут автономиям резерв оружия, но не остановят борьбу за власть после разрушения Башни Единства."
 WRK_mobilize_loyal_republics: "Мобилизовать верные республики"
 WRK_mobilize_loyal_republics_desc: "Провал переговоров раскроет наши намерения, пока округа уходят из-под контроля. Вместо этого мы потребуем от верных республик офицеров, железнодорожную охрану и точные графики мобилизации."
 WRK_place_reserves_under_worker: "Подчинить резервы Уоркеру"
 WRK_place_reserves_under_worker_desc: "Окружные склады и списки пополнения перейдут центральной администрации Уоркера прежде, чем их реквизируют соперничающие чрезвычайные правительства."
 VAD_prepare_vadl_worker_terms: "Согласовать гарантии автономии"
 VAD_prepare_vadl_worker_terms_desc: "Совместная подготовка возможна, если центр признает местные реестры и право администрации распоряжаться окружными запасами. Округ вправе согласиться на пакт или самостоятельно готовиться к чрезвычайному положению."
 VAD_ratify_emergency_compact: "Ратифицировать чрезвычайный пакт"
 VAD_ratify_emergency_compact_desc: "Округ подпишет соглашение о непрерывной работе местных учреждений. После ратификации центром, Эйрмией, гарнизонным округом, Ривеном и Йором каждая из четырёх автономий получит согласованный запас оружия. Пакт не отменяет раскол и не выбирает сторону за игрока."
 VAD_activate_eastern_mandate: "Утвердить окружное командование"
 VAD_activate_eastern_mandate_desc: "Местная администрация возьмёт ответственность за мобилизацию и снабжение гарнизонов. Подготовленные люди и запасы останутся в округе после распада конфедерации."
 VAD_seal_district_arsenals: "Опечатать окружные арсеналы"
 VAD_seal_district_arsenals_desc: "Именные ордера, охраняемые ведомости и раздельные ключи сохранят оружие за местными гарнизонами. Мобилизационная программа продолжит действовать после распада конфедерации."

 WKR_establish_front_operations_bureau: "Учредить бюро фронтовых операций"
 WKR_establish_front_operations_bureau_desc: "Конституционному устройству республики предстоит выдержать подвижный фронт. Небольшое бюро согласует пополнения, планы и запросы командования, не подменяя советы."
 WKR_authorize_republican_mission_commands: "Утвердить штабы особых задач"
 WKR_authorize_republican_mission_commands_desc: "Публичный мандат Никиты допускает временные штабы с узкими письменными задачами. Их полномочия закончатся вместе с операцией, а фронт получит ясный источник приказов."
 WKR_issue_normative_campaign_tables: "Издать нормативные таблицы кампании"
 WKR_issue_normative_campaign_tables_desc: "Аппарат Бэгли превратит кампанию в обязательные графики снабжения, планирования и готовности частей. Единообразие на фронте будет оплачено политической жёсткостью."
 WKR_form_rolling_factory_groups: "Сформировать подвижные заводские группы"
 WKR_form_rolling_factory_groups_desc: "Станочники и компактные мастерские пойдут вслед за железнодорожным резервом, чтобы чинить оружие у фронта, а не отправлять его обратно на запад."
 WKR_reopen_night_freight_corridors: "Открыть ночные грузовые коридоры"
 WKR_reopen_night_freight_corridors_desc: "Графики движения в затемнении и ремонтные бригады оживят два западных грузовых коридора. Если оба потеряны, те же силы соберут небольшой резерв вспомогательного снаряжения."
 WKR_arm_the_mobile_reserve: "Вооружить подвижный резерв"
 WKR_arm_the_mobile_reserve_desc: "Обученный резерв бесполезен, пока его радиостанции, полевые инструменты и командные пункты рассеяны по окружным складам. Мы соберём одну готовую к переброске группу."
 WKR_coordinate_the_rolling_front: "Согласовать подвижный фронт"
 WKR_coordinate_the_rolling_front_desc: "Заводы, грузовые эшелоны и подвижный резерв будут действовать в едином ритме кампании. Система требовательна, но ненадолго позволит наступлению не выдохнуться."

 VAD_convene_campaign_directorate: "Созвать дирекцию кампании"
 VAD_convene_campaign_directorate_desc: "Промежуточный реестр определяет, кто вправе отдавать приказы; дирекция добьётся, чтобы эти приказы доходили до живого фронта вместе с пополнениями и штабной работой."
 VAD_issue_prefectural_field_decrees: "Издать префектурные полевые декреты"
 VAD_issue_prefectural_field_decrees_desc: "Влад заменит временный военный кабинет зрелой префектурной системой, чьи декреты обладают и законной силой, и оперативным приоритетом."
 VAD_seat_front_commissars: "Ввести фронтовых комиссаров"
 VAD_seat_front_commissars_desc: "Совместный совет введёт гражданских делегатов в полевое командование. Их присутствие превратит двоевластие из временной сделки в работающий военный протокол."
 VAD_standardize_restoration_columns: "Стандартизировать колонны реставрации"
 VAD_standardize_restoration_columns_desc: "Единые нормы загрузки, интервалы марша и ремонтные квоты позволят восточным колоннам обмениваться снабжением без нового решения канцелярии."
 VAD_advance_under_one_register: "Наступать по единому реестру"
 VAD_advance_under_one_register_desc: "Будет ли власть у префектур Влада или совместного совета, последнее наступление пройдёт через единую публичную цепь учёта, снабжения и командования."

 TVA_merge_iteration_with_field_command: "Связать итерацию с полевым командованием"
 TVA_merge_iteration_with_field_command_desc: "Второй протокол испытывался в отчётах. Теперь Воркс соединит его с оперативным контуром и проверит исходные допущения требованиями живого фронта."
 TVA_mass_produce_assault_modules: "Наладить выпуск штурмовых модулей"
 TVA_mass_produce_assault_modules_desc: "Опыт технических батальонов превратится во взаимозаменяемые штурмовые комплекты для обычных соединений, не создавая ещё одну армию специалистов."
 TVA_link_observers_to_fire_control: "Связать наблюдателей с управлением огнём"
 TVA_link_observers_to_fire_control_desc: "Донесения наблюдателей войдут в те же таблицы, которыми пользуются группы дистанционного управления огнём, сокращая задержку между целью и поправкой."
 TVA_turn_repair_trains_into_supply_web: "Превратить ремонтные поезда в сеть снабжения"
 TVA_turn_repair_trains_into_supply_web_desc: "Результаты адаптивной логистики соединят ремонтные поезда, путевые бригады и передовые склады в сеть, обходящую измеренные сбои."
 TVA_run_live_front_validation: "Провести проверку на живом фронте"
 TVA_run_live_front_validation_desc: "Воркс опубликует итоговое военное испытание на реальных потерях, задержках и отказах техники. Выбранный опыт определит, какая исследовательская программа получит результат."

 ADISCORD_vorkerland_wrk_loyal_republics_mobilized: "Мобилизация верных республик"
 ADISCORD_vorkerland_wrk_loyal_republics_mobilized_desc: "Окружные графики мобилизации и обученная железнодорожная охрана ускоряют развёртывание и восстановление организации в начале чрезвычайного положения."
 ADISCORD_vorkerland_vad_eastern_mandate: "Окружная мобилизация"
 ADISCORD_vorkerland_vad_eastern_mandate_desc: "Местные учреждения свели призывные списки и заказы оружейным мастерским в единую программу снабжения гарнизонов."
 ADISCORD_vorkerland_wkr_front_operations_bureau: "Бюро фронтовых операций"
 ADISCORD_vorkerland_wkr_front_operations_bureau_desc: "Постоянный военный штаб согласует планирование, пополнения и запросы командования западного претендента."
 ADISCORD_vorkerland_wkr_republican_mission_commands: "Республиканские штабы задач"
 ADISCORD_vorkerland_wkr_republican_mission_commands_desc: "Узкие публичные мандаты придают приказам срочность, не отнимая у советов конституционную власть."
 ADISCORD_vorkerland_wkr_normative_campaign_tables: "Нормативные таблицы кампании"
 ADISCORD_vorkerland_wkr_normative_campaign_tables_desc: "Обязательные оперативные графики улучшают глубину планирования и дисциплину снабжения, но усиливают политическую суровость режима."
 ADISCORD_vorkerland_wkr_rolling_factory_groups: "Подвижные заводские группы"
 ADISCORD_vorkerland_wkr_rolling_factory_groups_desc: "Передвижные мастерские добавляют скорости и прорывной силы ценой износа, неизбежного при импровизированном полевом производстве."
 ADISCORD_vorkerland_wkr_night_freight_corridors: "Ночные грузовые коридоры"
 ADISCORD_vorkerland_wkr_night_freight_corridors_desc: "Ночные железнодорожные графики снижают расход снабжения и ускоряют ремонт западной сети."
 ADISCORD_vorkerland_wkr_rolling_front: "Подвижный фронт"
 ADISCORD_vorkerland_wkr_rolling_front_desc: "В течение короткого наступательного окна западный претендент принимает повышенный расход снабжения ради атаки, прорыва и восстановления организации."
 ADISCORD_vorkerland_vad_campaign_directorate: "Дирекция кампании"
 ADISCORD_vorkerland_vad_campaign_directorate_desc: "Единый штаб превращает зарегистрированную власть в ускоренное планирование, пополнение и командные решения."
 ADISCORD_vorkerland_vad_restoration_war_cabinet_2: "Префектурная военная дирекция"
 ADISCORD_vorkerland_vad_restoration_war_cabinet_2_desc: "Зрелое правительство Влада сохраняет полномочия кабинета реставрации, дополняя их наступательной системой и быстрым вводом пополнений."
 ADISCORD_vorkerland_vad_dual_authority_protocol_2: "Протокол фронтовых комиссаров"
 ADISCORD_vorkerland_vad_dual_authority_protocol_2_desc: "Совместное правительство сохраняет двойную легитимность, одновременно улучшая глубину планов и восстановление между боями."
 ADISCORD_vorkerland_vad_standardized_restoration_columns: "Стандартизированные колонны реставрации"
 ADISCORD_vorkerland_vad_standardized_restoration_columns_desc: "Общие нормы загрузки позволяют восточным колоннам двигаться быстрее и потреблять меньше снабжения."
 ADISCORD_vorkerland_vad_joint_front_operation: "Совместная фронтовая операция"
 ADISCORD_vorkerland_vad_joint_front_operation_desc: "Делегаты совета и полевые офицеры делят усиленное командование и дисциплинированный план снабжения."
 ADISCORD_vorkerland_vad_prefectural_offensive: "Префектурное наступление"
 ADISCORD_vorkerland_vad_prefectural_offensive_desc: "Декреты Влада ускоряют мобилизацию, планирование и атаку в рамках одного зарегистрированного наступления."
 ADISCORD_vorkerland_tva_integrated_second_protocol: "Объединённый второй протокол"
 ADISCORD_vorkerland_tva_integrated_second_protocol_desc: "Вторая итерация связывает планирование, снабжение, ремонт и полевую организацию в одном измеримом протоколе."
 ADISCORD_vorkerland_tva_assault_modules: "Штурмовые модули"
 ADISCORD_vorkerland_tva_assault_modules_desc: "Взаимозаменяемые штурмовые комплекты усиливают атаку и прорыв, одновременно возвращая практический опыт в производство."
 ADISCORD_vorkerland_tva_linked_fire_control: "Связанное управление огнём"
 ADISCORD_vorkerland_tva_linked_fire_control_desc: "Наблюдатели и огневые группы теперь используют единую проверенную оперативную картину."
 ADISCORD_vorkerland_tva_supply_web: "Адаптивная сеть снабжения"
 ADISCORD_vorkerland_tva_supply_web_desc: "Ремонтные поезда и передовые склады обходят повреждения, снижая потери от износа и ускоряя ремонт."
 ADISCORD_vorkerland_tva_live_front_validated: "Проверено живым фронтом"
 ADISCORD_vorkerland_tva_live_front_validated_desc: "Директория проверила объединённую систему на реальных данных кампании и исправила модель, пережившую испытание."

 # Варианты претендентов: неоворкеристская линия WKR.
 WKR_declare_the_revolution_unfinished: "Революция не завершена"
 WKR_declare_the_revolution_unfinished_desc: "Председатель Воркер пережил Воркерград и не намерен быть временным управляющим. Чрезвычайное правительство объявляет, что революция была прервана, а не завершена, и что всё, чем ещё владеет республика, принадлежит её завершению."
 WKR_raise_the_worker_levy: "Рабочий призыв"
 WKR_raise_the_worker_levy_desc: "Каждому цеховому комитету назначена норма в людях, а не в выработке. Призыв заполняет линейные батальоны за недели, а не за месяцы, - и заполняет их теми, кто никогда не держал винтовку."
 WKR_vest_all_power_in_the_chairman: "Вся власть Председателю"
 WKR_vest_all_power_in_the_chairman_desc: "Фронтовые советы голосованием выводят себя из принятия решений. На время чрезвычайного положения подпись Председателя и есть конституция, а свободным республикам за границей предложено прислать всех, кого они могут отпустить."

 # Варианты претендентов: утилитаристская линия WKR.
 WKR_govern_by_delivered_results: "Управление по результату"
 WKR_govern_by_delivered_results_desc: "У Бэгли нет революционной биографии, и он не делает вид, что она есть. Директорат просит судить себя по тоннам, киловаттам и выданным пайкам - и тихо перестаёт просить судить себя по чему-либо ещё."
 WKR_publish_the_ration_ledger: "Опубликовать продовольственную ведомость"
 WKR_publish_the_ration_ledger_desc: "Каждый район получает одинаковый печатный лист: что было обещано, что пришло и кто за это расписался. В войне ничего не меняется - но очереди перестают превращаться в толпы."
 WKR_bind_the_republic_to_its_norms: "Связать республику нормой"
 WKR_bind_the_republic_to_its_norms_desc: "Власть записывается как процедура, а не выдаётся человеку. Такая республика медленнее и скучнее, но её мастерские знают, что с них спросят в следующем квартале."

 # Варианты претендентов: имперская реставрация VAD.
 VAD_reclaim_the_imperial_mandate: "Вернуть имперский мандат"
 VAD_reclaim_the_imperial_mandate_desc: "Петричев перестаёт называть канцелярию временной мерой. Реестры открываются заново под старыми печатями, и вадльская реставрация начинает говорить языком государства, которое юридически никогда не прекращалось."
 VAD_recall_the_officer_estates: "Вернуть офицерские сословия"
 VAD_recall_the_officer_estates_desc: "Офицеры, уволенные республикой, возвращаются в списки старшинства в прежних чинах. Штабная работа улучшается немедленно; районы, помнящие причину увольнений, - нет."
 VAD_crown_the_restoration: "Увенчать реставрацию"
 VAD_crown_the_restoration_desc: "Канцелярия объявляет реставрацию завершённой по праву прежде, чем она завершена на карте. У иностранных ведомств, предпочитающих иметь дело с легитимным Воркерландом, теперь есть документ, на который можно сослаться."

 # Варианты претендентов: совместный совет VAD.
 VAD_seat_the_dual_chamber: "Учредить двойную палату"
 VAD_seat_the_dual_chamber_desc: "Спасённый председатель и районная гвардия сидят в одном зале и подписывают одни и те же приказы. Ни одна сторона не доверяет этому устройству, и обеим оно нужнее, чем собственная правота."
 VAD_open_the_district_rolls: "Открыть районные списки"
 VAD_open_the_district_rolls_desc: "Гвардейские реестры и списки рабочих комитетов сводятся в единый призывной список. Совместное правительство дотягивается туда, куда одной канцелярии войти никогда не позволяли."
 VAD_bind_crown_and_council: "Связать корону и совет"
 VAD_bind_crown_and_council_desc: "Протокол двоевластия вписывается в цепь командования, вместо того чтобы пересматриваться каждый месяц. Государство становится крайне трудно опрокинуть - и заметно медленнее бить."

 # Варианты претендентов: непрерывная мобилизация TVA.
 TVA_declare_continuous_mobilization: "Объявить непрерывную мобилизацию"
 TVA_declare_continuous_mobilization_desc: "Воркс публикует ответ директората: дефицитный ресурс - время. Все прочие величины модели - мощность сети, гражданское снабжение, состояние рабочей силы - переводятся в разряд расходуемых ресурсов."
 TVA_convert_the_civil_grid: "Перевести гражданскую сеть"
 TVA_convert_the_civil_grid_desc: "Коммунальная нагрузка урезается до минимума, удерживающего подачу воды, а остальное переключается на мастерские. Директорат рассчитал, что город переживёт зиму на этой разнице."
 TVA_run_the_republic_as_one_process: "Вести республику как единый процесс"
 TVA_run_the_republic_as_one_process_desc: "Производство, транспорт и пополнение планируются с одного листа и по единому такту. Республика перестаёт быть спором между ведомствами и становится машиной, которая на глазах изнашивается."

 # Варианты претендентов: протокол сохранения TVA.
 TVA_enact_the_preservation_protocol: "Ввести протокол сохранения"
 TVA_enact_the_preservation_protocol_desc: "Воркс публикует другой ответ: дефицитный ресурс - обученные люди. Специалиста, потерянного этой зимой, невозможно заменить до конца войны, поэтому модель перестраивается вокруг того, чтобы их не терять."
 TVA_evacuate_the_design_bureaus: "Эвакуировать конструкторские бюро"
 TVA_evacuate_the_design_bureaus_desc: "Чертёжные, приборные мастерские и их сотрудники вывозятся из-под артиллерийского огня прежде всего остального. Фронт ждёт свои эшелоны три недели; лаборатории продолжают работать."
 TVA_certify_the_surviving_cadre: "Аттестовать уцелевшие кадры"
 TVA_certify_the_surviving_cadre_desc: "Все, кто ещё жив, проходят переаттестацию, и её результаты применяются без исключений. Директорат заканчивает войну с меньшим числом дивизий, чем мог бы поднять, но с армией, которую не нужно учить дважды."

 # Национальные дух варианты претендентов.
 ADISCORD_vorkerland_wkr_unfinished_revolution: "Незавершённая революция"
 ADISCORD_vorkerland_wkr_unfinished_revolution_desc: "Выживание Председателя - единственный мандат правительства. Поддержка войны и призыв растут; за это платят тыл и мастерские."
 ADISCORD_vorkerland_wkr_worker_levy: "Рабочий призыв"
 ADISCORD_vorkerland_wkr_worker_levy_desc: "Цеховые комитеты заполняют батальоны быстрее, чем учебная система успевает их принять."
 ADISCORD_vorkerland_wkr_chairmans_mandate: "Мандат Председателя"
 ADISCORD_vorkerland_wkr_chairmans_mandate_desc: "Одна подпись прекращает любой спор. Атаки ведутся напористее, добровольцы идут свободно, и не осталось учреждения, способного погасить ошибку."
 ADISCORD_vorkerland_wkr_delivery_mandate: "Мандат исполнения"
 ADISCORD_vorkerland_wkr_delivery_mandate_desc: "Легитимность директората измеряется выработкой. Промышленность и строительство растут; наступательный порыв - нет."
 ADISCORD_vorkerland_wkr_ration_ledger: "Опубликованная ведомость пайков"
 ADISCORD_vorkerland_wkr_ration_ledger_desc: "Печатные отчёты о том, что обещано и что пришло, удерживают районы, пока фронт стоит."
 ADISCORD_vorkerland_wkr_normative_republic: "Нормативная республика"
 ADISCORD_vorkerland_wkr_normative_republic_desc: "Власть живёт в писаной процедуре. Заводы работают в предсказуемом ритме, и никто не импровизирует наступление."
 ADISCORD_vorkerland_vad_imperial_mandate: "Имперский мандат"
 ADISCORD_vorkerland_vad_imperial_mandate_desc: "Канцелярия правит указом под старыми печатями: превосходная штабная работа, дешёвые командиры и тыл, который ни на что из этого не соглашался."
 ADISCORD_vorkerland_vad_officer_estates: "Возвращённые офицерские сословия"
 ADISCORD_vorkerland_vad_officer_estates_desc: "Восстановленные офицеры заново собирают штабы и систему подготовки - заметной ценой в гражданских товарах."
 ADISCORD_vorkerland_vad_crowned_restoration: "Увенчанная реставрация"
 ADISCORD_vorkerland_vad_crowned_restoration_desc: "Юридически завершённая реставрация лучше воюет и лучше договаривается - и всё равно не может заставить районы себя полюбить."
 ADISCORD_vorkerland_vad_dual_chamber: "Двойная палата"
 ADISCORD_vorkerland_vad_dual_chamber_desc: "Каждый приказ подписывают две власти. Страна спокойна и широко мобилизована; штабная работа страдает соответственно."
 ADISCORD_vorkerland_vad_district_rolls: "Открытые районные списки"
 ADISCORD_vorkerland_vad_district_rolls_desc: "Сведённые в один призыв гвардейские и комитетские реестры дотягиваются дальше, чем каждый по отдельности."
 ADISCORD_vorkerland_vad_crown_and_council: "Корона и совет"
 ADISCORD_vorkerland_vad_crown_and_council_desc: "Двоевластие, вписанное в цепь командования. Такое государство очень трудно сломать и трудно заставить бить сильно."
 ADISCORD_vorkerland_tva_continuous_mobilization: "Непрерывная мобилизация"
 ADISCORD_vorkerland_tva_continuous_mobilization_desc: "Директорат оптимизирует по времени. Мощности и людей тратят без счёта; наука, порядок и стабильность - тот счёт, с которого списывают."
 ADISCORD_vorkerland_tva_converted_grid: "Переведённая гражданская сеть"
 ADISCORD_vorkerland_tva_converted_grid_desc: "Коммунальная энергия и труд перенаправлены в мастерские на один расчётный сезон."
 ADISCORD_vorkerland_tva_single_process: "Единый процесс"
 ADISCORD_vorkerland_tva_single_process_desc: "Вся республика работает по одному графику и одному такту. Пропускная способность превосходна; тех, кто её обеспечивает, никто не заменяет."
 ADISCORD_vorkerland_tva_preservation_protocol: "Протокол сохранения"
 ADISCORD_vorkerland_tva_preservation_protocol_desc: "Директорат оптимизирует по обученным людям. Наука и оборона держатся; показатели выработки - нет."
 ADISCORD_vorkerland_tva_evacuated_bureaus: "Эвакуированные конструкторские бюро"
 ADISCORD_vorkerland_tva_evacuated_bureaus_desc: "Чертёжные работают всю зиму в тылу - ценой эшелонов, которые их вывезли."
 ADISCORD_vorkerland_tva_certified_cadre: "Аттестованные кадры"
 ADISCORD_vorkerland_tva_certified_cadre_desc: "Меньшая, переаттестованная армия, которая дёшево держит позиции и которую нельзя поторопить."

 # Claimant depth branches: war economy, variant doctrine, late war,
 # legitimacy and diplomacy.
 WKR_convene_the_production_soviet: "Созвать производственный совет"
 WKR_convene_the_production_soviet_desc: "Делегаты от каждого действующего цеха, оставшегося в руках лоялистов, садятся в один зал и принимают решения, на которые министерства уже неспособны. Само заседание не производит ничего, но отныне есть орган, с которого можно спросить."
 WKR_strip_the_civil_economy: "Раздеть гражданскую экономику"
 WKR_strip_the_civil_economy_desc: "Каждый станок, работавший на округа, переводится на фронт. Республика будет делать снаряды и не будет делать обувь, и совет проголосовал сказать это вслух."
 WKR_keep_the_bread_ration: "Сохранить хлебную норму"
 WKR_keep_the_bread_ration_desc: "Норму не урезают. Округа остаются спокойными, очереди на призывных пунктах - полными, а число снарядов - ниже того, что просит фронт. Совет решил, что республика должна пережить собственную войну."
 WKR_doctrine_of_the_armed_people: "Доктрина вооружённого народа"
 WKR_doctrine_of_the_armed_people_desc: "Штаб Председателя пишет самую короткую программу подготовки в истории Воркерланда. Рабочий, способный держать позицию через четыре недели, по этой арифметике стоит больше, чем тот, кто держал бы её безупречно через двенадцать."
 WKR_break_them_with_numbers: "Сломить их числом"
 WKR_break_them_with_numbers_desc: "Армии Председателя наступают на фронте, который не одобрила бы ни одна штабная академия, и наступают снова на следующее утро. Сводки потерь зачитывают на совете и затем подшивают в дело."
 WKR_doctrine_of_measured_force: "Доктрина соразмерной силы"
 WKR_doctrine_of_measured_force_desc: "Нормативная комиссия постановляет, что наступление, которое нельзя снабжать, - это не наступление, а список потерь. Дивизий республики будет меньше, они будут держаться дольше и не будут потрачены ради принципа."
 WKR_replace_men_with_output: "Заменить людей выработкой"
 WKR_replace_men_with_output_desc: "Там, где фронт просит ещё батальон, нормативная комиссия вместо этого отправляет ещё эшелон снаряжения. Это медленнее, это измеримо, и это можно отстоять перед советом."
 WKR_the_last_levy: "Последний призыв"
 WKR_the_last_levy_desc: "На восемнадцатом месяце республика призывает тех, кого обещала не призывать никогда. Совет принимает меру без поимённого голосования: никто не хочет, чтобы его имя стояло против, и никто не хочет, чтобы оно стояло за."
 WKR_throw_the_reserves_forward: "Бросить резервы вперёд"
 WKR_throw_the_reserves_forward_desc: "Последний призыв идёт прямо в наступление, пока он ещё армия. Люди Председателя называют это решающим; нормативная комиссия называет это концом спора."
 WKR_dig_in_along_the_interchange: "Окопаться вдоль узла"
 WKR_dig_in_along_the_interchange_desc: "Последний призыв копает. Республика отказывается закончить войну в этом году и соглашается просто существовать в следующем - по линии, проведённой через железнодорожный узел, который никому не взять дёшево."
 WKR_seat_the_factory_councils: "Учредить фабричные советы"
 WKR_seat_the_factory_councils_desc: "Выборные советы получают официальный статус на каждом заводе, который ещё работает у республики. Это медленный способ добиться доверия, а для правительства, взявшего власть за одну ночь, доверие - самый дефицитный товар."
 WKR_publish_the_production_returns: "Опубликовать производственные сводки"
 WKR_publish_the_production_returns_desc: "Настоящие цифры, без округления, вывешены у каждой проходной. Республика ставит своё положение на то, что цифры хороши, - а для этого цифры должны быть хороши на самом деле."
 WKR_requisition_in_the_republics_name: "Реквизировать именем республики"
 WKR_requisition_in_the_republics_name_desc: "Вскрытые склады, колонны людей, уведённых прямо из цехов, расписки, о которых все знают, что по ним никогда не заплатят. Фронт накормлен сегодня, а республика становится чуть менее законной завтра."
 WKR_arm_the_bracket_victors: "Вооружить победителей схваток"
 WKR_arm_the_bracket_victors_desc: "Местные войны в центре выявляют победителей. Республика отправляет им винтовки и постоянно действующее приглашение - и тратит тот политический капитал, в который эта отправка обходится."
 WKR_seek_outside_recognition: "Искать признания извне"
 WKR_seek_outside_recognition_desc: "Делегации отправляются ко всем, кто согласится их принять. Признание за рубежом не выигрывает сражений, но республику становится труднее описывать как мятеж, который просто ещё не подавили."
 VAD_convene_the_restoration_treasury: "Учредить казначейство восстановления"
 VAD_convene_the_restoration_treasury_desc: "Канцелярия воссоздаёт казначейство из уцелевших окружных книг и того, что оставило после себя старое министерство финансов. Теперь оно может официально решить, кто заплатит за эту войну."
 VAD_levy_the_crown_estates: "Обложить коронные имения"
 VAD_levy_the_crown_estates_desc: "С имений требуют людей и деньги по ставкам, применявшимся в последний раз в войне, которой не помнит никто из живых. Округа подчиняются - и запоминают, кто потребовал."
 VAD_protect_the_district_markets: "Защитить окружные рынки"
 VAD_protect_the_district_markets_desc: "Казначейство постановляет, что восстановление, морящее собственные округа голодом, не восстанавливает ничего. Реквизиции ограничены, рынки остаются открытыми, а армия - такой, какую эти рынки выдержат."
 VAD_doctrine_of_the_officer_estates: "Доктрина офицерских сословий"
 VAD_doctrine_of_the_officer_estates_desc: "Патенты возвращаются семьям, владевшим ими до того, как Конфедерация их упразднила. Это откровенно несправедливо, это глубоко непопулярно в округах - и это даёт лучшие по управлению дивизии в стране."
 VAD_restore_the_guards_regiments: "Восстановить гвардейские полки"
 VAD_restore_the_guards_regiments_desc: "Три полка возвращают себе прежние номера, прежние знамёна и прежние требования к приёму. Они будут очень хороши, и их будет очень немного."
 VAD_doctrine_of_the_district_levies: "Доктрина окружных ополчений"
 VAD_doctrine_of_the_district_levies_desc: "Каждый округ по совместной хартии поднимает и именует собственные полки. Списки заполняются быстрее, чем ожидала любая канцелярия, а уровень подготовки - какой округ сумеет обеспечить."
 VAD_train_the_council_militias: "Обучить советские ополчения"
 VAD_train_the_council_militias_desc: "Окружные советы обучают собственных людей на собственной земле. Они не будут маневрировать и не будут наступать, но на знакомой земле сдвинуть их крайне трудно."
 VAD_hold_the_historic_capitals: "Удержать исторические столицы"
 VAD_hold_the_historic_capitals_desc: "Восемнадцать месяцев войны - и восстановление по-прежнему сидит в городах, из которых управлялось старое государство. Этот факт, опубликованный и заснятый, стоит канцелярии дороже корпуса."
 VAD_march_on_the_old_capital: "Идти на старую столицу"
 VAD_march_on_the_old_capital_desc: "Канцелярия обязывает восстановление закончить спор там, где он начался. Всё, что берёг штаб, вкладывается в одно направление наступления."
 VAD_fortify_the_restoration_line: "Укрепить линию восстановления"
 VAD_fortify_the_restoration_line_desc: "Восстановление прекращает наступать и начинает строить. Что удерживает - удержит навсегда, и приглашает прочих претендентов разбиться об это."
 VAD_convene_the_court_of_honours: "Созвать палату почестей"
 VAD_convene_the_court_of_honours_desc: "Старое учреждение открывают вновь, чтобы подтверждать титулы, награды и старшинство. Оно ничего не решает о войне и решает всё о том, кем государство себя считает."
 VAD_stage_the_coronation_rites: "Провести обряды коронации"
 VAD_stage_the_coronation_rites_desc: "Полная церемония, в надлежащем городе, при надлежащих свидетелях, посреди гражданской войны. Она стоит недель, которых у фронта нет, - и заставляет восстановление выглядеть правительством, а не фракцией."
 VAD_mortgage_the_regalia: "Заложить регалии"
 VAD_mortgage_the_regalia_desc: "Коронная утварь уходит через восточные склады и возвращается винтовками и штабными кадрами. Канцелярия записывает сделку как заём. Никто не ждёт, что его вернут."
 VAD_court_the_bracket_victors: "Обхаживать победителей схваток"
 VAD_court_the_bracket_victors_desc: "Тот, кто выиграл собственную маленькую войну в центре, получает посланника, субсидию и место в порядке старшинства восстановления. Канцелярия платит за всё три."
 VAD_seek_legitimist_recognition: "Искать легитимистского признания"
 VAD_seek_legitimist_recognition_desc: "Восстановление отстаивает свою позицию за рубежом на единственном поле, где оно по-настоящему сильно, - на преемственности. Кто-то подписал последний законный акт, и это была не Рабочая Республика."
 TVA_convene_the_load_board: "Созвать совет нагрузки"
 TVA_convene_the_load_board_desc: "Директорат прекращает спорить о приоритетах и строит инструмент, который их распределяет: постоянный совет, час за часом решающий, куда идёт ток."
 TVA_run_the_grid_at_war_load: "Держать сеть под военной нагрузкой"
 TVA_run_the_grid_at_war_load_desc: "Совет устанавливает военную нагрузку и держит её. Заводы получают всё, города - остаток, и совет публикует график, чтобы никто не мог сделать вид, будто это вышло случайно."
 TVA_hold_back_civil_power: "Придержать гражданскую мощность"
 TVA_hold_back_civil_power_desc: "Совет резервирует нижний предел для гражданского снабжения и отказывается его снижать. Лаборатории продолжают работу, города продолжают работать, а на заявки фронта отвечают графиком вместо поставки."
 TVA_doctrine_of_continuous_assault: "Доктрина непрерывного штурма"
 TVA_doctrine_of_continuous_assault_desc: "Директорат рассматривает фронт как процесс с тактовым временем и берётся его сокращать. Наступления планируются, а не решаются, и в плане нет выходного дня."
 TVA_replace_losses_from_the_line: "Восполнять потери прямо с конвейера"
 TVA_replace_losses_from_the_line_desc: "Снаряжение на восполнение идёт с конвейера на фронт, минуя склад. Ничего не придерживают и ничего не проверяют дважды."
 TVA_doctrine_of_the_measured_front: "Доктрина размеренного фронта"
 TVA_doctrine_of_the_measured_front_desc: "Протокол Воркса рассматривает обученный расчёт как самую дефицитную позицию в описи республики, потому что так оно и есть. Фронт продвигается только там, где расчёт говорит, что продвижение удержится."
 TVA_hold_with_fewer_better_crews: "Держать меньшим числом лучших расчётов"
 TVA_hold_with_fewer_better_crews_desc: "Каждый расчёт переаттестуют, а отчисленных не заменяют. Республика получает армию, которую нельзя увеличить и нельзя позволить себе потерять, - и которую очень трудно разбить."
 TVA_declare_the_final_iteration: "Объявить последнюю итерацию"
 TVA_declare_the_final_iteration_desc: "Восемнадцать месяцев испытаний - и директорат в последний раз замыкает цикл. Всё, чему научилась программа, входит в одну спецификацию, и следующей редакции не будет."
 TVA_spend_the_reserve_cadre: "Израсходовать резервный кадр"
 TVA_spend_the_reserve_cadre_desc: "Специалистов, которых берегли с самого начала, распределяют по линейным частям, чтобы последняя итерация заработала. Директорат меняет своё будущее на эту зиму и знает цену."
 TVA_seal_the_technical_core: "Запечатать технический кадр"
 TVA_seal_the_technical_core_desc: "Основной кадр отводят за линию фронта и полностью закрывают для передовой. Что бы ни случилось этой зимой, весной республика всё ещё будет уметь строить."
 TVA_certify_the_completed_programmes: "Аттестовать завершённые программы"
 TVA_certify_the_completed_programmes_desc: "Законченная работа, принятая и внесённая в перечень. Притязание директората на страну держится на доводе, что он выполняет обещанное, - и вот как выполнение выглядит на бумаге."
 TVA_publish_the_reconstruction_index: "Опубликовать индекс восстановления"
 TVA_publish_the_reconstruction_index_desc: "Единая открытая цифра того, что отстроено заново, пересматриваемая ежемесячно и никогда не округляемая в свою пользу. Чтобы её вообще стоило публиковать, нужны настоящие гражданские мощности."
 TVA_divert_the_research_budget: "Перенаправить исследовательский бюджет"
 TVA_divert_the_research_budget_desc: "Собственный бюджет программы изымают и передают фронту снаряжением и обучением. Это работает немедленно - и превращает в ложь всё, что директорат говорил о себе."
 TVA_open_the_technical_exchange: "Открыть технический обмен"
 TVA_open_the_technical_exchange_desc: "Наружу уходят работы, приборы и спецификации, обратно приходят чужие. Директорат - единственный претендент, которому есть чем торговать, кроме людей."
 TVA_hire_the_bracket_victors: "Нанять победителей схваток"
 TVA_hire_the_bracket_victors_desc: "Директорат не обхаживает местных победителей, а нанимает их. Ставки согласованы, условия записаны, и договорённость длится ровно столько, сколько идут выплаты."
 ADISCORD_vorkerland_wkr_doctrine: "Опубликованная программа"
 ADISCORD_vorkerland_wkr_doctrine_desc: "Линия, которую советы вынесли на бумагу. Её вес - вес аргумента: правительство, которому ещё верят, воюет так, как описало, а то, что аргумент проиграло, держит в руках только брошюру."
 ADISCORD_vorkerland_vad_doctrine: "Опубликованная программа"
 ADISCORD_vorkerland_vad_doctrine_desc: "Линия, которую канцелярия вынесла на бумагу. Её вес - вес аргумента: правительство, которому ещё верят, воюет так, как описало, а то, что аргумент проиграло, держит в руках только брошюру."
 ADISCORD_vorkerland_tva_doctrine: "Опубликованная программа"
 ADISCORD_vorkerland_tva_doctrine_desc: "Линия, которую директорат вынес на бумагу. Её вес - вес аргумента: правительство, которому ещё верят, воюет так, как описало, а то, что аргумент проиграло, держит в руках только брошюру."
 ADISCORD_vorkerland_wkr_war_economy: "Советы на военном положении"
 ADISCORD_vorkerland_wkr_war_economy_desc: "Производственный совет ставит цеха где-то между тем, что требует фронт, и тем, что обещает паёк. Где бы ни прошла эта черта, она стоит ровно столько, сколько ещё дают округа, оставшиеся в руках республики, - а политический счёт за неё придёт независимо от того, дают они или нет."
 ADISCORD_vorkerland_wkr_doctrine_armed_people: "Доктрина вооружённого народа"
 ADISCORD_vorkerland_wkr_doctrine_armed_people_desc: "Больше дивизий, поднятых быстрее и знающих меньше."
 ADISCORD_vorkerland_wkr_doctrine_weight_of_numbers: "Вес числа"
 ADISCORD_vorkerland_wkr_doctrine_weight_of_numbers_desc: "Армии Председателя ломают линии и теряют на этом людей."
 ADISCORD_vorkerland_wkr_doctrine_measured_force: "Доктрина соразмерной силы"
 ADISCORD_vorkerland_wkr_doctrine_measured_force_desc: "Меньше дивизий, которые держат землю и остаются снабжёнными."
 ADISCORD_vorkerland_wkr_doctrine_output_over_men: "Выработка вместо людей"
 ADISCORD_vorkerland_wkr_doctrine_output_over_men_desc: "Снаряжение туда, где просили батальон, - и более долгое ожидание того и другого."
 ADISCORD_vorkerland_wkr_reserves_forward: "Резервы брошены вперёд"
 ADISCORD_vorkerland_wkr_reserves_forward_desc: "Последний призыв наступает, пока он ещё армия."
 ADISCORD_vorkerland_wkr_interchange_line: "Линия узла"
 ADISCORD_vorkerland_wkr_interchange_line_desc: "Последний призыв окопался там, где сходятся дороги."
 ADISCORD_vorkerland_wkr_bracket_patronage: "Покровительство победителям"
 ADISCORD_vorkerland_wkr_bracket_patronage_desc: "Винтовки и добровольцы идут наружу; политический капитал - навстречу."
 ADISCORD_vorkerland_wkr_outside_recognition: "Признание извне"
 ADISCORD_vorkerland_wkr_outside_recognition_desc: "Кто-то за рубежом называет республику правительством - и она начинает вести себя как правительство."
 ADISCORD_vorkerland_vad_war_economy: "Патенты и казначейство"
 ADISCORD_vorkerland_vad_war_economy_desc: "Реставрационное казначейство решает, как далеко старые патенты дотягиваются до округов. Каждая потерянная верста означает, что тот же патент поднимет меньше людей, тогда как купленная им обида записана и не стирается."
 ADISCORD_vorkerland_vad_doctrine_officer_estates: "Доктрина офицерских сословий"
 ADISCORD_vorkerland_vad_doctrine_officer_estates_desc: "Лучшие по управлению дивизии Воркерланда - и наименьшее число новобранцев за ними."
 ADISCORD_vorkerland_vad_doctrine_guards_regiments: "Восстановленные гвардейские полки"
 ADISCORD_vorkerland_vad_doctrine_guards_regiments_desc: "Очень хорошие полки - и очень долгое ожидание следующих."
 ADISCORD_vorkerland_vad_doctrine_district_levies: "Доктрина окружных ополчений"
 ADISCORD_vorkerland_vad_doctrine_district_levies_desc: "Списки, которые заполняются быстро, и полки, которые учатся медленно."
 ADISCORD_vorkerland_vad_doctrine_council_militias: "Советские ополчения"
 ADISCORD_vorkerland_vad_doctrine_council_militias_desc: "Несдвигаемы на своей земле и бесполезны вне её."
 ADISCORD_vorkerland_vad_march_on_the_capital: "Поход на старую столицу"
 ADISCORD_vorkerland_vad_march_on_the_capital_desc: "Всё, что берёг штаб, вложено в одно направление."
 ADISCORD_vorkerland_vad_restoration_line: "Линия восстановления"
 ADISCORD_vorkerland_vad_restoration_line_desc: "Восстановление держит своё и предлагает остальным прийти и взять."
 ADISCORD_vorkerland_vad_bracket_patronage: "Покровительство победителям"
 ADISCORD_vorkerland_vad_bracket_patronage_desc: "Посланники, субсидии и старшинство - всё оплачено кредитом канцелярии."
 ADISCORD_vorkerland_vad_legitimist_recognition: "Легитимистское признание"
 ADISCORD_vorkerland_vad_legitimist_recognition_desc: "Преемственность, отстаиваемая за рубежом, - и принятая ровно настолько, чтобы это имело значение."
 ADISCORD_vorkerland_tva_war_economy: "Сеть под нагрузкой"
 ADISCORD_vorkerland_tva_war_economy_desc: "Диспетчерская распределяет ток между фронтом и всем остальным. Это распределение что-то значит лишь пока электростанции остаются по эту сторону линии фронта; опубликованный график помнят ещё долго после того, как ток пропал."
 ADISCORD_vorkerland_tva_doctrine_continuous_assault: "Доктрина непрерывного штурма"
 ADISCORD_vorkerland_tva_doctrine_continuous_assault_desc: "Фронт работает как процесс, и в графике нет выходного дня."
 ADISCORD_vorkerland_tva_doctrine_line_replacement: "Восполнение с конвейера"
 ADISCORD_vorkerland_tva_doctrine_line_replacement_desc: "Снаряжение доходит до фронта, минуя склад - и проверку."
 ADISCORD_vorkerland_tva_doctrine_measured_front: "Доктрина размеренного фронта"
 ADISCORD_vorkerland_tva_doctrine_measured_front_desc: "Армия, наступающая лишь там, где расчёт обещает удержание."
 ADISCORD_vorkerland_tva_doctrine_fewer_better_crews: "Меньше, но лучше"
 ADISCORD_vorkerland_tva_doctrine_fewer_better_crews_desc: "Армия, которую нельзя увеличить, нельзя заменить и трудно разбить."
 ADISCORD_vorkerland_tva_reserve_cadre_spent: "Резервный кадр израсходован"
 ADISCORD_vorkerland_tva_reserve_cadre_spent_desc: "Специалисты, которых берегли с самого начала, отданы в линейные части."
 ADISCORD_vorkerland_tva_technical_core_sealed: "Технический кадр запечатан"
 ADISCORD_vorkerland_tva_technical_core_sealed_desc: "Тех, кто знает, как это строится, к фронту не подпускают."
 ADISCORD_vorkerland_tva_technical_exchange: "Технический обмен"
 ADISCORD_vorkerland_tva_technical_exchange_desc: "Работы наружу, работы внутрь - и заметно меньше мощностей на всё остальное."
 ADISCORD_vorkerland_tva_bracket_contractors: "Нанятые победители"
 ADISCORD_vorkerland_tva_bracket_contractors_desc: "Местные победители на письменных условиях, верные ровно столько, сколько идут выплаты."
 WKR_form_the_republican_air_staff: "Республиканский воздушный штаб"
 WKR_form_the_republican_air_staff_desc: "У цехов уже есть батальоны. Небо по-прежнему отвечает тому, у кого ещё есть топливо."
 WKR_commit_shopfloor_squadrons: "Цеховые эскадрильи"
 WKR_commit_shopfloor_squadrons_desc: "Непосредственная поддержка, которую летают те же, кто собирал эти машины."
 WKR_screen_the_interchange_sky: "Прикрытие развязки"
 WKR_screen_the_interchange_sky_desc: "Истребители над железнодорожными пересечениями - и ничего не остаётся на удар."
 WKR_open_the_external_desk: "Внешний стол"
 WKR_open_the_external_desk_desc: "Стол, который говорит с теми, кто в этой войне ещё не участвует."
 WKR_send_republican_volunteers: "Республиканские добровольцы"
 WKR_send_republican_volunteers_desc: "Людей отправляют вовне, чтобы канал кому-то ещё было зачем держать."
 WKR_license_outside_patterns: "Лицензионные образцы"
 WKR_license_outside_patterns_desc: "Чужие чертежи, оплаченные мощностями, которых в этом месяце уже не будет."
 VAD_restore_the_restoration_air_arm: "Авиация восстановления"
 VAD_restore_the_restoration_air_arm_desc: "Старая воздушная служба восстановлена по совместной хартии - сначала на бумаге."
 VAD_task_the_guards_for_close_support: "Поддержка гвардии"
 VAD_task_the_guards_for_close_support_desc: "Восстановленная гвардия получает вылеты. Остальные получают шум."
 VAD_cover_the_district_capitals: "Прикрытие окружных столиц"
 VAD_cover_the_district_capitals_desc: "Истребители над судами и канцелярией - и более тонкий заслон на подступах."
 VAD_open_the_foreign_chancery: "Иностранная канцелярия"
 VAD_open_the_foreign_chancery_desc: "Окно, через которое восстановление может говорить, не признавая, что ему это нужно."
 VAD_issue_restoration_guarantees: "Гарантии восстановления"
 VAD_issue_restoration_guarantees_desc: "Обещания в старом слоге: дорого держать и дорого игнорировать."
 VAD_seat_the_observer_missions: "Миссии наблюдателей"
 VAD_seat_the_observer_missions_desc: "Иностранные офицеры в приёмной. Они не стреляют. Они пишут домой."
 TVA_stand_up_the_grid_air_staff: "Воздушный штаб сети"
 TVA_stand_up_the_grid_air_staff_desc: "Вылеты ставят в график так же, как нагрузку: против опубликованной таблицы."
 TVA_print_unattended_strike_packages: "Беспилотные ударные пакеты"
 TVA_print_unattended_strike_packages_desc: "Пакеты уходят, даже если именной экипаж уже не жив, чтобы их вести."
 TVA_keep_the_interdictors_on_station: "Перехватчики на дежурстве"
 TVA_keep_the_interdictors_on_station_desc: "Постоянный патруль над сетью - и меньше машин на всё остальное."
 TVA_open_the_exchange_window: "Окно обмена"
 TVA_open_the_exchange_window_desc: "Стойка, которая меняет излишек на то, что дирекция не умеет печатать."
 TVA_export_surplus_output: "Вывоз излишка"
 TVA_export_surplus_output_desc: "То, что линия на этой неделе не съела, уходит наружу, а обратно приходит расположение."
 TVA_import_surviving_specialists: "Ввоз уцелевших специалистов"
 TVA_import_surviving_specialists_desc: "Люди, которые ещё помнят работу, куплены ценой более медленной канцелярии."
 ADISCORD_vorkerland_wkr_shopfloor_squadrons: "Цеховые эскадрильи"
 ADISCORD_vorkerland_wkr_shopfloor_squadrons_desc: "Непосредственная поддержка с заводских списков: летают жёстко и так же заменяются."
 ADISCORD_vorkerland_wkr_interchange_sky_screen: "Воздушный заслон развязки"
 ADISCORD_vorkerland_wkr_interchange_sky_screen_desc: "Истребители над пересечениями. Удар ждёт."
 ADISCORD_vorkerland_wkr_republican_volunteers: "Республиканские добровольцы"
 ADISCORD_vorkerland_wkr_republican_volunteers_desc: "Несколько лишних батальонов наружу - и тише стол дома."
 ADISCORD_vorkerland_wkr_licensed_patterns: "Лицензионные образцы"
 ADISCORD_vorkerland_wkr_licensed_patterns_desc: "Чертежи внутрь, заводское время наружу."
 ADISCORD_vorkerland_vad_guards_close_support: "Поддержка гвардии"
 ADISCORD_vorkerland_vad_guards_close_support_desc: "Восстановленная авиация летает для гвардии, а не для ополчения."
 ADISCORD_vorkerland_vad_district_air_cover: "Окружное воздушное прикрытие"
 ADISCORD_vorkerland_vad_district_air_cover_desc: "Столицы прикрыты. Подступы - нет."
 ADISCORD_vorkerland_vad_restoration_guarantees: "Гарантии восстановления"
 ADISCORD_vorkerland_vad_restoration_guarantees_desc: "Бумага, которая сокращает ожидание действия и тратит на это кредит канцелярии."
 ADISCORD_vorkerland_vad_observer_missions: "Миссии наблюдателей"
 ADISCORD_vorkerland_vad_observer_missions_desc: "Любезность, которая покупает время и каждую неделю стоит политического капитала."
 ADISCORD_vorkerland_tva_unattended_strike: "Беспилотные ударные пакеты"
 ADISCORD_vorkerland_tva_unattended_strike_desc: "Пакеты уходят, даже если именных экипажей уже нет в списке."
 ADISCORD_vorkerland_tva_interdictor_station: "Перехватчики на дежурстве"
 ADISCORD_vorkerland_tva_interdictor_station_desc: "Постоянный заслон над электростанциями."
 ADISCORD_vorkerland_tva_surplus_export: "Вывоз излишка"
 ADISCORD_vorkerland_tva_surplus_export_desc: "То, что линия не съела, продано, и заводам остаётся чуть больше остального."
 ADISCORD_vorkerland_tva_imported_specialists: "Ввезённые специалисты"
 ADISCORD_vorkerland_tva_imported_specialists_desc: "Знание куплено внутрь и оплачено за столом."
 ADISCORD_vorkerland_prewar_wrk_compact_course_tt: "Рабочая сторона выбрала путь чрезвычайного соглашения."
 ADISCORD_vorkerland_prewar_wrk_hardline_course_tt: "Рабочая сторона выбрала путь мобилизации верных республик."
 ADISCORD_vorkerland_prewar_district_compact_course_tt: "Окружная администрация выбрала соглашение с центром."
 ADISCORD_vorkerland_prewar_district_hardline_course_tt: "Окружная администрация выбрала самостоятельную мобилизацию."
 ADISCORD_vorkerland_tva_iteration_prerequisite_tt: "Нужен уже выбранный пакет полевых испытаний."

 WRK_worker_resettle_veteran_families:0 "Возвращение ветеранских семей"
 WRK_worker_resettle_veteran_families_desc:0 "Война закончилась, но списки частей всё ещё заменяют людям адреса. Советы сверят демобилизационные документы и помогут семьям вернуться к мирной жизни; дальнейшее строительство жилья станет отдельной задачей."
 WRK_worker_reopen_cooperative_workshops:0 "Кооперативные мастерские"
 WRK_worker_reopen_cooperative_workshops_desc:0 "Уцелевшие мастерские объединят заказы и вернут гражданский выпуск. Новая фабрика появится в контролируемом национальном регионе со свободным местом для строительства."
 WRK_worker_coordinate_republic_supply:0 "Межреспубликанское снабжение"
 WRK_worker_coordinate_republic_supply_desc:0 "Согласованные накладные и открытые графики поставок заменят чрезвычайные реквизиции. Конгресс получит поддержку для следующего этапа восстановления."
 WRK_worker_complete_workers_housing:0 "Сначала жильё"
 WRK_worker_complete_workers_housing_desc:0 "Сначала обеспечим устойчивость возвращения: местные советы направят усилия на заселение и обслуживание восстановленных домов. Расширение полномочий самоуправления последует при закреплении социальных гарантий."
 WRK_worker_empower_municipal_councils:0 "Сначала самоуправление"
 WRK_worker_empower_municipal_councils_desc:0 "Советы сначала получат мандат самостоятельно согласовывать местные работы. Социальные гарантии завершат жилищное урегулирование после распределения полномочий."
 WRK_worker_secure_social_guarantees:0 "Закрепить социальные гарантии"
 WRK_worker_secure_social_guarantees_desc:0 "Возвращение ветеранов, кооперативный выпуск и межреспубликанское снабжение станут повседневной работой государства. Завершим отложенную часть выбранного курса: жилищное урегулирование или политическое соглашение с советами."
 WRK_joint_restore_civil_service:0 "Вернуть гражданскую службу"
 WRK_joint_restore_civil_service_desc:0 "Окружные управления примут хозяйственные дела у полевых комендатур и вернут одну из военных мастерских гражданскому производству. Фабрика откроется в контролируемом национальном регионе со свободным местом."
 WRK_joint_audit_district_arsenals:0 "Восстановить окружные арсеналы"
 WRK_joint_audit_district_arsenals_desc:0 "Ремонтники приведут в порядок оружие, оставшееся на окружных складах. Первая партия вернётся в общий запас, а дальнейшая выдача будет зависеть от порядка послевоенного устройства."
 WRK_joint_train_postwar_officers:0 "Послевоенный офицерский корпус"
 WRK_joint_train_postwar_officers_desc:0 "Фронтовой опыт будет разобран на общих курсах командиров. Офицеры разных округов освоят единые процедуры и подготовятся к службе в регулярной армии."
 WRK_joint_transfer_garrisons_to_civil_order:0 "Сначала гражданское управление"
 WRK_joint_transfer_garrisons_to_civil_order_desc:0 "Передача повседневных обязанностей гражданским ведомствам освободит штабных офицеров для совместных учений. Вторая партия арсенального оружия будет выдана после утверждения общего бюджета."
 WRK_joint_inspect_remaining_arsenals:0 "Сначала окружная инспекция"
 WRK_joint_inspect_remaining_arsenals_desc:0 "Инспекторы сначала завершат проверку складов и вернут оставшееся оружие в общий запас. Штабные учения последуют после утверждения общего бюджета."
 WRK_joint_ratify_common_state_budget:0 "Общий государственный бюджет"
 WRK_joint_ratify_common_state_budget_desc:0 "Канцелярия сведёт гражданские расходы и армейские заявки в один бюджет. Завершим отложенную программу: выдачу арсенального оружия или обучение освобождённых от гражданских обязанностей штабов."
 WRK_utilitarian_equip_grid_repair_crews:0 "Оснастить энергоремонтные бригады"
 WRK_utilitarian_equip_grid_repair_crews_desc:0 "Учтём полевые генераторы, инструмент и связное имущество, сохранившиеся после войны. Первая партия оснащения поддержки поступит в общий запас для ремонтных и инженерных подразделений."
 WRK_utilitarian_standardize_civilian_production:0 "Стандарты гражданского производства"
 WRK_utilitarian_standardize_civilian_production_desc:0 "Совместимые детали и общая приёмка позволят собрать ещё одну небольшую партию инженерного имущества. Единые стандарты подготовят базу для расширения производства."
 WRK_utilitarian_school_technical_specialists:0 "Школа технических кадров"
 WRK_utilitarian_school_technical_specialists_desc:0 "Полевые инженеры передадут опыт гражданским лабораториям и молодым специалистам. Программа ускорит одно промышленное исследование."
 WRK_utilitarian_prioritize_municipal_repairs:0 "Сначала коммунальное хозяйство"
 WRK_utilitarian_prioritize_municipal_repairs_desc:0 "Сначала выпустим оставшееся оснащение для инженерных подразделений. Новая гражданская фабрика будет введена на завершающем этапе программы."
 WRK_utilitarian_commission_automated_workshops:0 "Сначала промышленная автоматизация"
 WRK_utilitarian_commission_automated_workshops_desc:0 "Сначала введём гражданскую фабрику в контролируемом национальном регионе со свободным местом. Завершающий этап обеспечит оставшуюся партию инженерного оснащения."
 WRK_utilitarian_complete_reconstruction_programme:0 "Завершить программу реконструкции"
 WRK_utilitarian_complete_reconstruction_programme_desc:0 "Директория завершит оставшуюся часть выбранного плана и опубликует результаты. Если первыми шли коммунальные работы, откроется гражданская фабрика; если производство - поступит последняя партия инженерного оснащения."
 WRK_reconstruction_factory_site_tt:0 "Есть контролируемый национальный регион со свободным местом для гражданской фабрики"
 WRK_reconstruction_industry_bonus:0 "Школа технических кадров"
 WRK_west_reconstruction_ready_tt:0 "После объединения Воркерланда прошло не менее 180 дней"

# --- collapse_l_russian ---
 ADISCORD_vorkerland_last_stand: "До последнего"
 ADISCORD_vorkerland_last_stand_desc: "Каждый претендент поклялся не сдавать столицы, архивы и полевые штабы, пока сохраняется хотя бы один организованный рубеж. Поражение наступит только тогда, когда само государство будет сломлено."
 ADISCORD_vorkerland_tva_unattended_shifts: "Приборные безлюдные смены"
 ADISCORD_vorkerland_tva_unattended_shifts_desc: "Автоматические датчики и строгие допуски позволяют отдельным линиям работать ночью сокращённым составом, повышая выпуск ценой аварий и нагрузки на город."
 ADISCORD_vorkerland_tva_algorithmic_fire_plans: "Алгоритмические огневые планы"
 ADISCORD_vorkerland_tva_algorithmic_fire_plans_desc: "Центральная коллегия превращает данные наблюдения, расхода боеприпасов и движения войск в согласованные графики для батарей директората."
 ADISCORD_vorkerland_tva_bunker_specialist_cadres: "Кадры специалистов по укреплениям"
 ADISCORD_vorkerland_tva_bunker_specialist_cadres_desc: "Небольшие инженерные группы обследуют городские узлы, усиливают существующие укрытия и учат гарнизоны использовать каждую подготовленную позицию."
 ADISCORD_vorkerland_tva_standardized_assault_teams: "Стандартизированные штурмовые группы"
 ADISCORD_vorkerland_tva_standardized_assault_teams_desc: "Технические батальоны используют единый штат групп и порядок пополнения, быстрее возвращая разбитые штурмовые отряды в строй."
 ADISCORD_vorkerland_tva_networked_observation_posts: "Сеть наблюдательных постов"
 ADISCORD_vorkerland_tva_networked_observation_posts_desc: "Резервные полевые линии и измеренные ориентиры превращают местных наблюдателей в отзывчивую систему обороны и управления огнём."
 ADISCORD_vorkerland_tva_modular_repair_mandate: "Предписание модульного ремонта"
 ADISCORD_vorkerland_tva_modular_repair_mandate_desc: "Полевые депо заменяют стандартные узлы вместо восстановления каждой машины на месте, сокращая задержки, потери и расход материалов."
 ADISCORD_vorkerland_tva_interchangeable_repair_modules: "Взаимозаменяемые ремонтные узлы"
 ADISCORD_vorkerland_tva_interchangeable_repair_modules_desc: "Опубликованные допуски и общие технологические карты позволяют всем депо директората выпускать одинаковые ремонтные комплекты."
 ADISCORD_vorkerland_tva_prepositioned_switching_crews: "Выдвинутые переключающие бригады"
 ADISCORD_vorkerland_tva_prepositioned_switching_crews_desc: "Подвижные техники и защищённые маршрутные таблицы готовы перенаправить поезда и энергию при смене направления операции."
 ADISCORD_vorkerland_worx_adaptive_logistics_trial: "Испытание адаптивной логистики"
 ADISCORD_vorkerland_worx_adaptive_logistics_trial_desc: "Мобильные ремонтные группы испытывают гибкие склады, обходные маршруты снабжения и скользящие графики обслуживания, поддерживая войска при перегруженной транспортной сети."
 ADISCORD_vorkerland_worx_second_protocol: "Второй протокол"
 ADISCORD_vorkerland_worx_second_protocol_desc: "Штаб Воркса превращает проверенные полевые испытания в компактную систему кампании, основанную на ремонтных колоннах, расчётной маршрутизации и строго поэтапных наступлениях."
 ADISCORD_vorkerland_reactor_industrial_legacy: "Наследие реакторного комплекса"
 ADISCORD_vorkerland_reactor_industrial_legacy_desc: "Вокруг реактора нулевой точки располагался промышленный центр старого Воркерленда. Каркасы заводов, брошенные машины и технические склады сохранили огромные запасы стали, алюминия, вольфрама и хрома. Среди руин встречаются небольшие партии редких сплавов и уцелевших высокоточных компонентов. Их извлечение и переработка обеспечивают регион ценным сырьём."
 ADISCORD_vorkerland_reactor_industrial_legacy_tt:0 "$ADISCORD_vorkerland_reactor_industrial_legacy_desc$\n\nСейчас разрабатывается лишь лом с поверхности. Основные запасы погребены под обрушенными цехами; восстановление заводов возвращает их в базовые ресурсы региона."
 ADISCORD_vorkerland_zone_fragile_administration:0 "Разрозненные посты"
 ADISCORD_vorkerland_zone_fragile_administration_desc:0 "Республика держится на горстке застав, складов и станций, разбросанных по заражённым землям. У неё нет ни глубокого тыла, ни запасных учреждений: потеря нескольких поселений рушит всю администрацию быстрее, чем у обычного государства."
 ADISCORD_vorkerland_dirty_state: "Загрязнённая территория"
 ADISCORD_vorkerland_dirty_state_desc: "Территория загрязнена и требует постоянных ограничений на использование населения, ресурсов, строительства и снабжения."
 ADISCORD_vorkerland_collapse_started: "Взрыв в Башне Единства"
 ADISCORD_vorkerland_collapse_wars_started: "Каскадные войны Воркерланда"
 ADISCORD_vorkerland_collapse_category: "Война за Воркерланд"
 ADISCORD_vorkerland_collapse_category_desc: "После короткой мобилизации центральные претенденты и государства периферии открывают несколько фронтов одновременно. Рабочая республика и Дориан Воркс сперва ведут собственные кампании; их прямой фронт откроется только после отдельной 45-дневной подготовки. Ромелланд и Республика Трумана могут добиться признанного сосуществования; реставрационная директория Влада отказывается признавать их независимость."
 ADISCORD_vorkerland_erased_nations: "Стёртые народы Империи"
 ADISCORD_vorkerland_erased_nations_desc: "После революции Воркерланд объявил местные языки, общинные земли и коренные названия пережитками старого мира. Школы, переселения и единый реестр десятилетиями размывали различия между народами. Распад вернул им право говорить от собственного имени - и одновременно оставил миллионы людей без общего ответа на вопрос, кем они теперь являются."
 ADISCORD_vorkerland_erased_nations_relief_1: "Открытые архивы переселений"
 ADISCORD_vorkerland_erased_nations_relief_1_desc: "Республика признала существование закрытых реестров и начала возвращать семьям документы, имена и права на общинные земли. Недоверие не исчезло, но государство впервые перестало отрицать саму проблему."
 ADISCORD_vorkerland_erased_nations_relief_2: "Восстановленные общинные советы"
 ADISCORD_vorkerland_erased_nations_relief_2_desc: "Местные советы вновь получили право использовать исторические названия, вести школы на собственных языках и разбирать земельные споры. Последствия прежней политики всё ещё ощущаются, однако они больше не определяют всю работу республики."
 ADISCORD_vorkerland_vad_imperial_chancery: "Канцелярия непрерывной власти"
 ADISCORD_vorkerland_vad_imperial_chancery_desc: "Влад сохранил архивы, кадровые списки и протоколы имперской администрации. Его штаб быстрее принимает решения и лучше планирует операции, но привычка управлять приказами раздражает даже собственных сторонников."
 ADISCORD_vorkerland_wkr_arsenal_command: "Арсенальное командование"
 ADISCORD_vorkerland_wkr_arsenal_command_desc: "Чрезвычайное правительство сразу ставит заводы, депо и штабы на военный график. Выпуск и атака держатся лучше, чем у импровизированного ополчения, но гражданская экономика платит за готовую армию."
 ADISCORD_vorkerland_republics_from_the_ruins: "Республики без метрополии"
 ADISCORD_vorkerland_republics_from_the_ruins_desc: "С распадом Воркерланда бывшие автономии больше не обязаны оправдывать каждый закон перед далёким центром. Местные советы, офицеры и общины спорят о будущем, но сходятся в одном: новая республика должна пережить войну и не дать столице снова стереть её имя."
 ADISCORD_vorkerland_mobilized_periphery: "Мобилизованная периферия"
 ADISCORD_vorkerland_mobilized_periphery_desc: "Окружные склады, ремонтные бригады и местные караулы за несколько недель превратились в каркас государства. Эта импровизированная система умеет беречь припасы и быстро возвращать части в строй, но чрезвычайное управление давит на гражданскую жизнь."
 ADISCORD_vorkerland_tva_field_directorate: "Полевой директорат Воркса"
 ADISCORD_vorkerland_tva_field_directorate_desc: "Дориан Воркс подчинил университетские лаборатории, энергосеть и заводские КБ единому полевому штабу. Прототипы быстро доходят до частей, а городская сеть поддерживает несколько фронтов, но гражданская промышленность оплачивает этот темп."
 ADISCORD_vorkerland_tva_field_directorate_2: "Объединённый полевой директорат"
 ADISCORD_vorkerland_tva_field_directorate_2_desc: "Фронтовые КБ, ремонтные депо и диспетчерские больше не конкурируют за одни и те же станки. Единая коллегия распределяет проекты по потребностям армий, сокращая задержки между испытанием, выпуском и доставкой на фронт."
 ADISCORD_vorkerland_tva_field_directorate_3: "Военно-техническая система Воркса"
 ADISCORD_vorkerland_tva_field_directorate_3_desc: "Дориан Воркс замкнул разведданные, проектирование, производство и снабжение в единый оперативный контур. Система быстро исправляет собственные ошибки и даёт армии устойчивое преимущество, но окончательно подчиняет гражданскую экономику логике войны."
 ADISCORD_vorkerland_tva_ideological_fanaticism: "Идеологический фанатизм"
 ADISCORD_vorkerland_tva_ideological_fanaticism_desc: "Директорат объявил Воркенсберг последним доказательством превосходства технократии. Городские штабы готовы продолжать сопротивление после потери внешних кварталов, а капитуляция рассматривается как предательство самого разума."
 ADISCORD_vorkerland_wrk_front_committees: "Фронтовые комитеты"
 ADISCORD_vorkerland_wrk_front_committees_desc: "Местные советы проводят дополнительный набор, ускоряют обучение пополнений и возвращают разрозненные части в строй. Цена - всё более тяжёлая мобилизация гражданской жизни."
 ADISCORD_vorkerland_wrk_rail_requisition: "Реквизиция железнодорожного резерва"
 ADISCORD_vorkerland_wrk_rail_requisition_desc: "Ремонтные составы, складские тягачи и ведомственные запасы переданы фронту. Снабжение ускоряется, но население видит, как война забирает последние мирные резервы."
 ADISCORD_vorkerland_vad_imperial_registers: "Имперские мобилизационные реестры"
 ADISCORD_vorkerland_vad_imperial_registers_desc: "Канцелярия Влада вскрыла старые реестры транспорта, резервистов и складов. Штаб быстрее развёртывает соединения и накапливает планирование."
 ADISCORD_vorkerland_vad_field_commandantures: "Полевые комендатуры"
 ADISCORD_vorkerland_vad_field_commandantures_desc: "В прифронтовых районах вводится единая сеть комендатур, укреплённых узлов и резервных рот. Оборона становится плотнее, а гражданское управление - жёстче."
 ADISCORD_vorkerland_vad_standardized_logistics: "Стандартизированная окружная логистика"
 ADISCORD_vorkerland_vad_standardized_logistics_desc: "Единые реквизиционные бланки, складская маркировка и порядок ремонта сокращают потери и ускоряют восстановление повреждённых линий."
 ADISCORD_vorkerland_vad_prefectural_discipline: "Префектурная дисциплина"
 ADISCORD_vorkerland_vad_prefectural_discipline_desc: "Возобновившие работу суды и учтённые ордера позволяют администрации восстановления призывать резервы, не теряя оперативный план в потоке противоречивых приказов."
 ADISCORD_vorkerland_vad_restoration_war_cabinet: "Военный кабинет восстановления"
 ADISCORD_vorkerland_vad_restoration_war_cabinet_desc: "Постоянный чрезвычайный кабинет Влада соединяет право, мобилизацию и полевое командование в одной жёсткой цепи. Он быстро планирует и развёртывает войска, но его власть подрывает общественное доверие."
 ADISCORD_vorkerland_vad_dual_authority_protocol: "Протокол двоевластия"
 ADISCORD_vorkerland_vad_dual_authority_protocol_desc: "Делегаты рабочих сохраняют гражданский надзор, а штаб восстановления управляет операциями. Зафиксированные границы полномочий не дают двум властям издавать противоречивые приказы."
 ADISCORD_vorkerland_vad_solar_corridor_intelligence: "Разведка соляринских коридоров"
 ADISCORD_vorkerland_vad_solar_corridor_intelligence_desc: "Обследования мостов, маршрутные таблицы и политические досье раскрывают слабые места обоих соперничающих правительств-преемников в Солярино."
 ADISCORD_vorkerland_vad_restoration_columns: "Колонны восстановления"
 ADISCORD_vorkerland_vad_restoration_columns_desc: "Подвижные группы снабжения, ремонта и управления готовы следовать за наступлением и поддерживать работу захваченной дорожной сети."
 ADISCORD_vorkerland_tva_grid_rerouting: "Перенастройка городской сети"
 ADISCORD_vorkerland_tva_grid_rerouting_desc: "Директорат на несколько недель переключает энергокольца, ремонтные депо и автоматические склады на нужды выбранных фронтов."
 ADISCORD_vorkerland_tva_field_laboratories: "Полевые лаборатории"
 ADISCORD_vorkerland_tva_field_laboratories_desc: "Инженерные группы испытывают новые схемы связи, боеприпасы и штурмовое оснащение прямо в действующих частях."
 ADISCORD_vorkerland_tva_logistics_disruption: "Нарушенная система снабжения"
 ADISCORD_vorkerland_tva_logistics_disruption_desc: "Специалисты Воркенсберга внедрились в диспетчерские сети, подменили маршрутные таблицы и вывели из строя часть ремонтных узлов. Армия получает приказы и припасы с опасным запозданием."
 ADISCORD_vorkerland_tva_prepared_defense: "Подготовленные городские рубежи"
 ADISCORD_vorkerland_tva_prepared_defense_desc: "Подступы к Воркенсбергу разделены на инженерные сектора, склады рассредоточены, а гарнизоны заранее заняли защищённые позиции."
 ADISCORD_vorkerland_tva_fortress_garrisons: "Ротация крепостных гарнизонов"
 ADISCORD_vorkerland_tva_fortress_garrisons_desc: "Свежие подразделения сменяют измотанные части в укреплённых узлах, сохраняя плотность обороны без строительства новых постоянных рубежей."
 ADISCORD_vorkerland_btl_contract_support: "Байринжский контрактный корпус"
 ADISCORD_vorkerland_btl_contract_support_desc: "Байринжские капитаны, инструкторы и специалисты тыла работают по единому военному контракту. Их немного, но они повышают слаженность и скорость подготовки частей."
 ADISCORD_vorkerland_btl_volunteer_contract: "Байринжское обязательство"
 ADISCORD_vorkerland_btl_volunteer_contract_desc: "Подписанный контракт обязывает Байринж содержать полевой контингент на стороне выбранного заказчика. Республика получает право немедленно отправить добровольческие части, невзирая на мировую напряжённость."
 ADISCORD_vorkerland_northern_operational_initiative: "Северная оперативная инициатива"
 ADISCORD_vorkerland_northern_operational_initiative_desc: "Одна из коалиций раньше соперников сосредоточила транспорт, боеприпасы и штабных офицеров на решающем направлении. Преимущество временно, но позволяет превратить позиционные бои в настоящее продвижение."
 ADISCORD_vorkerland_val_contract_support: "Кефрейтская линия снабжения"
 ADISCORD_vorkerland_val_contract_support_desc: "Кефрейт открыл оплаченный канал оружия, запчастей и складских специалистов. Поставки невелики по меркам большой войны, но заметно разгружают промышленность и тыл."
 ADISCORD_vorkerland_eba_free_quays: "Свободные набережные Эберна"
 ADISCORD_vorkerland_eba_free_quays_desc: "Республика Макри держится на портовых общинах, частных клубах, полевых госпиталях и добровольных кассах. Эта рыхлая сеть быстро восстанавливается после потерь, хотя её граждане не любят военную истерию."
 ADISCORD_vorkerland_zta_golden_river_order: "Орден Золотой Реки"
 ADISCORD_vorkerland_zta_golden_river_order_desc: "Виктор Холт связал речные общины клятвой вернуть коренные названия и защитить долину от новых столичных хозяев. Орден наступает яростно и цепляется за землю, но его жёсткая дисциплина раскалывает общество."
 ADISCORD_vorkerland_wpa_municipal_compact: "Норвенский муниципальный договор"
 ADISCORD_vorkerland_wpa_municipal_compact_desc: "Города Норвена сохранили выборные советы, склады взаимопомощи и общее ополчение. Согласование решений занимает время, зато население понимает, за что защищает республику."
 ADISCORD_vorkerland_wps_factory_councils: "Заводские советы Хольдена"
 ADISCORD_vorkerland_wps_factory_councils_desc: "Инженеры и цеховые делегаты управляют производством без единой дирекции. Заводы быстро приспосабливаются к военным заказам, но содержание системы советов отнимает часть гражданских ресурсов."
 ADISCORD_vorkerland_piv_macri_volunteer_mission: "Афрельская миссия в Эберне"
 ADISCORD_vorkerland_piv_macri_volunteer_mission_desc: "Афрела открыла набор добровольцев, инструкторов и медицинских команд для Республики Эберн. Эта помощь должна сохранить дружественную гедонистическую республику на границе, но не превращает Влада Макри в зависимого правителя."
 ADISCORD_vorkerland_consolidate_central_border: "Собрать ядро Воркерланда"
 ADISCORD_vorkerland_consolidate_central_border_desc: "Одновременно открыть фронты против всех соседних центральных государств, на земли которых мы претендуем. Уже идущая война не блокирует решение. Рабочая республика и Дориан Воркс не могут открыть этим решением прямую войну друг против друга."
 ADISCORD_vorkerland_prepare_worker_doctor_showdown: "Стянуть армии к последней границе"
 ADISCORD_vorkerland_prepare_worker_doctor_showdown_desc: "Одна из двух сторон завершила свои первые войны. В течение §Y45 дней§! Рабочая республика и Дориан Воркс будут стягивать дивизии к общей границе; затем республика объявит войну Воркенсбергскому директорату. ИИ получает высокий приоритет заполнения этого фронта, но не начинает наступление до истечения срока."
 ADISCORD_vorkerland_open_regional_fronts: "Открыть региональные фронты"
 ADISCORD_vorkerland_open_regional_fronts_desc: "После выхода сторон из прежних союзов открыть все предусмотренные региональные фронты. На севере пять республик начнут девять отдельных войн; в Эберне и Соллярино каждый из трёх соперников будет воевать с двумя остальными."
 ADISCORD_vorkerland_raise_emergency_levies: "Развернуть чрезвычайное ополчение"
 ADISCORD_vorkerland_raise_emergency_levies_desc: "За §Y21 день§! и §Y25§! £political_power_texticon собрать в столице две лёгкие дивизии местного ополчения. Решение доступно один раз: это резерв для закрытия фронта, а не бесконечный источник войск."
 ADISCORD_vorkerland_rom_northern_intervention: "Фреалорская северная операция"
 ADISCORD_vorkerland_rom_northern_intervention_desc: "Независимый и находящийся в мире Фреалор начнёт две ограниченные войны за Риматское побережье, Хольденскую равнину и Восточную автономную зону. За §Y240 дней§! необходимо занять §Y[72.GetName]§!, §Y[196.GetName]§! и §Y[322.GetName]§!; иначе операция завершится без территориальных приобретений."
 ADISCORD_vorkerland_wrk_activate_front_committees: "Созвать фронтовые комитеты"
 ADISCORD_vorkerland_wrk_activate_front_committees_desc: "Передать местным советам дополнительный набор и подготовку пополнений на §Y35 дней§!. Мы получим людей немедленно, но потеряем часть стабильности."
 ADISCORD_vorkerland_wrk_requisition_rail_stock: "Реквизировать железнодорожный резерв"
 ADISCORD_vorkerland_wrk_requisition_rail_stock_desc: "Передать армии ведомственные запасы, ремонтные поезда и 120 комплектов вооружения на §Y30 дней§!. Военная поддержка немного снизится."
 ADISCORD_vorkerland_vad_open_imperial_registers: "Открыть имперские реестры"
 ADISCORD_vorkerland_vad_open_imperial_registers_desc: "Использовать архивы резервистов и транспорта для ускоренной мобилизации и подготовки операций на §Y35 дней§!."
 ADISCORD_vorkerland_vad_form_field_commandantures: "Развернуть полевые комендатуры"
 ADISCORD_vorkerland_vad_form_field_commandantures_desc: "На §Y35 дней§! создать укреплённые узлы управления и резервы на угрожаемых направлениях ценой части стабильности."
 ADISCORD_vorkerland_tva_reroute_city_grid: "Перенастроить городскую сеть"
 ADISCORD_vorkerland_tva_reroute_city_grid_desc: "На §Y28 дней§! направить энергосеть и ремонтные мощности Воркенсберга на фронт и выпустить §Y1200§! комплектов вооружения."
 ADISCORD_vorkerland_tva_deploy_field_laboratories: "Развернуть полевые лаборатории"
 ADISCORD_vorkerland_tva_deploy_field_laboratories_desc: "На §Y30 дней§! прикрепить инженерные группы к действующим частям: ускорить исследования, планирование и подготовку наступлений."
 ADISCORD_vorkerland_tva_raise_technical_battalions: "Сформировать технические батальоны"
 ADISCORD_vorkerland_tva_raise_technical_battalions_desc: "За §Y40§! £political_power_texticon сформировать две дешёвые части городского резерва. Воющий Холден также получит батальон; Техлар может получить такую помощь только один раз. Решение восстанавливается через §Y120 дней§!."
 ADISCORD_vorkerland_tva_disrupt_enemy_logistics: "Нарушить вражескую логистику"
 ADISCORD_vorkerland_tva_disrupt_enemy_logistics_desc: "На §Y30 дней§! нарушить снабжение всех соседних государств, воюющих с Воркенсбергом. Повторная операция возможна через §Y60 дней§!."
 ADISCORD_vorkerland_tva_infiltrate_wrk_rear: "Внедрить группы в тыл $WRK$"
 ADISCORD_vorkerland_tva_infiltrate_wrk_rear_desc: "Однократно поднять две заранее подготовленные ячейки в материковых Юго-Восточном и Нефтегазовом дистриктах рабочей республики. Отряды малочисленны, но вынудят противника снимать силы с фронта."
 ADISCORD_vorkerland_tva_infiltrate_vad_rear: "Внедрить группы в тыл $VAD$"
 ADISCORD_vorkerland_tva_infiltrate_vad_rear_desc: "Однократно поднять две заранее подготовленные ячейки в материковых округах Изаии и Сутрцыя. Отряды малочисленны, но нарушат управление фронтом."
 ADISCORD_vorkerland_tva_seal_city_approaches: "Перекрыть подступы к Воркенсбергу"
 ADISCORD_vorkerland_tva_seal_city_approaches_desc: "Однократно построить четыре уровня укреплений на трёх городских направлениях и на §Y60 дней§! перевести оборону на заранее подготовленную схему."
 ADISCORD_vorkerland_tva_rotate_fortress_garrisons: "Сменить крепостные гарнизоны"
 ADISCORD_vorkerland_tva_rotate_fortress_garrisons_desc: "На §Y30 дней§! повысить укреплённость и оборону частей без дополнительного строительства постоянных фортов."
 ADISCORD_vorkerland_wrk_convene_front_soviets: "Созвать съезд фронтовых советов"
 ADISCORD_vorkerland_wrk_convene_front_soviets_desc: "За §Y60 дней§! согласовать между советами, штабами и партийными комитетами единый порядок мобилизации. Это ослабит противоречия духа §Y«Родина Первой революции»§!."
 ADISCORD_vorkerland_wrk_adopt_front_charter: "Принять фронтовую хартию"
 ADISCORD_vorkerland_wrk_adopt_front_charter_desc: "За §Y90 дней§! закрепить представительство советов, ответственность штабов и пределы чрезвычайных полномочий. Дух Первой революции станет преимуществом республики, а не наследием незавершённого перехода."
 ADISCORD_vorkerland_tva_unify_front_bureaus: "Объединить фронтовые КБ"
 ADISCORD_vorkerland_tva_unify_front_bureaus_desc: "За §Y60 дней§! свести лаборатории, ремонтные депо и заводские бюро в единую коллегию, улучшив §Y«Полевой директорат Воркса»§!."
 ADISCORD_vorkerland_tva_close_operational_loop: "Замкнуть оперативный контур"
 ADISCORD_vorkerland_tva_close_operational_loop_desc: "За §Y90 дней§! связать разведданные, проектирование, производство и снабжение в одну военно-техническую систему Дориана Воркса."
 ADISCORD_vorkerland_wrk_open_erased_archives: "Открыть архивы переселений"
 ADISCORD_vorkerland_wrk_open_erased_archives_desc: "За §Y90 дней§! признать закрытые реестры, начать возвращение документов и впервые ослабить последствия политики стирания народов. Политическую реформу можно проводить прямо во время войны."
 ADISCORD_vorkerland_wrk_restore_displaced_councils: "Восстановить общинные советы"
 ADISCORD_vorkerland_wrk_restore_displaced_councils_desc: "За §Y120 дней§! вернуть местным общинам школы, названия и ограниченные земельные полномочия, дополнительно уменьшив национальный кризис."
 ADISCORD_vorkerland_wrk_enact_constitutional_guarantees: "Закрепить конституционные гарантии"
 ADISCORD_vorkerland_wrk_enact_constitutional_guarantees_desc: "За §Y150 дней§! закрепить языковые, земельные и представительские права в конституции и завершить демонтаж старой политики."
 ADISCORD_vorkerland_tva_integrate_wps: "Пригласить Холден в директорат"
 ADISCORD_vorkerland_tva_integrate_wps_desc: "Заводские советы Холдена победили в Норвейне. Предложить им автономию под защитой Воркенсбергского директората."
 ADISCORD_vorkerland_tva_integrate_tgd: "Пригласить Фирнов-Техлар в директорат"
 ADISCORD_vorkerland_tva_integrate_tgd_desc: "Инженерная коллегия пережила борьбу за Эбернский регион. Включить её округ в систему Дориана Воркса на правах автономии."
 ADISCORD_vorkerland_restoration_coalition: "Коалиция независимого восстановления"
 ADISCORD_vorkerland_btl_support_wrk: "Контракт с рабочей республикой"
 ADISCORD_vorkerland_btl_support_wrk_desc: "Продать услуги байринжских рот и инструкторов $WRK$, открыть поставки и отправить добровольческий контингент. Это окончательный выбор стороны в войне."
 ADISCORD_vorkerland_btl_support_vad: "Контракт с Владом"
 ADISCORD_vorkerland_btl_support_vad_desc: "Продать услуги байринжских рот и инструкторов реставрационной директории, открыть поставки и отправить добровольческий контингент. Это окончательный выбор стороны в войне."
 ADISCORD_vorkerland_btl_support_tva: "Контракт с Дорианом Ворксом"
 ADISCORD_vorkerland_btl_support_tva_desc: "Продать услуги байринжских рот и инструкторов Воркенсбергскому директорату, открыть поставки и отправить добровольческий контингент. Это окончательный выбор стороны в войне."
 ADISCORD_vorkerland_val_support_wrk: "Снабжать рабочую республику"
 ADISCORD_vorkerland_val_support_wrk_desc: "Открыть кефрейтскую линию оружейных поставок для $WRK$. Другой главный претендент уже не получит этот контракт."
 ADISCORD_vorkerland_val_support_vad: "Снабжать директорию Влада"
 ADISCORD_vorkerland_val_support_vad_desc: "Открыть кефрейтскую линию оружейных поставок для реставрационной директории. Другой главный претендент уже не получит этот контракт."
 ADISCORD_vorkerland_val_support_tva: "Снабжать Дориана Воркса"
 ADISCORD_vorkerland_val_support_tva_desc: "Открыть кефрейтскую линию оружейных поставок для Воркенсбергского директората. Другой главный претендент уже не получит этот контракт."
 ADISCORD_vorkerland_continue_reunification: "Продолжить объединение"
 ADISCORD_vorkerland_continue_reunification_desc: "Центральная война дала нам право претендовать на наследство Воркерланда, но не подарила его территории. Открыть фронты против всех доступных соседних государств, не дожидаясь завершения других кампаний."
 ADISCORD_vorkerland_macri_piv_pact: "Заключить пакт с Афрелой"
 ADISCORD_vorkerland_macri_piv_pact_desc: "Эберн и Афрела войдут в равноправный оборонный союз. Республика Макри останется независимой."
 ADISCORD_vorkerland_restore_loyalist_district: "Вернуться в союз с Воркерландом"
 ADISCORD_vorkerland_restore_loyalist_district_desc: "Региональная война выиграна, а независимый Воркерланд пережил катастрофу. Заозерск или Вольноград могут добровольно восстановить особый статус дистрикта, сохранив собственное управление. Риматская инженерная директория к Воркерланду вернуться не может."
 ADISCORD_ivanland_prepare_northern_expedition: "Подготовить северную экспедицию"
 ADISCORD_ivanland_prepare_northern_expedition_desc: "На §Y120 дней§! передать две гражданские фабрики снабжению экспедиционного корпуса. Если к завершению подготовки Иванланд сохранит необходимую армию, людские резервы и внутреннюю устойчивость, автоматически начнётся ограниченная §Y240-дневная§! интервенция."
 ADISCORD_ivanland_limited_intervention: "Интервенция в Норвейнский коридор"
 ADISCORD_ivanland_limited_intervention_desc: "Северные республики временно прекратили междоусобные войны и создали §YСеверный оборонительный фронт§!. Иванланд должен за §Y240 дней§! физически занять штаты §Y[90.GetName]§!, §Y[91.GetName]§!, §Y[93.GetName]§! и §Y[94.GetName]§!.\n\n§GУспех:§! §Y[90.GetName]§! и §Y[91.GetName]§! образуют Норвейн Матвея Матеуска, а §Y[93.GetName]§! и §Y[94.GetName]§! - Крайтскую директорию Антона Селевёстрова. Оба государства станут отдельными клиентами Иванланда.\n§RПровал:§! обе администрации не будут созданы, территории вернутся северным республикам, а Вадим Иванчик сменит курс на этатизм. После развязки уцелевшие северяне возобновят прерванные войны."
 ADISCORD_vorkerland_collapse.80.t: "Экспедиция отменена"
 ADISCORD_vorkerland_collapse.80.d: "За время подготовки Иванланд утратил силы или внутреннюю устойчивость, необходимые для северной операции. Штаб распускает экспедиционный корпус; второго скрытого срока и автоматической повторной попытки не будет."
 ADISCORD_vorkerland_collapse.80.a: "Отступить от плана"
 ADISCORD_vorkerland_collapse.100.t: "Мандат победителя"
 ADISCORD_vorkerland_collapse.100.d: "Рабочее правительство снова держит центр, но чрезвычайный мандат Никиты Уоркера всё ещё не превращён в постоянный порядок. Комиссии готовы открыть участки. Сам Уоркер может вместо этого закрепить власть указом и закрыть вопрос о преемственности."
 ADISCORD_vorkerland_collapse.100.a: "Открыть избирательные участки."
 ADISCORD_vorkerland_collapse.100.b: "Закрепить власть указом."
 ADISCORD_vorkerland_wrk_hold_elections_tt: "Через §Y14 дней§! комиссии объявят победителя. С равной вероятностью это будет §YНикита Уоркер§! (§Yнеоворкеризм§!), §YМарк Ястребцев§! (§Yгуманизм§!) или §YНекро Филопо§! (§Yшовинизм§!)."
 ADISCORD_vorkerland_collapse.101.t: "Итоги выборов"
 ADISCORD_vorkerland_collapse.101.worker.d: "Комиссии свели протоколы и объявили победу Никиты Уоркера. Неоворкеризм остаётся государственной идеологией, а чрезвычайный кабинет получает выборный мандат вместо указа."
 ADISCORD_vorkerland_collapse.101.yastrebtsev.d: "Комиссии свели протоколы и объявили победу Марка Ястребцева. Гуманизм становится правящей идеологией, а Уоркер уступает кабинет по объявленному результату."
 ADISCORD_vorkerland_collapse.101.filopo.d: "Комиссии свели протоколы и объявили победу Некро Филопо. Шовинизм становится правящей идеологией, а Уоркер уступает кабинет по объявленному результату."
 ADISCORD_vorkerland_collapse.101.a: "Принять объявленный результат."
 ADISCORD_ivanland_second_intervention: "Вмешаться в северный тупик"
 ADISCORD_ivanland_second_intervention_desc: "Если рабочая республика и директория Влада продолжают войну при §R100% истощения§!, а у сохранившегося Воркенсберга оно также достигло §R100%§!, Итора начнёт отдельные войны против Грейна и Риматской инженерной директории. Уничтоженный Воркенсберг не учитывается."
 ADISCORD_ivanland_occupy_wrk_islands: "Занять Реммель и Кайрхольм"
 ADISCORD_ivanland_occupy_wrk_islands_desc: "Пока руководство рабочей республики занято гражданской войной, высадить гарнизоны на двух изолированных островах и без объявления войны передать их под управление Иторы. Стоимость: §Y50§! £political_power_texticon."
 ADISCORD_ivanland_guarantee_free_republics: "Гарантировать свободные республики"
 ADISCORD_ivanland_guarantee_free_republics_desc: "Пока гражданская война не завершена, гарантировать независимость Фреалора и Золоторечья за §Y100§! £political_power_texticon. Решение доступно только после успешной интервенции Иторы и появления общей границы с Фреалором. Если гарантия не оформлена до победы $WRK$, каждая республика отдельно либо примет прежний автономный статус, либо столкнётся с новой войной."
