 VAD_guards_cost_tooltip:0 "Стоимость: §Y60§! £political_power_texticon §Y1300§! £population_texticon §Y3870§! £infantry_equipment_texticon §Y90§! £support_equipment_texticon §Y32§! $ADISCORD_squad_weapons_equipment_short$."
 VAD_local_militia_cost:0 "§Y35§! £political_power_texticon §Y1000§! £population_texticon §Y900§! £infantry_equipment_texticon §Y60§! £support_equipment_texticon"
