 faction_vorkerland_free_republics_league: "Лига свободных республик"

 ADISCORD_vorkerland_news.3.t: "Выборы в Воркерланде"
 ADISCORD_vorkerland_news.3.worker.d: "Избирательные комиссии Воркерланда объявили о победе Никиты Уоркера. После окончания гражданской войны он вынес вопрос о своих полномочиях на голосование и сохранил пост. Неоворкеризм остаётся государственной идеологией.\n\nЧрезвычайное правительство теперь опирается на выборный мандат. Для соседей это означает, что восстановленным Воркерландом будет руководить прежняя власть."
 ADISCORD_vorkerland_news.3.yastrebtsev.d: "Избирательные комиссии Воркерланда объявили о победе Марка Ястребцева. По итогам голосования, проведённого после гражданской войны, Никита Уоркер уступает руководство страной. Правительство сформируют гуманисты.\n\nЧрезвычайный кабинет прекращает работу. Восстановлением страны займётся новое правительство."
 ADISCORD_vorkerland_news.3.filopo.d: "Избирательные комиссии Воркерланда объявили о победе Некро Филопо. Голосование, назначенное после окончания гражданской войны, лишило Никиту Уоркера власти и привело в правительство шовинистов.\n\nНовой власти достаётся страна, едва пережившая распад. За её курсом внимательно следят и бывшие члены конфедерации, и соседи."
 ADISCORD_vorkerland_news.3.a: "Итоги голосования объявлены."

 ADISCORD_vorkerland_news.4.t: "Воркерланд восстанавливает Башню Единства"
 ADISCORD_vorkerland_news.4.d: "Правительство [ROOT.GetNameDef] объявило о восстановлении Башни Единства, повреждённой взрывом в начале гражданской войны. Рабочие, инженеры и архивисты возвращают комплексу прежний облик. После завершения работ в нём снова разместятся органы управления, узел связи и государственный архив."
 ADISCORD_vorkerland_news.4.a: "Башню отстроят заново."
 ADISCORD_vorkerland_central_initiative:0 "Оперативная инициатива"
 ADISCORD_vorkerland_central_initiative_desc:0 "Согласованные действия штабов дают временное преимущество против других центральных претендентов. Действует не более двух лет с начала войны и прекращается при капитуляции, завершении гражданской войны или переходе одного из центральных претендентов под управление игрока."

# --- postwar_expansion_l_russian ---
 WRK_joint_pw_census: "Перепись разорённых округов"
 WRK_joint_pw_census_desc: "Перепись вернувшихся семей и уцелевших мастерских даст восстановлению точную опору. Сначала необходимо вернуть людям работу и наладить обычное управление."
 WRK_joint_pw_repair_crews: "Военно-восстановительные команды"
 WRK_joint_pw_repair_crews_desc: "Ремонтные бригады получат оснащение и единый график восстановления разрушенных предприятий. Их задача - вернуть действующие мощности в производство."
 WRK_joint_pw_food_reserve: "Нормализовать хлебное снабжение"
 WRK_joint_pw_food_reserve_desc: "Общий запас продовольствия позволит вновь открыть набор и обучение, не перекладывая снабжение армии на голодающие города."
 WRK_joint_pw_veteran_housing: "Поселения служилых семей"
 WRK_joint_pw_veteran_housing_desc: "Уцелевшие предприятия смогут принять демобилизованных и их семьи. Строительная программа должна расширить гражданскую базу следующего этапа восстановления."
 WRK_joint_pw_municipal_network: "Вернуть уездную администрацию"
 WRK_joint_pw_municipal_network_desc: "Договоры между муниципалитетами восстановят поставки, разрушенные фронтами. За местными учреждениями останется ответственность за исполнение общего плана."
 WRK_joint_pw_recovery_complete: "Государство после чрезвычайщины"
 WRK_joint_pw_recovery_complete_desc: "Аварийный ремонт уступает место устойчивому строительству. Страна должна иметь возможность одновременно содержать армию и восстанавливать мирную жизнь."
 WRK_joint_pw_veteran_cadres: "Собрать кадровый корпус"
 WRK_joint_pw_veteran_cadres_desc: "Сохранившиеся командиры и ветераны станут основой регулярных частей. Первая задача после объединения - вернуть людей в действующие подразделения, а не плодить недоукомплектованные штабы."
 WRK_joint_pw_rearmament: "Вернуть полковые арсеналы"
 WRK_joint_pw_rearmament_desc: "Центральные склады получат партию стрелкового оружия и оснащения. Сначала они покроют нехватку в существующих частях; новые соединения следует создавать лишь при наличии запасов."
 WRK_joint_pw_officer_school: "Школа младших офицеров"
 WRK_joint_pw_officer_school_desc: "Подготовка младших командиров восстановит управление взводами и ротами. Опыт гражданской войны должен стать общим учебным материалом."
 WRK_joint_pw_field_exercises: "Манёвры восстановленной армии"
 WRK_joint_pw_field_exercises_desc: "Полевые учения проверят взаимодействие бывших раздельных армий. Единые приказы, связь и порядок пополнения сделают их полноценной силой перед западной войной."
 WRK_joint_pw_motor_pool: "Моторизованный штабной резерв"
 WRK_joint_pw_motor_pool_desc: "Транспортные и ремонтные подразделения получат машины и оснащение. Уменьшение потерь снабжения позволит дольше держать подготовленные части на фронте."
 WRK_joint_pw_artillery: "Корпусная артиллерия"
 WRK_joint_pw_artillery_desc: "Орудия будут распределены вместе со средствами обслуживания. Подготовка расчётов и планирование огня должны поддерживать пехоту, а не заменять её бесплодными атаками."
 WRK_joint_pw_reserve: "Вторая очередь призыва"
 WRK_joint_pw_reserve_desc: "Новая очередь пополнения проходит через действующие учебные части. Резерв предназначен для замены потерь и расширения армии по мере выпуска вооружения."
 WRK_joint_pw_army_reform: "Армия единого командования"
 WRK_joint_pw_army_reform_desc: "Завершённая реформа закрепляет собственную модель вооружённых сил."
 WRK_joint_pw_arsenals: "Государственные оружейные дворы"
 WRK_joint_pw_arsenals_desc: "Уцелевшие оружейные мастерские объединятся в первый послевоенный оборонный заказ. Военный завод начнёт выпуск до завершения долгих политических преобразований."
 WRK_joint_pw_standards: "Унифицировать армейское снабжение"
 WRK_joint_pw_standards_desc: "Единые размеры, патроны и правила приёмки помогут производственным линиям быстрее набирать эффективность. Заводы смогут раньше выйти на устойчивый выпуск вооружения для действующей армии."
 WRK_joint_pw_defence_cluster: "Мобилизационный промышленный округ"
 WRK_joint_pw_defence_cluster_desc: "Следующая очередь оборонного производства расширит постоянный выпуск вооружения. Разовая поставка оружия не обеспечит затяжную войну с Иторой."
 WRK_joint_pw_machine_tools: "Станки для военных заводов"
 WRK_joint_pw_machine_tools_desc: "Станки и инструмент помогут совершенствовать работу производственных линий. Гражданские подрядчики получат собственную производственную базу."
 WRK_joint_pw_transport_works: "Военно-транспортные мастерские"
 WRK_joint_pw_transport_works_desc: "Транспортные мастерские выпустят первую партию армейских машин и подготовят серийное производство. Без доставки новое оружие останется на складах."
 WRK_joint_pw_production_board: "Контракт генерального штаба"
 WRK_joint_pw_production_board_desc: "Производственный совет свяжет приёмку, оборонный заказ и реальные нужды войск. Завершение программы увеличит постоянный выпуск военных предприятий."
 WRK_joint_pw_territorial_council: "Совет военных и гражданских округов"
 WRK_joint_pw_territorial_council_desc: "Территории получат установленный порядок участия в общем управлении. После войны центр должен опираться на работающие учреждения, способные исполнять решения."
 WRK_joint_pw_service_charter: "Хартия службы"
 WRK_joint_pw_service_charter_desc: "Хартия определит обязанности и гарантии для тех, кто несёт государственную службу. Победа не должна превращать каждый округ в личное владение его командира."
 WRK_joint_pw_local_charters: "Гражданский суд в восстановленных землях"
 WRK_joint_pw_local_charters_desc: "Местные полномочия получат ясные границы. Гражданам необходимо понимать, кто отвечает за суд, снабжение и восстановление их города."
 WRK_joint_pw_procurement_audit: "Инспекция военных закупок"
 WRK_joint_pw_procurement_audit_desc: "Проверка закупок должна вернуть ресурсы из бесконечных посреднических цепочек. Военные поставки подчиняются общей приёмке и проверяемым обязательствам."
 WRK_joint_pw_treasury: "Единое казначейство"
 WRK_joint_pw_treasury_desc: "Сведение доходов и расходов позволит финансировать долгосрочные программы. Единая казна превращает обещания восстановления в действительные выплаты."
 WRK_joint_pw_defence_compact: "Обязанности пограничных администраций"
 WRK_joint_pw_defence_compact_desc: "Общие оборонные обязательства свяжут внутреннее устройство с военной реформой. Стабильный тыл должен выдержать следующую войну без нового распада."
 WRK_joint_pw_subject_charter: "Устав зависимых администраций"
 WRK_joint_pw_subject_charter_desc: "Хартия определит полномочия и обязательства зависимых государств после победы."
 WRK_joint_pw_ebern_campaign: "Ликвидировать режим Макри"
 WRK_joint_pw_ebern_campaign_desc: "Победа Макри сохранила самостоятельный Эберн на бывших землях конфедерации. Подготовим поход за его подчинение и встречу с союзной ему Афрелой. Побеждённые страны сохранят территории под нашим контролем через зависимые правительства."
 WRK_joint_pw_afrela_campaign: "Подчинить афрельский тыл"
 WRK_joint_pw_afrela_campaign_desc: "После решения эбернского вопроса наступает очередь Афрелы. Поход установит зависимое правительство согласно нашей хартии."
 WRK_joint_pw_regional_settlement: "Пояс военных администраций"
 WRK_joint_pw_regional_settlement_desc: "Зависимые правительства Эберна и Афрелы вошли в установленный договорный порядок. Теперь можно финансировать постоянные связи, восстановление предприятий и содержание совместной обороны."
 ADISCORD_vorkerland_postwar_institutions: "Восстановленные институты Воркерланда"
 ADISCORD_vorkerland_postwar_institutions_desc: "Накопленный результат послевоенных армейских, промышленных и восстановительных программ."
 ADISCORD_vorkerland_pw_delta_repair: "Организованный ремонт"
 ADISCORD_vorkerland_pw_delta_civil_building: "Восстановленная строительная отрасль"
 ADISCORD_vorkerland_pw_delta_cadres: "Возвращение кадров"
 ADISCORD_vorkerland_pw_delta_officers: "Школа младших командиров"
 ADISCORD_vorkerland_pw_delta_logistics: "Регулярное снабжение армии"
 ADISCORD_vorkerland_pw_delta_training: "Подготовленный резерв"
 ADISCORD_vorkerland_pw_delta_standards: "Стандарты оборонного заказа"
 ADISCORD_vorkerland_pw_delta_tools: "Точная заводская приёмка"
 ADISCORD_vorkerland_pw_delta_output: "Согласованный оборонный выпуск"
 ADISCORD_vorkerland_pw_delta_joint_army: "Армия единого командования"
 WRK_pw_subject_charter_tt: "Зависимые государства получат строй действующего правительства Воркерланда. Рабочий маршрут создаёт конфедеративные республики, военный - военные администрации, технический - территории под технической опекой."
 WRK_pw_ebern_war_tt: "Начнётся война за подчинение Эберна. Если Афрела состоит с ним в союзе, она вступит в ту же войну. Для мира необходимо победить всех участников; побеждённые страны станут зависимыми государствами согласно нашему курсу."
 WRK_pw_afrela_war_tt: "Начнётся война за подчинение Афрелы. После её поражения будет создано зависимое государство согласно нашему курсу."
 WRK_pw_no_other_war_tt: "Воркерланд не ведёт другой войны"
 WRK_pw_ebern_target_tt: "Макри правит Эберном, победил соперников и контролирует его основные земли"
 WRK_pw_afrela_target_tt: "Эберн подчинён Воркерланду или исчез, а его основные земли принадлежат Воркерланду и контролируются им"
 autonomy_WRK_military_administration: "Военная администрация"
 ADISCORD_vorkerland_postwar.3.t: "Новый порядок на южной границе"
 ADISCORD_vorkerland_postwar.3.d: "Военные действия завершились оформлением зависимых правительств. Местные учреждения сохраняют свои территории, но внешняя политика и оборонные обязательства теперь определяются соглашением с Воркерландом.\n\nДля восстановленного центра это не только новая граница. Отныне он отвечает за прочность порядка, который установил за её пределами. Военные администрации, конфедеративные республики и технические дирекции по-разному распределяют полномочия, однако каждая из них должна превратить итог войны в повседневное управление."
 ADISCORD_vorkerland_postwar.3.a: "Приступить к исполнению соглашений"
 ADISCORD_vorkerland_pw_ebern_campaign: "Начать эбернский поход"
 ADISCORD_vorkerland_pw_ebern_campaign_desc: "$WRK_pw_ebern_war_tt$"
 ADISCORD_vorkerland_pw_afrela_campaign: "Начать афрельский поход"
 ADISCORD_vorkerland_pw_afrela_campaign_desc: "$WRK_pw_afrela_war_tt$"
 ADISCORD_vorkerland_pw_delta_attack: "Наступательная выучка"
 WRK_pw_reconstruction_unlock_tt: "Одновременно может идти §Y1§! программа восстановления; каждый национальный регион восстанавливается один раз."
 WRK_pw_reconstruction_slot_tt: "Одновременно может идти ещё §Y1§! программа §YВосстановления округа§!."
 WRK_pw_rebuild_slot_tt: "Свободна хотя бы одна строительная программа. Сейчас идёт: §Y[?ADISCORD_vorkerland_pw_rebuild_active|0]§!. Число программ растёт с фокусами восстановления"
 WRK_pw_rebuild_start_tt: "Через §Y60§! дней регион получит результат программы. Если регион будет потерян, программа прервётся, а право на неё сохранится. Каждый регион восстанавливается один раз."
 ADISCORD_vorkerland_pw_rebuild_district: "Восстановление округа"
 ADISCORD_vorkerland_pw_rebuild_district_desc: "Война оставила разрушенные дороги, пустые цеха и людей без работы. Программа направляет в [From.GetName] строителей, материалы и заказы. Что вырастет на месте руин, зависит от курса восстановления: кооперативные мастерские, гарнизонный арсенал или измеренная инженерная сеть."
 WRK_pw_treaty_charter_tt: "Склонность всех западных государств к Воркерланду растёт на §Y5§!."
 WRK_pw_local_charters_tt: "Склонность всех западных государств к Воркерланду растёт на §Y10§!."
 WRK_pw_arm_front_partners_tt: "Каждый текущий участник §YКонфедеративного фронта§! на Западе получает §Y27000§! £infantry_equipment_texticon и §Y300§! £support_equipment_texticon."
 WRK_pw_local_coalition_tt: "В союзе страны нет участников, кроме Эберна и Афрелы"
 WRK_pw_no_subjects_tt: "У страны нет собственных зависимых государств"
 WRK_pw_independent_command_tt: "Воркерланд возглавляет свой союз или не состоит в союзе"
 WRK_pw_campaign_idle_tt: "Предыдущий южный поход завершён"
 WRK_pw_settlement_complete_tt: "Оформление зависимых правительств завершено"
# --- end_postwar_expansion_l_russian ---

# Imperial succession and war with Itora
 ADISCORD_vorkerland_world_empire_focus:0 "Мировая империя Воркерланда"
 WRK_vorkerland_world_empire:0 "Мировая империя Воркерланда"
 WRK_vorkerland_world_empire_DEF:0 "Мировая империя Воркерланда"
 WRK_vorkerland_world_empire_ADJ:0 "Воркерландск."
 WRK_vorkerland_world_empire_etatism:0 "Мировая империя Воркерланда"
 WRK_vorkerland_world_empire_etatism_DEF:0 "Мировая империя Воркерланда"
 WRK_vorkerland_world_empire_etatism_ADJ:0 "Воркерландск."
 WRK_world_empire_party:0 "£GFX_generic_etatism_state_party_party_texticon Имперский государственный союз"
 WRK_world_empire_party_long:0 "£GFX_generic_etatism_state_party_party_texticon Имперский государственный союз Уоркера"
 ADISCORD_vorkerland_empire_army:0 "Армия мировой империи"
 ADISCORD_vorkerland_empire_army_desc:0 "Единый штаб, массовый резерв и централизованное снабжение. Сила армии растёт по мере завершения имперских программ."
 ADISCORD_vorkerland_empire_industry:0 "Государственный военный план"
 ADISCORD_vorkerland_empire_industry_desc:0 "Военные предприятия работают по единому государственному заказу. Завершённые программы последовательно повышают выпуск.\n\n\n\n\n\n £GFX_ADISCORD_industry_banner \n\n\n"
 WRK_empire_arsenal_site_tt:0 "Есть собственный контролируемый национальный регион с местом для 4 военных заводов."
 WRK_empire_civil_site_tt:0 "Есть собственный контролируемый национальный регион с местом для 3 гражданских заводов."
 WRK_empire_war_tt:0 "Начнётся западная война против Иторы. Союзники вступят через существующие договоры и выбор стороны; исход определит военное подчинение противника."
 ADISCORD_vorkerland_postwar.4.t:0 "После общей победы"
 ADISCORD_vorkerland_postwar.4.d:0 "Общий враг повержен, но в столице всё ещё стоят штабы двух властей. Окружные командиры ждут приказов Петричева, рабочие делегации обращаются к Уоркеру. Во время войны разногласия можно было отложить до победы. Теперь откладывать их некуда.\n\nСторонники единоличной власти предлагают Уоркеру распустить чрезвычайный совет. Они обещают покончить со спорами одним приказом, а Петричева уже называют препятствием на пути нового государства. Другие требуют подтвердить общий мандат и передать послевоенное устройство страны совместным учреждениям. Победа оставила союзникам выбор, которого у них не было под обломками Башни."
 ADISCORD_vorkerland_postwar.4.council:0 "Подтвердить общий мандат"
 ADISCORD_vorkerland_postwar.4.close:0 "Решение больше не принадлежит этому совету."
 ADISCORD_vorkerland_postwar.4.empire:0 "Поддержать единоличную власть Уоркера"
 WRK_joint_preserve_council_tt:0 "Совместное правительство сохраняется. Послевоенное дерево восстановления, армии и окружных соглашений остаётся доступным; переворот Уоркера больше не состоится."
 WRK_joint_world_empire_choice_tt:0 "Совместный совет будет распущен, а Влад Петричев казнён. Никита Уоркер возглавит этатистскую Мировую империю и получит её отдельное дерево фокусов. Завершённые программы и уже открытые решения сохраняются."
 ADISCORD_vorkerland_postwar.5.t:0 "[WRK.GetVorkerlandEmpireProclamationTitle]"
 ADISCORD_vorkerland_postwar.5.d:0 "[WRK.GetVorkerlandEmpireProclamationDesc]"
 ADISCORD_vorkerland_postwar.5.a:0 "[WRK.GetVorkerlandEmpireProclamationResponse]"
 WRK_empire_itora_operational_plan:0 "Иторский оперативный план"
 WRK_empire_itora_operational_plan_desc:0 "Штаб сопоставляет пути снабжения, направления ударов и глубину резервов противника. Поход должен иметь достижимые оперативные цели, а не только имперские лозунги."
 WRK_empire_itora_must_fall:0 "Итора должна пасть"
 WRK_empire_itora_must_fall_desc:0 "Подготовка завершена. Империя начинает западную войну и требует от союзников выступить на её стороне. Победа должна поставить Итору под власть Воркерланда."
 WRK_empire_building_offices_tt:0 "Одновременно могут идти ещё §Y2§! программы §YВосстановления округа§!."
 WRK_empire_military_conventions:0 "Военные конвенции Запада"
 WRK_empire_military_conventions_desc:0 "Империя предлагает соседям не равенство, а защиту. Военные конвенции обещают гарнизоны, оружие и место в будущем порядке тем, кто выберет сторону до начала похода."
 WRK_empire_district_guarantees:0 "Имперские гарантии округам"
 WRK_empire_district_guarantees_desc:0 "Бывшие административные округа помнят гражданскую войну и до сих пор воюют друг с другом. Империя обещает им амнистию, сохранение местных гарнизонов и защиту от соседей, если они выступят на её стороне против Иторы."
 WRK_empire_district_guarantees_tt:0 "Склонность [PWR.GetName], [PSD.GetName] и [ZAO.GetName] сдвигается к Воркерланду на §Y20§!. Сила нашего влияния на Западе растёт на §Y5§!."
 WRK_empire_garrison_compact:0 "Гарнизонный договор"
 WRK_empire_garrison_compact_desc:0 "Подписавшие конвенции получают со складов империи винтовки и снаряжение. Их гарнизоны станут первой линией похода на Итору."
 WRK_veyran_empire_etatism:0 "Вейранская империя"
 WRK_veyran_empire_etatism_DEF:0 "Вейранская империя"
 WRK_veyran_empire_etatism_ADJ:0 "Вейранск."
