 WKR_breakthrough_programme:0 "Подготовить операцию прорыва"
 WKR_breakthrough_programme_desc:0 "У штабного расписания появятся исполнители: связисты, проводники, ремонтные команды и офицеры снабжения. Их работа сведёт разрозненные распоряжения в одну операцию."
 WKR_interchange_defence_programme:0 "Подготовить оборону узла"
 WKR_interchange_defence_programme_desc:0 "Станционный совет собирает бригады для оборудования укрытий, полевых складов и заграждений на подступах к станции. Рабочие возвращаются к знакомым цехам уже с другим заданием."
 WKR_prepared_interchange:0 "Подготовленный оборонительный узел"
 WKR_prepared_interchange_desc:0 "Станционные бригады оборудовали склады, укрытия и заграждения. Часть мастерских продолжает обслуживать оборонительный район."
 WKR_final_operation_council_tt:0 "Есть полностью удерживаемый узел снабжения с действующим железнодорожным советом."
 WKR_interchange_defence_site_tt:0 "Есть полностью удерживаемый узел снабжения с советом, где оборона ещё не подготовлена."
 WKR_breakthrough_available_tt:0 "Идёт центральная война с другим претендентом; действует железнодорожный совет в полностью удерживаемом узле, предыдущая операция прорыва завершена."
 WKR_interchange_defence_available_tt:0 "Республика самостоятельна и продолжает кампанию; выбранный узел полностью удерживается, его совет действует и оборона ещё не подготовлена."
 WKR_breakthrough_unlock_tt:0 "Оплаченная подготовка позволяет выбрать момент усиленного прорыва в центральной войне."
 WKR_interchange_defence_unlock_tt:0 "Местная оборона улучшает снабжение и затрудняет продвижение противника ценой части выпуска."
 WKR_breakthrough_result_tt:0 "Подготовленная операция действует только в центральной войне с другим претендентом."
 WKR_interchange_defence_result_tt:0 "Оборонительный район сохраняется, пока действует его железнодорожный совет. После утраты узел можно подготовить заново за полную цену."
 WKR_final_operation_cancellation_tt:0 "$WKR_air_rail_cancellation_tt$ Прекращение центральной войны также отменяет незавершённую подготовку прорыва."
 WKR_railway_order_breakthrough:0 "Подготовка прорыва. Оплачено: §Y[?WKR_railway_order_pp|0]§! £political_power_texticon §Y[?WKR_railway_order_manpower|0]§! £population_texticon §Y[?WKR_railway_order_support|0]§! £support_equipment_texticon."
