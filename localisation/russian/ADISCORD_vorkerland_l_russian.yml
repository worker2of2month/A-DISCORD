 RUS_bunker_archive_delta:0 "Архив аймаков"
 RUS_bunker_archive:0 "Слой 5: архив аймаков"
 RUS_bunker_archive_desc:0 "Договоры, переписи и карты будут храниться рядом, а не в сундуках влиятельных семей. Государству нужна память, которой нельзя единолично владеть.\n\nСрок: 21 дн. Требуемая свободная мощность: 1. После сдачи слой занимает 1 мощности и даёт показанные ниже постоянные эффекты. На этом слое можно выбрать только одно помещение.\n$RUS_bunker_contract_tt$"
