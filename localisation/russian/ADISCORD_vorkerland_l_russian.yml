 RUS_bunker_metric_power:0 "ЭНЕРГИЯ\n§Y[?RUS_bunker_used_power|0]/[?RUS_bunker_power|0]§! £energy_consumption_texticon"
 RUS_bunker_metric_food:0 "ЗАПАС ПИЩИ\n§Y[?RUS_bunker_food|0]/[?RUS_bunker_food_capacity|0]§! £supply_texticon"
 RUS_bunker_metric_integrity:0 "ПРОЧНОСТЬ\n§Y[?RUS_bunker_integrity|0]/100§! £fort_texticon"
 RUS_bunker_metric_depth:0 "СЛОИ\n§Y[?RUS_bunker_depth|0]/[?RUS_bunker_depth_limit|0]§! пройдено"
 RUS_bunker_metric_power_tt:0 "§YЭнергия комплекса§!\nЗанято: §Y[?RUS_bunker_used_power|0]§! £energy_consumption_texticon. Всего: §Y[?RUS_bunker_power|0]§!. Свободно: §Y[?RUS_bunker_free_power|0]§!.\n\nМонтаж и модернизации требуют свободной мощности. Два расширения генераторов добавляют по 4; резервная турбина добавляет ещё 2. Демонтаж освобождает мощность помещения."
 RUS_bunker_metric_food_tt:0 "§YПродовольствие§!\nЗапас: §Y[?RUS_bunker_food|0]/[?RUS_bunker_food_capacity|0]§! £supply_texticon. Сытость с §Y[?RUS_bunker_food_fed_line|0]§!.\nПоступает за неделю: §G+[?RUS_bunker_food_output|0]§!. Расход: §R-[?RUS_bunker_food_use|0]§!. Баланс: §Y[?RUS_bunker_food_balance|0]§!.\n\nКаждое оснащённое помещение расходует 1. Пустой склад - голод: -5% организации и -5% стабильности. Склад от 75% ёмкости - сытость: +5% стабильности и +5% скорости пополнения. Обоз пополняет склад, продажа излишков аймакам приносит казну."
 RUS_bunker_metric_integrity_tt:0 "§YПрочность сводов§!\nТекущее состояние: §Y[?RUS_bunker_integrity|0]/100§! £fort_texticon.\n\nОбычная проходка снимает 20, ускоренная 35. Укрепление восстанавливает 40, максимум 100; доступно при прочности 60 и ниже. Ниже 40: -5% выпуска военных заводов и -5% организации армии. Обычная проходка требует хотя бы 40, ускоренная 55."
 RUS_bunker_metric_depth_tt:0 "§YГотовность комплекса§!\nОснащено помещений: §Y[?RUS_bunker_fitted|0]§!. Пройдено слоёв: §Y[?RUS_bunker_depth|0]§!. Разрешённая глубина: §Y[?RUS_bunker_depth_limit|0]§!.\n\n1. Пройдите новый слой.\n2. Нажмите на его изображение.\n3. Выберите одно из двух помещений.\n4. Улучшите готовое помещение.\n\nПроходка и монтаж оплачиваются отдельно. Один пустой слой даёт +1% к пределу капитуляции."
 RUS_bunker_queue_ui_tt:0 "§YСтроительная очередь§!\n[GetRUSBunkerWork]\nЗаказ: [GetRUSBunkerProjectName].\n\nОдновременно выполняется один оплаченный проект. Смена выбранного слоя не отменяет работу. Оставшийся срок показан на активном решении ниже. При потере комплекса, подчинении, капитуляции или падении законного правительства незавершённый заказ отменяется с полным возвратом оплаты. Законная передача власти Осколу или Ниве не отменяет заказ."
 RUS_bunker_status_ui_tt:0 "§YСостояние подземной столицы§!\n[GetRUSBunkerStatus]\n[GetRUSBunkerCondition]\n[GetRUSBunkerRations]\n\nПри аварийных сводах: -5% выпуска военных заводов и -5% организации. При голоде: -5% организации и -5% стабильности.\n\nКомплекс работает, пока законное правительство управляет независимой страной и полностью владеет и контролирует регион 66. При временной потере сохраняются планировка и продовольствие; бонусы, расход и производство пищи приостанавливаются."
 RUS_bunker_excavate_button_label:0 "Пройти следующий слой"
 RUS_bunker_excavate_ui_tt:0 "§YПройти следующий слой§!\nЦена: [GetRUSBunker1pp]  [GetRUSBunker1cash]  [GetRUSBunker1equipment]\nСрок: §Y42 дн.§!\n\nСоздаёт пустой слой, снимает §R20§! £fort_texticon. Требуется прочность не ниже §Y40§!, свободная бригада и глубина меньше текущего разрешённого предела. Пустой слой даёт +1% к пределу капитуляции; помещение выбирается отдельно. При отмене заказа вся оплата возвращается."
 RUS_bunker_ui_rock:0 "Не пройден"
 RUS_bunker_ui_empty:0 "Пустой слой"
 RUS_bunker_queue_empty:0 "нет"
 RUS_entrenched_reserves:0 "Подготовленные рубежи"
 RUS_entrenched_reserves_desc:0 "Позиционная доктрина требует заранее выбранной земли, складов и оплаченной инженерной работы. Оборонная программа позволит превращать ресурсы государства в готовый рубеж. Командиры получат конкретную линию подготовки вместо приказа держаться любой ценой."
 RUS_fortress_engineers:0 "Инженеры укреплённых районов"
 RUS_fortress_engineers_desc:0 "Земляные работы не заканчиваются после появления первого окопа. Подготовим инженеров, способных обслуживать укрепления, рассредоточивать склады и приспосабливать укрытия к местности. Учебное оснащение поступит в действующий запас инженерной службы."
 RUS_railway_coverage:0 "Резерв за второй линией"
 RUS_railway_coverage_desc:0 "Удержать рубеж помогает не только его гарнизон. Отдельный парк локомотивов обеспечит переброску подкреплений и боеприпасов из глубины страны. Этот транспорт останется в реальном резерве снабжения после завершения штабных расчётов."
 RUS_mobile_supply_columns:0 "Колонна следует за армией"
 RUS_mobile_supply_columns_desc:0 "Маневренное соединение бесполезно, если его бензовозы и ремонтники остались у прежнего штаба. Мобильная программа сведёт подготовку транспорта, снабжения и командиров в оплаченный цикл. Генеральный штаб сможет готовить движение всей колонны, а не только её авангарда."
 RUS_motor_pool_dispatch:0 "Диспетчеры моторного парка"
 RUS_motor_pool_dispatch_desc:0 "Каждая исправная машина должна иметь задачу и сменного водителя. Диспетчерская служба разделит учебный, ремонтный и действующий парк, а государство передаст ей первую дополнительную партию транспорта. Грузовики смогут поддержать снабжение или комплектование войск."
 RUS_combined_arms_trials:0 "Подвижные ремонтные группы"
 RUS_combined_arms_trials_desc:0 "Темп наступления ограничен не самым быстрым грузовиком, а временем ремонта последнего. Испытаем полевые мастерские вместе с пехотой и артиллерией. Две исследовательские программы превратят удачные решения в стандартное оснащение вспомогательных подразделений."
 RUS_local_service_committees:0 "Комитеты местных работ"
 RUS_local_service_committees_desc:0 "Совет аймаков получает смысл тогда, когда жители видят результат своих решений. Первой задачей станут оплаченные работы на столичном транспортном узле, от которого зависят поставки в аймаки. Каждый новый заказ будет проверять состояние дорог и фактический контроль района."
 RUS_assembly_budget:0 "Казна совета"
 RUS_assembly_budget_desc:0 "Местное самоуправление без выделенных средств превращается в спор о чужих обещаниях. Совет получит стартовый фонд для своих программ. Деньги поступят в общую казну, и Хану предстоит решить, какой округ получит работу первым."
 RUS_regional_self_help:0 "Окружные санитарные артели"
 RUS_regional_self_help_desc:0 "Аймаки способны содержать собственные санитарные службы, если получают знания и инструменты. Артели объединят помощь семьям с подготовкой полевых пунктов. Центр передаст оборудование и откроет исследовательский курс по вспомогательным службам."
 RUS_inspection_chamber:0 "Палата строительной ревизии"
 RUS_inspection_chamber_desc:0 "Ханская канцелярия должна знать, какие здания существуют на земле, а какие лишь в ведомостях. Инспекторы сопоставят отчёты с потребностями округов. После ревизии правительство сможет оплачивать строительство военных цехов в столичном районе. Для первого заказа будет заранее выделена дополнительная площадка."
 RUS_single_supply_register:0 "Единый реестр поставок"
 RUS_single_supply_register_desc:0 "Разрозненные закупки переплачивают посредникам и оставляют строителей без инструмента. Сведём договоры в общую книгу, вернём неиспользованные средства в казну и передадим инженерной службе учтённые запасы. Реестр должен оплачивать реальные работы, а не новые реестры."
 RUS_provincial_commissioners:0 "Комиссары дорожной службы"
 RUS_provincial_commissioners_desc:0 "Дорога принадлежит всем ведомствам, и потому прежде за неё не отвечало ни одно. Канцелярия назначит комиссаров, которые связывают окружные склады и столицы аймаков. Их автомобильный парк станет доступен государственной системе снабжения."
 RUS_surface_contracts:0 "Ставка на дневную смену"
 RUS_surface_contracts_desc:0 "Разрушенные мастерские должны вновь работать при дневном свете. Поверхностный курс направит крупные оплаченные заказы на развитие обычной промышленности. Бункер сохранит все основные возможности, но особые инвестиционные программы получат наземные предприятия."
 RUS_open_freight_exchange:0 "Открытая грузовая биржа"
 RUS_open_freight_exchange_desc:0 "Новый завод должен получить сырьё и отправить продукцию заказчику. Грузовая биржа объединит расписания крупных предприятий с реальным транспортным резервом. Государственная партия локомотивов и машин обеспечит первую очередь перевозок."
 RUS_underground_fund:0 "Фонд подземной автономии"
 RUS_underground_fund_desc:0 "Укрытие, полностью зависящее от ежедневной поставки с поверхности, остаётся заложником первой осады. Подземный курс откроет оплаченные программы автономного снабжения. Наземные заводы продолжат развиваться, но специальные инвестиции получит устойчивость комплекса."
 RUS_autonomous_workshops:0 "Служба автономных мастерских"
 RUS_autonomous_workshops_desc:0 "Автономии нужны собственные механики и запас мощности, а не только закрытая дверь. Мастерские получат дополнительное питание, а кладовые — резервное пространство. Эти постоянные возможности останутся частью комплекса при дальнейшей смене модулей."
 RUS_bunker_layer_service_school:0 "Бригада каждого яруса"
 RUS_bunker_layer_service_school_desc:0 "Первый ярус уже можно строить, но работающий комплекс нуждается в постоянной инженерной службе. Подготовим отдельную бригаду и передадим ей оснащение для монтажа и модернизации. Материалы поступят в общий запас и смогут оплатить выбранные игроком работы."
 RUS_bunker_reserve_shaft:0 "Резервная энергетическая шахта"
 RUS_bunker_reserve_shaft_desc:0 "Пока проходчики заняты глубиной, энергетики проложат независимую линию обслуживания. Дополнительная единица мощности даст больше свободы при выборе модулей и их улучшений. Проект усилит комплекс независимо от текущей планировки."
 RUS_bunker_water_recycling:0 "Повторный водяной цикл"
 RUS_bunker_water_recycling_desc:0 "Вода уходит не только в трубы жилых отсеков, но и в производство продовольствия. Дополнительная ступень очистки вернёт часть расхода в хозяйственный цикл. Она увеличит недельный выпуск пищи при действующем комплексе и поможет кормить более глубокие слои."
 RUS_bunker_contingency_reservoir:0 "Резерв между сменами"
 RUS_bunker_contingency_reservoir_desc:0 "Даже работающий производственный ярус иногда останавливается. Устроим дополнительные кладовые и передадим первую партию длительного хранения. Запас даст жителям время дождаться ремонта, а увеличенная ёмкость останется после того, как последние пайки будут израсходованы."
 RUS_autonomous_workshops_tt:0 "Мощность бункера: §G+1§! £energy_consumption_texticon. Ёмкость продовольственного резерва: §G+20§! £supply_texticon."
 RUS_bunker_reserve_shaft_tt:0 "Мощность бункера: §G+1§! £energy_consumption_texticon."
 RUS_bunker_water_recycling_tt:0 "Производство продовольствия: §G+1§! £supply_texticon в неделю."
 RUS_bunker_contingency_reservoir_tt:0 "Ёмкость продовольственного резерва: §G+20§! £supply_texticon. Запас: §G+20§! £supply_texticon в пределах новой ёмкости."
 RUS_bunker_airlocks_capacity_tt:0 "Герметичные кладовые: §G+20§! £supply_texticon к ёмкости. Запас: §G+20§! £supply_texticon в пределах новой ёмкости."
 RUS_bunker_commission_reserve_tt:0 "Резерв подземной столицы: §G+20§! £supply_texticon к ёмкости и §G+20§! £supply_texticon в запас в пределах новой ёмкости."
 RUS_development_programmes:0 "Государственные программы Хана"
 RUS_development_programmes_desc:0 "Выбранный курс определяет, какие работы правительство может оплатить. Заказы выполняются при оплате, повторный заказ доступен после указанного перерыва. Постройки появляются в столичном регионе 66; оснащение списывается из действующего запаса армии."
 RUS_defensive_preparation:0 "Подготовить оборонительные рубежи"
 RUS_defensive_preparation_desc:0 "Инженерные партии оборудуют позиции и рассредоточат запасы на случай удара. Подготовка действует 120 дней; следующий цикл можно оплатить после её окончания."
 RUS_defensive_preparation_available_tt:0 "Законное правительство управляет независимой страной и контролирует столичный комплекс; открыта программа укреплённых рубежей, предыдущая подготовка завершена."
 RUS_defensive_preparation_spirit:0 "Подготовленные оборонительные рубежи"
 RUS_defensive_preparation_spirit_desc:0 "Инженерные команды размечают запасные позиции, проверяют подступы и оборудуют укрытия для частей первого эшелона. Подвезённый инструмент и заранее распределённые работы позволяют войскам лучше оборудовать позиции и увереннее держать рубеж. Оплаченная программа действует 120 дней."
 RUS_mobile_preparation:0 "Подготовить маршевые колонны"
 RUS_mobile_preparation_desc:0 "Ремонтные группы и подвижные склады подготовят снабжение наступления. Подготовка действует 120 дней; следующий цикл можно оплатить после её окончания."
 RUS_mobile_preparation_available_tt:0 "Законное правительство управляет независимой страной и контролирует столичный комплекс; открыта программа мобильного снабжения, предыдущая подготовка завершена."
 RUS_mobile_preparation_spirit:0 "Подготовленные маршевые колонны"
 RUS_mobile_preparation_spirit_desc:0 "Обозы получают маршруты, ремонтные команды — места сбора, а промежуточные склады — нормы выдачи. Колонна может продолжать движение, пока тыл подвозит припасы и возвращает технику в строй. Подготовленная сеть ускоряет переброску войск и сокращает расход снабжения на 120 дней."
 RUS_aimaq_public_works:0 "Оплатить дороги столичного аймака"
 RUS_aimaq_public_works_desc:0 "Местные комитеты соберут строительные артели и передадут им инструменты. На 180 дней страна получит +5% скорости строительства; инфраструктура региона 66 вырастет на один уровень, если ещё не достигла 5. При максимальных дорогах артели продолжают работать на других стройках. Результат выдаётся при оплате, новый заказ — после окончания службы артелей."
 RUS_aimaq_public_works_available_tt:0 "Законное правительство управляет независимой страной, полностью владеет и контролирует регион 66; открыты местные комитеты, предыдущая строительная программа завершена."
 RUS_chancery_reconstruction:0 "Оплатить расширение столичного арсенала"
 RUS_chancery_reconstruction_desc:0 "Инспекционная палата оплатит ввод новой оружейной линии в регионе 66. Один военный завод появляется сразу после оплаты и занимает обычную ячейку строительства. Следующий заказ — через 180 дней."
 RUS_chancery_reconstruction_available_tt:0 "Законное правительство управляет независимой страной, полностью владеет и контролирует регион 66; открыта инспекционная палата, в регионе есть свободная ячейка военного завода."
 RUS_surface_industrial_contract:0 "Оплатить наземную фабрику"
 RUS_surface_industrial_contract_desc:0 "Наземный промышленный договор вводит гражданскую фабрику в регионе 66 сразу после оплаты. Предприятие занимает обычную ячейку строительства. Следующий договор можно заключить через 180 дней."
 RUS_surface_industrial_contract_available_tt:0 "Законное правительство управляет независимой страной, полностью владеет и контролирует регион 66; выбран наземный промышленный курс, в регионе есть свободная ячейка фабрики."
 RUS_subterranean_supply_contract:0 "Оплатить автономный продовольственный контур"
 RUS_subterranean_supply_contract_desc:0 "Подземный фонд закупит оборудование для переработки и хранения пищи. Каждый из двух контуров увеличивает постоянный выпуск и ёмкость запасов. Монтаж выполняется при оплате; второй контракт доступен через 60 дней. Построено: [?RUS_bunker_autonomy_contracts|0]/2."
 RUS_subterranean_supply_contract_available_tt:0 "Законное правительство управляет независимой страной и контролирует столичный комплекс; выбран подземный фонд, оплачено меньше двух автономных контуров."
 RUS_subterranean_supply_reward_tt:0 "Постоянный выпуск: §G+1§! £supply_texticon в неделю. Ёмкость запаса: §G+20§! £supply_texticon. Оборудование сохраняется при временной потере комплекса; производство работает только в действующем бункере."

 # --- rus_public_campaigns ---
 RUS_public_campaigns:0 "Голос Хана"
 RUS_public_campaigns_desc:0 "Радио, печатные листки и собрания аймаков могут поддержать разные задачи государства.\n\nСвободно общих мест для кампаний: §Y[?ADISCORD_available_campaign_slots|0]§!. Каждое обращение занимает одно место до конца своего срока. Две редакции дают возможность вести два обращения одновременно.\n\nПри утрате Ханом самостоятельной власти действующие обращения прекращаются; место освобождается, но политическая власть за уже начатую агитацию не возвращается. Военная кампания «Последний приказ» завершается также при наступлении мира."
 RUS_public_campaign_slot_available_tt:0 "Есть свободное место для кампании: §Y[?ADISCORD_available_campaign_slots|0]§!."
 RUS_public_campaign_first_slot_tt:0 "Одна редакция: §G+1§! место в общем пуле оплаченных кампаний."
 RUS_public_campaign_second_slot_tt:0 "Вторая редакция: ещё §G+1§! место в общем пуле оплаченных кампаний."
 RUS_campaign_voice_of_the_aimaqs:0 "Один голос всех аймаков"
 RUS_campaign_voice_of_the_aimaqs_desc:0 "Столичный диктор передаст эфир старостам дальних аймаков. Их голоса расскажут о соседях, ремонте дорог и решённых спорах: государство должно быть слышно не только тогда, когда оно требует подчинения."
 RUS_campaign_bread_and_shelter:0 "Хлеб и крыша для каждой семьи"
 RUS_campaign_bread_and_shelter_desc:0 "Сводки о снабжении, очередях и работе убежищ займут место пустых обещаний. Семьи должны знать, ради чего приходится экономить сегодня и кто отвечает за завтрашнюю поставку. Кампания помогает организации тыла; продовольствие в бункер по-прежнему доставляют отдельным заказом."
 RUS_campaign_rifles_protect_home:0 "Эта винтовка защищает твой дом"
 RUS_campaign_rifles_protect_home_desc:0 "На заводских стендах появятся письма частей, которые получили их оружие. Имя рабочего, номер винтовки и благодарность бойца свяжут длинную смену с защитой конкретного дома."
 RUS_campaign_the_khan_keeps_his_word:0 "Власть отвечает за своё слово"
 RUS_campaign_the_khan_keeps_his_word_desc:0 "Редакция будет зачитывать исполненные решения вместе с именами ответственных. Громкое обещание получит дату, место и проверяемый результат: порядок держится на доверии к слову правителя."
 RUS_campaign_surface_trade:0 "Открытые дороги, работающие мастерские"
 RUS_campaign_surface_trade_desc:0 "Торговые вести, объявления подрядчиков и отчёты о новых стройках вернут движение на поверхность. Каравану нужен покупатель, мастерской — заказ, а строительной бригаде — уверенность в поставке материалов."
 RUS_campaign_last_order:0 "Последний приказ: удержать свой дом"
 RUS_campaign_last_order_desc:0 "Во время войны обращения фронтовиков и прямой приказ Хана поддержат боевой дух частей. Эта кампания действует только пока страна воюет. При наступлении мира она прекращается и освобождает место; потраченная политическая власть не возвращается."
 RUS_khan_broadcast_service:0 "Голос столицы в каждом аймаке"
 RUS_khan_broadcast_service_desc:0 "Слух добирается до дальнего аймака быстрее официального приказа. Радиослужба свяжет столичную редакцию с окружными громкоговорителями, а листки с текстами обращений достигнут тех, у кого нет приёмника. Первая редакционная смена ведёт кампании об единстве аймаков и снабжении; военная, государственная и торговая агитация открывается своими фокусами, чтобы каждая ветка отвечала за собственное обещание."
 RUS_parallel_public_addresses:0 "Две редакции — один эфир"
 RUS_parallel_public_addresses_desc:0 "Фронту нужны одни слова, семьям в тылу — другие. Вторая редакция и собственная печатная смена позволят одновременно вести два разных обращения. Действующую кампанию не придётся обрывать ради следующей: у каждой останутся своя оплата, срок и задача. Хан расширяет возможности службы, а какие обещания прозвучат в эфире, определит правительство."
 RUS_public_works_spirit:0 "Артели общественных работ"
 RUS_public_works_spirit_desc:0 "Общины направляют в артели плотников, каменщиков и возчиков. Казна оплачивает инструмент и работу, а местные мастера передают опыт соседним бригадам. Согласованные поставки и постоянные рабочие руки ускоряют стройки по всей стране; программа рассчитана на 180 дней."
 RUS_black_army_bookmark:0 "$RUS_black_army$"
 RUS_black_army_bookmark_desc:0 "$RUS_black_army_desc$"
 RUS_bunker_complex_bookmark:0 "$RUS_bunker_complex$"
 RUS_bunker_complex_bookmark_desc:0 "$RUS_bunker_complex_desc$"
 RUS_black_army:0 "Чёрная Армия"
 RUS_black_army_desc:0 "Под чёрными знамёнами сходятся отряды, которые ещё вчера подчинялись разным старшинам. Люди приносят собственное оружие, знают соседей в строю и готовы защищать родной аймак. За его пределами выясняется, насколько различаются их порядки, подготовка и представления о долге.\n\nЧёрная Армия должна научиться воевать как единое целое. Полковые книги, подготовленный резерв и общая служба связывают дружины со ставкой; выбранная доктрина определяет, станут ли они держать укреплённые рубежи или наступать подвижными колоннами. С ростом армии её командование получает всё больше оснований требовать собственного голоса в судьбе страны."
 RUS_black_army_state_tt:0 "Организация: §Y[GetRUSArmyOrganization]§!\nДоктрина: §Y[GetRUSArmyDoctrine]§!\nЧёрная Армия получает §G+5%§! атаки, а военные фокусы и ветка Чёрной армии изменяют остальные параметры духа. Бонусы помещений показаны отдельно в «Системе бункеров». Временная подготовка войск действует до окончания своего срока. Влияние учёных и Чёрной армии показано в балансе власти."
 RUS_bunker_system_state_tt:0 "[GetRUSBunkerStatus]\nОснащено слоёв: §Y[?RUS_bunker_fitted|0]/5§!; прочность: §Y[?RUS_bunker_integrity|0]/100§! £fort_texticon\nМощность: §Y[?RUS_bunker_used_power|0]/[?RUS_bunker_power|0]§! £energy_consumption_texticon; запас: §Y[?RUS_bunker_food|0]/[?RUS_bunker_food_capacity|0]§! £supply_texticon\nПостройка и модернизация помещений изменяют этот дух. Армейские реформы сохраняются независимо от комплекса."
 RUS_army_doctrine_patient:0 "Терпеливая война"
 RUS_army_doctrine_swift:0 "Подвижные колонны"
 RUS_army_doctrine_undecided:0 "Не выбрана"
 RUS_army_organization_regular:0 "Общая военная служба"
 RUS_army_organization_reserves:0 "Подготовленный резерв"
 RUS_army_organization_registers:0 "Единые списки частей"
 RUS_army_organization_hosts:0 "Аймачные отряды"
 RUS_bunker_depth_2_tt:0 "Разрешает проходку до второго слоя. Проходка и оснащение оплачиваются отдельно."
 RUS_army_organization_delta:0 "Изменение «Чёрной Армии»"
 RUS_army_empire_delta:0 "Изменение «Чёрной Армии»"
 RUS_state_balance:0 "Учёные — Чёрная армия"
 RUS_state_balance_category:0 "Учёные и Чёрная армия"
 RUS_state_balance_category_desc:0 "Под землёй спорят две силы. §YЧёрная армия§! держит входы и фронт, требуя людей, пайков и единого командования. §YУчёные§! держат свет, воду и лаборатории, без которых подземная страна не переживёт зиму. Обе стороны присягнули Хану: Чёрную армию возглавляет $RUS_black_army_leader$, учёных - $RUS_scientists_leader$.\n\nПоддержка Чёрной армии: §Y[?RUS_black_army_support|%0]§!\nПоддержка учёных: §Y[?RUS_scientists_support|%0]§!\n\nПоддержка выше 50% приносит £political_power_texticon и каждую неделю тянет баланс к своей стороне; поддержка ниже 50% отнимает £political_power_texticon. Фокусы, меры этой категории и проекты лабораторий меняют поддержку. Перевес на момент провозглашения определит облик державы: Империя Чёрного Знамени, Держава Восстановления или Последняя империя при равновесии. Каждую меру можно повторить через 90 дней."
 RUS_state_balance_compromise:0 "Присяга обеих сил"
 RUS_state_balance_government_tt:0 "Страной правит Марк Рустан; страна независима, не капитулировала, империя не распалась."
 RUS_bop_relief:0 "Усиленный паёк научных смен"
 RUS_bop_relief_desc:0 "Передать часть подземных запасов сменам, которые обслуживают насосы, фильтры и лаборатории. Сытые смены работают спокойнее, а учёные получают больше голоса в распределении запасов. Пища списывается сразу; опустошённый склад может вызвать голод в оснащённых помещениях. Повторение через 90 дней."
 RUS_bop_relief_room_tt:0 "Влияние учёных ещё не достигло 85% своей стороны шкалы."
 RUS_bop_reserve:0 "Выдать пайки резерву Чёрной армии"
 RUS_bop_reserve_desc:0 "Обеспечить питание добровольцев на сборных пунктах Чёрной армии. Страна получает резервистов, а армия - больше влияния на распределение запасов. Это люди для пополнения и набора, а не готовые вооружённые дивизии. Пища списывается сразу; опустошённый склад может вызвать голод. Повторение через 90 дней."
 RUS_bop_reserve_room_tt:0 "Влияние Чёрной армии ещё не достигло 85% своей стороны шкалы."
 RUS_bop_mediation:0 "Созвать совет армии и учёных"
 RUS_bop_mediation_desc:0 "Оплатить общее собрание командиров Чёрной армии, учёных и казначейства. Согласование полномочий приближает стороны к компромиссу, и обе уходят с ощущением, что Хан их услышал. Повторение через 90 дней."
 RUS_bop_mediation_needed_tt:0 "Баланс находится за пределами центрального диапазона от -10% до +10%."
 RUS_bop_mediation_result_tt:0 "Баланс власти сдвинется на §Y15%§! к середине шкалы. Поддержка §YУчёных§! и §YЧёрной армии§!: §G+5%§!."
 RUS_bop_relief_cost:0 "§Y25§! £political_power_texticon  §Y20§! £supply_texticon"
 RUS_bop_relief_cost_blocked:0 "§R25§! £political_power_texticon  §R20§! £supply_texticon"
 RUS_bop_relief_cost_tooltip:0 "Нужно 25 £political_power_texticon и 20 £supply_texticon из запасов бункера."
 RUS_bop_reserve_cost:0 "§Y30§! £political_power_texticon  §Y30§! £supply_texticon"
 RUS_bop_reserve_cost_blocked:0 "§R30§! £political_power_texticon  §R30§! £supply_texticon"
 RUS_bop_reserve_cost_tooltip:0 "Нужно 30 £political_power_texticon и 30 £supply_texticon из запасов бункера."
