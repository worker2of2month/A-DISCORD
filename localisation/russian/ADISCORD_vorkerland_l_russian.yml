 ADISCORD_vorkerland_unaligned_solar_target_tt: "Победитель в Солярино независим, не капитулировал и не вступил в коалицию."

 faction_vorkerland_free_republics_league: "Лига свободных республик"

 ADISCORD_vorkerland_news.3.t: "Выборы в Воркерланде"
 ADISCORD_vorkerland_news.3.worker.d: "Избирательные комиссии Воркерланда объявили о победе Никиты Уоркера. После окончания гражданской войны он вынес вопрос о своих полномочиях на голосование и сохранил пост. Неоворкеризм остаётся государственной идеологией.\n\nЧрезвычайное правительство теперь опирается на выборный мандат. Для соседей это означает, что восстановленным Воркерландом будет руководить прежняя власть."
 ADISCORD_vorkerland_news.3.yastrebtsev.d: "Избирательные комиссии Воркерланда объявили о победе Марка Ястребцева. По итогам голосования, проведённого после гражданской войны, Никита Уоркер уступает руководство страной. Правительство сформируют гуманисты.\n\nЧрезвычайный кабинет прекращает работу. Восстановлением страны займётся новое правительство."
 ADISCORD_vorkerland_news.3.filopo.d: "Избирательные комиссии Воркерланда объявили о победе Некро Филопо. Голосование, назначенное после окончания гражданской войны, лишило Никиту Уоркера власти и привело в правительство шовинистов.\n\nНовой власти достаётся страна, едва пережившая распад. За её курсом внимательно следят и бывшие члены конфедерации, и соседи."
 ADISCORD_vorkerland_news.3.a: "Итоги голосования объявлены."

 ADISCORD_vorkerland_news.4.t: "Воркерланд восстанавливает Башню Единства"
 ADISCORD_vorkerland_news.4.d: "Правительство [ROOT.GetNameDef] объявило о восстановлении Башни Единства, повреждённой взрывом в начале гражданской войны. Рабочие, инженеры и архивисты возвращают комплексу прежний облик. После завершения работ в нём снова разместятся органы управления, узел связи и государственный архив."
 ADISCORD_vorkerland_news.4.a: "Башню отстроят заново."
 ADISCORD_vorkerland_central_initiative:0 "Оперативная инициатива"
 ADISCORD_vorkerland_central_initiative_desc:0 "Согласованные действия штабов дают временное преимущество против других центральных претендентов. Действует не более двух лет с начала войны и прекращается при капитуляции, завершении гражданской войны или переходе одного из центральных претендентов под управление игрока."

# --- rus_crisis_l_russian ---
 RUS_last_empire_crisis: "Последний поход Хана"
 RUS_last_empire_crisis_desc: "Империя может расширить восточную границу и бросить вызов Кефрейту или Стеландеру. Фокус «Сломить гегемона» открывает выбор противника, а победитель северных войн может стать целью автоматически. После поражения Хана восстановленные осколки можно по отдельности оформить как санитарно-пограничные спецзоны."
 RUS_crisis_invasion_countdown: "Подготовка похода на гегемона"
 RUS_crisis_invasion_countdown_desc: "Через 90 дней после объявления похода Хан начнёт войну на полную аннексию. Штаб, снабжение, арсенал и резерв можно подготовить за 77 дней. Закрытие события не меняет срок."
 RUS_crisis_defence_countdown: "До вторжения Последней империи"
 RUS_crisis_defence_countdown_desc: "Хан требует подчинения победителя северных войн. По окончании отсчёта начнётся вторжение; союзники и зависимые страны вступят на нашей стороне. Поражение Хана приведёт к распаду его империи."
 RUS_crisis_establish_special_zone: "Спецзона: [FROM.GetName]"
 RUS_crisis_establish_special_zone_desc: "Учредить санитарно-пограничное управление на землях этого восстановленного осколка. Он станет нашей зависимой страной; остальные осколки сохранят самостоятельность, пока мы не примем отдельное решение."
 RUS_crisis_fragment_available_tt: "Осколок независим, вне союза и войны."
 RUS_empire_proclaimed_tt:0 "Общая держава Марка Рустана провозглашена."
 RUS_crisis_course_open_tt: "Последний поход ещё не завершён победой, распадом империи или внешним миром."
 RUS_crisis_challenge_hegemon: "Бросить вызов: [FROM.GetName]"
 RUS_crisis_challenge_hegemon_desc: "Объявить подготовку войны против этой державы. Через §Y90 дней§! империя нападёт; союзники и зависимые страны противника вступят на его стороне. Дожидаться завершения его северных кампаний не требуется. Выбор окончателен: пока идёт отсчёт, сменить противника нельзя."
 RUS_crisis_challenge_hegemon_tt: "Начнётся §Y90-дневная§! подготовка войны против §Y[FROM.GetName]§! и её коалиции. По истечении срока война начнётся автоматически."
 RUS_imperial_frontier_campaign: "Имперский поход: [FROM.GetName]"
 RUS_imperial_frontier_campaign_desc: "Начать войну за присоединение соседней страны. Нужна общая граница; цель должна быть независима и не входить в альянс. Империя открывает один фронт за раз. Подготовка и ведение последнего похода против гегемона временно закрывают новые пограничные войны."
 RUS_imperial_frontier_not_crisis_tt: "Поход на гегемона не готовится и не идёт; империя не распалась."
 RUS_crisis_war_active_tt:0 "Идёт общий имперский поход против гегемона."
 RUS_crisis_won_tt: "Гегемон и все участники его коалиции побеждены."
 RUS_crisis_warning_tt: "Поход начнётся по окончании 90-дневного отсчёта. Отсчёт уже идёт независимо от ответа на событие."
 ADISCORD_rus_crisis.1.t: "Требование Последней империи"
 ADISCORD_rus_crisis.1.d: "Посланники Хана прибыли с требованием признать его верховную власть. Нашу победу над прежними соперниками в ханской канцелярии считают лишь удобным завершением чужой работы: теперь достаточно сломить один центр силы, чтобы получить всё.\n\nНа границе собираются сотни и обозы. Разведка отводит нам девяносто дней до начала похода. Это время нужно использовать для развёртывания армии и согласования обороны с зависимыми правительствами и союзниками."
 ADISCORD_rus_crisis.1.a: "Готовить оборону."
 ADISCORD_rus_crisis.2.t: "Последний соперник Хана"
 ADISCORD_rus_crisis.2.d: "Северные войны выявили победителя. Для ханской канцелярии его новые владения составляют не признанное государство, а следующую цель: последняя империя не намерена делить своё имя с чужой гегемонией.\n\nПриказ о походе уже разослан. Через девяносто дней армии перейдут к наступлению. До этого срока необходимо свести командование, обеспечить тыл и собрать резерв; если враг разобьёт имперскую армию, аймаки и покорённые республики снова разойдутся по своим границам."
 ADISCORD_rus_crisis.2.a: "Передать приказ штабам."
 ADISCORD_rus_crisis.3.t: "Хан перешёл границу"
 ADISCORD_rus_crisis.3.d: "Срок, отведённый Ханом, истёк. Имперские колонны перешли к наступлению, а его посланники объявили целью войны полное уничтожение нашей государственности.\n\nСоюзные армии вступают в общую войну. Победа потребует разбить ханское государство; его поражение откроет путь к восстановлению местных республик и устройству специальных пограничных управлений."
 ADISCORD_rus_crisis.3.a: "Удержать фронт."
 ADISCORD_rus_crisis.4.t: "Империя осталась без Хана"
 ADISCORD_rus_crisis.4.val: "Ханская армия потерпела поражение. Приказы из бункера больше не связывают западные республики в одно государство: местные правления возвращаются на земли распавшейся империи. Сам Хан отстранён от власти, а его имперская канцелярия распущена.\n\nКефрейт может оставить эти осколки самостоятельными или по отдельности учредить в них санитарно-пограничные управления. Каждая спецзона оформляется отдельным решением; земли соседних государств в этот раздел не входят."
 ADISCORD_rus_crisis.4.sts: "Последняя империя распалась вместе с властью Хана. Покорённые республики восстанавливают свои учреждения, а бывший ханский центр переходит под местное управление. Единой ханской державы больше нет.\n\nСтеландер может оставить осколки независимыми или по отдельности превратить их в санитарно-пограничные спецзоны. Это решение принимается для каждой территории отдельно и не затрагивает владения государств, не входивших в империю."
 ADISCORD_rus_crisis.4.a: "Определить устройство границы."
 ADISCORD_rus_crisis.5.t: "Последний гегемон повержен"
 ADISCORD_rus_crisis.5.d: "Последние армии вражеской коалиции сложили оружие. Ханская канцелярия объявила её государства упразднёнными, а их владения включёнными в империю.\n\nНа смену походным приказам приходят описи городов, дорог и складов. Теперь предстоит восстановить управление покорёнными землями и превратить военную победу в устойчивое государственное устройство."
 ADISCORD_rus_crisis.5.a: "Приступить к устройству земель."
 ADISCORD_rus_crisis.6.t: "Поход утратил прежнюю цель"
 ADISCORD_rus_crisis.6.d: "Внешнее соглашение или изменение положения участников разрушило прежние условия похода. Особое урегулирование между империей и гегемоном закрыто; этот исход сам по себе не даёт права на аннексию или создание спецзон. Продолжающиеся сторонние войны решаются своим порядком."
 ADISCORD_rus_crisis.6.a: "Принять к сведению."
 RUS_imperial_general_staff: "Генеральный штаб империи"
 RUS_imperial_general_staff_desc: "Аймачные командиры привыкли отвечать только за собственные сотни. Теперь общий штаб сведёт их планы, донесения и приказы в одну военную карту и откроет военную кампанию «Последний приказ». Штаб и Второй сбор аймаков нужно завершить до провозглашения: после начала кризиса у империи останется только девяносто дней на ответ."
 RUS_western_supply_lines: "Дороги большого похода"
 RUS_western_supply_lines_desc: "За западными дорогами больше нельзя следить от случая к случаю. Поезда и автомобильные колонны свяжут тыл с наступающей армией, а удерживаемый путь к Старолесью получит более надёжную железную дорогу."
 RUS_imperial_arsenals: "Имперский арсенал"
 RUS_imperial_arsenals_desc: "Ханская канцелярия объединит заказы сотен в постоянную программу вооружения. Столичный арсенал получит собственные производственные цеха."
 RUS_aimaq_reserve: "Второй сбор аймаков"
 RUS_aimaq_reserve_desc: "Первый сбор позволил создать империю. Второй должен дать ей людей, винтовки, комплект стрелкового оружия и переносные зенитные расчёты, чтобы выдержать войну с противником, уже подчинившим своих соседей."
 RUS_break_the_hegemon: "Сломить гегемона"
 RUS_break_the_hegemon_desc: "Империя больше не намерена ждать, пока соседи закончат делить север. Штаб пополнит склады и передаст командирам полномочия для решительного наступления. Если последний поход ещё не объявлен, мы сможем сами бросить вызов Кефрейту или Стеландеру; выбранный противник получит девяносто дней предупреждения."
 RUS_register_conquered_lands: "Перепись покорённых земель"
 RUS_register_conquered_lands_desc: "Военная победа оставила после себя разрушенные учреждения и недоверие. На землях побеждённой коалиции откроются местные канцелярии, которые восстановят учёт хозяйств и повседневное управление."
 RUS_empire_without_rivals: "Империя без соперников"
 RUS_empire_without_rivals_desc: "После разгрома гегемона империи нужны собственные инженерные и исследовательские учреждения. Канцелярия выделит постоянное место для нового научного управления."

