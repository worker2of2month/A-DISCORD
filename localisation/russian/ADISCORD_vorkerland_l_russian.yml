 WTD_Central_Engineering_Council: "Ойтфортский инженерный совет"
 ADISCORD_vorkerland_wtd_worx_protocols: "Протоколы Воркса"
 ADISCORD_vorkerland_wtd_worx_protocols_desc: "После раскола республиканского центра инженеры Ойтфорта заняли диспетчерские, узлы связи и склады. Комитет признаёт стратегическое руководство Доктора Воркса и вступает в войну на его стороне, но внутри страны подменяет политику нормативами, пропусками и производственными квотами. Республика Уоркера при этом остаётся отдельным и полноценным участником гражданской войны."
 faction_vorkerland_northern_defense_front: "Северный оборонительный фронт"
 ADISCORD_vorkerland_northern_defense_front: "Северный оборонительный фронт"
 ADISCORD_vorkerland_northern_defense_front_desc: "Перед внешним вторжением северные штабы приостановили взаимную войну, свели радиосети и резервы в единый оборонительный контур. Перемирие продержится лишь до окончания похода Иванланда."
