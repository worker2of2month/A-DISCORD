 WRK_empire_appoint_governor:0 "Имперский наместник"
 WRK_empire_appoint_governor_desc:0 "Наместник принимает округ под управление империи. Столичная грамота определяет его полномочия, но ежедневная служба начинается с присяги местных учреждений."
 WRK_empire_appoint_governor_start_tt:0 "Через §Y30§! дней в регионе появится имперский наместник. Потеря региона, национального статуса области или самостоятельности страны отменяет назначение без возврата затрат."
 WRK_empire_military_governors_tt:0 "Новые §YИмперские наместники§! ставят военную администрацию: §G+25%§! местных призывников и §G+20%§! снабжения в регионе, §G+4000§! £manpower_texticon, сдвиг баланса к офицерскому корпусу на §Y2%§!."
 WRK_empire_civil_governors_tt:0 "Новые §YИмперские наместники§! ставят гражданскую администрацию: §G+10%§! выпуска заводов и §G+15%§! скорости строительства в регионе, §G+2000§! £manpower_texticon, сдвиг баланса ко двору на §Y5%§!."
 WRK_empire_staff_advisor_tt:0 "Становится доступен начальник штаба §YПавел Барсов§!."
 WRK_empire_western_ultimatum_tt:0 "Западный кризис обостряется: §R+10§! к напряжённости, война с Иторой становится ближе."
 WRK_empire_veyran_order_tt:0 "[GetVorkerlandEmpireOrderTooltip]"
 WRK_empire_after_the_tribunal:0 "[GetVorkerlandEmpireFoundationName]"
 WRK_empire_after_the_tribunal_desc:0 "[GetVorkerlandEmpireFoundationDesc]"
 WRK_empire_court_of_the_chairman:0 "Двор председателя"
 WRK_empire_court_of_the_chairman_desc:0 "Вокруг Уоркера складывается двор: секретари, советники и бывшие окружные чиновники, обязанные ему всем. Двор даёт председателю опору, которая не зависит от генералов."
 WRK_empire_erase_petrishchev:0 "Вымарать имя Петричева"
 WRK_empire_erase_petrishchev_desc:0 "Портреты сняты, приказы за его подписью переписаны, а газеты больше не вспоминают о спасителе председателя. Армия должна забыть, кому присягала на войне."
 WRK_empire_posthumous_rehabilitation:0 "Посмертная реабилитация"
 WRK_empire_posthumous_rehabilitation_desc:0 "Уоркер признаёт, что Петрищев служил государству, и возлагает вину на окружение покойного. Офицеры получают своего героя обратно, а с ним - уверенность, что их голос в империи весит больше голоса двора."
 WRK_empire_state_union:0 "Имперский государственный союз"
 WRK_empire_state_union_desc:0 "Единственная партия империи объединяет чиновников, офицеров и директоров заводов. Членство открывает дорогу к должности, а исключение закрывает её навсегда."
 WRK_empire_saved_chairman_cult:0 "Культ спасённого председателя"
 WRK_empire_saved_chairman_cult_desc:0 "История спасения из-под обломков переписана: теперь Уоркера вынесла сама судьба. Плакаты, учебники и радиопередачи учат, что империя существует, потому что выжил её председатель."
 WRK_empire_imperial_governors:0 "Наместничества"
 WRK_empire_imperial_governors_desc:0 "[GetVorkerlandEmpireGovernorsDesc]"
 WRK_empire_military_governors:0 "Военные наместники"
 WRK_empire_military_governors_desc:0 "Наместниками становятся отставные командиры. Они умеют собирать призывников и держать порядок, но служат скорее штабам, чем двору."
 WRK_empire_civil_governors:0 "Гражданские наместники"
 WRK_empire_civil_governors_desc:0 "Наместниками становятся чиновники двора. Они восстанавливают заводы и стройки, а офицеры в регионах подчиняются гражданской власти."
 WRK_empire_imperial_census:0 "Имперская перепись"
 WRK_empire_imperial_census_desc:0 "Наместники впервые после распада пересчитывают жителей бывших округов. Перепись открывает резервы, о которых не знал ни один окружной штаб."
 WRK_empire_staff_without_petrishchev:0 "[GetVorkerlandEmpireStaffName]"
 WRK_empire_staff_without_petrishchev_desc:0 "[GetVorkerlandEmpireStaffDesc]"
 WRK_empire_guard_legions:0 "Гвардейские легионы"
 WRK_empire_guard_legions_desc:0 "Лучшие части становятся гвардией империи: им достаются орудия, средства обеспечения и отборные офицеры. Гвардия сильна, но помнит, что может диктовать условия."
 WRK_empire_imperial_levy:0 "Имперская повинность"
 WRK_empire_imperial_levy_desc:0 "Каждый регион обязан выставить свою долю призывников. Массовая армия держит фронт числом и верна престолу, а не отдельным командирам."
 WRK_empire_legions_of_the_west:0 "Легионы Запада"
 WRK_empire_legions_of_the_west_desc:0 "Грузовики и локомотивный резерв готовят армию к походу на запад. Легионы должны идти быстрее, чем противник успеет перебросить резервы."
 WRK_empire_imperial_air_command:0 "Имперское авиакомандование"
 WRK_empire_imperial_air_command_desc:0 "Истребители и штурмовики сводятся в единое командование при генштабе. Над западным фронтом империя не намерена уступать небо."
 WRK_empire_imperial_treasury:0 "Казна без республики"
 WRK_empire_imperial_treasury_desc:0 "Окружные казначейства упразднены, налоги поступают в единую имперскую казну. Государственный заказ планирует выпуск на годы вперёд."
 WRK_empire_district_tribute:0 "Дань с округов"
 WRK_empire_district_tribute_desc:0 "Бывшие округа платят империи деньгами, оружием и продовольствием. Казна наполняется сразу, но в регионах помнят, кто приезжал за данью с охраной."
 WRK_empire_imperial_works:0 "Имперские стройки"
 WRK_empire_imperial_works_desc:0 "Империя восстанавливает то, что разрушила гражданская война. Новые заводы и программы восстановления округов должны показать, что центр не только берёт, но и строит."
 WRK_empire_tribute_arsenals:0 "Арсеналы на дань"
 WRK_empire_tribute_arsenals_desc:0 "Собранная дань идёт на строительство оружейных заводов. Новые линии работают на поход против Иторы."
 WRK_empire_building_offices:0 "Имперские строительные управления"
 WRK_empire_building_offices_desc:0 "Каждая губерния получает строительное управление, подчинённое имперским стройкам. Разрушенные округа восстанавливаются параллельно, а не по очереди."
 WRK_empire_war_economy:0 "Экономика похода"
 WRK_empire_war_economy_desc:0 "Гражданские и военные предприятия работают по единому плану войны. Империя готовит тыл к долгой кампании на западе."
 WRK_empire_western_ultimatum:0 "Ультиматум Западу"
 WRK_empire_western_ultimatum_desc:0 "Империя требует от западных столиц выбрать сторону без промедления. Ультиматум сплачивает армию и приближает войну с Иторой."
 WRK_empire_imperial_peace:0 "Имперский мир"
 WRK_empire_imperial_peace_desc:0 "Итора капитулировала, и на западе впервые за много лет нет фронта. Империя переводит армию на мирное положение и закрепляет победу администрацией, а не штыками."
 WRK_empire_tower_coronation:0 "Присяга в Башне Единства"
 WRK_empire_tower_coronation_desc:0 "[GetVorkerlandEmpireCoronationDesc]"
 WRK_empire_marshals_council:0 "Совет маршалов"
 WRK_empire_marshals_council_desc:0 "Победители Иторы получают постоянные места в имперском совете. Армия становится опорой государства, а её командиры - его вторым двором."
 WRK_empire_veyran_order:0 "Вейранский порядок"
 WRK_empire_veyran_order_desc:0 "[GetVorkerlandEmpireOrderDesc]"
 WRK_empire_delta_after_the_tribunal:0 "Двор империи"
 WRK_empire_delta_court_of_the_chairman:0 "Двор империи"
 WRK_empire_delta_erase_petrishchev:0 "Двор империи"
 WRK_empire_delta_state_union:0 "Двор империи"
 WRK_empire_delta_saved_chairman_cult:0 "Двор империи"
 WRK_empire_delta_tower_coronation:0 "Двор империи"
 WRK_empire_delta_posthumous_rehabilitation:0 "Армия мировой империи"
 WRK_empire_delta_staff_without_petrishchev:0 "Армия мировой империи"
 WRK_empire_delta_guard_legions:0 "Армия мировой империи"
 WRK_empire_delta_imperial_levy:0 "Армия мировой империи"
 WRK_empire_delta_legions_of_the_west:0 "Армия мировой империи"
 WRK_empire_delta_western_ultimatum:0 "Армия мировой империи"
 WRK_empire_delta_marshals_council:0 "Армия мировой империи"
 WRK_empire_delta_generals_seats:0 "Армия мировой империи"
 WRK_empire_delta_imperial_treasury:0 "Государственный военный план"
 WRK_empire_delta_war_economy:0 "Государственный военный план"
 WRK_empire_delta_veyran_order:0 "Государственный военный план"
 ADISCORD_vorkerland_postwar.60.t:0 "Заговор генералов"
 ADISCORD_vorkerland_postwar.60.d:0 "[GetVorkerlandEmpireConspiracyDesc]"
 ADISCORD_vorkerland_postwar.60.d_faded:0 "Служба безопасности докладывает о собраниях недовольных офицеров, но время заговорщиков ушло. Двор вернул себе влияние, и генералы, ещё месяц назад требовавшие гарантий для армии, теперь клянутся в верности председателю. Списки отправлены в архив."
 ADISCORD_vorkerland_postwar.60.a:0 "Арестовать заговорщиков."
 ADISCORD_vorkerland_postwar.60.b:0 "Дать генералам места в совете."
 ADISCORD_vorkerland_postwar.60.c:0 "Сохранить списки на будущее."
 ADISCORD_vorkerland_postwar.61.t_empire:0 "Воркерланд стал Вейранской империей"
 ADISCORD_vorkerland_postwar.61.d_empire:0 "[WRK.GetVorkerlandEmpireWesternVictoryDesc]"
 ADISCORD_vorkerland_postwar.61.t_worker:0 "Рождение Союза республик Запада и Востока"
 ADISCORD_vorkerland_postwar.61.d_worker:0 "Победа над Иторой изменила карту, и конгресс решил изменить имя страны. Воркерланд был именем осаждённой республики, которая едва пережила распад. Теперь в общий дом входят западные республики, и делегаты проголосовали за Союз республик Запада и Востока. Новая конституция закрепляет за каждой республикой собственный совет и обязывает союз защищать их общей армией.\n\nСкептики напоминают, что западные советы появились под защитой победившей армии. Сторонники отвечают, что впервые за поколение Запад и Восток живут по одному закону, а не по праву сильного."
 ADISCORD_vorkerland_postwar.61.t_technical:0 "Воркерланд стал Техническим союзом Форула"
 ADISCORD_vorkerland_postwar.61.d_technical:0 "Директория завершила западную кампанию так же, как вела её: расчётом. По заключению инженерных советов, имя Воркерланда описывало лишь одну страну из многих, связанных общими дорогами, энергосетями и мастерскими. Новое государство названо Техническим союзом Форула - по имени всего региона, а не одной столицы. Бывшие округа и бывшие противники входят в него как узлы единой системы, которой управляют специалисты.\n\nВ западных городах новый герб встречают сдержанно. Управление обещает электричество, ремонт и снабжение, но не спрашивает, хотят ли жители становиться частью чужого расчёта."
 ADISCORD_vorkerland_postwar.61.a:0 "Новое имя для новой эпохи."

# Worker confederation and technical directorate trees
 WRK_worker_west_mandate_offices: "Конституционные бюро Запада"
 WRK_worker_west_mandate_offices_desc: "Конгресс открывает бюро, которые объясняют жителям Иторы и Римата, что значит место в общем доме."
 WRK_worker_west_solidarity_committees: "Комитеты солидарности"
 WRK_worker_west_solidarity_committees_desc: "Рабочие комитеты готовы идти за мандатом конфедерации туда, куда не дошли её депутаты."
 WRK_worker_west_mandate_for_itora: "Мандат для Иторы"
 WRK_worker_west_mandate_for_itora_desc: "Конфедерация предлагает Иторе вступить в общий дом. Отказ будет означать войну."
 WRK_worker_west_confederate_charter: "Хартия западных республик"
 WRK_worker_west_confederate_charter_desc: "Новые конфедеративные республики получают хартию, которая определяет их место в общем доме."
 WRK_utilitarian_west_corridor_survey:0 "За пределами лаборатории"
 WRK_utilitarian_west_corridor_survey_desc:0 "Западные дороги и энергосети не заканчиваются у наших границ. Директории предстоит решить, какую цену соседи заплатят за участие в её проектах."
 WRK_utilitarian_west_engineer_battalions:0 "Чертежи будущей границы"
 WRK_utilitarian_west_engineer_battalions_desc:0 "Мосты, склады и ремонтные станции должны выдержать давление западного кризиса. Независимо от выбранного курса войскам потребуется подготовленный тыл."
 WRK_utilitarian_west_engineering_border:0 "Предъявить окончательный расчёт"
 WRK_utilitarian_west_engineering_border_desc:0 "Военные расчёты готовы. Директория может начать западную кампанию после завершения срока восстановления; если война уже началась, подготовленные части вступят в неё без нового объявления."
 WRK_utilitarian_west_technical_trusteeship:0 "Суверенитет - устаревшее понятие"
 WRK_utilitarian_west_technical_trusteeship_desc:0 "После победы внешние границы перестанут защищать хозяйство побеждённых от решений директории. Технические управления свяжут их производство с нашим планом."
 WRK_worker_west_war_tt: "Начинается §Yвойна за Запад§! против Иторы. При победе Итора и её союзники станут конфедеративными республиками."
 WRK_utilitarian_west_war_tt: "Начинается §Yвойна за Запад§! против Иторы. При победе её приграничье отойдёт Воркерланду, а Итора перейдёт под техническую опеку."
 ADISCORD_vorkerland_worker_confederation_focus:0 "Конфедерация республик"
 ADISCORD_vorkerland_technical_directorate_focus:0 "Технический директорат"
 WRK_route_influence_power_5_tt:0 "Сила нашего влияния на Западе: §Y+5§!."
 WRK_route_rebuild_slot_tt:0 "Одновременно может идти ещё §Y1§! программа §YВосстановления округа§!."
 WRK_route_all_west_5_tt:0 "Склонность всех западных государств к Воркерланду растёт на §Y5§!."
 WRK_conf_solidarity_abroad_tt:0 "Склонность [WPA.GetName] и [WPS.GetName] к Воркерланду растёт на §Y15§!, [ROM.GetName] и [TRU.GetName] - на §Y10§!."
 WRK_tech_supply_contracts_tt:0 "Склонность [WPS.GetName] и [PWR.GetName] к Воркерланду растёт на §Y20§!, [PSD.GetName] и [ZAO.GetName] - на §Y10§!."
 WRK_conf_council_of_republics:0 "Совет республик"
 WRK_conf_council_of_republics_desc:0 "Башня Единства снова стоит над столицей, но управляет страной не она, а совет делегатов всех республик. Конфедерация начинает работу с того, что делит обязанности, а не трофеи."
 WRK_conf_veteran_resettlement:0 "Расселение ветеранов"
 WRK_conf_veteran_resettlement_desc:0 "Демобилизованные получают дома в разрушенных округах и остаются в резерве своих республик."
 WRK_conf_cooperative_workshops:0 "Кооперативные мастерские"
 WRK_conf_cooperative_workshops_desc:0 "Артели и рабочие советы восстанавливают цеха на свои паи. Совет республик берёт на себя восстановление разрушенных округов."
 WRK_conf_workers_housing:0 "Рабочее жильё"
 WRK_conf_workers_housing_desc:0 "Сначала люди, потом заводы. Новые кварталы возвращают семьи в города, а ремонтные бригады получают постоянных работников."
 WRK_conf_municipal_councils:0 "Права муниципальных советов"
 WRK_conf_municipal_councils_desc:0 "Города сами распоряжаются стройками и подрядами. Восстановление идёт быстрее там, где решения принимают на месте."
 WRK_conf_social_guarantees:0 "Социальные гарантии"
 WRK_conf_social_guarantees_desc:0 "Пенсии, страхование и больницы закреплены в договоре республик. Рабочие знают, за что работают и за что будут воевать."
 WRK_conf_production_councils:0 "Производственные советы"
 WRK_conf_production_councils_desc:0 "Каждый завод управляется советом рабочих и инженеров. План составляется снизу, но выполняется по общему графику."
 WRK_conf_republican_arsenals:0 "Арсеналы республик"
 WRK_conf_republican_arsenals_desc:0 "Республики вместе строят оружейные заводы. Каждая получает долю заказов и долю ответственности за оборону."
 WRK_conf_shared_standards:0 "Общие стандарты"
 WRK_conf_shared_standards_desc:0 "Детали из одного округа подходят к станкам другого. Конфедерация производит больше, когда говорит на одном техническом языке."
 WRK_conf_research_soviets:0 "Научные советы"
 WRK_conf_research_soviets_desc:0 "Университеты и заводские лаборатории объединяются в сеть советов, открытую для всех республик."
 WRK_conf_republican_militias:0 "Милиции республик"
 WRK_conf_republican_militias_desc:0 "Каждая республика выставляет свою милицию. Совет даёт им оружие, а они дают конфедерации солдат."
 WRK_conf_elected_officers:0 "Выборные командиры"
 WRK_conf_elected_officers_desc:0 "Командиров выбирают солдаты и утверждает совет. Армия держится на доверии, а не на страхе."
 WRK_conf_people_in_arms:0 "Народ под ружьём"
 WRK_conf_people_in_arms_desc:0 "Вся конфедерация становится резервом. Каждый округ готовит людей, которые будут защищать свою землю до последнего."
 WRK_conf_red_engineers:0 "Красные инженеры"
 WRK_conf_red_engineers_desc:0 "Рабочие-специалисты сводятся в ударные инженерные части: мосты, артиллерия и связь идут впереди пехоты."
 WRK_conf_army_of_the_republics:0 "Армия республик"
 WRK_conf_army_of_the_republics_desc:0 "Милиции и кадровые части объединяются под общим штабом. Конфедерация готова защищать каждую республику как свою."
 WRK_conf_solidarity_abroad:0 "Солидарность за границей"
 WRK_conf_solidarity_abroad_desc:0 "Рабочие комитеты Норвена, Хольдена, Фреалора и Золоторевска получают поддержку конфедерации. Их голос будет услышан в их собственных столицах."
 WRK_conf_charter_for_the_west:0 "Хартия для Запада"
 WRK_conf_charter_for_the_west_desc:0 "Совет публикует хартию, которая обещает каждому западному государству место в общем доме и право голоса в нём."
 WRK_conf_southern_solidarity:0 "Солидарность с югом"
 WRK_conf_southern_solidarity_desc:0 "Эберн и Афрела остаются за пределами конфедерации. Совет готов поддержать их рабочих оружием, если правительства откажутся слушать."
 ADISCORD_vorkerland_pw_delta_conf_workers_housing:0 "Рабочее жильё"
 ADISCORD_vorkerland_pw_delta_conf_municipal_councils:0 "Права муниципальных советов"
 ADISCORD_vorkerland_pw_delta_conf_social_guarantees:0 "Социальные гарантии"
 ADISCORD_vorkerland_pw_delta_conf_production_councils:0 "Производственные советы"
 ADISCORD_vorkerland_pw_delta_conf_shared_standards:0 "Общие стандарты"
 ADISCORD_vorkerland_pw_delta_conf_elected_officers:0 "Выборные командиры"
 ADISCORD_vorkerland_pw_delta_conf_people_in_arms:0 "Народ под ружьём"
 ADISCORD_vorkerland_pw_delta_conf_red_engineers:0 "Красные инженеры"
 ADISCORD_vorkerland_pw_delta_conf_army_of_the_republics:0 "Армия республик"
 WRK_tech_directorate_plan:0 "Всё шло к этому"
 WRK_tech_directorate_plan_desc:0 "В разрушенной столице Уоркс видит подтверждение собственных расчётов. Он годами готовил технический резерв, ожидая краха прежнего порядка. Теперь ему предстоит доказать, что победа даёт право управлять живой страной."
 WRK_tech_grid_repair_crews:0 "Ремонт энергосети"
 WRK_tech_grid_repair_crews_desc:0 "Бригады электриков восстанавливают подстанции и линии. Без энергии нет ни заводов, ни лабораторий."
 WRK_tech_district_metrics:0 "Из пепла - по чертежу"
 WRK_tech_district_metrics_desc:0 "У каждого разрушенного округа будет собственная очередь восстановления. Чертёж должен стать обязательством перед теми, кто пережил войну."
 WRK_tech_automated_workshops:0 "Сначала запустим станки"
 WRK_tech_automated_workshops_desc:0 "Промышленные площадки получат первоочередные поставки. Городам придётся ждать, пока новые производственные линии вернут стране средства для восстановления."
 WRK_tech_municipal_utilities:0 "Сначала включим свет"
 WRK_tech_municipal_utilities_desc:0 "Жильё и городские службы получат материалы раньше закрытых институтов. Это замедлит лабораторные стройки, зато округа смогут выполнять решения совета без помощи личных комиссаров доктора."
 WRK_tech_measured_economy:0 "Страна работает круглосуточно"
 WRK_tech_measured_economy_desc:0 "Круглосуточная работа требует устойчивого порядка. Гражданский курс обеспечит смены и ремонт; закрытые комплексы получат дополнительный выпуск ценой ещё более жёсткого режима."
 WRK_tech_machine_tool_pool:0 "Ничего сверх необходимого"
 WRK_tech_machine_tool_pool_desc:0 "Один и тот же станок нужен ремонтникам, оружейникам и лабораториям. Директория введёт общий порядок распределения оборудования и откроет программу проверки промышленных процессов."
 WRK_tech_standardized_arsenals:0 "Стандартные арсеналы"
 WRK_tech_standardized_arsenals_desc:0 "Оружейные заводы строятся по одному проекту и выпускают одни и те же модели. Армия получает предсказуемое снабжение."
 WRK_tech_national_laboratories:0 "Национальные лаборатории"
 WRK_tech_national_laboratories_desc:0 "Директорат открывает сеть лабораторий, которые работают на государственные задачи, а не на ведомственные интересы."
 WRK_tech_specialist_schools:0 "Школы специалистов"
 WRK_tech_specialist_schools_desc:0 "Техникумы готовят операторов, связистов и наладчиков для новых заводов и для армии."
 WRK_tech_engineering_corps:0 "Война поддаётся расчёту"
 WRK_tech_engineering_corps_desc:0 "Снабжение и инженерная подготовка дадут штабу числа, которым можно доверять. Новые методы всё равно придётся проверить на действующем фронте."
 WRK_tech_mechanized_staff:0 "Поправки, написанные кровью"
 WRK_tech_mechanized_staff_desc:0 "Полковые донесения заставляют исправлять самые красивые расчёты. Виктор Гесс соберёт их в рабочие наставления и потребует от институтов отвечать на вопросы фронта."
 WRK_tech_measured_front:0 "Машина прикроет человека"
 WRK_tech_measured_front_desc:0 "Подготовленного солдата трудно заменить. Армия получит ремонтные службы и моторизованный резерв, а испытательные группы будут обязаны возвращать людей и оборудование."
 WRK_tech_fire_superiority:0 "Потери укладываются в модель"
 WRK_tech_fire_superiority_desc:0 "Штаб получит право расходовать резерв ради проверки расчётов. Быстрые результаты оплачиваются людьми, и новые заявки на пополнение уже лежат рядом с первой моделью наступления."
 WRK_tech_command_calculus:0 "Доказано на практике"
 WRK_tech_command_calculus_desc:0 "Принятые методы выдержали полевую проверку. Их внесут в армейские наставления вместе с пределами применения: ни один успешный опыт не отменяет потребности в снабжении."
 WRK_tech_supply_contracts:0 "Они сами откроют двери"
 WRK_tech_supply_contracts_desc:0 "Станки и ремонтные бригады окажутся убедительнее угроз. Соседи сохранят право отказаться от договора; принятые обязательства станут основой нашего присутствия."
 WRK_tech_technical_assistance:0 "Сопротивление включено в расчёт"
 WRK_tech_technical_assistance_desc:0 "Доктор считает отказ от сотрудничества неисправностью местной власти. Инженерные команды начнут готовить коридор для войск, если западный кризис придётся решать силой."
 WRK_tech_southern_programme:0 "Следующий пункт повестки"
 WRK_tech_southern_programme_desc:0 "Эберн и Афрела остаются самостоятельными задачами. Директория откроет подготовку южных кампаний, не смешивая их расчёты с исходом войны за запад."
 ADISCORD_vorkerland_pw_delta_tech_directorate_plan:0 "План директората"
 ADISCORD_vorkerland_pw_delta_tech_grid_repair_crews:0 "Ремонт энергосети"
 ADISCORD_vorkerland_pw_delta_tech_district_metrics:0 "Метрики округов"
 ADISCORD_vorkerland_pw_delta_tech_automated_workshops:0 "Автоматизированные мастерские"
 ADISCORD_vorkerland_pw_delta_tech_municipal_utilities:0 "Городские службы"
 ADISCORD_vorkerland_pw_delta_tech_measured_economy:0 "Измеримая экономика"
 ADISCORD_vorkerland_pw_delta_tech_machine_tool_pool:0 "Станочный парк"
 ADISCORD_vorkerland_pw_delta_tech_engineering_corps:0 "Инженерный корпус"
 ADISCORD_vorkerland_pw_delta_tech_measured_front:0 "Измеренный фронт"
 ADISCORD_vorkerland_pw_delta_tech_fire_superiority:0 "Огневое превосходство"
