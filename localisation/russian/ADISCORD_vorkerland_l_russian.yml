 RUS_bunker_excavate:0 "Пройти следующий слой"
 RUS_bunker_excavate_desc:0 "Методичная проходка: геологи ведут забой вслед за пробами, а крепёж устанавливают прежде, чем вынут следующую тележку породы.\n\nСрок: 42 дн. Требуется прочность не ниже 40. По завершении: следующий слой; прочность -20. Пустой слой добавляет 1% к пределу капитуляции. Ниже 40 прочности действуют -5% выпуска военных заводов и -5% организации армии.\n$RUS_bunker_contract_tt$"
