l_russian:
# --- dirty_zone_l_russian ---
 ADISCORD_vorkerland_dirty_zone.1.t: "Из Грязной зоны снова приходят новости"
 ADISCORD_vorkerland_dirty_zone.1.d: "Впервые за много лет из-за периметра Грязной зоны поступают сообщения, которые удаётся проверить. Открываются старые дороги, снова работают линии связи, считавшиеся мёртвыми, на картах появляются границы местных администраций. Территория, которую снаружи привыкли считать заражённой пустошью, оказалась населена: там есть свои правительства и свои войны. Соседние государства начинают выяснять, с кем им теперь придётся иметь дело."
 ADISCORD_vorkerland_dirty_zone.1.a: "Зона оказалась обитаемой."

 ADISCORD_debug_open_vorkerland_dirty_zone: "§RDEBUG:§! Открыть Грязную зону"
 ADISCORD_debug_open_vorkerland_dirty_zone_desc: "Пропускает трёхлетнее ожидание и запускает штатный сценарий открытия Грязной зоны."

# --- civil_war_focus_l_russian ---
 VAD_convene_collegial_staff:0 "Созвать коллегиальный штаб"
 VAD_convene_collegial_staff_desc:0 "Уоркер не стоит рядом с Петричевым, но это ещё не делает корону единственным источником власти. Командиры округов могут учредить общее правление, в котором председатель отвечает перед штабом за каждый приказ."
 VAD_require_collective_directives:0 "Утвердить коллективные директивы"
 VAD_require_collective_directives_desc:0 "Решения должны пройти через общий стол прежде, чем попасть в полевые штабы. Регулярная смена гарнизонов разорвёт связи, превращающие комендантов в местных хозяев."
 VAD_delegate_to_front_commands:0 "Доверить решения фронтам"
 VAD_delegate_to_front_commands_desc:0 "Командир на месте видит то, чего не видно из столицы. Вместе с правом действовать самостоятельно он получит обязанность содержать полевые склады и отвечать за отношения с округом."
 VAD_codify_staff_mandate:0 "Закрепить мандат коллегии"
 VAD_codify_staff_mandate_desc:0 "Временное согласие офицеров пора превратить в порядок работы государства. Устав определит полномочия председателя и ту грань, за которой приказ требует согласия коллегии."
 WRK_joint_ratify_staff_constitution:0 "Принять конституцию военной республики"
 WRK_joint_ratify_staff_constitution_desc:0 "Восстановленная Башня Единства вновь стала местом, откуда обращаются ко всей стране. Коллегия должна закрепить своё право управлять в мирное время и признать пределы чрезвычайной власти. Петричев подпишет конституцию как председатель, а не как государь."
 VAD_collegial_mandate_available_tt:0 "Уоркер не спасён Петричевым; независимое правительство ещё не выбрало другой политический курс."
 VAD_collegial_government_active_tt:0 "Действует независимая военная коллегия под председательством Петричева."
 VAD_collegial_mandate_chosen_tt:0 "Петричев возглавит коллегиальный штаб. Совместный кабинет и имперский курс станут недоступны."
 VAD_staff_mandate_survives_tt:0 "Мандат коллегии сохранится после объединения страны."
 VAD_staff_republic_tt:0 "Страна примет название военной республики; Петричев сохранит пост председателя коллегии."
 VAD_staff_party:0 "£GFX_generic_etatism_military_committee_party_texticon Военная коллегия"
 VAD_staff_party_long:0 "£GFX_generic_etatism_military_committee_party_texticon Коллегиальный генеральный штаб Воркерланда"
 VAD_vorkerland_staff_republic:0 "Военная Республика Воркерланд"
 VAD_vorkerland_staff_republic_DEF:0 "Военная Республика Воркерланд"
 VAD_vorkerland_staff_republic_ADJ:0 "Воркерландск."
 VAD_collegial_staff_dynamic:0 "Мандат военной коллегии"
 VAD_collegial_staff_dynamic_desc:0 "Полномочия председателя и командующих определены общим уставом."
 VAD_staff_collective_delta:0 "Коллективное планирование"
 VAD_staff_delegation_delta:0 "Самостоятельность фронтов"
 VAD_staff_constitution_delta:0 "Конституция военной республики"
 VAD_staff_rotation_programme:0 "Сменить окружной гарнизон"
 VAD_staff_rotation_programme_desc:0 "Новый гарнизон сменит части, слишком тесно связанные с местной комендатурой. Интенданты проведут приёмку складов в присутствии представителей коллегии."
 VAD_staff_depot_programme:0 "Развернуть полевой склад"
 VAD_staff_depot_programme_desc:0 "Командующий собирает запасы ближе к своим частям. Окружной управе придётся договариваться с военными о подводах, помещениях и людях для погрузки."
 VAD_staff_rotation_unlock_tt:0 "Окружная ротация снижает напряжение и временно улучшает местное снабжение."
 VAD_staff_depot_unlock_tt:0 "Полевой склад временно улучшает снабжение и движение войск, повышая напряжение в округе."
 VAD_staff_rotation_available_tt:0 "Действует коллегия; округ принадлежит нам, контролируется нами и имеет комендатуру без действующей ротации или полевого склада."
 VAD_staff_depot_available_tt:0 "Действует коллегия; округ принадлежит нам, контролируется нами и имеет комендатуру без мятежа, действующей ротации или полевого склада."
 VAD_staff_rotation_result_tt:0 "Через §Y21 день§! в выбранном округе: напряжение §G-30§! (не ниже §Y0§!), мятеж прекращается; местное снабжение контролирующей стороны §G+15%§! на §Y70 дней§!."
 VAD_staff_depot_result_tt:0 "Через §Y21 день§! в выбранном округе: местное снабжение контролирующей стороны §G+25%§! и скорость её войск §G+5%§! на §Y70 дней§!; напряжение §R+20§!. При §Y100§! начинается мятеж, приостанавливающий местные преимущества."
 VAD_staff_programme_cancellation_tt:0 "При потере округа, комендатуры или полномочий коллегии незавершённая работа отменяется с возвратом полной оплаты. Местные преимущества не действуют во время мятежа и исчезают при ликвидации комендатуры."
 VAD_staff_rotated_garrison:0 "Сменённый гарнизон"
 VAD_staff_field_depot:0 "Полевой склад коллегии"
 VAD_oath_pending_staff_rotation:0 "Ротация гарнизона: §Y[?VAD_oath_state.GetName]§!."
 VAD_oath_pending_staff_depot:0 "Полевой склад: §Y[?VAD_oath_state.GetName]§!."
 ADISCORD_vorkerland_claimant.13.staff.d:0 "На стол Петричева положили сводку подписанных директив. Теперь каждый командующий знает, какие решения он вправе принять сам, а какие обязан вынести на общий совет. Коллегия впервые выступает перед округами как единая власть. Председатель требует от штабов исполнять тот самый порядок, который они только что утвердили."
 ADISCORD_vorkerland_claimant.13.staff.a:0 "Штаб связан собственным уставом."
 VAD_staff_rotation_cost:0 "§Y25§! £political_power_texticon §Y500§! £population_texticon §Y60§! £support_equipment_texticon"
 VAD_staff_rotation_cost_blocked:0 "§R25§! £political_power_texticon §R500§! £population_texticon §R60§! £support_equipment_texticon"
 VAD_staff_rotation_cost_tooltip:0 "Стоимость: §Y25§! £political_power_texticon §Y500§! £population_texticon §Y60§! £support_equipment_texticon."
 VAD_staff_depot_cost:0 "§Y25§! £political_power_texticon §Y100§! £support_equipment_texticon"
 VAD_staff_depot_cost_blocked:0 "§R25§! £political_power_texticon §R100§! £support_equipment_texticon"
 VAD_staff_depot_cost_tooltip:0 "Стоимость: §Y25§! £political_power_texticon §Y100§! £support_equipment_texticon."
 VAD_vorkerland_collegial_staff:0 "Военная коллегия Воркерланда"
 VAD_vorkerland_collegial_staff_DEF:0 "Военная коллегия Воркерланда"
 VAD_vorkerland_collegial_staff_ADJ:0 "Воркерландск"
 VAD_collegial_petrichev_desc:0 "Влад Петричев возглавляет коллегию окружных командующих. Его полномочия определяет служебный мандат, а решения о судьбе страны проходят через генеральный штаб. Уоркер не входит в это правительство; претензии на корону также не стали его основанием."

 VAD_convene_joint_congress:0 "Созвать съезд двух делегаций"
 VAD_convene_joint_congress_desc:0 "Подписи Уоркера и Петричева соединили два лагеря, но окружные коменданты по-прежнему слышат лишь голос штаба. Рабочие делегаты должны получить собственное место за столом, где решают судьбу их округов. Союз переживёт войну, только если его будут признавать за пределами столицы."
 VAD_sign_joint_operational_orders:0 "Подписать совместные оперативные планы"
 VAD_sign_joint_operational_orders_desc:0 "В полевых штабах всё ещё спорят, чья печать придаёт приказу силу. Уоркер и Петричев могут закончить этот спор общим оперативным планом. Но приказ с двумя подписями остаётся приказом, и далеко не каждый округ встретит его с одобрением."
 VAD_joint_congress_programme:0 "Принять окружные делегации"
 VAD_joint_congress_programme_desc:0 "В столицу прибывают представители мастерских, гарнизонов и местных управ. За общим столом они должны договориться о том, чего комендатура вправе требовать от округа и где заканчивается её власть."
 VAD_joint_operations_programme:0 "Согласовать очередную операцию"
 VAD_joint_operations_programme_desc:0 "Офицеры Петричева сверяют карты с представителями Уоркера. После утверждения общего плана окружным управлениям предстоит подчинить ему собственные нужды. На этот раз никто не сможет сослаться на противоречащий приказ другого кабинета."
 VAD_joint_congress_district_tt:0 "Есть подконтрольный округ с комендатурой и напряжением не ниже §Y20§!."
 VAD_joint_congress_available_tt:0 "Действует совместное правительство; есть подконтрольная комендатура с напряжением не ниже §Y20§!."
 VAD_joint_operations_available_tt:0 "Совместное правительство ведёт войну; предыдущие совместные оперативные приказы уже завершились."
 VAD_joint_congress_unlock_tt:0 "Окружные делегации смогут добиваться снижения напряжения во всех подконтрольных комендатурах."
 VAD_joint_operations_unlock_tt:0 "Откроется подготовка временных оперативных приказов для армии ценой роста напряжения в комендатурах."
 VAD_joint_congress_result_tt:0 "Через §Y14 дней§!: напряжение во всех принадлежащих нам и контролируемых комендатурах снизится на §G20§! (до минимума §Y0§!); действующие мятежи в них прекратятся."
 VAD_joint_operations_result_tt:0 "Через §Y14 дней§!: вступят в силу совместные оперативные приказы. Напряжение во всех принадлежащих нам и контролируемых комендатурах вырастет на §R10§! (до максимума §Y100§!); при достижении §Y100§! начнётся местный мятеж."
 VAD_joint_programme_cancellation_tt:0 "До завершения занята общая очередь канцелярии. При утрате условий программа отменяется с полным возвратом оплаты; при смене государства средства получает наше государство-преемник."
 VAD_joint_operational_orders:0 "Совместные оперативные приказы"
 VAD_joint_operational_orders_desc:0 "Штаб и совет согласовали общий план кампании. Полевые части получают одну систему приказов, за исполнение которой отвечают оба руководителя."
 VAD_oath_pending_joint_congress:0 "Работает съезд окружных делегаций. Оплачено: §Y[?VAD_oath_pp|0]§! £political_power_texticon §Y[?VAD_oath_manpower|0]§! £population_texticon."
 VAD_oath_pending_joint_operations:0 "Готовится совместная операция. Оплачено: §Y[?VAD_oath_pp|0]§! £political_power_texticon §Y[?VAD_oath_support|0]§! £support_equipment_texticon."
 VAD_joint_congress_cost:0 "§Y35§! £political_power_texticon §Y500§! £population_texticon"
 VAD_joint_congress_cost_blocked:0 "§R35§! £political_power_texticon §R500§! £population_texticon"
 VAD_joint_congress_cost_tooltip:0 "Стоимость: §Y35§! £political_power_texticon §Y500§! £population_texticon."
 VAD_joint_operations_cost:0 "§Y30§! £political_power_texticon §Y100§! £support_equipment_texticon"
 VAD_joint_operations_cost_blocked:0 "§R30§! £political_power_texticon §R100§! £support_equipment_texticon"
 VAD_joint_operations_cost_tooltip:0 "Стоимость: §Y30§! £political_power_texticon §Y100§! £support_equipment_texticon."

 ADISCORD_vorkerland_wkr_administration:0 "Рабочие советы"
 ADISCORD_vorkerland_wkr_administration_desc:0 "Учреждено советов: §Y[?ADISCORD_vorkerland_wkr_councils|0]§!. Работает в тылу: §Y[?WKR_working_councils|0]§!. Назначено в армию, включая подготовку: §Y[?ADISCORD_vorkerland_wkr_councils_mobilized|0]§!.\n\n[GetWKRCouncilOrder]\n\n[GetWKRPoliticalMandate]\n\n[GetWKRRailwayOrder]"
 WKR_mobilize_factory_columns:0 "Собрать заводские колонны"
 WKR_mobilize_factory_columns_desc:0 "Заводские гудки сменяются строевыми командами. Два совета сводят своих рабочих в общую колонну: цеховые списки становятся ротными, а дежурные мастера принимают оружие по ведомости."
 WKR_council_context_tt:0 "Чрезвычайное правительство независимо, не капитулировало и продолжает гражданскую кампанию; столица принадлежит нам и находится под нашим контролем."
 WKR_council_order_free_tt:0 "Нет другого оплаченного формирования рабочих советов."
 WKR_council_seats_1_tt:0 "В тылу работает хотя бы один свободный совет."
 WKR_council_seats_2_tt:0 "В тылу работают хотя бы два свободных совета."
 WKR_council_unlock_tt:0 "Советы смогут формировать заводские отряды из оплаченных людей и оружия."
 WKR_council_order_1_tt:0 "Один совет прекращает работу в цехах. После подготовки WKR получит в столице один заводской отряд из трёх ополченческих батальонов, укомплектованный оплаченными людьми и винтовками."
 WKR_council_order_2_tt:0 "Два совета прекращают работу в цехах. После подготовки WKR получит в столице два заводских отряда по три ополченческих батальона, укомплектованных оплаченными людьми и винтовками."
 WKR_council_order_cancellation_tt:0 "Отсутствие своей подконтрольной столицы, капитуляция, подчинение или конец гражданского конфликта отменят подготовку: вся оплата вернётся, советы возобновят работу в тылу. При объединении возврат получит Воркерланд. Смена руководителя не отменяет заказ."
 WKR_council_delivered_tt:0 "WKR получит в столице заводские отряды: §Y[?WKR_delivered_councils|0]§!. В каждом - три ополченческих батальона с оплаченными людьми и винтовками."
 WKR_council_order_pending:0 "Готовится заводских отрядов: §Y[?WKR_council_order_units|0]§!. Оплачено: §Y[?WKR_council_order_pp|0]§! £political_power_texticon §Y[?WKR_council_order_manpower|0]§! £population_texticon §Y[?WKR_council_order_rifles|0]§! £infantry_equipment_texticon. Это подготовка, а не развёрнутые части."
 WKR_council_order_idle:0 "Нет оплаченных формирований в подготовке."
 WKR_factory_battalion_unit:0 "Заводской отряд"
 WKR_councils_batch_mobilized_dummy:0 "Два совета уходят в армию"
 WKR_council_order_cost:0 "§Y25§! £political_power_texticon §Y3000§! £population_texticon §Y2700§! £infantry_equipment_texticon"
 WKR_council_order_cost_blocked:0 "§R25§! £political_power_texticon §R3000§! £population_texticon §R2700§! £infantry_equipment_texticon"
 WKR_council_order_cost_tooltip:0 "§Y25§! £political_power_texticon §Y3000§! £population_texticon §Y2700§! £infantry_equipment_texticon"
 WKR_council_batch_cost:0 "§Y50§! £political_power_texticon §Y6000§! £population_texticon §Y5400§! £infantry_equipment_texticon"
 WKR_council_batch_cost_blocked:0 "§R50§! £political_power_texticon §R6000§! £population_texticon §R5400§! £infantry_equipment_texticon"
 WKR_council_batch_cost_tooltip:0 "§Y50§! £political_power_texticon §Y6000§! £population_texticon §Y5400§! £infantry_equipment_texticon"
# District administration
 ADISCORD_vorkerland_vad_administration:0 "Штаб и канцелярия"
 ADISCORD_vorkerland_vad_administration_desc:0 "Действующие хартии: §Y[?ADISCORD_vorkerland_vad_charters|0]§!. Комендатуры: §Y[?ADISCORD_vorkerland_vad_commandants|0]§!.\n[GetVADOathProject]\n\nКанцелярия ведёт одну окружную программу за раз. Хартии ограничены тремя округами; коронные комиссии открывают ещё три места. Комендатуры начинают с 20 недовольства и каждый месяц добавляют [GetVADUnrestRate]: 10 при влиянии канцелярии выше 10%, 30 при господстве штаба выше 60%, иначе 20. При 100 начинается местное восстание. Потерянную или отозванную администрацию можно восстановить за полную цену."
 VAD_bop:0 "Штаб и канцелярия"
 VAD_bop_staff:0 "Армейский штаб"
 VAD_bop_chancery:0 "Окружная канцелярия"
 VAD_bop_even:0 "Согласованный приказ"
 VAD_bop_staff_influence:0 "Приоритет армии"
 VAD_bop_staff_dominance:0 "Приказ выше права"
 VAD_bop_chancery_influence:0 "Гражданские реестры"
 VAD_bop_chancery_dominance:0 "Власть канцелярии"
 VAD_administration_active_tt:0 "Военный округ независим, не капитулировал и продолжает гражданскую кампанию."
 VAD_oath_slot_tt:0 "Канцелярия не занята другой окружной программой."
 VAD_oath_target_tt:0 "Область полностью принадлежит нам и контролируется нами; другой присяги или заявки нет."
 VAD_charter_available_tt:0 "Округ действует, область удерживается, есть свободное место окружной хартии."
 VAD_commandant_available_tt:0 "Округ действует и полностью удерживает область."
 VAD_oath_pending_charter:0 "Канцелярия оформляет окружную хартию."
 VAD_oath_pending_commandant:0 "Штаб размещает комендатуру."
 VAD_oath_idle:0 "Канцелярия свободна для новой заявки."
 VAD_oath_cancellation_tt:0 "Потеря области, капитуляция, подчинение или завершение гражданского конфликта отменят заявку с полным возвратом оплаты. При объединении возврат получает Воркерланд."
 VAD_charter_unlock_tt:0 "Окружные хартии расширяют местный призыв и укрепляют легитимность."
 VAD_commandant_unlock_tt:0 "Комендатуры расширяют местный призыв и доступ к фабрикам, но накапливают недовольство. Порядок можно восстановить отдельной операцией либо отозвать комендатуру."
 VAD_charter_programme_tt:0 "Хартия даст области §G+20%§! местных рекрутов, добавит §G0.03§! легитимности и сдвинет баланс на §Y15%§! к канцелярии."
 VAD_commandant_programme_tt:0 "Комендатура даст области §G+10%§! местных рекрутов и §G+15%§! фабричной мощности, отнимет §R0.02§! легитимности и сдвинет баланс на §Y15%§! к штабу. Комендатура начнёт с §Y20/100§! недовольства; месячный прирост зависит от баланса штаба и канцелярии. При §R100§! начинается местное восстание."
 VAD_give_the_staff_priority:0 "Передать приоритет армейскому штабу"
 VAD_give_the_staff_priority_desc:0 "Полевые командиры требуют отвечать на донесения до окончания канцелярских согласований. Петричев разрешает штабу первым распределять людей и транспорт."
 VAD_hear_the_district_petitions:0 "Рассмотреть петиции окружных управ"
 VAD_hear_the_district_petitions_desc:0 "Окружные управы присылают списки спорных реквизиций и людей, которых забрали вопреки прежним обязательствам. Канцелярия потребует от штаба сверить приказы с реестрами."
