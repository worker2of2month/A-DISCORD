 ADISCORD_vorkerland_postwar.31.t:0 "Графа для имени"
 ADISCORD_vorkerland_postwar.31.d:0 "В первой послевоенной ведомости не сошлись два столбца. В округ направили сорок человек, в лабораторном журнале числилось тридцать девять. Секретарь принёс лист Уорксу, ожидая распоряжения о поисках. Доктор попросил проверить сумму ещё раз.\n\nНа обороте оказалось письмо. Женщина спрашивала, можно ли передать мужу зимнюю одежду: он уехал по ведомственному предписанию ещё до окончания войны. Уоркс прочитал первую строку и перевернул страницу обратно. Его интересовало, почему пропавший человек продолжал получать довольствие.\n\nСекретарь назвал фамилию. Доктор поднял глаза: \"Я запомнил. Но в чём состоит вопрос?\" Вопроса, пригодного для этой ведомости, секретарь не нашёл. Между номером направления и графой расхода оставалось достаточно места, чтобы вписать имя."
 ADISCORD_vorkerland_postwar.31.a:0 "Положить письмо рядом с ведомостью."
 ADISCORD_vorkerland_postwar.31.b:0 "Внести имя и передать письмо в округ."
 WRK_worx_story_madness_plus_5_tt:0 "Безумие Уоркса: §R+5§!."
 ADISCORD_vorkerland_postwar.31.c:0 "Оставить только регистрационный номер."
 WRK_worx_story_madness_minus_5_tt:0 "Безумие Уоркса: §G-5§!."
 ADISCORD_vorkerland_postwar.32.t:0 "Лампа в крайнем окне"
 ADISCORD_vorkerland_postwar.32.d:0 "В здании директории меняли ночную охрану, а в крайнем окне третьего этажа всё ещё горел свет. Уоркс сидел перед тремя одинаковыми отчётами. На каждом красным карандашом было обведено слово \"приостановлено\".\n\nНа вопрос о сне он ответил вполне спокойно. Во время войны люди обещали продолжить работу после победы. Теперь победа состоялась, а продолжать они почему-то не собирались. Каждая пауза означала, что завтра придётся снова убеждать их в очевидном. Завтра терять нельзя.\n\nСекретарь предложил убрать со стола хотя бы две копии. Доктор прижал их ладонью. Он знал, что это копии: номера страниц и пятно на последнем листе совпадали. Просто ему было легче, когда обещание существовало в трёх экземплярах."
 ADISCORD_vorkerland_postwar.32.a:0 "Закрыть дверь потише."
 ADISCORD_vorkerland_postwar.32.b:0 "Оставить ночную смену только для неотложных работ."
 WRK_worx_story_madness_plus_3_tt:0 "Безумие Уоркса: §R+3§!."
 ADISCORD_vorkerland_postwar.32.c:0 "Организовать постоянную передачу сводок."
 WRK_worx_story_madness_minus_8_tt:0 "Безумие Уоркса: §G-8§!."
 ADISCORD_vorkerland_postwar.33.t:0 "Другим почерком"
 ADISCORD_vorkerland_postwar.33.d:0 "На утреннем совещании Уоркс положил перед заведующим две страницы. На первой предлагалось повторить измерение. На второй повторение объявлялось бессмысленной задержкой. Доктор спросил, кто изменил заключение.\n\nЗаведующий долго смотрел на край стола. Обе резолюции были написаны Уорксом. Первую он поставил позавчера, вторую - ночью. Секретарь сохранил входящие номера, чтобы не потерять ни одного распоряжения. Теперь именно эта аккуратность делала положение невыносимым.\n\nДоктор сравнил наклон букв. Он не отрицал своего почерка. \"Значит, между этими записями мне предоставили другие сведения\". Никто не смог назвать эти сведения. Уоркс велел искать, и совещание продолжилось уже без заведующего."
 ADISCORD_vorkerland_postwar.33.a:0 "Оба листа останутся в деле."
 ADISCORD_vorkerland_postwar.33.b:0 "Проверить исходные данные независимо от резолюций."
 ADISCORD_vorkerland_postwar.33.c:0 "Признать раннюю резолюцию недействительной."
 ADISCORD_vorkerland_postwar.34.t:0 "Не выключать"
 ADISCORD_vorkerland_postwar.34.d:0 "Во время остановки генератора доктор первым заметил не темноту, а тишину. Перестала гудеть вентиляция, исчезли шаги у двери, замолчал регистратор. Он поднялся из-за стола и потребовал узнать, кто отдал приказ.\n\nЭлектрик объяснял, что меняют повреждённый кабель. Уоркс слушал, пока тот не произнёс: \"Так безопаснее для людей\". После этого доктор потребовал список тех, кто находился у рубильника. Техническую причину он понимал. Непереносимым было другое: несколько человек договорились между собой, и целая система остановилась без его разрешения.\n\nСвет вернулся через восемь минут. Уоркс не сел. Он стоял у двери лаборатории, прислушиваясь к приборам, и каждые несколько секунд спрашивал, все ли линии работают. Электрик ждал разрешения уйти. Его фамилию уже записали."
 ADISCORD_vorkerland_postwar.34.a:0 "Генератор снова работает."
 ADISCORD_vorkerland_postwar.34.b:0 "Подтвердить право инженеров останавливать неисправные линии."
 WRK_worx_story_madness_plus_8_tt:0 "Безумие Уоркса: §R+8§!."
 ADISCORD_vorkerland_postwar.34.c:0 "Потребовать личного согласования всех остановок."
 WRK_worx_story_madness_minus_10_tt:0 "Безумие Уоркса: §G-10§!."
 ADISCORD_vorkerland_postwar.35.t:0 "После первой серии"
 ADISCORD_vorkerland_postwar.35.d:0 "Результаты первой оплаченной серии принесли в папке без названия. Уоркс дочитал таблицу до конца, вернулся к началу и впервые за несколько дней попросил чай. Он даже поинтересовался, успевает ли ночная смена получать горячее питание.\n\nВрач, сопровождавшая отчёт, решила воспользоваться этой переменой. Она начала рассказывать о человеке, который после испытаний не узнавал дорогу к своему общежитию. Доктор остановил её не сразу. Он спросил, было ли такое поведение до начала серии. Врач ответила, что в прежней карточке этого нет.\n\n\"Тогда это результат\", - сказал Уоркс и придвинул к себе папку. На следующей странице уже были расчерчены графы новой работы. Чай так и остался у секретаря в руках."
 ADISCORD_vorkerland_postwar.35.a:0 "Папка принята."
 ADISCORD_vorkerland_postwar.36.t:0 "Привыкание"
 ADISCORD_vorkerland_postwar.36.d:0 "Третью завершённую серию принял дежурный референт. Он проверил подписи, поставил дату и указал на полку: остальные материалы уже были там. Врач помнила, как ещё недавно такие папки относили доктору лично. Теперь они занимали место между расходом реактивов и заявками на бельё.\n\nУоркс появился ближе к вечеру. Результаты он похвалил, но читать стал с раздела ограничений. Слишком узкая выборка. Слишком короткий срок. Недостаточно оснований для общего вывода. Никто не обещал общего вывода, однако спорить с этим оказалось невозможно.\n\nНа полях осталась аккуратная запись: расширить наблюдение. Врач спросила, сколько ещё потребуется людей. Доктор ответил: \"Столько, чтобы не пришлось повторять этот разговор\"."
 ADISCORD_vorkerland_postwar.36.a:0 "Расширить наблюдение."
 ADISCORD_vorkerland_postwar.37.t:0 "Достаточных данных не существует"
 ADISCORD_vorkerland_postwar.37.d:0 "К шестой серии секретарь научился отличать спокойные дни доктора по звуку карандаша. В спокойные дни Уоркс подчёркивал строки. В остальные прокалывал бумагу, задерживаясь на одном месте.\n\nСегодня бумага выдержала. Все показатели легли в предложенную модель, даже с запасом. Руководитель группы позволил себе сказать, что работа, вероятно, завершена. Карандаш остановился. Доктор спросил, не подбирали ли исполнители данные под ожидаемый ответ.\n\nОшибку можно было исправить новым испытанием. Совпадение требовало проверки честности исполнителей. Секретарь понял это раньше остальных и молча принёс чистые бланки. Уоркс кивнул ему с благодарностью. Именно так, по его мнению, и должна была работать хорошая команда."
 ADISCORD_vorkerland_postwar.37.a:0 "Подготовить следующую серию."
 ADISCORD_vorkerland_postwar.38.t:0 "Результат со знаком минус"
 ADISCORD_vorkerland_postwar.38.d:0 "Повторная проверка не подтвердила вывод. Молодой сотрудник сформулировал это на первой странице, без обычного перечня оговорок. Заведующий предлагал убрать фразу в приложение. Сотрудник отказался: тогда первые двадцать страниц будут описывать то, чего не было.\n\nУоркс прочитал работу стоя. Попросил показать журнал, затем вторую копию, затем сам пересчитал один столбец. Ошибки не оказалось. \"Вы понимаете, что этим отменяете полгода?\" Сотрудник ответил, что отменить можно вывод; полгода уже случились.\n\nДоктор сел. Впервые за всё совещание он не знал, каким распоряжением закончить разговор. На столе лежала работа, выполненная точно по его требованиям, и именно поэтому она ему мешала."
 ADISCORD_vorkerland_postwar.38.a:0 "Оставить заключение на столе."
 ADISCORD_vorkerland_postwar.38.b:0 "Разослать методику вместе с отрицательным результатом."
 ADISCORD_vorkerland_postwar.38.c:0 "Закрыть доступ до дополнительного согласования."
 ADISCORD_vorkerland_postwar.39.t:0 "Тот, кто выключает свет"
 ADISCORD_vorkerland_postwar.39.d:0 "Уборщица приходила после полуночи. Раньше Уоркс отодвигал стул, чтобы она могла вымыть пол у стола. Теперь просил подождать в коридоре. Иногда до утра.\n\nОднажды она всё-таки вошла. На полу лежали вырванные листы, на столе стояли чашки с нетронутым чаем. Доктор спросил, зачем она каждую ночь приходит в одно и то же время. Женщина показала расписание. Его подпись стояла в правом нижнем углу.\n\nУоркс долго смотрел на подпись, затем объяснил, что работа учреждения не может зависеть от чужого распорядка. Он говорил вежливо и подробно, как на лекции. Женщина держала ведро обеими руками. В конце он попросил её не выключать свет, даже когда кабинет будет пуст."
 ADISCORD_vorkerland_postwar.39.a:0 "Свет останется включённым."
 ADISCORD_vorkerland_postwar.40.t:0 "Неисследовательский случай"
 ADISCORD_vorkerland_postwar.40.d:0 "В окружной клинике наконец заработал аппарат, три месяца простоявший без деталей. Первым к нему подвели пожилого слесаря. Он спрашивал не о прогнозе, а о том, когда сможет снова подниматься по лестнице к себе домой.\n\nВрач внесла в отчёт количество принятых больных и отправила копию в директорию. Уоркс вернул её с вопросом: где сравнительная группа? Врач написала, что лечила людей. Для этого не требовалось оставлять часть пациентов без помощи.\n\nВ ответ пришло замечание о нецелевом использовании оборудования. Под ним, другим почерком, было разрешение продолжать приём до отдельного распоряжения. На следующее утро слесарь пришёл сам. Поднялся медленно, остановился на площадке и попросил вернуть ему пальто."
 ADISCORD_vorkerland_postwar.40.a:0 "Открыть приём на завтра."
 ADISCORD_vorkerland_postwar.40.b:0 "Подтвердить приоритет лечения."
 ADISCORD_vorkerland_postwar.40.c:0 "Подготовить для доктора отдельную сводку наблюдений."
 ADISCORD_vorkerland_postwar.41.t:0 "Обратный билет"
 ADISCORD_vorkerland_postwar.41.d:0 "В выписном листе было написано: годен к возвращению. Солдат прочитал эту строку трижды и спросил, куда именно. Медсестра сначала решила, что он плохо видит. Потом поняла, что за последние годы это слово всегда означало фронт.\n\nНачальник восстановительного отделения пришёл в директорию с итогами программы. Уоркс спросил, почему в отчёте отдельно отмечены люди, не возвращённые в части. Начальник ответил, что некоторые вернулись домой. Доктор подождал продолжения. Продолжения не было.\n\nУ железнодорожной кассы солдат нашёл в кармане больничную бирку. Выбрасывать её почему-то не решился. Кассирша спросила фамилию, и он ответил раньше, чем успел вспомнить номер."
 ADISCORD_vorkerland_postwar.41.a:0 "Билет в один конец. Домой."
 ADISCORD_vorkerland_postwar.42.t:0 "После команды"
 ADISCORD_vorkerland_postwar.42.d:0 "Испытательная группа выполнила упражнение быстрее штатного подразделения. В акте это занимало первую строку. Оставшиеся строки описывали расход имущества и выбытие участников. Уоркс прочитал первую и попросил повторить её вслух.\n\nОфицер стоял напротив стола, держа фуражку за козырёк. Он сообщил, что одному из вернувшихся всё ещё приходится напоминать об окончании упражнения. Тот встаёт при каждом резком звуке и ждёт команду, которой никто не отдаёт. Доктор спросил, насколько точно он её выполняет.\n\nОфицер посмотрел на дверь. За ней ждал этот человек, аккуратно застёгнутый и выбритый. Уоркс предложил считать наблюдение дополнительным успехом программы. Фуражка в руках офицера согнулась, и он поспешно расправил козырёк."
 ADISCORD_vorkerland_postwar.42.a:0 "Внести замечание в акт."
 ADISCORD_vorkerland_postwar.43.t:0 "Три ступени"
 ADISCORD_vorkerland_postwar.43.d:0 "В восстановленном доме между входной дверью и лифтом оставались три ступени. По проекту они не считались препятствием: высота каждой укладывалась в норматив. Жильцы третьего этажа написали, что не могут спустить коляску без помощи соседей.\n\nПисьмо попало к Уорксу вместе с отчётом о заселении. Он сначала проверил размеры, затем попросил принести фотографию. На ней мужчина держал дверь, женщина стояла у коляски, а между ними помещалась маленькая, безупречно построенная лестница.\n\nДоктор велел добавить пандус. Секретарь уже записывал распоряжение, когда Уоркс спросил, сколько ещё таких случаев не попало в модель. Он не злился на жильцов. Это тревожило секретаря сильнее: доктор говорил так, будто сам мир скрывал от него нужные данные."
 ADISCORD_vorkerland_postwar.43.a:0 "Добавить пандус в проект."
 ADISCORD_vorkerland_postwar.44.t:0 "Что видно сквозь стекло"
 ADISCORD_vorkerland_postwar.44.d:0 "Новый порядок доступа к лабораторным журналам обсуждали без доктора. Одни предлагали открыть записи коллегам, другие требовали оставить полную картину только у руководителя. К вечеру распоряжение уже вступило в силу.\n\nУоркс прошёл вдоль лабораторных окон. За каждым кто-то работал, и ни одно не показывало всего, что происходило внутри."
 ADISCORD_vorkerland_postwar.44.a:0 "Порядок доступа утверждён."
 ADISCORD_vorkerland_postwar.44.glass:0 "На общей доске вывесили два несовпадающих графика. Раньше один сняли бы до прихода доктора. Теперь рядом лежал журнал измерений, и сотрудники соседней лаборатории приходили сверять собственные записи.\n\nУоркс остановился у доски. Ему объяснили, откуда взялось расхождение, не предлагая сразу виновного. Разговор продолжался почти час. Доктор несколько раз пытался закончить его распоряжением, но каждый раз кто-нибудь задавал ещё один вопрос.\n\nКогда он ушёл, графики остались на месте. Секретарь заметил, что никто не побежал снимать их вслед за ним. Прозрачные стены не сделали доктора другим человеком. Они позволили остальным не оставаться с ним поодиночке."
 ADISCORD_vorkerland_postwar.44.boxes:0 "В журнале первой лаборатории человек числился выбывшим. Во второй - поступившим. Между этими записями отсутствовало двое суток. Заведующие не могли сопоставить даты: каждому разрешалось читать только собственный раздел.\n\nПолные журналы принесли Уорксу. Он разложил их по столу и отметил, что система разделения доступа работает. Никто, кроме него, не располагал достаточными сведениями, чтобы сделать неверный общий вывод.\n\nСекретарь спросил, кому исправлять пропущенные даты. Доктор сказал, что разберётся лично. К вечеру журналы остались у него; заведующие получили новые задания. На единственном столе, где можно было восстановить исчезнувшие двое суток, уже не хватало места."
 ADISCORD_vorkerland_postwar.45.t:0 "Родственные обстоятельства"
 ADISCORD_vorkerland_postwar.45.d:0 "Начальник снабжения попросил исключить из очередного списка своего брата. Он принёс медицинскую справку, подтверждение работы и письмо окружного директора. Документы были настоящими. Уоркс проверил каждую подпись.\n\nЗатем он спросил, почему начальник не прикладывал такие документы к остальным спискам. Тот начал объяснять, что раньше не знал личных обстоятельств. Доктор кивнул: именно поэтому личные обстоятельства не должны влиять на порядок работы.\n\nСправку вернули без резолюции. Начальник забрал её обеими руками, словно бумага могла рассыпаться. Уоркс проводил его взглядом и сказал секретарю, что сегодня удалось пресечь проявление привилегий. Он произнёс это с искренним удовлетворением."
 ADISCORD_vorkerland_postwar.45.a:0 "Исключений не будет."
 ADISCORD_vorkerland_postwar.46.t:0 "В присутствии свидетеля"
 ADISCORD_vorkerland_postwar.46.d:0 "Женщине предложили назвать номер дела. Она назвала фамилию мужа. Секретарь комиссии начал повторять вопрос, но председатель остановил его и попросил записать фамилию.\n\nУоркс сидел у края стола. Он пришёл с папкой технических обоснований и несколько раз пытался уточнить, какое именно решение комиссия считает ошибочным. Женщина не говорила об ошибке. Она рассказывала, что муж боялся опоздать на ведомственный автобус и поэтому вышел из дома без завтрака.\n\nЭта подробность не относилась ни к одному пункту повестки. Доктор ждал, пока её уберут из протокола. Председатель велел оставить. Впервые чужой рассказ продолжался в присутствии Уоркса, не превращаясь в ответ на его вопрос."
 ADISCORD_vorkerland_postwar.46.a:0 "Записать без сокращений."
 ADISCORD_vorkerland_postwar.47.t:0 "Дубликат ключа"
 ADISCORD_vorkerland_postwar.47.d:0 "Новый пропуск доктора открывал его кабинет, библиотеку и два исследовательских зала. Дверь административного архива на него не реагировала. Уоркс приложил карточку ещё раз, затем позвал дежурного.\n\nДежурный проверил список и предложил оформить доступ через комиссию. Доктор спросил фамилию составителя. Сотрудник назвал её и не отошёл от двери. За его спиной висела инструкция с подписями нескольких директоров. Для подписи Уоркса места в ней не было.\n\nЧерез час он вернулся в кабинет и начал работать над расчётом. Секретарь услышал знакомое: \"Нужно будет пересмотреть порядок\". На этот раз он записал фразу в журнал предложений. До конца рабочего дня больше ничего не произошло."
 ADISCORD_vorkerland_postwar.47.a:0 "Заявление рассмотрят в установленном порядке."
 ADISCORD_vorkerland_postwar.48.t:0 "Страна помещается на столе"
 ADISCORD_vorkerland_postwar.48.d:0 "Карта занимала весь стол для совещаний. В каждом округе отметили население, производство и число учреждений, которым ещё требовалась проверка. Уоркс снял со стены портрет, чтобы на его место повесить дополнительную таблицу.\n\nНа доклад о жалобах он отреагировал неожиданно мягко. Люди не виноваты в том, что не понимают устройства будущего, сказал он. Их учат сохранять привычки, защищать близких, доверять собственным ощущениям. Было бы ненаучно требовать другого поведения без предварительного изменения условий.\n\nОн предложил больше не спорить с каждым человеком по отдельности. Секретарь спросил, как назвать новый порядок. Уоркс посмотрел на карту, где не осталось ни одного пустого места: \"Нормальным\"."
 ADISCORD_vorkerland_postwar.48.a:0 "Утвердить норму."
 ADISCORD_vorkerland_postwar.49.t:0 "Чужая подпись"
 ADISCORD_vorkerland_postwar.49.d:0 "После западного урегулирования в директорию привезли документы на бумаге трёх разных размеров. Уоркс попросил привести их к единому формату. Представитель одной из республик заметил, что подписи нельзя перенести на другой лист.\n\nДоктор поднял взгляд. Война или переговоры завершились, но чужая подпись всё ещё ограничивала то, что он мог сделать. Он попросил секретаря ещё раз прочитать условия."
 ADISCORD_vorkerland_postwar.49.a:0 "Прочитать условия полностью."
 ADISCORD_vorkerland_postwar.49.civil:0 "Представитель западной республики привёз подписанный устав и перечень полномочий местного совета. Уоркс задержался на праве совета отклонять ведомственные заявки. Он назвал это источником непредсказуемости.\n\nПредставитель согласился: заранее неизвестно, какой ответ даст другое правительство. Именно поэтому и существует соглашение. Секретарь приготовился исправлять формулировку, но Уоркс молча перелистнул страницу.\n\nПосле встречи доктор попросил представить три сценария на случай отказа. Впервые отказ соседнего правительства попал в расчёт как допустимое событие. Предполагать, что Уоркс его полюбил, никто не собирался."
 ADISCORD_vorkerland_postwar.49.administrative:0 "Представитель технической подопечной территории привёз список местных специалистов. Уоркс поставил рядом с фамилиями номера учреждений. Представитель спросил, кто будет согласовывать перевод людей из одного округа в другой.\n\nДоктор указал на новый координационный орган. Тот ещё не располагал помещением, зато уже принимал заявки. На вопрос о семьях Уоркс предложил дополнить анкету. Представитель хотел сказать что-то ещё, но секретарь уже протянул ему следующий лист.\n\nВ отчёте о встрече написали, что технические разногласия урегулированы. На выходе представитель спросил у дежурного, куда здесь подают возражения. Дежурный показал на ту же дверь."
 ADISCORD_vorkerland_postwar.50.t:0 "Последний незаполненный лист"
 ADISCORD_vorkerland_postwar.50.d:0 "В годовом отчёте оставили одну пустую страницу. Раньше её занимало обращение руководителя. Теперь секретарь не знал, какую из черновых версий считать окончательной.\n\nУоркс долго смотрел на чистую бумагу. За окном начиналась смена, люди пересекали двор по своим делам. Ни один не двигался точно по линии, проведённой на схеме проходов. Доктор взял карандаш."
 ADISCORD_vorkerland_postwar.50.a:0 "Продолжить работу."
 ADISCORD_vorkerland_postwar.50.council:0 "Проект годового отчёта вернули доктору с замечаниями. Одно предложение вычеркнули, другое перенесли в приложение. Уоркс положил лист поверх расчётов и долго не притрагивался к нему.\n\nЗа стеклом работала лаборатория. Сотрудники спорили, кто-то смеялся, кто-то собирался домой. Доктор мог войти и задать вопрос. Он больше не мог приказать, чтобы спор закончился нужным ему ответом.\n\nПод вечер секретарь получил исправленный текст. На полях стояло: \"С выводом не согласен\". Ни угрозы, ни распоряжения внизу не было. Страна не вылечила Уоркса и не заставила его полюбить людей. Она научилась жить с его несогласием, не отдавая ему себя целиком."
 ADISCORD_vorkerland_postwar.50.quiet:0 "В этот раз годовой отчёт приняли без исправлений. Производство восстановилось, учреждения исполняли распоряжения, свежие результаты поступали вовремя. Уоркс говорил тихо и почти доброжелательно. Секретарь поймал себя на том, что считает этот день хорошим.\n\nПотом принесли список следующей программы. Доктор поставил подпись, не прерывая разговора о ремонте городской библиотеки. Эти решения ничуть не противоречили друг другу в его глазах. Людям следовало читать книги, жить в исправных домах и предоставлять системе необходимый материал.\n\nУходя, секретарь заглянул на последнюю страницу отчёта. Там было написано: \"Условия стабилизированы\". Впервые ему захотелось, чтобы в документе нашлась ошибка."
 ADISCORD_vorkerland_postwar.50.crisis:0 "К годовому отчёту приложили справку: основные показатели выполнены. Уоркс зачеркнул слово \"основные\". Оно означало, что кто-то заранее решил, какими отклонениями можно пренебречь.\n\nОн велел собрать заведующих, затем отменил совещание: подготовленные ответы ничего не докажут. Потребовал первичные журналы, потом распорядился не переносить их из лабораторий: при переносе можно заменить листы. Секретарь стоял у двери с двумя несовместимыми поручениями и ждал третьего.\n\nЗа окном начиналась смена. На схеме проходов люди двигались прямыми линиями. Во дворе они останавливались, разговаривали и обходили лужи. Доктор подвёл карандашом новую черту. Последний лист больше не был пустым."
 ADISCORD_vorkerland_postwar.32.after:0 "В здании директории меняли ночную охрану, а в крайнем окне третьего этажа всё ещё горел свет. Уоркс сидел перед тремя одинаковыми отчётами. На каждом красным карандашом было обведено слово \"приостановлено\".\n\nНа вопрос о сне он ответил вполне спокойно. Во время войны люди обещали продолжить работу после победы. Теперь победа состоялась, а продолжать они почему-то не собирались. Каждая пауза означала, что завтра придётся снова убеждать их в очевидном. Завтра терять нельзя.\n\nСекретарь предложил убрать со стола хотя бы две копии. Доктор прижал их ладонью. Он знал, что это копии: номера страниц и пятно на последнем листе совпадали. Просто ему было легче, когда обещание существовало в трёх экземплярах.\n\nЭту запись секретарь передал комиссии уже после ограничения личных полномочий доктора. Восстановить события пришлось по журналу дежурств: отдельного распоряжения Уоркс не оставил."
 ADISCORD_vorkerland_postwar.33.after:0 "На утреннем совещании Уоркс положил перед заведующим две страницы. На первой предлагалось повторить измерение. На второй повторение объявлялось бессмысленной задержкой. Доктор спросил, кто изменил заключение.\n\nЗаведующий долго смотрел на край стола. Обе резолюции были написаны Уорксом. Первую он поставил позавчера, вторую - ночью. Секретарь сохранил входящие номера, чтобы не потерять ни одного распоряжения. Теперь именно эта аккуратность делала положение невыносимым.\n\nДоктор сравнил наклон букв. Он не отрицал своего почерка. \"Значит, между этими записями мне предоставили другие сведения\". Никто не смог назвать эти сведения. Уоркс велел искать, и совещание продолжилось уже без заведующего.\n\nЭту запись секретарь передал комиссии уже после ограничения личных полномочий доктора. Восстановить события пришлось по журналу дежурств: отдельного распоряжения Уоркс не оставил."
 ADISCORD_vorkerland_postwar.34.after:0 "Во время остановки генератора доктор первым заметил не темноту, а тишину. Перестала гудеть вентиляция, исчезли шаги у двери, замолчал регистратор. Он поднялся из-за стола и потребовал узнать, кто отдал приказ.\n\nЭлектрик объяснял, что меняют повреждённый кабель. Уоркс слушал, пока тот не произнёс: \"Так безопаснее для людей\". После этого доктор потребовал список тех, кто находился у рубильника. Техническую причину он понимал. Непереносимым было другое: несколько человек договорились между собой, и целая система остановилась без его разрешения.\n\nСвет вернулся через восемь минут. Уоркс не сел. Он стоял у двери лаборатории, прислушиваясь к приборам, и каждые несколько секунд спрашивал, все ли линии работают. Электрик ждал разрешения уйти. Его фамилию уже записали.\n\nЭту запись секретарь передал комиссии уже после ограничения личных полномочий доктора. Восстановить события пришлось по журналу дежурств: отдельного распоряжения Уоркс не оставил."
 WKR_measured_republic_dynamic:0 "Республика измеримого результата"
 WKR_measured_republic_dynamic_desc:0 "Мандат Бэгли подтверждается работающими цехами, исполненными распоряжениями и сохранёнными жизнями. Производственные нормы и военная доктрина становятся частями одного порядка."
 WKR_programme_slot_tt:0 "Предыдущий государственный заказ завершён или отменён."
 WKR_programme_order_tt:0 "Заказ получает [ROOT.GetName]. Капитуляция, утрата самостоятельности или завершение гражданской войны отменяют заказ с полным возвратом оплаты. При объединении возврат получает восстановленный Воркерланд."
 WRK_prewar_programmes_tt:0 "Бюджет, политические опоры и судьба правительства определяют подготовку к распаду. Материальные проекты доступны в решениях подготовки."
 WKR_rifle_contract:0 "Заказать серию унифицированных винтовок"
 WKR_rifle_contract_desc:0 "В мастерских слишком много несовместимых деталей. Общая ведомость заказа должна превратить отдельные партии оружия в настоящий серийный выпуск."
 WKR_staff_course:0 "Провести курсы оперативного расчёта"
 WKR_staff_course_desc:0 "Начальники штабов разбирают одни и те же донесения, пока разные карты не начинают рассказывать об одной войне."
 WKR_support_contract:0 "Заказать полевые комплекты снабжения"
 WKR_support_contract_desc:0 "Роты просят не только винтовки. Связь, перевязочный материал и инструмент должны попасть в те же накладные, что и боеприпасы."
 WKR_workshop_contract:0 "Расширить военные мастерские Воркерленда"
 WKR_workshop_contract_desc:0 "Пустой пролёт заводского корпуса ещё не является цехом. Поставщики и мастера собираются у одного стола, чтобы наконец превратить план в рабочие места."
 WKR_ration_contract:0 "Организовать снабжение рабочих кварталов"
 WKR_ration_contract_desc:0 "На воротах вывешивают расписание подвоза. Люди будут судить о новой ведомости по тому, доедут ли телеги до последней улицы."
 WKR_rail_contract:0 "Собрать ночной железнодорожный эшелон"
 WKR_rail_contract_desc:0 "Ночью на станциях зажигают закрытые фонари. Диспетчер должен провести состав через узлы, где ещё вчера каждый подчинялся собственному начальству."
 WKR_artillery_contract:0 "Заказать батареи расчётного огня"
 WKR_artillery_contract_desc:0 "Расчётная таблица получает смысл лишь рядом с исправным орудием. Заводы сверяют допуски, а артиллеристы принимают каждую партию по общей ведомости."
 WKR_pattern_contract:0 "Освоить закупленные промышленные чертежи"
 WKR_pattern_contract_desc:0 "Переводчики спорят с мастерами над обозначениями. Заимствованная схема должна заговорить на языке наших цехов."
 WRK_requisition_emergency_tools:0 "Изъять инструмент для аварийных работ"
 WRK_requisition_emergency_tools_desc:0 "Комиссия вскрывает складские книги и выслушивает возражения владельцев. Общая беда не делает раздел имущества бесспорным."
 WRK_finance_evacuation_stock:0 "Закупить имущество эвакуационных поездов"
 WRK_finance_evacuation_stock_desc:0 "Окружные казначеи сводят заявки станций. Вагоны должны прийти с инструментом и исправной оснасткой, а не с одними обещаниями."
 WRK_register_volunteer_reserve:0 "Записать добровольцев чрезвычайного резерва"
 WRK_register_volunteer_reserve_desc:0 "Комитеты обходят дома и сверяют списки желающих. Теперь за каждой фамилией должно стоять место сбора, а не чужая подпись."
 WRK_drill_emergency_staff:0 "Провести окружные командные сборы"
 WRK_drill_emergency_staff_desc:0 "Окружные офицеры собираются за общими картами. Старые границы полномочий приходится проговаривать вслух, прежде чем по ним пройдёт настоящий фронт."
 WRK_order_standard_tools:0 "Закупить стандартные комплекты мастерских"
 WRK_order_standard_tools_desc:0 "Инженеры вычёркивают редкие размеры из ведомости. То, что сломается далеко от главного завода, должно поддаваться ремонту на месте."

 # Western political mandate
 WKR_bop:0 "Западный чрезвычайный мандат"
 WKR_bop_chairman:0 "Председатель"
 WKR_bop_councils:0 "Фронтовые советы"
 WKR_bop_even:0 "Согласование полномочий"
 WKR_bop_chairman_influence:0 "Авторитет председателя"
 WKR_bop_chairman_dominance:0 "Мандат Первой революции"
 WKR_bop_councils_influence:0 "Влияние фронтового исполкома"
 WKR_bop_councils_dominance:0 "Большинство исполкома"
 WKR_administration_active_tt:0 "Западное правительство независимо, не капитулировало и продолжает гражданскую кампанию."
 WKR_presidential_course_tt:0 "Правит неоворкеристское правительство Никиты Уоркера или чрезвычайного комитета его сторонников."
 WKR_executive_course_tt:0 "Правит утилитаристский исполком Антона Бэгли."
 WKR_mandate_fixed_tt:0 "Закрепляет выбранный политический курс. Последующие сдвиги баланса сохранят свои модификаторы, но больше не сменят правительство."
 WKR_balance_mandate_tt:0 "Пока не завершён первый политический фокус, перевес от 60% на стороне председателя или исполкома меняет правительство. После закрепления мандата меняются только полномочия сторон."
 WKR_chairman_choice_tt:0 "Большинство поддержит курс Первой революции. Правительство возглавит Никита Уоркер, если он остался с западными силами; иначе - чрезвычайный комитет его сторонников."
 WKR_executive_choice_tt:0 "Большинство передаст правительство исполкому Антона Бэгли. Это открывает конституционный курс выдачи, отчётности и соглашений."
 WKR_rally_the_chairmans_delegates:0 "Собрать делегатов председателя"
 WKR_rally_the_chairmans_delegates_desc:0 "Заводские уполномоченные приносят в зал знамёна Первой революции. Для них председатель - обещание, которое не может отменить ни штабная сводка, ни новая норма выработки."
 WKR_convene_the_executive_session:0 "Созвать сессию исполкома"
 WKR_convene_the_executive_session_desc:0 "Представители фронтов и мастерских сверяют списки поставок. Исполком ищет опору в тех, кто готов отвечать перед соседними республиками за каждую подпись под общим договором."
 WKR_mandate_open_status:0 "Мандат ещё обсуждается. Перевес от 60% на стороне председателя или исполкома сменит правительство. Первый политический фокус закрепит курс."
 WKR_mandate_presidential_status:0 "Мандат Первой революции закреплён. Баланс определяет полномочия сторон, сохраняя выбранное правительство."
 WKR_mandate_executive_status:0 "Мандат исполкома закреплён. Баланс определяет полномочия сторон, сохраняя выбранное правительство."
 ADISCORD_vorkerland_claimant.1.c:0 "Принятый мандат остаётся в силе."
 ADISCORD_vorkerland_claimant.5.t:0 "Мандат председателя"
 ADISCORD_vorkerland_claimant.5.nikita.d:0 "Когда председатель поднимается к трибуне, шум в зале ещё не стихает. Делегаты успели предъявить друг другу слишком много долгов, чтобы принять возвращение старого имени за готовый ответ. Но голосование состоялось: фронтовые советы поручают Никите Уоркеру собрать западные силы вокруг обещания Первой революции.\n\nНа столе остаются ведомости исполкома. Теперь подпись под ними снова ставит председатель."
 ADISCORD_vorkerland_claimant.5.legacy.d:0 "Кресло председателя остаётся пустым. Одни делегаты говорят о долге перед его именем, другие - о революции, которой нельзя позволить исчезнуть вместе с человеком. За окнами продолжается война, и ожидание давно стало такой же роскошью, как полные склады.\n\nБольшинство передаёт полномочия чрезвычайному комитету. Его члены правят от имени наследия Уоркера, обещая довести начатую революцию до конца. Никто не занимает пустое кресло; перед ним ставят ещё один стол."
 ADISCORD_vorkerland_claimant.5.a:0 "От имени Первой революции."
 ADISCORD_vorkerland_claimant.6.t:0 "Исполком принимает правительство"
 ADISCORD_vorkerland_claimant.6.d:0 "Антон Бэгли приносит на заседание не новую клятву, а папку согласованных ведомостей. Представители мастерских узнают в ней свои заказы, железнодорожники - спорные эшелоны, фронтовые делегаты - обещанные поставки. Впервые эти списки подписаны одними и теми же людьми.\n\nБольшинство советов передаёт правительство исполкому. Бэгли обещает судить власть по исполненным обязательствам. Знамёна остаются в зале, но следующий спор начинается уже с того, кто будет отвечать за недостающие вагоны."
 ADISCORD_vorkerland_claimant.6.a:0 "Ответственность подтверждается делом."

 # Railway councils
 WKR_organize_railway_council:0 "Железнодорожный совет: [FROM.GetName]"
 WKR_organize_railway_council_desc:0 "На узловой станции сходятся заводские эшелоны, воинские поезда и просьбы местных складов. Совет из диспетчеров, путейцев и фронтовых делегатов разберёт накопившиеся ведомости и согласует работу смен. Соседним частям больше не придётся искать начальника станции по чужим штабам."
 WKR_railway_council:0 "Железнодорожный совет"
 WKR_railway_council_desc:0 "Диспетчеры и складские бригады работают по общей ведомости западных сил."
 WKR_railway_context_tt:0 "Западное правительство независимо, не капитулировало и продолжает гражданскую кампанию. В собственной полностью удерживаемой области есть узел снабжения."
 WKR_railway_slot_tt:0 "Общая очередь программ железнодорожных советов свободна."
 WKR_railway_target_tt:0 "В этой области ещё нет железнодорожного совета или незавершённой работы над ним."
 WKR_railway_unlock_tt:0 "Советы смогут наладить местное снабжение и движение частей в собственных областях с узлами снабжения."
 WKR_railway_programme_tt:0 "По завершении область получит железнодорожный совет до конца гражданской кампании. Он действует, пока мы полностью удерживаем область и располагаем её узлом снабжения."
 WKR_railway_cancellation_tt:0 "Утрата полного контроля или узла снабжения, капитуляция, подчинение и завершение кампании отменят незавершённую работу с полным возвратом оплаты. При объединении возврат получит Воркерланд, при аннексии - поглощающая страна. Готовый совет распускается при утрате области или завершении кампании; после возвращения области его можно создать заново за полную цену."
 WKR_railway_order_pending:0 "Оформляется железнодорожный совет. Оплачено: §Y[?WKR_railway_order_pp|0]§! £political_power_texticon §Y[?WKR_railway_order_manpower|0]§! £population_texticon §Y[?WKR_railway_order_support|0]§! £support_equipment_texticon §Y[?WKR_railway_order_trains|0]§! £train_texticon."
 WKR_railway_order_idle:0 "Общая очередь программ железнодорожных советов свободна."
 WKR_railway_cost:0 "§Y40§! £political_power_texticon §Y500§! £population_texticon §Y40§! £support_equipment_texticon §Y5§! £train_texticon"
 WKR_railway_cost_blocked:0 "§R40§! £political_power_texticon §R500§! £population_texticon §R40§! £support_equipment_texticon §R5§! £train_texticon"
 WKR_railway_cost_tooltip:0 "§Y40§! £political_power_texticon §Y500§! £population_texticon §Y40§! £support_equipment_texticon §Y5§! £train_texticon"

 WKR_supply_coalition_partner:0 "Вооружение союзника: [FROM.GetName]"
 WKR_supply_coalition_partner_desc:0 "Фронтовые делегаты приносят ведомости пустых складов и письма командиров. Наши заводские комитеты могут выделить партию союзным частям, чтобы соседний участок фронта не замолчал в разгар наступления."
 WKR_coalition_supply_context_tt:0 "Западное правительство продолжает гражданскую кампанию. Союзник не капитулировал, состоит в нашей коалиции и сражается на нашей стороне в одной войне."
 WKR_coalition_supply_unlock_tt:0 "Откроет передачу оружия участникам нашей коалиции, сражающимся в общей войне."
 WKR_coalition_supply_cost:0 "§Y25§! £political_power_texticon §Y1000§! £infantry_equipment_texticon §Y50§! £support_equipment_texticon"
 WKR_coalition_supply_cost_blocked:0 "§R25§! £political_power_texticon §R1000§! £infantry_equipment_texticon §R50§! £support_equipment_texticon"
 WKR_coalition_supply_cost_tooltip:0 "§Y25§! £political_power_texticon §Y1000§! £infantry_equipment_texticon §Y50§! £support_equipment_texticon"
 WKR_negotiate_republic_recognition:0 "Договор о независимости: [FROM.GetName]"
 WKR_negotiate_republic_recognition_desc:0 "Республиканские посланники привозят карты с разными границами и одинаковым страхом перед новым объединителем. Подписи под договором должны убедить обе делегации, что западное правительство готово жить рядом с соседями, которых уже не может считать своими округами."
 WKR_recognition_available_tt:0 "Фреалор или Республика Трумана существуют, независимы, не капитулировали и не воюют с нами. Нет действующего договора или неотвеченного предложения. Западное правительство продолжает гражданскую кампанию и располагает §Y50§! £political_power_texticon."
 WKR_recognition_unlock_tt:0 "Договор с каждой республикой укрепит легитимность западного правительства и сохранит независимость подписавшей стороны после нашей победы."
 WKR_recognition_offer_tt:0 "[FROM.GetName] получит предложение на 14 дней. При согласии мы заплатим §Y50§! £political_power_texticon и получим §G+0.04§! к легитимности; обе стороны заключат пакт о ненападении. Подписавшая республика сохранит независимость при нашей победе. При отказе, истечении срока или утрате условий плата не списывается."
 WKR_recognition_cost:0 "§Y50§! £political_power_texticon при согласии"
 WKR_recognition_cost_blocked:0 "§R50§! £political_power_texticon при согласии"
 WKR_recognition_cost_tooltip:0 "§Y50§! £political_power_texticon списывается только после согласия другой стороны."
 WKR_independence_treaty_tt:0 "Западное правительство признает нашу независимость и заключит с нами пакт о ненападении. Если оно победит, объединённый Воркерланд сохранит договор и не потребует подчинения. Мы сохраним свой союз и сами решим судьбу собственных войн. Легитимность западного правительства увеличится на 0.04."
 ADISCORD_vorkerland_diplomacy.17.t:0 "Подписи вместо старых границ"
 ADISCORD_vorkerland_diplomacy.17.d:0 "Посланники западного правительства положили на стол короткий проект договора. В нём нет привычных ссылок на временный мятеж или обязанности бывшего округа: нашу республику называют независимой стороной. Делегация просит ответить тем же признанием и обещает, что после объединения центра этот документ останется в силе.\n\nВ канцелярии спорят о цене таких обещаний. Одни видят шанс закрыть старый спор, пока у западных комитетов ещё есть причины договариваться. Другие советуют дождаться конца войны: победитель всегда читает договоры иначе. За дверью уже ждёт секретарь с двумя чистыми экземплярами."
 ADISCORD_vorkerland_diplomacy.17.close:0 "Оставить проект без подписи."
 ADISCORD_vorkerland_diplomacy.17.accept:0 "Признать друг друга."
 WKR_recognition_targets_tt:0 "Есть хотя бы одна независимая республика, с которой можно заключить договор."

 # Imperial restoration and succession variants
 WRK_empire_after_the_tribunal_worcker:0 "После трибунала"
 WRK_empire_after_the_tribunal_petrichev:0 "Корона победителя"
 WRK_empire_after_the_tribunal_desc_worcker:0 "Приговор исполнен, совет распущен, и армия ждёт слова нового правителя. Уоркер обещает единое государство без соправителей. Тень Петричева остаётся в штабах и казармах, и двору придётся с ней считаться."
 WRK_empire_after_the_tribunal_desc_petrichev:0 "Башня снова возвышается над столицей, но возвращение камня не вернуло прежнего порядка. Петричев принимает присягу от округов уже не как временный командующий. Им предстоит служить государству, чьи притязания больше границ военного округа."
 ADISCORD_vorkerland_empire_court_worcker:0 "Двор империи"
 ADISCORD_vorkerland_empire_court_petrichev:0 "Коронная служба"
 ADISCORD_vorkerland_empire_court_desc_worcker:0 "Двор председателя, единая партия и культ спасённого правителя. Сила двора растёт по мере завершения имперских программ."
 ADISCORD_vorkerland_empire_court_desc_petrichev:0 "Канцелярия Петричева превращает военное подчинение в постоянную государственную службу. Должность и земельное пожалование связывают округа с короной разными обязательствами."
 ADISCORD_vorkerland_empire_bop_worcker:0 "Тень Петричева"
 ADISCORD_vorkerland_empire_bop_petrichev:0 "Корона и мундир"
 ADISCORD_vorkerland_empire_bop_court_worcker:0 "Двор Уоркера"
 ADISCORD_vorkerland_empire_bop_court_petrichev:0 "Коронная канцелярия"
 ADISCORD_vorkerland_empire_category_worcker:0 "Тень Петричева"
 ADISCORD_vorkerland_empire_category_petrichev:0 "Корона и мундир"
 ADISCORD_vorkerland_empire_category_desc_worcker:0 "После казни Петричева двор Уоркера и офицерский корпус борются за влияние. Перевес двора даёт политическую власть, перевес офицеров - силу армии. Когда баланс достигает §Y80%§! в пользу корпуса, генералы готовят заговор."
 ADISCORD_vorkerland_empire_category_desc_petrichev:0 "Петричев объединил страну, но военные победители не хотят становиться обычными служащими. Канцелярия требует единого права, командиры защищают свои окружные полномочия. Перевес канцелярии усиливает гражданскую власть, перевес корпуса - армию. При §Y80%§! влияния корпуса генералы начинают готовить выступление против короны."
 WRK_empire_imperial_governors_desc_worcker:0 "Бывшие окружные регионы переходят под управление имперских наместников. Каждого наместника назначает лично председатель, и отвечает он только перед ним."
 WRK_empire_imperial_governors_desc_petrichev:0 "Окружные правительства уступают место наместникам короны. Петричев требует, чтобы присяга перестала быть соглашением между отдельными штабами: каждый назначенный наместник отвечает перед столицей за весь свой округ."
 WRK_empire_staff_without_petrishchev_worcker:0 "Генштаб без Петричева"
 WRK_empire_staff_without_petrishchev_petrichev:0 "Генштаб короны"
 WRK_empire_staff_without_petrishchev_desc_worcker:0 "Выдвиженцы Петричева уходят в отставку, их места занимают офицеры, обязанные карьерой председателю. Штаб теряет часть людей, но получает единое командование."
 WRK_empire_staff_without_petrishchev_desc_petrichev:0 "Штаб победившего округа становится генеральным штабом империи. Петричев сохраняет опытных командиров, но отделяет личную верность военачальнику от службы государству. Теперь приказы должны доходить до каждого корпуса по одной цепи."
 WRK_empire_tower_coronation_desc_worcker:0 "Министры, наместники и командующие присягают Уоркеру в Башне Единства. Власть председателя становится неоспоримой, а двор окончательно берёт верх над генералами."
 WRK_empire_tower_coronation_desc_petrichev:0 "В зале восстановленной Башни министры и командующие присягают Петричеву как носителю верховной власти. Корона перестаёт быть обещанием будущего: её право признали те, кто ещё недавно распоряжался округами по собственной воле."
 WRK_empire_veyran_order_desc_worcker:0 "Империя больше не живёт тенью трибунала. Двор и офицерский корпус встроены в единую систему управления, а имя Петричева стало историей, а не угрозой."
 WRK_empire_veyran_order_desc_petrichev:0 "Поход окончен, и коронная грамота становится основой мирного государства. Петричев закрепляет место канцелярии и армии в восстановленной империи. Округа больше не решают, признавать ли столицу; теперь они спорят о своём месте в общем порядке."
 WRK_empire_veyran_order_tt_worcker:0 "Тень Петричева рассеивается: баланс двора и офицерского корпуса снимается вместе с его бонусами и угрозой заговора."
 WRK_empire_veyran_order_tt_petrichev:0 "Баланс коронной канцелярии и офицерского корпуса снимается вместе с его бонусами и угрозой заговора. Назначение наместников остаётся доступно."
 ADISCORD_vorkerland_postwar.5.a_worcker:0 "Спаситель оказался лишним."
 ADISCORD_vorkerland_postwar.5.a_petrichev:0 "Восстановление обернулось империей."
 ADISCORD_vorkerland_postwar.5.t_worcker:0 "Уоркер казнил Петричева"
 ADISCORD_vorkerland_postwar.5.t_petrichev:0 "Петричев провозгласил империю"
 ADISCORD_vorkerland_postwar.5.d_worcker:0 "В первые недели после общей победы чрезвычайный совет перестал существовать. Влад Петричев, спасший Никиту Уоркера из-под обломков и разделивший с ним власть во время гражданской войны, был арестован собственной охраной. Закрытый трибунал обвинил его в подготовке военного переворота. По личному приказу Уоркера приговор привели в исполнение.\n\nПеред камерами появился изменившийся правитель: отросшая борода, тёмная одежда и холодное обещание покончить с раздробленностью. Уоркер провозгласил Мировую империю Воркерланда. Новая власть объявила этатизм основой государственного устройства, подчинила гражданские учреждения единому центру и потребовала от армии безусловной присяги.\n\nПервыми распоряжениями стали расширение арсеналов, массовый призыв и подготовка похода на Итору. Человек, которому Петричев когда-то сохранил жизнь, больше не намерен делить власть ни с кем."
 ADISCORD_vorkerland_postwar.5.d_petrichev:0 "После завершения урегулирования и восстановления Башни Единства Влад Петричев объявил о создании Мировой империи Воркерланда. Бывший командующий восточного округа принимает присягу от чиновников и офицеров, которые до недавнего времени представляли разные правительства.\n\nИмперский мандат продолжает курс, выбранный во время гражданской войны. Петричев остаётся во главе государства; канцелярия готовит новые назначения, а армия требует признания своих заслуг. Для одних победа означает возвращение общего права. Для других - право победителей распоряжаться страной.\n\nНа западе провозглашение встретили настороженно. Империя ещё не объявила следующую войну, но её название не оставляет соседям уверенности, что объединением бывших округов дело закончится."
 ADISCORD_vorkerland_postwar.60.d_worcker:0 "Офицеры, которые помнят Петричева, перестали скрывать раздражение. В штабах называют трибунал ошибкой, а двор Уоркера - собранием чиновников, не видевших фронта. Служба безопасности перехватила списки: несколько командиров корпусов готовы потребовать от председателя гарантий для армии, а при отказе вывести части на улицы столицы.\n\nУоркер может ударить первым и арестовать заговорщиков, рискуя ослабить армию накануне войны. Или он может купить лояльность генералов местами в имперском совете и новыми полномочиями штаба."
 ADISCORD_vorkerland_postwar.60.d_petrichev:0 "Офицеры, приведшие Петричева к победе, всё чаще называют канцелярию препятствием. Земельные пожалования и окружные назначения не утолили их притязаний: теперь они требуют права определять состав правительства. Контрразведка обнаружила договорённость нескольких командующих вывести части к столице, если корона отвергнет их условия.\n\nПетричев должен решить, чего стоит единство его победителей. Аресты покажут, что присяга не даёт права диктовать волю государю. Места в совете могут удержать армию от выступления, но превратят чрезвычайное требование генералов в постоянное право."
 ADISCORD_vorkerland_postwar.61.d_empire_worcker:0 "После капитуляции Иторы Никита Уоркер поднялся на Башню Единства и объявил, что имя Воркерланда принадлежит эпохе раздробленности. Государство берёт имя Вейранской империи - монархии, которую когда-то смела Первая революция. Гербы старой империи снова висят над министерствами, а западные регионы получают наместников вместо выборных советов.\n\nДля тех, кто помнит Петричева, это возвращение к прошлому, против которого они воевали. Для остальных - знак, что гражданская война закончилась и центр больше не намерен делиться властью."
 ADISCORD_vorkerland_postwar.61.d_empire_petrichev:0 "После капитуляции Иторы Влад Петричев объявил о восстановлении Вейранской империи. В Башне Единства снова зачитали титулы и названия земель, которые Первая революция пыталась оставить в прошлом. Для окружных командиров этот день стал завершением похода; для канцелярии - началом устройства новых владений.\n\nПетричев сохранил власть, полученную в гражданской войне, и распространил её на запад. Империи предстоит решить, станут ли победившие штабы опорой короны или её постоянными соправителями."
 WRK_petrichev_empire_transition_tt:0 "После завершения фокуса Петричев сохраняет власть и получает дерево Мировой империи."
 WRK_empire_crown_service:0 "Табель коронной службы"
 WRK_empire_crown_service_desc:0 "Петричев предлагает чиновникам место в новом государстве за службу, а не за военные заслуги их покровителей. Единая табель должна связать провинциальные канцелярии со столицей и вернуть разрушенным городам людей, способных вести дела."
 WRK_empire_crown_service_tt:0 "Открывает восстановление округов и позволяет вести §Y2§! проекта одновременно."
 WRK_empire_officer_estates:0 "Военные владения"
 WRK_empire_officer_estates_desc:0 "Командиры не собираются покидать округа, которые удержали в войну. Корона признает их владения в обмен на постоянную службу. Поместья станут опорой престола, хотя местные предприятия почувствуют, кому теперь принадлежит первое право на людей и землю."
 WRK_empire_officer_estates_tt:0 "Открывает назначения наместников. Каждый наш контролируемый национальный регион с наместником получает военное владение: §G+2000§! £manpower_texticon однократно, $MODIFIER_LOCAL_MANPOWER$: §G+15%§!, $MODIFIER_LOCAL_FACTORIES$: §R-10%§!. Действует и для уже назначенных наместников; занятому противником региону пожалование выдаётся после освобождения."
 WRK_empire_crown_charter:0 "Общая коронная грамота"
 WRK_empire_crown_charter_desc:0 "Служба короне получает письменные границы. Грамота закрепляет обязанности округов и право Петричева требовать их исполнения. Победа перестаёт быть временным соглашением штабов: у империи появляется порядок, переживающий отдельный приказ."
 WRK_empire_delta_crown_charter:0 "Коронная служба"
 WRK_empire_officer_estate:0 "Военное владение"
 ADISCORD_vorkerland_empire_settled_category_desc:0 "Полномочия канцелярии и армии закреплены окончательным урегулированием. Борьба двора и штаба завершена; имперские наместники продолжают принимать округа под управление."
 TVA_exchange_unlock_tt:0 "Открывает договоры: оборудование директората обменивается на специалистов из независимых округов только с их согласия."
 TVA_engineering_service_unlock_tt:0 "Программа подготовки кадров будет давать §G35§! пунктов резерва вместо §Y20§! за прежнюю цену и срок, включая уже начатое обучение. Предел резерва - §Y100§!."
 TVA_exchange_active_tt:0 "Утилитарный директорат независим, не капитулировал и продолжает гражданскую войну."
 TVA_offer_specialist_exchange:0 "Предложить обмен специалистами: [FROM.GetName]"
 TVA_offer_specialist_exchange_desc:0 "Между лабораториями и окружными мастерскими сохранились личные связи. Через них можно согласовать переезд опытной бригады и поставку оборудования тем, кто продолжит работу дома."
 TVA_exchange_available_tt:0 "Директорат действует; [FROM.GetName] существует, независим, не капитулировал и не воюет с нами; ответа на наше прежнее предложение ещё не ожидается. В наличии не менее §Y40§! £political_power_texticon и §Y100§! £support_equipment_texticon."
 TVA_exchange_offer_tt:0 "Переговоры оплачиваются сразу. [FROM.GetName] получит предложение и §Y14 дней§! на ответ. Только при согласии и сохранении условий директорат дополнительно потратит §Y30§! £political_power_texticon и передаст §Y100§! £support_equipment_texticon, получив §G600§! £population_texticon и §G10§! пунктов кадрового резерва, до предела §Y100§!. При отказе или утрате условий обмен не состоится; плата за переговоры не возвращается."
 TVA_exchange_accept_tt:0 "Мы передадим директорату §R600§! £population_texticon и получим из его запасов §G100§! £support_equipment_texticon. Директорат потратит ещё §Y30§! £political_power_texticon и получит §G10§! пунктов кадрового резерва, до предела §Y100§!. Ресурсы обеих сторон и возможность обмена проверяются при согласии."
 ADISCORD_vorkerland_diplomacy.18.t:0 "Специалисты для директората"
 ADISCORD_vorkerland_diplomacy.18.d:0 "Представители Дориана Воркса привезли перечень оборудования, которое утилитаристы готовы передать нашим мастерским. Взамен они просят направить в их лаборатории бригаду техников, мастеров и обслуживающего персонала.\n\nПредложение составлено без дипломатических украшений: рабочие места, общежития, ответственность принимающей стороны. Наши производственники напоминают, что опытных людей не хватает и здесь. Можно принять обмен или оставить специалистов дома."
 ADISCORD_vorkerland_diplomacy.18.close:0 "Оставить специалистов дома."
 ADISCORD_vorkerland_diplomacy.18.accept:0 "Согласовать обмен."
 TVA_cadre_training_gain_engineering:0 "35"
 TVA_cadre_training_gain_standard:0 "20"
 TVA_exchange_has_partner_tt:0 "Существует хотя бы один независимый округ, который не капитулировал и не воюет с директоратом."
 TVA_emergency_series_programme_standard_tt:0 "Партия даст §G4500§! £infantry_equipment_texticon и §G60§! £support_equipment_texticon. Нагрузка сети вырастет на §R20§!, кадровый резерв снизится на §R10§!, баланс сдвинется на §Y10%§! к расчёту. При выдаче должны сохраняться условия обычной серии."
 TVA_emergency_series_programme_war_tt:0 "Усиленная партия даст §G6000§! £infantry_equipment_texticon и §G90§! £support_equipment_texticon. Нагрузка сети вырастет на §R30§!, кадровый резерв снизится на §R15§!, баланс сдвинется на §Y10%§! к расчёту. При выдаче нагрузка должна быть не выше §Y65§!, кадровый резерв - не ниже §Y30§!."
 TVA_emergency_series_standard_available_tt:0 "Директорат действует; влияние расчёта выше 10%, нагрузка сети не выше 75, кадровый резерв не ниже 20; принят курс непрерывной мобилизации или максимальной выработки."
 TVA_emergency_series_war_available_tt:0 "Директорат действует и принял военную нагрузку; нагрузка сети не выше 65, кадровый резерв не ниже 30."
 TVA_war_load_series_result_tt:0 "Нагрузка сети: §R+30§!. Кадровый резерв: §R-15§!."
 TVA_maintenance_reduction_civil:0 "35"
 TVA_maintenance_reduction_standard:0 "25"

 # Кадры решающей войны
 TVA_final_operation_available_tt:0 "Самостоятельная утилитарная республика участвует в решающей войне за Воркерланд; выбранная кадровая операция ещё не проведена."
 TVA_frontline_cadre_cost:0 "§Y40§! £political_power_texticon §Y20§! £command_power_texticon §Y30§! кадрового резерва"
 TVA_frontline_cadre_cost_blocked:0 "§R40§! £political_power_texticon §R20§! £command_power_texticon §R30§! кадрового резерва"
 TVA_frontline_cadre_cost_tooltip:0 "Требуется: §Y40§! £political_power_texticon, §Y20§! £command_power_texticon и §Y30§! пунктов кадрового резерва. Оплата списывается при отправке специалистов."
 TVA_protected_core_cost:0 "§Y35§! £political_power_texticon §Y100§! £support_equipment_texticon §Y30§! кадрового резерва"
 TVA_protected_core_cost_blocked:0 "§R35§! £political_power_texticon §R100§! £support_equipment_texticon §R30§! кадрового резерва"
 TVA_protected_core_cost_tooltip:0 "Требуется: §Y35§! £political_power_texticon, §Y100§! £support_equipment_texticon и §Y30§! пунктов кадрового резерва. Ресурсы списываются при переводе специалистов в укрытия."
 TVA_frontline_cadre_result_tt:0 "Кадровый резерв: §R-30§!. Расход необратим. Боевой режим прекращается при выходе республики из решающей войны или потере самостоятельности; оплата не возвращается."
 TVA_protected_core_result_tt:0 "Кадровый резерв: §R-30§!. Защищённый резерв: §G+30§!; он недоступен обычным программам. При победе утилитаристов эти специалисты вместе с оставшимися кадрами сохранят результаты испытаний для объединённой республики, даже после окончания временного режима. Предел учитываемого резерва - §Y100§!. Боевой режим прекращается при выходе из решающей войны или потере самостоятельности; оплата не возвращается."
 TVA_frontline_cadre_unlock_tt:0 "Позволяет один раз в решающей войне направить кадровый резерв на усиление наступления и восстановления частей."
 TVA_protected_core_unlock_tt:0 "Позволяет один раз в решающей войне укрепить оборону и исследования, сохранив техническое ядро для послевоенной республики."

 # Field-trial protocols
 TVA_trial_baseline_name:0 "промышленное испытание"
 TVA_trial_battalion_name:0 "испытание технических батальонов"
 TVA_trial_fire_control_name:0 "испытание огневого управления"
 TVA_trial_logistics_name:0 "испытание адаптивной логистики"
 TVA_trial_protocol_reward_tt:0 "Программа: §Y[GetTVATrialProtocol]§!."
 TVA_trial_success_preview_tt:0 "При успешном испытании:"
 TVA_trial_failure_preview_tt:0 "При неудачном испытании:"
 TVA_trial_battalion_cadres_tt:0 "Кадровый резерв: §G+15§!. После общего износа итоговый прирост составит §G+10§!; предел резерва - §Y100§!."
 TVA_trial_battalion_unlock_tt:0 "Будущие полевые испытания обучают технический резерв и проверяют пехотное вооружение. Для программы нужны винтовки и реальные рекруты."
 TVA_trial_fire_control_unlock_tt:0 "Будущие полевые испытания проверяют электронику и огневое управление, используя снаряжение поддержки вместо винтовочной партии."
 TVA_trial_logistics_unlock_tt:0 "Будущие полевые испытания проверяют снабжение. Успех открывает временный режим ускоренного ремонта и перевозок."
 TVA_trial_baseline_cost:0 "§Y30§! £political_power_texticon §Y9000§! £infantry_equipment_texticon"
 TVA_trial_baseline_cost_blocked:0 "§R30§! £political_power_texticon §R9000§! £infantry_equipment_texticon"
 TVA_trial_battalion_cost:0 "§Y30§! £political_power_texticon §Y6000§! £infantry_equipment_texticon §Y600§! £population_texticon"
 TVA_trial_battalion_cost_blocked:0 "§R30§! £political_power_texticon §R6000§! £infantry_equipment_texticon §R600§! £population_texticon"
 TVA_trial_fire_control_cost:0 "§Y35§! £political_power_texticon §Y120§! £support_equipment_texticon"
 TVA_trial_fire_control_cost_blocked:0 "§R35§! £political_power_texticon §R120§! £support_equipment_texticon"
 TVA_trial_logistics_cost:0 "§Y25§! £political_power_texticon §Y80§! £support_equipment_texticon"
 TVA_trial_logistics_cost_blocked:0 "§R25§! £political_power_texticon §R80§! £support_equipment_texticon"
 TVA_trial_battalion_choice_tt:0 "Открывает фокус §Y$TVA_raise_technical_battalions$§!. После его завершения испытание занимает §Y30§! д. и стоит $TVA_trial_battalion_cost$. Успех обучает кадровый резерв и ускоряет исследование пехотного вооружения."
 TVA_trial_fire_control_choice_tt:0 "Открывает фокус §Y$TVA_test_remote_fire_control$§!. После его завершения испытание занимает §Y30§! д. и стоит $TVA_trial_fire_control_cost$. Успех даёт опыт армии и ускоряет исследование электроники."
 TVA_trial_logistics_choice_tt:0 "Открывает фокус §Y$TVA_test_adaptive_logistics$§!. После его завершения испытание занимает §Y30§! д. и стоит $TVA_trial_logistics_cost$. Успех ускоряет исследование поддержки и временно улучшает ремонт, снабжение и скорость армии."
 TVA_assault_programme_unlock_tt:0 "Оружейные серии усилят фронтовое пополнение, если при выдаче продолжается война с участником гражданского конфликта."
 TVA_measured_programme_unlock_tt:0 "Подготовка кадров также повышает слаженность расчётов, до трёх уровней. Обучение доступно и при полном кадровом резерве, пока не достигнут этот предел."
 TVA_crew_training_level_tt:0 "Слаженность расчётов: §G+1§! уровень, до предела §Y3§!. Каждый уровень усиливает техническую администрацию:"
 TVA_frontline_dispatch_delivery_tt:0 "При выдаче партии во время войны с участником гражданского конфликта включится режим фронтового пополнения. Следующая поставка заново отсчитает срок; длительность не складывается. Режим заканчивается вместе с этой войной или работой независимого директората."

