 RUS_bunker_guard_compact:0 "Караул"
 RUS_bunker_guard_ui_tt:0 "§YКазармы внутренней стражи§!\n[GetRUSBunkerRoomguard]\n\nЦена: [GetRUSBunker11pp]  [GetRUSBunker11cash]  [GetRUSBunker11equipment]\nСрок: §Y21 дн.§!\nЗаймёт §Y2§! £energy_consumption_texticon.\n\nПосле сдачи:\n§G+12%§! организации армии; §G-8%§! времени обучения.\n\nОдин вариант помещения на слой. Оплата списывается один раз; при отмене заказа возвращается полностью."
 RUS_bunker_shelter_compact:0 "Убежища"
 RUS_bunker_shelter_ui_tt:0 "§YЖилой ярус§!\n[GetRUSBunkerRoomshelter]\n\nЦена: [GetRUSBunker12pp]  [GetRUSBunker12cash]  [GetRUSBunker12equipment]\nСрок: §Y21 дн.§!\nЗаймёт §Y1§! £energy_consumption_texticon.\n\nПосле сдачи:\n§G+8%§! стабильности.\n\nОдин вариант помещения на слой. Оплата списывается один раз; при отмене заказа возвращается полностью."
 RUS_bunker_upgrade_1_ui_tt:0 "§YМодернизация слоя 1§!\n[GetRUSBunkerUpgrade1]\nПроект: [GetRUSBunkerRecipe1].\n\nЦена: [GetRUSBunker30pp]  [GetRUSBunker30cash]  [GetRUSBunker30equipment]\nСрок: §Y21 дн.§!\n\nКараул: ещё +8% организации и -5% времени обучения. Убежища: ещё +5% стабильности.\n\nУсиливает уже выбранное помещение. При демонтаже улучшение теряется. При отмене незавершённого заказа вся оплата возвращается."
 RUS_bunker_water_compact:0 "Водоочистка"
 RUS_bunker_water_ui_tt:0 "§YЗамкнутый водяной контур§!\n[GetRUSBunkerRoomwater]\nПроект: [GetRUSBunkerRecipe2].\n\nЦена: [GetRUSBunker13pp]  [GetRUSBunker13cash]  [GetRUSBunker13equipment]\nСрок: §Y21 дн.§!\nЗаймёт §Y1§! £energy_consumption_texticon.\n\nПосле сдачи:\n§G-10%§! истощения.\nПродовольствие: §G+2§! £supply_texticon в неделю.\n\nОдин вариант помещения на слой. Оплата списывается один раз; при отмене заказа возвращается полностью."
 RUS_bunker_signals_compact:0 "Связь"
 RUS_bunker_signals_ui_tt:0 "§YУзел проводной связи§!\n[GetRUSBunkerRoomsignals]\nПроект: [GetRUSBunkerRecipe2].\n\nЦена: [GetRUSBunker14pp]  [GetRUSBunker14cash]  [GetRUSBunker14equipment]\nСрок: §Y21 дн.§!\nЗаймёт §Y2§! £energy_consumption_texticon.\n\nПосле сдачи:\n§G+12%§! скорости планирования.\n\nОдин вариант помещения на слой. Оплата списывается один раз; при отмене заказа возвращается полностью."
 RUS_bunker_upgrade_2_ui_tt:0 "§YМодернизация слоя 2§!\n[GetRUSBunkerUpgrade2]\nПроект: [GetRUSBunkerRecipe2].\n\nЦена: [GetRUSBunker30pp]  [GetRUSBunker30cash]  [GetRUSBunker30equipment]\nСрок: §Y21 дн.§!\n\nВодоочистка: ещё -5% истощения. Узел связи: ещё +8% скорости планирования.\n\nУсиливает уже выбранное помещение. При демонтаже улучшение теряется. При отмене незавершённого заказа вся оплата возвращается."
 RUS_bunker_workshop_compact:0 "Мастерские"
 RUS_bunker_workshop_ui_tt:0 "§YПодземный арсенал§!\n[GetRUSBunkerRoomworkshop]\nПроект: [GetRUSBunkerRecipe3].\n\nЦена: [GetRUSBunker15pp]  [GetRUSBunker15cash]  [GetRUSBunker15equipment]\nСрок: §Y21 дн.§!\nЗаймёт §Y3§! £energy_consumption_texticon.\n\nПосле сдачи:\n§G+15%§! выпуска военных заводов. Мастерская также выдаёт §G+4§! £infantry_equipment_texticon и §G+1§! £support_equipment_texticon в неделю.\n\nОдин вариант помещения на слой. Оплата списывается один раз; при отмене заказа возвращается полностью."
 RUS_bunker_granary_compact:0 "Амбары"
 RUS_bunker_granary_ui_tt:0 "§YЗерновые камеры§!\n[GetRUSBunkerRoomgranary]\nПроект: [GetRUSBunkerRecipe3].\n\nЦена: [GetRUSBunker16pp]  [GetRUSBunker16cash]  [GetRUSBunker16equipment]\nСрок: §Y21 дн.§!\nЗаймёт §Y1§! £energy_consumption_texticon.\n\nПосле сдачи:\n§G-5%§! товаров народного потребления.\nПродовольствие: §G+5§! £supply_texticon в неделю.\n\nОдин вариант помещения на слой. Оплата списывается один раз; при отмене заказа возвращается полностью."
 RUS_bunker_upgrade_3_ui_tt:0 "§YМодернизация слоя 3§!\n[GetRUSBunkerUpgrade3]\nПроект: [GetRUSBunkerRecipe3].\n\nЦена: [GetRUSBunker30pp]  [GetRUSBunker30cash]  [GetRUSBunker30equipment]\nСрок: §Y21 дн.§!\n\nМастерские: ещё +10% выпуска заводов и +6 £infantry_equipment_texticon / +1 £support_equipment_texticon в неделю. Амбары: ещё -3% товаров народного потребления и +2 еды в неделю. Дополнительно занимает 1 мощности.\n\nУсиливает уже выбранное помещение. При демонтаже улучшение теряется. При отмене незавершённого заказа вся оплата возвращается."
 RUS_bunker_clinic_compact:0 "Клиника"
 RUS_bunker_clinic_ui_tt:0 "§YХирургический ярус§!\n[GetRUSBunkerRoomclinic]\nПроект: [GetRUSBunkerRecipe4].\n\nЦена: [GetRUSBunker17pp]  [GetRUSBunker17cash]  [GetRUSBunker17equipment]\nСрок: §Y21 дн.§!\nЗаймёт §Y2§! £energy_consumption_texticon.\n\nПосле сдачи:\n§G+12%§! возвращения потерь.\n\nОдин вариант помещения на слой. Оплата списывается один раз; при отмене заказа возвращается полностью."
 RUS_bunker_laboratory_compact:0 "Лаборатория"
 RUS_bunker_laboratory_ui_tt:0 "§YЛаборатория глубин§!\n[GetRUSBunkerRoomlaboratory]\nПроект: [GetRUSBunkerRecipe4].\n\nЦена: [GetRUSBunker18pp]  [GetRUSBunker18cash]  [GetRUSBunker18equipment]\nСрок: §Y21 дн.§!\nЗаймёт §Y3§! £energy_consumption_texticon.\n\nПосле сдачи:\n§G+10%§! скорости исследований.\n\nОдин вариант помещения на слой. Оплата списывается один раз; при отмене заказа возвращается полностью."
 RUS_bunker_upgrade_4_ui_tt:0 "§YМодернизация слоя 4§!\n[GetRUSBunkerUpgrade4]\nПроект: [GetRUSBunkerRecipe4].\n\nЦена: [GetRUSBunker30pp]  [GetRUSBunker30cash]  [GetRUSBunker30equipment]\nСрок: §Y21 дн.§!\n\nКлиника: ещё +8% возвращения потерь. Лаборатория: ещё +8% скорости исследований. Дополнительно занимает 1 мощности.\n\nУсиливает уже выбранное помещение. При демонтаже улучшение теряется. При отмене незавершённого заказа вся оплата возвращается."
 RUS_bunker_archive_compact:0 "Архив"
 RUS_bunker_archive_ui_tt:0 "§YАрхив аймаков§!\n[GetRUSBunkerRoomarchive]\nПроект: [GetRUSBunkerRecipe5].\n\nЦена: [GetRUSBunker19pp]  [GetRUSBunker19cash]  [GetRUSBunker19equipment]\nСрок: §Y21 дн.§!\nЗаймёт §Y1§! £energy_consumption_texticon.\n\nПосле сдачи:\n§G+0.20§! £political_power_texticon в день.\n\nОдин вариант помещения на слой. Оплата списывается один раз; при отмене заказа возвращается полностью."
 RUS_bunker_command_compact:0 "Командный зал"
 RUS_bunker_command_ui_tt:0 "§YЗал последнего приказа§!\n[GetRUSBunkerRoomcommand]\nПроект: [GetRUSBunkerRecipe5].\n\nЦена: [GetRUSBunker20pp]  [GetRUSBunker20cash]  [GetRUSBunker20equipment]\nСрок: §Y21 дн.§!\nЗаймёт §Y2§! £energy_consumption_texticon.\n\nПосле сдачи:\n§G+8%§! максимального планирования; §G+8%§! защиты армии.\n\nОдин вариант помещения на слой. Оплата списывается один раз; при отмене заказа возвращается полностью."
 RUS_bunker_upgrade_5_ui_tt:0 "§YМодернизация слоя 5§!\n[GetRUSBunkerUpgrade5]\nПроект: [GetRUSBunkerRecipe5].\n\nЦена: [GetRUSBunker30pp]  [GetRUSBunker30cash]  [GetRUSBunker30equipment]\nСрок: §Y21 дн.§!\n\nАрхив: ещё +0.10 политической власти в день. Командный зал: ещё +7% максимального планирования и +7% защиты армии.\n\nУсиливает уже выбранное помещение. При демонтаже улучшение теряется. При отмене незавершённого заказа вся оплата возвращается."
 RUS_bunker_food_ui_tt:0 "§YПродовольственный обоз§!\nЦена: [GetRUSBunker31pp]  [GetRUSBunker31cash]\n\nСразу доставляет §G40§! £supply_texticon. Нужен работающий комплекс и не менее 40 свободных мест на складе. Пополнение снимает штраф пустого запаса; строительную бригаду не занимает."
