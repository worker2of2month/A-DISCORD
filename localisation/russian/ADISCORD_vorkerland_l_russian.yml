 ADISCORD_vorkerland_prep_offer_riv:0 "Ривен: договор о железнодорожных поставках"
 ADISCORD_vorkerland_prep_offer_riv_desc:0 "Ривен сохраняет самостоятельное управление дорогами и страну после победы. За союз получит 5 £train_texticon.\n\nОплата списывается только после согласия другой страны и повторной проверки обеих сторон. Отказ бесплатен. До раскола договор заключён в пользу [ROOT.GetVorkerlandPrepPatron]: после независимости автономия вступит в его коалицию. Поздний договор действует сразу. Другой союз или война с этим штабом срывают вступление. Победа партнёра закрепляет самостоятельность."
 ADISCORD_vorkerland_prep_offer_riv_tt:0 "Ривен сохраняет самостоятельное управление дорогами и страну после победы. За союз получит 5 £train_texticon. Сначала будет запрошено согласие правительства."
 ADISCORD_vorkerland_preparation.20.riv.d:0 "[FROM.GetName] предлагает союз на следующих условиях. Ривен сохраняет самостоятельное управление дорогами и страну после победы. За союз получит 5 поездов.\n\n[GetVorkerlandTreatyTiming] Другой союз или война с обещанным партнёром срывают договор. Он обязуется сохранить нашу страну после победы. Оплата и поставка произойдут одновременно при согласии; если обстановка уже изменилась, можно только закрыть предложение."
