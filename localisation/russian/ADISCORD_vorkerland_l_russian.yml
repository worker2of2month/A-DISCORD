 RUS_bunker_generator_requirements_tt:0 "Добавляет 4 единицы мощности. Доступно два расширения: базовая мощность 4 → 8 → 12. Фокус турбинного резерва добавляет ещё 2 мощности."
 RUS_bunker_reinforce:0 "Укрепить своды"
 RUS_bunker_reinforce_desc:0 "Бригада возвращается в уже пройденные галереи. Новых метров в отчёте не будет: её работа измеряется теми, кто вернётся из следующей смены.\n\nСрок: 21 дн. Доступно при прочности 60 и ниже. Восстанавливает 40 прочности, максимум 100. Прочность не ниже 40 выключает аварийные штрафы.\n$RUS_bunker_contract_tt$"
