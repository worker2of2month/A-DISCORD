 RUS_bunker_generator:0 "Расширить машинный зал"
 RUS_bunker_generator_desc:0 "Резервные генераторы подключат через независимые щиты. Мощность нужна не нарисованным на плане комнатам, а работающим насосам, станкам и лампам.\n\nСрок: 21 дн. Добавляет 4 единицы мощности. Доступно два расширения: базовая мощность 4 → 8 → 12. Фокус турбинного резерва добавляет ещё 2 мощности.\n$RUS_bunker_contract_tt$"
