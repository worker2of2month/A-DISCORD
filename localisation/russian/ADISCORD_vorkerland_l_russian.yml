# Technical administration
 ADISCORD_vorkerland_tva_administration:0 "Техническая администрация"
 ADISCORD_vorkerland_tva_administration_desc:0 "Нагрузка сети: §Y[?TVA_network_load|0]/100§!\nКадровый резерв: §Y[?TVA_cadre_reserve|0]/100§!\nШанс следующего испытания: §Y[?TVA_trial_success_chance|0]%§!\nЗащищённый резерв: §Y[?TVA_protected_cadre|0]§! (сохраняется для послевоенной республики)\n[GetTVAPendingTrial]\nСлаженность расчётов: §Y[?TVA_crew_standards|0]/3§!.\n\nНагрузка выше 50 снижает выпуск военных заводов на 0.2% за пункт. Каждый пункт кадрового резерва выше или ниже 50 меняет скорость исследований на 0.1%. Обслуживание, обучение смен, производственные программы и отчётность используют общее место администрации."
 TVA_administration_dynamic:0 "Техническая администрация"
 TVA_administration_status_tt:0 "Нагрузка сети: §Y[?TVA_network_load|0]/100§!. Кадровый резерв: §Y[?TVA_cadre_reserve|0]/100§!. Слаженность расчётов: §Y[?TVA_crew_standards|0]/3§!."
