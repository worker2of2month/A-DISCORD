 RUS_district_ledger:0 "Одна книга на все аймаки"
 RUS_district_ledger_desc:0 "Перепись дала каждому подданному имя, но округа всё ещё используют несовместимые ведомости. Единая книга поставок свяжет мастерские, склады и инженерную службу. Учтённые инструменты поступят в действующий запас, а новые производственные стандарты — в исследовательскую работу."
 RUS_courier_stations:0 "Станции ханской почты"
 RUS_courier_stations_desc:0 "Приказ, который приходит после зимы, уже не приказ. Свяжем окружные канцелярии регулярной автомобильной почтой и выделим диспетчерам действующие машины. На этих же станциях армейские связные смогут менять экипажи и передавать срочные донесения."
 RUS_district_paramedics:0 "Фельдшер каждого округа"
 RUS_district_paramedics_desc:0 "Дорожные лечебницы должны работать и тогда, когда столица забывает прислать врача. Окружные школы подготовят фельдшеров, знакомых с местными болезнями и военной эвакуацией. Санитарные обозы получат оснащение из центра, а новые приёмы станут достоянием всей службы."
 RUS_covenant_of_service:0 "Хартия служилых людей"
 RUS_covenant_of_service_desc:0 "Верность Хану должна пережить смену начальника. Жалование, срок службы и помощь семьям закрепляются в единой хартии; суды аймаков получают право требовать её исполнения. Мы покупаем не молчание подданных, а уверенность в том, что данное государством слово чего-нибудь стоит."
 RUS_recovery_depots:0 "Возвращать станки в строй"
 RUS_recovery_depots_desc:0 "В промышленном поясе уже достаточно заводов, чтобы неисправная деталь могла остановить целый район. Центральное ремонтное депо соберёт выездные бригады, запас инструментов и транспорт. Первым в строй вернётся старый консервный цех: бункеру нужна еда не меньше, чем фронту - станки."
 RUS_interchangeable_parts:0 "Одинаковая резьба"
 RUS_interchangeable_parts_desc:0 "Мастерские Хана унаследовали десятки несовместимых стандартов. Коллегия инженеров утвердит общие допуски, размеры и чертежи. Две очереди переоснащения позволят постепенно связать старые станки с новым производством, не останавливая всю промышленность ради одного образцового цеха."
 RUS_second_arsenal_shift:0 "Вторая смена арсенала"
 RUS_second_arsenal_shift_desc:0 "Серийное производство требует собственной линии, а не ночных часов на чужом станке. Новый оружейный цех в столичном районе примет выпуск деталей по единым чертежам. Государство расширит площадку заранее, чтобы военный заказ не вытеснил гражданские мастерские."
 RUS_strategic_freight_reserve:0 "Резерв тяжёлых перевозок"
 RUS_strategic_freight_reserve_desc:0 "Завод не поможет фронту, если его продукция останется на погрузочной площадке. Отделим стратегический резерв локомотивов и грузовиков от ежедневных перевозок. Те же машины будут водить продовольственные обозы к бункеру: больше груза за рейс и новые склады у шлюза."
 RUS_field_evacuation_service:0 "Эшелоны возвращения"
 RUS_field_evacuation_service_desc:0 "Профессиональная армия обязана возвращать раненых с фронта. Санитарные эшелоны и полевые пункты получат собственное оснащение; их не придётся собирать заново перед каждой войной. Пусть путь бойца домой начинается ещё у передового перевязочного поста."
 RUS_rifle_inspection_board:0 "Приёмка ханского оружия"
 RUS_rifle_inspection_board_desc:0 "Разные аймаки принесли в армию разные винтовки и разные привычки. Приёмочная комиссия проверит надёжность оружия в пыли, морозе и длительном походе. Её выводы лягут в основу следующего образца вооружения, а испытательные партии пополнят учебные склады."
 RUS_artillery_observers:0 "Глаза батарей"
 RUS_artillery_observers_desc:0 "Орудия должны стрелять туда, где противник находится сейчас. Учебные батареи получат собственные наблюдательные группы, средства связи и практические таблицы корректировки. Совместные занятия пехоты и артиллеристов превратят огневую поддержку из удачи в ремесло."
 RUS_staff_field_exercise:0 "Учения без предупреждения"
 RUS_staff_field_exercise_desc:0 "Штабам предстоит действовать без заранее написанной развязки: потерянная переправа, оборванная связь, неожиданное наступление. Хан потребует разбирать ошибки до следующей войны. Полководец, умеющий менять замысел на ходу, ценнее красивого плана на стене."
 RUS_bunker_closed_cycle:0 "Замкнутый продовольственный цикл"
 RUS_bunker_closed_cycle_desc:0 "Пять оснащённых слоёв уже похожи на город, но город каждый день ест. Грибные камеры, переработка пищевых остатков и строгий санитарный контроль дадут дополнительный еженедельный рацион. Эта прибавка станет особенно важна, если третий слой занят арсеналом, а не зерновыми камерами."
 RUS_bunker_reserve_turbine:0 "Независимая турбина"
 RUS_bunker_reserve_turbine_desc:0 "Расширение подземного города не должно каждый раз начинаться с отключения лаборатории или госпиталя. Дополнительная турбина получит отдельную линию питания и собственную смену механиков. Она увеличит доступную мощность комплекса, оставив место для будущей модернизации слоёв."
 RUS_bunker_cold_stores:0 "Холодные кладовые"
 RUS_bunker_cold_stores_desc:0 "Избыток сегодняшнего урожая бесполезен, если он сгниёт раньше следующего перебоя. Изолированные кладовые увеличат ёмкость продовольственного резерва. Строители оставят сухие проходы для осмотра запасов: подземный город должен считать и хранить пищу, а не просто складывать её за дверью."
 RUS_bunker_machine_depot:0 "Машинный запас под землёй"
 RUS_bunker_machine_depot_desc:0 "Каждый лифт, насос и гермозатвор однажды потребует ремонта. Соберём отдельный запас инструментов для инженерной службы, чтобы монтаж следующего слоя не оставлял действующие помещения без обслуживания. Переданная партия поступит на общий склад оснащения и сможет поддержать оплаченные строительные работы."
 RUS_bunker_emergency_rations:0 "Неприкосновенный рацион"
 RUS_bunker_emergency_rations_desc:0 "Кладовые построены - пора наполнить их. Закупленная партия длительного хранения пополнит подземный резерв, насколько позволяет его текущая ёмкость. Этот запас даст время пережить остановку производства, но не отменит постоянного расхода пищи жителями оснащённых слоёв."
 RUS_bunker_systems_college:0 "Училище подземных систем"
 RUS_bunker_systems_college_desc:0 "Бункер переживёт своих создателей только в том случае, если следующая смена понимает его устройство. Инженеры объединят схемы силовой сети, вентиляции и мастерских в учебный курс. Выпускники перенесут эти знания на наземные предприятия и помогут совершенствовать промышленное оборудование всей страны."
 RUS_bunker_food_output_focus_tt:0 "Продовольствие бункера: §G+2§! £supply_texticon в неделю."
 RUS_bunker_power_focus_tt:0 "Мощность бункера: §G+2§! £energy_consumption_texticon."
 RUS_bunker_food_capacity_focus_tt:0 "Ёмкость продовольственного резерва: §G+40§! £supply_texticon."
 RUS_bunker_food_reserve_focus_tt:0 "Ёмкость резерва: §G+20§! £supply_texticon. Запас: до §G+40§! £supply_texticon в пределах новой ёмкости. Излишек не сохраняется."
