 VAD_crown_government_tt:0 "Действует самостоятельное имперское правительство Петричева."
 VAD_crown_industrial_district_tt:0 "Под нашим владением и контролем есть область с коронной хартией и хотя бы одной фабрикой или военным заводом."
 VAD_crown_policy_available_tt:0 "Действует имперское правительство Петричева. Область принадлежит нам и контролируется нами, сохраняет коронную хартию и хотя бы одну фабрику или военный завод. В ней нет действующих окружных привилегий, залога или незавершённой работы канцелярии."
 VAD_crown_policy_cancellation_tt:0 "Если область потеряет хартию, промышленность или наш контроль либо прекратит действовать имперское правительство, вся оплата вернётся. При объединении или аннексии незавершённую оплату получит преемник. Завершённые вложения не возвращаются; утрата области или хартии снимает местный результат."
 VAD_crown_privileges_programme:0 "Подкрепить привилегии округа"
 VAD_crown_privileges_programme_desc:0 "Окружная управа прислала список работ, для которых ей прежде отказывали в помощи. Мастерские получат оснащение, а местные службы вернут в свои ведомости запасы, реквизированные проходящими частями. Теперь хартия связывает обязательствами и столичную канцелярию."
 VAD_crown_collateral_programme:0 "Получить оружие под залог округа"
 VAD_crown_collateral_programme_desc:0 "Поставщики согласны открыть оружейные склады под обеспечение окружных предприятий. Канцелярия подготовит описи и транспорт, а управа будет исполнять обязательства после ухода военной приёмки. В книге хартии появится новая страница с печатями кредиторов."
 VAD_crown_privileges_legitimacy_tt:0 "Легитимность восстановления: §G+3%§!."
 VAD_crown_collateral_legitimacy_tt:0 "Легитимность восстановления: §R-4%§!."
 VAD_crown_privileges_unlock_tt:0 "Оснащение округов с хартиями временно улучшает их хозяйство и снабжение, укрепляя доверие к восстановлению."
 VAD_crown_collateral_unlock_tt:0 "Залог хозяйства округа позволяет получить оружие сейчас, но временно сокращает доступные местные фабрики и ослабляет доверие к восстановлению."
 VAD_crown_district_privileges:0 "Подкреплённые окружные привилегии"
 VAD_crown_district_privileges_desc:0 "Канцелярия поддерживает хозяйство округа и подтверждает право управы распоряжаться местными запасами."
 VAD_crown_district_collateral:0 "Хозяйство под коронным залогом"
 VAD_crown_district_collateral_desc:0 "Часть окружных предприятий исполняет обязательства перед оружейными поставщиками."
