 TVA_mandate_modular_repair_activate_plan_desc:0 "Подготовленный план можно применить один раз во время соответствующей войны. Его срок начинается с применения; при завершении войны временная идея снимается."
 TVA_preposition_switching_crews_activate_plan:0 "Применить план: $TVA_preposition_switching_crews$"
 TVA_preposition_switching_crews_activate_plan_desc:0 "Подготовленный план можно применить один раз во время соответствующей войны. Его срок начинается с применения; при завершении войны временная идея снимается."
 TVA_authorize_iteration_two_activate_plan:0 "Применить план: $TVA_authorize_iteration_two$"
 TVA_authorize_iteration_two_activate_plan_desc:0 "Подготовленный план можно применить один раз во время соответствующей войны. Его срок начинается с применения; при завершении войны временная идея снимается."
 TVA_spend_the_reserve_cadre_activate_plan:0 "Отправить резервных специалистов в части"
 TVA_spend_the_reserve_cadre_activate_plan_desc:0 "Мастерские выдают полевые наборы, инженеры сверяют назначения с командирами. Теперь неполадки придётся устранять там, где машины остановились, а новые инструкции писать по возвращении с передовой."
 TVA_seal_the_technical_core_activate_plan:0 "Перевести техническое ядро в укрытия"
 TVA_seal_the_technical_core_activate_plan_desc:0 "Последний эшелон увозит людей, приборы и дубликаты чертежей. За оборонительными рубежами начинают работать закрытые мастерские, а командирам сообщают, каких специалистов больше нельзя запрашивать в части."
 WKR_rehearse_operation_southbound_activate_plan:0 "Применить план: $WKR_rehearse_operation_southbound$"
 WKR_rehearse_operation_southbound_activate_plan_desc:0 "Подготовленный план можно применить один раз во время соответствующей войны. Его срок начинается с применения; при завершении войны временная идея снимается."

 WKR_solar_counter_activate_plan:0 "Применить план контринтервенции"
 WKR_solar_counter_activate_plan_desc:0 "Подготовленный план применяется один раз во время войны с Восточным административным округом. Его срок начинается с применения и заканчивается при завершении войны."

 # --- Worx postwar directorate ---
 WRK_worx_opening_tt:0 "Безумие §G-15§!."
 WRK_worx_cabinet_tt:0 "Ежедневный рост безумия устанавливается на §Y0.35§!."
 WRK_worx_last_provisional:0 "Последнее временное правительство"
 WRK_worx_last_provisional_desc:0 "Временные кабинеты пережили слишком много постоянных катастроф. Директория распределит работу между институтами и оставит доктору время, которого он требует для своих исследований."
 WRK_worx_operating_table:0 "Страна на операционном столе"
 WRK_worx_operating_table_desc:0 "Разрушенные города, уставшие солдаты и пустые цеха становятся разделами единого плана. Доктор просит полномочия на лечение всей страны. Никто ещё не согласовал границы вмешательства."
 WRK_worx_council_course_tt:0 "Рост безумия: §Y0.25§! в день. Требования повышаются после §Y5§! результатов. Открывается независимая экспертиза без принудительных опытов."
 WRK_worx_right_to_error:0 "Право на ошибку"
 WRK_worx_right_to_error_desc:0 "Неудачный опыт должен закончиться пересмотром гипотезы. Совет потребует сохранять отрицательные результаты и даст руководителям институтов право остановить программу."
 WRK_worx_personal_course_tt:0 "Рост безумия: §Y0.5§! в день. Требования повышаются после §Y2§! результатов. Ускоренные испытания занимают 7 дней."
 WRK_worx_genius_permission:0 "Гений не нуждается в разрешении"
 WRK_worx_genius_permission_desc:0 "Подписи чиновников не приближают открытие. Уоркс получает право обходить коллегиальные решения, а директора отвечают перед ним лично за каждый день промедления."
 WRK_worx_safeguards_tt:0 "Кризисы снимают 5% стабильности и 50 £political_power_texticon, затем снижают безумие до 60."
 WRK_worx_dissenting_protocol:0 "Протокол особого мнения"
 WRK_worx_dissenting_protocol_desc:0 "В протоколах впервые останутся возражения, которые доктор велел вычеркнуть. Совет сможет останавливать его распоряжения до того, как они парализуют целое ведомство."
 WRK_worx_delta_second_signature:0 "Изменение полномочий директории"
 WRK_worx_second_signature:0 "Подпись второго директора"
 WRK_worx_second_signature_desc:0 "Приказы лабораториям будут действительны только с подписью независимого директора. Научный совет получит собственных инспекторов и возможность защищать исследователей от произвольных наказаний."
 WRK_worx_time_is_up:0 "Доктор, ваше время истекло"
 WRK_worx_time_is_up_desc:0 "Директора готовы принять институты под общий контроль. Осталось провести передачу архивов, охраны и финансирования. Пока она не завершена, подпись Уоркса всё ещё открывает любые двери."
 WRK_worx_relief_tt:0 "Завершённые обычные опыты снимают §G30§! безумия, расширенные - §G60§!. Рост требований сохраняется."
 WRK_worx_ethics_lags:0 "Этика отстаёт от прогресса"
 WRK_worx_ethics_lags_desc:0 "Доктор объявляет прежние ограничения наследием общества, которое уже погибло. Новые протоколы дают ему больше данных и оставляют участникам всё меньше возможностей отказаться."
 WRK_worx_delta_consent:0 "Изменение полномочий директории"
 WRK_worx_consent_not_required:0 "Согласие не предусмотрено"
 WRK_worx_consent_not_required_desc:0 "Ведомства получают обязательные квоты участия. Набор перестаёт зависеть от местных начальников, и лаборатории наконец получают непрерывное снабжение. Цену этого порядка заплатят семьи участников."
 WRK_worx_delta_human_variable:0 "Изменение полномочий директории"
 WRK_worx_human_variable:0 "Человек как переменная"
 WRK_worx_human_variable_desc:0 "Промышленность и армия получат прямой доступ к результатам институтов. В отчётах исчезают имена: переменную удобнее переносить из одной таблицы в другую."
 WRK_worx_delta_humanity:0 "Изменение полномочий директории"
 WRK_worx_correct_humanity:0 "Человечество подлежит исправлению"
 WRK_worx_correct_humanity_desc:0 "Уоркс больше не обещает вернуть людям прежнюю жизнь. Сам человек объявлен причиной всех повторяющихся катастроф. Государство получает бессрочное поручение исправить собственного гражданина."
 WRK_worx_delta_protocol:0 "Изменение полномочий директории"
 WRK_worx_even_genius:0 "Даже гений подчиняется протоколу"
 WRK_worx_even_genius_desc:0 "Исследовательские институты больше не принадлежат одному человеку. Уоркс сохраняет формальный пост, но финансирование, назначения и права участников защищены решениями совета."
 WRK_worx_emergency_tt:0 "Начнётся борьба за институты: §Y35 дней§! самостоятельного правления. В этот срок нужно завершить решение \"Вернуть подчинение\". При провале совет отстранит доктора от управления."
 WRK_worx_foresaw_everything:0 "Я предусмотрел всё"
 WRK_worx_foresaw_everything_desc:0 "Повторные срывы Уоркс объявляет подготовленным саботажем. Он требует чрезвычайных полномочий и обещает за месяц восстановить управляемость институтов. Совет начинает готовить собственный ответ."
 WRK_worx_delta_reconstruction:0 "Изменение послевоенных институтов"
 WRK_worx_delta_utilities:0 "Изменение послевоенных институтов"
 WRK_worx_delta_workshops:0 "Изменение послевоенных институтов"
 WRK_worx_delta_shifts:0 "Изменение послевоенных институтов"
 WRK_worx_delta_continuous:0 "Изменение полномочий директории"
 WRK_worx_delta_shield:0 "Изменение послевоенных институтов"
 WRK_worx_delta_losses:0 "Изменение послевоенных институтов"
 WRK_worx_delta_proven:0 "Изменение послевоенных институтов"
 WRK_worx_delta_corridor:0 "Изменение послевоенных институтов"
 WRK_worx_delta_trusteeship:0 "Изменение полномочий директории"
 WRK_worx_subject_terms_tt:0 "Технические подопечные получают гражданские хартии: доля гражданских и военных заводов для Воркерланда снижается с 25% до 10%. Новые подопечные получают те же условия."
 WRK_worx_accepted_order:0 "Порядок, который можно принять"
 WRK_worx_accepted_order_desc:0 "Победа не требует превращать каждого соседа в закрытый институт. Директория закрепит пределы своих полномочий и оставит местным советам больше производства и самостоятельности."
 WRK_worx_review:0 "Независимая экспертиза"
 WRK_worx_review_desc:0 "Совет предъявит доктору проверяемые результаты и потребует пересмотреть неудачные гипотезы. Принудительные опыты не проводятся; требования не растут.\n\nСрок: 21 дней. Оплата при запуске, результат по завершении. Отмена возвращает всю оплату и зарезервированные материалы."
 WRK_worx_review_result_tt:0 "Через 21 день: безумие §G-15§!, без повышения требований."
 WRK_worx_review_price:0 "§Y50§! £political_power_texticon"
 WRK_worx_review_price_blocked:0 "§R50§! £political_power_texticon"
 WRK_worx_review_price_tooltip:0 "§Y50§! £political_power_texticon"
 WRK_worx_accelerated:0 "Испытания без согласования"
 WRK_worx_accelerated_desc:0 "Доктор сокращает время согласований и лично утверждает принудительную программу. Быстрый отчёт успокоит его, но не остановит рост требований.\n\nСрок: 7 дней. Оплата при запуске, результат по завершении. Отмена возвращает всю оплату и зарезервированные материалы."
 WRK_worx_accelerated_result_tt:0 "Через 7 дней: безумие §G-25§!, §G10§! £army_experience, стабильность §R-2%§!, один результат."
 WRK_worx_accelerated_price:0 "§Y125§! £political_power_texticon"
 WRK_worx_accelerated_price_blocked:0 "§R125§! £political_power_texticon"
 WRK_worx_accelerated_price_tooltip:0 "§Y125§! £political_power_texticon"
 WRK_worx_field_trials:0 "Проверить расчёты на фронте"
 WRK_worx_field_trials_desc:0 "Инженерная группа проверит методы снабжения и управления на действующем фронте. Испытания расходуют выделенное оснащение. Мир до завершения отменяет программу.\n\nСрок: 21 дней. Оплата при запуске, результат по завершении. Отмена возвращает всю оплату и зарезервированные материалы."
 WRK_worx_field_trials_result_tt:0 "Через 21 день войны: §G25§! £army_experience, бонус доктрины 50% и полевая проверка для \"Доказано на практике\". Расходуется 100 £support_equipment_texticon."
 WRK_worx_field_trials_price:0 "§Y75§! £political_power_texticon 100 £support_equipment_texticon"
 WRK_worx_field_trials_price_blocked:0 "§R75§! £political_power_texticon 100 £support_equipment_texticon"
 WRK_worx_field_trials_price_tooltip:0 "§Y75§! £political_power_texticon 100 £support_equipment_texticon"
 WRK_worx_mass_trials:0 "Проверить допустимые потери"
 WRK_worx_mass_trials_desc:0 "Штаб выделит людей для ускоренной полевой проверки. По завершении резерв будет безвозвратно израсходован; незавершённая программа вернёт его полностью.\n\nСрок: 7 дней. Оплата при запуске, результат по завершении. Отмена возвращает всю оплату и зарезервированные материалы."
 WRK_worx_mass_trials_result_tt:0 "Через 7 дней войны: §G15§! £army_experience, полевая проверка, стабильность §R-1%§!. Расходуется 1000 £population_texticon."
 WRK_worx_mass_trials_price:0 "§Y50§! £political_power_texticon 1000 £population_texticon"
 WRK_worx_mass_trials_price_blocked:0 "§R50§! £political_power_texticon 1000 £population_texticon"
 WRK_worx_mass_trials_price_tooltip:0 "§Y50§! £political_power_texticon 1000 £population_texticon"
 WRK_worx_industrial:0 "Проверить производственный цикл"
 WRK_worx_industrial_desc:0 "Институты проверят промышленную технологию. После \"Человек как переменная\" личный режим включает принудительные исследования; после установления надзора они прекращаются.\n\nСрок: 28 дней. Оплата при запуске, результат по завершении. Отмена возвращает всю оплату и зарезервированные материалы."
 WRK_worx_industrial_result_tt:0 "Через 28 дней: промышленный бонус 50%. При личной власти и \"Человек как переменная\" также безумие §G-35§!, стабильность §R-2%§! и один результат."
 WRK_worx_industrial_price:0 "§Y100§! £political_power_texticon"
 WRK_worx_industrial_price_blocked:0 "§R100§! £political_power_texticon"
 WRK_worx_industrial_price_tooltip:0 "§Y100§! £political_power_texticon"
 WRK_worx_civil_science:0 "Открытый конкурс исследований"
 WRK_worx_civil_science_desc:0 "Совет распределит гранты между институтами. Независимая проверка занимает время, но не требует принуждения и не возрождает личные программы доктора.\n\nСрок: 35 дней. Оплата при запуске, результат по завершении. Отмена возвращает всю оплату и зарезервированные материалы."
 WRK_worx_civil_science_result_tt:0 "Через 35 дней: один бонус 50% к электронике."
 WRK_worx_civil_science_price:0 "§Y75§! £political_power_texticon"
 WRK_worx_civil_science_price_blocked:0 "§R75§! £political_power_texticon"
 WRK_worx_civil_science_price_tooltip:0 "§Y75§! £political_power_texticon"
 WRK_worx_grand_programme:0 "Общегосударственная программа коррекции"
 WRK_worx_grand_programme_desc:0 "Постоянный аппарат институтов проводит масштабную принудительную программу. Административные расходы снижаются, но общество продолжает платить за результаты доктора.\n\nСрок: 28 дней. Оплата при запуске, результат по завершении. Отмена возвращает всю оплату и зарезервированные материалы."
 WRK_worx_grand_programme_result_tt:0 "Через 28 дней: безумие §G-50§!, промышленный бонус 75%, стабильность §R-3%§! и один результат."
 WRK_worx_grand_programme_price:0 "§Y75§! £political_power_texticon"
 WRK_worx_grand_programme_price_blocked:0 "§R75§! £political_power_texticon"
 WRK_worx_grand_programme_price_tooltip:0 "§Y75§! £political_power_texticon"
 WRK_worx_restore_obedience:0 "Вернуть подчинение"
 WRK_worx_restore_obedience_desc:0 "Доктор направит чрезвычайных комиссаров в институты. Программа должна закончиться до истечения ультиматума. Открытое окно события не останавливает срок; при утрате самостоятельности отсчёт приостанавливается, а платёж возвращается.\n\nСрок: 14 дней. Оплата при запуске, результат по завершении. Отмена возвращает всю оплату и зарезервированные материалы."
 WRK_worx_restore_obedience_result_tt:0 "Через 14 дней, если ультиматум ещё действует: безумие устанавливается на 30, стабильность §R-10%§!, исследования §G+10%§!, выпуск военных заводов §G+5%§!. Личная власть и рост безумия сохраняются."
 WRK_worx_restore_obedience_price:0 "§Y200§! £political_power_texticon"
 WRK_worx_restore_obedience_price_blocked:0 "§R200§! £political_power_texticon"
 WRK_worx_restore_obedience_price_tooltip:0 "§Y200§! £political_power_texticon"
 WRK_worx_supervised_tt:0 "Передача полномочий совету завершена"
 WRK_worx_two_crises_tt:0 "Произошло не менее двух кризисов личной власти"
 WRK_worx_field_proven_tt:0 "Завершена хотя бы одна полевая программа во время войны"
 WRK_worx_no_emergency_tt:0 "Не идёт борьба за контроль над институтами"
 WRK_worx_scientific_materials:0 "Материалы институтов директории"
 autonomy_WRK_civil_directorate:0 "Гражданская директория"
 WRK_worx_directorate:0 "[GetWorxDirectorateTitle]"
 WRK_worx_directorate_desc:0 "Полномочия научных институтов, закреплённые выбранным курсом директории."
 WRK_worx_title_ordinary:0 "Научная директория"
 WRK_worx_title_personal:0 "Человечество подлежит исправлению"
 WRK_worx_title_council:0 "Даже гений подчиняется протоколу"
 WRK_worx_title_emergency:0 "Чрезвычайная директория"
 WRK_worx_title_failure:0 "Крах личного управления"
