 ADISCORD_vorkerland_preparation.41.t:0 "Округ не платит"
 ADISCORD_vorkerland_preparation.41.d:0 "Казначейство Восточного округа прислало в столицу не платёжное поручение, а письмо. Окружной совет \"временно оставляет у себя\" налоговые поступления: склады пусты, жалованье гарнизону задержано на два месяца, а платить центру, который не может ответить даже на телеграмму, совет считает расточительством.\n\nВ министерстве финансов предлагают отправить сборщиков с охраной. В секретариате Уоркера советуют согласиться на отсрочку: письмо вежливое, а следующее может прийти уже без подписи."
 ADISCORD_vorkerland_preparation.41.a:0 "Сборщики поедут с охраной."
 ADISCORD_vorkerland_preparation.41.b:0 "Дать округу отсрочку."
 ADISCORD_vorkerland_preparation.42.t:0 "Забастовка в депо"
 ADISCORD_vorkerland_preparation.42.d:0 "Локомотивные депо узловой станции остановились. Машинисты требуют выплатить жалованье, задержанное с весны, и сместить начальника дороги, назначенного из столицы. Без депо не уйдёт ни один эшелон с зерном и ни одна рота.\n\nОкружной штаб готов взять станцию под охрану. Железнодорожный совет просит передать депо под его управление. Инженеры Воркса предлагают новый график, который вернёт поезда на линию, если им позволят переставить людей."
 ADISCORD_vorkerland_preparation.42.a:0 "Окружной штаб возьмёт станцию."
 ADISCORD_vorkerland_preparation.42.b:0 "Депо перейдут к железнодорожному совету."
 ADISCORD_vorkerland_preparation.42.c:0 "Пусть инженеры составят новый график."
 ADISCORD_vorkerland_preparation.43.t:0 "Аванс Кефрейта"
 ADISCORD_vorkerland_preparation.43.d:0 "Кефрейтские посредники предлагают аванс за будущие поставки металла с рудников Вестерхольма. Деньги нужны сейчас: казна закрывает месяц с дефицитом. Но подписывать будет центр, а руду добывает округ, и в Вестерхольме уже спрашивают, почему их металл продают без них.\n\nМожно принять аванс от имени столицы. Можно отправить посредников к окружному правлению: казна ничего не получит, зато округ запомнит, что центр не торговал его землёй."
 ADISCORD_vorkerland_preparation.43.a:0 "Подписать от имени центра."
 ADISCORD_vorkerland_preparation.43.b:0 "Пусть договариваются с округом."
 ADISCORD_vorkerland_preparation.44.t:0 "Инцидент на линии Иторы"
 ADISCORD_vorkerland_preparation.44.d:0 "Ночью на демилитаризованной линии с Иторой исчез патруль. Утром его нашли на итаранской стороне: солдаты заблудились в тумане или ушли сами, никто не знает. Итора возвращает людей и требует объяснений, а окружные газеты пишут, что центр не способен удержать даже собственную границу.\n\nОкружной комиссар просит оставить дело ему и не превращать туман в войну. Штаб предлагает усилить линию за счёт резервов."
 ADISCORD_vorkerland_preparation.44.a:0 "Окружной комиссар разберётся сам."
 ADISCORD_vorkerland_preparation.44.b:0 "Усилить линию резервами."
 ADISCORD_vorkerland_preparation.45.t:0 "Слухи о Башне"
 ADISCORD_vorkerland_preparation.45.d:0 "По столице ходит слух, что Башня Единства пуста: министры давно работают в загородных бункерах, а в залах остались только охрана и портреты. Слух нелеп, но его повторяют в очередях, и делегаты округов отказываются приезжать на заседания, пока не увидят правительство своими глазами.\n\nКомитеты требуют закрыть Башню для посторонних и найти, кто распускает слухи. Можно поступить наоборот: пригласить окружных делегатов на инспекцию и показать им работающие кабинеты."
 ADISCORD_vorkerland_preparation.45.a:0 "Закрыть Башню и найти болтунов."
 ADISCORD_vorkerland_preparation.45.b:0 "Пригласить делегатов на инспекцию."
 ADISCORD_vorkerland_preparation.46.t:0 "Бегство инженеров"
 ADISCORD_vorkerland_preparation.46.d:0 "Из конструкторских бюро столицы за месяц уволились сорок инженеров. Часть уехала в округа, где платят продуктами, часть, по слухам, перебралась в Воркенсберг к Дориану Ворксу. Оставшиеся написали коллективное письмо: они готовы работать, если бюро получат собственные бюджеты и право решать без партийных комиссаров.\n\nКомитеты предлагают запретить выезд специалистов. Воркс предлагает принять письмо."
 ADISCORD_vorkerland_preparation.46.a:0 "Запретить выезд специалистов."
 ADISCORD_vorkerland_preparation.46.b:0 "Дать бюро самостоятельность."
 ADISCORD_vorkerland_preparation.47.t:0 "Офицерский сговор"
 ADISCORD_vorkerland_preparation.47.d:0 "Контрразведка перехватила переписку офицеров окружного штаба. Заговора в ней нет, по крайней мере пока: офицеры обсуждают, кому подчинятся, если связь со столицей прервётся, и почти единодушно называют Влада Петричева.\n\nКомитеты требуют чистки. Штаб советует купить лояльность повышениями и наградами. Есть и третий путь: сделать вид, что письма никто не читал, и позволить округам самим решать, кому служат их офицеры."
 ADISCORD_vorkerland_preparation.47.a:0 "Провести чистку."
 ADISCORD_vorkerland_preparation.47.b:0 "Раздать повышения."
 ADISCORD_vorkerland_preparation.47.c:0 "Не заметить переписку."
 ADISCORD_vorkerland_preparation.48.t:0 "Хлебная очередь"
 ADISCORD_vorkerland_preparation.48.d:0 "Хлебные очереди в столице выстраиваются с ночи. Округа держат зерно на своих складах и продают его по собственным ценам. Комитеты предлагают реквизировать хлеб силой, окружные советы - открыть столичные рынки для своих торговцев.\n\nИнженеры Воркса принесли карточную ведомость: если пересчитать склады и пайки, хлеба хватит, но перепись придётся оплатить."
 ADISCORD_vorkerland_preparation.48.a:0 "Реквизировать зерно."
 ADISCORD_vorkerland_preparation.48.b:0 "Открыть рынки окружным торговцам."
 ADISCORD_vorkerland_preparation.48.c:0 "Ввести карточную ведомость."
 ADISCORD_vorkerland_prep_ready_1:0 "§Gзакреплено: комитету Уоркера§!"
 ADISCORD_vorkerland_prep_ready_2:0 "§Gзакреплено: военному штабу Влада§!"
 ADISCORD_vorkerland_prep_ready_3:0 "§Gзакреплено: директорату Дориана§!"
 ADISCORD_vorkerland_continuity_guard:0 "Федеральная гвардия преемственности"
 ADISCORD_vorkerland_prep_federal_summary:0 "Опора правительства: [ROOT.GetVorkerlandPrepPatron]. Занято направлений: [?ADISCORD_vorkerland_prep_active|0]/2.\nГотовые пакеты сохраняют указанного получателя при смене игровой стороны. На каждый спор даётся 21 день; молчание передаёт пакет сопернику.\nЦентральный арсенал: [GetVorkerlandPrepArsenal]\nЖелезнодорожное управление: [GetVorkerlandPrepRail]\nВоркенсбергские мастерские: [GetVorkerlandPrepIndustry]\nФедеральный гарнизон: [GetVorkerlandPrepGarrison]\nРеестры Конфедерации: [GetVorkerlandPrepArchives]\nРезервная связь правительства: [GetVorkerlandPrepCommunications]"
 ADISCORD_vorkerland_prep_district_summary:0 "Конфедерации осталось несколько месяцев. Всё, что сейчас спрятано в областях, после раздела достанется тому, кто будет ими владеть."
 ADISCORD_vorkerland_prep_treaty_deferred:0 "После обретения независимости наша армия поддержит [FROM.GetVorkerlandPrepPatron] и вступит в его коалицию и войны."
 ADISCORD_vorkerland_prep_treaty_immediate:0 "Наша армия немедленно вступит в коалицию [FROM.GetName] и будет участвовать в тех же войнах."
 ADISCORD_vorkerland_egc_settlement_tt:0 "При объединении Зшатская хунта вместе со всей территорией и армией войдёт в Воркерланд независимо от победителя и наличия договора."
 ADISCORD_vorkerland_district_settlement_tt:0 "После победы нашего партнёра мы сохраняем свою страну и территорию."

 # Worx: postwar research and personal rule.
 WRK_worx_research_category:0 "Безумие Дориана Воркса"
 WRK_worx_research_category_desc:0 "Послевоенная директория. Политический курс определяет полномочия доктора, скорость роста безумия и доступные программы. Все программы используют один общий слот."
 WRK_worx_personal_rule:0 "Личное вмешательство Воркса"
 WRK_worx_personal_rule_desc:0 "Нарастающая одержимость Дориана нарушает работу гражданских учреждений и военной промышленности."
 WRK_worx_value:0 "Безумие: §Y[?WRK_worx_madness|1] / 100§!"
 WRK_worx_needle:0 "§RI§!"
 WRK_worx_status:0 "[GetWorxMadnessStatus]"
 WRK_worx_growth:0 "[GetWorxMadnessGrowth] | Требования: §Y[?WRK_worx_demand|0] / 4§!"
 WRK_worx_operation_report:0 "[GetWorxResearchOperation]"
 WRK_worx_status_0:0 "Холодная уверенность"
 WRK_worx_status_1:0 "§YНавязчивые требования§!"
 WRK_worx_status_2:0 "§OПодозрение в саботаже§!"
 WRK_worx_status_3:0 "§RПринудительная коррекция§!"
 WRK_worx_status_supervised:0 "§GПолномочия ограничены директорией§!"
 WRK_worx_status_suspended:0 "Работа директории приостановлена"
 WRK_worx_growth_active:0 "Рост: §R+[?WRK_worx_growth_total|2]§! в день"
 WRK_worx_growth_stopped:0 "Рост остановлен"
 WRK_worx_operation_basic:0 "§Y1 / 1§!: испытания нагрузки. Срок указан в решении ниже."
 WRK_worx_operation_expanded:0 "§Y1 / 1§!: расширенная программа. Срок указан в решении ниже."
 WRK_worx_operation_oversight:0 "§Y1 / 1§!: передача полномочий. Срок указан в решении ниже."
 WRK_worx_operation_none:0 "§G0 / 1§!: исследовательский слот свободен"
 WRK_worx_rules_tt:0 "Безумие начинается с 20 и растёт ежедневно, включая время выполнения программ. Текущий рост: §Y[?WRK_worx_growth_total|2]§!. При 25, 50 и 75 каждая ступень добавляет §R-3%§! стабильности и §R-2%§! выпуска военных заводов.\n\nПри 100 кризис исполняется немедленно: §R-10%§! стабильности и §R100§! £political_power_texticon, безумие снижается до 70. \"Протокол особого мнения\" смягчает последствия до §R-5%§!, §R50§! £political_power_texticon и 60 безумия. Требования повышаются на ступень.\n\nОбычные опыты снимают §G[?WRK_worx_basic_relief|0]§! безумия, расширенные - §G[?WRK_worx_expanded_relief|0]§!. Повышение требований: [?WRK_worx_results|0] / [?WRK_worx_result_threshold|0] результатов. Максимальная ступень IV; цены обычной программы 75/100/125/150, расширенной 150/200/250/300 £political_power_texticon. Экспертизы и гражданская наука требования не повышают.\n\n\"Доктор, ваше время истекло\" открывает передачу полномочий совету. Только завершённая передача останавливает рост и закрывает принудительные программы. При подчинении, капитуляции или смене руководства платные работы отменяются с возвратом фактической оплаты. Накопленные значения сохраняются.\n\n\"Я предусмотрел всё\" открывает 35 дней борьбы за институты. Решение \"Вернуть подчинение\" занимает 14 дней и стоит 200 £political_power_texticon. При провале совет прекращает личное управление: стабильность -15%, выпуск военных заводов -15%, прирост политической власти -0.5. Окно события не останавливает срок; подчинение и капитуляция приостанавливают отсчёт."
 WRK_worx_slot_free_tt:0 "Общий слот исследовательской программы свободен"
 WRK_worx_operational_tt:0 "Самостоятельная техническая директория действует под руководством Воркса"
 WRK_worx_basic:0 "Испытания предельной нагрузки"
 WRK_worx_basic_desc:0 "Воркс требует проверить пределы человеческой работоспособности. Военное ведомство передаст институту группу людей, чьё согласие программа не предусматривает. Доклад позволит пересмотреть армейские нормативы; известия о принуждении вызовут протесты.\n\nСрок: 14 дней. Оплата при запуске; результат только по завершении. Отмена при утрате самостоятельности, капитуляции или смене руководства возвращает всю оплату и освобождает слот."
 WRK_worx_expanded:0 "Расширенная исследовательская программа"
 WRK_worx_expanded_desc:0 "Директория распространит принудительные исследования на производственные коллективы. Условия труда подчинят экспериментальному протоколу, а отчёты используют при разработке новых промышленных процессов. Вмешательство затронет больше людей и вызовет более сильное недовольство.\n\nСрок: 28 дней. Оплата при запуске; результат только по завершении. При отмене вся оплата возвращается."
 WRK_worx_oversight:0 "Ограничить полномочия Воркса"
 WRK_worx_oversight_desc:0 "Совет прошёл путь от права на возражение до контроля над назначениями. Теперь он примет институты, освободит участников принудительных программ и лишит Уоркса права единолично назначать исследования. Доктор сохранит формальный пост главы государства.\n\nСрок: 35 дней. Безумие продолжает расти, общий слот занят до завершения. При отмене вся оплата возвращается."
 WRK_worx_basic_result_tt:0 "Через §Y14 дней§!: безумие §G-[?WRK_worx_basic_relief|0]§!, §G5§! £army_experience, стабильность §R-1%§!. Один результат в счёт повышения требований."
 WRK_worx_expanded_result_tt:0 "Через §Y28 дней§!: безумие §G-[?WRK_worx_expanded_relief|0]§!, один промышленный бонус §G25%§!, стабильность §R-2.5%§!. Один результат в счёт повышения требований."
 WRK_worx_oversight_result_tt:0 "Через §Y35 дней§!: безумие обнуляется, его рост и штрафы прекращаются, принудительные исследования закрываются. Стабильность §G+5%§!."
 WRK_worx_cancel_tt:0 "Вся внесённая оплата возвращается. Программа не выдаёт результат и не повышает требования; общий слот освобождается."
 WRK_worx_expanded_bonus:0 "Материалы расширенной программы"
 ADISCORD_vorkerland_postwar.20.t:0 "После последнего отчёта"
 ADISCORD_vorkerland_postwar.20.d:0 "На первом заседании послевоенной директории обсуждали восстановленные подстанции, ведомственные бюджеты и возвращение рабочих домой. Дориан Воркс перелистнул сводку и спросил, почему институты сокращают программы наблюдения. Ответ о завершении военной необходимости его не убедил.\n\nОн объяснил, что гражданская война оставила главный вопрос открытым: почему люди разрушают системы, от которых зависит их жизнь? Победа дала средства для исследования, но не ответ. На стол совета легло требование сохранить чрезвычайный порядок привлечения участников. Подписи самих участников среди необходимых документов не значились.\n\nДиректории предстоит выбирать между новыми опытами и созданием учреждений, способных ограничить личные требования её руководителя."
 ADISCORD_vorkerland_postwar.20.a:0 "Открыть послевоенный реестр."
 ADISCORD_vorkerland_postwar.21.t:0 "Совет удержал институты"
 ADISCORD_vorkerland_postwar.21.d:0 "Ночью Воркс потребовал заменить руководителей нескольких институтов и немедленно передать их материалы специальной комиссии. Наутро выяснилось, что городские управления отказались исполнять распоряжения без подписей совета. У директории нашлись собственные реестры, служащие и средства связи.\n\nЧасть работ всё же остановилась. На согласование противоречащих приказов ушли ресурсы и доверие граждан. Совет сохранил учреждения, но Воркс согласился отступить лишь после увеличения будущих исследовательских требований.\n\nПоследствия уже учтены: стабильность -5%, -50 £political_power_texticon; безумие снижено до 60, требования повышены на одну ступень, максимум до IV."
 ADISCORD_vorkerland_postwar.21.a:0 "Теперь у совета есть основания действовать."
 ADISCORD_vorkerland_postwar.22.t:0 "Принудительная коррекция"
 ADISCORD_vorkerland_postwar.22.d:0 "Воркс объявил, что несогласованность отчётов доказывает существование саботажа. Директоры получили распоряжения остановить работу, передать архивы и явиться для проверки. Другие ведомства одновременно потребовали продолжать выпуск по прежнему графику.\n\nВ течение нескольких дней учреждения выясняли, какие подписи ещё имеют силу. Предприятия теряли смены, семьи осаждали приёмные, а новая комиссия требовала расширить исследования. Когда Воркс вернулся к обычным заседаниям, никто уже не говорил о пересмотре их целей.\n\nПоследствия уже учтены: стабильность -10%, -100 £political_power_texticon; безумие снижено до 70, требования повышены на одну ступень, максимум до IV."
 ADISCORD_vorkerland_postwar.22.a:0 "Вернуть учреждения к работе."
 ADISCORD_vorkerland_postwar.23.t:0 "Вторая подпись"
 ADISCORD_vorkerland_postwar.23.d:0 "Новое положение об институтах заняло всего несколько страниц. Распоряжение главы директории отныне требовало второй подписи, решения совета и согласия участников исследования. Комиссии получили право прекращать действующие программы.\n\nВоркс долго смотрел на документ. Затем спросил, кто будет отвечать за время, потерянное на обсуждение. Председатель совета ответил, что ответственность теперь разделяется вместе с правом принимать решения.\n\nДориан сохранил должность. Институты получили возможность отказать ему. Принудительные программы закрыты, личное вмешательство больше не определяет работу государства."
 ADISCORD_vorkerland_postwar.23.a:0 "Передать положение всем институтам."
