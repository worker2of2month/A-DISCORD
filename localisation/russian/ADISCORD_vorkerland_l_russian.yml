 IBA_organize_transitional_council_desc: "Матеуск должен превратить временную администрацию коридора в работающий кабинет и распределить полномочия между местными общинами."
 ADISCORD_ivanland_proclaim_norvane: "Провозгласить Норвейн"
 ADISCORD_ivanland_proclaim_norvane_desc: "Передать штаты [90.GetName] и [91.GetName] гражданской администрации Матвея Матеуска. Крайтская директория сохранит отдельный зависимый статус и получит штаты [93.GetName] и [94.GetName]."
 ADISCORD_ivanland_form_norvane_alliance: "Заключить Норвейнский союз"
 ADISCORD_ivanland_form_norvane_alliance_desc: "Закрепить итоги интервенции договором с администрацией Матеуска и создать общий оборонительный союз."
 ADISCORD_ivanland_invite_wit: "Пригласить Витланд"
 ADISCORD_ivanland_invite_wit_desc: "Предложить Витланду присоединиться к Иванландско-Норвейнскому союзу."
 faction_ivanland_norvane_alliance: "Иванландско-Норвейнский союз"
 ADISCORD_vorkerland_tgd_grid_collapse: "Коллапс городской сети"
 ADISCORD_vorkerland_tgd_grid_collapse_desc: "Аварийные отключения парализовали промышленность, ремонт и снабжение Фирнова и Техлара. Всё доступное население удерживают на городских работах, поэтому армия располагает только заранее выделенным техническим резервом. После устранения двух соседних угроз сеть можно будет восстановить за 120 дней."
 ADISCORD_vorkerland_tgd_living_grid: "Городская сеть Фирнова и Техлара"
 ADISCORD_vorkerland_tgd_living_grid_desc: "Фирновско-Техларская агломерация - единый организм из электростанций, метро, заводов и распределительных узлов. Городские инженеры чинят его прямо под огнём и экономно снабжают оборону, но всё доступное население остаётся закреплено за обслуживанием сети."
 ADISCORD_vorkerland_tgd_rebuild_grid: "Перезапустить городскую сеть"
 ADISCORD_vorkerland_tgd_rebuild_grid_desc: "Начать 120-дневное восстановление энергосистемы после устранения Вольнограда и Эберна."
