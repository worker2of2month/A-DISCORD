 VAD_district_order_cost_tooltip:0 "§Y25§! £political_power_texticon §Y500§! £population_texticon"
 VAD_withdraw_district_commandant:0 "Отозвать окружного коменданта"
 VAD_withdraw_district_commandant_desc:0 "Местные старосты готовы снова открыть конторы, если приказы перестанет подписывать военный комендант. Штаб сохранит границу округа на карте, но откажется от прямого управления его хозяйством."
 VAD_withdraw_commandant_available_tt:0 "Округ действует и полностью удерживает область с комендатурой; в этой области нет оплаченной незавершённой операции."
 VAD_withdraw_commandant_result_tt:0 "Комендатура, её преимущества, недовольство и местное восстание будут сняты. Ранее вложенные ресурсы не возвращаются. При необходимости комендатуру можно снова создать за полную цену."
 ADISCORD_vorkerland_vad_district_uprising:0 "Восстание против комендатуры"
 VAD_district_uprising_tt:0 "Восстание отключает преимущества местной комендатуры. Последствия для области: §R-35%§! фабричной мощности, §R-30%§! местных рекрутов, §R-25%§! местного снабжения и §R-10%§! скорости войск контролёра. Восстановление порядка или отзыв коменданта прекращает кризис."
 ADISCORD_vorkerland_claimant.15.t:0 "Округа отказываются повиноваться"
 ADISCORD_vorkerland_claimant.15.d:0 "Первые донесения называли происходящее отказом от нарядов. Затем оборвалась связь с окружными складами, у застав появились баррикады, а рабочие команды разошлись по домам. Коменданты ещё держат свои здания, но распоряжения за их стенами больше не исполняются.\n\nШтаб требует подкрепить караулы и восстановить дороги. Канцелярия предлагает снять наиболее ненавистных комендантов и вернуть управление местным представителям. Решение придётся принимать по каждому округу отдельно."
 ADISCORD_vorkerland_claimant.15.a:0 "Разобрать донесения по округам."

 VAD_crown_district_recruitment:0 "Коронный набор в округе"
 VAD_crown_district_recruitment_desc:0 "Канцелярия сверяет именные ордера с окружной хартией. Старосты должны отпустить людей из мастерских и хозяйств, оставив в книгах запись о службе каждой семьи."
 VAD_joint_district_recruitment:0 "Набор по общему реестру"
 VAD_joint_district_recruitment_desc:0 "Гвардейские писари и фабричные комитеты сводят свои списки. Комендант требует отправить на сборный пункт всех, кто ещё числится за цехом, хотя местные представители спорят за каждое имя."
 VAD_crown_recruitment_available_tt:0 "Мы удерживаем область с действующей хартией, где ещё не завершён окружной набор; местная операция отсутствует."
 VAD_joint_recruitment_available_tt:0 "Мы удерживаем область с комендатурой, где ещё не завершён окружной набор; восстания и местной операции нет."
 VAD_crown_recruitment_site_tt:0 "Есть своя подконтрольная область с действующей хартией и неиспользованным окружным набором."
 VAD_joint_recruitment_site_tt:0 "Есть своя подконтрольная область с комендатурой, неиспользованным окружным набором и без восстания."
 VAD_crown_recruitment_unlock_tt:0 "Окружные хартии позволят набирать резервистов ценой работы местных предприятий."
 VAD_joint_recruitment_unlock_tt:0 "Комендатуры смогут проводить расширенный набор, повышающий местное недовольство."
 VAD_crown_recruitment_result_tt:0 "После подготовки Округ Петричева получит §G3000§! £population_texticon. Область получит §R-10%§! местных фабрик, пока действует её администрация в гражданской войне. Завершённый набор из этой области повторить нельзя. Уже набрано: §Y[?FROM.VAD_district_recruited|0]§! £population_texticon."
 VAD_joint_recruitment_result_tt:0 "После подготовки Округ Петричева получит §G4500§! £population_texticon. Недовольство области вырастет на §R30§!, максимум до §Y100§!, и может вызвать восстание. Завершённый набор повторить нельзя. Уже набрано: §Y[?FROM.VAD_district_recruited|0]§! £population_texticon."
 VAD_recruitment_cancellation_tt:0 "Утрата владения, контроля или нужной администрации, капитуляция, подчинение и конец гражданской войны отменяют подготовку с полным возвратом власти и оснащения. Восстание также отменяет незавершённый набор комендатуры. При передаче страны возврат получает её живой преемник."
 VAD_crown_recruitment_disruption:0 "Окружные работники на службе"
 VAD_crown_recruitment_disruption_tt:0 "Область получает §R-10%§! местных фабрик, пока действует её администрация в гражданской войне."
 VAD_joint_recruitment_unrest_tt:0 "Недовольство области увеличивается на §R30§!, до максимума §Y100§!. При достижении порога начинается местное восстание; прибывшие люди остаются в армии."
 VAD_oath_pending_crown_recruitment:0 "Готовится коронный набор. Оплачено: §Y[?VAD_oath_pp|0]§! £political_power_texticon §Y[?VAD_oath_support|0]§! £support_equipment_texticon."
 VAD_oath_pending_joint_recruitment:0 "Готовится набор по общему реестру. Оплачено: §Y[?VAD_oath_pp|0]§! £political_power_texticon §Y[?VAD_oath_support|0]§! £support_equipment_texticon."
