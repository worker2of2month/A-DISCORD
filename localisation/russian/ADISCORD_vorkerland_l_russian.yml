 ADISCORD_vorkerland_prep_offer_yor:0 "Йор: защита местной торговли"
 ADISCORD_vorkerland_prep_offer_yor_desc:0 "Йор сохраняет собственное правительство и самостоятельность после победы. За союз получит 18000 £infantry_equipment_texticon для охраны торговли.\n\nОплата списывается только после согласия другой страны и повторной проверки обеих сторон. Отказ бесплатен. До раскола договор заключён в пользу [ROOT.GetVorkerlandPrepPatron]: после независимости автономия вступит в его коалицию. Поздний договор действует сразу. Другой союз или война с этим штабом срывают вступление. Победа партнёра закрепляет самостоятельность."
 ADISCORD_vorkerland_prep_offer_yor_tt:0 "Йор сохраняет собственное правительство и самостоятельность после победы. За союз получит 18000 £infantry_equipment_texticon для охраны торговли. Сначала будет запрошено согласие правительства."
 ADISCORD_vorkerland_preparation.20.yor.d:0 "[FROM.GetName] предлагает союз на следующих условиях. Йор сохраняет собственное правительство и самостоятельность после победы. За союз получит 18000 винтовок для охраны торговли.\n\n[GetVorkerlandTreatyTiming] Другой союз или война с обещанным партнёром срывают договор. Он обязуется сохранить нашу страну после победы. Оплата и поставка произойдут одновременно при согласии; если обстановка уже изменилась, можно только закрыть предложение."
 ADISCORD_vorkerland_prep_district_open_tt:0 "Правительство самостоятельно, не связано другим союзом, не воюет с претендентами и не рассматривает другое предложение"
 ADISCORD_vorkerland_preparation.20.t:0 "Гарантии за общую войну"
 ADISCORD_vorkerland_preparation.20.accept:0 "Принять поставку и вступить в союз"
 ADISCORD_vorkerland_preparation.20.close:0 "Сохранить самостоятельный курс"
 ADISCORD_vorkerland_prep_treaty_tt:0 "Поставки оплачивает приглашающая страна. До раскола вступление в коалицию выбранного штаба отложено до независимости. После раскола вступаем сразу, сохранив свою армию. [GetVorkerlandCoalitionSettlement]"
 ADISCORD_vorkerland_prep_patron_tt:0 "Выбранный штаб наследует общие результаты подготовки. Фокусы открывают проекты на шести объектах; одновременно можно вести два. Выбор страны при расколе остаётся отдельным решением."
 ADISCORD_vorkerland_prewar_central_levy:0 "Чрезвычайный сбор центра"
 ADISCORD_vorkerland_prewar_central_levy_desc:0 "Сборщики выезжают в округа с предписаниями чрезвычайного бюджета. За каждой подписью стоит спор о том, кто вправе распоряжаться общим имуществом."
 ADISCORD_vorkerland_prewar_district_mandates:0 "Окружные мандаты"
 ADISCORD_vorkerland_prewar_district_mandates_desc:0 "Окружные канцелярии получают документы с печатью центра. Местные руководители читают их вслух: наконец полномочия названы так же ясно, как прежде назывались обязанности."
