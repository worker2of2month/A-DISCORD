# Council aviation and railway programmes
 WKR_airfield_workshop_programme:0 "Создать авиамастерскую совета"
 WKR_airfield_workshop_programme_desc:0 "Железнодорожный совет направляет механиков на местный аэродром. В опустевших ангарах расставляют станки, а диспетчеры готовят ведомости для вагонов с инструментом и запасными частями."
 WKR_armoured_train_programme:0 "Заказать защищённые составы"
 WKR_armoured_train_programme_desc:0 "Локомотивные и оружейные цеха согласовали чертежи броневых кожухов и зенитных установок. Делегатам предстоит распределить работу между сменами, пока фронт продолжает ждать обычных грузов."
 WKR_airfield_workshop:0 "Авиамастерская железнодорожного совета"
 WKR_airfield_workshop_desc:0 "Местные цеха выделяют станки и ремонтные бригады для аэродромного хозяйства."
 WKR_airfield_workshop_district_tt:0 "Есть полностью удерживаемый собственный узел снабжения с железнодорожным советом, авиабазой и местом для новой авиамастерской."
 WKR_armoured_train_district_tt:0 "Есть полностью удерживаемый собственный узел снабжения с железнодорожным советом и военным заводом."
 WKR_airfield_workshop_available_tt:0 "Независимая западная республика продолжает гражданскую кампанию. Выбранный узел снабжения принадлежит нам и полностью удерживается; действуют железнодорожный совет и авиабаза, а авиамастерская ещё не создана."
 WKR_armoured_train_available_tt:0 "Независимая западная республика продолжает гражданскую кампанию и полностью удерживает собственный узел снабжения с железнодорожным советом и военным заводом."
 WKR_airfield_workshop_unlock_tt:0 "Открывает местные авиамастерские: они ускоряют ремонт авиабазы ценой части выпуска округа."
 WKR_armoured_train_unlock_tt:0 "Открывает заказы по §Y8§! защищённых составов для снабжения под воздушными налётами."
 WKR_airfield_workshop_result_tt:0 "Авиамастерская в области §Y[FROM.GetName]§! действует, пока работают местный совет и авиабаза. При утрате области или завершении гражданской кампании она закрывается; после возвращения области её можно создать заново за полную цену."
 WKR_armoured_train_result_tt:0 "Защищённые составы поступят в наш запас и сохранятся после завершения войны."
 WKR_air_rail_cancellation_tt:0 "Утрата необходимых местных учреждений, подчинение, капитуляция или конец кампании отменяют незавершённую работу с полным возвратом оплаты. При объединении возврат получает Воркерланд, при аннексии - поглощающая страна."
 WKR_railway_order_airfield_workshop:0 "Авиамастерская: §Y[?WKR_railway_order_state.GetName]§!. Оплачено: §Y[?WKR_railway_order_pp|0]§! £political_power_texticon §Y[?WKR_railway_order_manpower|0]§! £population_texticon §Y[?WKR_railway_order_support|0]§! £support_equipment_texticon."
 WKR_railway_order_armoured_train:0 "Заказ защищённых составов. Оплачено: §Y[?WKR_railway_order_pp|0]§! £political_power_texticon §Y[?WKR_railway_order_manpower|0]§! £population_texticon §Y[?WKR_railway_order_support|0]§! £support_equipment_texticon."
