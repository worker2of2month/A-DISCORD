 TVA_strike_aircraft_programme:0 "Заказать ударную авиасерию"
 TVA_strike_aircraft_programme_desc:0 "Мастерские собирают машины для точного удара по запросу наблюдателей. Наземным диспетчерам предстоит проверить таблицы наведения, прежде чем командование доверит им первый вылет."
 TVA_interceptor_reserve_programme:0 "Сформировать резерв перехватчиков"
 TVA_interceptor_reserve_programme_desc:0 "Одни и те же машины не могут дежурить бесконечно. Новая смена займёт место в ангарах, пока механики вернут уставшие звенья в строй."
 TVA_aircraft_cancellation_tt:0 "При утрате условий программа отменяется с полным возвратом оплаты. Самолёты передаются только после завершения работ; при передаче власти незавершённая оплата возвращается преемнику."
 TVA_strike_aircraft_unlock_tt:0 "Открывает выпуск штурмовиков с расходом кадрового резерва и увеличением нагрузки на сеть."
 TVA_interceptor_reserve_unlock_tt:0 "Открывает выпуск резерва истребителей для прикрытия узлов сети."
 TVA_strike_aircraft_available_tt:0 "Директорат действует и удерживает аэродром и военный завод. Нагрузка на сеть не выше §Y65§!, кадровый резерв не ниже §Y25§!."
 TVA_strike_aircraft_result_tt:0 "Нагрузка на сеть: §R+20§!. Кадровый резерв: §R-10§!."
