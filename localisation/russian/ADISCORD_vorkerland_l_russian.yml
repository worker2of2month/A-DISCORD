 VAD_local_militia_cost_tooltip:0 "Стоимость: §Y35§! £political_power_texticon §Y1000§! £population_texticon §Y900§! £infantry_equipment_texticon §Y60§! £support_equipment_texticon."
 VAD_final_operations_context_tt:0 "Идёт подготовка центральной войны или сама война; окружная администрация продолжает действовать."
 VAD_district_march_site_tt:0 "Есть полностью удерживаемый округ с хартией или комендатурой, без мятежа и действующего походного обязательства. В комендатуре недовольство ниже §Y70§!."
 VAD_city_redoubts_site_tt:0 "Есть полностью удерживаемый округ с хартией или комендатурой, без мятежа. В нём есть города с победными очками, и каждый имеет не более §Y8§! уровней сухопутных укреплений."
 VAD_district_march_programme:0 "Подготовить поход из округа [FROM.GetName]"
 VAD_district_march_programme_desc:0 "Начальники округов собирают обозы, освобождают служащих для походных штабов и передают местным мастерским списки фронтовых заказов. В столицу должны прийти организованные колонны, за которыми стоят действующие учреждения."
 VAD_city_redoubts_programme:0 "Укрепить города округа [FROM.GetName]"
 VAD_city_redoubts_programme_desc:0 "Коменданты и гражданские управы сверяют планы городов. Каменные здания превращаются в опорные пункты, подступы перекрываются огневыми позициями, а жители получают места в убежищах."
 VAD_district_march_available_tt:0 "Центральная война с другим претендентом продолжается; выбранный округ пригоден для похода, другой походный план и окружное обязательство не действуют."
 VAD_city_redoubts_available_tt:0 "$VAD_final_operations_context_tt$ $VAD_city_redoubts_site_tt$"
 VAD_district_march_unlock_tt:0 "Открывает окружную подготовку наступления: временный армейский план ценой местного производства и недовольства комендатуры."
 VAD_city_redoubts_unlock_tt:0 "Открывает строительство двух уровней сухопутных укреплений в городах выбранного округа."
 VAD_district_march_result_tt:0 "Результат действует после завершения подготовки. В комендатуре [FROM.GetName] недовольство §R+30§!; округ с хартией этого штрафа не получает. Потеря действующей администрации округа прекращает план. Исторический окружной набор не расходуется."
 VAD_city_redoubts_result_tt:0 "Укрепляются все провинции [FROM.GetName] с победными очками. Постройки сохраняются после окончания войны и смены администрации."
 VAD_final_operations_cancellation_tt:0 "При утрате условий до завершения заказа VAD получает полный возврат. При передаче страны невыплаченный залог следует получателю по правилам урегулирования."
 VAD_march_commitment:0 "Походное обязательство округа"
 VAD_march_commitment_desc:0 "Мастерские работают на обозы, а окружные служащие сопровождают штабные колонны."
 VAD_oath_pending_district_march:0 "Поход: [?VAD_oath_state.GetName]"
 VAD_oath_pending_city_redoubts:0 "Городские укрепления: [?VAD_oath_state.GetName]"
