 RUS_bunker_guard_delta:0 "Казармы внутренней стражи"
 RUS_bunker_guard:0 "Слой 1: казармы внутренней стражи"
 RUS_bunker_guard_desc:0 "Стража получает постоянные казармы и учебный двор под бетонным небом. Дисциплина начинается с кровати, которую солдат не делит с ящиком патронов.\n\nСрок: 21 дн. Требуемая свободная мощность: 2. После сдачи слой занимает 2 мощности и даёт показанные ниже постоянные эффекты. На этом слое можно выбрать только одно помещение.\n$RUS_bunker_contract_tt$"
