 RUS_bunker_upgrade_1:0 "Модернизация слоя 1"
 RUS_bunker_upgrade_1_desc:0 "Существующее помещение получает вторую очередь оборудования. Назначение слоя сохраняется.\n\nКараул: ещё +1.5% организации и -1.5% времени обучения. Убежища: ещё +2% стабильности.\nСрок: 21 дн.\n$RUS_bunker_contract_tt$"
