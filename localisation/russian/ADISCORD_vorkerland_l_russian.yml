 ADISCORD_vorkerland_phase_side_engineers_tt:0 "Пакет инженеров (влияние §Y[?global.ADISCORD_vorkerland_camp_engineers|0]§!): от §Y50§! - §Y6000§! £infantry_equipment_texticon и §Y50§! £political_power_texticon, от §Y75§! - ещё §Y5000§! £manpower_texticon и §Y40§! единиц снаряжения поддержки. Пакет получает претендент этого лагеря, кем бы вы ни играли."
 ADISCORD_vorkerland_phase_worker_fate_tt:0 "Судьба Уоркера: [GetVorkerlandWorkerFateForecast]"
 ADISCORD_vorkerland_fate_forecast_loyalists:0 "проект эвакуации гарантирует, что он останется с лоялистами."
