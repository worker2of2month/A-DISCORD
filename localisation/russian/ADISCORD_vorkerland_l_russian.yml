 TVA_run_the_grid_at_war_load_metrics_tt:0 "Нагрузка сети: §R+20§!. Открывает усиленную оружейную серию независимо от политического курса: большая партия ценой большего износа сети и расхода кадров. Уже оплаченная серия сохраняет прежние условия."
