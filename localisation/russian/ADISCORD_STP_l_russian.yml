 STP_counterintelligence_state_3_desc:0 "Партийная контрразведка блокирует подготовительные действия Шабрата в регионе §Y[3.GetName]§!.\n\nТаймер показывает, сколько осталось до окончания §Y56-дневной блокировки§!. По истечении срока действия снова станут доступны, если подготовка к восстанию ещё продолжается и в регионе нет других ограничений."
