 STP_party_election_medium_control_range: "Устойчивый перевес аппарата"
 STP_party_election_high_control_range: "Большинство за аппаратом"
 STP_party_election_total_control_range: "Делегаты поддерживают аппарат"
 STP_shabrat_election_low_control_range: "Небольшой перевес Шабрата"
 STP_shabrat_election_medium_control_range: "Устойчивый перевес Шабрата"
 STP_shabrat_election_high_control_range: "Большинство за Шабратом"
 STP_shabrat_election_total_control_range: "Делегаты поддерживают Шабрата"

 STP_shabrat_election_bop_category: "Партийные выборы"
 STP_shabrat_election_bop_category_desc: "Фокусы открывают политическую работу, но одних заявлений недостаточно. Раз в 35 дней делегаты сверяют полномочия: отсутствие действующей администрации в Монаии или Ниансасе отнимает по 8% легитимности Шабрата.\n\n§YПереход округов при расколе§!: обычный спорный округ идёт Шабрату при закреплённом влиянии и администрации, проработавшей 21 день; §G90% влияния сопротивления§! гарантируют переход и без администрации. Сильный мандат Шабрата §Yвыше 55%§! также забирает спорный округ. В Ниансасе после фокуса §Y«Дорога через Ниансас»§! можно провести специальную операцию при любом положительном перевесе легитимности Шабрата (§Y>0§!).\n\n§YПодозрение§!: при §Y50%§! открывается §Rвторая комиссия§! и партия может вести две проверки одновременно; §Y70%§! - кризисная стадия слежки; §R90%§! - Шабрат в оперативных списках; при §R100%§! Шабрат будет арестован, если ещё доступен. Уже состоявшийся арест необратим. При активной комиссии в первую очередь готовьте ложный след."
 STP_cw_negotiate_with_delegates: "Переговоры с делегатами"
 STP_cw_negotiate_with_delegates_desc: "За 14 дней согласовать поддержку колеблющихся делегатов. Переговоры занимают один слот подготовки. Новые переговоры доступны, пока преимущество нашей стороны на шкале легитимности меньше 55%: оставшихся убеждённых противников одной сделкой не переманить."
 STP_cw_open_election_campaign: "Открытая агитация"
 STP_cw_open_election_campaign_desc: "Публичная кампания занимает 21 день и один слот подготовки. За выборы можно провести три кампании: общую, окружную и заключительную. Вторая открывается после первых 35 дней выборов, третья - после 70 дней. Шабрату для второй нужна работающая 21 день администрация в Монаии или Ниансасе, для третьей - обе. Если требуемое управление утрачено до завершения, кампания срывается без возврата политических расходов.\n\nЗавершено кампаний: [?STP_cw_completed_public_campaigns|0] из 3."
 STP_cw_election_operation_slot_tt: "Есть свободный слот подготовки."
 STP_debug_increase_party_bop: "§RDEBUG:§! BOP: увеличить влияние партии на 25"
 STP_debug_increase_party_bop_desc: "Сдвигает баланс сил на §Y25 пунктов§! в сторону партийного аппарата."
 STP_debug_increase_shabrat_bop: "§RDEBUG:§! BOP: увеличить влияние Шабрата на 25"
 STP_debug_increase_shabrat_bop_desc: "Сдвигает баланс сил на §Y25 пунктов§! в сторону Шабрата."

 # Интерфейс
 STP_STATE_FACE_TITLE: "Здоровье лидера"

 STP_STATE_FACE_STAGE_1_loc: "Состояние устойчиво"
 STP_STATE_FACE_STAGE_2_loc: "Нарастающее истощение"
 STP_STATE_FACE_STAGE_3_loc: "Тяжёлая слабость"
 STP_STATE_FACE_STAGE_4_loc: "Критическое состояние"
 STP_STATE_FACE_STAGE_5_loc: "Смерть лидера"

 STP_STATE_FACE_STAGE_1_TOOLTIP:0 "§YСтадия 1/5 - устойчивое состояние§!\n\nИванов сохраняет работоспособность и лично удерживает аппарат. Его здоровье пока не создаёт дополнительного давления на устойчивость режима.\n\n£stability_texticon §YВлияние на стабильность:§! §G0%§!"
 STP_STATE_FACE_STAGE_2_TOOLTIP:0 "§YСтадия 2/5 - нарастающее истощение§!\n\nПоявляются признаки перегрузки. Аппарат ещё компенсирует слабость лидера дисциплиной, но сама зависимость системы от одного человека становится заметной.\n\n£stability_texticon §YВлияние на стабильность:§! §R-5%§!"
 STP_STATE_FACE_STAGE_3_TOOLTIP:0 "§YСтадия 3/5 - тяжёлая слабость§!\n\nИванов всё чаще действует через доверенных лиц, записи и подготовленные выступления. Внутри режима вопрос преемственности уже невозможно считать отвлечённой угрозой.\n\n£stability_texticon §YВлияние на стабильность:§! §R-10%§!"
 STP_STATE_FACE_STAGE_4_TOOLTIP:0 "§YСтадия 4/5 - критическое состояние§!\n\nФормальная вертикаль сохраняется, но её центр почти перестал функционировать. Элиты и силовики начинают готовиться к вакууму власти ещё при живом лидере.\n\n£stability_texticon §YВлияние на стабильность:§! §R-20%§!"
 STP_STATE_FACE_STAGE_5_TOOLTIP:0 "§YСтадия 5/5 - смерть лидера§!\n\nИванов больше не удерживает систему лично. Государственная машина продолжает двигаться по инерции, пока её участники решают, кому достанется оставшаяся власть.\n\n£stability_texticon §YВлияние на стабильность:§! [?STP_fading_father_stability_factor|=+0%]"

 # Гражданская война
 STP_cw_first_health_decline: "Произошло первое ухудшение здоровья Иванова"
 STS: "Стеланд"
 STS_DEF: "Стеланд"
 STS_ADJ: "Стеландск"
 SRP: "Союз Возрождения Окцидии"
 SRP_DEF: "Союз Возрождения Окцидии"
 SRP_ADJ: "Окцидийск"
 SRP_Federal_Council: "Союзный совет Окцидии"
 STP_cw_election_window: "Выборы нового председателя: 140 дней"
 STP_cw_election_window_desc: "Голосование длится §Y140 дней§!. Фокус «Затянуть избирательную комиссию» один раз продлевает текущее голосование и сверку полномочий на §Y80 дней§!. Шабрату нужно больше §Y10%§! легитимности в его сторону для победы и военного мандата. Выше §Y55%§! спорные округа переходят ему даже без готовой администрации. Поддержка не ниже §Y80%§!, признание командования и администрации Монаии и Ниансаса, непрерывно работающие не менее §Y21 дня§! к объявлению результата, позволят ограничить выступление партии столичным мятежом. Потеря администрации обнуляет её срок; после восстановления отсчёт начинается заново.\n\nПри расколе люди и оружие сначала выделяются подготовленным частям, затем базовым армиям. Остаток распределяется с преимуществом победителя выборов. Военная и политическая подготовка используют общие слоты; завершить начатые операции нужно до раскола."
 STP_cw_raise_district_network: "Расширить подпольную сеть в регионе [FROM.GetName]"
 STP_cw_raise_district_network_desc: "За §Y14 дней§! развернём связи в [FROM.GetName]. Укрепив сопротивление, можно привлечь местную администрацию; вместе они определят переход округа при расколе. Сверяйтесь с прогнозом на карте."
 STP_cw_prepare_rifle_cache: "Пополнить резерв сопротивления"
 STP_cw_prepare_rifle_cache_desc: "Во время выборов выделим £infantry_equipment_texticon §Y16000§! единиц с государственных складов в резерв Абилии. Доставка займёт §Y28 дней§!, £political_power_texticon §Y35§! политической власти и один слот подготовки; подозрения вырастут на 5. Общий резерв, включая груз в пути, ограничен §Y96000§! единицами. Только завершённый заказ целиком достанется сопротивлению. При расколе незавершённая поставка вернётся в государственный запас до его раздела; политическая власть не возвращается."
 STP_cw_disperse_network: "Залечь на дно"
 STP_cw_disperse_network_desc: "На §Y10 дней§! приостановим открытую работу и сменим связных. Повторная операция доступна через §Y30 дней§!."
 STP_cw_trigger_northern_incident: "Предъявить пограничные свидетельства"
 STP_cw_trigger_northern_incident_desc: "Опубликуем документы о подготовке вмешательства и потребуем их проверки. За £political_power_texticon §Y25§! действующая подготовка Нодрула один раз продлится на §G56 дней§!. Решение не отменяет уже начавшуюся интервенцию и не возобновляет закрытую подготовку."
 STP_cw_supply_the_north: "Северный груз: [FROM.GetName]"
 STP_cw_supply_the_north_desc: "За £pol_power §Y40§! отправим стране [FROM.GetName] £infantry_equipment_texticon §Y2400§! единиц снаряжения из наших запасов. Доставка занимает 21 день; следующая отправка этому получателю доступна после 42 дней отдыха. Одновременно в пути может находиться один груз.\n\nПолучатель должен продолжать войну с Нодрулом. При отмене оружие возвращается, расходы на организацию - нет. При расколе недоставленное оружие возвращается в общий запас Стеландера до его раздела. Поставка помогает северянам пополнять дивизии; срок интервенции она напрямую не меняет."
 STP_cw_start_uprising: "Начать восстание Шабрата"
 STP_cw_start_uprising_desc: "Пока Нодрул ведёт северную войну, можно начать досрочное выступление. После возвращения его армии эта возможность закроется. Восстание прервёт выборы и незавершённые операции; выборного мандата Шабрат не получит.\n\nПодготовка округов определит плацдармы, запасы и дополнительные части. Вы продолжите за Шабрата."
 STP_cw_cost_240_rifles: "£infantry_equipment_texticon §Y240§!"
 STP_cw_war_council: "Военный совет Стеландера"
 STP_cw_war_council_desc: "Совет распределяет людей, оружие и усилия штабов. Немедленная бригада быстрее выходит на фронт; учебный резерв требует 21 день, зато выпускает две подготовленные бригады. Наступление, оборона и перегруппировка исключают друг друга: приказ нельзя заменить до окончания его срока.\n\n§YНодрул:§! [STPGetNodStatus][STPGetKefreytArmyCommitment][STPGetRecoveryReport][STPGetPartySurvival]"
 STP_cw_raise_territorial_brigade: "Сформировать территориальную бригаду"
 STP_cw_raise_territorial_brigade_tt: "Из наших резервов будут выделены £manpower_texticon §Y6000§! человек и £infantry_equipment_texticon §Y600§! единиц пехотного снаряжения. В собственном контролируемом регионе появится §Y1 территориальная бригада§! из шести линейных батальонов с полным комплектом людей и оружия."
 STP_cw_raise_territorial_brigade_desc:0 "После мобилизационного реестра можно раз в 14 дней сформировать одну полностью укомплектованную территориальную бригаду за £political_power_texticon §Y25§!. Шабрат набирает добровольцев без расхода людей и оружия из запасов. Для партии и республик дополнительно требуются £manpower_texticon §Y6000§! человек и £infantry_equipment_texticon §Y600§! винтовок. Нужен собственный контролируемый регион. После мира срочные заказы закрываются."
 STP_CW_FORECAST_REPUBLICS: "§YОкцидия§!"
 STP_CW_FORECAST_RESISTANCE: "§GСопротивление Шабрата§!"
 STP_CW_FORECAST_PARTY: "§RПартийное правительство§!"
 STP_CW_FORECAST_REASON_OVERWHELMING: "\n§GПочему:§! сопротивление контролирует не менее §Y90%§! влияния. Такое абсолютное доминирование само гарантирует переход округа Шабрату."
 STP_CW_FORECAST_REASON_NIANSAS_SECURED: "\n§GПочему:§! областное управление Ниансаса уже перехвачено; при сохранении закреплённого влияния округ перейдёт Шабрату."
 STP_CW_FORECAST_REASON_SECURED: "\n§GПочему:§! условия передачи округа Шабрату уже выполнены."
 STP_CW_FORECAST_REASON_COUNTERINTELLIGENCE: "\n§RПочему пока партия:§! контрразведка закрыла региональную подготовку. Сам статус «сопротивление закрепилось» не равен передаче. Нужны уже готовая администрация, сильный мандат Шабрата выше 55% либо абсолютное влияние сопротивления не менее 90%."
 STP_CW_FORECAST_REASON_NIANSAS_ROUTE: "\n§YПочему пока партия:§! сопротивление в Ниансасе закрепилось, но отдельное основание передачи ещё не создано. Завершите §Y«Дорога через Ниансас»§!, удерживайте хотя бы минимальный перевес легитимности Шабрата (§Y>0§!) и проведите §Y«Перехватить областное управление»§!. Альтернативы: 90% влияния, готовая 21-дневная администрация или мандат выше 55%."
 STP_CW_FORECAST_REASON_ADMINISTRATION_RECENT: "\n§YПочему пока партия:§! администрация сопротивления уже создана, но ещё не проработала §Y21 день§!. Дождитесь готовности либо доведите влияние сопротивления до 90%."
 STP_CW_FORECAST_REASON_ADMINISTRATION: "\n§YПочему пока партия:§! влияние сопротивления закрепилось, но нет готовой администрации. Создайте её решением §Y«Найти подпись в нужном кабинете»§! и удержите 21 день. Альтернативы: 90% влияния или мандат Шабрата выше 55%."
 STP_CW_FORECAST_REASON_INFLUENCE: "\n§YПочему пока партия:§! сопротивление ещё не обеспечило передачу округа. Закрепите местное влияние и подготовьте основание передачи; при §Y90%§! влияния сопротивления округ перейдёт автоматически."
 STP_CW_CACHE_READY: "Оружейный тайник: §Y[?STP_cw_cached_rifles|0]§! ед."
 STP_CW_CACHE_PENDING: "Подготовка тайника: §Y[?STP_cw_pending_rifles|0]§! ед. в пути"
 STP_cw_defensive_preparation: "Подготовленная оборона"
 STP_cw_defensive_preparation_desc: "Штаб связал укрепления, резервы и маршруты подвоза в общий оборонительный план."
 STP_cw_offensive_preparation: "Приказы округам"
 STP_cw_offensive_preparation_desc: "Командиры заранее получили задачи на первые недели наступления. Запасов и темпа хватит лишь на короткий срок."
 ADISCORD_STP_preparation.1.t: "Когда дверь закрылась"
 ADISCORD_STP_preparation.1.d: "Доклад о положении республики шёл по привычному сценарию. Иванов сидел у карты, министры по очереди называли цифры, секретарь перекладывал папки слева направо. На середине доклада президент попросил повторить уже прочитанный абзац. Через несколько минут он потерял строку снова. Врач подошёл к столу и впервые не стал ждать разрешения.\n\nОставшиеся встречи отменили. Министров попросили выйти в соседний зал, а двери президентского кабинета закрылись. Хедерсетт почти сразу велел канцелярии направлять текущие бумаги через кабинет министров. Он говорил тихо, словно речь шла о временной перестановке в расписании.\n\nШабрат появился в коридоре до того, как успели разойтись последние чиновники. Под мышкой у него была папка без герба и регистрационного номера. Он просил десять минут наедине с Ивановым. Хедерсетт ответил, что президенту нужен покой. Никто из присутствующих не поверил, что спор идёт о здоровье.\n\nДо сегодняшнего дня государство могло делать вид, что наверху ничего не изменилось. Теперь даже право открыть одну дверь означало право говорить от имени будущего Стеландера."
 ADISCORD_STP_preparation.1.a: "Впустить Шабрата."
 ADISCORD_STP_preparation.3.t: "Последняя подпись"
 ADISCORD_STP_preparation.3.d: "Последний документ Пётр Иванов подписал вечером. Подпись вышла неровной, и секретарь на секунду задержал лист, будто собирался попросить президента расписаться ещё раз. Потом передумал.\n\nК утру кабинет был закрыт. Врачи вышли первыми. Следом появился Хедерсетт и попросил начальника канцелярии подготовить обращение к стране. Никаких торжественных слов он не предложил. Пётр Иванов, человек, с которым несколько поколений связывали окончание войны, умер ночью.\n\nНовость разошлась быстрее официального сообщения. У памятников начали появляться цветы. В горных округах звонили старые колокола. В министерствах чиновники продолжали ставить на документы печать с именем человека, которого уже не было в живых. Никто пока не знал, чем её заменить.\n\nХедерсетт принял текущие дела и созвал выборы нового председателя. Шабрат потребовал открыть процедуру для окружных делегатов и армии. Партийный аппарат начал проверять списки, гарнизоны и полномочия комиссий. Страна получила срок, в который ей предстояло решить вопрос, откладывавшийся весь мир Иванова: кому принадлежит власть после человека, на котором она держалась."
 ADISCORD_STP_preparation.3.a: "Страна проснулась без Иванова."
 ADISCORD_STP_preparation.4.t: "Оспоренный протокол"
 ADISCORD_STP_preparation.4.d: "Подсчёт закончили глубокой ночью. Последние листы внесли в протокол, печати проверили дважды, представители округов поставили подписи. Затем секретарь передал документ проигравшей стороне.\n\nПодписи не последовало.\n\nСначала спорили о нескольких мандатах. Потом о праве комиссии считать их действительными. Потом о том, имеет ли сам съезд право передавать страну человеку, которого часть армии не признаёт. Пока юристы спорили в зале, из гарнизонов уже приходили запросы, чьи распоряжения считать законными.\n\nВнешняя война успела изменить карту быстрее, чем канцелярия меняла положения о выборах. Некоторые администрации больше не контролировали территории, от имени которых голосовали. Некоторые части уже получали два взаимоисключающих приказа. Повторного голосования не будет.\n\nК рассвету стало ясно, что спор идёт уже не о протоколе. Бумага лишь зафиксировала момент, когда одна страна начала признавать две разные власти."
 ADISCORD_STP_preparation.4.a: "Протокол больше не был просто бумагой."
 ADISCORD_STP_preparation.10.t: "Северная кампания"
 ADISCORD_STP_preparation.10.d: "На карте перед Тобисом Бентликсом было два направления. К югу лежал Стеландер, где смерть Иванова превращала десятилетия нодрульского влияния в спорное наследство. На севере Юбор, Культ Детей Леса и Вольный Фронтир собирали оборонительный союз.\n\nГенеральный штаб предлагал решить северный вопрос первым. Пока эти государства сохраняли армии и общую границу, любое крупное движение на юг оставляло Нодрул уязвимым. Дипломаты возражали, что каждый месяц промедления даёт Шабрату время превратить сопротивление в правительство.\n\nБентликс долго смотрел не на стрелки наступления, а на Стеландер. Для Нодрула эта страна всегда была доказательством того, что договор, школа и правильный советник способны сделать больше, чем оккупационная армия. Если после смерти Иванова её придётся удерживать силой, сама идея такого порядка окажется под вопросом.\n\nСевер можно было попытаться закрыть быстро. Стеландер ждать не обещал."
 ADISCORD_STP_preparation.10.a: "Сначала обезопасить север."
 ADISCORD_STP_preparation.10.b: "Армия понадобится ближе к Стеландеру."
 ADISCORD_STP_preparation.13.t: "Нодрул поворачивает на север"
 ADISCORD_STP_preparation.13.d: "Первые сообщения пришли от железнодорожников. Эшелоны, которые обычно шли к южным складам, начали уходить на север. Затем разведка подтвердила переброску штабов и инженерных частей. Нодрул готовился к собственной войне.\n\nВ штабе Шабрата никто не называл северные государства союзниками. Они не воевали за Стеланд и едва ли интересовались его выборами. Но каждый батальон, который Бентликс отправлял против них, не мог одновременно перейти нашу границу.\n\nНа карте появились новые отметки. Впервые за весь кризис часы начали работать не только против нас. Никто не знал, как долго продлится это преимущество."
 ADISCORD_STP_preparation.13.a: "Чужая война дала нам время."
 ADISCORD_STP_preparation.14.t: "Север замолчал"
 ADISCORD_STP_preparation.14.d: "Несколько дней разведка ждала подтверждения, но северная кампания так и не началась. Приказы могли быть отменены в Нодруле, союз мог потерять смысл, а сама обстановка могла измениться раньше завершения мобилизации. Причина уже не имела значения.\n\nНа карте штаба булавки, которыми отмечали нодрульские части, снова начали двигаться к южным дорогам. Подготовка вмешательства в Стеландер не требовала открытой войны и могла продолжаться за закрытыми дверями.\n\nШабрат молча снял с карты несколько пометок, обозначавших выигранное время. Если партия не будет разбита быстро, следующая колонна на этой дороге может идти уже к нам."
 ADISCORD_STP_preparation.14.a: "Теперь часы идут только против нас."
 ADISCORD_STP_cw.20.t: "Запад после Стеландера"
 ADISCORD_STP_cw.20.d: "На карте Кефрейта появилась новая граница. Там, где ещё недавно стояло единое государство, теперь существовали партийная территория, сопротивление Шабрата и западные республики, отказавшиеся подчиняться обоим.\n\nВоенные видели возможность закончить старые территориальные споры. Контрактные управления смотрели на ту же карту иначе. Сопротивлению требовалось оружие, республикам требовалась оборона, а любой победитель однажды будет восстанавливать разрушенные дороги, шахты и склады. Война создавала несколько рынков одновременно.\n\nКефрейт мог готовить собственную операцию, ограничиться продажей вооружения одной из сторон или остаться в стороне. Ни один вариант не был нейтральным с точки зрения будущей границы. Нужно было лишь решить, какой риск страна готова записать в контракт."
 ADISCORD_STP_cw.20.a: "Готовить собственную операцию."
 ADISCORD_STP_cw.20.b: "Не входить в эту войну."
 ADISCORD_STP_cw.20.c: "Открыть оружейный канал для сопротивления."
 ADISCORD_STP_cw.20.committed: "Курс уже закреплён приказами и контрактами."
 STP_cw_val_mobilization_tt: "Начнётся 21-дневная мобилизация. По её завершении Кефрейт объявит отдельную войну Союзу Возрождения Окцидии, если обе страны останутся независимыми, вне фракций, в мире и с общей границей. [43.GetName], [44.GetName] и [88.GetName] можно получить только после победы; [45.GetName] исключён."
 VAL_cw_intervention_preparation: "Мобилизация против западных республик"
 VAL_cw_intervention_preparation_desc: "До окончания 21-дневного ультиматума Кефрейт и республики остаются в мире. Затем начнётся отдельная война между ними, если обе страны сохранят независимость, общую границу и не вступят в другую войну или фракцию. При изменении условий мобилизация отменяется."
 ADISCORD_STP_cw.23.t: "Итог восточной операции"
 ADISCORD_STP_cw.23.victory: "Армия Союза Возрождения Окцидии разбита. Регионы [43.GetName], [44.GetName] и [88.GetName] предназначены для временной договорной администрации под властью Кефрейта. Если республики продолжают другую войну или часть округов занята третьей стороной, передача откладывается до нормализации обстановки и завершается решением об учреждении администрации. Прямое присоединение округов потребует переписи и последующих фокусов интеграции.\n\nКонтрактный авторитет вырос на 5. Война с республиками завершена; другие войны и контракты сохраняются."
 ADISCORD_STP_cw.23.defeat: "Республики отбили наступление и принудили наш штаб прекратить операцию. Война с ними завершена без территориальных приобретений.\n\nКонтрактный авторитет снизился на 10. Правительству предстоит восстановить доверие к заказам и снабжению; другие войны и контракты сохраняются."
 ADISCORD_STP_cw.23.cancelled: "К моменту исполнения ультиматума цель или условия вмешательства изменились. Штаб отменил мобилизацию; война не началась. После восстановления условий новый приказ можно отдать через решение о мобилизации."
 ADISCORD_STP_cw.23.a: "Подвести итоги операции."
 ADISCORD_STP_cw.30.t: "Три власти, одна страна"
 ADISCORD_STP_cw.30.d: "В 05:40 утреннюю передачу государственного радио прервали. Диктор зачитал распоряжение партийного правительства о чрезвычайных мерах. Через семь минут на той же частоте появилась другая запись. Штаб Шабрата объявил, что правительство утратило право отдавать приказы. На западе советы сообщили о создании собственного союза.\n\nК открытию министерств Стеландер существовал уже в трёх версиях. Начальники станций решали, какие эшелоны пропускать. Командиры вскрывали запечатанные пакеты с приказами. В окружных администрациях снимали одни портреты и оставляли другие. Там, где решение не приняли вовремя, вооружённые люди принимали его за чиновников.\n\nБронзовый конгресс остался у партии. Абила перешла сопротивлению. Западные республики закрыли дороги для обеих сторон. Общая армия, созданная для защиты одной страны, начала делиться по гарнизонам, складам и личным обещаниям офицеров.\n\nВыбор, который месяцами делался в кабинетах и на карте влияния, теперь должен быть сделан открыто."
 ADISCORD_STP_cw.30.a: "[STPGetHandoffOption]"
 ADISCORD_STP_cw.30.b: "Возглавить сопротивление Шабрата."
 ADISCORD_STP_cw.30.c: "Защитить Союз Возрождения Окцидии."
 STP_cw_pay_officials: "Служащие лесного округа"
 STP_cw_pay_officials_desc: "Чиновники региона [53.GetName] подготовят передачу управления Шабрату. Выделенный политический ресурс позволит продолжить работу в округе. Взамен расходы на управление увеличатся на 10% на 70 дней; готовую администрацию ещё нужно защитить от проверок."
 STP_cw_repair_niansas: "Дорога через Ниансас"
 STP_cw_repair_niansas_desc: "Восстановим дорогу в регионе [3.GetName], чтобы движение грузов не зависело от личных распоряжений министров. Улучшим инфраструктуру, немного укрепим легитимность Шабрата и откроем специальную операцию §Y«Перехватить областное управление»§!.\n\nОперация доступна, когда сопротивление в Ниансасе закрепилось и легитимность хотя бы немного на стороне Шабрата (§Y>0§!). После её завершения округ получит отдельное основание перейти Шабрату. Если влияние сопротивления достигнет §G90%§!, операция уже не нужна: округ перейдёт автоматически."
 STP_cw_port_budget: "Портовые ассигнования"
 STP_cw_port_budget_desc: "Выделим средства в казну и подготовим складские маршруты Ниансаса. Если партия ликвидирует склад, открытое решение позволит подготовить маршруты заново за полную стоимость.\n\n§YВажно:§! подготовленное снабжение само по себе не передаёт округ. Передачу дают готовая 21-дневная администрация, §G90%§! влияния сопротивления, сильный мандат Шабрата выше §Y55%§! либо специальная операция, открываемая фокусом §Y«Дорога через Ниансас»§!."
 STP_cw_officer_contacts: "Разговоры без погон"
 STP_cw_officer_contacts_desc: "Эдмунд Равель согласится поддержать Шабрата. При расколе он перейдёт к сопротивлению."
 STP_cw_prepare_capital_sabotage: "Заряды у Конгресса"
 STP_cw_prepare_capital_sabotage_desc: "Связи среди столичных служащих позволяют подготовить удар по управлению гарнизоном."
 STP_cw_prepare_industry_sabotage: "Срыв смен Крейдена"
 STP_cw_prepare_industry_sabotage_desc: "Завербованные работники Крейдена подготовят удар по промышленному снабжению партии. Фокус открывает отдельную операцию на 14 дней за 10 политической власти и 240 винтовок. Если подготовленный округ останется у партии при расколе, два уровня гражданских предприятий будут повреждены, а военное производство получит штраф на 70 дней."
 STP_cw_district_printing: "Окружные типографии"
 STP_cw_district_printing_desc: "Типографии обеспечат общую избирательную кампанию и связь между окружными организациями. Появится возможность вести вторую подготовительную операцию одновременно с первой."
 STP_cw_local_council_envoys: "Посланники к советам"
 STP_cw_local_council_envoys_desc: "Признаем советы Ливонинского округа стороной переговоров. Их влияние вырастет на 10, мы получим 35 политической власти. Для перехода округа к Шабрату ещё потребуется соглашение об автономии; без него укрепление советов помогает республикам."
 STP_cw_autonomy_guarantees: "Ратифицировать договор"
 STP_cw_autonomy_guarantees_desc: "Советы уже заключили оплаченный договор о переходе Ливонинского округа к Шабрату. Закрепим его за 21 день: партийные проверки больше не смогут отменить это соглашение. Одновременно гарантируем самостоятельность отделившимся западным советам. После раскола сможем оплачивать их снабжение против Кефрейта, а после победы придётся определить судьбу гарантий. Остальные активы Ливонинского округа останутся уязвимыми."
 STP_cw_northern_dossier: "Внешние связи"
 STP_cw_northern_dossier_desc: "Разведка по армии Нодрула вырастет на 15, по гражданским службам - на 10. Штаб получит 25 политической власти, а посредники установят связь с советами пограничных округов. На севере можно подготовить дипломатическую отсрочку либо наладить поставки оружия. После поставок откроется стол помощи: укрепления, инженеры и диверсии в тылу Нодрула. Отдельные переговоры откроют соглашение с Кефрейтом и подготовку местных добровольцев."
 STP_cw_seize_vorkerland_stores: "Склады распавшейся конфедерации"
 STP_cw_seize_vorkerland_stores_desc: "После распада Воркерланда брошенные склады на стеландерской стороне можно изъять без сделки с претендентами. В запас поступят £infantry_equipment_texticon §Y1200§! единиц снаряжения, штаб получит 35 политической власти."
 STP_cw_seize_vorkerland_accounts: "Замороженные счета Воркерланда"
 STP_cw_seize_vorkerland_accounts_desc: "Конфедеративные расчётные счета на нашей стороне больше некому защищать. Правительство распорядится передать эти средства под управление местного казначейства."
 STP_cw_border_evidence: "Пограничные свидетельства"
 STP_cw_border_evidence_desc: "Соберём приказы, показания пограничников и сведения о подготовке вмешательства. Штаб получит 75 политической власти, 15 командной, +20 к разведданным об армии и +15 к гражданским сведениям Нодрула. Документы позволят открыть общий стол помощи северу, а их публикация даст Шабрату значительно больше времени до вмешательства."
 STP_cw_arm_the_north: "Вооружить север"
 STP_cw_arm_the_north_desc: "Сразу выделим £infantry_equipment_texticon §Y7200§! единиц снаряжения и 60 политической власти. Когда начнётся война, можно будет выбрать получателя и отправить ему ещё 2400 единиц из запасов. После этого фокуса откроется стол помощи северу. Канал поставок останется у сопротивления."
 STP_cw_northern_desk: "Стол помощи северу"
 STP_cw_northern_desk_desc: "После вооружения союзников или подготовки пограничного досье откроем отдельную службу помощи северному союзу. Разведка по армии Нодрула вырастет на 10, штаб получит 50 политической власти и 15 командной. Пока Нодрул существует, можно строить укрепления на его фронте, направлять инженерные группы и проводить диверсии в тылу. Стол остаётся у Шабрата после раскола; слоты подготовки он не занимает."
 STP_cw_northern_desk_tt: "Открывается категория §YПомощь северу§!. Укрепления и инженеры доступны на действующем северном фронте. Диверсии против Нодрула можно вести и во время гражданской войны."
 STP_cw_northern_observers_tt: "При начале северной войны обновим разведданные об армии Нодрула на §G15§!. После раскола свежие сведения получит §Yсопротивление§!: §G+15§! к разведданным об армии Нодрула."
 STP_cw_cabinet_archives: "Ведомственные документы"
 STP_cw_cabinet_archives_desc: "Через служащих получим списки назначений, ведомости и закрытые счета. Новые посредники усилят сеть сторонников. Затем документы можно опубликовать или использовать в переговорах с министрами."
 STP_cw_expose_the_cabinet: "Открыть закрытые счета"
 STP_cw_expose_the_cabinet_desc: "Публикация счетов укрепит поддержку Шабрата и даст его штабу средства для политической работы. Партия отнесётся к действиям окружных организаторов с большим подозрением. Закрытая сделка с министрами после публикации станет невозможна."
 STP_cw_buy_silence: "Договориться с министрами"
 STP_cw_buy_silence_desc: "Часть кабинета согласится сотрудничать в обмен на сохранение выплат. Мы получим больше политического ресурса для переговоров и снизим подозрения партии, но поддержка избирателей вырастет слабее, чем после публичного разоблачения. Расходы на управление увеличатся на 10% на 70 дней."
 STP_cw_unified_headquarters: "Приказы из одного штаба"
 STP_cw_unified_headquarters_desc: "Сведём отряды под общее командование. Организация армии увеличится ещё на 3%, скорость планирования - на 5%. Довоенная подготовка офицеров сохранится; эти меры дополнят её."
 STP_cw_open_conscription: "Открыть призыв"
 STP_cw_open_conscription_desc: "Штаб сопротивления вводит закон «Расширенный призыв» вместо добровольцев или ограниченного набора. Новые резервисты прибывают постепенно, а подготовка пополнений занимает больше времени."
 STP_cw_wartime_laboratories: "Военные лаборатории"
 STP_cw_wartime_laboratories_desc: "Сведём конструкторские бюро и заводские лаборатории в одну военную программу. Откроется вторая ячейка исследований на 180 дней. Если гражданская власть вернётся раньше, программа закроется вместе с военным режимом."
 STP_cw_wartime_laboratories_tt: "Вторая ячейка действует 180 дней. После возвращения гражданской власти программа уже недоступна и немедленно закрывается."
 STP_cw_wartime_laboratories_available_tt: "Гражданская власть ещё не вернулась."
 STP_cw_emergency_laboratories_cancel_tt: "Гражданская власть вернулась."
 STP_cw_mobilization_register: "Мобилизационный реестр"
 STP_cw_mobilization_register_desc: "Реестр открывает два способа пополнения. Территориальная бригада выходит немедленно за 25 политической власти, 6000 людей и 600 винтовок. Учебный резерв за 40 политической власти занимает 12000 людей и 1200 винтовок на 21 день и выпускает две бригады с начальным опытом 30%."
 STP_cw_wartime_arsenals: "Арсеналы военного времени"
 STP_cw_wartime_arsenals_desc: "Мастерские столицы переходят на военное производство. Два новых завода и дополнительные смены на 140 дней поддержат пополнение фронта. Из ремонтных запасов поступят 2000 винтовок и 120 орудий. Военный совет сможет выкупать готовые партии оружия за деньги и расширять арсеналы в подконтрольных регионах."
 STP_cw_supply_routes: "Дороги к фронту"
 STP_cw_supply_routes_desc: "Расширим дорожную сеть и наладим подвоз. Служба снабжения сократит потребление припасов армией на 8%. Военный совет сможет на 21 день перевести фронт на перегруппировку: части восстановят силы, пожертвовав наступательным темпом."
 STP_cw_congress_in_session: "Конгресс продолжает заседание"
 STP_cw_congress_in_session_desc: "Укрепим подступы к Бронзовому конгрессу и подчиним войска единому командованию. Организация армии вырастет на 5%, скорость планирования - на 10%, но потребление припасов увеличится на 5%. Подготовка снабжения поможет покрыть этот расход."
 STP_cw_guard_the_pier: "Удержать набережную"
 STP_cw_guard_the_pier_desc: "Порт Нижнего рынка должен удерживать свой участок фронта даже после потери Конгресса. Штаб откроет оборонительный план на 35 дней за 25 командного ресурса. Приказ требует контроля самого порта; повторное применение возможно через 56 дней, после окончания другого фронтового плана."
 STP_cw_road_to_fada: "Открыть дорогу на Фаду"
 STP_cw_road_to_fada_desc: "Улучшим дорогу на контролируемом подступе и организуем смену передовых частей. Если Ниансас наш, работа пойдёт там; иначе - в любом собственном округе с незавершённой сетью. Откроется приказ о перегруппировке фронта: его можно использовать перед наступлением на Фаду."
 STP_cw_last_banquet: "Последний банкет"
 STP_cw_last_banquet_desc: "Штаб составит одноразовый план наступления на Бронзовый конгресс. За £command_power_texticon §Y25§! начнётся 21-дневная операция: цель - контроль Бронзового конгресса. Успех в этот срок фиксируется. Если срок истечёт без контроля Бронзового конгресса, поддержка войны упадёт на 10 п.п. Перед приказом пополните ударные дивизии: план не заменит недостающие орудия и винтовки."
 STP_cw_line_formations: "Линейные бригады"
 STP_cw_line_formations_desc: "Организуем линейные бригады: шесть батальонов как исходный штат, который можно менять в конструкторе. Организация армии вырастет ещё на 4%. Штаб получит 25 опыта и 20 командного ресурса для следующих приказов."
 STP_cw_capital_counteroffensive: "Общее контрнаступление"
 STP_cw_capital_counteroffensive_desc: "Оперативный директорат сможет начать общий удар только после завершения всех трёх этапов реорганизации. Действующее правительство может находиться в Конгрессе или вне столицы. На 28 дней армия получит подготовку наступления; штаб - 10 опыта и 20 командного ресурса."
 STP_cw_inner_ring: "Внутреннее кольцо"
 STP_cw_inner_ring_desc: "Тыловые управления и гарнизон сведут оборону городских кварталов в одно кольцо. Укрепления строятся только в удерживаемых нами узлах столицы. Потерянный квартал не получает бесплатных сооружений для противника."
 STP_cw_assault_columns: "Штурмовые колонны"
 STP_cw_assault_columns_desc: "Развернём подготовку штурмовых колонн вслед за общим планом наступления. Фокус занимает семь дней и открывает повторяемый заказ усиленной дивизии, чтобы не израсходовать весь период подготовки на согласования. Люди, техника и деньги выделяются из настоящих резервов; неподъёмный заказ остаётся видимым."
 STP_cw_assault_columns_order_tt: "Если есть £manpower_texticon §Y7900§!, £infantry_equipment_texticon §Y610§! и полный комплект поддержки, будет сформирована §Y1 усиленная дивизия§!. Иначе приказ не спишет резервы."
 STP_cw_harbour_batteries: "Батареи набережной"
 STP_cw_harbour_batteries_desc: "Береговые батареи и городская ПВО прикроют Нижний рынок. Эта работа подчинена портовому штабу и не требует предварительно завершать внутреннее кольцо. Нужно владеть столичной областью и удерживать сам порт; склады получат 40 комплектов зенитного вооружения."
 STP_cw_cut_capital_roads: "Перерезать столичные дороги"
 STP_cw_cut_capital_roads_desc: "Ударим по подвозу Фады. Пока столица не наша, её дорожная сеть получит повреждение. На 28 дней атака вырастет на 8%, скорость планирования - на 10%. Штаб получит 15 командного ресурса."
 STP_cw_district_levies: "Окружной набор"
 STP_cw_district_levies_desc: "Откроем набор в контролируемых округах: 12000 людей и 1200 винтовок поступят в запас и сразу пойдут на две линейные бригады, если хватит контроля и текущей цены."
 STP_cw_district_levies_order_tt: "Если после поступления резерва хватит людей, винтовок и контролируемой земли, будут сформированы §Y2 линейные бригады§!. Иначе люди и оружие останутся в запасе."
 STP_cw_government_quarter_assault: "Штурм правительственного района"
 STP_cw_government_quarter_assault_desc: "Согласуем артиллерию и штурмовые части против Бронзового конгресса. На 21 день атака вырастет на 15%, прорыв на 20%, скорость планирования на 10%. На склады поступят 60 орудий, штаб получит 25 командного ресурса."
 STP_cw_hold_resource_belt: "Удержать ресурсный пояс"
 STP_cw_hold_resource_belt_desc: "Укрепим снабжение Крейдена, Монаии или Аблии. Потребление припасов армии снизится на 5%. Если в выбранном округе ещё есть запас дорог, будет построена одна ступень инфраструктуры."
 STP_cw_mountain_staff: "Штаб перевалов"
 STP_cw_mountain_staff_desc: "Сведём отряды советов под одно командование. Восстановление организации вырастет на 8%. Штаб получит 15 опыта и 15 командного ресурса."
 STP_cw_pass_watch: "Заставы на перевалах"
 STP_cw_pass_watch_desc: "Укрепим столичный узел республик и откроем приказ обороны западного рубежа. Укрытие появится у [43.GetName]."
 STP_cw_hold_the_passes: "Держать перевалы"
 STP_cw_hold_the_passes_desc: "Переведём армию на оборону на 35 дней: защита +15%, атака -15%, скорость -10%. Если удерживаем [44.GetName], там появится дополнительное укрытие."
 STP_cw_raid_the_approaches: "Удар по подходам"
 STP_cw_raid_the_approaches_desc: "Соберём силы для вылазки против Кефрейта. На 28 дней атака вырастет на 8%, скорость планирования - на 10%. Штаб получит 20 командного ресурса."
 STP_cw_federal_defence: "Совместная оборона республик"
 STP_cw_federal_defence_desc: "Советы сохранят самостоятельные отряды и наладят их смену на передовой. Потребление припасов сократится на 8%, восстановление организации ускорится на 10%, но её максимальный уровень снизится на 5%. Такая армия лучше переносит перегруппировки, чем непрерывный бой."
 STP_cw_western_frontier: "Западный рубеж"
 STP_cw_western_frontier_desc: "Укрепим столичный узел и подготовим план обороны республик на §Y35 дней§!. Его можно ввести за £command_power_texticon §Y25§!, пока мы контролируем [43.GetName] и воюем с Кефрейтом. Повторный приказ доступен через §Y56 дней§! после предыдущего; действующие наступление, оборона или перегруппировка должны закончиться."
 STP_cw_first_postwar_budget: "Первый мирный бюджет"
 STP_cw_first_postwar_budget_desc: "Победитель возвращает государственные расходы к обычному мирному бюджету. Внешние войны и конфликт горных республик не блокируют послевоенное восстановление победителя гражданской войны."
 STP_cw_restore_civil_authority: "Вернуть гражданскую власть"
 STP_cw_restore_civil_authority_desc: "Вернём управление гражданским ведомствам. Политическая сеть и чрезвычайные полномочия кабинета будут распущены. В Стеландере завершится кризис преемственности: штраф к стабильности после смерти Иванова будет снят. Накопленные улучшения военного управления сохранятся."
 STP_cw_uprising_conditions_tt: "Подготовлен приказ, идут выборы и сохранены исходные территории Стеландера. Нодрул ведёт войну хотя бы с одной действующей северной армией."
 STP_cw_external_intervention: "Внешнее вмешательство"
 STP_cw_external_intervention_desc: "Решения Нодрула и Кефрейта определяют их участие в конфликтах на территории бывшего Стеландера."
 STP_cw_northern_aid: "Помощь северу"
 STP_cw_northern_aid_desc: "Отдельная служба Шабрата для северного союза. Укрепления и инженеры работают только на фронте против Нодрула. Диверсии в его тылу можно вести и во время гражданской войны. Поставки оружия остаются во внешнем вмешательстве."
 STP_cw_nod_warning: "[STPGetNodReadinessTitle]"
 STP_nod_readiness_north: "Нодрул воюет на севере"
 STP_nod_readiness_mobilization: "Нодрул мобилизует северный фронт"
 STP_nod_readiness_intervention: "Нодрул готовит интервенцию!"
 STP_cw_nod_warning_desc: "§YСейчас:§! [STPGetNodStatus]\n\nЭтот отсчёт показывает готовность штаба к будущему вмешательству в Стеландере, а не срок нападения на Юбору. Подготовка идёт параллельно северной кампании. По истечении срока Нодрул готов к выступлению, но северный фронт блокирует вступление; после окончания северной войны нужны ещё семь дней на переброску.\n\nПобедите партию или возьмите Бронзовый конгресс в срок «Последнего банкета», чтобы сорвать интервенцию. Подготовленные пограничные свидетельства позволяют один раз задержать готовность на десять дней; оружие северным противникам помогает им удерживать настоящую линию фронта."
 STP_cw_val_ultimatum: "Ультиматум Кефрейта: 21 день"
 STP_cw_val_ultimatum_desc: "Кефрейт отдал приказ о мобилизации против Союза Возрождения Окцидии. До конца 21-дневного ультиматума республики остаются в мире. Затем начнётся отдельная война, если обе страны сохранят независимость, общую границу и не вступят в другую войну или фракцию. Потеря западных территорий возможна только после военного поражения."
 STP_cw_nod_northern_diversion: "Нодрул готов, но связан на севере"
 STP_cw_nod_northern_diversion_desc: "Подготовка интервенции завершена. Нодрул не может вступить, пока против него держится хотя бы одна северная армия. После окончания северной войны останется семь дней на переброску. Нового полного срока подготовки не будет."
 STP_cw_nod_intervention_cancelled: "Вмешательство Нодрула недоступно"
 STP_cw_nod_intervention_cancelled_desc: "Нодрул не сможет вступить на стороне партии в этой гражданской войне. Причиной может быть его поражение на севере, разгром партии, подчинение участников или срыв условий вступления. Отменённая подготовка не возобновится; повторная интервенция в этот конфликт не предусмотрена."
 STP_cw_nod_intervention_entered: "Нодрул вступил в войну"
 STP_cw_nod_intervention_entered_desc: "Войска Нодрула воюют на стороне партии против сопротивления. Северная стратегия дала нам время, но теперь придётся удерживать расширившийся фронт."
 ADISCORD_STP_cw.40.t: "Слишком много грузовиков"
 ADISCORD_STP_cw.40.d: "Сначала посредники сообщили о дополнительных топливных цистернах возле южных складов Нодрула. Затем появились новые госпитальные места, запасные мостовые секции и карты наших дорог. Ни один из этих предметов сам по себе не доказывал подготовку интервенции. Вместе они оставляли мало пространства для другой версии.\n\nПравительство Бентликса ещё ничего не объявило. Именно так Нодрул и предпочитал действовать. Решение должно выглядеть неизбежным только после того, как вся необходимая работа уже закончена.\n\nСеверная война способна удержать его армию, но не его штабных офицеров и склады. Если партия продержится достаточно долго, границу пересекут не импровизированные добровольцы, а армия, которая готовилась заранее.\n\nИнтервенция начинается задолго до первого солдата на нашей земле."
 ADISCORD_STP_cw.40.a: "Значит, считать нужно не заявления, а эшелоны."
 ADISCORD_STP_cw.41.t: "Советники переходят границу"
 ADISCORD_STP_cw.41.d: "Утром пограничный пост сообщил о первой колонне. Через несколько минут связь оборвалась. К полудню подтверждения пришли сразу из трёх районов. Нодрульские части получили приказ вступить в войну на стороне партийного правительства.\n\nДесятилетиями столица называла людей Бентликса советниками, наблюдателями, юристами и гарантами. Их присутствие объясняли ценой мира и особенностями Фадского порядка. Теперь спор о словах закончился. Советник пересёк границу в бронемашине.\n\nПартийное командование получило внешнюю армию. Для сопротивления война перестала быть только борьбой за наследство Иванова. Если Стеланд когда-нибудь собирался доказать, что способен существовать без чужого мандата, момент оказался хуже всех возможных."
 ADISCORD_STP_cw.41.a: "Теперь договоры говорят языком артиллерии."
 ADISCORD_STP_cw.42.t: "Приготовления на южной границе"
 ADISCORD_STP_cw.42.d: "Юристы принесли Бентликсу проект документа раньше, чем военные закончили оценку сил. В нём не было слова «вторжение». Предполагалась помощь законному правительству Стеландера по его просьбе, защита действующих соглашений и восстановление порядка. Место для подписи стеландерской стороны пока оставалось пустым.\n\nТак Нодрул строил своё влияние десятилетиями. Сначала создавался институт, затем договор, затем человек, который мог поставить под ним нужную подпись. Гражданская война лишь делала последний шаг менее изящным.\n\nПоддержка партии сохранит систему, созданную при Иванове. Цена теперь будет измеряться не грантами, советниками и кредитами, а мобилизованными частями и возможными потерями. Отказ означает допустить, что Стеландер впервые за поколение сможет определить исход внутреннего кризиса без нодрульского решения."
 ADISCORD_STP_cw.42.a: "Подготовить помощь партийной армии."
 ADISCORD_STP_cw.42.b: "Не превращать влияние в оккупацию."
 ADISCORD_STP_cw.42.c: "Бронзовый конгресс уже потерян. Закрыть проект."
 STP_cw_nod_consent_tt: "Начнётся независимая подготовка интервенции на §Y135 дней§!. Северная война блокирует вступление, но не отсчёт. После окончания северной кампании войскам нужны §Y7 дней§! на переброску. Разгром партии или поражение Нодрула отменит вмешательство."
 NOD_cw_intervention_preparation: "Подготовка помощи партийной армии"
 NOD_cw_intervention_preparation_desc: "Подготовка продолжается независимо от выборов и войны на севере. После её завершения армия готова поддержать партийные силы. Вступление требует окончания северной войны, семи дней переброски и продолжающихся боёв партии с Шабратом."
 STP_cw_nod_neutrality: "Нодрул сохраняет нейтралитет"
 STP_cw_nod_neutrality_desc: "Правительство Нодрула отказалось участвовать в гражданской войне. Освобождение его армии на севере больше не запустит подготовку вмешательства."
 ADISCORD_STP_cw.43.t: "Последний приказ операции"
 ADISCORD_STP_cw.43.victory: "Партийная администрация снова контролирует основные центры Стеландера. Нодрульские части получили приказ остановить наступление и передать занятые районы её чиновникам. Аннексии не будет. Она и не была целью.\n\nДля Бентликса важнее другое. На карте по-прежнему существует отдельный Стеландер, но его правительство знает, чья армия сохранила ему власть. Иногда зависимость работает лучше всего именно тогда, когда на границе снова можно поднять чужой флаг."
 ADISCORD_STP_cw.43.withdrawal: "Партийная армия рассыпалась раньше, чем Нодрул смог изменить исход войны. Без правительства, которое можно было бы поддерживать, юридическая конструкция операции потеряла смысл. Штаб отдал приказ о выходе.\n\nКолонны уходят теми же дорогами, по которым вошли. В Стеландере останутся погибшие, брошенные склады и очень простой вывод: впервые за десятилетия решение Нодрула оказалось недостаточным."
 ADISCORD_STP_cw.43.defeat: "Операция закончилась поражением. Части Нодрула не смогли восстановить власть партии и получили приказ прекратить боевые действия. В Палате уже готовят формулировки, в которых не будет слов «провал» и «отступление».\n\nНо документы не изменят главного. Стеландер, который десятилетиями служил витриной нодрульской модели влияния, вышел из кризиса вопреки воле её создателей."
 ADISCORD_STP_cw.43.a: "Закрыть оперативное дело."

 ADISCORD_STP_preparation.1.b: "Кабинет должен удержать управление."

 STP_cw_first_decline_tt: "Состоится приём у Иванова. Его здоровье впервые ухудшится; в событии мы выберем Шабрата или партию."

 STP_cw_branch_choice_tt: "Выбор сделан в событии первого ухудшения здоровья Иванова. Доступна подготовка выбранной стороны."
 STP_cw_army_split_tt: "Абилия всегда перейдёт Шабрату. Текущий план формирований - в категории «Битва за Стеландер»; фактические силы ограничат люди и оружие."
 STP_cw_party_preparation_tt: "Откроется карта регионов. В сводке появится §Yверность аппарата§! вместо подозрений спецслужб. Подполье начнёт работу в одном из округов. Проверки командования откроет фокус «Партийная дисциплина». Абилия всегда перейдёт Шабрату; план формирований - в той же категории."

 STP_cw_officers_tt: "При расколе §YЭдмунд Равель§! перейдёт к Шабрату. Сопротивление получит 10 опыта армии и £command_power_texticon §Y15§!."

 STP_cw_young_officers_tt: "При расколе §YСеверин Дрейк§! перейдёт к Шабрату. Сопротивление получит 15 опыта армии."

 STP_cw_operation_slot_tt: "Слот подготовки: +1. Политические и военные операции делят один пул."

 STP_cw_livonn_agreement_tt: "Договор о переходе §Y[45.GetName]§! к Шабрату проверки больше не снимут. Остальные активы округа уязвимы. После гражданской власти Шабрат решит судьбу хартии."


 STP_cw_local_recruits_tt: "Подготовим две постоянные бригады сопротивления. Каждая требует £manpower_texticon §Y4000§! и £infantry_equipment_texticon §Y320§! из его запасов; людей зарезервируем до общего распределения."

 STP_cw_reserve_brigade_tt: "£infantry_equipment_texticon §Y16000§! единиц снаряжения будут списаны с государственных складов и зарезервированы в Абилии для сопротивления. При расколе план позволит развернуть две дополнительные бригады при наличии людей и оружия в его резервах. Запас и место на складах проверяются повторно при завершении фокуса."

 STP_cw_pending_staff_tt: "Показанное «Военное управление» получит сопротивление после раскола. До него партийная армия этот бонус не получает."
 STP_cw_warehouse_service_tt: "Показанное улучшение снабжения получит вся армия сопротивления после раскола; оно сохранится после войны."

 STP_cw_supply_depot_tt: "Влияние сопротивления в §Y[46.GetName]§!: §C+10§!. Склад можно подготовить отдельным решением."
 STP_cw_niansas_administration_tt: "В регионе §Y[3.GetName]§! подготовлена администрация сопротивления. Она помогает сохранить гражданское управление и передать округ при достаточной местной поддержке. Партийная проверка может сорвать договорённость."
 STP_cw_early_orders_tt: "Дух получит сопротивление с первого дня войны. Штаб также получит 10 опыта армии и £command_power_texticon §Y15§!."

 STP_cw_secure_niansas_tt: "В §Y[3.GetName]§! изымаются тайники и снимаются подготовленные подпольем чиновники. Влияние партии: §0+15§!. Защита от работы связных: §Y56§! дней. Проверка проводится только в принадлежащих нам подконтрольных округах, открытых для операций."

 STP_cw_secure_garrisons_tt: "В §Y[2.GetName]§! и §Y[29.GetName]§! изымаются тайники и разрываются связи подполья. Влияние партии: §0+15§! в каждом. Окружные операции блокируются на §Y56§! дней. При расколе каждый из этих округов, оставшийся у партии, позволит сформировать две дополнительные бригады. На каждую нужны £manpower_texticon §Y4000§! человек и £infantry_equipment_texticon §Y320§! единиц снаряжения из её резервов. Проверка проводится только в принадлежащих нам подконтрольных округах, открытых для операций."

 STP_cw_secure_depots_tt: "В §Y[46.GetName]§! и §Y[53.GetName]§! изымаются тайники и разрываются связи подполья. Влияние партии: §0+15§! в каждом. Защита от работы связных: §Y56§! дней. Проверка проводится только в принадлежащих нам подконтрольных округах, открытых для операций."

 STP_cw_party_reserve_tt: "При расколе партия сможет сформировать две дополнительные бригады. Каждая потребует £manpower_texticon §Y4000§! человек и £infantry_equipment_texticon §Y320§! единиц снаряжения из её резервов."

 STP_cw_party_defence_tt: "Дух получит партия с первого дня войны."

 STP_cw_kefreyt_offer_tt: "Кефрейт получит запрос на §Yтри усиленные добровольческие дивизии§! для армии Шабрата. При согласии он оплатит их из собственных резервов. Готовые части прибудут при расколе; при нехватке резервов Кефрейт продолжит комплектование и сможет отправить их уже во время войны. После её завершения контингент будет отозван; состав и набор закреплены."



 STP_cw_check_district_command: "Проверить окружное командование: [FROM.GetName]"

 STP_cw_check_district_command_desc: "За 21 день изымем тайники, снимем завербованных чиновников и разорвём связи с гарнизоном. Влияние партии вырастет на 15; верность аппарата - на 4. Окружные операции подполья будут заблокированы на 56 дней. Найденные структуры сдвинут легитимность на 4% к партии, пустая проверка - на 2% к Шабрату. Операция занимает один слот.\n\nВ Новой Монаии и Крейдене дополнительно подготовим партийные гарнизоны: при сохранении округа за партией каждый позволит оплатить ещё две территориальные бригады из её запасов."

 ADISCORD_STP_preparation.6.t: "Посланник Шабрата"

 ADISCORD_STP_preparation.6.d: "Посланник прибыл без дипломатического кортежа и попросил встречи не с министром, а с управлением контрактных сил. Он положил на стол одну папку. Внутри находился точный перечень людей, вооружения и транспорта, необходимого для трёх усиленных дивизий.\n\nПросьба была необычно прямой. Шабрат не требовал вступления Кефрейта в войну и не предлагал территорию. Части должны перейти под его командование только после открытого раскола Стеландера, а затем вернуться домой. Юристы несколько раз перечитали условия, пытаясь найти скрытое обязательство. Его не было.\n\nВоенные видели в документе другое. Если Стеландер развалится, три готовые дивизии могут решить больше, чем месяцы дипломатии. А первый принятый запрос почти неизбежно создаст второй. Кефрейт редко инвестирует в чужую войну ради благодарности, но иногда достаточно получить право присутствовать за столом, когда победитель начнёт считать долги."

 ADISCORD_STP_preparation.6.a: "Подготовить контингент."

 ADISCORD_STP_preparation.6.b: "Не связывать Кефрейт с чужим кризисом."

 ADISCORD_STP_preparation.7.a: "Принято."

 ADISCORD_STP_preparation.8.t: "Ответ Кефрейта"

 ADISCORD_STP_preparation.8.accepted: "Ответ пришёл на плотной бумаге без приветствия. Запрос принят. Людей вывели из текущего резерва, технику начали собирать на отдельных складах, а штаб получил приказ держать соединения вне публичных списков до раскола Стеландера.\n\nВ конце стояла одна строка: «Передача командования состоится при наступлении согласованных обстоятельств». Для Кефрейта этого было достаточно."

 ADISCORD_STP_preparation.8.refused: "Папка вернулась закрытой. На первом листе стояла короткая резолюция: «Ресурсы не выделять». Никаких политических объяснений Кефрейт не приложил.\n\nДля штаба Шабрата отказ означал простую вещь. Всё, что не придёт через границу, придётся найти внутри страны."

 STP_cw_abila_reserve: "Резерв Абилии"
 STP_cw_abila_reserve_desc: "За 28 дней подготовим резервистов и переведём £infantry_equipment_texticon §Y16000§! единиц снаряжения на склад Абилии. При расколе сопротивление сможет развернуть две дополнительные бригады, оплатив их из собственных людей и оружия. Запас в Абилии не участвует в общем разделе государственных складов."
 STP_cw_warehouse_inventory: "Складская служба"
 STP_cw_warehouse_inventory_desc: "Снабженцам нужны согласованные заявки, надёжные кладовщики и порядок выдачи имущества. Подготовим эту службу для будущей армии сопротивления. Запасы оружия можно пополнять отдельными решениями."
 STP_cw_supply_officers: "Офицеры снабжения"
 STP_cw_supply_officers_desc: "Снабженцы согласуют выдачу имущества будущим частям. Сейчас укрепятся связи в регионе [46.GetName] и откроется подготовка окружного склада. Для склада потребуются время, средства и сохранение местных связей."
 STP_cw_district_administration: "Администрация Ниансаса"
 STP_cw_district_administration_desc: "Чиновники региона [3.GetName] признают штаб Шабрата стороной переговоров. Подготовленная администрация укрепит его избирательный мандат и сможет передать управление после объявления результата. Договорённость действует, пока партийная комиссия не сменит местных служащих."
 STP_cw_courier_service: "Служба связных"
 STP_cw_courier_service_desc: "Постоянные связные улучшат работу сети сторонников и доставку документов. Штаб получит дополнительный политический ресурс, а осторожная передача распоряжений снизит подозрения партии. Дополнительный слот позволит одновременно вести ещё одну подготовительную операцию."
 STP_cw_operational_orders: "Приказы округам"

 STP_cw_operational_orders_desc: "Командиры заранее получат задачи на первые недели выступления."

 STP_cw_capital_reserve: "План столичного резерва"

 STP_cw_capital_reserve_desc: "Включим в план развёртывания ещё две линейные бригады партии. Это не бесплатное появление дивизий: при расколе их сформируют только из доступных рекрутов и снаряжения. Подготовка доступна при любом бюджетном приоритете."

 STP_cw_protect_congress: "Охрана Бронзового конгресса"

 STP_cw_protect_congress_desc: "Сосредоточим силы вокруг Конгресса и построим укрепления. Первые 35 дней боёв армия получит оборонительную подготовку. Подвижный резерв станет недоступен: ставка сделана на удержание правительственного центра, от которого зависит работа кабинета."

 STP_cw_opposition_preparation: "Подготовка связных Шабрата"
 STP_cw_opposition_preparation_desc: "Цель операции: §Y[STPGetOppositionTarget]§!. Цель объявляется заранее и показана на карте. Первая операция длится 60 дней, последующие - 28; при верности аппарата от 70 добавляется ещё 10 дней, ниже 25 срок короче на 7. Оставшееся время указано у миссии. Проверка командования за 21 день срывает подготовку; коллегия безопасности позволяет перехватить её за 10 дней. Успех связных даёт 12 влияния, сдвигает легитимность на 4% к Шабрату и снижает верность на 6. Сначала подполье добивается закреплённой позиции и местной администрации; следующая операция готовит гарнизон, склад за 1200 из казны или диверсантов за 240 винтовок из общего запаса. Военные результаты и условия указаны на карте. Обычный итог выборов ведёт к большой войне; исключительный мандат с признанием командования и окружных управлений может ограничить мятеж."

 STP_cw_treasury_1200_tt: "Казна: §G+1200§!. Средства сверх предела казны не сохраняются."

 STP_cw_suspicion_minus_5_tt: "Подозрения партии: §G-5§! (не ниже 0)."
 STP_cw_suspicion_5_tt: "Подозрения партии: §R+5§! (не выше 100)."

 STP_cw_suspicion_minus_10_tt: "Подозрения партии: §G-10§! (не ниже 0)."

 STP_cw_suspicion_8_tt: "Подозрения партии: §R+8§! (не выше 100)."

 STP_cw_suspicion_10_tt: "Подозрения партии: §R+10§! (не выше 100)."
 STP_cw_suspicion_12_tt: "Подозрения партии: §R+12§! (не выше 100)."
 STP_cw_suspicion_15_tt: "Подозрения партии: §R+15§! (не выше 100)."

 STP_cw_niansas_influence_tt: "Влияние сопротивления в Ниансасе: §G+12§!."

 STP_cw_headquarters_tt: "Открываются найм окружной администрации и сдача чиновника комиссии. Переговоры с советами и защита связей - отдельные операции на карте."
 STP_cw_private_payments: "Закрытые выплаты"
 STP_cw_private_payments_desc: "Договорённости с чиновниками оплачиваются через расходы на управление. Надбавка действует 70 дней; новое соглашение возобновляет её срок. Раскол государства прекращает выплаты досрочно."
 STP_cw_arsenal_shifts: "Дополнительные смены"
 STP_cw_arsenal_shifts_desc: "Арсеналы на 140 дней переходят на расширенный график. Выпуск военных заводов и скорость роста эффективности производства увеличиваются на 25%."
 STP_cw_emergency_laboratories: "Военные лаборатории"
 STP_cw_emergency_laboratories_desc: "Чрезвычайная программа держит вторую ячейку исследований. Она действует 180 дней или до возвращения гражданской власти."
 STP_cw_forest_officials_tt: "В регионе §Y[53.GetName]§! влияние сопротивления: §C+12§!. Подготовлена администрация для перехода округа к Шабрату. Для перехода влияние должно оставаться закреплённым до раскола. Партийная проверка может сорвать подготовку."
 STP_cw_port_supply_tt: "Эффект один на всю армию сопротивления; второй склад его не усилит. Если топлива хватит, передадим §Y500§! из партийных запасов. Комиссия может сорвать подготовку."
 STP_cw_council_envoys_tt: "Влияние местных сил в §Y[45.GetName]§!: §Y+10§!. Соглашение об автономии ещё не заключено: при расколе округ может перейти республикам, если местные силы сохранят наибольшее влияние."
 STP_cw_border_evidence_tt: "Штаб Шабрата сможет один раз потратить £political_power_texticon §Y35§! и задержать действующую подготовку интервенции Нодрула на §G35 дней§!. Решение доступно до и после раскола, пока северные войска ещё готовятся."
 STP_cw_network_transfer_tt: "Накопленная «Сеть сторонников» перейдёт Шабрату при расколе и распустится после возвращения гражданской власти."
 STP_cw_civil_authority_ideas_tt: "Политическая сеть и чрезвычайные полномочия кабинета прекращают действовать. У партии также снимается штраф к стабильности после смерти Иванова. Накопленные улучшения военного управления сохраняются."
 STP_cw_resistance_network_dynamic: "Сеть сторонников"
 STP_cw_resistance_network_dynamic_desc: "Посредники и служащие поддерживают сторонников Шабрата. Проверка связей и работа с документами постепенно усиливают одну сеть. При расколе она перейдёт сопротивлению."
 STP_cw_party_administration_dynamic: "Партийное управление"
 STP_cw_party_administration_dynamic_desc: "Министры и президиум согласуют работу ведомств. Проведённые меры накапливаются здесь и поддерживают власть партии до возвращения гражданского управления."
 STP_cw_military_staff_dynamic: "Военное управление"
 STP_cw_military_staff_dynamic_desc: "Работа штаба, подготовка офицеров и снабжение определяют возможности армии. Каждая проведённая мера дополняет ранее принятые. Эти улучшения сохраняются после войны."
 STP_party_suspicion_dynamic_modifier: "Подозрения спецслужб"
 STP_party_suspicion_dynamic_modifier_desc: "Рост подозрений затрудняет работу сторонников Шабрата и снижает прирост политической власти. Эффект действует до начала восстания или завершения выборов."
 STP_apparatus_loyalty_dynamic_modifier: "Верность аппарата"
 STP_apparatus_loyalty_dynamic_modifier_desc: "Подчинение кабинетов, окружных штабов и печатей протоколу. Высокая верность даёт политический ресурс и стабильность, низкая отнимает их. Действует до начала восстания или завершения выборов."

 STP_cw_command_power_25_cost: "£command_power_texticon §Y25§!"
 STP_cw_command_power_25_cost_blocked: "£command_power_texticon §R25§!"
 STP_cw_command_power_25_cost_tooltip: "Стоимость: £command_power_texticon §Y25§!"
 STP_cw_launch_last_banquet: "Начать операцию «Последний банкет»"
 STP_cw_launch_last_banquet_desc: "Одноразовая операция требует войны с партией и контроля Ниансаса. Цель - контроль Бронзового конгресса за §Y21 день§!. Приказ стоит £command_power_texticon §Y25§!. Если срок истечёт без цели, поддержка войны упадёт на §R10 п.п.§!. Повторный запуск закрыт. Во время наступления нельзя начать оборонительный план или перегруппировку."
 STP_cw_delay_inspection_live_tt: "В выбранном округе ещё работает партийная комиссия"
 STP_cw_last_banquet_deadline: "Срок «Последнего банкета»"
 STP_cw_last_banquet_deadline_desc: "За оставшиеся дни сопротивление должно взять под контроль Бронзовый конгресс. Успех в этот срок сохраняется. Если срок истечёт без контроля Бронзового конгресса, поддержка войны упадёт на 10 п.п. Потеря Ниансаса после запуска не отменяет операцию."
 STP_cw_last_banquet_objective_tt: "Контролируется Фада"
 STP_cw_last_banquet_objective_open_tt: "Фада ещё не под нашим контролем"
 STP_cw_last_banquet_launch_tt: "На 21 день начнётся наступление. Отдельный обратный отсчёт покажет срок взятия Фады."
 STP_cw_last_banquet_success_tt: "Фада взята в отведённый срок. Задача выполнена."
 STP_cw_last_banquet_fail_tt: "Срок истёк без контроля Бронзового конгресса. Поддержка войны: §R-10 п.п.§!."
 STP_cw_northern_incident_result_tt: "Действующая подготовка интервенции Нодрула продлится на §G56 дней§!. Уже готовые или вступившие в войну войска это решение не остановит."
 STP_cw_nod_prep_active_tt: "Нодрул ещё готовит интервенцию"
 STP_cw_purchase_arsenal_batch: "Выкупить готовое вооружение"
 STP_cw_purchase_arsenal_batch_desc: "Военный совет выкупит партию восстановленного оружия у частных мастерских: 1600 винтовок, 60 орудий, 48 комплектов группового оружия, 30 единиц дополнительного оснащения и 20 зенитных орудий. Поставка поступает сразу; следующая партия будет доступна через 42 дня. Сначала пополните действующие части, затем формируйте новые."
 STP_cw_arsenal_batch_cost: "£ADISCORD_economy_treasury_texticon §Y420§!"
 STP_cw_arsenal_batch_cost_blocked: "£ADISCORD_economy_treasury_texticon §R420§!"
 STP_cw_arsenal_batch_cost_tooltip: "Стоимость: £ADISCORD_economy_treasury_texticon §Y420§!"
 STP_cw_regroup_the_front: "Перегруппировать фронт"
 STP_cw_regroup_the_front_desc: "Приказ стоит 25 командного ресурса и исключает боевые планы до окончания срока. Повторный запуск возможен через 42 дня. С окончанием войны действие приказа прекращается."
 STP_cw_train_reserve_brigades: "Подготовить две резервные бригады"
 STP_cw_train_reserve_brigades_desc:0 "За £political_power_texticon §Y40§! подготовим две полностью укомплектованные территориальные бригады за §Y21 день§!, с начальным опытом §Y30%§!. Шабрат оплачивает только политическую организацию добровольцев; партия и республики также выделяют 12000 людей и 1200 винтовок. При отмене возвращаются только действительно выделенные люди и оружие; политическая власть не возвращается. Нужен собственный контролируемый регион. Одновременно готовится один резерв; после мира новые заказы закрываются."
 STP_cw_reserve_training_start_tt: "На 21 день из доступного запаса нашей страны будут выделены £manpower_texticon §Y12000§! людей и £infantry_equipment_texticon §Y1200§! винтовок. Организация обучения стоит £political_power_texticon §Y40§!."
 STP_cw_reserve_training_result_tt: "Наша страна получит §Y2§! полностью укомплектованные территориальные бригады с начальным опытом §Y30%§! в собственных контролируемых регионах. Подготовка уже оплачена. При капитуляции, прекращении военной угрозы или утрате всех мест формирования в запас вернутся только ранее выделенные люди и оружие. Республики могут готовить части и до нападения Кефрейта, пока сохраняется его угроза."
 STP_cw_expand_arsenal: "Расширить арсенал в регионе [FROM.GetName]"
 STP_cw_expand_arsenal_desc: "Вложим 1200 единиц казны в новый военный завод в регионе [FROM.GetName]. Работы займут 35 дней и снизят общий выпуск военных заводов на 10%. Одновременно ведётся один проект. При потере региона, капитуляции или прекращении военной угрозы проект отменяется и возвращает половину уплаченной суммы; остальные средства уже потрачены на работы. Республики могут строить арсеналы и до нападения Кефрейта, пока сохраняется его угроза."
 STP_cw_deliberate_offensive: "Подготовленное наступление"
 STP_cw_deliberate_offensive_desc: "Штаб сосредоточил артиллерию и согласовал действия ударных частей на главном направлении. Военный совет не может сменить приказ до окончания операции."
 STP_cw_static_defence: "Позиционная оборона"
 STP_cw_static_defence_desc: "Части закрепляются на рубежах, жертвуя подвижностью и наступательными возможностями."
 STP_cw_front_reorganization: "Перегруппировка фронта"
 STP_cw_front_reorganization_desc: "Подразделения восстанавливают организацию и сокращают расход припасов. До окончания перегруппировки наступательные возможности ограничены."
 STP_cw_reserve_training_cost:0 "[STPGetReserveTrainingCost]"
 STP_cw_reserve_training_cost_blocked:0 "[STPGetReserveTrainingCostBlocked]"
 STP_cw_reserve_training_cost_tooltip:0 "[STPGetReserveTrainingCostTooltip]"
 STP_cw_arsenal_expansion_cost: "£ADISCORD_economy_treasury_texticon §Y1200§!"
 STP_cw_arsenal_expansion_cost_blocked: "£ADISCORD_economy_treasury_texticon §R1200§!"
 STP_cw_arsenal_expansion_cost_tooltip: "Стоимость: £ADISCORD_economy_treasury_texticon §Y1200§!"
 STP_cw_livonn_active_agreement_tt: "В подконтрольном Стеландеру Ливонинском округе действует оплаченный договор с местными советами"

 STP_cw_hold_the_pier: "Ввести план обороны набережной"
 STP_cw_hold_the_pier_desc: "Требуются контроль Фады и война с сопротивлением. Приказ стоит 25 командного ресурса; повторный запуск возможен через 56 дней. Наступление и перегруппировка недоступны до окончания плана."
 STP_cw_defend_western_frontier: "Ввести план обороны республик"
 STP_cw_defend_western_frontier_desc: "Требуются контроль региона [43.GetName] и война с Кефрейтом. Приказ стоит 25 командного ресурса; повторный запуск возможен через 56 дней. Наступление и перегруппировка недоступны до окончания плана."
 STP_cw_started: "Гражданская война началась"
 STP_cw_union_wars_finished: "Гражданская война в Стеландере завершена"
 STP_cw_elections_finished: "Выборы председателя завершены"
 STP_sided_with_Maksim_flag: "Поддержан Шабрат"
 STP_sided_with_the_party_flag: "Поддержана партия"
 STP_cw_headquarters_ready: "Штаб Шабрата сформирован"
 STP_cw_garrison_program: "Подготовлены связи с гарнизонами"
 STP_cw_northern_crisis_pending: "Нодрул готовит северную кампанию"
 STP_cw_recruitment_program: "Открыта программа территориальных бригад"
 STP_cw_uprising_prepared: "Подготовлен план восстания"
 STP_party_counterintelligence_asset: "В округе действует партийная контрразведка"
 STP_region_player_operations_allowed: "В округе можно проводить политические операции"
 ADISCORD_STP_cw.30.shabrat: "Шабрата объявили победителем выборов. На несколько часов казалось, что одной строки в протоколе хватит для мирной передачи власти. Затем партийное командование отказалось выполнять распоряжения нового председателя.\n\nПо стране пошли два набора приказов. В одних округах чиновники сохранили кабинеты и просто заменили адресата донесений. В других гарнизоны заняли администрации раньше, чем те успели выбрать сторону. Абила признала Шабрата. Партия удержала Бронзовый конгресс и значительную часть сил. Западные советы воспользовались расколом и объявили независимость.\n\nШабрат получил мандат, но не государство целиком. Теперь результат выборов придётся защищать теми частями, командирами и складами, которые согласились считать его законным."
 ADISCORD_STP_cw.30.party: "Партийный аппарат объявил свой результат окончательным. Представители Шабрата покинули зал до завершения церемонии, а через несколько часов его штаб назвал протокол навязанным.\n\nАбила отказалась подчиняться столице. В горных округах активировали сети, которые годами существовали как запасной административный слой. Партийные комиссары заняли узлы связи и склады там, где успели первыми. На западе советы объявили, что больше не признают ни одну из сторон.\n\nПартия сохранила печати, часть армии и столицу. Шабрат сохранил людей, которые были готовы жить без этих печатей. К вечеру спор о законности превратился в линию фронта."
 STP_cw_legitimacy_initialized: "Открыта борьба за легитимность"

 STP_cw_shabrat_election_victory: "Шабрат получил избирательный мандат"

 STP_cw_party_election_victory: "Партия удержала протокол выборов"

 STP_battle_for_stelander_active: "Продолжается подготовка к расколу Стеландера"

 STP_cw_delay_inspection: "Затянуть работу комиссии: [FROM.GetName]"

 STP_cw_delay_inspection_desc: "Наши люди потребуют сверить дополнительные ведомости в выбранном округе. За £political_power_texticon §Y35§! только эта комиссия сразу продлится на §Y14 дней§!. На эти же §Y14 дней§! будет занят один слот подготовки. После завершения повтор в том же округе закрыт на §Y60 дней§!. Если комиссия уже исчезла, политическая власть не списывается. При прекращении подготовки слот освобождается один раз."

 STP_cw_open_civil_registers: "Открыть гражданские реестры"
 STP_cw_open_civil_registers_desc: "Предъявим комиссии гражданские документы и распустим местную военную сеть. За £political_power_texticon §Y25§! администрация останется на нашей стороне, но связи с гарнизоном, снабжение и диверсии будут потеряны. Оружие из местного резерва вернётся владельцу округа; добровольцы Кефрейта вернутся домой. Эвакуированных частей эта уступка не создаёт.\n\nОтвет выполняется сразу и не занимает слот. До окончания комиссии местные операции приостановятся; уже начатые операции сети отменятся. Их политическая власть и расходы казны не возвращаются, выделенное оружие возвращается только один раз. Легитимность сместится на §R2%§! к партии. После проверки военные связи можно восстановить за полную цену."
 STP_cw_civil_registers_result_tt: "Гражданская администрация сохранится. Связи с гарнизоном, снабжение и диверсии в округе будут распущены; оружейный резерв вернётся владельцу округа, добровольцы - Кефрейту. Текущие операции местной сети отменятся без возврата политической власти и расходов казны. До конца комиссии новые местные операции недоступны."
 STP_cw_civil_registers_command_risk_tt: "§RЕсли это последний подготовленный гарнизон в [2.GetName] или [29.GetName], договор с командованием потеряет силу.§! Незавершённые переговоры отменятся без возврата £political_power_texticon §Y75§!. Уже заключённое обязательство перестанет усиливать мандат и обеспечивать ограниченный мятеж, пока не восстановлен гарнизон."

 STP_cw_sacrifice_local_contact: "Сдать окружного чиновника"

 STP_cw_sacrifice_local_contact_desc: "Назовём комиссии чиновника, который подписывал наши документы. Его связи с администрацией будут потеряны сразу, зато текущая проверка не тронет готовые гарнизонные связи, снабжение, диверсии и запасы. До окончания проверки работа в округе остановится.\n\nЭто снижает шансы передать округ сопротивлению: заново завербовать администрацию можно будет после проверки. Договор с местным советом, если он есть, сохраняется. Ответ выполняется сразу за §Y25§! политической власти и не занимает слот. Подозрения снизятся на §G4§!, легитимность сместится на §R2%§! к партии."

 STP_cw_surrender_contact_tt: "Местная администрация сопротивления будет потеряна. Текущая проверка сохранит остальные готовые активы и резервы, но до её завершения новые окружные операции недоступны. Подозрения: §G-4§! (не ниже 0)."

 STP_false_trail_in_progress: "Готовится ложный след для текущей комиссии"

 STP_false_trail_prepared: "Ложный след для текущей комиссии подготовлен"

 STP_inspection_concession_prepared: "Условия комиссии приняты; работа в округе приостановлена"

 STP_cw_prepared_supply_lines: "Подготовленные маршруты снабжения"

 STP_cw_prepared_supply_lines_desc: "Заранее подготовленные склады обеспечивают первые недели мобилизации сопротивления. На 21 день снижается расход припасов и ускоряется восстановление организации. Достаточно одного сохранённого склада в Ниансасе или Хосхейте; второй не удваивает этот общий эффект."
 STP_cw_northern_engineer_mission: "Северная инженерная группа"
 STP_cw_northern_engineer_mission_desc: "Инженеры Шабрата помогают союзной армии ускорить полевые укрепления и окапывание. Группа работает 45 дней, пока получатель воюет с Нодрулом."
 NOD_cw_northern_offensive: "Северное наступление Нодрула"
 NOD_cw_northern_offensive_desc:0 "Первые 70 дней северной войны штаб поддерживает высокий темп наступления. Если война с Юборой, Лесом или Фронтиром продолжается после этого срока, бонус сменится духом «Застрявшая армия». Окончание северной войны снимает оба духа."
 STP_cw_nod_disrupted_rear: "Сорванный тыл Нодрула"
 STP_cw_nod_disrupted_rear_desc: "Диверсия Шабрата нарушает снабжение и темп переброски. На 42 дня армия Нодрула расходует больше припасов и движется медленнее."

 STP_cw_party_sabotage_aftermath: "Сорванное производство партии"
 STP_cw_party_sabotage_aftermath_desc: "Заложенные заряды Шабрата бьют по сменам и поставкам. На 70 дня военные заводы партии выпускают меньше и медленнее наращивают эффективность."
 STP_cw_party_battle_spirit: "Битва за Стеландер"
 STP_cw_party_battle_spirit_desc: "Регулярные части партии держатся за единый штаб и установленный порядок. Слаженность подразделений и подготовка приказов помогают им удерживать фронт против сопротивления. Дух действует до окончания этой войны."
 STP_cw_resistance_battle_spirit: "Битва за Стеландер"
 STP_cw_resistance_battle_spirit_desc: "Отряды сопротивления опираются на местные связи, быстро меняют позиции и возвращаются в строй после боя. Даже потеря важных центров не означает немедленного отказа от борьбы. Дух действует, пока продолжается война с партией или вступившим на её стороне Нодрулом."
 STP_cw_republics_battle_spirit: "Битва за Стеландер"
 STP_cw_republics_battle_spirit_desc: "Горные общины защищают собственные перевалы и селения. Знание местности помогает быстрее укреплять позиции и глубже окапываться. Дух появляется при нападении Кефрейта и снимается после окончания этой отдельной войны."

 ADISCORD_STP_preparation.15.t: "Нектар богов"
 ADISCORD_STP_preparation.15.d: "В Стеландере утро начиналось поздно. К девяти солнце уже отражалось от фасадов прибрежных гостиниц, но улицы только оживали. Рабочие смывали с мостовой остатки вчерашнего фестиваля. Из окон доносилась музыка, над портом поднимались пассажирские дирижабли.\n\nУ киоска напротив Центрального вокзала уже собралась очередь. На витрине стояли десятки одинаковых бутылочек из матового стекла. Золотая этикетка изображала чашу, над которой восходило солнце. «НЕКТАР БОГОВ» Ниже мелким шрифтом значилось: «Лицензировано Палатой Высших Домов и Привилегированных Гильдий. Употребляйте ответственно. Наслаждайтесь свободно».\n\nПутеводители советовали иностранцам попробовать нектар сразу после прибытия. Его подавали в казино, ночных клубах и дорогих ресторанах. Более дешёвые сорта продавались в автоматах возле фабрик и общежитий.\n\nОдни утверждали, что он делает музыку лучше, другие - что с ним легче заговорить с незнакомцем. Третьи покупали бутылочку после смены и сидели перед домом, глядя на отражения курортных огней в воде.\n\nПравительство никогда не называло это наркотиком. В официальных документах использовалось выражение «рекреационный препарат общего доступа».\n\nКогда-то подобные вещества продавались подпольно. За одну дозу можно было получить тюремный срок, а за торговлю несколькими ящиками лишиться имущества. Затем пришёл Иванов.\n\nОн говорил, что государство не должно указывать человеку, чем заниматься в собственной спальне, что пить за собственным столом и каким способом забывать о тяжёлом рабочем дне. После десятилетий мобилизации, комендантских часов и похорон это звучало почти революционно.\n\nСтеланд устал. Здесь помнили войну не по памятникам. Ещё жили люди, способные отличить приближающийся воркерландский бомбардировщик по звуку двигателя. Старики рассказывали о зимах, когда дети спали в тоннелях, где было безопаснее, чем дома.\n\nДля них свобода означала не парламент и не конституцию. Свобода означала ночь без сирены.\n\nПосле Фадского пакта самолёты действительно исчезли. Горные союзы сдали оружие. Дороги открылись. В порт снова пришли иностранные суда. На месте военных складов появились гостиницы. Там, где когда-то распределяли патроны, теперь продавали вино, таблетки, стимуляторы и знаменитый нектар."
 ADISCORD_STP_preparation.15.a: "Свобода означала ночь без сирены."
 ADISCORD_STP_preparation.16.t: "Иванов и цена мира"
 ADISCORD_STP_preparation.16.d: "На каждой второй площади стоял Иванов. Бронзовый - с поднятой рукой, мраморный - с ребёнком. Молодой на плакатах времён мира, старый на государственных экранах.\n\nПод одним из таких экранов мужчина в рабочей куртке забрал у продавца бутылочку и сделал несколько глотков прямо у прилавка. Экран показывал хронику. Чёрно-белые кадры разрушенного горного посёлка сменились цветной панорамой современной столицы. Затем появились туристы, казино и дети, бегущие через фонтан. Голос диктора был спокойным. «Наши отцы знали цену войны. Наши дети имеют право её не знать».\n\nМужчина допил нектар и выбросил бутылку. За ним стояла пожилая женщина с продуктовой сумкой. Когда диктор произнёс слово «Стеландер», женщина едва слышно сказала: «Стеланд». Никто не обратил внимания. Очередь двигалась дальше.\n\nЗа двадцать лет легализация превратилась в одну из самых прибыльных отраслей страны. Высшие Дома получили лицензии на производство. Гильдии контролировали поставки. Иностранцы приезжали в Стеландер за тем, за что дома им грозил арест.\n\nГосударство получало налоги. Рабочий получал вечер, который проходил немного быстрее. Турист получал историю для друзей. Палата называла это свободой. И в каком-то смысле это была свобода. Здесь почти никто не интересовался, с кем человек спал, что он пил, во что играл и сколько денег оставлял за столом казино.\n\nЛишь несколько тем воспитанный человек предпочитал не затрагивать. Не стоило спрашивать, кому принадлежат шахты. Или внимательно читать приложения к Фадскому пакту. Не стоило интересоваться, почему в некоторых горных районах государственные школы закрывались быстрее, чем открывались новые курорты. Не стоило спрашивать полицейского, почему одних торговцев задерживают, а грузовики других проходят через блокпост без досмотра. Особенно не стоило спрашивать, куда исчезают люди, чьи имена иногда появлялись на стенах Нижнего города.\n\nДля всего остального существовал нектар.\n\nК полудню набережная окончательно заполнилась. Музыка стала громче. У казино начали собираться первые гости. Молодая пара фотографировалась у статуи Иванова. На экране над площадью появилась золотая бутылочка. «ВЫ ЗАСЛУЖИЛИ СПОКОЙНУЮ ЖИЗНЬ».\n\nРекламу сменил государственный герб, затем - лицо Петра Иванова. Он выглядел заметно старше, чем на памятниках. «Мир не является слабостью», произнёс он. «Мир является величайшей победой нашего народа». Люди на площади почти не остановились. Они слышали эти слова много раз. Кто-то поднял бутылочку в сторону экрана, кто-то даже не посмотрел наверх.\n\nА далеко отсюда, выше курортов и дорог к границе, снег лежал на развалинах тех деревень, которые никогда не попали в туристические буклеты. Там всё ещё говорили «Стеланд». В столице это слово постепенно превращалось в исторический термин. Здесь был Стеландер. Безопасный. Богатый. Свободный. И пока музыка играла достаточно громко, мало кому приходило в голову спросить, на чём именно держится его мир."
 ADISCORD_STP_preparation.16.a: "За мир стоило заплатить."
 ADISCORD_STP_preparation.23.t:0 "Революция с Севера"
 ADISCORD_STP_preparation.23.d:0 "Гедонистическая революция родилась не в Стеланде, а в Нодруле. Союз местной аристократии, богатых домов и привилегированных гильдий сверг прежнюю элиту и предложил обществу новую сделку: меньше долга и аскезы, больше личной свободы, потребления и права не вмешиваться в политику.\\n\\nПосле победы Нодрул начал экспортировать эту модель. В истощённый войной Стеланд пришли деньги, агитаторы, юристы и посредники. Часть местной знати и владельцев портов увидела в новом порядке шанс сохранить собственность, а для населения главным обещанием был конец бесконечной войны.\\n\\nПётр Иванов стал человеком, который связал импортированную революцию с национальным спасением. Фадский пакт остановил воркерландские налёты, открыл дороги и порты, но одновременно разоружил часть старых союзов и дал Нодрулу доступ к законам, кадрам и политическим институтам страны.\\n\\nТак появился нынешний мандат. Стеландер сохраняет собственный флаг, правительство и армию, однако кредиты, советники, партийные школы, внешнее признание и значительная часть элиты завязаны на Нодрул. Это не обычная оккупация, а зависимость, которая выглядит добровольной, пока порядок Иванова остаётся устойчивым."
 ADISCORD_STP_preparation.23.a:0 "Мир оказался убедительнее старой независимости."
 ADISCORD_STP_preparation.25.t:0 "За огнями столицы"
 ADISCORD_STP_preparation.25.d:0 "Палата Высших Домов любит говорить, что оставила граждан в покое. В Стеландере действительно можно пить, играть, употреблять разрешённые вещества и жить частной жизнью свободнее, чем при старом военном порядке. Именно эта реальная бытовая свобода делает партийную систему устойчивой.\\n\\nНо невмешательство заканчивается там, где начинаются деньги и власть. Высшие Дома и привилегированные гильдии контролируют лицензии, порты, шахты, медиа и крупные контракты. Курортная столица богатеет, пока в высокогорье закрываются школы, молодые специалисты уезжают, а целые районы остаются зависимыми от партийных посредников.\\n\\nЕщё ниже находится Нижний рынок. За вывесками клубов, агентств и складов действует сеть похищений, фиктивных контрактов, принудительного труда и торговли людьми, включая детей. Рабство здесь редко называется рабством: у жертвы может быть договор, долг и зарегистрированный работодатель — только права уйти у неё нет.\\n\\nМаксим Шабрат превратил эти противоречия в политическое движение. Его сопротивление держится на районных активистах, чиновниках, шахтёрах, бывших военных и части офицеров. У него пока нет готового государства или открытой армии, но есть сеть, архивы и достаточно сторонников, чтобы болезнь Иванова превратила обычный вопрос о преемнике в кризис всего режима."
 ADISCORD_STP_preparation.25.a:0 "За витриной уже собираются те, кто хочет её разбить."

 ADISCORD_STP_cw.70.t: "Кризис власти в Стеландере перерос в вооружённый конфликт"
 ADISCORD_STP_cw.70.d: "После смерти Петра Иванова спор о преемстве окончательно вышел из залов Бронзового конгресса. Партийное правительство удерживает столичный аппарат, тогда как силы Максима Шабрата опираются на часть гарнизонов, окружных администраций и подпольных сетей, подготовленных ещё до выборов. На западе местные советы отказались признавать обе стороны и объявили Союз Возрождения Окцидии.\n\nЕдиная армия распалась вместе с цепью приказов. Одни склады открываются по партийным распоряжениям, другие по приказам сопротивления. По одним и тем же линиям связи командиры получают взаимоисключающие требования. Нодрул даёт понять, что не считает судьбу старого аппарата внутренним делом Стеландера, а Кефрейт наблюдает за западной границей.\n\nФадский порядок пережил войны и смену поколений. Первую передачу власти после Иванова он уже не пережил."
 ADISCORD_STP_cw.70.a: "Мир Иванова не пережил его преемства."
 ADISCORD_STP_cw.71.t: "Партийное правительство удержало Стеландер"
 ADISCORD_STP_cw.71.d: "Организованное сопротивление Максима Шабрата разгромлено. Партийные части возвращаются в окружные администрации, снимают временные блокпосты и восстанавливают подчинение столице. Правительство объявило гражданскую войну завершённой и представило победу как доказательство того, что система Иванова способна пережить своего создателя.\n\nОднако довоенная страна не восстановилась вместе с партийной властью. Западные республики остаются вне контроля столицы, тысячи бывших бойцов и чиновников теперь должны решить, возможно ли возвращение к прежнему порядку, а сам спор о возможной интервенции Нодрула сделал внешнюю опору старого порядка очевидной даже для тех, кто прежде предпочитал её не замечать.\n\nПартия сохранила столицу и аппарат. Вопрос о том, сохранила ли она сам Стеландер, остаётся открытым."
 ADISCORD_STP_cw.71.a: "Победа партии не вернула довоенную страну."
 ADISCORD_STP_cw.72.t: "Шабрат победил в гражданской войне Стеландера"
 ADISCORD_STP_cw.72.d: "Последние организованные части партийного правительства сложили оружие. Силы Максима Шабрата заняли Бронзовый конгресс и ключевые столичные учреждения, но получили приказ не распускать гражданские ведомства. Чиновникам предложено оставаться на местах до формирования постоянного кабинета.\n\nПадение партии лишает возможное вмешательство Нодрула прежней политической опоры, но не возвращает стране старые границы. Западные республики по-прежнему действуют самостоятельно, архивы режима только начинают открываться, а победителям предстоит соединить подпольные структуры, армию и уцелевшую бюрократию в одно государство.\n\nШабрат выиграл войну за столицу. Теперь ему предстоит доказать, что сопротивление умеет не только разрушать чужой порядок, но и жить после собственной победы."
 ADISCORD_STP_cw.72.a: "Война закончилась. Спор о новом государстве только начинается."
 VAL_cw_republics_grace_elapsed_tt: "После распада Стеландера прошло не менее 60 дней."
 ADISCORD_STP_cw.73.t: "Кефрейт вторгся в Окцидию"
 ADISCORD_STP_cw.73.d: "После истечения ультиматума кефрейтские колонны пересекли границу Союза Возрождения Окцидии. Кефрейт требует передачи регионов [43.GetName], [44.GetName] и [88.GetName], связывая претензии со старыми соглашениями о ресурсах, дорогах и безопасности. Западные республики отвергли требования и перевели свои силы под единое командование.\n\nКонфликт не является продолжением гражданской войны формально, но стал возможен именно из-за распада Стеландера. Вчерашние административные линии превратились в международную границу, а имущество прежнего государства стало предметом переговоров, которые теперь ведутся артиллерией.\n\nДля соседей это первый открытый спор о том, кому принадлежит наследство страны после исчезновения власти Иванова."
 ADISCORD_STP_cw.73.a: "Внутренняя граница стала фронтом."
 ADISCORD_STP_cw.80.t: "Нодрул навязал северу новый порядок"
 ADISCORD_STP_cw.80.d: "Северный оборонительный союз потерпел поражение. Войска Нодрула заняли земли Культа Детей Леса и ликвидировали его правительство. Юборская Народная Республика сохранила историческое ядро, но перешла в зависимое положение. Вольный Фронтир вышел из войны отдельным миром и сохранил самостоятельность.\n\nПобеда создала на севере новый пояс прямого управления, зависимой государственности и формально независимой периферии. Для Нодрула это не только военный успех. Государство, десятилетиями предпочитавшее советников, договоры и чужие администрации, впервые за долгое время расширило свою систему открытой силой.\n\nОсвободившиеся после кампании силы снова доступны нодрульскому руководству, и соседние правительства уже пересчитывают собственные риски."
 ADISCORD_STP_cw.80.limited: "Нодрул добился военной победы над участниками Северного оборонительного союза, но первоначальный проект послевоенного устройства выполнить полностью не удалось. За время кампании часть спорных земель сменила владельцев, и мир закрепил линию контроля, отличающуюся от планов нодрульского штаба.\n\nГлавный результат войны при этом не изменился. Северный фронт закрыт, армии противников больше не угрожают Нодрулу как единому союзу, а его командование снова может сосредоточиться на южной политике. Победа оказалась менее аккуратной, чем планировалось, но всё равно изменила региональный баланс."
 ADISCORD_STP_cw.80.a: "Северный порядок переписан силой."
 ADISCORD_STP_cw.81.t: "Северный союз остановил Нодрул"
 ADISCORD_STP_cw.81.d: "Северная кампания завершилась отступлением Нодрула. Правительство согласилось прекратить войну с Юборской Народной Республикой, Культом Детей Леса и Вольным Фронтиром. Эснос и Бриоланд переходят Юбору, остальные участники союза сохраняют собственные правительства и вооружённые силы.\n\nДля Нодрула поражение не стало государственным крахом, но обозначило предел прямой экспансии. Система, привыкшая добиваться влияния через советников, договоры и зависимые администрации, не смогла превратить военное вторжение в новый северный порядок.\n\nДля соседей итог важен не меньше самой линии границы. Армия Нодрула возвращается не победителем, а силой, которой впервые пришлось принять чужие условия."
 ADISCORD_STP_cw.81.limited: "Северные государства добились прекращения нодрульской кампании и сохранили свои правительства. Из-за изменений на фронте мир затронул только те части Эсноса и Бриоланда, которыми Нодрул ещё владел к моменту переговоров. Земли, уже перешедшие третьим сторонам, соглашение не перераспределило.\n\nГраницы оказались сложнее первоначальных требований союза, но политический результат остался тем же. Нодрул начал войну, рассчитывая диктовать устройство севера, и завершил её без права навязать собственный проект."
 ADISCORD_STP_cw.81.a: "Нодрул вернулся с севера без победы."
 ADISCORD_STP_cw.82.t: "Нодрул открыл северный фронт"
 ADISCORD_STP_cw.82.d: "Нодрульские войска перешли северную границу после провала последних переговоров. Юборская Народная Республика, Культ Детей Леса и Вольный Фронтир, ещё недавно спорившие друг с другом о дорогах, земле и влиянии, ответили созданием Северного оборонительного союза. Их штабы договорились вести войну как единая коалиция до прекращения нодрульского наступления.\n\nНодрул заявляет, что кампания должна устранить нестабильность на границе и положить конец порядку, который его руководство считает угрозой региональной безопасности. Северные правительства называют вторжение попыткой распространить на них ту же систему зависимости, которая десятилетиями связывала Нодрул со Стеландером.\n\nДве части региона теперь одновременно переживают кризис старого порядка. На юге спорят о наследстве Иванова, на севере о том, насколько далеко может простираться нодрульский мандат."
 ADISCORD_STP_cw.82.a: "Северные споры уступили место общей войне."
 STP_nod_alliance: "Стеландерско-нодрульский союз"
 STP_northern_defence_alliance: "Северный оборонительный союз"
 STP_cw_cache_capacity_tt: "После поставки общий резерв Абилии, включая оружие в пути, не превысит £infantry_equipment_texticon §Y96000§!."
 NOD_cw_northern_conscription: "Северный призыв"
 NOD_cw_northern_conscription_desc: "Северная кампания потребовала больше людей, чем рассчитывал штаб. Проведём через правительство расширение призыва: через 35 дней вступит в силу закон «Расширенный призыв». Новые резервисты будут прибывать постепенно, а подготовка пополнений займёт больше времени.\n\nЕсли северная кампания завершится или закон изменится раньше, приказ будет отменён с возвратом политической власти. При уже одобренной интервенции мобилизация сохраняется на время переброски. После закрытия угрозы действует обычная демобилизация."
 NOD_cw_northern_mobilization: "Мобилизация на северной границе"
 NOD_cw_northern_mobilization_desc: "Через 28 дней армия Нодрула начнёт войну против оборонительного союза Юбора, Культа Детей Леса и Вольного Фронтира. Раскол Стеландера не отменяет приказ. Подготовка интервенции может идти одновременно с северной кампанией; северный фронт блокирует только вступление. После окончания кампании без поражения Нодрула потребуются семь дней на переброску и завершение оставшейся подготовки."
 STP_cw_northern_supply_idle_tt: "Предыдущий северный груз уже доставлен или возвращён."
 STP_cw_northern_supply_delivery_tt: "Страна §Y[FROM.GetName]§! получит £infantry_equipment_texticon §Y2400§!, если ещё воюет с Нодрулом и не капитулировала. Иначе оружие вернётся отправителю."
 STP_cw_northern_supply_cost: "£pol_power §Y40§! £infantry_equipment_texticon §Y2400§!"
 STP_cw_northern_supply_cost_blocked: "£pol_power §R40§! £infantry_equipment_texticon §R2400§!"
 STP_cw_northern_supply_cost_tooltip: "Стоимость: £pol_power §Y40§! £infantry_equipment_texticon §Y2400§!. При отмене возвращается только оружие."

 STP_cw_district_administration_2_tt: "В регионе §Y[2.GetName]§! подготовлена администрация сопротивления. Она помогает сохранить гражданское управление и передать округ при достаточной местной поддержке. Партийная проверка может сорвать договорённость."
 STP_cw_defensive_lines: "Подготовить оборонительные рубежи"
 STP_cw_defensive_lines_desc: "Инженеры подготовят рубеж вокруг Абилии, который будет занят сопротивлением при расколе. Штаб также получит 50 политической власти на расширение работ. Позиции в других опорных округах требуют отдельного финансирования и времени."
 STP_cw_heavy_reserve: "Усиленные боевые группы"
 STP_cw_heavy_reserve_desc: "Организуем набор и снабжение усиленных частей с артиллерией и подразделениями поддержки. Отдельный заказ покроет людей, вооружение и обучение; можно подготовить до четырёх дивизий, закреплённых за будущей армией Шабрата."
 STP_cw_national_mandate: "Гарантии передачи власти"
 STP_cw_national_mandate_desc: "Добьёмся публичного признания избирательной процедуры и откроем переговоры с командованием о подчинении объявленному результату. При широкой поддержке и действующем обязательстве гарнизона сопротивление партии можно ограничить отдельным мятежом. Для этого администрации Монаии и Ниансаса должны к объявлению результата проработать не менее 21 дня без потери. Если большой войны избежать не удастся, политическая подготовка усилит мандат Шабрата."
 STP_cw_election_mandate_dynamic: "Мандат на восстановление государства"
 STP_cw_election_mandate_dynamic_desc: "Объявленный результат выборов помогает собирать резервы, восстанавливать боеспособность и удерживать собственную территорию. Размер поддержки определён до раскола; оружие и подготовленные части учитываются отдельно."
 STP_cw_secure_election_result: "Добиться признания результата армией"
 STP_cw_secure_election_result_desc: "[STPGetPublicAgreementTiming]\n\nПубличное обязательство командования действует 50 дней после переговоров. К объявлению результата должны сохраниться Равель и хотя бы один подготовленный гарнизон. При победе Шабрата соглашение дополнительно усиливает его военный мандат, даже если начинается большая война. Для ограничения партийного мятежа также нужны легитимность не ниже 80% и администрации регионов [2.GetName] и [3.GetName], каждая из которых к объявлению результата непрерывно работает не менее 21 дня. При потере и восстановлении администрации её срок начинается заново. Переговоры занимают подготовительный слот; при срыве политические расходы не возвращаются. Проигранные выборы не дают Шабрату военного признания."
 STP_cw_public_command_available_tt: "§YРавель§! доступен и не арестован; в регионе §Y[2.GetName]§! или §Y[29.GetName]§! сохранён подготовленный гарнизон."
 STP_cw_public_command_agreement_tt: "Командование признаёт объявленный результат в течение §Y50 дней§!, пока доступен §YРавель§! и сохранён подготовленный гарнизон. Для ограниченного мятежа нужны также легитимность §Y80%§! и не менее §Y21 дня§! непрерывной работы обеих администраций в §Y[2.GetName]§! и §Y[3.GetName]§! к объявлению результата; потеря администрации обнуляет её срок. При победе Шабрата соглашение дополнительно усиливает его военный мандат независимо от масштаба мятежа:"
 STP_cw_national_mandate_tt: "Исключительный мандат и публичное обязательство командования позволяют ограничить мятеж партийными опорными силами, если обе администрации в §Y[2.GetName]§! и §Y[3.GetName]§! к объявлению результата непрерывно работают не менее §Y21 дня§!. После потери администрации срок начинается заново. Обычная победа на выборах даёт будущей стороне Шабрата военный дух: быстрее восстанавливается организация, усиливается оборона своей территории и ускоряется подготовка резервов."
 STP_cw_prepare_defensive_line: "Оборонительные рубежи: [FROM.GetName]"
 STP_cw_prepare_defensive_line_desc: "За 35 дней инженеры подготовят позиции и материалы. При расколе укрепления пограничных провинций этого региона получат два дополнительных уровня. Рубежи достанутся владельцу региона: сначала обеспечьте его переход. Незавершённые работы прерываются при расколе или потере контроля; расходы на них не возвращаются."
 STP_cw_defensive_lines_tt: "Рубеж в §Y[1.GetName]§! подготовлен: при расколе сопротивление получит §Gдва дополнительных уровня укреплений§! на границах Абилии. Для регионов §Y[2.GetName]§! и §Y[3.GetName]§! открываются отдельные оплачиваемые работы по §Y21 дню§!."
 STP_cw_defensive_line_result_tt: "При расколе укрепления на границах региона §Y[FROM.GetName]§! получат §Yдва дополнительных уровня§!. Их получит фактический владелец региона."
 STP_cw_prepare_assault_group: "Подготовить усиленную дивизию"
 STP_cw_prepare_assault_group_desc: "Заказ на одну усиленную дивизию: шесть пехотных и два артиллерийских батальона с инженерами, артиллерией поддержки и ПВО. Набор и закупка вооружения входят в цену - 500 из казны; государственные запасы не расходуются.\n\nПодготовка занимает 28 дней и один слот. Можно заказать четыре дивизии. Готовые части войдут в армию Шабрата при расколе. Если подготовка прервётся, деньги вернутся."
 STP_cw_assault_group_tt: "Открывается платная подготовка до §Yчетырёх усиленных дивизий§! для армии Шабрата: по §Y28 дней§!, с артиллерией, инженерами и ПВО. Люди и вооружение резервируются заранее; готовые части имеют полный комплект."
 STP_cw_assault_group_capacity_tt: "Подготовлено менее четырёх усиленных дивизий."
 STP_cw_assault_group_result_tt: "При расколе армия Шабрата получит §Yодну полностью укомплектованную усиленную дивизию§!. Её люди и вооружение уже оплачены и не участвуют в общем разделе."
 NOD_cw_northern_redeployment: "Переброска с северного фронта"
 NOD_cw_northern_redeployment_desc: "Северная кампания закончилась. Семь дней нужны для переброски войск; оставшаяся подготовка интервенции идёт одновременно. Армия вступит, когда обе работы завершатся, если партия ещё держится."
 STP_cw_nod_redeployment: "Нодрул перебрасывает войска!"
 STP_cw_nod_redeployment_desc: "Северная война закончилась. Нодрул перебрасывает армию к Стеландеру. Когда закончится эта миссия и будет завершена подготовка интервенции, он сможет вступить на стороне партии. Разгром партии закроет эту возможность."
 ADISCORD_STP_preparation.19.t: "Повестки"
 ADISCORD_STP_preparation.19.d: "Первые повестки разнесли ещё до официального объявления о призыве. В почтовых отделениях их складывали рядом со счетами за электричество и рекламой курортов. В графе причины стояло нейтральное выражение: «проверка готовности резерва».\n\nНа вокзалах появились мужчины со старыми армейскими сумками. Одни служили ещё в последние годы войны, другие впервые примеряли форму. Командиры говорили о защите складов, мостов и административных зданий. На вопрос, от кого именно их предстоит защищать, отвечали одинаково: решение ещё не принято.\n\nНа складах тем временем уже считали винтовки. Представители партии проверяли списки офицеров. Люди Шабрата искали тех, кто согласится не выполнять приказ против собственного округа. Государство всё ещё называло себя мирным, но впервые со времён Фадского пакта оно собирало резерв не против внешней армии.\n\nБольшинство призванных пока не принадлежало ни одной стороне. Именно поэтому каждая сторона спешила первой объяснить им, что значит служить Стеландеру."
 ADISCORD_STP_preparation.19.a: "Армия готовилась к вопросу, которого ещё не задали."
 ADISCORD_STP_cw.30.limited: "Шабрат получил не просто большинство. Результат признали ключевые командиры и окружные администрации. Когда Хедерсетт попытался оспорить передачу власти, большая часть государства продолжила работать уже без него.\n\nПартийное выступление не охватило страну. Верные старому аппарату части закрепились вокруг столицы и Бронзового конгресса. За ними остались гвардия, отдельные склады и чиновники, для которых поражение партии означало слишком многое. Остальные округа признали новое правительство.\n\nЭто всё ещё война, но уже не война двух равных государств. Хедерсетту нужен один успех и достаточно времени, чтобы помощь Нодрула успела превратить столичный мятеж во что-то большее. Шабрату нужно закончить его раньше."
 STP_cw_defensive_line_cost: "£political_power_texticon §Y50§! £ADISCORD_economy_treasury_texticon §Y1200§!"
 STP_cw_defensive_line_cost_blocked: "£political_power_texticon §R50§! £ADISCORD_economy_treasury_texticon §R1200§!"
 STP_cw_defensive_line_cost_tooltip: "Стоимость: £political_power_texticon §Y50§! £ADISCORD_economy_treasury_texticon §Y1200§!."
 STP_cw_fund_northern_forts: "Укрепить северный рубеж: [FROM.GetName]"
 STP_cw_fund_northern_forts_desc: "За 28 дней инженеры подготовят пограничные позиции выбранного округа. На границе с Нодрулом появится один уровень укреплений. Одновременно можно вести только один такой проект; при срыве казна возвращается, политическая власть нет."
 STP_cw_send_northern_engineers: "Направить инженеров: [FROM.GetName]"
 STP_cw_send_northern_engineers_desc: "За 21 день направим инженерную группу выбранному северному союзнику. На 45 дней ускорятся полевые укрепления и окапывание. Повтор к тому же получателю доступен через 35 дней после завершения."
 STP_cw_sabotage_nodrul: "Диверсия в тылу Нодрула: [FROM.GetName]"
 STP_cw_sabotage_nodrul_desc: "За 28 дней диверсанты ударят по выбранному округу Нодрула. При успехе будет повреждена инфраструктура, а армия Нодрула на 42 дня потеряет темп и снабжение. Если идёт подготовка интервенции, она задержится на 21 день. Операцию можно вести и во время гражданской войны. Без действующей подготовки срок интервенции не меняется и не восстанавливается."
 STP_cw_northern_aid_ready_tt: "Стол помощи северу открыт, Нодрул ещё держится"
 STP_cw_northern_fort_idle_tt: "Нет другого северного рубежа в работе"
 STP_cw_northern_fort_front_tt: "Округ на фронте против Нодрула и ещё без этого рубежа"
 STP_cw_northern_fort_refund_tt: "£ADISCORD_economy_treasury_texticon ранее уплаченная сумма вернётся в казну."
 STP_cw_northern_fort_result_tt: "На границе округа §Y[FROM.GetName]§! появится §Y1§! уровень укреплений."
 STP_cw_northern_engineer_idle_tt: "Нет другой инженерной группы в пути"
 STP_cw_northern_engineer_ready_tt: "У получателя нет действующей инженерной группы"
 STP_cw_northern_engineer_refund_tt: "£ADISCORD_economy_treasury_texticon ранее уплаченная сумма вернётся в казну."
 STP_cw_nod_sabotage_idle_tt: "Нет другой диверсии в тылу Нодрула"
 STP_cw_nod_owned_tt: "Округ принадлежит и контролируется Нодрулом"
 STP_cw_nod_sabotage_result_tt: "В §Y[FROM.GetName]§! будет повреждена инфраструктура. Нодрул на §Y42 дня§! получит срыв тыла; при активной подготовке интервенции её срок сдвинется на §Y21 день§!."
 STP_cw_assault_group_cost: "£ADISCORD_economy_treasury_texticon §Y6000§!"
 STP_cw_assault_group_cost_blocked: "£ADISCORD_economy_treasury_texticon §R6000§!"
 STP_cw_assault_group_cost_tooltip: "Стоимость полного заказа: £ADISCORD_economy_treasury_texticon §Y6000§!. Личный состав и вооружение закупаются в составе заказа."
 ADISCORD_STP_cw.70.limited: "Максим Шабрат объявлен победителем выборов и получил признание большей части окружной администрации и значительной части армии. Партийное руководство отказалось передать власть, но его вооружённое выступление оказалось заперто вокруг Бронзового конгресса и нескольких столичных гарнизонов.\n\nЗа пределами столицы учреждения в основном продолжают работу уже под новым правительством. На западе советы воспользовались кризисом и объявили самостоятельность, а Нодрул обсуждает поддержку оставшихся партийных сил. Стеландер избежал общего распада фронтов, но первая смена власти после Иванова всё равно началась с оружием в руках."
 STP_cw_start_uprising_tt: "Выборы будут прерваны. Начнётся раздел страны и армии; подготовленные части и склады определят силы сторон. После выбора стороны начнутся боевые действия."

 STP_cw_arsenal_idle_tt: "Нет другого арсенала на расширении"
 STP_cw_nod_busy_in_north_tt: "Нодрул связан действующей войной на севере"
 STP_nod_status_intervened: "§Rвступил на стороне партии.§!"
 STP_nod_status_closed: "угроза интервенции снята."
 STP_nod_status_northern_war: "§Yведёт войну на севере.§! Вступление пока невозможно; после войны потребуется переброска."
 STP_nod_status_redeploying: "§Rперебрасывает войска с севера.§! Осталось §Y[?NOD.days_mission_timeout@NOD_cw_northern_redeployment|0]§! дн."
 STP_nod_status_neutral: "отказался от интервенции."
 STP_nod_status_ready: "§Rармия готова к интервенции.§!"
 STP_nod_status_preparing: "готовит интервенцию - §Y[?NOD.days_mission_timeout@NOD_cw_intervention_preparation|0]§! дн. до готовности."
 STP_nod_status_northern_mobilization: "готовит северную кампанию; боевые действия ещё не начались."
 STP_nod_status_observing: "наблюдает за кризисом; северный фронт пока не отвлекает его армию."

 STP_cw_kefreyt_volunteers_cost_tt: "Кефрейт выделит £manpower_texticon §Y23700§! человек, £infantry_equipment_texticon §Y1830§! винтовок, §Y144§! комплекта вооружения отделений, §Y90§! единиц дополнительного оснащения, §Y180§! артиллерийских орудий и §Y60§! средств ПВО. Пакет оплачивается целиком, когда люди и вооружение будут собраны. При нехватке резервов Кефрейт продолжит комплектование; гражданская война не отменяет соглашение."

 STP_ARMY_KEFREYT_COMMITMENT: "\nКефрейт подготовил для сопротивления ещё §Y3§! добровольческие дивизии с артиллерией и ПВО. Они останутся до завершения войны."







 STP_cw_credentials_review: "Подтверждение полномочий делегатов"

 STP_cw_credentials_review_desc: "Партийный секретариат оспаривает списки Шабрата там, где некому подтвердить подписи. Каждые §Y35 дней§! отсутствие работающей администрации в [2.GetName] или [3.GetName] отнимает по §R8%§! легитимности. При сохранности обеих администраций потерь нет. Комиссия может уничтожить организацию: прикройте её, откройте гражданские реестры или восстановите до очередной сверки. Фокус штаба один раз откладывает текущую сверку на §Y80 дней§!. Агитация возмещает потерю поддержки, но занимает тот же слот, что и военная подготовка."

 STP_cw_monaya_credentials_missing_tt: "В [2.GetName] нет подконтрольной действующей администрации Шабрата"

 STP_cw_niansas_credentials_missing_tt: "В [3.GetName] нет подконтрольной действующей администрации Шабрата"

 ADISCORD_STP_preparation.20.t: "Приёмный день"

 ADISCORD_STP_preparation.20.d: "К восьми утра у окружного управления уже стояли две очереди. В одной ждали справок о выплатах семьям резервистов, в другой пытались выяснить, кого именно затронет новый призыв. Секретарь вынесла в коридор второй стул, поставила на подоконник чернильницу и начала записывать фамилии на обороте старой афиши. Телефон прямой связи со столицей молчал с самого утра.\n\nНа столе начальника округа лежали три бумаги, которые прежде даже не дошли бы до обсуждения без президентского разрешения. Нужно было открыть аварийный фонд после обвала дороги, подтвердить назначение врача в горный посёлок и разрешить выдачу топлива резервному батальону. Запросы отправили ещё вчера. Ответа не было.\n\nК полудню из столицы привезли новые бланки. На каждом по-прежнему было напечатано имя Петра Иванова. Начальник округа взял первый лист, долго смотрел на пустое место для подписи, затем написал собственную фамилию и добавил: «по поручению администрации президента». Никакого поручения он не получал. Через час таким же образом были оформлены ещё семь документов.\n\nНикто не назвал это неповиновением. Людям нужно было платить деньги, ремонтировать дорогу и выдавать топливо. Государство продолжало работать, потому что чиновники постепенно учились принимать решения, которые раньше существовали только после подписи одного человека.\n\nК вечеру телефон из столицы так и не зазвонил. На завтра очередь записали снова."

 ADISCORD_STP_preparation.20.a: "Работа продолжалась от имени человека, который её уже не вёл."

 ADISCORD_STP_preparation.21.t: "Место за столом"

 ADISCORD_STP_preparation.21.d: "Для утреннего совещания по привычке поставили двенадцать чашек. Одиннадцать заняли министры и руководители ведомств. Двенадцатая осталась перед пустым креслом председателя.\n\nПомощник Иванова открыл папку и начал читать повестку. Первый вопрос требовал подписи президента. Второй тоже. На третьем лежала записка из военного министерства с просьбой подтвердить распоряжение, отданное несколькими днями ранее. Никто в комнате не знал, увидит ли Иванов хотя бы одну из этих бумаг.\n\nРаньше подобное совещание остановили бы. Решение без президента считалось временным, а документ без его подписи возвращался отправителю. Сегодня Хедерсетт попросил читать дальше. Один министр возразил. Другой напомнил, что порт не может ждать выздоровления председателя. Через несколько минут собравшиеся уже распределяли расходы, назначали чиновников и утверждали распоряжения, которых Иванов никогда не видел.\n\nНикто не произнёс слова «преемник». Оно и не требовалось.\n\nК концу заседания бумаги лежали уже не перед пустым креслом, а перед Хедерсеттом. Помощник президента заметил это первым. Он ничего не сказал и лишь продолжил протокол.\n\nПосле совещания служащая начала собирать чашки. Дойдя до места Иванова, она на секунду остановилась. Чашка была нетронутой. На завтра в списке снова значились двенадцать.\n\nНо впервые за десятилетия Стеландером весь день управляли одиннадцать."

 ADISCORD_STP_preparation.21.a: "Страна училась жить без человека, который всё ещё был её президентом."
 NOD_cw_call_ain:0 "Призвать силы Айнхольма"
 NOD_cw_call_ain_desc:0 "Силы Айнхольмского мандата вступят в северную войну на нашей стороне. Участие колонии завершится вместе с северной кампанией."

 # Окружные советы и договор с сопротивлением
 SRP_council_authority: "Власть окружных советов"
 SRP_council_authority_desc: "Округа снабжают собственные отряды и сохраняют гражданское управление. Близость к местным складам облегчает подвоз, но общему штабу приходится согласовывать распоряжения с несколькими советами."
 SRP_emergency_command: "Чрезвычайные полномочия штаба"
 SRP_emergency_command_desc: "Нападение Кефрейта заставило советы передать штабу координацию обороны. Командиры организуют смену частей и общий план действий. Полномочия действуют только до окончания войны с Кефрейтом; победа или поражение Шабрата их не отменяет."
 SRP_council_supply: "Оплаченные поставки округам"
 SRP_council_supply_desc: "Правительство Шабрата оплатило оружие и работу местных мастерских. На 42 дня выпуск военных заводов увеличивается на 20%, восстановление организации - на 10%. Программа прекращается с окончанием войны против Кефрейта или потерей независимости."
 STP_cw_council_guarantees: "Гарантии окружным советам"
 STP_cw_council_guarantees_desc: "Довоенный договор пережил раскол. Шабрат обещал сохранить самостоятельность советов и получил возможность оплачивать их снабжение при нападении Кефрейта. После возвращения гражданской власти предстоит решить, станет ли обещание постоянной хартией."
 STP_cw_republican_charter: "Хартия окружного сотрудничества"
 STP_cw_republican_charter_desc: "Стеландер признал самостоятельность республик. Общие заказы и договорённости между мастерскими ускоряют строительство гражданских предприятий обеих сторон. Хартия не создаёт военного союза и не втягивает её участников в чужие войны."
 STP_cw_central_authority: "Полномочия центрального правительства"
 STP_cw_central_authority_desc: "Правительство отказалось закреплять обязательства перед окружными советами. Единый государственный заказ увеличивает выпуск военных заводов на 10%, административные расходы сокращаются на 5%. Республикам больше не обещают снабжения и совместных программ."
 SRP_distrust_stelander: "Недоверие к Стеландеру"
 SRP_distrust_stelander_desc: "Правительство Шабрата отступило от довоенных гарантий. Советы укрепляют оборону собственных земель и готовятся полагаться на себя. Отказ от хартии сам по себе не начинает новую войну."
 STP_cw_fund_republican_supplies: "Оплатить снабжение республик"
 STP_cw_fund_republican_supplies_desc: "За 300 единиц казны оплатим закупку у частных поставщиков для республик: 1200 винтовок и 30 единиц дополнительного оснащения поступят на склады республик. Работа окружных мастерских и восстановление частей получат поддержку на 42 дня. Наш собственный оружейный запас не расходуется. Следующую поставку можно оплатить через 42 дня, если война республик с Кефрейтом продолжается."
 STP_cw_republican_supplies_available_tt: "Обе стороны независимы и соблюдают договор; республики воюют с Кефрейтом, не капитулировали и завершили предыдущую программу поставок"
 STP_cw_republican_supplies_cost: "£ADISCORD_economy_treasury_texticon §Y300§!"
 STP_cw_republican_supplies_cost_blocked: "£ADISCORD_economy_treasury_texticon §R300§!"
 STP_cw_republican_supplies_cost_tooltip: "Стоимость: £ADISCORD_economy_treasury_texticon §Y300§!"
 STP_cw_negotiate_republican_charter: "Согласовать окружную хартию"
 STP_cw_negotiate_republican_charter_desc: "Гражданская власть восстановлена. Теперь можно вернуться к довоенным гарантиям и определить отношения с самостоятельными республиками. Их отдельная война с Кефрейтом не препятствует переговорам."
 STP_cw_republican_charter_available_tt: "Шабрат победил партию; обе стороны независимы, не капитулировали, сохраняют довоенные гарантии и не ведут уже открытые переговоры"
 ADISCORD_STP_cw.90.t: "Подписи под хартией"
 ADISCORD_STP_cw.90.d: "Представители окружных советов принесли копию соглашения, заключённого ещё до раскола. Бумага пожелтела по сгибам; рядом с подписью Шабрата стоят подписи людей, которые всё это время удерживали местное управление.\n\nТеперь советы предлагают закрепить самостоятельность республик и открыть совместные заказы для гражданских мастерских. Военный союз в документ не входит. Центральная канцелярия предлагает сосредоточить заказы на собственных военных заводах и сократить согласования с округами, которые больше не подчиняются столице. Отказ от хартии прекратит помощь советам.\n\nПредставители ждут ответа. Война изменила карту, но подписи остались прежними."
 ADISCORD_STP_cw.90.a: "Подтвердить гарантии и подписать хартию."
 ADISCORD_STP_cw.90.b: "Передать решение вопросов центральной канцелярии."
 ADISCORD_STP_cw.90.close: "Обстоятельства изменились."
 ADISCORD_STP_cw.91.t: "Письмо окружных советов"
 ADISCORD_STP_cw.91.guaranteed: "Письмо доставили с водителем грузовика. Советы подтвердили довоенное соглашение: республики будут управлять своими округами самостоятельно, а Шабрат сохранит обещанные гарантии.\n\nНа обороте приложен перечень мастерских и складов. Если Кефрейт нападёт, через них можно будет организовать оплаченные поставки оружия. Внизу приписка другой рукой: «После войны договор тоже понадобится»."
 ADISCORD_STP_cw.91.independent: "В письме окружных советов нет просьбы назначить губернатора. Республики сообщили о создании собственного управления и предложили избегать столкновений на границе.\n\nВоенные требуют общего плана обороны, местные представители - сохранить контроль над запасами и людьми. При нападении Кефрейта штаб получит чрезвычайные полномочия, но советы не собираются распускаться. Победа в столице ещё не решит вопрос об их будущем."
 ADISCORD_STP_cw.91.a: "Принято к сведению."

 STP_cw_public_campaign_basis_tt: "Осталась новая кампания из трёх; наступил её этап выборов. Для второй кампании Шабрата нужна администрация в Монаии или Ниансасе, для третьей - обе; каждое требуемое управление непрерывно работает 21 день."
 STP_cw_delegate_support_available_tt: "Преимущество нашей стороны на шкале легитимности меньше 55%"
 STP_cw_command_timing_no_election: "Выборы ещё не открыты. Договор действует лишь 50 дней после завершения переговоров."
 STP_cw_command_timing_early: "§YРано для обычного результата выборов.§! Переговоры займут 35 дней, затем договор действует 50 дней. Подписанный сейчас договор может истечь до подсчёта голосов; раннее подписание не переносит дату выборов."
 STP_cw_command_timing_late: "§RПереговоры уже не успевают к обычному результату выборов.§! До него осталось не больше 35 дней."
 STP_cw_command_timing_ready: "§GДоговор успеет вступить в силу и сохранится к обычному результату выборов.§! Переговоры займут 35 дней, затем обязательство действует 50 дней."
 STP_cw_military_committee_fund: "Средства военного комитета"
 STP_cw_military_committee_fund_desc: "Военные предлагают направить собранные сторонниками средства на оснащение ударной части. Комитет получит деньги сразу, но гражданские делегаты увидят в этом подготовку захвата власти. Строительство собственных мастерских придётся отложить."
 STP_cw_military_fund_tt: "Казна получит £ADISCORD_economy_treasury_texticon §Y18000§! - стоимость трёх усиленных дивизий. Каждый заказ через уже открытое решение занимает §Y28 дней§! и слот подготовки; фокус сам не создаёт части. Неизрасходованные деньги при расколе делятся вместе с общей казной."
 STP_cw_abila_workshops: "Мастерские Абилии"
 STP_cw_abila_workshops_desc: "Развернём военное производство в Абилии: четыре военных завода и четыре места под постройки. Мастерские не дадут готовой ударной части к выступлению, зато смогут восполнять потери после первых боёв. Средства на отдельное усиленное формирование военный комитет не получит."
 STP_cw_abila_workshops_tt: "При расколе штат Абилия вместе с четырьмя военными заводами переходит сопротивлению. До раздела выпуск поступает на общие государственные склады; направление производства выбирается обычным способом."

 STP_cw_election_time_21_tt: "До результата выборов больше 21 дня: кампания успеет завершиться"
 STP_cw_election_time_14_tt: "До результата выборов больше 14 дней: переговоры успеют завершиться"
 STP_pw_republic_dynamic: "Республика округов"
 STP_pw_republic_dynamic_desc: "Гражданские учреждения, восстановленное хозяйство и профессиональная армия республики. Принятые послевоенные решения определяют их общие возможности."
 STP_pw_party_dynamic: "Обновлённый президиум"
 STP_pw_party_dynamic_desc: "Постоянное партийное управление, промышленное планирование и регулярная армия. Их возможности зависят от выбранного порядка послевоенного восстановления."
 STP_pw_reconstruction_available_tt: "Наша сторона победила в гражданской войне, и её военные программы завершены."
 STP_pw_industry_reserve_tt: "При отсутствии доступной площадки вместо нового предприятия казна получит строительный резерв: £ADISCORD_economy_treasury_texticon §Y900§!. Постоянная промышленная специализация сохраняется."
 STP_pw_republic_new_republic: "Службы возвращаются в округа"
 STP_pw_republic_new_republic_desc: "Врач, почтальон и служащий нужны жителям не меньше новой конституции. Откроем оплачиваемую программу гражданских служб и восстановим доверие к новой администрации."
 STP_pw_republic_district_authority: "Окружные управления"
 STP_pw_republic_district_authority_desc: "Военные комендатуры передадут хозяйственные вопросы постоянным управлениям. Единые правила сократят расходы и избавят кабинет от разбора каждого местного спора."
 STP_pw_republic_civil_records: "Восстановить реестры"
 STP_pw_republic_civil_records_desc: "Без списков жителей, имущества и обязательств нельзя ни назначить пособие, ни взыскать налог. Архивисты и местные советы сведут уцелевшие документы. Нодрул получит уведомление о пересмотре прежнего мандата."
 STP_pw_republic_open_settlement: "Сохранить местные кадры"
 STP_pw_republic_open_settlement_desc: "Оставим на службе специалистов, не участвовавших в репрессиях. Быстрое примирение укрепит доверие, но заставит командование считаться с неоднородностью нового аппарата."
 STP_pw_republic_firm_settlement: "Проверить назначения"
 STP_pw_republic_firm_settlement_desc: "Назначения пройдут проверку окружных комиссий. Кабинет получит более надёжный аппарат ценой затянувшихся споров и меньшей поддержки на местах."
 STP_pw_republic_civil_charter: "Устав государственной службы"
 STP_pw_republic_civil_charter_desc: "Закрепим ответственность чиновников, порядок жалоб и границы полномочий окружных управлений. Эти правила будут действовать при любом дальнейшем политическом устройстве."
 STP_pw_republic_restore_roads: "Вернуть хозяйству дороги"
 STP_pw_republic_restore_roads_desc: "Соединим столицу с окружными центрами и восстановим работу дорожных служб. Первые работы улучшат одну из дорог, дальнейшее строительство пойдёт быстрее."
 STP_pw_republic_homes_for_returnees: "Вернуть рабочие семьи"
 STP_pw_republic_homes_for_returnees_desc: "Жильё и надёжная дорога позволят эвакуированным семьям вернуться. После этого можно оплатить запуск мастерских, где будут работать вернувшиеся специалисты."
 STP_pw_republic_civil_workshops: "Кооперативные мастерские"
 STP_pw_republic_civil_workshops_desc: "Объединим небольшие мастерские в устойчивые производственные кооперативы. Новое гражданское предприятие станет образцом для следующей волны строительства."
 STP_pw_republic_accountable_arsenals: "Арсеналы под гражданским надзором"
 STP_pw_republic_accountable_arsenals_desc: "Армия сохранит необходимые оружейные мощности, но их работа войдёт в открытый государственный бюджет. Восстановим одно предприятие и упорядочим снабжение действующих заводов."
 STP_pw_republic_industrial_settlement: "Хозяйство без чрезвычайных приказов"
 STP_pw_republic_industrial_settlement_desc: "Согласуем заказы гражданских мастерских и арсеналов, чтобы они не конкурировали за одних рабочих и станки. Производство получит устойчивую загрузку."
 STP_pw_republic_army_register: "Учёт фронтовых частей"
 STP_pw_republic_army_register_desc: "Сведём отдельные отряды в армейский реестр и откроем программу подготовки кадров. Дивизии сохранятся, но пополнение и снабжение станут общими."
 STP_pw_republic_officer_school: "Школа полевых командиров"
 STP_pw_republic_officer_school_desc: "Командиры сопротивления научат новых офицеров тому, что помогло их отрядам выстоять. Общая программа соединит инициативу младших командиров с регулярной подготовкой."
 STP_pw_republic_supply_service: "Служба снабжения округов"
 STP_pw_republic_supply_service_desc: "Окружные склады будут работать по единому графику. Части станут быстрее восстанавливать боеспособность и меньше терять при доставке припасов."
 STP_pw_republic_professional_service: "Кадровая армия республики"
 STP_pw_republic_professional_service_desc: "Постоянные части получат единый порядок службы и подготовки пополнений. Это основа и для обороны перевалов, и для будущих внешних кампаний."
 STP_pw_republic_settled_state: "Завершить чрезвычайное восстановление"
 STP_pw_republic_settled_state_desc: "Гражданские службы, мастерские и регулярная армия должны работать до закрытия чрезвычайного бюджета. Завершение трёх оплаченных программ позволит закрепить производственный рост и вернуть уверенность жителям."
 STP_pw_party_new_republic: "Государство после Иванова"
 STP_pw_party_new_republic_desc: "Победа сохранила партию, но не вернула прежний порядок управления. Хедерсетту предстоит восстановить министерства, промышленность и гвардию, а затем определить отношения центра с окружными организациями. Соглашение с местными элитами и чрезвычайная вертикаль - разные внутренние курсы. Отношения с Нодрулом решаются отдельно."
 STP_pw_party_district_authority: "Окружные секретариаты"
 STP_pw_party_district_authority_desc: "Восстановим единую цепочку управления от президиума до округов. Постоянные секретариаты сократят расходы на параллельные комиссии и ускорят исполнение решений."
 STP_pw_party_civil_records: "Списки военного времени"
 STP_pw_party_civil_records_desc: "В партийных картотеках рядом стоят фамилии мятежников, уклонистов и инженеров, не успевших получить разрешение на эвакуацию. Проверка дел определит, кого мы вернём к работе и кого объявим врагом."
 STP_pw_party_open_settlement: "Договор с окружными элитами"
 STP_pw_party_open_settlement_desc: "Вернём специалистов и признаем роль окружных организаций в восстановлении. Дальнейшая линия закрепит их полномочия и сохранит местные кадры. Это ускорит гражданскую работу ценой части свободы центрального секретариата."
 STP_pw_party_firm_settlement: "Чрезвычайная партийная вертикаль"
 STP_pw_party_firm_settlement_desc: "Хедерсетт считает неопределённость в назначениях продолжением войны другими средствами. Создадим кадровые комиссии и единую цепь подчинения. Силовой резерв станет отдельной оплачиваемой мерой. Усиление центра имеет цену в виде чисток, издержек контроля и потерь специалистов."
 STP_pw_party_civil_charter: "Устав партийного государства"
 STP_pw_party_civil_charter_desc: "После съезда окружных секретариатов или создания исполнительного секретариата оформим постоянный порядок партийного государства. Устав не стирает выбранную модель: договорная система сохраняет местную инициативу, вертикаль - контроль центра. Военная, экономическая и внешняя оси остаются самостоятельными."
 STP_pw_party_restore_roads: "Вернуть пути к портам"
 STP_pw_party_restore_roads_desc: "Военные перевозки разорвали связь округов с побережьем. Вернём дорожным службам единый план, чтобы грузы снова доходили до портов, а рабочие - до предприятий."
 STP_pw_party_homes_for_returnees: "Приёмные трудовых округов"
 STP_pw_party_homes_for_returnees_desc: "Окружные приёмные сверят рабочие списки с жильём и возвращающимися семьями. После этого можно оплатить восстановление одного подконтрольного портового округа: гражданского предприятия и его подъездных путей."
 STP_pw_party_civil_workshops: "Вернуть курортное хозяйство"
 STP_pw_party_civil_workshops_desc: "До войны доходы побережья содержали значительную часть аппарата. Восстановим гражданские предприятия и разрешим домам вернуться к обслуживанию портов и курортов. Эти средства уже нельзя одновременно обещать оборонным заводам."
 STP_pw_party_accountable_arsenals: "Военный заказ вместо сезона"
 STP_pw_party_accountable_arsenals_desc: "Отложим возвращение курортного сезона: материалы, рабочие и новые мощности получат оборонные предприятия. Армия укрепится раньше, но гражданскому хозяйству придётся ждать."
 STP_pw_party_industrial_settlement: "Послевоенный производственный план"
 STP_pw_party_industrial_settlement_desc: "Коммерческое восстановление или оборонный комбинат уже задали приоритет экономики. Теперь сведём налоги, капитальные расходы и производственные планы в обычный послевоенный бюджет. Различия между двумя моделями сохраняются; общий фокус лишь прекращает аварийный режим."
 STP_pw_party_army_register: "Пересчитать внутренние силы"
 STP_pw_party_army_register_desc: "Внутренние войска выиграли борьбу за правительство, но их ведомственные списки не годятся для регулярной армии. Пересчитаем части и откроем оплачиваемую программу переоснащения: оружие, средства обеспечения и грузовики поступят в общий армейский запас."
 STP_pw_party_officer_school: "Штаб вместо комендатуры"
 STP_pw_party_officer_school_desc: "Командиров учили охранять здания и подавлять беспорядки. Теперь им предстоит готовить операции нескольких соединений, работать с картами и отвечать за связь с соседями."
 STP_pw_party_supply_service: "Снабжение пограничных частей"
 STP_pw_party_supply_service_desc: "Сделаем логистику главным принципом новой армии. Постоянные склады и единый учёт заменят ведомственные выдачи, а пограничные части получат приоритет по фактической потребности. Этот курс ведёт к оборонным корпусам округов и исключает ставку на самостоятельный полевой штаб."
 STP_pw_party_professional_service: "Армия за пределами столицы"
 STP_pw_party_professional_service_desc: "Сделаем полевую службу главным принципом новой армии. Внутренние войска перейдут к единой программе манёвров, совместных учений и подготовки командиров для операций нескольких соединений. Этот курс ведёт к полевому генеральному штабу и исключает глубокую окружную логистическую специализацию."
 STP_pw_party_settled_state: "Закончить чрезвычайное правление"
 STP_pw_party_settled_state_desc: "Чрезвычайное правление можно закрыть только после четырёх решений: как устроена партийная власть, на чём зарабатывает экономика, какой армией располагает страна и в каком качестве она существует рядом с Нодрулом. После этого незавершённые чистки прекращаются, а президиум принимает ответственность за обычную жизнь государства."
 STP_pw_party_district_congress: "Съезд окружных секретариатов"
 STP_pw_party_district_congress_desc: "Компромисс должен стать институтом, а не серией личных обещаний. Окружные секретариаты получат регулярный съезд и право заранее согласовывать часть хозяйственных решений. Центр теряет немного оперативной свободы, но получает предсказуемое исполнение, налоговую базу и меньше причин снова управлять через чрезвычайные комиссии."
 STP_pw_party_executive_secretariat: "Исполнительный секретариат"
 STP_pw_party_executive_secretariat_desc: "Единая цепь распоряжений нуждается в органе, который ежедневно проверяет исполнение. Исполнительный секретариат сведёт назначения, отчётность и контроль ведомств в одном аппарате. Решения станут дешевле для центра и быстрее политически, но постоянное давление на округа оставит след на внутренней устойчивости."
 STP_pw_party_commercial_recovery: "Открыть побережье для оборота"
 STP_pw_party_commercial_recovery_desc: "Снимем чрезвычайные ограничения с гражданского оборота, расширим складские мощности и вернём долгосрочные перевозки. Портовые контракты должны стать основой устойчивой торговли."
 STP_pw_party_defence_combine: "Оборонный производственный комбинат"
 STP_pw_party_defence_combine_desc: "Сведём государственный заказ в единую производственную цепочку: металл, ремонт, артиллерию и стрелковое вооружение. Работу комбината согласуют военные заказчики и заводское управление."
 STP_pw_party_fortress_corps: "Оборонные корпуса округов"
 STP_pw_party_fortress_corps_desc: "Если новая армия прежде всего должна пережить следующий кризис, её основу составят снабжённые окружные корпуса. Единые склады, маршруты пополнения и оборонные планы снизят расход снабжения и ускорят восстановление частей. Это путь устойчивого фронта, а не быстрого наступления."
 STP_pw_party_field_staff: "Полевой генеральный штаб"
 STP_pw_party_field_staff_desc: "Регулярная армия должна уметь действовать дальше столичных караулов и заранее готовить операции. Полевой штаб получит полномочия сводить дивизии в общие планы, проводить манёвры и оценивать командиров по результату в поле. Цена выбора - отказ от более глубокой окружной логистической специализации."
 STP_pw_party_joint_defence_board: "Совместная оборонная комиссия"
 STP_pw_party_joint_defence_board_desc: "Возобновлённый протекторат не должен существовать только на бумаге. Стеландер сведёт собственный штаб и северных советников в постоянную комиссию, закрепит обмен планами и снабженческими стандартами. Даже если отдельная оружейная сделка не состоялась, сама система связи с покровителем останется."
 STP_pw_party_armed_neutrality: "Вооружённая самостоятельность"
 STP_pw_party_armed_neutrality_desc: "Отказ от покровителя имеет смысл только тогда, когда его можно защитить. Создадим резерв вооружения, стандартизируем снабжение и закрепим обязанность промышленности поддерживать мобилизационный запас. Самостоятельность станет не декларацией, а оплаченной военной политикой."
 STP_pw_party_foreign_settlement: "Закрепить внешний статус"
 STP_pw_party_foreign_settlement_desc: "Внешний статус можно считать установленным только после фактической проверки выбранного курса. Протекторат закрывает вопрос договором с Нодрулом. Независимый путь должен пережить его ультиматум и, если вторжение началось, военным путём заставить север признать существование самостоятельного Стеландера."
 STP_pw_infantry_lessons_bonus: "Опыт гражданской войны"
 STP_pw_postwar_budget_available_tt: "§YПобедитель гражданской войны в Стеландере§!: внутренний конфликт должен быть завершён, а победа зафиксирована.\n§YГорные республики§!: для них отдельно должен завершиться их собственный конфликт. §gЭто альтернативные условия для разных стран, а не общее требование.§!"

 ADISCORD_STP_preparation.8.pending: "Кефрейт согласился помочь, но его интенданты вернули заявку с отметкой о неполной комплектации. Формирование частей продолжается. Соглашение не отменено, даже если Стеландер успеет расколоться раньше.\n\nВ штабе Шабрата эту формулировку прочитали несколько раз. Помощь существует на бумаге. Теперь необходимо удержать путь, по которому она сможет прийти."
 ADISCORD_STP_preparation.8.delivered: "Абила услышала колонны раньше, чем увидела их. Машины вошли в город на рассвете, затем подтянулись артиллерия и средства ПВО. Офицер связи передал Шабрату пакет с приказами и коротко сообщил, что три дивизии готовы перейти под его командование.\n\nНа вокзале не было церемонии. Война уже началась, и Кефрейт прибыл не для фотографии."
 STP_ARMY_KEFREYT_PENDING: "\nКефрейт согласился помочь: §Y3 добровольческие дивизии комплектуются§!. Они ещё не оплачены и не включены в нашу армию; для прибытия нужно удерживать Абилу."
 STP_cw_renew_kefreyt_request: "Возобновить переговоры с Кефрейтом"
 STP_cw_renew_kefreyt_request_desc: "Повторно запросить три добровольческие дивизии после отказа. При согласии Кефрейт выделит готовый контингент или поставит его на комплектование. Повторные переговоры возможны через 30 дней."

 ADISCORD_STP_pc.1.t: "Список растёт"
 ADISCORD_STP_pc.1.d: "Связной принёс копию внутренней ведомости без печати. На первой странице стояли адреса двух типографий, мастерской, школьного подвала и квартир, где курьеры меняли одежду перед выходом в горы. Рядом аккуратным почерком были отмечены часы наблюдения и фамилии людей, которые слишком часто появлялись рядом.\n\nПока никого не брали. Служба безопасности делала то, что опаснее раннего ареста: собирала карту сети. Один задержанный дал бы партии имя. Неделя наблюдения могла дать ей весь маршрут от столицы до окружных ячеек.\n\nШабрат перечитал список дважды. Несколько адресов он знал лично. Остальные пришлось уничтожить сразу после чтения. Подполье ещё не раскрыто, но отныне любое лишнее письмо, встреча или слишком знакомое лицо у подъезда может стать последним звеном, которого не хватало партии."
 ADISCORD_STP_pc.1.a: "Держать сеть тише"

 ADISCORD_STP_pc.2.t: "Ночной список"
 ADISCORD_STP_pc.2.d: "На этот раз в копии были уже не адреса, а фамилии. Напротив каждой стояло ведомство, место работы, родственники и короткая пометка о том, кто способен вывести службу на следующего человека. Машины без номеров появились возле двух мастерских. В школьном подвале нашли следы недавнего обыска, хотя дверь оставили закрытой и замок аккуратно вернули на место.\n\nПартия всё ещё не наносила удар. Ей нужен был не один громкий арест, а момент, когда сопротивление нельзя будет предупредить одним звонком. Несколько людей предложили немедленно уходить в горы. Другие напомнили, что исчезновение сразу подтвердит подозрения.\n\nШабрат приказал оборвать второстепенные связи и оставить только те каналы, без которых сеть действительно перестанет работать. Теперь речь шла не о том, заметила ли их служба безопасности. Речь шла о том, сколько она уже знает."
 ADISCORD_STP_pc.2.a: "Продолжать"

 ADISCORD_STP_pc.3.t: "Арест"
 ADISCORD_STP_pc.3.d: "Имя на бланке не искали дважды. Его внесли в ночной список вместе с адресами типографий и ключами от школьных подвалов. К утру высокогорье ещё спорило, правда ли это, а в Фаде уже закрыли внутренний двор.\n\nШабрата взяли живым. Партия не объявила его мёртвым и не предложила торг. Для аппарата достаточно, что человек, который называл Иванова сделкой, больше не ходит сам.\n\nСеть не исчезла вместе с ним. Исчез тот, кто умел говорить за неё целиком."
 ADISCORD_STP_pc.3.a: "Передать командование Сотникову"
 ADISCORD_STP_pc.3.a_tt: "Сотников принимает командование сопротивлением. Партийное правительство не становится его государством."
 ADISCORD_STP_pc.3.b: "Держать сеть по протоколу Горнина"
 ADISCORD_STP_pc.3.b_tt: "Горнин вводится как возможный преемник сопротивления. Партийное правительство не назначает его своим руководителем."
 ADISCORD_STP_pc.4.t: "Стеландская гегемония"
 ADISCORD_STP_pc.4.d: "Советы ещё заседали, когда указ уже лежал на столе. В нём не было слова «империя». Там было проще: Стеланд больше не согласует своё выживание с чужим календарём, а спорные округа больше не имеют права останавливать приказ.\n\nЧасть победителей узнала в этом старый страх высокогорья - что после партии придёт новый хозяин с местным именем. Другая часть узнала то, чего ждала с первого дня войны: страна, которая снова говорит первой.\n\nОбратно этот порог не открывается. Кто придёт после Шабрата, унаследует систему, а не право выбрать за него другую."
 ADISCORD_STP_pc.4.a: "Закрепить курс"

 ADISCORD_STP_pc.5.t: "Свобода против рабства"
 ADISCORD_STP_pc.5.d: "Хартия не обещала мир. Она обещала другое: армия не назначает округ, округ не назначает войну, а война не отменяет срок чрезвычайных полномочий.\n\nШабрату не ставили чемодан у двери. Ему ставили рамку, в которой его слово было самым сильным - пока собрание не решит иначе.\n\nСоседей это не спасало. Режим, который держит человека как товар или как контрактную роту, оставался врагом. Менялось только то, кем Стеланд имеет право стать после чужой победы: хозяином или союзником."
 ADISCORD_STP_pc.5.a: "Подписать хартию"

 ADISCORD_STP_pc.6.t: "Штаб принимает сопротивление"
 ADISCORD_STP_pc.6.d: "Папку принесли Сотникову без церемонии. Внутри лежали шифры, списки окружных связных, адреса запасных складов и тонкая тетрадь с теми договорённостями, которые Шабрат предпочитал держать в голове. Последняя страница была пустой.\n\nНесколько командиров ожидали речи о мести. Сотников вместо этого потребовал проверить, какие каналы уже скомпрометированы после ареста, кто из людей всё ещё на свободе и какие склады можно открыть без риска потерять их через сутки. Он не сел в кресло Шабрата и не приказал убрать его со стола.\n\nСопротивление получило нового человека на вершине цепочки, но не нового вождя по праву наследства. Если сеть переживёт арест, это будет потому, что умеет передавать командование быстрее, чем партия успевает отрезать следующую связь."
 ADISCORD_STP_pc.6.a: "Принять цепочку"
 ADISCORD_STP_pc.6.a_tt: "Командование переходит Сотникову на стороне сопротивления."

 ADISCORD_STP_pc.7.t: "Печать можно передать"
 ADISCORD_STP_pc.7.d: "На столе лежала государственная печать и несколько папок с разными фамилиями. Политический курс уже закреплён в законах, штабах и договорах. Ни одна смена лица не вернёт страну к моменту, когда всё ещё можно было выбрать другой путь.\n\nНо подпись по-прежнему имеет значение. Она решает, кто будет объяснять этот порядок округам, кому армия понесёт спорный приказ и чьё имя появится под следующим международным соглашением. Для одних возможных преемников созданная Шабратом система была инструментом, для других рамкой, которую ещё можно наполнить другим содержанием.\n\nКанцелярия ждала только одного распоряжения: чьё имя готовить на новых бланках. Государство уже существовало отдельно от своего основателя. Теперь ему предстояло доказать, что это не просто красивая формула."
 ADISCORD_STP_pc.7.a: "Оставить преемника"
 ADISCORD_STP_pc.7.b: "Вернуть Шабрата"
 ADISCORD_STP_pc.7.c: "Передать Горнину"
 ADISCORD_STP_pc.7.da: "Передать Тих"

 ADISCORD_STP_pc.8.t: "Смерть основателя"
 ADISCORD_STP_pc.8.d: "Известие пришло до рассвета. В коридоре правительственного здания ещё горели ночные лампы, когда дежурный секретарь снял трубку, выслушал несколько фраз и попросил повторить их медленнее. Максим Шабрат умер.\n\nЧерез час закрыли вход во внутренний двор. Командиры начали звонить друг другу раньше, чем появилось официальное сообщение. В округах спрашивали, отменяются ли подписанные приказы. В кабинете преемника лежали те же карты, договоры и списки назначений, что вчера. Ни один документ не исчез вместе с человеком, который их утвердил.\n\nТак закончилась последняя иллюзия переходного времени. Шабрат больше не мог вернуться и исправить собственную систему. Отныне её должны были либо продолжить, либо сломать люди, для которых его имя уже становилось частью истории."
 ADISCORD_STP_pc.8.a: "Продолжать без него"

 ADISCORD_STP_pc.9.t: "Счёт Кефрейту"
 ADISCORD_STP_pc.9.d: "Кефрейтская делегация положила на стол не старые счета за винтовки, а свежие карты. На них были отмечены пограничные склады, дороги, ресурсные участки и территории, которыми Кефрейт распоряжается сейчас. Стеландские представители принесли собственные копии договоров и сразу отделили прежнюю помощь сопротивлению от сегодняшнего спора.\n\nОбе стороны понимали разницу. Оружие, проданное во время гражданской войны, было оплаченной сделкой. Оно не превращало каждую последующую уступку в продолжение долга. Теперь обсуждались реальные рычаги: кому принадлежит коридор, кто контролирует склады и на каких условиях сосед признаёт новый порядок в Стеланде.\n\nПереговоры начинались без благодарностей. Именно поэтому у них был шанс закончиться настоящим договором."
 ADISCORD_STP_pc.9.a: "Назвать счёт"
 ADISCORD_STP_pc.9.b: "Принять условия"
 ADISCORD_STP_pc.9.c: "Отказать"

 ADISCORD_STP_pc.10.t: "Мандат после войны"
 ADISCORD_STP_pc.10.d: "В нодрульской канцелярии разложили старые договоры рядом с сообщениями о победе Шабрата. На одних стояли подписи Иванова и печати прежнего правительства. Другие фиксировали уже новую реальность: партийный аппарат разбит, столица подчиняется людям, которые никогда не признавали нодрульский мандат своим.\n\nЧасть советников предлагала признать случившееся и сохранить влияние через торговлю. Другие предупреждали, что молчание будет прочитано как отказ от всей системы, которую Нодрул десятилетиями строил южнее границы. В итоге в Стеланд отправили ноту. Она не содержала приказа армии и не объявляла войну. Она содержала более неприятный вопрос: считает ли новое правительство старые обязательства умершими вместе с режимом Иванова.\n\nОтвет теперь определит, останется ли спор дипломатическим."
 ADISCORD_STP_pc.10.a: "Мандат остаётся в силе."
 STP_pc_nod_crisis_opened_tt: "Для Стеланда открыт послевоенный кризис Нодрула. Ответ зависит от выбранного политического курса. Это заявление само по себе не объявляет войну и не отправляет вооружение."

 ADISCORD_STP_pc.11.t: "Самостоятельное правительство"
 ADISCORD_STP_pc.11.d: "Стеландский пакет привезли в нескольких одинаковых папках. В нём не было предложения сменить флаг на стеландский или посадить в кабинет чужого губернатора. Вместо этого перечислялись условия, по которым местное правительство сможет выйти из прежней зависимости, сохранить собственные учреждения и перестроить отношения с соседями на новом основании.\n\nДля одних чиновников это выглядело редким шансом получить самостоятельность без ещё одной войны. Для других всё равно оставалось чужим проектом, пусть и написанным более вежливым языком. Особенно раздражало то, что Стеланд теперь выступал не просителем, а государством, которое предлагает другим модель их будущего.\n\nПодписывать пакет никто не обязан. Но отказ тоже станет политическим выбором, а не возвращением к прежнему состоянию."
 ADISCORD_STP_pc.11.a: "Принять пакет"
 ADISCORD_STP_pc.11.b: "Отказать"

 ADISCORD_STP_pc.12.t: "Чрезвычайный указ"
 ADISCORD_STP_pc.12.d: "Чрезвычайный указ занял всего несколько страниц. Он передавал правительству право ускорять назначения, распоряжаться перевозками и обходить часть процедур, которые в мирное время заставили бы ведомства неделями обмениваться печатями. Юристы несколько раз подчеркнули слово «временно».\n\nШабрат прочитал именно эти места дольше остальных. Во время гражданской войны сопротивление слишком хорошо знало, как легко чрезвычайная необходимость превращается в постоянную привычку государства. Теперь та же логика работала в его пользу. Армия требовала быстрых решений, округа спорили между собой, внешние кризисы не ждали заседаний.\n\nУказ ещё не определял окончательный строй Стеланда. Он определял другое: насколько много власти правительство готово взять сейчас, обещая решить позже, сколько из неё действительно вернёт."
 ADISCORD_STP_pc.12.a: "Держать указ"

 ADISCORD_STP_pc.13.t: "Протокол Горнина"
 ADISCORD_STP_pc.13.d: "Горнин пришёл на заседание с папкой исправлений, а не с речью. Он уже месяцами сводил решения кабинета в тексты, по которым потом работали казначеи, окружные секретари и армейские снабженцы. Там, где политики спорили о принципе, он обычно спрашивал, кто подпишет расходную ведомость и что произойдёт утром после принятия постановления.\n\nИменно поэтому его имя впервые появилось в разговоре о преемстве. Не как имя человека, способного повторить Шабрата, и не как попытка создать нового героя. Горнин представлял другое обещание: государство может пережить эпоху больших фигур, если кто-то умеет превращать их решения в работающий порядок.\n\nОн выслушал предложение до конца и попросил время перечитать полномочия. Это было очень похоже на него."
 ADISCORD_STP_pc.13.a: "Внести в список"

 ADISCORD_STP_pc.14.t: "Реестр Тихоревой"
 ADISCORD_STP_pc.14.d: "Тихорева вошла в архив, когда последние ящики ещё стояли в коридоре. На столах лежали списки исчезнувших, копии закрытых договоров, реестры собственности и ведомости, которые победители совсем недавно собирались использовать против старого режима. Она попросила сначала убрать со стен политические плакаты и только потом начинать работу.\n\nДля Тихоревой архив был не складом доказательств и не оружием одной фракции. Он был местом, где государство обязано помнить одинаково неудобные вещи: преступления партии, злоупотребления победителей, чужие подписи и собственные обещания. Такая позиция быстро сделала её заметнее обычного хранителя документов.\n\nКогда её имя внесли в список возможных руководителей, она не закрыла папку. Только поставила закладку и спросила, кто теперь будет отвечать за сохранность оригиналов."
 ADISCORD_STP_pc.14.a: "Открыть реестр"

 ADISCORD_STP_pc.15.t: "Нодрул отвечает"
 ADISCORD_STP_pc.15.d: "Нодрульская нота пришла без прежнего гербового языка о дружбе и общей безопасности. В ней сухо перечислялись договоры, советнические полномочия и гарантии, на которых когда-то держался послевоенный Стеландер. Северное правительство не признавало, что победа Шабрата сама по себе аннулирует эту систему.\n\nВ кабинете нового правительства документ читали молча. Люди, недавно спорившие о том, какие архивы публиковать и как назвать страну, теперь увидели главное внешнее наследство режима Иванова в одной папке. Нодрул пока не двигал войска и не ставил окончательного срока. Он оставлял Стеланду возможность ответить словами.\n\nНо сама формулировка ноты не оставляла сомнений: для Нодрула вопрос о независимости ещё не закрыт."
 ADISCORD_STP_pc.15.a: "Принять к сведению"

 ADISCORD_STP_pc.11.c: "Закрыть без пакета"

 # Postwar political continuation
 STP_pc_after_victory: "Правительство победы"
 STP_pc_after_victory_desc: "Столица занята, но единое государство ещё предстоит собрать. Утвердим общий план восстановления. Гражданские службы, промышленность и армия потребуют отдельных вложений; постоянный кабинет и политическое устройство страны определят дальнейший выбор."
 STP_pc_count_ruins: "Пересчёт разрушений"
 STP_pc_count_ruins_desc: "Сначала нужно понять, что уцелело. Перепись дорог и домов покажет, какие ядра остались у Кефрейта и где ещё можно чинить хозяйство."
 STP_pc_war_ledgers: "Обязательства военного времени"
 STP_pc_war_ledgers_desc: "Сведём договоры, расписки и обещания времён восстания. Если Кефрейт поставлял добровольцев, можно отдельно рассчитаться с ним. Его планы на границе всё равно потребуют внимания."
 STP_pc_name_steland: "Назвать страну Стеланд"
 STP_pc_name_steland_desc: "Сопротивление больше не прячет имя. На картах и в переписке страна снова называется Стеланд."
 STP_pc_two_borders: "Две границы"
 STP_pc_two_borders_desc: "Пограничная служба изучит расположение войск Кефрейта и Нодрула. Кабинет должен знать, где ведётся обычная смена гарнизонов, а где готовится новая кампания."
 STP_pc_army_from_resistance: "От отрядов к армии"
 STP_pc_army_from_resistance_desc: "Отряды, которые брали перевалы, нужно свести в постоянные соединения. Война с соседом не отменяет этой работы."
 STP_pc_army_field_count: "Полевой учёт"
 STP_pc_army_field_count_desc: "Штаб пересчитает винтовки и людей на перевале. Нехватка оружия бьёт по организации раньше, чем по карте."
 STP_pc_army_officers: "Офицерский состав"
 STP_pc_army_officers_desc: "Полевые командиры получат общий штабной язык. Если основателя уже брали, сеть явок чинят отдельно."
 STP_pc_army_supply: "Снабжение перевалов"
 STP_pc_army_supply_desc: "Склады в Абилии или Хосхейте должны кормить горные части, а не только столичный гарнизон."
 STP_pc_army_mountain: "Горная оборона"
 STP_pc_army_mountain_desc: "Закрепим опыт горной войны в подготовке постоянных частей. Оборона собственной территории получит устойчивое преимущество."
 STP_pc_army_against_heavy: "Против более тяжёлого"
 STP_pc_army_against_heavy_desc: "Подготовим противотанковые расчёты и откроем оплачиваемые заказы на пехотное снаряжение и артиллерию. Командование сможет восполнять запасы перед выбранной кампанией."
 STP_pc_army_limited_offense: "Короткое наступление"
 STP_pc_army_limited_offense_desc: "Штабы отработают наступление с ограниченной целью и заранее подготовленным снабжением. Решение позволит включать временное усиление тогда, когда армия готова атаковать."
 STP_pc_army_hegemony_cadres: "Личные кадры"
 STP_pc_army_hegemony_cadres_desc: "Офицерские школы будут готовить командиров для армии, поддерживающей внешнюю политику сильного центра."
 STP_pc_army_republic_control: "Армия под законом"
 STP_pc_army_republic_control_desc: "Гражданское правительство получит контроль над назначениями. Доверие к армии вырастет, хотя согласование планов займёт больше времени."
 STP_pc_army_staff_doctrine: "Штабная доктрина"
 STP_pc_army_staff_doctrine_desc: "Генеральный штаб получит широкие полномочия в планировании и организации частей. Кабинету придётся делиться с ним политической инициативой."
 STP_pc_navy_reach_water: "Дойти до воды"
 STP_pc_navy_reach_water_desc: "Своего порта нет. Штаб готовит план на Фаду и Хосхейт, но кораблей из этого не появляется."
 STP_pc_navy_coast: "Охрана побережья"
 STP_pc_navy_coast_desc: "Соберём береговое командование и начнём обучение специалистов для охраны портов и прибрежных маршрутов."
 STP_pc_navy_ports: "Порты под учёт"
 STP_pc_navy_ports_desc: "Портовая служба наладит проверку грузов и защиту складов. Контрабандные каналы больше не должны быть свободным входом для чужих агентов."
 STP_pc_navy_lanes: "Защита коммуникаций"
 STP_pc_navy_lanes_desc: "Исследования катеров и эскорта. Линкоров в программе нет."
 STP_pc_navy_yards: "Доступное судостроение"
 STP_pc_navy_yards_desc: "Расширим судоремонтные предприятия в одном из наших контролируемых портов. Две верфи дадут основу для постоянной морской программы."
 STP_pc_navy_escorts: "Сопровождение"
 STP_pc_navy_escorts_desc: "Обучим экипажи сопровождению транспортов и согласуем действия кораблей с береговыми службами."
 STP_pc_navy_deny: "Отказ чужому флоту"
 STP_pc_navy_deny_desc: "Укрепим побережье и противовоздушную оборону портов. Противнику придётся бороться за высадку ещё до выхода к горным дорогам."
 STP_pc_navy_heg_inspection: "Досмотр клиентов"
 STP_pc_navy_heg_inspection_desc: "Клиентский порт держит идея зависимости. Досмотр поднимает сопротивление, но не меняет главу."
 STP_pc_navy_lib_no_basing: "Чужой порт не наш"
 STP_pc_navy_lib_no_basing_desc: "Постоянная база у союзника только после его согласия. Нарушение срывает коалицию."
 STP_pc_navy_staff: "Каботаж после штаба"
 STP_pc_navy_staff_desc: "Военный эскорт важнее торговой линии. Это не открывает штабные фокусы Барчелу."
 STP_pc_air_crews: "Лётные кадры"
 STP_pc_air_crews_desc: "Подготовим лётчиков, механиков и диспетчеров. Новые исследования позволят выбрать самолёт, который страна сможет обслуживать собственными силами."
 STP_pc_air_fields: "Аэродромы"
 STP_pc_air_fields_desc: "Подготовим аэродром для двух новых авиагрупп и проведём штабные учения. Строительство идёт в контролируемом регионе, где ещё можно расширить базу."
 STP_pc_air_shield: "Закрыть небо"
 STP_pc_air_shield_desc: "Укрепим наземную ПВО и ускорим освоение истребителей для защиты городов и перевалов."
 STP_pc_air_support: "Поддержка войск"
 STP_pc_air_support_desc: "Согласуем работу авиации с наземными частями. Новые образцы самолётов должны помогать армии там, где горная дорога не пропускает тяжёлую артиллерию."
 STP_pc_air_recon: "Разведка перевалов"
 STP_pc_air_recon_desc: "Пятнадцать пунктов разведки по обоим соседям и решение на повторный вылет."
 STP_pc_air_import: "Заказы частным авиапоставщикам"
 STP_pc_air_import_desc: "Откроем повторяемую закупку ста простых истребителей за 120 единиц казны. Сам фокус готовит условия закупки; деньги списываются только при выборе решения."
 STP_pc_air_domestic: "Своя сборка"
 STP_pc_air_domestic_desc: "Расширим военное производство и подготовим собственную авиационную программу. Новая фабрика и два ускорения исследований уменьшат зависимость от внешних поставок."
 STP_pc_air_heg_pressure: "Небо как давление"
 STP_pc_air_heg_pressure_desc: "Удар по узлу как ультиматум. Это не освобождение."
 STP_pc_air_lib_rules: "Не бить союзника"
 STP_pc_air_lib_rules_desc: "Запрет работать по узлам партнёра. Коалиция держится этим правилом."
 STP_pc_air_staff: "Разведка важнее жеста"
 STP_pc_air_staff_desc: "Директория усиливает разведку, а не показательный налёт."
 STP_pc_shabrat_cabinet: "Кабинет основателя"
 STP_pc_shabrat_cabinet_desc: "Победа дала стране имя, но ведомства ещё пусты. Назначим людей, которые вели округа, склады и явки во время войны. Союз получит постоянное имя, а министерства перестанут быть вакантными местами."
 STP_pc_shabrat_politics: "Политика основателя"
 STP_pc_shabrat_politics_desc: "Победа собрала людей с разными представлениями о будущем. Шабрат должен определить, станет ли он арбитром сильного центра или гарантом самостоятельных гражданских институтов."
 STP_pc_hegemony_open: "Стеландская гегемония"
 STP_pc_hegemony_open_desc: "Сосредоточим политическую инициативу в правительстве. Часть сторонников окружной самостоятельности отступит, но кабинет сможет быстрее готовить общий курс."
 STP_pc_freedom_open: "Свобода против рабства"
 STP_pc_freedom_open_desc: "Признаем за окружными советами и собранием право влиять на решения. Согласование потребует времени, зато новая власть получит более широкую поддержку."
 STP_pc_shared_archive_policy: "Архив без приговора стране"
 STP_pc_shared_archive_policy_desc: "Откроем архивы исследователям и комиссии по преступлениям старого режима. Работа с документами должна стать постоянной службой, а не продолжением личной расправы."
 STP_pc_heg_unity: "Единство победителей"
 STP_pc_heg_unity_desc: "Совет под Шабратом теряет вето на назначения. Гарантии SRP этим указом не снимают."
 STP_pc_heg_emergency: "Чрезвычайные полномочия"
 STP_pc_heg_emergency_desc: "На 180 дней предоставим промышленности чрезвычайные полномочия. Военный выпуск и поддержка войны вырастут вместе с расходами управления."
 STP_pc_heg_subordinate: "Подчинение центров"
 STP_pc_heg_subordinate_desc: "Окружные уполномоченные подчинятся правительству. Единая цепочка решений сократит административные издержки и расширит возможности набора."
 STP_pc_heg_limit_parties: "Ограничение конкуренции"
 STP_pc_heg_limit_parties_desc: "Сосредоточим политическую деятельность в зарегистрированных организациях. Это укрепит инициативу правительства, но сузит пространство свободного исследования."
 STP_pc_heg_lock: "Курс закреплён"
 STP_pc_heg_lock_desc: "Закрепим курс на сильный центр и региональное первенство. Шабрат сохранит руководство, а путь гражданской республики закроется."
 STP_pc_heg_person: "Имя основателя в законе"
 STP_pc_heg_person_desc: "Сделаем основателя последней инстанцией в спорах ведомств и округов. Его авторитет ускорит работу политического аппарата."
 STP_pc_heg_regional_system: "Региональная система"
 STP_pc_heg_regional_system_desc: "Подготовим промышленность к постоянным внешним обязательствам. Большая загрузка военных заводов потребует более дорогого аппарата управления."
 STP_pc_heg_val_audit: "Счёт Кефрейту"
 STP_pc_heg_val_audit_desc: "Проверим условия кефрейтских договоров и подготовим позицию правительства для переговоров о новом порядке на границе."
 STP_pc_heg_val_terms: "Политические гарантии Кефрейта"
 STP_pc_heg_val_terms_desc: "Предложим Кефрейту признать политическое первенство Стеланда. Он сможет согласиться или отказать. При отказе остаётся подготовка военной операции; война не начнётся без отдельного приказа."
 STP_pc_heg_val_force: "План горной кампании"
 STP_pc_heg_val_force_desc: "После отказа Кефрейта штаб составит план кампании. Сначала предстоит оплатить 35 дней подготовки снабжения, затем в течение 90 дней решить, начинать ли наступление. Кефрейт получит предупреждение и время подготовить оборону."
 STP_pc_heg_nod_break: "Оспорить северный мандат"
 STP_pc_heg_nod_break_desc: "Предложим Нодрулу признать обратную зависимость: отныне решения в регионе принимаются с согласия Стеланда. Отказ не начинает войну автоматически."
 STP_pc_heg_nod_force: "План северной кампании"
 STP_pc_heg_nod_force_desc: "После отказа Нодрула подготовим снабжение и разведку северного фронта. Отдельная программа займёт 35 дней и потребует денег. Приказ о войне останется за правительством."
 STP_pc_heg_clients: "Зависимые правительства"
 STP_pc_heg_clients_desc: "Объединим признавших наше первенство соседей в региональную лигу. В неё войдут только правительства, уже принявшие соответствующие условия."
 STP_pc_heg_burden: "Цена первенства"
 STP_pc_heg_burden_desc: "Создадим постоянный аппарат координации внешних сил. Армия получит лучшую организацию ценой дополнительных расходов управления."
 STP_pc_lib_assembly: "Собрание округов"
 STP_pc_lib_assembly_desc: "Законы идут через собрание. Шабрат остаётся главой, но теряет часть ежедневного веса."
 STP_pc_lib_institutions: "Независимые учреждения"
 STP_pc_lib_institutions_desc: "Учредим независимую судебную службу и постоянную палату представителей. Предсказуемые правила снизят расходы управления и поддержат исследования."
 STP_pc_lib_civil_army: "Армия подчиняется гражданским"
 STP_pc_lib_civil_army_desc: "Правительство получит право утверждать военное командование. Если Сотников доступен, его опыт сохранится в гражданском военном совете."
 STP_pc_lib_lock: "Хартия закреплена"
 STP_pc_lib_lock_desc: "Закрепим гражданский порядок и самостоятельность представительных учреждений. Шабрат остаётся главой, но путь гегемонии закрывается."
 STP_pc_lib_competition: "Политическая конкуренция"
 STP_pc_lib_competition_desc: "Откроем политическую конкуренцию внутри нового порядка. Горнин и Тих смогут представить свои программы перед возможной передачей власти."
 STP_pc_lib_succession: "Власть, которую можно передать"
 STP_pc_lib_succession_desc: "Шабрат выберет между продолжением собственного руководства и передачей власти одному из представленных гражданских преемников."
 STP_pc_lib_emergency_limit: "ЧП имеет срок"
 STP_pc_lib_emergency_limit_desc: "Определим пределы чрезвычайной мобилизации. Во время войны можно будет отдельно объявить временный сбор резерва, расходуя командный ресурс."
 STP_pc_lib_prepare_neighbors: "Политическая подготовка соседей"
 STP_pc_lib_prepare_neighbors_desc: "Создадим постоянную службу наблюдения за соседями. Она сможет за отдельную оплату обновлять сведения об их вооружённых силах."
 STP_pc_lib_local_contacts: "Разговор с чужими"
 STP_pc_lib_local_contacts_desc: "Установим связи с гражданскими группами и специалистами соседних стран. Сведения о хозяйстве помогут правительству оценивать последствия вмешательства."
 STP_pc_lib_crisis: "Кризис вмешательства"
 STP_pc_lib_crisis_desc: "Усиление пограничной службы и запас командных ресурсов позволят встретить открытый кризис подготовленными. Этот шаг ещё не объявляет войну."
 STP_pc_lib_war: "Война освобождения"
 STP_pc_lib_war_desc: "Открытые пограничные кризисы разрешатся войной с соответствующим соседом. Если кризисы с Кефрейтом и Нодрулом действуют одновременно, придётся сражаться на двух фронтах. Уже начавшаяся война получит тот же план послевоенного урегулирования."
 STP_pc_lib_transition: "Переходное управление"
 STP_pc_lib_transition_desc: "Профинансируем временную администрацию и предложим побеждённым соседям переходное соглашение. Политический результат зависит от их ответа."
 STP_pc_lib_independent_gov: "Самостоятельное правительство"
 STP_pc_lib_independent_gov_desc: "Переходные комиссии завершают работу. Вместо постоянного надзора за соседями кабинет сосредоточится на гражданском строительстве и сократит расходы на управление."
 STP_pc_lib_coalition: "Коалиция равных"
 STP_pc_lib_coalition_desc: "Объединим правительства, принявшие условия освобождения, в оборонительную коалицию. Каждый участник должен подтвердить свой выбор."
 STP_pc_sot_chain: "Цепочка командования"
 STP_pc_sot_chain_desc: "Без политического основателя штаб принимает на себя координацию разрозненных частей. Единая цепочка приказов позволит восстановить управляемость."
 STP_pc_sot_field: "Полевые командиры"
 STP_pc_sot_field_desc: "Сотников использует опыт полевых командиров для ускорения подготовки операций."
 STP_pc_sot_regions: "Окружные формирования"
 STP_pc_sot_regions_desc: "Округа дают людей штабу, не совету."
 STP_pc_sot_state: "Государство штаба"
 STP_pc_sot_state_desc: "Администрация подчиняется цепочке, а не собранию."
 STP_pc_sot_two_threats: "Две угрозы, один штаб"
 STP_pc_sot_two_threats_desc: "Разведка оценит силы Нодрула и Кефрейта. При смене командующего сведения и общая оборонная задача сохраняются."
 STP_pc_sot_limits: "Предел военной власти"
 STP_pc_sot_limits_desc: "Директория на 180 дней. Только Сотников."
 STP_pc_sot_shabrat_question: "Живой основатель"
 STP_pc_sot_shabrat_question_desc: "Определим место прежнего политического руководства в новом порядке."
 STP_pc_sot_keep_command: "Директория остаётся"
 STP_pc_sot_keep_command_desc: "Закрепим власть военной директории и её ответственность за оборону государства."
 STP_pc_sot_transfer: "Передача печати"
 STP_pc_sot_transfer_desc: "Откроем передачу власти одному из уже представленных гражданских преемников."
 STP_pc_sot_val_defense: "Кефрейт не ставит склады"
 STP_pc_sot_val_defense_desc: "Оборона и вывод, не гегемония."
 STP_pc_sot_nod_watch: "Нодрул не возвращает советников"
 STP_pc_sot_nod_watch_desc: "Пограничный режим без клиента."
 STP_pc_gornin_charter: "Протокол становится законом"
 STP_pc_gornin_charter_desc: "Горнин закрепит порядок работы гражданских учреждений и сократит расходы управления."
 STP_pc_vera_lists: "Реестр важнее знамени"
 STP_pc_vera_lists_desc: "Тих проведёт расследование связей прежнего режима. Политическая самостоятельность вырастет, но проверка предприятий временно осложнит производство."
 STP_pc_after_victory_tt: "Коалиция победителей держится, пока курс не закреплён: §G+5%§! стабильности, §R-3%§! организации."
 STP_pc_count_ruins_tt: "Показывает, какие ядра STP/STS всё ещё держит Кефрейт."
 STP_pc_name_steland_tt: "Страна получает косметическое имя Стеланд."
 STP_pc_army_register_tt: "Временный реестр, пока не взят постоянный армейский фокус республики."
 STP_pc_navy_reach_water_tt: "Порта нет. Фокус не строит кораблей."
 STP_pc_navy_heg_inspection_tt: "Досмотр держит клиентскую идею и поднимает сопротивление."
 STP_pc_navy_lib_no_basing_tt: "Постоянная база у союзника только после его события."
 STP_pc_air_import_tt: "Закупка без нового долга, если кефрейтская поставка уже была."
 STP_pc_air_heg_pressure_tt: "Удар по узлу как ультиматум."
 STP_pc_air_lib_rules_tt: "Запрет работать по узлам партнёра."
 STP_pc_founder_rules: "У власти основатель"
 STP_pc_named_successor_rules: "У власти названный преемник курса"
 STP_pc_course_continues: "Курс удерживает основатель или названный преемник"
 STP_pc_hegemony_continues: "Гегемонию ведёт основатель или преемник закреплённого курса"
 STP_pc_freedom_continues: "Хартию ведёт основатель или преемник закреплённого курса"
 STP_pc_shabrat_politics_tt: "Закрепление гегемонии и хартия свободы названы невозвратом."
 STP_pc_hegemony_open_tt: "Открывает стеландскую гегемонию. Идеологию не меняет."
 STP_pc_freedom_open_tt: "Открывает свободу против рабства. Идеологию не меняет."
 STP_pc_shared_archive_policy_tt: "Вводит Веру Тих, если архив ещё не называл её."
 STP_pc_heg_regional_system_tt: "Порядок для соседей без дипломатического окна."
 STP_pc_heg_val_audit_tt: "Если вопрос ещё не поднят, кабинет получит сведения о притязаниях Кефрейта. Условия договора будут предложены следующим фокусом; отказ сам по себе не начинает войну."
 STP_pc_heg_val_terms_tt: "Ультиматум. Принятие даёт клиента, отказ открывает войну."
 STP_pc_lib_institutions_tt: "Тих может стать советником, не главой."
 STP_pc_lib_civil_army_tt: "Если Сотников на свободе и служит республике, он дополнительно войдёт в высшее командование."
 STP_pc_sotnikov_civil_staff: "Сотников в гражданском штабе"
 STP_pc_lib_competition_tt: "Горнин и Тих будут представлены как кандидаты, если ещё не участвовали в политике. Выбор преемника открывается следующим фокусом."
 STP_pc_lib_prepare_neighbors_tt: "Политическая подготовка к разговору с Кефрейтом и Нодрулом. Это ещё не кризис и не война."
 STP_pc_lib_crisis_tt: "Фиксирует уже открытый кризис. Войну освобождения объявляет следующий шаг."
 STP_pc_lib_independent_gov_tt: "Следующий сосед, если пакет ему ещё не предлагали, получает своё событие."
 STP_pc_sot_shabrat_question_tt: "Не освобождает основателя и не меняет главу."
 STP_pc_gornin_charter_tt: "Очередность власти только скриптованным событием."
 STP_pc_treasury_20_tt: "§G+20§! £."
 STP_pc_treasury_50_tt: "§G+50§! £."
 STP_pc_treasury_100_tt: "§G+100§! £."
 STP_pc_treasury_minus_20_tt: "§R-20§! £."
 STP_pc_treasury_minus_40_tt: "§R-40§! £."
 STP_pc_treasury_minus_50_tt: "§R-50§! £."
 STP_pc_treasury_minus_60_tt: "§R-60§! £."
 STP_pc_treasury_minus_75_tt: "§R-75§! £."
 STP_pc_treasury_minus_80_tt: "§R-80§! £."
 STP_pc_at_bonus: "Против более тяжёлого"
 STP_pc_naval_bonus: "Доступный флот"
 STP_pc_fighter_bonus: "Закрыть небо"
 STP_pc_cas_bonus: "Поддержка войск"
 STP_pc_air_domestic_bonus: "Своя сборка"
 STP_pc_hegemony_league: "Стеландская лига"
 STP_pc_liberation_coalition: "Коалиция освобождения"
 STS_steland: "Стеланд"
 STS_steland_DEF: "Стеланда"
 STS_steland_ADJ: "стеландск."
 NOD_mandate_broken: "Нодрул без мандата"
 NOD_mandate_broken_DEF: "Нодрула без мандата"
 NOD_mandate_broken_ADJ: "нодрулск."
 STP_pc_val_client: "Кефрейтский клиент"
 STP_pc_val_client_desc: "Кефрейт признал политическое первенство Стеланда. Это открывает путь в региональную лигу, сохраняя собственное правительство."
 STP_pc_nod_client: "Нодрулский клиент"
 STP_pc_nod_client_desc: "Нодрул признал политическое первенство Стеланда. Это открывает путь в региональную лигу, сохраняя собственное правительство."
 VAL_liberated_settlement: "Освобождённый Кефрейт"
 VAL_liberated_settlement_desc: "Реестр капитанов без права вето на пакет."
 NOD_mandate_broken_desc: "Нодрул без права вернуть советников в высокогорье."
 STP_pc_coalition_hold_delta: "Коалиция после победы"
 STP_pc_limited_offense: "Короткое наступление"
 STP_pc_limited_offense_desc: "Сорок пять дней атаки и прорыва ценой стабильности вне ядер."
 STP_pc_emergency_decree: "Чрезвычайный указ"
 STP_pc_emergency_decree_desc: "Чрезвычайные полномочия увеличивают военный выпуск и поддержку войны, требуя дополнительных расходов управления."
 STP_pc_directory_term: "Срок директории"
 STP_pc_directory_term_desc: "Военная администрация укрепляет организацию армии ценой политической инициативы кабинета."
 STP_pc_watch_val_tt: "Постоянное наблюдение за Кефрейтом. Не война."
