 STP_pf_advisers_tt: "§YНодрульские советники§!\nВлияние Нодруля на военное планирование и решения руководства.\n\nВклад в верность аппарата: §Y[?STP_pf_advisers_contribution|2]§! пункта.\nСкорость планирования: [?STP_pf_advisers_effect|=+2%].\nЭффект = (поддержка - 50) × доля влияния × 0.4%; довольная группа увеличивает показатель.\nБез действующих связей с Нодрулем военная помощь не работает; политическое влияние советников сохраняется."
