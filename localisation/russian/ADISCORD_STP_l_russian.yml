 STP_counterintelligence_state_46_desc:0 "Партийная контрразведка блокирует подготовительные действия Шабрата в регионе §Y[46.GetName]§!.\n\nТаймер показывает, сколько осталось до окончания §Y56-дневной блокировки§!. По истечении срока действия снова станут доступны, если подготовка к восстанию ещё продолжается и в регионе нет других ограничений."
