 STP_FALSE_TRAIL_ODDS_MEDIUM: "В конце комиссии движок один раз бросает кубик по подозрениям на тот день (сейчас [?STP_party_suspicion|0]). Исход: чистый след 15%, шумный след 35%, задержание связного 35%, прорыв контрразведки §R15%§!."
