 STP_ps_ammunition_result_tt: "За 2400 казны и 21 день: 8000 винтовок, 480 артиллерийских орудий, 480 комплектов оружия отделения, 240 поддержки и 160 ПВО. Повторный заказ через 42 дня после доставки."

