 STP_battle_for_stelander: "Битва за Стеландер"
 STP_battle_for_stelander_desc: "Выбирайте крупные операции: договор с гарнизоном, снабжение или гражданское управление. Карта показывает сохранённые связи и кому достанется округ.\n\n§YПлан мобилизации при досрочном расколе§!\nПартия: до §Y[?STP_cw_report_party_brigades|0]§! лёгких бригад и до §Y4§! усиленных дивизий.\nСопротивление: до §Y[?STP_cw_report_resistance_brigades|0]§! лёгких бригад и до §Y4§! усиленных дивизий.\nРеспублики: до §Y14§! лёгких бригад.\nСверх плана для сопротивления готовы и оплачены усиленные дивизии: §Y[?STP_cw_prepared_assault_divisions|0]§!.[STPGetKefreytArmyCommitment]\n\n§YСвободный общий резерв сейчас:§! £manpower_texticon §Y[?manpower|0]§!, £infantry_equipment_texticon §Y[?num_equipment@infantry_equipment|0]§!. Регулярные и полицейские части вернут людей и оружие в общий резерв; гвардия останется у партии. Фактический состав ограничен ресурсами; итог выборов изменит план.\n\n§YОперации:§! свободно §C[?STP_political_action_slots_available|0]§! из §Y[?STP_political_action_slots_total|0]§!. [STPGetPreparationPressure]\n§YПоследняя проверка:§! [STPGetLastPartyResponse]\n\nРаскол, потеря округа или контрразведка прервут местные операции. Возврат оплаты и запасов указан в условиях каждой операции.\n\n§YНодрул:§! [STPGetNodStatus]"
 STP_PREPARATION_PRESSURE_PARTY: "§YПодполье Шабрата:§! таймер показывает подготовку его связных. Проверяйте указанный округ до завершения операции."
 STP_PREPARATION_PRESSURE_SHABRAT: "§YПартийные комиссии:§! цель и срок указаны в миссии. Начатые переговоры с гарнизонами, снабжение и диверсии могут быть раскрыты ещё до завершения."
 STP_regions_panel_title: "Кому подчинится Стеландер?"
 STP_regions_panel_tt: "Цвет показывает не формального владельца, а силу, способную навязать региону свою волю в момент раскола."
 STP_regions_map_tt: "§7Серый§! — спорный регион; §Cсиний§! — Сопротивление; §0фиолетовый§! — Партия; §Yжёлтый§! — местные силы. Яркий оттенок означает закреплённую позицию."
 STP_regions_legend: "§7СПОРНЫЙ§!   §CСОПРОТИВЛЕНИЕ§!   §0ПАРТИЯ§!   §YМЕСТНЫЕ СИЛЫ§!"

 ADISCORD_STP_regions.1.t: "Страна во втором экземпляре"
 ADISCORD_STP_regions.1.d: "На столе перед Шабратом лежит не карта фронта, а карта подчинения. В одном штате решающей окажется подпись начальника, в другом — слово совета, в третьем — ключ от склада. Партия ещё считает эти земли единой страной и потому будет посылать комиссии туда, где сеть выдаёт себя громче всего. До раскола необходимо решить, что важнее в каждом регионе: забрать его себе, вытеснить оттуда Партию руками местных или оставить спорным, но подготовить один решающий актив."
 ADISCORD_STP_regions.1.a: "Начать Битву за Стеландер"

