 STP_cw_open_local_depots:0 "Открыть местные склады"
 STP_cw_open_local_depots_desc:0 "Окружные комитеты сведут запасы ведомственных складов, охотничьих обществ и добровольческих дружин. Передадим фронту 8000 винтовок, чтобы пополнить действующие части в первые дни гражданской войны."
 STP_cw_war_fund:0 "Военный фонд сопротивления"
 STP_cw_war_fund_desc:0 "Объединим пожертвования сторонников и взносы окружных комитетов в военном фонде. В казну Шабрата поступит 6000 денежных единиц для снабжения фронта, закупки оружия и расширения арсеналов."
 STP_cw_treasury_6000_tt:0 "В казну поступит £ADISCORD_economy_treasury_texticon §G6000§! денежных единиц."
 STP_cw_volunteer_brigade_tt:0 "В собственном контролируемом регионе появится §Y1 территориальная бригада§! добровольцев с полным комплектом людей и оружия. Люди, винтовки и деньги из наших запасов не расходуются."
 STP_cw_volunteer_training_start_tt:0 "За £political_power_texticon §Y40§! начнётся §Y21-дневная§! подготовка двух добровольческих бригад. Люди, винтовки и казна не расходуются. При отмене политическая власть не возвращается."
