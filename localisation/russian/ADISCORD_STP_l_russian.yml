 STP_PARTY_RESPONSE_EMPTY_SEARCH: "§Yпроверка не выявила следов оппозиции; сдвиг легитимности на 2% в пользу Шабрата§!"

 STP_recruit_regional_official: "Найти подпись в нужном кабинете"
 STP_recruit_regional_official_desc: "За §Y18 дней§! создадим администрацию в округе, где сопротивление уже имеет опору. Для перехода обычного округа понадобятся и чиновники, и закреплённое влияние: проверьте прогноз на карте. В Ливонине администрацию создаёт отдельное соглашение с советом."
 STP_cw_secure_niansas_administration: "Перехватить областное управление"
 STP_cw_secure_niansas_administration_desc: "За §Y14 дней§! люди Шабрата свяжут дорожную логистику с областной канцелярией и подготовят приказ о переходе Ниансаса. Операция открывается фокусом §Y«Дорога через Ниансас»§!, требует закреплённого влияния сопротивления и хотя бы минимального перевеса легитимности Шабрата (§Y>0§!). Успех создаёт отдельное основание передачи Ниансаса без необходимости разгонять легитимность до 55%.\n\nПодозрение: §R+4§!. Если сопротивление уже достигло 90% влияния, специальная операция не нужна."
 STP_cw_niansas_positive_legitimacy_tt: "Легитимность хотя бы немного на стороне Шабрата (§Y>0§!)"
 STP_cw_secure_niansas_result_tt: "§GОбластное управление Ниансаса будет подготовлено к переходу Шабрату.§!"
 STP_bargain_with_local_councils: "Пусть совет вспомнит о собственном голосе"
 STP_bargain_with_local_councils_desc: "За §Y21 день§! договоримся с Ливонинским советом. Пока соглашение сохраняется, округ перейдёт Шабрату; затем можно привлечь его администрацию отдельной операцией."
 STP_prepare_false_trail: "Подбросить ложный след"
 STP_prepare_false_trail_desc: "За §Y7 дней§! подготовим прикрытие для текущей комиссии в [FROM.GetName]. Нужно успеть до её окончания; на следующую проверку след не переносится. Вместо риска можно принять условия комиссии: пожертвовать чиновником или, после открытия такого ответа, распустить военную сеть ради гражданской администрации.\n\n[STP.STPGetFalseTrailOdds]\nЭто один бросок кубика в последний день комиссии, не средний исход. Чистый след даёт 4% легитимности Шабрату, шумный — 1%; задержание связного даёт 3% партии, прорыв контрразведки — 6%.\n\nПри прорыве будут потеряны администрация, гарнизонные связи, снабжение, диверсии и местные договоры; работа в округе закроется на §Y56 дней§!. Из местных договоров сохранится только ратифицированное соглашение Ливонина."

 STP_region_unique_operation_2: "Договориться с гарнизоном Монаии"
 STP_region_unique_operation_2_desc: "За §Y35 дней§! договоримся с гарнизоном и администрацией Новой Монаии о поддержке Шабрата. Сохранившиеся связи помогут удержать округ и сформировать две дополнительные бригады при расколе. На каждую потребуются £manpower_texticon §Y4000§! человек и £infantry_equipment_texticon §Y320§! единиц снаряжения из резервов сопротивления.\n\nВлияние сопротивления: §G+15§!, подозрения: §R+7§!. Одного договора недостаточно, чтобы передать округ: нужно закреплённое влияние и 21 день работы администрации. Операция занимает один слот подготовки. После утраты связи переговоры можно повторить за полную цену."
 STP_region_unique_operation_3: "Восстановить склад Ниансаса"
 STP_region_unique_operation_3_desc: "Восстановим склад, утраченный после выделения портового бюджета. Подготовим цистерны и маршруты Ниансаса к расколу. Если округ перейдёт Шабрату, он получит поддержку снабжения на §Y21 день§!: расход снабжения §G-10%§!, восстановление организации §G+5%§!. Также передадим §Y500§! топлива из запасов партии, если его достаточно. Хосхейт добавит свои 500 топлива, но общий эффект снабжения не усилит.\n\nВлияние сопротивления: §G+6§!, подозрения: §R+5§!. После утраты маршрута подготовку можно повторить; срок и цена сохраняются."
 STP_region_unique_operation_29: "Договориться с гарнизоном Крейдена"
 STP_region_unique_operation_29_desc: "За §Y35 дней§! договоримся с гарнизоном и администрацией Крейдена о поддержке Шабрата. Сохранившиеся связи помогут удержать округ и сформировать две дополнительные бригады при расколе. На каждую потребуются £manpower_texticon §Y4000§! человек и £infantry_equipment_texticon §Y320§! единиц снаряжения из резервов сопротивления.\n\nВлияние сопротивления: §G+15§!, подозрения: §R+8§!. Одного договора недостаточно, чтобы передать округ: нужно закреплённое влияние и 21 день работы администрации. Операция занимает один слот подготовки. После утраты связи переговоры можно повторить за полную цену."
 STP_region_unique_operation_45: "Подготовить администрацию Ливонина"
 STP_region_unique_operation_45_desc: "После договора с советом подготовим людей для администрации Ливонина. При обычном исходе комиссии администрация будет раскрыта первой, сохранив договор с советом. Прорыв контрразведки или проверка командования могут сорвать и договор.\n\nВлияние сопротивления: §G+12§!, подозрения: §R+4§!. После утраты контакта подготовку можно повторить; срок и цена сохраняются."
 STP_region_unique_operation_46: "Обеспечить снабжение через Хосхейт"
 STP_region_unique_operation_46_desc: "Передадим людям Шабрата складские ключи и маршруты Хосхейта. Если округ перейдёт сопротивлению, оно получит поддержку снабжения на §Y21 день§!: расход снабжения §G-10%§!, восстановление организации §G+5%§!. Также передадим §Y500§! топлива из запасов партии, если его достаточно. Ниансас добавит свои 500 топлива, но общий эффект снабжения не усилит.\n\nВлияние сопротивления: §G+8§!, подозрения: §R+6§!. После утраты маршрута подготовку можно повторить; срок и цена сохраняются."
 STP_region_unique_operation_53: "Заминировать дороги Старой Фады"
 STP_region_unique_operation_53_desc: "Заложим заряды на дорогах Старой Фады. При расколе, если округ останется под владением и контролем партии, будет повреждён один уровень инфраструктуры. Если округ перейдёт сопротивлению, дороги сохранятся. Партия сможет сорвать диверсию проверкой, а после подрыва — восстановить инфраструктуру обычным ремонтом.\n\nПодготовка требует £infantry_equipment_texticon §Y240§! единиц снаряжения. Влияние сопротивления: §G+6§!, подозрения: §R+10§!. После утраты диверсионной группы подготовку можно повторить; срок и цена сохраняются."
 STP_cw_sabotage_capital: "Заложить заряды у Конгресса"
 STP_cw_sabotage_capital_desc: "За §Y14 дней§! подготовим диверсию в Фаде. Обычные окружные операции в столице остаются закрытыми. При расколе, если партия сохранит владение и контроль, будут повреждены один уровень инфраструктуры и один военный завод. Если столица перейдёт сопротивлению, здания сохранятся. Удержанная партией столица на §Y42 дня§! снизит её военное производство.\n\nПодготовка требует £political_power_texticon §Y20§! и £infantry_equipment_texticon §Y360§! единиц снаряжения. Влияние сопротивления: §G+8§!, подозрения: §R+12§!. После утраты группы подготовку можно повторить; срок и цена сохраняются."
 STP_cw_sabotage_party_industry: "Сорвать смены Крейдена"
 STP_cw_sabotage_party_industry_desc: "За §Y14 дней§! заложим заряд на гражданских заводах Крейдена. При расколе, если партия сохранит владение и контроль, будет повреждён один гражданский завод. Если округ перейдёт сопротивлению, производство сохранится. Удержанный партией округ на §Y42 дня§! снизит её военное производство. Партия сможет сорвать диверсию проверкой.\n\nПодготовка требует £political_power_texticon §Y10§! и £infantry_equipment_texticon §Y240§! единиц снаряжения. Влияние сопротивления: §G+6§!, подозрения: §R+10§!. После утраты группы подготовку можно повторить; срок и цена сохраняются."

 STP_party_inspection_state_2: "Проверка чиновников штата «Новая Монаии»"
 STP_party_inspection_state_3: "Проверка чиновников штата «Ниансаская область»"
 STP_party_inspection_state_29: "Проверка чиновников штата «Крейден»"
 STP_party_inspection_state_45: "Проверка чиновников штата «Ливонинский округ»"
 STP_party_inspection_state_46: "Проверка чиновников штата «Хосхейт»"
 STP_party_inspection_state_53: "Проверка чиновников штата «Старый фадский лес»"
 STP_party_inspection_state_2_desc: "Партийная комиссия сверяет назначения, пропуска и телефонные журналы Новой Монаии. По окончании показанного срока она ударит по самому заметному активу или просто укрепит аппарат. Ложный след меняет набор возможных исходов.\n\nБез прикрытия найденные структуры сдвинут легитимность на 4% к партии, пустая проверка — на 2% к Шабрату. Гарнизонные связи, снабжение и диверсии в проверенном округе будут раскрыты. Ложный след позволяет сохранить их, но его риск растёт с подозрениями."
 STP_party_inspection_state_3_desc: "Партийная комиссия проверяет ведомости, цистерны и районных чиновников Ниансаской области. По окончании показанного срока она ударит по самому заметному активу или просто укрепит аппарат. Ложный след меняет набор возможных исходов.\n\nБез прикрытия найденные структуры сдвинут легитимность на 4% к партии, пустая проверка — на 2% к Шабрату. Гарнизонные связи, снабжение и диверсии в проверенном округе будут раскрыты. Ложный след позволяет сохранить их, но его риск растёт с подозрениями."
 STP_party_inspection_state_29_desc: "Партийная комиссия пересчитывает смены, пропуска и заводские печати Крейдена. По окончании показанного срока она ударит по самому заметному активу или просто укрепит аппарат. Ложный след меняет набор возможных исходов.\n\nБез прикрытия найденные структуры сдвинут легитимность на 4% к партии, пустая проверка — на 2% к Шабрату. Гарнизонные связи, снабжение и диверсии в проверенном округе будут раскрыты. Ложный след позволяет сохранить их, но его риск растёт с подозрениями."
 STP_party_inspection_state_45_desc: "Партийная комиссия выясняет, с кем совет Ливонина обсуждает будущее без Фады. По окончании показанного срока она ударит по самому заметному активу или просто укрепит аппарат. Ложный след меняет набор возможных исходов.\n\nБез прикрытия найденные структуры сдвинут легитимность на 4% к партии, пустая проверка — на 2% к Шабрату. Гарнизонные связи, снабжение и диверсии в проверенном округе будут раскрыты. Ложный след позволяет сохранить их, но его риск растёт с подозрениями."
 STP_party_inspection_state_46_desc: "Партийная комиссия сверяет портовые ключи, складские книги и списки ночных смен Хосхейта. По окончании показанного срока она ударит по самому заметному активу или просто укрепит аппарат. Ложный след меняет набор возможных исходов.\n\nБез прикрытия найденные структуры сдвинут легитимность на 4% к партии, пустая проверка — на 2% к Шабрату. Гарнизонные связи, снабжение и диверсии в проверенном округе будут раскрыты. Ложный след позволяет сохранить их, но его риск растёт с подозрениями."
 STP_party_inspection_state_53_desc: "Партийная комиссия расспрашивает лесничих, дорожных мастеров и старост Старой Фады. По окончании показанного срока она ударит по самому заметному активу или просто укрепит аппарат. Ложный след меняет набор возможных исходов.\n\nБез прикрытия найденные структуры сдвинут легитимность на 4% к партии, пустая проверка — на 2% к Шабрату. Гарнизонные связи, снабжение и диверсии в проверенном округе будут раскрыты. Ложный след позволяет сохранить их, но его риск растёт с подозрениями."

 STP_debug_start_battle_for_stelander: "§RDEBUG:§! Начать Битву за Стеландер"
 STP_debug_start_battle_for_stelander_desc: "Вызывает вводное событие, выбирает сторону Шабрата и начинает работу с округами. Первая комиссия будет назначена через 21 день; её проверка продлится 40 дней."
 STP_debug_reset_battle_for_stelander: "§RDEBUG:§! Сбросить Битву за Стеландер"
 STP_debug_reset_battle_for_stelander_desc: "Удаляет все региональные активы и влияние, затем создаёт систему заново с исходными значениями."
 STP_debug_end_battle_for_stelander: "§RDEBUG:§! Завершить Битву за Стеландер"
 STP_debug_end_battle_for_stelander_desc: "Удаляет региональные переменные, флаги и активную партийную проверку."
 STP_scenario_debug: "§RDEBUG:§! Стеландер"
 STP_scenario_debug_desc: "Служебные точки входа в сценарий Стеландера. Категория видна только при запуске игры в режиме отладки."
 STP_debug_start_civil_war: "§RDEBUG:§! Начать гражданскую войну"
 STP_debug_start_civil_war_desc: "Пропускает подготовку и выборы, затем вызывает штатный раскол. Если сторона не выбрана, игрок остаётся за партию."
 STP_debug_resolve_party_victory: "§RDEBUG:§! Победа партии"
 STP_debug_resolve_party_victory_desc: "При необходимости запускает штатный раскол и через час закрепляет победу партии. Игрок переходит на STP, если ещё был за сопротивление."
 STP_debug_resolve_shabrat_victory: "§RDEBUG:§! Победа Шабрата"
 STP_debug_resolve_shabrat_victory_desc: "При необходимости запускает штатный раскол и через час закрепляет победу Шабрата. Игрок переходит на STS, если ещё был за партию."

