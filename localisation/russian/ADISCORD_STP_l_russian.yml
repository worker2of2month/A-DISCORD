 STP_FALSE_TRAIL_ODDS_LOW: "В конце комиссии движок один раз бросает кубик по подозрениям на тот день (сейчас [?STP_party_suspicion|0]). Исход: чистый след §G35%§!, шумный след 40%, задержание связного 20%, прорыв контрразведки §R5%§!."
