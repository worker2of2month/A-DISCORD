 STP_cw_press_office_tt: "Появится повторяемый приказ партийной директивы: £political_power_texticon §Y40§!, 14 дней, слот подготовки."
 STP_cw_capital_oath_tt: "Столичный гарнизон подтвердит подчинение кабинету. Штаб получит опыт и командный ресурс."
 STP_cw_party_mandate_tt: "Аппарат сводит президиум и окружную программу в общий мандат на выборах."
 STP_cw_interrupt_opposition: "Перехватить связных: [FROM.GetName]"
 STP_cw_interrupt_opposition_desc: "За £political_power_texticon §Y40§! и §Y10 дней§! сорвём объявленную операцию связных в [FROM.GetName]. Нужно успеть до конца их таймера; операция занимает один слот. Успех даёт партии 8 влияния, сдвигает легитимность на 3% к партии и поднимает верность аппарата на 8. Новая цель появится на следующий день."
 STP_cw_interrupt_opposition_tt: "Объявленная операция связных в §Y[FROM.GetName]§! срывается. Влияние партии: §G+8§!. Легитимность: §G-3%§! у Шабрата."
 STP_cw_publish_directive: "Выпустить партийную директиву"
 STP_cw_publish_directive_desc: "За £political_power_texticon §Y40§! и §Y14 дней§! ведомственная редакция выпустит директиву. Легитимность сдвинется на 4% к партии, верность аппарата вырастет на 6, стабильность упадёт на 2%. Операция занимает один слот; повтор через 28 дней."
 STP_cw_publish_directive_tt: "Директива сдвигает мандат к партии и закрепляет ведомственную дисциплину."
 STP_cw_seal_protocol: "Запечатать протокол"
 STP_cw_seal_protocol_desc: "За £political_power_texticon §Y35§! и §Y14 дней§! канцелярия закрепит печати и списки делегатов. Легитимность сдвинется на 6% к партии, верность аппарата вырастет на 8. Приказ доступен один раз, пока идут выборы, и занимает один слот."
 STP_cw_seal_protocol_tt: "Печати протокола закрепляются за партией до конца выборов."
 STP_district_check_result_tt: "§Y[FROM.GetName]§!: изъятие структур подполья и запрет его работы на §Y56 дней§!. Влияние партии: §0+15§!. Найденные структуры дают 4% легитимности партии, пустая проверка - 2% Шабрату."
 STP_rifle_cache_result_tt: "Оплаченные £infantry_equipment_texticon §Y16000§! винтовок поступят в резерв Абилии для Шабрата. При закрытии подготовки или переполнении склада груз вернётся в общий государственный запас."
 STP_inspection_delay_result_tt: "Выбранная комиссия в §Y[FROM.GetName]§! продлится на §Y14 дней§!. Остальные комиссии сохранят свой срок. Один слот подготовки будет занят на всё это время; при завершении подготовки он освободится без возврата политической власти."
 STP_party_inspection_active: "В округе работает партийная комиссия"
 STP_resistance_garrison_asset: "Гарнизон округа поддерживает сопротивление"
 STP_inspection_resolution_tt: "В конце таймера комиссия применит выбранный ответ. Ложный след должен быть уже готов; без прикрытия будут раскрыты военные связи и проверены гражданские. Начатые, но ещё не завершённые операции тоже могут быть сорваны."
 STP_preparation_rifle_refund_tt: "При отмене вернётся только оружие, которое ещё зарезервировано этим заказом. Политическая власть не возвращается."

 # Легитимность
 STP_shabrat_election_legitimacy: "Легитимность партийных выборов"
 STP_shabrat_election_legitimacy_desc: "Шкала показывает, чью победу признают делегаты. Для победы Шабрата к завершению выборов нужно значение выше §Y+10%§!. При §Y+10%§! и ниже партийный аппарат удержит протокол. Выше §Y+55%§! спорные округа переходят Шабрату даже без готовой администрации; республики и соглашение Ливонина сохраняют свои отдельные основания.\n\nРеспублики получают §Y20%§! общих людей. Затем резервируются люди для подготовленных частей, а остаток делится между победителем и проигравшим как §Y5:3§!. Общие оружейные склады делятся §Y50% / 30% / 20%§!: победитель, проигравший, республики; тайники передаются отдельно.\n\nВыборы завершаются гражданской войной при любом результате. При досрочном выступлении нераспределённые люди делятся между партией и сопротивлением поровну, а оружие - §Y40% / 40% / 20%§! между партией, сопротивлением и республиками."

 STP_party_election_legitimacy_side: "Партийный аппарат"
 STP_shabrat_election_legitimacy_side: "Шабрат"

 STP_election_legitimacy_contested_range: "Протокол остаётся у аппарата"
