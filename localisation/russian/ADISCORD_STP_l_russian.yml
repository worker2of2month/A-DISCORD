 STP_ps_fund_nod: "Кредит Нодрулу"

 STP_ps_fund_nod_desc: "Подготовка 14 дней, затем 7 дней доставки. Нодрул получает ровно 1500 казны. Повтор через 42 дня. До отправки отмена возвращает весь резерв; после отправки перевозка не возвращается, груз доставляется пригодному Нодрулу или утрачивается."

 STP_ps_arm_nod_cost: "£ADISCORD_economy_treasury_texticon §Y300§!; £infantry_equipment_texticon §Y1200§!; £artillery_equipment_texticon §Y100§!; £support_equipment_texticon §Y60§!"

 STP_ps_arm_nod_cost_blocked: "£ADISCORD_economy_treasury_texticon §R300§!; £infantry_equipment_texticon §R1200§!; £artillery_equipment_texticon §R100§!; £support_equipment_texticon §R60§!"

 STP_ps_arm_nod_cost_tooltip: "£ADISCORD_economy_treasury_texticon §Y300§!; £infantry_equipment_texticon §Y1200§!; £artillery_equipment_texticon §Y100§!; £support_equipment_texticon §Y60§!"

 STP_ps_arm_nod: "Оружие северному фронту"

 STP_ps_arm_nod_desc: "Подготовка 14 дней, затем 7 дней доставки. Отправляются 1200 винтовок, 100 орудий и 60 поддержки из нашего запаса; 300 казны оплачивают перевозку. Повтор через 28 дней. До отправки отмена возвращает весь резерв; после отправки перевозка не возвращается, груз доставляется пригодному Нодрулу или утрачивается. Если северная война закончится до отправки, деньги и вооружение автоматически вернутся."

 STP_ps_engineers_nod_cost: "£ADISCORD_economy_treasury_texticon §Y3000§!"

 STP_ps_engineers_nod_cost_blocked: "£ADISCORD_economy_treasury_texticon §R3000§!"

 STP_ps_engineers_nod_cost_tooltip: "£ADISCORD_economy_treasury_texticon §Y3000§!"

 STP_ps_engineers_nod: "Инженерная миссия"

 STP_ps_engineers_nod_desc: "Подготовка 21 день, затем 7 дней доставки. После доставки 60 дней службы: расход снабжения -10%, восстановление организации +5%. Только пока продолжается северная война. До отправки отмена возвращает весь резерв; после отправки перевозка не возвращается, груз доставляется пригодному Нодрулу или утрачивается. Если северная война закончится до отправки, вся зарезервированная сумма автоматически вернётся."

 STP_ps_expedition_nod_cost: "£ADISCORD_economy_treasury_texticon §Y1800§!"

 STP_ps_expedition_nod_cost_blocked: "£ADISCORD_economy_treasury_texticon §R1800§!"

 STP_ps_expedition_nod_cost_tooltip: "£ADISCORD_economy_treasury_texticon §Y1800§!"

 STP_ps_expedition_nod: "Подготовить экспедиционное снабжение"

 STP_ps_expedition_nod_desc: "Подготовка 21 день, затем 7 дней доставки. Один резерв на вмешательство: 42 дня расхода снабжения -10% после реального вступления Нодрула. Готовность и обязательные семь дней переброски не сокращаются. До отправки отмена возвращает весь резерв; после отправки перевозка не возвращается, груз доставляется пригодному Нодрулу или утрачивается. Если до отправки вмешательство станет невозможным и Нодрул ещё не вступил в войну с Шабратом, вся сумма автоматически вернётся."



 STP_ps_exile: "Партийное представительство в Нодруле"

 STP_ps_cancel_nod: "Отменить подготовку северного пакета"

 STP_ps_nod_dispatch: "Подготовка северного пакета"

 STP_ps_nod_delivery: "Северный пакет в пути"

 STP_ps_agreement_title: "Протокол со Стеландером"
 STP_ps_agreement_desc: "Предложение из Стеландера пришло в момент, когда отношения двух правительств ещё формально не изменились. Партия готова оплачивать кредиты, оружие и работу специалистов, если Нодрул сохранит для неё открытый канал снабжения. Речь не идёт о приказе вступить в войну и не требует расходовать северные средства без оплаты.\n\nДля Нодрула соглашение удобно именно своей ограниченностью. Можно поддерживать знакомый аппарат южнее границы, не обещая ему собственную армию. Но каждая принятая поставка делает север всё более заметной стороной чужого кризиса."
 STP_ps_agreement_accept: "Принимать согласованные пакеты помощи."

 STP_ps_agreement_decline: "Не брать этих обязательств."

 STP_ps_nod_rifle_purchase_cost: "£ADISCORD_economy_treasury_texticon §Y1500§!"

 STP_ps_nod_rifle_purchase_cost_blocked: "£ADISCORD_economy_treasury_texticon §R1500§!"

 STP_ps_nod_rifle_purchase_cost_tooltip: "£ADISCORD_economy_treasury_texticon §Y1500§!"

 STP_ps_nod_rifle_purchase: "Закупить винтовки для северного фронта"

 STP_ps_nod_rifle_purchase_work: "Закупить винтовки для северного фронта - исполнение"

 STP_ps_nod_rifle_purchase_desc: "Цена: 1500 казны. Срок: 14 дней. Пауза после завершения: 0 дней. При утрате условий незавершённый депозит возвращается."

 STP_ps_nod_rifle_purchase_work_desc: "Зарезервировано 1500 казны. Результат выдаётся только при сохранении условий программы; отмена возвращает депозит один раз."

 STP_ps_exile_offer_title: "Просьба уцелевшего руководства"

 STP_ps_exile_offer_desc: "Сообщение пришло уже после поражения партийной армии. Несколько машин с уцелевшими чиновниками и связными остановились на дороге к северной границе, а вслед за ними прибыла официальная просьба предоставить убежище руководству организации. Они не просили передать им Нодрул и не требовали немедленного похода назад. Им требовалось место, где структура сможет не исчезнуть окончательно.\n\nПринятие сохранит людей, архивы и часть политической сети партии. Отказ оставит их искать другой выход в момент, когда собственное государство для них уже потеряно."
 STP_ps_exile_refuse: "Закрыть представительство."

 STP_ps_exile_accept: "Предоставить убежище."

 STP_ps_exile_arrived_title: "Представительство в изгнании"

 STP_ps_exile_arrived_desc: "Война за Стеландер проиграна. Шабрат контролирует страну, а уцелевшая партийная организация начинает работу в Нодруле. Сохранены только заранее вывезенные средства. Армия, казна и правительство принимающей страны остаются её собственными. Возвращение потребует отдельного политического соглашения и настоящей военной победы."

 STP_ps_exile_arrived_ok: "Начать работу представительства."

 STP_ps_return_title: "Восстановленное правительство"

 STP_ps_return_desc: "Колонна вошла в Фаду под двумя флагами. Впереди шли нодрульские части, за ними машины с чиновниками и людьми, которые ещё недавно называли себя правительством в изгнании. Кампания возвращения закончилась, и Стеландер снова получает партийную администрацию на своих национальных территориях.\n\nВозвращение не отменяет прошедших лет. Погибшие не появляются в кабинетах снова, старые склады не наполняются сами, а прежние военные договоры не оживают от одного приказа. Восстановленное правительство будет зависеть от Нодрула ещё сильнее, чем то, которое когда-то бежало к нему за убежищем."
 STP_ps_remain_nod: "Продолжить за Нодрул."

 STP_ps_control_stp: "Возглавить восстановленный Стеландер."


 STP_ps_return_terms_tt: "Возвращение восстановит Стеландер как зависимое государство Нодрула. Для результата нужна военная победа; оплата подготовки не заменяет её."

 STP_ps_evacuate_funds_cost: "£ADISCORD_economy_treasury_texticon §Y3000§!"

 STP_ps_evacuate_funds_cost_blocked: "£ADISCORD_economy_treasury_texticon §R3000§!"

 STP_ps_evacuate_funds_cost_tooltip: "£ADISCORD_economy_treasury_texticon §Y3000§!"



 STP_ps_evacuate_funds: "Вывести резерв организации"

 STP_ps_evacuate_funds_desc: "Однократно списывает 3000 казны в эвакуационный резерв. При принятом изгнании средства получит Нодрул; при победе партии резерв возвращается. Отказ в убежище означает утрату вывезенных средств."

 STP_ps_accept_return_terms: "Принять условия возвращения"

 STP_ps_launch_return: "Начать кампанию возвращения"

 STP_ps_exile_training_cost: "£ADISCORD_economy_treasury_texticon §Y1800§!"

 STP_ps_exile_training_cost_blocked: "£ADISCORD_economy_treasury_texticon §R1800§!"

 STP_ps_exile_training_cost_tooltip: "£ADISCORD_economy_treasury_texticon §Y1800§!"
 STP_ps_exile_training: "Подготовить штаб возвращения"
 STP_ps_exile_training_work: "Подготовка штаба возвращения"
 STP_ps_exile_training_desc: "1800 казны и 28 дней. Штаб получает 15 армейского опыта и готовит политико-военный план возвращения. Формирования заказываются отдельно с полным резервированием людей и оружия."

 STP_ps_exile_training_work_desc: "Зарезервировано 1800 казны. Результат выдаётся только при сохранении условий программы; отмена возвращает депозит один раз."

 STP_ps_radio_network: "Сеть правительственной связи"

 STP_ps_radio_network_desc: "В старой системе почти каждый срочный приказ проходил через несколько столичных узлов. Достаточно потерять одну станцию или одного дежурного, и округа начинали ждать подтверждения, которого могло уже не быть. Партия разнесёт передатчики, таблицы позывных и копии шифров по независимым пунктам связи.\n\nЭто не ещё одна радиостанция для речей. Это сеть, в которой захват одного кабинета больше не означает тишину для всего государства."
 STP_ps_reserve_hq: "Резервный штаб"

 STP_ps_reserve_hq_desc: "Бронзовый конгресс слишком долго был одновременно символом власти, архивом и местом, откуда армия ждала приказов. Резервный штаб получит копии карт, мобилизационных списков, печатей и каналов связи в отдельном защищённом помещении вне правительственного квартала.\n\nЕсли столица окажется под ударом, государству понадобится не памятник непрерывности, а второй стол, за которым уже знают, что делать."
 STP_ps_evacuation_plan: "Эвакуационный план"

 STP_ps_evacuation_plan_desc: "Заранее согласуем связь, документы и вывоз организации. Средства выводятся отдельным решением; план не переносит армию или остаток государственной казны."

 STP_ps_northern_partner: "Северный союзник"
 STP_ps_northern_partner_desc: "Нодрул ведёт собственную войну. Предложим ему помощь и установим постоянную связь ведомств. Соглашение не заменяет его решение о вмешательстве; гарантии убежища обсуждаются отдельным протоколом."

 STP_ps_northern_credit: "Кредит военному ведомству"

 STP_ps_northern_credit_desc: "Кредит оплачивается нашей казной и поступает в бюджет Нодрула. Поддержка союзника конкурирует с восстановлением собственной армии."

 STP_ps_northern_arms: "Оружие северному фронту"

 STP_ps_northern_arms_desc: "Северному фронту нужны винтовки, орудия и имущество тыла. Передавать можно только имеющиеся на складах запасы."

 STP_ps_northern_engineers: "Инженерная миссия"

 STP_ps_northern_engineers_desc: "Инженеры служат на действующем северном фронте ограниченный срок. Окончание войны прекращает их военный эффект."

 STP_ps_joint_staff: "Совместный штаб"

 STP_ps_joint_staff_desc: "Нодрульские офицеры и партийный штаб впервые сядут за один стол не как советники и подопечные, а как две армии, которым может понадобиться одна дорога. Общие заявки на горючее, маршруты эшелонов и таблицы связи будут согласованы заранее.\n\nНодрул сохранит собственное командование. Партия сохранит своё. Совместным станет только то, что должно сработать в тот день, когда обеим сторонам окажется недостаточно хороших намерений."
 STP_ps_expedition_logistics: "Обеспечить переброску"

 STP_ps_expedition_logistics_desc: "Подготовим резерв снабжения, который начнёт действовать только после фактического вступления Нодрула. Семь дней на переброску армии остаются обязательными."

 STP_ps_asylum_protocol: "Гарантии убежища"

 STP_ps_asylum_protocol_desc: "Даже поражение северной армии не исключает убежища, пока Нодрул существует и сохраняет самостоятельное правительство. Соглашение обеспечивает убежище руководству партии; управление Нодрулом не передаётся."

 STP_ps_foreign_supply_desk: "Бюро внешних поставок"

 STP_ps_foreign_supply_desk_desc: "Отделим политическое наблюдение от расследования конкретных поставок. Оплаченная разведка раскрывает маршрут; перехват требует отдельного времени и средств."

 STP_ps_ammunition_board: "Резерв боеприпасов"
 STP_ps_ammunition_board_desc: "Смешанный боекомплект можно заказать через транспортное управление либо после расширения арсеналов. Правительство выбирает, какой путь открыть первым. Каждый заказ стоит 2400 казны и исполняется 21 день; подготовка бумаги сама по себе не пополняет склады."

 STP_ps_operational_reserve: "Оперативный резерв"
 STP_ps_operational_reserve_desc: "Штаб начнёт готовить смену истощённым частям одновременно с организацией подвоза. Оплачиваемая программа резерва доступна уже после создания единого командования. Она улучшает подготовку и восстановление организации, но не выдаёт бесплатных людей или дивизий."

 STP_ps_route_security: "Охрана сообщений"
 STP_ps_route_security_desc: "Связь между Бронзовым конгрессом и Ниансасом нуждается в охране. Портовый штаб или восстановленная тыловая администрация смогут открыть эту программу, когда оба города находятся под нашим контролем. Оплаченная охрана не заменяет возвращения потерянных узлов."

 STP_ps_temporary_presidium: "Временный президиум"
 STP_ps_temporary_presidium_desc: "Потеря Конгресса требует полномочного правительства, способного подписывать военные расходы. За семь дней утвердим временный президиум, выиграем ещё семь дней для действующего правительственного кризиса и откроем платное развёртывание аварийного кабинета. Бесплатная административная процедура остаётся доступной сразу; заранее подготовленный резервный штаб сохраняет свой ускоренный вариант."

 STP_ps_restore_couriers: "Восстановить окружную связь"
 STP_ps_restore_couriers_desc: "После падения Бронзового конгресса часть телефонных линий исчезла вместе с кабинетами, а часть стала опаснее молчания. Окружные курьеры получат маршруты, запасные печати и право отвечать действующему временному правительству.\n\nВосстановленная связь открывает перегруппировку фронта и даёт 25 командного ресурса на один такой приказ. Через неё можно восстановить тыл и создать оперативный директорат, не ожидая возвращения столицы."
 STP_ps_counter_supply: "Перекрыть каналы Кефрейта"
 STP_ps_counter_supply_desc: "Контрразведка подчиняется действующим тыловым управлениям или временному правительству. Ей не нужно ждать, пока армия вернёт дорогу к Ниансасу. Раскрывать и перехватывать можно конкретные оплаченные отправления Кефрейта; потеря наземного маршрута останавливает доставку."
 STP_ps_retake_congress: "Правительство возвращается"
 STP_ps_retake_congress_desc: "Военным предстоит действительно взять квартал Бронзового конгресса: решение правительства не может заменить победу на земле. После возвращения здания соберём в нём ведомства, проверим сохранность архивов и подтвердим полномочия окружных управлений.\n\nВозобновление работы укрепит стабильность и поддержку войны на 5 процентных пунктов. Это разовый результат возвращения правительства; повторная потеря и захват квартала не дают новой награды."
 STP_ps_permanent_security: "Постоянная служба безопасности"

 STP_ps_permanent_security_desc: "Центр должен содержать постоянный аппарат, оплачивая его работу. Реорганизация проходит тремя платежами и закрепляет централизованную модель управления."

 STP_ps_presidium_authority: "Полномочия президиума"

 STP_ps_presidium_authority_desc: "Полномочия президиума закрепляют оплаченную реорганизацию. Окружные уступки разбираются по её итогам; чрезвычайный аппарат становится постоянным расходом."

 STP_ps_district_fund: "Фонд окружного восстановления"

 STP_ps_district_fund_desc: "Округа получают собственную программу реальных строительных проектов. Распределение средств требует завершить восстановление управления."

 STP_ps_cells_agreement: "Соглашение ячеек"

 STP_ps_cells_agreement_desc: "Участие округов закрепляется в постоянном договоре. Вместо единого силового аппарата организация принимает распределённое управление и местные обязательства."

 STP_ps_exile_office: "Представительство в изгнании"

 STP_ps_exile_office_desc: "Организация сохраняет самостоятельную политическую работу, но действует по законам Нодрула."

 STP_ps_exile_survivors: "Собрать уцелевших"

 STP_ps_exile_survivors_desc: "Соберём действующих организаторов и восстановим сведения об уцелевших. Погибшие и арестованные не возвращаются по решению канцелярии."

 STP_ps_host_agreement: "Соглашение с хозяевами"

 STP_ps_host_agreement_desc: "Нодрул сохраняет свою армию, главу государства и внешнюю политику. Эмигрантские формирования требуют его ресурсов и отдельной оплаты."

 STP_ps_exile_formations: "Эмигрантские формирования"

 STP_ps_exile_formations_desc: "Подготовим кадровую основу новых частей. Каждое формирование оплачивается людьми и оружием; прежняя армия партии не копируется."

 STP_ps_return_terms: "Цена возвращения"

 STP_ps_return_terms_desc: "Возвращённая Нодрулом партия будет зависеть от военного победителя. Условия можно принять отдельным решением либо продолжить работу в изгнании."

 STP_ps_return_campaign_focus: "Кампания возвращения"

 STP_ps_return_campaign_focus_desc: "Политическая и военная подготовка позволяют начать отдельную кампанию. Если Нодрул уже воюет с Шабратом, используется существующая война."
 STP_ps_northern_agreement_tt: "Нодрул получит предложение принимать оплаченные пакеты помощи. Война и убежище согласуются отдельно."

 STP_ps_central_result_tt: "Постоянная модель: стабильность +5%, ежедневная политическая власть +0,10, административные расходы +8%. Чрезвычайные окружные уступки отменяются."

 STP_ps_district_result_tt: "Постоянная модель: скорость строительства +8%, административные расходы -5%, ежедневная политическая власть -0,05. Окружные уступки входят в договор."

 STP_ps_institution_payment_cost: "£ADISCORD_economy_treasury_texticon §Y2000§!"

 STP_ps_institution_payment_cost_blocked: "£ADISCORD_economy_treasury_texticon §R2000§!"

 STP_ps_institution_payment_cost_tooltip: "£ADISCORD_economy_treasury_texticon §Y2000§!"

 STP_ps_institution_payment: "Оплатить этап реорганизации аппарата"

 STP_ps_institution_payment_work: "Оплатить этап реорганизации аппарата - исполнение"

 STP_ps_institution_payment_desc: "Цена: 2000 казны. Срок: 28 дней. Пауза после завершения: 0 дней. При утрате условий незавершённый депозит возвращается."

 STP_ps_institution_payment_work_desc: "Зарезервировано 2000 казны. Результат выдаётся только при сохранении условий программы; отмена возвращает депозит один раз."

 STP_ps_val_send_supply_cost: "£infantry_equipment_texticon §Y1200§!"

 STP_ps_val_send_supply_cost_blocked: "£infantry_equipment_texticon §R1200§!"

 STP_ps_val_send_supply_cost_tooltip: "£infantry_equipment_texticon §Y1200§!"

 STP_ps_val_send_supply: "Отправить оружие стеландерскому подполью"

 STP_ps_val_send_supply_desc: "1200 настоящих винтовок. Подготовка 28 дней, первая отправка 35 дней. Без связанного сухопутного пути груз ожидает и не появляется у получателя. До раскола винтовки остаются в окружном тайнике Ниансанса, затем доставляются STS. Перехват передаёт их партии."

 STP_ps_val_intelligence_cost: "£ADISCORD_economy_treasury_texticon §Y450§!"

 STP_ps_val_intelligence_cost_blocked: "£ADISCORD_economy_treasury_texticon §R450§!"

