 STP_ps_val_intelligence: "Разведать заявку Кефрейта"

 STP_ps_val_intelligence_work: "Разведать заявку Кефрейта - исполнение"

 STP_ps_val_intelligence_desc: "Цена: 450 казны. Срок: 7 дней. Пауза после завершения: 0 дней. При утрате условий незавершённый депозит возвращается."

 STP_ps_val_intelligence_work_desc: "Зарезервировано 450 казны. Результат выдаётся только при сохранении условий программы; отмена возвращает депозит один раз."

