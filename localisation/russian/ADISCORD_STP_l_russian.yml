 STP_SUSPICION_BAND_HIDDEN: "сеть не обнаружена"
 STP_SUSPICION_BAND_NOTICED: "службы замечают несоответствия"
 STP_SUSPICION_BAND_WATCHED: "установлено наблюдение"
 STP_SUSPICION_BAND_COMPROMISED: "сеть частично раскрыта"
 STP_SUSPICION_BAND_MANHUNT: "при 100% арест последует"

 STP_SUSPICION_EXPLANATION_HIDDEN: "§gСлужбы ещё не видят общей системы в отдельных контактах и перемещениях. Подполье может действовать свободно, не расходуя политический ресурс на постоянное прикрытие.§!"
 STP_SUSPICION_EXPLANATION_NOTICED: "§gАналитики замечают повторяющиеся несоответствия. Новые операции уже требуют осторожности, но структура сети всё ещё скрыта.§!"
 STP_SUSPICION_EXPLANATION_WATCHED: "§gЗа подозрительными контактами установлено наблюдение. Партия теперь ведёт две комиссии одновременно, а политическая работа вязнет в проверках, слежке и смене каналов связи.§!"
 STP_SUSPICION_EXPLANATION_COMPROMISED: "§gЧасть сети установлена. Службы сопоставляют имена, маршруты и источники финансирования, заставляя подполье тратить всё больше сил на выживание.§!"
 STP_SUSPICION_EXPLANATION_MANHUNT: "§gС 90 до 99 служба уже ведёт список Шабрата. Пока шкала не достигла 100%, подозрение ещё можно снизить. При 100% Шабрат будет арестован; уже состоявшийся арест снижением шкалы не отменяется.§!"
 STP_LOYALTY_VALUE_HIGH: "§G[?STP_apparatus_loyalty|0]%§!"
 STP_LOYALTY_VALUE_MEDIUM: "§Y[?STP_apparatus_loyalty|0]%§!"
 STP_LOYALTY_VALUE_LOW: "§R[?STP_apparatus_loyalty|0]%§!"
 STP_LOYALTY_BAND_LOCKED: "аппарат сомкнут"
 STP_LOYALTY_BAND_OBEDIENT: "округа подчиняются"
 STP_LOYALTY_BAND_HELD: "контроль удерживается"
 STP_LOYALTY_BAND_STRAINED: "дисциплина трещит"
 STP_LOYALTY_BAND_FRACTURED: "аппарат распадается"
 STP_LOYALTY_EXPLANATION_LOCKED: "§gКабинеты, печати и окружные штабы идут в одном порядке. Связные Шабрата тратят больше времени на каждую операцию, а политическая работа аппарата идёт без постоянных срывов.§!"
 STP_LOYALTY_EXPLANATION_OBEDIENT: "§gБольшинство окружных начальников исполняет директивы. Проверки и канцелярия протокола дают результат, но отдельные связи подполья ещё живы.§!"
 STP_LOYALTY_EXPLANATION_HELD: "§gПартия удерживает кабинеты, однако местные кланы торгуются за каждое назначение. Верность нужно подкреплять проверками и срывом объявленных операций связных.§!"
 STP_LOYALTY_EXPLANATION_STRAINED: "§gЧасть окружного аппарата уже смотрит в сторону Шабрата. Политическая работа вязнет, а связные успевают закончить подготовку раньше наших проверок.§!"
 STP_LOYALTY_EXPLANATION_FRACTURED: "§gПечати и назначения расходятся. Подполье действует почти открыто, а кабинет тратит ресурс на удержание собственных людей.§!"
 ivanov_health_is_getting_worse: "§YЗдоровье Иванова ухудшается!§!"
 STP_debug_increase_suspicion: "§RDEBUG:§! Увеличить подозрение партии"
 STP_debug_increase_suspicion_desc: "Тестово увеличивает §Yподозрение спецслужб§! на §R10§! пунктов."
 STP_debug_decrease_suspicion: "§RDEBUG:§! Уменьшить подозрение партии"
 STP_debug_decrease_suspicion_desc: "Тестово уменьшает §Yподозрение спецслужб§! на §G10§! пунктов."
 STP_debug_increase_loyalty: "§RDEBUG:§! Увеличить верность аппарата"
 STP_debug_increase_loyalty_desc: "Тестово увеличивает §Yверность аппарата§! на §G10§! пунктов."
 STP_debug_decrease_loyalty: "§RDEBUG:§! Уменьшить верность аппарата"
 STP_debug_decrease_loyalty_desc: "Тестово уменьшает §Yверность аппарата§! на §R10§! пунктов."
 STP_debug_worsen_ivanov: "§RDEBUG:§! Ухудшить состояние Иванова"
 STP_debug_worsen_ivanov_desc: "Тестово переводит состояние Иванова на §Rодну стадию хуже§!. Максимум - стадия 5/5."
 STP_debug_improve_ivanov: "§RDEBUG:§! Улучшить состояние Иванова"
 STP_debug_improve_ivanov_desc: "Тестово переводит состояние Иванова на §Gодну стадию лучше§!. Минимум - стадия 1/5."
 STP_debug_set_bop: "§RDEBUG:§! Включить BOP"

 STP_battle_for_stelander: "Битва за Стеландер"
 STP_battle_for_stelander_desc: "[STPGetPreparationInstructions]\n\n§YПлан мобилизации при досрочном расколе§!\nПартия: до §Y[?STP_cw_report_party_brigades|0]§! линейных бригад и до §Y6§! усиленных дивизий.\nСопротивление: до §Y[?STP_cw_report_resistance_brigades|0]§! линейных бригад и до §Y6§! усиленных дивизий.\nРеспублики: до §Y10§! линейных бригад.\nСверх плана для сопротивления готовы и оплачены усиленные дивизии: §Y[?STP_cw_prepared_assault_divisions|0]§!.[STPGetKefreytArmyCommitment]\n\n§YСвободный общий резерв сейчас:§! £manpower_texticon §Y[?manpower|0]§!, £infantry_equipment_texticon §Y[?num_equipment@infantry_equipment|0]§!. Регулярные и полицейские части вернут людей и оружие в общий резерв; гвардия останется у партии. Фактический состав ограничен ресурсами; итог выборов изменит план.\n\n§YОперации:§! свободно §C[?STP_political_action_slots_available|0]§! из §Y[?STP_political_action_slots_total|0]§!. [STPGetPreparationPressure]\n§YПоследняя проверка:§! [STPGetLastPartyResponse]\n\nРаскол, потеря округа или контрразведка прервут местные операции. Возврат оплаты и запасов указан в условиях каждой операции.\n\n§YНодрул:§! [STPGetNodStatus]"
 STP_PREPARATION_PRESSURE_PARTY: "§YПодполье Шабрата:§! таймер показывает подготовку его связных. Высокая верность аппарата задерживает следующую операцию; низкая ускоряет её. Проверяйте указанный округ или перехватывайте подготовку после коллегии безопасности."
 STP_PREPARATION_PRESSURE_SHABRAT: "§YПартийные комиссии:§! цель и срок указаны в миссии. При подозрениях от 50 партия ведёт две комиссии одновременно. Начатые переговоры с гарнизонами, снабжение и диверсии могут быть раскрыты ещё до завершения."
 STP_regions_panel_title: "Кому подчинится Стеландер?"
 STP_regions_panel_tt: "Яркий цвет - кому округ §Yреально перейдёт§! при расколе. Бледный - только текущий перевес.\n\n§YОбычный спорный округ§! переходит Шабрату, если выполняется хотя бы одно условие:\n• сопротивление закрепилось и администрация проработала §Y21 день§!;\n• влияние сопротивления достигло §G90%§! - абсолютное доминирование достаточно само по себе;\n• легитимность Шабрата выше §Y55%§! - сильный мандат забирает спорные округа без готовой администрации.\n\n§YНиансас§!: после фокуса §Y«Дорога через Ниансас»§! появляется операция §Y«Перехватить областное управление»§!. Для неё достаточно закреплённого сопротивления и любого положительного перевеса легитимности Шабрата (§Y>0§!)."
 STP_regions_map_tt: "§7Серый§! - спорный регион; §Cсиний§! - Сопротивление; §0фиолетовый§! - Партия; §Yжёлтый§! - местные силы. Яркий оттенок совпадает с передачей при расколе; бледный показывает только перевес. Легитимность выше §Y55%§! отдаёт спорные округа Шабрату."
 STP_regions_legend: "§7СПОРНЫЙ§!   §CСОПРОТИВЛЕНИЕ§!   §0ПАРТИЯ§!   §YМЕСТНЫЕ СИЛЫ§!"

 ADISCORD_STP_regions.1.t: "Страна во втором экземпляре"
 ADISCORD_STP_regions.1.d: "На столе перед Шабратом лежит не карта фронта, а карта подчинения. В одном штате решающей окажется подпись начальника, в другом - слово совета, в третьем - ключ от склада. Партия ещё считает эти земли единой страной и потому будет посылать комиссии туда, где сеть выдаёт себя громче всего. До раскола необходимо решить, что важнее в каждом регионе: забрать его себе, вытеснить оттуда Партию руками местных или оставить спорным, но подготовить один решающий актив."
 ADISCORD_STP_regions.1.a: "Начать Битву за Стеландер"

