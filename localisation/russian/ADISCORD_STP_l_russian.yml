 STP_PARTY_LAST_RESPONSE: "[STPGetPartyResponseOutcome]"
 STP_PARTY_OUTCOME_1: "§Rпроверяющие ушли по чистому ложному следу§!"
 STP_PARTY_OUTCOME_2: "§Yпроверка увязла, но заметила несостыковки§!"
 STP_PARTY_OUTCOME_3: "§Gзадержан связной; один административный контакт мог быть потерян§!"
 STP_PARTY_OUTCOME_4: "§Gконтрразведка раскрыла окружную сеть; незащищённые связи потеряны, работа закрыта на 56 дней§!"
 STP_PARTY_OUTCOME_5: "§Gпроверка вычистила завербованного чиновника§!"
 STP_PARTY_OUTCOME_6: "§Gсоглашение с местным советом расторгнуто; введён партийный гарнизон§!"
 STP_PARTY_OUTCOME_7: "§Gсиловики ударили по самому заметному центру сети§!"
 STP_PARTY_OUTCOME_8: "§Gаппарат укрепил обычную административную дисциплину§!"
 STP_PARTY_OUTCOME_9: "§Yчиновник сдан; военные связи и запасы сохранены§!"
 STP_PARTY_OUTCOME_10: "§Gпроверка выявила следы оппозиции; сдвиг легитимности на 4% в пользу партии§!"
 STP_PARTY_OUTCOME_11: "§Rпроверка не выявила следов оппозиции; сдвиг легитимности на 2% в пользу Шабрата§!"
 STP_PARTY_OUTCOME_12: "§Yгражданская администрация сохранена; местная военная сеть распущена§!"
