 STP_REGION_EMPTY_LINE: ""
 STP_REGION_ASSET_ADMINISTRATION: "\n  §C- администрация: передача округа Шабрату при закреплённом влиянии§!"
 STP_REGION_ASSET_ADMINISTRATION_RECENT: "$STP_REGION_ASSET_ADMINISTRATION$\n  §YЕщё не готова признать передачу власти: нужен 21 день непрерывной работы.§!"
 STP_REGION_ASSET_ADMINISTRATION_READY: "$STP_REGION_ASSET_ADMINISTRATION$\n  §GПроработала 21 день: готова признать передачу власти.§!"
 STP_REGION_ASSET_GARRISON: "\n  §C- гарнизон: две дополнительные бригады при переходе округа Шабрату§!; на каждую нужны £manpower_texticon §Y4000§! и £infantry_equipment_texticon §Y320§!."
 STP_REGION_ASSET_SUPPLY: "\n  §C- снабжение на 21 день: расход -10%, восстановление организации +5%§!\n  Топливо: 500 из запасов партии при наличии. Второй склад добавит свои 500 топлива; эффект снабжения общий."
 STP_REGION_ASSET_SABOTAGE: "\n  §C- подрыв: повреждение 1 уровня инфраструктуры при сохранении округа под владением и контролем партии§!"
 STP_REGION_ASSET_SABOTAGE_CAPITAL: "\n  §C- подрыв: повреждение инфраструктуры и военного завода, если партия удержит столицу§!"
 STP_REGION_ASSET_SABOTAGE_INDUSTRY: "\n  §C- подрыв: повреждение гражданского завода, если партия удержит округ§!"
 STP_REGION_ASSET_LOCAL_DEAL: "\n  §Y- договор: Ливонин перейдёт Шабрату, пока соглашение сохраняется§!"
 STP_REGION_PARTY_GARRISON: "\n  §0- гарнизон: две дополнительные бригады партии, если округ останется у неё§!; на каждую нужны £manpower_texticon §Y4000§! и £infantry_equipment_texticon §Y320§!."
 STP_REGION_PARTY_COUNTERINTELLIGENCE: "\n  §0- контрразведка: действия в регионе закрыты на 56 дней с момента её введения§!"
 STP_REGION_ASSET_SUPPLY_NEEDS_DISTRICT: "\n  §Y- снабжение подготовлено; для передачи топлива и поддержки армии нужно передать округ Шабрату§!"
 STP_REGION_INSPECTION_CONCESSION: "\n\n§YПроверка:§! условия комиссии приняты. Сохранившиеся гражданские или военные связи защищены до её решения; новые операции в округе закрыты §Yдо завершения текущей проверки§!. Оставшееся время показано в таймере её миссии."
 STP_REGION_INSPECTION_FALSE_TRAIL_READY: "\n\n§YПроверка:§! ложный след готов. [STP.STPGetFalseTrailOdds] Шансы могут измениться до конца комиссии."
 STP_REGION_INSPECTION_FALSE_TRAIL_PENDING: "\n\n§YПроверка:§! идёт 7-дневная подготовка ложного следа. Он поможет, только если будет готов до конца этой комиссии."
 STP_REGION_INSPECTION_ACTIVE: "\n\n§YПроверка:§! работает комиссия; оставшееся время показано в её миссии. Возможные ответы: отсрочка, ложный след, сдача чиновника или открытие гражданских реестров. Доступность зависит от завершённых фокусов и местных связей."
 STP_REGION_INSPECTION_COUNTERINTELLIGENCE: "\n\n§RКонтрразведка:§! действия в регионе закрыты на §Y56 дней с момента её введения§!. Оставшееся время показано в миссии «Контрразведка» этого региона."

 STP_PARTY_RESPONSE_NONE: "проверки ещё не дали результата"
