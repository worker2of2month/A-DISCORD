 STP_imperial_union_nodrul_defeated: "Нодрул побеждён"
 STP_imperial_union_required_states_controlled: "Все земли будущего Имперского союза принадлежат нам и находятся под нашим контролем"
 STP_imperial_union_requirements_met: "Выполнены условия провозглашения Имперского союза"
 STP_imperial_union_proclaimed: "Стеландский Имперский Союз провозглашён"

 STP_pw_recovery_start_tt: "Открывает послевоенное восстановление. Три программы снимают последствия войны: гражданские службы, мастерские и включение отрядов в регулярную армию. Одновременно оплачивается одна программа; ход работ показан в военном совете."
 STP_pw_reconstruction_dynamic: "Последствия гражданской войны"
 STP_pw_reconstruction_dynamic_desc: "Разорванные производственные связи и расходы на восстановление мешают новой власти. Каждая завершённая программа снимает треть штрафов."
 STP_pw_project_idle_tt: "Нет другой оплаченной программы восстановления."
 STP_pw_recovery_complete_tt: "Победа в Стеландере закреплена; завершены все три программы восстановления."
 STP_pw_restore_services: "Восстановить гражданские службы"
 STP_pw_restore_services_desc: "Вернём в округа врачей, снабженцев и служащих. Работы занимают 42 дня и общий слот восстановления. Потеря контроля над столицей или капитуляция прерывает программу с полным возвратом оплаты."
 STP_pw_restore_services_result_tt: "Через §Y42 дня§!: стабильность §G+5%§!, расходы управления §G-5%§! и снятие трети штрафов восстановления."
 STP_pw_restart_workshops: "Запустить восстановленные мастерские"
 STP_pw_restart_workshops_desc: "Оплатим станки, подключение энергии и возвращение рабочих. Через 56 дней сеть небольших мастерских даст две внерегиональные гражданские фабрики. Программа занимает общий слот; потеря столицы или капитуляция возвращает оплату."
 STP_pw_restart_workshops_result_tt: "Через §Y56 дней§!: §Y2 внерегиональные гражданские фабрики§! и снятие трети штрафов восстановления."
 STP_pw_integrate_veterans: "Включить отряды в регулярную армию"
 STP_pw_integrate_veterans_desc: "Оплатим кадровые комиссии, обучение сержантов и общую службу пополнения. Программа длится 35 дней и занимает общий слот. Существующие дивизии сохраняются; потеря столицы или капитуляция возвращает оплату."
 STP_pw_integrate_veterans_result_tt: "Через §Y35 дней§!: восстановление организации §G+10%§!, §Y25§! опыта армии и снятие трети штрафов восстановления."
 STP_pw_project_refund_tt: "Неиспользованная оплата возвращается в казну. Программа снова доступна после восстановления условий."
 STP_pw_army_procurement: "Заказать комплект перевооружения"
 STP_pw_army_procurement_desc: "Оплатим заказ частным мастерским: 4000 единиц пехотного снаряжения, 300 орудий и 200 противотанковых орудий. Новый заказ доступен через 90 дней."
 STP_pw_air_procurement: "Закупить учебно-боевые самолёты"
 STP_pw_air_procurement_desc: "Частные поставщики передадут 100 простых истребителей для комплектования авиачастей. Цена фиксирована; поставка не зависит от прежней помощи Кефрейта. Новый заказ - через 120 дней."
 STP_pw_border_dossier: "Обновить сведения о соседних армиях"
 STP_pw_border_dossier_desc: "Военные атташе и пограничная служба подготовят сведения о силах Кефрейта и Нодрула. Повторная работа доступна через 120 дней."
 STP_pw_settle_kefreyt_accounts: "Рассчитаться за помощь Кефрейта"
 STP_pw_settle_kefreyt_accounts_desc: "Переведём Кефрейту 900 единиц казны в счёт военных поставок. Стабильность вырастет на 5%. Расчёт не создаёт союз и не гарантирует отказ соседа от территориальных претензий."
 STP_pw_plan_offensive: "Подготовить ограниченное наступление"
 STP_pw_plan_offensive_desc: "Сосредоточим штабные ресурсы на 45-дневной наступательной операции. Приказ доступен только во время войны и требует 50 командного ресурса. До следующей операции - 75 дней."
 STP_pw_emergency_reserves: "Объявить чрезвычайный сбор резерва"
 STP_pw_emergency_reserves_desc: "На 90 дней ускорим мобилизацию. Приказ доступен во время войны, требует 25 командного ресурса и может быть повторён через 120 дней."
