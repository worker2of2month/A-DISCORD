 STP_cw_operation_target_45: "$STATE_45$"
 STP_cw_operation_target_28: "$STATE_28$"
 STP_cw_operation_target_none: "новая цель не назначена"
 STP_cw_party_command_disruption: "Перебои в управлении"
 STP_cw_party_command_disruption_desc: "Начало раскола нарушило связь между партийными штабами. Командирам требуется время, чтобы восстановить порядок донесений и согласовать планы."
 STP_cw_operation_tempo: "Развитие наступления"
 STP_cw_operation_tempo_desc: "Взятие назначенного рубежа позволило штабу согласовать действия соединений и подготовить следующий удар."
 STP_cw_operation_disorganization: "Несогласованные приказы"
 STP_cw_operation_disorganization_desc: "Операция не уложилась в срок. Штаб пересматривает планы, а соединения восстанавливают нарушенное взаимодействие."

 STP_cw_front_scouts: "Связные переднего края"
 STP_cw_front_scouts_desc: "Свяжем окружные группы с армейскими штабами. Сведения о партийных частях позволят выбрать участок наступления до того, как туда подойдут резервы."
 STP_cw_mobile_workshops: "Ремонт вслед за фронтом"
 STP_cw_mobile_workshops_desc: "Соберём оружейников и оборудование в подвижные мастерские. Восстановленное оружие вернётся в части, а арсеналы перейдут на удлинённые смены. Фронт получит 6000 винтовок из восстановленного резерва."
 STP_cw_frontline_relief: "Смена на передовой"
 STP_cw_frontline_relief_desc: "Составим график смены батальонов и направим пополнение в действующие части. Уставшие подразделения должны восстанавливать порядок, а не продолжать наступление без остановки."
 STP_cw_route_columns: "Колонны снабжения"
 STP_cw_route_columns_desc: "Выделим транспорт и единый график движения для передовых складов. Снабжение не должно останавливаться вслед за первой же удачной атакой."
 STP_pc_val_renew_aid: "Продлить военные договоры"
 STP_pc_val_renew_aid_desc: "Кефрейт помог нам пережить гражданскую войну. Предложим заменить военные обязательства постоянным соглашением о поставках и ненападении. Уже оплаченные счета будут зачтены."
 STP_pc_val_border_compact: "Договор о поставках"
 STP_pc_val_border_compact_desc: "Нам не помогали кефрейтские добровольцы, но заводам и пограничным округам нужен устойчивый обмен. Предложим оплачиваемый договор с сохранением независимости обеих стран."
 STP_pc_val_ratify: "Утвердить договор с Кефрейтом"
 STP_pc_val_ratify_desc: "Закрепим принятые условия в работе ведомств и согласуем промышленные стандарты. Политическое клиентство и равноправный договор остаются разными исходами; только первое позволяет включить Кефрейт в Имперский союз."
 STP_pc_nod_recognition: "Взаимное признание"
 STP_pc_nod_recognition_desc: "Откажемся от подчинения соседа в обмен на признание нынешнего правительства и договор о ненападении. Нодрул получит компенсацию за прекращение спора; он вправе отвергнуть предложение."
 STP_pc_nod_ratify: "Закрепить северную границу"
 STP_pc_nod_ratify_desc: "После согласия Нодрула согласуем правила пограничной службы. Мирное признание снимает необходимость готовить наступление, но не делает Нодрул зависимым правительством."
 STP_pc_val_demand_offer_tt: "Кефрейт получит требование политической зависимости. Отказ откроет военную подготовку, но не объявит войну."
 STP_pc_nod_demand_offer_tt: "Нодрул получит требование политической зависимости. Отказ откроет военную подготовку, но не объявит войну."
 STP_pc_val_trade_offer_tt: "Кефрейт получит предложение взаимного договора. Только после его согласия мы заплатим £ADISCORD_economy_treasury_texticon §Y1800§!; если военные счета уже оплачены - §Y900§!. Обе страны получат договор о ненападении, §G+3%§! к выпуску военных заводов и §G-3%§! потребления снабжения. Независимость Кефрейта сохранится."
 STP_pc_nod_border_offer_tt: "Нодрул получит предложение взаимного признания. После его согласия мы заплатим £ADISCORD_economy_treasury_texticon §Y1350§!. Обе страны заключат договор о ненападении и сократят расходы на армию на §G8%§!. Нодрул останется независимым."
 STP_pc_campaign_preparation_tt: "Откроется оплачиваемая подготовка снабжения: £ADISCORD_economy_treasury_texticon §Y900§! и §Y35 дней§!. Затем приказ о войне доступен §Y90 дней§!. Противник получит предупреждение; сам фокус войны не объявляет."
 STP_pc_campaign_paid_tt: "Оплачиваются перевозки и развёртывание складов. Отмена не возвращает израсходованные деньги. Через §Y35 дней§! готовность позволит начать кампанию в течение §Y90 дней§!."
 STP_pc_nod_refused_tt: "Нодрул отверг предложение"
 STP_pc_nod_terms_accepted: "Нодрул принял предложенные условия"
 STP_pc_joint_workshops: "Совместные промышленные стандарты"
 STP_pc_offer_expired_desc: "Предложение утратило силу: изменились отношения между странами или ответ уже передан. Новых обязательств этот документ не создаёт."
 STP_pc_reject_terms: "Отвергнуть условия."
 STP_pc_accept_compact: "Принять взаимный договор."
 STP_pc_accept_client_terms: "Признать политическое первенство Стеланда."
 STP_pc_val_compact: "Кефрейтский договор о поставках"
 STP_pc_val_compact_desc: "Договор закрепляет ненападение и взаимные поставки для промышленности и армии. Кефрейт сохраняет независимость."
 STP_pc_nod_compact: "Северное пограничное соглашение"
 STP_pc_nod_compact_desc: "Взаимное признание позволяет сократить чрезвычайные расходы на северной границе без передачи суверенитета."
 STP_pc_val_compact_settlement_tt: "Стеланд оплатит договор: 1800 из казны, либо 900 при ранее оплаченных военных счетах. Средства поступят Кефрейту. Договор даст обеим сторонам ненападение, +3% выпуска военных заводов и -3% потребления снабжения."
 STP_pc_nod_compact_settlement_tt: "Стеланд выплатит Нодрулу 1350 из казны. Договор даст обеим сторонам ненападение и -8% расходов на армию; политической зависимости он не создаёт."
 ADISCORD_STP_pc.17.t: "Предложение Стеланда"
 ADISCORD_STP_pc.17.compact: "Встречу провели на железнодорожной станции у границы, где ещё недавно проверяли каждый вагон на оружие для сопротивления. Теперь на столе лежали два экземпляра постоянного соглашения. Стеланд предлагал Кефрейту оплачиваемые поставки, предсказуемый режим границы и отказ от взаимного нападения. Старые военные счета отделялись от новых обязательств и учитывались только там, где действительно оставались незакрытыми.\n\nДля Кефрейта это был почти идеальный язык переговоров: не дружба, не благодарность и не обещание вечного союза, а список того, кто что делает после подписи. Вопрос был только в том, считает ли Солгалов нового соседа достаточно устойчивым, чтобы поставить рядом свою печать."
 ADISCORD_STP_pc.17.demand: "Стеландская нота пришла без предложения торговаться о принципе. Кефрейту разрешалось сохранить собственное правительство, армию и хозяйственную систему, но внешняя политика должна была учитывать политическое первенство Стеланда. Формально это выглядело мягче оккупации. Для государства, построенного на праве самому назначать цену каждому договору, разница была не такой большой.\n\nСолгалову предлагали подписать документ, который превращал бы Кефрейт из продавца чужих войн в часть чужого порядка. Отказ не означал немедленного выстрела на границе, но обе стороны понимали, зачем к ноте приложена карта перевалов."
 ADISCORD_STP_pc.18.t: "Северная граница"
 ADISCORD_STP_pc.18.compact: "Северная делегация привезла на встречу копии старого мандата. Стеландцы положили рядом новый проект, в котором этих слов больше не было. Вместо покровительства предлагались взаимное признание, закрытие старого спора и договор о ненападении. Компенсация должна была позволить обеим сторонам списать часть расходов прошлого и перестать держать армию в постоянной готовности друг против друга.\n\nДля Нодрула это означало признать простую вещь, которую его дипломаты десятилетиями избегали произносить: южное государство больше не является проектом, за который север несёт особую ответственность. Подпись могла закрыть старую эпоху без ещё одной войны."
 ADISCORD_STP_pc.18.demand: "Когда-то Нодрул составлял документы, по которым Стеландер должен был жить после войны. Теперь из Фады пришёл текст, написанный в обратном порядке. Северному правительству предлагалось отказаться от прежнего мандата и признать политическое первенство Стеланда, сохранив собственную администрацию внутри новой системы зависимости.\n\nВ кабинете Бентликса документ читали как намеренное унижение старого порядка. Победители гражданской войны не просто требовали свободы от Нодрула. Они предлагали поменяться местами. Ответ мог остаться дипломатическим, но никто не сомневался, что отказ заставит обе стороны снова открыть военные карты."
 ADISCORD_STP_pc.20.t: "Подготовка на границе"
 ADISCORD_STP_pc.20.d: "Первые сообщения выглядели как обычная перегруппировка: дополнительные составы на южных ветках, топливные цистерны возле военных складов, инженерные колонны на дорогах к границе. Через несколько дней стало ясно, что совпадений слишком много. Стеланд собирал не гарнизон, а систему снабжения для возможного наступления.\n\nДипломатические каналы ещё открыты, и приказ о войне не подписан. Именно поэтому штаб относится к происходящему серьёзнее. Когда артиллерия уже выдвинута, а склады заполнены, последнее политическое решение становится намного дешевле первого.\n\nНа границе начинают копать позиции. Даже если переговоры возобновятся завтра, их теперь будут вести под шум прибывающих грузовиков."
 ADISCORD_STP_pc.20.a: "Привести штаб и резервы в готовность."
 ADISCORD_STP_pc.21.t: "Ответ на предложение"
 ADISCORD_STP_pc.21.val_compact: "Кефрейт вернул подписанный экземпляр соглашения. Расчётные палаты подтвердили перевод, пограничные ведомства получили новые инструкции, а промышленники уже начали сверять будущие поставки по единому графику. Никто не говорил о дружбе. Для обеих стран это скорее хороший признак.\n\nКефрейт остаётся самостоятельным государством, а Стеланд получает соседа, с которым границу можно считать не только линией возможной войны, но и частью работающего договора."
 ADISCORD_STP_pc.21.val_client: "Ответ Кефрейта оказался короче ожидаемого. Правительство согласилось признать политическое первенство Стеланда, сохраняя собственную администрацию, армию и внутреннюю контрактную систему. Отныне внешние решения Солгалова будут приниматься с оглядкой на Фаду.\n\nДля страны, которая привыкла продавать услуги всем и никому не принадлежать, это серьёзная уступка. Для Стеланда первая победа новой региональной политики оказалась достигнута без перехода границы."
 ADISCORD_STP_pc.21.val_refused: "Кефрейт вернул бумаги без подписи. В сопроводительной записке не было угроз, только привычная формула о том, что государство не принимает обязательства, цена которых определяется другой стороной. Через несколько часов кефрейтские пограничные части получили приказ повысить готовность.\n\nВ Фаде отказ не объявили поводом к войне. Военный штаб просто открыл заранее запечатанные карты перевалов. Теперь следующая стадия спора будет зависеть от того, решит ли правительство превратить дипломатический провал в подготовленную кампанию."
 ADISCORD_STP_pc.21.nod_compact: "Нодрул согласился закрыть старый мандат договором о взаимном признании. Расчёт по компенсации подтвердили обе казначейские службы, военным передали распоряжение прекратить чрезвычайное планирование друг против друга. На бумаге северная граница впервые за поколение перестала быть границей между покровителем и зависимым государством.\n\nНи одна сторона не получила права называть это победой другой. Возможно, именно поэтому соглашение оказалось возможным."
 ADISCORD_STP_pc.21.nod_client: "Подпись Нодрула изменила смысл старой системы одним росчерком. Государство, которое когда-то проектировало послевоенный Стеландер и следило за его зависимостью, теперь само признало политическое первенство Стеланда. Северная администрация сохраняется, но прежний мандат уступает место новому порядку.\n\nВ Фаде документ встретили без торжественного парада. Слишком многие помнили, как легко покровительство превращается в привычку командовать соседом. Теперь эту проверку предстоит пройти уже самому Стеланду."
 ADISCORD_STP_pc.21.nod_refused: "Нодрул отказался подписывать предложенные условия. В ответе старый мандат не назывался ошибкой и не признавался завершённым. Северное правительство давало понять, что поражение партии не даёт Стеланду права переписывать региональный порядок в одиночку.\n\nШтаб в Фаде получил копию ноты в тот же вечер. Рядом уже лежал план северных дорог и складов. Война ещё не началась, но дипломатия перестала быть единственным способом решить спор."
 ADISCORD_STP_pc.21.a: "Передать документы правительству."
 STP_pw_party_northern_protocol: "Протокол с Нодрулом"
 STP_pw_party_northern_protocol_desc: "Победа над восстанием не решила вопрос о прежней зависимости. Запросим условия Нодрула, прежде чем выбирать между возвращением под его покровительство и самостоятельным курсом."
 STP_pw_party_protectorate: "Возобновить протекторат"
 STP_pw_party_protectorate_desc: "Примем предложенное Нодрулом покровительство. Стеландер снова станет его марионеткой; обмен опытом поможет восстановить регулярную армию."
 STP_pw_party_sovereignty: "Опора на собственные силы"
 STP_pw_party_sovereignty_desc: "Правительство окончательно откажется от протектората и расширит собственное военное производство. Для Нодрула это будет не дипломатической формальностью, а открытым разрывом прежнего порядка. После завершения фокуса начнётся §R90-дневная подготовка к северному вторжению§!. Если мы хотели избежать войны, соглашаться на протекторат следовало раньше."
 STP_pw_party_northern_protocol_tt: "Нодрул получит запрос на возобновление протектората. Его согласие откроет соответствующий фокус, но окончательный выбор остаётся за Стеландером."
 STP_pw_party_protectorate_tt: "Стеландер вновь станет §Yмарионеткой Нодрула§!."
 STP_pw_party_nod_offer_accepted_tt: "Стеландер сможет принять протекторат отдельным фокусом. Сам ответ его статус не меняет."
 STP_pw_party_nod_offer_pending: "Ожидается ответ Нодрула"
 STP_pw_party_nod_offer_accepted: "Нодрул согласен возобновить протекторат"
 STP_pw_party_staff_exchange: "Обмен опытом штабов"
 ADISCORD_STP_pc.19.t: "Вопрос о протекторате"
 ADISCORD_STP_pc.19.d: "Партийная делегация прибыла в Нодрул без прежней уверенности. Гражданскую войну они выиграли, но страна вышла из неё беднее, западные земли живут собственной жизнью, а сам президиум больше не может прикрываться именем Иванова. На стол северного правительства легло предложение вернуться к знакомой системе покровительства.\n\nДля Нодрула это был редкий случай, когда старый клиент сам просил восстановить связь. Можно принять просьбу и снова получить политический рычаг в Стеландере. Можно отказаться и оставить победившую партию доказывать самостоятельность без внешней страховки.\n\nНи один вариант не возвращал прошлое полностью. Иванова больше нет, а зависимость, однажды ставшая предметом открытого спора, уже невозможно снова назвать просто дружбой."
 ADISCORD_STP_pc.19.refuse: "Пусть отвечают за себя."
 ADISCORD_STP_pc.19.accept: "Мы готовы возобновить протекторат."
 STP_pc_can_offer_nod_terms: "Нодрул независим, не воюет с нами и не состоит в нашей фракции; другого незавершённого предложения нет"
 STP_pw_prepare_val_campaign: "Развернуть снабжение против Кефрейта"
 STP_pw_prepare_val_campaign_desc: "Перевозки и передовые склады стоят £ADISCORD_economy_treasury_texticon §Y900§!. Подготовка займёт §Y35 дней§!, готовность сохранится §Y90 дней§!. Противник получит предупреждение и временный бонус оборонной подготовки. При отмене деньги не возвращаются; при изменении дипломатических условий подготовка прекращается."
 STP_pw_begin_val_campaign: "Начать кампанию против Кефрейта"
 STP_pw_begin_val_campaign_desc: "Объявить войну по подготовленному плану. Готовность складов будет израсходована, а армия получит усиленную подготовку наступления на §Y35 дней§!."
 STP_pc_val_campaign_ready: "Готовность к кампании против Кефрейта"
 STP_pc_val_campaign_ready_desc: "Передовые склады и транспорт готовы. Приказ о начале кампании доступен, пока действует этот дух."
 STP_pw_prepare_nod_campaign: "Развернуть снабжение против Нодрула"
 STP_pw_prepare_nod_campaign_desc: "Перевозки и передовые склады стоят £ADISCORD_economy_treasury_texticon §Y900§!. Подготовка займёт §Y35 дней§!, готовность сохранится §Y90 дней§!. Противник получит предупреждение и временный бонус оборонной подготовки. При отмене деньги не возвращаются; при изменении дипломатических условий подготовка прекращается."
 STP_pw_begin_nod_campaign: "Начать кампанию против Нодрула"
 STP_pw_begin_nod_campaign_desc: "Объявить войну по подготовленному плану. Готовность складов будет израсходована, а армия получит усиленную подготовку наступления на §Y35 дней§!."
 STP_pc_nod_campaign_ready: "Готовность к кампании против Нодрула"
 STP_pc_nod_campaign_ready_desc: "Передовые склады и транспорт готовы. Приказ о начале кампании доступен, пока действует этот дух."

 STP_pw_party_nod_military_mission: "Военная миссия Нодрула"
 STP_pw_party_nod_military_mission_desc: "Обратимся к покровителю за партией оружия из его действительных запасов. Нодрул сам решит, продавать ли нам 1000 единиц пехотного снаряжения и 100 единиц дополнительного оснащения за 450 единиц казны. Деньги спишутся только при согласованной передаче."
 STP_pw_party_domestic_pattern: "Собственный образец вооружения"
 STP_pw_party_domestic_pattern_desc: "Самостоятельный Стеландер должен содержать армию без разрешения северного покровителя. Поддержим исследования стрелкового оружия и откроем повторяемый государственный заказ на пехотное снаряжение, средства обеспечения и артиллерию."
 STP_pw_party_border_staff: "Пограничный штаб"
 STP_pw_party_border_staff_desc: "После завершения одной из двух армейских моделей создадим единый штаб внешней границы. Оборонные корпуса принесут ему устойчивую логистику, полевой штаб - оперативное планирование. Артиллерия и зенитные орудия станут материальной основой общего пограничного командования."
 STP_pw_party_southern_defence: "Подготовить южную границу"
 STP_pw_party_southern_defence_desc: "Укрепим границы подконтрольных округов на южном направлении. Регулярные пограничные учения позволят поддерживать готовность армии за отдельную плату."
 STP_postwar_nod_ultimatum: "Северный ультиматум"
 STP_postwar_nod_ultimatum_desc: "Отказ от протектората превращает отношения с Нодрулом в военный кризис. До истечения срока можно только подготовить страну к удару. Выбор между подчинением и независимостью уже сделан."
 STP_pw_party_nod_invasion_countdown: "Подготовка вторжения Нодрула"
 STP_pw_party_nod_invasion_countdown_desc: "Северный штаб стягивает части и запасы к границе. Через §R90 дней§!, если Нодрул сохраняет возможность действовать, он начнёт войну за ликвидацию независимого режима Стеландера."
 STP_pw_party_nod_emergency_mobilization: "Чрезвычайная мобилизация"
 STP_pw_party_nod_emergency_mobilization_desc: "Снять часть ограничений с набора, выдать армейским складам чрезвычайный заказ и вернуть в строй людей, демобилизованных после гражданской войны. Это дорого, но первый удар Нодрула нельзя встречать армией мирного времени."
 STP_pw_party_nod_fortify_border: "Закрыть северные проходы"
 STP_pw_party_nod_fortify_border_desc: "На всех подконтрольных участках, непосредственно граничащих с Нодрулом, инженерные части подготовят постоянные оборонительные позиции. Это не остановит вторжение само по себе, но заставит север платить за каждый проход."
 STP_pw_party_nod_staff_readiness: "Штабной план «Север»"
 STP_pw_party_nod_staff_readiness_desc: "Проведём штабную игру по единственному сценарию, который теперь имеет значение: полномасштабная война с Нодрулом. Командование получит заранее распределённые резервы, маршруты снабжения и планы отхода."
 STP_pw_party_nod_emergency_mobilization_idea: "Чрезвычайная мобилизация"
 STP_pw_party_nod_emergency_mobilization_idea_desc: "Гражданская война закончилась, но демобилизация отменена из-за угрозы северного вторжения."
 STP_pw_party_nod_staff_readiness_idea: "План обороны от Нодрула"
 STP_pw_party_nod_staff_readiness_idea_desc: "Штаб заранее подготовил оборонительные рубежи, снабжение и порядок действий при прорыве."
 STP_pw_nod_invasion_mandate: "Ликвидировать независимый Стеландер"
 STP_pw_nod_invasion_mandate_desc: "Нодрул рассматривает независимый партийный режим как нарушение послевоенного порядка и направляет основные силы на его ликвидацию. Это не ограниченная пограничная операция: северное командование должно прорвать оборону, уничтожить правительство партии и вернуть Стеландер под контроль. Капитуляция STP в этой войне завершает независимое прохождение."
 ADISCORD_STP_pc.28.t: "Последний протокол Нодрула"
 ADISCORD_STP_pc.28.d: "Ответ пришёл без обычных формул вежливости. Северное правительство не признаёт право Стеландера в одностороннем порядке выйти из прежней системы покровительства. В ноте перечислены части, которые Нодрул уже переводит к южным гарнизонам, и срок, после которого дипломатическая переписка считается исчерпанной.\n\nВ Фаде никто не притворяется, будто это ещё одни переговоры. Решение о суверенитете уже опубликовано. Теперь вопрос состоит только в том, успеет ли государство превратить несколько месяцев в укрепления, запасы и боеспособную армию."
 ADISCORD_STP_pc.28.a: "Девяносто дней. Ни одного лишнего."
 ADISCORD_STP_pc.29.t: "Нодрул пересёк границу"
 ADISCORD_STP_pc.29.d: "Срок ультиматума истёк ночью. Первые донесения пришли почти одновременно: артиллерийская подготовка на северных проходах, движение колонн к пограничным дорогам и разрыв последних линий связи между штабами. Нодрул объявил, что восстанавливает законный порядок и ликвидирует режим, отказавшийся от покровительства.\n\nДля партии это уже не очередной послевоенный спор. Поражение означает конец независимого Стеландера и самого правительства, которое пережило гражданскую войну."
 ADISCORD_STP_pc.29.a: "Теперь отступать некуда."
 ADISCORD_STP_pc.30.t: "Север отступает"
 ADISCORD_STP_pc.30.d: "Нодрульская армия больше не способна продолжать кампанию против Стеландера. Штаб противника запросил прекращение боевых действий, а северное правительство отозвало требование восстановить протекторат.\n\nНезависимость, которая девяносто дней назад существовала только в партийном постановлении, теперь подтверждена войной. После этого исхода внешнюю политику можно строить уже без оговорки о неизбежном возвращении Нодрула."
 ADISCORD_STP_pc.30.a: "Теперь это действительно наша граница."
 STP_pw_party_restore_ministries: "Восстановить работу министерств"
 STP_pw_party_restore_ministries_desc: "За 540 единиц казны и 28 дней восстановим гражданский аппарат. Результат: 75 политической власти, 5% стабильности и завершение ведомственной программы. Потеря столицы или права на восстановление отменяет заказ с полным возвратом депозита."
 STP_pw_party_reopen_port: "Восстановить портовый округ"
 STP_pw_party_reopen_port_desc: "За 1080 единиц казны и 42 дня построим гражданское предприятие в одном собственном подконтрольном округе с военно-морской базой; инфраструктура вырастет на 1, если ещё не достигла предела. Потеря всех подходящих портов, места под предприятие или столицы отменяет заказ с возвратом депозита."
 STP_pw_party_refit_guard: "Переоснастить внутренние войска"
 STP_pw_party_refit_guard_desc: "За 900 единиц казны и 49 дней получим 1600 единиц пехотного снаряжения, 120 единиц дополнительного оснащения, 100 грузовиков и 25 опыта армии. Материалы поступят в запас Стеландера для существующих частей. Отмена возвращает весь депозит."
 STP_pw_party_return_specialists: "Оплатить инженерные комиссии"
 STP_pw_party_return_specialists_desc: "Выделим 540 единиц казны на возвращение специалистов к промышленным разработкам. Две скидки на исследования ускорят восстановление технологической базы."
 STP_pw_party_security_reserve: "Собрать проверенный резерв"
 STP_pw_party_security_reserve_desc: "Выделим 540 единиц казны на сбор резервистов, прошедших партийную проверку. На 180 дней увеличатся доступный призывной резерв и скорость мобилизации."
 STP_pw_party_standard_order: "Заказать отечественное вооружение"
 STP_pw_party_standard_order_desc: "За 900 единиц казны получим 1600 единиц пехотного снаряжения, 100 единиц дополнительного оснащения и 100 артиллерийских орудий. Повторный заказ доступен через 120 дней, пока Стеландер остаётся самостоятельным."
 STP_pw_party_frontier_exercise: "Провести пограничные учения"
 STP_pw_party_frontier_exercise_desc: "За 540 единиц казны организуем учения и подготовку позиций. На 180 дней армия лучше защищает национальную территорию и быстрее окапывается. Повторные учения доступны после завершения действующей программы."
 STP_pw_party_last_purge: "Последняя кадровая чистка"
 STP_pw_party_last_purge_desc: "Проверка лояльности лишила штабы и институты опытных сотрудников. Организация армии и темп исследований временно снизились."
 STP_pw_party_security_cordon: "Проверенный партийный резерв"
 STP_pw_party_security_cordon_desc: "Средства выделены на сбор и подготовку резервистов, которых партийные органы допускают к службе."
 STP_pw_party_frontier_drill: "Пограничные учения"
 STP_pw_party_frontier_drill_desc: "Части отработали оборону национальной территории и оборудование полевых позиций."
 STP_pw_party_recovery_start_tt: "Начинаются три оплачиваемые программы: министерства, портовое хозяйство и переоснащение внутренних войск. Одновременно выполняется один заказ. Ход восстановления показан в существующей категории военного совета."
 STP_pw_party_recovery_complete_tt: "Завершены все три оплаченные программы партийного восстановления."
 STP_pw_party_guard_refitted_tt: "Завершена оплаченная программа переоснащения внутренних войск."
 STP_pw_party_restore_ministries_result_tt: "Через §Y28 дней§!: §G+75§! политической власти, §G+5%§! стабильности и завершение ведомственной программы. Отмена возвращает весь уплаченный депозит."
 STP_pw_party_reopen_port_result_tt: "Через §Y42 дня§! в одном собственном подконтрольном округе с военно-морской базой: §G+1§! гражданское предприятие, §G+1§! инфраструктура до её предела. Завершает хозяйственную программу. Отмена возвращает весь уплаченный депозит."
 STP_pw_party_refit_guard_result_tt: "Через §Y49 дней§! Стеландер получит §Y1600§! единиц £infantry_equipment_text_icon пехотного снаряжения, §Y120§! единиц £support_equipment_text_icon дополнительного оснащения, §Y100§! грузовиков и §G25§! опыта армии. Завершает армейскую программу. Отмена возвращает весь уплаченный депозит."
 STP_pw_party_nod_contract_tt: "Нодрул получит предложение: передать Стеландеру 1000 единиц пехотного снаряжения и 100 единиц дополнительного оснащения из своих запасов за 450 единиц казны. Оплата - только при согласии и наличии ресурсов у обеих сторон."
 STP_pw_party_nod_contract_settlement_tt: "Нодрул передаст Стеландеру 1000 единиц пехотного снаряжения и 100 единиц дополнительного оснащения из своих запасов. Стеландер заплатит Нодрулу 450 единиц казны. Условия и запасы повторно проверяются при принятии."
 STP_pw_party_recovery_report: "\n\n§YПрограмма президиума§!: завершено [?STP_pw_recovery_progress|0] из 3 заказов. Министерства, портовое хозяйство и переоснащение внутренних войск используют один бюджетный слот. [STPGetRecoverySlot]"
 ADISCORD_STP_pc.22.t: "Оружие для Стеландера"
 ADISCORD_STP_pc.22.d: "Военная миссия Стеландера прибыла в Нодрул с описью, составленной до последнего ящика. Регулярной армии не хватало винтовок, средств связи и имущества для частей, которые только недавно перестали быть гражданскими формированиями. Вместо просьбы о помощи делегация предложила обычную сделку.\n\nНодрулу предлагали оплату за тысячу комплектов пехотного вооружения и дополнительное армейское имущество. Для северного правительства это возможность заработать и одновременно усилить знакомый режим у южной границы. Для противников партии такая поставка будет выглядеть совсем иначе.\n\nКонтракт лежит на столе. Остаётся решить, что для Нодрула важнее сейчас: складской запас или покупатель, который всё ещё хочет быть рядом."
 ADISCORD_STP_pc.22.refuse: "Оставить оружие в наших частях."
 ADISCORD_STP_pc.22.accept: "Принять оплату и передать оружие."
 ADISCORD_STP_pc.23.t: "Победители в прежних кабинетах"
 ADISCORD_STP_pc.23.d: "В приёмной президиума снова стоят очереди. Окружные секретари привезли ведомости убытков, командиры - списки пропавшего оружия, представители домов - счета за жильё и перевозки. Кабинеты остались прежними; людей, способных отвечать за их работу, стало меньше.\n\nХедерсетт ставит перед Палатой домов три задачи: вернуть министерства к ежедневной работе, восстановить портовое хозяйство и снабдить армию, которая сможет покинуть столичные караулы. Но сначала партии предстоит решить судьбу собственных списков. Можно закрыть дела специалистов и вернуть их к станкам. Можно провести последнюю чистку - и принять последствия ещё одной потери кадров.\n\nПобеда дала президиуму время. Деньги, рабочие руки и доверие придётся искать заново."
 ADISCORD_STP_pc.23.a: "Сначала заставим государство снова работать."
 ADISCORD_STP_pc.24.t: "Ответ военной миссии"
 ADISCORD_STP_pc.24.accepted: "Нодрульские склады открыли ворота утром. Приёмщики Стеландера сверили пломбы, номера ящиков и список имущества, после чего расчётная палата подтвердила оплату. К вечеру первые грузовики ушли на юг.\n\nСделка не вернула старый протекторат и не дала Нодрулу новых полномочий. Она сделала другое: показала, что даже после войны прежняя зависимость может возвращаться не указами, а вполне добровольными контрактами. Для армии результат проще. У полков появилось оружие, которого вчера не было."
 ADISCORD_STP_pc.24.refused: "Военная миссия вернулась с теми же пустыми накладными, с которыми уехала. Нодрул не согласился открыть склады на предложенных условиях. Деньги остались в казне, но рассчитывать на быстрый внешний источник вооружения больше нельзя.\n\nВ штабе отказ встретили без скандала. После гражданской войны армия и так слишком часто строила планы вокруг того, что сосед якобы обязан предоставить. Теперь переоснащение придётся продолжать через собственные мастерские, закупки и восстановленные арсеналы."
 ADISCORD_STP_pc.24.accepted_a: "Пусть северное оружие уходит в полки."
 ADISCORD_STP_pc.24.refused_a: "Значит, перевооружимся своими силами."
 STP_pw_party_has_port_capacity: "Есть подконтрольный портовый округ с местом для гражданского предприятия"

 STP_cw_reserve_commanders: "Командиры резервных рот"
 STP_cw_reserve_commanders_desc: "Подготовим командиров и их заместителей для резервных подразделений. При расколе армия Шабрата получит более устойчивую организацию и быстрее подготовит планы операций. Обучение не требует отдельного заказа на дивизию."
 STP_cw_casualty_routes: "Маршруты эвакуации раненых"
 STP_cw_casualty_routes_desc: "Снабженцы свяжут перевязочные пункты с транспортом и местами отдыха. После раскола части Шабрата будут быстрее восстанавливать организацию между боями. Подготовленная сеть останется у сопротивления."

 STP_cw_party_command_sabotage: "Дезорганизация столичного командования"
 STP_cw_party_command_sabotage_desc: "Удар по столичному аппарату нарушил работу партийного штаба. Командиры восстанавливают управление частями и согласование планов."
 STP_cw_disruption_cells: "Боевые группы подполья"
 STP_cw_disruption_cells_desc: "Объединим связи промышленного и столичного подполья в сеть боевых групп. После раскола Шабрат сможет оплачивать операции против партийных территориальных бригад. Возможности сети ограничены: не более трёх уничтоженных соединений за гражданскую войну."
 STP_cw_disruption_cells_tt: "После раскола армия Шабрата получит решения против партийных территориальных бригад в округах Стеландера. Операция за £political_power_texticon §Y35§! и £ADISCORD_economy_treasury_texticon §Y1200§! длится §Y21 день§! и уничтожает §Yодну§! присутствующую в выбранном округе бригаду. Одновременно ведётся одна операция; между началами успешных операций - §Y45 дней§!, максимум §Yтри§! за войну. При утрате цели или завершении войны вся оплата возвращается."
 STP_cw_disrupt_brigade: "Удар подполья по гарнизону: [FROM.GetName]"
 STP_cw_disrupt_brigade_desc: "Боевые группы выведут из строя одну партийную территориальную бригаду в выбранном округе. Через 21 день соединение будет уничтожено вместе с находящимися в нём людьми и вооружением. Союзные, иностранные и прочие типы дивизий не являются целями. Если подходящая бригада уйдёт, округ сменит контролёра или война закончится, операция отменяется с полным возвратом оплаты. Успешно выполнить можно не более трёх операций за войну."
 STP_cw_disruption_available_tt: "Шабрат воюет с партией; обе стороны продолжают сопротивление; успешно завершено менее трёх операций"
 STP_cw_disruption_idle_tt: "Нет другого оплаченного удара; истекли 45 дней с начала предыдущей успешной операции"
 STP_cw_disruption_target_tt: "Округ контролирует партия; здесь находится хотя бы одна её территориальная бригада"
 STP_cw_disruption_price: "£political_power_texticon §Y35§! £ADISCORD_economy_treasury_texticon §Y1200§!"
 STP_cw_disruption_price_blocked: "£political_power_texticon §R35§! £ADISCORD_economy_treasury_texticon §R1200§!"
 STP_cw_disruption_price_tooltip: "Цена: £political_power_texticon §Y50§! и £ADISCORD_economy_treasury_texticon §Y1200§!. При отмене возвращаются обе суммы."
 STP_cw_disruption_paid_tt: "Начинается операция на §Y28 дней§! против одной партийной территориальной бригады в выбранном округе. Сеть занята; следующий успешный заказ - не раньше чем через §Y60 дней§! от текущего начала."
 STP_cw_disruption_result_tt: "При сохранении цели уничтожается §Yодна§! партийная территориальная бригада, находящаяся в этом округе. Если условия утрачены, возвращаются £political_power_texticon §Y50§! и £ADISCORD_economy_treasury_texticon §Y1200§!."
 STP_cw_disruption_refund_tt: "Возврат всей оплаты: £political_power_texticon §Y50§! и £ADISCORD_economy_treasury_texticon ранее уплаченная сумма. Сеть освобождается; лимит успешных операций не расходуется."

 # Послевоенная экономика Шабрата
 STP_pc_economy_count_the_cost:0 "Единая государственная казна"
 STP_pc_economy_count_the_cost_desc: "Гражданская война закончилась быстрее, чем бухгалтерия успела понять, какое государство осталось после неё. Районные кассы, заводские ведомости и налоговые книги должны снова описывать одну страну, а не несколько военных администраций."
 STP_pc_economy_count_the_cost_tt:0 "Доходы и расходы будут пересчитаны по всей объединённой территории. Реформы накапливаются в национальном духе послевоенной республики."
 STP_pc_economy_reopen_tax_offices:0 "Налоговая служба республики"
 STP_pc_economy_reopen_tax_offices_desc: "Во время войны сборщики исчезали вместе с архивами, а предприятия платили тому, кто контролировал ближайшую дорогу. Новая власть должна вернуть единый реестр плательщиков и отделить налоги от полевых поборов."
 STP_pc_economy_reopen_tax_offices_tt:0 "Единый реестр плательщиков превращает военные поборы в постоянный доход государства."
 STP_pc_economy_repair_workshops: "Запустить гражданские мастерские"
 STP_pc_economy_repair_workshops_desc: "Ремонтные цеха, которые вчера латали грузовики и винтовки, могут снова производить оборудование для шахт, дорог и домов. Государственный заказ должен вернуть им гражданскую работу."
 STP_pc_economy_repair_workshops_tt:0 "Гражданская фабрика строится в принадлежащем нам подконтрольном стеландском регионе со свободным местом. При отсутствии подходящего региона вместо неё поступит §G900§! в казну."
 STP_pc_economy_stabilize_currency:0 "Денежная стабилизация"
 STP_pc_economy_stabilize_currency_desc: "После месяцев военных расписок, чрезвычайных закупок и раздельных касс цена денег стала политическим вопросом. Совет министров и банки должны договориться, какие обязательства признаёт республика и чем она за них отвечает."
 STP_pc_economy_stabilize_currency_tt:0 "Инфляция: §G-8§! п.п. Давление дефицита: §G-10§! п.п. Показатели не опускаются ниже нуля."
 STP_pc_economy_recovery_budget:0 "Первый бюджет развития"
 STP_pc_economy_recovery_budget_desc: "Восстановление перестанет быть набором чрезвычайных платежей. Дороги, гражданская промышленность, местные администрации и долги получат общий бюджет, рассчитанный на несколько лет, а не на следующую неделю."
 STP_pc_economy_recovery_budget_tt:0 "Постоянные доходы, управление расходами и гражданское производство объединяются в программу долгосрочного восстановления."

 # Пропаганда восстановления и развитие страны
 STP_pc_development_country_must_live: "Страна должна жить"
 STP_pc_development_country_must_live_desc: "Победа объясняет, кто получил власть, но не объясняет, зачем людям снова строить школы, мастерские и дороги. Государственная пропаганда должна сменить язык фронта на язык восстановления: Стеланд существует не ради следующей войны, а ради жизни после неё."
 STP_pc_development_country_must_live_tt: "Рост всех направлений развития страны: §G+5%§!."
 STP_pc_development_posters_on_ruins: "Плакаты на руинах"
 STP_pc_development_posters_on_ruins_desc: "На стенах ещё видны следы обстрелов, и именно там появятся первые плакаты новой кампании. Районы будут соревноваться не числом добровольцев, а открытыми школами, работающими службами и восстановленными улицами."
 STP_pc_development_posters_on_ruins_tt: "Месячный рост общества: §G+1§!. Месячный рост государственного развития: §G+1§!. Рост общественного развития: §G+5%§!."
 STP_pc_development_rebuild_as_duty: "Восстановление как обязанность"
 STP_pc_development_rebuild_as_duty_desc: "Республика объявит восстановление такой же общественной обязанностью, какой недавно была оборона района. Инженеры, рабочие и местные администрации получат статус участников общего государственного проекта."
 STP_pc_development_rebuild_as_duty_tt: "Месячный рост экономического развития: §G+1§!. Рост экономического развития: §G+7%§!. Скорость строительства: §G+5%§!."
 STP_pc_development_engineers_on_radio: "Инженеры в эфире"
 STP_pc_development_engineers_on_radio_desc: "Вместо бесконечных речей о врагах радио будет показывать людей, которые восстанавливают электросети, мосты, больницы и производство. Компетентность должна стать частью публичного образа нового государства."
 STP_pc_development_engineers_on_radio_tt: "Месячный рост государственного развития: §G+1§!. Рост государственного развития: §G+7%§!. Скорость исследований: §G+3%§!."
 STP_pc_development_generation_reconstruction: "Поколение восстановления"
 STP_pc_development_generation_reconstruction_desc: "Если война сформировала поколение фронта, мир должен сформировать поколение восстановления. Школы, пресса и государственные программы свяжут личный успех с ростом страны, а не с принадлежностью к очередной вооружённой группе."
 STP_pc_development_generation_reconstruction_tt: "Месячный рост общества, государства и экономики: §G+1§! к каждому направлению. Рост всех направлений развития: §G+8%§!. Дополнительно рост общества, государства и экономики: §G+5%§!."

 STP_pc_development_reopen_universities: "Открыть университеты"
 STP_pc_development_reopen_universities_desc: "Военные штабы забрали лучших преподавателей, лаборатории потеряли оборудование, а часть институтов годами существовала только на бумаге. Государство вернёт университетам финансирование, помещения и право снова планировать работу дольше одного фронтового сезона."
 STP_pc_development_reopen_universities_tt: "Будет добавлена §G1 постоянная ячейка исследования§!. Скорость исследований: §G+2%§!."
 STP_pc_development_national_research_institutes: "Национальные исследовательские институты"
 STP_pc_development_national_research_institutes_desc: "Одних восстановленных университетов мало. Республика создаст сеть специализированных институтов, связанных с промышленностью, инфраструктурой и государственным планированием. Наука должна стать постоянной функцией страны, а не роскошью мирного времени."
 STP_pc_development_national_research_institutes_tt: "Будет добавлена ещё §G1 постоянная ячейка исследования§!. Скорость исследований: §G+3%§!. Рост экономического и государственного развития: §G+3%§!."

 # Активное послевоенное восстановление
 STP_postwar_reconstruction_drive: "Первый план восстановления"
 STP_postwar_reconstruction_drive_desc: "Победа завершила гражданскую войну, но не вернула стране нормальную жизнь. Правительство должно одновременно восстановить хозяйство, вернуть доверие к центру и убедить округа снова работать как части одного государства.\n\n§YТемп восстановления:§! [?STP_pw_reconstruction_momentum|0]/100\n§YОбщественное доверие:§! [?STP_pw_public_confidence|0]/100\n§YСвязность округов:§! [?STP_pw_regional_cohesion|0]/100\n\nДля завершения первого плана необходимо довести все три показателя до §Y70§!."
 STP_pw_reconstruction_emergency_repairs: "Аварийные восстановительные бригады"
 STP_pw_reconstruction_emergency_repairs_desc: "Направить казённые деньги на мосты, подстанции, железнодорожные узлы и повреждённые мастерские. За несколько недель бригады должны показать, что центральное правительство умеет не только мобилизовать, но и ремонтировать."
 STP_pw_reconstruction_district_congresses: "Съезды окружных администраций"
 STP_pw_reconstruction_district_congresses_desc: "Собрать чиновников, муниципальные советы и военных комендантов на серию окружных совещаний. Центр получит список реальных проблем, а регионы - канал влияния, который не проходит через вооружённые штабы."
 STP_pw_reconstruction_publish_war_accounts: "Опубликовать военные счета"
 STP_pw_reconstruction_publish_war_accounts_desc: "Открыть часть чрезвычайных расходов, списков реквизиций и долгов военного времени. Это болезненно для кабинета, но тишина вокруг пропавших денег разрушает доверие быстрее любых цифр."
 STP_pw_reconstruction_veteran_housing: "Жильё для демобилизованных"
 STP_pw_reconstruction_veteran_housing_desc: "Переоборудовать пустующие казармы, выделить строительные материалы и субсидировать жильё для семей, вернувшихся с фронта. У войны должно появиться видимое окончание."
 STP_pw_complete_first_reconstruction_plan: "Закрыть первый план восстановления"
 STP_pw_complete_first_reconstruction_plan_desc: "Основные службы работают, округа снова включены в общий административный контур, а общество перестало жить ожиданием новой мобилизации. Первый чрезвычайный этап можно завершить и перейти к долгосрочному развитию."

 STP_postwar_propaganda_campaigns: "Пропаганда восстановления"
 STP_postwar_propaganda_campaigns_desc: "Пропаганда после гражданской войны должна конкурировать за внимание так же, как строительные и административные программы конкурируют за деньги. Число одновременно действующих кампаний ограничено доступными пропагандистскими слотами."
 STP_pw_campaign_country_is_being_built: "«Страна строится заново»"
 STP_pw_campaign_country_is_being_built_desc: "Плакаты, хроника и местные газеты показывают не лидеров на трибунах, а ремонт дорог, ввод цехов и восстановление коммунальных служб."
 STP_pw_campaign_one_steland: "«Один Стеланд»"
 STP_pw_campaign_one_steland_desc: "Кампания подчёркивает, что линии фронта исчезли вместе с военными администрациями. Округа снова должны воспринимать друг друга как части одного государства."
 STP_pw_campaign_engineers_of_peace: "«Инженеры мира»"
 STP_pw_campaign_engineers_of_peace_desc: "Радио и кинохроника превращают инженеров, врачей и преподавателей в символы послевоенного государства. Компетентность должна стать престижнее фронтовой бравады."
 STP_pw_campaign_victory_means_normal_life: "«Победа - это нормальная жизнь»"
 STP_pw_campaign_victory_means_normal_life_desc: "Главный тезис кампании прост: победа измеряется не количеством парадов, а тем, может ли человек снова планировать работу, семью и жизнь дальше следующей недели."


 # Партийный путь: институты, тыл и восстановление
 STP_party_preparation_available_tt: "Подготовка ещё продолжается, и мы поддерживаем партию"
 STP_party_war_available_tt: "Продолжается война партии с сопротивлением; правительство не капитулировало"
 STP_party_compact_districts_tt: "Влияние партии в Новой Монаии и Крейдене: §G+15§!, если мы владеем округом, контролируем его и местная работа открыта. Чужие связи не изымаются; гарнизоны оплачиваются отдельными соглашениями."
 STP_party_compact_depots_tt: "Влияние партии в Хосхейте и Старом фадском лесу: §G+15§! при сохранении владения, контроля и доступа. Договорённости не уничтожают подпольные связи: при необходимости проведите отдельную проверку."
 STP_party_shared_stocks_tt: "Поставка поступает в общие запасы Стеландера до раскола. Неиспользованное снаряжение будет распределено между сторонами по правилам гражданской войны, а не целиком зарезервировано за партией."
 STP_party_civil_register_tt: "Влияние партии в Ниансасе и Хосхейте: §G+8§! при сохранении владения, контроля и доступа. Укрепление канцелярий не уничтожает чужие военные связи."
 STP_party_staff_retained_tt: "Улучшение штаба остаётся у партии после раскола. Оно не передаётся армии Шабрата."
 STP_party_district_compact: "Соглашение с окружными начальниками"
 STP_party_district_compact_desc: "За 50 политической власти заключим соглашение с окружными начальниками. Новая Монаия и Крейден получат по 15 влияния партии без уничтожения подпольных связей. Откроются отдельные оплачиваемые договоры с командирами, готовящие дополнительные бригады. Чрезвычайные чистки станут недоступны: удерживать округа придётся влиянием и перехватом объявленных операций."
 STP_party_treasury_3600_tt: "В общую казну поступит £ADISCORD_economy_treasury_texticon §G3600§!. До раскола эти средства можно потратить на подготовку; они не резервируются исключительно за партией."
 STP_party_budget_reserve: "Резерв президиума"
 STP_party_budget_reserve_desc: "Разместим чрезвычайный заём через министерства. Чиновникам предстоит убедить кредиторов, что государство выполнит обязательства даже в условиях политического кризиса."
 STP_party_guard_workshops: "Заказы столичного арсенала"
 STP_party_guard_workshops_desc: "Военным заводам нужны заказы, а гвардии - исправное снаряжение. Организуем выпуск стрелкового оружия, тяжёлого вооружения отделений и комплектов для штабных служб. До раскола это общие государственные запасы: их распределение определит исход политической борьбы."
 STP_party_supply_directorate: "Управление гарнизонного снабжения"
 STP_party_supply_directorate_desc: "После выбора обороны Конгресса или подвижного резерва создадим общее управление снабжения. Оно снижает расход припасов и ускоряет восстановление организации; штаб остаётся у партии при расколе."
 STP_party_civil_register: "Окружные канцелярии"
 STP_party_civil_register_desc: "Областные учреждения должны знать, какие приказы действуют и кто вправе их подписывать. Обновим реестры Ниансаса и Хосхейта, сохранив непрерывность местного управления. Это укрепит позиции партии, но не заменит работу с гарнизонами."
 STP_party_succession_protocol: "Порядок преемственности"
 STP_party_succession_protocol_desc: "До последнего дня подпись Иванова связывала ведомства лучше любого регламента. Теперь президиуму нужен порядок, который не остановится у дверей президентской палаты. Закрепим полномочия секретариата и заранее определим, кто принимает решения при потере связи со столицей."
 STP_party_war_transport: "Военные транспортные колонны"
 STP_party_war_transport_desc: "Транспорт нужен армии в первые недели войны. Единый штаб выделит ремонтные маршруты и согласует подвоз, не ожидая завершения всей арсенальной программы. Фокус открывает заказ транспорта за 2500 казны на 28 дней; деньги и исполнение остаются отдельной ответственностью правительства."
 STP_party_treasury_2400_tt: "В казну поступит §G2400§! денежных единиц."
 STP_party_rear_administration: "Вернуть управление в тыл"
 STP_party_rear_administration_desc: "Назначим ответственных за пайки, расчёты и исполнение фронтовых заявок. Тыл подчиняется действующему правительству: Конгрессу либо временному президиуму с восстановленной окружной связью. Откроем резерв в 2400 казны и укрепим гражданское управление, даже если столица ещё не возвращена."
 STP_party_war_directorate: "Оперативный директорат"
 STP_party_war_directorate_desc: "Тыловая администрация и управление резервов должны работать на одну операцию. После восстановления правительственной связи создадим директорат, который сведёт заявки частей, пополнение и планы штабов. Его создание укрепляет организацию и планирование, но не отменяет оставшиеся этапы реорганизации."
 STP_party_district_charters: "Хартии окружных организаций"
 STP_party_district_charters_desc: "Округа сохранят часть кадровых полномочий и получат понятную долю ответственности за восстановление. Взамен местные организации обязуются исполнять общий бюджет и не создавать собственные вооружённые структуры. Уступки уменьшают свободу секретариата, но делают работу на местах предсказуемее."
 STP_party_local_cadres: "Сохранить местные кадры"
 STP_party_local_cadres_desc: "Война оставила слишком мало инженеров и управляющих, чтобы оценивать каждого только по тому, чьи приказы он исполнял. Окружные организации поручатся за специалистов. Центр сохранит общие стандарты, но откажется от попытки лично утверждать каждое назначение."
 STP_party_personnel_commissions: "Кадровые комиссии президиума"
 STP_party_personnel_commissions_desc: "Чрезвычайные назначения должны превратиться в постоянную систему допуска к государственной службе. Комиссии проверят руководителей и сформируют резерв замены. Это даст центру более прямой контроль, но отрыв специалистов от работы замедлит восстановление."
 STP_party_chain_of_command: "Единая цепь подчинения"
 STP_party_chain_of_command_desc: "Хедерсетт не намерен управлять страной через бесконечные соглашения с каждым окружным секретарём. Назначения, гарнизоны и министерские распоряжения будут подчинены одной системе. Укрепление командования потребует постоянных расходов на проверку исполнения."
 STP_party_revenue_service: "Восстановить сбор доходов"
 STP_party_revenue_service_desc: "До выбора между гражданским восстановлением и оборонным заказом государству нужен общий денежный каркас. Вернём налоговые реестры, сопоставим портовые сборы с реальным оборотом и установим единый порядок расчётов. Обе экономические модели будут опираться на регулярные поступления, а не на разовые изъятия."
 STP_party_port_contracts: "Долгосрочные портовые контракты"
 STP_party_port_contracts_desc: "Гражданский приоритет должен дать казне оборот, а предприятиям - горизонт планирования. Закрепим условия складской аренды, обработки грузов и поставок сырья. Государство откажется от части немедленного контроля ради устойчивых контрактов."
 STP_party_industrial_board: "Государственный промышленный заказ"
 STP_party_industrial_board_desc: "Военный приоритет требует не разовых поставок, а согласованных производственных серий. Промышленное управление сведёт заказы армии и смежных предприятий. Выпуск вооружений вырастет, но контроль контрактов останется расходной статьёй бюджета."
 STP_party_research_council: "Совет прикладных исследований"
 STP_party_research_council_desc: "Лаборатории пережили войну по-разному. Одни продолжали работать при армии, другие потеряли людей и оборудование. Сведём уцелевшие коллективы в постоянный совет, который займётся промышленными задачами, связью и новыми технологиями."
 STP_party_technical_institutes: "Возобновить работу институтов"
 STP_party_technical_institutes_desc: "Когда министерства снова способны оплачивать штат и вести государственный заказ, можно вернуть институтам постоянные исследовательские программы. Учебные аудитории и лаборатории должны готовить следующую смену специалистов, а не только обслуживать срочные заявки ведомств."
 STP_party_ministries_restored_tt: "Завершено решение «Восстановить министерства»"
 STP_RESISTANCE_ELECTION_BRIEFING: "[STP_display_party_suspicion]\n\n§YКлючевые пороги подозрения§!\n§Y50%§!: партия может вести §Rдве районные комиссии одновременно§!.\n§Y70%§!: начинается кризисная стадия слежки; новые рискованные операции становятся особенно опасны.\n§R90%§!: Шабрат попадает в оперативные списки. До 100% ещё можно снизить подозрение.\n§R100%§!: если Шабрат ещё доступен, он §Rнемедленно арестовывается§!; уже состоявшийся арест снижением шкалы не отменяется.\n\nПри активной комиссии сначала готовьте §Yложный след§!: он занимает 7 дней и относится только к текущей проверке."
 STP_PARTY_ELECTION_BRIEFING: "[STP_display_party_suspicion]\n\n§YЗадача президиума§!\nСохраняйте подчинение округов, готовьте гарнизоны и закрепляйте результат выборов. Верность аппарата - не подозрение спецслужб: 100% верности не означает автоматического ареста Шабрата.\n\n§YТемп подполья§!\nНиже §R25%§! новая операция занимает §Y21 день§!, от §Y25%§! до §Y69%§! - §Y28 дней§!, от §G70%§! - §Y38 дней§!. Первое объявление даёт ещё §Y32 дня§! на развёртывание ответа. Изменение верности не пересчитывает уже идущий таймер.\n\n§YНаши инструменты§!\nКоллегия безопасности открывает §Y10-дневный перехват связных§!. Проверка командования занимает §Y21 день§! и уничтожает выявленные местные связи, но пустая проверка усиливает позиции Шабрата. Соглашение с командиром готовит партийный гарнизон отдельно. Расходы и свободный слот проверяйте в решении.\n\nФинансирование министров или арсеналов не закрывает базовую охрану Конгресса и управление округами.[STPGetPartyPreparationReport]"
 STP_RESISTANCE_MAP_INSTRUCTIONS: "Выбирайте крупные операции: договор с гарнизоном, снабжение или гражданское управление. Карта показывает сохранённые связи и кому достанется округ."
 STP_PARTY_MAP_INSTRUCTIONS: "Карта показывает, какие округа сохранят подчинение партии и где действует подполье. Следите за объявленной целью связных. Перехват срывает текущую операцию, проверка уничтожает местные связи, соглашение с командиром готовит гарнизон. Влияние и подготовленные части - разные результаты."
 STP_REGION_PARTY_INSPECTION_STATUS: "\n\n§YПроверка партии:§! в округе работает комиссия. Сопротивление может подготовить прикрытие или пожертвовать частью связей. Следите за результатом проверки и следующей объявленной операцией подполья."
 STP_party_form_assault_column: "Сформировать штурмовую колонну"
 STP_party_form_assault_column_desc: "Немедленно сформируем одну усиленную дивизию по неизменяемому военному шаблону. Все люди и снаряжение берутся из наших реальных резервов. Новый заказ доступен через §Y21 день§! только пока продолжается гражданская война с сопротивлением. После её завершения старые цены не используются. Шаблон усиленной дивизии партии сохраняет исходный состав до конца гражданской войны; обычный набор по нему не запрещён."
 STP_party_assault_price: "£manpower_texticon §Y7900§! £infantry_equipment_texticon §Y610§! / §Y48§! отд. / §Y30§! обесп. / £artillery_texticon §Y60§! £anti_air_texticon §Y20§!"
 STP_party_assault_price_blocked: "£manpower_texticon §R7900§! £infantry_equipment_texticon §R610§! / §R48§! отд. / §R30§! обесп. / £artillery_texticon §R60§! £anti_air_texticon §R20§!"
 STP_party_assault_price_tooltip: "£manpower_texticon §Y7900§! £infantry_equipment_texticon §Y610§! / §Y48§! отд. / §Y30§! обесп. / £artillery_texticon §Y60§! £anti_air_texticon §Y20§!\nПолная цена дивизии: 7900 человек, 610 стрелкового оружия, 48 единиц вооружения отделений, 30 обеспечения, 60 артиллерии и 20 ПВО. Политическая власть и казна не расходуются."
 STP_party_assault_ready_tt: "В резерве есть все 7900 человек и полный комплект снаряжения для одной усиленной дивизии"
 STP_party_assault_order_tt: "§GБудет сформирована одна усиленная дивизия§! из оплаченных резервов партии. Приоритет развёртывания - контролируемый округ у фронта. Частичный комплект не списывается без полной поставки."
 ADISCORD_STP_pc.25.t: "Подпись без президента"
 ADISCORD_STP_pc.25.d: "На столе секретаря лежали три одинаковые папки. Раньше все три отправились бы к Иванову, вернулись с короткой пометкой и разошлись по ведомствам. Теперь папки оставались на месте. Никто не хотел первым решить, где заканчивается исполнение президентской воли и начинается чужая власть.\n\nХедерсетт прочитал подготовленный порядок преемственности до конца. В документе не было ни обещания новой эпохи, ни торжественного объявления о конце старой. Только должности, сроки и ответственность за приказ, оставшийся без подписи. Окружные руководители должны были получить заверенные копии до следующего заседания.\n\nКогда секретарь спросил, чью печать ставить на сопроводительном письме, Хедерсетт придвинул к нему штемпель президиума. Работу следовало продолжать."
 ADISCORD_STP_pc.25.a: "Пусть печать президиума заменит подпись президента."
 ADISCORD_STP_pc.26.t: "Подписи округов"
 ADISCORD_STP_pc.26.d: "Делегации уезжали из столицы с разными чувствами. Одни считали хартии возвращением привычного порядка, другие видели в них последний удобный момент закрепить свои полномочия. Все получили один и тот же текст и свои приложения к нему.\n\nВ министерствах уже спорили, сколько исключений выдержит общий бюджет. На местах считали, сколько специалистов удастся вернуть без новых проверок. Хедерсетт оставил за президиумом право требовать результат, но согласился, что выполнять работу будут не присланные из столицы люди.\n\nПартия оставалась у власти. Теперь её единство предстояло поддерживать не только назначениями, но и соблюдением подписанных обязательств."
 ADISCORD_STP_pc.26.a: "Подпись обязывает и столицу, и округа."
 ADISCORD_STP_pc.27.t: "Одна цепь распоряжений"
 ADISCORD_STP_pc.27.d: "Реестр назначений занял половину длинного стола. Рядом лежали сведения о гарнизонах, списки уполномоченных и сводка учреждений, ещё не подтвердивших получение нового порядка. На каждом листе было место для фамилии ответственного.\n\nХедерсетт не требовал от собравшихся единодушия. Ему было нужно, чтобы распоряжение, подписанное в столице, не превращалось в предложение, пока доберётся до окружной канцелярии. Комиссии получали право заменять руководителей, ведомства - обязанность отчитываться об исполнении.\n\nК вечеру выяснилось, что для нового порядка не хватает проверяющих и что часть лучших инженеров снова отвлечена на разбирательства. Эти расходы тоже внесли в реестр. Вертикаль нужно было не только провозгласить, но и содержать."
 ADISCORD_STP_pc.27.a: "Приказ снова должен быть приказом."

