 ADISCORD_STP_cw.94.t: "Хедерсетт узурпирует власть"
 ADISCORD_STP_cw.94.d: "Распоряжение поступило в министерства прежде, чем его успели обсудить в президиуме. Ссылаясь на вооружённый раскол страны, Руфус Хедерсетт сосредоточил руководство партийным правительством в своих руках. Приказы войскам, назначения и решения о снабжении отныне должны проходить через его кабинет. Выборы отложены на неопределённый срок.\n\nНа заседании секретарь зачитал документ как уже вступивший в силу. Возражавшим предложили передать замечания письменно; подписи под распоряжением от них не требовались. К вечеру окружные канцелярии получили новые образцы приказов и требование подтвердить подчинение.\n\nОфициальное радио назвало это временной мерой ради сохранения государства. Противники Хедерсетта - узурпацией. Пока за пределами столицы формировались фронты, партийный аппарат получил единственного распорядителя власти."
 ADISCORD_STP_cw.94.a: "Приказы уже разосланы."

