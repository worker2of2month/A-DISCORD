 STP_false_trail_result_tt: "Если успеем до конца комиссии: ложный след будет готов. Влияние партии: §0+3§!."
 STP_region_operation_2_result_tt: "§Y[2.GetName]§!: гарнизон и администрация сопротивления. Влияние сопротивления: §C+15§!. Подозрения: §R+7§!. Сохранившийся договор даёт плацдарм и две оплачиваемые бригады, если округ действительно перейдёт. Комиссия может сорвать переход; эвакуация офицеров сохранит части без местного плацдарма."
 STP_region_operation_3_result_tt: "§Y[3.GetName]§!: склад снабжения. Влияние сопротивления: §C+6§!. Подозрения: §R+5§!."
 STP_region_operation_29_result_tt: "§Y[29.GetName]§!: гарнизон и администрация сопротивления. Влияние сопротивления: §C+15§!. Подозрения: §R+8§!. Сохранившийся договор даёт плацдарм и две оплачиваемые бригады, если округ действительно перейдёт. Комиссия может сорвать переход; эвакуация офицеров сохранит части без местного плацдарма."
 STP_region_operation_45_result_tt: "§Y[45.GetName]§!: администрация сопротивления. Влияние сопротивления: §C+12§!. Подозрения: §R+4§!."
 STP_region_operation_46_result_tt: "§Y[46.GetName]§!: склад снабжения. Влияние сопротивления: §C+8§!. Подозрения: §R+6§!."
 STP_region_operation_53_result_tt: "§Y[53.GetName]§!: диверсионная группа с оплаченными £infantry_equipment_texticon §Y240§! винтовками. Влияние сопротивления: §C+6§!. Подозрения: §R+10§!."
 STP_cw_sabotage_capital_result_tt: "Если партия сохранит §Y[28.GetName]§! при расколе: повреждение §Y2§! уровней инфраструктуры и §Y1§! военного завода; на §Y70 дней§! организация её армии §R-15%§!, скорость планирования §R-25%§!. Если округ достанется сопротивлению, здания сохранятся. Влияние сопротивления §G+8§!, подозрения §R+12§!."
 STP_cw_sabotage_industry_result_tt: "Если партия сохранит §Y[29.GetName]§! при расколе: повреждение §Y2§! гражданских предприятий; на §Y70 дней§! объём военного производства §R-20%§!, предельная эффективность производства §R-15%§!. Если округ достанется сопротивлению, предприятия сохранятся. Влияние сопротивления §G+6§!, подозрения §R+10§!."
