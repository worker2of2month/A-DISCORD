 STP_ps_val_pressure: "Давление на посредников"

 STP_ps_val_pressure_work: "Давление на посредников - исполнение"

 STP_ps_val_pressure_desc: "Цена: 1500 казны. Срок: 21 дней. Пауза после завершения: 60 дней. При утрате условий незавершённый депозит возвращается."

 STP_ps_val_pressure_work_desc: "Зарезервировано 1500 казны. Результат выдаётся только при сохранении условий программы; отмена возвращает депозит один раз."


 STP_ps_val_departure: "Подготовка поставки Кефрейта"

 STP_ps_val_route_wait: "Ожидание открытого сухопутного пути"

 STP_ps_opposition_preparation_second: "Вторая окружная операция подполья"

 STP_ps_opposition_preparation_second_desc: "Отдельная цель, отдельный срок. Операция сначала формирует администрацию, затем закрепляет влияние и военную подготовку. Срыв другого округа не отменяет этот цикл."

 STP_ps_interrupt_opposition_second: "Сорвать вторую окружную операцию"

 STP_ps_interrupt_opposition_second_desc: "Ответ относится к отмеченному округу второй операции. Награда - её срыв и местное влияние; повторяющийся прирост верности не выдаётся."

 STP_ps_district_rebuild_cost: "£ADISCORD_economy_treasury_texticon §Y4000§!"

 STP_ps_district_rebuild_cost_blocked: "£ADISCORD_economy_treasury_texticon §R4000§!"

 STP_ps_district_rebuild_cost_tooltip: "£ADISCORD_economy_treasury_texticon §Y4000§!"

 STP_ps_district_rebuild: "Окружная промышленная реконструкция"

 STP_ps_district_rebuild_desc: "4000 казны, 56 дней: один гражданский завод в выбранном округе. Требуются контроль и место под строительство. Один оплаченный округ за раз; потеря условий возвращает депозит. Аварийный кабинет остаётся отдельной операцией."
 STP_ps_exile_formation_cost: "£ADISCORD_economy_treasury_texticon §Y1800§!; £manpower_texticon §Y6000§!; £infantry_equipment_texticon §Y600§!"
 STP_ps_exile_formation_cost_blocked: "£ADISCORD_economy_treasury_texticon §R1800§!; £manpower_texticon §R6000§!; £infantry_equipment_texticon §R600§!"
 STP_ps_exile_formation_cost_tooltip: "£ADISCORD_economy_treasury_texticon §Y1800§!; £manpower_texticon §Y6000§!; £infantry_equipment_texticon §Y600§!"

 STP_ps_exile_formation: "Сформировать эмигрантскую бригаду"

 STP_ps_exile_formation_work: "Сформировать эмигрантскую бригаду - исполнение"
 STP_ps_exile_formation_desc: "1800 казны, 6000 человек и 600 винтовок резервируются до доставки через 28 дней. Результат - одна бригада из шести территориальных батальонов. При отмене возвращаются все три ресурса."

 STP_ps_exile_formation_work_desc: "Зарезервировано 1800 казны. Результат выдаётся только при сохранении условий программы; отмена возвращает депозит один раз."

 STP_ps_exile_formation_result_tt: "Бригада из шести территориальных батальонов: 1800 казны, 6000 человек и 600 винтовок резервируются до доставки через 28 дней. Отмена возвращает все три ресурса."

 STP_ps_transport_idea_desc: "Временная оплаченная транспортная служба армии."

 STP_ps_route_guard_idea_desc: "Охрана действующего сообщения Конгресс - Ниансанс."

 STP_ps_reserve_idea_desc: "Оплаченная подготовка и восстановление действующих частей."

 STP_ps_engineers_idea_desc: "Иностранные специалисты работают только во время северной войны."

 STP_ps_expedition_idea_desc: "Оплаченный резерв снабжения вступивших в войну войск."

 STP_ps_defence_dynamic_desc: "Наступательные возможности возвращаются в три этапа: связь, снабжение и подготовка наступления. Оборонительная огневая мощь этим ограничением не снижается."

 STP_ps_nodes_dynamic_desc: "Потеря Конгресса замедляет планирование; потеря Ниансанса ограничивает движение армии. Возврат провинции снимает её текущий штраф."

 STP_ps_empty: ""

 STP_ps_war_report: "\n\n§YПартийная оборона§!\nЭтап: [?STP_ps_stage|0]/4. 1 - связь, 2 - снабжение, 3 - наступательная подготовка, 4 - управление восстановлено.\n[STPGetPartyGovernment]\nРезерв текущего этапа: £ADISCORD_economy_treasury_texticon [?STP_ps_reorg_deposit|0]. Сохранено при паузе: [?STP_ps_paused_days|0] дней. Срок работающего этапа показан в его миссии."

 STP_ps_congress_held: "Правительство работает в Конгрессе."

 STP_ps_cabinet_operating: "Работает резервный кабинет. Конгресс потерян; его функции восстановлены не полностью."

 STP_ps_government_lost: "Нет действующего правительства: реорганизация приостановлена. Доступен бесплатный аварийный кабинет."

 STP_ps_handoff_disabled: "Поражение партии не переводит игрока в Нодрул."


 STP_ps_asylum_accepted: "Убежище согласовано."

 STP_ps_asylum_unconfirmed: "Убежище не подтверждено или принимающая страна недоступна."




 STP_ps_exile_desc: "Организация действует в Нодруле с согласия принимающего правительства. Армия и казна Нодрула не копируют ресурсы проигравшей партии. Верность уцелевшего аппарата при вывозе: [?STP_ps_exile_loyalty|0]. Возвращение требует принятия зависимости и действительной военной победы."

 STP_ps_program_available_tt: "Программа открыта для текущей фазы; правительство и получатель доступны, канал не занят и завершена необходимая подготовка. Дополнительные условия указаны в описании."
 STP_ps_asylum_title: "Гарантии убежища"
 STP_ps_asylum_desc: "Стеландер просит договориться о поражении ещё до того, как оно произошло. В случае краха партийной армии Нодрул должен открыть границу для уцелевшего руководства, связных и части архивов, чтобы политическая организация смогла пережить потерю собственной территории.\n\nВ документе специально оговорено то, что обычно оставляют за скобками. Эмигранты не получают власть в Нодруле, не командуют его армией и не превращают убежище в автоматическое обязательство начинать войну за их возвращение. Нодрул предоставляет крышу. Всё остальное останется отдельным решением."
 STP_ps_asylum_accept: "Гарантировать убежище."
 STP_ps_asylum_decline: "Не принимать этих обязательств."
 STP_ps_nod_route_wait: "Ожидание северного маршрута"
 STP_ps_nod_route_wait_desc: "Нужна связанная сухопутная граница с Нодрулом либо Нижний рынок и действующий порт Нодрула. До отправки весь резерв можно вернуть. Потеря порта не блокирует пригодный сухопутный маршрут."
 STP_ps_return_council_name: "Временный партийный совет"
 STP_ps_return_council_desc: "Коллегия уцелевших представителей партии, сформированная после возвращения при поддержке Нодрула."
 STP_ps_preparation_report: "\n\n§YПравительственная подготовка§!\nСвязь и резервный штаб сокращают первые этапы реорганизации. [STPGetPartyAsylum] [STPGetPartyHandoff]\nЭвакуационный резерв: £ADISCORD_economy_treasury_texticon [?STP_ps_evacuated_money|0].\nСевер: [STPGetNodStatus]. Зарезервировано для NOD: £ADISCORD_economy_treasury_texticon [?STP_ps_nod_receipt_money|0].\nПоставки Кефрейта: разведка и перехват относятся к одному отправлению; без наземного маршрута оно остаётся у отправителя."


 STP_pc_investment_development_fund:0 "Инвестиционный бюджет республики"
 STP_pc_investment_development_fund_desc:0 "Откроем долгосрочное финансирование крупных промышленных программ. Государственные банки и предприятия согласуют инвестиции и поставки оборудования."
 STP_pc_investment_precision_industry:0 "Вернуть точное производство"
 STP_pc_investment_precision_industry_desc:0 "Точные станки определяют качество всей производственной цепи. Соберём единый заказ на оборудование и подготовим предприятия к его установке."
 STP_pc_investment_special_metallurgy:0 "Материальная база восстановления"
 STP_pc_investment_special_metallurgy_desc:0 "Редкие сплавы и электронные компоненты требуют устойчивого снабжения. Единые стандарты поставок свяжут собственные заводы и внешние закупки с реальными потребностями промышленности."
 STP_pc_investment_automation:0 "Автоматизация республиканских заводов"
 STP_pc_investment_automation_desc:0 "Согласуем программу автоматизации. Новые производственные линии свяжут отдельные цеха в единый технологический процесс."
 STP_pc_investment_logistics:0 "Механизация государственного снабжения"
 STP_pc_investment_logistics_desc:0 "Промышленности нужны надёжные перевозки. Обновим грузовой транспорт и защищённые железнодорожные составы, чтобы связать предприятия с поставщиками."
 STP_pc_investment_computing:0 "Республиканский вычислительный комплекс"
 STP_pc_investment_computing_desc:0 "Исследовательские учреждения и государственный аппарат получат общую вычислительную сеть. Инженеры смогут объединить разрозненные данные и расчёты."
 STP_pc_investment_defense_orders:0 "Особые заказы республиканской армии"
 STP_pc_investment_defense_orders_desc:0 "Согласуем с предприятиями серийный выпуск разведывательных машин и боевых платформ. Военные специалисты подготовят единые требования к новой технике."
 STP_pc_investment_export_finance:0 "Банк промышленного экспорта"
 STP_pc_investment_export_finance_desc:0 "Переход от разовых сделок к экспортному финансированию даст предприятиям предсказуемые расчёты. Доходы от внешней торговли должны поддерживать следующую волну инвестиций."
 STP_pc_investment_integrated_economy:0 "Экономика второго восстановления"
 STP_pc_investment_integrated_economy_desc:0 "Объединим точное производство, транспорт и вычислительные мощности в единую систему. Предприятия будут согласовывать снабжение и развитие всей производственной цепи."

 STP_occidia_prepare_invasion:0 "Вернуть Окцидию"
 STP_occidia_prepare_invasion_desc:0 "Кефрейт оставил горную республику вне своей власти. Если после окончания гражданской войны прошло 90 дней, победивший Стеландер может заняться возвращением Окцидии. Подготовка займёт 21 день; затем начнётся война за присоединение республики. Действующие гарантии и республиканская хартия исключают нападение."
 STP_occidia_invasion_available_tt:0 "Прошло не менее 90 дней после окончания гражданской войны. Мы победили, независимы, не воюем и не состоим в альянсе. Окцидия независима, соседствует с нами, не воюет и не состоит в альянсе. Ни у одной из сторон нет действующих гарантий или республиканской хартии. Кефрейт ещё не мобилизуется и не вступил в окцидскую войну."
 STP_occidia_prepare_invasion_tt:0 "Через §Y21 день§! начнётся война против §Y[SRP.GetName]§!. До завершения подготовки Кефрейт не сможет начать собственное вмешательство. При победе республика будет присоединена; её армия не переходит под наше командование. Изменение условий отменяет подготовку без возврата политических затрат."
 STP_occidia_invasion_warning:0 "Стеландер готовит вторжение"
 STP_occidia_invasion_warning_desc:0 "Победитель стеландской гражданской войны готовится присоединить нашу республику. На развёртывание обороны остаётся 21 день с начала подготовки."
 STP_ps_government_operational_tt: "Правительство действует в Конгрессе или во временном кабинете."
 STP_ps_staff_recovery_tt: "Завершён первый этап реорганизации командования."
 STP_ps_counterattack_ready_tt: "Завершены три этапа реорганизации; правительство действует."
 STP_ps_congress_fell_tt: "Бронзовый конгресс был потерян во время этой гражданской войны."

 NOD_cw_accept_northern_defeat:0 "Признать поражение в северной войне"
 NOD_cw_accept_northern_defeat_desc:0 "Продолжение северной войны грозит полным крахом. Мы можем принять условия поражения до капитуляции страны."
 NOD_cw_accept_northern_defeat_available_tt:0 "Северная война продолжается не менее §Y90 дней§!, прогресс нашей капитуляции составляет не менее §Y70%§!. Нодрул ещё не капитулировал и воюет со всеми тремя участниками северной коалиции."
 NOD_cw_accept_northern_defeat_effect_tt:0 "Применяются условия поражения Нодрула в северной войне: мир с северной коалицией, передача принадлежащих нам областей §Y[17.GetName]§! и §Y[18.GetName]§! независимой §Y[YPR.GetName]§!, если она существует. Подчинённая нам §Y[AIN.GetName]§! также выходит из этой войны. Поражение закрывает путь северной интервенции. Остальные войны продолжаются."

 STP_ps_return_available_tt: "В Нодруле действует партийный комитет, приняты условия возвращения, завершены военная подготовка и фокус кампании. Стеландер ещё не восстановлен. Шабрат не капитулировал, не состоит с Нодрулом в одном альянсе и не является его подчинённым. Кампания ещё не начата и не завершена."

 STP_party_district_survey_tt: "В доступном Ниансасе: §G+10§! влияния партии. Подготовка сопротивления сохраняется."

 STP_party_mobile_reserve_tt: "При расколе партия дополнительно попробует оплатить §Y2 бригады§! из своей доли запасов: всего £manpower_texticon §Y12000§! и £infantry_equipment_texticon §Y1200§!. Неоплаченные части не появятся. Указанная наступательная подготовка действует §Y35 дней с начала боёв§!."

 STP_ps_asylum_scope_tt: "Соглашение касается убежища для партийного руководства и вывезенных средств. Управление Нодрулом игроку не передаётся."
 STP_cw_northern_call_blocked_tt:0 "Нодрул не может призывать Стеландер к войне, пока продолжается северная война."

 STP_pw_take_bezhaysk:0 "Взять Бежайск"
 STP_pw_take_bezhaysk_desc:0 "Гражданская война окончена, а армия вновь получила единое командование и снабжение. Теперь мы можем подготовить поход на Бежайск. Штаб определит направления наступления; приказ о переходе границы будет отдан отдельным решением."
 STP_pw_launch_bezhaysk_operation:0 "Начать наступление на Бежайск"
 STP_pw_launch_bezhaysk_operation_desc:0 "План операции готов. Отдать войскам приказ перейти границу и захватить столичное владение Бежайск. Это решение немедленно начинает войну."
 STP_pw_bezhaysk_available_tt:0 "Шабрат победил в гражданской войне, независим и находится в мире. Бежайск существует, независим, не капитулировал, владеет своим столичным регионом и контролирует его; наши страны не состоят в одном альянсе."
 NOD_cw_northern_push:0 "Срок северного наступления"
 NOD_cw_northern_push_desc:0 "Ударная группировка располагает запасами для §Y70 дней§! наступления с начала северной войны. Отсчёт не зависит от событий в Стеландере.\n\nЕсли к концу срока война хотя бы с одним из северных противников продолжается, наступательный бонус сменится духом §R«Застрявшая армия»§!: атака -10%, скорость дивизий -10%, расход снабжения +10%. Окончание северной войны или капитуляция Нодрула снимает эти эффекты."
 NOD_cw_stalled_army:0 "Застрявшая армия"
 NOD_cw_stalled_army_desc:0 "Северная кампания пережила свои первоначальные запасы. Подвоз отстаёт от частей, дороги забиты, а наступление потеряло темп. Штраф действует, пока продолжается война с Юборой, Лесом или Фронтиром."
 NOD_cw_stalled_army_tt:0 "Если северная война ещё продолжается, §Y«Северное наступление Нодрула»§! сменится духом §R«Застрявшая армия»§! до её окончания: атака -10%, скорость -10%, расход снабжения +10%."
 STP_cw_organize_underground:0 "Поднять партийный тыл"
 STP_cw_organize_underground_desc:0 "Разведчики восстановят связь с местными сторонниками Шабрата. Каждый ещё удерживаемый партией округ сможет один раз поднять вооружённую ячейку за счёт наших людей и оружия. Такие отряды нарушат тыловое сообщение, но без поддержки фронта рискуют оказаться в окружении."
 STP_cw_raise_rear_cell:0 "Поднять восстание в регионе [FROM.GetName]"
 STP_cw_raise_rear_cell_desc:0 "Оплатить и немедленно развернуть в партийном тылу одну ячейку из двух территориальных батальонов: £manpower_texticon §Y2000§!, £infantry_equipment_texticon §Y200§! и £pol_power §Y35§!. Отряд принадлежит Шабрату, получает полное начальное вооружение и 20% опыта.\n\nКаждый из шести районов доступен один раз, пока им владеет и управляет партия. Отряд появляется на вражеской территории; окружение и снабжение остаются реальной угрозой. После окончания гражданской войны новые восстания недоступны."
 STP_cw_rear_cell_target_tt:0 "Партия по-прежнему контролирует выбранный район."
 STP_cw_rear_cell_result_tt:0 "В выбранном районе немедленно появится §Y1 отряд из 2 территориальных батальонов§! Шабрата, с полным личным составом и вооружением. Из наших запасов списываются 2000 человек, 200 винтовок и 35 политической власти. Повторное восстание в этом районе недоступно."
 STP_cw_rear_cell_cost:0 "£pol_power §Y35§!  £manpower_texticon §Y2000§!  £infantry_equipment_texticon §Y200§!"
 STP_cw_rear_cell_cost_blocked:0 "£pol_power §R35§!  £manpower_texticon §R2000§!  £infantry_equipment_texticon §R200§!"
 STP_cw_rear_cell_cost_tooltip:0 "Для восстания нужны 35 политической власти, 2000 свободных людей и 200 винтовок. Все ресурсы списываются один раз при создании отряда."
 STP_cw_operation_success_tt:0 "Цель текущей операции захвачена. Армия получит временный бонус, затем штаб определит следующую цель, если осталось меньше трёх завершённых операций."
 STP_cw_operation_timeout_tt:0 "Цель не взята за 49 дней. Армия получит временный штраф. Окончание гражданской войны отменяет незавершённую операцию без штрафа."
 STP_cw_operation_cancel_tt:0 "Операция отменяется без штрафа, если гражданская война завершилась или сопротивление капитулировало."

 STP_pw_party_nod_emergency_mobilization_cost:0 "£pol_power §Y50§! £ADISCORD_economy_treasury_texticon §Y900§!"
 STP_pw_party_nod_emergency_mobilization_cost_blocked:0 "£pol_power §R50§! £ADISCORD_economy_treasury_texticon §R900§!"
 STP_pw_party_nod_emergency_mobilization_cost_tooltip:0 "£pol_power §Y50§! £ADISCORD_economy_treasury_texticon §Y900§!"
 STP_pw_party_nod_fortify_border_cost:0 "£pol_power §Y35§! £ADISCORD_economy_treasury_texticon §Y1080§!"
 STP_pw_party_nod_fortify_border_cost_blocked:0 "£pol_power §R35§! £ADISCORD_economy_treasury_texticon §R1080§!"
 STP_pw_party_nod_fortify_border_cost_tooltip:0 "£pol_power §Y35§! £ADISCORD_economy_treasury_texticon §Y1080§!"
 STP_pw_party_nod_staff_readiness_cost:0 "£pol_power §Y35§! £ADISCORD_economy_treasury_texticon §Y720§!"
 STP_pw_party_nod_staff_readiness_cost_blocked:0 "£pol_power §R35§! £ADISCORD_economy_treasury_texticon §R720§!"
 STP_pw_party_nod_staff_readiness_cost_tooltip:0 "£pol_power §Y35§! £ADISCORD_economy_treasury_texticon §Y720§!"
 STP_party_services_delivered_tt:0 "Восстановлены министерства: завершено решение «Восстановить министерства»."
 STP_party_industry_delivered_tt:0 "Завершено восстановление порта и промышленного снабжения."
 STP_party_district_consent_tt:0 "Поддержка Боронов не ниже 50; при довоенном соглашении с окружными начальниками достаточно 35. Поддержку можно восстановить переговорами с фракцией."
 STP_party_central_consent_tt:0 "Поддержка Службы безопасности не ниже 50; после довоенного назначения чрезвычайных уполномоченных достаточно 35. Поддержку можно восстановить переговорами с фракцией."
 STP_party_commercial_consent_tt:0 "Поддержка Торговцев не ниже 45. Переговоры с ними ослабляют поддержку Службы безопасности."
 STP_party_military_consent_tt:0 "Поддержка Армейского командования не ниже 45. Переговоры с ним ослабляют поддержку Нодрульских советников."
 ADISCORD_STP_pc.26.b:0 "Передать съезду оплаченный хозяйственный секретариат."
 ADISCORD_STP_pc.27.b:0 "Оплатить постоянную комиссию ведомственного контроля."
 STP_party_settlement_26_tt:0 "Из казны будет списано 540. Поддержка Боронов и Торговцев: +8; Службы безопасности: -12. Влияние фракций не меняется. Выбранный окружной курс сохраняется."
 STP_party_settlement_27_tt:0 "Из казны будет списано 540. Поддержка Службы безопасности и Консерваторов: +8; Боронов: -12. Влияние фракций не меняется. Выбранная вертикаль управления сохраняется."

 ADISCORD_STP_cw.80.frontier_subject:0 "Северный оборонительный союз потерпел поражение. Нодрул ликвидировал правительство Культа Детей Леса и установил зависимую администрацию в исторических границах Юбории. Вольный Фронтир также капитулировал: его государство сохранилось, но перешло под власть Нодрула.\n\nСеверная кампания завершилась появлением новых зависимых стран и прямых нодрульских владений. Сохранившиеся местные учреждения обязаны выполнять условия победителя. Нодрульское командование получает возможность перебросить освободившиеся силы на юг."

# Campaign briefing
 STP_startup_country:0 "§YСТЕЛАНДЕР В 2160 ГОДУ§!\n\nСтеландер пережил почти бесконечную войну с Воркерландом и сохранил собственный флаг, но мир изменил страну не меньше, чем бомбардировки. Нодрулская гедонистическая революция пришла сюда через деньги, советников и местных союзников; после Фадского пакта Стеландер стал зависимым §Yтеневым государством Нодрула§!.\n\n§YПётр Иванов и партия§!\nИванов — человек, остановивший налёты и превративший мир в основу режима. За ним выросла Палата Высших Домов: она обещает личную свободу и невмешательство, но Высшие Дома контролируют лицензии, порты, медиа и доступ к богатству. За курортной витриной существуют бедные горные районы, политическая зависимость и Нижний рынок — сеть торговли людьми и фактического рабства, защищённая связями внутри аппарата.\n\n§YМаксим Шабрат§!\nШабрат возглавляет сопротивление и хочет сломать партийную монополию, вскрыть архивы режима и вернуть стране право самой определять своё будущее. Его сеть опирается на районы, чиновников, шахтёров, бывших военных и часть офицеров. Голосов недостаточно: ему нужны работающие администрации, оружие и договорённости с армией.\n\n§YКризис преемственности§!\nИванов тяжело болен. Когда его личный авторитет исчезнет, партия, сопротивление и внешние покровители будут бороться уже не за пост президента, а за саму конструкцию государства."
 STP_startup_guide:0 "§YКТО ТАКОЙ МАКСИМ ШАБРАТ§!\n\nШабрат — не глава готового альтернативного правительства и не полевой диктатор с собственной армией. Он координатор сопротивления, который связывает память высокогорья о войне с современными преступлениями партии. Его сеть держится на районных активистах, чиновниках, шахтёрах, водителях, бывших сапёрах и офицерах, готовых перейти на другую сторону.\n\n§YКак играть кризис.§! После первых вводных фокусов вы выберете, кого поддерживать. За Шабрата придётся одновременно наращивать легитимность, создавать районные администрации, готовить снабжение и искать офицеров. За партию — удерживать аппарат, подавлять сеть сопротивления и обеспечивать лояльность силовиков.\n\nВыборы дают мандат, но не гарантируют мир. Следите за активными миссиями, готовностью районов и внешними державами: Нодрул защищает свой мандат, а Кефрейт готов превратить помощь одной из сторон в контрактные права. Итоговый строй определяется тем, кто победит и какие институты переживут раскол."
 STP_startup_guide_history_title:0 "От войны к революции"
 STP_startup_guide_history:0 "§YКАК ПОЯВИЛСЯ СОВРЕМЕННЫЙ СТЕЛАНДЕР§!\n\nДо режима Иванова страна называла себя Стеландом: союзом горных общин, городов и военных объединений, десятилетиями сдерживавших экспансию Воркерланда. Сопротивление спасло страну от прямого завоевания, но превратило мобилизацию, дефицит и воздушные тревоги в обычную жизнь.\n\nНа этом фоне в Нодруле произошла гедонистическая революция. Союз аристократии, богатых домов и привилегированных гильдий заменил старый порядок обещанием личной свободы, потребления и права не участвовать в политике. После победы Нодрул начал экспортировать эту модель.\n\nВ Стеланде переворот поддержали нодрулские деньги, пропаганда, посредники и часть местной элиты. Решающее преимущество дала не только внешняя сила: население было готово принять почти любой порядок, который обещал закончить войну. Поэтому гедонистический режим смог представить импортированную революцию как национальное спасение."
 STP_startup_guide_nodrul_title:0 "Иванов и Нодрул"
 STP_startup_guide_nodrul:0 "§YПОЧЕМУ МЫ ЗАВИСИМ ОТ НОДРУЛА§!\n\nПётр Иванов построил легитимность на одном результате: Фадский пакт остановил воркерландские налёты. За мир Стеландер разоружил часть старых горных союзов, открыл порты, принял торговые уступки и допустил нодрулских советников, юристов и политические миссии.\n\nТак возник §Yтеневой мандат§!. Нодрул не управляет каждым министерством напрямую. Зависимость встроена глубже: кредиты, признание, партийные школы, медиа, консультанты и часть элитных кадров связаны с северным покровителем. Стеландер формально имеет правительство и армию, но внешняя опора режима и его политический язык находятся в нодрулской системе.\n\nИванов был идеальным посредником. Его авторитет делал уступки похожими на цену мира, а не на подчинение. Поэтому его болезнь опасна для Нодрула не меньше, чем для партии: после смерти президента «добровольность» мандата придётся доказывать уже без человека, который его создал."
 STP_startup_guide_party_title:0 "Партия и Нижний рынок"
 STP_startup_guide_party:0 "§YЧТО СКРЫВАЕТ ВИТРИНА ПАРТИИ§!\n\nПалата Высших Домов обещает свободу частной жизни, дешёвые удовольствия и государство, которое не задаёт лишних вопросов. Для многих это реальное улучшение после поколений войны — именно поэтому режим нельзя свести только к страху.\n\nНо богатство распределено крайне неравномерно. Высшие Дома и гильдии держат лицензии, порты, шахты и выгодные контракты; столица и курорты растут быстрее высокогорья, где закрываются школы и не хватает собственных специалистов. Партия всё чаще импортирует кадры из Нодрула вместо развития местных институтов.\n\nСамая тёмная часть системы — §YНижний рынок§!: сеть клубов, складов, агентств, фиктивных контрактов и частной охраны, через которую проходят похищенные люди, принудительный труд и торговля детьми. Это фактическое рабство, прикрытое коммерческой бюрократией. Часть полиции и чиновников защищает сеть, потому что общий архив платежей способен показать не отдельное преступление, а карту всего режима."
 STP_startup_guide_shabrat_title:0 "Шабрат и кризис"
 STP_startup_path_0_title:0 "Курс Шабрата"
 STP_startup_path_1_title:0 "Партийный курс"
 STP_startup_path_0:0 "§YКУРС ШАБРАТА§!\n\nСопротивление добивается власти через общественную поддержку, работу в районах и договорённости с военными. Его положение определяется не только итогом голосования, но и тем, какие учреждения и формирования переживут подготовительный период.\n\nЭтот маршрут требует распределять ограниченные ресурсы между политической кампанией и реальной военной готовностью. Сильный мандат помогает, но не заменяет работающую администрацию и надёжное командование.\n\nПодробности особого исхода выборов доступны по кнопке раскрытия условий."
 STP_startup_path_1:0 "§YПАРТИЙНЫЙ КУРС§!\n\nСохраните власть партии после ухода лидера, на котором держался старый порядок. Районный аппарат, безопасность и армейское командование становятся опорой в борьбе с сопротивлением.\n\nПолитическая победа даёт мандат, однако не устраняет вооружённый конфликт. Подготовка должна обеспечить войскам людей, оружие и устойчивые позиции к моменту раскола.\n\nЭто борьба за сохранение государства и партийного контроля; дальнейший курс определяется событиями и доступными после войны фокусами."
 STP_startup_path_0_details:0 "§YШАБРАТ: УСЛОВИЯ ОСОБОГО ИСХОДА§!\n\nОграниченное партийное восстание требует одновременно:\n- выбранной стороны Шабрата и его доступности без ареста;\n- легитимности не ниже 80%;\n- действующего публичного соглашения с командованием;\n- доступного, не арестованного Равеля и подготовленного гарнизона в [2.GetName] или [29.GetName];\n- собственных, контролируемых администраций сопротивления в [2.GetName] и [3.GetName], непрерывно работающих более 20 дней.\n\nУсловия проверяются при подведении итогов выборов. Обычная победа этого исхода не гарантирует. Провал одного условия сохраняет отдельные результаты подготовки, но оставляет большой военный раскол.\n\nСеверный сосед готовит вмешательство отдельно; мир на его фронте ещё не означает немедленное вступление."
 STP_startup_path_1_details:0 "§YПАРТИЯ: ВЫБОРЫ И ГРАЖДАНСКАЯ ВОЙНА§!\n\nПартийная победа определяет мандат, а не отменяет гражданскую войну. До развязки используйте доступные партийные решения и проверяйте готовность районов и армии.\n\nРезультаты местной подготовки влияют на распределение территорий, запасов и войск. Политический перевес не следует считать оплатой новых формирований.\n\nСюжетный выбор стороны и создание участников войны — отдельные этапы. Читайте предложение перехода к новой стране перед ответом: дальнейшая кампания и получатель подготовленных сил зависят от него.\n\nНе считайте внешнюю помощь автоматической. Вмешательство соседей зависит от их собственного положения и условий событий."
