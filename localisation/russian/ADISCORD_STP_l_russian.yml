 STP_ps_val_intercept: "Перехватить известный сухопутный маршрут"

 STP_ps_val_intercept_work: "Перехватить известный сухопутный маршрут - исполнение"

 STP_ps_val_intercept_desc: "Цена: 1200 казны. Срок: 14 дней. Пауза после завершения: 0 дней. При утрате условий незавершённый депозит возвращается."

 STP_ps_val_intercept_work_desc: "Зарезервировано 1200 казны. Результат выдаётся только при сохранении условий программы; отмена возвращает депозит один раз."

