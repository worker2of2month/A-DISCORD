 STP_cw_agree_with_commander: "Договориться с командиром: [FROM.GetName]"
 STP_cw_agree_with_commander_desc: "За £political_power_texticon §Y45§! и £command_power_texticon §Y20§! командир за §Y14 дней§! подготовит людей для двух дополнительных партийных бригад. Переговоры не считаются обыском и не меняют легитимность; подпольные связи сохранятся. При расколе части появятся в подконтрольных партии регионах, если округ останется за ней и хватит людей и оружия. Операция занимает один слот подготовки; потеря контроля или блокировка округа прерывает переговоры."
 STP_cw_commander_agreement_tt: "Если округ останется у партии, подготовим две дополнительные бригады. Люди для них резервируются до общего распределения. На каждую часть нужны £manpower_texticon §Y4000§! и £infantry_equipment_texticon §Y320§! из партийных запасов. Связи подполья сохраняются."
 STP_cw_evacuate_garrison_officers: "Вывести офицеров в Абилию"
 STP_cw_evacuate_garrison_officers_desc: "За £political_power_texticon §Y35§! и §Y7 дней§! выведем связанных с нами офицеров из округа, который проверяет комиссия. Местные гарнизонные связи исчезнут, зато кадры сохранятся для двух дополнительных бригад. При расколе части можно будет сформировать в собственных подконтрольных регионах сопротивления, если хватит его людей и оружия. В каждом гарнизоне можно спасти одну группу: заново завербовать уже выведенных людей нельзя. Операция занимает один слот; её нужно закончить до решения этой комиссии. Остальные связи комиссия проверит обычным порядком."
 STP_cw_evacuation_result_tt: "Офицеры гарнизона переберутся в Абилию; §Y12§! влияния перейдут партии. При расколе Шабрат сможет сформировать две бригады независимо от судьбы округа. Каждая требует £manpower_texticon §Y4000§! и £infantry_equipment_texticon §Y320§! из его запасов. Местный гарнизон повторно не вербуется."
 STP_cw_garrison_evacuated: "Кадры этого гарнизона уже выведены в Абилию"
 STP_cw_garrison_evacuation_in_progress: "Вывод офицеров начат во время нынешней проверки"
 STP_cw_opposition_target: "В округе готовится объявленная операция подполья"
 STP_REGION_GARRISON_EVACUATED: "\n  §C- офицеры в Абилии: две бригады Шабрата независимо от судьбы округа§!; на каждую нужны £manpower_texticon §Y4000§! и £infantry_equipment_texticon §Y320§!. Местный гарнизон повторно не вербуется."
 STP_REGION_GARRISON_EVACUATING: "\n  §Y— идёт вывод офицеров в Абилию: 7 дней, до решения нынешней комиссии.§!"
 STP_OPPOSITION_NO_TARGET: "операция сорвана или подходящих округов нет"
 STP_OPPOSITION_ADMINISTRATION: "\n\n§RЦель подполья:§! укрепить сеть. После 28-дневной подготовки влияние вырастет на 12; при закреплённой позиции подполье получит местную администрацию. Проверка командования сорвёт эту операцию."
 STP_OPPOSITION_GARRISON: "\n\n§RЦель подполья:§! привлечь гарнизон. После завершения операции он сможет дать Шабрату оплачиваемую бригаду при переходе округа. Проверка командования сорвёт операцию."
 STP_OPPOSITION_SUPPLY: "\n\n§RЦель подполья:§! подготовить склад. При завершении операции из казны уйдёт 100, если они доступны. При переходе округа Шабрат получит поддержку снабжения и до 500 топлива из резерва Стеландера. Проверка командования сорвёт операцию."
 STP_OPPOSITION_SABOTAGE: "\n\n§RЦель подполья:§! вооружить диверсантов. При завершении операции 240 винтовок уйдут из общего запаса в лесной тайник, если их хватает. При расколе они достанутся владельцу округа; если лес останется под контролем партии, будет повреждён один имеющийся уровень инфраструктуры. Проверка командования сорвёт операцию."
 STP_OPPOSITION_INFLUENCE: "\n\n§RЦель подполья:§! закрепить влияние перед расколом. Успех даст 12 влияния и сдвинет легитимность на 4% к Шабрату. Проверка командования сорвёт операцию."
