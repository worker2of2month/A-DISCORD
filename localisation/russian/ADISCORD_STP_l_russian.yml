 STP_counterintelligence_expires_tt:0 "Срок контрразведки в этом регионе истечёт. Её запрет на подготовительные действия будет снят."
 STP_party_inspection_state_2: "Проверка чиновников штата «Новая Монаии»"
 STP_party_inspection_state_3: "Проверка чиновников штата «Ниансаская область»"
 STP_party_inspection_state_29: "Проверка чиновников штата «Крейден»"
 STP_party_inspection_state_45: "Проверка чиновников штата «Ливонинский округ»"
 STP_party_inspection_state_46: "Проверка чиновников штата «Хосхейт»"
 STP_party_inspection_state_53: "Проверка чиновников штата «Старый фадский лес»"
 STP_party_inspection_state_2_desc: "Партийная комиссия сверяет назначения, пропуска и телефонные журналы Новой Монаии.\n\n§YКогда закончится таймер§!, комиссия проверит подпольную сеть в этом округе. Ответ выбирается через решения на карте до окончания проверки.\n\n§YЕсли ничего не делать:§! будут потеряны гарнизонные связи, снабжение и диверсии. Комиссия также раскроет администрацию, а при её отсутствии - местный договор; ратифицированное соглашение Ливонина защищено. Обнаруженная сеть закрывает местные операции на §R56 дней§!. Найденные связи или оружейные резервы сдвигают легитимность на §R4% к партии§!, пустая проверка - на §G2% к Шабрату§!.\n\n§YКак ответить:§!\n- §YЗатянуть работу§!: купить ещё 14 дней за £political_power_texticon §Y35§!; отсрочка сама по себе не защищает сеть.\n- §YЛожный след§!: подготовить за §Y7 дней§! до конца таймера. Может сохранить сеть, но при провале грозит потерями; риск зависит от подозрений в день завершения комиссии.\n- §YСдать чиновника§!: пожертвовать администрацией, сохранив готовые военные связи и запасы.\n- §YОткрыть реестры§!: сохранить администрацию ценой военной сети.\nОбе уступки действуют сразу, стоят по £political_power_texticon §Y25§! и сдвигают легитимность на §R2% к партии§!; до конца проверки работа в округе остановится. Доступность ответов зависит от фокусов и местных связей."
 STP_party_inspection_state_3_desc: "Партийная комиссия проверяет ведомости, цистерны и районных чиновников Ниансаской области.\n\n§YКогда закончится таймер§!, комиссия проверит подпольную сеть в этом округе. Ответ выбирается через решения на карте до окончания проверки.\n\n§YЕсли ничего не делать:§! будут потеряны гарнизонные связи, снабжение и диверсии. Комиссия также раскроет администрацию, а при её отсутствии - местный договор; ратифицированное соглашение Ливонина защищено. Обнаруженная сеть закрывает местные операции на §R56 дней§!. Найденные связи или оружейные резервы сдвигают легитимность на §R4% к партии§!, пустая проверка - на §G2% к Шабрату§!.\n\n§YКак ответить:§!\n- §YЗатянуть работу§!: купить ещё 14 дней за £political_power_texticon §Y35§!; отсрочка сама по себе не защищает сеть.\n- §YЛожный след§!: подготовить за §Y7 дней§! до конца таймера. Может сохранить сеть, но при провале грозит потерями; риск зависит от подозрений в день завершения комиссии.\n- §YСдать чиновника§!: пожертвовать администрацией, сохранив готовые военные связи и запасы.\n- §YОткрыть реестры§!: сохранить администрацию ценой военной сети.\nОбе уступки действуют сразу, стоят по £political_power_texticon §Y25§! и сдвигают легитимность на §R2% к партии§!; до конца проверки работа в округе остановится. Доступность ответов зависит от фокусов и местных связей."
 STP_party_inspection_state_29_desc: "Партийная комиссия пересчитывает смены, пропуска и заводские печати Крейдена.\n\n§YКогда закончится таймер§!, комиссия проверит подпольную сеть в этом округе. Ответ выбирается через решения на карте до окончания проверки.\n\n§YЕсли ничего не делать:§! будут потеряны гарнизонные связи, снабжение и диверсии. Комиссия также раскроет администрацию, а при её отсутствии - местный договор; ратифицированное соглашение Ливонина защищено. Обнаруженная сеть закрывает местные операции на §R56 дней§!. Найденные связи или оружейные резервы сдвигают легитимность на §R4% к партии§!, пустая проверка - на §G2% к Шабрату§!.\n\n§YКак ответить:§!\n- §YЗатянуть работу§!: купить ещё 14 дней за £political_power_texticon §Y35§!; отсрочка сама по себе не защищает сеть.\n- §YЛожный след§!: подготовить за §Y7 дней§! до конца таймера. Может сохранить сеть, но при провале грозит потерями; риск зависит от подозрений в день завершения комиссии.\n- §YСдать чиновника§!: пожертвовать администрацией, сохранив готовые военные связи и запасы.\n- §YОткрыть реестры§!: сохранить администрацию ценой военной сети.\nОбе уступки действуют сразу, стоят по £political_power_texticon §Y25§! и сдвигают легитимность на §R2% к партии§!; до конца проверки работа в округе остановится. Доступность ответов зависит от фокусов и местных связей."
 STP_party_inspection_state_45_desc: "Партийная комиссия выясняет, с кем совет Ливонина обсуждает будущее без Фады.\n\n§YКогда закончится таймер§!, комиссия проверит подпольную сеть в этом округе. Ответ выбирается через решения на карте до окончания проверки.\n\n§YЕсли ничего не делать:§! будут потеряны гарнизонные связи, снабжение и диверсии. Комиссия также раскроет администрацию, а при её отсутствии - местный договор; ратифицированное соглашение Ливонина защищено. Обнаруженная сеть закрывает местные операции на §R56 дней§!. Найденные связи или оружейные резервы сдвигают легитимность на §R4% к партии§!, пустая проверка - на §G2% к Шабрату§!.\n\n§YКак ответить:§!\n- §YЗатянуть работу§!: купить ещё 14 дней за £political_power_texticon §Y35§!; отсрочка сама по себе не защищает сеть.\n- §YЛожный след§!: подготовить за §Y7 дней§! до конца таймера. Может сохранить сеть, но при провале грозит потерями; риск зависит от подозрений в день завершения комиссии.\n- §YСдать чиновника§!: пожертвовать администрацией, сохранив готовые военные связи и запасы.\n- §YОткрыть реестры§!: сохранить администрацию ценой военной сети.\nОбе уступки действуют сразу, стоят по £political_power_texticon §Y25§! и сдвигают легитимность на §R2% к партии§!; до конца проверки работа в округе остановится. Доступность ответов зависит от фокусов и местных связей."
 STP_party_inspection_state_46_desc: "Партийная комиссия сверяет портовые ключи, складские книги и списки ночных смен Хосхейта.\n\n§YКогда закончится таймер§!, комиссия проверит подпольную сеть в этом округе. Ответ выбирается через решения на карте до окончания проверки.\n\n§YЕсли ничего не делать:§! будут потеряны гарнизонные связи, снабжение и диверсии. Комиссия также раскроет администрацию, а при её отсутствии - местный договор; ратифицированное соглашение Ливонина защищено. Обнаруженная сеть закрывает местные операции на §R56 дней§!. Найденные связи или оружейные резервы сдвигают легитимность на §R4% к партии§!, пустая проверка - на §G2% к Шабрату§!.\n\n§YКак ответить:§!\n- §YЗатянуть работу§!: купить ещё 14 дней за £political_power_texticon §Y35§!; отсрочка сама по себе не защищает сеть.\n- §YЛожный след§!: подготовить за §Y7 дней§! до конца таймера. Может сохранить сеть, но при провале грозит потерями; риск зависит от подозрений в день завершения комиссии.\n- §YСдать чиновника§!: пожертвовать администрацией, сохранив готовые военные связи и запасы.\n- §YОткрыть реестры§!: сохранить администрацию ценой военной сети.\nОбе уступки действуют сразу, стоят по £political_power_texticon §Y25§! и сдвигают легитимность на §R2% к партии§!; до конца проверки работа в округе остановится. Доступность ответов зависит от фокусов и местных связей."
 STP_party_inspection_state_53_desc: "Партийная комиссия расспрашивает лесничих, дорожных мастеров и старост Старой Фады.\n\n§YКогда закончится таймер§!, комиссия проверит подпольную сеть в этом округе. Ответ выбирается через решения на карте до окончания проверки.\n\n§YЕсли ничего не делать:§! будут потеряны гарнизонные связи, снабжение и диверсии. Комиссия также раскроет администрацию, а при её отсутствии - местный договор; ратифицированное соглашение Ливонина защищено. Обнаруженная сеть закрывает местные операции на §R56 дней§!. Найденные связи или оружейные резервы сдвигают легитимность на §R4% к партии§!, пустая проверка - на §G2% к Шабрату§!.\n\n§YКак ответить:§!\n- §YЗатянуть работу§!: купить ещё 14 дней за £political_power_texticon §Y35§!; отсрочка сама по себе не защищает сеть.\n- §YЛожный след§!: подготовить за §Y7 дней§! до конца таймера. Может сохранить сеть, но при провале грозит потерями; риск зависит от подозрений в день завершения комиссии.\n- §YСдать чиновника§!: пожертвовать администрацией, сохранив готовые военные связи и запасы.\n- §YОткрыть реестры§!: сохранить администрацию ценой военной сети.\nОбе уступки действуют сразу, стоят по £political_power_texticon §Y25§! и сдвигают легитимность на §R2% к партии§!; до конца проверки работа в округе остановится. Доступность ответов зависит от фокусов и местных связей."

 STP_debug_start_battle_for_stelander: "§RDEBUG:§! Начать Битву за Стеландер"
 STP_debug_start_battle_for_stelander_desc: "Вызывает вводное событие, выбирает сторону Шабрата и начинает работу с округами. Первая комиссия будет назначена через 21 день; её проверка продлится 40 дней."
 STP_debug_reset_battle_for_stelander: "§RDEBUG:§! Сбросить Битву за Стеландер"
 STP_debug_reset_battle_for_stelander_desc: "Удаляет все региональные активы и влияние, затем создаёт систему заново с исходными значениями."
 STP_debug_end_battle_for_stelander: "§RDEBUG:§! Завершить Битву за Стеландер"
 STP_debug_end_battle_for_stelander_desc: "Удаляет региональные переменные, флаги и активную партийную проверку."
 STP_scenario_debug: "§RDEBUG:§! Стеландер"
 STP_scenario_debug_desc: "Служебные точки входа в сценарий Стеландера. Категория видна только при запуске игры в режиме отладки."
 STP_debug_start_civil_war: "§RDEBUG:§! Начать гражданскую войну"
 STP_debug_start_civil_war_desc: "Пропускает подготовку и выборы, затем вызывает штатный раскол. Если сторона не выбрана, игрок остаётся за партию."
 STP_debug_resolve_party_victory: "§RDEBUG:§! Победа партии"
 STP_debug_resolve_party_victory_desc: "При необходимости запускает штатный раскол и через час закрепляет победу партии. Игрок переходит на STP, если ещё был за сопротивление."
 STP_debug_resolve_shabrat_victory: "§RDEBUG:§! Победа Шабрата"
 STP_debug_resolve_shabrat_victory_desc: "При необходимости запускает штатный раскол и через час закрепляет победу Шабрата. Игрок переходит на STS, если ещё был за партию."

