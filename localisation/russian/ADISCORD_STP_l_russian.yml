 STP_council_agreement_result_tt: "При завершении: соглашение обеспечит переход Ливонина Шабрату; §Y+10§! влияния местных сил, §R+3§! подозрений."
 STP_false_trail_result_tt: "Если успеем до конца комиссии: ложный след будет готов; §R+3§! влияния партии в округе."
 STP_region_operation_2_result_tt: "В регионе §Y[2.GetName]§! гарнизон и администрация подготовят переход на сторону Шабрата. Сохранившийся договор даёт плацдарм, командные связи и две дополнительные оплачиваемые бригады при расколе. Партийная комиссия может сорвать переход; эвакуация офицеров сохранит части ценой отказа от местного плацдарма."
 STP_region_operation_3_result_tt: "При завершении: склад снабжения; §C+6§! влияния сопротивления, §R+5§! подозрений."
 STP_region_operation_29_result_tt: "В регионе §Y[29.GetName]§! гарнизон и администрация подготовят переход на сторону Шабрата. Сохранившийся договор даёт плацдарм и две дополнительные оплачиваемые бригады при расколе. При партийной проверке можно пожертвовать гражданскими связями или вывести кадры, сохранив людей для армии."
 STP_region_operation_45_result_tt: "При завершении: администрация поддержит сопротивление; §C+12§! его влияния, §R+4§! подозрений."
 STP_region_operation_46_result_tt: "При завершении: склад снабжения; §C+8§! влияния сопротивления, §R+6§! подозрений."
 STP_region_operation_53_result_tt: "При завершении: диверсионная группа с оплаченными £infantry_equipment_texticon §Y240§! винтовками; §C+6§! влияния сопротивления, §R+10§! подозрений."
 STP_district_check_result_tt: "При завершении: §Y+15§! влияния партии, изъятие структур подполья и запрет его работы на §Y56 дней§!. Найденные структуры дают 4% легитимности партии, пустая проверка — 2% Шабрату."
 STP_rifle_cache_result_tt: "При завершении: оплаченные £infantry_equipment_texticon §Y1600§! винтовок поступят в резерв Абилии для Шабрата. При закрытии подготовки или переполнении склада груз вернётся в общий государственный запас."
 STP_inspection_delay_result_tt: "Текущая комиссия продлится на §Y14 дней§!. Один слот подготовки будет занят на всё это время; при завершении подготовки он освободится без возврата политической власти."
 STP_party_inspection_active: "В округе работает партийная комиссия"
 STP_resistance_garrison_asset: "Гарнизон округа поддерживает сопротивление"
 STP_inspection_resolution_tt: "Комиссия проверит окружные структуры. Ложный след, сдача чиновника или открытие гражданских реестров изменят исход. Состояние связей и выбранный ответ указаны на карте."
 STP_preparation_rifle_refund_tt: "При отмене вернётся только оружие, которое ещё зарезервировано этим заказом. Политическая власть не возвращается."

 # Легитимность
 STP_shabrat_election_legitimacy: "Легитимность партийных выборов"
 STP_shabrat_election_legitimacy_desc: "Шкала показывает, чью победу признают делегаты. Для победы Шабрата к завершению выборов нужно значение выше §Y+10%§!. При §Y+10%§! и ниже партийный аппарат удержит протокол.\n\nРеспублики получают §Y20%§! общих людей. Затем резервируются люди для подготовленных частей, а остаток делится между победителем и проигравшим как §Y5:3§!. Общие оружейные склады делятся §Y50% / 30% / 20%§!: победитель, проигравший, республики; тайники передаются отдельно.\n\nВыборы завершаются гражданской войной при любом результате. При досрочном выступлении нераспределённые люди делятся между партией и сопротивлением поровну, а оружие — §Y40% / 40% / 20%§! между партией, сопротивлением и республиками."

 STP_party_election_legitimacy_side: "Партийный аппарат"
 STP_shabrat_election_legitimacy_side: "Шабрат"

 STP_election_legitimacy_contested_range: "Протокол остаётся у аппарата"
 STP_party_election_low_control_range: "Небольшой перевес аппарата"
 STP_party_election_medium_control_range: "Устойчивый перевес аппарата"
 STP_party_election_high_control_range: "Большинство за аппаратом"
 STP_party_election_total_control_range: "Делегаты поддерживают аппарат"
 STP_shabrat_election_low_control_range: "Небольшой перевес Шабрата"
 STP_shabrat_election_medium_control_range: "Устойчивый перевес Шабрата"
 STP_shabrat_election_high_control_range: "Большинство за Шабратом"
 STP_shabrat_election_total_control_range: "Делегаты поддерживают Шабрата"

 STP_shabrat_election_bop_category: "Партийные выборы"
 STP_shabrat_election_bop_category_desc: "Фокусы открывают политическую работу, но одних заявлений недостаточно для исключительного мандата. Переговоры и агитация усиливают выбранную сторону. Раз в 35 дней делегаты сверяют полномочия: отсутствие действующей администрации в Монаии или Ниансасе отнимает по 8% легитимности Шабрата. Сохраните окружные организации или восстановите их до проверки. Каждая работа занимает один слот подготовки, а результат появляется только после её завершения. Если начнётся война или закончится подсчёт голосов, незавершённая кампания прекратится без изменения легитимности; потраченная политическая власть не возвращается."
 STP_cw_negotiate_with_delegates: "Переговоры с делегатами"
 STP_cw_negotiate_with_delegates_desc: "За 14 дней согласовать поддержку колеблющихся делегатов. Переговоры занимают один слот подготовки. Новые переговоры доступны, пока преимущество нашей стороны на шкале легитимности меньше 55%: оставшихся убеждённых противников одной сделкой не переманить."
 STP_cw_open_election_campaign: "Открытая агитация"
 STP_cw_open_election_campaign_desc: "Публичная кампания занимает 21 день и один слот подготовки. За выборы можно провести три кампании: общую, окружную и заключительную. Вторая открывается после первых 35 дней выборов, третья — после 70 дней. Шабрату для второй нужна работающая 21 день администрация в Монаии или Ниансасе, для третьей — обе. Если требуемое управление утрачено до завершения, кампания срывается без возврата политических расходов.\n\nЗавершено кампаний: [?STP_cw_completed_public_campaigns|0] из 3."
 STP_cw_election_operation_slot_tt: "Есть свободный слот подготовки."
 STP_debug_increase_party_bop: "§RDEBUG:§! BOP: увеличить влияние партии на 25"
 STP_debug_increase_party_bop_desc: "Сдвигает баланс сил на §Y25 пунктов§! в сторону партийного аппарата."
 STP_debug_increase_shabrat_bop: "§RDEBUG:§! BOP: увеличить влияние Шабрата на 25"
 STP_debug_increase_shabrat_bop_desc: "Сдвигает баланс сил на §Y25 пунктов§! в сторону Шабрата."

 # Интерфейс
 STP_STATE_FACE_TITLE: "Здоровье лидера"

 STP_STATE_FACE_STAGE_1_loc: "Состояние устойчиво"
 STP_STATE_FACE_STAGE_2_loc: "Нарастающее истощение"
 STP_STATE_FACE_STAGE_3_loc: "Тяжёлая слабость"
 STP_STATE_FACE_STAGE_4_loc: "Критическое состояние"
 STP_STATE_FACE_STAGE_5_loc: "Смерть лидера"

 STP_STATE_FACE_STAGE_1_TOOLTIP:0 "§YСтадия 1/5 — устойчивое состояние§!\n\nИванов сохраняет работоспособность и лично удерживает аппарат. Его здоровье пока не создаёт дополнительного давления на устойчивость режима.\n\n£stability_texticon §YВлияние на стабильность:§! §G0%§!"
 STP_STATE_FACE_STAGE_2_TOOLTIP:0 "§YСтадия 2/5 — нарастающее истощение§!\n\nПоявляются признаки перегрузки. Аппарат ещё компенсирует слабость лидера дисциплиной, но сама зависимость системы от одного человека становится заметной.\n\n£stability_texticon §YВлияние на стабильность:§! §R-5%§!"
 STP_STATE_FACE_STAGE_3_TOOLTIP:0 "§YСтадия 3/5 — тяжёлая слабость§!\n\nИванов всё чаще действует через доверенных лиц, записи и подготовленные выступления. Внутри режима вопрос преемственности уже невозможно считать отвлечённой угрозой.\n\n£stability_texticon §YВлияние на стабильность:§! §R-10%§!"
 STP_STATE_FACE_STAGE_4_TOOLTIP:0 "§YСтадия 4/5 — критическое состояние§!\n\nФормальная вертикаль сохраняется, но её центр почти перестал функционировать. Элиты и силовики начинают готовиться к вакууму власти ещё при живом лидере.\n\n£stability_texticon §YВлияние на стабильность:§! §R-20%§!"
 STP_STATE_FACE_STAGE_5_TOOLTIP:0 "§YСтадия 5/5 — смерть лидера§!\n\nИванов больше не удерживает систему лично. Государственная машина продолжает двигаться по инерции, пока её участники решают, кому достанется оставшаяся власть.\n\n£stability_texticon §YВлияние на стабильность:§! [?STP_fading_father_stability_factor|=+0%]"

 # Гражданская война
 STP_cw_first_health_decline: "Произошло первое ухудшение здоровья Иванова"
 STS: "Стеланд"
 STS_DEF: "Стеланд"
 STS_ADJ: "Стеландск"
 SRP: "Союз Возрождения Окцидии"
 SRP_DEF: "Союз Возрождения Окцидии"
 SRP_ADJ: "Окцидийск"
 SRP_Federal_Council: "Союзный совет Окцидии"
 STP_cw_election_window: "Выборы нового председателя: 140 дней"
 STP_cw_election_window_desc: "Голосование длится §Y140 дней§!; фокусы и операции не меняют этот срок. Шабрату нужно больше §Y10%§! легитимности в его сторону для победы и военного мандата. Поддержка не ниже §Y80%§!, признание командования и администрации Монаии и Ниансаса, непрерывно работающие не менее §Y21 дня§! к объявлению результата, позволят ограничить выступление партии столичным мятежом. Потеря администрации обнуляет её срок; после восстановления отсчёт начинается заново.\n\nПри расколе люди и оружие сначала выделяются подготовленным частям, затем базовым армиям. Остаток распределяется с преимуществом победителя выборов. Военная и политическая подготовка используют общие слоты; завершить начатые операции нужно до раскола."
 STP_cw_raise_district_network: "Расширить подпольную сеть в регионе [FROM.GetName]"
 STP_cw_raise_district_network_desc: "За §Y14 дней§! развернём связи в [FROM.GetName]. Укрепив сопротивление, можно привлечь местную администрацию; вместе они определят переход округа при расколе. Сверяйтесь с прогнозом на карте."
 STP_cw_prepare_rifle_cache: "Пополнить резерв сопротивления"
 STP_cw_prepare_rifle_cache_desc: "Во время выборов выделим £infantry_equipment_texticon §Y1600§! единиц с государственных складов в резерв Абилии. Доставка займёт §Y28 дней§!, £political_power_texticon §Y35§! политической власти и один слот подготовки; подозрения вырастут на 5. Общий резерв, включая груз в пути, ограничен §Y9600§! единицами. Только завершённый заказ целиком достанется сопротивлению. При расколе незавершённая поставка вернётся в государственный запас до его раздела; политическая власть не возвращается."
 STP_cw_disperse_network: "Залечь на дно"
 STP_cw_disperse_network_desc: "На §Y10 дней§! приостановим открытую работу и сменим связных. Повторная операция доступна через §Y30 дней§!."
 STP_cw_trigger_northern_incident: "Оспорить основания интервенции"
 STP_cw_trigger_northern_incident_desc: "Опубликуем собранные документы и потребуем согласования спорных пунктов. За £political_power_texticon §Y35§! один раз продлим текущую подготовку интервенции на §Y10 дней§!. Ответ доступен до и после раскола. Он задерживает готовность Нодрула: для вступления ему также нужны завершённая северная кампания, переброска войск и продолжающаяся война партии с Шабратом."
 STP_cw_supply_the_north: "Северный груз: [FROM.GetName]"
 STP_cw_supply_the_north_desc: "За £pol_power §Y40§! отправим стране [FROM.GetName] £infantry_equipment_texticon §Y2400§! единиц снаряжения из наших запасов. Доставка занимает 21 день; следующая отправка этому получателю доступна после 42 дней отдыха. Одновременно в пути может находиться один груз.\n\nПолучатель должен продолжать войну с Нодрулом. При отмене оружие возвращается, расходы на организацию — нет. При расколе недоставленное оружие возвращается в общий запас Стеландера до его раздела. Поставка помогает северянам пополнять дивизии; срок интервенции она напрямую не меняет."
 STP_cw_start_uprising: "Начать восстание Шабрата"
 STP_cw_start_uprising_desc: "Пока Нодрул ведёт северную войну, можно начать досрочное выступление. После возвращения его армии эта возможность закроется. Восстание прервёт выборы и незавершённые операции; выборного мандата Шабрат не получит.\n\nПодготовка округов определит плацдармы, запасы и дополнительные части. Вы продолжите за Шабрата."
 STP_cw_cost_240_rifles: "£infantry_equipment_texticon §Y240§!"
 STP_cw_war_council: "Военный совет Стеландера"
 STP_cw_war_council_desc: "Совет распределяет людей, оружие и усилия штабов. Немедленная бригада быстрее выходит на фронт; учебный резерв требует 21 день, зато выпускает две подготовленные бригады. Наступление, оборона и перегруппировка исключают друг друга: приказ нельзя заменить до окончания его срока.\n\n§YНодрул:§! [STPGetNodStatus][STPGetKefreytArmyCommitment]"
 STP_cw_raise_territorial_brigade: "Сформировать территориальную бригаду"
 STP_cw_raise_territorial_brigade_tt: "Из наших резервов будут выделены £manpower_texticon §Y4000§! человек и £infantry_equipment_texticon §Y320§! единиц пехотного снаряжения. В собственном контролируемом регионе появится §Y1 территориальная бригада§! из четырёх батальонов ополчения с полным комплектом людей и оружия."
 STP_cw_raise_territorial_brigade_desc: "После мобилизационного реестра можно раз в 14 дней сформировать бригаду из четырёх батальонов ополчения. Цена: £manpower_texticon §Y4000§! человек и £infantry_equipment_texticon §Y320§! единиц снаряжения. Нужен хотя бы один собственный контролируемый регион. Люди и оружие списываются при формировании. До окончания конфликта состав мобилизационных частей закреплён. После мира их шаблоны можно изменять; срочные заказы закрываются."
 STP_CW_FORECAST_REPUBLICS: "§YОкцидия§!"
 STP_CW_FORECAST_RESISTANCE: "§GСопротивление Шабрата§!"
 STP_CW_FORECAST_PARTY: "§RПартийное правительство§!"
 STP_CW_CACHE_READY: "Оружейный тайник: §Y[?STP_cw_cached_rifles|0]§! ед."
 STP_CW_CACHE_PENDING: "Подготовка тайника: §Y[?STP_cw_pending_rifles|0]§! ед. в пути"
 STP_cw_defensive_preparation: "Подготовленная оборона"
 STP_cw_defensive_preparation_desc: "Штаб связал укрепления, резервы и маршруты подвоза в общий оборонительный план."
 STP_cw_offensive_preparation: "Операция «Последний банкет»"
 STP_cw_offensive_preparation_desc: "Удар по партийной столице подготовлен. Запасов и темпа хватит лишь на короткое наступление."
 ADISCORD_STP_preparation.1.t: "Приём окончен"
 ADISCORD_STP_preparation.1.d: "Иванов прервал доклад о положении республики. Врач потребовал отменить оставшиеся встречи; министров попросили подождать в соседнем зале. Скрывать состояние президента за изменениями расписания больше не удаётся.\n\nШабрат добивается доступа к президенту. Хедерсетт предлагает передать текущие дела кабинету и ограничить круг посетителей. Чиновники и командиры ждут, кого мы поддержим.\n\nПереговоры с офицерами и окружными организациями займут недели. После смерти Иванова у сторон останется 140 дней на кампанию и подсчёт голосов. Одни потратят это время на поддержку делегатов, другие — на гарнизоны, склады и оборону. Сил и людей на всё сразу не хватит."
 ADISCORD_STP_preparation.1.a: "Поддержать Шабрата."
 ADISCORD_STP_preparation.3.t: "Последняя подпись"
 ADISCORD_STP_preparation.3.d: "Иванов умер. Хедерсетт принял дела кабинета и объявил выборы нового председателя. На кампанию и подсчёт голосов отведено 140 дней.\n\nДелегаты ещё могут отдать большинство Шабрату. Его сторонники собирают подписи, а партийные комиссии проверяют окружные организации. Обычная победа даст военный мандат. Исключительная поддержка и признание командования позволят ограничить выступление партии столичным мятежом, если администрации Монаии и Ниансаса к объявлению результата проработают не менее 21 дня без потери. Восстановленной администрации придётся отсчитать этот срок заново.\n\nПодготовка гарнизона, оборонительного рубежа или усиленной дивизии занимает 35 дней. Работа над мандатом использует те же подготовительные возможности; срок выборов остаётся общим пределом.\n\nШабрат может завершить подготовку выступления и поднять восстание до подсчёта голосов. Тогда выборного мандата не будет. Северная война задержит вступление Нодрула, но рассчитывать её длительность придётся самим."
 ADISCORD_STP_preparation.3.a: "Сто дней. Ни одного лишнего."
 ADISCORD_STP_preparation.4.t: "Оспоренный протокол"
 ADISCORD_STP_preparation.4.d: "Голосование завершено, результат зафиксирован. Проигравшая сторона отказывается признать нового председателя.\n\nВнешняя война уже изменила территорию страны: сейчас стороны не могут занять свои исходные центры в Абилии, Фаде и западных республиках. Раскол остаётся неизбежным при восстановлении этих условий; выборы не будут проведены заново."
 ADISCORD_STP_preparation.4.a: "Сохранить решения съезда."
 ADISCORD_STP_preparation.10.t: "Северная кампания"
 ADISCORD_STP_preparation.10.d: "Смерть Иванова оставила Стеландер без прежнего руководства. Генеральный штаб Нодрула предлагает сначала решить северный вопрос. Юборская Народная Республика, Культ Детей Леса и Вольный Фронтир готовят общий оборонительный союз.\n\nМобилизация займёт 28 дней. После неё Нодрул сам объявит войну всем трём участникам союза. Падение одного правительства не завершит кампанию: придётся сломить каждого. Пока северный фронт держится, вмешательство в Стеландере откладывается.\n\nПобеда позволит аннексировать Культ и подчинить Юбор, сохранив независимость Фронтира. Поражение заставит прекратить войну и уступить Эснос и Бриоланд Юбору, если они ещё принадлежат Нодрулу."
 ADISCORD_STP_preparation.10.a: "Начать мобилизацию."
 ADISCORD_STP_preparation.10.b: "Отказаться от северной кампании."
 ADISCORD_STP_preparation.13.t: "Нодрул разворачивает армию"
 ADISCORD_STP_preparation.13.d: "Нодрул начинает северную мобилизацию. Через 28 дней его армия выступит против союза Юбора, Культа Детей Леса и Вольного Фронтира. Приказ принят его собственным правительством.\n\nПока хотя бы один северный союзник держится, Нодрул не сможет открыть фронт в Стеландере. Подготовка интервенции при этом может идти параллельно. Если к концу северной войны она уже завершится, останутся семь дней на переброску.\n\nМы можем потратить оружие на поддержку северян либо сохранить его для своих частей. Пограничные свидетельства позволят ненадолго задержать южную подготовку; ни один из этих шагов не гарантирует, сколько продлится настоящая война."
 ADISCORD_STP_preparation.13.a: "Проверить последние приготовления."
 ADISCORD_STP_preparation.14.t: "Северная кампания отменена"
 ADISCORD_STP_preparation.14.d: "Нодрул не открыл северный фронт. Его руководство могло отказаться от кампании, а общий план мог потерять смысл из-за разгрома, подчинения или новых союзов северных стран.\n\nРассчитывать на отвлекающую войну больше нельзя. Правительство Нодрула по-прежнему может готовить вмешательство ещё до раскола Стеландера. Если подготовка уже началась, отмена северной кампании не сбросит её срок. Нам придётся завершить борьбу с партией прежде, чем Нодрул будет готов выступить."
 ADISCORD_STP_preparation.14.a: "Пересмотреть обстановку."
 ADISCORD_STP_cw.20.t: "Кефрейт определяет западный курс"
 ADISCORD_STP_cw.20.d: "После распада Стеландера западные республики сохранили самостоятельность и не вступили в войну партии с Шабратом. Правительство Кефрейта должно определить свой курс.\n\nПока сопротивление воюет с партийным правительством, ему можно предложить оплачиваемые поставки. Договор с Шабратом не исключает отдельный поход против Союза Возрождения Окцидии. Торговый и военный курс открывают решение о мобилизации: приказ можно отдать спустя 60 дней после раскола, затем противник получит 21-дневный ультиматум. Ждать окончания гражданской войны не нужно. Нейтралитет исключает этот поход. Территории [43.GetName], [44.GetName] и [88.GetName] можно получить только после победы; [45.GetName] в требования не входит."
 ADISCORD_STP_cw.20.a: "Подготовить военную операцию."
 ADISCORD_STP_cw.20.b: "Сохранить нейтралитет."
 ADISCORD_STP_cw.20.c: "Предложить сопротивлению оружейный контракт."
 ADISCORD_STP_cw.20.committed: "Курс уже определён."
 STP_cw_val_mobilization_tt: "Начнётся 21-дневная мобилизация. По её завершении Кефрейт объявит отдельную войну Союзу Возрождения Окцидии, если обе страны останутся независимыми, вне фракций, в мире и с общей границей. [43.GetName], [44.GetName] и [88.GetName] можно получить только после победы; [45.GetName] исключён."
 VAL_cw_intervention_preparation: "Мобилизация против западных республик"
 VAL_cw_intervention_preparation_desc: "До окончания 21-дневного ультиматума Кефрейт и республики остаются в мире. Затем начнётся отдельная война между ними, если обе страны сохранят независимость, общую границу и не вступят в другую войну или фракцию. При изменении условий мобилизация отменяется."
 ADISCORD_STP_cw.23.t: "Итог западной операции"
 ADISCORD_STP_cw.23.victory: "Армия Союза Возрождения Окцидии разбита. Кефрейт получает принадлежавшие ему регионы [43.GetName], [44.GetName] и [88.GetName]. Регион [45.GetName] остаётся за пределами соглашения.\n\nКонтрактный авторитет вырос на 5. Война с республиками завершена; другие войны и контракты сохраняются."
 ADISCORD_STP_cw.23.defeat: "Республики отбили наступление и принудили наш штаб прекратить операцию. Война с ними завершена без территориальных приобретений.\n\nКонтрактный авторитет снизился на 10. Правительству предстоит восстановить доверие к заказам и снабжению; другие войны и контракты сохраняются."
 ADISCORD_STP_cw.23.cancelled: "К моменту исполнения ультиматума цель или условия вмешательства изменились. Штаб отменил мобилизацию; война не началась. После восстановления условий новый приказ можно отдать через решение о мобилизации."
 ADISCORD_STP_cw.23.a: "Подвести итоги операции."
 ADISCORD_STP_cw.30.t: "Три власти, одна страна"
 ADISCORD_STP_cw.30.d: "Сопротивление выступает до окончания голосования. Партия удерживает Бронзовый конгресс, а западные советы провозгласили Союз Возрождения Окцидии.\n\nАбилия передана сопротивлению. Базовый план — 28 партийных, 26 повстанческих и 14 республиканских территориальных бригад; у двух основных сторон также планируется по четыре усиленные дивизии. Подготовленные части получают людей и оружие первыми. Фактические силы зависят от полных комплектов ресурсов. После выбора стороны начнутся боевые действия."
 ADISCORD_STP_cw.30.a: "Остаться с партийным правительством."
 ADISCORD_STP_cw.30.b: "Возглавить сопротивление Шабрата."
 ADISCORD_STP_cw.30.c: "Защитить Союз Возрождения Окцидии."
 STP_cw_pay_officials: "Служащие лесного округа"
 STP_cw_pay_officials_desc: "Чиновники региона [53.GetName] подготовят передачу управления Шабрату. Выделенный политический ресурс позволит продолжить работу в округе. Взамен расходы на управление увеличатся на 10% на 70 дней; готовую администрацию ещё нужно защитить от проверок."
 STP_cw_repair_niansas: "Дорога через Ниансас"
 STP_cw_repair_niansas_desc: "Восстановим дорогу в регионе [3.GetName], чтобы движение грузов не зависело от личных распоряжений министров. Дополнительная инфраструктура улучшит условия снабжения и укрепит поддержку Шабрата на выборах."
 STP_cw_port_budget: "Портовые ассигнования"
 STP_cw_port_budget_desc: "Выделим 100 в казну и подготовим маршруты Ниансаса. Если склад сохранится и округ перейдёт Шабрату, при расколе на 21 день расход снабжения его армии снизится на 10%, а восстановление организации ускорится на 5%. Второй склад не усилит и не продлит этот эффект. Дополнительно передадим 500 топлива из запасов партии, если его достаточно. Если партия ликвидирует склад, открытое решение позволит подготовить маршруты заново за полную стоимость."
 STP_cw_officer_contacts: "Разговоры без погон"
 STP_cw_officer_contacts_desc: "Эдмунд Равель согласится поддержать Шабрата. При расколе он перейдёт к сопротивлению, которое получит 10 опыта армии и 15 командного ресурса."
 STP_cw_district_printing: "Окружные типографии"
 STP_cw_district_printing_desc: "Типографии обеспечат общую избирательную кампанию и связь между окружными организациями. Появится возможность вести вторую подготовительную операцию одновременно с первой."
 STP_cw_local_council_envoys: "Посланники к советам"
 STP_cw_local_council_envoys_desc: "Признаем советы Ливонинского округа стороной переговоров. Их влияние вырастет на 10, мы получим 35 политической власти. Для перехода округа к Шабрату ещё потребуется соглашение об автономии; без него укрепление советов помогает республикам."
 STP_cw_autonomy_guarantees: "Ратифицировать договор"
 STP_cw_autonomy_guarantees_desc: "Советы уже заключили оплаченный договор о переходе Ливонинского округа к Шабрату. Закрепим его за 21 день: партийные проверки больше не смогут отменить это соглашение. Одновременно гарантируем самостоятельность отделившимся западным советам. После раскола сможем оплачивать их снабжение против Кефрейта, а после победы придётся определить судьбу гарантий. Остальные активы Ливонинского округа останутся уязвимыми."
 STP_cw_northern_dossier: "Внешние связи"
 STP_cw_northern_dossier_desc: "Разведчики выяснят состав армии Нодрула, а посредники установят связь с советами пограничных округов. На севере можно подготовить дипломатическую отсрочку или наладить поставки оружия. Отдельные переговоры откроют соглашение с Кефрейтом и подготовку местных добровольцев."
 STP_cw_border_evidence: "Пограничные свидетельства"
 STP_cw_border_evidence_desc: "Соберём показания и приказы, которыми можно оспорить основания для вмешательства в Стеландере. Они пригодятся сопротивлению, когда Нодрул объявит о подготовке интервенции: за политический ресурс удастся выиграть десять дней."
 STP_cw_arm_the_north: "Вооружить север"
 STP_cw_arm_the_north_desc: "Наладим поставки северному союзу. Когда начнётся война, можно будет выбрать получателя и отправить ему 2400 единиц снаряжения. Оружие придётся забрать у собственной армии; взамен северяне получат шанс дольше удерживать Нодрул. После раскола канал останется у сопротивления."
 STP_cw_northern_observers_tt: "При начале северной войны обновим разведданные об армии Нодрула на §G15§!. После раскола свежие сведения получит §Yсопротивление§!: §G+15§! к разведданным об армии Нодрула."
 STP_cw_cabinet_archives: "Ведомственные документы"
 STP_cw_cabinet_archives_desc: "Через служащих получим списки назначений, ведомости и закрытые счета. Новые посредники усилят сеть сторонников. Затем документы можно опубликовать или использовать в переговорах с министрами."
 STP_cw_expose_the_cabinet: "Открыть закрытые счета"
 STP_cw_expose_the_cabinet_desc: "Публикация счетов укрепит поддержку Шабрата и даст его штабу средства для политической работы. Партия отнесётся к действиям окружных организаторов с большим подозрением. Закрытая сделка с министрами после публикации станет невозможна."
 STP_cw_buy_silence: "Договориться с министрами"
 STP_cw_buy_silence_desc: "Часть кабинета согласится сотрудничать в обмен на сохранение выплат. Мы получим больше политического ресурса для переговоров и снизим подозрения партии, но поддержка избирателей вырастет слабее, чем после публичного разоблачения. Расходы на управление увеличатся на 10% на 70 дней."
 STP_cw_unified_headquarters: "Приказы из одного штаба"
 STP_cw_unified_headquarters_desc: "Сведём отряды под общее командование. Организация армии увеличится ещё на 3%, скорость планирования — на 5%. Довоенная подготовка офицеров сохранится; эти меры дополнят её."
 STP_cw_mobilization_register: "Мобилизационный реестр"
 STP_cw_mobilization_register_desc: "Реестр открывает два способа пополнения. Территориальная бригада выходит немедленно за 25 политической власти, 4000 людей и 320 винтовок. Учебный резерв за 40 политической власти занимает 8000 людей и 640 винтовок на 21 день и выпускает две бригады с начальным опытом 30%."
 STP_cw_wartime_arsenals: "Арсеналы военного времени"
 STP_cw_wartime_arsenals_desc: "Мастерские столицы переходят на военное производство. Два новых завода и дополнительные смены на 140 дней поддержат пополнение фронта. Из ремонтных запасов поступят 2000 винтовок и 120 орудий. Военный совет сможет выкупать готовые партии оружия за деньги и расширять арсеналы в подконтрольных регионах."
 STP_cw_supply_routes: "Дороги к фронту"
 STP_cw_supply_routes_desc: "Расширим дорожную сеть и наладим подвоз. Служба снабжения сократит потребление припасов армией на 8%. Военный совет сможет на 21 день перевести фронт на перегруппировку: части восстановят силы, пожертвовав наступательным темпом."
 STP_cw_congress_in_session: "Конгресс продолжает заседание"
 STP_cw_congress_in_session_desc: "Укрепим подступы к Бронзовому конгрессу и подчиним войска единому командованию. Организация армии вырастет на 5%, скорость планирования — на 10%, но потребление припасов увеличится на 5%. Подготовка снабжения поможет покрыть этот расход."
 STP_cw_guard_the_pier: "Удержать набережную"
 STP_cw_guard_the_pier_desc: "Штаб подготовит план обороны на §Y35 дней§!. Ввести его можно отдельным решением за £command_power_texticon §Y25§!, пока мы контролируем Фаду и воюем с сопротивлением. Повторный приказ доступен через §Y56 дней§! после предыдущего; действующие наступление, оборона или перегруппировка должны закончиться."
 STP_cw_road_to_fada: "Открыть дорогу на Фаду"
 STP_cw_road_to_fada_desc: "Улучшим дорогу через Ниансас и организуем смену передовых частей. Откроется приказ о перегруппировке фронта: его можно использовать перед наступлением на Фаду. Штаб получит эту возможность и при уже полностью развитой дорожной сети."
 STP_cw_last_banquet: "Последний банкет"
 STP_cw_last_banquet_desc: "Штаб составит план наступления на Бронзовый конгресс. Согласованные действия артиллерии и штурмовых частей на 21 день повысят атаку на 15%, прорыв на 20% и скорость планирования на 10%. Перед приказом пополните ударные дивизии: план не заменит недостающие орудия и винтовки."
 STP_cw_federal_defence: "Совместная оборона республик"
 STP_cw_federal_defence_desc: "Советы сохранят самостоятельные отряды и наладят их смену на передовой. Потребление припасов сократится на 8%, восстановление организации ускорится на 10%, но её максимальный уровень снизится на 5%. Такая армия лучше переносит перегруппировки, чем непрерывный бой."
 STP_cw_western_frontier: "Западный рубеж"
 STP_cw_western_frontier_desc: "Укрепим столичный узел и подготовим план обороны республик на §Y35 дней§!. Его можно ввести за £command_power_texticon §Y25§!, пока мы контролируем [43.GetName] и воюем с Кефрейтом. Повторный приказ доступен через §Y56 дней§! после предыдущего; действующие наступление, оборона или перегруппировка должны закончиться."
 STP_cw_first_postwar_budget: "Первый мирный бюджет"
 STP_cw_first_postwar_budget_desc: "Победитель вернёт государственные расходы к обычному бюджету. Внешние конфликты не отменяют восстановления Стеландера; горные республики принимают свой бюджет после завершения собственной войны."
 STP_cw_restore_civil_authority: "Вернуть гражданскую власть"
 STP_cw_restore_civil_authority_desc: "Вернём управление гражданским ведомствам. Политическая сеть и чрезвычайные полномочия кабинета будут распущены. В Стеландере завершится кризис преемственности: штраф к стабильности после смерти Иванова будет снят. Накопленные улучшения военного управления сохранятся."
 STP_cw_uprising_conditions_tt: "Подготовлен приказ, идут выборы и сохранены исходные территории Стеландера. Нодрул ведёт войну хотя бы с одной действующей северной армией."
 STP_cw_external_intervention: "Внешнее вмешательство"
 STP_cw_external_intervention_desc: "Решения Нодрула и Кефрейта определяют их участие в конфликтах на территории бывшего Стеландера."
 STP_cw_nod_warning: "[STPGetNodReadinessTitle]"
 STP_nod_readiness_north: "Нодрул воюет на севере"
 STP_nod_readiness_mobilization: "Нодрул мобилизует северный фронт"
 STP_nod_readiness_intervention: "Нодрул готовит интервенцию!"
 STP_cw_nod_warning_desc: "§YСейчас:§! [STPGetNodStatus]\n\nЭтот отсчёт показывает готовность штаба к будущему вмешательству в Стеландере, а не срок нападения на Юбору. Подготовка идёт параллельно северной кампании. По истечении срока Нодрул готов к выступлению, но северный фронт блокирует вступление; после окончания северной войны нужны ещё семь дней на переброску.\n\nПобедите партию раньше, чтобы сорвать интервенцию. Подготовленные пограничные свидетельства позволяют один раз задержать готовность на десять дней; оружие северным противникам помогает им удерживать настоящую линию фронта."
 STP_cw_val_ultimatum: "Ультиматум Кефрейта: 21 день"
 STP_cw_val_ultimatum_desc: "Кефрейт отдал приказ о мобилизации против Союза Возрождения Окцидии. До конца 21-дневного ультиматума республики остаются в мире. Затем начнётся отдельная война, если обе страны сохранят независимость, общую границу и не вступят в другую войну или фракцию. Потеря западных территорий возможна только после военного поражения."
 STP_cw_nod_northern_diversion: "Нодрул готов, но связан на севере"
 STP_cw_nod_northern_diversion_desc: "Подготовка интервенции завершена. Нодрул не может вступить, пока против него держится хотя бы одна северная армия. После окончания северной войны останется семь дней на переброску. Нового полного срока подготовки не будет."
 STP_cw_nod_intervention_cancelled: "Вмешательство Нодрула недоступно"
 STP_cw_nod_intervention_cancelled_desc: "Нодрул не сможет вступить на стороне партии в этой гражданской войне. Причиной может быть его поражение на севере, разгром партии, подчинение участников или срыв условий вступления. Отменённая подготовка не возобновится; повторная интервенция в этот конфликт не предусмотрена."
 STP_cw_nod_intervention_entered: "Нодрул вступил в войну"
 STP_cw_nod_intervention_entered_desc: "Войска Нодрула воюют на стороне партии против сопротивления. Северная стратегия дала нам время, но теперь придётся удерживать расширившийся фронт."
 ADISCORD_STP_cw.40.t: "Слухи о готовящейся интервенции"
 ADISCORD_STP_cw.40.d: "Наши посредники сообщают о приготовлениях Нодрула. Его правительство намерено поддержать партийные силы, если борьба за власть в Стеландере перейдёт в войну. Штаб уже начал подготовку.\n\nСеверные противники могут удержать его армию, но не остановят работу штабов и складов. Если подготовка завершится раньше северной войны, после её окончания останется лишь семь дней на переброску. Нам придётся решить, сколько времени потратить на собственную подготовку и когда выступить. Разгром партийных сил до вступления Нодрула лишит интервенцию основания."
 ADISCORD_STP_cw.40.a: "Проверить готовность и сроки."
 ADISCORD_STP_cw.41.t: "Нодрул пришёл за партией"
 ADISCORD_STP_cw.41.d: "Колонны Нодрула получили приказ вступить в войну против сопротивления. Партийное правительство рассчитывает вернуть страну при помощи внешней армии.\n\nВосстание продолжается. Теперь нам нужно выдержать удар нового противника."
 ADISCORD_STP_cw.41.a: "Удержать фронт."
 ADISCORD_STP_cw.42.t: "Приготовления на южной границе"
 ADISCORD_STP_cw.42.d: "Борьба за власть в Стеландере угрожает перерасти в войну. Поддержка партийных сил позволит сохранить наше влияние на юге, но потребует подготовки армии и складов.\n\nМы можем начать 135-дневную подготовку уже сейчас. Северная война не остановит её, однако армия сможет вступить в Стеландер только после окончания северной кампании и семи дней на переброску. Если партийные силы будут разгромлены раньше, основание для интервенции исчезнет. Решение об участии остаётся за нашим правительством."
 ADISCORD_STP_cw.42.a: "Поддержать партийное правительство."
 ADISCORD_STP_cw.42.b: "Не вмешиваться в гражданскую войну."
 STP_cw_nod_consent_tt: "Начнётся независимая подготовка интервенции на §Y135 дней§!. Северная война блокирует вступление, но не отсчёт. После окончания северной кампании войскам нужны §Y7 дней§! на переброску. Разгром партии или поражение Нодрула отменит вмешательство."
 NOD_cw_intervention_preparation: "Подготовка помощи партийной армии"
 NOD_cw_intervention_preparation_desc: "Подготовка продолжается независимо от выборов и войны на севере. После её завершения армия готова поддержать партийные силы. Вступление требует окончания северной войны, семи дней переброски и продолжающихся боёв партии с Шабратом."
 STP_cw_nod_neutrality: "Нодрул сохраняет нейтралитет"
 STP_cw_nod_neutrality_desc: "Правительство Нодрула отказалось участвовать в гражданской войне. Освобождение его армии на севере больше не запустит подготовку вмешательства."
 ADISCORD_STP_cw.43.t: "Нодрул завершает вмешательство"
 ADISCORD_STP_cw.43.victory: "Сопротивление разбито. Его земли возвращены партийной администрации Стеландера; Нодрул не присоединяет их к себе.\n\nНаша операция завершена, поддержка войны выросла на 5 процентных пунктов. Другие войны продолжаются на прежних условиях."
 ADISCORD_STP_cw.43.withdrawal: "Партийное правительство потерпело поражение. Основание для нашей операции исчезло, и штаб отозвал приказ о вмешательстве.\n\nВойна с сопротивлением завершена; остальные войны сохраняются. Повторная интервенция в этот конфликт не планируется."
 ADISCORD_STP_cw.43.defeat: "Сопротивление нанесло поражение экспедиционной армии и вынудило Нодрул прекратить вмешательство. Война с ним завершена без присоединений.\n\nПоддержка войны снизилась на 5 процентных пунктов. Другие войны сохраняются."
 ADISCORD_STP_cw.43.a: "Операция окончена."

 ADISCORD_STP_preparation.1.b: "Положиться на партию."

 STP_cw_first_decline_tt: "Состоится приём у Иванова. Его здоровье впервые ухудшится; в событии мы выберем Шабрата или партию."

 STP_cw_branch_choice_tt: "Выбор сделан в событии первого ухудшения здоровья Иванова. Доступна подготовка выбранной стороны."
 STP_cw_army_split_tt: "Абилия всегда переходит Шабрату. Досрочный базовый план: партия — §Y28§! территориальных бригад, Шабрат — §Y26§!, республики — §Y14§!; основным сторонам дополнительно планируется по §Y4 усиленные дивизии§!. При обычном исходе выборов победитель получает ещё две бригады, проигравший теряет две. Ограниченный мятеж оставляет партии §Y8§! бригад и §Y2§! усиленные дивизии; у Шабрата планируются §Y28§! и §Y4§!, у республик — §Y14§! бригад. Подготовленные части добавляются отдельно и имеют приоритет. Фактические силы ограничены реальными людьми и всеми видами оружия."
 STP_cw_party_preparation_tt: "Откроется карта регионов. Фокус «Партийная дисциплина» даст проверки окружного командования. Первая операция подполья длится 60 дней, последующие — 28. При успехе оно усиливается в одном из непроверенных округов и сдвигает легитимность на 4% к Шабрату. Проверки срывают его военную подготовку; доказанное подполье укрепляет легитимность партии, пустые обыски ослабляют её. Выборы определят мандат и доли армейских резервов. Гражданская война начнётся при любом результате."

 STP_cw_officers_tt: "При расколе Эдмунд Равель перейдёт к Шабрату. Сопротивление получит 10 опыта армии и 15 командного ресурса. Показанные изменения военного управления начнут действовать у сопротивления после раскола; до него партийная армия их не получает."

 STP_cw_young_officers_tt: "При расколе Северин Дрейк перейдёт к Шабрату, а сопротивление получит 15 опыта армии. Подготовленные офицеры улучшат восстановление организации его армии. Показанный бонус начнёт действовать после раскола."

 STP_cw_operation_slot_tt: "Можно одновременно проводить ещё одну операцию подготовки."

 STP_cw_livonn_agreement_tt: "Действующий договор с советами Ливонинского округа будет ратифицирован. Партийные проверки больше не смогут отменить §Yсоглашение о переходе региона 45 к Шабрату§!. Остальные активы округа остаются уязвимыми. При сохранности договора к расколу сопротивление и западные республики получат §Yгарантии окружным советам§!: стабильность +3% и возможность оплачивать снабжение республик против Кефрейта. После восстановления гражданской власти Шабрат определит судьбу хартии."


 STP_cw_local_recruits_tt: "Подготовим две постоянные бригады сопротивления. Каждая требует £manpower_texticon §Y4000§! и £infantry_equipment_texticon §Y320§! из его запасов; людей зарезервируем до общего распределения. Показанное улучшение начнёт действовать у всей армии сопротивления после раскола и сохранится после войны."

 STP_cw_reserve_brigade_tt: "£infantry_equipment_texticon §Y1600§! единиц снаряжения будут списаны с государственных складов и зарезервированы в Абилии для сопротивления. При расколе план позволит развернуть две дополнительные бригады при наличии людей и оружия в его резервах. Запас и место на складах проверяются повторно при завершении фокуса."

 STP_cw_warehouse_service_tt: "Показанное улучшение снабжения получит вся армия сопротивления после раскола; оно сохранится после войны."

 STP_cw_supply_depot_tt: "Влияние сопротивления в Хосхейте: §G+10§!. Склад можно подготовить отдельным решением. Показанные изменения военного управления получит сопротивление после раскола; партийная армия их не получает."
 STP_cw_niansas_administration_tt: "В регионе §Y[3.GetName]§! подготовлена администрация сопротивления. Она помогает сохранить гражданское управление и передать округ при достаточной местной поддержке. Партийная проверка может сорвать договорённость."
 STP_cw_early_orders_tt: "С первого дня войны сопротивление получит на §Y35 дней§!: атаку армии §G+8%§! и скорость планирования §G+10%§!. Штаб также получит §G10§! опыта армии и £command_power_texticon §Y15§! командного ресурса."

 STP_cw_secure_niansas_tt: "В Ниансасе изымаются тайники и снимаются подготовленные подпольем чиновники; влияние партии +15. Защита от работы связных: 56 дней."

 STP_cw_secure_garrisons_tt: "В Новой Монаии и Крейдене изымаются тайники и разрываются связи подполья; влияние партии §G+15§! в каждом. Окружные операции блокируются на §Y56§! дней. При расколе каждый из этих округов, оставшийся у партии, позволит сформировать две дополнительные бригады. На каждую нужны £manpower_texticon §Y4000§! человек и £infantry_equipment_texticon §Y320§! единиц снаряжения из её резервов."

 STP_cw_secure_depots_tt: "В Хосхейте и Старом фадском лесу изымаются тайники и разрываются связи подполья; влияние партии +15 в каждом. Защита от работы связных: 56 дней."

 STP_cw_party_reserve_tt: "При расколе партия сможет сформировать две дополнительные бригады. Каждая потребует £manpower_texticon §Y4000§! человек и £infantry_equipment_texticon §Y320§! единиц снаряжения из её резервов."

 STP_cw_party_defence_tt: "С первого дня войны партия получит +8% к защите армии на 35 дней."

 STP_cw_kefreyt_offer_tt: "Кефрейт получит запрос на §Yтри усиленные добровольческие дивизии§! для армии Шабрата. При согласии он оплатит их из собственных резервов. Готовые части прибудут при расколе; при нехватке резервов Кефрейт продолжит комплектование и сможет отправить их уже во время войны. После её завершения контингент будет отозван; состав и набор закреплены."



 STP_cw_check_district_command: "Проверить окружное командование: [FROM.GetName]"

 STP_cw_check_district_command_desc: "За 21 день изымем тайники, снимем завербованных чиновников и разорвём связи с гарнизоном. Влияние партии вырастет на 15; окружные операции подполья будут заблокированы на 56 дней. Найденные структуры сдвинут легитимность на 4% к партии, пустая проверка — на 2% к Шабрату. Операция занимает один слот.\n\nВ Новой Монаии и Крейдене дополнительно подготовим партийные гарнизоны: при сохранении округа за партией каждый позволит оплатить ещё две территориальные бригады из её запасов."

 ADISCORD_STP_preparation.6.t: "Посланник Шабрата"

 ADISCORD_STP_preparation.6.d: "Шабрат просит прислать три усиленные добровольческие дивизии с артиллерией и ПВО. Для их формирования потребуется 23 700 человек, 1830 винтовок, 144 комплекта вооружения отделений, 90 единиц дополнительного оснащения, 180 артиллерийских орудий и 60 средств ПВО из наших резервов. Если запасов недостаточно, согласие сохраняется, а части остаются на комплектовании.\n\nЧасти перейдут под его командование при расколе Стеландера и вернутся домой после войны. Их состав останется закреплённым. Соглашение не предусматривает территориальных уступок или вступления Кефрейта в войну."

 ADISCORD_STP_preparation.6.a: "Подготовить добровольческие дивизии."

 ADISCORD_STP_preparation.6.b: "Отказать в военной помощи."

 ADISCORD_STP_preparation.7.a: "Принято."

 ADISCORD_STP_preparation.8.t: "Ответ Кефрейта"

 ADISCORD_STP_preparation.8.accepted: "Кефрейт согласился подготовить три усиленные добровольческие дивизии с артиллерией и ПВО. Люди и оснащение уже выделены из его резервов. Части перейдут под наше командование при расколе Стеландера и останутся до завершения войны. Их состав и набор закреплены."

 ADISCORD_STP_preparation.8.refused: "Кефрейт отказал в поставке. Оружие не выделено. Подготовку придётся продолжить за счёт собственных запасов."

 STP_cw_abila_reserve: "Резерв Абилии"
 STP_cw_abila_reserve_desc: "За 28 дней подготовим резервистов и переведём £infantry_equipment_texticon §Y1600§! единиц снаряжения на склад Абилии. При расколе сопротивление сможет развернуть две дополнительные бригады, оплатив их из собственных людей и оружия. Запас в Абилии не участвует в общем разделе государственных складов."
 STP_cw_warehouse_inventory: "Складская служба"
 STP_cw_warehouse_inventory_desc: "Снабженцам нужны согласованные заявки, надёжные кладовщики и порядок выдачи имущества. За 28 дней подготовим эту службу для будущей армии сопротивления. После раскола она будет расходовать на 8% меньше припасов; улучшение сохранится после войны. Запасы оружия можно пополнять отдельными решениями."
 STP_cw_supply_officers: "Офицеры снабжения"
 STP_cw_supply_officers_desc: "Снабженцы согласуют выдачу имущества будущим частям. После раскола военное управление сопротивления получит скорость планирования +10% и потребление припасов -8%. Сейчас укрепятся связи в регионе [46.GetName] и откроется подготовка окружного склада. Для склада потребуются время, средства и сохранение местных связей."
 STP_cw_district_administration: "Администрация Ниансаса"
 STP_cw_district_administration_desc: "Чиновники региона [3.GetName] признают штаб Шабрата стороной переговоров. Подготовленная администрация укрепит его избирательный мандат и сможет передать управление после объявления результата. Договорённость действует, пока партийная комиссия не сменит местных служащих."
 STP_cw_courier_service: "Служба связных"
 STP_cw_courier_service_desc: "Постоянные связные улучшат работу сети сторонников и доставку документов. Штаб получит дополнительный политический ресурс, а осторожная передача распоряжений снизит подозрения партии."
 STP_cw_operational_orders: "Приказы округам"

 STP_cw_operational_orders_desc: "Командиры заранее получат задачи на первые недели выступления. Сопротивление вступит в войну с подготовленным наступательным планом на 35 дней."

 STP_cw_capital_reserve: "Резерв столицы"

 STP_cw_capital_reserve_desc: "Подготовим развёртывание двух дополнительных бригад в Фаде. При расколе каждая потребует £manpower_texticon §Y4000§! человек и £infantry_equipment_texticon §Y320§! единиц снаряжения из партийных резервов."

 STP_cw_protect_congress: "Охрана Бронзового конгресса"

 STP_cw_protect_congress_desc: "Укрепим подступы к Бронзовому конгрессу и подготовим оборонительный план. В столице появится укрепление; первые 35 дней войны партийная армия получит +8% к защите."

 STP_cw_opposition_preparation: "Подготовка связных Шабрата"
 STP_cw_opposition_preparation_desc: "Цель операции: §Y[STPGetOppositionTarget]§!. Цель объявляется заранее и показана на карте. Первая операция длится 60 дней, последующие — 28; оставшееся время указано у миссии. Проверка командования за 21 день срывает подготовку; новая цель появится после окончания нынешнего срока. Успех даёт 12 влияния и сдвигает легитимность на 4% к Шабрату. Сначала подполье добивается закреплённой позиции и местной администрации; следующая операция готовит гарнизон, склад за 100 из казны или диверсантов за 240 винтовок из общего запаса. Военные результаты и условия указаны на карте. Обычный итог выборов ведёт к большой войне; исключительный мандат с признанием командования и окружных управлений может ограничить мятеж."

 STP_cw_treasury_100_tt: "Казна: §G+100§!. Средства сверх предела казны не сохраняются."

 STP_cw_suspicion_minus_5_tt: "Подозрения партии: §G-5§! (не ниже 0)."

 STP_cw_suspicion_minus_10_tt: "Подозрения партии: §G-10§! (не ниже 0)."

 STP_cw_suspicion_8_tt: "Подозрения партии: §R+8§! (не выше 100)."

 STP_cw_suspicion_10_tt: "Подозрения партии: §R+10§! (не выше 100)."

 STP_cw_niansas_influence_tt: "Влияние сопротивления в Ниансасе: §G+12§!."

 STP_cw_headquarters_tt: "Штаб открывает переговоры с окружными чиновниками и защиту местных связей во время партийных проверок."
 STP_cw_private_payments: "Закрытые выплаты"
 STP_cw_private_payments_desc: "Договорённости с чиновниками оплачиваются через расходы на управление. Надбавка действует 70 дней; новое соглашение возобновляет её срок. Раскол государства прекращает выплаты досрочно."
 STP_cw_arsenal_shifts: "Дополнительные смены"
 STP_cw_arsenal_shifts_desc: "Арсеналы на 140 дней переходят на расширенный график. Выпуск военных заводов и скорость роста эффективности производства увеличиваются на 25%."
 STP_cw_forest_officials_tt: "В Старом фадском лесу влияние сопротивления: §G+12§!. Подготовлена администрация для перехода округа к Шабрату. Для перехода влияние должно оставаться закреплённым до раскола. Партийная проверка может сорвать подготовку."
 STP_cw_port_supply_tt: "При расколе сохранившийся склад Ниансаса, перешедший к сопротивлению, один раз даст его армии на §Y21§! день: расход снабжения §G-10%§!, восстановление организации §G+5%§!. Второй склад не усилит и не продлит этот общий эффект. Дополнительно передадим §Y500§! топлива из запасов партии, если его достаточно. Проверка партии может сорвать подготовку."
 STP_cw_council_envoys_tt: "Влияние местных сил в Ливонинском округе: §Y+10§!. Соглашение об автономии ещё не заключено: при расколе округ может перейти республикам, если местные силы сохранят наибольшее влияние."
 STP_cw_border_evidence_tt: "Штаб Шабрата сможет один раз потратить £political_power_texticon §Y35§! и продлить действующую подготовку интервенции на §G10 дней§!. Ответ доступен до и после раскола, пока Нодрул ещё готовит войска."
 STP_cw_network_transfer_tt: "Работа с делегатами, ведомственными документами и связными усиливает одну сеть сторонников. При расколе её накопленные возможности перейдут Шабрату. Сеть распускается после возвращения гражданской власти."
 STP_cw_civil_authority_ideas_tt: "Политическая сеть и чрезвычайные полномочия кабинета прекращают действовать. У партии также снимается штраф к стабильности после смерти Иванова. Накопленные улучшения военного управления сохраняются."
 STP_cw_resistance_network_dynamic: "Сеть сторонников"
 STP_cw_resistance_network_dynamic_desc: "Посредники и служащие поддерживают сторонников Шабрата. Проверка связей и работа с документами постепенно усиливают одну сеть. При расколе она перейдёт сопротивлению."
 STP_cw_party_administration_dynamic: "Партийное управление"
 STP_cw_party_administration_dynamic_desc: "Министры и президиум согласуют работу ведомств. Проведённые меры накапливаются здесь и поддерживают власть партии до возвращения гражданского управления."
 STP_cw_military_staff_dynamic: "Военное управление"
 STP_cw_military_staff_dynamic_desc: "Работа штаба, подготовка офицеров и снабжение определяют возможности армии. Каждая проведённая мера дополняет ранее принятые. Эти улучшения сохраняются после войны."
 STP_party_suspicion_dynamic_modifier: "Подозрения спецслужб"
 STP_party_suspicion_dynamic_modifier_desc: "Рост подозрений затрудняет работу сторонников Шабрата и снижает прирост политической власти. Эффект действует до начала восстания или завершения выборов."

 STP_cw_command_power_25_cost: "£command_power_texticon §Y25§!"
 STP_cw_command_power_25_cost_blocked: "£command_power_texticon §R25§!"
 STP_cw_command_power_25_cost_tooltip: "Стоимость: £command_power_texticon §Y25§!"
 STP_cw_launch_last_banquet: "Начать операцию «Последний банкет»"
 STP_cw_launch_last_banquet_desc: "Наступление на 21 день: атака +15%, прорыв +20%, скорость планирования +10%. Требуются война с партией и контроль Ниансаса. Приказ стоит 25 командного ресурса; повторный запуск возможен через 42 дня. Во время наступления нельзя начать оборонительный план или перегруппировку."
 STP_cw_purchase_arsenal_batch: "Выкупить готовое вооружение"
 STP_cw_purchase_arsenal_batch_desc: "Военный совет выкупит партию восстановленного оружия у частных мастерских: 1600 винтовок, 60 орудий, 48 комплектов группового оружия, 30 единиц дополнительного оснащения и 20 зенитных орудий. Поставка поступает сразу; следующая партия будет доступна через 42 дня. Сначала пополните действующие части, затем формируйте новые."
 STP_cw_arsenal_batch_cost: "£ADISCORD_economy_treasury_texticon §Y35§!"
 STP_cw_arsenal_batch_cost_blocked: "£ADISCORD_economy_treasury_texticon §R35§!"
 STP_cw_arsenal_batch_cost_tooltip: "Стоимость: £ADISCORD_economy_treasury_texticon §Y35§!"
 STP_cw_regroup_the_front: "Перегруппировать фронт"
 STP_cw_regroup_the_front_desc: "На 21 день восстановление организации увеличится на 25%, потребление припасов снизится на 15%, атака снизится на 20%. Приказ стоит 25 командного ресурса и исключает боевые планы до окончания срока. Повторный запуск возможен через 42 дня. С окончанием войны действие приказа прекращается."
 STP_cw_train_reserve_brigades: "Подготовить две резервные бригады"
 STP_cw_train_reserve_brigades_desc: "На 21 день резервируются 8000 людей и 640 винтовок; организация обучения стоит 40 политической власти. Затем наша страна получит две полностью укомплектованные территориальные бригады с начальным опытом 30%. Они появятся в собственных контролируемых регионах. При закрытии военной угрозы, капитуляции или утрате всех таких регионов люди и оружие возвращаются в запас; политическая власть не возвращается. Одновременно готовится один резерв. До окончания конфликта состав мобилизационных частей закреплён. После мира их шаблоны можно изменять; срочные заказы закрываются."
 STP_cw_reserve_training_start_tt: "На 21 день из доступного запаса нашей страны будут выделены £manpower_texticon §Y8000§! людей и £infantry_equipment_texticon §Y640§! винтовок. Организация обучения стоит £political_power_texticon §Y40§!."
 STP_cw_reserve_training_result_tt: "Наша страна получит §Y2§! полностью укомплектованные территориальные бригады с начальным опытом §Y30%§! в собственных контролируемых регионах. Люди и оружие уже оплачены. При капитуляции, прекращении военной угрозы или утрате всех мест формирования резерв вернётся в запас. Республики могут готовить части и до нападения Кефрейта, пока сохраняется его угроза."
 STP_cw_expand_arsenal: "Расширить арсенал в регионе [FROM.GetName]"
 STP_cw_expand_arsenal_desc: "Вложим 100 единиц казны в новый военный завод в регионе [FROM.GetName]. Работы займут 35 дней и снизят общий выпуск военных заводов на 10%. Одновременно ведётся один проект. При потере региона, капитуляции или прекращении военной угрозы проект отменяется и возвращает 50 единиц казны; остальные средства уже потрачены на работы. Республики могут строить арсеналы и до нападения Кефрейта, пока сохраняется его угроза."
 STP_cw_deliberate_offensive: "Подготовленное наступление"
 STP_cw_deliberate_offensive_desc: "Штаб сосредоточил артиллерию и согласовал действия ударных частей на главном направлении. Военный совет не может сменить приказ до окончания операции."
 STP_cw_static_defence: "Позиционная оборона"
 STP_cw_static_defence_desc: "Части закрепляются на рубежах, жертвуя подвижностью и наступательными возможностями."
 STP_cw_front_reorganization: "Перегруппировка фронта"
 STP_cw_front_reorganization_desc: "Подразделения восстанавливают организацию и сокращают расход припасов. До окончания перегруппировки наступательные возможности ограничены."
 STP_cw_reserve_training_cost: "£political_power_texticon §Y40§! £manpower_texticon §Y8000§! £infantry_equipment_texticon §Y640§!"
 STP_cw_reserve_training_cost_blocked: "£political_power_texticon §R40§! £manpower_texticon §R8000§! £infantry_equipment_texticon §R640§!"
 STP_cw_reserve_training_cost_tooltip: "Стоимость: £political_power_texticon §Y40§! £manpower_texticon §Y8000§! £infantry_equipment_texticon §Y640§!"
 STP_cw_arsenal_expansion_cost: "£ADISCORD_economy_treasury_texticon §Y100§!"
 STP_cw_arsenal_expansion_cost_blocked: "£ADISCORD_economy_treasury_texticon §R100§!"
 STP_cw_arsenal_expansion_cost_tooltip: "Стоимость: £ADISCORD_economy_treasury_texticon §Y100§!"
 STP_cw_livonn_active_agreement_tt: "В подконтрольном Стеландеру Ливонинском округе действует оплаченный договор с местными советами"

 STP_cw_hold_the_pier: "Ввести план обороны набережной"
 STP_cw_hold_the_pier_desc: "Оборонительный план на 35 дней: защита +15%, атака -15%, скорость армии -10%. Требуются контроль Фады и война с сопротивлением. Приказ стоит 25 командного ресурса; повторный запуск возможен через 56 дней. Наступление и перегруппировка недоступны до окончания плана."
 STP_cw_defend_western_frontier: "Ввести план обороны республик"
 STP_cw_defend_western_frontier_desc: "Оборонительный план на 35 дней: защита +15%, атака -15%, скорость армии -10%. Требуются контроль региона [43.GetName] и война с Кефрейтом. Приказ стоит 25 командного ресурса; повторный запуск возможен через 56 дней. Наступление и перегруппировка недоступны до окончания плана."
 STP_cw_started: "Гражданская война началась"
 STP_cw_union_wars_finished: "Гражданская война в Стеландере завершена"
 STP_cw_elections_finished: "Выборы председателя завершены"
 STP_sided_with_Maksim_flag: "Поддержан Шабрат"
 STP_sided_with_the_party_flag: "Поддержана партия"
 STP_cw_headquarters_ready: "Штаб Шабрата сформирован"
 STP_cw_garrison_program: "Подготовлены связи с гарнизонами"
 STP_cw_northern_crisis_pending: "Нодрул готовит северную кампанию"
 STP_cw_recruitment_program: "Открыта программа территориальных бригад"
 STP_cw_uprising_prepared: "Подготовлен план восстания"
 STP_party_counterintelligence_asset: "В округе действует партийная контрразведка"
 STP_region_player_operations_allowed: "В округе можно проводить политические операции"
 ADISCORD_STP_cw.30.shabrat: "Шабрат выиграл выборы, но партия сохранила достаточно военных и административных связей, чтобы начать большую войну. Его мандат поможет восстанавливать организацию, защищать свою территорию и готовить резервы.\n\nАбилия передана его стороне. Базовый план — 28 территориальных бригад Шабрата, 26 партийных, 14 республиканских и по четыре усиленные дивизии у двух основных сторон. Подготовленные части имеют приоритет. Фактическое число зависит от людей и вооружения. После выбора стороны начнутся боевые действия."
 ADISCORD_STP_cw.30.party: "Партийный аппарат удержал протокол выборов. Штаб Шабрата объявил результат навязанным, а западные советы провозгласили независимость.\n\nАбилия передана Шабрату. Базовый план: 30 партийных, 24 повстанческие и 14 республиканских территориальных бригад; у двух основных сторон также планируется по четыре усиленные дивизии. Подготовленные формирования имеют приоритет, остальные люди и оружие распределены в пользу партии. Фактическая армия зависит от полного комплекта ресурсов. После выбора стороны начнутся боевые действия."
 STP_cw_legitimacy_initialized: "Открыта борьба за легитимность"

 STP_cw_shabrat_election_victory: "Шабрат получил избирательный мандат"

 STP_cw_party_election_victory: "Партия удержала протокол выборов"

 STP_battle_for_stelander_active: "Продолжается подготовка к расколу Стеландера"

 STP_cw_delay_inspection: "Затянуть работу комиссии"

 STP_cw_delay_inspection_desc: "Наши люди потребуют сверить дополнительные ведомости и повторно опросить свидетелей. За £political_power_texticon §Y35§! текущая проверка сразу продлится на §Y14 дней§!. На эти же §Y14 дней§! будет занят один слот подготовки: для ложного следа или другой операции понадобится свободный второй слот. После завершения повторное применение закрыто на §Y60 дней§!. При прекращении подготовки слот освобождается; политическая власть не возвращается."

 STP_cw_open_civil_registers: "Открыть гражданские реестры"
 STP_cw_open_civil_registers_desc: "Предъявим комиссии гражданские документы и распустим местную военную сеть. За £political_power_texticon §Y25§! администрация останется на нашей стороне, но связи с гарнизоном, снабжение и диверсии будут потеряны. Оружие из местного резерва вернётся владельцу округа; добровольцы Кефрейта вернутся домой. Эвакуированных частей эта уступка не создаёт.\n\nОтвет выполняется сразу и не занимает слот. До окончания комиссии местные операции приостановятся; уже начатые операции сети отменятся. Их политическая власть и расходы казны не возвращаются, выделенное оружие возвращается только один раз. Легитимность сместится на §R2%§! к партии. После проверки военные связи можно восстановить за полную цену."
 STP_cw_civil_registers_result_tt: "Гражданская администрация сохранится. Связи с гарнизоном, снабжение и диверсии в округе будут распущены; оружейный резерв вернётся владельцу округа, добровольцы — Кефрейту. Текущие операции местной сети отменятся без возврата политической власти и расходов казны. До конца комиссии новые местные операции недоступны."
 STP_cw_civil_registers_command_risk_tt: "§RЕсли это последний подготовленный гарнизон в [2.GetName] или [29.GetName], договор с командованием потеряет силу.§! Незавершённые переговоры отменятся без возврата £political_power_texticon §Y75§!. Уже заключённое обязательство перестанет усиливать мандат и обеспечивать ограниченный мятеж, пока не восстановлен гарнизон."

 STP_cw_sacrifice_local_contact: "Сдать окружного чиновника"

 STP_cw_sacrifice_local_contact_desc: "Назовём комиссии чиновника, который подписывал наши документы. Его связи с администрацией будут потеряны сразу, зато текущая проверка не тронет готовые гарнизонные связи, снабжение, диверсии и запасы. До окончания проверки работа в округе остановится.\n\nЭто снижает шансы передать округ сопротивлению: заново завербовать администрацию можно будет после проверки. Договор с местным советом, если он есть, сохраняется. Ответ выполняется сразу за §Y25§! политической власти и не занимает слот. Подозрения снизятся на §G4§!, легитимность сместится на §R2%§! к партии."

 STP_cw_surrender_contact_tt: "Местная администрация сопротивления будет потеряна. Текущая проверка сохранит остальные готовые активы и резервы, но до её завершения новые окружные операции недоступны. Подозрения: §G-4§! (не ниже 0)."

 STP_false_trail_in_progress: "Готовится ложный след для текущей комиссии"

 STP_false_trail_prepared: "Ложный след для текущей комиссии подготовлен"

 STP_inspection_concession_prepared: "Условия комиссии приняты; работа в округе приостановлена"

 STP_cw_prepared_supply_lines: "Подготовленные маршруты снабжения"

 STP_cw_prepared_supply_lines_desc: "Заранее подготовленные склады обеспечивают первые недели мобилизации сопротивления. На 21 день снижается расход припасов и ускоряется восстановление организации. Достаточно одного сохранённого склада в Ниансасе или Хосхейте; второй не удваивает этот общий эффект."
 STP_cw_party_battle_spirit: "Битва за Стеландер"
 STP_cw_party_battle_spirit_desc: "Регулярные части партии держатся за единый штаб и установленный порядок. Слаженность подразделений и подготовка приказов помогают им удерживать фронт против сопротивления. Дух действует до окончания этой войны."
 STP_cw_resistance_battle_spirit: "Битва за Стеландер"
 STP_cw_resistance_battle_spirit_desc: "Отряды сопротивления опираются на местные связи, быстро меняют позиции и возвращаются в строй после боя. Даже потеря важных центров не означает немедленного отказа от борьбы. Дух действует, пока продолжается война с партией или вступившим на её стороне Нодрулом."
 STP_cw_republics_battle_spirit: "Битва за Стеландер"
 STP_cw_republics_battle_spirit_desc: "Горные общины защищают собственные перевалы и селения. Знание местности помогает быстрее укреплять позиции и глубже окапываться. Дух появляется при нападении Кефрейта и снимается после окончания этой отдельной войны."

 ADISCORD_STP_preparation.15.t: "Нектар богов"
 ADISCORD_STP_preparation.15.d: "В Стеландере утро начиналось поздно. К девяти солнце уже отражалось от фасадов прибрежных гостиниц, но улицы только оживали. Рабочие смывали с мостовой остатки вчерашнего фестиваля. Из окон доносилась музыка, над портом поднимались пассажирские дирижабли.\n\nУ киоска напротив Центрального вокзала уже собралась очередь. На витрине стояли десятки одинаковых бутылочек из матового стекла. Золотая этикетка изображала чашу, над которой восходило солнце. «НЕКТАР БОГОВ» Ниже мелким шрифтом значилось: «Лицензировано Палатой Высших Домов и Привилегированных Гильдий. Употребляйте ответственно. Наслаждайтесь свободно».\n\nПутеводители советовали иностранцам попробовать нектар сразу после прибытия. Его подавали в казино, ночных клубах и дорогих ресторанах. Более дешёвые сорта продавались в автоматах возле фабрик и общежитий.\n\nОдни утверждали, что он делает музыку лучше, другие — что с ним легче заговорить с незнакомцем. Третьи покупали бутылочку после смены и сидели перед домом, глядя на отражения курортных огней в воде.\n\nПравительство никогда не называло это наркотиком. В официальных документах использовалось выражение «рекреационный препарат общего доступа».\n\nКогда-то подобные вещества продавались подпольно. За одну дозу можно было получить тюремный срок, а за торговлю несколькими ящиками лишиться имущества. Затем пришёл Иванов.\n\nОн говорил, что государство не должно указывать человеку, чем заниматься в собственной спальне, что пить за собственным столом и каким способом забывать о тяжёлом рабочем дне. После десятилетий мобилизации, комендантских часов и похорон это звучало почти революционно.\n\nСтеланд устал. Здесь помнили войну не по памятникам. Ещё жили люди, способные отличить приближающийся воркерландский бомбардировщик по звуку двигателя. Старики рассказывали о зимах, когда дети спали в тоннелях, где было безопаснее, чем дома.\n\nДля них свобода означала не парламент и не конституцию. Свобода означала ночь без сирены.\n\nПосле Фадского пакта самолёты действительно исчезли. Горные союзы сдали оружие. Дороги открылись. В порт снова пришли иностранные суда. На месте военных складов появились гостиницы. Там, где когда-то распределяли патроны, теперь продавали вино, таблетки, стимуляторы и знаменитый нектар."
 ADISCORD_STP_preparation.15.a: "Свобода означала ночь без сирены."
 ADISCORD_STP_preparation.16.t: "Цена спокойной жизни"
 ADISCORD_STP_preparation.16.d: "На каждой второй площади стоял Иванов. Бронзовый — с поднятой рукой, мраморный — с ребёнком. Молодой на плакатах времён мира, старый на государственных экранах.\n\nПод одним из таких экранов мужчина в рабочей куртке забрал у продавца бутылочку и сделал несколько глотков прямо у прилавка. Экран показывал хронику. Чёрно-белые кадры разрушенного горного посёлка сменились цветной панорамой современной столицы. Затем появились туристы, казино и дети, бегущие через фонтан. Голос диктора был спокойным. «Наши отцы знали цену войны. Наши дети имеют право её не знать».\n\nМужчина допил нектар и выбросил бутылку. За ним стояла пожилая женщина с продуктовой сумкой. Когда диктор произнёс слово «Стеландер», женщина едва слышно сказала: «Стеланд». Никто не обратил внимания. Очередь двигалась дальше.\n\nЗа двадцать лет легализация превратилась в одну из самых прибыльных отраслей страны. Высшие Дома получили лицензии на производство. Гильдии контролировали поставки. Иностранцы приезжали в Стеландер за тем, за что дома им грозил арест.\n\nГосударство получало налоги. Рабочий получал вечер, который проходил немного быстрее. Турист получал историю для друзей. Палата называла это свободой. И в каком-то смысле это была свобода. Здесь почти никто не интересовался, с кем человек спал, что он пил, во что играл и сколько денег оставлял за столом казино.\n\nЛишь несколько тем воспитанный человек предпочитал не затрагивать. Не стоило спрашивать, кому принадлежат шахты. Или внимательно читать приложения к Фадскому пакту. Не стоило интересоваться, почему в некоторых горных районах государственные школы закрывались быстрее, чем открывались новые курорты. Не стоило спрашивать полицейского, почему одних торговцев задерживают, а грузовики других проходят через блокпост без досмотра. Особенно не стоило спрашивать, куда исчезают люди, чьи имена иногда появлялись на стенах Нижнего города.\n\nДля всего остального существовал нектар.\n\nК полудню набережная окончательно заполнилась. Музыка стала громче. У казино начали собираться первые гости. Молодая пара фотографировалась у статуи Иванова. На экране над площадью появилась золотая бутылочка. «ВЫ ЗАСЛУЖИЛИ СПОКОЙНУЮ ЖИЗНЬ».\n\nРекламу сменил государственный герб, затем — лицо Петра Иванова. Он выглядел заметно старше, чем на памятниках. «Мир не является слабостью», произнёс он. «Мир является величайшей победой нашего народа». Люди на площади почти не остановились. Они слышали эти слова много раз. Кто-то поднял бутылочку в сторону экрана, кто-то даже не посмотрел наверх.\n\nА далеко отсюда, выше курортов и дорог к границе, снег лежал на развалинах тех деревень, которые никогда не попали в туристические буклеты. Там всё ещё говорили «Стеланд». В столице это слово постепенно превращалось в исторический термин. Здесь был Стеландер. Безопасный. Богатый. Свободный. И пока музыка играла достаточно громко, мало кому приходило в голову спросить, на чём именно держится его мир."
 ADISCORD_STP_preparation.16.a: "За мир стоило заплатить."

 ADISCORD_STP_cw.70.t: "Гражданская война в Стеландере"
 ADISCORD_STP_cw.70.d: "Борьба за власть после смерти Иванова перешла в открытую войну. Партийное правительство и сопротивление формируют фронты, а окружные администрации объявляют, чьи приказы они признают. Армейские склады, местные гарнизоны и связи, подготовленные ещё до раскола, теперь определяют возможности обеих сторон.\n\nГорные республики тем временем вышли из-под власти столицы и образовали Союз Возрождения Окцидии. Они не присоединились к войне за партийное правительство и строят собственную оборону. Кефрейт изучает положение на новой границе; Нодрул следит за борьбой в Стеландере, соотнося возможное вмешательство с обстановкой на севере."
 ADISCORD_STP_cw.70.a: "Страна раскололась."
 ADISCORD_STP_cw.71.t: "Победа партии в Стеландере"
 ADISCORD_STP_cw.71.d: "Организованное сопротивление партийной армии прекратилось. Правительство возвращает управление занятыми противником округами и объявляет о завершении гражданской войны. Военным предстоит восстановить снабжение и передать чрезвычайные полномочия гражданской администрации.\n\nЭтот исход завершает борьбу партии с сопротивлением. Судьба горных республик и их отношения с Кефрейтом определяются отдельно: победа в столице сама по себе не возвращает их под партийную власть."
 ADISCORD_STP_cw.71.a: "Правительство удержалось."
 ADISCORD_STP_cw.72.t: "Падение партийного правительства"
 ADISCORD_STP_cw.72.d: "Партийное командование признало военное поражение. Сопротивление принимает управление оставшимися под его властью округами и начинает формирование общих гражданских органов. Вмешательство Нодрула в поддержку партии, если оно успело начаться, прекращается вместе с разгромом её армии.\n\nВойна за власть в Стеландере закончилась. Горные республики не участвовали в этом противостоянии, и новый порядок в столице не решает за них вопрос об отношениях с Кефрейтом."
 ADISCORD_STP_cw.72.a: "Начинается восстановление."
 VAL_cw_republics_grace_elapsed_tt: "После распада Стеландера прошло не менее 60 дней."
 ADISCORD_STP_cw.73.t: "Кефрейт вторгся в Окцидию"
 ADISCORD_STP_cw.73.d: "Ультиматум Кефрейта истёк. После нескольких недель мобилизации его войска получили приказ перейти границу Союза Возрождения Окцидии. Кефрейт требует передачи [43.GetName], [44.GetName] и [88.GetName]; власти республик отвергли эти требования.\n\nЭто отдельная война Кефрейта с республиками. Ни партийные власти Стеландера, ни силы Шабрата не стали её участниками. Исход операции решится на фронте."
 ADISCORD_STP_cw.73.a: "Западная граница стала фронтом."
 ADISCORD_STP_cw.80.t: "Победа Нодрула на севере"
 ADISCORD_STP_cw.80.d: "Северная кампания завершилась победой Нодрула. Власть Культа Детей Леса упразднена, а его земли переходят под прямое управление победителя.\n\nЮборская Народная Республика сохраняет свои исторические земли, но становится зависимой от Нодрула. Вольный Фронтир заключил мир и остался независимым. Северный фронт больше не удерживает нодрульскую армию."
 ADISCORD_STP_cw.80.limited: "Нодрул завершил северную кампанию после военного поражения всех трёх участников северного союза.\n\nЗа время кампании положение северных территорий изменилось, и первоначальные условия общего соглашения удалось выполнить не полностью. Чужие зависимости и владения не включены в передел. Северный фронт больше не удерживает нодрульскую армию."
 ADISCORD_STP_cw.80.a: "Северная кампания окончена."
 ADISCORD_STP_cw.81.t: "Нодрул отступает с севера"
 ADISCORD_STP_cw.81.d: "Северная кампания обернулась поражением Нодрула. Правительство согласилось прекратить войну с Юборской Народной Республикой, Культом Детей Леса и Вольным Фронтиром.\n\nЭснос и Бриоланд переходят к Юбору. Нодрул сохраняет государственность и остальные владения. Северные противники выходят из войны независимыми."
 ADISCORD_STP_cw.81.limited: "Северные стороны принудили Нодрул к миру. Его правительство сохранило власть и согласилось прекратить кампанию.\n\nЧасть спорных территорий уже оказалась вне его власти. Соглашение затронуло только те участки Эсноса и Бриоланда, которые ещё принадлежали Нодрулу; владения других государств остались за пределами договора."
 ADISCORD_STP_cw.81.a: "Северяне выстояли."
 ADISCORD_STP_cw.82.t: "Война на севере"
 ADISCORD_STP_cw.82.d: "Нодрульская армия получила приказ наступать после истечения ультиматума. Юборская Народная Республика, Культ Детей Леса и Вольный Фронтир объявили о создании Северного оборонительного союза.\n\nСоюзники намерены продолжать общую войну, даже если одна из их армий потерпит поражение. Нодрул добивается прямого управления землями лесного культа и подчинения Юбора; навязать эти условия он сможет лишь после разгрома всех трёх противников. Поражение самого Нодрула вынудит его прекратить кампанию.\n\nДля стеландерского сопротивления северный фронт означает отсрочку нодрульского вмешательства на стороне партии. После окончания кампании сопротивление лишится возможности вновь отвлечь Нодрул на север."
 ADISCORD_STP_cw.82.a: "Северный фронт открыт."
 STP_northern_defence_alliance: "Северный оборонительный союз"
 STP_cw_cache_capacity_tt: "После поставки общий резерв Абилии, включая оружие в пути, не превысит £infantry_equipment_texticon §Y9600§!."
 NOD_cw_northern_conscription: "Северный призыв"
 NOD_cw_northern_conscription_desc: "Северная кампания потребовала больше людей, чем рассчитывал штаб. Проведём через правительство расширение призыва: через 35 дней вступит в силу закон «Расширенный призыв». Новые резервисты будут прибывать постепенно, а подготовка пополнений займёт больше времени.\n\nЕсли северная кампания завершится или закон изменится раньше, приказ будет отменён с возвратом политической власти. При уже одобренной интервенции мобилизация сохраняется на время переброски. После закрытия угрозы действует обычная демобилизация."
 NOD_cw_northern_mobilization: "Мобилизация на северной границе"
 NOD_cw_northern_mobilization_desc: "Через 28 дней армия Нодрула начнёт войну против оборонительного союза Юбора, Культа Детей Леса и Вольного Фронтира. Раскол Стеландера не отменяет приказ. Подготовка интервенции может идти одновременно с северной кампанией; северный фронт блокирует только вступление. После окончания кампании без поражения Нодрула потребуются семь дней на переброску и завершение оставшейся подготовки."
 STP_cw_northern_supply_idle_tt: "Предыдущий северный груз уже доставлен или возвращён."
 STP_cw_northern_supply_delivery_tt: "Страна §Y[FROM.GetName]§! получит £infantry_equipment_texticon §Y2400§!, если ещё воюет с Нодрулом и не капитулировала. Иначе оружие вернётся отправителю."
 STP_cw_northern_supply_cost: "£pol_power §Y40§! £infantry_equipment_texticon §Y2400§!"
 STP_cw_northern_supply_cost_blocked: "£pol_power §R40§! £infantry_equipment_texticon §R2400§!"
 STP_cw_northern_supply_cost_tooltip: "Стоимость: £pol_power §Y40§! £infantry_equipment_texticon §Y2400§!. При отмене возвращается только оружие."

 STP_cw_district_administration_2_tt: "В регионе §Y[2.GetName]§! подготовлена администрация сопротивления. Она помогает сохранить гражданское управление и передать округ при достаточной местной поддержке. Партийная проверка может сорвать договорённость."
 STP_cw_defensive_lines: "Подготовить оборонительные рубежи"
 STP_cw_defensive_lines_desc: "Инженеры обследуют подходы к опорным районам, выберут позиции и подготовят строительные команды. Оборонительные работы в округах потребуют отдельного времени и средств. Сохранившиеся рубежи помогут встретить партийное наступление и последующее вмешательство Нодрула."
 STP_cw_heavy_reserve: "Усиленные боевые группы"
 STP_cw_heavy_reserve_desc: "Организуем набор и снабжение усиленных частей с артиллерией и подразделениями поддержки. Отдельный заказ покроет людей, вооружение и обучение; готовые дивизии будут закреплены за будущей армией Шабрата."
 STP_cw_national_mandate: "Гарантии передачи власти"
 STP_cw_national_mandate_desc: "Добьёмся публичного признания избирательной процедуры и откроем переговоры с командованием о подчинении объявленному результату. При широкой поддержке и действующем обязательстве гарнизона сопротивление партии можно ограничить отдельным мятежом. Для этого администрации Монаии и Ниансаса должны к объявлению результата проработать не менее 21 дня без потери. Если большой войны избежать не удастся, политическая подготовка усилит мандат Шабрата."
 STP_cw_election_mandate_dynamic: "Мандат на восстановление государства"
 STP_cw_election_mandate_dynamic_desc: "Объявленный результат выборов помогает собирать резервы, восстанавливать боеспособность и удерживать собственную территорию. Размер поддержки определён до раскола; оружие и подготовленные части учитываются отдельно."
 STP_cw_secure_election_result: "Добиться признания результата армией"
 STP_cw_secure_election_result_desc: "[STPGetPublicAgreementTiming]\n\nПубличное обязательство командования действует 50 дней после переговоров. К объявлению результата должны сохраниться Равель и хотя бы один подготовленный гарнизон. При победе Шабрата соглашение дополнительно усиливает его военный мандат, даже если начинается большая война. Для ограничения партийного мятежа также нужны легитимность не ниже 80% и администрации регионов [2.GetName] и [3.GetName], каждая из которых к объявлению результата непрерывно работает не менее 21 дня. При потере и восстановлении администрации её срок начинается заново. Переговоры занимают подготовительный слот; при срыве политические расходы не возвращаются. Проигранные выборы не дают Шабрату военного признания."
 STP_cw_public_command_available_tt: "Равель доступен и не арестован; в регионе [2.GetName] или [29.GetName] сохранён подготовленный гарнизон."
 STP_cw_public_command_agreement_tt: "Командование признаёт объявленный результат в течение §Y50 дней§!, пока доступен Равель и сохранён подготовленный гарнизон. Для ограниченного мятежа нужны также легитимность §Y80%§! и не менее §Y21 дня§! непрерывной работы обеих администраций в [2.GetName] и [3.GetName] к объявлению результата; потеря администрации обнуляет её срок. При победе Шабрата соглашение дополнительно усиливает его военный мандат независимо от масштаба мятежа:"
 STP_cw_national_mandate_tt: "Исключительный мандат и публичное обязательство командования позволяют ограничить мятеж партийными опорными силами, если обе администрации в [2.GetName] и [3.GetName] к объявлению результата непрерывно работают не менее §Y21 дня§!. После потери администрации срок начинается заново. Обычная победа на выборах даёт будущей стороне Шабрата военный дух: быстрее восстанавливается организация, усиливается оборона своей территории и ускоряется подготовка резервов."
 STP_cw_prepare_defensive_line: "Оборонительные рубежи: [FROM.GetName]"
 STP_cw_prepare_defensive_line_desc: "За 35 дней инженеры подготовят позиции и материалы. При расколе укрепления пограничных провинций этого региона получат два дополнительных уровня. Рубежи достанутся владельцу региона: сначала обеспечьте его переход. Незавершённые работы прерываются при расколе или потере контроля; расходы на них не возвращаются."
 STP_cw_defensive_lines_tt: "Открывается подготовка рубежей в регионах [1.GetName], [2.GetName] и [3.GetName]. Каждый проект занимает слот на §Y35 дней§! и требует отдельного финансирования."
 STP_cw_defensive_line_result_tt: "При расколе укрепления на границах региона §Y[FROM.GetName]§! получат §Yдва дополнительных уровня§!. Их получит фактический владелец региона."
 STP_cw_prepare_assault_group: "Подготовить усиленную дивизию"
 STP_cw_prepare_assault_group_desc: "Заказ на одну усиленную дивизию: шесть пехотных и два артиллерийских батальона с инженерами, артиллерией поддержки и ПВО. Набор и закупка вооружения входят в цену — 500 из казны; государственные запасы не расходуются.\n\nПодготовка занимает 35 дней и один слот. Можно заказать две дивизии. Готовые части войдут в армию Шабрата при расколе. Если подготовка прервётся, деньги вернутся."
 STP_cw_assault_group_tt: "Открывается платная подготовка до §Yдвух усиленных дивизий§! для армии Шабрата: по §Y35 дней§!, с артиллерией, инженерами и ПВО. Люди и вооружение резервируются заранее; готовые части имеют полный комплект."
 STP_cw_assault_group_capacity_tt: "Подготовлено менее двух усиленных дивизий."
 STP_cw_assault_group_result_tt: "При расколе армия Шабрата получит §Yодну полностью укомплектованную усиленную дивизию§!. Её люди и вооружение уже оплачены и не участвуют в общем разделе."
 NOD_cw_northern_redeployment: "Переброска с северного фронта"
 NOD_cw_northern_redeployment_desc: "Северная кампания закончилась. Семь дней нужны для переброски войск; оставшаяся подготовка интервенции идёт одновременно. Армия вступит, когда обе работы завершатся, если партия ещё держится."
 STP_cw_nod_redeployment: "Нодрул перебрасывает войска!"
 STP_cw_nod_redeployment_desc: "Северная война закончилась. Нодрул перебрасывает армию к Стеландеру. Когда закончится эта миссия и будет завершена подготовка интервенции, он сможет вступить на стороне партии. Разгром партии закроет эту возможность."
 ADISCORD_STP_preparation.19.t: "Призыв резервистов"
 ADISCORD_STP_preparation.19.d: "Состояние Иванова ухудшается, а правительство опасается распада гарнизонов. Кабинет объявил ограниченный призыв: резервисты будут постепенно прибывать в учебные части и на склады.\n\nЭти люди пока принадлежат общему военному резерву. При расколе их распределение определят исход выборов и подготовленные формирования. Штаб Шабрата может добиваться поддержки командиров, готовить боевые группы или сосредоточиться на публичном признании результата."
 ADISCORD_STP_preparation.19.a: "Следить за комплектованием частей."
 ADISCORD_STP_cw.30.limited: "Шабрат получил исключительный мандат. Поддержавшие результат командиры остались на своих местах, а окружные администрации сохранили управление. Попытка партии поднять всю страну провалилась.\n\nХедерсетт и верные ему части закрепились в столичном районе. Им остаются гвардия, местные бригады и ограниченный запас тяжёлых частей. Большинство округов, людей и складов переходит правительству Шабрата. Западные республики сохраняют объявленную независимость.\n\nМятеж ещё предстоит подавить. Подготовка Нодрула продолжается: если партия продержится достаточно долго, её ограниченное выступление может получить внешнюю поддержку."
 STP_cw_defensive_line_cost: "£pol_power §Y50§! £ADISCORD_economy_treasury_texticon §Y100§!"
 STP_cw_defensive_line_cost_blocked: "£pol_power §R50§! £ADISCORD_economy_treasury_texticon §R100§!"
 STP_cw_defensive_line_cost_tooltip: "Стоимость: £pol_power §Y50§! £ADISCORD_economy_treasury_texticon §Y100§!."
 STP_cw_assault_group_cost: "£ADISCORD_economy_treasury_texticon §Y500§!"
 STP_cw_assault_group_cost_blocked: "£ADISCORD_economy_treasury_texticon §R500§!"
 STP_cw_assault_group_cost_tooltip: "Стоимость полного заказа: £ADISCORD_economy_treasury_texticon §Y500§!. Личный состав и вооружение закупаются в составе заказа."
 ADISCORD_STP_cw.70.limited: "Шабрат объявлен победителем выборов. Соглашение с армейским командованием и поддержка окружных администраций позволили ему сохранить управление большей частью страны. Попытка партии отвергнуть результат привела к вооружённому мятежу в столичном районе. Хедерсетт опирается на гвардию и оставшиеся верными ему части.\n\nМятеж ещё предстоит подавить. Нодрул рассматривает возможность поддержки партийных сил, пока его армию удерживает положение на севере. Западные республики тем временем объявили независимость; их отношения с Кефрейтом остаются отдельным источником напряжения."
 STP_cw_start_uprising_tt: "Выборы будут прерваны. Начнётся раздел страны и армии; подготовленные части и склады определят силы сторон. После выбора стороны начнутся боевые действия."

 STP_cw_arsenal_idle_tt: "Нет другого арсенала на расширении"
 STP_cw_nod_busy_in_north_tt: "Нодрул связан действующей войной на севере"
 STP_nod_status_intervened: "§Rвступил на стороне партии.§!"
 STP_nod_status_closed: "угроза интервенции снята."
 STP_nod_status_northern_war: "§Yведёт войну на севере.§! Вступление пока невозможно; после войны потребуется переброска."
 STP_nod_status_redeploying: "§Rперебрасывает войска с севера.§! Осталось §Y[?NOD.days_mission_timeout@NOD_cw_northern_redeployment|0]§! дн."
 STP_nod_status_neutral: "отказался от интервенции."
 STP_nod_status_ready: "§Rармия готова к интервенции.§!"
 STP_nod_status_preparing: "готовит интервенцию — §Y[?NOD.days_mission_timeout@NOD_cw_intervention_preparation|0]§! дн. до готовности."
 STP_nod_status_northern_mobilization: "готовит северную кампанию; боевые действия ещё не начались."
 STP_nod_status_observing: "наблюдает за кризисом; северный фронт пока не отвлекает его армию."

 STP_cw_kefreyt_volunteers_cost_tt: "Кефрейт выделит £manpower_texticon §Y23700§! человек, £infantry_equipment_texticon §Y1830§! винтовок, §Y144§! комплекта вооружения отделений, §Y90§! единиц дополнительного оснащения, §Y180§! артиллерийских орудий и §Y60§! средств ПВО. Пакет оплачивается целиком, когда люди и вооружение будут собраны. При нехватке резервов Кефрейт продолжит комплектование; гражданская война не отменяет соглашение."

 STP_ARMY_KEFREYT_COMMITMENT: "\nКефрейт подготовил для сопротивления ещё §Y3§! добровольческие дивизии с артиллерией и ПВО. Они останутся до завершения войны."







 STP_cw_credentials_review: "Подтверждение полномочий делегатов"

 STP_cw_credentials_review_desc: "Партийный секретариат оспаривает списки Шабрата там, где некому подтвердить подписи. Каждые §Y35 дней§! отсутствие работающей администрации в [2.GetName] или [3.GetName] отнимает по §R8%§! легитимности. При сохранности обеих администраций потерь нет. Комиссия может уничтожить организацию: прикройте её, откройте гражданские реестры или восстановите до очередной сверки. Агитация возмещает потерю поддержки, но занимает тот же слот, что и военная подготовка."

 STP_cw_monaya_credentials_missing_tt: "В [2.GetName] нет подконтрольной действующей администрации Шабрата"

 STP_cw_niansas_credentials_missing_tt: "В [3.GetName] нет подконтрольной действующей администрации Шабрата"

 ADISCORD_STP_preparation.20.t: "Приёмный день"

 ADISCORD_STP_preparation.20.d: "У двери окружного управления сегодня две очереди. В одной ждут справок о выплатах, в другой — сведений о призыве. Секретарь переносит стул из кабинета в коридор и пишет фамилии на обороте старого афишного листа. Телефон из столицы молчит.\n\nК обеду приезжает человек с новыми бланками. На них всё ещё напечатано имя Иванова. Никто не предлагает зачеркнуть его: иначе придётся объяснять, кто теперь отвечает за подпись внизу."

 ADISCORD_STP_preparation.20.a: "Приём продолжается."

 ADISCORD_STP_preparation.21.t: "Место за столом"

 ADISCORD_STP_preparation.21.d: "Для утреннего совещания поставили двенадцать чашек. Кресло председателя осталось пустым. Помощник открыл папку, начал читать повестку и запнулся на привычном обращении. Хедерсетт попросил перейти к первому вопросу.\n\nПосле совещания служащая убрала нетронутую чашку обратно на поднос. На завтра в её списке снова значились двенадцать."

 ADISCORD_STP_preparation.21.a: "Завтра будет новая повестка."
 NOD_cw_call_ain:0 "Призвать силы Айнхольма"
 NOD_cw_call_ain_desc:0 "Силы Айнхольмского мандата вступят в северную войну на нашей стороне. Участие колонии завершится вместе с северной кампанией."

 # Окружные советы и договор с сопротивлением
 SRP_council_authority: "Власть окружных советов"
 SRP_council_authority_desc: "Округа снабжают собственные отряды и сохраняют гражданское управление. Близость к местным складам облегчает подвоз, но общему штабу приходится согласовывать распоряжения с несколькими советами."
 SRP_emergency_command: "Чрезвычайные полномочия штаба"
 SRP_emergency_command_desc: "Нападение Кефрейта заставило советы передать штабу координацию обороны. Командиры организуют смену частей и общий план действий. Полномочия действуют только до окончания войны с Кефрейтом; победа или поражение Шабрата их не отменяет."
 SRP_council_supply: "Оплаченные поставки округам"
 SRP_council_supply_desc: "Правительство Шабрата оплатило оружие и работу местных мастерских. На 42 дня выпуск военных заводов увеличивается на 20%, восстановление организации — на 10%. Программа прекращается с окончанием войны против Кефрейта или потерей независимости."
 STP_cw_council_guarantees: "Гарантии окружным советам"
 STP_cw_council_guarantees_desc: "Довоенный договор пережил раскол. Шабрат обещал сохранить самостоятельность советов и получил возможность оплачивать их снабжение при нападении Кефрейта. После возвращения гражданской власти предстоит решить, станет ли обещание постоянной хартией."
 STP_cw_republican_charter: "Хартия окружного сотрудничества"
 STP_cw_republican_charter_desc: "Стеландер признал самостоятельность республик. Общие заказы и договорённости между мастерскими ускоряют строительство гражданских предприятий обеих сторон. Хартия не создаёт военного союза и не втягивает её участников в чужие войны."
 STP_cw_central_authority: "Полномочия центрального правительства"
 STP_cw_central_authority_desc: "Правительство отказалось закреплять обязательства перед окружными советами. Единый государственный заказ увеличивает выпуск военных заводов на 10%, административные расходы сокращаются на 5%. Республикам больше не обещают снабжения и совместных программ."
 SRP_distrust_stelander: "Недоверие к Стеландеру"
 SRP_distrust_stelander_desc: "Правительство Шабрата отступило от довоенных гарантий. Советы укрепляют оборону собственных земель и готовятся полагаться на себя. Отказ от хартии сам по себе не начинает новую войну."
 STP_cw_fund_republican_supplies: "Оплатить снабжение республик"
 STP_cw_fund_republican_supplies_desc: "За 25 единиц казны оплатим закупку у частных поставщиков для республик: 1200 винтовок и 30 единиц дополнительного оснащения поступят на склады республик. Работа окружных мастерских и восстановление частей получат поддержку на 42 дня. Наш собственный оружейный запас не расходуется. Следующую поставку можно оплатить через 42 дня, если война республик с Кефрейтом продолжается."
 STP_cw_republican_supplies_available_tt: "Обе стороны независимы и соблюдают договор; республики воюют с Кефрейтом, не капитулировали и завершили предыдущую программу поставок"
 STP_cw_republican_supplies_cost: "£ADISCORD_economy_treasury_texticon §Y25§!"
 STP_cw_republican_supplies_cost_blocked: "£ADISCORD_economy_treasury_texticon §R25§!"
 STP_cw_republican_supplies_cost_tooltip: "Стоимость: £ADISCORD_economy_treasury_texticon §Y25§!"
 STP_cw_negotiate_republican_charter: "Согласовать окружную хартию"
 STP_cw_negotiate_republican_charter_desc: "Гражданская власть восстановлена. Теперь можно вернуться к довоенным гарантиям и определить отношения с самостоятельными республиками. Их отдельная война с Кефрейтом не препятствует переговорам."
 STP_cw_republican_charter_available_tt: "Шабрат победил партию; обе стороны независимы, не капитулировали, сохраняют довоенные гарантии и не ведут уже открытые переговоры"
 ADISCORD_STP_cw.90.t: "Подписи под хартией"
 ADISCORD_STP_cw.90.d: "Представители окружных советов принесли копию соглашения, заключённого ещё до раскола. Бумага пожелтела по сгибам; рядом с подписью Шабрата стоят подписи людей, которые всё это время удерживали местное управление.\n\nТеперь советы предлагают закрепить самостоятельность республик и открыть совместные заказы для гражданских мастерских. Военный союз в документ не входит. Центральная канцелярия предлагает сосредоточить заказы на собственных военных заводах и сократить согласования с округами, которые больше не подчиняются столице. Отказ от хартии прекратит помощь советам.\n\nПредставители ждут ответа. Война изменила карту, но подписи остались прежними."
 ADISCORD_STP_cw.90.a: "Подтвердить гарантии и подписать хартию."
 ADISCORD_STP_cw.90.b: "Передать решение вопросов центральной канцелярии."
 ADISCORD_STP_cw.90.close: "Обстоятельства изменились."
 ADISCORD_STP_cw.91.t: "Письмо окружных советов"
 ADISCORD_STP_cw.91.guaranteed: "Письмо доставили с водителем грузовика. Советы подтвердили довоенное соглашение: республики будут управлять своими округами самостоятельно, а Шабрат сохранит обещанные гарантии.\n\nНа обороте приложен перечень мастерских и складов. Если Кефрейт нападёт, через них можно будет организовать оплаченные поставки оружия. Внизу приписка другой рукой: «После войны договор тоже понадобится»."
 ADISCORD_STP_cw.91.independent: "В письме окружных советов нет просьбы назначить губернатора. Республики сообщили о создании собственного управления и предложили избегать столкновений на границе.\n\nВоенные требуют общего плана обороны, местные представители — сохранить контроль над запасами и людьми. При нападении Кефрейта штаб получит чрезвычайные полномочия, но советы не собираются распускаться. Победа в столице ещё не решит вопрос об их будущем."
 ADISCORD_STP_cw.91.a: "Принято к сведению."

 STP_cw_public_campaign_basis_tt: "Осталась новая кампания из трёх; наступил её этап выборов. Для второй кампании Шабрата нужна администрация в Монаии или Ниансасе, для третьей — обе; каждое требуемое управление непрерывно работает 21 день."
 STP_cw_delegate_support_available_tt: "Преимущество нашей стороны на шкале легитимности меньше 55%"
 STP_cw_command_timing_no_election: "Выборы ещё не открыты. Договор действует лишь 50 дней после завершения переговоров."
 STP_cw_command_timing_early: "§YРано для обычного результата выборов.§! Переговоры займут 35 дней, затем договор действует 50 дней. Подписанный сейчас договор может истечь до подсчёта голосов; раннее подписание не переносит дату выборов."
 STP_cw_command_timing_late: "§RПереговоры уже не успевают к обычному результату выборов.§! До него осталось не больше 35 дней."
 STP_cw_command_timing_ready: "§GДоговор успеет вступить в силу и сохранится к обычному результату выборов.§! Переговоры займут 35 дней, затем обязательство действует 50 дней."
 STP_cw_military_committee_fund: "Средства военного комитета"
 STP_cw_military_committee_fund_desc: "Военные предлагают направить собранные сторонниками средства на оснащение ударной части. Комитет получит деньги сразу, но гражданские делегаты увидят в этом подготовку захвата власти. Строительство собственных мастерских придётся отложить."
 STP_cw_military_fund_tt: "Казна получит £ADISCORD_economy_treasury_texticon §Y500§! — полную денежную стоимость одной усиленной дивизии. Заказ через уже открытое решение занимает ещё §Y35 дней§! и слот подготовки; фокус сам не создаёт часть. Неизрасходованные деньги при расколе делятся вместе с общей казной."
 STP_cw_abila_workshops: "Мастерские Абилии"
 STP_cw_abila_workshops_desc: "Развернём военное производство в Абилии. Мастерские не дадут готовой ударной части к выступлению, зато смогут восполнять потери после первых боёв. Средства на отдельное усиленное формирование военный комитет не получит."
 STP_cw_abila_workshops_tt: "При расколе штат Абилия вместе с мастерскими переходит сопротивлению. До раздела выпуск поступает на общие государственные склады; направление производства выбирается обычным способом."

 STP_cw_election_time_21_tt: "До результата выборов больше 21 дня: кампания успеет завершиться"
 STP_cw_election_time_14_tt: "До результата выборов больше 14 дней: переговоры успеют завершиться"
 STP_pw_republic_dynamic: "Республика округов"
 STP_pw_republic_dynamic_desc: "Гражданские учреждения, восстановленное хозяйство и профессиональная армия республики. Принятые послевоенные решения определяют их общие возможности."
 STP_pw_party_dynamic: "Обновлённый президиум"
 STP_pw_party_dynamic_desc: "Постоянное партийное управление, промышленное планирование и регулярная армия. Их возможности зависят от выбранного порядка послевоенного восстановления."
 STP_pw_reconstruction_available_tt: "Наша сторона победила в гражданской войне, и её военные программы завершены."
 STP_pw_industry_reserve_tt: "При отсутствии доступной площадки вместо нового предприятия казна получит строительный резерв: £ADISCORD_economy_treasury_texticon §Y100§!. Постоянная промышленная специализация сохраняется."
 STP_pw_republic_new_republic: "Республика после победы"
 STP_pw_republic_new_republic_desc: "Победа закончила борьбу за столицу, но не восстановила управление страной. Новый кабинет начнёт с обычных бюджетов и понятной ответственности перед округами."
 STP_pw_republic_district_authority: "Советы освобождённых округов"
 STP_pw_republic_district_authority_desc: "Фронтовые связи станут основой местного управления. Советы получат постоянные полномочия, а центральные ведомства перестанут дублировать каждое окружное решение."
 STP_pw_republic_civil_records: "Открыть архивы войны"
 STP_pw_republic_civil_records_desc: "Сверим списки заключённых, реквизиций и утраченного имущества. Публичный учёт позволит разбирать претензии без новых чрезвычайных комиссий."
 STP_pw_republic_open_settlement: "Амнистия для вернувшихся"
 STP_pw_republic_open_settlement_desc: "Рядовые участники партийных формирований смогут вернуться к мирной жизни. Примирение укрепит общественное доверие, но неоднородная армия будет сложнее подчиняться единому командованию."
 STP_pw_republic_firm_settlement: "Суды над организаторами"
 STP_pw_republic_firm_settlement_desc: "Сосредоточим расследования на организаторах репрессий и военного мятежа. Кабинет получит больше политической опоры, хотя затяжные процессы сохранят напряжение в обществе."
 STP_pw_republic_civil_charter: "Гражданская хартия"
 STP_pw_republic_civil_charter_desc: "Разграничим права округов и обязанности общих ведомств. Хартия закрепит порядок гражданского управления, не пересматривая отдельные договоры с горными республиками."
 STP_pw_republic_restore_roads: "Вернуть хозяйству дороги"
 STP_pw_republic_restore_roads_desc: "Освободившиеся строительные бригады займутся дорогами и городскими коммуникациями. Первые работы пройдут на контролируемой территории Стеландера."
 STP_pw_republic_homes_for_returnees: "Крыша для возвращающихся"
 STP_pw_republic_homes_for_returnees_desc: "Восстановление жилья даст семьям возможность покинуть временные лагеря. Общие строительные нормы помогут местным подрядчикам быстрее переходить от ремонта к новым домам."
 STP_pw_republic_civil_workshops: "Кооперативные мастерские"
 STP_pw_republic_civil_workshops_desc: "Объединим небольшие мастерские в устойчивые производственные кооперативы. Новое гражданское предприятие станет образцом для следующей волны строительства."
 STP_pw_republic_accountable_arsenals: "Арсеналы под гражданским надзором"
 STP_pw_republic_accountable_arsenals_desc: "Армия сохранит необходимые оружейные мощности, но их работа войдёт в открытый государственный бюджет. Восстановим одно предприятие и упорядочим снабжение действующих заводов."
 STP_pw_republic_industrial_settlement: "Хозяйство без чрезвычайных приказов"
 STP_pw_republic_industrial_settlement_desc: "Долгосрочные заказы заменят ежедневные реквизиции. Предприятия смогут совершенствовать серийный выпуск, а ведомства сократят затраты на ручное распределение."
 STP_pw_republic_army_register: "Учёт фронтовых частей"
 STP_pw_republic_army_register_desc: "Сведём разрозненные отряды в общий реестр. Проверенные сведения о людях и имуществе сократят потери снабжения и сохранят опыт полевых штабов."
 STP_pw_republic_officer_school: "Школа полевых командиров"
 STP_pw_republic_officer_school_desc: "Командиры сопротивления научат новых офицеров тому, что помогло их отрядам выстоять. Общая программа соединит инициативу младших командиров с регулярной подготовкой."
 STP_pw_republic_supply_service: "Служба снабжения округов"
 STP_pw_republic_supply_service_desc: "Окружные склады будут работать по единому графику. Части станут быстрее восстанавливать боеспособность и меньше терять при доставке припасов."
 STP_pw_republic_professional_service: "Кадровая армия республики"
 STP_pw_republic_professional_service_desc: "Сохраним опытных инструкторов и введём постоянный цикл подготовки пополнений. Отряды останутся частью общей армии и после завершения чрезвычайного набора."
 STP_pw_republic_settled_state: "Власть, которую можно передать"
 STP_pw_republic_settled_state_desc: "Государство должно держаться на работающих учреждениях, а не на присутствии одного победоносного командира. Гражданская хартия, восстановленное хозяйство и кадровая армия дадут республике эту опору."
 STP_pw_party_new_republic: "Победа обязывает"
 STP_pw_party_new_republic_desc: "Партийное правительство удержало государство. Теперь ему предстоит заменить военное управление постоянными учреждениями и вернуть стране уверенность в завтрашнем дне."
 STP_pw_party_district_authority: "Окружные секретариаты"
 STP_pw_party_district_authority_desc: "Восстановим единую цепочку управления от президиума до округов. Постоянные секретариаты сократят расходы на параллельные комиссии и ускорят исполнение решений."
 STP_pw_party_civil_records: "Проверка партийных кадров"
 STP_pw_party_civil_records_desc: "Распределим должности по действительной работе во время кризиса. Ведомства получат устойчивый штат вместо временных назначений и взаимных доносов."
 STP_pw_party_open_settlement: "Вернуть технических специалистов"
 STP_pw_party_open_settlement_desc: "Не каждый нужный стране инженер разделял решения президиума. Возвращение специалистов ускорит исследования, но потребует уступить часть политического контроля над учреждениями."
 STP_pw_party_firm_settlement: "Опора на проверенные кадры"
 STP_pw_party_firm_settlement_desc: "Ключевые назначения останутся за людьми, подтвердившими верность правительству. Такая система укрепит политическую дисциплину ценой более узкого круга специалистов."
 STP_pw_party_civil_charter: "Устав обновлённого президиума"
 STP_pw_party_civil_charter_desc: "Закрепим постоянные полномочия органов управления и порядок контроля за расходами. Чрезвычайные комиссии уступят место установленной процедуре."
 STP_pw_party_restore_roads: "Единый план восстановления"
 STP_pw_party_restore_roads_desc: "Определим очерёдность дорожных и городских работ. Централизованные заявки помогут направлять строительные силы туда, где они быстрее вернут хозяйство к работе."
 STP_pw_party_homes_for_returnees: "Жильё по трудовым спискам"
 STP_pw_party_homes_for_returnees_desc: "Согласуем возвращение работников с восстановлением жилья. Люди должны получать место в городе вместе с рабочим местом, а не искать крышу после прибытия."
 STP_pw_party_civil_workshops: "Восстановить комбинаты"
 STP_pw_party_civil_workshops_desc: "Крупные предприятия вновь соберут разорванные производственные цепочки. Восстановленный гражданский комбинат и единые стандарты помогут наладить серийный выпуск."
 STP_pw_party_accountable_arsenals: "Государственный оборонный заказ"
 STP_pw_party_accountable_arsenals_desc: "Оборонные предприятия получат приоритет по материалам и строительным кадрам. Выпуск вооружений вырастет, но расширение гражданской промышленности будет идти медленнее."
 STP_pw_party_industrial_settlement: "План на три года"
 STP_pw_party_industrial_settlement_desc: "Свяжем строительство предприятий с долгосрочными производственными заданиями. Устойчивая программа позволит наращивать мощности без постоянной смены приоритетов."
 STP_pw_party_army_register: "Реестр регулярных соединений"
 STP_pw_party_army_register_desc: "Штаб уточнит состав действующих соединений и закрепит их постоянное подчинение. Военный опыт станет частью общего порядка управления войсками."
 STP_pw_party_officer_school: "Высшие курсы штаба"
 STP_pw_party_officer_school_desc: "Расширим обучение офицеров оперативной работе. Единые карты, сроки и штабные процедуры позволят быстрее готовить согласованные действия крупных соединений."
 STP_pw_party_supply_service: "Центральные военные склады"
 STP_pw_party_supply_service_desc: "Сосредоточим учёт запасов и распределение пополнений в постоянной службе. Штабы будут получать сведения о снабжении до того, как нехватка остановит части."
 STP_pw_party_professional_service: "Единая система подготовки"
 STP_pw_party_professional_service_desc: "Сведём программы учебных подразделений к общему стандарту. Регулярные соединения получат предсказуемое пополнение и больше времени на совместную подготовку."
 STP_pw_party_settled_state: "Государство после чрезвычайщины"
 STP_pw_party_settled_state_desc: "Президиум подтвердит свою власть работающими учреждениями, производством и регулярной армией. Мобилизационные распоряжения перестанут быть единственным способом управлять страной."
 STP_pw_infantry_lessons_bonus: "Опыт гражданской войны"
 STP_pw_postwar_budget_available_tt: "Военный исход нашей страны определён; горные республики завершили собственный конфликт."

 ADISCORD_STP_preparation.8.pending: "Кефрейт согласился помочь Шабрату. Сейчас его склады не могут полностью оснастить три усиленные дивизии, поэтому контингент остаётся на комплектовании. Просьбу не отклонили: как только будут собраны люди и вооружение, части будут выделены нашему командованию. Начало гражданской войны не отменяет соглашение. Для прибытия необходимо удерживать Абилу."
 ADISCORD_STP_preparation.8.delivered: "Три усиленные добровольческие дивизии Кефрейта прибыли в Абилу с артиллерией и ПВО. Люди и вооружение выделены из его резервов. Контингент останется под нашим командованием до завершения гражданской войны; состав частей закреплён."
 STP_ARMY_KEFREYT_PENDING: "\nКефрейт согласился помочь: §Y3 добровольческие дивизии комплектуются§!. Они ещё не оплачены и не включены в нашу армию; для прибытия нужно удерживать Абилу."
 STP_cw_renew_kefreyt_request: "Возобновить переговоры с Кефрейтом"
 STP_cw_renew_kefreyt_request_desc: "Повторно запросить три добровольческие дивизии после отказа. При согласии Кефрейт выделит готовый контингент или поставит его на комплектование. Повторные переговоры возможны через 30 дней."
