 STP_pf_radicals_tt: "§YРадикалы-гедонисты§!\nСвобода общественной жизни и ослабление консервативной партийной опеки.\n\nВклад в верность аппарата: §Y[?STP_pf_radicals_contribution|2]§! пункта.\nРост усталости от войны: [?STP_pf_radicals_effect|=-2%].\nЭффект = (поддержка - 50) × доля влияния × 0.3%; знак обратный: довольная группа уменьшает показатель."
