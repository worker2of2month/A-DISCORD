 STP_council_agreement_result_tt: "§Y[FROM.GetName]§!: соглашение о переходе к Шабрату. Влияние местных сил: §Y+10§!. Подозрения: §R+3§!."
 STP_false_trail_result_tt: "Если успеем до конца комиссии: ложный след будет готов. Влияние партии: §0+3§!."
 STP_region_operation_2_result_tt: "§Y[2.GetName]§!: гарнизон и администрация сопротивления. Влияние сопротивления: §C+15§!. Подозрения: §R+7§!. Сохранившийся договор даёт плацдарм и две оплачиваемые бригады, если округ действительно перейдёт. Комиссия может сорвать переход; эвакуация офицеров сохранит части без местного плацдарма."
 STP_region_operation_3_result_tt: "§Y[3.GetName]§!: склад снабжения. Влияние сопротивления: §C+6§!. Подозрения: §R+5§!."
 STP_region_operation_29_result_tt: "§Y[29.GetName]§!: гарнизон и администрация сопротивления. Влияние сопротивления: §C+15§!. Подозрения: §R+8§!. Сохранившийся договор даёт плацдарм и две оплачиваемые бригады, если округ действительно перейдёт. Комиссия может сорвать переход; эвакуация офицеров сохранит части без местного плацдарма."
 STP_region_operation_45_result_tt: "§Y[45.GetName]§!: администрация сопротивления. Влияние сопротивления: §C+12§!. Подозрения: §R+4§!."
 STP_region_operation_46_result_tt: "§Y[46.GetName]§!: склад снабжения. Влияние сопротивления: §C+8§!. Подозрения: §R+6§!."
 STP_region_operation_53_result_tt: "§Y[53.GetName]§!: диверсионная группа с оплаченными £infantry_equipment_texticon §Y240§! винтовками. Влияние сопротивления: §C+6§!. Подозрения: §R+10§!."
 STP_cw_sabotage_capital_preparation_tt: "Отдельная операция в §Y[28.GetName]§!:\n- Срок подготовки: §Y14 дней§!.\n- Цена при запуске: £political_power_texticon §Y10§! и £infantry_equipment_texticon §Y240§!.\n- На время подготовки занимает §Y1 слот§!.\nПосле утраты группы операцию можно повторить за ту же цену. Обычные окружные операции в столице остаются недоступны."
 STP_cw_sabotage_capital_result_tt: "По завершении подготовки в §Y[28.GetName]§!:\n- Подготовлена диверсионная группа.\n- Влияние сопротивления: §G+12§!.\n- Подозрения партии: §R+8§!.\n\nПри расколе, если группа сохранится, а партия будет владеть столицей и контролировать её:\n- Повреждение §Y2§! уровней инфраструктуры и §Y1§! военного завода.\n- Организация армии партии: §R-15%§! на §Y70 дней§!.\n- Скорость планирования партии: §R-25%§! на §Y70 дней§!.\nЕсли столица перейдёт сопротивлению, диверсия не сработает и здания сохранятся."
 STP_cw_sabotage_industry_result_tt: "Если партия сохранит §Y[29.GetName]§! при расколе: повреждение §Y2§! гражданских предприятий; на §Y70 дней§! объём военного производства §R-20%§!, предельная эффективность производства §R-15%§!. Если округ достанется сопротивлению, предприятия сохранятся. Влияние сопротивления §G+10§!, подозрения §R+5§!."
 STP_cw_capital_owned_tt: "Столица принадлежит нам"
 STP_cw_delay_election_tt: "Текущее голосование и сверка полномочий продлятся на §Y80 дней§!."
 STP_cw_vorkerland_collapsed_tt: "Воркерланд распался"
 STP_cw_loyalty_start_tt: "Верность аппарата начинается с §Y40§!: это поддержка семи фракций, взвешенная по их влиянию. Высокая верность задерживает операции связных и даёт политический ресурс; низкая ускоряет подполье и бьёт по стабильности."
 STP_cw_loyalty_plus_4_tt: "Поддержка всех фракций: §G+4§! (до 100). Верность аппарата пересчитывается по их влиянию."
 STP_cw_loyalty_plus_5_tt: "Поддержка всех фракций: §G+5§! (до 100). Верность аппарата пересчитывается по их влиянию."
 STP_cw_loyalty_plus_6_tt: "Поддержка всех фракций: §G+6§! (до 100). Верность аппарата пересчитывается по их влиянию."
 STP_cw_loyalty_plus_8_tt: "Поддержка всех фракций: §G+8§! (до 100). Верность аппарата пересчитывается по их влиянию."
 STP_cw_loyalty_plus_10_tt: "Поддержка всех фракций: §G+10§! (до 100). Верность аппарата пересчитывается по их влиянию."
 STP_cw_loyalty_minus_6_tt: "Поддержка всех фракций: §R-6§! (не ниже 0). Верность аппарата пересчитывается по их влиянию."
 STP_cw_loyalty_minus_8_tt: "Поддержка всех фракций: §R-8§! (не ниже 0). Верность аппарата пересчитывается по их влиянию."
 STP_cw_security_collegium_tt: "Появится приказ перехватить объявленную операцию связных в указанном округе."
 STP_cw_protocol_office_tt: "На время выборов можно один раз запечатать протокол: £political_power_texticon §Y35§!, 14 дней, слот подготовки."
 STP_cw_public_lists_tt: "Публичные списки сильнее сдвигают мандат, но бьют по верности аппарата и стабильности."
 STP_cw_quiet_registers_tt: "Закрытая сверка сохраняет дисциплину кабинетов ценой меньшего сдвига мандата."
