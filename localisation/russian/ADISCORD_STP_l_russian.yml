# Партийные фракции
 STP_party_factions: "Фракции партии"
 STP_party_factions_desc: "Влияние фракций в сумме составляет 100%. Поддержка каждой группы определяет её вклад в верность аппарата. Фокусы и соглашения меняют баланс сил; политическое соглашение можно заключать раз в 30 дней."
 STP_pf_title: "РАВНОВЕСИЕ В ПАРТИИ"
 STP_pf_total: "Верность аппарата: §Y[?STP_apparatus_loyalty|1]/100§!"
 STP_pf_help: "Влияние: доля власти.\nПоддержка: отношение к руководству.\nНаведение: вклад и последствия."
 STP_pf_formula_tt: "Верность аппарата = сумма (влияние × поддержка) / 100.\nУсиление довольной группы укрепляет аппарат; усиление недовольной ослабляет его.\nОбщие награды за верность меняют поддержку всех фракций на указанное число пунктов, в пределах 0–100.\nПорог 70 задерживает подготовку подполья, ниже 25 она ускоряется. После начала войны сохраняются политические и экономические последствия, но подготовительное подполье больше не действует."
 STP_pf_cooldown_tt: "Прошло 30 дней с последнего соглашения с фракцией"
 STP_pf_nod_contacts_tt: "Нодрул существует, не капитулировал, не воюет с нами; суверенный курс ещё не закреплён"
 STP_pf_balance_dynamic: "Баланс партийных фракций"
 STP_pf_conservatives_name: "Консерваторы"
 STP_pf_conservatives_badge: "К"
 STP_pf_conservatives_influence_loc: "Влияние: §Y[?STP_pf_conservatives_influence|1]%§!"
 STP_pf_conservatives_support_loc: "Поддержка: §Y[?STP_pf_conservatives_support|1]/100§!"
 STP_pf_conservatives_tt: "§YКонсерваторы§!\nПреемственность власти и контроль над назначениями.\n\nВклад в верность аппарата: §Y[?STP_pf_conservatives_contribution|2]§! пункта.\nРасходы на управление: [?STP_pf_conservatives_effect|=-2%].\nЭффект = (поддержка - 50) × доля влияния × 0.2%; знак обратный: довольная группа уменьшает показатель."
 STP_pf_negotiate_conservatives: "Сохранить кадровые гарантии"
 STP_pf_negotiate_conservatives_desc: "Преемственность власти и контроль над назначениями. Соглашение усиливает эту фракцию и вызывает недовольство группы «Радикалы-гедонисты». Цена: £political_power_texticon 35. Все соглашения имеют общий перерыв 30 дней."
 STP_pf_conservatives_room_tt: "Влияние группы «Консерваторы» ниже 60% или поддержка ниже 60; при влиянии от 60% переговоры меняют только поддержку."
 STP_pf_conservatives_deal_tt: "§YКонсерваторы§!: влияние §Y+5 п.п.§! (до 100%, остальные доли пропорционально уменьшаются), поддержка §G+12§!. §YРадикалы-гедонисты§!: поддержка §R-12§!. Поддержка ограничена 0–100; верность аппарата и эффекты фракций пересчитываются. При влиянии от 60% новые должности не передаются: меняется только поддержка."
 STP_pf_borons_name: "Бороны"
 STP_pf_borons_badge: "Б"
 STP_pf_borons_influence_loc: "Влияние: §Y[?STP_pf_borons_influence|1]%§!"
 STP_pf_borons_support_loc: "Поддержка: §Y[?STP_pf_borons_support|1]/100§!"
 STP_pf_borons_tt: "§YБороны§!\nМестные полномочия и защита привилегий от вмешательства столицы.\n\nВклад в верность аппарата: §Y[?STP_pf_borons_contribution|2]§! пункта.\nСкорость строительства: [?STP_pf_borons_effect|=+2%].\nЭффект = (поддержка - 50) × доля влияния × 0.2%; довольная группа увеличивает показатель."
 STP_pf_negotiate_borons: "Подтвердить привилегии боронов"
 STP_pf_negotiate_borons_desc: "Местные полномочия и защита привилегий от вмешательства столицы. Соглашение усиливает эту фракцию и вызывает недовольство группы «Торговцы». Цена: £political_power_texticon 35. Все соглашения имеют общий перерыв 30 дней."
 STP_pf_borons_room_tt: "Влияние группы «Бороны» ниже 60% или поддержка ниже 60; при влиянии от 60% переговоры меняют только поддержку."
