 STP_imperial_union_client_settlement: "Оба подчинённых правительства входят в нашу фракцию, контролируют столицы и находятся в мире; завершены фокусы «Зависимые правительства» и «Цена первенства»"
 STP_pc_can_offer_kefreyt_terms: "Кефрейт независим, не воюет с нами и не состоит в нашей фракции; другого незавершённого предложения нет"
 STP_pc_course_locked: "Государственный курс утверждён"
 STP_pc_val_crisis: "Открыт пограничный кризис с Кефрейтом"
 STP_pc_nod_crisis: "Открыт пограничный кризис с Нодрулом"
 STP_pc_val_terms_accepted: "Кефрейт принял условия договора"
 STP_pc_val_terms_refused: "Кефрейт отклонил условия договора"
 STP_pc_lib_val_won: "Война с Кефрейтом завершена в нашу пользу"
 STP_pc_lib_nod_won: "Война с Нодрулом завершена в нашу пользу"
 STP_pc_can_confront_val: "Кефрейт независим и не является союзником; принятый договор не запрещает войну"
 STP_pc_can_confront_nod: "Нодрул независим и не является союзником; принятый договор не запрещает войну"
 STP_HANDOFF_RESISTANCE: "Возглавить сопротивление. Открыть фронт."
 STP_HANDOFF_PARTY: "Остаться с партией. Открыть фронт."

 STP_cw_front_operation: "Операция: [STPGetFrontOperationTarget]"
 STP_cw_front_operation_desc: "Штаб ставит ближайшую задачу: занять регион §Y[STPGetFrontOperationTarget]§! за §Y49 дней§!. Это операция §Y[?STP_cw_operation_round|0] из 3§!.\n\nУспех на §Y21 день§! ускорит подготовку планов на §G10%§! и повысит прорыв на §G8%§!. Если срок истечёт, восстановление организации и скорость планирования снизятся на §R10%§! на §Y28 дней§!. Следующая цель определяется после завершения текущей операции. Окончание гражданской войны закрывает задачи без штрафа."
 STP_cw_operation_capture_tt: "Сопротивление контролирует регион §Y[STPGetFrontOperationTarget]§!."
 STP_cw_operation_target_2: "$STATE_2$"
 STP_cw_operation_target_29: "$STATE_29$"
 STP_cw_operation_target_53: "$STATE_53$"
 STP_cw_operation_target_3: "$STATE_3$"
 STP_cw_operation_target_46: "$STATE_46$"
 STP_cw_operation_target_45: "$STATE_45$"
 STP_cw_operation_target_28: "$STATE_28$"
 STP_cw_operation_target_none: "новая цель не назначена"
 STP_cw_party_command_disruption: "Перебои в управлении"
 STP_cw_party_command_disruption_desc: "Начало раскола нарушило связь между партийными штабами. Командирам требуется время, чтобы восстановить порядок донесений и согласовать планы."
 STP_cw_operation_tempo: "Развитие наступления"
 STP_cw_operation_tempo_desc: "Взятие назначенного рубежа позволило штабу согласовать действия соединений и подготовить следующий удар."
 STP_cw_operation_disorganization: "Несогласованные приказы"
 STP_cw_operation_disorganization_desc: "Операция не уложилась в срок. Штаб пересматривает планы, а соединения восстанавливают нарушенное взаимодействие."

 STP_cw_front_scouts: "Связные переднего края"
 STP_cw_front_scouts_desc: "Свяжем окружные группы с армейскими штабами. Сведения о партийных частях позволят выбрать участок наступления до того, как туда подойдут резервы."
 STP_cw_mobile_workshops: "Ремонт вслед за фронтом"
 STP_cw_mobile_workshops_desc: "Соберём оружейников и оборудование в подвижные мастерские. Восстановленное оружие вернётся в части, а арсеналы перейдут на удлинённые смены."
 STP_cw_frontline_relief: "Смена на передовой"
 STP_cw_frontline_relief_desc: "Составим график смены батальонов и направим пополнение в действующие части. Уставшие подразделения должны восстанавливать порядок, а не продолжать наступление без остановки."
 STP_cw_route_columns: "Колонны снабжения"
 STP_cw_route_columns_desc: "Выделим транспорт и единый график движения для передовых складов. Снабжение не должно останавливаться вслед за первой же удачной атакой."
 STP_pc_val_renew_aid: "Продлить военные договоры"
 STP_pc_val_renew_aid_desc: "Кефрейт помог нам пережить гражданскую войну. Предложим заменить военные обязательства постоянным соглашением о поставках и ненападении. Уже оплаченные счета будут зачтены."
 STP_pc_val_border_compact: "Договор о поставках"
 STP_pc_val_border_compact_desc: "Нам не помогали кефрейтские добровольцы, но заводам и пограничным округам нужен устойчивый обмен. Предложим оплачиваемый договор с сохранением независимости обеих стран."
 STP_pc_val_ratify: "Утвердить договор с Кефрейтом"
 STP_pc_val_ratify_desc: "Закрепим принятые условия в работе ведомств и согласуем промышленные стандарты. Политическое клиентство и равноправный договор остаются разными исходами; только первое позволяет включить Кефрейт в Имперский союз."
 STP_pc_nod_recognition: "Взаимное признание"
 STP_pc_nod_recognition_desc: "Откажемся от подчинения соседа в обмен на признание нынешнего правительства и договор о ненападении. Нодрул получит компенсацию за прекращение спора; он вправе отвергнуть предложение."
 STP_pc_nod_ratify: "Закрепить северную границу"
 STP_pc_nod_ratify_desc: "После согласия Нодрула согласуем правила пограничной службы. Мирное признание снимает необходимость готовить наступление, но не делает Нодрул зависимым правительством."
 STP_pc_val_demand_offer_tt: "Кефрейт получит требование политической зависимости. Отказ откроет военную подготовку, но не объявит войну."
 STP_pc_nod_demand_offer_tt: "Нодрул получит требование политической зависимости. Отказ откроет военную подготовку, но не объявит войну."
 STP_pc_val_trade_offer_tt: "Кефрейт получит предложение взаимного договора. Только после его согласия мы заплатим £ADISCORD_economy_treasury_texticon §Y200§!; если военные счета уже оплачены — §Y100§!. Обе страны получат договор о ненападении, §G+3%§! к выпуску военных заводов и §G-3%§! потребления снабжения. Независимость Кефрейта сохранится."
 STP_pc_nod_border_offer_tt: "Нодрул получит предложение взаимного признания. После его согласия мы заплатим £ADISCORD_economy_treasury_texticon §Y150§!. Обе страны заключат договор о ненападении и сократят расходы на армию на §G8%§!. Нодрул останется независимым."
 STP_pc_campaign_preparation_tt: "Откроется оплачиваемая подготовка снабжения: £ADISCORD_economy_treasury_texticon §Y100§! и §Y35 дней§!. Затем приказ о войне доступен §Y90 дней§!. Противник получит предупреждение; сам фокус войны не объявляет."
 STP_pc_campaign_paid_tt: "Оплачиваются перевозки и развёртывание складов. Отмена не возвращает израсходованные деньги. Через §Y35 дней§! готовность позволит начать кампанию в течение §Y90 дней§!."
 STP_pc_nod_refused_tt: "Нодрул отверг предложение"
 STP_pc_nod_terms_accepted: "Нодрул принял предложенные условия"
 STP_pc_joint_workshops: "Совместные промышленные стандарты"
 STP_pc_offer_expired_desc: "Предложение утратило силу: изменились отношения между странами или ответ уже передан. Новых обязательств этот документ не создаёт."
 STP_pc_reject_terms: "Отвергнуть условия."
 STP_pc_accept_compact: "Принять взаимный договор."
 STP_pc_accept_client_terms: "Признать политическое первенство Стеланда."
 STP_pc_val_compact: "Кефрейтский договор о поставках"
 STP_pc_val_compact_desc: "Договор закрепляет ненападение и взаимные поставки для промышленности и армии. Кефрейт сохраняет независимость."
 STP_pc_nod_compact: "Северное пограничное соглашение"
 STP_pc_nod_compact_desc: "Взаимное признание позволяет сократить чрезвычайные расходы на северной границе без передачи суверенитета."
 STP_pc_val_compact_settlement_tt: "Стеланд оплатит договор: 200 из казны, либо 100 при ранее оплаченных военных счетах. Средства поступят Кефрейту. Договор даст обеим сторонам ненападение, +3% выпуска военных заводов и -3% потребления снабжения."
 STP_pc_nod_compact_settlement_tt: "Стеланд выплатит Нодрулу 150 из казны. Договор даст обеим сторонам ненападение и -8% расходов на армию; политической зависимости он не создаёт."
 ADISCORD_STP_pc.17.t: "Предложение Стеланда"
 ADISCORD_STP_pc.17.compact: "Стеланд предлагает постоянный договор о поставках и ненападении. Наши ведомства получат оплату, а заводы и армейские склады — согласованные условия работы. Если прежние военные счета уже закрыты, сумма нового платежа будет уменьшена.\n\nСуверенитет Кефрейта не затрагивается. Отказ оставит границу без договорённости и позволит Стеланду перейти к военной подготовке."
 ADISCORD_STP_pc.17.demand: "Из Стеланда прибыло требование признать его политическое первенство. Нам предлагают сохранить администрацию, но согласовывать внешнюю политику с новым соседом.\n\nЭто не расчёт за прежние поставки. Принятие означает зависимый курс, отказ может привести к подготовке вторжения."
 ADISCORD_STP_pc.18.t: "Северная граница"
 ADISCORD_STP_pc.18.compact: "Правительство Стеланда предлагает прекратить спор о старом мандате, признать друг друга и заключить договор о ненападении. Нодрул получит компенсацию в 150 единиц казны. Обе стороны смогут сократить чрезвычайные армейские расходы.\n\nСтеланд отказывается добиваться нашего подчинения. При согласии деньги и договор вступят в силу одновременно."
 ADISCORD_STP_pc.18.demand: "Правительство Стеланда требует отказаться от прежнего мандата и признать его собственное политическое первенство. Формально наша администрация сохранится, но курс страны будет зависеть от Стеланда.\n\nОтказ не означает немедленной войны. Однако за этой нотой может последовать развёртывание армии на границе."
 ADISCORD_STP_pc.20.t: "Подготовка на границе"
 ADISCORD_STP_pc.20.d: "После неудачных переговоров Стеланд начал оплаченные перевозки к границе. Штаб связывает движение колонн с подготовкой наступления.\n\nУ нас есть время укрепить оборону. Само развёртывание ещё не означает объявления войны; окончательный приказ соседнего правительства пока не поступал."
 ADISCORD_STP_pc.20.a: "Привести штаб и резервы в готовность."
 ADISCORD_STP_pc.21.t: "Ответ на предложение"
 ADISCORD_STP_pc.21.val_compact: "Кефрейт принял договор о поставках и ненападении. Согласованный платёж перечислен, промышленные ведомства обеих стран приступили к работе. Кефрейт сохраняет независимость.\n\nТеперь правительство может утвердить договор отдельным фокусом и перейти к совместным промышленным стандартам."
 ADISCORD_STP_pc.21.val_client: "Кефрейт согласился признать политическое первенство Стеланда. Его администрация сохраняется, но внешнеполитический курс теперь связан с нашим правительством.\n\nДоступно утверждение соглашения. При создании Имперского союза Кефрейт сможет войти в него на принятых условиях."
 ADISCORD_STP_pc.21.val_refused: "Кефрейт отверг предложенные условия. Платежей и новых обязательств нет.\n\nШтаб может составить план горной кампании. После этого потребуются оплата снабжения и 35 дней подготовки; объявление войны останется отдельным решением правительства."
 ADISCORD_STP_pc.21.nod_compact: "Нодрул согласился на взаимное признание и договор о ненападении. Компенсация в 150 единиц казны перечислена. Обе страны остаются независимыми и сокращают расходы на армию.\n\nТеперь можно закрепить северную границу отдельным фокусом."
 ADISCORD_STP_pc.21.nod_client: "Нодрул признал политическое первенство Стеланда. Северная администрация сохраняется, но прежние отношения зависимости уступают место нашему региональному руководству.\n\nДоступно закрепление северной границы. При создании Имперского союза Нодрул сможет войти в него на принятых условиях."
 ADISCORD_STP_pc.21.nod_refused: "Нодрул отверг предложенные условия. Платежей и новых обязательств нет.\n\nШтаб может составить план северной кампании. После этого потребуются оплата снабжения и 35 дней подготовки; объявление войны останется отдельным решением правительства."
 ADISCORD_STP_pc.21.a: "Передать документы правительству."
 STP_pw_party_northern_protocol: "Протокол с Нодрулом"
 STP_pw_party_northern_protocol_desc: "Победа над восстанием не решила вопрос о прежней зависимости. Запросим условия Нодрула, прежде чем выбирать между возвращением под его покровительство и самостоятельным курсом."
 STP_pw_party_protectorate: "Возобновить протекторат"
 STP_pw_party_protectorate_desc: "Примем предложенное Нодрулом покровительство. Стеландер снова станет его марионеткой; обмен опытом поможет восстановить регулярную армию."
 STP_pw_party_sovereignty: "Собственный мандат"
 STP_pw_party_sovereignty_desc: "Президиум сохранит самостоятельность и оплатит восстановление оборонных мощностей внутри страны. Внешнего покровителя у этой политики не будет."
 STP_pw_party_northern_protocol_tt: "Нодрул получит запрос на возобновление протектората. Его согласие откроет соответствующий фокус, но окончательный выбор остаётся за Стеландером."
 STP_pw_party_protectorate_tt: "Стеландер вновь станет §Yмарионеткой Нодрула§!."
 STP_pw_party_nod_offer_accepted_tt: "Стеландер сможет принять протекторат отдельным фокусом. Сам ответ его статус не меняет."
 STP_pw_party_nod_offer_pending: "Ожидается ответ Нодрула"
 STP_pw_party_nod_offer_accepted: "Нодрул согласен возобновить протекторат"
 STP_pw_party_staff_exchange: "Обмен опытом штабов"
 ADISCORD_STP_pc.19.t: "Вопрос о протекторате"
 ADISCORD_STP_pc.19.d: "Партия сохранила власть в Стеландере. Её представители запрашивают условия возвращения под наше покровительство. Принятие предложения откроет им возможность ратифицировать протекторат; до этого Стеландер останется самостоятельным.\n\nОтказ оставит президиуму только собственные средства и самостоятельную политику."
 ADISCORD_STP_pc.19.refuse: "Пусть отвечают за себя."
 ADISCORD_STP_pc.19.accept: "Мы готовы возобновить протекторат."
 STP_pc_can_offer_nod_terms: "Нодрул независим, не воюет с нами и не состоит в нашей фракции; другого незавершённого предложения нет"
 STP_pw_prepare_val_campaign: "Развернуть снабжение против Кефрейта"
 STP_pw_prepare_val_campaign_desc: "Перевозки и передовые склады стоят £ADISCORD_economy_treasury_texticon §Y100§!. Подготовка займёт §Y35 дней§!, готовность сохранится §Y90 дней§!. Противник получит предупреждение и временный бонус оборонной подготовки. При отмене деньги не возвращаются; при изменении дипломатических условий подготовка прекращается."
 STP_pw_begin_val_campaign: "Начать кампанию против Кефрейта"
 STP_pw_begin_val_campaign_desc: "Объявить войну по подготовленному плану. Готовность складов будет израсходована, а армия получит усиленную подготовку наступления на §Y35 дней§!."
 STP_pc_val_campaign_ready: "Готовность к кампании против Кефрейта"
 STP_pc_val_campaign_ready_desc: "Передовые склады и транспорт готовы. Приказ о начале кампании доступен, пока действует этот дух."
 STP_pw_prepare_nod_campaign: "Развернуть снабжение против Нодрула"
 STP_pw_prepare_nod_campaign_desc: "Перевозки и передовые склады стоят £ADISCORD_economy_treasury_texticon §Y100§!. Подготовка займёт §Y35 дней§!, готовность сохранится §Y90 дней§!. Противник получит предупреждение и временный бонус оборонной подготовки. При отмене деньги не возвращаются; при изменении дипломатических условий подготовка прекращается."
 STP_pw_begin_nod_campaign: "Начать кампанию против Нодрула"
 STP_pw_begin_nod_campaign_desc: "Объявить войну по подготовленному плану. Готовность складов будет израсходована, а армия получит усиленную подготовку наступления на §Y35 дней§!."
 STP_pc_nod_campaign_ready: "Готовность к кампании против Нодрула"
 STP_pc_nod_campaign_ready_desc: "Передовые склады и транспорт готовы. Приказ о начале кампании доступен, пока действует этот дух."

 STP_pw_party_nod_military_mission: "Военная миссия Нодрула"
 STP_pw_party_nod_military_mission_desc: "Обратимся к покровителю за партией оружия из его действительных запасов. Нодрул сам решит, продавать ли нам 1000 единиц пехотного снаряжения и 100 единиц дополнительного оснащения за 50 казначейских единиц. Деньги спишутся только при согласованной передаче."
 STP_pw_party_domestic_pattern: "Собственный образец вооружения"
 STP_pw_party_domestic_pattern_desc: "Самостоятельный Стеландер должен содержать армию без разрешения северного покровителя. Поддержим исследования стрелкового оружия и откроем повторяемый государственный заказ на пехотное снаряжение, средства обеспечения и артиллерию."
 STP_pw_party_border_staff: "Пограничный штаб"
 STP_pw_party_border_staff_desc: "После доставки оплаченного переоснащения выделим штаб внешней обороны. Артиллерия и зенитные орудия усилят его части; опыт полевой службы поможет подготовить постоянные позиции."
 STP_pw_party_southern_defence: "Подготовить южную границу"
 STP_pw_party_southern_defence_desc: "Укрепим границы подконтрольных округов на южном направлении. Регулярные пограничные учения позволят поддерживать готовность армии за отдельную плату."
 STP_pw_party_restore_ministries: "Восстановить работу министерств"
 STP_pw_party_restore_ministries_desc: "За 60 казначейских единиц и 28 дней восстановим гражданский аппарат. Результат: 75 политической власти, 5% стабильности и завершение ведомственной программы. Потеря столицы или права на восстановление отменяет заказ с полным возвратом депозита."
 STP_pw_party_reopen_port: "Восстановить портовый округ"
 STP_pw_party_reopen_port_desc: "За 120 казначейских единиц и 42 дня построим гражданское предприятие в одном собственном подконтрольном округе с военно-морской базой; инфраструктура вырастет на 1, если ещё не достигла предела. Потеря всех подходящих портов, места под предприятие или столицы отменяет заказ с возвратом депозита."
 STP_pw_party_refit_guard: "Переоснастить внутренние войска"
 STP_pw_party_refit_guard_desc: "За 100 казначейских единиц и 49 дней получим 1600 единиц пехотного снаряжения, 120 единиц дополнительного оснащения, 100 грузовиков и 25 опыта армии. Материалы поступят в запас Стеландера для существующих частей. Отмена возвращает весь депозит."
 STP_pw_party_return_specialists: "Оплатить инженерные комиссии"
 STP_pw_party_return_specialists_desc: "Выделим 60 казначейских единиц на возвращение специалистов к промышленным разработкам. Две скидки на исследования ускорят восстановление технологической базы."
 STP_pw_party_security_reserve: "Собрать проверенный резерв"
 STP_pw_party_security_reserve_desc: "Выделим 60 казначейских единиц на сбор резервистов, прошедших партийную проверку. На 180 дней увеличатся доступный призывной резерв и скорость мобилизации."
 STP_pw_party_standard_order: "Заказать отечественное вооружение"
 STP_pw_party_standard_order_desc: "За 100 казначейских единиц получим 1600 единиц пехотного снаряжения, 100 единиц дополнительного оснащения и 100 артиллерийских орудий. Повторный заказ доступен через 120 дней, пока Стеландер остаётся самостоятельным."
 STP_pw_party_frontier_exercise: "Провести пограничные учения"
 STP_pw_party_frontier_exercise_desc: "За 60 казначейских единиц организуем учения и подготовку позиций. На 180 дней армия лучше защищает национальную территорию и быстрее окапывается. Повторные учения доступны после завершения действующей программы."
 STP_pw_party_last_purge: "Последняя кадровая чистка"
 STP_pw_party_last_purge_desc: "Проверка лояльности лишила штабы и институты опытных сотрудников. Организация армии и темп исследований временно снизились."
 STP_pw_party_security_cordon: "Проверенный партийный резерв"
 STP_pw_party_security_cordon_desc: "Средства выделены на сбор и подготовку резервистов, которых партийные органы допускают к службе."
 STP_pw_party_frontier_drill: "Пограничные учения"
 STP_pw_party_frontier_drill_desc: "Части отработали оборону национальной территории и оборудование полевых позиций."
 STP_pw_party_recovery_start_tt: "Начинаются три оплачиваемые программы: министерства, портовое хозяйство и переоснащение внутренних войск. Одновременно выполняется один заказ. Ход восстановления показан в существующей категории военного совета."
 STP_pw_party_recovery_complete_tt: "Завершены все три оплаченные программы партийного восстановления."
 STP_pw_party_guard_refitted_tt: "Завершена оплаченная программа переоснащения внутренних войск."
 STP_pw_party_restore_ministries_result_tt: "Через §Y28 дней§!: §G+75§! политической власти, §G+5%§! стабильности и завершение ведомственной программы. Отмена возвращает §Y60§! казначейских единиц."
 STP_pw_party_reopen_port_result_tt: "Через §Y42 дня§! в одном собственном подконтрольном округе с военно-морской базой: §G+1§! гражданское предприятие, §G+1§! инфраструктура до её предела. Завершает хозяйственную программу. Отмена возвращает §Y120§! казначейских единиц."
 STP_pw_party_refit_guard_result_tt: "Через §Y49 дней§! Стеландер получит §Y1600§! единиц £infantry_equipment_text_icon пехотного снаряжения, §Y120§! единиц £support_equipment_text_icon дополнительного оснащения, §Y100§! грузовиков и §G25§! опыта армии. Завершает армейскую программу. Отмена возвращает §Y100§! казначейских единиц."
 STP_pw_party_nod_contract_tt: "Нодрул получит предложение: передать Стеландеру 1000 единиц пехотного снаряжения и 100 единиц дополнительного оснащения из своих запасов за 50 казначейских единиц. Оплата — только при согласии и наличии ресурсов у обеих сторон."
 STP_pw_party_nod_contract_settlement_tt: "Нодрул передаст Стеландеру 1000 единиц пехотного снаряжения и 100 единиц дополнительного оснащения из своих запасов. Стеландер заплатит Нодрулу 50 казначейских единиц. Условия и запасы повторно проверяются при принятии."
 STP_pw_party_recovery_report: "\n\n§YПрограмма президиума§!: завершено [?STP_pw_recovery_progress|0] из 3 заказов. Министерства, портовое хозяйство и переоснащение внутренних войск используют один бюджетный слот. [STPGetRecoverySlot]"
 ADISCORD_STP_pc.22.t: "Оружие для Стеландера"
 ADISCORD_STP_pc.22.d: "Военная миссия Хедерсетта просит продать Стеландеру оружие для регулярной армии. Речь идёт о 1000 единицах пехотного снаряжения и 100 единицах дополнительного оснащения из наших запасов. Стеландер предлагает 50 казначейских единиц.\n\nСогласие означает немедленный расчёт и передачу запасов. Если одна из сторон потеряет необходимые средства или отношения протектората прекратятся, сделка не состоится."
 ADISCORD_STP_pc.22.refuse: "Оставить оружие в наших частях."
 ADISCORD_STP_pc.22.accept: "Принять оплату и передать оружие."
 ADISCORD_STP_pc.23.t: "Победители в прежних кабинетах"
 ADISCORD_STP_pc.23.d: "В приёмной президиума снова стоят очереди. Окружные секретари привезли ведомости убытков, командиры — списки пропавшего оружия, представители домов — счета за жильё и перевозки. Кабинеты остались прежними; людей, способных отвечать за их работу, стало меньше.\n\nХедерсетт ставит перед Палатой домов три задачи: вернуть министерства к ежедневной работе, восстановить портовое хозяйство и снабдить армию, которая сможет покинуть столичные караулы. Но сначала партии предстоит решить судьбу собственных списков. Можно закрыть дела специалистов и вернуть их к станкам. Можно провести последнюю чистку — и принять последствия ещё одной потери кадров.\n\nПобеда дала президиуму время. Деньги, рабочие руки и доверие придётся искать заново."
 ADISCORD_STP_pc.23.a: "Начать с оплаченных обязательств."
 ADISCORD_STP_pc.24.t: "Ответ военной миссии"
 ADISCORD_STP_pc.24.accepted: "Нодрул принял предложение военной миссии. Стеландер перечислил 50 казначейских единиц и получил 1000 единиц пехотного снаряжения и 100 единиц дополнительного оснащения из северных запасов. Снабженцы распределят их между регулярными частями."
 ADISCORD_STP_pc.24.refused: "Военная миссия вернулась без соглашения о поставках. Нодрул не выделил оружие на предложенных условиях. Средства Стеландера остались в казне; переоснащение внутренних войск можно продолжить через собственную программу восстановления."
 ADISCORD_STP_pc.24.a: "Принять доклад."
 STP_pw_party_has_port_capacity: "Есть подконтрольный портовый округ с местом для гражданского предприятия"

 STP_cw_reserve_commanders: "Командиры резервных рот"
 STP_cw_reserve_commanders_desc: "Подготовим командиров и их заместителей для резервных подразделений. При расколе армия Шабрата получит более устойчивую организацию и быстрее подготовит планы операций. Обучение не требует отдельного заказа на дивизию."
 STP_cw_casualty_routes: "Маршруты эвакуации раненых"
 STP_cw_casualty_routes_desc: "Снабженцы свяжут перевязочные пункты с транспортом и местами отдыха. После раскола части Шабрата будут быстрее восстанавливать организацию между боями. Подготовленная сеть останется у сопротивления."

 STP_cw_party_command_sabotage: "Дезорганизация столичного командования"
 STP_cw_party_command_sabotage_desc: "Удар по столичному аппарату нарушил работу партийного штаба. Командиры восстанавливают управление частями и согласование планов."
 STP_cw_disruption_cells: "Боевые группы подполья"
 STP_cw_disruption_cells_desc: "Объединим связи промышленного и столичного подполья в сеть боевых групп. После раскола Шабрат сможет оплачивать операции против партийных территориальных бригад. Возможности сети ограничены: не более двух уничтоженных соединений за гражданскую войну."
 STP_cw_disruption_cells_tt: "После раскола армия Шабрата получит решения против партийных территориальных бригад в округах Стеландера. Операция за £political_power_texticon §Y50§! и £ADISCORD_economy_treasury_texticon §Y100§! длится §Y28 дней§! и уничтожает §Yодну§! присутствующую в выбранном округе бригаду. Одновременно ведётся одна операция; между началами успешных операций — §Y60 дней§!, максимум §Yдве§! за войну. При утрате цели или завершении войны вся оплата возвращается."
 STP_cw_disrupt_brigade: "Удар подполья по гарнизону: [FROM.GetName]"
 STP_cw_disrupt_brigade_desc: "Боевые группы выведут из строя одну партийную территориальную бригаду в выбранном округе. Через 28 дней соединение будет уничтожено вместе с находящимися в нём людьми и вооружением. Союзные, иностранные и прочие типы дивизий не являются целями. Если подходящая бригада уйдёт, округ сменит контролёра или война закончится, операция отменяется с полным возвратом оплаты. Успешно выполнить можно не более двух операций за войну."
 STP_cw_disruption_available_tt: "Шабрат воюет с партией; обе стороны продолжают сопротивление; успешно завершено менее двух операций"
 STP_cw_disruption_idle_tt: "Нет другого оплаченного удара; истекли 60 дней с начала предыдущей успешной операции"
 STP_cw_disruption_target_tt: "Округ контролирует партия; здесь находится хотя бы одна её территориальная бригада"
 STP_cw_disruption_price: "£political_power_texticon §Y50§! £ADISCORD_economy_treasury_texticon §Y100§!"
 STP_cw_disruption_price_blocked: "£political_power_texticon §R50§! £ADISCORD_economy_treasury_texticon §R100§!"
 STP_cw_disruption_price_tooltip: "Цена: £political_power_texticon §Y50§! и £ADISCORD_economy_treasury_texticon §Y100§!. При отмене возвращаются обе суммы."
 STP_cw_disruption_paid_tt: "Начинается операция на §Y28 дней§! против одной партийной территориальной бригады в выбранном округе. Сеть занята; следующий успешный заказ — не раньше чем через §Y60 дней§! от текущего начала."
 STP_cw_disruption_result_tt: "При сохранении цели уничтожается §Yодна§! партийная территориальная бригада, находящаяся в этом округе. Если условия утрачены, возвращаются £political_power_texticon §Y50§! и £ADISCORD_economy_treasury_texticon §Y100§!."
 STP_cw_disruption_refund_tt: "Возврат всей оплаты: £political_power_texticon §Y50§! и £ADISCORD_economy_treasury_texticon §Y100§!. Сеть освобождается; лимит успешных операций не расходуется."

 # Послевоенная экономика Шабрата
 STP_pc_economy_count_the_cost: "Свести военные счета"
 STP_pc_economy_count_the_cost_desc: "Гражданская война закончилась быстрее, чем бухгалтерия успела понять, какое государство осталось после неё. Районные кассы, заводские ведомости и налоговые книги должны снова описывать одну страну, а не несколько военных администраций."
 STP_pc_economy_count_the_cost_tt: "Экономика будет немедленно пересчитана по всей объединённой территории. Общий доход казны: §G+3%§!. Ёмкость казны: §G+3%§!."
 STP_pc_economy_reopen_tax_offices: "Вернуть налоговые книги"
 STP_pc_economy_reopen_tax_offices_desc: "Во время войны сборщики исчезали вместе с архивами, а предприятия платили тому, кто контролировал ближайшую дорогу. Новая власть должна вернуть единый реестр плательщиков и отделить налоги от полевых поборов."
 STP_pc_economy_reopen_tax_offices_tt: "Общий доход казны: §G+5%§!. Административные расходы: §G-3%§!."
 STP_pc_economy_repair_workshops: "Запустить гражданские мастерские"
 STP_pc_economy_repair_workshops_desc: "Ремонтные цеха, которые вчера латали грузовики и винтовки, могут снова производить оборудование для шахт, дорог и домов. Государственный заказ должен вернуть им гражданскую работу."
 STP_pc_economy_repair_workshops_tt: "Будет построена §G1 гражданская фабрика§! в доступном стеландском регионе; если свободного места нет, казна получит §G100§!. Скорость строительства гражданской промышленности: §G+5%§!. Ёмкость казны: §G+5%§!."
 STP_pc_economy_stabilize_currency: "Удержать расчётную единицу"
 STP_pc_economy_stabilize_currency_desc: "После месяцев военных расписок, чрезвычайных закупок и раздельных касс цена денег стала политическим вопросом. Совет министров и банки должны договориться, какие обязательства признаёт республика и чем она за них отвечает."
 STP_pc_economy_stabilize_currency_tt: "Инфляция: §G-3§!. Давление дефицита: §G-5§!. Кредитоспособность: §G+8%§!. Ёмкость казны: §G+2%§!."
 STP_pc_economy_recovery_budget: "Бюджет восстановления"
 STP_pc_economy_recovery_budget_desc: "Восстановление перестанет быть набором чрезвычайных платежей. Дороги, гражданская промышленность, местные администрации и долги получат общий бюджет, рассчитанный на несколько лет, а не на следующую неделю."
 STP_pc_economy_recovery_budget_tt: "Казна получает §G100§!. Общий доход казны: §G+7%§!. Ёмкость казны: §G+5%§!. Административные расходы: §G-2%§!. Рост экономического развития: §G+8%§!."

 # Пропаганда восстановления и развитие страны
 STP_pc_development_country_must_live: "Страна должна жить"
 STP_pc_development_country_must_live_desc: "Победа объясняет, кто получил власть, но не объясняет, зачем людям снова строить школы, мастерские и дороги. Государственная пропаганда должна сменить язык фронта на язык восстановления: Стеланд существует не ради следующей войны, а ради жизни после неё."
 STP_pc_development_country_must_live_tt: "Рост всех направлений развития страны: §G+5%§!."
 STP_pc_development_posters_on_ruins: "Плакаты на руинах"
 STP_pc_development_posters_on_ruins_desc: "На стенах ещё видны следы обстрелов, и именно там появятся первые плакаты новой кампании. Районы будут соревноваться не числом добровольцев, а открытыми школами, работающими службами и восстановленными улицами."
 STP_pc_development_posters_on_ruins_tt: "Месячный рост общества: §G+1§!. Месячный рост государственного развития: §G+1§!. Рост общественного развития: §G+5%§!."
 STP_pc_development_rebuild_as_duty: "Восстановление как обязанность"
 STP_pc_development_rebuild_as_duty_desc: "Республика объявит восстановление такой же общественной обязанностью, какой недавно была оборона района. Инженеры, рабочие и местные администрации получат статус участников общего государственного проекта."
 STP_pc_development_rebuild_as_duty_tt: "Месячный рост экономического развития: §G+1§!. Рост экономического развития: §G+7%§!. Скорость строительства: §G+5%§!."
 STP_pc_development_engineers_on_radio: "Инженеры в эфире"
 STP_pc_development_engineers_on_radio_desc: "Вместо бесконечных речей о врагах радио будет показывать людей, которые восстанавливают электросети, мосты, больницы и производство. Компетентность должна стать частью публичного образа нового государства."
 STP_pc_development_engineers_on_radio_tt: "Месячный рост государственного развития: §G+1§!. Рост государственного развития: §G+7%§!. Скорость исследований: §G+3%§!."
 STP_pc_development_generation_reconstruction: "Поколение восстановления"
 STP_pc_development_generation_reconstruction_desc: "Если война сформировала поколение фронта, мир должен сформировать поколение восстановления. Школы, пресса и государственные программы свяжут личный успех с ростом страны, а не с принадлежностью к очередной вооружённой группе."
 STP_pc_development_generation_reconstruction_tt: "Месячный рост общества, государства и экономики: §G+1§! к каждому направлению. Рост всех направлений развития: §G+8%§!. Дополнительно рост общества, государства и экономики: §G+5%§!."

 STP_pc_development_reopen_universities: "Открыть университеты"
 STP_pc_development_reopen_universities_desc: "Военные штабы забрали лучших преподавателей, лаборатории потеряли оборудование, а часть институтов годами существовала только на бумаге. Государство вернёт университетам финансирование, помещения и право снова планировать работу дольше одного фронтового сезона."
 STP_pc_development_reopen_universities_tt: "Будет добавлена §G1 постоянная ячейка исследования§!. Скорость исследований: §G+2%§!."
 STP_pc_development_national_research_institutes: "Национальные исследовательские институты"
 STP_pc_development_national_research_institutes_desc: "Одних восстановленных университетов мало. Республика создаст сеть специализированных институтов, связанных с промышленностью, инфраструктурой и государственным планированием. Наука должна стать постоянной функцией страны, а не роскошью мирного времени."
 STP_pc_development_national_research_institutes_tt: "Будет добавлена ещё §G1 постоянная ячейка исследования§!. Скорость исследований: §G+3%§!. Рост экономического и государственного развития: §G+3%§!."

