 ADISCORD_west_map_scale:0 "§Y+100 Воркерланд§!                         §CИтора -100§!"
 ADISCORD_west_map_legend:0 "Светлый - союз. Тёмный - проход.\nШтрихи: нейтралитет / зависимость."
 ADISCORD_west_map_rules_tt:0 "§YПолитическая карта Запада§!\nЗолотой - Воркерланд, синий - Итора.\n\nСклонность от +50 или до -50: готовность вступить в войну на соответствующей стороне. От +20 или до -20: проход войск для нейтральной страны.\n\nСерый - колебание; горизонтальные штрихи - объявленный нейтралитет; диагональные - зависимая страна. Уже выбранная сторона войны имеет приоритет над шкалой.\n\nЦвет территории следует её текущему владельцу. Наведите курсор на участок карты или флаг страны для подробностей."
 ADISCORD_west_map_champion_wrk:0 "§YВоркерланд: претендент на господство на Западе§!"
