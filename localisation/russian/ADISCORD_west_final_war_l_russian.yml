 ADISCORD_west_ivn_faction: "Лига свободных республик"
 autonomy_WRK_confederate_republic: "Конфедеративная республика"
 autonomy_WRK_technical_trusteeship: "Техническая опека"
 autonomy_IVN_guaranteed_confederation: "Конфедерация под гарантией"
 autonomy_IVN_emergency_trusteeship: "Чрезвычайная опека"

 ADISCORD_west_final_war_category: "Война за Запад"
 ADISCORD_west_final_war_category_desc: "Западный счёт: §Y[?global.ADISCORD_west_crisis|0]§! / 100.\n\n[ADISCORDWestStatus]"
 ADISCORD_west_status_crisis: "После 180-дневной передышки каждый месяц объединённого Воркерланда добавляет §Y5§!, западные фокусы обеих держав и вступление в Лигу свободных республик - по §Y10§!. При §Y100§! Воркерланд начинает войну за Запад. Финальный фокус любого претендента может начать её раньше.\n\nНейтралитета не будет: Римат, Норвейн, Крайт, районы северного коридора и свободные республики займут одну из сторон."
 ADISCORD_west_status_war: "Идёт война за Запад. Мир без победителя невозможен. Войну заканчивает капитуляция претендента либо через §Y720§! дней итог по очкам. Сторона получает очко за каждый удерживаемый район северного коридора и за каждую занятую землю противника: Старую марку и приграничье Иторы или Центральный дистрикт Воркерланда. Свои земли очков не дают; при равенстве побеждает обороняющаяся сторона."
 ADISCORD_west_status_no_rival: "У Воркерланда не осталось западного соперника. В начале следующего месяца он будет признан сюзереном Запада."
 ADISCORD_west_status_resolved: "Война за Запад окончена. У региона один сюзерен."
 ADISCORD_west_status_closed: "Западный вопрос откроется, когда один из претендентов объединит Воркерланд."
 ADISCORD_west_join_wrk_tt: "Страна вступает в §YКонфедеративный фронт§! или воюет на стороне Воркерланда до итогового урегулирования."
 ADISCORD_west_join_ivn_tt: "Страна вступает в §YЛигу свободных республик§! или воюет на стороне Иторы до итогового урегулирования."
 ADISCORD_west_league_accept_tt: "Страна вступает в §YЛигу свободных республик§!. Западный счёт: §Y+10§!."
 ADISCORD_west_league_refuse_tt: "Страна остаётся вне союза. В войне за Запад она выберет сторону или нейтралитет по своей склонности."

 ADISCORD_west_wrk_solidarity_committees: "Комитеты солидарности"
 ADISCORD_west_wrk_solidarity_committees_desc: "Рабочие комитеты конфедерации идут за мандатом, а не за трофеями. Они обещают Иторе место в общем доме и держатся упорнее, чем рассчитывали её генералы."
 ADISCORD_west_wrk_imperial_columns: "Имперские колонны"
 ADISCORD_west_wrk_imperial_columns_desc: "Петричев возвращает марки так же, как собирал округа: колоннами, приказами и сроками. Империя спешит, и тыл расплачивается за эту спешку."
 ADISCORD_west_wrk_engineer_battalions: "Инженерные батальоны"
 ADISCORD_west_wrk_engineer_battalions_desc: "Дирекция Воркса ведёт войну как стройку: дороги, мосты и склады идут впереди дивизий, а каждая занятая станция сразу включается в общий план."
 ADISCORD_west_ivn_humanist_shield: "Гуманистический щит"
 ADISCORD_west_ivn_humanist_shield_desc: "Итора защищает не границу, а людей за ней. Госпитали, убежища и ополчение марок держат землю, которую армия обещала не отдавать."
 ADISCORD_west_ivn_emergency_order: "Чрезвычайный порядок"
 ADISCORD_west_ivn_emergency_order_desc: "Комитет приостановил выборы и перевёл марки на военное положение. Итора идёт на запад сама, пока Воркерланд не пришёл к ней."
 ADISCORD_west_ivn_committee_line: "Линия комитета"
 ADISCORD_west_ivn_committee_line_desc: "Комитет так и не выбрал курс, но приграничные гарнизоны знают свою задачу: удержать Старую марку."
 ADISCORD_west_wrk_corridor_push: "Наступление на коридор"
 ADISCORD_west_wrk_corridor_push_desc: "Резервы конфедерации брошены на северный коридор."
 ADISCORD_west_ivn_march_defence: "Оборона марок"
 ADISCORD_west_ivn_march_defence_desc: "Марки закапываются в землю и не отступают без приказа."

 ADISCORD_west_wrk_corridor_offensive: "Наступление на коридор"
 ADISCORD_west_wrk_corridor_offensive_desc: "Конфедерация собирает резервы для удара по северному коридору."
 ADISCORD_west_ivn_hold_the_marches: "Удержать марки"
 ADISCORD_west_ivn_hold_the_marches_desc: "Комитет переводит приграничные марки на круговую оборону."

 ADISCORD_west.1.t: "Запад не делится на двоих"
 ADISCORD_west.1.d_wrk_worker: "Конгресс конфедерации предложил Иторе то же, что получили вернувшиеся округа: место в общем доме, собственное правительство и голос в совете республик. Комитет Иторы ответил, что не нуждается в чужом доме.\n\nКомитеты солидарности выходят к коридору Норвейна. Если мандат победит, Итора останется Иторой - но уже членом конфедерации."
 ADISCORD_west.1.d_wrk_joint: "Влад Петричев не признаёт ни границы Иторы, ни её комитета. Марки когда-то платили налоги Воркерланду, и империя намерена вернуть их полностью.\n\nИмперские колонны идут к коридору. Эта война не закончится сателлитом: побеждённые станут провинциями."
 ADISCORD_west.1.d_wrk_utilitarian: "Дирекция Воркса подсчитала стоимость коридора: каждая станция, мост и склад без общего плана обходятся Западу дороже войны.\n\nИнженерные батальоны идут впереди дивизий. Приграничье Иторы должно войти в общую сеть, а её промышленность - работать под технической опекой."
 ADISCORD_west.1.d_ivn_shield: "Комитет Иторы обещал защищать людей, а не линии на карте. Теперь это обещание проверяется войной: Римат, Норвейн и свободные республики смотрят, удержит ли Итора коридор.\n\nГуманистический щит поднят. Если он выстоит, Воркерланд сохранит своё правительство - но под гарантией Иторы."
 ADISCORD_west.1.d_ivn_emergency: "Чрезвычайный комитет не стал ждать, пока колонны Воркерланда подойдут к Старой марке. Выборы приостановлены, марки мобилизованы, а коридор Норвейна объявлен первой целью.\n\nЕсли поход удастся, Воркерланд перейдёт под чрезвычайную опеку Иторы."
 ADISCORD_west.1.d_ivn_committee: "Комитет Иторы так и не выбрал курс, но Воркерланд не стал ждать решения. Гарнизоны марок занимают позиции.\n\nНа Западе останется только один сюзерен."
 ADISCORD_west.1.a: "Запад будет единым."
 ADISCORD_west.2.t: "Война за Запад"
 ADISCORD_west.2.d: "Объединённый Воркерланд и Итора вступили в открытую войну. Северный коридор, который ещё недавно делили округа гражданской войны, стал единственной дорогой между двумя державами.\n\nРимат, Норвейн, Крайт, районы коридора и свободные республики выбирают сторону. Нейтральных на Западе не осталось."
 ADISCORD_west.2.a: "Коридор решит всё."
 ADISCORD_west.3.t: "Тень над коридором"
 ADISCORD_west.3.d: "Объединённый Воркерланд переносит штабы к северному коридору, а Итора укрепляет марки. Дипломаты обеих сторон всё ещё говорят о мире, но склады заполняются быстрее, чем идут переговоры.\n\nНаблюдатели сходятся в одном: Запад не останется поделённым надолго."
 ADISCORD_west.3.a: "Это вопрос времени."
 ADISCORD_west.10.t: "Война у наших границ"
 ADISCORD_west.10.d: "Воркерланд и Итора воюют за Запад. Наши дороги и станции лежат между фронтами, и обе стороны ждут нашего ответа. Можно выступить с одной из них или объявить нейтралитет и пропускать через свои земли только того, кому мы доверяем больше.\n\nНаша склонность: §Y[?ADISCORD_west_lean|+0]§! (плюс - к Воркерланду, минус - к Иторе)."
 ADISCORD_west.10.a: "С Воркерландом."
 ADISCORD_west.10.b: "С Иторой."
 ADISCORD_west.31.t_wrk: "Воркерланд - сюзерен Запада"
 ADISCORD_west.31.t_ivn: "Итора - сюзерен Запада"
 ADISCORD_west.31.d_wrk_unopposed: "Итора больше не может оспорить первенство объединённого Воркерланда. Западный вопрос закрыт без последней войны.\n\nКонфедерация вновь говорит от имени всего Запада."
 ADISCORD_west.31.d_wrk_worker: "Мандат конфедерации победил. Итора и её союзники вошли в общий дом как конфедеративные республики: у них остаются свои правительства, но армии и внешняя политика подчиняются совету республик.\n\nНикита Уоркер называет это не завоеванием, а возвращением."
 ADISCORD_west.31.d_wrk_joint: "Имперские колонны дошли до Старой марки. Комитет Иторы распущен, а её земли и земли союзников вошли в состав Воркерландской империи.\n\nПетричев получил марки, которые обещал вернуть. Сопротивление на них только начинается."
 ADISCORD_west.31.d_wrk_utilitarian: "Дирекция Воркса провела новую границу по инженерной карте. Приграничье Иторы присоединено к общей сети, а сама Итора работает под технической опекой.\n\nЗапад объединён не флагом, а планом."
 ADISCORD_west.31.d_ivn_shield: "Гуманистический щит выдержал. Северный коридор перешёл к Иторе, а Воркерланд сохранил своё правительство как конфедерация под её гарантией.\n\nКомитет Иторы обещает, что эта гарантия защищает людей, а не диктует им законы."
 ADISCORD_west.31.d_ivn_emergency: "Чрезвычайный поход завершился победой. Коридор присоединён к Иторе, а Воркерланд передан под чрезвычайную опеку её комиссаров.\n\nВчерашняя осаждённая республика стала хозяином Запада."
 ADISCORD_west.31.d_ivn_committee: "Итора удержала марки и заставила Воркерланд признать поражение. Северный коридор перешёл к ней, а Воркерланд стал её сателлитом.\n\nНа Западе один сюзерен."
 ADISCORD_west.31.t_truce: "Перемирие на Западе"
 ADISCORD_west.31.d_truce: "Война за Запад не дала перевеса ни одной из сторон. Ни Воркерланд, ни Итора не удержали больше земель противника, чем потеряли сами, и генеральные штабы подписали перемирие по линии соприкосновения.\n\nОба правительства сохранили власть, но западный вопрос остался без ответа: у Запада нет сюзерена, а коридор по-прежнему разделяет две армии."
 ADISCORD_west.31.a: "Запад един."
 ADISCORD_west.31.b: "Запад остаётся разделённым."
 ADISCORD_west.40.t: "Приглашение в Лигу"
 ADISCORD_west.40.d: "Итора предлагает нам вступить в Лигу свободных республик. Комитет обещает защиту от Воркерланда и признание нашего правительства.\n\nВступление свяжет нас с Иторой в будущей войне за Запад. Отказ оставит нас одних между двумя державами."
 ADISCORD_west.40.a: "Вступить в Лигу."
 ADISCORD_west.40.b: "Сохранить независимость."
 ADISCORD_west.41.t: "Лига растёт"
 ADISCORD_west.41.d: "[From.GetName] вступает в Лигу свободных республик."
 ADISCORD_west.41.a: "Ещё один щит."
 ADISCORD_west.42.t: "Отказ от Лиги"
 ADISCORD_west.42.d: "[From.GetName] отклоняет приглашение в Лигу свободных республик."
 ADISCORD_west.42.a: "Их выбор."
 ADISCORD_west_status_reconstruction:0 "После объединения Воркерланда действует §Y180-дневная передышка§!. Война за Запад пока недоступна обеим державам, а ежемесячная прибавка к западному счёту приостановлена. Фокусы и вступление в Лигу по-прежнему меняют счёт. После передышки возобновится ежемесячный рост и откроется возможность начать финальные военные фокусы."
 ADISCORD_west_wrk_offer_front_treaty: "Предложить договор о Западе"
 ADISCORD_west_wrk_offer_front_treaty_desc: "Воркерланд не ждёт, пока Итора соберёт весь Запад в свою Лигу. Посланники предлагают соседу место в Конфедеративном фронте: общую оборону, поставки и голос при будущем урегулировании. Ответ остаётся за самим соседом."
 ADISCORD_west_wrk_offer_front_treaty_tt: "[From.GetName] получит предложение вступить в §YКонфедеративный фронт§! и ответит сам. Согласие привяжет страну к Воркерланду в войне за Запад. Западный счёт при согласии: §Y+10§!."
 ADISCORD_west_wrk_front_command_tt: "Воркерланд не состоит в чужой фракции"
 ADISCORD_west_wrk_treaty_target_tt: "Страна независима, не состоит во фракции, не воюет с нами, не рассматривает другое предложение, а война за Запад ещё не началась"
 ADISCORD_west_front_accept_tt: "Страна вступает в §YКонфедеративный фронт§!. Западный счёт: §Y+10§!."
 ADISCORD_west_front_refuse_tt: "Страна остаётся вне союза. В войне за Запад она выберет сторону или нейтралитет по своей склонности."
 ADISCORD_west.43.t: "Договор о Западе"
 ADISCORD_west.43.d: "Посланники [From.GetName] привезли проект договора. Воркерланд предлагает нам место в Конфедеративном фронте: общую оборону коридора, поставки для наших гарнизонов и голос при будущем урегулировании Запада.\n\nПодпись свяжет нас с Воркерландом в войне с Иторой. Отказ оставит нам свободу, но не нейтралитет: когда начнётся война, выбирать всё равно придётся."
 ADISCORD_west.43.a: "Подписать договор."
 ADISCORD_west.43.b: "Отказать посланникам."
 ADISCORD_west.44.t: "Фронт растёт"
 ADISCORD_west.44.d: "[From.GetName] подписывает договор и вступает в Конфедеративный фронт."
 ADISCORD_west.44.a: "Ещё один участок коридора."
 ADISCORD_west.45.t: "Договор отклонён"
 ADISCORD_west.45.d: "[From.GetName] отказывается подписать договор о Западе."
 ADISCORD_west.45.a: "Запомним."

# Influence over the western states
 ADISCORD_west_influence_category:0 "Влияние на Западе"
 ADISCORD_west_influence_category_desc:0 "Шкала склонности: §Y+100§! - Воркерланд, §Y-100§! - Итора. При начале войны страна со шкалой от §Y±50§! выступает на этой стороне, остальные сохраняют нейтралитет. Нейтральная страна со шкалой от §Y±20§! пропускает через свои земли войска того претендента, к которому склоняется.\n\n[PWR.GetName]: [PWR.ADISCORDWestLean]\n[PSD.GetName]: [PSD.ADISCORDWestLean]\n[ZAO.GetName]: [ZAO.ADISCORDWestLean]\n[WIT.GetName]: [WIT.ADISCORDWestLean]\n[IIA.GetName]: [IIA.ADISCORDWestLean]\n[IBA.GetName]: [IBA.ADISCORDWestLean]\n[IBL.GetName]: [IBL.ADISCORDWestLean]\n[WPA.GetName]: [WPA.ADISCORDWestLean]\n[WPS.GetName]: [WPS.ADISCORDWestLean]\n[ROM.GetName]: [ROM.ADISCORDWestLean]\n[TRU.GetName]: [TRU.ADISCORDWestLean]"
 ADISCORD_west_lean_absent:0 "§gне существует§!"
 ADISCORD_west_lean_side_wrk:0 "§Yвоюет на стороне Воркерланда§!"
 ADISCORD_west_lean_side_ivn:0 "§Yвоюет на стороне Иторы§!"
 ADISCORD_west_lean_neutral:0 "§Y[?ADISCORD_west_lean|+0]§!, нейтралитет"
 ADISCORD_west_lean_subject:0 "§gзависимая страна§!"
 ADISCORD_west_lean_wrk_ally:0 "§Y[?ADISCORD_west_lean|+0]§!, готова выступить с Воркерландом"
 ADISCORD_west_lean_ivn_ally:0 "§Y[?ADISCORD_west_lean|+0]§!, готова выступить с Иторой"
 ADISCORD_west_lean_wrk_tilt:0 "§Y[?ADISCORD_west_lean|+0]§!, склоняется к Воркерланду"
 ADISCORD_west_lean_ivn_tilt:0 "§Y[?ADISCORD_west_lean|+0]§!, склоняется к Иторе"
 ADISCORD_west_lean_undecided:0 "§Y[?ADISCORD_west_lean|+0]§!, колеблется"
 ADISCORD_west_send_envoys:0 "Отправить посольство"
 ADISCORD_west_send_envoys_desc:0 "Посланники обещают защиту, торговлю и место в будущем порядке Запада. Каждая миссия понемногу меняет настроения правительства и улиц."
 ADISCORD_west_send_envoys_tt:0 "Склонность [From.GetName] сдвигается к нам на §Y[?ROOT.ADISCORD_west_influence_power|0]§!."
 ADISCORD_west_ship_arms:0 "Передать оружие"
 ADISCORD_west_ship_arms_desc:0 "Оружие с наших складов убедительнее любых речей. Получатель запомнит, кто вооружил его гарнизоны."
 ADISCORD_west_ship_arms_tt:0 "Мы передаём [From.GetName] §Y1000§! винтовок из своего запаса. Склонность [From.GetName] сдвигается к нам на §Y[?ROOT.ADISCORD_west_influence_power|0]§! и ещё на §Y5§!."
 ADISCORD_west_ship_arms_stock_tt:0 "На складе есть не менее §Y1000§! винтовок"
 ADISCORD_west_ally_lean_tt:0 "Склонность страны к нам составляет не менее §Y50§!"
 ADISCORD_west_ivn_league_command_tt:0 "Итора не состоит в чужой фракции"
 ADISCORD_west_ivn_offer_league:0 "Пригласить в Лигу"
 ADISCORD_west_ivn_offer_league_desc:0 "Итора предлагает соседу место в Лиге свободных республик: взаимную защиту, общий госпиталь марок и голос при будущем урегулировании. Ответ остаётся за самим соседом."
 ADISCORD_west_ivn_offer_league_tt:0 "[From.GetName] получит приглашение в §YЛигу свободных республик§! и ответит сам. Согласие привяжет страну к Иторе в войне за Запад. Западный счёт при согласии: §Y+10§!."
 ADISCORD_west_call_to_arms:0 "Призвать к оружию"
 ADISCORD_west_call_to_arms_desc:0 "Нейтралитет соседа больше не выдерживает давления войны. Мы просим его выступить на нашей стороне, пока исход ещё не решён."
 ADISCORD_west_call_to_arms_tt:0 "[From.GetName] получит призыв вступить в войну на нашей стороне и ответит сам."
 ADISCORD_west_neutrality_tt:0 "Страна сохраняет нейтралитет: заключает мир с обеими сторонами и не подлежит итоговому урегулированию. При склонности от §Y±20§! она пропускает через свои земли войска того претендента, к которому склоняется."
 ADISCORD_west_call_accept_tt:0 "Страна вступает в войну за Запад на стороне призвавшего претендента."
 ADISCORD_west_call_refuse_tt:0 "Страна сохраняет нейтралитет."
 ADISCORD_west.10.c:0 "Сохранить нейтралитет."
 ADISCORD_west.46.t:0 "Призыв к оружию"
 ADISCORD_west.46.d:0 "[From.GetName] просит нас оставить нейтралитет и выступить на его стороне в войне за Запад. Посланники напоминают о поставках и обещаниях последних месяцев.\n\nНаша склонность: §Y[?ADISCORD_west_lean|+0]§!."
 ADISCORD_west.46.a:0 "Мы выступаем."
 ADISCORD_west.46.b:0 "Нейтралитет остаётся в силе."
 ADISCORD_west.47.t:0 "Новый союзник"
 ADISCORD_west.47.d:0 "[From.GetName] оставляет нейтралитет и вступает в войну за Запад на нашей стороне."
 ADISCORD_west.47.a:0 "Добро пожаловать на фронт."
 ADISCORD_west.48.t:0 "Призыв отклонён"
 ADISCORD_west.48.d:0 "[From.GetName] сохраняет нейтралитет и не вступает в войну за Запад."
 ADISCORD_west.48.a:0 "Посмотрим, долго ли он продержится."

 ADISCORD_west_free_republics_lean_tt:0 "Склонность [ROM.GetName] и [TRU.GetName] сдвигается к Воркерланду на §Y30§!."

# Itoran courses
 ADISCORD_west_ivn_humanitarian_convoys:0 "Гуманитарные конвои"
 ADISCORD_west_ivn_humanitarian_convoys_desc:0 "Колонны госпиталей марок везут лекарства и продовольствие соседям. Благодарность людей сильнее речей посланников."
 ADISCORD_west_ivn_humanitarian_convoys_tt:0 "Склонность [From.GetName] сдвигается к Иторе на §Y[?ROOT.ADISCORD_west_influence_power|0]§! и ещё на §Y10§!."
 ADISCORD_west_ivn_ultimatum:0 "Ультиматум соседу"
 ADISCORD_west_ivn_ultimatum_desc:0 "Чрезвычайный комитет требует от соседа признать протекторат марок. Угроза действует быстро, но приближает большую войну."
 ADISCORD_west_ivn_ultimatum_tt:0 "Склонность [From.GetName] сдвигается к Иторе на §Y25§!. До начала войны западный счёт растёт на §Y10§!."

# Revanche course
 ADISCORD_west_ivn_revanche_legion:0 "Легион марок"
 ADISCORD_west_ivn_revanche_legion_desc:0 "Ветераны мятежа идут впереди армии. Они воюют за реванш, а не за порядок, и не считают потерь."
 ADISCORD_west.1.d_ivn_revanche:0 "Генерал Карн обещал марочным полкам реванш, и легион идёт за ним. Северная экспедиция отступила перед Воркерландом - теперь Итора возвращается туда же, но уже без гуманистов и без кабинета.\n\nПобеда должна сделать Воркерланд частью марок."
 ADISCORD_west.31.d_ivn_revanche:0 "Легион марок завершил реванш. Воркерланд и его союзники присоединены к Иторе, а северный коридор стал внутренней дорогой марок.\n\nНа Западе одна страна."
