l_russian:
 ADISCORD_vorkerland_dirty_zone.1.t: "Завеса над Грязной зоной рассеялась"
 ADISCORD_vorkerland_dirty_zone.1.d: "После долгих лет изоляции из-за периметра Грязной зоны вновь приходят проверяемые сообщения. Старые дороги открываются, на картах возникают границы новых администраций, а линии связи, считавшиеся мёртвыми, снова передают приказы. Территория, которую за пределами зоны привыкли считать бесформенной заражённой пустошью, оказалась раздробленным миром со своими властями, конфликтами и претензиями на выживание. Теперь этот мир снова соприкасается с остальным континентом."
 ADISCORD_vorkerland_dirty_zone.1.a: "Мёртвая земля заговорила."

 ADISCORD_debug_open_vorkerland_dirty_zone: "§RDEBUG:§! Открыть Грязную зону"
 ADISCORD_debug_open_vorkerland_dirty_zone_desc: "Пропускает трёхлетнее ожидание и запускает штатный сценарий открытия Грязной зоны через событие ADISCORD_vorkerland_collapse.85."
