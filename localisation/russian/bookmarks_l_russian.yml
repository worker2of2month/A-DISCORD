l_russian:
 BM_HISTORY_TITLE: "Краткая история"
 GATHERING_STORM_NAME: "Раненый лев"
 GATHERING_STORM_DESC: "В 2130 году в журнале одного из убежищ реакторного пояса записали, сколько людей спустилось с поверхности, сколько осталось воды и когда придётся менять фильтры. Выше на той же странице ещё стояло время выхода бригады на смену. Затем связь с поверхностью оборвалась. После гибели реактора в городах Вейранской империи, где давно ждали перемен, началось открытое восстание.\n\nПервая революция свергла монархию. Никита Уоркер дал стране имя Воркерланд. Из дворцовых канцелярий вынесли портреты императорской семьи, а писари, знавшие, как провести состав через три округа, наутро вернулись к столам. Вместе с архивами республика унаследовала гарнизоны, дальние нефтяные промыслы и долги перед соседями.\n\nК 2160 году Башня Единства всё ещё передаёт приказы Уоркера. На станции вагон зерна могут одновременно затребовать столичное министерство и окружной штаб. У каждого есть печать и вооружённая охрана. Начальник станции должен решить, чьим людям достанется хлеб и чьей подписью он потом оправдается.\n\nЗа границами конфедерации тоже прислушиваются к этим спорам. В Стеландере Воркерланд поручился за мир, в Кефрейте его заказы кормят заводские посёлки, в Светлогорье его именем отпускают нефть. Утром 1 января 2160 года все эти договоры ещё в силе. По всему Форулу люди перечитывают свои экземпляры."
 ADISCORD_BOOKMARK_MENU_ENTRY: "$GATHERING_STORM_NAME$"
 ADISCORD_BOOKMARK_CHRONICLE: "Хроника Форула"
 ADISCORD_BOOKMARK_COUNTRIES: "Страны Форула"
 ADISCORD_BOOKMARK_TO_MAP: "Перейти к карте"
 ADISCORD_BOOKMARK_ATLAS_HINT: "Остальные страны"
 ADISCORD_BOOKMARK_SPIRITS: "Национальные духи"
 ADISCORD_BOOKMARK_FOCUSES: "Ключевые фокусы"

 VAL_bookmark_route_solgalov_tt: "§YКонтракты Солгалова§!\n§LУ каждой войны есть накладная.§!\n\nСолгалов узнаёт свои вагоны даже в\nтемноте. Вчера в них отправили сталь.\nСегодня они возвращаются с ключами от\nпограничных складов.\n\n\n\n\n£GFX_VAL_bookmark_route_solgalov_banner\n \n \n \n \n \n \n "
 VAL_bookmark_route_captains_tt: "§YСовет командиров Крутова§!\n§LБарон звонит уже в третий раз.§!\n\nКрутов кладёт на стол свой старый\nконтракт, а сверху - знак роты. Один за\nдругим капитаны снимают перчатки.\nТелефон у локтя Крутова продолжает\nзвонить.\n\n\n\n\n£GFX_VAL_bookmark_route_captains_banner\n \n \n \n \n \n \n "
 VAL_bookmark_route_settlement_tt: "§YПослевоенный Кефрейт§!\n§LПоследний блокпост ещё не сдал ключи.§!\n\nУ моста ждут капитан, чиновник и\nпредставитель оружейных заводов. У\nкаждого своё распоряжение о том, кому\nтеперь принадлежит дорога.\n\n\n\n\n£GFX_VAL_bookmark_route_settlement_banner\n \n \n \n \n \n \n "
 NAM_bookmark_route_governors_tt: "§YЛестница наместников§!\n§LДо верхнего этажа доходит только один\nэкземпляр.§!\n\nНа промысле кончилось топливо для\nнасосов. Гонец уже миновал три\nприёмные. За последней дверью Егор Ром\nизучает его подпись.\n\n\n\n\n£GFX_NAM_bookmark_route_governors_banner\n \n \n \n \n \n \n "
 NAM_bookmark_route_districts_tt: "§YХартия районов§!\n§LЗдесь скважину называют по имени\nбурильщика.§!\n\nНа промысел привезли хартию. Механик\nвытер руку о куртку и всё равно оставил на\nбумаге чёрный след. Остальные\nрасписались рядом.\n\n\n\n\n£GFX_NAM_bookmark_route_districts_banner\n \n \n \n \n \n \n "
 NAM_bookmark_route_contracts_tt: "§YРеспублика договоров§!\n§LВентиль открывается с двух сторон.§!\n\nУ резервуара встречаются люди из двух\nрайонов. Одна артель владеет\nцистернами, другая держит ветку до порта.\nДоговор подписывают на капоте. Печать\nстолицы больше не нужна.\n\n\n\n\n£GFX_NAM_bookmark_route_contracts_banner\n \n \n \n \n \n \n "
 NAM_bookmark_route_exile_tt: "§YПравительство в изгнании§!\n§LПозывной прежний. Берег другой.§!\n\nНа островной пристани канцелярия заняла\nодин ящик и складной стул. Связист снова\nнабирает частоту промыслов. На этот раз\nкто-то отвечает.\n\n\n\n\n£GFX_NAM_bookmark_route_exile_banner\n \n \n \n \n \n \n "
 SHL_bookmark_route_ten_tt: "§YКонклав десяти§!\n§LДесятая печать ещё горячая.§!\n\nВ зале девяти домов поставили лишнее\nкресло. Литейщик несёт к нему новый\nгерб в рабочих рукавицах. Никто из\nсобравшихся не предлагает ему снять их.\n\n\n\n\n£GFX_SHL_bookmark_route_ten_banner\n \n \n \n \n \n \n "
 SHL_bookmark_route_cities_tt: "§YЮжный договор§!\n§LУ каждого берега свой ключ от переправы.§!\n\nМехран Арбин смотрит, как опускают цепь\nу причала. С другого берега отвечают тем\nже. Под южным договором стоят печати\nгородов по обе стороны реки.\n\n\n\n\n£GFX_SHL_bookmark_route_cities_banner\n \n \n \n \n \n \n "
 SHL_bookmark_route_nur_tt: "§YДирекция печей§!\n§LПервую печь зажигают одним движением\nруки.§!\n\nВ рубке Джалиля Нура слышно, как\nначинают гудеть цеха. Дежурный держит\nвозле телефона список городов. Каждый\nподтвердит, что услышал команду.\n\n\n\n\n£GFX_SHL_bookmark_route_nur_banner\n \n \n \n \n \n \n "
 SHL_bookmark_route_regency_tt: "§YСовет гербов§!\n§LСтарое кресло вернули под балдахин.§!\n\nНа поясе Дария Сафира блестит большая\nпечать регента. Наследственные дома\nзамечают, кто помог ему её застегнуть, и\nкто остался стоять за дверью.\n\n\n\n\n£GFX_SHL_bookmark_route_regency_banner\n \n \n \n \n \n \n "
 SHL_bookmark_route_commune_tt: "§YКоммуна огня§!\n§OСегодня гудок дали снизу.§!\n\nМастер ночной смены поворачивает ключ.\nЗа её спиной слесари и литейщики ждут,\nкогда разойдутся створки. Салим Дарзи\nпришёл вместе с ними. Впервые печи\nоткроет сама смена.\n\n\n\n\n£GFX_SHL_bookmark_route_commune_banner\n \n \n \n \n \n \n "
 RUS_bookmark_route_khan_tt: "§YПоследняя империя§!\n§R\"У человечества один путь к свободе.\nЯ свергну императоров одного за другим.\nМоя империя будет последней.\"§!\n§g- Марк Рустан§!\n\nСтепные сотни присягают Хану.\nВ бункере инженер Корнеев спрашивает,\nкак люди узнают, что войны кончились.\nРустан закрывает папку \"Последний закат\".\n- Будет звонок.\n\n\n\n\n£GFX_RUS_bookmark_route_khan_banner\n \n \n \n \n \n \n "
 RUS_bookmark_route_scientists_tt: "§YУчёный совет Корнеева§!\n§LПриказ из бункера подписан почерком\nинженера.§!\n\nГлеб Корнеев кладёт ладонь на штурвал. За\nстеклом один за другим оживают приборы.\nОфицер у входа впервые ждёт\nраспоряжений от человека в рабочем\nхалате.\n\n\n\n\n£GFX_RUS_bookmark_route_scientists_banner\n \n \n \n \n \n \n "
 RUS_bookmark_route_guard_tt: "§YИмперия Чёрного Знамени§!\n§RЧёрная армия принесла присягу. Хана не\nпозвали.§!\n\nТагир Мансуров выходит к бетонному\nпандусу. В степи уже горят фары первой\nколонны. На развилке к Воркерланду над\nголовной машиной разворачивают чёрное\nзнамя.\n\n\n\n\n£GFX_RUS_bookmark_route_guard_banner\n \n \n \n \n \n \n "
 IVN_bookmark_route_committee_tt: "§YЧрезвычайный комитет§!\n§LСвязь со столицей восстановлена. Голос\nнезнакомый.§!\n\nДиспетчер переводит последнюю линию на\nкомитет. Куливанов просит соединить его с\nмарками. Ответа приходится ждать дольше\nобычного.\n\n\n\n\n£GFX_IVN_bookmark_route_committee_banner\n \n \n \n \n \n \n "
 IVN_bookmark_route_legion_tt: "§YВечный Империум§!\n§RНад Иторой взошло Чёрное Солнце.§!\n\nВчера легионеры несли штандарт по\nлесной дороге. Сегодня на площади\nперед ним склоняются знамёна всех\nмарок. Леонид Сталк принимает первый\nпарад объединённой Иторы.\n\n\n\n\n£GFX_IVN_bookmark_route_legion_banner\n \n \n \n \n \n \n "
 IVN_bookmark_route_directorate_tt: "§YВоенная директория марок§!\n§LФорт открывает ворота по собственным\nчасам.§!\n\nРостислав Карн встречает утро в\nкараульной. Судейское кресло отодвинули\nк стене. На его месте уже лежит планшет\nдежурного офицера.\n\n\n\n\n£GFX_IVN_bookmark_route_directorate_banner\n \n \n \n \n \n \n "
 IVN_bookmark_route_communes_tt: "§YСоюз свободных общин§!\n§LКлюч от ратуши не поедет в столицу.§!\n\nВ сельской школе заняли все скамьи. На\nподоконнике ждут своей очереди печати\nсоседних общин. Слово дают женщине,\nкоторая пришла прямо со смены.\n\n\n\n\n£GFX_IVN_bookmark_route_communes_banner\n \n \n \n \n \n \n "
 IVN_bookmark_route_marches_tt: "§YСовет автономных марок§!\n§LЧерез перевал ответили огнём на огонь.§!\n\nКартограф смотрит в трубу. Из тумана\nпроступают сигнальные башни соседних\nдолин. Каждая марка зажигает свой\nфонарь сама.\n\n\n\n\n£GFX_IVN_bookmark_route_marches_banner\n \n \n \n \n \n \n "
 WRK_bookmark_route_worker_tt: "§YВозвращение Уоркера§!\n§LВ последнем вагоне наконец зажёгся свет.§!\n\nНа западной платформе раскрывают ящик\nсо старым знаменем. Уоркер видит его\nещё из окна. На перроне впервые за\nдолгие месяцы произносят имя страны\nцеликом.\n\n\n\n\n£GFX_WRK_bookmark_route_worker_banner\n \n \n \n \n \n \n "
 WRK_bookmark_route_staff_tt: "§YВоенный округ Петрищева§!\n§LСтрелки на столицу перевёл сам\nкомандующий.§!\n\nВлад Петрищев складывает депешу и\nпрячет её во внутренний карман.\nЖелезнодорожник ждёт, когда ему\nразрешат дать зелёный.\n\n\n\n\n£GFX_WRK_bookmark_route_staff_banner\n \n \n \n \n \n \n "
 WRK_bookmark_route_technicians_tt: "§YТехнократия доктора Воркса§!\n§LПока идёт опыт, связь с кабинетом\nотключена.§!\n\nПод лампой слышно дыхание. На ленте\nсамописца дрогнула линия. У больничной\nкойки доктор Воркс узнаёт об этом\nпервым. Кабинет будет ждать его решения\nдо утра.\n\n\n\n\n£GFX_WRK_bookmark_route_technicians_banner\n \n \n \n \n \n \n "
 WRK_bookmark_route_joint_tt: "§YСовместное правительство§!\n§LНа узле звонят сразу два телефона.§!\n\nОдин аппарат соединён со штабом\nПетрищева, другой с кабинетом Уоркера.\nПервый общий приказ связист записывает в\nодин журнал.\n\n\n\n\n£GFX_WRK_bookmark_route_joint_banner\n \n \n \n \n \n \n "
 WRK_bookmark_route_bagley_tt: "§YИсполком Антона Багли§!\n§LСобрание назначено прямо в цеху.§!\n\nУ пресса останавливают маховик. Когда\nстихает последний оборот, даже у дальних\nворот слышно, как Антон Багли объявляет\nперекличку.\n\n\n\n\n£GFX_WRK_bookmark_route_bagley_banner\n \n \n \n \n \n \n "
 VAL_bookmark_route_korsch_tt: "§YРеванш Эдуарда Корша§!\n§LВетераны приходят по одному. Ворота\nоткрыты.§!\n\nНа заводской решётке повязана старая\nполковая лента. Корш останавливается\nрядом. Кто-то по ту сторону забора\nзажигает второй фонарь.\n\n\n\n\n£GFX_VAL_bookmark_route_korsch_banner\n \n \n \n \n \n \n "
 ADISCORD_BOOKMARK_IN_DEVELOPMENT_TT: "Полная кампания этой страны ещё в разработке. Малые флаги и эмблемы показывают уже известные политические пути."
 ADISCORD_BOOKMARK_IN_DEVELOPMENT: "В разработке"
 OTHER_GATHERING_STORM_DESC: "Далеко от Башни Единства жизнь идёт по своим часам. В караванном Кадире проводник отвечает за путь от колодца до колодца. В Рахме соседи вместе решают, кому достанется вода в засуху. Для шкипера из Вейра важнее всего, признают ли в следующей гавани его страховку на груз.\n\nНа карте Форула есть место и этим странам. Каждая встретит вести из Воркерланда по-своему."
 HITTING_FAN_NAME: "И начинается"
 HITTING_FAN_DESC: "Да, всё верно. Коллекция зонтиков сегодня может пригодиться."
 VAL_BOOKMARK_DESC: "В семье кефрейтского оружейника знают, в какой день на станцию приходит мука. Земля вокруг многих заводов отравлена, и даже там, где ещё растёт хлеб, его мало. В одну сторону по железной дороге уходят ящики с оружием, в другую едут зерно, металл и лекарства. Если заказчик задерживает платёж, это замечают в заводской лавке раньше, чем о нём пишут газеты.\n\nВ 2145 году Генеральский совет попытался взять продовольственные и сырьевые районы Стеландера силой. Из окружения войска выводил Валера Солгалов. Вернувшиеся капитаны запомнили, кто привёл их домой. Генералы сделали популярного командира главой страны в надежде управлять им. К началу 2160 года от совета остались портреты, а на платёжных ведомостях стоит печать Солгалова.\n\nТеперь капитаны и арсеналы связаны единым реестром. Роты ждут жалованья, биржа ждёт подтверждения очередной закупки из Воркерланда, крупнейшего покупателя страны. У стеландерского перевала уже подсчитывают цену охраны, подвоза и права прохода. По обе стороны границы ещё живы люди, для которых разговор об этой дороге в прошлый раз кончился похоронной."
 VAL_bookmark_the_weaponry_baron: "Оружейный барон"
 VAL_bookmark_the_weaponry_baron_desc: "Валера Солгалов держит страну цепью заводов, посредников и капитанов. Его власть измеряется тем, продолжает ли работать конвейер, получают ли роты жалование и способен ли государственный реестр превратить частную силу в единую систему обязательств."
 VAL_bookmark_different_views_on_freedom: "Разные взгляды на свободу"
 VAL_bookmark_different_views_on_freedom_desc: "Для соседей свобода означает право отказаться от чужой власти. Для Кефрейта она слишком часто начинается с права подписать контракт - и заканчивается обязанностью исполнить его, даже если цену заплатит кто-то другой."
 VAL_bookmark_contracts_outlive_kings: "Контракты переживают королей"
 VAL_bookmark_contracts_outlive_kings_desc: "Лидеры стареют, партии распадаются, а границы меняются. Солгалов хочет оставить после себя не личную клиентелу, а систему договоров, которая свяжет государство, арсеналы и армию прочнее любой клятвы."
 NAM_BOOKMARK_DESC: "Сыну ключевского бурильщика Егору Рому было семнадцать, когда он начал переписывать накладные на нефть. Его отец потерял руку на промысле. Бумага о компенсации шла четыре года. Ром хорошо запомнил, сколько канцелярий может пройти одно семейное дело и что решает подпись человека за последним столом.\n\nОн успел послужить писарем при вейранском дворе, пережил Первую революцию и стал наместником Светлогорья. Теперь все бумаги нефтяного бассейна сходятся к нему. Воркерланд считает промыслы своей западной опорой. Эфлор и Ажар помнят, у кого отняли эту землю. Для людей, которые держат насосы в рабочем состоянии, граница начинается у проходной.\n\nПока из столицы приходят распоряжения, лестница наместников стоит. В округах уже спорят, кому доверить промыслы, если связь оборвётся. Люди Ярослава Вебера собирают сторонников в Светлогорском округе. С юга за цистернами следят дома Шахрабада. У каждого есть причина пожелать, чтобы следующую накладную подписал свой человек."
 SHL_BOOKMARK_DESC: "Когда в Шахрабаде переводят печь на новую смену, у топки остаются люди уходящей бригады. Им нужно убедиться, что огонь принят. По Закону непрерывного огня дом сохраняет главную печь и голос в Конклаве, пока она горит. Если кладка остынет, печь перейдёт городу. Так девять наследственных домов зависят от рук мастеров, чьих кварталов даже нет в городском реестре.\n\nДжалиль Нур из малого дома Нур ведёт заседания Конклава. Перед ним лежат прошения домов о подвозе сырья, а за дверью ждут делегаты смен с журналами износа кладки. Они могут остановить работу, оставив цеха целыми. У гербов есть собственная стража. Долгое время Нуру удавалось усадить обе стороны за один стол.\n\nВ Девятипечье мастера и инженеры затеяли строительство десятой печи. В старом законе для неё нет наследника. Дома, города и рабочие кварталы уже называют разных хозяев будущей плавки. За пределами страны за этим спором следят поставщики воды из Кейзана, вейрские перевозчики и нефтяники Светлогорья. Южным пустыням придётся жить с тем, кто получит право распоряжаться шахрабадским огнём."
 RUS_BOOKMARK_DESC: "В Земле Хана каждый аймак знает, кто выставит дозор у переправы и у кого брать коней, если за рекой появятся чужие. Местные споры решают на месте. Марку Рустану доверили говорить от имени вооружённых общин. Гораздо труднее убедить их, что приказ из столицы останется в силе и после того, как всадники разъедутся по домам.\n\nПод столицей растёт бункер. У инженера Глеба Корнеева есть люди, умеющие вернуть ток в мёртвую линию. У начальника караула Тагира Мансурова есть бойцы Чёрной армии, которым предстоит держать дорогу, пока наверху идут работы. Обоим нужны запасы и доверие аймаков. За одной дверью составляют график смен для мастерских, за другой читают имена погибших и называют виновных.\n\nРустан потерял родных при гибели реактора, а затем брата во время революции. Для него дорога к старому промышленному поясу ведёт к событиям, с которых всё началось. Учёные, караул и сам Хан готовы идти туда вместе. Как будет устроена страна, когда откроются ворота бункера, каждый из них представляет по-своему."
 IVN_BOOKMARK_DESC: "В пограничных марках Иторы учитель, врач и связист часто учились за одной партой. Округа сами ведут школьные дела и содержат больницы. Из этих местных обязательств выросло представление о республике, с которым Вадим Куливанов и его партия \"Рёв свободы\" пришли к власти. Семья вправе рассчитывать на помощь и тогда, когда её дом стоит у самой границы.\n\nОборона тоже лежит на марках. Человека, который днём заведует складом, ночью могут вызвать к его резервной части. У дорог на запад местные советы прикидывают, сколько семей поместится в убежищах, а офицеры выясняют, выдержат ли те же дороги переброску войск. От того, как республика распорядится этими дорогами в минуту опасности, зависит, поверят ли соседи её обещанию защиты."
 MON_BOOKMARK_DESC: "Марий II Аркен завершил Войну пяти знамён и назвал Монтеру наследницей северных корон. Побеждённым династиям оставили титулы. При дворе ещё можно увидеть все пятнадцать корон и услышать спор о старшинстве домов. Вопрос о том, кому они приносят присягу, решён.\n\nЮжные арсеналы связаны рельсами. Для офицера Генерального штаба дорога означает срок прибытия полка, для мастера в цехе - ещё один военный заказ, ради которого откладывают гражданскую работу. Имперская лестница народов определяет, чьи сыновья могут рассчитывать на полный набор прав и кому предстоит доказывать верность службой. В Рине по-прежнему есть свой двор и своя армия. В столичных ведомостях значится, что палатинат связан с империей клятвой. Чью команду первым услышит ринский солдат, лучше знают в его казарме."
 WRK_BOOKMARK_DESC: "В Башне Единства принимают донесения от колоний, автономных республик и военных округов. На карте Никиты Уоркера все они по-прежнему составляют одну конфедерацию. В расходных книгах у каждой территории свои запасы. В казармах у каждой свой командир. Приказы из центра приходится согласовывать с людьми, у которых есть чем настоять на своём.\n\nПервая революция покончила с вейранской монархией. Вместе с обещанием свободы новое правительство унаследовало старые гарнизоны и дальние владения. Республика приняла конституцию. Последние выборы датированы 2135 годом. За прошедшие годы целое поколение привыкло, что окончательный ответ на спор между столицей и округом даёт один человек.\n\nВ первое утро 2160 года в Башне ещё дежурят связисты. Пока они соединяют учреждения, договорённости Уоркера действуют от западных промыслов до военных складов. Готового ответа на вопрос, кому подчиняться, если однажды Башня промолчит, в округах нет."
 COUNTRY_SELECTION_CHARACTER_DESC_NAME: "$NAME|Y$"
 NAM_bookmark_hold_the_basin: "Удержать бассейн"
 NAM_bookmark_hold_the_basin_desc: "Эфлор и Ажар называют войну возвращением земли. Светлогорье должно удержать Северные месторождения, иначе оно исчезнет с карты."
 NAM_bookmark_ladder_or_charter: "Лестница или хартия"
 NAM_bookmark_ladder_or_charter_desc: "Наместническая лестница или хартия районов - выбор определит и устройство страны, и её способ собирать Юг."
 NAM_bookmark_seal_over_furnaces: "Подчинить Шахрабад"
 NAM_bookmark_seal_over_furnaces_desc: "Нефтяной пояс и печи Шахрабада не могут сосуществовать. В войне за Юг победителем станет только один из них."
 SHL_bookmark_continuous_fire: "Непрерывный огонь"
 SHL_bookmark_continuous_fire_desc: "У дверей Конклава девять домов предъявляют печати. Право поставить такую печать дают люди, которые минувшей ночью удержали огонь в печи."
 SHL_bookmark_five_courses: "Пять курсов Конклава"
 SHL_bookmark_five_courses_desc: "Под сводами Конклава спорят дома, города и делегаты смен. Каждый видит своё будущее для Шахрабада и пустынь вокруг него."
 SHL_bookmark_war_for_the_south: "Война за Юг"
 SHL_bookmark_war_for_the_south_desc: "Кейзан, Вейр и Мазар - только начало. Последняя война решит, будут ли пустыни принадлежать печам или нефтяному поясу."
 RUS_bookmark_underground_capital: "Подземная столица"
 RUS_bookmark_underground_capital_desc: "Бункер под столицей растёт слой за слоем. Он может стать убежищем народа или закрытым троном его правителей."
 RUS_bookmark_last_empire: "Последняя империя"
 RUS_bookmark_last_empire_desc: "На имперской печати уже вырезано имя Рустана. Внизу, за броневой дверью, Корнеев собирает учёных, а у входов в бункер караулы принимают приказы Мансурова. Кто первым займёт зал связи, тот и прочтёт провозглашение."
 RUS_bookmark_heart_of_the_continent: "Сердце континента"
 RUS_bookmark_heart_of_the_continent_desc: "Центр континента достанется державе Хана - или не достанется никому. Чтобы удержать его, придётся сломить гегемона."
 RUS_bookmark_operation_last_sunset: "Операция \"Последний закат\""
 RUS_bookmark_operation_last_sunset_desc: "Хан нацеливает орбитальное оружие на реактор в сердце континента. Соседние державы готовят вторжение, пока Чёрная армия удерживает периметр, а учёные завершают расчёты. Если приказ об ударе будет исполнен, война закончится вместе с миром, за который её вели."
