l_russian:
 BM_HISTORY_TITLE: "Краткая история"
 GATHERING_STORM_NAME: "Раненый лев"
 GATHERING_STORM_DESC: "В 2130 году в журнале одного из убежищ реакторного пояса записали, сколько людей спустилось с поверхности, сколько осталось воды и когда придётся менять фильтры. Выше на той же странице ещё стояло время выхода бригады на смену. Затем связь с поверхностью оборвалась. После гибели реактора в городах Вейранской империи, где давно ждали перемен, началось открытое восстание.\n\nПервая революция свергла монархию. Никита Уоркер дал стране имя Воркерланд. Из дворцовых канцелярий вынесли портреты императорской семьи, а писари, знавшие, как провести состав через три округа, наутро вернулись к столам. Вместе с архивами республика унаследовала гарнизоны, дальние нефтяные промыслы и долги перед соседями.\n\nК 2160 году Башня Единства всё ещё передаёт приказы Уоркера. На станции вагон зерна могут одновременно затребовать столичное министерство и окружной штаб. У каждого есть печать и вооружённая охрана. Начальник станции должен решить, чьим людям достанется хлеб и чьей подписью он потом оправдается.\n\nЗа границами конфедерации тоже прислушиваются к этим спорам. В Стеландере Воркерланд поручился за мир, в Кефрейте его заказы кормят заводские посёлки, в Светлогорье его именем отпускают нефть. Утром 1 января 2160 года все эти договоры ещё в силе. По всему Форулу люди перечитывают свои экземпляры."
 ADISCORD_BOOKMARK_MENU_ENTRY: "$GATHERING_STORM_NAME$"
