l_russian:
 BM_HISTORY_TITLE: "Краткая история"
 GATHERING_STORM_NAME: "Раненый лев"
 GATHERING_STORM_DESC: "Империя Воркерланда долгие годы считалась главной силой континента, но её время прошло. Воркерланд горит в огне внутренних конфликтов, распавшихся институтов и старых долгов, которые больше некому скрывать.\n\nНа руинах прежнего порядка поднимаются новые государства. У каждого свои страхи, ресурсы и политические амбиции. Континент вступает в эпоху, где старые границы уже не гарантируют будущего, а власть достанется тем, кто сумеет собрать хаос в систему."
 OTHER_GATHERING_STORM_DESC: "На континенте появляются новые центры силы. Одни пытаются выжить среди обломков империи, другие уже готовят собственный рывок."
 BLITZKRIEG_NAME: "После удара"
 BLITZKRIEG_DESC: "К 2183 году первые потрясения перестали быть новостью и стали порядком дня. Государства, пережившие распад старой системы, укрепили границы, пересчитали союзников и привыкли жить с мыслью, что следующая война может начаться без предупреждения."
 HITTING_FAN_NAME: "И начинается"
 HITTING_FAN_DESC: "Да, всё верно. Коллекция зонтиков сегодня может пригодиться."
 STP_BOOKMARK_DESC: "Хотя Стеландер не был покорён в ходе 'великой' экспансии Воркерланда, сожжённые деревни всё ещё помнят бомбардировки и кровь, пролитую на некогда мирную землю.\n\nСтраной правит гедонистическая партия «Палата Высших Домов». На словах она выступает за минимальное вмешательство государства в экономику и личную жизнь граждан. На практике её главные желания - обогащение и власть, и пока ей это удаётся.\n\nЛидер партии, когда-то обещавший больше не допустить пролития крови на землю Стеландера, уже четвёртый срок подряд удерживает власть. В партии понимают, что дни старика, на котором держится система, сочтены. Это понимает и сопротивление во главе с Максимом Шабратом."
 VAL_BOOKMARK_DESC: "Кефрейт вырос вокруг оружейных заводов, расчётных палат и наёмных рот. Валера Солгалов удерживает капитанов не наследственной верностью, а единым реестром контрактов, ставками и доступом к производству: здесь государство обещает не любовь, а исполнение обязательств.\n\nЗа эффективностью арсеналов скрывается страна, которая производит винтовки лучше, чем хлеб. Отравленная войной земля, пустеющие деревни и нехватка сырья делают внешний рынок вопросом выживания. Армейские склады кормят поселения, а оружейный экспорт оплачивает продовольствие, лекарства и металл.\n\nПоражение Генеральского совета в пограничной войне 2145 года научило Кефрейт считать цену победы. Теперь Солгалов предпочитает сначала обеспечить контракт, клиента и снабжение, а уже затем применять силу. Распад Воркерланда лишает страну крупнейшего покупателя, зато кризис Стеландера открывает новый рынок влияния: торговые договоры, ресурсные концессии и вооружённое давление могут превратить соседний хаос в кефрейтскую систему обязательств."
 VAL_bookmark_the_weaponry_baron: "Оружейный барон"
 VAL_bookmark_the_weaponry_baron_desc: "Валера Солгалов держит страну цепью заводов, посредников и капитанов. Его власть измеряется тем, продолжает ли работать конвейер, получают ли роты жалование и способен ли государственный реестр превратить частную силу в единую систему обязательств."
 VAL_bookmark_different_views_on_freedom: "Разные взгляды на свободу"
 VAL_bookmark_different_views_on_freedom_desc: "Для соседей свобода означает право отказаться от чужой власти. Для Кефрейта она слишком часто начинается с права подписать контракт - и заканчивается обязанностью исполнить его, даже если цену заплатит кто-то другой."
 VAL_bookmark_contracts_outlive_kings: "Контракты переживают королей"
 VAL_bookmark_contracts_outlive_kings_desc: "Лидеры стареют, партии распадаются, а границы меняются. Солгалов хочет оставить после себя не личную клиентелу, а систему договоров, которая свяжет государство, арсеналы и армию прочнее любой клятвы."
 ADISCORD_BOOKMARK_WIP: "§YWIP§!"
 NAM_BOOKMARK_DESC: "Светлогорье - автономия Воркерланда, построенная как лестница наместников: у каждой ступени есть печать, отчёт и право остановить решение нижестоящего. Егор Ром держит эту лестницу ради нефтяного бассейна, который империя когда-то отняла у соседей.\n\nКогда Воркерланд рухнет, Эфлор и Ажар объявят войну за возвращение земли, а в Светлогорском округе может подняться подполье Ярослава Ветра. Устоявшее Светлогорье выбирает между наместнической лестницей и нефтяной хартией районов.\n\nЛюбой путь ведёт на юг. Наместники требуют покорности от Ажара, Кадира и Эфлора, хартия покупает союзников топливом. Рано или поздно нефтяной пояс столкнётся с печами Шахрабада, и Юг достанется только одному из них."
 SHL_BOOKMARK_DESC: "Шахрабадом правит Конклав девяти печей. Закон непрерывного огня связывает наследственный голос каждого дома с работой его главной печи, а Джалиль Нур удерживает соперников от того, чтобы их спор остановил производство.\n\nУсиленные смены вызывают холодные стачки рабочих кварталов, реформы - ультиматум гербов. Кейзан перекрывает кяризы, Вейр облагает металл пошлинами, Мазар считает шахрабадский металл частью своего пайка. Десятая печь заставит Конклав выбрать курс: новый дом, открытые города или дирекция Нура, а кризисы могут привести к регентству Дария Сафира или коммуне огня.\n\nКаждый курс по-своему собирает пустыни - долгами, хартиями, железным маршем, гербами или советами. Последняя война за Юг решит, будут ли пустыни принадлежать печам или нефтяному поясу Светлогорья."
 RUS_BOOKMARK_DESC: "Земля Хана держится на вооружённых аймаках, которые терпят общего представителя легче, чем постоянную столицу. Марк Рустан собирает их Чёрную Армию, пока под столицей растёт бункер - убежище, командный пункт и обещание пережить следующую катастрофу.\n\nПодземный комплекс требует пищи, казны и тяжёлых решений, а на поверхности баланс аймаков и ставки определяет, кому подчиняется армия. Хан, генерал Оскол или восстановитель Нива провозгласят общую державу - Последнюю империю, Империю Чёрного Знамени или Державу Восстановления.\n\nСердце континента не поделят между собой. Либо держава Хана объединит центр и сломит гегемона, либо центр так и останется землёй без единой власти."
 COUNTRY_SELECTION_CHARACTER_DESC_NAME: "$NAME|Y$"
 NAM_bookmark_hold_the_basin: "Удержать бассейн"
 NAM_bookmark_hold_the_basin_desc: "Эфлор и Ажар называют войну возвращением земли. Светлогорье должно удержать Северные месторождения, иначе оно исчезнет с карты."
 NAM_bookmark_ladder_or_charter: "Лестница или хартия"
 NAM_bookmark_ladder_or_charter_desc: "Наместническая лестница даёт силу и скорость, хартия районов - согласие и союзников. Выбор определит и устройство страны, и её способ собирать Юг."
 NAM_bookmark_seal_over_furnaces: "Печать над печами"
 NAM_bookmark_seal_over_furnaces_desc: "Нефтяной пояс и печи Шахрабада не могут сосуществовать. В войне за Юг победителем станет только один из них."
 SHL_bookmark_continuous_fire: "Непрерывный огонь"
 SHL_bookmark_continuous_fire_desc: "Девять печей должны работать: от сырья, ремонта и смен зависят и казна, и голоса домов в Конклаве."
 SHL_bookmark_five_courses: "Пять курсов Конклава"
 SHL_bookmark_five_courses_desc: "Десятый дом, открытые города, дирекция Нура, регентство гербов или коммуна огня. Каждый курс по-своему управляет печами и по-своему собирает пустыни."
 SHL_bookmark_war_for_the_south: "Война за Юг"
 SHL_bookmark_war_for_the_south_desc: "Кейзан, Вейр и Мазар - только начало. Последняя война решит, будут ли пустыни принадлежать печам или нефтяному поясу."
 RUS_bookmark_underground_capital: "Подземная столица"
 RUS_bookmark_underground_capital_desc: "Бункер под столицей растёт слой за слоем. Он может стать убежищем народа или закрытым троном его правителей."
 RUS_bookmark_last_empire: "Последняя империя"
 RUS_bookmark_last_empire_desc: "Хан провозгласит общую державу. Перевес Чёрной армии или учёных определит её имя и порядок, но не цена объединения."
 RUS_bookmark_heart_of_the_continent: "Сердце континента"
 RUS_bookmark_heart_of_the_continent_desc: "Центр континента достанется державе Хана - или не достанется никому. Чтобы удержать его, придётся сломить гегемона."
