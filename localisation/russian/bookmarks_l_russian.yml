l_russian:
 BM_HISTORY_TITLE: "Краткая история"
 GATHERING_STORM_NAME: "Раненый лев"
 GATHERING_STORM_DESC: "Империя Воркерланда долгие годы считалась главной силой континента, но её время прошло. Воркерланд горит в огне внутренних конфликтов, распавшихся институтов и старых долгов, которые больше некому скрывать.\n\nНа руинах прежнего порядка поднимаются новые государства. У каждого свои страхи, ресурсы и политические амбиции. Континент вступает в эпоху, где старые границы уже не гарантируют будущего, а власть достанется тем, кто сумеет собрать хаос в систему."
 OTHER_GATHERING_STORM_DESC: "На континенте появляются новые центры силы. Одни пытаются выжить среди обломков империи, другие уже готовят собственный рывок."
 BLITZKRIEG_NAME: "После удара"
 BLITZKRIEG_DESC: "К 2183 году первые потрясения перестали быть новостью и стали порядком дня. Государства, пережившие распад старой системы, укрепили границы, пересчитали союзников и привыкли жить с мыслью, что следующая война может начаться без предупреждения."
 HITTING_FAN_NAME: "И начинается"
 HITTING_FAN_DESC: "Да, всё верно. Коллекция зонтиков сегодня может пригодиться."
 STP_BOOKMARK_DESC: "Хотя Стеландер не был покорён в ходе 'великой' экспансии Воркерланда, сожжённые деревни всё ещё помнят бомбардировки и кровь, пролитую на некогда мирную землю.\n\nСтраной правит гедонистическая партия «Палата Высших Домов». На словах она выступает за минимальное вмешательство государства в экономику и личную жизнь граждан. На практике её главные желания - обогащение и власть, и пока ей это удаётся.\n\nЛидер партии, когда-то обещавший больше не допустить пролития крови на землю Стеландера, уже четвёртый срок подряд удерживает власть. В партии понимают, что дни старика, на котором держится система, сочтены. Это понимает и сопротивление во главе с Максимом Шабратом."
 VAL_BOOKMARK_DESC: "Кефрейт вырос вокруг оружейных заводов, расчётных палат и наёмных рот. Валера Солгалов удерживает капитанов не наследственной верностью, а единым реестром контрактов, ставками и доступом к производству: здесь государство обещает не любовь, а исполнение обязательств.\n\nЗа эффективностью арсеналов скрывается страна, которая производит винтовки лучше, чем хлеб. Отравленная войной земля, пустеющие деревни и нехватка сырья делают внешний рынок вопросом выживания. Армейские склады кормят поселения, а оружейный экспорт оплачивает продовольствие, лекарства и металл.\n\nПоражение Генеральского совета в пограничной войне 2145 года научило Кефрейт считать цену победы. Теперь Солгалов предпочитает сначала обеспечить контракт, клиента и снабжение, а уже затем применять силу. Распад Воркерланда лишает страну крупнейшего покупателя, зато кризис Стеландера открывает новый рынок влияния: торговые договоры, ресурсные концессии и вооружённое давление могут превратить соседний хаос в кефрейтскую систему обязательств."
 VAL_bookmark_contract_state: "Контрактное государство"
 VAL_bookmark_contract_state_desc: "Солгалов пытается сделать систему сильнее её создателя: капитаны, фабрики и посредники должны войти в единый государственный реестр. Контрактная власть, бюджет и способность выполнять обязательства определяют, насколько далеко Кефрейт сможет проецировать силу."
 VAL_bookmark_trading_partners: "Торговые партнёры"
 VAL_bookmark_trading_partners_desc: "После потери привычных покупателей север должен стать новым рынком. Торговые представительства, поставки и оплаченные операции расширяют влияние без немедленной войны, но каждый маршрут зависит от доступной территории, инфраструктуры и платёжеспособного клиента."
 VAL_bookmark_october_2160: "Октябрь 2160-го"
 VAL_bookmark_october_2160_desc: "Другой путь предлагает не ждать, пока сосед подпишет удобный договор. Старые кефрейтские претензии к Стеланду становятся оправданием для давления, военного присутствия и взыскания обязательств силой — при условии, что государство способно оплатить собственную кампанию."
 COUNTRY_SELECTION_CHARACTER_DESC_NAME: "$NAME|Y$"
