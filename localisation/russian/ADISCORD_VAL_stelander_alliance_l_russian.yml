l_russian:
 VAL_Equal_Powers_Pact:0 "Пакт равных держав"
 VAL_Equal_Powers_Pact_desc:0 "Признание сняло непосредственный спор об Окцидии. Теперь можно предложить более редкий исход: договор, в котором Стеландер выступает суверенным партнёром, а не будущим клиентом."
 VAL_Joint_General_Staff:0 "Переговоры генеральных штабов"
 VAL_Joint_General_Staff_desc:0 "Офицеры двух государств согласуют мобилизационные планы, логистику и разведку, не объединяя командование."
 VAL_Cross_Border_Contracts:0 "Трансграничные контракты"
 VAL_Cross_Border_Contracts_desc:0 "Взаимные закупки, гарантии транзита и расчётные соглашения превратят политический компромисс в устойчивую экономическую связь."
 VAL_Two_States_One_Frontier:0 "Два государства, одна граница"
 VAL_Two_States_One_Frontier_desc:0 "Союз станет постоянным элементом регионального порядка. Ни одна сторона не подчинена другой."
 VAL_equal_powers_offer_tt:0 "Отправить Стеландеру официальное предложение союза равных суверенных государств."
 VAL_joint_staff_tt:0 "Углубляет военную координацию со Стеландером при сохранении раздельного командования."
 VAL_cross_border_contracts_tt:0 "Расширяет торговые и закупочные связи, созданные договором о равенстве."
 VAL_two_states_frontier_tt:0 "Закрепляет равноправный союз и координацию будущих северных войн."
 VAL_equal_alliance_accept_tt:0 "Кефрейт и Стеландер вступают в общий союз как равные суверенные партнёры."
 VAL_stelander_equal_alliance_name:0 "Кефрейтско-стеландский пакт"

 val_contract.354.t:0 "Союз равных"
 val_contract.354.d:0 "Кефрейт вернул наши национальные территории и официально признал суверенитет Стеландера. Теперь его правительство предлагает постоянный союз на основе взаимной обороны, общей логистики и политического равенства. Принятие свяжет два государства без протектората и иерархии."
 val_contract.354.accept:0 "Подписать пакт."
 val_contract.354.refuse:0 "Достаточно признания."
