l_russian:
 VAL_Equal_Powers_Pact:0 "Пакт равных держав"
 VAL_Equal_Powers_Pact_desc:0 "Признание сняло непосредственный спор об Окцидии. Теперь можно предложить более редкий исход: договор, в котором Стеландер выступает суверенным партнёром, а не будущим клиентом."
 VAL_Joint_General_Staff:0 "Переговоры генеральных штабов"
 VAL_Joint_General_Staff_desc:0 "Офицеры двух государств согласуют мобилизационные планы, логистику и разведку, не объединяя командование."
 VAL_Cross_Border_Contracts:0 "Трансграничные контракты"
 VAL_Cross_Border_Contracts_desc:0 "Взаимные закупки, гарантии транзита и расчётные соглашения превратят политический компромисс в устойчивую экономическую связь."
 VAL_Two_States_One_Frontier:0 "Два государства, одна граница"
 VAL_Two_States_One_Frontier_desc:0 "У пограничного диспетчера два телефона. Когда на перегоне ломается паровоз, он обзванивает обе станции и записывает в журнал, откуда ждать подмогу. В столицах ещё правят статьи договора, а на железной дороге уже знают, чей голос услышат на другом конце провода."
 VAL_equal_powers_offer_tt:0 "Предложить равноправный союз. Отказ сохраняет военный путь."
 VAL_joint_staff_tt:0 "Союзный Стеландер присоединяется к текущей и будущим войнам Кефрейта против Нодрула."
 VAL_cross_border_contracts_tt:0 "Расширяет торговые и закупочные связи, созданные договором о равенстве."
 VAL_two_states_frontier_tt:0 "Закрепляет союз и координацию северных кампаний. Обе страны увидят финал \"В двух экземплярах\", если он ещё не состоялся после совместной победы над Нодрулом."
 VAL_current_stelander_ally_tt:0 "Кефрейт и подписавшее пакт правительство Стеландера остаются независимыми союзниками. Ни одна сторона не капитулировала."
 VAL_equal_alliance_accept_tt:0 "Кефрейт и Стеландер вступают в общий союз как равные суверенные партнёры."
 VAL_stelander_equal_alliance_name:0 "Кефрейтско-стеландский пакт"

 val_contract.354.t:0 "Союз равных"
 val_contract.354.d:0 "Кефрейт вернул наши национальные территории и официально признал суверенитет Стеландера. Теперь его правительство предлагает постоянный союз на основе взаимной обороны, общей логистики и политического равенства. Принятие свяжет два государства без протектората и иерархии."
 val_contract.354.accept:0 "Подписать пакт."
 val_contract.354.refuse:0 "Достаточно признания."

 val_rework.224.t:0 "Предложение из Кефрейта"
 val_rework.224.d:0 "Посланник разложил перед Шабратом карту и два экземпляра неподписанного соглашения. Кефрейт готов выдвинуть войска против Нодрула. Его посланник просит согласовать переход границы и обменяться офицерами связи.\n\nЮжные округа обведены карандашом. \"Здесь после войны останутся ваши коменданты\", - говорит посланник. Северные дороги Кефрейт оставляет своим администрациям. Шабрат поднимает глаза от карты. У посланника есть приказ выступать и без его подписи."
 val_rework.224.accept:0 "Подписать соглашение и передать частоты связи."
 val_rework.224.refuse:0 "Верните карту. Наш штаб будет действовать сам."
 val_rework.224.closed:0 "Снять вопрос с повестки."
 val_rework.225.t:0 "После капитуляции Фронтира"
 val_rework.225.d:0 "С фронтирского командного пункта пришла последняя радиограмма. Начальник штаба подтвердил приказ о сдаче и попросил сообщить семьям, куда увели раненых. На карте похода всё ещё отмечены склады, через которые собирались снабжать наступление. Дежурный по одному вычёркивает их позывные.\n\nВ Кефрейте ждут приказа. Дипломаты готовы передать Нодрулу условия прекращения огня. Военные разложили на соседнем столе карту обходных дорог."
 val_rework.225.withdraw:0 "Отвести войска и заключить перемирие."
 val_rework.225.continue:0 "Ищите другие дороги. Поход продолжается."
 val_rework.226.t:0 "Шабрат и Кефрейт подписали военный пакт"
 val_rework.226.d:0 "Шабрат принял предложение Кефрейта о совместном походе. Офицеры связи доставили в оба штаба одинаковые карты, а пограничным постам передали позывные союзных колонн. Кефрейт вступает в войну Шабрата против Нодрула.\n\nПосланники подтвердили и условия мира, которого ещё предстоит добиться. На юге Нодрула власть должна перейти к Стеланду, на севере Кефрейт намерен разместить свои договорные администрации."
 val_rework.226.a:0 "В штабах сверяют часы."
 val_rework.227.t:0 "Шабрат отклонил предложение Кефрейта"
 val_rework.227.d:0 "Кефрейтская делегация вернулась с неподписанным договором. Шабрат отказался согласовывать с соседями командование и послевоенные границы. Его части продолжают воевать с Нодрулом под прежними приказами.\n\nВ Кефрейте уже вскрыли пакеты с приказом о самостоятельном выступлении. Теперь в Нодрул идут две армии, между штабами которых нет соглашения о разделе страны."
 val_rework.227.a:0 "Каждый штаб отвечает за свой поход."
 val_rework.228.t:0 "Союзники разделили земли Нодрула"
 val_rework.228.d:0 "После капитуляции Нодрула в Ашии, Остриуме, Касилии и Куссингтоне приступили к работе представители Шабрата. На север отправились чиновники договорных администраций Кефрейта. В прежней ставке нодрульского командования обе делегации поставили подписи под картой границы.\n\nПервыми новую черту нанесли на свои схемы железнодорожники. На станциях уже спрашивают, кто заверит накладные и у кого брать пропуск на обратный рейс."
 val_rework.228.a:0 "У железной дороги теперь два ведомства."
 val_rework.229.t:0 "Кефрейт выходит из войны с Нодрулом"
 val_rework.229.d:0 "После падения Фронтира Кефрейт согласился прекратить северный поход. Кефрейтский экспедиционный штаб отдал колоннам приказ об отходе. На переправах разводят встречные колонны, железнодорожники освобождают пути под санитарные составы.\n\nПод приказом стоит подпись кефрейтского командующего. Ни штаб Фронтира, ни штаб Шабрата приказа о перемирии своим частям не отдавали."
 val_rework.229.a:0 "На кефрейтском участке смолкают орудия."
 val_rework.230.t:0 "Кефрейт продолжит поход после падения Фронтира"
 val_rework.230.d:0 "В Кефрейте подтвердили капитуляцию фронтирского командования и отдали приказ продолжать войну с Нодрулом. Дорожные службы получили новые маршруты подвоза. На станциях снимают указатели на потерянные склады, а порожние эшелоны разворачивают к другим узлам.\n\nПервый обоз уже вышел по объездной дороге. Семьям солдат сообщили, что возвращение частей откладывается."
 val_rework.230.a:0 "Обозы пошли в обход."
 val_rework.231.t:0 "Кефрейт и Шабрат идут на Нодрул порознь"
 val_rework.231.d:0 "Кефрейт подтвердил приказ о выступлении против Нодрула. На вопрос о переговорах с Шабратом военный секретарь положил перед корреспондентами утреннюю сводку с Фронтира. На последней странице ещё значились потери в боях со стеландскими частями.\n\nОфицеров связи в штаб Шабрата не отправят. На фронтирских позициях ждут распоряжений от своего командования."
 val_rework.231.a:0 "На Фронтире стрельба продолжается."

 val_rework.232.t:0 "В двух экземплярах"
 val_rework.232.kefreyt:0 "На столе начальника пограничной станции едва поместились два экземпляра союзного договора. Пока делегаты подписывали листы, дежурная по станции придерживала локтем график движения. Поезд с рельсами стоял под парами уже сорок минут. Ей обещали освободить стол к полудню.\n\nКефрейтский уполномоченный первым заметил на графике карандашную поправку. За границей размыло насыпь. Соседи просили пропустить вперёд ремонтную бригаду, а рельсы обещали принять вечером. Обычно на такую перемену пришлось бы запрашивать столицу. Он сверился с только что подписанной статьёй, снял трубку и назвал стеландерскому диспетчеру свободный перегон.\n\nКогда бумаги увезли, дежурная стёрла с графика одну черту и провела другую. Вечером пришла квитанция о приёмке рельсов. Уполномоченный подшил её первой в новую папку союзной переписки."
 val_rework.232.stelander:0 "Папку с союзным договором стеландерская делегация привезла на пограничную станцию в старом кожаном портфеле. В боковом кармане лежала записка от путевого мастера. За ночь вода подмыла насыпь. Если к обеду не пропустят бригаду, вечером негде будет принять кефрейтские рельсы.\n\nПосле подписания делегат передал один экземпляр договора соседям, другой уложил в портфель и попросил соединить его с мастером. Тот уже слышал от своей дежурной, что кефрейтцы освободили перегон. Теперь он хотел знать, кто распишется за людей и инструмент. Делегат продиктовал свою фамилию. Со своей стороны границы за работы отвечал он.\n\nК вечеру насыпь укрепили. Мастер пересчитал прибывшие рельсы и отправил соседям квитанцию. Утром в столицу доставили договор с обеими печатями. На его обложке остался мокрый след от большого пальца."
 val_rework.232.a:0 "Вечерний состав принят."
 val_rework.233.t:0 "Кефрейт и Стеландер закрепили постоянный союз"
 val_rework.233.d:0 "На пограничной станции представители Кефрейта и Стеландера подписали постоянный союзный договор. За каждой стороной сохраняются собственное командование и право распоряжаться своими дорогами. Для пограничных служб учреждена прямая связь: теперь они могут согласовать проход составов и выезд ремонтных бригад на месте.\n\nПервым документом, которым обменялись по новому порядку, стала квитанция за партию рельсов. Делегации увезли в свои столицы по экземпляру договора."
 val_rework.233.a:0 "Под договором стоят две печати."
 VAL_shabrat_accept_campaign_tt:0 "Стеланд и Кефрейт вступят в общий альянс. Кефрейт присоединится к нашей войне с Нодрулом. При совместной победе нам отойдут Ашия, Остриум, Касилия и Куссингтон."
 VAL_shabrat_refuse_campaign_tt:0 "Кефрейт начнёт отдельный поход. Договора о совместном разделе не будет."
 VAL_frontier_exit_tt:0 "Кефрейт отзовёт экспедицию и заключит с Нодрулом перемирие на 180 дней. Войны Фронтира и Шабрата продолжатся, в том числе между ними, если они уже противники."
