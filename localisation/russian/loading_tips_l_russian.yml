 LOADING_TIP_102: "«Кто побеждает силой, тот побеждает врага лишь наполовину».\n— Джон Мильтон, «Потерянный рай»"
 LOADING_TIP_103: "«История — это немногим больше, чем перечень преступлений, безумств и несчастий человечества».\n— Эдвард Гиббон, «История упадка и разрушения Римской империи»"
 LOADING_TIP_104: "«Великие вопросы времени решаются не речами и постановлениями большинства, а железом и кровью».\n— Отто фон Бисмарк, речь в бюджетной комиссии, 1862 год"
 LOADING_TIP_105: "«Им нужны великие потрясения, нам нужна великая Россия».\n— Пётр Столыпин, речь во II Государственной думе, 1907 год"
 LOADING_TIP_106: "«Единственное, чего нам следует бояться, — это самого страха».\n— Франклин Делано Рузвельт, первая инаугурационная речь, 1933 год"
 LOADING_TIP_107: "«Каждое произведённое оружие, каждый спущенный на воду военный корабль, каждая выпущенная ракета в конечном счёте означают кражу у тех, кто голоден и не накормлен».\n— Дуайт Эйзенхауэр, речь «Шанс для мира», 1953 год"
 LOADING_TIP_108: "«Те, кто делает мирную революцию невозможной, сделают насильственную революцию неизбежной».\n— Джон Кеннеди, речь в Белом доме, 1962 год"
 LOADING_TIP_109: "«Сегодня это случилось с нами. Завтра это случится с вами».\n— Хайле Селассие I, речь в Лиге Наций, 1936 год"
 LOADING_TIP_110: "«Война есть не что иное, как продолжение государственной политики иными средствами».\n— Карл фон Клаузевиц, «О войне»"
 LOADING_TIP_111: "«Всё на войне очень просто, но самое простое оказывается трудным».\n— Карл фон Клаузевиц, «О войне»"
 LOADING_TIP_112: "«Война — область неопределённости: три четверти того, на чём строится действие, скрыты туманом».\n— Карл фон Клаузевиц, «О войне»"
 LOADING_TIP_113: "«Всякая война основана на обмане».\n— Сунь-цзы, «Искусство войны»"
 LOADING_TIP_114: "«Высшее искусство войны — сломить сопротивление врага без боя».\n— Сунь-цзы, «Искусство войны»"
 LOADING_TIP_115: "«Если знаешь противника и знаешь себя, можешь не бояться исхода сотни сражений».\n— Сунь-цзы, «Искусство войны»"
 LOADING_TIP_116: "«Нет примера, чтобы государство выиграло от затяжной войны».\n— Сунь-цзы, «Искусство войны»"
 LOADING_TIP_117: "«Нападай там, где противник не готов; появляйся там, где тебя не ожидают».\n— Сунь-цзы, «Искусство войны»"
 LOADING_TIP_118: "«Гораздо безопаснее внушать страх, чем быть любимым, если приходится выбирать одно из двух».\n— Никколо Макиавелли, «Государь»"
 LOADING_TIP_119: "«Все вооружённые пророки побеждали, а все безоружные погибали».\n— Никколо Макиавелли, «Государь»"
 LOADING_TIP_120: "«Кто оставляет то, что делается, ради того, что должно делаться, скорее готовит себе гибель, чем спасение».\n— Никколо Макиавелли, «Государь»"
 LOADING_TIP_121: "«Государь должен уподобиться лисе, чтобы обходить капканы, и льву, чтобы отпугивать волков».\n— Никколо Макиавелли, «Государь»"
 LOADING_TIP_122: "«Обиду нужно наносить так, чтобы не бояться мести».\n— Никколо Макиавелли, «Государь»"
 LOADING_TIP_123: "«Пока люди живут без общей власти, держащей всех в страхе, они находятся в состоянии войны всех против всех».\n— Томас Гоббс, «Левиафан»"
 LOADING_TIP_124: "«Соглашения без меча — лишь слова, неспособные гарантировать человеку безопасность».\n— Томас Гоббс, «Левиафан»"
 LOADING_TIP_125: "«При постоянном страхе и опасности насильственной смерти жизнь человека одинока, бедна, беспросветна, тупа и кратковременна».\n— Томас Гоббс, «Левиафан»"
 LOADING_TIP_126: "«Там, где кончается закон, начинается тирания».\n— Джон Локк, «Два трактата о правлении»"
 LOADING_TIP_127: "«Цель закона — не уничтожать и не ограничивать свободу, а сохранять и расширять её».\n— Джон Локк, «Два трактата о правлении»"
 LOADING_TIP_128: "«Человек рождается свободным, но повсюду он в цепях».\n— Жан-Жак Руссо, «Об общественном договоре»"
 LOADING_TIP_129: "«Всякий человек, обладающий властью, склонен злоупотреблять ею, пока не встретит предел».\n— Шарль де Монтескьё, «О духе законов»"
 LOADING_TIP_130: "«Решитесь не служить больше — и вы свободны».\n— Этьен де Ла Боэси, «Рассуждение о добровольном рабстве»"
 LOADING_TIP_131: "«Те, кто способен заставить вас поверить в нелепости, способны заставить вас совершать злодеяния».\n— Вольтер, «Вопросы о чудесах»"
 LOADING_TIP_132: "«Мир — это не отсутствие войны, а добродетель, рождающаяся из силы духа».\n— Бенедикт Спиноза, «Политический трактат»"
 LOADING_TIP_133: "«Из столь кривой древесины, как та, из которой сделан человек, нельзя вытесать ничего совершенно прямого».\n— Иммануил Кант, «Идея всеобщей истории во всемирно-гражданском плане»"
 LOADING_TIP_134: "«Кто сражается с чудовищами, тому следует остерегаться, чтобы самому не стать чудовищем».\n— Фридрих Ницше, «По ту сторону добра и зла»"
 LOADING_TIP_135: "«Государство — самое холодное из всех холодных чудовищ».\n— Фридрих Ницше, «Так говорил Заратустра»"
 LOADING_TIP_136: "«Власть развращает, абсолютная власть развращает абсолютно».\n— Джон Дальберг-Актон, письмо Манделлу Крейтону, 1887 год"
 LOADING_TIP_137: "«Самый опасный момент для дурного правительства обычно наступает тогда, когда оно начинает исправляться».\n— Алексис де Токвиль, «Старый порядок и революция»"
 LOADING_TIP_138: "«Кто не помнит прошлого, обречён пережить его вновь».\n— Джордж Сантаяна, «Жизнь разума»"
 LOADING_TIP_139: "«Опыт и история учат, что народы и правительства никогда ничему не учились из истории».\n— Георг Вильгельм Фридрих Гегель, «Лекции по философии истории»"
 LOADING_TIP_140: "«Все великие всемирно-исторические события и личности появляются дважды: первый раз как трагедия, второй — как фарс».\n— Карл Маркс, «Восемнадцатое брюмера Луи Бонапарта»"
 LOADING_TIP_141: "«Насилие является повивальной бабкой всякого старого общества, беременного новым».\n— Карл Маркс, «Капитал»"
 LOADING_TIP_142: "«Свобода без социализма — привилегия и несправедливость; социализм без свободы — рабство и скотство».\n— Михаил Бакунин, «Федерализм, социализм и антитеологизм»"
 LOADING_TIP_143: "«Свобода только для сторонников правительства — не свобода. Свобода всегда есть свобода для инакомыслящего».\n— Роза Люксембург, «Русская революция»"
 LOADING_TIP_144: "«Те, кто отказывается от существенной свободы ради малой временной безопасности, не заслуживают ни свободы, ни безопасности».\n— Бенджамин Франклин, ответ губернатору Пенсильвании, 1755 год"
 LOADING_TIP_145: "«Готовность к войне — одно из самых действенных средств сохранения мира».\n— Джордж Вашингтон, первое ежегодное послание Конгрессу, 1790 год"
 LOADING_TIP_146: "«Ни одна нация не может сохранить свободу в условиях непрерывной войны».\n— Джеймс Мэдисон, «Политические наблюдения», 1795 год"
 LOADING_TIP_147: "«Настали времена, испытывающие человеческие души».\n— Томас Пейн, «Американский кризис»"
 LOADING_TIP_148: "«Тиранию, подобно аду, нелегко победить».\n— Томас Пейн, «Американский кризис»"
 LOADING_TIP_149: "«Власть не уступает ничего без требования. Никогда не уступала и никогда не уступит».\n— Фредерик Дуглас, речь о Вест-Индской эмансипации, 1857 год"
 LOADING_TIP_150: "«Дурным людям для достижения своих целей нужно лишь, чтобы хорошие люди смотрели и ничего не делали».\n— Джон Стюарт Милль, речь в Сент-Эндрюсском университете, 1867 год"
 LOADING_TIP_151: "«Война — уродливая вещь, но не самая уродливая: ещё хуже нравственное разложение, при котором считают, что ничто не стоит войны».\n— Джон Стюарт Милль, «Борьба в Америке»"
 LOADING_TIP_152: "«Патриотизм — последнее прибежище негодяя».\n— Сэмюэл Джонсон, 1775 год"
 LOADING_TIP_153: "«Миру нужна справедливость, а не благотворительность».\n— Мэри Уолстонкрафт, «В защиту прав женщины»"
 LOADING_TIP_154: "«Оборона гораздо важнее богатства».\n— Адам Смит, «Исследование о природе и причинах богатства народов»"
 LOADING_TIP_155: "«Свободу любого рода редко теряют всю сразу».\n— Дэвид Юм, «О свободе печати»"
 LOADING_TIP_156: "«Власть всегда воображает, что у неё великая душа и обширные замыслы, недоступные пониманию слабых».\n— Джон Адамс, письмо Томасу Джефферсону, 1816 год"
 LOADING_TIP_157: "«Кто побеждает силой, тот побеждает врага лишь наполовину».\n— Джон Мильтон, «Потерянный рай»"
 LOADING_TIP_158: "«История — это немногим больше, чем перечень преступлений, безумств и несчастий человечества».\n— Эдвард Гиббон, «История упадка и разрушения Римской империи»"
 LOADING_TIP_159: "«Великие вопросы времени решаются не речами и постановлениями большинства, а железом и кровью».\n— Отто фон Бисмарк, речь в бюджетной комиссии, 1862 год"
 LOADING_TIP_160: "«Им нужны великие потрясения, нам нужна великая Россия».\n— Пётр Столыпин, речь во II Государственной думе, 1907 год"
 LOADING_TIP_161: "«Единственное, чего нам следует бояться, — это самого страха».\n— Франклин Делано Рузвельт, первая инаугурационная речь, 1933 год"
