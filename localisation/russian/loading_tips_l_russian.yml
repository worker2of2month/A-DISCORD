l_russian:
 LOADING_TIP_0: "«Война есть не что иное, как продолжение государственной политики иными средствами».\n— Карл фон Клаузевиц, «О войне»"
 LOADING_TIP_1: "«Всё на войне очень просто, но самое простое оказывается трудным».\n— Карл фон Клаузевиц, «О войне»"
 LOADING_TIP_2: "«Война — область неопределённости: три четверти того, на чём строится действие, скрыты туманом».\n— Карл фон Клаузевиц, «О войне»"
 LOADING_TIP_3: "«Всякая война основана на обмане».\n— Сунь-цзы, «Искусство войны»"
 LOADING_TIP_4: "«Высшее искусство войны — сломить сопротивление врага без боя».\n— Сунь-цзы, «Искусство войны»"
 LOADING_TIP_5: "«Если знаешь противника и знаешь себя, можешь не бояться исхода сотни сражений».\n— Сунь-цзы, «Искусство войны»"
 LOADING_TIP_6: "«Нет примера, чтобы государство выиграло от затяжной войны».\n— Сунь-цзы, «Искусство войны»"
 LOADING_TIP_7: "«Нападай там, где противник не готов; появляйся там, где тебя не ожидают».\n— Сунь-цзы, «Искусство войны»"
 LOADING_TIP_8: "«Гораздо безопаснее внушать страх, чем быть любимым, если приходится выбирать одно из двух».\n— Никколо Макиавелли, «Государь»"
 LOADING_TIP_9: "«Все вооружённые пророки побеждали, а все безоружные погибали».\n— Никколо Макиавелли, «Государь»"
 LOADING_TIP_10: "«Кто оставляет то, что делается, ради того, что должно делаться, скорее готовит себе гибель, чем спасение».\n— Никколо Макиавелли, «Государь»"
 LOADING_TIP_11: "«Государь должен уподобиться лисе, чтобы обходить капканы, и льву, чтобы отпугивать волков».\n— Никколо Макиавелли, «Государь»"
 LOADING_TIP_12: "«Обиду нужно наносить так, чтобы не бояться мести».\n— Никколо Макиавелли, «Государь»"
 LOADING_TIP_13: "«Пока люди живут без общей власти, держащей всех в страхе, они находятся в состоянии войны всех против всех».\n— Томас Гоббс, «Левиафан»"
 LOADING_TIP_14: "«Соглашения без меча — лишь слова, неспособные гарантировать человеку безопасность».\n— Томас Гоббс, «Левиафан»"
 LOADING_TIP_15: "«При постоянном страхе и опасности насильственной смерти жизнь человека одинока, бедна, беспросветна, тупа и кратковременна».\n— Томас Гоббс, «Левиафан»"
 LOADING_TIP_16: "«Там, где кончается закон, начинается тирания».\n— Джон Локк, «Два трактата о правлении»"
 LOADING_TIP_17: "«Цель закона — не уничтожать и не ограничивать свободу, а сохранять и расширять её».\n— Джон Локк, «Два трактата о правлении»"
 LOADING_TIP_18: "«Человек рождается свободным, но повсюду он в цепях».\n— Жан-Жак Руссо, «Об общественном договоре»"
 LOADING_TIP_19: "«Всякий человек, обладающий властью, склонен злоупотреблять ею, пока не встретит предел».\n— Шарль де Монтескьё, «О духе законов»"
 LOADING_TIP_20: "«Решитесь не служить больше — и вы свободны».\n— Этьен де Ла Боэси, «Рассуждение о добровольном рабстве»"
 LOADING_TIP_21: "«Те, кто способен заставить вас поверить в нелепости, способны заставить вас совершать злодеяния».\n— Вольтер, «Вопросы о чудесах»"
 LOADING_TIP_22: "«Мир — это не отсутствие войны, а добродетель, рождающаяся из силы духа».\n— Бенедикт Спиноза, «Политический трактат»"
 LOADING_TIP_23: "«Из столь кривой древесины, как та, из которой сделан человек, нельзя вытесать ничего совершенно прямого».\n— Иммануил Кант, «Идея всеобщей истории во всемирно-гражданском плане»"
 LOADING_TIP_24: "«Кто сражается с чудовищами, тому следует остерегаться, чтобы самому не стать чудовищем».\n— Фридрих Ницше, «По ту сторону добра и зла»"
 LOADING_TIP_25: "«Государство — самое холодное из всех холодных чудовищ».\n— Фридрих Ницше, «Так говорил Заратустра»"
 LOADING_TIP_26: "«Власть развращает, абсолютная власть развращает абсолютно».\n— Джон Дальберг-Актон, письмо Манделлу Крейтону, 1887 год"
 LOADING_TIP_27: "«Самый опасный момент для дурного правительства обычно наступает тогда, когда оно начинает исправляться».\n— Алексис де Токвиль, «Старый порядок и революция»"
 LOADING_TIP_28: "«Кто не помнит прошлого, обречён пережить его вновь».\n— Джордж Сантаяна, «Жизнь разума»"
 LOADING_TIP_29: "«Опыт и история учат, что народы и правительства никогда ничему не учились из истории».\n— Георг Вильгельм Фридрих Гегель, «Лекции по философии истории»"
 LOADING_TIP_30: "«Все великие всемирно-исторические события и личности появляются дважды: первый раз как трагедия, второй — как фарс».\n— Карл Маркс, «Восемнадцатое брюмера Луи Бонапарта»"
 LOADING_TIP_31: "«Насилие является повивальной бабкой всякого старого общества, беременного новым».\n— Карл Маркс, «Капитал»"
 LOADING_TIP_32: "«Свобода без социализма — привилегия и несправедливость; социализм без свободы — рабство и скотство».\n— Михаил Бакунин, «Федерализм, социализм и антитеологизм»"
 LOADING_TIP_33: "«Свобода только для сторонников правительства — не свобода. Свобода всегда есть свобода для инакомыслящего».\n— Роза Люксембург, «Русская революция»"
 LOADING_TIP_34: "«Те, кто отказывается от существенной свободы ради малой временной безопасности, не заслуживают ни свободы, ни безопасности».\n— Бенджамин Франклин, ответ губернатору Пенсильвании, 1755 год"
 LOADING_TIP_35: "«Готовность к войне — одно из самых действенных средств сохранения мира».\n— Джордж Вашингтон, первое ежегодное послание Конгрессу, 1790 год"
 LOADING_TIP_36: "«Ни одна нация не может сохранить свободу в условиях непрерывной войны».\n— Джеймс Мэдисон, «Политические наблюдения», 1795 год"
 LOADING_TIP_37: "«Настали времена, испытывающие человеческие души».\n— Томас Пейн, «Американский кризис»"
 LOADING_TIP_38: "«Тиранию, подобно аду, нелегко победить».\n— Томас Пейн, «Американский кризис»"
 LOADING_TIP_39: "«Власть не уступает ничего без требования. Никогда не уступала и никогда не уступит».\n— Фредерик Дуглас, речь о Вест-Индской эмансипации, 1857 год"
 LOADING_TIP_40: "«Дурным людям для достижения своих целей нужно лишь, чтобы хорошие люди смотрели и ничего не делали».\n— Джон Стюарт Милль, речь в Сент-Эндрюсском университете, 1867 год"
 LOADING_TIP_41: "«Война — уродливая вещь, но не самая уродливая: ещё хуже нравственное разложение, при котором считают, что ничто не стоит войны».\n— Джон Стюарт Милль, «Борьба в Америке»"
 LOADING_TIP_42: "«Патриотизм — последнее прибежище негодяя».\n— Сэмюэл Джонсон, 1775 год"
 LOADING_TIP_43: "«Миру нужна справедливость, а не благотворительность».\n— Мэри Уолстонкрафт, «В защиту прав женщины»"
 LOADING_TIP_44: "«Оборона гораздо важнее богатства».\n— Адам Смит, «Исследование о природе и причинах богатства народов»"
 LOADING_TIP_45: "«Свободу любого рода редко теряют всю сразу».\n— Дэвид Юм, «О свободе печати»"
 LOADING_TIP_46: "«Власть всегда воображает, что у неё великая душа и обширные замыслы, недоступные пониманию слабых».\n— Джон Адамс, письмо Томасу Джефферсону, 1816 год"
 LOADING_TIP_47: "«Кто побеждает силой, тот побеждает врага лишь наполовину».\n— Джон Мильтон, «Потерянный рай»"
 LOADING_TIP_48: "«История — это немногим больше, чем перечень преступлений, безумств и несчастий человечества».\n— Эдвард Гиббон, «История упадка и разрушения Римской империи»"
 LOADING_TIP_49: "«Великие вопросы времени решаются не речами и постановлениями большинства, а железом и кровью».\n— Отто фон Бисмарк, речь в бюджетной комиссии, 1862 год"
 LOADING_TIP_50: "«Им нужны великие потрясения, нам нужна великая Россия».\n— Пётр Столыпин, речь во II Государственной думе, 1907 год"
 LOADING_TIP_51: "«Единственное, чего нам следует бояться, — это самого страха».\n— Франклин Делано Рузвельт, первая инаугурационная речь, 1933 год"
 LOADING_TIP_52: "«Каждое произведённое оружие, каждый спущенный на воду военный корабль, каждая выпущенная ракета в конечном счёте означают кражу у тех, кто голоден и не накормлен».\n— Дуайт Эйзенхауэр, речь «Шанс для мира», 1953 год"
 LOADING_TIP_53: "«Те, кто делает мирную революцию невозможной, сделают насильственную революцию неизбежной».\n— Джон Кеннеди, речь в Белом доме, 1962 год"
 LOADING_TIP_54: "«Сегодня это случилось с нами. Завтра это случится с вами».\n— Хайле Селассие I, речь в Лиге Наций, 1936 год"
