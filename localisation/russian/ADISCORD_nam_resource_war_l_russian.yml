 NAM_wartime_programmes_tt: "Идёт ресурсная война или война за Юг, в которой Светлогорье ведёт северный лагерь"
 NAM_startup_region:0 "§YЮЖНЫЙ РЕСУРСНЫЙ ПОЯС: ОКРУЖЕНИЕ СВЕТЛОГОРЬЯ§!\n\nОбстановка к началу 2160 года.\n\n§YВоркерланд: власть над автономией§!\nСветлогорье входит в систему зависимых территорий конфедерации. Наместники управляют нефтяным бассейном через отчёты, округа и гарнизоны, но распоряжения центра всё чаще расходятся с его возможностями. Слабость Воркерланда делает вопрос о принадлежности местных ресурсов всё острее.\n\n§YЭфлор: требование вернуть землю§!\nНационалистическое руководство республики ставит территориальное единство выше местной самостоятельности. Нефтяные земли, когда-то отнятые Воркерландом, остаются предметом претензий. Для Эфлора наместническая администрация воплощает порядок, который закрепил эту потерю.\n\n§YАжар: Директория Чёрного бассейна§!\nСамир Ажар объединил округа единым учётом людей, припасов и топлива. Директория содержит резервы и подчиняет снабжение государственному плану. Её территориальные притязания подкреплены готовностью к мобилизации, а борьба за нефтяной бассейн имеет и хозяйственное, и политическое значение.\n\n§YШахрабад и торговые пути Юга§!\nШахрабад сосредоточивает население, металлургию и промышленный капитал региона. Его печам нужны вода, сырьё и устойчивый вывоз продукции; Кейзан, Мазар и порты Вейра влияют на эти потоки. Нефтяное богатство Светлогорья существует внутри этой общей системы обмена, где местный спор способен затронуть весь Юг."
 NAM_startup_country: "§YСВЕТЛОГОРЬЕ В 2160 ГОДУ§!\n\n§YНефтяной бассейн и имперская власть§!\nСветлогорье сложилось внутри зависимой административной системы Воркерланда. Земли промыслов и прилегающую инфраструктуру включали в Светлогорье решениями воркерландской администрации. Население этих территорий несколько поколений жило под чужой властью; государственная граница закрепляла распоряжение центра, не устраняя памяти о прежней принадлежности земли.\n\nНефть сделала южный бассейн важным источником ресурсов. Вместе с промыслами в повседневную жизнь вошли планы отгрузок, гарнизонное снабжение и экспортные расчёты. Богатство находилось под землёй, а право распорядиться им проходило через учреждения, связанные с далёкой столицей.\n\n§YЛестница наместников§!\nИмперская администрация построила управление как цепь уполномоченных представителей. Каждая управа отчитывалась перед следующей, и каждая ступень имела печать и право остановить решение. Эта лестница собирала ресурсы и поддерживала дисциплину, но давала центру представление о стране прежде всего через отчёты.\n\nСо временем канцелярский порядок стал самостоятельной силой. Согласование определяло, кто получит деньги и доступ к запасам; ошибка грозила превратиться в государственную тайну. Сам аппарат умел учитывать чужие расходы лучше собственных. Двойные ведомости позволяли одному управлению выглядеть как несколько действующих учреждений.\n\n§YКогда распоряжения разошлись§!\nОслабление воркерландского центра не отменило прежнюю систему подчинения. В Светлогорье продолжали приходить предписания: отправить нефть, не трогать вагоны, исполнить новый приказ вместо предыдущего. На полках Егора Рома сохранились бумаги, которые уже невозможно было выполнить одновременно. Формальные полномочия всё хуже отражали наличие людей, складов и свободного транспорта.\n\nНаместники требовали дисциплины, округа оспаривали поборы, нефтяники ждали заработанного. Гарнизоны зависели от настоящего горючего, экспортные конторы - от состоявшихся отгрузок. Разные части одного хозяйства предъявляли власти несовместимые требования. Задержки жалованья и сборы питали недовольство Светлогорска, крупнейшего города страны.\n\nНа карте управа могла опираться на целый полк, а на дороге её представлял один пост. Топливо задерживалось между ведомственными отчётами; ремонтные мастерские умели больше, чем признавали их сметы. Порядок сохранял видимость полного учёта, хотя реальная работа всё чаще зависела от местных людей и обходных договорённостей.\n\n§YК началу 2160 года§!\nВсе линии наместнической власти сходятся к Егору Рому, а Кирилл Мезенцев сводит её обязательства в платёжных ведомостях. Светлогорье остаётся зависимой территорией Воркерланда с крупнейшими нефтяными полями Юга. Унаследованный аппарат продолжает действовать, хотя доверие к его печатям ослабло. Накопленное нефтяное богатство соседствует с невыплаченным жалованьем и спором о том, кому оно принадлежит."
 NAM_startup_guide_groups_title:0 "Опоры, власть и подполье"
 NAM_startup_guide_groups:0 "§YКТО ДЕРЖИТ СВЕТЛОГОРЬЕ§!\n\n§YПять опор§!\nВ разделе \"$NAM_supports$\" следите за наместниками, нефтяниками, округами, гарнизонами и экспортными конторами. Поддержка показывает отношение к власти, вес - влияние группы. Уступки одной опоре могут задеть другую. Фокусы и оплачиваемые решения меняют учреждения и отношения с группами; одного высокого показателя недостаточно для устойчивой власти.\n\n§YЛестница печатей§!\nПосле независимости появляется баланс между вертикалью и округами. Вертикаль усиливает сборы и управление, но её господство обходится стабильностью и исследованиями. Округа помогают строительству, науке и общественному согласию, уступая в политической власти и сборах. Фокусы, покровительство группам и политические события сдвигают баланс.\n\n§YСоглашения и кризисы§!\nЧерез три месяца после независимости совет начинает предлагать выбор из двух программ. Одновременно действует одно соглашение на 180 дней. Оно требует завершённых работ или настоящих отгрузок, приносит +15 поддержки выбранной опоры и годовой бонус. Условия, цены и результаты видны до подписания; прогресс показан в задании раздела \"$NAM_supports$\". После исхода наступает общая пауза 300 дней.\n\nОтказ от обоих проектов стоит каждой предложившей опоре 5 поддержки. Срыв принятого обещания отнимает 20 поддержки и даёт временный штраф на 180 дней. При поддержке ниже 25 возникает кризис; он также возможен при низкой поддержке и реальных проблемах хозяйства или государства. За 90 дней восстановите поддержку до 40 либо оплатите урегулирование. Если срок истёк, страна теряет 10% стабильности и 50 политической власти; неуслышанный соперник при поддержке ниже 25 может оспорить власть, пока государственный строй не закреплён.\n\nВойна или подчинение закрывают гражданское соглашение без штрафа. Незавершённые ревизия, обучение и окружная стройка возвращают оплату; обычное бурение подчиняется своим условиям. После мира программы снова доступны, в том числе после финала политического курса. BOP от этих хозяйственных соглашений не сдвигается.\n\n§YПодполье Ярослава Вебера§!\nОно действует с начала кампании: недовольство округов и усиление вертикали помогают ему расти. Возможны пожары, налёты на склады и покушения. В колониальный период доступны облавы; позже вертикаль ищет тайники, а округа могут пройти переговоры до амнистии и получить Вебера в командование.\n\n§YКак избежать восстания§!\nЗавершённая амнистия предотвращает выступление. Другой путь - открыть гарантии Светлогорску и оплатить договор: к началу войны он должен проработать 60 непрерывных дней при вашем владении и контроле города. Без этих гарантий подполье от 60 вызывает восстание, от 30 до 59 даёт половинную вероятность; ниже 30 выступления не будет. Подготовьте город до начала войны."
 NAM_startup_guide_oil_title:0 "Бассейн, контракты и острова"
 NAM_startup_guide_oil:0 "§YНЕФТЬ ДОЛЖНА ДОЙТИ ДО ПОКУПАТЕЛЯ§!\n\n§YПока существует метрополия§!\nВ разделе \"$NAM_colony$\" доступны поставки Воркерланду и торговые концессии. Они дают доход и меняют отношения с опорами. После распада центра колониальные программы закрываются: не стройте постоянные расходы только на их выручке.\n\n§YКарта нефтяного бассейна§!\nПосле \"$NAM_inventory$\" откройте \"$NAM_national_programmes$\". Карта показывает состояние промыслов, пропускную способность, занятые мощности и проекты. Нефть на карте, топливо на складе и свободная мощность для контракта - разные показатели. Потеря или повреждение узла сокращает возможности поставок.\n\n§YРемонт и развитие§!\nРемонт скважин, промысловые заводы, Ключевский нефтепровод и морской терминал требуют открывающих фокусов, оплаты и времени. Проверяйте свободное место для проекта и владение нужными округами. Нефтепроводу нужны Сухоречье и Южная гавань; морской терминал обслуживает дальних покупателей. Потеря стройплощадки прерывает работу и возвращает задаток.\n\n§YТопливные контракты§!\nПокупатель должен согласиться на предложение. Действующий контракт занимает мощность и ежемесячно обменивает §Y15000§! £fuel_texticon со склада на §G40§! £ADISCORD_economy_treasury_texticon. Если топлива не хватает, поставка и оплата пропускаются. Война с покупателем обрывает контракт.\n\n§YЗаморские округа§!\nОстрова дают сталь, конвойную службу и возможности концессий. Договорённости с Кефрейтом требуют согласия другой стороны. Развивайте гавани и защищайте архипелаг: при потере материка он может стать местом продолжения кампании. Подробности находятся в \"Путях\".\nЭкспортная диспетчерская даёт ещё §G+30§! £ADISCORD_economy_treasury_texticon за каждую выполненную месячную поставку на время её работы."
 NAM_startup_guide_war_title:0 "Давление и ресурсная война"
 NAM_startup_guide_war:0 "§YПОДГОТОВКА И ФРОНТ§!\n\n§YСрок угрозы§!\nОтсчёт начинается при распаде Воркерланда и длится 450 дней. Четыре разовых дипломатических действия дают до 225 дополнительных дней; территориальный протокол отдельно даёт 365 дней. Ноты и ультиматум предупреждают о приближении срока. Отказ от вводных фокусов не останавливает кризис. Собственный первый удар завершает ожидание.\n\n§YОтвет на ультиматум§!\nКлючевский протокол уступает Восточное Сухоречье и вводит годовые топливные поставки, откладывая угрозу на год. Покупка времени у Ажара даёт 75 дней, но не выводит его из коалиции. Можно отвергнуть требования или ударить первым: упреждающая война начинается быстро, с ослабленным оборонительным бонусом.\n\n§YМобилизация до выстрелов§!\nВ разделе \"$NAM_mobilisation$\" оплачивайте формирования и готовьте рубежи. Заказ резервирует ресурсы сейчас, соединение выходит при начале войны. До войны его можно распустить с возвратом казны, топлива и людей, но без возврата политической власти. Проверяйте предел заказов, сроки работ и запас на пополнение. Готовность Светлогорска описана в разделе об опорах.\n\n§YВойна может закончиться раньше§!\nКапитуляции и решающее положение фронта запускают мир до общего срока. Светлогорью нужны свои промыслы и все пограничные пояса противников. Коалиции достаточно Северных месторождений и ещё одного промысла. Территориальный результат перепроверяется через 7 дней: не рассчитывайте ждать до конца таймера после потери ключевых районов.\n\n§YЕсли война дошла до 420-го дня§!\nСчитается текущий контроль: Северные месторождения - 80 очков, Южнобережье - 36, Сухоречье - 24, Восточное Сухоречье и Светлогорский округ - по 12. От 100 очков с занятым пограничным округом противника дают победный договор; без него - ничью на прежней границе. 36-99 очков дают компромисс, меньше 36 - поражение.\n\n§YДисциплина печатей§!\nПотери людей и промыслов ослабляют организацию армии через дисциплину. Следите за миссиями удержания, снабжением и военными программами. Исход войны определит следующее дерево фокусов.\n\n§YГраницы и гражданство§!\nПобеда передаёт Светлогорью Морен, Лоренское пограничье, Средний Лорен и приморье Ажара. Наместнический мандат дополнительно даёт регионы 727 и 723. Эти приобретения не становятся национальными автоматически. После \"Нефтяной биржи\" откроется управление пограничными округами: выберите разоружение или соглашения с общинами, оплачивайте восстановление учреждений и при силовом курсе оформляйте гражданство при подчинении от 80% и сопротивлении до 20%. Соглашения с общинами открывают немедленную корку за 30 политвласти с постоянными региональными штрафами автономии. Перемирие сохраняет прежнюю границу."
 NAM_startup_guide_plan_title:0 "Первые шаги"
 NAM_startup_guide:0 "§YПЕРВЫЕ ШАГИ ЗА СВЕТЛОГОРЬЕ§!\n\n§Y1. Проведите опись.§! Начните с \"$NAM_inventory$\". Сверьте казну, недельный баланс, топливо и гарнизоны. Пока Воркерланд существует, используйте колониальную торговлю и следите за подпольем.\n\n§Y2. Осмотрите опоры и бассейн.§! В \"$NAM_supports$\" сравните поддержку и влияние пяти групп. В \"$NAM_national_programmes$\" проверьте состояние промыслов, свободные мощности, текущие проекты и контракты.\n\n§Y3. Выберите способ управления.§! Вертикаль и округа открывают разные средства подготовки. Для округов заранее заложите время на переговоры с Вебером либо на оплату и 60 дней работы договора Светлогорска. Вертикали нужны борьба с тайниками и готовность к внутреннему фронту.\n\n§Y4. Планируйте деньги после независимости.§! Колониальный доход исчезнет вместе с центром. Ремонтируйте промыслы, договаривайтесь о поставках и сохраняйте запас топлива для армии. Обещанное предложение ещё не является действующим контрактом.\n\n§Y5. Подготовьте войска до нападения.§! Следите за единым сроком кризиса. Оплачивайте мобилизационные заказы, готовьте рубежи и завершайте проекты вовремя. Ультиматум позволяет купить время ценой реальных уступок.\n\n§Y6. Защищайте решающие районы.§! Потеря Северных месторождений вместе с ещё одним промыслом может завершить войну досрочно. Держите резерв и контролируйте дисциплину. Победа или ничья открывает послевоенное дерево, компромисс или островное изгнание - дерево поражения. Продолжения описаны в \"Путях\"."
 NAM_startup_path_0_title:0 "Этатизм: наместники"
 NAM_startup_path_0:0 "§YВЛАСТЬ НАМЕСТНИКОВ§!\n\nУсиливайте наместников до ресурсной войны, если хотите провести Рома по этатистскому пути. Курс определяется балансом власти в момент начала боёв; послевоенная конституция продолжает этот выбор.\n\nПосле победы или ничьей вас ждёт государство службы: учёт полномочий, гарнизоны и нефтяные квоты. В хозяйстве можно выбрать единый производственный план или окружные тресты. Оба варианта ведут к общим стандартам, транспортной сети и проектным бюро.\n\nПолитический финал закрепляет жёсткую вертикаль либо служебную республику. Южная политика строится вокруг наместничеств и подчинения Шахрабада.\n\nОткройте спойлеры для точных условий входа, финалов и подготовки к войне за Юг.\n\nЕсли Ром выиграет и ресурсную войну, и войну за Юг, перед ним встанет ещё один выбор: остаться в Светлогорье или заявить права на столицу метрополии."
 NAM_startup_path_0_details:0 "§YЭТАТИЗМ: ВХОД И РАЗВИЛКИ§!\n\n§YКак открыть§!\nК началу ресурсной войны баланс власти должен быть ниже -25, на стороне наместников. Именно этот момент закрепляет курс: позднейшие сдвиги его не меняют. Если Ром остаётся правителем, он принимает этатизм. Победа или ничья открывает послевоенное дерево; после \"$NAM_recognition$\" выбирайте \"$NAM_service_state$\". Один довоенный фокус сам по себе не определяет маршрут.\n\n§YЧто развивать§!\n\"$NAM_state_plan$\" открывает оплачиваемый производственный график для военной промышленности; \"$NAM_regional_trusts$\" - окружные подряды для гражданского строительства и торговли. Эти варианты исключают друг друга. Дальше доступны единые стандарты, снабжение и проектные бюро. Политическая линия через учёт полномочий, гарнизоны и нефтяные квоты сходится в \"$NAM_ladder_of_seals$\"; для него нужны и единые стандарты.\n\nГосударственная страховка покрывает пожар или стачку на промыслах раз в 180 дней. Ведомственное жильё ведёт к семейным пенсиям. Округа могут провести расчёт с семьями, когда задержка жалованья грозит гарнизону дезертирством.\n\nПосле победы на юге демобилизационная комиссия позволяет оставить ветеранов в резерве или переоборудовать завод в одном из домашних округов.\n\n§YЧем заканчивается§!\n\"$NAM_ladder_ending_iron$\" закрепляет Железную лестницу; \"$NAM_ladder_ending_service$\" создаёт Служебную республику. Выбирается один финал со своим названием страны и национальным духом. Успешный переворот сохраняет его победителя у власти.\n\n§YПодготовка Юга§!\nЗавершите \"$NAM_svetlogorye$\", \"$NAM_oil_exchange$\", \"$NAM_ladder_of_seals$\" и \"$NAM_south_desert_offices$\". Кризис начинается не раньше 2165 года и после подготовки обеих сторон; затем действует 56-дневное предупреждение. \"$NAM_south_seal_over_furnaces$\" готовит приказ о выступлении, но не отменяет предупреждение. Победа превращает Шахрабад и его союзников в наместничества. Типовые проекты тиражируют завершённый квартал Южной гавани в Светлогорском округе. Окружные проектные бюро вместо этого позволяют заказать разработку железной руды в Сухоречье.\n\nПосле победы школы южных округов связывают училища с Хазаром. Пока подчинённый Шахрабад удерживает город, отстающая сторона при выпуске может освоить следующую технологию станкостроения, известную партнёру.\n\nПобедный договор открывает морские рейды. Выберите допустимый маршрут в категории морских рейдов; добычу можно продать. Верфи Светлогорска открывают спецпроект десантной баржи.\n\n§YПоследний выбор Рома§!\nПосле двух побед, одного конституционного финала и \"$NAM_south_heritage$\" Ром может сохранить Светлогорскую державу или пригласить эмигрантов в Вейранский имперский союз. Для похода оплатите фрахт или полевой арсенал и составьте план против действующего объединителя. Победа переносит столицу в Воркерланд, а прежние владения Рома становятся Светлогорским наместничеством. Поражение закрывает поход."
 NAM_startup_path_1_title:0 "Гуманизм: округа"
 NAM_startup_path_1:0 "§YСАМОУПРАВЛЕНИЕ ОКРУГОВ§!\n\nУсиливайте округа до начала ресурсной войны, чтобы Ром принял гуманистический курс. Гарантии городу и переговоры с подпольем помогают справиться с внутренним конфликтом, пока вы готовите страну к внешнему.\n\nПосле победы или ничьей хартия объединяет совет округов, нефтяной фонд и ополчение. Выбирайте между коммунальными сетями и общественными службами; развивайте мастерские, образование и подотчётное управление.\n\nОбщий топливный рынок открывает выбор между федерацией и Нефтяным союзом. Южная политика опирается на договоры с соседями и общий фронт против Шахрабада.\n\nОткройте спойлеры для точного порога баланса, смены руководителей и условий подготовки к войне за Юг."
 NAM_startup_path_1_details:0 "§YГУМАНИЗМ: ХАРТИЯ И ФИНАЛЫ§!\n\n§YКак открыть§!\nК началу ресурсной войны баланс власти должен быть выше +25, на стороне округов. Курс закрепляется при начале боёв, и последующие сдвиги его не меняют. Если Ром остаётся правителем, он принимает гуманизм. После победы или ничьей завершите \"$NAM_recognition$\" и откройте \"$NAM_federal_charter$\". Гарантии Светлогорску помогают защитить город, но не заменяют условие баланса.\n\n§YЧто развивать§!\n\"$NAM_public_utilities$\" открывает оплачиваемую программу строительства и коммунального хозяйства; \"$NAM_municipal_services$\" - программу общественных служб, поддерживающую науку и стабильность ценой дополнительных расходов. Выберите один вариант. После победы в ресурсной войне рабочая инспекция направляет бригады на повреждённые промыслы по итогам съездов округов. Университет открывает при окружных училищах курсы полевой медицины. Совет округов, нефтяной фонд и ополчение сходятся в \"$NAM_common_fuel_market$\"; для него нужен и гражданский аудит.\n\n§YКто возглавит страну§!\n\"$NAM_charter_ending_federation$\" приводит к власти Надежду Ладыгину и закрепляет гуманизм. \"$NAM_charter_ending_oil_union$\" передаёт власть Кириллу Мезенцеву и нефтяникам. Это разные финалы со своими названиями страны и национальными духами. Если переворот уже удался, его победитель сохраняет руководство.\n\n§YПодготовка Юга§!\nНужны \"$NAM_svetlogorye$\", \"$NAM_oil_exchange$\", \"$NAM_common_fuel_market$\" и \"$NAM_south_fenn_guarantee$\". Война готовится не раньше 2165 года и после подготовки обеих сторон, с 56-дневным предупреждением. Союз с соседями требует их согласия; \"$NAM_south_oil_charter$\" оформляет выступление против Шахрабада. Южное устройство после победы строится на нефтяных хартиях.\n\nПобедный договор открывает морские рейды. Выберите допустимый маршрут в категории морских рейдов; добычу можно продать. Верфи Светлогорска открывают спецпроект десантной баржи."
 NAM_startup_path_2_title:0 "Прагматизм: договоры"
 NAM_startup_path_2:0 "§YПРАГМАТИЧЕСКАЯ РЕСПУБЛИКА§!\n\nУдерживайте равновесие между округами и наместниками до ресурсной войны. Ром станет арбитром их обязательств, а после победы или ничьей откроется отдельная ветка договорного государства.\n\nЕё опора - хозяйственный арбитраж, порт и надёжные расчёты. Выберите торговую специализацию или поставки станков, развивайте склады и страхование перевозок. Программы требуют казны и дают повод планировать расходы заранее.\n\nВ финале можно учредить республику договоров либо деловой совет. Соседям предлагаются экономические соглашения; борьба с Шахрабадом ведётся за обеспечение южных обязательств.\n\nОткройте спойлеры для точного диапазона баланса, условий договоров и различий между финалами."
 NAM_startup_path_2_details:0 "§YПРАГМАТИЗМ: РАВНОВЕСИЕ И ДОГОВОРЫ§!\n\n§YКак открыть§!\nК началу ресурсной войны удержите баланс от -25 до +25 включительно. При начале боёв этот результат закрепляется; изменить маршрут позднейшим сдвигом нельзя. Если Ром остаётся правителем, он принимает прагматизм. После победы или ничьей завершите \"$NAM_recognition$\" и выберите \"$NAM_pragmatic_compact$\". Ветки наместников и округов при таком результате недоступны.\n\n§YЧто развивать§!\n\"$NAM_commercial_courts$\" открывает оплачиваемую программу арбитража. Затем выберите \"$NAM_export_clearing$\" для торговли или \"$NAM_machine_tool_contracts$\" для промышленности. Портовая линия развивает склады, страхование караванов и коммерческий резерв. Патенты дают готовый парк бронетранспортёров и грузовиков. Конструкторские конторы обменивают запасные шасси и снаряжение на бронетранспортёры местной сборки. Фокус \"$NAM_repair_depots$\" позволяет оплатить аварийную смену на карте программ. Она восстанавливает промысел после поджога и оставляет запасной насос на случай нового повреждения. Альтернатива, \"$NAM_licensed_assembly$\", снабжает армию бронетранспортёрами.\n\nПосле открытия таможенной ведомости продайте партию топливного резерва в Южной гавани. В течение 90 дней по этой продаже можно разместить городской заём, если принят фокус \"$NAM_municipal_bonds$\". Часть следующих продаж и ежемесячный платёж из казны пойдут вкладчикам.\n\n§YДва устройства власти§!\nПосле \"$NAM_balanced_accounts$\" выберите \"$NAM_prag_ending_republic$\" либо \"$NAM_prag_ending_directorate$\". Республика может продать часть присуждённой нефти в пользу окружного чрезвычайного фонда. Деловой совет использует поставки для выпуска облигаций и может погасить действующий долг нефтью. Оба финала сохраняют прагматический курс Рома, если его не сместили раньше.\n\n§YСоседи и война за Юг§!\n\"$NAM_prag_settlement_agreements$\" предлагает Эфлору и Ажару добровольные экономические договоры: отказ не начинает войну. Принявший договор партнёр сохраняет правительство и армию, но получает экономические и союзные обязательства. \"$NAM_prag_partner_supply$\" открывает топливную поддержку партнёров.\n\nДля подготовки Юга нужны \"$NAM_svetlogorye$\", \"$NAM_oil_exchange$\", \"$NAM_balanced_accounts$\" и \"$NAM_prag_partner_supply$\". Кризис открывается не раньше 2165 года после подготовки обеих сторон, затем даётся 56 дней предупреждения. \"$NAM_prag_south_guarantees$\" готовит выступление; победа закрепляет экономические договоры на Юге.\n\nПобедный договор открывает морские рейды. Выберите допустимый маршрут в категории морских рейдов; добычу можно продать. Верфи Светлогорска открывают спецпроект десантной баржи."
 NAM_startup_path_3_title:0 "Поражение: что дальше"
 NAM_startup_path_3:0 "§YМАТЕРИК ИЛИ ОСТРОВА§!\n\nКомпромисс в ресурсной войне оставляет Светлогорью часть материка. В этом случае дерево поражения предлагает реванш либо хозяйственное восстановление и договор с победителями.\n\nПолный разгром при сохранённых островах приводит к изгнанию. На островном совете вы выбираете радикалов или гуманистов. Корпоративный путь вырастает позднее из зависимости гуманистов от инвесторов.\n\nКаждому островному пути посвящена отдельная страница ниже: там описаны вход, подготовка возвращения и будущее устройство страны. Довоенный баланс власти Рома не ограничивает выбор островного совета."
 NAM_startup_path_3_details:0 "§YПОРАЖЕНИЕ: УСЛОВИЯ ПРОДОЛЖЕНИЯ§!\n\n§YКомпромиссный мир§!\nПри 36-99 очках на итоговой проверке Светлогорье сохраняет контролируемые промыслы и острова, уступает занятые противником земли и платит годовую топливную дань. Дерево поражения предлагает восстановление и реванш либо соглашение с коалицией. Экономическое примирение не гарантирует защиту от будущего нападения Шахрабада.\n\n§YБегство на острова§!\nПолная победа коалиции отнимает материк. Для продолжения нужны сохранившиеся заморские владения под вашим контролем: туда переносится столица. Без подходящих островов страна аннексируется. Эвакуация спасает часть армии, но значительная доля запасов теряется.\n\n§YВыбор нового правительства§!\nПосле бегства приходит событие \"$ADISCORD_nam_resource_war.100.t$\". Ответ \"$ADISCORD_nam_resource_war.100.a$\" открывает радикалов Карамышева, а \"$ADISCORD_nam_resource_war.100.b$\" - гуманистов Вебера. Оба ответа свергают Рома. Порогов довоенного баланса для этого выбора нет. У события 7 дней на ответ; если оставить его без внимания, будет выбран первый вариант.\n\n§YТретий путь§!\nКорпораты не являются третьей кнопкой совета. Сначала выберите гуманистов, затем допустите захват власти компаниями. Подробности и точные пороги находятся на странице \"Корпораты в изгнании\".\n\n§YВозвращение§!\nУ каждого островного курса свой фокус войны с Эфлором и Ажаром. Подготовьте его предпосылки, флот и десант; проверьте мир, независимость и отсутствие дани. Получение фокуса не заменяет победу в войне."
 NAM_startup_paths_note:0 "Просмотр не выбирает курс. Условия входа и финалы - в спойлерах."
 NAM_startup_path_4_title:0 "Радикалы в изгнании"
 NAM_startup_path_4:0 "§YХУНТА ОПОР§!\n\nПосле разгрома и бегства на острова передайте власть опорам Светлогорья. Ростислав Карамышев объединит офицеров, капитанов и промысловые артели вокруг силового возвращения на материк.\n\nЭто путь реквизиций, военной промышленности и морского рейдерства. Добыча оплачивает вооружение и десант, а острова превращаются в крепость. Предстоит выбрать отношение к старым офицерам, устройство каперства и способ подготовки удара.\n\nПосле возвращения хунта удерживает покорённые территории гарнизонами и готовит поход на Юг. Финальная цель - Владычество столпов.\n\nСпойлеры показывают точный ответ в событии, опорные фокусы и условия дальнейшего наступления."
 NAM_startup_path_4_details:0 "§YРАДИКАЛЫ: КАК ПРИЙТИ И КУДА ИДТИ§!\n\n§YВход§!\nНужен исход ресурсной войны с островным изгнанием. В событии \"$ADISCORD_nam_resource_war.100.t$\" выберите \"$ADISCORD_nam_resource_war.100.a$\". Рома сменит Ростислав Карамышев, установится этатистская хунта и загрузится отдельное дерево. Довоенный курс Рома не мешает этому выбору; перехода к гуманистам через повторный совет нет.\n\n§YПодготовка на островах§!\nРазвивайте крепость Нео-Светлогорск, топливные склады, кадетский корпус и десантные баржи. В политике выберите чистку людей наместника либо амнистию офицерам. В морской ветке решите, подчинить рейдеров каперским грамотам или допустить вольное братство.\n\nПосле \"$NAM_exile_sea_raiders$\" доступны морские рейды. Им нужны корабли, свободная флотилия и топливо; результат зависит от риска. Добыча оплачивает оружие, конвои, учения и морскую пехоту. Высокая дурная слава повышает угрозу блокад и карательных рейдов. На материке выберите между ячейками подполья в двух областях и забастовкой в Ключевске: она лишит держателя промысла топлива и сократит добычу до полугода.\n\n§YВозвращение и власть§!\n\"$NAM_rad_war_of_return$\" требует подготовки гавани, островной крепости, складов, кадетского корпуса, барж и адмиралтейства каперов. Начинайте его в мире, будучи независимыми и без топливной дани. Победа возвращает родные земли; покорённые чужие территории становятся базой реквизиций, трофеев и гарнизонного управления.\n\n§YФинал§!\nУкрепляйте власть над возвращённым югом. Для следующей большой войны нужна консолидация не ниже 70. \"$NAM_rad_great_war$\" ведёт к южной кампании, затем можно распределять дань, развивать гарнизоны и вывозить станки на острова. \"$NAM_rad_dominion_of_pillars$\" завершает курс господством опор над покорённым регионом."
 NAM_startup_path_5_title:0 "Гуманисты в изгнании"
 NAM_startup_path_5:0 "§YСВОБОДНЫЕ ОСТРОВА§!\n\nПосле бегства передайте власть гуманистам Ярослава Вебера. Они строят гражданскую власть, принимают беженцев и привлекают иностранный капитал для восстановления и возвращения.\n\nЗдесь важны свободные зоны, жилищное строительство, образование и договоры с округами. Средства инвесторов помогают собрать армию, но компании постепенно требуют политического влияния. Вам предстоит удержать контроль над партнёрством.\n\nПобеда на материке ведёт к федеральным округам, а южная кампания - к общему союзу. Финал гуманистов - Конституция Союза. Если правления подчинят правительство, вместо него откроется корпоративный путь.\n\nВ спойлерах указаны вход и способы удержать власть Вебера."
 NAM_startup_path_5_details:0 "§YГУМАНИСТЫ: ВЕБЕР И ФЕДЕРАЦИЯ§!\n\n§YВход§!\nПосле островного изгнания в событии \"$ADISCORD_nam_resource_war.100.t$\" выберите \"$ADISCORD_nam_resource_war.100.b$\". Ярослав Вебер сменит Рома. Не требуется заранее проводить амнистию или выводить довоенный баланс на сторону округов. Откроются свободные зоны; накопленная добыча превратится в иностранный капитал, а пиратский путь будет закрыт.\n\n§YКак сохранить правительство§!\nИностранный капитал - средства для заказов, а влияние корпораций - их политическая сила. Следите за обоими показателями. \"$NAM_hum_regulated_partnership$\" открывает решение \"$NAM_corp_curb_influence$\"; профсоюзные договоры, комиссия по хартиям и городская гавань также сдерживают компании. \"$NAM_hum_open_doors$\", посёлки компаний и концессии усиливают инвесторов.\n\nПри влиянии 70 и 90 приходят требования правлений. Уступки приближают переворот; сопротивление требует ресурсов. Не доводите влияние до 100 и не оставляйте его на уровне 90 или выше на три месячные проверки подряд. Падение ниже 90 при месячной проверке обнуляет этот счётчик. Уже назначенный переворот поздним снижением влияния не отменить.\n\n§YВозвращение§!\nРазвивайте островное хозяйство, гражданскую армию, морские контракты и связи с материком. Парламент выкупает островные мастерские для местных кооперативов и сдерживает влияние инвесторов. Кабинет национального спасения может передать гражданские фабрики под переоборудование торговых судов для десанта. \"$NAM_hum_war_of_return$\" открывает войну возвращения после подготовки; родные земли возвращаются Светлогорью, а новые территории оформляются как федеральные округа.\n\n§YФинал§!\nВосстанавливайте гавани, заключайте федеральные договоры и укрепляйте консолидацию. До союзного призыва можно предложить одному соседу вступление или профинансировать фабрику в федеральном округе. Ответ добровольный. Для большой южной войны нужна консолидация не ниже 70. \"$NAM_hum_great_war$\" расширяет союз на Юг, после чего доступны союзный парламент, университет и выбор общей валюты либо армии. Союзный университет позволяет учредить инженерные факультеты в федеральных округах. Хартия караванов связывает Южную гавань с рынками подчинённых округов, даже если Кадир остался вне союза. При общей валюте федерация может заказать снаряжение у окружных мастерских. После создания общего рынка обратный рейс собирает закупленные караванами детали для армии. Мастерская с федеральным заказом может взять местную партию для изготовления орудий. \"$NAM_hum_union_constitution$\" закрепляет устройство Союза, если компании не захватили власть.\n\nФедеральная армия создаёт первый полк и передаёт округам единый штат. После общей победы можно принять союзную валюту и финансировать окружные заказы или ввести единый штат общевойсковых бригад."
 NAM_startup_path_6_title:0 "Корпораты в изгнании"
 NAM_startup_path_6:0 "§YГОСУДАРСТВО ПРАВЛЕНИЙ§!\n\nЭтот маршрут начинается внутри гуманистического изгнания. Допустите, чтобы зависимость от инвесторов переросла в передачу власти корпорациям. Совет правлений во главе с Марком Ольшанским получит собственное дерево.\n\nВыбирайте, сохранить министров Вебера как вывеску или провести чистку. Концессии, акционеры и суды компаний заменяют гражданские институты; армию и флот собирают по контрактам.\n\nВозвращение становится борьбой за контроль над активами. Округа передаются отдельным корпорациям, которые приносят доходы и развивают свои специализации. Южная война завершается Союзом правлений.\n\nСпойлеры объясняют, как вызвать переход и какие решения ведут к нему."
 NAM_startup_path_6_details:0 "§YКОРПОРАТЫ: ЗАХВАТ ВЛАСТИ И КОНЦЕССИИ§!\n\n§YСначала гуманисты§!\nПосле островного изгнания выберите в совете гуманистов Вебера. Отдельного корпоративного ответа там нет, а из радикального курса этот переход недоступен. Довоенный баланс Рома не определяет захват власти правлениями.\n\n§YКак передать власть§!\nНаращивайте влияние компаний через \"$NAM_hum_open_doors$\", \"$NAM_corp_court_investors$\", посёлки компаний, концессию на гавань и уступки в событиях. Несколько действующих свободных зон и передача рабочих компаниям также увеличивают месячный рост влияния. Капитал сам по себе не является порогом переворота.\n\nЗахват власти назначается при влиянии 100 либо после трёх месячных проверок подряд с влиянием не ниже 90. Требования при 70 и 90 - предупреждения, а не сам переход. Дождитесь события \"$ADISCORD_nam_resource_war.103.t$\" и его единственного ответа. Марк Ольшанский возглавит государство с идеологией коммерческого гедонизма; загрузится корпоративное дерево. Уже завершённые гуманистические фокусы сохранятся.\n\n§YКак управлять§!\nПосле \"$NAM_hum_board_of_governors$\" министры Вебера сохранят мастерские, которые поставляют бронепоезда и грузовики. Чистка министерств откроет оружейные контракты с бронетранспортёрами. Суды при министрах подтверждают права действующего владельца, при управляющих компаний передают концессию претенденту. Судебное решение защищает округ от новых исков полгода. В пирамиде правлений три голоса даёт отрасль, два - округ с бесспорной концессией, один - место представителя в кабинете. Сначала посмотрите, кто выйдет в председатели после продажи. $NAM_board_industry_rules$ Передача отраслей окончательна. Лорэн как владелец нефтебаз платит больше за ключевскую нефть.\n\nДля экспедиции выберите флот компаний с эскортом и островными конвоями или укомплектованный наёмный полк с сапёрами. \"$NAM_board_war_of_return$\" готовит возвращение на материк. Для Эфлора и Ажара выбираются компании-владельцы; существующие федеральные округа также переходят под правления.\n\n§YК чему ведёт§!\nПосле возвращения охрана защищает скважины и спорные выплаты. В гавани фонд строит терминал и верфи либо сдаёт транспорты. Биржа позволяет купить оружие под будущие дивиденды выбранной концессии. Округа без выпуска продолжают платить совету. Южная кампания требует подготовки и консолидации не ниже 70; \"$NAM_board_great_war$\" открывает борьбу за новые активы. Для Сардана, Рахмы и Кадира выбирайте специализацию владельцев. \"$NAM_board_union_of_boards$\" завершает путь союзом корпоративных владений."
 # Oil monopoly and the islands
 NAM_fuel_shortage: "Сорванные поставки Светлогорья"
 NAM_fuel_shortage_desc: "Контракт на светлогорское топливо оборвался вместе с началом войны. Цистерны не пришли, а замену им ещё предстоит найти."
 NAM_fuel_embargo_modifier: "Топливное эмбарго Светлогорья"
 NAM_fuel_embargo_modifier_desc: "Светлогорье закрыло для этой страны свои промыслы и терминалы. Эмбарго действует, пока не снято и Светлогорье контролирует хотя бы один промысел бассейна."
 NAM_island_convoy_route: "Островная конвойная линия"
 NAM_island_convoy_route_desc: "Регулярные конвои вывозят руду заморских округов и привозят им припасы. Остров перестаёт чувствовать себя забытым.\n\nДействует, пока независимая администрация Светлогорья сохраняется, а остров принадлежит ей и удерживается ею."
 NAM_island_steel_levy_modifier:0 "Стальной сбор с островов"
 NAM_island_steel_levy_modifier_desc:0 "Сборная контора направляет часть островной руды на оплату казённых обязательств. Горняки и концессионеры пересматривают отгрузочные ведомости.\n\nУтрата острова приостанавливает сбор до возвращения или конца срока. При прекращении сбора либо утрате независимой администрации эффект снимается."
 NAM_south_convoy_blockade: "Светлогорские охотники за конвоями"
 NAM_south_convoy_blockade_desc: "Корабли Светлогорья перехватывают танкеры и баржи, идущие к печам. Заводы получают меньше топлива и работают с перебоями."
 NAM_oil_unit_free_tt: "У Светлогорья есть свободная единица нефтяной пропускной способности для этого покупателя (на суше: §Y[?NAM_oil_free_land_units|0]§!, для заморских покупателей: §Y[?NAM_oil_free_units|0]§!)"
 NAM_oil_contract_offer: "Предложить топливный контракт"
 NAM_oil_contract_offer_desc: "Торговые поверенные направляют покупателю проект постоянного нефтяного договора. Сторонам предстоит согласовать график поставок и ответственность за каждую отгруженную партию."
 NAM_oil_contract_offer_tt: "Покупатель получает предложение и ответит в ближайшие дни. Свободная единица проверяется ещё раз при ответе.\n\n§YПри согласии:§! §G+5§! £NAM_support_oil_texticon и §G+5§! £NAM_support_trade_texticon. Контракт занимает §Y1§! единицу пропускной способности.\n\nКаждый месяц покупателю передаются §Y15000§! £fuel_texticon с наших складов, казна получает §G40§! £ADISCORD_economy_treasury_texticon.\nДействующая экспортная диспетчерская добавляет §G+30§! £ADISCORD_economy_treasury_texticon за выполненную поставку.\n\nПри нехватке топлива поставка и оплата пропускаются; война с покупателем прекращает договор.\nМорской терминал обслуживает только [VAL.GetName], [STP.GetName], [STS.GetName] и [RUS.GetName]."
 NAM_oil_contract_end: "Расторгнуть топливный контракт"
 NAM_oil_contract_end_desc: "Торговая контора уведомит покупателя о расторжении договора. Служащие сверят последние накладные и закроют его запись в реестре постоянных поставок."
 NAM_oil_contract_end_tt: "Контракт расторгается, единица пропускной способности освобождается.\nОтношение покупателя к нам ухудшается.\nЭкспортные конторы: §R-3§! £NAM_support_trade_texticon."
 NAM_fuel_embargo: "Топливное эмбарго"
 NAM_fuel_embargo_desc:0 "Соседи рассчитывают на наши поставки даже тогда, когда оспаривают наши границы. Подпись под запретом экспорта заставит их искать другую нефть."
 NAM_fuel_embargo_valid_tt:0 "Страна существует, не покупает наше топливо по контракту, не находится под эмбарго и не получает от нас дань"
 NAM_fuel_embargo_lift: "Снять топливное эмбарго"
 NAM_fuel_embargo_lift_desc:0 "Посредники снова ждут разрешения на отгрузку. Снятие запрета позволит вернуться за стол переговоров с покупателем."
 NAM_fuel_embargo_lift_tt:0 "Экспортные конторы: §G+5§! £NAM_support_trade_texticon."
 NAM_project_slot_free_tt: "Есть свободное место для проекта: занято §Y[?NAM_projects_in_progress|0]§! из §Y[NAMProjectSlots]§!"
 NAM_project_state_ready_tt: "Промысел принадлежит нам, контролируется нами, и на нём не идёт другой проект"
 NAM_project_not_scorched_tt: "Скважины промысла не выжжены в последние §Y180 дней§!"
 NAM_project_condition_low_tt: "Состояние промысла ниже §Y100§!"
 NAM_project_harbour_held_tt: "§YЮжная гавань§! принадлежит нам и контролируется нами"
 NAM_project_started_150_tt: "Казна: §R-150§! £ADISCORD_economy_treasury_texticon; задаток вернётся, если работы будут прерваны.\nЗанимается одно место для проекта."
 NAM_project_started_300_tt: "Казна: §R-300§! £ADISCORD_economy_treasury_texticon; задаток вернётся, если работы будут прерваны.\nЗанимается одно место для проекта."
 NAM_project_started_350_tt: "Казна: §R-350§! £ADISCORD_economy_treasury_texticon; задаток вернётся, если работы будут прерваны.\nЗанимается одно место для проекта."
 NAM_project_started_250_tt: "Казна: §R-250§! £ADISCORD_economy_treasury_texticon; задаток вернётся, если работы будут прерваны.\nЗанимается одно место для проекта."
 NAM_project_refund_tt: "При отмене возвращается денежный задаток, место для проекта освобождается. Сбор за разрешение возмещается по заказам, оформленным под надзором трудовой инспекции."
 NAM_project_repair_wells: "Восстановить скважины"
 NAM_project_repair_wells_desc: "Бригада осматривает заклинивший насос. На деталях видны следы нескольких прежних ремонтов. Старший мастер просит разыскать человека, поставившего последнюю самодельную втулку."
 NAM_project_repair_done_tt: "Состояние промысла: §G+30§!, с пожарными дружинами §G+45§!, не выше §Y100§!. Пропускная способность пересчитывается. Потеря промысла, выжигание или завершение ремонта другой службой возвращают задаток казны."
 NAM_project_refinery: "Построить промысловый завод"
 NAM_project_refinery_desc: "Инженеры размечают площадку для переработки топлива у промыслов. Строителям предстоит связать новые установки с дорогами, резервуарами и существующим хозяйством округа."
 NAM_project_refinery_done_tt: "Если промысел по-прежнему принадлежит нам и контролируется нами, в округе появляются место для постройки и §Yзавод синтетического топлива§!.\nПропускная способность промысла растёт на §G1§! только пока мы его контролируем.\nПри срыве строительства задаток возвращается в казну."
 NAM_project_pipeline: "Проложить Ключевский нефтепровод"
 NAM_project_pipeline_desc: "Трасса нефтепровода должна связать Сухоречье с Южной гаванью. Изыскатели проверяют переходы через реки, а строители договариваются о подъездах к насосным станциям."
 NAM_project_pipeline_done_tt: "Если Сухоречье и Южная гавань по-прежнему принадлежат нам и контролируются нами, нефтепровод готов.\nОн даёт §G+1§! пропускной способности только пока мы контролируем оба округа.\nПри срыве строительства задаток возвращается в казну."
 NAM_project_sea_terminal: "Построить морской терминал"
 NAM_project_sea_terminal_desc: "Портовые инженеры представили план нефтяного терминала Южной гавани. На причалах нужно согласовать работу танкеров, резервуаров и диспетчерских служб."
 NAM_project_terminal_done_tt: "Если Южная гавань по-прежнему принадлежит нам и контролируется нами, морской терминал готов.\nОн даёт место ещё для §G1§! топливного контракта, пока гавань под нашим контролем, и только с [VAL.GetName], [STP.GetName], [STS.GetName] или [RUS.GetName]. Контракт заключается решением §Y$NAM_oil_contract_offer$§!.\nПри срыве строительства задаток возвращается в казну."
 NAM_cost_project_repair: "§Y25§! £political_power_texticon §Y150§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_project_repair_blocked: "§R25§! £political_power_texticon §R150§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_project_repair_tooltip: "§Y25§! £political_power_texticon §Y150§! £ADISCORD_economy_treasury_texticon\nКазна возвращается, если работы будут прерваны."
 NAM_cost_project_refinery: "§Y40§! £political_power_texticon §Y300§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_project_refinery_blocked: "§R40§! £political_power_texticon §R300§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_project_refinery_tooltip: "§Y40§! £political_power_texticon §Y300§! £ADISCORD_economy_treasury_texticon\nКазна возвращается, если работы будут прерваны."
 NAM_cost_project_pipeline: "§Y35§! £political_power_texticon §Y350§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_project_pipeline_blocked: "§R35§! £political_power_texticon §R350§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_project_pipeline_tooltip: "§Y35§! £political_power_texticon §Y350§! £ADISCORD_economy_treasury_texticon\nКазна возвращается, если работы будут прерваны."
 NAM_cost_project_terminal: "§Y30§! £political_power_texticon §Y250§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_project_terminal_blocked: "§R30§! £political_power_texticon §R250§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_project_terminal_tooltip: "§Y30§! £political_power_texticon §Y250§! £ADISCORD_economy_treasury_texticon\nКазна возвращается, если работы будут прерваны."
 NAM_island_steel_levy: "Стальной сбор с островов"
 NAM_island_steel_levy_desc:0 "Стальные острова поставляют руду, но редко видят сборщика из столицы. Особая контора сведёт отгрузочные ведомости с казёнными счетами. Горняки уже готовят возражения."
 NAM_island_steel_levy_tt: "Каждый месяц Большой остров, Западный островной округ и Средний остров приносят по §G30§! £ADISCORD_economy_treasury_texticon, пока принадлежат нам и находятся под нашим контролем.\nНа время сбора местная добыча ресурсов: §R-15%§!, в том числе на концессионных месторождениях."
 NAM_island_convoy_service: "Островная конвойная служба"
 NAM_island_convoy_service_desc:0 "Погрузка руды и доставка припасов войдут в единое расписание. Судовладельцы выделят суда, а портовые службы согласуют обратные рейсы, чтобы поселения не оставались без снабжения."
 NAM_island_convoy_service_tt:0 "На принадлежащих нам и контролируемых нами островах добыча ресурсов: §G+15%§! на §Y180§! £time_texticon. Потеря острова, капитуляция или подчинение прекращают местное обслуживание."
 NAM_cost_convoy_service: "§Y25§! £political_power_texticon §Y150§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_convoy_service_blocked: "§R25§! £political_power_texticon §R150§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_convoy_service_tooltip: "§Y25§! £political_power_texticon §Y150§! £ADISCORD_economy_treasury_texticon\nЦена списывается при выборе."
 NAM_island_concession_231: "Стальная концессия Среднего острова"
 NAM_island_concession_231_desc:0 "На Среднем острове приезжие поверенные осматривают старые горные планы. Местный старшина указывает на участок, где ещё стоят дома рудокопов. Об этом месте в привезённых бумагах ничего не сказано."
 NAM_island_concession_231_tt: "Страна получает предложение и ответит в ближайшие дни. При согласии она платит §Y300§! £ADISCORD_economy_treasury_texticon и получает права на добычу Среднего острова.\nЭкспортные конторы: §G+6§! £NAM_support_trade_texticon."
 NAM_renegotiate_val_concession: "Пересмотреть кефрейтскую концессию"
 NAM_renegotiate_val_concession_desc: "Кефрейтским представителям предложат пересмотреть военную концессию Западного островного округа. Местные управы хотят ясного договора о том, кто распоряжается промыслами и отвечает перед жителями."
 NAM_renegotiate_val_concession_tt: "Кефрейт получает требование. Если он заплатит §Y300§! £ADISCORD_economy_treasury_texticon, концессия сохранится; если откажется, права на добычу вернутся к нам, а отношения с Кефрейтом ухудшатся."
 NAM_request_val_aid: "Просить помощи Кефрейта за концессию"
 NAM_request_val_aid_desc: "Правительство направляет Кефрейту предложение о военной помощи. На переговорах будут обсуждать островные промыслы и обязательства, которые стороны готовы принять."
 NAM_request_val_aid_paid: "Просить помощи Кефрейта за плату"
 NAM_request_val_aid_paid_desc: "Поверенные отправляются в Кефрейт с предложением оплатить военную помощь. Делегации предстоит согласовать состав поставок и порядок расчётов."
 NAM_val_aid_fee_tt: "В казне не меньше §Y400§! £ADISCORD_economy_treasury_texticon"
 NAM_south_allied_fuel: "Топливо союзникам Юга"
 NAM_south_allied_fuel_desc: "Союзные штабы согласуют заявку на горючее. Наши снабженцы подготовят документы и назначат представителей для передачи партии."
 NAM_south_allied_fuel_tt: "Только [FROM.GetName] получает §G25000§! £fuel_texticon и §G+2%§! £war_support_modifiericons_texticon. С нашего склада списывается ровно §Y25000§! £fuel_texticon."
 NAM_south_convoy_interdiction: "Перехват конвоев Шахрабада"
 NAM_south_convoy_interdiction_desc: "Охотники за конвоями выходят на маршруты танкеров и барж, питающих печи Шахрабада. Штурманы сверяют сведения о переходах, охранении и местах встречи грузовых судов."
 NAM_cost_convoy_interdiction: "§Y20§! £political_power_texticon §Y2000§! £fuel_texticon"
 NAM_cost_convoy_interdiction_blocked: "§R20§! £political_power_texticon §R2000§! £fuel_texticon"
 NAM_cost_convoy_interdiction_tooltip: "§Y20§! £political_power_texticon §Y2000§! £fuel_texticon\nЦена списывается при выборе."
 ADISCORD_nam_debug_damage_fields: "§RDEBUG:§! Повредить промыслы Светлогорья"
 ADISCORD_nam_debug_damage_fields_desc: "Канцелярия готовит особое распоряжение. Ответственные служащие ждут подписи и печати."

 ADISCORD_nam_oil.1.t: "Светлогорское топливо"
 ADISCORD_nam_oil.1.d: "Торговый представитель Светлогорья привёз проект контракта. Светлогорье предлагает ежемесячные поставки топлива со своих промыслов - по 15000 £fuel_texticon каждый месяц, пока договор в силе и пока между нами нет войны.\n\nПромыслы Светлогорья дают большую часть нефти Юга, и в министерствах понимают, что от этого контракта будет трудно отказаться позже. Подпись даст топливо сейчас, но поставит наши склады в зависимость от решений Егора Рома."
 ADISCORD_nam_oil.1.a: "Обойдёмся без светлогорской нефти."
 ADISCORD_nam_oil.1.b: "Подписать контракт."
 NAM_oil_1_a_tt: "Контракт не заключается. Светлогорье больше не будет предлагать нам топливный контракт."
 NAM_oil_1_b_tt: "Каждый месяц мы получаем §G15000§! £fuel_texticon, если у Светлогорья есть свободная пропускная способность и топливо на складе.\nВойна со Светлогорьем оборвёт поставки и вызовет на §Y90 дней§! нехватку топлива."
 ADISCORD_nam_oil.2.t: "Ответ покупателя"
 ADISCORD_nam_oil.2.d_signed: "[FROM.GetNameDefCap] подписывает контракт. Первые цистерны уходят с промыслов в ближайший месяц, а в портовых конторах уже считают выручку.\n\nКаждый контракт занимает часть пропускной способности промыслов, но делает соседей заинтересованными в том, чтобы светлогорская нефть продолжала течь."
 ADISCORD_nam_oil.2.d_lapsed: "[FROM.GetNameDefCap] соглашается на контракт, но к моменту подписания у промыслов не осталось свободной пропускной способности. Конторы извиняются за задержку и обещают вернуться к разговору, когда трубы освободятся."
 ADISCORD_nam_oil.2.d_refused: "[FROM.GetNameDefCap] отказывается от контракта. В министерствах предпочитают не связывать свои склады со Светлогорьем - по крайней мере сейчас."
 ADISCORD_nam_oil.2.a: "Принято к сведению."
 ADISCORD_nam_oil.4.t: "Сталь Среднего острова"
 ADISCORD_nam_oil.4.d: "Светлогорье предлагает права на добычу стали на Среднем острове. Рудники остаются под светлогорским флагом, но вся их добыча пойдёт нам. Цена - 300 £ADISCORD_economy_treasury_texticon единовременно.\n\nКонцессия действует, пока остров принадлежит Светлогорью и между нами нет войны."
 ADISCORD_nam_oil.4.a: "Отказаться."
 ADISCORD_nam_oil.4.b: "Купить концессию."
 NAM_oil_4_a_tt: "Концессия не заключается. Светлогорье больше не будет предлагать нам эту концессию."
 NAM_oil_4_b_tt: "Казна: §R-300§! £ADISCORD_economy_treasury_texticon.\nМы получаем права на добычу §YСреднего острова§!."
 ADISCORD_nam_oil.5.t: "Ответ о концессии"
 ADISCORD_nam_oil.5.d_signed: "[FROM.GetNameDefCap] покупает стальную концессию Среднего острова. Деньги уже в казне, а на рудниках вывешивают новые списки смен."
 ADISCORD_nam_oil.5.d_refused: "[FROM.GetNameDefCap] отказывается от стальной концессии. Рудники Среднего острова продолжают работать на Светлогорье."
 ADISCORD_nam_oil.5.a: "Принято к сведению."
 ADISCORD_nam_oil.6.t: "Новые условия концессии"
 ADISCORD_nam_oil.6.d: "Канцелярия Светлогорья требует пересмотреть концессию на Западном островном округе. Договор, заключённый во время войны, больше не устраивает признанное государство: Светлогорье требует единовременного платежа в 300 £ADISCORD_economy_treasury_texticon. Отказ означает расторжение концессии.\n\nВ Кефрейте понимают, что спорить с хозяином острова можно лишь до определённого предела."
 ADISCORD_nam_oil.6.a: "Заплатить и сохранить концессию."
 ADISCORD_nam_oil.6.b: "Отказаться от новых условий."
 ADISCORD_nam_oil.close: "Вопрос уже решён."
 NAM_oil_6_a_tt: "Казна: §R-300§! £ADISCORD_economy_treasury_texticon.\nПрава на добычу в §YЗападном островном округе§! сохраняются."
 NAM_oil_6_b_tt: "Концессия расторгается: права на добычу возвращаются Светлогорью.\nНаше отношение к Светлогорью ухудшается."
 ADISCORD_nam_oil.7.t: "Ответ Кефрейта"
 ADISCORD_nam_oil.7.d_paid: "Кефрейт принял новые условия и перевёл деньги. Концессия на Западном островном округе продолжает действовать, но теперь её цену определяет Светлогорье."
 ADISCORD_nam_oil.7.d_revoked: "Кефрейт отказался платить. Концессия расторгнута, рудники Западного островного округа снова работают на Светлогорье. Наместники считают это восстановлением справедливости, в Кефрейте - оскорблением."
 ADISCORD_nam_oil.7.a: "Принято к сведению."
 ADISCORD_nam_oil.10.t: "Нефть для коалиции"
 ADISCORD_nam_oil.10.d: "Война с Землёй Хана идёт на нескольких фронтах, и у каждого союзника в штабе висит одна и та же сводка расхода топлива. Посланники коалиции спрашивают Светлогорье прямо: будет ли его нефть общей?\n\nНефтяники советуют назвать цену - другого такого момента не будет. Офицеры напоминают, что без топлива союзников армии Хана придут и к промыслам Светлогорья. Экспортные конторы предлагают обычные контракты: топливо в обмен на деньги, по правилам, которые союзники уже знают."
 ADISCORD_nam_oil.10.a: "Сначала доля Светлогорья."
 ADISCORD_nam_oil.10.b: "Заправить коалицию."
 ADISCORD_nam_oil.10.c: "Предложить союзникам контракты."
 ADISCORD_nam_oil.10.close:0 "Снять вопрос с повестки."
 ADISCORD_nam_oil.11.t:0 "Грузовики за топливо"
 ADISCORD_nam_oil.11.d:0 "Светлогорская контора прислала две накладные. По первой к нашим хранилищам пойдут цистерны с 30 000 единиц топлива. По второй мы передадим водителям из Светлогорья сто грузовиков.\n\nНачальник снабжения разложил рядом две сводки: сколько дней наши части ещё могут идти на запасах горючего и сколько машин останется на дорогах, если мы подпишем обе бумаги."
 ADISCORD_nam_oil.11.a:0 "Отказаться от обмена и дальнейших предложений."
 ADISCORD_nam_oil.11.b:0 "Подписать обе накладные."
 ADISCORD_nam_oil.11.c:0 "Закрыть предложение. Обмен уже невозможен."
 ADISCORD_nam_oil.11.result_tt:0 "Наши хранилища получат из Светлогорья §G30000§! £fuel_texticon. Светлогорье получит с наших складов §Y100§! £motorized_texticon. Отношения улучшатся."
 NAM_oil_10_a_tt: "Нефтяники: §G+6§! £NAM_support_oil_texticon\nЭкспортные конторы: §G+6§! £NAM_support_trade_texticon\nОтношение союзников по коалиции к нам ухудшается."
 NAM_oil_10_b_tt: "Пока у Светлогорья хватает запасов, каждый действующий участник обороны со свободным местом в хранилищах получит §G30000§! £fuel_texticon за наш счёт.\nОтношения с получателями улучшатся.\nМежду рейсами топлива в одну страну должно пройти §Y45§! £time_texticon."
 NAM_oil_10_c_tt: "Союзники по коалиции из числа наших покупателей получают предложение топливного контракта. Каждый контракт по-прежнему требует свободной пропускной способности."
 NAM_oil_buyer_eligible_tt: "Страна не воюет с нами, ещё не покупает наше топливо, не ждёт ответа на другое наше предложение, не находится под нашим эмбарго и не получает топливо по договору с нами"
 NAM_concession_231_free_tt: "Средний остров принадлежит нам и контролируется нами; концессия никому не продана и не ждёт ответа; страна не воюет с нами"
 NAM_val_renegotiation_free_tt: "Кефрейт ещё не ответил на прежнее требование"
 NAM_south_blockade_free_tt: "Предыдущий перехват конвоев Шахрабада уже закончился"

