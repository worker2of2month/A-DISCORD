 NAM_Lev_Gavanov_advisor: "Лев Корнилов"
 NAM_Taras_Shtyk_advisor: "Тарас Дроздов"
 NAM_Vera_Pechat_advisor: "Вера Сабурова"
 NAM_Nadezhda_Okrug: "Надежда Ладыгина"
 NAM_Kirill_Vykup: "Кирилл Мезенцев"
 NAM_Yaroslav_Veter: "Ярослав Ветер"
 NAM_Gleb_Burov: "Глеб Буров"
 NAM_Anton_Zhar: "Антон Зимин"
 NAM_Matvei_Prichal: "Матвей Северцев"
 NAM_Grigory_Levashov: "Григорий Левашов"
 NAM_Egor_Rom_desc: "Егор Ром начинал писарем ключевской управы и поднялся по лестнице печатей до наместника всего Светлогорья. Он знает цену каждой подписи и помнит, сколько бочек нефти стоила каждая из них. Его власть держится не на любви, а на том, что без него бумаги перестают двигаться."
 NAM_Arseny_Klyuch_advisor_desc: "Наместник Ключевска и хозяин крупнейших промыслов. Говорит от имени нефтяников, но считает их выручку своей."
 NAM_Lev_Gavanov_advisor_desc: "Начальник Южной гавани и заморских округов. Знает каждого капитана и каждого покупателя за морем."
 NAM_Taras_Shtyk_advisor_desc: "Комендант гарнизонов. Солдаты верят ему больше, чем канцелярии, и он этого не скрывает."
 NAM_Vera_Pechat_advisor_desc: "Старший регистратор печатей. Через её реестр проходит каждое назначение наместника."
 NAM_Arseny_Klyuch_leader_desc: "Арсений Тарханов взял власть от имени промыслов. Теперь нефть Ключевска - государственная казна, а государственная казна - его касса."
 NAM_Lev_Gavanov_leader_desc: "Лев Корнилов правит из Южной гавани. Он обещает Светлогорью торговлю со всем миром и ждёт за это послушания."
 NAM_Taras_Shtyk_leader_desc: "Тарас Дроздов привёл гарнизоны в канцелярию. Его порядок прост: приказ, исполнение, отчёт коменданту."
 NAM_Vera_Pechat_leader_desc: "Вера Сабурова знает, где лежит каждая печать Светлогорья. Теперь все они хранятся в её реестре."
 NAM_Nadezhda_Okrug_desc: "Надежда Ладыгина председательствует в совете округов. Её власть ограничена хартией и держится на согласии районов."
 NAM_Kirill_Vykup_desc: "Кирилл Мезенцев много лет сводил ведомости канцелярии. Теперь он руководит союзом нефтяных районов, где каждая бочка учтена в общем договоре."
