 ADISCORD_nam_story.4.t:0 "Держава опор"
 ADISCORD_nam_story.4.d:0 "В зале бывшей таможни, где когда-то взвешивали руду, теперь висит одна карта - от островов до пустыни. Флажки на ней ставит адъютант Карамышева: каждое утро новые гарнизоны, новые реквизиционные команды, новые лагеря. Старые флажки никто не снимает.\n\nКарамышев выполнил всё, что обещал на совете после бегства. Промыслы вернулись, соседи заплатили, а острова, где не было ни нефти, ни заводов, правят теперь всем Югом. Он не обещал ничего другого и никогда не делал вид, что обещал.\n\nВечером в порту гремит салют. В покорённых городах в это время закрывают ставни. Капитаны флотилий пьют за тех, кто остался на причалах Южной гавани, а квартирмейстеры уже составляют новые списки - теперь тех, кто будет работать на промыслах державы."
 ADISCORD_nam_story.4.a:0 "Держава опор стоит."
 ADISCORD_nam_story.11.t:0 "Кабинет в таможне"
 ADISCORD_nam_story.11.d:0 "Первое заседание правительства Ярослава Вебера прошло в той же таможне, где совет решал судьбу печатей. Стулья остались прежние, карты материка тоже. Вебер сел не во главе стола, а сбоку, у окна, - по старой привычке человека, который годами слушал чужие речи из коридора.\n\nПервым вопросом стали служащие. На острова с последними транспортами ушла почти вся канцелярия: регистраторы, счётчики, начальники отделов, которые умеют выписать паёк, оформить судно и найти нужную печать. Многие из них подписывали приказы об арестах подполья. Товарищи Вебера по листовкам и складам требуют убрать их из министерств и поставить своих - людей, которые не знают бумаг, но знают, ради чего вернутся.\n\nБанкиры из гостиницы у причала тоже ждут ответа: со старыми служащими им проще договориться о бумагах. Вебер слушал всех и вспоминал, сколько раз его прошения возвращали за неправильное оформление."
 ADISCORD_nam_story.11.a:0 "Оставить старых служащих."
 ADISCORD_nam_story.11.b:0 "Поставить людей из подполья."
 NAM_story_11_a_tt:0 "Поддержка групп:\n  Наместники: §G+5§! £NAM_support_nam_texticon\n  Округа: §R-3§! £NAM_support_dist_texticon"
 NAM_story_11_b_tt:0 "Поддержка групп:\n  Округа: §G+6§! £NAM_support_dist_texticon\nВлияние корпораций: §G-5§!."
 ADISCORD_nam_story.12.t:0 "Письмо из Светлогорска"
 ADISCORD_nam_story.12.d:0 "Письмо пришло с рыбацкой шхуной, зашитое в подкладку куртки. Почерк Вебер узнал раньше подписи: так писала наборщица из подвальной типографии на улице Ремесленников, где когда-то печатали первые листовки. Она осталась в городе, когда пришли эфлорские патрули, и не уехала до сих пор.\n\nПросьб в письме нет. Она пишет, что у эфлорской комендатуры теперь те же списки, что раньше были у жандармерии, что на промыслах платят в чужой монете, а в школах учат, что Светлогорье было колонией и больше ничем. Город ждёт, но не любого возвращения. Если гуманисты придут на деньги иностранных правлений, люди решат, что их просто перепродали третьему хозяину.\n\nВ конце она приписала: \"Ты обещал, что промыслы будут принадлежать тем, кто на них работает. Мы помним листовку. Помнишь ли её ты?\"\n\nСоветники предлагают прочесть письмо без подписи в передаче для материка. Вебер держит его в руках и думает, что отвечать нужно не в эфир, а ей."
 ADISCORD_nam_story.12.a:0 "Ответить ей обещанием."
 ADISCORD_nam_story.12.b:0 "Прочесть письмо для материка."
 NAM_story_12_a_tt:0 "Готовность к возвращению: §G+5§!.\nВлияние корпораций: §G-5§!."
 NAM_story_12_b_tt:0 "Поддержка групп:\n  Округа: §G+5§! £NAM_support_dist_texticon"
 ADISCORD_nam_story.13.t:0 "Прошения с улицы Ремесленников"
 ADISCORD_nam_story.13.d:0 "Комиссия правды начала с архива наместников, который вывезли на острова в последнюю ночь и вернули на материк вместе с армией. Работали по описи: входящие, ответы управлений, повторные обращения, дела о подполье. На третий день секретарь комиссии принёс Веберу тонкую папку. На обложке стояла его собственная фамилия.\n\nВнутри лежали прошения, которые он юношей носил в канцелярию от своей улицы: о воде, о выплате за увечье на промысле, о закрытой школе. На каждом - отметка о передаче в отдел. Ответов не было. На последнем листе чужим аккуратным почерком написано: \"Ответ подготовить. Кто принимал?\" Ниже - подпись Егора Рома и дата, когда Вебер уже числился в розыске.\n\nНа следующий день в комиссию пришла записка от самого Рома: он готов дать показания о работе канцелярии и просит не выделять его дело из общего. Члены комиссии спорят. Одни требуют публиковать всё подряд, включая папку председателя правительства. Другие предлагают открыть дела наместников, а дела рядовых служащих закрыть, чтобы в округах было кому работать."
 ADISCORD_nam_story.13.a:0 "Опубликовать всё, и мою папку тоже."
 ADISCORD_nam_story.13.b:0 "Открыть дела наместников."
