 NAM_mil_mobile_operation:0 "Манёвр мобильных колонн"
 NAM_mil_mobile_open_tt:0 "Независимое Светлогорье ведёт войну и способно управлять войсками"
 NAM_mil_mobile_surge_desc:0 "Штаб собирает подвижные колонны у намеченных дорог. Командиры сверяют маршруты, а службы горючего готовят машины к долгому переходу."
