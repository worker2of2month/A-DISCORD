 NAM_bw_summary_text:0 "Пропускная способность: §Y[?NAM_oil_throughput|0]§! ед., занято §Y[?NAM_oil_committed|0]§!: контрактов §Y[?NAM_oil_contracts|0]§![NAMBasinTribute].\nСвободно: на суше §Y[?NAM_oil_free_land_units|0]§!, для заморских покупателей §Y[?NAM_oil_free_units|0]§!.\nПокупатели: [NAMBasinClientsNone][EFL.NAMBasinClient][AZH.NAMBasinClient][VAL.NAMBasinClient][STP.NAMBasinClient][STS.NAMBasinClient][RHM.NAMBasinClient][MZR.NAMBasinClient][SHL.NAMBasinClient][RUS.NAMBasinClient][WEF.NAMBasinClient][KDR.NAMBasinClient][SDR.NAMBasinClient][GLP.NAMBasinClient][KYZ.NAMBasinClient]\nЭмбарго: [NAMBasinEmbargoNone][EFL.NAMBasinEmbargo][AZH.NAMBasinEmbargo][SHL.NAMBasinEmbargo]\nОстрова: стальной сбор - [NAMBasinLevy]; конвойная линия - [NAMBasinConvoy]; концессия [231.GetName] - [NAMBasinConcession231]."
 NAM_bw_summary_tt:0 "Одна единица пропускной способности - одна постоянная поставка. Контракт каждый месяц даёт покупателю §Y1500§! £fuel_texticon, а казне - §G40§! £ADISCORD_economy_treasury_texticon; месяц без топлива на складе пропускает поставку и оплату. Морской терминал Южной гавани обслуживает только заморских покупателей. Контракты, эмбарго и острова управляются в своих разделах решений.\nЭкспортная диспетчерская даёт ещё §G+30§! £ADISCORD_economy_treasury_texticon за каждую выполненную месячную поставку на время её работы."
