 NAM_mil_command_course_refund_tt:0 "§G+150§! £ADISCORD_economy_treasury_texticon."
 NAM_mil_command_course_desc:0 "Цена: §Y35§! £political_power_texticon §Y150§! £ADISCORD_economy_treasury_texticon. Срок: §Y21§! £time_texticon дн. Повтор через §Y90§! £time_texticon дн. после завершения.\n\nКомандиры отработают передачу приказов, взаимодействие частей и распределение снабжения.\n§G+25§! £army_experience, §G+20§! £command_power_texticon.\n\nПри капитуляции, подчинении или утрате условий заказа вся оплата возвращается. Начало и завершение войны сами по себе заказ не отменяют. Поставка поступает Светлогорью."
 NAM_mil_field_security:0 "Ввести усиленную охрану промыслов"
 NAM_mil_security_operable_tt:0 "Независимое Светлогорье удерживает хотя бы один нефтяной округ"
 NAM_mil_field_security_result_tt:0 "На §Y90§! £time_texticon дн. ущерб состоянию собственных контролируемых промыслов от событий пожаров и диверсий уменьшается на §G50%§!. Не защищает от потери территории, выжигания и обычного разрушения зданий."
 NAM_mil_field_security_desc:0 "Цена: §Y35§! £political_power_texticon. Работа: §Y90§! £time_texticon дн. Повтор через §Y30§! £time_texticon дн. после завершения.\n\nОхрана остаётся на местах: максимальная укреплённость §G+2§!, расход снабжения §G-5%§!, скорость армии §R-5%§!. $NAM_mil_field_security_result_tt$\n\nКапитуляция, подчинение или потеря всех промыслов прекращают охрану без возврата оплаты."
 NAM_mil_mobile_surge_cost:0 "§Y40§! £political_power_texticon §Y3000§! £fuel_texticon"
 NAM_mil_mobile_surge_cost_blocked:0 "§R40§! £political_power_texticon §R3000§! £fuel_texticon"
 NAM_mil_mobile_surge_cost_tooltip:0 "§Y40§! £political_power_texticon §Y3000§! £fuel_texticon"
 NAM_mil_mobile_surge:0 "Сосредоточить мобильный резерв"
 NAM_mil_mobile_operation:0 "Манёвр мобильных колонн"
 NAM_mil_mobile_open_tt:0 "Независимое Светлогорье ведёт войну и способно управлять войсками"
 NAM_mil_mobile_surge_desc:0 "Цена: §Y40§! £political_power_texticon §Y3000§! £fuel_texticon. Операция: §Y30§! £time_texticon дн. Повтор через §Y60§! £time_texticon дн.\n\nСосредоточьте силы для переброски или контрудара: скорость армии §G+10%§!, скорость планирования §G+25%§!. На время операции расход топлива армии растёт на §R15%§!, расход снабжения на §R5%§!.\n\nДоступно во время войны. Мир, капитуляция или подчинение прекращают операцию и её модификатор без возврата уже израсходованной оплаты."
 NAM_mil_forward_supply_cost:0 "§Y25§! £political_power_texticon §Y150§! £ADISCORD_economy_treasury_texticon §Y60§! £support_equipment_texticon"
