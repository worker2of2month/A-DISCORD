 NAM_exile_pillar_junta_desc: "Гарнизоны, нефтяные артели и портовые конторы правят островами как военным лагерем. Всё служит возвращению: люди, корабли и добыча."
 NAM_exile_free_islands: "Свободные острова"
 NAM_exile_free_islands_desc: "Правительство Ярослава Вебера открыло острова для чужих денег и для своих граждан. Здесь больше спорят и меньше маршируют."
 # Humanist exile: corporations and free zones
 NAM_free_zones:0 "[NAMBoardCategoryTitle]"
 NAM_free_zones_desc:0 "[NAMBoardCategoryReport]"
 NAM_board_exile_title: "Свободные зоны"
 NAM_board_exile_report: "§YИностранный капитал:§! §Y[?NAM_corp_capital|0]§!, доход за прошлый месяц §G+[?NAM_corp_last_income|0]§!.\nВлияние корпораций: §Y[?NAM_corp_influence|0]§! / 100, изменение за месяц §Y[?NAM_corp_last_drift|0]§! - [NAMGetCorpBand]\nСвободные зоны: §Y[?NAM_free_zones_active|0]§! из §Y[?NAM_free_zone_slots|0]§!, на переговорах §Y[?NAM_free_zones_pending|0]§!.\n\nКаждая свободная зона приносит в месяц §Y20§! капитала и ещё §Y0.3§! за каждый пункт влияния, освобождает инвесторов от налогов (сбор налогов §R-3%§!) и каждый месяц поднимает влияние на §Y1§!, а правительство само сбивает его на §Y1§!.\n\nДо §Y30§! инвесторы платят мало;\nс §Y30§! влияние приносит исследования, эффективность и торговлю;\nс §Y70§! стоит стабильности и политической власти;\nс §Y90§! правления требуют печатей.\n\nТри месяца с влиянием от §Y90§! или §Y100§! сразу - и корпорации возьмут власть."
 NAM_board_corporate_title:0 "Совет правлений и концессии"
 NAM_board_government_report:0 "Иностранный капитал §Y[?NAM_corp_capital|0]§!.\nНачислено за прошлый месяц: свободные зоны §G+[?NAM_corp_last_income|0]§!, дивиденды округов §G+[?NAM_corp_last_dividend|0]§!.\nСвободные зоны §Y[?NAM_free_zones_active|0]/[?NAM_free_zone_slots|0]§!, на согласовании §Y[?NAM_free_zones_pending|0]§!.\nНаведите курсор на компанию, чтобы увидеть её представителя, должность и вклад в промышленность."
 NAM_board_chair_caption:0 "§YПредседатель совета§!"
 NAM_board_election_rules:0 "Отрасль даёт §Y3§! голоса, бесспорный подчинённый округ §Y2§!, министр §Y1§!.\nПредседателем становится компания с наибольшим числом голосов.\nПри равенстве побеждает компания, учреждённая раньше.\n$NAM_board_industry_rules$\nПосле назначения или отставки министра голоса и эффекты обновляются в течение игрового часа."
 NAM_board_industry_rules:0 "Каждая отрасль даёт компании один уровень.\nБесспорный подчинённый округ гарантирует хотя бы один уровень.\nПредседатель получает ещё один уровень, если у него есть отрасль или такой округ.\n\nС министром действует полный эффект.\n\nКомпания с отраслью или бесспорным округом, оставшаяся без министра, 30 дней нейтральна, затем объявляет бойкот.\nОба эффекта меняют знак и действуют вполовину силы.\nНазначение представителя прекращает бойкот."
 NAM_board_industrial_policy:0 "Промышленная политика правлений"
 NAM_board_industrial_policy_desc:0 "Казённые предприятия работают по заказам государства. Компании, чьи директора вошли в кабинет, согласуют с ними заводские смены, стройки и загрузку верфей. Правление, которое долго не допускают к переговорам, может остановить работы.\n\nЭффект действует при независимом корпоративном правительстве. Итог зависит от действующих активов, мест директоров в кабинете и бойкотов."
 NAM_board_sector_heading:0 "§YРеестр отраслей§!"
 NAM_board_chartered_caption:0 "§YПервоначальные концессии§!"
 NAM_board_tenders_caption:0 "§YОбъекты приватизации§!"
 NAM_board_assets_rules:0 "Три отрасли распределены при учреждении совета. Мастерские, верфи и склады дают стране собственные промышленные преимущества до приватизации. Продажа передаёт отрасль и её голоса покупателю навсегда."
