 NAM_advisor_pechat_available_tt:0 "Вера Печать не устранена из политической борьбы и не возглавляет государство"
 NAM_board_advisor_strength_tt:0 "Уровень равен числу отраслей компании; если есть только бесспорные округа - §Y1§!. Первое место в совете добавляет §Y1§! уровень при наличии активов. Без активов промышленного бонуса нет."
 NAM_board_appointment_1_tt:0 "При независимом правлении корпораций, пока министр назначен:\n§Y$NAM_corp_name_1$§! получает §G+1§! голос и не бойкотирует правительство.\nЗа каждый уровень: Выпуск военных заводов §G+1%§!; скорость строительства §G+2%§!.\n\n$NAM_board_advisor_strength_tt$"
 NAM_board_appointment_2_tt:0 "При независимом правлении корпораций, пока министр назначен:\n§Y$NAM_corp_name_2$§! получает §G+1§! голос и не бойкотирует правительство.\nЗа каждый уровень: Выпуск военных заводов §G+2%§!; прирост производственной эффективности §G+3%§!.\n\n$NAM_board_advisor_strength_tt$"
 NAM_board_appointment_3_tt:0 "При независимом правлении корпораций, пока министр назначен:\n§Y$NAM_corp_name_3$§! получает §G+1§! голос и не бойкотирует правительство.\nЗа каждый уровень: Выпуск верфей §G+3%§!; скорость строительства верфей §G+3%§!.\n\n$NAM_board_advisor_strength_tt$"
 NAM_board_appointment_4_tt:0 "При независимом правлении корпораций, пока министр назначен:\n§Y$NAM_corp_name_4$§! получает §G+1§! голос и не бойкотирует правительство.\nЗа каждый уровень: Выпуск военных заводов §G+3%§!; предел производственной эффективности §G+1%§!.\n\n$NAM_board_advisor_strength_tt$"

 # Political group help topics
 NAM_bw_balance_hint:0 "Баланс"
 NAM_bw_support_agreements_hint:0 "Соглашения"
 NAM_bw_support_contracts_hint:0 "Договоры"
 NAM_bw_support_crisis_hint:0 "Кризисы"
 NAM_bw_support_agreements_tt:0 "§YСОГЛАШЕНИЯ С ОПОРАМИ§!\nПредложения проверяются ежемесячно в независимом Светлогорье без войны. Первое возможно через §Y90§! £time_texticon после независимости.\nИз двух проектов выбирается один; одновременно действует одно соглашение.\n\n§YСРОК И ИСХОД§!\nНа выполнение: §Y180§! £time_texticon.\nУспех: §G+15§! поддержки выбранной опоры и её бонус на §Y365§! £time_texticon.\nСрыв: §R-20§! поддержки и штраф на §Y180§! £time_texticon; ниже §Y25§! поддержки открывается кризис.\nОтказ от обоих: по §R-5§! поддержки предложившим опорам.\n\nПосле закрытия соглашения, отказа или урегулирования - пауза §Y300§! £time_texticon для новых предложений и кризисов.\nВойна, капитуляция или подчинение закрывают соглашение без штрафа. Оплаченные незавершённые ревизия, обучение и окружная стройка возвращают оплату; готовые результаты сохраняются. Обычное бурение следует своим условиям."
 NAM_bw_support_contracts_tt:0 "§YДОГОВОРЫ СОВЕТА ОПОР§!\nФокус §YСовет опор§! открывает пять оплачиваемых заказов: топливо, импорт техники, арсенал, набор людей и окружные мастерские.\n\nЗавершённая поставка даёт соответствующей опоре §G+12§! поддержки. При отмене возвращается оплата. Повторный заказ - через §Y120§! £time_texticon после завершения.\nЦены, сроки и состав поставок показаны в решениях.\n\n§YМИЛОСТИ ОПОР§!\nЭто отдельные решения за поддержку. Их доступность, цена и срок действия указаны на карточках групп."
 NAM_bw_support_crisis_tt:0 "§YКРИЗИС ДОВЕРИЯ§!\nВ мирном независимом Светлогорье поддержка ниже §Y25§! и проблема, указанная на карточке опоры, могут вызвать кризис при ежемесячной проверке. Он не начинается во время другого соглашения, переговоров или общей паузы.\nСрыв обещания также открывает кризис, если поддержка после потери осталась ниже §Y25§!.\n\n§YКАК ЗАКРЫТЬ§!\nЗа §Y90§! £time_texticon восстановить поддержку до §Y40§! либо оплатить урегулирование. Действующий штраф за срыв сохраняет свой срок.\n\n§RЕСЛИ СРОК ИСТЁК§!\n§R-10%§! £stability_texticon и §R-50§! £political_power_texticon.\nПри поддержке ниже §Y25§! неуслышанный и неустранённый соперник может оспорить власть, пока строй не закреплён и власть ещё не захвачена переворотом. У округов такого соперника нет.\nПосле закрытия: пауза §Y300§! £time_texticon."
 NAM_bw_ladder_course_forecast:0 "\n\n§YКУРС К НАЧАЛУ ВОЙНЫ§!\nСейчас: §Y[NAMGetPrewarCourse]§!.\nНиже §Y-25%§! - этатизм; выше §Y+25%§! - гуманизм; от §Y-25%§! до §Y+25%§! включительно - прагматизм. Начало ресурсной войны закрепляет послевоенную ветку. Ром следует этому курсу; иной правитель сохраняет власть."
 ADISCORD_nam_debug_add_tension_description_rules_tt:0 "Приближает текущий срок войны на 30 дней и проверяет предупреждения."
 ADISCORD_nam_debug_damage_fields_description_rules_tt:0 "Снижает состояние Северных месторождений и Южнобережного округа на 40 и пересчитывает нефтяную пропускную способность. Учитывает действующую усиленную охрану собственных контролируемых промыслов: она уменьшает ущерб вдвое."
 ADISCORD_nam_debug_rival_demand_description_rules_tt:0 "Сбрасывает перерыв цикла соперников и сразу проверяет, может ли соперник слабейшей опоры выдвинуть требование."
 ADISCORD_nam_debug_underground_description_rules_tt:0 "Добавляет 30 к силе подполья Ярослава Вебера."
 ADISCORD_nam_debug_war_of_return_description_rules_tt:0 "Вызывает производственный запуск войны возвращения. Если её условия не выполнены, в том числе пока идёт дань, ничего не произойдёт."
 NAM_incident_timeout_firefighters:0 "Пожарные команды ликвидируют аварию без потерь. Страховое возмещение и чрезвычайный фонд сохраняются."
 NAM_incident_timeout_insurance:0 "$NAM_industrial_claim_used_tt$\nПотерь не будет; чрезвычайный фонд сохранится."
 NAM_incident_timeout_pensions:0 "$NAM_garrison_families_paid_tt$\nПотерь не будет; чрезвычайный фонд сохранится."
 NAM_incident_timeout_fund:0 "Чрезвычайный фонд расходуется целиком и закрывает происшествие без потерь."
 NAM_incident_timeout_fire:0 "§R-8000§! £fuel_texticon.\n$NAM_crisis_1_b_tt$"
 NAM_incident_timeout_strike:0 "§R-3%§! £stability_texticon.\n$NAM_crisis_2_b_tt$"
