 NAM_mil_arsenal_batch_delivered_tt:0 "§G+60§! £artillery_texticon, §G+36§! £anti_tank_texticon, §G+36§! £anti_air_texticon."
 NAM_mil_arsenal_batch_result_tt:0 "Через §Y28§! £time_texticon дн.: §G+60§! £artillery_texticon, §G+36§! £anti_tank_texticon, §G+36§! £anti_air_texticon."
 NAM_mil_arsenal_batch_refund_tt:0 "§G+250§! £ADISCORD_economy_treasury_texticon."
 NAM_mil_arsenal_batch_desc:0 "Цена: §Y35§! £political_power_texticon §Y250§! £ADISCORD_economy_treasury_texticon. Срок: §Y28§! £time_texticon дн. Повтор через §Y90§! £time_texticon дн. после завершения.\n\nВоенные цеха Южной гавани изготовят орудия для усиления частей. Нужны контроль гавани и сохранившийся военный завод.\n§G+60§! £artillery_texticon, §G+36§! £anti_tank_texticon, §G+36§! £anti_air_texticon.\n\nПри капитуляции, подчинении или утрате условий заказа вся оплата возвращается. Начало и завершение войны сами по себе заказ не отменяют. Поставка поступает Светлогорью."
