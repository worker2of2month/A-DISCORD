 NAM_wrk_concession_started_tt: "Казна: §R-200§! £ADISCORD_economy_treasury_texticon; задаток вернётся, если переговоры прервутся."
 NAM_wrk_concession_signed_tt: "Концессия подписана: §G+[?NAM_wrk_trade_weekly_income|2]§! £ADISCORD_economy_treasury_texticon в недельном доходе экономики, пока существует метрополия. Это соответствует §Y[?NAM_wrk_trade_income|0]§! в месяц."
 NAM_wrk_concession_refund_tt: "Переговоры прерваны: §G200§! £ADISCORD_economy_treasury_texticon возвращаются в казну. Политическая власть не возвращается."
 NAM_wrk_concession_status_active: "§Gподписана§!: §Y[?NAM_wrk_trade_weekly_income|2]§! £ADISCORD_economy_treasury_texticon в неделю через экономику (§Y[?NAM_wrk_trade_income|0]§! в месяц)."
 NAM_wrk_concession_status_talks: "§Yидут переговоры§!."
