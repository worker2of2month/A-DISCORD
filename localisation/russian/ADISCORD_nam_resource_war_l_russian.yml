 NAM_colony: "Колония Воркерланда"
 NAM_colony_desc: "Светлогорье остаётся нефтяной колонией метрополии.\n\n§YТОРГОВЛЯ С МЕТРОПОЛИЕЙ§!\nТорговые дома: §Y[?NAM_wrk_trade_level|0] / 3§! £NAM_support_trade_texticon\nКонцессия: [NAMGetWrkConcession][NAMGetHiddenReserve]\n\n§YБЕЗОПАСНОСТЬ КОЛОНИИ§!\nПодполье Вебера: §Y[?NAM_underground|0] / 100§! £operatives_boost_resistance_texticon\nОблавы жандармерии ослабляют сеть, но снижают поддержку округов.\nРост, угрозы и способы противодействия - в разделе \"$NAM_underground$\".\n\n§RВЫВОЗ ПРИ РАСПАДЕ§!\nПри распаде администрация вывезет всю открытую казну и топливо. Сохранятся только завершённые тайники; месторождения останутся.\nТайники: §Y[?NAM_hidden_reserve|0]§! £ADISCORD_economy_treasury_texticon; §Y[?NAM_hidden_fuel|0]§! £fuel_texticon."
 NAM_wrk_metropole_present_tt: "Метрополия существует"
 NAM_wrk_fuel_shipment: "Отгрузка топлива в метрополию"
 NAM_wrk_fuel_shipment_desc: "Метрополия прислала очередную заявку на горючее. Промысловые службы выделят цистерны, а торговые дома оформят отгрузку через привычные имперские конторы."
 NAM_cost_wrk_fuel_shipment: "§Y40000§! £fuel_texticon"
 NAM_cost_wrk_fuel_shipment_blocked: "§R40000§! £fuel_texticon"
 NAM_cost_wrk_fuel_shipment_tooltip: "§Y40000§! £fuel_texticon\nТопливо уходит в метрополию."
 NAM_wrk_fuel_shipment_tt: "Казна: §G+[?NAM_wrk_shipment_income|0]§! £ADISCORD_economy_treasury_texticon.\nПоддержка наместников: §G+4§! £NAM_support_nam_texticon.\nПоддержка нефтяников: §R-3§! £NAM_support_oil_texticon.\nМетрополия получает §Y40000§! £fuel_texticon и запоминает услугу. Доход растёт с уровнем торговых домов."
 NAM_wrk_trade_concession: "Торговая концессия метрополии"
 NAM_wrk_trade_concession_desc: "Торговые дома добиваются собственного права на нефтяные сделки. Канцелярии предстоит согласовать концессию с имперскими конторами и определить, кто будет подписывать экспортные бумаги."
 NAM_cost_wrk_trade_concession: "§Y50§! £political_power_texticon §Y200§! £ADISCORD_economy_treasury_texticon"
