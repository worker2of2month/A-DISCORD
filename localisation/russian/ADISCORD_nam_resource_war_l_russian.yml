 NAM_bw_support_rules:0 "§YЛОЯЛЬНОСТЬ ОПОР§!\nЛояльность: §Y[?NAM_loyalty|0] / 100§!\nОбщий эффект: [?NAM_loy_political_power_gain|=+2] £political_power_texticon /дн.; [?NAM_loy_stability_factor|=+1%] £stability_texticon.\nВыше §Y50§! лояльности - прибавка, ниже - штраф. Поддержка, вес и текущий эффект каждой опоры показаны на её карточке.\n\n§YПОДДЕРЖКА И ОБРАЩЕНИЯ§!\n- От §G70§! - бонус группы; §R25§! и ниже - штраф.\n- §R20§! и ниже - возможен ропот; от §Y85§! - требование.\n- Каждый месяц поддержка сдвигается на §Y0,5§! к §Y50§!.\n- Между обращениями групп и соперников: не менее §Y90§! £time_texticon дней.\n- Повторный ропот или требование одной группы: через §Y360§! £time_texticon дней.\n\n§YМИЛОСТИ И УСТУПКИ§!\nМилость доступна от §Y70§! поддержки: цена §Y15§!, действие §Y120§! £time_texticon дней, повтор через §Y180§! £time_texticon дней после выдачи. Доступность показана на карточке опоры.\nУступки открывает фокус §YСовет опор§!: цена §Y30§! £political_power_texticon, повтор через §Y60§! £time_texticon дней. Поддержка одной группы растёт за счёт другой; точные изменения указаны в решении.\n\n§YСОПЕРНИКИ ПОСЛЕ НЕЗАВИСИМОСТИ§!\nСоперник слабейшей опоры выдвигает условие не чаще раза в §Y240§! £time_texticon дней. Отказ стоит этой опоре §R15§! поддержки. Невыслушанный соперник при поддержке опоры ниже §R25§! потребует власти."
 NAM_bw_programme_rules:0 "§YПРОЕКТЫ НА ПРОМЫСЛАХ§!\nВ работе: §Y[?NAM_projects_in_progress|0] / [?NAM_project_slots|0]§! £under_construction_texticon\nФокусы открывают программы; оплаченные заказы дают поставки и работающие учреждения.\n\n§YЭКСПОРТ И ПОДГОТОВКА§!\nМощность поставок, покупатели и островные договоры - в экспортной сводке под картой.\nРост угрозы войны - в разделе «Давление реституции»; подготовленные формирования - в разделе «Мобилизация Светлогорья».\n\n§YИСХОД РЕСУРСНОЙ ВОЙНЫ§!\nДипломатический предел: §Y420§! £time_texticon дней.\n- От §Y100§! очков нефти - независимость. Захваченный пограничный округ противника даёт признание с новой границей; без него сохраняется прежняя граница.\n- §Y36-99§! - компромиссный мир.\n- Ниже §R36§! - раздел страны.\nКапитуляция противников завершает войну раньше."
