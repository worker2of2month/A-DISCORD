 NAM_mil_carrier_contract_result_tt:0 "Через §Y28§! £time_texticon дн.: §G+160§! £unit_mechanized_icon_small $ADISCORD_armored_carrier_2163$, §G+60§! £support_equipment_texticon.\nПри поставке открывается технология $ADISCORD_tech_armored_carrier_program$, если она ещё не изучена. $NAM_pw_combined_carriers_tt$"
 NAM_mil_carrier_contract_refund_tt:0 "§G+250§! £ADISCORD_economy_treasury_texticon."
 NAM_mil_carrier_contract_desc:0 "Колоннам нужны защищённые машины для пехоты, а мастерским - понятный порядок обслуживания. Военная приёмка согласует образец бронетранспортёра и подготовит документацию для его эксплуатации."
