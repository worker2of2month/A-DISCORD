 NAM_admin_svetlogorsk_cooperative_cost_tooltip:0 "§Y30§! £political_power_texticon §Y300§! £ADISCORD_economy_treasury_texticon\nОплата списывается один раз при запуске и возвращается при отмене."
 NAM_admin_seal_appeal:0 "Рассмотреть апелляции на сборы"
 NAM_admin_seal_appeal_delivered_tt:0 "§G+4§! £NAM_support_nam_texticon, §G+8§! £NAM_support_dist_texticon. При балансе за пределами §Y-10% / +10%§! он сдвигается на §Y10§! пунктов к центру."
 NAM_admin_seal_appeal_result_tt:0 "Через §Y14§! £time_texticon дн.: §G+4§! £NAM_support_nam_texticon, §G+8§! £NAM_support_dist_texticon. При балансе за пределами §Y-10% / +10%§! он сдвигается на §Y10§! пунктов к центру."
 NAM_admin_seal_appeal_desc:0 "Цена: §Y40§! £political_power_texticon. Срок: §Y14§! £time_texticon дн. Повтор через §Y90§! £time_texticon дн. после завершения.\n\nСуды отменят спорные взыскания и подтвердят законные полномочия. Это восстанавливает доверие обеих сторон и ограничивает крайности выбранного курса.\n§G+4§! £NAM_support_nam_texticon, §G+8§! £NAM_support_dist_texticon. При балансе за пределами §Y-10% / +10%§! он сдвигается на §Y10§! пунктов к центру.\n\nПри капитуляции, подчинении или утрате условий программы вся оплата возвращается. Война и смена дерева сами по себе не отменяют заказ. Все результаты получает Светлогорье."
