 NAM_hold_none: "приказа нет"
 NAM_orders_summary_open: "Оплачено: §Y[?NAM_orders_paid|0] / [?NAM_order_cap|0]§! £divisions_texticon\nПредельное число приказов: §Y6§!. Это резерв к началу войны, а не текущая армия."
 NAM_orders_summary_delivered: "Новые приказы закрыты. В день начала войны развёрнуто: §Y[?NAM_orders_delivered|0]§! £divisions_texticon\n- Гвардия промыслов: §Y[?NAM_orders_delivered_guard|0]§!.\n- Полевая пехота: §Y[?NAM_orders_delivered_infantry|0]§!.\n- Моторизованные дивизии: §Y[?NAM_orders_delivered_motor|0]§!.\n- Береговые отряды: §Y[?NAM_orders_delivered_coastal|0]§!."
 NAM_orders_summary_closed: "Ресурсная война завершена: приказов о мобилизации больше нет."
 NAM_order_slot_free_tt: "Война ещё не началась, а подготовленных формирований меньше предела: §Y[?NAM_orders_paid|0]§! из §Y[?NAM_order_cap|0]§!, не больше §Y6§!"
 NAM_order_resource_guard: "Приказ: гвардия промыслов"
 NAM_order_resource_guard_desc: "Промысловая гвардия сверяет мобилизационные списки. Командиры готовят места сбора, а снабженцы раскладывают имущество по будущим ротным ведомостям."
 NAM_order_resource_guard_tt: "Казна: §R-200§! £ADISCORD_economy_treasury_texticon.\nВ начале ресурсной войны: §G1§! £divisions_texticon полностью оснащённая дивизия гвардии промыслов - девять пехотных батальонов, сапёрная рота и артиллерийская батарея. Развёртывание: $STATE_67$; при потере точки сбора выбирается другой удерживаемый округ."
 NAM_order_field_infantry: "Приказ: полевая пехота"
 NAM_order_field_infantry_desc: "Полевые части готовят призывные списки и пункты сбора в округах. Местным командирам предстоит согласовать маршруты прибытия людей и работу инструкторов."
 NAM_order_field_infantry_tt: "Казна: §R-100§! £ADISCORD_economy_treasury_texticon.\nВ начале ресурсной войны: §G1§! £divisions_texticon полностью оснащённая полевая дивизия - шесть пехотных батальонов и сапёрная рота. Развёртывание: первый полностью удерживаемый округ из $STATE_690$, $STATE_719$, $STATE_689$; при потере всех трёх выбирается другой удерживаемый округ."
 NAM_order_motor_column: "Приказ: моторизованная дивизия"
 NAM_order_motor_column_desc: "Штаб подвижного резерва согласует экипажи, машины и места сбора колонн. Мастерские получают технические документы, по которым будут принимать и обслуживать бронетранспортёры."
 NAM_order_motor_column_tt: "Казна: §R-250§! £ADISCORD_economy_treasury_texticon.\nВ начале ресурсной войны: §G1§! £divisions_texticon полностью оснащённая дивизия - четыре батальона мотопехоты на БТР, сапёрная рота и артиллерийская батарея. Развёртывание: $STATE_67$, затем $STATE_688$ или другой удерживаемый округ. БТР включены в цену; при первом заказе открывается $ADISCORD_tech_armored_carrier_program$, если технология ещё не изучена."
 NAM_order_coastal_battalion: "Приказ: береговой батальон"
 NAM_order_coastal_battalion_desc: "Береговые командиры готовят отряд для службы у причалов Южной гавани. Портовые управления выделят помещения, а инструкторы проверят подходы к берегу."
 NAM_order_coastal_battalion_tt: "Казна: §R-50§! £ADISCORD_economy_treasury_texticon.\nВ начале ресурсной войны: §G1§! £divisions_texticon полностью оснащённый береговой отряд - три пехотных батальона и артиллерийская батарея. Развёртывание: $STATE_700$, затем $STATE_689$ или другой удерживаемый округ."
 NAM_cost_order_guard: "§Y25§! £political_power_texticon §Y200§! £ADISCORD_economy_treasury_texticon §Y9600§! £manpower_texticon"
 NAM_cost_order_guard_blocked: "§R25§! £political_power_texticon §R200§! £ADISCORD_economy_treasury_texticon §R9600§! £manpower_texticon"
 NAM_cost_order_guard_tooltip: "§Y25§! £political_power_texticon §Y200§! £ADISCORD_economy_treasury_texticon §Y9600§! £manpower_texticon\nЦена списывается при выборе; до войны казна и люди возвращаются при роспуске."
 NAM_cost_order_infantry: "§Y15§! £political_power_texticon §Y100§! £ADISCORD_economy_treasury_texticon §Y6300§! £manpower_texticon"
 NAM_cost_order_infantry_blocked: "§R15§! £political_power_texticon §R100§! £ADISCORD_economy_treasury_texticon §R6300§! £manpower_texticon"
 NAM_cost_order_infantry_tooltip: "§Y15§! £political_power_texticon §Y100§! £ADISCORD_economy_treasury_texticon §Y6300§! £manpower_texticon\nЦена списывается при выборе; до войны казна и люди возвращаются при роспуске."
 NAM_cost_order_motor: "§Y25§! £political_power_texticon §Y250§! £ADISCORD_economy_treasury_texticon §Y4600§! £manpower_texticon §Y3000§! £fuel_texticon"
 NAM_cost_order_motor_blocked: "§R25§! £political_power_texticon §R250§! £ADISCORD_economy_treasury_texticon §R4600§! £manpower_texticon §R3000§! £fuel_texticon"
 NAM_cost_order_motor_tooltip: "§Y25§! £political_power_texticon §Y250§! £ADISCORD_economy_treasury_texticon §Y4600§! £manpower_texticon §Y3000§! £fuel_texticon\nЦена списывается при выборе; до войны казна, топливо и люди возвращаются при роспуске."
 NAM_cost_order_coastal: "§Y10§! £political_power_texticon §Y50§! £ADISCORD_economy_treasury_texticon §Y3300§! £manpower_texticon"
 NAM_cost_order_coastal_blocked: "§R10§! £political_power_texticon §R50§! £ADISCORD_economy_treasury_texticon §R3300§! £manpower_texticon"
 NAM_cost_order_coastal_tooltip: "§Y10§! £political_power_texticon §Y50§! £ADISCORD_economy_treasury_texticon §Y3300§! £manpower_texticon\nЦена списывается при выборе; до войны казна и люди возвращаются при роспуске."
 NAM_prepare_line: "Подготовить рубеж"
 NAM_prepare_line_desc: "Инженеры размечают позиции вдоль сухопутной границы округа. Дороги, наблюдательные пункты и полевые укрепления должны стать частью общего оборонительного плана."
 NAM_cost_line: "§Y30§! £political_power_texticon §Y100§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_line_blocked: "§R30§! £political_power_texticon §R100§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_line_tooltip: "§Y30§! £political_power_texticon §Y100§! £ADISCORD_economy_treasury_texticon\nКазна возвращается, если работы будут прерваны."
 NAM_line_slot_free_tt: "Есть свободное место для рубежа: занято §Y[?NAM_lines_in_progress|0]§! из §Y[?NAM_line_slots|0]§!"
 NAM_line_started_tt:0 "Казна: §R-100§! £ADISCORD_economy_treasury_texticon; задаток вернётся, если работы будут прерваны.\nЗанимается одно место для рубежа. Уже оплаченные постоянные укрепления достраиваются после мира; новые заказы принимаются до и во время ресурсной войны, а после мира - по курсу \"Вооружённый рубеж\"."
 NAM_line_built_tt:0 "Если округ по-прежнему принадлежит нам, контролируется нами и имеет сухопутную границу с другой страной, в каждой его пограничной провинции строятся укрепления уровня §Y1§!, а в пограничных городах с победными очками - уровня §Y2§!. Иначе задаток возвращается в казну. После утраты и возвращения округа рубеж можно подготовить заново за полную цену."
 NAM_line_refund_tt: "Работы прерваны: §G100§! £ADISCORD_economy_treasury_texticon возвращаются в казну, место для рубежа освобождается. Политическая власть не возвращается."
 NAM_scorch_wells: "Выжечь скважины"
 NAM_scorch_wells_desc: "Отступающие части получают тяжёлый приказ: вывести промысел из строя. Инженеры готовят подрывные заряды, пока мастера пытаются вывезти людей и документацию."
 NAM_scorch_threat_tt: "Фронт подошёл к промыслу: часть округа или соседний округ занят противником"
 NAM_scorch_wells_tt:0 "Промысел не даёт сырья и не обслуживает нефтяные договоры §Y180§! £time_texticon; состояние снижается до не более §R10/100§!.\nЕсли его контролирует воюющий с нами противник во время ресурсной войны: скорость его армий §G-20%§!, истощение §G+15%§!, местное снабжение §G-1§!. После освобождения эти военные штрафы прекращаются; пожары и разрушения остаются.\nСкважины не входят в штраф Светлогорью за захват до окончания пожаров. Нефтяники: §R-10§! £NAM_support_oil_texticon; дисциплина печатей: §R-5§!."
 NAM_hold_field_67: "Удержать Северные месторождения"
 NAM_hold_field_67_desc: "Северные месторождения остаются ключевым участком обороны. Командование требует согласовать охрану скважин с дорогами подвоза и позициями полевых частей."
 NAM_hold_field_689: "Удержать Южнобережье"
 NAM_hold_field_689_desc: "Командиры Южнобережья сверяют рубежи между промыслами и прибрежными дорогами. На карте каждый подход должен иметь ответственного за его оборону."
 NAM_hold_field_690: "Удержать Сухоречье"
 NAM_hold_field_690_desc: "Сухоречье связывает промыслы с дорогами к гавани. Местные штабы готовят оборону поселений, насосных станций и путей подвоза."
 NAM_hold_field_discipline_tt: "Дисциплина печатей: §G+10§!."
 NAM_hold_field_lost_tt: "Промысел потерян: приказ закрывается без награды."

 # Restitution events
 ADISCORD_nam_resource_war.20.t: "Ноты о реституции"
 ADISCORD_nam_resource_war.20.d: "Ром распорядился принять посланников Эфлора и Ажара по отдельности. Ноты они передали почти одинаковые: вернуть северные промыслы и дороги, присоединённые при воркерландском управлении. К требованиям приложили копии указов. Посланники настойчиво называли предстоящий передел восстановлением законных прав.\n\nКогда они ушли, Мезенцев разложил приложения к обеим нотам. Для ответа требовалось выяснить, какие участки запрашивает каждая сторона, что она считает границей и на чьи права ссылается. Он предлагал обсуждать эти вопросы по очереди. Пока соседи отвечают на запросы и сверяют притязания, можно получить время для подготовки.\n\nРом прочитал один из указов целиком. По служебному опыту он знал, как выглядели документы об изъятии: кто получал землю, кому полагалось возмещение и какие возражения оставляли без рассмотрения. Само наличие воркерландского указа ещё не делало произошедшее справедливым. Но нынешние жители промыслов не принимали тех решений, а теперь могли лишиться работы и домов.\n\nОфицер гарнизона спросил, означает ли переписка готовность отступить. Ром не ответил сразу. Отклонить требования было проще всего; после такого ответа ему снова принесут вопрос о защите границы. Он попросил Мезенцева оставить ноты и отдельно подготовить перечень того, что ещё можно обсуждать. Решение о начале переговоров оставалось за правительством."
 ADISCORD_nam_resource_war.20.d_successor: "Посланники Эфлора и Ажара передали требования о возвращении северных промыслов и прилегающих дорог. К нотам приложены воркерландские указы о передаче этих земель наместничеству и перечни месторождений. Соседи считают вопрос восстановлением своих прав.\n\nМезенцев предлагает запросить границы каждого требования и обсудить спорные участки по отдельности. Переписка позволит уточнить позиции и выиграть время для подготовки. Гарнизонные офицеры опасаются, что начало переговоров сочтут согласием на уступки, и предлагают ответить отказом. Правительству предстоит выбрать ответ."
 ADISCORD_nam_resource_war.20.a: "Ответить нотой на ноту."
 ADISCORD_nam_resource_war.20.b: "Отвергнуть претензии публично."
 ADISCORD_nam_resource_war.21.t: "Совместный ультиматум"
 ADISCORD_nam_resource_war.21.d: "Военные атташе привезли совместный ультиматум. На этот раз к нему прилагался срок ответа. На просьбу пояснить спорные пункты один из гостей ответил, что правительствам Эфлора и Ажара всё уже известно. Ром велел проводить их в приёмную и вернулся к своим.\n\nМезенцев изложил Ключевский протокол: Восточное Сухоречье отходит Ажару, Светлогорье год отдаёт топливо в качестве дани. Это отложит войну, но уступку придётся объяснять людям в передаваемом округе. Был и отдельный разговор с ажарским штабом: за топливо он согласен задержать свои войска на два с половиной месяца. Из союза с Эфлором Ажар при этом не выйдет.\n\nРом спросил, кто гарантирует исполнение. Мезенцев перечислил известные обязательства и остановился. Всё, чего он не сказал, было понятно: отсрочка даст время, но не избавит от нового требования. Ром хорошо помнил, сколько воркерландских чрезвычайных мер вводили до следующего решения, а потом оставляли на годы.\n\nОфицеры предлагали отказать. Некоторые считали, что следует сразу ударить по соседям, пока те не закончили развёртывание. Такой приказ даст нашей армии возможность действовать первой и возложит на Светлогорье ответственность за начало войны. Ром попросил ещё раз проверить, какие части действительно готовы. Он не хотел услышать после первых потерь, что имелась в виду готовность по плану.\n\nАтташе ждали за дверью. Можно было принять территориальную уступку и дань, купить отдельную отсрочку у Ажара, отвергнуть требования или начать войну самим. Ром убрал со стола черновик ещё одного запроса разъяснений. На него уже никто не собирался отвечать."
 ADISCORD_nam_resource_war.21.d_successor: "На этот раз в приёмную вошли не посыльные, а военные атташе. Эфлор и Ажар требуют вернуть северные месторождения и признать за ними право на реституцию всей воркерландской нефтяной собственности. Срок ответа указан в днях, а не в неделях.\n\nУ правительства четыре ответа. Ключевский протокол отдаст Ажару Восточное Сухоречье и на год свяжет Светлогорье данью топливом, но отодвинет войну. Ажарский штаб готов и на меньшее: за цистерны топлива он два с половиной месяца будет придерживать свои войска, хотя союза с Эфлором не покинет. Можно отказать, опираясь на армию. Можно ударить первыми, пока соседи не закончили развёртывание, и стать в глазах всего Юга нападающей стороной."
 ADISCORD_nam_resource_war.21.a: "Отвергнуть ультиматум."
 ADISCORD_nam_resource_war.21.b: "Подписать Ключевский протокол."
 ADISCORD_nam_resource_war.21.c: "Купить время у Ажара."
 ADISCORD_nam_resource_war.21.e: "Ударить первыми."
 NAM_rw_21_b_tt:0 "§YВосточное Сухоречье§! переходит к Ажару; Светлогорье сохраняет претензию.\nНа §Y365§! £time_texticon начинается дань: ежемесячно по §Y1500§! £fuel_texticon Эфлору и Ажару.\nТекущий срок ресурсной войны увеличивается на §G365§! £time_texticon. Протокол подписывается один раз."
 NAM_rw_21_c_tt:0 "Ажар получает §Y12000§! £fuel_texticon. Текущий срок войны увеличивается на §G75§! £time_texticon.\nРанний договор через фокус и этот платёж используют одну общую отсрочку. Ажар остаётся участником коалиции."
 NAM_rw_21_e_tt: "Война начнётся в течение §Y7 дней§!, и Светлогорье объявит её первым.\nВместо корпуса обороны месторождений армия получит §Yкорпус первого удара§!, вдвое более слабый.\nБоевой дух Эфлора и Ажара: §R+10%§!."

 # Seal discipline events
 ADISCORD_nam_resource_war.30.t: "Печати дрогнули"
 ADISCORD_nam_resource_war.30.d: "Из округов приходят донесения, которых штаб не хотел бы видеть. Наместники задерживают пополнения, ссылаясь на нехватку людей; часть гарнизонов отходит без приказа, а в тылу говорят, что лестница держится только на страхе перед соседней ступенью.\n\nОфицеры просят денег на фронтовые надбавки. Комендатуры предлагают полевые трибуналы. Можно и переждать, надеясь, что следующая неделя будет удачнее."
 ADISCORD_nam_resource_war.30.a: "Держаться тем, что есть."
 ADISCORD_nam_resource_war.30.b: "Выплатить фронтовые надбавки."
 ADISCORD_nam_resource_war.30.c: "Ввести полевые трибуналы."
 NAM_seal_30_b_tt: "Казна: §R-150§! £ADISCORD_economy_treasury_texticon.\nДисциплина печатей: §G+15§!."
 NAM_seal_30_c_tt: "Дисциплина печатей: §G+12§!.\nПоддержка групп:\n  Гарнизоны: §G+5§! £NAM_support_garr_texticon\n  Округа: §R-5§! £NAM_support_dist_texticon"
 ADISCORD_nam_resource_war.31.t: "Лестница трещит"
 ADISCORD_nam_resource_war.31.d: "Два округа перестали отвечать на телеграммы штаба. В третьем наместник ведёт переговоры с противником от собственного имени, а на станциях копятся дезертиры, которых никто не решается арестовать.\n\nКирилл Мезенцев предлагает вскрыть нефтяной резерв и расплатиться топливом с теми, кто ещё держит фронт. Комендатуры требуют чрезвычайного положения во всех округах. Ром понимает: ещё одно поражение - и лестница рассыплется."
 ADISCORD_nam_resource_war.31.a: "Ждать перелома."
 ADISCORD_nam_resource_war.31.b: "Вскрыть нефтяной резерв."
 ADISCORD_nam_resource_war.31.c: "Объявить чрезвычайное положение."
 NAM_seal_31_b_tt: "Дисциплина печатей: §G+20§!."
 NAM_seal_31_c_tt: "Дисциплина печатей: §G+15§!.\nПоддержка групп:\n  Округа: §R-10§! £NAM_support_dist_texticon"
 ADISCORD_nam_resource_war.32.t: "Ночь печатей"
 ADISCORD_nam_resource_war.32.d: "Ночью в канцелярию принесли печати. Не одну и не две: наместники трёх округов, коменданты гарнизонов и начальники промысловых управлений сдали знаки своих полномочий и ушли, не дожидаясь приказа. К утру в коридорах стояли люди, которые не собирались ничего сдавать.\n\nВертикаль собирает власть обратно силой. Те, кто ещё держит печати, требуют одного начальника и одного приказа. Среди них уже есть человек, который считает, что этим начальником должен быть не Егор Ром."
 ADISCORD_nam_resource_war.32.a: "Собрать печати заново."
 NAM_seal_32_a_tt: "Баланс лестницы печатей смещается к вертикали на §Y0.20§!.\nДисциплина печатей восстанавливается до §Y30§!.\nВ течение §Y60 дней§! соперник Рома может потребовать руководства страной."

 ADISCORD_nam_resource_war.2.t: "Светлогорское восстание"
 ADISCORD_nam_resource_war.2.d: "Пока основные силы Светлогорья связаны боями на внешних границах, Ярослав Вебер вывел подполье из укрытий. Дезертиры, подпольщики и противники старой колониальной администрации захватили компактный плацдарм внутри северного ресурсного пояса. Временный штаб восстания во главе с Вебером объявил Светлогорье продолжателем воркерландской системы наместников и открыл внутренний фронт."
 ADISCORD_nam_resource_war.2.a: "Ещё один фронт - но не ещё одна причина сдаться."
 ADISCORD_nam_resource_war.3.t: "Светлогорские контракты"
 ADISCORD_nam_resource_war.3.d: "Вокруг ресурсного бассейна Светлогорья началась война. Для Кефрейта это не просто очередной пограничный конфликт: кризис открыл новые военные, снабженческие и политические контракты. Ветка фокусов ресурсной войны теперь раскрыта. Первый фокус по-прежнему требует обычный предыдущий фокус."
 ADISCORD_nam_resource_war.3.a: "Открыть контрактные досье."

 ADISCORD_nam_resource_news.1.t: "Эфлор и Ажар вторглись в Светлогорье"
 ADISCORD_nam_resource_news.1.d: "Армии Эфлора и Ажара перешли границу Светлогорья через несколько часов после провала переговоров. Поводом стал отказ светлогорского правительства принять ультиматум о северных месторождениях и прилегающей инфраструктуре. Обе страны считают эти земли своими: их передали Светлогорью ещё при воркерландской администрации.\n\nРахма и Мазар официально в войне не участвуют, но разрешили набор добровольцев в обмен на будущие топливные контракты. Светлогорью приходится обороняться сразу на двух направлениях, прикрывая промыслы и транспортные узлы."
 ADISCORD_nam_resource_news.1.d_strike: "Светлогорье нанесло удар первым. Переговоры о северных месторождениях зашли в тупик, и армия Егора Рома перешла границу Эфлора, не дожидаясь, пока соседи завершат развёртывание. Эфлор объявил нападение доказательством того, что наместническая лестница понимает только силу, и призвал союзников к оружию.\n\nРахма и Мазар официально в войне не участвуют, но разрешили набор добровольцев в обмен на будущие топливные контракты. Внезапность дала Светлогорью время, но армия ушла с подготовленных позиций, а соседи получили повод, которого им не хватало."
 ADISCORD_nam_resource_news.1.a: "Война за месторождения началась."
 ADISCORD_nam_resource_news.2.t: "Светлогорье разделено между Эфлором и Ажаром"
 ADISCORD_nam_resource_news.2.d: "Организованное сопротивление Светлогорья прекратилось. Эфлор занял Северные месторождения, западные терминалы и Светлогорск, Ажар - морские округа Чёрного бассейна и южный порт. Временный штаб Светлогорского восстания распущен, прежняя администрация Светлогорья как самостоятельное правительство больше не существует.\n\nСоюзники объявили цели войны достигнутыми и приступили к демаркации новой границы. Вместе с землями им достались разрушенные промыслы, повреждённые дороги и население, которое несколько поколений жило под чужой властью."
 ADISCORD_nam_resource_news.2.a: "Светлогорье поделено."
 ADISCORD_nam_resource_news.2.t_exile: "Правительство Светлогорья бежало на острова"
 ADISCORD_nam_resource_news.2.d_exile: "Материковое Светлогорье пало. Эфлор занял Северные месторождения и Светлогорск, Ажар - южные промыслы и Южную гавань. Временный штаб Светлогорского восстания распущен, а победители уже проводят новую границу по бывшим нефтяным полям.\n\nПравительство Егора Рома не стало подписывать собственный конец. Последние пароходы вывезли канцелярию, архив печатей и остатки армии на заморские острова, и новая столица по ту сторону пролива объявила, что Светлогорье продолжает существовать. Её власти обещают вернуть материк, но пока у них есть только верфи, рыбацкие порты и люди, которые помнят, откуда их выгнали."
 ADISCORD_nam_resource_news.2.a_exile: "Острова - ещё не конец."
 ADISCORD_nam_resource_news.3.t: "Светлогорье добилось признания независимости"
 ADISCORD_nam_resource_news.3.d: "Светлогорье удержало Северные месторождения и вынудило Эфлор и Ажар подписать мир. Договор признаёт Светлогорье независимым государством и передаёт ему пограничные округа побеждённых: Эфлор уступает Моренский округ, Лоренское порубежье и город Средний Лорен, Ажар - Ажарское взморье. Побеждённые выходят из войны с разорённой экономикой и опозоренной армией. Вопрос о Чёрном бассейне остаётся открытым, но боевые действия прекращены.\n\nФормирования Светлогорского восстания разоружены. Эфлор и Ажар сохранили союз, так что спор о границе в будущем может возобновиться."
 ADISCORD_nam_resource_news.3.t_standoff: "Война за светлогорскую нефть закончилась вничью"
 ADISCORD_nam_resource_news.3.d_standoff: "Истёк дипломатический срок войны за месторождения. Армии Эфлора и Ажара так и не сломили оборону нефтяного бассейна, но и Светлогорье не перенесло войну на землю соседей. Посредники зафиксировали линию фронта там, где она проходила до первых выстрелов: границы не меняются, никто не платит контрибуций и не подписывает договора о признании.\n\nСветлогорье сохраняет независимость и свои промыслы, а формирования Светлогорского восстания разоружены. В Эфлоре и Ажаре ничью называют передышкой, в Светлогорске - победой, которую ещё предстоит закрепить. Союз соседей сохранён, и спор о бассейне остаётся открытым."
 ADISCORD_nam_resource_news.3.a: "Светлогорье отстояло независимость."
 ADISCORD_nam_resource_news.5.t: "В Светлогорске началось восстание"
 ADISCORD_nam_resource_news.5.d: "Пока основные силы Светлогорья воюют с Эфлором и Ажаром, в тылу вспыхнуло восстание. Ярослав Вебер, годами собиравший подполье северного ресурсного пояса, вывел его на улицы: противники системы наместников захватили Светлогорский округ и объявили о создании Временного штаба восстания. К ним присоединились часть гарнизонов, дезертиры и подпольные группы.\n\nПовстанцы не претендуют на всё Светлогорье и не провозглашают нового государства. Вебер требует ликвидировать администрацию наместников, оставшуюся от Воркерланда. Правительству теперь приходится одновременно удерживать месторождения, сдерживать внешнее наступление и возвращать столичный округ."
 ADISCORD_nam_resource_news.5.a: "У Светлогорья появился третий фронт."
 ADISCORD_nam_resource_news.6.t: "Светлогорское восстание подавлено"
 ADISCORD_nam_resource_news.6.d: "Правительственные войска Светлогорья вернули контроль над Светлогорским округом. Временный штаб восстания распущен, уцелевшие отряды разоружены или рассеялись. Ярослав Вебер ушёл из города с последними связными: его подполье разбито, но не выдано.\n\nВойна с Эфлором и Ажаром продолжается, но теперь Светлогорье может перебросить резервы на внешний фронт. Сторонники наместников называют подавление восстания первой крупной победой новой власти после распада Воркерланда."
 ADISCORD_nam_resource_news.6.a: "Восстание подавлено."
 ADISCORD_nam_resource_news.7.t: "Светлогорье подписало компромиссный мир"
 ADISCORD_nam_resource_news.7.d: "Война за месторождения закончилась без капитуляции. Истёк дипломатический срок, и посредники свели итог к простому счёту: какие промыслы остались за Светлогорьем, а какие уже заняты армиями коалиции. Занятые месторождения переходят Эфлору и Ажару; Светлогорский округ, если правительство его не удержало, отходит Эфлору, а Временный штаб восстания распускается новыми хозяевами округа.\n\nСветлогорье сохраняет оставшиеся промыслы, Южную гавань и заморские округа, но на год обязуется поставлять топливо обоим соседям. Наместники называют договор передышкой, округа - ценой выживания, а в Эфлоре и Ажаре говорят, что спор о бассейне только отложен."
 ADISCORD_nam_resource_news.7.a: "Светлогорье уцелело, но заплатит за это."

 ADISCORD_nam_debug_start_resource_war:0 "§RDEBUG:§! Начать ресурсную войну"
 ADISCORD_nam_debug_start_resource_war_desc:0 "Переговорщики уступают место военным штабам."
 ADISCORD_nam_debug_resolve_coalition_victory:0 "§RDEBUG:§! Выиграть ресурсную войну за Эфлор и Ажар"
 ADISCORD_nam_debug_resolve_coalition_victory_desc:0 "Коалиция диктует условия раздела материковых владений Светлогорья."
 ADISCORD_nam_debug_resolve_nam_victory:0 "§RDEBUG:§! Выиграть ресурсную войну за Светлогорье"
 ADISCORD_nam_debug_resolve_nam_victory_desc:0 "Соседи признают право Светлогорья распоряжаться своими промыслами."
 ADISCORD_nam_debug_resolve_compromise:0 "§RDEBUG:§! Заключить компромисс в ресурсной войне"
 ADISCORD_nam_debug_resolve_compromise_desc:0 "Делегации возвращаются за стол переговоров с картами занятой территории."
 ADISCORD_nam_debug_add_tension:0 "§RDEBUG:§! До ресурсной войны на 30 дней меньше"
 ADISCORD_nam_debug_add_tension_desc:0 "Приближает текущий срок войны на 30 дней и проверяет предупреждения."

 # National focus campaign
 NAM_inventory: "Опись исчезающей империи"
 NAM_inventory_desc: "На полках Егора Рома всё ещё лежат предписания столицы. Одни требуют отправить нефть, другие запрещают трогать вагоны, третьи отменяют вторые. Сначала выясним, какие склады, люди и полномочия действительно принадлежат Светлогорью."
 NAM_open_ledgers:0 "Совет и казна Светлогорья"
 NAM_open_ledgers_desc:0 "Независимость оставила нам разрозненные кассы, ведомственные склады и совет, где каждый говорит от своего округа. Общий учёт позволит договориться, какие стройки страна потянет вместе."
 NAM_vertical: "Одна подпись Рома"
 NAM_vertical_desc: "Лестница согласований останется, но распоряжения больше не будут застревать между управлениями. Наместники получат единую норму сбора и персональную ответственность перед Ромом. Быстрее исполнять приказы ещё не значит примириться с теми, кто их ненавидит."
 NAM_districts: "Подписи округов"
 NAM_districts_desc: "Представители округов должны подписывать не только полученные приказы. Ром сохранит руководство, но отдаст местным советам право проверять расходы и оспаривать сборы. Казна потеряет удобство принуждения; страна получит собеседников."
 NAM_emergency_writ:0 "Государственные подряды"
 NAM_emergency_writ_desc:0 "Ром собирает наместников за одним столом. Столичные чиновники будут утверждать сметы и требовать от подрядчиков ответа за каждый незаконченный цех."
 NAM_district_guarantees:0 "Окружное строительство"
 NAM_district_guarantees_desc:0 "Собрания округов получат право выбирать подрядчиков и следить за работами. Светлогорск станет первым испытанием соглашения между местными обществами и столицей."
 NAM_one_budget: "Бюджет без двойного дна"
 NAM_one_budget_desc: "Открытая смета и единая инспекция пришли к разным политическим выводам, но обе нашли деньги, которые не доходили до казны. Вернём их в общий бюджет."
 NAM_well_register: "У скважины есть адрес"
 NAM_well_register_desc: "Отчёт о добыче не заменяет исправную цистерну. Сверим промыслы с подъездными путями и вернём в оборот топливо, которое числится между двумя ведомствами."
 NAM_export_quays: "Нефть оплачивает государство"
 NAM_export_quays_desc: "Портовые конторы смогут продавать партии из настоящего топливного резерва. Каждый рейс пополнит казну, но те же цистерны уже не смогут заправить собственную армию."
 NAM_domestic_refining: "Нефть остаётся дома"
 NAM_domestic_refining_desc: "Ценность месторождения не заканчивается у экспортного причала. Мастерские получат горючее для станков и транспорта, а страна - возможность выпускать собственное оснащение вместо продажи каждой бочки."
 NAM_insured_cargoes: "Рейс с обратным грузом"
 NAM_insured_cargoes_desc: "Экспортный рейс должен возвращаться с тарой и деталями, а не с пустым трюмом. Объединим разрозненные перевозки в обслуживаемую торговую линию."
 NAM_machine_shops: "Сменные детали для промыслов"
 NAM_machine_shops_desc: "Мастерская, способная починить насос, умеет больше, чем признаёт её смета. Единый заказ обеспечит инженерные части инструментом и подготовит выпуск военного оснащения."
 NAM_civilian_combine: "Город вокруг промысла"
 NAM_civilian_combine_desc: "Обслуживание скважин должно кормить постоянный город. Построим ремонтное предприятие рядом с Северными месторождениями, чтобы добыча перестала зависеть от случайного привозного подрядчика."
 NAM_technical_college: "Инженер выше инструкции"
 NAM_technical_college_desc: "Удачный ремонт не должен заканчиваться дисциплинарным делом за отступление от инструкции. Объединим лаборатории промыслов в технический институт с собственным исследовательским бюджетом."
 NAM_count_garrisons: "Гарнизон на бумаге и на дороге"
 NAM_count_garrisons_desc: "На карте каждая управа охраняется полком. На дороге иногда стоит один пост. Сведём учёт людей и оружия, затем выберем, что защищать неподвижно, а где нужен подвижный резерв."
 NAM_field_guards: "Армия опорных пунктов"
 NAM_field_guards_desc: "Промыслы нельзя отвести в тыл. За каждым постом охраны стоят скважины, рабочие посёлки и люди, которым больше некуда уходить. Здесь солдат должен знать каждую дорогу к своей вышке."
 NAM_mobile_columns: "Армия перекрёстков"
 NAM_mobile_columns_desc: "Не каждый участок можно удержать, зато потерянную дорогу можно вернуть. Штабы колонн изучают развилки, переправы и просёлки, по которым можно зайти противнику во фланг. Война не ограничится оградами промыслов."
 NAM_engineer_depots: "Инструмент перед винтовкой"
 NAM_engineer_depots_desc: "Инженер не должен искать лопату после прибытия на позицию. Выделим запас оснащения для сапёрных рот и обучения гарнизонов."
 NAM_motor_pool: "Общий автомобильный парк"
 NAM_motor_pool_desc: "Служебная машина начальника не важнее полевого подвоза. Соберём грузовики разрозненных управлений в резерв, которым действительно сможет пользоваться армия."
 NAM_quartermaster: "Склад знает свой фронт"
 NAM_quartermaster_desc: "Пока штаб переписывается со складами, солдат бережёт последний патрон. Интенданты должны знать, что лежит за каждой опечатанной дверью и кто отвечает за путь груза до части. Печать на накладной не заменит оружия в руках."
 NAM_port_arsenal: "Арсенал Южнобережья"
 NAM_port_arsenal_desc: "Порт должен принимать сырьё и выпускать оружие даже тогда, когда сухопутные пути перерезаны. Создадим собственную производственную площадку у действующих причалов."
 NAM_harbour_service: "Вечный порт"
 NAM_harbour_service_desc: "Распорядок ведомств не должен останавливать погрузку. Единая портовая служба сведёт смены докеров, лоцманов и снабженцев в одну работающую цепь."
 NAM_repair_yard: "Своя ремонтная стенка"
 NAM_repair_yard_desc: "Повреждённый корабль не должен уходить в чужой порт на неопределённый срок. Южнобережные мастерские получат верфь для ремонта и собственного судостроения."
 NAM_escort_school: "Сопровождение до последнего буя"
 NAM_escort_school_desc: "Флот нужен прежде всего для того, чтобы торговый корабль доходил до своего причала. Школа сопровождения научит экипажи искать угрозу до начала боя."
 NAM_island_accounts:0 "Островные управления"
 NAM_island_accounts_desc:0 "Дальним округам нужны не только сборщики, но и дороги к причалам. Местные управления сведут земельные ведомости, заявки поселений и работу подрядчиков, чтобы острова перестали жить от одного случайного рейса до другого."
 NAM_alarm:0 "Ресурсная война"
 NAM_alarm_desc: "Коалиция пришла за месторождениями, а не за дипломатической формулировкой. Ни один мирный план не должен задержать чрезвычайный штаб."
 NAM_hold_basin: "У промыслов нет тыла"
 NAM_hold_basin_desc: "Война решится вокруг Северных месторождений. Выдадим инструмент и артиллерию защитникам, а временные инструкции позволят быстрее укрепить позиции."
 NAM_relief_columns: "Дорога, по которой ещё можно пройти"
 NAM_relief_columns_desc: "Штаб должен перебрасывать подвоз туда, где он нужен сегодня. Выделим транспорт и разрешим расходовать собственное горючее на дополнительные военные партии оснащения."
 NAM_counterstroke: "Вернуть узлы, удержать людей"
 NAM_counterstroke_desc:0 "Штаб готовит маршруты удара, порядок подвоза топлива и связь с передовыми частями. Когда обстановка позволит, командование сможет собрать силы на выбранном направлении."
 NAM_recognition: "Подпись под независимостью"
 NAM_recognition_desc: "Соседи подписали признание Светлогорья. Теперь можно спорить об устройстве государства, не ожидая приказа из исчезнувшей столицы."
 NAM_service_state: "Государство служебной ответственности"
 NAM_service_state_desc: "Чрезвычайная вертикаль выиграла время; постоянное государство должно объяснить, что оно требует от своих начальников. Полномочие останется у Рома, но ответственность больше не закончится у дверей его кабинета."
 NAM_federal_charter: "Хартия округов"
 NAM_federal_charter_desc: "Уступки военного времени станут правилами государства. Округа сохранят право открытого счёта и участия в бюджете, а общее правительство - армию и внешнее представительство."
 NAM_law_after_war: "Указ перестаёт быть временным"
 NAM_law_after_war_desc: "Победители способны оставить чрезвычайное положение навсегда. Вместо этого закрепим сроки полномочий учреждений и порядок оспаривания решений, соответствующий выбранному устройству страны."
 NAM_civil_repair: "Восстановить то, за что воевали"
 NAM_civil_repair_desc: "Добыча не возобновится от победной речи. Построим гражданское предприятие в Южнобережье и вернём ремонтные бригады к насосам, складам и жилью."
 NAM_civil_dividend: "Гражданский дивиденд"
 NAM_civil_dividend_desc: "Жители встречали победу с надеждой вернуться к обычной жизни. Они ждут света в домах, открытых мастерских и улиц, по которым дети смогут ходить без страха. Мир должен стать заметен за пределами праздничных речей."
 NAM_armed_peace: "Постоянный оборонный заказ"
 NAM_armed_peace_desc: "Подписи под мирным договором ещё не стёрли линии фронта со штабных карт. Пока соседи помнят свои поражения и претензии, караулы остаются на постах, а арсеналы продолжают работать."
 NAM_national_university: "Страна собственных специалистов"
 NAM_national_university_desc: "Нефтяное государство уязвимо, пока все сложные решения принимают приезжие. Технический институт получит общеуниверситетские кафедры и самостоятельный исследовательский бюджет."
 NAM_svetlogorye: "Светлогорье отвечает за себя"
 NAM_svetlogorye_desc: "Когда-то эта страна была графой в чужом отчёте. Теперь у неё есть признанная граница, собственные специалисты и порядок, за который отвечает её правительство. История наместничества останется в архивах; будущее больше не придёт исходящим письмом."
 NAM_wartime_entrenchment: "Инструкции обороны бассейна"
 NAM_wartime_entrenchment_desc: "Временная инженерная подготовка действует только в ресурсной войне."
 NAM_counterstroke_staff: "Группа ограниченного контрудара"
 NAM_counterstroke_staff_desc: "Временное согласование наступлений действует только в ресурсной войне."
 NAM_rebel_depot_maps: "Карты складов подполья"
 NAM_rebel_depot_maps_desc: "Инспекторские сведения помогают ударам по формированиям Светлогорского восстания."
 NAM_wage_arrears: "Отложенная ведомость"
 NAM_wage_arrears_desc: "Старые долги по жалованью оставлены до следующего квартала."
 NAM_housing_programme: "Дома для вернувшихся"
 NAM_housing_programme_desc: "Оплаченная гражданская программа ускоряет общее строительство."
 NAM_sign_compact: "Оплатить договор Светлогорска"
 NAM_sign_compact_desc: "Окружные представители и правительство подписывают договор о работе гражданских служб Светлогорска. Следом за подписями должны прийти сотрудники, помещения и ежедневная работа, которую увидят сами жители."
 NAM_export_fuel: "Продать партию нефтяного резерва"
 NAM_export_fuel_desc: "В Южной гавани готовят отдельную партию топлива для продажи. Казначеи сверят условия сделки, пока портовые службы собирают документы на отгрузку."
 NAM_workshop_batch: "Дополнительная смена мастерских"
 NAM_workshop_batch_desc: "Мастерские принимают общий заказ полевого имущества. Старшие мастера распределят работу между цехами и согласуют образцы с военной приёмкой."
 NAM_supply_order: "Оплатить полевую поставку"
 NAM_supply_order_desc: "Снабженцы собирают разрозненные заявки частей в одну ведомость. Арсеналы проверят комплектность грузов перед отправкой к гарнизонам."
 NAM_emergency_arsenal: "Чрезвычайная выдача арсенала"
 NAM_emergency_arsenal_desc: "На арсеналы поступил срочный военный заказ. Приёмщики остаются у погрузочных площадок, чтобы партии не задерживались между цехом и железной дорогой."
 NAM_counterinsurgency: "Вскрыть склады подполья"
 NAM_counterinsurgency_desc: "Командование готовит операцию против укрепившихся повстанцев. Разведчики сводят сведения о складах, путях подвоза и связных, а части получают задачи по участкам."
 NAM_relief_batch: "Подвоз для угрожаемого участка"
 NAM_relief_batch_desc: "Тыловые управления готовят очередную партию для действующих частей. Складские служащие сверяют заявки с фронтовыми ведомостями и назначают ответственных за сопровождение."
 NAM_veteran_housing: "Жильё и работа для ветеранов"
 NAM_veteran_housing_desc: "Городские службы обсуждают с ветеранами новые жилые кварталы Южной гавани. Планировщики должны связать дома с рабочими местами, мастерскими и привычными дорогами города."
 NAM_postwar_rearmament: "Плановое перевооружение"
 NAM_postwar_rearmament_desc: "После войны части возвращают изношенное имущество на осмотр. Арсеналы и ремонтные службы согласуют, что можно восстановить, а что придётся заменить новым заказом."
