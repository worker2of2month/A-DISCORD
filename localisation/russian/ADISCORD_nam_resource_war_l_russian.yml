 NAM_piracy:0 "Морские рейды Светлогорья"
 NAM_piracy_desc:0 "Выберите морской путь на карте. Для рейда нужны корабль, свободная флотилия и топливо. Добычу можно продать скупщикам. Высокая дурная слава грозит блокадой."
 NAM_pirate_notoriety_quiet: "§Gо нас почти не говорят§!"
 NAM_pirate_notoriety_known: "§Yо нас говорят в портах§!"
 NAM_pirate_notoriety_wanted: "§Rкоалиция может объявить блокаду§!"
 NAM_pirate_notoriety_hunted: "§Rкоалиция может обстрелять острова§!"
 NAM_landing_forecast_three: "Десант сейчас: §Y3§! дивизии."
 NAM_landing_forecast_two: "Десант сейчас: §Y2§! дивизии."
 NAM_pirate_raid_lane_oil: "Набег на Нефтяной путь"
 NAM_pirate_raid_lane_oil_desc: "Танкеры Ажара везут нефть Чёрного берега в залив Эфлора и огибают восточный мыс нашего главного острова. Флотилия караулит их у мыса; наблюдатели сверяют силуэты с судовыми справочниками."
 NAM_pirate_lane_oil_result_tt: "§YУДАЧА§!\nТрофеи: §G+60§! добычи, §G+1000§! £fuel_texticon.\nВладельцы пути: суммарно §R-2000§! £fuel_texticon.\nДурная слава: §R+10§!.\n\n§YПРИЗ§!\nТрофеи: §G+100§! добычи, §G+2000§! £fuel_texticon, §G+9000§! £infantry_equipment_texticon, §G+3§! £convoy_texticon.\nВладельцы пути: суммарно §R-3000§! £fuel_texticon.\nДурная слава: §R+12§!.\n\n§YПРОВАЛ§!\nПотеря патрульного корабля или §R1000§! £manpower_texticon.\nДурная слава: §R+5§!.\n\nБогатые грузы: вес призового исхода §Gx1.5§!.\n\nПосле набега владельцы пути настороже §Y90§! £time_texticon."
 NAM_pirate_raid_lane_coast: "Набег на Северный каботаж"
 NAM_pirate_raid_lane_coast_desc: "Каботажные суда Ривена и Эфлора идут вдоль материкового берега к северу от островов, в виду наших маяков. Флотилия перехватывает их в узостях между берегом и островами."
 NAM_pirate_lane_coast_result_tt: "§YУДАЧА§!\nТрофеи: §G+60§! добычи, §G+1000§! £fuel_texticon.\nВладельцы пути: суммарно §R-2000§! £fuel_texticon.\nДурная слава: §R+10§!.\n\n§YПРИЗ§!\nТрофеи: §G+100§! добычи, §G+2000§! £fuel_texticon, §G+9000§! £infantry_equipment_texticon, §G+3§! £convoy_texticon.\nВладельцы пути: суммарно §R-3000§! £fuel_texticon.\nДурная слава: §R+12§!.\n\n§YПРОВАЛ§!\nПотеря патрульного корабля или §R1000§! £manpower_texticon.\nДурная слава: §R+5§!.\n\n§YБЕЗ СУДОВ ЭФЛОРА§!\nЗа удачу: §G+50§! добычи. Дурная слава: удача §R+6§!, приз §R+8§!, провал §R+3§!.\n\nПосле набега владельцы пути настороже §Y90§! £time_texticon."
 NAM_pirate_raid_lane_strait: "Набег на Луренский пролив"
 NAM_pirate_raid_lane_strait_desc: "Суда ульвенских ремонтных мастерских и общих портов Лурена ходят проливом к югу от островов. Флотилия занимает позиции в проливе, а береговые наблюдатели отмечают проходящие суда."
 NAM_pirate_lane_strait_result_tt: "§YУДАЧА§!\nТрофеи: §G+50§! добычи, §G+1000§! £fuel_texticon.\nВладельцы пути: суммарно §R-2000§! £fuel_texticon.\nДурная слава: §R+6§!.\n\n§YПРИЗ§!\nТрофеи: §G+100§! добычи, §G+2000§! £fuel_texticon, §G+9000§! £infantry_equipment_texticon, §G+3§! £convoy_texticon.\nВладельцы пути: суммарно §R-3000§! £fuel_texticon.\nДурная слава: §R+8§!.\n\n§YПРОВАЛ§!\nПотеря патрульного корабля или §R1000§! £manpower_texticon.\nДурная слава: §R+3§!.\n\nПосле набега владельцы пути настороже §Y90§! £time_texticon."
 NAM_pirate_raid_lane_crossing: "Набег на Шарденский паром"
 NAM_pirate_raid_lane_crossing_desc: "Грузовые и почтовые суда с большого южного острова пересекают море и проходят между нашими островами к Ривенской бухте. Флотилия караулит переправу в проливе между островами."
 NAM_pirate_lane_crossing_result_tt: "§YУДАЧА§!\nТрофеи: §G+50§! добычи, §G+1000§! £fuel_texticon.\nВладельцы пути: суммарно §R-2000§! £fuel_texticon.\nДурная слава: §R+6§!.\n\n§YПРИЗ§!\nТрофеи: §G+100§! добычи, §G+2000§! £fuel_texticon, §G+9000§! £infantry_equipment_texticon, §G+3§! £convoy_texticon.\nВладельцы пути: суммарно §R-3000§! £fuel_texticon.\nДурная слава: §R+8§!.\n\n§YПРОВАЛ§!\nПотеря патрульного корабля или §R1000§! £manpower_texticon.\nДурная слава: §R+3§!.\n\nПосле набега владельцы пути настороже §Y90§! £time_texticon."
