 NAM_pw_contract_arbitration_idea:0 "Провести арбитраж хозяйственных договоров"
 NAM_pw_contract_arbitration_idea_desc:0 "Арбитры разбирают взаимные требования казны, промыслов и торговых домов, чтобы спорные счета перестали останавливать работу."
 NAM_pw_contract_arbitration_result_tt:0 "Через §Y35§! £time_texticon Светлогорье получает \"$NAM_pw_contract_arbitration_idea$\" на §Y180§! £time_texticon:\n$NAM_pw_contract_arbitration_idea_effect$"
 NAM_pw_contract_arbitration_idea_effect:0 "Расходы на управление: §G-15%§!\nДоходы от торговли: §G+15%§!"
 NAM_pw_contract_arbitration:0 "Провести арбитраж хозяйственных договоров"
 NAM_pw_contract_arbitration_desc:0 "Арбитры разбирают взаимные требования казны, промыслов и торговых домов, чтобы спорные счета перестали останавливать работу."
 NAM_pw_contract_arbitration_unlock_tt:0 "Арбитраж временно уменьшает расходы на управление и увеличивает доходы от торговли."
