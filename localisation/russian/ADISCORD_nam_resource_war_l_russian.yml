 NAM_bw_support_rules:0 "§YЛОЯЛЬНОСТЬ ОПОР§!\nЛояльность: §Y[?NAM_loyalty|2] / 100§!. Это сумма поддержки каждой опоры, умноженной на её вес и делённой на §Y100§!.\n\n§YТЕКУЩИЙ ЭФФЕКТ§!\n[?NAM_loy_political_power_gain|=+4] £political_power_texticon /дн.\n[?NAM_loy_stability_factor|=+3%] £stability_texticon\nШтрафы наместников и округов уже учтены.\n\n§YКАК МЕНЯЕТСЯ ЭФФЕКТ§!\nКаждый пункт лояльности выше §Y50§! даёт §G+0,004§! £political_power_texticon /дн. и §G+0,2§! п.п. £stability_texticon; ниже §Y50§! - такие же штрафы.\nПоддержка каждой опоры ежемесячно приближается к §Y50§! на §Y0,5§!, не переходя через него.\nОт §Y70§! поддержки действует бонус группы; при §Y25§! и ниже - штраф. Точные эффекты и условия кризиса указаны на карточках."
 NAM_bw_programme_rules:0 "§YПРОЕКТЫ НА ПРОМЫСЛАХ§!\nВ работе: §Y[?NAM_projects_in_progress|0] / [NAMProjectSlots]§! £under_construction_texticon\nФокусы открывают программы; оплаченные заказы дают поставки и работающие учреждения.\n\n§YЭКСПОРТ И ПОДГОТОВКА§!\nМощность поставок, покупатели и островные договоры - в экспортной сводке под картой.\nРост угрозы войны - в разделе Подготовка к ресурсной войне; подготовленные формирования - в разделе \"Мобилизация Светлогорья\".\n\n§YИСХОД РЕСУРСНОЙ ВОЙНЫ§!\nДипломатический предел: §Y420§! £time_texticon дней.\n- От §Y100§! очков нефти - независимость. Захваченный пограничный округ противника даёт признание с новой границей; без него сохраняется прежняя граница.\n- §Y36-99§! - компромиссный мир.\n- Ниже §R36§! - раздел страны.\nКапитуляция противников завершает войну раньше."
