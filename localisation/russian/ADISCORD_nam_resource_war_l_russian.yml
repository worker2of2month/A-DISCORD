 NAM_wrk_echelon_delivered_tt: "Эшелон пришёл: §G+6000§! £infantry_equipment_texticon и §G+60§! £support_equipment_texticon. Метрополия получает §Y90000§! £fuel_texticon.\nПоддержка наместников: §G+2§! £NAM_support_nam_texticon."
