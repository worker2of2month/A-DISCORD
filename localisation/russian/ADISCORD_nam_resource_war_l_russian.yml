 ADISCORD_nam_crisis.5.t: "Дезертирство в гарнизонах"
 ADISCORD_nam_crisis.5.d: "Солдаты гарнизонов покидают посты, жалуясь на долги по жалованью. Офицеры просят денег или трибунала."
