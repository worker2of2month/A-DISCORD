 NAM_bw_support_trade_tt:0 "§YЭКСПОРТНЫЕ КОНТОРЫ§!\nПоддержка: [NAMSupportTradeColour][?NAM_grp_trade_support|1] / 100§! £NAM_support_trade_texticon; вес: §Y[?NAM_grp_trade_influence|0]§!.\nСейчас: [?NAM_loy_trade_income|=+0%] £ADISCORD_economy_trade_texticon к торговому доходу.\nОт §Y70§! поддержки: §G+5%§! к торговому доходу; при §Y25§! и ниже: §R-5%§!.\nРиск кризиса: поддержка ниже §Y25§! и принадлежащая нам Южная гавань оккупирована.\n\n§YМИЛОСТЬ ОПОРЫ§!\n[NAMSupportTradeFavour]\nЦена: §R15§! £NAM_support_trade_texticon. Действует §Y120§! £time_texticon; повтор через §Y180§! £time_texticon после выдачи."
