 NAM_mil_engineer_supplies_delivered_tt:0 "§G+180§! £support_equipment_texticon, §G+36§! £artillery_texticon."
 NAM_mil_engineer_supplies_result_tt:0 "Через §Y21§! £time_texticon дн.: §G+180§! £support_equipment_texticon, §G+36§! £artillery_texticon."
 NAM_mil_engineer_supplies_refund_tt:0 "§G+150§! £ADISCORD_economy_treasury_texticon."
 NAM_mil_engineer_supplies_desc:0 "Цена: §Y25§! £political_power_texticon §Y150§! £ADISCORD_economy_treasury_texticon. Срок: §Y21§! £time_texticon дн. Повтор через §Y90§! £time_texticon дн. после завершения.\n\nСклады получат имущество для инженерных рот, артиллерии поддержки и снабжения рубежей.\n§G+180§! £support_equipment_texticon, §G+36§! £artillery_texticon.\n\nПри капитуляции, подчинении или утрате условий заказа вся оплата возвращается. Начало и завершение войны сами по себе заказ не отменяют. Поставка поступает Светлогорью."
