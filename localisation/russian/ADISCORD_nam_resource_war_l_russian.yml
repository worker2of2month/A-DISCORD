 NAM_overseas_service_operable_tt:0 "Светлогорье независимо и владеет хотя бы одним контролируемым заморским округом"
 NAM_island_levy_cancel_tt:0 "Сбор прекращается, ограничение местной добычи снимается. Организационная оплата не возвращается."
 NAM_island_levy_end_tt:0 "Срок сбора завершён. Островные поступления прекращаются, ограничение местной добычи снимается."
 NAM_island_convoy_cancel_tt:0 "Регулярные рейсы прекращаются. Полученные конвои остаются у Светлогорья; оплата не возвращается."
 NAM_island_public_works:0 "Дороги к островным причалам"
 NAM_island_public_works_desc:0 "Тяжёлые повозки застревают на дороге между поселениями и пристанью. Островное управление наймёт дорожную артель и наладит подвоз материалов для постоянного сообщения с побережьем."
 NAM_island_public_works_unlock_tt:0 "В выбранном заморском округе: §G+1§! инфраструктуры после оплаченных дорожных работ."
 NAM_island_public_works_site_tt:0 "Заморский округ принадлежит Светлогорью, контролируется им и имеет менее §Y5§! уровней инфраструктуры"
 NAM_island_public_works_result_tt:0 "Через §Y42§! £time_texticon в выбранном округе: §G+1§! инфраструктуры. Работы занимают общее место строительства. При отмене обе оплаты возвращаются."
 NAM_island_public_works_delivered_tt:0 "В выбранном округе: §G+1§! инфраструктуры."
 NAM_island_public_works_refund_tt:0 "Дорожные работы отменены. Возврат Светлогорью: §G30§! £political_power_texticon и §G250§! £ADISCORD_economy_treasury_texticon; место строительства освобождается."
 NAM_island_public_works_cost:0 "§Y30§! £political_power_texticon §Y250§! £ADISCORD_economy_treasury_texticon"
