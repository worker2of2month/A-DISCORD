 ADISCORD_nam_groups.11.t: "Новое устройство Светлогорья"
 ADISCORD_nam_groups.11.d_iron: "В канцелярии сняли со стены старую схему подчинения и повесили новую. Линии на ней те же, только сходятся они теперь не к чужой столице, а к кабинету главы правительства. Наместники получили бессрочные назначения, коменданты гарнизонов - право ставить подпись рядом с их печатью, а жалобы из округов отныне идут по той же лестнице, по которой спускаются приказы.\n\nНа первом заседании нового правительства не было споров: каждый доклад заканчивался словом \"исполнено\". Мезенцев отметил в ведомости, что сборы впервые пришли в срок из всех округов. Ниже, мелким почерком, он добавил, сколько прошений за ту же неделю вернули без ответа.\n\nСветлогорье стало сильным и послушным. Осталось узнать, надолго ли."
 ADISCORD_nam_groups.11.d_service: "Наместников вызвали в канцелярию не за назначениями, а на экзамен. Комиссия из представителей округов и промысловых управлений задавала один и тот же вопрос: что вы сделали за последний год и кто может это подтвердить. Половина вышла из зала с прежними должностями, но уже без печатей: печать теперь хранится в управлении, а не в кармане начальника.\n\nПервый закон о гражданской службе подписали в присутствии людей, которых раньше оставляли ждать в коридоре. Жалобу на чиновника теперь можно подать, получить копию ответа и обжаловать отказ. Старые служащие ворчат, что работать стало медленнее; просители - что впервые знают, у кого спросить.\n\nСветлогорье стало государством служащих, а не печатей."
 ADISCORD_nam_groups.11.d_federation: "Совет округов собрался в бывшем здании наместничества: другого зала, где поместились бы делегаты всех районов, в Светлогорске не нашлось. Председатель совета Надежда Ладыгина открыла заседание не речью, а списком: какие доходы остаются округам, какие вопросы решает общий совет и как район может оспорить решение, с которым не согласен.\n\nАрхив наместников опечатали и передали историкам. Старую схему подчинения не стали снимать со стены, только повесили рядом карту, на которой у каждого округа своя граница и свой голос. Наместники, оставшиеся на службе, учатся писать отчёты тем, кому раньше отдавали приказы.\n\nСветлогорье стало союзом общин, связанных общим договором. Теперь этому договору предстоит выдержать первый спор о деньгах."
 ADISCORD_nam_groups.11.d_oil_union: "Кирилл Мезенцев открыл первое собрание Светлогорского Союза с ведомостью в руках. Промыслы переходят под совместное управление артелей и государства, а каждая бочка нефти записывается в общий договор: кто её добыл, кто перевёз и куда ушли деньги.\n\nВ Ключевске бурильщики впервые голосовали за управляющего, а не ждали его назначения. Конторы жалуются, что нефть теперь продаётся медленнее, зато в посёлках знают, сколько она стоит.\n\nСветлогорье стало государством нефтяников."
 ADISCORD_nam_groups.11.d_oil_union_rom:0 "Егор Ром сдал печать без церемонии: положил её на стол, попросил внести в опись и ушёл, не дожидаясь конца заседания. Кирилл Мезенцев открыл первое собрание Светлогорского Союза с ведомостью в руках. Промыслы переходят под совместное управление артелей и государства, а каждая бочка нефти записывается в общий договор: кто её добыл, кто перевёз и куда ушли деньги.\n\nВ Ключевске бурильщики впервые голосовали за управляющего, а не ждали его назначения. Конторы жалуются, что нефть теперь продаётся медленнее, зато в посёлках знают, сколько она стоит.\n\nСветлогорье стало государством нефтяников."
 ADISCORD_nam_groups.11.d_prag_republic: "Соглашение подписывали не в канцелярии, а в пустом пакгаузе Южной гавани: другого места, куда согласились прийти и округа, и казначеи, и правления хозяйственных объединений, в стране не нашлось. Текст зачитывали постатейно. После каждой статьи секретарь спрашивал, кто отвечает за её исполнение, и вписывал фамилию в соседний столбец.\n\nГлава правительства расписался последним, в той же графе, что и остальные. Арбитражу отвели комнату с двумя дверями, чтобы спорящие стороны не встречались в коридоре. В первый же месяц туда принесли одиннадцать жалоб. Девять из них решили по реестру обязательств, не поднимая дела до правительства.\n\nСветлогорье стало государством, где власть измеряют взятыми обязательствами. Теперь предстоит узнать, что случится, когда одно из них не исполнит само правительство."
 ADISCORD_nam_groups.11.d_prag_directorate: "Деловой совет собрался в зале, где прежде принимали иностранных покупателей. За длинный стол сели казначеи, управляющие промыслами, судовладельцы и подрядчики. Представителям округов поставили стулья вдоль стены: им разрешили слушать и задавать вопросы после голосования.\n\nЗаседание открыли ведомостью невыполненных договоров. К вечеру у каждой строки появились ответственный и срок, а у трёх - новый исполнитель. Протокол напечатали наутро и разослали в округа вместе с графиком поставок. В управах заметили, что график пришёл раньше, чем ответ на их собственные прошения.\n\nСветлогорье стало государством, которое исполняет подписанное. Осталось узнать, кто будет говорить за тех, с кем договоров не заключали."
 ADISCORD_nam_groups.11.a: "Таково новое Светлогорье."
