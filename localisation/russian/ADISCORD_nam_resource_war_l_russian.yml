 NAM_compact_paid_tt: "Начинаются §Y60§! £time_texticon дн. непрерывной работы гражданских служб Светлогорска.\nЕсли этот срок выдержан при нашем владении и контроле к началу ресурсной войны, договор предотвращает стартовое восстание.\nДозревание во время войны уже не меняет этот исход.\nПотеря владения или контроля обрывает договор; после возвращения округа его можно оплатить заново до войны."
 NAM_compact_signable_tt: "Светлогорск принадлежит нам и контролируется нами; договор ещё не подписан, ресурсная война ещё не началась и не завершилась."
 NAM_current_war_tt: "Идёт ресурсная война с Эфлором и Ажаром."
 NAM_victory_tt:0 "Ресурсная война завершена признанием независимости Светлогорья. §GОткрыты морские рейды§!: одна флотилия и четыре торговых пути при наличии допустимых целей."
 NAM_war_objective_tt: "§YУсловия победы§!\nКапитуляция противников либо на §Y420-й день§! войны счёт от §Y100§! и захваченный пограничный округ: Моренский округ, Лоренское порубежье, Средний Лорен или Ажарское взморье.\n\n§YНефтяной счёт§!\nСеверные месторождения: §Y80§!; Южнобережье: §Y36§!.\nСухоречье: §Y24§!; Восточное Сухоречье: §Y12§!; Светлогорский округ: §Y12§!.\n\n§YДругие исходы по сроку§!\nОт §Y100§! без пограничного округа: ничья на прежней границе, без признания и наказания соседей.\n§Y36-99§!: компромиссный мир.\nТаймер находится в национальных решениях."
 NAM_defend_fields: "Удержать нефтяной бассейн"
 NAM_defend_fields_desc: "Судьба Светлогорья решается у скважин, на дорогах и в пограничных округах. Штабы сверяют донесения, а правительство готовится защищать за столом переговоров то, что удержат войска."
 ADISCORD_nam_resource_war.109.t: "Под прежней фамилией"
 ADISCORD_nam_resource_war.109.d: "Егор Ром остановился на старой подписи. Чернила выцвели, край листа пожелтел, но фамилия читалась ясно. Когда он выводил её впервые, страна ещё называлась Вейранской империей, а сам он был обыкновенным писарем при дворе. Он знал, кому подать прошение, у кого придержать бумагу и к какому часу лучше принести её на подпись. Иногда требовалось быть незаметным, иногда - успеть раньше остальных. К великим замыслам это отношения не имело.\n\nКризис начался задолго до падения монархии. Во дворце его превращали в доклады, переносили из одной ведомости в другую, облекали в формулировки, с которыми можно было дожить до следующего заседания. За дворцовыми стенами жить становилось всё труднее. Потом взорвался реактор нулевой точки. После катастрофы накопившееся отчаяние вышло на улицы, и массовое восстание смело власть, чьи распоряжения Ром ещё недавно переписывал набело.\n\nУоркер и Дориан Воркс обещали свободу и новую жизнь. Люди слушали их, потому что прежней жизни больше не хотели. В официальных речах оба были выходцами из низших каст, поднявшимися вместе с народом против престола. Ром помнил, как уверенно они держались и как свободно обращались со словами, которым при дворе учились с детства. Порой ему казалось, что за новыми именами проступает что-то знакомое. Но память писаря не была доказательством, а расспрашивать о чужом прошлом он не спешил.\n\nРеволюционеры меняли фамилии. От прежнего имени можно было отказаться вместе со старым порядком, оставить его в бумагах, до которых теперь мало кому было дело. \"Уорк\" означало \"народ\"; название Воркерланда обещало страну тем, кто прежде не имел в ней голоса. Ром слушал эти объяснения и продолжал подписываться как раньше. Он не чувствовал себя человеком, родившимся заново. У него оставались почерк, привычки и умение исполнить поручение.\n\nМонархию сменила воркерландская диктатура. У приказов появились новые основания, у учреждений - новые начальники. Ром нашёл себе место и здесь: где-то оказался удобен, где-то вовремя проявил расторопность. Позднее ему доверили Светлогорье, последнюю колонию Воркерланда на западном материке. Бывший придворный писарь стал наместником. На бумаге это выглядело огромной переменой. Под назначением стояла чужая подпись, а под ответом о принятии должности - всё та же его собственная."
 ADISCORD_nam_resource_war.109.a: "Пора решать дела Светлогорья."
 ADISCORD_nam_resource_war.10.t: "Стол, за которым остались мы"
 ADISCORD_nam_resource_war.10.d: "Егор Ром попросил снять со стены схему подчинения. На ней каждая здешняя управа была связана с другой, та - с третьей, а все линии уходили к Воркерланду. Теперь за ними не было общего центра. На столе схема оказалась слишком большой: пришлось подогнуть самый верх. Страна, которой Ром служил, распалась; учреждения Светлогорья всё ещё должны были работать.\n\nКирилл Мезенцев положил рядом ведомость жалованья. Рабочие промыслов спрашивали, почему снова задержана выплата; в Светлогорске собирали подписи против поборов. Наместники требовали прежде восстановить дисциплину. Представители округов хотели увидеть счета. Ром выслушал всех. Он слишком хорошо знал, как легко составить ответ, после которого ничего не изменится.\n\nКогда-то людям обещали свободу и новую жизнь. Теперь ему самому приносили жалобы, которые можно было подшить, отправить наверх и перестать замечать. Для этого не требовалось ни жестокости, ни особой веры в государство. Достаточно было аккуратно выполнить свою часть работы. Так он служил много лет.\n\nРом не собирался становиться новым пророком. Он хотел, чтобы Светлогорье могло жить вне безумной машины Воркерланда и покровительства южных диктатур. Чужая защита снова означала бы чужие требования, а отвечать перед людьми пришлось бы здесь. Но и самостоятельность не наполняла казну. Нужно было сохранить учреждения, удержать промыслы и решить, чьи нужды больше нельзя откладывать.\n\nОн придвинул ведомость. Мезенцев подчеркнул три итоговые строки: долг перед всеми, долг перед промыслами и остаток, который можно перенести на следующий квартал. В Светлогорске ждали ответа на подписные листы, на промыслах - денег за отработанные смены, а в канцелярии надеялись, что ответ снова не понадобится. На этот раз подписывать предстояло решение, за которое Ром должен был отвечать сам."
 ADISCORD_nam_resource_war.10.a: "Рассчитаться с людьми сейчас."
 ADISCORD_nam_resource_war.10.b: "Сохранить деньги до следующего квартала."
 ADISCORD_nam_resource_war.10.c: "Сначала заплатить промыслам."
 NAM_rw_10_c_tt: "Поддержка групп:\n  Нефтяники: §G+8§! £NAM_support_oil_texticon\n  Округа: §R-5§! £NAM_support_dist_texticon"
 ADISCORD_nam_resource_war.close: "Этот вопрос уже принадлежит прошлому."
 NAM_spend_250_tt: "Казна: §R-250§! £ADISCORD_economy_treasury_texticon."
 ADISCORD_nam_resource_war.11.t: "Карта вместо ведомости"
 ADISCORD_nam_resource_war.11.d: "Дежурный офицер развернул перед Ромом карту дорог к промыслам. Из донесений пока было трудно понять, где стоят части, а где связь просто задерживается. Ром попросил отмечать время каждого сообщения. На вопрос о дороге к Северным месторождениям ему ответили числом батальонов. Он повторил вопрос: могут ли по ней пройти машины со снабжением?\n\nВ штабе ждали, что наместник утвердит подготовленные распоряжения. Ром узнавал знакомый порядок: сначала изложение обстановки, затем решение, которое желательно получить от начальства. Здесь ошибка могла стоить жизни людям, которых он никогда не видел. Он попросил отделить подтверждённые сведения от предположений и дать офицерам закончить доклад.\n\nМезенцев принёс письмо посредников. Тянуть войну на Юге бесконечно не позволят: к назначенному сроку промыслы пересчитают по тому, кто их держит, и мирный договор запишут этим счётом. Ром попросил повесить список месторождений рядом с картой, а напротив каждого вписать фамилию командира, который за него отвечает.\n\nОтдельно лежала сводка из Светлогорска. Город молчал, но жандармы знали, сколько винтовок ушло в погреба. Удержит ли его договор с округами или подполье выйдет на улицы в первые дни боёв, решалось уже не в штабе.\n\nУ телефона ждал следующий связист. Ром отодвинул чашку от края карты и попросил соединить его со штабом снабжения."
 ADISCORD_nam_resource_war.11.d_successor: "В штабе Светлогорья больше не спорят о том, кому принадлежит формулировка ультиматума. Дежурный офицер раскладывает карту дорог к промыслам: Северные месторождения, Светлогорский округ, Южнобережье, Сухоречье и Восточное Сухоречье. Каждый удержанный промысел станет строкой будущего мирного договора.\n\nПосредники уже назвали срок, после которого будут считать не батальоны, а скважины. Из Светлогорска приходят тревожные сводки: город ждёт, кто первым выстрелит на его улицах. Штаб снабжения просит связи."
 ADISCORD_nam_resource_war.11.a: "Выслушаем штаб снабжения."
 NAM_war_briefing_tt:0 "§YУСЛОВИЯ МИРА§!\nЧерез §Y420§! £time_texticon от начала войны.\nНефтяной счёт удерживаемых промыслов: Северные месторождения §Y80§!, Южнобережье §Y36§!, Сухоречье §Y24§!, Восточное Сухоречье и Светлогорский округ по §Y12§!.\n- §Y100+§! и захваченный пограничный округ Эфлора или Ажара: признание независимости, новая граница.\n- §Y100+§! без него: ничья, прежняя граница, без признания.\n- §Y36-99§!: уступки и дань.\n- Ниже §Y36§!: уход с материка на острова; без островов - раздел.\n\n§YДОСРОЧНЫЙ КОНЕЦ§!\nКапитуляция стороны; неделя контроля своих промыслов и всех пограничных округов соседей; либо неделя вражеского контроля Северных месторождений и ещё одного промысла.\n\n§YТЫЛ§!\nОплаченный договор с округами, непрерывно действовавший §Y60§! £time_texticon до войны под нашим владением и контролем, исключает восстание Светлогорска; иначе решает подполье. Чрезвычайные фокусы доступны независимо от мирных планов.\nЗахваченные скважины: до §R-30%§! £war_support_texticon и §R-20%§! выпуска военных заводов, соразмерно их доле в мощности бассейна. Повреждённые учитываются по состоянию, выжженные исключены на §Y180§! £time_texticon. Возврат снижает штраф, конец войны снимает.\n\n§YКУРС§!\nБаланс: §Y[?NAM_prewar_balance|=+1%]§!. Курс: §Y[NAMGetPrewarCourse]§!. Послевоенная ветка закреплена; устройство государства остаётся на выбор.\nТаймер и удержание промыслов - в решениях."
 NAM_war_terms_tt:0 "§YУСЛОВИЯ МИРА§!\nЧерез §Y420§! £time_texticon от начала войны - подсчёт нефти удерживаемых промыслов:\nСеверные месторождения §Y80§!; Южнобережье §Y36§!; Сухоречье §Y24§!; Восточное Сухоречье §Y12§!; Светлогорский округ §Y12§!.\n\n- §Y100+§! с захваченным пограничным округом Эфлора или Ажара: признание независимости, новая граница.\n- §Y100+§! без него: ничья, прежняя граница, без признания.\n- §Y36-99§!: компромисс, уступки и дань.\n- Ниже §Y36§!: потеря материка, уход на острова; без островов - раздел страны.\n\n§YДОСРОЧНЫЙ КОНЕЦ§!\n- Капитуляция одной из сторон.\n- Неделя контроля всех пограничных округов соседей и своих промыслов.\n- Враг неделю держит Северные месторождения и ещё один промысел.\n\n§YТЫЛ И ПРИКАЗЫ§!\nОплаченный договор с округами, действовавший §Y60§! £time_texticon до нападения, исключает восстание Светлогорска. Иначе решает сила подполья.\nОтсчёт и удержание промыслов - в решениях. Чрезвычайные фокусы открыты независимо от мирных планов."
 ADISCORD_nam_resource_war.12.t: "Послевоенное заседание"
 ADISCORD_nam_resource_war.12.d: "После подписания договора Мезенцев ещё раз прочитал статью о признании Светлогорья. Эфлор и Ажар признали его независимость. Их союз сохранился, пограничные части оставались на местах, но теперь переговоры с соседями можно было вести, ссылаясь на заключённое соглашение. Ром спросил, разосланы ли его условия в округа: там пока знали больше слухов, чем подробностей.\n\nНа заседании о послевоенном устройстве начальники управлений начали с недостатка людей и материалов. Затем выяснилось, что часть военных распоряжений они предлагают оставить в силе. Представители округов потребовали назвать срок: во время боёв многие вопросы откладывали, теперь они хотят знать, кто будет распоряжаться местными доходами и рассматривать жалобы.\n\nРом привык пользоваться временными полномочиями. С ними удавалось сократить согласования и добиться исполнения; без них придётся снова убеждать тех, кому вчера можно было приказать. Он не считал все возражения разумными, но помнил, как в Воркерланде очередная необходимость каждый раз отодвигала обещанный обычный порядок.\n\nВыбранный до войны курс нужно закрепить законом. Служебная вертикаль сохранит решающую роль центрального аппарата; хартия даст округам установленные права. Если выбор всё ещё отложен, предстоит определить его теперь. Ром попросил составителей обоих проектов объяснить, какие полномочия они оставляют за правительством и кому можно пожаловаться на его решение. Обсуждать предлагалось по одной статье, начиная с порядка рассмотрения жалоб."
 ADISCORD_nam_resource_war.12.d_standoff_successor: "Война закончилась на прежней границе. Эфлор и Ажар не подписали признания независимости Светлогорья; их союз сохранился. Военным складам требуется пополнение, округа ждут ремонта и возвращения к обычному управлению.\n\nНа послевоенном заседании начальники управлений предлагают сохранить часть чрезвычайных полномочий. Представители округов требуют определить их пределы и порядок обжалования решений. Выбранный до войны курс предстоит закрепить законом, не дожидаясь договора с соседями: служебная вертикаль сохранит ведущую роль центрального аппарата, хартия установит права округов. Если выбор откладывался, его нужно сделать теперь."
 ADISCORD_nam_resource_war.12.d_successor: "Эфлор и Ажар признали независимость Светлогорья. Их союз сохранился, а войска по-прежнему стоят на границе. Военным складам требуется пополнение; округа ждут ремонта и возвращения к обычному управлению.\n\nНа послевоенном заседании начальники управлений предлагают сохранить часть чрезвычайных полномочий. Представители округов требуют определить их пределы и порядок обжалования решений. Выбранный до войны курс предстоит закрепить законом: служебная вертикаль сохранит ведущую роль центрального аппарата, хартия установит права округов. Если выбор откладывался, его нужно сделать теперь."
 ADISCORD_nam_resource_war.12.d_standoff: "Мезенцев вернул Рому сообщение о прекращении войны: слово \"признание\" в нём пришлось вычеркнуть. Эфлор и Ажар согласились остановиться на прежней границе, но независимость Светлогорья договором не подтвердили. Ром велел объяснить это округам прямо. После стольких обещаний объявить достигнутым то, чего не было, казалось ему особенно неразумным.\n\nНа заседании о послевоенном устройстве начальники управлений начали с недостатка людей и материалов. Затем выяснилось, что часть военных распоряжений они предлагают оставить в силе. Представители округов потребовали назвать срок: во время боёв многие вопросы откладывали, теперь они хотят знать, кто будет распоряжаться местными доходами и рассматривать жалобы.\n\nРом привык пользоваться временными полномочиями. С ними удавалось сократить согласования и добиться исполнения; без них придётся снова убеждать тех, кому вчера можно было приказать. Он не считал все возражения разумными, но помнил, как в Воркерланде очередная необходимость каждый раз отодвигала обещанный обычный порядок.\n\nВыбранный до войны курс нужно закрепить законом. Служебная вертикаль сохранит решающую роль центрального аппарата; хартия даст округам установленные права. Если выбор всё ещё отложен, предстоит определить его теперь. Ром попросил составителей обоих проектов объяснить, какие полномочия они оставляют за правительством и кому можно пожаловаться на его решение. Обсуждать предлагалось по одной статье, начиная с порядка рассмотрения жалоб."
 ADISCORD_nam_resource_war.12.a: "Начнём обсуждение закона."
 ADISCORD_nam_resource_war.13.t: "Приём продолжается"
 ADISCORD_nam_resource_war.13.d: "На совещание с руководством национального университета, представителями округов и управляющими промыслами отвели полчаса. Университет хотел пригласить преподавателей и инженеров; учреждения ещё не договорились, кто оплатит им переезд и жильё. Ром рассчитывал успеть выслушать всех до вечернего приёма, но разговор задержался на первом же вопросе.\n\nОдин из университетских сотрудников предложил обратиться к прежнему воркерландскому положению. Оно оставляло решение за администрацией. Представитель округа спросил, кто тогда станет оплачивать жильё приезжим специалистам. Управляющий промыслом хотел знать, смогут ли приглашённые инженеры совмещать преподавание с работой у него. Ром слушал и делал короткие пометки. В таком разговоре он ориентировался лучше, чем на военном совете.\n\nСтарое положение он знал. Его удобство состояло в том, что назначение можно было оформить раньше, чем выяснятся все расходы. Когда начинались жалобы, отвечать приходилось другому ведомству. Ром уже открыл рот, чтобы предложить знакомый порядок, но попросил сначала досчитать жильё и жалованье. Управляющий напомнил о сроках.\n- Поэтому и спрашиваю сейчас, - ответил Ром. - Кто принимает человека и из каких средств ему платят?\n\nОтведённые полчаса прошли. В приёмной начали спрашивать, состоится ли следующий приём. Ром попросил секретаря назвать ожидающим причину задержки и остался за столом. Закон о послевоенном устройстве уже действовал, университет начал работу, заводам требовались заказы, а вернувшимся домой людям - заработок. Между этими делами ещё предстояло установить порядок, который можно будет соблюдать.\n\nСотрудник университета назвал сумму. Мезенцев переспросил, включено ли в неё содержание жилья. Ром вернулся к первой пометке и попросил не переходить к следующему вопросу, пока не договорятся об этом."
 ADISCORD_nam_resource_war.13.d_successor: "В архиве нашли старый бланк: герб чужой столицы, место для подписи наместника и длинная графа согласований. Молодой сотрудник спросил, можно ли использовать чистую обратную сторону. Архивист разрешил.\n\nНа новых бланках пишут о работе института, расходах округов, заводских заказах и возвращении людей домой. Споры никуда не исчезли. Одни считают аппарат слишком сильным, другие боятся, что его недостаточно. На границе по-прежнему стоят войска. Но теперь эти споры имеют адресата здесь, а не за пределами страны.\n\nВ гражданской канцелярии продолжается приём. Люди приходят узнать о работе, жилье и возвращении родных. Учреждениям предстоит выполнять принятые законы и отвечать на эти вопросы."
 ADISCORD_nam_resource_war.13.a: "Уточните расходы."
 ADISCORD_nam_resource_war.70.t: "Обращение Рома"
 ADISCORD_nam_resource_war.70.t_successor: "Обращение правительства"
 ADISCORD_nam_resource_war.70.d: "До выхода в эфир оставалось несколько минут. Ром попросил техника прочесть первую строку с его места: хотелось понять, насколько громко нужно говорить. Из динамика в соседней комнате донеслось привычное канцелярское приветствие, произнесённое чужим голосом. Ром поморщился и убрал обращение к \"руководителям округов и управлений\". Исправленный вариант начинался с жителей Светлогорья.\n\nНа столе лежали три проекта. Наместники предлагали заверить страну, что управления и гарнизоны исполняют свои обязанности, а распоряжения сохраняют силу. Представители округов и нефтяных артелей хотели услышать, когда местные доходы станут служить тем, кто здесь живёт и работает. Офицеры требовали ясно сказать соседям, что промыслы будут защищены. Каждый проект был подписан людьми, без которых правительство не справится.\n\nРом попробовал соединить их. Получилась речь, в которой всем обещали деньги, никто не терял полномочий, а безопасность не требовала жертв. Он дочитал её до середины и вернулся к отдельным листам. Во время революции такие обещания звучали убедительно. Позднее ему самому доводилось объяснять просителям, почему обещанное пока нельзя исполнить.\n\nТехник показал, что связь готова. На промыслах и в портах ждали начала; слушать будут и те, кто никогда не бывал в его приёмной. Ром оставил возле микрофона текст с пометками. Без него он мог слишком долго объяснять обстоятельства и так и не сказать, чего собирается добиваться. Следовало выбрать главное: сохранить управляемость, поставить местные нужды впереди прочих расходов или подтвердить готовность защищать месторождения."
 ADISCORD_nam_resource_war.70.d_successor: "Радиоузел Светлогорска впервые включили на все промыслы сразу. В бараках Ключевска сдвинули койки к репродукторам, в Южной гавани остановили погрузку, а в канцелярии чиновники стояли в коридоре, потому что в кабинетах не хватило стульев. Правительство готовит обращение; на столе лежат три варианта речи.\n\nПервый написали наместники: о порядке, о печатях, которые больше не подчиняются далёкой столице, и о том, что страна держится на людях, умеющих исполнять приказ. Второй принесли представители округов и нефтяных артелей: нефть Светлогорья должна кормить тех, кто её добывает, а не только тех, кто ставит подписи. Третий набросали офицеры гарнизонов, коротко, как рапорт: соседи ждут нашей слабости, и мы не отдадим им ни одной скважины.\n\nСлушатели будут судить о намерениях правительства по тому, чему оно отдаст предпочтение. Администрация ждёт подтверждения полномочий, жители - внимания к местным нуждам, гарнизоны - поддержки в защите промыслов."
 ADISCORD_nam_resource_war.70.a: "Подтвердить полномочия управлений и гарнизонов."
 ADISCORD_nam_resource_war.70.b: "Поставить нужды жителей и промыслов на первое место."
 ADISCORD_nam_resource_war.70.c: "Заявить о готовности защищать месторождения."
 NAM_rom_address_a_tt: "Поддержка групп:\n  Наместники: §G+5§! £NAM_support_nam_texticon\n  Гарнизоны: §G+5§! £NAM_support_garr_texticon\n  Округа: §R-3§! £NAM_support_dist_texticon"
 NAM_rom_address_b_tt: "Поддержка групп:\n  Нефтяники: §G+6§! £NAM_support_oil_texticon\n  Округа: §G+6§! £NAM_support_dist_texticon\n  Экспортные конторы: §R-3§! £NAM_support_trade_texticon"
 NAM_rom_address_c_tt: "Поддержка групп:\n  Гарнизоны: §G+5§! £NAM_support_garr_texticon\n  Экспортные конторы: §R-5§! £NAM_support_trade_texticon"
 NAM_compact_war_closed: "ресурсная война завершена"
 NAM_compact_ratified_status: "§Gдоговор принят к началу войны; восстание предотвращено§!"
 NAM_compact_wartime_unavailable: "§Yвоенная гарантия договора не действует§!"
 ADISCORD_nam_resource_war.10.before: "Из столицы по-прежнему приходили распоряжения. Одно требовало ускорить вывоз нефти, другое запрещало расходовать резерв, третье возвращало неподписанную смету. Егор Ром попросил снять со стены схему подчинения и разложить её на столе. Линий оказалось больше, чем свободного места. Воркерланд ещё существовал, и ни одна из этих линий не освобождала местное правительство от ответственности за происходящее.\n\nКирилл Мезенцев положил рядом ведомость жалованья. Рабочие промыслов спрашивали, почему снова задержана выплата; в Светлогорске собирали подписи против поборов. Наместники требовали прежде восстановить дисциплину. Представители округов хотели увидеть счета. Ром выслушал всех. Он слишком хорошо знал, как легко составить ответ, после которого ничего не изменится.\n\nКогда-то людям обещали свободу и новую жизнь. Теперь ему самому приносили жалобы, которые можно было подшить, отправить наверх и перестать замечать. Для этого не требовалось ни жестокости, ни особой веры в государство. Достаточно было аккуратно выполнить свою часть работы. Так он служил много лет.\n\nРом не собирался становиться новым пророком. Он хотел, чтобы Светлогорье могло жить вне безумной машины Воркерланда и покровительства южных диктатур. Чужая защита снова означала бы чужие требования, а отвечать перед людьми пришлось бы здесь. Но и самостоятельность не наполняла казну. Нужно было сохранить учреждения, удержать промыслы и решить, чьи нужды больше нельзя откладывать.\n\nОн придвинул ведомость. Мезенцев подчеркнул три итоговые строки: долг перед всеми, долг перед промыслами и остаток, который можно перенести на следующий квартал. В Светлогорске ждали ответа на подписные листы, на промыслах - денег за отработанные смены, а в канцелярии надеялись, что ответ снова не понадобится. На этот раз подписывать предстояло решение, за которое Ром должен был отвечать сам."
 NAM_compact_interrupted_status: "§Yместная служба прервана; восстание уже предотвращено§!"
 NAM_south_final_ready_tt: "Ресурсный вопрос закрыт, кампании возвращения завершены. Наступил 2165 год, обе стороны выполнили ключевые фокусы, предупреждение о войне началось. Подробности - в разделе войны за Юг."
 NAM_south_war_leader_tt: "Идёт война за Юг, и Светлогорье возглавляет северную сторону"
 NAM_south_final_not_started_tt: "Война за Юг ещё не началась"
 NAM_south_seal_over_furnaces:0 "План южной кампании"
 NAM_south_seal_over_furnaces_desc: "Шахрабадский посланник выслушивает обращение канцелярии, не снимая дорожных перчаток. Ром ждёт ответа. За спиной секретаря офицер молча отмечает что-то в своей записной книжке."
 NAM_south_seal_over_furnaces_tt: "Фокус готовит объявление §Yвойны за Юг§! после окончания общего предупреждения.\nКаждое независимое государство пустынь выберет сторону.\nПри победе Шахрабад и его союзники станут §Yнаместничествами Светлогорья§!."
 NAM_south_oil_charter: "Хартия против картеля"
 NAM_south_oil_charter_desc: "Нефтяная хартия обещает соседям топливо и самоуправление. Печи Шахрабада предлагают выкуп, долг и монополию. На Юге может остаться только один договор."
 NAM_south_oil_charter_tt: "Фокус готовит объявление §Yвойны за Юг§! после окончания общего предупреждения.\nКаждое независимое государство пустынь выберет сторону.\nПри победе Шахрабад и его союзники сохранят администрации и войдут в §YНефтяную хартию§!."
 NAM_south_black_basin:0 "Южная политика"
 NAM_south_black_basin_desc: "Ажар потерял войну, но сохранил свои склады и гарнизоны. Наместническая лестница требует, чтобы Чёрный бассейн получил наместника Светлогорья."
 NAM_south_black_basin_tt: "§YАжар§! получает требование стать наместничеством Светлогорья. Если он откажется, мы объявим ему войну за полное присоединение."
 NAM_south_desert_offices:0 "Соглашения с южными государствами"
 NAM_south_desert_offices_desc: "Посланцы Светлогорска готовятся к поездке в южные столицы. На столе лежат верительные грамоты и образцы окружных печатей. Военный сопровождающий просит ещё раз прочесть инструкции вслух."
 NAM_south_desert_offices_tt: "§YКадир§! и §YЭфлор§! получают требование стать наместничествами Светлогорья. Если страна откажется, мы объявим ей войну за полное присоединение."
 NAM_south_oil_for_water: "Нефть за воду"
 NAM_south_oil_for_water_desc: "У Светлогорья есть топливо, у пустынь есть вода и дороги. Нефтяная хартия предлагает Фенну, Рахме, Сардану и даже Ажару общий договор вместо вечного торга."
 NAM_south_oil_for_water_tt: "§YФенн§!, §YРахма§!, §YСардан§! и §YАжар§! получают приглашение вступить в союз Светлогорья. Отказ не ведёт к войне."
 NAM_south_fenn_guarantee: "Гарантия Фенна"
 NAM_south_fenn_guarantee_desc: "Эфлор по-прежнему считает Фенн мятежной провинцией. Хартия требует от Эфлора войти в договор на общих условиях и оставить Фенн в покое."
 NAM_south_fenn_guarantee_tt: "§YЭфлор§! получает требование войти в Нефтяную хартию как сателлит. Если он откажется, мы объявим ему войну за полное присоединение."
 NAM_administration_dynamic:0 "[NAMGetAdministrationTitle]"
 NAM_administration_dynamic_desc: "Наместническая лестница превратилась в правительство. Каждая реформа меняет одну и ту же канцелярию: её подписи, сметы, промыслы и отношения с округами.\n\n\n\n\n\n £GFX_RUS_chancery_mandate_banner \n\n\n"
 NAM_garrison_dynamic:0 "Армия Светлогорья"
 NAM_garrison_dynamic_desc:0 "Гарнизоны промыслов и окружные части становятся армией самостоятельного государства. Общий штаб сводит их опыт, снабжение и подготовку в единую систему."
 NAM_seal_registry:0 "Реформа государственного управления"
 NAM_seal_registry_desc: "Каждая печать получает номер, каждый наместник - срок отчёта. Лестница, которую строила империя, теперь служит Светлогорью и считает его деньги."
 NAM_namestnik_garrisons: "Гарнизоны наместников"
 NAM_namestnik_garrisons_desc: "Наместник приезжает на утренний развод окружного гарнизона. Командир докладывает обстановку, придерживая карту от ветра. У ворот жители ждут окончания церемонии со своими прошениями."
 NAM_oil_quotas: "Нефтяные квоты"
 NAM_oil_quotas_desc: "В министерской приёмной нефтяные управляющие сверяют присланные ведомости. Цифры на бумаге не сходятся с их сменными журналами. Диспетчер просит сначала выслушать мастеров с дальних промыслов."
 NAM_ladder_of_seals:0 "Единая система управления"
 NAM_ladder_of_seals_desc: "Лестница достроена: каждая ступень знает своё место, каждый приказ - свой путь."
 NAM_district_council: "Совет округов"
 NAM_district_council_desc: "Окружные делегаты занимают места в общем зале. Перед каждым лежит наказ местного собрания, исписанный разными почерками. Председатель долго ищет тему, с которой согласны начать все."
 NAM_oil_fund: "Нефтяной фонд"
 NAM_oil_fund_desc: "Казначей хартии принимает представителей нефтяных артелей. Они принесли ведомости своих смен и письма от соседей. На заседании то и дело возвращаются к вопросу, кто вправе говорить от имени промыслов."
 NAM_district_militia: "Окружное ополчение"
 NAM_district_militia_desc: "Каждый район держит собственное ополчение. Оно не заменит армию, но не отдаст свои промыслы без боя."
 NAM_common_fuel_market: "Общий рынок топлива"
 NAM_common_fuel_market_desc: "Хартия устанавливает единые правила продажи топлива. Соседи покупают по договору, а не по милости наместника."
 NAM_south_war_council: "Военный совет Юга"
 NAM_south_war_council_desc: "Война за Юг требует одного штаба. Совет собирает командиров округов, нефтяников и союзников за одним столом."
 NAM_south_oil_tap: "Нефтяной кран"
 NAM_south_oil_tap_desc: "На карте юга нефтяники проводят линии к шахрабадским печам. Штабист просит отметить последний знакомый им перевал. У каждой линии оказывается свой проводник и своя история."
 NAM_south_field_fortresses: "Крепости промыслов"
 NAM_south_field_fortresses_desc: "Сапёр идёт с буровым мастером по окраине Светлогорского округа. На плане надо отметить каждую низину и старую канаву. Мастер узнаёт место, где до войны стоял дом его товарища."
 NAM_south_counteroffensive: "Контрнаступление на печи"
 NAM_south_counteroffensive_desc: "Оборона выиграла время. Теперь армия Светлогорья идёт к печам, пока Шахрабад не восстановил силы."
 NAM_south_heritage: "Наследство Юга"
 NAM_south_heritage_desc: "В Светлогорск съезжаются делегации южных городов. В приёмной канцелярии звучат разные языки, а секретари сверяют титулы и порядок выступлений. За дверями зала каждый репетирует собственное обращение."
 NAM_south_war_council_idea: "Военный совет Юга"
 NAM_south_war_council_idea_desc: "Единый штаб координирует округа и союзников до конца войны за Юг."
 NAM_south_counteroffensive_idea: "Контрнаступление на печи"
 NAM_south_counteroffensive_idea_desc: "Армия Светлогорья наступает, пока у противника не кончилось топливо."
 NAM_district_audit: "Ревизия окружных счетов"
 NAM_district_audit_desc: "Ревизоры канцелярии прибудут в округа со списками платежей и полномочиями проверить местные книги. Представителям управ предстоит объяснить каждое расхождение."
 NAM_charter_fuel_aid: "Топливо хартии"
 NAM_charter_fuel_aid_desc: "Совет обсуждает просьбу союзников о горючем. Портовые и сухопутные службы согласуют маршрут, чтобы передать груз уполномоченным представителям получателя."
 NAM_south_cut_fuel: "Перекрыть топливо"
 NAM_south_cut_fuel_desc: "Караваны и трубопроводы, ведущие к печам Шахрабада, получают приказ остановиться. Пограничным службам предстоит закрыть пути, которыми торговцы привыкли пользоваться без лишних вопросов."
 NAM_charter_members_tt: "Хотя бы одно государство Юга состоит в союзе Светлогорья"
 NAM_charter_fuel_aid_tt: "Только [FROM.GetName] получает §G25000§! £fuel_texticon и §G+3%§! £stability_texticon. С нашего склада списывается ровно §Y25000§! £fuel_texticon."
 NAM_public_campaigns:0 "Пропаганда независимого Светлогорья"
 NAM_public_campaigns_desc:0 "Свободно: §Y[?ADISCORD_available_campaign_slots|0]§! £operatives_propaganda_texticon\nБазовое место: §Y1§!. Оплаченная сеть радио и печати добавляет второе. Колониальные кампании прекращаются с распадом метрополии."
 NAM_campaign_slot_available_tt: "Есть свободное место для кампании: §Y[?ADISCORD_available_campaign_slots|0]§!"
 NAM_campaign_start_cooldown_30_tt: "Занимает одно место пропаганды до завершения. Повторный запуск через §Y30§! £time_texticon дн. после завершения."
 NAM_campaign_start_cooldown_60_tt: "Занимает одно место пропаганды до завершения. Повторный запуск через §Y60§! £time_texticon дн. после завершения."
 NAM_campaign_start_cooldown_70_tt: "Занимает одно место пропаганды до завершения. Повторный запуск через §Y70§! £time_texticon дн. после завершения."
 NAM_campaign_start_cooldown_75_tt: "Занимает одно место пропаганды до завершения. Повторный запуск через §Y75§! £time_texticon дн. после завершения."
 NAM_campaign_start_cooldown_80_tt: "Занимает одно место пропаганды до завершения. Повторный запуск через §Y80§! £time_texticon дн. после завершения."
 NAM_campaign_cancel_tt: "Кампания прекращается, место пропаганды освобождается. Оплата не возвращается."
 NAM_operation_repeat_after_completion_30_tt: "Повторный запуск через §Y30§! £time_texticon дн. после завершения."
 NAM_operation_repeat_60_tt: "Повторный запуск через §Y60§! £time_texticon дн."
 NAM_campaign_second_slot_tt: "Доступно ещё §G1§! место для пропагандистских кампаний."
 NAM_campaign_oil_is_ours: "§YПРОПАГАНДА:§! Нефть принадлежит Светлогорью"
 NAM_campaign_oil_is_ours_unlock_tt:0 "После применения решения: временно укрепляет поддержку войны и организацию армии."
 NAM_campaign_oil_is_ours_desc: "Плакаты на промыслах напоминают, что соседи называют эту землю своей. Каждая вышка - граница, которую придётся защищать."
 NAM_campaign_every_seal_counts: "§YПРОПАГАНДА:§! Каждая печать на счету"
 NAM_campaign_every_seal_counts_unlock_tt:0 "После применения решения: постепенно укрепляет стабильность во время кампании."
 NAM_campaign_every_seal_counts_desc: "Канцелярия публикует отчёты округов и обещает, что ни одна подпись не пропадёт бесследно. Порядок становится заметным."
 NAM_campaign_wages_on_time:0 "Программа своевременных выплат"
 NAM_campaign_wages_on_time_unlock_tt:0 "После применения решения: оплачиваемая социальная программа снижает потребительскую нагрузку и укрепляет стабильность; место для пропаганды не требуется."
 NAM_campaign_wages_on_time_desc: "Газеты печатают графики выплат, а инспекторы сверяют обещания с ведомостями. У проходных рабочие ищут в свежем номере название своего предприятия. Казначейству предстоит ответить за каждую напечатанную дату."
 NAM_campaign_ladder_holds: "§YПРОПАГАНДА:§! Лестница держит"
 NAM_campaign_ladder_holds_unlock_tt:0 "После применения решения: временно увеличивает политическое влияние правительства и сбор налогов."
 NAM_campaign_ladder_holds_desc: "Наместники объясняют, что вертикаль защищает каждого от хаоса распада. На собраниях зачитывают обращения канцелярии, а у дверей управ вывешивают портреты начальников. Под каждым портретом стоит имя человека, которому жители несут свои просьбы."
 NAM_campaign_charter_of_districts: "§YПРОПАГАНДА:§! Хартия районов"
 NAM_campaign_charter_of_districts_unlock_tt:0 "После применения решения: временно укрепляет стабильность и ускоряет строительство."
 NAM_campaign_charter_of_districts_desc: "Районы рассказывают о школах, мостах и мастерских, построенных по общей хартии. На страницах газет появляются имена учителей и мастеров, которых читатели знают лично. Делегаты привозят эти номера на окружные собрания."
 NAM_campaign_furnaces_threaten_the_desert: "§YПРОПАГАНДА:§! Печи грозят пустыне"
 NAM_campaign_furnaces_threaten_the_desert_desc: "Канцелярия показывает Шахрабад жадным картелем, который хочет сжечь чужую нефть в своих печах. Юг должен выбрать, кому верить."
 NAM_supports: "Опоры Светлогорья"
 NAM_supports_desc:0 ""
 NAM_loyalty_dynamic: "Опоры Светлогорья"
 NAM_loyalty_dynamic_desc: "Власть Светлогорья держится на пяти группах. Их поддержка, умноженная на вес во власти, определяет лояльность государства."
 NAM_supports_council: "Совет опор"
 NAM_supports_council_desc:0 "Наместники, нефтяники, округа, гарнизоны и экспортные конторы садятся за один стол. Каждая сторона принесла свои заявки. Инженеры сверят обещания подрядчиков со сметами, а канцелярия закрепит за каждой подписью конкретное обязательство."
 NAM_supports_oil_compact: "Договор с промыслами"
 NAM_supports_oil_compact_desc: "Нефтяные старшины приехали на переговоры прямо со смены. В папках рядом с проектом договора лежат письма рабочих семей. Представитель торгового дома просит дать ему слово после них."
 NAM_supports_export_houses: "Экспортные дома"
 NAM_supports_export_houses_desc: "В канцелярии собрались управляющие экспортных контор. На столе тесно от привезённых образцов договоров. За дверью нефтяной старшина ждёт приглашения, перечитывая наказ своей артели."
 NAM_ladder_ending_iron:0 "Исполнительная власть"
 NAM_ladder_ending_iron_desc: "Ром принимает наместников в зале, где ещё висит герб исчезнувшей империи. Никто не предлагает его снять. Секретарь читает проект государственного устройства, и знакомые титулы звучат в нём непривычно торжественно."
 NAM_ladder_ending_service:0 "Служебная республика"
 NAM_ladder_ending_service_desc: "Лестница превращается в гражданскую службу. За дверью канцелярии ждут делегаты округов и промыслов; секретарь по очереди вписывает их имена в повестку. Наместникам предстоит отвечать на вопросы людей, которым они прежде только отдавали приказы."
 NAM_charter_ending_federation: "Учредить федерацию"
 NAM_charter_ending_federation_desc: "Делегаты округов съезжаются в Светлогорск с наказами своих собраний. В зале спорят до позднего вечера, а секретари едва успевают сверять поправки. Наместническая лестница остаётся в прошлом."
 NAM_charter_ending_oil_union: "Учредить Союз"
 NAM_charter_ending_oil_union_desc: "Промыслы становятся сердцем государства. В зале совета пахнет машинным маслом: делегаты приехали прямо со смены и разложили перед собой журналы бригад. Казённые писари привыкают к новым собеседникам."
