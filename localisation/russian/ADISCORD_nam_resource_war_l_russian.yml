 NAM_agreement_oil_pillar:0 "Нефтяники"
 NAM_agreement_dist_pillar:0 "Округа"
 NAM_agreement_garr_pillar:0 "Гарнизоны"
 NAM_agreement_trade_pillar:0 "Экспортные конторы"
 NAM_agreement_district_order_open_tt:0 "По этому соглашению ещё нет оплаченной окружной стройки"

 NAM_pw_constitutional_committee:0 "Конституционная комиссия"
 NAM_pw_constitutional_committee_desc:0 "Чрезвычайные распоряжения помогли пережить войну. Теперь стране нужен определённый порядок принятия решений и ответственности за них."
 NAM_pw_cabinet_statute:0 "Полномочия правительства"
 NAM_pw_cabinet_statute_desc:0 "Министры до сих пор подписывают распоряжения на бланках военного времени, и никто не скажет, где кончается власть одного ведомства и начинается власть другого. Статут закрепит за кабинетом право утверждать общий хозяйственный план."
 NAM_pw_state_chamber:0 "Бюджетный надзор"
 NAM_pw_state_chamber_desc:0 "Сметы военных лет принимали за закрытыми дверями. Теперь каждая статья расходов пройдёт через палату, где представители округов смогут спросить, на что ушли их нефтяные деньги."
 NAM_pw_cadastre:0 "Земельный кадастр"
 NAM_pw_cadastre_desc:0 "У одного участка в порту нашлось несколько старых планов. Арендатор показывает расписку, чиновник - запись в казённой книге. Землемер просит обоих пройти с ним к уцелевшему межевому камню."
 NAM_program_cadastre:0 "Сдать казённую землю в аренду"
 NAM_program_cadastre_desc:0 "Землемер раскладывает старые планы рядом с долговыми книгами. Участки на них названы по-разному. Пришедший свидетель узнаёт межу по рисунку давно срубленного дерева."
 NAM_program_cadastre_cost:0 "§Y500§! £ADISCORD_economy_treasury_texticon"
 NAM_program_cadastre_cost_blocked:0 "§Y500§! £ADISCORD_economy_treasury_texticon"
 NAM_program_cadastre_cost_tooltip:0 "§Y500§! £ADISCORD_economy_treasury_texticon"
 NAM_program_cadastre_result_tt:0 "По завершении: казна получает §G+20§! £ADISCORD_economy_treasury_texticon в неделю. Передать те же земли округам уже не получится."
 NAM_program_cadastre_unlock_tt:0 "После применения решения: создаёт постоянный доход от земельной ренты, исключая передачу этих земель округам."
 NAM_pw_civil_payroll:0 "Оклады государственных служащих"
 NAM_pw_civil_payroll_desc:0 "Уездные канцелярии по-разному ведут дела и толкуют распоряжения столицы. Государственной службе предстоит наладить повседневную работу."
 NAM_pw_provincial_records:0 "Окружные архивы"
 NAM_pw_provincial_records_desc:0 "В одной описи пустырь числится за сельской общиной, в другой на том же месте стоит казённый склад. Землемерам предстоит пройти межи с местными жителями, а писарям - сшить разрозненные листы в книги, по которым можно рассудить владельцев."
 NAM_pw_register_district_titles:0 "Восстановить окружную межевую книгу"
 NAM_pw_register_district_titles_desc:0 "Землемер сверяет довоенный план с уцелевшими межевыми знаками. Жители приносят купчие и называют свидетелей. Старый писарь узнаёт собственный почерк на документе, считавшемся потерянным."
 NAM_pw_register_district_titles_unlock_tt:0 "После применения решения: открывает место для строительства и укрепляет подчинение в присоединённых округах под оккупационным управлением."
 NAM_pw_district_title_books:0 "Окружная межевая книга"
 NAM_pw_central_civil_district_tt:0 "Независимое Светлогорье владеет областью, контролирует её и осуществляет здесь прямое гражданское управление."
 NAM_pw_administrative_courts:0 "Административные суды"
 NAM_pw_administrative_courts_desc:0 "Подрядчик ждёт решения о сносе перегородки, вдова оспаривает военный приказ о выселении, а обе бумаги месяцами лежат у одного коменданта. Правительство отправит в округа выездных судей с правом отменять распоряжения местной администрации."
 NAM_pw_hear_district_appeals:0 "Назначить выездную сессию суда"
 NAM_pw_hear_district_appeals_desc:0 "Судьи принимают жалобы на реквизиции и спорные отводы земли. Пока секретарь разбирает свидетельские показания, приставы снимают печати со дворов, по которым уже вынесено решение."
 NAM_pw_hear_district_appeals_unlock_tt:0 "После применения решения: ускоряет местное строительство и смягчает оккупационное управление; межевые книги усиливают результат."
 NAM_pw_civil_court_awards:0 "Решения выездного суда"
 NAM_pw_public_procurement:0 "Открытые государственные закупки"
 NAM_pw_public_procurement_desc:0 "Поставщика для казённой стройки привыкли выбирать по знакомству с начальником канцелярии. Условия торгов начнут вывешивать на дверях управ, а заявки вскрывать при свидетелях."
 NAM_pw_central_treasury:0 "Центральное казначейство"
 NAM_pw_central_treasury_desc:0 "Окружные кассы хранят казённые деньги в собственных сейфах и сверяются со столицей раз в квартал. Казначейство сведёт их книги в один счёт и будет знать остаток на каждый вечер."
 NAM_pw_industrial_commission:0 "Промышленная комиссия"
 NAM_pw_industrial_commission_desc:0 "Предприятия требуют оборудования, а казначейство - обоснованных смет. Государственные вложения должны опираться на потребности отраслей."
 NAM_pw_tool_reserve:0 "Резерв станочного оборудования"
 NAM_pw_tool_reserve_desc:0 "После войны на складах Южной гавани остались станки, заказанные для цехов, которых уже нет. Комиссия перепишет их поштучно и решит, какой завод получит каждый из них."
 NAM_program_tool_reserve:0 "Запустить станочный цех в Южной гавани"
 NAM_program_tool_reserve_desc:0 "Предприятия требуют оборудования, а казначейство - обоснованных смет. Государственные вложения должны опираться на потребности отраслей."
 NAM_program_tool_reserve_cost:0 "§Y900§! £ADISCORD_economy_treasury_texticon"
 NAM_program_tool_reserve_cost_blocked:0 "§Y900§! £ADISCORD_economy_treasury_texticon"
 NAM_program_tool_reserve_cost_tooltip:0 "§Y900§! £ADISCORD_economy_treasury_texticon"
 NAM_program_tool_reserve_result_tt:0 "Резерв передаёт §G350§! £support_equipment_texticon. Заказы гражданского машиностроения получат ещё §G180§! £motorized_texticon, военного - §G180§! £support_equipment_texticon, пока мы удерживаем гавань."
 NAM_program_tool_reserve_unlock_tt:0 "После применения решения: закупает снаряжение поддержки и усиливает последующие машиностроительные заказы, пока гавань удерживается нами."
 NAM_pw_public_supply:0 "Государственное снабжение"
 NAM_pw_public_supply_desc:0 "Полковые интенданты закупают муку и сукно у тех же торговцев, что и городские управы, и перебивают друг другу цену. Единая заявка положит конец этому торгу."
 NAM_pw_industrial_credit:0 "Промышленный кредит"
 NAM_pw_industrial_credit_desc:0 "Заводу проще выпросить новый военный заказ, чем ссуду на крышу для литейного цеха. Казна откроет предприятиям долгий кредит под залог будущей продукции."
 NAM_pw_export_guarantees:0 "Экспортные гарантии"
 NAM_pw_export_guarantees_desc:0 "Промысловый управляющий принёс в казначейство письмо зарубежного покупателя. Оно прошло через несколько переводчиков и всё ещё вызывает споры. Поверенный раскладывает рядом прежнюю переписку."
 NAM_hire_relief_shift:0 "Нанять смену для работ в бассейне"
 NAM_hire_relief_shift_desc:0 "Подрядчики составили сменный график. Бригадир отмечает фамилии прибывших, проверяет инструмент и ждёт наряда от диспетчера. Люди ещё не знают, к какой вышке их отправят первым рейсом."
 NAM_labour_shift_result_tt:0 "На §Y90§! £time_texticon дн. появляется место ещё для одного проекта на карте бассейна.\nПо окончании найма или при утрате независимости §G600§! £manpower_texticon возвращаются в резерв.\nОплаченные стройки можно закончить и после ухода смены.\nПлата за найм расходуется сразу."
 NAM_hire_relief_shift_unlock_tt:0 "После применения решения: на время найма можно вести ещё один проект на карте бассейна."
 NAM_labour_shift_cash_price:0 "300 £ADISCORD_economy_treasury_texticon"
 NAM_labour_shift_fund_price:0 "Резервный фонд"
 NAM_labour_shift_cost:0 "§Y600§! £manpower_texticon  §Y[NAMLabourShiftPay]§!"
 NAM_labour_shift_cost_blocked:0 "§R600§! £manpower_texticon  §R[NAMLabourShiftPay]§!"
 NAM_labour_shift_cost_tooltip:0 "§Y600§! £manpower_texticon  §Y[NAMLabourShiftPay]§!"
 NAM_labour_shift_three_slots:0 "3 (со сменой)"
 NAM_labour_shift_two_slots:0 "2 (со сменой)"
 NAM_labour_inspection_receipts_tt:0 "При отмене заказа, оформленного под надзором инспекции, вместе с денежным задатком возвращается сбор за разрешение: ремонт скважин §G25§!, малый НПЗ §G40§!, нефтепровод §G35§!, морской терминал §G30§! £political_power_texticon."
 NAM_labour_mediation_tt:0 "Оплаченное урегулирование снимает действующий штраф сорванного соглашения с промыслами или округами.\nКогда кризиса нет, комиссии могут отдельно погасить один такой спор за §Y75§! £political_power_texticon и §Y600§! £ADISCORD_economy_treasury_texticon.\nПервым рассматривается спор промыслов."
 NAM_social_budget_shift_tt:0 "Если в казне меньше §Y300§! £ADISCORD_economy_treasury_texticon, найм рабочей смены можно оплатить из заранее пополненного резервного фонда. Средства фонда расходуются целиком."
 NAM_labour_shift_base_slots:0 "[?NAM.NAM_project_slots|0]"
 NAM_pw_labour_code:0 "Трудовой кодекс"
 NAM_pw_labour_code_desc:0 "До сих пор каждый промысел нанимал людей по своим правилам. В трудовом кодексе запишут срок найма, ставку и право вернуться домой после окончания смены."
 NAM_pw_company_housing:0 "Ведомственное жильё"
 NAM_pw_company_housing_desc:0 "За государственными заказами стоят рабочие и их семьи. Их положение нельзя оставлять на усмотрение начальника предприятия."
 NAM_program_company_housing:0 "Построить жильё для заводских смен"
 NAM_program_company_housing_desc:0 "За государственными заказами стоят рабочие и их семьи. Их положение нельзя оставлять на усмотрение начальника предприятия."
 NAM_program_company_housing_cost:0 "§Y850§! £ADISCORD_economy_treasury_texticon"
 NAM_program_company_housing_cost_blocked:0 "§Y850§! £ADISCORD_economy_treasury_texticon"
 NAM_program_company_housing_cost_tooltip:0 "§Y850§! £ADISCORD_economy_treasury_texticon"
 NAM_program_company_housing_result_tt:0 "Город получает §G3§! участка для застройки и §G120§! £motorized_texticon. Пока жильё в наших руках, гарнизоны комплектуются без потери доверия округов."
 NAM_program_company_housing_unlock_tt:0 "После применения решения: развивает городской участок и транспорт; действующее жильё позволяет снабжать гарнизоны без потери доверия округов."
 NAM_pw_insurance_fund:0 "Государственное страхование"
 NAM_pw_insurance_fund_desc:0 "После пожара промысловые старшины приносят в канцелярию обгоревшие ведомости. Страховой поверенный задаёт вопросы о последней смене. Мастер каждый раз возвращается к людям, чьи имена исчезли вместе с бумагой."
 NAM_pw_insurance_claim_tt:0 "Раз в §Y180 дней§! страховая касса покрывает пожар на Северной скважине или стачку нефтяников. Казна и чрезвычайный фонд остаются в распоряжении правительства."
 NAM_claim_industrial_cover:0 "Предъявить полис промыслов."
 NAM_industrial_claim_used_tt:0 "Страховая касса погасит происшествие. Следующее возмещение доступно через §Y180 дней§!."
 NAM_pw_technical_training:0 "Производственные училища"
 NAM_pw_technical_training_desc:0 "Молодой рабочий спрашивает мастера о незнакомом резце. Тот начинает объяснение прямо у остановленного станка. К ним подходят ученики соседнего цеха со своими записными книжками."
 NAM_pw_family_pensions:0 "Пенсии семьям военнослужащих"
 NAM_pw_family_pensions_desc:0 "В полковой приёмной женщины спрашивают о переводе своих родных. Писарь ищет фамилии в дорожной ведомости. На столе перед ним лежат детские письма, которые просят переслать вместе со служебной почтой."
 NAM_pw_family_pensions_claim_tt:0 "При дезертирстве из-за задержки жалованья можно рассчитаться с семьями через окружные кассы. Гарнизон сохраняет людей, чрезвычайный фонд остаётся в резерве."
 NAM_claim_pension_arrears:0 "Рассчитаться с семьями по окружным ведомостям."
 NAM_garrison_families_paid_tt:0 "Семьи получат деньги из пенсионного бюджета. Гарнизон останется на службе."
 NAM_pw_labour_inspection:0 "Трудовая инспекция"
 NAM_pw_labour_inspection_desc:0 "На спорную стройку приехал инспектор. Подрядчик показывает ему разрешение, а местный пристав - совсем другое распоряжение. Рабочие сидят у ограды, пока чиновники сверяют даты."
 NAM_pw_employment_offices:0 "Бюро трудоустройства"
 NAM_pw_employment_offices_desc:0 "Демобилизованный солдат обходит проходные одну за другой, а в соседнем округе цех не может набрать смену. Бюро сведут вместе списки ищущих работу и заявки предприятий."
 NAM_pw_arbitration_commissions:0 "Трудовой арбитраж"
 NAM_pw_arbitration_commissions_desc:0 "Представители промысла и подрядчика занимают противоположные концы стола. Между ними лежит незаконченный акт приёмки. Председатель комиссии просит каждого назвать, с какой строки начался спор."
 NAM_pw_public_works_contract:0 "Общественные работы"
 NAM_pw_public_works_contract_desc:0 "В Сухоречье вагоны простаивают у мастерских, пока подрядчики ищут машины для разгрузки. Железнодорожники предложили вести общий наряд на составы и автоколонны."
 NAM_program_public_works_contract:0 "Открыть дорожные мастерские Сухоречья"
 NAM_program_public_works_contract_desc:0 "Путейцы и механики обсуждают наряд во дворе мастерских. Водитель показывает следы поломки на разгрузочной рампе. Пока начальники спорят над бумагами, рабочие измеряют повреждённую балку."
 NAM_program_public_works_contract_cost:0 "§Y650§! £ADISCORD_economy_treasury_texticon"
 NAM_program_public_works_contract_cost_blocked:0 "§Y650§! £ADISCORD_economy_treasury_texticon"
 NAM_program_public_works_contract_cost_tooltip:0 "§Y650§! £ADISCORD_economy_treasury_texticon"
 NAM_program_public_works_contract_result_tt:0 "По завершении: депо выдаёт §G12§! £train_texticon и §G120§! £motorized_texticon.\nПоследующие заказы железнодорожных или автомобильных перевозок получают соответственно ещё §G12§! £train_texticon или §G120§! £motorized_texticon."
 NAM_program_public_works_contract_unlock_tt:0 "После применения решения: закупает поезда и грузовики; действующее депо увеличивает последующие транспортные заказы."
 NAM_pw_social_budget:0 "Социальный бюджет"
 NAM_pw_social_budget_desc:0 "В казначействе разбирают письма о задержанном жалованье. К одному из них приложена записка сельского врача. Начальник службы откладывает текущую ведомость и просит вызвать автора."
 NAM_pw_military_governors:0 "Военные комендатуры"
 NAM_pw_military_governors_desc:0 "Армия вернулась с фронта, но порядок подчинения остался военным. Гражданским учреждениям и командирам предстоит определить свои обязанности."
 NAM_pw_civil_police:0 "Гражданская полиция"
 NAM_pw_civil_police_desc:0 "Патрули на улицах до сих пор подчиняются коменданту гарнизона. Окружные управы наберут собственных участковых из местных жителей, а солдаты вернутся в казармы."
 NAM_pw_mobilisation_register:0 "Мобилизационный реестр"
 NAM_pw_mobilisation_register_desc:0 "В прошлую войну повестки рассылали по спискам, в которых значились умершие и уехавшие. Писари заново обойдут дворы и запишут, кто где живёт и что умеет."
 NAM_pw_armament_inspectorate:0 "Инспекция вооружений"
 NAM_pw_armament_inspectorate_desc:0 "В полковых книгах орудие числится годным до самой переплавки. Инспекция начнёт с затворов и лафетов на складах, чтобы командиры знали, какие батареи действительно можно вывести в поле."
 NAM_pw_officer_appointments:0 "Аттестация офицеров"
 NAM_pw_officer_appointments_desc:0 "Многие командиры получили погоны на поле боя и ни разу не сидели за штабной картой. Аттестационная комиссия проверит каждого и решит, кого учить, а кого повышать."
 NAM_pw_strategic_guard:0 "Охрана важных объектов"
 NAM_pw_strategic_guard_desc:0 "Насосные, мосты и узлы связи сторожат вахтёры со старыми винтовками. Их заменят постоянные караулы, знающие, куда отходить и кого вызывать при тревоге."
 NAM_pw_defence_accounts:0 "Контроль военных расходов"
 NAM_pw_defence_accounts_desc:0 "Полковой казначей объясняет ревизору пометки о боевых потерях. Тот достаёт письмо кладовщика с той же датой. В комнате становится тихо, пока оба читают список имущества."
 NAM_pw_survey_corps:0 "Государственная геодезия"
 NAM_pw_survey_corps_desc:0 "Большие стройки связывают между собой округа и предприятия. Инженерам нужны достоверные изыскания и согласованная работа ведомств."
 NAM_pw_state_warehouses:0 "Государственные склады"
 NAM_pw_state_warehouses_desc:0 "Казённое имущество лежит там, где его застал конец войны: в цехах, на путях и в брошенных казармах. Для него выберут постоянные хранилища у железной дороги и назначат ответственных кладовщиков."
 NAM_program_state_warehouses:0 "Оборудовать резервное топливохранилище"
 NAM_program_state_warehouses_desc:0 "Большие стройки связывают между собой округа и предприятия. Инженерам нужны достоверные изыскания и согласованная работа ведомств."
 NAM_program_state_warehouses_cost:0 "§Y500§! £ADISCORD_economy_treasury_texticon"
 NAM_program_state_warehouses_cost_blocked:0 "§Y500§! £ADISCORD_economy_treasury_texticon"
 NAM_program_state_warehouses_cost_tooltip:0 "§Y500§! £ADISCORD_economy_treasury_texticon"
 NAM_program_state_warehouses_result_tt:0 "Склады принимают §G45000§! £fuel_texticon и строят хранилище при наличии места. Действующий склад добавляет §G24000§! £fuel_texticon к каждой оплаченной нефтяной квоте."
 NAM_program_state_warehouses_unlock_tt:0 "После применения решения: закупает топливо и строит хранилище при наличии места; действующий склад увеличивает последующие нефтяные квоты."
 NAM_pw_standard_projects:0 "Типовые проекты"
 NAM_standard_housing_blueprint_tt:0 "После первого сданного квартала в Южной гавани сохраняется типовой чертёж.\nПри свободном участке в Светлогорском округе следующий оплаченный жилищный заказ строит по §G1§! £civ_factory в обоих регионах за ту же цену."
 NAM_veteran_housing_series_tt:0 "В эту серию включён $STATE_688$: ещё §G+1§! £civ_factory. Если к сдаче одна из площадок потеряна или занята, возвращается вся оплата."
 NAM_local_design_steel_tt:0 "Окружное бюро может заказать разработку железной руды в Сухоречье. После сдачи проекта регион получает §G+12§! стали."
 NAM_pw_standard_projects_desc:0 "Плотники уже знают дома Южной гавани до последней балки. Проектировщики сведут их чертежи в один комплект, чтобы окружная мастерская могла заранее нарезать перекрытия и собрать такой же квартал у себя."
 NAM_pw_local_design_offices:0 "Окружные проектные бюро"
 NAM_pw_local_design_offices_desc:0 "Геологи Сухоречья проследили железную жилу до излучины. Окружное бюро сведёт в один проект штольню, обогатительную площадку и дорогу для тяжёлых рудовозов."
 NAM_pw_southern_budget:0 "Бюджет южной кампании"
 NAM_pw_southern_budget_desc:0 "Шахрабад контролирует важнейшие южные производства. Военные планы должны учитывать и судьбу городов после окончания боёв."
 NAM_program_southern_budget:0 "Закупить грузовики южному штабу"
 NAM_program_southern_budget_desc:0 "Шахрабад контролирует важнейшие южные производства. Военные планы должны учитывать и судьбу городов после окончания боёв."
 NAM_program_southern_budget_cost:0 "§Y750§! £ADISCORD_economy_treasury_texticon"
 NAM_program_southern_budget_cost_blocked:0 "§Y750§! £ADISCORD_economy_treasury_texticon"
 NAM_program_southern_budget_cost_tooltip:0 "§Y750§! £ADISCORD_economy_treasury_texticon"
 NAM_program_southern_budget_result_tt:0 "По завершении: §G+500§! £motorized_texticon. При утрате условий оплата возвращается полностью."
 NAM_program_southern_budget_unlock_tt:0 "После применения решения: закупает грузовики для южных программ."
 NAM_pw_southern_intelligence:0 "Разведка южного направления"
 NAM_pw_southern_intelligence_desc:0 "О печах Шахрабада в штабе знают по рассказам караванщиков. Офицеры составят карты дорог и колодцев и заведут осведомителей на рынках пустыни."
 NAM_pw_southern_civil_service:0 "Кадры южной администрации"
 NAM_pw_southern_civil_service_desc:0 "Наместнику на юге понадобятся писари, знающие местные обычаи и счёт. Канцелярия заранее отбирает чиновников и учит их языку пустынных городов."
 NAM_pw_southern_military_rule:0 "Военное управление югом"
 NAM_pw_southern_military_rule_desc:0 "В городах подчинённого юга первое слово останется за комендантами. Они ответят за порядок на улицах и работу печей, пока канцелярия не пришлёт гражданских чиновников."
 NAM_pw_southern_local_offices: "Местные администрации юга"
 NAM_pw_southern_local_offices_desc: "В южной управе светлогорский чиновник знакомится с местными мастерами. На столе лежит план города с пометками на двух языках. Прежде всего приезжего ведут к старой насосной."
 NAM_pw_southern_supply_plan:0 "Снабжение южного фронта"
 NAM_pw_southern_supply_plan_desc:0 "Колонна, вышедшая к югу, везёт с собой воду на каждый день пути. Интенданты размечают стоянки и склады так, чтобы ни один перегон не оставался без запаса."
 NAM_pw_southern_reserve:0 "Резервы южной кампании"
 NAM_pw_southern_reserve_desc:0 "У железнодорожного разъезда артиллеристы ждут штабного офицера. Командир батареи бережёт от дождя карту южных дорог. В караульной уже несколько раз разогревали чай для ожидаемого гостя."
 NAM_program_southern_reserve:0 "Снарядить резерв южной группировки"
 NAM_program_southern_reserve_desc:0 "Шахрабад контролирует важнейшие южные производства. Военные планы должны учитывать и судьбу городов после окончания боёв."
 NAM_program_southern_reserve_cost:0 "§Y800§! £ADISCORD_economy_treasury_texticon"
 NAM_program_southern_reserve_cost_blocked:0 "§Y800§! £ADISCORD_economy_treasury_texticon"
 NAM_program_southern_reserve_cost_tooltip:0 "§Y800§! £ADISCORD_economy_treasury_texticon"
 NAM_program_southern_reserve_result_tt:0 "По завершении: §G+400§! £support_equipment_texticon. При утрате условий оплата возвращается полностью. $NAM_pw_southern_military_programme_tt$"
 NAM_program_southern_reserve_unlock_tt:0 "После применения решения: закупает снаряжение поддержки для южного резерва."
 NAM_pw_postwar_commission:0 "Комиссия по послевоенному устройству"
 NAM_pw_postwar_commission_desc:0 "Победа не заменяет гражданского управления. Южным городам предстоит найти своё место в государственных учреждениях Светлогорья."
 NAM_pw_strategic_reserve:0 "Стратегический резерв"
 NAM_pw_strategic_reserve_desc:0 "Трофейные склады юга проще всего распродать, пока на них есть покупатель. Канцелярия предлагает запереть их и держать под печатью на случай новой войны."
 NAM_program_strategic_reserve:0 "Пополнить стратегический резерв"
 NAM_program_strategic_reserve_desc:0 "Победа не заменяет гражданского управления. Южным городам предстоит найти своё место в государственных учреждениях Светлогорья."
 NAM_program_strategic_reserve_cost:0 "§Y900§! £ADISCORD_economy_treasury_texticon"
 NAM_program_strategic_reserve_cost_blocked:0 "§Y900§! £ADISCORD_economy_treasury_texticon"
 NAM_program_strategic_reserve_cost_tooltip:0 "§Y900§! £ADISCORD_economy_treasury_texticon"
 NAM_program_strategic_reserve_result_tt:0 "По завершении: §G+36000§! £infantry_equipment_texticon. При утрате условий оплата возвращается полностью."
 NAM_program_strategic_reserve_unlock_tt:0 "После применения решения: создаёт крупный винтовочный резерв."
 NAM_pw_development_fund:0 "Фонд развития"
 NAM_pw_development_fund_desc:0 "Доходы южных печей можно запереть в сейфе, а можно пустить на причалы и стапели Южной гавани. Казначеи готовят устав фонда, из которого будут оплачивать большие стройки."
 NAM_program_development_fund:0 "Профинансировать новую фабрику"
 NAM_program_development_fund_desc:0 "Победа не заменяет гражданского управления. Южным городам предстоит найти своё место в государственных учреждениях Светлогорья."
 NAM_program_development_fund_cost:0 "§Y1000§! £ADISCORD_economy_treasury_texticon"
 NAM_program_development_fund_cost_blocked:0 "§Y1000§! £ADISCORD_economy_treasury_texticon"
 NAM_program_development_fund_cost_tooltip:0 "§Y1000§! £ADISCORD_economy_treasury_texticon"
 NAM_program_development_fund_result_tt:0 "Фонд готовит два участка в Южной гавани и заказывает §G25§! £train_texticon. Их получает подчинённый Шахрабад. Если Шахрабад не является нашим субъектом, поезда остаются у Светлогорья."
 NAM_program_development_fund_unlock_tt:0 "После применения решения: готовит участки Южной гавани и заказывает поезда подчинённому Шахрабаду, а при его самостоятельности - Светлогорью."
 NAM_pw_war_accounts:0 "Расчёт по военным обязательствам"
 NAM_pw_war_accounts_desc:0 "Казначеи разбирают договоры, подписанные в последние месяцы войны. Одни поставщики уже свезли на склады первые партии оружия. Другие ждут, кому передадут участки на набережной. Каждому нужен ответ за государственной печатью."
 NAM_pw_release_reserve:0 "Досрочно забрать партию винтовок"
 NAM_pw_release_reserve_desc:0 "Интенданты готовы принять ящики прямо с заводского двора. За пределами проходной останутся незаконченные винтовки и ведомость, по которой мастерские должны были их сдать."
 NAM_pw_release_reserve_unlock_tt:0 "После применения решения: досрочно выдаёт часть оплаченных винтовок и освобождает программу ценой оставшейся поставки и оплаты."
 NAM_pw_reserve_advance_ready_tt:0 "Стратегический резерв оплачен не менее 28 дней назад, Светлогорье независимо и способно принять заказ."
 NAM_pw_release_reserve_balance_tt:0 "Оставшиеся §R18000§! £infantry_equipment_texticon не будут поставлены. Возврата оплаты не будет. Военная программа освобождается."
 NAM_pw_harbour_slipway:0 "Заказать стапель в Южной гавани"
 NAM_pw_harbour_slipway_desc:0 "На участках у воды пока лежат только шпалы и рулоны троса. Портовые артели готовы вбить первые сваи, как только казначейство подпишет подряд."
 NAM_pw_harbour_slipway_unlock_tt:0 "После применения решения: строит верфь на свободном участке Южной гавани после сдачи работ фонда развития."
 NAM_pw_harbour_slipway_site_tt:0 "Фонд развития подготовил участки. Независимое Светлогорье владеет Южной гаванью, контролирует область и порт, в котором есть действующая военно-морская база и свободная ячейка под верфь."
 NAM_pw_harbour_slipway_result_tt:0 "По завершении: Южная гавань получит §G1§! верфь. Если условия нарушатся, казначейство вернёт оплату."
 NAM_pw_harbour_slipway_cost:0 "§Y900§! £ADISCORD_economy_treasury_texticon"
 NAM_pw_harbour_slipway_cost_blocked:0 "§R900§! £ADISCORD_economy_treasury_texticon"
 NAM_pw_harbour_slipway_cost_tooltip:0 "§Y900§! £ADISCORD_economy_treasury_texticon"
 NAM_pw_southern_schools:0 "Школы южных округов"
 NAM_khazar_school_exchange_tt:0 "Пока подчинённый Шахрабад удерживает Хазар, каждый оплаченный выпуск окружных училищ позволяет отстающей стороне освоить следующую известную партнёру технологию станкостроения.\nПрограмма идёт от стандартизованных станков до цифровых библиотек оснастки."
 NAM_pw_southern_schools_desc:0 "Дети литейщиков и дети нефтяников впервые сядут за одни парты. Учителя из Светлогорья едут на юг с букварями, а обратно привезут учеников для столичных училищ."
 NAM_pw_unified_budget:0 "Общий государственный бюджет"
 NAM_pw_unified_budget_desc:0 "Юг до сих пор ведёт собственные книги в собственной монете. Казначейство сведёт доходы и расходы обеих половин страны в одну роспись."
 NAM_pw_demobilisation_board:0 "Демобилизационная комиссия"
 NAM_pw_demobilisation_board_desc:0 "Часть возвращающихся полков останется в списках резерва. Мастера военных заводов зовут бывших механиков и оружейников в гражданские цеха. Комиссия сводит заявки предприятий с именными списками демобилизованных."
 NAM_convert_wartime_plant:0 "Перевести военный завод на гражданские заказы"
 NAM_convert_wartime_plant_desc:0 "В цехе военного завода мастера рассматривают чертёж мирной машины. На старом рабочем столе ещё выбит номер снарядной партии. Один из слесарей вспоминает, что делал такие детали до войны."
 NAM_convert_wartime_plant_unlock_tt:0 "После применения решения: демобилизованные переоборудуют военный завод и откроют две гражданские фабрики в выбранном округе."
 NAM_plant_conversion_peace_tt:0 "Светлогорье независимо, победило в войне за юг и находится в мире."
 NAM_plant_conversion_site_tt:0 "В округе под нашим контролем есть военный завод, свободный участок и место для двух гражданских фабрик."
 NAM_plant_conversion_result_tt:0 "Один военный завод и соседний участок станут двумя гражданскими фабриками. Рабочие останутся в округе. Программу можно провести один раз в каждом округе."
 NAM_plant_conversion_lost_tt:0 "Началась новая война, утрачена самостоятельность, завод или участок недоступен."
 NAM_plant_conversion_refund_tt:0 "Рабочие вернутся в людской резерв: §G+4000§! £manpower_texticon."
 NAM_cost_4000_workers:0 "§Y4000§! £manpower_texticon"
 NAM_cost_4000_workers_blocked:0 "§R4000§! £manpower_texticon"
 NAM_cost_4000_workers_tooltip:0 "§Y4000§! £manpower_texticon\nРабочие уходят из резерва при назначении и возвращаются, если проект сорван."
 NAM_pw_southern_industrial_repair:0 "Восстановление южной промышленности"
 NAM_pw_southern_industrial_repair_desc:0 "Половина печей погашена, а мастера разошлись по деревням. Инженеры осматривают цеха и составляют списки того, что можно запустить до зимы."
 NAM_pw_civil_administration:0 "Переход к гражданскому управлению"
 NAM_pw_civil_administration_desc:0 "Комендант сдаёт ключи от ратуши чиновнику с папкой под мышкой. Военные пропуска отменяют, и горожане снова идут со своими делами в управу, а не в комендатуру."
 NAM_pw_permanent_institutions:0 "Постоянные государственные учреждения"
 NAM_pw_permanent_institutions_desc:0 "Комиссии военного времени создавали на месяц, а работают они до сих пор. Те из них, что доказали свою пользу, получат постоянный штат, здание и место в законе."
 NAM_pw_municipal_repair:0 "Городские ремонтные службы"
 NAM_pw_municipal_repair_desc:0 "Механики Южной гавани умеют чинить насосы, но каждый выезд приходится согласовывать с портовым начальством. Город берёт на себя дежурство, инструменты и содержание аварийной мастерской."
 NAM_program_municipal_repair:0 "Учредить аварийную службу гавани"
 NAM_program_municipal_repair_desc:0 "Портовые механики готовят инструмент к выезду. Диспетчер ещё раз читает по телефону название насосной. Один из мастеров узнаёт место и берёт с полки собственную старую схему."
 NAM_program_municipal_repair_cost:0 "§Y600§! £ADISCORD_economy_treasury_texticon"
 NAM_program_municipal_repair_cost_blocked:0 "§Y600§! £ADISCORD_economy_treasury_texticon"
 NAM_program_municipal_repair_cost_tooltip:0 "§Y600§! £ADISCORD_economy_treasury_texticon"
 NAM_program_municipal_repair_result_tt:0 "По завершении: на склад поступает §G200§! £support_equipment_texticon. При ремонте скважин на карте служба добавляет §G15§! пунктов состояния, пока Светлогорье удерживает Южную гавань."
 NAM_program_municipal_repair_unlock_tt:0 "После применения решения: закупает снаряжение поддержки; действующая служба Южной гавани усиливает последующий ремонт скважин."
 NAM_pw_returnee_registration:0 "Возвращение эвакуированных"
 NAM_pw_returnee_registration_desc:0 "После возвращения жителей улицы вновь наполняются жизнью. Местным властям предстоит восстановить привычную городскую работу."
 NAM_pw_oil_laboratories:0 "Промысловые лаборатории"
 NAM_pw_oil_laboratories_desc:0 "Буровой мастер определяет пласт по цвету шлама и собственному чутью. Химики откроют при промыслах лаборатории и начнут вести журнал каждой скважины."
 NAM_pw_oil_equipment:0 "Нефтепромысловое оборудование"
 NAM_pw_oil_equipment_desc:0 "На промыслах сохранились опытные бригады, но техника изношена войной. Нефтяникам предстоит заново наладить работу месторождений."
 NAM_pw_refinery_engineering:0 "Проектирование нефтепереработки"
 NAM_pw_refinery_engineering_desc:0 "Сырую нефть увозят за море, а бензин возвращается оттуда втридорога. Инженеры чертят перегонные установки, которые можно поставить рядом с промыслами."
 NAM_pw_fuel_reservoirs: "Национальный топливный резерв"
 NAM_pw_fuel_reservoirs_desc: "Управляющие хранилищ приехали на совещание с разными формами учёта. Диспетчер ищет в каждой одну и ту же партию. В конце стола инженер ждёт очереди показать план наливного двора."
 NAM_program_fuel_reservoirs:0 "Расширить резервуарный парк"
 NAM_program_fuel_reservoirs_desc: "У наливного двора инженер обходит старые цистерны с местным смотрителем. На ржавых бортах ещё видны номера исчезнувших ведомств. Смотритель помнит, кто принимал каждую из них."
 NAM_program_fuel_reservoirs_cost:0 "§Y700§! £ADISCORD_economy_treasury_texticon"
 NAM_program_fuel_reservoirs_cost_blocked:0 "§Y700§! £ADISCORD_economy_treasury_texticon"
 NAM_program_fuel_reservoirs_cost_tooltip:0 "§Y700§! £ADISCORD_economy_treasury_texticon"
 NAM_program_fuel_reservoirs_result_tt:0 "Промысловики поставляют §G85000§! £fuel_texticon и §G100§! автоцистерн. При наличии места расширяется хранилище."
 NAM_program_fuel_reservoirs_unlock_tt:0 "После применения решения: закупает топливо и автоцистерны и расширяет хранилище при наличии места."
 NAM_pw_energy_commission:0 "Энергетическое управление"
 NAM_pw_energy_commission_desc:0 "Когда встаёт насос, диспетчер узнаёт об этом последним. Инженеры собирают за одним столом энергетиков и буровых мастеров, чтобы первая же смена могла выехать на аварию."
 NAM_pw_regional_power:0 "Районные электростанции"
 NAM_pw_regional_power_desc:0 "Городам и предприятиям нужна надёжная подача энергии и воды. Инженеры готовят проекты, учитывая местность и существующие сети."
 NAM_program_regional_power:0 "Пустить районную электростанцию"
 NAM_program_regional_power_desc:0 "Городам и предприятиям нужна надёжная подача энергии и воды. Инженеры готовят проекты, учитывая местность и существующие сети."
 NAM_program_regional_power_cost:0 "§Y900§! £ADISCORD_economy_treasury_texticon"
 NAM_program_regional_power_cost_blocked:0 "§Y900§! £ADISCORD_economy_treasury_texticon"
 NAM_program_regional_power_cost_tooltip:0 "§Y900§! £ADISCORD_economy_treasury_texticon"
 NAM_program_regional_power_result_tt:0 "Энергетики восстанавливают состояние невыжженного промысла Сухоречья до §G100§! и подключают §G2§! новых площадки для застройки."
 NAM_program_regional_power_unlock_tt:0 "После применения решения: восстанавливает невыжженный промысел Сухоречья и открывает площадки для застройки."
 NAM_pw_power_grid:0 "Межокружная энергосеть"
 NAM_pw_power_grid_desc:0 "У каждой насосной до сих пор своя дизельная. Энергетики прокладывают линии от городских станций и передают буровым сменам схемы подключения."
 NAM_grid_connect_tt:0 "Аварийная буровая смена может подключить выбранный промысел, в том числе исправный.\nРайонная станция, кооператив Сухоречья или Светлогорская ГЭС дают подключённым насосам §G+1§! к мощности, пока Светлогорье удерживает источник.\nПри полном состоянии это §G+10§! нефти и §G+1§! к экспортной мощности на промысел."
 NAM_grid_send_generator:0 "Отправить передвижную электростанцию"
 NAM_grid_send_generator_desc:0 "Диспетчер передаёт бригаде позывной промысла. На тягаче везут дизельный агрегат и цистерну, на площадке уже ждёт дежурный электрик."
 NAM_grid_send_generator_unlock_tt:0 "После применения решения: увеличивает мощность промысла и сохраняет прибавку при отключении основной сети."
 NAM_grid_held_field_tt:0 "Светлогорье удерживает подключённый промысел, скважины не выжжены"
 NAM_grid_generator_free_tt:0 "Передвижная электростанция свободна"
 NAM_grid_lost_field_tt:0 "Работа на подключённом промысле прекратилась"
 NAM_grid_generator_result_tt:0 "На время работы насосы получают §G+1§! к мощности сверх действующей сети. При полном состоянии промысла прибавка составляет §G10§! нефти и §G1§! ед. экспорта. Дизель расходуется при отправке."
 NAM_grid_generator_ends_tt:0 "Передвижная электростанция освобождается. Израсходованное топливо не возвращается."
 NAM_grid_both_running:0 "\nНасосы: сеть и дизель §G+2§! к мощности"
 NAM_grid_diesel_running:0 "\nНасосы: автономный дизель §G+1§! к мощности"
 NAM_grid_line_running:0 "\nНасосы: энергосеть §G+1§! к мощности"
 NAM_grid_line_idle:0 "\nНасосы: линия подключена, подача отключена"
 NAM_grid_generator_cost:0 "§Y15000§! £fuel_texticon"
 NAM_grid_generator_cost_blocked:0 "§R15000§! £fuel_texticon"
 NAM_grid_generator_cost_tooltip:0 "§Y15000§! £fuel_texticon"
 NAM_pw_oilfield_substations:0 "Промысловые подстанции"
 NAM_pw_oilfield_substations_desc:0 "Северные насосы сидят на одной линии с посёлком. Вечером буровики гасят часть электромоторов, чтобы в домах горел свет. Промыслу нужны собственные подстанции."
 NAM_program_oilfield_substations:0 "Подключить северные насосные станции"
 NAM_program_oilfield_substations_desc:0 "Буровые стоят у готовых скважин, но старые линии не тянут их двигатели. Промысловики просят отдельную подстанцию для насосов."
 NAM_program_oilfield_substations_cost:0 "§Y600§! £ADISCORD_economy_treasury_texticon"
 NAM_program_oilfield_substations_cost_blocked:0 "§Y600§! £ADISCORD_economy_treasury_texticon"
 NAM_program_oilfield_substations_cost_tooltip:0 "§Y600§! £ADISCORD_economy_treasury_texticon"
 NAM_program_oilfield_substations_result_tt:0 "По завершении: $STATE_67$: мощность промысла и предел дальнейшего бурения увеличиваются на §G2§! ед. Фактическая добыча зависит от состояния скважин."
 NAM_program_oilfield_substations_unlock_tt:0 "После применения решения: повышает мощность Северных месторождений и предел дальнейшего бурения."
 NAM_program_city_water:0 "Проложить городской водопровод"
 NAM_program_city_water_desc:0 "В Светлогорске мастера ждут воды для новых цехов. В Южной гавани её просят корабельщики, которым до сих пор приходится возить пресную воду к стапелям в бочках. Сметы обоих городов лежат на столе у начальника водопровода."
 NAM_program_city_water_unlock_tt:0 "После применения решения: подключить фабрику в Светлогорске или верфь в Южной гавани. Для подключения второго города нужна действующая районная электростанция в Сухоречье."
 NAM_city_water_pumps_tt:0 "Первая ветвь работает от автономных насосов. Для второй Светлогорье должно удерживать Сухоречье с введённой в строй районной электростанцией."
 NAM_city_water_site_tt:0 "Светлогорье владеет областью и контролирует её. Здесь ещё нет городского водопровода и есть место для нового предприятия."
 NAM_city_water_factory_tt:0 "В Светлогорском округе заработает §G1§! £civ_factory на участке, подключённом к водопроводу."
 NAM_city_water_yard_tt:0 "В Южной гавани заработает §G1§! верфь на участке, подключённом к водопроводу."
 NAM_city_water_cancel_tt:0 "Строительство прервётся, если правительство перестанет действовать, площадка будет утрачена или второй ветви не хватит насосной мощности."
 NAM_city_water_refund_tt:0 "Задаток за водопровод вернётся в казну: §G300§! £ADISCORD_economy_treasury_texticon."
 NAM_south_coast_irrigation:0 "Орошаемые хозяйства Южнобережья"
 NAM_south_coast_irrigation_desc:0 "Вода из отводного канала поступает и к промысловым насосам, и на огороды в низине. Часть урожая местные склады оставляют для войск на побережье.\n\nЭффект действует, пока Светлогорье владеет округом и контролирует его."
 NAM_pw_water_intakes:0 "Городские водозаборы"
 NAM_pw_water_intakes_desc:0 "В Светлогорске фабриканты хранят воду в резервуарах на заводских крышах, а в гавани бочки подвозят прямо к стапелям. Оба города просят насосы у одного и того же управления."
 NAM_pw_irrigation_works:0 "Оросительные сооружения"
 NAM_pw_irrigation_works_desc:0 "Каждую весну вода подходит к нижним насосным Южнобережья. Землемеры уже прошли низину и поставили колышки там, где должен пройти отводной канал."
 NAM_program_irrigation_works:0 "Проложить Южнобережный канал"
 NAM_program_irrigation_works_desc:0 "Канал должен отвести воду от насосных площадок и осушить низины у посёлков. Управа и промысловики договорились содержать шлюзы сообща."
 NAM_program_irrigation_works_cost:0 "§Y600§! £ADISCORD_economy_treasury_texticon"
 NAM_program_irrigation_works_cost_blocked:0 "§Y600§! £ADISCORD_economy_treasury_texticon"
 NAM_program_irrigation_works_cost_tooltip:0 "§Y600§! £ADISCORD_economy_treasury_texticon"
 NAM_program_irrigation_works_result_tt:0 "По завершении: в Южнобережном округе откроются §G2§! участка под застройку.\nПока Светлогорье владеет округом и контролирует его, орошаемые хозяйства увеличивают местное снабжение на §G30%§!, а промысел теряет вдвое меньше состояния при происшествиях."
 NAM_program_irrigation_works_unlock_tt:0 "После применения решения: открывает участки Южнобережья; действующий канал улучшает местное снабжение и защищает промысел от происшествий."
 NAM_pw_reservoir_survey:0 "Обследование водосборов"
 NAM_pw_reservoir_survey_desc:0 "Изыскатели поднимаются к верховьям пересыхающих рек и ставят вешки там, где весной стоит вода. По их отметкам решат, где хватит места для плотины, а где - только для пруда."
 NAM_pw_power_reserve: "Защита аэродромов"
 NAM_pw_power_reserve_desc: "У аэродрома артиллерийский офицер смотрит на небо через дальномер. Лётчики показывают ему обычный заход над мастерскими. На карте красным обводят старую водонапорную башню."
 NAM_pw_grid_dispatch:0 "Единое диспетчерское управление"
 NAM_pw_grid_dispatch_desc:0 "В диспетчерской одновременно звонят телефоны нескольких промыслов. Дежурный просит мастеров оставаться на линии и отмечает вызовы на карте. В коридоре ждёт бригада в промокших плащах."
 NAM_pw_industrial_recovery:0 "Промышленное восстановление"
 NAM_pw_industrial_recovery_desc:0 "Мастерские выросли из военных заказов. Теперь их оборудование и подготовка рабочих должны отвечать потребностям всей страны."
 NAM_pw_civil_engineering:0 "Гражданское машиностроение"
 NAM_pw_civil_engineering_desc:0 "Цех, который всю войну точил снарядные стаканы, получил первый мирный заказ на насосы и лебёдки. Мастерам придётся заново привыкать к чертежам, в которых не указан калибр."
 NAM_program_civil_engineering:0 "Оснастить гражданский завод"
 NAM_program_civil_engineering_desc:0 "Мастерские выросли из военных заказов. Теперь их оборудование и подготовка рабочих должны отвечать потребностям всей страны."
 NAM_program_civil_engineering_cost:0 "§Y1000§! £ADISCORD_economy_treasury_texticon"
 NAM_program_civil_engineering_cost_blocked:0 "§Y1000§! £ADISCORD_economy_treasury_texticon"
 NAM_program_civil_engineering_cost_tooltip:0 "§Y1000§! £ADISCORD_economy_treasury_texticon"
 NAM_program_civil_engineering_result_tt:0 "Гражданские заводы выпускают §G20§! £train_texticon и §G240§! £motorized_texticon для снабжения. При наличии места в гавани открывается фабрика."
 NAM_program_civil_engineering_unlock_tt:0 "После применения решения: выпускает поезда и грузовики и строит фабрику в гавани при наличии места."
 NAM_pw_arms_engineering:0 "Военное машиностроение"
 NAM_pw_arms_engineering_desc:0 "Военные заказы сокращают, но конструкторы не хотят распускать бригады, которые научились лить орудийные стволы. Их цеха оставят за армией и загрузят опытными образцами."
 NAM_program_arms_engineering:0 "Развернуть оружейное производство"
 NAM_program_arms_engineering_desc:0 "Мастерские выросли из военных заказов. Теперь их оборудование и подготовка рабочих должны отвечать потребностям всей страны."
 NAM_program_arms_engineering_cost:0 "§Y1100§! £ADISCORD_economy_treasury_texticon"
 NAM_program_arms_engineering_cost_blocked:0 "§Y1100§! £ADISCORD_economy_treasury_texticon"
 NAM_program_arms_engineering_cost_tooltip:0 "§Y1100§! £ADISCORD_economy_treasury_texticon"
 NAM_program_arms_engineering_result_tt:0 "Армия получает §G80§! £unit_mechanized_icon_small бронетранспортёров, §G120§! £ADISCORD_artillery_texticon и технологию выпуска бронетранспортёров. При наличии места открывается военный завод."
 NAM_program_arms_engineering_unlock_tt:0 "После применения решения: закупает бронетранспортёры и артиллерию, открывает выпуск бронетранспортёров и строит военный завод при наличии места."
 NAM_pw_toolmaking:0 "Инструментальное производство"
 NAM_pw_toolmaking_desc:0 "Инструментальщики рассматривают привезённый из-за моря калибр. На нём осталось клеймо незнакомой мастерской. Старший мастер предлагает сначала проверить деталь собственными приборами."
 NAM_pw_machine_repair:0 "Ремонт промышленного оборудования"
 NAM_pw_machine_repair_desc:0 "Сломанный станок стоит у стены, пока кто-нибудь не снимет с него нужную деталь для соседнего. Ремонтные бригады начнут объезжать заводы по графику и возить с собой запасные части."
 NAM_program_machine_repair:0 "Переоснастить ремонтные бригады"
 NAM_program_machine_repair_desc:0 "Мастерские выросли из военных заказов. Теперь их оборудование и подготовка рабочих должны отвечать потребностям всей страны."
 NAM_program_machine_repair_cost:0 "§Y650§! £ADISCORD_economy_treasury_texticon"
 NAM_program_machine_repair_cost_blocked:0 "§Y650§! £ADISCORD_economy_treasury_texticon"
 NAM_program_machine_repair_cost_tooltip:0 "§Y650§! £ADISCORD_economy_treasury_texticon"
 NAM_program_machine_repair_result_tt:0 "По завершении: §G+400§! £motorized_texticon. При утрате условий оплата возвращается полностью."
 NAM_program_machine_repair_unlock_tt:0 "После применения решения: закупает грузовики для армии."
 NAM_pw_chemical_works:0 "Химическая промышленность"
 NAM_pw_chemical_works_desc:0 "Ночью над промыслом виден огонь газового факела. Молодой химик делает записи у окна лаборатории. Утром он несёт начальнику смены рисунок установки, о которой они спорили всю неделю."
 NAM_pw_testing_facilities:0 "Испытательные стенды"
 NAM_pw_testing_facilities_desc:0 "Новый двигатель проверяют просто: ставят на грузовик и смотрят, доедет ли он до гавани. Инженеры построят стенды, где изделие можно довести до поломки, не выезжая за ворота."
 NAM_pw_industrial_sites:0 "Новые промышленные площадки"
 NAM_pw_industrial_sites_desc:0 "Старые цеха зажаты между портом и жилыми кварталами, и расширять их некуда. Землемеры размечают за городом ровные участки с подъездными путями и водой."
 NAM_pw_components:0 "Производство комплектующих"
 NAM_pw_components_desc:0 "Сборочный цех простаивает из-за подшипника, который делают на другом конце страны. Смежников сведут в одну цепочку, чтобы деталь приходила к сборке в назначенный день."
 NAM_pw_production_cycle:0 "Полный производственный цикл"
 NAM_pw_production_cycle_desc:0 "От руды до готовой машины изделие проходит через десяток ворот и столько же накладных. Заводы свяжут общим графиком, по которому заготовка не ждёт своей очереди на складе."
 NAM_pw_transport_commission: "План транспортного обеспечения"
 NAM_pw_transport_commission_desc: "Министерства сводят заявки фронта и гражданских перевозчиков в единый план. Прежде чем обещать наступление, нужно определить, чем его снабжать."
 NAM_pw_rail_priority: "Железнодорожные перевозки"
 NAM_pw_rail_priority_desc: "Основной поток грузов пойдёт по железной дороге из столицы к Сухоречью. Локомотивы и ремонтные бригады собирают под единым управлением."
 NAM_program_rail_priority:0 "Подготовить железную дорогу в Сухоречье"
 NAM_program_rail_priority_desc: "Основной поток грузов пойдёт по железной дороге из столицы к Сухоречью. Локомотивы и ремонтные бригады собирают под единым управлением."
 NAM_program_rail_priority_cost: "§Y650§! £ADISCORD_economy_treasury_texticon"
 NAM_program_rail_priority_cost_blocked: "§Y650§! £ADISCORD_economy_treasury_texticon"
 NAM_program_rail_priority_cost_tooltip: "§Y650§! £ADISCORD_economy_treasury_texticon"
 NAM_program_rail_priority_result_tt: "По завершении: Железная дорога $STATE_688$ - $STATE_690$: уровень §G3§!; §G30§! £train_texticon.\nПри отмене незавершённого заказа возвращается вся оплата.\n$NAM_pw_transport_batches_tt$"
 NAM_program_rail_priority_unlock_tt:0 "После применения решения: улучшает железную дорогу Светлогорск - Сухоречье и закупает поезда."
 NAM_pw_road_priority: "Автомобильные колонны снабжения"
 NAM_pw_road_priority_desc: "Водители раскладывают перед штабистами карты южных просёлков. На одной ещё отмечен мост, которого давно нет. Механик просит показать места, где колонна сможет остановиться для осмотра."
 NAM_program_road_priority:0 "Снарядить автомобильную колонну"
 NAM_program_road_priority_desc: "На привале водитель рассказывает механику о шуме в заднем мосту. Начальник колонны пытается узнать по карте ближайший двор. В стороне местный возчик ждёт, когда его наконец спросят о дороге."
 NAM_program_road_priority_cost: "§Y650§! £ADISCORD_economy_treasury_texticon"
 NAM_program_road_priority_cost_blocked: "§Y650§! £ADISCORD_economy_treasury_texticon"
 NAM_program_road_priority_cost_tooltip: "§Y650§! £ADISCORD_economy_treasury_texticon"
 NAM_program_road_priority_result_tt: "По завершении: §G400§! £motorized_texticon; инфраструктура $STATE_690$ §G+1§! £infrastructure_texticon, если не достигнут предел.\nПри отмене незавершённого заказа возвращается вся оплата.\n$NAM_pw_transport_batches_tt$"
 NAM_program_road_priority_unlock_tt:0 "После применения решения: закупает грузовики и улучшает дороги Сухоречья."
 NAM_pw_rail_workshops: "Стандартизация транспортного парка"
 NAM_pw_rail_workshops_desc: "Мастерские согласуют номенклатуру запчастей с перевозчиками. Заказы перестанут собирать из несовместимых машин."
 NAM_pw_river_crossings: "Инженерные переправы"
 NAM_pw_river_crossings_desc: "Южные дороги пересекают русла, которые легко превращаются в препятствие. Инженеры заготавливают сборные мосты и подходы к ним."
 NAM_program_river_crossings:0 "Подготовить инженерные переправы"
 NAM_program_river_crossings_desc: "Южные дороги пересекают русла, которые легко превращаются в препятствие. Инженеры заготавливают сборные мосты и подходы к ним."
 NAM_program_river_crossings_cost: "§Y550§! £ADISCORD_economy_treasury_texticon"
 NAM_program_river_crossings_cost_blocked: "§Y550§! £ADISCORD_economy_treasury_texticon"
 NAM_program_river_crossings_cost_tooltip: "§Y550§! £ADISCORD_economy_treasury_texticon"
 NAM_program_river_crossings_result_tt: "По завершении: §G300§! £support_equipment_texticon; инфраструктура $STATE_689$ §G+1§! £infrastructure_texticon, если не достигнут предел. При отмене незавершённого заказа возвращается вся оплата."
 NAM_program_river_crossings_unlock_tt:0 "После применения решения: закупает снаряжение поддержки и улучшает дороги Южнобережья."
 NAM_pw_freight_depots: "Восточный узел снабжения"
 NAM_pw_freight_depots_desc: "Снабженцы выбирают площадку для разгрузки эшелонов и отправки грузов к передовой. Узел соединят с основной железнодорожной сетью."
 NAM_program_freight_depots:0 "Развернуть восточный узел снабжения"
 NAM_program_freight_depots_desc: "Снабженцы выбирают площадку для разгрузки эшелонов и отправки грузов к передовой. Узел соединят с основной железнодорожной сетью."
 NAM_program_freight_depots_cost: "§Y850§! £ADISCORD_economy_treasury_texticon"
 NAM_program_freight_depots_cost_blocked: "§Y850§! £ADISCORD_economy_treasury_texticon"
 NAM_program_freight_depots_cost_tooltip: "§Y850§! £ADISCORD_economy_treasury_texticon"
 NAM_program_freight_depots_result_tt: "По завершении: $STATE_719$: узел снабжения, железная дорога уровня §G3§! до $STATE_700$ и §G10§! £train_texticon. При отмене незавершённого заказа возвращается вся оплата."
 NAM_program_freight_depots_unlock_tt:0 "После применения решения: строит узел снабжения Восточного Сухоречья и железнодорожную связь с Южной гаванью, закупает поезда."
 NAM_pw_transport_maintenance: "Единая ремонтная служба"
 NAM_pw_transport_maintenance_desc: "Вместо ведомственных мастерских вводится общая сеть обслуживания транспорта. Повреждённая машина должна возвращаться в строй без долгой переписки."
 NAM_pw_logistics_depots: "Сухореченский узел снабжения"
 NAM_pw_logistics_depots_desc: "На пустыре у сухореченской станции встретились путейцы и автомобильные снабженцы. Одни меряют расстояния от рельсов, другие - от дороги. Станционный смотритель рассказывает, как это место затапливало весной."
 NAM_program_logistics_depots:0 "Развернуть сухореченский узел снабжения"
 NAM_program_logistics_depots_desc: "Снабженцы выбирают площадку для разгрузки эшелонов и отправки грузов к передовой. Узел соединят с основной железнодорожной сетью."
 NAM_program_logistics_depots_cost: "§Y850§! £ADISCORD_economy_treasury_texticon"
 NAM_program_logistics_depots_cost_blocked: "§Y850§! £ADISCORD_economy_treasury_texticon"
 NAM_program_logistics_depots_cost_tooltip: "§Y850§! £ADISCORD_economy_treasury_texticon"
 NAM_program_logistics_depots_result_tt: "По завершении: $STATE_690$: узел снабжения, железная дорога уровня §G3§! до $STATE_700$ и §G10§! £train_texticon. При отмене незавершённого заказа возвращается вся оплата."
 NAM_program_logistics_depots_unlock_tt:0 "После применения решения: строит узел снабжения Сухоречья и железнодорожную связь с Южной гаванью, закупает поезда."
 NAM_pw_southern_corridor: "Прибрежная магистраль"
 NAM_pw_southern_corridor_desc: "Железнодорожные изыскатели сравнивают портовую карту с планами столичных станций. На стыке листов исчезает целое поселение. Проводник просит карандаш и дорисовывает знакомую ему дорогу."
 NAM_program_southern_corridor:0 "Открыть прибрежную магистраль"
 NAM_program_southern_corridor_desc: "У портовой станции изыскатели разговаривают с начальником путей. Он принёс пачку довоенных схем, переживших пожар конторы. Среди обгоревших листов ищут отметку старого разъезда."
 NAM_program_southern_corridor_cost: "§Y750§! £ADISCORD_economy_treasury_texticon"
 NAM_program_southern_corridor_cost_blocked: "§Y750§! £ADISCORD_economy_treasury_texticon"
 NAM_program_southern_corridor_cost_tooltip: "§Y750§! £ADISCORD_economy_treasury_texticon"
 NAM_program_southern_corridor_result_tt: "По завершении: Железная дорога $STATE_688$ - $STATE_700$: уровень §G3§!; §G20§! £train_texticon. При отмене незавершённого заказа возвращается вся оплата."
 NAM_program_southern_corridor_unlock_tt:0 "После применения решения: улучшает железную дорогу Светлогорск - Южная гавань и закупает поезда."
 NAM_pw_freight_schedule: "Развёртывание тыла"
 NAM_pw_freight_schedule_desc: "Штаб утверждает график движения и выделяет резерв для срывов поставок. Подписанный план должен опираться на действующий транспорт."
 NAM_pw_district_hospitals:0 "Окружные больницы"
 NAM_pw_district_hospitals_desc:0 "Полевые лазареты свернули, а раненые остались в округах без врача. В уездных городах откроют больницы, куда сельский фельдшер сможет довезти больного за один день."
 NAM_pw_school_network:0 "Окружные училища"
 NAM_pw_school_network_desc:0 "В бывшей казарме преподаватель рисует на доске разрез станка. Ученики передают друг другу единственный справочник. У двери директор обсуждает с приезжим мастером программу следующего занятия."
 NAM_pw_civil_communications:0 "Окружное вещание"
 NAM_pw_civil_communications_desc:0 "Студии в округах получат эфир на общей частоте. Местные редакции сами решат, чьи голоса прозвучат в вечернем выпуске."
 NAM_pw_regional_reconstruction:0 "Окружное восстановление"
 NAM_pw_regional_reconstruction_desc:0 "Война изменила жизнь старых и новых округов. Школам, больницам и городским службам предстоит принять вернувшихся жителей."
 NAM_program_regional_reconstruction:0 "Открыть завод в Восточном Сухоречье"
 NAM_program_regional_reconstruction_desc:0 "Война изменила жизнь старых и новых округов. Школам, больницам и городским службам предстоит принять вернувшихся жителей."
 NAM_program_regional_reconstruction_cost:0 "§Y950§! £ADISCORD_economy_treasury_texticon"
 NAM_program_regional_reconstruction_cost_blocked:0 "§Y950§! £ADISCORD_economy_treasury_texticon"
 NAM_program_regional_reconstruction_cost_tooltip:0 "§Y950§! £ADISCORD_economy_treasury_texticon"
 NAM_program_regional_reconstruction_result_tt:0 "Округ получает два участка и восстанавливает невыжженный промысел до §G100§! состояния. Завершённые кампании пропаганды можно провести повторно без ожидания."
 NAM_program_regional_reconstruction_unlock_tt:0 "После применения решения: восстанавливает невыжженный промысел, открывает участки и позволяет повторить завершённую пропаганду без ожидания."
 NAM_pw_army_review: "Разбор опыта войны"
 NAM_pw_army_review_desc: "Командиры сопоставляют донесения частей с реальными потерями. Удачные решения предстоит превратить в практику всей армии."
 NAM_pw_breakthrough_army: "Подготовленный прорыв"
 NAM_pw_breakthrough_army_desc: "Прорыв укреплённой полосы требует сосредоточить инженерные средства и артиллерию до начала атаки."
 NAM_pw_mobile_army: "Манёвренная армия"
 NAM_pw_mobile_army_desc: "Колонны должны обходить очаги сопротивления и удерживать темп. Командование принимает связанные с этим требования к транспорту."
 NAM_pw_reserve_centres: "Запасные полки"
 NAM_pw_reserve_centres_desc: "У окружного сборного пункта инструктор читает список прибывших. Некоторые фамилии знакомы ему ещё по довоенной службе. Люди ждут во дворе, положив дорожные узлы к стене."
 NAM_program_reserve_centres:0 "Выдать оружие запасным полкам"
 NAM_program_reserve_centres_desc: "В учебной роте знакомятся люди из разных округов. Старший инструктор спрашивает, кто где служил и чем занимался дома. Писарь едва успевает записывать названия посёлков."
 NAM_program_reserve_centres_cost:0 "§Y850§! £ADISCORD_economy_treasury_texticon"
 NAM_program_reserve_centres_cost_blocked:0 "§Y850§! £ADISCORD_economy_treasury_texticon"
 NAM_program_reserve_centres_cost_tooltip:0 "§Y850§! £ADISCORD_economy_treasury_texticon"
 NAM_program_reserve_centres_unlock_tt:0 "После применения решения: военная комиссия заказывает винтовки для запасных полков; альтернативный ветеранский курс готовит людей для действующей армии."
 NAM_pw_breakthrough_issue_tt:0 "В каждую партию для запасных полков включаются §G60§! £ADISCORD_artillery_texticon для усиления пехоты."
 NAM_pw_mobile_issue_tt:0 "В каждую партию для запасных полков включаются §G120§! £motorized_equipment_texticon для перевозки пехоты."
 NAM_program_reserve_centres_result_tt:0 "По завершении: склады сдадут §G18000§! £infantry_equipment_texticon, с сетью запасных полков - §G27000§!.\nПри отгрузке по штату прорыва полагается ещё §G60§! £ADISCORD_artillery_texticon, по манёвренному штату - §G120§! £motorized_equipment_texticon.\nПри отмене казна вернёт всю оплату."
 NAM_pw_reserve_network_tt:0 "Запасные полки увеличат каждую отгрузку с §Y18000§! до §G27000§! £infantry_equipment_texticon, включая уже оплаченный заказ."
 NAM_pw_staff_operations_tt:0 "Штаб может прикрыть нефтяные районы или во время войны собрать подвижный резерв. Одновременно действует один из этих приказов."
 NAM_pw_engineer_units: "Инженерные батальоны"
 NAM_pw_engineer_units_desc: "Сапёрные командиры привезли на разбор тетради полевых работ. На страницах вперемешку чертежи мостов и записи о погоде. Начальник курса просит рассказать о самой трудной переправе."
 NAM_program_engineer_units:0 "Снарядить инженерные батальоны"
 NAM_program_engineer_units_desc: "У сапёрного склада офицер разбирает с мастерами полевые записи. Карандашные схемы промокли на учениях, и подписи приходится восстанавливать по памяти. Один из солдат узнаёт свой рисунок переправы."
 NAM_program_engineer_units_cost:0 "§Y700§! £ADISCORD_economy_treasury_texticon"
 NAM_program_engineer_units_cost_blocked:0 "§Y700§! £ADISCORD_economy_treasury_texticon"
 NAM_program_engineer_units_cost_tooltip:0 "§Y700§! £ADISCORD_economy_treasury_texticon"
 NAM_program_engineer_units_result_tt:0 "По завершении: §G+350§! £support_equipment_texticon. При утрате условий оплата возвращается полностью. $NAM_pw_combined_engineers_tt$"
 NAM_program_engineer_units_unlock_tt:0 "После применения решения: закупает снаряжение поддержки для инженерных частей."
 NAM_pw_field_workshops: "Бронированный транспорт"
 NAM_pw_field_workshops_desc: "Подвижным частям нужны машины, способные пройти под огнём вместе с пехотой. Мастерские согласуют единый парк с поставщиками."
 NAM_pw_artillery_observers: "Артиллерийская разведка"
 NAM_pw_artillery_observers_desc: "Наблюдатель спорит с батарейным связистом о последней переданной отметке. На картах одного и того же холма стоят разные номера. Инструктор просит обоих восстановить разговор слово в слово."
 NAM_pw_staff_exercises: "Штабные учения"
 NAM_pw_staff_exercises_desc: "На учениях штабы столкнутся с потерей связи, задержками подвоза и сменой направления удара. Приказы проверят до настоящей операции."
 NAM_pw_combined_arms: "Согласовать боевые порядки"
 NAM_pw_combined_arms_desc: "На учениях пехотный командир спорит с танкистом о времени выхода к рубежу. Сапёр указывает на мост, которого оба не заметили. Руководитель занятия просит начать разбор заново."
 NAM_pw_southern_army: "Южная армия"
 NAM_pw_southern_army_desc: "Оперативное объединение получает согласованный план, подготовленный резерв и единое командование. Частям останется занять назначенные участки."
 NAM_auxiliary_patrol_design:0 "Мобилизационный сторожевик"
 NAM_pw_patrol_refit:0 "Переоборудовать торговые суда в сторожевик"
 NAM_pw_patrol_refit_desc:0 "Верфь отбирает самое крепкое судно партии. На нём появятся артиллерийская площадка, пост наблюдения и кубрик для вахты. Остальные корпуса пойдут на запчасти и оборудование."
 NAM_pw_patrol_refit_unlock_tt:0 "После применения решения: переоборудует торговые конвои в боевой сторожевик."
 NAM_pw_patrol_refit_cost:0 "§Y10§! £convoy_texticon"
 NAM_pw_patrol_refit_cost_blocked:0 "§R10§! £convoy_texticon"
 NAM_pw_patrol_refit_cost_tooltip:0 "§Y10§! £convoy_texticon"
 NAM_naval_slip_free_tt:0 "Стапель свободен для переоборудования или заказа боевых кораблей."
 NAM_pw_patrol_refit_result_tt:0 "Стапель будет занят §Y42§! £time_texticon дня. Резервный флот получит §G1§! боевой сторожевик. При потере обеих верфей, подчинении или капитуляции транспорты вернутся в резерв."
 NAM_pw_patrol_refit_refund_tt:0 "В резерв вернутся §G10§! £convoy_texticon."
 NAM_pw_landing_intake_tt:0 "После расширения учебной базы через программу можно развернуть до §G9§! морских батальонов."
 NAM_pw_naval_review: "Задачи флота"
 NAM_pw_naval_review_desc:0 "Морской штаб разложил на длинном столе судовые журналы. Капитаны узнают свои пометки, сделанные посреди войны. Инженеры верфи слушают рассказы о повреждениях, не вошедших в официальные рапорты."
 NAM_pw_escort_fleet: "Охрана коммуникаций"
 NAM_pw_escort_fleet_desc: "Сопровождение грузов станет основной работой боевых кораблей. Прикрытие перевозок потребует постоянной смены эскортов."
 NAM_pw_strike_fleet: "Подводная блокада"
 NAM_pw_strike_fleet_desc: "Подводные силы будут искать транспорты противника на подходах к его портам. Командование готовит лодки к самостоятельным походам."
 NAM_pw_naval_workshops: "Судоремонтные мощности"
 NAM_pw_naval_workshops_desc: "Докам нужны собственные цеха и запас оборудования. Корабли не должны уходить за пределы страны ради планового ремонта."
 NAM_pw_crew_schools: "Морские учебные центры"
 NAM_pw_crew_schools_desc: "Учебные центры объединят подготовку специалистов по связи, борьбе за живучесть и навигации."
 NAM_pw_naval_fuel_depots: "Расширение Южной гавани"
 NAM_pw_naval_fuel_depots_desc: "Причалы и погрузочное оборудование должны обслуживать военные корабли одновременно с торговыми судами."
 NAM_program_naval_fuel_depots:0 "Расширить снабжение Южной гавани"
 NAM_program_naval_fuel_depots_desc: "Причалы и погрузочное оборудование должны обслуживать военные корабли одновременно с торговыми судами."
 NAM_program_naval_fuel_depots_cost: "§Y650§! £ADISCORD_economy_treasury_texticon"
 NAM_program_naval_fuel_depots_cost_blocked: "§Y650§! £ADISCORD_economy_treasury_texticon"
 NAM_program_naval_fuel_depots_cost_tooltip: "§Y650§! £ADISCORD_economy_treasury_texticon"
 NAM_program_naval_fuel_depots_result_tt:0 "База снабжает флот §G100000§! £fuel_texticon и §G25§! £convoy_texticon. Причалы расширяются на уровень, если порт ещё не полностью развит."
 NAM_program_naval_fuel_depots_unlock_tt:0 "После применения решения: закупает топливо и конвои, расширяя действующий порт при наличии места."
 NAM_pw_landing_supply: "Обеспечение десанта"
 NAM_pw_landing_supply_desc: "Погрузку частей и снабжение берега сведут в один план. Подготовка морской пехоты должна идти вместе с подготовкой транспортов."
 NAM_program_landing_supply:0 "Заказать транспорт для десанта"
 NAM_program_landing_supply_desc: "Погрузку частей и снабжение берега сведут в один план. Подготовка морской пехоты должна идти вместе с подготовкой транспортов."
 NAM_program_landing_supply_cost:0 "§Y700§! £ADISCORD_economy_treasury_texticon"
 NAM_program_landing_supply_cost_blocked:0 "§Y700§! £ADISCORD_economy_treasury_texticon"
 NAM_program_landing_supply_cost_tooltip:0 "§Y700§! £ADISCORD_economy_treasury_texticon"
 NAM_program_landing_supply_result_tt:0 "По завершении: §G+40§! £convoy_texticon. При утрате условий оплата возвращается полностью."
 NAM_program_landing_supply_unlock_tt:0 "После применения решения: закупает конвои для десантного снабжения."
 NAM_pw_naval_service: "Морское оперативное командование"
 NAM_pw_naval_service_desc: "Командование объединит корабельные соединения, ремонтные службы и планирование высадок."
 NAM_pw_air_review:0 "Авиационная закупочная комиссия"
 NAM_pw_air_review_desc:0 "Обе конструкторские группы готовы выставить машины на приёмку. Лётчики испытают их с оружием и полными баками, пока штаб решает, что важнее для юга: прикрытие с воздуха или поддержка пехоты."
 NAM_pw_air_defence: "Прикрытие страны"
 NAM_pw_air_defence_desc: "Истребительные части сосредоточатся на перехвате над городами и транспортными узлами."
 NAM_pw_frontline_air: "Поддержка сухопутных войск"
 NAM_pw_frontline_air_desc: "Лётчики будут работать по заявкам наземных частей. Связь с передовыми штабами станет основой боевой работы."
 NAM_pw_airfield_network: "Сеть аэродромов"
 NAM_pw_airfield_network_desc: "Инженеры готовят посадочные площадки и рассредоточение авиации у Южной гавани."
 NAM_program_airfield_network:0 "Оборудовать сеть аэродромов"
 NAM_program_airfield_network_desc: "Инженеры готовят посадочные площадки и рассредоточение авиации у Южной гавани."
 NAM_program_airfield_network_cost:0 "§Y600§! £ADISCORD_economy_treasury_texticon"
 NAM_program_airfield_network_cost_blocked:0 "§Y600§! £ADISCORD_economy_treasury_texticon"
 NAM_program_airfield_network_cost_tooltip:0 "§Y600§! £ADISCORD_economy_treasury_texticon"
 NAM_program_airfield_network_result_tt:0 "В сеть воздушного снабжения поступают §G24§! £unit_transport_plane_icon_small транспортных самолёта и §G160§! £motorized_texticon. В гавани расширяется аэродром, если доступен ещё один уровень."
 NAM_program_airfield_network_unlock_tt:0 "После применения решения: закупает транспортные самолёты и грузовики и расширяет аэродром Южной гавани при наличии места."
 NAM_pw_flight_schools: "Подготовка лётных экипажей"
 NAM_pw_flight_schools_desc: "Учебные части выделяют машины и инструкторов для полётов в условиях, близких к боевым."
 NAM_pw_radar_posts: "Радиолокационные посты"
 NAM_pw_radar_posts_desc: "Посты наблюдения свяжут с аэродромами и городскими службами оповещения."
 NAM_program_radar_posts:0 "Развернуть радиолокационные посты"
 NAM_program_radar_posts_desc: "Посты наблюдения свяжут с аэродромами и городскими службами оповещения."
 NAM_program_radar_posts_cost:0 "§Y600§! £ADISCORD_economy_treasury_texticon"
 NAM_program_radar_posts_cost_blocked:0 "§Y600§! £ADISCORD_economy_treasury_texticon"
 NAM_program_radar_posts_cost_tooltip:0 "§Y600§! £ADISCORD_economy_treasury_texticon"
 NAM_program_radar_posts_result_tt:0 "В гавань прибывают §G36§! £unit_fighter_icon_small перехватчиков. Радар и аэродром расширяются на уровень, если ещё не достигли предела."
 NAM_program_radar_posts_unlock_tt:0 "После применения решения: закупает перехватчики и расширяет радар и аэродром гавани при наличии места."
 NAM_pw_engine_workshops:0 "Авиаремонтные мастерские"
 NAM_pw_engine_workshops_desc:0 "Списанные машины стоят под брезентом на краю аэродрома. Мотористы отбирают годные агрегаты, а завод прислал оснастку и чертежи новой серии."
 NAM_pw_air_supply: "Транспортная авиация"
 NAM_pw_air_supply_desc: "Воздушные перевозки поддержат части там, где наземная доставка сорвана. Транспортные экипажи начнут с освоения маршрутов и площадок."
 NAM_program_air_supply:0 "Открыть воздушный мост"
 NAM_air_bridge_deliveries:0 "Снабжение по воздуху"
 NAM_air_bridge_departure_tt:0 "Светлогорье независимо и располагает действующим аэродромом в Южной гавани."
 NAM_air_bridge_lost_tt:0 "Аэродром отправления или район разгрузки больше не доступен для наших рейсов."
 NAM_air_bridge_end_tt:0 "Поставки прекращаются, §Y12§! £unit_transport_plane_icon_small транспортных самолётов возвращаются на склад. Оплаченные рейсы и выданное топливо израсходованы."
 NAM_air_bridge_forward_tt:0 "Наземные авианаводчики позволяют доставлять грузы по воздушному мосту также в занятые нашими войсками иностранные округа на юге."
 NAM_program_air_supply_desc:0 "В гавани грузят горючее, продовольствие и боеприпасы. Окружной диспетчер передаёт экипажам координаты разгрузки."
 NAM_program_air_supply_cost:0 "§Y350§! £ADISCORD_economy_treasury_texticon §Y15000§! £fuel_texticon §Y12§! £unit_transport_plane_icon_small $ADISCORD_transport_airframe_2162$"
 NAM_program_air_supply_cost_blocked:0 "§Y350§! £ADISCORD_economy_treasury_texticon §Y15000§! £fuel_texticon §Y12§! £unit_transport_plane_icon_small $ADISCORD_transport_airframe_2162$"
 NAM_program_air_supply_cost_tooltip:0 "§Y350§! £ADISCORD_economy_treasury_texticon §Y15000§! £fuel_texticon §Y12§! £unit_transport_plane_icon_small $ADISCORD_transport_airframe_2162$"
 NAM_program_air_supply_result_tt:0 "На время рейсов выбранный округ получает §G+3§! местного снабжения. Транспортная группа занята на маршруте и возвращается в резерв при его закрытии."
 NAM_program_air_supply_unlock_tt:0 "После применения решения: выбранный на карте округ временно получает снабжение по воздуху из Южной гавани."
 NAM_pw_ground_control: "Наземное управление авиацией"
 NAM_pw_ground_control_desc: "Радиопосты и штабы введут общий порядок передачи целей. Приоритет вылетов будет определяться обстановкой на земле."
 NAM_pw_southern_air_command: "Южное авиационное командование"
 NAM_pw_southern_air_command_desc: "На аэродроме собрали лётчиков, техников и представителей заводов. Вопросов так много, что штабной офицер перестаёт следовать повестке. Механик просит первым делом осмотреть стоящую под навесом машину."

 NAM_pw_transport_batches_tt: "После стандартизации заказы железнодорожных перевозок дополнительно доставляют §G15§! £train_texticon, автомобильных колонн - §G200§! £motorized_texticon."
 NAM_pw_transport_assets_tt: "Выбранный курс обеспечен резервом: §Y20§! £train_texticon для железных дорог либо §Y200§! £motorized_texticon для автомобильных колонн. Резерв не расходуется фокусом."
 NAM_pw_combined_engineers_tt: "После фокуса $NAM_pw_combined_arms$ инженерные части получают ещё §G120§! £ADISCORD_artillery_texticon с каждым заказом."
 NAM_pw_combined_carriers_tt: "После фокуса $NAM_pw_combined_arms$ завод сдаёт ещё §G80§! £unit_mechanized_icon_small $ADISCORD_armored_carrier_2163$ с каждым заказом."
 NAM_pw_army_assets_tt: "В армии служит не менее §Y18000§! человек, а резерв содержит §Y3000§! £infantry_equipment_texticon и §Y200§! £support_equipment_texticon;\nлибо для формирования резерва есть §Y6000§! £manpower_texticon, §Y9000§! £infantry_equipment_texticon и §Y200§! £support_equipment_texticon.\nФокус ничего из этого не расходует."
 NAM_program_naval_workshops:0 "Расширить судоремонтные мастерские"
 NAM_program_naval_workshops_desc: "Докам нужны собственные цеха и запас оборудования. Корабли не должны уходить за пределы страны ради планового ремонта."
 NAM_program_naval_workshops_cost: "§Y950§! £ADISCORD_economy_treasury_texticon"
 NAM_program_naval_workshops_cost_blocked: "§Y950§! £ADISCORD_economy_treasury_texticon"
 NAM_program_naval_workshops_cost_tooltip: "§Y950§! £ADISCORD_economy_treasury_texticon"
 NAM_program_naval_workshops_result_tt:0 "Мастерские передают §G24§! £convoy_texticon и открывают верфь при наличии места. Пока гавань под нашим контролем, каждый оплаченный заказ эскортов или подлодок даёт третий корабль того же типа."
 NAM_program_naval_workshops_unlock_tt:0 "После применения решения: закупает конвои и строит верфь при наличии места; действующие мастерские увеличивают последующие заказы эскортов и подлодок."
 NAM_program_flight_schools:0 "Подготовить командира авиакрыла"
 NAM_program_flight_schools_desc: "Учебные части выделяют машины и инструкторов для полётов в условиях, близких к боевым."
 NAM_program_flight_schools_cost: "§Y250§! £ADISCORD_economy_treasury_texticon §Y15000§! £fuel_texticon"
 NAM_program_flight_schools_cost_blocked: "§Y250§! £ADISCORD_economy_treasury_texticon §Y15000§! £fuel_texticon"
 NAM_program_flight_schools_cost_tooltip: "§Y250§! £ADISCORD_economy_treasury_texticon §Y15000§! £fuel_texticon"
 NAM_program_flight_schools_result_tt:0 "По окончании курса следующая закупка истребителей или штурмовиков выпустит аса соответствующего профиля. Школа готовит одного командира."
 NAM_program_flight_schools_unlock_tt:0 "После применения решения: следующая закупка истребителей или штурмовиков даёт аса для авиакрыла соответствующего типа."
 NAM_program_power_reserve:0 "Прикрыть аэродромы зенитными батареями"
 NAM_program_power_reserve_desc: "Зенитчики осматривают площадку у аэродромных мастерских. Дежурный лётчик показывает им направление обычного захода. Над столом с картами проносится учебная машина."
 NAM_program_power_reserve_cost: "§Y550§! £ADISCORD_economy_treasury_texticon"
 NAM_program_power_reserve_cost_blocked: "§Y550§! £ADISCORD_economy_treasury_texticon"
 NAM_program_power_reserve_cost_tooltip: "§Y550§! £ADISCORD_economy_treasury_texticon"
 NAM_program_power_reserve_result_tt:0 "В резерв ПВО поступают §G120§! £anti_air_texticon зенитных орудий и §G180§! £support_equipment_texticon. В гавани оборудуют дополнительную позицию ПВО, если есть место."
 NAM_program_power_reserve_unlock_tt:0 "После применения решения: закупает зенитные орудия и снаряжение поддержки и усиливает ПВО гавани при наличии места."
 NAM_pw_air_batches_tt: "После создания Южного авиационного командования заказы истребителей и штурмовиков дополнительно доставляют §G12§! самолётов соответствующего типа."

 NAM_pw_supply_hub_ready_tt: "В $STATE_690$ или $STATE_719$ есть собственный контролируемый узел снабжения, соединённый железной дорогой с $STATE_700$."
 NAM_pw_cabinet_statute_programme_tt: "После завершения $NAM_pw_cabinet_statute$: Соответствующая оплаченная промышленная программа действует §G270§! £time_texticon дней вместо §Y180§!, в том числе при завершении уже начатого заказа."
 NAM_pw_state_chamber_programme_tt: "После завершения $NAM_pw_state_chamber$: Соответствующая оплаченная промышленная программа действует §G270§! £time_texticon дней вместо §Y180§!, в том числе при завершении уже начатого заказа."
 NAM_pw_southern_subject_tt: "Шахрабад подчинён Светлогорью."
 NAM_pw_southern_military_programme_tt: "После завершения $NAM_pw_southern_military_rule$: Военный резерв дополнительно доставляет Светлогорью §G9000§! £infantry_equipment_texticon."
 NAM_program_southern_local_offices:0 "Оснастить местные управления юга"
 NAM_program_southern_local_offices_desc: "В южной управе ждут светлогорского поверенного. Местные мастера принесли планы мастерских, сохранившиеся после боёв. Секретарь освобождает длинный стол, прежде занятый военными сводками."
 NAM_program_southern_local_offices_cost: "§Y900§! £ADISCORD_economy_treasury_texticon"
 NAM_program_southern_local_offices_cost_blocked: "§Y900§! £ADISCORD_economy_treasury_texticon"
 NAM_program_southern_local_offices_cost_tooltip: "§Y900§! £ADISCORD_economy_treasury_texticon"
 NAM_program_southern_local_offices_result_tt:0 "Шахрабад получает два участка, §G200§! £motorized_texticon и линию §G3§! уровня Северный Хазар - Старый Хазар - Хазар. Светлогорье получает §G16§! £train_texticon."
 NAM_program_southern_local_offices_unlock_tt:0 "После применения решения: развивает участки и транспорт Шахрабада; Светлогорье получает поезда."
 NAM_program_rail_priority_site_tt: "Светлогорье владеет регионами $STATE_688$, $STATE_690$, $STATE_67$ и контролирует весь железнодорожный маршрут."
 NAM_program_logistics_depots_site_tt: "Светлогорье владеет регионами $STATE_700$, $STATE_689$, $STATE_690$, $STATE_67$ и контролирует весь железнодорожный маршрут. В регионе $STATE_690$ ещё нет узла снабжения."
 NAM_program_freight_depots_site_tt: "Светлогорье владеет регионами $STATE_700$, $STATE_689$, $STATE_690$, $STATE_719$ и контролирует весь железнодорожный маршрут. В регионе $STATE_719$ ещё нет узла снабжения."
 NAM_program_southern_corridor_site_tt: "Светлогорье владеет регионами $STATE_688$, $STATE_690$, $STATE_689$, $STATE_700$ и контролирует весь железнодорожный маршрут."
 NAM_cooperative_congress_tt:0 "На карте промыслов выберите округ для глубокого бурения.\nПервый завершённый заказ артели поднимет местный предел мощности на §G2§! до открытия новых скважин.\nРазведка работает и на полностью освоенном промысле, один раз в каждом округе."
 NAM_cooperative_congress:0 "Съезд промысловых артелей"
 NAM_cooperative_congress_desc:0 "Артели впервые прислали в Светлогорск делегатов с журналами проходки. Старые карты обрываются у последней вышки, хотя бурильщики давно приметили залежи за её пределами."
 NAM_haulage_cooperatives_delivery_tt:0 "Каждая завершённая кооперативная стройка дополнительно поставляет §G150§! £motorized_texticon."
 NAM_haulage_cooperatives:0 "Перевозки силами артелей"
 NAM_haulage_cooperatives_desc:0 "Артели предлагают сами забирать продукцию у ворот цеха. Каждая смена будет отвечать за свои машины и маршрут."
 NAM_tool_cooperatives_delivery_tt:0 "Каждая завершённая кооперативная стройка дополнительно поставляет §G180§! £support_equipment_texticon."
 NAM_tool_cooperatives:0 "Общие инструментальные дворы"
 NAM_tool_cooperatives_desc:0 "Сельские мастера привезли на съезд собственные инструменты. Рядом с потёртыми рукоятями лежат чертежи приспособлений, о которых соседи прежде не слышали. Спор продолжается и после закрытия заседания."
 NAM_district_fair:0 "Окружная промышленная ярмарка"
 NAM_district_fair_desc:0 "Округа закрепляют за ярмаркой постоянную площадку. Артели смогут показывать покупателям действующие машины и принимать заказы прямо у станка."
 NAM_relief_register:0 "Окружная служба помощи"
 NAM_relief_register_desc:0 "После паводка доброволец из соседнего округа предъявляет управе своё удостоверение. Писарь долго ищет знакомую печать в справочнике. Снаружи его уже ждут товарищи с лодкой."
 NAM_relief_trains:0 "Санитарные поезда"
 NAM_relief_trains_desc:0 "Железнодорожники отвели вагоны под перевязочные и койки. В расписании для них оставят свободные пути к окружным больницам."
 NAM_mobile_clinics:0 "Выездные врачебные бригады"
 NAM_mobile_clinics_desc:0 "Врач спрашивает у водителя дорогу к дальнему промыслу. В кузове стучат неплотно уложенные медицинские ящики. У сельской управы их ждёт фельдшер с тетрадью домашних адресов."
 NAM_rescue_college:0 "Училище аварийной связи"
 NAM_rescue_college_desc:0 "Диспетчеры, врачи и путейцы учились по разным уставам. Первые общие занятия пройдут на линии, которая чаще других теряет связь во время паводка."
 NAM_relief_reserves:0 "Резерв окружных служб"
 NAM_relief_reserves_desc:0 "Аварийные мастера обходят ярмарочные склады вместе с местным смотрителем. На дверях ещё видны отметки прошлогодней воды. Спорят о том, какой дорогой сюда можно добраться ночью."
 NAM_freight_brokerage:0 "Фрахтовая контора"
 NAM_freight_brokerage_desc:0 "Капитанам надоело ждать отдельного наряда от каждого торгового дома. Контора соберёт обратные рейсы в одном расписании."
 NAM_chartered_tonnage_delivery_tt:0 "Каждый завершённый заказ торгового двора дополнительно поставляет §G15§! £convoy_texticon."
 NAM_chartered_tonnage:0 "Долгосрочный фрахт"
 NAM_chartered_tonnage_desc:0 "Капитан рассказывает поверенному о привычном обратном рейсе. В судовом журнале возле каждой пристани стоит чьё-то имя. Он просит не торопиться с чистовым договором, пока не ответят эти люди."
 NAM_tractor_leasing_delivery_tt:0 "Каждый завершённый заказ торгового двора дополнительно поставляет §G240§! £motorized_texticon."
 NAM_tractor_leasing:0 "Лизинг грузового парка"
 NAM_tractor_leasing_desc:0 "Начальник автопарка встречает заводских механиков у ворот. Они осматривают тягач, которым прежде разгружали суда. Водитель показывает на кузове следы прошлой портовой работы."
 NAM_bonded_terminal:0 "Таможенный терминал"
 NAM_bonded_terminal_desc:0 "На территории порта выделят участок, где нефтепродукты можно хранить под пломбой до передачи покупателю."
 NAM_testing_office:0 "Бюро промышленной приёмки"
 NAM_testing_office_desc:0 "Военный приёмщик и преподаватель политехникума встречаются у испытательного стенда. Мастер показывает записи предыдущего опыта. Когда запускают двигатель, разговор приходится продолжать жестами."
 NAM_precision_gauges:0 "Поверочные мастерские"
 NAM_precision_gauges_desc:0 "Инструментальщик раскладывает лекала разных мастерских рядом. Ученик первым замечает, что одно не совпадает с остальными. Мастер молча достаёт из шкафа старый поверочный образец."
 NAM_relay_trials:0 "Испытания релейной связи"
 NAM_relay_trials_desc:0 "Портовый связист вызывает склад по новой линии и ждёт ответа. В трубке слышен треск, потом знакомый голос. Инженер просит повторить всё ещё раз, пока помощник записывает показания прибора."
 NAM_licensed_workshop:0 "Цех серийного выпуска"
 NAM_licensed_workshop_desc:0 "Мастер принимает иностранного инженера у собственного верстака. Между ними лежат чертежи с непонятными пометками. Подмастерье переводит названия деталей по купленному в порту словарю."
 NAM_through_waybill:0 "Сквозная накладная"
 NAM_through_waybill_desc:0 "Порт, завод и железная дорога будут принимать одну накладную. Вагоны уйдут с причала без ожидания нового поручительства в каждом округе."
 NAM_pw_broadcast_slot_tt:0 "Места для одновременных кампаний: §G+1§!."
 NAM_pw_lab_drilling_tt:0 "На карте промыслов доступно глубокое бурение. На своих контролируемых промыслах предел мощности увеличивается на §G2§! ед. Выберите площадку и оплатите бурение в программах Светлогорья."
 NAM_sp_shallow_landing_barge:0 "Мелкосидящая десантная баржа"
 NAM_sp_shallow_landing_barge_desc:0 "На отмелях Южной гавани глубокая осадка губит высадку вернее береговых батарей. Опытному корпусу предстоит доставить роту с грузом через прибой и своим ходом вернуться на верфь."
 NAM_barge_project_tt:0 "Назначьте судостроителя в морской исследовательский центр. Спецпроект §YМелкосидящая десантная баржа§! открывает серийный заказ для десантного флота."
 NAM_barge_series_tt:0 "После испытаний каждый оплаченный заказ десантного транспорта дополнительно поставляет §G20§! £convoy_texticon."
 NAM_pw_loot_tt_winner:0 "§YПризовой груз§!\nДобычу можно сдать скупщикам. При успехе флотилия привезёт §G50§! добычи, на маршрутах Ажара и Эфлора - §G60§!. Богатый приз приносит §G100§!."
 NAM_pw_notoriety_tt_winner:0 "§YДурная слава§!: [?NAM_pirate_notoriety|0]/100.\nЕжемесячно снижается на §G3§!.\nПри §R60§! или выше настороженный противник может установить блокаду на §Y90§! £time_texticon.\nМежду блокадами проходит не менее §Y120§! £time_texticon."
 NAM_pw_fleet_tt_winner:0 "§YКаперская флотилия§!\nОдновременно можно вести §Y1§! рейд. Срок: §Y15§! £time_texticon. Красный знак означает, что флотилия ещё в море."
 NAM_barge_no_facility_tt:0 "Для испытаний нужен морской исследовательский центр. В Светлогорске и Южной гавани нет свободного места для него; постройте центр в другом подконтрольном порту."
