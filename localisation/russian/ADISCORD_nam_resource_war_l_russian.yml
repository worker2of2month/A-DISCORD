 NAM_crisis_office: "Служба происшествий"
 NAM_crisis_office_desc: "Пожары, стачки и скандалы больше не застают канцелярию врасплох. Служба держит чрезвычайный фонд и устав действий на каждую беду."
 NAM_field_firefighters: "Пожарные дружины промыслов"
 NAM_field_firefighters_desc: "На учебной площадке промысловая дружина разворачивает мокрые рукава. Мастер показывает на закопчённый резервуар и рассказывает о последнем пожаре. На этот раз его слушают и чиновники канцелярии."
 NAM_chancellery_purge: "Чистка канцелярии"
 NAM_chancellery_purge_desc: "Ревизоры вскрывают опечатанные ящики в кабинете старшего писаря. Внутри лежат расписки, не попавшие в официальную книгу. Хозяин кабинета ждёт в коридоре между двумя стражниками."
 NAM_field_firefighters_tt: "Пожар на промысле тушится без затрат казны. Уступка бастующим нефтяникам стоит §Y100§! £ADISCORD_economy_treasury_texticon вместо §Y250§!."
 NAM_chancellery_purge_tt: "Ревизия промыслов дополнительно возвращает §G150§! £ADISCORD_economy_treasury_texticon ценой §R-6§! £NAM_support_trade_texticon; требуется поддержка контор не ниже §Y30§!.\nЗамять скандал стоит §Y30§! £political_power_texticon вместо §Y60§!. Доля от выявленной контрабанды: §G250§! £ADISCORD_economy_treasury_texticon вместо §G100§!."
 NAM_crisis_office_tt:0 "До следующих происшествий: §G+60§! £time_texticon. Срок ответа: §G+7§! £time_texticon. Продлевает и текущий таймер."
 NAM_grp_chancellery_purge_tt: "Поддержка групп:\n  Наместники: §R-5§! £NAM_support_nam_texticon\n  Округа: §G+5§! £NAM_support_dist_texticon"
 NAM_treasury: "Казна Светлогорья"
 NAM_treasury_desc: "§YГОСУДАРСТВЕННАЯ КАЗНА§!\nДоступно: §Y[?ADISCORD_economy_treasury|0]§! £ADISCORD_economy_treasury_texticon\n\n§YРАСПОРЯЖЕНИЕ СРЕДСТВАМИ§!\nКазну и политическую власть можно обменивать друг на друга; курс указан в решениях.\n\n§YЧРЕЗВЫЧАЙНЫЙ ФОНД§!\nПроисшествия случаются в среднем раз в год. Фонд закрывает любое из них без потерь."
 NAM_bond_payments: "Выплаты по облигациям"
 NAM_bond_payments_desc: "Канцелярия расплачивается с держателями нефтяных облигаций."
 NAM_oil_bonds: "Нефтяные облигации"
 NAM_oil_bonds_desc: "Казначейство готовит выпуск бумаг под будущую нефтяную выручку. Покупатели потребуют заверенные обязательства и понятный порядок расчётов."
 NAM_emergency_decrees: "Чрезвычайные указы"
 NAM_emergency_decrees_desc: "Канцелярия оформляет чрезвычайные сборы отдельным указом. Местные управы получат подписанные ведомости и распоряжения для сборщиков."
 NAM_buy_machine_tools: "Закупить станки"
 NAM_buy_machine_tools_desc: "Торговые поверенные предлагают партию станков для Южной гавани. Инженеры осмотрят оборудование и подготовят помещения, прежде чем казначеи подпишут приёмные бумаги."
 NAM_fuel_audit: "Ревизия промыслов"
 NAM_fuel_audit_desc: "Инспекторы сверяют цистерны с накладными. За исправленными цифрами скрываются запасы, о которых хозяева складов предпочли забыть."
 NAM_crisis_fund: "Пополнить чрезвычайный фонд"
 NAM_crisis_fund_desc: "Казначей запирает отдельный ящик стола и записывает номер ключа. Начальник аварийной службы ждёт у двери с перечнем недавних происшествий. Им предстоит долгий разговор о каждом из них."
 NAM_crisis_prevention: "Профилактика происшествий"
 NAM_crisis_prevention_desc: "На промысловом учении начальник службы просит повторить тревогу. Люди идут к сборному месту разными дорогами. Инспектор записывает, кто первым заметил оставленный открытым вентиль."
 NAM_crisis_fund_tt: "Одно текущее или будущее происшествие можно закрыть §Gбез потерь§!, израсходовав фонд. Он сохраняется до использования."
 NAM_crisis_prevention_tt:0 "Следующее происшествие откладывается на §G60§! £time_texticon."
 NAM_crisis_fund_used_tt: "Расходуется чрезвычайный фонд."
 NAM_crisis_free_tt: "Обходится без затрат."
 NAM_crisis_pay_250_tt: "Казна: §R-250§! £ADISCORD_economy_treasury_texticon."
 NAM_crisis_pay_100_tt: "Казна: §R-100§! £ADISCORD_economy_treasury_texticon."
 ADISCORD_nam_crisis.1.t: "Горит Северная скважина"
 ADISCORD_nam_crisis.1.d: "Ночью на Северных месторождениях сорвало задвижку у старой насосной. Факел поднялся выше вышки, к утру огонь добрался до хранилищ, и над бассейном повисла чёрная полоса, которую видно из Светлогорска. Пожарная команда промысла третьи сутки работает без смены, бригады с соседних участков таскают песок вёдрами.\n\nНачальник промысла прислал в канцелярию короткую телеграмму: насосы, пена и люди есть, нет денег держать их у огня ещё неделю. Нефтяники ждут, как быстро канцелярия ответит. Если промедлить, скважина выгорит сама, а вместе с ней - запас в хранилищах и доверие тех, кто её тушил."
 ADISCORD_nam_crisis.1.a: "Потушить любой ценой."
 ADISCORD_nam_crisis.1.b: "Пусть выгорит."
 ADISCORD_nam_crisis.1.z: "Чрезвычайный фонд."
 ADISCORD_nam_crisis.2.t: "Стачка за прибавку"
 ADISCORD_nam_crisis.2.d: "Утренняя смена на ключевских промыслах отметилась в табеле и не взяла инструмент. К обеду к ней присоединились бурильщики соседних участков, а мастера вывесили на воротах лист с одним требованием: прибавка к жалованью, пока цены в посёлках растут быстрее ставок. Подписей под листом больше, чем рабочих в одной смене.\n\nЭто не люди Вебера, и никто не прячет лиц. Старшие мастера говорят прямо: промыслы кормят казну, а семьи бурильщиков покупают хлеб в долг. Комендант готов вывести стачечников за ворота, но предупреждает, что охрану придётся держать у тех же ворот и завтра."
 ADISCORD_nam_crisis.2.a: "Повысить жалованье."
 ADISCORD_nam_crisis.2.b: "Разогнать стачку."
 ADISCORD_nam_crisis.2.z: "Чрезвычайный фонд."
 ADISCORD_nam_crisis.3.t: "Скандал в канцелярии"
 ADISCORD_nam_crisis.3.d: "Светлогорская газета вышла с фотографией расписки на первой полосе: наместник одного из округов получил деньги за подпись под разрешением на вывоз нефти. К вечеру редакция напечатала ещё четыре, и на каждой стояла знакомая печать. Расписки передал кто-то из самой канцелярии - бумага, номера и почерк подлинные.\n\nВ приёмной ждут представители округов с требованием открытого суда. Наместники напоминают, что половина канцелярии подписывала такие же бумаги и что суд над одним из них станет судом над всей лестницей. Регистратура уже спрашивает, изымать ли оставшиеся экземпляры газеты."
 ADISCORD_nam_crisis.3.a: "Замять дело."
 ADISCORD_nam_crisis.3.b: "Публичный суд."
 ADISCORD_nam_crisis.3.z: "Чрезвычайный фонд."
 ADISCORD_nam_crisis.4.t: "Контрабанда контор"
 ADISCORD_nam_crisis.4.d: "Таможенный пост на дороге к Южной гавани за месяц пропустил втрое меньше цистерн, чем ушло танкеров из порта. Разницу никто не скрывает: экспортные конторы грузят нефть прямо с промысловых веток, минуя весы и пошлину, а портовые чиновники получают за ночную погрузку больше, чем за год службы.\n\nКонторы не оправдываются, а предлагают сделку: канцелярия получит свою долю, а они - бумаги, выписанные задним числом. Таможенники просят другого: перекрыть ветки и задержать хотя бы один танкер, чтобы остальные поняли, что пошлина снова существует."
 ADISCORD_nam_crisis.4.a: "Взять долю."
 ADISCORD_nam_crisis.4.b: "Пресечь контрабанду."
 ADISCORD_nam_crisis.5.t: "Дезертирство в гарнизонах"
 ADISCORD_nam_crisis.5.d: "За неделю из гарнизона у Сухоречья ушли сорок солдат, из Ключевска - вдвое больше. Уходили не к противнику и не к Веберу, а домой: оставляли винтовки в пирамиде, а на нарах - записку с суммой, которую им задолжали. Патрули ловят беглецов на станциях, но конвоиры сами получают жалованье с опозданием и не торопятся.\n\nКомендант просит денег, чтобы закрыть долг хотя бы перед теми, кто остался. Начальник штаба требует трибунала: если сегодня отпустить ушедших без наказания, завтра пустые казармы окажутся на передовой."
 ADISCORD_nam_crisis.5.a: "Выплатить долги."
 ADISCORD_nam_crisis.5.b: "Созвать трибунал."
 ADISCORD_nam_crisis.5.z: "Чрезвычайный фонд."
 NAM_crisis_1_b_tt: "Нефтяники: §R-8§! £NAM_support_oil_texticon.\nСостояние удерживаемого промысла §YСеверные месторождения§!: базовый ущерб §R-20§!, с усиленной охраной собственного контролируемого округа §R-10§!."
 NAM_crisis_2_a_tt: "Нефтяники: §G+8§! £NAM_support_oil_texticon."
 NAM_crisis_2_b_tt: "Нефтяники: §R-12§! £NAM_support_oil_texticon, гарнизоны: §G+4§! £NAM_support_garr_texticon."
