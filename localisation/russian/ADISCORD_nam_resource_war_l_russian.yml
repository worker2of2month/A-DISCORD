 # Ladder of seals: favours
 NAM_favour_nam: "Милость наместникам"
 NAM_favour_nam_desc: "Наместники хотят сами распоряжаться назначениями в своих округах. Канцелярия закрепит полномочия за теми, кто готов отвечать за работу управ и сборщиков."
 NAM_favour_nam_ready_tt: "Поддержка наместников не ниже §Y70§! £NAM_support_nam_texticon"
 NAM_favour_nam_tt: "Поддержка наместников: §R-15§! £NAM_support_nam_texticon.\nЕсли баланс сил уже сформирован: §Y10§! п.п. к вертикали."
 NAM_favour_oil: "Милость промыслам"
 NAM_favour_oil_desc: "Начальники промыслов требуют свободы в распределении смен и выручки. Пусть представят свои планы перед общим советом."
 NAM_favour_oil_ready_tt: "Поддержка нефтяников не ниже §Y70§! £NAM_support_oil_texticon"
 NAM_favour_oil_tt: "Поддержка нефтяников: §R-15§! £NAM_support_oil_texticon.\nЕсли баланс сил уже сформирован: §Y5§! п.п. к округам."
 NAM_favour_dist: "Милость округам"
 NAM_favour_dist_desc: "Окружные делегаты привезли собственные планы школ, мостов и местных сборов. Теперь предстоит решить, какие полномочия столица готова передать на места."
 NAM_favour_dist_ready_tt: "Поддержка округов не ниже §Y70§! £NAM_support_dist_texticon"
 NAM_favour_dist_tt: "Поддержка округов: §R-15§! £NAM_support_dist_texticon.\nЕсли баланс сил уже сформирован: §Y10§! п.п. к округам."
 NAM_favour_garr: "Милость гарнизонам"
 NAM_favour_garr_desc: "Командиры гарнизонов добиваются прямого доступа к ведомствам снабжения и призыва. Их заявки лягут на стол вместе с обязательствами перед округами."
 NAM_favour_garr_ready_tt: "Поддержка гарнизонов не ниже §Y70§! £NAM_support_garr_texticon"
 NAM_favour_garr_tt: "Поддержка гарнизонов: §R-15§! £NAM_support_garr_texticon.\nЕсли баланс сил уже сформирован: §Y5§! п.п. к вертикали."
 NAM_favour_trade: "Милость конторам"
 NAM_favour_trade_desc: "Экспортные конторы просят особых условий для новых контрактов. Казначеи и торговые поверенные должны согласовать, чьи подписи будут стоять под сделками."
 NAM_favour_trade_ready_tt: "Поддержка экспортных контор не ниже §Y70§! £NAM_support_trade_texticon"
 NAM_favour_trade_tt: "Поддержка экспортных контор: §R-15§! £NAM_support_trade_texticon."
 NAM_favour_nam_idea: "Милость наместникам"
 NAM_favour_nam_idea_desc: "Наместники получили свою долю власти и платят за неё исправными сборами и послушными управами."
 NAM_favour_oil_idea: "Милость промыслам"
 NAM_favour_oil_idea_desc: "Промыслы работают на себя и потому работают лучше: смены полные, насосы исправны."
 NAM_favour_dist_idea: "Милость округам"
 NAM_favour_dist_idea_desc: "Округа строят то, что нужно им самим, и не ждут разрешения канцелярии на каждый мост."
 NAM_favour_garr_idea: "Милость гарнизонам"
 NAM_favour_garr_idea_desc: "Гарнизоны первыми получают снаряжение и людей и отвечают на это дисциплиной."
 NAM_favour_trade_idea: "Милость конторам"
 NAM_favour_trade_idea_desc: "Конторы торгуют на льготных условиях и делятся с казной прибылью, которой раньше не было."
 NAM_seal_junta: "Хунта печатей"
 NAM_seal_junta_desc: "Новый правитель взял печати силой. Канцелярия исполняет приказы быстрее, чем когда-либо, но люди помнят, как он пришёл к власти."

 # Ladder of seals: endings
 NAM_spirit_iron_ladder: "Опора на наместников"
 NAM_spirit_iron_ladder_desc: "Каждая ступень лестницы закреплена законом и гарнизоном. Приказ проходит от канцелярии до последнего поста без споров - и без права на ошибку."
 NAM_spirit_service_republic: "Ответственное управление"
 NAM_spirit_service_republic_desc: "Должность в Светлогорье - это обязанность, а не владение. Чиновники отвечают за результат, а не за печать под ним."
 NAM_spirit_federation: "Федеральный договор"
 NAM_spirit_federation_desc: "Округа решают свои дела сами, а общий совет - общие. Власть медленнее, но её решения исполняют без принуждения."
 NAM_spirit_oil_union: "Общественные промыслы"
 NAM_spirit_oil_union_desc: "Промыслы и районы связаны общим договором: каждая бочка учтена, каждая доля выплачена, и нефть работает на всю страну."
 NAM_spirit_prag_republic: "Договорный порядок"
 NAM_spirit_prag_republic_desc: "У каждого полномочия есть предел, а у каждого обещания - исполнитель. Округа, казна и хозяйственные объединения подписали одно соглашение и отвечают по нему наравне с правительством."
 NAM_spirit_prag_directorate: "Совет гарантов"
 NAM_spirit_prag_directorate_desc: "Казна и крупнейшие хозяйственные объединения решают за одним столом и отвечают за сделку собственным имуществом. Договор исполняют раньше, чем его успевают оспорить."
 NAM_ending_coup_leader_tt: "Правитель, взявший печати силой, остаётся во главе страны и сохраняет свой курс."
 NAM_ending_iron_leader_tt: "§YЕгор Ром§! правит Светлогорской Державой (§Yэтатизм§!)."
 NAM_ending_iron_name_tt: "Страна принимает название §YСветлогорская Держава§!."
 NAM_ending_iron_ladder_tt: "Лестница печатей смещается к вертикали на §Y0.20§!.\nСоперники больше не выдвигают требований."
 NAM_ending_service_leader_tt: "§YЕгор Ром§! возглавляет Светлогорскую Республику (§Yслужебный этатизм§!)."
 NAM_ending_service_name_tt: "Страна принимает название §YСветлогорская Республика§!."
 NAM_ending_service_ladder_tt: "Лестница печатей смещается к округам на §Y0.10§!.\nСоперники больше не выдвигают требований."
 NAM_ending_federation_leader_tt: "Совет округов возглавляет §YНадежда Ладыгина§!. Правящей становится §YСветлогорская Гражданская Лига§! (§Yгуманизм§!); выборы не проводятся."
 NAM_ending_federation_name_tt: "Страна принимает название §YСветлогорская Федерация§!."
 NAM_ending_federation_ladder_tt: "Лестница печатей смещается к округам на §Y0.20§!.\nСоперники больше не выдвигают требований."
 NAM_ending_oil_union_leader_tt: "Светлогорский Союз возглавляет §YКирилл Мезенцев§! (§Y$contractual_etatism$§!); Егор Ром уходит из руководства."
 NAM_ending_oil_union_name_tt: "Страна принимает название §YСветлогорский Союз§!."
 NAM_ending_oil_union_ladder_tt: "Лестница печатей смещается к округам на §Y0.10§!.\nСоперники больше не выдвигают требований."
 NAM_ending_prag_republic_leader_tt: "§YЕгор Ром§! остаётся арбитром Светлогорской Республики (§Yпрагматизм§!)."
 NAM_ending_prag_directorate_leader_tt: "§YЕгор Ром§! возглавляет Деловой совет Светлогорской Директории (§Yпрагматизм§!)."
 NAM_ending_prag_republic_name_tt: "Страна принимает название §YСветлогорская Республика§!."
 NAM_ending_prag_directorate_name_tt: "Страна принимает название §YСветлогорская Директория§!."

 # Ladder of seals: declaration and rivals
 ADISCORD_nam_groups.12.t: "Декларация Светлогорья"
 ADISCORD_nam_groups.12.d: "Перед заседанием Ром попросил прочитать декларацию вслух. При чтении обнаружилось, что в одном абзаце Светлогорье уже самостоятельно распоряжается доходами, а в другом ещё обязуется соблюдать все прежние указания метрополии. Составитель предложил оставить второе положение ради преемственности. Ром уточнил, относится ли это и к указаниям, из-за которых собираются объявить независимость. Абзац вернули на правку.\n\nОстальное оказалось труднее. Наместники соглашались отказаться от столичного подчинения при условии, что их собственные полномочия сохранятся. Они собирали платежи, ведали складами и могли назвать людей, которые исполнят завтрашний приказ. Представители округов отвечали, что население давно содержит эти учреждения, но почти не влияет на их решения. Подписывать декларацию в качестве приглашённых свидетелей они не хотели.\n\nРом знал большинство присутствующих по работе. Одного приходилось торопить, другому напоминать о расходах, с третьим можно было условиться заранее. Раньше он разрешал их споры в пределах своих полномочий. Теперь каждый спрашивал, откуда возьмутся эти полномочия после объявления независимости.\n\nСекретарь приготовил место для подписей. Вопрос о порядке подписания вернулся к Рому. Если первыми выступят наместники, новая власть получит опору в действующей администрации. Если округа - им придётся дать больше веса в общем решении. Ром мог выбрать союзников на это заседание; согласия остальных ещё предстояло добиваться."
 ADISCORD_nam_groups.12.d_successor: "Воркерланд распался, и телеграф больше не приносит распоряжений из столицы. В зале канцелярии глава правительства зачитывает декларацию независимости перед наместниками, комендантами и представителями округов. Текст готов, подписей нет: каждая сторона хочет, чтобы её подпись стояла первой.\n\nНаместники напоминают, что именно лестница печатей удержала промыслы от распада. Округа отвечают, что без их согласия декларация останется ещё одной бумагой, которую некому исполнять. Первая подпись ничего не решит навсегда, но покажет, на ком новое государство собирается держаться."
 ADISCORD_nam_groups.12.a: "Первыми подписывают наместники."
 ADISCORD_nam_groups.12.b: "Первыми подписывают округа."
