 NAM_prag_municipal_delivery_unlock_tt:0 "После применения решения: продаёт часть присуждённого топлива для чрезвычайного фонда, передавая остаток Светлогорью."
 NAM_prag_redeem_debentures:0 "Рассчитаться нефтью по облигациям"
 NAM_prag_redeem_debentures_desc:0 "Вкладчики пришли в казначейство с потёртыми долговыми бумагами. За прошедшие годы на обороте накопились подписи разных владельцев. Поверенный гавани просит время, чтобы сверить их с книгой."
 NAM_prag_redeem_debentures_unlock_tt:0 "После применения решения: гасит действующий долг топливным свидетельством, передавая остаток топлива Светлогорью."
 NAM_prag_director_stamp_tt:0 "Продажа нефтяного резерва, расчёт по экспортной партии или завершённый бартерный рейс удостоверяют новый выпуск облигаций.\nЕсли города уже участвуют в займе, свидетельство о поставке действительно §Y180§! £time_texticon вместо §Y90§!."
 NAM_prag_municipal_subscription_tt:0 "С городскими поручителями новые свидетельства о поставках Делового совета действительны §Y180§! £time_texticon вместо §Y90§!."
 NAM_prag_charter_warrant_price:0 "§Y1§! складское свидетельство"
 NAM_prag_charter_fuel_price:0 "§Y60000§! £fuel_texticon"
 NAM_pw_contract_arbitration_desc:0 "На судебное заседание вызвали поставщика и представителей его кредиторов. В зале тесно от людей с одинаковыми копиями договора. Пристав просит освободить место для складского смотрителя."
 NAM_pw_contract_arbitration_unlock_tt:0 "После применения решения: присуждает топливное свидетельство, которое можно предъявить складу поставщика."
 NAM_pw_contract_arbitration_cost:0 "§Y35§! £political_power_texticon §Y350§! £ADISCORD_economy_treasury_texticon"
 NAM_pw_contract_arbitration_cost_tooltip:0 "§Y35§! £political_power_texticon §Y350§! £ADISCORD_economy_treasury_texticon"
 NAM_pw_contract_arbitration_cost_blocked:0 "§R35§! £political_power_texticon §R350§! £ADISCORD_economy_treasury_texticon"
 NAM_pw_contract_arbitration_ready_tt:0 "Светлогорье независимо, действует и победило в ресурсной войне"
 NAM_pw_contract_arbitration_refund_tt:0 "При отмене полностью возвращаются: §G35§! £political_power_texticon §G350§! £ADISCORD_economy_treasury_texticon."
 NAM_state_plan:0 "Центральный производственный план"
 NAM_state_plan_desc:0 "Канцелярия сведёт государственные заказы в один график. Управляющие будут отвечать за выпуск перед единой комиссией, а не торговаться с каждым наместником отдельно."
 NAM_regional_trusts:0 "Окружные тресты"
 NAM_regional_trusts_desc:0 "Наместники сохранят хозяйственную инициативу через подконтрольные тресты. Казна будет требовать исполненного договора, оставляя способы работы местным управляющим."
 NAM_unified_standards:0 "Единые промышленные стандарты"
 NAM_unified_standards_desc:0 "Мастерские бассейна используют несовместимые детали и собственные меры качества. Государственные инженеры соберут общий каталог, которому смогут доверять снабженцы и производители."
 NAM_state_logistics_grid:0 "Магистрали бассейна"
 NAM_state_logistics_grid_desc:0 "На совещание дорожных управлений принесли журналы опоздавших рейсов. Диспетчеры спорят о названиях станций и часах пересменки. Водитель с дальнего промысла отмечает на карте объезд, которого никто из них не знал."
 NAM_state_project_bureaus:0 "Государственные проектные бюро"
 NAM_state_project_bureaus_desc:0 "Вместо разрозненных кабинетов при ведомствах появятся постоянные проектные коллективы. Они будут вести сложные работы от чертежа до приёмки и сохранять знания между заказами."
 NAM_public_utilities:0 "Коммунальные сети"
 NAM_public_utilities_desc:0 "Окружные мастера пришли на совещание с планами водопроводов и улиц. У одних листы новые, у других склеены после войны. На стене пытаются найти место для каждого плана."
 NAM_municipal_services:0 "Общественные службы"
 NAM_municipal_services_desc:0 "Хартия должна стать ощутимой в приёмной, библиотеке и учебной мастерской. Окружные собрания возьмут на себя организацию служб, которые раньше зависели от личной милости наместника."
 NAM_civic_audit:0 "Выборные ревизоры"
 NAM_civic_audit_desc:0 "Жители вправе знать, куда ушла нефтяная выручка. Ревизоров будут назначать окружные собрания; их заключения станут открытыми для соседних управлений и местной печати."
 NAM_district_workshops:0 "Мастерские районов"
 NAM_district_workshops_desc:0 "В приёмных управ побережья и Сухоречья лежат одинаковые прошения: сломанный насос, заклинивший пресс, семья без заработка. Их авторы устали слышать, что ответ снова задержался в столице."
 NAM_open_libraries:0 "Открытые библиотеки"
 NAM_open_libraries_desc:0 "Технические справочники и новые исследования больше не будут запираться в ведомственных архивах. Округа создадут читальни и обмен изданиями для преподавателей, инженеров и учащихся."
 NAM_pragmatic_compact:0 "Договор вместо перевеса"
 NAM_pragmatic_compact_desc:0 "Ни округа, ни наместники не смогли навязать стране собственный порядок. Ром предложит им правительство согласованных обязательств: каждое полномочие должно иметь предел, а каждое обещание - исполнителя."
 NAM_commercial_courts:0 "Хозяйственный арбитраж"
 NAM_commercial_courts_desc:0 "Спор между промыслом и казной не должен останавливать весь город. Арбитражные коллегии получат право требовать документы у обеих сторон и выносить исполнимые решения."
 NAM_export_clearing:0 "Расчётная палата экспорта"
 NAM_export_clearing_desc:0 "Торговые дома прислали в расчётную палату своих счетоводов. На столах лежат копии одних и тех же накладных с разными итогами. Казначей просит начать сверку с подписи портового приёмщика."
 NAM_machine_tool_contracts:0 "Станки в обмен на доверие"
 NAM_machine_tool_contracts_desc:0 "Мастерские прислали в порт списки станков с рисунками нужных деталей. Поверенный иностранного поставщика рассматривает пометки местных слесарей. Некоторые вопросы ему приходится переводить заново."
 NAM_contract_register:0 "Реестр обязательств"
 NAM_contract_register_desc:0 "Одно и то же имущество больше не должно обеспечивать несколько тайных обещаний. Общий реестр покажет, что уже заложено, кому причитается выручка и какой договор имеет первенство."
 NAM_port_agreement:0 "Единый портовый договор"
 NAM_port_agreement_desc:0 "Судовладельцы, грузчики и таможенная служба согласуют одно расписание и общий порядок приёмки. Порт перестанет терять грузы между чужими печатями."
 NAM_warehouse_receipts:0 "Складские свидетельства"
 NAM_warehouse_receipts_desc:0 "Подтверждённый складской запас станет обеспечением хозяйственных договоров. Для этого потребуются опечатанные резервуары, независимые учётчики и место для крупных партий."
 NAM_insured_caravans:0 "Страхование караванов"
 NAM_insured_caravans_desc:0 "Капитан приносит страховщику журнал штормового рейса. На страницах высохли соляные разводы. Представитель торгового дома узнаёт знакомые имена в перечне людей, дежуривших у повреждённого люка."
 NAM_commercial_reserve:0 "Страховой резерв казны"
 NAM_commercial_reserve_desc:0 "На закрытом заседании казначей просит торговые дома предъявить книги обязательств. Поверенные переглядываются, прежде чем открыть папки. До сих пор эти записи не покидали стен их контор."
 NAM_commercial_reserve_tt:0 "Торговые дома берут новые меновые перевозки под своё обеспечение. Пока танкеры в рейсе, можно вести гражданский заказ. Уже принятые заявки завершаются на прежних условиях."
 NAM_balanced_accounts:0 "Взаимные гарантии"
 NAM_balanced_accounts_desc:0 "Правительство сможет требовать исполнения договоров потому, что само научилось отвечать по ним. Порт, расчётная палата и казна сведут гарантии в общий порядок."
 NAM_prag_ending_republic:0 "Республика договоров"
 NAM_prag_ending_republic_desc:0 "Пределы власти закрепят публичным соглашением между округами, казной и хозяйственными объединениями. Ром останется арбитром, обязанным исполнять те же правила, что и остальные."
 NAM_prag_ending_directorate:0 "Деловой совет государства"
 NAM_prag_ending_directorate_desc:0 "Ключевые решения перейдут постоянному совету казны и крупнейших хозяйственных объединений. Ром возглавит его как гарант обязательств, ставя исполнение договоров выше спора о представительстве."
 NAM_prag_settlement_agreements:0 "Расчётные соглашения"
 NAM_prag_settlement_agreements_desc:0 "Представители соседей приехали с собственными проектами соглашения. На полях стоят поправки их военных и казначеев. Ром предлагает начать с тех страниц, на которых меньше всего подписей."
 NAM_prag_partner_supply:0 "Снабжение участников договора"
 NAM_prag_partner_supply_desc:0 "В расчётной палате ждут интендантов союзных штабов. Портовый диспетчер разложил перед ними карты дорог и расписания рейсов. Переводчик просит уточнить названия конечных станций."
 NAM_prag_south_guarantees:0 "Гарантии южных контрактов"
 NAM_prag_south_guarantees_desc:0 "Казна не сможет отвечать по южным обязательствам, пока их исполнение зависит от воли чужого гегемона. Совет подготовит общую кампанию и объявит порядок послевоенного расчёта."
 NAM_prewar_pragmatic_mandate_tt:0 "К началу ресурсной войны баланс был от §Y-25%§! до §Y+25%§! включительно: закреплён прагматический курс"
 NAM_pragmatic_ending_tt:0 "Завершается борьба за печати. Государственный аппарат получает устройство выбранного финала."
 NAM_prag_settlement_agreements_tt:0 "Эфлор и Ажар получат предложение экономического договора: собственные правительство и армия, §Y15%§! гражданской промышленности и торговые привилегии Светлогорью, без передачи людей и военных заводов.\nУчастники обязаны поддержать общую сторону в южной войне.\nОтказ не начинает войну."
 NAM_prag_south_guarantees_tt:0 "Согласован приказ о выступлении против Шахрабада. Он будет исполнен после завершения общего предупреждения, когда обе стороны подготовятся к войне."
 NAM_administration_default_title:0 "Канцелярия Светлогорья"
 NAM_administration_prag_republic_title:0 "Республика договоров"
 NAM_administration_prag_directorate_title:0 "Деловой совет государства"
 ADISCORD_nam_debug_start_resource_war_tt:0 "Немедленно начинает ресурсную войну через обычную подготовку участников и фиксирует текущий BOP Светлогорья."
 ADISCORD_nam_debug_resolve_nam_victory_tt:0 "Победа Светлогорья: признание независимости, пограничные приобретения, наказание побеждённых и открытие послевоенного дерева. Сохранённый политический курс не меняется."
 ADISCORD_nam_debug_resolve_coalition_victory_tt:0 "Победа коалиции: материк разделён между Эфлором и Ажаром. При наличии подходящих островов Светлогорье уходит в изгнание; иначе остатки страны присоединяет Эфлор."
 ADISCORD_nam_debug_resolve_compromise_tt:0 "Мир по текущему контролю промыслов: захваченное отходит коалиции, Светлогорье сохраняет остальное, получает дерево поражения и начинает выплату топливной дани."
 ADISCORD_nam_debug_resolve_standoff:0 "§RDEBUG:§! Удержать независимость без приобретений"
 ADISCORD_nam_debug_resolve_standoff_desc:0 "Наступление соседей выдыхается, и обе стороны прекращают боевые действия."
 ADISCORD_nam_debug_resolve_standoff_tt:0 "Мир без пограничных приобретений и наказания коалиции. Светлогорье сохраняет независимость и получает послевоенное дерево своего зафиксированного курса."
 ADISCORD_nam_debug_prepare_etatism:0 "§RDEBUG:§! Предвоенный курс: этатизм"
 ADISCORD_nam_debug_prepare_etatism_desc:0 "Наместники собирают решающий перевес в управлении страной."
 ADISCORD_nam_debug_prepare_etatism_tt:0 "Устанавливает BOP Светлогорья на §Y-50%§!. При начале ресурсной войны будет зафиксирован этатистский курс."
 ADISCORD_nam_debug_prepare_pragmatism:0 "§RDEBUG:§! Предвоенный курс: прагматизм"
 ADISCORD_nam_debug_prepare_pragmatism_desc:0 "Округа и наместники договариваются об общем порядке работы."
 ADISCORD_nam_debug_prepare_pragmatism_tt:0 "Устанавливает BOP Светлогорья на §Y0%§!. При начале ресурсной войны будет зафиксирован прагматический курс."
 ADISCORD_nam_debug_prepare_humanism:0 "§RDEBUG:§! Предвоенный курс: гуманизм"
 ADISCORD_nam_debug_prepare_humanism_desc:0 "Окружные собрания получают решающий голос в делах страны."
 ADISCORD_nam_debug_prepare_humanism_tt:0 "Устанавливает BOP Светлогорья на §Y+50%§!. При начале ресурсной войны будет зафиксирован гуманистский курс."
 ADISCORD_nam_debug_start_ready_tt:0 "Распад метрополии уже начался; ресурсная война ещё не состоялась; Светлогорье, Эфлор и Ажар существуют, не воюют и контролируют необходимые стартовые районы."
 NAM_colonial_programme_ended_tt:0 "Администрация прекратила работу, Светлогорье перестало быть колонией или начался распад метрополии"
 NAM_civil_service_exam:0 "Экзамен на должность"
 NAM_civil_service_exam_desc:0 "Чиновник должен разбираться в своём деле, а не только помнить имя назначившего его наместника. Для канцелярий подготовят общий порядок отбора."
 NAM_appointed_prefects:0 "Личная ответственность"
 NAM_appointed_prefects_desc:0 "Ром поручит назначения людям, чьи подписи уже стоят под приказами военного времени. Каждый из них будет отвечать за работу своего округа перед столицей."
 NAM_building_code:0 "Единый строительный устав"
 NAM_building_code_desc:0 "Проектировщики перестанут согласовывать один и тот же чертёж в каждой управе. Общие нормы свяжут городские стройки с работой государственных бюро."
 NAM_distribution_board:0 "Управление снабжения заводов"
 NAM_distribution_board_desc:0 "В приёмной управления стоят ящики, адресаты которых давно разъехались. Кладовщик читает накладные начальнику службы. Из соседнего кабинета приносят ещё одну заявку на то же оборудование."
 NAM_works_commission:0 "Комиссия государственных работ"
 NAM_works_commission_desc:0 "Мастерские направили в комиссию своих диспетчеров. Вдоль стены висит карта с пометками прорабов, а на столе лежат наряды, прежде терявшиеся между ведомствами. Дежурный задерживается у телефона, пока с последней станции не подтвердят отправку."
 NAM_development_bank:0 "Банк государственного развития"
 NAM_development_bank_desc:0 "В приёмной будущего банка мастера держат на коленях свёрнутые чертежи. Казначей задаёт каждому вопросы о его предприятии. На столе накапливаются записки, не похожие на обычные военные сметы."
 NAM_basin_reservoirs:0 "Резервуары бассейна"
 NAM_basin_reservoirs_desc:0 "Промысловые диспетчеры обходят старый наливной двор Южной гавани. Инженер отмечает на плане уцелевшие фундаменты. Местный смотритель помнит, где проходила труба, исчезнувшая со всех ведомственных карт."
 NAM_engineering_collegium:0 "Коллегия инженеров"
 NAM_engineering_collegium_desc:0 "Практики из проектных бюро соберут разрозненные технические школы в общую коллегию. Спор о чертежах должен решаться испытаниями, а не чинами."
 NAM_district_inspectorate:0 "Выездная инспекция"
 NAM_pw_district_allotment:0 "Распорядиться окружным сбором"
 NAM_pw_district_allotment_desc:0 "На столе лежат две сметы. Столица ждёт денежного перевода, а местная канцелярия просит распорядиться сбором на месте. Подпись под второй сметой обязывает управу предъявить результат ревизорам."
 NAM_pw_district_allotment_unlock_tt:0 "После применения решения: округ расходует сбор по местной смете. Обычная ревизия по-прежнему перечисляет деньги в казну. Оба поручения занимают гражданскую комиссию."
 NAM_pw_district_allotment_site_tt:0 "Светлогорье владеет округом и контролирует его. Для дорожной сметы нужен участок под дорогу или ещё не выделенная площадка. Для наряда префекта нужны действующая дорога и свободный окружной автопарк."
 NAM_pw_district_allotment_queue_tt:0 "Гражданская комиссия свободна либо устав мирного строительства уже передал новые сметы в округа."
 NAM_pw_exam_allotment_tt:0 "Управление поднимет инфраструктуру на §G1§! уровень. На дороге высшего уровня оно один раз подготовит §G1§! площадку для общей постройки."
 NAM_pw_prefect_allotment_tt:0 "Армия получит §G80§! £motorized_equipment_texticon, при инфраструктуре §Y4§! или выше - §G120§!. На §Y180§! £time_texticon дн. местное снабжение снизится на §R0,5§!. Следующий наряд возможен после восстановления автопарка."
 NAM_pw_inspect_road_tt:0 "Инспекторы могут принять первую строительную площадку округа вместе с дорогой в рамках одной сметы."
 NAM_pw_inspect_fleet_tt:0 "Инспекция сократит срок восстановления местного снабжения и автопарка с §Y180§! до §G90§! £time_texticon дн. для следующих отгрузок."
 NAM_pw_local_allotment_tt:0 "Каждый округ самостоятельно ведёт одну новую смету. Столичная комиссия и другие округа могут работать одновременно. Уже подписанные поручения завершаются на прежних условиях."
 NAM_pw_district_fleet_called:0 "Окружные грузовики переданы армии"
 NAM_district_inspectorate_desc:0 "Ревизоры будут смотреть на построенные дома и работающие станки. Одних аккуратно переписанных отчётов для приёмки больше не хватит."
 NAM_reconstruction_statute:0 "Устав мирного строительства"
 NAM_reconstruction_statute_desc:0 "Порядок чрезвычайного управления уступит место постоянным правилам государственных работ. Столица и округа будут знать границы своих обязательств."
 NAM_merchant_charter:0 "Хартия перевозчиков"
 NAM_merchant_charter_desc:0 "Портовые поверенные встречаются с судовладельцами и начальниками автоколонн. Моряки говорят о рейсах, водители - о перевалах. Секретарь пытается свести их замечания в один проект хартии."
 NAM_foreign_patents:0 "Закупить патенты"
 NAM_foreign_patents_desc:0 "За границей давно решили часть задач, над которыми спорят наши мастерские. Торговые представители выкупят документацию вместе с правом её использовать."
 NAM_domestic_designs:0 "Свои конструкторские конторы"
 NAM_domestic_designs_desc:0 "Лучшие мастера смогут открыть конторы, которые живут продажей разработок. Государственный заказ поможет им пережить первые неудачные опыты."
 NAM_customs_clearinghouse:0 "Единая таможенная ведомость"
 NAM_customs_clearinghouse_desc:0 "Один груз не должен превращаться в несколько разных товаров по дороге от причала до покупателя. Конторы согласуют документы и порядок расчёта пошлин."
 NAM_freight_exchange:0 "Биржа грузовых рейсов"
 NAM_freight_exchange_desc:0 "Сведения о свободных трюмах и обратных грузах соберут в одной конторе. Перевозчики смогут планировать рейсы до того, как суда выйдут из гавани."
 NAM_repair_depots:0 "Ремонтные товарищества"
 NAM_repair_depots_desc:0 "Мелкие мастерские объединят склады запчастей и договорятся о взаимной помощи. Изношенный станок не должен останавливать целое предприятие."
 NAM_licensed_assembly:0 "Лицензионная сборка"
 NAM_licensed_assembly_desc:0 "В портовой мастерской распаковывают иностранные чертежи. На обороте одного сохранились заметки прежнего мастера. Переводчик пытается разобрать почерк, пока слесари рассматривают изображённый узел."
 NAM_port_polytechnic:0 "Портовый политехникум"
 NAM_port_polytechnic_desc:0 "Судовые механики, связисты и заводские мастера получат общие учебные мастерские. Программу составят по задачам, с которыми они сталкиваются каждый день."
 NAM_municipal_bonds:0 "Облигации городского хозяйства"
 NAM_municipal_bonds_desc:0 "В городской управе готовятся к встрече с подписчиками займа. На стенах развешаны сметы и планы улиц. Первый посетитель спрашивает о переулке, где всю зиму простояла вода."
 NAM_commercial_commonwealth:0 "Общее хозяйственное пространство"
 NAM_commercial_commonwealth_desc:0 "Порт, внутренние города и промыслы свяжет сеть взаимных обязательств. Республика станет арбитром этой системы, а не очередным участником спора."
 NAM_rural_grid:0 "Свет для малых поселений"
 NAM_rural_grid_desc:0 "Уездные электрики нанесут на карту посёлки, куда ещё не дошли линии от промыслов. Общины согласуют землю под опоры и очередность подключения."
 NAM_house_returnees:0 "Расселить семьи возвращенцев"
 NAM_house_returnees_desc:0 "Приёмная сверяет старые адреса с перечнем свободного жилья. Семьи сами называют округ, в котором хотят осесть, а управа договаривается с хозяевами о заселении."
 NAM_house_returnees_unlock_tt:0 "После применения решения: расселяет зарегистрированных возвращенцев в выбранных округах."
 NAM_returnee_balance_tt:0 "В реестре §Y[?NAM_returnee_register|0]§! человек. Для переезда нужны §Y2000§!."
 NAM_returnee_site_tt:0 "Округ принадлежит действующему независимому Светлогорью, находится под его контролем и свободен от местного строительного проекта."
 NAM_returnee_placement_tt:0 "Перевести §Y2000§! человек из реестра в население выбранного округа.\n$NAM_returnee_grant_rules_tt$\nПосле гражданской ревизии ранее заселённые округа также проверяются при завершении оплаченных городских программ."
 NAM_returnee_audit_tt:0 "При ревизии и после каждого оплаченного городского контракта его помощь получат также ранее заселённые округа: каждый один раз, под нашим контролем и после окончания местной стройки."
 NAM_returnee_citizenship_tt:0 "В реестр войдут ещё §G4000§! человек. Семьи смогут выбрать и присоединённые по договору пограничные округа, в том числе самоуправляющиеся."
 NAM_returnee_utilities_tt:0 "Жилищная программа проводит дороги к поселениям возвращенцев: §G+1§! £infrastructure_texticon к инфраструктуре округа, а при уровне §Y5§! его автопарк передаст стране §G30§! £motorized_texticon."
 NAM_returnee_services_tt:0 "Городские службы откроют в поселении возвращенцев гражданское предприятие на свободной площадке. Если площадок нет, мастерские передадут стране §G60§! £support_equipment_texticon."
 NAM_returnee_offices:0 "Бюро возвращения"
 NAM_returnee_offices_desc:0 "Семьи, разлучённые войной, должны найти дом и работу. Округа откроют общие списки пропавших, временного жилья и свободных рабочих мест."
 NAM_district_scholarships:0 "Окружные стипендии"
 NAM_district_scholarships_desc:0 "В окружном собрании читают письмо студента из столицы. Он пишет о занятиях и спрашивает, кто теперь работает в родной мастерской. Учитель просит сохранить письмо в школьном архиве."
 NAM_municipal_land:0 "Городской земельный фонд"
 NAM_pw_municipal_workshop:0 "Отвести землю под муниципальные мастерские в регионе [FROM.GetName]"
 NAM_pw_municipal_workshop_desc:0 "Строительная артель обходит пустующий городской двор. Из соседних домов вышли жители с вопросами о старой стене. Мастер кладёт план на подоконник и зовёт всех подойти ближе."
 NAM_pw_municipal_workshop_unlock_tt:0 "После применения решения: в выбранном округе появятся два участка под застройку. На первом артель построит гражданскую фабрику."
 NAM_municipal_workshop_result_tt:0 "За §Y49§! £time_texticon дн. три гражданские фабрики подготовят §G2§! ячейки строительства и возведут в одной из них гражданскую фабрику. Каждый муниципалитет отводит землю один раз."
 NAM_municipal_workshop_site_tt:0 "Мы владеем округом и контролируем его. В округе есть место ещё для двух зданий, меньше §Y20§! гражданских фабрик, и земля впервые передаётся артели."
 NAM_pw_tenant_petition:0 "Внести наказ жильцов региона [FROM.GetName] на съезд"
 NAM_pw_tenant_petition_desc:0 "Старшие по домам собрали подписи под планом подвоза хлеба и ремонта дорог. Районный делегат отнесёт план в бюджетную комиссию съезда."
 NAM_pw_tenant_petition_unlock_tt:0 "После применения решения: окружной съезд улучшит дороги в выбранном округе и оплатит его местное снабжение. Каждый созыв принимает один наказ."
 NAM_tenant_petition_open_tt:0 "Идёт оплаченный окружной съезд, и ни одна делегация ещё не внесла наказ."
 NAM_tenant_petition_result_tt:0 "При закрытии съезда округ получит §G+1§! £infrastructure_texticon к инфраструктуре (до §Y5§!) и на §Y90§! £time_texticon дн. §G+1§! к местному снабжению и §G+25%§! £infrastructure_texticon к скорости ремонта инфраструктуры. Требуются владение и контроль."
 NAM_tenant_congress_agenda_tt:0 "Пока съезд заседает, укажите на карте округ, от которого делегаты внесут наказ."
 NAM_tenant_petition_recipient_tt:0 "На рассмотрении наказ региона [NAM_tenant_petition_site.GetName]. Делегаты получат средства, если округ останется в наших руках."
 NAM_tenant_supply_depot:0 "Склад домовых советов"
 NAM_municipal_land_desc:0 "Пустующие участки перейдут под общие жилищные планы. Советы заранее определят, где появятся улицы, мастерские и новые дома."
 NAM_tenant_councils:0 "Советы жильцов"
 NAM_tenant_councils_desc:0 "Жильцы получат право участвовать в управлении домами и расходовании общих средств. Решения о ремонте будут приниматься там, где живут люди."
 NAM_water_boards:0 "Общинные водопроводы"
 NAM_water_boards_desc:0 "Соседние поселения объединят водозаборы и ремонтные бригады. Вода перестанет быть предметом спора между отдельными управами."
 NAM_public_credit:0 "Кредит для артелей"
 NAM_public_credit_desc:0 "Старшина артели кладёт перед окружным казначеем потёртую книгу заказов. Рядом товарищи раскладывают чертежи и расписки за инструменты. Они пришли со своим делом и хотят говорить с казной от имени всей мастерской."
 NAM_workers_inspection:0 "Рабочая инспекция"
 NAM_workers_inspection_tt:0 "Рабочая инспекция сразу объедет промыслы.\nЗатем она будет выезжать по итогам каждого оплаченного съезда округов.\n$NAM_workers_inspection_congress_tt$"
 NAM_workers_inspection_congress_tt:0 "Бригады доведут состояние каждого подконтрольного промысла Светлогорья до §G80§!, если оно упало ниже этого уровня. Выжженные участки и площадки с незавершённым проектом в обход не входят."
 NAM_regional_university_tt:0 "При открытии университет проведёт первый курс полевой медицины.\nКаждая следующая оплаченная подготовка в окружных училищах продолжит обучение.\n$NAM_regional_medical_course_tt$"
 NAM_regional_medical_course_tt:0 "За курс осваивается первая ещё не изученная технология по порядку:\n$ADISCORD_tech_field_workshop_tools$,\n$ADISCORD_tech_casualty_evacuation$,\n$ADISCORD_tech_battlefield_medical_drones$,\n$ADISCORD_tech_trauma_registry_networks$."
 NAM_workers_inspection_desc:0 "На съезде округов машинисты передают друг другу списки остановленных насосов. Одна и та же неисправность отмечена в нескольких посёлках. Делегаты зовут инженера и просят выслушать мастеров вместе."
 NAM_regional_university:0 "Университет округов"
 NAM_regional_university_desc:0 "Учебные советы объединят лаборатории и библиотеки разных городов. Первую кафедру окружные больницы организуют вместе с транспортными училищами. Врач и машинист будут вести одни и те же занятия: иногда судьбу раненого решает расписание санитарного поезда."
 NAM_common_citizenship:0 "Общее гражданство"
 NAM_common_citizenship_desc:0 "Хартия должна работать и вдали от столицы. Округа признают документы, решения судов и общественные обязанности друг друга."
 NAM_pw_development_works:0 "Заказать государственный завод"
 NAM_pw_development_works_desc:0 "Подрядчик представляет банковской комиссии план Южной гавани. Представитель города указывает на забытый подъезд к рабочим домам. Инженер разворачивает чистый лист для поправок."
 NAM_pw_development_works_ready_tt:0 "Светлогорье независимо и удерживает Южную гавань."
 NAM_pw_development_works_result_tt:0 "По завершении: при центральном плане заказ передаёт армии §G90§! £unit_mechanized_icon_small бронетранспортёров, при окружных трестах - §G25§! £train_texticon и §G180§! £motorized_texticon. Если в гавани есть место, открывается фабрика."
 NAM_pw_development_works_unlock_tt:0 "После применения решения: центральный план заказывает бронетранспортёры, окружные тресты - поезда и грузовики; свободная площадка гавани получает фабрику."
 NAM_pw_development_works_cost:0 "§Y50§! £political_power_texticon §Y900§! £ADISCORD_economy_treasury_texticon"
 NAM_pw_development_works_cost_tooltip:0 "§Y50§! £political_power_texticon §Y900§! £ADISCORD_economy_treasury_texticon"
 NAM_pw_development_works_cost_blocked:0 "§R50§! £political_power_texticon §R900§! £ADISCORD_economy_treasury_texticon"
 NAM_pw_development_works_refund_tt:0 "При отмене полностью возвращаются: §G50§! £political_power_texticon §G900§! £ADISCORD_economy_treasury_texticon."
 NAM_pw_merchant_order:0 "Заказать транспорт перевозчикам"
 NAM_pw_merchant_order_desc:0 "Перевозчики соберут заказ на грузовые суда и автомобили. Расчётная контора проверит поставки перед передачей государству."
 NAM_pw_merchant_order_ready_tt:0 "Светлогорье независимо и сохраняет победу в ресурсной войне."
 NAM_pw_merchant_order_result_tt:0 "По завершении: В запас Светлогорья поступят §G30§! £convoy_texticon и §G300§! £motorized_texticon."
 NAM_pw_merchant_order_unlock_tt:0 "После применения решения: позволяет заказывать конвои и грузовики для снабжения."
 NAM_pw_merchant_order_cost:0 "§Y35§! £political_power_texticon §Y650§! £ADISCORD_economy_treasury_texticon"
 NAM_pw_merchant_order_cost_tooltip:0 "§Y35§! £political_power_texticon §Y650§! £ADISCORD_economy_treasury_texticon"
 NAM_pw_merchant_order_cost_blocked:0 "§R35§! £political_power_texticon §R650§! £ADISCORD_economy_treasury_texticon"
 NAM_pw_merchant_order_refund_tt:0 "При отмене полностью возвращаются: §G35§! £political_power_texticon §G650§! £ADISCORD_economy_treasury_texticon."
 NAM_pw_rural_electrification:0 "Учредить энергокооператив Сухоречья"
 NAM_pw_rural_electrification_desc:0 "Окружные электрики проводят линию на карте между разбросанными посёлками. Старосты спорят о дороге для подвоза опор. У окна артельный мастер разбирает привезённый из гавани изолятор."
 NAM_pw_rural_electrification_ready_tt:0 "Сухоречье принадлежит Светлогорью и находится под его контролем; кооператив ещё не учреждён."
 NAM_pw_rural_electrification_result_tt:0 "По завершении: Сухоречье получит §G+1§! строительную ячейку.\nКаждая завершённая кооперативная стройка принесёт §G150§! £ADISCORD_economy_treasury_texticon, пока Сухоречье принадлежит Светлогорью и находится под его контролем."
 NAM_pw_rural_electrification_unlock_tt:0 "После применения решения: открывает участок Сухоречья; завершённая кооперативная стройка приносит казне доход, пока округ удерживается нами."
 NAM_pw_rural_electrification_cost:0 "§Y40§! £political_power_texticon §Y550§! £ADISCORD_economy_treasury_texticon"
 NAM_pw_rural_electrification_cost_tooltip:0 "§Y40§! £political_power_texticon §Y550§! £ADISCORD_economy_treasury_texticon"
 NAM_pw_rural_electrification_cost_blocked:0 "§R40§! £political_power_texticon §R550§! £ADISCORD_economy_treasury_texticon"
 NAM_pw_rural_electrification_refund_tt:0 "При отмене полностью возвращаются: §G40§! £political_power_texticon §G550§! £ADISCORD_economy_treasury_texticon."
 NAM_pw_development_works_cancel_tt:0 "Светлогорье утратило независимость, капитулировало или строительная площадка больше недоступна."
 NAM_pw_merchant_order_cancel_tt:0 "Светлогорье утратило независимость или капитулировало."
 NAM_pw_rural_electrification_cancel_tt:0 "Светлогорье утратило независимость, капитулировало или строительная площадка больше недоступна."
 NAM_war_rear_directorate:0 "Управление военного тыла"
 NAM_war_rear_directorate_desc:0 "Штаб сведёт заявки частей и сведения о грузах в одну ведомость. За дорогой от станции до передовой теперь будет отвечать определённый человек."
 NAM_war_depot_network_idea:0 "Прифронтовые склады"
 NAM_war_depot_network:0 "Сеть прифронтовых складов"
 NAM_war_depot_network_desc:0 "Небольшие склады разместят за узлами обороны. Подвоз будет идти короткими плечами, чтобы один сорванный рейс не оставлял полк без снабжения."
 NAM_war_mobile_workshops_idea:0 "Подвижные мастерские"
 NAM_war_mobile_workshops:0 "Ремонт вслед за фронтом"
 NAM_war_mobile_workshops_desc:0 "Механики отправятся вместе с колоннами. Поломанные машины будут возвращать в строй у дороги, не дожидаясь эвакуации в город."
 NAM_war_dispatch_service:0 "Единая диспетчерская"
 NAM_war_dispatch_service_desc:0 "Железнодорожники и водители согласуют время погрузки и смены маршрутов. Военным эшелонам выделят собственный порядок движения."
 NAM_war_civilian_routes:0 "Дороги для беженцев"
 NAM_war_civilian_routes_desc:0 "Гражданские колонны отделят от армейских перевозок. В тыловых поселениях откроют пункты размещения и регистрации прибывших."
 NAM_war_factory_shifts_idea:0 "Военные смены"
 NAM_war_factory_shifts:0 "Смены без остановки"
 NAM_war_factory_shifts_desc:0 "Заводские комитеты согласуют военные смены и подвоз рабочих. Часть мирных заказов придётся отложить до возвращения фронта к границам."
 NAM_war_naval_staff:0 "Штаб обороны побережья"
 NAM_war_naval_staff_desc:0 "Портовые службы и командиры кораблей обменяются картами и сигналами. Им предстоит защищать одни и те же подходы к берегу."
 NAM_war_convoy_escort_idea:0 "Военное сопровождение"
 NAM_war_convoy_escort:0 "Провести караваны"
 NAM_war_convoy_escort_desc:0 "Корабли охранения получат постоянные участки сопровождения. Торговые капитаны будут знать, где ждать встречу с конвоем."
 NAM_war_coastal_batteries:0 "Закрыть вход в гавань"
 NAM_war_coastal_batteries_desc:0 "Артиллеристы займут подготовленные позиции у Южной гавани. Наблюдательные посты свяжут с портом и гарнизоном."
 NAM_war_field_airfields:0 "Аэродромы военного времени"
 NAM_war_field_airfields_desc:0 "Наземные команды подготовят площадки и запасы для вылетов над бассейном. Диспетчеры получат прямую связь с армейским штабом."
 NAM_war_interceptor_control_idea:0 "Наведение перехватчиков"
 NAM_war_interceptor_control:0 "Наведение перехватчиков"
 NAM_war_interceptor_control_desc:0 "Наблюдатели будут передавать сведения о налётах прямо на аэродромы. Дежурные пары смогут встречать противника до выхода к промыслам."
 NAM_war_air_ground_liaison_idea:0 "Армейская авиационная связь"
 NAM_war_air_ground_liaison:0 "Связные при эскадрильях"
 NAM_war_air_ground_liaison_desc:0 "Армейские связные объяснят лётчикам, какие рубежи держатся и где готовится атака. Заявки на поддержку будут проходить через знакомых друг другу людей."
 NAM_war_joint_operations_idea:0 "Согласованные операции"
 NAM_war_transport_purchase:0 "Заказать транспорт для фронта"
 NAM_war_transport_purchase_desc:0 "Тыловое управление сведёт заявки на автомобили и тягу. Приёмщики проверят поставки перед отправкой на армейские склады."
 NAM_war_transport_purchase_ready_tt:0 "Светлогорье независимо и ведёт ресурсную войну."
 NAM_war_transport_purchase_result_tt:0 "По завершении: На склады Светлогорья поступят §G300§! £motorized_texticon и §G15§! £train_texticon."
 NAM_war_transport_purchase_unlock_tt:0 "После применения решения: открывает оплачиваемые заказы грузовиков и поездов для снабжения."
 NAM_war_transport_purchase_cost:0 "§Y35§! £political_power_texticon §Y650§! £ADISCORD_economy_treasury_texticon"
 NAM_war_transport_purchase_cost_tooltip:0 "§Y35§! £political_power_texticon §Y650§! £ADISCORD_economy_treasury_texticon"
 NAM_war_transport_purchase_cost_blocked:0 "§R35§! £political_power_texticon §R650§! £ADISCORD_economy_treasury_texticon"
 NAM_war_transport_purchase_refund_tt:0 "Полный возврат при отмене: §G35§! £political_power_texticon §G650§! £ADISCORD_economy_treasury_texticon."
 NAM_war_refugee_registration:0 "Разместить эвакуированных"
 NAM_war_refugee_registration_desc:0 "Пункты размещения проверят списки прибывших, помогут разыскать родных и направят желающих служить в запасные части."
 NAM_war_refugee_registration_ready_tt:0 "Светлогорье независимо и ведёт ресурсную войну."
 NAM_war_refugee_registration_result_tt:0 "По завершении: Светлогорье получает §G6000§! £manpower_texticon и §G+3%§! £stability_texticon."
 NAM_war_refugee_registration_unlock_tt:0 "После применения решения: открывает помощь эвакуированным с набором добровольцев и восстановлением стабильности."
 NAM_war_refugee_registration_cost:0 "§Y25§! £political_power_texticon §Y350§! £ADISCORD_economy_treasury_texticon"
 NAM_war_refugee_registration_cost_tooltip:0 "§Y25§! £political_power_texticon §Y350§! £ADISCORD_economy_treasury_texticon"
 NAM_war_refugee_registration_cost_blocked:0 "§R25§! £political_power_texticon §R350§! £ADISCORD_economy_treasury_texticon"
 NAM_war_refugee_registration_refund_tt:0 "Полный возврат при отмене: §G25§! £political_power_texticon §G350§! £ADISCORD_economy_treasury_texticon."
 NAM_war_procurement_ended_tt:0 "Ресурсная война завершена, Светлогорье капитулировало или утратило независимость."
 NAM_war_district_recruitment_tt:0 "Зафиксирован окружной или прагматический курс: добровольцев набирают через местные советы."
 NAM_war_martial_authority_tt:0 "Зафиксирован этатистский или прагматический курс: допустимы чрезвычайные полномочия наместников."
 NAM_border_administration:0 "Управление пограничными округами"
 NAM_border_administration_desc:0 "На новых границах нужны учреждения, способные выслушать жалобу, восстановить водопровод и объяснить жителям, кто отвечает за их улицу. Военная комендатура не может оставаться единственной властью."
 NAM_border_security:0 "Разоружение пограничья"
 NAM_border_security_desc:0 "Оружие осталось не только на складах разбитой армии. Коменданты предлагают начать с охраны дорог, учёта вооружённых отрядов и разоружения тех, кто не признаёт мир."
 NAM_border_compacts:0 "Соглашения с общинами"
 NAM_border_compacts_desc:0 "Старосты и городские советы готовы говорить о будущем, если за столом найдётся место для их представителей. Договорённости о местном управлении должны пережить смену гарнизона."
 NAM_border_citizenship:0 "Гражданство пограничных округов"
 NAM_border_citizenship_desc:0 "Граница на карте ещё не делает жителей гражданами. Постоянное устройство округов потребует доверия к судам, признанных документов и согласия жить по общим законам."
 NAM_pw_operable_tt:0 "Светлогорье независимо, не капитулировало и завершило ресурсную войну победой или перемирием"
 NAM_border_reconstruction:0 "Восстановить местные учреждения"
 NAM_border_reconstruction_desc:0 "В округ направляют учителей, врачей и ремонтные бригады. Местные учреждения возобновят работу с участием жителей, знающих нужды своих поселений."
 NAM_border_incorporation:0 "Включить округ в состав страны"
 NAM_border_incorporation_desc:0 "Советы заверяют реестры жителей, суды признают выданные документы, а временная администрация передаёт дела постоянным учреждениям."
 NAM_border_integration_site_tt:0 "Приобретённый пограничный округ принадлежит Светлогорью, контролируется им и ещё не является национальной территорией; Светлогорье независимо и не капитулировало"
 NAM_border_citizenship_ready_tt:0 "Приобретённый пограничный округ принадлежит Светлогорью и контролируется им; это ещё не национальная территория.\nПодчинение не ниже §Y80%§!, сопротивление не выше §Y20%§!; Светлогорье независимо и не капитулировало"
 NAM_border_reconstruction_unlock_tt:0 "После применения решения: в выбранном приобретённом округе снижает сопротивление и повышает подчинение."
 NAM_border_incorporation_unlock_tt:0 "После применения решения: делает приобретённый округ национальным после установления устойчивого контроля."
 NAM_border_reconstruction_result_tt:0 "По завершении: в выбранном округе: сопротивление §G-10§! п.п., подчинение §G+15§! п.п. Занимает общий слот региональных проектов. При потере участка или отмене возвращается вся цена."
 NAM_border_incorporation_result_tt:0 "По завершении: выбранный округ становится национальной территорией Светлогорья.\nПодчинение должно оставаться не ниже §Y80%§!, сопротивление - не выше §Y20%§!.\nЗанимает общий слот региональных проектов.\nПри нарушении условий или отмене возвращается вся цена."
 NAM_border_reconstruction_cost:0 "§Y35§! £political_power_texticon §Y400§! £ADISCORD_economy_treasury_texticon"
 NAM_border_reconstruction_cost_blocked:0 "§R35§! £political_power_texticon §R400§! £ADISCORD_economy_treasury_texticon"
 NAM_border_reconstruction_cost_tooltip:0 "§Y35§! £political_power_texticon §Y400§! £ADISCORD_economy_treasury_texticon"
 NAM_border_reconstruction_refund_tt:0 "§G+35§! £political_power_texticon, §G+400§! £ADISCORD_economy_treasury_texticon."
 NAM_border_incorporation_cost:0 "§Y75§! £political_power_texticon §Y500§! £ADISCORD_economy_treasury_texticon"
 NAM_border_incorporation_cost_blocked:0 "§R75§! £political_power_texticon §R500§! £ADISCORD_economy_treasury_texticon"
 NAM_border_incorporation_cost_tooltip:0 "§Y75§! £political_power_texticon §Y500§! £ADISCORD_economy_treasury_texticon"
 NAM_border_incorporation_refund_tt:0 "§G+75§! £political_power_texticon, §G+500§! £ADISCORD_economy_treasury_texticon."
 NAM_border_autonomy_agreement:0 "Заключить соглашение об автономии"
 NAM_border_autonomy_agreement_desc:0 "На окружном собрании читают проект договора со Светлогорском. Старосты перебивают секретаря вопросами о судах и местных обычаях. Правительственный представитель просит занести каждое возражение в протокол."
 NAM_border_autonomous_district:0 "Договорная автономия"
 NAM_border_autonomous_district_desc:0 "Полномочия общин и ограничения центральной власти закреплены соглашением о вхождении округа в Светлогорье.\n\nУсловия автономии постоянны, но эффект не действует при иностранном владельце."
 NAM_border_autonomy_agreement_unlock_tt:0 "После применения решения: Округ сразу становится национальным в обмен на постоянную автономию с сильными штрафами к промышленности, строительству, людским ресурсам и добыче."
 NAM_reparations_to_svetlogorye:0 "Репарации Светлогорью"
 NAM_reparations_to_svetlogorye_desc:0 "Мирный договор обязывает предприятия выделять мощности для восстановления Светлогорья. За исполнением обязательств наблюдает совместная промышленная комиссия.\n\nОбязательства прекращаются при исчезновении Светлогорья или новой войне с ним."
 ADISCORD_nam_groups.20.d:0 "Представители опор принесли в канцелярию проекты на ближайшее полугодие. Одни предлагают вложиться в хозяйство, другие требуют прежде укрепить управление и снабжение. За каждой папкой стоят люди, готовые отвечать за работу, если правительство поддержит её делом.\n\nСекретарь разложил предложения перед участниками совета. Подписанный проект станет публичным обязательством. Отложить решение ещё можно; объяснять сорванное обещание будет труднее."
 ADISCORD_nam_groups.22.t:0 "Доверие на исходе"
 ADISCORD_nam_groups.22.d:0 "Представители недовольной опоры вернулись в канцелярию. Для них положение дел уже стало свидетельством того, что правительство не способно договориться с теми, на ком держится страна. В конторах собирают подписи, задерживают согласования и обсуждают совместный ответ.\n\nПосредники пока готовы продолжать переговоры. Канцелярия может восстановить доверие конкретными решениями или согласовать оплачиваемое урегулирование. Если переговоры развалятся, спор выйдет за пределы кабинетов."
 ADISCORD_nam_groups.22.a:0 "Начать переговоры."
 NAM_agreement_none:0 "Нет действующего соглашения"
 NAM_agreement_deadline:0 "Соглашение: [NAMGetAgreementName]"
 NAM_agreement_deadline_desc:0 "Подписанный проект связывает правительство и тех, кто взялся за его исполнение. За ходом работ следят и сторонники, и противники соглашения."
 NAM_agreement_crisis:0 "Кризис доверия: [NAMGetAgreementName]"
 NAM_agreement_crisis_desc:0 "Посредники ещё принимают предложения. Представители недовольной опоры ждут решения, которое можно предъявить своим людям."
 NAM_agreement_goal_tt:0 "[NAMGetAgreementGoal]"
 NAM_agreement_success_tt:0 "\n§GПРИ ВЫПОЛНЕНИИ§!\nПоддержка выбранной опоры: §G+15§!.\nНовые предложения и кризисы приостанавливаются на §Y300§! £time_texticon дн."
 NAM_agreement_failure_tt:0 "Поддержка выбранной опоры: §R-20§!; тематический штраф на §Y180§! £time_texticon дн.\nПри поддержке ниже §Y25§! начнутся переговоры о кризисе на §Y90§! £time_texticon дн.\nНезавершённые ревизия, обучение и окружная стройка возвращают оплату; обычное бурение продолжается по своим условиям.\nЕсли поддержка не упала ниже §Y25§!, соглашение закрывается: новые предложения и кризисы возможны через §Y300§! £time_texticon дн."
 NAM_agreement_project_header_tt:0 "§YЗАДАЧА - СРОК 180 ДНЕЙ§!"
 NAM_agreement_common_terms_tt:0 "\n§RПРИ ПРОВАЛЕ§!\nПоддержка выбранной опоры: §R-20§!.\nЕсли поддержка ниже §Y25§! - кризис на §Y90§! £time_texticon."
 NAM_agreement_decline:0 "Не брать на себя новых обязательств."
 NAM_agreement_decline_tt:0 "Поддержка каждой из двух предложивших проект опор: §R-5§!. Новые предложения и кризисы приостанавливаются на §Y300§! £time_texticon дн."
 NAM_agreement_cancel_tt:0 "При войне или утрате самостоятельности соглашение закрывается без штрафа.\nНезавершённые ревизия, обучение и окружная стройка возвращают оплату.\nУже полученные постройки и поставки сохраняются; обычные промысловые работы продолжаются по своим условиям.\nНовые предложения и кризисы возможны через §Y300§! £time_texticon дн."
 NAM_agreement_refund_tt:0 "Незавершённая оплаченная работа возвращает всю внесённую оплату и освобождает занятое место подготовки."
 NAM_agreement_crisis_tt:0 "Текущая опора: [NAMGetAgreementPillar].\nЕё поддержка: [NAMGetAgreementSupport].\n\nЗа §Y90§! £time_texticon дн. восстановите поддержку до §Y40§! либо оплатите урегулирование в программах Светлогорья.\n\n§RПри провале:§! §R-10%§! £stability_texticon и §R-50§! £political_power_texticon.\nПри поддержке ниже §Y25§! неуслышанный соперник может начать борьбу за власть, если государственный строй ещё не закреплён."
 NAM_agreement_recovered_tt:0 "Поддержка выбранной опоры не ниже §Y40§!; сейчас [NAMGetAgreementSupport]"
 NAM_agreement_crisis_closed_tt:0 "Кризис закрывается. Уже действующий временный штраф сохраняет свой срок. Новые предложения и кризисы возможны через §Y300§! £time_texticon дн."
 NAM_agreement_escalation_tt:0 "§R-10%§! £stability_texticon; §R-50§! £political_power_texticon. Если поддержка осталась ниже §Y25§!, неуслышанный соперник может начать борьбу за власть до закрепления государственного строя.\nСоглашение закрывается. Новые предложения и кризисы возможны через §Y300§! £time_texticon дн."
 NAM_agreement_audit:0 "Провести ревизию окружных счетов"
 NAM_agreement_audit_desc:0 "Ревизоры сопоставят окружные ведомости, проверят двойные записи и передадут исправленные книги постоянной счётной службе."
 NAM_agreement_audit_ready_tt:0 "Действует административное соглашение; ревизия ещё не завершена, гражданское место подготовки свободно и хватает средств"
 NAM_agreement_audit_result_tt:0 "По завершении: §G+5%§! £stability_texticon и завершённая ревизия.\nДля исполнения соглашения после ревизии нужно сохранить не меньше §Y300§! £ADISCORD_economy_treasury_texticon.\nНа время работы занято гражданское место подготовки."
 NAM_agreement_training:0 "Развернуть подготовку армейского резерва"
 NAM_agreement_training_desc:0 "Военные училища выделят инструкторов, а окружные управы подготовят списки резервистов. Учебные команды пройдут сборы под наблюдением гарнизонных офицеров."
 NAM_agreement_training_ready_tt:0 "Действует соглашение с гарнизонами; подготовка ещё не завершена, гражданское место подготовки свободно и хватает средств"
 NAM_agreement_training_result_tt:0 "По завершении: §G+5000§! £manpower_texticon и §G+35§! £army_experience.\nДля исполнения соглашения также нужен складской резерв: §Y1000§! £infantry_equipment_texticon, §Y100§! £support_equipment_texticon, §Y200§! £motorized_equipment_texticon.\nРезерв остаётся у армии.\nНа время работы занято гражданское место подготовки."
 NAM_agreement_district_project:0 "Построить окружные мастерские и дороги"
 NAM_agreement_district_project_desc:0 "Окружной совет выехал на площадку будущих мастерских. Подрядчик спорит с дорожным мастером о подъезде. Местные жители показывают тропу, которой пользуются каждую весну."
 NAM_agreement_district_site_tt:0 "Регион принадлежит нам и находится под контролем; можно разместить фабрику и повысить инфраструктуру"
 NAM_agreement_district_result_tt:0 "По завершении: в выбранном регионе: §G+1§! £civ_factory, §G+1§! строительный участок и §G+1§! £infrastructure_texticon.\nЗавершение засчитывается в соглашение с округами.\nРаботы занимают существующее место промысловых проектов."
 NAM_agreement_export:0 "Отгрузить крупную партию по соглашению"
 NAM_agreement_export_desc:0 "Торговые дома собрали заказы внешних покупателей. Портовые службы оформят накладные и передадут груз зафрахтованным судам."
 NAM_agreement_export_result_tt:0 "Выручка: §G+300§! £ADISCORD_economy_treasury_texticon. Засчитывается одна из трёх необходимых отгрузок. Повтор доступен через §Y30§! £time_texticon дн."
 NAM_agreement_settlement:0 "Оплатить урегулирование спора"
 NAM_agreement_settlement_desc:0 "Посредники согласуют возмещение и порядок дальнейшей работы. Подписанное соглашение позволит вернуть спорящие стороны к исполнению своих обязанностей."
 NAM_agreement_settlement_tt:0 "Поддержка недовольной опоры устанавливается на §Y40§!. Кризис закрывается.\nУже действующий временный штраф сохраняет свой срок. Новые предложения и кризисы возможны через §Y300§! £time_texticon дн."
 NAM_agreement_nam_name:0 "Счётная служба"
 NAM_agreement_choose_nam:0 "Счётная служба."
 NAM_agreement_nam_terms_tt:0 "Опора: §Y$NAM_agreement_nam_pillar$§!.\nЗавершить ревизию и сохранить резерв.\nРевизия: §Y90§! £time_texticon; §Y75§! £political_power_texticon + §Y600§! £ADISCORD_economy_treasury_texticon.\nРезультат: §G+5%§! £stability_texticon.\nРезерв после ревизии: §Y300§! £ADISCORD_economy_treasury_texticon - не списывается."
 NAM_agreement_nam_goal:0 "Завершена ревизия; в казне не меньше §Y300§! £ADISCORD_economy_treasury_texticon."
 NAM_agreement_nam_support:0 "[?NAM_grp_nam_support|0] / 100"
 NAM_agreement_nam_reward:0 "Счётная служба"
 NAM_agreement_nam_failure:0 "Сорванное соглашение: Счётная служба"
 NAM_agreement_oil_name:0 "Новые скважины"
 NAM_agreement_choose_oil:0 "Новые скважины."
 NAM_agreement_oil_terms_tt:0 "Опора: §Y$NAM_agreement_oil_pillar$§!.\nЗавершить §Y2§! операции глубокого бурения; §Y1§!, если осталось место только для одной.\nКаждая: §Y42§! £time_texticon; §Y30§! £political_power_texticon + §Y200§! £ADISCORD_economy_treasury_texticon.\nРезультат каждой: §G+2§! мощности до предела промысла.\nДоступ: через карту, сразу после подписания."
 NAM_agreement_oil_goal:0 "Завершено новых операций бурения: §Y[?NAM_agreement_progress|0] / [?NAM_agreement_target|0]§!."
 NAM_agreement_oil_support:0 "[?NAM_grp_oil_support|0] / 100"
 NAM_agreement_oil_reward:0 "Новые скважины"
 NAM_agreement_oil_failure:0 "Сорванное соглашение: Новые скважины"
 NAM_agreement_dist_name:0 "Работа для округов"
 NAM_agreement_choose_dist:0 "Работа для округов."
 NAM_agreement_dist_terms_tt:0 "Опора: §Y$NAM_agreement_dist_pillar$§!.\nПостроить окружные мастерские в §Y1§! регионе.\nСтройка: §Y63§! £time_texticon; §Y50§! £political_power_texticon + §Y900§! £ADISCORD_economy_treasury_texticon.\nРезультат: §G+1§! £civ_factory, §G+1§! строительный участок, §G+1§! £infrastructure_texticon.\nДоступ: карта и программы Светлогорья."
 NAM_agreement_dist_goal:0 "Завершено окружных строек: §Y[?NAM_agreement_progress|0] / 1§!."
 NAM_agreement_dist_support:0 "[?NAM_grp_dist_support|0] / 100"
 NAM_agreement_dist_reward:0 "Работа для округов"
 NAM_agreement_dist_failure:0 "Сорванное соглашение: Работа для округов"
 NAM_agreement_garr_name:0 "Армейский резерв"
 NAM_agreement_choose_garr:0 "Армейский резерв."
 NAM_agreement_garr_terms_tt:0 "Опора: §Y$NAM_agreement_garr_pillar$§!.\nЗавершить подготовку резерва.\nПодготовка: §Y90§! £time_texticon; §Y75§! £political_power_texticon + §Y800§! £ADISCORD_economy_treasury_texticon.\nРезультат: §G+5000§! £manpower_texticon + §G35§! £army_experience.\nСохранить на складах: §Y1000§! £infantry_equipment_texticon, §Y100§! £support_equipment_texticon, §Y200§! £motorized_equipment_texticon.\nОборудование не списывается."
 NAM_agreement_garr_goal:0 "Завершена подготовка резерва; на складах не меньше §Y1000§! £infantry_equipment_texticon, §Y100§! £support_equipment_texticon и §Y200§! £motorized_equipment_texticon."
 NAM_agreement_garr_support:0 "[?NAM_grp_garr_support|0] / 100"
 NAM_agreement_garr_reward:0 "Армейский резерв"
 NAM_agreement_garr_failure:0 "Сорванное соглашение: Армейский резерв"
 NAM_agreement_trade_name:0 "Большие отгрузки"
 NAM_agreement_choose_trade:0 "Большие отгрузки."
 NAM_agreement_trade_terms_tt:0 "Опора: §Y$NAM_agreement_trade_pillar$§!.\nВыполнить §Y3§! крупные отгрузки через Южную гавань.\nКаждая: §Y20§! £political_power_texticon + §Y100000§! £fuel_texticon; выручка §G300§! £ADISCORD_economy_treasury_texticon.\nИнтервал: §Y30§! £time_texticon.\nВсего: §Y60§! £political_power_texticon + §Y300000§! £fuel_texticon; выручка §G900§! £ADISCORD_economy_treasury_texticon."
 NAM_agreement_trade_goal:0 "Выполнено крупных отгрузок: §Y[?NAM_agreement_progress|0] / 3§!."
