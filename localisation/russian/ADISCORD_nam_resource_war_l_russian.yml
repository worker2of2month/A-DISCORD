 NAM_captured_wells_warning_tt:0 "Захваченные врагом действующие скважины дают Светлогорью штраф пропорционально их доле в общей мощности бассейна: до §R-30%§! £war_support_texticon и §R-20%§! выпуска военных заводов. Повреждённые скважины учитываются по состоянию; выжженные не учитываются §Y180§! £time_texticon. Возврат промысла уменьшает штраф, конец ресурсной войны снимает его."
 NAM_captured_wells_report:0 "\n\n§YПРОМЫСЛЫ В РУКАХ ВРАГА§!\nЗахваченная действующая мощность: §Y[?NAM_captured_capacity|1] / [?NAM_basin_capacity|0]§!\nПоддержка войны: [?NAM_captured_war_support|=+1%] £war_support_texticon; выпуск военных заводов: [?NAM_captured_factory_output|=+1%].\nОсвобождение промыслов уменьшает штраф. Выжженные скважины не учитываются до окончания пожаров."
