 NAM_bw_ladder_tt:0 "§YЛЕСТНИЦА ПЕЧАТЕЙ§!\nСейчас: §Y[NAMBasinLadder]§!.\nОтрицательная сторона - вертикаль наместников; положительная - округа. Баланс появляется после объявления независимости.\n\n§YПОСЛЕДСТВИЯ§!\nВертикаль усиливает сборы и управление, но её господство снижает стабильность и исследования. Округа помогают строительству, науке и стабильности ценой политической власти и, при господстве, сборов. Равновесие даёт стабильность и политическую власть.\nТочные значения действующего диапазона показаны у шкалы баланса сил.[NAMGetBalanceCourseTooltip]"
