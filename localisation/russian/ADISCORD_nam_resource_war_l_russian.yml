 NAM_econ_deep_drilling:0 "Пробурить глубокие скважины"
 NAM_econ_deep_drilling_site_tt:0 "Мы владеем невыжженным промыслом и контролируем его. Есть место для новых скважин или доступна разведка артели."
 NAM_econ_deep_drilling_delivered_tt:0 "Мощность промысла: §G+2§!, до его местного предела. Каждая единица мощности даёт до §G10§! £resources_strip|1 нефти при полном восстановлении скважин."
 NAM_econ_deep_drilling_result_tt:0 "Через §Y42§! £time_texticon: Мощность промысла: §G+2§!, до его местного предела. Каждая единица мощности даёт до §G10§! £resources_strip|1 нефти при полном восстановлении скважин."
