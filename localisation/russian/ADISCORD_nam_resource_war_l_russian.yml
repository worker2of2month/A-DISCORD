 NAM_econ_combine_arsenal_delivered_tt:0 "[67.GetName]: §G+1§! £construction_speed_milfactory_texticon, §G+1§! строительный участок."
 NAM_econ_combine_arsenal_result_tt:0 "Через §Y35§! £time_texticon дн.: [67.GetName]: §G+1§! £construction_speed_milfactory_texticon, §G+1§! строительный участок."
 NAM_econ_combine_arsenal_refund_tt:0 "§G+350§! £ADISCORD_economy_treasury_texticon."
 NAM_econ_combine_arsenal_desc:0 "Цена: §Y40§! £political_power_texticon §Y350§! £ADISCORD_economy_treasury_texticon. Срок: §Y35§! £time_texticon дн. Повтор через §Y120§! £time_texticon дн. после завершения.\n\nОплаченный заказ создаёт военное производство на Северных месторождениях. Площадка и место проверяются до сдачи; утраченные цеха можно построить снова за полную цену.\n[67.GetName]: §G+1§! £construction_speed_milfactory_texticon, §G+1§! строительный участок.\n\nПри капитуляции, подчинении или потере условий заказа вся оплата возвращается. Война сама по себе не прерывает работу. Результат получает Светлогорье."
