 NAM_national_programmes_desc:0 "§YДОГОВОР СВЕТЛОГОРСКА§!\n[NAMGetCompactStatus].\n\n§YМЕСТНЫЕ ПРОГРАММЫ§!\nРемонт, развитие промыслов и оборонные рубежи выбираются на карте. Общегосударственные заказы и поставки - в решениях ниже.[NAMGetCapturedWellsReport][NAMGetPrewarMandateRecord]"
