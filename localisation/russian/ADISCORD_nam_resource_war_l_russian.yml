 NAM_econ_deep_drilling_desc:0 "Геологи сверяют разрезы пласта и готовят буровую площадку. Бригаде предстоит пройти глубже привычных горизонтов и установить обсадные трубы по новому проекту."
 NAM_econ_emergency_service_cost:0 "§Y30§! £political_power_texticon §Y250§! £ADISCORD_economy_treasury_texticon"
