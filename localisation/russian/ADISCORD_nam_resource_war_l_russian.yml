 NAM_econ_petrochemical_batch_refund_tt:0 "§G+200§! £ADISCORD_economy_treasury_texticon."
 NAM_econ_petrochemical_batch_desc:0 "Цена: §Y40§! £political_power_texticon §Y200§! £ADISCORD_economy_treasury_texticon §Y4000§! £fuel_texticon. Срок: §Y28§! £time_texticon дн. Повтор через §Y60§! £time_texticon дн. после завершения.\n\nТопливо и деньги остаются в производственном цикле страны: заводы выпускают транспорт и артиллерию. Сначала постройте НПЗ через программу переработки.\n§G+150§! £motorized_texticon, §G+60§! £artillery_texticon.\n\nПри капитуляции, подчинении или потере условий заказа вся оплата возвращается. Война сама по себе не прерывает работу. Результат получает Светлогорье."
