 NAM_defeat_early_tribute_tt:0 "Дань Эфлору и Ажару прекращается досрочно: ежемесячные поставки по §Y1500§! £fuel_texticon каждому больше не списываются.\nОсвобождаются §G2§! единицы нефтяной пропускной способности."
 NAM_defeat_road_south_tt:0 "§YЭфлор§! и §YАжар§! получают приглашение вступить в союз Светлогорья. Отказ не ведёт к войне."
 NAM_defeat_southern_charter_tt:0 "Фокус готовит объявление §Yвойны за Юг§! после окончания общего предупреждения. Каждое независимое государство пустынь выберет сторону. При победе Шахрабад и его союзники станут §Yсателлитами Светлогорья§!."
