 NAM_council_fuel_reserve_result_tt:0 "Через §Y28§! £time_texticon Светлогорье получит: §G+6000§! £fuel_texticon. Поддержка нефтяников: §G+12§! £NAM_support_oil_texticon. Подчинение или капитуляция отменяют заказ с полным возвратом цены."
