 NAM_mil_field_security_unlock_tt:0 "После применения решения: временно укрепляет оборону и защищает промыслы от происшествий ценой подвижности армии."
 NAM_mil_forward_supply_unlock_tt:0 "После применения решения: создаёт местный склад снабжения для ресурсного конфликта; он действует, пока округ остаётся нашим и удерживается нами."
 NAM_mil_mobile_surge_unlock_tt:0 "После применения решения: временно ускоряет армию и планирование ценой повышенного расхода топлива и снабжения."
 NAM_mil_recruit_depots_unlock_tt:0 "После применения решения: пополняет людской резерв."
 NAM_mil_reserve_arsenal_unlock_tt:0 "После применения решения: заказывает винтовки и снаряжение поддержки; оплаченная довоенная поставка дойдёт и после начала войны."
