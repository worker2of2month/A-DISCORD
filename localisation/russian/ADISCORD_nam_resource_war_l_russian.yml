 # ----- Exile revolution: radicals or humanists -----
 NAM_exile_politics: "Подготовка возвращения"
 NAM_exile_politics_desc: "Наместник свергнут в первую же ночь на островах, и курс изгнания выбран окончательно. Опоры Светлогорья и гуманисты Ярослава Вебера по-разному платят за возвращение, но высадка в Южной Гавани нужна обоим: здесь изгнанники готовятся к ней."
 NAM_exile_council_next_tt: "Сразу после высадки на островах соберётся совет: наместник будет свергнут, и власть возьмут §Yопоры Светлогорья§! или §Yгуманисты Вебера§!."
 ADISCORD_nam_resource_war.100.t: "Кто возьмёт печати"
 ADISCORD_nam_resource_war.100.d: "Не прошло и суток после прибытия на острова, как совет островного правительства собрался в бывшей таможне: в зале, где когда-то взвешивали руду, теперь висят карты потерянного материка. Наместник [ROOT.GetLeader] открыл заседание привычной речью о дисциплине печатей, но его уже никто не слушал. Люди, которые вывели армию из Южной гавани, хотят знать, кто поведёт её обратно.\n\nПервым поднялся Ростислав Карамышев, командир береговой охраны, последним ушедший с причалов. За ним стоят офицеры и старшины опор - гарнизонов, нефтяных артелей, портовых контор. Их требование короткое: власть тем, кто держит оружие, острова - военный лагерь, море - кормушка, а соседи, отнявшие промыслы, заплатят за всё. За ними стоят флотилии, готовые выйти в набег по первому приказу.\n\nНа другой стороне зала - люди Ярослава Вебера. Бывший вождь подполья, которого канцелярия годами называла бандитом, говорит о свободных островах, открытых для чужих денег, о договорах вместо грабежа и о юге, который можно не покорить, а объединить. Банкиры из чужих портов уже ждут в гостинице у причала.\n\nНаместник смотрит на зал и понимает, что его время кончилось. Остаётся решить, чьи руки возьмут печати."
 ADISCORD_nam_resource_war.100.a: "Власть - опорам Светлогорья."
 ADISCORD_nam_resource_war.100.b: "Власть - гуманистам Вебера."
 NAM_exile_radical_tt: "§YСМЕНА ВЛАСТИ§!\nНаместник свергнут. Власть берёт хунта опор во главе с §YРостиславом Карамышевым§! (этатизм).\nОткрываются пиратские флотилии, чёрный рынок и морская пехота за добычу.\n\nНациональный дух §YХунта опор§!: поддержка войны §G+10%§! £war_support_texticon, политическая власть §G+10%§! £political_power_texticon, организация армии §G+5%§!, стабильность §R-5%§! £stability_texticon.\nГотовность к возвращению: §G+5§!."
 NAM_exile_humanist_tt: "§YСМЕНА ВЛАСТИ§!\nНаместник свергнут. Власть берут гуманисты во главе с §YЯрославом Вебером§!.\nПиратские флотилии остаются в гавани; деньги на возвращение дадут иностранные корпорации: открывается категория \"Свободные зоны\".\nВся добыча изгнания продаётся инвесторам и становится иностранным капиталом.\n\nНациональный дух §YСвободные острова§!: стабильность §G+8%§! £stability_texticon, скорость исследований §G+3%§!, поддержка войны §R-5%§! £war_support_texticon.\nВлияние корпораций: §Y20§! / 100."
 NAM_Rostislav_Karamyshev: "Ростислав Карамышев"
 NAM_Rostislav_Karamyshev_desc: "Ростислав Карамышев командовал береговой охраной Южной гавани и последним уходил с причалов при эвакуации. На островах он собрал вокруг себя офицеров гарнизонов, старшин нефтяных артелей и капитанов флотилий. Он не обещает ни реформ, ни выборов - только возвращение."
 NAM_Mark_Olshansky: "Марк Ольшанский"
 NAM_Mark_Olshansky_desc: "Марк Ольшанский представлял на островах крупнейший консорциум инвесторов, а затем возглавил объединённый совет правлений. Он говорит языком балансов и дивидендов и уверен, что возвращение на материк - просто самая крупная сделка в истории Светлогорья."
 NAM_Yaroslav_Weber_leader_desc: "Ярослав Вебер прошёл путь от листовок в раздевалках промыслов до кабинета правительства в изгнании. Его гуманисты обещают свободные острова, договоры вместо грабежа и юг, объединённый в федерацию, а не покорённый силой."
