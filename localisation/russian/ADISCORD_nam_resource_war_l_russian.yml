 NAM_wartime_programmes_tt: "Идёт ресурсная война или война за Юг, в которой Светлогорье ведёт северный лагерь"
 NAM_startup_region:0 "§YЮЖНЫЙ РЕСУРСНЫЙ ПОЯС: ОКРУЖЕНИЕ СВЕТЛОГОРЬЯ§!\n\nОбстановка к началу 2160 года.\n\n§YВоркерланд: власть над автономией§!\nСветлогорье входит в систему зависимых территорий конфедерации. Наместники управляют нефтяным бассейном через отчёты, округа и гарнизоны, но распоряжения центра всё чаще расходятся с его возможностями. Слабость Воркерланда делает вопрос о принадлежности местных ресурсов всё острее.\n\n§YЭфлор: требование вернуть землю§!\nНационалистическое руководство республики ставит территориальное единство выше местной самостоятельности. Нефтяные земли, когда-то отнятые Воркерландом, остаются предметом претензий. Для Эфлора наместническая администрация воплощает порядок, который закрепил эту потерю.\n\n§YАжар: Директория Чёрного бассейна§!\nСамир Ажар объединил округа единым учётом людей, припасов и топлива. Директория содержит резервы и подчиняет снабжение государственному плану. Её территориальные притязания подкреплены готовностью к мобилизации, а борьба за нефтяной бассейн имеет и хозяйственное, и политическое значение.\n\n§YШахрабад и торговые пути Юга§!\nШахрабад сосредоточивает население, металлургию и промышленный капитал региона. Его печам нужны вода, сырьё и устойчивый вывоз продукции; Кейзан, Мазар и порты Вейра влияют на эти потоки. Нефтяное богатство Светлогорья существует внутри этой общей системы обмена, где местный спор способен затронуть весь Юг."
 NAM_startup_country: "§YСВЕТЛОГОРЬЕ В 2160 ГОДУ§!\n\n§YНефтяной бассейн и имперская власть§!\nСветлогорье сложилось внутри зависимой административной системы Воркерланда. Земли промыслов и прилегающую инфраструктуру включали в Светлогорье решениями воркерландской администрации. Население этих территорий несколько поколений жило под чужой властью; государственная граница закрепляла распоряжение центра, не устраняя памяти о прежней принадлежности земли.\n\nНефть сделала южный бассейн важным источником ресурсов. Вместе с промыслами в повседневную жизнь вошли планы отгрузок, гарнизонное снабжение и экспортные расчёты. Богатство находилось под землёй, а право распорядиться им проходило через учреждения, связанные с далёкой столицей.\n\n§YЛестница наместников§!\nИмперская администрация построила управление как цепь уполномоченных представителей. Каждая управа отчитывалась перед следующей, и каждая ступень имела печать и право остановить решение. Эта лестница собирала ресурсы и поддерживала дисциплину, но давала центру представление о стране прежде всего через отчёты.\n\nСо временем канцелярский порядок стал самостоятельной силой. Согласование определяло, кто получит деньги и доступ к запасам; ошибка грозила превратиться в государственную тайну. Сам аппарат умел учитывать чужие расходы лучше собственных. Двойные ведомости позволяли одному управлению выглядеть как несколько действующих учреждений.\n\n§YКогда распоряжения разошлись§!\nОслабление воркерландского центра не отменило прежнюю систему подчинения. В Светлогорье продолжали приходить предписания: отправить нефть, не трогать вагоны, исполнить новый приказ вместо предыдущего. На полках Егора Рома сохранились бумаги, которые уже невозможно было выполнить одновременно. Формальные полномочия всё хуже отражали наличие людей, складов и свободного транспорта.\n\nНаместники требовали дисциплины, округа оспаривали поборы, нефтяники ждали заработанного. Гарнизоны зависели от настоящего горючего, экспортные конторы - от состоявшихся отгрузок. Разные части одного хозяйства предъявляли власти несовместимые требования. Задержки жалованья и сборы питали недовольство Светлогорска, крупнейшего города страны.\n\nНа карте управа могла опираться на целый полк, а на дороге её представлял один пост. Топливо задерживалось между ведомственными отчётами; ремонтные мастерские умели больше, чем признавали их сметы. Порядок сохранял видимость полного учёта, хотя реальная работа всё чаще зависела от местных людей и обходных договорённостей.\n\n§YК началу 2160 года§!\nВсе линии наместнической власти сходятся к Егору Рому, а Кирилл Мезенцев сводит её обязательства в платёжных ведомостях. Светлогорье остаётся зависимой территорией Воркерланда с крупнейшими нефтяными полями Юга. Унаследованный аппарат продолжает действовать, хотя доверие к его печатям ослабло. Накопленное нефтяное богатство соседствует с невыплаченным жалованьем и спором о том, кому оно принадлежит."
 NAM_startup_guide_groups_title:0 "Опоры, власть и подполье"
 NAM_startup_guide_groups:0 "§YКТО ДЕРЖИТ СВЕТЛОГОРЬЕ§!\n\n§YПять опор§!\nВ разделе «$NAM_supports$» следите за наместниками, нефтяниками, округами, гарнизонами и экспортными конторами. Поддержка показывает отношение к власти, вес - влияние группы. Уступки одной опоре могут задеть другую. Фокусы и оплачиваемые решения меняют учреждения и отношения с группами; одного высокого показателя недостаточно для устойчивой власти.\n\n§YЛестница печатей§!\nПосле независимости появляется баланс между вертикалью и округами. Вертикаль усиливает сборы и управление, но её господство обходится стабильностью и исследованиями. Округа помогают строительству, науке и общественному согласию, уступая в политической власти и сборах. Фокусы, покровительство группам и политические события сдвигают баланс.\n\n§YСоперники Рома§!\nПредставители опор предъявляют требования и ждут исполнения обещаний. Проверяйте срок и цену принятого обязательства. Отказ или срыв обещания при слабой поддержке может привести к борьбе за печати и смене руководителя. Деньги на происшествия и политические уступки нужны наряду с военным бюджетом.\n\n§YПодполье Ярослава Вебера§!\nОно действует с начала кампании: недовольство округов и усиление вертикали помогают ему расти. Возможны пожары, налёты на склады и покушения. В колониальный период доступны облавы; позже вертикаль ищет тайники, а округа могут пройти переговоры до амнистии и получить Вебера в командование.\n\n§YКак избежать восстания§!\nЗавершённая амнистия предотвращает выступление. Другой путь - открыть гарантии Светлогорску и оплатить договор: к началу войны он должен проработать 60 непрерывных дней при вашем владении и контроле города. Без этих гарантий подполье от 60 вызывает восстание, от 30 до 59 даёт половинную вероятность; ниже 30 выступления не будет. Подготовьте город до начала войны."
 NAM_startup_guide_oil_title:0 "Бассейн, контракты и острова"
 NAM_startup_guide_oil:0 "§YНЕФТЬ ДОЛЖНА ДОЙТИ ДО ПОКУПАТЕЛЯ§!\n\n§YПока существует метрополия§!\nВ разделе «$NAM_colony$» доступны поставки Воркерланду и торговые концессии. Они дают доход и меняют отношения с опорами. После распада центра колониальные программы закрываются: не стройте постоянные расходы только на их выручке.\n\n§YКарта нефтяного бассейна§!\nПосле «$NAM_inventory$» откройте «$NAM_national_programmes$». Карта показывает состояние промыслов, пропускную способность, занятые мощности и проекты. Нефть на карте, топливо на складе и свободная мощность для контракта - разные показатели. Потеря или повреждение узла сокращает возможности поставок.\n\n§YРемонт и развитие§!\nРемонт скважин, промысловые заводы, Ключевский нефтепровод и морской терминал требуют открывающих фокусов, оплаты и времени. Проверяйте свободное место для проекта и владение нужными округами. Нефтепроводу нужны Сухоречье и Южная гавань; морской терминал обслуживает дальних покупателей. Потеря стройплощадки прерывает работу и возвращает задаток.\n\n§YТопливные контракты§!\nПокупатель должен согласиться на предложение. Действующий контракт занимает мощность и ежемесячно обменивает §Y1500§! £fuel_texticon со склада на §G40§! £ADISCORD_economy_treasury_texticon. Если топлива не хватает, поставка и оплата пропускаются. Война с покупателем обрывает контракт. Договоры с Эфлором и Ажаром замедляют рост давления реституции, эмбарго ускоряет его.\n\n§YЗаморские округа§!\nОстрова дают сталь, конвойную службу и возможности концессий. Договорённости с Кефрейтом требуют согласия другой стороны. Развивайте гавани и защищайте архипелаг: при потере материка он может стать местом продолжения кампании. Подробности находятся в «Путях».\nЭкспортная диспетчерская даёт ещё §G+30§! £ADISCORD_economy_treasury_texticon за каждую выполненную месячную поставку на время её работы."
 NAM_startup_guide_war_title:0 "Давление и ресурсная война"
 NAM_startup_guide_war:0 "§YПОДГОТОВКА И ФРОНТ§!\n\n§YДва срока угрозы§!\nПосле распада Воркерланда растёт давление реституции: при 40 приходят ноты, при 70 - ультиматум. Давление 100 открывает нападение не раньше 300-го дня после распада. Даже низкое давление не отменяет отдельный срок нападения через 420-480 дней. Отсрочки и обстановка могут сдвинуть его; отказ от вводных фокусов не останавливает кризис.\n\n§YОтвет на ультиматум§!\nКлючевский протокол уступает Восточное Сухоречье и вводит годовые топливные поставки, откладывая угрозу на год. Покупка времени у Ажара даёт 75 дней, но не выводит его из коалиции. Можно отвергнуть требования или ударить первым: упреждающая война начинается быстро, с ослабленным оборонительным бонусом.\n\n§YМобилизация до выстрелов§!\nВ разделе «$NAM_mobilisation$» оплачивайте формирования и готовьте рубежи. Заказ резервирует ресурсы сейчас, соединение выходит при начале войны. До войны его можно распустить с возвратом казны, топлива и людей, но без возврата политической власти. Проверяйте предел заказов, сроки работ и запас на пополнение. Готовность Светлогорска описана в разделе об опорах.\n\n§YВойна может закончиться раньше§!\nКапитуляции и решающее положение фронта запускают мир до общего срока. Светлогорью нужны свои промыслы и все пограничные пояса противников. Коалиции достаточно Северных месторождений и ещё одного промысла. Территориальный результат перепроверяется через 7 дней: не рассчитывайте ждать до конца таймера после потери ключевых районов.\n\n§YЕсли война дошла до 420-го дня§!\nСчитается текущий контроль: Северные месторождения - 80 очков, Южнобережье - 36, Сухоречье - 24, Восточное Сухоречье и Светлогорский округ - по 12. От 100 очков с занятым пограничным округом противника дают победный договор; без него - ничью на прежней границе. 36-99 очков дают компромисс, меньше 36 - поражение.\n\n§YДисциплина печатей§!\nПотери людей и промыслов ослабляют организацию армии через дисциплину. Следите за миссиями удержания, снабжением и военными программами. Исход войны определит следующее дерево фокусов."
 NAM_startup_guide_plan_title:0 "Первые шаги"
 NAM_startup_guide:0 "§YПЕРВЫЕ ШАГИ ЗА СВЕТЛОГОРЬЕ§!\n\n§Y1. Проведите опись.§! Начните с «$NAM_inventory$». Сверьте казну, недельный баланс, топливо и гарнизоны. Пока Воркерланд существует, используйте колониальную торговлю и следите за подпольем.\n\n§Y2. Осмотрите опоры и бассейн.§! В «$NAM_supports$» сравните поддержку и влияние пяти групп. В «$NAM_national_programmes$» проверьте состояние промыслов, свободные мощности, текущие проекты и контракты.\n\n§Y3. Выберите способ управления.§! Вертикаль и округа открывают разные средства подготовки. Для округов заранее заложите время на переговоры с Вебером либо на оплату и 60 дней работы договора Светлогорска. Вертикали нужны борьба с тайниками и готовность к внутреннему фронту.\n\n§Y4. Планируйте деньги после независимости.§! Колониальный доход исчезнет вместе с центром. Ремонтируйте промыслы, договаривайтесь о поставках и сохраняйте запас топлива для армии. Обещанное предложение ещё не является действующим контрактом.\n\n§Y5. Подготовьте войска до нападения.§! Следите за давлением и отдельным сроком кризиса. Оплачивайте мобилизационные заказы, готовьте рубежи и завершайте проекты вовремя. Ультиматум позволяет купить время ценой реальных уступок.\n\n§Y6. Защищайте решающие районы.§! Потеря Северных месторождений вместе с ещё одним промыслом может завершить войну досрочно. Держите резерв и контролируйте дисциплину. Победа или ничья открывает послевоенное дерево, компромисс или островное изгнание - дерево поражения. Продолжения описаны в «Путях»."
 NAM_startup_path_0_title: "Власть наместников"
 NAM_startup_path_0:0 "§YВЛАСТЬ НАМЕСТНИКОВ§!\n\nЕгор Ром собирает власть вокруг единой подписи, инспекторов и чрезвычайных предписаний. Вертикаль помогает управлять сборами и гарнизонами, но усиливает конфликт с округами и подпольем. Порядок требует поддержки тех, кто исполняет приказы.\n\nПосле ресурсной войны государство службы развивает учёт полномочий, гарнизоны и нефтяные квоты. Предстоит решить, закрепить ли жёсткую лестницу или придать ей республиканское устройство. На Юге этот курс ведёт к подчинению соседей и войне за власть над Шахрабадом.\n\nОткройте спойлеры, чтобы узнать условия входа, руководителей и последствия."
 NAM_startup_path_0_details:0 "§YВЕРТИКАЛЬ: КУРС И ФИНАЛЫ§!\n\n§YДоступ после войны§!\nПобеда и ничья открывают послевоенное дерево. После «$NAM_recognition$» доступно «$NAM_service_state$», если до войны не выбраны «$NAM_districts$». Оно исключает хартию округов.\n\n§YУстройство государства§!\nУчёт полномочий, гарнизоны наместников и нефтяные квоты ведут к «$NAM_ladder_of_seals$». Параллельно восстанавливайте хозяйство и выбирайте нормализацию отношений с бывшими противниками либо пограничный реванш.\n\n§YДва финала§!\n«$NAM_ladder_ending_iron$» утверждает Железную лестницу и этатистский курс Рома. «$NAM_ladder_ending_service$» создаёт Служебную республику Рома. Финалы взаимоисключающие, меняют название страны, национальный дух и баланс власти. Если переворот уже удался, его победитель сохраняет руководство.\n\n§YВойна за Юг§!\nЧёрный бассейн и пустынные наместничества готовят подчинение региона. «$NAM_south_seal_over_furnaces$» открывается после нужных фокусов при созревшем кризисе Юга и мире. Победа превращает Шахрабад и его союзников в наместничества. Военные программы, топливное снабжение и борьба за конвои продолжают иметь значение."
 NAM_startup_path_1_title: "Окружное самоуправление"
 NAM_startup_path_1:0 "§YСАМОУПРАВЛЕНИЕ ОКРУГОВ§!\n\nОкруга требуют открытых ведомостей и гарантий вместо единственной подписи. Их курс помогает науке, строительству и устойчивости общества, но ограничивает возможности канцелярии. Договор со Светлогорском и переговоры с Вебером позволяют искать политический выход из внутреннего конфликта.\n\nПосле ресурсной войны хартия объединяет совет округов, нефтяной фонд и ополчение. Общий топливный рынок может стать основой федерации или власти нефтяников. На Юге этот путь строится вокруг договоров, поставок и общего фронта против Шахрабада.\n\nОткройте спойлеры, чтобы узнать условия входа, руководителей и последствия."
 NAM_startup_path_1_details:0 "§YОКРУГА: ХАРТИЯ И ФИНАЛЫ§!\n\n§YДоступ после войны§!\nПобеда и ничья открывают послевоенное дерево. После «$NAM_recognition$» доступна «$NAM_federal_charter$», если до войны не выбрана «$NAM_vertical$». Она исключает государство службы. Гарантии Светлогорску полезны для предотвращения восстания, но не являются отдельным условием послевоенного входа.\n\n§YДо войны§!\nДоговор города нужно оплатить и выдержать 60 непрерывных дней до начала боёв. Переговоры с Ярославом Вебером состоят из нескольких этапов: только завершённая амнистия закрывает восстание и вводит его в командование. Начатые переговоры сами по себе не защищают город.\n\n§YДва финала§!\nСовет округов, нефтяной фонд и ополчение ведут к общему топливному рынку. Федерация передаёт руководство Надежде Ладыгиной и утверждает гуманистический курс; Нефтяной союз возглавляет Кирилл Мезенцев. Каждый финал даёт собственное название страны и национальный дух, меняет влияние опор и баланс власти. После успешного переворота его победитель остаётся во главе страны.\n\n§YВойна за Юг§!\n«Нефть за воду» предлагает союз соседям, а «Хартия против картеля» ведёт к войне с Шахрабадом после подготовки и созревания кризиса. Союз требует ответа партнёра. Дальнейшие программы позволяют поддерживать союзников топливом или бороться с морскими перевозками противника."
 NAM_startup_path_2_title:0 "Поражение и возвращение"
 NAM_startup_path_2:0 "§YКАМПАНИЯ ПОСЛЕ ПОРАЖЕНИЯ§!\n\nНеудача в ресурсной войне не всегда заканчивает историю Светлогорья. Компромисс оставляет страну на части материка, а сохранившиеся острова могут принять правительство, потерявшее весь нефтяной бассейн. У каждого исхода своё продолжение в дереве поражения.\n\nНа материке предстоит выбирать между возвращением утраченного и соглашением с победителями. В изгнании придётся заново строить хозяйство и армию: развивать островные порты, работать с беженцами, поддерживать связи с материком и готовить возвращение с моря.\n\nОткройте спойлеры, чтобы узнать условия выживания, устройство морских рейдов и путь возвращения."
 NAM_startup_path_2_details:0 "§YПОРАЖЕНИЕ: КОМПРОМИСС И ОСТРОВА§!\n\n§YКомпромиссный мир§!\nПри 36-99 очках на итоговой проверке Светлогорье сохраняет контролируемые промыслы и острова, уступает занятые противником земли и платит годовую топливную дань. Дерево поражения предлагает восстановление и реванш либо соглашение с коалицией. Примирение позволяет раньше прекратить дань, развивать нефтяное сотрудничество и выйти к борьбе за Юг.\n\n§YОстровное изгнание§!\nПолная победа коалиции отнимает материк. Если у Светлогорья сохранился заморский округ, столица переносится туда; без островов страна аннексируется. Эвакуация спасает лишь часть армии, значительная доля запасов теряется. Островная ветка строится вокруг правительства в изгнании, беженцев, портов, рейдерского флота и армии возвращения.\n\n§YРейды и добыча§!\nПосле «$NAM_exile_sea_raiders$» используйте карту морских путей в «$NAM_piracy$». Рейды требуют флота, свободной флотилии и топлива; успех не гарантирован. Добычу можно обратить в казну, оружие, конвои, учения и морскую пехоту. Дурная слава и настороженность владельцев путей повышают риск ответных блокад и карательных рейдов.\n\n§YВозвращение§!\nНа материке готовьте кадры и подполье; на островах нужны Совет возвращения и Армия возвращения. Проверьте требования готовности, мира, независимости и прекращения дани у «$NAM_defeat_war_of_return$». Изгнание начинает возвращение высадкой в Южной гавани; подготовленные морские части и готовность усиливают десант. Возвращение земель требует победы в новой войне."
 # Oil monopoly and the islands
 NAM_fuel_shortage: "Сорванные поставки Светлогорья"
 NAM_fuel_shortage_desc: "Контракт на светлогорское топливо оборвался вместе с началом войны. Цистерны не пришли, а замену им ещё предстоит найти."
 NAM_fuel_embargo_modifier: "Топливное эмбарго Светлогорья"
 NAM_fuel_embargo_modifier_desc: "Светлогорье закрыло для этой страны свои промыслы и терминалы. Эмбарго действует, пока его не снимет правительство Светлогорья."
 NAM_island_convoy_route: "Островная конвойная линия"
 NAM_island_convoy_route_desc: "Регулярные конвои вывозят руду заморских округов и привозят им припасы. Остров перестаёт чувствовать себя забытым."
 NAM_south_convoy_blockade: "Светлогорские охотники за конвоями"
 NAM_south_convoy_blockade_desc: "Корабли Светлогорья перехватывают танкеры и баржи, идущие к печам. Заводы получают меньше топлива и работают с перебоями."
 NAM_oil_unit_free_tt: "У Светлогорья есть свободная единица нефтяной пропускной способности для этого покупателя (на суше: §Y[?NAM_oil_free_land_units|0]§!, для заморских покупателей: §Y[?NAM_oil_free_units|0]§!)"
 NAM_oil_contract_offer: "Предложить топливный контракт"
 NAM_oil_contract_offer_desc: "§YЦЕНА§!: §Y50§! £political_power_texticon\n§YПОВТОР§!: через §Y30§! £time_texticon дн. после применения.\n\n§YРЕЗУЛЬТАТ§!\n§YПОСЛЕ СОГЛАСИЯ ПОКУПАТЕЛЯ§!\nЕжемесячно: покупателю §Y1500§! £fuel_texticon с наших складов, казне §G40§! £ADISCORD_economy_treasury_texticon.\nКонтракт занимает §Y1§! единицу пропускной способности.\n\n§YУСЛОВИЯ ПОСТАВОК§!\nМорской терминал Южной гавани обслуживает только Кефрейт, Стеландер, Стеланд и Землю Хана.\nПри запасе ниже §Y1500§! £fuel_texticon поставка и оплата за месяц пропускаются. Война с покупателем обрывает контракт.\nЭкспортная диспетчерская даёт ещё §G+30§! £ADISCORD_economy_treasury_texticon за каждую выполненную месячную поставку на время её работы."
 NAM_oil_contract_offer_tt: "Покупатель получает предложение и ответит в ближайшие дни. Свободная единица проверяется ещё раз в момент ответа.\nПри согласии:\n  Нефтяники: §G+5§! £NAM_support_oil_texticon\n  Экспортные конторы: §G+5§! £NAM_support_trade_texticon"
 NAM_oil_contract_end: "Расторгнуть топливный контракт"
 NAM_oil_contract_end_desc: "§YРЕЗУЛЬТАТ§!\nПоставки покупателю прекращаются. Освобождается §G1§! единица пропускной способности."
 NAM_oil_contract_end_tt: "Контракт расторгается, единица пропускной способности освобождается.\nОтношение покупателя к нам ухудшается.\nЭкспортные конторы: §R-3§! £NAM_support_trade_texticon."
 NAM_fuel_embargo: "Топливное эмбарго"
 NAM_fuel_embargo_desc: "§YЦЕНА§!: §Y25§! £political_power_texticon\n§YПОВТОР§!: через §Y30§! £time_texticon дн. после применения.\n\n§YРЕЗУЛЬТАТ§!\nПромыслы и терминалы закрываются для выбранной страны до снятия эмбарго.\nПротив Эфлора или Ажара: давление реституции §R+1§! £world_tension_texticon каждый месяц."
 NAM_fuel_embargo_valid_tt: "Страна не покупает наше топливо по контракту, не находится под эмбарго и не получает от нас дань или топливо по договору"
 NAM_fuel_embargo_tt: "Страна получает §Yтопливное эмбарго Светлогорья§! до его отмены.\nЕё отношение к нам: §R-25§!.\nЭкспортные конторы: §R-10§! £NAM_support_trade_texticon."
 NAM_fuel_embargo_lift: "Снять топливное эмбарго"
 NAM_fuel_embargo_lift_desc: "§YРЕЗУЛЬТАТ§!\nВновь открыть промыслы и терминалы для этой страны.\nПоддержка экспортных контор: §G+5§! £NAM_support_trade_texticon."
 NAM_fuel_embargo_lift_tt: "Эмбарго снимается вместе с ухудшением отношений, которое оно вызвало.\nЭкспортные конторы: §G+5§! £NAM_support_trade_texticon."
 NAM_project_slot_free_tt: "Есть свободное место для проекта: занято §Y[?NAM_projects_in_progress|0]§! из §Y[?NAM_project_slots|0]§! (не больше §Y2§!)"
 NAM_project_state_ready_tt: "Промысел принадлежит нам, контролируется нами, и на нём не идёт другой проект"
 NAM_project_not_scorched_tt: "Скважины промысла не выжжены в последние §Y180 дней§!"
 NAM_project_condition_low_tt: "Состояние промысла ниже §Y100§!"
 NAM_project_harbour_held_tt: "§YЮжная гавань§! принадлежит нам и контролируется нами"
 NAM_project_started_150_tt: "Казна: §R-150§! £ADISCORD_economy_treasury_texticon; задаток вернётся, если работы будут прерваны.\nЗанимается одно место для проекта."
 NAM_project_started_300_tt: "Казна: §R-300§! £ADISCORD_economy_treasury_texticon; задаток вернётся, если работы будут прерваны.\nЗанимается одно место для проекта."
 NAM_project_started_350_tt: "Казна: §R-350§! £ADISCORD_economy_treasury_texticon; задаток вернётся, если работы будут прерваны.\nЗанимается одно место для проекта."
 NAM_project_started_250_tt: "Казна: §R-250§! £ADISCORD_economy_treasury_texticon; задаток вернётся, если работы будут прерваны.\nЗанимается одно место для проекта."
 NAM_project_refund_tt: "Работы прерваны: задаток возвращается в казну, место для проекта освобождается."
 NAM_project_repair_wells: "Восстановить скважины"
 NAM_project_repair_wells_desc: "§YЦЕНА§!: §Y25§! £political_power_texticon §Y150§! £ADISCORD_economy_treasury_texticon\n§YВЫПОЛНЕНИЕ§!: §Y45§! £time_texticon дн.\n\n§YРЕЗУЛЬТАТ§!\nБригады меняют насосы, очищают стволы и восстанавливают подъездные пути.\nСостояние промысла: §Y[?FROM.NAM_field_condition|0] / 100§!; после ремонта §G+30§!, не выше §Y100§!. Пропускная способность пересчитывается по состоянию.\n\n§YПРИ СРЫВЕ§!\nПотеря необходимых округов прерывает работы: задаток казны возвращается, политическая власть - нет."
 NAM_project_repair_done_tt: "Если промысел по-прежнему наш, его состояние растёт на §G30§! (не выше §Y100§!), пропускная способность пересчитывается. Иначе задаток возвращается в казну."
 NAM_project_refinery: "Построить промысловый завод"
 NAM_project_refinery_desc: "§YЦЕНА§!: §Y40§! £political_power_texticon §Y300§! £ADISCORD_economy_treasury_texticon\n§YВЫПОЛНЕНИЕ§!: §Y90§! £time_texticon дн.\n\n§YРЕЗУЛЬТАТ§!\nВ округе появляются место для постройки и завод синтетического топлива.\nПропускная способность промысла: §G+1§!, пока округ под нашим контролем.\n\n§YПРИ СРЫВЕ§!\nПотеря необходимых округов прерывает работы: задаток казны возвращается, политическая власть - нет."
 NAM_project_refinery_done_tt: "Если промысел по-прежнему наш, в округе появляются место для постройки и §Yзавод синтетического топлива§!, а пропускная способность промысла растёт на §G1§!. Иначе задаток возвращается в казну."
 NAM_project_pipeline: "Проложить Ключевский нефтепровод"
 NAM_project_pipeline_desc: "§YЦЕНА§!: §Y35§! £political_power_texticon §Y350§! £ADISCORD_economy_treasury_texticon\n§YВЫПОЛНЕНИЕ§!: §Y120§! £time_texticon дн.\n\n§YРЕЗУЛЬТАТ§!\nНефтепровод соединяет Сухоречье с Южной гаванью.\nПропускная способность: §G+1§!, пока оба округа под нашим контролем.\n\n§YПРИ СРЫВЕ§!\nПотеря необходимых округов прерывает работы: задаток казны возвращается, политическая власть - нет."
 NAM_project_pipeline_done_tt: "Если Сухоречье и Южная гавань по-прежнему наши, пропускная способность растёт на §G1§!. Иначе задаток возвращается в казну."
 NAM_project_sea_terminal: "Построить морской терминал"
 NAM_project_sea_terminal_desc: "§YЦЕНА§!: §Y30§! £political_power_texticon §Y250§! £ADISCORD_economy_treasury_texticon\n§YВЫПОЛНЕНИЕ§!: §Y90§! £time_texticon дн.\n\n§YРЕЗУЛЬТАТ§!\nТерминал Южной гавани даёт §G+1§! единицу пропускной способности только для заморских покупателей: Кефрейта, Стеландера, Стеланда и Земли Хана.\n\n§YПРИ СРЫВЕ§!\nПотеря необходимых округов прерывает работы: задаток казны возвращается, политическая власть - нет."
 NAM_project_terminal_done_tt: "Если Южная гавань по-прежнему наша, появляется §G1§! единица пропускной способности для заморских покупателей. Иначе задаток возвращается в казну."
 NAM_cost_project_repair: "§Y25§! £political_power_texticon §Y150§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_project_repair_blocked: "§R25§! £political_power_texticon §R150§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_project_repair_tooltip: "§Y25§! £political_power_texticon §Y150§! £ADISCORD_economy_treasury_texticon\nКазна возвращается, если работы будут прерваны."
 NAM_cost_project_refinery: "§Y40§! £political_power_texticon §Y300§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_project_refinery_blocked: "§R40§! £political_power_texticon §R300§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_project_refinery_tooltip: "§Y40§! £political_power_texticon §Y300§! £ADISCORD_economy_treasury_texticon\nКазна возвращается, если работы будут прерваны."
 NAM_cost_project_pipeline: "§Y35§! £political_power_texticon §Y350§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_project_pipeline_blocked: "§R35§! £political_power_texticon §R350§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_project_pipeline_tooltip: "§Y35§! £political_power_texticon §Y350§! £ADISCORD_economy_treasury_texticon\nКазна возвращается, если работы будут прерваны."
 NAM_cost_project_terminal: "§Y30§! £political_power_texticon §Y250§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_project_terminal_blocked: "§R30§! £political_power_texticon §R250§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_project_terminal_tooltip: "§Y30§! £political_power_texticon §Y250§! £ADISCORD_economy_treasury_texticon\nКазна возвращается, если работы будут прерваны."
 NAM_overseas_districts: "Заморские округа"
 NAM_overseas_districts_desc: "§YОСТРОВНЫЕ ВЛАДЕНИЯ§!\nРесурсы: сталь £steel_texticon, алюминий £aluminium_texticon, вольфрам £tungsten_texticon.\nОстрова остаются чужими для большинства жителей. Независимость островов не рассматривается.\n\n§YУПРАВЛЕНИЕ ОСТРОВАМИ§!\n- Налоговые сборы в пользу казны.\n- Регулярная конвойная линия £convoy_texticon.\n- Продажа соседям прав на добычу.\nТекущие сборы, конвои и концессии показаны в экспортной сводке раздела «$NAM_national_programmes$»."
 NAM_island_steel_levy: "Стальной сбор с островов"
 NAM_island_steel_levy_desc: "§YЦЕНА§!: §Y20§! £political_power_texticon\n§YДЕЙСТВИЕ§!: §Y180§! £time_texticon дн.\n§YПОВТОР§!: через §Y60§! £time_texticon дн. после завершения.\n\n§YРЕЗУЛЬТАТ§!\nБольшой остров, Западный островной округ и Средний остров платят особый сбор со стали.\nКаждый из этих островов под нашей властью ежемесячно даёт §G30§! £ADISCORD_economy_treasury_texticon и теряет §R2%§! покорности."
 NAM_island_steel_levy_tt: "Каждый месяц, пока действует сбор, каждый из трёх островов под нашей властью приносит §G30§! £ADISCORD_economy_treasury_texticon и теряет §R2%§! покорности."
 NAM_island_convoy_service: "Островная конвойная служба"
 NAM_island_convoy_service_desc: "§YЦЕНА§!: §Y25§! £political_power_texticon §Y150§! £ADISCORD_economy_treasury_texticon\n§YДЕЙСТВИЕ§!: §Y180§! £time_texticon дн.\n§YПОВТОР§!: через §Y180§! £time_texticon дн. после применения.\n\n§YРЕЗУЛЬТАТ§!\nОплатить регулярные рейсы между гаванью и заморскими округами. Конвои вывозят руду и привозят припасы, а острова охотнее подчиняются власти, которая о них помнит.\n§G+8§! £convoy_texticon. На островах под нашей властью: добыча ресурсов §G+15%§! £resources_texticon и рост покорности §G+5%§!."
 NAM_island_convoy_service_tt: "Каждый остров под нашей властью получает §Yостровную конвойную линию§! на §Y180 дней§!: добыча ресурсов §G+15%§!, рост покорности §G+5%§!.\nКазна: §R-150§! £ADISCORD_economy_treasury_texticon."
 NAM_cost_convoy_service: "§Y25§! £political_power_texticon §Y150§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_convoy_service_blocked: "§R25§! £political_power_texticon §R150§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_convoy_service_tooltip: "§Y25§! £political_power_texticon §Y150§! £ADISCORD_economy_treasury_texticon\nЦена списывается при выборе."
 NAM_island_concession_231: "Стальная концессия Среднего острова"
 NAM_island_concession_231_desc: "§YЦЕНА§!: §Y20§! £political_power_texticon\n§YПОВТОР§!: через §Y60§! £time_texticon дн. после применения.\n\n§YРЕЗУЛЬТАТ§!\nПредложить права на добычу стали Среднего острова. После согласия покупателя казна получает §G300§! £ADISCORD_economy_treasury_texticon; остров остаётся нашим.\n\n§YПРЕКРАЩЕНИЕ§!\nВойна с концессионером или потеря острова закрывает концессию."
 NAM_island_concession_231_tt: "Страна получает предложение и ответит в ближайшие дни. При согласии она платит §Y300§! £ADISCORD_economy_treasury_texticon и получает права на добычу Среднего острова.\nЭкспортные конторы: §G+6§! £NAM_support_trade_texticon."
 NAM_renegotiate_val_concession: "Пересмотреть кефрейтскую концессию"
 NAM_renegotiate_val_concession_desc: "§YЦЕНА§!: §Y25§! £political_power_texticon\n§YПОВТОР§!: через §Y60§! £time_texticon дн. после применения.\n\n§YРЕЗУЛЬТАТ§!\nПересмотр военной концессии Кефрейта в Западном островном округе.\nКефрейт выбирает: разовый платёж §G300§! £ADISCORD_economy_treasury_texticon нашей казне или отказ от концессии."
 NAM_renegotiate_val_concession_tt: "Кефрейт получает требование. Если он заплатит §Y300§! £ADISCORD_economy_treasury_texticon, концессия сохранится; если откажется, права на добычу вернутся к нам, а отношения с Кефрейтом ухудшатся."
 NAM_request_val_aid: "Просить помощи Кефрейта за концессию"
 NAM_request_val_aid_desc: "§YПОВТОР§!: через §Y30§! £time_texticon дн. после применения.\n\n§YРЕЗУЛЬТАТ§!\nПредложение Кефрейту: права на добычу в Западном островном округе в обмен на оружие, наёмников или добровольцев.\nПакет помощи и окончательные условия требуют согласия Кефрейта."
 NAM_request_val_aid_paid: "Просить помощи Кефрейта за плату"
 NAM_request_val_aid_paid_desc: "§YПОВТОР§!: через §Y30§! £time_texticon дн. после применения.\n\n§YРЕЗУЛЬТАТ§!\nПредложение Кефрейту: купить оружие, наёмников или добровольцев без передачи прав на добычу.\nЦена и пакет помощи определяются согласованной сделкой."
 NAM_val_aid_fee_tt: "В казне не меньше §Y400§! £ADISCORD_economy_treasury_texticon"
 NAM_south_allied_fuel: "Топливо союзникам Юга"
 NAM_south_allied_fuel_desc: "§YЦЕНА§!: §Y25§! £political_power_texticon\n§YПОВТОР§!: через §Y45§! £time_texticon дн. после применения.\n\n§YРЕЗУЛЬТАТ§!\nКаждый союзник северного лагеря получает §G2500§! £fuel_texticon с наших складов.\nПоставки идут последовательно, пока хватает топлива; без запаса помощь следующему союзнику не отправляется."
 NAM_south_allied_fuel_tt: "Каждый союзник северного лагеря в войне за Юг получает §G2500§! £fuel_texticon и §G+2%§! поддержки войны; столько же топлива списывается с наших складов. Поставки идут, пока на складе остаётся §Y2500§! £fuel_texticon."
 NAM_south_convoy_interdiction: "Перехват конвоев Шахрабада"
 NAM_south_convoy_interdiction_desc: "§YЦЕНА§!: §Y20§! £political_power_texticon §Y2000§! £fuel_texticon\n§YДЕЙСТВИЕ§!: §Y60§! £time_texticon дн.\n§YПОВТОР§!: через §Y60§! £time_texticon дн. после применения.\n\n§YРЕЗУЛЬТАТ§!\nОхотники за конвоями выходят на маршруты танкеров и барж, питающих печи Шахрабада.\nШахрабад теряет §R5000§! £fuel_texticon и получает временную блокаду конвоев. Опыт нашего флота: §G+5§! £navy_experience."
 NAM_cost_convoy_interdiction: "§Y20§! £political_power_texticon §Y2000§! £fuel_texticon"
 NAM_cost_convoy_interdiction_blocked: "§R20§! £political_power_texticon §R2000§! £fuel_texticon"
 NAM_cost_convoy_interdiction_tooltip: "§Y20§! £political_power_texticon §Y2000§! £fuel_texticon\nЦена списывается при выборе."
 ADISCORD_nam_debug_damage_fields: "§RDEBUG:§! Повредить промыслы Светлогорья"
 ADISCORD_nam_debug_damage_fields_desc: "Снижает состояние Северных месторождений и Южнобережного округа на 40 и пересчитывает нефтяную пропускную способность. Учитывает действующую усиленную охрану собственных контролируемых промыслов: она уменьшает ущерб вдвое."

 ADISCORD_nam_oil.1.t: "Светлогорское топливо"
 ADISCORD_nam_oil.1.d: "Торговый представитель Светлогорья привёз проект контракта. Светлогорье предлагает ежемесячные поставки топлива со своих промыслов - по 1500 £fuel_texticon каждый месяц, пока договор в силе и пока между нами нет войны.\n\nПромыслы Светлогорья дают большую часть нефти Юга, и в министерствах понимают, что от этого контракта будет трудно отказаться позже. Подпись даст топливо сейчас, но поставит наши склады в зависимость от решений Егора Рома."
 ADISCORD_nam_oil.1.a: "Обойдёмся без светлогорской нефти."
 ADISCORD_nam_oil.1.b: "Подписать контракт."
 NAM_oil_1_a_tt: "Контракт не заключается."
 NAM_oil_1_b_tt: "Каждый месяц мы получаем §G1500§! £fuel_texticon, если у Светлогорья есть свободная пропускная способность и топливо на складе. Война со Светлогорьем оборвёт поставки и вызовет на §Y90 дней§! нехватку топлива."
 ADISCORD_nam_oil.2.t: "Ответ покупателя"
 ADISCORD_nam_oil.2.d_signed: "[FROM.GetNameDefCap] подписывает контракт. Первые цистерны уходят с промыслов в ближайший месяц, а в портовых конторах уже считают выручку.\n\nКаждый контракт занимает часть пропускной способности промыслов, но делает соседей заинтересованными в том, чтобы светлогорская нефть продолжала течь."
 ADISCORD_nam_oil.2.d_lapsed: "[FROM.GetNameDefCap] соглашается на контракт, но к моменту подписания у промыслов не осталось свободной пропускной способности. Конторы извиняются за задержку и обещают вернуться к разговору, когда трубы освободятся."
 ADISCORD_nam_oil.2.d_refused: "[FROM.GetNameDefCap] отказывается от контракта. В министерствах предпочитают не связывать свои склады со Светлогорьем - по крайней мере сейчас."
 ADISCORD_nam_oil.2.a: "Принято к сведению."
 ADISCORD_nam_oil.4.t: "Сталь Среднего острова"
 ADISCORD_nam_oil.4.d: "Светлогорье предлагает права на добычу стали на Среднем острове. Рудники остаются под светлогорским флагом, но вся их добыча пойдёт нам. Цена - 300 £ADISCORD_economy_treasury_texticon единовременно.\n\nКонцессия действует, пока остров принадлежит Светлогорью и между нами нет войны."
 ADISCORD_nam_oil.4.a: "Отказаться."
 ADISCORD_nam_oil.4.b: "Купить концессию."
 NAM_oil_4_a_tt: "Концессия не заключается."
 NAM_oil_4_b_tt: "Казна: §R-300§! £ADISCORD_economy_treasury_texticon.\nМы получаем права на добычу §YСреднего острова§!."
 ADISCORD_nam_oil.5.t: "Ответ о концессии"
 ADISCORD_nam_oil.5.d_signed: "[FROM.GetNameDefCap] покупает стальную концессию Среднего острова. Деньги уже в казне, а на рудниках вывешивают новые списки смен."
 ADISCORD_nam_oil.5.d_refused: "[FROM.GetNameDefCap] отказывается от стальной концессии. Рудники Среднего острова продолжают работать на Светлогорье."
 ADISCORD_nam_oil.5.a: "Принято к сведению."
 ADISCORD_nam_oil.6.t: "Новые условия концессии"
 ADISCORD_nam_oil.6.d: "Канцелярия Светлогорья требует пересмотреть концессию на Западном островном округе. Договор, заключённый во время войны, больше не устраивает признанное государство: Светлогорье требует единовременного платежа в 300 £ADISCORD_economy_treasury_texticon. Отказ означает расторжение концессии.\n\nВ Кефрейте понимают, что спорить с хозяином острова можно лишь до определённого предела."
 ADISCORD_nam_oil.6.a: "Заплатить и сохранить концессию."
 ADISCORD_nam_oil.6.b: "Отказаться от новых условий."
 ADISCORD_nam_oil.close: "Вопрос уже решён."
 NAM_oil_6_a_tt: "Казна: §R-300§! £ADISCORD_economy_treasury_texticon.\nПрава на добычу в §YЗападном островном округе§! сохраняются."
 NAM_oil_6_b_tt: "Концессия расторгается: права на добычу возвращаются Светлогорью.\nНаше отношение к Светлогорью ухудшается."
 ADISCORD_nam_oil.7.t: "Ответ Кефрейта"
 ADISCORD_nam_oil.7.d_paid: "Кефрейт принял новые условия и перевёл деньги. Концессия на Западном островном округе продолжает действовать, но теперь её цену определяет Светлогорье."
 ADISCORD_nam_oil.7.d_revoked: "Кефрейт отказался платить. Концессия расторгнута, рудники Западного островного округа снова работают на Светлогорье. Наместники считают это восстановлением справедливости, в Кефрейте - оскорблением."
 ADISCORD_nam_oil.7.a: "Принято к сведению."
 ADISCORD_nam_oil.10.t: "Нефть для коалиции"
 ADISCORD_nam_oil.10.d: "Война с Землёй Хана идёт на нескольких фронтах, и у каждого союзника в штабе висит одна и та же сводка расхода топлива. Посланники коалиции спрашивают Светлогорье прямо: будет ли его нефть общей?\n\nНефтяники советуют назвать цену - другого такого момента не будет. Офицеры напоминают, что без топлива союзников армии Хана придут и к промыслам Светлогорья. Экспортные конторы предлагают обычные контракты: топливо в обмен на деньги, по правилам, которые союзники уже знают."
 ADISCORD_nam_oil.10.a: "Сначала доля Светлогорья."
 ADISCORD_nam_oil.10.b: "Заправить коалицию."
 ADISCORD_nam_oil.10.c: "Предложить союзникам контракты."
 NAM_oil_10_a_tt: "Нефтяники: §G+6§! £NAM_support_oil_texticon\nЭкспортные конторы: §G+6§! £NAM_support_trade_texticon\nОтношение союзников по коалиции к нам ухудшается."
 NAM_oil_10_b_tt: "Каждый союзник по коалиции получает §G3000§! £fuel_texticon, пока на нашем складе есть столько топлива; отношение союзников к нам улучшается."
 NAM_oil_10_c_tt: "Союзники по коалиции из числа наших покупателей получают предложение топливного контракта. Каждый контракт по-прежнему требует свободной пропускной способности."
 NAM_oil_buyer_eligible_tt: "Страна не воюет с нами, ещё не покупает наше топливо, не ждёт ответа на другое наше предложение, не находится под нашим эмбарго и не получает топливо по договору с нами"
 NAM_concession_231_free_tt: "Средний остров принадлежит нам и контролируется нами; концессия никому не продана и не ждёт ответа; страна не воюет с нами"
 NAM_val_renegotiation_free_tt: "Кефрейт ещё не ответил на прежнее требование"
 NAM_south_blockade_free_tt: "Предыдущий перехват конвоев Шахрабада уже закончился"

 # Ladder of seals: characters
 NAM_Arseny_Klyuch: "Арсений Тарханов"
 NAM_Lev_Gavanov: "Лев Корнилов"
 NAM_Taras_Shtyk: "Тарас Дроздов"
 NAM_Vera_Pechat: "Вера Сабурова"
 NAM_Arseny_Klyuch_advisor: "Арсений Тарханов"
 NAM_Lev_Gavanov_advisor: "Лев Корнилов"
 NAM_Taras_Shtyk_advisor: "Тарас Дроздов"
 NAM_Vera_Pechat_advisor: "Вера Сабурова"
 NAM_Nadezhda_Okrug: "Надежда Ладыгина"
 NAM_Kirill_Vykup: "Кирилл Мезенцев"
 NAM_Yaroslav_Weber: "Ярослав Вебер"
 NAM_Gleb_Burov: "Глеб Буров"
 NAM_Anton_Zhar: "Антон Зимин"
 NAM_Matvei_Prichal: "Матвей Северцев"
 NAM_Grigory_Levashov: "Григорий Левашов"
 NAM_Egor_Rom_desc: "Егор Ром начинал писарем ключевской управы и поднялся по лестнице печатей до наместника всего Светлогорья. Он знает цену каждой подписи и помнит, сколько бочек нефти стоила каждая из них. Его власть держится не на любви, а на том, что без него бумаги перестают двигаться."
 NAM_Arseny_Klyuch_advisor_desc: "Наместник Ключевска и хозяин крупнейших промыслов. Говорит от имени нефтяников, но считает их выручку своей."
 NAM_Lev_Gavanov_advisor_desc: "Начальник Южной гавани и заморских округов. Знает каждого капитана и каждого покупателя за морем."
 NAM_Taras_Shtyk_advisor_desc: "Комендант гарнизонов. Солдаты верят ему больше, чем канцелярии, и он этого не скрывает."
 NAM_Vera_Pechat_advisor_desc: "Старший регистратор печатей. Через её реестр проходит каждое назначение наместника."
 NAM_Arseny_Klyuch_leader_desc: "Арсений Тарханов взял власть от имени промыслов. Теперь нефть Ключевска - государственная казна, а государственная казна - его касса."
 NAM_Lev_Gavanov_leader_desc: "Лев Корнилов правит из Южной гавани. Он обещает Светлогорью торговлю со всем миром и ждёт за это послушания."
 NAM_Taras_Shtyk_leader_desc: "Тарас Дроздов привёл гарнизоны в канцелярию. Его порядок прост: приказ, исполнение, отчёт коменданту."
 NAM_Vera_Pechat_leader_desc: "Вера Сабурова знает, где лежит каждая печать Светлогорья. Теперь все они хранятся в её реестре."
 NAM_Nadezhda_Okrug_desc: "Надежда Ладыгина председательствует в совете округов. Её власть ограничена хартией и держится на согласии районов."
 NAM_Kirill_Vykup_desc: "Кирилл Мезенцев много лет сводил ведомости канцелярии. Теперь он руководит Светлогорским Союзом, где каждая бочка учтена в общем договоре."
