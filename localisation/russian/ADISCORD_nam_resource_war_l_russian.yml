 NAM_national_programmes_desc:0 "§YДОГОВОР СВЕТЛОГОРСКА§!\n[NAMGetCompactStatus].\n\n§YМЕСТНЫЕ ПРОГРАММЫ§!\nРемонт, развитие промыслов и оборонные рубежи выбираются на карте. Общегосударственные заказы и поставки - в решениях ниже.[NAMGetCapturedWellsReport][NAMGetPrewarMandateRecord]"
 NAM_compact_ready: "§Gработает не менее 60 дней§!"
 NAM_compact_maturing: "§Yподписан, необходимы 60 непрерывных дней работы§!"
 NAM_compact_absent: "не заключён"
 NAM_receive_250_tt: "Казна: §G+250§! £ADISCORD_economy_treasury_texticon."
 NAM_compact_paid_tt: "Начинаются §Y60§! £time_texticon дн. непрерывной работы гражданских служб Светлогорска. Если этот срок выдержан при нашем владении и контроле к началу ресурсной войны, договор предотвращает стартовое восстание. Дозревание во время войны уже не меняет этот исход. Потеря владения или контроля обрывает договор; после возвращения округа его можно оплатить заново до войны."
 NAM_compact_signable_tt: "Светлогорск принадлежит нам и контролируется нами; договор ещё не подписан, ресурсная война ещё не началась и не завершилась."
 NAM_current_war_tt: "Идёт ресурсная война с Эфлором и Ажаром."
 NAM_victory_tt: "Ресурсная война завершена признанием независимости Светлогорья."
 NAM_war_objective_tt: "Победа: капитуляция противников либо на §Y420-й день§! войны нефтяной счёт §Y100§! и больше вместе с захваченным пограничным округом противника - Моренским округом, Лоренским порубежьем, Средним Лореном или Ажарским взморьем. Северные месторождения дают §Y80§!, Южнобережье §Y36§!, Сухоречье §Y24§!, Восточное Сухоречье §Y12§!, Светлогорский округ §Y12§!. Счёт §Y100§! и больше без пограничного округа - ничья: война заканчивается на прежней границе, без договора о признании и без наказания соседей. Счёт от §Y36§! до §Y99§! ведёт к компромиссному миру. Таймер показан в национальных решениях."
 NAM_defend_fields: "Удержать нефтяной бассейн"
 NAM_defend_fields_desc: "Судьба Светлогорья решается у скважин, на дорогах и в пограничных округах. Штабы сверяют донесения, а правительство готовится защищать за столом переговоров то, что удержат войска."
 ADISCORD_nam_resource_war.109.t: "Под прежней фамилией"
 ADISCORD_nam_resource_war.109.d: "Егор Ром остановился на старой подписи. Чернила выцвели, край листа пожелтел, но фамилия читалась ясно. Когда он выводил её впервые, страна ещё называлась Вейранской империей, а сам он был обыкновенным писарем при дворе. Он знал, кому подать прошение, у кого придержать бумагу и к какому часу лучше принести её на подпись. Иногда требовалось быть незаметным, иногда - успеть раньше остальных. К великим замыслам это отношения не имело.\n\nКризис начался задолго до падения монархии. Во дворце его превращали в доклады, переносили из одной ведомости в другую, облекали в формулировки, с которыми можно было дожить до следующего заседания. За дворцовыми стенами жить становилось всё труднее. Потом взорвался реактор нулевой точки. После катастрофы накопившееся отчаяние вышло на улицы, и массовое восстание смело власть, чьи распоряжения Ром ещё недавно переписывал набело.\n\nУоркер и Дориан Воркс обещали свободу и новую жизнь. Люди слушали их, потому что прежней жизни больше не хотели. В официальных речах оба были выходцами из низших каст, поднявшимися вместе с народом против престола. Ром помнил, как уверенно они держались и как свободно обращались со словами, которым при дворе учились с детства. Порой ему казалось, что за новыми именами проступает что-то знакомое. Но память писаря не была доказательством, а расспрашивать о чужом прошлом он не спешил.\n\nРеволюционеры меняли фамилии. От прежнего имени можно было отказаться вместе со старым порядком, оставить его в бумагах, до которых теперь мало кому было дело. \"Уорк\" означало \"народ\"; название Воркерланда обещало страну тем, кто прежде не имел в ней голоса. Ром слушал эти объяснения и продолжал подписываться как раньше. Он не чувствовал себя человеком, родившимся заново. У него оставались почерк, привычки и умение исполнить поручение.\n\nМонархию сменила воркерландская диктатура. У приказов появились новые основания, у учреждений - новые начальники. Ром нашёл себе место и здесь: где-то оказался удобен, где-то вовремя проявил расторопность. Позднее ему доверили Светлогорье, последнюю колонию Воркерланда на западном материке. Бывший придворный писарь стал наместником. На бумаге это выглядело огромной переменой. Под назначением стояла чужая подпись, а под ответом о принятии должности - всё та же его собственная."
 ADISCORD_nam_resource_war.109.a: "Пора решать дела Светлогорья."
 ADISCORD_nam_resource_war.10.t: "Стол, за которым остались мы"
 ADISCORD_nam_resource_war.10.d: "Егор Ром попросил снять со стены схему подчинения. На ней каждая здешняя управа была связана с другой, та - с третьей, а все линии уходили к Воркерланду. Теперь за ними не было общего центра. На столе схема оказалась слишком большой: пришлось подогнуть самый верх. Страна, которой Ром служил, распалась; учреждения Светлогорья всё ещё должны были работать.\n\nКирилл Мезенцев положил рядом ведомость жалованья. Рабочие промыслов спрашивали, почему снова задержана выплата; в Светлогорске собирали подписи против поборов. Наместники требовали прежде восстановить дисциплину. Представители округов хотели увидеть счета. Ром выслушал всех. Он слишком хорошо знал, как легко составить ответ, после которого ничего не изменится.\n\nКогда-то людям обещали свободу и новую жизнь. Теперь ему самому приносили жалобы, которые можно было подшить, отправить наверх и перестать замечать. Для этого не требовалось ни жестокости, ни особой веры в государство. Достаточно было аккуратно выполнить свою часть работы. Так он служил много лет.\n\nРом не собирался становиться новым пророком. Он хотел, чтобы Светлогорье могло жить вне безумной машины Воркерланда и покровительства южных диктатур. Чужая защита снова означала бы чужие требования, а отвечать перед людьми пришлось бы здесь. Но и самостоятельность не наполняла казну. Нужно было сохранить учреждения, удержать промыслы и решить, чьи нужды больше нельзя откладывать.\n\nОн придвинул ведомость. Старую задолженность можно погасить целиком, расплатиться пока только с промыслами или сохранить деньги до следующего квартала. Полная выплата даст людям передышку, но потребует большего расхода. Промыслы получат своё раньше города, если выбрать их. Отсрочка оставит деньги правительству и долги тем, кто уже отработал. На этот раз подписывать предстояло решение, за которое Ром должен был отвечать сам."
 ADISCORD_nam_resource_war.10.a: "Рассчитаться с людьми сейчас."
 ADISCORD_nam_resource_war.10.b: "Сохранить деньги до следующего квартала."
 ADISCORD_nam_resource_war.10.c: "Сначала заплатить промыслам."
 NAM_rw_10_c_tt: "Поддержка групп:\n  Нефтяники: §G+8§! £NAM_support_oil_texticon\n  Округа: §R-5§! £NAM_support_dist_texticon"
 ADISCORD_nam_resource_war.close: "Этот вопрос уже принадлежит прошлому."
 NAM_spend_250_tt: "Казна: §R-250§! £ADISCORD_economy_treasury_texticon."
 ADISCORD_nam_resource_war.11.t: "Карта вместо ведомости"
 ADISCORD_nam_resource_war.11.d: "Дежурный офицер развернул перед Ромом карту дорог к промыслам. Из донесений пока было трудно понять, где стоят части, а где связь просто задерживается. Ром попросил отмечать время каждого сообщения. На вопрос о дороге к Северным месторождениям ему ответили числом батальонов. Он повторил вопрос: могут ли по ней пройти машины со снабжением?\n\nВ штабе ждали, что наместник утвердит подготовленные распоряжения. Ром узнавал знакомый порядок: сначала изложение обстановки, затем решение, которое желательно получить от начальства. Здесь ошибка могла стоить жизни людям, которых он никогда не видел. Он попросил отделить подтверждённые сведения от предположений и дать офицерам закончить доклад.\n\nДипломатический предел войны - 420 дней с её начала. К этому сроку посредники сложат нефть месторождений, которые останутся за Светлогорьем: Северные дают 80, Южнобережье 36, Сухоречье 24, Восточное Сухоречье 12, Светлогорский округ 12. Сто и больше вместе с захваченным пограничным округом Эфлора или Ажара означают признанную независимость и новую границу; сто и больше без такого округа - ничью на прежней границе, без договора о признании. От 36 до 99 - компромиссный мир с уступками и данью. Меньше 36 - потеря всего материка: правительство уйдёт на острова, а без островов страну разделят. Война может кончиться и раньше: капитуляцией противников или нашей, неделей удержания всех пограничных округов соседей вместе со своими промыслами или неделей, в течение которой враг держит Северные месторождения и ещё один промысел. В решениях появились отсчёт и приказы удерживать промыслы.\n\nСветлогорск остаётся отдельным вопросом. Оплаченный договор, успевший проработать 60 дней до нападения, удерживает город от восстания. Без него всё решает сила подполья. Военные распоряжения уже можно принимать через чрезвычайную ветку фокусов, независимо от мирных планов.\n\nУ телефона ждал следующий связист. Ром отодвинул чашку от края карты и попросил соединить его со штабом снабжения."
 ADISCORD_nam_resource_war.11.d_successor: "В штабе Светлогорья больше не спорят о том, кому принадлежит формулировка ультиматума. Дежурный офицер раскладывает карту дорог к промыслам: Северные месторождения, Светлогорский округ, Южнобережье, Сухоречье и Восточное Сухоречье. Каждый удержанный промысел станет строкой будущего мирного договора.\n\nДипломатический предел войны - 420 дней с её начала. К этому сроку посредники сложат нефть месторождений, которые останутся за Светлогорьем: Северные дают 80, Южнобережье 36, Сухоречье 24, Восточное Сухоречье 12, Светлогорский округ 12. Сто и больше вместе с захваченным пограничным округом Эфлора или Ажара означают признанную независимость и новую границу; сто и больше без такого округа - ничью на прежней границе, без договора о признании. От 36 до 99 - компромиссный мир с уступками и данью. Меньше 36 - потеря всего материка: правительство уйдёт на острова, а без островов страну разделят. Война может кончиться и раньше: капитуляцией противников или нашей, неделей удержания всех пограничных округов соседей вместе со своими промыслами или неделей, в течение которой враг держит Северные месторождения и ещё один промысел. В решениях появились отсчёт и приказы удерживать промыслы.\n\nСветлогорск остаётся отдельным вопросом. Оплаченный договор, успевший проработать 60 дней до нападения, удерживает город от восстания. Без него всё решает сила подполья. Военные распоряжения уже можно принимать через чрезвычайную ветку фокусов, независимо от мирных планов."
 ADISCORD_nam_resource_war.11.a: "Выслушаем штаб снабжения."
 ADISCORD_nam_resource_war.12.t: "Послевоенное заседание"
 ADISCORD_nam_resource_war.12.d: "После подписания договора Мезенцев ещё раз прочитал статью о признании Светлогорья. Эфлор и Ажар признали его независимость. Их союз сохранился, пограничные части оставались на местах, но теперь переговоры с соседями можно было вести, ссылаясь на заключённое соглашение. Ром спросил, разосланы ли его условия в округа: там пока знали больше слухов, чем подробностей.\n\nНа заседании о послевоенном устройстве начальники управлений начали с недостатка людей и материалов. Затем выяснилось, что часть военных распоряжений они предлагают оставить в силе. Представители округов потребовали назвать срок: во время боёв многие вопросы откладывали, теперь они хотят знать, кто будет распоряжаться местными доходами и рассматривать жалобы.\n\nРом привык пользоваться временными полномочиями. С ними удавалось сократить согласования и добиться исполнения; без них придётся снова убеждать тех, кому вчера можно было приказать. Он не считал все возражения разумными, но помнил, как в Воркерланде очередная необходимость каждый раз отодвигала обещанный обычный порядок.\n\nВыбранный до войны курс нужно закрепить законом. Служебная вертикаль сохранит решающую роль центрального аппарата; хартия даст округам установленные права. Если выбор всё ещё отложен, предстоит определить его теперь. Ром попросил составителей обоих проектов объяснить, какие полномочия они оставляют за правительством и кому можно пожаловаться на его решение. Обсуждать предлагалось по одной статье, начиная с порядка рассмотрения жалоб."
 ADISCORD_nam_resource_war.12.d_standoff_successor: "Война закончилась на прежней границе. Эфлор и Ажар не подписали признания независимости Светлогорья; их союз сохранился. Военным складам требуется пополнение, округа ждут ремонта и возвращения к обычному управлению.\n\nНа послевоенном заседании начальники управлений предлагают сохранить часть чрезвычайных полномочий. Представители округов требуют определить их пределы и порядок обжалования решений. Выбранный до войны курс предстоит закрепить законом, не дожидаясь договора с соседями: служебная вертикаль сохранит ведущую роль центрального аппарата, хартия установит права округов. Если выбор откладывался, его нужно сделать теперь."
 ADISCORD_nam_resource_war.12.d_successor: "Эфлор и Ажар признали независимость Светлогорья. Их союз сохранился, а войска по-прежнему стоят на границе. Военным складам требуется пополнение; округа ждут ремонта и возвращения к обычному управлению.\n\nНа послевоенном заседании начальники управлений предлагают сохранить часть чрезвычайных полномочий. Представители округов требуют определить их пределы и порядок обжалования решений. Выбранный до войны курс предстоит закрепить законом: служебная вертикаль сохранит ведущую роль центрального аппарата, хартия установит права округов. Если выбор откладывался, его нужно сделать теперь."
 ADISCORD_nam_resource_war.12.d_standoff: "Мезенцев вернул Рому сообщение о прекращении войны: слово \"признание\" в нём пришлось вычеркнуть. Эфлор и Ажар согласились остановиться на прежней границе, но независимость Светлогорья договором не подтвердили. Ром велел объяснить это округам прямо. После стольких обещаний объявить достигнутым то, чего не было, казалось ему особенно неразумным.\n\nНа заседании о послевоенном устройстве начальники управлений начали с недостатка людей и материалов. Затем выяснилось, что часть военных распоряжений они предлагают оставить в силе. Представители округов потребовали назвать срок: во время боёв многие вопросы откладывали, теперь они хотят знать, кто будет распоряжаться местными доходами и рассматривать жалобы.\n\nРом привык пользоваться временными полномочиями. С ними удавалось сократить согласования и добиться исполнения; без них придётся снова убеждать тех, кому вчера можно было приказать. Он не считал все возражения разумными, но помнил, как в Воркерланде очередная необходимость каждый раз отодвигала обещанный обычный порядок.\n\nВыбранный до войны курс нужно закрепить законом. Служебная вертикаль сохранит решающую роль центрального аппарата; хартия даст округам установленные права. Если выбор всё ещё отложен, предстоит определить его теперь. Ром попросил составителей обоих проектов объяснить, какие полномочия они оставляют за правительством и кому можно пожаловаться на его решение. Обсуждать предлагалось по одной статье, начиная с порядка рассмотрения жалоб."
 ADISCORD_nam_resource_war.12.a: "Начнём обсуждение закона."
 ADISCORD_nam_resource_war.13.t: "Приём продолжается"
 ADISCORD_nam_resource_war.13.d: "На совещание с руководством национального университета, представителями округов и управляющими промыслами отвели полчаса. Университет хотел пригласить преподавателей и инженеров; учреждения ещё не договорились, кто оплатит им переезд и жильё. Ром рассчитывал успеть выслушать всех до вечернего приёма, но разговор задержался на первом же вопросе.\n\nОдин из университетских сотрудников предложил обратиться к прежнему воркерландскому положению. Оно оставляло решение за администрацией. Представитель округа спросил, кто тогда станет оплачивать жильё приезжим специалистам. Управляющий промыслом хотел знать, смогут ли приглашённые инженеры совмещать преподавание с работой у него. Ром слушал и делал короткие пометки. В таком разговоре он ориентировался лучше, чем на военном совете.\n\nСтарое положение он знал. Его удобство состояло в том, что назначение можно было оформить раньше, чем выяснятся все расходы. Когда начинались жалобы, отвечать приходилось другому ведомству. Ром уже открыл рот, чтобы предложить знакомый порядок, но попросил сначала досчитать жильё и жалованье. Управляющий напомнил о сроках.\n- Поэтому и спрашиваю сейчас, - ответил Ром. - Кто принимает человека и из каких средств ему платят?\n\nОтведённые полчаса прошли. В приёмной начали спрашивать, состоится ли следующий приём. Ром попросил секретаря назвать ожидающим причину задержки и остался за столом. Закон о послевоенном устройстве уже действовал, университет начал работу, заводам требовались заказы, а вернувшимся домой людям - заработок. Между этими делами ещё предстояло установить порядок, который можно будет соблюдать.\n\nСотрудник университета назвал сумму. Мезенцев переспросил, включено ли в неё содержание жилья. Ром вернулся к первой пометке и попросил не переходить к следующему вопросу, пока не договорятся об этом."
 ADISCORD_nam_resource_war.13.d_successor: "В архиве нашли старый бланк: герб чужой столицы, место для подписи наместника и длинная графа согласований. Молодой сотрудник спросил, можно ли использовать чистую обратную сторону. Архивист разрешил.\n\nНа новых бланках пишут о работе института, расходах округов, заводских заказах и возвращении людей домой. Споры никуда не исчезли. Одни считают аппарат слишком сильным, другие боятся, что его недостаточно. На границе по-прежнему стоят войска. Но теперь эти споры имеют адресата здесь, а не за пределами страны.\n\nВ гражданской канцелярии продолжается приём. Люди приходят узнать о работе, жилье и возвращении родных. Учреждениям предстоит выполнять принятые законы и отвечать на эти вопросы."
 ADISCORD_nam_resource_war.13.a: "Уточните расходы."
 ADISCORD_nam_resource_war.70.t: "Обращение Рома"
 ADISCORD_nam_resource_war.70.t_successor: "Обращение правительства"
 ADISCORD_nam_resource_war.70.d: "До выхода в эфир оставалось несколько минут. Ром попросил техника прочесть первую строку с его места: хотелось понять, насколько громко нужно говорить. Из динамика в соседней комнате донеслось привычное канцелярское приветствие, произнесённое чужим голосом. Ром поморщился и убрал обращение к \"руководителям округов и управлений\". Исправленный вариант начинался с жителей Светлогорья.\n\nНа столе лежали три проекта. Наместники предлагали заверить страну, что управления и гарнизоны исполняют свои обязанности, а распоряжения сохраняют силу. Представители округов и нефтяных артелей хотели услышать, когда местные доходы станут служить тем, кто здесь живёт и работает. Офицеры требовали ясно сказать соседям, что промыслы будут защищены. Каждый проект был подписан людьми, без которых правительство не справится.\n\nРом попробовал соединить их. Получилась речь, в которой всем обещали деньги, никто не терял полномочий, а безопасность не требовала жертв. Он дочитал её до середины и вернулся к отдельным листам. Во время революции такие обещания звучали убедительно. Позднее ему самому доводилось объяснять просителям, почему обещанное пока нельзя исполнить.\n\nТехник показал, что связь готова. На промыслах и в портах ждали начала; слушать будут и те, кто никогда не бывал в его приёмной. Ром оставил возле микрофона текст с пометками. Без него он мог слишком долго объяснять обстоятельства и так и не сказать, чего собирается добиваться. Следовало выбрать главное: сохранить управляемость, поставить местные нужды впереди прочих расходов или подтвердить готовность защищать месторождения."
 ADISCORD_nam_resource_war.70.d_successor: "Радиоузел Светлогорска впервые включили на все промыслы сразу. В бараках Ключевска сдвинули койки к репродукторам, в Южной гавани остановили погрузку, а в канцелярии чиновники стояли в коридоре, потому что в кабинетах не хватило стульев. Правительство готовит обращение; на столе лежат три варианта речи.\n\nПервый написали наместники: о порядке, о печатях, которые больше не подчиняются далёкой столице, и о том, что страна держится на людях, умеющих исполнять приказ. Второй принесли представители округов и нефтяных артелей: нефть Светлогорья должна кормить тех, кто её добывает, а не только тех, кто ставит подписи. Третий набросали офицеры гарнизонов, коротко, как рапорт: соседи ждут нашей слабости, и мы не отдадим им ни одной скважины.\n\nСлушатели будут судить о намерениях правительства по тому, чему оно отдаст предпочтение. Администрация ждёт подтверждения полномочий, жители - внимания к местным нуждам, гарнизоны - поддержки в защите промыслов."
 ADISCORD_nam_resource_war.70.a: "Подтвердить полномочия управлений и гарнизонов."
 ADISCORD_nam_resource_war.70.b: "Поставить нужды жителей и промыслов на первое место."
 ADISCORD_nam_resource_war.70.c: "Заявить о готовности защищать месторождения."
 NAM_rom_address_a_tt: "Поддержка групп:\n  Наместники: §G+5§! £NAM_support_nam_texticon\n  Гарнизоны: §G+5§! £NAM_support_garr_texticon\n  Округа: §R-3§! £NAM_support_dist_texticon"
