 NAM_cabinet_install_machine_tools_decision_effect_tt:0 "При завершении на выбранном участке: §G+1§! строительная ячейка и §G1§! £civ_factory в $STATE_700$ либо §G1§! £dockyard_texticon в $STATE_228$. Станки расходуются. При утрате условий возвращаются станки и вся оплата."
