 NAM_project_steel:0 "Освоить железорудное месторождение"
 NAM_project_steel_desc:0 "Разведчики рудной жилы встретились у просеки с инженером. На разрезе пласта ещё видны следы дождя. Старший геолог просит принести образец, оставленный в полевой палатке."
