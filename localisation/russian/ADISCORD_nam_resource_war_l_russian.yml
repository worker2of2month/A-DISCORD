 # Armed services
 NAM_navy_dynamic:0 "Светлогорская флотилия"
 NAM_navy_dynamic_desc:0 "Южная гавань связывает материк с островами. Сторожевые корабли, транспортные команды и ремонтные мастерские составляют основу собственной морской службы."
 NAM_air_dynamic:0 "Воздушная служба Светлогорья"
 NAM_air_dynamic_desc:0 "Унаследованные машины требуют механиков, лётчиков и собственного порядка вылетов. Воздушная служба объединяет аэродромы и эскадрильи для защиты страны."
 NAM_landing_school:0 "Школа морского десанта"
 NAM_landing_school_desc:0 "Островные гарнизоны должны уметь не только ждать корабли, но и сходить с них на чужой берег. Капитаны и командиры пехоты разработают общий порядок высадки и подвоза."
 NAM_grp_landing_school_tt:0 "Поддержка гарнизонов: §G+5§! £NAM_support_garr_texticon."
 NAM_flight_school:0 "Светлогорская лётная школа"
 NAM_flight_school_desc:0 "После ухода центральных ведомств лётчики и инструкторы остались без общего руководства. Собственная школа соберёт их у столичного аэродрома и вернёт подготовку экипажей к регулярному расписанию."
 NAM_air_ground_service:0 "Наземная служба аэродромов"
 NAM_air_ground_service_desc:0 "Самолёт начинается с работы на земле. Механики получат единые инструкции, склады запчастей и порядок приёмки машин после ремонта."
 NAM_air_interceptors:0 "Прикрытие промыслов"
 NAM_air_interceptors_desc:0 "Насосные станции и хранилища слишком важны, чтобы встречать налёты только зенитным огнём. Дежурные истребители будут подниматься по сигналам наблюдателей и прикрывать промышленный район."
 NAM_air_support:0 "Авиация поля боя"
 NAM_air_support_desc:0 "Нашим частям приходится сражаться за узкие дороги и отдельные переправы. Штурмовые эскадрильи будут работать по заявкам наземных командиров и расчищать путь наступающим колоннам."
 NAM_air_operations:0 "Единое управление полётами"
 NAM_air_operations_desc:0 "Отдельные эскадрильи должны действовать по общему замыслу. Диспетчеры, наблюдатели и штабы согласуют маршруты, смены экипажей и порядок передачи целей."
 NAM_air_fighter_order:0 "Закупить истребители"
 NAM_air_fighter_order_desc:0 "Закупочная комиссия принимает восстановленные истребители вместе с документацией. Перед передачей в части машины проходят проверку и облёт."
 NAM_air_cas_order:0 "Закупить штурмовики"
 NAM_air_cas_order_desc:0 "Авиамастерские подготовят партию штурмовых машин. Инспекторы проверят крепления вооружения, связь и работу двигателей перед передачей самолётов в части."
 NAM_air_fighter_order_unlock_tt:0 "После применения решения на склады Светлогорья: §G+24§! £air_superiority_texticon $ADISCORD_fighter_airframe_2163$."
 NAM_air_cas_order_unlock_tt:0 "После применения решения на склады Светлогорья: §G+24§! £cas_texticon $ADISCORD_cas_airframe_2170$."
