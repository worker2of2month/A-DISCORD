 NAM_pw_contract_arbitration_refund_tt:0 "При отмене полностью возвращаются: §G35§! £political_power_texticon §G350§! £ADISCORD_economy_treasury_texticon."
 NAM_state_plan:0 "Центральный производственный план"
 NAM_state_plan_desc:0 "Канцелярия сведёт государственные заказы в один график. Управляющие будут отвечать за выпуск перед единой комиссией, а не торговаться с каждым наместником отдельно."
 NAM_regional_trusts:0 "Окружные тресты"
 NAM_regional_trusts_desc:0 "Наместники сохранят хозяйственную инициативу через подконтрольные тресты. Казна будет требовать исполненного договора, оставляя способы работы местным управляющим."
 NAM_unified_standards:0 "Единые промышленные стандарты"
 NAM_unified_standards_desc:0 "Мастерские бассейна используют несовместимые детали и собственные меры качества. Государственные инженеры соберут общий каталог, которому смогут доверять снабженцы и производители."
 NAM_state_logistics_grid:0 "Магистрали бассейна"
 NAM_state_logistics_grid_desc:0 "Грузы должны проходить между промыслами и гаванью по расписанию. Дорожные управления получат общую диспетчерскую службу, ремонтные бригады и транспорт."
 NAM_state_project_bureaus:0 "Государственные проектные бюро"
 NAM_state_project_bureaus_desc:0 "Вместо разрозненных кабинетов при ведомствах появятся постоянные проектные коллективы. Они будут вести сложные работы от чертежа до приёмки и сохранять знания между заказами."
 NAM_public_utilities:0 "Коммунальные сети"
 NAM_public_utilities_desc:0 "Округа начнут с того, что связывает повседневную жизнь: воды, света и дорог к рабочим кварталам. Общие заказы позволят небольшим управлениям договариваться с подрядчиками на равных."
 NAM_municipal_services:0 "Общественные службы"
 NAM_municipal_services_desc:0 "Хартия должна стать ощутимой в приёмной, библиотеке и учебной мастерской. Окружные собрания возьмут на себя организацию служб, которые раньше зависели от личной милости наместника."
 NAM_civic_audit:0 "Выборные ревизоры"
 NAM_civic_audit_desc:0 "Жители вправе знать, куда ушла нефтяная выручка. Ревизоров будут назначать окружные собрания; их заключения станут открытыми для соседних управлений и местной печати."
 NAM_district_workshops:0 "Мастерские районов"
 NAM_district_workshops_desc:0 "Ремонт и повседневные заказы не должны ждать свободной очереди в столичной мастерской. Новые предприятия на побережье и в Сухоречье возьмут на себя работу для окружающих поселений."
 NAM_open_libraries:0 "Открытые библиотеки"
 NAM_open_libraries_desc:0 "Технические справочники и новые исследования больше не будут запираться в ведомственных архивах. Округа создадут читальни и обмен изданиями для преподавателей, инженеров и учащихся."
 NAM_pragmatic_compact:0 "Договор вместо перевеса"
 NAM_pragmatic_compact_desc:0 "Ни округа, ни наместники не смогли навязать стране собственный порядок. Ром предложит им правительство согласованных обязательств: каждое полномочие должно иметь предел, а каждое обещание - исполнителя."
 NAM_commercial_courts:0 "Хозяйственный арбитраж"
 NAM_commercial_courts_desc:0 "Спор между промыслом и казной не должен останавливать весь город. Арбитражные коллегии получат право требовать документы у обеих сторон и выносить исполнимые решения."
 NAM_export_clearing:0 "Расчётная палата экспорта"
 NAM_export_clearing_desc:0 "Торговые дома объединят расчёты по крупным топливным партиям. Казна выступит гарантом исполнения, получая свою долю после закрытия сделки."
 NAM_machine_tool_contracts:0 "Станки в обмен на доверие"
 NAM_machine_tool_contracts_desc:0 "Часть торговой выручки останется у поставщиков оборудования. Долгий договор свяжет поставку станков с их наладкой и обслуживанием, чтобы мастерские получили работающие машины."
 NAM_contract_register:0 "Реестр обязательств"
 NAM_contract_register_desc:0 "Одно и то же имущество больше не должно обеспечивать несколько тайных обещаний. Общий реестр покажет, что уже заложено, кому причитается выручка и какой договор имеет первенство."
 NAM_port_agreement:0 "Единый портовый договор"
 NAM_port_agreement_desc:0 "Судовладельцы, грузчики и таможенная служба согласуют одно расписание и общий порядок приёмки. Порт перестанет терять грузы между чужими печатями."
 NAM_warehouse_receipts:0 "Складские свидетельства"
 NAM_warehouse_receipts_desc:0 "Подтверждённый складской запас станет обеспечением хозяйственных договоров. Для этого потребуются опечатанные резервуары, независимые учётчики и место для крупных партий."
 NAM_insured_caravans:0 "Страхование караванов"
 NAM_insured_caravans_desc:0 "Страховой сбор будет покрывать сопровождение и ремонт судов. Общая ответственность заставит торговые дома поддерживать конвойную службу даже в тихие месяцы."
 NAM_commercial_reserve:0 "Страховой резерв казны"
 NAM_commercial_reserve_desc:0 "После сверки обязательств торговые дома внесут согласованные взносы в казённый резерв. Его средства позволят государству выполнить гарантию, не разрывая уже оплаченные заказы."
 NAM_commercial_reserve_tt:0 "Казна: §G+500§! £ADISCORD_economy_treasury_texticon."
 NAM_balanced_accounts:0 "Взаимные гарантии"
 NAM_balanced_accounts_desc:0 "Правительство сможет требовать исполнения договоров потому, что само научилось отвечать по ним. Порт, расчётная палата и казна сведут гарантии в общий порядок."
 NAM_prag_ending_republic:0 "Республика договоров"
 NAM_prag_ending_republic_desc:0 "Пределы власти закрепят публичным соглашением между округами, казной и хозяйственными объединениями. Ром останется арбитром, обязанным исполнять те же правила, что и остальные."
 NAM_prag_ending_directorate:0 "Деловой совет государства"
 NAM_prag_ending_directorate_desc:0 "Ключевые решения перейдут постоянному совету казны и крупнейших хозяйственных объединений. Ром возглавит его как гарант обязательств, ставя исполнение договоров выше спора о представительстве."
 NAM_prag_settlement_agreements:0 "Расчётные соглашения"
 NAM_prag_settlement_agreements_desc:0 "Соседям предложат общий порядок расчётов и защиту торговых обязательств. Они сохранят собственные управления и армии, принимая договорное первенство Светлогорска."
 NAM_prag_partner_supply:0 "Снабжение участников договора"
 NAM_prag_partner_supply_desc:0 "Договоры требуют надёжных поставок. Светлогорск подготовит транспорт и порядок отпуска топлива союзникам и зависимым участникам расчётной системы."
 NAM_prag_south_guarantees:0 "Гарантии южных контрактов"
 NAM_prag_south_guarantees_desc:0 "Казна не сможет отвечать по южным обязательствам, пока их исполнение зависит от воли чужого гегемона. Совет подготовит общую кампанию и объявит порядок послевоенного расчёта."
 NAM_prewar_pragmatic_mandate_tt:0 "К началу ресурсной войны баланс был от §Y-25%§! до §Y+25%§! включительно: закреплён прагматический курс"
 NAM_pragmatic_ending_tt:0 "Завершается борьба за печати. Государственный аппарат получает устройство выбранного финала."
 NAM_prag_settlement_agreements_tt:0 "Эфлор и Ажар получат предложение экономического договора: собственные правительство и армия, §Y15%§! гражданской промышленности и торговые привилегии Светлогорью, без передачи людей и военных заводов. Участники обязаны поддержать общую сторону в южной войне. Отказ не начинает войну."
 NAM_prag_south_guarantees_tt:0 "Согласован приказ о выступлении против Шахрабада. Он будет исполнен после завершения общего предупреждения, когда обе стороны подготовятся к войне."
 NAM_administration_default_title:0 "Канцелярия Светлогорья"
 NAM_administration_prag_republic_title:0 "Республика договоров"
 NAM_administration_prag_directorate_title:0 "Деловой совет государства"
 ADISCORD_nam_debug_start_resource_war_tt:0 "Немедленно начинает ресурсную войну через обычную подготовку участников и фиксирует текущий BOP Светлогорья."
 ADISCORD_nam_debug_resolve_nam_victory_tt:0 "Победа Светлогорья: признание независимости, пограничные приобретения, наказание побеждённых и открытие послевоенного дерева. Сохранённый политический курс не меняется."
 ADISCORD_nam_debug_resolve_coalition_victory_tt:0 "Победа коалиции: материк разделён между Эфлором и Ажаром. При наличии подходящих островов Светлогорье уходит в изгнание; иначе остатки страны присоединяет Эфлор."
 ADISCORD_nam_debug_resolve_compromise_tt:0 "Мир по текущему контролю промыслов: захваченное отходит коалиции, Светлогорье сохраняет остальное, получает дерево поражения и начинает выплату топливной дани."
 ADISCORD_nam_debug_resolve_standoff:0 "§RDEBUG:§! Удержать независимость без приобретений"
 ADISCORD_nam_debug_resolve_standoff_desc:0 "Наступление соседей выдыхается, и обе стороны прекращают боевые действия."
 ADISCORD_nam_debug_resolve_standoff_tt:0 "Мир без пограничных приобретений и наказания коалиции. Светлогорье сохраняет независимость и получает послевоенное дерево своего зафиксированного курса."
 ADISCORD_nam_debug_prepare_etatism:0 "§RDEBUG:§! Предвоенный курс: этатизм"
 ADISCORD_nam_debug_prepare_etatism_desc:0 "Наместники собирают решающий перевес в управлении страной."
 ADISCORD_nam_debug_prepare_etatism_tt:0 "Устанавливает BOP Светлогорья на §Y-50%§!. При начале ресурсной войны будет зафиксирован этатистский курс."
 ADISCORD_nam_debug_prepare_pragmatism:0 "§RDEBUG:§! Предвоенный курс: прагматизм"
 ADISCORD_nam_debug_prepare_pragmatism_desc:0 "Округа и наместники договариваются об общем порядке работы."
 ADISCORD_nam_debug_prepare_pragmatism_tt:0 "Устанавливает BOP Светлогорья на §Y0%§!. При начале ресурсной войны будет зафиксирован прагматический курс."
 ADISCORD_nam_debug_prepare_humanism:0 "§RDEBUG:§! Предвоенный курс: гуманизм"
 ADISCORD_nam_debug_prepare_humanism_desc:0 "Окружные собрания получают решающий голос в делах страны."
 ADISCORD_nam_debug_prepare_humanism_tt:0 "Устанавливает BOP Светлогорья на §Y+50%§!. При начале ресурсной войны будет зафиксирован гуманистский курс."
 ADISCORD_nam_debug_start_ready_tt:0 "Распад метрополии уже начался; ресурсная война ещё не состоялась; Светлогорье, Эфлор и Ажар существуют, не воюют и контролируют необходимые стартовые районы."
