 NAM_bw_688_drilling_tt:0 "§YБурение: [688.GetName]§!\nЧерез §Y42§! £time_texticon: Мощность промысла: §G+2§!, до его местного предела. Каждая единица мощности даёт до §G10§! £resources_strip|1 нефти при полном восстановлении скважин.\nТребуются свободные местная площадка и место подготовки, контроль региона и полная оплата.[688.NAMArtelSurveyNote]"
 NAM_bw_689_drilling_tt:0 "§YБурение: [689.GetName]§!\nЧерез §Y42§! £time_texticon: Мощность промысла: §G+2§!, до его местного предела. Каждая единица мощности даёт до §G10§! £resources_strip|1 нефти при полном восстановлении скважин.\nТребуются свободные местная площадка и место подготовки, контроль региона и полная оплата.[689.NAMArtelSurveyNote]"
