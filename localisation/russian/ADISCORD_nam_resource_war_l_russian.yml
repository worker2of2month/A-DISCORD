 # Focus trees: exile revolution
 # ----- Defeat tree: exile revolution, shared -----
 NAM_war_of_return_won_tt:0 "Война возвращения выиграна"
 # ----- Exile radicals: the pillar junta and the great return -----
 NAM_rad_pillar_junta:0 "Хунта столпов"
 NAM_rad_pillar_junta_desc:0 "Наместник низложен, и печати теперь в руках тех, кто держал острова все эти месяцы: гарнизонных командиров, нефтяных старшин и капитанов. Хунта столпов не обещает свобод. Она обещает вернуть материк любой ценой."
 NAM_grp_rad_pillar_junta_tt:0 "Поддержка групп:\n  Гарнизоны: §G+8§! £NAM_support_garr_texticon\n  Нефтяники: §G+4§! £NAM_support_oil_texticon\n  Наместники: §R-10§! £NAM_support_nam_texticon"
 NAM_rad_tribunals:0 "Революционные трибуналы"
 NAM_rad_tribunals_desc:0 "Приверженцы наместника ещё сидят в конторах и на складах. Военный совет требует именные списки, а в пустых кабинетах уже ставят столы для трибуналов. За дверью секретарь переписывает фамилии обвиняемых в полковые ведомости."
 NAM_rad_tribunals_tt:0 "Готовность к возвращению: §G+10§!."
 NAM_grp_rad_tribunals_tt:0 "Поддержка групп:\n  Наместники: §R-8§! £NAM_support_nam_texticon\n  Округа: §R-4§! £NAM_support_dist_texticon"
 NAM_rad_pact_of_pillars:0 "Договор столпов"
 NAM_rad_pact_of_pillars_desc:0 "Столпы собираются без свиты в тесной комнате над портом. Между ними лежит проект общего пакта. Никто не хочет первым отложить оружие, и секретарь делает вид, что не замечает этого."
 NAM_rad_pact_of_pillars_tt:0 "Добыча: §G+40§!."
 NAM_grp_rad_pact_of_pillars_tt:0 "Поддержка групп:\n  Нефтяники: §G+4§! £NAM_support_oil_texticon\n  Экспортные конторы: §G+4§! £NAM_support_trade_texticon"
 NAM_rad_war_council:0 "Военный совет столпов"
 NAM_rad_war_council_desc:0 "Решения о войне больше не ждут подписи наместника. Совет столпов заседает в штабе, и каждый его член отвечает за свой участок будущего фронта."
 NAM_rad_war_council_tt:0 "Готовность к возвращению: §G+5§!."
 NAM_rad_island_requisitions:0 "Реквизиции на островах"
 NAM_rad_island_requisitions_desc:0 "У складских ворот старшина столпов зачитывает распоряжение совета. Хозяин не выпускает из рук связку ключей. Писарь уже приготовил бланк расписки, но никак не может добиться подписи."
 NAM_grp_rad_island_requisitions_tt:0 "Поддержка групп:\n  Округа: §R-5§! £NAM_support_dist_texticon\n  Экспортные конторы: §R-3§! £NAM_support_trade_texticon"
 NAM_rad_great_war_plan:0 "План великой войны"
 NAM_rad_great_war_plan_desc:0 "Сардан, Рахма и Кадир встретят нас вместе. Совет принимает это: одна большая война лучше трёх малых, и после неё никто на Юге не посмеет нам отказать."
 # ----- After the return: the radicals strip the conquered south -----
 NAM_rad_spoils_of_return:0 "Трофеи возвращения"
 NAM_rad_spoils_of_return_desc:0 "У ворот захваченного склада столпы спорят о печатях на ящиках. Местный кладовщик держится в стороне и молчит. На пороге комендант раскладывает привезённые с островов описи."
 NAM_rad_labour_camps:0 "Трудовые лагеря"
 NAM_rad_labour_camps_desc:0 "Пленные и неблагонадёжные отработают свою вину на промыслах и в каменоломнях. Лагеря строят там, где нужны руки, а не там, где люди могут жить."
 NAM_grp_rad_labour_camps_tt:0 "Поддержка групп:\n  Гарнизоны: §G+4§! £NAM_support_garr_texticon\n  Округа: §R-6§! £NAM_support_dist_texticon"
 NAM_rad_garrison_rule:0 "Гарнизонное правление"
 NAM_rad_garrison_rule_desc:0 "Комендант прибывает в южный город с дорожным сундуком и полковыми писарями. В ратуше его ждут местные старшины. Ключи от помещений разложены на столе, но разговор начинается со списка отсутствующих."
 NAM_rad_deploy_command_post:0 "Комендатура: [FROM.GetName]"
 NAM_rad_deploy_command_post_desc:0 "Полковой интендант просит машины и имущество для постоянного склада. Первой работой команды станет дорога от склада к позициям полка."
 NAM_rad_deploy_command_post_unlock_tt:0 "После применения решения: создаёт дорогу и склад снабжения; размещённый гарнизон подавляет сопротивление."
 NAM_rad_command_post:0 "Полковая комендатура"
 NAM_rad_command_post_order_tt:0 "Действует приказ о гарнизонах."
 NAM_rad_command_post_staffed_tt:0 "Правительство независимо, а в области под нашим контролем размещена хотя бы одна наша дивизия."
 NAM_rad_command_post_cost:0 "§Y30§! £motorized_texticon §Y60§! £support_equipment_texticon"
 NAM_rad_command_post_cost_blocked:0 "§R30§! £motorized_texticon §R60§! £support_equipment_texticon"
 NAM_rad_command_post_cost_tooltip:0 "На оснащение комендатуры со склада уйдут §Y30§! £motorized_texticon и §Y60§! £support_equipment_texticon."
 NAM_grp_rad_garrison_rule_tt:0 "Поддержка групп:\n  Гарнизоны: §G+8§! £NAM_support_garr_texticon\n  Экспортные конторы: §R-4§! £NAM_support_trade_texticon"
 NAM_rad_extraction_trusts:0 "Добывающие тресты"
 NAM_rad_extraction_trusts_desc:0 "Промыслы побеждённых передаются трестам столпов. Тресты не строят школ и не чинят дорог - они качают нефть, пока она идёт."
 NAM_rad_has_conquered_state_tt:0 "Мы владеем хотя бы одним завоёванным округом, удерживаем его и управляем им напрямую."
 NAM_rad_extraction_trusts_tt:0 "До §Y3§! удерживаемых округов под прямым управлением получат по §G+2§! ед. нефти."
 NAM_grp_rad_extraction_trusts_tt:0 "Поддержка групп:\n  Нефтяники: §G+6§! £NAM_support_oil_texticon\n  Гарнизоны: §R-3§! £NAM_support_garr_texticon"
 NAM_rad_machines_to_islands:0 "Станки - в столицу"
 NAM_rad_machines_to_islands_desc:0 "Заводской мастер стоит у разобранного пресса, пока солдаты крепят детали на платформе. Он пытается объяснить, какие метки нельзя стирать. Начальник эшелона слушает, не выпуская часов из руки."
 NAM_rad_conquered_factory_tt:0 "В завоёванной области под нашим контролем и прямым управлением комендатуры есть гражданский завод"
 NAM_rad_machines_to_islands_tt:0 "Комендатуры вывезут по §R1§! £civ_factory гражданскому заводу из завоёванных областей под прямым управлением, не более чем из §Y2§! областей. В столице появится §G1§! военный завод за каждый вывезенный."
 NAM_rad_dominion_of_pillars:0 "Владычество столпов"
 NAM_rad_dominion_of_pillars_desc:0 "Хунта больше не называет себя временной. Столпы правят метрополией и её кладовой, и их власть держится на том, что было взято силой и силой же удерживается."
 NAM_grp_rad_dominion_of_pillars_tt:0 "Поддержка групп:\n  Гарнизоны: §G+6§! £NAM_support_garr_texticon\n  Нефтяники: §G+6§! £NAM_support_oil_texticon\n  Наместники: §R-10§! £NAM_support_nam_texticon\n  Округа: §R-10§! £NAM_support_dist_texticon"
 # ----- Exile humanists: Yaroslav Weber's government -----
 NAM_hum_veter_government:0 "Правительство Ярослава Вебера"
 NAM_hum_veter_government_desc:0 "Ярослав Вебер, вчерашний вожак подполья, возглавил правительство в изгнании. Его гуманисты обещают вернуть материк не как добычу, а как общий дом свободных округов."
 NAM_grp_hum_veter_government_tt:0 "Поддержка групп:\n  Округа: §G+8§! £NAM_support_dist_texticon\n  Наместники: §R-10§! £NAM_support_nam_texticon"
 NAM_hum_free_zones:0 "Свободные зоны"
 NAM_hum_free_zones_desc:0 "Вебер принимает делегацию иностранных предпринимателей в тесной портовой конторе. На стене ещё висит карта потерянного материка. Гости раскладывают бумаги так, чтобы не задеть её нижний край."
 NAM_hum_free_zones_tt:0 "Иностранный капитал: §G+30§!.\nВлияние корпораций: §Y+5§!."
 NAM_hum_open_doors:0 "Открытые двери"
 NAM_hum_open_doors_desc:0 "У приёмной правительства с утра ждут иностранные поверенные. Секретарь уже устал спрашивать названия компаний. На совете спорят, нужно ли выслушивать каждого, кто сумел добраться до островов."
 NAM_hum_open_doors_tt:0 "Иностранный капитал: §G+60§!.\nВлияние корпораций: §R+15§!.\nСвободные зоны: §G+1§! место (не больше §Y3§!)."
 NAM_hum_regulated_partnership:0 "Регулируемое партнёрство"
 NAM_hum_regulated_partnership_desc:0 "Депутаты задержались над проектом хартии до позднего вечера. Вебер слушает возражения юриста и представителя рабочих. На полях всё меньше свободного места, а чистовой экземпляр так и не начат."
 NAM_hum_regulated_partnership_tt:0 "Иностранный капитал: §G+25§!.\nВлияние корпораций: §G-10§!."
 NAM_hum_steel_exchange:0 "Стальная биржа"
 NAM_hum_steel_exchange_desc:0 "У островного причала торговцы спорят над образцами стали. Горняк поставил рядом с ними свою закопчённую лампу и ждёт, когда разговор дойдёт до людей, поднявших эту руду."
 NAM_hum_steel_exchange_tt:0 "Иностранный капитал: §G+20§!."
 NAM_hum_innovation_parks:0 "Парки инноваций"
 NAM_hum_innovation_parks_desc:0 "Иностранный инженер разбирает свой чертёж с островным мастером. Они не знают языка друг друга и показывают на детали карандашами. Вокруг стола собираются ученики, пытаясь угадать предмет спора."
 NAM_hum_innovation_parks_tt:0 "Влияние корпораций: §Y+5§!."
 NAM_hum_labour_bureau:0 "Бюро трудовых контрактов"
 NAM_hum_labour_bureau_desc:0 "Беженцам нужна работа, компаниям нужны руки. Бюро заключает контракты от имени правительства и следит, чтобы рабочие возвращались домой с деньгами."
 NAM_hum_labour_bureau_tt:0 "Иностранный капитал: §G+15§!."
 NAM_hum_union_contracts:0 "Профсоюзные договоры"
 NAM_hum_union_contracts_desc:0 "Делегаты рабочих пришли на переговоры с общим наказом. Поверенный компании пытается обратиться к каждому отдельно, но старший делегат снова кладёт перед ним один и тот же лист."
 NAM_hum_union_contracts_tt:0 "Иностранный капитал: §G+15§!.\nВлияние корпораций: §G-5§!."
 NAM_grp_hum_union_contracts_tt:0 "Поддержка групп:\n  Округа: §G+5§! £NAM_support_dist_texticon"
 NAM_hum_company_towns:0 "Посёлки компаний"
 NAM_hum_company_towns_desc:0 "В рабочем посёлке имя компании написано и над лавкой, и над проходной. Вечером у колонки обсуждают распоряжение управляющего. Даже здесь люди сначала оглядываются, прежде чем заговорить."
 NAM_hum_company_towns_tt:0 "Иностранный капитал: §G+50§!.\nВлияние корпораций: §R+10§!."
 NAM_hum_charter_harbours:0 "Гавани по хартиям"
 NAM_hum_charter_harbours_desc:0 "Судовладельцы привезли на острова старые планы причалов. Лоцманы спорят с ними о глубине у стенки, а городской представитель ищет на карте дорогу к рыбачьим домам."
 NAM_hum_charter_harbours_tt:0 "Свободные зоны: §G+1§! место (не больше §Y3§!).\nИностранный капитал: §G+20§!."
 NAM_hum_charter_commission:0 "Комиссия по хартиям"
 NAM_hum_charter_commission_desc:0 "Комиссия проверит каждую хартию: кто платит, кому и за что. Компаниям это не понравится, но правительство должно знать, сколько власти оно продало."
 NAM_hum_charter_commission_tt:0 "Влияние корпораций: §G-15§!."
 NAM_hum_board_of_governors:0 "Совет управляющих"
 NAM_hum_board_of_governors_desc:0 "Компании больше не просят - они управляют. Совет управляющих делит острова на участки, и каждым участком правит правление своей компании."
 NAM_hum_board_of_governors_tt:0 "Иностранный капитал: §G+80§!."
 NAM_grp_hum_board_of_governors_tt:0 "Поддержка групп:\n  Экспортные конторы: §G+8§! £NAM_support_trade_texticon\n  Округа: §R-6§! £NAM_support_dist_texticon"
 NAM_hum_company_guard:0 "Охрана компаний"
 NAM_hum_company_guard_desc:0 "У ворот совета стоят часовые с разными знаками компаний на форме. Начальник караула сверяет их фамилии с общим списком. О привычном порядке смены каждый рассказывает по-своему."
 NAM_hum_company_guard_tt:0 "Предел заказов морской пехоты: §G+1§! (не больше §Y3§!)."
 # ----- Exile humanists: the federal programme and the allies of the return -----
 NAM_hum_federal_programme:0 "Федеральная программа"
 NAM_hum_federal_programme_desc:0 "Вебер читает проект будущего союза перед депутатами изгнанных округов. Один из слушателей достаёт из кармана старую окружную печать. На её оттиск долго смотрят даже те, кто спорил с ним весь вечер."
 NAM_grp_hum_federal_programme_tt:0 "Поддержка групп:\n  Округа: §G+6§! £NAM_support_dist_texticon\n  Экспортные конторы: §G+2§! £NAM_support_trade_texticon"
 NAM_hum_appeal_to_nations:0 "Обращение к народам"
 NAM_hum_appeal_to_nations_desc:0 "Вебер обращается к Кефрейту, Стеландеру, Вейру и Шахрабаду: Светлогорье изгнано силой, но не отказалось ни от своей земли, ни от права жить на ней свободно."
 NAM_hum_split_coalition:0 "Раскол коалиции"
 NAM_hum_split_coalition_desc:0 "Через землячества Веберу передали письмо водителя, оставшегося на материке. В нём нет ни приветствия, ни подписи, только названия станций и вопросы о семье. Посредник уверен, что автору можно ответить."
 NAM_hum_split_coalition_tt:0 "Готовность к возвращению §G+5§!.\nПри первой операции возвращения перебежчики передадут нам четверть складского запаса винтовок и грузовиков страны, возглавившей вражескую коалицию (до §Y1000§! £infantry_equipment_texticon и §Y100§! £motorized_texticon)."
 NAM_hum_mainland_committees:0 "Комитеты на материке"
 NAM_hum_mainland_committees_desc:0 "В Южной гавани и на Северных промыслах собираются комитеты. Они печатают листовки, прячут оружие и готовят город к дню, когда с моря придут свои."
 NAM_hum_mainland_committees_tt:0 "Готовность к возвращению: §G+10§!."
 # ----- Exile humanists: the citizen army -----
 NAM_hum_citizen_army:0 "Гражданская армия"
 NAM_hum_citizen_army_desc:0 "Армия возвращения будет армией граждан: добровольцы округов, а не наёмники и не штрафные роты. Каждый знает, за что он идёт на берег."
 NAM_hum_citizen_army_tt:0 "Готовность к возвращению: §G+5§!."
 NAM_hum_credit_arms:0 "Оружие в кредит"
 NAM_hum_credit_arms_desc:0 "За столом переговоров инвестор рассматривает карту материка, а военный приёмщик - образец затвора. Оба приехали ради одного договора, но разговор каждый начинает со своего."
 NAM_hum_credit_arms_tt:0 "Влияние корпораций: §Y+5§!."
 NAM_hum_district_militia:0 "Ополчение округов"
 NAM_hum_district_militia_desc:0 "На плацу добровольцы собираются землячествами. Командир узнаёт в строю школьного учителя и соседа по довоенной улице. Прежде чем читать приказ, он спрашивает о тех, кто остался на материке."
 NAM_grp_hum_district_militia_tt:0 "Поддержка групп:\n  Округа: §G+5§! £NAM_support_dist_texticon"
 NAM_hum_hired_instructors:0 "Наёмные инструкторы"
 NAM_hum_hired_instructors_desc:0 "Приезжий офицер объясняет незнакомые ученикам условные знаки на карте. Переводчик едва успевает за рассказом о чужой войне. Ветераны островных гарнизонов слушают с задних скамеек."
 NAM_hum_hired_instructors_tt:0 "Влияние корпораций: §R+10§!."
 NAM_hum_marine_contracts:0 "Контракты на морскую пехоту"
 NAM_hum_marine_contracts_desc:0 "В кабинетах инвесторов изучают сметы, на береговых полигонах - очертания материка. Правительству предстоит связать деловые интересы компаний с надеждами людей, для которых возвращение домой не имеет цены."
 NAM_hum_landing_rehearsals:0 "Учения на зафрахтованных судах"
 NAM_hum_landing_rehearsals_desc:0 "Компании сдают нам в аренду свои суда. На них морская пехота отработает высадку столько раз, сколько потребуется."
 NAM_hum_landing_rehearsals_tt:0 "Предел заказов морской пехоты: §G+1§! (не больше §Y3§!).\nГотовность к возвращению: §G+10§!."
 NAM_hum_army_of_citizens:0 "Армия граждан"
 NAM_hum_army_of_citizens_desc:0 "Полки сформированы, морская пехота обучена, оружие оплачено. Армия граждан готова вернуть материк его жителям."
 NAM_hum_army_of_citizens_tt:0 "Готовность к возвращению: §G+15§!."
 NAM_hum_return_manifesto:0 "Манифест возвращения"
 NAM_hum_return_manifesto_desc:0 "Вебер обещает освобождённым землям не трибуналы и не лагеря, а места в союзном совете. Манифест прочтут в каждом округе на островах и на материке, прежде чем начнётся высадка."
 NAM_hum_return_manifesto_tt:0 "Готовность к возвращению: §G+5§!."
 # ----- After the return: the humanists build a federal union -----
 NAM_hum_federal_districts:0 "Федеральные округа"
 NAM_hum_federal_districts_desc:0 "Делегаты Эфлора и Ажара впервые входят в зал союзного совета. Перед ними лежат таблички с названиями родных округов. Вебер ждёт, пока переводчик закончит приветствие."
 NAM_hum_federal_districts_tt:0 "Каждый федеральный округ: стабильность §G+5%§! £stability_texticon."
 NAM_hum_has_federal_district_tt:0 "У нас есть хотя бы один федеральный округ"
 NAM_hum_union_council:0 "Союзный совет"
 NAM_hum_union_council_desc:0 "Представители всех округов собираются на первую сессию союзного совета. Здесь будут делить бюджет, заказы и спорные земли - словами, а не оружием."
 NAM_grp_hum_union_council_tt:0 "Поддержка групп:\n  Округа: §G+6§! £NAM_support_dist_texticon"
 NAM_hum_union_roads:0 "Союзные дороги"
 NAM_hum_union_roads_desc:0 "У окружной границы встречаются дорожные мастера с разными картами одного перевала. До вечера они обходят старые вешки. Ночевать обе артели остаются у одного костра."
 NAM_hum_union_roads_tt:0 "В собственной контролируемой столице каждого действующего федерального округа: инфраструктура §G+1§! £infrastructure_texticon, гражданский завод §G+1§!.\nЗакрепление власти: §G+5§!."
 NAM_hum_board_districts:0 "Округа под правлениями"
 NAM_hum_board_districts_desc:0 "У прибывшего на материк управляющего целый чемодан новых бланков. В окружной канцелярии для него освобождают стол, но старый писарь не спешит убирать свою печать."
 NAM_hum_board_districts_tt:0 "В подконтрольной столице каждого действующего федерального округа, где есть место, строится §G1§! военный завод.\nИностранный капитал: §G+60§!."
 NAM_hum_districts_charter:0 "Хартия равных округов"
 NAM_hum_districts_charter_desc:0 "Ни один округ не стоит выше другого, даже метрополия. Хартия гарантирует округам самоуправление, а союзу - их добровольную верность."
 NAM_hum_districts_charter_tt:0 "Каждый федеральный округ: стабильность §G+10%§! £stability_texticon.\nЗакрепление власти: §G+15§!.\nПри объявлении великой войны союз призовёт из мирных округов только подписавших федеральный договор. Заключите договор отдельно с каждым из выбранных округов."
 NAM_grp_hum_districts_charter_tt:0 "Поддержка групп:\n  Округа: §G+8§! £NAM_support_dist_texticon"
 NAM_hum_metropole_charter:0 "Хартия метрополии"
 NAM_hum_metropole_charter_desc:0 "Союзу нужен центр, способный принимать решения. Хартия метрополии оставляет округам их советы, но последнее слово всегда за правительством Светлогорья."
 NAM_hum_metropole_charter_tt:0 "Каждый федеральный округ: стабильность §R-5%§! £stability_texticon.\nЗакрепление власти: §G+10§!.\nПри объявлении великой войны столица призовёт все действующие мирные округа независимо от подписанных ими договоров."
 NAM_grp_hum_metropole_charter_tt:0 "Поддержка групп:\n  Округа: §R-4§! £NAM_support_dist_texticon\n  Экспортные конторы: §G+4§! £NAM_support_trade_texticon"
 NAM_hum_union_constitution:0 "Конституция Союза"
 NAM_hum_union_constitution_desc:0 "Союзный совет принимает конституцию. Светлогорье больше не наместничество и не государство в изгнании, а союз, который сам выбрал свою форму."
 NAM_grp_hum_union_constitution_tt:0 "Поддержка групп:\n  Округа: §G+6§! £NAM_support_dist_texticon\n  Наместники: §R-6§! £NAM_support_nam_texticon"
 # ----- Defeat tree: shared exile keys (round 2) -----
 NAM_consolidation_5_tt:0 "Закрепление власти: §G+5§!."
 NAM_great_war_ready_tt:0 "Великая война может начаться"
 NAM_great_war_won_tt:0 "Великая война выиграна"
 NAM_great_war_start_tt:0 "§YБольшая война§! начнётся против оставшихся южных противников.\nНаши подданные и союзники в коалицию против нас не войдут.\nПобеда подчинит участников коалиции Светлогорью на условиях нашего курса.\nПри капитуляции Светлогорье будет присоединено победителем."
 # ----- Exile radicals: the return (renamed) -----
 NAM_rad_enemy_lists:0 "Списки двух столиц"
 NAM_rad_enemy_lists_desc:0 "Эфлор и Ажар разделили наш материк. В обеих столицах у нас будут свои люди: слухи, поджоги и списки тех, кто ответит первым."
 NAM_rad_enemy_lists_tt:0 "Готовность к возвращению: §G+10§!."
 # ----- Radicals: holding the reconquered lands -----
 NAM_rad_spoils_of_return_tt:0 "Закрепление власти: §G+5§!."
 NAM_rad_labour_camps_tt:0 "Закрепление власти: §G+5§!."
 NAM_rad_martial_law:0 "Военное положение"
 NAM_rad_martial_law_desc:0 "На отвоёванных землях действует военное положение: комендантский час, пропуска и расстрел за оружие в доме. Порядок здесь будет держаться на страхе, пока не начнёт держаться на привычке."
 NAM_rad_martial_law_tt:0 "Закрепление власти: §G+10§!."
 NAM_rad_oil_seizure:0 "Изъятие промыслов"
 NAM_rad_oil_seizure_desc:0 "На промысле меняют табличку у конторы. Старший буровой смены узнаёт вернувшегося управляющего и прячет лицо за воротником. Внутри ещё пахнет табаком прежнего хозяина."
 NAM_rad_oil_seizure_tt:0 "Пропускная способность промыслов: §G+1§! единица."
 NAM_rad_garrison_belt:0 "Пояс гарнизонов"
 NAM_rad_garrison_belt_desc:0 "У развилки командир патруля допрашивает возчика о ночных огнях. Дежурный у насосной станции слышал ту же историю, но назвал другую дорогу. На общей карте появляются противоречащие друг другу отметки."
 NAM_rad_garrison_belt_tt:0 "Закрепление власти: §G+10§!."
 NAM_grp_rad_garrison_belt_tt:0 "Поддержка групп:\n  Гарнизоны: §G+5§! £NAM_support_garr_texticon"
 NAM_rad_hostage_system:0 "Заложники от каждого посёлка"
 NAM_rad_hostage_system_desc:0 "В комендатуре зачитывают список жителей, вызванных по приказу совета. Их родственники ждут за оградой. Писарь спрашивает возраст и занятие каждого, не поднимая глаз."
 NAM_rad_collaborator_councils:0 "Советы послушных"
 NAM_rad_collaborator_councils_desc:0 "Старые писари наместников и местные богачи готовы служить любой власти. Пусть управляют посёлками от нашего имени и отвечают за них головой."
 NAM_rad_field_tribunals:0 "Полевые трибуналы"
 NAM_rad_field_tribunals_desc:0 "Трибуналы идут вслед за войсками. Тот, кто служил Эфлору или Ажару, ответит перед ними в тот же день."
 NAM_rad_field_tribunals_tt:0 "Закрепление власти: §G+10§!."
 NAM_rad_pacification:0 "Умиротворение"
 NAM_rad_pacification_desc:0 "Отвоёванные земли молчат. Это не мир и не согласие."
 NAM_rad_pacification_tt:0 "Закрепление власти: §G+15§!."
 # ----- Radicals: preparing the great war -----
 NAM_rad_three_capitals:0 "Списки трёх столиц"
 NAM_rad_three_capitals_desc:0 "Сардан, Рахма и Кадир следующие. Наши люди уже в их столицах: они знают склады, мосты и имена тех, кто будет сопротивляться."
 NAM_rad_penal_legions:0 "Штрафные легионы"
 NAM_rad_penal_legions_desc:0 "Из лагерей и тюрем наберём легионы, которым нечего терять. Они пойдут в первой волне, и никто не спросит, сколько из них вернётся."
 NAM_rad_plunder_economy:0 "Хозяйство трофеев"
 NAM_rad_plunder_economy_desc:0 "Интенданты сравнивают описи эфлорских и ажарских складов. Книги ведутся по разным правилам, а печати части контор давно потеряны. Часовой не пускает во двор прежних владельцев."
 # ----- Radicals: after the great war -----
 NAM_rad_southern_tribute:0 "Дань Юга"
 NAM_rad_southern_tribute_desc:0 "С юга приходят описи зернохранилищ, пекарен и обозных дворов. Столпы отдают списки полковым интендантам. Отныне местным торговцам придётся кормить и тех, кто привёл их города к покорности."
 NAM_rad_garrison_requisition:0 "Реквизировать склады для гарнизона"
 NAM_rad_garrison_requisition_desc:0 "Комендант велит свезти муку и фураж на рыночный двор. Весы переходят к полковым интендантам, а хозяевам мастерских придётся отпустить подводы вместе с возчиками."
 NAM_rad_garrison_requisition_unlock_tt:0 "После применения решения: временно улучшает местное снабжение ценой работы гражданских фабрик завоёванного округа."
 NAM_rad_requisition_district_tt:0 "Независимое Светлогорье владеет областью, контролирует её и напрямую управляет хотя бы одной гражданской фабрикой."
 NAM_rad_requisitioned_market:0 "Склады переданы гарнизону"
 NAM_rad_kadir_requisition_tt:0 "Пока склады Кадира снабжают гарнизон, пошлины с местной и сквозной торговли не поступают."
 NAM_rad_basiran_requisition_tt:0 "Пока склады Басирана снабжают гарнизон, Кадир может взимать пошлины только с местной торговли."
 NAM_rad_sardan_levies:0 "Рекруты Сардана"
 NAM_rad_sardan_levy_site_tt:0 "Мы удерживаем хотя бы один сарданский округ под прямым управлением."
 NAM_rad_sardan_levies_tt:0 "Каждый удерживаемый сарданский округ под прямым управлением выставит §G500§! £manpower_texticon. Сопротивление в нём вырастет на §R5§! п."
 NAM_rad_sardan_levies_desc:0 "Сарданские посёлки обязаны выставлять рекрутов. Они будут служить далеко от дома, где им некуда бежать."
 NAM_grp_rad_sardan_levies_tt:0 "Поддержка групп:\n  Гарнизоны: §G+3§! £NAM_support_garr_texticon"
 NAM_rad_kadir_tolls:0 "Пошлины караванов Кадира"
 NAM_rad_kadir_tolls_desc:0 "Караванные пути Кадира идут теперь через наши заставы. Каждый вьюк платит пошлину столпам."
 NAM_rad_kadir_tolls_tt:0 "Каждый месяц рынок Кадира приносит §G20§! £ADISCORD_economy_treasury_texticon.\nЕсли открыты рынок Басирана и вся дорога между городами, сбор вырастает до §G50§! £ADISCORD_economy_treasury_texticon.\nДля каждого рынка нужны владение областью, контроль города и области, гражданская фабрика и инфраструктура не ниже §Y2§! £infrastructure_texticon.\nРеквизиция для гарнизона закрывает соответствующий рынок на срок её действия.\nПри подчинении Светлогорья сбор прекращается."
 NAM_rad_army_of_dominion:0 "Армия владычества"
 NAM_rad_army_of_dominion_desc:0 "Офицеры победивших полков всё реже говорят о возвращении на острова. В комендатурах рядом с картами фронта появляются планы садов и усадеб. Старые походные сундуки остаются нераспакованными."
 NAM_rad_rakhma_wells:0 "Колодцы Рахмы"
 NAM_rad_rakhma_wells_desc:0 "Старейшины Лиги колодцев принесли в комендатуру старые записи. Офицер столпов не понимает местных названий и требует переводчика. За дверью ждут люди, которым сегодня снова не досталось воды."
 NAM_rad_rakhma_site_tt:0 "Мы владеем нефтяными скважинами в регионе $STATE_255$, контролируем их и управляем округом напрямую."
 NAM_grp_rad_rakhma_wells_tt:0 "Поддержка групп:\n  Нефтяники: §G+4§! £NAM_support_oil_texticon"
 NAM_rad_pillar_estates:0 "Поместья столпов"
 NAM_rad_pillar_estates_desc:0 "Лучшие земли Юга достаются командирам и старшинам столпов. Каждый из них теперь не только генерал, но и хозяин."
 NAM_grp_rad_pillar_estates_tt:0 "Поддержка групп:\n  Гарнизоны: §G+5§! £NAM_support_garr_texticon\n  Нефтяники: §G+5§! £NAM_support_oil_texticon\n  Экспортные конторы: §G+3§! £NAM_support_trade_texticon\n  Округа: §R-8§! £NAM_support_dist_texticon"
 # ----- Humanists: federating the reconquered lands -----
 NAM_hum_union_council_tt:0 "Закрепление власти: §G+5§!."
 NAM_hum_federal_treaties:0 "Федеративные договоры"
 NAM_hum_federal_treaties_desc:0 "С каждым округом заключается свой договор: что он решает сам, что передаёт союзу и чем союз отвечает ему. Подписанный договор держит лучше гарнизона."
 NAM_hum_federal_treaties_tt:0 "Закрепление власти: §G+15§!."
 NAM_grp_hum_federal_treaties_tt:0 "Поддержка групп:\n  Округа: §G+4§! £NAM_support_dist_texticon"
 NAM_hum_harbour_rebuilding:0 "Восстановление гавани"
 NAM_hum_harbour_rebuilding_desc:0 "В Южной гавани жители разбирают обгоревшие балки у своих домов. Инженеры слушают рассказы о довоенных улицах и сверяют их со старым планом. На полях появляются имена людей, которых ещё надеются найти."
 NAM_hum_harbour_rebuilding_tt:0 "Закрепление власти: §G+10§!.\nВлияние корпораций: §Y+5§!."
 NAM_hum_truth_commission:0 "Комиссия правды"
 NAM_hum_truth_commission_desc:0 "Вместо трибуналов - комиссия правды. Кто служил Эфлору или Ажару, расскажет об этом открыто и получит амнистию; кто совершал преступления, ответит перед судом."
 NAM_hum_truth_commission_tt:0 "Закрепление власти: §G+10§!."
 NAM_grp_hum_truth_commission_tt:0 "Поддержка групп:\n  Округа: §G+4§! £NAM_support_dist_texticon"
 NAM_hum_district_police:0 "Окружная полиция"
 NAM_hum_district_police_desc:0 "Порядок в округах держат не солдаты, а полиция, набранная из местных жителей и подчинённая окружным советам."
 NAM_hum_district_police_tt:0 "Закрепление власти: §G+10§!."
 NAM_hum_union_accepted:0 "Союз принят"
 NAM_hum_union_accepted_desc:0 "На заседании союзного совета эфлорский делегат впервые обращается к соседу по имени. Ажарский секретарь перестаёт переводить каждую реплику. После перерыва разговор продолжается в коридоре."
 NAM_hum_union_accepted_tt:0 "Закрепление власти: §G+15§!."
 # ----- Humanists: preparing the great war -----
 NAM_hum_southern_offer:0 "Предложение Югу"
 NAM_hum_southern_offer_desc:0 "Делегация просит у Вебера верительные грамоты. На юге ещё есть правительства, с которыми можно говорить о присоединении. В федеральных округах от совета ждут другого ответа: когда в город вернутся мастерские и работа."
 NAM_hum_southern_assembly_tt:0 "Закрепление власти: §G+5§! за утверждение переговорного мандата."
 NAM_hum_send_southern_mandate:0 "Направить союзную делегацию - [FROM.GetName]"
 NAM_hum_send_southern_mandate_desc:0 "В порт доставили два проекта соглашения. Один оставляет место для печати нового члена федерации, другой - для подписи окружной управы под подрядом на строительство мастерских."
 NAM_hum_send_southern_mandate_unlock_tt:0 "После применения решения: предложить мирное вступление самостоятельному соседу или строительство фабрики федеральному округу. До союзного призыва можно направить одну делегацию."
 NAM_hum_southern_recipient_tt:0 "Для вступления требуется мирная внеблоковая страна без подданных, удерживающая столицу.\nЕщё одна независимая южная держава должна оставаться противником.\nДля стройки нужен федеральный округ, который удерживает столицу со свободным местом под фабрику."
 NAM_hum_southern_funding_tt:0 "В казне Светлогорья есть §Y300§! £ADISCORD_economy_treasury_texticon. Средства потребуются при подписании."
 NAM_hum_southern_accession_tt:0 "При согласии страна станет федеральным округом, подпишет договор об участии в великой войне и получит от Светлогорья §Y300§! £ADISCORD_economy_treasury_texticon.\nОтвет ждут §Y7§! £time_texticon.\nОтказ или истечение мандата закрывает переговоры без оплаты."
 NAM_hum_southern_workshop_tt:0 "При согласии в столице округа появится §G1§! £civ_factory за §Y300§! £ADISCORD_economy_treasury_texticon Светлогорья.\nОтвет ждут §Y7§! £time_texticon.\nОтказ или истечение мандата закрывает переговоры без оплаты."
 NAM_hum_accession_reply_tt:0 "Мы станем федеральным округом Светлогорья и получим от него §G300§! £ADISCORD_economy_treasury_texticon.\nЕсли мы сохраним мир и свою столицу, то при общем призыве вступим в великую войну на стороне союза."
 NAM_hum_workshop_reply_tt:0 "Светлогорье оплатит §G1§! £civ_factory в нашей столице."
 ADISCORD_nam_resource_war.113.t:0 "Делегация Светлогорья"
 ADISCORD_nam_resource_war.113.d:0 "Посланники Вебера положили на стол проект договора о вступлении. Наш совет сохранит местное управление, но внешняя политика и часть заводов перейдут в ведение Светлогорья. К договору приложено казначейское обязательство на обустройство округа. Подписать оба документа предлагают до созыва союзной армии."
 ADISCORD_nam_resource_war.113.d_partner:0 "Делегация из Светлогорья привезла план гражданских мастерских и письмо казначейства. Смету оплатит союз, если окружная управа отведёт участок в столице. Местным подрядчикам уже показали чертежи. Осталось решение управы."
 ADISCORD_nam_resource_war.113.d_expired:0 "Посланники получили новое распоряжение. Прежние верительные грамоты утратили силу, и договор вернулся в канцелярию без подписей."
 ADISCORD_nam_resource_war.113.a:0 "Вернуть договор без подписи."
 ADISCORD_nam_resource_war.113.b:0 "Подписать договор о вступлении."
 ADISCORD_nam_resource_war.113.c:0 "Отвести участок для мастерских."
 ADISCORD_nam_resource_war.113.close:0 "Закрыть переговоры."
 ADISCORD_nam_resource_war.114.t:0 "Соглашение подписано"
 ADISCORD_nam_resource_war.114.d:0 "Делегация вернулась из страны [From.GetName] с подписанным договором. Казначейство получило заверенный экземпляр, и открыто финансирование по соглашению."
 ADISCORD_nam_resource_war.114.a:0 "Принять ратификационную грамоту."
 ADISCORD_nam_resource_war.115.t:0 "Договор остался без подписи"
 ADISCORD_nam_resource_war.115.d:0 "Делегация сообщила, что правительство страны [From.GetName] вернуло договор без подписи. Казначейство закрыло дело, а делегаты передали свои полномочия обратно совету."
 ADISCORD_nam_resource_war.115.a:0 "Принять доклад."
 NAM_hum_federal_army:0 "Федеральная армия"
 NAM_hum_federal_army_desc:0 "Округа выставляют свои полки в общую армию союза. Эфлорские и ажарские роты пойдут в бой рядом со светлогорскими."
 NAM_hum_government_tt:0 "Светлогорье независимо, у власти федеральное правительство гуманистов."
 NAM_hum_federal_muster_tt:0 "Из §Y8000§! £manpower_texticon половина сформирует в столице федеральный стрелковый полк из четырёх батальонов, остальные останутся в резерве.\nЕсли столицу нельзя использовать или одноимённый штат уже существует, весь набор поступит в резерв.\nСветлогорье и его нынешние и будущие федеральные округа получат штат \"Federal Rifle Regiment\" для обычного набора."
 NAM_hum_union_war_bonds:0 "Военный заём союза"
 NAM_hum_union_war_bonds_desc:0 "Союз выпускает облигации, и компании раскупают их первыми. Оружие для великой войны будет куплено в долг."
 NAM_hum_union_war_bonds_tt:0 "Влияние корпораций: §Y+5§!."
 NAM_hum_union_call:0 "Призыв союза"
 NAM_hum_union_call_tt:0 "Когда Светлогорье объявит великую войну, призванные по хартии округа вступят в неё на нашей стороне. Округ должен держать свою столицу, жить в мире и быть свободным от постороннего альянса."
 NAM_hum_union_call_desc:0 "Союзный совет объявляет: Юг будет свободен от правителей, которые делили его как добычу. Каждый округ союза посылает своих людей."
 # ----- Humanists: after the great war -----
 NAM_hum_southern_districts:0 "Новые округа Юга"
 NAM_hum_southern_districts_desc:0 "Сардан, Рахма и Кадир становятся федеральными округами. Союз протянулся от островов до пустыни."
 NAM_grp_hum_southern_districts_tt:0 "Поддержка групп:\n  Округа: §G+4§! £NAM_support_dist_texticon"
 NAM_hum_dry_river_works:0 "Работы на Сухой реке"
 NAM_hum_dry_river_works_desc:0 "Сардан живёт у реки, которая течёт лишь весной. Союз строит в его столице дороги и мастерские, чтобы округ жил не только ожиданием воды."
 NAM_hum_dry_river_works_tt:0 "Если §YСардан§! остаётся нашим федеральным округом: его стабильность §G+5%§! £stability_texticon; в его собственной контролируемой столице инфраструктура §G+1§! £infrastructure_texticon и гражданский завод §G+1§!."
 NAM_hum_water_compact:0 "Водный договор"
 NAM_hum_water_compact_desc:0 "Лига колодцев Рахмы сохранит своё право делить воду, но будет делить её по договору, общему для всего союза."
 NAM_hum_water_compact_tt:0 "Если §YРахма§! остаётся нашим федеральным округом: её стабильность §G+10%§! £stability_texticon; в её собственной контролируемой столице инфраструктура §G+1§! £infrastructure_texticon."
 NAM_hum_union_parliament:0 "Союзный парламент"
 NAM_hum_union_parliament_desc:0 "Совет союза становится парламентом: депутатов выбирают в каждом округе, от островов до караванных городов."
 NAM_grp_hum_union_parliament_tt:0 "Поддержка групп:\n  Округа: §G+6§! £NAM_support_dist_texticon"
 NAM_hum_collect_market_freight:0 "Собрать обратный груз округов"
 NAM_hum_collect_market_freight_desc:0 "В Южной гавани диспетчер слушает донесения с южных рынков. Караванщики по-разному называют одну и ту же станцию. Писарь рисует на полях накладной приметную водонапорную башню."
 NAM_hum_collect_market_freight_unlock_tt:0 "После применения решения: собирает доступные партии снаряжения поддержки с окружных рынков для Светлогорья."
 NAM_hum_market_federation_tt:0 "Караваны могут закупать детали и на рынках с инфраструктурой §Y5§! £infrastructure_texticon. При единой валюте заказ в окружной мастерской может использовать местную партию для изготовления §G15§! £ADISCORD_artillery_texticon."
 NAM_hum_market_convoy_ready_tt:0 "Со времени последнего сборного рейса прошло §Y30§! £time_texticon, либо это первый рейс."
 NAM_hum_market_stock_tt:0 "Хотя бы на одном рынке под контролем своего федерального округа есть свободная партия.\n$STATE_69$ [69.NAMHumanistMarketStock]\n$STATE_701$ [701.NAMHumanistMarketStock]\n$STATE_260$ [260.NAMHumanistMarketStock]\n$STATE_253$ [253.NAMHumanistMarketStock]\n$STATE_241$ [241.NAMHumanistMarketStock]"
 NAM_hum_market_lots_ready:0 "§G[?NAM_hum_market_lots|0]§! на складе"
 NAM_hum_market_lots_empty:0 "склад пуст"
 NAM_hum_market_lots_closed:0 "§g[?NAM_hum_market_lots|0] на складе, рынок недоступен§!"
 NAM_hum_market_convoy_result_tt:0 "Каждый доступный рынок отдаст §Y1§! свободную партию. На склады Светлогорья поступит по §G40§! £support_equipment_texticon за каждую. Остаток хранится в соответствующем округе."
 NAM_hum_caravan_road_improvement_tt:0 "Инфраструктура рынка улучшится на §G1§!."
 NAM_hum_market_gun_order_tt:0 "Мастерская зарезервирует §Y1§! местную партию деталей и дополнительно изготовит §G15§! £ADISCORD_artillery_texticon для Светлогорья. При отмене детали вернутся на этот склад."
 NAM_hum_market_gun_delivery_tt:0 "Из зарезервированных деталей мастерская дополнительно передаст Светлогорью §G15§! £ADISCORD_artillery_texticon."
 NAM_hum_establish_caravan_depot:0 "Снарядить караван для окружного рынка"
 NAM_hum_establish_caravan_depot_desc:0 "От гавани до окружного рынка груз следует с одной накладной. На последнем перегоне в дело вступают местные возчики: им нужны машины и место, где можно разгрузиться после дождя."
 NAM_hum_establish_caravan_depot_unlock_tt:0 "После применения решения: передаёт округу транспорт, закупает рыночную партию и улучшает местные дороги."
 NAM_hum_establish_caravan_depot_result_tt:0 "Владелец области [FROM.GetName] получит §G60§! £motorized_texticon со складов Светлогорья.\nИз средств каравана оплачивается §Y1§! партия деталей, которая останется на местном складе.\nСвободных партий до рейса: §Y[?FROM.NAM_hum_market_lots|0]§!."
 NAM_hum_caravan_road_tt:0 "Светлогорье владеет четырьмя областями прибрежной магистрали и контролирует все её перегоны: $STATE_688$, $STATE_690$, $STATE_689$, $STATE_700$."
 NAM_hum_caravan_site_tt:0 "Инфраструктура рынка ниже §Y5§! либо действует общий рынок, разрешающий рейсы по готовой дороге."
 NAM_hum_caravan_cost:0 "§Y250§! £ADISCORD_economy_treasury_texticon §Y60§! £motorized_texticon"
 NAM_hum_caravan_cost_blocked:0 "§R250§! £ADISCORD_economy_treasury_texticon §R60§! £motorized_texticon"
 NAM_hum_caravan_cost_tooltip:0 "Казна Светлогорья выделяет §Y250§! £ADISCORD_economy_treasury_texticon на закупку деталей и устройство перевалочного двора. Округ получает §Y60§! £motorized_texticon со складов Светлогорья."
 NAM_hum_place_union_order:0 "Разместить заказ в окружных мастерских"
 NAM_hum_place_union_order_desc:0 "Мастера раньше требовали задаток в монете своего округа, а казначейство принимало счета только в светлогорской. Теперь расчётная палата может поставить одну печать на заказ и на расписку о приёмке."
 NAM_hum_place_union_order_unlock_tt:0 "После применения решения: закупает снаряжение поддержки для Светлогорья и оплачивает работу окружных мастерских."
 NAM_hum_union_order_site_tt:0 "В области есть военный завод, и мастерские свободны от предыдущего союзного заказа."
 NAM_hum_place_union_order_result_tt:0 "Резервируется §Y300§! £ADISCORD_economy_treasury_texticon на §Y35§! £time_texticon. $NAM_hum_union_order_delivery_tt$ При отмене задаток возвращается Светлогорью полностью."
 NAM_hum_union_order_delivery_tt:0 "Светлогорье получит §G120§! £support_equipment_texticon. Из задатка §G180§! £ADISCORD_economy_treasury_texticon перечисляются в казну округа, §Y120§! £ADISCORD_economy_treasury_texticon оплачивают изготовление."
 NAM_hum_union_order_refund_tt:0 "Задаток возвращается в казну Светлогорья: §G300§! £ADISCORD_economy_treasury_texticon. Если мастерская резервировала детали, партия освобождается на исходном рынке."
 NAM_hum_caravan_charter:0 "Хартия караванов"
 NAM_hum_caravan_charter_desc:0 "Диспетчеры округов раскладывают на столе накладные одного каравана. У каждой конторы свой бланк и свои названия остановок. Возчик из Кадира исправляет отметку у давно пересохшего колодца."
 NAM_hum_union_university:0 "Союзный университет"
 NAM_hum_union_university_desc:0 "Студенты из всех округов учатся в одном университете. Через поколение у союза будут инженеры, которым не нужно объяснять, зачем он нужен."
 NAM_hum_union_currency:0 "Союзная валюта"
 NAM_hum_union_currency_desc:0 "Окружные казначеи привезли в парламент образцы монет и стопку неоплаченных счетов. Мастерские возьмутся за союзные заказы, когда печать на договоре будет стоить одинаково по обе стороны границы."
 NAM_hum_union_currency_tt:0 "Каждый федеральный округ: стабильность §G+5%§! £stability_texticon."
 NAM_hum_union_army:0 "Союзная армия"
 NAM_hum_union_army_desc:0 "На общем смотре полковые оркестры сначала играют каждый свой марш. Штабной офицер просит дирижёров подойти к трибуне. В строю солдаты прислушиваются к незнакомым командам соседнего полка."
 NAM_hum_union_brigades_tt:0 "Светлогорье и его нынешние и будущие федеральные округа смогут набирать общевойсковые бригады или переводить в них существующие полки.\nВ штат \"Union Combined Arms Brigade\" входят шесть пехотных батальонов, артиллерийский дивизион и сапёрная рота."
 NAM_hum_common_market:0 "Общий рынок"
 NAM_hum_common_market_desc:0 "Кладовщики в окружных городах уже складывают детали по караванным накладным. Теперь печать Рахмы признают в Южной гавани, а сводная ведомость показывает, какой груз ждёт отправки и какой уже обещан оружейникам."
 NAM_grp_hum_common_market_tt:0 "Поддержка групп:\n  Экспортные конторы: §G+6§! £NAM_support_trade_texticon"
 # ----- Exile humanists: the corporate boards -----
 NAM_board_governing_tt:0 "Правления управляют независимым Светлогорьем."
 NAM_board_district_office_tt:0 "Хотя бы один наш федеральный округ управляет своей столицей."
 NAM_board_factory_site_tt:0 "В столице округа есть место под военный завод."
 NAM_board_eflor_terminal_tt:0 "Эфлор владеет и управляет областью $STATE_701$."
 NAM_board_efl_district_tt:0 "§YЭфлор§! подчиняется Светлогорью как федеральный округ, сохраняет свою столицу и может заключить договор без открытого спора."
 NAM_board_azh_district_tt:0 "§YАжар§! подчиняется Светлогорью как федеральный округ, сохраняет свою столицу и может заключить договор без открытого спора."
 NAM_board_constitution:0 "Устав правлений"
 NAM_board_constitution_desc:0 "Правления компаний пишут для Светлогорья устав, похожий на устав акционерного общества: голосует капитал, споры решает совет управляющих."
 NAM_board_corporate_courts:0 "Суды компаний"
 NAM_board_corporate_courts_desc:0 "Споры о земле, найме и долгах решают суды компаний. Они быстры, неподкупны для чужих и всегда помнят, кто им платит."
 NAM_board_corporate_courts_tt:0 "Закрепление власти §G+10§!. В арбитраже министры Вебера сохраняют концессию за владельцем, управляющие компаний передают её претенденту. Суд защищает округ от новых исков на §Y180§! £time_texticon дн."
 NAM_board_shareholders:0 "Собрание акционеров"
 NAM_board_shareholders_desc:0 "Раз в год акционеры собираются, чтобы продлить или отозвать хартии компаний. Голос каждого весит столько, сколько стоят его акции."
 NAM_board_shareholders_tt:0 "Иностранный капитал: §G+40§!."
 NAM_board_district_auction:0 "Торги за округа"
 NAM_board_district_auction_desc:0 "В зал торгов внесли карты материковых округов. Председатель просит тишины, но представители компаний продолжают переговариваться через проход. У стены окружные делегаты ждут, когда назовут их город."
 NAM_board_eflor_oil:0 "Эфлор - концерну \"Лорэн\""
 NAM_board_eflor_oil_desc:0 "Инженер нефтяного концерна разворачивает карту Эфлора. На ней красным обведены старые буровые дороги. Местный мастер сразу замечает, что составитель ни разу не бывал здесь в сезон дождей."
 NAM_board_eflor_oil_tt:0 "Хозяин §YЭфлора§!: §Yконцерн \"Лорэн\"§!.\nПропускная способность промыслов: §G+1§!, пока Средний Лорен принадлежит округу и концессией бесспорно владеет концерн.\nИностранный капитал: §G+40§!."
 NAM_board_eflor_steel:0 "Эфлор - тресту \"Феррант\""
 NAM_board_eflor_steel_desc:0 "Представители стального треста осматривают эфлорские цеха. У погасшей печи их встречает старший смены с образцом последней плавки. Он начинает разговор не с договора, а с трещины в кладке."
 NAM_board_eflor_steel_tt:0 "Хозяин §YЭфлора§!: §Yтрест \"Феррант\"§!.\nСтолица Эфлора: военный завод §G+1§!.\nИностранный капитал: §G+40§!."
 NAM_board_azhar_shipping:0 "Ажар - пароходству \"Навис\""
 NAM_board_azhar_shipping_desc:0 "Капитаны Навис впервые собираются в ажарской лоцманской. На стене висит чужая таблица приливов, а местные проводники упорно называют пристани по-старому. Секретарь записывает оба названия."
 NAM_board_azhar_shipping_tt:0 "Хозяин §YАжара§!: §Yпароходство \"Навис\"§!.\nИностранный капитал: §G+40§!."
 NAM_board_azhar_bank:0 "Ажар - банку \"Рейдбанк\""
 NAM_board_azhar_bank_desc:0 "Поверенные Рейдбанка разбирают ажарские долговые книги. Между расписками лежат письма купцов, просивших отсрочку ещё до войны. На полях незнакомый чиновник оставил множество резких замечаний."
 NAM_board_azhar_bank_tt:0 "Хозяин §YАжара§!: §Yбанк \"Рейдбанк\"§!.\nИностранный капитал: §G+80§!."
 NAM_board_issue_war_shares:0 "Военные акции концессии - [FROM.GetName]"
 NAM_board_issue_war_shares_desc:0 "Брокеры собирают подписку среди частных инвесторов. К проспекту приложены реестр концессии и опись оружия, которое поставщики держат наготове для Светлогорья."
 NAM_board_issue_war_shares_unlock_tt:0 "После применения решения: купить оружие под будущие дивиденды выбранной концессии. Каждый округ может разместить один выпуск."
 NAM_board_stock_register_tt:0 "[FROM.NAMBoardStockRegister]"
 NAM_board_stock_register_open:0 "Дивиденды округа свободны для размещения первого выпуска."
 NAM_board_stock_register_pledged:0 "Идёт погашение. Следующий купон: §Y[?NAM_board_stock_coupon|0]§! из §Y3§!."
 NAM_board_stock_register_redeemed:0 "Все три купона погашены. Округ снова платит совету, выпуск закрыт."
 NAM_board_stock_dividends_tt:0 "Следующие §Y3§! месячных дивиденда этого округа получат акционеры. Спор, потеря столицы или выход из подчинения приостанавливают выплаты. Смена компании-владельца сохраняет обязательство."
 NAM_cost_board_stock:0 "§Y25§! иностранного капитала"
 NAM_cost_board_stock_blocked:0 "§R25§! иностранного капитала"
 NAM_cost_board_stock_tooltip:0 "§Y25§! иностранного капитала при размещении выпуска."
 NAM_board_stock_mobilisation:0 "Биржевая мобилизация"
 NAM_board_stock_mobilisation_desc:0 "Перед открытием торгов брокеры раскладывают на столе реестры концессий. Одни члены совета ждут очередной выплаты из округов. Другие хотят поставить винтовки южным гарнизонам до того, как война поднимет цены."
 NAM_board_stock_mobilisation_tt:0 "Закрепление власти: §G+10§!."
 NAM_board_union_of_boards:0 "Союз правлений"
 NAM_board_union_of_boards_desc:0 "Светлогорье стало союзом компаний: каждый округ принадлежит своему правлению, а правления - совету управляющих. Государство и рынок стали одним и тем же."
 NAM_board_union_of_boards_tt:0 "Каждый действующий федеральный округ с подконтрольной столицей и бесспорной концессией сразу отправит Светлогорью партию продукции своего владельца.\nСледующую партию можно получить при продлении устава этого округа."
 # ----- Exile trees: radical war focuses -----
 NAM_rad_war_of_return:0 "Операция \"Чёрный прилив\""
 NAM_rad_war_of_return_desc:0 "Хунта не просит и не ведёт переговоров. Десант пойдёт на Южную гавань, а Эфлор и Ажар узнают, что Светлогорье вернулось за своим и за долгами."
 NAM_rad_great_war:0 "Поход на Юг"
 NAM_rad_great_war_desc:0 "Возвращённые земли покорены, их гарнизоны крепки. Сардан, Рахма и Кадир делили наш материк - теперь столпы придут за их колодцами, караванами и людьми."
 # ----- Exile trees: humanist war focuses -----
 NAM_hum_war_of_return:0 "Операция \"Возвращение\""
 NAM_hum_war_of_return_desc:0 "Манифест прочитан, комитеты ждут сигнала. Армия граждан высаживается в Южной гавани не мстить, а вернуть округам их дом - и Эфлор с Ажаром станут его соседями, а не хозяевами."
 NAM_hum_great_war:0 "Война за союз Юга"
 NAM_hum_great_war_desc:0 "Сардан, Рахма и Кадир отвергли союз. Федерация пойдёт к ним с армией, но обещает каждому побеждённому место в общем совете, а не лагерь."
 # ----- Corporate tree -----
 NAM_board_humanist_facade:0 "Министры-вывеска"
 NAM_board_humanist_facade_desc:0 "Министры Вебера остаются в своих кабинетах и подписывают то, что решило правление. Округа видят знакомые лица и пока не волнуются."
 NAM_grp_board_humanist_facade_tt:0 "Поддержка групп:\n  Округа: §G+5§! £NAM_support_dist_texticon\n  Экспортные конторы: §R-2§! £NAM_support_trade_texticon"
 NAM_board_purge_ministers:0 "Чистка министерств"
 NAM_board_purge_ministers_desc:0 "Правлению не нужны министры, которые помнят о манифесте. Кабинеты займут управляющие компаний, а старые чиновники получат расчёт."
 NAM_grp_board_purge_ministers_tt:0 "Поддержка групп:\n  Экспортные конторы: §G+6§! £NAM_support_trade_texticon\n  Округа: §R-5§! £NAM_support_dist_texticon"
 NAM_board_tender_rail:0 "Объявить конкурс на железнодорожные мастерские"
 NAM_board_tender_rail_desc:0 "Заводская проходная покрыта объявлениями. Рабочие хотят знать, останется ли их депо казённым и кто будет подписывать наряды следующей смене."
 NAM_board_tender_rail_unlock_tt:0 "После применения решения: сохранить государственный эффект (Выпуск военных заводов §G+2%§!) либо продать объект одной из компаний: $NAM_corp_name_2$ и $NAM_corp_name_5$."
 ADISCORD_nam_story.24.t:0 "Кому достанутся железнодорожные мастерские?"
 ADISCORD_nam_story.24.d:0 "Машинисты ждут решения у дверей правления. Трест \"Феррант\" хочет выпускать в мастерских локомотивы, а агентство \"Сменком\" уже записывает слесарей в трудовые бригады. Мастера напоминают, что сейчас государство даёт станкам военных заводов первую очередь в ремонтных цехах."
 NAM_board_tender_yards:0 "Объявить конкурс на островные верфи"
 NAM_board_tender_yards_desc:0 "На главном стапеле всё ещё висит государственный заказ. Совет готов выслушать судовладельцев и оружейников, прежде чем поставить на нём другую печать."
 NAM_board_tender_yards_unlock_tt:0 "После применения решения: позволяет сохранить государственные верфи или передать их одной из компаний."
 ADISCORD_nam_story.25.t:0 "Спор за островные верфи"
 ADISCORD_nam_story.25.d:0 "У правления два проекта. Пароходство \"Навис\" хочет достраивать на островах торговые суда. Компания \"Арктур\" предлагает отдать стапели под производство корабельных орудий. Пока верфи под одной казённой конторой, начальники стапелей могут перебрасывать сварщиков туда, где отстаёт постройка судна."
 NAM_board_tender_depots:0 "Объявить конкурс на нефтебазы"
 NAM_board_tender_depots_desc:0 "В портовой конторе заканчивают опись цистерн. Нефтяники и банкиры запросили одинаковые копии ведомости остатков."
 NAM_board_tender_depots_unlock_tt:0 "После применения решения: позволяет сохранить государственную складскую службу или передать её одной из компаний."
 ADISCORD_nam_story.26.t:0 "Торги за нефтебазы"
 ADISCORD_nam_story.26.d:0 "К управляющему нефтебазами пришли два покупателя. Концерну \"Лорэн\" нужна сеть резервуаров для своих поставок. Банк \"Рейдбанк\" готов выкупить и сами базы, и накладные на хранящееся в них топливо. Казённые нефтебазы держат резерв для строительных управлений: когда срывается подвоз, краны и бульдозеры продолжают работу."
 NAM_board_tender_keep:0 "Закрыть торги без продажи"
 NAM_board_tender_keep_tt:0 "Государство сохраняет предприятие и его промышленный эффект. Новые заявки можно принять через §Y30§! £time_texticon."
 NAM_board_tender_private_terms:0 "Покупатель навсегда получает отрасль и её §Y3§! голоса. Новый сектор учитывается при текущем статусе компании. Если это её первый актив и представителя нет в кабинете, до бойкота есть §Y30§! дней. Продажа во время бойкота оставляет его в силе."
 NAM_board_tender_accept_1:0 "Принять предложение концерна \"Лорэн\""
 NAM_board_tender_bid_1_tt:0 "При продаже снимается государственный эффект: скорость строительства §G+2%§!.\nПредставитель: $minister_NAM_Boris_Nar$. [NAMBoardRepresentative1].\n\n$NAM_board_profile_1$\n\n$NAM_board_tender_private_terms$\nПо материковой концессии Лорэн платит §G35§! капитала за партию вместо §Y25§!."
 NAM_board_tender_accept_2:0 "Передать мастерские тресту \"Феррант\""
 NAM_board_tender_bid_2_tt:0 "При продаже снимается государственный эффект: выпуск военных заводов §G+2%§!.\nПредставитель: $minister_NAM_Fedot_Mir$. [NAMBoardRepresentative2].\n\n$NAM_board_profile_2$\n\n$NAM_board_tender_private_terms$"
 NAM_board_tender_accept_3:0 "Подписать договор с пароходством \"Навис\""
 NAM_board_tender_bid_3_tt:0 "При продаже снимается государственный эффект: выпуск верфей §G+3%§!.\nПредставитель: $minister_NAM_Pavel_Ordyntsev$. [NAMBoardRepresentative3].\n\n$NAM_board_profile_3$\n\n$NAM_board_tender_private_terms$"
 NAM_board_tender_accept_4:0 "Передать верфи компании \"Арктур\""
 NAM_board_tender_bid_4_tt:0 "При продаже снимается государственный эффект: выпуск верфей §G+3%§!.\nПредставитель: $minister_NAM_Mara_Kluch$. [NAMBoardRepresentative4].\n\n$NAM_board_profile_4$\n\n$NAM_board_tender_private_terms$"
 NAM_board_tender_accept_5:0 "Передать мастерские агентству \"Сменком\""
 NAM_board_tender_bid_5_tt:0 "При продаже снимается государственный эффект: выпуск военных заводов §G+2%§!.\nПредставитель: $NAM_board_labor_nominee$. [NAMBoardRepresentative5].\n\n$NAM_board_profile_5$\n\n$NAM_board_tender_private_terms$"
 NAM_board_tender_accept_6:0 "Принять предложение банка \"Рейдбанк\""
 NAM_board_tender_bid_6_tt:0 "При продаже снимается государственный эффект: скорость строительства §G+2%§!.\nПредставитель: $NAM_board_bank_nominee$. [NAMBoardRepresentative6].\n\n$NAM_board_profile_6$\n\n$NAM_board_tender_private_terms$"
 NAM_board_island_concessions:0 "Островные концессии"
 NAM_board_island_concessions_desc:0 "На дверях портовых складов появляются таблички компаний. Старые смотрители читают новые названия и спрашивают у поверенных, кому теперь нести книги. Ответы заносят в протокол совета."
 NAM_board_island_concessions_tt:0 "Иностранный капитал: §G+40§!."
 NAM_board_landing_contracts:0 "Подряд на высадку"
 NAM_board_landing_contracts_desc:0 "В переговорной совета пахнет мокрой шерстью: морские офицеры приехали прямо с полигона. Юристы перелистывают проект договора, пока капитан рисует на промокательной бумаге очертания материкового берега."
 NAM_board_landing_contracts_tt:0 "Готовность к возвращению: §G+10§!."
 NAM_board_landing_readiness_cap_tt:0 "Готовность к возвращению повысится до §G100§!."
 NAM_board_private_navy:0 "Флот компаний"
 NAM_board_private_navy_desc:0 "Корабельный мастер спорит с капитаном о месте орудийной площадки. Судно привыкло к мирным рейсам, и на палубе ещё стоят старые грузовые лебёдки. Представитель правления ждёт окончания осмотра."
 NAM_board_war_of_return:0 "Операция \"Контрольный пакет\""
 NAM_board_war_of_return_desc:0 "Промыслы материка - самый ценный актив, которым правление ещё не владеет. Компании оплатили войну и ждут возврата вложений с первой нефтью Северных залежей."
 NAM_board_homeland_concession:0 "Промыслы - концерну \"Лорэн\""
 NAM_board_homeland_concession_desc:0 "В Ключевске инженеры Лорэн разыскивают старые паспорта скважин. Диспетчер узнаёт приезжего по довоенной фотографии. Разговор о наливах надолго уступает место вопросам о пропавших товарищах."
 NAM_board_homeland_concession_tt:0 "Концессия Лорэн даёт Ключевску §G+1§! единицу пропускной способности, пока Светлогорье владеет промыслом, удерживает его и скважины дают хотя бы §Y1§! полную единицу добычи."
 NAM_loren_book_oil_cargo:0 "Продать Лорэн партию ключевской нефти"
 NAM_loren_book_oil_cargo_desc:0 "В диспетчерскую промысла пришла заявка Лорэн. На ней две подписи: управляющего нефтебазами и начальника отгрузки. Осталось выделить товар и место в графике."
 NAM_loren_book_oil_cargo_unlock_tt:0 "После применения решения: зарезервировать сухопутную экспортную линию для продажи топлива. Лорэн платит больше, если ей принадлежат нефтебазы."
 NAM_loren_lease_site_tt:0 "Совет правлений владеет Ключевском и удерживает его. Скважины не горят и дают не менее одной полной единицы добычи."
 NAM_loren_basin_booking:0 ", погрузка Лорэн §Y1§!"
 NAM_loren_loading_slot_tt:0 "Для погрузки свободна §Y1§! единица сухопутной пропускной способности."
 NAM_loren_cargo_clearance_tt:0 "На складах есть §Y15000§! £fuel_texticon, а в счёте иностранного капитала достаточно места для всей суммы договора (предел §Y100000§!)."
 NAM_loren_quote_25_tt:0 "Одна сухопутная экспортная единица будет занята §Y30§! £time_texticon. При отправке Лорэн получит §Y15000§! £fuel_texticon, а совет - §G25§! иностранного капитала. Цена зафиксирована."
 NAM_loren_quote_35_tt:0 "Одна сухопутная экспортная единица будет занята §Y30§! £time_texticon.\nПри отправке Лорэн получит §Y15000§! £fuel_texticon, а совет - §G35§! иностранного капитала по ставке владельца нефтебаз.\nЦена зафиксирована."
 NAM_loren_loading_interrupted_tt:0 "Промысел остановился, совет утратил управление или для груза не осталось линии. Охрана Ключевска может заменить одну недостающую сухопутную линию."
 NAM_loren_delivery_tt:0 "Отправить §Y15000§! £fuel_texticon и получить §G[?NAM_loren_cargo_quote|0]§! иностранного капитала. Экспортная линия освободится."
 NAM_loren_no_delivery_tt:0 "Резерв линии снимается. Топливо остаётся на складах Светлогорья, оплата не поступает."
 NAM_grp_board_homeland_concession_tt:0 "Поддержка групп:\n  Нефтяники: §G+4§! £NAM_support_oil_texticon\n  Округа: §R-2§! £NAM_support_dist_texticon"
 NAM_board_post_contract_guard:0 "Поставить охрану на контракт"
 NAM_board_post_contract_guard_desc:0 "Начальник охраны набирает водителей и стрелков. В Ключевске они будут сторожить вышки и вести автоцистерны. В спорном округе их маршрут пройдёт от заводской кассы до станции."
 NAM_board_post_contract_guard_unlock_tt:0 "После применения решения: защищает Ключевск или выплаты из спорной столицы округа."
 NAM_board_guard_relief_tt:0 "В этой области сейчас нет оплаченного поста."
 NAM_board_guard_field_tt:0 "На §Y90§! £time_texticon повреждения удерживаемого промысла в Ключевске уменьшаются вдвое.\nЗащита не складывается с войсковой охраной.\nАвтоцистерны довезут уже заказанную Лорэн партию, если для неё не хватает одной сухопутной экспортной единицы."
 NAM_board_guard_district_tt:0 "На §Y90§! £time_texticon охрана доставляет дивиденды из удерживаемой столицы даже во время спора о концессии.\nСначала погашаются купоны военного выпуска.\nПраво голоса останется замороженным до решения спора."
 NAM_cost_board_guard:0 "§Y300§! £infantry_equipment_texticon §Y20§! £motorized_texticon"
 NAM_cost_board_guard_blocked:0 "§R300§! £infantry_equipment_texticon §R20§! £motorized_texticon"
 NAM_cost_board_guard_tooltip:0 "§Y300§! £infantry_equipment_texticon §Y20§! £motorized_texticon передаются охранной компании при назначении поста."
 NAM_board_harbour_works_tt:0 "Оплаченный подряд в удерживаемой Южной гавани строит нефтяной терминал.\nЕсли он уже есть или строительная площадка занята проектом бассейна, бригада строит §G1§! верфь в свободной ячейке.\nПри заполненной гавани она сдаёт §G6§! £convoy_texticon Светлогорью.\nПотеря гавани прерывает подряд с возвратом взноса."
 NAM_board_harbour_terminal_tt:0 "В Южной гавани открыт нефтяной терминал: §G+1§! единица морской экспортной мощности."
 NAM_board_harbour_receipt_tt:0 "У фонда нет незавершённого заказа."
 NAM_board_harbour_site_tt:0 "Совет правлений владеет Южной гаванью и удерживает её."
 NAM_board_harbour_cancel_tt:0 "Светлогорье капитулировало или совет утратил юрисдикцию над оплаченным подрядом в Южной гавани."
 NAM_board_security_contracts:0 "Контракты на охрану"
 NAM_board_security_contracts_desc:0 "Управляющий промыслом встречает начальника охраны у разбитой проходной. Рабочие наблюдают из окон, стараясь рассмотреть знаки на незнакомой форме. В журнале дежурства ещё стоят имена прежних сторожей."
 NAM_board_security_contracts_tt:0 "Закрепление власти: §G+10§!."
 NAM_board_reconstruction_tenders:0 "Тендеры на восстановление"
 NAM_board_reconstruction_tenders_desc:0 "В сожжённой Южной гавани подрядчики меряют шагами пустые участки. У конторы совета их уже ждут жители с планами довоенных домов. Каждый уверен, что начинать следует с его улицы."
 NAM_board_reconstruction_tenders_tt:0 "Закрепление власти: §G+10§!.\nИностранный капитал: §G+30§!."
 NAM_board_great_war:0 "Война акционеров"
 NAM_board_great_war_desc:0 "Сардан, Рахма и Кадир - последние рынки Юга, которые ещё не принадлежат правлению. Акционеры голосуют за войну, и компании выставляют счёт заранее."
 NAM_board_sdr_district_tt:0 "§YСардан§! подчиняется Светлогорью как федеральный округ, сохраняет свою столицу и может заключить договор без открытого спора."
 NAM_board_rhm_district_tt:0 "§YРахма§! подчиняется Светлогорью как федеральный округ, сохраняет свою столицу и может заключить договор без открытого спора."
 NAM_board_kdr_district_tt:0 "§YКадир§! подчиняется Светлогорью как федеральный округ, сохраняет свою столицу и может заключить договор без открытого спора."
 NAM_board_sardan_arsenal:0 "Сардан - компании \"Арктур\""
 NAM_board_sardan_arsenal_desc:0 "Сарданский оружейник вытирает руки перед встречей с представителем компании. На верстаке лежит разобранный затвор, рядом - заводская книга с пометками военных лет. Гость просит начать с этой книги."
 NAM_board_sardan_arsenal_tt:0 "Хозяин §YСардана§!: §Yкомпания \"Арктур\"§!."
 NAM_board_sardan_artel:0 "Сардан - агентству \"Сменком\""
 NAM_board_sardan_artel_desc:0 "У конторы Сменком в Сардане собираются люди с трудовыми книжками. Приказчик спрашивает каждого о ремесле и прежнем месте службы. За его спиной висит карта дорог, уходящих далеко от города."
 NAM_board_sardan_artel_tt:0 "Хозяин §YСардана§!: §Yагентство \"Сменком\"§!."
 NAM_board_rakhma_oil:0 "Рахма - концерну \"Лорэн\""
 NAM_board_rakhma_oil_desc:0 "У рахмского колодца инженер концерна разговаривает со старшиной. Тот долго объясняет, кто имеет право первым подойти к воде. Приезжий закрывает технический справочник и достаёт записную книжку."
 NAM_board_rakhma_oil_tt:0 "Хозяин §YРахмы§!: §Yконцерн \"Лорэн\"§!.\nИностранный капитал: §G+40§!.\nПервая поставка: §G30000§! £fuel_texticon. Излишек хранится в резерве до освобождения цистерн."
 NAM_board_rakhma_steel:0 "Рахма - тресту \"Феррант\""
 NAM_board_rakhma_steel_desc:0 "Мастера стального треста разбивают лагерь у рахмского поселения. Привезённые чертежи приходится придерживать от ветра камнями. Местные кузнецы рассматривают их молча, не снимая рабочих передников."
 NAM_board_rakhma_steel_tt:0 "Хозяин §YРахмы§!: §Yтрест \"Феррант\"§!.\nИностранный капитал: §G+40§!."
 NAM_board_kadir_shipping:0 "Кадир - пароходству \"Навис\""
 NAM_board_kadir_shipping_desc:0 "Приказчик пароходства приехал в Кадир с расписанием рейсов. Караванный старшина показывает ему колодцы на своей карте: дорогу до моря он считает переходами, а не часами."
 NAM_board_kadir_shipping_tt:0 "Хозяин §YКадира§!: §Yпароходство \"Навис\"§!."
 NAM_board_kadir_bank:0 "Кадир - банку \"Рейдбанк\""
 NAM_board_kadir_bank_desc:0 "В кадирской конторе банковский поверенный слушает спор караванщиков. Обе стороны предъявляют расписки с одинаковой печатью. Местный счетовод просит сначала выслушать свидетеля."
 NAM_board_kadir_bank_tt:0 "Хозяин §YКадира§!: §Yбанк \"Рейдбанк\"§!.\nИностранный капитал: §G+80§!."
 # ----- Exile wars: renewal after a closure outside the treaty -----
 NAM_exile_renew_war_of_return: "Новая война возвращения"
 NAM_exile_renew_war_of_return_desc: "Материк всё ещё за проливом, а дома изгнанников - под чужими флагами. Офицеры возвращаются к отложенным картам, и в казармах снова читают письма с потерянного берега. Армия ждёт нового приказа."
 NAM_exile_renew_army_tt:0 "Повторный поход ведут существующие части и обычные пополнения. Бесплатный десант и льготные заказы морской пехоты не повторяются."
 NAM_renew_great_war: "Новый поход на юг"
 NAM_renew_great_war_desc: "На южных дорогах снова собираются обозы. Штабисты достают карты городов, над которыми всё ещё развеваются чужие флаги. Незаконченный поход возвращается в разговоры солдат и в распоряжения канцелярии."
 # Focus trees: exile construction
 # ----- Exile trees: radical politics -----
 NAM_rad_purge_of_loyalists:0 "Чистка людей наместника"
 NAM_rad_purge_of_loyalists_desc:0 "Офицеры и чиновники, служившие наместнику, не станут служить столпам. Военный совет снимает их с должностей, а освободившиеся места раздаёт своим."
 NAM_grp_rad_purge_of_loyalists_tt:0 "Поддержка групп:\n  Наместники: §R-8§! £NAM_support_nam_texticon\n  Гарнизоны: §G+3§! £NAM_support_garr_texticon"
 NAM_rad_officer_amnesty:0 "Амнистия офицерам наместника"
 NAM_rad_officer_amnesty_desc:0 "Перед дверью военного совета ждут офицеры прежнего наместника. Погоны спрятаны в карманах, служебные книжки раскрыты на последней странице. Из комнаты по очереди называют фамилии."
 NAM_grp_rad_officer_amnesty_tt:0 "Поддержка групп:\n  Наместники: §G+6§! £NAM_support_nam_texticon\n  Гарнизоны: §R-3§! £NAM_support_garr_texticon"
 # ----- Exile trees: radical fortress islands -----
 NAM_rad_prison_shipyards:0 "Каторжные верфи"
 NAM_rad_prison_shipyards_desc:0 "У Южноостровска заключённые идут к стапелям под конвоем. Корабельный мастер ждёт их у разложенных лекал. На холодном ветру звенят цепи и стучат незакреплённые доски."
 NAM_rad_island_fuel_dumps:0 "Склады островного арсенала"
 NAM_rad_island_fuel_dumps_desc:0 "Литейный двор и верфи дают оружие и суда, но без запасов они бесполезны. В скалах столичного острова вырубают хранилища для топлива и винтовок."
 # ----- Exile trees: radical Neo-Svetlogorsk -----
 NAM_rad_labour_battalions:0 "Трудовые батальоны"
 NAM_rad_labour_battalions_desc:0 "Беженцы, которым нечем платить за хлеб, отрабатывают его. Батальоны под охраной гарнизонов прокладывают дороги на Южных островах и на Среднем острове."
 NAM_grp_rad_labour_battalions_tt:0 "Поддержка групп:\n  Округа: §R-4§! £NAM_support_dist_texticon\n  Гарнизоны: §G+2§! £NAM_support_garr_texticon"
 NAM_rad_neo_svetlogorsk:0 "Нео-Светлогорск"
 NAM_rad_neo_svetlogorsk_desc:0 "На заседании хунты предлагают назвать островную столицу именем потерянного города. Секретарь медлит, прежде чем вписать его в протокол. За окном видна гавань, совсем не похожая на материковую."
 NAM_rad_barrack_towns:0 "Барачные посёлки"
 NAM_rad_barrack_towns_desc:0 "Палаточные лагеря беженцев сменяются бараками у рудников. Жильё в них дают тем, кто работает в цехах или записывается в армию."
 NAM_grp_rad_barrack_towns_tt:0 "Поддержка групп:\n  Округа: §R-3§! £NAM_support_dist_texticon"
 NAM_rad_convict_power_plant:0 "Каторжная электростанция"
 NAM_rad_convict_power_plant_desc:0 "Заключённые стоят у ворот стройки под надзором караула. Инженер объясняет старшему конвоя план котлована. Из толпы вызывают человека, который назвался электромонтёром."
 NAM_rad_ore_conveyors:0 "Рудные транспортёры"
 NAM_rad_ore_conveyors_desc:0 "Каторжники размечают склон между рудником и пристанью. Надсмотрщик торопит их, а горный мастер требует снова проверить уклон. У подножия уже лежат ржавые секции транспортёра."
 NAM_rad_military_roads:0 "Военные дороги"
 NAM_rad_military_roads_desc:0 "Трудовая колонна останавливается у размытого склона. Сапёр показывает надсмотрщику следы старой дороги. Заключённые ждут на обочине, прижимая к себе мокрый инструмент."
 NAM_rad_penal_mines:0 "Штрафные рудники"
 NAM_rad_penal_mines_desc:0 "У входа в горную выработку горит керосиновая лампа. Надсмотрщик пересчитывает людей, пока мастер проверяет крепь. На доске у караульной ещё видны стёртые фамилии прежней смены."
 NAM_rad_mining_site_available_tt:0 "Восточные острова или Северный островной округ принадлежат нам и находятся под нашим контролем"
 NAM_grp_rad_penal_mines_tt:0 "Поддержка групп:\n  Округа: §R-3§! £NAM_support_dist_texticon"
 NAM_rad_island_airfields:0 "Островные аэродромы"
 NAM_rad_island_airfields_desc:0 "Топографы идут вдоль песчаной косы, придерживая планшеты от ветра. Лётчик показывает, откуда обычно приходит туман. Комендант острова спрашивает о рыбацких домах за дюнами."
 NAM_rad_fortress_capital:0 "Крепость Нео-Светлогорск"
 NAM_rad_fortress_capital_desc:0 "В островном штабе обсуждают карту старой гавани. Артиллерист видит на ней сектора огня, связист - дальность до маяка. Городской комендант просит не забывать о жилых улицах."
 NAM_rad_fortress_capital_tt:0 "Готовность к возвращению: §G+10§!."
 # ----- Exile trees: radical army -----
 NAM_rad_cadet_corps:0 "Островной кадетский корпус"
 NAM_rad_cadet_corps_desc:0 "Сыновья беженцев учатся в бывших складах торговых домов. Корпус готовит младших командиров и оружейников. Полки обучены, оружие роздано, баржи ждут у причалов. У армии возвращения одна задача, и она знает, где её выполнить."
 # ----- Exile trees: humanist politics -----
 NAM_hum_exile_parliament:0 "Парламент в изгнании"
 NAM_hum_finance_island_cooperative:0 "Выкупить мастерские для островного кооператива"
 NAM_hum_finance_island_cooperative_desc:0 "Депутаты предлагают собрать под одной крышей частные мастерские. Казна выкупит помещения, а станки и заказы перейдут в ведение местной артели."
 NAM_hum_finance_island_cooperative_unlock_tt:0 "После применения решения: строит островную фабрику; успешный кооператив ослабляет влияние корпораций."
 NAM_hum_cooperative_site_tt:0 "Мы владеем и управляем островом, на котором меньше двух гражданских фабрик и есть место для предприятия."
 NAM_hum_cooperative_influence_tt:0 "Влияние корпораций §G-4§!."
 NAM_hum_refit_landing_transports:0 "Переоборудовать торговые суда для десанта"
 NAM_hum_refit_landing_transports_desc:0 "Командиры гарнизонов вызывают судовладельцев в гавань. Плотникам предстоит расширить люки, укрепить настилы и научить команды принимать на борт тяжёлое снаряжение."
 NAM_hum_refit_landing_transports_unlock_tt:0 "После применения решения: снаряжает конвои и повышает готовность к возвращению."
 NAM_hum_refit_island_tt:0 "Правительство самостоятельно распоряжается хотя бы одним островным портом."
 NAM_hum_refit_result_tt:0 "Через §Y35§! £time_texticon Светлогорье получит §G12§! £convoy_texticon. Пока идёт подготовка к возвращению, готовность §G+8§!. Смена кабинета не отменяет начатый заказ."
 NAM_hum_refit_drill_tt:0 "Готовность к возвращению §G+8§!."
 NAM_hum_refit_cancel_tt:0 "Потеря последнего островного порта, капитуляция или утрата независимости остановят работы. Фабрики освободятся, суда не поступят."
 NAM_hum_endow_district_faculty:0 "Учредить инженерный факультет в округе"
 NAM_hum_endow_district_faculty_desc:0 "Преподаватели столичного университета приехали в округ с ящиками приборов. В местном училище им показывают пустую аудиторию. Вечером учителя спорят, с какого занятия следует начать знакомство со студентами."
 NAM_hum_endow_district_faculty_unlock_tt:0 "После применения решения: выбранный федеральный округ получает собственную дополнительную ячейку исследований. В каждом округе можно открыть один факультет."
 NAM_hum_exile_parliament_desc:0 "Ярослав Вебер созывает депутатов округов, бежавших на острова. Парламент без страны всё же лучше правительства без парламента."
 NAM_grp_hum_exile_parliament_tt:0 "Поддержка групп:\n  Округа: §G+6§! £NAM_support_dist_texticon\n  Наместники: §R-3§! £NAM_support_nam_texticon"
 NAM_hum_salvation_cabinet:0 "Кабинет национального спасения"
 NAM_hum_salvation_cabinet_desc:0 "В кабинете Вебера рядом с гражданскими папками лежат карты гарнизонов. Командиры пришли в походной форме. Председатель просит закрыть дверь, прежде чем начать заседание."
 NAM_grp_hum_salvation_cabinet_tt:0 "Поддержка групп:\n  Гарнизоны: §G+4§! £NAM_support_garr_texticon\n  Округа: §R-3§! £NAM_support_dist_texticon"
 # ----- Exile trees: humanist island administration -----
 NAM_hum_coast_guard:0 "Береговая охрана островов"
 NAM_hum_coast_guard_desc:0 "Добровольцы из рыбачьих посёлков несут вахту на батареях у Южноостровска и Рыбачьего."
 NAM_hum_civil_airport:0 "Аэропорт Нео-Светлогорска"
 NAM_hum_civil_airport_desc:0 "Рейсы иностранных компаний связывают столицу изгнания с миром. Полосы и ангары аэропорта годятся и для военных машин."
 # ----- Exile trees: humanist Neo-Svetlogorsk -----
 NAM_hum_neo_svetlogorsk:0 "Вольный город Нео-Светлогорск"
 NAM_hum_neo_svetlogorsk_desc:0 "Правительство Вебера объявляет столицу изгнания вольным городом и даёт ей имя потерянного дома. Первыми на это откликаются иностранные инвесторы."
 NAM_hum_neo_svetlogorsk_tt:0 "Иностранный капитал: §G+25§!."
 NAM_hum_loan_roads:0 "Дороги на иностранный заём"
 NAM_hum_loan_roads_desc:0 "В окружной управе банкир слушает дорожного мастера. Тот принёс сапоги, облепленные глиной, и положил рядом с ними план перевала. Условия ссуды пока остаются в закрытой папке."
 NAM_hum_loan_roads_tt:0 "Влияние корпораций: §R+5§!."
 NAM_hum_refugee_housing:0 "Жилищные кооперативы беженцев"
 NAM_hum_refugee_housing_desc:0 "На пустыре у столицы беженцы отмечают колышками будущие дворы. Соседи спорят, где оставить проход к воде. Кто-то уже привёз с материка дверную табличку и бережёт её среди вещей."
 NAM_grp_hum_refugee_housing_tt:0 "Поддержка групп:\n  Округа: §G+4§! £NAM_support_dist_texticon"
 NAM_hum_harbour_concession:0 "Концессия на гавань"
 NAM_hum_harbour_concession_desc:0 "Представитель иностранной компании спускается к воде вместе с портовым инженером. Они говорят о старом фарватере, а лодочники с соседней пристани внимательно прислушиваются."
 NAM_hum_harbour_concession_tt:0 "Иностранный капитал: §G+40§!.\nВлияние корпораций: §R+10§!."
 NAM_hum_municipal_harbour:0 "Городская гавань"
 NAM_hum_municipal_harbour_desc:0 "В городской думе обсуждают судьбу гавани. Докеры пришли с собственным планом причалов и просят выслушать его до выступления торговых поверенных. Председатель уступает им место у карты."
 NAM_hum_municipal_harbour_tt:0 "Влияние корпораций: §G-5§!."
 NAM_grp_hum_municipal_harbour_tt:0 "Поддержка групп:\n  Округа: §G+4§! £NAM_support_dist_texticon"
 NAM_hum_island_power_grid:0 "Островная энергосеть"
 NAM_hum_island_power_grid_desc:0 "У пристани распаковывают тяжёлые ящики с иностранными клеймами. Местный электрик сверяет надписи с переводом инструкции. Вокруг собрались мастера из посёлков, где по вечерам всё ещё жгут керосин."
 NAM_hum_island_power_grid_tt:0 "Влияние корпораций: §R+5§!."
 NAM_hum_free_port_shipyards:0 "Верфи вольной гавани"
 NAM_hum_free_port_shipyards_desc:0 "У новых причалов закладывают верфь. Она будет чинить торговые суда и строить свои."
 NAM_hum_water_works:0 "Водовод и обогатительная фабрика"
 NAM_hum_water_works_desc:0 "Горный мастер ведёт инженеров вдоль пересохшего русла. На камнях видны отметки прошлой весны. У рудничной кухни женщины ждут водовоза и спрашивают приезжих о чертежах под мышкой."
 NAM_hum_people_university:0 "Народный университет"
 NAM_hum_people_university_desc:0 "Учёные и инженеры, бежавшие с материка, открывают университет для всех жителей Нео-Светлогорска. Учат бесплатно, а лаборатории работают на город."
 NAM_grp_hum_people_university_tt:0 "Поддержка групп:\n  Округа: §G+4§! £NAM_support_dist_texticon"
 NAM_hum_corporate_polytechnic:0 "Политехникум концернов"
 NAM_hum_corporate_polytechnic_desc:0 "В училище компаний преподаватель разбирает с учениками чертёж незнакомого станка. На последней странице стоит отметка о служебной тайне. Один из учеников спрашивает, можно ли показать работу отцу."
 NAM_hum_corporate_polytechnic_tt:0 "Иностранный капитал: §G+30§!.\nВлияние корпораций: §R+10§!."
 NAM_hum_free_city_charter:0 "Хартия вольного города"
 NAM_hum_free_city_charter_desc:0 "Горожане принимают хартию Нео-Светлогорска: выборный совет, открытый порт и общие мастерские. Город, построенный в изгнании, теперь живёт по своему закону."
 NAM_hum_free_city_charter_tt:0 "Готовность к возвращению: §G+10§!."
 # ----- Exile trees: humanist citizen army -----
 NAM_hum_officer_college:0 "Офицерский колледж"
 NAM_hum_officer_college_desc:0 "Ветераны и нанятые инструкторы открывают колледж для командиров добровольцев. Там учат штабной работе, связи и снабжению."
 # ----- Corporate tree: exile construction -----
 NAM_board_mercenary_battalions:0 "Наёмные батальоны"
 NAM_board_mercenary_battalions_desc:0 "Охранные фирмы концернов набирают батальоны из ветеранов чужих войн. Оружие у них своё, а жалованье платит правление."
 NAM_board_mercenary_regiment_tt:0 "В столице развернётся полностью укомплектованный полк: три пехотных батальона и сапёрная рота, §Y3300§! £manpower_texticon. По его шаблону можно обучать новые полки."
 NAM_board_company_capital:0 "Столица концернов"
 NAM_board_company_capital_desc:0 "Купцам надоело возить на острова одни и те же бумаги. Правление сводит конторы под одну крышу, чтобы земельные договоры, страховые полисы и разрешения на торговлю подписывали за одним столом."
 NAM_board_company_capital_tt:0 "Иностранный капитал: §G+30§!."
 NAM_board_company_capital_ready_tt:0 "Правление независимо и удерживает хотя бы одну собственную область."
 NAM_board_offices_site_tt:0 "Конторы занимают новый деловой центр в столице. Если построить его там нельзя, подбирается другая собственная область под нашим контролем."
 NAM_board_company_housing_ready_tt:0 "В собственной подконтрольной области есть площадка под гражданскую фабрику."
 NAM_board_housing_site_tt:0 "Приоритет у Срединного острова, затем у столицы. Если обе площадки недоступны, кварталы строятся в другой удерживаемой области. Кварталы ускоряют местное строительство гражданских фабрик на §G35%§!."
 NAM_board_housing_charter_tt:0 "Правление может выдать ещё §G1§! хартию свободной зоны."
 NAM_board_company_quarters_state:0 "Ведомственные кварталы"
 NAM_board_company_docks_ready_tt:0 "Правление удерживает собственную прибрежную область с морской базой."
 NAM_board_docks_site_tt:0 "Новую верфь примет столичный порт или, если он заполнен либо потерян, другой действующий порт со свободной площадкой. Через любой действующий порт правления можно заказать застрахованные транспорты."
 NAM_insured_freight_route_tt:0 "Независимое Светлогорье удерживает Южную гавань или, при правлении концернов с доками \"Навис\", собственный действующий порт."
 NAM_board_company_housing:0 "Корпоративные кварталы"
 NAM_board_company_housing_desc:0 "Концерны строят жильё и мастерские для своих рабочих. Квартиры дают по контракту, и уйти от работодателя теперь значит лишиться крыши."
 NAM_board_company_docks:0 "Доки пароходства \"Навис\""
 NAM_board_company_docks_desc:0 "У причала компании капитаны спорят с корабельными мастерами о старом корпусе. Страховой поверенный внимательно слушает, не вмешиваясь. На воде покачивается лодка артельного старшины."
 NAM_board_company_airport:0 "Аэропорт правления"
 NAM_board_company_airport_desc:0 "Пароход с почтой приходит раз в неделю, а сломанный станок ждёт нужную шестерню уже месяц. Правление выкупает грузовые самолёты и передаёт диспетчерам расписание первых рейсов."
 NAM_board_company_airport_ready_tt:0 "Правление независимо и удерживает хотя бы одну собственную область."
 NAM_board_company_airport_tt:0 "Аэродром получит до §G2§! уровней в пределах уровня §Y10§!.\nЕсли столичное поле заполнено или потеряно, расширят другое собственное поле под нашим контролем.\nГрузовые самолёты поступят и при полностью застроенных аэродромах."
 NAM_disrupt_print_supply:0 "Перекрыть каналы подпольной печати"
 NAM_disrupt_print_supply_desc:0 "На складской ведомости полицейский подчёркивает повторяющиеся адреса. Кладовщик пытается вспомнить покупателя наборного металла. В углу ещё стоят ящики с тем же клеймом."
 NAM_intercept_underground_couriers:0 "Обезвредить курьерскую сеть"
 NAM_intercept_underground_couriers_desc:0 "Наборщики знают связных, а связные ведут к явочным квартирам. На столе жандармского начальника лежат перехваченные записки. За окнами канцелярии ждут родственники задержанных, требуя назвать место обыска и имя следователя."
 NAM_print_network_active_tt:0 "Подполье действует в Светлогорье; ресурсная война ещё не началась"
 NAM_print_supply_control_tt:0 "На §Y60 дней§! ежемесячный рост подполья уменьшается на §G3§! £operatives_boost_resistance_texticon."
 NAM_print_supply_cancel_tt:0 "Контроль подпольной печати прекращается. Потраченная политическая власть не возвращается."
 NAM_courier_network_disrupted_tt:0 "Сила подполья: §G-12§! £operatives_boost_resistance_texticon.\nПоддержка округов: §R-4§! £NAM_support_dist_texticon."
 NAM_colonial_rifle_contract:0 "Заказать вооружение по квоте"
 NAM_colonial_rifle_contract_desc:0 "Складские поверенные готовят партию для местных гарнизонов. Ведомости поставок должны пройти через колониальную канцелярию и военную приёмку."
 NAM_colonial_rifle_contract_result_tt:0 "Через §Y21§! £time_texticon дн.: §G+4500§! £infantry_equipment_texticon, §G+40§! £support_equipment_texticon."
 NAM_colonial_fuel_reserve:0 "Заполнить скрытые цистерны"
 NAM_colonial_fuel_reserve_desc:0 "Промысловые диспетчеры сверяют вместимость местных хранилищ. Цистерны для внутреннего резерва получат отдельные ведомости и собственных приёмщиков."
 NAM_colonial_fuel_reserve_result_tt:0 "Через §Y21§! £time_texticon: §Y40000§! £fuel_texticon будут укрыты от вывоза при распаде. Незавершённое укрытие защиты не даёт."
 NAM_colonial_workshops:0 "Военные мастерские Южной гавани"
 NAM_colonial_workshops_desc:0 "Станки обратного рейса ждут разгрузки в Южной гавани. Местным мастерам предстоит подготовить помещения и согласовать работу новых цехов с военными заказчиками."
 NAM_colonial_workshops_result_tt:0 "Через §Y35§! £time_texticon дн.: Южная гавань: военный завод §G+1§!, строительный участок §G+1§!."
 NAM_colonial_artillery_contract:0 "Контракт на батареи и связь"
 NAM_colonial_artillery_contract_desc:0 "Складские связи помогут собрать общий заказ для батарей и подразделений связи. Военные приёмщики проверят комплектность каждой партии перед отправкой."
 NAM_colonial_artillery_contract_result_tt:0 "Через §Y35§! £time_texticon дн.: §G+240§! £ADISCORD_artillery_texticon, §G+160§! £support_equipment_texticon."
 NAM_colonial_gendarme_operation:0 "Разорвать связи ячеек"
 NAM_colonial_gendarme_operation_desc:0 "Жандармы сопоставляют донесения о связных и готовят согласованные обыски. Местные управы должны объяснить, кто отвечает за действия патрулей в их округах."
 NAM_colonial_gendarme_operation_result_tt:0 "Через §Y14§! £time_texticon дн.: §G-15§! £operatives_boost_resistance_texticon, §R-3§! £NAM_support_dist_texticon."
 NAM_colonial_volunteer_training:0 "Учебные сборы промысловой милиции"
 NAM_colonial_volunteer_training_desc:0 "Местные инструкторы собирают добровольцев с промыслов и из рабочих посёлков. Учебные площадки нужно подготовить до прибытия людей."
 NAM_colonial_volunteer_training_result_tt:0 "Через §Y21§! £time_texticon дн.: §G+3000§! £manpower_texticon, §G+1500§! £infantry_equipment_texticon, §G+3§! £NAM_support_dist_texticon."
 NAM_colonial_reserve_fund:0 "Укрыть долю центра"
 NAM_colonial_reserve_fund_desc:0 "Канцелярия переписывает расчёты с центром в отдельную книгу. Доверенные счетоводы будут вести её так, чтобы местные средства не растворились в общих имперских ведомостях."
 NAM_colonial_reserve_fund_result_tt:0 "Через §Y14§! £time_texticon: §Y250§! £ADISCORD_economy_treasury_texticon будут укрыты от вывоза при распаде. Незавершённое укрытие защиты не даёт."
 NAM_colonial_officer_course:0 "Курсы полевого командования"
 NAM_colonial_officer_course_desc:0 "Инструкторы собирают местных офицеров на штабные учения. Разрозненные гарнизонные планы нужно свести к общей карте и понятному порядку связи."
 NAM_colonial_officer_course_result_tt:0 "Через §Y21§! £time_texticon дн.: §G+20§! £army_experience, §G+4§! £NAM_support_garr_texticon."
 NAM_colonial_local_register:0 "Оплатить окружные учебные сборы"
 NAM_colonial_local_register_desc:0 "Окружные командиры собирают бывших военнослужащих и молодых добровольцев. Казённое жалованье позволит инструкторам оставить гражданскую работу и заняться учебными ротами."
 NAM_colonial_local_register_result_tt:0 "Через §Y28§! £time_texticon дн. в резерв Светлогорья: §G+12000§! £manpower_texticon и §G+30§! £army_experience."
 NAM_colonial_emergency_stocks:0 "Закупить мобилизационный запас"
 NAM_colonial_emergency_stocks_desc:0 "Складские службы готовят помещения под аварийные запасы. Последние накладные нужно сверить, пока поставщики ещё отвечают на запросы канцелярии."
 NAM_colonial_emergency_stocks_result_tt:0 "Через §Y21§! £time_texticon дн. на склады Светлогорья: §G+12000§! £infantry_equipment_texticon, §G+200§! £support_equipment_texticon, §G+300§! £motorized_texticon."
 NAM_colonial_warehouse_transfer:0 "Передать ведомственные склады армии"
 NAM_colonial_warehouse_transfer_desc:0 "Последняя сверка должна установить, чьи подписи стоят за ведомственными запасами. Военные приёмщики Светлогорья прибудут на склады с актами передачи."
 NAM_colonial_warehouse_transfer_result_tt:0 "Через §Y14§! £time_texticon дн.: §G+3000§! £infantry_equipment_texticon, §G+40§! £support_equipment_texticon."
 NAM_colonial_archive_transfer:0 "Принять расчёты исчезающего центра"
 NAM_colonial_archive_transfer_desc:0 "Архивисты собирают копии центральных распоряжений и платёжных ведомостей. Каждую бумагу нужно заверить, пока ещё можно найти ответственного за её выдачу."
 NAM_colonial_archive_transfer_result_tt:0 "Через §Y14§! £time_texticon дн.: §G+150§! £ADISCORD_economy_treasury_texticon, §G+3%§! £stability_texticon."
 NAM_campaign_add_slot_tt:0 "Доступно ещё §G1§! место для пропагандистских кампаний."
 NAM_colonial_programme_operable_tt:0 "Администрация действует, Светлогорье остаётся колонией и метрополия существует"
 NAM_colonial_gendarme_result_tt:0 "Подполье: §G-15§! £operatives_boost_resistance_texticon. Поддержка округов: §R-3§! £NAM_support_dist_texticon."
 NAM_colonial_volunteers_result_tt:0 "Поддержка округов: §G+3§! £NAM_support_dist_texticon."
 NAM_colonial_officers_result_tt:0 "Поддержка гарнизонов: §G+4§! £NAM_support_garr_texticon."
 NAM_colonial_reserve_result_tt:0 "Скрытый резерв: §G+150§! £ADISCORD_economy_treasury_texticon. Выплата при независимости."
 NAM_colonial_archive_result_tt:0 "В казну Светлогорья: §G+150§! £ADISCORD_economy_treasury_texticon."
 NAM_campaign_answer_leaflets:0 "§YПРОПАГАНДА:§! За каждой листовкой - чужой приказ"
 NAM_campaign_answer_leaflets_unlock_tt:0 "После применения решения: временно укрепляет стабильность и замедляет рост подполья."
 NAM_campaign_answer_leaflets_desc:0 "Газеты и промысловое радио разбирают обещания подполья и публикуют проверенные сведения о его вербовщиках."
 NAM_campaign_answer_leaflets_tt:0 "На §Y60§! £time_texticon дн. рост подполья уменьшается на §G2§! £operatives_boost_resistance_texticon в месяц."
 NAM_colonial_pipeline_guard:0 "Постоянные посты на нефтепроводах"
 NAM_colonial_pipeline_guard_desc:0 "Посты проверяют пропуска и маршруты снабжения ячеек."
 NAM_colonial_pipeline_guard_tt:0 "На §Y60§! £time_texticon дн. рост подполья уменьшается на §G2§! £operatives_boost_resistance_texticon в месяц."
 NAM_pipeline_guard_cancel_tt:0 "Охрана нефтепроводов прекращается. Оплата не возвращается."
 NAM_colonial_reserve_ready_tt:0 "Скрытый резерв ведётся и ещё не выплачен при независимости"

 # Independent institutions and public mobilisation
 NAM_ind_sovereign_collections:0 "Сборы под собственной печатью"
 NAM_ind_sovereign_collections_desc:0 "Канцелярия сверит платежи, которые прежде уходили в центр. Сборщикам предстоит получить новые реквизиты и отчитаться уже перед собственным казначейством."
 NAM_ind_sovereign_collections_result_tt:0 "Через §Y14§! £time_texticon дн.: Казна Светлогорья: §G+250§! £ADISCORD_economy_treasury_texticon."
 NAM_ind_border_dossier:0 "Собрать межевое досье"
 NAM_ind_border_dossier_desc:0 "Архивисты и торговые конторы сводят карты, платежи и старые договоры в общее досье. Соседям придётся отвечать на документы с подписями их собственных предшественников."
 NAM_ind_border_dossier_result_tt:0 "При успешном завершении: ещё §G60§! £time_texticon до ресурсной войны и §G+3§! £NAM_support_trade_texticon. Досье можно подготовить один раз."
 NAM_ind_defence_supply:0 "Снабдить армию независимости"
 NAM_ind_defence_supply_desc:0 "Военное ведомство оформляет первые заказы от имени самостоятельного государства. Приёмщики согласуют образцы с частями, которым предстоит защищать новую границу."
 NAM_ind_defence_supply_result_tt:0 "Через §Y21§! £time_texticon дн.: На склады Светлогорья: §G+6000§! £infantry_equipment_texticon, §G+60§! £support_equipment_texticon. §G+10§! £army_experience."
 NAM_ind_statute_commissions:0 "Отправить комиссии статута в округа"
