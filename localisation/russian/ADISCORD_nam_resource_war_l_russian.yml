 NAM_mil_recruit_depots_refund_tt:0 "§G+200§! £ADISCORD_economy_treasury_texticon."
 NAM_mil_recruit_depots_desc:0 "Цена: §Y35§! £political_power_texticon §Y200§! £ADISCORD_economy_treasury_texticon. Срок: §Y28§! £time_texticon дн. Повтор через §Y90§! £time_texticon дн. после завершения.\n\nОплатите подготовку пополнений. Люди поступят в резерв, из которого комплектуются армия и мобилизационные заказы.\n§G+6000§! £population_texticon.\n\nПри капитуляции, подчинении или утрате условий заказа вся оплата возвращается. Начало и завершение войны сами по себе заказ не отменяют. Поставка поступает Светлогорью."
