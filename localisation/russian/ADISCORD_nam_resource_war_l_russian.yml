 NAM_mil_mobile_operation_removed_tt:0 "Война закончилась либо независимая администрация Светлогорья больше не действует"
 NAM_mil_forward_depot_removed_tt:0 "Округ потерян, независимая администрация прекратила работу или ресурсный конфликт завершён"
 NAM_resource_war_spirit_ended_tt:0 "Ресурсная война завершена"
 NAM_south_war_spirit_ended_tt:0 "Война за Юг завершена"
 ADISCORD_nam_last_line_administration:0 "Штаб последнего рубежа"
 ADISCORD_nam_last_line_administration_desc:0 "Временный штаб сводит оборону и снабжение последнего рубежа."
 NAM_klyuchevsk_oil_strike_desc:0 "Забастовка срывает добычу на удерживаемом противником промысле. Прекращается после победы в войне возвращения или утраты допустимой цели."
 NAM_pirate_blockade_desc:0 "Коалиция закрывает островные гавани на срок блокады. Кроме указанных штрафов, набеги чаще проваливаются."
 NAM_board_company_quarters_state_desc:0 "Корпоративный подряд ускоряет строительство фабрик, пока Светлогорье владеет округом и контролирует его. Потеря контроля приостанавливает действие."
 NAM_air_bridge_deliveries_desc:0 "Снабжение поступает с действующего аэродрома нашей Южной гавани в удерживаемый нами округ. Для иностранной территории нужны наземные авианаводчики; утрата аэродрома или района доставки прекращает рейсы."
 NAM_tenant_supply_depot_desc:0 "Склад обслуживает принадлежащий нам и удерживаемый округ, пока независимая послевоенная администрация действует."
 NAM_rad_requisitioned_market_desc:0 "Фабричные склады снабжают гарнизон за счёт гражданской работы. Реквизиция действует только при независимой хунте в собственном удерживаемом округе с фабрикой и прямым управлением."
 NAM_rad_command_post_desc:0 "Комендатура работает, пока независимая хунта удерживает собственный округ без местного совета и размещает в нём свою дивизию. Потеря контроля или уход гарнизона приостанавливают эффект; смена владельца или создание совета снимают его."
 NAM_mil_mobile_operation_desc:0 "Оплаченный оперативный темп действует во время войны, пока Светлогорье сохраняет независимую администрацию. Мир или утрата этой возможности прекращают операцию."
 NAM_mil_forward_depot_desc:0 "Склад действует в собственном удерживаемом округе независимого Светлогорья во время подготовки к ресурсной войне и самой войны. Потеря округа, подчинение, капитуляция или окончание конфликта снимают эффект."
 NAM_pw_district_fleet_called_desc:0 "Местный транспорт отвлечён на общий военный заказ. Штраф сохраняется на срок действия вызова."
 NAM_pw_district_title_books_desc:0 "Межевые книги сохраняются при смене власти. Эффект действует в удерживаемом национальном или присоединяемом пограничном округе без договорной автономии, при независимом послевоенном правительстве с мандатом наместников."
 NAM_pw_civil_court_awards_desc:0 "Судебное решение действует в удерживаемом национальном или присоединяемом пограничном округе без договорной автономии, при независимом послевоенном правительстве с мандатом наместников."
 NAM_war_fuel_discipline_idea_desc:0 "Военные склады соблюдают общий порядок выдачи топлива. Действует до конца ресурсной войны."
 NAM_war_extraction_surge_idea_desc:0 "Промыслы перестраивают смены под военный спрос. Действует до конца ресурсной войны."
 NAM_war_short_training_idea_desc:0 "Учебные команды готовят пополнения по сокращённой программе. Действует до конца ресурсной войны."
 NAM_war_veteran_cadres_idea_desc:0 "Опытные военнослужащие передают навыки новым частям. Действует до конца ресурсной войны."
 NAM_war_depot_network_idea_desc:0 "Штаб объединяет фронтовые склады в общую сеть. Действует до конца ресурсной войны."
 NAM_war_mobile_workshops_idea_desc:0 "Походные мастерские обслуживают технику действующей армии. Действует до конца ресурсной войны."
 NAM_war_factory_shifts_idea_desc:0 "Заводы работают по военному графику. Действует до конца ресурсной войны."
 NAM_war_convoy_escort_idea_desc:0 "Морская служба согласует охрану транспортных рейсов. Действует до конца ресурсной войны."
 NAM_war_interceptor_control_idea_desc:0 "Посты наблюдения и перехватчики работают по единому плану. Действует до конца ресурсной войны."
 NAM_war_air_ground_liaison_idea_desc:0 "Наземные части согласуют задания с авиацией. Действует до конца ресурсной войны."
 NAM_war_joint_operations_idea_desc:0 "Штабы объединяют подготовку совместных операций. Действует до конца ресурсной войны."
 NAM_agreement_nam_reward_desc:0 "Исполненное соглашение с наместниками укрепляет сотрудничество на срок награды."
 NAM_agreement_nam_failure_desc:0 "Нарушенное соглашение с наместниками осложняет работу государства на срок штрафа."
 NAM_agreement_oil_reward_desc:0 "Исполненное соглашение с нефтяниками укрепляет сотрудничество на срок награды."
 NAM_agreement_oil_failure_desc:0 "Нарушенное соглашение с нефтяниками осложняет работу государства на срок штрафа. Оплаченное урегулирование трудового спора может снять штраф досрочно."
 NAM_agreement_dist_reward_desc:0 "Исполненное соглашение с округами укрепляет сотрудничество на срок награды."
 NAM_agreement_dist_failure_desc:0 "Нарушенное соглашение с округами осложняет работу государства на срок штрафа. Оплаченное урегулирование трудового спора может снять штраф досрочно."
 NAM_agreement_garr_reward_desc:0 "Исполненное соглашение с гарнизонами укрепляет сотрудничество на срок награды."
 NAM_agreement_garr_failure_desc:0 "Нарушенное соглашение с гарнизонами осложняет работу государства на срок штрафа."
 NAM_agreement_trade_reward_desc:0 "Исполненное соглашение с экспортными конторами укрепляет сотрудничество на срок награды."
 NAM_agreement_trade_failure_desc:0 "Нарушенное соглашение с экспортными конторами осложняет работу государства на срок штрафа."

