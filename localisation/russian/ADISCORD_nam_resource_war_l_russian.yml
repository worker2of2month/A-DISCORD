 # Focus trees: exile revolution
 # ----- Defeat tree: exile revolution, shared -----
 NAM_war_of_return_won_tt:0 "Война возвращения выиграна"
 # ----- Exile radicals: the pillar junta and the great return -----
 NAM_rad_pillar_junta:0 "Хунта столпов"
 NAM_rad_pillar_junta_desc:0 "Наместник низложен, и печати теперь в руках тех, кто держал острова все эти месяцы: гарнизонных командиров, нефтяных старшин и капитанов. Хунта столпов не обещает свобод. Она обещает вернуть материк любой ценой."
 NAM_grp_rad_pillar_junta_tt:0 "Поддержка групп:\n  Гарнизоны: §G+8§! £NAM_support_garr_texticon\n  Нефтяники: §G+4§! £NAM_support_oil_texticon\n  Наместники: §R-10§! £NAM_support_nam_texticon"
 NAM_rad_tribunals:0 "Революционные трибуналы"
 NAM_rad_tribunals_desc:0 "Приверженцы наместника ещё сидят в конторах и на складах. Трибуналы вычистят их за одну неделю, а осуждённых отправят в штрафные роты, которые первыми пойдут на берег."
 NAM_rad_tribunals_tt:0 "Готовность к возвращению: §G+10§!."
 NAM_grp_rad_tribunals_tt:0 "Поддержка групп:\n  Наместники: §R-8§! £NAM_support_nam_texticon\n  Округа: §R-4§! £NAM_support_dist_texticon"
 NAM_rad_pact_of_pillars:0 "Договор столпов"
 NAM_rad_pact_of_pillars_desc:0 "Столпы не будут резать друг друга. Они сложат свои кассы в общий котёл, поделят трофеи по долям и вместе заплатят за войну, которую каждый из них ждёт."
 NAM_rad_pact_of_pillars_tt:0 "Добыча: §G+40§!."
 NAM_grp_rad_pact_of_pillars_tt:0 "Поддержка групп:\n  Нефтяники: §G+4§! £NAM_support_oil_texticon\n  Экспортные конторы: §G+4§! £NAM_support_trade_texticon"
 NAM_rad_war_council:0 "Военный совет столпов"
 NAM_rad_war_council_desc:0 "Решения о войне больше не ждут подписи наместника. Совет столпов заседает в штабе, и каждый его член отвечает за свой участок будущего фронта."
 NAM_rad_war_council_tt:0 "Готовность к возвращению: §G+5§!."
 NAM_rad_island_requisitions:0 "Реквизиции на островах"
 NAM_rad_island_requisitions_desc:0 "Склады торговых домов и окружные амбары переходят в распоряжение совета. Хозяевам выдадут расписки - их оплатят после возвращения, если будет кому платить."
 NAM_grp_rad_island_requisitions_tt:0 "Поддержка групп:\n  Округа: §R-5§! £NAM_support_dist_texticon\n  Экспортные конторы: §R-3§! £NAM_support_trade_texticon"
 NAM_rad_great_war_plan:0 "План великой войны"
 NAM_rad_great_war_plan_desc:0 "Сардан, Рахма и Кадир встретят нас вместе. Совет принимает это: одна большая война лучше трёх малых, и после неё никто на Юге не посмеет нам отказать."
 # ----- After the return: the radicals strip the conquered south -----
 NAM_rad_spoils_of_return:0 "Трофеи возвращения"
 NAM_rad_spoils_of_return_desc:0 "Склады побеждённых открыты, их нефть и зерно принадлежат победителю. Завоёванные земли не станут нашими провинциями - они станут нашей кладовой."
 NAM_rad_labour_camps:0 "Трудовые лагеря"
 NAM_rad_labour_camps_desc:0 "Пленные и неблагонадёжные отработают свою вину на промыслах и в каменоломнях. Лагеря строят там, где нужны руки, а не там, где люди могут жить."
 NAM_grp_rad_labour_camps_tt:0 "Поддержка групп:\n  Гарнизоны: §G+4§! £NAM_support_garr_texticon\n  Округа: §R-6§! £NAM_support_dist_texticon"
 NAM_rad_garrison_rule:0 "Гарнизонное правление"
 NAM_rad_garrison_rule_desc:0 "Завоёванными землями правят коменданты. Каждая деревня выставляет рекрутов, каждый город содержит гарнизон, и любая искра гасится раньше, чем станет пожаром."
 NAM_grp_rad_garrison_rule_tt:0 "Поддержка групп:\n  Гарнизоны: §G+8§! £NAM_support_garr_texticon\n  Экспортные конторы: §R-4§! £NAM_support_trade_texticon"
 NAM_rad_extraction_trusts:0 "Добывающие тресты"
 NAM_rad_extraction_trusts_desc:0 "Промыслы побеждённых передаются трестам столпов. Тресты не строят школ и не чинят дорог - они качают нефть, пока она идёт."
 NAM_rad_has_conquered_state_tt:0 "Под нашим контролем есть хотя бы одна завоёванная область"
 NAM_rad_extraction_trusts_tt:0 "До §Y3§! завоёванных областей: добыча нефти §G+2§! в каждой."
 NAM_grp_rad_extraction_trusts_tt:0 "Поддержка групп:\n  Нефтяники: §G+6§! £NAM_support_oil_texticon\n  Гарнизоны: §R-3§! £NAM_support_garr_texticon"
 NAM_rad_machines_to_islands:0 "Станки - в столицу"
 NAM_rad_machines_to_islands_desc:0 "Заводы завоёванных земель разберут до последнего станка и перевезут в столицу. Там они будут делать оружие, а побеждённым оставят пустые цеха."
 NAM_rad_conquered_factory_tt:0 "В завоёванной области под нашим контролем есть гражданский завод"
 NAM_rad_machines_to_islands_tt:0 "До §Y2§! завоёванных областей: §R-1§! гражданский завод в каждой.\nСтолица: §G+1§! военный завод за каждый вывезенный завод."
 NAM_rad_dominion_of_pillars:0 "Владычество столпов"
 NAM_rad_dominion_of_pillars_desc:0 "Хунта больше не называет себя временной. Столпы правят метрополией и её кладовой, и их власть держится на том, что было взято силой и силой же удерживается."
 NAM_grp_rad_dominion_of_pillars_tt:0 "Поддержка групп:\n  Гарнизоны: §G+6§! £NAM_support_garr_texticon\n  Нефтяники: §G+6§! £NAM_support_oil_texticon\n  Наместники: §R-10§! £NAM_support_nam_texticon\n  Округа: §R-10§! £NAM_support_dist_texticon"
 # ----- Exile humanists: Yaroslav Weber's government -----
 NAM_hum_veter_government:0 "Правительство Ярослава Вебера"
 NAM_hum_veter_government_desc:0 "Ярослав Вебер, вчерашний вожак подполья, возглавил правительство в изгнании. Его гуманисты обещают вернуть материк не как добычу, а как общий дом свободных округов."
 NAM_grp_hum_veter_government_tt:0 "Поддержка групп:\n  Округа: §G+8§! £NAM_support_dist_texticon\n  Наместники: §R-10§! £NAM_support_nam_texticon"
 NAM_hum_free_zones:0 "Свободные зоны"
 NAM_hum_free_zones_desc:0 "Островам нечем платить за войну, зато есть гавани, сталь и люди. Иностранные компании, открывшие здесь дело, не будут платить налогов - они заплатят за наше возвращение."
 NAM_hum_free_zones_tt:0 "Иностранный капитал: §G+30§!.\nВлияние корпораций: §Y+5§!."
 NAM_hum_open_doors:0 "Открытые двери"
 NAM_hum_open_doors_desc:0 "Любая компания, готовая вложить деньги, получит хартию без долгих проверок. Капитал придёт быстро."
 NAM_hum_open_doors_tt:0 "Иностранный капитал: §G+60§!.\nВлияние корпораций: §R+15§!.\nСвободные зоны: §G+1§! место (не больше §Y3§!)."
 NAM_hum_regulated_partnership:0 "Регулируемое партнёрство"
 NAM_hum_regulated_partnership_desc:0 "Хартии выдаются по строгим правилам: открытая отчётность, местные рабочие, право правительства отозвать договор. Денег будет меньше, но и хозяев у Светлогорья не прибавится."
 NAM_hum_regulated_partnership_tt:0 "Иностранный капитал: §G+25§!.\nВлияние корпораций: §G-10§!."
 NAM_hum_steel_exchange:0 "Стальная биржа"
 NAM_hum_steel_exchange_desc:0 "Островная сталь уходит за бесценок через перекупщиков. Своя биржа продаст её компаниям напрямую и по честной цене."
 NAM_hum_steel_exchange_tt:0 "Иностранный капитал: §G+20§!."
 NAM_hum_innovation_parks:0 "Парки инноваций"
 NAM_hum_innovation_parks_desc:0 "Компании привозят на острова мастерские и инженеров. Отведём им кварталы у гаваней, где новые станки будут работать на наших рабочих и наших учеников."
 NAM_hum_innovation_parks_tt:0 "Влияние корпораций: §Y+5§!."
 NAM_hum_labour_bureau:0 "Бюро трудовых контрактов"
 NAM_hum_labour_bureau_desc:0 "Беженцам нужна работа, компаниям нужны руки. Бюро заключает контракты от имени правительства и следит, чтобы рабочие возвращались домой с деньгами."
 NAM_hum_labour_bureau_tt:0 "Иностранный капитал: §G+15§!."
 NAM_hum_union_contracts:0 "Профсоюзные договоры"
 NAM_hum_union_contracts_desc:0 "Контракты подписывают профсоюзы округов, а не каждый рабочий в одиночку. Компании платят меньше, чем хотели бы, но острова спокойны."
 NAM_hum_union_contracts_tt:0 "Иностранный капитал: §G+15§!.\nВлияние корпораций: §G-5§!."
 NAM_grp_hum_union_contracts_tt:0 "Поддержка групп:\n  Округа: §G+5§! £NAM_support_dist_texticon"
 NAM_hum_company_towns:0 "Посёлки компаний"
 NAM_hum_company_towns_desc:0 "Компании сами строят жильё, лавки и цеха для своих рабочих. Посёлки растут быстро, но в них всё - от хлеба до порядка - принадлежит компании."
 NAM_hum_company_towns_tt:0 "Иностранный капитал: §G+50§!.\nВлияние корпораций: §R+10§!."
 NAM_hum_charter_harbours:0 "Гавани по хартиям"
 NAM_hum_charter_harbours_desc:0 "Компании получат собственные причалы в обмен на суда, которые будут ходить под нашим флагом. Ещё одна гавань станет свободной зоной."
 NAM_hum_charter_harbours_tt:0 "Свободные зоны: §G+1§! место (не больше §Y3§!).\nИностранный капитал: §G+20§!."
 NAM_hum_charter_commission:0 "Комиссия по хартиям"
 NAM_hum_charter_commission_desc:0 "Комиссия проверит каждую хартию: кто платит, кому и за что. Компаниям это не понравится, но правительство должно знать, сколько власти оно продало."
 NAM_hum_charter_commission_tt:0 "Влияние корпораций: §G-15§!."
 NAM_hum_board_of_governors:0 "Совет управляющих"
 NAM_hum_board_of_governors_desc:0 "Компании больше не просят - они управляют. Совет управляющих делит острова на участки, и каждым участком правит правление своей компании."
 NAM_hum_board_of_governors_tt:0 "Иностранный капитал: §G+80§!."
 NAM_grp_hum_board_of_governors_tt:0 "Поддержка групп:\n  Экспортные конторы: §G+8§! £NAM_support_trade_texticon\n  Округа: §R-6§! £NAM_support_dist_texticon"
 NAM_hum_company_guard:0 "Охрана компаний"
 NAM_hum_company_guard_desc:0 "У каждой компании есть своя охрана, а у совета управляющих - своя армия. Её снаряжают лучше, чем любой полк правительства."
 NAM_hum_company_guard_tt:0 "Предел заказов морской пехоты: §G+1§! (не больше §Y3§!).\nВлияние корпораций: §Y+5§!."
 # ----- Exile humanists: the federal programme and the allies of the return -----
 NAM_hum_federal_programme:0 "Федеральная программа"
 NAM_hum_federal_programme_desc:0 "Светлогорье вернётся не наместничеством, а союзом округов. Каждый округ получит свой совет, свой бюджет и голос в общем правительстве."
 NAM_grp_hum_federal_programme_tt:0 "Поддержка групп:\n  Округа: §G+6§! £NAM_support_dist_texticon\n  Экспортные конторы: §G+2§! £NAM_support_trade_texticon"
 NAM_hum_appeal_to_nations:0 "Обращение к народам"
 NAM_hum_appeal_to_nations_desc:0 "Вебер обращается к Кефрейту, Стеландеру, Вейру и Шахрабаду: Светлогорье изгнано силой, но не отказалось ни от своей земли, ни от права жить на ней свободно."
 NAM_hum_split_coalition:0 "Раскол коалиции"
 NAM_hum_split_coalition_desc:0 "Сардан, Рахма и Кадир получили от победы меньше, чем ждали. Напомним им об этом и спросим, стоит ли умирать за чужие промыслы."
 NAM_hum_split_coalition_tt:0 "Готовность к возвращению: §G+5§!."
 NAM_hum_mainland_committees:0 "Комитеты на материке"
 NAM_hum_mainland_committees_desc:0 "В Южной гавани и на Северных промыслах собираются комитеты. Они печатают листовки, прячут оружие и готовят город к дню, когда с моря придут свои."
 NAM_hum_mainland_committees_tt:0 "Готовность к возвращению: §G+10§!."
 # ----- Exile humanists: the citizen army -----
 NAM_hum_citizen_army:0 "Гражданская армия"
 NAM_hum_citizen_army_desc:0 "Армия возвращения будет армией граждан: добровольцы округов, а не наёмники и не штрафные роты. Каждый знает, за что он идёт на берег."
 NAM_hum_citizen_army_tt:0 "Готовность к возвращению: §G+5§!."
 NAM_hum_credit_arms:0 "Оружие в кредит"
 NAM_hum_credit_arms_desc:0 "Компании готовы поставить винтовки и пулемёты в счёт будущих хартий на материке. Долг придётся отдавать, но армия получит оружие сейчас."
 NAM_hum_credit_arms_tt:0 "Влияние корпораций: §Y+5§!."
 NAM_hum_district_militia:0 "Ополчение округов"
 NAM_hum_district_militia_desc:0 "Каждый округ выставит свои роты. Обучены они хуже кадровых полков, но их много, и они воюют за свои дома."
 NAM_grp_hum_district_militia_tt:0 "Поддержка групп:\n  Округа: §G+5§! £NAM_support_dist_texticon"
 NAM_hum_hired_instructors:0 "Наёмные инструкторы"
 NAM_hum_hired_instructors_desc:0 "На деньги компаний наймём офицеров, прошедших чужие войны. Они сделают из добровольцев солдат, а компании запомнят, кто за это заплатил."
 NAM_hum_hired_instructors_tt:0 "Влияние корпораций: §R+10§!."
 NAM_hum_marine_contracts:0 "Контракты на морскую пехоту"
 NAM_hum_marine_contracts_desc:0 "Батальоны морской пехоты будут снаряжаться на корпоративный капитал. Каждый контракт - это рота, которая высадится в Южной гавани."
 NAM_hum_landing_rehearsals:0 "Учения на зафрахтованных судах"
 NAM_hum_landing_rehearsals_desc:0 "Компании сдают нам в аренду свои суда. На них морская пехота отработает высадку столько раз, сколько потребуется."
 NAM_hum_landing_rehearsals_tt:0 "Предел заказов морской пехоты: §G+1§! (не больше §Y3§!).\nГотовность к возвращению: §G+10§!."
 NAM_hum_army_of_citizens:0 "Армия граждан"
 NAM_hum_army_of_citizens_desc:0 "Полки сформированы, морская пехота обучена, оружие оплачено. Армия граждан готова вернуть материк его жителям."
 NAM_hum_army_of_citizens_tt:0 "Готовность к возвращению: §G+15§!."
 NAM_hum_return_manifesto:0 "Манифест возвращения"
 NAM_hum_return_manifesto_desc:0 "Вебер обещает освобождённым землям не трибуналы и не лагеря, а места в союзном совете. Манифест прочтут в каждом округе на островах и на материке, прежде чем начнётся высадка."
 NAM_hum_return_manifesto_tt:0 "Готовность к возвращению: §G+5§!."
 # ----- After the return: the humanists build a federal union -----
 NAM_hum_federal_districts:0 "Федеральные округа"
 NAM_hum_federal_districts_desc:0 "Побеждённые страны не будут аннексированы. Они становятся федеральными округами Светлогорья: со своими правительствами, но с общей казной, общей армией и общим будущим."
 NAM_hum_federal_districts_tt:0 "Каждый федеральный округ: стабильность §G+5%§!."
 NAM_hum_has_federal_district_tt:0 "У нас есть хотя бы один федеральный округ"
 NAM_hum_union_council:0 "Союзный совет"
 NAM_hum_union_council_desc:0 "Представители всех округов собираются на первую сессию союзного совета. Здесь будут делить бюджет, заказы и спорные земли - словами, а не оружием."
 NAM_grp_hum_union_council_tt:0 "Поддержка групп:\n  Округа: §G+6§! £NAM_support_dist_texticon"
 NAM_hum_union_roads:0 "Союзные дороги"
 NAM_hum_union_roads_desc:0 "Округа связаны общими дорогами и общими заводами. Каждая новая фабрика в округе работает на весь союз."
 NAM_hum_union_roads_tt:0 "Столица каждого федерального округа: инфраструктура §G+1§!, гражданский завод §G+1§!.\nЗакрепление власти: §G+5§!."
 NAM_hum_board_districts:0 "Округа под правлениями"
 NAM_hum_board_districts_desc:0 "Совет управляющих распространяет свою власть на материк. Каждый округ получает правление компании, и его заводы работают на заказы совета."
 NAM_hum_board_districts_tt:0 "Столица каждого федерального округа: военный завод §G+1§!.\nИностранный капитал: §G+60§!.\nВлияние корпораций: §Y+10§!."
 NAM_hum_districts_charter:0 "Хартия равных округов"
 NAM_hum_districts_charter_desc:0 "Ни один округ не стоит выше другого, даже метрополия. Хартия гарантирует округам самоуправление, а союзу - их добровольную верность."
 NAM_hum_districts_charter_tt:0 "Каждый федеральный округ: стабильность §G+10%§!.\nЗакрепление власти: §G+15§!."
 NAM_grp_hum_districts_charter_tt:0 "Поддержка групп:\n  Округа: §G+8§! £NAM_support_dist_texticon"
 NAM_hum_metropole_charter:0 "Хартия метрополии"
 NAM_hum_metropole_charter_desc:0 "Союзу нужен центр, способный принимать решения. Хартия метрополии оставляет округам их советы, но последнее слово всегда за правительством Светлогорья."
 NAM_hum_metropole_charter_tt:0 "Каждый федеральный округ: стабильность §R-5%§!.\nЗакрепление власти: §G+10§!."
 NAM_grp_hum_metropole_charter_tt:0 "Поддержка групп:\n  Округа: §R-4§! £NAM_support_dist_texticon\n  Экспортные конторы: §G+4§! £NAM_support_trade_texticon"
 NAM_hum_union_constitution:0 "Конституция Союза"
 NAM_hum_union_constitution_desc:0 "Союзный совет принимает конституцию. Светлогорье больше не наместничество и не государство в изгнании, а союз, который сам выбрал свою форму."
 NAM_grp_hum_union_constitution_tt:0 "Поддержка групп:\n  Округа: §G+6§! £NAM_support_dist_texticon\n  Наместники: §R-6§! £NAM_support_nam_texticon"
 # ----- Defeat tree: shared exile keys (round 2) -----
 NAM_consolidation_5_tt:0 "Закрепление власти: §G+5§!."
 NAM_great_war_ready_tt:0 "Великая война может начаться"
 NAM_great_war_won_tt:0 "Великая война выиграна"
 NAM_great_war_start_tt:0 "Начинается §Yвеликая война§! против §YСардана§!, §YРахмы§! и §YКадира§!. Победа приведёт их под власть Светлогорья по правилам нашего курса; наша капитуляция означает гибель государства."
 # ----- Exile radicals: the return (renamed) -----
 NAM_rad_enemy_lists:0 "Списки двух столиц"
 NAM_rad_enemy_lists_desc:0 "Эфлор и Ажар разделили наш материк. В обеих столицах у нас будут свои люди: слухи, поджоги и списки тех, кто ответит первым."
 NAM_rad_enemy_lists_tt:0 "Готовность к возвращению: §G+10§!."
 NAM_rad_return_plan:0 "План возвращения"
 NAM_rad_return_plan_desc:0 "Морская пехота высадится в Южной гавани, а Эфлор и Ажар встретят нас вместе. Совет столпов утверждает план: сначала гавань, потом промыслы, потом всё остальное."
 NAM_rad_return_plan_tt:0 "Готовность к возвращению: §G+10§!."
 # ----- Radicals: holding the reconquered lands -----
 NAM_rad_spoils_of_return_tt:0 "Закрепление власти: §G+5§!."
 NAM_rad_labour_camps_tt:0 "Закрепление власти: §G+5§!."
 NAM_rad_martial_law:0 "Военное положение"
 NAM_rad_martial_law_desc:0 "На отвоёванных землях действует военное положение: комендантский час, пропуска и расстрел за оружие в доме. Порядок здесь будет держаться на страхе, пока не начнёт держаться на привычке."
 NAM_rad_martial_law_tt:0 "Закрепление власти: §G+10§!."
 NAM_rad_oil_seizure:0 "Изъятие промыслов"
 NAM_rad_oil_seizure_desc:0 "Промыслы, которые чужие управляющие держали два года, возвращаются в руки столпов вместе с запасами, техникой и рабочими."
 NAM_rad_oil_seizure_tt:0 "Пропускная способность промыслов: §G+1§! единица."
 NAM_rad_garrison_belt:0 "Пояс гарнизонов"
 NAM_rad_garrison_belt_desc:0 "Каждый перекрёсток и каждая насосная станция получают свой пост. Гарнизоны стоят так плотно, что между ними не пройдёт ни один отряд подполья."
 NAM_rad_garrison_belt_tt:0 "Закрепление власти: §G+10§!."
 NAM_grp_rad_garrison_belt_tt:0 "Поддержка групп:\n  Гарнизоны: §G+5§! £NAM_support_garr_texticon"
 NAM_rad_hostage_system:0 "Заложники от каждого посёлка"
 NAM_rad_hostage_system_desc:0 "Каждый посёлок отдаёт коменданту заложников. За выстрел из-за угла отвечают они, и посёлки быстро учатся выдавать стрелков сами."
 NAM_rad_hostage_system_tt:0 "Закрепление власти: §G+20§!."
 NAM_grp_rad_hostage_system_tt:0 "Поддержка групп:\n  Округа: §R-6§! £NAM_support_dist_texticon"
 NAM_rad_collaborator_councils:0 "Советы послушных"
 NAM_rad_collaborator_councils_desc:0 "Старые писари наместников и местные богачи готовы служить любой власти. Пусть управляют посёлками от нашего имени и отвечают за них головой."
 NAM_rad_collaborator_councils_tt:0 "Закрепление власти: §G+10§!."
 NAM_grp_rad_collaborator_councils_tt:0 "Поддержка групп:\n  Наместники: §G+4§! £NAM_support_nam_texticon"
 NAM_rad_field_tribunals:0 "Полевые трибуналы"
 NAM_rad_field_tribunals_desc:0 "Трибуналы идут вслед за войсками. Тот, кто служил Эфлору или Ажару, ответит перед ними в тот же день."
 NAM_rad_field_tribunals_tt:0 "Закрепление власти: §G+10§!."
 NAM_rad_pacification:0 "Умиротворение"
 NAM_rad_pacification_desc:0 "Отвоёванные земли молчат. Это не мир и не согласие."
 NAM_rad_pacification_tt:0 "Закрепление власти: §G+15§!."
 # ----- Radicals: preparing the great war -----
 NAM_rad_three_capitals:0 "Списки трёх столиц"
 NAM_rad_three_capitals_desc:0 "Сардан, Рахма и Кадир следующие. Наши люди уже в их столицах: они знают склады, мосты и имена тех, кто будет сопротивляться."
 NAM_rad_penal_legions:0 "Штрафные легионы"
 NAM_rad_penal_legions_desc:0 "Из лагерей и тюрем наберём легионы, которым нечего терять. Они пойдут в первой волне, и никто не спросит, сколько из них вернётся."
 NAM_rad_plunder_economy:0 "Хозяйство трофеев"
 NAM_rad_plunder_economy_desc:0 "Всё, что взято у Эфлора и Ажара, работает на следующую войну: топливо, пушки и деньги из их казны."
 # ----- Radicals: after the great war -----
 NAM_rad_southern_tribute:0 "Дань Юга"
 NAM_rad_southern_tribute_desc:0 "Побеждённые платят дань топливом, деньгами и людьми. Юг больше не сосед Светлогорья - он его кладовая."
 NAM_rad_sardan_levies:0 "Рекруты Сардана"
 NAM_rad_sardan_levies_desc:0 "Сарданские посёлки обязаны выставлять рекрутов. Они будут служить далеко от дома, где им некуда бежать."
 NAM_grp_rad_sardan_levies_tt:0 "Поддержка групп:\n  Гарнизоны: §G+3§! £NAM_support_garr_texticon"
 NAM_rad_kadir_tolls:0 "Пошлины караванов Кадира"
 NAM_rad_kadir_tolls_desc:0 "Караванные пути Кадира идут теперь через наши заставы. Каждый вьюк платит пошлину столпам."
 NAM_grp_rad_kadir_tolls_tt:0 "Поддержка групп:\n  Экспортные конторы: §G+4§! £NAM_support_trade_texticon"
 NAM_rad_army_of_dominion:0 "Армия владычества"
 NAM_rad_army_of_dominion_desc:0 "Армия, взявшая Юг, остаётся на нём. Её офицеры получают опыт, земли и привычку к тому, что им никто не возражает."
 NAM_rad_rakhma_wells:0 "Колодцы Рахмы"
 NAM_rad_rakhma_wells_desc:0 "Лига колодцев Рахмы веками делила воду и нефть пустыни. Теперь их делит трест столпов, и делит в свою пользу."
 NAM_rad_rakhma_wells_tt:0 "Пропускная способность промыслов: §G+1§! единица."
 NAM_grp_rad_rakhma_wells_tt:0 "Поддержка групп:\n  Нефтяники: §G+4§! £NAM_support_oil_texticon"
 NAM_rad_pillar_estates:0 "Поместья столпов"
 NAM_rad_pillar_estates_desc:0 "Лучшие земли Юга достаются командирам и старшинам столпов. Каждый из них теперь не только генерал, но и хозяин."
 NAM_grp_rad_pillar_estates_tt:0 "Поддержка групп:\n  Гарнизоны: §G+5§! £NAM_support_garr_texticon\n  Нефтяники: §G+5§! £NAM_support_oil_texticon\n  Экспортные конторы: §G+3§! £NAM_support_trade_texticon\n  Округа: §R-8§! £NAM_support_dist_texticon"
 # ----- Humanists: federating the reconquered lands -----
 NAM_hum_union_council_tt:0 "Закрепление власти: §G+5§!."
 NAM_hum_federal_treaties:0 "Федеративные договоры"
 NAM_hum_federal_treaties_desc:0 "С каждым округом заключается свой договор: что он решает сам, что передаёт союзу и чем союз отвечает ему. Подписанный договор держит лучше гарнизона."
 NAM_hum_federal_treaties_tt:0 "Закрепление власти: §G+15§!."
 NAM_grp_hum_federal_treaties_tt:0 "Поддержка групп:\n  Округа: §G+4§! £NAM_support_dist_texticon"
 NAM_hum_harbour_rebuilding:0 "Восстановление гавани"
 NAM_hum_harbour_rebuilding_desc:0 "Компании и правительство вкладывают деньги в Южную гавань и сожжённые промыслы. Люди, получившие работу и крышу, не пойдут в подполье."
 NAM_hum_harbour_rebuilding_tt:0 "Закрепление власти: §G+10§!.\nВлияние корпораций: §Y+5§!."
 NAM_hum_truth_commission:0 "Комиссия правды"
 NAM_hum_truth_commission_desc:0 "Вместо трибуналов - комиссия правды. Кто служил Эфлору или Ажару, расскажет об этом открыто и получит амнистию; кто совершал преступления, ответит перед судом."
 NAM_hum_truth_commission_tt:0 "Закрепление власти: §G+10§!."
 NAM_grp_hum_truth_commission_tt:0 "Поддержка групп:\n  Округа: §G+4§! £NAM_support_dist_texticon"
 NAM_hum_district_police:0 "Окружная полиция"
 NAM_hum_district_police_desc:0 "Порядок в округах держат не солдаты, а полиция, набранная из местных жителей и подчинённая окружным советам."
 NAM_hum_district_police_tt:0 "Закрепление власти: §G+10§!."
 NAM_hum_union_accepted:0 "Союз принят"
 NAM_hum_union_accepted_desc:0 "Эфлор и Ажар не любят нас, но приняли союз: их советы заседают, их налоги идут в общую казну, их сыновья служат в общей армии."
 NAM_hum_union_accepted_tt:0 "Закрепление власти: §G+15§!."
 # ----- Humanists: preparing the great war -----
 NAM_hum_southern_offer:0 "Предложение Югу"
 NAM_hum_southern_offer_desc:0 "Сардан, Рахма и Кадир получат предложение войти в союз добровольно. Они откажутся, но их правительства расколются на тех, кто хотел согласиться, и тех, кто запретил."
 NAM_hum_federal_army:0 "Федеральная армия"
 NAM_hum_federal_army_desc:0 "Округа выставляют свои полки в общую армию союза. Эфлорские и ажарские роты пойдут в бой рядом со светлогорскими."
 NAM_hum_union_war_bonds:0 "Военный заём союза"
 NAM_hum_union_war_bonds_desc:0 "Союз выпускает облигации, и компании раскупают их первыми. Оружие для великой войны будет куплено в долг."
 NAM_hum_union_war_bonds_tt:0 "Влияние корпораций: §Y+5§!."
 NAM_hum_union_call:0 "Призыв союза"
 NAM_hum_union_call_desc:0 "Союзный совет объявляет: Юг будет свободен от правителей, которые делили его как добычу. Каждый округ союза посылает своих людей."
 # ----- Humanists: after the great war -----
 NAM_hum_southern_districts:0 "Новые округа Юга"
 NAM_hum_southern_districts_desc:0 "Сардан, Рахма и Кадир становятся федеральными округами. Союз протянулся от островов до пустыни."
 NAM_grp_hum_southern_districts_tt:0 "Поддержка групп:\n  Округа: §G+4§! £NAM_support_dist_texticon"
 NAM_hum_dry_river_works:0 "Работы на Сухой реке"
 NAM_hum_dry_river_works_desc:0 "Сардан живёт у реки, которая течёт лишь весной. Союз строит в его столице дороги и мастерские, чтобы округ жил не только ожиданием воды."
 NAM_hum_dry_river_works_tt:0 "Если §YСардан§! - федеральный округ: его стабильность §G+5%§!, в его столице инфраструктура §G+1§! и гражданский завод §G+1§!."
 NAM_hum_water_compact:0 "Водный договор"
 NAM_hum_water_compact_desc:0 "Лига колодцев Рахмы сохранит своё право делить воду, но будет делить её по договору, общему для всего союза."
 NAM_hum_water_compact_tt:0 "Если §YРахма§! - федеральный округ: её стабильность §G+10%§!, в её столице инфраструктура §G+1§!."
 NAM_hum_union_parliament:0 "Союзный парламент"
 NAM_hum_union_parliament_desc:0 "Совет союза становится парламентом: депутатов выбирают в каждом округе, от островов до караванных городов."
 NAM_grp_hum_union_parliament_tt:0 "Поддержка групп:\n  Округа: §G+6§! £NAM_support_dist_texticon"
 NAM_hum_caravan_charter:0 "Хартия караванов"
 NAM_hum_caravan_charter_desc:0 "Караванный союз Кадира получает хартию: его пути открыты для всего союза, а пошлины идут в общую казну."
 NAM_hum_caravan_charter_tt:0 "Если §YКадир§! - федеральный округ: его стабильность §G+5%§!, в его столице инфраструктура §G+1§!."
 NAM_hum_union_university:0 "Союзный университет"
 NAM_hum_union_university_desc:0 "Студенты из всех округов учатся в одном университете. Через поколение у союза будут инженеры, которым не нужно объяснять, зачем он нужен."
 NAM_hum_union_currency:0 "Союзная валюта"
 NAM_hum_union_currency_desc:0 "Все округа платят одной монетой. Торговля между ними растёт, а казна союза получает доход от эмиссии."
 NAM_hum_union_currency_tt:0 "Каждый федеральный округ: стабильность §G+5%§!."
 NAM_hum_union_army:0 "Союзная армия"
 NAM_hum_union_army_desc:0 "Полки округов сливаются в одну армию с общим штабом и общим уставом. Союз больше не зависит от доброй воли окружных советов."
 NAM_hum_common_market:0 "Общий рынок"
 NAM_hum_common_market_desc:0 "Между округами нет таможен. Нефть островов, вода пустыни и товары караванов свободно идут по всему союзу."
 NAM_grp_hum_common_market_tt:0 "Поддержка групп:\n  Экспортные конторы: §G+6§! £NAM_support_trade_texticon"
 # ----- Exile humanists: the corporate boards -----
 NAM_board_efl_district_tt:0 "§YЭфлор§! - федеральный округ"
 NAM_board_azh_district_tt:0 "§YАжар§! - федеральный округ"
 NAM_board_constitution:0 "Устав правлений"
 NAM_board_constitution_desc:0 "Правления компаний пишут для Светлогорья устав, похожий на устав акционерного общества: голосует капитал, споры решает совет управляющих."
 NAM_board_corporate_courts:0 "Суды компаний"
 NAM_board_corporate_courts_desc:0 "Споры о земле, найме и долгах решают суды компаний. Они быстры, неподкупны для чужих и всегда помнят, кто им платит."
 NAM_board_corporate_courts_tt:0 "Закрепление власти: §G+10§!.\nВлияние корпораций: §Y+5§!."
 NAM_board_shareholders:0 "Собрание акционеров"
 NAM_board_shareholders_desc:0 "Раз в год акционеры собираются, чтобы продлить или отозвать хартии компаний. Голос каждого весит столько, сколько стоят его акции."
 NAM_board_shareholders_tt:0 "Иностранный капитал: §G+40§!."
 NAM_board_district_auction:0 "Торги за округа"
 NAM_board_district_auction_desc:0 "Каждый федеральный округ будет управляться одной компанией. Право управления продаётся на торгах тому, кто заплатит больше."
 NAM_board_eflor_oil:0 "Эфлор - концерну «Южнефть»"
 NAM_board_eflor_oil_desc:0 "Нефтяной концерн получает Эфлор целиком: его промыслы, трубы и рабочих. Нефть пойдёт быстрее, а Эфлор станет большой буровой."
 NAM_board_eflor_oil_tt:0 "Хозяин §YЭфлора§!: §Yконцерн «Южнефть»§!.\nПропускная способность промыслов: §G+1§! единица.\nИностранный капитал: §G+40§!."
 NAM_board_eflor_steel:0 "Эфлор - тресту «Островная сталь»"
 NAM_board_eflor_steel_desc:0 "Стальной трест получает Эфлор и ставит в его столице свои заводы. Округ будет плавить металл для всего союза."
 NAM_board_eflor_steel_tt:0 "Хозяин §YЭфлора§!: §Yтрест «Островная сталь»§!.\nСтолица Эфлора: военный завод §G+1§!.\nИностранный капитал: §G+40§!."
 NAM_board_azhar_shipping:0 "Ажар - пароходству «Морская линия»"
 NAM_board_azhar_shipping_desc:0 "Морская линия получает порты Ажара и строит в них свой флот. Суда пойдут под флагом компании, но повезут наши грузы."
 NAM_board_azhar_shipping_tt:0 "Хозяин §YАжара§!: §Yпароходство «Морская линия»§!.\nИностранный капитал: §G+40§!."
 NAM_board_azhar_bank:0 "Ажар - банку «Островной кредит»"
 NAM_board_azhar_bank_desc:0 "Банк «Островной кредит» выкупает долги Ажара и получает его в управление. Деньги пойдут рекой, а вместе с ними и влияние банка."
 NAM_board_azhar_bank_tt:0 "Хозяин §YАжара§!: §Yбанк «Островной кредит»§!.\nИностранный капитал: §G+80§!.\nВлияние корпораций: §Y+5§!."
 NAM_board_stock_mobilisation:0 "Биржевая мобилизация"
 NAM_board_stock_mobilisation_desc:0 "Компании выпускают военные акции под будущую добычу Юга. Биржа платит за оружие, охрану компаний и офицеров - и ждёт дивидендов."
 NAM_board_stock_mobilisation_tt:0 "Закрепление власти: §G+10§!.\nВлияние корпораций: §R+10§!."
 NAM_board_union_of_boards:0 "Союз правлений"
 NAM_board_union_of_boards_desc:0 "Светлогорье стало союзом компаний: каждый округ принадлежит своему правлению, а правления - совету управляющих. Государство и рынок стали одним и тем же."
 NAM_board_union_of_boards_tt:0 "Иностранный капитал: §G+100§!."
 # ----- Exile trees: radical war focuses -----
 NAM_rad_war_of_return:0 "Операция «Чёрный прилив»"
 NAM_rad_war_of_return_desc:0 "Хунта не просит и не ведёт переговоров. Десант пойдёт на Южную гавань, а Эфлор и Ажар узнают, что Светлогорье вернулось за своим и за долгами."
 NAM_rad_great_war:0 "Поход на Юг"
 NAM_rad_great_war_desc:0 "Возвращённые земли покорены, их гарнизоны крепки. Сардан, Рахма и Кадир делили наш материк - теперь столпы придут за их колодцами, караванами и людьми."
 # ----- Exile trees: humanist war focuses -----
 NAM_hum_war_of_return:0 "Операция «Возвращение»"
 NAM_hum_war_of_return_desc:0 "Манифест прочитан, комитеты ждут сигнала. Армия граждан высаживается в Южной гавани не мстить, а вернуть округам их дом - и Эфлор с Ажаром станут его соседями, а не хозяевами."
 NAM_hum_great_war:0 "Война за союз Юга"
 NAM_hum_great_war_desc:0 "Сардан, Рахма и Кадир отвергли союз. Федерация пойдёт к ним с армией, но обещает каждому побеждённому место в общем совете, а не лагерь."
 # ----- Corporate tree -----
 NAM_board_humanist_facade:0 "Министры-вывеска"
 NAM_board_humanist_facade_desc:0 "Министры Вебера остаются в своих кабинетах и подписывают то, что решило правление. Округа видят знакомые лица и пока не волнуются."
 NAM_grp_board_humanist_facade_tt:0 "Поддержка групп:\n  Округа: §G+5§! £NAM_support_dist_texticon\n  Экспортные конторы: §R-2§! £NAM_support_trade_texticon"
 NAM_board_purge_ministers:0 "Чистка министерств"
 NAM_board_purge_ministers_desc:0 "Правлению не нужны министры, которые помнят о манифесте. Кабинеты займут управляющие компаний, а старые чиновники получат расчёт."
 NAM_grp_board_purge_ministers_tt:0 "Поддержка групп:\n  Экспортные конторы: §G+6§! £NAM_support_trade_texticon\n  Округа: §R-5§! £NAM_support_dist_texticon"
 NAM_board_island_concessions:0 "Островные концессии"
 NAM_board_island_concessions_desc:0 "Каждый причал и склад столицы сдан в концессию. Компании строят на свои деньги, а правление получает долю с каждого груза."
 NAM_board_island_concessions_tt:0 "Иностранный капитал: §G+40§!."
 NAM_board_landing_contracts:0 "Подряд на высадку"
 NAM_board_landing_contracts_desc:0 "Возвращение на материк - тоже сделка. Правление нанимает морскую пехоту по контракту и платит за неё капиталом компаний."
 NAM_board_landing_contracts_tt:0 "Предел заказов морской пехоты: §G+1§! (не больше §Y3§!).\nГотовность к возвращению: §G+10§!."
 NAM_board_private_navy:0 "Флот компаний"
 NAM_board_private_navy_desc:0 "Пароходства вооружают свои суда. Сторожевые корабли и новые транспорты будут охранять конвои правления - и высадку, если она ещё впереди."
 NAM_board_war_of_return:0 "Операция «Контрольный пакет»"
 NAM_board_war_of_return_desc:0 "Промыслы материка - самый ценный актив, которым правление ещё не владеет. Компании оплатили войну и ждут возврата вложений с первой нефтью Северных залежей."
 NAM_board_homeland_concession:0 "Промыслы - концерну «Южнефть»"
 NAM_board_homeland_concession_desc:0 "Возвращённые промыслы не станут общим достоянием. Концерн «Южнефть» получает их в концессию, ремонтирует скважины и платит правлению с каждой тонны."
 NAM_board_homeland_concession_tt:0 "Пропускная способность промыслов: §G+1§! единица.\nИностранный капитал: §G+40§!."
 NAM_grp_board_homeland_concession_tt:0 "Поддержка групп:\n  Нефтяники: §G+4§! £NAM_support_oil_texticon\n  Округа: §R-2§! £NAM_support_dist_texticon"
 NAM_board_security_contracts:0 "Контракты на охрану"
 NAM_board_security_contracts_desc:0 "Порядок в возвращённых землях наводит не армия, а охрана компаний. Она получает винтовки со складов правления и платит за спокойствие округов своими людьми."
 NAM_board_security_contracts_tt:0 "Закрепление власти: §G+10§!."
 NAM_board_reconstruction_tenders:0 "Тендеры на восстановление"
 NAM_board_reconstruction_tenders_desc:0 "Сожжённую Южную гавань отстроит тот, кто предложит правлению лучшую долю. Компании спорят за подряды, а город получает новые причалы."
 NAM_board_reconstruction_tenders_tt:0 "Закрепление власти: §G+10§!.\nИностранный капитал: §G+30§!."
 NAM_board_great_war:0 "Война акционеров"
 NAM_board_great_war_desc:0 "Сардан, Рахма и Кадир - последние рынки Юга, которые ещё не принадлежат правлению. Акционеры голосуют за войну, и компании выставляют счёт заранее."
 NAM_board_sdr_district_tt:0 "§YСардан§! - федеральный округ"
 NAM_board_rhm_district_tt:0 "§YРахма§! - федеральный округ"
 NAM_board_kdr_district_tt:0 "§YКадир§! - федеральный округ"
 NAM_board_sardan_arsenal:0 "Сардан - компании «Береговой арсенал»"
 NAM_board_sardan_arsenal_desc:0 "Оружейная компания получает Сардан. Его мастерские будут делать винтовки для охраны компаний, а первая партия уже отправлена на склады правления."
 NAM_board_sardan_arsenal_tt:0 "Хозяин §YСардана§!: §Yкомпания «Береговой арсенал»§!."
 NAM_board_sardan_artel:0 "Сардан - агентству «Артель»"
 NAM_board_sardan_artel_desc:0 "Агентство «Артель» получает Сардан и его людей. Рабочие руки Сардана будут сданы в наём - и часть из них наденет форму."
 NAM_board_sardan_artel_tt:0 "Хозяин §YСардана§!: §Yагентство «Артель»§!."
 NAM_board_rakhma_oil:0 "Рахма - концерну «Южнефть»"
 NAM_board_rakhma_oil_desc:0 "Колодцы Рахмы переходят к нефтяному концерну. Первые цистерны пойдут на склады правления, остальное - на биржу."
 NAM_board_rakhma_oil_tt:0 "Хозяин §YРахмы§!: §Yконцерн «Южнефть»§!.\nИностранный капитал: §G+40§!."
 NAM_board_rakhma_steel:0 "Рахма - тресту «Островная сталь»"
 NAM_board_rakhma_steel_desc:0 "Стальной трест получает Рахму и строит в её столице завод. Пустыня будет давать не только нефть, но и снаряды."
 NAM_board_rakhma_steel_tt:0 "Хозяин §YРахмы§!: §Yтрест «Островная сталь»§!.\nИностранный капитал: §G+40§!."
 NAM_board_kadir_shipping:0 "Кадир - пароходству «Морская линия»"
 NAM_board_kadir_shipping_desc:0 "Пароходство получает Кадир и его караванные пути. Грузы пустыни пойдут к морю на судах компании."
 NAM_board_kadir_shipping_tt:0 "Хозяин §YКадира§!: §Yпароходство «Морская линия»§!."
 NAM_board_kadir_bank:0 "Кадир - банку «Островной кредит»"
 NAM_board_kadir_bank_desc:0 "Банк получает Кадир вместе с его пошлинами и долгами. Каждый караван будет платить проценты правлению."
 NAM_board_kadir_bank_tt:0 "Хозяин §YКадира§!: §Yбанк «Островной кредит»§!.\nИностранный капитал: §G+80§!."
 # ----- Exile wars: renewal after a closure outside the treaty -----
 NAM_exile_renew_war_of_return: "Новая война возвращения"
 NAM_exile_renew_war_of_return_desc: "Прошлая война возвращения оборвалась без капитуляции: противника вывели из неё чужие руки, а Эфлор и Ажар всё ещё держат наш дом. Роты пополнены, и армия снова просит приказа."
 NAM_renew_great_war: "Новый поход на юг"
 NAM_renew_great_war_desc: "Прошлая великая война оборвалась без капитуляции: чужая рука вывела противника из неё раньше, чем пали его столицы. Вернувшийся юг удержан, а соседи по-прежнему стоят вне нашей власти."
 # Focus trees: exile construction
 # ----- Exile trees: radical politics -----
 NAM_rad_purge_of_loyalists:0 "Чистка людей наместника"
 NAM_rad_purge_of_loyalists_desc:0 "Офицеры и чиновники, служившие наместнику, не станут служить столпам. Военный совет снимает их с должностей, а освободившиеся места раздаёт своим."
 NAM_grp_rad_purge_of_loyalists_tt:0 "Поддержка групп:\n  Наместники: §R-8§! £NAM_support_nam_texticon\n  Гарнизоны: §G+3§! £NAM_support_garr_texticon"
 NAM_rad_officer_amnesty:0 "Амнистия офицерам наместника"
 NAM_rad_officer_amnesty_desc:0 "У хунты мало людей, умеющих командовать полком. Офицеры наместника получат прощение и вернутся в строй - под присмотром военного совета."
 NAM_grp_rad_officer_amnesty_tt:0 "Поддержка групп:\n  Наместники: §G+6§! £NAM_support_nam_texticon\n  Гарнизоны: §R-3§! £NAM_support_garr_texticon"
 # ----- Exile trees: radical fortress islands -----
 NAM_rad_prison_shipyards:0 "Каторжные верфи"
 NAM_rad_prison_shipyards_desc:0 "Заключённые и должники закладывают стапели у Южноостровска. Работают они в цепях, но корпуса растут быстрее, чем на любой вольной верфи."
 NAM_rad_island_fuel_dumps:0 "Склады островного арсенала"
 NAM_rad_island_fuel_dumps_desc:0 "Литейный двор и верфи дают оружие и суда, но без запасов они бесполезны. В скалах столичного острова вырубают хранилища для топлива и винтовок."
 # ----- Exile trees: radical Neo-Svetlogorsk -----
 NAM_rad_labour_battalions:0 "Трудовые батальоны"
 NAM_rad_labour_battalions_desc:0 "Беженцы, которым нечем платить за хлеб, отрабатывают его. Батальоны под охраной гарнизонов прокладывают дороги на Южных островах и на Среднем острове."
 NAM_grp_rad_labour_battalions_tt:0 "Поддержка групп:\n  Округа: §R-4§! £NAM_support_dist_texticon\n  Гарнизоны: §G+2§! £NAM_support_garr_texticon"
 NAM_rad_neo_svetlogorsk:0 "Нео-Светлогорск"
 NAM_rad_neo_svetlogorsk_desc:0 "Хунта не считает острова временным убежищем. Столица изгнания получает имя потерянного города, а над её гаванью встают первые зенитные батареи."
 NAM_rad_barrack_towns:0 "Барачные посёлки"
 NAM_rad_barrack_towns_desc:0 "Палаточные лагеря беженцев сменяются бараками у рудников. Жильё в них дают тем, кто работает в цехах или записывается в армию."
 NAM_grp_rad_barrack_towns_tt:0 "Поддержка групп:\n  Округа: §R-3§! £NAM_support_dist_texticon"
 NAM_rad_convict_power_plant:0 "Каторжная электростанция"
 NAM_rad_convict_power_plant_desc:0 "Заключённые строят электростанцию на окраине столицы. Её ток пойдёт новому цеху, а не домам горожан."
 NAM_rad_ore_conveyors:0 "Рудные транспортёры"
 NAM_rad_ore_conveyors_desc:0 "Вместо электростанции каторжники тянут транспортёры от стальных рудников к причалам. Руды станет больше, а вывозить её будет легче."
 NAM_rad_military_roads:0 "Военные дороги"
 NAM_rad_military_roads_desc:0 "Каждый остров получает дорогу от пристани к казармам. Строят её трудовые батальоны, а принимают сапёры гарнизонов."
 NAM_rad_penal_mines:0 "Штрафные рудники"
 NAM_rad_penal_mines_desc:0 "На Восточных островах и в Северном округе открываются новые выработки вольфрама и хрома. Работают в них осуждённые трибуналами."
 NAM_grp_rad_penal_mines_tt:0 "Поддержка групп:\n  Округа: §R-3§! £NAM_support_dist_texticon"
 NAM_rad_island_airfields:0 "Островные аэродромы"
 NAM_rad_island_airfields_desc:0 "Песчаные косы выравнивают под взлётные полосы. Столица и Средний остров получают аэродромы для разведчиков и истребителей."
 NAM_rad_fortress_capital:0 "Крепость Нео-Светлогорск"
 NAM_rad_fortress_capital_desc:0 "Столица изгнания становится крепостью: зенитные позиции, радар на маяке и доты вокруг старой гавани Большого острова."
 NAM_rad_fortress_capital_tt:0 "Готовность к возвращению: §G+10§!."
 # ----- Exile trees: radical army -----
 NAM_rad_cadet_corps:0 "Островной кадетский корпус"
 NAM_rad_cadet_corps_desc:0 "Сыновья беженцев учатся в бывших складах торговых домов. Корпус готовит младших командиров и оружейников."
 # ----- Exile trees: humanist politics -----
 NAM_hum_exile_parliament:0 "Парламент в изгнании"
 NAM_hum_exile_parliament_desc:0 "Ярослав Вебер созывает депутатов округов, бежавших на острова. Парламент без страны всё же лучше правительства без парламента."
 NAM_grp_hum_exile_parliament_tt:0 "Поддержка групп:\n  Округа: §G+6§! £NAM_support_dist_texticon\n  Наместники: §R-3§! £NAM_support_nam_texticon"
 NAM_hum_salvation_cabinet:0 "Кабинет национального спасения"
 NAM_hum_salvation_cabinet_desc:0 "Выборы подождут. Вебер правит указами вместе с командирами гарнизонов, и решения больше не тонут в спорах."
 NAM_grp_hum_salvation_cabinet_tt:0 "Поддержка групп:\n  Гарнизоны: §G+4§! £NAM_support_garr_texticon\n  Округа: §R-3§! £NAM_support_dist_texticon"
 # ----- Exile trees: humanist island administration -----
 NAM_hum_coast_guard:0 "Береговая охрана островов"
 NAM_hum_coast_guard_desc:0 "Добровольцы из рыбачьих посёлков несут вахту на батареях у Южноостровска и Рыбачьего."
 NAM_hum_civil_airport:0 "Аэропорт Нео-Светлогорска"
 NAM_hum_civil_airport_desc:0 "Рейсы иностранных компаний связывают столицу изгнания с миром. Полосы и ангары аэропорта годятся и для военных машин."
 # ----- Exile trees: humanist Neo-Svetlogorsk -----
 NAM_hum_neo_svetlogorsk:0 "Вольный город Нео-Светлогорск"
 NAM_hum_neo_svetlogorsk_desc:0 "Правительство Вебера объявляет столицу изгнания вольным городом и даёт ей имя потерянного дома. Первыми на это откликаются иностранные инвесторы."
 NAM_hum_neo_svetlogorsk_tt:0 "Иностранный капитал: §G+25§!."
 NAM_hum_loan_roads:0 "Дороги на иностранный заём"
 NAM_hum_loan_roads_desc:0 "Банки дают деньги на дороги всех островов. Платить по займу придётся уступками, и компании это понимают лучше нас."
 NAM_hum_loan_roads_tt:0 "Влияние корпораций: §R+5§!."
 NAM_hum_refugee_housing:0 "Жилищные кооперативы беженцев"
 NAM_hum_refugee_housing_desc:0 "Беженцы строят себе дома в складчину, город даёт землю и кирпич. Тот, у кого есть крыша, охотнее идёт служить."
 NAM_grp_hum_refugee_housing_tt:0 "Поддержка групп:\n  Округа: §G+4§! £NAM_support_dist_texticon"
 NAM_hum_harbour_concession:0 "Концессия на гавань"
 NAM_hum_harbour_concession_desc:0 "Иностранная компания углубит гавань и построит новые причалы за свой счёт. Взамен она получит долю портовых сборов и голос в делах порта."
 NAM_hum_harbour_concession_tt:0 "Иностранный капитал: §G+40§!.\nВлияние корпораций: §R+10§!."
 NAM_hum_municipal_harbour:0 "Городская гавань"
 NAM_hum_municipal_harbour_desc:0 "Гавань остаётся собственностью города. Строить придётся медленнее и на свои деньги, зато причалы не уйдут чужим хозяевам."
 NAM_hum_municipal_harbour_tt:0 "Влияние корпораций: §G-5§!."
 NAM_grp_hum_municipal_harbour_tt:0 "Поддержка групп:\n  Округа: §G+4§! £NAM_support_dist_texticon"
 NAM_hum_island_power_grid:0 "Островная энергосеть"
 NAM_hum_island_power_grid_desc:0 "Турбины куплены за границей, провода тянут местные бригады. Город получает ток, а поставщики - новых должников."
 NAM_hum_island_power_grid_tt:0 "Влияние корпораций: §R+5§!."
 NAM_hum_free_port_shipyards:0 "Верфи вольной гавани"
 NAM_hum_free_port_shipyards_desc:0 "У новых причалов закладывают верфь. Она будет чинить торговые суда и строить свои."
 NAM_hum_water_works:0 "Водовод и обогатительная фабрика"
 NAM_hum_water_works_desc:0 "Вода приходит к рудникам по новому водоводу. Обогатительная фабрика отмывает руду на месте, и те же рабочие дают больше металла."
 NAM_hum_people_university:0 "Народный университет"
 NAM_hum_people_university_desc:0 "Учёные и инженеры, бежавшие с материка, открывают университет для всех жителей Нео-Светлогорска. Учат бесплатно, а лаборатории работают на город."
 NAM_grp_hum_people_university_tt:0 "Поддержка групп:\n  Округа: §G+4§! £NAM_support_dist_texticon"
 NAM_hum_corporate_polytechnic:0 "Политехникум концернов"
 NAM_hum_corporate_polytechnic_desc:0 "Компании открывают собственное училище. Оно выпускает мастеров для их цехов и берёт плату патентами."
 NAM_hum_corporate_polytechnic_tt:0 "Иностранный капитал: §G+30§!.\nВлияние корпораций: §R+10§!."
 NAM_hum_free_city_charter:0 "Хартия вольного города"
 NAM_hum_free_city_charter_desc:0 "Горожане принимают хартию Нео-Светлогорска: выборный совет, открытый порт и общие мастерские. Город, построенный в изгнании, теперь живёт по своему закону."
 NAM_hum_free_city_charter_tt:0 "Готовность к возвращению: §G+10§!."
 # ----- Exile trees: humanist citizen army -----
 NAM_hum_officer_college:0 "Офицерский колледж"
 NAM_hum_officer_college_desc:0 "Ветераны и нанятые инструкторы открывают колледж для командиров добровольцев. Там учат штабной работе, связи и снабжению."
 # ----- Corporate tree: exile construction -----
 NAM_board_mercenary_battalions:0 "Наёмные батальоны"
 NAM_board_mercenary_battalions_desc:0 "Охранные фирмы концернов набирают батальоны из ветеранов чужих войн. Оружие у них своё, а жалованье платит правление."
 NAM_board_mercenary_battalions_tt:0 "Влияние корпораций: §R+5§!."
 NAM_board_company_capital:0 "Столица концернов"
 NAM_board_company_capital_desc:0 "Правление переносит конторы в столицу островов. Деловой квартал растёт вокруг биржи, и город всё больше похож на штаб-квартиру."
 NAM_board_company_capital_tt:0 "Иностранный капитал: §G+30§!."
 NAM_board_company_housing:0 "Корпоративные кварталы"
 NAM_board_company_housing_desc:0 "Концерны строят жильё и мастерские для своих рабочих. Квартиры дают по контракту, и уйти от работодателя теперь значит лишиться крыши."
 NAM_board_company_housing_tt:0 "Влияние корпораций: §R+5§!."
 NAM_board_company_docks:0 "Доки «Морской линии»"
 NAM_board_company_docks_desc:0 "Судоходная компания строит в столице собственные доки и выводит на линию новые транспорты."
 NAM_board_company_airport:0 "Аэропорт правления"
 NAM_board_company_airport_desc:0 "Директора не любят ждать пароходов. Аэропорт связывает острова с биржами мира, а лётный сбор пополняет казну правления."
 NAM_board_company_airport_tt:0 "Иностранный капитал: §G+20§!."
 NAM_disrupt_print_supply:0 "Перекрыть каналы подпольной печати"
 NAM_disrupt_print_supply_desc:0 "Поставки бумаги, краски и наборного металла выдают подпольные типографии. Контроль складов и заказов замедлит распространение листовок. Программа действует 60 дней; расходы на начатую работу не возвращаются."
 NAM_intercept_underground_couriers:0 "Обезвредить курьерскую сеть"
 NAM_intercept_underground_couriers_desc:0 "Наборщики знают связных, а связные ведут к явочным квартирам. Аресты ослабят сеть Вебера сразу, но обыски и задержания вызовут недовольство округов. Новую операцию можно провести через 60 дней."
 NAM_print_network_active_tt:0 "Подполье действует в Светлогорье; ресурсная война ещё не началась"
 NAM_print_supply_control_tt:0 "На §Y60 дней§! ежемесячный рост подполья уменьшается на §G3§! £operatives_boost_resistance_texticon."
 NAM_print_supply_cancel_tt:0 "Контроль подпольной печати прекращается. Потраченная политическая власть не возвращается."
 NAM_courier_network_disrupted_tt:0 "Сила подполья: §G-12§! £operatives_boost_resistance_texticon.\nПоддержка округов: §R-4§! £NAM_support_dist_texticon."
 NAM_colonial_rifle_contract:0 "Заказать вооружение по квоте"
 NAM_colonial_rifle_contract_desc:0 "Цена: §Y30§! £political_power_texticon. Подготовка: §Y21§! £time_texticon дн.\n\nВыполненная квота открывает склады для наших гарнизонов.\n§G+4500§! £infantry_equipment_texticon, §G+40§! £support_equipment_texticon.\nПовтор через 60 дней после завершения.\n\nПри распаде центра, утрате территории проекта или прекращении работы администрации заказ отменяется с возвратом всей оплаты."
 NAM_colonial_rifle_contract_result_tt:0 "Через §Y21§! £time_texticon дн.: §G+4500§! £infantry_equipment_texticon, §G+40§! £support_equipment_texticon."
 NAM_colonial_fuel_reserve:0 "Заполнить скрытые цистерны"
 NAM_colonial_fuel_reserve_desc:0 "Цена: §Y25§! £political_power_texticon. Подготовка: §Y21§! £time_texticon дн.\n\nЧасть добычи останется в местных хранилищах.\n§G+6000§! £fuel_texticon.\nПовтор через 60 дней после завершения.\n\nПри распаде центра, утрате территории проекта или прекращении работы администрации заказ отменяется с возвратом всей оплаты."
 NAM_colonial_fuel_reserve_result_tt:0 "Через §Y21§! £time_texticon дн.: §G+6000§! £fuel_texticon."
 NAM_colonial_workshops:0 "Военные мастерские Южной гавани"
 NAM_colonial_workshops_desc:0 "Цена: §Y60§! £political_power_texticon. Подготовка: §Y35§! £time_texticon дн.\n\nСтанки обратного рейса пойдут на вооружение армии.\nЮжная гавань: военный завод §G+1§!, строительный участок §G+1§!.\nПовтор через 120 дней после завершения.\n\nПри распаде центра, утрате территории проекта или прекращении работы администрации заказ отменяется с возвратом всей оплаты. Если свободное место займёт другая стройка, оплата также возвращается."
 NAM_colonial_workshops_result_tt:0 "Через §Y35§! £time_texticon дн.: Южная гавань: военный завод §G+1§!, строительный участок §G+1§!."
 NAM_colonial_artillery_contract:0 "Контракт на батареи и связь"
 NAM_colonial_artillery_contract_desc:0 "Цена: §Y45§! £political_power_texticon. Подготовка: §Y28§! £time_texticon дн.\n\nСкладские связи обеспечат батареи и подразделения связи.\n§G+60§! £artillery_texticon, §G+40§! £support_equipment_texticon.\nПовтор через 90 дней после завершения.\n\nПри распаде центра, утрате территории проекта или прекращении работы администрации заказ отменяется с возвратом всей оплаты."
 NAM_colonial_artillery_contract_result_tt:0 "Через §Y28§! £time_texticon дн.: §G+60§! £artillery_texticon, §G+40§! £support_equipment_texticon."
 NAM_colonial_gendarme_operation:0 "Разорвать связи ячеек"
 NAM_colonial_gendarme_operation_desc:0 "Цена: §Y35§! £political_power_texticon. Подготовка: §Y14§! £time_texticon дн.\n\nЖандармы перехватят связных и проведут согласованные обыски.\n§G-15§! £operatives_boost_resistance_texticon, §R-3§! £NAM_support_dist_texticon.\nПовтор через 60 дней после завершения.\n\nПри распаде центра, утрате территории проекта или прекращении работы администрации заказ отменяется с возвратом всей оплаты."
 NAM_colonial_gendarme_operation_result_tt:0 "Через §Y14§! £time_texticon дн.: §G-15§! £operatives_boost_resistance_texticon, §R-3§! £NAM_support_dist_texticon."
 NAM_colonial_volunteer_training:0 "Учебные сборы промысловой милиции"
 NAM_colonial_volunteer_training_desc:0 "Цена: §Y40§! £political_power_texticon. Подготовка: §Y21§! £time_texticon дн.\n\nМестные инструкторы соберут добровольцев на промыслах.\n§G+3000§! £population_texticon, §G+1500§! £infantry_equipment_texticon, §G+3§! £NAM_support_dist_texticon.\nПовтор через 90 дней после завершения.\n\nПри распаде центра, утрате территории проекта или прекращении работы администрации заказ отменяется с возвратом всей оплаты."
 NAM_colonial_volunteer_training_result_tt:0 "Через §Y21§! £time_texticon дн.: §G+3000§! £population_texticon, §G+1500§! £infantry_equipment_texticon, §G+3§! £NAM_support_dist_texticon."
 NAM_colonial_reserve_fund:0 "Укрыть долю центра"
 NAM_colonial_reserve_fund_desc:0 "Цена: §Y35§! £political_power_texticon. Подготовка: §Y14§! £time_texticon дн.\n\nКанцелярия перепишет расчёты с центром в пользу местного резерва.\nСкрытый резерв: §G+150§! £ADISCORD_economy_treasury_texticon. Выплата при независимости.\nПовтор через 45 дней после завершения.\n\nПри распаде центра, утрате территории проекта или прекращении работы администрации заказ отменяется с возвратом всей оплаты."
 NAM_colonial_reserve_fund_result_tt:0 "Через §Y14§! £time_texticon дн.: Скрытый резерв: §G+150§! £ADISCORD_economy_treasury_texticon. Выплата при независимости."
 NAM_colonial_officer_course:0 "Курсы полевого командования"
 NAM_colonial_officer_course_desc:0 "Цена: §Y35§! £political_power_texticon. Подготовка: §Y21§! £time_texticon дн.\n\nИнструкторы проведут штабные учения.\n§G+20§! £army_experience, §G+4§! £NAM_support_garr_texticon.\nПовтор через 90 дней после завершения.\n\nПри распаде центра, утрате территории проекта или прекращении работы администрации заказ отменяется с возвратом всей оплаты."
 NAM_colonial_officer_course_result_tt:0 "Через §Y21§! £time_texticon дн.: §G+20§! £army_experience, §G+4§! £NAM_support_garr_texticon."
 NAM_colonial_local_register:0 "Собрать местный офицерский резерв"
 NAM_colonial_local_register_desc:0 "Цена: §Y35§! £political_power_texticon. Подготовка: §Y21§! £time_texticon дн.\n\nВерные местным командирам резервисты явятся по негласным спискам.\n§G+4000§! £population_texticon, §G+4§! £NAM_support_garr_texticon.\nДоступно один раз.\n\nПри распаде центра, утрате территории проекта или прекращении работы администрации заказ отменяется с возвратом всей оплаты."
 NAM_colonial_local_register_result_tt:0 "Через §Y21§! £time_texticon дн.: §G+4000§! £population_texticon, §G+4§! £NAM_support_garr_texticon."
 NAM_colonial_emergency_stocks:0 "Собрать запас на день распада"
 NAM_colonial_emergency_stocks_desc:0 "Цена: §Y35§! £political_power_texticon. Подготовка: §Y14§! £time_texticon дн.\n\nМестные склады примут запас до прекращения поставок.\n§G+3000§! £fuel_texticon, §G+1500§! £infantry_equipment_texticon.\nДоступно один раз.\n\nПри распаде центра, утрате территории проекта или прекращении работы администрации заказ отменяется с возвратом всей оплаты."
 NAM_colonial_emergency_stocks_result_tt:0 "Через §Y14§! £time_texticon дн.: §G+3000§! £fuel_texticon, §G+1500§! £infantry_equipment_texticon."
 NAM_colonial_warehouse_transfer:0 "Передать ведомственные склады армии"
 NAM_colonial_warehouse_transfer_desc:0 "Цена: §Y40§! £political_power_texticon. Подготовка: §Y14§! £time_texticon дн.\n\nПоследняя сверка закрепит ведомственные запасы за армией Светлогорья.\n§G+3000§! £infantry_equipment_texticon, §G+40§! £support_equipment_texticon.\nДоступно один раз.\n\nПри распаде центра, утрате территории проекта или прекращении работы администрации заказ отменяется с возвратом всей оплаты."
 NAM_colonial_warehouse_transfer_result_tt:0 "Через §Y14§! £time_texticon дн.: §G+3000§! £infantry_equipment_texticon, §G+40§! £support_equipment_texticon."
 NAM_colonial_archive_transfer:0 "Принять расчёты исчезающего центра"
 NAM_colonial_archive_transfer_desc:0 "Цена: §Y50§! £political_power_texticon. Подготовка: §Y14§! £time_texticon дн.\n\nКопии центральных распоряжений позволят взыскать зависшие платежи.\n§G+150§! £ADISCORD_economy_treasury_texticon, §G+3%§! £stability_texticon.\nДоступно один раз.\n\nПри распаде центра, утрате территории проекта или прекращении работы администрации заказ отменяется с возвратом всей оплаты."
 NAM_colonial_archive_transfer_result_tt:0 "Через §Y14§! £time_texticon дн.: §G+150§! £ADISCORD_economy_treasury_texticon, §G+3%§! £stability_texticon."
 NAM_campaign_add_slot_tt:0 "Доступно ещё §G1§! место для пропагандистских кампаний."
 NAM_colonial_programme_operable_tt:0 "Администрация действует, Светлогорье остаётся колонией и метрополия существует"
 NAM_colonial_gendarme_result_tt:0 "Подполье: §G-15§! £operatives_boost_resistance_texticon. Поддержка округов: §R-3§! £NAM_support_dist_texticon."
 NAM_colonial_volunteers_result_tt:0 "Поддержка округов: §G+3§! £NAM_support_dist_texticon."
 NAM_colonial_officers_result_tt:0 "Поддержка гарнизонов: §G+4§! £NAM_support_garr_texticon."
 NAM_colonial_reserve_result_tt:0 "Скрытый резерв: §G+150§! £ADISCORD_economy_treasury_texticon. Выплата при независимости."
 NAM_colonial_archive_result_tt:0 "В казну Светлогорья: §G+150§! £ADISCORD_economy_treasury_texticon."
 NAM_campaign_answer_leaflets:0 "«За каждой листовкой - чужой приказ»"
 NAM_campaign_answer_leaflets_desc:0 "Газеты и промысловое радио разбирают обещания подполья и публикуют проверенные сведения о его вербовщиках. Цена: §Y25§! £political_power_texticon. На §Y60§! £time_texticon дн. занимает одно место пропаганды. Рост подполья: §G-2§! £operatives_boost_resistance_texticon в месяц; стабильность: §G+0,2%§! £stability_texticon в неделю. Повтор через 30 дней после завершения. Кампания прекращается при амнистии, начале ресурсной войны, утрате Светлогорска или капитуляции; место освобождается, оплата не возвращается."
 NAM_campaign_answer_leaflets_tt:0 "На §Y60§! £time_texticon дн. рост подполья уменьшается на §G2§! £operatives_boost_resistance_texticon в месяц."
 NAM_colonial_pipeline_guard:0 "Постоянные посты на нефтепроводах"
 NAM_colonial_pipeline_guard_desc:0 "Посты проверяют пропуска и маршруты снабжения ячеек. Цена: §Y25§! £political_power_texticon. На §Y60§! £time_texticon дн. рост подполья снижается на §G2§! £operatives_boost_resistance_texticon в месяц. Повтор через 30 дней после завершения. Работает и после независимости до ресурсной войны. При прекращении операции оплата не возвращается."
 NAM_colonial_pipeline_guard_tt:0 "На §Y60§! £time_texticon дн. рост подполья уменьшается на §G2§! £operatives_boost_resistance_texticon в месяц."
 NAM_pipeline_guard_cancel_tt:0 "Охрана нефтепроводов прекращается. Оплата не возвращается."
 NAM_colonial_reserve_ready_tt:0 "Скрытый резерв ведётся и ещё не выплачен при независимости"

 # Independent institutions and public mobilisation
 NAM_ind_sovereign_collections:0 "Сборы под собственной печатью"
 NAM_ind_sovereign_collections_desc:0 "Цена: §Y30§! £political_power_texticon. Срок: §Y14§! £time_texticon дн. Повтор: через §Y90§! £time_texticon дн. после завершения.\n\nКанцелярия сверит платежи, которые прежде уходили в центр, и направит их в казну независимого Светлогорья.\nКазна Светлогорья: §G+250§! £ADISCORD_economy_treasury_texticon.\n\nПри утрате независимости или прекращении работы администрации заказ отменяется с полным возвратом оплаты. Война и смена дерева сами по себе его не отменяют."
 NAM_ind_sovereign_collections_result_tt:0 "Через §Y14§! £time_texticon дн.: Казна Светлогорья: §G+250§! £ADISCORD_economy_treasury_texticon."
 NAM_ind_border_dossier:0 "Собрать межевое досье"
 NAM_ind_border_dossier_desc:0 "Цена: §Y30§! £political_power_texticon. Срок: §Y21§! £time_texticon дн. Повтор: через §Y90§! £time_texticon дн. после завершения.\n\nАрхивисты и торговые конторы сведут карты, платежи и договоры в доказательства для ответа соседям. Это снижает давление, но не отменяет установленный срок ресурсного конфликта.\nДавление реституции: §G-12§! £world_tension_texticon. Поддержка торговых домов: §G+3§! £NAM_support_trade_texticon.\n\nПри закрытии спора, отправке приказа о войне, падении давления до нуля, утрате независимости или прекращении работы администрации оплата возвращается полностью."
 NAM_ind_border_dossier_result_tt:0 "Через §Y21§! £time_texticon дн.: Давление реституции: §G-12§! £world_tension_texticon. Поддержка торговых домов: §G+3§! £NAM_support_trade_texticon."
 NAM_ind_defence_supply:0 "Снабдить армию независимости"
 NAM_ind_defence_supply_desc:0 "Цена: §Y40§! £political_power_texticon. Срок: §Y21§! £time_texticon дн. Повтор: через §Y90§! £time_texticon дн. после завершения.\n\nСобственные военные заказы обеспечат войска вооружением и подготовкой специалистов. Программа сохраняется во время войны и после её окончания, пока Светлогорье самостоятельно.\nНа склады Светлогорья: §G+6000§! £infantry_equipment_texticon, §G+60§! £support_equipment_texticon. §G+10§! £army_experience.\n\nПри утрате независимости или прекращении работы администрации заказ отменяется с полным возвратом оплаты. Война и смена дерева сами по себе его не отменяют."
 NAM_ind_defence_supply_result_tt:0 "Через §Y21§! £time_texticon дн.: На склады Светлогорья: §G+6000§! £infantry_equipment_texticon, §G+60§! £support_equipment_texticon. §G+10§! £army_experience."
 NAM_ind_statute_commissions:0 "Отправить комиссии статута в округа"
 NAM_ind_statute_commissions_desc:0 "Цена: §Y35§! £political_power_texticon. Срок: §Y21§! £time_texticon дн. Повтор: через §Y60§! £time_texticon дн. после завершения.\n\nВыездные комиссии разберут споры о полномочиях, объяснят новый порядок жалоб и согласуют работу местных учреждений.\n§G+2%§! £stability_texticon. Поддержка округов: §G+6§! £NAM_support_dist_texticon; наместников: §G+3§! £NAM_support_nam_texticon.\n\nПри утрате независимости или прекращении работы администрации заказ отменяется с полным возвратом оплаты. Война и смена дерева сами по себе его не отменяют."
 NAM_ind_statute_commissions_result_tt:0 "Через §Y21§! £time_texticon дн.: §G+2%§! £stability_texticon. Поддержка округов: §G+6§! £NAM_support_dist_texticon; наместников: §G+3§! £NAM_support_nam_texticon."
 NAM_ind_reservist_register:0 "Свести единый реестр резервистов"
 NAM_ind_reservist_register_desc:0 "Цена: §Y35§! £political_power_texticon. Срок: §Y28§! £time_texticon дн. Повтор: через §Y120§! £time_texticon дн. после завершения.\n\nОбщие правила воинского учёта позволят найти подготовленных резервистов, которых прежде не видели за границами ведомств. Они поступят в людской резерв Светлогорья.\nЛюдской резерв Светлогорья: §G+4000§! £population_texticon.\n\nПри утрате независимости или прекращении работы администрации заказ отменяется с полным возвратом оплаты. Война и смена дерева сами по себе его не отменяют."
 NAM_ind_reservist_register_result_tt:0 "Через §Y28§! £time_texticon дн.: Людской резерв Светлогорья: §G+4000§! £population_texticon."
 NAM_ind_border_dossier_delivered_tt:0 "Давление реституции: §G-12§! £world_tension_texticon. Поддержка торговых домов: §G+3§! £NAM_support_trade_texticon."
 NAM_ind_statute_commissions_support_tt:0 "Поддержка округов: §G+6§! £NAM_support_dist_texticon; наместников: §G+3§! £NAM_support_nam_texticon."
 NAM_independent_programmes_operable_tt:0 "Светлогорье независимо, распад центра состоялся и администрация действует"
 NAM_ind_border_dossier_possible_tt:0 "Светлогорье самостоятельно, Эфлор сохраняет претензии, давление выше нуля и приказ о ресурсной войне ещё не отправлен"
 NAM_campaign_our_own_word:0 "«За своим словом - своя страна»"
 NAM_campaign_our_own_word_desc:0 "Радио, газеты и собрания продолжают обращение главы государства: независимость требует повседневной ответственности, а оборона касается каждого.\n\nЦена: §Y30§! £political_power_texticon. Кампания занимает одно место пропаганды на §Y60§! £time_texticon дн. Еженедельно: §G+0,3%§! £stability_texticon и §G+0,3%§! £war_support_modifiericons_texticon. Повтор через §Y60§! £time_texticon дн. после завершения.\n\nПри капитуляции или подчинении кампания прекращается; место возвращается, оплата не возвращается. Война и мир сами по себе не прекращают кампанию."

 # Administrative programmes
 NAM_admin_common_stores:0 "Свести ведомственные запасы"
 NAM_admin_common_stores_delivered_tt:0 "§G+100§! £support_equipment_texticon, §G+2000§! £fuel_texticon."
 NAM_admin_common_stores_result_tt:0 "Через §Y21§! £time_texticon дн.: §G+100§! £support_equipment_texticon, §G+2000§! £fuel_texticon."
 NAM_admin_common_stores_desc:0 "Цена: §Y30§! £political_power_texticon. Срок: §Y21§! £time_texticon дн. Повтор через §Y90§! £time_texticon дн. после завершения.\n\nРевизоры сопоставят ведомости управлений и передадут неиспользуемое имущество на общий склад.\n§G+100§! £support_equipment_texticon, §G+2000§! £fuel_texticon.\n\nПри капитуляции, подчинении или утрате условий программы вся оплата возвращается. Война и смена дерева сами по себе не отменяют заказ. Все результаты получает Светлогорье."
 NAM_admin_compulsory_delivery:0 "Предписать обязательную поставку"
 NAM_admin_compulsory_delivery_delivered_tt:0 "§G+4500§! £infantry_equipment_texticon. §R-6§! £NAM_support_dist_texticon, §R-3§! £NAM_support_oil_texticon. §Y-5%§! $NAM_ladder_bop$."
 NAM_admin_compulsory_delivery_result_tt:0 "Через §Y7§! £time_texticon дн.: §G+4500§! £infantry_equipment_texticon. §R-6§! £NAM_support_dist_texticon, §R-3§! £NAM_support_oil_texticon. §Y-5%§! $NAM_ladder_bop$."
 NAM_admin_compulsory_delivery_desc:0 "Цена: §Y25§! £political_power_texticon. Срок: §Y7§! £time_texticon дн. Повтор через §Y60§! £time_texticon дн. после завершения.\n\nНаместники вскроют местные склады по единому предписанию. Снабжение ускорится ценой недовольства округов и промыслов.\n§G+4500§! £infantry_equipment_texticon. §R-6§! £NAM_support_dist_texticon, §R-3§! £NAM_support_oil_texticon. §Y-5%§! $NAM_ladder_bop$.\n\nПри капитуляции, подчинении или утрате условий программы вся оплата возвращается. Война и смена дерева сами по себе не отменяют заказ. Все результаты получает Светлогорье."
 NAM_admin_warehouse_inspection:0 "Проверить гарнизонные склады"
 NAM_admin_warehouse_inspection_delivered_tt:0 "§G+90§! £support_equipment_texticon, §G+40§! £artillery_texticon. §R-4§! £NAM_support_garr_texticon, §G+3§! £NAM_support_nam_texticon. §Y-5%§! $NAM_ladder_bop$."
 NAM_admin_warehouse_inspection_result_tt:0 "Через §Y14§! £time_texticon дн.: §G+90§! £support_equipment_texticon, §G+40§! £artillery_texticon. §R-4§! £NAM_support_garr_texticon, §G+3§! £NAM_support_nam_texticon. §Y-5%§! $NAM_ladder_bop$."
 NAM_admin_warehouse_inspection_desc:0 "Цена: §Y35§! £political_power_texticon. Срок: §Y14§! £time_texticon дн. Повтор через §Y90§! £time_texticon дн. после завершения.\n\nИменная ревизия вернёт скрытое имущество армии, но командиры не простят вмешательства наместников в складские книги.\n§G+90§! £support_equipment_texticon, §G+40§! £artillery_texticon. §R-4§! £NAM_support_garr_texticon, §G+3§! £NAM_support_nam_texticon. §Y-5%§! $NAM_ladder_bop$.\n\nПри капитуляции, подчинении или утрате условий программы вся оплата возвращается. Война и смена дерева сами по себе не отменяют заказ. Все результаты получает Светлогорье."
 NAM_admin_tax_arrears:0 "Взыскать скрытые недоимки"
 NAM_admin_tax_arrears_delivered_tt:0 "§G+350§! £ADISCORD_economy_treasury_texticon. §R-3§! £NAM_support_oil_texticon, §R-3§! £NAM_support_trade_texticon."
 NAM_admin_tax_arrears_result_tt:0 "Через §Y14§! £time_texticon дн.: §G+350§! £ADISCORD_economy_treasury_texticon. §R-3§! £NAM_support_oil_texticon, §R-3§! £NAM_support_trade_texticon."
 NAM_admin_tax_arrears_desc:0 "Цена: §Y30§! £political_power_texticon. Срок: §Y14§! £time_texticon дн. Повтор через §Y90§! £time_texticon дн. после завершения.\n\nСверка налоговых списков найдёт задолженность промыслов и торговых контор. Доход казны имеет политическую цену.\n§G+350§! £ADISCORD_economy_treasury_texticon. §R-3§! £NAM_support_oil_texticon, §R-3§! £NAM_support_trade_texticon.\n\nПри капитуляции, подчинении или утрате условий программы вся оплата возвращается. Война и смена дерева сами по себе не отменяют заказ. Все результаты получает Светлогорье."
 NAM_admin_transport_requisition:0 "Реквизировать автотранспорт"
 NAM_admin_transport_requisition_delivered_tt:0 "§G+100§! £motorized_texticon, §G+1500§! £fuel_texticon. §R-5§! £NAM_support_dist_texticon, §R-3§! £NAM_support_trade_texticon. §Y-5%§! $NAM_ladder_bop$."
 NAM_admin_transport_requisition_result_tt:0 "Через §Y7§! £time_texticon дн.: §G+100§! £motorized_texticon, §G+1500§! £fuel_texticon. §R-5§! £NAM_support_dist_texticon, §R-3§! £NAM_support_trade_texticon. §Y-5%§! $NAM_ladder_bop$."
 NAM_admin_transport_requisition_desc:0 "Цена: §Y30§! £political_power_texticon. Срок: §Y7§! £time_texticon дн. Повтор через §Y90§! £time_texticon дн. после завершения.\n\nЧрезвычайное предписание перебросит гражданские машины и запас горючего армии. Округа и перевозчики потеряют часть своего снабжения.\n§G+100§! £motorized_texticon, §G+1500§! £fuel_texticon. §R-5§! £NAM_support_dist_texticon, §R-3§! £NAM_support_trade_texticon. §Y-5%§! $NAM_ladder_bop$.\n\nПри капитуляции, подчинении или утрате условий программы вся оплата возвращается. Война и смена дерева сами по себе не отменяют заказ. Все результаты получает Светлогорье."
 NAM_admin_governor_levy:0 "Ввести сбор по чрезвычайной смете"
 NAM_admin_governor_levy_delivered_tt:0 "§G+400§! £ADISCORD_economy_treasury_texticon. §R-5§! £NAM_support_nam_texticon, §R-5§! £NAM_support_dist_texticon. §Y-10%§! $NAM_ladder_bop$."
 NAM_admin_governor_levy_result_tt:0 "Через §Y7§! £time_texticon дн.: §G+400§! £ADISCORD_economy_treasury_texticon. §R-5§! £NAM_support_nam_texticon, §R-5§! £NAM_support_dist_texticon. §Y-10%§! $NAM_ladder_bop$."
 NAM_admin_governor_levy_desc:0 "Цена: §Y30§! £political_power_texticon. Срок: §Y7§! £time_texticon дн. Повтор через §Y90§! £time_texticon дн. после завершения.\n\nНаместники быстро соберут деньги на государственную программу. Исполнение укрепит центр, но истощит доверие и к сборщикам, и к их распоряжениям.\n§G+400§! £ADISCORD_economy_treasury_texticon. §R-5§! £NAM_support_nam_texticon, §R-5§! £NAM_support_dist_texticon. §Y-10%§! $NAM_ladder_bop$.\n\nПри капитуляции, подчинении или утрате условий программы вся оплата возвращается. Война и смена дерева сами по себе не отменяют заказ. Все результаты получает Светлогорье."
 NAM_admin_voluntary_enrolment:0 "Согласовать добровольный набор"
 NAM_admin_voluntary_enrolment_delivered_tt:0 "§G+6000§! £population_texticon. §Y+5%§! $NAM_ladder_bop$."
 NAM_admin_voluntary_enrolment_result_tt:0 "Через §Y28§! £time_texticon дн.: §G+6000§! £population_texticon. §Y+5%§! $NAM_ladder_bop$."
 NAM_admin_voluntary_enrolment_desc:0 "Цена: §Y30§! £political_power_texticon §Y150§! £ADISCORD_economy_treasury_texticon. Срок: §Y28§! £time_texticon дн. Повтор через §Y90§! £time_texticon дн. после завершения.\n\nСоветы оплатят дорогу, обучение и содержание добровольцев. Набор состоится только при сохранении доверия к окружным учреждениям.\n§G+6000§! £population_texticon. §Y+5%§! $NAM_ladder_bop$.\nПоддержка округов: не меньше §Y50§! £NAM_support_dist_texticon при запуске и завершении. Падение ниже порога отменяет программу и возвращает оплату.\n\nПри капитуляции, подчинении или утрате условий программы вся оплата возвращается. Война и смена дерева сами по себе не отменяют заказ. Все результаты получает Светлогорье."
 NAM_admin_voluntary_enrolment_refund_tt:0 "§G+150§! £ADISCORD_economy_treasury_texticon."
 NAM_admin_voluntary_enrolment_cost:0 "§Y30§! £political_power_texticon §Y150§! £ADISCORD_economy_treasury_texticon"
 NAM_admin_voluntary_enrolment_cost_blocked:0 "§R30§! £political_power_texticon §R150§! £ADISCORD_economy_treasury_texticon"
 NAM_admin_voluntary_enrolment_cost_tooltip:0 "§Y30§! £political_power_texticon §Y150§! £ADISCORD_economy_treasury_texticon\nОплата списывается один раз при запуске и возвращается при отмене."
 NAM_admin_pay_local_arrears:0 "Погасить задолженность округам"
 NAM_admin_pay_local_arrears_delivered_tt:0 "§G+2%§! £stability_texticon. §G+12§! £NAM_support_dist_texticon, §G+5§! £NAM_support_oil_texticon. §Y+5%§! $NAM_ladder_bop$."
 NAM_admin_pay_local_arrears_result_tt:0 "Через §Y14§! £time_texticon дн.: §G+2%§! £stability_texticon. §G+12§! £NAM_support_dist_texticon, §G+5§! £NAM_support_oil_texticon. §Y+5%§! $NAM_ladder_bop$."
 NAM_admin_pay_local_arrears_desc:0 "Цена: §Y20§! £political_power_texticon §Y200§! £ADISCORD_economy_treasury_texticon. Срок: §Y14§! £time_texticon дн. Повтор через §Y60§! £time_texticon дн. после завершения.\n\nПубличная ведомость станет настоящим расчётом с работниками и местными служащими. Выплаты возвращают доверие, необходимое добровольным программам.\n§G+2%§! £stability_texticon. §G+12§! £NAM_support_dist_texticon, §G+5§! £NAM_support_oil_texticon. §Y+5%§! $NAM_ladder_bop$.\n\nПри капитуляции, подчинении или утрате условий программы вся оплата возвращается. Война и смена дерева сами по себе не отменяют заказ. Все результаты получает Светлогорье."
