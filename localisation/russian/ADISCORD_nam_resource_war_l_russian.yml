 NAM_cost_counterinsurgency_sweep_tooltip: "§Y20§! £political_power_texticon §Y75§! £ADISCORD_economy_treasury_texticon\nКазна вернётся, если облава будет прервана."
 NAM_sweep_slot_free_tt: "Другая облава сейчас не идёт"
 NAM_sweep_started_tt: "Казна: §R-75§! £ADISCORD_economy_treasury_texticon; задаток вернётся, если облава прервётся.\nОдновременно идёт только одна облава."
 NAM_sweep_done_tt: "Подполье: §G-8§!, в Светлогорске §G-12§!.\nПоддержка округов: §R-4§! £NAM_support_dist_texticon.\nС вероятностью §Y30%§! (§Y15%§! при поддержке гарнизонов от §Y60§!) случаются перегибы: стабильность §R-2%§!, поддержка округов ещё §R-4§! £NAM_support_dist_texticon, подполье §R+3§!.\nПовторная облава в этом округе доступна через §Y120§! £time_texticon дн."
 NAM_sweep_refund_tt: "Облава прервана: §G75§! £ADISCORD_economy_treasury_texticon возвращаются в казну. Политическая власть не возвращается."
 NAM_wrk_emergency_echelon: "Эшелон для центра"
 NAM_wrk_emergency_echelon_desc: "Центральные склады готовят эшелон для колонии. Наши поверенные сверят его состав и оформят встречную отгрузку горючего."
 NAM_cost_wrk_emergency_echelon: "§Y25§! £political_power_texticon §Y90000§! £fuel_texticon"
 NAM_cost_wrk_emergency_echelon_blocked: "§R25§! £political_power_texticon §R90000§! £fuel_texticon"
 NAM_cost_wrk_emergency_echelon_tooltip: "§Y25§! £political_power_texticon §Y90000§! £fuel_texticon\nТопливо вернётся, если эшелон не уйдёт до распада метрополии."
 NAM_wrk_echelon_loaded_tt: "Топливо вернётся, если эшелон не уйдёт до распада метрополии.\nВсего можно получить §Y3§! эшелона; уже доставлено §Y[?NAM_wrk_echelons_delivered|0]§!."
 NAM_wrk_echelon_delivered_tt: "Эшелон пришёл: §G+6000§! £infantry_equipment_texticon и §G+60§! единиц снаряжения поддержки. Метрополия получает §Y90000§! £fuel_texticon.\nПоддержка наместников: §G+2§! £NAM_support_nam_texticon."
 NAM_wrk_echelon_refund_tt:0 "§G90000§! £fuel_texticon возвращаются в открытый резерв. Заполняются свободные хранилища; оставшиеся цистерны можно принять отдельным решением. Политическая цена не возвращается."
 NAM_underground_next_idle: "Подполье больше не растёт."
 NAM_underground_next_40: "При §Y40§! подполье выйдет из тени."
 NAM_underground_next_60: "При §Y60§! подполье поднимет промыслы на забастовку."
 NAM_underground_next_80: "При §Y80§! город будет готов к восстанию."
 NAM_underground_next_none: "§RВсе пороги пройдены.§!"
 ADISCORD_nam_resource_war.80.t: "Центр исчез"
 ADISCORD_nam_resource_war.80.d: "Первое сообщение о распаде центрального управления принёс дежурный связист. Ром спросил, подтверждено ли оно правительственным каналом. Связист ответил, что этот канал и пытается вызвать. Через час пришло другое сообщение, затем третье; названия учреждений в них ещё совпадали, имена начальников - уже нет. Никто не мог сказать, какое распоряжение считать последним.\n\nРом попросил не менять флаги до заседания. В молодости он уже видел, как быстро служащие находят новые обращения к начальству. Тогда достаточно было дождаться, пока станет ясно, чьи приказы переписывать. Теперь в приёмной ждали его решения: порт запрашивал разрешение на отправку нефти, гарнизон - подтверждение снабжения, наместники - объяснение, кто отвечает за сборы. Ром велел пригласить всех сразу.\n\nМезенцев начал с танкеров. Груз приготовлен по старым квотам, но подтвердить расчёт со столицей некому. Отправить его сейчас означало принять риск на местную казну; задержать - отвечать перед капитанами и промысловыми управлениями. Кто-то предложил ещё раз запросить министерство. Ром спросил, кто там примет запрос. Ответа не было.\n\nЗа последние годы он не раз представлял себе Светлогорье без столичного надзора. В этих мыслях обычно оставалось время договориться с округами, подготовить запасы и объясниться с соседями. Сейчас нужно было разбираться со всем одновременно. Эфлор и Ажар помнили, как эти месторождения перешли под воркерландское управление. В городе действовало подполье Вебера. Ни один из этих споров не закончился вместе с метрополией.\n\nРом придвинул свой стул к столу, чтобы видеть сидевших по краям.\n- Начнём с порта. Какие у нас обязательства по этим судам?"
 ADISCORD_nam_resource_war.80.d_successor: "После распада центрального управления правительственные каналы перестали подтверждать распоряжения. Из Воркерланда поступают противоречивые сообщения о новых начальниках и штабах. Порт запрашивает разрешение на отправку нефти, гарнизоны - подтверждение снабжения. Квоты и расчёты с метрополией больше не опираются на общее правительство.\n\nНа заседание собрались наместники, коменданты и представители округов. Им предстоит определить, кто отвечает за местные доходы и исполнение обязательств. Эфлор и Ажар сохраняют притязания на промыслы, а подполье Вебера - свои требования к администрации. Распад центра не разрешил ни одного из этих споров.\n\nСветлогорье должно принять собственные решения об управлении и независимости. Колониальные распоряжения прекращают действие; отношения между местными учреждениями предстоит закрепить заново."
 ADISCORD_nam_resource_war.80.a: "Мы сами по себе."
 NAM_center_vanished_tt:0 "Колониальные программы закрыты: концессия метрополии больше не платит, категория \"Колония Воркерланда\" исчезает.\nПосле завершения фокуса \"Штиль перед штормом\" становятся доступны ветви подготовки независимого Светлогорья.\nСледом канцелярия соберётся подписывать декларацию независимости."
 ADISCORD_nam_resource_war.81.t: "Бегство на острова"
 ADISCORD_nam_resource_war.81.d: "Последние транспорты уходили из Южной Гавани ночью, без огней. На причалах остались те, кому не хватило места: роты, пробившиеся с северных промыслов слишком поздно, обозы, раненые, которых нельзя было поднять по трапу. Офицеры выкликали фамилии по спискам, и каждая вычеркнутая строка означала человека, остающегося на милость победителей.\n\nТехнику грузить было некуда. Её сбрасывали с причалов прямо в воду: орудия, грузовики, ящики с винтовками и патронами. Квартирмейстеры подписывали акты о списании, пока над портом не поднялось зарево, - Ром приказал не оставить врагу ни одного исправного ствола. Сапёры уходили последними. За ними горели насосные станции, рушились эстакады и пылали склады на промыслах. Коалиция получит нашу землю, но получит её выжженной.\n\nНа рассвете острова встретили изгнанников холодным ветром и пустыми казармами. Здесь нет нефти и почти нет заводов, только сталь, гавани и море. Правительство Светлогорья живо, пока его флаг поднят над островами. Осталось решить, чем оно станет: убежищем побеждённых или плацдармом для возвращения. Решать придётся сегодня же - офицеры с причалов и люди Вебера уже идут к старой таможне, где назначен совет."
 ADISCORD_nam_resource_war.81.a: "Мы вернёмся в Южную Гавань."
 ADISCORD_nam_resource_war.81.b: "Сначала - выжить."
 NAM_exile_evacuation_tt: "Эвакуация: из §Y[?NAM_exile_divisions_before|0]§! дивизий на материке брошено §R[?NAM_exile_divisions_lost|0]§!. В изгнании §Y[?NAM_exile_divisions_after|0]§! дивизий: переправленные сохранили прежний состав и собраны в островной столице.\nОружия на всех не хватает: каждая дивизия на островах потеряла §R45%§! численности и §R50%§! организации.\nСброшено в море: §R[?NAM_exile_rifles_dumped|0]§! £infantry_equipment_texticon и §R[?NAM_exile_heavy_dumped|0]§! единиц снаряжения поддержки и артиллерии.\nПромыслы, дороги и Южная Гавань сожжены: месторождения §Y180§! дней не дают ресурсов новым хозяевам."
 NAM_exile_vow_tt: "Готовность к возвращению: §G+10§!."
 NAM_exile_salvage_tt: "Спасённый груз: §G+40§! добычи."
 ADISCORD_nam_resource_war.82.t: "Листовки Вебера"
 ADISCORD_nam_resource_war.82.d: "Утром рабочие Северных месторождений нашли листовки в каждой раздевалке, в столовой и даже в будке мастера. Подпись одна - Ярослав Вебер. Текст короткий: промыслы принадлежат тем, кто на них работает, а наместники - временные гости, которых пора проводить. Жандармы сорвали листовки к полудню, но к вечеру их пересказывали в каждом рабочем посёлке.\n\nПодполье больше не прячется по подвалам. У него есть типографии, курьеры и свои люди в конторах промыслов. Канцелярия ждёт решения: пройтись по спискам, пока сеть не разрослась, или откупиться от округов, пока их недовольство не стало чужим знаменем."
 ADISCORD_nam_resource_war.82.a: "Аресты по спискам жандармерии."
 ADISCORD_nam_resource_war.82.b: "Деньги округам на школы и больницы."
 ADISCORD_nam_resource_war.82.c: "Бумага всё стерпит."
 NAM_ug_82_a_tt: "Подполье: §G-10§!.\nПоддержка округов: §R-5§! £NAM_support_dist_texticon."
 NAM_ug_82_b_tt: "Казна: §R-100§! £ADISCORD_economy_treasury_texticon.\nПодполье: §G-5§!.\nПоддержка округов: §G+6§! £NAM_support_dist_texticon."
 NAM_ug_ignore_tt: "Подполье продолжает расти."
 ADISCORD_nam_resource_war.83.t: "Забастовка на промыслах"
 ADISCORD_nam_resource_war.83.d: "Насосы встали сразу в трёх сменах. Забастовочный комитет, за которым все видят руку Вебера, требует выплатить задержанное жалованье, отменить штрафы наместников и выпустить арестованных. Пока требования не выполнены, нефть не пойдёт ни в цистерны, ни в танкеры.\n\nГарнизоны готовы вывести рабочих силой, но командиры предупреждают: каждый арест превращает молчаливого сочувствующего в бойца подполья. Нефтяники считают убытки и просят решить дело до конца недели."
 ADISCORD_nam_resource_war.83.a: "Разогнать комитет, зачинщиков - под арест."
 ADISCORD_nam_resource_war.83.b: "Выплатить долги и отменить штрафы."
 ADISCORD_nam_resource_war.83.c: "Переждать, пока у них кончатся деньги."
 NAM_ug_83_a_tt: "Подполье: §G-15§!.\nПоддержка округов: §R-10§! £NAM_support_dist_texticon."
 NAM_ug_83_b_tt: "Казна: §R-200§! £ADISCORD_economy_treasury_texticon.\nПодполье: §G-8§!.\nПоддержка округов: §G+8§! £NAM_support_dist_texticon.\nПоддержка нефтяников: §G+4§! £NAM_support_oil_texticon."
 NAM_ug_83_c_tt: "Поддержка нефтяников: §R-6§! £NAM_support_oil_texticon."
 ADISCORD_nam_resource_war.84.t: "Город готов подняться"
 ADISCORD_nam_resource_war.84.d: "Сводки жандармерии больше не похожи на сводки: это карта будущего восстания. В Светлогорске оружие хранят в погребах и на чердаках, у Вебера есть свои командиры кварталов, а патрули после заката обходят рабочие районы стороной. Достаточно одного выстрела, чтобы город вышел на улицы.\n\nКомендант просит ввести в город войска и объявить военное положение. Советники Рома шепчут о другом: Вебер ещё готов говорить, если дать ему повод. Промедление означает одно - следующая искра может оказаться последней."
 ADISCORD_nam_resource_war.84.a: "Ввести гарнизоны в Светлогорск."
 ADISCORD_nam_resource_war.84.b: "Открыть тайный канал к Веберу."
 ADISCORD_nam_resource_war.84.c: "Ждать."
 NAM_ug_84_a_tt: "Подполье: §G-20§!.\nПоддержка гарнизонов: §G+5§! £NAM_support_garr_texticon.\nПоддержка округов: §R-10§! £NAM_support_dist_texticon.\nЕсли лестница печатей уже создана, она смещается к вертикали на §Y0.05§!."
 NAM_ug_84_b_tt: "Казна: §R-150§! £ADISCORD_economy_treasury_texticon.\nПодполье: §G-15§!.\nПоддержка округов: §G+8§! £NAM_support_dist_texticon.\nПоддержка наместников: §R-8§! £NAM_support_nam_texticon."
 NAM_ug_84_c_tt: "Подполье: §R+5§!."
 ADISCORD_nam_resource_war.85.t: "Пожар на промысле"
 ADISCORD_nam_resource_war.85.d: "Ночью на промысле в округе [NAM_ug_field.GetName] взорвалась задвижка магистрального трубопровода. Пожарные сбили пламя только к утру, но две скважины выгорели, а насосная станция стоит без кровли. На обгоревшей стене кто-то вывел мелом знакомый знак подполья.\n\nНачальник промысла просит денег на ремонт, жандармы - разрешения на облавы в окрестных посёлках. Наместник советует объявить случившееся аварией: признать диверсию - значит признать, что Вебер может ударить где угодно."
 ADISCORD_nam_resource_war.85.a: "Бригады - немедленно на ремонт."
 ADISCORD_nam_resource_war.85.b: "Облавы в окрестных посёлках."
 ADISCORD_nam_resource_war.85.c: "Списать на износ оборудования."
 NAM_ug_85_a_tt: "Пожар уже повредил промысел. Базовый ущерб - §R15§! пунктов состояния; действовавшая усиленная охрана уменьшает его вдвое.\nКазна: §R-100§! £ADISCORD_economy_treasury_texticon.\nСостояние промысла: §G+10§!.\nПоддержка нефтяников: §G+3§! £NAM_support_oil_texticon."
 NAM_ug_85_b_tt: "Пожар уже повредил промысел. Базовый ущерб - §R15§! пунктов состояния; действовавшая усиленная охрана уменьшает его вдвое.\nПодполье: §G-8§!.\nПоддержка округов: §R-6§! £NAM_support_dist_texticon."
 NAM_ug_85_c_tt: "Пожар уже повредил промысел. Базовый ущерб - §R15§! пунктов состояния; действовавшая усиленная охрана уменьшает его вдвое.\nПодполье: §R+3§!."
 ADISCORD_nam_resource_war.86.t: "Налёт на арсенал"
 ADISCORD_nam_resource_war.86.d: "Склад гарнизона у развилки дорог взяли без единого выстрела: часовые оказались связаны, ворота открыты своим ключом, а грузовик подполья ушёл в сторону холмов за час до смены караула. Ревизия насчитала недостачу в [?NAM_ug_rifles_stolen|0] винтовок, и каждая из них теперь в руках Вебера.\n\nСледы ещё свежие, и конная жандармерия готова идти по ним. Начальник тыла предлагает другое: удвоить охрану всех складов, пока подполье не вернулось за остальным. Есть и третье мнение - что этих винтовок уже никогда не найти."
 ADISCORD_nam_resource_war.86.a: "В погоню по свежим следам."
 ADISCORD_nam_resource_war.86.b: "Удвоить охрану складов."
 ADISCORD_nam_resource_war.86.c: "Не гоняться за призраками."
 NAM_ug_86_a_tt: "Похищено §R[?NAM_ug_rifles_stolen|0]§! £infantry_equipment_texticon, подполье выросло на §R4§!.\nРавные шансы: вернуть до §G1000§! £infantry_equipment_texticon из похищенного и ослабить подполье на §G6§! - или потерять §R500§! £manpower_texticon в засаде."
 NAM_ug_86_b_tt: "Похищено §R[?NAM_ug_rifles_stolen|0]§! £infantry_equipment_texticon, подполье выросло на §R4§!.\nКазна: §R-100§! £ADISCORD_economy_treasury_texticon.\nПоддержка гарнизонов: §G+4§! £NAM_support_garr_texticon.\nСклады не тронут §Y180§! дней."
 NAM_ug_86_c_tt: "Похищено §R[?NAM_ug_rifles_stolen|0]§! £infantry_equipment_texticon, подполье выросло на §R4§!.\nПодполье: §R+3§!.\nПоддержка округов: §G+2§! £NAM_support_dist_texticon."
 ADISCORD_nam_resource_war.87.t: "Покушение на наместника"
 ADISCORD_nam_resource_war.87.d: "Наместника Южнобережья застрелили на ступенях его собственной управы, средь бела дня, на глазах у просителей. Стрелявший ушёл через рынок, а к вечеру по городу уже ходили листовки с приговором: \"за поборы, за квоты, за наших детей на промыслах\". Подпись Вебера стояла внизу, как печать под указом.\n\nНаместники требуют ответа, который запомнят все округа. Округа ждут, не начнутся ли расправы без суда. Ром понимает: что бы ни сделала канцелярия, это прочтут как ответ на вопрос, кому на самом деле принадлежит власть в Светлогорье."
 ADISCORD_nam_resource_war.87.a: "Военное положение в округах."
 ADISCORD_nam_resource_war.87.b: "Похороны и честное следствие."
 ADISCORD_nam_resource_war.87.c: "Замять дело."
 NAM_ug_87_a_tt: "Подполье: §G-10§!.\nПоддержка наместников: §G+6§! £NAM_support_nam_texticon.\nПоддержка округов: §R-8§! £NAM_support_dist_texticon.\nЕсли лестница печатей уже создана, она смещается к вертикали на §Y0.05§!."
 NAM_ug_87_b_tt: "Подполье: §G-5§!.\nПоддержка наместников: §G+3§! £NAM_support_nam_texticon."
 NAM_ug_87_c_tt: "Поддержка наместников: §R-8§! £NAM_support_nam_texticon."
 NAM_piracy: "Флотилии изгнания"
 NAM_piracy_desc: "§YМОРСКИЕ ОПЕРАЦИИ§! £navy_anchor_texticon\nВыберите торговый путь на карте. Добыча, флотилии и готовность к возвращению показаны на карточках; наведите курсор для подробностей.\n\n§YСНАБЖЕНИЕ И ПОДГОТОВКА§!\nЧёрный рынок, скупщики, учения и приказы морской пехоте доступны через кнопки под картой. Отмена подготовленных приказов - в решениях ниже."
 NAM_pirate_notoriety_quiet: "§Gо нас почти не говорят§!"
 NAM_pirate_notoriety_known: "§Yо нас говорят в портах§!"
 NAM_pirate_notoriety_wanted: "§Rкоалиция может объявить блокаду§!"
 NAM_pirate_notoriety_hunted: "§Rкоалиция может обстрелять острова§!"
 NAM_landing_forecast_three: "Десант сейчас: §Y3§! дивизии."
 NAM_landing_forecast_two: "Десант сейчас: §Y2§! дивизии."
 NAM_pirate_raid_lane_oil: "Набег на Нефтяной путь"
 NAM_pirate_raid_lane_oil_desc: "Танкеры Ажара везут нефть Чёрного берега в залив Эфлора и огибают восточный мыс нашего главного острова. Флотилия караулит их у мыса; наблюдатели сверяют силуэты с судовыми справочниками."
 NAM_pirate_lane_oil_result_tt: "Исход набега на Нефтяной путь:\n- удача: §G+60§! добычи и §G+1000§! £fuel_texticon, владельцы пути теряют §R2000§! £fuel_texticon на всех; дурная слава §R+10§!;\n- приз: §G+100§! добычи, §G+2000§! £fuel_texticon, §G+9000§! £infantry_equipment_texticon, §G+3§! £convoy_texticon, владельцы теряют §R3000§! £fuel_texticon на всех; дурная слава §R+12§!;\n- провал: патрульный корабль или §R1000§! £manpower_texticon; дурная слава §R+5§!.\nСамые богатые грузы: вес призового исхода §Gx1.5§!.\nВладельцы пути §Y90§! дней настороже."
 NAM_pirate_raid_lane_coast: "Набег на Северный каботаж"
 NAM_pirate_raid_lane_coast_desc: "Каботажные суда Ривена и Эфлора идут вдоль материкового берега к северу от островов, в виду наших маяков. Флотилия перехватывает их в узостях между берегом и островами."
 NAM_pirate_lane_coast_result_tt: "Исход набега на Северный каботаж:\n- удача: §G+60§! добычи и §G+1000§! £fuel_texticon, владельцы пути теряют §R2000§! £fuel_texticon на всех; дурная слава §R+10§!;\n- приз: §G+100§! добычи, §G+2000§! £fuel_texticon, §G+9000§! £infantry_equipment_texticon, §G+3§! £convoy_texticon, владельцы теряют §R3000§! £fuel_texticon на всех; дурная слава §R+12§!;\n- провал: патрульный корабль или §R1000§! £manpower_texticon; дурная слава §R+5§!.\nБез судов Эфлора - как на путях без коалиции: §G+50§! добычи, дурная слава §R+6§!, §R+8§! и §R+3§!.\nВладельцы пути §Y90§! дней настороже."
 NAM_pirate_raid_lane_strait: "Набег на Луренский пролив"
 NAM_pirate_raid_lane_strait_desc: "Суда ульвенских ремонтных мастерских и общих портов Лурена ходят проливом к югу от островов. Флотилия занимает позиции в проливе, а береговые наблюдатели отмечают проходящие суда."
 NAM_pirate_lane_strait_result_tt: "Исход набега на Луренский пролив:\n- удача: §G+50§! добычи и §G+1000§! £fuel_texticon, владельцы пути теряют §R2000§! £fuel_texticon на всех; дурная слава §R+6§!;\n- приз: §G+100§! добычи, §G+2000§! £fuel_texticon, §G+9000§! £infantry_equipment_texticon, §G+3§! £convoy_texticon, владельцы теряют §R3000§! £fuel_texticon на всех; дурная слава §R+8§!;\n- провал: патрульный корабль или §R1000§! £manpower_texticon; дурная слава §R+3§!.\nВладельцы пути §Y90§! дней настороже."
 NAM_pirate_raid_lane_crossing: "Набег на Шарденский паром"
 NAM_pirate_raid_lane_crossing_desc: "Грузовые и почтовые суда с большого южного острова пересекают море и проходят между нашими островами к Ривенской бухте. Флотилия караулит переправу в проливе между островами."
 NAM_pirate_lane_crossing_result_tt: "Исход набега на Шарденский паром:\n- удача: §G+50§! добычи и §G+1000§! £fuel_texticon, владельцы пути теряют §R2000§! £fuel_texticon на всех; дурная слава §R+6§!;\n- приз: §G+100§! добычи, §G+2000§! £fuel_texticon, §G+9000§! £infantry_equipment_texticon, §G+3§! £convoy_texticon, владельцы теряют §R3000§! £fuel_texticon на всех; дурная слава §R+8§!;\n- провал: патрульный корабль или §R1000§! £manpower_texticon; дурная слава §R+3§!.\nВладельцы пути §Y90§! дней настороже."
 NAM_cost_pirate_raid: "§Y10§! £political_power_texticon §Y1000§! £fuel_texticon"
 NAM_cost_pirate_raid_blocked: "§R10§! £political_power_texticon §R1000§! £fuel_texticon"
 NAM_cost_pirate_raid_tooltip: "§Y10§! £political_power_texticon §Y1000§! £fuel_texticon\nТопливо вернётся, если набег будет прерван."
 NAM_pirate_slot_free_tt: "Есть свободная флотилия: в море §Y[?NAM_pirate_raids_active|0]§! из §Y[?NAM_pirate_raid_slots|0]§!, не больше §Y3§!"
 NAM_pirate_fleet_tt: "Есть хотя бы один корабль"
 NAM_pirate_not_lying_low_tt: "Флотилии не затаились после ответа коалиции"
 NAM_pirate_raid_started_tt: "Флотилия выходит в море и занимает одно место для набега."
 NAM_pirate_raid_refund_tt: "Набег прерван: §G1000§! £fuel_texticon возвращаются, место для набега освобождается. Политическая власть не возвращается."
 NAM_pirate_buy_arms: "Винтовки с чёрного рынка"
 NAM_pirate_buy_arms_desc: "Скупщики в чужих портах предлагают оружие, о происхождении которого лучше не спрашивать. Приёмщики проверят образцы за закрытыми дверями портового склада."
 NAM_cost_pirate_arms: "§Y40§! добычи"
 NAM_cost_pirate_arms_blocked: "§R40§! добычи"
 NAM_cost_pirate_arms_tooltip: "§Y40§! добычи"
 NAM_pirate_spend_40_tt: "Добыча: §R-40§!."
 NAM_pirate_buy_heavy_arms: "Тяжёлое вооружение с чёрного рынка"
 NAM_pirate_buy_heavy_arms_desc: "Тяжёлое вооружение требует особых посредников и надёжного места разгрузки. Поверенные проверят груз до того, как он покинет чужой порт."
 NAM_cost_pirate_heavy_arms: "§Y70§! добычи"
 NAM_cost_pirate_heavy_arms_blocked: "§R70§! добычи"
 NAM_cost_pirate_heavy_arms_tooltip: "§Y70§! добычи"
 NAM_pirate_spend_70_tt: "Добыча: §R-70§!."
 NAM_pirate_buy_convoys: "Трофейные транспорты"
 NAM_pirate_buy_convoys_desc: "Судовладельцы, которым нечем платить портовые сборы, готовы обсуждать продажу корпусов. Наши капитаны осмотрят машины, трюмы и судовые документы."
 NAM_cost_pirate_convoys: "§Y60§! добычи"
 NAM_cost_pirate_convoys_blocked: "§R60§! добычи"
 NAM_cost_pirate_convoys_tooltip: "§Y60§! добычи"
 NAM_pirate_spend_60_tt: "Добыча: §R-60§!."
 NAM_pirate_fence_loot: "Сбыть добычу скупщикам"
 NAM_pirate_fence_loot_desc: "Скупщики предлагают за добычу гроши, но казна изгнания пуста, а жалованье ждать не будет. Поверенные снова отправляются к портовым менялам."
 NAM_cost_pirate_fence: "§Y50§! добычи"
 NAM_cost_pirate_fence_blocked: "§R50§! добычи"
 NAM_cost_pirate_fence_tooltip: "§Y50§! добычи"
 NAM_pirate_spend_50_tt: "Добыча: §R-50§!."
 NAM_receive_100_tt: "Казна: §G+100§! £ADISCORD_economy_treasury_texticon."
 NAM_exile_drill: "Учения на пляжах островов"
 NAM_exile_drill_desc: "Высадки со шлюпок, штурмы причалов и ночные переходы готовят изгнанников к возвращению. Инструкторы требуют от людей знать не только своё место в строю, но и каждый подход к берегу."
 NAM_cost_exile_drill: "§Y20§! £political_power_texticon §Y30§! [NAMGetDrillCurrency]"
 NAM_cost_exile_drill_blocked: "§R20§! £political_power_texticon §R30§! [NAMGetDrillCurrency]"
 NAM_cost_exile_drill_tooltip: "§Y20§! £political_power_texticon §Y30§! [NAMGetDrillCurrency]\nВзнос вернётся, если учения будут прерваны."
 NAM_revenge_not_full_tt: "Готовность к возвращению ниже §Y100§!"
 NAM_exile_drill_started_tt: "Взнос: §R-30§! [NAMGetDrillCurrency]; вернётся, если учения прервутся."
 NAM_exile_drill_done_tt: "Готовность к возвращению: §G+10§!."
 NAM_exile_drill_refund_tt: "Учения прерваны: §G30§! [NAMGetDrillCurrency] возвращаются. Политическая власть не возвращается."
 NAM_order_marines: "Приказ о морской пехоте"
 NAM_order_marines_desc: "Островные инструкторы готовят морскую пехоту к возвращению на материк. Люди учатся сходить со шлюпок, действовать у причалов и собираться после высадки."
 NAM_cost_order_marines: "§Y50§! добычи §Y4300§! £manpower_texticon"
 NAM_cost_order_marines_blocked: "§R50§! добычи §R4300§! £manpower_texticon"
 NAM_cost_order_marines_tooltip: "§Y50§! добычи §Y4300§! £manpower_texticon\nДо войны возвращения добыча и люди возвращаются при отмене приказа."
 NAM_marine_slot_free_tt:0 "Можно подготовить ещё одну дивизию: подготовлено §Y[?NAM_marine_orders_paid|0]§! из §Y[?NAM_marine_order_cap|0]§!, не больше §Y3§!; первая война возвращения ещё не началась"
 NAM_order_marines_tt: "Добыча: §R-50§!.\nВ начале первой войны возвращения: §G1§! £divisions_texticon полностью оснащённая дивизия - четыре батальона морской пехоты и сапёрная рота. Подготовленные части усиливают десант в $STATE_700$ до трёх дивизий; остальные формируются в островной столице. При готовности к возвращению от §Y70§! третья дивизия десанта бесплатная, поэтому все оплаченные части появляются на островах. Если высадка недоступна, весь десант остаётся на островах. До войны приказ можно отменить с возвратом добычи и людей.\nЛьготный заказ и бесплатный десант действуют только для первого похода. До первой доставки состав шаблона фиксирован; обычный набор по нему доступен."
 NAM_order_marines_release: "Отменить приказы о морской пехоте"
 NAM_order_marines_release_desc: "Штаб отменяет подготовку десантных формирований. Инструкторы закроют учебные ведомости, а коменданты сверят списки людей и выданного имущества."
 NAM_order_marines_release_tt: "За каждую из §Y[?NAM_marine_orders_paid|0]§! подготовленных дивизий возвращаются §G50§! добычи и §G4300§! £manpower_texticon."
 ADISCORD_nam_resource_war.90.t: "Флотилия вернулась"
 ADISCORD_nam_resource_war.90.d_success: "Флотилия вернулась в гавань с трюмами, осевшими по ватерлинию. На пути \"[NAMPwLastLane]\" она перехватила конвой, сняла с него топливо и ушла раньше, чем подоспел эскорт. Убытки считают судовладельцы: [NAMPwLastVictims]. На островах уже делят добычу и пересказывают, как капитаны поднимали над захваченными судами старый флаг Светлогорья."
 ADISCORD_nam_resource_war.90.d_prize: "Такой добычи острова ещё не видели. На пути \"[NAMPwLastLane]\" флотилия взяла на абордаж целый караван: топливо, ящики с винтовками и сами суда, которые теперь ходят под нашим флагом. Убытки считают судовладельцы: [NAMPwLastVictims]. Капитанов встречали на причале как героев, а в портовых тавернах уже поют о следующем набеге."
 ADISCORD_nam_resource_war.90.d_failure: "Флотилия вернулась ни с чем. На пути \"[NAMPwLastLane]\" конвой ([NAMPwLastVictims]) шёл под сильным эскортом, и рейдеры попали под огонь, едва показались на горизонте. Капитаны винят предателей в портах, моряки - капитанов. Флот изгнания слишком мал, чтобы терять корабли и людей в каждом неудачном выходе."
 ADISCORD_nam_resource_war.90.a: "Записать в судовой журнал."
 NAM_pirate_report_haul_tt: "Добыча: §G+[?NAM_pirate_last_loot|0]§!, всего §Y[?NAM_pirate_loot|0]§!.\nДурная слава: §Y[?NAM_pirate_notoriety|0]§! / 100."
 NAM_pirate_report_ship_lost_tt: "Потерян патрульный корабль.\nДурная слава: §Y[?NAM_pirate_notoriety|0]§! / 100."
 NAM_pirate_report_crew_lost_tt: "Потеряно §R1000§! £manpower_texticon.\nДурная слава: §Y[?NAM_pirate_notoriety|0]§! / 100."
 ADISCORD_nam_resource_war.91.t: "Пираты Светлогорья"
 ADISCORD_nam_resource_war.91.d: "Капитаны наших конвоев докладывают о нападении на пути \"[NAMPwLastLane]\" у островов изгнания. Нападавшие не скрывались: над их кораблями поднимался флаг правительства Светлогорья в изгнании. Часть груза потеряна, страховщики поднимают цены, а портовые конторы требуют от правительства защитить судоходство."
 ADISCORD_nam_resource_war.91.a: "Усилить охрану конвоев."
 ADISCORD_nam_resource_war.92.t: "Блокада островов"
 ADISCORD_nam_resource_war.92.d: "Эскадры коалиции встали на якорь у входа в островные гавани. Их командующий передал ультиматум с первым же катером: каждое судно под флагом Светлогорья, вышедшее в море, будет считаться пиратским и потоплено без предупреждения. Рыбаки остались на берегу, торговцы разворачивают суда к чужим портам.\n\nКапитаны флотилий предлагают переждать, пока внимание коалиции не ослабнет. Казначей знает, кому в штабе эскадры можно заплатить за слепые ночи. А в казармах всё громче говорят, что блокада лишь доказывает одно: враг нас боится."
 ADISCORD_nam_resource_war.92.a: "Залечь на дно."
 ADISCORD_nam_resource_war.92.b: "Заплатить за слепые ночи."
 ADISCORD_nam_resource_war.92.c: "Пусть блокируют."
 NAM_pirate_92_a_tt: "Дурная слава: §G-15§!.\nНабеги невозможны §Y60§! дней."
 NAM_pirate_92_b_tt: "Добыча: §R-50§!.\nДурная слава: §G-10§!."
 NAM_pirate_92_c_tt: "Блокада островов на §Y90§! дней: добыча топлива §R-25%§!, торговый доход §R-15%§!, налёты на конвои слабее, а набеги чаще проваливаются.\nГотовность к возвращению: §G+5§!."
 ADISCORD_nam_resource_war.93.t: "Карательный рейд"
 ADISCORD_nam_resource_war.93.d: "На рассвете корабли коалиции открыли огонь по столице изгнания. Снаряды легли в гавань и на склады у причалов, загорелись пакгаузы, рухнул старый маяк. Через несколько часов с флагмана пришло требование: выдать капитанов, водивших флотилии, и сдать добычу, иначе обстрел повторится, а следом высадится десант.\n\nСовет опор расходится во мнениях. Одни зовут вывести в море всё, что держится на плаву. Другие считают, что несколько выданных капитанов - малая цена за жизнь островов. Третьи предлагают рассредоточить флотилию по дальним бухтам и надолго исчезнуть."
 ADISCORD_nam_resource_war.93.a: "Принять бой."
 ADISCORD_nam_resource_war.93.b: "Выдать капитанов."
 ADISCORD_nam_resource_war.93.c: "Рассредоточить флотилию."
 NAM_pirate_93_a_tt: "Равные шансы: отбить рейд (опыт флота §G+5§!, готовность к возвращению §G+5§!) - или потерять патрульный корабль и §R1000§! £manpower_texticon.\nДурная слава: §R+5§!."
 NAM_pirate_93_b_tt: "Добыча: §R-40%§!.\nДурная слава: §G-25§!.\nГотовность к возвращению: §R-5§!."
 NAM_pirate_93_c_tt: "Дурная слава: §G-15§!.\nНабеги невозможны §Y90§! дней."
 ADISCORD_nam_resource_war.94.t: "Десант в Южной Гавани"
 ADISCORD_nam_resource_war.94.d: "Транспорты подошли к Южной Гавани в предрассветном тумане теми же фарватерами, по которым флот когда-то уходил в изгнание. Морская пехота прыгала прямо в холодную воду и бежала по камням к причалам, где когда-то сбрасывали в море наши орудия. Гарнизон противника проснулся от выстрелов уже на набережной.\n\nВозвращение началось там, где закончилось бегство. Теперь у островов есть плацдарм на материке, и всё решат ближайшие дни: успеет ли коалиция сбросить десант в море или Светлогорье снова встанет на своей земле."
 ADISCORD_nam_resource_war.94.a: "За Светлогорье!"
 NAM_landing_report_tt: "Плацдарм взят: Южная Гавань под нашим контролем, гарнизон противника отброшен.\nВ Южной Гавани высадились дивизии морской пехоты: §Y[?NAM_marines_landed|0]§!.\nВ строй вступило подготовленных дивизий: §Y[?NAM_marines_orders_delivered|0]§!."
 NAM_landing_island_tt: "Десант ограничен §Y3§! дивизиями: ещё §Y[?NAM_marines_island|0]§! подготовленных дивизий сформированы в островной столице."
 NAM_pirate_blockade: "Блокада островов"
 ADISCORD_tech_svetlogorsk_marine_corps: "Морская пехота Светлогорья"
 ADISCORD_tech_svetlogorsk_marine_corps_desc: "Батальоны изгнания, обученные высаживаться с моря и брать причалы под огнём."
 # Focus trees: colony and exile
 # ----- Main tree: colony (before the collapse) -----
 NAM_wrk_trade_house:0 "Подворье в метрополии"
 NAM_wrk_trade_house_desc:0 "Наши нефтяные конторы годами торговали через чужих посредников. Откроем собственное подворье в Воркерланде: свои склады, свои приказчики и право подписывать договоры от имени Светлогорья."
 NAM_wrk_return_cargo:0 "Обратные рейсы"
 NAM_wrk_return_cargo_desc:0 "Танкеры уходят в метрополию полными и возвращаются порожняком. Пусть обратным рейсом идут станки: в Южной гавани хватит рабочих рук на новый завод."
 NAM_colonial_watch:0 "Сводки колониальной стражи"
 NAM_colonial_watch_desc:0 "Колониальная стража пишет рапорты, которые никто не читает. Соберём их в одну сводку: где режут трубы, кто печатает листовки и куда уходят люди Вебера."
 NAM_imperial_gendarmes:0 "Имперская жандармерия"
 NAM_imperial_gendarmes_desc:0 "Попросим у метрополии жандармов. Они не знают наших промыслов и не станут разбираться, кто виноват, но подполье надолго замолчит. Округа этого не простят."
 NAM_oilfield_militia:0 "Промысловая самооборона"
 NAM_oilfield_militia_desc:0 "Буровики лучше любой стражи знают, кто ходит ночью у вышек. Раздадим винтовки артелям и поручим им охрану своих же промыслов."
 NAM_pipeline_patrols:0 "Обходчики трубопроводов"
 NAM_pipeline_patrols_desc:0 "Подполье бьёт по трубам, потому что их некому охранять. Обходчики с собаками и телефонными будками на каждой версте сберегут и нефть, и дороги к Ключевску."
 NAM_print_shop_raid:0 "Найти чернила будущего восстания"
 NAM_print_shop_raid_desc:0 "Листовки подполья печатают где-то рядом со столицей. Найдём станок, а заодно и тех, кто носит набор: каждый пойманный наборщик расскажет больше, чем десять листовок. Изъятые образцы позволят следить за поставками бумаги и выходить на курьеров подполья."
 NAM_colony_order:0 "Порядок на промыслах"
 NAM_colony_order_desc:0 "Промыслы снова работают без перебоев, и покупатели в метрополии это замечают. Спокойный год стоит больше любых обещаний в письмах."
 # ----- Main tree: colony tooltips -----
 NAM_wrk_trade_level_up_tt:0 "Положение наших торговых домов в метрополии: §G+1§! (не больше §Y3§!). Оно повышает выручку за партию топлива и доход торговой концессии."
 NAM_grp_wrk_trade_house_tt:0 "Поддержка групп:\n  Экспортные конторы: §G+6§! £NAM_support_trade_texticon\n  Наместники: §R-3§! £NAM_support_nam_texticon"
 NAM_colonial_watch_tt:0 "Подполье Вебера: §G-5§!."
 NAM_imperial_gendarmes_tt:0 "Подполье Вебера: §G-12§!."
 NAM_grp_imperial_gendarmes_tt:0 "Поддержка групп:\n  Наместники: §G+6§! £NAM_support_nam_texticon\n  Округа: §R-5§! £NAM_support_dist_texticon"
 NAM_oilfield_militia_tt:0 "Подполье Вебера: §G-6§!."
 NAM_grp_oilfield_militia_tt:0 "Поддержка групп:\n  Нефтяники: §G+5§! £NAM_support_oil_texticon\n  Округа: §G+4§! £NAM_support_dist_texticon\n  Наместники: §R-4§! £NAM_support_nam_texticon"
 NAM_pipeline_patrols_tt:0 "Подполье Вебера: §G-5§!."
 NAM_commissioner_plan_tt:0 "Подполье Вебера: §R+4§!."
 NAM_grp_commissioner_plan_tt:0 "Поддержка групп:\n  Наместники: §G+6§! £NAM_support_nam_texticon\n  Нефтяники: §R-4§! £NAM_support_oil_texticon"
 NAM_second_ledger_tt:0 "Сразу в скрытый резерв: §G+100§! £ADISCORD_economy_treasury_texticon.\nПока существует метрополия, каждый месяц в тайный резерв уходит §Y45§! £ADISCORD_economy_treasury_texticon из доли центра; доходы казны не уменьшаются.\nПри провозглашении независимости резерв поступает в казну."
 NAM_grp_second_ledger_tt:0 "Поддержка групп:\n  Экспортные конторы: §G+3§! £NAM_support_trade_texticon\n  Нефтяники: §G+3§! £NAM_support_oil_texticon\n  Наместники: §R-5§! £NAM_support_nam_texticon"
 NAM_metropolitan_instructors_tt:0 "Подполье Вебера: §G-10§!."
 NAM_grp_metropolitan_instructors_tt:0 "Поддержка групп:\n  Гарнизоны: §G+4§! £NAM_support_garr_texticon"
 NAM_quiet_officer_lists_tt:0 "При провозглашении независимости: §G+3000§! £manpower_texticon, поддержка гарнизонов §G+6§! £NAM_support_garr_texticon."
 NAM_grp_quiet_officer_lists_tt:0 "Поддержка групп:\n  Гарнизоны: §G+6§! £NAM_support_garr_texticon"
 NAM_sand_runs_out_vertical_tt:0 "При провозглашении независимости лестница печатей смещается к вертикали на §Y0.10§!."
 NAM_sand_runs_out_districts_tt:0 "При провозглашении независимости лестница печатей смещается к округам на §Y0.10§!."
 NAM_last_centre_register_reserve_tt:0 "Тайный резерв: §G+150§! £ADISCORD_economy_treasury_texticon."
 NAM_hidden_reserve_paid_tt:0 "Тайный резерв второй бухгалтерии поступает в казну: §G+[?NAM_hidden_reserve|0]§! £ADISCORD_economy_treasury_texticon."
 # ----- Defeated tree: island exile -----
 NAM_exile_mainland_contacts:0 "Связные на материке"
 NAM_exile_mainland_contacts_desc:0 "На промыслах остались наши люди: мастера, учителя, бывшие писари. Рыбацкие лодки повезут им письма и деньги, а обратно - сведения о новых хозяевах."
 NAM_exile_armed_underground:0 "Вооружённое подполье"
 NAM_exile_armed_underground_desc:0 "Сведений мало, нужны дела. Подпольщики получат оружие и начнут жечь склады и рвать связь на Северных месторождениях и в Южной гавани."
 NAM_exile_civic_underground:0 "Списки верных"
 NAM_exile_civic_underground_desc:0 "Не каждый, кто остался, готов стрелять, но многие готовы ждать. Составим списки верных - тех, кто откроет ворота и возьмёт на себя управление в день возвращения."
 NAM_exile_harbour_pilots:0 "Лоцманы Южной гавани"
 NAM_exile_harbour_pilots_desc:0 "Десант у Южной гавани погубят не пушки, а мели. Лоцманы, бежавшие на острова, расчертят фарватеры и проведут транспорты к причалам. Морская пехота высадится в Южной гавани, а Эфлор и Ажар встретят нас вместе. Совет столпов утверждает план: сначала гавань, потом промыслы, потом всё остальное."
 NAM_exile_voice_of_svetlogorye:0 "Голос Светлогорья"
 NAM_exile_voice_of_svetlogorye_desc:0 "Островной передатчик каждый вечер читает имена городов, которые мы вернём. Его слушают на кухнях Светлогорска и в казармах оккупантов."
 NAM_exile_klyuchevsk_strike:0 "Забастовка в Ключевске"
 NAM_exile_klyuchevsk_strike_desc:0 "Новые хозяева Ключевска хотят нашей нефти. Буровики остановят вышки, и каждая неделя забастовки обойдётся им дороже любого налёта."
 NAM_exile_general_staff:0 "Штаб в изгнании"
 NAM_exile_general_staff_desc:0 "Из уцелевших офицеров соберём штаб. У него нет полков, зато есть карты материка и время, чтобы научить новобранцев воевать."
 NAM_exile_landing_craft:0 "Десантные баржи"
 NAM_exile_landing_craft_desc:0 "Рыбацкие баржи и каботажные суда переоборудуем под перевозку войск."
 NAM_exile_cadre_army:0 "Кадровая армия"
 NAM_exile_cadre_army_desc:0 "Немногочисленная, но обученная армия: каждый солдат прошёл фронт ресурсной войны и знает, за что воюет. Гарнизоны поддержат такой выбор."
 NAM_exile_levy_of_exiles:0 "Ополчение изгнанников"
 NAM_exile_levy_of_exiles_desc:0 "Беженцев на островах больше, чем солдат. Поставим под ружьё всех, кто может держать винтовку, даже если острова устанут от призыва."
 NAM_exile_arms_purchases:0 "Закупки оружия"
 NAM_exile_arms_purchases_desc:0 "Островная казна оплатила партию винтовок, орудий и снаряжения ещё до поражения. Пора забрать её со складов посредников."
 NAM_exile_marine_orders:0 "Морская пехота"
 NAM_exile_marine_orders_desc:0 "Высадку начнут не пехотные полки, а морские стрелки. Откроем заказы на батальоны морской пехоты и выдадим им первое снаряжение."
 NAM_exile_strike_from_the_sea:0 "Удар с моря"
 NAM_exile_strike_from_the_sea_desc:0 "Главный удар нанесёт десант. Больше морской пехоты, больше транспортов - и Южная гавань падёт раньше, чем коалиция успеет подтянуть резервы."
 NAM_exile_strike_from_within:0 "Удар изнутри"
 NAM_exile_strike_from_within_desc:0 "Десант будет малым, но его встретят. Офицеры штаба переправятся на материк и подготовят восстание в день высадки."
 NAM_exile_landing_school:0 "Школа высадки"
 NAM_exile_landing_school_desc:0 "На пляжах островов отрабатываем высадку: погрузка, переход, выход на берег под огнём. Каждый батальон должен пройти её хотя бы раз."
 NAM_exile_sea_raiders:0 "Морские охотники"
 NAM_exile_sea_raiders_desc:0 "Флот у нас маленький, но суда коалиции ходят без охраны. Первые охотники выйдут в море за чужими грузами."
 NAM_exile_fences:0 "Скупщики добычи"
 NAM_exile_fences_desc:0 "Захваченный груз надо превратить в деньги. Портовые скупщики на островах не задают вопросов, если им платят вперёд."
 NAM_exile_letters_of_marque:0 "Каперские грамоты"
 NAM_exile_letters_of_marque_desc:0 "Правительство выдаёт капитанам грамоты: они воюют под нашим флагом и только с врагами. Коалиция назовёт это пиратством, но иностранные порты отнесутся к нам спокойнее."
 NAM_exile_free_brotherhood:0 "Вольное братство"
 NAM_exile_free_brotherhood_desc:0 "Капитаны сами выбирают добычу и делятся с казной. Улов богаче, моряков больше, но о нас заговорят во всех портах."
 NAM_exile_tanker_raids:0 "Охота на танкеры"
 NAM_exile_tanker_raids_desc:0 "Нашу нефть теперь вывозят из Южной гавани чужие танкеры. Будем перехватывать их у выхода из пролива - нефть вернётся к нам хотя бы так."
 NAM_exile_black_market:0 "Чёрный рынок оружия"
 NAM_exile_black_market_desc:0 "Скупщики знают, где продают винтовки без документов. За добычу можно купить то, что не продадут за деньги."
 NAM_exile_privateer_captains:0 "Капитаны каперов"
 NAM_exile_privateer_captains_desc:0 "Лучшим капитанам дадим настоящие корабли: сторожевики с островной верфи станут ядром рейдерского флота."
 NAM_exile_hidden_anchorages:0 "Тайные стоянки"
 NAM_exile_hidden_anchorages_desc:0 "В бухтах малых островов оборудуем стоянки, о которых не знает коалиция. Рейдеры будут уходить туда, а не в главный порт."
 NAM_exile_raider_squadron:0 "Рейдерская эскадра"
 NAM_exile_raider_squadron_desc:0 "Лёгкий крейсер собьёт любой конвой коалиции. Его будет видно издалека, зато и уйти от него никто не сможет."
 NAM_exile_wolfpacks:0 "Подводные стаи"
 NAM_exile_wolfpacks_desc:0 "Подводные лодки нападают незаметно и уходят до прихода эскорта. Коалиции будет труднее понять, откуда приходит беда."
 NAM_exile_corsair_admiralty:0 "Адмиралтейство каперов"
 NAM_exile_corsair_admiralty_desc:0 "Разрозненные экипажи становятся флотом. Адмиралтейство распределит рейды и подготовит корабли к сопровождению десанта."
 NAM_exile_island_chancellery:0 "Островная канцелярия"
 NAM_exile_island_chancellery_desc:0 "Министерства теснятся в портовых конторах. Разместим канцелярию как следует и проведём дороги от столицы к причалам."
 NAM_exile_free_port:0 "Вольный порт"
 NAM_exile_free_port_desc:0 "Откроем гавань для всех торговцев без пошлин. Казна получит сборы, конторы - работу, а у нас появятся свои суда."
 NAM_exile_naval_port:0 "Военный порт"
 NAM_exile_naval_port_desc:0 "Гавань нужна флоту, а не торговцам. Построим верфь и закроем причалы для чужих судов."
 NAM_exile_refugee_barracks:0 "Бараки беженцев"
 NAM_exile_refugee_barracks_desc:0 "Беженцы будут жить в бараках у учебных лагерей. Тесно и тяжело, но каждый мужчина из бараков пойдёт в армию возвращения."
 NAM_exile_refugee_homesteads:0 "Наделы на островах"
 NAM_exile_refugee_homesteads_desc:0 "Раздадим беженцам землю и работу у столицы. Они пустят корни на островах - и острова станут для них домом, а не лагерем."
 NAM_exile_coastal_batteries:0 "Береговые батареи"
 NAM_exile_coastal_batteries_desc:0 "Коалиция может прийти и сюда. Береговые батареи прикроют главные гавани островов."
 NAM_exile_island_steel:0 "Сталь Островов"
 NAM_exile_island_steel_desc:0 "Рудники на островах работали вполсилы, пока всё решала нефть. Теперь от них зависит каждая винтовка."
 NAM_exile_island_foundry:0 "Литейный двор"
 NAM_exile_island_foundry_desc:0 "Сталь острова больше не уйдёт на продажу. Литейный двор рядом с рудником даст армии собственное оружие."
 NAM_exile_overseas_districts:0 "Заморские округа"
 NAM_exile_overseas_districts_desc:0 "Острова больше не колония колонии. Их жители кормят, вооружают и защищают Светлогорье и получают те же права, что и материк."
