 NAM_econ_strategic_reserve:0 "Выкупить стратегический запас топлива"
 NAM_econ_strategic_reserve_delivered_tt:0 "§G+8000§! £fuel_texticon."
 NAM_econ_strategic_reserve_result_tt:0 "Через §Y21§! £time_texticon дн.: §G+8000§! £fuel_texticon."
 NAM_econ_strategic_reserve_refund_tt:0 "§G+650§! £ADISCORD_economy_treasury_texticon."
 NAM_econ_strategic_reserve_desc:0 "Цена: §Y30§! £political_power_texticon §Y650§! £ADISCORD_economy_treasury_texticon. Срок: §Y21§! £time_texticon дн. Повтор через §Y90§! £time_texticon дн. после завершения.\n\nВыкупите запасы частных хранилищ для армии, переработки или исполнения контрактов. Нужны Южная гавань и её топливное хранилище.\n§G+8000§! £fuel_texticon.\n\nПри капитуляции, подчинении или потере условий заказа вся оплата возвращается. Война сама по себе не прерывает работу. Результат получает Светлогорье."
