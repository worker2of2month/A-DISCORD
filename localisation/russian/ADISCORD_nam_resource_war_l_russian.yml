 ADISCORD_nam_resource_war.10.before: "Из столицы по-прежнему приходили распоряжения. Одно требовало ускорить вывоз нефти, другое запрещало расходовать резерв, третье возвращало неподписанную смету. Егор Ром попросил снять со стены схему подчинения и разложить её на столе. Линий оказалось больше, чем свободного места. Воркерланд ещё существовал, и ни одна из этих линий не освобождала местное правительство от ответственности за происходящее.\n\nКирилл Мезенцев положил рядом ведомость жалованья. Рабочие промыслов спрашивали, почему снова задержана выплата; в Светлогорске собирали подписи против поборов. Наместники требовали прежде восстановить дисциплину. Представители округов хотели увидеть счета. Ром выслушал всех. Он слишком хорошо знал, как легко составить ответ, после которого ничего не изменится.\n\nКогда-то людям обещали свободу и новую жизнь. Теперь ему самому приносили жалобы, которые можно было подшить, отправить наверх и перестать замечать. Для этого не требовалось ни жестокости, ни особой веры в государство. Достаточно было аккуратно выполнить свою часть работы. Так он служил много лет.\n\nРом не собирался становиться новым пророком. Он хотел, чтобы Светлогорье могло жить вне безумной машины Воркерланда и покровительства южных диктатур. Чужая защита снова означала бы чужие требования, а отвечать перед людьми пришлось бы здесь. Но и самостоятельность не наполняла казну. Нужно было сохранить учреждения, удержать промыслы и решить, чьи нужды больше нельзя откладывать.\n\nОн придвинул ведомость. Старую задолженность можно погасить целиком, расплатиться пока только с промыслами или сохранить деньги до следующего квартала. Полная выплата даст людям передышку, но потребует большего расхода. Промыслы получат своё раньше города, если выбрать их. Отсрочка оставит деньги правительству и долги тем, кто уже отработал. На этот раз подписывать предстояло решение, за которое Ром должен был отвечать сам."
 NAM_compact_interrupted_status: "§Yместная служба прервана; восстание уже предотвращено§!"
 NAM_south_final_ready_tt: "Кризис Юга открыт, Шахрабад не ведёт ограниченной войны с Мазаром, Кейзаном или Вейром, и война за Юг ещё не начата"
 NAM_south_seal_over_furnaces: "Подчинить Шахрабад"
 NAM_south_seal_over_furnaces_desc: "Наместническая лестница требует от печей того же, что и от каждого округа: отчёта, печати и права остановить решение. Если Шахрабад откажется, чрезвычайные писания поднимут округа."
 NAM_south_seal_over_furnaces_tt: "Начинается §Yвойна за Юг§!. Каждое независимое государство пустынь выберет сторону. При победе Шахрабад и его союзники станут §Yнаместничествами Светлогорья§!."
 NAM_south_oil_charter: "Хартия против картеля"
 NAM_south_oil_charter_desc: "Нефтяная хартия обещает соседям топливо и самоуправление. Печи Шахрабада предлагают выкуп, долг и монополию. На Юге может остаться только один договор."
 NAM_south_oil_charter_tt: "Начинается §Yвойна за Юг§!. Каждое независимое государство пустынь выберет сторону. При победе Шахрабад и его союзники сохранят администрации и войдут в §YНефтяную хартию§!."
 NAM_south_black_basin: "Чёрный бассейн"
 NAM_south_black_basin_desc: "Ажар потерял войну, но сохранил свои склады и гарнизоны. Наместническая лестница требует, чтобы Чёрный бассейн получил наместника Светлогорья."
 NAM_south_black_basin_tt: "§YАжар§! получает требование стать наместничеством Светлогорья. Если он откажется, мы объявим ему войну за полное присоединение."
 NAM_south_desert_offices: "Наместничества пустыни"
 NAM_south_desert_offices_desc: "Каждая новая печать удлиняет лестницу, но делает её прочнее. Кадир и Эфлор получают одно и то же требование: принять наместника или ответить армии."
 NAM_south_desert_offices_tt: "§YКадир§! и §YЭфлор§! получают требование стать наместничествами Светлогорья. Если страна откажется, мы объявим ей войну за полное присоединение."
 NAM_south_oil_for_water: "Нефть за воду"
 NAM_south_oil_for_water_desc: "У Светлогорья есть топливо, у пустынь есть вода и дороги. Нефтяная хартия предлагает Фенну, Рахме, Сардану и даже Ажару общий договор вместо вечного торга."
 NAM_south_oil_for_water_tt: "§YФенн§!, §YРахма§!, §YСардан§! и §YАжар§! получают приглашение вступить в союз Светлогорья. Отказ не ведёт к войне."
 NAM_south_fenn_guarantee: "Гарантия Фенна"
 NAM_south_fenn_guarantee_desc: "Эфлор по-прежнему считает Фенн мятежной провинцией. Хартия требует от Эфлора войти в договор на общих условиях и оставить Фенн в покое."
 NAM_south_fenn_guarantee_tt: "§YЭфлор§! получает требование войти в Нефтяную хартию как сателлит. Если он откажется, мы объявим ему войну за полное присоединение."
 NAM_administration_dynamic: "Канцелярия Светлогорья"
 NAM_administration_dynamic_desc: "Наместническая лестница превратилась в правительство. Каждая реформа меняет одну и ту же канцелярию: её подписи, сметы, промыслы и отношения с округами.\n\n\n\n\n\n £GFX_RUS_chancery_mandate_banner \n\n\n"
 NAM_garrison_dynamic: "Гарнизоны Светлогорья"
 NAM_garrison_dynamic_desc: "Охрана промыслов, колонны перекрёстков и морской конвой складываются в единую военную традицию Светлогорья.\n\n\n\n\n\n £GFX_texticon_RUS_black_army_banner \n\n\n"
 NAM_seal_registry: "Учёт полномочий"
 NAM_seal_registry_desc: "Каждая печать получает номер, каждый наместник - срок отчёта. Лестница, которую строила империя, теперь служит Светлогорью и считает его деньги."
 NAM_namestnik_garrisons: "Гарнизоны наместников"
 NAM_namestnik_garrisons_desc: "Наместник отвечает за порядок своего округа и получает постоянный гарнизон. Солдаты знают местность, а округ знает, кому подчиняется."
 NAM_oil_quotas: "Нефтяные квоты"
 NAM_oil_quotas_desc: "Промыслы работают по государственным квотам. Резерв топлива становится инструментом политики, а не товаром для случайного покупателя."
 NAM_ladder_of_seals: "Единое управление"
 NAM_ladder_of_seals_desc: "Лестница достроена: каждая ступень знает своё место, каждый приказ - свой путь."
 NAM_district_council: "Совет округов"
 NAM_district_council_desc: "Районы получают постоянный совет, который утверждает бюджет и проверяет министерства. Медленнее, но решения принимают те, кто будет их исполнять."
 NAM_oil_fund: "Нефтяной фонд"
 NAM_oil_fund_desc: "Часть нефтяной выручки уходит в общий фонд хартии. Из него оплачиваются поставки соседям, которые готовы связать со Светлогорьем своё будущее."
 NAM_district_militia: "Окружное ополчение"
 NAM_district_militia_desc: "Каждый район держит собственное ополчение. Оно не заменит армию, но не отдаст свои промыслы без боя."
 NAM_common_fuel_market: "Общий рынок топлива"
 NAM_common_fuel_market_desc: "Хартия устанавливает единые правила продажи топлива. Соседи покупают по договору, а не по милости наместника."
 NAM_south_war_council: "Военный совет Юга"
 NAM_south_war_council_desc: "Война за Юг требует одного штаба. Совет собирает командиров округов, нефтяников и союзников за одним столом."
 NAM_south_oil_tap: "Нефтяной кран"
 NAM_south_oil_tap_desc: "Печи Шахрабада горят на чужом топливе. Перекрыть его - значит остановить их заводы раньше, чем армии."
 NAM_south_field_fortresses: "Крепости промыслов"
 NAM_south_field_fortresses_desc: "Северные месторождения и Светлогорский округ превращаются в укреплённые районы. Каждая вышка должна стоить противнику дивизии."
 NAM_south_counteroffensive: "Контрнаступление на печи"
 NAM_south_counteroffensive_desc: "Оборона выиграла время. Теперь армия Светлогорья идёт к печам, пока Шахрабад не восстановил силы."
 NAM_south_heritage: "Наследство Юга"
 NAM_south_heritage_desc: "Светлогорье закрепляет первенство на Юге. Канцелярия определяет общий порядок отношений с сателлитами, наместничествами и членами хартии, сохраняя их территории и местные правительства."
 NAM_south_war_council_idea: "Военный совет Юга"
 NAM_south_war_council_idea_desc: "Единый штаб координирует округа и союзников до конца войны за Юг."
 NAM_south_counteroffensive_idea: "Контрнаступление на печи"
 NAM_south_counteroffensive_idea_desc: "Армия Светлогорья наступает, пока у противника не кончилось топливо."
 NAM_district_audit: "Ревизия округов"
 NAM_district_audit_desc: "§YЦЕНА§!: §Y50§! £political_power_texticon\n§YВЫПОЛНЕНИЕ§!: §Y30§! £time_texticon дн.\n§YПОВТОР§!: через §Y90§! £time_texticon дн. после завершения.\n\n§YРЕЗУЛЬТАТ§!\nРевизоры поднимаются по лестнице печатей и возвращают в казну то, что задержали округа.\nКазна по завершении ревизии: §G+250§! £ADISCORD_economy_treasury_texticon."
 NAM_charter_fuel_aid: "Топливо хартии"
 NAM_charter_fuel_aid_desc: "§YЦЕНА§!: [NAMGetCost_pp_25] £political_power_texticon [NAMGetCost_fuel_5000] £fuel_texticon\n§YПОВТОР§!: через §Y60§! £time_texticon дн. после применения.\n\n§YРЕЗУЛЬТАТ§!\nНефтяной фонд отправляет топливо союзникам Светлогорья на Юге.\nКаждому члену союза Светлогорья на Юге: §G+2500§! £fuel_texticon и §G+3%§! £stability_texticon."
 NAM_south_cut_fuel: "Перекрыть топливо"
 NAM_south_cut_fuel_desc: "§YЦЕНА§!: §Y30§! £political_power_texticon\n§YПОВТОР§!: через §Y45§! £time_texticon дн. после применения.\n\n§YРЕЗУЛЬТАТ§!\nКараваны и трубопроводы, ведущие к печам Шахрабада, получают приказ остановиться.\nЗапас Шахрабада: §R-4000§! £fuel_texticon."
 NAM_charter_members_tt: "Хотя бы одно государство Юга состоит в союзе Светлогорья"
 NAM_charter_fuel_aid_tt: "Каждый член союза Светлогорья на Юге получает §Y2500§! £fuel_texticon и §G+3%§! £stability_texticon."
 NAM_public_campaigns: "Пропаганда: голос Светлогорья"
 NAM_public_campaigns_desc: "§YПРОПАГАНДА СВЕТЛОГОРЬЯ§!\nСвободные места: §Y[?ADISCORD_available_campaign_slots|0]§! £operatives_propaganda_texticon\n\nВедомственные газеты, радио промыслов и собрания округов объясняют, зачем Светлогорью единая власть. Каждая действующая кампания занимает одно место.\n\nПропаганда открывается с первой описью. Колониальные фокусы открывают ранние кампании; после независимости их новые запуски определяет выбранный политический курс. Действующие кампании заканчиваются в срок и возвращают место. Контрпропаганда сдерживает рост подполья."
 NAM_campaign_slot_available_tt: "Есть свободное место для кампании: §Y[?ADISCORD_available_campaign_slots|0]§!"
 NAM_campaign_second_slot_tt: "Доступно ещё §G1§! место для пропагандистских кампаний."
 NAM_campaign_oil_is_ours: "«Нефть принадлежит Светлогорью»"
 NAM_campaign_oil_is_ours_desc: "§YЦЕНА§!: §Y35§! £political_power_texticon\n§YДЕЙСТВИЕ§!: §Y45§! £time_texticon дн.\n§YПОВТОР§!: через §Y75§! £time_texticon дн. после завершения.\n\n§YРЕЗУЛЬТАТ§!\nПлакаты на промыслах напоминают, что соседи называют эту землю своей. Каждая вышка - граница, которую придётся защищать.\nЕженедельно: §G+0,2%§! £war_support_modifiericons_texticon. Организация армии: §G+3%§! £organization_texticon."
 NAM_campaign_every_seal_counts: "«Каждая печать на счету»"
 NAM_campaign_every_seal_counts_desc: "§YЦЕНА§!: §Y35§! £political_power_texticon\n§YДЕЙСТВИЕ§!: §Y60§! £time_texticon дн.\n§YПОВТОР§!: через §Y80§! £time_texticon дн. после завершения.\n\n§YРЕЗУЛЬТАТ§!\nКанцелярия публикует отчёты округов и обещает, что ни одна подпись не пропадёт бесследно. Порядок становится заметным.\nЕженедельно: §G+0,3%§! £stability_texticon."
 NAM_campaign_wages_on_time: "«Жалованье вовремя»"
 NAM_campaign_wages_on_time_desc: "§YЦЕНА§!: §Y25§! £political_power_texticon\n§YДЕЙСТВИЕ§!: §Y50§! £time_texticon дн.\n§YПОВТОР§!: через §Y70§! £time_texticon дн. после завершения.\n\n§YРЕЗУЛЬТАТ§!\nГазеты печатают графики выплат, а инспекторы следят, чтобы обещания совпали с ведомостями. Люди меньше тратят на запас.\nТовары народного потребления: §G-3%§! £consumer_goods_texticon. Еженедельно: §G+0,1%§! £stability_texticon."
 NAM_campaign_ladder_holds: "«Лестница держит»"
 NAM_campaign_ladder_holds_desc: "§YЦЕНА§!: §Y20§! £political_power_texticon\n§YДЕЙСТВИЕ§!: §Y50§! £time_texticon дн.\n§YПОВТОР§!: через §Y70§! £time_texticon дн. после завершения.\n\n§YРЕЗУЛЬТАТ§!\nНаместники объясняют, что вертикаль защищает каждого от хаоса распада. Подписи проходят быстрее, сборы - полнее.\nЕжедневно: §G+0,15§! £political_power_texticon. Сбор налогов: §G+5%§! £ADISCORD_economy_tax_texticon."
 NAM_campaign_charter_of_districts: "«Хартия районов»"
 NAM_campaign_charter_of_districts_desc: "§YЦЕНА§!: §Y30§! £political_power_texticon\n§YДЕЙСТВИЕ§!: §Y55§! £time_texticon дн.\n§YПОВТОР§!: через §Y75§! £time_texticon дн. после завершения.\n\n§YРЕЗУЛЬТАТ§!\nРайоны рассказывают о школах, мостах и мастерских, построенных по общей хартии. Люди охотнее берутся за общие работы.\nЕженедельно: §G+0,2%§! £stability_texticon. Строительство: §G+5%§! £construction_speed_texticon."
 NAM_campaign_furnaces_threaten_the_desert: "«Печи грозят пустыне»"
 NAM_campaign_furnaces_threaten_the_desert_desc: "§YЦЕНА§!: §Y35§! £political_power_texticon\n§YДЕЙСТВИЕ§!: §Y45§! £time_texticon дн.\n§YПОВТОР§!: через §Y70§! £time_texticon дн. после завершения.\n\n§YРЕЗУЛЬТАТ§!\nКанцелярия показывает Шахрабад жадным картелем, который хочет сжечь чужую нефть в своих печах. Юг должен выбрать, кому верить.\nЕженедельно: §G+0,3%§! £war_support_modifiericons_texticon. Восстановление организации: §G+5%§! £organization_gain_texticon."
 NAM_supports: "Опоры Светлогорья"
 NAM_supports_desc:0 ""
 NAM_loyalty_dynamic: "Опоры Светлогорья"
 NAM_loyalty_dynamic_desc: "Власть Светлогорья держится на пяти группах. Их поддержка, умноженная на вес во власти, определяет лояльность государства."
 NAM_supports_council: "Совет опор"
 NAM_supports_council_desc: "Наместники, нефтяники, округа, гарнизоны и экспортные конторы садятся за один стол. Светлогорье держится не на одной печати, а на равновесии тех, кто её признаёт."
 NAM_supports_oil_compact: "Договор с промыслами"
 NAM_supports_oil_compact_desc: "Нефтяники получают гарантии найма и часть выручки. Конторы недовольны, но промыслы работают без перебоев."
 NAM_supports_export_houses: "Экспортные дома"
 NAM_supports_export_houses_desc: "Конторы получают право вывозить нефть по долгосрочным договорам. Казна пополняется, а промыслы чувствуют себя проданными."
 NAM_supports_balance: "Равновесие опор"
 NAM_supports_balance_desc: "Ни одна группа не должна стать сильнее государства. Канцелярия учится уступать понемногу каждой."
 NAM_ladder_ending_iron: "Утвердить новый порядок"
 NAM_ladder_ending_iron_desc: "Лестница становится государством. Наместники получают больше власти, чем когда-либо при империи."
 NAM_ladder_ending_service: "Провозгласить республику"
 NAM_ladder_ending_service_desc: "§YГражданские реформы§!\n\nЛестница превращается в гражданскую службу. Округа и промыслы получают больше веса в управлении."
 NAM_charter_ending_federation: "Учредить федерацию"
 NAM_charter_ending_federation_desc: "§YОкружное самоуправление§!\n\nОкруга получают решающий голос в государстве. Наместническая лестница остаётся в прошлом."
 NAM_charter_ending_oil_union: "Учредить Союз"
 NAM_charter_ending_oil_union_desc: "§YВласть нефтяников§!\n\nПромыслы становятся сердцем государства. Нефтяники получают вес, которого не имели никогда."
 NAM_grp_vertical_tt: "Поддержка групп:\n  Наместники: §G+15§! £NAM_support_nam_texticon\n  Округа: §R-10§! £NAM_support_dist_texticon"
