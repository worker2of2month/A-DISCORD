 NAM_bw_repair_body:0 "§YВосстановить скважины§!: §Y45§! дней.\nСостояние промысла §G+30§!, с пожарными дружинами §G+45§!, не выше §Y100§!. Пропускная способность пересчитывается. При потере, выжигании или полном восстановлении промысла задаток возвращается.\nЦена: "
