 NAM_econ_emergency_service_result_tt:0 "Через §Y14§! £time_texticon дн.: Состояние выбранного промысла: §G+50§! пунктов, не выше §Y100§!."
 NAM_econ_emergency_service_refund_tt:0 "Возврат оплаты: §Y30§! £political_power_texticon §Y250§! £ADISCORD_economy_treasury_texticon"
 NAM_econ_emergency_service_desc:0 "Цена: §Y30§! £political_power_texticon §Y250§! £ADISCORD_economy_treasury_texticon. Срок: §Y14§! £time_texticon дн. Повтор через §Y45§! £time_texticon дн.\n\nСостояние выбранного промысла: §G+50§! пунктов, не выше §Y100§!.\nЗанимает одно общее место проектов и выбранный промысел до завершения. При потере площадки, капитуляции, подчинении или утрате условий обе валюты возвращаются, место освобождается. На выжженных промыслах работы недоступны."
