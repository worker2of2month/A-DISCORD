 NAM_pirate_raid_lane_coast_unlock_tt:0 "После применения решения: набег приносит добычу и топливо, повышая дурную славу; суда Эфлора увеличивают выручку, а провал грозит потерями."
 NAM_pirate_raid_lane_crossing_unlock_tt:0 "После применения решения: набег приносит добычу и топливо с риском потерь и роста дурной славы; рейсы без судов коалиции менее заметны."
 NAM_pirate_raid_lane_oil_unlock_tt:0 "После применения решения: на маршрутах коалиции можно получить особенно богатую добычу и топливо ценой наибольшего риска."
 NAM_pirate_raid_lane_strait_unlock_tt:0 "После применения решения: набег приносит добычу и топливо с риском потерь и роста дурной славы; рейсы без судов коалиции менее заметны."
 NAM_postwar_rearmament_unlock_tt:0 "После применения решения: закупает винтовки, снаряжение поддержки и грузовики."
 NAM_prepare_line_unlock_tt:0 "После применения решения: строит укрепления на сухопутных границах и в пограничных городах выбранного округа."
 NAM_project_pipeline_unlock_tt:0 "После применения решения: увеличивает пропускную способность нефтяных поставок, пока мы удерживаем Сухоречье и Южную гавань."
 NAM_project_refinery_unlock_tt:0 "После применения решения: строит НПЗ в выбранном округе и увеличивает пропускную способность под нашим контролем."
 NAM_project_repair_wells_unlock_tt:0 "После применения решения: восстанавливает скважины и возвращает пропускную способность промысла."
 NAM_project_sea_terminal_unlock_tt:0 "После применения решения: позволяет Южной гавани обслуживать дополнительный топливный контракт с Кефрейтом, Стеландером, партией или Русом."
 NAM_pw_district_congress_unlock_tt:0 "После применения решения: укрепляет доверие округов для ополчения и кооперативов ценой поддержки наместников."
 NAM_pw_district_cooperative_unlock_tt:0 "После применения решения: развивает участок Светлогорска, строит фабрику при наличии места и укрепляет доверие округов."
 NAM_pw_district_schools_unlock_tt:0 "После применения решения: готовит ремонтную колонну с грузовиками, поездами и снаряжением поддержки."
 NAM_pw_export_shipment_unlock_tt:0 "После применения решения: продаёт оплаченную партию топлива в пользу казны."
 NAM_pw_fuel_quota_unlock_tt:0 "После применения решения: пополняет топливный запас ценой поддержки нефтяников."
 NAM_pw_garrison_order_unlock_tt:0 "После применения решения: закупает винтовки и снаряжение поддержки; без ведомственного жилья страдает доверие округов."
 NAM_pw_militia_reserve_unlock_tt:0 "После применения решения: готовит вооружённый местный резерв."
 NAM_pw_state_arsenal_unlock_tt:0 "После применения решения: закупает артиллерию и строит военный завод на свободной площадке гавани."
 NAM_pw_veteran_course_unlock_tt:0 "После применения решения: даёт армейский опыт и командный ресурс."
 NAM_rad_garrison_order_unlock_tt:0 "После применения решения: укрепляет власть через действующие гарнизоны ценой ежемесячного содержания."
 NAM_rad_terror_campaign_unlock_tt:0 "После применения решения: укрепляет власть ценой стабильности."
 NAM_radical_labour_camp_unlock_tt:0 "После применения решения: увеличивает местную добычу ценой рабочей силы, строительства и роста сопротивления."
 NAM_radical_strip_state_unlock_tt:0 "После применения решения: извлекает деньги, топливо и вооружение ценой демонтажа заводов и длительного ущерба округу."
 NAM_relief_batch_unlock_tt:0 "После применения решения: закупает винтовки и снаряжение поддержки для воюющей армии."
 NAM_renegotiate_val_concession_unlock_tt:0 "После применения решения: предлагает Кефрейту заплатить за сохранение концессии или отказаться от неё."
 NAM_restitution_note_unlock_tt:0 "После применения решения: даёт разовую отсрочку нападения для уточнения территориальных претензий."
 NAM_scorch_wells_unlock_tt:0 "После применения решения: выводит промысел из строя и затрудняет снабжение захватчика; выжженные скважины временно исключаются из штрафа за потерю промыслов."
 NAM_sign_compact_unlock_tt:0 "После применения решения: защищает округ от восстания в начале ресурсной войны, если договор успел непрерывно действовать под нашим владением и контролем."
 NAM_south_allied_fuel_unlock_tt:0 "После применения решения: передаёт наше топливо выбранному союзнику и укрепляет его поддержку войны."
 NAM_south_convoy_interdiction_unlock_tt:0 "После применения решения: уничтожает часть топлива Шахрабада, временно блокирует его конвои и даёт морской опыт."
 NAM_south_cut_fuel_unlock_tt:0 "После применения решения: уничтожает часть топливного запаса Шахрабада."
 NAM_supply_order_unlock_tt:0 "После применения решения: закупает винтовки и снаряжение поддержки; интендантство добавляет оружие отделения."
 NAM_veteran_housing_unlock_tt:0 "После применения решения: строит фабрику в Южной гавани и временно ускоряет строительство."
 NAM_weber_talks_1_unlock_tt:0 "После применения решения: ослабляет подполье через переговоры и укрепляет доверие округов."
 NAM_workshop_batch_unlock_tt:0 "После применения решения: закупает снаряжение поддержки."
 NAM_wrk_emergency_echelon_unlock_tt:0 "После применения решения: обменивает наше топливо на винтовки и снаряжение метрополии, укрепляя поддержку наместников."
 NAM_wrk_fuel_shipment_unlock_tt:0 "После применения решения: продаёт наше топливо метрополии и укрепляет наместников ценой поддержки нефтяников."
 NAM_wrk_trade_concession_unlock_tt:0 "После применения решения: увеличивает еженедельный доход казны, пока существует метрополия."

 # Armed services
 NAM_navy_dynamic:0 "Светлогорская флотилия"
 NAM_navy_dynamic_desc:0 "Южная гавань связывает материк с островами. Сторожевые корабли, транспортные команды и ремонтные мастерские составляют основу собственной морской службы."
 NAM_air_dynamic:0 "Воздушная служба Светлогорья"
 NAM_air_dynamic_desc:0 "Унаследованные машины требуют механиков, лётчиков и собственного порядка вылетов. Воздушная служба объединяет аэродромы и эскадрильи для защиты страны."
 NAM_naval_staff:0 "Морской штаб"
 NAM_naval_staff_desc:0 "Каждый капитан знает свой участок, но никто не видит весь бассейн. Морской штаб сведёт донесения, расписания конвоев и решения командиров в один порядок, чтобы эскадра выходила в море по общему плану, а не по старой привычке."
 NAM_grp_landing_school_tt:0 "Поддержка гарнизонов: §G+5§! £NAM_support_garr_texticon."
 NAM_flight_school:0 "Светлогорская лётная школа"
 NAM_flight_school_desc:0 "После ухода центральных ведомств лётчики и инструкторы остались без общего руководства. Собственная школа соберёт их у столичного аэродрома и вернёт подготовку экипажей к регулярному расписанию."
 NAM_air_ground_service:0 "Наземная служба аэродромов"
 NAM_air_ground_service_desc:0 "У аэродромной мастерской механик объясняет лётчику запись в журнале. Тот помнит неисправность иначе и рисует на полях схему захода. Начальник наземной службы просит сохранить оба объяснения."
 NAM_air_interceptors:0 "Прикрытие промыслов"
 NAM_air_interceptors_desc:0 "Насосные станции и хранилища слишком важны, чтобы встречать налёты только зенитным огнём. Дежурные истребители будут подниматься по сигналам наблюдателей и прикрывать промышленный район."
 NAM_air_support:0 "Авиация поля боя"
 NAM_air_support_desc:0 "Нашим частям приходится сражаться за узкие дороги и отдельные переправы. Штурмовые эскадрильи будут работать по заявкам наземных командиров и расчищать путь наступающим колоннам."
 NAM_air_operations:0 "Единое управление полётами"
 NAM_air_operations_desc:0 "Отдельные эскадрильи должны действовать по общему замыслу. Диспетчеры, наблюдатели и штабы согласуют маршруты, смены экипажей и порядок передачи целей."
 NAM_air_fighter_order:0 "Закупить истребители"
 NAM_air_fighter_order_desc:0 "Закупочная комиссия принимает восстановленные истребители вместе с документацией. Перед передачей в части машины проходят проверку и облёт."
 NAM_air_cas_order:0 "Закупить штурмовики"
 NAM_air_cas_order_desc:0 "Авиамастерские подготовят партию штурмовых машин. Инспекторы проверят крепления вооружения, связь и работу двигателей перед передачей самолётов в части."
 NAM_air_fighter_order_unlock_tt:0 "После применения решения: партия истребителей поступает в резерв ВВС."
 NAM_air_cas_order_unlock_tt:0 "После применения решения: партия штурмовиков поступает в резерв ВВС."
 NAM_air_order_cost:0 "§Y30§! £political_power_texticon §Y300§! £ADISCORD_economy_treasury_texticon §Y1000§! £fuel_texticon"
 NAM_air_order_cost_blocked:0 "§R30§! £political_power_texticon §R300§! £ADISCORD_economy_treasury_texticon §R1000§! £fuel_texticon"
 NAM_air_order_cost_tooltip:0 "§Y30§! £political_power_texticon §Y300§! £ADISCORD_economy_treasury_texticon §Y1000§! £fuel_texticon"
 NAM_air_trial_tt:0 "Комиссия разрешает один пробный заказ на выбор: истребители или штурмовики. Расходуются обычные средства заказа. Покупки по действующему довоенному договору сохраняют право испытать другой тип."
 NAM_air_trial_spent_tt:0 "Будет использован единственный пробный заказ авиационной комиссии."
 NAM_air_fighter_series_tt:0 "После применения решения: регулярные заказы истребителей поставляют $ADISCORD_fighter_airframe_2161$ вместо $ADISCORD_fighter_airframe_2163$.\nДовоенный договор на штурмовики сохраняется, если он был заключён."
 NAM_air_cas_series_tt:0 "После применения решения: регулярные заказы штурмовиков поставляют $ADISCORD_attack_airframe_2163$ вместо $ADISCORD_cas_airframe_2170$.\nДовоенный договор на истребители сохраняется, если он был заключён."
 NAM_air_workshop_exchange_tt:0 "При каждом заказе самолётов выбранной специализации мастерские могут обменять ещё §Y12§! машин прежней серии со склада на §G12§! машин новой серии. Обмен проходит только при наличии всей партии."
 NAM_air_fighter_instructor_tt:0 "Ирина Седова, позывной Чайка, поступит в распоряжение истребительной авиации как §Yас§!. Её можно назначить в авиакрыло."
 NAM_air_cas_instructor_tt:0 "Андрей Рудин, позывной Филин, поступит в распоряжение штурмовой авиации как §Yас§!. Его можно назначить в авиакрыло."
 NAM_air_order_treasury_tt:0 "Казна: §R-300§! £ADISCORD_economy_treasury_texticon."
 NAM_preparation_gateway_tt:0 "§GОткрывает новые фокусы§!"
 NAM_council_industrial_research:0 "Техническая экспертиза подрядов"
 NAM_war_headquarters_free_tt:0 "Штаб не проводит другую операцию снабжения или контрудара."
 NAM_war_operation_cancel_tt:0 "Операция прекращается. Израсходованные средства и топливо не возвращаются."
 NAM_council_fuel_reserve:0 "Сформировать топливный резерв"
 NAM_council_fuel_reserve_desc:0 "Промысловые конторы выделят смены и цистерны для государственного резерва. Поставку оформят отдельно от текущих экспортных обязательств."
 NAM_council_import_machinery:0 "Закупить гражданские станки"
 NAM_council_import_machinery_desc:0 "Новые станки займут цеха, рассчитанные на мирные заказы. Приёмщики проверят поставку вместе с местными мастерами."
 NAM_council_arsenal_contract:0 "Разместить оружейный контракт"
 NAM_council_arsenal_contract_desc:0 "Военная приёмка объединит заявки гарнизонов в одну партию. Подрядчики подготовят стрелковое вооружение и орудия по согласованным образцам."
 NAM_war_supply_priority:0 "Приоритет фронтовому снабжению"
 NAM_war_supply_priority_desc:0 "Транспортное управление отдаст действующим частям первоочередное право на подвоз. Штаб сосредоточится на маршрутах, ремонте и сохранении устойчивой линии обороны."
 NAM_war_supply_priority_unlock_tt:0 "После применения решения: временно снижает расход снабжения и укрепляет оборону, занимая общий штабной канал."
 NAM_war_counterstroke_operation:0 "Провести подготовленный контрудар"
 NAM_war_counterstroke_operation_desc:0 "Передовые штабы получат согласованные задачи, а колонны подвоза - маршруты к месту сосредоточения. Резерв выступит по единому приказу."
 NAM_war_counterstroke_operation_unlock_tt:0 "После применения решения: временно усиливает атаку и планирование, занимая общий штабной канал."
