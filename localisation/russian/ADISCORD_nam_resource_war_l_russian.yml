 ADISCORD_nam_memoir.1.t: "Записки Егора Рома. Право говорить"
 ADISCORD_nam_memoir.1.d: "В семнадцать лет я служил в ключевской управе и переписывал накладные на нефтяные грузы. Дома и на промыслах говорили на общинном. Позднее, став писарем при императорском дворе, я освоил высоковейранский: без него нельзя было составить прошение так, чтобы его приняли. После революции я сохранил фамилию и продолжил службу. Вскоре нам выдали новые словари.\n\nЕдиноречь была устроена просто. Правила помещались в тонкую книжку, исключений почти не было. На первых занятиях мы смеялись над собственным произношением. Преподаватель обещал, что вскоре любой рабочий сможет прочитать любой приказ, а человек с другого конца страны перестанет чувствовать себя чужим. Я тогда охотно ему верил.\n\nПотом пришло распоряжение принимать бумаги только на единоречи. За ним - школьные программы, перечни допустимых названий и экзамены для служащих. Уоркер говорил о поколении, которое больше не будет разделено происхождением. В ведомственных указаниях это означало, что дети должны были перестать пользоваться языками родителей даже на переменах. Общинный тоже попал в число пережитков, хотя на нём говорила значительная часть страны.\n\nУже в первые месяцы моего наместничества в Светлогорье ко мне пришла учительница из промыслового посёлка. Она принесла два букваря. Один был утверждён министерством, другой переписан от руки: старых книг школе больше не выдавали. На обложке рукописного стояла детская фамилия. Инспектор нашёл его в классе и потребовал отстранить учительницу за сохранение местного языка.\n\nОна объяснила, что первоклассники не понимают новых учебников. Чтобы научить их читать, приходится сначала объяснять слова на общинном. Я спросил, почему это нельзя делать после уроков. Она посмотрела на меня и ответила: \"После уроков им тоже запрещено\". Я раскрыл приложенное распоряжение. Исключения для свободного времени там действительно не было.\n\nЕё заявление было написано на единоречи, без единой ошибки. Внизу она просила разрешить детям говорить. Я оставил оба букваря у себя и назначил поездку в школу."
 ADISCORD_nam_memoir.11.d: "В классе дети встали и хором поприветствовали меня на единоречи. Учительница держала руки перед собой, инспектор стоял у двери. На стене висела карта с новыми названиями посёлков. Под одним из них проступало старое: краска ещё не успела высохнуть, и кто-то провёл по ней пальцем.\n\nЯ попросил мальчика у окна прочитать несколько строк. Он прочитал быстро, потом я спросил, о чём говорится в книжке. Мальчик замолчал. Учительница повторила вопрос на общинном, и он сразу ответил. Инспектор сделал пометку. Я видел, как остальные дети следили за его карандашом.\n\nНа последней парте лежало письмо. Девочка писала бабушке, которая жила в другом округе. Письмо входило в задание по единоречи: нужно было рассказать о школе и новой жизни. Я спросил, сможет ли бабушка его прочесть. Девочка сказала, что нет, но дома мать переведёт. Инспектор пояснил, что взрослые должны посещать вечерние курсы. До ближайших курсов от той деревни было два дня пути.\n\nПосле урока он показал мне ведомость. В ней учитывали число детей, перешедших на единоречь, и нарушения языкового режима. За разговоры на родном языке снижали оценку поведения; родителей вызывали в управу. От учительницы требовали подтвердить, что к концу года местная речь исчезнет из класса. В отчёте это называлось преодолением разобщённости.\n\nЯ велел оставить её на работе до повторной проверки. Разрешения преподавать на общинном не подписал: оно противоречило министерской программе. Учительница спросила, что ей делать завтра. Я ответил, что распоряжение о её отстранении пока не вступит в силу. Она убрала заявление в папку. На её вопрос я так и не ответил.\n\nВ канцелярии нашлась моя подпись под циркуляром, который разослали школам округа. Я помнил, как подписывал его вместе с ведомостями топлива и ремонта. В столицу уже ушло донесение об успешном переходе. В приложении были перечислены языки, на которых дети больше не должны были говорить. Рядом с каждым стоял срок."
 ADISCORD_nam_memoir.2.t: "Записки Егора Рома. Ключевск"
 ADISCORD_nam_memoir.2.d: "Отец работал бурильщиком в Ключевске. После несчастного случая он лишился руки. Решение о компенсации оформили через четыре года; ожидание выплаты и оформление права на неё в разговорах постоянно смешивали. Для чиновника это были разные стадии дела. Отец хотел знать, на что жить, и каждый новый ответ понимал как обещание денег.\n\nЯ помню, как он перечитывал полученное извещение. В нём признавали случившееся и ссылались на порядок дальнейшего рассмотрения. Он попросил объяснить последнюю строку. Я уже умел разбирать такие формулировки и сказал, что дело наконец принято. На вопрос, когда заплатят, ответить не смог. Потом мне много раз доводилось самому составлять похожие письма.\n\nНа промыслах мне по-прежнему легче говорить с управляющим, чем с бригадой. Управляющий знает, какие сведения нужны для доклада, и готовит их заранее. Рабочие начинают с того, что у них сломалось, кому не выдали причитающееся и кто обещал разобраться. Разговор идёт дольше, приходится уточнять имена. Иногда я ловлю себя на том, что уже жду, когда они закончат.\n\nАрсений Тарханов хорошо знает Ключевск и охотно показывает, что без него здесь не обойтись. Он может объяснить, какой насос остановится без ремонта и где нужен опытный мастер. Из этого он делает вывод, что ему следует доверять и во всём остальном. С частью его доводов трудно спорить. Но знание промысла ещё не объясняет, почему одна задолженность погашена, а другую снова перенесли.\n\nКогда я прошу разобраться с жалобой, мне приносят ответ управления. Он бывает составлен совершенно правильно. По нему видно, куда ушло обращение и на каком основании. Чтобы узнать, получил ли человек положенное, приходится задавать отдельный вопрос. Обычно именно на него ответ ещё не готов."
 ADISCORD_nam_memoir.12.d: "На переговорах о месторождениях мне показывают документы о прежних владельцах. Я не могу отвергнуть их только потому, что сегодня эти земли управляются из Светлогорска. Воркерланд менял границы, не спрашивая всех, кого это касалось. Среди тех, кто работал на промыслах, тоже могли быть люди, потерявшие землю или уехавшие сюда после чужого решения.\n\nНо и передача округа соседям сама по себе ничего не объясняет нынешним жителям. Кто примет обязательства перед рабочими? Сохранятся ли жильё и заработок? Что будет с семьями, которые хотят остаться, и с теми, кто решит уехать? Мне не нравится, когда на эти вопросы отвечают общими словами о восстановленной справедливости. Нравится ещё меньше, когда я замечаю такие же слова в нашем ответе.\n\nВ ведомстве удобно считать нефть доходом. На месте приходится видеть расходы, которые этот доход поддерживают: ремонт, снабжение, лечение пострадавших. Если их откладывать, сумма в отчёте какое-то время выглядит лучше. Управляющий получает основание говорить об успехе, а следующую поломку объясняет непредвиденными обстоятельствами. Я принимал такие объяснения и знаю, почему их продолжают приносить.\n\nОтец умер раньше, чем я стал наместником. Иногда представляю, как сообщил бы ему о назначении. Он наверняка спросил бы о работе, а я начал бы рассказывать о полномочиях. Не знаю, обрадовался бы он. У него были причины относиться к моему начальству плохо, и новая должность сына не обязательно изменила бы его мнение.\n\nИз его истории я не получил готового способа управления. Когда в казне мало денег, приходится выбирать и кому-то отказывать. Но я могу хотя бы различать отказ и обещание, которое не собираюсь выполнять. На промыслах эту разницу понимают без объяснений. Я хотел бы, чтобы в моём управлении её тоже перестали путать."
 ADISCORD_nam_memoir.3.t: "Записки Егора Рома. Город и подполье"
 ADISCORD_nam_memoir.3.d: "Из записей о Светлогорске, сделанных до переговоров с подпольем.\n\nУтром по дороге в управу я видел надписи на стенах. Одни требовали хлеба, другие - открыть счета, третьи называли чиновников, которых следовало убрать. Моя фамилия встречалась часто. Сопровождавший меня служащий уверял, что всё написала небольшая группа известных смутьянов. Возможно, часть надписей и принадлежала одним людям. Из этого не следовало, что остальные довольны.\n\nВебера я помнил ещё юношей. Он приносил прошения от своей улицы и подолгу ждал в коридоре. Не берусь утверждать, что прочёл каждое: часть таких обращений разбирали без меня. В приёмном журнале оставались отметки о передаче в отдел. Служащий, который его принимал, уже работал в другом месте; кого следовало спросить об ответе, сразу не нашли.\n\nПозднее в докладах о нём появились склады, связные и люди в гарнизонах. Я спросил, сохранились ли прежние прошения. Их удалось найти не сразу. В одном месте лежали входящие, в другом - ответы управлений, а повторные обращения подшили отдельно. Пока всё собирали, мне ещё раз доложили, что Вебер опасен. С этим я не спорил; меня интересовало, что мы делали до того, как понадобился такой доклад.\n\nВ докладе предлагалось приобщить прошения к материалам о подполье. Я спросил, значит ли это, что по ним больше не будут готовить ответ. Инспектор сказал, что прежде нужно установить связи заявителей. Разговор опять вернулся к складам. Я потребовал оставить в деле копии обращений с датами: по одному перечню связных нельзя было понять, кто и когда приходил в управу.\n\nВ тот вечер я попросил оставить обращения у меня. Некоторые были составлены так, что хотелось сразу вернуть их за неправильным оформлением. Я отметил, какие сведения действительно нужны для решения, а какие мы требовали по привычке. Получилось меньше, чем ожидал. Разговор с инспекторами на следующее утро от этого проще не стал."
 ADISCORD_nam_memoir.13.d: "Инспекторы хотели получить распоряжение о складах. Представители округов предлагали начать переговоры. Каждый объяснял, почему другой способ лишь потеряет время. Инспекторы говорили об оружии, округа - о поддержке среди жителей. Я сначала пытался добиться общего заключения. Его не было, и никто не собирался подписывать чужой риск.\n\nЯ не хотел боя в Светлогорске. Там оставались семьи, мастерские, склады и люди, которые могли не поддерживать ни правительство, ни Вебера. Вместе с тем я боялся, что уступка покажет всем остальным, как следует разговаривать с наместником. Этот страх редко попадал в мои официальные ответы. На заседаниях я предпочитал говорить об интересах государства.\n\nОдно было ясно: найденное оружие не решало спора о жалованье и поборах. Но и выплата жалованья не давала права объявить, что оружия больше нет. Любой выбранный путь требовал проверить его результат. Я просил докладывать отдельно о задержанных, о возвращённых запасах и о том, какие жалобы удалось разобрать. Из общей фразы \"обстановка спокойная\" этого узнать нельзя.\n\nМне передали предложение о встрече через людей, которым доверяли в округах. Я долго уточнял, что они вправе обещать от моего имени. Возможно, со стороны это выглядело как очередная попытка затянуть дело. Отчасти так и было: пока обсуждаются полномочия посредника, не нужно отвечать на само требование.\n\nНа следующем совещании спросили, получил ли посредник полномочия. Мезенцев напомнил о проекте ответа, который лежал у меня со вчерашнего дня. Я стал искать его среди докладов инспекции. Представитель округа ждал, не предлагая другого выхода. Пришлось отложить остальные бумаги и прочитать проект вслух. На месте, где перечислялись допустимые уступки, я остановился и попросил его пояснить вторую строку."
 ADISCORD_nam_memoir.4.t: "Записки Егора Рома. Соседи"
 ADISCORD_nam_memoir.4.d: "Из записей о переговорах с Эфлором и Ажаром.\n\nВ архиве я просил поднять старые карты бассейна. На них граница проходила по-разному: у одной комиссии ориентиром служила река, у другой - дорога. Воркерландские хозяйственные схемы иногда вообще не показывали политической границы; составителям нужно было отметить трубопровод и места погрузки. Такую схему удобно держать в кабинете, пока никто не спросит, на каком основании мы распоряжаемся землёй.\n\nЛюди из Эфлора и Ажара ссылались на свои документы. Я не считал их требования справедливыми во всём, но было бы ошибкой думать, что они придуманы только ради нашей нефти. За претензиями стояли потерянные доходы, старые решения об изъятии и ожидания людей, которым обещали возврат. У соседних правительств тоже были причины выбирать удобные свидетельства и не замечать остальные.\n\nМне приходилось делать то же самое. Перед встречей сотрудники готовили папку с доводами в нашу пользу. Если я спрашивал о противоречащем документе, начиналось объяснение, почему его лучше не предъявлять. Иногда объяснение было разумным. Иногда мы просто надеялись, что чужая сторона о нём не знает. Я не всегда настаивал на продолжении разговора.\n\nДругая граница означала бы другую администрацию. Что именно это изменит для жителей, зависело от условий, которых ещё не было. Кто-то сохранит работу, кто-то захочет уехать, кто-то потребует вернуть прежнюю собственность. Говорить, что уступка неизбежно выселит всех, было удобно для нашего ответа. Обещать, что никто ничего не потеряет, было удобно для чужого.\n\nЯ просил составлять к каждой территориальной претензии перечень практических вопросов: дороги, жильё, долги, снабжение. Посланники не всегда хотели их обсуждать. Наши сотрудники тоже не любили эту работу. Она заставляла увидеть, какие обещания не помещаются в короткое заявление о границе."
 ADISCORD_nam_memoir.14.d: "В разговорах с Ажаром часто удавалось назвать цену. Топливо, отсрочка, срок исполнения - о таких вещах можно было спрашивать прямо. Я просил записывать не только цену, но и срок, после которого потребуют следующую поставку. Посланники соглашались обсудить подробности позже. До отправки топлива хотелось получить более точный ответ.\n\nС Эфлором обсуждали и землю, и положение его людей, и прежние унижения. В наших служебных записках это часто сокращали до слова \"реваншизм\". Оно позволяло не перечислять неудобные подробности. Я просил сохранять их хотя бы в приложениях: иначе на следующей встрече нам пришлось бы снова делать вид, что мы слышим о них впервые.\n\nЯ не хотел менять столичный надзор на покровительство одного из соседей. Но сказать это было легче, чем определить, от какого соглашения следует отказаться. Заём мог помочь пережить трудный месяц. Гарантия могла отодвинуть нападение. За каждым предложением нужно было читать условия, особенно те, которые начинали действовать при нарушении срока.\n\nМезенцев спрашивал, что я считаю приемлемой уступкой. Я отвечал перечнем того, чего отдавать нельзя. Он возвращался к вопросу. Отрицательный ответ защищает от обвинений в уступчивости, пока не приходит время исполнять его. Тогда нужны части, запасы и согласие людей нести расходы. В этом месте мне обычно хотелось ещё одного раунда переговоров.\n\nКарты мы оставили вместе с документами, по которым их составляли. Пусть при следующем обсуждении можно будет проверить каждую линию, а не ссылаться на её давность. Я не ожидал, что от этого соседи откажутся от требований. Надеялся хотя бы не спорить целое утро о том, что мы сами неверно переписали."
 ADISCORD_nam_memoir.5.t: "Записки Егора Рома. Что должно государство"
 ADISCORD_nam_memoir.5.d: "Из записей о местном управлении, сделанных до распада Воркерланда.\n\nПри дворе я переписывал решения людей, которым не требовалось объяснять их мне. После революции обоснований стало больше. В них говорилось о народе, общем будущем и необходимости переходного времени. Работа писаря оставалась знакомой: правильно записать, вовремя передать, не перепутать адресата. Я не выбирал себе эту службу ради участия в преобразовании мира.\n\nНаместником я оказался полезен людям, которым требовался исполнитель. Умел договориться, не всегда спорил и понимал, какие вопросы лучше принести начальству уже с готовым ответом. Было бы неправдой писать, что с самого начала я думал только о самостоятельности Светлогорья. Сначала я хотел справиться с назначением и не дать повода усомниться во мне.\n\nПозднее выяснилось, сколько распоряжений нельзя совместить. Отправить больше нефти и сохранить запас, сократить расходы и не задерживать работу, удержать порядок и не беспокоить столицу жалобами. В таких случаях подчинённый выбирает, о каком неисполнении доложить позже. У меня получалось делать это достаточно долго. Жители от моей ловкости не всегда выигрывали.\n\nЯ хочу, чтобы Светлогорье могло решать свои дела без этой зависимости. Не вижу пользы и в том, чтобы отдать те же полномочия диктатурам юга за обещание защиты. Однако пока не знаю, какое устройство позволит обойтись без многих привычек, на которых держится моя собственная работа. Снять чужой надзор мало: после этого придётся договориться с людьми, которых прежде можно было направить к начальству.\n\nКогда меня спрашивают о будущем порядке, я начинаю с понятных вещей: кто принимает решение, кто платит и куда жаловаться. Иногда этим удаётся уточнить спор. Иногда я просто ухожу от вопроса, кто должен иметь право назначать меня самого. Различие неприятное, но записать его следует."
 ADISCORD_nam_memoir.15.d: "Наместники считают, что без действующей администрации округа начнут удерживать доходы и спорить о каждом распоряжении. Округа отвечают, что уже платят за аппарат, который не обязан их слушать. Я понимаю оба довода и пользуюсь этим, чтобы дольше не выбирать. На заседании такая позиция выглядит осторожной. За пределами заседания дело остаётся нерешённым.\n\nИз служебной вертикали можно убрать лишние согласования и потребовать ответа за результат. С округами можно установить права, которые нельзя отменять всякий раз, когда они мешают правительству. В обоих случаях мне придётся отказаться от удобства решать спор одним звонком. Если оставить это право только себе и назвать его исключением, желающие пользоваться им после меня обязательно найдутся.\n\nНа приём часто приходят люди, которых я знаю по работе. Они заранее объясняют обстоятельства, называют общих знакомых и просят только выслушать. Секретарь без напоминания оставляет для них время. Человек с улицы может ждать свободного приёма гораздо дольше. Когда я спросил, почему одного посетителя пропустили без очереди, мне ответили, что обычно я сам прошу его сразу приглашать.\n\nВ черновике следующего распоряжения я отметил вопросы, на которые нужен ответ: кто вправе оспорить решение, где получит копию основания, к кому обратится после отказа. Пока это пометки, а не действующий порядок. Нужно обсудить их с теми, кто будет работать по нему, и выяснить, какие возражения относятся к делу, а какие защищают привычную власть.\n\nНа последней странице я написал, что предложения следует передать комиссии. Перечислил несколько фамилий, затем вычеркнул двоих: один занят снабжением, другой связан с управой, на которую поступили жалобы. В строке о сроке оставил место. Секретарь спросил, можно ли готовить чистовой экземпляр. Я сказал, что сначала закончу список, и отложил его до утра."

 # Archive documents
 ADISCORD_nam_archive.1.t: "Архив: письма в центр"
 ADISCORD_nam_archive.1.d: "В архивной папке собраны исходящие письма за шесть лет: сорок два о жалованье, семнадцать о трубах, девять о пожарах на промыслах. Сначала составитель справки отметил, что ответы отсутствуют. Архивист принёс второй том: ответы столичных ведомств хранили отдельно. Большинство подтверждало получение, запрашивало расчёты или передавало вопрос другой службе.\n\nПри сверке обнаружились повторные обращения. Одно и то же повреждение описывали в первоначальном запросе, в уточнении расходов и в напоминании о сроках. По числу писем получалось три рассмотренных дела. По приложенному донесению насосная установка всё это время оставалась неисправной. Не все задержки возникли в столице: местная управа дважды вернула расчёт без указания, какую строку следует исправить.\n\nНа последнем запросе стоит подпись Рома. Он просил разрешить расход местного топливного резерва для ремонта ключевских насосов. Ниже сохранилась резолюция \"Ждать указаний\", а рядом более поздняя пометка: \"Проверить состояние установки\". Под ней нет результата проверки.\n\nСправка разделяет переписку и исполнение. К каждому вопросу приложены последняя известная сумма, ответственный отдел и сведения о том, что действительно сделано. Пустые места оставлены пустыми: в документах не нашлось основания считать эти работы законченными."
 ADISCORD_nam_archive.1.a: "Сверить исполнение."
 ADISCORD_nam_archive.2.t: "Архив: черновики декларации"
 ADISCORD_nam_archive.2.d: "В деле о декларации независимости сохранились одиннадцать редакций. Первые различаются главным образом названием нового управления. Позднее правки становятся содержательнее: кто собирает платежи, кому подчиняются гарнизоны и какие прежние обязательства Светлогорье принимает на себя.\n\nОдин составитель пытался сохранить действие всех указаний метрополии. На полях ему задали вопрос о распоряжениях, которые новое правительство не намерено исполнять. В следующем варианте общую формулу заменили перечнем обязательств. Перечень занял больше места и вызвал больше возражений: каждую строку теперь можно было обсуждать отдельно.\n\nВера Сабурова оставила замечание к порядку утверждения расходов. Формулировка позволяла пригласить округа на обсуждение и затем решить всё без них. Представители администрации, в свою очередь, просили уточнить, кто отвечает за снабжение, если согласования затянутся. Окончательный текст сохранил следы этого спора; к нему приложены разногласия, которые декларацией ещё не разрешили.\n\nВ папке лежат копии, отправленные соседям, и отметки о доставке. Ажар подтвердил получение на следующий день, Эфлор - через неделю. Архивная опись отдельно оговаривает: подтверждение получения не означает признания независимости. Эти письма нельзя подменить ссылкой на факт отправки декларации."
 ADISCORD_nam_archive.2.a: "Подшить к делу номер один."
 ADISCORD_nam_archive.3.t: "Архив: тихие скважины"
 ADISCORD_nam_archive.3.d: "В сводке промысловой инспекции отмечено уменьшение происшествий на проверенных участках. К ней приложены журналы смен и отдельная записка начальника охраны Ключевска. Он сообщает, что мастера стали чаще предупреждать о посторонних, а часть обращений рабочих удалось разобрать на месте.\n\nСоставитель сводки предложил назвать обстановку спокойной. Проверяющий попросил оставить перечень участков: сведения не охватывают весь бассейн. Отсутствие поджогов там, где работала инспекция, не говорит о запасах оружия в другом округе. В листе о листовках также есть оговорка: найденные экземпляры могли лежать давно, дату распространения установить не удалось.\n\nПричины перемен в документах перечислены раздельно. Где-то сработали переговоры, где-то усиление охраны, где-то исполненное требование по снабжению. Приписывать весь результат одной мере инспекция не берётся. Она просит не прекращать работу с обращениями только потому, что очередная сводка выглядит лучше предыдущей.\n\nНа копии сохранилась короткая пометка Рома: \"Что продолжаем делать и кто отвечает?\" В приложении перечислены следующие проверки. Документ не объявляет подполье исчезнувшим и не закрывает остальные донесения по городу."
 ADISCORD_nam_archive.3.a: "Продолжить проверку."
 ADISCORD_nam_archive.4.t: "Архив: протокол совета опор"
 ADISCORD_nam_archive.4.d: "Первый протокол третейского совета опор занимает сорок страниц. Значительную часть отвели порядку рассмотрения споров. Администрация опасалась, что любой приказ можно будет задержать жалобой; представители округов - что срочным объявят каждый приказ, на который они возражают. Гарнизоны требовали оговорить вопросы снабжения отдельно.\n\nВ протокол включены поступившие замечания от промысловых, гарнизонных и портовых управлений. В одном приложении расход топлива считался уже согласованным, в другом та же поставка числилась спорной. При совместном чтении выяснилось, что стороны ссылаются на разные версии расчёта. На этом обсуждение впервые перешло от полномочий вообще к сумме, за которую каждый готов отвечать.\n\nСовет установил, что жалобы рассматривают в канцелярии и дают на них ответ в течение тридцати дней. Разбор спора не разрешает добиваться решения силой. В приложении уточнено, кто принимает обращение, кому передаёт расчёты и как отмечает отсутствие ответа. Согласие с порядком не означает согласия со всеми будущими решениями совета.\n\nОригинал оставлен на хранение, копии направлены в управления. В сопроводительном листе рукой Рома добавлено требование сохранить приложения вместе с протоколом. Без них общее решение о сотрудничестве выглядело гораздо убедительнее, зато понять, о чём стороны договорились на деле, было бы невозможно."
 ADISCORD_nam_archive.4.a: "Разослать копии."
 ADISCORD_nam_archive.5.t: "Архив: план генерального штаба"
 ADISCORD_nam_archive.5.d: "План обороны бассейна состоит из трёх частей: переброска частей, размещение запасов и действия при потере отдельных дорог. На карте отмечены промыслы, мосты и места разгрузки. Возле некоторых дорог два срока движения - расчётный и полученный после проверки транспорта. Они заметно различаются.\n\nШтаб требует не считать части готовыми только по спискам. Формирование, которому ещё нужно выдать оружие и собрать машины, нельзя назначать резервом на тот же день. Мобилизационные заказы рассматриваются отдельно от уже имеющихся подразделений; в приложении перечислено, что потребуется для их доставки к началу боёв.\n\nВ пометках к плану обсуждается неприятный для промысловых управлений вопрос: какие поставки придётся перенести, если транспорт понадобится армии. Управления просят точных сроков. Штаб отвечает, что сможет уточнить их после размещения заказов и проверки запасов. Ром отметил это место и потребовал оставить ответ в окончательной редакции.\n\nУтверждение плана расширяет возможности подготовки, но не заменяет её оплаты и исполнения. Распоряжения о мобилизации ещё нужно отдать, ресурсы выделить, готовые части направить по проверенным маршрутам. В приложениях достаточно места для уточнений; их предстоит вносить по мере поступления донесений."
 ADISCORD_nam_archive.5.a: "Утвердить план."
 ADISCORD_nam_archive.6.t: "Архив: акт о границе"
 ADISCORD_nam_archive.6.d: "В дело о послевоенной границе подшит акт демаркации и рабочие материалы комиссий. Общую линию установил мирный договор; на месте пришлось уточнять подъезды к постам, доступ к колодцам и положение участков дороги, которые не удавалось точно различить на штабных картах.\n\nВозражения комиссий сохранены рядом с итоговой схемой. В одном случае спор шёл о названии урочища, в другом - о том, с какой стороны следует обслуживать водопропускную трубу. Для столичных ведомств это выглядело мелочами. Для местных жителей от ответа зависело, к кому обращаться после первого размытого участка дороги.\n\nК акту приложены списки вернувшихся военнопленных и отчёты о восстановлении промыслов. Отдельно лежит просьба эфлорского инженера разрешить поездку к могиле брата на светлогорской стороне. На ней есть согласование и запись о передаче в пограничную службу. Выданное разрешение не отменяет проверки на посту, но у дежурного теперь есть основание пропустить посетителя.\n\nАрхивист связал дело с довоенными картами, чтобы прежние названия можно было найти без нового запроса. Документы о спорных участках оставлены открытыми для дополнений. Признанная граница не избавила управления от совместной работы; она дала им основание обсуждать конкретные вопросы."
 ADISCORD_nam_archive.6.d_standoff: "В дело о прекращении боёв подшиты схемы постов и перечень действующих пограничных распоряжений. Армии остановились на прежней границе. Договора о признании независимости Светлогорья нет; составитель описи специально отметил это на обложке, чтобы технические записи не стали выдавать за дипломатическое соглашение.\n\nНа местах всё равно приходится решать вопросы дорог, колодцев и пропуска людей. В одном донесении упоминается повреждённая труба под дорогой, в другом - семьи, которые хотят получить сведения о родственниках по ту сторону. Переписка по этим вопросам не устанавливает общего порядка отношений с соседями.\n\nВоенные требуют не считать каждый разрешённый проход основанием для следующего. Гражданские управления просят сообщать об отказах, иначе посетители неделями ходят между канцелярией и постом. В деле сохраняют условия каждого ответа и имя того, кто его подтвердил. Общее слово \"урегулировано\" заменено перечнем вопросов, по которым есть решение.\n\nК материалам приложены отчёты о восстановлении местных дорог и промыслов. Работа после войны продолжается, хотя вопрос независимости остаётся открытым для Эфлора и Ажара. Следующей комиссии предстоит пользоваться этими записями, не приписывая им силы отсутствующего договора."
 ADISCORD_nam_archive.6.a: "Внести в реестр."

  # Focus trees: main, post-war chapter, defeat chapter
 NAM_metropolitan_quota:0 "Разнарядка метрополии"
 NAM_metropolitan_quota_desc:0 "Из Воркерланда пришла новая разнарядка на нефть, и в ней снова не сказано, чем за неё заплатят. Сначала соберём то, что лежит на промысловых складах, а потом решим, кому это достанется."
 NAM_deliver_the_quota:0 "Исполнить разнарядку"
 NAM_deliver_the_quota_desc:0 "Наместники привычно ставят печати под столичной разнарядкой. У наливной эстакады диспетчер пересчитывает вагоны и ищет в списке последнюю цистерну. Письмо из метрополии лежит у него под стеклом."
 NAM_metropolitan_depots:0 "Склады метрополии"
 NAM_metropolitan_depots_desc:0 "Имперские склады в Светлогорье числятся за столицей, но охраняют их наши гарнизоны. Пока связь с Воркерландом ещё держится, оформим передачу винтовок, снаряжения и орудий местным частям законным порядком."
 NAM_concealed_reserve:0 "Резерв вне ведомости"
 NAM_concealed_reserve_desc:0 "В промысловой конторе переписывают отчёт о неисправных счётчиках. Мастер диктует показания медленно, следя за дверью. Когда приходит столичный ревизор, черновик уже убран со стола."
 NAM_letters_to_the_centre:0 "Штиль перед штормом"
 NAM_letters_to_the_centre_desc:0 "Ром по-прежнему отправляет в столицу донесения, но ответы приходят всё реже. За сухими приказами о новых поставках уже не слышно власти, способной защитить нас. Метрополия распадается, и тем, кто ещё вчера говорил от имени всей империи, всё труднее удержать даже собственную столицу.\n\nВ Светлогорье ещё поднимают имперский флаг, ещё ждут курьеров и сверяют бумаги со столичными печатями. Только за этим порядком всё яснее проступает наше одиночество. Пока длится штиль, соберём донесения и сохраним то, на что сможем опереться, когда шторм наконец доберётся до нас."
 NAM_centre_hourglass:0 "Часы центра"
 NAM_centre_hourglass_desc:0 "Из столицы прибыл чрезвычайный комиссар с планом поставок, в котором нет ни одного срока позже ближайшего месяца. Метрополия больше не планирует годами: она пытается пережить следующий день и требует, чтобы колония платила за это нефтью."
 NAM_commissioner_plan:0 "Печать под планом комиссара"
 NAM_commissioner_plan_desc:0 "Наместники поставят печати под чрезвычайным планом. Топливо пойдёт в метрополию эшелонами, а обратно придут винтовки с её складов. Промыслы будут работать на чужую войну, и подполье запомнит, кто подписывал реквизиции."
 NAM_second_ledger:0 "Вторая бухгалтерия"
 NAM_second_ledger_desc:0 "За закрытой дверью нефтяной конторы счетовод переписывает отдельную книгу. Он останавливается при каждом звуке в коридоре. На столе рядом лежит готовый отчёт для комиссара, перевязанный чистой лентой."
 NAM_metropolitan_instructors:0 "Инструкторы метрополии"
 NAM_metropolitan_instructors_desc:0 "Вместе с эшелонами из столицы прибыли офицеры-инструкторы. Они учат гарнизоны воевать по уставу метрополии и заодно вычищают из казарм людей Вебера."
 NAM_quiet_officer_lists:0 "Тихие списки офицеров"
 NAM_quiet_officer_lists_desc:0 "В штабе гарнизона составляют списки офицеров, которые останутся со Светлогорьем, что бы ни случилось в столице. Официально это ведомость отпусков. На деле это штаб армии, которой пока не существует."
 NAM_sand_runs_out:0 "Песок на исходе"
 NAM_sand_runs_out_desc:0 "Телеграф из столицы приходит с опозданием, а приказы противоречат друг другу. Наместники и округа уже спорят, кто будет ставить печать, когда центр замолчит окончательно. Наш ответ комиссару определит, с чего начнётся этот спор."
 NAM_last_centre_register:0 "Последний реестр центра"
 NAM_last_centre_register_desc:0 "Комиссар укладывает последний реестр в дорожный сундук. Писарь проверяет шнур и сургуч на переплёте. В канцелярии тихо: все смотрят на книгу, которую скоро увезут за море."
 NAM_independence_day:0 "Своя печать"
 NAM_independence_day_desc:0 "Воркерланд распался, и последний приказ из столицы так и остался без подписи. Светлогорье объявляет независимость: на печатях канцелярии больше нет чужого герба."
 NAM_neutral_basin:0 "Бассейн вне войны"
 NAM_neutral_basin_desc:0 "Эфлор и Ажар требуют вернуть земли, отнятые империей. Объявим бассейн нейтральным: Светлогорье никому не угрожает и готово торговать, если спор о границах решается за столом, а не на промыслах."
 NAM_basin_is_ours:0 "Бассейн принадлежит нам"
 NAM_basin_is_ours_desc:0 "Каждую вышку бассейна поставили здешние рабочие, а не эфлорские землемеры. Скажем это открыто и выведем гарнизоны к границе: соседи услышат вызов, но поймут, что даром промыслы не отдадут."
 NAM_provisional_statute:0 "Временный статут"
 NAM_provisional_statute_desc:0 "Независимость нельзя держать на старом положении о наместничестве. Временный статут определит, кто издаёт законы, кто их исполняет и кому на них жаловаться, пока страна не выберет постоянное устройство."
 NAM_rom_address:0 "Обращение Рома"
 NAM_rom_address_desc:0 "Егор Ром впервые выступает не как наместник, а как глава государства. Он не обещает лёгкой зимы; он обещает, что за каждым приказом теперь стоит человек, которого можно назвать по имени."
 NAM_tax_rolls:0 "Кадастр и техническая служба"
 NAM_tax_rolls_desc:0 "Участки, мастерские и дороги должны появиться на общих планах. Землемеры, инженеры и счетоводы составят службу, способную доводить государственные замыслы до стройплощадки."
 NAM_namestnik_circuits:0 "Объезды наместников"
 NAM_namestnik_circuits_desc:0 "Наместники получают постоянные участки объезда и право решать споры на месте. Вертикаль становится ближе к людям, а её печать - тяжелее."
 NAM_district_assemblies:0 "Собрания округов"
 NAM_district_assemblies_desc:0 "Каждый округ созывает выборное собрание, которое утверждает местный сбор и проверяет наместника. Решения рождаются медленнее, но их уже не назовёшь чужими."
 NAM_seal_courts:0 "Суды печатей"
 NAM_seal_courts_desc:0 "Спор о подписи больше не выигрывает тот, у кого печать старше. Особые суды разберут жалобы на наместников и на округа по одному закону для обеих сторон."
 NAM_garrison_assembly:0 "Военная приёмка"
 NAM_garrison_assembly_desc:0 "Гарнизонные офицеры спорят над образцами оружия. Приёмщик показывает следы износа, которые не видны на чертежах. К концу заседания белая скатерть покрыта маслом и металлической пылью."
 NAM_hear_klyuchevsk:0 "Выслушать Ключевск"
 NAM_hear_klyuchevsk_desc:0 "Арсений Тарханов, наместник Ключевска, говорит от имени промыслов: добыча должна оставаться в руках тех, кто её ведёт. Примем его условия - нефтяники откроют резервы, а портовые конторы останутся недовольны."
 NAM_hear_the_harbour:0 "Выслушать гавань"
 NAM_hear_the_harbour_desc:0 "Лев Корнилов держит причалы Южной гавани и рейсы на острова. Он просит суда и право фрахта; промыслы опасаются, что их нефть снова станет чужим товаром."
 NAM_hear_the_commandant:0 "Вооружить гарнизоны"
 NAM_hear_the_commandant_desc:0 "Комендант требует прежде всего вооружить людей, которые будут держать промыслы. Учебные команды примут новые партии и проведут занятия с гарнизонами, пока соседи ещё не пересекли границу."
 NAM_hear_the_registrar:0 "Гражданская техническая служба"
 NAM_hear_the_registrar_desc:0 "Регистратор предлагает собрать инженеров, преподавателей и чертёжников в самостоятельную гражданскую службу. Её работа обеспечит стране собственные технические решения, хотя штаб требует направить средства в арсеналы уже сейчас."
 NAM_pillar_arbitration:0 "Программа развития страны"
 NAM_pillar_arbitration_desc:0 "Представители отраслей принесли в совет несовместимые сметы. Председатель просит каждого объяснить свою заявку без помощи секретаря. За дверью ждут мастера, которым ещё ни разу не дали выступить."
 NAM_underground_reports:0 "Сводки о подполье"
 NAM_underground_reports_desc:0 "В северном поясе снова находят листовки за подписью Ярослава Вебера. Сведём донесения полиции, промыслов и округов в одну сводку, чтобы понять, кто ему помогает и почему."
 NAM_weber_channel:0 "Канал к Веберу"
 NAM_weber_channel_desc:0 "Окружной посредник просит принять его без секретаря. Из внутреннего кармана он достаёт сложенный вчетверо лист. Ром узнаёт подпись Вебера прежде, чем начинает читать."
 NAM_cache_hunters:0 "Охотники за тайниками"
 NAM_cache_hunters_desc:0 "Канцелярия сведёт донесения осведомителей с картами тайных складов. Жандармам нужны проводники, накладные и имена тех, кто открывает ворота подполью."
 NAM_mine_councils:0 "Амнистия и советы промыслов"
 NAM_mine_councils_desc:0 "Округа составляют списки тех, кто готов выйти из подполья. Рабочие советы получают право решать вопросы смен, безопасности и найма прямо на промыслах. Мир с людьми Вебера должен держаться на соглашении, которое обе стороны готовы соблюдать."
 NAM_field_gendarmes:0 "Жандармерия промыслов"
 NAM_field_gendarmes_desc:0 "У повреждённой вышки жандармы разговаривают с аварийным мастером. Он показывает на ограждённую площадку, куда пока никого не пускают. Начальник стражи требует журнал последнего дежурства."
 NAM_contract_bureau:0 "Контрактное бюро"
 NAM_contract_bureau_desc:0 "Светлогорье владеет большей частью нефти мира, но всё ещё продаёт её как колония - через чужих посредников. Бюро будет заключать топливные контракты от имени государства и следить, чтобы каждая единица добычи была обещана с выгодой."
 NAM_overseas_buyers:0 "Заморские покупатели"
 NAM_overseas_buyers_desc:0 "В Южной гавани торговые поверенные принимают капитанов из далёких портов. На столе лежат письма на разных языках. Переводчик просит собеседников говорить по одному."
 NAM_field_repair_crews:0 "Ремонтные бригады промыслов"
 NAM_field_repair_crews_desc:0 "У остановленной скважины ремонтники раскладывают разобранный насос. Буровой мастер показывает старую запись о таком же отказе. Диспетчер просит не расходиться, пока не приедет инженер."
 NAM_refinery_programme:0 "Программа переработки"
 NAM_refinery_programme_desc:0 "Завод рядом с промыслом превращает сырую нефть в топливо для собственной армии. Программа определит, где строить, и закрепит за каждым заводом бригаду нефтяников."
 NAM_klyuchevsk_pipeline:0 "Трасса Ключевского нефтепровода"
 NAM_klyuchevsk_pipeline_desc:0 "Нефть Сухоречья идёт в Южную гавань в цистернах, которые проще перехватить, чем охранять. Проложим по карте трассу нефтепровода и выкупим трубы со старых имперских складов."
 NAM_deep_wells:0 "Глубокие скважины"
 NAM_deep_wells_desc:0 "Геологи раскладывают керны по порядку глубины. Последний образец отличается от всех предыдущих. Старый буровой мастер подносит его к свету и зовёт напарника, с которым начинал на этом промысле."
 NAM_fuel_depots:0 "Хранилища гавани"
 NAM_fuel_depots_desc:0 "У Южной гавани инженеры обследуют площадку между железной дорогой и старым наливным двором. Диспетчер вспоминает, где стояла вода прошлой весной. На плане появляется ещё одна поправка."
 NAM_second_drilling_crew:0 "Вторая буровая партия"
 NAM_second_drilling_crew_desc:0 "На промыслы приезжают новые буровики со своими инструментами и привычками. Старшие мастера знакомят их с капризными скважинами, а в ремонтных журналах появляются имена тех, кому предстоит отвечать за эти машины."
 NAM_basin_roads:0 "Дороги бассейна"
 NAM_basin_roads_desc:0 "Между Северными месторождениями и Сухоречьем грузовик снова увяз в колее. Водитель зовёт дорожного мастера посмотреть на размытый склон. Штабной топограф делает пометки, стоя по щиколотку в грязи."
 NAM_mobilisation_office:0 "Мобилизационное управление"
 NAM_mobilisation_office_desc:0 "Соседи считают дни до войны, и встречать её одними гарнизонами нельзя. За столами управления сверяют списки резервистов, разбирают донесения округов и ищут командиров, которым можно доверить вчерашних рабочих."
 NAM_line_survey:0 "Съёмка рубежей"
 NAM_line_survey_desc:0 "Топографы и сапёры пройдут вдоль границ каждого промыслового округа и отметят, где окопы задержат противника дольше всего. По их картам рубежи можно будет готовить заранее."
 NAM_line_engineers:0 "Инженеры рубежей"
 NAM_line_engineers_desc:0 "Офицеры охраны промыслов знают, где весной размывает дорогу и какой мост не выдержит тяжёлую машину. Их полевые записи лягут рядом с картами инженеров: оборонительный рубеж начинается с понимания местности."
 NAM_reserve_rolls:0 "Списки резерва"
 NAM_reserve_rolls_desc:0 "Окружной писарь сверяет старые гарнизонные списки с домовыми книгами. У некоторых фамилий давно сменились адреса. За уточнениями приходится идти к соседям и бывшим сослуживцам."
 NAM_officer_courses:0 "Офицерские курсы"
 NAM_officer_courses_desc:0 "Гарнизонный командир впервые садится за учебную штабную карту. Инструктор просит объяснить вчерашний приказ без привычных ссылок на устав. Остальные слушатели узнают в вопросах собственные ошибки."
 NAM_coastal_battalions:0 "Береговая оборона"
 NAM_coastal_battalions_desc:0 "Южная гавань связывает материк с островами. Батарейные расчёты, наблюдатели и портовая охрана должны работать как одна служба."
 NAM_island_levy_office:0 "Островная сборная контора"
 NAM_island_levy_office_desc:0 "На Большом острове приезжего сборщика встречают у рудничной конторы. Старшина положил рядом с казённым бланком книгу местных расходов. Прежде чем обсуждать подписи, он предлагает пройти к шахте."
 NAM_island_concession:0 "Островная концессия"
 NAM_island_concession_desc:0 "На Средний остров прибыли иностранные инженеры с торговым поверенным. Местная управа выделила им проводника. У старого рудника жители ждут объяснений, зачем приезжим понадобились земельные планы."
 NAM_restitution_desk:0 "Стол реституции"
 NAM_restitution_desk_desc:0 "Эфлор и Ажар присылают претензии одну за другой, и каждая требует ответа. Отдельный стол канцелярии будет отвечать встречными ведомостями и договорами воркерландской эпохи, выигрывая время."
 NAM_court_azhar:0 "Склонить Ажар"
 NAM_court_azhar_desc:0 "Посредники собирают за одним столом чиновников Ажара и наших нефтяников. Ажарским заводам нужны поставки, а нам - договор, который отдалит соседей от войны за Сухоречье."
 NAM_fuel_leverage:0 "Топливный рычаг"
 NAM_fuel_leverage_desc:0 "На стол Рома положили претензию соседей и их же заявку на нефтяную поставку. Он придвигает листы друг к другу. Посредник замечает одинаковую подпись раньше, чем глава канцелярии успевает задать вопрос."
 NAM_general_staff_plan:0 "План генерального штаба"
 NAM_general_staff_plan_desc:0 "Штаб сводит переговоры, давление соседей и состояние гарнизонов в один план войны. Он рассчитан на худший исход и требует заранее подготовленного пополнения."
 NAM_discipline_of_seals:0 "Никто не оставляет печать"
 NAM_discipline_of_seals_desc:0 "На войне каждая ступень лестницы держит свой участок, пока верит, что соседняя не дрогнет. Особый приказ напомнит наместникам и комендантам: за брошенную печать отвечают так же, как за брошенный окоп."
 NAM_volunteer_levies:0 "Добровольческие наборы"
 NAM_volunteer_levies_desc:0 "У станции добровольцы ждут писаря со списками. Один пришёл прямо с промысловой смены, другой привёл сына. Отставной унтер-офицер пытается построить очередь, пока из окна не назвали первую фамилию."
 NAM_wells_under_guard:0 "Скважины под охраной"
 NAM_wells_under_guard_desc:0 "Буровой мастер провожает сапёров вдоль ограды. У последней насосной он останавливается и рассказывает о людях своей смены. Офицер долго смотрит на промысловые дома за дорогой."
 NAM_last_reserve:0 "Последний резерв"
 NAM_last_reserve_desc:0 "Штаб вскрывает склады, которые берёг на крайний случай. Крайний случай настал."
 NAM_district_volunteers:0 "Добровольцы округов"
 NAM_district_volunteers_desc:0 "Округа сами собирают отряды для защиты своих промыслов. Многие из тех, кто вчера читал листовки Вебера, сегодня записываются в строй."
 NAM_martial_seals:0 "Военные печати"
 NAM_martial_seals_desc:0 "Наместники получают право военного суда в своих округах. Печать снова решает всё, и тот, кто её ослушается, ответит перед трибуналом."
 NAM_oil_score:0 "Нефтяной счёт"
 NAM_oil_score_desc:0 "На штабную карту наносят названия удержанных скважин. Нефтяник поправляет офицера: у этой вышки другое имя, её так называют ещё со времён первой проходки. Рядом радист принимает донесение с того же участка."
 NAM_veterans_return:0 "Вооружённые силы"
 NAM_veterans_return_desc:0 "Солдаты ресурсной войны возвращаются в округа с опытом, которого не было у имперских гарнизонов. Лучших кадровые списки удержат в армии, остальные вернутся на промыслы."
 NAM_svetlogorsk_shipyards:0 "Верфи Светлогорска"
 NAM_svetlogorsk_shipyards_desc:0 "Судовые мастера Светлогорска привыкли узнавать чужие флаги по изношенным корпусам. Теперь на столе главного конструктора лежит чертёж с печатью своей страны, а капитаны спорят, какое имя дать первому судну."
 NAM_normalisation:0 "Нормализация"
 NAM_normalisation_desc:0 "На пограничную встречу делегации привезли карты и списки пленных. За столом сидят люди, которые ещё недавно читали донесения о боях друг против друга. Переводчики внимательно повторяют каждую фразу.\n\nУ заставы ждут семьи с узлами и фотографиями. Секретарь комиссии выходит к ним с вопросами об именах и местах службы. Вечером на его столе рядом с протоколами лежат письма, которые он обещал передать через границу."
 NAM_border_revenge:0 "Вооружённый рубеж"
 NAM_border_revenge_desc:0 "Пограничные гарнизоны не собираются повторять отступление к нефтяным промыслам. Пока комиссия передаёт военные протоколы в архив, сапёры обследуют дороги и подступы к городам. Соседи должны видеть перед собой страну, способную защитить собственную границу."
 NAM_oil_ministry:0 "Министерство нефти"
 NAM_oil_ministry_desc:0 "Промыслы больше не делят между собой ведомства военного времени. Министерство нефти объединит добычу, переработку и контракты."
 NAM_middle_loren_wells:0 "Скважины Среднего Лорена"
 NAM_middle_loren_wells_desc:0 "Средний Лорен лежит на краю бассейна, и его промыслы до сих пор работали без дорог и мастерских. Буровой мастер бережёт последний исправный подшипник, пока посыльный пробирается по весенней грязи к ближайшей станции. В столице о таких задержках узнают только из запоздалых писем."
 NAM_reclaim_230:0 "Сталь Западного острова"
 NAM_reclaim_230_desc:0 "Кефрейт добывает сталь Западного островного округа по договору военного времени. Война выиграна, и канцелярия требует новых условий: платы или возвращения прав на добычу."
 NAM_val_concession_active_tt:0 "Кефрейт пользуется правами на добычу в Западном островном округе"
 NAM_export_consortium:0 "Экспортный консорциум"
 NAM_export_consortium_desc:0 "Начальники портовых контор спорят о расписании танкеров. У каждого своя карта рейсов, но одни и те же названия причалов. Председатель просит свести карты вместе, прежде чем возвращаться к договорам."
 NAM_state_refineries:0 "Государственные заводы"
 NAM_state_refineries_desc:0 "Нефть, которую можно переработать дома, незачем продавать по чужой цене. Инженеры Северных месторождений и Сухоречья разворачивают на министерском столе чертежи перегонных установок. Торговые представители молча пересчитывают привезённые договоры."
 NAM_oil_exchange:0 "Нефтяная биржа"
 NAM_oil_exchange_desc:0 "В биржевом зале впервые вывесили котировки под светлогорской печатью. Маклеры ещё путаются в порядке торгов. У входа нефтяные старшины слушают, как произносят названия их промыслов."
 NAM_south_allied_fuel_office:0 "Топливное управление союзников"
 NAM_south_allied_fuel_office_desc:0 "Союзники северного лагеря воюют на светлогорском топливе или не воюют вовсе. Управление распределит поставки так, чтобы каждая цистерна дошла до фронта."
 NAM_south_convoy_hunters:0 "Охотники за конвоями"
 NAM_south_convoy_hunters_desc:0 "Рыбаки рассказывают морскому штабу о баржах на южных маршрутах. Штурман сверяет рассказы с наблюдениями маячных смотрителей. На рассвете вахтенные снова поднимаются к сигнальному посту."
 NAM_rus_crisis_watch:0 "Внешняя политика после южной войны"
 NAM_rus_crisis_watch_desc:0 "Хан строит империю и орбитальную программу, а против него уже собирается коалиция. Канцелярия должна решить, чем ответит Светлогорье: нефтью для обороняющихся или счётом за неё."
 NAM_rus_crisis_active_tt:0 "Земля Хана независима и продолжает орбитальную программу"
 NAM_rus_fuel_for_coalition:0 "Топливо для коалиции"
 NAM_rus_fuel_for_coalition_desc:0 "Светлогорье отправляет топливо тем, кто встал против Хана. Наша нефть станет вкладом в общую оборону, а не товаром на чужой войне."
 NAM_rus_demand_share:0 "Требовать доли"
 NAM_rus_demand_share_desc:0 "Обороняющимся нужна наша нефть, и Светлогорье назначит за неё цену. Кто хочет топлива для войны с Ханом, будет платить и считаться с нашими интересами."
 NAM_rus_expedition_staff:0 "Экспедиционный штаб"
 NAM_rus_expedition_staff_desc:0 "Каким бы ни был ответ Хану, армии Светлогорья нужен штаб, способный действовать далеко от бассейна. Офицеры изучат опыт северного фронта и подготовят склады для экспедиции."
 NAM_rus_watch_tt:0 "Пропускная способность нефтяного экспорта §G+1§!."
 NAM_rus_send_relief:0 "Отправить топливо для обороны"
 NAM_rus_send_relief_desc:0 "В штабе обороны ждут известий из Светлогорья. Начальнику автопарка нужен номер эшелона, чтобы успеть подать цистерны к разгрузочному пути."
 NAM_rus_send_relief_tt:0 "Получатель - [FROM.GetName]. Светлогорье безвозмездно передаст §G30000§! £fuel_texticon из своих запасов. Отношения улучшатся. Следующий рейс с топливом в эту страну возможен через §Y45§! £time_texticon."
 NAM_rus_send_relief_unlock_tt:0 "После применения решения: безвозмездно передаёт наше топливо выбранному участнику обороны."
 NAM_rus_offer_barter:0 "Предложить топливо в обмен на грузовики"
 NAM_rus_offer_barter_desc:0 "На промыслах хватает цистерн, но от станций развозить горючее уже почти нечем. Экспортная контора предлагает договориться с интендантами по ту сторону границы."
 NAM_rus_offer_barter_tt:0 "Покупатель - [FROM.GetName].\nПри согласии Светлогорье отправит §Y30000§! £fuel_texticon и получит §G100§! £motorized_texticon со складов покупателя.\nОтношения улучшатся.\nСледующий рейс топлива в эту страну возможен через §Y45§! £time_texticon.\nОтказ навсегда закроет обмен с этим покупателем.\nЕсли условия сделки изменятся до ответа, запасы останутся на местах и предложение можно будет направить снова."
 NAM_rus_offer_barter_unlock_tt:0 "После применения решения: предлагает участнику обороны обмен нашего топлива на его грузовики; требуется согласие покупателя."
 NAM_rus_send_column:0 "Снарядить колонну для обороняющихся"
 NAM_rus_send_column_desc:0 "У ворот арсенала выстроились грузовики. Штаб экспедиции ждёт, какой участок фронта вписать в путевые листы, а кладовщики тем временем крепят винтовочные ящики к бортам."
 NAM_rus_send_column_tt:0 "Со складов Светлогорья поступят §G100§! £motorized_texticon и §G1000§! £infantry_equipment_texticon.\nПолучатель - [FROM.GetName].\nСледующую колонну в эту страну можно отправить через §Y45§! £time_texticon независимо от рейсов с топливом."
 NAM_rus_send_column_unlock_tt:0 "После применения решения: передаёт выбранному участнику обороны наши грузовики и винтовки."
 NAM_rus_room_tt:0 "У получателя есть место ещё для §Y30000§! £fuel_texticon."
 NAM_rus_trucks_tt:0 "У покупателя на складах не менее §Y100§! £motorized_texticon."
 NAM_rus_column_stock_tt:0 "У Светлогорья на складах не менее §Y100§! £motorized_texticon и §Y1000§! £infantry_equipment_texticon."
 NAM_rus_sender_fuel_tt:0 "В хранилищах Светлогорья не менее §Y30000§! £fuel_texticon."
 NAM_rus_defender_tt:0 "Получатель участвует в обороне коалиции и продолжает войну с Землёй Хана."
 NAM_defeat_count_losses:0 "Подсчёт потерь"
 NAM_defeat_count_losses_desc:0 "В канцелярии раскладывают донесения с потерянного берега. Названия промыслов ещё стоят на старой карте, но посланные туда письма возвращаются нераспечатанными. Ром требует сверить каждую подпись."
 NAM_defeat_rump_cabinet:0 "Кабинет оставшихся"
 NAM_defeat_rump_cabinet_desc:0 "Половина министров потеряла свои округа вместе с должностями. Ром собирает кабинет из тех, кто остался, и обещает каждой опоре место за столом."
 NAM_defeat_harbour_economy:0 "Хозяйство гавани"
 NAM_defeat_harbour_economy_desc:0 "Без северных промыслов главным богатством страны становятся гавани. У причалов спорят о фрахте, в доках считают повреждённые корпуса, а торговые поверенные ищут грузы для обратного рейса. Стране предстоит научиться жить не одной нефтью."
 NAM_defeat_island_refuge:0 "Острова-убежище"
 NAM_defeat_island_refuge_desc:0 "Заморские округа остались за Светлогорьем, и туда уже перебираются семьи и склады с потерянного берега. Островам нужны причалы и дороги, чтобы их принять."
 NAM_defeat_purge_of_seals:0 "Чистка печатей"
 NAM_defeat_purge_of_seals_desc:0 "На разбирательство вызвали наместников, отступивших с промыслов. Перед каждым лежит его последний рапорт. Окружные делегаты привезли свои списки погибших и требуют выслушать свидетелей."
 NAM_defeat_refugee_quarters:0 "Кварталы беженцев"
 NAM_defeat_refugee_quarters_desc:0 "Беженцы с потерянных промыслов заполняют порты, которые ещё остались у Светлогорья. Семьи ночуют среди ящиков, а бывшие мастера спрашивают у портовой стражи дорогу к ближайшей проходной. Городским управам предстоит найти им место в незнакомом городе."
 NAM_defeat_island_foundries:0 "Островные литейные"
 NAM_defeat_island_foundries_desc:0 "Литейщики Большого острова спорят над образцами местной стали. В старой печи снова разводят огонь, а ученики освобождают проход между заваленными формами."
 NAM_defeat_revenge:0 "Курс на возвращение"
 NAM_defeat_revenge_desc:0 "Мир подписан, но не принят. Светлогорье будет готовиться вернуть промыслы, и каждая статья бюджета отныне служит этой цели."
 NAM_defeat_accommodation:0 "Курс на примирение"
 NAM_defeat_accommodation_desc:0 "Война проиграна, но торговать можно и с победителями. Светлогорье признаёт новые границы и ищет у бывших врагов выгоду, а не реванш."
 NAM_defeat_rebuild_arsenal:0 "Восстановить арсенал"
 NAM_defeat_rebuild_arsenal_desc:0 "Оружейники перебирают уцелевшие станки и разыскивают товарищей, которых война разбросала по портам. На верстаке лежит винтовка с клеймом потерянного арсенала. Мастер снимает с неё размеры для новых чертежей."
 NAM_defeat_hidden_reserve:0 "Скрытый резерв"
 NAM_defeat_hidden_reserve_desc:0 "Кладовщик долго ищет среди старых бумаг записку островного капитана. На обороте сохранилось название судна и адрес портовой лавки. Этих людей он помнит ещё по временам, когда прятал цистерны от метрополии."
 NAM_return_charter_freighters:0 "Выкупить грузовые суда за топливо"
 NAM_return_supply_open_tt:0 "Независимое Светлогорье готовит реванш после компромиссного мира или ведёт войну за возвращение."
 NAM_return_charter_freighters_desc:0 "Капитан ведёт казначейского поверенного по палубе грузового судна. У машинного люка их встречает механик с журналом ремонта. Владельцы ждут в конторе, не снимая дорожных пальто."
 NAM_return_charter_freighters_unlock_tt:0 "После применения решения: обменивает топливо на конвои; скрытый резерв улучшает условия заказа."
 NAM_return_freighter_cost:0 "§Y30000§! £fuel_texticon"
 NAM_return_freighter_cost_blocked:0 "§R30000§! £fuel_texticon"
 NAM_return_freighter_cost_tooltip:0 "Для выкупа судов требуется §Y30000§! £fuel_texticon из текущего запаса."
 NAM_defeat_officer_cadres:0 "Офицерские кадры"
 NAM_defeat_officer_cadres_desc:0 "Офицеры ресурсной войны вернулись к полковым картам. На отнятых промыслах остались знакомые, которые узнают части по знакам на машинах. По их донесениям инструкторы готовят новые батальоны."
 NAM_return_officers_intel_tt:0 "Штаб получит §G20§! ед. армейских разведданных о каждом независимом сопернике, который владеет утраченными областями.\nВ начале войны за возвращение связные передадут ещё §G20§! ед. по каждой армии противника."
 NAM_defeat_new_levies:0 "Новые наборы"
 NAM_defeat_new_levies_desc:0 "Окружной писарь снова обходит дворы с призывной книгой. У дверей его встречают люди, которых он провожал на прошлую войну. Одни узнают знакомую печать, другие молча закрывают ставни."
 NAM_defeat_war_chest:0 "Военная казна"
 NAM_defeat_war_chest_desc:0 "Казначей задерживается в конторе после ухода служащих. Под обычными портовыми ведомостями лежит тонкая книга без герба на обложке. Её он убирает в ящик прежде, чем впустить посетителя."
 NAM_return_commission_yard:0 "Выкупить верфь и партию орудий"
 NAM_return_commission_yard_desc:0 "Портовый начальник осматривает ремонтный двор вместе с его владельцем. На стапеле лежит недостроенный корпус, под навесами сохнут деревянные лекала. В конторе ждут казначейского поверенного с бумагами на передачу."
 NAM_return_commission_yard_unlock_tt:0 "После применения решения: строит верфь в выбранном порту и закупает артиллерию общим заказом казны."
 NAM_return_yard_site_tt:0 "В подконтрольном порту Южной гавани или островов есть место для верфи."
 NAM_return_yard_cost:0 "§Y450§! £ADISCORD_economy_treasury_texticon"
 NAM_return_yard_cost_blocked:0 "§R450§! £ADISCORD_economy_treasury_texticon"
 NAM_return_yard_cost_tooltip:0 "Для выкупа верфи и партии орудий требуется §Y450§! £ADISCORD_economy_treasury_texticon."
 NAM_defeat_war_of_return:0 "Война возвращения"
 NAM_defeat_war_of_return_desc:0 "Армия восстановлена, промыслы ждут. Светлогорье готово потребовать назад то, что у него отняли по мирному договору."
 NAM_defeat_early_tribute:0 "Выкупить дань"
 NAM_defeat_early_tribute_desc:0 "На каждой цистерне для победителей стоит чужая приёмочная печать. Ром подолгу смотрит на ведомость дани, прежде чем вызвать казначея. В комнате ждут ответа, о котором пока никто не говорит вслух."
 NAM_defeat_oil_union:0 "Нефтяной союз с соседями"
 NAM_defeat_oil_union_desc:0 "У одной вышки встречаются мастера, недавно работавшие по разные стороны фронта. Они начинают разговор с изношенного насоса. Поверенные трёх стран слушают их, отложив приготовленные речи."
 NAM_defeat_open_border:0 "Открытая граница"
 NAM_defeat_open_border_desc:0 "У пограничной заставы пожилая женщина показывает часовому семейную фотографию. Дом на снимке виден с дороги. За столом переговоров лежит целая пачка таких прошений."
 NAM_defeat_road_south:0 "Дорога на Юг"
 NAM_defeat_road_south_desc:0 "Бывшие враги смотрят на Шахрабад с той же тревогой, что и мы. Светлогорье предлагает Эфлору и Ажару союз против печей Юга."
 NAM_defeat_southern_charter:0 "Южный договор"
 NAM_defeat_southern_charter_desc:0 "Союз с бывшими врагами готов к испытанию. Если Шахрабад не отступит, война за Юг решит, чей договор будет действовать в пустыне."
 NAM_defeat_oil_peace:0 "Нефтяной мир"
 NAM_defeat_oil_peace_desc:0 "В порту снова слышны знакомые голоса иностранных приказчиков. Комендант не снимает шинели, даже заходя в торговую контору: вести с юга ещё не дают ему покоя."
 NAM_defeat_second_chapter:0 "Вторая глава"
 NAM_defeat_second_chapter_desc:0 "Светлогорье пережило поражение и не распалось. Какой бы путь ни выбрала страна, её история продолжается собственными силами."
 NAM_independent_tt:0 "Воркерланд распался, а Светлогорье не подчинено другой стране"
 NAM_restitution_clock_tt:0 "Подготовка ресурсной войны продолжается."
 NAM_ladder_formed_tt:0 "Лестница печатей сложилась: после провозглашения независимости между вертикалью наместников и округами установилось равновесие"
 NAM_underground_reports_tt:0 "Подполье Вебера: §G-5§!."
 NAM_weber_channel_tt:0 "Подполье Вебера: §G-5§!."
 NAM_mine_councils_tt:0 "Нефтяная пропускная способность: §G+1§! ед."
 NAM_field_gendarmes_tt:0 "При диверсии стража позволяет за §Y15§! £command_power_texticon восстановить ущерб этого пожара на собственном контролируемом промысле. Выжженные промыслы требуют отдельного восстановления."
 NAM_district_volunteers_tt:0 "Подполье Вебера: §G-10§!."
 NAM_deep_wells_tt:0 "Нефтяная пропускная способность: §G+1§!."
 NAM_oil_ministry_tt:0 "Нефтяная пропускная способность: §G+1§!."
 NAM_export_consortium_tt:0 "Нефтяная пропускная способность: §G+2§!."
 NAM_defeat_oil_union_tt:0 "Нефтяная пропускная способность: §G+2§!."
 NAM_second_drilling_crew_tt:0 "Места для проектов на промыслах: §G+1§!."
 NAM_line_engineers_tt:0 "Места для подготовки рубежей: §G+1§!."
 NAM_discipline_of_seals_tt:0 "Дисциплина печатей: §G+10§!."
