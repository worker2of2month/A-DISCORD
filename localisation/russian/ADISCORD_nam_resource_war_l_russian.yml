 NAM_prag_delivery_port_tt:0 "Светлогорье независимо, владеет Южной гаванью и контролирует её порт."
 NAM_prag_endorsement_tt:0 "Свидетельство можно передать перевозчику вместо топлива из резервуаров при бартерном фрахте.\nЕсли свободное свидетельство есть, оно используется первым.\nДо открытия обычного фрахта понадобится свидетельство."
 NAM_prag_guarantee_book_tt:0 "В реестре можно держать одновременно §Y2§! оплаченных свидетельства вместо одного, в том числе переданное перевозчику. За каждой новой партией нужно обратиться в суд."
