 NAM_island_public_works_cost_tooltip:0 "§Y30§! £political_power_texticon §Y250§! £ADISCORD_economy_treasury_texticon"
 NAM_mobilisation_capacity_tt:0 "Лимит оплаченных формирований: §G+1§! £divisions_texticon (до §Y6§!)."
 NAM_mobilisation_reinforcements_tt:0 "Мобилизационный лимит заполнен: подготовленные люди поступят в резерв пополнения."
 NAM_fuel_embargo_trade_tt:0 "Экспортные конторы: §R-10§! £NAM_support_trade_texticon."
 NAM_fuel_embargo_active_tt:0 "Против этой страны действует наше топливное эмбарго"
 NAM_fuel_embargo_source_tt:0 "Контролируем хотя бы один нефтяной район бассейна"
 NAM_crisis_no_case_tt:0 "Нет неразобранного происшествия"
 NAM_crisis_close_case:0 "Дело утратило актуальность."
 ADISCORD_nam_crisis.4.z:0 "Чрезвычайный фонд."
 NAM_crisis_audit_recovery_tt:0 "Возвращённые таможенные сборы: §G150§! £ADISCORD_economy_treasury_texticon. Экспортные конторы: §R-6§! £NAM_support_trade_texticon."
 NAM_crisis_audit_support_tt:0 "Для расширенной ревизии нужна поддержка экспортных контор не ниже §Y30§!"
 NAM_field_repair_upgrade_tt:0 "Ремонт скважин восстанавливает §G45§! пунктов состояния вместо §Y30§!."
 NAM_operation_no_refund_tt:0 "Операция прекращается. Потраченная оплата не возвращается."
 NAM_defend_fields_resolution_tt:0 "Исход по истечении срока определяется нефтяным счётом за контролируемые округа:\n- $STATE_67$: §Y80§!.\n- $STATE_689$: §Y36§!.\n- $STATE_690$: §Y24§!.\n- $STATE_719$: §Y12§!.\n- $STATE_688$: §Y12§!.\nЭто фиксированные очки контроля: состояние и развитие промыслов их не меняют.\n\nОт §Y100§! и контроль хотя бы одного пограничного округа противника: §Gпризнанная независимость с новой границей§!. Пограничные округа: $STATE_720$, $STATE_721$, $STATE_722$, $STATE_701$.\nОт §Y100§! без такого округа: ничья на прежней границе.\n§Y36-99§!: компромиссный мир с уступками и годом дани.\nНиже §R36§!: раздел страны.\nДосрочная победа: Эфлор побеждён, а Ажар побеждён или уже вышел из войны."
 NAM_hold_field_context_tt:0 "Контроль промысла проверяется в конце срока приказа. Завершение ресурсной войны закрывает приказ без награды."

 NAM_coalition_logistics:0 "Тыловые службы коалиции"
 NAM_coalition_transport_contract:0 "Заказ подвижного состава"
 NAM_coalition_transport_contract_desc:0 "Железнодорожные мастерские и торговые конторы собирают партию машин, вагонов и судовых припасов."
 NAM_naval_home_port_tt:0 "Независимое Светлогорье контролирует Южную гавань и её порт."
 NAM_naval_observation_ready_tt:0 "Южная гавань доступна; уровень её радиолокационной станции ниже §Y2§!."
 NAM_naval_shipyard_ready_tt:0 "Светлогорье независимо и контролирует Южную гавань, её порт и верфь."
 NAM_naval_marines_ready_tt:0 "Южная гавань доступна, морская пехота открыта; в армии не более §Y3§! морских батальонов."
 NAM_naval_order_free_tt:0 "Предыдущий заказ этой программы завершён."
 NAM_coast_observation_order_unlock_tt:0 "Программа оборудует радиолокационные посты Южной гавани."
 NAM_escort_order_unlock_tt:0 "Программа пополняет резервный флот парой эскортных кораблей."
 NAM_submarine_order_unlock_tt:0 "Программа пополняет резервный флот парой подводных лодок."
 NAM_marine_detachment_order_unlock_tt:0 "Программа готовит десантный отряд из трёх морских батальонов."
 NAM_coast_observation_order_delivery_tt:0 "В Южной гавани: §G+1§! уровень радиолокационной станции, максимум §Y2§!. Если место строительства недоступно или предел уже достигнут, оплата возвращается."
 NAM_escort_order_delivery_tt:0 "Светлогорье получает §G2§! эскортных корабля образца 2155 года в резервный флот. Если Южная гавань или верфь недоступны, оплата возвращается."
 NAM_submarine_order_delivery_tt:0 "Светлогорье получает §G2§! подводные лодки образца 2155 года в резервный флот. Если Южная гавань или верфь недоступны, оплата возвращается."
 NAM_marine_detachment_order_delivery_tt:0 "В Южной гавани формируется §G1§! отряд из §Y3§! морских батальонов с полным оснащением. Через программу можно довести армию до §Y6§! морских батальонов. Если порт недоступен или к завершению сборов в армии уже больше трёх морских батальонов, вся оплата возвращается."
 NAM_basin_reconnaissance:0 "Разведка морского бассейна"
 NAM_basin_reconnaissance_desc:0 "Лоцманы знают фарватер, рыбаки - тихие бухты, а береговые смотрители - силуэты чужих судов. Портовой службе предстоит собрать эти знания на одной карте."
 NAM_active_squadron:0 "Действующая эскадра"
 NAM_active_squadron_desc:0 "Корабли не должны ждать неприятеля у причала. Командиры сведут их в действующую эскадру и научатся искать противника за пределами знакомых рейдов."
 NAM_naval_construction:0 "Морская строительная программа"
 NAM_naval_construction_desc:0 "Мастерским нужны общие чертежи, а верфи - понятный порядок заказов. Морское ведомство определит, какие корабли оно сможет строить своими силами."
 NAM_marine_arsenal:0 "Арсенал морской пехоты"
 NAM_marine_arsenal_desc:0 "Десант начинается со сборного двора: здесь проверяют оружие, укладывают имущество и учат отделения держаться вместе ещё до посадки на корабль."
 NAM_coast_observation_order:0 "Оборудовать береговые посты"
 NAM_coast_observation_order_desc:0 "Смотрителям нужны надёжная связь с гаванью и точные приборы. Портовые мастерские подготовят посты к общей службе."
 NAM_coast_observation_order_cost:0 "§Y50§! £political_power_texticon"
 NAM_coast_observation_order_cost_blocked:0 "§R50§! £political_power_texticon"
 NAM_coast_observation_order_cost_tooltip:0 "§Y50§! £political_power_texticon"
 NAM_coast_observation_order_refund_tt:0 "Возвращается вся оплата: §Y50§! £political_power_texticon."
 NAM_escort_order:0 "Заказать пару эскортных кораблей"
 NAM_escort_order_desc:0 "Верфь получила чертежи корабля сопровождения. Теперь её мастерам предстоит согласовать работу цехов и вывести корпуса к достроечной стенке."
 NAM_escort_order_cost:0 "§Y100§! £political_power_texticon"
 NAM_escort_order_cost_blocked:0 "§R100§! £political_power_texticon"
 NAM_escort_order_cost_tooltip:0 "§Y100§! £political_power_texticon"
 NAM_escort_order_refund_tt:0 "Возвращается вся оплата: §Y100§! £political_power_texticon."
 NAM_submarine_order:0 "Заказать пару подводных лодок"
 NAM_submarine_order_desc:0 "Подводный корабль не прощает небрежности. Приёмная комиссия проследит за каждой секцией корпуса и каждым соединением труб."
 NAM_submarine_order_cost:0 "§Y100§! £political_power_texticon"
 NAM_submarine_order_cost_blocked:0 "§R100§! £political_power_texticon"
 NAM_submarine_order_cost_tooltip:0 "§Y100§! £political_power_texticon"
 NAM_submarine_order_refund_tt:0 "Возвращается вся оплата: §Y100§! £political_power_texticon."
 NAM_marine_detachment_order:0 "Подготовить морской десантный отряд"
 NAM_marine_detachment_order_desc:0 "На учебном берегу пехотинцы привыкают к качке, тесным трапам и командам сигнальщиков. После сборов им предстоит служба вместе с флотом."
 NAM_marine_detachment_order_cost:0 "§Y50§! £political_power_texticon, §Y3000§! £manpower_texticon, §Y2700§! £infantry_equipment_texticon, §Y144§! $ADISCORD_squad_weapons_equipment$"
 NAM_marine_detachment_order_cost_blocked:0 "§R50§! £political_power_texticon, §R3000§! £manpower_texticon, §R2700§! £infantry_equipment_texticon, §R144§! $ADISCORD_squad_weapons_equipment$"
 NAM_marine_detachment_order_cost_tooltip:0 "§Y50§! £political_power_texticon, §Y3000§! £manpower_texticon, §Y2700§! £infantry_equipment_texticon, §Y144§! $ADISCORD_squad_weapons_equipment$"
 NAM_marine_detachment_order_refund_tt:0 "Возвращается вся оплата: §Y50§! £political_power_texticon, §Y3000§! £manpower_texticon, §Y2700§! £infantry_equipment_texticon, §Y144§! $ADISCORD_squad_weapons_equipment$."
 NAM_resource_war_deadline:0 "Коалиция готовит ресурсную войну"
 NAM_resource_war_deadline_desc:0 "Штабы соседей сводят планы, а интенданты собирают эшелоны. Канцелярия ещё может добиться переговоров, но каждое новое соглашение потребует уступок."
 NAM_rw_deadline_expired_tt:0 "Срок подготовки коалиции истёк. Начинается проверка условий объявления войны; оплаченные формирования сохраняются до фактического начала войны или окончательной отмены угрозы."
 NAM_bw_deadline_active:0 "До нападения: §Y[?days_mission_timeout@NAM_resource_war_deadline|0]§! £time_texticon. Разовые соглашения продлевают этот срок."
 NAM_bw_value_none:0 "-"
 NAM_mobilisation_active_desc:0 "§YПОДГОТОВЛЕННЫЕ ФОРМИРОВАНИЯ§!\n[NAMGetOrdersSummary]\n\n§YОПЛАТА И ВЫХОД В СТРОЙ§!\nПриказ сразу списывает цену и набранных людей. Казна снаряжает соединение; оно выходит полностью укомплектованным в день начала войны.\nДо войны отмена возвращает казну, топливо и людей. Политическая власть не возвращается.\n\n§YОБОРОНА ПРОМЫСЛОВ§!\nРубежи в работе: §Y[?NAM_lines_in_progress|0] / [?NAM_line_slots|0]§! £fort_texticon\nДисциплина печатей: §Y[?NAM_seal_discipline|0] / 100§!\nОрганизация армии: [?NAM_seal_org_factor|=+1%] £organization_texticon\n\n§YПРИКАЗЫ НА УДЕРЖАНИЕ§!\n- Северные месторождения: [NAMGetHold67]\n- Южнобережье: [NAMGetHold689]\n- Сухоречье: [NAMGetHold690]"
 NAM_normalisation_trade_tt:0 "Нефтяная пропускная способность: §G+1§!."
 NAM_defeat_oil_peace_tt:0 "Светлогорье отказывается от собственного наступления на юг. После общей подготовки Шахрабад по-прежнему может напасть."
 NAM_mobilisation_border_desc:0 "§YПОГРАНИЧНЫЕ РУБЕЖИ§!\nРубежи в работе: §Y[?NAM_lines_in_progress|0] / [?NAM_line_slots|0]§! £fort_texticon\n\nСтройка доступна в своих контролируемых округах с сухопутной границей. Завершённый рубеж нельзя заказать повторно; после потери и возвращения округа его можно восстановить."

 SLF_humanism_party_long: "£GFX_generic_humanism_reform_party_texticon Временный штаб восстания"
 NAM_wrk_concession_income: "Торговая концессия Воркерланда"
 NAM_wrk_concession_income_desc: "Торговые дома метрополии перечисляют Светлогорью его долю по подписанной концессии."
