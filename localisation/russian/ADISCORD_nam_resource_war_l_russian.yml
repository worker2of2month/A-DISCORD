 NAM_bw_support_nam_tt:0 "§YНАМЕСТНИКИ§!\nПоддержка: [NAMSupportNamColour][?NAM_grp_nam_support|1] / 100§! £NAM_support_nam_texticon; вес: §Y[?NAM_grp_nam_influence|0]§!.\nСейчас: [NAMGetNamestnikSupportEffect].\nОт §Y70§! поддержки: §G+5%§! к сбору налогов; при §Y25§! и ниже: §R-0,10§! £political_power_texticon /дн.\nРиск кризиса: поддержка ниже §Y25§! и отрицательная казна.\n\n§YМИЛОСТЬ ОПОРЫ§!\n[NAMSupportNamFavour]\nЦена: §R15§! £NAM_support_nam_texticon. Действует §Y120§! £time_texticon; повтор через §Y180§! £time_texticon после выдачи."
 NAM_bw_favour_oil_locked:0 "Требуется фокус §YДоговор с промыслами§!."
 NAM_bw_support_oil_tt:0 "§YНЕФТЯНИКИ§!\nПоддержка: [NAMSupportOilColour][?NAM_grp_oil_support|1] / 100§! £NAM_support_oil_texticon; вес: §Y[?NAM_grp_oil_influence|0]§!.\nСейчас: [?NAM_loy_fuel_gain_factor|=+0%] £fuel_texticon к производству топлива.\nОт §Y70§! поддержки: §G+10%§! к производству топлива; при §Y25§! и ниже: §R-15%§!.\nРиск кризиса: поддержка ниже §Y25§! и состояние собственного промысла ниже §Y50%§! или его оккупация.\n\n§YМИЛОСТЬ ОПОРЫ§!\n[NAMSupportOilFavour]\nЦена: §R15§! £NAM_support_oil_texticon. Действует §Y120§! £time_texticon; повтор через §Y180§! £time_texticon после выдачи."
 NAM_bw_favour_dist_locked:0 "Требуется фокус §YОкружное строительство§!."
 NAM_bw_support_dist_tt:0 "§YОКРУГА§!\nПоддержка: [NAMSupportDistColour][?NAM_grp_dist_support|1] / 100§! £NAM_support_dist_texticon; вес: §Y[?NAM_grp_dist_influence|0]§!.\nСейчас: [NAMGetDistrictSupportEffect].\nОт §Y70§! поддержки: §G+5%§! к скорости строительства; при §Y25§! и ниже: §R-5%§! £stability_texticon.\nРиск кризиса: поддержка ниже §Y25§! и стабильность ниже §Y35%§!.\n\n§YМИЛОСТЬ ОПОРЫ§!\n[NAMSupportDistFavour]\nЦена: §R15§! £NAM_support_dist_texticon. Действует §Y120§! £time_texticon; повтор через §Y180§! £time_texticon после выдачи."
 NAM_bw_favour_garr_locked:0 "Требуется фокус §YВоенная приёмка§!."
 NAM_bw_support_garr_tt:0 "§YГАРНИЗОНЫ§!\nПоддержка: [NAMSupportGarrColour][?NAM_grp_garr_support|1] / 100§! £NAM_support_garr_texticon; вес: §Y[?NAM_grp_garr_influence|0]§!.\nСейчас: [?NAM_loy_army_org|=+0%] £organization_texticon к организации армии.\nОт §Y70§! поддержки: §G+5%§! к организации армии; при §Y25§! и ниже: §R-5%§!.\nРиск кризиса: поддержка ниже §Y25§! и поддержка войны ниже §Y30%§!.\n\n§YМИЛОСТЬ ОПОРЫ§!\n[NAMSupportGarrFavour]\nЦена: §R15§! £NAM_support_garr_texticon. Действует §Y120§! £time_texticon; повтор через §Y180§! £time_texticon после выдачи."
