 NAM_pw_notoriety_tt_exile:0 "§YДУРНАЯ СЛАВА§!\nВнимание коалиции к флотилиям: [NAMGetPirateNotoriety].\n\n§YИЗМЕНЕНИЕ§!\n- Удачный набег: §R+6§!; приз: §R+8§!; провал: §R+3§!.\n- На путях Эфлора и Ажара: §R+10§!, §R+12§! и §R+5§! соответственно.\n- Каждый месяц: §G-3§!.\n\n§YОТВЕТ КОАЛИЦИИ§!\n- От §Y50§! - возможна блокада островов.\n- От §Y75§! - возможен карательный рейд.\n- Между ответами: не менее §Y120§! £time_texticon дней.\nВыше §Y59§! множитель удачи набега: §Rx0.8§!."
