 NAM_mil_forward_supply_cost_tooltip:0 "§Y25§! £political_power_texticon §Y150§! £ADISCORD_economy_treasury_texticon §Y60§! £support_equipment_texticon"
 NAM_mil_forward_supply:0 "Развернуть снабжение подготовленного рубежа"
 NAM_mil_forward_depot:0 "Передовой склад рубежа"
 NAM_mil_prepared_line_tt:0 "Округ принадлежит Светлогорью, контролируется им и имеет подготовленный рубеж"
 NAM_mil_forward_supply_delivered_tt:0 "Выбранный округ до конца ресурсного конфликта: местное снабжение §G+0,20§!, восстановление организации §G+10%§!."
 NAM_mil_forward_supply_result_tt:0 "Через §Y14§! £time_texticon дн.: $NAM_mil_forward_supply_delivered_tt$"
 NAM_mil_forward_supply_refund_tt:0 "Возврат оплаты: §Y25§! £political_power_texticon §Y150§! £ADISCORD_economy_treasury_texticon §Y60§! £support_equipment_texticon"
 NAM_mil_forward_supply_desc:0 "Цена: §Y25§! £political_power_texticon §Y150§! £ADISCORD_economy_treasury_texticon §Y60§! £support_equipment_texticon. Подготовка: §Y14§! £time_texticon дн.\n\nУстройте склад у уже подготовленного рубежа. Работа занимает одно общее место подготовки рубежей и выбранный округ. $NAM_mil_forward_supply_delivered_tt$\n\nПри потере округа, капитуляции, подчинении или завершении ресурсного конфликта незавершённая работа возвращает всю оплату и освобождает место. Готовый склад при этих условиях прекращает работу без возврата. Утраченный склад можно восстановить за полную цену после задержки §Y30§! £time_texticon дн. от завершения подготовки."
 NAM_mil_forward_supply_map:0 "Развёртывание передового склада"
 NAM_mil_quartermaster_tt:0 "Каждый «$NAM_supply_order$» дополнительно поставляет §G+80§! $ADISCORD_squad_weapons_equipment$."
