 NAM_cost_project_terminal_tooltip: "§Y30§! £political_power_texticon §Y250§! £ADISCORD_economy_treasury_texticon\nКазна возвращается, если работы будут прерваны."
 NAM_overseas_districts: "Заморские округа"
 NAM_overseas_districts_desc: "Острова Светлогорья добывают сталь, алюминий и вольфрам, но остаются чужими для большинства жителей. Канцелярия может собирать с них налог, держать регулярную конвойную линию или продавать права на добычу соседям. Независимость островов не рассматривается."
 NAM_island_steel_levy: "Стальной сбор с островов"
 NAM_island_steel_levy_desc: "На §Y180 дней§! Большой остров, Западный островной округ и Средний остров платят особый сбор с добычи стали."
 NAM_island_steel_levy_tt: "Каждый месяц, пока действует сбор, каждый из трёх островов под нашей властью приносит §G30§! £ADISCORD_economy_treasury_texticon и теряет §R2%§! покорности."
 NAM_island_convoy_service: "Островная конвойная служба"
 NAM_island_convoy_service_desc: "Оплатить регулярные рейсы между гаванью и заморскими округами. Конвои вывозят руду и привозят припасы, а острова охотнее подчиняются власти, которая о них помнит."
 NAM_island_convoy_service_tt: "Каждый остров под нашей властью получает §Yостровную конвойную линию§! на §Y180 дней§!: добыча ресурсов §G+15%§!, рост покорности §G+5%§!.\nКазна: §R-150§! £ADISCORD_economy_treasury_texticon."
 NAM_cost_convoy_service: "§Y25§! £political_power_texticon §Y150§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_convoy_service_blocked: "§R25§! £political_power_texticon §R150§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_convoy_service_tooltip: "§Y25§! £political_power_texticon §Y150§! £ADISCORD_economy_treasury_texticon\nЦена списывается при выборе."
 NAM_island_concession_231: "Стальная концессия Среднего острова"
 NAM_island_concession_231_desc: "Предложить этой стране права на добычу стали Среднего острова за §Y300§! £ADISCORD_economy_treasury_texticon. Остров остаётся нашим. Концессия прекращается при войне с концессионером или потере острова."
 NAM_island_concession_231_tt: "Страна получает предложение и ответит в ближайшие дни. При согласии она платит §Y300§! £ADISCORD_economy_treasury_texticon и получает права на добычу Среднего острова.\nЭкспортные конторы: §G+6§!."
 NAM_renegotiate_val_concession: "Пересмотреть кефрейтскую концессию"
 NAM_renegotiate_val_concession_desc: "Кефрейт добывает сталь Западного островного округа по договору военного времени. Канцелярия требует новых условий: разовый платёж §Y300§! £ADISCORD_economy_treasury_texticon или отказ от концессии."
 NAM_renegotiate_val_concession_tt: "Кефрейт получает требование. Если он заплатит §Y300§! £ADISCORD_economy_treasury_texticon, концессия сохранится; если откажется, права на добычу вернутся к нам, а отношения с Кефрейтом ухудшатся."
 NAM_request_val_aid: "Просить помощи Кефрейта за концессию"
 NAM_request_val_aid_desc: "Предложить Кефрейту права на добычу в Западном островном округе в обмен на оружие, наёмников или добровольцев."
 NAM_request_val_aid_paid: "Просить помощи Кефрейта за плату"
 NAM_request_val_aid_paid_desc: "Предложить Кефрейту плату за оружие, наёмников или добровольцев без прав на добычу."
 NAM_val_aid_fee_tt: "В казне не меньше §Y400§! £ADISCORD_economy_treasury_texticon"
 NAM_south_allied_fuel: "Топливо союзникам Юга"
 NAM_south_allied_fuel_desc: "Каждый союзник северного лагеря получает со складов Светлогорья по §Y2500§! £fuel_texticon, пока хватает запаса."
 NAM_south_allied_fuel_tt: "Каждый союзник северного лагеря в войне за Юг получает §G2500§! £fuel_texticon и §G+2%§! поддержки войны; столько же топлива списывается с наших складов. Поставки идут, пока на складе остаётся §Y2500§! £fuel_texticon."
 NAM_south_convoy_interdiction: "Перехват конвоев Шахрабада"
 NAM_south_convoy_interdiction_desc: "Охотники за конвоями выходят на маршруты танкеров и барж, питающих печи Шахрабада."
 NAM_cost_convoy_interdiction: "§Y20§! £political_power_texticon §Y2000§! £fuel_texticon"
 NAM_cost_convoy_interdiction_blocked: "§R20§! £political_power_texticon §R2000§! £fuel_texticon"
 NAM_cost_convoy_interdiction_tooltip: "§Y20§! £political_power_texticon §Y2000§! £fuel_texticon\nЦена списывается при выборе."
 ADISCORD_nam_debug_damage_fields: "§RDEBUG:§! Повредить промыслы Светлогорья"
 ADISCORD_nam_debug_damage_fields_desc: "Снижает состояние Северных месторождений и Южнобережного округа на 40 и пересчитывает нефтяную пропускную способность."

 ADISCORD_nam_oil.1.t: "Светлогорское топливо"
 ADISCORD_nam_oil.1.d: "Торговый представитель Светлогорья привёз проект контракта. Светлогорье предлагает ежемесячные поставки топлива со своих промыслов - по 1500 £fuel_texticon каждый месяц, пока договор в силе и пока между нами нет войны.\n\nПромыслы Светлогорья дают большую часть нефти Юга, и в министерствах понимают, что от этого контракта будет трудно отказаться позже. Подпись даст топливо сейчас, но поставит наши склады в зависимость от решений Егора Рома."
 ADISCORD_nam_oil.1.a: "Обойдёмся без светлогорской нефти."
 ADISCORD_nam_oil.1.b: "Подписать контракт."
 NAM_oil_1_a_tt: "Контракт не заключается."
 NAM_oil_1_b_tt: "Каждый месяц мы получаем §G1500§! £fuel_texticon, если у Светлогорья есть свободная пропускная способность и топливо на складе. Война со Светлогорьем оборвёт поставки и вызовет на §Y90 дней§! нехватку топлива."
 ADISCORD_nam_oil.2.t: "Ответ покупателя"
 ADISCORD_nam_oil.2.d_signed: "[FROM.GetNameDefCap] подписывает контракт. Первые цистерны уходят с промыслов в ближайший месяц, а в портовых конторах уже считают выручку.\n\nКаждый контракт занимает часть пропускной способности промыслов, но делает соседей заинтересованными в том, чтобы светлогорская нефть продолжала течь."
 ADISCORD_nam_oil.2.d_lapsed: "[FROM.GetNameDefCap] соглашается на контракт, но к моменту подписания у промыслов не осталось свободной пропускной способности. Конторы извиняются за задержку и обещают вернуться к разговору, когда трубы освободятся."
 ADISCORD_nam_oil.2.d_refused: "[FROM.GetNameDefCap] отказывается от контракта. В министерствах предпочитают не связывать свои склады со Светлогорьем - по крайней мере сейчас."
 ADISCORD_nam_oil.2.a: "Принято к сведению."
 ADISCORD_nam_oil.4.t: "Сталь Среднего острова"
 ADISCORD_nam_oil.4.d: "Светлогорье предлагает права на добычу стали на Среднем острове. Рудники остаются под светлогорским флагом, но вся их добыча пойдёт нам. Цена - 300 £ADISCORD_economy_treasury_texticon единовременно.\n\nКонцессия действует, пока остров принадлежит Светлогорью и между нами нет войны."
 ADISCORD_nam_oil.4.a: "Отказаться."
 ADISCORD_nam_oil.4.b: "Купить концессию."
 NAM_oil_4_a_tt: "Концессия не заключается."
 NAM_oil_4_b_tt: "Казна: §R-300§! £ADISCORD_economy_treasury_texticon.\nМы получаем права на добычу §YСреднего острова§!."
 ADISCORD_nam_oil.5.t: "Ответ о концессии"
 ADISCORD_nam_oil.5.d_signed: "[FROM.GetNameDefCap] покупает стальную концессию Среднего острова. Деньги уже в казне, а на рудниках вывешивают новые списки смен."
 ADISCORD_nam_oil.5.d_refused: "[FROM.GetNameDefCap] отказывается от стальной концессии. Рудники Среднего острова продолжают работать на Светлогорье."
 ADISCORD_nam_oil.5.a: "Принято к сведению."
 ADISCORD_nam_oil.6.t: "Новые условия концессии"
 ADISCORD_nam_oil.6.d: "Канцелярия Светлогорья требует пересмотреть концессию на Западном островном округе. Договор, заключённый во время войны, больше не устраивает признанное государство: Светлогорье требует единовременного платежа в 300 £ADISCORD_economy_treasury_texticon. Отказ означает расторжение концессии.\n\nВ Кефрейте понимают, что спорить с хозяином острова можно лишь до определённого предела."
 ADISCORD_nam_oil.6.a: "Заплатить и сохранить концессию."
 ADISCORD_nam_oil.6.b: "Отказаться от новых условий."
 ADISCORD_nam_oil.close: "Вопрос уже решён."
 NAM_oil_6_a_tt: "Казна: §R-300§! £ADISCORD_economy_treasury_texticon.\nПрава на добычу в §YЗападном островном округе§! сохраняются."
 NAM_oil_6_b_tt: "Концессия расторгается: права на добычу возвращаются Светлогорью.\nНаше отношение к Светлогорью ухудшается."
 ADISCORD_nam_oil.7.t: "Ответ Кефрейта"
 ADISCORD_nam_oil.7.d_paid: "Кефрейт принял новые условия и перевёл деньги. Концессия на Западном островном округе продолжает действовать, но теперь её цену определяет Светлогорье."
 ADISCORD_nam_oil.7.d_revoked: "Кефрейт отказался платить. Концессия расторгнута, рудники Западного островного округа снова работают на Светлогорье. Наместники считают это восстановлением справедливости, в Кефрейте - оскорблением."
 ADISCORD_nam_oil.7.a: "Принято к сведению."
 ADISCORD_nam_oil.10.t: "Нефть для коалиции"
 ADISCORD_nam_oil.10.d: "Война с Землёй Хана идёт на нескольких фронтах, и у каждого союзника в штабе висит одна и та же сводка расхода топлива. Посланники коалиции спрашивают Светлогорье прямо: будет ли его нефть общей?\n\nНефтяники советуют назвать цену - другого такого момента не будет. Офицеры напоминают, что без топлива союзников армии Хана придут и к промыслам Светлогорья. Экспортные конторы предлагают обычные контракты: топливо в обмен на деньги, по правилам, которые союзники уже знают."
 ADISCORD_nam_oil.10.a: "Сначала доля Светлогорья."
 ADISCORD_nam_oil.10.b: "Заправить коалицию."
 ADISCORD_nam_oil.10.c: "Предложить союзникам контракты."
 NAM_oil_10_a_tt: "Нефтяники: §G+6§!\nЭкспортные конторы: §G+6§!\nОтношение союзников по коалиции к нам ухудшается."
 NAM_oil_10_b_tt: "Каждый союзник по коалиции получает §G3000§! £fuel_texticon, пока на нашем складе есть столько топлива; отношение союзников к нам улучшается."
 NAM_oil_10_c_tt: "Союзники по коалиции из числа наших покупателей получают предложение топливного контракта. Каждый контракт по-прежнему требует свободной пропускной способности."
 NAM_oil_buyer_eligible_tt: "Страна не воюет с нами, ещё не покупает наше топливо, не ждёт ответа на другое наше предложение, не находится под нашим эмбарго и не получает топливо по договору с нами"
 NAM_concession_231_free_tt: "Средний остров принадлежит нам и контролируется нами; концессия никому не продана и не ждёт ответа; страна не воюет с нами"
 NAM_val_renegotiation_free_tt: "Кефрейт ещё не ответил на прежнее требование"
 NAM_south_blockade_free_tt: "Предыдущий перехват конвоев Шахрабада уже закончился"

