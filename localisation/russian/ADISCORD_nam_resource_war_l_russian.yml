 NAM_defend_fields_resolution_tt:0 "§YНефтяной счёт§!\nОчки за контролируемые округа:\n- $STATE_67$: §Y80§!.\n- $STATE_689$: §Y36§!.\n- $STATE_690$: §Y24§!.\n- $STATE_719$: §Y12§!.\n- $STATE_688$: §Y12§!.\nЭто фиксированные очки контроля: состояние и развитие промыслов их не меняют.\n\n§YМир по истечении срока§!\nОт §Y100§! и контроль хотя бы одного пограничного округа противника: §Gпризнанная независимость с новой границей§!. Пограничные округа: $STATE_720$, $STATE_721$, $STATE_722$, $STATE_701$.\nОт §Y100§! без такого округа: ничья на прежней границе.\n§Y36-99§!: компромиссный мир с уступками и годом дани.\nНиже §R36§!: раздел страны.\n\n§YДосрочная победа§!\n Эфлор побеждён, а Ажар побеждён или уже вышел из войны.\n\n§YДосрочный мир по фронту§!\nЗахват решающих округов назначает проверку через §Y7§! £time_texticon дн.; результат определяется контролем на момент проверки.\nПобеда: удерживаем все пограничные округа Эфлора и все принадлежащие нам промыслы; пока Ажар воюет с нами, нужен и $STATE_722$.\nПоражение: Эфлор, Ажар или их подданные контролируют принадлежащие нам $STATE_67$ и ещё один промысел. Захваты повстанцев не учитываются.\nПри разделе правительство отступает на принадлежащие ему острова; без островов страна исчезает."
 NAM_hold_field_context_tt:0 "Контроль промысла проверяется в конце срока приказа. Завершение ресурсной войны закрывает приказ без награды."

