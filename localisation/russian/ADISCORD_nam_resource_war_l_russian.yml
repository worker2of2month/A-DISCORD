 NAM_admin_seal_appeal_delivered_tt:0 "§G+4§! £NAM_support_nam_texticon, §G+8§! £NAM_support_dist_texticon. При балансе за пределами §Y-10% / +10%§! он сдвигается на §Y10§! пунктов к центру."
 NAM_admin_seal_appeal_result_tt:0 "Через §Y14§! £time_texticon дн.: §G+4§! £NAM_support_nam_texticon, §G+8§! £NAM_support_dist_texticon. При балансе за пределами §Y-10% / +10%§! он сдвигается на §Y10§! пунктов к центру."
 NAM_admin_seal_appeal_desc:0 "В суд поступили жалобы на спорные взыскания и распоряжения управ. Судьи вызовут обе стороны и сверят поставленные печати с действительными полномочиями подписантов."
 NAM_admin_contract_trust_tt:0 "До завершения фокуса $NAM_seal_courts$ поддержка округов должна сохраняться весь срок заказа. После него падение поддержки не отменяет оплаченный заказ. Потеря остальных условий возвращает оплату."
 NAM_admin_contract_security_tt:0 "Суды печатей защищают уже оплаченные добровольный набор, закупку снаряжения для дружин и строительство артелей от отмены из-за падения поддержки округов.\nДля нового заказа поддержка по-прежнему необходима; независимость, действующая администрация и пригодная местная площадка остаются обязательными до выдачи."
 NAM_admin_operable_tt:0 "Светлогорье независимо, администрация действует и лестница печатей учреждена"
