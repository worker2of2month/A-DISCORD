 NAM_mil_reserve_arsenal_result_tt:0 "Через §Y21§! £time_texticon дн.: §G+9000§! £infantry_equipment_texticon, §G+80§! £support_equipment_texticon.\nУже оплаченная поставка продолжается после начала ресурсной войны; новые заказы принимаются только до неё."
 NAM_mil_reserve_arsenal_refund_tt:0 "§G+300§! £ADISCORD_economy_treasury_texticon."
 NAM_mil_reserve_arsenal_desc:0 "На резервных складах сверяют оружейные ведомости с мобилизационными списками. Снабженцы должны подготовить комплекты до того, как во дворах появятся первые эшелоны."
