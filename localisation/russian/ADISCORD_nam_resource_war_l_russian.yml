 ADISCORD_nam_resource_war.80.t: "Центр исчез"
 ADISCORD_nam_resource_war.80.d: "Первое сообщение о распаде центрального управления принёс дежурный связист. Ром спросил, подтверждено ли оно правительственным каналом. Связист ответил, что этот канал и пытается вызвать. Через час пришло другое сообщение, затем третье; названия учреждений в них ещё совпадали, имена начальников - уже нет. Никто не мог сказать, какое распоряжение считать последним.\n\nРом попросил не менять флаги до заседания. В молодости он уже видел, как быстро служащие находят новые обращения к начальству. Тогда достаточно было дождаться, пока станет ясно, чьи приказы переписывать. Теперь в приёмной ждали его решения: порт запрашивал разрешение на отправку нефти, гарнизон - подтверждение снабжения, наместники - объяснение, кто отвечает за сборы. Ром велел пригласить всех сразу.\n\nМезенцев начал с танкеров. Груз приготовлен по старым квотам, но подтвердить расчёт со столицей некому. Отправить его сейчас означало принять риск на местную казну; задержать - отвечать перед капитанами и промысловыми управлениями. Кто-то предложил ещё раз запросить министерство. Ром спросил, кто там примет запрос. Ответа не было.\n\nЗа последние годы он не раз представлял себе Светлогорье без столичного надзора. В этих мыслях обычно оставалось время договориться с округами, подготовить запасы и объясниться с соседями. Сейчас нужно было разбираться со всем одновременно. Эфлор и Ажар помнили, как эти месторождения перешли под воркерландское управление. В городе действовало подполье Вебера. Ни один из этих споров не закончился вместе с метрополией.\n\nРом придвинул свой стул к столу, чтобы видеть сидевших по краям.\n- Начнём с порта. Какие у нас обязательства по этим судам?"
 ADISCORD_nam_resource_war.80.d_successor: "После распада центрального управления правительственные каналы перестали подтверждать распоряжения. Из Воркерланда поступают противоречивые сообщения о новых начальниках и штабах. Порт запрашивает разрешение на отправку нефти, гарнизоны - подтверждение снабжения. Квоты и расчёты с метрополией больше не опираются на общее правительство.\n\nНа заседание собрались наместники, коменданты и представители округов. Им предстоит определить, кто отвечает за местные доходы и исполнение обязательств. Эфлор и Ажар сохраняют притязания на промыслы, а подполье Вебера - свои требования к администрации. Распад центра не разрешил ни одного из этих споров.\n\nСветлогорье должно принять собственные решения об управлении и независимости. Колониальные распоряжения прекращают действие; отношения между местными учреждениями предстоит закрепить заново."
 ADISCORD_nam_resource_war.80.a: "Мы сами по себе."
 NAM_center_vanished_tt:0 "Колониальные программы закрыты: концессия метрополии больше не платит, категория \"Колония Воркерланда\" исчезает.\nПосле завершения фокуса \"Штиль перед штормом\" становятся доступны ветви подготовки независимого Светлогорья.\nСледом канцелярия соберётся подписывать декларацию независимости."
 ADISCORD_nam_resource_war.81.t: "Бегство на острова"
 ADISCORD_nam_resource_war.81.d: "Последние транспорты уходили из Южной гавани ночью, без огней. На причалах остались те, кому не хватило места: роты, пробившиеся с северных промыслов слишком поздно, обозы, раненые, которых нельзя было поднять по трапу. Офицеры выкликали фамилии по спискам, и каждая вычеркнутая строка означала человека, остающегося на милость победителей. У ворот порта до темноты держались отряды Ярослава Вебера. Ещё недавно канцелярия разыскивала их по спискам, но коалиция обещала судить подпольщиков вместе с наместниками, и Вебер поднялся по последнему трапу рядом с теми, против кого воевал.\n\nТехнику грузить было некуда. Её сбрасывали с причалов прямо в воду: орудия, грузовики, ящики с винтовками и патронами. Квартирмейстеры подписывали акты о списании, пока над портом не поднялось зарево, - Ром приказал не оставить врагу ни одного исправного ствола. Сапёры уходили последними, а за ними - катера береговой охраны Ростислава Карамышева, прикрывавшие фарватер до последнего транспорта. За ними горели насосные станции, рушились эстакады и пылали склады на промыслах. Коалиция получит нашу землю, но получит её выжженной.\n\nНа рассвете острова встретили изгнанников холодным ветром и пустыми казармами. Здесь нет нефти и почти нет заводов, только сталь, гавани и море. Правительство Светлогорья живо, пока его флаг поднят над островами. Осталось решить, чем оно станет: убежищем побеждённых или плацдармом для возвращения. Решать придётся сегодня же - офицеры с причалов и люди Вебера уже идут к старой таможне, где назначен совет."
 ADISCORD_nam_resource_war.81.a: "Мы вернёмся в Южную Гавань."
 ADISCORD_nam_resource_war.81.b: "Сначала - выжить."
 NAM_exile_evacuation_tt: "§YЭВАКУАЦИЯ§!\n из §Y[?NAM_exile_divisions_before|0]§! дивизий на материке брошено §R[?NAM_exile_divisions_lost|0]§!.\nВ изгнании §Y[?NAM_exile_divisions_after|0]§! дивизий: переправленные сохранили прежний состав и собраны в островной столице.\n\n§YПОТЕРИ§!\nОружия на всех не хватает: каждая дивизия на островах потеряла §R45%§! численности и §R50%§! организации.\nСброшено в море: §R[?NAM_exile_rifles_dumped|0]§! £infantry_equipment_texticon и §R[?NAM_exile_heavy_dumped|0]§! единиц снаряжения поддержки и артиллерии.\n\n§YМАТЕРИК§!\nПромыслы, дороги и Южная Гавань сожжены: месторождения §Y180§! £time_texticon дней не дают ресурсов новым хозяевам."
 NAM_exile_vow_tt: "Готовность к возвращению: §G+10§!."
 NAM_exile_salvage_tt: "Спасённый груз: §G+40§! добычи."
 ADISCORD_nam_resource_war.82.t: "Листовки Вебера"
 ADISCORD_nam_resource_war.82.d: "Утром рабочие Северных месторождений нашли листовки в каждой раздевалке, в столовой и даже в будке мастера. Подпись одна - Ярослав Вебер. Текст короткий: промыслы принадлежат тем, кто на них работает, а наместники - временные гости, которых пора проводить. Жандармы сорвали листовки к полудню, но к вечеру их пересказывали в каждом рабочем посёлке.\n\nПодполье больше не прячется по подвалам. У него есть типографии, курьеры и свои люди в конторах промыслов. Канцелярия ждёт решения: пройтись по спискам, пока сеть не разрослась, или откупиться от округов, пока их недовольство не стало чужим знаменем."
 ADISCORD_nam_resource_war.82.a: "Аресты по спискам жандармерии."
 ADISCORD_nam_resource_war.82.b: "Деньги округам на школы и больницы."
 ADISCORD_nam_resource_war.82.c: "Бумага всё стерпит."
 NAM_ug_82_a_tt: "Подполье: §G-10§!.\nПоддержка округов: §R-5§! £NAM_support_dist_texticon."
 NAM_ug_82_b_tt: "Казна: §R-100§! £ADISCORD_economy_treasury_texticon.\nПодполье: §G-5§!.\nПоддержка округов: §G+6§! £NAM_support_dist_texticon."
 NAM_ug_ignore_tt: "Подполье продолжает расти."
 ADISCORD_nam_resource_war.83.t: "Забастовка на промыслах"
 ADISCORD_nam_resource_war.83.d: "Насосы встали сразу в трёх сменах. Забастовочный комитет, за которым все видят руку Вебера, требует выплатить задержанное жалованье, отменить штрафы наместников и выпустить арестованных. Пока требования не выполнены, нефть не пойдёт ни в цистерны, ни в танкеры.\n\nГарнизоны готовы вывести рабочих силой, но командиры предупреждают: каждый арест превращает молчаливого сочувствующего в бойца подполья. Нефтяники считают убытки и просят решить дело до конца недели."
 ADISCORD_nam_resource_war.83.a: "Разогнать комитет, зачинщиков - под арест."
 ADISCORD_nam_resource_war.83.b: "Выплатить долги и отменить штрафы."
 ADISCORD_nam_resource_war.83.c: "Переждать, пока у них кончатся деньги."
 NAM_ug_83_a_tt: "Подполье: §G-15§!.\nПоддержка округов: §R-10§! £NAM_support_dist_texticon."
 NAM_ug_83_b_tt: "Казна: §R-200§! £ADISCORD_economy_treasury_texticon.\nПодполье: §G-8§!.\nПоддержка округов: §G+8§! £NAM_support_dist_texticon.\nПоддержка нефтяников: §G+4§! £NAM_support_oil_texticon."
 NAM_ug_83_c_tt: "Поддержка нефтяников: §R-6§! £NAM_support_oil_texticon."
 ADISCORD_nam_resource_war.84.t: "Город готов подняться"
 ADISCORD_nam_resource_war.84.d: "Сводки жандармерии больше не похожи на сводки: это карта будущего восстания. В Светлогорске оружие хранят в погребах и на чердаках, у Вебера есть свои командиры кварталов, а патрули после заката обходят рабочие районы стороной. Достаточно одного выстрела, чтобы город вышел на улицы.\n\nКомендант просит ввести в город войска и объявить военное положение. Советники Рома шепчут о другом: Вебер ещё готов говорить, если дать ему повод. Промедление означает одно - следующая искра может оказаться последней."
 ADISCORD_nam_resource_war.84.a: "Ввести гарнизоны в Светлогорск."
 ADISCORD_nam_resource_war.84.b: "Открыть тайный канал к Веберу."
 ADISCORD_nam_resource_war.84.c: "Ждать."
 NAM_ug_84_a_tt: "Подполье: §G-20§!.\nПоддержка гарнизонов: §G+5§! £NAM_support_garr_texticon.\nПоддержка округов: §R-10§! £NAM_support_dist_texticon.\nЕсли лестница печатей уже создана, она смещается к вертикали на §Y0.05§!."
 NAM_ug_84_b_tt: "Казна: §R-150§! £ADISCORD_economy_treasury_texticon.\nПодполье: §G-15§!.\nПоддержка округов: §G+8§! £NAM_support_dist_texticon.\nПоддержка наместников: §R-8§! £NAM_support_nam_texticon."
 NAM_ug_84_c_tt: "Подполье: §R+5§!."
 ADISCORD_nam_resource_war.85.t: "Пожар на промысле"
 ADISCORD_nam_resource_war.85.d: "Ночью на промысле в округе [NAM_ug_field.GetName] взорвалась задвижка магистрального трубопровода. Пожарные сбили пламя только к утру, но две скважины выгорели, а насосная станция стоит без кровли. На обгоревшей стене кто-то вывел мелом знакомый знак подполья.\n\nНачальник промысла просит денег на ремонт, жандармы - разрешения на облавы в окрестных посёлках. Наместник советует объявить случившееся аварией: признать диверсию - значит признать, что Вебер может ударить где угодно."
 ADISCORD_nam_resource_war.85.a: "Бригады - немедленно на ремонт."
 ADISCORD_nam_resource_war.85.b: "Облавы в окрестных посёлках."
 ADISCORD_nam_resource_war.85.c: "Списать на износ оборудования."
 NAM_ug_85_a_tt: "§YУЖЕ ПРОИЗОШЛО§!\nПожар уже повредил промысел. Базовый ущерб - §R[?NAM_ug_strike_damage|0]§! пунктов состояния; действовавшая усиленная охрана уменьшает его вдвое.\n\n§YПОСЛЕ ОТВЕТА§!\nКазна: §R-100§! £ADISCORD_economy_treasury_texticon.\nСостояние промысла: §G+10§!.\nПоддержка нефтяников: §G+3§! £NAM_support_oil_texticon."
 NAM_ug_85_b_tt: "§YУЖЕ ПРОИЗОШЛО§!\nПожар уже повредил промысел. Базовый ущерб - §R[?NAM_ug_strike_damage|0]§! пунктов состояния; действовавшая усиленная охрана уменьшает его вдвое.\n\n§YПОСЛЕ ОТВЕТА§!\nПодполье: §G-8§!.\nПоддержка округов: §R-6§! £NAM_support_dist_texticon."
 NAM_ug_85_c_tt: "§YУЖЕ ПРОИЗОШЛО§!\nПожар уже повредил промысел. Базовый ущерб - §R[?NAM_ug_strike_damage|0]§! пунктов состояния; действовавшая усиленная охрана уменьшает его вдвое.\n\n§YПОСЛЕ ОТВЕТА§!\nПодполье: §R+3§!."
 ADISCORD_nam_resource_war.86.t: "Налёт на арсенал"
 ADISCORD_nam_resource_war.86.d: "Склад гарнизона у развилки дорог взяли без единого выстрела: часовые оказались связаны, ворота открыты своим ключом, а грузовик подполья ушёл в сторону холмов за час до смены караула. Ревизия насчитала недостачу в [?NAM_ug_rifles_stolen|0] винтовок, и каждая из них теперь в руках Вебера.\n\nСледы ещё свежие, и конная жандармерия готова идти по ним. Начальник тыла предлагает другое: удвоить охрану всех складов, пока подполье не вернулось за остальным. Есть и третье мнение - что этих винтовок уже никогда не найти."
 ADISCORD_nam_resource_war.86.a: "В погоню по свежим следам."
 ADISCORD_nam_resource_war.86.b: "Удвоить охрану складов."
 ADISCORD_nam_resource_war.86.c: "Не гоняться за призраками."
 NAM_ug_86_a_tt: "§YУЖЕ ПРОИЗОШЛО§!\nПохищено §R[?NAM_ug_rifles_stolen|0]§! £infantry_equipment_texticon, подполье выросло на §R4§!.\n\n§YПОСЛЕ ОТВЕТА§!\nРавные шансы: вернуть до §G1000§! £infantry_equipment_texticon из похищенного и ослабить подполье на §G6§! - или потерять §R500§! £manpower_texticon в засаде."
 NAM_ug_86_b_tt: "§YУЖЕ ПРОИЗОШЛО§!\nПохищено §R[?NAM_ug_rifles_stolen|0]§! £infantry_equipment_texticon, подполье выросло на §R4§!.\n\n§YПОСЛЕ ОТВЕТА§!\nКазна: §R-100§! £ADISCORD_economy_treasury_texticon.\nПоддержка гарнизонов: §G+4§! £NAM_support_garr_texticon.\nСклады не тронут §Y180§! £time_texticon дней."
 NAM_ug_86_c_tt: "§YУЖЕ ПРОИЗОШЛО§!\nПохищено §R[?NAM_ug_rifles_stolen|0]§! £infantry_equipment_texticon, подполье выросло на §R4§!.\n\n§YПОСЛЕ ОТВЕТА§!\nПодполье: §R+3§!.\nПоддержка округов: §G+2§! £NAM_support_dist_texticon."
 ADISCORD_nam_resource_war.87.t: "Покушение на наместника"
 ADISCORD_nam_resource_war.87.d: "Наместника Южнобережья застрелили на ступенях его собственной управы, средь бела дня, на глазах у просителей. Стрелявший ушёл через рынок, а к вечеру по городу уже ходили листовки с приговором: \"за поборы, за квоты, за наших детей на промыслах\". Подпись Вебера стояла внизу, как печать под указом.\n\nНаместники требуют ответа, который запомнят все округа. Округа ждут, не начнутся ли расправы без суда. Ром понимает: что бы ни сделала канцелярия, это прочтут как ответ на вопрос, кому на самом деле принадлежит власть в Светлогорье."
 ADISCORD_nam_resource_war.87.a: "Военное положение в округах."
 ADISCORD_nam_resource_war.87.b: "Похороны и честное следствие."
 ADISCORD_nam_resource_war.87.c: "Замять дело."
 NAM_ug_87_a_tt: "Подполье: §G-10§!.\nПоддержка наместников: §G+6§! £NAM_support_nam_texticon.\nПоддержка округов: §R-8§! £NAM_support_dist_texticon.\nЕсли лестница печатей уже создана, она смещается к вертикали на §Y0.05§!."
 NAM_ug_87_b_tt: "Подполье: §G-5§!.\nПоддержка наместников: §G+3§! £NAM_support_nam_texticon."
 NAM_ug_87_c_tt: "Поддержка наместников: §R-8§! £NAM_support_nam_texticon."
 NAM_ug_87_loss_tt:0 "Покушение уже стоило стабильности: §R-[?NAM_ug_strike_stability|0]%§!."
 ADISCORD_nam_resource_war.116.t:0 "Подрыв нефтепровода"
 ADISCORD_nam_resource_war.116.d:0 "Ночью на магистрали к побережью грохнуло так, что в Ключевске вылетели стёкла. Подполье заложило заряды сразу под тремя опорами, и нефть горела в балке до самого рассвета, пока обходчики вручную перекрывали задвижки. Утром у разорванной трубы нашли обрывок листовки с тем же знаком, что и на стенах промыслов.\n\nНефтяники считают сгоревшее и спрашивают, кто заплатит за простой. Жандармы просят людей на охрану всей трассы, наместник - разрешения на аресты в посёлках вдоль трубы. В канцелярии понимают: Вебер ударил не по промыслу, а по дороге, которой живёт всё Светлогорье."
 ADISCORD_nam_resource_war.116.a:0 "Обходчиков - на всю трассу."
 ADISCORD_nam_resource_war.116.b:0 "Аресты в посёлках вдоль трубы."
 ADISCORD_nam_resource_war.116.c:0 "Объявить аварией."
 NAM_ug_116_a_tt:0 "§YУЖЕ ПРОИЗОШЛО§!\nСгорело §R[?NAM_ug_strike_fuel|0]§! £fuel_texticon, подполье выросло на §R3§!.\n\n§YПОСЛЕ ОТВЕТА§!\nПодполье: §G-5§!.\nНефтепровод не тронут §Y180§! £time_texticon дн."
 NAM_ug_116_b_tt:0 "§YУЖЕ ПРОИЗОШЛО§!\nСгорело §R[?NAM_ug_strike_fuel|0]§! £fuel_texticon, подполье выросло на §R3§!.\n\n§YПОСЛЕ ОТВЕТА§!\nПодполье: §G-8§!.\nПоддержка округов: §R-6§! £NAM_support_dist_texticon."
 NAM_ug_116_c_tt:0 "§YУЖЕ ПРОИЗОШЛО§!\nСгорело §R[?NAM_ug_strike_fuel|0]§! £fuel_texticon, подполье выросло на §R3§!.\n\n§YПОСЛЕ ОТВЕТА§!\nПодполье: §R+3§!."
 ADISCORD_nam_resource_war.117.t:0 "Взрыв в Светлогорске"
 ADISCORD_nam_resource_war.117.d:0 "Бомба сработала в полдень у здания канцелярии, когда на площади стояла очередь за пропусками. Взрывом вынесло фасад и половину рынка напротив. К вечеру в госпиталях не осталось свободных коек, а по городу разошлись листовки: подполье называло взрыв ответом на облавы и обещало, что следующий прогремит ближе к кабинетам.\n\nГарнизон уже перекрыл выезды из города, жандармы составляют списки подозреваемых по старым донесениям. Округа хоронят своих и ждут, на кого канцелярия возложит вину. Ром понимает: после такого дня молчание прочтут как слабость, а слепую расправу - как признание, что Вебер прав."
 ADISCORD_nam_resource_war.117.a:0 "Комендантский час в столице."
 ADISCORD_nam_resource_war.117.b:0 "Траур и открытое следствие."
 ADISCORD_nam_resource_war.117.c:0 "Скрыть число жертв."
 NAM_ug_117_a_tt:0 "§YУЖЕ ПРОИЗОШЛО§!\nВзрыв уже стоил стабильности: §R-[?NAM_ug_strike_stability|0]%§!.\n\n§YПОСЛЕ ОТВЕТА§!\nПодполье: §G-12§!.\nПоддержка округов: §R-10§! £NAM_support_dist_texticon.\nПоддержка гарнизонов: §G+5§! £NAM_support_garr_texticon."
 NAM_ug_117_b_tt:0 "§YУЖЕ ПРОИЗОШЛО§!\nВзрыв уже стоил стабильности: §R-[?NAM_ug_strike_stability|0]%§!.\n\n§YПОСЛЕ ОТВЕТА§!\nПодполье: §G-6§!.\nПоддержка округов: §G+5§! £NAM_support_dist_texticon."
 NAM_ug_117_c_tt:0 "§YУЖЕ ПРОИЗОШЛО§!\nВзрыв уже стоил стабильности: §R-[?NAM_ug_strike_stability|0]%§!.\n\n§YПОСЛЕ ОТВЕТА§!\nПодполье: §R+5§!.\nПоддержка округов: §R-4§! £NAM_support_dist_texticon."
