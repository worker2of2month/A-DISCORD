 NAM_econ_engineer_practice:0 "Оплатить производственную практику инженеров"
 NAM_econ_engineer_practice_delivered_tt:0 "Бонус §G50%§! к §Y2§! промышленным исследованиям."
 NAM_econ_engineer_practice_result_tt:0 "Через §Y35§! £time_texticon дн.: Бонус §G50%§! к §Y2§! промышленным исследованиям."
 NAM_econ_engineer_practice_refund_tt:0 "§G+200§! £ADISCORD_economy_treasury_texticon."
 NAM_econ_engineer_practice_desc:0 "Цена: §Y40§! £political_power_texticon §Y200§! £ADISCORD_economy_treasury_texticon. Срок: §Y35§! £time_texticon дн. Повтор через §Y180§! £time_texticon дн. после завершения.\n\nИнженеры проведут испытания для двух промышленных исследований. Выбирая время заказа, учитывайте уже доступные исследовательские бонусы.\nБонус §G50%§! к §Y2§! промышленным исследованиям.\n\nПри капитуляции, подчинении или потере условий заказа вся оплата возвращается. Война сама по себе не прерывает работу. Результат получает Светлогорье."
