 KDR_NAM_federal_district_DEF: "Кадирский федеральный округ Светлогорья"
 ADISCORD_nam_resource_war.60.d_exile: "Транспорты вышли из островных гаваней ночью, с погашенными огнями, как когда-то уходили из Южной гавани. Только теперь они идут обратно. Правительство Светлогорья в изгнании объявило войну тем, кто поделил материк, - Эфлору и Ажару.\n\nСоседи сразу сомкнули ряды в общей коалиции. Против нас - две армии, привыкшие считать нашу нефть своей добычей, у нас - острова, флот и морская пехота, которой первой предстоит ступить на причалы. Отступать больше некуда: проиграем - острова разделят вслед за материком. Победим - Эфлор и Ажар ответят перед Светлогорьем за всё. Посредников не будет: эта война кончится, только когда одна из сторон капитулирует."
 ADISCORD_nam_resource_war.60.d_target_exile: "Правительство Светлогорья в изгнании объявило войну Эфлору и Ажару. Его десант уже идёт к Южной гавани, а на островах говорят о мести тем, кто поделил материк. Обе страны объединились во временную оборонительную коалицию.\n\nЕсли Светлогорье капитулирует, его острова будут аннексированы. Если падут оба союзника, их ждёт одна судьба. Перемирия не будет: война идёт до полной капитуляции одной из сторон."
 ADISCORD_nam_resource_war.62.d_won_radical: "Последняя столица коалиции капитулировала. Хунта опор не стала ждать посредников: над управами Эфлора и Ажара поднят флаг Светлогорья, а их правительства распущены. Покорённые земли аннексированы и переданы реквизиционным командам.\n\nКарамышев обещал возвращение - и вернул не только промыслы. Теперь эти земли будут работать на Светлогорье, а не на себя: без новых заводов, без школ, под охраной лагерных вышек. Острова празднуют, но в покорённых городах уже шепчутся о новом подполье, и хунте ещё предстоит удержать то, что она взяла."
 ADISCORD_nam_resource_war.62.d_won_federal: "Последняя столица коалиции капитулировала. Вместо реквизиционных команд в побеждённые города приехали юристы федерального совета: Эфлор и Ажар становятся федеральными округами Светлогорья. Во главе каждой местной администрации встаёт назначенный Светлогорьем наместник. Их ресурсы, заводы и призывники отныне служат общей федерации, как когда-то служили конфедерации Воркерланда.\n\nПравительство называет это объединением, а не завоеванием. Инвесторы называют это крупнейшим рынком юга. Промыслы вернулись домой, но новым округам ещё предстоит поверить, что федерация - не другое имя оккупации."
 ADISCORD_nam_resource_news.8.t: "Конец Светлогорья"
 ADISCORD_nam_resource_news.8.d: "Война Светлогорья окончилась поражением. Войска коалиции заняли островную столицу, и правительство в изгнании капитулировало. [ROOT.GetName] аннексирует острова вместе со всем, что Светлогорье успело вернуть на материке.\n\nТак закончилась история страны, которая когда-то владела большей частью нефти Юга. Её флаги снимают с управ, её флотилии сдают в портах победителей, а её промыслы окончательно делят соседи."
 ADISCORD_nam_resource_news.8.a: "Нефть юга сменила хозяина."
 ADISCORD_nam_resource_news.9.t_radical: "Хунта Светлогорья покоряет юг"
 ADISCORD_nam_resource_news.9.d_radical: "Война возвращения окончилась победой Светлогорья. Эфлор и Ажар капитулировали, и хунта опор аннексировала оба государства. Правительства распущены, склады опечатаны реквизиционными командами, а в покорённых регионах строят трудовые лагеря.\n\nИзгнанники, которых ещё недавно называли пиратами, снова стоят у своих вышек. Соседи юга гадают, остановится ли хунта на этом."
 ADISCORD_nam_resource_news.9.t_federal: "Федерация Светлогорья"
 ADISCORD_nam_resource_news.9.d_federal: "Война возвращения окончилась победой Светлогорья. Эфлор и Ажар капитулировали, но сохранили свои правительства: теперь это федеральные округа Светлогорья. Их ресурсы, заводы и призывники служат общей федерации, а их делегаты заседают в федеральном совете.\n\nОдни видят в этом возрождение старой конфедерации, другие - самую большую сделку в истории юга. Соседи гадают, предложат ли и им место в этом союзе."
 ADISCORD_nam_resource_news.9.a: "Юг меняет хозяина."
 NAM_southern_lands: "Южные земли"
 NAM_southern_lands_desc: "После войн изгнания юг подчиняется Светлогорью. Хунта опор держит покорённые регионы трудовыми лагерями и реквизициями; гуманисты собирают совет федеральных округов, чьи ресурсы, заводы и призывники служат федерации."
 NAM_conquered_state_modifier: "Покорённая земля"
 NAM_conquered_state_modifier_desc: "Хунта не строит для побеждённых ни дорог, ни школ, ни заводов."
 NAM_labour_camp_state: "Трудовой лагерь"
 NAM_labour_camp_state_desc: "Жители региона работают на рудниках и промыслах под охраной."
 NAM_stripped_state: "Ограбленный регион"
 NAM_stripped_state_desc: "Склады пусты, станки вывезены, транспорт угнан."
 NAM_radical_labour_camp: "Трудовой лагерь"
 NAM_radical_labour_camp_desc: "Ограды, бараки и вышки отделяют рудники от окрестных посёлков. Под конвоем хунты жители идут на смену; в комендатуре их имена становятся строками рабочих ведомостей."
 NAM_labour_camp_started_tt: "Начинается строительство лагеря."
 NAM_labour_camp_done_tt: "Если мы по-прежнему владеем областью и контролируем её, ресурсы региона §G+50%§!, призывное население §R-50%§!, стройка останавливается, рост подчинения §R-10%§!, цель сопротивления §R+15%§!."
 NAM_labour_camp_cancel_tt: "Строительство лагеря прервано. Политическая власть не возвращается."
 NAM_radical_strip_state: "Реквизиция региона"
 NAM_radical_strip_state_desc: "Реквизиционные команды вывозят склады, разбирают станки и угоняют транспорт. За последней колонной остаются пустые цеха и люди, которым предстоит жить среди разобранных мастерских."
 NAM_strip_state_tt: "§YПолучаемые ресурсы§!\nКазна: §G+80§! £ADISCORD_economy_treasury_texticon и ещё §G+120§! £ADISCORD_economy_treasury_texticon, если в регионе есть гражданский завод: он будет разобран.\nЕсли в регионе есть военный завод, он будет разобран: §G+1500§! £infantry_equipment_texticon, §G+100§! £support_equipment_texticon и §G+40§! £ADISCORD_artillery_texticon.\nТопливо: §G+1000§! £fuel_texticon.\n\n§YПоследствия для региона§!\nРесурсы региона §R-25%§! и рост подчинения §R-5%§! на §Y365§! £time_texticon.\nДоступно один раз для каждого региона."
 NAM_rad_levy_transport:0 "Реквизировать грузовики перевозчиков"
 NAM_rad_levy_transport_desc:0 "На площади стоят грузовики с чужими гражданскими номерами. Водители молча смотрят на людей у ограды комендатуры. Офицер сверяет фамилии с листом, который держит так, чтобы его не видели остальные."
 NAM_rad_levy_transport_unlock_tt:0 "После применения решения: изымет грузовики для армии, ухудшая дороги завоёванного округа."
 NAM_rad_install_council:0 "Передать округ местному совету"
 NAM_rad_install_council_desc:0 "В комендатуре собрались местные писари и старосты. На столе перед ними лежат ключи от управы. Никто не протягивает руку первым, пока за дверью слышны шаги караула."
 NAM_rad_install_council_unlock_tt:0 "После применения решения: в выбранной завоёванной области совет снимает ограничения режима на стройку и число ячеек, закрывает трудовой лагерь и защищает местные заводы от реквизиций и вывоза в столицу."
 NAM_rad_no_camp_building_tt:0 "В области сейчас не строят трудовой лагерь"
 NAM_federal_council_session: "Сессия федерального совета"
 NAM_federal_council_session_desc: "Делегаты округа разворачивают на столе совета наказ своего собрания. Секретарь спрашивает, кто будет выступать первым. У дверей журналисты ждут хотя бы короткого заявления."
 NAM_federal_council_tt: "Казна: §G+60§! £ADISCORD_economy_treasury_texticon.\nВ федеральном округе: стабильность §G+5%§! £stability_texticon, популярность гуманизма §G+10%§!."
 NAM_drill_currency_loot: "добычи"
 NAM_drill_currency_capital: "капитала"
 # ----- Exile war, consolidation, great war and the corporate districts -----
 NAM_war_of_return_ready_exile: "Правительство в изгнании свергло наместника, независимо и не воюет, Эфлор или Ажар ещё стоят, война возвращения из изгнания не выиграна и не идёт, а Война за Юг не идёт"
 NAM_war_of_return_terms_exile: "Война против §YЭфлора и Ажара§!: обе страны воюют в одной временной коалиции, а морская пехота высаживается в Южной Гавани.\nКапитуляция обоих вернёт промыслы и гавань, а побеждённых ждёт курс правительства: под хунтой опор - аннексия и выжимание, под гуманистами - федеральные округа Светлогорья.\nНаша капитуляция - аннексия Светлогорья вместе с островами.\nСрока у войны нет: она идёт до полной капитуляции одной из сторон."
 NAM_exile_found_new_capital_tt: "Столица изгнания основана заново: остров получает имя §YНео-Светлогорье§!, а его главный город - §YНео-Светлогорск§!. Новые имена останутся и после возвращения на материк."
 NAM_neo_svetlogorsk: "Нео-Светлогорск"
 NAM_neo_svetlogorye: "Нео-Светлогорье"
 ADISCORD_nam_resource_news.9.d_great_radical: "Великая война Светлогорья окончилась победой. Последние государства юга капитулировали, и хунта опор аннексировала их всех. Правительства распущены, склады опечатаны, а в покорённых регионах строят новые трудовые лагеря.\n\nИзгнанники, которых когда-то называли пиратами, теперь правят всем югом от промыслов до пустыни. Их власть держится на гарнизонах, и весь мир знает, чем она платит за свою нефть."
 ADISCORD_nam_resource_news.9.d_great_federal: "Великая война Светлогорья окончилась победой. Последние государства юга капитулировали, но сохранили свои правительства: теперь и они федеральные округа Светлогорья. Их ресурсы, заводы и призывники служат общей федерации, а делегаты всего юга заседают в одном совете.\n\nНикогда ещё юг не был так един и никогда так не зависел от одной столицы. Деньги иностранных инвесторов уже текут в порты новых округов."
 NAM_great_war_consolidated_tt: "Власть на вернувшемся юге укреплена: консолидация не ниже §Y70§! (сейчас §Y[?NAM_consolidation|0]§!)"
 NAM_great_war_targets_tt: "Есть независимая страна, готовая возглавить вражескую коалицию: Рахма, Сардан, Кадир, Эфлор или Ажар"
 NAM_great_war_terms_tt: "Великая война против всех, кто ещё стоит на юге: §YРахмы, Сардана и Кадира§!, а также Эфлора и Ажара, если они ещё независимы. Спящие соседи пробуждаются, все цели воюют в одной временной коалиции.\n\n§YИСХОДЫ§!\nКапитуляция всех участников - курс правительства для каждого: под хунтой опор - аннексия и выжимание, под гуманистами - федеральные округа Светлогорья.\nНаша капитуляция - аннексия Светлогорья.\n\nСрока у войны нет: она идёт до полной капитуляции одной из сторон."
 ADISCORD_nam_resource_war.105.t: "Великая война"
 ADISCORD_nam_resource_war.105.d: "Укрепив власть над вернувшимися землями, Светлогорье больше не довольствуется промыслами. Наши колонны выходят к границам Рахмы, Сардана и Кадира - государств, которые все годы изгнания торговали нашей нефтью и делили наш юг на сферы влияния.\n\nСоседи понимают, что речь идёт уже не о возвращении, а о том, кому будет принадлежать весь юг. Они собирают последнюю коалицию. Если она выстоит, Светлогорье потеряет всё, чего добилось. Если падёт, юг заговорит одним голосом - тем, который выберет наше правительство."
 ADISCORD_nam_resource_war.105.d_target: "Светлогорье, вернувшее свои промыслы, объявило великую войну всему, что ещё стоит на юге. Его армия, закалённая в войне возвращения, идёт на наши границы, а наши соседи объединяются во временную оборонительную коалицию.\n\nЕсли Светлогорье капитулирует, оно будет аннексировано. Если падут все участники коалиции, каждого ждёт одна судьба. Перемирия не будет: война идёт до полной капитуляции одной из сторон."
 ADISCORD_nam_resource_war.105.a: "Весь юг - или ничего."
 ADISCORD_nam_resource_war.105.b: "Мы будем защищать свою землю."
 ADISCORD_nam_resource_war.107.t: "Итог великой войны"
 ADISCORD_nam_resource_war.107.d_won_radical: "Последняя столица коалиции капитулировала. Хунта опор аннексировала весь юг: правительства распущены, склады опечатаны, а реквизиционные команды уже переписывают каждую шахту и каждый завод.\n\nНикогда ещё Светлогорье не было таким большим и таким ненавидимым. Карамышев обещал возвращение - и привёл острова к власти над пустыней и морем. Теперь эту власть придётся держать штыками."
 ADISCORD_nam_resource_war.107.d_won_federal: "Последняя столица коалиции капитулировала. Побеждённые сохраняют свои правительства, но становятся федеральными округами Светлогорья, и делегаты всего юга впервые садятся за один стол федерального совета.\n\nЮг объединён - не завоёван, как говорит правительство, а связан договорами, кредитами и общим рынком. Остаётся доказать, что эта федерация переживёт тех, кто её подписал."
 ADISCORD_nam_resource_war.107.a: "Так тому и быть."
 NAM_consolidation: "Укрепление власти"
 NAM_consolidation_desc: "Консолидация: §Y[?NAM_consolidation|0]§! / 100, изменение за месяц §Y[?NAM_consolidation_growth|0]§!.\n\nКаждый месяц власть на вернувшемся юге крепнет на §Y2§!; при стабильности ниже §Y40%§! - на §Y2§! меньше. Хунта держит покорённые регионы гарнизонами: их содержание стоит §Y3§! £ADISCORD_economy_treasury_texticon в месяц за каждый удерживаемый округ под прямым управлением, где размещена наша дивизия, пока консолидация не достигнет §Y100§!. Гуманисты укрепляют федерацию договорами и восстановлением. Пока консолидация ниже §Y70§!, регионы могут восстать или выйти на улицы."
 NAM_consolidation_dynamic: "Власть на вернувшемся юге"
 NAM_consolidation_dynamic_desc: "Чем крепче власть над вернувшимися регионами, тем спокойнее страна и тем быстрее новые земли подчиняются."
 NAM_rad_garrison_order: "Приказ о гарнизонах"
 NAM_rad_garrison_order_desc: "Патрули на дорогах, комендатуры в каждом городе, пропуска для каждого рабочего. В покорённых регионах день начинается с проверки документов, а ночь - с окрика часового."
 NAM_rad_garrison_order_tt: "Приказ действует §Y90§! £time_texticon дней.\nВ месяц, когда есть гарнизон под прямым управлением, консолидация растёт на §G3§!, содержание стоит §R20§! £ADISCORD_economy_treasury_texticon.\nПри гарнизонном правлении после потери округов учитывается столичный полк."
 NAM_rad_garrison_order_end_tt: "Усиленные гарнизоны возвращаются в казармы."
 NAM_rad_terror_campaign: "Кампания устрашения"
 NAM_rad_terror_campaign_desc: "У комендатуры выставляют списки заложников и часы, после которых улицы должны опустеть. На площади сколачивают помост для показательного суда. Жители читают объявления молча и расходятся по домам."
 NAM_rad_terror_tt: "Консолидация: §G+8§!."
 NAM_hum_federal_treaty: "Федеральный договор"
 NAM_hum_federal_treaty_desc: "Федеральный совет подписывает с округом договор: его права, его доля в федерации и обязательства столицы записаны на бумаге."
 NAM_hum_federal_treaty_tt: "Консолидация: §G+6§!.\nВ федеральном округе: стабильность §G+5%§! £stability_texticon, популярность гуманизма §G+5%§!."
 NAM_hum_federal_seat_ready_tt:0 "Округ подчиняется Светлогорью, держит столицу и может принять делегацию."
 NAM_hum_treaty_muster_tt:0 "Договор закрепит согласие округа на общий призыв по Хартии округов при следующем объявлении великой войны."
 NAM_hum_treaty_signed_tt:0 "Этот округ уже подписал договор об участии в общем призыве."
 NAM_hum_reconstruction_fund: "Фонд восстановления"
 NAM_hum_reconstruction_fund_desc: "Мосты, водопроводы, школы - делегации округов приносят в фонд списки разрушенного войной. За каждой строкой стоят люди, которым надо добраться до работы, принести домой воду и отправить детей учиться."
 NAM_cost_hum_reconstruction: "§Y60§! капитала"
 NAM_cost_hum_reconstruction_blocked: "§R60§! капитала"
 NAM_cost_hum_reconstruction_tooltip: "§Y60§! капитала\nКапитал вернётся, если работа будет прервана."
 NAM_hum_reconstruction_started_tt: "Иностранный капитал: §R-60§!; вернётся, если работа прервётся."
 NAM_hum_reconstruction_done_tt: "Консолидация: §G+10§!."
 NAM_hum_reconstruction_refund_tt: "Работа прервана: §G60§! капитала возвращаются."
 ADISCORD_nam_resource_war.104.t: "Неспокойный юг"
 ADISCORD_nam_resource_war.104.d_radical: "Ночью в регионе [NAM_cons_place.GetName] взорвали мост, по которому реквизиционные команды вывозили зерно и руду. К утру на стенах комендатуры появились надписи на местном наречии, а в деревнях никто не видел, никто не слышал и никто не знает, где прячутся люди с винтовками.\n\nКомендант просит подкреплений и права брать заложников. Казначей предлагает другой путь: старейшины готовы назвать имена за деньги. Можно и ничего не делать - но тогда завтра взорвут следующий мост."
 ADISCORD_nam_resource_war.104.d_federal: "В столице округа [NAM_cons_district.GetName] вышли на улицы: забастовка докеров переросла в шествие к зданию федерального представительства. Люди требуют, чтобы федерация платила за то, что берёт, - за руду, за призывников, за налоги, уходящие в далёкую столицу.\n\nФедеральный совет может отправить посредников и выслушать требования. Инвесторы готовы оплатить быстрый пакет помощи. Можно и переждать, но тогда недовольство станет привычкой."
 ADISCORD_nam_resource_war.104.a: "Карательный гарнизон."
 ADISCORD_nam_resource_war.104.b: "Заплатить старейшинам."
 ADISCORD_nam_resource_war.104.c: "Не обращать внимания."
 ADISCORD_nam_resource_war.104.e: "Отправить федеральных посредников."
 ADISCORD_nam_resource_war.104.f: "Пакет помощи от инвесторов."
 ADISCORD_nam_resource_war.104.g: "Пусть протестуют."
 NAM_cons_104_a_tt: "Консолидация: §G+4§!."
 NAM_cons_104_b_tt: "Казна: §R-100§! £ADISCORD_economy_treasury_texticon.\nКонсолидация: §G+2§!."
 NAM_cons_104_c_tt: "Консолидация: §R-6§!."
 NAM_cons_104_e_tt: "Консолидация: §G+3§!.\nСтабильность округа: §G+3%§! £stability_texticon."
 NAM_cons_104_f_tt: "Иностранный капитал: §R-40§!.\nКонсолидация: §G+4§!."
 NAM_cons_104_g_tt: "Консолидация: §R-5§!."
