 NAM_bw_ladder_full_tt:0 "Лестница печатей: §Y[NAMBasinLadder]§!\nШкала и курсы - в разделе \"Опоры Светлогорья\".\n\nВертикаль наместников против округов.\nПеревес любой стороны даёт свои бонусы и штрафы, а равновесие - небольшую прибавку к стабильности и политической власти.\nТочное положение шкалы показано в разделе опор Светлогорья."
 NAM_bw_overview_help:0 "Нажмите на номер района: состояние и действия появятся под картой. Наведение показывает полную сводку. Выбор района не запускает работы и не списывает ресурсы.\n\n§YПРОЕКТЫ НА ПРОМЫСЛАХ§!\nВ работе: §Y[?NAM_projects_in_progress|0] / [NAMProjectSlots]§! £under_construction_texticon\nФокусы открывают программы; оплаченные заказы дают поставки и работающие учреждения.\n\n§YЭКСПОРТ И ПОДГОТОВКА§!\nМощность поставок, покупатели и островные договоры - в экспортной сводке под картой.\nРост угрозы войны - в разделе Подготовка к ресурсной войне; подготовленные формирования - в разделе \"Мобилизация Светлогорья\".\n\n§YИСХОД РЕСУРСНОЙ ВОЙНЫ§!\nДипломатический предел: §Y420§! £time_texticon дней.\n- От §Y100§! очков нефти - независимость. Захваченный пограничный округ противника даёт признание с новой границей; без него сохраняется прежняя граница.\n- §Y36-99§! - компромиссный мир.\n- Ниже §R36§! - раздел страны.\nКапитуляция противников завершает войну раньше."
