 NAM_restitution_desk_tt:0 "Давление реституции: §G-5§!."
 NAM_court_azhar_tt:0 "Давление реституции: §G-4§!. Покупаем единственную отсрочку Ажара: §Y75§! £time_texticon дн. без нападения коалиции после оплаты; резервный срок нападения также отодвигается на §Y75§! £time_texticon дн. Ранний договор и экстренная покупка через ультиматум используют одну отсрочку. После её окончания высокое давление вновь может ускорить войну. Собственный первый удар отменяет защиту."
