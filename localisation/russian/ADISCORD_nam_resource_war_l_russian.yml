 NAM_amount_treasury_250_blocked: "§R250§!"
 NAM_national_programmes: "Светлогорье: решения за подписью правительства"
 NAM_national_programmes_desc: "Состояние договора Светлогорска: [NAMGetCompactStatus].\n\nФокусы определяют устройство государства; оплачиваемые программы превращают полномочия в поставки и работающие учреждения. Ресурсная война начинается по внешнему расписанию. Во время неё нужно удержать Северные месторождения до завершения §Y420 дней§! либо добиться капитуляции Эфлора и Ажара."
 NAM_compact_ready: "§Gработает не менее 60 дней§!"
 NAM_compact_maturing: "§Yподписан, необходимы 60 непрерывных дней работы§!"
 NAM_compact_absent: "не заключён"
 NAM_receive_250_tt: "Казна: §G+250§! £ADISCORD_economy_treasury_texticon."
 NAM_compact_paid_tt: "Начинаются §Y60 дней§! непрерывной работы договора Светлогорска; его зрелость проверяется при начале войны."
 NAM_compact_signable_tt: "Светлогорск принадлежит нам и контролируется нами; договор ещё не подписан, ресурсная война ещё не началась и не завершилась."
 NAM_current_war_tt: "Идёт ресурсная война с Эфлором и Ажаром."
 NAM_victory_tt: "Ресурсная война завершена признанием независимости Светлогорья."
 NAM_war_objective_tt: "Победа: капитуляция Эфлора и Ажара либо контроль Северных месторождений на §Y420-й день§! войны. Таймер показан в национальных решениях."
 NAM_defend_fields: "Удержать Северные месторождения"
 NAM_defend_fields_desc: "Срок дипломатического предела войны: §Y420 дней§! от её начала. При истечении срока контроль Северных месторождений приносит Светлогорью признанную независимость; потеря региона ведёт к разделу страны. Капитуляция обоих противников завершает войну раньше."
 ADISCORD_nam_resource_war.10.t: "Стол, за которым остались мы"
 ADISCORD_nam_resource_war.10.d: "Егор Ром попросил снять со стены схему подчинения. На ней каждая здешняя управа была связана линией с другой, та - с третьей, и все линии уходили к Воркерланду. На столе схема оказалась слишком большой: пришлось подогнуть самый верх.\n\nКирилл Выкуп положил поверх неё ведомость жалованья. На промыслах люди уже спрашивали, кому теперь принадлежит их заработок, а в Светлогорске собирали подписи против поборов. Наместники предлагали сперва восстановить дисциплину. Представители округов хотели увидеть счета. Ром оставил обе папки перед собой.\n\nПервое решение, однако, требовало не нового устройства власти, а денег. Старую задолженность можно погасить сейчас или перенести на следующий квартал. Ни один вариант не избавит правительство от необходимости выбрать, на чём впредь будет держаться страна."
 ADISCORD_nam_resource_war.10.a: "Рассчитаться с людьми сейчас."
 ADISCORD_nam_resource_war.10.b: "Сохранить деньги до следующего квартала."
 ADISCORD_nam_resource_war.close: "Этот вопрос уже принадлежит прошлому."
 NAM_spend_250_tt: "Казна: §R-250§! £ADISCORD_economy_treasury_texticon."
 ADISCORD_nam_resource_war.11.t: "Карта вместо ведомости"
 ADISCORD_nam_resource_war.11.d: "В приёмной Рома больше не спорят о том, кому принадлежит формулировка ультиматума. Дежурный офицер раскладывает карту дорог к Северным месторождениям. Если армия потеряет этот узел, останутся порты и архивы, но исчезнет предмет, ради которого страна пытается сохранить независимость.\n\nШтаб рассчитывает удерживать бассейн до дипломатического предела войны - 420 дней с её начала. Капитуляция Эфлора и Ажара может заставить их признать Светлогорье раньше. В национальных решениях появился отсчёт.\n\nСветлогорск остаётся отдельным вопросом. Оплаченный договор, успевший проработать 60 дней до нападения, удерживает город от восстания. Незрелое соглашение или одни обещания такой гарантии не дают. Военные распоряжения уже можно принимать через чрезвычайную ветку фокусов, независимо от мирных планов."
 ADISCORD_nam_resource_war.11.a: "За этой картой живут наши люди."
 ADISCORD_nam_resource_war.12.t: "Мир не отменяет вопроса"
 ADISCORD_nam_resource_war.12.d: "Печати на договоре высохли. Эфлор и Ажар признали независимость Светлогорья, но не перестали быть соседями и не распустили свой союз. Военные склады всё ещё требуют пополнения, а в городах ждут не очередного парада, а ремонта.\n\nЗа столом снова лежат две папки. Одна предлагает превратить служебную вертикаль в постоянное государство; другая - закрепить права округов хартией. Выбранный до войны курс теперь придётся довести до закона. Если правительство всё время откладывало этот выбор, мир больше не даёт ему повода уклоняться.\n\nЕгор Ром впервые подписывает документ, в котором нет строки для вышестоящей инстанции."
 ADISCORD_nam_resource_war.12.a: "Теперь отвечать придётся самим."
 ADISCORD_nam_resource_war.13.t: "Исходящий номер: Светлогорье"
 ADISCORD_nam_resource_war.13.d: "В архиве нашли старый бланк: герб чужой столицы, место для подписи наместника и длинная графа согласований. Молодой сотрудник спросил, можно ли использовать чистую обратную сторону. Архивист разрешил.\n\nНа новых бланках пишут о работе института, расходах округов, заводских заказах и возвращении людей домой. Споры никуда не исчезли. Одни считают аппарат слишком сильным, другие боятся, что его недостаточно. На границе по-прежнему стоят войска. Но теперь эти споры имеют адресата здесь, а не за пределами страны.\n\nЕгор Ром задержался у окна и посмотрел на очередь у гражданской канцелярии. Государство оказалось не последней печатью на бумаге, а обязанностью открыть дверь на следующий день."
 ADISCORD_nam_resource_war.13.a: "Завтра канцелярия откроется."
 NAM_compact_war_closed: "ресурсная война завершена"
 NAM_compact_ratified_status: "§Gдоговор принят к началу войны; восстание предотвращено§!"
 NAM_compact_wartime_unavailable: "§Yвоенная гарантия договора не действует§!"
 ADISCORD_nam_resource_war.10.before: "Из столицы по-прежнему приходят распоряжения. Одно требует ускорить вывоз нефти, другое запрещает расходовать резерв, третье возвращает неподписанную смету. Егор Ром попросил снять со стены схему подчинения и разложить её на столе. Линий оказалось больше, чем свободного места.\n\nКирилл Выкуп положил рядом ведомость жалованья. Рабочие промыслов спрашивали, почему снова задержана выплата, а в Светлогорске собирали подписи против поборов. Наместники предлагали восстановить дисциплину. Представители округов хотели увидеть счета. Воркерланд ещё существует, но его власть уже не снимает с местного правительства этих вопросов.\n\nПервое решение требует денег: старую задолженность можно погасить сейчас или перенести на следующий квартал. Обе политические папки останутся на столе. Если связь со столицей оборвётся окончательно, Светлогорье должно встретить этот день с работающими учреждениями."
 NAM_compact_interrupted_status: "§Yместная служба прервана; восстание уже предотвращено§!"
 NAM_south_final_ready_tt: "Кризис Юга открыт, Шахрабад не ведёт ограниченной войны с Мазаром, Кейзаном или Вейром, и война за Юг ещё не начата"
 NAM_south_seal_over_furnaces: "Печать над печами"
 NAM_south_seal_over_furnaces_desc: "Наместническая лестница требует от печей того же, что и от каждого округа: отчёта, печати и права остановить решение. Если Шахрабад откажется, чрезвычайные писания поднимут округа."
 NAM_south_seal_over_furnaces_tt: "Начинается §Yвойна за Юг§!. Каждое независимое государство пустынь выберет сторону. При победе Шахрабад и его союзники станут §Yнаместничествами Светлогорья§!."
 NAM_south_oil_charter: "Хартия против картеля"
 NAM_south_oil_charter_desc: "Нефтяная хартия обещает соседям топливо и самоуправление. Печи Шахрабада предлагают выкуп, долг и монополию. На Юге может остаться только один договор."
 NAM_south_oil_charter_tt: "Начинается §Yвойна за Юг§!. Каждое независимое государство пустынь выберет сторону. При победе Шахрабад и его союзники сохранят администрации и войдут в §YНефтяную хартию§!."
 NAM_south_black_basin: "Чёрный бассейн"
 NAM_south_black_basin_desc: "Ажар потерял войну, но сохранил свои склады и гарнизоны. Наместническая лестница требует, чтобы Чёрный бассейн получил наместника Светлогорья."
 NAM_south_black_basin_tt: "§YАжар§! получает требование стать наместничеством Светлогорья. Если он откажется, мы объявим ему войну за полное присоединение."
 NAM_south_desert_offices: "Наместничества пустыни"
 NAM_south_desert_offices_desc: "Каждая новая печать удлиняет лестницу, но делает её прочнее. Кадир и Эфлор получают одно и то же требование: принять наместника или ответить армии."
 NAM_south_desert_offices_tt: "§YКадир§! и §YЭфлор§! получают требование стать наместничествами Светлогорья. Если страна откажется, мы объявим ей войну за полное присоединение."
 NAM_south_oil_for_water: "Нефть за воду"
 NAM_south_oil_for_water_desc: "У Светлогорья есть топливо, у пустынь есть вода и дороги. Нефтяная хартия предлагает Фенну, Рахме, Сардану и даже Ажару общий договор вместо вечного торга."
 NAM_south_oil_for_water_tt: "§YФенн§!, §YРахма§!, §YСардан§! и §YАжар§! получают приглашение вступить в союз Светлогорья. Отказ не ведёт к войне."
 NAM_south_fenn_guarantee: "Гарантия Фенна"
 NAM_south_fenn_guarantee_desc: "Эфлор по-прежнему считает Фенн мятежной провинцией. Хартия требует от Эфлора войти в договор на общих условиях и оставить Фенн в покое."
 NAM_south_fenn_guarantee_tt: "§YЭфлор§! получает требование войти в Нефтяную хартию как сателлит. Если он откажется, мы объявим ему войну за полное присоединение."
 NAM_administration_dynamic: "Канцелярия Светлогорья"
 NAM_administration_dynamic_desc: "Наместническая лестница превратилась в правительство. Каждая реформа меняет одну и ту же канцелярию: её подписи, сметы, промыслы и отношения с округами."
 NAM_garrison_dynamic: "Гарнизоны Светлогорья"
 NAM_garrison_dynamic_desc: "Охрана промыслов, колонны перекрёстков и морской конвой складываются в единую военную традицию Светлогорья."
 NAM_seal_registry: "Реестр печатей"
 NAM_seal_registry_desc: "Каждая печать получает номер, каждый наместник - срок отчёта. Лестница, которую строила империя, теперь служит Светлогорью и считает его деньги."
 NAM_namestnik_garrisons: "Гарнизоны наместников"
 NAM_namestnik_garrisons_desc: "Наместник отвечает за порядок своего округа и получает постоянный гарнизон. Солдаты знают местность, а округ знает, кому подчиняется."
 NAM_oil_quotas: "Нефтяные квоты"
 NAM_oil_quotas_desc: "Промыслы работают по государственным квотам. Резерв топлива становится инструментом политики, а не товаром для случайного покупателя."
 NAM_ladder_of_seals: "Лестница печатей"
 NAM_ladder_of_seals_desc: "Лестница достроена: каждая ступень знает своё место, каждый приказ - свой путь. Теперь её можно продолжить за пределы Светлогорья."
 NAM_district_council: "Совет районов"
 NAM_district_council_desc: "Районы получают постоянный совет, который утверждает бюджет и проверяет министерства. Медленнее, но решения принимают те, кто будет их исполнять."
 NAM_oil_fund: "Нефтяной фонд"
 NAM_oil_fund_desc: "Часть нефтяной выручки уходит в общий фонд хартии. Из него оплачиваются поставки соседям, которые готовы связать со Светлогорьем своё будущее."
 NAM_district_militia: "Ополчение районов"
 NAM_district_militia_desc: "Каждый район держит собственное ополчение. Оно не заменит армию, но не отдаст свои промыслы без боя."
 NAM_common_fuel_market: "Общий рынок топлива"
 NAM_common_fuel_market_desc: "Хартия устанавливает единые правила продажи топлива. Соседи покупают по договору, а не по милости наместника."
 NAM_south_war_council: "Военный совет Юга"
 NAM_south_war_council_desc: "Война за Юг требует одного штаба. Совет собирает командиров округов, нефтяников и союзников за одним столом."
 NAM_south_oil_tap: "Нефтяной кран"
 NAM_south_oil_tap_desc: "Печи Шахрабада горят на чужом топливе. Перекрыть его - значит остановить их заводы раньше, чем армии."
 NAM_south_field_fortresses: "Крепости промыслов"
 NAM_south_field_fortresses_desc: "Северные месторождения и Светлогорский округ превращаются в укреплённые районы. Каждая вышка должна стоить противнику дивизии."
 NAM_south_counteroffensive: "Контрнаступление на печи"
 NAM_south_counteroffensive_desc: "Оборона выиграла время. Теперь армия Светлогорья идёт к печам, пока Шахрабад не восстановил силы."
 NAM_south_heritage: "Наследство Юга"
 NAM_south_heritage_desc: "Юг принадлежит Светлогорью. Сателлиты, наместничества и члены хартии могут войти в его состав, если канцелярия готова управлять ими напрямую."
 NAM_south_war_council_idea: "Военный совет Юга"
 NAM_south_war_council_idea_desc: "Единый штаб координирует округа и союзников до конца войны за Юг."
 NAM_south_counteroffensive_idea: "Контрнаступление на печи"
 NAM_south_counteroffensive_idea_desc: "Армия Светлогорья наступает, пока у противника не кончилось топливо."
 NAM_district_audit: "Ревизия округов"
 NAM_district_audit_desc: "Ревизоры поднимаются по лестнице печатей и возвращают в казну то, что задержали округа."
 NAM_charter_fuel_aid: "Топливо хартии"
 NAM_charter_fuel_aid_desc: "Нефтяной фонд отправляет топливо союзникам Светлогорья на Юге."
 NAM_south_cut_fuel: "Перекрыть топливо"
 NAM_south_cut_fuel_desc: "Караваны и трубопроводы, ведущие к печам Шахрабада, получают приказ остановиться."
 NAM_charter_members_tt: "Хотя бы одно государство Юга состоит в союзе Светлогорья"
 NAM_charter_fuel_aid_tt: "Каждый член союза Светлогорья на Юге получает §Y2500§! топлива и §G+3%§! стабильности."
 NAM_public_campaigns: "Голос Светлогорья"
 NAM_public_campaigns_desc: "Ведомственные газеты, радио промыслов и собрания округов объясняют, зачем Светлогорью единая власть. Одновременно идёт столько кампаний, сколько открыто мест.\n\nСвободных мест для кампаний: §Y[?ADISCORD_available_campaign_slots|0]§!"
 NAM_campaign_slot_available_tt: "Есть свободное место для кампании: §Y[?ADISCORD_available_campaign_slots|0]§!"
 NAM_campaign_second_slot_tt: "Открывается второе место для кампаний §YГолоса Светлогорья§!."
 NAM_campaign_oil_is_ours: "«Нефть принадлежит Светлогорью»"
 NAM_campaign_oil_is_ours_desc: "Плакаты на промыслах напоминают, что соседи называют эту землю своей. Каждая вышка - граница, которую придётся защищать."
 NAM_campaign_every_seal_counts: "«Каждая печать на счету»"
 NAM_campaign_every_seal_counts_desc: "Канцелярия публикует отчёты округов и обещает, что ни одна подпись не пропадёт бесследно. Порядок становится заметным."
 NAM_campaign_wages_on_time: "«Жалованье вовремя»"
 NAM_campaign_wages_on_time_desc: "Газеты печатают графики выплат, а инспекторы следят, чтобы обещания совпали с ведомостями. Люди меньше тратят на запас."
 NAM_campaign_ladder_holds: "«Лестница держит»"
 NAM_campaign_ladder_holds_desc: "Наместники объясняют, что вертикаль защищает каждого от хаоса распада. Подписи проходят быстрее, сборы - полнее."
 NAM_campaign_charter_of_districts: "«Хартия районов»"
 NAM_campaign_charter_of_districts_desc: "Районы рассказывают о школах, мостах и мастерских, построенных по общей хартии. Люди охотнее берутся за общие работы."
 NAM_campaign_furnaces_threaten_the_desert: "«Печи грозят пустыне»"
 NAM_campaign_furnaces_threaten_the_desert_desc: "Канцелярия показывает Шахрабад жадным картелем, который хочет сжечь чужую нефть в своих печах. Юг должен выбрать, кому верить."
 NAM_supports: "Опоры Светлогорья"
 NAM_supports_desc: "Лояльность опор: §Y[?NAM_loyalty|0]§! / 100\n\nНаместники: §Y[?NAM_grp_nam_support|0]§! (вес §Y[?NAM_grp_nam_influence|0]§!)\nНефтяники: §Y[?NAM_grp_oil_support|0]§! (вес §Y[?NAM_grp_oil_influence|0]§!)\nОкруга: §Y[?NAM_grp_dist_support|0]§! (вес §Y[?NAM_grp_dist_influence|0]§!)\nГарнизоны: §Y[?NAM_grp_garr_support|0]§! (вес §Y[?NAM_grp_garr_influence|0]§!)\nЭкспортные конторы: §Y[?NAM_grp_trade_support|0]§! (вес §Y[?NAM_grp_trade_influence|0]§!)\n\nЛояльность выше 50 повышает политическую власть и стабильность, ниже 50 - снижает. Группа с поддержкой 70 и выше даёт бонус, 25 и ниже - штраф. Раз в месяц поддержка каждой группы сдвигается на 1 к 50. При 20 группа поднимает ропот, при 85 - выдвигает требование."
 NAM_loyalty_dynamic: "Опоры Светлогорья"
 NAM_loyalty_dynamic_desc: "Власть Светлогорья держится на пяти группах. Их поддержка, умноженная на вес во власти, определяет лояльность государства."
 NAM_programme_push: "Ускорить программу"
 NAM_programme_push_desc: "Канцелярия выделяет людей и деньги, чтобы программа успела к сроку."
 NAM_programme_push_tt: "Прогресс программы: §G+15§!. Сейчас: §Y[?NAM_prog_progress|0]§! / 100."
 NAM_programme_start_tt: "Начинается §Yпослевоенная программа§!. Через §Y240§! дней её прогресс будет подведён: при §Y100§! покровительствующая группа и государство получат награду, иначе группа будет разочарована."
 NAM_programme_progress_20_tt: "Прогресс программы: §G+20§!."
 NAM_programme_finished_tt: "Срок послевоенной программы истёк"
 NAM_programme_success_tt: "Покровительствующая группа: §G+10§!, остальные: §G+3§!. Канцелярия Светлогорья: §G+3%§! стабильности и §G+0.05§! политической власти в день."
 NAM_programme_failure_tt: "Покровительствующая группа: §R-15§!. Стабильность: §R-3%§!."
 NAM_supports_council: "Совет опор"
 NAM_supports_council_desc: "Наместники, нефтяники, округа, гарнизоны и экспортные конторы садятся за один стол. Светлогорье держится не на одной печати, а на равновесии тех, кто её признаёт."
 NAM_supports_oil_compact: "Договор с промыслами"
 NAM_supports_oil_compact_desc: "Нефтяники получают гарантии найма и часть выручки. Конторы недовольны, но промыслы работают без перебоев."
 NAM_supports_export_houses: "Экспортные дома"
 NAM_supports_export_houses_desc: "Конторы получают право вывозить нефть по долгосрочным договорам. Казна пополняется, а промыслы чувствуют себя проданными."
 NAM_supports_officer_corps: "Офицерский корпус"
 NAM_supports_officer_corps_desc: "Командиры гарнизонов получают собственное собрание и право голоса в бюджете обороны."
 NAM_supports_district_voice: "Голос округов"
 NAM_supports_district_voice_desc: "Округа получают постоянное представительство при канцелярии. Наместники теряют часть привычной власти."
 NAM_supports_balance: "Равновесие опор"
 NAM_supports_balance_desc: "Ни одна группа не должна стать сильнее государства. Канцелярия учится уступать понемногу каждой."
 NAM_ladder_programme: "Программа лестницы"
 NAM_ladder_programme_desc: "Наместники получают поручение перестроить управление послевоенного Светлогорья. У программы есть срок: через 240 дней канцелярия отчитается о результате."
 NAM_ladder_inspectorate: "Инспекция печатей"
 NAM_ladder_inspectorate_desc: "Ревизоры проверяют каждую ступень лестницы. Медленнее, но честнее."
 NAM_ladder_patronage: "Кормления наместников"
 NAM_ladder_patronage_desc: "Наместники получают право собирать сборы в своих округах. Казна полнеет быстро, а округа - беднеют."
 NAM_ladder_audit_courts: "Ревизионные суды"
 NAM_ladder_audit_courts_desc: "Округа получают право обжаловать решения наместника в суде."
 NAM_ladder_tax_farms: "Откупа"
 NAM_ladder_tax_farms_desc: "Сбор пошлин отдаётся конторам на откуп. Деньги приходят сразу, а промыслы платят дважды."
 NAM_ladder_unified_code: "Единый устав"
 NAM_ladder_unified_code_desc: "Все ступени лестницы получают один устав. Каждый знает, чьей подписи ждать и за что отвечать."
 NAM_ladder_commission: "Комиссия наместников"
 NAM_ladder_commission_desc: "Комиссия подводит промежуточный итог программы и готовит выбор окончательного курса."
 NAM_ladder_course_iron: "Железная лестница"
 NAM_ladder_course_iron_desc: "Порядок держится на силе: наместники и гарнизоны получают первое слово."
 NAM_ladder_course_service: "Служба вместо печати"
 NAM_ladder_course_service_desc: "Печать уступает место службе: должность даётся за работу, а не за верность лестнице."
 NAM_ladder_ending_iron: "Светлогорье печатей"
 NAM_ladder_ending_iron_desc: "Лестница становится государством. Наместники получают больше власти, чем когда-либо при империи."
 NAM_ladder_ending_service: "Республика службы"
 NAM_ladder_ending_service_desc: "Лестница превращается в гражданскую службу. Округа и промыслы получают больше веса в управлении."
 NAM_charter_programme: "Программа хартии"
 NAM_charter_programme_desc: "Округа получают поручение превратить хартию в работающее государство. У программы есть срок: через 240 дней совет отчитается о результате."
 NAM_charter_assemblies: "Окружные собрания"
 NAM_charter_assemblies_desc: "Каждый округ избирает собрание, которое утверждает местный бюджет."
 NAM_charter_oil_partnership: "Нефтяное товарищество"
 NAM_charter_oil_partnership_desc: "Промыслы становятся товариществом работников и государства. Нефть идёт туда, где нужна хартии."
 NAM_charter_local_budgets: "Местные бюджеты"
 NAM_charter_local_budgets_desc: "Округа сами распределяют часть налогов. Стройки идут быстрее, а канцелярия тратит меньше."
 NAM_charter_well_cooperatives: "Артели промыслов"
 NAM_charter_well_cooperatives_desc: "Артели берут на себя скважины и мастерские. Производство растёт, гарнизоны ворчат о потерянной охране."
 NAM_charter_common_code: "Общий кодекс районов"
 NAM_charter_common_code_desc: "Районы принимают общий кодекс, равный для каждого члена хартии."
 NAM_charter_commission: "Хартийная комиссия"
 NAM_charter_commission_desc: "Комиссия подводит промежуточный итог программы и готовит выбор окончательного курса."
 NAM_charter_course_federation: "Федерация районов"
 NAM_charter_course_federation_desc: "Хартия становится федерацией: каждый район сохраняет своё право и свою ответственность."
 NAM_charter_course_oil_union: "Нефтяной союз"
 NAM_charter_course_oil_union_desc: "Хартия становится союзом промыслов: нефть объединяет районы прочнее любых законов."
 NAM_charter_ending_federation: "Федеративное Светлогорье"
 NAM_charter_ending_federation_desc: "Округа получают решающий голос в государстве. Наместническая лестница остаётся в прошлом."
 NAM_charter_ending_oil_union: "Союз нефтяных районов"
 NAM_charter_ending_oil_union_desc: "Промыслы становятся сердцем государства. Нефтяники получают вес, которого не имели никогда."
 NAM_grp_vertical_tt: "Поддержка групп:\n  Наместники: §G+15§!\n  Округа: §R-10§!"
 NAM_grp_districts_tt: "Поддержка групп:\n  Округа: §G+15§!\n  Наместники: §R-10§!"
 NAM_grp_inspectors_tt: "Поддержка групп:\n  Наместники: §G+5§!\n  Гарнизоны: §G+5§!"
 NAM_grp_public_payroll_tt: "Поддержка групп:\n  Округа: §G+5§!\n  Нефтяники: §G+5§!"
 NAM_grp_emergency_writ_tt: "Поддержка групп:\n  Наместники: §G+5§!\n  Гарнизоны: §G+5§!\n  Округа: §R-5§!"
 NAM_grp_district_guarantees_tt: "Поддержка групп:\n  Округа: §G+10§!"
