 # Wartime procurement, fuel and service programmes
 NAM_war_procurement_board:0 "Военная закупочная комиссия"
 NAM_war_procurement_board_desc:0 "Округа присылают в столицу разные списки нужд, а поставщики предлагают каждому свои условия. Комиссия сведёт заявки в один реестр и заставит подрядчиков отвечать за обещанное."
 NAM_war_medical_trains:0 "Санитарные эшелоны"
 NAM_war_medical_trains_desc:0 "На обратном пути с фронта вагоны не должны идти пустыми. Врачам нужны места для раненых, носильщики и расписание, которому можно доверять даже после обстрела станции."
 NAM_war_shell_priority:0 "Боеприпасы прежде всего"
 NAM_war_shell_priority_desc:0 "Артиллеристы отмечают на картах цели, до которых пока не хватает снарядов. В железнодорожных ведомостях появится особая очередь для ящиков, от которых зависит следующий бой."
 NAM_war_rear_reserve:0 "Неприкосновенный запас тыла"
 NAM_war_rear_reserve_desc:0 "Дежурный эшелон нельзя разбирать на мелкие заявки. Его груз предназначен для того утра, когда одновременно замолчат несколько станций и штабам придётся искать новый путь к фронту."
 NAM_war_fuel_barter:0 "Нефть в обмен на вооружение"
 NAM_war_fuel_barter_desc:0 "Наши цистерны интересуют тех, кто не желает связывать себя политическими обещаниями. С такими торговцами можно говорить на языке груза, накладных и встречной поставки."
 NAM_war_fuel_discipline:0 "Каждая цистерна на счету"
 NAM_war_fuel_discipline_desc:0 "Потери топлива начинаются задолго до передовой: незакрытый кран, пустой пробег, мотор, оставленный работать на стоянке. Квартирмейстеры получат право спрашивать за каждую такую привычку."
 NAM_war_extraction_surge:0 "Форсированная добыча"
 NAM_war_extraction_surge_desc:0 "Промыслам нужны люди, которых заводы привыкли считать своими. Наместничество готово разрешить этот спор в пользу буровых бригад, пока цистерны уходят к фронту одна за другой."
 NAM_war_naval_repair_service:0 "Ремонт между выходами в море"
 NAM_war_naval_repair_service_desc:0 "В гавань входит повреждённый корабль. Мастера ждут у стенки, пока экипаж крепит сходни. Старший механик сходит первым, держа раскрытый журнал перед собой обеими руками."
 NAM_war_air_maintenance:0 "Наземные бригады эскадрилий"
 NAM_war_air_maintenance_desc:0 "Лётчик видит свою машину перед вылетом, а механик знает её всю ночь. Запасные детали, укрытия для работы и сменный состав вернут наземной службе место в планах воздушного штаба."
 NAM_war_counterbattery:0 "Контрбатарейная разведка"
 NAM_war_counterbattery_desc:0 "Наблюдатели учатся различать чужие батареи по вспышкам, звуку и времени подлёта. Их записи должны попадать к нашим артиллеристам раньше, чем противник сменит позицию."
 NAM_war_arms_purchase:0 "Закупить вооружение для фронта"
 NAM_war_arms_purchase_desc:0 "Приёмщики проверяют ящики по единой ведомости. Теперь поставщику недостаточно показать образец: фронтовые склады ждут весь оговорённый груз."
 NAM_war_arms_purchase_unlock_tt:0 "После применения решения: доставляет партию винтовок и снаряжения поддержки за политическую власть и средства казны."
 NAM_war_oil_for_arms:0 "Обменять топливо на артиллерию"
 NAM_war_oil_for_arms_desc:0 "У порта встретились представители нефтяного управления и оружейного поставщика. Приёмщики сверяют клейма на ящиках, пока моряки ждут у опечатанных трюмов. Переговоры продолжаются в тесной капитанской каюте."
 NAM_war_oil_for_arms_unlock_tt:0 "После применения решения: обменивает топливо и политическую власть на артиллерию и снаряжение поддержки."
 NAM_war_medical_rotation:0 "Наладить санитарную ротацию"
 NAM_war_medical_rotation_desc:0 "Врачи распределяют поступающих по госпиталям, а командиры получают списки тех, кто сможет вернуться в строй. У раненого теперь есть маршрут, который не заканчивается у ближайшей станции."
 NAM_war_medical_rotation_unlock_tt:0 "После применения решения: ускоряет восстановление организации и уменьшает потерю опыта при пополнении частей."
 NAM_war_ammunition_push:0 "Сосредоточить подвоз боеприпасов"
 NAM_war_ammunition_push_desc:0 "Станционные диспетчеры откладывают второстепенные заявки. На выбранный участок идут составы, без которых артиллерийская подготовка останется строкой в приказе."
 NAM_war_ammunition_push_unlock_tt:0 "После применения решения: усиливает атаку и прорыв армии ценой повышенного потребления снабжения."
 NAM_war_dockyard_rotation:0 "Ввести сменные ремонтные бригады"
 NAM_war_dockyard_rotation_desc:0 "Пока одна бригада заканчивает работу в машинном отделении, другая готовит инструмент для следующего корабля. Мастера передают смену по журналу, а не по слухам с причала."
 NAM_war_dockyard_rotation_unlock_tt:0 "После применения решения: ускоряет ремонт кораблей при наличии действующей верфи."
 NAM_war_air_service_rotation:0 "Организовать обслуживание эскадрилий"
 NAM_war_air_service_rotation_desc:0 "Механики записывают неисправности сразу после посадки. Вместо спешного поиска нужной детали перед рассветом бригады начинают работу по заранее составленному списку."
 NAM_war_air_service_rotation_unlock_tt:0 "После применения решения: снижает аварийность авиации и повышает эффективность воздушных заданий."
 NAM_war_fuel_discipline_idea:0 "Учёт военного топлива"
 NAM_war_extraction_surge_idea:0 "Форсированная добыча"
 NAM_war_counterbattery_research:0 "Контрбатарейные таблицы"
 NAM_war_services_duration_tt:0 "Программа действует только во время ресурсной войны. Завершение войны, капитуляция, утрата независимости или условий работы прекращают её без возврата оплаты."
 NAM_war_services_cancel_tt:0 "Программа прекращена. Потраченная политическая власть не возвращается."
