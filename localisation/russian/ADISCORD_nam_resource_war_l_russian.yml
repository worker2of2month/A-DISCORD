 NAM_rival_pillar_2: "Нефтяники"
 NAM_rival_pillar_3: "Гарнизоны"
 NAM_rival_pillar_4: "Экспортные конторы"
 ADISCORD_nam_groups.20.t:0 "Обязательства правительства"
 ADISCORD_nam_groups.21.t: "[NAMGetRivalName] требует печатей"
 ADISCORD_nam_groups.21.d_pechat: "Утром регистратура не открылась. Вера Сабурова вывезла реестр назначений в здание наместничества, и без её подписи ни одна управа не может сменить начальника. Наместники собрались вокруг неё и требуют, чтобы канцелярию возглавил человек, который знает, где лежит каждая печать.\n\nЕсли уступить, Светлогорьем будет править реестр. Если сопротивляться, понадобятся гарнизоны или улицы - и кто-то из них должен быть на нашей стороне."
 ADISCORD_nam_groups.21.d_klyuch: "Ключевские промыслы остановились по приказу Арсения Тарханова. Мастера не бастуют - они ждут, кого признает канцелярия. Тарханов предлагает простую сделку: нефть потечёт снова, когда страной будет управлять тот, кто её добывает.\n\nБез Ключевска у Светлогорья нет ни топлива, ни денег. Уступить - значит отдать государство промыслам. Сопротивляться можно, но для этого нужен кто-то, кто не зависит от его нефти."
 ADISCORD_nam_groups.21.d_shtyk: "Гарнизоны Светлогорска заняли перекрёстки, телеграф и вокзал. Тарас Дроздов называет это мерами безопасности и требует передать ему руководство страной, пока соседи не воспользовались слабостью канцелярии.\n\nАрестовать коменданта некому: гарнизоны подчиняются ему. Остаются только округа - если они выйдут на улицы, солдатам придётся выбирать, в кого целиться."
 ADISCORD_nam_groups.21.d_gavanov: "Южная гавань закрыта. Лев Корнилов задержал танкеры у причалов и объявил, что порт подчиняется только тому правительству, которое умеет торговать. Заморские покупатели уже спрашивают, с кем теперь подписывать контракты.\n\nКорнилов не держит армии, но держит деньги и выход к морю. Если уступить, Светлогорье станет торговым домом. Если сопротивляться, гарнизонам или округам придётся вернуть гавань."
 ADISCORD_nam_groups.21.a: "Арестовать мятежника."
 ADISCORD_nam_groups.21.b: "Вывести округа на улицы."
 ADISCORD_nam_groups.21.c: "Уступить печати."
 NAM_rival_can_arrest_tt: "Мятежник не командует гарнизонами, у гарнизонов не меньше §Y50§! поддержки, есть §Y75§! £political_power_texticon"
 NAM_rival_can_rally_tt: "У округов не меньше §Y60§! £NAM_support_dist_texticon поддержки, лестница печатей склоняется к округам"
 NAM_coup_arrest_tt: "[NAMGetRivalName] навсегда уходит из политики Светлогорья.\nПоддержка группы \"[NAMGetRivalPillar]\": §R-10§!."
 NAM_coup_rally_tt: "[NAMGetRivalName] навсегда уходит из политики Светлогорья.\nПоддержка групп:\n  Наместники: §R-10§! £NAM_support_nam_texticon\n  Округа: §G+5§! £NAM_support_dist_texticon"
 NAM_coup_yield_tt: "§R[NAMGetRivalName] становится главой Светлогорья до конца его пути§!; Егор Ром уходит в отставку.\nНа §Y365 дней§! вводится §Yхунта печатей§!.\nПоддержка группы \"[NAMGetRivalPillar]\": §G+15§!, поддержка округов: §R-10§! £NAM_support_dist_texticon.\nЛестница печатей смещается к вертикали на §Y0.15§!; подполье: §R+10§!.\nСоперники больше не выдвигают требований."

 # Underground
 NAM_underground: "Подполье Ярослава Вебера"
 NAM_underground_desc:0 "§YСОСТОЯНИЕ ПОДПОЛЬЯ§!\nСила: §Y[?NAM_underground|0] / 100§! £operatives_boost_resistance_texticon\n[NAMGetUndergroundStatus]\n[NAMGetUndergroundNext]\n\n§YЕЖЕМЕСЯЧНЫЙ РОСТ§!\nС первых дней колонии до начала ресурсной войны:\n- §R+3§! £operatives_boost_resistance_texticon - базовый рост.\n- §R+2§! - поддержка округов ниже §Y40§! £NAM_support_dist_texticon; ещё §R+1§! - ниже §Y25§!.\n- §R+2§! - лестница печатей склоняется к вертикали.\n- §G-1§! - поддержка округов от §Y60§! £NAM_support_dist_texticon.\n- §G-3§! - оплачен договор Светлогорска.\n- §G-3§! - действует контроль подпольной печати.\nЗа прошлый месяц: [?NAM_underground_growth|=-0] £operatives_boost_resistance_texticon.\n\n§YУГРОЗЫ§!\nПока не началась ресурсная война, подполье бьёт по колонии, и чем оно сильнее, тем чаще и страшнее его удары.\n- §Y30-49§! £operatives_boost_resistance_texticon - §Rвозможны диверсии.§!\n- §Y50-69§! £operatives_boost_resistance_texticon - §Rудары станут чаще и больнее.§!\n- §R70-89§! £operatives_boost_resistance_texticon - §Rбудут серьёзные последствия.§!\n- §R90-100§! £operatives_boost_resistance_texticon - §Rколонию ждёт катастрофа.§!\nСейчас: [NAMGetUndergroundDanger]\nПостоянные посты на нефтепроводах закрывают трубу от подрывов, пока работают. Усиленная охрана после налёта закрывает склады на §Y180§! £time_texticon дн.\n\nВ начале ресурсной войны, без амнистии и ратифицированного договора:\n- Ниже §G30§! - восстания не будет.\n- §Y30-59§! - вероятность восстания §Y50%§!.\n- От §R60§! - восстание неизбежно.\nПосты на нефтепроводах и кампания против листовок: ещё по §G-2§! £operatives_boost_resistance_texticon в месяц, пока работают."
 NAM_underground_status_high: "§RВебер готов поднять город.§!"
 NAM_underground_status_mid: "§YПодполье может выступить.§!"
 NAM_underground_status_low: "§GПодполье слишком слабо для восстания.§!"
 NAM_underground_amnestied: "§GЯрослав Вебер принял амнистию; подполья больше нет.§!"
 NAM_weber_talks_1: "Первая встреча с Вебером"
 NAM_weber_talks_1_desc: "Посредники округов передают Веберу предложение о встрече. Для начала достаточно договориться о месте, куда обе стороны смогут прийти без страха за свою жизнь."
 NAM_weber_talks_possible_tt: "Подполье существует, восстание не началось, Светлогорье действует"
 NAM_weber_talks_slot_free_tt:0 "Предыдущий взнос за переговоры уже рассчитан"
 NAM_weber_talks_started_tt: "Через §Y30 дней§! переговоры дадут результат, если их не прервут."
 NAM_weber_talks_1_tt: "Подполье: §G-10§!.\nПоддержка округов: §G+3§! £NAM_support_dist_texticon.\nОткрывается второй раунд переговоров."
 NAM_weber_talks_1_cancel_tt: "Переговоры прерваны. Потраченная политическая власть не возвращается."
 NAM_weber_talks_2: "Вторая встреча: списки и гарантии"
 NAM_weber_talks_2_desc: "На столе лежат списки задержанных и проекты гарантий для тех, кто решится выйти из подполья. За каждым именем стоит семья, которая ждёт не очередного обещания, а ответа."
 NAM_weber_talks_2_started_tt: "Казна: §R-100§! £ADISCORD_economy_treasury_texticon.\nЧерез §Y30 дней§! переговоры дадут результат, если их не прервут."
 NAM_weber_talks_2_cancel_tt: "Переговоры прерваны. Казна: §G+100§! £ADISCORD_economy_treasury_texticon; потраченная политическая власть не возвращается."
 NAM_weber_talks_2_tt: "Подполье: §G-10§!.\nПоддержка групп:\n  Округа: §G+5§! £NAM_support_dist_texticon\n  Наместники: §R-3§! £NAM_support_nam_texticon\nОткрывается последний раунд - амнистия."
 NAM_weber_talks_3: "Амнистия Ярослава Вебера"
 NAM_weber_talks_3_desc: "Остаётся поставить подписи под общим соглашением. Вебер должен убедить своих людей выйти из укрытий, а канцелярия - доказать, что данное слово имеет силу."
 NAM_weber_amnesty_backing_tt: "Поддержка округов не ниже §Y50§! £NAM_support_dist_texticon"
 NAM_weber_talks_3_started_tt: "Казна: §R-200§! £ADISCORD_economy_treasury_texticon.\nЧерез §Y45 дней§! будет объявлена амнистия, если переговоры не прервут."
 NAM_weber_talks_3_cancel_tt: "Переговоры прерваны. Казна: §G+200§! £ADISCORD_economy_treasury_texticon; потраченная политическая власть не возвращается."
 NAM_weber_amnesty_tt: "§GПодполье распускается навсегда: Светлогорского восстания не будет.§!\n§YЯрослав Вебер§! поступает на службу Светлогорью как генерал.\nПоддержка групп:\n  Округа: §G+10§! £NAM_support_dist_texticon\n  Наместники: §R-5§! £NAM_support_nam_texticon\nЛестница печатей смещается к округам на §Y0.10§!."
 NAM_cost_weber_talks_2: "§Y50§! £political_power_texticon §Y100§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_weber_talks_2_blocked: "§R50§! £political_power_texticon §R100§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_weber_talks_2_tooltip: "§Y50§! £political_power_texticon §Y100§! £ADISCORD_economy_treasury_texticon\nЦена списывается в начале переговоров. Если их прервут, казна вернётся, а политическая власть - нет."
 NAM_cost_weber_talks_3: "§Y75§! £political_power_texticon §Y200§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_weber_talks_3_blocked: "§R75§! £political_power_texticon §R200§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_weber_talks_3_tooltip: "§Y75§! £political_power_texticon §Y200§! £ADISCORD_economy_treasury_texticon\nЦена списывается в начале переговоров. Если их прервут, казна вернётся, а политическая власть - нет."
 NAM_hunt_caches: "Найти склады подполья"
 NAM_hunt_caches_desc: "Инспекторы сверяют накладные и показания связных, а полевые жандармы готовят обыски. Следы ведут к заброшенным складам и дворам, которых нет в официальных ведомостях."
 NAM_underground_left_tt: "Подполье ещё существует"
 NAM_caches_not_searched_tt: "Округ не обыскивали последние §Y180 дней§!"
 NAM_hunt_caches_tt: "Подполье: §G-10§!.\nПоддержка округов: §R-5§! £NAM_support_dist_texticon.\nПовторный обыск этого округа доступен через §Y180§! £time_texticon дн."
 ADISCORD_nam_groups.30.t: "Ярослав Вебер выходит из подполья"
 ADISCORD_nam_groups.30.d: "Третий раунд переговоров закончился не в задней комнате, а на площади у вокзала. Ярослав Вебер пришёл без охраны и передал представителям округов списки своих складов. Взамен канцелярия публикует амнистию: никого из подполья не будут преследовать за прошлое, если он сложит оружие.\n\nВебер не стал союзником власти. Он стал человеком, которому округа доверяют больше, чем канцелярии, и который теперь будет служить в армии Светлогорья. Восстания в Светлогорске больше не будет - разве что канцелярия снова перестанет отвечать на прошения."
 ADISCORD_nam_groups.30.a: "Пусть город запомнит этот день."

 # Mobilisation reports
 NAM_orders_delivered_tt: "\n§YПОДГОТОВЛЕННЫЕ ФОРМИРОВАНИЯ§!\nВсе введены в строй: §Y[?NAM_orders_delivered|0]§!.\n- Гвардия промыслов: §Y[?NAM_orders_delivered_guard|0]§!\n- Полевая пехота: §Y[?NAM_orders_delivered_infantry|0]§!\n- Моторизованные дивизии: §Y[?NAM_orders_delivered_motor|0]§!\n- Береговые отряды: §Y[?NAM_orders_delivered_coastal|0]§!"
 NAM_orders_none_delivered_tt: "\n§YПОДГОТОВЛЕННЫЕ ФОРМИРОВАНИЯ§!\nПо приказам о мобилизации: §Y0§!. Фронт держат постоянные части и три дивизии базового резерва."
 ADISCORD_nam_resource_war.24.t: "Мобилизация распущена"
 ADISCORD_nam_resource_war.24.d: "Соседи так и не перешли границу: штаб отменил военную тревогу, а войска коалиции вернулись в казармы. Срок, ради которого Светлогорье готовило мобилизацию, прошёл без войны.\n\nКанцелярия распустила все подготовленные формирования и вернула в бюджет то, что ещё можно было вернуть: казну, топливо и людей. Политический вес, потраченный на приказы, не возвращается."
 ADISCORD_nam_resource_war.24.a: "Пусть люди вернутся к работе."
 NAM_orders_refunded_tt: "§YРаспущено формирований:§!\nгвардия промыслов §Y[?NAM_orders_refunded_guard|0]§!,\nполевая пехота §Y[?NAM_orders_refunded_infantry|0]§!,\nмоторизованные дивизии §Y[?NAM_orders_refunded_motor|0]§!,\nбереговые отряды §Y[?NAM_orders_refunded_coastal|0]§!.\nНабранные люди, казна и топливо моторизованных дивизий вернулись."

 # War of return
 NAM_war_of_return_ready_tt: "[NAMGetWarOfReturnReady]"
 NAM_war_of_return_start_tt: "Начинается §Yвойна возвращения§!. [NAMGetWarOfReturnTerms]"
 ADISCORD_nam_resource_war.60.t: "Война возвращения"
 ADISCORD_nam_resource_war.60.d: "Армия, восстановленная после поражения, перешла новую границу. Светлогорье объявило войну тем, кто владеет его прежними промыслами и Южной гаванью, и требует вернуть Северные месторождения, Светлогорский округ, Южнобережье, Сухоречье и гавань.\n\nНа этот раз отступать некуда. Если мы проиграем, соседи заберут всё, что осталось на материке. Если победим, промыслы вернутся домой. Посредников не будет: война кончится, только когда одна из сторон сложит оружие."
 ADISCORD_nam_resource_war.60.d_target: "Светлогорье объявило войну возвращения. Его армия требует вернуть промыслы, отошедшие нам по компромиссному миру. Если Светлогорье капитулирует, его земли будут окончательно разделены; если падут все нынешние владельцы промыслов, они вернутся Светлогорью. Перемирия не будет: война идёт до полной капитуляции одной из сторон."
 ADISCORD_nam_resource_war.60.a: "Вперёд, к промыслам."
 ADISCORD_nam_resource_war.60.b: "Мы будем защищать свою землю."
 NAM_war_of_return_terms_tt: "[NAMGetWarOfReturnTerms]"
 ADISCORD_nam_resource_war.62.t: "Итог войны возвращения"
 ADISCORD_nam_resource_war.62.d_won: "Последний владелец наших промыслов капитулировал. Посредники не понадобились: колонны Светлогорья уже стоят у вышек, а над управами снова висят наши флаги. Северные месторождения и остальные промыслы возвращаются домой.\n\nЦена была высокой, но теперь это цена, заплаченная за своё, а не за чужое решение."
 ADISCORD_nam_resource_war.62.a: "Возвращаемся к работе."

 # Punishment of the defeated coalition
 NAM_ruined_economy: "Разрушенная экономика"
 NAM_ruined_economy_desc: "Война за светлогорскую нефть разорила казну и заводы. Пока долги не выплачены, а мастерские не восстановлены, экономика работает вполсилы."
 NAM_army_of_shame: "Армия позора"
 NAM_army_of_shame_desc: "Армия проиграла войну, которую ей обещали выиграть за одну кампанию. Офицеры прячут глаза, солдаты не верят приказам, а новобранцы не спешат на призывные пункты."

