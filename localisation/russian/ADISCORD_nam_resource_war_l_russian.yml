 NAM_bw_export_detail:0 "§YНЕФТЯНЫЕ ПОСТАВКИ§!\nПропускная способность: §Y[?NAM_oil_throughput|0]§! ед.\nЗанято: §Y[?NAM_oil_committed|0]§!; контрактов: §Y[?NAM_oil_contracts|0]§![NAMBasinTribute][NAMBasinLorenCargo].\nСвободно: суша §Y[?NAM_oil_free_land_units|0]§!, море §Y[?NAM_oil_free_units|0]§!.\n\n§YПОКУПАТЕЛИ И ОГРАНИЧЕНИЯ§!\nПокупатели: [NAMBasinClientsNone][EFL.NAMBasinClient][AZH.NAMBasinClient][VAL.NAMBasinClient][STP.NAMBasinClient][STS.NAMBasinClient][RHM.NAMBasinClient][MZR.NAMBasinClient][SHL.NAMBasinClient][RUS.NAMBasinClient][WEF.NAMBasinClient][KDR.NAMBasinClient][SDR.NAMBasinClient][GLP.NAMBasinClient][KYZ.NAMBasinClient]\nЭмбарго: [NAMBasinEmbargoNone][EFL.NAMBasinEmbargo][AZH.NAMBasinEmbargo][SHL.NAMBasinEmbargo]\n\n§YОСТРОВНЫЕ ДОГОВОРЫ§!\nСтальной сбор: [NAMBasinLevy].\nКонвойная линия: [NAMBasinConvoy].\nКонцессия [231.GetName]: [NAMBasinConcession231].\n\n§YУСЛОВИЯ КОНТРАКТА§!\nОдна единица мощности обслуживает одну постоянную поставку.\nКаждый месяц: покупателю §Y15000§! £fuel_texticon, казне §G40§! £ADISCORD_economy_treasury_texticon. Без топлива на складе поставка и оплата за месяц пропускаются.\nМорской терминал Южной гавани обслуживает только заморских покупателей. Контракты, эмбарго и острова управляются в своих разделах решений.\nЭкспортная диспетчерская даёт ещё §G+30§! £ADISCORD_economy_treasury_texticon за каждую выполненную месячную поставку на время её работы."
