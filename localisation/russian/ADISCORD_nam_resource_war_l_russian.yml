 NAM_social_payroll_cost_tooltip:0 "§Y200§! £ADISCORD_economy_treasury_texticon"
 NAM_incident_countdown:0 "До следующего происшествия"
 NAM_incident_countdown_desc:0 "Диспетчеры собирают сообщения с промыслов, из округов и казённых контор. Пока тревожные сводки не сложились в общую картину."
 NAM_incident_response:0 "Урегулировать происшествие"
 NAM_incident_response_desc:0 "Дело передано в канцелярию. Посыльный сидит на скамье у двери и следит за папкой в руках секретаря. На каждом повороте коридора его останавливают с одним и тем же вопросом: есть ли ответ."
 NAM_incident_draw_tt:0 "Произойдёт случайное происшествие, соответствующее текущему положению страны. Ответьте на него в событии в течение §Y14§! £time_texticon дней; с кризисным ведомством - §Y21§! £time_texticon дня."
 NAM_incident_response_timeout_tt:0 "При истечении срока, если положение не изменится:\n[NAMIncidentTimeoutOutcome]"
 NAM_project_chromium:0 "Расширить хромовые рудники"
 NAM_project_chromium_desc:0 "Геологи показывают горному мастеру образцы тёмной руды. Он узнаёт камень, который прежде выбрасывали в отвал. У входа в старую штольню разматывают мерную ленту."
 NAM_chromium_site_tt:0 "Месторождение принадлежит нам, находится под нашим контролем и ещё не расширено"
 NAM_project_chromium_result_tt:0 "По завершении: [67.GetName] получает §G+6§! хрома. При отмене оплата возвращается полностью."
