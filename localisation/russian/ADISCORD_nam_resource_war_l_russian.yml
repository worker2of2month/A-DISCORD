 # Story scenes of the exile, defeat and postwar routes
 ADISCORD_nam_story.1.t:0 "Смотритель маяка"
 ADISCORD_nam_story.1.d:0 "Егора Рома привели к Карамышеву под утро, без конвоя: бывший наместник сам пришёл в таможню, когда узнал, что печати сняли со стола. Он принёс опись канцелярии, которую успел погрузить на последний транспорт, и положил её поверх карт материка.\n\nОфицеры опор не хотели на него смотреть. Для одних он был человеком, который сдал промыслы, не дождавшись последнего боя, для других - тем, кто вывел их из Южной гавани живыми. Старшина нефтяной артели сказал вслух то, о чём думали многие: пока Ром на островах, люди будут спрашивать, чей приказ настоящий.\n\nКарамышев листал опись. Всё было на месте: склады, суда, списки, даже стоимость сброшенных в воду орудий.\n- Вы умеете вести учёт, - сказал он. - Только мне нужен не учёт, а возвращение.\n- Одно без другого не бывает, - ответил Ром и попросил назначить ему место, где он не будет мешать.\n\nНа дальнем острове пустует маяк. В канцелярии не хватает писарей. А в казармах ждут суда над человеком, подписавшим отступление."
 ADISCORD_nam_story.1.d_coup:0 "Бывшего правителя привели к Карамышеву под утро. Тот, кто когда-то взял печати силой, потерял их так же быстро: на островах за ним не пошёл ни один гарнизон. Он требовал признать его власть и грозил, что без него флотилии разбегутся по чужим портам.\n\nОфицеры опор не хотели его слушать. Для одних он был человеком, который сломал лестницу в разгар войны, для других - ещё одним начальником, бежавшим с материка на первом транспорте. Старшина нефтяной артели сказал вслух то, о чём думали многие: пока он на островах, люди будут спрашивать, чей приказ настоящий.\n\nКарамышев выслушал его до конца и ничего не обещал. На дальнем острове пустует маяк. В канцелярии не хватает писарей. А в казармах ждут суда над человеком, который проиграл материк."
 ADISCORD_nam_story.1.a:0 "Отправить его смотрителем маяка."
 ADISCORD_nam_story.1.b:0 "Пусть переписывает наши приказы."
 ADISCORD_nam_story.1.c:0 "Судить его перед гарнизонами."
