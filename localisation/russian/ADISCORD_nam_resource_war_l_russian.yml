 NAM_mil_forward_supply_cost_tooltip:0 "§Y25§! £political_power_texticon §Y150§! £ADISCORD_economy_treasury_texticon §Y60§! £support_equipment_texticon"
 NAM_mil_forward_supply:0 "Развернуть снабжение рубежа"
 NAM_mil_forward_depot:0 "Передовой склад рубежа"
 NAM_mil_prepared_line_tt:0 "Округ принадлежит Светлогорью, контролируется им и имеет подготовленный рубеж"
 NAM_mil_forward_supply_delivered_tt:0 "Выбранный округ до конца ресурсного конфликта: местное снабжение §G+0,20§!, восстановление организации §G+10%§!."
 NAM_mil_forward_supply_result_tt:0 "Через §Y14§! £time_texticon дн.: $NAM_mil_forward_supply_delivered_tt$\nДо завершения занимает одно место подготовки рубежей и выбранный округ.\nГотовый склад прекращает работу без компенсации при потере округа, капитуляции, подчинении или завершении ресурсного конфликта.\nЕго можно восстановить за полную цену после перерыва §Y30§! £time_texticon дн. от завершения предыдущей подготовки."
 NAM_mil_forward_supply_refund_tt:0 "Возврат оплаты: §Y25§! £political_power_texticon §Y150§! £ADISCORD_economy_treasury_texticon §Y60§! £support_equipment_texticon"
 NAM_mil_forward_supply_desc:0 "За подготовленным рубежом нужны крытые склады, ремонтные площадки и места для разгрузки. Интенданты согласуют расположение тыла с офицерами, которые будут держать этот участок."
 NAM_mil_forward_supply_map:0 "Развёртывание передового склада"
 NAM_mil_quartermaster_tt:0 "Каждый \"$NAM_supply_order$\" дополнительно поставляет §G+80§! £infantry_equipment_texticon $ADISCORD_squad_weapons_equipment$."
