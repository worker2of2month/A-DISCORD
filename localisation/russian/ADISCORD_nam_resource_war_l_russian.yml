 NAM_colony_desc: "Светлогорье остаётся нефтяной колонией метрополии.\n\n§YТОРГОВЛЯ С МЕТРОПОЛИЕЙ§!\nТорговые дома: §Y[?NAM_wrk_trade_level|0] / 3§! £NAM_support_trade_texticon\nКонцессия: [NAMGetWrkConcession][NAMGetHiddenReserve]\n\n§YБЕЗОПАСНОСТЬ КОЛОНИИ§!\nПодполье Вебера: §Y[?NAM_underground|0] / 100§! £operatives_boost_resistance_texticon\nОблавы жандармерии ослабляют сеть, но снижают поддержку округов.\nРост, угрозы и способы противодействия - в разделе \"$NAM_underground$\".\n\n§RВЫВОЗ ПРИ РАСПАДЕ§!\nПри распаде администрация вывезет всю открытую казну и топливо. Сохранятся только завершённые тайники; месторождения останутся.\nТайники: §Y[?NAM_hidden_reserve|0]§! £ADISCORD_economy_treasury_texticon; §Y[?NAM_hidden_fuel|0]§! £fuel_texticon."
 NAM_wrk_metropole_present_tt: "Метрополия существует"
