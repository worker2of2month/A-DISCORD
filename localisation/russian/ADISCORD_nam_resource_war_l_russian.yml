 ADISCORD_nam_debug_rival_demand: "§RDEBUG:§! Требование соперника Светлогорья"
 ADISCORD_nam_debug_rival_demand_desc: "Канцелярия готовит особое распоряжение. Ответственные служащие ждут подписи и печати."
 ADISCORD_nam_debug_underground: "§RDEBUG:§! Подполье Светлогорья +30"
