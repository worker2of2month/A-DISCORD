 NAM_pw_fleet_tt_exile:0 "§YФЛОТИЛИИ В МОРЕ§!\nМеста для набегов: §Y[?NAM_pirate_raid_slots|0]§! £navy_anchor_texticon, предел §Y3§!. Новые места открывают фокусы изгнания.\nДлительность набега: §Y15§! £time_texticon дней.\n\n§YОБОЗНАЧЕНИЯ§!\n- Красный знак - флотилия в море.\n- Жёлтое кольцо - свободное место.\n- Серый знак - место ещё не открыто.\n\n§YСИЛА ФЛОТА§!\nБольше §Y2§! кораблей повышают удачу набега, больше §Y5§! - ещё сильнее."
