 NAM_grp_demand_accept_tt: "§YГруппа получает своё:§!\nнаместники - §G+75§! £political_power_texticon,\nнефтяники - §G+5000§! £fuel_texticon,\nокруга - §G+3%§! £stability_texticon,\nгарнизоны - §G+25§! £army_experience,\nконторы - §G+250§! £ADISCORD_economy_treasury_texticon.\nЕё соперники: §R-10§!."
