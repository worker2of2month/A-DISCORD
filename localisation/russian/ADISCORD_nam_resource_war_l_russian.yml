  # Piracy window
 NAM_pw_loot_label:0 "Добыча"
 NAM_pw_loot_value:0 "§Y[?NAM_pirate_loot|0]§!"
 NAM_pw_loot_tt:0 "[NAMGetPrizeSpending]"
 NAM_pw_loot_tt_exile:0 "§YДОБЫЧА ФЛОТИЛИЙ§!\n- Удачный набег: §G+50§! добычи.\n- Конвои Эфлора и Ажара: §G+60§! добычи.\n- Богатый приз: §G+100§! добычи.\n\n§YРАСХОДОВАНИЕ§!\nДобыча оплачивает чёрный рынок, учения и морскую пехоту; скупщики обменивают её на казну. Точные цены и результаты указаны у кнопок под картой."
 NAM_pw_coalition_label:0 "Коалиция"
 NAM_pw_coalition_value:0 "[NAMPwCoalition]"
 NAM_pw_coalition_blockade:0 "§Rблокада§!"
 NAM_pw_coalition_lying_low:0 "§Yмы затаились§!"
 NAM_pw_coalition_hunted:0 "§Rгрозит рейдом§!"
 NAM_pw_coalition_wanted:0 "§Rгрозит блокадой§!"
 NAM_pw_coalition_calm:0 "§Gспокойна§!"
 NAM_pw_coalition_tt:0 "Каждый набег поднимает дурную славу, каждый месяц она снижается на §Y3§!. Набеги на пути Эфлора и Ажара злят коалицию сильнее всего.\nОт §Y50§! коалиция может закрыть гавани блокадой на §Y90§! £time_texticon дней: удача набега §Rx0.7§!, провал §Rx1.3§!.\nОт §Y75§! она может обстрелять острова.\nПосле её ответа флотилии могут на время затаиться - тогда новые набеги невозможны.\n\nСейчас: дурная слава §Y[?NAM_pirate_notoriety|0]§! / 100 - [NAMGetPirateNotoriety]."
 NAM_pw_landing_label:0 "Десант"
 NAM_pw_landing_value:0 "[NAMPwLandingShort]"
 NAM_pw_landing_three:0 "§Y3§! дивизии"
 NAM_pw_landing_two:0 "§Y2§! дивизии"
 NAM_pw_landing_tt:0 "Война возвращения начнётся с десанта в Южной Гавани: §Y2§! дивизии морской пехоты, третья - если подготовлен хотя бы один приказ или готовность к возвращению не ниже §Y70§!.\nОстальные обученные дивизии будут сформированы в островной столице.\n\n[NAMGetLandingForecast]"
 NAM_pw_map_legend:0 "Жёлтый - путь открыт, красный - флотилия в море, голубой - конвои под охраной, серый - путь закрыт. Якорь отправляет флотилию."
 NAM_pw_islands_label:0 "Островные базы"
 NAM_pw_lane_oil_name:0 "Нефтяной путь"
 NAM_pw_lane_coast_name:0 "Северный каботаж"
 NAM_pw_lane_strait_name:0 "Луренский пролив"
 NAM_pw_lane_crossing_name:0 "Шарденский паром"
 NAM_pw_route_oil_tt:0 "§YНефтяной путь§!: танкеры [AZH.GetName] идут в залив [EFL.GetName] мимо восточного мыса главного острова.\n[NAMPwLaneOilStatus]\n\nЦена: [NAMPwRaidCost]. Флотилия уходит на §Y15§! £time_texticon дней; если набег прервётся, топливо вернётся.\n\nИсход (базовые веса: удача §Y50§!, приз §Y15§!, провал §Y35§!):\n- удача: §G+60§! добычи и §G+1000§! £fuel_texticon, владельцы пути теряют §R2000§! £fuel_texticon на всех; дурная слава §R+10§!;\n- приз: §G+100§! добычи, §G+2000§! £fuel_texticon, §G+9000§! £infantry_equipment_texticon, §G+3§! £convoy_texticon, владельцы теряют §R3000§! £fuel_texticon на всех; дурная слава §R+12§!;\n- провал: патрульный корабль или §R1000§! £manpower_texticon; дурная слава §R+5§!.\n\nМножители весов исходов:\n- [NAMPwShipsFactor]\n- [NAMPwLaneOilAlert]\n- [NAMPwBlockadeFactor]\n- [NAMPwNotorietyFactor]\n- Самые богатые грузы: вес призового исхода §Gx1.5§!.\n\nПерерыва между набегами нет, но после набега владельцы пути §Y90§! £time_texticon дней настороже."
 NAM_pw_route_coast_tt:0 "§YСеверный каботаж§!: суда [RIV.GetName] и [EFL.GetName] идут вдоль материкового берега к северу от островов.\n[NAMPwLaneCoastStatus]\n\nЦена: [NAMPwRaidCost]. Флотилия уходит на §Y15§! £time_texticon дней; если набег прервётся, топливо вернётся.\n\nИсход (базовые веса: удача §Y50§!, приз §Y15§!, провал §Y35§!):\n- удача: §G+60§! добычи и §G+1000§! £fuel_texticon, владельцы пути теряют §R2000§! £fuel_texticon на всех; дурная слава §R+10§!;\n- приз: §G+100§! добычи, §G+2000§! £fuel_texticon, §G+9000§! £infantry_equipment_texticon, §G+3§! £convoy_texticon, владельцы теряют §R3000§! £fuel_texticon на всех; дурная слава §R+12§!;\n- провал: патрульный корабль или §R1000§! £manpower_texticon; дурная слава §R+5§!.\nБез судов Эфлора - как на путях без коалиции: §G+50§! добычи, дурная слава §R+6§!, §R+8§! и §R+3§!.\n\nМножители весов исходов:\n- [NAMPwShipsFactor]\n- [NAMPwLaneCoastAlert]\n- [NAMPwBlockadeFactor]\n- [NAMPwNotorietyFactor]\n\nПерерыва между набегами нет, но после набега владельцы пути §Y90§! £time_texticon дней настороже."
 NAM_pw_route_strait_tt:0 "§YЛуренский пролив§!: суда [ULV.GetName] и [LUR.GetName] идут проливом к югу от островов.\n[NAMPwLaneStraitStatus]\n\nЦена: [NAMPwRaidCost]. Флотилия уходит на §Y15§! £time_texticon дней; если набег прервётся, топливо вернётся.\n\nИсход (базовые веса: удача §Y50§!, приз §Y15§!, провал §Y35§!):\n- удача: §G+50§! добычи и §G+1000§! £fuel_texticon, владельцы пути теряют §R2000§! £fuel_texticon на всех; дурная слава §R+6§!;\n- приз: §G+100§! добычи, §G+2000§! £fuel_texticon, §G+9000§! £infantry_equipment_texticon, §G+3§! £convoy_texticon, владельцы теряют §R3000§! £fuel_texticon на всех; дурная слава §R+8§!;\n- провал: патрульный корабль или §R1000§! £manpower_texticon; дурная слава §R+3§!.\n\nМножители весов исходов:\n- [NAMPwShipsFactor]\n- [NAMPwLaneStraitAlert]\n- [NAMPwBlockadeFactor]\n- [NAMPwNotorietyFactor]\n\nПерерыва между набегами нет, но после набега владельцы пути §Y90§! £time_texticon дней настороже."
 NAM_pw_route_crossing_tt:0 "§YШарденский паром§!: суда [CHD.GetName] идут между островами к бухте [RIV.GetName].\n[NAMPwLaneCrossingStatus]\n\nЦена: [NAMPwRaidCost]. Флотилия уходит на §Y15§! £time_texticon дней; если набег прервётся, топливо вернётся.\n\nИсход (базовые веса: удача §Y50§!, приз §Y15§!, провал §Y35§!):\n- удача: §G+50§! добычи и §G+1000§! £fuel_texticon, владельцы пути теряют §R2000§! £fuel_texticon на всех; дурная слава §R+6§!;\n- приз: §G+100§! добычи, §G+2000§! £fuel_texticon, §G+9000§! £infantry_equipment_texticon, §G+3§! £convoy_texticon, владельцы теряют §R3000§! £fuel_texticon на всех; дурная слава §R+8§!;\n- провал: патрульный корабль или §R1000§! £manpower_texticon; дурная слава §R+3§!.\n\nМножители весов исходов:\n- [NAMPwShipsFactor]\n- [NAMPwLaneCrossingAlert]\n- [NAMPwBlockadeFactor]\n- [NAMPwNotorietyFactor]\n\nПерерыва между набегами нет, но после набега владельцы пути §Y90§! £time_texticon дней настороже."
