 NAM_board_registry_coast:0 "Каботаж\n§Y$NAM_board_short_3$§!"
 NAM_board_registry_coast_tt:0 "§YКаботаж§!\nВладелец: $NAM_board_short_3$. Отрасль закреплена при учреждении совета."
 NAM_board_registry_labour:0 "Биржа труда\n§Y$NAM_board_short_5$§!"
 NAM_board_registry_labour_tt:0 "§YБиржа труда§!\nВладелец: $NAM_board_short_5$. Отрасль закреплена при учреждении совета."
 NAM_board_registry_rail:0 "Вагонные мастерские\n§Y[NAMBoardOwnerRail]§!"
 NAM_board_registry_rail_tt:0 "§YВагонные мастерские§!\nВладелец: [NAMBoardOwnerRail].\nВ госсобственности: выпуск военных заводов §G+2%§!. При продаже этот эффект снимается. Претенденты: $NAM_corp_name_2$ и $NAM_corp_name_5$."
 NAM_board_registry_yards:0 "Судоверфи\n§Y[NAMBoardOwnerYards]§!"
 NAM_board_registry_yards_tt:0 "§YСудоверфи§!\nВладелец: [NAMBoardOwnerYards].\nВ госсобственности: выпуск верфей §G+3%§!. При продаже этот эффект снимается. Претенденты: $NAM_corp_name_3$ и $NAM_corp_name_4$."
 NAM_board_registry_depots:0 "Топливные склады\n§Y[NAMBoardOwnerDepots]§!"
 NAM_board_registry_depots_tt:0 "§YТопливные склады§!\nВладелец: [NAMBoardOwnerDepots].\nВ госсобственности: скорость строительства §G+2%§!. При продаже этот эффект снимается. Претенденты: $NAM_corp_name_1$ и $NAM_corp_name_6$."
 NAM_corp_band_low: "§Yинвесторы осторожничают§!: денег мало, выгод нет."
 NAM_corp_band_balance: "§Gравновесие§!: исследования §G+5%§!, эффективность §G+3%§!, торговый доход §G+10%§!."
 NAM_corp_band_pressure: "§Rдавление правлений§!: исследования §G+8%§!, эффективность §G+5%§!, торговый доход §G+15%§!, стабильность §R-5%§!, политическая власть §R-10%§!."
 NAM_corp_band_seals: "§Rправления требуют печатей§!: исследования §G+10%§!, эффективность §G+5%§!, торговый доход §G+20%§!, стабильность §R-10%§!, политическая власть §R-20%§!. Три месяца на этом уровне - и корпорации возьмут власть."
 NAM_corp_band_takeover: "§Rправят корпорации§!: исследования §G+10%§!, эффективность §G+8%§!, торговый доход §G+25%§!, стабильность §R-5%§!, политическая власть §R-15%§!."
 NAM_corp_dynamic: "Иностранные корпорации"
 NAM_corp_dynamic_desc: "Капитал инвесторов кормит изгнание, а их правления всё громче говорят в правительстве. Сила этого влияния определяет и выгоду, и цену."
 NAM_free_zone_state: "Свободная зона"
 NAM_free_zone_state_desc: "Налоговые каникулы, иностранные управляющие и стройки без пошлин.\n\nСмена владельца острова снимает этот статус."
 NAM_corp_steel_export_state: "Сталь на экспорт"
 NAM_corp_steel_export_state_desc: "Руда острова уходит на иностранные заводы по контракту."
 NAM_corporate_board_state: "Правление корпорации"
 NAM_corporate_board_state_desc: "Островом управляет совет директоров: шахты работают круглые сутки, а рабочие связаны контрактами.\n\nСмена владельца острова снимает правление."
 NAM_corp_charter_free_zone: "Учредить свободную зону"
 NAM_corp_charter_free_zone_desc: "Инвесторы и островные управы собираются обсудить устав местного хозяйства. Юристы сверят полномочия управляющих, границы концессии и обязательства сторон перед жителями."
 NAM_corp_zone_slot_free_tt: "Есть место для новой свободной зоны: учреждено §Y[?NAM_free_zones_active|0]§! и на переговорах §Y[?NAM_free_zones_pending|0]§! из §Y[?NAM_free_zone_slots|0]§!, не больше §Y3§!"
 NAM_corp_charter_started_tt: "Начинаются переговоры с инвесторами; место свободной зоны занято. Политическая власть при срыве переговоров не возвращается."
 NAM_corp_charter_done_tt: "Если страна действует, а остров всё ещё принадлежит нам и контролируется нами, открывается свободная зона:\n- скорость строительства в регионе §G+25%§!, ресурсы §G+10%§!, ещё §G1§! место для строительства;\n- сбор налогов страны §R-3%§!;\n- иностранный капитал: §G+20§! сразу и доход каждый месяц;\n- влияние корпораций: §R+5§! сразу и §R+1§! в месяц."
 NAM_corp_charter_cancel_tt: "Переговоры сорваны: место свободной зоны освобождается. Политическая власть не возвращается."
 NAM_corp_sell_steel: "Продать островную сталь"
 NAM_corp_sell_steel_desc:0 "На причале взвешивают стальные заготовки. Закупщики сверяют клеймо на каждой партии, прежде чем кран перенесёт её в трюм."
 NAM_corp_owns_island_tt:0 "В нашем владении и под нашим контролем есть остров с добычей не менее 8 ед. стали и свободной экспортной квотой"
 NAM_corp_sell_steel_tt:0 "Один из наших островов поставляет §Y8§! ед. стали на §Y60§! £time_texticon дн. Иностранный капитал §G+60§!."
 NAM_corp_labour_contract: "Сдать рабочих в аренду"
 NAM_corp_labour_contract_desc: "На причале собираются островитяне, нанятые на верфи и рудники инвесторов. У каждого в руках договор с незнакомой печатью, а за спиной остаётся семья, которой обещаны письма из чужого порта."
 NAM_cost_corp_labour: "§Y3000§! £manpower_texticon"
 NAM_cost_corp_labour_blocked: "§R3000§! £manpower_texticon"
 NAM_cost_corp_labour_tooltip: "§Y3000§! £manpower_texticon\nРабочие вернутся через §Y90§! дней или при срыве контракта."
 NAM_corp_labour_started_tt: "Иностранный капитал: §G+45§!.\nВлияние корпораций: §R+4§! сразу и §R+1§! в месяц, пока рабочие на контракте.\n§Y3000§! £manpower_texticon вернутся по окончании контракта."
 NAM_corp_labour_return_tt: "Рабочие возвращаются: §G+3000§! £manpower_texticon."
 NAM_corp_innovation_park: "Технопарк инвесторов"
 NAM_corp_innovation_park_desc: "Иностранные инженеры открывают на островах лаборатории и опытные цеха. Над чертежами спорят на разных языках, а рядом с местными мастерами за испытаниями наблюдают представители правлений."
 NAM_cost_corp_park: "§Y25§! £political_power_texticon §Y60§! капитала"
