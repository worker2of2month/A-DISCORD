 NAM_pw_revenge_status:0 "[NAMGetLandingForecast] Отметка §Y70§! - третья дивизия."
 NAM_pw_revenge_tt:0 "§YГОТОВНОСТЬ К ВОЗВРАЩЕНИЮ§!\nУчения на пляжах: §G+10§! готовности. Ответы на действия коалиции также меняют её.\n\n§YДЕСАНТ В ЮЖНОЙ ГАВАНИ§!\n- Базовый состав: §Y2§! £divisions_texticon морской пехоты.\n- Третья дивизия: подготовленный приказ или готовность от §Y70§!.\n[NAMGetLandingForecast]"
 NAM_pw_fleet_label:0 "Флотилии"
 NAM_pw_fleet_value:0 "в море §Y[?NAM_pirate_raids_active|0]§! из §Y[?NAM_pirate_raid_slots|0]§!, кораблей §Y[?num_ships|0]§!"
 NAM_pw_fleet_tt:0 "§YФЛОТИЛИИ В МОРЕ§!\nМеста для набегов: §Y[?NAM_pirate_raid_slots|0]§! £navy_anchor_texticon, предел §Y3§!. Новые места открывают фокусы изгнания.\nДлительность набега: §Y15§! £time_texticon дней.\n\n§YОБОЗНАЧЕНИЯ§!\n- Красный знак - флотилия в море.\n- Жёлтое кольцо - свободное место.\n- Серый знак - место ещё не открыто.\n\n§YСИЛА ФЛОТА§!\nБольше §Y2§! кораблей повышают удачу набега, больше §Y5§! - ещё сильнее."
 NAM_pw_marine_label:0 "Морская пехота"
 NAM_pw_marine_value:0 "подготовлено §Y[?NAM_marine_orders_paid|0]§! из §Y[?NAM_marine_order_cap|0]§!"
 NAM_pw_marine_tt:0 "§YПРИКАЗЫ МОРСКОЙ ПЕХОТЕ§!\nДоступно приказов: §Y[?NAM_marine_order_cap|0]§! £divisions_texticon, предел §Y3§!.\nЦена дивизии: §Y50§! добычи и §Y4300§! £manpower_texticon.\nГотовность: к началу войны возвращения.\n\n§YОБОЗНАЧЕНИЯ§!\n- Жёлтый щит - обученная дивизия.\n- Кольцо - свободный приказ.\n- Серый щит - приказ ещё не открыт.\n\n§YОТМЕНА§!\nДо войны приказы можно отменить решением: добыча и люди вернутся."
 NAM_pw_actions_locked:0 "Чёрный рынок, скупщиков, учения и морскую пехоту откроют фокусы изгнания."
