 NAM_admin_district_guard_contract:0 "Закупить снаряжение для дружин"
 NAM_admin_district_guard_contract_delivered_tt:0 "§G+6000§! £infantry_equipment_texticon, §G+60§! £support_equipment_texticon. §Y+5%§! $NAM_ladder_bop$."
 NAM_admin_district_guard_contract_result_tt:0 "Через §Y28§! £time_texticon дн.: §G+6000§! £infantry_equipment_texticon, §G+60§! £support_equipment_texticon. §Y+5%§! $NAM_ladder_bop$."
 NAM_admin_district_guard_contract_desc:0 "Цена: §Y35§! £political_power_texticon §Y200§! £ADISCORD_economy_treasury_texticon. Срок: §Y28§! £time_texticon дн. Повтор через §Y90§! £time_texticon дн. после завершения.\n\nОкруга заключат оплаченный заказ для своих дружин и общей армии. Соглашение требует устойчивой поддержки советов и действует также после ресурсной войны.\n§G+6000§! £infantry_equipment_texticon, §G+60§! £support_equipment_texticon. §Y+5%§! $NAM_ladder_bop$.\nПоддержка округов: не меньше §Y55§! £NAM_support_dist_texticon при запуске и завершении. Падение ниже порога отменяет программу и возвращает оплату.\n\nПри капитуляции, подчинении или утрате условий программы вся оплата возвращается. Война и смена дерева сами по себе не отменяют заказ. Все результаты получает Светлогорье."
