 NAM_corp_buy_arms: "Оружие от инвесторов"
 NAM_corp_buy_arms_desc: "Компании, которым нужен порядок на островах, охотно продают оружие правительству, которое этот порядок обеспечит."
 NAM_cost_corp_arms: "§Y60§! капитала"
 NAM_cost_corp_arms_blocked: "§R60§! капитала"
 NAM_cost_corp_arms_tooltip: "§Y60§! капитала"
 NAM_corp_spend_60_tt: "Иностранный капитал: §R-60§!."
 NAM_corp_influence_up_2_tt: "Влияние корпораций: §R+2§!."
 NAM_corp_curb_influence: "Обуздать правления"
 NAM_corp_curb_influence_desc: "На публичные слушания принесли договоры, подписанные за закрытыми дверями. Окружные представители требуют зачитать спорные статьи вслух. Юристы компаний переглядываются и просят время для совещания."
 NAM_corp_influence_above_zero_tt: "Влияние корпораций выше §Y0§!"
 NAM_corp_curb_tt: "Влияние корпораций: §G-10§!."
 NAM_corp_court_investors: "Привлечь инвесторов"
 NAM_corp_court_investors_desc: "В порту встречают поверенных иностранных компаний. На совете их ждут карты островов и проекты новых договоров. Секретарь придвигает к столу дополнительные кресла, пока гости называют тех, от чьего имени приехали."
 NAM_corp_court_tt: "Иностранный капитал: §G+40§!.\nВлияние корпораций: §R+10§!."
 NAM_order_marines_corp: "Морская пехота на капитал инвесторов"
 NAM_order_marines_corp_desc: "Представители инвесторов приезжают на береговой полигон в начищенных ботинках. Морские пехотинцы встречают их с песком на форме и солью на лицах. Для одних возвращение остаётся деловым предприятием, для других - дорогой домой."
 NAM_cost_order_marines_corp: "§Y60§! капитала §Y4300§! £manpower_texticon"
 NAM_cost_order_marines_corp_blocked: "§R60§! капитала §R4300§! £manpower_texticon"
 NAM_cost_order_marines_corp_tooltip: "§Y60§! капитала §Y4300§! £manpower_texticon\nДо войны возвращения капитал и люди возвращаются при отмене приказа."
 NAM_order_marines_corp_tt: "§YИностранный капитал:§! §R-60§!.\nВ начале первой войны возвращения: §G1§! £divisions_texticon полностью оснащённая дивизия - четыре батальона морской пехоты и сапёрная рота.\n\nПодготовленные части усиливают десант в $STATE_700$ до трёх дивизий; остальные формируются в островной столице.\nПри готовности к возвращению от §Y70§! третья дивизия десанта бесплатная, поэтому все оплаченные части появляются на островах.\nЕсли высадка недоступна, весь десант остаётся на островах.\n\nДо войны приказ можно отменить с возвратом капитала и людей.\n\nЛьготный заказ и бесплатный десант действуют только для первого похода. До первой доставки состав шаблона фиксирован; обычный набор по нему доступен."
 NAM_order_marines_corp_release: "Отменить приказы о морской пехоте"
 NAM_order_marines_corp_release_desc: "На береговом полигоне смолкают команды. Офицеры собирают ведомости, а бойцы укладывают личные вещи, не зная, когда снова услышат приказ о возвращении."
 NAM_order_marines_corp_release_tt: "За каждую из §Y[?NAM_marine_orders_paid|0]§! подготовленных дивизий возвращаются §G60§! капитала и §G4300§! £manpower_texticon."
 ADISCORD_nam_resource_war.101.t: "Правления требуют гарантий"
 ADISCORD_nam_resource_war.101.d: "Представители иностранных компаний пришли в правительство не с просьбой, а с проектом указа. Их правления вложили в острова слишком много, чтобы зависеть от настроений совета: они требуют гарантий от национализации, мест в бюджетных комиссиях и права назначать управляющих свободных зон.\n\nВебер помнит, как начиналось подполье: с людей, которым не оставили голоса. Теперь голоса требуют те, кто платит за возвращение. Отказ обойдётся в политический вес, уступка - в будущее правительства, а молчание будет прочитано как согласие."
 ADISCORD_nam_resource_war.101.a: "Отклонить проект указа."
 ADISCORD_nam_resource_war.101.b: "Подписать гарантии."
 ADISCORD_nam_resource_war.101.c: "Отложить ответ."
 NAM_corp_101_a_tt: "Влияние корпораций: §G-8§!."
 NAM_corp_101_b_tt: "Иностранный капитал: §G+40§!.\nВлияние корпораций: §R+5§!."
 NAM_corp_101_c_tt: "Влияние корпораций: §R+2§!."
 ADISCORD_nam_resource_war.102.t: "Правления требуют печатей"
 ADISCORD_nam_resource_war.102.d: "Совет директоров объединённых компаний прислал в правительство уже не проект, а ультиматум. Корпорации требуют передать им управление островами: бюджет, полицию порта и право подписывать договоры от имени Светлогорья. Без этого, говорят они, деньги на возвращение кончатся завтра.\n\nВ правительстве понимают, что за ультиматумом стоят не только счета. Охрану складов, причалы и половину транспортов давно оплачивают компании. Остановить их ещё можно - чрезвычайным указом или выкупом долей. Уступить - значит готовиться к дню, когда печати перейдут в чужие руки."
 ADISCORD_nam_resource_war.102.a: "Чрезвычайный указ."
 ADISCORD_nam_resource_war.102.b: "Выкупить доли."
 ADISCORD_nam_resource_war.102.c: "Отдать им места в совете."
 NAM_corp_102_a_tt: "Влияние корпораций: §G-20§!."
 NAM_corp_102_b_tt: "Иностранный капитал: §R-150§!.\nВлияние корпораций: §G-15§!."
 NAM_corp_102_c_tt: "Иностранный капитал: §G+80§!.\nВлияние корпораций: §R+5§!.\nЕсли влияние продержится на §Y90§! или выше три месяца или достигнет §Y100§!, корпорации возьмут власть."
 ADISCORD_nam_resource_war.103.t: "Совет директоров берёт власть"
 ADISCORD_nam_resource_war.103.d: "Утром в здание правительства вошли не солдаты, а юристы. Совет директоров объединённых компаний представил решение, под которым уже стояли подписи большинства министров: управление островами передаётся правлениям, а правительство возглавит Марк Ольшанский. Охрана порта, оплаченная компаниями, заняла причалы ещё ночью.\n\nЯрослав Вебер остаётся в правительстве, но больше не руководит им. Курс на федерацию юга никто не отменял - правления лишь пересчитали его в акциях. Свободные острова стали корпоративным Светлогорьем, и каждым островом теперь управляет совет директоров."
 ADISCORD_nam_resource_war.103.a: "Акционеры довольны."
 NAM_corp_takeover_tt: "§YВЛАСТЬ§!\nПравительство возглавляет §YМарк Ольшанский§! (коммерческий гедонизм); правящая партия - гедонисты.\nСтрана становится §YКорпоративным Светлогорьем§!.\n\n§YОСТРОВА§!\nКаждый наш остров получает §YПравление корпорации§!: ресурсы §G+15%§!, скорость строительства §G+15%§!, призывное население §R-20%§!.\n\n§YВЛИЯНИЕ КОРПОРАЦИЙ§!\nВлияние корпораций закреплено на §Y100§!: исследования §G+10%§!, эффективность §G+8%§!, торговый доход §G+25%§!, стабильность §R-5%§! £stability_texticon, политическая власть §R-15%§! £political_power_texticon. Обуздать правления больше нельзя.\n\n§YФЕДЕРАЦИЯ И ФОКУСЫ§!\nКурс гуманистов на федерацию юга сохраняется.\nКаждый федеральный округ переходит к одной из шести корпораций: она даёт округу свой профиль и платит совету правлений дивиденды каждый месяц.\nОткрывается дерево фокусов §Yсовета правлений§!; завершённые фокусы гуманистов сохраняются."
 NAM_corporate_state: "Корпоративное Светлогорье"
 NAM_corporate_state_ADJ: "$NAM_ADJ$"
 NAM_corporate_state_DEF: "Корпоративное Светлогорье"
 # Great war of return and the southern settlement
 NAM_war_of_return_ready_compromise: "Светлогорье пережило компромиссный мир, дань выплачена, страна независима и не воюет, а хотя бы один утраченный промысел или Южная Гавань принадлежит независимой стране вне нашего союза"
 NAM_war_of_return_terms_compromise: "Война идёт против нынешних владельцев утраченных промыслов. Капитуляция всех владельцев вернёт промыслы Светлогорью; наша капитуляция приведёт к полному разделу страны. Срока у войны нет: она идёт до полной капитуляции одной из сторон."
 NAM_wor_coalition_faction: "Южная оборонительная коалиция"
