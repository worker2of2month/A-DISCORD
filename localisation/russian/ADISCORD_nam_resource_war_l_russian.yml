 # Ladder of seals: favours
 NAM_favour_nam: "Милость наместникам"
 NAM_favour_nam_desc: "На §Y120 дней§! наместники сами распоряжаются назначениями в своих округах и взамен исправно собирают налоги. Милость стоит §Y15§! поддержки наместников; новая милость возможна не раньше чем через §Y180 дней§!."
 NAM_favour_nam_ready_tt: "Поддержка наместников не ниже §Y70§!"
 NAM_favour_nam_tt: "Поддержка наместников: §R-15§!.\nЛестница печатей смещается к вертикали на §Y0.10§!."
 NAM_favour_oil: "Милость промыслам"
 NAM_favour_oil_desc: "На §Y120 дней§! нефтяники получают часть выручки и сами распределяют смены. Милость стоит §Y15§! поддержки нефтяников; новая милость возможна не раньше чем через §Y180 дней§!."
 NAM_favour_oil_ready_tt: "Поддержка нефтяников не ниже §Y70§!"
 NAM_favour_oil_tt: "Поддержка нефтяников: §R-15§!.\nЛестница печатей смещается к округам на §Y0.05§!."
 NAM_favour_dist: "Милость округам"
 NAM_favour_dist_desc: "На §Y120 дней§! округа сами распоряжаются стройками, школами и местными сборами. Милость стоит §Y15§! поддержки округов; новая милость возможна не раньше чем через §Y180 дней§!."
 NAM_favour_dist_ready_tt: "Поддержка округов не ниже §Y70§!"
 NAM_favour_dist_tt: "Поддержка округов: §R-15§!.\nЛестница печатей смещается к округам на §Y0.10§!."
 NAM_favour_garr: "Милость гарнизонам"
 NAM_favour_garr_desc: "На §Y120 дней§! гарнизоны получают первоочередное снабжение и право набора. Милость стоит §Y15§! поддержки гарнизонов; новая милость возможна не раньше чем через §Y180 дней§!."
 NAM_favour_garr_ready_tt: "Поддержка гарнизонов не ниже §Y70§!"
 NAM_favour_garr_tt: "Поддержка гарнизонов: §R-15§!.\nЛестница печатей смещается к вертикали на §Y0.05§!."
 NAM_favour_trade: "Милость конторам"
 NAM_favour_trade_desc: "На §Y120 дней§! экспортные конторы получают льготные пошлины и долю в каждом контракте. Милость стоит §Y15§! поддержки контор; новая милость возможна не раньше чем через §Y180 дней§!."
 NAM_favour_trade_ready_tt: "Поддержка экспортных контор не ниже §Y70§!"
 NAM_favour_trade_tt: "Поддержка экспортных контор: §R-15§!."
 NAM_favour_nam_idea: "Милость наместникам"
 NAM_favour_nam_idea_desc: "Наместники получили свою долю власти и платят за неё исправными сборами и послушными управами."
 NAM_favour_oil_idea: "Милость промыслам"
 NAM_favour_oil_idea_desc: "Промыслы работают на себя и потому работают лучше: смены полные, насосы исправны."
 NAM_favour_dist_idea: "Милость округам"
 NAM_favour_dist_idea_desc: "Округа строят то, что нужно им самим, и не ждут разрешения канцелярии на каждый мост."
 NAM_favour_garr_idea: "Милость гарнизонам"
 NAM_favour_garr_idea_desc: "Гарнизоны первыми получают снаряжение и людей и отвечают на это дисциплиной."
 NAM_favour_trade_idea: "Милость конторам"
 NAM_favour_trade_idea_desc: "Конторы торгуют на льготных условиях и делятся с казной прибылью, которой раньше не было."
 NAM_seal_junta: "Хунта печатей"
 NAM_seal_junta_desc: "Новый правитель взял печати силой. Канцелярия исполняет приказы быстрее, чем когда-либо, но люди помнят, как он пришёл к власти."

 # Ladder of seals: endings
 NAM_spirit_iron_ladder: "Железная лестница"
 NAM_spirit_iron_ladder_desc: "Каждая ступень лестницы закреплена законом и гарнизоном. Приказ проходит от канцелярии до последнего поста без споров - и без права на ошибку."
 NAM_spirit_service_republic: "Республика службы"
 NAM_spirit_service_republic_desc: "Должность в Светлогорье - это обязанность, а не владение. Чиновники отвечают за результат, а не за печать под ним."
 NAM_spirit_federation: "Хартия округов"
 NAM_spirit_federation_desc: "Округа решают свои дела сами, а общий совет - общие. Власть медленнее, но её решения исполняют без принуждения."
 NAM_spirit_oil_union: "Союз нефтяных районов"
 NAM_spirit_oil_union_desc: "Промыслы и районы связаны общим договором: каждая бочка учтена, каждая доля выплачена, и нефть работает на всю страну."
 NAM_ending_coup_leader_tt: "Правитель, взявший печати силой, остаётся во главе страны и сохраняет свой курс."
 NAM_ending_iron_leader_tt: "§YЕгор Ром§! правит как глава железной лестницы (§Yэтатизм§!)."
 NAM_ending_iron_name_tt: "Страна принимает название §YСветлогорье печатей§!."
 NAM_ending_iron_ladder_tt: "Лестница печатей смещается к вертикали на §Y0.20§!.\nСоперники больше не выдвигают требований."
 NAM_ending_service_leader_tt: "§YЕгор Ром§! правит как глава республики службы (§Yслужебный этатизм§!)."
 NAM_ending_service_name_tt: "Страна принимает название §YРеспублика службы Светлогорья§!."
 NAM_ending_service_ladder_tt: "Лестница печатей смещается к округам на §Y0.10§!.\nСоперники больше не выдвигают требований."
 NAM_ending_federation_leader_tt: "Совет округов возглавляет §YНадежда Ладыгина§!. Правящей становится §YСветлогорская Гражданская Лига§! (§Yгуманизм§!); выборы не проводятся."
 NAM_ending_federation_name_tt: "Страна принимает название §YФедерация округов Светлогорья§!."
 NAM_ending_federation_ladder_tt: "Лестница печатей смещается к округам на §Y0.20§!.\nСоперники больше не выдвигают требований."
 NAM_ending_oil_union_leader_tt: "Союз нефтяных районов возглавляет §YКирилл Мезенцев§! (§Yконтрактный этатизм§!); Егор Ром уходит из руководства."
 NAM_ending_oil_union_name_tt: "Страна принимает название §YСоюз нефтяных районов Светлогорья§!."
 NAM_ending_oil_union_ladder_tt: "Лестница печатей смещается к округам на §Y0.10§!.\nСоперники больше не выдвигают требований."

 # Ladder of seals: declaration and rivals
 ADISCORD_nam_groups.12.t: "Декларация Светлогорья"
 ADISCORD_nam_groups.12.d: "Воркерланд распался, и телеграф больше не приносит распоряжений из столицы. В зале канцелярии Егор Ром зачитывает декларацию независимости перед наместниками, комендантами и представителями округов. Текст готов, подписей нет: каждая сторона хочет, чтобы её подпись стояла первой.\n\nНаместники напоминают, что именно лестница печатей удержала промыслы от распада. Округа отвечают, что без их согласия декларация останется ещё одной бумагой, которую некому исполнять. Первая подпись ничего не решит навсегда, но покажет, на ком новое государство собирается держаться."
 ADISCORD_nam_groups.12.a: "Первыми подписывают наместники."
 ADISCORD_nam_groups.12.b: "Первыми подписывают округа."
 NAM_declaration_vertical_tt: "Поддержка наместников: §G+5§!."
 NAM_declaration_districts_tt: "Поддержка округов: §G+5§!."
 NAM_rival_name_1: "$NAM_Vera_Pechat$"
 NAM_rival_name_2: "$NAM_Arseny_Klyuch$"
 NAM_rival_name_3: "$NAM_Taras_Shtyk$"
 NAM_rival_name_4: "$NAM_Lev_Gavanov$"
 NAM_rival_pillar_1: "Наместники"
 NAM_rival_pillar_2: "Нефтяники"
 NAM_rival_pillar_3: "Гарнизоны"
 NAM_rival_pillar_4: "Экспортные конторы"
 NAM_rival_term_1: "§Y100§! £political_power_texticon на реестр печатей"
 NAM_rival_term_2: "§Y8000§! £fuel_texticon для хранилищ Ключевска"
 NAM_rival_term_3: "§Y5000§! £manpower_texticon пополнения гарнизонам"
 NAM_rival_term_4: "§Y200§! £ADISCORD_economy_treasury_texticon портовым конторам"
 NAM_rival_refusal_heard: "Соперника выслушали на совете: поддержка группы «[NAMGetRivalPillar]» снизится на §R8§!, но он не станет требовать власти."
 NAM_rival_refusal_coup: "Поддержка группы «[NAMGetRivalPillar]» снизится на §R15§!.\n§RОпора уже слабее 25: [NAMGetRivalName] потребует руководства страной.§!"
 NAM_rival_refusal_plain: "Поддержка группы «[NAMGetRivalPillar]» снизится на §R15§!. Если опора окажется слабее §Y25§!, следующий отказ даст сопернику повод потребовать власти."
 ADISCORD_nam_groups.20.t: "Требование: [NAMGetRivalName]"
 ADISCORD_nam_groups.20.d_pechat: "Вера Сабурова пришла без предупреждения и положила на стол реестр назначений. Половина печатей наместников просрочена, новые бланки не оплачены. Она требует вложить в реестр 100 £political_power_texticon и даёт канцелярии 60 дней.\n\nНаместники стоят за ней. Если отказать, она не станет спорить: она просто перестанет регистрировать назначения, и лестница начнёт осыпаться по ступеням."
 ADISCORD_nam_groups.20.d_klyuch: "Арсений Тарханов приехал из Ключевска с делегацией мастеров. Хранилища промыслов пусты: армия и экспорт забрали всё. Он требует вернуть промыслам 8000 £fuel_texticon в течение 60 дней, иначе нефтяники перестанут считать канцелярию своей.\n\nТарханов говорит спокойно, но мастера за его спиной молчат так, как молчат перед стачкой."
 ADISCORD_nam_groups.20.d_shtyk: "Тарас Дроздов прислал рапорт, а не просьбу. Гарнизоны недоукомплектованы, посты стоят по одному человеку, и комендант требует 5000 £manpower_texticon пополнения в течение 60 дней.\n\nВ конце рапорта он напоминает, что солдаты помнят, кто их кормит. Это можно прочесть как заботу о службе. Можно - как предупреждение."
 ADISCORD_nam_groups.20.d_gavanov: "Лев Корнилов принимает гостей в Южной гавани и говорит о торговле со всем миром. Портовым конторам нужны деньги на причалы и страховку грузов: 200 £ADISCORD_economy_treasury_texticon в течение 60 дней.\n\nКорнилов обещает, что вложения вернутся. Он не обещает, что конторы останутся верны, если канцелярия откажет."
 ADISCORD_nam_groups.20.a: "Принять условия."
 ADISCORD_nam_groups.20.b: "Отказать."
 NAM_rival_demand_accept_tt: "Начинается задание на §Y60 дней§!: как только у нас будет [NAMGetRivalTerm], условие будет исполнено и списано, а поддержка группы «[NAMGetRivalPillar]» вырастет на §G10§!. Истечение срока будет считаться отказом."
 NAM_rival_demand_refuse_tt: "[NAMGetRivalRefusal]"
 NAM_rival_demand: "Условия соперника"
 NAM_rival_demand_desc: "[NAMGetRivalName] ждёт: [NAMGetRivalTerm]. Как только мы сможем это отдать, условие будет исполнено. Истечение срока будет считаться отказом."
 NAM_rival_demand_met_tt: "У нас есть [NAMGetRivalTerm]"
 NAM_rival_demand_paid_tt: "Отдаём [NAMGetRivalTerm].\nПоддержка группы «[NAMGetRivalPillar]»: §G+10§!."
 NAM_rival_demand_broken_tt: "Срок истёк, обещание нарушено. [NAMGetRivalRefusal]"
 ADISCORD_nam_groups.21.t: "[NAMGetRivalName] требует печатей"
 ADISCORD_nam_groups.21.d_pechat: "Утром регистратура не открылась. Вера Сабурова вывезла реестр назначений в здание наместничества, и без её подписи ни одна управа не может сменить начальника. Наместники собрались вокруг неё и требуют, чтобы канцелярию возглавил человек, который знает, где лежит каждая печать.\n\nЕсли уступить, Светлогорьем будет править реестр. Если сопротивляться, понадобятся гарнизоны или улицы - и кто-то из них должен быть на нашей стороне."
 ADISCORD_nam_groups.21.d_klyuch: "Ключевские промыслы остановились по приказу Арсения Тарханова. Мастера не бастуют - они ждут, кого признает канцелярия. Тарханов предлагает простую сделку: нефть потечёт снова, когда страной будет управлять тот, кто её добывает.\n\nБез Ключевска у Светлогорья нет ни топлива, ни денег. Уступить - значит отдать государство промыслам. Сопротивляться можно, но для этого нужен кто-то, кто не зависит от его нефти."
 ADISCORD_nam_groups.21.d_shtyk: "Гарнизоны Светлогорска заняли перекрёстки, телеграф и вокзал. Тарас Дроздов называет это мерами безопасности и требует передать ему руководство страной, пока соседи не воспользовались слабостью канцелярии.\n\nАрестовать коменданта некому: гарнизоны подчиняются ему. Остаются только округа - если они выйдут на улицы, солдатам придётся выбирать, в кого целиться."
 ADISCORD_nam_groups.21.d_gavanov: "Южная гавань закрыта. Лев Корнилов задержал танкеры у причалов и объявил, что порт подчиняется только тому правительству, которое умеет торговать. Заморские покупатели уже спрашивают, с кем теперь подписывать контракты.\n\nКорнилов не держит армии, но держит деньги и выход к морю. Если уступить, Светлогорье станет торговым домом. Если сопротивляться, гарнизонам или округам придётся вернуть гавань."
 ADISCORD_nam_groups.21.a: "Арестовать мятежника."
 ADISCORD_nam_groups.21.b: "Вывести округа на улицы."
 ADISCORD_nam_groups.21.c: "Уступить печати."
 NAM_rival_can_arrest_tt: "Мятежник не командует гарнизонами, у гарнизонов не меньше §Y50§! поддержки, есть §Y75§! £political_power_texticon"
 NAM_rival_can_rally_tt: "У округов не меньше §Y60§! поддержки, лестница печатей склоняется к округам"
 NAM_coup_arrest_tt: "[NAMGetRivalName] навсегда уходит из политики Светлогорья.\nПоддержка группы «[NAMGetRivalPillar]»: §R-10§!."
 NAM_coup_rally_tt: "[NAMGetRivalName] навсегда уходит из политики Светлогорья.\nПоддержка групп:\n  Наместники: §R-10§!\n  Округа: §G+5§!"
 NAM_coup_yield_tt: "§R[NAMGetRivalName] становится главой Светлогорья до конца его пути§!; Егор Ром уходит в отставку.\nНа §Y365 дней§! вводится §Yхунта печатей§!.\nПоддержка группы «[NAMGetRivalPillar]»: §G+15§!, поддержка округов: §R-10§!.\nЛестница печатей смещается к вертикали на §Y0.15§!; подполье: §R+10§!.\nСоперники больше не выдвигают требований."

 # Underground
 NAM_underground: "Подполье Ярослава Ветра"
 NAM_underground_desc: "Сила подполья: §Y[?NAM_underground|0]§! / 100. [NAMGetUndergroundStatus]\n\nКаждый месяц подполье растёт на §Y2§!, пока поддержка округов ниже §Y40§!, и ещё на §Y1§!, пока лестница печатей склоняется к вертикали; оплаченный договор Светлогорска снижает его на §Y3§!. В начале ресурсной войны сила §Y60§! и выше поднимает восстание наверняка, от §Y30§! до §Y59§! - с вероятностью §Y50%§!, ниже §Y30§! восстания не будет. Округа могут договориться с Ветром, вертикаль - искать его склады."
 NAM_underground_status_high: "§RВетер готов поднять город.§!"
 NAM_underground_status_mid: "§YПодполье может выступить.§!"
 NAM_underground_status_low: "§GПодполье слишком слабо для восстания.§!"
 NAM_underground_amnestied: "§GЯрослав Ветер принял амнистию; подполья больше нет.§!"
 NAM_veter_talks_1: "Первая встреча с Ветром"
 NAM_veter_talks_1_desc: "Посредники округов передают Ярославу Ветру предложение встретиться. Переговоры займут §Y30 дней§!. Если до их конца в Светлогорске начнётся восстание, переговоры прервутся, а потраченная политическая власть не вернётся."
 NAM_veter_talks_possible_tt: "Подполье существует, восстание не началось, Светлогорье действует"
 NAM_veter_talks_started_tt: "Через §Y30 дней§! переговоры дадут результат, если их не прервут."
 NAM_veter_talks_1_tt: "Подполье: §G-10§!.\nПоддержка округов: §G+3§!.\nОткрывается второй раунд переговоров."
 NAM_veter_talks_1_cancel_tt: "Переговоры прерваны. Потраченная политическая власть не возвращается."
 NAM_veter_talks_2: "Вторая встреча: списки и гарантии"
 NAM_veter_talks_2_desc: "Ветер требует гарантий: открытых списков задержанных и оплаченной службы для тех, кто выйдет из подполья. Переговоры займут §Y30 дней§!; если их прервут, казна вернёт свой взнос, а политическая власть останется потраченной."
 NAM_veter_talks_2_started_tt: "Казна: §R-100§! £ADISCORD_economy_treasury_texticon.\nЧерез §Y30 дней§! переговоры дадут результат, если их не прервут."
 NAM_veter_talks_2_cancel_tt: "Переговоры прерваны. Казна: §G+100§! £ADISCORD_economy_treasury_texticon; потраченная политическая власть не возвращается."
 NAM_veter_talks_2_tt: "Подполье: §G-10§!.\nПоддержка групп:\n  Округа: §G+5§!\n  Наместники: §R-3§!\nОткрывается последний раунд - амнистия."
 NAM_veter_talks_3: "Амнистия Ярослава Ветра"
 NAM_veter_talks_3_desc: "Последний раунд: канцелярия публикует амнистию, а Ветер выводит людей из подполья. Нужны поддержка округов и §Y45 дней§! переговоров; если их прервут, казна вернёт свой взнос, а политическая власть останется потраченной."
 NAM_veter_amnesty_backing_tt: "Поддержка округов не ниже §Y50§!"
 NAM_veter_talks_3_started_tt: "Казна: §R-200§! £ADISCORD_economy_treasury_texticon.\nЧерез §Y45 дней§! будет объявлена амнистия, если переговоры не прервут."
 NAM_veter_talks_3_cancel_tt: "Переговоры прерваны. Казна: §G+200§! £ADISCORD_economy_treasury_texticon; потраченная политическая власть не возвращается."
 NAM_veter_amnesty_tt: "§GПодполье распускается навсегда: Светлогорского восстания не будет.§!\n§YЯрослав Ветер§! поступает на службу Светлогорью как генерал.\nПоддержка групп:\n  Округа: §G+10§!\n  Наместники: §R-5§!\nЛестница печатей смещается к округам на §Y0.10§!."
 NAM_cost_veter_talks_2: "§Y50§! £political_power_texticon §Y100§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_veter_talks_2_blocked: "§R50§! £political_power_texticon §R100§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_veter_talks_2_tooltip: "§Y50§! £political_power_texticon §Y100§! £ADISCORD_economy_treasury_texticon\nЦена списывается в начале переговоров. Если их прервут, казна вернётся, а политическая власть - нет."
 NAM_cost_veter_talks_3: "§Y75§! £political_power_texticon §Y200§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_veter_talks_3_blocked: "§R75§! £political_power_texticon §R200§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_veter_talks_3_tooltip: "§Y75§! £political_power_texticon §Y200§! £ADISCORD_economy_treasury_texticon\nЦена списывается в начале переговоров. Если их прервут, казна вернётся, а политическая власть - нет."
 NAM_hunt_caches: "Найти склады подполья"
 NAM_hunt_caches_desc: "Инспекторы и полевые жандармы обыскивают округ. Найденное оружие пойдёт гарнизонам, но округа запомнят обыски. Округ можно обыскать снова через §Y180 дней§!."
 NAM_underground_left_tt: "Подполье ещё существует"
 NAM_caches_not_searched_tt: "Округ не обыскивали последние §Y180 дней§!"
 NAM_hunt_caches_tt: "Подполье: §G-10§!.\nПоддержка округов: §R-5§!."
 ADISCORD_nam_groups.30.t: "Ярослав Ветер выходит из подполья"
 ADISCORD_nam_groups.30.d: "Третий раунд переговоров закончился не в задней комнате, а на площади у вокзала. Ярослав Ветер пришёл без охраны и передал представителям округов списки своих складов. Взамен канцелярия публикует амнистию: никого из подполья не будут преследовать за прошлое, если он сложит оружие.\n\nВетер не стал союзником власти. Он стал человеком, которому округа доверяют больше, чем канцелярии, и который теперь будет служить в армии Светлогорья. Восстания в Светлогорске больше не будет - разве что канцелярия снова перестанет отвечать на прошения."
 ADISCORD_nam_groups.30.a: "Пусть город запомнит этот день."

 # Mobilisation reports
 NAM_orders_delivered_tt: "В строй вышли все оплаченные формирования: §Y[?NAM_orders_delivered|0]§!.\n  Гвардия промыслов: §Y[?NAM_orders_delivered_guard|0]§!\n  Полевая пехота: §Y[?NAM_orders_delivered_infantry|0]§!\n  Моторизованные дивизии: §Y[?NAM_orders_delivered_motor|0]§!\n  Береговые отряды: §Y[?NAM_orders_delivered_coastal|0]§!"
 NAM_orders_none_delivered_tt: "Оплаченных приказов о мобилизации не было: фронт держат постоянные части и три дивизии базового резерва."
 ADISCORD_nam_resource_war.24.t: "Мобилизация распущена"
 ADISCORD_nam_resource_war.24.d: "Соседи так и не перешли границу: штаб отменил военную тревогу, а войска коалиции вернулись в казармы. Срок, ради которого Светлогорье оплачивало мобилизацию, прошёл без войны.\n\nКанцелярия распустила все оплаченные формирования и вернула в бюджет то, что ещё можно было вернуть: казну, топливо и людей. Политический вес, потраченный на приказы, не возвращается."
 ADISCORD_nam_resource_war.24.a: "Пусть люди вернутся к работе."
 NAM_orders_refunded_tt: "Распущено формирований: гвардия промыслов §Y[?NAM_orders_refunded_guard|0]§!, полевая пехота §Y[?NAM_orders_refunded_infantry|0]§!, моторизованные дивизии §Y[?NAM_orders_refunded_motor|0]§!, береговые отряды §Y[?NAM_orders_refunded_coastal|0]§!.\nНабранные люди, казна и топливо моторизованных дивизий вернулись."

 # War of return
 NAM_war_of_return_ready_tt: "Светлогорье пережило поражение - по компромиссному миру или в изгнании на островах, дань выплачена, страна независима и не воюет, а хотя бы один утраченный промысел или Южная гавань принадлежит независимой стране вне нашего союза"
 NAM_war_of_return_start_tt: "Начинается §Yвойна возвращения§! против нынешних владельцев утраченных промыслов. Капитуляция всех владельцев вернёт промыслы Светлогорью; наша капитуляция приведёт к полному разделу страны; через §Y365 дней§! будет заключён мир по линии фронта."
 NAM_war_of_return_deadline: "Война возвращения"
 NAM_war_of_return_deadline_desc: "Дипломатический предел войны - §Y365 дней§!. Капитуляция всех владельцев промыслов вернёт их Светлогорью; наша капитуляция приведёт к полному разделу страны. К сроку стороны заключат мир по линии фронта: спорные промыслы останутся у тех, кто их удерживает."
 NAM_war_of_return_deadline_tt: "Белый мир по текущей линии фронта: каждый спорный промысел остаётся у стороны, которая его контролирует."
 ADISCORD_nam_resource_war.60.t: "Война возвращения"
 ADISCORD_nam_resource_war.60.d: "Армия, восстановленная после поражения, перешла новую границу. Светлогорье объявило войну тем, кто владеет его прежними промыслами и Южной гаванью, и требует вернуть Северные месторождения, Светлогорский округ, Южнобережье, Сухоречье и гавань.\n\nНа этот раз отступать некуда. Если мы проиграем, соседи заберут всё, что осталось на материке. Если победим, промыслы вернутся домой. Если ни одна армия не сломит другую, через год посредники проведут границу там, где будут стоять солдаты."
 ADISCORD_nam_resource_war.60.d_target: "Светлогорье объявило войну возвращения. Его армия требует вернуть промыслы, отошедшие нам по компромиссному миру. Если Светлогорье капитулирует, его земли будут окончательно разделены; если падут все нынешние владельцы промыслов, они вернутся Светлогорью. Через год посредники проведут границу по линии фронта."
 ADISCORD_nam_resource_war.60.a: "Вперёд, к промыслам."
 ADISCORD_nam_resource_war.60.b: "Мы будем защищать свою землю."
 NAM_war_of_return_terms_tt: "Капитуляция всех владельцев промыслов и гавани возвращает их нам.\nНаша капитуляция отнимет у Светлогорья весь материк; если у нас останутся острова, правительство уйдёт туда.\nЧерез §Y365 дней§! - мир по линии фронта."
 ADISCORD_nam_resource_war.62.t: "Итог войны возвращения"
 ADISCORD_nam_resource_war.62.d_won: "Последний владелец наших промыслов капитулировал. Посредники не понадобились: колонны Светлогорья уже стоят у вышек, а над управами снова висят наши флаги. Северные месторождения и остальные промыслы возвращаются домой.\n\nЦена была высокой, но теперь это цена, заплаченная за своё, а не за чужое решение."
 ADISCORD_nam_resource_war.62.d_front: "Срок войны истёк. Посредники провели границу по линии фронта: промыслы, которые удержала наша армия, остаются Светлогорью, остальные - у соседей. Никто не победил, но никто и не проиграл до конца.\n\nМир по линии фронта похож на перемирие. Обе стороны знают, где теперь стоят посты, и обе знают, сколько стоило их туда поставить."
 ADISCORD_nam_resource_war.62.a: "Возвращаемся к работе."

 # Punishment of the defeated coalition
 NAM_ruined_economy: "Разрушенная экономика"
 NAM_ruined_economy_desc: "Война за светлогорскую нефть разорила казну и заводы. Пока долги не выплачены, а мастерские не восстановлены, экономика работает вполсилы."
 NAM_army_of_shame: "Армия позора"
 NAM_army_of_shame_desc: "Армия проиграла войну, которую ей обещали выиграть за одну кампанию. Офицеры прячут глаза, солдаты не верят приказам, а новобранцы не спешат на призывные пункты."

 # Debug
 ADISCORD_nam_debug_rival_demand: "§RDEBUG:§! Требование соперника Светлогорья"
 ADISCORD_nam_debug_rival_demand_desc: "Сбрасывает перерыв цикла соперников и сразу проверяет, может ли соперник слабейшей опоры выдвинуть требование."
 ADISCORD_nam_debug_underground: "§RDEBUG:§! Подполье Светлогорья +30"
 ADISCORD_nam_debug_underground_desc: "Добавляет 30 к силе подполья Ярослава Ветра."
 ADISCORD_nam_debug_war_of_return: "§RDEBUG:§! Начать войну возвращения"
 ADISCORD_nam_debug_war_of_return_desc: "Вызывает производственный запуск войны возвращения. Если её условия не выполнены, в том числе пока идёт дань, ничего не произойдёт."

 # Notes of Egor Rom
 ADISCORD_nam_memoir.read_on: "Читать дальше."
 ADISCORD_nam_memoir.put_away: "Отложить записки."
 ADISCORD_nam_memoir.close: "Закрыть записки."
 ADISCORD_nam_memoir.1.t: "Записки Егора Рома. Печать"
 ADISCORD_nam_memoir.1.d: "Первую печать мне выдали в семнадцать лет. Она была деревянная, с обколотым краем, и ставилась только на накладные ключевской управы: сколько бочек принято, сколько отправлено, сколько пропало в пути. Пропадало всегда больше, чем писали. Старший писарь объяснил мне, что печать не удостоверяет правду - она удостоверяет, что правда больше никого не интересует.\n\nЯ запомнил это лучше, чем таблицу умножения. Через десять лет у меня была медная печать управы, через двадцать - печать наместника. С каждой ступенью их становилось больше, и каждая весила меньше: внизу печать решала, получит ли бригада жалованье, наверху - отправится ли очередное распоряжение в столицу, где его никто не прочтёт.\n\nВоркерланд построил нас как лестницу, по которой нефть спускалась вниз, а приказы поднимались вверх. Никто не спрашивал, куда ведёт лестница, если наверху никого нет."
 ADISCORD_nam_memoir.11.d: "Теперь я сижу в кабинете, где когда-то ждал приёма с папкой накладных, и сам ставлю последнюю печать. Иногда мне кажется, что лестницу можно разобрать и построить из неё дом. Иногда - что без неё здесь не останется ничего, кроме промыслов и людей, которые будут делить их кулаками.\n\nКирилл Мезенцев говорит, что я слишком много думаю о печатях и слишком мало о ведомостях. Он прав: ведомость показывает, кому мы должны. Но печать показывает, кто будет отвечать, когда платить станет нечем. Я хочу, чтобы этот ответ знал каждый, кто живёт в Светлогорье, - даже если ответом окажусь я.\n\nЗаписываю это не для потомков. Потомки прочтут только печати. Записываю для себя, чтобы помнить: деревянная печать с обколотым краем до сих пор лежит в ящике моего стола."
 ADISCORD_nam_memoir.2.t: "Записки Егора Рома. Ключевск"
 ADISCORD_nam_memoir.2.d: "Мой отец бурил скважины в Ключевске, пока скважина не забрала у него руку. Компенсацию ему выписали через четыре года: три подписи в управе, две в округе, одна в столице. К тому времени он уже не верил ни одной из них.\n\nКлючевск пахнет так же, как в моём детстве: сырой нефтью, горелой резиной и солёным ветром с Сухоречья. Вышки стоят там, где их поставили ещё первые наместники, и половина из них работает на честном слове мастеров. Арсений Тарханов называет эти промыслы своими, и в каком-то смысле он прав: никто другой не знает, где под землёй лежит каждая бочка.\n\nВ сводках промыслы - это цифры. На месте это люди, которые встают до рассвета и возвращаются в бараки, когда цифры уже отправлены по телеграфу."
 ADISCORD_nam_memoir.12.d: "Соседи говорят, что эта нефть принадлежала им, пока Воркерланд не передвинул границу. Возможно. Но кто из них спускался в ствол, когда в нём горел газ? Кто платил вдовам? Наши права на эти поля записаны не в договорах, а в больничных листах.\n\nЯ не скажу этого на переговорах: дипломаты не принимают больничные листы в качестве доказательства. Я скажу это на промыслах, и там меня поймут лучше, чем в любой канцелярии. Нефть сделала Светлогорье богатым на бумаге. Если мы не научимся делить её с теми, кто её добывает, она сделает нас бедными по-настоящему.\n\nОтец умер, так и не узнав, что его сын стал наместником. Наверное, это к лучшему: он бы спросил, когда придёт его компенсация."
 ADISCORD_nam_memoir.3.t: "Записки Егора Рома. Город и подполье"
 ADISCORD_nam_memoir.3.d: "В Светлогорске на стенах пишут то, что в канцелярии не произносят вслух. Я читаю эти надписи каждое утро по дороге в управу. Одни требуют хлеба, другие - открыть счета, третьи просто перечисляют фамилии чиновников. Мою фамилию пишут чаще других, и я считаю это признанием.\n\nЯрослава Ветра я знал ещё мальчишкой: он носил в управу прошения от своей улицы и ждал ответа в коридоре до вечера. Ответа он так и не получил. Потом прошения перестали приходить, а на стенах появились листовки за его подписью. Мне доложили, что у него есть склады, связные и люди в гарнизонах. Мне не доложили, почему мальчик с прошением стал человеком со складами. Это я знаю сам."
 ADISCORD_nam_memoir.13.d: "Инспекторы предлагают найти склады и закончить дело. Округа предлагают сесть с ним за стол. И те и другие правы, и в этом вся беда: подполье можно разгромить, но нельзя разгромить причину, по которой оно появилось.\n\nЕсли война придёт раньше, чем мы решим, Ветер выберет за нас. Он выведет людей на улицы в тот день, когда армия будет стоять у промыслов, и город станет третьим фронтом. Я не хочу воевать со Светлогорском. Но я не могу позволить Светлогорску решать за всю страну.\n\nСегодня на стене у вокзала было написано: «Печать не отвечает». Я остановил машину и долго смотрел на эти слова. Потом велел их не закрашивать."
 ADISCORD_nam_memoir.4.t: "Записки Егора Рома. Соседи"
 ADISCORD_nam_memoir.4.d: "В архиве лежат три карты бассейна. На первой граница идёт по реке, на второй - по старой дороге, на третьей её нет вовсе: Воркерланд рисовал карты для себя, а не для соседей. Эфлор держит в руках первую, Ажар - вторую. Нам досталась третья.\n\nЯ встречался с людьми из Эфлора и Ажара чаще, чем с собственными наместниками. Они не злодеи. Они помнят, как у них забрали землю, и считают, что пришло время вернуть долг. Беда в том, что долг давно вложен в вышки, трубы и бараки, в которых живут наши люди. Вернуть землю - значит выселить их. Не вернуть - значит воевать."
 ADISCORD_nam_memoir.14.d: "Самир Ажар считает топливо так же, как я считаю печати: каждую бочку и каждую подпись. С ним можно договориться, если цена названа заранее. Эфлор говорит языком обид, и с этим языком труднее: обиду нельзя оплатить цистернами.\n\nКаждый месяц давление на границе растёт. Мне приносят ноты, на которые нужно отвечать нотами, и сводки, на которые нужно отвечать приказами. Иногда мне кажется, что войну начнёт не политик, а писарь, который отправит не ту бумагу не в то ведомство.\n\nЯ велел хранить все три карты вместе. Когда всё закончится, кому-то придётся нарисовать четвёртую."
 ADISCORD_nam_memoir.5.t: "Записки Егора Рома. Что должно государство"
 ADISCORD_nam_memoir.5.d: "Меня часто спрашивают, кем я был при Воркерланде. Я отвечаю: человеком, который ставил печати под чужими решениями. Теперь решения мои, и печати тоже. Это оказалось тяжелее, чем я думал.\n\nГосударство, которое мы строим, не обязано быть добрым. Но оно обязано быть понятным: человек должен знать, куда идёт его налог, кто отвечает за задержку жалованья и к кому прийти, если отвечать никто не хочет. Империя не давала этих ответов, потому что ей не нужно было, чтобы её понимали. Нам это нужно, иначе нас не станут терпеть."
 ADISCORD_nam_memoir.15.d: "Наместники хотят, чтобы лестница осталась. Округа хотят, чтобы её разобрали. Я слишком долго поднимался по ней, чтобы поверить, что её можно просто выбросить, и слишком хорошо знаю её ступени, чтобы поверить, что она выдержит ещё одно поколение без ремонта.\n\nВозможно, я не тот человек, который закончит эту работу. Может быть, её закончит совет, может быть - кто-то из моих соперников, а может быть, она не закончится никогда. Но если через двадцать лет кто-нибудь в Светлогорье откроет мои записки и не поймёт, о чём я так беспокоился, значит, мы справились.\n\nНа этом я заканчиваю записки. Деревянную печать отдам в музей. Пусть лежит под стеклом и больше ничего не удостоверяет."

 # Archive documents
 ADISCORD_nam_archive.1.t: "Архив: письма в центр"
 ADISCORD_nam_archive.1.d: "В шкафу канцелярии нашлась папка исходящих писем в столицу за последние шесть лет. Сорок два письма о задержке жалованья, семнадцать - о нехватке труб, девять - о пожарах на промыслах. На каждом стоит отметка о регистрации. Ни на одном нет ответа.\n\nПоследнее письмо подписано самим Ромом: он просил разрешения расходовать местный резерв топлива на ремонт ключевских насосов. Внизу чужим почерком приписано карандашом: «Ждать указаний». Указаний не было.\n\nАрхивист спросил, куда убрать папку. Ром велел оставить её на столе в приёмной, чтобы каждый посетитель видел, сколько стоило ожидание."
 ADISCORD_nam_archive.1.a: "Пусть лежит на виду."
 ADISCORD_nam_archive.2.t: "Архив: черновики декларации"
 ADISCORD_nam_archive.2.d: "Черновик декларации независимости переписывали одиннадцать раз. В первом варианте Светлогорье называлось «временной администрацией», в пятом - «самоуправляемой территорией», в девятом впервые появилось слово «государство», и его дважды вычёркивали.\n\nВ окончательном тексте нет ни одного упоминания Воркерланда. Это предложила Вера Сабурова: государство, сказала она, не начинается с объяснений, почему оно больше не провинция. Подписи наместников стоят слева, подписи представителей округов - справа, а между ними осталось место, которое никто так и не заполнил.\n\nКопию отправили соседям. Ажар подтвердил получение на следующий день, Эфлор - через неделю."
 ADISCORD_nam_archive.2.a: "Подшить к делу номер один."
 ADISCORD_nam_archive.3.t: "Архив: тихие скважины"
 ADISCORD_nam_archive.3.d: "Сводка инспекции промыслов за квартал: пожаров - ноль, поджогов - ноль, листовок на вышках - две, обе старые. Впервые за десять лет графа «происшествия подполья» заполнена прочерком.\n\nК сводке приложена записка начальника охраны Ключевска: рабочие больше не прячут газеты, а мастера сами приходят сообщать о чужаках. Он пишет, что не знает, чья это заслуга - переговоров, облав или просто выплаченного вовремя жалованья, - и просит не менять ничего из перечисленного.\n\nРом подчеркнул последнюю фразу и отправил записку в канцелярию с пометкой: «Принять как инструкцию»."
 ADISCORD_nam_archive.3.a: "Принять как инструкцию."
 ADISCORD_nam_archive.4.t: "Архив: протокол совета опор"
 ADISCORD_nam_archive.4.d: "Протокол первого третейского совета опор занимает сорок страниц. Двадцать из них - споры о порядке выступлений. Наместники требовали говорить первыми, гарнизоны - последними, экспортные конторы предлагали тянуть жребий и готовы были за это заплатить.\n\nПо существу совет принял три решения: опоры спорят в канцелярии, а не на улицах; каждая жалоба получает ответ за тридцать дней; соперник, которого выслушали, не вправе требовать большего силой. Под протоколом стоят подписи Арсения Тарханова, Льва Корнилова, Тараса Дроздова и Веры Сабуровой. Подпись Дроздова поставлена с таким нажимом, что прорвала бумагу.\n\nРом приказал хранить оригинал в сейфе, а копии разослать во все управы."
 ADISCORD_nam_archive.4.a: "Разослать копии."
 ADISCORD_nam_archive.5.t: "Архив: план генерального штаба"
 ADISCORD_nam_archive.5.d: "План обороны бассейна сшит в три тома. Первый описывает дороги к промыслам и сроки переброски резервов, второй - рубежи и склады, третий - что делать, если первые два не помогут. Третий том самый тонкий.\n\nНа полях первого тома комендант гарнизонов написал: «Нефть не отступает». Начальник штаба приписал ниже: «Люди отступают, поэтому нужны дороги». Кто-то третий подчеркнул обе фразы и поставил вопросительный знак.\n\nПлан исходит из простого расчёта: соседи сильнее в поле, Светлогорье - на своих промыслах. Каждый удержанный день повышает для противника цену войны. Штаб просит денег на мобилизацию и честно предупреждает, что без неё эти тома станут просто аккуратной бумагой."
 ADISCORD_nam_archive.5.a: "Утвердить план."
 ADISCORD_nam_archive.6.t: "Архив: акт о границе"
 ADISCORD_nam_archive.6.d: "Акт демаркации новой границы подписан в пограничной будке, которую с двух сторон выкрасили в разные цвета. Комиссии спорили о каждом столбе, но в итоге согласились на линию, проведённую не по карте, а по настоящим постам, дорогам и колодцам.\n\nК акту приложены списки военнопленных, вернувшихся домой, и перечень промыслов, восстановленных после боёв. Последняя страница - короткое письмо эфлорского инженера, который просит разрешения навестить могилу брата на светлогорской стороне. Разрешение выдано в тот же день.\n\nАрхивист внёс акт в реестр под номером один. Прежние номера остались за документами, подписанными в чужой столице."
 ADISCORD_nam_archive.6.a: "Внести в реестр."

  # Focus trees: main, post-war chapter, defeat chapter
 NAM_metropolitan_quota:0 "Разнарядка метрополии"
 NAM_metropolitan_quota_desc:0 "Из Воркерланда пришла новая разнарядка на нефть, и в ней снова не сказано, чем за неё заплатят. Сначала соберём то, что лежит на промысловых складах, а потом решим, кому это достанется."
 NAM_deliver_the_quota:0 "Исполнить разнарядку"
 NAM_deliver_the_quota_desc:0 "Наместники привыкли измерять верность столице цистернами. Отправим квоту полностью: метрополия запомнит исполнительность канцелярии, а нефтяники - пустые резервуары."
 NAM_metropolitan_depots:0 "Склады метрополии"
 NAM_metropolitan_depots_desc:0 "Имперские склады в Светлогорье числятся за столицей, но охраняют их наши гарнизоны. Пока связь с Воркерландом ещё держится, оформим передачу винтовок, снаряжения и орудий местным частям законным порядком."
 NAM_concealed_reserve:0 "Резерв вне ведомости"
 NAM_concealed_reserve_desc:0 "Часть добычи можно списать на утечки, пожары и неисправные счётчики. Нефтяники сохранят её в отдельных резервуарах для Светлогорья, а наместники будут знать, что канцелярия солгала столице."
 NAM_letters_to_the_centre:0 "Письма в центр"
 NAM_letters_to_the_centre_desc:0 "Ром пишет в столицу каждую неделю, а ответы приходят всё реже. Сохраним копии: однажды по этой переписке станет ясно, когда империя перестала отвечать."
 NAM_independence_day:0 "Своя печать"
 NAM_independence_day_desc:0 "Воркерланд распался, и последний приказ из столицы так и остался без подписи. Светлогорье объявляет независимость: на печатях канцелярии больше нет чужого герба."
 NAM_neutral_basin:0 "Бассейн вне войны"
 NAM_neutral_basin_desc:0 "Эфлор и Ажар требуют вернуть земли, отнятые империей. Объявим бассейн нейтральным: Светлогорье никому не угрожает и готово торговать, если спор о границах решается за столом, а не на промыслах."
 NAM_basin_is_ours:0 "Бассейн принадлежит нам"
 NAM_basin_is_ours_desc:0 "Каждую вышку бассейна поставили здешние рабочие, а не эфлорские землемеры. Скажем это открыто и выведем гарнизоны к границе: соседи услышат вызов, но поймут, что даром промыслы не отдадут."
 NAM_provisional_statute:0 "Временный статут"
 NAM_provisional_statute_desc:0 "Независимость нельзя держать на старом положении о наместничестве. Временный статут определит, кто издаёт законы, кто их исполняет и кому на них жаловаться, пока страна не выберет постоянное устройство."
 NAM_rom_address:0 "Обращение Рома"
 NAM_rom_address_desc:0 "Егор Ром впервые выступает не как наместник, а как глава государства. Он не обещает лёгкой зимы; он обещает, что за каждым приказом теперь стоит человек, которого можно назвать по имени."
 NAM_tax_rolls:0 "Налоговые списки"
 NAM_tax_rolls_desc:0 "Старые списки плательщиков составляли для столицы, и половину округов они не учитывали вовсе. Новые списки пройдут по каждому промыслу и складу, и сборы наконец дойдут до собственной казны."
 NAM_namestnik_circuits:0 "Объезды наместников"
 NAM_namestnik_circuits_desc:0 "Наместники получают постоянные участки объезда и право решать споры на месте. Вертикаль становится ближе к людям, а её печать - тяжелее."
 NAM_district_assemblies:0 "Собрания округов"
 NAM_district_assemblies_desc:0 "Каждый округ созывает выборное собрание, которое утверждает местный сбор и проверяет наместника. Решения рождаются медленнее, но их уже не назовёшь чужими."
 NAM_seal_courts:0 "Суды печатей"
 NAM_seal_courts_desc:0 "Спор о подписи больше не выигрывает тот, у кого печать старше. Особые суды разберут жалобы на наместников и на округа по одному закону для обеих сторон."
 NAM_garrison_assembly:0 "Собрание гарнизонов"
 NAM_garrison_assembly_desc:0 "Комендантам есть что сказать о жалованье, казармах и границе. Дадим им собственное собрание, пока они не начали говорить через голову канцелярии."
 NAM_rivals_ledger:0 "Книга соперников"
 NAM_rivals_ledger_desc:0 "Арсений Тарханов, Лев Корнилов, Тарас Дроздов и Вера Сабурова ждут, когда одна из опор Рома ослабнет. Канцелярия заведёт учёт их сторонников и укрепит те опоры, на которые соперники рассчитывают больше всего."
 NAM_hear_klyuchevsk:0 "Выслушать Ключевск"
 NAM_hear_klyuchevsk_desc:0 "Арсений Тарханов, наместник Ключевска, говорит от имени промыслов: добыча должна оставаться в руках тех, кто её ведёт. Примем его условия - нефтяники откроют резервы, а портовые конторы останутся недовольны."
 NAM_hear_the_harbour:0 "Выслушать гавань"
 NAM_hear_the_harbour_desc:0 "Лев Корнилов держит причалы Южной гавани и рейсы на острова. Он просит суда и право фрахта; промыслы опасаются, что их нефть снова станет чужим товаром."
 NAM_hear_the_commandant:0 "Выслушать коменданта"
 NAM_hear_the_commandant_desc:0 "Комендант Тарас Дроздов требует оружия для гарнизонов и тишины в округах. Склады откроются для его солдат, а окружные собрания запомнят, чьё слово оказалось весомее."
 NAM_hear_the_registrar:0 "Выслушать регистратора"
 NAM_hear_the_registrar_desc:0 "Старший регистратор печатей Вера Сабурова знает, где хранится каждая подпись и каждое неудобное дело. Её поддержка укрепит канцелярию, но коменданты не любят, когда судьбу армии решают в архиве."
 NAM_pillar_arbitration:0 "Третейский суд опор"
 NAM_pillar_arbitration_desc:0 "Выслушав соперников, Ром садится между ними третейским судьёй. Ни одна опора не получит всего, но каждая уйдёт с бумагой, которую можно показать своим людям."
 NAM_underground_reports:0 "Сводки о подполье"
 NAM_underground_reports_desc:0 "В северном поясе снова находят листовки за подписью Ярослава Ветра. Сведём донесения полиции, промыслов и округов в одну сводку, чтобы понять, кто ему помогает и почему."
 NAM_veter_channel:0 "Канал к Ветру"
 NAM_veter_channel_desc:0 "Округа знают людей, которые знают Ветра. Через них канцелярия предложит говорить, а не стрелять; гарнизоны сочтут это слабостью."
 NAM_cache_hunters:0 "Охотники за тайниками"
 NAM_cache_hunters_desc:0 "Подполье живёт тайными складами оружия в заброшенных скважинах и шахтах. Особые группы гарнизонов будут искать их по всему поясу, не спрашивая разрешения округов."
 NAM_amnesty_lists:0 "Списки амнистии"
 NAM_amnesty_lists_desc:0 "Тот, кто сложит оружие до срока, не пойдёт под суд за прошлое. Округа составят списки, наместники - возражения, а сторонники Ветра впервые задумаются, стоит ли оставаться в подполье."
 NAM_mine_councils:0 "Советы промыслов"
 NAM_mine_councils_desc:0 "Рабочие советы получают право решать вопросы смен, безопасности и найма прямо на промыслах. Подполью становится нечего обещать, а добыча идёт без забастовок."
 NAM_informers:0 "Сеть осведомителей"
 NAM_informers_desc:0 "Каждый пятый подпольщик кому-то должен, а каждый десятый готов продать товарищей. Канцелярия платит за имена, и округа начинают бояться собственных соседей."
 NAM_field_gendarmes:0 "Жандармерия промыслов"
 NAM_field_gendarmes_desc:0 "Промыслы получают собственную вооружённую стражу, подчинённую прямо канцелярии. Она не даст подполью поджечь вышки, но и рабочим придётся трудиться под её надзором."
 NAM_quiet_wells:0 "Тихие скважины"
 NAM_quiet_wells_desc:0 "Впервые за много месяцев на промыслах не нашли ни одной листовки. Тишина ещё не означает согласия, но с ней уже можно планировать добычу."
 NAM_contract_bureau:0 "Контрактное бюро"
 NAM_contract_bureau_desc:0 "Светлогорье владеет большей частью нефти мира, но всё ещё продаёт её как колония - через чужих посредников. Бюро будет заключать топливные контракты от имени государства и следить, чтобы каждая единица добычи была обещана с выгодой."
 NAM_overseas_buyers:0 "Заморские покупатели"
 NAM_overseas_buyers_desc:0 "Кефрейт, Стеландер, Стеланд и Земля Хана готовы платить за нефть, если её можно принять с танкера. Южной гавани нужен наливной терминал, который обслуживает только морские рейсы."
 NAM_field_repair_crews:0 "Ремонтные бригады промыслов"
 NAM_field_repair_crews_desc:0 "Изношенные насосы и забитые стволы съедают добычу быстрее любой войны. Постоянные бригады будут восстанавливать скважины по заказу канцелярии, а не тогда, когда найдётся подрядчик."
 NAM_refinery_programme:0 "Программа переработки"
 NAM_refinery_programme_desc:0 "Завод рядом с промыслом превращает сырую нефть в топливо для собственной армии. Программа определит, где строить, и закрепит за каждым заводом бригаду нефтяников."
 NAM_klyuchevsk_pipeline:0 "Трасса Ключевского нефтепровода"
 NAM_klyuchevsk_pipeline_desc:0 "Нефть Сухоречья идёт в Южную гавань в цистернах, которые проще перехватить, чем охранять. Проложим по карте трассу нефтепровода и выкупим трубы со старых имперских складов."
 NAM_deep_wells:0 "Глубокие скважины"
 NAM_deep_wells_desc:0 "Под выработанными пластами Северных месторождений лежат горизонты, до которых империя так и не добралась. Новое бурение даст бассейну ещё одну единицу пропускной способности."
 NAM_fuel_depots:0 "Хранилища гавани"
 NAM_fuel_depots_desc:0 "Нефть без резервуаров приходится продавать сразу и по любой цене. Хранилища Южной гавани позволят копить топливо для армии и дожидаться выгодного покупателя."
 NAM_second_drilling_crew:0 "Вторая буровая партия"
 NAM_second_drilling_crew_desc:0 "Одна буровая партия ведёт только один проект за раз. Вторая позволит ремонтировать скважины на одном промысле и одновременно строить на другом."
 NAM_basin_roads:0 "Дороги бассейна"
 NAM_basin_roads_desc:0 "Между Северными месторождениями и Сухоречьем грузовики идут по колеям, которые размывает первый дождь. Твёрдые дороги ускорят подвоз и для промыслов, и для армии."
 NAM_mobilisation_office:0 "Мобилизационное управление"
 NAM_mobilisation_office_desc:0 "Соседи считают дни до войны, и встречать её одними гарнизонами нельзя. Управление примет оплаченные приказы на дивизии, которые выйдут на позиции в первый же день войны."
 NAM_line_survey:0 "Съёмка рубежей"
 NAM_line_survey_desc:0 "Топографы и сапёры пройдут вдоль границ каждого промыслового округа и отметят, где окопы задержат противника дольше всего. По их картам рубежи можно будет готовить заранее."
 NAM_line_engineers:0 "Инженеры рубежей"
 NAM_line_engineers_desc:0 "Опытные роты охраны промыслов берут на себя ещё один участок. Теперь рубежи можно готовить сразу в большем числе округов."
 NAM_reserve_rolls:0 "Списки резерва"
 NAM_reserve_rolls_desc:0 "Каждого, кто служил в гарнизонах при империи, вносят в списки с адресом и специальностью. Управление сможет принять ещё один приказ о мобилизации, не оголяя промыслы."
 NAM_motor_column_orders:0 "Заказ на моторные колонны"
 NAM_motor_column_orders_desc:0 "Промысловые грузовики могут возить не только трубы. Управление примет приказы на моторные колонны, которые успеют закрыть прорыв раньше, чем противник дойдёт до вышек."
 NAM_officer_courses:0 "Офицерские курсы"
 NAM_officer_courses_desc:0 "Командиры гарнизонов умеют нести караул, но не вести в бой дивизию. Ускоренные курсы при штабе дадут армии офицеров, которые знают и устав, и местность."
 NAM_coastal_battalions:0 "Береговые батальоны"
 NAM_coastal_battalions_desc:0 "Южная гавань - единственные морские ворота Светлогорья, и противник это знает. Береговая батарея прикроет вход в порт, а управление примет приказы на батальоны его обороны."
 NAM_coastal_watch:0 "Береговое наблюдение"
 NAM_coastal_watch_desc:0 "Посты на мысах и радиостанция гавани заметят чужой корабль раньше, чем он подойдёт к причалам."
 NAM_island_levy_office:0 "Островная сборная контора"
 NAM_island_levy_office_desc:0 "Большой остров, Западный островной округ и Средний остров добывают сталь, но почти ничего не платят казне. Контора наместников введёт особый сбор; островитяне будут подчиняться неохотнее."
 NAM_island_concession:0 "Островная концессия"
 NAM_island_concession_desc:0 "Сталь Среднего острова можно добывать чужими руками и на чужие деньги. Предложим концессию Кефрейту или Вейру: остров останется нашим, а казна получит плату вперёд."
 NAM_island_convoys:0 "Островные конвои"
 NAM_island_convoys_desc:0 "Острова снабжаются случайными рейсами, и каждый шторм отрезает их на недели. Регулярная конвойная служба будет вывозить руду и привозить припасы по расписанию."
 NAM_island_governors:0 "Островные управители"
 NAM_island_governors_desc:0 "Заморским округам нужны не только сборщики, но и причалы, дороги и склады. Управители получат средства на работы, которые острова запомнят дольше любого указа."
 NAM_restitution_desk:0 "Стол реституции"
 NAM_restitution_desk_desc:0 "Эфлор и Ажар присылают претензии одну за другой, и каждая требует ответа. Отдельный стол канцелярии будет отвечать встречными ведомостями и договорами воркерландской эпохи, выигрывая время."
 NAM_court_azhar:0 "Склонить Ажар"
 NAM_court_azhar_desc:0 "Ажару топливо нужнее, чем земли Сухоречья. Бесплатная партия нефти напомнит его правительству, что со Светлогорьем выгоднее торговать, чем воевать."
 NAM_fuel_leverage:0 "Топливный рычаг"
 NAM_fuel_leverage_desc:0 "Соседи требуют наших земель, но заправляют машины нашей нефтью. Канцелярия получит право закрыть для них промыслы и терминалы, и коалиция узнает, сколько стоит её претензия."
 NAM_basin_talks:0 "Переговоры о бассейне"
 NAM_basin_talks_desc:0 "Посредники предлагают сесть за один стол с Эфлором и Ажаром. Договориться о границе вряд ли удастся, но каждый месяц переговоров - ещё месяц без войны."
 NAM_eflor_fuel_prices:0 "Цены для Эфлора"
 NAM_eflor_fuel_prices_desc:0 "Эфлор покупает светлогорскую нефть через посредников и платит меньше других. Новые цены пополнят казну, а эфлорские газеты назовут их грабежом."
 NAM_general_staff_plan:0 "План генерального штаба"
 NAM_general_staff_plan_desc:0 "Штаб сводит переговоры, давление соседей и состояние гарнизонов в один план войны. Он рассчитан на худший исход и потому допускает ещё один приказ о мобилизации."
 NAM_discipline_of_seals:0 "Никто не оставляет печать"
 NAM_discipline_of_seals_desc:0 "На войне каждая ступень лестницы держит свой участок, пока верит, что соседняя не дрогнет. Особый приказ напомнит наместникам и комендантам: за брошенную печать отвечают так же, как за брошенный окоп."
 NAM_volunteer_levies:0 "Добровольческие наборы"
 NAM_volunteer_levies_desc:0 "На станциях и промыслах записываются те, кто не попал в мобилизационные списки. Оружие для них найдётся на складах, а командиры - среди отставных унтер-офицеров."
 NAM_wells_under_guard:0 "Скважины под охраной"
 NAM_wells_under_guard_desc:0 "Промыслы не будут взорваны - их будут защищать. Сапёры укрепят подступы к Северным месторождениям и Светлогорскому округу, а нефтяники поверят, что им есть куда вернуться."
 NAM_last_reserve:0 "Последний резерв"
 NAM_last_reserve_desc:0 "Штаб вскрывает склады, которые берёг на крайний случай. Крайний случай настал."
 NAM_district_volunteers:0 "Добровольцы округов"
 NAM_district_volunteers_desc:0 "Округа сами собирают отряды для защиты своих промыслов. Многие из тех, кто вчера читал листовки Ветра, сегодня записываются в строй."
 NAM_martial_seals:0 "Военные печати"
 NAM_martial_seals_desc:0 "Наместники получают право военного суда в своих округах. Печать снова решает всё, и тот, кто её ослушается, ответит перед трибуналом."
 NAM_oil_score:0 "Нефтяной счёт"
 NAM_oil_score_desc:0 "Посредники считают нефть каждого удержанного промысла. Штаб публикует собственный счёт, чтобы каждый солдат знал, сколько стоит его участок фронта."
 NAM_veterans_return:0 "Возвращение ветеранов"
 NAM_veterans_return_desc:0 "Солдаты ресурсной войны возвращаются в округа с опытом, которого не было у имперских гарнизонов. Лучших кадровые списки удержат в армии, остальные вернутся на промыслы."
 NAM_svetlogorsk_shipyards:0 "Верфи Светлогорска"
 NAM_svetlogorsk_shipyards_desc:0 "Светлогорский округ может строить суда, а не только чинить чужие. Новая верфь даст стране собственный торговый флот."
 NAM_aftermath_commission:0 "Комиссия по итогам войны"
 NAM_aftermath_commission_desc:0 "Победа оставила вдоль границы с Эфлором и Ажаром спорные деревни, пленных и разбитые дороги. Комиссия решит, станет ли этот рубеж местом торговли или следующего удара."
 NAM_normalisation:0 "Нормализация"
 NAM_normalisation_desc:0 "Светлогорье отказывается от притязаний на ажарские земли и предлагает соседям восстановить торговлю. Коменданты считают это уступкой побеждённым, конторы - началом выгодных лет."
 NAM_border_revenge:0 "Счёт к соседям"
 NAM_border_revenge_desc:0 "Коалиция пришла за нашими промыслами и проиграла. Пусть теперь соседи заплатят за эту войну Верхним Лореном."
 NAM_prisoner_exchange:0 "Обмен пленными"
 NAM_prisoner_exchange_desc:0 "Пленные обеих сторон всё ещё ждут в лагерях. Обмен вернёт людей домой и станет первым договором с бывшими врагами, который исполняется без стрельбы."
 NAM_border_trade_posts:0 "Пограничные торговые пункты"
 NAM_border_trade_posts_desc:0 "На месте блокпостов открываются торговые пункты, через которые светлогорская нефть идёт к соседям напрямую. Новый маршрут даёт ещё одну единицу пропускной способности."
 NAM_frontier_bunkers:0 "Пограничные доты"
 NAM_frontier_bunkers_desc:0 "Если соседи придут снова, их встретит бетон, а не окопы. Доты встанут на подступах к Среднему Лорену."
 NAM_border_incidents:0 "Пограничные инциденты"
 NAM_border_incidents_desc:0 "Патрули Светлогорья всё чаще переходят линию разграничения. Каждая перестрелка ослабляет соседей и напоминает им, кто выиграл войну."
 NAM_aftermath_settled:0 "Граница устоялась"
 NAM_aftermath_settled_desc:0 "Каким бы путём ни пошло Светлогорье, граница с Эфлором и Ажаром больше не меняется каждый месяц. Комиссия закрывает дела войны и сдаёт протоколы в архив."
 NAM_oil_ministry:0 "Министерство нефти"
 NAM_oil_ministry_desc:0 "Промыслы больше не делят между собой ведомства военного времени. Министерство нефти объединит добычу, переработку и контракты и сразу найдёт резерв ещё на одну единицу пропускной способности."
 NAM_middle_loren_wells:0 "Скважины Среднего Лорена"
 NAM_middle_loren_wells_desc:0 "Средний Лорен лежит на краю бассейна, и его промыслы до сих пор работали без дорог и мастерских. Город получит предприятие, а округ - подъездные пути."
 NAM_reclaim_230:0 "Сталь Западного острова"
 NAM_reclaim_230_desc:0 "Кефрейт добывает сталь Западного островного округа по договору военного времени. Война выиграна, и канцелярия требует новых условий: платы или возвращения прав на добычу."
 NAM_export_consortium:0 "Экспортный консорциум"
 NAM_export_consortium_desc:0 "Портовые конторы объединяются в консорциум с общими танкерами и долгосрочными договорами. Контракты получат две новые единицы пропускной способности, а промыслы - покупателей вместо собственных заводов."
 NAM_state_refineries:0 "Государственные заводы"
 NAM_state_refineries_desc:0 "Нефть, которую можно переработать дома, незачем продавать по чужой цене. Государство строит перерабатывающие заводы на Северных месторождениях и в Сухоречье."
 NAM_oil_exchange:0 "Нефтяная биржа"
 NAM_oil_exchange_desc:0 "Цену светлогорской нефти теперь назначают в Светлогорье. Биржа сводит продавцов с покупателями и берёт свою долю с каждой сделки."
 NAM_south_allied_fuel_office:0 "Топливное управление союзников"
 NAM_south_allied_fuel_office_desc:0 "Союзники северного лагеря воюют на светлогорском топливе или не воюют вовсе. Управление распределит поставки так, чтобы каждая цистерна дошла до фронта."
 NAM_south_convoy_hunters:0 "Охотники за конвоями"
 NAM_south_convoy_hunters_desc:0 "Танкеры и баржи везут топливо к печам Шахрабада. Корабли Светлогорья выйдут на их маршруты и заставят печи остыть."
 NAM_rus_crisis_watch:0 "Глаза на Землю Хана"
 NAM_rus_crisis_watch_desc:0 "Хан строит империю и орбитальную программу, а против него уже собирается коалиция. Канцелярия должна решить, чем ответит Светлогорье: нефтью для обороняющихся или счётом за неё."
 NAM_rus_fuel_for_coalition:0 "Топливо для коалиции"
 NAM_rus_fuel_for_coalition_desc:0 "Светлогорье отправляет топливо тем, кто встал против Хана. Наша нефть станет вкладом в общую оборону, а не товаром на чужой войне."
 NAM_rus_demand_share:0 "Требовать доли"
 NAM_rus_demand_share_desc:0 "Обороняющимся нужна наша нефть, и Светлогорье назначит за неё цену. Кто хочет топлива для войны с Ханом, будет платить и считаться с нашими интересами."
 NAM_rus_expedition_staff:0 "Экспедиционный штаб"
 NAM_rus_expedition_staff_desc:0 "Каким бы ни был ответ Хану, армии Светлогорья нужен штаб, способный действовать далеко от бассейна. Офицеры изучат опыт северного фронта и подготовят склады для экспедиции."
 NAM_defeat_count_losses:0 "Подсчёт потерь"
 NAM_defeat_count_losses_desc:0 "Поражение отняло промыслы - по компромиссному миру с данью или вместе со всем материком. Прежде чем решать, что дальше, канцелярия должна честно сосчитать, что у Светлогорья осталось."
 NAM_defeat_rump_cabinet:0 "Кабинет оставшихся"
 NAM_defeat_rump_cabinet_desc:0 "Половина министров потеряла свои округа вместе с должностями. Ром собирает кабинет из тех, кто остался, и обещает каждой опоре место за столом."
 NAM_defeat_harbour_economy:0 "Хозяйство гавани"
 NAM_defeat_harbour_economy_desc:0 "Без северных промыслов главным богатством страны становятся гавани: Южная, если она ещё наша, или порты островов. Торговля, фрахт и ремонт судов должны заменить хотя бы часть потерянной нефти."
 NAM_defeat_island_refuge:0 "Острова-убежище"
 NAM_defeat_island_refuge_desc:0 "Заморские округа остались за Светлогорьем, и туда уже перебираются семьи и склады с потерянного берега. Островам нужны причалы и дороги, чтобы их принять."
 NAM_defeat_purge_of_seals:0 "Чистка печатей"
 NAM_defeat_purge_of_seals_desc:0 "Наместники, сдавшие промыслы без боя, лишаются печатей. Округа получают право назвать виновных, и лестница становится короче."
 NAM_defeat_refugee_quarters:0 "Кварталы беженцев"
 NAM_defeat_refugee_quarters_desc:0 "Беженцы с потерянных промыслов заполняют порты, которые ещё остались у Светлогорья. Новые кварталы и мастерская в Южной гавани, а если она потеряна - в столице, дадут им жильё и работу, а армии - людей."
 NAM_defeat_island_foundries:0 "Островные литейные"
 NAM_defeat_island_foundries_desc:0 "Сталь Большого острова больше не нужно везти на материк. Литейная прямо на острове будет выпускать оружие вдали от новой границы."
 NAM_defeat_revenge:0 "Курс на возвращение"
 NAM_defeat_revenge_desc:0 "Мир подписан, но не принят. Светлогорье будет готовиться вернуть промыслы, и каждая статья бюджета отныне служит этой цели."
 NAM_defeat_accommodation:0 "Курс на примирение"
 NAM_defeat_accommodation_desc:0 "Война проиграна, но торговать можно и с победителями. Светлогорье признаёт новые границы и ищет у бывших врагов выгоду, а не реванш."
 NAM_defeat_rebuild_arsenal:0 "Восстановить арсенал"
 NAM_defeat_rebuild_arsenal_desc:0 "Оружейные мастерские переходят на полную смену: в Южной гавани, если она ещё наша, иначе в столице. Новая армия начнётся с собственных винтовок."
 NAM_defeat_hidden_reserve:0 "Скрытый резерв"
 NAM_defeat_hidden_reserve_desc:0 "Не вся нефть ушла вместе с промыслами. Если канцелярия когда-то спрятала резерв от метрополии, теперь его можно спрятать и от победителей. Правительство в изгнании обменяет часть резерва на транспорты для конвоев между островами."
 NAM_defeat_underground_return:0 "Подполье на потерянных землях"
 NAM_defeat_underground_return_desc:0 "На отнятых промыслах остались люди, которые помнят Светлогорье. Подпольные ячейки соберут сведения, оружие и подписи, а канцелярия заявит право на всё, что отняли по мирному договору."
 NAM_defeat_officer_cadres:0 "Офицерские кадры"
 NAM_defeat_officer_cadres_desc:0 "Армия, разбитая однажды, должна учиться на своих ошибках. Офицеры ресурсной войны станут наставниками новых призывов."
 NAM_defeat_new_levies:0 "Новые наборы"
 NAM_defeat_new_levies_desc:0 "Призывные списки составляют заново по всем оставшимся округам и островам. Новые батальоны получат оружие сразу, а не накануне боя."
 NAM_defeat_war_chest:0 "Военная казна"
 NAM_defeat_war_chest_desc:0 "Доходы гавани откладываются в особый фонд, о котором не пишут в ведомостях для победителей. Из него будут оплачены орудия будущей войны, а на островах - и верфь в столице, без которой флотилия не вернётся на материк."
 NAM_defeat_war_of_return:0 "Война возвращения"
 NAM_defeat_war_of_return_desc:0 "Армия восстановлена, промыслы ждут. Светлогорье готово потребовать назад то, что у него отняли по мирному договору."
 NAM_defeat_early_tribute:0 "Выкупить дань"
 NAM_defeat_early_tribute_desc:0 "Год дани превращает каждую цистерну в напоминание о поражении. Одна крупная выплата закроет обязательство досрочно и освободит промыслы для собственных контрактов."
 NAM_defeat_oil_union:0 "Нефтяной союз с соседями"
 NAM_defeat_oil_union_desc:0 "Эфлор и Ажар получили промыслы, но не умеют вести на них добычу. Светлогорские инженеры и общие контракты дадут всем трём странам больше нефти, чем дала бы вражда."
 NAM_defeat_open_border:0 "Открытая граница"
 NAM_defeat_open_border_desc:0 "Семьи, разделённые новой границей, получают право свободного проезда. Часть ушедших возвращается в Светлогорье."
 NAM_defeat_joint_fields:0 "Совместные промыслы"
 NAM_defeat_joint_fields_desc:0 "На спорных месторождениях работают смешанные бригады, а выручку делят по договору. Светлогорье получает долю с промыслов, потерянных на войне."
 NAM_defeat_road_south:0 "Дорога на Юг"
 NAM_defeat_road_south_desc:0 "Бывшие враги смотрят на Шахрабад с той же тревогой, что и мы. Светлогорье предлагает Эфлору и Ажару союз против печей Юга."
 NAM_defeat_southern_charter:0 "Южный договор"
 NAM_defeat_southern_charter_desc:0 "Союз с бывшими врагами готов к испытанию. Если Шахрабад не отступит, война за Юг решит, чей договор будет действовать в пустыне."
 NAM_defeat_oil_peace:0 "Нефтяной мир"
 NAM_defeat_oil_peace_desc:0 "Светлогорье не станет воевать ни за север, ни за юг. Нефть продаётся всем, кто платит, и этот мир окажется прибыльнее любой победы."
 NAM_defeat_second_chapter:0 "Вторая глава"
 NAM_defeat_second_chapter_desc:0 "Светлогорье пережило поражение и не распалось. Какой бы путь ни выбрала страна, её история продолжается собственными силами."
 NAM_independent_tt:0 "Воркерланд распался, а Светлогорье не подчинено другой стране"
 NAM_restitution_clock_tt:0 "Воркерланд распался, и Эфлор с Ажаром предъявили претензии на нефтяной бассейн: давление реституции нарастает"
 NAM_ladder_formed_tt:0 "Лестница печатей сложилась: после провозглашения независимости между вертикалью наместников и округами установилось равновесие"
 NAM_vertical_tt:0 "Баланс лестницы печатей смещается к вертикали на §Y0.25§!. Если лестница ещё не сложилась, этот сдвиг войдёт в её начальное значение при провозглашении независимости."
 NAM_districts_tt:0 "Баланс лестницы печатей смещается к округам на §Y0.25§!. Если лестница ещё не сложилась, этот сдвиг войдёт в её начальное значение при провозглашении независимости."
 NAM_neutral_basin_tt:0 "Давление реституции: §G-6§!."
 NAM_basin_is_ours_tt:0 "Давление реституции: §R+4§!."
 NAM_restitution_desk_tt:0 "Давление реституции: §G-5§!."
 NAM_court_azhar_tt:0 "Давление реституции: §G-4§!."
 NAM_fuel_leverage_tt:0 "Давление реституции: §R+3§!."
 NAM_basin_talks_tt:0 "Давление реституции: §G-5§!."
 NAM_eflor_fuel_prices_tt:0 "Давление реституции: §R+3§!."
 NAM_underground_reports_tt:0 "Подполье Ветра: §G-5§!."
 NAM_veter_channel_tt:0 "Подполье Ветра: §G-5§!."
 NAM_amnesty_lists_tt:0 "Подполье Ветра: §G-10§!."
 NAM_mine_councils_tt:0 "Подполье Ветра: §G-5§!.\nНефтяная пропускная способность: §G+1§!."
 NAM_informers_tt:0 "Подполье Ветра: §G-10§!."
 NAM_field_gendarmes_tt:0 "Подполье Ветра: §G-5§!."
 NAM_quiet_wells_tt:0 "Подполье Ветра: §G-5§!."
 NAM_district_volunteers_tt:0 "Подполье Ветра: §G-10§!."
 NAM_deep_wells_tt:0 "Нефтяная пропускная способность: §G+1§!."
 NAM_border_trade_posts_tt:0 "Нефтяная пропускная способность: §G+1§!."
 NAM_oil_ministry_tt:0 "Нефтяная пропускная способность: §G+1§!."
 NAM_export_consortium_tt:0 "Нефтяная пропускная способность: §G+2§!."
