 ADISCORD_coastal_patrol_vessel: "Прибрежный патрульный корабль"
 ADISCORD_coastal_patrol_ship: "Прибрежные патрульные корабли"
 ADISCORD_coastal_patrol_ship_desc: "Простые малые боевые корабли для охраны конвоев, разведки и борьбы за местные проливы."
 ADISCORD_coastal_patrol_ship_1: "Патрульный корабль ресурсных войн"
 ADISCORD_coastal_patrol_ship_1_short: "Патрульный корабль"
 ADISCORD_coastal_patrol_ship_1_desc: "Надёжный корабль береговой зоны с лёгкой артиллерией, торпедами и минимальным противовоздушным вооружением."
 modifier_experience_gain_ADISCORD_coastal_patrol_vessel_training_factor: "Опыт подготовки прибрежных патрульных кораблей"
 modifier_experience_gain_ADISCORD_coastal_patrol_vessel_mission_factor: "Опыт заданий прибрежных патрульных кораблей"
 modifier_experience_gain_ADISCORD_coastal_patrol_vessel_combat_factor: "Боевой опыт прибрежных патрульных кораблей"

 ADISCORD_nam_extraction_defence_corps: "Корпус обороны месторождений"
 ADISCORD_nam_extraction_defence_corps_desc: "Светлогорье заранее рассредоточило запасы, закрепило инженерные части на подступах к нефтяным полям и свело гарнизоны в полноценную полевую армию. Светлогорье уступает коалиции в числе потенциальных союзников, но не собирается отдавать месторождения быстрым ударом."
 ADISCORD_nam_restitution_coalition: "Коалиция земельной реституции"
 ADISCORD_nam_restitution_coalition_desc: "Эфлор и Ажар оформили постоянный военно-политический союз ради возвращения территорий и ресурсной инфраструктуры, отторгнутых Воркерландом и унаследованных Светлогорьем. Совместный штаб координирует одну войну и останется основой их безопасности после неё."
 ADISCORD_nam_insurgent_columns: "Повстанческие колонны"
 ADISCORD_nam_insurgent_columns_desc: "Дезертиры, подпольщики и местные ополченцы северного ресурсного пояса сведены в самостоятельные колонны. Они умеют держать короткий внутренний фронт и обходиться скромным снабжением, но не располагают тяжёлой армией."
 ADISCORD_nam_profitable_volunteer_contracts: "Контракты ресурсного содействия"
 ADISCORD_nam_profitable_volunteer_contracts_desc: "Участие в войне окупится только при заранее оговорённом доступе к топливу и перевозкам. Правительства отправляют ограниченный добровольческий корпус, не принимая на себя обязательств всей коалиции."
 ADISCORD_nam_treaty_independence: "Хартия признанной независимости"
 ADISCORD_nam_treaty_independence_desc: "Эфлор и Ажар формально отказались от права решать судьбу Светлогорья силой. Пограничные приложения к хартии закрепляют новый рубеж, а подписи соседей превращают фактический разрыв с Воркерландом в признанную независимость."

 ADISCORD_nam_prewar_defence_category: "Предвоенная оборона Светлогорья"
 ADISCORD_nam_prewar_defence_category_desc: "После распада Воркерланда требования соседей становятся вопросом времени. Администрация может заранее оборудовать полевые позиции на двух вероятных направлениях удара, пока границы ещё формально спокойны."
 ADISCORD_nam_fortify_extraction_line: "Оборудовать рубеж месторождений"
 ADISCORD_nam_fortify_extraction_line_desc: "Инженерные роты подготовят опорные пункты на западных дорогах и укрепят узел, прикрывающий центральные промыслы от одновременного нажима Эфлора и Ажара. Работы займут §Y35 дней§!."
 ADISCORD_nam_fortify_azhar_approaches: "Закрыть ажарские проходы"
 ADISCORD_nam_fortify_azhar_approaches_desc: "Полевые укрепления перекроют восточные проходы к ресурсному бассейну и подступы к Южнобережному округу. Работы займут §Y35 дней§!."

 ADISCORD_nam_resource_war.2.t: "Светлогорское восстание"
 ADISCORD_nam_resource_war.2.d: "Пока основные силы Светлогорья связаны боями на внешних границах, дезертиры, подпольщики и противники старой колониальной администрации захватили компактный плацдарм внутри северного ресурсного пояса. Временный штаб восстания объявил Светлогорье продолжателем воркерландской системы наместников и открыл внутренний фронт."
 ADISCORD_nam_resource_war.2.a: "Ещё один фронт - но не ещё одна причина сдаться."
 ADISCORD_nam_resource_war.3.t: "Светлогорские контракты"
 ADISCORD_nam_resource_war.3.d: "Вокруг ресурсного бассейна Светлогорья началась война. Для Кефрейта это не просто очередной пограничный конфликт: кризис открыл новые военные, снабженческие и политические контракты. Ветка фокусов ресурсной войны теперь раскрыта. Первый фокус по-прежнему требует обычный предыдущий фокус."
 ADISCORD_nam_resource_war.3.a: "Открыть контрактные досье."

 ADISCORD_nam_resource_news.1.t: "Эфлор и Ажар вторглись в Светлогорье"
 ADISCORD_nam_resource_news.1.d: "Армии Эфлора и Ажара перешли границу Светлогорья через несколько часов после провала переговоров. Поводом стал отказ светлогорского правительства принять ультиматум о северных месторождениях и прилегающей инфраструктуре. Обе страны считают эти земли своими: их передали Светлогорью ещё при воркерландской администрации.\n\nРахма и Мазар официально в войне не участвуют, но разрешили набор добровольцев в обмен на будущие топливные контракты. Светлогорью приходится обороняться сразу на двух направлениях, прикрывая промыслы и транспортные узлы."
 ADISCORD_nam_resource_news.1.a: "Война за месторождения началась."
 ADISCORD_nam_resource_news.2.t: "Светлогорье разделено между Эфлором и Ажаром"
 ADISCORD_nam_resource_news.2.d: "Организованное сопротивление Светлогорья прекратилось. Эфлор занял Северные месторождения, западные терминалы и Светлогорск, Ажар - морские округа Чёрного бассейна и южный порт. Временный штаб Светлогорского восстания распущен, прежняя администрация Светлогорья как самостоятельное правительство больше не существует.\n\nСоюзники объявили цели войны достигнутыми и приступили к демаркации новой границы. Вместе с землями им достались разрушенные промыслы, повреждённые дороги и население, которое несколько поколений жило под чужой властью."
 ADISCORD_nam_resource_news.2.a: "Светлогорье поделено."
 ADISCORD_nam_resource_news.3.t: "Светлогорье добилось признания независимости"
 ADISCORD_nam_resource_news.3.d: "Светлогорье удержало Северные месторождения и вынудило Эфлор и Ажар подписать мир. Договор признаёт Светлогорье независимым государством, а небольшая часть пограничной территории переходит соседям. Вопрос о Чёрном бассейне остаётся открытым, но боевые действия прекращены.\n\nФормирования Светлогорского восстания разоружены. Эфлор и Ажар сохранили союз, так что спор о границе в будущем может возобновиться."
 ADISCORD_nam_resource_news.3.a: "Светлогорье отстояло независимость."
 ADISCORD_nam_resource_news.5.t: "В Светлогорске началось восстание"
 ADISCORD_nam_resource_news.5.d: "Пока основные силы Светлогорья воюют с Эфлором и Ажаром, в тылу вспыхнуло восстание. Противники системы наместников захватили Светлогорский округ и объявили о создании Временного штаба восстания. К ним присоединились часть гарнизонов, дезертиры и подпольные группы.\n\nПовстанцы не претендуют на всё Светлогорье и не провозглашают нового государства. Они требуют ликвидировать администрацию наместников, оставшуюся от Воркерланда. Правительству теперь приходится одновременно удерживать месторождения, сдерживать внешнее наступление и возвращать столичный округ."
 ADISCORD_nam_resource_news.5.a: "У Светлогорья появился третий фронт."
 ADISCORD_nam_resource_news.6.t: "Светлогорское восстание подавлено"
 ADISCORD_nam_resource_news.6.d: "Правительственные войска Светлогорья вернули контроль над Светлогорским округом. Временный штаб восстания распущен, уцелевшие отряды разоружены или рассеялись.\n\nВойна с Эфлором и Ажаром продолжается, но теперь Светлогорье может перебросить резервы на внешний фронт. Сторонники наместников называют подавление восстания первой крупной победой новой власти после распада Воркерланда."
 ADISCORD_nam_resource_news.6.a: "Восстание подавлено."
 ADISCORD_nam_resource_news.7.t: "Светлогорье согласилось на мирный раздел"
 ADISCORD_nam_resource_news.7.d: "Светлогорье согласилось на раздел своей территории по итогам переговоров с Эфлором и Ажаром. Эфлор получает Северные месторождения, западные терминалы и Светлогорский округ, Ажар - морские округа Чёрного бассейна и южное побережье.\n\nГарнизонам приказано не препятствовать передаче. Чиновники могут остаться на службе у новых властей или уехать. После завершения передачи центральное правительство Светлогорья будет распущено."
 ADISCORD_nam_resource_news.7.a: "Светлогорье сдалось без боя."

 ADISCORD_nam_debug_start_resource_war: "§RDEBUG:§! Начать войну за ресурсы Светлогорья"
 ADISCORD_nam_debug_start_resource_war_desc: "Освобождает Светлогорье от старых союзных связей, создаёт постоянный Эфлорско-ажарский союз и запускает его общую войну против Светлогорья."
 ADISCORD_nam_debug_resolve_coalition_victory: "§RDEBUG:§! Разделить Светлогорье между победителями"
 ADISCORD_nam_debug_resolve_coalition_victory_desc: "Полностью разделяет Светлогорье между Эфлором и Ажаром, ликвидирует Светлогорское восстание и сохраняет союз победителей."
 ADISCORD_nam_debug_resolve_nam_victory: "§RDEBUG:§! Закрепить победу Светлогорья"
 ADISCORD_nam_debug_resolve_nam_victory_desc: "Завершает войну признанием Светлогорья, ограниченной передачей приграничного штата и ликвидацией уцелевшей повстанческой армии; союз соседей сохраняется."

 # National focus campaign
 NAM_inventory: "Опись исчезающей империи"
 NAM_inventory_desc: "На полках Егора Рома всё ещё лежат предписания столицы. Одни требуют отправить нефть, другие запрещают трогать вагоны, третьи отменяют вторые. Сначала выясним, какие склады, люди и полномочия действительно принадлежат Светлогорью."
 NAM_open_ledgers: "Сколько стоит каждая печать"
 NAM_open_ledgers_desc: "Наместники исправно считают чужие расходы. Теперь Кирилл Выкуп откроет счета самих управлений: двойные ведомости больше не будут считаться двумя работающими учреждениями."
 NAM_vertical: "Одна подпись Рома"
 NAM_vertical_desc: "Лестница согласований останется, но распоряжения больше не будут застревать между управлениями. Наместники получат единую норму сбора и персональную ответственность перед Ромом. Быстрее исполнять приказы ещё не значит примириться с теми, кто их ненавидит."
 NAM_districts: "Подписи округов"
 NAM_districts_desc: "Представители округов должны подписывать не только полученные приказы. Ром сохранит руководство, но отдаст местным советам право проверять расходы и оспаривать сборы. Казна потеряет удобство принуждения; страна получит собеседников."
 NAM_inspectors: "Инспектор отвечает именем"
 NAM_inspectors_desc: "Чиновник не сможет спрятаться за подписью предшественника. Выездные группы сверят складские книги с реальными ящиками и вернут пропавшее оружие гарнизонам."
 NAM_public_payroll: "Ведомость на площади"
 NAM_public_payroll_desc: "Публичная ведомость покажет, кому платят за службу, а кому - за чужую работу. Первые открытые расчёты не отменят бедность, но отнимут у подполья самый убедительный слух."
 NAM_emergency_writ: "Предписание на чрезвычайный случай"
 NAM_emergency_writ_desc: "Война не должна застать наместников в споре о том, кто вправе вскрыть арсенал. Заранее установим цену и порядок чрезвычайной выдачи; при внутреннем восстании эти же штабы организуют поиск его складов."
 NAM_district_guarantees: "Гарантии Светлогорску"
 NAM_district_guarantees_desc: "Город, который снабжает всю страну, требует права спросить, куда уходит его заработок. Подготовим местный договор с оплаченной гражданской службой. Доверие должно пережить два месяца работы до войны; одной подписи в последний день будет мало."
 NAM_one_budget: "Бюджет без двойного дна"
 NAM_one_budget_desc: "Открытая смета и единая инспекция пришли к разным политическим выводам, но обе нашли деньги, которые не доходили до казны. Вернём их в общий бюджет."
 NAM_well_register: "У скважины есть адрес"
 NAM_well_register_desc: "Отчёт о добыче не заменяет исправную цистерну. Сверим промыслы с подъездными путями и вернём в оборот топливо, которое числится между двумя ведомствами."
 NAM_export_quays: "Нефть оплачивает государство"
 NAM_export_quays_desc: "Портовые конторы смогут продавать партии из настоящего топливного резерва. Каждый рейс пополнит казну, но те же цистерны уже не смогут заправить собственную армию."
 NAM_domestic_refining: "Нефть остаётся дома"
 NAM_domestic_refining_desc: "Ценность месторождения не заканчивается у экспортного причала. Мастерские получат горючее для станков и транспорта, а страна - возможность выпускать собственное оснащение вместо продажи каждой бочки."
 NAM_insured_cargoes: "Рейс с обратным грузом"
 NAM_insured_cargoes_desc: "Экспортный рейс должен возвращаться с тарой и деталями, а не с пустым трюмом. Объединим разрозненные перевозки в обслуживаемую торговую линию."
 NAM_machine_shops: "Сменные детали для промыслов"
 NAM_machine_shops_desc: "Мастерская, способная починить насос, умеет больше, чем признаёт её смета. Единый заказ обеспечит инженерные части инструментом и подготовит выпуск военного оснащения."
 NAM_civilian_combine: "Город вокруг промысла"
 NAM_civilian_combine_desc: "Обслуживание скважин должно кормить постоянный город. Построим ремонтное предприятие рядом с Северными месторождениями, чтобы добыча перестала зависеть от случайного привозного подрядчика."
 NAM_technical_college: "Инженер выше инструкции"
 NAM_technical_college_desc: "Удачный ремонт не должен заканчиваться дисциплинарным делом за отступление от инструкции. Объединим лаборатории промыслов в технический институт с собственным исследовательским бюджетом."
 NAM_count_garrisons: "Гарнизон на бумаге и на дороге"
 NAM_count_garrisons_desc: "На карте каждая управа охраняется полком. На дороге иногда стоит один пост. Сведём учёт людей и оружия, затем выберем, что защищать неподвижно, а где нужен подвижный резерв."
 NAM_field_guards: "Армия опорных пунктов"
 NAM_field_guards_desc: "Промыслы нельзя отвести в тыл. Обучим части держать оборудованные узлы и экономить снабжение, принимая медленную перегруппировку как цену стойкости."
 NAM_mobile_columns: "Армия перекрёстков"
 NAM_mobile_columns_desc: "Не каждый участок можно удержать, зато потерянную дорогу можно вернуть. Подвижные колонны будут быстрее собирать ударную группу ценой большего расхода снабжения."
 NAM_engineer_depots: "Инструмент перед винтовкой"
 NAM_engineer_depots_desc: "Инженер не должен искать лопату после прибытия на позицию. Выделим запас оснащения для сапёрных рот и обучения гарнизонов."
 NAM_motor_pool: "Общий автомобильный парк"
 NAM_motor_pool_desc: "Служебная машина начальника не важнее полевого подвоза. Соберём грузовики разрозненных управлений в резерв, которым действительно сможет пользоваться армия."
 NAM_quartermaster: "Склад знает свой фронт"
 NAM_quartermaster_desc: "Платёж за снабжение должен означать выдачу оружия, а не ещё одну заявку. Первую поставку проведём из сверенных резервов; следующие партии действующая армия и резерв смогут получать по оплаченному заказу."
 NAM_port_arsenal: "Арсенал Южнобережья"
 NAM_port_arsenal_desc: "Порт должен принимать сырьё и выпускать оружие даже тогда, когда сухопутные пути перерезаны. Создадим собственную производственную площадку у действующих причалов."
 NAM_harbour_service: "Порт не закрывается на обед"
 NAM_harbour_service_desc: "Распорядок ведомств не должен останавливать погрузку. Единая портовая служба сведёт смены докеров, лоцманов и снабженцев в одну работающую цепь."
 NAM_repair_yard: "Своя ремонтная стенка"
 NAM_repair_yard_desc: "Повреждённый корабль не должен уходить в чужой порт на неопределённый срок. Южнобережные мастерские получат верфь для ремонта и собственного судостроения."
 NAM_escort_school: "Сопровождение до последнего буя"
 NAM_escort_school_desc: "Флот нужен прежде всего для того, чтобы торговый корабль доходил до своего причала. Школа сопровождения научит экипажи искать угрозу до начала боя."
 NAM_island_accounts: "Заморские округа тоже считают"
 NAM_island_accounts_desc: "Дальние владения остаются спорным наследством империи. Гражданские ведомости и портовые службы дадут населению работающую администрацию, не превращая старую колониальную границу в национальную территорию одним указом."
 NAM_alarm: "Больше не пограничный спор"
 NAM_alarm_desc: "Коалиция пришла за месторождениями, а не за дипломатической формулировкой. Удерживайте Северные месторождения до исхода 420 дней войны либо добейтесь капитуляции обоих противников. Ни один мирный план не должен задержать чрезвычайный штаб."
 NAM_hold_basin: "У промыслов нет тыла"
 NAM_hold_basin_desc: "Война решится вокруг Северных месторождений. Выдадим инструмент и артиллерию защитникам, а временные инструкции позволят быстрее укрепить позиции."
 NAM_relief_columns: "Дорога, по которой ещё можно пройти"
 NAM_relief_columns_desc: "Штаб должен перебрасывать подвоз туда, где он нужен сегодня. Выделим транспорт и разрешим расходовать собственное горючее на дополнительные военные партии оснащения."
 NAM_counterstroke: "Вернуть узлы, удержать людей"
 NAM_counterstroke_desc: "Контрудар должен открыть дорогу снабжению, а не только изменить стрелку на карте. Временная группа планирования согласует ограниченные наступления с возможностью удержать занятые узлы."
 NAM_recognition: "Подпись под независимостью"
 NAM_recognition_desc: "Соседи подписали признание Светлогорья. Теперь можно спорить об устройстве государства, не ожидая приказа из исчезнувшей столицы. Военные фокусы не являются условием гражданского будущего."
 NAM_service_state: "Государство служебной ответственности"
 NAM_service_state_desc: "Чрезвычайная вертикаль выиграла время; постоянное государство должно объяснить, что оно требует от своих начальников. Полномочие останется у Рома, но ответственность больше не закончится у дверей его кабинета."
 NAM_federal_charter: "Хартия округов"
 NAM_federal_charter_desc: "Уступки военного времени станут правилами государства. Округа сохранят право открытого счёта и участия в бюджете, а общее правительство - армию и внешнее представительство."
 NAM_law_after_war: "Указ перестаёт быть временным"
 NAM_law_after_war_desc: "Победители способны оставить чрезвычайное положение навсегда. Вместо этого закрепим сроки полномочий учреждений и порядок оспаривания решений, соответствующий выбранному устройству страны."
 NAM_civil_repair: "Восстановить то, за что воевали"
 NAM_civil_repair_desc: "Добыча не возобновится от победной речи. Построим гражданское предприятие в Южнобережье и вернём ремонтные бригады к насосам, складам и жилью."
 NAM_civil_dividend: "Гражданский дивиденд"
 NAM_civil_dividend_desc: "Доходы победы направлены в гражданское строительство. Выпуск оружия получает меньший приоритет."
 NAM_armed_peace: "Постоянный оборонный заказ"
 NAM_armed_peace_desc: "Готовность армии оплачивается замедлением гражданского строительства."
 NAM_national_university: "Страна собственных специалистов"
 NAM_national_university_desc: "Нефтяное государство уязвимо, пока все сложные решения принимают приезжие. Технический институт получит общеуниверситетские кафедры и второй самостоятельный исследовательский бюджет."
 NAM_svetlogorye: "Светлогорье отвечает за себя"
 NAM_svetlogorye_desc: "Когда-то эта страна была графой в чужом отчёте. Теперь у неё есть признанная граница, собственные специалисты и порядок, за который отвечает её правительство. История наместничества останется в архивах; будущее больше не придёт исходящим письмом."
 NAM_directorate: "Единая дирекция"
 NAM_directorate_desc: "Единая подпись ускоряет распоряжения и сборы. Исследователи всё ещё должны объяснять каждое отступление от инструкции."
 NAM_councils: "Согласие округов"
 NAM_councils_desc: "Округа проверяют расходы и участвуют в решениях. Добровольное согласие облегчает управление, но не заменяет утраченную норму принудительного сбора."
 NAM_service_republic: "Республика служебного долга"
 NAM_service_republic_desc: "Полномочия администрации стали постоянными, а ответственность чиновников - личной. Промышленный заказ остаётся основой государства."
 NAM_charter_republic: "Республика окружной хартии"
 NAM_charter_republic_desc: "Общие учреждения действуют по хартии округов. Открытый бюджет и самостоятельные специалисты стали повседневным порядком."
 NAM_export_offices: "Нефтяные конторы"
 NAM_export_offices_desc: "Экспортные конторы собирают доход с перевозок. Дополнительная продажа расходует реальный запас горючего через национальное решение."
 NAM_refining_network: "Внутренний перерабатывающий контур"
 NAM_refining_network_desc: "Переработка снабжает местные мастерские. Дополнительные партии оснащения оплачиваются собственным горючим."
 NAM_static_doctrine: "Защита промысловых узлов"
 NAM_static_doctrine_desc: "Оборудованные позиции экономят снабжение ценой скорости перегруппировки."
 NAM_mobile_doctrine: "Колонны перекрёстков"
 NAM_mobile_doctrine_desc: "Быстрое сосредоточение требует более напряжённого подвоза."
 NAM_escort_service: "Служба морского сопровождения"
 NAM_escort_service_desc: "Отработанное сопровождение помогает торговым судам дойти до своих портов."
 NAM_overseas_service: "Заморская гражданская служба"
 NAM_overseas_service_desc: "Гражданские ведомства снижают напряжение в заморских владениях. Их содержание остаётся расходом казны."
 NAM_wartime_entrenchment: "Инструкции обороны бассейна"
 NAM_wartime_entrenchment_desc: "Временная инженерная подготовка действует только в ресурсной войне."
 NAM_counterstroke_staff: "Группа ограниченного контрудара"
 NAM_counterstroke_staff_desc: "Временное согласование наступлений действует только в ресурсной войне."
 NAM_rebel_depot_maps: "Карты складов подполья"
 NAM_rebel_depot_maps_desc: "Инспекторские сведения помогают ударам по формированиям Светлогорского восстания."
 NAM_wage_arrears: "Отложенная ведомость"
 NAM_wage_arrears_desc: "Старые долги по жалованью оставлены до следующего квартала."
 NAM_housing_programme: "Дома для вернувшихся"
 NAM_housing_programme_desc: "Оплаченная гражданская программа ускоряет общее строительство."
 NAM_sign_compact: "Оплатить договор Светлогорска"
 NAM_sign_compact_desc: "Оплатить гражданские службы округа. Договор должен проработать §Y60 непрерывных дней до начала ресурсной войны§! под нашим владением и контролем, чтобы предотвратить восстание. Дозревание во время войны не меняет её начальный исход. Потеря округа обрывает действие договора; после возвращения его можно оплатить заново до войны."
 NAM_export_fuel: "Продать партию нефтяного резерва"
 NAM_export_fuel_desc: "Продать §Y5000§! £fuel_texticon за §G250§! £ADISCORD_economy_treasury_texticon. Нужен собственный контролируемый портовый округ. Повторная продажа через §Y30 дней§!."
 NAM_workshop_batch: "Запитать дополнительную смену мастерских"
 NAM_workshop_batch_desc: "Израсходовать §Y3000§! £fuel_texticon на выпуск §G120§! £support_equipment_texticon. Повторный заказ через §Y30 дней§!."
 NAM_supply_order: "Оплатить полевую поставку"
 NAM_supply_order_desc: "Получить на собственные склады §G1500§! £infantry_equipment_texticon и §G60§! £support_equipment_texticon. Повторный заказ через §Y45 дней§!."
 NAM_emergency_arsenal: "Чрезвычайная выдача арсенала"
 NAM_emergency_arsenal_desc: "Во время ресурсной войны выдать §G2000§! £infantry_equipment_texticon и §G100§! £support_equipment_texticon. Повтор через §Y45 дней§!."
 NAM_counterinsurgency: "Вскрыть склады подполья"
 NAM_counterinsurgency_desc: "На §Y60 дней§! получить §G+8%§! атаки против Светлогорского восстания и вернуть §G1000§! £infantry_equipment_texticon. Доступно один раз при настоящей войне с повстанцами."
 NAM_relief_batch: "Подвоз для угрожаемого участка"
 NAM_relief_batch_desc: "Израсходовать §Y3000§! £fuel_texticon на подвоз §G800§! £infantry_equipment_texticon и §G60§! £support_equipment_texticon. Только для ресурсной войны; повтор через §Y30 дней§!."
 NAM_veteran_housing: "Оплатить возвращение к мирной жизни"
 NAM_veteran_housing_desc: "На §Y60 дней§! ускорить строительство на §G5%§!. Новая программа доступна через §Y60 дней§!."
 NAM_postwar_rearmament: "Исполнить постоянный оборонный заказ"
 NAM_postwar_rearmament_desc: "Получить §G2000§! £infantry_equipment_texticon и §G80§! £support_equipment_texticon. Повторный заказ через §Y45 дней§!."
