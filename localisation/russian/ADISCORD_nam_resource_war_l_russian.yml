 NAM_econ_emergency_service:0 "Отправить аварийную буровую смену"
 NAM_repair_depots_service_tt:0 "Аварийная смена тушит пожар и снимает блокировку добычи.\nОна оставляет на промысле запасной насос: пока Светлогорье владеет промыслом и контролирует его, насос поглощает до §Y25§! пунктов следующего повреждения.\nНа площадке помещается один запасной насос."
 NAM_bw_spare_pump:0 " | Запасной насос"
 NAM_emergency_service_repair_65:0 "§G+65§!"
 NAM_emergency_service_repair_50:0 "§G+50§!"
 NAM_econ_emergency_service_site_tt:0 "Светлогорье удерживает промысел.\nСмена может отремонтировать повреждения или провести новую линию энергосети.\nРемонтные товарищества также восстанавливают выжженные скважины и устанавливают запасные насосы."
 NAM_econ_emergency_service_result_tt:0 "Через §Y14§! £time_texticon дн. состояние промысла улучшится на [NAMEmergencyServiceRecovery] пунктов, до §Y100§!."
 NAM_econ_emergency_service_refund_tt:0 "Возврат оплаты: §Y30§! £political_power_texticon §Y250§! £ADISCORD_economy_treasury_texticon"
 NAM_econ_emergency_service_desc:0 "Аварийные мастера выезжают к повреждённым насосам и трубам. Диспетчерская соберёт нужные детали, сварщиков и тяжёлые машины в одну ремонтную колонну."
 NAM_econ_export_dispatch_cost:0 "§Y25§! £political_power_texticon §Y50§! £ADISCORD_economy_treasury_texticon"
 NAM_econ_export_dispatch_cost_blocked:0 "§R25§! £political_power_texticon §R50§! £ADISCORD_economy_treasury_texticon"
 NAM_econ_export_dispatch_cost_tooltip:0 "§Y25§! £political_power_texticon §Y50§! £ADISCORD_economy_treasury_texticon"
 NAM_econ_export_dispatch:0 "Открыть экспортную диспетчерскую"
 NAM_econ_client_tt:0 "Есть хотя бы один действующий нефтяной контракт"
 NAM_econ_export_dispatch_result_tt:0 "На §Y180§! £time_texticon дн. каждая выполненная месячная поставка приносит дополнительно §G+30§! £ADISCORD_economy_treasury_texticon: всего §G70§! вместо §Y40§!.\nОбычный расход §Y15000§! £fuel_texticon на покупателя сохраняется.\nБез отгрузки дополнительного дохода нет; простой не продлевает срок."
 NAM_econ_export_dispatch_desc:0 "В Южной гавани откроется общая диспетчерская нефтяных поставок. Сотрудники сведут графики погрузки, судовые заявки и документы торговых контор в одну ведомость."
 NAM_econ_export_sale_tt:0 "§G+400§! £ADISCORD_economy_treasury_texticon."
