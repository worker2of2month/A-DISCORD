 NAM_econ_road_columns:0 "Собрать автоколонны бассейна"
 NAM_econ_road_columns_delivered_tt:0 "§G+100§! £motorized_texticon."
 NAM_econ_road_columns_result_tt:0 "Через §Y14§! £time_texticon дн.: §G+100§! £motorized_texticon."
 NAM_econ_road_columns_refund_tt:0 "§G+150§! £ADISCORD_economy_treasury_texticon."
 NAM_econ_road_columns_desc:0 "Цена: §Y25§! £political_power_texticon §Y150§! £ADISCORD_economy_treasury_texticon §Y1500§! £fuel_texticon. Срок: §Y14§! £time_texticon дн. Повтор через §Y60§! £time_texticon дн. после завершения.\n\nОбъедините транспортные заказы для дорог Северных месторождений и Сухоречья. Машины поступят в общий резерв снабжения.\n§G+100§! £motorized_texticon.\n\nПри капитуляции, подчинении или потере условий заказа вся оплата возвращается. Война сама по себе не прерывает работу. Результат получает Светлогорье."
