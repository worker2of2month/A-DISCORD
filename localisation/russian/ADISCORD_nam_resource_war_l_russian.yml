 NAM_pirate_buy_arms: "Винтовки с чёрного рынка"
 NAM_pirate_buy_arms_desc: "Скупщики в чужих портах предлагают оружие, о происхождении которого лучше не спрашивать. Приёмщики проверят образцы за закрытыми дверями портового склада."
 NAM_cost_pirate_arms: "§Y40§! добычи"
