 NAM_exchange_receipt_issued_tt:0 "Биржа выдаст квитанцию на обратный выкуп этой партии."
 NAM_exchange_redeem:0 "Выкупить топливо по биржевой квитанции"
 NAM_exchange_chassis:0 "Обменять шасси на бронетранспортёры"
 NAM_exchange_chassis_desc:0 "У заводских ворот конструктор показывает механику чертёж бронекорпуса. Они обходят стоящий во дворе грузовик и сверяют крепления. Водитель внимательно следит за карандашом инженера."
 NAM_exchange_chassis_unlock_tt:0 "После применения решения: переоборудует грузовики и снаряжение поддержки в бронетранспортёры; первая партия открывает их производство."
 NAM_chassis_works_site_tt:0 "Светлогорье владеет и управляет хотя бы одной областью с гражданским или военным заводом: $STATE_688$ или $STATE_700$."
 NAM_chassis_exchange_cost:0 "§Y100§! £motorized_texticon §Y45§! £support_equipment_texticon"
 NAM_chassis_exchange_cost_blocked:0 "§R100§! £motorized_texticon §R45§! £support_equipment_texticon"
 NAM_chassis_exchange_cost_tooltip:0 "Мастерским нужны §Y100§! £motorized_texticon и §Y45§! £support_equipment_texticon со складов."
 NAM_issue_harbour_bonds:0 "Разместить городской заём"
 NAM_issue_harbour_bonds_desc:0 "Городской казначей приходит в портовую контору с проектом займа. Судовладельцы требуют показать старые ведомости сборов. В коридоре ждёт инженер, которому обещали обсудить ремонт набережной."
 NAM_issue_harbour_bonds_unlock_tt:0 "После применения решения: привлекает городской заём, который предстоит погасить с процентами."
 NAM_bond_stamp_tt:0 "Таможня удостоверит новый выпуск облигаций. Свежая поставка обновляет срок свидетельства."
 NAM_bond_certified_tt:0 "Есть действующее, ещё не использованное для займа свидетельство о поставке."
 NAM_bond_subscription_tt:0 "Остаток долга: §Y[?NAM_bond_balance|2]§! £ADISCORD_economy_treasury_texticon.\nДля нового выпуска долг должен быть погашен.\nПосле фокуса \"$NAM_commercial_commonwealth$\" допустим остаток до §Y660§! £ADISCORD_economy_treasury_texticon включительно."
 NAM_bond_issue_tt:0 "Казна получит §G600§! £ADISCORD_economy_treasury_texticon.\nПо облигациям предстоит вернуть §Y660§! £ADISCORD_economy_treasury_texticon.\nЕжемесячный платёж из свободной казны - до §Y60§! £ADISCORD_economy_treasury_texticon.\nВкладчикам также отходит до §Y200§! £ADISCORD_economy_treasury_texticon с каждой следующей продажи партии резерва в Южной гавани, пока долг не погашен."
 NAM_bond_second_issue_tt:0 "Города могут разместить второй заём, пока по первому осталось до §Y660§! £ADISCORD_economy_treasury_texticon включительно. Для каждого выпуска нужна отдельная продажа топлива."
 NAM_bond_payment_tt:0 "Из выручки §Y200§! £ADISCORD_economy_treasury_texticon пойдёт владельцам облигаций."
 NAM_bond_final_payment_tt:0 "Последний платёж владельцам облигаций из этой выручки: §Y[?NAM_bond_balance|2]§! £ADISCORD_economy_treasury_texticon."
 NAM_exchange_redeem_unlock_tt:0 "После применения решения: оплаченная партия возвращается в резервуары через Южную гавань."
 NAM_exchange_redeem_desc:0 "Биржевой маклер сверяет печать на квитанции с журналом Южной гавани. По его распоряжению кладовщик открывает цистерны для государственной службы снабжения."
 NAM_exchange_storage_tt:0 "Южная гавань принадлежит нам и под нашим контролем. В хранилищах есть место под §Y60000§! £fuel_texticon. Квитанций: §Y[?NAM_exchange_receipts|0]§!."
 NAM_exchange_redemption_cost:0 "§Y550§! £ADISCORD_economy_treasury_texticon"
 NAM_exchange_redemption_cost_blocked:0 "§R550§! £ADISCORD_economy_treasury_texticon"
 NAM_exchange_redemption_cost_tooltip:0 "§Y550§! £ADISCORD_economy_treasury_texticon за одну квитанцию."

 ADISCORD_nam_resource_war.408.t: "Две столицы"
 ADISCORD_nam_resource_war.408.d: "В бывшей столице Воркерланда впервые заседает правительство Вейранского имперского союза. На столе Рома лежат две пачки назначений. Первую сегодня разнесут по министерствам. Вторую утром погрузят на почтовое судно, уходящее к берегам Светлогорья.\n\nТам останутся местная канцелярия и губернаторы. Заводские заказы и отгрузку сырья они отныне согласуют с союзной столицей. Ром подписывает последнее назначение и передаёт секретарю прежнюю печать наместника."
 ADISCORD_nam_resource_war.408.a: "Передайте пакет капитану."
 ADISCORD_nam_resource_war.409.t: "Возвращение в Светлогорск"
 ADISCORD_nam_resource_war.409.d: "Из экспедиционного штаба в Светлогорск доставили знамя и списки тех, кто ещё ждёт отправки домой. Утром Ром принял семьи пропавших. Приказ о переносе столицы так и остался в папке у секретаря.\n\nВ ведомства вернули бланки Светлогорской державы."
 ADISCORD_nam_resource_war.409.a: "Сначала вернуть людей."
 NAM_event_deadline_open_tt:0 "Действует срок подготовки ресурсной войны."

 # Wartime recruitment, training and service branches
 NAM_war_conscription_rolls:0 "Новый призыв"
 NAM_war_conscription_rolls_desc:0 "В окружных списках ещё остаются люди, до которых не дошла повестка. Пока промыслы держат фронт, наместничество должно определить, кому предстоит сменить рабочую одежду на шинель. Старые исключения больше нельзя принимать без объяснений."
 NAM_war_short_training:0 "Ускоренные учебные сборы"
 NAM_war_short_training_desc:0 "Фронт не может ждать, пока новобранец освоит весь устав. Инструкторы оставят в расписании самое необходимое: оружие, окоп, связь с командиром и дорогу к своей части."
 NAM_war_veteran_cadres:0 "Сберечь костяк частей"
 NAM_war_veteran_cadres_desc:0 "Опытный сержант знает то, чего нет в сводках штаба. Нельзя позволить, чтобы каждое новое пополнение училось заново на тех же потерях. Ветераны должны остаться опорой своих рот."
 NAM_war_replacement_school:0 "Школа маршевого пополнения"
 NAM_war_replacement_school_desc:0 "Между окружным сборным пунктом и передовой нужен порядок, понятный и новобранцу, и командиру. В учебных ротах люди познакомятся друг с другом прежде, чем вместе услышат первый обстрел."
 NAM_war_harbour_workshops:0 "Военные мастерские гавани"
 NAM_war_harbour_workshops_desc:0 "У причалов Южной гавани суда ждут свободного стапеля. Портовые мастера предлагают собрать рассеянные бригады под одной крышей и вернуть мастерским тот ритм, которого требует море."
 NAM_war_replacement_aircraft:0 "Самолёты для действующих эскадрилий"
 NAM_war_replacement_aircraft_desc:0 "Каждая пустая стоянка на аэродроме напоминает о том, как быстро война расходует машины. Заводские приёмщики и техники эскадрилий должны работать по одному списку, чтобы лётчики снова поднялись над промыслами."
 NAM_war_short_training_idea:0 "Ускоренные учебные сборы"
 NAM_war_veteran_cadres_idea:0 "Костяк фронтовых частей"
 NAM_war_frontline_instructors:0 "Откомандировать фронтовых инструкторов"
 NAM_war_frontline_instructors_desc:0 "Из действующих частей прибывают офицеры, которые знают нынешнего противника. Их занятия начинаются не с парадного шага, а с рассказа о последнем бое и ошибках, которых ещё можно избежать."
 NAM_war_frontline_instructors_unlock_tt:0 "После применения решения: ускоряет обучение новых дивизий и накопление опыта действующей армией."
 NAM_war_frontline_instructors_duration_tt:0 "Программа действует только во время ресурсной войны. При её завершении, капитуляции или утрате независимости обучение прекращается без возврата оплаты."
