 NAM_colony: "Колония Воркерланда"
 NAM_colony_desc: "Светлогорье остаётся нефтяной колонией метрополии.\n\n§YТОРГОВЛЯ С МЕТРОПОЛИЕЙ§!\nТорговые дома: §Y[?NAM_wrk_trade_level|0] / 3§! £NAM_support_trade_texticon\nКонцессия: [NAMGetWrkConcession][NAMGetHiddenReserve]\n\n§YБЕЗОПАСНОСТЬ КОЛОНИИ§!\nПодполье Вебера: §Y[?NAM_underground|0] / 100§! £operatives_boost_resistance_texticon\nОблавы жандармерии ослабляют сеть, но снижают поддержку округов.\nРост, угрозы и способы противодействия - в разделе «$NAM_underground$»."
 NAM_wrk_metropole_present_tt: "Метрополия существует"
 NAM_wrk_fuel_shipment: "Отгрузка топлива в метрополию"
 NAM_wrk_fuel_shipment_desc: "§YЦЕНА§!: §Y4000§! £fuel_texticon\n§YПОВТОР§!: через §Y30§! £time_texticon дн. после применения.\n\n§YРЕЗУЛЬТАТ§!\nМетрополия получает §Y4000§! £fuel_texticon и запоминает услугу. Доход казны: §G+[?NAM_wrk_shipment_income|0]§! £ADISCORD_economy_treasury_texticon; он растёт с уровнем торговых домов.\nПоддержка: наместники §G+4§! £NAM_support_nam_texticon, нефтяники §R-3§! £NAM_support_oil_texticon."
 NAM_cost_wrk_fuel_shipment: "§Y4000§! £fuel_texticon"
 NAM_cost_wrk_fuel_shipment_blocked: "§R4000§! £fuel_texticon"
 NAM_cost_wrk_fuel_shipment_tooltip: "§Y4000§! £fuel_texticon\nТопливо уходит в метрополию."
 NAM_wrk_fuel_shipment_tt: "Казна: §G+[?NAM_wrk_shipment_income|0]§! £ADISCORD_economy_treasury_texticon.\nПоддержка наместников: §G+4§! £NAM_support_nam_texticon.\nПоддержка нефтяников: §R-3§! £NAM_support_oil_texticon.\nМетрополия получает §Y4000§! £fuel_texticon и запоминает услугу."
 NAM_wrk_trade_concession: "Торговая концессия метрополии"
 NAM_wrk_trade_concession_desc: "§YЦЕНА§!: §Y50§! £political_power_texticon §Y200§! £ADISCORD_economy_treasury_texticon\n§YВЫПОЛНЕНИЕ§!: §Y21§! £time_texticon дн.\n\n§YРЕЗУЛЬТАТ§!\nТорговые дома получают право продавать нефть мимо имперских контор.\nЕжемесячный доход после подписания: §G+[?NAM_wrk_trade_income|0]§! £ADISCORD_economy_treasury_texticon, пока существует метрополия.\n\n§YПРИ СРЫВЕ§!\nКазна возвращает взнос. Политическая власть не возвращается."
 NAM_cost_wrk_trade_concession: "§Y50§! £political_power_texticon §Y200§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_wrk_trade_concession_blocked: "§R50§! £political_power_texticon §R200§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_wrk_trade_concession_tooltip: "§Y50§! £political_power_texticon §Y200§! £ADISCORD_economy_treasury_texticon\nКазна вернётся, если переговоры будут прерваны."
 NAM_wrk_concession_started_tt: "Казна: §R-200§! £ADISCORD_economy_treasury_texticon; задаток вернётся, если переговоры прервутся."
 NAM_wrk_concession_signed_tt: "Концессия подписана: §G+[?NAM_wrk_trade_income|0]§! £ADISCORD_economy_treasury_texticon в месяц, пока существует метрополия."
 NAM_wrk_concession_refund_tt: "Переговоры прерваны: §G200§! £ADISCORD_economy_treasury_texticon возвращаются в казну. Политическая власть не возвращается."
 NAM_wrk_concession_status_active: "§Gподписана§!, приносит §Y[?NAM_wrk_trade_income|0]§! £ADISCORD_economy_treasury_texticon в месяц."
 NAM_wrk_concession_status_talks: "§Yидут переговоры§!."
 NAM_wrk_concession_status_none: "не подписана; после подписания будет приносить §Y[?NAM_wrk_trade_income|0]§! £ADISCORD_economy_treasury_texticon в месяц."
 NAM_hidden_reserve_status_active: "\nТайный резерв: §Y[?NAM_hidden_reserve|0]§! £ADISCORD_economy_treasury_texticon, поступит в казну при независимости."
 NAM_hidden_reserve_status_none: ""
 NAM_counterinsurgency_sweep: "Облава жандармерии"
 NAM_counterinsurgency_sweep_desc: "§YЦЕНА§!: §Y20§! £political_power_texticon §Y75§! £ADISCORD_economy_treasury_texticon\n§YВЫПОЛНЕНИЕ§!: §Y21§! £time_texticon дн.\n§YПОВТОР В ОКРУГЕ§!: через §Y120§! £time_texticon дн. после завершения.\n\n§YРЕЗУЛЬТАТ§!\nЖандармерия обыскивает округ, проверяет документы и арестовывает подозреваемых.\nПодполье: §G-8§! £operatives_boost_resistance_texticon, в Светлогорске §G-12§!. Поддержка округов: §R-4§! £NAM_support_dist_texticon.\n\n§YРИСК И ОТМЕНА§!\nПерегибы дополнительно снижают стабильность и поддержку округов, усиливая подполье. Лояльные гарнизоны уменьшают этот риск.\nПрерванная облава возвращает взнос казны; политическая власть не возвращается."
 NAM_cost_counterinsurgency_sweep: "§Y20§! £political_power_texticon §Y75§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_counterinsurgency_sweep_blocked: "§R20§! £political_power_texticon §R75§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_counterinsurgency_sweep_tooltip: "§Y20§! £political_power_texticon §Y75§! £ADISCORD_economy_treasury_texticon\nКазна вернётся, если облава будет прервана."
 NAM_sweep_slot_free_tt: "Другая облава сейчас не идёт"
 NAM_sweep_started_tt: "Казна: §R-75§! £ADISCORD_economy_treasury_texticon; задаток вернётся, если облава прервётся.\nОдновременно идёт только одна облава."
 NAM_sweep_done_tt: "Подполье: §G-8§!, в Светлогорске §G-12§!.\nПоддержка округов: §R-4§! £NAM_support_dist_texticon.\nС вероятностью §Y30%§! (§Y15%§! при поддержке гарнизонов от §Y60§!) случаются перегибы: стабильность §R-2%§!, поддержка округов ещё §R-4§! £NAM_support_dist_texticon, подполье §R+3§!."
 NAM_sweep_refund_tt: "Облава прервана: §G75§! £ADISCORD_economy_treasury_texticon возвращаются в казну. Политическая власть не возвращается."
 NAM_wrk_emergency_echelon: "Эшелон для центра"
 NAM_wrk_emergency_echelon_desc: "§YЦЕНА§!: §Y25§! £political_power_texticon §Y3000§! £fuel_texticon\n§YВЫПОЛНЕНИЕ§!: §Y21§! £time_texticon дн.\n§YЛИМИТ§!: §Y3§! эшелона, отправлено §Y[?NAM_wrk_echelons_delivered|0]§!.\n\n§YРЕЗУЛЬТАТ§!\nМетрополия получает §Y3000§! £fuel_texticon, её склады присылают §G6000§! £infantry_equipment_texticon и §G60§! единиц снаряжения поддержки.\nПоддержка: наместники §G+2§! £NAM_support_nam_texticon.\n\n§YПРИ СРЫВЕ§!\nЕсли метрополия исчезнет раньше отправки, топливо вернётся. Политическая власть не возвращается."
 NAM_cost_wrk_emergency_echelon: "§Y25§! £political_power_texticon §Y3000§! £fuel_texticon"
 NAM_cost_wrk_emergency_echelon_blocked: "§R25§! £political_power_texticon §R3000§! £fuel_texticon"
 NAM_cost_wrk_emergency_echelon_tooltip: "§Y25§! £political_power_texticon §Y3000§! £fuel_texticon\nТопливо вернётся, если эшелон не уйдёт до распада метрополии."
 NAM_wrk_echelon_loaded_tt: "Топливо: §R-3000§! £fuel_texticon; оно вернётся, если эшелон не уйдёт до распада метрополии."
 NAM_wrk_echelon_delivered_tt: "Эшелон пришёл: §G+6000§! £infantry_equipment_texticon и §G+60§! единиц снаряжения поддержки. Метрополия получает §Y3000§! £fuel_texticon.\nПоддержка наместников: §G+2§! £NAM_support_nam_texticon."
