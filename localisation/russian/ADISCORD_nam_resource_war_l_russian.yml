 NAM_board_guard_delivery_tt:0 "Инвесторы передают лицензию на серийный бронетранспортёр. С каждым заказом оружия охрана поставляет §G40§! машин."
 NAM_corp_auction_clear_tt:0 "Федеральный округ подчиняется Светлогорью, управляет своей столицей, а право владельца концессии никем не оспорено."
 NAM_corp_export_influence_tt:0 "Влияние корпораций §R+3§!."
 NAM_board_labor_nominee:0 "Пётр Литвинов"
 NAM_board_labor_nominee_desc:0 "Мастер производственного обучения с островной биржи труда. Артели поручили Литвинову добиться мест для своих учеников в технических училищах."
 NAM_board_bank_nominee:0 "Леонид Белов"
 NAM_board_bank_nominee_desc:0 "Белов вёл в банке счета судоремонтных мастерских. В правительство его выдвинули директора, которые хотят сами определять, чей заказ получит оборотный кредит."
 NAM_board_labor_appointment_tt:0 "При независимом правлении корпораций, пока министр назначен:\n§Y$NAM_corp_name_5$§! получает §G+1§! голос и не бойкотирует правительство.\nЗа каждый уровень: Скорость строительства §G+2%§!; прирост производственной эффективности §G+2%§!.\n\n$NAM_board_advisor_strength_tt$"
 NAM_board_bank_appointment_tt:0 "При независимом правлении корпораций, пока министр назначен:\n§Y$NAM_corp_name_6$§! получает §G+1§! голос и не бойкотирует правительство.\nЗа каждый уровень: Скорость строительства §G+3%§!; фактор фабрик, занятых производством товаров народного потребления §G-1%§!.\n\n$NAM_board_advisor_strength_tt$"
