 NAM_Arseny_Klyuch: "Арсений Тарханов"
 NAM_Lev_Gavanov: "Лев Корнилов"
 NAM_Taras_Shtyk: "Тарас Дроздов"
 NAM_Vera_Pechat: "Вера Сабурова"
