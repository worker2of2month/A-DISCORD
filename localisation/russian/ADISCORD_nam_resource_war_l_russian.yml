 NAM_pw_exile_drill_tt:0 "§YУчения на пляжах островов§!\n§Y30§! £time_texticon дней учений: опыт армии §G+15§!, готовность к возвращению §G+10§!. Если учения прервутся, добыча вернётся.\nЦена: [NAMPwCostDrill]. После учений - §Y15§! £time_texticon дней отдыха.\n[NAMPwDrillStatus]"
 NAM_pw_order_marines_label:0 "Морская пехота"
