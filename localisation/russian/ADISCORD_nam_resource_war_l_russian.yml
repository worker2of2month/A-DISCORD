 NAM_corp_name_2: "Трест \"Феррант\""
 NAM_corp_name_3: "Пароходство \"Навис\""
 NAM_corp_name_4: "Компания \"Арктур\""
 NAM_corp_name_5: "Агентство \"Сменком\""
 NAM_corp_name_6: "Банк \"Рейдбанк\""
 NAM_corp_owner_1_district: "Округ концерна \"Лорэн\""
 NAM_corp_owner_1_district_desc: "Профиль компании действует, пока округ остаётся федеральным подданным Светлогорья.\n\nДивиденды совету правлений: §Y8§! капитала в месяц при действующей администрации. Спор о владельце останавливает выплаты без контрактной охраны доступной столицы. Первые три купона военного займа направляют доход на погашение."
 NAM_corp_owner_2_district: "Округ треста \"Феррант\""
 NAM_corp_owner_2_district_desc: "Профиль компании действует, пока округ остаётся федеральным подданным Светлогорья.\n\nДивиденды совету правлений: §Y10§! капитала в месяц при действующей администрации. Спор о владельце останавливает выплаты без контрактной охраны доступной столицы. Первые три купона военного займа направляют доход на погашение."
 NAM_corp_owner_3_district: "Округ пароходства \"Навис\""
 NAM_corp_owner_3_district_desc: "Профиль компании действует, пока округ остаётся федеральным подданным Светлогорья.\n\nДивиденды совету правлений: §Y10§! капитала в месяц при действующей администрации. Спор о владельце останавливает выплаты без контрактной охраны доступной столицы. Первые три купона военного займа направляют доход на погашение."
 NAM_corp_owner_4_district: "Округ компании \"Арктур\""
 NAM_corp_owner_4_district_desc: "Профиль компании действует, пока округ остаётся федеральным подданным Светлогорья.\n\nДивиденды совету правлений: §Y6§! капитала в месяц при действующей администрации. Спор о владельце останавливает выплаты без контрактной охраны доступной столицы. Первые три купона военного займа направляют доход на погашение."
 NAM_corp_owner_5_district: "Округ агентства \"Сменком\""
 NAM_corp_owner_5_district_desc: "Профиль компании действует, пока округ остаётся федеральным подданным Светлогорья.\n\nДивиденды совету правлений: §Y12§! капитала в месяц при действующей администрации. Спор о владельце останавливает выплаты без контрактной охраны доступной столицы. Первые три купона военного займа направляют доход на погашение."
 NAM_corp_owner_6_district: "Округ банка \"Рейдбанк\""
 NAM_corp_owner_6_district_desc: "Профиль компании действует, пока округ остаётся федеральным подданным Светлогорья.\n\nДивиденды совету правлений: §Y15§! капитала в месяц при действующей администрации. Спор о владельце останавливает выплаты без контрактной охраны доступной столицы. Первые три купона военного займа направляют доход на погашение."
 NAM_corp_auction_district: "Аукцион концессии округа"
 NAM_corp_auction_district_desc: "В зале совета правлений раскладывают карты округа и отчёты о его промыслах. Представители корпораций готовят свои предложения; местные жители узнают о торгах из газет."
 NAM_corp_auction_tt: "Округ переходит к следующей корпорации.\nИностранный капитал: §G+60§!.\nСтабильность округа: §R-5%§! £stability_texticon."
 NAM_corp_board_arbitration: "Арбитраж совета правлений"
 NAM_corp_board_arbitration_desc: "Арбитры совета выслушивают представителей двух корпораций. На стол ложатся договоры, выписки и карты спорного округа; каждая сторона уверяет, что защищает законные права."
 NAM_cost_corp_arbitration: "§Y25§! £political_power_texticon §Y30§! капитала"
 NAM_cost_corp_arbitration_blocked: "§R25§! £political_power_texticon §R30§! капитала"
 NAM_cost_corp_arbitration_tooltip: "§Y25§! £political_power_texticon §Y30§! капитала"
 NAM_corp_hearing_jurisdiction_tt:0 "Светлогорье независимо, а администрация спорного округа контролирует свою столицу. После восстановления полномочий совет может вернуться к тому же иску."
 NAM_corp_arbitration_tt:0 "Округ возобновляет выплаты.\nДо учреждения судов шансы сторон равны.\nСуды при министрах Вебера подтверждают договор, при управляющих компаний передают концессию претенденту.\nРешение суда защищает округ от новых исков на §Y180§! £time_texticon дн."
 NAM_corp_charter_renewal: "Продлить устав округа"
 NAM_corp_charter_renewal_desc: "Стороны возвращаются к подписанному уставу. Прежде чем поставить новые подписи, представители округа и корпорации сверят исполнение прежних обязательств."
 NAM_corp_renewal_tt: "Иностранный капитал: §G+40§!.\nСтабильность округа: §G+5%§! £stability_texticon."
 ADISCORD_nam_resource_war.108.t: "Корпорации делят округ"
 ADISCORD_nam_resource_war.108.d: "В совет правлений поступила жалоба: [NAM_corp_case_district.NAMGetCorpClaimantName] требует передать ей концессию на округ [NAM_corp_case_district.GetName], которым сейчас владеет [NAM_corp_case_district.NAMGetCorpOwnerName]. Претендент обещает щедрую плату за решение в свою пользу, нынешний владелец грозит судом и отзывом кредитов.\n\nДиректора смотрят на председателя. Любое решение обидит одну из корпораций, а отложенное решение обидит обе: пока идёт спор, округ не платит ни гроша."
 ADISCORD_nam_resource_war.108.a: "Отдать округ претенденту."
 ADISCORD_nam_resource_war.108.b: "Подтвердить права владельца."
 ADISCORD_nam_resource_war.108.c: "Передать спор арбитрам."
 NAM_corp_108_a_tt: "Округ переходит к претенденту.\nИностранный капитал: §G+40§!."
 NAM_corp_108_b_tt: "Округ остаётся у владельца.\nИностранный капитал: §R-20§! - компенсация претенденту."
 NAM_corp_108_c_tt: "Спор передан на арбитраж совета: до решения округ не платит дивидендов."
