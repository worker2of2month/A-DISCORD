 NAM_colonial_emergency_stocks_refund_tt:0 "§G+650§! £ADISCORD_economy_treasury_texticon."
 NAM_svetlogorsk_dam:0 "Светлогорский гидроузел"
 NAM_svetlogorsk_dam_desc:0 "Ром предлагает превратить послевоенное восстановление в стройку общего будущего. Плотина у Светлогорска свяжет водохранилище, турбинный зал и новую промышленную площадку единой сетью. Проектировщикам предстоит согласовать работу с городом и жителями береговых посёлков."
 NAM_project_hydroelectric_unlock_tt:0 "ГЭС обеспечит Светлогорску §G2§! гражданские фабрики и §G+15%§! к скорости строительства в регионе."
 NAM_project_hydroelectric:0 "Построить Светлогорскую ГЭС"
 NAM_project_hydroelectric_desc:0 "Геодезисты размечают берега, подрядчики готовят бетон и турбины. За ограждением стройки начинается будущий промышленный район."
 NAM_hydroelectric_site_tt:0 "Светлогорск принадлежит нам и под нашим контролем; ГЭС ещё не построена, в регионе можно разместить две гражданские фабрики. Светлогорье независимо и победило в ресурсной войне."
 NAM_project_hydroelectric_result_tt:0 "Через §Y180§! £time_texticon дн.: в Светлогорске §G+2§! гражданские фабрики с участками; ГЭС даёт §G+15%§! к скорости строительства в регионе. При отмене возвращается вся цена."
 NAM_project_hydroelectric_refund_tt:0 "§G+50§! £political_power_texticon, §G+1200§! £ADISCORD_economy_treasury_texticon."
 NAM_svetlogorsk_hydropower:0 "Светлогорская ГЭС"
 NAM_svetlogorsk_hydropower_desc:0 "Турбины гидроузла снабжают энергией городские стройки и предприятия."
 NAM_project_hydroelectric_cost:0 "§Y50§! £political_power_texticon §Y1200§! £ADISCORD_economy_treasury_texticon"
 NAM_project_hydroelectric_cost_blocked:0 "§R50§! £political_power_texticon §R1200§! £ADISCORD_economy_treasury_texticon"
 NAM_project_hydroelectric_cost_tooltip:0 "§Y50§! £political_power_texticon §Y1200§! £ADISCORD_economy_treasury_texticon"
 NAM_colonial_campaigns:0 "Газеты наместничества"
 NAM_colonial_campaigns_desc:0 "Свободно: §Y[?ADISCORD_available_campaign_slots|0]§! £operatives_propaganda_texticon\nОдновременно проводится одна колониальная кампания. После распада метрополии её место освобождается."
 NAM_radio_network:0 "Развернуть сеть радио и печати"
 NAM_radio_network_desc:0 "Окружные редакции получат собственные передатчики и постоянную доставку тиражей. Голос столицы дойдёт до дальних промыслов."
 NAM_radio_network_result_tt:0 "Дополнительное место для пропаганды: §G+1§! (всего §Y2§!)."
 NAM_radio_network_unlock_tt:0 "Оплаченная сеть открывает второе место для пропаганды."
 NAM_radio_network_cost:0 "§Y40§! £political_power_texticon §Y400§! £ADISCORD_economy_treasury_texticon"
 NAM_radio_network_cost_blocked:0 "§R40§! £political_power_texticon §R400§! £ADISCORD_economy_treasury_texticon"
 NAM_radio_network_cost_tooltip:0 "§Y40§! £political_power_texticon §Y400§! £ADISCORD_economy_treasury_texticon"
 NAM_social_payroll_cost:0 "§Y200§! £ADISCORD_economy_treasury_texticon"
 NAM_social_payroll_cost_blocked:0 "§R200§! £ADISCORD_economy_treasury_texticon"
 NAM_social_payroll_cost_tooltip:0 "§Y200§! £ADISCORD_economy_treasury_texticon"
 NAM_incidents:0 "Происшествия Светлогорья"
 NAM_incident_countdown:0 "До следующего происшествия"
 NAM_incident_countdown_desc:0 "Диспетчеры собирают сообщения с промыслов, из округов и казённых контор. Пока тревожные сводки не сложились в общую картину."
