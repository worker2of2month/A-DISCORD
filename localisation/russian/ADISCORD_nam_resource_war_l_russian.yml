 NAM_econ_export_dispatch:0 "Открыть экспортную диспетчерскую"
 NAM_econ_client_tt:0 "Есть хотя бы один действующий нефтяной контракт"
 NAM_econ_export_dispatch_result_tt:0 "На §Y180§! £time_texticon дн. каждая выполненная месячная поставка приносит дополнительно §G+30§! £ADISCORD_economy_treasury_texticon: всего §G70§! вместо §Y40§!. Без отгрузки дополнительного дохода нет."
 NAM_econ_export_dispatch_desc:0 "Цена: §Y25§! £political_power_texticon §Y50§! £ADISCORD_economy_treasury_texticon. Работа: §Y180§! £time_texticon дн. Повтор через §Y30§! £time_texticon дн.\n\nДиспетчеры сокращают посреднические потери при исполнении уже принятых покупателями контрактов. $NAM_econ_export_dispatch_result_tt$\n\nНужны действующий контракт и собственная контролируемая Южная гавань. Обычный расход §Y1500§! £fuel_texticon на покупателя сохраняется. Потеря гавани, капитуляция или подчинение закрывают диспетчерскую без возврата оплаты. Отсутствие топлива или клиентов не продлевает срок."
