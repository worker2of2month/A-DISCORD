 # ----- Exile revolution: radicals or humanists -----
 NAM_exile_politics: "Подготовка возвращения"
 NAM_exile_politics_desc: "Наместник свергнут в первую же ночь на островах, и курс изгнания выбран окончательно. Опоры Светлогорья и гуманисты Ярослава Вебера по-разному платят за возвращение, но высадка в Южной Гавани нужна обоим: здесь изгнанники готовятся к ней."
 NAM_exile_council_next_tt: "Сразу после высадки на островах соберётся совет: наместник будет свергнут, и власть возьмут §Yопоры Светлогорья§! или §Yгуманисты Вебера§!."
 ADISCORD_nam_resource_war.100.t: "Кто возьмёт печати"
 ADISCORD_nam_resource_war.100.d: "Не прошло и суток после высадки, как совет островного правительства собрался в бывшей таможне: в зале, где когда-то взвешивали руду, теперь висят карты потерянного материка. Наместник [ROOT.GetLeader] открыл заседание привычной речью о дисциплине печатей, но его уже никто не слушал. Люди, которые вывели армию из Южной Гавани, хотят знать, кто поведёт её обратно.\n\nПервыми поднялись офицеры и старшины опор - гарнизонов, нефтяных артелей, портовых контор. Их требование короткое: власть тем, кто держит оружие, острова - военный лагерь, море - кормушка, а соседи, отнявшие промыслы, заплатят за всё. За ними стоят флотилии, готовые выйти в набег по первому приказу.\n\nНа другой стороне зала - люди Ярослава Вебера. Бывший вождь подполья, которого канцелярия годами называла бандитом, говорит о свободных островах, открытых для чужих денег, о договорах вместо грабежа и о юге, который можно не покорить, а объединить. Банкиры из чужих портов уже ждут в гостинице у причала.\n\nНаместник смотрит на зал и понимает, что его время кончилось. Остаётся решить, чьи руки возьмут печати."
 ADISCORD_nam_resource_war.100.a: "Власть - опорам Светлогорья."
 ADISCORD_nam_resource_war.100.b: "Власть - гуманистам Вебера."
 NAM_exile_radical_tt: "Наместник свергнут. Власть берёт хунта опор во главе с §YРостиславом Карамышевым§! (этатизм).\nОткрываются пиратские флотилии, чёрный рынок и морская пехота за добычу.\nНациональный дух §YХунта опор§!: поддержка войны §G+10%§!, политическая власть §G+10%§!, организация армии §G+5%§!, стабильность §R-5%§!.\nГотовность к возвращению: §G+5§!."
 NAM_exile_humanist_tt: "Наместник свергнут. Власть берут гуманисты во главе с §YЯрославом Вебером§!.\nПиратские флотилии остаются в гавани; деньги на возвращение дадут иностранные корпорации: открывается категория «Свободные зоны».\nВся добыча изгнания продаётся инвесторам и становится иностранным капиталом.\nНациональный дух §YСвободные острова§!: стабильность §G+8%§!, скорость исследований §G+3%§!, поддержка войны §R-5%§!.\nВлияние корпораций: §Y20§! / 100."
 NAM_Rostislav_Karamyshev: "Ростислав Карамышев"
 NAM_Rostislav_Karamyshev_desc: "Ростислав Карамышев командовал береговой охраной Южной Гавани и последним уходил с причалов при эвакуации. На островах он собрал вокруг себя офицеров гарнизонов, старшин нефтяных артелей и капитанов флотилий. Он не обещает ни реформ, ни выборов - только возвращение."
 NAM_Mark_Olshansky: "Марк Ольшанский"
 NAM_Mark_Olshansky_desc: "Марк Ольшанский представлял на островах крупнейший консорциум инвесторов, а затем возглавил объединённый совет правлений. Он говорит языком балансов и дивидендов и уверен, что возвращение на материк - просто самая крупная сделка в истории Светлогорья."
 NAM_Yaroslav_Weber_leader_desc: "Ярослав Вебер прошёл путь от листовок в раздевалках промыслов до кабинета правительства в изгнании. Его гуманисты обещают свободные острова, договоры вместо грабежа и юг, объединённый в федерацию, а не покорённый силой."
 NAM_trait_pillar_junta_chief: "Вождь хунты опор"
 NAM_trait_corsair_patron: "Покровитель флотилий"
 NAM_trait_voice_of_the_districts: "Голос округов"
 NAM_trait_chairman_of_the_boards: "Председатель правлений"
 NAM_exile_pillar_junta: "Хунта опор"
 NAM_exile_pillar_junta_desc: "Гарнизоны, нефтяные артели и портовые конторы правят островами как военным лагерем. Всё служит возвращению: люди, корабли и добыча."
 NAM_exile_free_islands: "Свободные острова"
 NAM_exile_free_islands_desc: "Правительство Ярослава Вебера открыло острова для чужих денег и для своих граждан. Здесь больше спорят и меньше маршируют."
 # Humanist exile: corporations and free zones
 NAM_free_zones: "Свободные зоны"
 NAM_free_zones_desc: "Иностранный капитал: §Y[?NAM_corp_capital|0]§!, доход за прошлый месяц §G+[?NAM_corp_last_income|0]§!.\nВлияние корпораций: §Y[?NAM_corp_influence|0]§! / 100, изменение за месяц §Y[?NAM_corp_last_drift|0]§! - [NAMGetCorpBand]\nСвободные зоны: §Y[?NAM_free_zones_active|0]§! из §Y[?NAM_free_zone_slots|0]§!, на переговорах §Y[?NAM_free_zones_pending|0]§!.\n\nКаждая свободная зона приносит в месяц §Y20§! капитала и ещё §Y0.3§! за каждый пункт влияния, освобождает инвесторов от налогов (сбор налогов §R-3%§!) и каждый месяц поднимает влияние на §Y1§!, а правительство само сбивает его на §Y1§!. До §Y30§! инвесторы платят мало; с §Y30§! влияние приносит исследования, эффективность и торговлю; с §Y70§! стоит стабильности и политической власти; с §Y90§! правления требуют печатей. Три месяца с влиянием от §Y90§! или §Y100§! сразу - и корпорации возьмут власть."
 NAM_corp_band_low: "§Yинвесторы осторожничают§!: денег мало, выгод нет."
 NAM_corp_band_balance: "§Gравновесие§!: исследования §G+5%§!, эффективность §G+3%§!, торговый доход §G+10%§!."
 NAM_corp_band_pressure: "§Rдавление правлений§!: исследования §G+8%§!, эффективность §G+5%§!, торговый доход §G+15%§!, стабильность §R-5%§!, политическая власть §R-10%§!."
 NAM_corp_band_seals: "§Rправления требуют печатей§!: исследования §G+10%§!, эффективность §G+5%§!, торговый доход §G+20%§!, стабильность §R-10%§!, политическая власть §R-20%§!. Три месяца на этом уровне - и корпорации возьмут власть."
 NAM_corp_band_takeover: "§Rправят корпорации§!: исследования §G+10%§!, эффективность §G+8%§!, торговый доход §G+25%§!, стабильность §R-5%§!, политическая власть §R-15%§!."
 NAM_corp_dynamic: "Иностранные корпорации"
 NAM_corp_dynamic_desc: "Капитал инвесторов кормит изгнание, а их правления всё громче говорят в правительстве. Сила этого влияния определяет и выгоду, и цену."
 NAM_free_zone_state: "Свободная зона"
 NAM_free_zone_state_desc: "Налоговые каникулы, иностранные управляющие и стройки без пошлин."
 NAM_corp_steel_export_state: "Сталь на экспорт"
 NAM_corp_steel_export_state_desc: "Руда острова уходит на иностранные заводы по контракту."
 NAM_corporate_board_state: "Правление корпорации"
 NAM_corporate_board_state_desc: "Островом управляет совет директоров: шахты работают круглые сутки, а рабочие связаны контрактами."
 NAM_corp_charter_free_zone: "Учредить свободную зону"
 NAM_corp_charter_free_zone_desc: "Тридцать дней переговоров с инвесторами: остров получает налоговые каникулы, право строить без пошлин и иностранных управляющих. Зона приносит капитал каждый месяц, но каждая новая зона усиливает корпорации."
 NAM_corp_zone_slot_free_tt: "Есть место для новой свободной зоны: учреждено §Y[?NAM_free_zones_active|0]§! и на переговорах §Y[?NAM_free_zones_pending|0]§! из §Y[?NAM_free_zone_slots|0]§!, не больше §Y3§!"
 NAM_corp_charter_started_tt: "Начинаются переговоры с инвесторами; место свободной зоны занято. Политическая власть при срыве переговоров не возвращается."
 NAM_corp_charter_done_tt: "Если остров всё ещё наш, открывается свободная зона:\n- скорость строительства в регионе §G+25%§!, ресурсы §G+10%§!, ещё §G1§! место для строительства;\n- сбор налогов страны §R-3%§!;\n- иностранный капитал: §G+20§! сразу и доход каждый месяц;\n- влияние корпораций: §R+5§! сразу и §R+1§! в месяц."
 NAM_corp_charter_cancel_tt: "Переговоры сорваны: место свободной зоны освобождается. Политическая власть не возвращается."
 NAM_corp_sell_steel: "Продать островную сталь"
 NAM_corp_sell_steel_desc: "Сталь, алюминий и вольфрам островов уходят на иностранные заводы по долгосрочному контракту. Деньги приходят сразу, но шестьдесят дней наши мастерские остаются без собственного сырья."
 NAM_corp_owns_island_tt: "Светлогорью принадлежит хотя бы один остров"
 NAM_corp_sell_steel_tt: "Иностранный капитал: §G+60§!.\nВлияние корпораций: §R+3§!.\nРесурсы каждого нашего острова §R-50%§! на §Y60§! дней."
 NAM_corp_labour_contract: "Сдать рабочих в аренду"
 NAM_corp_labour_contract_desc: "Три тысячи островитян уезжают на верфи и рудники инвесторов на девяносто дней. Компании платят вперёд, а люди вернутся по окончании контракта."
 NAM_cost_corp_labour: "§Y3000§! £manpower_texticon"
 NAM_cost_corp_labour_blocked: "§R3000§! £manpower_texticon"
 NAM_cost_corp_labour_tooltip: "§Y3000§! £manpower_texticon\nРабочие вернутся через §Y90§! дней или при срыве контракта."
 NAM_corp_labour_started_tt: "Иностранный капитал: §G+45§!.\nВлияние корпораций: §R+4§! сразу и §R+1§! в месяц, пока рабочие на контракте.\n§Y3000§! £manpower_texticon вернутся по окончании контракта."
 NAM_corp_labour_return_tt: "Рабочие возвращаются: §G+3000§! £manpower_texticon."
 NAM_corp_innovation_park: "Технопарк инвесторов"
 NAM_corp_innovation_park_desc: "Иностранные инженеры открывают на островах лаборатории и опытные цеха. Через девяносто дней наши мастерские получат их технологии, а корпорации - новые места в советах."
 NAM_cost_corp_park: "§Y25§! £political_power_texticon §Y60§! капитала"
 NAM_cost_corp_park_blocked: "§R25§! £political_power_texticon §R60§! капитала"
 NAM_cost_corp_park_tooltip: "§Y25§! £political_power_texticon §Y60§! капитала\nКапитал вернётся, если работа будет прервана."
 NAM_corp_park_started_tt: "Иностранный капитал: §R-60§!; вернётся, если работа прервётся."
 NAM_corp_park_done_tt: "Влияние корпораций: §R+5§!."
 NAM_corp_park_refund_tt: "Работа прервана: §G60§! капитала возвращаются. Политическая власть не возвращается."
 NAM_corp_buy_arms: "Оружие от инвесторов"
 NAM_corp_buy_arms_desc: "Компании, которым нужен порядок на островах, охотно продают оружие правительству, которое этот порядок обеспечит."
 NAM_cost_corp_arms: "§Y60§! капитала"
 NAM_cost_corp_arms_blocked: "§R60§! капитала"
 NAM_cost_corp_arms_tooltip: "§Y60§! капитала"
 NAM_corp_spend_60_tt: "Иностранный капитал: §R-60§!."
 NAM_corp_influence_up_2_tt: "Влияние корпораций: §R+2§!."
 NAM_corp_curb_influence: "Обуздать правления"
 NAM_corp_curb_influence_desc: "Ревизия контрактов, сокращение мест инвесторов в советах и публичные слушания. Корпорации отступят, но инвесторы занервничают."
 NAM_corp_influence_above_zero_tt: "Влияние корпораций выше §Y0§!"
 NAM_corp_curb_tt: "Влияние корпораций: §G-10§!."
 NAM_corp_court_investors: "Привлечь инвесторов"
 NAM_corp_court_investors_desc: "Новые гарантии, места в советах и обещания будущих концессий приводят на острова свежие деньги - и новых хозяев."
 NAM_corp_court_tt: "Иностранный капитал: §G+40§!.\nВлияние корпораций: §R+10§!."
 NAM_order_marines_corp: "Морская пехота на капитал инвесторов"
 NAM_order_marines_corp_desc: "Капитал покрывает снаряжение, острова дают людей. Подготовленная дивизия морской пехоты появится в день начала войны возвращения: первая пойдёт в десант на Южную Гавань, остальные будут сформированы в островной столице. До войны приказ можно отменить с возвратом капитала и людей."
 NAM_cost_order_marines_corp: "§Y60§! капитала §Y4300§! £manpower_texticon"
 NAM_cost_order_marines_corp_blocked: "§R60§! капитала §R4300§! £manpower_texticon"
 NAM_cost_order_marines_corp_tooltip: "§Y60§! капитала §Y4300§! £manpower_texticon\nДо войны возвращения капитал и люди возвращаются при отмене приказа."
 NAM_order_marines_corp_tt: "Иностранный капитал: §R-60§!.\nВ день начала войны возвращения появится полностью укомплектованная дивизия морской пехоты."
 NAM_order_marines_corp_release: "Отменить приказы о морской пехоте"
 NAM_order_marines_corp_release_desc: "Распустить подготовленные дивизии морской пехоты до начала войны возвращения."
 NAM_order_marines_corp_release_tt: "За каждую из §Y[?NAM_marine_orders_paid|0]§! подготовленных дивизий возвращаются §G60§! капитала и §G4300§! £manpower_texticon."
 ADISCORD_nam_resource_war.101.t: "Правления требуют гарантий"
 ADISCORD_nam_resource_war.101.d: "Представители иностранных компаний пришли в правительство не с просьбой, а с проектом указа. Их правления вложили в острова слишком много, чтобы зависеть от настроений совета: они требуют гарантий от национализации, мест в бюджетных комиссиях и права назначать управляющих свободных зон.\n\nВебер помнит, как начиналось подполье: с людей, которым не оставили голоса. Теперь голоса требуют те, кто платит за возвращение. Отказ обойдётся в политический вес, уступка - в будущее правительства, а молчание будет прочитано как согласие."
 ADISCORD_nam_resource_war.101.a: "Отклонить проект указа."
 ADISCORD_nam_resource_war.101.b: "Подписать гарантии."
 ADISCORD_nam_resource_war.101.c: "Отложить ответ."
 NAM_corp_101_a_tt: "Влияние корпораций: §G-8§!."
 NAM_corp_101_b_tt: "Иностранный капитал: §G+40§!.\nВлияние корпораций: §R+5§!."
 NAM_corp_101_c_tt: "Влияние корпораций: §R+2§!."
 ADISCORD_nam_resource_war.102.t: "Правления требуют печатей"
 ADISCORD_nam_resource_war.102.d: "Совет директоров объединённых компаний прислал в правительство уже не проект, а ультиматум. Корпорации требуют передать им управление островами: бюджет, полицию порта и право подписывать договоры от имени Светлогорья. Без этого, говорят они, деньги на возвращение кончатся завтра.\n\nВ правительстве понимают, что за ультиматумом стоят не только счета. Охрану складов, причалы и половину транспортов давно оплачивают компании. Остановить их ещё можно - чрезвычайным указом или выкупом долей. Уступить - значит готовиться к дню, когда печати перейдут в чужие руки."
 ADISCORD_nam_resource_war.102.a: "Чрезвычайный указ."
 ADISCORD_nam_resource_war.102.b: "Выкупить доли."
 ADISCORD_nam_resource_war.102.c: "Отдать им места в совете."
 NAM_corp_102_a_tt: "Влияние корпораций: §G-20§!."
 NAM_corp_102_b_tt: "Иностранный капитал: §R-150§!.\nВлияние корпораций: §G-15§!."
 NAM_corp_102_c_tt: "Иностранный капитал: §G+80§!.\nВлияние корпораций: §R+5§!.\nЕсли влияние продержится на §Y90§! или выше три месяца или достигнет §Y100§!, корпорации возьмут власть."
 ADISCORD_nam_resource_war.103.t: "Совет директоров берёт власть"
 ADISCORD_nam_resource_war.103.d: "Утром в здание правительства вошли не солдаты, а юристы. Совет директоров объединённых компаний представил решение, под которым уже стояли подписи большинства министров: управление островами передаётся правлениям, а правительство возглавит Марк Ольшанский. Охрана порта, оплаченная компаниями, заняла причалы ещё ночью.\n\nЯрослав Вебер остаётся в правительстве, но больше не руководит им. Курс на федерацию юга никто не отменял - правления лишь пересчитали его в акциях. Свободные острова стали корпоративным Светлогорьем, и каждым островом теперь управляет совет директоров."
 ADISCORD_nam_resource_war.103.a: "Акционеры довольны."
 NAM_corp_takeover_tt: "Правительство возглавляет §YМарк Ольшанский§! (коммерческий гедонизм); правящая партия - гедонисты.\nСтрана становится §YКорпоративным Светлогорьем§!.\nКаждый наш остров получает §YПравление корпорации§!: ресурсы §G+15%§!, скорость строительства §G+15%§!, призывное население §R-20%§!.\nВлияние корпораций закреплено на §Y100§!: исследования §G+10%§!, эффективность §G+8%§!, торговый доход §G+25%§!, стабильность §R-5%§!, политическая власть §R-15%§!. Обуздать правления больше нельзя.\nКурс гуманистов на федерацию юга сохраняется.\nКаждый федеральный округ переходит к одной из шести корпораций: она даёт округу свой профиль и платит совету правлений дивиденды каждый месяц.\nОткрывается дерево фокусов §Yсовета правлений§!; завершённые фокусы гуманистов сохраняются."
 NAM_corporate_state: "Корпоративное Светлогорье"
 NAM_corporate_state_ADJ: "$NAM_ADJ$"
 NAM_corporate_state_DEF: "Корпоративное Светлогорье"
 # Great war of return and the southern settlement
 NAM_war_of_return_ready_compromise: "Светлогорье пережило компромиссный мир, дань выплачена, страна независима и не воюет, а хотя бы один утраченный промысел или Южная Гавань принадлежит независимой стране вне нашего союза"
 NAM_war_of_return_terms_compromise: "Война идёт против нынешних владельцев утраченных промыслов. Капитуляция всех владельцев вернёт промыслы Светлогорью; наша капитуляция приведёт к полному разделу страны. Срока у войны нет: она идёт до полной капитуляции одной из сторон."
 NAM_wor_coalition_faction: "Южная оборонительная коалиция"
