 NAM_cost_pirate_arms_tooltip: "§Y40§! добычи"
 NAM_pirate_spend_40_tt: "Добыча: §R-40§!."
 NAM_pirate_buy_heavy_arms: "Тяжёлое вооружение с чёрного рынка"
 NAM_pirate_buy_heavy_arms_desc: "Тяжёлое вооружение требует особых посредников и надёжного места разгрузки. Поверенные проверят груз до того, как он покинет чужой порт."
 NAM_cost_pirate_heavy_arms: "§Y70§! добычи"
 NAM_cost_pirate_heavy_arms_blocked: "§R70§! добычи"
 NAM_cost_pirate_heavy_arms_tooltip: "§Y70§! добычи"
 NAM_pirate_spend_70_tt: "Добыча: §R-70§!."
 NAM_pirate_buy_convoys: "Трофейные транспорты"
 NAM_pirate_buy_convoys_desc: "Судовладельцы, которым нечем платить портовые сборы, готовы обсуждать продажу корпусов. Наши капитаны осмотрят машины, трюмы и судовые документы."
 NAM_cost_pirate_convoys: "§Y60§! добычи"
 NAM_cost_pirate_convoys_blocked: "§R60§! добычи"
 NAM_cost_pirate_convoys_tooltip: "§Y60§! добычи"
 NAM_pirate_spend_60_tt: "Добыча: §R-60§!."
 NAM_pirate_fence_loot: "Сбыть добычу скупщикам"
 NAM_pirate_fence_loot_desc: "Скупщики предлагают за добычу гроши, но казна изгнания пуста, а жалованье ждать не будет. Поверенные снова отправляются к портовым менялам."
 NAM_cost_pirate_fence: "§Y50§! добычи"
 NAM_cost_pirate_fence_blocked: "§R50§! добычи"
 NAM_cost_pirate_fence_tooltip: "§Y50§! добычи"
 NAM_pirate_spend_50_tt: "Добыча: §R-50§!."
 NAM_receive_100_tt: "Казна: §G+100§! £ADISCORD_economy_treasury_texticon."
 NAM_exile_drill: "Учения на пляжах островов"
 NAM_exile_drill_desc: "Высадки со шлюпок, штурмы причалов и ночные переходы готовят изгнанников к возвращению. Инструкторы требуют от людей знать не только своё место в строю, но и каждый подход к берегу."
 NAM_cost_exile_drill: "§Y20§! £political_power_texticon §Y30§! [NAMGetDrillCurrency]"
 NAM_cost_exile_drill_blocked: "§R20§! £political_power_texticon §R30§! [NAMGetDrillCurrency]"
 NAM_cost_exile_drill_tooltip: "§Y20§! £political_power_texticon §Y30§! [NAMGetDrillCurrency]\nВзнос вернётся, если учения будут прерваны."
 NAM_revenge_not_full_tt: "Готовность к возвращению ниже §Y100§!"
 NAM_exile_drill_started_tt: "Взнос: §R-30§! [NAMGetDrillCurrency]; вернётся, если учения прервутся."
 NAM_exile_drill_done_tt: "Готовность к возвращению: §G+10§!."
 NAM_exile_drill_refund_tt: "Учения прерваны: §G30§! [NAMGetDrillCurrency] возвращаются. Политическая власть не возвращается."
 NAM_order_marines: "Приказ о морской пехоте"
 NAM_order_marines_desc: "Островные инструкторы готовят морскую пехоту к возвращению на материк. Люди учатся сходить со шлюпок, действовать у причалов и собираться после высадки."
 NAM_cost_order_marines: "§Y50§! добычи §Y4300§! £manpower_texticon"
 NAM_cost_order_marines_blocked: "§R50§! добычи §R4300§! £manpower_texticon"
 NAM_cost_order_marines_tooltip: "§Y50§! добычи §Y4300§! £manpower_texticon\nДо войны возвращения добыча и люди возвращаются при отмене приказа."
 NAM_marine_slot_free_tt:0 "Можно подготовить ещё одну дивизию: подготовлено §Y[?NAM_marine_orders_paid|0]§! из §Y[?NAM_marine_order_cap|0]§!, не больше §Y3§!; первая война возвращения ещё не началась"
 NAM_order_marines_tt: "§YДобыча:§! §R-50§!.\nВ начале первой войны возвращения: §G1§! £divisions_texticon полностью оснащённая дивизия - четыре батальона морской пехоты и сапёрная рота.\n\nПодготовленные части усиливают десант в $STATE_700$ до трёх дивизий; остальные формируются в островной столице.\nПри готовности к возвращению от §Y70§! третья дивизия десанта бесплатная, поэтому все оплаченные части появляются на островах.\nЕсли высадка недоступна, весь десант остаётся на островах.\n\nДо войны приказ можно отменить с возвратом добычи и людей.\n\nЛьготный заказ и бесплатный десант действуют только для первого похода. До первой доставки состав шаблона фиксирован; обычный набор по нему доступен."
 NAM_order_marines_release: "Отменить приказы о морской пехоте"
 NAM_order_marines_release_desc: "Штаб отменяет подготовку десантных формирований. Инструкторы закроют учебные ведомости, а коменданты сверят списки людей и выданного имущества."
 NAM_order_marines_release_tt: "За каждую из §Y[?NAM_marine_orders_paid|0]§! подготовленных дивизий возвращаются §G50§! добычи и §G4300§! £manpower_texticon."
 ADISCORD_nam_resource_war.90.t: "Флотилия вернулась"
 ADISCORD_nam_resource_war.90.d_success: "Флотилия вернулась в гавань с трюмами, осевшими по ватерлинию. На пути \"[NAMPwLastLane]\" она перехватила конвой, сняла с него топливо и ушла раньше, чем подоспел эскорт. Убытки считают судовладельцы: [NAMPwLastVictims]. На островах уже делят добычу и пересказывают, как капитаны поднимали над захваченными судами старый флаг Светлогорья."
 ADISCORD_nam_resource_war.90.d_prize: "Такой добычи острова ещё не видели. На пути \"[NAMPwLastLane]\" флотилия взяла на абордаж целый караван: топливо, ящики с винтовками и сами суда, которые теперь ходят под нашим флагом. Убытки считают судовладельцы: [NAMPwLastVictims]. Капитанов встречали на причале как героев, а в портовых тавернах уже поют о следующем набеге."
 ADISCORD_nam_resource_war.90.d_failure: "Флотилия вернулась ни с чем. На пути \"[NAMPwLastLane]\" конвой ([NAMPwLastVictims]) шёл под сильным эскортом, и рейдеры попали под огонь, едва показались на горизонте. Капитаны винят предателей в портах, моряки - капитанов. Флот изгнания слишком мал, чтобы терять корабли и людей в каждом неудачном выходе."
 ADISCORD_nam_resource_war.90.a: "Записать в судовой журнал."
 NAM_pirate_report_haul_tt: "Добыча: §G+[?NAM_pirate_last_loot|0]§!, всего §Y[?NAM_pirate_loot|0]§!.\nДурная слава: §Y[?NAM_pirate_notoriety|0]§! / 100."
 NAM_pirate_report_ship_lost_tt: "Потерян патрульный корабль.\nДурная слава: §Y[?NAM_pirate_notoriety|0]§! / 100."
 NAM_pirate_report_crew_lost_tt: "Потеряно §R1000§! £manpower_texticon.\nДурная слава: §Y[?NAM_pirate_notoriety|0]§! / 100."
 ADISCORD_nam_resource_war.91.t: "Пираты Светлогорья"
 ADISCORD_nam_resource_war.91.d: "Капитаны наших конвоев докладывают о нападении на пути \"[NAMPwLastLane]\" у островов изгнания. Нападавшие не скрывались: над их кораблями поднимался флаг правительства Светлогорья в изгнании. Часть груза потеряна, страховщики поднимают цены, а портовые конторы требуют от правительства защитить судоходство."
 ADISCORD_nam_resource_war.91.a: "Усилить охрану конвоев."
 ADISCORD_nam_resource_war.92.t: "Блокада островов"
 ADISCORD_nam_resource_war.92.d: "Эскадры коалиции встали на якорь у входа в островные гавани. Их командующий передал ультиматум с первым же катером: каждое судно под флагом Светлогорья, вышедшее в море, будет считаться пиратским и потоплено без предупреждения. Рыбаки остались на берегу, торговцы разворачивают суда к чужим портам.\n\nКапитаны флотилий предлагают переждать, пока внимание коалиции не ослабнет. Казначей знает, кому в штабе эскадры можно заплатить за слепые ночи. А в казармах всё громче говорят, что блокада лишь доказывает одно: враг нас боится."
 ADISCORD_nam_resource_war.92.a: "Залечь на дно."
 ADISCORD_nam_resource_war.92.b: "Заплатить за слепые ночи."
 ADISCORD_nam_resource_war.92.c: "Пусть блокируют."
 NAM_pirate_92_a_tt: "Дурная слава: §G-15§!.\nНабеги невозможны §Y60§! £time_texticon дней."
 NAM_pirate_92_b_tt: "Добыча: §R-50§!.\nДурная слава: §G-10§!."
 NAM_pirate_92_c_tt: "Блокада островов на §Y90§! £time_texticon дней: добыча топлива §R-25%§!, торговый доход §R-15%§!, налёты на конвои слабее, а набеги чаще проваливаются.\nГотовность к возвращению: §G+5§!."
 ADISCORD_nam_resource_war.93.t: "Карательный рейд"
 ADISCORD_nam_resource_war.93.d: "На рассвете корабли коалиции открыли огонь по столице изгнания. Снаряды легли в гавань и на склады у причалов, загорелись пакгаузы, рухнул старый маяк. Через несколько часов с флагмана пришло требование: выдать капитанов, водивших флотилии, и сдать добычу, иначе обстрел повторится, а следом высадится десант.\n\nСовет опор расходится во мнениях. Одни зовут вывести в море всё, что держится на плаву. Другие считают, что несколько выданных капитанов - малая цена за жизнь островов. Третьи предлагают рассредоточить флотилию по дальним бухтам и надолго исчезнуть."
 ADISCORD_nam_resource_war.93.a: "Принять бой."
 ADISCORD_nam_resource_war.93.b: "Выдать капитанов."
 ADISCORD_nam_resource_war.93.c: "Рассредоточить флотилию."
 NAM_pirate_93_a_tt: "Равные шансы: отбить рейд (опыт флота §G+5§!, готовность к возвращению §G+5§!) - или потерять патрульный корабль и §R1000§! £manpower_texticon.\nДурная слава: §R+5§!."
 NAM_pirate_93_b_tt: "Добыча: §R-40%§!.\nДурная слава: §G-25§!.\nГотовность к возвращению: §R-5§!."
 NAM_pirate_93_c_tt: "Дурная слава: §G-15§!.\nНабеги невозможны §Y90§! £time_texticon дней."
 ADISCORD_nam_resource_war.94.t: "Десант в Южной Гавани"
 ADISCORD_nam_resource_war.94.d: "Транспорты подошли к Южной гавани в предрассветном тумане теми же фарватерами, по которым флот когда-то уходил в изгнание. Морская пехота прыгала прямо в холодную воду и бежала по камням к причалам, где когда-то сбрасывали в море наши орудия. Гарнизон противника проснулся от выстрелов уже на набережной.\n\nВозвращение началось там, где закончилось бегство. Теперь у островов есть плацдарм на материке, и всё решат ближайшие дни: успеет ли коалиция сбросить десант в море или Светлогорье снова встанет на своей земле."
 ADISCORD_nam_resource_war.94.a: "За Светлогорье!"
 NAM_landing_report_tt: "Плацдарм взят: Южная Гавань под нашим контролем, гарнизон противника отброшен.\nВ Южной Гавани высадились дивизии морской пехоты: §Y[?NAM_marines_landed|0]§!.\nВ строй вступило подготовленных дивизий: §Y[?NAM_marines_orders_delivered|0]§!."
 NAM_landing_island_tt: "Десант ограничен §Y3§! дивизиями: ещё §Y[?NAM_marines_island|0]§! подготовленных дивизий сформированы в островной столице."
 NAM_pirate_blockade: "Блокада островов"
 ADISCORD_tech_svetlogorsk_marine_corps: "Морская пехота Светлогорья"
 ADISCORD_tech_svetlogorsk_marine_corps_desc: "Батальоны изгнания, обученные высаживаться с моря и брать причалы под огнём."
 # Focus trees: colony and exile
 # ----- Main tree: colony (before the collapse) -----
 NAM_wrk_trade_house:0 "Подворье в метрополии"
 NAM_wrk_trade_house_desc:0 "Наши нефтяные конторы годами торговали через чужих посредников. Откроем собственное подворье в Воркерланде: свои склады, свои приказчики и право подписывать договоры от имени Светлогорья."
 NAM_wrk_return_cargo:0 "Обратные рейсы"
 NAM_wrk_return_cargo_desc:0 "Танкеры уходят в метрополию полными и возвращаются порожняком. Пусть обратным рейсом идут станки: в Южной гавани хватит рабочих рук на новый завод."
 NAM_colonial_watch:0 "Сводки колониальной стражи"
 NAM_colonial_watch_desc:0 "Колониальная стража пишет рапорты, которые никто не читает. Соберём их в одну сводку: где режут трубы, кто печатает листовки и куда уходят люди Вебера."
 NAM_imperial_gendarmes:0 "Имперская жандармерия"
 NAM_imperial_gendarmes_desc:0 "У пристани встречают жандармов из метрополии. Их начальник требует проводника и отдельное помещение для допросов. Местный комендант перечитывает сопроводительное письмо, прежде чем ответить."
 NAM_oilfield_militia:0 "Промысловая самооборона"
 NAM_oilfield_militia_desc:0 "Буровики обсуждают ночные следы у ограды. Один узнал чужую подошву, другой слышал лодочный мотор со стороны протоки. Участковый кладёт перед ними карту и просит рассказать всё по порядку."
 NAM_pipeline_patrols:0 "Обходчики трубопроводов"
 NAM_pipeline_patrols_desc:0 "Обходчик ведёт стражников вдоль трубы. На мокрой земле видны следы телеги, которой здесь не полагалось быть. У ближайшей телефонной будки он останавливается и снимает трубку."
 NAM_print_shop_raid:0 "Найти чернила будущего восстания"
 NAM_print_shop_raid_desc:0 "У полицейского на столе лежат листовки с одинаковым дефектом печати. Наборщик долго рассматривает надломленную букву и просит показать обратную сторону бумаги. За окном ещё темно."
 NAM_colony_order:0 "Порядок на промыслах"
 NAM_colony_order_desc:0 "В канцелярии готовят очередное письмо покупателям из метрополии. Писарь спрашивает, какие промысловые сводки приложить. Начальник долго выбирает среди листов с одинаковыми заголовками."
 # ----- Main tree: colony tooltips -----
 NAM_wrk_trade_level_up_tt:0 "Положение наших торговых домов в метрополии: §G+1§! (не больше §Y3§!). Оно повышает выручку за партию топлива и доход торговой концессии."
 NAM_grp_wrk_trade_house_tt:0 "Поддержка групп:\n  Экспортные конторы: §G+6§! £NAM_support_trade_texticon\n  Наместники: §R-3§! £NAM_support_nam_texticon"
 NAM_colonial_watch_tt:0 "Подполье Вебера: §G-5§!."
 NAM_imperial_gendarmes_tt:0 "Подполье Вебера: §G-12§!."
 NAM_grp_imperial_gendarmes_tt:0 "Поддержка групп:\n  Наместники: §G+6§! £NAM_support_nam_texticon\n  Округа: §R-5§! £NAM_support_dist_texticon"
 NAM_oilfield_militia_tt:0 "Подполье Вебера: §G-6§!."
 NAM_grp_oilfield_militia_tt:0 "Поддержка групп:\n  Нефтяники: §G+5§! £NAM_support_oil_texticon\n  Округа: §G+4§! £NAM_support_dist_texticon\n  Наместники: §R-4§! £NAM_support_nam_texticon"
 NAM_pipeline_patrols_tt:0 "Подполье Вебера: §G-5§!."
 NAM_commissioner_plan_tt:0 "Подполье Вебера: §R+4§!."
 NAM_grp_commissioner_plan_tt:0 "Поддержка групп:\n  Наместники: §G+6§! £NAM_support_nam_texticon\n  Нефтяники: §R-4§! £NAM_support_oil_texticon"
 NAM_second_ledger_tt:0 "Сразу в скрытый резерв: §G+100§! £ADISCORD_economy_treasury_texticon.\nПока существует метрополия, каждый месяц в тайный резерв уходит §Y45§! £ADISCORD_economy_treasury_texticon из доли центра; доходы казны не уменьшаются.\nПри провозглашении независимости резерв поступает в казну."
 NAM_grp_second_ledger_tt:0 "Поддержка групп:\n  Экспортные конторы: §G+3§! £NAM_support_trade_texticon\n  Нефтяники: §G+3§! £NAM_support_oil_texticon\n  Наместники: §R-5§! £NAM_support_nam_texticon"
 NAM_metropolitan_instructors_tt:0 "Подполье Вебера: §G-10§!."
 NAM_grp_metropolitan_instructors_tt:0 "Поддержка групп:\n  Гарнизоны: §G+4§! £NAM_support_garr_texticon"
 NAM_quiet_officer_lists_tt:0 "При провозглашении независимости: §G+3000§! £manpower_texticon, поддержка гарнизонов §G+6§! £NAM_support_garr_texticon."
 NAM_grp_quiet_officer_lists_tt:0 "Поддержка групп:\n  Гарнизоны: §G+6§! £NAM_support_garr_texticon"
 NAM_sand_runs_out_vertical_tt:0 "При провозглашении независимости лестница печатей смещается к вертикали на §Y0.10§!."
 NAM_sand_runs_out_districts_tt:0 "При провозглашении независимости лестница печатей смещается к округам на §Y0.10§!."
 NAM_last_centre_register_reserve_tt:0 "Тайный резерв: §G+150§! £ADISCORD_economy_treasury_texticon."
 NAM_hidden_reserve_paid_tt:0 "Тайный резерв второй бухгалтерии поступает в казну: §G+[?NAM_hidden_reserve|0]§! £ADISCORD_economy_treasury_texticon."
 # ----- Defeated tree: island exile -----
 NAM_exile_mainland_contacts:0 "Связные на материке"
 NAM_exile_mainland_contacts_desc:0 "На промыслах остались наши люди: мастера, учителя, бывшие писари. Рыбацкие лодки повезут им письма и деньги, а обратно - сведения о новых хозяевах."
 NAM_exile_armed_underground:0 "Вооружённое подполье"
 NAM_exile_armed_underground_desc:0 "Связной с материка показывает островному офицеру схему промыслового двора. Он помнит расположение ворот, но не знает, кто теперь стоит на посту. За окном у причала ждёт рыбацкая лодка."
 NAM_exile_civic_underground:0 "Списки верных"
 NAM_exile_civic_underground_desc:0 "Не каждый, кто остался, готов стрелять, но многие готовы ждать. Составим списки верных - тех, кто откроет ворота и возьмёт на себя управление в день возвращения."
 NAM_exile_harbour_pilots:0 "Лоцманы Южной гавани"
 NAM_exile_harbour_pilots_desc:0 "Лоцманы, бежавшие на острова, разворачивают перед штабистами карты Южной гавани. На полях отмечены мели, старые створы и огни, которые видно лишь с моря. Офицер ведёт карандашом к причалу, но лоцман останавливает его руку: этим фарватером тяжёлое судно не пройдёт."
 NAM_exile_voice_of_svetlogorye:0 "Голос Светлогорья"
 NAM_exile_voice_of_svetlogorye_desc:0 "Островной передатчик каждый вечер читает имена городов, которые мы вернём. Его слушают на кухнях Светлогорска и в казармах оккупантов."
 NAM_exile_klyuchevsk_strike:0 "Забастовка в Ключевске"
 NAM_exile_klyuchevsk_strike_desc:0 "Из Ключевска пришла записка без даты. В ней перечислены имена буровых мастеров и привычные названия смен. Островной связной узнаёт почерк человека, которого считал погибшим."
 NAM_exile_general_staff:0 "Штаб в изгнании"
 NAM_exile_general_staff_desc:0 "Из уцелевших офицеров соберём штаб. У него нет полков, зато есть карты материка и время, чтобы научить новобранцев воевать."
 NAM_exile_landing_craft:0 "Десантные баржи"
 NAM_exile_landing_craft_desc:0 "Рыбацкие баржи и каботажные суда переоборудуем под перевозку войск."
 NAM_exile_cadre_army:0 "Кадровая армия"
 NAM_exile_cadre_army_desc:0 "В уцелевших ротах солдаты узнают друг друга по голосам. На островном плацу ветераны снова становятся рядом с теми, с кем отходили от промыслов. Инструктор начинает занятие с карты их последнего боя."
 NAM_exile_levy_of_exiles:0 "Ополчение изгнанников"
 NAM_exile_levy_of_exiles_desc:0 "В бараках беженцев читают новый призыв. У двери собираются мужчины, давно потерявшие свои служебные книжки. Писарь спрашивает прежнее место жительства и всякий раз останавливается над названием оставленного города."
 NAM_exile_arms_purchases:0 "Закупки оружия"
 NAM_exile_arms_purchases_desc:0 "Поверенный отыскивает оружейного посредника в портовой гостинице. На стол ложатся довоенные накладные с выцветшими печатями. Хозяин долго рассматривает подпись человека, который больше не вернётся."
 NAM_exile_marine_orders:0 "Морская пехота"
 NAM_exile_marine_orders_desc:0 "На островном берегу собираются будущие морские стрелки. Инструктор показывает им, как держаться в тесной шлюпке и где искать укрытие у причала. За проливом остаётся берег, который многие из них помнят с детства."
 NAM_exile_strike_from_the_sea:0 "Удар с моря"
 NAM_exile_strike_from_the_sea_desc:0 "На штабной карте офицеры отмечают подходы к Южной гавани. Капитан десантного судна просит ещё раз назвать место встречи. За окном учебные лодки уходят в вечерний туман."
 NAM_exile_strike_from_within:0 "Удар изнутри"
 NAM_exile_strike_from_within_desc:0 "Десант будет малым, но его встретят. Офицеры штаба переправятся на материк и подготовят восстание в день высадки."
 NAM_exile_landing_school:0 "Школа высадки"
 NAM_exile_landing_school_desc:0 "На пляжах островов отрабатываем высадку: погрузка, переход, выход на берег под огнём. Каждый батальон должен пройти её хотя бы раз."
 NAM_exile_sea_raiders:0 "Морские охотники"
 NAM_exile_sea_raiders_desc:0 "Флот у нас маленький, но суда коалиции ходят без охраны. Первые охотники выйдут в море за чужими грузами."
 NAM_exile_fences:0 "Скупщики добычи"
 NAM_exile_fences_desc:0 "Захваченный груз надо превратить в деньги. Портовые скупщики на островах не задают вопросов, если им платят вперёд."
 NAM_exile_letters_of_marque:0 "Каперские грамоты"
 NAM_exile_letters_of_marque_desc:0 "Капитаны явились за грамотами в парадных мундирах, давно вышедших из моды. Канцелярский писарь читает текст вслух. На словах о чести флага один из моряков прячет улыбку."
 NAM_exile_free_brotherhood:0 "Вольное братство"
 NAM_exile_free_brotherhood_desc:0 "Капитаны собираются в островной таверне без приглашения канцелярии. На столе вместо повестки лежат судовые карты. Каждый начинает рассказ со своего последнего похода."
 NAM_exile_tanker_raids:0 "Охота на танкеры"
 NAM_exile_tanker_raids_desc:0 "На горизонте проходит танкер с чужим флагом. Старый нефтяник узнаёт силуэт судна, которое прежде швартовалось у его промысла. Вахтенный записывает курс и время наблюдения."
 NAM_exile_black_market:0 "Чёрный рынок оружия"
 NAM_exile_black_market_desc:0 "Скупщик встречает поверенного у задней двери склада. Внутри не зажигают верхнего света. На сорванной упаковке ещё можно разобрать название далёкого военного арсенала."
 NAM_exile_privateer_captains:0 "Капитаны каперов"
 NAM_exile_privateer_captains_desc:0 "В портовую контору вызвали капитанов с самыми потрёпанными журналами. Морской инженер просит рассказать, где отказывали машины и как держался корпус в шторм. На этот раз морякам есть что сказать чиновникам."
 NAM_exile_hidden_anchorages:0 "Тайные стоянки"
 NAM_exile_hidden_anchorages_desc:0 "В бухтах малых островов оборудуем стоянки, о которых не знает коалиция. Рейдеры будут уходить туда, а не в главный порт."
 NAM_exile_raider_squadron:0 "Рейдерская эскадра"
 NAM_exile_raider_squadron_desc:0 "У достроечной стенки офицеры спорят о месте наблюдательного поста. Корабельный мастер слушает их с палубы, положив ладонь на холодную обшивку. В гавани уже обсуждают имя будущего флагмана."
 NAM_exile_wolfpacks:0 "Подводные стаи"
 NAM_exile_wolfpacks_desc:0 "Подводники разбирают учебный выход в тесной каюте. Командир мелом отмечает на доске силуэт транспорта. Рядом радист восстанавливает по памяти последние сигналы береговой станции."
 NAM_exile_corsair_admiralty:0 "Адмиралтейство каперов"
 NAM_exile_corsair_admiralty_desc:0 "Разрозненные экипажи становятся флотом. Адмиралтейство распределит рейды и подготовит корабли к сопровождению десанта."
 NAM_exile_island_chancellery:0 "Островная канцелярия"
 NAM_exile_island_chancellery_desc:0 "Министерства теснятся в портовых конторах. Разместим канцелярию как следует и проведём дороги от столицы к причалам."
 NAM_exile_free_port:0 "Вольный порт"
 NAM_exile_free_port_desc:0 "В гавани слышна речь моряков, которых здесь прежде не видели. Таможенный писарь откладывает привычный бланк и идёт за разъяснениями к начальнику. На рейде тем временем ждёт ещё одно судно."
 NAM_exile_naval_port:0 "Военный порт"
 NAM_exile_naval_port_desc:0 "Морские офицеры осматривают островную гавань в сопровождении местного смотрителя. Торговые капитаны следят за ними с мостиков. У старой ремонтной стенки начинается долгий спор о глубинах."
 NAM_exile_refugee_barracks:0 "Бараки беженцев"
 NAM_exile_refugee_barracks_desc:0 "Беженцы будут жить в бараках у учебных лагерей. Тесно и тяжело, но каждый мужчина из бараков пойдёт в армию возвращения."
 NAM_exile_refugee_homesteads:0 "Наделы на островах"
 NAM_exile_refugee_homesteads_desc:0 "Семья с материка обходит пустующий двор у островной столицы. На калитке ещё висит имя прежнего хозяина. Ребёнок спрашивает, можно ли посадить здесь дерево, как у оставленного дома."
 NAM_exile_coastal_batteries:0 "Береговые батареи"
 NAM_exile_coastal_batteries_desc:0 "Коалиция может прийти и сюда. Береговые батареи прикроют главные гавани островов."
 NAM_exile_island_steel:0 "Сталь Островов"
 NAM_exile_island_steel_desc:0 "Рудники на островах работали вполсилы, пока всё решала нефть. Теперь от них зависит каждая винтовка."
 NAM_exile_island_foundry:0 "Литейный двор"
 NAM_exile_island_foundry_desc:0 "У островного рудника мастер пробует старые литейные формы. Подмастерье держит фонарь над выбитыми клеймами. О том, что здесь лили прежде, помнят лишь самые старые рабочие."
 NAM_exile_overseas_districts:0 "Заморские округа"
 NAM_exile_overseas_districts_desc:0 "Острова больше не колония колонии. Их жители кормят, вооружают и защищают Светлогорье и получают те же права, что и материк."
