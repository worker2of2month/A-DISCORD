 NAM_council_registrar_contract:0 "Подготовить гражданских инженеров"
 NAM_council_registrar_contract_desc:0 "Техническая служба набирает мастеров на дополнительные курсы. Вечерами аудитории займут люди, которым завтра предстоит принимать станки и руководить стройками."
 NAM_council_workshop_contract:0 "Восстановить дороги Южнобережья"
 NAM_council_workshop_contract_desc:0 "Дорожные артели восстанавливают мосты, выравнивают разбитые участки и снова связывают поселения с рынками."
