 # Ladder of seals: names of the endings
 NAM_svetlogorsk_settlement:0 "Светлогорская держава"
 NAM_svetlogorsk_settlement_desc:0 "В папке Рома лежат две карты. На одной чиновники ещё по старой памяти обвели столицу Воркерланда. На другой землемеры отметили дома без крыш и больницы, где зимой лопнули трубы. Ром придвинул вторую карту и велел позвать прорабов."
 NAM_veyran_union_charter:0 "Провозгласить Вейранский имперский союз"
 NAM_veyran_union_charter_desc:0 "Ром сам встретил у трапа делегацию вейранских эмигрантов. За ужином он спросил, готовы ли они заключить союз со Светлогорьем и вернуться вместе с ним в старую столицу. Глава делегации вынул из кармана потемневшую печать. Утром под союзной грамотой стояли обе подписи."
 NAM_veyran_embarkation_staff:0 "Штаб заморской экспедиции"
 NAM_veyran_embarkation_staff_desc:0 "Портовый лоцман мелом нарисовал на столе привычный фарватер. На другом конце стола штабисты чертили чужой берег. Подвинув обе карты друг к другу, они впервые увидели, сколько угля, воды и буксиров отделяет роту на причале от роты на плацдарме."
 NAM_veyran_convoy_charter:0 "Зафрахтовать второй эшелон"
 NAM_veyran_convoy_charter_desc:0 "Капитан каботажного судна оставил на столе расписание мирных рейсов. Он просит выслушать старшего механика, прежде чем обсуждать новый маршрут. За дверью уже ждут остальные капитаны."
 NAM_veyran_arsenal_contract:0 "Полевой арсенал десанта"
 NAM_veyran_arsenal_contract_desc:0 "В заявке полковника против каждого орудия стоит номер трюма. Арсеналу придётся доставлять ящики именно в этом порядке: у первого причала никто не станет искать замки и прицелы под винтовками для третьего эшелона."
 NAM_veyran_counterplan:0 "План против объединителя"
 NAM_veyran_counterplan_desc:0 "Эмигранты помнят город таким, каким он был до распада. На новых снимках у казарм другая вывеска, а бывшая пассажирская пристань обнесена проволокой. Ром велел отложить старые схемы и выяснить, кому сегодня подчиняется каждый пост."
 NAM_veyran_unifier_tt:0 "Один из претендентов завершил воссоединение и возглавляет независимый Воркерланд."
 NAM_veyran_plan_ports_tt:0 "Во главе Воркерланда - §Y[ADISCORD_vorkerland_nation.GetLeader]§!. Эмигранты свяжутся со знакомыми лоцманами в портах, оставшихся в руках сторонников Уоркера."
 NAM_veyran_plan_sappers_tt:0 "Во главе Воркерланда - §Y[ADISCORD_vorkerland_nation.GetLeader]§!. Против укреплений, перешедших к военному командованию, экспедиция снарядит сапёрные команды."
 NAM_veyran_plan_columns_tt:0 "Во главе Воркерланда - §Y[ADISCORD_vorkerland_nation.GetLeader]§!. Против подвижных частей технократии штаб подготовит моторизованный резерв для защиты плацдарма."
 NAM_veyran_invasion:0 "Приказ о вторжении в Воркерланд"
 NAM_veyran_invasion_desc:0 "Когда-то из метрополии сюда приходили ведомости на нефть. Теперь диспетчер на той же частоте передаёт командирам время выхода. На мостике первого транспорта радист вслушивается в ответ с берега и убирает сходни по короткому кивку капитана."
 NAM_veyran_rom_mandate_tt:0 "Светлогорье независимо, выиграло ресурсную войну и войну за Юг. У власти этатист Егор Ром. Завершён один из фокусов: §Y$NAM_ladder_ending_iron$§! или §Y$NAM_ladder_ending_service$§!."
 NAM_svetlogorsk_settlement_tt:0 "Государство принимает название §YСветлогорская держава§!."
 NAM_svetlogorsk_trust_works_tt:0 "При исполнении каждого оплаченного договора окружные тресты улучшат инфраструктуру на §G1§! £infrastructure_texticon в одном из принадлежащих нам и удерживаемых пограничных округов.\nВ округе с полной дорожной сетью построят §G1§! £civ_factory при наличии свободной площадки."
 NAM_veyran_union_charter_tt:0 "Ром провозглашает §YВейранский имперский союз§! и открывает подготовку похода в Воркерланд."
 NAM_veyran_contract_funds_tt:0 "В казне есть §Y300§! £ADISCORD_economy_treasury_texticon для оплаты контракта."
 NAM_veyran_contract_price_tt:0 "Расход при поставке: §R-300§! £ADISCORD_economy_treasury_texticon."
 NAM_veyran_can_invade_tt:0 "Ром возглавляет независимое этатистское Светлогорье.\nВоркерланд воссоединился, независим и удерживает свой столичный дистрикт.\nОбе державы в мире, не состоят в общем альянсе и завершили урегулирование региональных войн.\nПоход ещё не состоялся."
 NAM_veyran_invasion_tt:0 "§RНачнётся война с объединённым Воркерландом.§!\n\nПри его капитуляции Союз присоединит его владения и перенесёт столицу в §YЦентральный дистрикт§!.\nЗемли, принадлежавшие Рому перед походом, образуют §YСветлогорское наместничество§!, которое передаст Союзу §Y100%§! гражданских фабрик, военных заводов и ресурсов.\n\nПри капитуляции Рома он заключит мир, откажется от имперских притязаний и вернёт стране название §YСветлогорская держава§!."
 NAM_svetlogorye_derzhava:0 "Светлогорская держава"
 NAM_svetlogorye_derzhava_DEF:0 "$NAM_svetlogorye_derzhava$"
 NAM_svetlogorye_derzhava_ADJ:0 "$NAM_ADJ$"
