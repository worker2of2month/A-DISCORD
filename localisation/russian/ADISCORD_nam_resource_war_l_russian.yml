 NAM_treasury_chancellery: "Казначейская палата"
 NAM_treasury_chancellery_desc: "Казна Светлогорья получает собственную палату. Теперь деньги можно занять, напечатать указом или вложить - если знать цену."
 NAM_machine_imports: "Импорт станков"
 NAM_machine_imports_desc: "Палата договаривается о закупке станков за нефть. Каждая партия - новый завод в Южной гавани."
 NAM_fuel_inspectorate: "Нефтяная инспекция"
 NAM_fuel_inspectorate_desc: "Инспекторы находят на промыслах больше нефти, чем показывали отчёты."
 NAM_patronage_fund: "Фонд покровительства"
 NAM_patronage_fund_desc: "Лояльность групп можно купить. Фонд делает это открыто и по прейскуранту."
 NAM_emergency_fund: "Чрезвычайный фонд"
 NAM_emergency_fund_desc: "Отложенные деньги позволяют закрыть любое происшествие без торга."
 NAM_treasury_balance: "Сбалансированная казна"
 NAM_treasury_balance_desc: "Казна научилась собирать столько, сколько тратит. Остаток идёт на развитие."
 NAM_crisis_office: "Служба происшествий"
 NAM_crisis_office_desc: "Пожары, стачки и скандалы больше не застают канцелярию врасплох. Служба готовит меры заранее."
 NAM_field_firefighters: "Пожарные дружины промыслов"
 NAM_field_firefighters_desc: "Каждый промысел получает пожарную дружину и запас пены."
 NAM_customs_guard: "Таможенная стража"
 NAM_customs_guard_desc: "Стража перехватывает контрабанду и делит конфискат с казной."
 NAM_strike_mediators: "Мировые посредники"
 NAM_strike_mediators_desc: "Посредники договариваются со стачечниками дешевле, чем любая уступка канцелярии."
 NAM_chancellery_purge: "Чистка канцелярии"
 NAM_chancellery_purge_desc: "Ревизия вычищает из канцелярии самых жадных. Наместники недовольны, округа - рады."
 NAM_crisis_doctrine: "Устав чрезвычайных положений"
 NAM_crisis_doctrine_desc: "У каждой беды есть порядок действий. Происшествия случаются реже и обходятся дешевле."
 NAM_field_firefighters_tt: "Пожар на промысле тушится без затрат казны."
