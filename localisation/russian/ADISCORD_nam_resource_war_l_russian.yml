 NAM_crisis_doctrine_tt: "Происшествия случаются §Gвдвое реже§!."
 NAM_treasury: "Казна Светлогорья"
 NAM_treasury_desc: "Казна: §Y[?ADISCORD_economy_treasury|0]§! £ADISCORD_economy_treasury_texticon\n\nДеньги и политическая власть обмениваются друг на друга. Происшествия случаются в среднем раз в год; чрезвычайный фонд закрывает любое из них без потерь."
 NAM_bond_payments: "Выплаты по облигациям"
 NAM_bond_payments_desc: "Канцелярия расплачивается с держателями нефтяных облигаций."
 NAM_oil_bonds: "Нефтяные облигации"
 NAM_oil_bonds_desc: "Деньги сейчас под залог будущей нефти. Выплаты будут стоить канцелярии политического веса."
 NAM_emergency_decrees: "Чрезвычайные указы"
 NAM_emergency_decrees_desc: "Канцелярия вводит разовые сборы указом. Деньги приходят сразу, а терпение округов убывает."
 NAM_buy_machine_tools: "Закупить станки"
 NAM_buy_machine_tools_desc: "Партия станков превращается в новый гражданский завод в Южной гавани."
 NAM_fuel_audit: "Ревизия промыслов"
 NAM_fuel_audit_desc: "Инспекторы поднимают учётные книги и находят спрятанную нефть."
 NAM_crisis_fund: "Пополнить чрезвычайный фонд"
 NAM_crisis_fund_desc: "Отложенные деньги закроют следующее происшествие без потерь."
 NAM_crisis_prevention: "Профилактика происшествий"
 NAM_crisis_prevention_desc: "Проверки, учения и премии осторожным на полгода вперёд."
 NAM_crisis_fund_tt: "Следующее происшествие можно закрыть §Gбез потерь§!."
 NAM_crisis_prevention_tt: "Происшествия не случаются §Y180§! дней."
 NAM_crisis_fund_used_tt: "Расходуется чрезвычайный фонд."
 NAM_crisis_free_tt: "Обходится без затрат."
 NAM_crisis_pay_250_tt: "Казна: §R-250§! £ADISCORD_economy_treasury_texticon."
 NAM_crisis_pay_100_tt: "Казна: §R-100§! £ADISCORD_economy_treasury_texticon."
 ADISCORD_nam_crisis.1.t: "Пожар на промысле"
 ADISCORD_nam_crisis.1.d: "Ночью вспыхнула одна из скважин Северных месторождений. Огонь перекинулся на хранилища, и рабочие спрашивают, сколько канцелярия готова заплатить, чтобы его остановить."
 ADISCORD_nam_crisis.1.a: "Потушить любой ценой."
 ADISCORD_nam_crisis.1.b: "Пусть выгорит."
 ADISCORD_nam_crisis.1.z: "Чрезвычайный фонд."
 ADISCORD_nam_crisis.2.t: "Забастовка нефтяников"
 ADISCORD_nam_crisis.2.d: "Смены промыслов не вышли на работу. Нефтяники требуют прибавки и обещают не возвращаться, пока её не получат."
 ADISCORD_nam_crisis.2.a: "Повысить жалованье."
 ADISCORD_nam_crisis.2.b: "Разогнать стачку."
 ADISCORD_nam_crisis.2.z: "Чрезвычайный фонд."
 ADISCORD_nam_crisis.3.t: "Скандал в канцелярии"
 ADISCORD_nam_crisis.3.d: "Газеты нашли в канцелярии расписки, по которым наместники брали деньги за подписи. Округа требуют суда."
 ADISCORD_nam_crisis.3.a: "Замять дело."
 ADISCORD_nam_crisis.3.b: "Публичный суд."
 ADISCORD_nam_crisis.3.z: "Чрезвычайный фонд."
 ADISCORD_nam_crisis.4.t: "Контрабанда контор"
 ADISCORD_nam_crisis.4.d: "Экспортные конторы вывозят нефть мимо таможни. Можно потребовать свою долю и закрыть глаза - или ударить по контрабанде."
 ADISCORD_nam_crisis.4.a: "Взять долю."
 ADISCORD_nam_crisis.4.b: "Пресечь контрабанду."
 ADISCORD_nam_crisis.5.t: "Дезертирство в гарнизонах"
 ADISCORD_nam_crisis.5.d: "Солдаты гарнизонов покидают посты, жалуясь на долги по жалованью. Офицеры просят денег или трибунала."
 ADISCORD_nam_crisis.5.a: "Выплатить долги."
 ADISCORD_nam_crisis.5.b: "Созвать трибунал."
 ADISCORD_nam_crisis.5.z: "Чрезвычайный фонд."
