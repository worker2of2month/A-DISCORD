 NAM_mil_reserve_arsenal_result_tt:0 "Через §Y21§! £time_texticon дн.: §G+9000§! £infantry_equipment_texticon, §G+80§! £support_equipment_texticon."
 NAM_mil_reserve_arsenal_refund_tt:0 "§G+300§! £ADISCORD_economy_treasury_texticon."
 NAM_mil_reserve_arsenal_desc:0 "Цена: §Y30§! £political_power_texticon §Y300§! £ADISCORD_economy_treasury_texticon. Срок: §Y21§! £time_texticon дн. Повтор через §Y90§! £time_texticon дн. после завершения.\n\nПока идёт подготовка к ресурсной войне, оплатите снаряжение резервистов. Уже оплаченный заказ будет доставлен и после начала войны.\n§G+9000§! £infantry_equipment_texticon, §G+80§! £support_equipment_texticon.\n\nПри капитуляции, подчинении или утрате условий заказа вся оплата возвращается. Начало и завершение войны сами по себе заказ не отменяют. Поставка поступает Светлогорью."
