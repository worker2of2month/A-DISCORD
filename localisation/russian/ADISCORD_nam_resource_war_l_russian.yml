 NAM_admin_svetlogorsk_cooperative:0 "Открыть артели Светлогорска"
 NAM_admin_svetlogorsk_cooperative_delivered_tt:0 "Светлогорск: §G+1§! гражданская фабрика, §G+1§! строительный участок. §Y+10%§! $NAM_ladder_bop$."
 NAM_admin_svetlogorsk_cooperative_result_tt:0 "Через §Y35§! £time_texticon дн.: Светлогорск: §G+1§! гражданская фабрика, §G+1§! строительный участок. §Y+10%§! $NAM_ladder_bop$."
 NAM_admin_svetlogorsk_cooperative_desc:0 "Цена: §Y30§! £political_power_texticon §Y300§! £ADISCORD_economy_treasury_texticon. Срок: §Y35§! £time_texticon дн. Повтор через §Y120§! £time_texticon дн. после завершения.\n\nСобрания объединят деньги на мастерские Светлогорска. При потере города или строительного места взнос вернётся. Утраченные мощности можно построить заново за полную цену.\nСветлогорск: §G+1§! гражданская фабрика, §G+1§! строительный участок. §Y+10%§! $NAM_ladder_bop$.\nПоддержка округов: не меньше §Y60§! £NAM_support_dist_texticon при запуске и завершении. Падение ниже порога отменяет программу и возвращает оплату.\n\nПри капитуляции, подчинении или утрате условий программы вся оплата возвращается. Война и смена дерева сами по себе не отменяют заказ. Все результаты получает Светлогорье."
 NAM_admin_svetlogorsk_cooperative_refund_tt:0 "§G+300§! £ADISCORD_economy_treasury_texticon."
 NAM_admin_svetlogorsk_cooperative_cost:0 "§Y30§! £political_power_texticon §Y300§! £ADISCORD_economy_treasury_texticon"
