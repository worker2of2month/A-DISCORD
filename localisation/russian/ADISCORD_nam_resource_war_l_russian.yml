 NAM_exile_klyuchevsk_strike_tt:0 "Готовность к возвращению повысится на §G5§!, максимум до §Y100§!."
 NAM_exile_resistance_site_tt:0 "Промысел удерживает противник или возможный участник войны за возвращение."
 NAM_klyuchevsk_oil_strike:0 "Забастовка буровиков Ключевска"
 NAM_exile_strike_reopens_tt:0 "Забастовка затрагивает добычу нефти и хрома. Рабочие вернутся на промысел досрочно, если противник потеряет Ключевск или Светлогорье победит в войне за возвращение."
