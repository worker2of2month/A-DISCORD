 NAM_pw_order_marines_tt:0 "§YПриказ о морской пехоте§!\nДивизия будет обучена к войне возвращения: первая пойдёт в десант на Южную Гавань, остальные сформируются в островной столице. До войны приказ можно отменить решением, добыча и люди вернутся.\nЦена: [NAMPwCostMarines]. Следующий приказ - через §Y14§! £time_texticon дней.\n[NAMPwMarinesStatus]"
