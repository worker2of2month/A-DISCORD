 NAM_econ_deep_drilling_delivered_tt:0 "Производственная мощность выбранного промысла: §G+2§!. Пропускная способность зависит от состояния промысла; предел мощности §Y12§!."
 NAM_econ_deep_drilling_result_tt:0 "Через §Y42§! £time_texticon дн.: Производственная мощность выбранного промысла: §G+2§!. Пропускная способность зависит от состояния промысла; предел мощности §Y12§!."
 NAM_econ_deep_drilling_refund_tt:0 "Возврат оплаты: §Y30§! £political_power_texticon §Y200§! £ADISCORD_economy_treasury_texticon"
 NAM_econ_deep_drilling_desc:0 "Цена: §Y30§! £political_power_texticon §Y200§! £ADISCORD_economy_treasury_texticon. Срок: §Y42§! £time_texticon дн. Повтор через §Y90§! £time_texticon дн.\n\nПроизводственная мощность выбранного промысла: §G+2§!. Пропускная способность зависит от состояния промысла; предел мощности §Y12§!.\nЗанимает одно общее место проектов и выбранный промысел до завершения. При потере площадки, капитуляции, подчинении или утрате условий обе валюты возвращаются, место освобождается. На выжженных промыслах работы недоступны."
