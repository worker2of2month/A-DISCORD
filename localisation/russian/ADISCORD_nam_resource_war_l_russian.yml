 ADISCORD_nam_story.14.t:0 "Конституция Союза"
 ADISCORD_nam_story.14.d:0 "Конституцию Союза подписывали не в таможне и не в бывшем наместничестве, а в зале вокзала Светлогорска, у той площади, где когда-то раздавали первые листовки подполья. Делегаты всего Юга сидели на скамьях для пассажиров: другого зала, где поместились бы все, не нашлось.\n\nВ тексте нет слова \"наместник\". Есть округа, совет, суд, где можно обжаловать решение правительства, и статья о том, что промыслы служат тем, кто на них работает. Вебер настоял, чтобы её напечатали слово в слово, как в первой листовке. Юристы федерального совета заметили, что так законы не пишут. Он ответил, что так их читают.\n\nПосле подписания люди долго не расходились. Кто-то принёс старую листовку, пожелтевшую и сложенную вчетверо, и положил её рядом с подлинником. Архивист спросил, вносить ли её в опись. Вебер сказал, что да."
 ADISCORD_nam_story.14.a:0 "Союз подписан."
 ADISCORD_nam_story.21.t:0 "Почётное кресло"
 ADISCORD_nam_story.21.d:0 "Марк Ольшанский пригласил Вебера не в здание правительства, а в зал совета правлений на верхнем этаже банка у причала. На стене уже висел его портрет - написанный, судя по краске, ещё до того, как юристы вошли в министерства. Под портретом стояла табличка: \"Почётный председатель\".\n\nОльшанский говорил спокойно и без угроз. Правления не собираются отменять курс на федерацию Юга: они собираются его финансировать. Им нужно лицо, которому верят округа, и голос, который на материке узнают по радио. Взамен Веберу предлагают жалованье, охрану и право выступать на каждом собрании акционеров. Решать он больше ничего не будет, но сможет говорить.\n\nТоварищи Вебера по подполью ждут на набережной. Одни уже служат в охране компаний, другие собирают подписи против совета директоров. Если Вебер откажется, правления найдут другой портрет. Если согласится, его подпись появится под решениями, которых он не читал."
 ADISCORD_nam_story.21.a:0 "Вебер принимает кресло."
 ADISCORD_nam_story.21.b:0 "Вебер уходит в округа."
 NAM_story_21_a_tt:0 "Поддержка групп:\n  Округа: §R-6§! £NAM_support_dist_texticon"
 NAM_story_21_b_tt:0 "Поддержка групп:\n  Округа: §G+6§! £NAM_support_dist_texticon\nИностранный капитал: §R-40§!."
 ADISCORD_nam_story.22.t:0 "Лот номер семь"
 ADISCORD_nam_story.22.d:0 "Каталог торгов напечатали на мелованной бумаге, с фотографиями и таблицами. Округ шёл в нём седьмым лотом: два промысла, железнодорожная ветка, склады, рабочие кварталы, начальная школа на четыреста мест и больница. Стартовая цена указана одной суммой, без разбивки.\n\nНа торги пришли представители трёх компаний и одна учительница. Она купила билет на пароход до островов на собственное жалованье, чтобы спросить, кто будет платить учителям после смены владельца. В зал её не пустили: участникам торгов требовался залог. Она оставила секретарю письмо и осталась ждать на ступенях.\n\nДиректора говорят, что школа и больница - часть стоимости округа: без них никто не станет работать на промыслах, поэтому их и продают вместе. Ольшанский может провести торги по каталогу или снять школу и больницу с лота и оставить их на содержании совета, потеряв часть выручки."
 ADISCORD_nam_story.22.a:0 "Продать по каталогу."
 ADISCORD_nam_story.22.b:0 "Снять школу и больницу с торгов."
 NAM_story_22_a_tt:0 "Иностранный капитал: §G+60§!.\nПоддержка групп:\n  Округа: §R-6§! £NAM_support_dist_texticon"
 NAM_story_22_b_tt:0 "Иностранный капитал: §R-30§!.\nПоддержка групп:\n  Округа: §G+5§! £NAM_support_dist_texticon"
 ADISCORD_nam_story.23.t:0 "Союз правлений"
 ADISCORD_nam_story.23.d:0 "Годовой отчёт Союза правлений вышел толще любого закона, который когда-либо издавало Светлогорье. В нём учтено всё: добыча каждого промысла, тоннаж каждого порта, дивиденды каждой компании, стоимость каждого округа от островов до пустыни. Юг впервые сведён в одну ведомость, и в ней нет ни одной пустой строки.\n\nНа последней странице перечислены акционеры. Среди них нет ни одного округа. Ольшанский считает это достижением: управлять Югом наконец могут люди, которые умеют считать. На собраниях правлений больше не спорят о границах, флагах и обидах прошлого - только о цене.\n\nВ архиве совета хранится и первая листовка Вебера, изъятая при обыске много лет назад. Её внесли в опись как имущество без балансовой стоимости."
 ADISCORD_nam_story.23.a:0 "Отчёт утверждён."
 ADISCORD_nam_story.31.t:0 "Перекличка"
 ADISCORD_nam_story.31.d:0 "По условиям компромиссного мира пленных вернули в первый же месяц. Их выстроили на плацу у Южной гавани и читали фамилии по спискам частей. Тех, кто откликался, отпускали домой. Остальные фамилии зачитывали дважды, а потом переносили в отдельный лист.\n\nОтдельный лист оказался длиннее, чем рассчитывал штаб. В нём погибшие у Северных месторождений, пропавшие при отступлении, оставшиеся по ту сторону новой границы. В канцелярию приходят семьи и просят одного: сказать, в каком из этих трёх столбцов стоит их фамилия.\n\nНачальники управлений предлагают объявить итог одной цифрой и не публиковать списки, пока их не сверят: неточная фамилия хуже никакой. Офицеры возражают: если правительство прячет имена, люди решат, что оно прячет и вину. Сверка займёт годы, а ответа будут ждать каждый день."
 ADISCORD_nam_story.31.a:0 "Огласить полные списки."
 ADISCORD_nam_story.31.b:0 "Объявить итог одной цифрой."
 NAM_story_31_a_tt:0 "Поддержка групп:\n  Округа: §G+4§! £NAM_support_dist_texticon"
 NAM_story_31_b_tt:0 "Поддержка групп:\n  Наместники: §G+3§! £NAM_support_nam_texticon\n  Округа: §R-3§! £NAM_support_dist_texticon"
 ADISCORD_nam_story.32.t:0 "Обед для посланника"
 ADISCORD_nam_story.32.d:0 "Эфлорского посланника принимали в бывшем зале приёмов наместничества. Повара спорили, что подать человеку, чья армия ещё год назад стояла у Северных месторождений, и в конце концов приготовили то же, что подавали воркерландским ревизорам. Посланник это заметил и улыбнулся.\n\nРазговор шёл о мелочах: пропуска для рабочих через новую границу, график поставок по дани, ремонт моста у Сухоречья, который обе стороны взрывали по очереди. Ни один из этих вопросов нельзя было решить без другого, и к десерту стороны впервые договорились о чём-то, кроме прекращения огня.\n\nУходя, посланник сказал, что в Эфлоре тоже есть люди, потерявшие сыновей у месторождений, и что им тоже нужно объяснять, ради чего был этот мир. Ответить было нечего. Его проводили до машины, а на следующее утро в канцелярию пришёл первый подписанный протокол о пропусках."
 ADISCORD_nam_story.32.a:0 "Мир строят из мелочей."
 ADISCORD_nam_story.33.t:0 "Синяя линия"
 ADISCORD_nam_story.33.d:0 "Старую карту из штаба убирать не стали. Новую границу прочертили на ней карандашом, тонко, как временную линию снабжения, а прежнюю оставили жирной синей краской. Офицеры, проходя мимо, по привычке смотрят на синюю.\n\nПланы здесь составляют молча. Арсеналы перестраивают под видом ремонтных мастерских, призывные списки ведут как списки рабочих бригад, а запасы топлива в отчётах для эфлорских наблюдателей называют неснижаемым резервом промыслов. По условиям мира всё это запрещено. По условиям прежних договоров многое было запрещено и Эфлору, пока он не перешёл границу.\n\nНа нижнем поле карты кто-то из штабных мелким почерком выписал отданные промыслы и даты, когда их потеряли. Список никто не стирает. Каждое утро дежурный офицер проверяет, на месте ли он, и только потом докладывает обстановку."
 ADISCORD_nam_story.33.a:0 "Синяя линия остаётся."
 ADISCORD_nam_story.34.t:0 "Вторая глава"
 ADISCORD_nam_story.34.d:0 "В канцелярии завели новую книгу приказов. Первая, начатая при воркерландской администрации и законченная в день компромиссного мира, ушла в архив. Её последняя запись - о передаче промыслов коалиции и о выплате дани. Новая книга открылась чистой страницей.\n\nСветлогорье стало меньше, беднее и осторожнее. Оно больше не владеет большей частью нефти Юга и не может делать вид, что соседи забудут старые обиды. Но оно пережило войну, сохранило гавань, острова и людей, которые умеют работать на промыслах, и научилось считать то, что раньше называли неизбежным.\n\nПервую запись в новой книге сделали без торжества: о ремонте дороги к уцелевшим скважинам. Под ней поставили подпись, дату и, впервые за многие годы, фамилию исполнителя."
 ADISCORD_nam_story.34.a:0 "Начать вторую главу."
 ADISCORD_nam_story.40.t:0 "Записки Егора Рома. Последняя страница"
 ADISCORD_nam_story.40.d_iron:0 "Сегодня сборы пришли вовремя из всех округов. Мезенцев принёс мне ведомость, и я долго смотрел на неё, прежде чем подписать. Много лет я мечтал о такой бумаге: всё согласовано, всё исполнено, никто не возражает. Теперь она лежит передо мной, а я не могу вспомнить, когда в последний раз кто-нибудь приходил в приёмную с жалобой.\n\nСекретарь говорит, что жалоб стало меньше. Я спросил, меньше ли стало причин. Он ответил, что этого в отчёте не указывают. Тогда я попросил принести журнал возвращённых прошений. Журнал оказался толще ведомости.\n\nОтец спросил бы меня не о полномочиях, а о работе. Работа идёт: насосы починены, дороги проходимы, соседи не решаются на новую войну. Лестница, которой я служил всю жизнь, стала государством, и это государство держится крепко. Я сам выбрал, на что оно опирается.\n\nНа последней странице этой тетради записываю: журнал возвращённых прошений должен лежать на моём столе рядом с ведомостью. Не уверен, что стану его читать. Пусть хотя бы лежит там, где его видно."
 ADISCORD_nam_story.40.d_service:0 "Сегодня меня впервые вызвали в комиссию по жалобе. Жаловался сторож склада в Сухоречье: его уволили по распоряжению, которое подписал я. Комиссия попросила показать основание. Я принёс копию. В ней не хватало строки о том, кто проверял обстоятельства. Комиссия вернула распоряжение на пересмотр.\n\nПо дороге обратно я подсчитал, сколько раз за свою службу возвращал чужие бумаги из-за пропущенной строки, а потом бросил считать. Унизительно, как я ожидал, не было. Скорее непривычно: впервые за много лет на мою подпись можно было пожаловаться тому, кто не обязан мне подчиняться.\n\nОтец спросил бы меня не о полномочиях, а о работе. Работа идёт медленнее, чем при лестнице. Служащие ворчат, просители ждут дольше, но знают, у кого спросить. Я не уверен, что этот порядок переживёт первую большую беду. Уверен только, что прежний её не пережил.\n\nНа последней странице этой тетради записываю фамилию сторожа и дату пересмотра. Пусть следующий, кто будет читать эти записи, проверит, чем кончилось дело."
 ADISCORD_nam_story.40.d_prag_republic:0 "Сегодня в реестр внесли жалобу на правительство, то есть на меня. Управа Сухоречья записала, что мы обязались починить мост к осени. Мост не починили. По соглашению такое дело разбирают трое по жребию: один от округов, один от казны, один от хозяйственных объединений. Я сел на стул, на котором обычно сидят подрядчики.\n\nУправа не просила наказания. Она просила новый срок и фамилию того, кто за него отвечает. Я назвал свою. Секретарь записал её тем же почерком, каким записывает остальные, и не поднял головы.\n\nОтец спросил бы меня не о полномочиях, а о работе. Работа идёт: мост достроят к зиме, и об этом знает каждый, кто умеет читать реестр. Я привык, что власть - это право не объяснять. Оказалось, что объяснять утомительно, но после объяснения люди расходятся по домам, а не по углам.\n\nНа последней странице этой тетради записываю срок и свою фамилию. Если мост не будет готов, следующий, кто прочтёт эти записи, знает, с кого спросить."
 ADISCORD_nam_story.40.d_prag_directorate:0 "Сегодня совет закрыл заседание на час раньше срока. Все строки ведомости исполнены, у каждой подпись и дата. Мезенцев сказал, что такого не было ни при метрополии, ни при наместниках. Я согласился и спросил, сколько прошений пришло за неделю из округов. Он ответил, что прошения теперь принимает приёмная совета и в ведомость они не попадают.\n\nВечером я сходил в приёмную сам. Дежурный открыл мне шкаф. В нём лежали бумаги от тех, с кем никто не заключал договоров: вдовы, сезонные рабочие, посёлок, мимо которого прошла новая дорога. На каждой стояла отметка: не является стороной обязательства.\n\nОтец спросил бы меня не о полномочиях, а о работе. Работа идёт быстрее, чем когда-либо: танкеры уходят по графику, заводы получают сталь в срок, соседи платят вперёд. Я сам усадил за этот стол тех, кто умеет исполнять подписанное. Тех, кому нечего подписывать, я оставил у стены.\n\nНа последней странице этой тетради записываю: шкаф из приёмной перенести в зал совета и открывать перед каждым заседанием. Не знаю, прочтут ли они эти бумаги. Пусть хотя бы голосуют, глядя на них."
 NAM_warehouse_relief_port_tt:0 "Складские свидетельства позволяют принять обратный груз и через порт Светлогорска, если Южная гавань потеряна."
