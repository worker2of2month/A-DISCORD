 NAM_mil_carrier_contract_result_tt:0 "Через §Y28§! £time_texticon дн.: §G+160§! $ADISCORD_armored_carrier_2163$, §G+60§! £support_equipment_texticon."
 NAM_mil_carrier_contract_refund_tt:0 "§G+250§! £ADISCORD_economy_treasury_texticon."
 NAM_mil_carrier_contract_desc:0 "Цена: §Y35§! £political_power_texticon §Y250§! £ADISCORD_economy_treasury_texticon. Срок: §Y28§! £time_texticon дн. Повтор через §Y90§! £time_texticon дн. после завершения.\n\nКолонны используют бронетранспортёры, а грузовики нужны подвозу. Этот заказ даст запас машин для четырёх механизированных батальонов; технология бронетранспортёров открывается при поставке, если ещё не изучена.\n§G+160§! $ADISCORD_armored_carrier_2163$, §G+60§! £support_equipment_texticon.\n\nПри капитуляции, подчинении или утрате условий заказа вся оплата возвращается. Начало и завершение войны сами по себе заказ не отменяют. Поставка поступает Светлогорью."
