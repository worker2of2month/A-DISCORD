 NAM_colonial_local_register_refund_tt:0 "§G+300§! £ADISCORD_economy_treasury_texticon."
 NAM_colonial_emergency_stocks_cost:0 "§Y650§! £ADISCORD_economy_treasury_texticon"
 NAM_colonial_emergency_stocks_cost_blocked:0 "§R650§! £ADISCORD_economy_treasury_texticon"
