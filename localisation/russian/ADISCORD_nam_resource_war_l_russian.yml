 NAM_hidden_fuel_capacity_tt:0 "В тайниках есть место для ещё 40000 £fuel_texticon (общий предел: 100000)."
 NAM_concealed_fuel_tt:0 "Скрытые запасы: §G+20000§! £fuel_texticon. Они будут возвращены после бегства администрации."
 NAM_hidden_fuel_room_tt:0 "В обычных топливных хранилищах есть место."
 NAM_recover_hidden_fuel:0 "Забрать топливо из тайников"
 NAM_recover_hidden_fuel_desc:0 "Промысловые смотрители вернут скрытые цистерны в государственный учёт."
 NAM_recover_hidden_fuel_tt:0 "Остаток в тайниках: §Y[?NAM_hidden_fuel|0]§! £fuel_texticon. Заполняет свободные хранилища; лишнее остаётся в тайниках."
 NAM_metropolitan_flight_result_tt:0 "Вывезено: §R[?NAM_evacuated_treasury|0]§! £ADISCORD_economy_treasury_texticon и §R[?NAM_evacuated_fuel|0]§! £fuel_texticon.\nСохранено в тайниках: §G[?NAM_sheltered_treasury|0]§! £ADISCORD_economy_treasury_texticon и §G[?NAM_sheltered_fuel|0]§! £fuel_texticon.\nДеньги возвращены в казну; топливо сверх вместимости остаётся доступным через решение."
 ADISCORD_nam_resource_war.88.t:0 "Последний эшелон метрополии"
 ADISCORD_nam_resource_war.88.d:0 "Центральные кассиры ушли раньше, чем канцелярия получила приказ об их отзыве. Ночью у банков стояли казённые грузовики; у промыслов запирали подъездные пути, пока последние цистерны не уходили на север. Утром на столах остались описи с одной и той же резолюцией: \"Эвакуировано в распоряжение центрального правительства\".\n\nУвозили всё, что числилось в открытых книгах: деньги колонии, горючее из государственных хранилищ, грузы, которые ещё не успели принять местные распорядители. Смотрители, обещавшие дождаться подписи наместника, предъявляли уже чужие предписания. В порту сняли телефонные трубки.\n\nНо у каждой ведомости была граница. До отдельных складов центральные проверяющие так и не дошли; некоторых счетов не существовало на присланных им страницах. Теперь местным бухгалтерам и промысловикам предстоит открыть то, что удалось скрыть, и выяснить, с чем Светлогорье осталось на самом деле."
 ADISCORD_nam_resource_war.88.a:0 "Открыть наши книги."
 NAM_recover_open_fuel:0 "Принять возвращённые цистерны"
 NAM_recover_open_fuel_desc:0 "Цистерны отменённого заказа ожидают разгрузки на подъездных путях."
 NAM_recover_open_fuel_tt:0 "Ожидает разгрузки: §Y[?NAM_open_fuel_reserve|0]§! £fuel_texticon. Заполняет свободные хранилища. Этот запас не защищён от вывоза при распаде."
 NAM_island_convoy_service_cancel_condition_tt:0 "Светлогорье утратило действующую независимую администрацию или контроль над всеми собственными островными округами."
 NAM_island_steel_levy_cancel_condition_tt:0 "Светлогорье утратило действующую независимую администрацию или контроль над всеми собственными стальными округами: [228.GetName], [230.GetName], [231.GetName]."
 NAM_island_public_works_cancel_condition_tt:0 "Светлогорье утратило действующую независимую администрацию; участок утрачен, оккупирован или уже имеет максимальную инфраструктуру."
 NAM_captured_wells_shock:0 "Промыслы в руках врага"
 NAM_captured_wells_shock_desc:0 "Потерянные промыслы подрывают уверенность страны в победе и снабжение военной промышленности.\n\nВ ресурсной войне штраф зависит от доли захваченных действующих скважин в мощности бассейна. Повреждения уменьшают их вклад; выжженные скважины временно не учитываются. Возвращение промыслов снижает штраф, конец войны снимает его."
 NAM_captured_wells_warning_tt:0 "§YПОТЕРЯ СКВАЖИН§!\nШтраф за долю захваченных врагом действующих скважин в мощности бассейна: до §R-30%§! £war_support_texticon и §R-20%§! выпуска военных заводов.\nПовреждённые - по состоянию; выжженные исключены на §Y180§! £time_texticon. Возврат промысла снижает штраф, конец войны снимает."
 NAM_captured_wells_report:0 "\n\n§YПРОМЫСЛЫ В РУКАХ ВРАГА§!\nЗахваченная действующая мощность: §Y[?NAM_captured_capacity|1] / [?NAM_basin_capacity|0]§!\nПоддержка войны: [?NAM_captured_war_support|=+1%] £war_support_texticon; выпуск военных заводов: [?NAM_captured_factory_output|=+1%].\nОсвобождение промыслов уменьшает штраф. Выжженные скважины не учитываются до окончания пожаров."
 NAM_captured_wells_report_none:0 ""
 NAM_guarded_wells_modifier:0 "Инженерная охрана промыслов"
 NAM_guarded_wells_modifier_desc:0 "Инженерные дружины обслуживают дороги, готовят подступы к обороне и поддерживают связь с гарнизонами.\n\nДействует только в ресурсной войне, пока промысел принадлежит Светлогорью и удерживается им."
 NAM_guarded_wells_tt:0 "Пока идёт ресурсная война, на принадлежащих нам и контролируемых нами промыслах: местное снабжение §G+0.5§!, скорость вражеских армий §G-10%§!, ремонт инфраструктуры §G+25%§! £infrastructure_texticon.\nПри освобождении промысла охрана возобновляется."
 NAM_prewar_mandate_rules_tt:0 "В начале ресурсной войны довоенный баланс печатей определит курс Рома и отдельную послевоенную ветку:\nниже §Y-25%§! - §Yэтатизм§! наместников;\nвыше §Y+25%§! - §Yгуманизм§! округов;\nот §Y-25%§! до §Y+25%§! включительно - §Yпрагматизм§! и договорное правительство.\nЕсли власть уже захватил другой правитель, он сохраняет её."
 NAM_prewar_service_mandate_tt:0 "К началу ресурсной войны перевес наместников был более §Y25%§!: закреплён этатистский курс"
