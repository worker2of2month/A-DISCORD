 NAM_wartime_programmes_tt: "Идёт ресурсная война или война за Юг, в которой Светлогорье ведёт северный лагерь"
 NAM_startup_region:0 "§YЮЖНЫЙ РЕСУРСНЫЙ ПОЯС: ОКРУЖЕНИЕ СВЕТЛОГОРЬЯ§!\n\nОбстановка к началу 2160 года.\n\n§YВоркерланд: власть над автономией§!\nСветлогорье входит в систему зависимых территорий конфедерации. Наместники управляют нефтяным бассейном через отчёты, округа и гарнизоны, но распоряжения центра всё чаще расходятся с его возможностями. Слабость Воркерланда делает вопрос о принадлежности местных ресурсов всё острее.\n\n§YЭфлор: требование вернуть землю§!\nНационалистическое руководство республики ставит территориальное единство выше местной самостоятельности. Нефтяные земли, когда-то отнятые Воркерландом, остаются предметом претензий. Для Эфлора наместническая администрация воплощает порядок, который закрепил эту потерю.\n\n§YАжар: Директория Чёрного бассейна§!\nСамир Ажар объединил округа единым учётом людей, припасов и топлива. Директория содержит резервы и подчиняет снабжение государственному плану. Её территориальные притязания подкреплены готовностью к мобилизации, а борьба за нефтяной бассейн имеет и хозяйственное, и политическое значение.\n\n§YШахрабад и торговые пути Юга§!\nШахрабад сосредоточивает население, металлургию и промышленный капитал региона. Его печам нужны вода, сырьё и устойчивый вывоз продукции; Кейзан, Мазар и порты Вейра влияют на эти потоки. Нефтяное богатство Светлогорья существует внутри этой общей системы обмена, где местный спор способен затронуть весь Юг."
 NAM_startup_country: "§YСВЕТЛОГОРЬЕ В 2160 ГОДУ§!\n\n§YНефтяной бассейн и имперская власть§!\nСветлогорье сложилось внутри зависимой административной системы Воркерланда. Земли промыслов и прилегающую инфраструктуру включали в Светлогорье решениями воркерландской администрации. Население этих территорий несколько поколений жило под чужой властью; государственная граница закрепляла распоряжение центра, не устраняя памяти о прежней принадлежности земли.\n\nНефть сделала южный бассейн важным источником ресурсов. Вместе с промыслами в повседневную жизнь вошли планы отгрузок, гарнизонное снабжение и экспортные расчёты. Богатство находилось под землёй, а право распорядиться им проходило через учреждения, связанные с далёкой столицей.\n\n§YЛестница наместников§!\nИмперская администрация построила управление как цепь уполномоченных представителей. Каждая управа отчитывалась перед следующей, и каждая ступень имела печать и право остановить решение. Эта лестница собирала ресурсы и поддерживала дисциплину, но давала центру представление о стране прежде всего через отчёты.\n\nСо временем канцелярский порядок стал самостоятельной силой. Согласование определяло, кто получит деньги и доступ к запасам; ошибка грозила превратиться в государственную тайну. Сам аппарат умел учитывать чужие расходы лучше собственных. Двойные ведомости позволяли одному управлению выглядеть как несколько действующих учреждений.\n\n§YКогда распоряжения разошлись§!\nОслабление воркерландского центра не отменило прежнюю систему подчинения. В Светлогорье продолжали приходить предписания: отправить нефть, не трогать вагоны, исполнить новый приказ вместо предыдущего. На полках Егора Рома сохранились бумаги, которые уже невозможно было выполнить одновременно. Формальные полномочия всё хуже отражали наличие людей, складов и свободного транспорта.\n\nНаместники требовали дисциплины, округа оспаривали поборы, нефтяники ждали заработанного. Гарнизоны зависели от настоящего горючего, экспортные конторы - от состоявшихся отгрузок. Разные части одного хозяйства предъявляли власти несовместимые требования. Задержки жалованья и сборы питали недовольство Светлогорска, крупнейшего города страны.\n\nНа карте управа могла опираться на целый полк, а на дороге её представлял один пост. Топливо задерживалось между ведомственными отчётами; ремонтные мастерские умели больше, чем признавали их сметы. Порядок сохранял видимость полного учёта, хотя реальная работа всё чаще зависела от местных людей и обходных договорённостей.\n\n§YК началу 2160 года§!\nВсе линии наместнической власти сходятся к Егору Рому, а Кирилл Мезенцев сводит её обязательства в платёжных ведомостях. Светлогорье остаётся зависимой территорией Воркерланда с крупнейшими нефтяными полями Юга. Унаследованный аппарат продолжает действовать, хотя доверие к его печатям ослабло. Накопленное нефтяное богатство соседствует с невыплаченным жалованьем и спором о том, кому оно принадлежит."
 NAM_startup_guide_groups_title: "Учреждения и опоры"
 NAM_startup_guide_groups: "§YКАК УСТРОЕНА ЛЕСТНИЦА§!\n\n§YГде смотреть состояние§!\nРаздел решений «$NAM_supports$» показывает отношения с пятью группами. После «Описи исчезающей империи» оплачиваемые программы ищите в разделе «$NAM_national_programmes$». Фокусы перестраивают общие учреждения: результат отражается в их совокупном модификаторе.\n\n§YПоддержка и вес§!\nПоддержка показывает отношение группы к власти, вес - её влияние. Это разные величины. Поддержка от 70 даёт бонус группы, до 25 включительно - штраф. Отклонение общей лояльности от 50 меняет политическую власть и стабильность. Ежемесячно поддержка сдвигается на 0,5 к 50: высокий результат нужно поддерживать.\n\n§YРопот и требования§!\nПри поддержке 20 и ниже возможен ропот, при 85 и выше - требования. «Совет опор» открывает уступки и подкуп. Уступка одной группе злит её соперника: сначала сравните обе шкалы, затем платите. Не считайте максимально высокую поддержку полной защитой от политических событий.\n\n§YВыбор устройства§!\nПосле «Сколько стоит каждая печать» выбираются вертикаль или округа. «Одна подпись Рома» открывает инспекторов и чрезвычайные предписания, «Подписи округов» - публичную ведомость и гарантии Светлогорску. Подробности курсов находятся в «Путях»; для подготовки важно, какие решения доступны именно вашей ветке.\n\n§YДеньги на происшествия§!\nСлучайные происшествия могут потребовать срочных расходов. «Служба происшествий» снижает их вероятность и открывает фонд; пожарные дружины и чистка канцелярии удешевляют исходы. Не тратьте весь запас на очередную реформу, если случайный расход оставит без денег текущие приготовления."
 NAM_startup_guide_oil_title: "Нефть, казна и армия"
 NAM_startup_guide_oil: "§YНЕФТЬ, КАЗНА И ГОТОВАЯ АРМИЯ§!\n\n§YНачните с трёх показателей§!\nПроверьте запас топлива, казну и недельный баланс. Нефть в земле, топливо на складе и доступные деньги выполняют разные задачи. Продажа даёт разовую выручку, а содержание армии и учреждений продолжается после сделки.\n\n§YОткройте программы промыслов§!\n«У скважины есть адрес» возвращает топливо в оборот и открывает ревизию. Дальше выберите продажу через «Нефть оплачивает государство» или внутреннюю переработку через «Нефть остаётся дома». Прочитайте условия открытых решений: фокус даёт доступ к программе, а заказ оплачивается отдельно.\n\n§YСоотнесите заказ со сроком§!\n«Бюджет без двойного дна» открывает облигации и чрезвычайные указы, «Сменные детали для промыслов» - закупку станков. В карточке проверяйте все цены и длительность. Казна и политическая власть расходуются одновременно, если указаны обе суммы. Планируемый доход от будущей продажи ещё нельзя потратить сегодня.\n\n§YМорской вывоз§!\n«Порт не закрывается на обед», ремонтный двор и школа конвоев помогают работе гавани. Следите за условиями морских программ и наличием средств на их исполнение, особенно если экспорт должен оплачивать новые расходы.\n\n§YГарнизоны§!\nПереучёт гарнизонов, выбранная полевая стража или подвижные колонны, интендантство и портовый арсенал готовят армию. После получения частей проверьте комплектность и снабжение. Оставляйте оружие для пополнения и топливо для действующих войск: выгодная продажа не должна сорвать подготовку к ресурсной войне."
 NAM_startup_guide_war_title: "Ресурсная война"
 NAM_startup_guide_war: "§YПОДГОТОВКА К РЕСУРСНОЙ ВОЙНЕ§!\n\n§YУгроза приходит извне§!\nПосле распада Воркерланда развивается региональный кризис: Эфлор и Ажар нападают на нефтяной бассейн, а Светлогорск может восстать. Давление реституции растёт каждый месяц: при 40 приходят ноты, при 70 - ультиматум, при 100 и не раньше чем через 300 дней после распада начинается война. До неё оплачивайте приказы о мобилизации и готовьте рубежи: армия военного времени состоит из небольшого ядра и оплаченных формирований.\n\n§YЕсли выбраны округа§!\nДля договора нужны «Гарантии Светлогорску» и отдельное оплаченное решение о гражданских службах. К началу войны договор должен действовать 60 непрерывных дней, пока город принадлежит вам и находится под вашим контролем. Тогда восстания не будет. Завершить фокус за день до войны недостаточно: учитывайте время открытия и оплаты решения, затем полный срок работы договора.\n\n§YЕсли выбрана вертикаль§!\nГарантии округов на этом пути недоступны. Готовьтесь к внутреннему фронту и проверяйте решения чрезвычайной выдачи и поиска складов, открываемые фокусом «$NAM_emergency_writ$». Договор другой ветки не заменяет военную подготовку вашей.\n\n§YУсловие победы§!\nНужно добиться капитуляции противников либо удержать к 420-му дню войны нефть на 100 очков: Северные месторождения дают 80, Южнобережье 36, Сухоречье 24, Восточное Сухоречье 12, Светлогорский округ 12. Для договора о признании и новой границы к тому же дню нужно занять хотя бы один пограничный округ Эфлора или Ажара; 100 очков без него дают ничью на прежней границе. От 36 до 99 очков страна сохраняется ценой компромиссного мира, меньше 36 - делится. Непрерывно удерживать промыслы не требуется: считается контроль в день проверки.\n\n§YВо время войны§!\nОткрывается военная ветка с программами удержания промыслов, снабжения и контрудара. Проверяйте новую доступность решений после её фокусов. Обычные дипломатические объявления войны и союзы отключены. Послевоенные варианты и последствия поражения описаны в «Путях»."
 NAM_startup_guide_plan_title: "Первые шаги"
 NAM_startup_guide: "§YПЕРВЫЕ ШАГИ ЗА СВЕТЛОГОРЬЕ§!\n\n§Y1. Проведите опись.§! Начните с «Описи исчезающей империи», затем откройте правительственные решения. Сверьте казну, недельный баланс, топливо и фактическое состояние гарнизонов.\n\n§Y2. Изучите опоры.§! В «$NAM_supports$» посмотрите поддержку и вес всех пяти групп. Уступка одной стороне может приблизить кризис у другой. Порог ропота - 20 и ниже, требования возникают при 85 и выше.\n\n§Y3. Выберите доступный способ подготовки города.§! На пути округов откройте гарантии и оплатите гражданские службы Светлогорска с запасом на 60 дней непрерывной работы. На пути вертикали готовьте силы к внутреннему фронту и используйте собственные чрезвычайные решения.\n\n§Y4. Свяжите нефть с расходами.§! Экспорт приносит деньги, внутренняя переработка развивает хозяйство. Перед продажей сверяйте топливный запас с потребностями армии. Доход будущего договора не заменяет денег на текущий заказ.\n\n§Y5. Завершайте нужные программы.§! Цена, длительность и условия решения остаются после завершения открывающего фокуса. Выбирайте работы, результат которых успеет поступить до угрозы; оставляйте резерв на происшествия и пополнение.\n\n§Y6. Следите за военным таймером.§! Война заканчивается победой над коалицией или нефтяным счётом при проверке на 420-й день: Северные месторождения важнее всего, но одних их для полной победы мало. Готовьте оборону этого района и читайте новые военные решения. Подробности политических исходов находятся в «Путях»."
 NAM_startup_path_0_title: "Лестница печатей"
 NAM_startup_path_0: "§YГОСУДАРСТВО СЛУЖБЫ§!\n\nЧерез единую подпись Рома и чрезвычайные предписания Светлогорье становится государством службы. Реестр печатей, гарнизоны наместников и нефтяные квоты собирают власть в канцелярии, а «Лестница печатей» превращает её в порядок для всей страны.\n\nЭтот путь даёт сильную политическую власть и послушание занятых земель, но округа теряют голос. Его война за Юг - «Печать над печами»: Шахрабад должен стать ещё одной ступенью лестницы."
 NAM_startup_path_0_details: "§YЛЕСТНИЦА: УСЛОВИЯ И НАГРАДЫ§!\n\n§YВход§!\n«Государство служебной ответственности» требует «Подписи под независимостью» и «Предписания на чрезвычайный случай» из ветки вертикали. Путь закрывает хартию округов.\n\n§YВетка§!\n«Реестр печатей» открывает ревизию округов, «Гарнизоны наместников» дают постоянные гарнизоны, «Нефтяные квоты» - топливо. «Лестница печатей» требует обоих.\n\n§YКонцовки§!\n«Светлогорье печатей» усиливает наместников и армию, «Республика службы» уступает округам и нефтяникам. Концовки взаимоисключающие и перераспределяют вес групп.\n\n§YЮг§!\n«Чёрный бассейн» подчиняет Ажар, «Наместничества пустыни» - Кадир и Эфлор. «Печать над печами» требует «Светлогорье отвечает за себя», созревшего кризиса Юга и мира и объявляет войну Шахрабаду. Победа превращает Юг в наместничества."
 NAM_startup_path_1_title: "Хартия округов"
 NAM_startup_path_1: "§YОКРУГА И ХАРТИЯ§!\n\nПуть подписей округов и гарантий Светлогорску превращает лестницу в федерацию районов. Совет районов, нефтяной фонд и ополчение строят общий рынок топлива, где голос имеют не только наместники.\n\nЭтот путь даёт стабильность, исследования и союзников, но наместники теряют власть. Его война за Юг - «Хартия против картеля»: топливо в обмен на воду для соседей и общий фронт против Шахрабада."
 NAM_startup_path_1_details: "§YХАРТИЯ: УСЛОВИЯ И НАГРАДЫ§!\n\n§YВход§!\n«Хартия округов» требует «Подписи под независимостью» и «Гарантий Светлогорску» из ветки округов. Путь закрывает государство службы.\n\n§YВетка§!\n«Совет районов», «Нефтяной фонд» с топливом для союзников и «Ополчение районов» ведут к «Общему рынку топлива».\n\n§YКонцовки§!\n«Федеративное Светлогорье» даёт округам решающий голос, «Союз нефтяных районов» - нефтяникам и конторам. Концовки взаимоисключающие и перераспределяют вес групп.\n\n§YЮг§!\n«Нефть за воду» предлагает союз Фенну, Рахме, Сардану и Ажару, «Гарантия Фенна» подчиняет Эфлор. «Хартия против картеля» требует «Светлогорье отвечает за себя», созревшего кризиса Юга и мира и объявляет войну Шахрабаду."
 # Oil monopoly and the islands
 NAM_fuel_shortage: "Сорванные поставки Светлогорья"
 NAM_fuel_shortage_desc: "Контракт на светлогорское топливо оборвался вместе с началом войны. Цистерны не пришли, а замену им ещё предстоит найти."
 NAM_fuel_embargo_modifier: "Топливное эмбарго Светлогорья"
 NAM_fuel_embargo_modifier_desc: "Светлогорье закрыло для этой страны свои промыслы и терминалы. Эмбарго действует, пока его не снимет правительство Светлогорья."
 NAM_island_convoy_route: "Островная конвойная линия"
 NAM_island_convoy_route_desc: "Регулярные конвои вывозят руду заморских округов и привозят им припасы. Остров перестаёт чувствовать себя забытым."
 NAM_south_convoy_blockade: "Светлогорские охотники за конвоями"
 NAM_south_convoy_blockade_desc: "Корабли Светлогорья перехватывают танкеры и баржи, идущие к печам. Заводы получают меньше топлива и работают с перебоями."
 NAM_oil_unit_free_tt: "У Светлогорья есть свободная единица нефтяной пропускной способности для этого покупателя (на суше: §Y[?NAM_oil_free_land_units|0]§!, для заморских покупателей: §Y[?NAM_oil_free_units|0]§!)"
 NAM_oil_contract_offer: "Предложить топливный контракт"
 NAM_oil_contract_offer_desc: "Предложить этой стране постоянные поставки светлогорского топлива. Каждый месяц покупатель получает §Y1500§! £fuel_texticon с наших складов, а казна - §G40§! £ADISCORD_economy_treasury_texticon. Контракт занимает одну единицу пропускной способности; Южная гавань с морским терминалом обслуживает только Кефрейт, Стеландер, Стеланд и Землю Хана. Если в месяц на складе меньше §Y1500§! £fuel_texticon, поставка и оплата пропускаются. Война с покупателем обрывает контракт."
 NAM_oil_contract_offer_tt: "Покупатель получает предложение и ответит в ближайшие дни. Свободная единица проверяется ещё раз в момент ответа.\nПри согласии:\n  Нефтяники: §G+5§!\n  Экспортные конторы: §G+5§!"
 NAM_oil_contract_end: "Расторгнуть топливный контракт"
 NAM_oil_contract_end_desc: "Прекратить поставки этому покупателю и освободить единицу пропускной способности."
 NAM_oil_contract_end_tt: "Контракт расторгается, единица пропускной способности освобождается.\nОтношение покупателя к нам ухудшается.\nЭкспортные конторы: §R-3§!."
 NAM_fuel_embargo: "Топливное эмбарго"
 NAM_fuel_embargo_desc: "Закрыть промыслы и терминалы для этой страны, пока правительство не решит иначе. Эмбарго против Эфлора или Ажара каждый месяц добавляет §Y1§! к давлению реституции."
 NAM_fuel_embargo_valid_tt: "Страна не покупает наше топливо по контракту, не находится под эмбарго и не получает от нас дань или топливо по договору"
 NAM_fuel_embargo_tt: "Страна получает §Yтопливное эмбарго Светлогорья§! до его отмены.\nЕё отношение к нам: §R-25§!.\nЭкспортные конторы: §R-10§!."
 NAM_fuel_embargo_lift: "Снять топливное эмбарго"
 NAM_fuel_embargo_lift_desc: "Вновь открыть промыслы и терминалы для этой страны."
 NAM_fuel_embargo_lift_tt: "Эмбарго снимается вместе с ухудшением отношений, которое оно вызвало.\nЭкспортные конторы: §G+5§!."
 NAM_project_slot_free_tt: "Есть свободное место для проекта: занято §Y[?NAM_projects_in_progress|0]§! из §Y[?NAM_project_slots|0]§! (не больше §Y2§!)"
 NAM_project_state_ready_tt: "Промысел принадлежит нам, контролируется нами, и на нём не идёт другой проект"
 NAM_project_not_scorched_tt: "Скважины промысла не выжжены в последние §Y180 дней§!"
 NAM_project_condition_low_tt: "Состояние промысла ниже §Y100§!"
 NAM_project_harbour_held_tt: "§YЮжная гавань§! принадлежит нам и контролируется нами"
 NAM_project_started_150_tt: "Казна: §R-150§! £ADISCORD_economy_treasury_texticon; задаток вернётся, если работы будут прерваны.\nЗанимается одно место для проекта."
 NAM_project_started_300_tt: "Казна: §R-300§! £ADISCORD_economy_treasury_texticon; задаток вернётся, если работы будут прерваны.\nЗанимается одно место для проекта."
 NAM_project_started_350_tt: "Казна: §R-350§! £ADISCORD_economy_treasury_texticon; задаток вернётся, если работы будут прерваны.\nЗанимается одно место для проекта."
 NAM_project_started_250_tt: "Казна: §R-250§! £ADISCORD_economy_treasury_texticon; задаток вернётся, если работы будут прерваны.\nЗанимается одно место для проекта."
 NAM_project_refund_tt: "Работы прерваны: задаток возвращается в казну, место для проекта освобождается."
 NAM_project_repair_wells: "Восстановить скважины"
 NAM_project_repair_wells_desc: "Ремонтные бригады за §Y45 дней§! меняют насосы, очищают стволы и восстанавливают подъездные пути. Состояние промысла сейчас: §Y[?FROM.NAM_field_condition|0]§! / 100. Каждая единица пропускной способности промысла зависит от его состояния."
 NAM_project_repair_done_tt: "Если промысел по-прежнему наш, его состояние растёт на §G30§! (не выше §Y100§!), пропускная способность пересчитывается. Иначе задаток возвращается в казну."
 NAM_project_refinery: "Построить промысловый завод"
 NAM_project_refinery_desc: "За §Y90 дней§! рядом с промыслом вырастет перерабатывающий завод. Он даёт округу топливо и добавляет промыслу §G1§! единицу пропускной способности, пока округ остаётся под нашим контролем."
 NAM_project_refinery_done_tt: "Если промысел по-прежнему наш, в округе появляются место для постройки и §Yзавод синтетического топлива§!, а пропускная способность промысла растёт на §G1§!. Иначе задаток возвращается в казну."
 NAM_project_pipeline: "Проложить Ключевский нефтепровод"
 NAM_project_pipeline_desc: "Трубопровод из Сухоречья в Южную гавань строится §Y120 дней§! и требует обоих округов. Пока оба остаются под нашим контролем, нефтепровод добавляет §G1§! единицу пропускной способности."
 NAM_project_pipeline_done_tt: "Если Сухоречье и Южная гавань по-прежнему наши, пропускная способность растёт на §G1§!. Иначе задаток возвращается в казну."
 NAM_project_sea_terminal: "Построить морской терминал"
 NAM_project_sea_terminal_desc: "Наливной терминал Южной гавани строится §Y90 дней§!. Он добавляет §G1§! единицу пропускной способности, которой пользуются только заморские покупатели: Кефрейт, Стеландер, Стеланд и Земля Хана."
 NAM_project_terminal_done_tt: "Если Южная гавань по-прежнему наша, появляется §G1§! единица пропускной способности для заморских покупателей. Иначе задаток возвращается в казну."
