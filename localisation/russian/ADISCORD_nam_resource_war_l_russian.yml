 NAM_econ_insured_freighters:0 "Заказать застрахованные грузовые суда"
 NAM_econ_insured_freighters_delivered_tt:0 "§G+25§! £convoy_texticon."
 NAM_econ_insured_freighters_result_tt:0 "Через §Y21§! £time_texticon дн.: §G+25§! £convoy_texticon."
 NAM_econ_insured_freighters_refund_tt:0 "§G+200§! £ADISCORD_economy_treasury_texticon."
 NAM_econ_insured_freighters_desc:0 "Цена: §Y35§! £political_power_texticon §Y200§! £ADISCORD_economy_treasury_texticon. Срок: §Y21§! £time_texticon дн. Повтор через §Y90§! £time_texticon дн. после завершения.\n\nЮжная гавань получит суда для замены потерь и расширения морских перевозок.\n§G+25§! £convoy_texticon.\n\nПри капитуляции, подчинении или потере условий заказа вся оплата возвращается. Война сама по себе не прерывает работу. Результат получает Светлогорье."
 NAM_econ_petrochemical_batch_cost:0 "§Y40§! £political_power_texticon §Y200§! £ADISCORD_economy_treasury_texticon §Y4000§! £fuel_texticon"
