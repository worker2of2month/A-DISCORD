 ADISCORD_nam_story.2.t:0 "Вычеркнутые строки"
 ADISCORD_nam_story.2.d:0 "Квартирмейстеры принесли в совет опор те самые списки, по которым грузили транспорты в Южной гавани. Каждая вычеркнутая строка - человек, оставшийся на причале. Их больше трёх тысяч: роты северных промыслов, обозники, раненые, сапёры, которые взрывали насосные и не успели к последнему трапу.\n\nКарамышев приказал составить по этим спискам перечень врагов. Кто из оставшихся пошёл служить Эфлору, кто присягнул новым управам, кто выдал соседей - всё это станет делами для суда после возвращения. Контрабандисты с флотилий говорят о другом: за плату они уже вывозят людей с материка по одному, ночами, через рыбацкие посёлки. Нужны деньги, проводники и решение совета, что эти люди не предатели.\n\nУ дверей таможни с утра стоят женщины с фотографиями. Они не спрашивают про суд. Они спрашивают, есть ли в списках их фамилия и что значит черта напротив неё."
 ADISCORD_nam_story.2.a:0 "Составить списки предателей."
 ADISCORD_nam_story.2.b:0 "Вывозить оставленных."
 NAM_story_2_a_tt:0 "Готовность к возвращению: §G+5§!.\nПоддержка групп:\n  Округа: §R-5§! £NAM_support_dist_texticon"
 NAM_story_2_b_tt:0 "Поддержка групп:\n  Округа: §G+6§! £NAM_support_dist_texticon\n  Гарнизоны: §G+4§! £NAM_support_garr_texticon"
 ADISCORD_nam_story.3.t:0 "Мы сами их сожгли"
 ADISCORD_nam_story.3.d:0 "Колонна морской пехоты вошла в Ключевск к полудню. Над промыслом не было ни дыма, ни флагов коалиции - только почерневшие эстакады и насосные станции без крыш. Карамышев долго стоял у первой из них. Эту станцию взорвали его сапёры в ночь бегства, чтобы враг получил выжженную землю. Враг её получил. Теперь её получили обратно.\n\nСтарый мастер, остававшийся при промысле все эти годы, показал, что уцелело: два насоса, которые бригада спрятала в штольне, и журнал смен, где после ночи эвакуации нет ни одной записи. Он не спрашивал, зачем жгли. Он спрашивал, кто будет восстанавливать.\n\nКомендант предлагает пригнать пленных из лагерей: работа тяжёлая, а платить за неё некому. Старшины артелей возражают: если на промысле встанут люди под конвоем, местные запомнят, что возвращение пахнет так же, как оккупация. Они готовы набрать бригады за паёк и жалованье, если совет найдёт для этого средства."
 ADISCORD_nam_story.3.a:0 "Восстановить руками пленных."
 ADISCORD_nam_story.3.b:0 "Набрать местные бригады."
 NAM_story_3_a_tt:0 "Консолидация: §G+5§!.\nПоддержка групп:\n  Округа: §R-5§! £NAM_support_dist_texticon"
