 ADISCORD_nam_groups.1.t: "Ропот опоры"
 ADISCORD_nam_groups.1.d_nam: "Наместники больше не уверены, что канцелярия помнит, на ком держится Светлогорье. Отчёты задерживаются, печати ставятся с опозданием, а в округах говорят, что старая лестница может вспомнить, как останавливать решения.\n\nЕсли не ответить сейчас, ропот превратится в саботаж."
 ADISCORD_nam_groups.1.d_oil: "На промыслах неспокойно. Нефтяники собираются у контор и требуют объяснить, почему их работа кормит всех, кроме них самих. Мастера предупреждают, что следующая смена может не выйти.\n\nБез нефти Светлогорье лишится и денег, и топлива."
 ADISCORD_nam_groups.1.d_dist: "Округа считают, что канцелярия снова решает за них. Собрания отказываются утверждать сборы, а местные советы пишут жалобы одну за другой.\n\nОкруга не поднимут оружие, но могут перестать работать на государство."
 ADISCORD_nam_groups.1.d_garr: "Офицеры гарнизонов говорят, что армию вспоминают только перед войной. Жалованье задерживается, склады пустеют, а в казармах всё громче обсуждают, кому они на самом деле служат.\n\nНедовольный гарнизон опаснее любого соседа."
 ADISCORD_nam_groups.1.d_trade: "Экспортные конторы теряют договоры и терпение. Купцы закрывают счета, грузы стоят в порту, а посредники ищут покупателей за пределами Светлогорья.\n\nКазна почувствует это раньше всех."
 ADISCORD_nam_groups.1.a: "Пойти на уступки."
 ADISCORD_nam_groups.1.b: "Опереться на их соперников."
 ADISCORD_nam_groups.1.c: "Переждать недовольство."
 ADISCORD_nam_groups.2.t: "Требование опоры"
 ADISCORD_nam_groups.2.d_nam: "Наместники чувствуют свою силу. Их собрание требует закрепить за лестницей право последней подписи - и обещает взамен порядок, которого не знала даже империя.\n\nСогласие усилит их, но ослабит округа."
 ADISCORD_nam_groups.2.d_oil: "Нефтяники требуют закрепить их долю в выручке промыслов. Взамен они обещают невиданную добычу.\n\nСогласие обрадует промыслы, но конторы потеряют прибыль."
 ADISCORD_nam_groups.2.d_dist: "Округа требуют, чтобы их собрания утверждали каждое решение канцелярии в своих границах. Взамен они обещают спокойствие и порядок на местах.\n\nСогласие обрадует округа, но наместники воспримут это как поражение."
 ADISCORD_nam_groups.2.d_garr: "Гарнизоны требуют собственного места в правительстве. Взамен офицеры обещают армию, готовую к любой войне.\n\nСогласие усилит армию, но конторы будут платить за её содержание."
 ADISCORD_nam_groups.2.d_trade: "Экспортные конторы требуют монополию на вывоз нефти. Взамен они готовы немедленно внести в казну крупную сумму.\n\nСогласие наполнит казну, но промыслы почувствуют себя проданными."
 ADISCORD_nam_groups.2.a: "Принять требование."
 ADISCORD_nam_groups.2.b: "Отказать."
 ADISCORD_nam_groups.11.t: "Новое устройство Светлогорья"
 ADISCORD_nam_groups.11.d_iron: "Лестница печатей стала государством. Наместники управляют округами от имени канцелярии, гарнизоны стоят у каждой конторы, а решения идут сверху вниз без долгих споров.\n\nСветлогорье стало сильным и послушным. Осталось узнать, надолго ли."
 ADISCORD_nam_groups.11.d_service: "Лестница превратилась в гражданскую службу. Должности получают за работу, округа и промыслы участвуют в управлении, а наместники стали чиновниками.\n\nСветлогорье стало государством служащих, а не печатей."
 ADISCORD_nam_groups.11.d_federation: "Хартия стала федерацией районов. Каждый округ решает свои дела, а общие вопросы обсуждает совет. От прежней лестницы остались лишь архивы.\n\nСветлогорье стало союзом общин, связанных общим договором."
 ADISCORD_nam_groups.11.d_oil_union: "Хартия легла в основу Светлогорского Союза. Промыслы управляются работниками и государством, а нефть стала основой общего порядка.\n\nСветлогорье стало государством нефтяников."
 ADISCORD_nam_groups.11.a: "Таково новое Светлогорье."
 NAM_grp_crisis_concede_tt: "Политическая власть: §R-50§!. Поддержка группы: §G+15§!."
 NAM_grp_crisis_rivals_tt: "Поддержка соперников группы: §G+8§!, самой группы: §R-5§!. Стабильность: §R-2%§!."
 NAM_grp_crisis_wait_tt: "Стабильность: §R-4%§!. Поддержка группы восстановится только со временем."
 NAM_grp_demand_accept_tt: "Группа получает своё: наместники - §G+75§! £political_power_texticon, нефтяники - §G+5000§! £fuel_texticon, округа - §G+3%§! £stability_texticon, гарнизоны - §G+25§! £army_experience, конторы - §G+250§! £ADISCORD_economy_treasury_texticon. Её соперники: §R-10§!."
 NAM_grp_demand_refuse_tt: "Поддержка группы: §R-15§!."
 NAM_crisis_office: "Служба происшествий"
 NAM_crisis_office_desc: "Пожары, стачки и скандалы больше не застают канцелярию врасплох. Служба держит чрезвычайный фонд и устав действий на каждую беду."
 NAM_field_firefighters: "Пожарные дружины промыслов"
 NAM_field_firefighters_desc: "Каждый промысел получает пожарную дружину и запас пены, а мировые посредники договариваются со стачечниками дешевле любой уступки канцелярии."
 NAM_chancellery_purge: "Чистка канцелярии"
 NAM_chancellery_purge_desc: "Ревизия вычищает из канцелярии самых жадных, а таможенная стража делит конфискат с казной. Наместники недовольны, округа - рады."
 NAM_field_firefighters_tt: "Пожар на промысле тушится без затрат казны. Уступка бастующим нефтяникам стоит §Y100§! £ADISCORD_economy_treasury_texticon вместо §Y250§!."
 NAM_chancellery_purge_tt: "Ревизия промыслов дополнительно возвращает §G150§! £ADISCORD_economy_treasury_texticon ценой §R-6§! £NAM_support_trade_texticon; требуется поддержка контор не ниже §Y30§!.\nЗамять скандал стоит §Y30§! £political_power_texticon вместо §Y60§!. Доля от выявленной контрабанды: §G250§! £ADISCORD_economy_treasury_texticon вместо §G100§!."
 NAM_crisis_office_tt:0 "До следующих происшествий: §G+60§! £time_texticon. Срок ответа: §G+7§! £time_texticon. Продлевает и текущий таймер."
 NAM_grp_chancellery_purge_tt: "Поддержка групп:\n  Наместники: §R-5§! £NAM_support_nam_texticon\n  Округа: §G+5§! £NAM_support_dist_texticon"
 NAM_treasury: "Казна Светлогорья"
 NAM_treasury_desc: "§YГОСУДАРСТВЕННАЯ КАЗНА§!\nДоступно: §Y[?ADISCORD_economy_treasury|0]§! £ADISCORD_economy_treasury_texticon\n\n§YРАСПОРЯЖЕНИЕ СРЕДСТВАМИ§!\nКазну и политическую власть можно обменивать друг на друга; курс указан в решениях.\n\n§YЧРЕЗВЫЧАЙНЫЙ ФОНД§!\nПроисшествия случаются в среднем раз в год. Фонд закрывает любое из них без потерь."
 NAM_bond_payments: "Выплаты по облигациям"
 NAM_bond_payments_desc: "Канцелярия расплачивается с держателями нефтяных облигаций."
 NAM_oil_bonds: "Нефтяные облигации"
 NAM_oil_bonds_desc: "Казначейство готовит выпуск бумаг под будущую нефтяную выручку. Покупатели потребуют заверенные обязательства и понятный порядок расчётов."
 NAM_emergency_decrees: "Чрезвычайные указы"
 NAM_emergency_decrees_desc: "Канцелярия оформляет чрезвычайные сборы отдельным указом. Местные управы получат подписанные ведомости и распоряжения для сборщиков."
 NAM_buy_machine_tools: "Закупить станки"
 NAM_buy_machine_tools_desc: "Торговые поверенные предлагают партию станков для Южной гавани. Инженеры осмотрят оборудование и подготовят помещения, прежде чем казначеи подпишут приёмные бумаги."
 NAM_fuel_audit: "Ревизия промыслов"
 NAM_fuel_audit_desc: "Инспекторы сверяют цистерны с накладными. За исправленными цифрами скрываются запасы, о которых хозяева складов предпочли забыть."
 NAM_crisis_fund: "Пополнить чрезвычайный фонд"
 NAM_crisis_fund_desc: "Часть казны хранится отдельно от обычной сметы. Когда потребуется срочно тушить пожар или гасить скандал, чиновники не станут искать свободную строку в бюджете."
 NAM_crisis_prevention: "Профилактика происшествий"
 NAM_crisis_prevention_desc: "Проверки, учения и премии осторожным обходятся канцелярии дешевле поспешных разбирательств. Служба проверит людей и оборудование, прежде чем очередная беда попадёт в газеты."
 NAM_crisis_fund_tt: "Одно текущее или будущее происшествие можно закрыть §Gбез потерь§!, израсходовав фонд. Он сохраняется до использования."
 NAM_crisis_prevention_tt:0 "Следующее происшествие откладывается на §G60§! £time_texticon."
 NAM_crisis_fund_used_tt: "Расходуется чрезвычайный фонд."
 NAM_crisis_free_tt: "Обходится без затрат."
