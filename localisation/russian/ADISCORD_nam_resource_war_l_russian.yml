 NAM_bw_repair_body:0 "§YВосстановить скважины§!: §Y45§! дней.\nСостояние промысла §G+30§!, с пожарными дружинами §G+45§!, не выше §Y100§!. Пропускная способность пересчитывается. При потере, выжигании или полном восстановлении промысла задаток возвращается.\nЦена: "
 NAM_bw_refinery_body:0 "§YПостроить промысловый завод§!: §Y90§! дней.\nПосле: §G+1§! ед. пропускной способности промысла, место для постройки и завод синтетического топлива в округе. Если работы прервутся, задаток вернётся в казну.\nЦена: "
 NAM_bw_line_body:0 "§YПодготовить рубеж§!: §Y35§! дней.\nПосле: укрепления уровня §Y1§! во всех провинциях округа на границе с другой страной и уровня §Y2§! в пограничных городах с победными очками. Если работы прервутся, задаток вернётся в казну.\nЦена: "
