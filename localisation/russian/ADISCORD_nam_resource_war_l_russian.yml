l_russian:
 service_etatism: "Служебный этатизм"
 service_etatism_desc: "§YСлужебный этатизм§!\n\nВласть оправдывается способностью поддерживать снабжение, защищать границы и обеспечивать работу учреждений. После падения Воркерланда Егор Ром сохраняет управленческий аппарат, но перенаправляет его службу Светлогорью. Полномочия требуют личной ответственности, а независимость начинается с исполнения собственных решений.\n\nБывшие наместники больше не могут оправдывать поборы приказами далёкой столицы. Государство требует от них исправных складов, оплаченного труда и точного исполнения распоряжений. Право управлять связывается со службой стране, а должность - с обязанностью отвечать за её результат.\n\nПределы этой власти ещё предстоит определить. Единая вертикаль обещает скорость и дисциплину; соглашение с округами даёт гражданам право проверять расходы и оспаривать решения. При любом устройстве Светлогорье должно стать государством, которое отвечает перед живущими в нём людьми."

