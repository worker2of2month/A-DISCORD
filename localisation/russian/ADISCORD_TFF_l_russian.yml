l_russian:
 # Cosmetic
 TFF_frontier_defense_confederation: "Конфедерация обороны Фронтира"
 TFF_frontier_defense_confederation_DEF: "Конфедерацию обороны Фронтира"
 TFF_frontier_defense_confederation_ADJ: "фронтирск."

 # Event
 ADISCORD_TFF.1.t: "Пустое кресло"
 ADISCORD_TFF.1.d: "До войны пустое кресло в зале ассамблеи считали доказательством свободы. Никто не имел права отдавать приказы всем поселениям Фронтира.\n\nТеперь против них стоит регулярная армия Нодрула. Полевые командиры требуют общего снабжения и одной схемы обороны. Делегаты коммун привозят те же жалобы: отдельные отряды держатся несколько дней, затем остаются без патронов и без соседа на фланге.\n\nСобрание не выбирает президента. Оно передаёт Кольту Арденту ограниченный мандат чрезвычайного военного координатора. Он сводит заявки, распределяет резервы и не даёт свободным стрелкам гибнуть поодиночке из-за отказа от общего командования. Когда война закончится, мандат можно отозвать. Пока он действует, страна называется Конфедерацией обороны Фронтира."
 ADISCORD_TFF.1.a: "Зафиксировать мандат."
 ADISCORD_TFF_empty_chair_result_tt: "Кольт Ардент получает ограниченный военный мандат. Страна принимает имя Конфедерации обороны Фронтира. Пока идёт война с Нодрулом, открываются решения военного времени."

 # Ideas
 TFF_emergency_frontier_command: "Чрезвычайное командование Фронтира"
 TFF_emergency_frontier_command_desc: "Коммуны согласились на общее военное командование только на время войны. Снабжение и оборона сводятся в один штаб, но политическая система остаётся анархической."
 TFF_free_rifle_levy: "Сбор вольных стрелков"
 TFF_free_rifle_levy_desc: "Отдельные дружины временно принимают общий набор и ускоренную подготовку."
 TFF_commune_coordination: "Согласование коммун"
 TFF_commune_coordination_desc: "Поселения передают заявки на людей и снабжение через один стол, не отказываясь от местного самоуправления."
 TFF_common_supply_network: "Общие склады снабжения"
 TFF_common_supply_network_desc: "Полевые склады принимают грузы от нескольких коммун и выдают их по единым накладным."
 TFF_unified_field_command: "Единое полевое командование"
 TFF_unified_field_command_desc: "Командиры отрядов согласуют планы и пополнение через военного координатора."

 # Decisions
 TFF_frontier_at_war: "Фронтир на войне"
 TFF_frontier_at_war_desc: "Чрезвычайное командование сводит набор, снабжение и оборону границы с Нодрулом, пока действует военный мандат."
 TFF_call_the_free_rifles: "Призвать вольных стрелков"
 TFF_call_the_free_rifles_desc: "Дружины дадут людей в общий резерв. Это ускорит подготовку, но ассамблея воспримет принудительный сбор как нарушение старого обычая."
 TFF_coordinate_the_communes: "Согласовать коммуны"
 TFF_coordinate_the_communes_desc: "Делегаты поселений сведут заявки на людей, оружие и маршруты. Координация укрепит тыл и организацию армии."
 TFF_establish_common_supply_depots: "Общие склады снабжения"
 TFF_establish_common_supply_depots_desc: "Полевые склады на границе снизят расход снабжения. Если Одар ещё в наших руках, там укрепят дорогу к линии."
 TFF_fortify_the_nodrul_border: "Укрепить границу с Нодрулом"
 TFF_fortify_the_nodrul_border_desc: "В Одаре поставим укрепления только на трёх подходах к Эсносу. Это не линия вокруг всего Фронтира."
 TFF_authorize_unified_field_command: "Единое полевое командование"
 TFF_authorize_unified_field_command_desc: "Командиры отрядов примут общую схему планирования и пополнения на время мандата."

 ADISCORD_TFF.10.t: "Фронтир создал общее командование на время войны"
 ADISCORD_TFF.10.d: "Ассамблея Вольного Фронтира создала Конфедерацию обороны Фронтира на время войны с Нодрулом. Снабжение, резервы и оперативное планирование теперь проходят через общий военный штаб, которым руководит Кольт Ардент по ограниченному чрезвычайному мандату.\n\nКоммуны сохраняют местную политическую власть, а ассамблея не создаёт ни президентский пост, ни постоянное центральное правительство. Новый штаб существует для координации войны и может быть распущен после окончания мандата."
 ADISCORD_TFF.10.a: "Коммуны приняли общий штаб на время войны."

 ADISCORD_TFF.11.t:0 "Фронтир снова вступил в Северную войну"
 ADISCORD_TFF.11.d:0 "Фронтир снова вступил в войну с Нодрулом, на этот раз вместе с Кефрейтом в рамках соглашения по Юбории. Командование созывает резервистов и перебрасывает снабжение к северным дорогам.\n\nСоглашение предусматривает передачу юборских администраций под защиту Фронтира после победы, тогда как Кефрейт получит нодрульские территории, отведённые под его договорные администрации. Оба правительства связали будущий раздел территорий с исходом одной кампании."
 ADISCORD_TFF.11.a:0 "Совместная кампания началась."
 TFF_kefreyt_northern_campaign:0 "Новый северный поход"
 TFF_kefreyt_northern_campaign_desc:0 "Договор с Кефрейтом даёт Фронтиру возможность вернуться в Юборию. Общие планы снабжения и сбор резервистов укрепляют армию на время совместной войны. Бонус прекращается после завершения кампании, капитуляции или утраты независимости."
