 infantry_equipment: "Индивидуальное стрелковое оружие"
 infantry_equipment_short: "Личное оружие"
 infantry_equipment_desc: "Винтовки, карабины и личные автоматы бойцов. Именно этот тип снаряжения определяет оружие в руках модели пехотинца."
 ADISCORD_squad_weapons_equipment: "Групповое оружие отделения"
 ADISCORD_squad_weapons_equipment_short: "Групповое оружие"
 ADISCORD_squad_weapons_equipment_desc: "Автоматы, ручные пулемёты, гранатомёты и тяжёлые системы огневой поддержки отделения."
 ADISCORD_militia: "Ополчение"
 ADISCORD_militia_desc: "Быстро собранные части с винтовками, почти без автоматического и группового оружия."
 ADISCORD_assault_infantry: "Штурмовая пехота"
 ADISCORD_assault_infantry_desc: "Усиленные отделения с высокой насыщенностью автоматическим оружием и средствами поддержки."
 ADISCORD_mechanized_infantry: "Механизированная пехота"
 ADISCORD_mechanized_infantry_desc: "Пехота на гусеничных бронемашинах, предназначенная для совместного манёвра с танковыми группами."
 ADISCORD_line_artillery: "Линейная артиллерия"
 ADISCORD_line_artillery_desc: "Полноценный артиллерийский батальон для огневого усиления дивизии; заметно дороже и тяжелее батареи поддержки."
 ADISCORD_metallurgical_complex: "Металлургический комплекс"
 ADISCORD_metallurgical_complex_plural: "Металлургические комплексы"
 ADISCORD_metallurgical_complex_desc: "Тяжёлый металлургический комбинат, превращающий бедное и вторичное сырьё в сталь. Крайне дорог, занимает слот региона и перегружает местную энергетику и строительный сектор. В одном регионе допускается только один тяжёлый ресурсный комплекс."
 ADISCORD_electrolysis_complex: "Электролизный комплекс"
 ADISCORD_electrolysis_complex_plural: "Электролизные комплексы"
 ADISCORD_electrolysis_complex_desc: "Энергоёмкая цепочка обогащения руды и электролиза для выпуска алюминия. Даёт стратегическую автономность ценой очень высокой стоимости, отдельного слота и заметной нагрузки на регион."
 ADISCORD_strategic_mining_complex: "Комплекс стратегической добычи"
 ADISCORD_strategic_mining_complex_plural: "Комплексы стратегической добычи"
 ADISCORD_strategic_mining_complex_desc: "Глубокие шахты, химическое выщелачивание и автоматические сортировочные линии для получения вольфрама. Самый дорогой ресурсный комплекс, ухудшающий местную стройку, энергобаланс и доступную рабочую силу."
 ADISCORD_thermal_power_complex: "Энергогенерирующий комплекс"
 ADISCORD_thermal_power_complex_plural: "Энергогенерирующие комплексы"
 ADISCORD_thermal_power_complex_desc: "Крупный комплекс генерации, накопления и распределения электричества для региональной энергосети. Снижает энергетический дефицит, но оборудование и обслуживающий персонал создают тяжёлую нагрузку на регион."
 support_equipment: "Полевое снаряжение поддержки"
