 ADISCORD_tech_recovered_shaped_charge_cells:0 "Бутылочные зажигательные смеси"
 ADISCORD_tech_recovered_shaped_charge_cells_desc:0 "Стеклянная ёмкость с загущённой горючей смесью разбивается о броню и воспламеняет наружное оборудование, воздухозаборники и моторный отсек. Технологический уровень 2150 года."
 ADISCORD_tech_disposable_launcher_standards:0 "Динамитные и ранцевые подрывные заряды"
 ADISCORD_tech_disposable_launcher_standards_desc:0 "Динамит или пластичный заряд в переносной сумке сосредотачивает взрыв у гусеницы, днища или неподвижного узла машины. Технологический уровень 2155 года."
 ADISCORD_tech_tandem_penetrator_packages:0 "Ручные кумулятивные противотанковые гранаты"
 ADISCORD_tech_tandem_penetrator_packages_desc:0 "Ручная граната с кумулятивной воронкой формирует направленную струю при подрыве на броне, не полагаясь на кинетическую скорость. Технологический уровень 2158 года."
 ADISCORD_tech_wire_guided_hunter_teams:0 "Крупнокалиберные противотанковые ружья"
 ADISCORD_tech_wire_guided_hunter_teams_desc:0 "Крупнокалиберный ствол и высокоскоростной бронебойный сердечник поражают раннюю бронетехнику прямым кинетическим пробитием. Технологический уровень 2161 года."
 ADISCORD_tech_recoilless_overmatch_cells:0 "Командное наведение по проводной линии"
 ADISCORD_tech_recoilless_overmatch_cells_desc:0 "Команды оператора передаются ракете по разматываемому проводу, устойчивому к радиопомехам и не требующему бортовой головки самонаведения. Технологический уровень 2161 года."
 ADISCORD_tech_fire_and_forget_seekers:0 "Безоткатные противотанковые системы"
 ADISCORD_tech_fire_and_forget_seekers_desc:0 "Истечение части пороховых газов назад уравновешивает отдачу и позволяет переносному стволу метать боеприпас достаточного калибра. Технологический уровень 2164 года."
 ADISCORD_tech_programmable_anti_armor_fuzes:0 "Полуавтоматическое наведение по линии визирования"
 ADISCORD_tech_programmable_anti_armor_fuzes_desc:0 "Оператор удерживает перекрестие на цели, а аппаратура автоматически вычисляет команды наведения ракеты относительно линии визирования. Технологический уровень 2164 года."
 ADISCORD_tech_top_attack_profiles:0 "Реактивные гранатомёты с кумулятивной боевой частью"
 ADISCORD_tech_top_attack_profiles_desc:0 "Реактивный двигатель разгоняет гранату с кумулятивной боевой частью после выхода из пусковой трубы, сохраняя переносимость оружия. Технологический уровень 2168 года."
 ADISCORD_tech_loitering_armor_hunters:0 "Инфракрасное самонаведение верхней атаки"
 ADISCORD_tech_loitering_armor_hunters_desc:0 "Матричная инфракрасная головка распознаёт тепловой образ цели и направляет ракету в менее защищённую верхнюю полусферу. Технологический уровень 2168 года."
 ADISCORD_tech_cooperative_hunter_cells:0 "Тандемные кумулятивные боевые части"
 ADISCORD_tech_cooperative_hunter_cells_desc:0 "Предзаряд разрушает динамическую защиту, после чего основной кумулятивный заряд формирует струю против основной брони. Технологический уровень 2172 года."
 ADISCORD_tech_terminal_overmatch_packages:0 "Барражирующие противотанковые боеприпасы"
 ADISCORD_tech_terminal_overmatch_packages_desc:0 "Переносной беспилотный боеприпас длительно ищет цель, передаёт изображение оператору и атакует после подтверждения. Технологический уровень 2172 года."
 ADISCORD_tech_distributed_anti_armor_net:0 "Кооперативное мультиспектральное целеуказание"
 ADISCORD_tech_distributed_anti_armor_net_desc:0 "Тепловизионные, телевизионные и лазерные наблюдатели передают единую координату разнесённым пусковым расчётам и барражирующим боеприпасам. Технологический уровень 2180 года. Требует завершения всех входящих программ и объединяет их результаты."
