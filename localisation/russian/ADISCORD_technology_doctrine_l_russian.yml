 ADISCORD_tech_electrothermal_ignition_desc:0 "Легирование, термообработка и неразрушающий контроль ствольных сталей позволяют безопасно выдерживать повышенное давление и нагрев. Технологический уровень 2163 года."
 ADISCORD_tech_smart_recoil_compensators:0 "Самозарядная автоматика"
 ADISCORD_tech_smart_recoil_compensators_desc:0 "Часть энергии выстрела приводит механизм экстракции, досылания и взведения, сокращая задержку между прицельными выстрелами. Технологический уровень 2164 года."
 ADISCORD_tech_networked_weapon_sights:0 "Вычислительное определение баллистической поправки"
 ADISCORD_tech_networked_weapon_sights_desc:0 "Вычислитель объединяет дальность, параметры патрона, угол места и атмосферные данные в готовую баллистическую поправку. Технологический уровень 2165 года."
 ADISCORD_tech_modular_rifle_kits:0 "Газоотводная автоматика"
 ADISCORD_tech_modular_rifle_kits_desc:0 "Дозированный отвод пороховых газов приводит затворную группу и обеспечивает устойчивый цикл автоматики при загрязнении и нагреве. Технологический уровень 2166 года."
 ADISCORD_tech_biometric_trigger_locks:0 "Запирание поворотным затвором"
 ADISCORD_tech_biometric_trigger_locks_desc:0 "Поворотный затвор вводит боевые упоры в зацепление со ствольной коробкой, удерживая давление до безопасного извлечения гильзы. Технологический уровень 2167 года."
 ADISCORD_tech_integrated_target_designation:0 "Интегрированные электронно-оптические прицелы"
 ADISCORD_tech_integrated_target_designation_desc:0 "Дневной, малосветовой и тепловизионный каналы сводятся к общей оптической оси и одной рассчитанной точке прицеливания. Технологический уровень 2169 года."
 ADISCORD_tech_programmable_ammunition:0 "Хромирование и износостойкие покрытия ствола"
 ADISCORD_tech_programmable_ammunition_desc:0 "Твёрдое покрытие канала ствола снижает коррозию и эрозию, сохраняя геометрию при интенсивной стрельбе. Технологический уровень 2170 года."
 ADISCORD_tech_coil_assisted_service_rifles:0 "Оптимизация импульса отдачи"
 ADISCORD_tech_coil_assisted_service_rifles_desc:0 "Массы подвижных частей, газовый импульс, буфер и геометрия оружия согласуются для уменьшения подброса и рассеивания очереди. Технологический уровень 2172 года."
 ADISCORD_tech_hybrid_kinetic_energy_carbines:0 "Полимерные и гибридные гильзы"
 ADISCORD_tech_hybrid_kinetic_energy_carbines_desc:0 "Полимерный корпус с металлическим донцем уменьшает массу боекомплекта, сохраняя обтюрацию и прочность при экстракции. Технологический уровень 2175 года."
 ADISCORD_tech_networked_service_rifles:0 "Программируемые боеприпасы"
 ADISCORD_tech_networked_service_rifles_desc:0 "Электронный взрыватель получает от прицела дальность или режим подрыва и реализует его после выстрела. Технологический уровень 2180 года. Требует завершения всех входящих программ и объединяет их результаты."
