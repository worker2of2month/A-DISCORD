 VAL_logistics_cost_750_blocked: "£ADISCORD_economy_treasury_texticon  §R750§!"
 VAL_logistics_cost_750_tooltip: "£ADISCORD_economy_treasury_texticon  §Y750§!"
 VAL_logistics_cost_1000: "£ADISCORD_economy_treasury_texticon  §Y1000§!"
