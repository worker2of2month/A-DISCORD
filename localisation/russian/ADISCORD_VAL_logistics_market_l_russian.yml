 VAL_refugee_wave_limit_tt:0 "Принято менее трёх волн из этого региона."
 VAL_train_refugee_volunteers:0 "Обучить добровольцев из числа беженцев"
 VAL_train_refugee_volunteers_desc:0 "Предложим добровольцам военную подготовку и оплачиваемую службу. На время обучения резервируется 100 тыс. размещённых беженцев. Через 35 дней армия получит 5000 подготовленных рекрутов. При отмене возвращаются 75 политвласти и зарезервированные люди."
 VAL_refugee_training_start_tt:0 "Зарезервировано §Y100 тыс.§! размещённых беженцев. Через §Y35 дней§! в резерв армии поступит §G5000§! добровольцев. При отмене люди и §Y75§! политвласти возвращаются."
 VAL_refugee_window_open_tt: "Для этого направления открыто окно приёма беженцев. Оно действует §Y180 дней§! после появления потока. Если условие не выполнено, поток ещё не открыт, срок приёма истёк или все три волны уже приняты."
