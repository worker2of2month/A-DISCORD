l_russian:
 VAL_trade_corridors: "Контрактные коридоры"
 VAL_trade_corridors_desc: "Кефрейт больше не может считать торговлю строчкой в бухгалтерской книге. Груз должен физически пройти через порты, склады, перевалы и зависимые администрации.\n\nДействующие коридоры: §Y[?VAL_trade_corridors_active|0]/[?VAL_trade_corridors_capacity|0]§! введённых в эксплуатацию\nОхрана маршрутов: §Y[?VAL_corridor_security|0]/3§!\nДавление серого рынка: §Y[?VAL_black_market_pressure|0]/100§!\n\nДо потерь серого рынка каждый открытый маршрут приносит §Y20§! казне в неделю. Модернизированный маршрут приносит ещё §G10§!. Маршрут начинает считаться обязательством только после первого фактического открытия: потеря его ключевого узла прекращает выплату и усиливает контрабанду."

 VAL_population_markets: "Население и переселенцы"
 VAL_population_markets_desc:0 "£population_texticon Свободные переселенцы: §Y[?VAL_displaced_population|1]§! × §Y10§! тыс.\n£population_texticon Жильё занято: §Y[?VAL_population_present|1]§! / §Y[?VAL_refugee_housing|0]§! × §Y10§! тыс.\n£manpower_texticon Местный резерв: §Y[?VAL_local_volunteer_pool|1]§! × §Y10§! тыс.\n\nПриём беженцев пополняет свободный резерв. Обучение превращает §Y10 тыс.§! переселенцев в армейский резерв за §Y35 дней§!. Рабочий контракт занимает §Y100 тыс.§! человек на §Y90 дней§!."

 VAL_logistics_cost_50: "£ADISCORD_economy_treasury_texticon  §Y50§!"
 VAL_logistics_cost_100: "£ADISCORD_economy_treasury_texticon  §Y100§!"
 VAL_logistics_cost_250: "£ADISCORD_economy_treasury_texticon  §Y250§!"

 VAL_invest_occidian_corridor: "Капитализировать Окцидский тракт"
 VAL_invest_occidian_corridor_desc: "Проект на §Y90 дней§! за £ADISCORD_economy_treasury_texticon §Y750§!. Инфраструктура +1 в [43.GetName], [44.GetName] и [88.GetName]; железная дорога [43.GetName]-[88.GetName] повышается до уровня 3. Доход работающего маршрута вырастет на §Y10§! в неделю до потерь серого рынка. Одновременно строится один коридор. Потеря маршрута или капитуляция отменяют проект и возвращают оплату."
 VAL_invest_northern_corridor: "Усилить северный ресурсный пояс"
 VAL_invest_northern_corridor_desc: "Проект на §Y120 дней§! за £ADISCORD_economy_treasury_texticon §Y1000§!. Инфраструктура +1 в [59.GetName], [60.GetName] и [61.GetName]; в [59.GetName] добавляются 2 стали, в [61.GetName] - 2 вольфрама. Доход работающего маршрута вырастет на §Y10§! в неделю до потерь серого рынка. Одновременно строится один коридор. Потеря маршрута или капитуляция отменяют проект и возвращают оплату."
 VAL_invest_stelander_corridor: "Перестроить дорогу на Стеландер"
 VAL_invest_stelander_corridor_desc: "Проект на §Y60 дней§! за £ADISCORD_economy_treasury_texticon §Y500§!. Инфраструктура +1 и ячейка строительства +1 в каждом из регионов [29.GetName] и [46.GetName]. Доход работающего маршрута вырастет на §Y10§! в неделю до потерь серого рынка. Одновременно строится один коридор. Потеря маршрута или капитуляция отменяют проект и возвращают оплату."
 VAL_invest_vorkerland_corridor: "Вернуть старый воркерландский канал"
 VAL_invest_vorkerland_corridor_desc: "Проект на §Y75 дней§! за £ADISCORD_economy_treasury_texticon §Y500§!. Инфраструктура +1 в регионе [33.GetName]; давление серого рынка снижается на 10. Доход работающего маршрута вырастет на §Y10§! в неделю до потерь серого рынка. Одновременно строится один коридор. Потеря маршрута или капитуляция отменяют проект и возвращают оплату."
 VAL_secure_trade_columns: "Контрактная охрана колонн"
 VAL_secure_trade_columns_desc: "Нанять конвойные роты, аудиторов складов и дорожные патрули. Каждый уровень охраны уменьшает еженедельный рост серого рынка, а операция немедленно снижает давление ещё на §G5§!."
 VAL_open_emergency_bypass: "Открыть аварийный обход"
 VAL_open_emergency_bypass_desc: "Пока ранее действовавший коридор перерезан, брокеры могут собрать дорогую временную цепочку из малых дорог, речных переправ и частных складов. В течение §Y56 дней§! обход компенсирует §Y20§! недельного дохода до потерь серого рынка, но сам подпитывает серый рынок."

 VAL_close_refugee_border: "Закрыть границу для беженцев"
 VAL_close_refugee_border_desc: "Закрыть приём новых групп беженцев. Это ограничение действует и на открытые предложения о приёме; закрытая граница также сокращает легальную торговлю."
 VAL_open_refugee_border: "Снова открыть переходы"
 VAL_open_refugee_border_desc: "Восстановить торговлю и разрешить приём по ещё действующим предложениям. Повторное открытие границы не создаёт новых волн беженцев."
 VAL_contract_refugee_labor: "Предложить рабочие контракты"
 VAL_contract_refugee_labor_desc:0 "Занять £population_texticon §Y100 тыс.§! свободных переселенцев на строительстве на 90 дней за £pol_power §Y75§! политической власти. Пока действует контракт, они недоступны для вербовки и переселения, но по-прежнему занимают жильё. По завершении или отмене все рабочие возвращаются в свободный пул."
 VAL_fund_resettlement_depots: "Переселить беженцев в [FROM.GetName]"
 VAL_fund_resettlement_depots_desc: "Переселить £population_texticon §Y100 тыс.§! уже принятых беженцев в [FROM.GetName] за §Y250§! из казны. Население региона навсегда увеличится на §G100 тыс.§!. Программа доступна только в выбранных малонаселённых домашних регионах Кефрейта под нашим контролем, не работает при незавершённой очистке загрязнения и проводится в каждом регионе один раз."
 VAL_organize_refugee_return: "Организовать возвращение"
 VAL_organize_refugee_return_desc: "После окончания региональных войн организовать безопасное возвращение £population_texticon §Y150 тыс.§! человек за §Y35§! политической власти. Снизится нагрузка на систему размещения; стабильность и политическая власть не начисляются."
 VAL_license_grey_brokers: "Лицензировать серых брокеров"
 VAL_license_grey_brokers_desc: "Не уничтожать подпольную сеть, а заставить её платить за право работать. Казна немедленно получит §G50§!, но давление серого рынка возрастёт на §R15§!."
 VAL_buy_contraband_arms: "Закупить оружие вне реестра"
 VAL_buy_contraband_arms_desc: "Когда официальные коридоры перегружены или перерезаны, часть оружия можно вернуть на рынок через частных посредников. За §Y250§! казны мы получим §G15 0000§! единиц пехотного вооружения ценой роста серого рынка на §R10§!."
 VAL_audit_broker_houses: "Разгромить брокерские дома"
 VAL_audit_broker_houses_desc:0 "За 250 монет снизить давление на 25 и зависимость от посредников на 1. Проверка закрывает лицензии и контрабандные поставки на 60 дней: заранее оцените запас оружия перед наступлением."

 VAL_corridor_network_fragmented: "Разорванная контрактная сеть"
 VAL_corridor_network_fragmented_desc: "Большая часть введённых в эксплуатацию торговых артерий Кефрейта перерезана или сеть ещё слишком узка для устойчивого оборота."
 VAL_corridor_network_partial: "Работающая контрактная сеть"
 VAL_corridor_network_partial_desc: "Действующие магистрали работают устойчиво, но система всё ещё зависит от отдельных уязвимых узлов."
 VAL_corridor_network_integrated: "Интегрированная контрактная сеть"
 VAL_corridor_network_integrated_desc: "Окцидия, север, Стеландер и старый воркерландский канал сведены в единую коммерческую систему."

 VAL_emergency_bypass: "Аварийные маршруты"
 VAL_emergency_bypass_desc: "Временная сеть частных складов и обходных дорог поддерживает оборот, пока основной коридор закрыт."
 VAL_black_market_low: "Теневая торговля"
 VAL_black_market_low_desc: "Подпольный оборот лишает казну §Y10%§! регулярного дохода, включая выплаты торговых коридоров. Растут расходы на управление, падает стабильность. Денежные потери показаны в разделе «Торговые пути»."
 VAL_black_market_high: "Параллельная экономика"
 VAL_black_market_high_desc: "Подпольный оборот лишает казну §Y25%§! регулярного дохода, включая выплаты торговых коридоров. Растут расходы на управление, падает стабильность. Денежные потери показаны в разделе «Торговые пути»."
 VAL_black_market_crisis: "Государство двух бухгалтерий"
 VAL_black_market_crisis_desc: "Подпольный оборот лишает казну §Y50%§! регулярного дохода, включая выплаты торговых коридоров. Растут расходы на управление, падает стабильность. Денежные потери показаны в разделе «Торговые пути»."
 VAL_refugee_strain: "Перегруженная система размещения"
 VAL_refugee_strain_desc:0 "Переполнение жилья повышает социальные расходы на §R7%§!, товары народного потребления на §R1%§! и снижает стабильность на §R2%§!."
 VAL_closed_border_regime: "Закрытые переходы"
 VAL_closed_border_regime_desc: "Чрезвычайный пограничный режим снижает поток людей, но задерживает и законные сделки."
 VAL_refugee_contract_labor: "Контракты для переселенцев"
 VAL_refugee_contract_labor_desc:0 "Рабочие контракты дают §G+12%§! к скорости строительства и §G+8%§! к гражданским доходам ценой §R-1%§! стабильности."

