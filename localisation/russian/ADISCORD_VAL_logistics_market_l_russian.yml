 VAL_refugee_wave_limit_tt:0 "Принято менее трёх волн из этого региона."
 VAL_train_refugee_volunteers:0 "Обучить добровольцев из числа беженцев"
 VAL_train_refugee_volunteers_desc:0 "Обучить £population_texticon §Y5 тыс.§! добровольцев из свободных переселенцев. Срок: 35 дней. Цена: £pol_power §Y75§! политической власти и £infantry_equipment_texticon §Y5000§! единиц пехотного снаряжения. Люди остаются на обеспечении до завершения обучения. При капитуляции или потере независимости обучение отменяется с возвратом людей и затрат."
 VAL_refugee_training_start_tt:0 "£population_texticon §Y10 тыс.§! переселенцев начнут §Y35-дневное§! обучение и затем пополнят армейский резерв. При отмене возвращаются люди, £pol_power §Y75§! политической власти и £infantry_equipment_texticon §Y5000§! единиц пехотного снаряжения."
 VAL_refugee_window_open_tt: "Для этого направления открыто окно приёма беженцев. Оно действует §Y180 дней§! после появления потока. Если условие не выполнено, поток ещё не открыт, срок приёма истёк или все три волны уже приняты."
 VAL_refugee_war_active_tt:0 "Война этого направления продолжается. Приём доступен раз в §Y90 дней§!."
 VAL_refugee_perimeter_active_tt:0 "Периметр открыт. Приём доступен раз в §Y90 дней§!."

 VAL_local_training_start_tt:0 "£population_texticon §Y5 тыс.§! местных добровольцев начнут §Y35-дневное§! обучение. При отмене возвращаются добровольцы, £pol_power §Y75§! политической власти и £infantry_equipment_texticon §Y5000§! единиц пехотного снаряжения."

 VAL_recruit_local_volunteers:0 "Вербовать местных добровольцев"

 VAL_recruit_local_volunteers_desc:0 "Призыв остаётся на уровне 1,25%. Дополнительный договорной резерв равен 2% исходного населения семи регионов Кефрейта и не возобновляется. Каждый набор: £population_texticon §Y5 тыс.§! местных добровольцев, 35 дней, £pol_power §Y75§! политической власти и £infantry_equipment_texticon §Y5000§! единиц пехотного снаряжения. При капитуляции или потере независимости — полный возврат."

 VAL_refugee_training_cost:0 "£population_texticon §Y10000§! £pol_power §Y75§! £infantry_equipment_texticon §Y5000§!"
 VAL_refugee_training_cost_blocked:0 "£population_texticon §R10000§! £pol_power §R75§! £infantry_equipment_texticon §R5000§!"
 VAL_refugee_training_cost_tooltip:0 "Требуется £population_texticon §Y10 тыс.§! свободных переселенцев, £pol_power §Y75§! политической власти и £infantry_equipment_texticon §Y5000§! единиц пехотного снаряжения."
 VAL_training_cost:0 "£population_texticon §Y5000§! £pol_power §Y75§! £infantry_equipment_texticon §Y5000§!"

 VAL_training_cost_blocked:0 "£population_texticon §R5000§! £pol_power §R75§! £infantry_equipment_texticon §R5000§!"

 VAL_training_cost_tooltip:0 "Нужно £population_texticon §Y5 000§! добровольцев из указанного в решении резерва, £pol_power §Y75§! политической власти и £infantry_equipment_texticon §Y5000§! пехотного снаряжения."

 VAL_labor_program_tt:0 "£population_texticon §Y100 тыс.§! переселенцев работают 90 дней: §G+12%§! к скорости строительства, §G+8%§! к гражданским доходам, §R-1%§! к стабильности. Затем люди возвращаются в свободный резерв."

 VAL_expand_refugee_housing:0 "Расширить временные поселения"

 VAL_expand_refugee_housing_desc:0 "За §Y250§! монет подготовить места для ещё §Y200 тыс.§! человек. Срок: §Y45 дней§!. Максимальная вместимость: 1 млн. При капитуляции или потере независимости деньги возвращаются."

 VAL_housing_start_tt:0 "Через 45 дней: +200 тыс. мест размещения."

