 VAL_logistics_cost_1000_tooltip: "£ADISCORD_economy_treasury_texticon  §Y1000§!"

 VAL_refugee_wave_limit_tt:0 "Принято менее трёх волн из этого региона."
 VAL_train_refugee_volunteers:0 "Обучить добровольцев из числа беженцев"
 VAL_train_refugee_volunteers_desc:0 "Обучить 5 тыс. добровольцев из свободных переселенцев. Срок: 35 дней. Цена: 75 политической власти и 5000 единиц пехотного снаряжения. Люди остаются на обеспечении до завершения обучения. При капитуляции или потере независимости обучение отменяется с возвратом людей и затрат."
 VAL_refugee_training_start_tt:0 "§Y5 тыс.§! добровольцев из числа переселенцев начнут §Y35-дневное§! обучение и затем пополнят армейский резерв. Остальные жители остаются. При отмене возвращаются добровольцы, 75 политической власти и 5000 единиц пехотного снаряжения."
 VAL_refugee_window_open_tt: "Для этого направления открыто окно приёма беженцев. Оно действует §Y180 дней§! после появления потока. Если условие не выполнено, поток ещё не открыт, срок приёма истёк или все три волны уже приняты."

 VAL_local_training_start_tt:0 "§Y5 тыс.§! местных добровольцев начнут §Y35-дневное§! обучение. При отмене возвращаются добровольцы, 75 политической власти и 5000 единиц пехотного снаряжения."

 VAL_recruit_local_volunteers:0 "Вербовать местных добровольцев"

 VAL_recruit_local_volunteers_desc:0 "Призыв остаётся на уровне 1,25%. Дополнительный договорной резерв равен 2% исходного населения семи регионов Кефрейта и не возобновляется. Каждый набор: 5 тыс. человек, 35 дней, 75 политической власти и 5000 единиц пехотного снаряжения. При капитуляции или потере независимости — полный возврат."

 VAL_training_cost:0 "£pol_power §Y75§! £infantry_equipment_text_icon §Y5000§!"

 VAL_training_cost_blocked:0 "£pol_power §R75§! £infantry_equipment_text_icon §R5000§!"

 VAL_training_cost_tooltip:0 "Нужно 75 политической власти и 5000 единиц пехотного снаряжения."

 VAL_labor_program_tt:0 "100 тыс. человек займут рабочие места на 90 дней: +8% к скорости строительства и +5% к гражданским доходам, -1% к стабильности. Затем все вернутся в свободный пул."

 VAL_expand_refugee_housing:0 "Расширить временные поселения"

 VAL_expand_refugee_housing_desc:0 "За 500 монет подготовить места для ещё 200 тыс. человек. Срок: 45 дней. Максимальная вместимость: 1 млн. При капитуляции или потере независимости деньги возвращаются."

 VAL_housing_start_tt:0 "Через 45 дней: +200 тыс. мест размещения."

 VAL_broker_market_open_tt:0 "Проверка контор завершена: посредники снова доступны"

 VAL_broker_dependence_tt:0 "Зависимость от посредников: +1, максимум 3. Каждый уровень добавляет +1 к давлению серого рынка в неделю."

 VAL_broker_audit_tt:0 "Зависимость от посредников: -1. Лицензии и закупки контрабанды закрываются на 60 дней."
