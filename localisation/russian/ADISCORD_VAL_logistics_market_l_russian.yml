l_russian:
 VAL_trade_corridors: "Контрактные коридоры"
 VAL_trade_corridors_desc: "Кефрейт больше не может считать торговлю строчкой в бухгалтерской книге. Груз должен физически пройти через порты, склады, перевалы и зависимые администрации.\n\nДействующие коридоры: §Y[?VAL_trade_corridors_active|0]/[?VAL_trade_corridors_capacity|0]§! введённых в эксплуатацию\nОхрана маршрутов: §Y[?VAL_corridor_security|0]/3§!\nДавление серого рынка: §Y[?VAL_black_market_pressure|0]/100§!\n\nКаждый открытый маршрут приносит §G20§! казне в неделю. Модернизированный маршрут приносит ещё §G10§!. Маршрут начинает считаться обязательством только после первого фактического открытия: потеря его ключевого узла прекращает выплату и усиливает контрабанду."

 VAL_population_markets: "Люди и серые рынки"
 VAL_population_markets_desc: "Войны вокруг Кефрейта заставляют семьи покидать свои дома.\n\nПеремещённое население: §Y[?VAL_displaced_population|0]§! × 10 тыс. человек\nДавление серого рынка: §Y[?VAL_black_market_pressure|0]/100§!\n\nВ начале каждого из четырёх региональных конфликтов можно один раз принять §Y100 тыс.§! беженцев за §Y250§! из казны. Предложение действует §Y60 дней§! и закрывается с окончанием соответствующей войны. Автоматического притока нет. Расселение и возвращение не дают постоянного прироста стабильности."

 VAL_logistics_cost_50: "£ADISCORD_economy_treasury_texticon  §Y50§!"
 VAL_logistics_cost_100: "£ADISCORD_economy_treasury_texticon  §Y100§!"
 VAL_logistics_cost_250: "£ADISCORD_economy_treasury_texticon  §Y250§!"

 VAL_invest_occidian_corridor: "Капитализировать Окцидский тракт"
 VAL_invest_occidian_corridor_desc: "Проект на §Y90 дней§! за £ADISCORD_economy_treasury_texticon §Y750§!. Инфраструктура +1 в [43.GetName], [44.GetName] и [88.GetName]; железная дорога [43.GetName]-[88.GetName] повышается до уровня 3. Доход работающего маршрута вырастет на §G10§! в неделю. Одновременно строится один коридор. Потеря маршрута или капитуляция отменяют проект и возвращают оплату."
 VAL_invest_northern_corridor: "Усилить северный ресурсный пояс"
 VAL_invest_northern_corridor_desc: "Проект на §Y120 дней§! за £ADISCORD_economy_treasury_texticon §Y1000§!. Инфраструктура +1 в [59.GetName], [60.GetName] и [61.GetName]; в [59.GetName] добавляются 2 стали, в [61.GetName] - 2 вольфрама. Доход работающего маршрута вырастет на §G10§! в неделю. Одновременно строится один коридор. Потеря маршрута или капитуляция отменяют проект и возвращают оплату."
 VAL_invest_stelander_corridor: "Перестроить дорогу на Стеландер"
 VAL_invest_stelander_corridor_desc: "Проект на §Y60 дней§! за £ADISCORD_economy_treasury_texticon §Y500§!. Инфраструктура +1 и ячейка строительства +1 в каждом из регионов [29.GetName] и [46.GetName]. Доход работающего маршрута вырастет на §G10§! в неделю. Одновременно строится один коридор. Потеря маршрута или капитуляция отменяют проект и возвращают оплату."
 VAL_invest_vorkerland_corridor: "Вернуть старый воркерландский канал"
 VAL_invest_vorkerland_corridor_desc: "Проект на §Y75 дней§! за £ADISCORD_economy_treasury_texticon §Y500§!. Инфраструктура +1 в регионе [33.GetName]; давление серого рынка снижается на 10. Доход работающего маршрута вырастет на §G10§! в неделю. Одновременно строится один коридор. Потеря маршрута или капитуляция отменяют проект и возвращают оплату."
 VAL_secure_trade_columns: "Контрактная охрана колонн"
 VAL_secure_trade_columns_desc: "Нанять конвойные роты, аудиторов складов и дорожные патрули. Каждый уровень охраны уменьшает еженедельный рост серого рынка, а операция немедленно снижает давление ещё на §G5§!."
 VAL_open_emergency_bypass: "Открыть аварийный обход"
 VAL_open_emergency_bypass_desc: "Пока ранее действовавший коридор перерезан, брокеры могут собрать дорогую временную цепочку из малых дорог, речных переправ и частных складов. В течение §Y56 дней§! обход компенсирует §G20§! недельного дохода, но сам подпитывает серый рынок."

 VAL_close_refugee_border: "Закрыть границу для беженцев"
 VAL_close_refugee_border_desc: "Закрыть приём новых групп беженцев. Это ограничение действует и на открытые предложения о приёме; закрытая граница также сокращает легальную торговлю."
 VAL_open_refugee_border: "Снова открыть переходы"
 VAL_open_refugee_border_desc: "Восстановить торговлю и разрешить приём по ещё действующим предложениям. Повторное открытие границы не создаёт новых волн беженцев."
 VAL_contract_refugee_labor: "Предложить рабочие контракты"
 VAL_contract_refugee_labor_desc: "Предложить рабочие контракты §Y100 тыс.§! переселенцев. Мобилизационный резерв вырастет на §G2 500§!, строительный бонус действует §Y90 дней§!."
 VAL_fund_resettlement_depots: "Финансировать переселенческие депо"
 VAL_fund_resettlement_depots_desc: "Оплатить жильё, транспорт и документы для §Y200 тыс.§! перемещённых лиц. Организованный учёт разгрузит социальную систему и уменьшит пространство для нелегальных посредников."
 VAL_organize_refugee_return: "Организовать возвращение"
 VAL_organize_refugee_return_desc: "После окончания региональных войн организовать безопасное возвращение §Y150 тыс.§! человек за §Y35§! политической власти. Снизится нагрузка на систему размещения; стабильность и политическая власть не начисляются."
 VAL_license_grey_brokers: "Лицензировать серых брокеров"
 VAL_license_grey_brokers_desc: "Не уничтожать подпольную сеть, а заставить её платить за право работать. Казна немедленно получит §G50§!, но давление серого рынка возрастёт на §R15§!."
 VAL_buy_contraband_arms: "Закупить оружие вне реестра"
 VAL_buy_contraband_arms_desc: "Когда официальные коридоры перегружены или перерезаны, часть оружия можно вернуть на рынок через частных посредников. За §Y250§! казны мы получим §G1 500§! единиц пехотного вооружения ценой роста серого рынка на §R10§!."
 VAL_audit_broker_houses: "Разгромить брокерские дома"
 VAL_audit_broker_houses_desc: "Совместная проверка казначейства, военной полиции и контрактных судов закроет наиболее наглые схемы. Давление серого рынка снизится на §G25§!, но операция потребует §Y250§! из казны."

 VAL_corridor_network_fragmented: "Разорванная контрактная сеть"
 VAL_corridor_network_fragmented_desc: "Большая часть введённых в эксплуатацию торговых артерий Кефрейта перерезана или сеть ещё слишком узка для устойчивого оборота."
 VAL_corridor_network_partial: "Работающая контрактная сеть"
 VAL_corridor_network_partial_desc: "Действующие магистрали работают устойчиво, но система всё ещё зависит от отдельных уязвимых узлов."
 VAL_corridor_network_integrated: "Интегрированная контрактная сеть"
 VAL_corridor_network_integrated_desc: "Окцидия, север, Стеландер и старый воркерландский канал сведены в единую коммерческую систему."

 VAL_emergency_bypass: "Аварийные маршруты"
 VAL_emergency_bypass_desc: "Временная сеть частных складов и обходных дорог поддерживает оборот, пока основной коридор закрыт."
 VAL_black_market_low: "Теневая торговля"
 VAL_black_market_low_desc: "Небольшой серый рынок закрывает отдельные провалы снабжения и даже приносит доход, но требует всё больше административного внимания."
 VAL_black_market_high: "Параллельная экономика"
 VAL_black_market_high_desc: "Контрабандисты уже обслуживают заметную долю оборота. Деньги текут, но вместе с ними растут коррупция, фиктивные накладные и нелегальные вооружённые сети."
 VAL_black_market_crisis: "Государство двух бухгалтерий"
 VAL_black_market_crisis_desc: "Официальная и подпольная экономики стали почти равноправными. Казна ещё получает деньги, но государство всё чаще не знает, кто именно контролирует товары, оружие и людей."
 VAL_refugee_strain: "Перегруженная система размещения"
 VAL_refugee_strain_desc: "Слишком много перемещённых людей одновременно зависят от жилья, транспорта, медицины и продовольственных норм Кефрейта."
 VAL_closed_border_regime: "Закрытые переходы"
 VAL_closed_border_regime_desc: "Чрезвычайный пограничный режим снижает поток людей, но задерживает и законные сделки."
 VAL_refugee_contract_labor: "Контракты для переселенцев"
 VAL_refugee_contract_labor_desc: "Часть перемещённого населения получила формальные рабочие контракты и включена в строительные и промышленные проекты."

 VAL_refugee_admission_tt: "Принять §Y100 тыс.§! беженцев. Давление серого рынка: §R+5§!."

 VAL_refugee_border_open_tt: "Граница открыта для приёма беженцев"

 VAL_refugee_capacity_tt: "В системе размещения не более §Y900 тыс.§! человек"

 VAL_accept_vorkerland_refugees: "Принять беженцев из Воркерланда"

 VAL_accept_vorkerland_refugees_desc: "Однократно принять §Y100 тыс.§! беженцев за §Y250§! из казны. Решение доступно в течение §Y60 дней§! с начала этой войны, пока она продолжается. Приём не повышает стабильность и увеличивает давление серого рынка на §R5§!."

