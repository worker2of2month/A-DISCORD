 VAL_refugee_wave_limit_tt:0 "Из этого направления принято менее §Y3 волн§!."
 VAL_train_refugee_volunteers:0 "Обучить добровольцев из числа беженцев"
 VAL_train_refugee_volunteers_desc:0 "£population_texticon §Y5 тыс.§! добровольцев станут армейским резервом через §Y35 дней§!. Цена: §Y50§! £political_power_texticon и £infantry_equipment_texticon §Y2500§!."
 VAL_refugee_training_start_tt:0 "Через §Y35 дней§!: £manpower_texticon §G+5 тыс.§!. При отмене возвращаются люди, §Y50§! £political_power_texticon и £infantry_equipment_texticon §Y2500§!."
 VAL_refugee_window_open_tt: "Для этого направления открыто окно приёма беженцев. Оно действует §Y180 дней§! после появления потока. Если условие не выполнено, поток ещё не открыт, срок приёма истёк или все три волны уже приняты."
 VAL_refugee_war_active_tt: "Война этого направления продолжается."
 VAL_refugee_perimeter_active_tt: "Периметр открыт для нового потока беженцев."

 VAL_local_training_start_tt:0 "£population_texticon §Y5 тыс.§! местных добровольцев начнут §Y35-дневное§! обучение. При отмене возвращаются добровольцы, §Y75§! £political_power_texticon и £infantry_equipment_texticon §Y5000§! единиц пехотного снаряжения."

 VAL_recruit_local_volunteers:0 "Вербовать местных добровольцев"

 VAL_recruit_local_volunteers_desc:0 "Призыв остаётся на уровне 1,25%. Дополнительный договорной резерв равен 2% исходного населения семи регионов Кефрейта и не возобновляется. Каждый набор: £population_texticon §Y5 тыс.§! местных добровольцев, 35 дней, §Y75§! £political_power_texticon и £infantry_equipment_texticon §Y5000§! единиц пехотного снаряжения. При капитуляции или потере независимости — полный возврат."

 VAL_training_cost:0 "£population_texticon §Y5000§! §Y50§! £political_power_texticon £infantry_equipment_texticon §Y2500§!"

