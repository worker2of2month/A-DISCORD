 VAL_corridor_project_refund_tt: "Неиспользованная оплата проекта полностью возвращается в казну."
 VAL_corridor_occidia_result_tt: "Инфраструктура +1 в [43.GetName], [44.GetName] и [88.GetName]; железная дорога [43.GetName]-[88.GetName] повышается до уровня 3. Доход действующего маршрута: §Y+10§! в неделю до потерь серого рынка."
 VAL_corridor_north_result_tt: "Инфраструктура +1 в [59.GetName], [60.GetName] и [61.GetName]; в [59.GetName] добавляются 2 стали, в [61.GetName] - 2 вольфрама. Доход действующего маршрута: §Y+10§! в неделю до потерь серого рынка."
 VAL_corridor_stelander_result_tt: "Инфраструктура +1 и ячейка строительства +1 в каждом из регионов [29.GetName] и [46.GetName]. Доход действующего маршрута: §Y+10§! в неделю до потерь серого рынка."
