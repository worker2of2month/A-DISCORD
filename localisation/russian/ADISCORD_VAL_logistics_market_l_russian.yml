 VAL_training_cost_tooltip:0 "Нужно £population_texticon §Y5 тыс.§! свободных переселенцев, §Y50§! £political_power_texticon и £infantry_equipment_texticon §Y2500§!."

 VAL_labor_program_tt:0 "На §Y90 дней§!: строительство §G+12%§!, гражданские доходы §G+8%§!, стабильность §R-1%§!. Затем рабочие возвращаются."

 VAL_expand_refugee_housing:0 "Расширить временные поселения"

 VAL_expand_refugee_housing_desc:0 "За §Y250§! монет через §Y45 дней§! появятся места ещё для §Y300 тыс.§! человек. Максимальная вместимость: §Y1 млн§!."

 VAL_housing_start_tt:0 "Через §Y45 дней§!: вместимость жилья §G+300 тыс.§!."

 VAL_broker_market_open_tt:0 "Проверка контор завершена: посредники снова доступны"

 VAL_broker_dependence_tt:0 "Зависимость от посредников: +1, максимум 3. Каждый уровень добавляет +1 к давлению серого рынка в неделю."

 VAL_broker_audit_tt:0 "Зависимость от посредников: -1. Лицензии и закупки контрабанды закрываются на 60 дней."

