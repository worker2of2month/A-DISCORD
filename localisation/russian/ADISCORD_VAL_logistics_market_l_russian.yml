 VAL_accept_perimeter_refugees_desc:0 "Принять §Y100 тыс.§! беженцев за §Y100§! монет. Серый рынок: §R+3§!. Повторно через §Y90 дней§!. Люди пополняют резерв переселения."
 VAL_refugee_resettlement_result_tt:0 "£population_texticon §Y100 тыс.§! перемещённых людей навсегда поселяются в регионе §Y[FROM.GetName]§!."
