 VAL_refugee_border_open_tt: "Граница открыта для приёма беженцев"

 VAL_refugee_capacity_tt:0 "Общее число размещённых вместе с занятыми в программах не превысит 1 млн человек. Превышение вместимости жилья вызывает перегрузку."

 VAL_accept_vorkerland_refugees: "Принять беженцев из Воркерланда"

 VAL_accept_vorkerland_refugees_desc:0 "Принять §Y300 тыс.§! беженцев за §Y100§! монет. Серый рынок: §R+3§!. Повторно через §Y90 дней§!. Люди пополняют резерв переселения."

