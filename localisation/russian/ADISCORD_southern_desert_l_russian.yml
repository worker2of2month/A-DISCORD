l_russian:
 KDR: "Кадир"
 KDR_DEF: "Кадир"
 KDR_ADJ: "Кадирск."
 KDR_chauvinism: "Кадир"
 KDR_chauvinism_party: "Солнечный престол"
 KDR_Rashid_al_Kadir: "Рашид аль-Кадир"
 KDR_Rashid_al_Kadir_desc: "Рашид аль-Кадир подчинил караванные дружины Солнечному престолу и объявил главную дорогу священной осью Кадира. Теперь торговля, стража и сбор дани служат одной власти."
 KDR_keeper_of_caravan_law: "Хранитель Солнечной дороги"
 KDR_keeper_of_caravan_law_desc: "Рашид превращает почитание солнца и дороги в дисциплину, объединяющую разрозненные караваны."
 KDR_law_of_a_thousand_miles: "Закон Солнечной дороги"
 KDR_law_of_a_thousand_miles_desc: "Каждая станция на великом тракте обязана снабжать караваны престола, содержать дозор и признавать верховную власть Кадира."

 RHM: "Рахма"
 RHM_DEF: "Рахма"
 RHM_ADJ: "Рахмийск."
 RHM_humanism: "Рахма"
 RHM_humanism_party: "Круг колодцев"
 RHM_Faris_Rahma: "Фарис Рахма"
 RHM_Faris_Rahma_desc: "Фарис Рахма был избран первым голосом Круга колодцев — открытого собрания городов красной земли и речных поселений. Его власть держится на согласии общин, а не на праве владеть водой."
 RHM_first_voice_of_cisterns: "Первый голос круга"
 RHM_first_voice_of_cisterns_desc: "Фарис добивается решений, при которых ни один город не остаётся без представительства и доступа к общим запасам."
 RHM_cistern_parliament: "Хартия общего колодца"
 RHM_cistern_parliament_desc: "Вода Рахмы признана общим достоянием. Города совместно содержат цистерны и выбирают представителей для распределения запасов."

 SDR: "Сардан"
 SDR_DEF: "Сардан"
 SDR_ADJ: "Сарданск."
 SDR_pragmatism: "Сардан"
 SDR_pragmatism_party: "Союз сухого русла"
 SDR_Hamid_Sahr: "Хамид Сахр"
 SDR_Hamid_Sahr_desc: "Хамид Сахр связал поселения вдоль ломаного сухого русла сетью дозоров и взаимных обязательств. Союз признаёт только те правила, которые помогают пережить очередной сезон пыльных бурь."
 SDR_marshal_of_the_dry_bed: "Старший дозорный русла"
 SDR_marshal_of_the_dry_bed_desc: "Хамид быстро меняет маршруты патрулей и снабжения, когда старые дороги поглощает песок."
 SDR_dry_river_patrols: "Цепь дозоров сухого русла"
 SDR_dry_river_patrols_desc: "Небольшие заставы передают друг другу вести, сопровождают обозы и закрывают опасные переходы без громоздкого центрального аппарата."

 MZR: "Мазар"
 MZR_DEF: "Мазар"
 MZR_ADJ: "Мазарск."
 MZR_utilitarism: "Мазар"
 MZR_utilitarism_party: "Палата общего пайка"
 MZR_Ration_Assembly: "Собрание распределителей"
 MZR_Ration_Assembly_desc: "Мазар подчинил хозяйство простому принципу: каждая капля должна принести наибольшую пользу большинству. Представители поселений выбирают распределителей по результатам их работы с запасами и водовозами."
 MZR_stewards_of_common_wells: "Распорядители общих колодцев"
 MZR_stewards_of_common_wells_desc: "Собрание оценивает решения по числу обеспеченных поселений, цене доставки и сохранённым запасам."
 MZR_common_water_charter: "Хартия общего водного пайка"
 MZR_common_water_charter_desc: "Колодцы и водосборы считаются общественным ресурсом. Пайки меняются вместе с запасами, но единые правила защищают окраины от произвола местных владельцев."

 KYZ: "Кейзан"
 KYZ_DEF: "Кейзан"
 KYZ_ADJ: "Кейзанск."
 KYZ_anarchism: "Кейзан"
 KYZ_anarchism_party: "Союз арычных общин"
 KYZ_Qanat_Assembly: "Собрание арычных общин"
 KYZ_Qanat_Assembly_desc: "Поселения Кейзана не признают постоянной столицы. Делегаты сходятся у главного водосбора лишь для решения споров о каналах, пастбищах и общей обороне."
 KYZ_voice_of_the_communes: "Голос общин"
 KYZ_voice_of_the_communes_desc: "Представитель собрания может говорить от имени Кейзана, но не вправе приказывать общинам без их открытого согласия."
 KYZ_free_qanat_compact: "Договор свободных кяризов"
 KYZ_free_qanat_compact_desc: "Каждая община обслуживает свой участок подземного канала, а крупные ремонты проводятся совместно по взаимной клятве, а не по приказу центральной власти."

 SHL: "Шахрабад"
 SHL_DEF: "Шахрабад"
 SHL_ADJ: "Шахрабадск."
 SHL_hedonism: "Шахрабад"
 SHL_hedonism_party: "Конклав девяти печей"
 SHL_Jalil_Nur: "Джалиль Нур"
 SHL_Jalil_Nur_desc: "Джалиль Нур представляет девять богатейших промышленных домов Шахрабада. За симметричными золотыми воротами конклава они делят сырьё, рынки и привилегии, недоступные рабочим кварталам."
 SHL_mediator_of_nine_furnaces: "Первый посредник конклава"
 SHL_mediator_of_nine_furnaces_desc: "Джалиль не позволяет соперничеству домов остановить печи, пока их общее богатство продолжает расти."
 SHL_nine_furnaces_compact: "Пакт девяти печей"
 SHL_nine_furnaces_compact_desc: "Девять промышленных домов согласуют закупки, экспорт и цены на энергию, сохраняя прибыль и власть внутри замкнутого круга."

 GLP: "Вейр"
 GLP_DEF: "Вейр"
 GLP_ADJ: "Вейрск."
 GLP_hedonism: "Вейр"
 GLP_hedonism_party: "Торговая палата"
 GLP_Miran_Veyr: "Миран Вейр"
 GLP_Miran_Veyr_desc: "Миран Вейр представляет торговые дома побережья и судоремонтные предприятия столицы."
 GLP_broker_of_glass_ports: "Председатель палаты"
 GLP_broker_of_glass_ports_desc: "Миран согласовывает интересы портов и крупных торговых компаний."
 GLP_prismatic_trade_code: "Портовый кодекс"
 GLP_prismatic_trade_code_desc: "Единые правила регулируют портовые сборы, страхование грузов и работу прибрежных мастерских."

 AZH: "Ажар"
 AZH_DEF: "Ажар"
 AZH_ADJ: "Ажарск."
 AZH_etatism: "Ажар"
 AZH_etatism_party: "Директория Чёрного бассейна"
 AZH_Samir_Azhar: "Самир Ажар"
 AZH_Samir_Azhar_desc: "Самир Ажар превратил красные округа вокруг Чёрного бассейна в единую военную директорию. Золотое кольцо на знамени обозначает власть центра над землёй, гарнизонами и запасами топлива."
 AZH_warden_of_the_black_basin: "Начальник директории"
 AZH_warden_of_the_black_basin_desc: "Самир требует от каждого округа людей и припасы по единому государственному плану."
 AZH_black_basin_levy: "Мобилизация Чёрного бассейна"
 AZH_black_basin_levy_desc: "Окружные администрации ведут общий воинский учёт, содержат резервные части и подчиняют снабжение центральному командованию."

 WEF: "Фенн"
 WEF_DEF: "Фенн"
 WEF_ADJ: "Феннск."
 WEF_utilitarism: "Фенн"
 WEF_utilitarism_party: "Союз восстановления"
 WEF_Elina_Fenn: "Элина Фенн"
 WEF_Elina_Fenn_desc: "После разрыва с Эфлором Элина Фенн объединила дорожные бригады, муниципалитеты и склады вокруг измеримой программы восстановления. Каждый проект оценивают по тому, сколько людей он соединит и снабдит."
 WEF_mayor_of_the_last_bridge: "Координатор восстановления"
 WEF_mayor_of_the_last_bridge_desc: "Элина направляет ограниченные ресурсы туда, где отремонтированная дорога или мост дадут наибольший общий результат."
 WEF_frontier_municipalism: "Программа общего результата"
 WEF_frontier_municipalism_desc: "Муниципалитеты сохраняют самостоятельность, но получают материалы только за проекты с доказанной пользой для снабжения, связи и безопасности Фенна."


