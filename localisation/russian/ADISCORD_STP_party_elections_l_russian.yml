l_russian:
 STP_elections_in_the_party: "Выборы в партии"
 STP_elections_in_the_party_desc: "§YПётр Иванов§! остаётся единственной фигурой, которая удерживает вместе партийный аппарат, гарнизоны и праздничную легенду режима. Его угасание нельзя остановить решением: доступное время необходимо потратить на подготовку преемника, сохранение аппарата или создание подпольной сети.[PeterHealth][WhoTFDoWeSupportText][STP_display_party_suspicion]\n\n§YГотовность сопротивления§!: [?STP_resistance_readiness|0]%\n§YНаблюдаемая контрмера§!: [STPGetObservedCountermeasure]\n§YНодрул§!: [STPGetNODAssessment]\n\n§gОдна основная и одна вспомогательная операция могут идти одновременно. Повтор одной схемы повышает адаптацию служб; итог наследования будет зафиксирован автоматическим финальным фокусом.§!"

 STP_WhoTFDoWeSupportText_loc: "\n\nНа данный момент мы поддерживаем [WhoTFDoWeSupportLeader]."
