 STP_elections_in_the_party_desc: "§YПётр Иванов§! пока удерживает вместе партийный аппарат, гарнизоны и внешние гарантии. Время до его смерти фиксировано; фокусы открывают семейства операций и улучшают единый динамический модификатор §Y«Подготовка к переходу власти»§!.[PeterHealth][WhoTFDoWeSupportText]\n\n§YОперативная сводка§!\n £STP_suspicion §YПодозрение служб§!: [STPGetSuspicionValue]\n §YИнициатива§!: [STPGetTransitionBalance]\n §YНаблюдаемая контрмера§!: [STPGetObservedCountermeasure]\n §YПозиция Нодрула§!: [STPGetNODAssessment]\n\n§gПодозрение — единственный открытый числовой риск. Готовность сопротивления, опорные узлы и адаптация служб рассчитываются внутри системы. Одновременно может идти одна основная и одна вспомогательная операция.§!"

 STP_WhoTFDoWeSupportText_loc: "\n\nНа данный момент мы поддерживаем [WhoTFDoWeSupportLeader]."
