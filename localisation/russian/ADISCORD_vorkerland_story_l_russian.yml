l_russian:
 ADISCORD_vorkerland_story.1.t: "Претенденты вступают в войну"
 ADISCORD_vorkerland_story.1.d: "Последние аварийные каналы между уцелевшими центральными правительствами Воркерланда замолчали. Оставшиеся претенденты отныне считают друг друга врагами. Боевые действия подтверждены на всех необходимых фронтах — борьба за центр началась."
 ADISCORD_vorkerland_story.1.a: "Судьбу республики решит центр."
 ADISCORD_vorkerland_story.2.t: "Гранд-Воркенсберг пал"
 ADISCORD_vorkerland_story.2.d: "Силы, победа которых засчитана государству [ROOT.GetNameDef], ворвались в Гранд-Воркенсберг и вытеснили центральное командование рабочего претендента. Чрезвычайные комитеты ещё не капитулировали, но потеря старой столицы потрясла их власть по всему фронту."
 ADISCORD_vorkerland_story.2.a: "Старый центр перешёл из рук в руки."
 ADISCORD_vorkerland_story.3.t: "Изаия пала"
 ADISCORD_vorkerland_story.3.d: "Силы, победа которых засчитана государству [ROOT.GetNameDef], заняли Изаию — ставку военной коалиции Влада. Уцелевшие министерства отступают под огнём, а соперники уже объявляют западное командование разбитым."
 ADISCORD_vorkerland_story.3.a: "Коалиция лишилась столицы."
 ADISCORD_vorkerland_story.4.t: "Нордверк пал"
 ADISCORD_vorkerland_story.4.d: "Силы, победа которых засчитана государству [ROOT.GetNameDef], захватили Нордверк и его командные узлы. Технократическая администрация доктора Дориана Воркса продолжает войну из рассредоточенных объектов, но директораты потеряли политический центр."
 ADISCORD_vorkerland_story.4.a: "Технократы отступают."
 ADISCORD_vorkerland_story.5.t: "Захваченный командный аппарат"
 ADISCORD_vorkerland_story.5.d: "Первый соперничающий претендент капитулировал. В нашем распоряжении оказались штабные офицеры, шифровальщики и начальники снабжения. Часть из них можно включить в победившее командование; другие предупреждают, что вместе с аппаратом поражённого режима переживут и его распри."
 ADISCORD_vorkerland_story.5.a: "Включить полезные штабы в нашу структуру."
 ADISCORD_vorkerland_story.5.b: "Распустить аппарат и освободить служащих."
 ADISCORD_vorkerland_story.6.t: "После канонады"
 ADISCORD_vorkerland_story.6.worker.d: "Воркерланд снова един под руководством [ROOT.GetLeader]. Лоялисты Воркера и чрезвычайные администраторы Антона Бэгли согласны, что военное государство должно измениться, но спорят, кто поведёт восстановление — штабная сеть или гражданские учреждения."
 ADISCORD_vorkerland_story.6.joint.d: "Воркерланд снова един под руководством [ROOT.GetLeader]. Коалиция Влада и уцелевшие рядом с ней совместные советы должны решить, будет ли объединением управлять единое командование или гарантии, выданные провинциям."
 ADISCORD_vorkerland_story.6.worx.d: "Воркерланд снова един под властью доктора Дориана Воркса. Технократическая администрация может сохранить военные директораты как орудия восстановления либо подвергнуть чрезвычайные лаборатории и плановые бюро официальной проверке."
 ADISCORD_vorkerland_story.6.worker.a: "Сохранить чрезвычайный штаб для восстановления."
 ADISCORD_vorkerland_story.6.worker.b: "Вернуть полномочия гражданским министерствам."
 ADISCORD_vorkerland_story.6.joint.a: "Подчинить советы общему командованию."
 ADISCORD_vorkerland_story.6.joint.b: "Издать хартию провинциальных гарантий."
 ADISCORD_vorkerland_story.6.worx.a: "Доктор Воркс сохранит технократические директораты."
 ADISCORD_vorkerland_story.6.worx.b: "Проверить чрезвычайные лаборатории."
 ADISCORD_vorkerland_story.7.t: "Рабочее правительство объединяет Воркерланд"
 ADISCORD_vorkerland_story.7.d: "Последний центральный фронт закрыт. Под руководством [ROOT.GetLeader] рабочая республика восстановила единую администрацию Воркерланда и начала превращать чрезвычайные комитеты в учреждения мирного восстановления."
 ADISCORD_vorkerland_story.7.a: "Израненная республика выстояла."
 ADISCORD_vorkerland_story.8.t: "Коалиция Влада объединяет Воркерланд"
 ADISCORD_vorkerland_story.8.d: "Последний центральный фронт закрыт. Коалиция Влада и уцелевшие совместные советы восстановили единый Воркерланд, сохраняя равновесие между центральным командованием и обещаниями, данными провинциальным союзникам."
 ADISCORD_vorkerland_story.8.a: "Коалиция унаследовала центр."
 ADISCORD_vorkerland_story.9.t: "Доктор Воркс объединяет Воркерланд"
 ADISCORD_vorkerland_story.9.d: "Последний центральный фронт закрыт. Доктор Дориан Воркс объединил Воркерланд под властью технократической администрации, а военные директораты уже измеряют восстановление республики энергией, транспортом и производственными заданиями."
 ADISCORD_vorkerland_story.9.a: "Технократия начинает восстановление."
