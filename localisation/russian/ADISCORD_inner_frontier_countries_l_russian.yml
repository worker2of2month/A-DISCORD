l_russian:
 BOR: "Борея"
 BOR_DEF: "Борейская Республика"
 BOR_ADJ: "борейск."
 BOR_humanism: "Борейская Республика"
 BOR_humanism_party: "Съезд пограничных общин"
 BOR_Elena_Borey: "Елена Борей"
 BOR_Elena_Borey_desc: "Елена Борей координировала иторские госпитальные колонны ещё до того, как разрозненные поселения объявили себя республикой. Она умеет договариваться с Иторой, местными старостами и военными заставами, но каждый новый договор напоминает Борее, насколько её безопасность зависит от восточного соседа."
 BOR_frontier_mediator: "Посредница пограничья"
 BOR_frontier_mediator_desc: "Борей превращает конкурирующие требования беженцев, гарнизонов и общин в выполнимые соглашения, не обещая им полного согласия."
 BOR_itoran_relief_charter: "Иторская хартия помощи"
 BOR_itoran_relief_charter_desc: "Итора оплачивает часть дорог, больниц и складов Бореи. Помощь делает границу устойчивой, но связывает республиканский бюджет обязательствами перед иностранным покровителем."

 DOL: "Дольн"
 DOL_DEF: "Дольнский союз"
 DOL_ADJ: "дольнск."
 DOL_pragmatism: "Дольнский союз"
 DOL_pragmatism_party: "Совет дорожных округов"
 DOL_Marko_Doln: "Марко Дольн"
 DOL_Marko_Doln_desc: "Марко Дольн не основал государство — он убедил пять дорожных округов одновременно чинить мосты и признавать одни весовые меры. Союз держится на полезности общего управления и может рассыпаться, если центр потребует от общин больше, чем вернёт им дорогами и безопасностью."

 RIN: "Рина"
 RIN_DEF: "Ринский палатинат"
 RIN_ADJ: "ринск."
 RIN_hedonism: "Ринский палатинат"
 RIN_hedonism_party: "Двор Двух Присяг"
 RIN_Alaric_IV_Ren: "Аларик IV Рен"
 RIN_Alaric_IV_Ren_desc: "Аларик IV сохранил трон, обещая Монтере верность северной короне, а воркерландским торговцам — неприкосновенность старых хартий. Обе стороны считают его временным союзником, поэтому палатин превратил дворцовую гвардию в единственный институт, которому доверяет без оговорок."
 RIN_last_palatin: "Последний палатин"
 RIN_last_palatin_desc: "Аларик умеет превращать церемониальную власть в военный приказ и лично удерживает расколотый двор от открытой измены."
 RIN_two_oaths: "Две несовместимые присяги"
 RIN_two_oaths_desc: "Северные дома клянутся Монтере, южные живут по воркерландским хартиям. Против внешнего давления они выступают вместе, но любое мирное решение нарушает одну из двух присяг."
 RIN_palace_guard: "Палатинская гвардия"
 RIN_palace_guard_desc: "Хорошо оплачиваемые полки охраняют двор, узлы связи и главные дороги. Их выучка высока, а содержание съедает средства, которых не хватает обычным гарнизонам."
 RIN_northern_court: "Северный палатинский двор"
 RIN_northern_court_DEF: "Северный палатинский двор"
 RIN_northern_court_ADJ: "северопалатинск."
 RIN_northern_court_chauvinism: "Северный палатинский двор"
 RIN_northern_court_chauvinism_DEF: "Северный палатинский двор"
 RIN_northern_court_chauvinism_ADJ: "северопалатинск."
 RIN_southern_charter_mobilization: "Ополчение южных хартий"
 RIN_southern_charter_mobilization_desc: "Города юга открыли арсеналы старых торговых домов и поставили дружины под единое командование. Хартии дают им общую цель, но не заменяют устойчивого государства."
 RIN_northern_crown_columns: "Колонны северной короны"
 RIN_northern_crown_columns_desc: "Северные дома свели дворянские дружины и палатинские части в походные колонны. Монтера снабжает их оружием, не превращая локальную войну в общий союзный фронт."
 RIN_charter_compact: "Хартия южных городов"
 RIN_charter_compact_desc: "Пережив раскол, города закрепили старые торговые хартии как основу общего права. Палатин сохраняет престол, но больше не может обещать одну страну двум внешним покровителям."
 RIN_crown_palatin: "Коронный палатинат"
 RIN_crown_palatin_desc: "Северная присяга стала государственным порядком. Двор получает оружие и защиту Монтеры, расплачиваясь зависимостью и обязанностью охранять имперские дороги."

 ADISCORD_rin_oath_crisis_category: "Две присяги Рины"
 ADISCORD_rin_oath_crisis_category_desc: "Распад Воркерланда лишил палатинский двор возможности одновременно служить северной короне и южным хартиям."
 ADISCORD_rin_palatin_breakup_mission: "Распад Ринского палатината"
 ADISCORD_rin_palatin_breakup_mission_desc: "Северный двор удерживает Палатинский Двор и старые владения короны, а южные города защищают воркерландские хартии. Если ни одна сторона не победит за 180 дней, граница раскола станет основой вынужденного перемирия."
 ADISCORD_rin_crisis.1.t: "Две присяги требуют ответа"
 ADISCORD_rin_crisis.1.d: "Война в Воркерланде разорвала торговые договоры, на которых держался юг, и одновременно убедила Монтеру потребовать исполнения северной присяги. Дворяне Палатинского Двора уже поднимают коронные знамёна; городские советы Рины отвечают, что ни один чужой престол не отменит их хартии. Аларик IV должен выбрать — или признать, что единого палатината больше нет."
 ADISCORD_rin_crisis.1.a: "Хартии переживут корону"
 ADISCORD_rin_crisis.1.b: "Присяга Монтере остаётся в силе"

 KRM: "Кременская палата"
 KRM_DEF: "Кременская промышленная палата"
 KRM_ADJ: "кременск."
 KRM_utilitarism: "Кременская промышленная палата"
 KRM_utilitarism_party: "Палата шахт и дорог"
 KRM_Ivo_Kremen: "Иво Кремень"
 KRM_Ivo_Kremen_desc: "После распада Внешнего заслона Иво Кремень собрал управляющих шахтами, перевозчиков и городских пайщиков в Промышленную палату. Он оценивает решения по тоннажу, срокам и числу сохранённых рабочих мест, оставляя вопросы справедливости тем, кто сумеет выразить их в производственном плане."
 KRM_slag_road_compact: "Договор шлаковых дорог"
 KRM_slag_road_compact_desc: "Отвалы превращают в дорожное полотно, а каждая шахта обязана содержать участок пути до общего сортировочного узла. Лига получает сырьё и надёжную логистику, но население живёт среди пыли и тяжёлого транспорта."

 LMN: "Леман"
 LMN_DEF: "Леманский кордон"
 LMN_ADJ: "леманск."
 LMN_etatism: "Леманский кордон"
 LMN_etatism_party: "Чрезвычайная санитарная комиссия"
 LMN_Vera_Lemann: "Вера Леманн"
 LMN_Vera_Lemann_desc: "Вера Леманн руководила южным сектором Внешнего заслона. Когда Воркерланд перестал присылать приказы и жалование, она подчинила себе фильтрационные пункты Лемана и превратила временные инструкции в законы нового кордона."
 LMN_quarantine_commissioner: "Комиссар карантинной линии"
 LMN_quarantine_commissioner_desc: "Леманн знает каждый блокпост и склад кордона, но воспринимает гражданское управление как продолжение режима чрезвычайной изоляции."
 LMN_permanent_quarantine: "Вечный карантин"
 LMN_permanent_quarantine_desc: "Оборонительные линии, фильтрационные пункты и закрытые склады делают кордон трудной целью. Те же ограничения мешают свободному труду, переселению и нормальной мобилизации населения."

 RLY: "Релейн"
 RLY_DEF: "Релейнская республика"
 RLY_ADJ: "релейнск."
 RLY_technocracy: "Релейнская республика"
 RLY_technocracy_party: "Станционный совет"
 RLY_Relay_Assembly_17: "Станционный совет Релейна"
 RLY_Relay_Assembly_17_desc: "В Релейне нет единоличного главы. Начальники смен, инженеры очистки и хранители архива заседают в Станционном совете, совместно утверждая аварийные протоколы и порядок использования уцелевшей инфраструктуры."
 RLY_closed_circuit: "Замкнутый контур"
 RLY_closed_circuit_desc: "Релейн окружён зоной отчуждения и вынужден повторно использовать воду, детали и тепло. Республика удивительно самодостаточна, но не способна быстро заменить потерянное оборудование или пережить открытие внешнего фронта."

 WCG: "Внешний заслон"
 WCG_DEF: "Воркерландское управление внешнего заслона"
 WCG_ADJ: "заслонск."
 WCG_etatism: "Воркерландское управление внешнего заслона"
 WCG_etatism_party: "Главное фильтрационное управление"
 WCG_Edgar_Raut: "Эдгар Раут"
 WCG_Edgar_Raut_desc: "Эдгар Раут никогда не называл себя правителем. Его должность — главный комендант, его столица — цепь штабных вагонов, а его полномочия начинаются там, где заканчивается право человека пройти дальше. Воркерланд поручил ему принимать на себя беженцев, заражённые грузы и всё, что центр не желает видеть у собственных городов."
 WCG_gate_commandant: "Комендант последнего шлюза"
 WCG_gate_commandant_desc: "Раут умеет удерживать линию застав при нехватке людей и снабжения, но рассматривает население как ещё один поток, который следует сортировать и задерживать."
 WCG_living_filter: "Живой фильтр"
 WCG_living_filter_desc: "Каждая дорога превращена в фильтрационный лагерь, каждый склад — в карантинный резерв, а каждый житель обязан одновременно работать и обслуживать кордон. Половину гражданской промышленности и большую часть военных заказов забирает Воркерланд. Оставшаяся экономика задыхается под пропусками, реквизициями и постоянной дозовой ротацией."
