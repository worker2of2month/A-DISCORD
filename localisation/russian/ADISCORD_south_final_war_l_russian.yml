 autonomy_SHL_oil_concession: "Нефтяная концессия домов"
 autonomy_SHL_compact_charter: "Хартия Южного договора"
 autonomy_NAM_namestnik_office: "Наместничество Светлогорья"
 autonomy_NAM_oil_charter: "Член Нефтяной хартии"

 ADISCORD_south_final_war_category: "Война за Юг"
 ADISCORD_south_final_war_category_desc: "§YКРИЗИС ЮГА§!\nСоперник Шахрабада: [ADISCORDSouthNorthSide].\n\n[ADISCORDSouthStatus]"
 ADISCORD_south_north_side_nam: "§YСветлогорье§!"
 ADISCORD_south_north_side_efl: "§YВосстановительный союз Эфлора§!"
 ADISCORD_south_north_side_azh: "§YАжар§!"
 ADISCORD_south_north_side_unknown: "§Rнет§!"
 ADISCORD_south_north_side_nam_plain: "Светлогорье"
 ADISCORD_south_north_side_efl_plain: "Восстановительный союз Эфлора"
 ADISCORD_south_north_side_azh_plain: "Ажар"
 ADISCORD_south_north_side_unknown_plain: "никто"
 ADISCORD_south_status_crisis: "§YЮЖНЫЙ КРИЗИС§!\nПредупреждение начнётся с §Y2165§! года после завершения ключевых фокусов обеими сторонами.\n\n[ADISCORDSouthShlReadiness]\n\n[ADISCORDSouthNorthReadiness]"
 ADISCORD_south_status_war: "§RВОЙНА ЗА ЮГ§!\nСрока у войны нет, и мира вничью не будет. Исход решает только капитуляция лидера одной из сторон.\n\n[ADISCORDSouthStrain]"
 ADISCORD_south_status_no_rival: "У Шахрабада не осталось северного соперника. В конце ближайшего цикла печей он будет признан сюзереном Юга."
 ADISCORD_south_status_closed: "Кризис откроется после исхода ресурсной войны Светлогорья."

 ADISCORD_south_join_shl_tt: "Страна вступает в §YСоюз печей§! или воюет на его стороне до итогового урегулирования."
 ADISCORD_south_join_north_tt: "Страна воюет на стороне [ADISCORDSouthNorthSide] до итогового урегулирования."

 ADISCORD_south_shl_house_contracts: "Наёмные контракты домов"
 ADISCORD_south_shl_house_contracts_desc: "Дома оплачивают войну как сделку: роты нанимаются на выручку будущей нефти, а убытки записываются на счёт победы."
 ADISCORD_south_shl_city_levies: "Городские дружины"
 ADISCORD_south_shl_city_levies_desc: "Каждый город Южного договора выставляет собственную дружину. Они упрямо держат землю, которую считают своей."
 ADISCORD_south_shl_last_pour: "Последняя плавка"
 ADISCORD_south_shl_last_pour_desc: "Дирекция Нура переводит все печи на фронт. Заводы работают без отдыха, а терпение кварталов расходуется так же быстро, как сырьё."
 ADISCORD_south_shl_promised_fiefs: "Обещанные лены"
 ADISCORD_south_shl_promised_fiefs_desc: "Регент раздаёт будущие владения Светлогорья раньше, чем они взяты. Гвардии домов сражаются за свою долю, а государство расплачивается обязательствами."
 ADISCORD_south_shl_oil_uprising: "Восстание нефтяников"
 ADISCORD_south_shl_oil_uprising_desc: "Советы смен зовут нефтяников по ту сторону фронта. Коммуна воюет не за новую границу, а против самой наместнической лестницы."
 ADISCORD_south_shl_campaign_repelled: "Сорванный поход"
 ADISCORD_south_shl_campaign_repelled_desc: "Восстановительный союз удержал земли Светлогорья. Шахрабад считает потери и готовит новый поход."
 ADISCORD_south_nam_emergency_writs: "Чрезвычайные писания"
 ADISCORD_south_nam_emergency_writs_desc: "Наместники получают право мобилизовать округа без обычных согласований. Лестница подписей работает быстрее, но каждый приказ стоит центру политического веса."
 ADISCORD_south_nam_charter_levies: "Хартия против картеля"
 ADISCORD_south_nam_charter_levies_desc: "Районы хартии защищают собственные промыслы. Светлогорье обещает соседям топливо и самоуправление вместо печати сюзерена."
 ADISCORD_south_restitution_line: "Рубеж реституции"
 ADISCORD_south_restitution_line_desc: "Эфлор и Ажар держат бывшие земли Светлогорья. Они способны отразить поход, но не предложить Югу общего порядка."

 ADISCORD_south.1.t: "Юг не делится на двоих"
 ADISCORD_south.1.d_shl_houses: "Конклав десяти подсчитал цену нефти и решил, что дешевле взять промыслы, чем покупать их у наместников. Дома открывают кассы для наёмных рот, Вейр страхует военные грузы, а каждая победа заранее записана в долговые книги.\n\nЭто война за сырьё для печей. Если она закончится успехом, Светлогорье останется на карте - как концессия, работающая на дома."
 ADISCORD_south.1.d_shl_cities: "Совет городов объявляет войну не Светлогорью, а наместнической лестнице. Южный договор обещает районам за линией фронта ту же хартию, которую получили Хазар и Кейзан.\n\nГородские дружины выходят из своих кварталов. Каждый занятый район должен стать новым членом договора, а не новой провинцией."
 ADISCORD_south.1.d_shl_directorate: "Дирекция Нура больше не ведёт переговоров. Военные заказы перекрыли гражданскую выручку, а печи работают на фронт без перерыва.\n\nЖелезный марш идёт к нефтяному поясу. Дирекция обещает Югу один порядок, одну смету и одного распорядителя."
 ADISCORD_south.1.d_shl_regency: "Регент Дарий Сафир собрал гвардии домов под общим знаменем. Будущие владения Светлогорья уже поделены на бумаге, и каждый дом знает, за какую долю ведёт свои роты.\n\nВойна гербов обещает домам землю, а государству - долги, которые придётся платить после победы."
 ADISCORD_south.1.d_shl_commune: "Советы смен посылают через фронт не только дружины, но и листовки. Нефтяники Светлогорья работают на ту же лестницу печатей, от которой коммуна освободила печи Шахрабада.\n\nКоммуна огня зовёт их встать. Эта война должна закончиться не новой границей, а падением наместнической системы."
 ADISCORD_south.1.d_shl_conclave: "Конклав девяти так и не договорился о новом устройстве, но нефтяное эмбарго не стало ждать. Дома, города и дирекция спорят о целях войны уже после её начала.\n\nШахрабад вступает в войну за Юг без единого курса. Исход решат армии."
 ADISCORD_south.1.d_nam_namestniks: "Наместническая лестница требует от печей того же, что и от каждого округа Светлогорья: отчёта, печати и права остановить решение. Шахрабад отказался.\n\nЧрезвычайные писания мобилизуют округа. Если печи падут, их хозяева станут ещё одной ступенью лестницы."
 ADISCORD_south.1.d_nam_charter: "Нефтяная хартия обещала соседям топливо, самоуправление и защиту. Печи Шахрабада предлагают другой порядок - выкуп, долг и монополию.\n\nСветлогорье выступает не за печать над печами, а за то, чтобы на Юге остался один договор. Районы хартии защищают собственные промыслы."
 ADISCORD_south.1.d_nam_directorate: "Светлогорье не успело выбрать собственный путь после ресурсной войны, но пустыни больше не ждут. Канцелярия переводит округа на военный учёт.\n\nНа Юге останется только один сюзерен."
 ADISCORD_south.1.d_restitution: "Шахрабад идёт на земли, которые Эфлор и Ажар отняли у Светлогорья. Восстановительный союз может удержать их, но у него нет плана для всего Юга.\n\nЭто война не за господство, а за выживание. Если рубеж выстоит, печи отступят - до следующего похода."
 ADISCORD_south.1.a: "Юг будет единым."

 ADISCORD_south.2.t: "Война за Юг"
 ADISCORD_south.2.d_nam: "Светлогорье и Шахрабад вступили в открытую войну. Нефтяной пояс и печной округ больше не могут сосуществовать: каждый из претендентов требует, чтобы Юг принял его порядок.\n\nГосударства пустынь не остаются в стороне. Кадир, Рахма, Сардан, Мазар, Кейзан и Вейр выбирают сторону, потому что через их дороги и колодцы проходит единственный путь между фронтами."
 ADISCORD_south.2.d_restitution: "Шахрабад начал поход на бывшие земли Светлогорья, которые удерживают Эфлор и Ажар. Восстановительный союз не претендует на весь Юг, но и не собирается отдавать нефтяной пояс печам.\n\nГосударства пустынь выбирают сторону. Нейтральных дорог больше нет."
 ADISCORD_south.2.a: "Пустыня снова стала фронтом."

 ADISCORD_south.3.t: "Тень над пустыней"
 ADISCORD_south.3.d: "Караваны всё чаще идут под охраной, а цены на топливо и металл растут быстрее, чем их успевают записывать. Светлогорье и Шахрабад обмениваются нотами о пошлинах, эмбарго и праве прохода.\n\nВ столицах пустынь уже не спрашивают, будет ли война за Юг. Там спрашивают, на чьей стороне придётся воевать."
 ADISCORD_south.3.a: "Время на исходе."

 ADISCORD_south.10.t: "Юг требует ответа"
 ADISCORD_south.10.d: "Война за Юг началась. Наши дороги, колодцы и станции стоят между армиями двух претендентов, и ни один из них не признает нашего нейтралитета.\n\nСоюз печей обещает долю в победе Шахрабада. Северный лагерь, который ведёт [ADISCORDSouthNorthSidePlain], требует того же. Кто бы ни победил, Юг после войны будет единым. Остаётся решить, на чьей стороне мы встретим этот мир."
 ADISCORD_south.10.a: "Встать за Шахрабад."
 ADISCORD_south.10.b: "Встать за северный лагерь."

 ADISCORD_south.31.t_shl: "Юг под печами Шахрабада"
 ADISCORD_south.31.t_nam: "Юг под печатью Светлогорья"
 ADISCORD_south.31.d_shl_unopposed: "На севере не осталось ни Светлогорья, ни государств, удержавших его земли. Шахрабад признан сюзереном Юга без последней войны: печи стали единственной силой, способной говорить за пустыни.\n\nСоседи присылают делегации в Хазар. Теперь им предстоит узнать, какой порядок Шахрабад предложит Югу."
 ADISCORD_south.31.d_shl_houses: "Война за Юг завершилась победой Конклава десяти. Северный противник остался на карте как нефтяная концессия домов: его промыслы работают на кассы Шахрабада, а соседи становятся должниками и клиентами картеля.\n\nЗолотые ворота открыты для всего Юга - по цене, которую назначают дома."
 ADISCORD_south.31.d_shl_cities: "Победа Южного договора закончилась не аннексией, а хартиями. Побеждённые сохранили собственные администрации и стали членами договора под защитой Шахрабада.\n\nСовет городов обещает, что Юг будет союзом самоуправляемых общин. Скоро станет ясно, выдержит ли этот союз мирное время."
 ADISCORD_south.31.d_shl_directorate: "Дирекция Нура выиграла войну за Юг и присоединила побеждённых. Нефтяной пояс, станции тракта и колодцы пустынь теперь подчиняются единой смете Шахрабада.\n\nЖелезный марш закончен. Начинается долгая работа по управлению землями, которые не просили этого порядка."
 ADISCORD_south.31.d_shl_regency: "Регентство домов выиграло войну гербов. Побеждённые государства присоединены, а их земли уже обещаны домам как будущие лены.\n\nНаследственная республика стала хозяйкой Юга. Теперь ей придётся расплачиваться по обязательствам, которые помогли победить."
 ADISCORD_south.31.d_shl_commune: "Коммуна огня победила. Наместническая система Светлогорья разрушена, нефтяные промыслы переданы советам смен, а восставшие районы вошли в общую коммуну.\n\nОт Хазара до нефтяного пояса Юг впервые управляется теми, кто работает у печей и скважин."
 ADISCORD_south.31.d_shl_conclave: "Шахрабад стал единственным сюзереном Юга. Конклав девяти присоединил побеждённых, так и не решив, кому достанется власть над новой державой.\n\nСпор о будущем Шахрабада теперь касается всего Юга."
 ADISCORD_south.31.d_nam_namestniks: "Светлогорье выиграло войну за Юг. Шахрабад и его союзники стали наместничествами: каждая печь, каждый колодец и каждая станция теперь отчитываются перед лестницей печатей.\n\nНаместническая система, которую когда-то навязала империя, стала порядком всего Юга."
 ADISCORD_south.31.d_nam_charter: "Нефтяная хартия победила. Шахрабад и его союзники сохраняют собственные администрации, но входят в хартию под защитой Светлогорья и зависят от его топлива.\n\nСоседи, ещё недавно воевавшие друг с другом, теперь подписывают один договор."
 ADISCORD_south.31.d_nam_directorate: "Светлогорье выиграло войну за Юг. Побеждённые стали его сателлитами, а нефтяной пояс - центром нового южного порядка.\n\nКакой будет этот порядок, ещё предстоит решить."
 ADISCORD_south.31.a: "У Юга есть сюзерен."

 ADISCORD_south.32.t: "Рубеж реституции устоял"
 ADISCORD_south.32.d: "Поход Шахрабада на бывшие земли Светлогорья остановлен. Эфлор и Ажар сохранили нефтяной пояс, но сами не способны объединить Юг.\n\nПечи вновь подсчитывают потери. Кризис не закончен, и новый поход потребует повторного предупреждения о войне."
 ADISCORD_south.32.a: "Война лишь отложена."
 ADISCORD_south_offer_submit_accept_tt: "Мы станем сателлитом §Y[FROM.GetName]§!."
 ADISCORD_south_offer_annex_accept_tt: "Наша страна войдёт в состав §Y[FROM.GetName]§! вместе с армией."
 ADISCORD_south_offer_alliance_accept_tt: "Мы вступим в союз §Y[FROM.GetName]§!."
 ADISCORD_south_offer_war_refuse_tt: "§Y[FROM.GetName]§! объявит нам войну за полное присоединение."
 ADISCORD_south_offer_alliance_refuse_tt: "Мы останемся вне союза. Войны не будет."
 ADISCORD_south_offer_alliance_switch_accept_tt: "Мы покинем нынешний союз и вступим в союз §Y[FROM.GetName]§!. Прежние союзники останутся без нас, но войны с ними это не начнёт."
 ADISCORD_south_offer_war_refuse_faction_tt: "§Y[FROM.GetName]§! объявит нам войну за полное присоединение. Наши союзники по фракции вступят в неё на нашей стороне. Проигравшая сторона будет присоединена победителем после капитуляции последнего своего участника."
 ADISCORD_south.40.d_alliance_switch: "[FROM.GetNameDefCap] предлагает нам сменить союз. Посланники обещают защиту, выгодную торговлю и место в будущем порядке Юга, если мы оставим нынешних союзников и встанем рядом с ними.\n\nОтказ не приведёт к войне сейчас: мы останемся в прежнем союзе. Но когда начнётся война за Юг, выбирать сторону всё равно придётся."
 ADISCORD_south.40.t_submit: "Требование покорности"
 ADISCORD_south.40.t_annex: "Требование присоединения"
 ADISCORD_south.40.t_alliance: "Приглашение в союз"
 ADISCORD_south.40.d_submit_shl: "Посланники Шахрабада привезли не ноту, а счёт. Дома перечисляют долги, пошлины и права, которые они считают своими, и предлагают простой выход: наша страна станет их сателлитом, а торговля пойдёт через Золотые ворота.\n\nОтказ означает войну. Армии печей уже стоят у наших дорог."
 ADISCORD_south.40.d_submit_shl_charter: "Совет городов Шахрабада предлагает нам хартию Южного договора. Мы сохраним собственную администрацию, но станции тракта и внешняя политика перейдут под защиту договора.\n\nДоговор не скрывает, что отказ не будет принят. Его дружины готовы освободить дорогу силой."
 ADISCORD_south.40.d_submit_nam_namestnik: "Из Светлогорья прибыл чиновник с печатью и готовым указом о назначении наместника. Наша администрация останется на местах, но каждое её решение будет подниматься по лестнице подписей.\n\nОтказ светлогорская канцелярия называет мятежом. Её армия готова его подавить."
 ADISCORD_south.40.d_submit_nam_charter: "Светлогорье предлагает нам вступить в Нефтяную хартию: топливо по договорной цене, собственная администрация и защита союза в обмен на подчинение общей внешней политике.\n\nПредложение сопровождается войсками у границы. Хартия считает отказ угрозой для всех её членов."
 ADISCORD_south.40.d_annex: "Шахрабад больше не предлагает союзов и протекторатов. Дирекция Нура требует, чтобы наша страна вошла в его состав: администрация станет частью единой сметы, армия - частью его армии.\n\nЕсли мы откажемся, железный марш пойдёт через наши земли."
 ADISCORD_south.40.d_alliance_shl: "Шахрабад приглашает нас в свой союз. Вступление обещает защиту печей и долю в будущем порядке Юга, но втянет нас в войну, которая неизбежно начнётся между Шахрабадом и Светлогорьем.\n\nОтказ не приведёт к войне сейчас. Но когда она начнётся, нам всё равно придётся выбирать сторону."
 ADISCORD_south.40.d_alliance_nam: "Светлогорье приглашает нас в свой союз. Нефтяная хартия обещает топливо, защиту и право самим управлять своими делами, но её члены пойдут вместе со Светлогорьем в войну за Юг.\n\nОтказ не приведёт к войне сейчас. Но когда она начнётся, нам всё равно придётся выбирать сторону."
 ADISCORD_south.40.a: "Принять."
 ADISCORD_south.40.b: "Отказать."
 ADISCORD_south.42.t: "Наши условия приняты"
 ADISCORD_south.42.d: "[FROM.GetNameDefCap] принимает наше предложение. Ещё одна часть Юга будет стоять на нашей стороне, когда начнётся последняя война."
 ADISCORD_south.42.a: "Юг собирается вокруг нас."
 ADISCORD_south.43.t: "Наши условия отвергнуты"
 ADISCORD_south.43.d:0 "[FROM.GetNameDefCap] отвергает наше предложение. Если мы требовали покорности или присоединения, армия уже получила приказ. Если мы звали в союз, этот вопрос решит война за Юг."
 ADISCORD_south.43.a: "Они пожалеют о своём выборе."
 ADISCORD_south.44.t: "Подполье осталось без опоры"
 ADISCORD_south.44.d: "Светлогорье заключило с районами договор, и рабочие округа больше не хотят восстания. Подпольщики Ярослава Вебера вернули часть оружия, которое коммуна переправила через пустыню.\n\nВойна за Юг начнётся без восстания в тылу противника."
 ADISCORD_south.44.a: "Значит, мы освободим их сами."
 ADISCORD_south.45.t: "Восстание в Светлогорье"
 ADISCORD_south.45.d: "В первый день войны за Юг нефтяники Светлогорского округа подняли восстание. Ярослав Вебер вывел подпольщиков из рабочих кварталов с винтовками, переправленными коммуной Шахрабада.\n\nСветлогорье вынуждено воевать на два фронта: против печей на юге и против собственных промыслов в тылу."
 ADISCORD_south.45.a: "Огонь дошёл до скважин."
 ADISCORD_south_status_resolved: "Война за Юг окончена. У региона один сюзерен."

 ADISCORD_south_preparation: "Последние приготовления к войне за Юг"
 ADISCORD_south_preparation_desc: "Штабы заканчивают развёртывание, послы сворачивают переговоры, а пограничные гарнизоны получают запечатанные приказы."
 ADISCORD_south_preparation_ready_tt: "Наступил 2165 год; обе стороны завершили ключевые фокусы подготовки. Перечень и готовность сторон показаны в разделе войны за Юг."
 ADISCORD_south_status_return: "§YВОЗВРАЩЕНИЕ СВЕТЛОГОРЬЯ§!\nОбщая южная кампания и новые требования о подчинении ждут завершения возвращения и дальнейшей кампании изгнания. Подготовка к общей войне возобновится после завершения этой кампании."
 ADISCORD_south_status_preparation: "§YПОДГОТОВКА К ВОЙНЕ ЗА ЮГ§!\nНачало возможно с §Y2165§! года после ключевых фокусов обеих сторон. Затем даётся §Y56§! дней на развёртывание. Затянувшаяся подготовка сдвигает войну позже.\n\n[ADISCORDSouthShlReadiness]\n\n[ADISCORDSouthNorthReadiness]\n\nГотовность проверяется раз в 28 дней. Во время предупреждения можно завершить наступательный фокус; объявление войны дождётся общего срока."
 ADISCORD_south.40.closed: "Сначала необходимо пересмотреть обстоятельства переговоров."
 ADISCORD_south.32.d_nam: "Светлогорье и Шахрабад прекращают поход, не добившись решающего перевеса. Ключевые районы не дали ни одной стороне основания объявить себя хозяином Юга.\n\nВойска возвращаются за довоенные рубежи. Мир не устанавливает гегемона и не передаёт земли проигравшего. Обе стороны получают время на восстановление перед новым столкновением."

 ADISCORD_south_story_ready_tt: "Кампания изгнания завершена: победа в возвращении, а затем победа в великой войне либо отсутствие оставшихся противников."

 ADISCORD_south_warning_elapsed_tt: "После предупреждения о войне прошло 56 дней."

 ADISCORD_south_warning_notice_tt: "Война за Юг сможет начаться через 56 дней. Отсчёт показан в соответствующем разделе решений. При завершённом наступательном фокусе приказ исполняется после 56 дней; без приказов автоматическое нападение ждёт ещё 28 дней."

 ADISCORD_south_status_warning: "§RПРЕДУПРЕЖДЕНИЕ О ВОЙНЕ§!\nОбе стороны завершили подготовку. До конца §Y56§!-дневного предупреждения война закрыта для всех. Остаток срока показан в миссии. Затем нападение возможно на ближайшем цикле печей; действующие войны и незавершённая кампания возвращения продолжают блокировать начало. При завершённом наступательном фокусе приказ исполняется после 56 дней; без приказов автоматическое нападение ждёт ещё 28 дней."

 ADISCORD_south_shl_ready: "§GШахрабад готов.§! Ключевые фокусы промышленности и армии завершены."

 ADISCORD_south_shl_pending: "§YШахрабад готовится.§! Требуются все три фокуса: $SHL_conclave_rules$, $SHL_metal_market$ и $SHL_conclave_army$. Политический курс выбирается свободно."

 ADISCORD_south_north_ready: "§GСеверная сторона готова.§! Светлогорье завершило фокусы своего пути; для Эфлора или Ажара достаточно урегулированной ресурсной войны."

 ADISCORD_south_north_pending:0 "§YСветлогорье готовится.§!\n- Победа в ресурсной войне: $NAM_svetlogorye$, $NAM_oil_exchange$, $NAM_pw_transport_commission$, $NAM_pw_southern_army$ и $NAM_pw_freight_schedule$. Для итоговых фокусов нужны выбранные армейский и транспортный курсы, действующий узел снабжения и материальный резерв.\n- Этатисты: также $NAM_ladder_of_seals$ и $NAM_south_desert_offices$.\n- Гуманисты: также $NAM_common_fuel_market$ и $NAM_south_fenn_guarantee$.\n- Прагматисты: также $NAM_balanced_accounts$ и $NAM_prag_partner_supply$.\n- Компромисс: $NAM_defeat_rump_cabinet$, $NAM_defeat_harbour_economy$ и $NAM_defeat_road_south$.\n- Реванш: $NAM_defeat_revenge$ и $NAM_defeat_second_chapter$.\n- Изгнание: $NAM_rad_great_war_plan$, $NAM_hum_union_call$ или $NAM_board_stock_mobilisation$; войны возвращения завершены.\n- Ресурсная война отменена: $NAM_seal_courts$, $NAM_civilian_combine$ и $NAM_officer_courses$."
 ADISCORD_south_offensive_policy_tt:0 "Курс страны допускает наступление на юг."
 autonomy_NAM_economic_contract:0 "Участник экономического договора"
 ADISCORD_south_nam_contract_logistics:0 "Договорное снабжение"
 ADISCORD_south_nam_contract_logistics_desc:0 "Расчётные обязательства объединяют порт, транспортные компании и снабженцев общей кампании."
 ADISCORD_south.1.d_nam_contracts:0 "Совет Светлогорска объявил, что южные обязательства больше нельзя защищать одними письмами. Торговые пути, залоги и поставки зависят от правительства, которое не считает себя связанным заключёнными договорами. Военные приготовления теперь стали открытой политикой.\n\nРом и советники говорят о порядке расчётов, а штаб отмечает на карте переправы и склады. После победы новые участники сохранят свои управления и армии, но примут общие хозяйственные условия и ответственность за безопасность договора."
 ADISCORD_south.31.d_nam_contracts:0 "Южная кампания закончилась подписанием экономических договоров под первенством Светлогорска. Местные управления остались на своих местах; армии получат приказы от собственных штабов. Новые комиссии распределяют гражданские заказы и закрепляют торговые права победителя.\n\nПредставители Светлогорья называют этот порядок общностью обязательств. Для участников он означает конец самостоятельного выбора стороны в следующей большой войне, но не роспуск собственного государства."
 ADISCORD_south.40.t_contract:0 "Предложение расчётного договора"
 ADISCORD_south.40.d_contract:0 "Посланники Светлогорска предлагают включить нашу страну в общую систему расчётов. Они не требуют распускать правительство или передавать армию чужим командирам. Вместо этого договор определит хозяйственные обязательства перед Светлогорьем и общую сторону в южном противостоянии.\n\nСовет оставляет нам право отказаться без войны из-за этого ответа. Подпись, однако, будет означать действительную зависимость: наши внешние решения станут частью общего договора, а выход из прежнего союза придётся оформить до вступления новых условий в силу."
 ADISCORD_south_offer_contract_accept_tt:0 "Мы станем зависимым участником экономического договора со Светлогорьем. Сохраним правительство и армию; передадим 15% гражданских заводов, предоставим +60% дополнительной торговли и -20% стоимости торговли сюзерену. Люди и военные заводы не передаются. Прежний союз будет покинут; в южной войне мы обязаны поддержать сторону Светлогорья."
 ADISCORD_south_offer_contract_refuse_tt:0 "Договор не будет заключён. Отказ не начинает войну и не выводит нас из нынешнего союза."
 ADISCORD_south.43.d_contract:0 "[FROM.GetNameDefCap] отказывается от экономического договора. Посланники возвращают неподписанный проект; торговые дома пока продолжат работать по прежним соглашениям. Военного приказа за этим отказом не последует."
 ADISCORD_south_preparation_timeout_tt:0 "Срок предупреждения истекает. Если условия войны сохраняются, на очередной проверке будет исполнен подготовленный приказ Светлогорья, иначе - приказ Шахрабада.\nБез приказа Шахрабад начинает войну после §Y84§! £time_texticon дн. от предупреждения. Проверки проходят раз в §Y28§! £time_texticon дн.\nПо-прежнему нужны готовность обеих сторон, допустимый наступательный курс и действующий южный кризис. Отмена предупреждения не даёт награды и не накладывает штрафа."
 ADISCORD_south_strain_none:0 ""
 ADISCORD_south_strain_low:0 "Цена войны: §Y[?ADISCORD_south_war_strain|0]§!/100 - тыл держится."
 ADISCORD_south_strain_mid:0 "Цена войны: §Y[?ADISCORD_south_war_strain|0]§!/100 - §Yкварталы устают от войны.§!"
 ADISCORD_south_strain_high:0 "Цена войны: §R[?ADISCORD_south_war_strain|0]§!/100 - §Rтыл на грани, будут серьёзные последствия.§!"
 ADISCORD_south_strain_crisis:0 "Цена войны: §R[?ADISCORD_south_war_strain|0]§!/100 - §Rтыл не выдерживает.§!"
 ADISCORD_south_war_strain_dynamic:0 "Цена войны"
 ADISCORD_south_district_order:0 "Приказ: взять [FROM.GetName]"
 ADISCORD_south_district_order_desc:0 "Штабные офицеры раскладывают на столе карту района и чертят стрелки к его станциям и перекрёсткам. Приказ уйдёт в войска с датой, которую уже никто не вправе перенести."
 ADISCORD_south_cost_district_order:0 "§Y50§! £political_power_texticon §Y25§! £command_power_texticon"
 ADISCORD_south_cost_district_order_blocked:0 "§R50§! £political_power_texticon §R25§! £command_power_texticon"
 ADISCORD_south_cost_district_order_tooltip:0 "§Y50§! £political_power_texticon §Y25§! £command_power_texticon"
 ADISCORD_south_order_slot_free_tt:0 "Нет действующего приказа на район"
 ADISCORD_south_district_order_mission:0 "Приказ: взять [?ADISCORD_south_order_state.GetName]"
 ADISCORD_south_district_order_mission_desc:0 "Курьеры развезли приказ по штабам дивизий. Каждый вечер штаб отмечает на карте, куда дошли колонны, и каждый вечер до срока остаётся на день меньше."
 ADISCORD_south_order_taken_tt:0 "Район §Y[?ADISCORD_south_order_state.GetName]§! контролирует наша сторона"
 ADISCORD_south_order_success_strain_tt:0 "Цена войны: §G-8§!"
 ADISCORD_south_order_failure_strain_tt:0 "Цена войны: §R+4§!"
 ADISCORD_south_campaign_over_tt:0 "Война за Юг окончена"
 ADISCORD_south_hold_districts:0 "Держать районы"
 ADISCORD_south_hold_districts_desc:0 "Каждый ключевой район, который ещё держит наша сторона, - это станции, склады и тысячи людей, которые смотрят, устоит ли фронт. Штаб требует от гарнизонов одного: не отдать ни одной улицы."
 ADISCORD_south_hold_next_tt:0 "Пока идёт война, новый срок удержания начнётся в течение §Y28§! £time_texticon дн."
 ADISCORD_south_hold_all_tt:0 "Враг не занимает ни одного нашего ключевого района"
 ADISCORD_south_hold_one_lost_tt:0 "Враг занимает один наш ключевой район"
 ADISCORD_south_hold_all_strain_tt:0 "Цена войны: §G-6§!"
 ADISCORD_south_order_failed:0 "Сорванный приказ"
 ADISCORD_south_order_failed_desc:0 "Колонны не дошли до назначенного района к сроку. В штабе ищут виноватых, а в окопах уже говорят, что приказы пишут люди, которые не видели фронта."
 ADISCORD_south_crisis_crackdown_strain_tt:0 "Цена войны: §G-25§!"
 ADISCORD_south_crisis_stores_strain_tt:0 "Цена войны: §G-35§!"
 ADISCORD_south.50.t:0 "Тыл не выдерживает"
 ADISCORD_south.50.d_shl:0 "Утром кварталы плавильщиков не вышли к печам. У ворот литейных дворов стоят жёны рабочих с похоронными листами, и стража не решается их разогнать. В казармах шепчутся, что следующей колонной на север отправят их самих.\n\nГербы требуют от конклава ответа до вечера: порядок или хлеб."
 ADISCORD_south.50.d_north:0 "Очередь у пункта выдачи пайков растянулась на три квартала, а к полудню превратилась в толпу. На промыслах встали насосы: бригады отказываются работать, пока им не скажут, когда кончится война.\n\nНаместники округов шлют в столицу телеграмму за телеграммой и спрашивают, кого из них поддержат войска."
 ADISCORD_south.50.a:0 "Ввести войска в кварталы."
 ADISCORD_south.50.b:0 "Открыть армейские склады."
 ADISCORD_south_request_expedition:0 "Экспедиция союзника: [FROM.GetName]"
 ADISCORD_south_request_expedition_desc:0 "Гонец уезжает к союзному двору с письмом и печатью штаба. В письме нет угроз, только счёт войны: сколько людей уже отдано и сколько ещё понадобится, прежде чем враг отступит."
 ADISCORD_south_court_defector:0 "Склонить к измене: [FROM.GetName]"
 ADISCORD_south_court_defector_desc:0 "Через нейтральных купцов и пленных офицеров к вражескому двору уходит тихое предложение. Там считают потери и смотрят на карту, где фронт подходит всё ближе к их собственной столице."
 ADISCORD_south_cost_expedition:0 "§Y50§! £political_power_texticon §Y120§! £ADISCORD_economy_treasury_texticon"
 ADISCORD_south_cost_expedition_blocked:0 "§R50§! £political_power_texticon §R120§! £ADISCORD_economy_treasury_texticon"
 ADISCORD_south_cost_expedition_tooltip:0 "§Y50§! £political_power_texticon §Y120§! £ADISCORD_economy_treasury_texticon\nЦена вернётся, если союзник откажет или не ответит."
 ADISCORD_south_cost_defector:0 "§Y80§! £political_power_texticon"
 ADISCORD_south_cost_defector_blocked:0 "§R80§! £political_power_texticon"
 ADISCORD_south_cost_defector_tooltip:0 "§Y80§! £political_power_texticon\nЦена вернётся, если предложение отвергнут или оставят без ответа."
 ADISCORD_south_request_slot_free_tt:0 "Прежний запрос уже получил ответ"
 ADISCORD_south_ally_can_send_tt:0 "У союзника есть §Y9000§! £manpower_texticon и §Y1500§! £infantry_equipment_texticon"
 ADISCORD_south_defector_wavering_tt:0 "Столицу противника контролирует наша сторона, или его поддержка войны ниже §Y30%§! (§Y40%§! после жёсткой политики в пустыне)"
 ADISCORD_south_expedition_request_tt:0 "Союзник получит запрос. Если он согласится, то отдаст §Y3000§! £manpower_texticon и §Y500§! £infantry_equipment_texticon за каждую дивизию, а у нашей столицы встанут §Y2§! дивизии шаблона \"Desert Expedition\" (§Y3§! после фокуса о поддержке пустыни). Они прибудут с людьми и винтовками союзника; остальное снаряжение и пополнение дадут наши склады.\nПри отказе или без ответа цена вернётся."
 ADISCORD_south_defector_request_tt:0 "Противник получит предложение. Если он согласится, то заключит мир с нашей стороной и вступит в нашу войну против своего прежнего лидера. Главная война продолжится.\nПри отказе или без ответа цена вернётся."
 ADISCORD_south_expedition_refuse_tt:0 "Наши люди и оружие останутся дома. Запросившая сторона получит свою плату назад."
 ADISCORD_south_expedition_send_tt:0 "Мы отдадим §R3000§! £manpower_texticon и §R500§! £infantry_equipment_texticon за каждую дивизию экспедиции, их будет §Y2§! или §Y3§!."
 ADISCORD_south_defector_refuse_tt:0 "Мы останемся в прежнем союзе."
 ADISCORD_south_defector_accept_tt:0 "Мы заключим мир со стороной, которую ведёт [FROM.GetName], выйдем из прежнего союза и вступим в войну против прежнего лидера."
 ADISCORD_south.60.t:0 "Просьба о войсках"
 ADISCORD_south.60.d:0 "Из союзного штаба прибыл посланник с письмом под печатью. [FROM.GetNameDefCap] просит не денег и не топлива, а людей: батальоны, которые встанут рядом с его колоннами на главном фронте. Наши командиры спорят до полуночи. Одни говорят, что без этой помощи союзник не удержит линию, другие считают, сколько семей останется без сыновей."
 ADISCORD_south.60.a:0 "Наши люди нужны дома."
 ADISCORD_south.60.b:0 "Собрать экспедицию."
 ADISCORD_south.61.t:0 "Экспедиция прибыла"
 ADISCORD_south.61.d:0 "Колонны союзника входят в нашу столицу на рассвете. Солдаты в пыльных шинелях несут собственные знамёна, а их офицеры первым делом спрашивают, где штаб и куда идти дальше."
 ADISCORD_south.61.a:0 "Им найдётся место на фронте."
 ADISCORD_south.62.t:0 "Экспедиции не будет"
 ADISCORD_south.62.d:0 "Гонец возвращается с вежливым письмом. [FROM.GetNameDefCap] сожалеет, но не может отпустить людей: свои границы, свои потери, свои матери у ворот. Казначеи молча возвращают задаток в сундуки."
 ADISCORD_south.62.a:0 "Справимся сами."
 ADISCORD_south.63.t:0 "Тайное предложение"
 ADISCORD_south.63.d:0 "Через пленного офицера к нам пришло предложение. [FROM.GetNameDefCap] обещает нам мир, если мы повернём оружие против прежнего союзника. В зале совета никто не произносит слово \"измена\" вслух. Все смотрят на карту, на линию фронта у наших ворот и на пустые места за столом."
 ADISCORD_south.63.a:0 "Мы не предадим союз."
 ADISCORD_south.63.b:0 "Принять мир и сменить сторону."
 ADISCORD_south.64.t:0 "Перебежчик"
 ADISCORD_south.64.d:0 "[FROM.GetNameDefCap] отзывает своих послов из вражеского штаба и открывает нам дороги через свою землю. Вчерашний противник ещё не стал другом, но его колонны уже развёрнуты в другую сторону."
 ADISCORD_south.64.a:0 "Враг стал меньше на одну страну."
 ADISCORD_south.65.t:0 "Предложение отвергнуто"
 ADISCORD_south.65.d:0 "Пленный офицер возвращается без ответа, а через неделю его имя появляется в списке казнённых. [FROM.GetNameDefCap] держится прежнего союза, и разговор о мире придётся вести иначе."
 ADISCORD_south.65.a:0 "Значит, решит фронт."
