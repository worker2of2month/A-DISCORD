 ADISCORD_south_map_heading:0 "§YЗОНЫ ВЛИЯНИЯ НА ЮГЕ§!"
 ADISCORD_south_map_legend:0 "Оранжевый - Шахрабад; синий - север.\nТёмный - лидер; светлый - союзники.\nСерый - вне лагерей; штрихи - чужой контроль."
 ADISCORD_south_map_readiness:0 "[ADISCORDSouthMapPhase]\n§YОбстановка и подготовка: наведите курсор§!"
 ADISCORD_south_map_rules_tt:0 "§YКарта Юга§!\nТёмно-оранжевый - сам Шахрабад; светло-оранжевый - его союзники и зависимые страны. Тёмно-синий - северный лидер; светло-синий - его союзники и зависимые страны. Серый - страны вне этих лагерей.\nДо войны цвет учитывает сюзерена и альянс текущего владельца. Во время войны - выбранную сторону фактического контролёра. Тёмный оттенок получает только страна, возглавляющая лагерь. После мира карта отражает новые границы и подчинение.\nШтриховка отмечает области, чей контролёр отличается от владельца. Наведите курсор на область или флаг для подробностей."
 ADISCORD_south_map_status_tt:0 "Северный претендент: [ADISCORDSouthNorthSide]\n\n[ADISCORDSouthStatus]"
 ADISCORD_south_map_shl:0 "§YСоюзник или зависимая страна Шахрабада§!"
 ADISCORD_south_map_north:0 "§CСоюзник или зависимая страна северного лидера§!"
 ADISCORD_south_map_shl_leader:0 "§YШахрабад - лидер лагеря§!"
 ADISCORD_south_map_north_leader:0 "§CЛидер северного лагеря§!"
