l_russian:
 upgrade_economy_civilian: "Хозяйственное досье"
 upgrade_economy_civilian_desc: "За колонками ведомостей скрываются маршруты сырья, запасы заводов и настоящая цена чужих амбиций."
 upgrade_army_department: "Полевая разведка"
 upgrade_army_department_desc: "Донесения наблюдателей и захваченные карты складываются в картину чужого фронта."
 upgrade_naval_department: "Портовый дозор"
 upgrade_naval_department_desc: "Портовые связные узнают о выходе корабля раньше, чем его силуэт исчезнет за горизонтом."
 upgrade_airforce_department: "Небесный дозор"
 upgrade_airforce_department_desc: "Посты наблюдения сводят воедино следы самолётов, работу аэродромов и эфирные переговоры."
 upgrade_passive_defense: "Особый отдел"
 upgrade_passive_defense_desc: "Чужая агентура оставляет следы в пропусках, разговорах и слишком удачных совпадениях."
 upgrade_anti_partisan: "Реестр подполья"
 upgrade_anti_partisan_desc: "Имена, адреса и связи превращают разрозненные слухи в карту тайных ячеек."
 upgrade_blueprint_stealing: "Техническое бюро"
 upgrade_blueprint_stealing_desc: "Чужие чертежи проходят долгий путь от заводского сейфа до стола наших инженеров."
 upgrade_portable_radios: "Полевая связь"
 upgrade_portable_radios_desc: "Компактная рация связывает резидентуру с центром даже там, где молчат обычные линии."
 upgrade_invisible_ink: "Тайная переписка"
 upgrade_invisible_ink_desc: "Обычное письмо может нести второй смысл, доступный лишь подготовленному адресату."
 upgrade_plastic_explosives: "Арсенал диверсий"
 upgrade_plastic_explosives_desc: "Специалисты готовят снаряжение для работы на чужих коммуникациях и промышленных объектах."
 upgrade_suicide_pills: "Последний протокол"
 upgrade_suicide_pills_desc: "Перед выходом агент получает запечатанный комплект и указания на случай безвыходного положения."
 upgrade_training_centers: "Школа резидентов"
 upgrade_training_centers_desc: "Будущие резиденты учатся жить под чужим именем, понимать местные привычки и хранить свою легенду."
 upgrade_commando_training: "Курс проникновения"
 upgrade_commando_training_desc: "Инструкторы учат проходить оцепление, двигаться по чужой территории и возвращаться незамеченными."
 upgrade_interrogation_techniques: "Следственное бюро"
 upgrade_interrogation_techniques_desc: "Протоколы, найденные документы и показания проверяются до тех пор, пока не складываются в одну историю."
 upgrade_diplo_training: "Служба переговоров"
 upgrade_diplo_training_desc: "Умение слушать за закрытыми дверями порой открывает больше, чем официальный мандат."
 upgrade_psycho_warfare: "Бюро влияния"
 upgrade_psycho_warfare_desc: "Радиопередачи, листовки и нужные слухи постепенно меняют то, во что верит чужая улица."
 upgrade_form_department: "Шифровальное бюро"
 upgrade_form_department_desc: "Отдельная служба принимает перехваты, ведёт ключевые книги и хранит язык секретной переписки."
 upgrade_decryption_boost: "Разбор сигналов"
 upgrade_decryption_boost_desc: "Среди помех и повторяющихся групп аналитики ищут привычки чужих радистов и закономерности шифра."
 upgrade_decryption_boost_2: "Счётные машины"
 upgrade_decryption_boost_2_desc: "Ряды реле и вращающиеся барабаны берут на себя монотонную работу с перехваченными сообщениями."
 upgrade_crypto_strength: "Смена шифров"
 upgrade_crypto_strength_desc: "Новые ключевые таблицы расходятся по резидентурам в запечатанных пакетах."
 upgrade_crypto_strength_2: "Закрытые каналы"
 upgrade_crypto_strength_2_desc: "Защищённые линии и строгий порядок обращения с ключами соединяют службу в единую сеть."
