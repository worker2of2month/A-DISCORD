l_russian:

 # Narrative overrides for the Stelander crisis chain.
 # Mechanical timings and requirements remain in the existing missions and tooltips.

 ADISCORD_STP_preparation.1.t: "Когда дверь закрылась"
 ADISCORD_STP_preparation.1.d: "Доклад о положении республики шёл по привычному сценарию. Иванов сидел у карты, министры по очереди называли цифры, секретарь перекладывал папки слева направо. На середине доклада президент попросил повторить уже прочитанный абзац. Через несколько минут он потерял строку снова. Врач подошёл к столу и впервые не стал ждать разрешения.\n\nОставшиеся встречи отменили. Министров попросили выйти в соседний зал, а двери президентского кабинета закрылись. Хедерсетт почти сразу велел канцелярии направлять текущие бумаги через кабинет министров. Он говорил тихо, словно речь шла о временной перестановке в расписании.\n\nШабрат появился в коридоре до того, как успели разойтись последние чиновники. Под мышкой у него была папка без герба и регистрационного номера. Он просил десять минут наедине с Ивановым. Хедерсетт ответил, что президенту нужен покой. Никто из присутствующих не поверил, что спор идёт о здоровье.\n\nДо сегодняшнего дня государство могло делать вид, что наверху ничего не изменилось. Теперь даже право открыть одну дверь означало право говорить от имени будущего Стеландера."
 ADISCORD_STP_preparation.1.a: "Впустить Шабрата."
 ADISCORD_STP_preparation.1.b: "Кабинет должен удержать управление."

 ADISCORD_STP_preparation.3.t: "Последняя подпись"
 ADISCORD_STP_preparation.3.d: "Последний документ Пётр Иванов подписал вечером. Подпись вышла неровной, и секретарь на секунду задержал лист, будто собирался попросить президента расписаться ещё раз. Потом передумал.\n\nК утру кабинет был закрыт. Врачи вышли первыми. Следом появился Хедерсетт и попросил начальника канцелярии подготовить обращение к стране. Никаких торжественных слов он не предложил. Пётр Иванов, человек, с которым несколько поколений связывали окончание войны, умер ночью.\n\nНовость разошлась быстрее официального сообщения. У памятников начали появляться цветы. В горных округах звонили старые колокола. В министерствах чиновники продолжали ставить на документы печать с именем человека, которого уже не было в живых. Никто пока не знал, чем её заменить.\n\nХедерсетт принял текущие дела и созвал выборы нового председателя. Шабрат потребовал открыть процедуру для окружных делегатов и армии. Партийный аппарат начал проверять списки, гарнизоны и полномочия комиссий. Страна получила срок, в который ей предстояло решить вопрос, откладывавшийся весь мир Иванова: кому принадлежит власть после человека, на котором она держалась."
 ADISCORD_STP_preparation.3.a: "Страна проснулась без Иванова."

 ADISCORD_STP_preparation.4.t: "Оспоренный протокол"
 ADISCORD_STP_preparation.4.d: "Подсчёт закончили глубокой ночью. Последние листы внесли в протокол, печати проверили дважды, представители округов поставили подписи. Затем секретарь передал документ проигравшей стороне.\n\nПодписи не последовало.\n\nСначала спорили о нескольких мандатах. Потом о праве комиссии считать их действительными. Потом о том, имеет ли сам съезд право передавать страну человеку, которого часть армии не признаёт. Пока юристы спорили в зале, из гарнизонов уже приходили запросы, чьи распоряжения считать законными.\n\nВнешняя война успела изменить карту быстрее, чем канцелярия меняла положения о выборах. Некоторые администрации больше не контролировали территории, от имени которых голосовали. Некоторые части уже получали два взаимоисключающих приказа. Повторного голосования не будет.\n\nК рассвету стало ясно, что спор идёт уже не о протоколе. Бумага лишь зафиксировала момент, когда одна страна начала признавать две разные власти."
 ADISCORD_STP_preparation.4.a: "Протокол больше не был просто бумагой."

 ADISCORD_STP_preparation.19.t: "Повестки"
 ADISCORD_STP_preparation.19.d: "Первые повестки разнесли ещё до официального объявления о призыве. В почтовых отделениях их складывали рядом со счетами за электричество и рекламой курортов. В графе причины стояло нейтральное выражение: «проверка готовности резерва».\n\nНа вокзалах появились мужчины со старыми армейскими сумками. Одни служили ещё в последние годы войны, другие впервые примеряли форму. Командиры говорили о защите складов, мостов и административных зданий. На вопрос, от кого именно их предстоит защищать, отвечали одинаково: решение ещё не принято.\n\nНа складах тем временем уже считали винтовки. Представители партии проверяли списки офицеров. Люди Шабрата искали тех, кто согласится не выполнять приказ против собственного округа. Государство всё ещё называло себя мирным, но впервые со времён Фадского пакта оно собирало резерв не против внешней армии.\n\nБольшинство призванных пока не принадлежало ни одной стороне. Именно поэтому каждая сторона спешила первой объяснить им, что значит служить Стеландеру."
 ADISCORD_STP_preparation.19.a: "Армия готовилась к вопросу, которого ещё не задали."

 ADISCORD_STP_preparation.6.t: "Посланник Шабрата"
 ADISCORD_STP_preparation.6.d: "Посланник прибыл без дипломатического кортежа и попросил встречи не с министром, а с управлением контрактных сил. Он положил на стол одну папку. Внутри находился точный перечень людей, вооружения и транспорта, необходимого для трёх усиленных дивизий.\n\nПросьба была необычно прямой. Шабрат не требовал вступления Кефрейта в войну и не предлагал территорию. Части должны перейти под его командование только после открытого раскола Стеландера, а затем вернуться домой. Юристы несколько раз перечитали условия, пытаясь найти скрытое обязательство. Его не было.\n\nВоенные видели в документе другое. Если Стеландер развалится, три готовые дивизии могут решить больше, чем месяцы дипломатии. А первый принятый запрос почти неизбежно создаст второй. Кефрейт редко инвестирует в чужую войну ради благодарности, но иногда достаточно получить право присутствовать за столом, когда победитель начнёт считать долги."
 ADISCORD_STP_preparation.6.a: "Подготовить контингент."
 ADISCORD_STP_preparation.6.b: "Не связывать Кефрейт с чужим кризисом."

 ADISCORD_STP_preparation.8.t: "Ответ Кефрейта"
 ADISCORD_STP_preparation.8.accepted: "Ответ пришёл на плотной бумаге без приветствия. Запрос принят. Людей вывели из текущего резерва, технику начали собирать на отдельных складах, а штаб получил приказ держать соединения вне публичных списков до раскола Стеландера.\n\nВ конце стояла одна строка: «Передача командования состоится при наступлении согласованных обстоятельств». Для Кефрейта этого было достаточно."
 ADISCORD_STP_preparation.8.pending: "Кефрейт согласился помочь, но его интенданты вернули заявку с отметкой о неполной комплектации. Формирование частей продолжается. Соглашение не отменено, даже если Стеландер успеет расколоться раньше.\n\nВ штабе Шабрата эту формулировку прочитали несколько раз. Помощь существует на бумаге. Теперь необходимо удержать путь, по которому она сможет прийти."
 ADISCORD_STP_preparation.8.delivered: "Абила услышала колонны раньше, чем увидела их. Машины вошли в город на рассвете, затем подтянулись артиллерия и средства ПВО. Офицер связи передал Шабрату пакет с приказами и коротко сообщил, что три дивизии готовы перейти под его командование.\n\nНа вокзале не было церемонии. Война уже началась, и Кефрейт прибыл не для фотографии."
 ADISCORD_STP_preparation.8.refused: "Папка вернулась закрытой. На первом листе стояла короткая резолюция: «Ресурсы не выделять». Никаких политических объяснений Кефрейт не приложил.\n\nДля штаба Шабрата отказ означал простую вещь. Всё, что не придёт через границу, придётся найти внутри страны."

 ADISCORD_STP_preparation.10.t: "Северная кампания"
 ADISCORD_STP_preparation.10.d: "На карте перед Тобисом Бентликсом было два направления. К югу лежал Стеландер, где смерть Иванова превращала десятилетия нодрульского влияния в спорное наследство. На севере Юбор, Культ Детей Леса и Вольный Фронтир собирали оборонительный союз.\n\nГенеральный штаб предлагал решить северный вопрос первым. Пока эти государства сохраняли армии и общую границу, любое крупное движение на юг оставляло Нодрул уязвимым. Дипломаты возражали, что каждый месяц промедления даёт Шабрату время превратить сопротивление в правительство.\n\nБентликс долго смотрел не на стрелки наступления, а на Стеландер. Для Нодрула эта страна всегда была доказательством того, что договор, школа и правильный советник способны сделать больше, чем оккупационная армия. Если после смерти Иванова её придётся удерживать силой, сама идея такого порядка окажется под вопросом.\n\nСевер можно было попытаться закрыть быстро. Стеландер ждать не обещал."
 ADISCORD_STP_preparation.10.a: "Сначала обезопасить север."
 ADISCORD_STP_preparation.10.b: "Армия понадобится ближе к Стеландеру."

 ADISCORD_STP_preparation.13.t: "Нодрул поворачивает на север"
 ADISCORD_STP_preparation.13.d: "Первые сообщения пришли от железнодорожников. Эшелоны, которые обычно шли к южным складам, начали уходить на север. Затем разведка подтвердила переброску штабов и инженерных частей. Нодрул готовился к собственной войне.\n\nВ штабе Шабрата никто не называл северные государства союзниками. Они не воевали за Стеланд и едва ли интересовались его выборами. Но каждый батальон, который Бентликс отправлял против них, не мог одновременно перейти нашу границу.\n\nНа карте появились новые отметки. Впервые за весь кризис часы начали работать не только против нас. Никто не знал, как долго продлится это преимущество."
 ADISCORD_STP_preparation.13.a: "Чужая война дала нам время."

 ADISCORD_STP_preparation.14.t: "Север замолчал"
 ADISCORD_STP_preparation.14.d: "Несколько дней разведка ждала подтверждения, но северная кампания так и не началась. Приказы могли быть отменены в Нодруле, союз мог потерять смысл, а сама обстановка могла измениться раньше завершения мобилизации. Причина уже не имела значения.\n\nНа карте штаба булавки, которыми отмечали нодрульские части, снова начали двигаться к южным дорогам. Подготовка вмешательства в Стеландер не требовала открытой войны и могла продолжаться за закрытыми дверями.\n\nШабрат молча снял с карты несколько пометок, обозначавших выигранное время. Если партия не будет разбита быстро, следующая колонна на этой дороге может идти уже к нам."
 ADISCORD_STP_preparation.14.a: "Теперь часы идут только против нас."

 ADISCORD_STP_cw.40.t: "Слишком много грузовиков"
 ADISCORD_STP_cw.40.d: "Сначала посредники сообщили о дополнительных топливных цистернах возле южных складов Нодрула. Затем появились новые госпитальные места, запасные мостовые секции и карты наших дорог. Ни один из этих предметов сам по себе не доказывал подготовку интервенции. Вместе они оставляли мало пространства для другой версии.\n\nПравительство Бентликса ещё ничего не объявило. Именно так Нодрул и предпочитал действовать. Решение должно выглядеть неизбежным только после того, как вся необходимая работа уже закончена.\n\nСеверная война способна удержать его армию, но не его штабных офицеров и склады. Если партия продержится достаточно долго, границу пересекут не импровизированные добровольцы, а армия, которая готовилась заранее.\n\nИнтервенция начинается задолго до первого солдата на нашей земле."
 ADISCORD_STP_cw.40.a: "Значит, считать нужно не заявления, а эшелоны."

 ADISCORD_STP_cw.41.t: "Советники переходят границу"
 ADISCORD_STP_cw.41.d: "Утром пограничный пост сообщил о первой колонне. Через несколько минут связь оборвалась. К полудню подтверждения пришли сразу из трёх районов. Нодрульские части получили приказ вступить в войну на стороне партийного правительства.\n\nДесятилетиями столица называла людей Бентликса советниками, наблюдателями, юристами и гарантами. Их присутствие объясняли ценой мира и особенностями Фадского порядка. Теперь спор о словах закончился. Советник пересёк границу в бронемашине.\n\nПартийное командование получило внешнюю армию. Для сопротивления война перестала быть только борьбой за наследство Иванова. Если Стеланд когда-нибудь собирался доказать, что способен существовать без чужого мандата, момент оказался хуже всех возможных."
 ADISCORD_STP_cw.41.a: "Теперь договоры говорят языком артиллерии."

 ADISCORD_STP_cw.42.t: "Приготовления на южной границе"
 ADISCORD_STP_cw.42.d: "Юристы принесли Бентликсу проект документа раньше, чем военные закончили оценку сил. В нём не было слова «вторжение». Предполагалась помощь законному правительству Стеландера по его просьбе, защита действующих соглашений и восстановление порядка. Место для подписи стеландерской стороны пока оставалось пустым.\n\nТак Нодрул строил своё влияние десятилетиями. Сначала создавался институт, затем договор, затем человек, который мог поставить под ним нужную подпись. Гражданская война лишь делала последний шаг менее изящным.\n\nПоддержка партии сохранит систему, созданную при Иванове. Цена теперь будет измеряться не грантами, советниками и кредитами, а мобилизованными частями и возможными потерями. Отказ означает допустить, что Стеландер впервые за поколение сможет определить исход внутреннего кризиса без нодрульского решения."
 ADISCORD_STP_cw.42.a: "Подготовить помощь партийной армии."
 ADISCORD_STP_cw.42.b: "Не превращать влияние в оккупацию."

 ADISCORD_STP_cw.43.t: "Последний приказ операции"
 ADISCORD_STP_cw.43.victory: "Партийная администрация снова контролирует основные центры Стеландера. Нодрульские части получили приказ остановить наступление и передать занятые районы её чиновникам. Аннексии не будет. Она и не была целью.\n\nДля Бентликса важнее другое. На карте по-прежнему существует отдельный Стеландер, но его правительство знает, чья армия сохранила ему власть. Иногда зависимость работает лучше всего именно тогда, когда на границе снова можно поднять чужой флаг."
 ADISCORD_STP_cw.43.withdrawal: "Партийная армия рассыпалась раньше, чем Нодрул смог изменить исход войны. Без правительства, которое можно было бы поддерживать, юридическая конструкция операции потеряла смысл. Штаб отдал приказ о выходе.\n\nКолонны уходят теми же дорогами, по которым вошли. В Стеландере останутся погибшие, брошенные склады и очень простой вывод: впервые за десятилетия решение Нодрула оказалось недостаточным."
 ADISCORD_STP_cw.43.defeat: "Операция закончилась поражением. Части Нодрула не смогли восстановить власть партии и получили приказ прекратить боевые действия. В Палате уже готовят формулировки, в которых не будет слов «провал» и «отступление».\n\nНо документы не изменят главного. Стеландер, который десятилетиями служил витриной нодрульской модели влияния, вышел из кризиса вопреки воле её создателей."
 ADISCORD_STP_cw.43.a: "Закрыть оперативное дело."

 ADISCORD_STP_cw.20.t: "Запад после Стеландера"
 ADISCORD_STP_cw.20.d: "На карте Кефрейта появилась новая граница. Там, где ещё недавно стояло единое государство, теперь существовали партийная территория, сопротивление Шабрата и западные республики, отказавшиеся подчиняться обоим.\n\nВоенные видели возможность закончить старые территориальные споры. Контрактные управления смотрели на ту же карту иначе. Сопротивлению требовалось оружие, республикам требовалась оборона, а любой победитель однажды будет восстанавливать разрушенные дороги, шахты и склады. Война создавала несколько рынков одновременно.\n\nКефрейт мог готовить собственную операцию, ограничиться продажей вооружения одной из сторон или остаться в стороне. Ни один вариант не был нейтральным с точки зрения будущей границы. Нужно было лишь решить, какой риск страна готова записать в контракт."
 ADISCORD_STP_cw.20.a: "Готовить собственную операцию."
 ADISCORD_STP_cw.20.b: "Не входить в эту войну."
 ADISCORD_STP_cw.20.c: "Открыть оружейный канал для сопротивления."
 ADISCORD_STP_cw.20.committed: "Курс уже закреплён приказами и контрактами."

 ADISCORD_STP_cw.30.t: "Три власти, одна страна"
 ADISCORD_STP_cw.30.d: "В 05:40 утреннюю передачу государственного радио прервали. Диктор зачитал распоряжение партийного правительства о чрезвычайных мерах. Через семь минут на той же частоте появилась другая запись. Штаб Шабрата объявил, что правительство утратило право отдавать приказы. На западе советы сообщили о создании собственного союза.\n\nК открытию министерств Стеландер существовал уже в трёх версиях. Начальники станций решали, какие эшелоны пропускать. Командиры вскрывали запечатанные пакеты с приказами. В окружных администрациях снимали одни портреты и оставляли другие. Там, где решение не приняли вовремя, вооружённые люди принимали его за чиновников.\n\nБронзовый конгресс остался у партии. Абила перешла сопротивлению. Западные республики закрыли дороги для обеих сторон. Общая армия, созданная для защиты одной страны, начала делиться по гарнизонам, складам и личным обещаниям офицеров.\n\nВыбор, который месяцами делался в кабинетах и на карте влияния, теперь должен быть сделан открыто."
 ADISCORD_STP_cw.30.shabrat: "Шабрата объявили победителем выборов. На несколько часов казалось, что одной строки в протоколе хватит для мирной передачи власти. Затем партийное командование отказалось выполнять распоряжения нового председателя.\n\nПо стране пошли два набора приказов. В одних округах чиновники сохранили кабинеты и просто заменили адресата донесений. В других гарнизоны заняли администрации раньше, чем те успели выбрать сторону. Абила признала Шабрата. Партия удержала Бронзовый конгресс и значительную часть сил. Западные советы воспользовались расколом и объявили независимость.\n\nШабрат получил мандат, но не государство целиком. Теперь результат выборов придётся защищать теми частями, командирами и складами, которые согласились считать его законным."
 ADISCORD_STP_cw.30.party: "Партийный аппарат объявил свой результат окончательным. Представители Шабрата покинули зал до завершения церемонии, а через несколько часов его штаб назвал протокол навязанным.\n\nАбила отказалась подчиняться столице. В горных округах активировали сети, которые годами существовали как запасной административный слой. Партийные комиссары заняли узлы связи и склады там, где успели первыми. На западе советы объявили, что больше не признают ни одну из сторон.\n\nПартия сохранила печати, часть армии и столицу. Шабрат сохранил людей, которые были готовы жить без этих печатей. К вечеру спор о законности превратился в линию фронта."
 ADISCORD_STP_cw.30.limited: "Шабрат получил не просто большинство. Результат признали ключевые командиры и окружные администрации. Когда Хедерсетт попытался оспорить передачу власти, большая часть государства продолжила работать уже без него.\n\nПартийное выступление не охватило страну. Верные старому аппарату части закрепились вокруг столицы и Бронзового конгресса. За ними остались гвардия, отдельные склады и чиновники, для которых поражение партии означало слишком многое. Остальные округа признали новое правительство.\n\nЭто всё ещё война, но уже не война двух равных государств. Хедерсетту нужен один успех и достаточно времени, чтобы помощь Нодрула успела превратить столичный мятеж во что-то большее. Шабрату нужно закончить его раньше."

 ADISCORD_STP_cw.70.t: "Стеландер расколот после выборов"
 ADISCORD_STP_cw.70.d: "Политический кризис, начавшийся после смерти Петра Иванова, перешёл в гражданскую войну. Партийное правительство удерживает столицу и Бронзовый конгресс, тогда как силы Максима Шабрата опираются на часть окружных администраций, гарнизонов и созданных до раскола подпольных структур. На западе местные советы отказались признавать обе стороны и провозгласили Союз Возрождения Окцидии.\n\nВ течение нескольких дней единая армия Стеландера распалась по гарнизонам и личной лояльности командиров. Железнодорожные станции, склады и органы власти получают взаимоисключающие распоряжения. Нодрул рассматривает возможность поддержать партийный аппарат, а Кефрейт следит за новой западной границей.\n\nФадский мир пережил поколение. Первый спор о власти после Иванова превратил его в историю."
 ADISCORD_STP_cw.70.limited: "Максим Шабрат объявлен победителем выборов и получил признание большей части окружных администраций и значительной части командования. Партийный аппарат отказался передать власть, однако его вооружённое выступление осталось ограничено столичным районом вокруг Бронзового конгресса.\n\nБольшая часть государственных учреждений продолжает работу уже под новым правительством. Хедерсетт располагает гвардией и несколькими верными соединениями, а Нодрул рассматривает возможность их поддержки. Западные советы воспользовались кризисом и объявили собственную независимость.\n\nСтеландер избежал полного распада армии, но не первого вооружённого конфликта за власть после эпохи Иванова."
 ADISCORD_STP_cw.70.a: "Послевоенный порядок Стеландера дал трещину."

 ADISCORD_STP_cw.71.t: "Партия сохранила власть в Стеландере"
 ADISCORD_STP_cw.71.d: "Организованные силы сопротивления Максима Шабрата прекратили существование как единая армия. Партийные части вновь занимают здания окружных администраций, а правительство объявило гражданскую войну завершённой и начало восстановление обычной цепи управления.\n\nГосударственные СМИ называют исход восстановлением порядка. Однако довоенная карта не восстановлена вместе с властью партии. Западные республики остаются вне контроля столицы, тысячи людей прошли через противоборствующие армии, а участие Нодрула показало, насколько тесно старый порядок зависел от внешней поддержки.\n\nПартия удержала государственный аппарат. Ей ещё предстоит доказать, что аппарат Иванова способен существовать без самого Иванова."
 ADISCORD_STP_cw.71.a: "Победа сохранила правительство, но не прежнюю страну."

 ADISCORD_STP_cw.72.t: "Силы Шабрата заняли столицу Стеландера"
 ADISCORD_STP_cw.72.d: "Последние организованные части партийного правительства сложили оружие. Представители Максима Шабрата вошли в столичные учреждения и приказали чиновникам оставаться на рабочих местах до формирования постоянной гражданской администрации. Бронзовый конгресс перешёл под охрану победивших сил.\n\nЕсли Нодрул успел вмешаться в конфликт, разгром партии лишает его операцию политической опоры. При этом победа Шабрата не восстанавливает довоенные границы автоматически. Западные республики сохраняют самостоятельность, а значительная часть послевоенного устройства страны ещё не определена.\n\nСопротивление выиграло борьбу за центральное государство. Теперь ему предстоит решить, какое государство придёт на место Стеландера Иванова."
 ADISCORD_STP_cw.72.a: "Власть сменилась. Новый порядок ещё предстоит построить."

 ADISCORD_STP_cw.73.t: "Кефрейт начал войну против Союза Возрождения Окцидии"
 ADISCORD_STP_cw.73.d: "После отказа западных республик выполнить ультиматум Кефрейта его войска пересекли границу Союза Возрождения Окцидии. Правительство Кефрейта требует передачи регионов [43.GetName], [44.GetName] и [88.GetName], ссылаясь на прежние территориальные и хозяйственные претензии. Союз объявил требования неприемлемыми и начал общую оборону.\n\nНовая война формально отделена от борьбы партии с силами Шабрата. Ни одна из двух центральных сторон Стеландера автоматически не стала её участником. Тем не менее сам конфликт стал прямым следствием распада страны: границы, которые ещё недавно были внутренними линиями управления, теперь превратились в международный фронт."
 ADISCORD_STP_cw.73.a: "Распад Стеландера породил ещё один фронт."

 ADISCORD_STP_cw.80.t: "Нодрул завершил северную кампанию победой"
 ADISCORD_STP_cw.80.d: "Армии Северного оборонительного союза потерпели поражение, и Нодрул навязал противникам послевоенное устройство. Правительство Культа Детей Леса упразднено, а его земли перешли под прямое нодрульское управление. Юборская Народная Республика сохранила исторические территории, но оказалась в политической зависимости от победителя. Вольный Фронтир заключил мир и остался независимым.\n\nСевер теперь представляет собой сочетание прямых владений, зависимого государства и формально самостоятельного соседа. Нодрул устранил непосредственную военную угрозу своим северным границам и освободил силы, которые в течение кампании были связаны далеко от Стеландера."
 ADISCORD_STP_cw.80.limited: "Нодрул добился военной победы над всеми участниками Северного оборонительного союза, однако первоначальный проект послевоенного раздела выполнить полностью не удалось. За время войны часть спорных территорий сменила владельцев или получила иной международный статус, и мирное соглашение признало сложившиеся ограничения.\n\nКампания всё же завершила северную угрозу для Нодрула и позволила его руководству вновь сосредоточить внимание на южном направлении. Политическая карта оказалась менее удобной, чем планировал штаб, но война больше не связывает основные силы победителя."
 ADISCORD_STP_cw.80.a: "Север изменён победой Нодрула."

 ADISCORD_STP_cw.81.t: "Северные государства вынудили Нодрул отступить"
 ADISCORD_STP_cw.81.d: "Северная кампания завершилась поражением Нодрула. Его правительство согласилось прекратить войну с Юборской Народной Республикой, Культом Детей Леса и Вольным Фронтиром. По условиям мира Эснос и Бриоланд переходят к Юбору, тогда как остальные участники союза сохраняют независимость.\n\nНодрульское государство уцелело и удержало основные владения, однако не смогло навязать северу зависимый порядок. Для правительства Бентликса это первый крупный военный предел политики, которая прежде чаще опиралась на договоры, советников и давление, чем на прямую кампанию."
 ADISCORD_STP_cw.81.limited: "Северные государства добились прекращения нодрульской кампании и сохранили собственные правительства. Из-за изменений линии контроля мир затронул только те части Эсноса и Бриоланда, которые к моменту переговоров всё ещё принадлежали Нодрулу. Владения третьих государств остались за пределами соглашения.\n\nДаже ограниченный территориальный итог не меняет политического результата. Нодрул начал войну, рассчитывая перестроить север под себя, и завершил её без возможности продиктовать первоначальные условия."
 ADISCORD_STP_cw.81.a: "Северный союз пережил кампанию."

 ADISCORD_STP_cw.82.t: "Нодрул начал войну на севере"
 ADISCORD_STP_cw.82.d: "После провала переговоров нодрульские части перешли северную границу. Юборская Народная Республика, Культ Детей Леса и Вольный Фронтир ответили созданием Северного оборонительного союза и объявили, что будут вести войну совместно.\n\nНодрул стремится ликвидировать самостоятельный порядок лесного культа и поставить Юбор в зависимое положение. Северные правительства, несмотря на собственные противоречия, представляют конфликт как борьбу за право сохранить отдельные государства.\n\nКампания началась в момент, когда южнее продолжается кризис Стеландера. Одновременность двух конфликтов делает северную войну частью более широкого перераспределения сил после распада старого регионального порядка."
 ADISCORD_STP_cw.82.a: "Северный кризис стал открытой войной."

 ADISCORD_STP_preparation.20.t: "Приёмный день"
 ADISCORD_STP_preparation.20.d: "К восьми утра у окружного управления уже стояли две очереди. В одной ждали справок о выплатах семьям резервистов, в другой пытались выяснить, кого именно затронет новый призыв. Секретарь вынесла в коридор второй стул, поставила на подоконник чернильницу и начала записывать фамилии на обороте старой афиши. Телефон прямой связи со столицей молчал с самого утра.\n\nНа столе начальника округа лежали три бумаги, которые прежде даже не дошли бы до обсуждения без президентского разрешения. Нужно было открыть аварийный фонд после обвала дороги, подтвердить назначение врача в горный посёлок и разрешить выдачу топлива резервному батальону. Запросы отправили ещё вчера. Ответа не было.\n\nК полудню из столицы привезли новые бланки. На каждом по-прежнему было напечатано имя Петра Иванова. Начальник округа взял первый лист, долго смотрел на пустое место для подписи, затем написал собственную фамилию и добавил: «по поручению администрации президента». Никакого поручения он не получал. Через час таким же образом были оформлены ещё семь документов.\n\nНикто не назвал это неповиновением. Людям нужно было платить деньги, ремонтировать дорогу и выдавать топливо. Государство продолжало работать, потому что чиновники постепенно учились принимать решения, которые раньше существовали только после подписи одного человека.\n\nК вечеру телефон из столицы так и не зазвонил. На завтра очередь записали снова."
 ADISCORD_STP_preparation.20.a: "Работа продолжалась от имени человека, который её уже не вёл."

 ADISCORD_STP_preparation.21.t: "Место за столом"
 ADISCORD_STP_preparation.21.d: "Для утреннего совещания по привычке поставили двенадцать чашек. Одиннадцать заняли министры и руководители ведомств. Двенадцатая осталась перед пустым креслом председателя.\n\nПомощник Иванова открыл папку и начал читать повестку. Первый вопрос требовал подписи президента. Второй тоже. На третьем лежала записка из военного министерства с просьбой подтвердить распоряжение, отданное несколькими днями ранее. Никто в комнате не знал, увидит ли Иванов хотя бы одну из этих бумаг.\n\nРаньше подобное совещание остановили бы. Решение без президента считалось временным, а документ без его подписи возвращался отправителю. Сегодня Хедерсетт попросил читать дальше. Один министр возразил. Другой напомнил, что порт не может ждать выздоровления председателя. Через несколько минут собравшиеся уже распределяли расходы, назначали чиновников и утверждали распоряжения, которых Иванов никогда не видел.\n\nНикто не произнёс слова «преемник». Оно и не требовалось.\n\nК концу заседания бумаги лежали уже не перед пустым креслом, а перед Хедерсеттом. Помощник президента заметил это первым. Он ничего не сказал и лишь продолжил протокол.\n\nПосле совещания служащая начала собирать чашки. Дойдя до места Иванова, она на секунду остановилась. Чашка была нетронутой. На завтра в списке снова значились двенадцать.\n\nНо впервые за десятилетия Стеландером весь день управляли одиннадцать."
 ADISCORD_STP_preparation.21.a: "Страна училась жить без человека, который всё ещё был её президентом."
