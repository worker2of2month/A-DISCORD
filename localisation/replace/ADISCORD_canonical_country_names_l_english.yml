l_english:

 # Player-facing compatibility overrides for legacy technical country aliases.
 ADISCORD_vorkerland_ivanland_expeditionary_command:0 "Itoran Expeditionary Command"
 ADISCORD_vorkerland_ivanland_expeditionary_command_desc:0 "A temporary headquarters coordinates Itora's limited northern expedition, concentrating staff work and supply without creating a permanent occupation army."
 ADISCORD_vorkerland_news.1.d: "Itora has announced the end of its northern operation and dissolved the temporary defence front. Two new regimes have been established in the occupied territories. Matvey Mateuska heads Norvein, while Anton Selevyostrov leads the Kraitsk Directorate. Both governments remain closely dependent on Itora.\n\nThe operation changed the map but did not end the northern wars. The surviving republics are returning to their old conflicts over borders and roads, while the new administrations begin building their own armies. Itora has gained buffer states in place of direct occupation, but the durability of the new order remains to be tested."
 ADISCORD_vorkerland_news.2.t: "Itora Is Defeated in the Northern Campaign"
 ADISCORD_vorkerland_news.2.d: "Itora's attempt to establish a new order in the north has failed. Neither Norvein nor the dependent Kraitsk Directorate became a stable state. The disputed territories have been returned to Grain and Rivendell, and the temporary Northern Defence Front has been dissolved.\n\nVadim Kulivanov's government has announced emergency measures following the defeat. Meanwhile, the northern administrations are resuming their own wars. For neighbouring states, the campaign has provided the first clear demonstration of the limits of Itora's power after Vorkerland's collapse."

 ADISCORD_vorkerland_legitimacy_dynamic_desc:0 "No side inherited an undisputed right to speak for Vorkerland, so each proves it differently: the worker councils through working factories, the restoration through holding the historic capitals, the directorate through research and reconstruction. Recognition by the population, the army and the districts resolves into a single figure: the higher it stands, the more willingly people fight for this authority and the quieter the home front stays. Lost legitimacy returns more slowly than it is spent."
 ADISCORD_vorkerland_diplomacy.3.t: "The Vorkerland Invitation"
 ADISCORD_debug_open_ivanland_intervention: "§RDEBUG:§! Open Itora's Intervention"
 ADISCORD_debug_open_ivanland_intervention_desc: "The secretariat prepares a special order. The responsible officials await the signature and seal."
 ADISCORD_debug_resolve_ivanland_failure_desc: "The secretariat prepares a special order. The responsible officials await the signature and seal."
 ADISCORD_ivanland_prepare_northern_expedition_desc: "The expeditionary headquarters prepares the northern campaign. Quartermasters seek transport while officers study the roads beyond the border."
 ADISCORD_ivanland_limited_intervention_desc: "The northern republics unite in the face of invasion. Our troops must meet them on the roads and at the crossings."
 ADISCORD_vorkerland_collapse.80.d: "During preparation, Itora lost the strength or internal stability required for the northern operation. Headquarters is disbanding the expeditionary corps; there will be no second hidden deadline or automatic retry."
 ADISCORD_vorkerland_northern_defense_front_desc: "Facing foreign invasion, the northern headquarters suspended their mutual wars and joined their radio networks and reserves into a common defensive system. The truce will last only until Itora's campaign ends."
 ADISCORD_ivanland_invite_wit: "Invite Rimat"
 ADISCORD_ivanland_invite_wit_desc: "Invite Rimat to join the Itora-Norvein Alliance."
 faction_ivanland_norvane_alliance: "Itora-Norvein Alliance"
 NAM_national_spirit_desc: "Svetlogorye is built like a staircase, with a person on every step holding a seal and the right to say no. The centre sees everything through reports, departments and trusted representatives.\n\nThis order provides discipline and control, but turns every office into a small political power centre: the longer the chain of governors, the harder it becomes to distinguish the will of the state from the interests of those who speak in its name."
 ADISCORD_debug_open_ivanland_intervention_description_rules_tt:0 "Starts Vorkerland's collapse if needed, then automatically opens Itora's single 240-day mission."
 ADISCORD_debug_resolve_ivanland_failure_description_rules_tt:0 "Ends the wars, changes Itora to statism and enables Vadim Kulivanov's second portrait."
