l_russian:

 # Послевоенные сюжетные события Шабрата
 ADISCORD_STP_pw.1.t: "Стеланд"
 ADISCORD_STP_pw.1.d: "За два дня до первого заседания нового кабинета государственная типография прислала на утверждение пробные листы. На одном было напечатано «Республика Стеландер». На другом тем же шрифтом стояло слово, которого не было на официальных печатях несколько поколений: «Стеланд».\n\nСпор начался не из-за орфографии. В старых горных документах Стеланд был названием страны. Форма «стеландер» обозначала человека или вещь, относящуюся к Стеланду. Иностранные канцелярии десятилетиями писали о стеландерском правительстве, стеландерской администрации и стеландерских территориях. После Фадского пакта определение постепенно стало существительным. Партия закрепила его как имя нового порядка, словно вместе с окончанием войны появилась и новая страна.\n\nШабрат долго смотрел на оба листа. Он не собирался утверждать, что последних десятилетий не существовало. Но независимость, полученная после гражданской войны, не нуждалась в названии, выросшем из чужой канцелярии и принятом собственным режимом. Новый кабинет возвращал не племенной союз и не прошлый век. Он возвращал стране право самой назвать себя.\n\nНачальник типографии спросил, какой вариант отправлять в печать."
 ADISCORD_STP_pw.1.a: "Печатать: «Стеланд»."

 ADISCORD_STP_pw.2.t: "Архив, который пережил войну"
 ADISCORD_STP_pw.2.d: "Дверь архивного хранилища пришлось вскрывать сапёрам. Отступавшая администрация успела снять табличку и вывезти часть картотеки, но огонь до подвала не дошёл. На стеллажах остались десятилетия государства Иванова.\n\nВ первые часы нашли то, о чём сопротивление прежде знало только по слухам. Приложения к Фадскому пакту, которых не было в публичной редакции. Списки нодрульских советников с доступом к министерствам. Передачи прав на шахты и воду. Закрытые счета Высших Домов. Реестры задержанных, где некоторые фамилии заканчивались сухой пометкой «переведён», хотя семьи годами не получали никаких известий.\n\nНесколько людей Шабрата предложили немедленно вынести документы журналистам. После войны стране хотелось одного большого признания, что всё сказанное подпольем было правдой. Шабрат отказал. Сначала каждую папку следовало пронумеровать, снять копию, установить происхождение и выяснить, кому принадлежит каждая подпись. Только потом публикация.\n\nСтарый режим десятилетиями подменял историю удобным рассказом. Новому государству было слишком легко сделать то же самое в обратную сторону. Если Стеланд собирался судить людей и пересматривать договоры, ему нужны были не легенды победителей, а документы, которые переживут и следующую власть."
 ADISCORD_STP_pw.2.a: "Ни одного документа без номера."

 ADISCORD_STP_pw.3.t: "Памятник отцу мира"
 ADISCORD_STP_pw.3.d: "Кран приехал на площадь рано утром, хотя приказа снимать памятник никто не отдавал. Городская служба решила, что после смены власти лучше подготовиться заранее. К полудню вокруг бронзового Иванова собрались ветераны сопротивления, служащие, журналисты и несколько десятков жителей.\n\nКто-то уже написал на постаменте слово «капитуляция». Рядом пожилая женщина положила цветы. Её сын пережил последний год бомбардировок именно потому, что Фадский пакт был подписан. Через несколько метров молодой солдат Шабрата показывал товарищам фамилию деда в списке людей, исчезнувших во время послевоенных чисток.\n\nНи одна сторона не врала полностью. Иванов остановил войну, которую Стеланд едва мог продолжать. Он же построил порядок, в котором мир постепенно стал оправданием чужого влияния, закрытых договоров и власти Палаты. Снести статую было проще, чем решить, какая из этих двух историй должна остаться на площади.\n\nРабочие остановили кран и стали ждать распоряжения. Впервые вопрос о памяти Иванова решал не его собственный аппарат."
 ADISCORD_STP_pw.3.a: "Оставить памятник. Но заменить табличку."
 ADISCORD_STP_pw.3.b: "Перенести Иванова в музей."
