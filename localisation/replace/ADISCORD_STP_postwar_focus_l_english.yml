 STP_pw_postwar_budget_available_tt: "§YThe victor of the Stelander civil war§!: the internal conflict must be settled and the victory recorded.\n§YThe Mountain Republics§!: their own conflict must separately be over. §gThese are alternative country-specific conditions, not one shared requirement.§!"
