l_english:
 upgrade_economy_civilian: "Economic dossier"
 upgrade_economy_civilian_desc: "Behind accounting columns lie supply routes, factory reserves and the true cost of foreign ambitions."
 upgrade_army_department: "Field intelligence"
 upgrade_army_department_desc: "Observer reports and captured maps reveal the shape of a foreign front."
 upgrade_naval_department: "Harbour watch"
 upgrade_naval_department_desc: "Harbour contacts learn of a ship's departure before its silhouette disappears over the horizon."
 upgrade_airforce_department: "Sky watch"
 upgrade_airforce_department_desc: "Observation posts bring together aircraft sightings, airfield activity and intercepted radio traffic."
 upgrade_passive_defense: "Counterintelligence bureau"
 upgrade_passive_defense_desc: "Foreign agents leave traces in passes, conversations and coincidences that are too convenient."
 upgrade_anti_partisan: "Cell registry"
 upgrade_anti_partisan_desc: "Names, addresses and connections turn scattered rumours into a map of clandestine cells."
 upgrade_blueprint_stealing: "Technical acquisitions"
 upgrade_blueprint_stealing_desc: "Foreign drawings travel a long way from a factory safe to the desks of our engineers."
 upgrade_portable_radios: "Field communications"
 upgrade_portable_radios_desc: "A compact radio connects a residency to headquarters even where ordinary lines have fallen silent."
 upgrade_invisible_ink: "Covert correspondence"
 upgrade_invisible_ink_desc: "An ordinary letter can carry a second meaning that only a trained recipient can read."
 upgrade_plastic_explosives: "Demolition kit"
 upgrade_plastic_explosives_desc: "Specialists prepare equipment for work on foreign communications and industrial sites."
 upgrade_suicide_pills: "Last protocol"
 upgrade_suicide_pills_desc: "Before departure, an agent receives a sealed kit and instructions for a situation with no way out."
 upgrade_training_centers: "Residency school"
 upgrade_training_centers_desc: "Future residents learn to live under another name, understand local habits and maintain their cover."
 upgrade_commando_training: "Infiltration course"
 upgrade_commando_training_desc: "Instructors teach how to cross a cordon, move through foreign territory and return unnoticed."
 upgrade_interrogation_techniques: "Investigative bureau"
 upgrade_interrogation_techniques_desc: "Statements, recovered documents and testimony are checked until they form a coherent account."
 upgrade_diplo_training: "Negotiation service"
 upgrade_diplo_training_desc: "Listening behind closed doors can sometimes open more doors than an official mandate."
 upgrade_psycho_warfare: "Influence office"
 upgrade_psycho_warfare_desc: "Broadcasts, leaflets and carefully placed rumours gradually change what a foreign street believes."
 upgrade_form_department: "Cipher bureau"
 upgrade_form_department_desc: "A dedicated service receives intercepts, maintains key books and guards the language of secret correspondence."
 upgrade_decryption_boost: "Signal analysis"
 upgrade_decryption_boost_desc: "Among interference and repeating groups, analysts look for radio operators' habits and patterns in their ciphers."
 upgrade_decryption_boost_2: "Analysis machines"
 upgrade_decryption_boost_2_desc: "Rows of relays and rotating drums take on the repetitive work of processing intercepted messages."
 upgrade_crypto_strength: "Cipher schedules"
 upgrade_crypto_strength_desc: "Fresh key schedules reach the residencies in sealed packets."
 upgrade_crypto_strength_2: "Protected communications"
 upgrade_crypto_strength_2_desc: "Protected lines and strict handling of keys bind the service into a single network."
