 STP_pw_postwar_budget_available_tt: "§YПобедитель гражданской войны в Стеландере§!: внутренний конфликт должен быть завершён, а победа зафиксирована.\n§YГорные республики§!: для них отдельно должен завершиться их собственный конфликт. §gЭто альтернативные условия для разных стран, а не общее требование.§!"
 STP_cw_first_postwar_budget_desc: "Победитель возвращает государственные расходы к обычному мирному бюджету. Внешние войны и конфликт горных республик не блокируют послевоенное восстановление победителя гражданской войны."
