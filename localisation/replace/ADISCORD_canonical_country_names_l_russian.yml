l_russian:

 # Player-facing compatibility overrides for legacy technical country aliases.
 ADISCORD_debug_open_ivanland_intervention: "§RDEBUG:§! Открыть интервенцию Иторы"
 ADISCORD_debug_open_ivanland_intervention_desc: "При необходимости сначала запускает распад Воркерланда, затем автоматически открывает единственную 240-дневную миссию Иторы."
 ADISCORD_debug_resolve_ivanland_failure_desc: "Прекращает войны, переводит Итору к этатизму и включает второй портрет Вадима Иванчика."

 ADISCORD_ivanland_prepare_northern_expedition_desc: "На §Y120 дней§! передать две гражданские фабрики снабжению экспедиционного корпуса. Если к завершению подготовки Итора сохранит необходимую армию, людские резервы и внутреннюю устойчивость, автоматически начнётся ограниченная §Y240-дневная§! интервенция."
 ADISCORD_ivanland_limited_intervention_desc: "Северные республики временно прекратили междоусобные войны и создали §YСеверный оборонительный фронт§!. Итора должна за §Y240 дней§! физически занять штаты §Y90§!, §Y91§!, §Y93§! и §Y94§!.\n\n§GУспех:§! штаты §Y90–91§! образуют Норвейн Матвея Матеуска, а штаты §Y93–94§! - Крайтскую директорию Антона Селевёстрова. Оба государства станут отдельными клиентами Иторы.\n§RПровал:§! обе администрации не будут созданы, территории вернутся северным республикам, а Вадим Иванчик сменит курс на этатизм. После развязки уцелевшие северяне возобновят прерванные войны."
 ADISCORD_vorkerland_collapse.80.d: "За время подготовки Итора утратила силы или внутреннюю устойчивость, необходимые для северной операции. Штаб распускает экспедиционный корпус; второго скрытого срока и автоматической повторной попытки не будет."
 ADISCORD_vorkerland_northern_defense_front_desc: "Перед внешним вторжением северные штабы приостановили взаимную войну, свели радиосети и резервы в единый оборонительный контур. Перемирие продержится лишь до окончания похода Иторы."

 ADISCORD_ivanland_invite_wit: "Пригласить Римат"
 ADISCORD_ivanland_invite_wit_desc: "Предложить Римату присоединиться к Иторско-Норвейнскому союзу."
 faction_ivanland_norvane_alliance: "Иторско-Норвейнский союз"

 ADISCORD_vorkerland_ivanland_expeditionary_command:0 "Экспедиционное командование Иторы"
 ADISCORD_vorkerland_ivanland_expeditionary_command_desc:0 "Временный штаб координирует ограниченную северную экспедицию Иторы, сосредотачивая управление и снабжение без создания постоянной оккупационной армии."

 NAM_national_spirit_desc: "Светлогорье построено как лестница, на каждой ступени которой стоит человек с печатью и правом сказать «нет». Центр видит всё через отчёты, ведомства и верных представителей.\n\nТакой порядок даёт дисциплину и управляемость, но превращает каждую должность в маленький политический узел: чем длиннее цепь наместников, тем труднее отличить государственную волю от интересов тех, кто говорит от её имени."
