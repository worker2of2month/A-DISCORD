l_russian:

 STP_regions_panel_tt: "Яркий цвет — кому округ перейдёт при расколе. Бледный — только текущий перевес.\n\n§RВАЖНО:§! дорога и подготовленное снабжение сами по себе НЕ передают округ Шабрату. Для обычного округа нужны §Yзакреплённое влияние сопротивления§! и §Yадминистрация сопротивления§!, непрерывно работавшая §Y21 день§!. Альтернатива: легитимность Шабрата выше §Y55%§! — тогда спорный округ перейдёт ему даже без готовой администрации."

 STP_cw_repair_niansas_desc: "Восстановим дорогу в регионе [3.GetName], чтобы движение грузов не зависело от личных распоряжений министров. Дополнительная инфраструктура улучшит условия снабжения и укрепит поддержку Шабрата на выборах.\n\n§RВАЖНО:§! дорога и подготовленное снабжение сами по себе НЕ передают округ Шабрату. Этот фокус §Rне создаёт администрацию сопротивления§! и сам по себе не гарантирует переход Ниансаса. Для обычной передачи нужны закреплённое влияние сопротивления и администрация сопротивления, непрерывно работавшая §Y21 день§!, либо легитимность Шабрата выше §Y55%§!."

 STP_cw_port_budget_desc: "Выделим средства в казну и подготовим складские маршруты Ниансаса. Если партия ликвидирует склад, открытое решение позволит подготовить маршруты заново за полную стоимость.\n\n§RВАЖНО:§! дорога и подготовленное снабжение сами по себе НЕ передают округ Шабрату. Этот фокус подготавливает §Yснабжение§!, но §Rне создаёт администрацию сопротивления§!. Для обычной передачи Ниансаса нужны закреплённое влияние сопротивления и администрация сопротивления, непрерывно работавшая §Y21 день§!, либо легитимность Шабрата выше §Y55%§!."

 STP_region_3_map_tt: "§YНиансаская область§!\n\n§YРАССТАНОВКА СИЛ§!\n  §CСопротивление:§! [3.STPGetResistanceInfluence]\n  §0Партия:§! [3.STPGetPartyInfluence]\n\n§YСтатус:§! [3.STPGetRegionStatus][3.STPGetInspectionStatus][3.STPGetOppositionOperation][3.STPGetAdministrationAsset][3.STPGetGarrisonAsset][3.STPGetSupplyAsset][3.STPGetSabotageAsset][3.STPGetLocalDealAsset][3.STPGetPartyGarrisonMeasure][3.STPGetPartyCounterintelligenceMeasure]\n\n§YПередача Шабрату:§! при обычном расколе одновременно нужны §Yзакреплённое влияние сопротивления§! и §Yадминистрация сопротивления§!, непрерывно работавшая §Y21 день§!. §RВАЖНО:§! дорога и подготовленное снабжение сами по себе НЕ передают округ Шабрату. Если легитимность Шабрата выше §Y55%§!, спорный округ перейдёт ему даже без готовой администрации.\n\n§YТекущий прогноз при восстании:§! [3.STPGetCivilWarForecast]\n[3.STPGetRifleCache]"
