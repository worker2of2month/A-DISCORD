l_russian:

 STP_regions_panel_tt: "Яркий цвет — кому округ §Yреально перейдёт§! при расколе. Бледный — только текущий перевес.\n\n§YОбычный спорный округ§! переходит Шабрату, если выполняется хотя бы одно условие:\n• сопротивление закрепилось и администрация проработала §Y21 день§!;\n• влияние сопротивления достигло §G90%§! — абсолютное доминирование достаточно само по себе;\n• легитимность Шабрата выше §Y55%§! — сильный мандат забирает спорные округа без готовой администрации.\n\n§YНиансас§!: после фокуса §Y«Дорога через Ниансас»§! появляется операция §Y«Перехватить областное управление»§!. Для неё достаточно закреплённого сопротивления и любого положительного перевеса легитимности Шабрата (§Y>0§!)."

 STP_cw_repair_niansas_desc: "Восстановим дорогу в регионе [3.GetName], чтобы движение грузов не зависело от личных распоряжений министров. Улучшим инфраструктуру, немного укрепим легитимность Шабрата и откроем специальную операцию §Y«Перехватить областное управление»§!.\n\nОперация доступна, когда сопротивление в Ниансасе закрепилось и легитимность хотя бы немного на стороне Шабрата (§Y>0§!). После её завершения округ получит отдельное основание перейти Шабрату. Если влияние сопротивления достигнет §G90%§!, операция уже не нужна: округ перейдёт автоматически."

 STP_cw_port_budget_desc: "Выделим средства в казну и подготовим складские маршруты Ниансаса. Если партия ликвидирует склад, открытое решение позволит подготовить маршруты заново за полную стоимость.\n\n§YВажно:§! подготовленное снабжение само по себе не передаёт округ. Передачу дают готовая 21-дневная администрация, §G90%§! влияния сопротивления, сильный мандат Шабрата выше §Y55%§! либо специальная операция, открываемая фокусом §Y«Дорога через Ниансас»§!."

 STP_region_3_map_tt: "§YНиансаская область§!\n\n§YРАССТАНОВКА СИЛ§!\n  §CСопротивление:§! [3.STPGetResistanceInfluence]\n  §0Партия:§! [3.STPGetPartyInfluence]\n\n§YСтатус:§! [3.STPGetRegionStatus][3.STPGetInspectionStatus][3.STPGetOppositionOperation][3.STPGetAdministrationAsset][3.STPGetGarrisonAsset][3.STPGetSupplyAsset][3.STPGetSabotageAsset][3.STPGetLocalDealAsset][3.STPGetPartyGarrisonMeasure][3.STPGetPartyCounterintelligenceMeasure]\n\n§YТекущий прогноз при восстании:§! [3.STPGetCivilWarForecast][3.STPGetCivilWarForecastReason]\n[3.STPGetRifleCache]"
