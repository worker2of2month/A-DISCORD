l_russian:

 # Глобальные новости о претендентах Воркерланда
 ADISCORD_vorkerland_claimant.100.t: "Запад Воркерланда готовится к борьбе за центр"
 ADISCORD_vorkerland_claimant.100.d: "В западных округах бывшей Конфедерации завершено объединение заводских батальонов, железнодорожных советов, мастерских и чрезвычайной администрации под единым командованием. В зависимости от внутреннего исхода оно опирается либо на публичный мандат Никиты Уоркера и фронтовых советов, либо на директивный аппарат Антона Бэгли.\n\nДля соседних правительств различие пока менее важно, чем сам результат. На западе возник центр власти, который больше не считает себя временной администрацией и готов оспаривать контроль над центральным Воркерландом."
 ADISCORD_vorkerland_claimant.100.a: "Война за преемство входит в новую фазу."

 ADISCORD_vorkerland_claimant.101.t: "Восток Воркерланда сформировал единое военное правительство"
 ADISCORD_vorkerland_claimant.101.d: "Восточная коалиция завершила объединение канцелярии Влада, окружных гарнизонов, подвижного штаба и складов в единую систему управления. Принятая хартия определяет, кто имеет право отдавать приказы и какие учреждения должны пережить чрезвычайное положение.\n\nСторонники коалиции называют это восстановлением законного государства. Её противники видят ещё одного претендента, который подготовил армию и администрацию для борьбы за центр бывшей Конфедерации."
 ADISCORD_vorkerland_claimant.101.a: "На востоке появился ещё один центр власти."

 ADISCORD_vorkerland_claimant.102.t: "Директория Воркса переводит страну на единое оперативное управление"
 ADISCORD_vorkerland_claimant.102.d: "Техническая директория Дориана Воркса связала производство, энергосеть, ремонтные поезда, полевые лаборатории и военные штабы в одну систему распределения ресурсов. В отличие от других претендентов, она обосновывает право на власть не старой хартией и не революционным мандатом, а способностью поддерживать работу страны во время войны.\n\nТеперь эта модель выходит за пределы кабинетов и производственных таблиц. Директория готовится к борьбе за центральный Воркерланд, где её обещание управлять через измеримый результат впервые будет проверено на всей стране."
 ADISCORD_vorkerland_claimant.102.a: "Компетентность тоже придётся доказывать на фронте."
