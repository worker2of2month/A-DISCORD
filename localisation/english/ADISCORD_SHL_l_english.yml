 SHL_price_engineers:0 "§Y[?SHL_engineers_price|0]§!"
 SHL_price_engineers_red:0 "§R[?SHL_engineers_price|0]§!"
 SHL_nam_fuel_treaty_tt:0 "While there is no embargo or war with Svetlogorye, the fuel packet for Shahrabad is cheaper by §G10§! £ADISCORD_economy_treasury_texticon"
 SHL_planned_supply_description_rules_tt:0 "At the beginning of each production period, the country purchases missing whole packs for operating furnaces at the current raw-material price. The service uses no repair slots or credit and spends only available money. Manual supplies and emergency reserves remain available."
 SHL_supply_furnace_description_rules_tt:0 "One pack of raw materials arrives in 7 days. Another paid operation on this furnace must wait until completion. Losing control returns the deposit."
 SHL_repair_furnace_description_rules_tt:0 "The repair service reduces wear by 30 in 14 days. Auxiliary sections are serviced in turn while the main furnace continues operating."
 SHL_training_furnace_description_rules_tt:0 "The shift completes the masters' programme in 35 days. Wear gained per supplied production period permanently falls by 1. The same shift cannot be charged for repeated training."
 SHL_restart_furnace_description_rules_tt:0 "Settle ownership and prepare supplies first. After 21 days the furnace resumes work at 20 wear. Transferring ownership does not pay for its restart."
 SHL_buy_reserve_description_rules_tt:0 "Two packs enter the common reserve. Send them to a selected furnace immediately or use one for the first pour. A supplier dispute raises one purchase to 70 from 60; buying the packs or creating the railway removes the surcharge."
 SHL_allow_extinction_description_rules_tt:0 "The main furnace stops production. Its house loses its hereditary vote and the enterprise passes to the city. Buildings remain; restarting requires a separate paid decision."
 SHL_mobilisation_quota_description_rules_tt:0 "The Directorate assigns the chosen furnace's pour to the arsenal. The owner keeps the furnace but does not dispose of its metal for two cycles."
 SHL_state_concession_description_rules_tt:0 "A state furnace is leased back to its former house. The Directorate gets money at once; the house gets its vote and the duty to keep the fire."
 SHL_debt_tribunal_description_rules_tt:0 "The court of crests does not wait for the pledge to mature. The ruling is issued in a day, and the furnace passes to the city before the house can gather the money."
 SHL_war_orders_all_description_rules_tt:0 "The Directorate of Furnaces suspends the choice of recipients for one cycle: export, quarters and crests wait while all the city's metal goes to the arsenal. Nine dispatchers receive the same telegram and nine yards begin the same pour. After the cycle the old orders return on their own."
 SHL_register_quarters_description_rules_tt:0 "Reconcile house, factory and city records without invalidating existing documents. Removes Quarters outside the register; payment remains available until the Workers Charter settles the issue."
 SHL_back_shift_councils_description_rules_tt:0 "Recognise the councils as the political authority and open the Workers' Commune course. Nur will resign. This choice is available during the first strike without deliberately failing negotiations."
 SHL_back_crests_description_rules_tt:0 "Transfer power to Darius Safir and open the Regency of the Houses. Nur will resign. This choice is available during the first ultimatum without waiting for its failure."
 SHL_strike_mission_description_rules_tt:0 "The strike committee keeps the furnaces on minimal fire. While the strike lasts, every operating furnace earns §R10§! £ADISCORD_economy_treasury_texticon less."
 SHL_raise_furnace_guard_description_rules_tt:0 "The furnaces pay for the rifles and the cities provide the men. In 21 days a furnace guard division of two infantry battalions and militia forms in Shahrabad."
 SHL_war_orders_description_rules_tt:0 "The selected furnace diverts its revenue into two prepaid weapons batches. Each actual pour delivers half the order; overtime delivers both. Shortages, occupation and shutdown delay delivery. Cancellation refunds only unmade batches."
 SHL_negotiate_kyz_neutrality_description_rules_tt:0 "[SHLGetKeizanFlankStatus]\n\nOffer compensation for the earlier border conflict in exchange for refusing to support Keyzan. Negotiations remain available until war begins. The neighbour may refuse; refusal and an expired offer cost nothing."
 SHL_keizan_deadline_description_rules_tt:0 "The Assembly of Canal Communities has given Shahrabad 60 days. Then its detachments will enter the Zarkhan District from Tabar."
 SHL_keizan_last_ration_description_rules_tt:0 "A late payment costs more, but closes Keyzan's demand for good."
 SHL_export_contract_description_rules_tt:0 "The house receives an advance for two successful pours within the next three production cycles. Overtime completes two pours per cycle. Materials and maintenance remain payable; this furnace diverts its ordinary revenue to the order. Occupation does not stop the deadline. One extension or repayment settles a missed deadline."
 SHL_debt_shift_description_rules_tt:0 "A city treasury advances cash against the house furnace's future revenue. Only actual revenue after deductions pays down the obligation. Shutdown delays repayment. Early settlement charges the outstanding balance. The debt-shift law allows surrendering the furnace itself to the city instead."
 SHL_common_cauldron_description_rules_tt:0 "A working civic furnace sponsors another site. Select the recipient on the panel next. Until aid can proceed, the donor keeps its normal revenue. Two donor pours then repair or restart the recipient instead of earning cash."
 SHL_civic_order_description_rules_tt:0 "Two successful pours build one infrastructure level in this furnace district. Its usual revenue is diverted. A district already at maximum infrastructure refunds the deposit. Occupation pauses work; a new owner or constitution settles the outstanding receipt."
 SHL_relief_recipient_description_rules_tt:0 "Choose another civic furnace, stopped or with at least 30 wear. It needs no paid work in progress; a stopped furnace also needs one raw-material packet to restart. Assistance waits for any paid repair to settle. The recipient remains fixed until completion or cancellation."
 SHL_close_obligation_description_rules_tt:0 "Delivered weapons remain. Unfinished civic work returns its deposit. Export and pledge liabilities must be repaid; any treasury shortfall becomes ordinary public debt. Materials and diverted production are not returned."
 SHL_foreclose_furnace_description_rules_tt:0 "The city accepts the operating furnace against the outstanding debt. The house loses ownership and its hereditary vote while production continues. The regent preserves cash by breaking solidarity among the crests."
 SHL_renew_golden_offer_description_rules_tt:0 "The Veyr partnership permits another alliance proposal. Its government must agree; rejection does not close future negotiations."
 SHL_renew_southern_offer_description_rules_tt:0 "Invite Keyzan into the Southern Compact. Rejection leaves it independent and negotiations may resume after 60 days."
 SHL_renew_veyr_partnership_description_rules_tt:0 "Offer the trade partnership again. Acceptance after the Conclave of Ten also triggers the alliance proposal. Existing harbour construction and war settlements remain intact."
 SHL_forge_campaign_convoy_description_rules_tt:0 "The selected furnace commits two pours to the convoy and forgoes its ordinary revenue. A change of government preserves the order; loss of the furnace or the end of war returns unused payment."
 SHL_demobilise_campaign_convoy_description_rules_tt:0 "A completed convoy that has not reached the front can be returned to the stockpile as weapons. This is impossible once it has been deployed."
 SHL_march_on_keizan_description_rules_tt:0 "Prepare a declaration of war on Keyzan over the two cistern regions in 28 days. If the threat disappears or Shahrabad enters another war, preparation is cancelled and 50 £political_power_texticon refunded."
 SHL_secure_cistern_corridor_description_rules_tt:0 "Hold both cistern regions and our frontier district for 14 days. Losing any objective interrupts the operation. Success ends this war and transfers both cistern regions to Shahrabad."
 SHL_house_campaign_aid_description_rules_tt:0 "One assistance package for the current campaign. The houses provide immediate cash in exchange for a larger public debt."
 SHL_city_campaign_aid_description_rules_tt:0 "One assistance package per campaign. Cities provide two equipped levies; the treasury buys their weapons, recruits come from the national pool and the assemblies spend some of their support."
 SHL_directorate_campaign_aid_description_rules_tt:0 "One assistance package per campaign. A completed convoy and extra raw materials support the first 45 days of war. Shift unrest will rise."
 SHL_regent_campaign_aid_description_rules_tt:0 "One assistance package per campaign. Two levies are equipped against the active pledge. The pledged furnace’s revenue continues paying the increased obligation."
 SHL_commune_campaign_aid_description_rules_tt:0 "One assistance package per campaign. The levy receives weapons and personnel paid from existing stocks. Common service reduces district unrest."
 SHL_offer_cistern_charter_description_rules_tt:0 "Return both occupied regions to Keyzan in exchange for its voluntary entry into the Southern Compact. Rejection leaves the land with Shahrabad; the offer can be renewed after 60 days."
 SHL_reconstruct_south_description_rules_tt:0 "One paid 56-day project. [SHLGetSouthProgramme]\n\nBuildings go to the current owner of the selected region. War, a change of course or loss of access cancels the project and refunds payment. A second order cannot be opened before settlement."
 SHL_cistern_concession_description_rules_tt:0 "Return both occupied regions to Keyzan and realise the concession rights. An active pledge is repaid first; the remainder goes to the treasury."
 SHL_council_election_description_rules_tt:0 "Every half-year the cities elect the delegates of the open Conclave. The result depends on whether the quarters trust the Conclave."
 SHL_cons_charter_round_description_rules_tt:0 "The open Conclave awaits replies to its invitations. In five months those who declined will receive a second letter."
 SHL_cons_ultimatum_description_rules_tt:0 "The Directorate has given Keyzan and Veyr four months. Whoever does not submit hears a demand for full annexation."
 SHL_cons_toll_term_description_rules_tt:0 "The regency waits for the toll debtors to recognise a suzerain. Five months, and the demand hardens."
 SHL_cons_councils_description_rules_tt:0 "The commune waits for the councils of Mazar or Veyr to bring their country into the alliance. Half a year, and the invitation is repeated."
 SHL_house_demand_description_rules_tt:0 "The refusal has been delivered. The Conclave now has a month and a half to put the furnace in order, or the house goes into opposition."
 SHL_metal_contract_end_description_rules_tt:0 "The Conclave withdraws the cartel's obligation to this buyer. Shipments stop from the next cycle; payments already received stay in the treasury."
 SHL_furnace_bonds_description_rules_tt:0 "Money now against future pours. The payments will cost the Conclave political weight."
 SHL_metal_dumping_description_rules_tt:0 "Two packages of raw material from the reserve are sold on the market."
 SHL_crisis_fund_description_rules_tt:0 "Money set aside will settle the next incident without loss."
 SHL_crisis_prevention_description_rules_tt:0 "Inspections of workshops and caravans for half a year ahead."
 SHL_quarter_charter_description_rules_tt:0 "The scribes of the Conclave spend three weeks checking the rolls of houses and families before the seal touches the parchment. While the furnace burns and stays in the hands of the city or a house, the charter lives with it."
 SHL_dispatch_order_description_rules_tt:0 "An order takes a spare packet from a full yard and sends it where the bunker stands empty without asking the owning house. The caravan takes a week through the city streets, and the picture of the stocks may already have changed when it arrives."
 SHL_arbitration_act_description_rules_tt:0 "An act signed by the arbiter and two quarter elders closes the cases in one list. The quarters breathe out and the houses gain three months of quiet before the complaint box fills again."
 SHL_house_audit_description_rules_tt:0 "For three weeks they recount the raw materials, compare the masters' records with the scales and make the owner fix what he has grown used to overlooking. The house endures the audit as an insult; the furnace, as a long-overdue repair."
 SHL_desert_embassy_description_rules_tt:0 "Two weeks across the sand, gifts for the court, a house with a flag above the gate. A neighbour who has someone to turn to in Shahrabad argues less often and agrees more easily."
 SHL_integrate_satellite_decision_description_rules_tt:0 "The accession treaty is debated for a month in both capitals: the houses buy out a share, the directorate issues a decree, the regency pays the former rulers, the commune puts the question to the councils, and the cities wait until the neighbour says yes itself. Until the papers are signed, the neighbour is free to walk away."
 SHL_prospect_copi_description_rules_tt:0 "For two months they sleep in the dry gorges and return with sacks of rock that Darban's smelters test for chromium. Every survey opens a new outcrop of the vein, but the gorges beyond the mines are not endless."
 SHL_raise_border_watch_description_rules_tt:0 "A month goes on gathering the men, issuing them weapons from the arsenals of Khazar and teaching them to hold a line beside the guards of House Veyran. The watch serves the country, not a crest, and Behruz Veyran is reminded of it more often than he would like."
 SHL_trade_mission_description_rules_tt:0 "For a month the mission lives at a foreign court, bargains over duties, listens to complaints and promises to carry them to Khazar. A neighbour who has seen Shahrabad's metal and spoken with its sellers reads the Conclave's next letter differently."
 SHL_measure_crest_patronage_description_rules_tt:0 "For two months the Conclave's attention belongs to the crests, and the streets feel it."
 SHL_measure_golden_fair_description_rules_tt:0 "For two months the Conclave is busy with nothing but guests and scales."
 SHL_measure_quarter_assembly_description_rules_tt:0 "For sixty days the hall belongs to the quarters and the crests have to listen."
 SHL_measure_open_books_description_rules_tt:0 "The copyists sit in the archive for two months, and the quarters see for the first time where the city's money goes."
 SHL_measure_directorate_decree_description_rules_tt:0 "For two months the city lives by decree rather than custom."
 SHL_measure_crest_court_description_rules_tt:0 "For two months court days gather petitioners and onlookers on the square; the quarters grumble, but they pay."
 SHL_measure_common_assembly_description_rules_tt:0 "For sixty days the hall hums from morning to night, and there is no longer room in it for the crests."
 SHL_measure_shift_reserve_description_rules_tt:0 "The shifts set aside part of the raw materials into the commune's common reserve so that no furnace stops because of a late caravan. For two months the storekeepers recount packets and argue over quotas."
 SHL_ultimatum_veyr_description_rules_tt:0 "If the chamber does not lift the duty, Shahrabad will take the Kassen mines and the road through Noran."
 # War for the South tree
 SHL_sw_war_conclave:0 "War Council of the Furnaces"
 SHL_sw_war_conclave_desc:0 "A war council gathers in Khazar: those who hold the furnaces, those who hold the treasury and those who will lead the columns. A map of the desert lies on the table with the oil belt in the north, and the argument is no longer whether to fight, but how much fire to give the front.\n\nBy dawn the decision is entered in the ledger. The North will not sell the furnaces a single barrel of oil while it stands, and the South will have only one suzerain."
 SHL_sw_desert_columns:0 "Columns of the Desert"
 SHL_sw_desert_columns_desc:0 "The desert does not forgive infantry trudging from well to well. Khazar's workshops strip the beds off ore trucks and mount machine guns, water drums and spare wheels on the chassis. Guard commanders teach the crews to move by night, hide in the shade of the dunes by day and keep together in a dust storm.\n\nThe first columns leave for the Zarkhan district to the roar of engines that only yesterday hauled Bayrat ore."
 SHL_sw_quarter_levies:0 "Quarter Levies"
 SHL_sw_quarter_levies_desc:0 "The war comes to the quarters as call-up papers. Criers read the lists in the squares by the furnaces, and the shifts form into columns still in their work clothes. Rifles are handed out at the workshop gates, commanders are picked from the senior masters, and drill takes place between pours.\n\nIn the quarters people say that if the furnace demands their blood, it will have to hear their voice as well. For now those words are written only in the shift journals."
 SHL_sw_guard_columns:0 "Guard Columns"
 SHL_sw_guard_columns_desc:0 "The masters will not leave the furnaces: the war will be fought by those hired for it. Desert guard brigades receive contracts for the whole campaign, their own trucks and officers who know every well between Zarkhan and the oil belt. The workshops see them off calmly: not a single worker has been taken from the furnaces.\n\nOn the parade ground by the Golden Gates the mercenaries swear not to a crest or a council, but to the signature on the contract."
 SHL_sw_column_staff:0 "Column Staff"
 SHL_sw_column_staff_desc:0 "Whoever marches in the columns, quarter militia or hired guard, they will be lost in the sands without a common staff. In the old ledger office by Khazar station the furnace clerks keep account of water and cartridges just as they once kept account of ore, and the signallers receive a radio set for every column.\n\nOn the staff wall hangs a map where every well is marked with the date of its last inspection."
 SHL_sw_field_hospitals:0 "Field Hospitals"
 SHL_sw_field_hospitals_desc:0 "Sand kills the wounded faster than bullets: heat, thirst and the long road to Khazar. Doctors from the furnace hospitals, used to burns and cave-ins, assemble mobile hospitals in the backs of trucks. Nurses from the quarters learn to set splints in the shade of canvas.\n\nNow Zarkhan sends back not only casualty lists, but also the people the doctors managed to save."
 SHL_sw_desert_raids:0 "Raids Across the Sands"
 SHL_sw_desert_raids_desc:0 "The oil belt is fortified, but the desert around it lies open. The staff decides not to batter its head against the northern positions: light columns go into the sands for weeks, live off their own tankers, cut roads and appear where no one expects them.\n\nThe raid commanders receive a single instruction: never linger at a target longer than it takes a burning depot to burn out."
 SHL_sw_siege_of_the_belt:0 "Siege of the Belt"
 SHL_sw_siege_of_the_belt_desc:0 "The oil belt will be taken not by the sands, but by the guns. The staff chooses a slow war: the columns dig in before the northern districts, sappers prepare positions, and the furnaces cast barrels for heavy batteries. Every day of the siege must cost the North more than it costs Shahrabad.\n\nNobody talks about raids at the meetings any more. They talk about range, gun crew rotations and how many shells a single pour yields."
 SHL_sw_heavy_batteries:0 "Heavy Batteries"
 SHL_sw_heavy_batteries_desc:0 "Ordinary barrels do not crack the concrete of the northern oil tanks. The engineers of the Nine Furnaces take up guns Shahrabad has never cast before: thick-walled howitzers on tractors built for ore platforms. Three shifts in a row inspect the first casting before the master stamps it.\n\nAt the test firing beyond Khazar the old workers recognise in the thunder the sound of collapsing brickwork."
 SHL_sw_sapper_companies:0 "Sapper Companies"
 SHL_sw_sapper_companies_desc:0 "A siege rests on the spade no less than on the gun. Bayrat miners, used to galleries and explosives, sign up for the sapper companies. They dig saps toward the northern positions, bridge the dry riverbeds and clear the mines on the approaches to the oil belt.\n\nAt first the officers laugh at the miners in helmets instead of caps, but they soon stop."
 SHL_sw_veterans_of_the_sands:0 "Veterans of the Sands"
 SHL_sw_veterans_of_the_sands_desc:0 "Whoever survived the storm of the oil belt is no longer a recruit. The veterans are not sent home: they are made senior men in every squad, and the young learn from them to save water, listen to the wind and dig in within minutes.\n\nIn the quarters they are known by their sun-bleached patches. Children argue over whose father reached the fields first."
 SHL_sw_desert_air_wing:0 "Desert Air Wing"
 SHL_sw_desert_air_wing_desc:0 "Over the sands the columns can be seen from afar, and northern aircraft have already found their way to them. Beyond Khazar crews level runways of packed slag, and anti-aircraft crews take up positions on the workshop roofs. There are few pilots, and many of them used to fly mail planes between the desert cities.\n\nThe furnaces halt their shift to listen to the first air battle over Zarkhan on the radio."
 SHL_sw_all_furnaces_to_arms:0 "All Furnaces to Arms"
 SHL_sw_all_furnaces_to_arms_desc:0 "The treasury can wait; the front cannot. The workshops of Khazar and the Nine Furnaces switch to arms metal, export orders are postponed, and new locks are hung on the warehouse gates. The merchants at the Golden Gates see empty quays for the first time and find no one to complain to.\n\nThe quarters see less crockery, cloth and soap. Instead, a train leaves for the front every day, loaded with what yesterday would have been goods."
 SHL_sw_keep_the_markets:0 "Keep the Markets"
 SHL_sw_keep_the_markets_desc:0 "Shahrabad fights on metal sold yesterday and metal that will be sold tomorrow. Khazar decides not to smother trade for the sake of one campaign: the export workshops keep to their old contracts, caravans leave for the neighbours, and the takings go to pay the columns.\n\nThe generals are displeased. They are told that an army without a treasury will last exactly until the first unpaid week."
 SHL_sw_shell_lines:0 "Shell Lines"
 SHL_sw_shell_lines_desc:0 "The furnaces given over to arms must learn to work differently. The masters rebuild the foundry halls into lines: one shift casts shell cases, another bores barrels, a third packs crates of cartridges. The old masters grumble that metal no longer remembers its founder.\n\nBut the columns at Zarkhan no longer count their cartridges one by one."
 SHL_sw_rail_to_the_front:0 "Rail to the Front"
 SHL_sw_rail_to_the_front_desc:0 "A single ore line runs between Khazar and the Zarkhan district, and it is not enough. Railway workers from the quarters lay a second track along the old embankment, set water towers at the sidings and assemble locomotives from ore-hauler spare parts. Work goes on at night by the light of furnace-gas torches.\n\nThe first troop train reaches Zarkhan without a single stop, and the driver holds the whistle down for a long time."
 SHL_sw_market_convoys:0 "Market Convoys"
 SHL_sw_market_convoys_desc:0 "The war has closed the land roads to the north, but not the road to the sea. Metal caravans travel to the ports and onward in ships that Shahrabad charters under its own flags. Armed launches escort every voyage, and the captains receive their routes in sealed envelopes.\n\nThe takings return to Khazar before rumours of a new voyage reach the north."
 SHL_sw_fuel_from_ash:0 "Fuel from Ash"
 SHL_sw_fuel_from_ash_desc:0 "Shahrabad has no oil of its own, but it has mountains of furnace ash, tar and coal dust that were hauled out of the city for decades. The engineers of the Nine Furnaces build distillation columns that turn this refuse into a heavy, foul-smelling fuel that nevertheless burns.\n\nThe column trucks now smell of tar. The drivers joke that they run on the smoke of their own furnaces and no longer wait for northern tankers."
 SHL_sw_furnace_artels:0 "Furnace-Builders' Artels"
 SHL_sw_furnace_artels_desc:0 "The war wears out brickwork faster than any intensified shift. Old furnace-builders long since retired gather into artels and walk the workshops with trowels and wear ledgers. They repair vaults, reline tapholes and teach the young to hear a crack before it runs up the wall.\n\nThe artels ask little for their work: a place by the fire and the right to put their mark on a repaired furnace."
 SHL_sw_desert_workshops:0 "Desert Workshops"
 SHL_sw_desert_workshops_desc:0 "The trade caravans return not only with takings but with machine tools bought from the neighbours. Workshops spring up at the caravan stations beyond Khazar, where mechanics repair the column trucks, replace springs broken on the sand ridges and assemble new vehicles from imported parts.\n\nThe mechanics work under awnings of sun-bleached canvas, and no column leaves for the north without passing through their hands."
 SHL_sw_arsenal_of_the_south:0 "Arsenal of the South"
 SHL_sw_arsenal_of_the_south_desc:0 "Everything the furnaces have learned during the war comes together in one place. New arms workshops are laid down in Khazar and Bayrat, and for the first time Shahrabad's metal is poured not for a house, a city or the treasury, but for the whole war at once.\n\nAbove the gates of the new arsenal they carve not a crest or a seal, but a map of the South from the oil belt to the Golden Gates."
 SHL_sw_sands_choose:0 "The Sands Choose"
 SHL_sw_sands_choose_desc:0 "Shahrabad and the North share no border, and the front runs through other people's wells and caravan stations. The desert states that still keep their banners have already chosen sides. Khazar writes letters to everyone who stood beside it: couriers carry them along Kadir's road, to the wells of Rakhma and to the dry-riverbed patrols.\n\nNo letters are written to those who chose the North. Their names go into a different ledger."
 SHL_sw_buy_the_sands:0 "Buy the Sands"
 SHL_sw_buy_the_sands_desc:0 "In the desert loyalty is for sale, and Khazar is ready to pay. Treasurers carry Golden Gates silver to the allied chiefs, pay for repairing the wells along the road and buy up the caravan masters' debts. A friend you feed need not be guarded.\n\nThe old treasurers wince over the ledgers but do not argue aloud: a bought ally costs less than a fallen son."
 SHL_sw_break_the_sands:0 "Break the Sands"
 SHL_sw_break_the_sands_desc:0 "The desert respects only strength, and Khazar no longer intends to buy what it can take. Occupied oases and stations are placed under military rule: weapons are surrendered, caravans travel with passes, and the whole village answers for a shot in a column's back.\n\nIn Khazar they say fear is more reliable than silver. In the oases people keep silent and remember."
 SHL_sw_desert_subsidies:0 "Desert Subsidies"
 SHL_sw_desert_subsidies_desc:0 "The allies hold the front where Shahrabad has not a single column, and Khazar no longer asks what their loyalty costs. The quartermasters of the allied chiefs come straight to the warehouses by the furnaces, and the treasurers sign their bills without haggling.\n\nWagon trains stretch along the road under foreign banners, and only the stamp on the crates reveals whose furnaces equipped them."
 SHL_sw_caravan_pacts:0 "Caravan Pacts"
 SHL_sw_caravan_pacts_desc:0 "Kadir's road fed the desert long before the war and will feed it afterwards. Khazar signs pacts with the caravan masters: their camels and trucks carry military cargo north and bring back the goods Shahrabad's markets are waiting for. The tolls at the stations are split in half.\n\nThe caravan masters are pleased: for the first time war pays them better than peace."
 SHL_sw_punitive_columns:0 "Punitive Columns"
 SHL_sw_punitive_columns_desc:0 "Those who shoot columns in the back are answered by columns. Detachments without baggage trains move through the desert: they surround the oases where raiders hid, burn the depots and take the elders to Khazar. The commanders are chosen from those who have already lost men in ambushes.\n\nThe roads grow quieter. No one says what it costs the oases themselves."
 SHL_sw_occupation_ultimatums:0 "Ultimatums to the Occupied"
 SHL_sw_occupation_ultimatums_desc:0 "Khazar hands every occupied district the same paper: recognise Shahrabad's authority, surrender the North's weapons and men, open the wells to the columns. The answer is expected by sunset. Criers read the ultimatum in the market squares, and a platoon always stands beside them.\n\nMost sign. Those who did not are not asked the next time."
 SHL_sw_desert_envoys:0 "Desert Envoys"
 SHL_sw_desert_envoys_desc:0 "Whether by money or by force, the desert has learned which side to stand on. Now Khazar sends its neighbours neither treasurers nor punitive detachments, but envoys: old caravan masters, scribes and judges who know the customs of every well. They settle water disputes, hear grievances and speak of a war that will one day end.\n\nIn the chiefs' tents they are received warily, but no longer as strangers."
 SHL_sw_war_correspondents:0 "War Correspondents"
 SHL_sw_war_correspondents_desc:0 "A war no one writes about feels like someone else's war to the quarters. Khazar's newspapers send correspondents to the columns, and the front sends back not reports but names: which quarter a man came from, which furnace he worked at, where he was wounded and whom he saved. Photographs from Zarkhan hang at the workshop gates beside the shift rosters.\n\nEven in the neighbouring oases people read these sheets and retell them at the wells."
 SHL_sw_southern_league:0 "The Southern League"
 SHL_sw_southern_league_desc:0 "An alliance sealed with silver or fear lasts until the first defeat. The chiefs and envoys of all who fight on Shahrabad's side gather in Khazar and sign a common charter: the South fights together, shares water together and makes no separate peace with the North.\n\nThe charter is engraved on a copper plate and hung in the council hall. Room is left beneath it for every new name."
 SHL_sw_quarters_at_war:0 "The Quarters at War"
 SHL_sw_quarters_at_war_desc:0 "The front is far away, but the war has already come to the quarters: in the queues at the bakeries, the empty bunks in the dormitories, the letters read aloud to the whole stairwell. For the first time the quarter elders sit at one table with the city clerks to decide how to live through this war without letting the furnaces go out.\n\nLists of those gone to the front appear on the walls. People read them in the mornings on their way to shift."
 SHL_sw_ration_cards:0 "Ration Cards"
 SHL_sw_ration_cards_desc:0 "There is not enough bread, water and oil for everyone, and it will be shared out by paper rather than by price. Every family in the quarters receives ration cards: more for a worker at the furnace, as much again for a soldier's widow, the same as everyone else for a merchant. Bakeries open on schedule, with clerks holding seals at the doors.\n\nThe queues do not disappear, but there are fewer fights in them. The quarters grumble about the meagre ration and admit that at least it is fair."
 SHL_sw_furnace_martial_law:0 "Martial Law at the Furnaces"
 SHL_sw_furnace_martial_law_desc:0 "The war leaves no time for disputes over shifts. Patrols stand at the workshop gates, strikes are declared treason, and lateness for a shift is judged by the duty officer instead of the master. The curfew puts out the lights of the quarters before the evening pour goes out.\n\nThe workshops have grown quiet. Too quiet, say the old masters, and keep working without raising their eyes."
 SHL_sw_widows_fund:0 "The Widows' Fund"
 SHL_sw_widows_fund_desc:0 "Casualty lists come from Zarkhan every week, and behind every name is a family without a breadwinner. The quarters open a widows' fund: the money comes from the common treasury, and it is shared out by elders who know every family by sight. Orphans are taken as apprentices at the furnaces, widows into the offices and hospitals.\n\nNo one hangs a lock on the fund's door. It is guarded by those it has helped."
 SHL_sw_crest_war_tax:0 "War Tax on the Crests"
 SHL_sw_crest_war_tax_desc:0 "The quarters give their sons to the war, and in Khazar people ask ever louder what the crests give it. The furnace clerks open the houses' ledgers and assess each crest a war tax by the number of its burning furnaces. Safir pays in silence, Loran with a complaint, the lesser houses on credit.\n\nIn the mansions beyond the Golden Gates they speak of robbery. In the quarters they say it was about time."
 SHL_sw_street_tribunals:0 "Street Tribunals"
 SHL_sw_street_tribunals_desc:0 "Martial law demands swift justice. Tables are set up under awnings in the squares of the quarters: an officer, a scribe and two witnesses deal within the hour with thefts from depots, bread speculation and incitement to strike. The crests' stewards who hid metal from the front come before the same court.\n\nThe speculators vanish from the markets. With them vanish those who argued too loudly with the officer."
 SHL_sw_quarter_kitchens:0 "Quarter Kitchens"
 SHL_sw_quarter_kitchens_desc:0 "The crests' tax reaches the quarters as hot soup. Common kitchens open in abandoned warehouses and beside the dormitories: the shift eats by the furnace, children after school, the old at noon. The cooks are the same women who stood in the queues yesterday.\n\nPeople who never knew each other gather by the cauldrons. This is where they sign up for the hospitals, the building sites and the front."
 SHL_sw_home_guard:0 "Quarter Guard"
 SHL_sw_home_guard_desc:0 "The columns have gone north, and Khazar is left guarded by old men, teenagers and the workers of the night shifts. With the crests' money they are issued rifles and armbands and taught to hold crossroads and put out fires after air raids. Every quarter builds its own barricades from ore wagons and slag blocks.\n\nIf the North reaches the furnaces, it will have to take every street."
 SHL_sw_march_on_the_oil_belt:0 "March on the Oil Belt"
 SHL_sw_march_on_the_oil_belt_desc:0 "The northern positions are cracking, and the staff is no longer content with raids and sieges. The columns gather at Zarkhan into a single army, and for the first time in the war Shahrabad marches on the oil belt not for a depot or a road, but for the fields themselves.\n\nDrivers chalk the names of the northern deposits on the armour of their trucks. They promise to wipe them off only on arrival."
 SHL_sw_the_last_line:0 "The Last Line"
 SHL_sw_the_last_line_desc:0 "The North falls back to its last line, and in Khazar they are already drawing the map of the postwar South. Scribes compile inventories of the northern districts: fields, stations, wells, everything paid for with the columns' blood. The staff demands only one thing of the army: give the enemy no time to recover.\n\nThe soldiers who have come this far from Zarkhan know it is the last line not only for the North."
 SHL_sw_not_one_step_back:0 "Not One Step Back"
 SHL_sw_not_one_step_back_desc:0 "The North has come closer to the furnaces than anyone in a hundred years. A general muster is declared in Khazar: shifts, clerks, masters' apprentices and the crests' guards all fall in. The streets are blocked with slag, machine guns are set on the workshop roofs, and at the gate of every furnace stand the people who worked it.\n\nThe sheets on the walls say one thing: beyond Khazar there is no desert left to retreat into."
 SHL_sw_crown_campaign:0 "Crown of the South"
 SHL_sw_crown_campaign_desc:0 "The North is almost broken, and no one in Khazar asks any longer what this war was for. The arsenal, the allies and the columns come together in the last campaign: the South will have one suzerain, and it will bear the furnace stamp. An address to all the desert states is read in the squares, and the masters cast the sign of the future crown from captured metal.\n\nNo one yet knows who will wear it. But everyone knows where it was cast."
 SHL_h_concession_war_bonds:0 "Concession War Bonds"
 SHL_h_concession_war_bonds_desc:0 "The Conclave of Ten wages war like a trading house. The Golden Gates cartel issues war bonds secured on future concessions in the North: Veyr's merchants, the port bankers and the houses themselves buy paper bearing the seal of the ten furnaces. The money comes at once, and the debt can wait for victory.\n\nIn the counting houses they joke that for the first time Shahrabad is selling metal it has not yet poured for oil it has not yet taken."
 SHL_h_presell_northern_fields:0 "Pre-selling the Northern Fields"
 SHL_h_presell_northern_fields_desc:0 "The houses divided the oil belt on paper long ago, and now the cartel sells those shares. Every crest gains first claim on its own field if it pays now. Old rivals at the Conclave table suddenly become allies: no one wants the war to end without a derrick of his own.\n\nThe map of the North in the council hall is painted in the crests' colours long before the first column gets there."
 SHL_c_city_militias:0 "City Militias"
 SHL_c_city_militias_desc:0 "The Southern Compact promised the cities self-government, and the cities answer by defending themselves. Khazar and the chartered districts raise militias from their own residents: commanders are elected at assemblies, weapons are kept in the town halls, and the oath is sworn to the charter, not to a house.\n\nMariam Arbin tours the garrisons and tells each of them the same thing: a city that holds its own wall owes its freedom to no one."
 SHL_c_assembly_of_free_cities:0 "Assembly of Free Cities"
 SHL_c_assembly_of_free_cities_desc:0 "In the middle of the war the compact convenes what was once spoken of only in the quarters: an assembly of all the free cities of the South. Delegates come from Khazar, from the oases, from the districts taken by the columns, and argue about water, taxes and peace as loudly as about the front.\n\nMariam Arbin opens the first session by saying that this war is fought not for the furnaces, but for the cities' right to decide for themselves."
 SHL_d_iron_march_norms:0 "Iron March Norms"
 SHL_d_iron_march_norms_desc:0 "The Furnace Directorate measures the war in norms. Rauf Darban posts new output tables in every workshop: so many barrels per shift, so many shells per cycle, and not a single day of idleness. A master who misses the norm answers to an inspector, not to a council.\n\nThe quarters work themselves to exhaustion. One word appears ever more often in the shift journals: tired."
 SHL_d_full_requisition:0 "Full Requisition"
 SHL_d_full_requisition_desc:0 "Orders are not enough for the Directorate: it needs everything the city has. Inspectors with guards make the rounds of the houses' warehouses and the shops and workshops of the quarters, list the metal, fuel and weapons and carry them off to the front against a receipt bearing Nur's seal.\n\nThe merchants hide their goods, the quarters hide their bread. Jalil Nur answers complaints briefly: after victory the Directorate will repay its debts, and without victory there will be nothing to repay."
 SHL_r_regent_takes_command:0 "The Regent Takes Command"
 SHL_r_regent_takes_command_desc:0 "Darius Safir does not entrust the war to hired generals. The regent rides out to Zarkhan himself, pitches his tent beside the column staff and signs orders with the Safir crest. Officers who served the private guards now answer to one man.\n\nIn the camp they say the regent sleeps three hours a night and knows every company commander by name. In Khazar they say he simply trusts no one but himself."
 SHL_r_noble_retinues:0 "Retinues of the Crests"
 SHL_r_noble_retinues_desc:0 "The regency gave the houses back their furnaces and privileges, and now the crests must repay that debt. Every house sends its own retinue to the front: the family's sons at its head, the furnace guard under its banner, mercenaries on the house's pay. Safir is the first to lead his men to Zarkhan, and the others must keep up.\n\nThe old families recall that the right to a furnace was once granted not by ledgers, but by the sword."
 SHL_k_rifles_for_the_uprising:0 "Rifles for the Uprising"
 SHL_k_rifles_for_the_uprising_desc:0 "Yaroslav Weber's underground has come out of the shadows: in the Svetlogorsk district the oil workers hold the streets and look to the south. The shift councils decide that this uprising is their own war, and in Khazar's workshops they assemble a cargo that would pass no customs post.\n\nGuides lead the caravans by night along dry riverbeds where northern patrols do not go. On the far side the crates are opened by people who have never seen Khazar but already call it their own."
 SHL_k_front_councils:0 "Front Councils"
 SHL_k_front_councils_desc:0 "There are no officers by right of birth in the commune's columns. Every company elects a front council that decides how to share the water, whom to post on watch and when to attack; the commander carries out the decision and answers for it to his comrades. Front delegates travel to Khazar and sit beside the furnace delegates.\n\nSalima Darzi says the commune now has a single shift, from the furnace to the trench."
 SHL_n_emergency_conclave:0 "Emergency Conclave"
 SHL_n_emergency_conclave_desc:0 "The war came before the Conclave could decide who Shahrabad belongs to. The dispute over the tenth furnace is set aside: Jalil Nur calls an emergency session, and for the first time in many years the heads of the houses sit at the table without ledgers and without counting votes.\n\nThey decide one thing: while the war lasts, Shahrabad has one council. Everyone understands that whoever pays for victory will lead the country after it too, but that will be argued later."
 SHL_n_house_war_chest:0 "War Chest of the Houses"
 SHL_n_house_war_chest_desc:0 "The crests open their chests. Safir, Loran and Bayrat pay silver hoarded for generations into the common treasury, and the lesser houses mortgage their future at interest. In return they ask little: that their voice be heard first at the war table.\n\nNur accepts the money and understands that he accepts the terms along with it. After the war the houses will come to collect."
 SHL_n_directors_war_plan:0 "The Directors' War Plan"
 SHL_n_directors_war_plan_desc:0 "The engineers of the Nine Furnaces bring the Conclave not money but a plan: every furnace on a single schedule, every depot under a single seal, every barrel accounted for. Rauf Darban runs war production as he once ran the building of the tenth furnace, and does not ask the crests for permission.\n\nThe houses are outraged, but the front receives its weapons on time. In Khazar people say ever more often that a war is won not by those who pay, but by those who count."
 SHL_sw_raise_quarter_levy:0 "Call Up the Quarters"
 SHL_sw_raise_quarter_levy_desc:0 "The criers come out to the squares by the furnaces once more. The new list is read slowly, name by name, and the shifts see their own off at the workshop gates. Mothers bring bread and water in leather flasks to the assembly point, masters bring a few parting words.\n\nBy evening the column leaves for the north, and another page of empty lines appears in the shift journal."
 SHL_sw_siege_battery:0 "Bombardment: [FROM.GetName]"
 SHL_sw_siege_battery_desc:0 "The heavy batteries roll up to positions beside the neighbouring district. The crews check the range against the well map, spotters climb the dune crests, and by dawn the first shells fly beyond the front line, to where the enemy keeps its depots and workshops.\n\nBy the time the smoke clears the batteries are already limbering up, before the northern guns can find them in return."
 SHL_sw_market_caravans:0 "Market Caravans"
 SHL_sw_market_caravans_desc:0 "A new caravan gathers at the Golden Gates: metal, crockery and cloth from the workshops still working for trade. The caravan masters check passes and water supplies, the guards climb onto the truck roofs, and the column sets off along the road to the neighbouring markets.\n\nKhazar awaits its return as eagerly as news from the front."
 SHL_sw_ash_fuel:0 "Distil the Ash"
 SHL_sw_ash_fuel_desc:0 "The spoil heaps beyond the Nine Furnaces come back to life. Workers load ash and tar into wagons, the distillation columns hum all night, and by morning heavy black fuel smelling of furnace smoke sloshes in the tanks.\n\nThe column drivers meet the first barrels at the plant gates and sign the ledger with tar-stained fingers."
 SHL_sw_quarter_relief:0 "Relief for the Quarters"
 SHL_sw_quarter_relief_desc:0 "Carts of flour, oil and coal travel from the common treasury to the quarters. The elders hand them out by the lists, starting with families whose breadwinner went to the front, and for a while the dormitories are warm and fed again.\n\nThere are fewer complaints in the shift journals that week. Someone even writes in the margin: they remember."
 SHL_sw_martial_tribunal:0 "Military Tribunal"
 SHL_sw_martial_tribunal_desc:0 "Patrols bring the detained to the commandant's office by the main furnaces. The tribunal sits without a break: strike ringleaders, speculators and deserters pass before the officers' table one after another, and the sentences are read out on the spot, on the steps.\n\nThe quarters fall silent. But it is a heavy silence, and the masters look the patrols in the eye less and less."
 SHL_sw_arm_the_uprising:0 "Arm the Uprising"
 SHL_sw_arm_the_uprising_desc:0 "Unmarked crates are being nailed shut in Khazar's workshops again. The caravan leaves by night, guides lead it along dry riverbeds around the northern outposts, and on the far side of the desert Weber's people are already waiting at the agreed well.\n\nEvery such delivery is one more street of Svetlogorsk that will not return to the North's rule without a fight."
