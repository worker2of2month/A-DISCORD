 SHL_city_aid_ready_tt: "Assistance is unused; the capital is held; city support is at least 35 and funds and recruits are sufficient."
 SHL_directorate_aid_ready_tt: "Assistance is unused; the capital is held and a convoy and two raw-material packets are ready."
 SHL_regent_aid_ready_tt: "Assistance is unused; the capital is held and an active pledge and enough recruits are available."
 SHL_commune_aid_ready_tt: "Assistance is unused; the capital is held and enough weapons and recruits are available for one levy."
 SHL_house_aid_tt: "§G400§! £ADISCORD_economy_treasury_texticon now; public debt §R+500§!."
 SHL_city_aid_tt: "Two Furnace Levy formations in the capital. City support §R-15§!."
 SHL_directorate_aid_tt: "Unrest §R+8§!. At war entry: division attack §G+8%§!, supply consumption §R+10%§! for §Y45 days§!."
 SHL_regent_aid_tt: "Two levies in the capital. Furnace liability §R+180§! £ADISCORD_economy_treasury_texticon; unrest §R+15§!."
 SHL_commune_aid_tt: "One paid levy in the capital. Unrest §G-12§!."
 SHL_cistern_charter_ready_tt: "Both regions are held after victory; Mazar is independent and unfactioned; no postwar project has been paid."
 SHL_cistern_concession_ready_tt: "Both regions are held after victory; Mazar is independent and no postwar project has been paid."
 SHL_cistern_charter_tt: "Mazar chooses whether to recover both regions and join our faction. No transfer occurs without its consent."
 SHL_cistern_accept_tt: "Mazar recovers both cistern regions and joins the Southern Compact while remaining independent."
 SHL_cistern_concession_tt: "Both regions return to Mazar. The 450 £ADISCORD_economy_treasury_texticon concession first repays an active pledge; any remainder goes to the treasury."
