 SHL_convene_conclave: "Convene the Conclave"
 SHL_convene_conclave_desc: "The ten seats under the dome of the Golden Gates stand empty most of the year: the heads of the houses rule from their counting rooms and send letters in their stead. A convocation forces them to travel, sit at one table and sign a common supply ledger while the city watches the doors of the hall. A gathered Conclave is always more generous than correspondence, but the agreement holds exactly until the next quarrel."
 SHL_quarter_charter: "Quarter Charter"
 SHL_quarter_charter_desc: "A charter grants the quarter around a furnace its own council, a mutual-aid fund and the right to speak to the owner for every shift."
 SHL_dispatch_order: "Dispatch Order"
 SHL_dispatch_order_desc: "The common dispatch office sees all nine yards in one table for the first time."
 SHL_arbitration_act: "Arbitration Act"
 SHL_arbitration_act_desc: "The shift arbitration works through the backlog of complaints: unpaid night hours, disputed dismissals, a fight at the scales."
 SHL_house_audit: "Audit of the Counting Chamber"
 SHL_house_audit_desc: "The Counting Chamber sends its people with seals and weights to the furnace."
 SHL_desert_embassy: "Desert Embassy"
 SHL_desert_embassy_desc: "For the first time Shahrabad sends a neighbour not a merchant but a resident envoy with a charter of the Conclave."
 SHL_integrate_satellite_decision: "Admit into the League"
 SHL_integrate_satellite_decision_desc: "The Crown of the South promises the neighbours a place inside the League rather than beside it."
 SHL_war_orders_all: "War Orders for Every Furnace"
 SHL_war_orders_all_desc: "Furnace dispatchers receive a common order from the arsenal. Workers check the moulds and prepare metal for the military contract."
 SHL_convene_conclave_tt: "§G+1§! packet of raw materials for every working house furnace, crest pressure §G-5§!."
 SHL_quarter_charter_tt: "In §Y21§! days the furnace receives a quarter charter: every working cycle gives §G+1§! city support and §G-1§! quarter unrest. The charter lapses with the district or when the furnace passes to the state. If the furnace is lost earlier, the price is refunded."
 SHL_dispatch_order_tt: "The donor furnace gives §Y1§! packet at once; in §Y7§! days it reaches the working furnace with the lowest stock. If no such furnace remains, the packet returns to the donor."
 SHL_arbitration_act_tt: "Quarter unrest §G-6§!."
 SHL_house_audit_tt: "In §Y21§! days furnace wear §G-10§!, shortages reset, crest pressure §R+5§!. If the furnace is lost, the political power is refunded."
 SHL_desert_embassy_tt: "In §Y14§! days a resident embassy opens at the neighbour: opinion of Shahrabad §G+20§!, it accepts the South's demands more readily. If the embassy never arrives, the price is refunded."
 SHL_integrate_satellite_tt: "In §Y30§! days the satellite joins the League. If it stops being a satellite earlier, the price is refunded."
 SHL_war_orders_all_tt: "Every working furnace without a quota, order or obligation pours for the arsenal for one cycle; the previous recipients are restored after the pour."
