 # ----- cities -----
 SHL_c_mariam_cabinet: "Mariam Arbin's Cabinet"
 SHL_c_mariam_cabinet_desc: "Mariam Arbin forms her cabinet not from the heads of houses but from those who kept the city ledgers before anyone recognised them. Secretary Rashad brings the seal, accountant Nadiri brings the books, and for the first time in years the papers of the Conclave are signed by the head of the compact rather than a mediator."
 SHL_c_council_delegates: "City Delegates"
 SHL_c_council_delegates_desc: "The Council of Cities is elected by city assemblies: one delegate from every city with a ledger of its own. The houses keep their seats, but next to them sit people backed by streets rather than furnaces."
 SHL_c_shift_assembly: "Assembly of Shifts"
 SHL_c_shift_assembly_desc: "Delegates to the council are nominated by the shift councils at the furnaces. Work journals become electoral rolls, and the duty master of every furnace gains the right to speak for his quarter. The crests call it a coup in notebooks."
 SHL_c_shift_assembly_tt: "Quarter unrest: §G-10§!. Civic support: §G+10§!."
 SHL_c_regular_elections: "Regular Elections"
 SHL_c_regular_elections_desc: "The Council of Cities stops being an occasional gathering: twice a year the delegates return to those who sent them and either receive their mandate again or give up their seats. The compact lives as long as it is confirmed."
 SHL_c_regular_elections_tt: "Every §Y180§! days the council is re-elected: with civic support of at least §Y40§! the mandate is confirmed, otherwise the balance shifts towards the crests and the quarters grumble."
 SHL_c_quarter_militia: "Quarter Militias"
 SHL_c_quarter_militia_desc: "Quarters that gained a voice also gain the right to their own guard. Militias are recruited from the shifts, their weapons are bought with furnace revenue, and their commanders are confirmed by the council. This is an army that knows which streets it defends."
 SHL_c_quarter_militia_tt: "The cities will field §Y2§! factory guard divisions in Shahrabad."
 SHL_c_compact_army: "Compact Army"
 SHL_c_compact_army_desc: "Instead of militias by quarter, the compact hires regulations and instructors. A single compact army answers to the council rather than to a furnace and learns to fight in formation rather than as a crowd at the factory gate."
 SHL_c_compact_army_bonus: "Compact Army"
 SHL_c_registry_of_all: "A Registry for All"
 SHL_c_registry_of_all_desc: "The scribes of the compact walk the workers' quarters with books and ink. Every yard receives an entry, every shift a page. From now on there are no people in Shahrabad who do not exist for the treasury and the council."
 SHL_c_registry_of_all_tt: "Civic support: §G+10§!."
 SHL_c_open_ledger: "Open Ledger"
 SHL_c_open_ledger_desc: "The treasury chamber of the compact posts the accounts of furnaces and cities on the squares. Who received how much and who owes how much is read by everyone who can read, and read aloud to those who cannot. Stealing from an open book is harder than from a closed one."
 SHL_c_open_ledger_tt: "Treasury corruption crises no longer occur."
 SHL_c_charter_of_cities: "Charter of the Cities"
 SHL_c_charter_of_cities_desc: "The constitution of the compact is written into a single charter: who elects, who counts, who defends. It is signed by the cities, the shift councils and those houses that chose to stay at the common table. The rest read it from the other side of the square."
 SHL_c_civic_orders_plus: "Orders for Our Own District"
 SHL_c_civic_orders_plus_desc: "City orders to the furnaces become ordinary business of the compact: the council pays for metal for its workshops in advance and shoulders part of the risk. The furnaces know the city will buy the pour and cast with a steadier hand."
 SHL_c_civic_orders_plus_tt: "The deposit of a civic furnace order is §G30§! treasury lower."
 SHL_c_furnace_schools: "Furnace Schools"
 SHL_c_furnace_schools_desc: "A shift school opens at every furnace: letters, numbers and craft in one yard. Masters teach the young what they were taught at the forge, and the compact pays for boards, books and a warm room."
 SHL_c_furnace_schools_tt: "A school at the chosen furnace raises the training of its shifts by one step."
 SHL_c_quarter_hospitals: "Quarter Hospitals"
 SHL_c_quarter_hospitals_desc: "The burns, lungs and backs of the founders are now treated by quarter hospitals rather than healers by the wall. The compact hires doctors and pays them from the city treasury, not from the mercy of the houses."
 SHL_c_quarter_hospitals_tt: "A hospital at a furnace lowers the unrest of its quarters and strengthens civic support; one per state."
 SHL_c_cooperative_bank: "Cooperative Bank"
 SHL_c_cooperative_bank_desc: "The cities and shift councils pool their funds into one bank of the compact. It lends to workshops, holds the revenue of civic orders and for the first time gives Shahrabad a treasury that the nine houses do not control."
 SHL_c_cooperative_bank_tt: "Treasury: §G+150§!. Treasury capacity: §G+5%§!."
 SHL_c_water_works: "Water Works"
 SHL_c_water_works_desc: "The bank of the compact finances water for the quarters: cisterns, conduits and drilling crews for the artesian horizons. Water stops being a question settled only with Keyzan."
 SHL_c_water_works_tt: "The decision \"Artesian Wells\" costs §Y200§! treasury instead of §Y250§!. Quarter unrest: §G-5§!."
 SHL_c_harbour_works: "Harbour Works"
 SHL_c_harbour_works_desc: "The bank of the compact invests in the road to the sea: the piers of Kerdan, warehouses and ships of its own for the metal. The compact wants to trade with the world without asking Veyr for permission."
 SHL_c_harbour_works_tt: "The decision \"Kerdan Harbour\" costs §Y250§! treasury instead of §Y300§!."
 SHL_c_common_rail: "Common Railway"
 SHL_c_common_rail_desc: "The railway of the compact links Nuran and Sharim with Khazar. It is built by city crews rather than houses, and the first train carries not metal but delegates to a council session."
 SHL_c_charter_round: "Term of the Charters"
 SHL_c_charter_round_desc: "An invitation to the compact cannot lie on the neighbours' tables forever. The Council of Cities sets a term: whoever signs the charter of the wells before it expires becomes a member of the compact; the rest will be offered again, without the first terms."
 SHL_c_charter_round_tt: "A §Y150§!-day mission: the compact waits for two allies; when the term expires, those who refused receive a second offer."
 SHL_c_compact_court: "Court of the Compact"
 SHL_c_compact_court_desc: "Disputes between members of the compact are settled by a common court rather than by the strongest of them. The judges are sent by the cities, the sessions are open, and for the first time the neighbours see Shahrabad not as a creditor but as a party willing to lose a case."
 SHL_c_cistern_charter: "Charter of the Cisterns"
 SHL_c_cistern_charter_desc: "To Mazar, which counted Shahrabad's metal as part of its ration, the compact offers a different arithmetic: shared cisterns of the Zarkhan district and a seat on the council instead of tribute. While Mazar's columns have not crossed the border, this paper can still be signed."
 SHL_c_cistern_charter_tt: "The charter of the cisterns can be offered to Mazar before the war, while it is not an enemy of Shahrabad."
 SHL_c_charters_for_occupied: "Charters for the Occupied Districts"
 SHL_c_charters_for_occupied_desc: "Behind the front line the compact appoints no governors. Scribes arrive in every occupied district with the same charter that Khazar and Keyzan received: a local council, a local ledger, a local guard. The inhabitants find a paper easier to accept than a garrison."
 SHL_c_compact_volunteers: "Volunteers of the Compact"
 SHL_c_compact_volunteers_desc: "The shift councils open enlistment for volunteers. Those who voted for the charter and are now ready to defend it at the front step forward; their weapons come from the city stocks and they choose their own commanders."
 SHL_c_compact_volunteers_tt: "§Y2§! fully armed levies form in Khazar."
 SHL_c_svetlogorye_charter: "Charter of Svetlogorye"
 SHL_c_svetlogorye_charter_desc: "Defeated Svetlogorye receives a charter rather than a governor: the oil workers elect their own council, the fields work on the common terms of the compact, and the former satellites of the North decide for themselves in which capital to sit."
 SHL_c_svetlogorye_charter_tt: "The southern satellites are integrated by consent: the self-governing charters of Svetlogorye and its former subjects join the Southern Compact."
 SHL_c_southern_council: "Council of the South"
 SHL_c_southern_council_desc: "A council of scholars and masters of the whole South opens in Khazar: the engineers of Devyatipechye, the oil workers of the North, the hydraulic engineers of Keyzan. For the first time the compact thinks of the desert as one workshop."
 SHL_c_southern_commons: "Commons of the South"
 SHL_c_southern_commons_desc: "Instead of an academy the compact invests in roads and yards: the crews of Khazar, Arbin and Veyran build what the houses once promised and never built. Victory must be visible from the street."
 SHL_c_compact_assembly: "Assembly of the Compact"
 SHL_c_compact_assembly_desc: "Delegates of every member of the compact gather in one hall. The Council of the South becomes an assembly to which Khazar and the crests alike answer, and the quarters see for the first time that their voice is heard beyond the city."
 SHL_c_open_seats: "Open Seats"
 SHL_c_open_seats_desc: "Seats without names are placed in the council hall: any member of the compact may take them when its question is decided. The crests grumble that this is a bazaar, not a Conclave, but the bazaar has not been this calm in a long time."
 SHL_c_treaty_of_the_south: "Treaty of the South"
 SHL_c_treaty_of_the_south_desc: "The charter of the cities becomes the treaty of the whole South. Shahrabad did not crown itself - it signed the paper together with everyone, and that is exactly why its signature stands first."

 # ----- commune -----
 SHL_k_delegates: "Shift Delegates"
 SHL_k_delegates_desc: "Every furnace sends its delegates to Khazar for the span of one smelt. Nobody sits on the council longer than his shift burns, and the quarters see for the first time that power can be recalled as easily as it is granted."
 SHL_k_standing_council: "Standing Council"
 SHL_k_standing_council_desc: "The delegates return to their furnaces, and a duty master stays in Khazar: Salima Darzi of Sharim, the furnace where the shifts were hardest. The council works around the clock, like the furnaces it represents."
 SHL_k_standing_council_tt: "Duty master §YSalima Darzi§! heads the standing council of the commune instead of the collective Shift Council."
 SHL_k_rotating_smelting: "Smelting in Turns"
 SHL_k_rotating_smelting_desc: "The nine furnaces pass to the cities without a festival and without concessions: the quarters demanded order, not rest. The councils draw up a common order of smelts, and no furnace stands idle while its neighbour chokes on orders."
 SHL_k_rotating_smelting_tt: "All of Shahrabad's furnaces pass to the cities; cold ones are ready for a paid restart."
 SHL_k_no_crests: "No Crests"
 SHL_k_no_crests_desc: "The council strikes the last column from the ledgers - the owner's crest. The houses may keep their seals in their chests, but Shahrabad no longer has a table on which to lay them."
 SHL_k_no_crests_tt: "Crest pressure drops to zero and no longer grows: the hereditary houses make no demands of the commune."
 SHL_k_shift_school: "Shift School"
 SHL_k_shift_school_desc: "The most experienced masters leave the furnaces for the training halls. A shift that once learned from its own burns receives instructors and journals that show where the lining will fail first."
 SHL_k_shift_school_tt: "The school trains the shifts of the furnace with the highest wear."
 SHL_k_common_treasury: "Common Treasury"
 SHL_k_common_treasury_desc: "The chests of Safir and Loran are opened before the delegates. Furnace revenue no longer settles in the houses: the council records every expense in an open ledger, and the quarters finally know what their metal is worth."
 SHL_k_common_treasury_tt: "Treasury: §G+100§! £ADISCORD_economy_treasury_texticon. Treasury capacity: §G+5%§!."
 SHL_k_commune_charter: "Charter of the Commune"
 SHL_k_commune_charter_desc: "The delegates write down what has already become custom: the furnaces belong to the shifts, the council answers to the quarters, and the commune's weapons rest in the hands of those who pour the metal. The charter is short - it is read aloud at every furnace."
 SHL_k_brotherly_supply: "Brotherly Supply"
 SHL_k_brotherly_supply_desc: "A furnace with a full yard does not wait for its neighbour to go cold without ore. The caravan leaves at night, without invoices and without payment: tomorrow the turn may be reversed."
 SHL_k_brotherly_supply_tt: "A furnace with spare ore hands one package to a neighbouring furnace without payment."
 SHL_k_cauldron_plus: "Common Cauldron"
 SHL_k_cauldron_plus_desc: "The commune's repair crews rebuild the lining wider than the old house regulations required. A furnace that leaves the common cauldron lasts longer than the next shift."
 SHL_k_cauldron_plus_tt: "The common cauldron removes §G40§! wear instead of §Y30§!."
 SHL_k_workers_rail: "Workers' Rails"
 SHL_k_workers_rail_desc: "The shifts of Sharim and Arbin lay track between their furnaces in their free hours. A road built by the hands that will haul the ore along it needs no house contract."
 SHL_k_workers_wells: "Wells of the Quarters"
 SHL_k_workers_wells_desc: "The qanat water belongs to the communes of Keyzan, not to the houses. The councils offer the quarters their own answer: artesian wells drilled without treasury money and without debt."
 SHL_k_workers_wells_available_tt: "The §Ywater question§! is open and the qanat dispute is not yet closed"
 SHL_k_workers_wells_tt: "Drilling the artesian wells requires no treasury money."
 SHL_k_arms_for_shifts: "Arms for the Shifts"
 SHL_k_arms_for_shifts_desc: "The arsenal smelt goes straight to the quarters instead of the Conclave's warehouse. Every shift knows where its rifles lie, and every furnace decides for itself who will carry them."
 SHL_k_councils_term: "Term of the Councils"
 SHL_k_councils_term_desc: "An invitation cannot hang in the air forever. The council names the day: by that date the governments of Mazar and Veyr either stand with the councils or their workers hear a different offer."
 SHL_k_councils_term_tt: "The §YTerm of the Councils§! mission starts for §Y180§! days. If neither Mazar nor Veyr has joined the alliance by then, the invitation is repeated on new terms."
 SHL_k_strike_support: "Strike Support"
 SHL_k_strike_support_desc: "Veyr's dockers and Mazar's ration workers read Khazar's leaflets, but a strike does not live on words. The commune sends them money, bread and people who know how to stop a furnace without breaking it."
 SHL_k_strike_support_tt: "Support for the councils in the chosen country grows; at high support its government receives the alliance offer again."
 SHL_k_weber_contact: "Contact with Weber"
 SHL_k_weber_contact_desc: "The first caravan to Yaroslav Weber's underground carries trust rather than an army: a few crates of rifles, a cipher and the name of a man on the far side of the desert. The large delivery will follow a road already proven."
 SHL_k_weber_contact_tt: "The Svetlogorye underground gains contact with the commune and its first rifles; they go to the rising oil workers on the first day of the War for the South.\nQuarter unrest: §G-5§!."
 SHL_k_shift_brigades: "Shift Brigades"
 SHL_k_shift_brigades_desc: "The furnaces do not stop, but half of every shift goes to the front. A brigade forms at its own furnace, under its own banner, and carries rifles of its own smelt."
 SHL_k_shift_brigades_tt: "The shifts field §Y2§! furnace guard divisions in Shahrabad."
 SHL_k_strikes_on_fields: "Strikes on the Fields"
 SHL_k_strikes_on_fields_desc: "Raids on the oil belt no longer need approval: the oil workers of the North shut down the derricks themselves as soon as the commune's columns approach the fields."
 SHL_k_strikes_on_fields_tt: "The §YRaid on the Oil Fields§! decision no longer costs political power."
 SHL_k_union_of_councils: "Union of Councils"
 SHL_k_union_of_councils_desc: "Victory gives the commune no subjects. The councils of the liberated districts enter the common assembly with the same rights as the shifts of Khazar, and the South is governed for the first time from one hall without a single crest on the wall."
 SHL_k_union_of_councils_tt: "Shahrabad's southern satellites join the commune under the rules of the union of councils."
 SHL_k_oil_commune: "Oil Commune"
 SHL_k_oil_commune_desc: "The derricks of the Svetlogorsk belt pass to the oil workers' councils. The rebels the commune armed across the desert now run the extraction themselves and send fuel to the furnaces without the ladder of seals."
 SHL_k_furnace_commune: "Furnace Commune"
 SHL_k_furnace_commune_desc: "The South feeds the furnaces, not the other way round. Oil and ore from the liberated districts flow to Khazar, where the shifts raise new workshops beside the old furnaces."
 SHL_k_no_more_crests: "No More Crests"
 SHL_k_no_more_crests_desc: "The last houses of the South disband their guards and surrender their seals. Nobody persecutes them: the crests simply have no furnace left to stand behind."
 SHL_k_duty_master: "Duty Master of the South"
 SHL_k_duty_master_desc: "The councils of the whole South recognise one order of duty. The master who signs decisions in Khazar now answers for every furnace and derrick from the Golden Gates to the oil belt."
 SHL_k_fire_of_the_south: "Fire of the South"
 SHL_k_fire_of_the_south_desc: "The commune of fire has ceased to be a city and become the South. The furnaces burn for all who keep them, water and oil belong to the communes, and the crests remain in the history books."

 # ----- directorate -----
 SHL_d_nur_director: "Nur the Director"
 SHL_d_nur_director_desc: "For twenty years Jalil Nur kept the peace between nine houses while owning nothing but the small furnace of Nuran. Now the mediator signs orders: the Conclave cabinet becomes the Directorate chancellery, and secretary Rashad carries the seal from the hall of crests to the building on Khazar square."
 SHL_d_state_furnaces_law: "Law on State Furnaces"
 SHL_d_state_furnaces_law_desc: "The Law of Continuous Fire is rewritten in one line: the furnace burns for Shahrabad. The houses keep their names and courtyards, but ledgers, shifts and raw material are run by Darban's engineering board. A cold furnace no longer returns to anyone - it is already the state's."
 SHL_d_state_furnaces_law_tt: "Every furnace of Shahrabad is assigned to the Directorate."
 SHL_d_concessions_law: "Law on Concessions"
 SHL_d_concessions_law_desc: "The Directorate has no wish to maintain nine courts. A house willing to pay gets its furnace back on lease - with a state ledger, a state inspector and the Directorate's right to end the contract by a single order. The crests call it restoration; Nur calls it accounting."
 SHL_d_concessions_law_tt: "A lease returns a furnace to its house for a treasury payment; each concession strengthens the crests' voice in the Conclave."
 SHL_d_darban_engineers: "Darban's Engineers"
 SHL_d_darban_engineers_desc: "Rauf Darban built the tenth furnace while the others argued over who would own it. His engineering house becomes the technical staff of the Directorate: workshop drawings, masonry standards and draught calculations go out to all nine furnaces as orders."
 SHL_d_military_directorate: "Directorate of Armaments"
 SHL_d_military_directorate_desc: "The first dispute of the new state is what to build. Darban demands arms workshops at Nine Furnaces: while the neighbours count tolls and rations, the Directorate must count rifles. Civilian orders can wait."
 SHL_d_industrial_directorate: "Directorate of Construction"
 SHL_d_industrial_directorate_desc: "Nur chooses otherwise: a state without factories and roads of its own will not hold the furnaces either. Khazar receives its first state factory, and the Directorate's road parties reach the tracks before the gunsmiths."
 SHL_d_directorate_courts: "Directorate Courts"
 SHL_d_directorate_courts_desc: "The Night of Crests taught Nur not to wait for ultimatums. The industrial courts of the Directorate hear cases against houses for hidden revenue and halted shifts, and the Conclave guard carries out the sentence. The quarters notice that only crests are judged, and ask who will judge the Directorate."
 SHL_d_directorate_courts_tt: "Crest pressure: §G-10§!. Quarter unrest: §R+5§!."
 SHL_d_quotas_law: "Law on Quotas"
 SHL_d_quotas_law_desc: "Every furnace receives a mobilisation norm: as much metal and as many shifts as the Directorate says. A quota is announced by order, not by contract; the quarters that get overtime shifts without extra pay remember whose order it was."
 SHL_d_quotas_law_tt: "A quota turns the chosen furnace to the arsenal for two cycles and yields §Y600§! £infantry_equipment_texticon on top of the pour; the quarters of that furnace answer with unrest."
 SHL_d_iron_charter: "Iron Charter"
 SHL_d_iron_charter_desc: "The charter fixes what has already become habit: furnaces, depots, roads and guard obey a single order. Shahrabad calls itself Iron not for the sake of weapons but for an order in which no house and no quarter can stop the fire."
 SHL_d_directorate_railway: "Directorate Railway"
 SHL_d_directorate_railway_desc: "Darban lays rails from Nine Furnaces to Khazar: metal from the furnaces to the capital's depots, coal and ore back. For the Directorate the railway matters more than any treaty: orders travel along it."
 SHL_d_directorate_railway_tt: "The works will raise the infrastructure of Nine Furnaces and Khazar."
 SHL_d_state_bank: "State Bank of the Furnaces"
 SHL_d_state_bank_desc: "Furnace revenue is no longer kept in the chests of the houses. The Directorate bank gathers it in Khazar and releases it only by order: for raw material, for the road, for weapons. Accountant Nadiri sees all nine ledgers on one table for the first time."
 SHL_d_state_bank_tt: "Treasury: §G+200§! £ADISCORD_economy_treasury_texticon."
 SHL_d_arsenal_orders_plus: "Arsenal Orders"
 SHL_d_arsenal_orders_plus_desc: "The Directorate arsenal stops being a customer. It sets the price, and the furnace is obliged to pour. Arms orders become cheaper not because metal is cheaper but because there is no one left to bargain with."
 SHL_d_arsenal_orders_plus_tt: "Arsenal orders to the furnaces cost §Y30§! £ADISCORD_economy_treasury_texticon less."
 SHL_d_fuel_depots: "Fuel Depots"
 SHL_d_fuel_depots_desc: "Northern oil reaches Shahrabad by caravan and may stop arriving on any day. The Directorate builds state storage in Khazar and fills it while Svetlogorye is still selling."
 SHL_d_cannon_works: "Cannon Works"
 SHL_d_cannon_works_desc: "The founders of Nine Furnaces can cast more than rolled stock. The Directorate sets up a gun shop at Darban's furnace: the first Directorate batteries are assembled from metal that went to export yesterday."
 SHL_d_truck_works: "Truck Works"
 SHL_d_truck_works_desc: "The desert eats convoys faster than the enemy does. The Directorate assembles truck works in Khazar: Directorate vehicles will carry metal, shells and water where caravans cannot keep up."
 SHL_d_evacuation_plan: "Evacuation Plan"
 SHL_d_evacuation_plan_desc: "Darban's engineers assign every workshop to its wagons: what leaves first, who stays to bank the furnace, where the drawings go. A plan drawn up for defeat gathers all the knowledge of the furnaces in one place for the first time."
 SHL_d_ultimatum_term: "Term of the Ultimatum"
 SHL_d_ultimatum_term_desc: "Keyzan and Veyr have received the demand and are now playing for time. The Directorate sets a term: one hundred and twenty days to answer. Those who stay silent will not be asked again by Iron Shahrabad."
 SHL_d_ultimatum_term_tt: "The mission §YTerm of the Ultimatum§! begins: after §Y120§! days Keyzan and Veyr, if they have not joined Shahrabad, receive a demand for annexation followed by war."
 SHL_d_march_logistics: "Convoy of the March"
 SHL_d_march_logistics_desc: "The iron march crosses sands with neither roads nor wells. The Directorate takes two pours from the furnaces for spare parts and field equipment at the state price: the houses that were once paid for the convoy now receive an order."
 SHL_d_march_logistics_tt: "A campaign convoy at a furnace costs §Y90§! £ADISCORD_economy_treasury_texticon instead of 120."
 SHL_d_occupation_administration: "Administration of Occupied Lands"
 SHL_d_occupation_administration_desc: "Where the Directorate arrives, its chancellery remains. Annexed districts receive an inspector, a ledger and the Conclave guard before they receive water and bread. Resistance is met with accounting, not negotiation."
 SHL_d_war_orders_all: "War Orders to Every Furnace"
 SHL_d_war_orders_all_desc: "When the War for the South begins, the Directorate arsenal does not wait for pours in turn. The Khazar depots hand the front everything accumulated over years of orders, and every furnace receives a war norm."
 SHL_d_guard_to_front: "Furnace Guard to the Front"
 SHL_d_guard_to_front_desc: "The furnace guard protected the workshops from strikes and crests. Now the Directorate puts it under the banners: furnace guard divisions march south out of Khazar, and the quarters themselves take over guarding the workshops."
 SHL_d_guard_to_front_tt: "The Directorate fields §Y2§! furnace guard divisions in Khazar."
 SHL_d_general_governorate: "General Governorate"
 SHL_d_general_governorate_desc: "The south receives a single administrator. The defeated capitals become residences of the Directorate's governors-general; their councils are dissolved, their ledgers rewritten after the Khazar model, their seals handed to Nur's chancellery."
 SHL_d_general_governorate_tt: "The defeated states of the south are integrated as general governorates of the Directorate under the terms of the peace for the South."
 SHL_d_iron_south_rail: "Iron Railway of the South"
 SHL_d_iron_south_rail_desc: "One line is laid from Khazar through Kerdan to the oil belt. The Directorate railway joins the furnaces to the fields that belonged to Svetlogorye yesterday: metal goes south, fuel goes north, both on the state timetable."
 SHL_d_iron_south_garrisons: "Garrisons of the South"
 SHL_d_iron_south_garrisons_desc: "The railway can wait: first what was taken must be held. The Directorate forms garrison divisions of the furnace guard for the annexed districts and posts them where the dry-riverbed patrols stood only yesterday."
 SHL_d_iron_south_garrisons_tt: "The Directorate fields §Y3§! furnace guard divisions in Khazar for garrison duty in the south."
 SHL_d_iron_crown: "Iron Crown"
 SHL_d_iron_crown_desc: "Shahrabad does not crown Nur - the Directorate knows no crowns. But the south from the qanats to the oil belt lives by one timetable, and the old houses admit that the mediator they tolerated has become the state."
 SHL_d_directorate_eternal: "Directorate Forever"
 SHL_d_directorate_eternal_desc: "The temporary administration of the furnaces, declared for a year, is never revoked. The Directorate becomes the form of the state: crests and quarters argue over quotas, but no one asks any longer who owns the fire."
 SHL_d_nur_legacy: "Nur's Legacy"
 SHL_d_nur_legacy_desc: "Jalil Nur leaves the hall of crests as quietly as he entered it. His legacy is neither a house nor a furnace but a chancellery that works without him: engineers sign the orders, and the fire burns on schedule."

 # ----- houses -----
 SHL_h_cartel_price: "Fixed Cartel Price"
 SHL_h_cartel_price_desc: "Loran and Safir insist that a buyer must know the price of metal a year ahead. The cartel posts a single tariff at the Golden Gates and refuses to haggle with every caravan."
 SHL_h_cartel_price_tt: "The export furnace sells its pour at a fixed §Y60§! £ADISCORD_economy_treasury_texticon per cycle."
 SHL_h_metal_exchange: "Metal Exchange"
 SHL_h_metal_exchange_desc: "Kerdan and Darban call a fixed price a gift to the buyer. An exchange opens at the Golden Gates: the metal rate moves with every pour, and with it the houses' revenue and risk."
 SHL_h_metal_exchange_tt: "Export furnace revenue follows the exchange rate: §Y45§! to §Y75§! £ADISCORD_economy_treasury_texticon per cycle instead of a fixed §Y60§!."
 SHL_h_guild_schools: "Guild Schools"
 SHL_h_guild_schools_desc: "The cartel's masters open schools under the craft guilds. Apprentices learn from all ten houses rather than one and carry away the methods of Shahrabad's best smelters."
 SHL_h_house_guards_charter: "Charter of the House Guards"
 SHL_h_house_guards_charter_desc: "The Conclave writes down the rights and duties of the private guards: who feeds them, whom they obey on the march and where a house's courtyard ends. The crests receive law instead of suspicion."
 SHL_h_house_guards_charter_tt: "The houses pay for §Y2§! furnace guard divisions in Khazar. Crest pressure: §G-10§!."
 SHL_h_conclave_mercenaries: "Hired Guard of the Conclave"
 SHL_h_conclave_mercenaries_desc: "Rather than arming every courtyard, the Conclave signs contracts with desert guard brigades. The cartel's common chest pays, and the brigades answer to the mediator rather than to a crest."
 SHL_h_conclave_mercenaries_tt: "Hiring the desert guard costs §G25%§! less: §Y225§! £ADISCORD_economy_treasury_texticon instead of 300."
 SHL_h_golden_gate_festival: "Festival of the Golden Gates"
 SHL_h_golden_gate_festival_desc: "On the day the trading season opens, the cartel gives metal to the city: grilles, lamps and well windlasses. The quarters remember who pours the metal while caravans line up beyond the gates."
 SHL_h_heralds_court: "Court of Crests"
 SHL_h_heralds_court_desc: "The houses establish their own court over conspiracies within the Conclave. Arresting a crest no longer takes the directorate: a ruling of seven furnaces is enough. The quarters see a new owners' pact in it."
 SHL_h_heralds_court_tt: "In the crest crisis the houses may arrest conspirators, a step previously open only to the directorate. Quarter unrest: §R+5§!."
 SHL_h_council_of_ten: "Council of Ten"
 SHL_h_council_of_ten_desc: "The tenth furnace receives not only a seat but a vote. The Conclave's protocol is rewritten: the crests' consent is now counted from ten fires, and mediator Nur keeps the tally himself."
 SHL_h_council_of_ten_tt: "The tenth furnace of Devyatipechye counts as a house vote in the Conclave tally."
 SHL_h_tenth_house_seat: "Seat of the Tenth House"
 SHL_h_tenth_house_seat_desc: "The crest of the tenth house is hung in the Conclave hall beside the nine old ones. The engineers' society that built a furnace without an owner becomes a house with one, and the Conclave of Nine passes into history."
 SHL_h_export_houses: "Export Houses"
 SHL_h_export_houses_desc: "The houses that work for export receive a common office at the Golden Gates: the cartel's brokers sign contracts and pay an advance before the pour has cooled."
 SHL_h_export_houses_tt: "Export contract advance: §Y90§! £ADISCORD_economy_treasury_texticon instead of 60."
 SHL_h_rail_to_sea: "Road to the Sea"
 SHL_h_rail_to_sea_desc: "Kerdan and Salik lie on the metal's way to the piers of Veyr. The cartel puts its revenue into embankments and stations on this stretch so caravans no longer depend on the season."
 SHL_h_rail_to_qanats: "Road to the Qanats"
 SHL_h_rail_to_qanats_desc: "Arbin and Loran drink Keyzan's water and feed the western furnaces. The cartel lays a road along the qanats so ore, water and coal reach the furnaces without delay."
 SHL_h_cargo_insurance: "Veyr Cargo Insurance"
 SHL_h_cargo_insurance_desc: "Every cargo lost in the sands used to fall on a single house. Now the office at the Golden Gates insures caravans and ships for a common premium, and Veyr answers for the piers."
 SHL_h_cargo_insurance_tt: "Insurance programme: for a treasury premium the houses receive §Y5§! convoys and an insured cargo spirit for §Y180§! days."
 SHL_h_house_credit: "House Credit to Neighbours"
 SHL_h_house_credit_desc: "Neighbours who cannot pay for metal receive it on credit. The office enters every caravan into its ledger, and the ledger grows heavier faster than the debtors' purses."
 SHL_h_house_credit_tt: "A credit makes the neighbour a debtor of the houses and returns §Y25§! £ADISCORD_economy_treasury_texticon for six consecutive cycles."
 SHL_h_veyr_harbour_share: "Share in the Piers of Veyr"
 SHL_h_veyr_harbour_share_desc: "The trade union is set in stone: the houses buy a share of the glass ports and receive piers of their own. The chamber of Veyr calls it partnership; the cartel calls it collateral."
 SHL_h_veyr_harbour_share_available_tt: "Veyr is Shahrabad's trade partner and is not at war with it"
 SHL_h_bank_of_houses: "Bank of the Houses"
 SHL_h_bank_of_houses_desc: "The office at the Golden Gates becomes a bank: the deposits of ten houses, insurance premiums and the neighbours' debt ledgers are kept in one vault under one seal."
 SHL_h_bank_of_houses_tt: "Treasury: §G+200§! £ADISCORD_economy_treasury_texticon. Treasury capacity: §G+5%§!."
 SHL_h_debt_term: "Term of the Debt"
 SHL_h_debt_term_desc: "The debt ledgers of Rakhma and Sardan are closed with a date. Before it the houses are willing to talk about a protectorate; after it the talking will be done by envoys with an escort."
 SHL_h_debt_term_tt: "Mission §YTerm of the Debt§!: Rakhma and Sardan have §Y180§! days to accept a protectorate or join the alliance. Otherwise the houses will demand annexation."
 SHL_h_kerdan_trading_house: "Trading House in Kerdan"
 SHL_h_kerdan_trading_house_desc: "House Kerdan opens a trading house in its capital for the chamber of Veyr. The partner is offered a place under the hand of the Conclave of Ten, keeping its ports and chamber, without a war for the key to the sea."
 SHL_h_kerdan_trading_house_tt: "§YVeyr§! receives an offer to become a satellite of Shahrabad under the guarantees of the trade union."
 SHL_h_road_stations: "Stations of the Great Road"
 SHL_h_road_stations_desc: "The caravan stations of the Kadir road pass under the cartel's management. Where the road already belongs to the houses they are rebuilt; where it remains foreign, the houses sell their rights to whoever pays."
 SHL_h_road_stations_available_tt: "The dispute with Kadir is closed: it has submitted, joined the alliance or been annexed"
 SHL_h_road_stations_tt: "The road stations remain with Kadir: their rights can be sold once for §Y150§! £ADISCORD_economy_treasury_texticon."
 SHL_h_hired_contracts: "Hired Contracts"
 SHL_h_hired_contracts_desc: "The war for the South lifts the restrictions: the cartel signs contracts with any desert guard brigade willing to march north and does not wait for the previous one to return."
 SHL_h_hired_contracts_tt: "For the duration of the war for the South the desert guard can be hired without waiting between contracts."
 SHL_h_buy_garrisons: "Buying Out the Garrisons"
 SHL_h_buy_garrisons_desc: "The houses buy the garrison duty from the cities: the quarter guards leave for the front, and levies paid by the cartel take their place."
 SHL_h_buy_garrisons_tt: "The houses pay for §Y2§! furnace guard divisions in Khazar."
 SHL_h_concession_of_svetlogorye: "Svetlogorye Concession"
 SHL_h_concession_of_svetlogorye_desc: "The oil fields of the North are no longer a foreign state but a concession of the houses. The cartel buys out the governors' share, installs its own managers and draws Shahrabad's border along the oil belt."
 SHL_h_concession_of_svetlogorye_tt: "Shahrabad's southern satellites are integrated by purchase on the terms of the houses' course."
 SHL_h_southern_exchange: "Exchange of the South"
 SHL_h_southern_exchange_desc: "An exchange for the whole South opens in Khazar: oil, metal and desert water are traded under one roof, and that roof belongs to the cartel."
 SHL_h_southern_bank: "Bank of the South"
 SHL_h_southern_bank_desc: "The bank of the houses becomes the bank of the South. The neighbours' treasuries are kept in the vaults of Khazar, and every deal in the deserts leaves its share there."
 SHL_h_southern_bank_tt: "Treasury: §G+400§! £ADISCORD_economy_treasury_texticon. Treasury capacity: §G+10%§!."
 SHL_h_crown_of_trade: "Crown of Trade"
 SHL_h_crown_of_trade_desc: "The South acknowledges a suzerain who wears no crown: the Conclave of Ten rules by contracts, debts and the price of metal. Caravans go where the cartel says, and that is enough."
 SHL_h_ten_crests_forever: "Ten Crests Forever"
 SHL_h_ten_crests_forever_desc: "The crests of ten houses are carved above the Golden Gates. The quarters still keep the furnaces burning, but the Conclave considers the question of who owns Shahrabad closed."
 SHL_h_veyr_junior_partner: "Veyr, the Junior Partner"
 SHL_h_veyr_junior_partner_desc: "The chamber of Veyr keeps its ports, its flag and its own book of tolls. In return it acknowledges that the key to the sea is now kept in Khazar."
 SHL_h_veyr_junior_partner_tt: "Veyr remains a satellite of Shahrabad and keeps its chamber."

 # ----- regency -----
 SHL_r_safir_cabinet: "Safir's Cabinet"
 SHL_r_safir_cabinet_desc: "The regent does not dissolve the Conclave's cabinet - he reseats it. The secretary, the guard coordinator and the furnace accountant receive new seals bearing the Safir crest and keep their old desks. The offices work as before; only the signatures under their papers now belong to a house, not to a mediator."
 SHL_r_new_registry: "New Registry of Crests"
 SHL_r_new_registry_desc: "Darius Safir refuses to return everything to everyone. The Council of Crests registers the houses whose furnace burns today; cold works stay with whoever holds them, and their former masters receive a promise instead of a seat. The old families call it treason, the cities call it common sense."
 SHL_r_new_registry_tt: "Burning house furnaces return to their crests; cold ones stay with their current owners. The votes of the Council of Crests are recounted by working furnaces."
 SHL_r_regent_guard: "Regent's Guard"
 SHL_r_regent_guard_desc: "One guard under the Safir crest instead of nine private retinues. The houses pay into the regent's common treasury, and he recruits the men, arms them with factory rifles and assigns their watches. The Veyran guard serves as the model and is the first to swear to the regent."
 SHL_r_regent_guard_tt: "The regent raises levies for the country's treasury and manpower; the first levy returns the house guard to the ranks."
 SHL_r_crest_press: "Seal of the Crests"
 SHL_r_crest_press_desc: "The printing houses of Khazar get a new client. Furnace ledgers, cabinet notices and workers' leaflets appear with the regency's crest seal, and whatever lacks the seal is taken off the stalls. The quarters read their journals aloud so as not to forget what was in them."
 SHL_r_crest_press_tt: "Quarter unrest: §R+5§!."
 SHL_r_debt_courts: "Debt Courts"
 SHL_r_debt_courts_desc: "A pledge of revenue no longer waits for its term. Regency courts sit at the furnaces, read the ledgers and order foreclosure the same day if a house judges that the obligation is not being met. The judges are appointed by the crests and answer only to them."
 SHL_r_hereditary_seats_restored: "Hereditary Seats"
 SHL_r_hereditary_seats_restored_desc: "A seat in the Council of Crests passes by inheritance again, not by the results of a ledger. The regent returns to the houses what the Conclave treated for decades as a temporary concession, and fixes it in a charter signed by all nine heads."
 SHL_r_regency_charter: "Regency Charter"
 SHL_r_regency_charter_desc: "The charter fixes what Darius Safir called a temporary measure: the regent rules in the name of the crests, the Council of Crests confirms the cabinet, the furnaces belong to the houses, and the Law of Continuous Fire protects not the city but the house's right to the fire. The temporary has become hereditary."
 SHL_r_sell_concessions: "Sale of Future Concessions"
 SHL_r_sell_concessions_desc: "The regent's treasury is full of promises and empty of money. Safir sells the right to future furnaces, future mines and future tolls to whoever pays today. The houses buy eagerly: every concession is one more seat at the table that nobody can take away."
 SHL_r_pledge_plus: "Preferential Pledge"
 SHL_r_pledge_plus_desc: "Houses pledging a furnace's revenue receive a concession from the regent: the obligation is recorded cheaper than before, and Safir's treasury absorbs the difference. The pledge becomes an ordinary line of the household budget rather than a last resort."
 SHL_r_pledge_plus_tt: "Debt on new revenue pledges - §Y150§! instead of the previous rate."
 SHL_r_crest_bank: "Bank of the Crests"
 SHL_r_crest_bank_desc: "The nine houses pool part of their revenue in a common bank under the regent's guarantee. The bank grants the treasury its first loan and takes as collateral what it always has: future pours and future votes. Above the bank's door hangs the Safir crest, not the Conclave's."
 SHL_r_crest_bank_tt: "Treasury: §G+250§! £ADISCORD_economy_treasury_texticon. National debt: §R+200§!."
 SHL_r_house_mines: "Mines of the Houses"
 SHL_r_house_mines_desc: "Bayrat receives a concession for new galleries in exchange for a share of ore for the regent's treasury. Darban's engineers mark out the seams, Sharim's workers go down the shafts, and the house of Bayrat extends its underground holdings for the first time in a generation."
 SHL_r_house_rails: "Rails of the Houses"
 SHL_r_house_rails_desc: "Safir and Veyran build branches from their furnaces to the border road. The track belongs to the houses, the wagons to the houses, the passage tolls to the houses; the treasury gets its share only because the regent signed the concession. The furnaces of Safir and Veyran stop depending on the Conclave's common roads."
 SHL_r_tolls: "Tolls of the Crests"
 SHL_r_tolls_desc: "Toll posts go up on the houses' roads. Every caravan, carter and trader pays the crest for passage, and the houses hand part of that money to the regent so the treasury spends less on the quarters. The toll replaces the tax, and the crest replaces the treasurer."
 SHL_r_kadir_marriage: "Marriage with Kadir"
 SHL_r_kadir_marriage_desc: "The Sun Throne of Kadir and the house of Safir seal their alliance the old way. The regent's daughter travels to Kadir with a dowry of metal, and Shahrabad gains as kin a throne whose lands carry the caravan road to Svetlogorye. If the throne is already allied, the marriage merely seals the treaty; if not, it is a second, insistent invitation."
 SHL_r_kadir_marriage_tt: "§YKadir§! receives a renewed invitation to Shahrabad's alliance as a kindred throne."
 SHL_r_toll_term: "Term of the Tolls"
 SHL_r_toll_term_desc: "The regent names the day. Sardan and Rahma must acknowledge their toll debt and come under Shahrabad's hand before that term; afterwards they will be spoken to not by accountants but by the guard. Letters under the Safir seal leave for both courts at once."
 SHL_r_toll_term_tt: "The mission \"Term of the Tolls\" begins: §Y150§! days for Sardan and Rahma to submit. When the term expires, those who have not submitted receive a demand of annexation."
 SHL_r_fief_promises: "Promise of Fiefs"
 SHL_r_fief_promises_desc: "The regent promises the houses what he does not yet have: the lands of the South, divided into fiefs by the number of crests. Every house knows which road, which well and which track will fall to it after victory, and fields its men not for the treasury but for an inheritance."
 SHL_r_fief_promises_tt: "Crest pressure: §R+10§!."
 SHL_r_hire_armies: "Hired Armies"
 SHL_r_hire_armies_desc: "War cancels the queue for desert guard contracts. The houses hire everyone willing to march for metal, and field the first such company at their own expense - as proof that the promised fiefs are worth a life."
 SHL_r_hire_armies_tt: "Desert guard contracts are signed without the waiting period between hires while the war for the South lasts. The houses field one levy at once."
 SHL_r_sell_future: "Selling the Future"
 SHL_r_sell_future_desc: "While the war lasts, the regent sells concessions on everything not yet conquered: the oil of the South, the wells of Rahma, the ports of Veyr. Buyers pay today and receive a paper worth exactly as much as the guard's victories."
 SHL_r_sell_future_tt: "Concession sales are available without the waiting period between deals while the war for the South lasts."
 SHL_r_fiefs_of_the_south: "Fiefs of the South"
 SHL_r_fiefs_of_the_south_desc: "Victory pays for the promises. The defeated lands are divided into fiefs among the crests: every house receives a road, a well or a track, and the regent receives the oath of new vassals. The map of the South is redrawn under nine seals."
 SHL_r_fiefs_of_the_south_tt: "Shahrabad's satellites are integrated as fiefs of the houses following the war for the South."
 SHL_r_kadir_junior: "The Junior Throne"
 SHL_r_kadir_junior_desc: "The Sun Throne keeps its crown and its court. Kadir remains the regency's junior partner: its caravan road serves Shahrabad, but its lands are not divided into fiefs, and its ruler sits at the table of the crests as kin, not as a subject."
 SHL_r_kadir_junior_tt: "§YKadir§! keeps its throne: the integration of fiefs does not touch it."
 SHL_r_debt_empire: "Empire of Debts"
 SHL_r_debt_empire_desc: "The new fiefs are mortgaged before they begin to yield. The regent borrows against them from the bank of the crests, and against that from the neighbours, and the treasury fills with money the South will repay for generations."
 SHL_r_debt_empire_tt: "Treasury: §G+500§! £ADISCORD_economy_treasury_texticon. National debt: §R+300§!."
 SHL_r_crest_empire: "Empire of Crests"
 SHL_r_crest_empire_desc: "The regent refuses loans and rules with what there is: nine crests, their fiefs and their guards. The quarters of the South receive order without promises, and the Council of Crests receives a power the Conclave never had."
 SHL_r_crown_of_crests: "Crown of the Crests"
 SHL_r_crown_of_crests_desc: "Darius Safir accepts the crown of the South in the name of the nine houses. The regency that began as a temporary measure after the Night of Crests becomes hereditary rule over the deserts from the Golden Gates to the oil belt."
 SHL_r_regent_forever: "Regent Forever"
 SHL_r_regent_forever_desc: "Nobody asks any longer when the regency will end. The Council of Crests decrees that the office of regent is inherited in the house of Safir, and writes it into the charter in the same hand that once wrote the word \"temporary\"."

 # ----- script -----
 SHL_furnace_school: "Furnace School"
 SHL_furnace_school_desc: "The masters of the chosen furnace take apprentices from their own quarter. While the intake lasts there are extra hands at the brickwork; next season the shift is led by people who know this furnace."
 SHL_furnace_school_tt: "In §Y42§! days the furnace's training §G+1§! (up to 2), quarter unrest §G-2§!. If the furnace is lost, the price is refunded."
 SHL_training_room_tt: "The furnace can still take a trained shift"
 SHL_quarter_hospital: "Quarter Hospital"
 SHL_quarter_hospital_desc: "Burns and furnace dust were treated in the houses' infirmaries until now. A city hospital at the furnace gate takes everyone in shift order."
 SHL_quarter_hospital_tt: "In §Y56§! days the state gets a hospital: quarter unrest §G-4§!, city support §G+3§!. One hospital per state."
 SHL_hospital_once_tt: "This state has no hospital yet"
 SHL_mobilisation_quota: "Mobilisation Quota"
 SHL_mobilisation_quota_desc: "The Directorate assigns the chosen furnace's pour to the arsenal. The owner keeps the furnace but does not dispose of its metal for two cycles."
 SHL_mobilisation_quota_tt: "For §Y2§! cycles the furnace delivers metal to the arsenal only; quarter unrest §R+4§!. When the term ends: §G+600§! £infantry_equipment_texticon beyond the pour."
 SHL_quota_free_tt: "The furnace has no quota and no order"
 SHL_state_concession: "Concession to a House"
 SHL_state_concession_desc: "A state furnace is leased back to its former house. The Directorate gets money at once; the house gets its vote and the duty to keep the fire."
 SHL_state_concession_tt: "The furnace returns to its owning house; treasury §G+100§! £ADISCORD_economy_treasury_texticon; Conclave balance §R-0.05§! towards the crests."
 SHL_state_furnace_tt: "The furnace belongs to the state"
 SHL_debt_tribunal: "Debt Tribunal"
 SHL_debt_tribunal_desc: "The court of crests does not wait for the pledge to mature. The ruling is issued in a day, and the furnace passes to the city before the house can gather the money."
 SHL_debt_tribunal_tt: "The pledge is collected at once: the furnace passes to the city and the pledge contract closes. Quarter unrest §R+8§!, crest pressure §R+15§!."
 SHL_brotherly_supply: "Brotherly Supply"
 SHL_brotherly_supply_desc: "The shift councils share raw material between their furnaces without the treasury: a wagon leaves where stock exists and arrives where there is none."
 SHL_brotherly_supply_tt: "The first city furnace with at least §Y2§! packets gives §Y1§! packet; it arrives in §Y7§! days. Quarter unrest §G-2§!. If the recipient is lost, the packet returns to the donor."
 SHL_brotherly_slot_tt: "The previous supply has been delivered"
 SHL_brotherly_need_tt: "The furnace holds no more than §Y1§! packet of raw material"
 SHL_cargo_insurance: "Cargo Insurance"
 SHL_cargo_insurance_desc: "The houses insure caravans and ships with the common chest of the Golden Gates. The premium pays back in calm: carriers no longer hoard reserves."
 SHL_cargo_insurance_tt: "In §Y60§! days: §G+5§! convoys and the spirit §YInsured Cargo§! for §Y180§! days."
 SHL_insurance_slot_tt: "No earlier insurance is in force"
 SHL_house_credit: "House Credit"
 SHL_house_credit_desc: "The houses lend a neighbour money against its future deliveries. The debt returns in instalments, and the debtor long remembers who lent it."
 SHL_house_credit_tt: "The country becomes a debtor of the houses and is far more likely to accept a trade protectorate. The treasury recovers §G+25§! £ADISCORD_economy_treasury_texticon in each of the next §Y6§! cycles."
 SHL_metal_exchange_toggle: "Switch Export Mode"
 SHL_metal_exchange_toggle_desc: "The metal exchange takes the market price; the cartel keeps its own. The Conclave chooses what to trade: certainty or luck."
 SHL_metal_exchange_toggle_tt: "Now: [SHLGetExportMode]. Cartel: an export furnace earns §Y60§! per cycle. Exchange: the cycle price is §Y45-75§!."
 SHL_export_mode_exchange: "§Yexchange§! (cycle price §Y[?SHL_exchange_price|0]§!)"
 SHL_export_mode_cartel: "§Ycartel§! (price §Y60§!)"
 SHL_sell_stations: "Sell the Road Stations"
 SHL_sell_stations_desc: "The Great Road stations taken from Kadir cost more than they bring. The trading houses offer to sell them back for cash."
 SHL_sell_stations_tt: "Treasury §G+150§! £ADISCORD_economy_treasury_texticon. If Kadir exists, stations §Y234§! and §Y240§! return to it."
 SHL_directorate_railway: "Directorate Railway"
 SHL_directorate_railway_desc: "The Directorate builds a line from Nine Furnaces to Khazar at the treasury's expense. Darban's engineers lay the rails without asking the houses about tariffs."
 SHL_directorate_railway_tt: "In §Y70§! days: §G+1§! infrastructure in §YNine Furnaces§! and §YKhazar§! where room remains. The price is refunded if the country capitulates."
 SHL_railway_room_tt: "At least one of the states has room for infrastructure"
 SHL_sell_concessions: "Sell Concessions"
 SHL_sell_concessions_desc: "The regent sells the crests' future income in advance. The money arrives today; the bill comes later."
 SHL_sell_concessions_tt: "Treasury §G+300§! £ADISCORD_economy_treasury_texticon, public debt §R+500§!, crest pressure §G-5§!. Next sale in §Y180§! days; during the War for the South with the focus \"Sell the Future\" there is no interval."
 SHL_concessions_sold_tt: "The previous sale is not yet closed"
 SHL_regent_guard: "Regent's Guard"
 SHL_regent_guard_desc: "The regent raises his own levy from the houses' men. The guard answers to Safir personally, not to the Conclave."
 SHL_regent_guard_tt: "In §Y21§! days a \"Furnace Levy\" division appears in Khazar, with the spirit §YRestored House Guard§! if it is absent. If the capital is lost, the price is refunded."
 SHL_shift_school: "Shift School"
 SHL_shift_school_desc: "The commune trains a shift where the furnace is most worn: there, skilled hands matter more than money."
 SHL_shift_school_tt: "In §Y35§! days training §G+1§! at the most worn lit furnace (up to 2). If no such furnace remains, the price is refunded."
 SHL_strike_support: "Support the Strike"
 SHL_strike_support_desc: "Shahrabad's shift councils send money and people to a neighbour's strike committees. The longer the strike holds, the louder the call for an alliance."
 SHL_strike_support_tt: "In §Y60§! days council support in the country §G+25§!. At §Y75§! the councils offer the alliance with Shahrabad again, and consent comes easier. If the country disappears or goes to war with us, the price is refunded."
 SHL_strike_support_slot_tt: "No unfinished support in this country"
 SHL_cons_debt_term: "Debt Network Term"
 SHL_cons_debt_term_desc: "The houses have given the debtors a deadline. Rakhma and Sardan either accept the protectorate or hear a demand for annexation."
 SHL_cons_debt_term_goal_tt: "§YRakhma§! and §YSardan§! have submitted to Shahrabad or joined the alliance"
 SHL_cons_debt_term_timeout_tt: "§RRakhma and Sardan will receive a demand for annexation.§!"
 SHL_cons_charter_round: "Round of Charters"
 SHL_cons_charter_round_desc: "The open Conclave awaits replies to its invitations. In five months those who declined will receive a second letter."
 SHL_cons_charter_round_goal_tt: "Two of §YRakhma§!, §YMazar§! and §YSardan§! have joined Shahrabad's alliance"
 SHL_cons_charter_round_timeout_tt: "§YRakhma§!, §YMazar§! and §YSardan§! are invited again unless already allied."
 SHL_cons_ultimatum: "Ultimatum Term"
 SHL_cons_ultimatum_desc: "The Directorate has given Keyzan and Veyr four months. Whoever does not submit hears a demand for full annexation."
 SHL_cons_ultimatum_goal_tt: "§YKeyzan§! and §YVeyr§! have submitted to Shahrabad or joined the alliance"
 SHL_cons_ultimatum_timeout_tt: "§RKeyzan and Veyr will receive a demand for annexation.§!"
 SHL_cons_toll_term: "Toll Term"
 SHL_cons_toll_term_desc: "The regency waits for the toll debtors to recognise a suzerain. Five months, and the demand hardens."
 SHL_cons_toll_term_goal_tt: "§YSardan§! and §YRakhma§! have submitted to Shahrabad or joined the alliance"
 SHL_cons_toll_term_timeout_tt: "§RSardan and Rakhma will receive a demand for annexation.§!"
 SHL_cons_councils: "Councils Abroad"
 SHL_cons_councils_desc: "The commune waits for the councils of Mazar or Veyr to bring their country into the alliance. Half a year, and the invitation is repeated."
 SHL_cons_councils_goal_tt: "§YMazar§! or §YVeyr§! has joined Shahrabad's alliance"
 SHL_cons_councils_timeout_tt: "§YMazar§! and §YVeyr§! are invited again unless already allied."
 SHL_cons_success_tt: "Campaign complete: §G+25§! £political_power_texticon."
 SHL_council_election: "Council Election"
 SHL_council_election_desc: "Every half-year the cities elect the delegates of the open Conclave. The result depends on whether the quarters trust the Conclave."
 SHL_council_election_timeout_tt: "With city support of at least §Y40§!: §G+50§! £political_power_texticon, stability §G+3%§!, Conclave balance §G+0.03§! towards the quarters. Otherwise balance §R-0.05§!, quarter unrest §R+5§!. The next election follows in §Y180§! days."
 SHL_house_demand: "Demand Deadline"
 SHL_house_demand_desc: "The refusal has been delivered. The Conclave now has a month and a half to put the furnace in order, or the house goes into opposition."
 SHL_house_demand_goal_tt: "Wear of the furnace of [SHLGetDemandHouse] below §Y40§!"
 SHL_house_demand_success_tt: "The demand is withdrawn: crest pressure or quarter unrest §G-5§!."
 SHL_house_demand_timeout_tt: "§RThe house goes into opposition for 180 days: its head is unavailable in the cabinet.§! Crest pressure or quarter unrest §R+10§!."
 SHL_house_demand_refuse_tt: "Crest pressure §R+15§! (in the city and commune courses quarter unrest §R+10§!). The mission \"Demand Deadline\" begins: §Y45§! days to repair the furnace."
 SHL_house_demand_pay_tt: "Treasury §R-100§! £ADISCORD_economy_treasury_texticon. The demand is closed."
 SHL_house_demand_yield_tt: "Conclave balance §Y0.05§! towards the demanding side: the crests in the house, directorate and regency courses, the quarters in the city and commune courses. The demand is closed."
 SHL_demand_status_running: "§Rthe demand deadline expires in [?days_mission_timeout@SHL_house_demand|0] days.§!"
 SHL_demand_status_pending: "§Ra demand awaits an answer.§!"
 SHL_demand_status_quiet: "no demands."
