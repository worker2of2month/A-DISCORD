 SHL_crown_of_crests_spirit: "Crown of Crests"
 SHL_crown_of_crests_spirit_desc: "The crests of Shahrabad wear the crown of the South, and the neighbours' fiefs pay the regent."
 SHL_commune_of_fire_spirit: "Commune of Fire"
 SHL_commune_of_fire_spirit_desc: "The commune's charter handed the furnaces to the shift councils. The shifts go more willingly both to the furnace and to the ranks."
 SHL_fire_of_the_south_spirit: "Fire of the South"
 SHL_fire_of_the_south_spirit_desc: "The councils of the South have merged with those of Shahrabad; the furnaces burn for everyone."
 SHL_compact_court_opinion: "Court of the Compact"
