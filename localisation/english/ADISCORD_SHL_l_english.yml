 ADISCORD_SHL.5.settled: "The new furnace started under rules that the Conclave had established before construction ended. Masters from different cities formed the first shift, and the partnership signed the supply ledger. When metal flowed into the moulds, the argument over whether the tenth complex could be built ended. Now the decisions already made would have to withstand real work.\n\nRepresentatives of houses, cities and shifts waited at the gates. Each remembered what they had demanded from the project; none could replace the next delivery with a signature. The new furnace had to supply another cycle, retain its masters and fulfil its orders. The political settlement was already in place. Its strength now depended on what the country did with the metal."
 SHL_pressure_wait_tt: "Construction waits for transport access. Independent transport resolves the dispute without an access payment."
 SHL_pressure_pay_tt: "§Y40§! £ADISCORD_economy_treasury_texticon: settle transport access."
