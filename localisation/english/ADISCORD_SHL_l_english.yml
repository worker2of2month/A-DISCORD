 SHL_raise_border_watch:0 "Raise the Border Watch"
 SHL_raise_border_watch_desc:0 "The commander of the border watch announces a levy across the villages and forts of the Veyran Border."
 SHL_raise_border_watch_tt:0 "In §Y30§! days §Y1§! garrison division forms on the Veyran Border. If the district is lost earlier, the price is refunded."
 SHL_trade_mission:0 "Trade Mission: [FROM.GetName]"
 SHL_trade_mission_desc:0 "The Chancery of the Gate sends a trade mission to a neighbour: a scribe with the seal of the Conclave, two merchants of the cartel and samples of metal in leather cases."
 SHL_trade_mission_tt:0 "In §Y30§! days: opinion §G+15§! both ways. The next mission to this neighbour can be sent in §Y90§! days."
 ADISCORD_SHL.150.t:0 "Investment from Khazar"
 ADISCORD_SHL.150.d:0 "An envoy of the Chancery of the Gate arrived in the capital by the Damir road with a proposal nobody expected from Shahrabad. The Conclave of Furnaces invites the republic to invest its treasury in a Safir works: our money builds a smelting yard in the Safir region, our contractors receive a share of the orders, and Khazar recognises Eflor as a partner rather than a customer. The envoy, Ramin Farzan, speaks evenly, without a trader's tricks, and refers to the road that both countries repaired together.\n\nThe ministries are divided. The treasury sees money leaving the republic for a foreign city where nine houses are used to dividing the income among themselves. The trade office reminds everyone that Damir lives by caravans and that a share in a Shahrabad works is the republic's first way to the smelting yards of the South. The Party of United Land demands that borders and obedience to the centre not suffer; the envoy replies that the matter is a works, not a border.\n\nThe money leaves at once, the works will take more than one cycle to build, and the share in the orders depends on how honestly the Conclave keeps the common ledger. Shahrabad expects an answer before the envoy departs."
 ADISCORD_SHL.150.a:0 "Invest the treasury."
 ADISCORD_SHL.150.b:0 "Damir will manage with its caravans."
 ADISCORD_SHL.151.t:0 "Accord on the Coast"
 ADISCORD_SHL.151.d:0 "The second letter from Khazar is shorter than the first and costlier. The Conclave of Furnaces offers the republic an accord on the Safir Coast: Shahrabad pays for Eflor's participation and transfers the money in advance, while Eflor's contractors raise works on the shore under joint management. The money already sits with our ambassador in Khazar; Ramin Farzan asks only for a signature and engineers.\n\nIt is an unfamiliar role for the republic. Eflor is used to building at home and defending what it has built; now its crews will go to a foreign shore, under a foreign guard, among people whose right to speak is decided by the smoke over a furnace. The treasury is pleased with the sum, the army asks who will protect the contractors, and the Party of United Land demands that the accord contain not a word about borders.\n\nA refusal returns Shahrabad its money and leaves the coast without works. Consent binds the republic to the South for a long time: works on a foreign shore cannot be carried back, and the Conclave understands this as well as we do."
 ADISCORD_SHL.151.a:0 "Sign the accord."
 ADISCORD_SHL.151.b:0 "Eflor builds only on its own land."
 ADISCORD_SHL.152.t:0 "Eflor Refuses"
 ADISCORD_SHL.152.d:0 "The answer from Eflor came along the same Damir road the envoy had left by. The republic thanks the Conclave for its attention and declines: Eflor's treasury stays in Eflor, its contractors on their own land, and Damir will live by caravans as it always has. Ramin Farzan read the letter aloud in the Chancery of the Gate and placed it in the folder that already held the refusals of Keyzan and Veyr.\n\nDarius Safir thinks more should have been offered. Mariam Arbin points out that the Party of United Land trusts nobody beyond its border and that the sum is not the issue. Leyla Nadiri entered the failed accord as a separate line: the money, if any had been set aside, returned to the treasury, and the Safir shore remained as it was.\n\nThe road to Eflor stays open, and the chancery may return to the conversation later. For now the coast will have to be built with our own hands."
 ADISCORD_SHL.152.a:0 "We shall build it ourselves."
 ADISCORD_SHL.153.t:0 "Packets for the Furnaces"
 ADISCORD_SHL.153.d:0 "The Chancery of the Gate of Shahrabad has sent the capital a draft fuel treaty. The Conclave of Furnaces offers to buy fuel for its furnaces on fixed terms: constant volumes, a price below what casual buyers pay, and Khazar's undertaking not to seek fuel from the smugglers of the coast. The envoy, Ramin Farzan, asks for an answer by the end of the month and does not hide that the houses are tired of a price that changes every cycle.\n\nFor the North this is a reliable buyer for years ahead. The furnaces of Shahrabad burn without pause, and every one of their cycles means barrels paid for in advance rather than promises. The field managers notice something else: a single buyer with a single ledger bargains harder than nine houses, and a fixed price ties our hands if one day Khazar has to be pressed with an embargo.\n\nThe treaty holds while there is no war between the countries and the North does not close the taps. It stops neither side from preparing for anything; it only makes the first step more expensive."
 ADISCORD_SHL.153.a:0 "Sign the fuel treaty."
 ADISCORD_SHL.153.b:0 "The North sets the price."
 ADISCORD_SHL.154.t:0 "Svetlogorye Refuses"
 ADISCORD_SHL.154.d:0 "The North's answer came without a signature. Svetlogorye thanks the Conclave for the offer and informs it that the price of fuel is set by the fields, not by buyers, and that a standing treaty with one city is not in the interest of the oil belt. Ramin Farzan passed the letter to Leyla Nadiri, who filed it with the purchase ledger in which the packet price stayed as it was.\n\nGolshan Loran proposes buying from the smugglers openly, since the North will not trade honestly. Rauf Darban recalls our own distillery and the fact that every barrel of our own fuel is an argument in the next conversation. Amin Rashad recorded in the minutes that Svetlogorye had refused Shahrabad as an equal for the first time, and that this too is a result.\n\nThe furnaces burn on whatever fuel there is. The Chancery of the Gate may return to the treaty when Khazar has something to lay on the table beside its signature."
 ADISCORD_SHL.154.a:0 "The furnaces burn without a treaty."
 ADISCORD_SHL.155.t:0 "A Neighbour's Signature"
 ADISCORD_SHL.155.d:0 "[FROM.GetName] has accepted the Conclave's proposal. The envoy returned to Khazar with the signed copy, and Ramin Farzan laid it on the table of treaties beside charters that used to be few. For the first time the Chancery of the Gate has carried to signature an agreement proposed by the country rather than by a single house, and the neighbours have noticed.\n\nLeyla Nadiri transferred the terms into the ledger: what Shahrabad pays, what it receives and from which cycle. Darius Safir asked who would watch over the fulfilment; Amin Rashad answered that the same chancery that wrote the letter would. Mariam Arbin reminded the hall that a neighbour's signature is worth exactly as much as our conduct after it, and nobody objected.\n\nThe terms of the agreement take effect. While both sides keep them, Shahrabad has one neighbour fewer that it must address through the guard."
 ADISCORD_SHL.155.a:0 "Enter the agreement in the ledger."
 ADISCORD_SHL_news.9.t:0 "Shahrabad: Voice of the South"
 ADISCORD_SHL_news.9.d:0 "From Khazar it is reported: the Conclave of Shahrabad has declared that the League's foreign affairs are henceforth the business of the Chancery of the Gate, not of the trading houses. Beneath the dome of the Golden Gates Ramin Farzan read out the list of agreements concluded in the country's name: road treaties, trade missions, customs conferences and embassies opened in the neighbouring capitals. The neighbours used to receive letters of nine crests from Shahrabad; now they receive one letter with one seal.\n\nBehind the chancery stand four districts that were not on the Conclave's map before: the Safir coast with a pier of its own, the Loran sands with restored cisterns, the Bayrat mines and the forts of the Veyran border. Khazar speaks for the whole desert, and its words now have land behind them.\n\nKeyzan, Veyr, Mazar and Eflor received the notices on the same day. Svetlogorye noted that the letter from Khazar was written as to an equal, and is in no hurry to reply."
 ADISCORD_SHL_news.9.a:0 "The South is listening."
