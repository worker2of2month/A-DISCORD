 ADISCORD_shl_crisis.1.t: "Workshop Explosion"
 ADISCORD_shl_crisis.1.d: "A boiler exploded in one of the workshops of the furnace district. Steam tore off the roof of the casting bay; there are wounded, and Samira Hadi took them to the furnace infirmary without asking whose register they were in. The furnace did not go out - the stokers held the fire - but the workshop around it stands idle, and the shifts wait to see who pays for the rebuilding.\n\nThe working quarters demand that the Conclave pay: the boiler was listed as sound in the industrial ledger, and everyone saw the house's signature under that entry. The house answers that the shift overheated the boiler for a reinforced heat. Leyla Nadiri opened the ledger: the repair had been postponed three cycles running. Salima Darzi has already entered the names of the wounded in the shift council journal.\n\nThe Conclave can pay for the rebuilding from the treasury and close the matter, or leave the workshop to the house and its shifts - let them repair it themselves and remember who refused. If the emergency fund holds money, the incident closes without a dispute."
 ADISCORD_shl_crisis.1.a: "Pay for the repairs."
 ADISCORD_shl_crisis.1.b: "Let the workshop fix itself."
 ADISCORD_shl_crisis.1.z: "Emergency treasury."
 ADISCORD_shl_crisis.2.t: "Caravan Lost in the Desert"
 ADISCORD_shl_crisis.2.d: "A caravan of ore from the Bayrat mines did not reach Khazar. The drivers were to cross the dry riverbed in three days; on the fifth day one camel arrived in Khazar without its load. Tahmuras Bayrat swears the ore was shipped and recorded and demands that the Conclave look for its own cargo: the mines do not answer for the desert.\n\nBahram Kaveh sorts the reports: a sandstorm, a collapse in the riverbed, raiders from across the border, or simply a driver who sold the ore in Kyzan. Behruz Veyran offers a guard detachment - for a fee. Leyla Nadiri costed the search and the lost cargo; the sums are close, and the choice between them is not about money but about whether the next caravans will be willing to cross the riverbed.\n\nThe Conclave can mount a search and recover what it finds, or write off the cargo and take two packets from the common reserve so the next shift is not left without raw material. The emergency fund, if there is one, closes the matter without loss."
 ADISCORD_shl_crisis.2.a: "Send a search party."
 ADISCORD_shl_crisis.2.b: "Write off the cargo."
 ADISCORD_shl_crisis.2.z: "Emergency treasury."
 ADISCORD_shl_crisis.3.t: "Night Strike"
 ADISCORD_shl_crisis.3.d: "The night shift did not come to the furnaces. The foremen of the Sharim and Kerdan workshops gathered at the gates and demand a night-work bonus: day shifts are paid by the ledger, night shifts by an old house rate that Shirin Sharim has not revised since last cycle. The stokers hold the fire; no metal flows.\n\nThis is neither a cold shift nor a Shift Council - the foremen ask not for power but for money. Yet Salima Darzi stands among them with the journal, and it records how many nights the house did not pay. Shirin Sharim demands that the Conclave stay out: this is house business. Khosrow Arbin notes that all nine furnaces have night shifts, and tomorrow the same foremen will stand at his gates. Leyla Nadiri costed the bonus against the loss of a night heat.\n\nThe Conclave can yield to the shifts and pay the bonus from the treasury, or sit it out and let the house handle its night shifts itself. The emergency fund closes the matter without a trace in the journal."
 ADISCORD_shl_crisis.3.a: "Give in to the shifts."
 ADISCORD_shl_crisis.3.b: "Wait it out."
 ADISCORD_shl_crisis.3.z: "Emergency treasury."
 ADISCORD_shl_crisis.4.t: "Dividend Scandal"
 ADISCORD_shl_crisis.4.d: "The quarter broadsheets write that the houses took dividends from money set aside for furnace repairs. The sheet is unsigned, but the figures come from the industrial ledger, and Leyla Nadiri admits the ledger is correct: two houses carried out repairs on paper and paid the difference to their crests. The sheets name the houses - Safir and Loran - while the Conclave has not yet.\n\nDarius Safir demands to know who carried the ledger out of the archive. Golshan Loran explains that the dividends were paid by export contracts and the repairs will be done next cycle. Mariam Arbin read the sheet aloud in the assembly. Bahram Kaveh knows where the leak came from, but asks whether the Conclave needs to know. Amin Rashad reminds everyone that the ledger was kept to be read.\n\nThe matter can be hushed up - at a cost in political weight, and a signal to the houses that the archive is closed. Or the ledger can be opened in full: the quarters calm down, the crests remember. The emergency fund closes the matter quietly."
 ADISCORD_shl_crisis.4.a: "Hush it up."
 ADISCORD_shl_crisis.4.b: "Open the ledger."
 ADISCORD_shl_crisis.4.z: "Emergency treasury."
 ADISCORD_shl_crisis.5.t: "Embezzlement in the Directorate"
 ADISCORD_shl_crisis.5.d: "Auditors of the Counting Chamber found discrepancies in the directorate's estimates: arsenal orders paid twice, ore haulage at a tariff that neither Bayrat nor Kerdan charges. Leyla Nadiri brought both ledgers to the Conclave; Rauf Darban, responsible for the directorate, demanded names before his department was accused. There are names, and some belong to houses.\n\nAn investigation costs political weight: Safir's attorneys and Loran's managers must be questioned, and Bahram Kaveh warns that the trail leads to export contracts the Conclave would rather not touch. But the money comes back - part at once, part later. Hushing it up is easier: the ledgers are rewritten, the estimates balance, and the quarters learn of it from the broadsheets.\n\nThe Conclave can investigate and return to the treasury what it finds, or hush it up and pay in stability. Salima Darzi has already asked in the journal where the haulage money went."
 ADISCORD_shl_crisis.5.a: "Investigate."
 ADISCORD_shl_crisis.5.b: "Hush it up."
