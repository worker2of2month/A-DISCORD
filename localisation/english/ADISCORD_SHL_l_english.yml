 SHL_accident_house_tt: "Crest pressure: §R+10§!. Civic support: §G+5§!. Quarter unrest: §G-10§!."
 SHL_accident_masters_tt: "Quarter unrest: §R+15§!. Crest pressure: §G-5§!."
 SHL_accident_commission_tt: "Quarter unrest: §G-5§!. Crest pressure: §R+5§!. This furnace's shift counts as trained."
 SHL_water_crisis_tt: "Until the dispute is settled, Arbin, Safir and Loran take §R+4§! wear per cycle. Decisions appear in the «Quarters and Borders» category."
 SHL_kyz_accepts_treaty_tt: "Shahrabad pays 100 and delivers metal under a quota; the furnaces get water."
 SHL_kyz_refuses_tt: "Shahrabad receives a refusal."
 SHL_kyz_accepts_brotherhood_tt: "The water dispute ends without a quota."
 SHL_armistice_tt: "Both sides make white peace. Land stays with its previous owners."
 SHL_veyr_crisis_tt: "While the duty applies, every operating furnace earns §R5§! £ADISCORD_economy_treasury_texticon less."
 SHL_glp_accepts_union_tt: "Veyr lifts the duty and becomes Shahrabad's trading partner."
 SHL_glp_refuses_tt: "Shahrabad receives a refusal."
 SHL_mazar_pay_first_tt: "£ADISCORD_economy_treasury_texticon §R-250§!, £political_power_texticon §R-30§!. Mazar returns with a new demand in 10 cycles."
 SHL_mazar_refuse_tt: "A 60-day ultimatum begins. Then Mazar declares war over the Shahrabad District. During the delay you can raise guards or pay the ration at a higher price."
 SHL_mazar_pay_final_tt: "£ADISCORD_economy_treasury_texticon §R-400§!. Mazar's demands are closed."
 SHL_partner_joins_tt: "The country joins Shahrabad's alliance."
