 SHL_export_contract_tt: "§Y[?SHL_export_advance|0]§! £ADISCORD_economy_treasury_texticon at once, then 120 for two pours. Term: three cycles; four for new contracts of the Republic of Crests. No ordinary supply during the contract. Cancellation returns the advance plus 30; a shortfall becomes debt. The furnace then keeps exporting."
 SHL_insured_cargo: "Insured Cargo"
 SHL_insured_cargo_desc: "The houses' caravans and ships travel under the common chest's insurance, and carriers have stopped hoarding reserves."
 SHL_charter_occupation: "Charters for the Occupied Districts"
 SHL_charter_occupation_desc: "The open Conclave promises the occupied districts the same charters as its own quarters while the War for the South lasts."
 SHL_general_governorate: "General Governorate"
 SHL_general_governorate_desc: "The Directorate governs the occupied districts through appointed governors and furnace garrisons."
 SHL_conclave_of_ten_spirit: "Conclave of Ten"
 SHL_conclave_of_ten_spirit_desc: "The tenth furnace has its crest and its vote. The houses' Conclave is whole again, and its decisions are fast and expensive."
 SHL_crown_of_trade_spirit: "Crown of Trade"
 SHL_crown_of_trade_spirit_desc: "The South pays the houses of Shahrabad in tolls, credits and respect for the Golden Gates."
 SHL_southern_compact_spirit: "Southern Compact"
 SHL_southern_compact_spirit_desc: "The charter of cities turned the Conclave into an assembly of delegates. Decisions come slower, but the quarters grow."
 SHL_treaty_of_the_south_spirit: "Treaty of the South"
 SHL_treaty_of_the_south_spirit_desc: "The cities of the South signed a common treaty with the open Conclave and keep it."
 SHL_iron_directorate_spirit: "Iron Directorate"
 SHL_iron_directorate_spirit_desc: "The iron charter sealed the Directorate's power: orders are carried out, questions are asked later."
 SHL_hereditary_republic_spirit: "Hereditary Republic"
