 SHL_panel_ledger: "[SHLGetOrderLedger]"
 ADISCORD_SHL.100.t: "Who Receives the Next Pour"
 ADISCORD_SHL.100.house: "The Golden Gate agent placed his purse on the table before the clerk finished reading. The houses understood that gesture. The Arbin master asked which furnace would answer for the promised metal. The room fell silent: the Conclave could sign for a country, but one shift would have to do the work.\n\nNur ordered a separate ledger. The advance may be spent immediately. Within three production cycles, the chosen furnace must make two pours for the buyer, surrendering its normal revenue. Overtime can finish sooner, provided someone accepts the extra materials and wear.\n\nThis is not yet a tenth hereditary seat. First, the association must prove that its signature means more than permission to take money."
 ADISCORD_SHL.100.city: "The city delegates brought a bridge drawing instead of a crest. Each spring carts fell into the dry channel; each summer residents carried water around the broken masonry. The nearest furnace owner asked how much the road would earn. For the first time, the reply was that profit would not be the only condition.\n\nA civic order keeps the metal at home. The treasury pays for work and two pours become infrastructure in that district. Government must forgo the furnace revenue meanwhile. The road will remain even if the Conclave later refuses the city a vote.\n\nRepresentation still awaits the Workers' Charter. Until then, the cities can present something they built rather than another promise."
 ADISCORD_SHL.100.state: "The guard commander put a cracked bolt before Nur. The books called it serviceable: the treasury paid, the warehouse accepted the crates, the department stamped the receipt. Nobody recorded which furnace made the metal or who checked the last batch.\n\nThe directorate begins by attaching each order to an actual site. Payment for two batches stays in the ledger. The first successful pour delivers half the weapons; the second closes the order. The arsenal receives the output instead of treasury revenue. Overtime can complete both batches; a stopped furnace completes neither.\n\nNur does not yet command all the houses. But the first military ledger already asks what the country will sacrifice for working weapons."
 ADISCORD_SHL.100.a: "Enter the first furnace in the ledger."
 ADISCORD_SHL.101.t: "An Empty Place in the Caravan"
 ADISCORD_SHL.101.d: "The buyer's carts waited outside the gates while the ledger lacked the promised metal. The clerk explained the shortages, shutdown and closed road. The merchant listened, then unfolded the Conclave's signature. There was no clause saying an advance was repayable only when convenient.\n\nOne choice is settlement: repay the remaining obligation, moving any shortfall to public debt. The other is two more production cycles. The buyer will extend only once, reduce the final payment and raise compensation for another failure. The workers have already heard about the new deadline.\n\nUntil an agreement is reached, the furnace resumes normal sales. The old signature remains binding."
 ADISCORD_SHL.101.a: "Close the contract and settle."
 ADISCORD_SHL.101.b: "Request one final extension."
 ADISCORD_SHL.101.c: "The ledger has already been settled."
 SHL_renew_golden_offer: "Renew the Golden Gate offer"
 SHL_renew_southern_offer: "Renew the Southern Compact offer"
 SHL_renew_golden_offer_desc: "The Veyr partnership permits another alliance proposal. Its government must agree; rejection does not close future negotiations."
 SHL_renew_southern_offer_desc: "Invite Keyzan into the Southern Compact. Rejection leaves it independent and negotiations may resume after 60 days."
 SHL_alliance_offer_free_tt: "No previous alliance offer is awaiting a response."
 SHL_renew_alliance_offer_tt: "Send an alliance proposal. Acceptance also joins Shahrabad's current defensive war against Mazar."
 SHL_regency_independent_tt: "At least seven active house votes; no outstanding furnace pledge."
 SHL_renew_veyr_partnership: "Reopen Veyr partnership talks"
 SHL_renew_veyr_partnership_desc: "Offer the trade partnership again. Acceptance after the Conclave of Ten also triggers the alliance proposal. Existing harbour construction and war settlements remain intact."
 SHL_partner_joins_mazar_tt: "Join the current war against Mazar on Shahrabad's side."
 SHL_hereditary_seats: "Hereditary seats"
 SHL_hereditary_seats_desc: "The nine houses can assemble a majority, but their families extract concessions for every decision. Removed when a new political settlement is ratified."
 SHL_divided_guard: "Nine headquarters"
 SHL_divided_guard_desc: "Factory guards answer to their furnace owners. Their officers can guard warehouses but cannot yet wage a common war. Southern Watch establishes unified command."
 SHL_external_freight: "Foreign supply routes"
 SHL_external_freight_desc: "Water and access to the sea depend on our neighbours. Own Transport and settlement of both neighbouring disputes remove this dependency."
 SHL_prepared_columns: "Convoy of continuous fire"
 SHL_prepared_columns_desc: "Two paid pours have become spare parts and field equipment. The convoy supports the army for 90 days after entering war; peace ends its service early."
 SHL_forced_columns: "Forced march"
 SHL_forced_columns_desc: "Extra raw materials and overworked shifts support the first 45 days of the offensive at the cost of higher supply consumption."
 SHL_house_war_mandate: "Loan of nine crests"
 SHL_house_war_mandate_desc: "The houses will finance a campaign through public debt. Victory allows the occupied cisterns to be exchanged for a concession; retained land requires our own investment."
 SHL_city_war_mandate: "Mandate of the city levies"
 SHL_city_war_mandate_desc: "The cities will provide levies, but their assemblies have limited patience. Their war should end in safe roads and an agreement preserving their neighbour’s independence."
 SHL_directorate_war_mandate: "Plan for the first strike"
 SHL_directorate_war_mandate_desc: "The Directorate turns a completed convoy into an offensive instrument. Extra raw material will supply the opening campaign but overworked factories will grow restless."
 SHL_regent_war_mandate: "Regiments on pledge"
 SHL_regent_war_mandate_desc: "The Regent can arm levies by increasing an active furnace pledge. After the war he must repay it or restore lost house votes without cancelling existing debts."
 SHL_commune_war_mandate: "The armed shift"
 SHL_commune_war_mandate_desc: "The Commune equips a levy from its own stores and recruits. Aid to neighbouring communities after victory also requires deliveries."
 SHL_campaign_logistics: "Two pours for the front"
 SHL_campaign_logistics_desc: "One furnace receives a paid field order. Its metal cannot be sold on the ordinary market while the convoy is being prepared. Overtime speeds delivery at the cost of raw materials and wear."
 SHL_no_more_rations: "The last ration"
 SHL_no_more_rations_desc: "Shahrabad can set the date of its confrontation with Mazar. Hold both cistern regions and protect our own district to impose a limited peace."
 SHL_peace_has_a_price: "The price of peace"
 SHL_peace_has_a_price_desc: "War or a settlement with Mazar closes the ration demand but does not determine the future of the south."
 SHL_southern_horizon: "Beyond the cistern line"
 SHL_southern_horizon_desc: "The campaign is measured by what survives demobilisation: land, agreements, operating factories and the right to command the fire."
 SHL_forge_campaign_convoy: "Order a field convoy"
 SHL_forge_campaign_convoy_desc: "The selected furnace commits two pours to the convoy and forgoes its ordinary revenue. A change of government preserves the order; loss of the furnace or the end of war returns unused payment."
 SHL_demobilise_campaign_convoy: "Disband the unused convoy"
 SHL_demobilise_campaign_convoy_desc: "A completed convoy that has not reached the front can be returned to the stockpile as weapons. This is impossible once it has been deployed."
 SHL_march_on_mazar: "March on the cisterns"
 SHL_march_on_mazar_desc: "Prepare a declaration of war on Mazar over the two cistern regions in 28 days. If the threat disappears or Shahrabad enters another war, preparation is cancelled and 50 £political_power_texticon refunded."
 SHL_secure_cistern_corridor: "Secure the cistern corridor"
 SHL_secure_cistern_corridor_desc: "Hold both cistern regions and our frontier district for 14 days. Losing any objective interrupts the operation. Success ends this war and transfers both cistern regions to Shahrabad."
 SHL_house_campaign_aid: "Open the houses’ war loan"
 SHL_house_campaign_aid_desc: "One assistance package for the current campaign. The houses provide immediate cash in exchange for a larger public debt."
 SHL_city_campaign_aid: "Muster two city levies"
 SHL_city_campaign_aid_desc: "One assistance package per campaign. Cities provide two equipped levies; the treasury buys their weapons, recruits come from the national pool and the assemblies spend some of their support."
 SHL_directorate_campaign_aid: "Force the opening advance"
 SHL_directorate_campaign_aid_desc: "One assistance package per campaign. A completed convoy and extra raw materials support the first 45 days of war. Shift unrest will rise."
 SHL_regent_campaign_aid: "Extend the war pledge"
 SHL_regent_campaign_aid_desc: "One assistance package per campaign. Two levies are equipped against the active pledge. The pledged furnace’s revenue continues paying the increased obligation."
 SHL_commune_campaign_aid: "Arm the shift levy"
 SHL_commune_campaign_aid_desc: "One assistance package per campaign. The levy receives weapons and personnel paid from existing stocks. Common service reduces district unrest."
 SHL_offer_cistern_charter: "Offer the cistern charter"
 SHL_offer_cistern_charter_desc: "Return both occupied regions to Mazar in exchange for its voluntary entry into the Southern Compact. Rejection leaves the land with Shahrabad; the offer can be renewed after 60 days."
 SHL_cistern_concession: "Exchange the cisterns for a concession"
 SHL_cistern_concession_desc: "Return both occupied regions to Mazar and realise the concession rights. An active pledge is repaid first; the remainder goes to the treasury."
 SHL_reconstruct_south: "Rebuild the south: [From.GetName]"
 SHL_reconstruct_south_desc: "One paid 56-day project. [SHLGetSouthProgramme]\n\nBuildings go to the current owner of the selected region. War, a change of course or loss of access cancels the project and refunds payment. A second order cannot be opened before settlement."
 SHL_campaign_convoy_tt: "Two pours from the selected furnace -> convoy. At war entry: supply consumption -15% and organisation recovery +8% for 90 days."
 SHL_demobilise_convoy_tt: "Convoy -> §G13500§! £infantry_equipment_texticon. Forced-march preparation is also cancelled."
 SHL_march_ready_tt: "Mazar is independent, threatens Shahrabad and is not fighting another war; our army has not already mobilised."
 SHL_march_on_mazar_tt: "In §Y28 days§! Shahrabad declares war on Mazar for [269.GetName] and [273.GetName]. Mazar may invite one neighbour previously attacked by Shahrabad. A warning and non-intervention talks become available at the start of preparation."
 SHL_cistern_objectives_tt: "We hold [269.GetName], [273.GetName] and our own [707.GetName] in the current war against Mazar."
 SHL_secure_cistern_corridor_tt: "Hold the objectives for §Y14 days§!: peace and transfer of [269.GetName] and [273.GetName] to Shahrabad."
