 SHL_cabinet_public_minutes_tt: "City support +5; house pressure +5."
 ADISCORD_SHL.120.t: "Seven folders on the table"
 ADISCORD_SHL.120.d: "Seven identical folders arrived in Khazar. Amin Rashad had the first; the others covered defence, the economy, medicine, schools, intelligence and foreign affairs. Until noon, the Conclave secretary kept family crests outside the room: at the first cabinet meeting they would have taken more space than the reports.\n\nArman Teymur brought incompatible guard regulations. Leyla Nadiri brought invoices for equipment claimed by three houses. Samira Hadi laid down a list of patients without recognised papers. Farid Mehr asked which schools their children would attend. Bahram Kaveh quietly passed Ramin Farzan an intercepted caravan schedule.\n\nRashad proposed a simple beginning: every duty needed an officer and every decision a record. The dispute concerned who could read it. The houses wanted a closed archive; the quarters wanted evidence that the government had started work. If a new order has already been ratified, this first report can be received as the beginning of its history."
 ADISCORD_SHL.120.a: "Open the minutes to the city assemblies."
 ADISCORD_SHL.120.b: "Keep the minutes with the secretary for now."
 ADISCORD_SHL.120.c: "Receive the cabinet report."
 ADISCORD_SHL.121.t: "People missing from the ledger"
 ADISCORD_SHL.121.d: "Samira Hadi brought a clerk from eastern Khazar to the meeting. The clerk carried three identity papers for one worker: factory, house and city. Each spelled his name differently. When he entered the infirmary, the house refused to pay for a stranger and the city failed to find him on its list.\n\nThe same story reached the cabinet from port streets and furnace settlements. Twenty million residents no longer fitted a state accustomed to counting voting houses. The quarters did not ask for a census from nothing. They already knew their people; they asked the state to recognise those records.\n\nLeyla Nadiri priced the work at eighty treasury: clerks, archive checks and public appeals desks. House elders objected to losing their exclusive authority to certify a person. The cabinet may pay now, return to the issue through Quarters and Borders, or establish the same principle through the Workers Charter."
 ADISCORD_SHL.121.a: "Pay for verification and recognise the records."
 ADISCORD_SHL.121.b: "Receive the report; let the current settlement decide."
 ADISCORD_SHL.122.t: "An oath in Khazar square"
 ADISCORD_SHL.122.d: "The first paid national watch levy completed its training. Shahrabad already had armed forces: house guards had protected furnaces and roads for years. For the first time, a new formation had been assembled through one muster, one supply system and without nine separate permissions to march.\n\nIn Khazar square, Arman Teymur noticed soldiers looking for their house standard. He asked the old sergeants to stand at the front and read the order together. Their experience was being retained; a common command would now answer for it.\n\nAt the barracks gate, people argued over the unit name. The payment book already carried the plain words Furnace Levy. In the square they called it the watch that would not need a meeting of elders to protect a neighbour."
 ADISCORD_SHL.122.a: "Receive the oath and issue the marching rolls."
 ADISCORD_SHL.123.t: "Who receives the seal"
 ADISCORD_SHL.123.d: "The transfer of power in Khazar began with keys. The same locks protected the archives; the same petitioners waited outside. The new order had to decide to whom the people behind the ministry desks would answer.\n\n[SHLGetCabinetStory]\n\nThe back of the transfer act listed outstanding obligations. Departments continued working; payments, orders and debts did not disappear with a different signature. Even if another political turn changes the cabinet again, this record will remain in the archive."
 ADISCORD_SHL.123.a: "Pass the seal with its obligations."
 SHL_cabinet_story_house: "Jalil Nur kept the mediator's chair, and Amin Rashad kept the seal and became head of the cabinet. The Conclave of Ten recognised the new charter, but each house wanted to see its own right continued in it: Golshan Loran the Golden Gates cartel, Darius Safir the inviolability of the treasury, Behruz Veyran the guards. Rashad read one rule for all: a dispute over precedence does not suspend a signed order, and the tenth crest answers for its furnace exactly as the nine old ones do. Some heard a guarantee of property; others the first limit on family discretion."
 SHL_cabinet_story_city: "Mariam Arbin received the seal as head of the Southern Compact, and for the first time in the Conclave's history it passed to a hand that was not a house's. She brought city assembly minutes to the cabinet instead of a letter of recommendation from her father, Khosrow Arbin, who did not attend the transfer. Her first order opened public office hours and required spending decisions to be published. The ministers kept their departments - Arman Teymur the watch, Leyla Nadiri the accounts, Samira Hadi the infirmaries - but must now explain their work to representatives of streets once left outside the Conclave doors."
 SHL_cabinet_story_state: "Jalil Nur received the seal no longer as mediator but as Director of Furnaces, and his first order appointed Rauf Darban head of the Directorate cabinet. Darban unfolded a dispatch chart on the table: to him state power meant the right to link workshop, warehouse and front through a single order. Department heads received deadlines for checking stocks; Leyla Nadiri the first common estimate for all furnaces, Arman Teymur a supply schedule for the watch. The houses might argue about the future, but the Directorate's order already demanded a name responsible for the next delivery."
 SHL_cabinet_story_regent: "Darius Safir received the seal as regent of the Council of Crests and took charge of the cabinet himself rather than trust it to a secretary. The house elders expected their familiar privileges back; the regent reminded them of the duties of a working furnace and the upkeep of the guard. The crests of the nine houses were laid on the table, but Leyla Nadiri left the invoices beside them, and Safir did not order them removed. Amin Rashad kept the secretary's post, but the seal now lay with the regent. Even hereditary power had to decide who would pay for its promises."
 SHL_cabinet_story_commune: "The shift councils received the seal and entrusted it to the duty master, Salima Darzi. She came from Sharim with a workshop journal under her arm and first checked the entry on an unpaid order: the state seal could not turn yesterday's labour into a gift to a new regime. The councils received a political voice, and the ministers a duty to reconcile their plans with the people who would carry them out. Arman Teymur stayed with the watch, Samira Hadi with the infirmaries; Amin Rashad surrendered the seal and stayed with the archive. The house crests came down from the wall but were not destroyed: the journal accounts for them too."
 SHL_cabinet_story_unratified: "The secretaries prepared a transfer act, but the final political settlement had not been ratified. Departments retained their current duties and the seal remained with the Conclave secretary."
 minister_SHL_Amin_Rashad: "Amin Rashad"
 minister_SHL_Amin_Rashad_desc: "The Conclave secretary knows which signature costs money and which creates an obligation. He coordinates the departments before ratification and retains the office under the houses."
 minister_SHL_Mariam_Arbin: "Mariam Arbin"
 minister_SHL_Mariam_Arbin_desc: "The chair of the city assemblies began with the water registers of Arbin. She demands that cabinet spending be explained to the shifts paying for it."
 minister_SHL_Rauf_Darban: "Rauf Darban"
 minister_SHL_Rauf_Darban_desc: "The dispatch administrator considers an order complete only after delivery. In the Directorate cabinet he connects production quotas, railways and army orders."
 minister_SHL_Darius_Safir: "Darius Safir"
 minister_SHL_Darius_Safir_desc: "The regent represents the house elders and personally leads their cabinet. His authority rests on inherited obligations: a furnace grants privilege, but requires upkeep and service."
 minister_SHL_Salima_Darzi: "Salima Darzi"
 minister_SHL_Salima_Darzi_desc: "The shift councils delegate checks government plans against workshop journals. She heads the communal cabinet without handing its departments to the furnace owners."
 minister_SHL_Arman_Teymur: "Arman Teymur"
 minister_SHL_Arman_Teymur_desc: "The former caravan guard commander trains the national watch. He must turn nine traditions of command into one chain of orders while retaining the experience of local officers."
 minister_SHL_Leyla_Nadiri: "Leyla Nadiri"
 minister_SHL_Leyla_Nadiri_desc: "The furnace partnership economist separates the public treasury from family accounts. She oversees equipment and output even while the Conclave disputes ownership of the finished metal."
 minister_SHL_Samira_Hadi: "Samira Hadi"
 minister_SHL_Samira_Hadi_desc: "The workers quarter physician connects factory infirmaries to city medicine. To her, registration means being able to find a patient and return a survivor home."
 minister_SHL_Farid_Mehr: "Farid Mehr"
 minister_SHL_Farid_Mehr_desc: "The master instructor seeks common curricula for the children of houses and quarters. His schools train technicians and literate junior officers rather than merely issuing certificates."
 minister_SHL_Bahram_Kaveh: "Bahram Kaveh"
 minister_SHL_Bahram_Kaveh_desc: "The former railway cryptographer looks for threats in freight routes and broken communications. His service protects schedules and verifies reports without claiming omniscience."
 minister_trait_SHL_cabinet_secretary: "Secretary of the nine houses"
 minister_trait_SHL_city_chair: "Chair of the city assemblies"
 minister_trait_SHL_state_dispatcher: "Chief dispatcher of the Directorate"
 minister_trait_SHL_house_regent: "Regent of hereditary obligations"
 minister_trait_SHL_shift_delegate: "Delegate of the shift councils"
 minister_trait_SHL_guard_coordinator: "Coordinator of the national watch"
 minister_trait_SHL_furnace_accountant: "Furnace partnership economist"
 minister_trait_SHL_shift_physician: "Workers quarter physician"
 minister_trait_SHL_master_instructor: "Technical school instructor"
 minister_trait_SHL_rail_observer: "Railway cryptographer"
 SHL_south_final_ready_tt: "It is 2165 or later, both sides have completed their key focuses, and the war warning has begun. Return campaigns and preceding wars must be over."
 SHL_south_oil_for_furnaces: "Oil for the Furnaces"
 SHL_south_oil_for_furnaces_desc: "Svetlogorye sets the price of the oil every furnace in Shahrabad depends on. The Conclave of Ten will no longer buy raw fuel from namestniks: the houses will pay for the war, and the oil fields will become their concession."
 SHL_south_oil_for_furnaces_tt: "The §YWar for the South§! declaration is prepared for the end of the shared warning. Every independent desert state will choose a side. On victory the northern rival becomes a §Yhouse oil concession§!, and its allies become Shahrabad's satellites."
 SHL_south_war_of_charters: "War of Charters"
 SHL_south_war_of_charters_desc: "The Southern Compact cannot live beside a ladder of namestniks. The Council of Cities offers every district beyond the front the same charter that Khazar and Keyzan received."
 SHL_south_war_of_charters_tt: "The §YWar for the South§! declaration is prepared for the end of the shared warning. Every independent desert state will choose a side. On victory the defeated keep their own administrations and join the §YSouthern Compact Charter§!."
 SHL_south_last_pour: "The Last Pour"
 SHL_south_last_pour_desc: "Nur's Directorate turns the furnaces to the front. The iron march must end at the oil belt: the south will have one budget and one administrator."
 SHL_south_last_pour_tt: "The §YWar for the South§! declaration is prepared for the end of the shared warning. Every independent desert state will choose a side. On victory Shahrabad §Yannexes§! every defeated state."
 SHL_south_war_of_arms: "War of Crests"
 SHL_south_war_of_arms_desc: "The regent promises the houses fiefs beyond the front. The crest guards march for their share, and the hereditary republic for the right to command the whole south."
 SHL_south_war_of_arms_tt: "The §YWar for the South§! declaration is prepared for the end of the shared warning. Every independent desert state will choose a side. On victory Shahrabad §Yannexes§! every defeated state."
 SHL_south_oil_uprising: "The Oil Workers' Rising"
 SHL_south_oil_uprising_desc: "The Commune of Fire calls on Svetlogorye's oil workers to free themselves from the ladder of seals. Its war is fought not for a new border, but against the namestnik system itself."
 SHL_south_oil_uprising_tt: "The §YWar for the South§! declaration is prepared for the end of the shared warning. Every independent desert state will choose a side. On victory Shahrabad §Yannexes§! every defeated state, and the Svetlogorsk uprising joins the commune."
 SHL_south_debt_network: "Debt Network"
 SHL_south_debt_network_desc: "The houses do not fight those they can lend to. Credit to Rakhma and Sardan pays for their aqueducts and caravans, and the Conclave's bills make refusing a protectorate too expensive."
 SHL_south_debt_network_tt: "Cost: §Y200§! £ADISCORD_economy_treasury_texticon.\n§YRakhma§! and §YSardan§! become debtors of the houses: they are far more likely to accept a trade protectorate."
 SHL_south_trade_protectorates: "Trade Protectorates"
 SHL_south_trade_protectorates_desc: "A debtor who cannot pay pays with sovereignty. The Conclave offers Rakhma and Sardan the status of trade protectorates of the Golden Gates."
 SHL_south_trade_protectorates_tt: "§YRakhma§! and §YSardan§! are told to become Shahrabad's satellites. If a country refuses, we declare war on it for full annexation."
 SHL_south_great_road: "The Great Road"
 SHL_south_great_road_desc: "The Sun Throne taxes every caravan on the way to the sea. The houses demand that Kadir accept their supervision of the road stations."
 SHL_south_great_road_tt: "§YKadir§! is told to become Shahrabad's satellite. If a country refuses, we declare war on it for full annexation."
 SHL_south_wells_charters: "Charters of the Wells"
 SHL_south_wells_charters_desc: "The Southern Compact is open to anyone who recognises common water and the cities' right to self-government. The Council of Cities invites Rakhma, Mazar and Sardan."
 SHL_south_wells_charters_tt: "§YRakhma§!, §YMazar§! and §YSardan§! are invited to join Shahrabad's alliance. Refusal does not lead to war."
 SHL_south_compact_staff: "Compact Staff"
 SHL_south_compact_staff_desc: "The city levies receive a common staff, uniform regulations and depots in Khazar. The compact must be able to defend what it promises."
 SHL_south_compact_staff_tt: "§YTwo§! fully equipped levies are raised in Khazar."
 SHL_south_free_road: "The Free Road"
 SHL_south_free_road_desc: "The Sun Throne keeps the great road in the hands of one family. The compact demands that the road stations be governed by charter and that Kadir join as a member."
 SHL_south_free_road_tt: "§YKadir§! is told to join the Southern Compact as a chartered satellite. If a country refuses, we declare war on it for full annexation."
 SHL_south_water_and_sea: "Lands of Water and Sea"
 SHL_south_water_and_sea_desc: "The Directorate no longer bargains over qanats and ports. Keyzan and Veyr must join Shahrabad so that water and sea serve a single budget."
 SHL_south_water_and_sea_tt: "§YKeyzan§! and §YVeyr§! are told to join Shahrabad. If a country refuses, we declare war on it for full annexation."
 SHL_south_last_ration: "The Last Ration"
 SHL_south_last_ration_desc: "The Chamber of the Common Ration counts Shahrabad's metal as part of its distribution. The Directorate answers that it will do the distributing."
 SHL_south_last_ration_tt: "§YMazar§! is told to join Shahrabad. If a country refuses, we declare war on it for full annexation."
 SHL_south_iron_march: "The Iron March"
 SHL_south_iron_march_desc: "Sardan and Rakhma lie between the furnaces and the oil belt. The iron march cannot leave independent roads and wells behind it."
 SHL_south_iron_march_tt: "§YSardan§! and §YRakhma§! are told to join Shahrabad. If a country refuses, we declare war on it for full annexation."
 SHL_south_throne_and_crests: "Throne and Crests"
 SHL_south_throne_and_crests_desc: "The regent offers the Sun Throne an alliance of old houses: a share of the southern road in exchange for Kadir's swords in the war for future fiefs."
 SHL_south_throne_and_crests_tt: "§YKadir§! is invited to join Shahrabad's alliance. Refusal does not lead to war."
 SHL_south_toll_debtors: "Toll Debtors"
 SHL_south_toll_debtors_desc: "Sardan and Rakhma let caravans pass without the tolls the houses consider their own. The regency demands that they recognise the debt and the power of the crests."
 SHL_south_toll_debtors_tt: "§YSardan§! and §YRakhma§! are told to become Shahrabad's satellites. If a country refuses, we declare war on it for full annexation."
 SHL_south_veyr_debt: "Veyr's Debt"
 SHL_south_veyr_debt_desc: "For years Veyr's Trade Chamber insured the houses' cargo on credit. The regent presents the bill: the ports will become the hereditary republic's collateral."
 SHL_south_veyr_debt_tt: "§YVeyr§! is told to become Shahrabad's satellite. If a country refuses, we declare war on it for full annexation."
 SHL_south_councils_abroad: "Councils Abroad"
 SHL_south_councils_abroad_desc: "Mazar's workers and Veyr's dockers read the same leaflets as the shifts of Khazar. The commune invites their governments to stand with the councils before the workers replace them."
 SHL_south_councils_abroad_tt: "§YMazar§! and §YVeyr§! are invited to join Shahrabad's alliance. Refusal does not lead to war."
 SHL_south_oil_underground: "Svetlogorye Underground"
 SHL_south_oil_underground_desc: "Yaroslav Weber's underground is waiting for weapons. Every rifle carried across the desert now will raise the oil workers on the first day of the War for the South."
 SHL_south_oil_underground_tt: "If Svetlogorye leads the northern camp and holds the §YSvetlogorsk District§!, the §YSvetlogorsk Uprising§! rises there on Shahrabad's side on the first day of the War for the South and receives the delivered rifles.\nA district compact signed by Svetlogorye leaves the underground without support: §Y13500§! £infantry_equipment_texticon then return."
 SHL_conclave_power_dynamic: "Power of the Conclave"
 SHL_conclave_power_dynamic_desc: "Shahrabad's constitution, guards and industrial alliances add up to one power that the Conclave can turn to war or peace."
 SHL_south_furnaces_to_front: "Furnaces to the Front"
 SHL_south_furnaces_to_front_desc: "The War for the South is not fought only at the front. Every pour can now become a rifle if the treasury pays for the raw material."
 SHL_south_raid_oil_fields: "Raids on the Oil Fields"
 SHL_south_raid_oil_fields_desc: "The enemy lives on oil. Flying detachments strike the depots and roads of the Northern Deposits."
 SHL_south_desert_convoys: "Desert Convoys"
 SHL_south_desert_convoys_desc: "The caravan stations become army depots. The desert stops being an obstacle to supply."
 SHL_south_storm_oil_belt: "Storm the Oil Belt"
 SHL_south_storm_oil_belt_desc: "The enemy is weakened, the convoys are ready. Shahrabad's army marches on the oil belt."
 SHL_south_crown_of_the_south: "Crown of the South"
 SHL_south_crown_of_the_south_desc: "The south recognises the primacy of the furnaces. The Conclave establishes common relations with satellites, concessions and compact members, preserving their territories and local governments."
 SHL_south_raid_oil_tt: "The northern leader loses §Y4000§! £fuel_texticon. If the northern camp holds the §YNorthern Deposits§!, §Y1§! level of infrastructure there is destroyed."
 SHL_south_war_pour: "War Pour"
 SHL_south_war_pour_desc: "The furnaces switch to weapons metal. The treasury pays for raw material, and the army receives a batch of rifles and support equipment."
 SHL_south_raid_oil: "Raid the Oil Fields"
 SHL_south_raid_oil_desc: "A flying detachment heads for the depots of the Northern Deposits."
 SHL_south_desert_convoys_idea: "Desert Convoys"
 SHL_south_desert_convoys_idea_desc: "The caravan stations supply the army until the end of the War for the South."
 SHL_south_storm_idea: "Storm the Oil Belt"
 SHL_south_storm_idea_desc: "Shahrabad's army attacks the oil belt."
 SHL_public_campaigns: "Voice of the Furnaces"
 SHL_public_campaigns_desc: "Workshop leaflets, crest heralds and shift assemblies tell Shahrabad what the fire burns for. As many campaigns run at once as there are open slots.\n\nFree campaign slots: §Y[?ADISCORD_available_campaign_slots|0]§!"
 SHL_campaign_slot_available_tt: "A campaign slot is free: §Y[?ADISCORD_available_campaign_slots|0]§!"
 SHL_campaign_second_slot_tt: "A second campaign slot opens for the §YVoice of the Furnaces§!."
 SHL_campaign_fire_never_sleeps: "§YPROPAGANDA:§! The Fire Never Sleeps"
 SHL_campaign_fire_never_sleeps_desc: "Every shift knows its pour feeds the city. The masters keep the pace, and the workshops take pride in furnaces that never stand idle."
 SHL_campaign_bread_from_furnaces: "§YPROPAGANDA:§! Bread from the Furnaces"
 SHL_campaign_bread_from_furnaces_desc: "The leaflets tell how much bread, water and housing the last pour bought. The quarters see their work return to them."
 SHL_campaign_bread_from_furnaces_result_tt: "On completion, unrest in the quarters falls by §Y6§!."
 SHL_campaign_honour_of_crests: "§YPROPAGANDA:§! Honour of the Crests"
 SHL_campaign_honour_of_crests_desc: "Heralds recall that the houses built the first furnaces and kept the fire burning in the worst years. The crests feel respected and demand less."
 SHL_campaign_honour_of_crests_result_tt: "On completion, pressure from the crests falls by §Y6§!."
 SHL_campaign_golden_gates_open: "§YPROPAGANDA:§! The Golden Gates Are Open"
 SHL_campaign_golden_gates_open_desc: "The houses invite merchants from across the south: Shahrabad's metal is sold at a fair price to those who pay on time."
 SHL_campaign_a_voice_for_every_shift: "§YPROPAGANDA:§! A Voice for Every Shift"
 SHL_campaign_a_voice_for_every_shift_desc: "Shift assemblies decide who joins the levies and how revenue is shared. People defend more willingly what they govern themselves."
 SHL_campaign_iron_budget: "§YPROPAGANDA:§! The Iron Budget"
 SHL_campaign_iron_budget_desc: "The Directorate promises a single budget without crest privileges or workshop exemptions. Factories run more evenly, and the country grows used to mobilisation."
 SHL_campaign_the_south_is_one: "§YPROPAGANDA:§! The South Is One"
 SHL_campaign_the_south_is_one_desc: "Shahrabad's furnaces promise the deserts metal, water and protection. Svetlogorye's namestnik ladder is portrayed as an old imperial chain."
 SHL_receive_250_tt: "Treasury: §G+250§! £ADISCORD_economy_treasury_texticon."
 SHL_houses_prog_ending_a: "Republic of Crests"
 SHL_houses_prog_ending_a_desc: "The crests become the state. The quarters and masters lose weight in the Conclave."
 SHL_houses_prog_ending_b: "Conclave of Equals"
 SHL_houses_prog_ending_b_desc: "The houses recognise the masters and quarters as equal members of the Conclave."
 SHL_cities_prog_ending_a: "Republic of Cities"
 SHL_cities_prog_ending_a_desc: "The quarters gain the decisive voice. The houses remain only the owners of their furnaces."
 SHL_cities_prog_ending_b: "Technocratic Conclave"
 SHL_cities_prog_ending_b_desc: "The masters run the furnaces and the state. The crests lose their power."
 SHL_directorate_prog_ending_a: "Directorate of Shahrabad"
 SHL_directorate_prog_ending_a_desc: "The directorate becomes the state. The crests lose their last privileges."
 SHL_directorate_prog_ending_b: "Military Directorate"
 SHL_directorate_prog_ending_b_desc: "The guards gain the decisive voice. Shahrabad lives by the laws of wartime."
 SHL_regency_prog_ending_a: "Hereditary Dictatorship"
 SHL_regency_prog_ending_a_desc: "The guards become the state. The quarters fall silent."
 SHL_regency_prog_ending_b: "Republic of Debts"
 SHL_regency_prog_ending_b_desc: "The houses rule through debt books. Everything in Shahrabad is pledged to someone."
 SHL_commune_prog_ending_a: "Fiery Commune"
 SHL_commune_prog_ending_a_desc: "The quarters rule Shahrabad. Not a trace remains of the crests' power."
 SHL_commune_prog_ending_b: "Union of Workshops"
 SHL_commune_prog_ending_b_desc: "The workshops unite in a union, and the crests lose their last furnaces."
 ADISCORD_shl_fire.11.t: "A New Order for Shahrabad"
 ADISCORD_shl_fire.11.a: "Such is the new Shahrabad."
 ADISCORD_shl_fire.11.d_houses_prog_ending_a: "Republic of Crests.\n\nThe crests have become the state. The Conclave of Ten fixed the hereditary houses' right to speak for Shahrabad, and the tenth crest of the Fellowship of Masters and Engineers hangs in the hall beside the nine old ones, indistinguishable from them. Golshan Loran runs the Golden Gates cartel as a ministry of trade, Darius Safir the treasury as his own house, Behruz Veyran the guards as an army. Amin Rashad signs for the cabinet, Jalil Nur for the Conclave.\n\nThe quarters and masters have lost their weight in the hall: their registers are recognised, their vote is not. Salima Darzi keeps the shift council journal in Sharim, and the houses read it more closely than before - they remember the cold shift. Mariam Arbin dissolved the city assemblies and returned to her father's water ledgers.\n\nShahrabad is rich, calm and belongs to ten families. The Law of Continuous Fire protects them from the city as it once protected the city from them."
 ADISCORD_shl_fire.11.d_houses_prog_ending_b: "Conclave of Equals.\n\nThe houses have recognised the masters and the quarters as equal members of the Conclave. The tenth crest went to the Fellowship of Masters and Engineers, but with it delegates of the shift councils and city assemblies entered the hall - without crests above their chairs, with a vote by the industrial ledger. Jalil Nur is still mediator, only now he reconciles not nine houses but three estates.\n\nGolshan Loran called it the end of the Golden Gates, but his cartel works; Darius Safir the end of the treasury, but it is full. Khosrow Arbin sits in one hall with his daughter and admits that his city and her assemblies argue about the same qanats. Salima Darzi signs council decisions beside Shirin Sharim's signature, and neither became the other's friend.\n\nShahrabad remains a Conclave, but crests are no longer its only language. The Law of Continuous Fire is now read aloud before everyone."
 ADISCORD_shl_fire.11.d_cities_prog_ending_a: "Republic of Cities.\n\nThe quarters have the deciding vote. The Southern Compact turned the city assemblies into the state: Mariam Arbin leads Shahrabad from Khazar, assembly minutes are printed before house ledgers, and quarter delegates sit in the hall where once only crests hung. Samira Hadi received the hospitals, Farid Mehr the schools, Leyla Nadiri an open treasury.\n\nThe houses remain only owners of their furnaces. The Law of Continuous Fire stands, but gives property, not a vote: Golshan Loran trades, Tahmuras Bayrat digs, Behruz Veyran guards the border - and none of them decides where the revenue goes. Khosrow Arbin signed the compact last and on a separate line, as head of a house, not as a father.\n\nShahrabad has become a country of cities, and its neighbours - Kyzan, Veyr, Mazar - are invited into the same compact. Well charters have replaced ultimatums; the assemblies will show for how long."
 ADISCORD_shl_fire.11.d_cities_prog_ending_b: "Technocratic Conclave.\n\nThe masters govern the furnaces and the state. The Southern Compact gave the Conclave to the Fellowship of Masters and Engineers and the shift councils: the chairs are held not by crests or street delegates but by those responsible for brickwork, ore and output. Rauf Darban runs industry, Farid Mehr the schools of masters, Leyla Nadiri the single estimate, and Mariam Arbin signs for the state what the masters have already decided in the workshops.\n\nThe crests have lost their power. The houses own furnaces on paper, but repairs, shifts and haulage are assigned by the Conclave, and Shirin Sharim learns her furnace's schedule from Salima Darzi's journal. Darius Safir calls it expropriation by ledger; Golshan Loran keeps selling metal because he knows no other trade.\n\nShahrabad is run as one enterprise. The Law of Continuous Fire still ties the vote to the furnace, only the vote now belongs to the shift, not the family name."
 ADISCORD_shl_fire.11.d_directorate_prog_ending_a: "Directorate of Shahrabad.\n\nThe Directorate has become the state. All furnaces are handed to the Directorate of Furnaces, Jalil Nur is called Director and Rauf Darban head of the cabinet, and an order from Khazar reaches every workshop without a house's consent. Arman Teymur received the watch, Leyla Nadiri the single estimate, Bahram Kaveh the right to read every caravan schedule. The crests hang in the hall as a memory.\n\nThe houses have lost their last privileges. Darius Safir kept his treasury but not the right to dispose of it; Golshan Loran trades under Directorate quotas; Behruz Veyran handed his guards to the common register. The quarters received even shifts and a closed journal: Salima Darzi keeps it, but the Directorate reads it now.\n\nShahrabad works as a single plant. The Law of Continuous Fire has been rewritten: the furnace burns for the state, and the vote belongs to whoever signs the estimate."
 ADISCORD_shl_fire.11.d_directorate_prog_ending_b: "Military Directorate.\n\nThe guards have the deciding vote. The Directorate of Furnaces turned out to be a directorate of arsenals: Jalil Nur carries the title of Director, but the estimate, the watch and the order of heats are set by Arman Teymur and Rauf Darban, and Behruz Veyran brought the border house guards into the common register and took charge of it. Bahram Kaveh reads every letter leaving Khazar.\n\nShahrabad lives under wartime law. The furnaces cast weapons before rolled stock, Golshan Loran sells what is left, Darius Safir funds what is ordered. The quarters received a war ration and a ban on strikes; Salima Darzi keeps the shift council journal under the watch's supervision. Mariam Arbin left Khazar for her father's furnace.\n\nThe Law of Continuous Fire stands: the furnaces burn, the Conclave is silent, the Directorate commands. The neighbours have been told that the iron march is not a threat but a timetable."
 ADISCORD_shl_fire.11.d_regency_prog_ending_a: "Hereditary Dictatorship.\n\nThe guards have become the state. Darius Safir rules as regent of the Council of Crests, and that council rarely meets: Safir's treasury pays Behruz Veyran's guards, the guards protect the houses' furnaces, the houses are silent because their furnaces burn. Jalil Nur is mediator in name; Amin Rashad keeps the archive, not the seal.\n\nThe quarters are silent. The shift councils are dissolved, Salima Darzi's journal confiscated, Sharim works reinforced shifts under guard. Mariam Arbin left Khazar, and the assemblies are closed. Golshan Loran trades as before, Tahmuras Bayrat ships ore as before, and only Khosrow Arbin, looking at the empty chairs, says the Conclave was better.\n\nThe Law of Continuous Fire has become a law of property: the furnace burns, therefore the house is right. Who puts furnaces out is a matter for the guard."
 ADISCORD_shl_fire.11.d_regency_prog_ending_b: "Republic of Debts.\n\nThe houses rule through debt books. Darius Safir's regency took nothing by force: it lent. The furnaces are pledged against revenue, the quarters against shifts, the neighbours against duties, and every pledge lies in Safir's treasury. Leyla Nadiri keeps a book of pledges instead of the industrial ledger; Golshan Loran buys up Veyr's debts, Fereydun Kerdan the debts of the road to the sea.\n\nEverything in Shahrabad is pledged to someone. Jalil Nur owes Safir for the mediator's chair, Khosrow Arbin for water, Rauf Darban for the tenth furnace built on credit. The shift councils are not dissolved, but their journal is a pledge too: the quarters' debt is written off for quiet shifts. Mariam Arbin leads assemblies that have no money.\n\nThe Law of Continuous Fire now reads differently: the furnace burns while the interest is paid. Whoever does not pay goes out."
 ADISCORD_shl_fire.11.d_commune_prog_ending_a: "Commune of Fire.\n\nThe quarters rule Shahrabad. The shift councils took the furnaces, and the duty master Salima Darzi signs for the commune what the workshops decided. The crests came down from the Conclave hall wall; in their place hang the workshop journals of the nine furnaces, and the tenth entry - Nine Furnaces - was made first. Samira Hadi runs the infirmaries, Farid Mehr the shift schools, Arman Teymur the watch, now called the levy.\n\nNot a trace of the crests' power remains. Darius Safir left for Veyr, Behruz Veyran led his guards across the border, Shirin Sharim stayed in Sharim as a master, not an owner. Khosrow Arbin surrendered his furnace to the council and, to his daughter's surprise, stayed with it: he knows the qanats best. Mariam Arbin leads the assemblies, but the commune signs for them.\n\nThe Law of Continuous Fire applies literally: the furnace belongs to those who keep its fire. The neighbours are offered the same."
 ADISCORD_shl_fire.11.d_commune_prog_ending_b: "Union of Workshops.\n\nThe workshops have united in a union, and the crests have lost their last furnaces. The Commune of Fire did not become a state of one capital: each furnace has its council, each council its journal, and Salima Darzi as duty master signs only what all nine have agreed. The tenth furnace in Nine Furnaces is common property, and the dispute over it is closed by the union owning it.\n\nThe houses have left Khazar. Golshan Loran sells the union's metal on commission because he knows no other trade; Tahmuras Bayrat stayed in the mines as a master; Darius Safir and Behruz Veyran went abroad and write to the neighbours from there. Rauf Darban joined the union as an engineer and runs the tenth furnace. Mariam Arbin dissolved the assemblies: in a union of workshops there are no cities, only shops.\n\nThe Law of Continuous Fire has become the union's charter: the furnace burns, therefore the council stands. Common cauldrons have replaced the treasury, fraternal deliveries the exports."
