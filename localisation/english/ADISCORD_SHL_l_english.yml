 # ----- stage5_branches -----
 SHL_four_districts:0 "The Four Districts"
 SHL_four_districts_desc:0 "Beyond the nine furnace cities lie four districts the Conclave spent decades treating as road rather than land: the Safir coast, the Loran sands, the Bayrat mines and the Veyran border. Amin Rashad brings them to the table as a separate ledger for the first time. The houses argue over whose land it is; the scribes reply that the land has yet to be made anyone's."
 SHL_salt_pans_of_safir:0 "Salt Pans of Safir"
 SHL_salt_pans_of_safir_desc:0 "On the Safir coast, fishing families gathered salt until House Safir noticed how much of it went to Veyr without duty. The Conclave buys out the plots, lays out evaporation pans and warehouses and hires the same fishermen, this time for wages. The salt reaches the smelter quarters and the neighbours' markets before anyone asks who used to own the shore."
 SHL_safir_customs:0 "Safir Customs House"
 SHL_safir_customs_desc:0 "The Trade Chamber of Veyr has grown used to treating the Safir coast as its outer harbour. A customs post of the Conclave with scales and seals breaks the habit: every boat pays Khazar rather than the glass ports. Golshan Loran is pleased with the figures; the letters from Veyr grow shorter and colder."
 SHL_safir_smugglers:0 "Smugglers of the Coast"
 SHL_safir_smugglers_desc:0 "Night boats have long carried fuel to the coast past both the Veyr duty and the Svetlogorye contract. The Conclave prefers not to ignore them but to come to terms: a pier in a quiet cove, the silence of the guard and a fixed price per barrel. The furnaces get cheap fuel, and in Khazar people whisper that the continuous fire now burns from other men's lanterns too."
 SHL_safir_bandar_port:0 "Port of Safir-Bandar"
 SHL_safir_bandar_port_desc:0 "The fishing cove below the headland receives a stone breakwater, a lighthouse and the Conclave's warehouses. For the first time Shahrabad's metal reaches the sea not by Kerdan's road and not through the ports of Veyr but from its own pier. Darius Safir names the new port after his house; the shifts that built the breakwater simply call it the bandar."
 SHL_loran_cisterns:0 "Cisterns of Loran"
 SHL_loran_cisterns_desc:0 "The caravan road through the Loran sands rests on a chain of old cisterns, half of which ran dry in the days of the present owners' grandfathers. The Conclave restores the brickwork, installs water lifts and appoints keepers. Where water stands in a cistern all year round, the road stops being a risk and drilling new wells stops being a miracle."
 SHL_desert_caravanserai:0 "Caravanserai in the Sands"
 SHL_desert_caravanserai_desc:0 "Halfway between Khazar and the Zarkhan District a stone courtyard rises with stables, warehouses and a guest house. Caravans from Keyzan, Mazar and the distant stations of the great road stop here, pay for water and a night's rest and leave their news behind. Loran earns from every passing camel, and the Conclave gains ears in the desert."
 SHL_sand_patrols:0 "Patrols of the Sands"
 SHL_sand_patrols_desc:0 "The Loran sands were guarded by the caravan men themselves until whole trains began to vanish. The Conclave forms standing patrols from former guides and factory guards, with camels and well maps. Now not only trade moves between the cisterns but the authority of Khazar."
 SHL_loran_deh_growth:0 "Villages of Loran"
 SHL_loran_deh_growth_desc:0 "Around the restored cisterns the dehs return - villages abandoned when the water dried up. Families from the outskirts of Khazar and the crowded quarters of Sharim receive a plot, a house and a place in the caravan service. The Loran sands stop being an empty space on the Conclave's map."
 SHL_bayrat_copi_survey:0 "Survey of the Bayrat Mines"
 SHL_bayrat_copi_survey_desc:0 "Tahmuras Bayrat mined ore in the same galleries as his great-grandfather and would hear of no others. The Conclave's surveyors go further, into the dry gorges beyond the mines, with drills and journals. The first samples show that House Bayrat was sitting on the edge of a vein and never knew it."
 SHL_mine_colonies:0 "Mining Settlements"
 SHL_mine_colonies_desc:0 "The mines fed seasonal workers who left for the city with the first heat. The Conclave builds permanent settlements at the galleries with water, shops and a school for the miners' children. The families stay, and with them stays a smelting yard that no longer has to haul ore across half the desert."
 SHL_nomad_leases:0 "Leases from the Nomads"
 SHL_nomad_leases_desc:0 "The best outcrops lie on land where nomad clans have driven their herds since before the Conclave. Instead of a lawsuit the Conclave offers a lease: an annual payment, rights to water and the elders' signatures under the contract."
 SHL_copi_railway:0 "Mine Branch Line"
 SHL_copi_railway_desc:0 "From the mines to the Bayrat furnace, ore travelled by pack animal and cart along a track that every downpour washed away. The Conclave lays a narrow mine railway with sidings and loading ramps. The wagons reach the furnace by night, and for the first time Leyla Nadiri sees an ore delivery in the ledger without the word \"delayed\"."
 SHL_veyran_forts:0 "Veyran Forts"
 SHL_veyran_forts_desc:0 "The border with Veyr rested on the private guards of House Veyran and on the neighbours' habit of not quarrelling in earnest. The Conclave builds stone forts along it with cisterns and stores where the guard can hold without looking back at Khazar. Behruz Veyran accepts the keys to the forts with the face of a house accepting other people's money on its own land."
 SHL_border_watch:0 "Border Watch"
 SHL_border_watch_desc:0 "Whoever serves on the border is paid by House Veyran, and not even Arman Teymur knows how many of them there really are. The Conclave gains the right to recruit its own border watch from the district, arm it from the arsenals of Khazar and place its own commander over it. The house's guards remain; beside them stands the watch of the country."
 SHL_border_market:0 "Border Market"
 SHL_border_market_desc:0 "Where only patrols stood before, the Conclave opens a weekly market under the protection of both sides. Veyr's drovers bring salt and the fish of the glass ports, Veyran's merchants iron and cloth, and for the first time the Trade Chamber of Veyr takes its share not as a levy on wagons but by bargaining at the border. The market dues go to Khazar, and talk of war on the border grows quieter."
 SHL_veyran_kala:0 "Veyran Kala"
 SHL_veyran_kala_desc:0 "The old mud-brick fortress at the crossing of the border roads receives new walls, stores and workshops. The kala becomes the anchor for everything that moves along the border: trains, guards, caravans and the Conclave's post. From here a war on the border can be fought and fed without looking back at Khazar."
 SHL_desert_assembly:0 "Assembly of the Desert"
 SHL_desert_assembly_desc:0 "The four districts send their representatives to Khazar: salt makers, cistern keepers, miners and border men. The Assembly of the Desert sits not beneath the crests but in the ledger hall, and speaks of roads, water and prices. For the first time the Conclave hears that the country has land beyond its nine cities, and that this land has a voice."
 SHL_chancery_of_the_gate:0 "Chancery of the Gate"
 SHL_chancery_of_the_gate_desc:0 "Shahrabad's foreign affairs were handled by the trading houses, each with its own envoys and its own promises. Ramin Farzan receives a separate chancery at the Golden Gates with scribes, interpreters and the seal of the Conclave. Now the country writes to the neighbours rather than somebody's crest, and the replies come to one address."
 SHL_damir_road:0 "The Damir Road"
 SHL_damir_road_desc:0 "Between Safir and Eflor's Damir lies an old caravan route that both sides repaired for years in turn and without enthusiasm. The Conclave offers Eflor a joint road service: bridges over the dry beds, stations with water, common tolls. The Republic of United Land agrees because the road leads to its own city."
 SHL_eflor_investment:0 "Eflor Investment"
 SHL_eflor_investment_desc:0 "The Chancery of the Gate offers Eflor what no house ever offered: a share in a Safir works in exchange for Eflor's money. For a republic locked between the desert and its own borders this is a way to the smelting yards of the South. For the Conclave it is the first time a foreign treasury builds in Shahrabad."
 SHL_damir_customs:0 "Damir Tolls"
 SHL_damir_customs_desc:0 "The Damir road can be shared, or it can be a source of income. The Conclave sets up a customs yard at Safir and levies a toll on every Eflor caravan entering the lands of the League. Khazar's treasury is pleased; in Damir they remember that Eflor repaired this road with its own hands."
 SHL_eflor_accord:0 "Accord with Eflor"
 SHL_eflor_accord_desc:0 "Ramin Farzan carries a great treaty to Eflor: the Conclave pays for the republic's part in developing the Safir coast, and Eflor's contractors build on the shore the works Shahrabad lacks. It is an accord between equals, in which each side pays and each side gains. Eflor's signature costs dearly, but a shore without works costs more."
 SHL_fuel_ledger:0 "Fuel Ledger"
 SHL_fuel_ledger_desc:0 "Fuel for the furnaces was bought by each house separately, and Svetlogorye knew every one of their prices. Leyla Nadiri gathers the purchases into one ledger, and the Conclave builds a common store in Khazar. When there is one buyer and only he knows his stocks, bargaining with the North becomes simpler."
 SHL_nam_fuel_treaty:0 "Fuel Treaty"
 SHL_nam_fuel_treaty_desc:0 "The Chancery of the Gate offers Svetlogorye a long-term treaty: fixed volumes, a fixed price and the Conclave's undertaking not to seek fuel from smugglers. The governor of the North sees a reliable buyer; the Conclave sees a price that does not change every cycle. The treaty holds exactly as long as neither side remembers war."
 SHL_own_distillery:0 "Our Own Distillery"
 SHL_own_distillery_desc:0 "Darban's engineers have long argued that the furnaces can be fed on more than Svetlogorye oil. The Conclave builds a distillery in Khazar that makes fuel from what the desert yields on its own. It will not replace the North, but every barrel of our own fuel is a barrel not paid to the governor."
 SHL_northern_road:0 "The Northern Road"
 SHL_northern_road_desc:0 "The road from Khazar through the Zarkhan District to the north was a caravan track, not a way for supply trains. The Conclave widens it, builds stations and bridges and for the first time makes it possible for columns to move in both directions. Svetlogorye notices that the road leads to it and is not sure whether to be glad."
 SHL_table_of_treaties:0 "Table of Treaties"
 SHL_table_of_treaties_desc:0 "At least one of the old disputes with the neighbours is closed, and the Chancery of the Gate places a separate table in the Conclave hall where the signed charters lie. The Table of Treaties reminds the houses that a neighbour can be something other than plaintiff or prey. The quarters read the charters on the walls and for the first time believe that war with Keyzan or Veyr is not inevitable."
 SHL_kyz_communities_seat:0 "Seat of the Canal Communities"
 SHL_kyz_communities_seat_desc:0 "The qanat dispute is closed, and the Conclave invites the Assembly of Canal Communities to keep a permanent representative in Khazar with a vote on matters of water. For the communities it is a recognition they never had from a neighbour; for Shahrabad, people who know where water runs beneath the sand. Families from Keyzan move to the western furnaces, which have always been short of hands."
 SHL_veyr_glass_contract:0 "The Glass Contract"
 SHL_veyr_glass_contract_desc:0 "The dispute over the road to the sea is settled, and the Trade Chamber of Veyr offers what it came for in the first place: a long contract for metal in exchange for glass, cargo insurance and a place in its ports. Golshan Loran signs it on behalf of the cartel. Kerdan gets a road without toll bars, Veyr gets steel without war."
 SHL_southern_customs_union:0 "Southern Customs Union"
 SHL_southern_customs_union_desc:0 "The Chancery of the Gate calls the neighbours to a common customs conference: uniform duties, common scales, recognised seals. The union demands neither allegiance nor troops, only consent to trade by the same rules. The cartel of the Golden Gates gains markets the caravans never used to reach."
 SHL_voice_of_the_south:0 "Voice of the South"
 SHL_voice_of_the_south_desc:0 "Treaties, embassies and districts add up to something Shahrabad never had: a foreign policy. The Chancery of the Gate speaks for the whole desert, and the neighbours listen because roads, goods and guards stand behind the words. For the first time Svetlogorye receives a letter from Khazar written as to an equal."
 SHL_written_fire:0 "The Written Fire"
 SHL_written_fire_desc:0 "The Law of Continuous Fire was passed on by word of mouth: master to master, head of house to heir. The Conclave orders the scribes to record the customs of the furnaces, the rights of the houses and the duties of the shifts in a single book. What is written can be read, argued with and taught to children; what was spoken belonged only to those who remembered."
 SHL_archive_of_the_conclave:0 "Archive of the Conclave"
 SHL_archive_of_the_conclave_desc:0 "Furnace drawings, pour journals and repair ledgers of a hundred years lay in the chests of nine houses. The Conclave gathers them into a common archive at the Golden Gates with keepers and a catalogue. An engineer who used to start from a blank sheet now starts from the experience of nine generations."
 SHL_masters_university:0 "University of Masters"
 SHL_masters_university_desc:0 "The school of masters taught what a furnace needs today. The university at Nine Furnaces teaches what a furnace will need tomorrow: metallurgy, mechanics, the chemistry of fuel. The houses send their younger sons there, the quarters their best apprentices, and for the first time they sit on the same bench."
 SHL_apprentice_decree:0 "Apprentice Decree"
 SHL_apprentice_decree_desc:0 "Apprenticeship at the furnaces was the business of family and house: a master took whom he wished and taught what he wished. The Conclave's decree makes training a matter of state: technical classes at every furnace, a common examination, a certificate with a seal. The masters grumble that paper will not replace hands; by the end of the year their classes are full."
 SHL_engineers_of_the_tenth:0 "Engineers of the Tenth"
 SHL_engineers_of_the_tenth_desc:0 "The engineering fellowship building the tenth furnace receives recognition and a permanent allowance from the Conclave. Its masters are no longer hired hands but a service of the country with the right to demand drawings and access to the yards from the houses. The tenth furnace becomes not only a dispute over power but a school for all the others."
 SHL_heralds_press:0 "The Heralds' Press"
 SHL_heralds_press_desc:0 "News in Shahrabad was carried by the heralds of the houses, and every house heard its own. The Conclave sets up a press at the Golden Gates that issues sheets for all the quarters at once. Now the city learns of pours, prices and decisions from one source and argues about the same things."
 SHL_open_press:0 "Open Press"
 SHL_open_press_desc:0 "The press takes sheets from anyone: shift councils, city assemblies, disgruntled houses. The Conclave refuses to read them before they appear and answers only what has already been printed. The quarters gain a voice, the crests a cause for complaint, and the mediator more truth about his country than he would have liked."
 SHL_conclave_bulletins:0 "Bulletins of the Conclave"
 SHL_conclave_bulletins_desc:0 "The press issues only what the secretary of the Conclave has signed: bulletins on pours, decisions and awards. Amin Rashad calls it order, Salima Darzi calls it censorship, and both are right. The city reads one version of events and knows whose it is."
 SHL_chronicle_of_the_south:0 "Chronicle of the South"
 SHL_chronicle_of_the_south_desc:0 "The keepers of the archive begin the second volume of the Book of Furnaces: not about customs but about events, not about houses but about the country. The chronicle records disputes, wars and treaties as they were seen from Khazar. A people with a history of its own looks differently at its neighbours and at its own future."
 SHL_law_of_the_written_fire:0 "Law of the Written Fire"
 SHL_law_of_the_written_fire_desc:0 "The Book of Furnaces, the archive, the university and the press become part of the law: the Conclave recognises recorded knowledge as a foundation of right alongside a burning furnace. A house that keeps no journals loses its vote just like a house whose fire has gone out. Shahrabad, which only knew how to pour metal, learns to remember."
 SHL_regency_of_crests:0 "Regency of the Crests"
 SHL_regency_of_crests_desc:0 "Darius Safir offers the Conclave not a revolt but order: the furnaces back to the houses, the guards back to the crests, and power to whoever pays for it. The Night of the Crests has already shown that the houses can act together. The regency is proposed as a temporary measure, and everyone in the hall knows what that word means."
 SHL_commune_of_shift_councils:0 "Commune of the Shift Councils"
 SHL_commune_of_shift_councils_desc:0 "The shift councils keep the furnaces burning while the Conclave argues, and one day they ask what they need the Conclave for. Salima Darzi brings the councils' resolution into the hall: the furnaces to those who stand at them, power to those the shifts have elected. The cold strike showed that the councils have strength; the commune is that strength written into law."
