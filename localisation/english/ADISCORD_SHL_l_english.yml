 ADISCORD_SHL.140.t: "A Demand at the Furnace"
 ADISCORD_SHL.140.d: "The delegation arrived in Khazar unannounced: [SHLGetDemandHouse]. The furnace runs, but the brickwork stands on props, wear has reached §Y[?SHL_demand_wear|0]§!, and every shift ends before its time. The delegation's elder laid a ledger on the table: how much metal was short, how many people were burned, how many letters to the Conclave went unanswered.\n\nThe demand is simple. Either the Conclave pays for the repair from the common treasury, or it admits that this furnace's voice in the hall weighs more than it does now. The third way the delegation named itself: refusal. Then they will leave and wait a month and a half. If the furnace is put in order in that time, the quarrel is forgotten; if not, their head stops attending the sessions, and the Conclave will have to manage without him.\n\nJalil Nur listened in silence. He knew the ledger was right: in the book of furnaces this brickwork has been listed as the worst for more than one cycle."
 ADISCORD_SHL.140.a: "The treasury will pay for the repair."
 ADISCORD_SHL.140.b: "The Conclave does not bargain with ultimatums."
 ADISCORD_SHL.140.c: "Recognise their voice."
 ADISCORD_SHL.76.t: "A Year After the Peace"
 ADISCORD_SHL.76.d: "Exactly a year ago [SHLGetRevancheNeighbour] signed the peace that passed the border states to Shahrabad. For a year the neighbour kept silent: burying, rebuilding roads, replacing commanders. Now its envoy has brought to Khazar a paper drawn up by every rule: the ceded lands are declared inalienable, their return a matter of honour.\n\nThe envoy does not threaten. He proposes a revision: Shahrabad acknowledges the neighbour's losses in money, and the paper of claims disappears from the archive. The sum is named in advance and is not negotiable. If the Conclave refuses, the claim stays on record, and every new dispute on the border will begin with it.\n\nThe hall is divided. Some hold that paying for a war already won is humiliating; others recall that the furnaces work better when the border is quiet."
 ADISCORD_SHL.76.a: "Pay for a quiet border."
 ADISCORD_SHL.76.b: "The peace is signed; there is nothing to revise."
