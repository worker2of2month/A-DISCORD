 SHL_nationalise_region: "Nationalise Region"
 SHL_nationalise_region_desc: "Conclave clerks arrive in [FROM.GetName] with furnace ledgers, boundary markers and oath sheets. Quarter elders and the owners of local workshops argue with them over measures, tolls and the order in which households enter the common register."
 SHL_nationalisation_ready_tt: "Shahrabad is independent and at peace. The region is directly owned and controlled, is not yet national territory and borders directly held national territory"
 SHL_nationalisation_ready_tt_not: "Condition no longer met: $SHL_nationalisation_ready_tt$"
 SHL_nationalisation_slot_tt: "The region is not reserved by a running nationalisation programme"
 SHL_nationalisation_result_tt: "When the programme ends, the region becomes §Ynational territory§! and its directly held neighbours open for the next nationalisation. Several regions may be processed at once. If the conditions fail, the payment is refunded."
 SHL_nationalisation_complete_tt: "The region is now §Ynational territory§!. Its directly held neighbours are now open for the next nationalisation."
 SHL_war_orders_all_site_tt: "A working furnace without a quota, order or obligation exists"
 SHL_measures: "Measures of the Conclave"
 SHL_measures_desc: "A ratified course entitles the Conclave to measures: campaigns in the quarters, courts, fairs and decrees, each lasting §Y60§! days. A measure occupies the Conclave's political attention: while one runs, another cannot begin, and convening the Conclave or an arbitration act waits for it to end."
 SHL_measure_crest_patronage: "Patronage of the Crests"
 SHL_measure_crest_patronage_desc: "The Council of Ten takes the junior houses under its wing: it pays their debts to suppliers, marries their daughters into the right families and reminds the quarters who feeds the city."
 SHL_measure_golden_fair: "Fair of the Golden Gates"
 SHL_measure_golden_fair_desc: "The cartel proclaims a great metal fair: caravans of buyers camp under the walls, prices hold firm and every export yard takes its share of the festive trade."
 SHL_measure_quarter_assembly: "Assembly of the Quarters"
 SHL_measure_quarter_assembly_desc: "The shift delegates gather in the Conclave hall for an open session: they read their mandates, argue about bread and queues, elect elders."
 SHL_measure_open_books: "Open Books"
 SHL_measure_open_books_desc: "The compact assembly publishes the Conclave's accounts: what came in from the furnaces, what went to roads and watches, whose debts were written off."
 SHL_measure_directorate_decree: "Decree of the Directorate"
 SHL_measure_directorate_decree_desc: "The Director signs a decree on emergency supply: state yards receive raw materials first, shifts move to a strict schedule and the crests make themselves heard only in writing."
 SHL_measure_war_bonds: "War Loan"
 SHL_measure_war_bonds_desc: "The Iron Crown issues a loan for the arsenal. Subscription lists lie in every quarter, heralds read the names of the donors and the treasury takes the money in advance against a promise to repay with interest. The debt stays with the city when the subscription festival ends."
 SHL_measure_crest_court: "Court of the Crests"
 SHL_measure_crest_court_desc: "The regency restores to the houses the right to judge disputes over tolls and inheritance under their own crests."
 SHL_measure_fief_grant: "Grant of a Fief"
 SHL_measure_fief_grant_desc: "The regent grants a loyal house the lands and revenues of a former crown estate. The ceremony lasts more than a day: charters, oaths, a feast for the neighbouring crests. The houses see that service to the crown is rewarded and the pressure in the hall eases."
 SHL_measure_common_assembly: "Common Assembly"
 SHL_measure_common_assembly_desc: "The commune calls every shift delegate to a common assembly of the city: reports of the councils, disputes over the distribution of raw materials, election of the standing council."
 SHL_measure_shift_reserve: "Reserve of the Shifts"
 SHL_measure_shift_reserve_desc: "Without crests the councils manage the stores themselves."
