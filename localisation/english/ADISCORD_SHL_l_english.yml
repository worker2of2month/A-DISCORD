 # Focuses
 SHL_quarter_listening: "Listen to the Quarters"
 SHL_quarter_listening_desc: "The working quarters know more about the furnaces than the Conclave halls do. Nur opens a reception for shift delegates before their complaints turn into demands."
 SHL_heralds_table: "Table of Crests"
 SHL_heralds_table_desc: "The houses are used to settling disputes behind closed doors. A common table makes their grievances visible and lets us defuse them before an ultimatum."
 SHL_shift_arbitration: "Shift Arbitration"
 SHL_shift_arbitration_desc: "A standing commission of masters and managers settles shift disputes before they leave the factory gates."
 SHL_factory_militia: "Furnace Guard"
 SHL_factory_militia_desc: "The station guard can become the core of an army if the furnaces pay for rifles and the cities provide men."
 SHL_southern_watch: "Southern Watch"
 SHL_southern_watch_desc: "Mazar's Chamber of the Common Ration counts other people's metal as part of the common ration. The Zarkhan District must meet its detachments from prepared positions."
 SHL_mobilise_furnaces: "Mobilise the Furnaces"
 SHL_mobilise_furnaces_desc: "Every furnace receives a war order that can be filled without stopping the civilian shift."
 SHL_water_question: "The Water Question"
 SHL_water_question_desc: "The furnaces of Arbin, Safir and Loran drink water from Keyzan's qanats. We will raise the water question ourselves before the communes raise it by closing the conduits."
 SHL_qanat_guard: "Conduit Guard"
 SHL_qanat_guard_desc: "If talks do not bring water, the head wells on the border will have to come under Shahrabad's guard."
 SHL_veyr_duties: "Veyr Duties"
 SHL_veyr_duties_desc: "The Veyr trade chamber levies a duty on every wagon of metal heading to the sea. We will open this dispute and prepare our own harbour."
 SHL_veyr_ultimatum: "Ultimatum to the Chamber"
 SHL_veyr_ultimatum_desc: "The Kassen mines and the road through Noran give Veyr power over our revenue. If the chamber does not yield, Shahrabad will take them."
 SHL_golden_gate_cartel: "Golden Gate Cartel"
 SHL_golden_gate_cartel_desc: "The ten houses agree on common export prices. The Conclave becomes not only an assembly of owners but a common trading house."
 SHL_house_guards: "House Guards"
 SHL_house_guards_desc: "Each house fields a guard for its furnaces. Under a common command these detachments become an army paid for by the owners themselves."
 SHL_veyr_partnership: "Trade Union with Veyr"
 SHL_veyr_partnership_desc: "Veyr needs our metal as much as we need its quays. The cartel will offer the chamber a share of exports instead of the duty."
 SHL_conclave_of_ten: "Conclave of Ten"
 SHL_conclave_of_ten_desc: "The tenth house has taken its seat, the cartel trades for all, and the Golden Gates are open to partners willing to defend a common market."
 SHL_council_of_cities: "Council of Cities"
 SHL_council_of_cities_desc: "The self-governing cities receive a standing council beside the Conclave. The quarters see their representatives in the hall of decisions for the first time."
 SHL_fire_and_water: "Fire and Water"
 SHL_fire_and_water_desc: "Keyzan's communes and Shahrabad's cities are both governed by assemblies. We will propose sharing water and metal under a common agreement, without quotas or force."
 SHL_workers_brigades: "Workers' Brigades"
 SHL_workers_brigades_desc: "The cities recruit brigades from the shifts themselves. Their weapons are bought with furnace revenue and their commanders are elected by the workshops."
 SHL_southern_compact: "Southern Compact"
 SHL_southern_compact_desc: "The open Conclave and the union of canal communes can protect each other from the Chamber of the Common Ration if they agree to a common compact."
 SHL_war_directorate: "War Directorate"
 SHL_war_directorate_desc: "Nur's directorate manages the furnaces as a single arsenal. The first state production line will make weapons."
 SHL_right_to_water: "Right to Water"
 SHL_right_to_water_desc: "State furnaces need guaranteed water. The directorate declares the head qanats on the border part of Shahrabad's industrial system."
 SHL_key_to_sea: "Key to the Sea"
 SHL_key_to_sea_desc: "Without Tirva and the Veyr District any agreement with the chamber can be undone by a single duty. The directorate demands the whole road to the sea."
 SHL_iron_shahrabad: "Iron Shahrabad"
 SHL_iron_shahrabad_desc: "Furnaces must no longer stop at another government's decision about water or quays. The directorate guarantees working supplies through treaties, its own construction or military victory. Its strength is measured in operating workshops and weapons in storage."
 SHL_regency_council: "Regency Council"
 SHL_regency_council_desc: "Darius Safir rules on behalf of the nine crests. The regency's first decisions must show that the houses are united."
 SHL_restore_privileges: "Restore the Privileges"
 SHL_restore_privileges_desc: "Every main furnace returns to its hereditary house. City commissions are dissolved and cold enterprises go back to their former owners."
 SHL_private_armies: "Private Guards"
 SHL_private_armies_desc: "The houses no longer ask the treasury for protection. Each family keeps its own detachment and the regent brings them into one line."
 SHL_debt_shifts: "Debt Shifts"
 SHL_debt_shifts_desc: "The regency pays for its promises with the future shifts of the working quarters."
 SHL_hereditary_republic: "Hereditary Republic"
 SHL_hereditary_republic_desc: "The Conclave becomes a republic of crests: the law of continuous fire now protects the houses' right to the city, not the city."
 SHL_shift_councils: "Shift Councils"
 SHL_shift_councils_desc: "The strike committees become the government. Every furnace elects delegates, and the Shift Council replaces the Conclave."
 SHL_furnaces_to_workers: "Furnaces to the Workers"
 SHL_furnaces_to_workers_desc: "Hereditary rights are abolished. Every main furnace belongs to the city whose people keep its fire."
 SHL_common_smelting: "Common Smelting"
 SHL_common_smelting_desc: "The shifts decide for themselves when to work beyond the norm. An overtime smelt no longer means someone else's order."
 SHL_qanat_brotherhood: "Qanat Brotherhood"
 SHL_qanat_brotherhood_desc: "The commune of fire reaches out to the union of canal communes: water and metal must belong to those who produce them."
 SHL_commune_of_fire: "Commune of Fire"
 SHL_commune_of_fire_desc: "Shahrabad without crests and without a regent. The furnaces burn for the cities, and defence rests on elected brigades and allies."
 # Spirits
 SHL_martial_law: "Martial Law"
 SHL_martial_law_desc: "The factory guard patrols the quarters. The shifts report for work, but the Conclave loses trust."
 SHL_broken_conclave: "Broken Conclave"
 SHL_broken_conclave_desc: "Nur kept power, but half of the crests refuse to sign his decisions."
 SHL_captured_qanats: "Captured Qanats"
 SHL_captured_qanats_desc: "The head wells on the border serve Shahrabad's furnaces. Keyzan's communes remember how they were taken."
 SHL_veyr_bondage: "Veyr Bondage"
 SHL_veyr_bondage_desc: "Defeat at the port forces Shahrabad to pay the Veyr chamber at its own rates."
 SHL_mazar_ration: "Mazar's Ration"
 SHL_mazar_ration_desc: "The Chamber of the Common Ration took part of the treasury and demands metal for its stewards."
 SHL_victory_over_ration: "Victory over the Ration"
 SHL_victory_over_ration_desc: "Mazar's detachments have withdrawn behind their border, and Shahrabad has gained Resan and Sekhvan."
 # Characters, traits, parties, alliances
 SHL_Darius_Safir: "Darius Safir"
 SHL_Darius_Safir_desc: "Head of House Safir and the richest of the nine crests. He calls the regency temporary, yet his first act returned every furnace to the houses."
 SHL_Shift_Councils: "Shift Council"
 SHL_Shift_Councils_desc: "Elected delegates of every main furnace. The council has no permanent chair; its decisions are signed by the master on duty."
 SHL_regent_of_the_crests: "Regent of the Crests"
 SHL_regent_of_the_crests_desc: "Rules on behalf of the houses and in their interest."
 SHL_voice_of_the_shifts: "Voice of the Shifts"
 SHL_voice_of_the_shifts_desc: "Power that can be recalled at the next workshop meeting."
 SHL_anarchism: "Shahrabad Commune"
 SHL_anarchism_DEF: "Shahrabad Commune"
 SHL_anarchism_party: "Shift Councils"
 SHL_southern_compact_faction: "Southern Compact"
 SHL_golden_gate_faction: "Golden Gate Union"
 # Events
 ADISCORD_SHL.20.t: "The Cold Shift"
 ADISCORD_SHL.20.d: "The morning whistle sounded over empty checkpoints. The shifts came to the gates but did not enter the workshops. The strike committee left one stoker at each of the nine furnaces so the brickwork would not cool, and posted its demands on the Conclave gates in Khazar. The Sharim furnace stopped first - its shifts are the heaviest, and Salima Darzi's journal had long counted the overtime hours the house never paid.\n\nThe demands are simple: pay for overtime, days off after reinforced shifts, and the right to know where the revenue goes. Shirin Sharim demands the guard and calls the strike robbery; Behruz Veyran offers his guards. Khosrow Arbin and Kamran Nur ask for patience: the stokers at the furnaces are the same people who must raise the fire tomorrow. Arman Teymur reminds everyone that the railway guard can hold a gate, not smelt metal.\n\nWhile the fires are kept low, every furnace yields less metal, and Leyla Nadiri recounts the loss daily. The treasury can pay the demands, the Conclave can wait and negotiate, and the guard can open the gates by force."
 ADISCORD_SHL.20.a: "Pay the demands from the treasury."
 ADISCORD_SHL.20.b: "Wait and negotiate."
 ADISCORD_SHL.20.c: "Send in the railway guard."
 ADISCORD_SHL.21.t: "The Shift Councils Demand Power"
 ADISCORD_SHL.21.d: "The strike is no longer about money. The committees of all the main furnaces met in the Sharim casting shop and declared themselves the Shift Council. Their decision was signed by the duty master, Salima Darzi. They do not ask for Jalil Nur's resignation: they announce that the Conclave is no longer needed. The furnaces are held by those who stand at the fire; the crests above the chairs are only a memory of whose grandfathers lit them.\n\nMariam Arbin's city assemblies backed the councils, though she did not sign their proclamation. The houses prepare their answer: Behruz Veyran moves his guards toward Khazar, Darius Safir promises to pay for any guard, Shirin Sharim demands her furnace back by force. Arman Teymur reports that the national watch can hold the capital but not nine furnace cities at once.\n\nNur has two answers left. Recognising the councils hands the furnaces to those who keep their fire and ends the Conclave of nine houses. Martial law keeps the Conclave, at the cost of the trust of the quarters standing at the gates today."
 ADISCORD_SHL.21.a: "Recognise the Shift Council."
 ADISCORD_SHL.21.b: "Declare martial law."
 ADISCORD_SHL.22.t: "The Shift Returns"
 ADISCORD_SHL.22.d: "The stokers have raised the fires to working temperature again. The Sharim furnace was first; Veyran's, where the house guards stood at the gates to the last, came last. The committee is not dissolved: its delegates are back at the furnaces and the demands have come down from the Conclave gates, but Salima Darzi took the workshop journal with her, and it records who promised what.\n\nIn the next cycle's ledger Leyla Nadiri recorded, on a separate line and for the first time, how many shifts were paid beyond the norm. Shirin Sharim refused to sign that page; Khosrow Arbin and Kamran Nur signed. Golshan Loran counted how many export lots Shahrabad lost during the cold shift and laid the figure beside it.\n\nAmin Rashad closed the file in the Conclave archive but did not put it far away. The quarters learned that furnaces can be stopped without being destroyed; the houses learned that without stokers a crest above a chair is only a drawing. Both sides will remember that longer than the overtime pay."
 ADISCORD_SHL.22.a: "The furnaces are working again."
 ADISCORD_SHL.30.t: "Ultimatum of the Crests"
 ADISCORD_SHL.30.d: "The attorneys of the nine houses brought a joint letter to the Conclave. They demand the return of hereditary rights, the abolition of city commissions, and a guarantee that no furnace will pass to the state without its house's consent. Darius Safir's signature stands first; after it, Golshan Loran, Shirin Sharim and Behruz Veyran. Below, smaller, Bayrat, Kerdan and Arbin. Even Kamran Nur set down the name of the small house, though the mediator sits in the same hall.\n\nSignatures rarely seen side by side mean one thing: the houses came to terms with each other before coming to the Conclave. Safir has the treasury, Veyran the guards, Loran the buyers beyond the Golden Gates who do not care who signs the invoices. If the crests rule together, they need no mediator.\n\nAmin Rashad read the letter aloud and laid the seal beside it. Bahram Kaveh reported that Veyran's guards have already received a muster order. Jalil Nur may give the houses guarantees, withstand the pressure and wait for the alliance of crests to crack, or arrest the ringleaders - if the directorate is ready for the consequences."
 ADISCORD_SHL.30.a: "Give the houses guarantees."
 ADISCORD_SHL.30.b: "Withstand the pressure."
 ADISCORD_SHL.30.c: "Arrest the ringleaders."
 ADISCORD_SHL.31.t: "Night of the Crests"
 ADISCORD_SHL.31.d: "At night Behruz Veyran's guards seized the bridges over the dry riverbed and the Khazar telegraph. Shirin Sharim's men posted sentries at the furnace district, and Safir's treasury paid every picket double wages in advance. By morning no order of the mediator left the Conclave hall.\n\nDarius Safir entered the hall with the decision of the nine crests: Jalil Nur remains mediator in name, and a Council of Crests under a regent takes power over the furnaces, the treasury and the guard. Golshan Loran held the finished act; Rauf Darban and Khosrow Arbin stood behind, not looking at the chair. Amin Rashad neither surrendered the seal nor hid it: he waited for Nur's word.\n\nArman Teymur reported that part of the city guard is still loyal to the mediator and can hold the square. Mariam Arbin sent a short note from the assemblies: the cities will come out if called. Resistance keeps the Conclave but splits it for a long time. Yielding hands Shahrabad to a regency that calls itself a temporary measure."
 ADISCORD_SHL.31.a: "Yield to the regency."
 ADISCORD_SHL.31.b: "Resist."
 ADISCORD_SHL.32.t: "A Letter Without Signatures"
 ADISCORD_SHL.32.d: "The joint ultimatum has fallen apart. Each house received its own promise, and within a week the attorneys were arguing with each other louder than with the mediator. Tahmuras Bayrat obtained guarantees on his ore contracts and withdrew his signature first. Fereydun Kerdan secured the road to the sea for his house and left next. Kamran Nur explained to the Conclave that the small house had signed only for the unity of the crests, and since there is no unity, there is no signature.\n\nDarius Safir and Shirin Sharim held out longest, but Golshan Loran was already trading with Khazar in his own name, and Behruz Veyran's guards returned to the border: Bahram Kaveh reported that Mazar's musters worry the house more than city commissions.\n\nThe letter stays in the Conclave archive with no new signatures. Amin Rashad filed it and noted the date: the crests have parted, but each took away a promise the Conclave will have to keep."
 ADISCORD_SHL.32.a: "The crests have parted ways."
 ADISCORD_SHL.40.t: "Accident at a Main Furnace"
 ADISCORD_SHL.40.d: "Worn brickwork failed under another heat. Metal broke into the casting bay and flooded the runners and access tracks; the people were got out, but the furnace must be extinguished and the workshops around it rebuilt. Samira Hadi took the burned to the furnace infirmary and the city hospital without asking which register they were in.\n\nThe house says the masters worked beyond the norm and overheated the furnace for a reinforced shift. The masters say the house postponed repairs for years and signed ledgers with understated wear. Leyla Nadiri opened the Conclave's industrial ledger: the records of the brickwork exist, but the house's signature and the master's stand under different figures. Arman Teymur posted a guard at the ruins so that nobody removes evidence or metal.\n\nThe city waits to hear whom the Conclave names responsible. Blaming the house backs the quarters against a crest. Blaming the masters backs the crest against those who will stand at the fire tomorrow. A commission costs time and political weight, but gives an answer both sides will sign."
 ADISCORD_SHL.40.a: "The house is to blame."
 ADISCORD_SHL.40.b: "The masters are to blame."
 ADISCORD_SHL.40.c: "Appoint a commission."
 ADISCORD_SHL.50.t: "The Qanats Run Dry"
 ADISCORD_SHL.50.d: "The communities of Kyzan have closed the side channels of the qanats that fed the furnaces of Arbin, Safir and Loran. Khosrow Arbin learned of it first: his cooling channels ran shallow in one night, and the masters of the western furnace began counting the hours to overheating. The assembly of irrigation communities sent Khazar a letter without threats: Shahrabad's furnaces drink the water the communities use for their fields, and nobody pays for it.\n\nDarius Safir demands immediate measures - his furnace stands on the same water. Golshan Loran proposes paying in metal: the communities have no waterworks of their own, and Loran has rolled stock. Behruz Veyran speaks of the head wells, which could be taken in a few days. Ramin Farzan reminds the hall that Kyzan is not one government but an assembly, and a treaty must be made so that every community recognises it.\n\nWithout cooling, brickwork ages faster, and three furnaces of nine await a decision. The Conclave may agree a quota, drill its own artesian wells, or take the head wells by force."
 ADISCORD_SHL.50.a: "The water dispute must be settled."
 ADISCORD_SHL.52.t: "Shahrabad Offers Water for Metal"
 ADISCORD_SHL.52.d: "Envoys of the Conclave of Shahrabad have come to the assembly of irrigation communities with an offer signed by the three houses that drink qanat water: Khosrow Arbin, Darius Safir and Golshan Loran. Shahrabad offers metal for waterworks - pipes, gates and rolled stock from Loran's furnaces - and a regular share of the three furnaces' revenue, entered in the Conclave's industrial ledger rather than in private promises of the houses.\n\nIn return Shahrabad asks that the side channels be reopened for Arbin, Safir and Loran at the old volume. Ramin Farzan, speaking for Khazar, stressed that the head wells remain with the communities and that the Conclave proposes no guards on the waterworks: a quota is a treaty, not an occupation.\n\nThe assembly listened long. Every community needs metal, but water given to furnaces does not return to the fields. The elders ask what becomes of the quota when power changes in Khazar, and who answers if the houses decide the revenue share is too generous. Kyzan's answer decides whether water reaches the furnaces by treaty or by another road."
 ADISCORD_SHL.52.a: "Accept the treaty."
 ADISCORD_SHL.52.b: "Refuse."
 ADISCORD_SHL.53.t: "Keyzan Agrees"
 ADISCORD_SHL.53.d: "The assembly of irrigation communities accepted Shahrabad's offer. The qanat channels are open again, and the furnaces of Arbin, Safir and Loran receive water at the old volume. The first pipes of Loran's rolled stock have gone to the head wells, and Leyla Nadiri entered the three furnaces' revenue share as a separate line in the Conclave's industrial ledger.\n\nKhosrow Arbin came to Khazar for the first time in months and signed in person: his western furnace had been closest to overheating. Darius Safir signed through an attorney, and Golshan Loran with a reservation that the metal for Kyzan's waterworks counts against the house's export obligations. Ramin Farzan accepted the reservation but had it written into the text so the communities would not learn of it later.\n\nThe water dispute is closed by treaty. The elders keep their wells, the Conclave its furnaces, and no guard had to march to the qanats. What becomes of the quota if power changes in Khazar is for those who change it to discover."
 ADISCORD_SHL.53.a: "The water is back."
 ADISCORD_SHL.54.t: "Keyzan Refuses"
 ADISCORD_SHL.54.d: "The assembly of irrigation communities did not accept Shahrabad's offer, or the treaty cannot be carried out: the treasury lacks the promised share, or the parties are already at war. Ramin Farzan returned to Khazar with a letter in which the elders thank the Conclave for the metal and decline the quota: water given to furnaces does not return to the fields, and the communities remember the houses' promises from earlier years.\n\nKhosrow Arbin took the refusal hardest. His western furnace will be first to feel the lack of cooling, and the house is already discussing buying water from the communities directly, around the Conclave. Darius Safir demands another solution from the mediator and is ready to pay for it from his own treasury. Behruz Veyran notes that the head wells are guarded by farmers with rifles, not an army.\n\nThe water dispute stays open. The Conclave may drill its own artesian wells, return to negotiations later, or take the wells by force in a limited war. Each road costs money, time or blood, and three furnaces of nine wait to see which one Khazar chooses."
 ADISCORD_SHL.54.a: "Look for another way."
 ADISCORD_SHL.55.t: "Qanat Brotherhood"
 ADISCORD_SHL.55.d: "Delegates from Shahrabad came to the assembly of irrigation communities not from the houses but from the cities and the shift councils. Their letter is signed by Mariam Arbin for the city assemblies and Salima Darzi for the shift councils; there is no crest beneath it. Shahrabad proposes a common treaty: water and metal are shared by assemblies, without quotas, without revenue shares and without guards at the wells.\n\nThe Brotherhood of the Qanats means that the furnaces of Arbin, Safir and Loran receive water as partners in a common undertaking, and the communities receive metal for waterworks and a place at one table with the quarters of Shahrabad. Khosrow Arbin, whose furnace suffers first from closed channels, did not sign the letter, but his daughter speaks for his city.\n\nThe elders remember the houses' earlier promises and ask whether the brotherhood will stand if the crests regain the upper hand in Khazar. The delegates answer honestly: that depends on Kyzan too. If the treaty is accepted, the water dispute ends not with a quota but with a shared right to the water."
 ADISCORD_SHL.55.a: "Accept the brotherhood."
 ADISCORD_SHL.55.b: "Refuse."
 ADISCORD_SHL.56.t: "Armistice at the Conduits"
 ADISCORD_SHL.56.d: "The fighting for the head wells has dragged on. Shahrabad's detachments took the approaches to the qanats, but the communities withdrew into the fields and by night dismantled what the Conclave's sappers repaired by day; Behruz Veyran lost more men at the waterworks than he promised the Conclave. Khosrow Arbin, for whose furnace the war began, was the first to say aloud that it had brought no more water.\n\nThe elders propose a truce on the old border. Ramin Farzan brought their terms to Khazar: both sides withdraw, the wells stay with the communities, the qanat channels stay closed. Arman Teymur reports that the watch is exhausted; Leyla Nadiri, that every day of war costs the treasury more than any quota.\n\nDarius Safir and Golshan Loran demand that the war go on, but their furnaces stand on the same water as Arbin's, and their arguments run dry with it. The water dispute remains unresolved. A truce gives the furnaces time, but not cooling."
 ADISCORD_SHL.56.a: "Agree to the armistice."
 ADISCORD_SHL.57.t: "The Qanats Under Shahrabad's Guard"
 ADISCORD_SHL.57.d: "The communities of Kyzan have admitted defeat. Sevir, Tabar, Narvan and Ormis pass under Shahrabad's rule, and the head wells of the qanats are guarded by the Conclave's factory watch. The channels to the furnaces of Arbin, Safir and Loran are fully open, and for the first time in years Khosrow Arbin's western furnace runs without counting the hours to overheating.\n\nBehruz Veyran led the house guards back to the border and demanded that their cost be entered in the ledger. Golshan Loran has already sent rolled stock to the waterworks of the occupied communities: the metal once offered for a quota now goes toward reconstruction. Samira Hadi asks to open infirmaries in Tabar and Narvan for the wounded of both sides. Ramin Farzan warns that the assembly of communities is not dissolved; it has merely moved further west from the occupied villages.\n\nThe water belongs to the furnaces. The elders remember that their hands, not guards', repaired the qanats for centuries, and the Conclave is about to learn what it costs to guard water nobody wants to give up."
 ADISCORD_SHL.57.a: "The water belongs to the furnaces."
 ADISCORD_SHL.58.t: "Defeat at the Conduits"
 ADISCORD_SHL.58.d: "Shahrabad failed to hold the front. The communities' detachments, which Khazar took for farmers with rifles, bypassed Veyran's posts along the old qanat beds and occupied Arbin. Khosrow Arbin's western furnace stands under the guard of those who cut its water; the head of the house has gone to Khazar and for the first time sits in the Conclave hall without a vote - the furnace is out, and the crest with it.\n\nThe elders set their condition: the remaining furnaces receive water only by a quota the assembly decides. Darius Safir and Golshan Loran signed first - their furnaces cannot wait. Behruz Veyran refused and led the house guards back to his own border. Arman Teymur reported that the watch cannot retake Arbin without a new war, and Leyla Nadiri that the treasury would not bear one.\n\nMariam Arbin returned to her father's city with a delegation of the assemblies: the communities will talk with the cities, but not with the crests. The Conclave accepts the terms. Water will reach the furnaces, but Kyzan now decides how much."
 ADISCORD_SHL.58.a: "Accept the terms."
 ADISCORD_SHL.60.t: "The Veyr Duty"
 ADISCORD_SHL.60.d: "The Trade Chamber of Veyr has announced a new levy on metal passing through its glass ports. Every wagon of rolled stock now crosses the chamber's scales, and Fereydun Kerdan, whose road to the sea carries that metal, received the tariff before the Conclave received the notice. Behruz Veyran, whose lands border the ports, added that the chamber's collectors already stand on his sidings.\n\nThe levy is small for one lot, but it reduces the revenue of every one of the nine furnaces. Golshan Loran calculated what the Golden Gates export contracts would lose in a year and demanded an answer. Darius Safir proposes buying the levy out with a share of exports - the chamber trades, it does not fight. Rauf Darban reminds the hall of a harbour of Shahrabad's own: expensive, slow, permanent. Behruz Veyran speaks of a key to the sea that can be taken by force.\n\nRamin Farzan asks the Conclave to choose one road before the chamber decides Shahrabad is willing to pay. The levy can be bypassed with a harbour, abolished by treaty, or removed by force."
 ADISCORD_SHL.60.a: "The duty must be dealt with."
 ADISCORD_SHL.61.t: "Shahrabad Proposes a Trade Union"
 ADISCORD_SHL.61.d: "The Golden Gates cartel offers the Trade Chamber of Veyr a share in the export of Shahrabad's metal instead of the levy. Ramin Farzan brought the proposal, Golshan Loran drafted it, and it is signed by Fereydun Kerdan, over whose road the metal travels, and Darius Safir, whose treasury guarantees the payments. The ports would gain a steady flow of cargo and a seat at the cartel's table; Shahrabad a free road to the sea without the chamber's scales on every wagon.\n\nThe chamber knows that nine furnaces cannot ship metal except through its ports, which is why the levy was justified. It also knows that the Conclave has discussed a harbour of its own and that Behruz Veyran's guards stand at the port border. A share in exports is income without risk; the levy is income with the risk of war or lost cargo.\n\nThe chamber's members argue whether a cartel in which some houses trade and others keep guards can be trusted. Veyr's answer decides whether the metal reaches the sea by treaty or by another road."
 ADISCORD_SHL.61.a: "Accept the union."
 ADISCORD_SHL.61.b: "Refuse."
 ADISCORD_SHL.62.t: "Veyr Accepts the Union"
 ADISCORD_SHL.62.d: "The Trade Chamber of Veyr has abolished the levy on Shahrabad's metal. The chamber's scales were removed from the sidings, and its attorneys now sit at the Golden Gates cartel table beside Golshan Loran and Darius Safir. Fereydun Kerdan has what his house paid for from its own treasury for years: the road to the sea is open by treaty, not by tariff.\n\nLeyla Nadiri entered the chamber's share in the Conclave's export ledger, and Ramin Farzan made sure the treaty names all nine furnaces, not only the three houses that signed it. Behruz Veyran withdrew his guards from the port border, though not at once: a border house dislikes agreements signed without it.\n\nMariam Arbin asked in the assembly who will count the chamber's share - the cartel or the Conclave. The question stays open, but the road to the sea is open too. Shahrabad's metal reaches the ports without a levy, and this is the first agreement the houses have made in the name of the whole country rather than each for itself."
 ADISCORD_SHL.62.a: "The road to the sea is open."
 ADISCORD_SHL.63.t: "Veyr Refuses"
 ADISCORD_SHL.63.d: "The Trade Chamber of Veyr did not accept Shahrabad's offer, or the treaty is impossible because the parties are at war. Ramin Farzan returned with a letter in which the chamber thanks the cartel for the honour and keeps the levy: the ports prefer a known tariff to a share in a foreign enterprise where the houses argue with each other louder than with their neighbours.\n\nGolshan Loran took the refusal as a personal insult: his export contracts still cross the chamber's scales. Fereydun Kerdan remarked grimly that his road has paid this levy for years and the Conclave only noticed now. Darius Safir proposes raising the share and repeating the offer; Behruz Veyran, showing the chamber the guards at the port border. Rauf Darban silently laid the estimate for a harbour on the table.\n\nThe levy stays. The Conclave may build its own road to the sea, return to negotiations later, or remove the levy by force in a limited war for the key to the sea. While Khazar chooses, every wagon of rolled stock still crosses Veyr's scales."
 ADISCORD_SHL.63.a: "Look for another way."
 ADISCORD_SHL.65.t: "Armistice at the Port"
 ADISCORD_SHL.65.d: "The war for the road to the sea brought no decisive victory. Shahrabad's detachments reached the foothills near Salik, but the glass ports stayed with the chamber, and its hired crews tore up Fereydun Kerdan's road every night. Behruz Veyran, whose guards went first, reported to the Conclave that the border house can no longer hold the front at its own expense.\n\nThe chamber offers a truce on the old borders. Ramin Farzan brought the terms: detachments withdraw, the ports remain Veyr's, the levy remains on every wagon. Golshan Loran demands that the war continue - the Golden Gates export contracts are burning - but Leyla Nadiri showed him what every day of war had cost, and Darius Safir refused to pay further.\n\nArman Teymur asks for time to rebuild the watch's companies. A truce returns the metal to the road to the sea, but the chamber's scales stay on it. Shahrabad did not win the key to the sea; it received only the bill for trying."
 ADISCORD_SHL.65.a: "Agree to the armistice."
 ADISCORD_SHL.66.t: "The Road to the Sea"
 ADISCORD_SHL.66.d: "The Trade Chamber of Veyr has admitted defeat. The Kassen mines and the road through Noran pass to Shahrabad, and the chamber's levy no longer applies. Fereydun Kerdan drove the whole road from his furnace to the sea without meeting a single foreign scale and ordered it entered in the house chronicle.\n\nTahmuras Bayrat has already sent mining masters to Kassen: the new mines will relieve his shafts but need the same people and the same order. Golshan Loran rewrites the export contracts without the levy line, and Leyla Nadiri the industrial ledger with the new districts. Behruz Veyran led the house guards back to the border and demanded that every day of the campaign be paid from the common treasury, not his. Ramin Farzan reminds the hall that the chamber is not dissolved and the ports are still its own: Shahrabad took the road, not the sea.\n\nThe metal will reach the sea. The chamber will remember who removed its scales from the road and wait for the day the Conclave is busy with something else."
 ADISCORD_SHL.66.a: "The metal will reach the sea."
 ADISCORD_SHL.67.t: "Defeat at the Port"
 ADISCORD_SHL.67.d: "Shahrabad failed to hold the front. The chamber's hired crews and port militias came through the foothills and occupied Salik, cutting Fereydun Kerdan's road at its narrowest point. Behruz Veyran's guards fell back to their own border without waiting for reinforcements: the Conclave's watch was stuck in Khazar without a baggage train.\n\nThe chamber takes Salik and imposes its own rates on metal exports. Golshan Loran signed the new tariffs first - without exports his house does not exist. Fereydun Kerdan signed last and left the hall without waiting for the seal. Darius Safir demanded that the mediator explain what his treasury had paid for, and Leyla Nadiri that the lost war be entered in the ledger as a separate line so the next Conclave would see the price.\n\nMariam Arbin said in the assembly what the houses did not want to hear: the key to the sea cannot be taken with the guards of one border house. Shahrabad accepts the terms. The metal will reach the sea across Veyr's scales, and the scales now stand on Shahrabad's soil."
 ADISCORD_SHL.67.a: "Accept the terms."
 ADISCORD_SHL.70.t: "Mazar's Ration"
 ADISCORD_SHL.70.d: "An envoy of the Chamber of the Common Ration arrived in Khazar with a calculation: Shahrabad's metal is needed for Mazar's water catchments, and the chamber counts it as part of the desert's common ration. Mazar demands payment and reminds the Conclave that the Zarkhan District lies on its border. Behruz Veyran, whose lands will meet Mazar's detachments first, read the letter twice and asked the Conclave not to treat it as trade.\n\nRamin Farzan explained to the hall: the chamber neither sells nor buys, it distributes, and to it Shahrabad is a neighbour that took more from the common bowl than the others. Darius Safir is ready to pay the demand from his own treasury so long as the furnaces are left alone. Tahmuras Bayrat is against: pay once and you pay forever. Arman Teymur reported that the watch needs sixty days to take up positions in the Zarkhan District - exactly as long as the chamber promises to wait.\n\nThe Conclave can pay and close the question for a time. It can refuse and prepare for war: the chamber gives sixty days and not a day more."
 ADISCORD_SHL.70.a: "Pay the ration."
 ADISCORD_SHL.70.b: "Refuse Mazar."
 ADISCORD_SHL.71.t: "Mazar Marches"
 ADISCORD_SHL.71.d: "The ultimatum has expired. At dawn Mazar's detachments crossed the border of the Zarkhan District near the water cisterns and moved toward the furnace district. The Chamber of the Common Ration announced that it will take its ration itself. Behruz Veyran raised the house guards before the order came from Khazar: the border house had waited for this day since the first letter.\n\nArman Teymur reports to the Conclave: the watch stands on prepared positions near Zarkhan, the baggage train is assembled, but there are no reserves. Bahram Kaveh intercepted the schedule of Mazar's columns - the chamber's stewards follow the troops with ledgers and already know which furnaces lie closest to the border. Rauf Darban proposes releasing arsenal heats to the front out of turn. Shirin Sharim asks to evacuate the Sharim shifts if the front comes near.\n\nJalil Nur gathered all nine heads of houses in one hall. The quarrels over water, levies and quarters have not vanished, but today the Conclave has one enemy, and the furnaces will work against it. To arms."
 ADISCORD_SHL.71.a: "To arms."
 ADISCORD_SHL.72.t: "Armistice with Mazar"
 ADISCORD_SHL.72.d: "Mazar's offensive ran out of breath at the furnace district, and Shahrabad could not throw it back beyond Zarkhan. The chamber's detachments hold the cisterns, the Conclave's watch the approaches to Sharim and Veyran; between them lie burnt caravan roads on which nobody carries water or metal.\n\nThe Chamber of the Common Ration agrees to a truce on the old border and drops the ration demand. Ramin Farzan brought the terms and added his own view: the chamber's stewards are as tired of counting losses as Leyla Nadiri. Behruz Veyran is against the truce - his lands took the first blow, and he wants every siding back. Arman Teymur is for it: the watch is held together by old sergeants and would not survive another offensive.\n\nDarius Safir summed it up simply: the ration is unpaid, the furnaces work, the border stands. The Conclave accepts the truce. Mazar withdraws to the cisterns and remembers that Shahrabad can hold positions but cannot attack."
 ADISCORD_SHL.72.a: "Agree to the armistice."
 ADISCORD_SHL.73.t: "Mazar Defeated"
 ADISCORD_SHL.73.d: "The Chamber of the Common Ration has admitted defeat. Resan and Sehvan - both cistern districts - pass to Shahrabad, and the ration demands are dropped. The Conclave's watch entered Resan under Arman Teymur; Behruz Veyran's guards, the first to meet Mazar's detachments, were the first into Sehvan and raised the house flag over the cisterns before the Conclave's.\n\nThe chamber's stewards handed over the water ledgers and went south. Samira Hadi opened an infirmary in Sehvan for both sides; Bahram Kaveh reported that the chamber is not dissolved and the neighbours - Kyzan, Veyr, Kadir - are watching what Shahrabad does with the cisterns. Golshan Loran is already pricing desert water on the Golden Gates market. Mariam Arbin reminds the hall that the cisterns water more than Mazar and asks what Shahrabad wants to be to its neighbours: the owner of the water or its steward.\n\nShahrabad has held. The Conclave may keep the corridor, return the cisterns for a concession, or offer an independent Mazar a charter. Everyone who drinks from these cisterns will remember the answer."
 ADISCORD_SHL.73.a: "Shahrabad has held."
 ADISCORD_SHL.74.t: "The Ration Taken by Force"
 ADISCORD_SHL.74.d: "Shahrabad has capitulated. Mazar's detachments went no further than the furnace district, and the chamber's stewards explained why: the Chamber of the Common Ration does not take furnaces - it needs the metal they produce. Instead the stewards carried two fifths of the treasury out of Khazar and stayed in the city to supervise payments, with ledgers and an escort.\n\nDarius Safir demanded that the Conclave explain why his house's treasury counts as Shahrabad's, and received no answer. Behruz Veyran led his guards to a border he no longer calls his own. Leyla Nadiri handed the stewards copies of the industrial ledger - they demanded the originals. Amin Rashad kept the seal, but had to set it to other people's calculations.\n\nThe furnaces keep working. Shirin Sharim was the first to raise the fire to full strength: the stewards count the metal, and stopping a shift now costs more than paying for it. The Conclave lives, but Mazar sits in its hall, and every heat passes through a foreign ledger."
 ADISCORD_SHL.74.a: "The furnaces keep working."
 ADISCORD_SHL.75.t: "Mazar Demands Again"
 ADISCORD_SHL.75.d: "The Chamber of the Common Ration is back. The stewards call the earlier payment a deposit and now demand a final ration of 400, after which Mazar promises to close the matter forever. The envoy handed the calculation to Amin Rashad with the same courtesy as last time, and the same reminder about the Zarkhan District.\n\nTahmuras Bayrat said aloud what everyone thought: the first payment bought no peace, it only showed the chamber that Shahrabad pays. Darius Safir is ready to pay again - his treasury will bear it, and the furnaces are worth more. Golshan Loran calculated that the sum equals two furnaces' revenue for a cycle and called it tolerable. Behruz Veyran and Arman Teymur think otherwise: since last time the watch has prepared positions near Zarkhan, and a refusal costs less today than a year ago.\n\nThe Conclave can pay in full and trust the chamber's promise. It can refuse and meet Mazar on prepared positions. The chamber will again give sixty days."
 ADISCORD_SHL.75.a: "Pay in full."
 ADISCORD_SHL.75.b: "Refuse Mazar."
 ADISCORD_SHL.90.t: "Southern Compact"
 ADISCORD_SHL.90.d: "Shahrabad offers the communities of Kyzan an alliance. Mariam Arbin brought the letter in the name of the Southern Compact: common defence against Mazar and a common council on water and metal, in which the assembly of irrigation communities sits beside Shahrabad's city assemblies rather than opposite the crests.\n\nKyzan remembers how the furnaces of Arbin, Safir and Loran drank the qanat water and who closed the channels. The delegation does not hide it: Khosrow Arbin did not sign the letter, but his daughter speaks for the cities, and the compact promises that the water dispute will be settled by those who drink it, not those who own it. The Chamber of the Common Ration threatens both neighbours, and Mazar does not ask whose qanats it draws from.\n\nThe elders ask who will lead the common defence and whose detachments will come first if Mazar crosses the communities' border. Shahrabad's answer: Arman Teymur's watch, not the house guards. Joining the compact ties the fate of the qanats to the fate of the furnaces. Refusing leaves Kyzan as one border between Shahrabad and Mazar."
 ADISCORD_SHL.90.a: "Join the compact."
 ADISCORD_SHL.90.b: "Refuse."
 ADISCORD_SHL.91.t: "Golden Gate Union"
 ADISCORD_SHL.91.d: "The Golden Gates cartel offers the Trade Chamber of Veyr membership of a union: a common market defended by a common army. Ramin Farzan brought the proposal, Golshan Loran drafted it and Darius Safir guaranteed it; Fereydun Kerdan's signature confirms that the road to the sea is open to the chamber in both directions.\n\nThe chamber already sits at the cartel table and receives a share of metal exports. The union adds an obligation to the share: Veyr's detachments will stand beside Shahrabad's watch if Mazar or anyone else crosses the common border, and Behruz Veyran's guards will defend the ports as they defend their own sidings. The chamber's members argue whether a trading city needs a neighbour's army, and remember that Shahrabad recently fought for the road to the sea.\n\nRamin Farzan answers plainly: the chamber can trade with the Conclave without a union, but then on the day of war the ports will defend themselves. Joining means becoming part of the Golden Gates. Refusing means remaining their customer."
 ADISCORD_SHL.91.a: "Join the union."
 ADISCORD_SHL.91.b: "Refuse."
 ADISCORD_SHL.92.t: "Alliance Concluded"
 ADISCORD_SHL.92.d: "Shahrabad's invitation has been accepted. The new ally will defend the common borders, and its detachments enter the common defence plan that Arman Teymur is already spreading on the Conclave table. Ramin Farzan signed the act for Khazar and made sure it carried the signatures of everyone who promised troops, not only those who promised money.\n\nThe houses took the news differently. Golshan Loran and Darius Safir see the alliance as trade continued; Behruz Veyran as an extra burden on guards who must now watch foreign borders; Khosrow Arbin and Kamran Nur as the first time in years that Shahrabad has spoken to a neighbour other than through an ultimatum. Mariam Arbin demanded that the assemblies know whom their sons fight for, and Amin Rashad entered the treaty in the open minutes.\n\nBahram Kaveh passed the first reports from the ally to Khazar. The common border is longer now, but more than the guards of one border house stand behind it."
 ADISCORD_SHL.92.a: "Good."
 ADISCORD_SHL.93.t: "Alliance Declined"
 ADISCORD_SHL.93.d: "Shahrabad's invitation has been declined, or the alliance is no longer possible: the neighbour chose another side, the parties are at war, or the conditions changed before the answer. Ramin Farzan brought a letter that thanks the Conclave for the honour and wishes it quiet borders. Amin Rashad filed it beside the offer.\n\nBehruz Veyran did not hide his relief: the house guards stay on their own border, not a foreign one. Golshan Loran and Darius Safir are irritated - trade with the neighbour continues, but without a common army every lot of metal crosses land nobody is obliged to defend. Arman Teymur returned to the old defence plan, in which Shahrabad stands alone, and asked the Conclave at least to pay for it.\n\nMariam Arbin observed that the neighbours remember how Shahrabad spoke to them before, and one letter is not enough to erase it. Negotiations may resume later if both sides can meet their obligations again. Until then only Shahrabad's own hold the common border."
 ADISCORD_SHL.93.a: "Understood."
