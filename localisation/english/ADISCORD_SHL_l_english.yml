 SHL_unregistered_quarters: "Quarters outside the register"
 SHL_unregistered_quarters_desc: "In a country of twenty million people, records remain divided among houses, workshops and cities. Incompatible lists keep residents outside public institutions. A unified register costing 80 £ADISCORD_economy_treasury_texticon or the Workers Charter removes this spirit."
 SHL_register_quarters: "Recognise the quarter registers"
 SHL_register_quarters_desc: "Reconcile house, factory and city records without invalidating existing documents. Removes Quarters outside the register; payment remains available until the Workers Charter settles the issue."
 SHL_registers_result_tt: "Remove Quarters outside the register. City support §G+8§!; house pressure §R+5§!."
 SHL_recognise_registers_tt: "80 £ADISCORD_economy_treasury_texticon: remove Quarters outside the register; city support +8, house pressure +5."
 SHL_cabinet_public_minutes_tt: "City support +5; house pressure +5."
 ADISCORD_SHL.120.t: "Seven folders on the table"
 ADISCORD_SHL.120.d: "Seven identical folders arrived in Khazar. Amin Rashad had the first; the others covered defence, the economy, medicine, schools, intelligence and foreign affairs. Until noon, the Conclave secretary kept family crests outside the room: at the first cabinet meeting they would have taken more space than the reports.\n\nArman Teymur brought incompatible guard regulations. Leyla Nadiri brought invoices for equipment claimed by three houses. Samira Hadi laid down a list of patients without recognised papers. Farid Mehr asked which schools their children would attend. Bahram Kaveh quietly passed Ramin Farzan an intercepted caravan schedule.\n\nRashad proposed a simple beginning: every duty needed an officer and every decision a record. The dispute concerned who could read it. The houses wanted a closed archive; the quarters wanted evidence that the government had started work. If a new order has already been ratified, this first report can be received as the beginning of its history."
 ADISCORD_SHL.120.a: "Open the minutes to the city assemblies."
 ADISCORD_SHL.120.b: "Keep the minutes with the secretary for now."
 ADISCORD_SHL.120.c: "Receive the cabinet report."
 ADISCORD_SHL.121.t: "People missing from the ledger"
 ADISCORD_SHL.121.d: "Samira Hadi brought a clerk from eastern Khazar to the meeting. The clerk carried three identity papers for one worker: factory, house and city. Each spelled his name differently. When he entered the infirmary, the house refused to pay for a stranger and the city failed to find him on its list.\n\nThe same story reached the cabinet from port streets and furnace settlements. Twenty million residents no longer fitted a state accustomed to counting voting houses. The quarters did not ask for a census from nothing. They already knew their people; they asked the state to recognise those records.\n\nLeyla Nadiri priced the work at eighty treasury: clerks, archive checks and public appeals desks. House elders objected to losing their exclusive authority to certify a person. The cabinet may pay now, return to the issue through Quarters and Borders, or establish the same principle through the Workers Charter."
 ADISCORD_SHL.121.a: "Pay for verification and recognise the records."
 ADISCORD_SHL.121.b: "Receive the report; let the current settlement decide."
 ADISCORD_SHL.122.t: "An oath in Khazar square"
 ADISCORD_SHL.122.d: "The first paid national watch levy completed its training. Shahrabad already had armed forces: house guards had protected furnaces and roads for years. For the first time, a new formation had been assembled through one muster, one supply system and without nine separate permissions to march.\n\nIn Khazar square, Arman Teymur noticed soldiers looking for their house standard. He asked the old sergeants to stand at the front and read the order together. Their experience was being retained; a common command would now answer for it.\n\nAt the barracks gate, people argued over the unit name. The payment book already carried the plain words Furnace Levy. In the square they called it the watch that would not need a meeting of elders to protect a neighbour."
 ADISCORD_SHL.122.a: "Receive the oath and issue the marching rolls."
 ADISCORD_SHL.123.t: "Who receives the seal"
 ADISCORD_SHL.123.d: "The transfer of power in Khazar began with keys. The same locks protected the archives; the same petitioners waited outside. The new order had to decide to whom the people behind the ministry desks would answer.\n\n[SHLGetCabinetStory]\n\nThe back of the transfer act listed outstanding obligations. Departments continued working; payments, orders and debts did not disappear with a different signature. Even if another political turn changes the cabinet again, this record will remain in the archive."
 ADISCORD_SHL.123.a: "Pass the seal with its obligations."
 SHL_cabinet_story_house: "Amin Rashad retained the secretary seal. The houses recognised the new charter, but each wanted it to confirm its own rights. Rashad read one rule for all of them: disputes over precedence would not suspend signed orders. Some heard a guarantee of property; others heard the first limit on family discretion."
 SHL_cabinet_story_city: "Mariam Arbin brought city assembly minutes instead of a house recommendation. She demanded public office hours and published spending decisions. Ministers retained their departments, but would now explain their work to representatives of streets once left outside the Conclave doors."
 SHL_cabinet_story_state: "Rauf Darban unfolded a dispatch chart. To him, state power meant linking workshop, warehouse and front through a single order. Department heads received deadlines for checking stocks. The Conclave might debate the future; the Directorate already demanded a name responsible for the next delivery."
 SHL_cabinet_story_regent: "Darius Safir took personal charge of the cabinet. Elders expected their privileges back; the regent reminded them of furnace upkeep and the cost of the guard. House crests returned to the table, beside the invoices. Even hereditary power had to say who would pay for its promises."
 SHL_cabinet_story_commune: "Salima Darzi arrived from the shift councils with a workshop journal. First she checked an unpaid order: the state seal could not turn yesterday labour into a gift to a new regime. Councils received a political voice; ministers had to reconcile their plans with the people who would carry them out."
 SHL_cabinet_story_unratified: "The secretaries prepared a transfer act, but the final political settlement had not been ratified. Departments retained their current duties and the seal remained with the Conclave secretary."
 minister_SHL_Amin_Rashad: "Amin Rashad"
 minister_SHL_Amin_Rashad_desc: "The Conclave secretary knows which signature costs money and which creates an obligation. He coordinates the departments before ratification and retains the office under the houses."
 minister_SHL_Mariam_Arbin: "Mariam Arbin"
 minister_SHL_Mariam_Arbin_desc: "The chair of the city assemblies began with the water registers of Arbin. She demands that cabinet spending be explained to the shifts paying for it."
 minister_SHL_Rauf_Darban: "Rauf Darban"
 minister_SHL_Rauf_Darban_desc: "The dispatch administrator considers an order complete only after delivery. In the Directorate cabinet he connects production quotas, railways and army orders."
 minister_SHL_Darius_Safir: "Darius Safir"
 minister_SHL_Darius_Safir_desc: "The regent represents the house elders and personally leads their cabinet. His authority rests on inherited obligations: a furnace grants privilege, but requires upkeep and service."
 minister_SHL_Salima_Darzi: "Salima Darzi"
 minister_SHL_Salima_Darzi_desc: "The shift councils delegate checks government plans against workshop journals. She heads the communal cabinet without handing its departments to the furnace owners."
 minister_SHL_Arman_Teymur: "Arman Teymur"
 minister_SHL_Arman_Teymur_desc: "The former caravan guard commander trains the national watch. He must turn nine traditions of command into one chain of orders while retaining the experience of local officers."
 minister_SHL_Leyla_Nadiri: "Leyla Nadiri"
 minister_SHL_Leyla_Nadiri_desc: "The furnace partnership economist separates the public treasury from family accounts. She oversees equipment and output even while the Conclave disputes ownership of the finished metal."
 minister_SHL_Samira_Hadi: "Samira Hadi"
 minister_SHL_Samira_Hadi_desc: "The workers quarter physician connects factory infirmaries to city medicine. To her, registration means being able to find a patient and return a survivor home."
 minister_SHL_Farid_Mehr: "Farid Mehr"
 minister_SHL_Farid_Mehr_desc: "The master instructor seeks common curricula for the children of houses and quarters. His schools train technicians and literate junior officers rather than merely issuing certificates."
 minister_SHL_Bahram_Kaveh: "Bahram Kaveh"
 minister_SHL_Bahram_Kaveh_desc: "The former railway cryptographer looks for threats in freight routes and broken communications. His service protects schedules and verifies reports without claiming omniscience."
 minister_trait_SHL_cabinet_secretary: "Secretary of the nine houses"
 minister_trait_SHL_city_chair: "Chair of the city assemblies"
 minister_trait_SHL_state_dispatcher: "Chief dispatcher of the Directorate"
 minister_trait_SHL_house_regent: "Regent of hereditary obligations"
 minister_trait_SHL_shift_delegate: "Delegate of the shift councils"
 minister_trait_SHL_guard_coordinator: "Coordinator of the national watch"
 minister_trait_SHL_furnace_accountant: "Furnace partnership economist"
 minister_trait_SHL_shift_physician: "Workers quarter physician"
 minister_trait_SHL_master_instructor: "Technical school instructor"
 minister_trait_SHL_rail_observer: "Railway cryptographer"
 SHL_south_final_ready_tt: "The southern crisis is open, Shahrabad has a northern rival and is not fighting a limited war with Mazar, Keyzan or Veyr, and the War for the South has not started"
 SHL_south_oil_for_furnaces: "Oil for the Furnaces"
 SHL_south_oil_for_furnaces_desc: "Svetlogorye sets the price of the oil every furnace in Shahrabad depends on. The Conclave of Ten will no longer buy raw fuel from namestniks: the houses will pay for the war, and the oil fields will become their concession."
 SHL_south_oil_for_furnaces_tt: "The §YWar for the South§! begins. Every independent desert state will choose a side. On victory the northern rival becomes a §Yhouse oil concession§!, and its allies become Shahrabad's satellites."
 SHL_south_war_of_charters: "War of Charters"
 SHL_south_war_of_charters_desc: "The Southern Compact cannot live beside a ladder of namestniks. The Council of Cities offers every district beyond the front the same charter that Khazar and Keyzan received."
 SHL_south_war_of_charters_tt: "The §YWar for the South§! begins. Every independent desert state will choose a side. On victory the defeated keep their own administrations and join the §YSouthern Compact Charter§!."
 SHL_south_last_pour: "The Last Pour"
 SHL_south_last_pour_desc: "Nur's Directorate turns the furnaces to the front. The iron march must end at the oil belt: the south will have one budget and one administrator."
 SHL_south_last_pour_tt: "The §YWar for the South§! begins. Every independent desert state will choose a side. On victory Shahrabad §Yannexes§! every defeated state."
 SHL_south_war_of_arms: "War of Crests"
 SHL_south_war_of_arms_desc: "The regent promises the houses fiefs beyond the front. The crest guards march for their share, and the hereditary republic for the right to command the whole south."
 SHL_south_war_of_arms_tt: "The §YWar for the South§! begins. Every independent desert state will choose a side. On victory Shahrabad §Yannexes§! every defeated state."
 SHL_south_oil_uprising: "The Oil Workers' Rising"
 SHL_south_oil_uprising_desc: "The Commune of Fire calls on Svetlogorye's oil workers to free themselves from the ladder of seals. Its war is fought not for a new border, but against the namestnik system itself."
 SHL_south_oil_uprising_tt: "The §YWar for the South§! begins. Every independent desert state will choose a side. On victory Shahrabad §Yannexes§! every defeated state, and the Svetlogorsk uprising joins the commune."
 SHL_south_debt_network: "Debt Network"
 SHL_south_debt_network_desc: "The houses do not fight those they can lend to. Credit to Rakhma and Sardan pays for their aqueducts and caravans, and the Conclave's bills make refusing a protectorate too expensive."
 SHL_south_debt_network_tt: "Cost: §Y200§! £ADISCORD_economy_treasury_texticon.\n§YRakhma§! and §YSardan§! become debtors of the houses: they are far more likely to accept a trade protectorate."
 SHL_south_trade_protectorates: "Trade Protectorates"
 SHL_south_trade_protectorates_desc: "A debtor who cannot pay pays with sovereignty. The Conclave offers Rakhma and Sardan the status of trade protectorates of the Golden Gates."
 SHL_south_trade_protectorates_tt: "§YRakhma§! and §YSardan§! are told to become Shahrabad's satellites. If a country refuses, we declare war on it for full annexation."
 SHL_south_great_road: "The Great Road"
 SHL_south_great_road_desc: "The Sun Throne taxes every caravan on the way to the sea. The houses demand that Kadir accept their supervision of the road stations."
 SHL_south_great_road_tt: "§YKadir§! is told to become Shahrabad's satellite. If a country refuses, we declare war on it for full annexation."
 SHL_south_wells_charters: "Charters of the Wells"
 SHL_south_wells_charters_desc: "The Southern Compact is open to anyone who recognises common water and the cities' right to self-government. The Council of Cities invites Rakhma, Mazar and Sardan."
 SHL_south_wells_charters_tt: "§YRakhma§!, §YMazar§! and §YSardan§! are invited to join Shahrabad's alliance. Refusal does not lead to war."
 SHL_south_compact_staff: "Compact Staff"
 SHL_south_compact_staff_desc: "The city levies receive a common staff, uniform regulations and depots in Khazar. The compact must be able to defend what it promises."
 SHL_south_compact_staff_tt: "§YTwo§! fully equipped levies are raised in Khazar."
 SHL_south_free_road: "The Free Road"
 SHL_south_free_road_desc: "The Sun Throne keeps the great road in the hands of one family. The compact demands that the road stations be governed by charter and that Kadir join as a member."
 SHL_south_free_road_tt: "§YKadir§! is told to join the Southern Compact as a chartered satellite. If a country refuses, we declare war on it for full annexation."
 SHL_south_water_and_sea: "Lands of Water and Sea"
 SHL_south_water_and_sea_desc: "The Directorate no longer bargains over qanats and ports. Keyzan and Veyr must join Shahrabad so that water and sea serve a single budget."
 SHL_south_water_and_sea_tt: "§YKeyzan§! and §YVeyr§! are told to join Shahrabad. If a country refuses, we declare war on it for full annexation."
 SHL_south_last_ration: "The Last Ration"
 SHL_south_last_ration_desc: "The Chamber of the Common Ration counts Shahrabad's metal as part of its distribution. The Directorate answers that it will do the distributing."
 SHL_south_last_ration_tt: "§YMazar§! is told to join Shahrabad. If a country refuses, we declare war on it for full annexation."
 SHL_south_iron_march: "The Iron March"
 SHL_south_iron_march_desc: "Sardan and Rakhma lie between the furnaces and the oil belt. The iron march cannot leave independent roads and wells behind it."
 SHL_south_iron_march_tt: "§YSardan§! and §YRakhma§! are told to join Shahrabad. If a country refuses, we declare war on it for full annexation."
 SHL_south_throne_and_crests: "Throne and Crests"
 SHL_south_throne_and_crests_desc: "The regent offers the Sun Throne an alliance of old houses: a share of the southern road in exchange for Kadir's swords in the war for future fiefs."
 SHL_south_throne_and_crests_tt: "§YKadir§! is invited to join Shahrabad's alliance. Refusal does not lead to war."
 SHL_south_toll_debtors: "Toll Debtors"
 SHL_south_toll_debtors_desc: "Sardan and Rakhma let caravans pass without the tolls the houses consider their own. The regency demands that they recognise the debt and the power of the crests."
 SHL_south_toll_debtors_tt: "§YSardan§! and §YRakhma§! are told to become Shahrabad's satellites. If a country refuses, we declare war on it for full annexation."
 SHL_south_veyr_debt: "Veyr's Debt"
 SHL_south_veyr_debt_desc: "For years Veyr's Trade Chamber insured the houses' cargo on credit. The regent presents the bill: the ports will become the hereditary republic's collateral."
 SHL_south_veyr_debt_tt: "§YVeyr§! is told to become Shahrabad's satellite. If a country refuses, we declare war on it for full annexation."
 SHL_south_councils_abroad: "Councils Abroad"
 SHL_south_councils_abroad_desc: "Mazar's workers and Veyr's dockers read the same leaflets as the shifts of Khazar. The commune invites their governments to stand with the councils before the workers replace them."
 SHL_south_councils_abroad_tt: "§YMazar§! and §YVeyr§! are invited to join Shahrabad's alliance. Refusal does not lead to war."
 SHL_south_oil_underground: "Svetlogorye Underground"
 SHL_south_oil_underground_desc: "Yaroslav Weber's underground is waiting for weapons. Every rifle carried across the desert now will raise the oil workers on the first day of the War for the South."
 SHL_south_oil_underground_tt: "If Svetlogorye leads the northern camp and holds the §YSvetlogorsk District§!, the §YSvetlogorsk Uprising§! rises there on Shahrabad's side on the first day of the War for the South and receives the delivered rifles.\nA district compact signed by Svetlogorye leaves the underground without support: §Y13500§! £infantry_equipment_texticon then return."
 SHL_conclave_power_dynamic: "Power of the Conclave"
 SHL_conclave_power_dynamic_desc: "Shahrabad's constitution, guards and industrial alliances add up to one power that the Conclave can turn to war or peace."
 SHL_south_furnaces_to_front: "Furnaces to the Front"
 SHL_south_furnaces_to_front_desc: "The War for the South is not fought only at the front. Every pour can now become a rifle if the treasury pays for the raw material."
 SHL_south_raid_oil_fields: "Raids on the Oil Fields"
 SHL_south_raid_oil_fields_desc: "The enemy lives on oil. Flying detachments strike the depots and roads of the Northern Deposits."
 SHL_south_desert_convoys: "Desert Convoys"
 SHL_south_desert_convoys_desc: "The caravan stations become army depots. The desert stops being an obstacle to supply."
 SHL_south_storm_oil_belt: "Storm the Oil Belt"
 SHL_south_storm_oil_belt_desc: "The enemy is weakened, the convoys are ready. Shahrabad's army marches on the oil belt."
 SHL_south_crown_of_the_south: "Crown of the South"
 SHL_south_crown_of_the_south_desc: "The south recognises the primacy of the furnaces. The Conclave establishes common relations with satellites, concessions and compact members, preserving their territories and local governments."
 SHL_south_raid_oil_tt: "The northern leader loses §Y4000§! £fuel_texticon. If the northern camp holds the §YNorthern Deposits§!, §Y1§! level of infrastructure there is destroyed."
 SHL_south_war_pour: "War Pour"
 SHL_south_war_pour_desc: "The furnaces switch to weapons metal. The treasury pays for raw material, and the army receives a batch of rifles and support equipment."
 SHL_south_raid_oil: "Raid the Oil Fields"
 SHL_south_raid_oil_desc: "A flying detachment heads for the depots of the Northern Deposits."
 SHL_south_desert_convoys_idea: "Desert Convoys"
 SHL_south_desert_convoys_idea_desc: "The caravan stations supply the army until the end of the War for the South."
 SHL_south_storm_idea: "Storm the Oil Belt"
 SHL_south_storm_idea_desc: "Shahrabad's army attacks the oil belt."
 SHL_public_campaigns: "Voice of the Furnaces"
 SHL_public_campaigns_desc: "Workshop leaflets, crest heralds and shift assemblies tell Shahrabad what the fire burns for. As many campaigns run at once as there are open slots.\n\nFree campaign slots: §Y[?ADISCORD_available_campaign_slots|0]§!"
 SHL_campaign_slot_available_tt: "A campaign slot is free: §Y[?ADISCORD_available_campaign_slots|0]§!"
 SHL_campaign_second_slot_tt: "A second campaign slot opens for the §YVoice of the Furnaces§!."
 SHL_campaign_fire_never_sleeps: "“The Fire Never Sleeps”"
 SHL_campaign_fire_never_sleeps_desc: "Every shift knows its pour feeds the city. The masters keep the pace, and the workshops take pride in furnaces that never stand idle."
 SHL_campaign_bread_from_furnaces: "“Bread from the Furnaces”"
 SHL_campaign_bread_from_furnaces_desc: "The leaflets tell how much bread, water and housing the last pour bought. The quarters see their work return to them."
 SHL_campaign_bread_from_furnaces_result_tt: "On completion, unrest in the quarters falls by §Y6§!."
 SHL_campaign_honour_of_crests: "“Honour of the Crests”"
 SHL_campaign_honour_of_crests_desc: "Heralds recall that the houses built the first furnaces and kept the fire burning in the worst years. The crests feel respected and demand less."
 SHL_campaign_honour_of_crests_result_tt: "On completion, pressure from the crests falls by §Y6§!."
 SHL_campaign_golden_gates_open: "“The Golden Gates Are Open”"
 SHL_campaign_golden_gates_open_desc: "The houses invite merchants from across the south: Shahrabad's metal is sold at a fair price to those who pay on time."
 SHL_campaign_a_voice_for_every_shift: "“A Voice for Every Shift”"
 SHL_campaign_a_voice_for_every_shift_desc: "Shift assemblies decide who joins the levies and how revenue is shared. People defend more willingly what they govern themselves."
 SHL_campaign_iron_budget: "“The Iron Budget”"
 SHL_campaign_iron_budget_desc: "The Directorate promises a single budget without crest privileges or workshop exemptions. Factories run more evenly, and the country grows used to mobilisation."
 SHL_campaign_the_south_is_one: "“The South Is One”"
 SHL_campaign_the_south_is_one_desc: "Shahrabad's furnaces promise the deserts metal, water and protection. Svetlogorye's namestnik ladder is portrayed as an old imperial chain."
 SHL_receive_250_tt: "Treasury: §G+250§! £ADISCORD_economy_treasury_texticon."
 SHL_houses_prog_ending_a: "Republic of Crests"
 SHL_houses_prog_ending_a_desc: "The crests become the state. The quarters and masters lose weight in the Conclave."
 SHL_houses_prog_ending_b: "Conclave of Equals"
 SHL_houses_prog_ending_b_desc: "The houses recognise the masters and quarters as equal members of the Conclave."
 SHL_cities_prog_ending_a: "Republic of Cities"
 SHL_cities_prog_ending_a_desc: "The quarters gain the decisive voice. The houses remain only the owners of their furnaces."
 SHL_cities_prog_ending_b: "Technocratic Conclave"
 SHL_cities_prog_ending_b_desc: "The masters run the furnaces and the state. The crests lose their power."
 SHL_directorate_prog_ending_a: "Directorate of Shahrabad"
 SHL_directorate_prog_ending_a_desc: "The directorate becomes the state. The crests lose their last privileges."
 SHL_directorate_prog_ending_b: "Military Directorate"
 SHL_directorate_prog_ending_b_desc: "The guards gain the decisive voice. Shahrabad lives by the laws of wartime."
 SHL_regency_prog_ending_a: "Hereditary Dictatorship"
 SHL_regency_prog_ending_a_desc: "The guards become the state. The quarters fall silent."
 SHL_regency_prog_ending_b: "Republic of Debts"
 SHL_regency_prog_ending_b_desc: "The houses rule through debt books. Everything in Shahrabad is pledged to someone."
 SHL_commune_prog_ending_a: "Fiery Commune"
 SHL_commune_prog_ending_a_desc: "The quarters rule Shahrabad. Not a trace remains of the crests' power."
 SHL_commune_prog_ending_b: "Union of Workshops"
 SHL_commune_prog_ending_b_desc: "The workshops unite in a union, and the crests lose their last furnaces."
 ADISCORD_shl_fire.11.t: "A New Order for Shahrabad"
 ADISCORD_shl_fire.11.a: "Such is the new Shahrabad."
 ADISCORD_shl_fire.11.d_houses_prog_ending_a: "Republic of Crests.\n\nThe crests become the state. The quarters and masters lose weight in the Conclave."
 ADISCORD_shl_fire.11.d_houses_prog_ending_b: "Conclave of Equals.\n\nThe houses recognise the masters and quarters as equal members of the Conclave."
 ADISCORD_shl_fire.11.d_cities_prog_ending_a: "Republic of Cities.\n\nThe quarters gain the decisive voice. The houses remain only the owners of their furnaces."
 ADISCORD_shl_fire.11.d_cities_prog_ending_b: "Technocratic Conclave.\n\nThe masters run the furnaces and the state. The crests lose their power."
 ADISCORD_shl_fire.11.d_directorate_prog_ending_a: "Directorate of Shahrabad.\n\nThe directorate becomes the state. The crests lose their last privileges."
 ADISCORD_shl_fire.11.d_directorate_prog_ending_b: "Military Directorate.\n\nThe guards gain the decisive voice. Shahrabad lives by the laws of wartime."
 ADISCORD_shl_fire.11.d_regency_prog_ending_a: "Hereditary Dictatorship.\n\nThe guards become the state. The quarters fall silent."
 ADISCORD_shl_fire.11.d_regency_prog_ending_b: "Republic of Debts.\n\nThe houses rule through debt books. Everything in Shahrabad is pledged to someone."
 ADISCORD_shl_fire.11.d_commune_prog_ending_a: "Fiery Commune.\n\nThe quarters rule Shahrabad. Not a trace remains of the crests' power."
 ADISCORD_shl_fire.11.d_commune_prog_ending_b: "Union of Workshops.\n\nThe workshops unite in a union, and the crests lose their last furnaces."
 SHL_desert_guard_contracts: "Desert Guard Contracts"
 SHL_desert_guard_contracts_desc: "The desert's hired guards are ready to serve the Conclave for pay."
 SHL_metal_market: "Metal Market"
 SHL_metal_market_desc: "Surplus raw material can be sold on the market when the treasury needs money."
 SHL_incident_office: "Incident Office"
 SHL_incident_office_desc: "Explosions, strikes and scandals no longer catch the Conclave unprepared. The office keeps an emergency fund and settles incidents before they grow."
 SHL_counting_chamber: "Counting Chamber"
 SHL_counting_chamber_desc: "The chamber audits dividends, estimates and caravan manifests. The money it recovers pays for workshop fire brigades and shift mediators."
 SHL_incident_office_tt: "Incidents occur §Ghalf as often§!."
 SHL_counting_chamber_tt: "A workshop explosion and the search for a lost caravan cost nothing from the treasury.\nConceding to a striking shift costs §Y100§! £ADISCORD_economy_treasury_texticon instead of §Y250§!.\nA dividend scandal can be hushed up for §Y30§! £political_power_texticon instead of §Y60§!, and an embezzlement inquiry returns §G250§! £ADISCORD_economy_treasury_texticon instead of §G100§!."
 SHL_treasury: "Treasury of the Conclave"
 SHL_treasury_desc: "Treasury: §Y[?ADISCORD_economy_treasury|0]§! £ADISCORD_economy_treasury_texticon\n\nMoney and political power can be exchanged for each other. Each furnace cycle carries a small risk of an incident; the emergency treasury settles any of them without loss."
 SHL_bond_payments: "Bond Payments"
 SHL_bond_payments_desc: "The Conclave pays the holders of furnace bonds."
 SHL_furnace_bonds: "Furnace Bonds"
 SHL_furnace_bonds_desc: "Money now against future pours. The payments will cost the Conclave political weight."
 SHL_decree_levy: "Emergency Levy"
 SHL_decree_levy_desc: "The Conclave imposes a one-off levy by decree."
 SHL_hire_desert_guard: "Hire the Desert Guard"
 SHL_hire_desert_guard_desc: "A detachment of hired guards arrives in Khazar."
 SHL_hire_desert_guard_tt: "§YOne§! armed levy is raised in Khazar."
 SHL_metal_dumping: "Sell Raw Material"
 SHL_metal_dumping_desc: "Two packages of raw material from the reserve are sold on the market."
 SHL_metal_dumping_tt: "Raw material reserve: §R-2§!. Treasury: §G+250§! £ADISCORD_economy_treasury_texticon."
 SHL_crisis_fund: "Replenish the Emergency Treasury"
 SHL_crisis_fund_desc: "Money set aside will settle the next incident without loss."
 SHL_crisis_prevention: "Incident Prevention"
 SHL_crisis_prevention_desc: "Inspections of workshops and caravans for half a year ahead."
 SHL_crisis_fund_tt: "The next incident can be settled §Gwithout loss§!."
 SHL_crisis_prevention_tt: "No incidents occur for §Y180§! days."
 SHL_crisis_fund_used_tt: "The emergency treasury is spent."
 SHL_crisis_free_tt: "Costs nothing."
 SHL_crisis_pay_250_tt: "Treasury: §R-250§! £ADISCORD_economy_treasury_texticon."
 SHL_crisis_pay_100_tt: "Treasury: §R-100§! £ADISCORD_economy_treasury_texticon."
 ADISCORD_shl_crisis.1.t: "Workshop Explosion"
 ADISCORD_shl_crisis.1.d: "A boiler has exploded in one of the workshops. There are injured, and the workers' quarters demand that the Conclave pay for the repairs."
 ADISCORD_shl_crisis.1.a: "Pay for the repairs."
 ADISCORD_shl_crisis.1.b: "Let the workshop fix itself."
 ADISCORD_shl_crisis.1.z: "Emergency treasury."
 ADISCORD_shl_crisis.2.t: "Caravan Lost in the Desert"
 ADISCORD_shl_crisis.2.d: "An ore caravan never reached Khazar. We can search for it - or write off the cargo."
 ADISCORD_shl_crisis.2.a: "Send a search party."
 ADISCORD_shl_crisis.2.b: "Write off the cargo."
 ADISCORD_shl_crisis.2.z: "Emergency treasury."
 ADISCORD_shl_crisis.3.t: "Night Strike"
 ADISCORD_shl_crisis.3.d: "The night shift did not come to the furnaces. The elders demand extra pay for night work."
 ADISCORD_shl_crisis.3.a: "Give in to the shifts."
 ADISCORD_shl_crisis.3.b: "Wait it out."
 ADISCORD_shl_crisis.3.z: "Emergency treasury."
 ADISCORD_shl_crisis.4.t: "Dividend Scandal"
 ADISCORD_shl_crisis.4.d: "The quarters' leaflets write that the houses paid themselves dividends out of the furnace repair money."
 ADISCORD_shl_crisis.4.a: "Hush it up."
 ADISCORD_shl_crisis.4.b: "Open the ledger."
 ADISCORD_shl_crisis.4.z: "Emergency treasury."
 ADISCORD_shl_crisis.5.t: "Embezzlement in the Directorate"
 ADISCORD_shl_crisis.5.d: "Auditors have found discrepancies in the directorate's budgets. An inquiry will cost political weight but recover part of the money."
 ADISCORD_shl_crisis.5.a: "Investigate."
 ADISCORD_shl_crisis.5.b: "Hush it up."
 SHL_crisis_1_b_tt: "Quarter unrest: §R+8§!."
 SHL_crisis_2_b_tt: "Raw material reserve: §R-2§!."
 SHL_crisis_3_a_tt: "Quarter unrest: §G-5§!."
 SHL_crisis_3_b_tt: "Quarter unrest: §R+10§!, crest pressure: §G-3§!."
 SHL_crisis_4_b_tt: "Crest pressure: §R+8§!, quarter unrest: §G-5§!."
 SHL_crisis_5_a_tt: "Treasury: §G+100§! £ADISCORD_economy_treasury_texticon (§G+250§! with the counting chamber)."
 SHL_cost_t250: "§Y250§! £ADISCORD_economy_treasury_texticon"
 SHL_cost_t250_blocked: "§R250§! £ADISCORD_economy_treasury_texticon"
 SHL_cost_t250_tooltip: "§Y250§! £ADISCORD_economy_treasury_texticon\nThe price is debited on selection."
 SHL_cost_t300: "§Y300§! £ADISCORD_economy_treasury_texticon"
 SHL_cost_t300_blocked: "§R300§! £ADISCORD_economy_treasury_texticon"
 SHL_cost_t300_tooltip: "§Y300§! £ADISCORD_economy_treasury_texticon\nThe price is debited on selection."

# Mazar border pact and neutrality
 SHL_mzr_border_pact_faction: "Mazar Border Pact"
 SHL_negotiate_mzr_neutrality: "Negotiate the neighbour's non-intervention"
 SHL_negotiate_mzr_neutrality_desc: "[SHLGetMazarFlankStatus]\n\nOffer compensation for the earlier border conflict in exchange for refusing to support Mazar. Negotiations remain available until war begins. The neighbour may refuse; refusal and an expired offer cost nothing."
 SHL_mzr_neutrality_funds_tt: "Have §Y100§! £ADISCORD_economy_treasury_texticon for compensation on signature"
 SHL_mzr_neutrality_idle_tt: "The neighbour is not already considering our non-intervention offer"
 SHL_mzr_neutrality_offer_tt: "Send a non-intervention offer. Only if the neighbour agrees before war begins: §R-100§! £ADISCORD_economy_treasury_texticon and §R-30§! £political_power_texticon for Shahrabad; the neighbour receives §G100§! £ADISCORD_economy_treasury_texticon and withdraws from Mazar's pact. Funds are checked again on signature."
 SHL_mzr_pact_accept_tt: "When the announced war begins, join Mazar against Shahrabad. The pact covers only this war and ends with the Shahrabad-Mazar settlement. Before the declaration, Shahrabad's compensation offer may still secure our non-intervention."
 SHL_mzr_neutrality_accept_tt: "Receive §G100§! £ADISCORD_economy_treasury_texticon from Shahrabad, which also spends §R30§! £political_power_texticon. Withdraw from Mazar's border pact and settle the earlier military grievance. Transfer requires the full price and peace at the moment of signature."
 SHL_mzr_flank_none: "No additional opponent is announced."
 SHL_mzr_flank_negotiating: "The non-intervention offer awaits an answer; the threat remains until agreement."
 SHL_mzr_flank_kyz_pending: "Keyzan is considering Mazar's pact: the western border is threatened."
 SHL_mzr_flank_glp_pending: "Veyr is considering Mazar's pact: the eastern border is threatened."
 SHL_mzr_flank_kyz_signed: "§RKeyzan has agreed to open a western front for Mazar.§!"
 SHL_mzr_flank_glp_signed: "§RVeyr has agreed to open an eastern front for Mazar.§!"
 SHL_mzr_flank_kyz_war: "§RKeyzan fights for Mazar. The common settlement ends its participation.§!"
 SHL_mzr_flank_glp_war: "§RVeyr fights for Mazar. The common settlement ends its participation.§!"
 ADISCORD_SHL.124.t: "Another Edge of War"
 ADISCORD_SHL.124.d: "[FROM.GetName] is negotiating with the Chamber of Common Rations. After our attempt to settle a border dispute by force, Mazar's promise of protection has found an audience. No pact has yet been signed, but our officers must plan for another front.\n\nBefore war begins, the decision Negotiate the neighbour's non-intervention lets us offer compensation. Agreement is not guaranteed. Signature costs 100 £ADISCORD_economy_treasury_texticon and 30 £political_power_texticon; refusal costs nothing. Mazar will not replace this candidate during the current preparation period."
 ADISCORD_SHL.124.a: "Account for the threat and open talks."
 ADISCORD_SHL.125.t: "Mazar Offers Protection"
 ADISCORD_SHL.125.d: "Shahrabad has already tried to impose its will by force. The Chamber of Common Rations now proposes a common response: when Mazar and Shahrabad begin hostilities, our army will open the neighbouring front.\n\nThis is a limited military pact. Mazar's capitulation or settlement ends our participation. Before the declaration, we may still accept compensation from Shahrabad and remain neutral."
 ADISCORD_SHL.125.a: "Sign the border pact."
 ADISCORD_SHL.125.b: "Remain outside the conflict."
 ADISCORD_SHL.126.t: "The Price of Non-intervention"
 ADISCORD_SHL.126.d: "Shahrabad offers compensation for the earlier military conflict in exchange for staying out of Mazar's campaign. We retain independence and receive 100 £ADISCORD_economy_treasury_texticon on signature. The territorial border remains unchanged.\n\nAgreement is possible only before war begins and while Shahrabad can afford the full quoted price. Supporting Mazar or accepting compensation remains our choice."
 ADISCORD_SHL.126.a: "Accept compensation and non-intervention."
 ADISCORD_SHL.126.b: "Do not sign."
 ADISCORD_SHL.127.t: "One Border Secured"
 ADISCORD_SHL.127.d: "[FROM.GetName] has accepted our offer. Compensation has been transferred and the agreement with Mazar withdrawn. The settlement cost 100 £ADISCORD_economy_treasury_texticon and 30 £political_power_texticon.\n\nThe earlier border conflict is settled. A fresh attack by us would give the neighbour a new reason to seek protection."
 ADISCORD_SHL.127.a: "Now we can concentrate on Mazar."
 ADISCORD_SHL.128.t: "No Agreement Signed"
 ADISCORD_SHL.128.d: "Non-intervention talks ended without agreement. No compensation was transferred and no political power spent. The border crisis summary shows the neighbour's current position. While preparations continue, we may reopen talks after the interval."
 ADISCORD_SHL.128.a: "Account for this in our plans."
 SHL_startup_region:0 "§YTHE SOUTHERN DESERTS: SHAHRABAD'S SURROUNDINGS§!\n\nThe situation at the beginning of 2160.\n\n§YKeyzan: water for the furnaces§!\nThe union of irrigation communities recognises no permanent capital. Settlements maintain their own sections of the qanats and arrange joint works through delegates. These waterways also feed Shahrabad's western furnaces: the League's industrial strength depends on communities unwilling to submit to a foreign centre.\n\n§YVeir: access to the sea§!\nThe Trade Chamber brings together ports, workshops and ship repair. Its port code regulates duties and insurance, and Shahrabad's metal passes through this system to foreign markets. For the houses, the cost of exporting their products matters as much as the price of ore.\n\n§YMazar: metal and the common ration§!\nThe Chamber of the Common Ration distributes water and supplies according to collective utility. It considers Shahrabad's metal part of the resources the region needs. The dispute concerns supplies and security in the Shahrabad District, where the distributors' interests clash with the industrial houses' rights.\n\n§YSvetlogorye and the northern oil basin§!\nSvetlogorye's viceroyal administration rests on Workerland's inheritance, oilfields and garrisons. Eflor and Azhar dispute lands taken by the former empire. For Shahrabad, the northern balance determines who controls fuel and has the strength to compete for influence across the South."
 SHL_startup_country: "§YTHE SHAHRABAD LEAGUE IN 2160§!\n\n§YThe city depended on its furnace§!\nIndustrial Shahrabad formed around enterprises on which residents depended for wages and supplies. An owner could abandon a plant and leave the city without a livelihood. The Law of Continuous Fire was meant to tie ownership to the duty of maintaining production.\n\nThe main furnace became the measure of that duty. While it worked, a house kept its plant and its Conclave seat. If the fire died, ownership returned to the city. A stoppage did not destroy the workshops: the same plant could survive under a different owner. The law therefore governed both the economy and the right to speak for a city.\n\n§YFrom obligation to privilege§!\nOver time, a rule protecting residents from abandoned factories became the foundation of the industrial houses' power. Hereditary rank, wealth and ownership formed a single order. Workers' quarters were promised wages and supplies, cities protection, while ruling families retained profits and accustomed luxury.\n\nNine houses kept purchasing, exports and energy pricing within their closed circle. A working furnace confirmed political rights, making a repair dispute a dispute over the right to govern. Equipment condition was more than a technical matter: acknowledging a fault could endanger a family's position.\n\n§YAn economy of separate houses§!\nKhazar became the League's capital, the furnace district its industrial heart. Bayrat has long supplied the furnaces with ore, but its mines remain bound by each house's old contracts. Shared dependence on metal and transport did not dissolve separate holdings and interests.\n\nThe resulting economy consisted of parts that needed one another without managing resources as a single enterprise. Deliveries crossed other owners' holdings, factory guards served their own masters, and revenue was divided among houses, quarters and central authority. People outside official registers held less political weight than those controlling their work.\n\nConclave decisions were paid for with concessions to families holding hereditary seats. Outside, house, workshop and city registers disagreed: someone could work at a furnace for years yet remain a stranger to an institution in the next quarter. Industrial ties between cities proved stronger than their common system of civic rights.\n\n§YNine crests above the chair§!\nBy 2160, the houses' crests hang above Jalil Nur's chair in the Conclave. The League has working factories and a large population, but its order still rests on an old condition: fire grants property and a voice. Beneath that enduring formula have accumulated wear, supply disputes and discontent in the quarters. A law once meant to protect the city from its owner now also justifies the owner's power over the city."
 SHL_startup_guide_furnaces_title: "Furnaces and production"
 SHL_startup_guide_furnaces: "§YHOW THE FURNACES WORK§!\n\n§YPanel and cycle§!\nOpen the $SHL_conclave$ and select a site. Every 28 days, an operating furnace consumes material, earns revenue and gains wear. An ordinary shift uses 1 package, overtime uses 2. Without material, the furnace idles and wears faster. Wear of 100 or two consecutive idle cycles extinguishes it.\n\n§YTwo separate stores§!\nLocal stocks serve only the selected furnace. The shared reserve is not distributed automatically: a separate button immediately transfers 1 package to the selected site. This also works during a local operation. A normal material purchase costs §Y25§! £ADISCORD_economy_treasury_texticon and arrives in 7 days.\n\n§YEach furnace has its own queue§!\nDelivery, maintenance and shift training share one local slot. Two such jobs cannot run at the same furnace, but another furnace can process its own order. Maintenance takes 14 days and removes 30 wear without stopping production. Do not leave repairs until the cycle in which wear reaches its limit.\n\n§YPlanned purchasing§!\n$SHL_houses_railway$ unlocks a decision to enable planned supply. During the production cycle, it buys the missing 1 or 2 packages at §Y25§! £ADISCORD_economy_treasury_texticon each if money is available. These are recurring treasury expenses, not free reserves.\n\n§YShifts and ownership§!\nCareful smelting reduces wear at the cost of income; overtime consumes twice the material for higher revenue. The industrial branch unlocks these modes. Extinguishing a furnace removes its house's vote and leaves the plant to the city; restarting costs extra.\n\n§YThe tenth furnace§!\nThe partnership, land, construction and first smelt are separate paid stages unlocked by focuses. Plan them alongside the upkeep of the nine existing furnaces."
 SHL_startup_guide_fire_title: "Division of the fire"
 SHL_startup_guide_fire: "§YRECIPIENTS OF THE HEAT§!\n\n§YOne recipient per furnace§!\nSelect a furnace and assign export, arsenal, quarters or crest. Assignment persists. Only a successful shift consumes stock and pays its recipient. The tenth furnace has its own selection.\n\n§YOpportunity cost§!\nExport pays 60 / 90 / 25 before deductions. Arsenal gives 2700 / 5400 / 1350 rifles instead of cash. Quarters reduce unrest by 4 / 6 / 2; crests reduce pressure by 4 / 6 / 2. Order: ordinary / overtime / careful. Materials and repairs remain payable.\n\n§YCourses and orders§!\nHouses and regency strengthen crest deliveries; cities and commune strengthen quarters. Cities discount civic orders; the directorate discounts arsenal orders. A paid order occupies one furnace and the single national slot; there is no additional ordinary delivery. Its price and refund are fixed on payment. After settlement the furnace continues serving the order recipient.\n\n§YHouse support§!\nA house with a legal vote supports the Conclave after an actual crest delivery. A majority makes Conclave guarantees free of the 40 political power charge. Compensation after ownership transfer does not restore the vote. The commune closes crest deliveries.\n\n§YDeadlines§!\nUnrest and pressure of 60 can open crises. Deliveries do not remove background tension growth. Wear of 90 risks an accident: retain money for maintenance and responses."
 SHL_startup_guide_wars_title: "Preparing for war"
 SHL_startup_guide_wars: "§YFROM FACTORY GUARDS TO DEFENCE§!\n\n§YThe first threat's deadline§!\nMazar's first challenge is scheduled for day 168 of the campaign. Military and supply preparation must accompany political construction. Waiting for the tenth furnace does not pause the neighbouring crisis.\n\n§YBuild real forces§!\nThe railway, factory and southern guard focuses help prepare your defence. Check what each focus unlocks: an available decision still needs to be carried out. Your course's military mandate and the two smelts for the front provide further options. Compare the formations received with stocks for replacements.\n\n§YKeep the furnaces running§!\nMilitary expenses compete with materials and maintenance. Check local stocks, time until the next cycle and cash reserves. Arsenal deliveries replace cash from the selected furnaces; retain funds for supply and repairs.\n\n§YAnswer the demand§!\nWhen Mazar demands payment for the southern district's security, compare the cost of payment or a settlement with your readiness to refuse and fight. The offer states its specific prices and deadlines. After the conflict, the peace focus opens reconstruction in a selected district.\n\n§YExternal decisions§!\nThe relevant focuses open disputes over water and access to the sea. Check decisions for available agreements and their conditions. Ordinary diplomatic buttons for declaring war and creating alliances are disabled: foreign actions use focuses, decisions and events.\n\nNeighbouring countries are described under Region, and the southern campaign's political alternatives under Paths. Your immediate task is to finish paid preparations, preserve production and answer active deadlines."
 SHL_startup_guide_plan_title: "First steps"
 SHL_startup_guide: "§YFIRST STEPS AS SHAHRABAD§!\n\n§Y1. Inspect the nine furnaces.§! Open the $SHL_conclave$. Each furnace begins with 2 material packages, with another 2 in the shared reserve. Check wear, shift mode and time until the next 28-day cycle.\n\n§Y2. Plan for the third smelt.§! Two local packages cover two ordinary cycles. Before the third, arrange deliveries, transfer reserves or enable functioning planned supply. Purchases take 7 days; the shared reserve can be transferred immediately.\n\n§Y3. Distinguish reserve from supply.§! The nine-furnace census and next-shift reserve focuses each add 2 packages to the shared stock. Furnaces do not receive them automatically. Allocate the reserve where it is needed soonest.\n\n§Y4. Balance construction with upkeep.§! A political course follows the Conclave rules, while the trunk leads to the tenth furnace. Its stages require separate payments. Set aside money for materials and upcoming maintenance before ordering new construction.\n\n§Y5. Prepare your defence early.§! Mazar's first challenge falls on day 168. Check unlocked military decisions and actual preparation times; do not postpone the army until the entire political course is complete.\n\n§Y6. Watch both gauges.§! $SHL_quarters_and_borders$ shows discontent and heraldic pressure. When a crisis starts, read the mission and respond before its timer expires. Political courses and special outcomes are covered under Paths."
 SHL_startup_path_0_title: "Courses of the Conclave"
 SHL_startup_path_0: "§YTHREE COURSES OF THE CONCLAVE§!\n\n§YThe tenth house§!\nThe new enterprise becomes the tenth crest. The Golden Gate cartel, the house guards and the union with Veyr turn the League into a trading republic, and its southern chain into a web of debtors.\n\n§YThe open Conclave§!\nThe cities receive charters and a voice. The Council of Cities, workers' brigades and the brotherhood with Keizan lead to the Southern Compact, a voluntary union of neighbours.\n\n§YNur's Directorate§!\nThe furnaces come under one management. The war directorate, the right to water and the key to the sea make Shahrabad an iron state that takes its neighbours by force.\n\nEvery course ends with a choice between two endings and its own war for the South."
 SHL_startup_path_0_details: "§YCOURSES: CONDITIONS AND REWARDS§!\n\n§YThe choice§!\n'A New Industrial House', 'Open Conclave' and 'Nur's Directorate' exclude each other. The provisional course immediately changes the scales and unlocks its production order. Ratification needs the course's own preparation and the Workers' Charter; the tenth furnace remains a separate construction project. The city course also needs 30 civic support.\n\n§YWar mandate§!\nEach course has its own short mandate and one aid package for the war: the houses borrow money, the cities raise two brigades, the directorate grants an offensive drive for the first weeks of war.\n\n§YFinal and endings§!\nA course final needs at least six lit furnaces. It opens two exclusive endings that fix the division of the fire at the course target and grant permanent Conclave bonuses.\n\n§YWar for the South§!\nThe southern chain is available until the final war begins. The houses subjugate the debtors Rahma and Sardan, the cities sign well charters, the directorate demands the annexation of Keizan, Veyr and Mazar. The last focus of the chain declares war on Svetlogorye once the southern crisis has matured and the country is at peace."
 SHL_startup_path_1_title: "Hidden paths"
 SHL_startup_path_1: "§YWHEN THE CONCLAVE BREAKS§!\n\nTwo paths cannot be chosen in the tree in advance: a crisis opens them.\n\n§YRegency of the houses§!\nIf the crests prevail on the night of the crests, regent Darius Safir restores the houses' privileges, private guards and debt shifts. The hereditary republic rests on the votes of seven houses.\n\n§YCommune of fire§!\nIf the quarters win the cold shift, the shift councils hand the furnaces to the workers. Common smelting, the qanat brotherhood and councils abroad lead to an uprising in Svetlogorye's oil belt.\n\nBoth paths replace the previous course and open their own branch of the tree."
 SHL_startup_path_1_details: "§YHIDDEN PATHS: HOW THEY OPEN§!\n\n§YRegency§!\nCrest pressure of 60 or more brings an ultimatum. From the first ultimatum, choose Rely on the Crests in the event or decisions. The existing route through the night of the crests also remains after a failed wait. The regency lowers crest pressure and raises the quarters' unrest; its final needs seven house votes and a settled revenue pledge.\n\n§YCommune§!\nUnrest of 60 or more brings the cold shift. From the first strike, choose Rely on the Shift Councils in the event or decisions. The existing route through a failed wait or a second crackdown also remains. The commune lowers unrest, but the houses lose their furnaces.\n\n§YCommon rules§!\nA hidden path changes the head of state and the cabinet, opens a further reform of hereditary seats. Compatible orders continue; incompatible orders close and refund their unspent payment. Each path has its own mandate, final, two endings and southern chain: the regency subjugates Kadir and the debtors, the commune raises Svetlogorye's underground."
