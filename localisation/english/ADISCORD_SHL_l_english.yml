 SHL_revanche_kyz: "Keyzan"
 SHL_revanche_glp: "Veyr"
 SHL_revanche_mzr: "Mazar"
 SHL_revanche_refuse_tt: "[SHLGetRevancheNeighbour]'s claims on the ceded states remain."
