 SHL_prospect_copi:0 "Survey the Bayrat Mines"
 SHL_prospect_copi_desc:0 "The Conclave's surveyors set out beyond the Bayrat mines with drills, pack camels and sample journals."
 SHL_prospect_copi_tt:0 "In §Y70§! days: §G+3§! £chromium_texticon in the Bayrat Mines. The survey can be paid for at most twice."
