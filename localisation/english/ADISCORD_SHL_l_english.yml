 SHL_conspiracy_guarantees_tt: "Crest pressure: §G-25§!. Quarter unrest: §R+10§!. Civic support: §R-5§!."
 SHL_conspiracy_wait_tt: "A 42-day mission begins. If crest pressure does not fall below §Y45§!, the houses will try to remove Nur."
 SHL_conspiracy_arrests_tt: "Crest pressure: §G-30§!. Quarter unrest: §G-5§!. The Khazar and Veyran furnaces pass to the directorate if the houses own them."
 SHL_regency_course_tt: "§YNur resigns. Darius Safir becomes regent.§! Crest pressure: §G-30§!. Quarter unrest: §R+15§!. The «Regency of the Houses» path opens."
 SHL_resist_crests_tt: "Crest pressure becomes §Y40§!. Nur keeps power."
