 ADISCORD_SHL.100.t: "Who Receives the Next Pour"
 ADISCORD_SHL.100.house: "The envoy of the Golden Gates cartel set a purse on the table before the clerk had finished reading the contract. Golshan Loran liked the gesture: the new order spoke a language he knew. Darius Safir nodded without looking at the purse. But the Arbin master asked which furnace would answer for the promised metal, and the hall grew quieter. The Conclave's signature could bind the whole country; one shift would have to do the work.\n\nJalil Nur told Leyla Nadiri to open a separate ledger. The advance can be spent at once, but within three production cycles the chosen furnace must deliver two heats to the buyer. Its ordinary revenue leaves the common account for that time. A reinforced shift can finish sooner, if Bayrat's ore and people willing to accept the wear can be found.\n\nThis is not yet a tenth vote. Before the Fellowship of Masters and Engineers receives a hereditary crest, it must prove that its signature means more than the right to take money."
 ADISCORD_SHL.100.city: "The city delegates brought the Conclave not a crest but a drawing of a crossing over the dry riverbed. Every spring carts were lost there; every summer residents carried water around the collapsed masonry. Fereydun Kerdan, owner of the nearest furnace, asked what the new road would earn. Mariam Arbin answered for the delegates: for the first time, profit would not be the only condition of building.\n\nA civic order keeps the metal at home. The treasury pays for the work, and two heats of the chosen furnace become a road, a bridge or a waterway for its district. For that time the government does without the enterprise's ordinary revenue. Leyla Nadiri entered the order in the ledger, and Samira Hadi asked that the first crossing lead to the infirmary. The road will remain even if the Conclave later denies the cities a vote.\n\nRepresentation still has to be confirmed after the Workers Charter. Until then the cities can show not promises but what they built themselves."
 ADISCORD_SHL.100.state: "Arman Teymur laid a cracked bolt before Jalil Nur. The register listed it as serviceable: the treasury paid the order, the depot accepted the crates, the department set its seal. Nobody recorded which furnace cast the metal or who inspected the last batch. Rauf Darban turned the bolt over and named the furnace by its mark before the clerk found the invoice.\n\nThe Directorate begins with a simple demand: every order will have a specific producer. Payment for two batches stays in Leyla Nadiri's ledger. The first successful heat delivers half the weapons, the second closes the order. While the workshop works for the arsenal, its revenue does not reach the treasury. A reinforced shift can make both batches at once; a stopped furnace makes none.\n\nNur has not yet gained the right to command all the houses, and Darius Safir said so aloud. But the first military ledger already forces a choice about what the country will give up for sound weapons."
 ADISCORD_SHL.100.a: "Enter the first furnace in the ledger."
 ADISCORD_SHL.101.t: "An Empty Place in the Caravan"
 ADISCORD_SHL.101.d: "The buyer's carts stood at the Golden Gates, and the ledger lacked the paid metal. Leyla Nadiri could list the reasons: Bayrat's ore came late, the furnace stood under repair, Kerdan's road was closed. The merchant listened to all of it, then unfolded the sheet with the Conclave's signature again. It contained no clause saying the advance is returned only when convenient. Golshan Loran, whose name stands on the house's export contracts, looked away.\n\nThe first way out is to close the contract and settle the remaining obligation. If the money is short, the debt passes to the state account, and Darius Safir has already asked from whose treasury. The second is to ask for two more cycles. The buyer will agree only once, reduce the final payment and demand greater compensation for a second failure. The shifts have already heard that a new deadline is being discussed upstairs, and Salima Darzi wrote it in the journal.\n\nUntil the parties agree, the furnace returns to selling its output as usual. The old signature does not go away."
 ADISCORD_SHL.101.a: "Close the contract and settle."
 ADISCORD_SHL.101.b: "Request one final extension."
 ADISCORD_SHL.101.c: "The ledger has already been settled."
