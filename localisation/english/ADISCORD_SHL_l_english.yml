 SHL_extinction_pressure_tt: "Crest pressure: §R+8§!."
 SHL_soup_kitchens: "Common Canteens"
 SHL_soup_kitchens_desc: "Hot meals at the factory gates do not settle a shift dispute, but they give the quarters a reason to wait."
 SHL_soup_kitchens_tt: "Quarter unrest: §G-10§!."
 SHL_house_banquet: "Reception of the Crests"
 SHL_house_banquet_desc: "Nur gathers the heirs of the houses at one table before their attorneys gather signatures against the Conclave."
 SHL_house_banquet_tt: "Crest pressure: §G-10§!."
 SHL_shift_mediation: "Talks with the Masters"
 SHL_shift_mediation_desc: "Senior shift masters know which of the strike committee's demands can be met within a week."
 SHL_shift_mediation_tt: "Quarter unrest: §G-8§!."
 SHL_nur_audience: "Audience with Nur"
 SHL_nur_audience_desc: "Each house receives a separate meeting and a separate promise. An ultimatum weakens when its signatories stop trusting one another."
 SHL_nur_audience_tt: "Crest pressure: §G-8§!."
 SHL_strike_mission: "The Cold Shift"
 SHL_strike_mission_desc: "The strike committee keeps the furnaces on minimal fire. While the strike lasts, every operating furnace earns §R10§! £ADISCORD_economy_treasury_texticon less."
 SHL_strike_goal_tt: "Quarter unrest below §Y45§!"
 SHL_strike_success_tt: "The strike ends. Another cannot begin for 4 cycles."
 SHL_strike_timeout_tt: "§RThe committee will demand power for the shift councils.§!"
 SHL_conspiracy_mission: "Ultimatum of the Crests"
 SHL_conspiracy_mission_desc: "The nine crests demand their former rights. If the pressure does not ease, the houses will try to take the Conclave without Nur."
 SHL_conspiracy_goal_tt: "Crest pressure below §Y45§!"
 SHL_conspiracy_success_tt: "The ultimatum falls apart. Another cannot follow for 4 cycles."
 SHL_conspiracy_timeout_tt: "§RThe houses will try to remove Nur.§!"
 SHL_raise_furnace_guard: "Raise the Furnace Guard"
 SHL_raise_furnace_guard_desc: "The furnaces pay for the rifles and the cities provide the men. In 21 days a furnace guard division of two infantry battalions and militia forms in Shahrabad."
 SHL_raise_guard_tt: "In §Y21§! days a \"Furnace Levy\" division appears in Khazar. If the capital is lost, the full price is refunded."
 SHL_guard_slot_tt: "The previous levy has been completed"
 SHL_war_orders: "Arsenal order: [FROM.GetName]"
 SHL_war_orders_desc: "The selected furnace diverts its revenue into two prepaid weapons batches. Each actual pour delivers half the order; overtime delivers both. Shortages, occupation and shutdown delay delivery. Cancellation refunds only unmade batches."
 SHL_offer_water_treaty: "Offer Water for Metal"
 SHL_offer_water_treaty_desc: "The Keyzan communes receive metal for their conduits, and the furnaces receive water under an agreed quota."
 SHL_offer_water_treaty_tt: "Keyzan will consider the offer. If it accepts: §R-100§! £ADISCORD_economy_treasury_texticon at once and §R-3§! £ADISCORD_economy_treasury_texticon per operating furnace each cycle. The water dispute ends."
 SHL_offer_pending_tt: "No unanswered offer to Keyzan"
 SHL_water_treaty_money_tt: "At least §Y100§! £ADISCORD_economy_treasury_texticon in the treasury"
 SHL_artesian_wells: "Artesian Wells"
 SHL_artesian_wells_desc: "Deep wells near Arbin, Safir and Loran will free the furnaces from the neighbour's qanats."
 SHL_artesian_wells_tt: "In §Y84§! days the water dispute ends without a quota. If the dispute has already closed, the price is refunded."
 SHL_project_slot_tt: "This project has not been paid for yet"
 SHL_seize_qanats: "Seize the Qanats"
 SHL_seize_qanats_desc: "The conduit guard crosses the border and occupies the head wells of Sevir, Tabar, Narvan and Ormis."
 SHL_seize_qanats_tt: "§RShahrabad declares war on Keyzan§! to take Sevir, Tabar, Narvan and Ormis. Keyzan receives 3 qanat guard divisions. After 270 days without capitulation an armistice follows. The attack gives Keyzan grounds to join Mazar until the grievance is settled."
 SHL_seize_qanats_ready_tt: "The water dispute is open, Shahrabad and Keyzan are at peace, Keyzan holds the border qanats"
 SHL_harbour_project: "Kerdan Harbour"
 SHL_harbour_project_desc: "Our own quays let us export metal without paying the Veyr trade chamber."
 SHL_harbour_project_tt: "In §Y90§! days the Veyr duty stops being deducted from revenue. If Kerdan has room, a dockyard is built. If the duty is already gone or Kerdan is lost, the price is refunded."
 SHL_ultimatum_veyr: "Ultimatum to Veyr"
 SHL_ultimatum_veyr_desc: "If the chamber does not lift the duty, Shahrabad will take the Kassen mines and the road through Noran."
 SHL_ultimatum_veyr_tt: "§RShahrabad declares war on Veyr§! to take Noran and Kassen, and after \"Key to the Sea\" also Tirva and the Veyr District. Veyr receives 3 prismatic guard divisions. After 270 days without capitulation an armistice follows. The attack gives Veyr grounds to join Mazar until the grievance is settled."
 SHL_ultimatum_veyr_ready_tt: "The Veyr duty applies, Shahrabad and Veyr are at peace, Veyr holds Noran or Kassen"
 SHL_mazar_deadline: "Mazar's Ultimatum"
 SHL_mazar_deadline_desc: "The Chamber of the Common Ration has given Shahrabad 60 days. Then its detachments will enter the Zarkhan District."
 SHL_mazar_deadline_timeout_tt: "§RMazar declares war over the Zarkhan District§! unless it is fighting elsewhere. Otherwise the demand is postponed for 4 cycles. A neighbour that signed the border pact joins Mazar. [SHLGetMazarFlankStatus]"
 SHL_mazar_last_ration: "Pay the Ration on the Last Day"
 SHL_mazar_last_ration_desc: "A late payment costs more, but closes Mazar's demand for good."
 SHL_mazar_last_ration_tt: "The ultimatum is withdrawn and Mazar's demands are closed."
 SHL_export_contract: "Export undertaking: [FROM.GetName]"
 SHL_export_contract_desc: "The house receives an advance for two successful pours within the next three production cycles. Overtime completes two pours per cycle. Materials and maintenance remain payable; this furnace diverts its ordinary revenue to the order. Occupation does not stop the deadline. One extension or repayment settles a missed deadline."
 SHL_export_furnaces_tt: "At least §Y6§! furnaces operating"
 SHL_debt_shift: "Pledge house revenue: [FROM.GetName]"
 SHL_debt_shift_desc: "A city treasury advances cash against the house furnace's future revenue. Only actual revenue after deductions pays down the obligation. Shutdown delays repayment. Early settlement charges the outstanding balance. The debt-shift law allows surrendering the furnace itself to the city instead."
 SHL_debt_shift_tt: "Receive 150 £ADISCORD_economy_treasury_texticon and +8 unrest. New liability: [?SHL_pledge_price|0] £ADISCORD_economy_treasury_texticon. Furnace cash repays the lender; excess final revenue returns to the treasury. Reassign after repayment or cancellation with settlement of the remaining debt."
 SHL_common_cauldron: "Appoint donor furnace: [FROM.GetName]"
 SHL_common_cauldron_desc: "A working civic furnace sponsors another site. Select the recipient on the panel next. Until aid can proceed, the donor keeps its normal revenue. Two donor pours then repair or restart the recipient instead of earning cash."
 SHL_common_cauldron_tt: "Choose another civic furnace as recipient. Two donor pours restore it; the Union of Workshops needs one. No ordinary delivery during this order. Afterwards the donor supplies the quarters."
 # Event answers
 SHL_strike_concede_tt: "§R-150§! £ADISCORD_economy_treasury_texticon. Quarter unrest: §G-35§!. Crest pressure: §R+10§!. Civic support: §G+5§!. The strike ends."
 SHL_strike_wait_tt: "A 42-day mission begins. While the strike lasts, every furnace earns §R10§! £ADISCORD_economy_treasury_texticon less. If unrest does not fall below §Y45§!, the committee will demand power."
 SHL_strike_suppress_tt: "Quarter unrest: §G-25§!. Civic support: §R-10§!. A second crackdown leads straight to the shift councils' demand. §Y-10%§! $SHL_conclave_balance$."
 SHL_commune_course_tt: "Nur resigns. Power passes to the Shift Council. Quarter unrest: §G-30§!; crest pressure is reset. The Workers' Commune path opens; $SHL_furnaces_to_workers$ will transfer the furnaces to the workers. Incompatible orders close and refund their unspent payment. §Y+30%§! $SHL_conclave_balance$."
 SHL_martial_law_tt: "Quarter unrest becomes §Y30§!. Crest pressure: §G-10§!. The strike ends."
 SHL_conspiracy_guarantees_tt: "Crest pressure -25; unrest +10; civic support -5. Costs 40 £political_power_texticon unless a majority of voting houses received crest deliveries last cycle."
 SHL_conspiracy_wait_tt: "A 42-day mission begins. If crest pressure does not fall below §Y45§!, the houses will try to remove Nur."
 SHL_conspiracy_arrests_tt: "Crest pressure: §G-30§!. Quarter unrest: §G-5§!. The Nuran and Veyran furnaces pass to the directorate if the houses own them."
 SHL_regency_course_tt: "§YNur resigns. Darius Safir becomes regent.§! Crest pressure: §G-30§!. Quarter unrest: §R+15§!. The \"Regency of the Houses\" path opens. §Y-30%§! $SHL_conclave_balance$."
 SHL_resist_crests_tt: "Crest pressure becomes §Y40§!. Nur keeps power."
 SHL_accident_site_tt: "§RThe damaged furnace goes out and its workshops are damaged.§!"
 SHL_accident_house_tt: "Crest pressure: §R+10§!. Civic support: §G+5§!. Quarter unrest: §G-10§!."
 SHL_accident_masters_tt: "Quarter unrest: §R+15§!. Crest pressure: §G-5§!."
 SHL_accident_commission_tt: "Quarter unrest: §G-5§!. Crest pressure: §R+5§!. This furnace's shift counts as trained."
 SHL_water_crisis_tt: "Until the dispute is settled, Arbin, Safir and Loran take §R+4§! wear per cycle. Decisions appear in the \"Quarters and Borders\" category."
