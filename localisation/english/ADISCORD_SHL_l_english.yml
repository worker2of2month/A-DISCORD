 ADISCORD_SHL.2.t: "While the Fire Burns"
 ADISCORD_SHL.2.d: "In the Conclave hall in Khazar, nine crests hang above Jalil Nur's chair. Beneath each sits the head of a house: Khosrow Arbin, Darius Safir, Golshan Loran, Kamran Nur, Tahmuras Bayrat, Fereydun Kerdan, Shirin Sharim, Rauf Darban and Behruz Veyran. The right to the seat is confirmed not by ancestry but by smoke over the house's main furnace. The Law of Continuous Fire was written when owners could still abandon an enterprise and leave a city without wages; today it shields the owners from the question of who owns the city.\n\nAmin Rashad laid the common ledger before the mediator. It lists no ceremonial dates: only stocks, the state of the brickwork and the people due on the next shift. Leyla Nadiri merged nine family reports into one table, and for the first time it is plain that Sharim works the heaviest shifts and Bayrat ships ore on credit. In twenty-eight days the Conclave will see the first production result. Until then the furnaces need supplies, and the old masters need the right to report defects without endangering a crest."
 ADISCORD_SHL.2.a: "Open the ledger of nine furnaces."
 ADISCORD_SHL.3.t: "The Train Never Arrived"
 ADISCORD_SHL.3.d: "Empty trolleys stood on the unloading yard. The train from the Bayrat mines went missing somewhere between the weighbridge and the station throat, and the ledger showed what the houses used to hide behind festive reports: a stoppage. The manager suggests working with what remains in the bunkers; the shift master refuses to record an empty store as a delivery.\n\nTahmuras Bayrat answers from the mines briefly: the ore was shipped, and whoever held the wagons on someone else's stretch of line is the Conclave's problem. Fereydun Kerdan reminds everyone that his road already carries other houses' metal to the sea. Leyla Nadiri has done the sums: a furnace survives one unsupplied cycle; a second in a row extinguishes the main fire, and with it the house's vote in the Conclave.\n\nA manual delivery takes seven days. The common reserve helps at once, if there is one. A transport service of the Conclave could buy missing raw material before future shifts - once it exists."
 ADISCORD_SHL.3.a: "Check the stocks and arrange supplies."
 ADISCORD_SHL.4.t: "An Extinguished Emblem"
 ADISCORD_SHL.4.d: "The smoke over one of the furnace cities has vanished. The furnace is not destroyed: the brickwork and workshops stand, and the shifts still come to the gates out of habit. But the Conclave now argues not about repairs but about the right to sit beneath that house's crest.\n\nThe city administration produced the old clause of the Law of Continuous Fire: when the main furnace went out, ownership returned to the city together with the vote. Darius Safir was the first to recall that the clause was written against abandoned works, not against houses in trouble; Golshan Loran added that the buyers beyond the Golden Gates will not wait for the Conclave to settle a question of property. The house offers to pay for the relighting in exchange for its rights. The masters demand that the furnace stay with its new owner: they kept the brickwork warm while the house looked for money.\n\nAmin Rashad prepared two deeds and laid Leyla Nadiri's bill for the second heat beside them. Jalil Nur must fix ownership before the country pays for the fire: the Conclave will not pay twice for one furnace."
 ADISCORD_SHL.4.a: "Settle ownership and restart terms."
 ADISCORD_SHL.5.t: "The First Pour"
 ADISCORD_SHL.5.d: "The tenth complex in Nine Furnaces has been lit, and for the first time no hereditary crest hangs over its gate. The first shift was made up of masters from Sharim, Arbin and Kerdan, and the supply ledger bears the signatures of the Fellowship of Masters and Engineers. Rauf Darban, whose house held the drawings from the first day, watched the moulds in silence: once the metal flowed, the dispute over whether a tenth furnace could be built was over. The dispute over its rights remained.\n\nGolshan Loran and Darius Safir are ready to recognise the new owner as one of their own: a tenth seat, a tenth crest, the old order. Mariam Arbin brought a different demand from the city assemblies - open the Conclave to every self-governing industrial community, not to one new house. Jalil Nur proposes a single directorate over all furnaces. The shift councils are silent for now, but Salima Darzi has already recorded in her journal who stood at the tenth furnace on its first night.\n\nEvery option keeps the furnace working - and each answers differently the question of who owns the new power."
 ADISCORD_SHL.5.a: "The tenth furnace's delegates will enter the hall."
 ADISCORD_SHL.6.t: "The Price of Transport Access"
 ADISCORD_SHL.6.d: "The line owners sent Khazar a joint contract: heavy equipment for the tenth complex will pass through their sections once access is agreed. The letter is signed by Fereydun Kerdan, whose road leads to the sea, and Behruz Veyran, whose guards hold the border sidings. The sum is small beside the full cost of the project, but the signature would recognise the old houses' right to sell a separate permit for every new enterprise.\n\nRauf Darban calls it the ordinary price of another man's road and asks that the works not be delayed. Mariam Arbin objects: if the Conclave pays once, the houses will charge every civic order. Leyla Nadiri is ready to release the money but warns that a transport service of the Conclave's own would settle the question for good.\n\nJalil Nur may pay the agreement or wait for his own transport. Engineering work and ground preparation in Nine Furnaces continue either way. If independent transport already exists, the open letter does not overturn a finished decision."
 ADISCORD_SHL.6.a: "Continue preparing independent transport."
 ADISCORD_SHL.6.b: "Pay for line access."
 ADISCORD_SHL.7.t: "Whose Masters?"
 ADISCORD_SHL.7.d: "The old houses accepted the calculations of the Fellowship of Masters and Engineers, but refused to treat the masters as free participants in the new project. The letter was signed by Shirin Sharim and Khosrow Arbin: the best shifts in Shahrabad were trained at their furnaces, and they tie the transfer of experienced people to the site in Nine Furnaces to a separate agreement. The project already exists; nobody may charge again for finished drawings, and Rauf Darban was the first to say so.\n\nFarid Mehr proposes another road: a school of masters at the Conclave's furnaces would train its own people, and no house could call them its own. It takes longer, but leaves people free. Golshan Loran, who needs the tenth furnace's metal for export contracts, advises paying and not losing the season.\n\nThe fellowship may pay the agreement or train its own masters. Until the dispute is settled, the site waits. If the school already operates, the open letter does not change its authority."
 ADISCORD_SHL.7.a: "We shall train our own masters."
 ADISCORD_SHL.7.b: "Agree the specialists' transfer."
 ADISCORD_SHL.8.t: "A Special Reserve Price"
 ADISCORD_SHL.8.d: "The suppliers are ready to recognise the Conclave's common emergency reserve, but call it an extraordinary purchase and demand a premium on the next order. Tahmuras Bayrat explains it calmly: each house used to get the old price because it paid in advance and hauled the ore itself; the common reserve of Khazar pays afterwards and wants wagons. Fereydun Kerdan agrees to haul - at his road's tariff.\n\nThe common ledger turns nine familiar contracts into one public dispute for the first time. Leyla Nadiri has costed the premium for one purchase, and Amin Rashad warns that a concession becomes a rule unless it is qualified. A houses' railway, if the Conclave builds one, would remove the tariff question entirely.\n\nJalil Nur may spend political influence on an agreement, accept the premium for one purchase, or wait for the railway. Supplies already paid for keep their price. A working transport service will not yield its authority to a delayed letter."
 ADISCORD_SHL.8.a: "The next order can bear the surcharge."
 ADISCORD_SHL.8.b: "Agree the previous price."
