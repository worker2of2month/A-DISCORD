 SHL_balance_quarters_dominance: "Rule of the Quarters"
 SHL_ratify_needs_crests_tt: "The Conclave balance favours the crests: crests ascendant or ruling"
 SHL_ratify_needs_quarters_tt: "The Conclave balance favours the quarters: quarters ascendant or ruling"
 SHL_ratify_needs_equilibrium_tt: "The Conclave balance is in equilibrium"
 SHL_quarters_and_borders_desc: "Course: [SHLGetPoliticalCourse]\nQuarter unrest: §Y[?SHL_unrest|0]§! / 100. [SHLGetQuartersStatus]\nCrest pressure: §Y[?SHL_house_pressure|0]§! / 100. [SHLGetCrestsStatus]\n\nQanats: [SHLGetWaterStatus]\nVeyr: [SHLGetVeyrStatus]\nMazar: [SHLGetMazarStatus]\n[SHLGetMazarFlankStatus]\n\nBoth scales change at the end of every 28-day cycle. Unregistered quarters add §R5§! unrest each cycle. Until the tenth furnace is complete, active hereditary votes add §R5§! crest pressure each cycle, except under the commune. The course, shift and division of fire modify this total. At 60 the quarters strike and the crests present an ultimatum. Deductions from furnace revenue: §Y[?SHL_income_deduction|0]§! £ADISCORD_economy_treasury_texticon per operating furnace.\n\nConvoy: [SHLGetCampaignReserve]. Outcome: [SHLGetCampaignOutcome].\nAfter peace: [SHLGetSouthProgress].\n\nConsolidation campaign: [SHLGetConsolidationStatus]\nFurnace demand: [SHLGetHouseDemandStatus]\nMetal export: [SHLGetExportMode]"
