 # Book of furnaces and news
 ADISCORD_shl_book.read_on: "Read on."
 ADISCORD_shl_book.put_away: "Put the book away."
 ADISCORD_shl_book.close: "Close the book."
 ADISCORD_shl_book.1.t: "The Book of Furnaces. The First Fire"
 ADISCORD_shl_book.1.d: "The Book of Furnaces is kept in the Conclave archive under the same roof as the industrial ledger, but it is read less often. It is neither a chronicle of houses nor a record of victories: for centuries the secretaries of the Conclave wrote in it when and why the furnaces of Shahrabad were lit and extinguished. The first entry was made by a hand nobody can name, and it begins not with the name of a house but with the name of a city.\n\nKhazar stood at the edge of the desert long before the first furnace. The city lived by caravans and water - the water that flowed through the qanats from the west - and needed neither crests nor metal. The first furnace was built on the outskirts by a wandering master whose name the Book records in several ways; what matters is not the name but that the furnace worked and people came to it. In ten years a quarter grew around it, in twenty a second, and when the master died the furnace went to his sons and the quarter to nobody.\n\nThe sons quarrelled. The Book describes it dryly: one wanted to sell metal to caravans, the other to the city, and while they went to law the furnace cooled. The quarters were left without work and without bread, the city without metal, and brickwork that has cooled completely cracks so badly that it is easier to rebuild than to repair. Khazar learned the first rule of furnaces: a furnace that goes out kills not its owner but those who worked at it.\n\nSo the city gathered the quarter elders, the masters and those merchants who had put money into ore, and wrote down the law that has not changed since: the Law of Continuous Fire. A furnace belongs to whoever keeps its fire. While it burns, the owner disposes of it, its revenue and its people. If it goes out, ownership returns to the city together with the right to speak for the furnace. The workshops and the people stay where they are; only the owner changes.\n\nThe Book notes that the law was written against owners, not for them. It was meant to protect a quarter from an abandoned works. That the same law would one day protect an owner from the city, none of those who wrote it considered - or considered and said nothing."
 ADISCORD_shl_book.11.d: "Khazar's second furnace was lit under the law. The Book records that it was built by the merchant who had put ore into the first, and that he first asked the city for written confirmation: the furnace is his while it burns. The city confirmed. The merchant hired the masters of the first furnace, trained the shifts and was the first to introduce what the Book calls the cycle: twenty-eight days from charging to tapping, a reckoning of revenue, a reckoning of wear. He was also the first to record that reinforced shifts give more metal and wear the brickwork faster, and the first to understand that this was not a technical entry but a political one.\n\nFurnaces multiplied along the qanats and along the road to the sea. Each new one was lit with the city's written confirmation, and the city signed each more willingly: metal fed the quarters, the quarters paid the city, and Khazar grew rich faster than it could count. The Book notes the first water dispute - the third furnace intercepted the fourth's channel - and the first case of an owner extinguishing his own furnace to avoid paying the masters, and losing it under the law. After that, owners learned never to let a furnace go out under any circumstances.\n\nHere the Book first uses the word \"house\". Owners passed furnaces to their children, children to grandchildren, and the ownership the law tied to fire turned out in practice to be tied to a family name: the fire did not go out, so the name remained. The names took crests, the crests were hung over the workshop gates and then over the chairs in the hall where the city once gathered the quarter elders. The hall came to be called the Conclave, and there were no quarter elders in it any more.\n\nThe last entry of the first part is in a different hand. It is short: \"The law has not changed. Who reads it has.\""
 ADISCORD_shl_book.2.t: "The Book of Furnaces. Nine Chairs"
 ADISCORD_shl_book.2.d: "The second part of the Book of Furnaces begins with a list. The secretary who kept it recorded the nine main furnaces in the order in which their crests hang in the Conclave hall, and the order has not changed since, though the houses have tried more than once to dispute it.\n\nThe first furnace is the house of Arbin. It stands furthest west, by the qanats themselves, and is the first to feel when Kyzan closes the channels. The Book says the Arbins built their furnace where the water was, not where the ore was, and so were always richer in water than in metal. Khosrow Arbin, the present head, is the first of the houses to learn of a drought and the last to learn the prices beyond the Golden Gates.\n\nThe second is the house of Safir. The richest crest and the oldest treasury; the Book notes that the Safirs paid for other houses' repairs more than once and always wrote down whose. Darius Safir keeps those records and remembers which houses owe him.\n\nThe third is the house of Loran. The Golden Gates, through which metal leaves with the caravans, stand by Loran's furnace, and the house has since regarded export as its own business and the home market as somebody else's. Golshan Loran knows the price of every caravan and does not know the price of bread in the quarters of Sharim.\n\nThe fourth is the house of Nur. The furnace in Nuran is the smallest of the nine, and the Book does not hide that the Nurs entered the Conclave because nobody thought them dangerous. That is exactly what made the house of Nur the mediator: Jalil Nur sits in the middle of the table because his furnace can never be first. Kamran Nur represents the house while his uncle represents the Conclave.\n\nThe fifth is the house of Bayrat. Mines, not a furnace, made the Bayrats a house: Bayrat ore goes to all nine furnaces, and Tahmuras Bayrat could settle any dispute by holding back one train. The Book notes that he has never done so - and that everyone remembers it."
 ADISCORD_shl_book.12.d: "The sixth is the house of Kerdan. The road to the sea begins at Kerdan's furnace and ends in the glass ports of Veyr, and the house has paid the chamber's levies on every convoy for as long as those levies have existed. Fereydun Kerdan has long regarded the dispute with Veyr as the whole Conclave's business; the Conclave has long regarded it as Kerdan's.\n\nThe seventh is the house of Sharim. The heaviest shifts in Shahrabad; the Book gives the number of accidents for each generation, and the number grows. Shirin Sharim answers with infirmaries at the workshops and strict order, and the shift councils answer her with the duty master Salima Darzi, who grew up at the same furnace.\n\nThe eighth is the house of Darban, in Nine Furnaces. The engineering house: the Darbans built and repaired other houses' furnaces before they had their own, and the drawings of all nine are kept with them, not in the Conclave archive. Rauf Darban considers an order complete only after delivery and keeps the drawing of a tenth furnace that does not yet exist.\n\nThe ninth is the house of Veyran. The border house, last in order and first in guards: Veyran's furnace stands closest to Mazar, and the house has kept its own watch since the Chamber of the Common Ration first counted Shahrabad's metal. Behruz Veyran is certain that the Conclave's security begins at his gate and is paid from his treasury.\n\nThe Book says the houses are not equal and never were. Safir and Loran pay for the Conclave, Bayrat feeds it ore, Veyran guards it, Darban builds, Nur reconciles. Arbin, Safir and Loran drink Kyzan's water; Kerdan and Veyran pay Veyr; Sharim meets every strike first. Nine votes are counted by burning furnaces, and seven of nine are the full consent of the crests. Seven votes, the secretary notes, have been gathered three times in the Conclave's history, and each time against someone."
 ADISCORD_shl_book.3.t: "The Book of Furnaces. Quarters and Journals"
 ADISCORD_shl_book.3.d: "The third part of the Book of Furnaces was not written by a secretary. The secretaries admit it themselves: the hand is different, the paper is different, and the first page begins with the words \"we are not in the ledger\". How this part came into the Conclave archive the Book does not explain; it was not torn out, and that is enough.\n\nThe working quarters of Shahrabad are not registered. They have no vote in the Conclave, no ledgers and no watch of their own. A house keeps a list of its workers, a workshop its own, a city its own, and the lists do not match: one person may appear in three registers under three spellings of his name and in none when he reaches the infirmary. The quarters grew around the furnaces faster than the Conclave learned to count them, and the Conclave preferred not to learn.\n\nThe strength of the quarters is in the shifts. A furnace cannot run without people who know its brickwork, and those people pass that knowledge not to the houses but to each other. At every main furnace there is a shift council: the workshops elect it, it keeps the workshop journal - who came, who did not, who was burned, who was not paid - and its decisions are signed by the duty master. The duty master is not an office but a turn: whoever's shift it is signs. In Sharim that turn falls to Salima Darzi more often than to anyone.\n\nThe shift council journals are the only ledger in Shahrabad that the houses do not keep. The Book quotes from them: there are no slogans, only numbers. How many hours, how many burns, how much promised and how much paid. The houses call the journals denunciations, the quarters call them memory. The Conclave did not read them at all for a long time, until it emerged that after an accident the house's signature and the master's stood under different wear figures, and the second was correct."
 ADISCORD_shl_book.13.d: "The cold strike was invented not by the quarters but by the law. The Law of Continuous Fire says that an extinguished furnace returns to the city, and no house will let its furnace go out. The shift councils understood this before the houses did: if the shifts do not enter the workshop but leave one stoker at each furnace so the brickwork does not cool, the furnace does not go out and no metal is produced. The house keeps its crest and loses its revenue. The city does not get the furnace, but it gets an argument.\n\nThe Book dates the first cold strike to a time when the crests already hung over the chairs. The demands were the same as now: pay for overtime, days off after reinforced shifts, and the right to know where the revenue goes. The houses sent the guard; the guard stood at the gates and found nothing to guard - the workshops empty, the stokers in place, the fire burning. After nine days the houses paid. After nine years they forgot.\n\nThe Book says the shift councils never demanded power until they were refused everything else. If the Conclave neither yields nor waits out a strike, the councils meet together and declare themselves the Shift Council - no longer at a furnace but above the furnaces. This has not yet happened in Shahrabad's history; the Book describes it as a possibility, not an event. Against the quarters stand the crests with their Night - an ultimatum backed by guards and Safir's treasury. Between them stands the cabinet: a secretary with the seal, a guard coordinator, a furnace accountant, a physician, a schoolmaster, a cipher clerk and an envoy. Whom they serve is not for the cabinet to decide.\n\nThe last page of the third part is a list of names. Not delegates or foremen: the stokers who held the fire during the first cold strike. The Book remarks that no house recorded them."
 ADISCORD_shl_book.4.t: "The Book of Furnaces. The Mediator and the Tenth Furnace"
 ADISCORD_shl_book.4.d: "The fourth part of the Book of Furnaces concerns the chair above which there is no crest. The mediator of the Conclave does not rule Shahrabad: he chairs the sessions, counts the votes of burning furnaces, signs what the houses have decided and reconciles them when they have decided nothing. The Book lists the mediators from the first entry; most were heads of small houses, whom the great houses tolerated precisely because they could never be first.\n\nJalil Nur took the chair the same way. The house of Nur holds in Nuran the smallest of the nine furnaces, and when Safir and Loran could not agree who should lead the Conclave, both named Nur: too poor to argue, too old to wait. The Book notes that Nur accepted the chair without objection and first asked the secretary for the industrial ledger - not for himself, but to read it aloud.\n\nThe Book describes Nur's mediation by its cases. The dispute between Arbin and Safir over a qanat he closed by making both sign a common treaty with Kyzan. The dispute between Kerdan and Veyr over the levy he did not close, but for the first time called it the Conclave's business rather than a house's. The strike in Sharim he waited out for nine days without sending the guard, and the house of Sharim has not forgiven him to this day. None of these cases made Nur stronger; each made him more necessary.\n\nAnd yet a mediator is not power. The Book says so plainly: Nur has no guards, no treasury and no vote that his nephew Kamran does not have. He has the ledger and the houses' habit of coming to him when they cannot agree. That is enough while the houses quarrel. What would not be enough once they agree, a Night of the Crests would show - if it happened."
 ADISCORD_shl_book.14.d: "The tenth furnace did not begin with the Conclave. The Fellowship of Masters and Engineers - a workshop association that grew up at Darban's furnace in Nine Furnaces - submitted a drawing to the mediator with one signature: Rauf Darban, for the fellowship, not for the house. The drawing proposed a tenth complex in Nine Furnaces without a hereditary owner. The Book keeps Nur's note in the margin: \"Who owns it?\" - and Darban's answer below: \"Whoever the Conclave decides.\"\n\nThe engineering case was simple. The nine furnaces are unevenly worn, and every cycle one house or another works at its limit; a tenth furnace would take on the orders the nine cannot meet and give the Conclave metal belonging to no crest. The political case was harder, and the Book does not hide that the fellowship understood it better than it showed. A furnace without a house is a chair without a crest, and whoever takes it decides who owns Shahrabad.\n\nThe houses answered differently. Loran and Safir proposed recognising the fellowship as a tenth house: a chair, a crest, the old order, one vote more. Mariam Arbin's city assemblies demanded that the Conclave be opened to all industrial communities, not to one new family name. The shift councils answered nothing, but the Book notes that the tenth furnace's first shift was entered in the Sharim journal before it appeared in the Conclave ledger. Nur himself proposed a third way: a single directorate over all furnaces, the tenth included - and for the first time in the history of the mediation said it as his own opinion rather than as the outcome of a dispute.\n\nThe Book closes the fourth part with words the secretary attributes to Darban: \"The furnace we will build. Who gets it is not ours to build.\" While the work proceeds by stages - the fellowship, the foundation, the brickwork, the first heat - the Conclave has time to decide. The Book is not sure there is as much time as it seems."
 ADISCORD_shl_book.5.t: "The Book of Furnaces. Neighbours"
 ADISCORD_shl_book.5.d: "The fifth part of the Book of Furnaces is written on different paper: it was kept not in the Conclave archive but in the envoys' chancery, and it smells of the road. The secretaries copied it into the Book because no furnace of Shahrabad burns on its own. Water comes from the west, the road leads east, and from the south come those who count Shahrabad's metal as their own.\n\nKyzan. The assembly of irrigation communities has no capital and wants none. The communities maintain their stretches of the qanats - underground channels that have carried water from the mountains into the desert for centuries - and agree common works through delegates. Kyzan's qanats feed the furnaces of Arbin, Safir and Loran, and the Book says honestly that Shahrabad never paid for it: the water flowed while it flowed. The communities can close the channels, and then three furnaces of nine begin counting the hours to overheating. The Conclave can buy a quota, drill artesian wells or take the head wells by force; the cities and the shift councils propose a fourth way - a brotherhood of the qanats, in which water and metal are shared by assemblies. The Book notes that Kyzan remembers every promise of the houses and believes none.\n\nVeyr. The Trade Chamber of the glass ports owns no land but owns the scales. Shahrabad's metal goes to the sea by Kerdan's road and passes through Veyr's ports, and the chamber has levied every wagon for as long as there have been wagons. The levy is small, but it reduces the revenue of all nine furnaces, and the Book says the houses quarrelled over it more often than over water. The chamber can be made a partner by giving it a share of exports; it can be bypassed with a harbour of Shahrabad's own; its scales can be removed by force in a limited war for the key to the sea. The Book remarks that the chamber trades and does not fight - until it has to."
 ADISCORD_shl_book.15.d: "Mazar. The Chamber of the Common Ration is Shahrabad's strangest neighbour, and the Book admits the secretaries long failed to understand it. The chamber neither buys nor sells: it distributes the desert's water and supplies on the principle of common benefit, and counts Shahrabad's metal as part of that ration - just like the water of its cisterns. Refused, the chamber does not bargain; it gives sixty days and crosses the border of the Zarkhan District. The Book describes three earlier cases: twice Shahrabad paid, once it met Mazar's detachments on prepared positions and survived. After each case the chamber returned with a new calculation.\n\nFurther south lie Kadir, Rahma and Sardan: the caravan road, the Circle of Wells and the dry riverbed patrols. The Book calls them not neighbours but a road: across them Shahrabad and Svetlogorye look at each other over the desert without sharing a border. They will become debtors, members of a compact, subjects of a directorate or fiefs of the houses - depending on who arrives first and with what.\n\nSvetlogorye. The oil-rich North sells the furnaces fuel and can cut it off with an embargo; the viceregal ladder of Svetlogorye is the only power in the South equal to the Conclave. The Book writes of this briefly, because the secretaries knew little, and honestly: the South will have one suzerain, and it will be either Shahrabad or Svetlogorye. A neutral treaty between two equals is impossible not because nobody wants it, but because the desert between them is never nobody's.\n\nThe last entry in the Book of Furnaces was made in the year the tenth furnace was founded. The secretary did not sign it. It reads: \"The furnaces burn. Whose they are will be decided by those who read this book.\""
 ADISCORD_SHL_news.1.t: "Shahrabad: The Conclave of Ten"
 ADISCORD_SHL_news.1.d: "From Khazar: the Conclave of Shahrabad has ratified the charter of the Conclave of Ten. The Fellowship of Masters and Engineers, which built the tenth furnace in Nine Furnaces, is recognised as the tenth hereditary house with a chair and a crest in the Conclave hall. Jalil Nur remains mediator, and the head of the cabinet - secretary Amin Rashad - announced that the Golden Gates cartel now trades metal in the name of all ten furnaces.\n\nEnvoys of the Trade Chamber of Veyr attended the ratification and called it good news for the ports. The assembly of irrigation communities of Kyzan sent nobody. In the working quarters of Shahrabad the ratification was met quietly: the shift councils did not oppose it, but the Sharim duty master Salima Darzi recorded in her journal that the tenth crest hangs over a furnace her people built.\n\nShahrabad's neighbours note that the Conclave of Ten speaks the language of contracts and credit, and await its first offers. Svetlogorye has not yet replied."
 ADISCORD_SHL_news.1.a: "Ten crests."
 ADISCORD_SHL_news.2.t: "Shahrabad: The Southern Compact"
 ADISCORD_SHL_news.2.d: "From Khazar: the Conclave of Shahrabad has ratified the Southern Compact. The city assemblies have gained representation, and for the first time in the Conclave's history the seal passed to a hand that was not a house's: Mariam Arbin, chair of the city assemblies and daughter of Khosrow Arbin, head of the first house, is head of state. Jalil Nur handed her the mediator's chair by an act read aloud; her father did not attend.\n\nThe new government announced public office hours, published minutes and well charters for the neighbours. The assembly of irrigation communities of Kyzan sent delegates and is named the first invited member of the compact. The Trade Chamber of Veyr answered with reserve; the Chamber of the Common Ration of Mazar with silence.\n\nThe houses keep their furnaces but not the vote over the revenue. Golshan Loran called the compact an experiment the Golden Gates will pay for. The shift councils backed the ratification; the crests remain on the hall walls, but below the delegates' chairs."
 ADISCORD_SHL_news.2.a: "The compact is signed."
 ADISCORD_SHL_news.3.t: "Shahrabad: The Directorate of Furnaces"
 ADISCORD_SHL_news.3.d: "From Khazar: the Conclave of Shahrabad has ratified the Directorate of Furnaces. All nine main furnaces and the tenth in Nine Furnaces pass to the state; Jalil Nur received the seal as Director of Furnaces and appointed Rauf Darban, head of the engineering house of Darban, head of the cabinet. The Directorate's first order was a single estimate for all furnaces and a supply schedule for Arman Teymur's national watch.\n\nThe houses keep concession income but not the right to dispose of the furnaces. Darius Safir and Golshan Loran left the hall before the act was fully read; Behruz Veyran handed the border house guards to the common register under protest. The shift councils received even shifts and supervision.\n\nThe neighbours read the ratification carefully. Iron Shahrabad declared that the disputes over qanats, levies and ration are now a matter of one order, not nine houses. Kyzan, Veyr and Mazar await ultimatums; Svetlogorye is rereading its fuel contracts."
 ADISCORD_SHL_news.3.a: "One order."
 ADISCORD_SHL_news.4.t: "Shahrabad: The Council of Crests"
 ADISCORD_SHL_news.4.d: "From Khazar: after the Night of the Crests the Conclave of Shahrabad has recognised a regency. Darius Safir, head of the richest house, received the seal as regent of the Council of Crests; Jalil Nur remains mediator in name. Behruz Veyran's guards withdrew from the bridges and the Khazar telegraph only after the act was signed. The regent called the measure temporary and named no term.\n\nAll furnaces are returned to the houses with their privileges; the city commissions are dissolved, the shift councils unrecognised, revenue pledges declared the basis of the treasury. Mariam Arbin has left Khazar; Salima Darzi, duty master of Sharim, has not left the furnaces and signed nothing.\n\nThe neighbours met the news differently. The Throne of Kadir sent congratulations first. The Trade Chamber of Veyr reminded Shahrabad of its debts. The assembly of irrigation communities of Kyzan closed the channels for a day - in mourning for the Conclave, as the letter says. Svetlogorye observed that it will now talk to one house rather than nine."
 ADISCORD_SHL_news.4.a: "A temporary measure."
 ADISCORD_SHL_news.5.t: "Shahrabad: The Commune of Fire"
 ADISCORD_SHL_news.5.d: "From Khazar: after a cold strike won by the quarters, the Conclave of Shahrabad has recognised the Shift Council. The councils at the main furnaces took the furnaces, and the duty master Salima Darzi of Sharim signed the act in the commune's name. The crests of the nine houses came down from the hall wall; workshop journals hang in their place. Jalil Nur handed over the seal and left; Amin Rashad surrendered it and stayed with the archive.\n\nThe houses answered differently: Darius Safir and Behruz Veyran left Shahrabad, Golshan Loran sells the commune's metal on commission, Khosrow Arbin surrendered his furnace to the council and stayed with it as master of the qanats. Mariam Arbin leads the assemblies, but the commune signs for them.\n\nThe neighbours are alarmed. The assembly of irrigation communities of Kyzan was the first to accept the brotherhood of the qanats. The Trade Chamber of Veyr closed its ports to council delegates. The Chamber of the Common Ration of Mazar did not reply. Svetlogorye reinforced the guard on its oilfields: the shift councils are already writing there."
 ADISCORD_SHL_news.5.a: "Furnaces to the workers."
 ADISCORD_SHL_news.6.t: "Shahrabad Declares a Limited War"
 ADISCORD_SHL_news.6.d: "From Khazar: for the first time the Conclave of Shahrabad has declared a limited war on a neighbour. A dispute once settled by Ramin Farzan's envoys, the houses' letters and sixty-day deadlines, the Conclave has settled with the watch: Arman Teymur's national watch and the guards of the border house of Veyran marched to the border under one order. Nine houses signed the declaration together - Khazar has not seen that in a long time.\n\nThe declaration calls the war's aims limited: wells, a road or cisterns, not the neighbour's capital. Shahrabad promises peace on the old terms to whoever accepts it, and a truce if the war drags on. The neighbours counted the deadline and understood that the Conclave does not plan a long campaign.\n\nKyzan, Veyr and Mazar received notices on the same day. Svetlogorye noted that Shahrabad has learned to fight under one order, and remembered the date."
 ADISCORD_SHL_news.6.a: "The clock is running."
 ADISCORD_SHL_news.7.t: "The Crown of the South"
 ADISCORD_SHL_news.7.d: "From Khazar: Shahrabad has accepted the Crown of the South. The war for the South is over, and the Conclave of Furnaces is the sole suzerain of the deserts between the qanats of Kyzan and the oil belt of Svetlogorye. Kadir, Rahma and Sardan, Kyzan, Veyr and Mazar have each recognised Khazar's primacy on their own terms - by compact, concession, fief or council - and none disputes the crown.\n\nSvetlogorye, Shahrabad's only rival for the South, no longer claims the deserts. The oil-rich North has kept its fields but lost its viceregal ladder, and its fuel now reaches the furnaces on Khazar's terms.\n\nThe furnaces burn. Who signed the crown - Jalil Nur, Mariam Arbin, Darius Safir or the duty master of the shift councils - the neighbours learned from the text of the act. For the first time the Law of Continuous Fire applies beyond Shahrabad."
 ADISCORD_SHL_news.7.a: "The South is one."
 ADISCORD_SHL_news.8.t: "The Southern Campaign Repelled"
 ADISCORD_SHL_news.8.d: "From Khazar: the campaign against Shahrabad from the south has been repelled. The detachments of the Chamber of the Common Ration that crossed the border of the Zarkhan District for their ration were stopped at the furnace district and withdrew to the cisterns. Arman Teymur's national watch held prepared positions, the guards of the border house of Veyran took the first blow, and the furnaces of Darban and Sharim cast metal for the front without stopping their shifts.\n\nThe ration demand is dropped. For the first time in the Conclave's history Shahrabad met a neighbour not with a payment or a letter but with one order for nine houses, and the neighbours noticed. The assembly of irrigation communities of Kyzan and the Trade Chamber of Veyr are revising their calculations; Svetlogorye observes that the furnaces can defend themselves.\n\nIn Khazar, Leyla Nadiri entered the war in the industrial ledger as a separate line. The furnaces keep working."
 ADISCORD_SHL_news.8.a: "The furnaces held."

