# Mazar border pact and neutrality
 SHL_mzr_border_pact_faction: "Mazar Border Pact"
 SHL_negotiate_mzr_neutrality: "Negotiate the neighbour's non-intervention"
 SHL_negotiate_mzr_neutrality_desc: "[SHLGetMazarFlankStatus]\n\nOffer compensation for the earlier border conflict in exchange for refusing to support Mazar. Negotiations remain available until war begins. The neighbour may refuse; refusal and an expired offer cost nothing."
