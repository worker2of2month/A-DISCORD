 ADISCORD_SHL.110.t: "Dust on the Mazar road"
 ADISCORD_SHL.110.d: "A water-caravan driver noticed the change first. Soldiers had replaced toll collectors at Mazar’s cisterns. They recorded barrel volumes and asked how long refilling them would take. On the return journey he saw another column.\n\nNobody in the Conclave called it war. The houses wanted an accounting, city delegates wanted shelters, and the guard commander asked for one register that could turn nine commanders into a single army. The choice could no longer be postponed indefinitely.\n\nSeveral production cycles remain before the first demand. Pay for guards, commit two pours to a field convoy, or save for a final settlement. If war comes, its objective will be the corridor of two cisterns, not an endless march into the desert."
 ADISCORD_SHL.110.a: "Put the map beside the ledger."
 ADISCORD_SHL.111.t: "Shahrabad assembles its columns"
 ADISCORD_SHL.111.d: "Shahrabad has sent notice that the Conclave is preparing a campaign against the two cisterns. Field equipment is already being unloaded on factory sidings. In twenty-eight days, unless the dispute is settled or another war intervenes, the caravan guards will become an invading army.\n\nMazar must hold the roads to water. Losing both cisterns while Shahrabad retains its frontier will let the enemy impose a limited peace."
 ADISCORD_SHL.111.a: "Prepare the approaches."
 ADISCORD_SHL.112.t: "Charter of the returned cisterns"
 ADISCORD_SHL.112.d: "Shahrabad offers to return both cistern regions to Mazar. The condition is voluntary membership in the Southern Compact. The proposal appoints no governor and claims no treasury: Mazar retains its independence and army.\n\nA road reconstruction programme funded by Shahrabad may follow the military agreement. It must still be chosen and financed separately. Rejection preserves the existing peace border; acceptance returns the land only if Shahrabad’s government remains able to honour the agreement."
 ADISCORD_SHL.112.a: "Recover the land and sign the compact."
 ADISCORD_SHL.112.b: "Keep the existing peace in force."
 ADISCORD_SHL.113.t: "The second barrier comes down"
 ADISCORD_SHL.113.d: "Two caravans met on the Mazar road. One carried soldiers home; the other carried clerks returning to the land registers. The cisterns were restored to Mazar, and another independent country appeared on the map of the Southern Compact.\n\nThe Conclave must now decide what its signature means. Paid road reconstruction and, for the Commune, weapons for neighbouring communities can turn a military agreement into an everyday connection. Our own treasury must finance that work."
 ADISCORD_SHL.113.a: "Open the reconstruction ledger."
 ADISCORD_SHL.114.t: "The signatures did not meet"
 ADISCORD_SHL.114.d: "The charter did not take effect: Mazar declined, or conditions changed before its reply. No land was transferred. The current peace remains in force.\n\nIf both sides can again fulfil the agreement, the Conclave may renew negotiations. Until then, administration and reconstruction must follow the existing borders."
 ADISCORD_SHL.114.a: "Preserve the existing settlement."
 ADISCORD_SHL.115.t: "What remained after the campaign"
 ADISCORD_SHL.115.d: "The final register of the southern programme arrived at the Conclave. It bore no victory slogan: only assets, obligations and recipients. Each entry recorded a choice made when metal could become revenue, weapons or a road.\n\n[SHLGetSouthernEpilogue]\n\nThe country faced Mazar’s threat, set the terms of peace and paid for its own vision of the future. The furnaces will continue working; their fire now supports an order defined by fulfilled obligations as well as its crest."
 ADISCORD_SHL.115.a: "Close the campaign register."
 ADISCORD_SHL.73.b: "Return the cisterns for a concession."
 ADISCORD_SHL.73.c: "Offer independent Mazar a charter."
 SHL_epilogue_house: "The houses invested the campaign’s result in trade and new production. The Conclave chose whether to hold the corridor or exchange it for concession rights. A public loan does not disappear simply because someone declares victory."
 SHL_epilogue_city: "The city assemblies gained a road paid for openly. If the charter was accepted, Mazar remained an independent partner; if the corridor was retained, its inhabitants gained a place in the common political order."
 SHL_epilogue_directorate: "The Directorate tied military command to a new arsenal. It preferred to retain acquired land; after a less favourable peace, production was rebuilt at home. Its orders now have an industrial foundation."
 SHL_epilogue_regent: "The Regency paid for house-guard training and the restoration of an operating furnace. Its vote rests on a working shift again; unpaid wartime obligations remain in the ledger. Privilege now carries both representation and a duty of service."
 SHL_epilogue_commune: "The Commune paid for a local levy with its own recruits and weapons. The region’s owner received it: our own districts, or independent Mazar communities after the charter. Solidarity gained the weight of actual formations and a completed road."
