 ADISCORD_SHL.5.settled: "The tenth furnace in Nine Furnaces was lit under rules the Conclave had fixed before the building was finished. The first shift was made up of masters from different cities, and the supply ledger bears the signatures of the Fellowship of Masters and Engineers. Rauf Darban walked Jalil Nur along the casting bay: once the metal flowed into the moulds, the dispute over whether a tenth complex could be built was over. What remained was to see whether the decisions already taken could bear real work.\n\nAt the gate stood those who had argued about this furnace from the first day: Golshan Loran and Darius Safir for the crests, Mariam Arbin for the city assemblies, Salima Darzi for the shift councils. Each remembered what they had demanded of the project; none could replace the next delivery with a signature. The new furnace had to supply the next cycle, keep its masters and fulfil the promised orders.\n\nThe political order is already settled. Its strength now depends on what Shahrabad does with the metal it has gained."
