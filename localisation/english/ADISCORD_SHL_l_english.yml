 industrial_aristocratism: "Industrial Aristocratism"
 industrial_aristocratism_desc: "§YIndustrial Aristocratism§!\n\nThe right to govern belongs to the houses that keep their industrial furnaces burning without interruption. Wealth, hereditary standing and ownership of production form a single foundation of power. As long as the furnaces burn, the Conclave retains its privileges.\n\nIn Shahrabad, nine industrial houses divide markets, raw materials and seats in the Conclave. The prosperity of the ruling families is presented as the reward for their responsibility for production: working districts are promised wages and supplies, cities order and protection, and owners secure property and familiar luxury.\n\nYet an inherited name alone cannot sustain authority. An extinguished furnace calls into question a house's right to command its enterprise and speak for its city. Disputes over repairs, reserves and working shifts become disputes over who owns Shahrabad and who may hold its masters to account."
 SHL_conclave: "Conclave of Furnaces"
 SHL_conclave_desc: "Industrial houses retain hereditary rights while their main furnaces burn. Every 28 days production consumes raw materials, earns revenue and adds wear. Select a furnace to arrange supplies, training or repairs. Extinction changes ownership without destroying the city's factories."
 SHL_tenth_project: "The Tenth Furnace"
 SHL_tenth_project_desc: "A partnership of engineers and workers is building a new complex in the industrial district of [294.GetName]. Each stage has a separate payment. Losing the site or being unable to deliver the paid factory returns the deposit and allows another attempt."
