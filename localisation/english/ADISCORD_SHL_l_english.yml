 SHL_law_of_continuous_fire: "The Law of Continuous Fire"
 SHL_law_of_continuous_fire_desc: "The houses retain their hereditary votes while their main furnaces burn. Make the old law a public production obligation and show what it requires of each owner."
 SHL_census_of_nine: "Census of Nine Furnaces"
 SHL_census_of_nine_desc: "Bring stocks, brickwork and shifts into a common ledger. A shared reserve begins with materials that can actually be delivered."
 SHL_reserve_for_next_shift: "Reserve for the Next Shift"
 SHL_reserve_for_next_shift_desc: "Build an emergency supply service that can rescue a furnace before a missed train becomes a second consecutive shortage."
 SHL_conclave_rules: "Rules of the Conclave"
 SHL_conclave_rules_desc: "Define the transfer of a stopped enterprise to its city. A political dispute must not erase the buildings or pay for a restart that never occurred."
 SHL_common_industrial_account: "A Common Industrial Account"
 SHL_common_industrial_account_desc: "Publish the industry's account in one ledger. Owners and cities must know who receives the proceeds and who pays for the next shift."
 SHL_houses_railway: "The Houses' Railway"
 SHL_houses_railway_desc: "Coordinate the transport lines into a scheduled supply service. The furnaces need reliable deliveries and a way to buy missing materials without nine separate monthly orders."
 SHL_school_of_masters: "School of Masters"
 SHL_school_of_masters_desc: "Open a common school for experienced shifts. Knowledge must outlive a particular house and let workers maintain their own production."
 SHL_careful_smelting: "Careful Smelting"
 SHL_careful_smelting_desc: "A slower shift preserves the furnace lining and uses less raw material. Lower revenue can purchase years of uninterrupted production."
 SHL_overtime_shift: "The Overtime Shift"
 SHL_overtime_shift_desc: "The country can extract more from a supplied furnace at the cost of faster wear and a second material pack. Overtime must remain an explicit choice."
 SHL_repair_without_extinction: "Repair Without Extinction"
 SHL_repair_without_extinction_desc: "Service auxiliary sections while the main furnace remains alight. Maintenance should preserve production and political rights rather than force their suspension."
 SHL_engineer_society: "The Engineering Partnership"
 SHL_engineer_society_desc: "Masters propose a furnace owned by none of the old houses. Begin with a common design, an engineering team and an accountable budget."
 SHL_right_to_land: "A Right to Land"
 SHL_right_to_land_desc: "The city will provide land and access to industrial water. A drawing must become a site with a lawful owner before contractors arrive."
 SHL_common_fund: "The Common Fund"
 SHL_common_fund_desc: "Cities and masters establish a joint construction fund. Line owners demand their share for moving heavy equipment; pay for access or develop an independent service."
 SHL_own_transport: "Independent Transport"
 SHL_own_transport_desc: "An independent transport service ends the access dispute. Neither an open letter nor a delayed response can revoke this policy once completed."
 SHL_workers_charter: "The Workers' Charter"
 SHL_workers_charter_desc: "Define changes of employer, training and participation in management. Even a future tenth house must begin with a clear contract with its own city."
 SHL_build_tenth_complex: "Build the Complex"
 SHL_build_tenth_complex_desc: "The project is ready for equipment installation. Paid construction delivers a real civilian factory in the industrial district of [294.GetName]; an occupied building slot cannot count as a completed furnace."
 SHL_first_pour_focus: "The First Pour"
 SHL_first_pour_focus_desc: "Test the complex under load. The first pour requires a paid start and a real material pack, turning a ceremony into a production result."
 SHL_tenth_voice: "The Tenth Voice"
 SHL_tenth_voice_desc: "The furnace works, but its delegates wait outside the Conclave. Decide whether the partnership becomes a new house or changes the basis of political rights."
 SHL_new_house: "A New Industrial House"
 SHL_new_house_desc: "Let the partnership become a house in its own right. Existing law protects it, but its leaders become heirs to the privileges they challenged."
 SHL_house_compromise: "The Agreement of Ten"
 SHL_house_compromise_desc: "Agree the new house's powers and guarantees to the cities. The Conclave retains its system of representation while accepting another member."
 SHL_admit_tenth_house: "The Tenth House"
 SHL_admit_tenth_house_desc: "The new furnace receives a full Conclave vote. Continuous operation becomes the same condition of power that binds the other houses."
 SHL_open_conclave: "An Open Conclave"
 SHL_open_conclave_desc: "Production can earn representation without a hereditary title. The cities need a public mandate and their own way to choose delegates."
 SHL_city_charters: "City Charters"
 SHL_city_charters_desc: "Define residents' access to enterprise management and common services. City ownership must sustain production rather than merely replace a name on a seal."
 SHL_rights_without_fire: "Rights Beyond the Fire"
 SHL_rights_without_fire_desc: "Representation no longer depends on keeping one furnace alight. A shutdown remains an economic problem without stripping its city of a political voice."
 SHL_nur_directorate: "Nur's Directorate"
 SHL_nur_directorate_desc: "Nur proposes unified management of reserves, repairs and major production. The state assumes the duties by which the houses justified their privileged position."
 SHL_common_dispatch: "A Common Dispatch Service"
 SHL_common_dispatch_desc: "Coordinate shifts and supplies under a single service. Its authority includes an obligation to pay for work and name the recipients of assistance."
 SHL_state_furnaces: "State Furnaces"
 SHL_state_furnaces_desc: "The industrial directorate takes control of the enterprises. It must deliver working industry rather than a new form of personal ownership."
 SHL_railway_guard: "Railway Guard"
 SHL_railway_guard_desc: "Protect stations and trains. Prepare communications and supplies for existing formations without turning every house into a private army."
 SHL_factory_air_defence: "Factory City Air Defence"
 SHL_factory_air_defence_desc: "Dense settlements around the furnaces require air protection. Deploy industrial batteries and train their crews to defend the industrial district."
 SHL_industrial_evacuation: "Industrial Evacuation Service"
 SHL_industrial_evacuation_desc: "A prepared service can move equipment, documents and specialists. Its engineering teams will continue to work in peacetime."
 # Quarters, crests and borders
 SHL_quarters_and_borders: "Quarters and Borders"
 SHL_quarters_and_borders_desc: "Quarter unrest: §Y[?SHL_unrest|0]§! / 100. [SHLGetQuartersStatus]\nCrest pressure: §Y[?SHL_house_pressure|0]§! / 100. [SHLGetCrestsStatus]\n\nQanats: [SHLGetWaterStatus]\nVeyr: [SHLGetVeyrStatus]\nMazar: [SHLGetMazarStatus]\n\nBoth scales change at the end of every 28-day cycle. At 60 the quarters strike and the crests present an ultimatum. Deductions from furnace revenue: §Y[?SHL_income_deduction|0]§! £ADISCORD_economy_treasury_texticon per operating furnace.\n\nConvoy: [SHLGetCampaignReserve]. Outcome: [SHLGetCampaignOutcome].\nAfter peace: [SHLGetSouthProgress]."
