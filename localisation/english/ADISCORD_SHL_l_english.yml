 SHL_unregistered_quarters: "Quarters outside the register"
 SHL_unregistered_quarters_desc: "In a country of twenty million people, records remain divided among houses, workshops and cities. Incompatible lists keep residents outside public institutions. A unified register costing 80 treasury or the Workers Charter removes this spirit."
 SHL_register_quarters: "Recognise the quarter registers"
 SHL_register_quarters_desc: "Reconcile house, factory and city records without invalidating existing documents. Removes Quarters outside the register; payment remains available until the Workers Charter settles the issue."
 SHL_registers_result_tt: "Remove Quarters outside the register. City support §G+8§!; house pressure §R+5§!."
 SHL_recognise_registers_tt: "80 £ADISCORD_economy_treasury_texticon: remove Quarters outside the register; city support +8, house pressure +5."
 SHL_cabinet_public_minutes_tt: "City support +5; house pressure +5."
 ADISCORD_SHL.120.t: "Seven folders on the table"
 ADISCORD_SHL.120.d: "Seven identical folders arrived in Khazar. Amin Rashad had the first; the others covered defence, the economy, medicine, schools, intelligence and foreign affairs. Until noon, the Conclave secretary kept family crests outside the room: at the first cabinet meeting they would have taken more space than the reports.\n\nArman Teymur brought incompatible guard regulations. Leyla Nadiri brought invoices for equipment claimed by three houses. Samira Hadi laid down a list of patients without recognised papers. Farid Mehr asked which schools their children would attend. Bahram Kaveh quietly passed Ramin Farzan an intercepted caravan schedule.\n\nRashad proposed a simple beginning: every duty needed an officer and every decision a record. The dispute concerned who could read it. The houses wanted a closed archive; the quarters wanted evidence that the government had started work. If a new order has already been ratified, this first report can be received as the beginning of its history."
 ADISCORD_SHL.120.a: "Open the minutes to the city assemblies."
 ADISCORD_SHL.120.b: "Keep the minutes with the secretary for now."
 ADISCORD_SHL.120.c: "Receive the cabinet report."
 ADISCORD_SHL.121.t: "People missing from the ledger"
 ADISCORD_SHL.121.d: "Samira Hadi brought a clerk from eastern Khazar to the meeting. The clerk carried three identity papers for one worker: factory, house and city. Each spelled his name differently. When he entered the infirmary, the house refused to pay for a stranger and the city failed to find him on its list.\n\nThe same story reached the cabinet from port streets and furnace settlements. Twenty million residents no longer fitted a state accustomed to counting voting houses. The quarters did not ask for a census from nothing. They already knew their people; they asked the state to recognise those records.\n\nLeyla Nadiri priced the work at eighty treasury: clerks, archive checks and public appeals desks. House elders objected to losing their exclusive authority to certify a person. The cabinet may pay now, return to the issue through Quarters and Borders, or establish the same principle through the Workers Charter."
 ADISCORD_SHL.121.a: "Pay for verification and recognise the records."
 ADISCORD_SHL.121.b: "Receive the report; let the current settlement decide."
 ADISCORD_SHL.122.t: "An oath in Khazar square"
 ADISCORD_SHL.122.d: "The first paid national watch levy completed its training. Shahrabad already had armed forces: house guards had protected furnaces and roads for years. For the first time, a new formation had been assembled through one muster, one supply system and without nine separate permissions to march.\n\nIn Khazar square, Arman Teymur noticed soldiers looking for their house standard. He asked the old sergeants to stand at the front and read the order together. Their experience was being retained; a common command would now answer for it.\n\nAt the barracks gate, people argued over the unit name. The payment book already carried the plain words Furnace Levy. In the square they called it the watch that would not need a meeting of elders to protect a neighbour."
 ADISCORD_SHL.122.a: "Receive the oath and issue the marching rolls."
 ADISCORD_SHL.123.t: "Who receives the seal"
 ADISCORD_SHL.123.d: "The transfer of power in Khazar began with keys. The same locks protected the archives; the same petitioners waited outside. The new order had to decide to whom the people behind the ministry desks would answer.\n\n[SHLGetCabinetStory]\n\nThe back of the transfer act listed outstanding obligations. Departments continued working; payments, orders and debts did not disappear with a different signature. Even if another political turn changes the cabinet again, this record will remain in the archive."
 ADISCORD_SHL.123.a: "Pass the seal with its obligations."
 SHL_cabinet_story_house: "Amin Rashad retained the secretary seal. The houses recognised the new charter, but each wanted it to confirm its own rights. Rashad read one rule for all of them: disputes over precedence would not suspend signed orders. Some heard a guarantee of property; others heard the first limit on family discretion."
 SHL_cabinet_story_city: "Mariam Arbin brought city assembly minutes instead of a house recommendation. She demanded public office hours and published spending decisions. Ministers retained their departments, but would now explain their work to representatives of streets once left outside the Conclave doors."
 SHL_cabinet_story_state: "Rauf Darban unfolded a dispatch chart. To him, state power meant linking workshop, warehouse and front through a single order. Department heads received deadlines for checking stocks. The Conclave might debate the future; the Directorate already demanded a name responsible for the next delivery."
 SHL_cabinet_story_regent: "Darius Safir took personal charge of the cabinet. Elders expected their privileges back; the regent reminded them of furnace upkeep and the cost of the guard. House crests returned to the table, beside the invoices. Even hereditary power had to say who would pay for its promises."
 SHL_cabinet_story_commune: "Salima Darzi arrived from the shift councils with a workshop journal. First she checked an unpaid order: the state seal could not turn yesterday labour into a gift to a new regime. Councils received a political voice; ministers had to reconcile their plans with the people who would carry them out."
 SHL_cabinet_story_unratified: "The secretaries prepared a transfer act, but the final political settlement had not been ratified. Departments retained their current duties and the seal remained with the Conclave secretary."
 minister_SHL_Amin_Rashad: "Amin Rashad"
 minister_SHL_Amin_Rashad_desc: "The Conclave secretary knows which signature costs money and which creates an obligation. He coordinates the departments before ratification and retains the office under the houses."
 minister_SHL_Mariam_Arbin: "Mariam Arbin"
 minister_SHL_Mariam_Arbin_desc: "The chair of the city assemblies began with the water registers of Arbin. She demands that cabinet spending be explained to the shifts paying for it."
 minister_SHL_Rauf_Darban: "Rauf Darban"
 minister_SHL_Rauf_Darban_desc: "The dispatch administrator considers an order complete only after delivery. In the Directorate cabinet he connects production quotas, railways and army orders."
 minister_SHL_Darius_Safir: "Darius Safir"
 minister_SHL_Darius_Safir_desc: "The regent represents the house elders and personally leads their cabinet. His authority rests on inherited obligations: a furnace grants privilege, but requires upkeep and service."
 minister_SHL_Salima_Darzi: "Salima Darzi"
 minister_SHL_Salima_Darzi_desc: "The shift councils delegate checks government plans against workshop journals. She heads the communal cabinet without handing its departments to the furnace owners."
 minister_SHL_Arman_Teymur: "Arman Teymur"
 minister_SHL_Arman_Teymur_desc: "The former caravan guard commander trains the national watch. He must turn nine traditions of command into one chain of orders while retaining the experience of local officers."
 minister_SHL_Leyla_Nadiri: "Leyla Nadiri"
 minister_SHL_Leyla_Nadiri_desc: "The furnace partnership economist separates the public treasury from family accounts. She oversees equipment and output even while the Conclave disputes ownership of the finished metal."
 minister_SHL_Samira_Hadi: "Samira Hadi"
 minister_SHL_Samira_Hadi_desc: "The workers quarter physician connects factory infirmaries to city medicine. To her, registration means being able to find a patient and return a survivor home."
 minister_SHL_Farid_Mehr: "Farid Mehr"
 minister_SHL_Farid_Mehr_desc: "The master instructor seeks common curricula for the children of houses and quarters. His schools train technicians and literate junior officers rather than merely issuing certificates."
 minister_SHL_Bahram_Kaveh: "Bahram Kaveh"
 minister_SHL_Bahram_Kaveh_desc: "The former railway cryptographer looks for threats in freight routes and broken communications. His service protects schedules and verifies reports without claiming omniscience."
