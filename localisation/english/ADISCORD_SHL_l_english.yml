 ADISCORD_SHL.110.t: "Dust on the Keyzan road"
 ADISCORD_SHL.110.d: "A water-caravan driver from the Zarkhan District was the first to notice the change. At Keyzan's cisterns of Tabar stood armed men of the communities, not qanat keepers. They recorded the volume of the barrels and asked how many days it would take to fill them again. On the way back the driver saw another column and reported it not to a house but to Behruz Veyran's guard.\n\nAt the Conclave session nobody called it war. Darius Safir demanded that the costs be counted, Mariam Arbin that shelters be prepared in the quarters, and Arman Teymur asked for at least one roll in which nine different commanders would mean one army. Bahram Kaveh confirmed: the communities' columns are not going to the cisterns for water. The choice can no longer be put off forever.\n\nSeveral production cycles remain before the first demand. The Conclave can pay the watch, give two heats to a campaign baggage train, or raise the money for a final settlement. If it comes to war, the objective is the corridor of two cisterns - Sevir and Tabar - not an endless march into the desert."
 ADISCORD_SHL.110.a: "Put the map beside the ledger."
 ADISCORD_SHL.111.t: "Shahrabad assembles its columns"
 ADISCORD_SHL.111.d: "A notice has come from Shahrabad: the Conclave has begun preparing a march on the two cisterns. Campaign equipment is already being unloaded on the Khazar factory sidings, the furnaces of Darban and Sharim are casting metal for the baggage train, and the guards of the border house of Veyran are gathering in the Zarkhan District. In twenty-eight days, unless the dispute is closed earlier or war begins for another reason, the caravan guard becomes an advancing army.\n\nThe delegates of the Assembly of Canal Communities know Shahrabad from water ledgers: nine houses, nine guards, nine quarrels. But the notice was signed not by a house but by the Conclave, and the preparation is commanded not by the head of a crest but by Arman Teymur, chief of the national watch. Nine habits of command have been reduced to one, and that is new.\n\nKeyzan must hold the roads to the water. Losing both cisterns while Shahrabad keeps its borderland would let the enemy impose a limited peace. The Assembly can pay Shahrabad its price, seek an ally among the neighbours, or prepare the approaches to Sevir and Tabar."
 ADISCORD_SHL.111.a: "Prepare the approaches."
 ADISCORD_SHL.112.t: "Charter of the returned cisterns"
 ADISCORD_SHL.112.d: "Shahrabad offers to return both cistern districts - Sevir and Tabar - to Keyzan's rule. There is one condition: voluntary entry into the Southern Compact. Mariam Arbin brought the offer in the name of Shahrabad's city assemblies; it provides for neither a governor nor a transfer of the treasury. Keyzan keeps its independence, its own detachments and its own Assembly.\n\nThe communities' delegates remember how Shahrabad's watch entered Sevir and ask why the victor is giving up the water. The delegation's answer is simple: the cisterns water more than Keyzan, and the Southern Compact wants water shared by assemblies, not garrisons. A road reconstruction programme paid by Shahrabad may follow the military agreement; it still has to be chosen and funded separately.\n\nRefusal leaves the present peace border: the cisterns with Shahrabad, the communities apart. Acceptance returns the land only if Shahrabad's government is still ready to honour the compact at the moment of signing."
 ADISCORD_SHL.112.a: "Recover the land and sign the compact."
 ADISCORD_SHL.112.b: "Keep the existing peace in force."
 ADISCORD_SHL.113.t: "The second barrier comes down"
 ADISCORD_SHL.113.d: "Two caravans met on the Keyzan road. The first carried Arman Teymur's watch home; the second carried Leyla Nadiri's clerks, who had to re-check the land books of Sevir and Tabar. The cisterns are back with Keyzan; another independent country has appeared on the map of the Southern Compact, and Mariam Arbin signed the charter beside the communities' delegates, who a year ago counted Shahrabad's metal as payment for their water.\n\nBehruz Veyran did not come to the signing: the border house gave up the cisterns without a word, but remembered who gave them up. Golshan Loran asked what the water Shahrabad returned had cost it. Samira Hadi answered before the delegates: the infirmary in Tabar stays, and it treats both sides.\n\nNow the Conclave must decide what stands behind the signature. Paid road reconstruction and, for the commune, the transfer of arms to neighbouring communities will turn a military agreement into an everyday bond. These works must be answered for with Shahrabad's own treasury, and Leyla Nadiri has already opened the ledger."
 ADISCORD_SHL.113.a: "Open the reconstruction ledger."
 ADISCORD_SHL.114.t: "The signatures did not meet"
 ADISCORD_SHL.114.d: "The charter did not take effect: Keyzan declined the offer, or the conditions changed before the answer. No land changed hands. Sevir and Tabar stay with Shahrabad, Arman Teymur's watch at the cisterns, and the present peace keeps its borders.\n\nMariam Arbin returned from Keyzan with a letter in which the communities' delegates thank the Conclave for the honour and refuse to share water with those who took it. Golshan Loran did not hide his satisfaction: the cisterns give water, and water in the desert is a commodity. Behruz Veyran ordered the house guards to stay in Tabar. Ramin Farzan reminded the hall that the communities' refusal cancels neither the peace nor gives cause for a new war.\n\nIf both sides can meet their obligations again, the Conclave will return to negotiations. Until then the cistern districts are administered and reconstruction begun on the basis of the existing borders, and every ledger of Leyla Nadiri will count the water as Shahrabad's."
 ADISCORD_SHL.114.a: "Preserve the existing settlement."
 ADISCORD_SHL.115.t: "What remained after the campaign"
 ADISCORD_SHL.115.d: "The last ledger of the southern programme was brought to the Conclave. It carried no victory slogan: only lines of property, obligations and recipients in Leyla Nadiri's hand. Behind each line stood a choice made when the metal could become revenue, weapons or a road. Arman Teymur signed for the watch, Rauf Darban for the arsenal heats, Behruz Veyran for the border house guards who met Keyzan first.\n\n[SHLGetSouthernEpilogue]\n\nThe country met the Keyzan threat, set the terms of peace and paid for its own idea of the future. The furnaces will keep working; their fire now sustains an order that has not only a crest but obligations fulfilled. Amin Rashad filed the ledger and, as an exception, dated it."
 ADISCORD_SHL.115.a: "Close the campaign register."
 ADISCORD_SHL.73.b: "Return the cisterns for a concession."
 ADISCORD_SHL.73.c: "Offer independent Keyzan a charter."
 SHL_epilogue_house: "The houses invested the campaign’s result in trade and new production. The Conclave chose whether to hold the corridor or exchange it for concession rights. A public loan does not disappear simply because someone declares victory."
 SHL_epilogue_city: "The city assemblies gained a road paid for openly. If the charter was accepted, Keyzan remained an independent partner; if the corridor was retained, its inhabitants gained a place in the common political order."
 SHL_epilogue_directorate: "The Directorate tied military command to a new arsenal. It preferred to retain acquired land; after a less favourable peace, production was rebuilt at home. Its orders now have an industrial foundation."
 SHL_epilogue_regent: "The Regency paid for house-guard training and the restoration of an operating furnace. Its vote rests on a working shift again; unpaid wartime obligations remain in the ledger. Privilege now carries both representation and a duty of service."
 SHL_epilogue_commune: "The Commune paid for a local levy with its own recruits and weapons. The region’s owner received it: our own districts, or independent Keyzan communities after the charter. Solidarity gained the weight of actual formations and a completed road."
