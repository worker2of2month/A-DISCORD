 # Focuses
 SHL_quarter_listening: "Listen to the Quarters"
 SHL_quarter_listening_desc: "The working quarters know more about the furnaces than the Conclave halls do. Nur opens a reception for shift delegates before their complaints turn into demands."
 SHL_heralds_table: "Table of Crests"
 SHL_heralds_table_desc: "The houses are used to settling disputes behind closed doors. A common table makes their grievances visible and lets us defuse them before an ultimatum."
 SHL_shift_arbitration: "Shift Arbitration"
 SHL_shift_arbitration_desc: "A standing commission of masters and managers settles shift disputes before they leave the factory gates."
 SHL_factory_militia: "Furnace Guard"
 SHL_factory_militia_desc: "The station guard can become the core of an army if the furnaces pay for rifles and the cities provide men."
 SHL_southern_watch: "Southern Watch"
 SHL_southern_watch_desc: "Mazar's Chamber of the Common Ration counts other people's metal as part of the common ration. The Shahrabad District must meet its detachments from prepared positions."
 SHL_mobilise_furnaces: "Mobilise the Furnaces"
 SHL_mobilise_furnaces_desc: "Every furnace receives a war order that can be filled without stopping the civilian shift."
 SHL_water_question: "The Water Question"
 SHL_water_question_desc: "The furnaces of Arbin, Safir and Loran drink water from Keyzan's qanats. We will raise the water question ourselves before the communes raise it by closing the conduits."
 SHL_qanat_guard: "Conduit Guard"
 SHL_qanat_guard_desc: "If talks do not bring water, the head wells on the border will have to come under Shahrabad's guard."
 SHL_veyr_duties: "Veyr Duties"
 SHL_veyr_duties_desc: "The Veyr trade chamber levies a duty on every wagon of metal heading to the sea. We will open this dispute and prepare our own harbour."
 SHL_veyr_ultimatum: "Ultimatum to the Chamber"
 SHL_veyr_ultimatum_desc: "The Kassen mines and the road through Noran give Veyr power over our revenue. If the chamber does not yield, Shahrabad will take them."
 SHL_golden_gate_cartel: "Golden Gate Cartel"
 SHL_golden_gate_cartel_desc: "The ten houses agree on common export prices. The Conclave becomes not only an assembly of owners but a common trading house."
 SHL_house_guards: "House Guards"
 SHL_house_guards_desc: "Each house fields a guard for its furnaces. Under a common command these detachments become an army paid for by the owners themselves."
 SHL_veyr_partnership: "Trade Union with Veyr"
 SHL_veyr_partnership_desc: "Veyr needs our metal as much as we need its quays. The cartel will offer the chamber a share of exports instead of the duty."
 SHL_conclave_of_ten: "Conclave of Ten"
 SHL_conclave_of_ten_desc: "The tenth house has taken its seat, the cartel trades for all, and the Golden Gates are open to partners willing to defend a common market."
 SHL_council_of_cities: "Council of Cities"
 SHL_council_of_cities_desc: "The self-governing cities receive a standing council beside the Conclave. The quarters see their representatives in the hall of decisions for the first time."
 SHL_fire_and_water: "Fire and Water"
 SHL_fire_and_water_desc: "Keyzan's communes and Shahrabad's cities are both governed by assemblies. We will propose sharing water and metal under a common agreement, without quotas or force."
 SHL_workers_brigades: "Workers' Brigades"
 SHL_workers_brigades_desc: "The cities recruit brigades from the shifts themselves. Their weapons are bought with furnace revenue and their commanders are elected by the workshops."
 SHL_southern_compact: "Southern Compact"
 SHL_southern_compact_desc: "The open Conclave and the union of canal communes can protect each other from the Chamber of the Common Ration if they agree to a common compact."
 SHL_war_directorate: "War Directorate"
 SHL_war_directorate_desc: "Nur's directorate manages the furnaces as a single arsenal. The first state production line will make weapons."
 SHL_right_to_water: "Right to Water"
 SHL_right_to_water_desc: "State furnaces need guaranteed water. The directorate declares the head qanats on the border part of Shahrabad's industrial system."
 SHL_key_to_sea: "Key to the Sea"
 SHL_key_to_sea_desc: "Without Tirva and the Veyr District any agreement with the chamber can be undone by a single duty. The directorate demands the whole road to the sea."
 SHL_iron_shahrabad: "Iron Shahrabad"
 SHL_iron_shahrabad_desc: "Furnaces must no longer stop at another government's decision about water or quays. The directorate guarantees working supplies through treaties, its own construction or military victory. Its strength is measured in operating workshops and weapons in storage."
 SHL_regency_council: "Regency Council"
 SHL_regency_council_desc: "Darius Safir rules on behalf of the nine crests. The regency's first decisions must show that the houses are united."
 SHL_restore_privileges: "Restore the Privileges"
 SHL_restore_privileges_desc: "Every main furnace returns to its hereditary house. City commissions are dissolved and cold enterprises go back to their former owners."
 SHL_private_armies: "Private Guards"
 SHL_private_armies_desc: "The houses no longer ask the treasury for protection. Each family keeps its own detachment and the regent brings them into one line."
 SHL_debt_shifts: "Debt Shifts"
 SHL_debt_shifts_desc: "The regency pays for its promises with the future shifts of the working quarters."
 SHL_hereditary_republic: "Hereditary Republic"
 SHL_hereditary_republic_desc: "The Conclave becomes a republic of crests: the law of continuous fire now protects the houses' right to the city, not the city."
 SHL_shift_councils: "Shift Councils"
 SHL_shift_councils_desc: "The strike committees become the government. Every furnace elects delegates, and the Shift Council replaces the Conclave."
 SHL_furnaces_to_workers: "Furnaces to the Workers"
 SHL_furnaces_to_workers_desc: "Hereditary rights are abolished. Every main furnace belongs to the city whose people keep its fire."
 SHL_common_smelting: "Common Smelting"
 SHL_common_smelting_desc: "The shifts decide for themselves when to work beyond the norm. An overtime smelt no longer means someone else's order."
 SHL_qanat_brotherhood: "Qanat Brotherhood"
 SHL_qanat_brotherhood_desc: "The commune of fire reaches out to the union of canal communes: water and metal must belong to those who produce them."
 SHL_commune_of_fire: "Commune of Fire"
 SHL_commune_of_fire_desc: "Shahrabad without crests and without a regent. The furnaces burn for the cities, and defence rests on elected brigades and allies."
 # Spirits
 SHL_martial_law: "Martial Law"
 SHL_martial_law_desc: "The factory guard patrols the quarters. The shifts report for work, but the Conclave loses trust."
 SHL_broken_conclave: "Broken Conclave"
 SHL_broken_conclave_desc: "Nur kept power, but half of the crests refuse to sign his decisions."
 SHL_captured_qanats: "Captured Qanats"
 SHL_captured_qanats_desc: "The head wells on the border serve Shahrabad's furnaces. Keyzan's communes remember how they were taken."
 SHL_veyr_bondage: "Veyr Bondage"
 SHL_veyr_bondage_desc: "Defeat at the port forces Shahrabad to pay the Veyr chamber at its own rates."
 SHL_mazar_ration: "Mazar's Ration"
 SHL_mazar_ration_desc: "The Chamber of the Common Ration took part of the treasury and demands metal for its stewards."
 SHL_victory_over_ration: "Victory over the Ration"
 SHL_victory_over_ration_desc: "Mazar's detachments have withdrawn behind their border, and Shahrabad has gained Resan and Sekhvan."
 # Characters, traits, parties, alliances
 SHL_Darius_Safir: "Darius Safir"
 SHL_Darius_Safir_desc: "Head of House Safir and the richest of the nine crests. He calls the regency temporary, yet his first act returned every furnace to the houses."
 SHL_Shift_Councils: "Shift Council"
 SHL_Shift_Councils_desc: "Elected delegates of every main furnace. The council has no permanent chair; its decisions are signed by the master on duty."
 SHL_regent_of_the_crests: "Regent of the Crests"
 SHL_regent_of_the_crests_desc: "Rules on behalf of the houses and in their interest."
 SHL_voice_of_the_shifts: "Voice of the Shifts"
 SHL_voice_of_the_shifts_desc: "Power that can be recalled at the next workshop meeting."
 SHL_anarchism: "Shahrabad Commune"
 SHL_anarchism_DEF: "Shahrabad Commune"
 SHL_anarchism_party: "Shift Councils"
 SHL_southern_compact_faction: "Southern Compact"
 SHL_golden_gate_faction: "Golden Gate Union"
 # Events
 ADISCORD_SHL.20.t: "The Cold Shift"
 ADISCORD_SHL.20.d: "The morning whistle sounded over empty checkpoints. The shifts came to the gates but did not enter the workshops: the strike committee left one stoker at each furnace so the masonry would not cool, and posted its demands on the gates of the Conclave.\n\nThe demands are simple: pay for overtime, days off after overtime shifts and the right to know where the revenue goes. The houses want the guard sent in. The masters ask for money and time. While the fires are kept low, every furnace produces less metal."
 ADISCORD_SHL.20.a: "Pay the demands from the treasury."
 ADISCORD_SHL.20.b: "Wait and negotiate."
 ADISCORD_SHL.20.c: "Send in the railway guard."
 ADISCORD_SHL.21.t: "The Shift Councils Demand Power"
 ADISCORD_SHL.21.d: "The strike is no longer about money. The committees of all main furnaces met in one workshop and declared themselves the Shift Council. They do not ask for Nur's resignation: they announce that the Conclave is no longer needed.\n\nThe cities back the councils; the houses ready their guards. Nur has two answers left. Recognising the councils hands the furnaces to those who keep their fire. Martial law keeps the Conclave, at the cost of the quarters' trust."
 ADISCORD_SHL.21.a: "Recognise the Shift Council."
 ADISCORD_SHL.21.b: "Declare martial law."
 ADISCORD_SHL.22.t: "The Shift Returns"
 ADISCORD_SHL.22.d: "The stokers have raised the fires to working temperature again. The committee is not dissolved, but its delegates are back at the furnaces and the list of demands has come down from the Conclave gates. For the first time, the next cycle's ledger records how many shifts were paid beyond the norm."
 ADISCORD_SHL.22.a: "The furnaces are working again."
 ADISCORD_SHL.30.t: "Ultimatum of the Crests"
 ADISCORD_SHL.30.d: "The attorneys of the nine houses brought a joint letter to the Conclave. They demand the return of hereditary rights, the abolition of city commissions and a guarantee that no furnace will pass to the state without its house's consent.\n\nThe letter bears signatures rarely seen side by side. If the houses have come to terms with one another, they have enough guards and money to rule without a mediator."
 ADISCORD_SHL.30.a: "Give the houses guarantees."
 ADISCORD_SHL.30.b: "Withstand the pressure."
 ADISCORD_SHL.30.c: "Arrest the ringleaders."
 ADISCORD_SHL.31.t: "Night of the Crests"
 ADISCORD_SHL.31.d: "At night the house guards seized the bridges and the telegraph. In the morning Darius Safir entered the Conclave hall with the decision of the nine crests: Nur remains mediator in name only, and a regency council takes power over the furnaces, the treasury and the guard.\n\nPart of the city guard is still loyal to Nur. Resistance will keep the Conclave, but split it for a long time."
 ADISCORD_SHL.31.a: "Yield to the regency."
 ADISCORD_SHL.31.b: "Resist."
 ADISCORD_SHL.32.t: "A Letter Without Signatures"
 ADISCORD_SHL.32.d: "The joint ultimatum has fallen apart. Each house received its own promise, and within a week the attorneys were arguing with each other louder than with Nur. The letter stays in the Conclave archive with no new signatures."
 ADISCORD_SHL.32.a: "The crests have parted ways."
 ADISCORD_SHL.40.t: "Accident at a Main Furnace"
 ADISCORD_SHL.40.d: "Worn masonry gave way during a smelt. Molten metal broke into the casting bay; the workers were brought out, but the furnace must be put out and the workshops around it rebuilt.\n\nThe house claims the masters worked beyond the norm. The masters say the house postponed repairs for years. The city waits to hear whom the Conclave will blame."
 ADISCORD_SHL.40.a: "The house is to blame."
 ADISCORD_SHL.40.b: "The masters are to blame."
 ADISCORD_SHL.40.c: "Appoint a commission."
 ADISCORD_SHL.50.t: "The Qanats Run Dry"
 ADISCORD_SHL.50.d: "The Keyzan communes have closed the side channels of the qanats that fed the furnaces of Arbin, Safir and Loran. Their assembly states that Shahrabad's furnaces drink the water the communes use for their fields, and nobody pays for it.\n\nWithout cooling the masonry ages faster. We can agree on a quota, drill our own wells or take the head wells by force."
 ADISCORD_SHL.50.a: "The water dispute must be settled."
 ADISCORD_SHL.52.t: "Shahrabad Offers Water for Metal"
 ADISCORD_SHL.52.d: "Envoys of the Conclave offer the communes metal for their conduits and a regular share of furnace revenue. In return Shahrabad asks for the qanat channels to Arbin, Safir and Loran to be reopened."
 ADISCORD_SHL.52.a: "Accept the treaty."
 ADISCORD_SHL.52.b: "Refuse."
 ADISCORD_SHL.53.t: "Keyzan Agrees"
 ADISCORD_SHL.53.d: "The assembly of canal communes has accepted the offer. The qanat channels are open again and the furnaces on the western border receive water."
 ADISCORD_SHL.53.a: "The water is back."
 ADISCORD_SHL.54.t: "Keyzan Refuses"
 ADISCORD_SHL.54.d: "The assembly of canal communes has rejected Shahrabad's offer, or the agreement cannot be carried out: there is not enough money, or the two sides are already at war."
 ADISCORD_SHL.54.a: "Look for another way."
 ADISCORD_SHL.55.t: "Qanat Brotherhood"
 ADISCORD_SHL.55.d: "Shahrabad's cities offer the communes a common agreement: water and metal shared by assemblies, without quotas or guards at the wells. If it is accepted, the water dispute ends."
 ADISCORD_SHL.55.a: "Accept the brotherhood."
 ADISCORD_SHL.55.b: "Refuse."
 ADISCORD_SHL.56.t: "Armistice at the Conduits"
 ADISCORD_SHL.56.d: "The fighting over the wells has dragged on. Both sides are exhausted, and the elders of the communes propose an armistice on the old border. The water dispute remains unresolved."
 ADISCORD_SHL.56.a: "Agree to the armistice."
 ADISCORD_SHL.57.t: "The Qanats Under Shahrabad's Guard"
 ADISCORD_SHL.57.d: "The Keyzan communes have conceded defeat. Sevir, Tabar, Narvan and Ormis pass to Shahrabad, and factory guards watch over the head wells."
 ADISCORD_SHL.57.a: "The water belongs to the furnaces."
 ADISCORD_SHL.58.t: "Defeat at the Conduits"
 ADISCORD_SHL.58.d: "Shahrabad could not hold the front. The communes have occupied Arbin and set a condition: the other furnaces receive water only under a quota."
 ADISCORD_SHL.58.a: "Accept the terms."
 ADISCORD_SHL.60.t: "The Veyr Duty"
 ADISCORD_SHL.60.d: "The Veyr trade chamber has announced a new duty on metal passing through its ports. Every wagon of rolled steel now goes over the chamber's scales.\n\nThe duty is small for a single shipment, but it cuts into every furnace's revenue. It can be bypassed with our own harbour, lifted by agreement or removed by force."
 ADISCORD_SHL.60.a: "The duty must be dealt with."
 ADISCORD_SHL.61.t: "Shahrabad Proposes a Trade Union"
 ADISCORD_SHL.61.d: "The Golden Gate cartel offers the Veyr chamber a share of metal exports instead of the duty. The ports gain a steady flow of cargo and Shahrabad a free road to the sea."
 ADISCORD_SHL.61.a: "Accept the union."
 ADISCORD_SHL.61.b: "Refuse."
 ADISCORD_SHL.62.t: "Veyr Accepts the Union"
 ADISCORD_SHL.62.d: "The chamber has lifted the duty on Shahrabad's metal. Its attorneys now sit at the cartel's table."
 ADISCORD_SHL.62.a: "The road to the sea is open."
 ADISCORD_SHL.63.t: "Veyr Refuses"
 ADISCORD_SHL.63.d: "The Veyr chamber has rejected Shahrabad's offer, or the agreement is impossible because the two sides are at war."
 ADISCORD_SHL.63.a: "Look for another way."
 ADISCORD_SHL.65.t: "Armistice at the Port"
 ADISCORD_SHL.65.d: "The war for the road to the sea has brought no decisive victory. The chamber proposes an armistice on the old borders; the duty remains."
 ADISCORD_SHL.65.a: "Agree to the armistice."
 ADISCORD_SHL.66.t: "The Road to the Sea"
 ADISCORD_SHL.66.d: "Veyr has conceded defeat. The Kassen mines and the road through Noran pass to Shahrabad, and the chamber's duty no longer applies."
 ADISCORD_SHL.66.a: "The metal will reach the sea."
 ADISCORD_SHL.67.t: "Defeat at the Port"
 ADISCORD_SHL.67.d: "Shahrabad could not hold the front. The chamber takes Salik and imposes its own rates on metal exports."
 ADISCORD_SHL.67.a: "Accept the terms."
 ADISCORD_SHL.70.t: "Mazar's Ration"
 ADISCORD_SHL.70.d: "An envoy of the Chamber of the Common Ration has arrived with a calculation: Shahrabad's metal is needed by Mazar's reservoirs, and the chamber counts it as part of the common ration. Mazar demands payment and points out that the Shahrabad District lies on its border.\n\nWe can pay. We can refuse and prepare for war: the chamber will give us 60 days."
 ADISCORD_SHL.70.a: "Pay the ration."
 ADISCORD_SHL.70.b: "Refuse Mazar."
 ADISCORD_SHL.71.t: "Mazar Marches"
 ADISCORD_SHL.71.d: "The ultimatum has expired. Mazar's detachments have crossed into the Shahrabad District. The chamber announces it will collect its ration itself."
 ADISCORD_SHL.71.a: "To arms."
 ADISCORD_SHL.72.t: "Armistice with Mazar"
 ADISCORD_SHL.72.d: "Mazar's offensive has run out of strength, and Shahrabad could not throw it back. The chamber agrees to an armistice on the old border and withdraws its demand."
 ADISCORD_SHL.72.a: "Agree to the armistice."
 ADISCORD_SHL.73.t: "Mazar Defeated"
 ADISCORD_SHL.73.d: "The Chamber of the Common Ration has conceded defeat. Resan and Sekhvan pass to Shahrabad and the ration demands are withdrawn."
 ADISCORD_SHL.73.a: "Shahrabad has held."
 ADISCORD_SHL.74.t: "The Ration Taken by Force"
 ADISCORD_SHL.74.d: "Shahrabad has capitulated. Mazar does not take the furnaces, but its stewards carry off two fifths of the treasury and stay behind to oversee payments."
 ADISCORD_SHL.74.a: "The furnaces keep working."
 ADISCORD_SHL.75.t: "Mazar Demands Again"
 ADISCORD_SHL.75.d: "The Chamber of the Common Ration has returned. It calls the earlier payment a deposit and now demands a final ration of 400. After that Mazar promises to close the matter for good."
 ADISCORD_SHL.75.a: "Pay in full."
 ADISCORD_SHL.75.b: "Refuse Mazar."
 ADISCORD_SHL.90.t: "Southern Compact"
 ADISCORD_SHL.90.d: "Shahrabad offers the Keyzan communes an alliance: common defence against Mazar and a common council on water and metal."
 ADISCORD_SHL.90.a: "Join the compact."
 ADISCORD_SHL.90.b: "Refuse."
 ADISCORD_SHL.91.t: "Golden Gate Union"
 ADISCORD_SHL.91.d: "Shahrabad's cartel invites the Veyr chamber to join its union: the common market will be protected by a common army."
 ADISCORD_SHL.91.a: "Join the union."
 ADISCORD_SHL.91.b: "Refuse."
 ADISCORD_SHL.92.t: "Alliance Concluded"
 ADISCORD_SHL.92.d: "Shahrabad's invitation has been accepted. The new ally will defend the common borders."
 ADISCORD_SHL.92.a: "Good."
 ADISCORD_SHL.93.t: "Alliance Declined"
 ADISCORD_SHL.93.d: "Shahrabad's invitation has been declined, or the alliance is no longer possible."
 ADISCORD_SHL.93.a: "Understood."
