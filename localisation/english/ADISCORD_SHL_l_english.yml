 SHL_conclave_industry: "Continuous Industry"
 SHL_conclave_industry_desc: "Industrial contribution follows operating furnaces under Shahrabad's control. Before political reform, each active house vote supports political power gain. Changing ownership does not replace repairs and supplies."
