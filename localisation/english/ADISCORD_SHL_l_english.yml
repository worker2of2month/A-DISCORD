 ADISCORD_SHL.2.t: "While the Fire Burns"
 ADISCORD_SHL.2.d: "Nine coats of arms hang above Jalil Nur's chair in the Conclave. Each marks a house, but ancestry alone does not secure the seat below it: that house's main furnace must keep burning outside the city walls. The Law of Continuous Fire was written when owners could abandon an enterprise and leave its people without a livelihood. Today it shields them from the question of who owns the city.\n\nNur has received a common ledger. It lists no ceremonial anniversaries, only stocks, damaged brickwork and the people due on the next shift. In twenty-eight days the Conclave will see the first production result. Until then, the furnaces need supplies and their old masters need the freedom to report defects."
 ADISCORD_SHL.2.a: "Open the ledger of nine furnaces."
 ADISCORD_SHL.3.t: "The Train Never Arrived"
 ADISCORD_SHL.3.d: "Empty carts stand on the loading apron. The manager proposes using whatever remains in the bunkers; the shift master refuses to record an empty store as a completed delivery. For the first time the common ledger reveals downtime that the houses used to conceal in celebratory reports.\n\nOne unsupplied period can still be survived. A second consecutive failure extinguishes the main furnace. A manual delivery takes seven days, reserves help immediately, and scheduled transport can buy missing materials before future shifts."
 ADISCORD_SHL.3.a: "Check the stocks and arrange supplies."
 ADISCORD_SHL.4.t: "An Extinguished Emblem"
 ADISCORD_SHL.4.d: "Smoke has vanished over one factory city. The furnace has not been destroyed: its brickwork and workshops remain, and workers still gather at the gates. In the Conclave, however, the right to occupy the seat below its house's emblem is now disputed.\n\nThe city administration has produced an old article of law. When the main furnace went out, ownership returned to the city. The house offers to restore production in exchange for its rights; the masters demand that the new owner remain. Nur must settle ownership before the country pays to restart the furnace."
 ADISCORD_SHL.4.a: "Settle ownership and restart terms."
 ADISCORD_SHL.5.t: "The First Pour"
 ADISCORD_SHL.5.d: "The new complex started without a hereditary emblem above its gates. Masters from different cities formed the first shift, and the partnership signed its supply ledger. When metal flowed into the moulds, the argument over whether a tenth furnace could be built ended. The argument over its rights remained.\n\nThe old houses are prepared to recognise its owner as one of their own. City delegates demand that the Conclave open to every independent industrial community. Nur proposes a unified directorate. Each choice lets the furnace keep working; each gives a different answer to who owns the new power."
 ADISCORD_SHL.5.a: "The tenth furnace's delegates will enter the hall."
 ADISCORD_SHL.6.t: "The Price of Transport Access"
 ADISCORD_SHL.6.d: "The line owners have sent a joint contract: heavy equipment may reach the new complex once access has been agreed. The price is small beside the whole construction budget, but signing recognises the old houses' right to sell permission for each new enterprise.\n\nNur can pay for access or wait for an independent transport service. Engineering and site preparation continue either way. If independent transport already exists, an open letter cannot revoke the completed policy."
 ADISCORD_SHL.6.a: "Continue preparing independent transport."
 ADISCORD_SHL.6.b: "Pay for line access."
 ADISCORD_SHL.7.t: "Whose Masters?"
 ADISCORD_SHL.7.d: "The old houses recognise the engineering calculations but refuse to treat the masters as free members of the new partnership. Their letter ties experienced shifts' transfer to the industrial site to a separate agreement. The design already exists; no one may charge again for completed drawings.\n\nThe partnership can pay for an agreement or train its own people through the School of Masters. Site preparation waits until the dispute is settled. If the school is already operating, an open letter cannot change its authority."
 ADISCORD_SHL.7.a: "We shall train our own masters."
 ADISCORD_SHL.7.b: "Agree the specialists' transfer."
 ADISCORD_SHL.8.t: "A Special Reserve Price"
 ADISCORD_SHL.8.d: "Suppliers will recognise the common emergency reserve, but call it an exceptional purchase and demand a surcharge on the next order. Each house used to receive the usual price separately. The common ledger turns nine customary contracts into a public dispute for the first time.\n\nNur can spend political influence on an agreement, accept the surcharge on one purchase, or organise transport through the Houses' Railway. Paid deliveries retain their quoted price. An operating transport service will not surrender its authority to a delayed letter."
 ADISCORD_SHL.8.a: "The next order can bear the surcharge."
 ADISCORD_SHL.8.b: "Agree the previous price."
