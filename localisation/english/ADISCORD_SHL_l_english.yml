 SHL_kyz_brotherhood_available_tt: "Keyzan exists, is not at war with Shahrabad and is not considering another offer"
 SHL_kyz_brotherhood_offer_tt: "Keyzan receives a qanat brotherhood offer. If it accepts, the water dispute ends without a quota."
 SHL_workers_brigades_tt: "The cities field §Y2§! furnace guard divisions in Shahrabad. Quarter unrest: §G-5§!."
 SHL_southern_compact_offer_tt: "Keyzan receives an invitation to the Southern Compact."
 SHL_key_to_sea_tt: "The ultimatum to Veyr will include Tirva and the Veyr District."
 SHL_restore_privileges_tt: "All of Shahrabad's furnaces return to the houses; cold ones are ready for a paid restart. Crest pressure: §G-20§!. Quarter unrest: §R+10§!."
 SHL_private_armies_tt: "The houses field §Y3§! furnace guard divisions in Shahrabad. Quarter unrest: §R+5§!."
 SHL_hereditary_republic_tt: "Crest pressure: §G-20§!."
 SHL_furnaces_to_workers_tt: "All of Shahrabad's furnaces pass to the cities; cold ones are ready for a paid restart. Quarter unrest: §G-20§!. Civic support: §G+15§!."
