 ADISCORD_SHL_junior_partner: "Junior Partner of Shahrabad"
 ADISCORD_SHL.140.t: "A Demand at the Furnace"
 ADISCORD_SHL.140.d: "The delegation arrived in Khazar unannounced: [SHLGetDemandHouse]. The furnace runs, but the brickwork stands on props, wear has reached §Y[?SHL_demand_wear|0]§!, and every shift ends before its time. The delegation's elder laid a ledger on the table: how much metal was short, how many people were burned, how many letters to the Conclave went unanswered.\n\nThe demand is simple. Either the Conclave pays for the repair from the common treasury, or it admits that this furnace's voice in the hall weighs more than it does now. The third way the delegation named itself: refusal. Then they will leave and wait a month and a half. If the furnace is put in order in that time, the quarrel is forgotten; if not, their head stops attending the sessions, and the Conclave will have to manage without him.\n\nJalil Nur listened in silence. He knew the ledger was right: in the book of furnaces this brickwork has been listed as the worst for more than one cycle."
 ADISCORD_SHL.140.a: "The treasury will pay for the repair."
 ADISCORD_SHL.140.b: "The Conclave does not bargain with ultimatums."
 ADISCORD_SHL.140.c: "Recognise their voice."
 ADISCORD_SHL.76.t: "A Year After the Peace"
 ADISCORD_SHL.76.d: "Exactly a year ago [SHLGetRevancheNeighbour] signed the peace that passed the border states to Shahrabad. For a year the neighbour kept silent: burying, rebuilding roads, replacing commanders. Now its envoy has brought to Khazar a paper drawn up by every rule: the ceded lands are declared inalienable, their return a matter of honour.\n\nThe envoy does not threaten. He proposes a revision: Shahrabad acknowledges the neighbour's losses in money, and the paper of claims disappears from the archive. The sum is named in advance and is not negotiable. If the Conclave refuses, the claim stays on record, and every new dispute on the border will begin with it.\n\nThe hall is divided. Some hold that paying for a war already won is humiliating; others recall that the furnaces work better when the border is quiet."
 ADISCORD_SHL.76.a: "Pay for a quiet border."
 ADISCORD_SHL.76.b: "The peace is signed; there is nothing to revise."
# ----- Metal contracts and oil price -----
 SHL_packet_price_base: ""
 SHL_packet_price_contract: "\nRaw-material price reduced: Svetlogorye oil contract."
 SHL_packet_price_embargo: "\nRaw-material price raised: Svetlogorye embargo."
 SHL_metal_contract_offer: "Offer a metal contract"
 SHL_metal_contract_offer_desc: "The cartel of the Golden Gates is looking for buyers for the surplus of its furnaces. The Conclave's envoy carries a draft: Shahrabad undertakes to ship metal from one of its furnaces every four weeks, the buyer to pay on time. The contract holds while the parties are at peace and the buyer pays."
 SHL_metal_export_free_tt: "At least one working furnace is free of orders and obligations"
 SHL_metal_clients_limit_tt: "Fewer than §Y3§! active metal contracts"
 SHL_metal_offer_tt: "[From.GetNameDefCap] receives the offer and answers within §Y40§! days. After signing, the buyer pays §Y60§! £ADISCORD_economy_treasury_texticon every §Y28§! days and gains §G+2%§! production efficiency growth."
 SHL_metal_contract_end: "End the metal contract"
 SHL_metal_contract_end_desc: "The Conclave withdraws the cartel's obligation to this buyer. Shipments stop from the next cycle; payments already received stay in the treasury."
 SHL_metal_end_tt: "[From.GetNameDefCap] loses Shahrabad's metal: the payments of §Y60§! £ADISCORD_economy_treasury_texticon per cycle stop."
 SHL_metal_accept_tt: "Every §Y28§! days: §R-60§! £ADISCORD_economy_treasury_texticon to Shahrabad. While the contract holds: §G+2%§! production efficiency growth."
 SHL_metal_decline_tt: "Shahrabad receives the refusal."
 SHL_metal_supply: "Shahrabad Metal"
 SHL_metal_supply_desc: "The furnaces of the Golden Gates ship metal under a contract with the Conclave. Deliveries continue while the buyer pays every cycle and the parties are at peace."
 ADISCORD_SHL.130.t: "Metal of the Golden Gates"
 ADISCORD_SHL.130.d: "The envoy of the Conclave of Shahrabad has brought to the capital a draft agreement sealed by the cartel of the Golden Gates. The nine houses offer the metal of their furnaces: every four weeks one of them will pour steel for us, and the payment will go to Khazar.\n\nThe envoy does not bargain. The price is the same for every buyer, and the Conclave has few houses willing to ship metal to a foreign country. He reminds us that the furnaces of Shahrabad have burned without pause for generations, and that none of them has yet failed a customer who paid on time.\n\nThe ministries see it differently: Shahrabad's steel will ease the setting up of new lines in the factories, but it will tie part of the treasury to a city whose houses are used to trading with friends and enemies alike."
 ADISCORD_SHL.130.a: "Sign the contract."
 ADISCORD_SHL.130.b: "Our own metal will do."
 ADISCORD_SHL.131.t: "The Contract Is Signed"
 ADISCORD_SHL.131.d: "[From.GetNameDefCap] accepts the cartel's terms. In Khazar the Conclave's envoy sets the second seal, and the scribes of the Golden Gates enter a new line in the book of shipments: one of the furnaces now pours metal for a foreign country, and its payment must arrive without reminders.\n\nThe houses are pleased. The contract gives the treasury money that depends neither on the mood of the quarters nor on the price of raw materials, and a foreign country now has a stake in keeping Shahrabad's fire alight.\n\nThe senior masters recall something else: every obligation to outsiders is a furnace that cannot be put out while the agreement lives, and a buyer who will one day consider it his own."
 ADISCORD_SHL.131.a: "Let them pour."
 ADISCORD_SHL.132.t: "The Buyer's Answer"
 ADISCORD_SHL.132.d: "[From.GetNameDefCap] declines the contract. The envoy returns to Khazar with the agreement unopened: the foreign ministries preferred not to tie their factories to metal that comes from beyond the desert and depends on the calm of someone else's quarters.\n\nThe cartel takes the refusal without offence. The furnaces are working, the market of the South is wide, and the Golden Gates will open again to whoever comes to them on his own."
 ADISCORD_SHL.132.d_lapsed: "[From.GetNameDefCap] agrees to the contract, but by the time of signing the cartel has no free furnace left: orders, obligations and other agreements have claimed everything that burns. The envoy apologises and promises to return to the matter when one of the furnaces is free.\n\nIn Khazar the argument is short. The Conclave will not promise metal it does not have: the cartel's word is worth more than a single contract."
 ADISCORD_SHL.132.a: "Noted."
 ADISCORD_SHL.133.t: "The Contract Is Over"
 ADISCORD_SHL.133.d: "[From.GetNameDefCap] has failed to pay for the metal of the Golden Gates for the second cycle in a row. The cartel's scribes close the line in the book of shipments, and the furnace that worked for a foreign country returns to its ordinary revenue.\n\nThe Conclave demands no compensation. Shahrabad has long known that metal nobody pays for is better kept at home, and a buyer who does not pay is better not sought."
 ADISCORD_SHL.133.d_war: "[From.GetNameDefCap] is now at war with Shahrabad, and the metal contract is torn up. The furnace that poured steel for a foreign country returns to its ordinary revenue; the cartel's accounts are closed without settlement.\n\nNeither side calls it a betrayal. The metal of the Golden Gates has always followed trade rather than alliances, and the trade ended together with the peace. The furnace that worked for this buyer now serves the market of the South or Shahrabad's own arsenals."
 ADISCORD_SHL.133.a: "So it shall be recorded."

# ----- Life of the furnaces -----
 ADISCORD_shl_life.1.t: "Conclave Archive: The Census of Nine"
 ADISCORD_shl_life.1.d: "Leila Nadiri's clerks left Khazar at dawn and in twenty days walked all nine furnaces, from the qanats of Arbin to the outposts of Veyran. At each they did the same thing: counted the masonry, the packets of raw material in the stores and the people of the next shift, then asked the master on duty to sign the sheet. In Safir they were given dinner and kept away from the store; in Sharim, Shirin Sharim walked them through the bays herself and showed them the infirmary, but the shift refused to name the unregistered. In Bayrat, Tahmuras opened the book of debts and asked whether the ledger would record which houses had not paid for ore in three cycles.\n\nThe result reached the Conclave's table as one table. Nine furnaces, nine columns, and for the first time it is plain that Nuran is the most worn and that Sharim keeps two shifts where Loran keeps one. Amin Rashad set his seal without waiting for the crests to object. The census changed no law, but from that day every argument in the hall begins with the question of what the column says."
 ADISCORD_shl_life.1.a: "File it with the ledger."
 ADISCORD_shl_life.2.t: "Conclave Archive: The Examination at Sharim"
 ADISCORD_shl_life.2.d: "The school of masters held its first examination in Sharim, in the old bay of the seventh furnace, where the shifts are the hardest and mistakes show at once. Three examiners sat: a house master sent by Shirin Sharim, an old stoker from the shift council and a Conclave clerk with a blank sheet. The candidate had to name the temperature by the colour of the flame, find the crack by the sound of the masonry, and say when a furnace must be stopped even if the house orders it to keep pouring.\n\nThe last question caused an argument. The house master held that the candidate must answer \"never\"; the stoker held that he must name the signs at which the fire will kill the shift. The clerk wrote down both answers and noted that the Law of Continuous Fire forbids neither. Of twelve candidates, nine passed. Three stayed for a second term at the furnace, and Salima Darzi entered their names in the shift journal on a separate line: for the first time the Conclave had admitted that a master can be made, not only born."
 ADISCORD_shl_life.2.a: "The class has graduated."
 ADISCORD_shl_life.3.t: "Conclave Archive: Tahmuras Bayrat's Shaft"
 ADISCORD_shl_life.3.d: "Tahmuras Bayrat went down the new shaft first, as he always does, and came up four hours later with a sack of rock that he emptied himself onto the Conclave's table in Khazar. The ore was good. Bayrat said so briefly and added what he had come for: the shaft had struck a vein enough for all nine furnaces, and the house wished to know who would pay for it on time and who would ask for credit again.\n\nSecretary Amin Rashad entered the question in the ledger. Khosrow Arbin reminded the hall that his furnaces had always paid; Darius Safir said nothing, and everyone noticed the silence. Tahmuras did not wait for an answer. Bayrat's miners live in barracks at the pithead, where winter is cold and in summer cistern water costs more than ore, and the house means to build them a settlement if the revenue comes without delays. The Conclave entered the mine in the industrial ledger as the common asset of the nine furnaces. Bayrat accepted the wording and asked for one more line: the asset of nine, the debts of each."
 ADISCORD_shl_life.3.a: "Enter the line."
 ADISCORD_shl_life.4.t: "Conclave Archive: The First Train across the Salt Flats"
 ADISCORD_shl_life.4.d: "The first train on the houses' railway left Safir at night so as to cross the salt flats by dawn, before the salt grew hot. Fereydun Kerdan rode on the footplate; the driver came from Bayrat's ore convoys, the fireman from a Sharim shift, and none of them had taken a train along this embankment before. Beyond Safir the track runs across a white plain with no landmark but the numbered posts, and at the thirtieth post the train stopped: the salt had sunk under the sleepers, and the crew spent two hours tamping the embankment by lantern light.\n\nThe train reached Bayrat by noon. Tahmuras met it in the mine yard, counted the wagons and ordered loading at once, without waiting for papers. On the way back it carried ore for three furnaces and a letter from Kerdan to the Conclave: the embankment must be raised and linemen posted on the salt flats, or the houses' railway will be a railway until the first wind. Leila Nadiri entered the letter in the next cycle's ledger and wrote beside it the price of the convoy that no longer has to be paid."
 ADISCORD_shl_life.4.a: "The line is open."
 ADISCORD_shl_life.5.t: "Conclave Archive: The Golden Gates Exchange at Dawn"
 ADISCORD_shl_life.5.d: "The exchange at the Golden Gates opens before sunrise, when the metal of the last pour is still warm. Nine tables are set under the arch, one for each house, and a tenth for the Conclave clerk who records the price of the first ingot. Golshan Loran arrives first and names the first price; the other houses bargain from it, the buyers from Kadir and Veyr wait at the gate, and by noon every ingot has found a convoy.\n\nThat day the Conclave clerk recorded the price for the first time not from Loran but from the common sheet: the Conclave had established the metal market, and the exchange now trades on behalf of all nine furnaces. Golshan took it calmly and asked only that the house's column remain on the sheet. The buyers were harder: a caravan master from Kadir could not see why an ingot from Sharim should cost the same as an ingot from Safir when the road to Sharim is longer. The clerk explained that the road was now the Conclave's business, not the buyer's. The caravan master paid, but the next week he brought twice as many camels to see whether it was true."
 ADISCORD_shl_life.5.a: "The price is recorded."
 ADISCORD_shl_life.6.t: "Conclave Archive: A Shift Journal Read Aloud"
 ADISCORD_shl_life.6.d: "In the bay of the seventh furnace the evening shift gathered not at the fire but at a table on which lay the journal of the shift council. Salima Darzi read it aloud, one entry for each cycle: who had fallen ill, how many times the furnace had run on overtime, when the masonry had last been repaired, whom the house had promised wages and when it had paid. The Conclave clerk sat to one side and wrote down what he heard. That was the Conclave's only condition: to listen and not to argue.\n\nThe reading took three hours. The shift knew half the entries by heart, but hearing them in front of a man with a seal was different: some entries reached the industrial ledger for the first time. When Salima closed the journal, an old stoker asked the clerk what the Conclave would do with what it had heard. The clerk answered honestly: enter it in the ledger, and then the houses would decide. The stoker nodded and said that was enough, if the ledger were read aloud the same way. The shift went back to the furnace; the journal stayed open on the table, and the clerk copied two more pages from it before he left."
 ADISCORD_shl_life.6.a: "Enter it in the ledger."
 ADISCORD_shl_life.7.t: "Conclave Archive: Night on the Line near Zarkhan"
 ADISCORD_shl_life.7.d: "The railway guard took up the line near Zarkhan on the first moonless night. The post stands where the houses' railway leaves the furnace district for the border, and until now there had been nobody here but a lineman with a lantern. Now a handcar stands at the siding, two men with rifles at the points, and the post commander, a former sergeant of the Veyran guard, walks the track to the twentieth post and back every two hours.\n\nIn the third hour the lineman heard footsteps on the embankment. The guard raised their lanterns; on the track stood a caravan master from Zarkhan-kala looking for water for his camels, because the cisterns at the Mazar border had been locked this year. He was given water, entered in the post journal and escorted to the road. The post commander noted in his report that the night had passed quietly, and added that the caravan master knew more about the locks on the cisterns than the Conclave does. Arman Teymur read the report in the morning and had it hung in the guard hall: the line is held not by rifles but by someone listening on it at night."
 ADISCORD_shl_life.7.a: "The night passed quietly."
 ADISCORD_shl_life.8.t: "Conclave Archive: Towers against the Cisterns of Mazar"
 ADISCORD_shl_life.8.d: "The southern watch raised its first towers on the ridge above the dry riverbed, from which the cisterns of Mazar can be seen: five stone domes at the border of the Zarkhan district, around which the Chamber of the Common Ration keeps its detachments. By day the tower sees carts approach the cisterns and Mazar's detachments change their guards; by night only fires are visible, and by their number the watch counts how many men stand at the water.\n\nBehruz Veyran came to accept the towers himself. He climbed the farthest one, looked at the domes for a long time and said that he knew every guard commander by name: the border house had traded water with them for ten years, until the Chamber declared Shahrabad's metal part of its ration. The watch commander asked whether to fire if a Mazar detachment came up to the riverbed. Veyran answered that first they must record how many there were and what they carried, and the Conclave would give the order to fire itself. Since that day the tower's report reaches Khazar every morning: the number of fires, the number of carts and one line about the wind, because the wind from the south carries sand onto the furnaces before it carries detachments."
 ADISCORD_shl_life.8.a: "Reports every morning."
 ADISCORD_shl_life.20.t: "Night Shift in Sharim"
 ADISCORD_shl_life.20.d: "The seventh furnace does not go out at night either, and in Sharim they know it by sound: when the town falls quiet, the masonry can be heard breathing. This cycle the night shift stands at the fire for the eighth time in a row, and Salima Darzi has written in the journal that people are falling asleep on their feet. Shirin Sharim sent two crates of lamp oil to the bay and nothing else; the furnace infirmary keeps its doors open until morning.\n\nThe Conclave clerk, passing at dawn, saw the shift sharing one pot of broth among twenty people and entered it in the ledger as an observation, not a complaint. The Conclave can leave the entry in the ledger or pay for a hot pot for the night shift from the treasury: a trifle for Khazar, and the first line in the shift journal where the Conclave is named without anger."
 ADISCORD_shl_life.20.a: "The ledger entry is enough."
 ADISCORD_shl_life.20.b: "Pay for a hot pot for the night shift."
 SHL_life_20_b_tt: "Treasury: §R-30§! £ADISCORD_economy_treasury_texticon. Quarter unrest: §G-2§!."
 ADISCORD_shl_life.21.t: "Bayrat's Caravan"
 ADISCORD_shl_life.21.d: "Bayrat's caravan reached Khazar with ore ahead of schedule and brought more than the furnaces had ordered: the new shaft struck a richer vein than expected, and Tahmuras would not keep rock on the dumps. The drivers unloaded at the Conclave's stores and are waiting for the houses to take the surplus. Safir is bargaining, Loran offers to take it on credit, Nuran asks for a delay until the next cycle.\n\nTahmuras sent word through the head driver that the surplus goes to whoever pays today, and if nobody pays, the caravan takes the ore back and next time the houses will receive exactly what they ordered. Leila Nadiri believes the Conclave can buy the packet into the reserve itself: the price is below the market, and the reserve will serve the first furnace whose supply fails."
 ADISCORD_shl_life.21.a: "Let the houses sort it out."
 ADISCORD_shl_life.21.b: "Buy the surplus into the Conclave's reserve."
 SHL_life_21_b_tt: "Treasury: §R-40§! £ADISCORD_economy_treasury_texticon. Raw material reserve: §G+1§! packet."
 ADISCORD_shl_life.22.t: "A Wedding in House Loran"
 ADISCORD_shl_life.22.d: "House Loran is marrying off Golshan's youngest daughter, and the Golden Gates are closed to trade for three days: tables are set under the arch and the exchange moves to the courtyard. All nine houses are invited, and all nine have come, including Tahmuras Bayrat, who has not left the mines since last winter. The groom is from Kerdan, and Fereydun has already said at the table that the road to the sea and the Golden Gates are now one family.\n\nJalil Nur sits in the mediator's seat and listens: at a wedding table the houses speak to each other as they never do in the Conclave hall. Golshan expects a gift from the Conclave, not for the thing itself but for the entry in the house book. Amin Rashad has prepared two letters: one with congratulations, the other with congratulations and a gift on behalf of all the furnaces. The difference between them is small, but all nine crests will notice it."
 ADISCORD_shl_life.22.a: "Send congratulations."
 ADISCORD_shl_life.22.b: "Send a gift on behalf of the Conclave."
 SHL_life_22_b_tt: "House pressure: §G-2§!."
 ADISCORD_shl_life.23.t: "The Fair at the Golden Gates"
 ADISCORD_shl_life.23.d: "Once a year, when the Conclave's treasury is full and the last pour is sold, a fair is set up under the arch of the Golden Gates: merchants from Kadir bring cloth, caravans from Rahma bring salt and dates, and the houses display what the exchange will not take: small forged ware, knives, lamp burners. For three days the city trades without a clerk, and the Conclave clerk comes to the fair simply to look.\n\nThis year the quarter elders asked for a row of their own: the shifts have things to sell, but the houses charge for a place under the arch, and the quarters cannot pay it. Golshan Loran does not object if the Conclave pays for the row from the treasury; then the fair would for the first time be common rather than the crests' own. The money is small and the takings will not return to the treasury, but the quarters would stand under the arch beside the houses for the first time."
 ADISCORD_shl_life.23.a: "Let them trade as they always have."
 ADISCORD_shl_life.23.b: "Pay for the quarters' row under the arch."
 SHL_life_23_b_tt: "Treasury: §R-20§! £ADISCORD_economy_treasury_texticon. Civic support: §G+2§!."
 ADISCORD_shl_life.24.t: "Qanat Water"
 ADISCORD_shl_life.24.d: "The spring water came down the qanats of Kyzan on time, and Arbin's clerks entered it in the water ledger litre by litre: how much went to the furnaces, how much to the quarters, how much was lost in the channels. This year the losses are larger than usual. The communities of Kyzan keep the head wells clean, but the channels on the Shahrabad side are silted, and the water reaches Arbin's quarters muddy and late.\n\nKhosrow Arbin holds that clearing the channels is the city's business, not the house's: the furnaces have received their water. The quarter elders hold otherwise and have already asked the Conclave clerk whom to complain to. Mariam Arbin, it is said, sent her father the water ledger with the line of losses underlined. The Conclave can pay for the channels to be cleared before the next water, or leave the matter to the house and the city, as it always has."
 ADISCORD_shl_life.24.a: "Leave it to the house and the city."
 ADISCORD_shl_life.24.b: "Pay for the channels to be cleared."
 SHL_life_24_b_tt: "Treasury: §R-25§! £ADISCORD_economy_treasury_texticon. Quarter unrest: §G-2§!."
 ADISCORD_shl_life.25.t: "Sandstorm over Veyran"
 ADISCORD_shl_life.25.d: "The storm came from the south in the middle of the cycle, and Veyran took it first: for three days no sky was visible over the ninth furnace, the house guard's posts at the border were buried to the roofs, and the houses' railway near Zarkhan had to be dug out twice. The furnace did not go out - Veyran's stokers kept the fire with the dampers closed - but the masonry needs inspection after the storm, and the guard posts stand without roofs.\n\nBehruz Veyran asks for no help: the border house is used to paying for its own border. But Arman Teymur reminds the hall that Veyran's guard posts are the first to see Mazar's detachments, and if the house rebuilds them with its own money by the next cycle, the border will be blind all that time. The Conclave can pay for the posts from the treasury. Veyran will take it not as charity but as recognition that the house's border is the border of all nine furnaces."
 ADISCORD_shl_life.25.a: "The house will manage."
 ADISCORD_shl_life.25.b: "Pay to rebuild the guard posts."
 SHL_life_25_b_tt: "Treasury: §R-30§! £ADISCORD_economy_treasury_texticon. House pressure: §G-2§!."
 ADISCORD_shl_life.26.t: "Reading by the Furnace"
 ADISCORD_shl_life.26.d: "In Nuran they read by the fourth furnace in the evenings. It was begun by an old clerk of House Nur who read the industrial ledger to the apprentices after the shift because there was no other book in the bay; now they read everything the caravans bring: newspapers from Svetlogorye, the Book of Furnaces, letters from the road to the sea. People come from the neighbouring quarters, sit on the warm masonry, and the master on duty sees that they do not get in the shift's way.\n\nKamran Nur asked the mediator whether the Conclave should intervene: the quarters listen to foreign newspapers at the lesser house's furnace, and Safir has already called it a school of strikes. Jalil Nur replied that reading by the furnace is older than the Conclave. But there is a way to take part rather than forbid: to send the Conclave's printed ledger to the bay, so that the quarters read not only foreign newspapers but also what Khazar writes about them."
 ADISCORD_shl_life.26.a: "Let them read."
 ADISCORD_shl_life.26.b: "Send the Conclave's ledger to the bay."
 SHL_life_26_b_tt: "Civic support: §G+2§!."
 ADISCORD_shl_life.27.t: "The Old Master of Darban"
 ADISCORD_shl_life.27.d: "The old master of House Darban, who laid the eighth furnace in the days of Rauf's father, came to the site of the tenth with his own rule and spent the whole day there saying nothing. In the evening he asked for the drawings, studied them by the lamp and told the engineers of the partnership that they were laying correctly, then showed three places where the masonry will crack in ten years unless the joint is changed.\n\nRauf Darban ordered it corrected. The master refused payment but agreed to dictate to the Conclave clerk everything he remembers of the eight furnaces he laid: how the stone was chosen, how the dampers were set, which furnaces went out and why. The clerk says it is the best book about furnaces he has ever taken down. The Conclave can publish the master's notes at the treasury's expense: the houses will have a book no neighbour owns, and the Conclave's name will stand on the cover beside Darban's."
 ADISCORD_shl_life.27.a: "Thank the master."
 ADISCORD_shl_life.27.b: "Publish the master's notes at the treasury's expense."
 SHL_life_27_b_tt: "Treasury: §R-20§! £ADISCORD_economy_treasury_texticon. §G+25§! £political_power_texticon."
 ADISCORD_shl_life.30.t: "The Festival of Fire"
 ADISCORD_shl_life.30.d: "On the night of the festival all nine houses lit the Golden Gates. Arbin raised the first fire: the western furnaces stand closest to the gates. Then Safir and Loran, whose torches were taller than the rest; Nur lit his from Arbin's torch, as the mediator does; Bayrat brought fire from the mines in a closed lamp; Kerdan from the road to the sea. Sharim lit last, because its shift ran until midnight, and when Sharim's torch rose above the arch the quarters shouted louder than for all the others. Darban brought fire from the site of the tenth furnace, and nobody in the crowd asked whether he had the right. Veyran lit from the fire of a border post.\n\nTables stood under the arch, and the houses ate beside the shifts. Jalil Nur made no speech. He raised a lamp in which the fire of all nine burned and set it on the Conclave clerk's table beside the industrial ledger. In the morning the gates opened for trade as usual, but the fire in the lamp was not put out: Amin Rashad ordered it kept until the next festival."
 ADISCORD_shl_life.30.a: "Let it burn."
 SHL_festival_of_fire: "Festival of Fire"
 SHL_festival_of_fire_desc: "Once a year the Conclave lights the Golden Gates with the fire of all nine furnaces. The houses bring torches from their furnaces, the shifts come out of the workshops, and for three nights the city eats and trades under the arch without asking who is entered in which register."
