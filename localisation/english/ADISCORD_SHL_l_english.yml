 SHL_mzr_flank_kyz_war: "§RKeyzan fights for Mazar. The common settlement ends its participation.§!"
 SHL_mzr_flank_glp_war: "§RVeyr fights for Mazar. The common settlement ends its participation.§!"
 ADISCORD_SHL.124.t: "Another Edge of War"
 ADISCORD_SHL.124.d: "[FROM.GetName] is negotiating with the Chamber of the Common Ration. After our attempt to settle the border dispute by arms, the promise of Mazar's protection found attentive listeners, and Bahram Kaveh confirms that the chamber's envoys have twice passed through the neighbouring capital. No treaty is signed yet, but Arman Teymur must already plan for another direction, and Behruz Veyran must split the border house guards between two fronts.\n\nBefore the war begins we can offer the neighbour compensation and non-intervention through the non-intervention talks. Ramin Farzan is ready to carry the offer but warns that consent is not guaranteed: the neighbour remembers who took up arms first. Signing requires 100 £ADISCORD_economy_treasury_texticon and 30 £political_power_texticon; if refused, the money stays with us. Darius Safir calls the price low beside a second front; Tahmuras Bayrat calls it high beside the chance that the neighbour takes it and signs with Mazar anyway.\n\nMazar will not look for a replacement for this participant during the current preparation. A door closed once stays closed until the end of the campaign."
 ADISCORD_SHL.124.a: "Account for the threat and open talks."
 ADISCORD_SHL.125.t: "Mazar Offers Protection"
 ADISCORD_SHL.125.d: "Shahrabad has already tried to impose its will on us by force: its watch stood at our wells and ports, and the guards of the house of Veyran at our borders. Now the Chamber of the Common Ration proposes to meet the next war together. When Mazar and Shahrabad begin hostilities, our army opens a neighbouring front, and the Conclave will have to split nine guards and one watch between two directions.\n\nThis is a limited military treaty. Mazar's capitulation or a peace it agrees ends our participation; one border campaign must not swallow the country's whole foreign policy. The chamber's stewards promise neither land nor ration - only that Shahrabad will be kept busy.\n\nUntil war is declared we may still accept Shahrabad's compensation and keep out of the war: Ramin Farzan's envoy waits for an answer with the sum in hand. Signing the treaty means choosing Mazar. Standing aside means waiting to see which neighbour wins, and talking to the winner."
 ADISCORD_SHL.125.a: "Sign the border pact."
 ADISCORD_SHL.125.b: "Remain outside the conflict."
 ADISCORD_SHL.126.t: "The Price of Non-intervention"
 ADISCORD_SHL.126.d: "Shahrabad offers compensation for the earlier armed conflict in exchange for our refusal to take part in the Mazar campaign. Ramin Farzan brought the offer in person and did not hide who pays for it: the Conclave's treasury, not the treasury of the house that started the war. We keep our independence, and 100 £ADISCORD_economy_treasury_texticon arrive after signing. The territorial border stays as it is - no concessions, no restitution.\n\nThe agreement is possible while the war with Mazar has not begun and Shahrabad holds the full announced sum. The envoy warned honestly that the Conclave will not repeat the offer after the first shot: Arman Teymur is already dividing the watch by direction, and Khazar wants to know how many directions there will be.\n\nTo back Mazar, accept the compensation or stand aside - the decision is ours. Shahrabad's money will not return what it took by force; but the Chamber of the Common Ration promises nothing except a common enemy."
 ADISCORD_SHL.126.a: "Accept compensation and non-intervention."
 ADISCORD_SHL.126.b: "Do not sign."
 ADISCORD_SHL.127.t: "One Border Secured"
 ADISCORD_SHL.127.d: "[FROM.GetName] has accepted our offer. The compensation is paid, the arrangement with Mazar cancelled, and Bahram Kaveh confirms that the chamber's envoys left the neighbouring capital without a signature. Preparing the agreement cost 100 £ADISCORD_economy_treasury_texticon and 30 £political_power_texticon; Leyla Nadiri entered both sums on a separate line - the price of a second front that will not exist.\n\nArman Teymur returned the watch to one direction, Behruz Veyran the border house guards to the Zarkhan District. Darius Safir thinks we paid cheaply; Tahmuras Bayrat that we paid for something the neighbour would not have done anyway. Ramin Farzan asks the Conclave to remember that a neighbour's signature is worth exactly as much as our conduct after it.\n\nThe earlier border conflict is settled. A new attack on our part would again give the neighbour grounds to seek protection; the present treaty does not justify further violence. Now we concentrate on Mazar."
 ADISCORD_SHL.127.a: "Now we can concentrate on Mazar."
 ADISCORD_SHL.128.t: "No Agreement Signed"
 ADISCORD_SHL.128.d: "The non-intervention talks ended without agreement. No compensation was paid and no political power spent; Ramin Farzan returned to Khazar with the same purse he left with, and a letter in which the neighbour thanks us for our attention and promises nothing. Bahram Kaveh reported that the envoys of the Chamber of the Common Ration are still in the neighbouring capital.\n\nArman Teymur kept the plan for two directions, and Behruz Veyran the house guards at both ends of the border. Darius Safir proposes raising the sum; Tahmuras Bayrat, paying nothing and showing the neighbour the watch. Mariam Arbin reminds the hall that the neighbour remembers who took up arms first, and that such memory is not erased with money - only with time.\n\nThe neighbour's current position is shown in the border crisis summary. While the preparation continues, we may return to the talks after a pause. Mazar will not sit idle in the meantime either."
 ADISCORD_SHL.128.a: "Account for this in our plans."
 SHL_startup_region:0 "§YTHE SOUTHERN DESERTS: SHAHRABAD'S SURROUNDINGS§!\n\nThe situation at the beginning of 2160.\n\n§YKeyzan: water for the furnaces§!\nThe union of irrigation communities recognises no permanent capital. Settlements maintain their own sections of the qanats and arrange joint works through delegates. These waterways also feed Shahrabad's western furnaces: the League's industrial strength depends on communities unwilling to submit to a foreign centre.\n\n§YVeir: access to the sea§!\nThe Trade Chamber brings together ports, workshops and ship repair. Its port code regulates duties and insurance, and Shahrabad's metal passes through this system to foreign markets. For the houses, the cost of exporting their products matters as much as the price of ore.\n\n§YMazar: metal and the common ration§!\nThe Chamber of the Common Ration distributes water and supplies according to collective utility. It considers Shahrabad's metal part of the resources the region needs. The dispute concerns supplies and security in the Zarkhan District, where the distributors' interests clash with the industrial houses' rights.\n\n§YSvetlogorye and the northern oil basin§!\nSvetlogorye's viceroyal administration rests on Workerland's inheritance, oilfields and garrisons. Eflor and Azhar dispute lands taken by the former empire. For Shahrabad, the northern balance determines who controls fuel and has the strength to compete for influence across the South. Svetlogorye's oil contract makes furnace material cheaper; its embargo makes every package dearer.\n\n§YDistant buyers§!\nKefreyt, Stelander and the Land of the Khan do not border the deserts, but they buy Golden Gate metal: a contract for one furnace's deliveries pays the treasury every cycle and survives everything except war and non-payment.\n\n§YThe map of Shahrabad§!\nThe nine furnace states bear the names of their houses: Arbin, Safir, Loran, Nuran, Bayrat, Kerdan, Sharim, Devyatipechye and Veyran; the capital is Khazar, the southern frontier the Zarkhan District with Zarkhan and Zarkhan-Kala. Beyond the furnace towns lie four rural states: the Safir Coast with the port of Safir-Bandar, the Loran Sands with Loran-Deh, the Bayrat Mines with the mining town of Bayrat-Kan and the Veyran Border with Veyran-Kala on the frontier with Veyr."
 SHL_startup_country: "§YTHE SHAHRABAD LEAGUE IN 2160§!\n\n§YThe city depended on its furnace§!\nIndustrial Shahrabad formed around enterprises on which residents depended for wages and supplies. An owner could abandon a plant and leave the city without a livelihood. The Law of Continuous Fire was meant to tie ownership to the duty of maintaining production.\n\nThe main furnace became the measure of that duty. While it worked, a house kept its plant and its Conclave seat. If the fire died, ownership returned to the city. A stoppage did not destroy the workshops: the same plant could survive under a different owner. The law therefore governed both the economy and the right to speak for a city.\n\n§YFrom obligation to privilege§!\nOver time, a rule protecting residents from abandoned factories became the foundation of the industrial houses' power. Hereditary rank, wealth and ownership formed a single order. Workers' quarters were promised wages and supplies, cities protection, while ruling families retained profits and accustomed luxury.\n\nNine houses kept purchasing, exports and energy pricing within their closed circle. A working furnace confirmed political rights, making a repair dispute a dispute over the right to govern. Equipment condition was more than a technical matter: acknowledging a fault could endanger a family's position.\n\n§YAn economy of separate houses§!\nKhazar became the League's capital, the furnace district its industrial heart. Bayrat has long supplied the furnaces with ore, but its mines remain bound by each house's old contracts. Shared dependence on metal and transport did not dissolve separate holdings and interests.\n\nThe resulting economy consisted of parts that needed one another without managing resources as a single enterprise. Deliveries crossed other owners' holdings, factory guards served their own masters, and revenue was divided among houses, quarters and central authority. People outside official registers held less political weight than those controlling their work.\n\nConclave decisions were paid for with concessions to families holding hereditary seats. Outside, house, workshop and city registers disagreed: someone could work at a furnace for years yet remain a stranger to an institution in the next quarter. Industrial ties between cities proved stronger than their common system of civic rights.\n\n§YNine crests above the chair§!\nBy 2160, the houses' crests hang above Jalil Nur's chair in the Conclave. The League has working factories and a large population, but its order still rests on an old condition: fire grants property and a voice. Beneath that enduring formula have accumulated wear, supply disputes and discontent in the quarters. A law once meant to protect the city from its owner now also justifies the owner's power over the city."
 SHL_startup_guide_furnaces_title: "Furnaces and production"
 SHL_startup_guide_furnaces: "§YHOW THE FURNACES WORK§!\n\n§YPanel and cycle§!\nOpen the $SHL_conclave$ and select a site. Every 28 days, an operating furnace consumes material, earns revenue and gains wear. An ordinary shift uses 1 package, overtime uses 2. Without material, the furnace idles and wears faster. Wear of 100 or two consecutive idle cycles extinguishes it.\n\n§YTwo separate stores§!\nLocal stocks serve only the selected furnace. The shared reserve is not distributed automatically: a separate button immediately transfers 1 package to the selected site. This also works during a local operation. A normal material purchase arrives in 7 days; its price is shown on the panel and depends on Svetlogorye: an oil contract makes the package cheaper, an embargo dearer.\n\n§YEach furnace has its own queue§!\nDelivery, maintenance and shift training share one local slot. Two such jobs cannot run at the same furnace, but another furnace can process its own order. Maintenance takes 14 days and removes 30 wear without stopping production. Do not leave repairs until the cycle in which wear reaches its limit.\n\n§YPlanned purchasing§!\n$SHL_houses_railway$ unlocks a decision to enable planned supply. During the production cycle, it buys the missing 1 or 2 packages at the current price if money is available. These are recurring treasury expenses, not free reserves.\n\n§YMetal for sale§!\nA free export furnace can work on contract: the \"$SHL_metal_contract_offer$\" decision offers Golden Gate metal to Kefreyt, Stelander, the Land of the Khan and other buyers for a payment every cycle. The contract holds while the buyer pays and the parties are not at war.\n\n§YShifts and ownership§!\nCareful smelting reduces wear at the cost of income; overtime consumes twice the material for higher revenue. The industrial branch unlocks these modes. Extinguishing a furnace removes its house's vote and leaves the plant to the city; restarting costs extra.\n\n§YThe tenth furnace§!\nThe partnership, land, construction and first smelt are separate paid stages unlocked by focuses. Plan them alongside the upkeep of the nine existing furnaces."
 SHL_startup_guide_fire_title: "Division of the fire"
 SHL_startup_guide_fire: "§YRECIPIENTS OF THE HEAT§!\n\n§YOne recipient per furnace§!\nSelect a furnace and assign export, arsenal, quarters or crest. Assignment persists. Only a successful shift consumes stock and pays its recipient. The tenth furnace has its own selection.\n\n§YOpportunity cost§!\nExport pays 60 / 90 / 25 before deductions. Arsenal gives 2700 / 5400 / 1350 rifles instead of cash. Quarters reduce unrest by 4 / 6 / 2; crests reduce pressure by 4 / 6 / 2. Order: ordinary / overtime / careful. Materials and repairs remain payable.\n\n§YCourses and orders§!\nHouses and regency strengthen crest deliveries; cities and commune strengthen quarters. Cities discount civic orders; the directorate discounts arsenal orders. A paid order occupies one furnace and the single national slot; there is no additional ordinary delivery. Its price and refund are fixed on payment. After settlement the furnace continues serving the order recipient.\n\n§YHouse support§!\nA house with a legal vote supports the Conclave after an actual crest delivery. A majority makes Conclave guarantees free of the §Y40§! £political_power_texticon charge. Compensation after ownership transfer does not restore the vote. The commune closes crest deliveries.\n\n§YDeadlines§!\nUnrest and pressure of 60 can open crises. Deliveries do not remove background tension growth. Wear of 90 risks an accident: retain money for maintenance and responses."
 SHL_startup_guide_wars_title: "Preparing for war"
 SHL_startup_guide_wars: "§YFROM FACTORY GUARDS TO DEFENCE§!\n\n§YThe first threat's deadline§!\nMazar's first challenge is scheduled for day 168 of the campaign. Military and supply preparation must accompany political construction. Waiting for the tenth furnace does not pause the neighbouring crisis.\n\n§YBuild real forces§!\nThe railway, factory and southern guard focuses help prepare your defence. Check what each focus unlocks: an available decision still needs to be carried out. Your course's military mandate and the two smelts for the front provide further options. Compare the formations received with stocks for replacements.\n\n§YKeep the furnaces running§!\nMilitary expenses compete with materials and maintenance. Check local stocks, time until the next cycle and cash reserves. Arsenal deliveries replace cash from the selected furnaces; retain funds for supply and repairs.\n\n§YAnswer the demand§!\nWhen Mazar demands payment for the southern district's security, compare the cost of payment or a settlement with your readiness to refuse and fight. The offer states its specific prices and deadlines. After the conflict, the peace focus opens reconstruction in a selected district.\n\n§YExternal decisions§!\nThe relevant focuses open disputes over water and access to the sea. Check decisions for available agreements and their conditions. Ordinary diplomatic buttons for declaring war and creating alliances are disabled: foreign actions use focuses, decisions and events.\n\nNeighbouring countries are described under Region, and the southern campaign's political alternatives under Paths. Your immediate task is to finish paid preparations, preserve production and answer active deadlines."
 SHL_startup_guide_plan_title: "First steps"
 SHL_startup_guide: "§YFIRST STEPS AS SHAHRABAD§!\n\n§Y1. Inspect the nine furnaces.§! Open the $SHL_conclave$. Each furnace begins with 2 material packages, with another 2 in the shared reserve. Check wear, shift mode and time until the next 28-day cycle.\n\n§Y2. Plan for the third smelt.§! Two local packages cover two ordinary cycles. Before the third, arrange deliveries, transfer reserves or enable functioning planned supply. Purchases take 7 days; the shared reserve can be transferred immediately.\n\n§Y3. Distinguish reserve from supply.§! The nine-furnace census and next-shift reserve focuses each add 2 packages to the shared stock. Furnaces do not receive them automatically. Allocate the reserve where it is needed soonest.\n\n§Y4. Balance construction with upkeep.§! A political course follows the Conclave rules, while the trunk leads to the tenth furnace. Its stages require separate payments. Set aside money for materials and upcoming maintenance before ordering new construction.\n\n§Y5. Prepare your defence early.§! Mazar's first challenge falls on day 168. Check unlocked military decisions and actual preparation times; do not postpone the army until the entire political course is complete.\n\n§Y6. Watch the gauges and the balance.§! $SHL_quarters_and_borders$ shows the quarters' unrest, crest pressure and the \"$SHL_conclave_balance$\" gauge. The gauges lead to crises; the balance decides which course can be ratified. When a crisis starts, read the mission and respond before its timer expires. The courses and their outcomes are covered under Paths.\n\n§Y7. Read the Conclave.§! Every few months the Book of Furnaces opens a chapter of the Law of Continuous Fire's chronicle, the Conclave Archive and short scenes of furnace life show the houses and quarters, and the \"$SHL_festival_of_fire$\" gathers the city at the Golden Gate once a year. These are stories, not tasks; a chapter can be closed on any page."
 SHL_startup_path_0_title: "Five Courses of the Conclave"
 SHL_startup_path_0: "§YFIVE COURSES OF THE CONCLAVE§!\n\nThe tenth furnace in Devyatipechye belongs to no house. Who receives it decides who owns Shahrabad. Three courses are chosen openly in the tree; two open only through a crisis.\n\n§YThe tenth house - Conclave of Ten§!\nThe partnership becomes the tenth crest. Jalil Nur remains the mediator, the Golden Gate cartel trades on behalf of all the houses, and the South is gathered through a debt network and trading protectorates.\n\n§YThe open Conclave - Southern Compact§!\nThe cities receive charters and a voice. Mariam Arbin leads the Southern Compact: councils and elections, well charters, the free road. Keyzan becomes the compact's first member.\n\n§YNur's Directorate - Directorate of Furnaces§!\nThe furnaces pass to the state. Nur trades the mediator's chair for a director's office, and Rauf Darban binds workshop, depot and front under one order. The iron march annexes the neighbours who refused a treaty.\n\n§YRegency - Council of Crests§! (hidden course)\nAfter a lost Night of the Crests, Darius Safir returns furnaces and privileges to the houses; private armies and revenue pledges replace the state.\n\n§YCommune of Fire§! (hidden course)\nAfter a successful strike, the shift councils take the furnaces; Salima Darzi of Sharim leads the commune's cabinet. Councils abroad and Svetlogorye's underground prepare an oil workers' uprising.\n\n§YThe nine houses§!\nA house bears the name of the state of its main furnace: Arbin, Safir, Loran, Nur (Nuran), Bayrat, Kerdan, Sharim, Darban (Devyatipechye) and Veyran. Its head sits in the Conclave and may join the cabinet while the furnace burns and belongs to the house.\n\nRatifying any course loads its own focus tree and changes the League's leader, party and name. Which course can be ratified is decided by the Conclave balance: crests against quarters."
 SHL_startup_path_0_details: "§YCOURSES: BALANCE, RATIFICATION, TREE§!\n\n§Y1. The provisional course.§! After \"$SHL_conclave_rules$\", choose \"$SHL_new_house$\", \"$SHL_open_conclave$\" or \"$SHL_nur_directorate$\"; they exclude each other. The choice immediately moves the Conclave balance towards the crests, towards the quarters or leaves it in place, and unlocks the course's production order.\n\n§Y2. The Conclave balance.§! The \"$SHL_conclave_balance$\" gauge in \"$SHL_quarters_and_borders$\" shows who holds the hall: the house crests or the quarters. It is moved by transfers of extinguished furnaces, \"$SHL_workers_charter$\", the choice between \"$SHL_heralds_table$\" and \"$SHL_quarter_listening$\", banquets and common cauldrons, and the outcome of strikes and ultimatums. Each range carries its own modifiers and opens or closes ratification.\n\n§Y3. Ratification.§! \"$SHL_admit_tenth_house$\" needs the crests ascendant or ruling; \"$SHL_rights_without_fire$\" needs the quarters ascendant or ruling plus civic support; \"$SHL_state_furnaces$\" needs equilibrium. All three require \"$SHL_workers_charter$\"; the tenth furnace remains a separate construction project. The regency and the commune are ratified not by a focus but by a choice in a crisis event (see the next page).\n\n§Y4. A new tree.§! Ratification replaces the Conclave tree with the course tree; completed preparation focuses are kept. The course has its own leader, party, name, spirit and super event. The tree is divided into order (two political forks), economy (programmes with a price and a duration), consolidation of the South, the shared front of the War for the South and an epilogue after victory.\n\n§Y5. Whom the fire serves.§! Houses and regency strengthen crest deliveries, cities and commune strengthen the quarters; the directorate discounts arsenal orders, the cities civic orders. An extinguished or confiscated furnace removes the house's adviser from the cabinet, and a house without a furnace loses its vote in the Conclave."
 SHL_startup_path_1_title: "Crises and the War for the South"
 SHL_startup_path_1: "§YWHEN THE CONCLAVE BREAKS§!\n\nTwo courses cannot be chosen in the tree: a crisis opens them and the Conclave balance permits them.\n\n§YThe cold shift§!\nUnrest in the quarters grows with overtime shifts and idle cycles. Once it crosses the threshold, the shift councils stop the furnaces without destroying them. The Conclave may concede, wait it out or send the guard. If the strike is not broken and the quarters hold the hall, the councils demand power: Nur departs, the furnaces pass to the workers and the country becomes the Commune of Fire.\n\n§YUltimatum of the crests§!\nCrest pressure grows with civic reforms and confiscated furnaces. The houses deliver an ultimatum backed by private guards and Safir's treasury. If the Conclave fails to answer and the crests hold the hall, the Night of the Crests follows: Darius Safir becomes regent and the country the Council of Crests.\n\n§YAfter ratification§!\nThe furnace cycle goes on: every 28 days a furnace consumes material, pays the treasury and wears down. Every four cycles the house with the worst furnace (in the city and commune courses, the shift council of the worst quarter) presents a demand to the Conclave. A neighbour that lost a limited war returns a year later with a claim.\n\n§YConsolidation and war§!\nEach course runs two campaigns with missions and deadlines: ultimatums, alliances, limited wars. Completed campaigns and the furnace cycle fill the southern crisis. Once it matures, the war with Svetlogorye begins: the course's final focus declares it, or the crisis itself does."
 SHL_startup_path_1_details: "§YCRISES AND THE SECOND PHASE: DETAILS§!\n\n§Y1. Entering the commune.§! You need an active cold shift and the quarters ruling on the \"$SHL_conclave_balance$\" gauge. The events \"The Cold Shift\" and \"The Shift Councils Demand Power\" then offer \"$SHL_back_shift_councils$\": the balance moves to the quarters, Nur resigns and the commune tree loads. Crushing the strike by force pushes the balance towards the crests instead.\n\n§Y2. Entering the regency.§! You need an active ultimatum and the crests ruling. The events \"Ultimatum of the Crests\" and \"Night of the Crests\" then offer \"$SHL_back_crests$\": Darius Safir takes the seal, the balance moves to the crests and the regency tree loads. A hidden course may replace even an already ratified open course; incompatible orders close and refund their unspent payment.\n\n§Y3. The second act.§! After ratification, every four cycles bring \"A Demand at the Furnace\": pay from the treasury, concede the vote (the balance shifts towards the claimants) or refuse. Refusal starts the \"$SHL_house_demand$\" mission: if the furnace is not repaired in time, the house goes into opposition and its head leaves the cabinet for a while. Accidents and caravans continue to be drawn separately.\n\n§Y4. Neighbours after a war.§! A defeated neighbour sends \"A Year After the Peace\" a year later: the claim can be bought out or left on record. A lost dispute does not close consolidation: such a neighbour remains its target with a penalty to consent.\n\n§Y5. Consolidation of the South.§! Campaigns open with the first focus of the course's order section and do not wait for Svetlogorye. A campaign mission succeeds when its targets have submitted or joined the alliance; on timeout a demand for annexation or a repeated invitation follows. Campaign status is shown in \"$SHL_quarters_and_borders$\". Winning a campaign raises the southern crisis just as an accepted submission does.\n\n§Y6. The War for the South.§! The front layer is shared by all courses; the pretext and the military decisions are each course's own: oil embargo, war of charters, the last smelt, war of the crests, oil workers' uprising. The final war focus waits for a matured crisis and peace; a prolonged war is decided by holding the key districts. The victor receives the Crown of the South and the course's epilogue: a concession, a charter, a governorate-general, fiefs or a merger of councils."
