 ADISCORD_SHL.124.t: "Another Edge of War"
 ADISCORD_SHL.124.d: "[FROM.GetName] is negotiating with the Assembly of Canal Communities. After our refusal to pay the ration, the promise of Keyzan's protection found attentive listeners, and Bahram Kaveh confirms that the communities' envoys have twice passed through the neighbouring capital. No treaty is signed yet, but Arman Teymur must already plan for another direction, and Behruz Veyran must split the border house guards between two fronts.\n\nBefore the war begins we can offer the neighbour compensation and non-intervention through the non-intervention talks. Ramin Farzan is ready to carry the offer but warns that consent is not guaranteed: the neighbour remembers who took up arms first. Signing requires 100 £ADISCORD_economy_treasury_texticon and 30 £political_power_texticon; if refused, the money stays with us. Darius Safir calls the price low beside a second front; Tahmuras Bayrat calls it high beside the chance that the neighbour takes it and signs with Keyzan anyway.\n\nKeyzan will not look for a replacement for this participant during the current preparation. A door closed once stays closed until the end of the campaign."
 ADISCORD_SHL.124.a: "Account for the threat and open talks."
 ADISCORD_SHL.125.t: "Keyzan Offers Protection"
 ADISCORD_SHL.125.d: "Shahrabad has already tried to impose its will on us by force: its watch stood at our wells and ports, and the guards of the house of Veyran at our borders. Now the Assembly of Canal Communities proposes to meet the next war together. When Keyzan and Shahrabad begin hostilities, our army opens a neighbouring front, and the Conclave will have to split nine guards and one watch between two directions.\n\nThis is a limited military treaty. Keyzan's capitulation or a peace it agrees ends our participation; one border campaign must not swallow the country's whole foreign policy. The communities' delegates promise neither land nor water - only that Shahrabad will be kept busy.\n\nUntil war is declared we may still accept Shahrabad's compensation and keep out of the war: Ramin Farzan's envoy waits for an answer with the sum in hand. Signing the treaty means choosing Keyzan. Standing aside means waiting to see which neighbour wins, and talking to the winner."
 ADISCORD_SHL.125.a: "Sign the border pact."
 ADISCORD_SHL.125.b: "Remain outside the conflict."
 ADISCORD_SHL.126.t: "The Price of Non-intervention"
 ADISCORD_SHL.126.d: "Shahrabad offers compensation for the earlier armed conflict in exchange for our refusal to take part in the Keyzan campaign. Ramin Farzan brought the offer in person and did not hide who pays for it: the Conclave's treasury, not the treasury of the house that started the war. We keep our independence, and 100 £ADISCORD_economy_treasury_texticon arrive after signing. The territorial border stays as it is - no concessions, no restitution.\n\nThe agreement is possible while the war with Keyzan has not begun and Shahrabad holds the full announced sum. The envoy warned honestly that the Conclave will not repeat the offer after the first shot: Arman Teymur is already dividing the watch by direction, and Khazar wants to know how many directions there will be.\n\nTo back Keyzan, accept the compensation or stand aside - the decision is ours. Shahrabad's money will not return what it took by force; but the Assembly of Canal Communities promises nothing except a common enemy."
 ADISCORD_SHL.126.a: "Accept compensation and non-intervention."
 ADISCORD_SHL.126.b: "Do not sign."
 ADISCORD_SHL.127.t: "One Border Secured"
 ADISCORD_SHL.127.d: "[FROM.GetName] has accepted our offer. The compensation is paid, the arrangement with Keyzan cancelled, and Bahram Kaveh confirms that the communities' envoys left the neighbouring capital without a signature. Preparing the agreement cost 100 £ADISCORD_economy_treasury_texticon and 30 £political_power_texticon; Leyla Nadiri entered both sums on a separate line - the price of a second front that will not exist.\n\nArman Teymur returned the watch to one direction, Behruz Veyran the border house guards to the Zarkhan District. Darius Safir thinks we paid cheaply; Tahmuras Bayrat that we paid for something the neighbour would not have done anyway. Ramin Farzan asks the Conclave to remember that a neighbour's signature is worth exactly as much as our conduct after it.\n\nThe earlier border conflict is settled. A new attack on our part would again give the neighbour grounds to seek protection; the present treaty does not justify further violence. Now we concentrate on Keyzan."
 ADISCORD_SHL.127.a: "Now we can concentrate on Keyzan."
 ADISCORD_SHL.128.t: "No Agreement Signed"
 ADISCORD_SHL.128.d: "The non-intervention talks ended without agreement. No compensation was paid and no political power spent; Ramin Farzan returned to Khazar with the same purse he left with, and a letter in which the neighbour thanks us for our attention and promises nothing. Bahram Kaveh reported that the envoys of the Assembly of Canal Communities are still in the neighbouring capital.\n\nArman Teymur kept the plan for two directions, and Behruz Veyran the house guards at both ends of the border. Darius Safir proposes raising the sum; Tahmuras Bayrat, paying nothing and showing the neighbour the watch. Mariam Arbin reminds the hall that the neighbour remembers who took up arms first, and that such memory is not erased with money - only with time.\n\nThe neighbour's current position is shown in the border crisis summary. While the preparation continues, we may return to the talks after a pause. Keyzan will not sit idle in the meantime either."
 ADISCORD_SHL.128.a: "Account for this in our plans."
 SHL_startup_region:0 "§YTHE SOUTHERN DESERTS: SHAHRABAD'S SURROUNDINGS§!\n\nThe situation at the beginning of 2160.\n\n§YKeyzan: water for the furnaces and the water ration§!\nThe Assembly of Canal Communities recognises no permanent capital. Settlements maintain their own sections of the qanats and arrange joint works through delegates. These waterways also feed Shahrabad's western furnaces, and the communities count Shahrabad's metal as payment for their water: the water ration they set becomes a demand and then an ultimatum to the Zarkhan District, which Tabar borders. The League's industrial strength depends on communities unwilling to submit to a foreign centre.\n\n§YVeir: access to the sea§!\nThe Trade Chamber brings together ports, workshops and ship repair. Its port code regulates duties and insurance, and Shahrabad's metal passes through this system to foreign markets. For the houses, the cost of exporting their products matters as much as the price of ore.\n\n§YMazar: the common ration beyond the far border§!\nThe Chamber of the Common Ration distributes water and supplies according to collective utility and touches Shahrabad only through the cisterns of Resan by the Zarkhan District. It makes no demands of its own, but treats Keyzan's dispute with Shahrabad as the business of the whole desert: its detachments may stand beside the communities, and its non-intervention can be bought. For the southern course Mazar remains a neighbour to invite into a compact or to annex.\n\n§YSvetlogorye and the northern oil basin§!\nSvetlogorye's viceroyal administration rests on Workerland's inheritance, oilfields and garrisons. Eflor and Azhar dispute lands taken by the former empire. For Shahrabad, the northern balance determines who controls fuel and has the strength to compete for influence across the South. Svetlogorye's oil contract makes furnace material cheaper; its embargo makes every package dearer.\n\n§YDistant buyers§!\nKefreyt, Stelander and the Land of the Khan do not border the deserts, but they buy Golden Gate metal: a contract for one furnace's deliveries pays the treasury every cycle and survives everything except war and non-payment.\n\n§YThe map of Shahrabad§!\nThe nine furnace states bear the names of their houses: Arbin, Safir, Loran, Nuran, Bayrat, Kerdan, Sharim, Devyatipechye and Veyran; the capital is Khazar, the southern frontier the Zarkhan District with Zarkhan and Zarkhan-Kala. Beyond the furnace towns lie four rural states: the Safir Coast with the port of Safir-Bandar, the Loran Sands with Loran-Deh, the Bayrat Mines with the mining town of Bayrat-Kan and the Veyran Border with Veyran-Kala on the frontier with Veyr."
 SHL_startup_country: "§YTHE SHAHRABAD LEAGUE IN 2160§!\n\n§YThe city depended on its furnace§!\nIndustrial Shahrabad formed around enterprises on which residents depended for wages and supplies. An owner could abandon a plant and leave the city without a livelihood. The Law of Continuous Fire was meant to tie ownership to the duty of maintaining production.\n\nThe main furnace became the measure of that duty. While it worked, a house kept its plant and its Conclave seat. If the fire died, ownership returned to the city. A stoppage did not destroy the workshops: the same plant could survive under a different owner. The law therefore governed both the economy and the right to speak for a city.\n\n§YFrom obligation to privilege§!\nOver time, a rule protecting residents from abandoned factories became the foundation of the industrial houses' power. Hereditary rank, wealth and ownership formed a single order. Workers' quarters were promised wages and supplies, cities protection, while ruling families retained profits and accustomed luxury.\n\nNine houses kept purchasing, exports and energy pricing within their closed circle. A working furnace confirmed political rights, making a repair dispute a dispute over the right to govern. Equipment condition was more than a technical matter: acknowledging a fault could endanger a family's position.\n\n§YAn economy of separate houses§!\nKhazar became the League's capital, the furnace district its industrial heart. Bayrat has long supplied the furnaces with ore, but its mines remain bound by each house's old contracts. Shared dependence on metal and transport did not dissolve separate holdings and interests.\n\nThe resulting economy consisted of parts that needed one another without managing resources as a single enterprise. Deliveries crossed other owners' holdings, factory guards served their own masters, and revenue was divided among houses, quarters and central authority. People outside official registers held less political weight than those controlling their work.\n\nConclave decisions were paid for with concessions to families holding hereditary seats. Outside, house, workshop and city registers disagreed: someone could work at a furnace for years yet remain a stranger to an institution in the next quarter. Industrial ties between cities proved stronger than their common system of civic rights.\n\n§YNine crests above the chair§!\nBy 2160, the houses' crests hang above Jalil Nur's chair in the Conclave. The League has working factories and a large population, but its order still rests on an old condition: fire grants property and a voice. Beneath that enduring formula have accumulated wear, supply disputes and discontent in the quarters. A law once meant to protect the city from its owner now also justifies the owner's power over the city."
 SHL_startup_guide_furnaces_title: "Furnaces and production"
 SHL_startup_guide_furnaces: "§YHOW THE FURNACES WORK§!\n\n§YPanel and cycle§!\nOpen the $SHL_conclave$ and select a site. Every 28 days, an operating furnace consumes material, earns revenue and gains wear. An ordinary shift uses 1 package, overtime uses 2. Without material, the furnace idles and wears faster. Wear of 100 or two consecutive idle cycles extinguishes it.\n\n§YTwo separate stores§!\nLocal stocks serve only the selected furnace. The shared reserve is not distributed automatically: a separate button immediately transfers 1 package to the selected site. This also works during a local operation. A normal material purchase arrives in 7 days; its price is shown on the panel and depends on Svetlogorye: an oil contract makes the package cheaper, an embargo dearer.\n\n§YEach furnace has its own queue§!\nDelivery, maintenance and shift training share one local slot. Two such jobs cannot run at the same furnace, but another furnace can process its own order. Maintenance takes 14 days and removes 30 wear without stopping production. Do not leave repairs until the cycle in which wear reaches its limit.\n\n§YPlanned purchasing§!\n$SHL_houses_railway$ unlocks a decision to enable planned supply. During the production cycle, it buys the missing 1 or 2 packages at the current price if money is available. These are recurring treasury expenses, not free reserves.\n\n§YMetal for sale§!\nA free export furnace can work on contract: the \"$SHL_metal_contract_offer$\" decision offers Golden Gate metal to Kefreyt, Stelander, the Land of the Khan and other buyers for a payment every cycle. The contract holds while the buyer pays and the parties are not at war.\n\n§YShifts and ownership§!\nCareful smelting reduces wear at the cost of income; overtime consumes twice the material for higher revenue. The industrial branch unlocks these modes. Extinguishing a furnace removes its house's vote and leaves the plant to the city; restarting costs extra.\n\n§YThe tenth furnace§!\nThe partnership, land, construction and first smelt are separate paid stages unlocked by focuses. Plan them alongside the upkeep of the nine existing furnaces."
 SHL_startup_guide_fire_title: "Division of the fire"
 SHL_startup_guide_fire: "§YRECIPIENTS OF THE HEAT§!\n\n§YOne recipient per furnace§!\nSelect a furnace and assign export, arsenal, quarters or crest. Assignment persists. Only a successful shift consumes stock and pays its recipient. The tenth furnace has its own selection.\n\n§YOpportunity cost§!\nExport pays 60 / 90 / 25 before deductions. Arsenal gives 2700 / 5400 / 1350 rifles instead of cash. Quarters reduce unrest by 4 / 6 / 2; crests reduce pressure by 4 / 6 / 2. Order: ordinary / overtime / careful. Materials and repairs remain payable.\n\n§YCourses and orders§!\nHouses and regency strengthen crest deliveries; cities and commune strengthen quarters. Cities discount civic orders; the directorate discounts arsenal orders. A paid order occupies one furnace and the single national slot; there is no additional ordinary delivery. Its price and refund are fixed on payment. After settlement the furnace continues serving the order recipient.\n\n§YHouse support§!\nA house with a legal vote supports the Conclave after an actual crest delivery. A majority makes Conclave guarantees free of the §Y40§! £political_power_texticon charge. Compensation after ownership transfer does not restore the vote. The commune closes crest deliveries.\n\n§YDeadlines§!\nUnrest and pressure of 60 can open crises. Deliveries do not remove background tension growth. Wear of 90 risks an accident: retain money for maintenance and responses."
 SHL_startup_guide_wars_title: "Preparing for war"
 SHL_startup_guide_wars: "§YFROM FACTORY GUARDS TO DEFENCE§!\n\n§YThe first threat's deadline§!\nKeyzan's first demand is scheduled for day 168 of the campaign. Military and supply preparation must accompany political construction. Waiting for the tenth furnace does not pause the neighbouring crisis.\n\n§YBuild real forces§!\nThe railway, factory and southern guard focuses help prepare your defence. Check what each focus unlocks: an available decision still needs to be carried out. Your course's military mandate and the two smelts for the front provide further options. Compare the formations received with stocks for replacements.\n\n§YKeep the furnaces running§!\nMilitary expenses compete with materials and maintenance. Check local stocks, time until the next cycle and cash reserves. Arsenal deliveries replace cash from the selected furnaces; retain funds for supply and repairs.\n\n§YAnswer the demand§!\nWhen Keyzan demands payment for its water under threat to the Zarkhan District, compare the cost of payment or a settlement with your readiness to refuse and fight. The offer states its specific prices and deadlines. After the conflict, the peace focus opens reconstruction in a selected district.\n\n§YExternal decisions§!\nThe relevant focuses open disputes over water and access to the sea. Check decisions for available agreements and their conditions. Ordinary diplomatic buttons for declaring war and creating alliances are disabled: foreign actions use focuses, decisions and events.\n\nNeighbouring countries are described under Region, and the southern campaign's political alternatives under Paths. Your immediate task is to finish paid preparations, preserve production and answer active deadlines."
 SHL_startup_guide_plan_title: "First steps"
 SHL_startup_guide: "§YFIRST STEPS AS SHAHRABAD§!\n\n§Y1. Inspect the nine furnaces.§! Open the $SHL_conclave$. Each furnace begins with 2 material packages, with another 2 in the shared reserve. Check wear, shift mode and time until the next 28-day cycle.\n\n§Y2. Plan for the third smelt.§! Two local packages cover two ordinary cycles. Before the third, arrange deliveries, transfer reserves or enable functioning planned supply. Purchases take 7 days; the shared reserve can be transferred immediately.\n\n§Y3. Distinguish reserve from supply.§! The nine-furnace census and next-shift reserve focuses each add 2 packages to the shared stock. Furnaces do not receive them automatically. Allocate the reserve where it is needed soonest.\n\n§Y4. Balance construction with upkeep.§! A political course follows the Conclave rules, while the trunk leads to the tenth furnace. Its stages require separate payments. Set aside money for materials and upcoming maintenance before ordering new construction.\n\n§Y5. Prepare your defence early.§! Keyzan's first demand falls on day 168. Check unlocked military decisions and actual preparation times; do not postpone the army until the entire political course is complete.\n\n§Y6. Watch the gauges and the balance.§! $SHL_quarters_and_borders$ shows the quarters' unrest, crest pressure and the \"$SHL_conclave_balance$\" gauge. The gauges lead to crises; the balance decides which course can be ratified. When a crisis starts, read the mission and respond before its timer expires. The courses and their outcomes are covered under Paths.\n\n§Y7. Read the Conclave.§! Every few months the Book of Furnaces opens a chapter of the Law of Continuous Fire's chronicle, the Conclave Archive and short scenes of furnace life show the houses and quarters, and the \"$SHL_festival_of_fire$\" gathers the city at the Golden Gate once a year. These are stories, not tasks; a chapter can be closed on any page."
 SHL_startup_path_0_title:0 "Houses: Conclave of Ten"
 SHL_startup_path_0:0 "§YTHE TENTH HOUSE§!\n\nChoose a compromise with the houses and preserve their advantage in the Conclave. The partnership gains a seat among the crests while Jalil Nur remains the mediator between furnace owners.\n\nTrade, credit and private guards define this course. Choose the cartel's rules, contract security and economic ties with neighbours. Dependence on metal deliveries becomes an instrument of southern policy.\n\nVictory in the War for the South opens the Svetlogorye concession, a southern exchange or bank, and the Crown of Trade.\n\nReveal spoilers for the ratification chain, balance requirements and political outcomes."
 SHL_startup_path_0_details:0 "§YHOUSES: ENTRY AND COMMERCIAL HEGEMONY§!\n\n§YEntry§!\nAfter \"$SHL_conclave_rules$\", choose \"$SHL_new_house$\". This provisional choice excludes the open Conclave and directorate. Follow its chain to \"$SHL_house_compromise$\" and complete \"$SHL_workers_charter$\". \"$SHL_admit_tenth_house$\" requires the active \"$SHL_balance_crests_influence$\" or \"$SHL_balance_crests_dominance$\" range. Ratification loads the houses' tree; constructing the tenth furnace remains a separate task.\n\n§YManaging the balance§!\nThe crests occupy the left side of \"$SHL_conclave_balance$\". \"$SHL_heralds_table$\" and its unlocked \"$SHL_house_banquet$\" strengthen them. Receptions also reduce house pressure: political power and readiness to revolt are separate measures.\n\n§YChoices§!\nChoose fixed cartel prices or a metal exchange, house guards or mercenaries. \"$SHL_houses_prog_ending_a$\" favours trade and administration; \"$SHL_houses_prog_ending_b$\" favours stability and production efficiency. Both are outcomes within the houses' course.\n\n§YNeighbours and ending§!\nDebt networks, trade protectorates and a road to the sea build southern influence through economic dependence. \"$SHL_south_oil_for_furnaces$\" prepares the common southern war. After victory, \"$SHL_h_concession_of_svetlogorye$\" opens treasury-funded buyouts of eligible subjects. Choose a southern exchange or bank and complete \"$SHL_h_crown_of_trade$\". Common war requirements are on the last page."
 SHL_startup_path_1_title:0 "Cities: Southern Compact"
 SHL_startup_path_1:0 "§YTHE OPEN CONCLAVE§!\n\nChoose city charters, build civic support and establish the quarters' advantage. Ratification replaces Nur with Mariam Arbin at the head of the Southern Compact.\n\nDevelop city representation, public services, cooperatives and infrastructure. Decide who represents residents and protects the compact, then choose a civic or production priority.\n\nOffer neighbours charters and a common alliance. Victory in the southern war opens consensual integration, a Southern Council or stronger communes, and the Treaty of the South.\n\nReveal spoilers for the required focuses, civic support and political choices."
 SHL_startup_path_1_details:0 "§YCITIES: CHARTERS AND THE COMPACT§!\n\n§YEntry§!\nAfter \"$SHL_conclave_rules$\", choose \"$SHL_open_conclave$\" and follow the chain to \"$SHL_city_charters$\". Ratification through \"$SHL_rights_without_fire$\" also requires \"$SHL_workers_charter$\", at least 30 civic support and the active \"$SHL_balance_quarters_influence$\" or \"$SHL_balance_quarters_dominance$\" range. The provisional choice alone is insufficient. Ratification brings Mariam Arbin to power under pragmatism and replaces the tree.\n\n§YPreparing the conditions§!\nThe quarters occupy the right side of the balance. \"$SHL_quarter_listening$\" and transferring furnaces to quarters strengthen them. Operating chartered furnaces raise civic support and reduce unrest. Watch house pressure: urban reforms can provoke their ultimatum.\n\n§YChoices§!\nChoose city delegates or a shift assembly, quarter militia or a compact army. \"$SHL_cities_prog_ending_a$\" supports infrastructure and stability; \"$SHL_cities_prog_ending_b$\" favours military construction and production efficiency. Both remain within the city route. The economy branch offers schools, hospitals, a cooperative bank and water or harbour works.\n\n§YNeighbours and ending§!\nWell charters and the free road gather compact partners. An agreement takes effect after the partner accepts. \"$SHL_south_war_of_charters$\" prepares the southern war. After victory, \"$SHL_c_svetlogorye_charter$\" opens consensual integration of eligible subjects. The Southern Council or communes lead to \"$SHL_c_treaty_of_the_south$\". See the last page for war requirements."
 SHL_startup_paths_note:0 "Viewing does not choose a course. Reveal spoilers for entry conditions and endings."
 SHL_startup_path_2_title:0 "Nur's Directorate"
 SHL_startup_path_2:0 "§YTHE FURNACE STATE§!\n\nChoose the directorate and hold the balance between crests and quarters. Jalil Nur turns mediation into state authority over the furnaces.\n\nUnify production, supply and the army, while choosing between state furnaces and concessions, armaments and construction. Railways, depots and workshops prepare the country for a major campaign.\n\nIn the South, the directorate relies on ultimatums and the Iron March. Victory leads to a general governorate and the Iron Crown.\n\nReveal spoilers for ratification, the required balance and development choices."
 SHL_startup_path_2_details:0 "§YDIRECTORATE: BALANCE AND COMMAND§!\n\n§YEntry§!\nAfter \"$SHL_conclave_rules$\", choose \"$SHL_nur_directorate$\". Follow the chain to \"$SHL_common_dispatch$\" and complete \"$SHL_workers_charter$\". Finish \"$SHL_state_furnaces$\" while \"$SHL_balance_equilibrium$\" is active: the central range between -10 and +10. Either side's advantage blocks ratification. Nur remains leader, establishes etatism and receives the directorate tree.\n\n§YKeeping the entry open§!\nChoosing the directorate does not automatically centre the balance. Offset accumulated influence through decisions and furnace policy, checking the active range before ratification. House pressure and quarter unrest remain separate threats even at equilibrium.\n\n§YChoices§!\nChoose \"$SHL_d_state_furnaces_law$\" or \"$SHL_d_concessions_law$\", then an armaments or construction directorate. \"$SHL_directorate_prog_ending_a$\" improves production and administration; \"$SHL_directorate_prog_ending_b$\" supports army organisation and defence. Railways, a furnace bank, fuel depots and factory programmes provide material preparation.\n\n§YNeighbours and ending§!\nWater rights, sea access and the Iron March pursue regional subordination. \"$SHL_south_last_pour$\" prepares the southern war. After victory, \"$SHL_d_general_governorate$\" integrates eligible subjects under state administration. Choose southern railways or garrisons, then \"$SHL_d_iron_crown$\"; further focuses entrench the directorate and Nur's scientific legacy. Common war requirements are on the last page."
 SHL_startup_path_3_title:0 "Safir's Regency"
 SHL_startup_path_3:0 "§YTHE COUNCIL OF CRESTS§!\n\nThis route opens through a crisis of the houses. When the crests dominate the Conclave and issue an ultimatum, you can hand the seal to Darius Safir.\n\nThe regency restores aristocratic privileges and builds power on pledges, private armies and debt. Decide how to restore the houses and who commands their armed strength.\n\nSouthern policy turns debt and dynastic ties into submission. Victory distributes land as fiefs, leading to an Empire of Debts or Crests and the Crown of Crests.\n\nReveal spoilers for the ultimatum, transfer of power and restrictions on switching courses."
 SHL_startup_path_3_details:0 "§YREGENCY: BRINGING SAFIR TO POWER§!\n\n§YPrepare two conditions§!\nYou need an active house ultimatum and the \"$SHL_balance_crests_dominance$\" range. A mere crest advantage is insufficient. An ultimatum starts at a production-cycle check with house pressure of at least 60, once the respite after the previous crisis has ended.\n\nA new ultimatum can arise before ratification, under the cities or under the directorate. A ratified houses' course does not start a new one. An unfinished tenth furnace, urban reforms and seized furnaces increase house pressure. Keep the balance from drifting towards the quarters: \"$SHL_heralds_table$\" and receptions help the balance, but receptions also lower pressure.\n\n§YThe choice§!\nIn \"$ADISCORD_SHL.30.t$\", choose \"$SHL_back_crests$\". With the conditions met, you need not fail the mission. Alternatively, choose \"$ADISCORD_SHL.31.a$\" in \"$ADISCORD_SHL.31.t$\". Waiting alone does not guarantee the regency: the active crisis and dominance range are still required. Safir replaces the government and loads the regency tree. You cannot enter from the commune or return to an open course afterwards.\n\n§YChoices and ending§!\nChoose restored privileges or a new crest registry, private armies or a regent's guard. \"$SHL_regency_prog_ending_a$\" strengthens military support; \"$SHL_regency_prog_ending_b$\" favours trade and administration. Pledges and concessions supply funds but require debt management.\n\n\"$SHL_south_war_of_arms$\" prepares the southern campaign. Victory opens \"$SHL_r_fiefs_of_the_south$\", tying integration to income and new debt. The Empire of Debts or Crests leads to \"$SHL_r_crown_of_crests$\" and \"$SHL_r_regent_forever$\"."
 SHL_startup_path_4_title:0 "Commune of Fire"
 SHL_startup_path_4:0 "§YTHE SHIFT COUNCILS RULE§!\n\nThe commune emerges from a strike while the quarters dominate. Hand power to the shift councils: Nur retires and the furnaces become the foundation of workers' self-government.\n\nChoose delegates or a standing council, worker ownership or rotating smelting. A common treasury, shared supplies and workshop cooperation support production and armed shifts.\n\nIn the South, seek allies among councils and oil workers. Victory unites councils and offers oil or furnace development, culminating in the Fire of the South.\n\nReveal spoilers for strike conditions, quarter dominance and the exact transition choice."
 SHL_startup_path_4_details:0 "§YCOMMUNE: FROM STRIKE TO COUNCILS§!\n\n§YPrepare two conditions§!\nYou need an active cold shift and the \"$SHL_balance_quarters_dominance$\" range. A mere quarter advantage is insufficient. A strike starts at a production-cycle check with unrest of at least 60, once the respite after the previous strike ends.\n\nIntensified shifts, unregistered quarters and idle furnaces raise unrest. Civic support, arbitration and operating chartered furnaces lower it. Use \"$SHL_quarter_listening$\" and furnace transfers to strengthen the quarters politically. Unrest alone cannot replace dominance on the balance.\n\n§YThe choice§!\nIn \"$ADISCORD_SHL.20.t$\", choose \"$SHL_back_shift_councils$\". You can enter during the first strike without failing negotiations. Another entry is \"$ADISCORD_SHL.21.t$\" with \"$ADISCORD_SHL.21.a$\", under the same conditions. Paying demands or suppressing the strike can close it; force also shifts the balance towards the crests.\n\nEntry is possible before ratification or from any of the three open courses, but not from the regency. Nur retires, the Shift Council becomes the anarchist leader and Salima Darzi joins the cabinet. The commune tree loads. There is no return to an open course or switch to regency.\n\n§YChoices and ending§!\nChoose delegates or a standing council, worker ownership or rotating smelting. \"$SHL_commune_prog_ending_a$\" supports mobilisation and stability; \"$SHL_commune_prog_ending_b$\" improves production efficiency.\n\nCouncils abroad and the Svetlogorye underground lead to \"$SHL_south_oil_uprising$\". After victory, \"$SHL_k_union_of_councils$\" integrates eligible subjects. An oil or furnace commune leads to \"$SHL_k_no_more_crests$\" and \"$SHL_k_fire_of_the_south$\". The war follows the common preparation rules on the last page."
 SHL_startup_path_5_title:0 "Crises and the southern war"
 SHL_startup_path_5:0 "§YFROM CONCLAVE TO SOUTHERN WAR§!\n\nA provisional focus selects one of three open courses. Ratification confirms it and loads a separate tree. Regency and commune enter through crisis events and can interrupt an open course.\n\nChanging trees does not remove furnace management: you still need materials, repairs and programme funding. Each course has its own ways to gather neighbours, prepare an army and use victory.\n\nThe War for the South follows the resource settlement and preparation of both sides, no earlier than 2165. Choosing a political course alone is insufficient.\n\nReveal spoilers for transition limits, preparation focuses and the declaration sequence."
 SHL_startup_path_5_details:0 "§YCOMMON ROUTE RULES§!\n\n§YChoice and ratification§!\n\"$SHL_new_house$\", \"$SHL_open_conclave$\" and \"$SHL_nur_directorate$\" are mutually exclusive provisional choices. Ratification requires the matching chain, \"$SHL_workers_charter$\" and the appropriate balance range; cities also need civic support. The tenth furnace is a separate construction project. Completed preparations survive tree replacement.\n\n§YCrisis transitions§!\nRegency and commune need an active crisis and dominance of the corresponding Conclave side, not merely high pressure or unrest. After a crisis closes, a new check must wait four production cycles. A hidden course can replace an open one, but regency and commune cannot switch into each other. Incompatible paid operations close under their unused-payment refund rules.\n\n§YDevelopment and neighbours§!\nThe production cycle lasts 28 days: maintain supplies, repairs and furnace obligations. Focuses unlock paid programmes that must still be started through decisions. House or quarter demands continue after ratification. Neighbour-consolidation campaigns have their own missions and deadlines; treaties, alliances, subjugation and military victory are distinct results. Check the current campaign objective in \"$SHL_quarters_and_borders$\".\n\n§YWhen the great war arrives§!\nShahrabad needs \"$SHL_conclave_rules$\", \"$SHL_metal_market$\" and \"$SHL_conclave_army$\". The northern side must also prepare, while the resource question and related story wars must be settled. The common crisis opens no earlier than 2165, followed by a 56-day warning. Your course's war focus prepares an order and its special support without bypassing the warning. Skipping the focus does not cancel automatic war once the common conditions are met.\n\n§YAfter victory§!\nThe shared \"$SHL_south_crown_of_the_south$\" opens your course's victory epilogue. Integration affects only eligible subjects and follows the consent, cost or consequences of your policy."
