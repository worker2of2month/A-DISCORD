 SHL_status_veyr_union: "Trade union with Veyr."
 SHL_status_veyr_harbour: "The Kerdan harbour bypasses the Veyr duty."
 SHL_status_veyr_taken: "Noran and Kassen have passed to Shahrabad."
 SHL_status_veyr_quiet: "No duty."
 SHL_status_keizan_war: "§RKeyzan is advancing on the Zarkhan District.§!"
 SHL_status_keizan_deadline: "§RThe ultimatum is running out.§!"
 SHL_status_keizan_paid: "The ration has been paid; the Assembly will return with a new demand."
