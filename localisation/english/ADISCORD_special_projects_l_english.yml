l_english:
 ADISCORD_sp_combat_robots:0 "Autonomous Combat Robots"
 ADISCORD_sp_combat_robots_desc:0 "An armoured walking machine with autonomous fire control. Unlocks a separate combat robot production line and robotic battalions; ordinary infantry weapons cannot replace the robots."
 ADISCORD_combat_robots:0 "Combat Robots"
 ADISCORD_combat_robots_desc:0 "A battalion of 100 combat robots and 250 operators, technicians and logistics personnel. Requires separately manufactured robots and 20 support equipment kits."
 ADISCORD_combat_robot_equipment:0 "Combat Robots"
 ADISCORD_combat_robot_equipment_short:0 "Combat Robots"
 ADISCORD_combat_robot_equipment_desc:0 "Autonomous armoured machines with integrated weapons and control electronics. Manufactured separately for robotic battalions using rare components and alloys."
 ADISCORD_combat_robot_equipment_1:0 "CR-61 Guardian"
 ADISCORD_combat_robot_equipment_1_short:0 "CR-61"
 ADISCORD_combat_robot_equipment_1_desc:0 "A production combat robot with an armoured chassis, twin automatic weapons and a protected control core. Human personnel provide maintenance, targeting and logistics."
 ADISCORD_sp_power_shields:0 "Power Shields"
 ADISCORD_sp_power_shields_desc:0 "A portable power shield protects an assault team moving between cover and entering defended buildings. The project unlocks shield production, shield infantry recruitment and further upgrades in the technology tree. Kefreyt, the Party and Shabrat can also complete it through their national focuses."
 ADISCORD_power_shields_template_tt:0 "Creates an editable §YShield Assault Division§! template: §Y10§! shield battalions, engineers and support artillery. Combat width: §Y20§!; establishment: §Y10600§! £manpower_texticon. Recruitment consumes national stockpiles, including §Y200§! power shields."
 ADISCORD_sp_requires_hardened_computers_tt:0 "Has researched §Y$ADISCORD_tech_hardened_computers$§! (§Y$electronics_folder$§! tab, §Y$ADISCORD_TECH_BRANCH_COMPUTING$§! branch, 2160)"
 ADISCORD_sp_requires_automated_assembly_tt:0 "Has researched §Y$ADISCORD_tech_automated_assembly$§! (§Y$industry_folder$§! tab, §Y$ADISCORD_TECH_BRANCH_PRODUCTION$§! branch, 2161)"
 ADISCORD_sp_requires_heavy_composite_cores_tt:0 "Has researched §Y$ADISCORD_tech_heavy_composite_cores$§! (§Y$armour_folder$§! tab, §Y$ADISCORD_TECH_BRANCH_HEAVY_ARMOR$§! branch, 2158)"
