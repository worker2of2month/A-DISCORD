 TFF_Colt_Ardent: "Colt Ardent"
 TFF_Colt_Ardent_desc: "A Free Rifle field commander. The communes give him a limited wartime mandate against Nodrul: coordinate supply and defence without replacing the assembly."
 YPR_The_Ruling_Council: "Ruling Council"
 APH_Urgan_Bloodtooth: "Urgan Bloodtooth"
