 OSF_Tiber_Marrowkeeper: "Tiber the Bonekeeper"
 CIN_Aska_Smokevein: "Aska Smokevein"
 BOR_Elena_Borey: "Evgeny Borey"
 BOR_Elena_Borey_desc: "Evgeny Borey coordinated Itoran hospital columns before the scattered settlements declared themselves a republic. He knows how to negotiate with Itora, local elders and military outposts, but every new agreement reminds Boreya how much its security depends on its eastern neighbour."
 DOL_Marko_Doln: "Marko Doln"
 DOL_Marko_Doln_desc: "Marko Doln did not found a state: he persuaded five road districts to repair bridges at the same time and recognise the same weights and measures. The union rests on the usefulness of common administration and may fall apart if the centre demands more from the communities than it returns in roads and security."
 RIN_Alaric_IV_Ren: "Alaric IV Ren"
 RIN_Alaric_IV_Ren_desc: "Alaric IV kept his throne by promising Montera loyalty to the northern crown and Vorkerland merchants the inviolability of their old charters. Both sides consider him a temporary ally, so the palatine has made the palace guard the only institution he trusts without reservation."
 KRM_Ivo_Kremen: "Ivo Kremen"
 KRM_Ivo_Kremen_desc: "After the Outer Screen fell apart, Ivo Kremen brought mine managers, hauliers and urban shareholders together in the Industrial Chamber. He judges decisions by tonnage, deadlines and jobs preserved, leaving questions of justice to those who can express them in a production plan."
 LMN_Vera_Lemann: "Viktor Lemann"
 LMN_Vera_Lemann_desc: "Viktor Lemann commanded the southern sector of the Outer Screen. When Vorkerland stopped sending orders and pay, he took control of Leman's screening checkpoints and turned temporary instructions into the laws of a new cordon."
 RLY_Relay_Assembly_17: "Releyn Station Council"
 RLY_Relay_Assembly_17_desc: "Releyn has no sole ruler. Shift supervisors, purification engineers and archive keepers sit on the Station Council, jointly approving emergency protocols and the use of the surviving infrastructure."
 WCG_Edgar_Raut: "Edgar Raut"
 WCG_Edgar_Raut_desc: "Edgar Raut has never called himself a ruler. His office is chief commandant, his capital a chain of headquarters carriages, and his authority begins where a person's right to pass ends. Vorkerland charged him with receiving refugees, contaminated cargo and everything the centre does not wish to see near its own cities."
 BRN_Emilia_Brandt: "Emil Brandt"
 BRN_Emilia_Brandt_desc: "Emil Brandt turned a chain of weather stations, radio masts and warehouses into a single administration. In Brayn an order is valued for its ability to reach the remotest garrison before a storm, rather than its solemn wording."
 KRL_Edvard_Karel: "Edvard Karel"
 KRL_Edvard_Karel_desc: "King Edvard Karel holds the island jarldoms together through marriages, grants and personal control of the ice ports. His court is extravagant, but the frontier warbands know how to survive winter where a regular army loses its roads."
 VRA_Alrik_Varn: "Alrik Varn"
 VRA_Alrik_Varn_desc: "Alrik Varn represents the councils of two remote islands connected by lighthouses, families of pilots and a shared rescue fleet. The union has no ambition to govern the mainland and asks its neighbours only for free passage through the northern straits."
 FRS_Mikael_Frost: "Mikael Frost"
 FRS_Mikael_Frost_desc: "Mikael Frost presides over a congress of districts that recognise a common budget only for roads, rescue services and defence. The federation is stable in everyday life, but slow to gather its strength for a major war."
 KHV_Ilva_Havren: "Ivar Havren"
 KHV_Ilva_Havren_desc: "Ivar Havren heads a college of geologists and power engineers that grew around deep geothermal wells. The conclave supplies the cities with energy, but measures society's needs with the same tables it uses for pressure in the pipes."
 SRV_Eira_Sarven: "Eira Sarven"
 SRV_Eira_Sarven_desc: "Eira Sarven coordinates a long chain of island stations, where every harbour depends on shared maintenance of roads, generators and radio masts. The college values measurable results, but leaves little room for politics outside its technical commissions."
 ELN_Taal_Elander: "Taal Elander"
 ELN_Taal_Elander_desc: "Taal Elander built his authority on a comprehensive census of workshops, stocks and labour brigades. His directorate is efficient as long as real life matches its reports, and ruthless towards anyone who does not fit them."
 AUR_Sofia_Aurell: "Stefan Aurell"
 AUR_Sofia_Aurell_desc: "Stefan Aurell secured equal representation for mountain and coastal communities. The republic is richer than its neighbours in institutions rather than weapons, and hopes to preserve peace through treaties and a trained militia."
 HON_Honter_Woke: "Honter Woke"
 HON_Honter_Woke_desc: "Honter Woke became the compromise candidate of road communes, trade unions and town councils. He expanded provincial participation in government without allowing endless debate to halt the country's reconstruction."
 SVL_Marta_Seval: "Marta Seval"
 SVL_Marta_Seval_desc: "Marta Seval secured the island's independence after years of disputes over mining taxes and supplies. Her republic is small, but its communities control mining, warehouses and coastal defence without a distant Honorian administration."
 NVR_Leif_Norven: "Leif Norven"
 NVR_Leif_Norven_desc: "Leif Norven coordinates districts whose roads change every year with floods and snow. The federation avoids grand doctrines and supports only institutions that have proved their practical value."
 SKN_Ren_Skad: "Ren Skad"
 SKN_Ren_Skad_desc: "Marshal Ren Skad united the garrison districts after a series of border raids. His system can call up reservists quickly, but subordinates the civilian economy to the demands of military headquarters."
 TMR_Mira_Timer: "Miron Timer"
 TMR_Mira_Timer_desc: "Miron Timer allocates funds among the districts according to the measurable returns from roads, schools and workshops. The chamber knows how to economise, but struggles to understand projects whose benefits will take a generation to appear."
 LYS_Cassian_Lys: "Cassian Lys"
 LYS_Cassian_Lys_desc: "Cassian Lys represents the houses that control warehouses, crossings and credit along the northeastern coast. The league welcomes trade as long as its rules preserve the profits of the established companies."
 KDL_Oren_Kadel: "Oren Kadel"
 KDL_Oren_Kadel_desc: "Oren Kadel presides over the chamber of two island ports that refused to surrender local dues to Lismar's trading houses. The republic lives on coastal shipping, ship repairs and cautious agreements with anyone able to protect the sea lanes."
 VES_Oskar_Vest: "Oskar Vest"
 VES_Oskar_Vest_desc: "Oskar Vest linked four vast districts through a chain of outposts and road obligations. Vestmar has a small population, but its defence rests on positions prepared in advance."
 DRV_Council_of_Free_Valleys: "Assembly of Free Valleys"
 DRV_Council_of_Free_Valleys_desc: "Draven has no permanent government: delegates from the valleys assemble to repair roads, settle disputes and organise common defence. This system struggles with prolonged centralisation, but leaves almost no room for a distant bureaucracy."
 ORV_Anton_Orval: "Anton Orval"
 ORV_Anton_Orval_desc: "Anton Orval sustains a coalition of towns, farming districts and transport cooperatives by promising each only what can be achieved. The union rarely moves quickly, but does not squander its strength on unattainable goals."
 ARS_Lina_Arsal: "Linus Arsal"
 ARS_Lina_Arsal_desc: "Linus Arsal united the eastern districts after the Orval Union broke apart. The republic rests on an elected National Chamber, a cautious budget and independent local administrations."
 VLD_Irma_Vald: "Irvin Vald"
 VLD_Irma_Vald_desc: "Irvin Vald represents three southern communities for whom protecting oil depots and the coastal road matters more than the politics of the Orval Union. The new council is small, but can quickly rally a militia around its sole industrial centre."
 MON_Marius_II_Arken: "Marius II Arken"
 MON_Marius_II_Arken_desc: "Marius II ended the War of Five Banners and declared Montera the heir to every northern crown. The emperor relies on a professional army, a belt of arsenals and a rigid hierarchy of peoples: full rights belong to the imperial heartland, while conquered lands must serve its greatness."
 KDR_Rashid_al_Kadir: "Rashid al Kadir"
 KDR_Rashid_al_Kadir_desc: "Rashid al-Kadir subordinated the caravan warbands to the Solar Throne and declared the main road Kadir's sacred axis. Trade, guards and tribute now serve a single authority."
 RHM_Faris_Rahma: "Faris Rakhma"
 RHM_Faris_Rahma_desc: "Faris Rakhma was elected first voice of the Circle of Wells, an open assembly of the red-earth towns and river settlements. His authority rests on the consent of the communities, rather than a right to own water."
 SDR_Hamid_Sahr: "Hamid Sahr"
 SDR_Hamid_Sahr_desc: "Hamid Sahr linked the settlements along a winding dry riverbed through a network of patrols and mutual obligations. The union recognises only rules that help it survive another season of dust storms."
 MZR_Ration_Assembly: "Assembly of Distributors"
 MZR_Ration_Assembly_desc: "Mazar has subordinated its economy to a simple principle: every drop must bring the greatest benefit to the greatest number. Settlement representatives choose distributors according to their record in managing reserves and water carriers."
 KYZ_Qanat_Assembly: "Assembly of Irrigation Communities"
 KYZ_Qanat_Assembly_desc: "The settlements of Keyzan recognise no permanent capital. Delegates gather at the main water catchment only to settle disputes over canals, pastures and common defence."
 SHL_Jalil_Nur: "Jalil Nur"
 SHL_Jalil_Nur_desc: "Jalil Nur represents Shahrabad's nine richest industrial houses. Behind the symmetrical golden gates of the conclave, they divide raw materials, markets and privileges denied to the workers' quarters."
 GLP_Miran_Veyr: "Miran Veyr"
 GLP_Miran_Veyr_desc: "Miran Veyr represents the coastal trading houses and the capital's ship repair companies."
 AZH_Samir_Azhar: "Samir Azhar"
 AZH_Samir_Azhar_desc: "Samir Azhar turned the red districts around the Black Basin into a single military directorate. The golden ring on its banner symbolises the centre's authority over the land, garrisons and fuel stocks."
 WEF_Elina_Fenn: "Elina Fenn"
 WEF_Elina_Fenn_desc: "After the break with Eflor, Elina Fenn united road crews, municipalities and warehouses around a measurable reconstruction programme. Each project is judged by how many people it will connect and supply."
