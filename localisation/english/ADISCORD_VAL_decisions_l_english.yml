 VAL_steel_title_victory: "Arsenals after Victory"
 VAL_steel_title_review: "Revise Our Commitments"
 VAL_stelander_status_defeated: "Kefreyt has been defeated. Its former foreign-policy programme is closed."
 VAL_stelander_status_secured: "The Occidian base is secured. Contract administration and later integration can proceed once their focus conditions are met."
 VAL_stelander_status_repelled: "The Occidian campaign ended in defeat. Selecting military intervention alone does not grant victory rewards."
 VAL_stelander_status_campaign: "War with the Occidian Revival Union is underway. The result is determined by the war, not by completing a focus."
 VAL_stelander_status_mobilizing: "The 21-day mobilisation against Occidia is underway. Supplies to the resistance do not cancel this separate campaign."
 VAL_stelander_status_settled: "The Occidian campaign has been settled. Final rewards depend on fulfilled deliveries and territory actually secured."
 VAL_stelander_status_neutral: "Neutrality has been chosen: weapons and troops stay at home. This choice closes the supply and intervention routes."
 VAL_stelander_status_civil_war: "The resistance is fighting the party government. Deliveries require buyer consent and sufficient resources. Orders for the Occidian campaign cannot be given before day 60 after the split and require a separate mobilisation."
 VAL_stelander_status_aftermath: "The Stelander civil war is no longer active. Civil-war deliveries are closed; a separate Occidian campaign depends on the current conditions."
 VAL_stelander_status_prewar: "The Stelander civil war has not begun. The crisis focus branch opens when hostilities start."
 VAL_arms_desc_delivered: "The deliveries have been paid for and fulfilled. We will consolidate the experience and prepare production contracts. This focus does not deliver the same weapons twice or reopen a completed deal."
 VAL_arms_desc_war: "While the resistance fights the party government, we can offer weapons or contract formations. The buyer must accept the price; existing stocks and prepared units are transferred. These deliveries remain compatible with a separate campaign against Occidia."
 VAL_arms_desc_aftermath: "We will review our chosen trade policy and use its field reports. New deliveries under the civil-war programme are no longer available. Industrial expansion requires a fulfilled contract or a secured Occidian base."
 VAL_passes_desc_secured: "The Occidian base is under our administration. We will consolidate field reports and prepare to formalise the gains. This focus does not start the war again; contract administration and integration are handled separately."
 VAL_passes_desc_review: "The military campaign has ended. We will reconcile its expenses and field reports. Choosing intervention does not itself constitute victory or grant a claim to foreign territory."
 VAL_passes_desc_war: "The Occidian campaign is underway. We will coordinate the staffs and consolidate combat experience. Peace and territorial gains depend on the actual military result."
 VAL_passes_desc_prepare: "Prepare the command for a separate war against the Occidian Revival Union. Orders for a 21-day mobilisation become available 60 days after the Stelander split while the intervention window remains open. Victorious Stelander may begin its own preparations 90 days after the civil war ends, temporarily closing our window. Victory establishes a contract administration over secured districts; the Livonin agreement is settled separately without taking third-party land."
 VAL_stelander_focus_unlocked_tt: "§YThe Stelander crisis focus branch is now visible.§! The opening focus takes §Y14 days§!, followed by supply, mountain-operation or reserve policies taking §Y21 days§! each. Earlier government commitments constrain the choice. Titles and descriptions follow the current situation; the aftermath branch remains visible when the civil war ends.\n\n[ROOT.VALGetStelanderCrisisStatus]"
 VAL_stelander_focus_current_status_tt: "[ROOT.VALGetStelanderCrisisStatus]"
 VAL_nod_ultimatum:0 "Nodrul ultimatum: 100 days"
 VAL_nod_ultimatum_desc:0 "Nodrul demands an end to the northern expedition. Kefreyt has 100 days from receipt to defeat every participating cannibal ally and secure the territorial objective. Defeating one ally is not enough. Success closes the threat. Otherwise Nodrul joins their existing war; a victorious Stelander party allied with Nodrul may follow. Peace, Kefreyt subjugation or removal of the Nodrul threat cancels the mission."
 VAL_nod_ultimatum_success_tt:0 "The northern coalition is defeated. Nodrul intervention is averted and campaign settlement follows."
 VAL_nod_ultimatum_timeout_tt:0 "If the northern coalition remains undefeated, Nodrul joins its war against Kefreyt. The clock begins on delivery, not when this option is selected."
 val_rework.118.t:0 "Nodrul’s Ultimatum"
 val_rework.118.d:0 "Nodrul has demanded an end to Solgalov’s northern expedition. The demand carries a direct threat: if the war drags on, Nodrul will intervene on the cannibals’ side.\n\nHeadquarters has one hundred days from delivery to defeat the entire participating northern alliance. The fall of a single member is insufficient. Nodrul will not enter this war under the ultimatum before the deadline.\n\nThe clock has already started. Delaying this reply will not extend it."
 val_rework.118.a:0 "Inform headquarters."
 VAL_nod_ultimatum_objective_tt:0 "Every participating northern tribe is defeated and the territorial objective is secured. A liberated ally must be defeated again."
 VAL_nod_ultimatum_cancel_tt:0 "The campaign ends, Kefreyt capitulates or loses independence, or Nodrul can no longer maintain this threat."

 VAL_subcontract_quarterly_norm:0 "Subcontract the quarterly order"

 VAL_subcontract_quarterly_norm_desc:0 "Pay independent workshops 1000 treasury to fulfil the order. Our rifles stay in reserve and reputation is preserved. This option provides neither a reputation increase nor military experience. It closes the other payment option for this quarter."

 VAL_quarterly_delivery_result_tt:0 "At quarter end: §G+1§! reputation tier (up to maximum), §G15§! army experience and §G15§! command power. This quarter cannot be paid twice."

 VAL_quarterly_subcontract_result_tt:0 "Subcontractors fulfil the order: reputation is preserved without military rewards. The current quarterly deadline is unchanged."

 VAL_reclamation_industrial_sites:0 "Industry on recovered land"

 VAL_reclamation_industrial_sites_desc:0 "Reclamation must bring jobs back. Recovered and registered land can receive funded contracts for two civilian factories. Each region receives its own contract, allowing several sites to be developed at once."

 VAL_reclamation_industry:0 "Develop recovered industrial sites"

 VAL_reclamation_industry_desc:0 "After all three reclamation stages, invest 1000 treasury for 60 days: two building slots and two civilian factories. Requires ownership, control and at most 18 civilian factories. Losing eligibility refunds the deposit in full. One industrial contract per region."

 VAL_reclamation_industry_result_tt:0 "The target region gains §G2§! building slots and §G2§! civilian factories. Other regions may develop in parallel."
 VAL_focus_reclamation_roads_preview_tt:0 "§YWhat the decision does:§! starts a §Y90-day§! cleanup in a polluted state for £ADISCORD_economy_treasury_texticon §Y500§!. On completion: §G+1§! infrastructure (or §G+1§! building slot at the cap) and one third of the original pollution penalties are offset."
 VAL_focus_reclamation_water_preview_tt:0 "§YWhat the decision does:§! after road clearance, starts a §Y90-day§! water-and-soil cleanup for £ADISCORD_economy_treasury_texticon §Y500§!. On completion: §G+2§! building slots and pollution-penalty compensation rises to two thirds."
 VAL_focus_reclamation_settlement_preview_tt:0 "§YWhat the decision does:§! after cleanup, starts a §Y90-day§! resettlement stage for £ADISCORD_economy_treasury_texticon §Y500§!. On completion pollution penalties are fully removed, the state gains §G+1§! building slot and §G+1§! civilian factory if it has fewer than 20."
 VAL_focus_reclamation_industry_preview_tt:0 "§YWhat the decision does:§! after full reclamation, invest £ADISCORD_economy_treasury_texticon §Y1000§! for §Y60 days§! to add §G+2§! building slots and §G+2§! civilian factories in the selected state."

 VAL_reclamation_stage_1_tt:0 "At least one owned and controlled region has completed road works."

 VAL_reclamation_stage_2_tt:0 "At least one owned and controlled region has completed water treatment."

 VAL_reclamation_stage_3_tt:0 "At least one owned and controlled region has completed all three reclamation stages."

 VAL_cost_treasury1000:0 "£ADISCORD_economy_treasury_texticon §Y1000§!"

 VAL_cost_treasury1000_blocked:0 "£ADISCORD_economy_treasury_texticon §R1000§!"

 VAL_cost_treasury1000_tooltip:0 "£ADISCORD_economy_treasury_texticon §Y1000§!"

 VAL_reclamation_industry_refund_tt:0 "Industrial development is cancelled: 1000 treasury is refunded to Kefreyt. Reclamation is retained."

 VAL_QUARTERLY_SUBCONTRACTED:0 "§GFulfilled: subcontracted order.§! Reputation will be preserved at quarter end."

 VAL_QUARTERLY_DELIVERED:0 "§GFulfilled: arsenal delivery.§! Military rewards and reputation are granted at quarter end."

 VAL_QUARTERLY_PENDING:0 "§YOrder not yet fulfilled.§!"

VAL_reclamation_industry_available_tt:0 "We own and control the region, all three reclamation stages are complete, and it has at most 18 civilian factories."

 VAL_negotiate_yubora:0 "Negotiate Yubora's future"
 VAL_negotiate_yubora_desc:0 "The Frontier survived the northern war, but Yuboria remains under Nodrul. Propose a joint campaign and a division of postwar authority: two Yuborian administrations under the Frontier and two Nodrul administrations under Kefreyt. The agreement can also be concluded during the war."
 VAL_nod_frontier_offer_possible_tt:0 "The Frontier is independent, at peace with Kefreyt and outside Nodrul's faction; Nodrul won the northern war and holds Yuboria."
 VAL_nod_frontier_no_pending_tt:0 "No pending Frontier negotiations or another operation in preparation."
 VAL_nod_frontier_terms_tt:0 "The Frontier will join Kefreyt in its war against Nodrul. After victory, the two Yuborian contract administrations of Iskhait and Duchebia pass under Frontier protection. The Nodrul Protectorate and Esnos Administration remain under Kefreyt. The transfer requires an independent Frontier at peace with Kefreyt."
 VAL_frontier_refusal_war_tt:0 "The Frontier will declare war on Kefreyt. Kefreyt's contract administrations will join its side."
 val_contract.350.t:0 "Two sides of one treaty"
 val_contract.350.d:0 "Kefreyt is preparing an operation against Nodrul and proposes agreeing on Yubora's future before the fighting begins. Iskhait and Duchebia would enter the Frontier's sphere, while Ashiya, Kussington and Esnos would come under Kefreyt's contract rule.\n\nThis is not a promise of a united Yubora. Two local administrations would share our protection and answer to us in foreign affairs. Refusing preserves our right to demand different terms after the war, with no assurance that Kefreyt will then concede. Acceptance commits the Frontier to join Kefreyt when its operation against Nodrul begins, or immediately if the war is already under way."
 val_contract.350.refuse:0 "We will not endorse this partition in advance."
 val_contract.350.accept:0 "Reserve both Yuboran administrations for the Frontier."
 val_contract.351.t:0 "The Frontier replies"
 val_contract.351.accepted:0 "The Frontier accepted the agreement and pledged to join Kefreyt in the war against Nodrul. After victory, Iskhait and Duchebia will pass under its protection. The Nodrul Protectorate and Esnos Administration will remain under Kefreyt.\n\nThe Frontier joins immediately if Kefreyt is already at war with Nodrul; otherwise it will enter when the operation begins. No territory changes hands in advance: the agreement determines who will govern it after victory."
 val_contract.351.refused:0 "The Frontier has declined the preliminary agreement. Kefreyt may prepare the operation alone. Victory will not settle the Yuboran question: the Frontier may later demand both Yuboran administrations."
 val_contract.351.a:0 "Account for this in our preparations."
 val_contract.352.t:0 "The Frontier demands Yubora"
 val_contract.352.d:0 "Nodrul has fallen, but the Frontier refuses to recognise Kefreyt as its successor in Yubora. Its envoys argue that the northern war gave Nodrul power over Yubora, not the right to pass it to the next victor.\n\nThe demand covers Iskhait and Duchebia. Their borders and local institutions would remain, under Frontier protection. Kefreyt would retain the Nodrul Protectorate and Esnos Administration.\n\nWe have twenty-one days to answer. Compliance ends the dispute peacefully; refusal means war with the Frontier. Without an answer, Kefreyt's delegation will sign the transfer."
 val_contract.352.accept:0 "Transfer both Yuboran administrations to the Frontier."
 val_contract.352.refuse:0 "We will not yield. Let them try."
 val_contract.352.obsolete:0 "The original terms no longer apply."
 val_contract.348.partition:0 "Four contract administrations replace Nodrul's unified system. Ashiya and Kussington remain in the Nodrul Protectorate; Esnos, Brioland and Treya receive a separate council. Yuboran government is divided between Iskhait and Duchebia.\n\nNodrul's royal insignia give way to the treaty flag with its northern sun and olive branch. Local institutions and surviving troops remain, but foreign affairs pass to the patrons. A signed agreement places both Yuboran administrations under the Frontier; without it, they remain under Kefreyt and their future may still provoke conflict."
 ECA:0 "Esnos Contract Administration"
 ECA_DEF:0 "the Esnos Contract Administration"
 ECA_ADJ:0 "Esnosian"
 DCA:0 "Duchebia Contract Administration"
 DCA_DEF:0 "the Duchebia Contract Administration"
 DCA_ADJ:0 "Duchebian"
 YPR_VAL_administration:0 "Yubora Contract Administration"
 YPR_VAL_administration_DEF:0 "the Yubora Contract Administration"
 YPR_VAL_administration_ADJ:0 "Yuboran"
 ECA_Contract_Council:0 "Esnos Treaty Council"
 DCA_Contract_Council:0 "Duchebia Treaty Council"
 YPR_Contract_Council:0 "Iskhait Treaty Council"

 VAL_Company_Mandates:0 "Company Representation"
 VAL_Company_Mandates_desc:0 "Company commanders sell military service, but their rights cannot be renegotiated with every dispute. Delegates elected by the companies will present their common demands to the government. A standing procedure for negotiation will strengthen the political influence of the contract state."
 VAL_Contract_Arbitration:0 "Contract Arbitration"
 VAL_Contract_Arbitration_desc:0 "Disputes over pay and service must not turn into insubordination. A joint arbitration commission representing the state and the companies will hear claims and issue binding rulings. Acceptance of those rulings will give the government lasting support among the mercenaries."

 VAL_Armored_Design_Bureau:0 "Armored Vehicle Design Bureau"
 VAL_Armored_Design_Bureau_desc:0 "The companies need vehicles built for prolonged service and repairs far from the factories. A dedicated bureau at the arms combine will develop chassis, armor and weapons for a new generation of tanks."
 VAL_Serial_Armor_Production:0 "Serial Tank Production"
 VAL_Serial_Armor_Production_desc:0 "Each company orders its own vehicle and then struggles to find spare parts. Standard components and long-term orders will let our factories build armored vehicles in series at a lower cost."
 VAL_Tank_Crew_School:0 "Tank Crew School"
 VAL_Tank_Crew_School_desc:0 "Driver, gunner and commander must work as one crew. A training company and proving ground will prepare instructors and test new vehicles before they enter service."
 VAL_Armored_Contract_Companies:0 "Armored Vehicle Procurement"
 VAL_Armored_Contract_Companies_desc:0 "Secure long-term tank deliveries for the contract army. Agreed procurement plans will support larger production runs, while maintenance contracts establish common standards for spare parts and acceptance testing. Factories will be able to reduce vehicle costs without sacrificing reliability."
 VAL_armor_serial_production:0 "Serial Armor Production"
 VAL_armor_serial_production_desc:0 "Standard components and steady orders reduce the production cost of reconnaissance, combat and heavy armored platforms."
 VAL_armor_contract_production:0 "Armored Vehicle Contracts"
 VAL_armor_contract_production_desc:0 "Serial orders, standardized spare parts and mandatory acceptance testing reduce the cost of armored platforms and improve their reliability."

 VAL_final_war:0 "Final War: [ROOT.VALGetFinalEnemy]"
 VAL_final_war_desc:0 "[ROOT.VALGetFinalPhase]\nTension: §Y[?VAL_final_escalation|0]/100§!. It rises by §R5§! each peaceful week. At 100 war begins; negotiations reduce tension by 15. Other wars and unfinished northern operations pause its growth.\n\nSupplies: [ROOT.VALGetFinalSupply]\nReconnaissance: [ROOT.VALGetFinalRecon]\nReconnaissance preparation opens at 25 tension and expanded reserve contracts at 50. Prepared bonuses last through the crisis and war. If Nodrul and Stelander are allied, both participants must be defeated.\n\nRefugees can be admitted and trained in the population and grey markets category. Each regional campaign offers up to three waves; volunteer training takes 35 days."
 VAL_FINAL_ENEMY_COALITION:0 "Nodrul and Stelander"
 VAL_FINAL_ENEMY_NOD:0 "Nodrul"
 VAL_FINAL_PHASE_PREPARING:0 "§YPreparing for confrontation.§!"
 VAL_FINAL_PHASE_WAR:0 "§RThe war has begun.§!"
 VAL_FINAL_PHASE_VICTORY:0 "§GThe final campaign ended in victory.§!"
 VAL_FINAL_PHASE_CLOSED:0 "The crisis is over. Temporary military preparations have ended."
 VAL_FINAL_PHASE_WAITING:0 "Preparations will open after northern operations end if Nodrul remains an independent opponent."
 VAL_FINAL_PREPARATION_READY:0 "§Gready§!"
 VAL_FINAL_PREPARATION_MISSING:0 "not prepared"
 VAL_final_reduce_tension:0 "Reopen Negotiations with Nodrul"
 VAL_final_reduce_tension_desc:0 "Limited concessions and paid mediation will buy three weeks. At home, negotiations will be seen as a sign of weakness."
 VAL_final_reduce_tension_tt:0 "Tension falls by §G15§!, buying three additional weeks at its normal rate of growth."
 VAL_final_register_reserves:0 "Register the Reserves"
 VAL_final_register_reserves_desc:0 "Military commissioners will introduce limited conscription over 28 days. A higher existing law will never be downgraded. Political power is refunded on cancellation or if the law has already been raised."
 VAL_final_reserve_registration_tt:0 "After §Y28 days§!, introduce §YLimited Conscription§!. Cancellation or an already raised law refunds §Y150§! political power."
 VAL_final_stockpile_supplies:0 "Prepare Army Depots"
 VAL_final_stockpile_supplies_desc:0 "Purchase and distribute supplies for a sustained campaign. Preparation takes 35 days and continues if war starts earlier. Cancellation before delivery refunds the money."
 VAL_final_supply_preparation_tt:0 "After §Y35 days§!, army supply consumption falls by §G10%§! through the crisis and war. Cancellation refunds §Y500§! coins."
 VAL_final_supply_ready_tt:0 "Army supply consumption: §G-10%§! through the crisis and war."
 VAL_final_reconnaissance:0 "Survey the Offensive Routes"
 VAL_final_reconnaissance_desc:0 "Over 21 days, the staff will combine maps, intelligence reports and reconnaissance. Preparation improves planning and reveals information about Nodrul's army. Cancellation refunds the political power."
 VAL_final_reconnaissance_start_tt:0 "After §Y21 days§!: §G+20§! army intelligence on Nodrul and §G+15%§! planning speed through the crisis and war. Cancellation refunds §Y75§! political power."
 VAL_final_reconnaissance_ready_tt:0 "Planning speed: §G+15%§! through the crisis and war."
 VAL_final_expand_reserve_contracts:0 "Expand Reserve Contracts"
 VAL_final_expand_reserve_contracts_desc:0 "Offer emergency contracts to people outside the existing reserve. After 28 days, the recruitable population share rises by one percentage point. Emergency obligations end with the crisis and war."
 VAL_final_reserve_contracts_start_tt:0 "After §Y28 days§!: §G+1.00 percentage point§! recruitable population through the crisis and war. Cancellation refunds §Y100§! political power."
 VAL_final_reserve_contracts_ready_tt:0 "Recruitable population: §G+1.00 percentage point§! through the crisis and war."
 VAL_final_war_preparation:0 "Final War Preparations"
 VAL_final_war_preparation_desc:0 "Paid supply depots, reconnaissance and reserve contracts prepare Kefreyt for confrontation with Nodrul. Temporary bonuses end with the crisis and war."

 VAL_regional_administration_campaign:0 "Establish civil administration across all regions"
 VAL_regional_administration_campaign_desc:0 "A joint programme for all owned and controlled non-core states with compliance below 60 or resistance at least 20. For 50 political power, each eligible state immediately gains 15 compliance and loses 10 resistance. Available again after 90 days. States with an integration programme already in progress are excluded."

# Campaign briefing
 VAL_startup_country:0 "§YKEFREYT§!\n\nKefreyt lives by contracts, arsenals and the sale of force. Arms factories and mercenary companies give it influence far beyond its borders, but each new commitment needs payment and supply.\n\nBehind industrial power lie a weak social foundation, the consequences of earlier wars and commanders with interests of their own. The state must bind these forces to shared obligations, or yield once more to private arrangements.\n\n§YFirst priorities§!\nStrengthen the contract system, review the budget and check army requirements. In the north, a choice awaits between closer trade and a policy of pressure. Arms production only pays off when routes and customers can be relied upon."
 VAL_startup_guide:0 "§YBack every contract with resources§!\n\nWatch contract authority and budget capacity. Strong industry does not remove the cost of maintaining an army and internal administration.\n\nDevelop trade routes and check which corridors are actually working. Their condition depends on access to territory and infrastructure; a road opened in the past does not guarantee permanent turnover.\n\nBefore an arms deal, check stockpiles and the recipient. Sold equipment will no longer be available to reinforce your own units. Grey-market brokers may offer short-term gains, but a growing shadow market has consequences.\n\nThe northern trade and coercion branches are mutually exclusive. In both cases, later operations are unlocked through focuses and paid for under the decision requirements.\n\n§YExpansion is in the centre below $VAL_Contracts_Outlive_Kings$.§! Start with $VAL_frontier_conference$, prepare logistics and choose an administration; $VAL_frontier_security_plan$ then opens the northern ultimatum through decisions. Earlier northern or Occidian contracts also allow entry; the Stelander civil war does not block this northern branch."
 VAL_startup_path_0_title:0 "Trading Partners"
 VAL_startup_path_1_title:0 "October of 2160"
 VAL_startup_path_0:0 "§YTRADING PARTNERS§!\n\nExpand northern influence through trade relations and contract institutions. This choice strengthens the economic side of cooperation and leads to further engagement with northern neighbours.\n\nThe route favours a gradual expansion of state capacity through trade, production and paid operations. It does not automatically bring peace with every neighbour.\n\nChoosing it closes the alternative northern branch, October of 2160."
 VAL_startup_path_1:0 "§YOCTOBER OF 2160§!\n\nBack contract policy with force and a willingness to exert pressure in the north. This choice strengthens the military side of the course, while troops still need supplies and later operations still require payment.\n\nThe branch does not replace scripted war-entry requirements: concrete actions remain tied to their focuses, decisions and events.\n\nChoosing it closes the alternative northern branch, Trading Partners."
 VAL_startup_path_0_details:0 "§YTRADE: OPENING THE BRANCH§!\n\nAfter Market Roads North, choose Trading Partners. The alternative October of 2160 focus becomes unavailable.\n\nThe shared Different Views on Freedom focus then continues the northern route. The trade choice grants a treasury reward there; the shared focus itself unlocks operations to fund contacts with northern neighbours. Their prices and availability are checked separately.\n\nThis is a choice of northern policy, not a button for choosing a side in the Stelander civil war. Intervention in Stelander has its own story chain."
 VAL_startup_path_1_details:0 "§YPRESSURE: OPENING THE BRANCH§!\n\nAfter Market Roads North, choose October of 2160. It excludes Trading Partners and provides military preparation, including artillery and war support.\n\nThe shared Different Views on Freedom focus then grants command power and war support for this course, while unlocking operations with northern contacts. Choosing the branch does not pay the decisions' own costs.\n\nCompany military specialisations and participation in the Stelander conflict are determined by other focuses and events. This choice is not an immediate declaration of war."
 VAL_Balchansk_Charter:0 "Balchansk Charter"
 VAL_Balchansk_Charter_desc:0 "Establish chartered administration in Balchansk instead of directly integrating Occidia. The administration receives its own charter and political resources, while Kefreyt retains transit contracts. This route excludes direct integration."
 VAL_Balchansk_Clearing_House:0 "Balchansk Clearing House"
 VAL_Balchansk_Clearing_House_desc:0 "A joint clearing house connects the Balchansk administration to Kefreyt arsenals and trading offices. The administration gains an economic institution; Kefreyt receives an industrial research bonus and political resources."

 VAL_defer_northern_expansion:0 "Defer Northern Expansion"
 VAL_defer_northern_expansion_desc:0 "Territorial acquisitions must not stop trade and recovery. We will defer the campaign against the northern tribes and proceed through returning buyers and foreign clearing houses. The northern ultimatum remains an option later."
 VAL_defer_northern_expansion_ready_tt:0 "The frontier security plan is complete; Kefreyt is independent, has not capitulated and is at peace. No frontier ultimatum, campaign or mobilisation is active. No northern settlement has been signed."
 VAL_defer_northern_expansion_tt:0 "Bypass $VAL_frontier_treaty_offices$ without receiving its rewards. Economic recovery can continue after $VAL_Returning_Buyers$ and $VAL_Contingency_Ledgers$. Stelander diplomacy remains available, but a separate campaign against Nodrul requires returning to northern expansion and securing a tribal foothold. This route grants no territory, resources, military victory rewards or right to proclaim a new state. Issuing another northern ultimatum cancels this choice."
 VAL_northern_expansion_deferred_tt:0 "Northern expansion was explicitly deferred; the frontier security plan is complete and no war, ultimatum or mobilisation is active."
 VAL_economic_settlement_ready_tt:0 "The actual military campaign objectives are met, or northern expansion was deferred and both $VAL_Returning_Buyers$ and $VAL_Contingency_Ledgers$ are complete while Kefreyt is independent and at peace."

 VAL_defeat_Revise_The_Settlement: "Revise the Peace Settlement"
 VAL_defeat_Revise_The_Settlement_desc: "The Council can accept defeat and renounce another expedition, or declare the settlement temporary. Revenge requires restored depots, re-equipped units and the return of the captains. Another defeat will cost Kefreyt its independence, not merely its government."
 VAL_defeat_Refit_For_Return: "Re-equip the Returning Units"
 VAL_defeat_Refit_For_Return_desc: "Another expedition cannot begin with the same empty depots. Restored arsenals will arm the field units, while commanders revise their training around the lessons of defeat in the mountains."
 VAL_defeat_Return_To_The_Passes: "Return to the Passes"
 VAL_defeat_Return_To_The_Passes_desc: "Preparations are complete. The Council orders a new war against Shabrat’s Stelander. Victory will place Stelander under a contract administration; defeat will let Shabrat annex Kefreyt in full. There will be no second limited peace."
 VAL_council_revanche_available_tt: "The independent Council of Commanders rules Kefreyt after its defeat. Shabrat still leads an independent Stelander; neither country has capitulated and they do not share a faction."
 VAL_council_revanche_launch_available_tt: "The Council and Shabrat’s Stelander remain independent opponents. Kefreyt is at peace; revision of the settlement, refitting, the return of the captains, mountain preparations, frontline arsenals and supplies for the second campaign are complete."
 VAL_council_revanche_stakes_tt: "§YOpens preparations for a war of revenge against Stelander.§!\n§RAnother defeat lets Shabrat annex Kefreyt in full.§! The peaceful No Second Expedition route becomes unavailable."
 VAL_council_revanche_war_tt: "§RKefreyt declares war on Shabrat’s Stelander.§!\n§YKefreyt victory:§! a subordinate contract administration in Stelander.\n§RShabrat victory:§! full annexation of Kefreyt instead of a limited peace."

 VAL_defeat_Rebuild_The_Registry: "Rebuild the Civil Register"
 VAL_defeat_Rebuild_The_Registry_desc: "The council inherited a country, not merely the remnants of an expeditionary army. A restored civil register allows directly held frontier regions to be integrated after the change of government."
 VAL_defeat_Repair_The_Workshops: "Put the Machine Tools Back to Work"
 VAL_defeat_Repair_The_Workshops_desc: "Put repairs and civilian orders ahead of another expedition. Investment in civilian industry survives either subsequent political choice by the council."
 VAL_defeat_Restore_Freight_Routes: "Restore Freight Routes"
 VAL_defeat_Restore_Freight_Routes_desc: "The army and workshops need the same roads. Improve a weak link in the domestic transport network; a fully developed network instead releases resources for administration."
 VAL_defeat_Veterans_Register: "Register Returning Veterans"
 VAL_defeat_Veterans_Register_desc: "Account for scattered formations, restore service records and bring fit veterans back into an organised reserve. Support for their families strengthens confidence in the council."
 VAL_defeat_Staff_College: "The Council Staff College"
 VAL_defeat_Staff_College_desc: "Turn the experience of defeat into a staff-training programme. Its graduates serve either a defensive army or another expedition, independently of Shabrat’s personal fate."
 VAL_defeat_Civilian_Contracts: "Civilian Contracts"
 VAL_defeat_Civilian_Contracts_desc: "Contracts must be paid through delivery rather than occupation. Expand civilian production and direct the proceeds toward domestic recovery."
 VAL_defeat_Technical_Institute: "Institute of Applied Technology"
 VAL_defeat_Technical_Institute_desc: "Direct part of the staff and factory training effort toward civilian research. The institute brings engineers and instructors into a permanent research programme."
 VAL_defeat_Mountain_Exercises: "Study the Mountain Campaign"
 VAL_defeat_Mountain_Exercises_desc: "Replacing lost rifles is not enough. Training must account for mountain passes, separated columns and cooperation with engineers."
 VAL_defeat_Frontline_Arsenals: "Arsenals for the Second Expedition"
 VAL_defeat_Frontline_Arsenals_desc: "Revanche cannot depend on a single issue of rifles. Build a sustainable industrial basis for arming and reinforcing the field formations."
 VAL_defeat_Supply_For_The_Return: "Stockpiles for the Return"
 VAL_defeat_Supply_For_The_Return_desc: "Before issuing the war order, accumulate rifles, artillery and support equipment. The council will not send formations to the passes before its transport and staff programmes are complete."
 VAL_defeat_Recovered_State: "A Stable Administration"
 VAL_defeat_Recovered_State_desc: "Whatever its foreign-policy choice, the council must complete domestic recovery. Once the wars end, transport, civil records and industry will operate under one budget."
 VAL_council_recovery_available_tt: "The Council of Commanders remains in power after the defeat; Kefreyt is independent and has not capitulated."
 VAL_council_recovered_state_available_tt: "The Council of Commanders governs independent Kefreyt; the country has not capitulated and is no longer at war."
 VAL_raise_mountain_contractors_tt: "Deploy §Y2 mountain divisions§! of §Y6300 personnel§! each in an owned and controlled state. Each has §Y6 mountaineer battalions§! and an engineer company at §Y100%§! manpower and equipment. Personnel and equipment are included in the reward and are not deducted from free reserves. The template is fixed and normal recruitment is allowed. This is a one-time grant."
 VAL_raise_reserve_battalions_tt: "Deploy §Y2 reserve infantry divisions§! of §Y6300 personnel§! each in an owned and controlled state. Each has §Y6 infantry battalions§! and an engineer company at §Y100%§! manpower and equipment. Personnel and equipment are included in the reward and are not deducted from free reserves. The template is fixed and normal recruitment is allowed. This is a one-time grant."
 VAL_contract_service: "Contract Service"
 VAL_contract_service_desc: "Kefreyt recruits paid volunteers. Contracts define each soldier's term of service, wages and duties, while permanent cadres accelerate operational planning and the recovery of company cohesion, while service experience reduces non-combat losses. This system supports a professional army but limits the pool of recruits."
 VAL_contract_service_locked_tt: "Contract Service can only be replaced through a focus or event."
