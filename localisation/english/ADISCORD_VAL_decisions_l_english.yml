 VAL_trade_grey_market_tt:0 "The §Ygrey market§! diverts regular treasury income into underground trade. Losses apply to the ordinary budget, positive weekly bonuses and corridor payments. One-off rewards, loans and deposit refunds are unaffected.\n\nOnly the current tier applies:\n§Y0-24§!: no losses.\n§Y25-49§!: income §Y-10%§!; administration expenses §Y+2%§!; stability §Y-1%§!.\n§Y50-74§!: income §Y-25%§!; administration expenses §Y+5%§!; stability §Y-3%§!.\n§Y75-100§!: income §Y-50%§!; administration expenses §Y+10%§!; stability §Y-6%§!; political power §Y-0.05/day§!.\n\nLast week means income lost in the latest completed budget period; total means losses since tracking began. Extra administration expenses are excluded. Forecasts and opening the panel do not increase these counters. Route amounts already reflect current losses.\n\nWeekly change:\n- +3 per disrupted previously operating route;\n- +2 while at war, +3 when housing is overcrowded;\n- +1 per level of broker dependence;\n- -2 when all commissioned routes operate, with at least one open;\n- -1 per level of security.\nAt pressure 50 or higher and security below 3, operating routes are marked at risk; this warning alone does not close a route, but the income reductions above apply."
 val_contract.424.t:0 "Trade agreement signed"
 val_contract.424.d:0 "[FROM.GetName] accepted the trade offer. The agreement lasts 365 days and provides weekly income to both countries. The 100 political power already paid covers the fee; no second payment is taken.\n\nNew offers to this country become available after 365 days."
 val_contract.424.a:0 "Understood"
 val_contract.425.t:0 "Trade agreement did not proceed"
 val_contract.425.d:0 "The trade agreement with [FROM.GetName] did not proceed.\n\nReason: [VALPartnerFailureReason]\n\nThe 100 political power payment was refunded. Offers to this country are hidden for 365 days."
 val_contract.425.a:0 "Understood"
