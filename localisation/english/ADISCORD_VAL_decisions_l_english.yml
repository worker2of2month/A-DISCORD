 val_contract.302.t: "Kefreyt's Network in Anthropophagorum"
 val_contract.302.d: "$val_contract.300.d$"
 val_contract.302.a: "$val_contract.300.a$"
 val_contract.302.b: "$val_contract.300.b$"
 VAL_The_Contract_State: "The Contract State"
 VAL_The_Contract_State_desc: "Kefreyt asks for no allegiance and puts no faith in oaths. Here, power begins with a signature, a price and someone willing to make sure the agreement is honoured."
 VAL_The_Weaponry_Baron: "The Arms Baron"
 VAL_The_Weaponry_Baron_desc: "Valera Solgalov holds the country together with a chain of factories, brokers and captains, not speeches. His throne is not gilded: it is smeared with machine oil and powder soot."
 VAL_Price_Of_Loyalty: "The Price of Loyalty"
 VAL_Price_Of_Loyalty_desc: "In Kefreyt, loyalty is neither inherited nor instilled. It is bought, renegotiated and paid for again, as long as the state has enough weapons, money and fear."
 VAL_Count_The_Captains: "Count the Captains"
 VAL_Count_The_Captains_desc: "Every company knows its commander better than the capital. Before the country can move forward, Solgalov must learn which captains serve Kefreyt and which serve only the next order."
 VAL_One_Ledger_One_Banner: "One Ledger, One Banner"
 VAL_One_Ledger_One_Banner_desc: "Scattered contracts must become a state register. Kefreyt will remain a market for war, but that market will speak with one voice."
 VAL_Factories_Like_Cathedrals: "Modernising the Arms Factories"
 VAL_Factories_Like_Cathedrals_desc: "Arms factories remain Kefreyt's greatest asset. A joint order for equipment and repairs will expand output at working arsenals without spending money on empty buildings. We will also prepare 500 rifles and ensure that production lines remain continuously occupied."
 VAL_Keep_The_Lines_Hot: "Continuous Production Cycle"
 VAL_Keep_The_Lines_Hot_desc: "Shift schedules, spare components and common maintenance standards must eliminate downtime. Existing capacity will run more reliably, and the first batch will replenish our weapon reserve."
 VAL_Ballistics_Schools: "Ballistics Schools"
 VAL_Ballistics_Schools_desc: "Einar Toll and his pupils are turning the craft of war into an academic discipline. A shell must land where the calculations place it, not where prayers send it."
 VAL_Brokered_Steel: "Brokered Steel"
 VAL_Brokered_Steel_desc: "The world does not have to love Kefreyt to buy its weapons. Miron Sablev knows that there is always room for one more signature between morality and delivery."
 VAL_Export_Rifles_Not_Promises: "National Export Bureau"
 VAL_Export_Rifles_Not_Promises_desc: "Exports need paid orders and reliable deliveries, not captains' promises. The bureau ties foreign contracts to actual weapon reserves without replacing buyers with state subsidies."
 VAL_The_Mercenary_State: "Unified Company Register"
 VAL_The_Mercenary_State_desc: "Scattered mercenary companies must become parts of the contract system. Their combat qualities now depend on the register's changing authority: a weak centre will not enjoy the same advantages as a unified command."
 VAL_Hire_Out_War: "War for Hire"
 VAL_Hire_Out_War_desc: "Other people's wars feed Kefreyt's families better than its cursed soil. If someone wants blood, Kefreyt can offer discipline, equipment and a price."
 VAL_Vorons_Companies: "Voron's Companies"
 VAL_Vorons_Companies_desc: "Kirill Voron prefers swift strikes and men who ask no unnecessary questions. His companies appear wherever the contract calls for silence."
 VAL_Stahls_Schedules: "Stahl's Schedules"
 VAL_Stahls_Schedules_desc: "Erika Stahl brings order to a mercenary mass: shifts, routes, rations and windows for combat. Even a dirty war must run on schedule."
 VAL_Gromovs_Assault_Tables: "Gromov's Assault Tables"
 VAL_Gromovs_Assault_Tables_desc: "Boris Gromov sees an offensive as the arithmetic of pressure. If the numbers add up, the men advance; if not, he makes them add up."
 VAL_Morns_Supply_Trains: "Morn's Supply Trains"
 VAL_Morns_Supply_Trains_desc: "Renata Morn knows that a contract dies from an empty warehouse, not a bullet. Her supply trains keep Kefreyt's war on wheels."
 VAL_The_Harvest_Of_Ash: "The Harvest of Ash"
 VAL_The_Harvest_Of_Ash_desc: "Kefreyt's soil remembers shells more readily than seeds. Its people live among dry fields, bones and metal that is easier to sell than turn into bread."
 VAL_Field_Surgeons: "Field Surgeons"
 VAL_Field_Surgeons_desc: "Lada Khrom puts people back together piece by piece, because Kefreyt cannot afford to lose bodies faster than it signs contracts."
 VAL_Bread_From_Barracks: "Bread from the Barracks"
 VAL_Bread_From_Barracks_desc: "When the villages cannot feed the country, the state feeds the villages through army warehouses. Standing orders to civilian contractors will accelerate construction and support the rear."
 VAL_Dead_Villages_Still_Count: "Dead Villages Still Count"
 VAL_Dead_Villages_Still_Count_desc: "There are places on Kefreyt's map where only lists of residents and rusting wells remain. The state may forget their names, but it cannot forget that emptiness has a price."
 VAL_Market_Roads_North: "Northern Trade Routes"
 VAL_Market_Roads_North_desc: "Tribal markets can replace some of our lost sales. We will establish permanent trade offices and prepare the northern direction of foreign policy."
 VAL_Trading_Partners: "Trading Partners"
 VAL_Trading_Partners_desc: "WRK, NAM, IVN and WIT need supplies, and Kefreyt needs markets. There is no love between them, but there is a mutual habit of answering requests."
 VAL_October_Of_2160: "October 2160"
 VAL_October_Of_2160_desc: "Steland remembers October differently from Kefreyt. Some call it a deal, others a wound, but both sides know that the old signatures still cast a shadow."
 VAL_Different_Views_On_Freedom: "Different Views on Freedom"
 VAL_Different_Views_On_Freedom_desc: "To TFF, freedom means the right to refuse obedience. To Kefreyt, it too often means the right to sign a contract without asking who will die to fulfil it."
 VAL_Contracts_Outlive_Kings: "Contracts Outlive Kings"
 VAL_Contracts_Outlive_Kings_desc: "Leaders grow old, parties fracture and borders quarrel with maps. A unified system of agreements binds the state, arsenals and army together. Long-term orders will increase the output of existing industry."
 VAL_Stelander_Crisis_Opens: "The Stelander Crisis"
 VAL_Stelander_Crisis_Opens_desc: "Power is slipping from Ivanov's hands in Stelander. We will study troop deployments and prepare agreements before choosing between supplies to the resistance and an operation against the Sovereign Republics."
 VAL_Arms_For_The_Burning: "Supplies for the Resistance"
 VAL_Arms_For_The_Burning_desc: "After the split, while the resistance fights the party government, we will offer Shabrat weapons and volunteers or a full agreement including two trained infantry units. His government must accept the price; only then will personnel and equipment be transferred and payment enter our treasury. Frontline reports will help our gunsmiths. Supplies do not prevent a separate campaign against the Occidian Revival Union: mobilisation can be ordered 60 days after the split."
 VAL_Seize_The_Northern_Passes: "Operation in the Passes"
 VAL_Seize_The_Northern_Passes_desc: "We will prepare our command for a separate war against the Occidian Revival Union. The republics remain at peace for the first 60 days after Stelander's collapse; we may then order a 21-day mobilisation. Victory will place Balchansk, Harbour and the Mining Settlement under a temporary contract administration. The prewar agreement with Shabrat over Livonin will be settled separately. Direct integration of the retained districts requires later focuses.\n\nIf we do not mobilise, the victorious Stelander may prepare its own invasion of Occidia 90 days after the Stelander civil war ends. The start of its preparations closes our intervention window until they are cancelled. Livonin enters the agreement only if held by defeated Occidia or Kefreyt; territory belonging to Stelander and other countries remains with its owner."
 VAL_The_Steel_Contract: "Production Contracts"
 VAL_The_Steel_Contract_desc: "Fulfilled deliveries or a successful operation justify investment in the output of existing arsenals. If the campaign ends in failure, we will instead restore confidence in the government and revise our obligations."
 VAL_merchant_rail_yards_tt: "A §Glevel 3§! railway has been built between Dopotoydron City and Zoylong."
 VAL_cw_crisis_active_tt: "The struggle for Ivanov's succession or the civil war has begun in Stelander."
 VAL_cw_trade_course_available_tt: "The government has chosen neither military intervention nor neutrality."
 VAL_cw_military_course_available_tt: "The government has chosen neither supplies for the resistance nor neutrality."
 VAL_cw_campaign_result_tt: "A supply agreement has been fulfilled, Kefreyt's operation has ended, or the civil war has ended."
 VAL_cw_field_reports_bonus: "Reports from the Stelander Front"
 VAL_cw_sell_arms_to_resistance: "Offer Supplies to Shabrat"
 VAL_cw_sell_arms_to_resistance_desc: "Preparing the offer costs §Y35§! political power, which is not refunded if declined. Offer the resistance £infantry_equipment_texticon §Y3200§! rifles for £ADISCORD_economy_treasury_texticon §Y50§!. The buyer must agree; weapons and payment are transferred together after another stockpile check. A fulfilled agreement grants §Y5§! army experience and §Y5§! contract authority. A rejected offer may be repeated after 30 days; the agreement can be fulfilled only once."
 VAL_cw_arms_offer_tt: "Offer the resistance £infantry_equipment_texticon §Y3200§! rifles for £ADISCORD_economy_treasury_texticon §Y50§!. Weapons and funds remain with their owners until acceptance."
 VAL_cw_buy_arms_tt: "If the conditions still hold, receive £infantry_equipment_texticon §Y3200§! rifles and transfer £ADISCORD_economy_treasury_texticon §Y50§! to Kefreyt."
 VAL_cw_begin_mobilization: "Begin Mobilisation in the Passes"
 VAL_cw_begin_mobilization_desc: "We will order an invasion of the Occidian Revival Union. Mobilisation becomes available 60 days after Stelander's collapse and lasts another 21 days. Supplies to Shabrat do not exclude this campaign. Victory transfers Balchansk, Harbour and the Mining Settlement to a temporary administration under Kefreyt; Livonin's fate is then settled separately according to the prewar agreement with Shabrat, while retained districts are integrated through focuses.\n\nIf we do not mobilise, the victorious Stelander may prepare its own invasion of Occidia 90 days after the Stelander civil war ends. The start of its preparations closes our intervention window until they are cancelled. Livonin enters the agreement only if held by defeated Occidia or Kefreyt; territory belonging to Stelander and other countries remains with its owner."
 ADISCORD_STP_cw.50.t: "Kefreyt's Offer"
 ADISCORD_STP_cw.50.d: "Kefreyt offers 3200 rifles for 50 from our treasury. Weapons and payment will be transferred together after our acceptance, provided both sides retain the required reserves. The agreement does not commit Kefreyt to entering our war."
 ADISCORD_STP_cw.50.a: "Accept the supply terms."
 ADISCORD_STP_cw.50.b: "We are not ready to pay."
 ADISCORD_STP_cw.51.t: "Response to the Arms Agreement"
 ADISCORD_STP_cw.51.accepted: "The resistance accepted the terms. Kefreyt delivered 3200 rifles and received 50 for the treasury. Officers will send the factories their first reports on the weapons' use at the front."
 ADISCORD_STP_cw.51.refused: "The agreement was not fulfilled: the resistance either rejected the offer or settlement conditions changed. No money, personnel or units were transferred. The supplies prepared for shipment remain in Kefreyt."
 ADISCORD_STP_cw.51.a: "Understood."
 VAL_Keep_The_Arsenals: "Preserve the Reserves"
 VAL_Keep_The_Arsenals_desc: "We will keep our weapons and units at home. Instead of an expedition to Stelander, we will exercise the reserves and confirm our neutrality. The government rejects both intervention and military supplies to the resistance."
 VAL_cw_neutral_course_available_tt: "The government has chosen neither supplies for the resistance nor military intervention."
 VAL_cw_arms_offer_pending: "Awaiting the resistance's response to the arms agreement"
 VAL_cw_trade_course: "Supplies for the resistance have been chosen"
 VAL_cw_military_course: "A separate war against the Occidian Revival Union has been chosen"
 VAL_cw_refused: "The government has declared neutrality in Stelander"
 VAL_cw_entered: "Kefreyt has entered a separate war against the Occidian Revival Union"
 VAL_cw_mobilizing: "Mobilisation against the Occidian Revival Union is underway"
 VAL_cw_settled: "Kefreyt's eastern operation has ended"
 VAL_cw_arms_contract_fulfilled: "The arms agreement with the resistance has been fulfilled"
 VAL_foreign_operation_active: "The foreign operation slot is occupied"
 VAL_cost_pp10_t50: "£political_power_texticon §Y10§! £ADISCORD_economy_treasury_texticon §Y50§!"
 VAL_cost_pp10_t50_blocked: "£political_power_texticon §R10§! £ADISCORD_economy_treasury_texticon §R50§!"
 VAL_cost_pp10_t50_tooltip: "Cost: £political_power_texticon §Y10§! £ADISCORD_economy_treasury_texticon §Y50§!"
 VAL_cost_northern_export: "£political_power_texticon §Y10§! £infantry_equipment_texticon §Y[VALGetExportRifleQuantity]§!"
 VAL_cost_northern_export_blocked: "£political_power_texticon §R10§! £infantry_equipment_texticon §R[VALGetExportRifleQuantity]§!"
 VAL_cost_northern_export_tooltip: "Cost: £political_power_texticon §Y10§! £infantry_equipment_texticon §Y[VALGetExportRifleQuantity]§!"
 VAL_cost_pp10_r4000: "£political_power_texticon §Y10§! £infantry_equipment_texticon §Y4000§!"
 VAL_cost_pp10_r4000_blocked: "£political_power_texticon §R10§! £infantry_equipment_texticon §R4000§!"
 VAL_cost_pp10_r4000_tooltip: "Cost: £political_power_texticon §Y10§! £infantry_equipment_texticon §Y4000§!"
 VAL_northern_export_reserved_tt: "£infantry_equipment_texticon §Y[VALGetExportRifleQuantity]§! rifles will be reserved for §Y21 days§!. The recipient will accept or reject the shipment. Acceptance yields £ADISCORD_economy_treasury_texticon §G[VALGetExportIncome]§!."
 VAL_northern_export_cancelled_tt: "Reserved rifles will return to the stockpile. The £political_power_texticon §Y10§! cost is not refunded."
 VAL_northern_contacts_reserved_tt: "£ADISCORD_economy_treasury_texticon §Y50§! will be invested in developing the network for §Y21 days§!. Success adds §G2%§! trade income."
 VAL_northern_contacts_cancelled_tt: "The invested £ADISCORD_economy_treasury_texticon §Y50§! will be returned. The £political_power_texticon §Y10§! cost is not refunded."
 VAL_CIN_influence: "Broker network level with [CIN.GetNameDef]"
 VAL_OSF_influence: "Broker network level with [OSF.GetNameDef]"
 VAL_cw_offer_contract_formations: "Offer Shabrat Two Contract Regiments"
 VAL_cw_offer_contract_formations_desc: "Preparing the offer costs §Y75§! political power, which is not refunded if declined. Assembly takes §Y21 days§!; the offer is sent after preparation. Offer the resistance two trained infantry regiments with engineers and £infantry_equipment_texticon §Y3200§! reserve rifles for £ADISCORD_economy_treasury_texticon §Y100§!. The full package costs Kefreyt £manpower_texticon §Y12600§! personnel, £infantry_equipment_texticon §Y4420§! rifles, §Y96§! squad weapon sets and §Y60§! additional equipment. The regiments remain until the war ends; their composition and recruitment are locked. Settlement follows buyer acceptance and another stockpile check. An ordinary shipment for §Y50§! treasury funds is also available."
 VAL_cw_formations_offer_tt: "After §Y21 days§! of preparation: Offer two fully equipped infantry regiments with engineers and £infantry_equipment_texticon §Y3200§! rifles for £ADISCORD_economy_treasury_texticon §Y100§!. The regiments will be recalled after the war. Resources remain in Kefreyt until the resistance agrees. Total cost: £manpower_texticon §Y12600§! personnel, £infantry_equipment_texticon §Y4420§! rifles, §Y96§! squad weapon sets and §Y60§! additional equipment."
 VAL_cw_buy_formations_tt: "Transfer £ADISCORD_economy_treasury_texticon §Y100§! to Kefreyt. Receive two infantry regiments with engineers, each with £manpower_texticon §Y6300§! personnel, plus £infantry_equipment_texticon §Y3200§! rifles for the stockpile. The regiments remain until the war ends; their composition and recruitment are locked. Kefreyt supplies the personnel and equipment. Settlement is cancelled if conditions have changed."
 ADISCORD_STP_cw.50.full: "Kefreyt offers two contract infantry regiments with engineers. The units will arrive trained and fully equipped. Another 3200 rifles will go to the stockpile for army replacements. The regiments will remain until the war ends; their composition cannot be changed, nor can new units be recruited using their template.\n\nKefreyt asks 100 from our treasury for the entire package. Its government has authorised dispatch, but funds, personnel and equipment will be transferred only after our acceptance and another stockpile check. The agreement does not commit Kefreyt to entering the war."
 ADISCORD_STP_cw.50.c: "Accept the regiments and shipment for 100 treasury funds."
 ADISCORD_STP_cw.51.accepted_full: "The resistance transferred 100 from its treasury. Two fully equipped contract regiments with engineers passed under its command until the war ends. Another 3200 rifles were sent to Shabrat's army stockpile. Personnel and equipment were provided from Kefreyt's resources; the agreement is fulfilled."
 VAL_bulk_exports_tt: "Future northern sales: £infantry_equipment_texticon §Y5000§! instead of §Y2500§!, with revenue of £ADISCORD_economy_treasury_texticon §G30§! instead of §Y15§!. Already paid shipments are unchanged."
 VAL_export_clearing_margin_tt: "Revenue from future northern sales: £ADISCORD_economy_treasury_texticon §G20§! for a regular shipment, §G40§! for a bulk shipment. Already agreed prices remain unchanged."
 VAL_export_rerouting_tt: "If the first northern buyer becomes unavailable, the paid shipment goes to the second eligible buyer on the original terms. If neither is available, the weapons are returned."
 VAL_EXPORT_RIFLES_2500: "2500"
 VAL_EXPORT_RIFLES_5000: "5000"
 VAL_EXPORT_INCOME_15: "15"
 VAL_EXPORT_INCOME_20: "20"
 VAL_EXPORT_INCOME_30: "30"
 VAL_EXPORT_INCOME_40: "40"
 VAL_reclamation: "Reclaiming the Land"
 VAL_reclamation_desc: "We will begin with damaged districts in Kefreyt itself. Road works, water purification and resettlement proceed in sequence: each stage takes 90 days and costs £ADISCORD_economy_treasury_texticon §Y500§!.\n\nOne contracting service can handle only one project. Completed work remains in the state after a change of government. If a work site is lost, the unused deposit is refunded in full; work may restart after control is restored. Clean districts need no further cleanup."
 VAL_reclamation_survey: "Reconstruction Bureau"
 VAL_reclamation_survey_desc: "We will map damaged roads, water intakes and abandoned settlements. Contractors will receive measurable assignments and payment upon completion."
 VAL_reclamation_road_crews: "Road Crews"
 VAL_reclamation_road_crews_desc: "We will unite road workers and repair teams in a permanent service. Experience from the first clearances will help build routes across the country."
 VAL_reclamation_clean_water: "Clean Water"
 VAL_reclamation_clean_water_desc: "Settlements need clean water intakes, drainage and ground fit for construction. Once access routes are restored, contractors can begin sanitation work."
 VAL_reclamation_workshops: "Orders for the Workshops"
 VAL_reclamation_workshops_desc: "We will arrange serial production of pumps, building components and repair tools. Workshops gain steady demand, and building sites gain supplies."
 VAL_reclamation_return_home: "Homes for Returning Residents"
 VAL_reclamation_return_home_desc: "On prepared sites, we will build homes and businesses for those who choose to return. An order alone is not enough: each district needs a funded resettlement project."
 VAL_reclamation_land_register: "Land Register"
 VAL_reclamation_land_register_desc: "We will establish plot boundaries, contractors' responsibilities and the rights of new residents. Land disputes must no longer halt every new construction project."
 VAL_reclamation_road_crews_idea: "Road Crews"
 VAL_reclamation_road_crews_idea_desc: "Permanent crews build and maintain Kefreyt's roads."
 VAL_reclamation_workshops_idea: "Construction Workshops"
 VAL_reclamation_workshops_idea_desc: "Shared orders for components and tools accelerate factory construction and repairs."
 VAL_reclamation_land_register_idea: "Land Register"
 VAL_reclamation_land_register_idea_desc: "Rights to reclaimed land are established and construction plots have been surveyed."
 VAL_reclamation_recovered_land: "Reclaimed Land"
 VAL_reclamation_recovered_land_desc: "Completed work offsets some of the destruction. After stage three, the original pollution penalties are fully compensated; the result remains in this state after ownership changes."
 VAL_reclamation_roads: "Clear Access Routes in [FROM.GetName]"
 VAL_reclamation_roads_desc: "Stage one: restore access roads and remove dangerous debris. Loss of ownership or control cancels the current work with a full deposit refund."
 VAL_reclamation_water: "Clean the Water and Soil in [FROM.GetName]"
 VAL_reclamation_water_desc: "Stage two, after road clearance: restore water intakes and prepare construction sites. Loss of ownership or control cancels the current work with a full deposit refund."
 VAL_reclamation_settlement: "Resettle [FROM.GetName]"
 VAL_reclamation_settlement_desc: "Stage three, after sanitation: build a civilian factory and finish restoring the district. Loss of ownership or control cancels the current work with a full deposit refund."
 VAL_reclamation_roads_result_tt: "After §Y90 days§! in [FROM.GetName]: §G+1§! infrastructure (at the cap, §G+1§! building slot). One third of the original pollution penalties is offset."
 VAL_reclamation_water_result_tt: "After §Y90 days§! in [FROM.GetName]: §G+2§! building slots. Compensation for the original pollution penalties rises to two thirds."
 VAL_reclamation_settlement_result_tt: "After §Y90 days§! in [FROM.GetName]: §G+1§! building slot and §G1 civilian factory§!. The original pollution penalties will be fully offset."
 VAL_reclamation_idle_tt: "The contracting service is free: no other funded reconstruction project is active."
 VAL_reclamation_refund_tt: "The unfinished stage is cancelled; the £ADISCORD_economy_treasury_texticon §Y500§! deposit is returned to Kefreyt. Completed stages remain."
 VAL_reclamation_cost: "£ADISCORD_economy_treasury_texticon §Y500§!"
 VAL_reclamation_cost_blocked: "£ADISCORD_economy_treasury_texticon §R500§!"
 VAL_reclamation_cost_tooltip: "Deposit: £ADISCORD_economy_treasury_texticon §Y500§!. It becomes payment when work is delivered and is refunded in full on cancellation."
 VAL_reclamation_has_work_tt: "Kefreyt owns and controls at least one polluted home district where reconstruction is unfinished."
 VAL_frontier_demand_CIN: "Joint Ultimatum to the Northern Tribes"
 VAL_frontier_demand_CIN_desc: "We will present common demands to the Tribus Cineris, Foedus Ossifractorum and Anthropophagorum. One diplomatic recipient will convey the response of their joint defence. After refusal, Kefreyt can prepare a common campaign or withdraw its demands.\n\nNodrul: [VALGetNodFrontierIntervention]"
 VAL_frontier_demand_CIN_tt: "The ultimatum addresses all three northern tribes. Available independent participants pool their defence; refusal begins preparations for one war. Peace covers the claimed lands of every tribe that joined. Countries in incompatible alliances are not automatically removed from them."
 VAL_frontier_demand_OSF: "Ultimatum: Foedus Ossifractorum"
 VAL_frontier_demand_OSF_desc: "Present demands to the tribal government. Independent tribes organise a joint defence and reject the ultimatum. After their response, Kefreyt can prepare an expedition, begin war or withdraw its demands. Only one campaign runs at a time."
 VAL_frontier_demand_OSF_tt: "Initial demands: $STATE_61$, $STATE_62$, $STATE_63$. The ultimatum brings available tribes into a common coalition; Nodrul and the victorious party may join their side. The postwar treaty covers the claimed lands of every participating tribe. The chosen focus branch determines the form of administration."
 VAL_frontier_demand_APH: "Ultimatum: Anthropophagorum"
 VAL_frontier_demand_APH_desc: "Present demands to the tribal government. Independent tribes organise a joint defence and reject the ultimatum. After their response, Kefreyt can prepare an expedition, begin war or withdraw its demands. Only one campaign runs at a time."
 VAL_frontier_demand_APH_tt: "Initial demands: $STATE_64$, $STATE_65$. The ultimatum brings available tribes into a common coalition; Nodrul and the victorious party may join their side. The postwar treaty covers the claimed lands of every participating tribe. The chosen focus branch determines the form of administration."
 VAL_frontier_demand_ERT: "Ultimatum: Eastern Republic"
 VAL_frontier_demand_ERT_desc: "Deliver the final terms of the border agreement. A response is expected within 21 days. Refusal allows war or withdrawal of the demands; simultaneous ultimatums are excluded."
 VAL_frontier_demand_ERT_tt: "Claimed lands: $STATE_168$. Acceptance returns the state to Kefreyt."
 VAL_frontier_conference: "Doctrine of Northern Expansion"
 VAL_frontier_conference_desc: "After the Stelander wars end, Kefreyt can concentrate on the northern territories. A trade network or a completed Stelander campaign provides the basis for a new policy. Participation in the civil war is not required."
 VAL_frontier_logistics: "Supplying the Expeditionary Forces"
 VAL_frontier_logistics_desc: "A distant war requires warehouses, repair teams and a working reserve of trucks. Alongside permanent supply improvements, the department will be able to purchase transport contracts for the frontier campaign. Field hospitals will improve organisation recovery and grant a support technology research bonus."
 VAL_frontier_commissioners: "Plenipotentiary Commissioners"
 VAL_frontier_commissioners_desc: "Local institutions will continue their daily work, but contracts and security will pass under our commissioners' supervision. The ultimatum will demand submission rather than the state's dissolution."
 VAL_frontier_provincial_offices: "Provincial Administrations"
 VAL_frontier_provincial_offices_desc: "The claimed districts will join a common system of taxation, supply and military registration. The offer is harder to accept, but the government will no longer share responsibility with local authorities."
 VAL_frontier_return_irem: "Return of the Eastern District"
 VAL_frontier_return_irem_desc: "The district transferred to the eastern administration remains part of our frontier economy. We are prepared to negotiate its return without claiming our neighbours' other lands."
 VAL_frontier_field_hospitals: "Evacuation Columns"
 VAL_frontier_field_hospitals_desc: "Mountain campaigns reveal the price of every delay. Mobile hospitals and evacuation routes will help companies restore order after heavy fighting."
 VAL_frontier_security_plan: "Mandate for the Northern Campaign"
 VAL_frontier_security_plan_desc: "The government will approve the expedition's goals and allocate political resources for the first ultimatum. Tribal refusal unlocks the decision to attack. The army needs active units and a weapon reserve, not an inflated paper division count."
 VAL_frontier_treaty_offices: "Implementing the Treaty"
 VAL_frontier_treaty_offices_desc: "The contract department will establish trade routes and settlement procedures with the districts acquired through a frontier agreement.\n\nTo unlock this focus, successfully resolve one ultimatum in the \"$VAL_frontier$\" decision category. \"$VAL_frontier_security_plan$\" unlocks \"$VAL_frontier_demand_CIN$\"; \"$VAL_frontier_return_irem$\" unlocks \"$VAL_frontier_demand_ERT$\".\n\nThe agreement is concluded automatically when the recipient accepts the demands or the campaign ends in victory. The tribal war requires defeating every tribal participant; invading Nodrul is not required. Withdrawing an ultimatum or accepting an armistice after defeat does not fulfil this requirement."
 VAL_frontier_defence_coalition: "Frontier Coalition"
 VAL_frontier: "Frontier Agreements"
 VAL_frontier_desc: "Status: §Y[VALGetFrontierPhase]§!. Recipient: §Y[VALGetFrontierTarget]§!.\nTribus Cineris: [VALGetFrontierCINStatus]\nFoedus Ossifractorum: [VALGetFrontierOSFStatus]\nAnthropophagorum: [VALGetFrontierAPHStatus]\n\nThe ultimatum brings independent tribes into a common coalition. Nodrul: [VALGetNodFrontierIntervention]. Stelander's victorious party may also join the same war; members of incompatible alliances do not leave them automatically.\n\nVictory requires defeating every tribal participant. A liberated tribe blocks peace again. Defeating the tribal bloc ends the campaign with a white peace for its guarantors, without taking their land. The final treaty covers the claimed lands of every participating tribe.\n\nAfter refusal, you may prepare supply, launch an offensive or withdraw the demands. If Kefreyt exceeds 65% surrender progress, a participating Nodrul receives an armistice offer. Borderlands and Erstantpeo may be ceded only to a participating party government."
 VAL_frontier_treaty_signed: "A frontier ultimatum ended with accepted demands or a victorious campaign"
 VAL_frontier_idle_tt: "There is no other unresolved ultimatum or frontier war."
 VAL_frontier_ultimatum_deadline: "Response to the Ultimatum"
 VAL_frontier_ultimatum_deadline_desc: "Silence after the deadline will count as refusal. The decision to go to war remains with Kefreyt's government."
 VAL_frontier_commissioners_tt: "Defeated tribal governments become contract subjects. Once all eight northern states are secured, Antolla, Fareyn and Himber pass directly to Kefreyt; Medron, Heland, Milkham, Kilnet and Khebtava form the Northern Contract Administration. Absorbed subjects retain their troops; outside possessions are unaffected."
 VAL_frontier_provinces_tt: "Victory transfers the claimed districts of participating tribes to Kefreyt. Once all eight states are secured, Antolla, Fareyn and Himber remain with Kefreyt, while the other five form the Northern Contract Administration. Outside possessions and foreign occupation are excluded. Eastern demands are limited to one district."
 VAL_frontier_accept_tt: "The ultimatum's territorial terms will be implemented: return of a district, submission to a commissariat or transfer of the listed lands, according to Kefreyt's demand."
 VAL_frontier_war_tt: "Kefreyt will declare war on the recipient. The other tribes in the common coalition will join its side in the same war, together with available guarantors: Nodrul and the victorious party. One tribe's capitulation will not end the campaign. Defeating all tribal participants ends the campaign with a white peace for its guarantors; invading Nodrul or the party is not required. The eastern district remains a separate bilateral dispute."
 VAL_frontier_armistice_tt: "The frontier war will end. Borderlands and Erstantpeo pass to Stelander's party government if it participated in this war; all other territories retain their owners. Kefreyt remains independent."
 VAL_frontier_refuse_peace_tt: "The war continues. Kefreyt's complete defeat will allow a dependent party administration of Dopotroydsk to be created."
 VAL_frontier_medical_bonus: "Evacuation Columns"
 VAL_frontier_industry_bonus: "Re-equipping Idle Workshops"
 val_rework.100.t: "The Buyer Has Vanished"
 val_rework.100.d: "Civil war in Vorkerland has severed western shipments. The old buyers and brokers vanished along with the unified government. Our metal supply rights have ended, factories are losing orders, and the treasury must still pay the army. The old fame of our arms factories is no longer enough.\n\nThe first six industrial programmes will restore some output. Full recovery requires victory, a new supply base and three postwar programmes. A separate branch will rebuild buyers' trust by reviewing failed agreements, guaranteeing deliveries and introducing independent acceptance inspections.\n\nArms exports and paid advisers will buy time. We must secure the new routes ourselves."
 val_rework.100.a: "Keep production running."
 val_rework.111.t: "Demands Rejected"
 val_rework.111.d: "The reply rejects Kefreyt's terms. The frontier rulers intend to meet the expedition together, and Nodrul sees their resistance as a way to halt Solgalov's advance. The captains must prepare for a common war, not the occupation of one capital.\n\nWe may keep our demands in force while first preparing supplies. The order to attack and the withdrawal of the ultimatum remain available in frontier decisions. The eastern administration answers only for its own disputed district."
 val_rework.113.t: "An Offer from Kefreyt's Generals"
 val_rework.113.d: "Kefreyt's command proposes halting the offensive. The generals are prepared to return Borderlands and Erstantpeo to the party, recall the expedition and recognise the previous position of all other borders.\n\nSolgalov will retain his state but lose the disputed districts. Refusal means continuing the war until power changes hands in Kefreyt itself."
 val_rework.115.t: "Frontier Agreement"
 val_rework.115.d: "The signed treaty lies on the table. Military representatives check the districts to be transferred while officials prepare supply and administrative procedures. The participants' other possessions are excluded from the agreement.\n\nThe government must now turn fulfilled demands into lasting trade relations."
 val_rework.115.a: "Open the treaty offices."
 val_rework.116.t: "Signatures for a Ceasefire"
 val_rework.116.d: "Ceasefire orders have reached the staffs. The disputed districts have been settled under the agreement, and units are returning to their supply lines. The cost of the campaign will remain visible in treasury accounts and company rosters for a long time."
 val_rework.116.a: "Begin reconstruction."
 val_rework.110.t: "Kefreyt's Ultimatum"
 val_rework.110.ert: "Kefreyt demands the return of a district previously under its administration: $STATE_168$. Its demands do not extend to the eastern administration's other lands.\n\nThe government has set a deadline for a reply. Acceptance will settle the dispute by transferring the district; refusal leaves Kefreyt a choice between retreat and war."
 val_rework.110.commission: "Kefreyt demands recognition of its commissariat's supremacy. Local institutions will keep their territory and daily functions, but foreign policy will come under Kefreyt's supervision.\n\nOther independent tribes are assembling a joint defence. Nodrul is ready to use the coalition to contain Solgalov. Refusal preserves the option of collective resistance; acceptance makes our country subordinate to Kefreyt.\n\nIf outside conquests are held, the agreement will be limited to the claimed tribal districts."
 val_rework.110.direct: "Kefreyt demands that tribal lands be placed under direct provincial administration. Acceptance means losing our main territory.\n\nOther independent tribes are assembling a joint defence, and Nodrul may support it with troops. We may reject the demands and face the expedition alongside our allies."
 val_rework.110.no: "Reject the demands."
 val_rework.110.yes: "Accept the terms."
 val_rework.closed: "The matter is already settled."
 val_rework.111.withdraw: "Withdraw the ultimatum."
 val_rework.111.war: "Begin the operation."
 val_rework.113.accept: "Accept the armistice."
