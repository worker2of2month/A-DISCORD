l_english:
 FOCUS_FILTER_VAL_DECISIONS:0 "Special Decisions"
 VAL_payroll_reform_tt:0 "Reduces the contract-pay premium on army expenses by §G5 percentage points§!. Final reforms can remove at most §Y25 points§! in total; relief survives a change of course."
 FOCUS_FILTER_VAL_CONTRACTS:0 "Contracts and Arms Exports"
 FOCUS_FILTER_VAL_ECONOMY:0 "Treasury and Industry"
 FOCUS_FILTER_VAL_ARMY:0 "Army and Supply"
 FOCUS_FILTER_VAL_AUTHORITY:0 "Authority and Captain Loyalty"
 FOCUS_FILTER_VAL_STELANDER:0 "Stelander Crisis"
 FOCUS_FILTER_VAL_EXPANSION:0 "Expansion and Treaties"
 FOCUS_FILTER_VAL_RECOVERY:0 "Recovery and Land Development"
 VAL_Operational_Directorate: "Operations Directorate"
 VAL_Operational_Directorate_desc: "Our neighbours cannot be treated as one continuous frontier. The directorate will combine information on passes, markets, garrisons and regional authorities in a single, constantly updated map."
 VAL_Ministry_Of_Contract_Memory: "Ministry of Contract Records"
 VAL_Ministry_Of_Contract_Memory_desc:0 "The state needs more than rifles: it needs to explain why every new contract was necessary. The ministry establishes a permanent propaganda campaign slot and provides the political resources to launch a campaign."
 VAL_campaign_slot_available_tt:0 "A campaign slot is available. Currently free: §Y[?ADISCORD_available_campaign_slots|0]§!. An occupied slot becomes available when its campaign ends."
 VAL_campaign_mine_unlock_tt:0 "§Y$VAL_campaign_the_mine_was_stolen$§! becomes available after losing the Vorkerland metal supply."
 VAL_campaign_second_slot_tt:0 "Permanently adds another §G+1§! slot, allowing §Ytwo campaigns at the same time§!. Each campaign is funded separately."
 VAL_campaign_slot_granted_tt:0 "Permanently adds §G+1§! propaganda campaign slot in §Y$VAL_contract_management$§!. The slot becomes available again when its campaign ends."
 VAL_Paid_Loyalty: "Paid Loyalty"
 VAL_Paid_Loyalty_desc: "The captains' loyalty must depend on the payment register, not their personal closeness to the ruler."
 VAL_Provincial_Brokers: "Provincial Brokers"
 VAL_Provincial_Brokers_desc: "Local brokers will collect applications, recruit contractors and provide early warning of unrest."
 VAL_Closed_Ledgers: "Closed Ledgers"
 VAL_Closed_Ledgers_desc: "Centralised accounting will prevent captains from concealing men and weapons in parallel books."
 VAL_State_Above_Captains: "The State Above the Captains"
 VAL_State_Above_Captains_desc: "The contract system will outlive its founders only when no company can consider itself the state's equal."
 VAL_Quarterly_Contract_Norm: "Quarterly Contract Quota"
 VAL_Quarterly_Contract_Norm_desc:0 "Every ninety days the arsenals must fulfil an export order. Deliver 40000 rifles for 10 political power, or pay independent contractors 1000 treasury and retain the weapons. An arsenal delivery improves reputation and earns military experience; subcontracting only preserves reputation. Early payment does not bring the next quarter forward."
 VAL_Contract_Accounting_Office: "Industrial Budget"
 VAL_Contract_Accounting_Office_desc: "Accounting for state orders will bring arsenal accounts, tax payments and production plans together. The reform increases recurring treasury income and reduces administrative expenditure."
 VAL_Salvage_Every_Barrel: "Restoring Weapon Reserves"
 VAL_Salvage_Every_Barrel_desc: "Warehouse commissions will return serviceable weapons to circulation. Salvaging decommissioned stock will build a reserve without diverting new production lines."
 VAL_Standardize_Rifle_Lots: "Standardise Rifle Batches"
 VAL_Standardize_Rifle_Lots_desc: "Common tolerances and markings will simplify repairs, exports and quarterly deliveries."
 VAL_Merchant_Rail_Yards: "Commercial Rail Yards"
 VAL_Merchant_Rail_Yards_desc: "Military cargo must leave the country without spending weeks at congested stations."
 VAL_Mobilize_Machine_Shops: "Machine Tool Programme"
 VAL_Mobilize_Machine_Shops_desc: "Dependence on imported equipment turns any interruption of trade into an industrial disaster. Machine shops will receive a common plan to repair and manufacture tools for Kefreyt's factories."
 VAL_Arsenal_Reserve: "Arsenal Reserve"
 VAL_Arsenal_Reserve_desc: "Some of our output must be withheld from immediate sale. An emergency reserve will let us meet our obligations even during mobilisation."
 VAL_Westerholm_Concessions: "Additional Vorkerland Supplies"
 VAL_Westerholm_Concessions_desc: "We will propose that Vorkerland expand the deposit in [38.GetName] and grant us rights to its steel. The agreement lasts only until Vorkerland collapses or the supply area is lost."
 VAL_Company_Rosters: "Company Rosters"
 VAL_Company_Rosters_desc: "Every mercenary company will enter a single register of personnel, equipment and obligations."
 VAL_Border_Survey_Corps: "Border Survey Corps"
 VAL_Border_Survey_Corps_desc: "Guides and contract companies know the roads, bridges and mountain passes better than headquarters maps. Organize them into two mountain divisions with their own engineers and expand the special forces establishment."
 VAL_Contractor_Officers: "Contract Officers"
 VAL_Contractor_Officers_desc: "Our best commanders will receive state contracts and common training requirements. The reform raises army organisation by §G3%§! above the current level of the contract forces."
 VAL_Motorized_Columns: "Motorised Columns"
 VAL_Motorized_Columns_desc: "Mobile columns will receive five hundred trucks to move personnel and supplies. Army supply consumption falls by §G3%§! independently of other military reforms."
 VAL_Field_Repair_Corps: "Field Repair Corps"
 VAL_Field_Repair_Corps_desc: "Repair teams will follow the companies and return equipment to service. Army organisation recovery will improve by §G3%§!, independently of other military reforms."
 VAL_Reserve_Battalions: "Reserve Battalions"
 VAL_Reserve_Battalions_desc: "The state reserve must exist beyond the ledgers. Two fully equipped infantry divisions will receive engineer companies, while additional recruits remain available to replenish the field army."
 VAL_Contract_General_Staff: "Contract General Staff"
 VAL_Contract_General_Staff_desc: "The staff will coordinate company plans, transport offices and trophy accounting. Planning speed will increase by §G5%§! and equipment capture by §G3%§!, even with a fully developed contract army."
 VAL_Vorkerland_Contracts_Burn: "Vorkerland Supplies Severed"
 VAL_Vorkerland_Contracts_Burn_desc: "The collapse of our main market has left arsenals unpaid and suppliers without guarantees. We will close the most dangerous obligations and use the released reserves to keep production running. This is the first of six crisis programmes."
 VAL_Inventory_The_Empty_Yards: "Industrial Inventory"
 VAL_Inventory_The_Empty_Yards_desc: "The government needs verified figures on machine tools, raw materials and unfinished orders. An inventory will establish which plants can resume work immediately and which need new equipment."
 VAL_military_operations: "Military Operations"
 VAL_military_operations_desc: "The operational situation in Occidia, Nodrul, Bezhaysk, the forest cult lands, Yubora, the Free Frontier and South Tsaygen. Colours reflect current control. Sales are found under Export Contracts."
 VAL_contract_management: "Contract Management"
 VAL_contract_management_desc: "Run the domestic machinery of the contract state. Propaganda campaigns are limited by available media slots, while the quarterly delivery norm protects Kefreyt's reputation, revenue and ability to service its debt.\n\nFree campaign slots: §Y[?ADISCORD_available_campaign_slots|0]§!. §Y$VAL_Ministry_Of_Contract_Memory$§! unlocks the first slot; §Y$VAL_Two_Concurrent_Narratives$§! unlocks the second. Each active campaign occupies one slot until it ends."
 VAL_operations_panel_title: "OPERATIONS MAP"
 VAL_operations_panel_tt: "The map shows Steland, [CIN.GetName], [OSF.GetName] and the northern borderlands. Participants use the same country names as the main map."
 VAL_operations_map_tt: "The lands of Kefreyt, Stelander, Nodrul, Bezhaysk, the Cult of the Children of the Forest, Yubora, the Free Frontier and the cannibals. Countries are shown in their national colours according to current state control. Internal borders and yellow hatching for divided control appear only in territory administered by Kefreyt.\n\nEconomic recovery requires the northern economic base and the integration of Occidia. Ertia is not required for recovery."
 VAL_operations_legend: "§RKefreyt§! / lighter - administration\n§BLocal authority§!   §OEnemy§!   §gOther controller§!"
 VAL_focus_operations_map_unlock_tt: "Unlocks the §YMilitary Operations§! decision category and an interactive map of neighbouring regions."
 VAL_ops_finance_cin_contacts: "Contacts with [CIN.GetNameDef]"
 VAL_ops_finance_cin_contacts_desc: "For £political_power_texticon §Y10§! and £ADISCORD_economy_treasury_texticon §Y50§!, [CIN.GetName] will decide within §Y21 days§! whether to admit Kefreyt's brokers. Acceptance raises the network by §Y1 level§! (§G+2%§! trade income, capped at §Y3§! / §G6%§!). Refusal, disappearance, capitulation or war refunds §Y50§!; political costs are not refunded. Current network: §Y[?VAL_CIN_influence|0]/3§!."
 VAL_ops_sell_rifles_to_cin: "Rifles for [CIN.GetNameDef]"
 VAL_ops_sell_rifles_to_cin_desc: "Reserve £infantry_equipment_texticon §Y[VALGetExportRifleQuantity]§! rifles. After §Y21 days§!, [CIN.GetName] will accept or reject the shipment. Acceptance gives Kefreyt £ADISCORD_economy_treasury_texticon §G[VALGetExportIncome]§! and raises the buyer's network by §Y2 levels§! (up to §Y3§!, each granting §G2%§! trade income). Refusal, disappearance, capitulation or war returns the rifles. After Military Adviser Contracts, the offer will go to the second northern buyer if it can still accept the shipment. £political_power_texticon §Y10§! is not refunded. Quantity and revenue are fixed when the reserve is placed."
 VAL_ops_finance_osf_contacts: "Contacts with [OSF.GetNameDef]"
 VAL_ops_finance_osf_contacts_desc: "For £political_power_texticon §Y10§! and £ADISCORD_economy_treasury_texticon §Y50§!, [OSF.GetName] will decide within §Y21 days§! whether to admit Kefreyt's brokers. Acceptance raises the network by §Y1 level§! (§G+2%§! trade income, capped at §Y3§! / §G6%§!). Refusal, disappearance, capitulation or war refunds §Y50§!; political costs are not refunded. Current network: §Y[?VAL_OSF_influence|0]/3§!."
 VAL_ops_sell_rifles_to_osf: "Rifles for [OSF.GetNameDef]"
 VAL_ops_sell_rifles_to_osf_desc: "Reserve £infantry_equipment_texticon §Y[VALGetExportRifleQuantity]§! rifles. After §Y21 days§!, [OSF.GetName] will accept or reject the shipment. Acceptance gives Kefreyt £ADISCORD_economy_treasury_texticon §G[VALGetExportIncome]§! and raises the buyer's network by §Y2 levels§! (up to §Y3§!, each granting §G2%§! trade income). Refusal, disappearance, capitulation or war returns the rifles. After Military Adviser Contracts, the offer will go to the second northern buyer if it can still accept the shipment. £political_power_texticon §Y10§! is not refunded. Quantity and revenue are fixed when the reserve is placed."
 VAL_campaign_rifles_and_bread: "Rifles and Bread Campaign"
 VAL_campaign_rifles_and_bread_desc: "For fifty days, link military production to the promise of everyday security. Occupies one propaganda slot."
 VAL_campaign_contracts_feed_families: "Contracts Feed Families Campaign"
 VAL_campaign_contracts_feed_families_desc: "For sixty days, present the contract economy as the only guarantee of employment and order."
 VAL_campaign_no_promise_without_payment: "No Promises Without Payment Campaign"
 VAL_campaign_no_promise_without_payment_desc:0 "Spend £political_power_texticon §Y15§! to turn our business reputation into political and commercial influence. For §Y45 days§!: §G+0.50§! daily political power and §G+8%§! trade income. The campaign occupies one slot until it ends."
 VAL_campaign_the_mine_was_stolen: "They Stole Our Mine Campaign"
 VAL_campaign_the_mine_was_stolen_desc: "Following the loss of Vorkerland's metal, direct public anger outward and prepare society to fight for a new source of metal."
 VAL_quarterly_contract_deadline: "Quarterly Quota Deadline"
 VAL_quarterly_contract_deadline_desc:0 "[ROOT.VALGetQuarterlyStatus]\n\nBefore the deadline choose an arsenal delivery or a subcontract. Delivery costs 40000 rifles and 10 political power; at quarter end it grants +1 reputation tier, 15 army experience and 15 command power. Subcontracting costs 1000 treasury and preserves reputation without military rewards. A missed order loses one reputation tier. The next period starts after this deadline."
 VAL_pay_quarterly_contract_norm: "Meet the Quarterly Quota"
 VAL_pay_quarterly_contract_norm_desc:0 "Deliver 40000 rifles for 10 political power. At quarter end reputation rises by one tier, up to its maximum. Gain 15 army experience and 15 command power even at maximum reputation."
 VAL_big_buyers: "Major Buyers"
 VAL_big_buyers_desc: "While Vorkerland retains a unified market, major buyers provide a steady flow of orders: §G+20§! weekly income, §G+20%§! trade income, §G+10%§! civilian industry income, §G+8%§! military industry income, §G+8%§! investment confidence and §G+5%§! production efficiency growth.\n\nThe price of this dependence is §R+5%§! social expenditure, §R+5%§! state overload growth, §R-5%§! creditworthiness and §R-3%§! stability.\n\n    §RAny upheaval among our partners will end this support.§!\n\nKefreyt gains rights to steel in [33.GetName]. Deliveries end if civil war breaks out in Vorkerland or the state is lost. Kefreyt's homeland contains only oil."
 VAL_westerholm_concession_income: "Vorkerland Concession"
 VAL_westerholm_concession_income_desc: "Kefreyt receives metal and rental income from developing a deposit in Vorkerland."
 VAL_vorkerland_contract_disruptions: "Vorkerland Supplies Severed"
 VAL_vorkerland_contract_disruptions_desc: "$VAL_economic_collapse_desc$"
 VAL_vorkerland_metal_shortage: "Vorkerland Metal Shortage"
 VAL_vorkerland_metal_shortage_desc: "Losing control of the Vorkerland deposit has deprived industry of its established raw material supply."
 VAL_contract_reputation_3: "Impeccable Contract Reputation"
 VAL_contract_reputation_3_desc: "Kefreyt meets its quarterly deliveries precisely on time; buyers and creditors consider it reliable."
 VAL_contract_reputation_2: "Sound Contract Reputation"
 VAL_contract_reputation_2_desc: "Recent deliveries have generally been honoured, but the market no longer grants Kefreyt its former reliability premium."
 VAL_contract_reputation_1: "Damaged Contract Reputation"
 VAL_contract_reputation_1_desc: "Repeated failures reduce income, damage creditworthiness and increase debt servicing costs."
 VAL_contract_reputation_0: "Contract Default"
 VAL_contract_reputation_0_desc: "The market no longer trusts Kefreyt's promises. Revenue has collapsed, credit has contracted and old debts have grown heavier."
 VAL_Ministry_Auditors: "Ministry Auditors"
 VAL_Ministry_Auditors_desc: "Auditors will reconcile export agreements and payments to recover missed fees for the budget. Trade income will rise by §G5%§!, independently of the contract administration level."
 VAL_Central_Payment_Office: "Central Payments Office"
 VAL_Central_Payment_Office_desc: "State orders will be settled through a single office capable of distinguishing temporary delays from systemic failure."
 VAL_Provincial_Contract_Courts: "Provincial Contract Courts"
 VAL_Provincial_Contract_Courts_desc: "Disputes between manufacturers, brokers and companies will follow one state procedure."
 VAL_Captains_Cannot_Veto: "Captains Have No Veto"
 VAL_Captains_Cannot_Veto_desc: "Commanders will retain a voice in military matters, but can no longer block state decisions by threatening to terminate private contracts."
 VAL_State_Contract: "State Contract"
 VAL_State_Contract_desc: "The payments office, courts and subordinate captains form a lasting political system, rather than a temporary alliance around one ruler."
 VAL_Wireless_Contract_Bureau: "Contract Broadcasting Bureau"
 VAL_Wireless_Contract_Bureau_desc: "Radio, leaflets and frontline correspondents will receive a common editorial plan and permanent funding."
 VAL_Stories_From_The_Front: "Stories from the Front"
 VAL_Stories_From_The_Front_desc: "Instead of abstract slogans, the bureau will show real people whose families live from production and military service."
 VAL_Two_Concurrent_Narratives: "Two Concurrent Narratives"
 VAL_Two_Concurrent_Narratives_desc:0 "The expanded bureau can run two campaigns at the same time. Each requires its own funding and releases its slot when it ends."
 VAL_Munitions_Board: "Munitions Board"
 VAL_Munitions_Board_desc: "The board will combine army requisitions and export obligations into a single production schedule."
 VAL_Export_Clearing_House: "Direct Settlement"
 VAL_Export_Clearing_House_desc: "The export clearing house will reconcile mutual obligations and direct payments into the state budget without a chain of private collectors. The revenue base will expand and administrative costs will fall."
 VAL_Standard_Cartridges: "Standard Cartridges"
 VAL_Standard_Cartridges_desc: "Uniform cartridges and packaging will reduce warehouse losses and simplify supply for contract companies."
 VAL_Three_Shift_Arsenals: "Expanding Serial Production"
 VAL_Three_Shift_Arsenals_desc: "Restored machine tools must produce compatible items in large batches. A stable shift system will consolidate industrial reconstruction."
 VAL_Reserve_Accounting: "Strategic Stockpile System"
 VAL_Reserve_Accounting_desc: "Raw material and weapon reserves will be recorded under common standards. This will supply the field army, fulfil foreign orders and keep factories running through the next interruption of deliveries."
 VAL_Industrial_Mobilization_Plan: "New Industrial Policy"
 VAL_Industrial_Mobilization_Plan_desc: "We will bring emergency measures into one production plan. This is the last of six initial programmes: some penalties will remain until victory, restored trade and a postwar debt settlement."
 VAL_contract_industry_tier_1_tt: "§YContract Industry§! is raised to §YTier I§!. The current industrial modifier updates automatically."
 VAL_contract_industry_tier_2_tt: "§YContract Industry§! is raised to §YTier II§!. The current industrial modifier updates automatically."
 VAL_contract_industry_tier_3_tt: "§YContract Industry§! is raised to §YTier III§!. The current industrial modifier updates automatically."
 VAL_Company_Service_Code: "Contract Service Code"
 VAL_Company_Service_Code_desc: "Common service rules will define each company's responsibilities to headquarters, the state and neighbouring units."
 VAL_Contract_NCO_Schools: "Contract NCO Schools"
 VAL_Contract_NCO_Schools_desc: "Common training for junior commanders will let companies act together without losing control on the march."
 VAL_Logistics_Command: "Logistics Command"
 VAL_Logistics_Command_desc: "Unify field repairs and warehouses under one command. New trucks and support equipment will give the rear services the means to act on their inventory reports."
 VAL_Operational_Reserves: "Operational Reserves"
 VAL_Operational_Reserves_desc: "Ten thousand trained recruits, rifles, squad weapons and support equipment will replenish existing formations after the first losses."
 VAL_Army_Of_The_Ledger: "Army of the Ledger"
 VAL_Army_Of_The_Ledger_desc: "Contract companies finally become an army, with common headquarters, supply, reserves and a chain of command."
 VAL_Foreign_Broker_Licences: "Foreign Broker Licences"
 VAL_Foreign_Broker_Licences_desc:0 "Open sales of 25000 rifles for 500 treasury. Northern partners can buy in peacetime; other clients must be at war. Licences also open wholesale contracts."
 VAL_Northern_Clearing_House: "Second Export Desk"
 VAL_Northern_Clearing_House_desc:0 "A second export slot permits two simultaneous shipments. The office receives 300 treasury. A slot reopens 70 days after an accepted sale and produces no income on its own."
 VAL_Contingency_Ledgers: "Military Adviser Contracts"
 VAL_Contingency_Ledgers_desc: "The experience of Kefreyt's staffs also has a price. We will authorise one paid advisory mission: the recipient gains military assistance and our treasury receives temporary income."
 VAL_contract_administration_1: "Contract Administration I"
 VAL_contract_administration_1_desc: "Unified registers improve revenue collection and state resilience."
 VAL_contract_administration_2: "Contract Administration II"
 VAL_contract_administration_2_desc: "Central settlement and contract courts strengthen taxation, trade and political control."
 VAL_contract_administration_3: "Contract Administration III"
 VAL_contract_administration_3_desc: "The completed contract system raises revenue and reduces the burden on the state apparatus."
 VAL_contract_industry_1: "Contract Industry"
 VAL_contract_industry_1_desc: "Verified orders accelerate efficiency growth on weapon production lines."
 VAL_contract_industry_2: "Contract Industry"
 VAL_contract_industry_2_desc: "Standardisation and accounting raise output and reduce losses from material shortages."
 VAL_contract_industry_3: "Contract Industry"
 VAL_contract_industry_3_desc: "The mobilisation plan unites the arsenals into a mature military industry."
 VAL_contract_army_1: "Contract Army I"
 VAL_contract_army_1_desc: "Company rosters provide a foundation for shared organisation and planning."
 VAL_contract_army_2: "Contract Army II"
 VAL_contract_army_2_desc: "Common officer standards, repairs and supply strengthen the forces."
 VAL_contract_army_3: "Contract Army III"
 VAL_contract_army_3_desc: "A common staff turns separate companies into a cohesive, coordinated army."
 VAL_contract_propaganda_office: "Contract Propaganda Bureau"
 VAL_contract_propaganda_office_desc: "A permanent editorial office sustains public order and readiness through coordinated campaigns."
 VAL_contract_propaganda_upgrade_tt: "Activates the hidden permanent contract broadcasting bonus."
 VAL_factory_cathedrals_drive_tt: "For §Y365 days§!: military factory construction speed §G+10%§!."
 VAL_hot_production_lines_tt: "Maximum production efficiency §G+3%§!."
 VAL_northern_roads_drive_tt: "For §Y365 days§!: infrastructure construction speed §G+10%§!."
 VAL_focus_contract_board_tt: "Grants access to the §Ycontract board§! and foreign operations."
 VAL_focus_authority_5_tt: "§G+5§! §Ycontract authority§!."
 VAL_focus_authority_10_tt: "§G+10§! §Ycontract authority§!."
 VAL_focus_captain_retainers_tt: "Unlocks §Yretained captains§! for special contracts."
 VAL_focus_count_captains_tt: "Unlocks a §Ycount and audit§! of the captains."
 VAL_focus_foreign_operations_tt: "Unlocks §Yforeign operations§! on the interactive map."
 VAL_focus_quality_arsenal_tt: "Activates the contract state's §Yquality arsenal§! specialisation."
 VAL_focus_broad_resource_network_tt: "Activates the contract state's §Ybroad resource network§! specialisation."
 VAL_focus_supply_contracts_tt: "Activates the contract state's §Ysupply contracts§! specialisation."
 VAL_focus_resource_raider_tt: "Activates Gromov's §Yresource raider§! doctrine."
 VAL_focus_manpower_preservation_tt: "Activates the Harvest of Ash §Ymanpower preservation§! model."
 VAL_focus_rear_mobilization_tt: "Activates the Harvest of Ash §Yrear mobilisation§! model."
 VAL_focus_north_coercive_tt: "Activates the §Ycoercive measures§! specialisation for northern policy."
 VAL_focus_northern_operations_tt: "Unlocks §Ynorthern operations§! on the military map."
 VAL_rework_debug: "§RDEBUG:§! Kefreyt"
 VAL_rework_debug_desc: "Kefreyt system controls. Visible only in debug mode."
 VAL_debug_initialize_systems: "§RDEBUG:§! Initialise Systems"
 VAL_debug_initialize_systems_desc: "Reruns safe initialisation of the economy, propaganda, quarterly quota and resource states."
 VAL_debug_unlock_operations_map: "§RDEBUG:§! Unlock Operations Map"
 VAL_debug_unlock_operations_map_desc: "Forcibly enables the military operations category and its interactive map."
 VAL_debug_disrupt_vorkerland_contracts: "§RDEBUG:§! Disrupt Vorkerland Contracts"
 VAL_debug_disrupt_vorkerland_contracts_desc: "Enables the loss of Vorkerland revenue and opens the corresponding emergency branch."
 VAL_debug_lose_westerholm_metal: "§RDEBUG:§! Lose Vorkerland Metal"
 VAL_debug_lose_westerholm_metal_desc: "Simulates losing resource rights and enables the metal shortage."
 VAL_debug_reputation_maximum: "§RDEBUG:§! Maximum Reputation"
 VAL_debug_reputation_maximum_desc: "Sets contract reputation to its highest level."
 VAL_debug_reputation_minimum: "§RDEBUG:§! Contract Default"
 VAL_debug_reputation_minimum_desc: "Sets contract reputation to its lowest level."
 VAL_debug_grant_contract_reserves: "§RDEBUG:§! Grant Test Reserves"
 VAL_debug_grant_contract_reserves_desc: "Adds treasury funds, rifles and support equipment for testing decisions."
 VAL_debug_reset_rework_state: "§RDEBUG:§! Reset Debug States"
 VAL_debug_reset_rework_state_desc: "Removes only debug crisis stages and test Vorkerland penalties, without changing focus progress."
 VAL_contract_state: "$VAL_mercenary_state$"
 VAL_contract_state_desc: "$VAL_mercenary_state_desc$\n\nContract Authority: §Y[?VAL_contract_authority|0]/100§! — §Y[VALGetContractAuthorityBand]§!. The bonuses below are recalculated when authority or a completed military, industrial or administrative specialisation changes."
 VAL_CONTRACT_AUTHORITY_DOMINANT: "unified command"
 VAL_CONTRACT_AUTHORITY_CENTRALIZED: "centralised command"
 VAL_CONTRACT_AUTHORITY_COHERENT: "stable system"
 VAL_CONTRACT_AUTHORITY_BROKERED: "regulated market"
 VAL_CONTRACT_AUTHORITY_FRAGMENTED: "scattered captains"
 val_contract.300.t: "Kefreyt's Network with [CIN.GetNameDef]"
 val_contract.300.d: "Local brokers propose incorporating another operation into their own structures."
 val_contract.300.a: "Authorise the deal"
 val_contract.300.b: "Block the brokers"
 val_contract.301.t: "Kefreyt's Network with [OSF.GetNameDef]"
 val_contract.301.d: "$val_contract.300.d$"
 val_contract.301.a: "$val_contract.300.a$"
 val_contract.301.b: "$val_contract.300.b$"
 val_contract.302.t: "Kefreyt's Network in Anthropophagorum"
 val_contract.302.d: "$val_contract.300.d$"
 val_contract.302.a: "$val_contract.300.a$"
 val_contract.302.b: "$val_contract.300.b$"
 VAL_The_Contract_State: "The Contract State"
 VAL_The_Contract_State_desc: "Kefreyt asks for no allegiance and puts no faith in oaths. Here, power begins with a signature, a price and someone willing to make sure the agreement is honoured."
 VAL_The_Weaponry_Baron: "The Arms Baron"
 VAL_The_Weaponry_Baron_desc: "Valera Solgalov holds the country together with a chain of factories, brokers and captains, not speeches. His throne is not gilded: it is smeared with machine oil and powder soot."
 VAL_Price_Of_Loyalty: "The Price of Loyalty"
 VAL_Price_Of_Loyalty_desc: "In Kefreyt, loyalty is neither inherited nor instilled. It is bought, renegotiated and paid for again, as long as the state has enough weapons, money and fear."
 VAL_Count_The_Captains: "Count the Captains"
 VAL_Count_The_Captains_desc: "Every company knows its commander better than the capital. Before the country can move forward, Solgalov must learn which captains serve Kefreyt and which serve only the next order."
 VAL_One_Ledger_One_Banner: "One Ledger, One Banner"
 VAL_One_Ledger_One_Banner_desc: "Scattered contracts must become a state register. Kefreyt will remain a market for war, but that market will speak with one voice."
 VAL_Factories_Like_Cathedrals: "Modernising the Arms Factories"
 VAL_Factories_Like_Cathedrals_desc: "Arms factories remain Kefreyt's greatest asset. A joint order for equipment and repairs will expand output at working arsenals without spending money on empty buildings. We will also prepare 20000 rifles and ensure that production lines remain continuously occupied."
 VAL_Keep_The_Lines_Hot: "Continuous Production Cycle"
 VAL_Keep_The_Lines_Hot_desc: "Shift schedules, spare components and common maintenance standards must eliminate downtime. Existing capacity will run more reliably, and the first batch will replenish our weapon reserve."
 VAL_Ballistics_Schools: "Ballistics Schools"
 VAL_Ballistics_Schools_desc: "Einar Toll and his pupils are turning the craft of war into an academic discipline. A shell must land where the calculations place it, not where prayers send it."
 VAL_Brokered_Steel: "Brokered Steel"
 VAL_Brokered_Steel_desc: "The world does not have to love Kefreyt to buy its weapons. Miron Sablev knows that there is always room for one more signature between morality and delivery."
 VAL_Export_Rifles_Not_Promises: "National Export Bureau"
 VAL_Export_Rifles_Not_Promises_desc: "Exports need paid orders and reliable deliveries, not captains' promises. The bureau ties foreign contracts to actual weapon reserves without replacing buyers with state subsidies."
 VAL_The_Mercenary_State: "Unified Company Register"
 VAL_The_Mercenary_State_desc: "Scattered mercenary companies must become parts of the contract system. Their combat qualities now depend on the register's changing authority: a weak centre will not enjoy the same advantages as a unified command."
 VAL_Hire_Out_War: "War for Hire"
 VAL_Hire_Out_War_desc: "Other people's wars feed Kefreyt's families better than its cursed soil. If someone wants blood, Kefreyt can offer discipline, equipment and a price."
 VAL_Vorons_Companies: "Voron's Companies"
 VAL_Vorons_Companies_desc: "Kirill Voron prefers swift strikes and men who ask no unnecessary questions. His companies appear wherever the contract calls for silence."
 VAL_Stahls_Schedules: "Stahl's Schedules"
 VAL_Stahls_Schedules_desc: "Erika Stahl brings order to a mercenary mass: shifts, routes, rations and windows for combat. Even a dirty war must run on schedule."
 VAL_Gromovs_Assault_Tables: "Gromov's Assault Tables"
 VAL_Gromovs_Assault_Tables_desc: "Boris Gromov sees an offensive as the arithmetic of pressure. If the numbers add up, the men advance; if not, he makes them add up."
 VAL_Morns_Supply_Trains: "Morn's Supply Trains"
 VAL_Morns_Supply_Trains_desc: "Renata Morn knows that a contract dies from an empty warehouse, not a bullet. Her supply trains keep Kefreyt's war on wheels."
 VAL_The_Harvest_Of_Ash: "The Harvest of Ash"
 VAL_The_Harvest_Of_Ash_desc: "Kefreyt's soil remembers shells more readily than seeds. Its people live among dry fields, bones and metal that is easier to sell than turn into bread."
 VAL_Field_Surgeons: "Field Surgeons"
 VAL_Field_Surgeons_desc: "Lada Khrom puts people back together piece by piece, because Kefreyt cannot afford to lose bodies faster than it signs contracts."
 VAL_Bread_From_Barracks: "Bread from the Barracks"
 VAL_Bread_From_Barracks_desc: "When the villages cannot feed the country, the state feeds the villages through army warehouses. Standing orders to civilian contractors will accelerate construction and support the rear."
 VAL_Dead_Villages_Still_Count: "Dead Villages Still Count"
 VAL_Dead_Villages_Still_Count_desc: "There are places on Kefreyt's map where only lists of residents and rusting wells remain. The state may forget their names, but it cannot forget that emptiness has a price."
 VAL_Market_Roads_North: "Northern Trade Routes"
 VAL_Market_Roads_North_desc:0 "Open trade and recruitment negotiations with CIN, OSF, APH, COF, TFF and YPR. Trading offices provide weekly income; local volunteers replenish reserves. Arms sales become available after broker licensing."
 VAL_Trading_Partners: "Trading Partners"
 VAL_Trading_Partners_desc: "WRK, NAM, IVN and WIT need supplies, and Kefreyt needs markets. There is no love between them, but there is a mutual habit of answering requests."
 VAL_October_Of_2160: "October 2160"
 VAL_October_Of_2160_desc: "Steland remembers October differently from Kefreyt. Some call it a deal, others a wound, but both sides know that the old signatures still cast a shadow."
 VAL_Different_Views_On_Freedom: "Different Views on Freedom"
 VAL_Different_Views_On_Freedom_desc:0 "For the Frontier, freedom begins with the right to refuse an order. Kefreyt sees independence through signatures, obligations and the price of breaking a contract. Before discussing a joint campaign, we must decide whether to recognise our neighbour's claims to Yuboria or offer only the share we are willing to surrender."

 # Frontier principles and northern partition
 VAL_tff_freedom_choice_ready_tt:0 "Kefreyt and the Frontier are independent, uncapitulated and at peace with each other; the Frontier is not allied with Nodrul. Nodrul remains independent and uncapitulated, and the Duchebia Administration has not been created. Our policy towards the Frontier is undecided, and no military partition offer is pending or signed."
 VAL_tff_freedom_focus_tt:0 "Choose the terms of cooperation with the Frontier: recognise its claims to both Yuborian administrations, or reserve Duchebia for Kefreyt. The Frontier answers independently. Agreed principles ease later negotiations for a joint war; the campaign still requires a separate treaty after Northern Settlement."
 VAL_tff_compromise_policy_tt:0 "Our later military offer will promise Iskhait and Duchebia to the Frontier. If it accepts these principles, its government will be more willing to agree to a joint campaign. No territory changes hands and no war entry occurs before a separate military treaty."
 VAL_tff_firm_policy_tt:0 "Our later military offer will promise only Iskhait to the Frontier. Duchebia remains under Kefreyt if the Frontier accepts this partition. These terms are harder to negotiate. Without a military agreement, demands for both administrations may still follow victory."
 VAL_tff_principles_refused_tt:0 "There is no preliminary agreement. Kefreyt keeps its chosen terms but must seek a military treaty separately later."
 VAL_tff_principles_accepted_tt:0 "Recognise the proposed principles of partition. Our government will be more willing to accept a later military treaty on these terms. War entry remains a separate decision; no territory changes hands now."
 val_contract.380.t:0 "Different Views on Freedom"
 val_contract.380.d:0 "The Frontier's envoys have no single master behind them. Each speaks for communities that may reject their signature. Kefreyt's solicitors find this an awkward basis for a contract: too many people insist on having the last word. To their guests, that is precisely what freedom means.\n\nThe discussion returns to Yuboria. The Frontier does not want to exchange Nodrul's rule for Kefreyt's. We can recognise its future protection over Iskhait and Duchebia after victory, retaining Nodrul's territories and easing the search for a partner. Or we can offer Iskhait alone and keep Duchebia in our share. That proposal would leave us more if accepted, but inspire less trust.\n\nWe are setting the terms for future talks. The Frontier will answer independently, and war entry requires a separate treaty. If no decision is made within twenty-one days, our solicitors will retain Duchebia in Kefreyt's proposal."
 val_contract.380.firm:0 "Iskhait for them; Duchebia stays with us."
 val_contract.380.compromise:0 "Recognise their claims to both administrations."
 val_contract.381.t:0 "What Kefreyt Will Recognise"
 val_contract.381.compromise:0 "Kefreyt proposes recognising our protection over both Yuborian administrations, Iskhait and Duchebia, after a joint victory over Nodrul. The Nodrul Protectorate and Esnos Administration would remain under Kefreyt.\n\nThis recognises our interests but is not yet a military alliance. Acceptance provides a common basis for the next treaty. We will decide whether to join the campaign when a separate military offer arrives. No territory changes hands now. We have fourteen days to answer; silence counts as refusal."
 val_contract.381.firm:0 "Kefreyt proposes dividing the future Yuborian administrations. Iskhait would enter our protection; Duchebia would remain under Kefreyt. Solgalov also reserves the Nodrul Protectorate and Esnos Administration for himself.\n\nAccepting means recognising that freedom from Nodrul will not restore our influence across all Yuboria. Refusal preserves our future demands but makes a joint campaign harder to arrange. These are principles only: war entry still requires a separate treaty. We have fourteen days to answer; silence counts as refusal."
 val_contract.381.refuse:0 "That recognition is insufficient."
 val_contract.381.accept:0 "A basis for further negotiations."
 val_contract.382.t:0 "The Limits of Agreement"
 val_contract.382.accepted:0 "The Frontier has accepted our proposed principles. Its envoys recognise a basis for discussing the future partition without reopening every question.\n\nThis is not a commitment to fight. After Northern Settlement, we can propose a joint operation against Nodrul. Agreed terms will ease those talks, but the final answer remains the Frontier's."
 val_contract.382.refused:0 "The Frontier has rejected our proposed principles. To its envoys, a Kefreyt signature still represents foreign rule where they wanted their own decisions.\n\nOur partition proposal remains unchanged. After Northern Settlement, we may approach the Frontier again with a concrete military treaty. We have no preliminary consent, and winning alone will not extinguish its claims to Yuboria."
 val_contract.382.a:0 "The basis for our next discussion is clear."
 VAL_nod_frontier_limited_terms_tt:0 "The Frontier joins Kefreyt in its war against Nodrul. After victory, Iskhait passes under Frontier protection. Duchebia, the Nodrul Protectorate and Esnos Administration remain under Kefreyt. Transfer requires an independent Frontier at peace with Kefreyt. These terms take effect only after Frontier consent."
 val_contract.350.limited:0 "Kefreyt proposes a joint campaign against Nodrul under a limited partition. After victory, Iskhait will enter our protection. Kefreyt reserves Duchebia, the Nodrul Protectorate and Esnos Administration for itself.\n\nAcceptance commits us to join when Kefreyt begins its operation, or immediately if the war is already under way. Territory changes hands only after victory. Refusal preserves our postwar demands but guarantees no concessions. We have fourteen days to answer; silence counts as refusal."
 val_contract.351.limited:0 "The Frontier has agreed to join the war against Nodrul in exchange for Iskhait. Duchebia, the Nodrul Protectorate and Esnos Administration remain under our control.\n\nIf the war is already under way, the Frontier joins immediately; otherwise it enters when our operation begins. Iskhait transfers after victory, provided the Frontier remains independent and at peace with Kefreyt."
 val_contract.348.limited:0 "The northern partition is complete. Iskhait has passed under Frontier protection under the limited treaty. Duchebia remains under Kefreyt, alongside the Nodrul Protectorate and Esnos Administration.\n\nThe local administrations keep their own troops and institutions. The signed terms must now become a working order."

 VAL_Contracts_Outlive_Kings: "Contracts Outlive Kings"
 VAL_Contracts_Outlive_Kings_desc: "Leaders grow old, parties fracture and borders quarrel with maps. A unified system of agreements binds the state, arsenals and army together. Long-term orders will increase the output of existing industry."
 VAL_Stelander_Crisis_Opens: "[ROOT.VALGetStelanderFocusTitle]"
 VAL_Stelander_Crisis_Opens_desc: "Study troop deployments and prepare agreements after the Stelander split. War entry and commitments to buyers remain separate decisions.\n\n[ROOT.VALGetStelanderCrisisStatus]"
 VAL_Arms_For_The_Burning: "[ROOT.VALGetArmsFocusTitle]"
 VAL_Arms_For_The_Burning_desc: "[ROOT.VALGetArmsFocusDescription]\n\n[ROOT.VALGetStelanderCrisisStatus]"
 VAL_Seize_The_Northern_Passes: "[ROOT.VALGetPassesFocusTitle]"
 VAL_Seize_The_Northern_Passes_desc: "[ROOT.VALGetPassesFocusDescription]\n\n[ROOT.VALGetStelanderCrisisStatus]"
 VAL_cw_military_course_focus_tt:0 "§YThis focus does not declare war by itself.§! It unlocks mobilisation for intervention in the Stelander war."
 VAL_The_Steel_Contract: "[ROOT.VALGetSteelContractTitle]"
 VAL_The_Steel_Contract_desc: "Fulfilled deliveries or a successful operation justify investment in the output of existing arsenals. If the campaign ends in failure, we will instead restore confidence in the government and revise our obligations.\n\n[ROOT.VALGetStelanderCrisisStatus]"
 VAL_merchant_rail_yards_tt: "A §Glevel 3§! railway has been built between Dopotoydron City and Zoylong."
 VAL_cw_crisis_active_tt: "The Stelander civil war has begun."
 VAL_cw_trade_course_available_tt: "Neutrality has not been chosen. An earlier trade commitment remains available even after military mobilisation begins."
 VAL_cw_military_course_available_tt: "The government has chosen neither supplies for the resistance nor neutrality."
 VAL_cw_campaign_result_tt: "A supply agreement has been fulfilled, Kefreyt's operation has ended, or the civil war has ended."
 VAL_cw_field_reports_bonus: "Reports from the Stelander Front"
 VAL_cw_sell_arms_to_resistance: "Offer Supplies to Shabrat"
 VAL_cw_sell_arms_to_resistance_desc: "Preparing the offer costs §Y35§! political power, which is not refunded if declined. Offer the resistance £infantry_equipment_texticon §Y32000§! rifles for £ADISCORD_economy_treasury_texticon §Y500§!. The buyer must agree; weapons and payment are transferred together after another stockpile check. A fulfilled agreement grants §Y5§! army experience and §Y5§! contract authority. A rejected offer may be repeated after 30 days; the agreement can be fulfilled only once."
 VAL_cw_arms_offer_tt: "Offer the resistance £infantry_equipment_texticon §Y32000§! rifles for £ADISCORD_economy_treasury_texticon §Y500§!. Weapons and funds remain with their owners until acceptance."
 VAL_cw_buy_arms_tt: "If the conditions still hold, receive £infantry_equipment_texticon §Y32000§! rifles and transfer £ADISCORD_economy_treasury_texticon §Y500§! to Kefreyt."
 VAL_cw_begin_mobilization: "Begin Mobilisation in the Passes"
 VAL_cw_begin_mobilization_desc: "We will order an invasion of the Occidian Revival Union. Mobilisation becomes available 60 days after Stelander's collapse and lasts another 21 days. Supplies to Shabrat do not exclude this campaign. Victory transfers Balchansk, Harbour and the Mining Settlement to a temporary administration under Kefreyt; Livonin's fate is then settled separately according to the prewar agreement with Shabrat, while retained districts are integrated through focuses.\n\nIf we do not mobilise, the victorious Stelander may prepare its own invasion of Occidia 90 days after the Stelander civil war ends. The start of its preparations closes our intervention window until they are cancelled. Livonin enters the agreement only if held by defeated Occidia or Kefreyt; territory belonging to Stelander and other countries remains with its owner."
 ADISCORD_STP_cw.50.t: "Kefreyt's Offer"
 ADISCORD_STP_cw.50.d: "Kefreyt offers 32000 rifles for 500 from our treasury. Weapons and payment will be transferred together after our acceptance, provided both sides retain the required reserves. The agreement does not commit Kefreyt to entering our war."
 ADISCORD_STP_cw.50.a: "Accept the supply terms."
 ADISCORD_STP_cw.50.b: "We are not ready to pay."
 ADISCORD_STP_cw.51.t: "Response to the Arms Agreement"
 ADISCORD_STP_cw.51.accepted: "The resistance accepted the terms. Kefreyt delivered 32000 rifles and received 500 for the treasury. Officers will send the factories their first reports on the weapons' use at the front."
 ADISCORD_STP_cw.51.refused: "The agreement was not fulfilled: the resistance either rejected the offer or settlement conditions changed. No money, personnel or units were transferred. The supplies prepared for shipment remain in Kefreyt."
 ADISCORD_STP_cw.51.a: "Understood."
 VAL_Keep_The_Arsenals: "[ROOT.VALGetReservesFocusTitle]"
 VAL_Keep_The_Arsenals_desc: "We will keep our weapons and units at home. Instead of an expedition to Stelander, we will exercise the reserves and confirm our neutrality. The government rejects both intervention and military supplies to the resistance.\n\n[ROOT.VALGetStelanderCrisisStatus]"
 VAL_cw_neutral_course_available_tt: "The government has chosen neither supplies for the resistance nor military intervention."
 VAL_cw_arms_offer_pending: "Awaiting the resistance's response to the arms agreement"
 VAL_cw_trade_course: "Supplies for the resistance have been chosen"
 VAL_cw_military_course: "A separate war against the Occidian Revival Union has been chosen"
 VAL_cw_refused: "The government has declared neutrality in Stelander"
 VAL_cw_entered: "Kefreyt has entered a separate war against the Occidian Revival Union"
 VAL_cw_mobilizing: "Mobilisation against the Occidian Revival Union is underway"
 VAL_cw_settled: "Kefreyt's eastern operation has ended"
 VAL_cw_arms_contract_fulfilled: "The arms agreement with the resistance has been fulfilled"
 VAL_foreign_operation_active: "The foreign operation slot is occupied"
 VAL_cost_pp10_t50: "£political_power_texticon §Y10§! £ADISCORD_economy_treasury_texticon §Y50§!"
 VAL_cost_pp10_t50_blocked: "£political_power_texticon §R10§! £ADISCORD_economy_treasury_texticon §R50§!"
 VAL_cost_pp10_t50_tooltip: "Cost: £political_power_texticon §Y10§! £ADISCORD_economy_treasury_texticon §Y50§!"
 VAL_cost_northern_export: "£political_power_texticon §Y10§! £infantry_equipment_texticon §Y[VALGetExportRifleQuantity]§!"
 VAL_cost_northern_export_blocked: "£political_power_texticon §R10§! £infantry_equipment_texticon §R[VALGetExportRifleQuantity]§!"
 VAL_cost_northern_export_tooltip: "Cost: £political_power_texticon §Y10§! £infantry_equipment_texticon §Y[VALGetExportRifleQuantity]§!"
 VAL_cost_pp10_r4000: "£political_power_texticon §Y10§! £infantry_equipment_texticon §Y40000§!"
 VAL_cost_pp10_r4000_blocked: "£political_power_texticon §R10§! £infantry_equipment_texticon §R40000§!"
 VAL_cost_pp10_r4000_tooltip: "Cost: £political_power_texticon §Y10§! £infantry_equipment_texticon §Y40000§!"
 VAL_northern_export_reserved_tt: "£infantry_equipment_texticon §Y[VALGetExportRifleQuantity]§! rifles will be reserved for §Y21 days§!. The recipient will accept or reject the shipment. Acceptance yields £ADISCORD_economy_treasury_texticon §G[VALGetExportIncome]§!."
 VAL_northern_export_cancelled_tt: "Reserved rifles will return to the stockpile. The £political_power_texticon §Y10§! cost is not refunded."
 VAL_northern_contacts_reserved_tt: "£ADISCORD_economy_treasury_texticon §Y50§! will be invested in developing the network for §Y21 days§!. Success adds §G2%§! trade income."
 VAL_northern_contacts_cancelled_tt: "The invested £ADISCORD_economy_treasury_texticon §Y50§! will be returned. The £political_power_texticon §Y10§! cost is not refunded."
 VAL_CIN_influence: "Broker network level with [CIN.GetNameDef]"
 VAL_OSF_influence: "Broker network level with [OSF.GetNameDef]"
 VAL_cw_offer_contract_formations: "Offer Shabrat Two Contract Regiments"
 VAL_cw_offer_contract_formations_desc: "Preparing the offer costs §Y75§! political power, which is not refunded if declined. Assembly takes §Y21 days§!; the offer is sent after preparation. Offer the resistance two trained infantry regiments with engineers and £infantry_equipment_texticon §Y32000§! reserve rifles for £ADISCORD_economy_treasury_texticon §Y1000§!. The full package costs Kefreyt £manpower_texticon §Y12600§! personnel, £infantry_equipment_texticon §Y44600§! rifles, §Y96§! squad weapon sets and §Y60§! additional equipment. The regiments remain until the war ends; their composition and recruitment are locked. Settlement follows buyer acceptance and another stockpile check. An ordinary shipment for §Y500§! treasury funds is also available."
 VAL_cw_formations_offer_tt: "After §Y21 days§! of preparation: Offer two fully equipped infantry regiments with engineers and £infantry_equipment_texticon §Y32000§! rifles for £ADISCORD_economy_treasury_texticon §Y1000§!. The regiments will be recalled after the war. Resources remain in Kefreyt until the resistance agrees. Total cost: £manpower_texticon §Y12600§! personnel, £infantry_equipment_texticon §Y44600§! rifles, §Y96§! squad weapon sets and §Y60§! additional equipment."
 VAL_cw_buy_formations_tt: "Transfer £ADISCORD_economy_treasury_texticon §Y1000§! to Kefreyt. Receive two infantry regiments with engineers, each with £manpower_texticon §Y6300§! personnel, plus £infantry_equipment_texticon §Y32000§! rifles for the stockpile. The regiments remain until the war ends; their composition and recruitment are locked. Kefreyt supplies the personnel and equipment. Settlement is cancelled if conditions have changed."
 ADISCORD_STP_cw.50.full: "Kefreyt offers two contract infantry regiments with engineers. The units will arrive trained and fully equipped. Another 32000 rifles will go to the stockpile for army replacements. The regiments will remain until the war ends; their composition cannot be changed, nor can new units be recruited using their template.\n\nKefreyt asks 1000 from our treasury for the entire package. Its government has authorised dispatch, but funds, personnel and equipment will be transferred only after our acceptance and another stockpile check. The agreement does not commit Kefreyt to entering the war."
 ADISCORD_STP_cw.50.c: "Accept the regiments and shipment for 1000 treasury funds."
 ADISCORD_STP_cw.51.accepted_full: "The resistance transferred 1000 from its treasury. Two fully equipped contract regiments with engineers passed under its command until the war ends. Another 32000 rifles were sent to Shabrat's army stockpile. Personnel and equipment were provided from Kefreyt's resources; the agreement is fulfilled."
 VAL_bulk_exports_tt: "Future northern sales: £infantry_equipment_texticon §Y50000§! instead of §Y2500§!, with revenue of £ADISCORD_economy_treasury_texticon §G30§! instead of §Y15§!. Already paid shipments are unchanged."
 VAL_export_clearing_margin_tt: "Revenue from future northern sales: £ADISCORD_economy_treasury_texticon §G20§! for a regular shipment, §G40§! for a bulk shipment. Already agreed prices remain unchanged."
 VAL_export_rerouting_tt: "If the first northern buyer becomes unavailable, the paid shipment goes to the second eligible buyer on the original terms. If neither is available, the weapons are returned."
 VAL_EXPORT_RIFLES_2500: "25000"
 VAL_EXPORT_RIFLES_5000: "50000"
 VAL_EXPORT_INCOME_15: "15"
 VAL_EXPORT_INCOME_20: "20"
 VAL_EXPORT_INCOME_30: "30"
 VAL_EXPORT_INCOME_40: "40"
 VAL_reclamation: "Reclaiming the Land"
 VAL_reclamation_desc:0 "Roads, clean water and resettlement each take 90 days and cost 500 treasury. One reclamation project can run at a time. Later focuses require completed work in a controlled region.\n\nAfter full recovery and land registration, industrial sites cost 1000 treasury and take 60 days to build two civilian factories. These projects can run independently in different recovered regions. Losing ownership or control refunds the entire unfinished-project deposit.\n\n$VAL_reclamation_completion_tt$"
 VAL_reclamation_survey: "Reconstruction Bureau"
 VAL_reclamation_survey_desc:0 "The arsenals will fund a survey of damaged regions. Inspect roads, water supplies and abandoned settlements to begin reclamation alongside industrial development."
 VAL_reclamation_road_crews: "Road Crews"
 VAL_reclamation_road_crews_desc: "We will unite road workers and repair teams in a permanent service. Experience from the first clearances will help build routes across the country."
 VAL_reclamation_clean_water: "Clean Water"
 VAL_reclamation_clean_water_desc: "Settlements need clean water intakes, drainage and ground fit for construction. Once access routes are restored, contractors can begin sanitation work."
 VAL_reclamation_workshops: "Orders for the Workshops"
 VAL_reclamation_workshops_desc: "We will arrange serial production of pumps, building components and repair tools. Workshops gain steady demand, and building sites gain supplies."
 VAL_reclamation_return_home: "Homes for Returning Residents"
 VAL_reclamation_return_home_desc: "On prepared sites, we will build homes and businesses for those who choose to return. An order alone is not enough: each district needs a funded resettlement project."
 VAL_reclamation_land_register: "Land Register"
 VAL_reclamation_land_register_desc: "We will establish plot boundaries, contractors' responsibilities and the rights of new residents. Land disputes must no longer halt every new construction project."
 VAL_reclamation_road_crews_idea: "Road Crews"
 VAL_reclamation_road_crews_idea_desc: "Permanent crews build and maintain Kefreyt's roads."
 VAL_reclamation_workshops_idea: "Construction Workshops"
 VAL_reclamation_workshops_idea_desc: "Shared orders for components and tools accelerate factory construction and repairs."
 VAL_reclamation_land_register_idea: "Land Register"
 VAL_reclamation_land_register_idea_desc: "Rights to reclaimed land are established and construction plots have been surveyed."
 VAL_reclamation_stage_1_modifier: "Stabilised Contaminated Territory"
 VAL_reclamation_stage_1_modifier_desc: "Access routes are usable again, but contamination still sharply limits settlement, resources, construction and supply."
 VAL_reclamation_stage_2_modifier: "Territory Under Rehabilitation"
 VAL_reclamation_stage_2_modifier_desc: "Water and soil cleanup has removed most restrictions. Residual contamination still limits the state until resettlement is complete."
 VAL_reclamation_stage_3_modifier: "Reclaimed Territory"
 VAL_reclamation_stage_3_modifier_desc: "The reclamation programme is complete. The former contamination penalties have been removed; permanent infrastructure and industry created by the projects remain."
 VAL_reclamation_roads: "Clear Access Routes in [FROM.GetName]"
 VAL_reclamation_roads_desc: "Stage one: restore access roads and remove dangerous debris. Loss of ownership or control cancels the current work with a full deposit refund."
 VAL_reclamation_water: "Clean the Water and Soil in [FROM.GetName]"
 VAL_reclamation_water_desc: "Stage two, after road clearance: restore water intakes and prepare construction sites. Loss of ownership or control cancels the current work with a full deposit refund."
 VAL_reclamation_settlement: "Resettle [FROM.GetName]"
 VAL_reclamation_settlement_desc:0 "After water treatment, complete reclamation and add a building slot. A civilian factory is built if the region has fewer than 20. Losing ownership or control cancels the work and refunds the deposit in full."
 VAL_reclamation_roads_result_tt:0 "After §Y90 days§! in [FROM.GetName]: §G+1§! infrastructure (at the cap, §G+1§! building slot). One third of the original pollution penalties is offset."
 VAL_reclamation_water_result_tt:0 "After §Y90 days§! in [FROM.GetName]: §G+2§! building slots. Compensation for the original pollution penalties rises to two thirds."
 VAL_reclamation_settlement_result_tt:0 "Replaces residual contamination with reclaimed land, adding a building slot and a civilian factory if the state has fewer than 20.\n\n$VAL_reclamation_completion_tt$"
 VAL_reclamation_completion_tt:0 "Restore the initially contaminated regions [24.GetName] and [57.GetName] through all three decision stages: roads, clean water and resettlement. The other home regions - [42.GetName], [48.GetName], [54.GetName], [55.GetName], [56.GetName] - need no work while clean; any restoration started there must be completed. When all seven are owned and controlled by Kefreyt, free of contamination and without an outstanding paid stage, the §Y$VAL_harvest_of_ash$§! spirit is removed automatically. Focuses alone do not suffice; post-reclamation industrial sites are optional."
 VAL_reclamation_idle_tt: "The contracting service is free: no other funded reconstruction project is active."
 VAL_reclamation_refund_tt: "The unfinished stage is cancelled; the £ADISCORD_economy_treasury_texticon §Y500§! deposit is returned to Kefreyt. Completed stages remain."
 VAL_reclamation_cost: "£ADISCORD_economy_treasury_texticon §Y500§!"
 VAL_reclamation_cost_blocked: "£ADISCORD_economy_treasury_texticon §R500§!"
 VAL_reclamation_cost_tooltip: "Deposit: £ADISCORD_economy_treasury_texticon §Y500§!. It becomes payment when work is delivered and is refunded in full on cancellation."
 VAL_reclamation_has_work_tt: "Kefreyt owns and controls at least one polluted home district where reconstruction is unfinished."
 VAL_frontier_demand_CIN: "Joint Ultimatum to the Northern Tribes"
 VAL_frontier_demand_CIN_desc: "We will present common demands to the Tribus Cineris, Foedus Ossifractorum and Anthropophagorum. One diplomatic recipient will convey the response of their joint defence. After refusal, Kefreyt can prepare a common campaign or withdraw its demands.\n\nNodrul: [VALGetNodFrontierIntervention]"
 VAL_frontier_demand_CIN_tt: "The ultimatum addresses all three northern tribes. Available independent participants pool their defence; refusal begins preparations for one war. Peace covers the claimed lands of every tribe that joined. Countries in incompatible alliances are not automatically removed from them."
 VAL_frontier_demand_OSF: "Ultimatum: Foedus Ossifractorum"
 VAL_frontier_demand_OSF_desc: "Present demands to the tribal government. Independent tribes organise a joint defence and reject the ultimatum. After their response, Kefreyt can prepare an expedition, begin war or withdraw its demands. Only one campaign runs at a time."
 VAL_frontier_demand_OSF_tt: "Initial demands: $STATE_61$, $STATE_62$, $STATE_63$. The ultimatum brings available tribes into a common coalition; Nodrul and the victorious party may join their side. The postwar treaty covers the claimed lands of every participating tribe. The chosen focus branch determines the form of administration."
 VAL_frontier_demand_APH: "Ultimatum: Anthropophagorum"
 VAL_frontier_demand_APH_desc: "Present demands to the tribal government. Independent tribes organise a joint defence and reject the ultimatum. After their response, Kefreyt can prepare an expedition, begin war or withdraw its demands. Only one campaign runs at a time."
 VAL_frontier_demand_APH_tt: "Initial demands: $STATE_64$, $STATE_65$. The ultimatum brings available tribes into a common coalition; Nodrul and the victorious party may join their side. The postwar treaty covers the claimed lands of every participating tribe. The chosen focus branch determines the form of administration."
 VAL_frontier_demand_ERT: "Ultimatum: Eastern Republic"
 VAL_frontier_demand_ERT_desc: "Deliver the final terms of the border agreement. A response is expected within 21 days. Refusal allows war or withdrawal of the demands; simultaneous ultimatums are excluded."
 VAL_frontier_demand_ERT_tt: "Claimed lands: $STATE_168$. Acceptance returns the state to Kefreyt."
 VAL_frontier_conference: "Doctrine of Northern Expansion"
 VAL_frontier_conference_desc:0 "Northern expansion is an independent foreign-policy route. Enter it through the northern trade roads, Stelander contracts or the unified state ledger. There is no need to wait for the Stelander civil war to end.\n\nRoute to an ultimatum: $VAL_frontier_logistics$ and either administrative model → $VAL_frontier_security_plan$ → the $VAL_frontier_demand_CIN$ decision under $VAL_frontier$. A refusal unlocks the offensive. Kefreyt itself must be at peace to send an ultimatum."
 VAL_frontier_logistics: "Supplying the Expeditionary Forces"
 VAL_frontier_logistics_desc: "A distant war requires warehouses, repair teams and a working reserve of trucks. Alongside permanent supply improvements, the department will be able to purchase transport contracts for the frontier campaign. Field hospitals will improve organisation recovery and grant a support technology research bonus."
 VAL_frontier_commissioners: "Plenipotentiary Commissioners"
 VAL_frontier_commissioners_desc: "Local institutions will continue their daily work, but contracts and security will pass under our commissioners' supervision. The ultimatum will demand submission rather than the state's dissolution."
 VAL_frontier_provincial_offices: "Provincial Administrations"
 VAL_frontier_provincial_offices_desc: "The claimed districts will join a common system of taxation, supply and military registration. The offer is harder to accept, but the government will no longer share responsibility with local authorities."
 VAL_Return_Southern_Tsaygen:0 "Return Southern Tsaygen"
 VAL_Return_Southern_Tsaygen_desc:0 "Southern Tsaygen was Kefreyt territory before the collapse of Vorkerland. ERT took the town while the old border was disintegrating. The army will not treat that seizure as a new frontier. We are going back for our own land."
 VAL_southern_tsaygen_revenge_available_tt:0 "The Vorkerland collapse has occurred. ERT independently owns and controls $STATE_168$, which remains a Kefreyt core. Kefreyt is independent and at peace."
 VAL_return_southern_tsaygen_war_tt:0 "§RDeclares war on ERT§! for $STATE_168$. The war is limited to reclaiming Southern Tsaygen."
 VAL_frontier_return_irem:0 "Beyond the Perimeter"
 VAL_frontier_return_irem_desc:0 "After the Perimeter falls, the garrisons of Irem can cross the border. The first operation against the eastern remnants secures a single neighbouring bridgehead, state 169. Its capture enables a separate contract administration. Irem remains part of Kefreyt."
 VAL_frontier_return_irem_war_tt:0 "§RDeclares war on ERT§! for $STATE_169$."
 VAL_frontier_field_hospitals: "Evacuation Columns"
 VAL_frontier_field_hospitals_desc: "Mountain campaigns reveal the price of every delay. Mobile hospitals and evacuation routes will help companies restore order after heavy fighting."
 VAL_frontier_security_plan: "Mandate for the Northern Campaign"
 VAL_frontier_security_plan_desc: "The government will approve the expedition's goals and allocate political resources for the first ultimatum. Tribal refusal unlocks the decision to attack. The army needs active units and a weapon reserve, not an inflated paper division count."
 VAL_frontier_security_plan_war_tt:0 "§YUnlocks the ultimatum to the northern cannibal states.§! After refusal, the offensive decision §Rdeclares war§! on the coalition."
 VAL_frontier_treaty_offices: "Implementing the Treaty"
 VAL_frontier_treaty_offices_desc: "The contract department will establish trade routes and settlement procedures with the districts acquired through a frontier agreement.\n\nTo unlock this focus, successfully resolve one ultimatum in the \"$VAL_frontier$\" decision category. \"$VAL_frontier_security_plan$\" unlocks \"$VAL_frontier_demand_CIN$\". \"$VAL_Return_Southern_Tsaygen$\" unlocks \"$VAL_frontier_demand_ERT$\" as a later diplomatic fallback if the district is still held by ERT.\n\nThe agreement is concluded automatically when the recipient accepts the demands or the campaign ends in victory. The tribal war requires defeating every tribal participant. Invading Nodrul is not required. Withdrawing an ultimatum or accepting an armistice after defeat does not fulfil this requirement."
 VAL_frontier_defence_coalition: "Frontier Defense Alliance"
 VAL_frontier:0 "Territorial administration"
 VAL_frontier_desc:0 "[VALGetFrontierPhase]\n\nContractual administrations, frontier campaigns and gradual integration of held territory. Each action shows its cost, duration and consequences."
 VAL_frontier_treaty_signed: "A frontier ultimatum ended with accepted demands or a victorious campaign"
 VAL_frontier_idle_tt: "There is no other unresolved ultimatum or frontier war."
 VAL_frontier_ultimatum_deadline: "Response to the Ultimatum"
 VAL_frontier_ultimatum_deadline_desc: "Silence after the deadline will count as refusal. The decision to go to war remains with Kefreyt's government."
 VAL_frontier_commissioners_tt: "Defeated tribal governments become contract subjects. Once all eight northern states are secured, Antolla, Fareyn and Himber pass directly to Kefreyt; Medron, Heland, Milkham, Kilnet and Khebtava form the Northern Contract Administration. Absorbed subjects retain their troops; outside possessions are unaffected."
 VAL_frontier_provinces_tt: "Victory transfers the claimed districts of participating tribes to Kefreyt. Once all eight states are secured, Antolla, Fareyn and Himber remain with Kefreyt, while the other five form the Northern Contract Administration. Outside possessions and foreign occupation are excluded. Eastern demands are limited to one district."
 VAL_frontier_accept_tt: "The ultimatum's territorial terms will be implemented: return of a district, submission to a commissariat or transfer of the listed lands, according to Kefreyt's demand."
 VAL_frontier_war_tt: "Kefreyt will declare war simultaneously on every available member of the tribal bloc: CIN, OSF, and APH. Their participation no longer depends on allied AI accepting a war call. A victorious Stelander Party government allied with Nodrul may follow later after the deadline. Nodrul first issues an ultimatum: if the tribal bloc has not been defeated within §Y100 days§!, it enters the war on the defenders' side. Defeating all tribal participants ends the campaign and white-peaces outside guarantors."
 VAL_frontier_armistice_tt: "The frontier war will end. Borderlands and Erstantpeo pass to Stelander's party government if it participated in this war; all other territories retain their owners. Kefreyt remains independent."
 VAL_frontier_refuse_peace_tt: "The war continues. Kefreyt's complete defeat will allow a dependent party administration of Dopotroydsk to be created. On complete defeat, all core states of the participating Stelander owned by Kefreyt and its subjects return to Stelander."
 VAL_frontier_medical_bonus: "Evacuation Columns"
 VAL_frontier_industry_bonus: "Re-equipping Idle Workshops"
 val_rework.100.t: "The Buyer Has Vanished"
 val_rework.100.d: "Civil war in Vorkerland has severed western shipments. The old buyers and brokers vanished along with the unified government. Our metal supply rights have ended, factories are losing orders, and the treasury must still pay the army. The old fame of our arms factories is no longer enough.\n\nThe first six industrial programmes will restore some output. Full recovery requires victory, a new supply base and three postwar programmes. A separate branch will rebuild buyers' trust by reviewing failed agreements, guaranteeing deliveries and introducing independent acceptance inspections.\n\nArms exports and paid advisers will buy time. We must secure the new routes ourselves."
 val_rework.100.a: "Keep production running."
 val_rework.111.t: "Demands Rejected"
 val_rework.111.d: "The reply rejects Kefreyt's terms. The frontier rulers intend to meet the expedition together, and Nodrul sees their resistance as a way to halt Solgalov's advance. The captains must prepare for a common war, not the occupation of one capital.\n\nWe may keep our demands in force while first preparing supplies. The order to attack and the withdrawal of the ultimatum remain available in frontier decisions. The eastern administration answers only for its own disputed district."
 val_rework.113.t: "An Offer from Kefreyt's Generals"
 val_rework.113.d: "Kefreyt's command proposes halting the offensive. The generals are prepared to return Borderlands and Erstantpeo to the party, recall the expedition and recognise the previous position of all other borders.\n\nSolgalov will retain his state but lose the disputed districts. Refusal means continuing the war until power changes hands in Kefreyt itself."
 val_rework.115.t: "Frontier Agreement"
 val_rework.115.d: "The signed treaty lies on the table. Military representatives check the districts to be transferred while officials prepare supply and administrative procedures. The participants' other possessions are excluded from the agreement.\n\nThe government must now turn fulfilled demands into lasting trade relations."
 val_rework.115.a: "Open the treaty offices."
 val_rework.116.t: "Signatures for a Ceasefire"
 val_rework.116.d: "Ceasefire orders have reached the staffs. The disputed districts have been settled under the agreement, and units are returning to their supply lines. The cost of the campaign will remain visible in treasury accounts and company rosters for a long time."
 val_rework.116.a: "Begin reconstruction."
 val_rework.110.t: "Kefreyt's Ultimatum"
 val_rework.110.ert: "Kefreyt demands the return of a district previously under its administration: $STATE_168$. Its demands do not extend to the eastern administration's other lands.\n\nThe government has set a deadline for a reply. Acceptance will settle the dispute by transferring the district; refusal leaves Kefreyt a choice between retreat and war."
 val_rework.110.commission: "Kefreyt demands recognition of its commissariat's supremacy. Local institutions will keep their territory and daily functions, but foreign policy will come under Kefreyt's supervision.\n\nOther independent tribes are assembling a joint defence. Nodrul is ready to use the coalition to contain Solgalov. Refusal preserves the option of collective resistance; acceptance makes our country subordinate to Kefreyt.\n\nIf outside conquests are held, the agreement will be limited to the claimed tribal districts."
 val_rework.110.direct: "Kefreyt demands that tribal lands be placed under direct provincial administration. Acceptance means losing our main territory.\n\nOther independent tribes are assembling a joint defence, and Nodrul may support it with troops. We may reject the demands and face the expedition alongside our allies."
 val_rework.110.no: "Reject the demands."
 val_rework.110.yes: "Accept the terms."
 val_rework.closed: "The matter is already settled."
 val_rework.111.withdraw: "Withdraw the ultimatum."
 val_rework.111.war: "Begin the operation."
 val_rework.113.accept: "Accept the armistice."
 val_rework.113.refuse: "Demand unconditional surrender."
