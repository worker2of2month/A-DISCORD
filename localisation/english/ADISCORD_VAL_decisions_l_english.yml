 val_contract.10.t:0 "Contract with [CIN.GetNameDef]"
 val_contract.10.d:0 "The office has prepared three proposals. A trading office costs 200 treasury and provides weekly income. An arms order sells 25000 rifles for 500 treasury. Recruitment transfers real volunteers from the partner reserve to ours.\n\nTerms depend on the country; tooltips list the full prices. Unavailable proposals are hidden. The partner may decline. Refusal or timeout leaves resources with their owners."
 val_contract.11.t:0 "Contract with [OSF.GetNameDef]"
 val_contract.11.d:0 "The office has prepared three proposals. A trading office costs 200 treasury and provides weekly income. An arms order sells 25000 rifles for 500 treasury. Recruitment transfers real volunteers from the partner reserve to ours.\n\nTerms depend on the country; tooltips list the full prices. Unavailable proposals are hidden. The partner may decline. Refusal or timeout leaves resources with their owners."
 val_contract.12.t:0 "Contract with [APH.GetNameDef]"
 val_contract.12.d:0 "The office has prepared three proposals. A trading office costs 200 treasury and provides weekly income. An arms order sells 25000 rifles for 500 treasury. Recruitment transfers real volunteers from the partner reserve to ours.\n\nTerms depend on the country; tooltips list the full prices. Unavailable proposals are hidden. The partner may decline. Refusal or timeout leaves resources with their owners."
