 VAL_quarterly_partner_supply_desc:0 "Choose 25000 / 50000 / 100000 / 200000 rifles per quarter for 500 / 1000 / 2250 / 5000 treasury per shipment. Completed focuses unlock quantities.\n\nFour deliveries over a year. Signing costs £pol_power 100 after buyer consent; opening the selection is free. No advance; payment on dispatch. Requires a free slot and open corridor. A missed deadline grants 15 days of grace, then termination."

