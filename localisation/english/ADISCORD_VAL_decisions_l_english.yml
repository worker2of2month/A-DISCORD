 VAL_frontier_workshop_refund_tt: "The paid 500 treasury funds return to Kefreyt; the facility will not be built."
 VAL_frontier_workshop_idle_tt: "This district has no workshop project already paid for."
 VAL_foreign_sales: "Foreign Trade and Corridors"
 VAL_foreign_sales_desc: "Only countries currently at war appear as ordinary customers. Arms exports sell a rifle shipment; advisers use a separate 70-day mission and consume command power. Preparing an offer costs political power, but weapons, treasury and command power move only after the buyer accepts. The clearing house permits two simultaneous paid arms contracts. Focuses authorise these deals; they do not sign a contract automatically.\n\n$VAL_trade_corridors_desc$"
 VAL_export_income_1: "Active Arms Contract"
 VAL_export_income_1_desc: "This export desk is occupied for 70 days after payment and shipment. The buyer paid in full on acceptance; renewal requires a new order."
 VAL_export_income_2: "Second Arms Contract"
 VAL_export_income_2_desc: "The second export desk is occupied for 70 days after payment and shipment. The buyer paid in full on acceptance; renewal requires a new order."
 VAL_advisors_income: "Paid Military Mission"
 VAL_advisors_income_desc: "The mission occupies Kefreyt's adviser capacity for 70 days. Payment is received in full when the buyer accepts; Kefreyt suffers a temporary planning burden while its staff is abroad."
 VAL_paid_military_advisors: "Kefreyt Military Advisers"
 VAL_paid_military_advisors_desc: "The agreement lasts 70 days. Military specialists train staffs and improve unit recovery."
 VAL_export_arms: "Sell Arms: [FROM.GetName]"
 VAL_export_arms_desc: "Preparing the offer costs §Y20§! political power, which is not refunded if declined. Offer 2500 rifles for 100 treasury funds. On acceptance, the buyer pays immediately, Kefreyt receives §G100 treasury§!, and the shipment leaves our stockpile. The export desk remains occupied for 70 days before it can support another contract."
 VAL_export_arms_offer_tt: "The recipient receives an offer valid for 14 days. No weapons, money or command power are deducted before acceptance. The price and contract duration are fixed."
 val_contract.340.t: "Kefreyt's Offer: Arms"
 val_contract.340.d: "Kefreyt offers 2500 rifles for a single payment of 100 treasury funds. The weapons will be transferred after signing. The seller receives its payment through the clearing house over 70 days.\n\nThe offer is valid for 14 days. War with the seller, capitulation or insufficient resources prevents payment."
 VAL_export_arms_accepted_tt: "For 100 treasury funds, the country receives 2500 rifles from Kefreyt's stockpiles. Kefreyt receives the §G100 treasury§! payment immediately; the export desk remains occupied for 70 days."
 VAL_export_advisors: "Send Advisers: [FROM.GetName]"
 VAL_export_advisors_desc: "Preparing the offer costs §Y30§! political power, which is not refunded if declined. Offer a 70-day military mission for 100 treasury funds. On acceptance, Kefreyt receives §G100 treasury§!, spends 25 command power and suffers a 5% planning-speed penalty while its staff is abroad. The recipient gains the Kefreyt Military Advisers idea."
 VAL_export_advisors_offer_tt: "The recipient receives an offer valid for 14 days. No weapons, money or command power are deducted before acceptance. The price and contract duration are fixed."
 val_contract.341.t: "Kefreyt's Offer: Military Advisers"
 val_contract.341.d: "Kefreyt offers a team of staff instructors for 70 days. The price is 100 treasury funds. The mission increases planning speed by 10%, organisation recovery by 5% and army experience gain by 5%.\n\nThe offer is valid for 14 days. War with the seller, capitulation or insufficient resources prevents payment."
 VAL_export_advisors_accepted_tt: "For 100 treasury funds, the country gains the Kefreyt Military Advisers idea for 70 days. Kefreyt immediately receives §G100 treasury§!, spends 25 command power and commits an adviser slot for the same period."
 VAL_export_decline: "Decline or close the offer."
 VAL_export_accept: "Sign and pay for the agreement."
 VAL_export_second_slot_tt: "Income from two arms contracts can be received simultaneously. The second requires a separate shipment of 2500 rifles and the buyer's agreement."
 VAL_northern_volunteers: "Volunteers Against Nodrul"
 VAL_northern_volunteers_desc: "Authorise sending existing divisions to the northern front and Shabrat while they fight Nodrul. Select deployment in the recipient's diplomacy window; replacements and equipment remain Kefreyt's expense. Units are recalled when this specific war ends, even if the recipient continues another conflict."
 VAL_northern_volunteer_mandate: "Northern Volunteer Mission"
 VAL_northern_volunteer_mandate_desc: "Assistance to Nodrul's northern opponents and Shabrat's forces is authorised. Existing Kefreyt divisions are used."
 VAL_northern_volunteers_tt: "Volunteers are available in diplomacy for Nodrul's northern opponents and Shabrat. Select existing divisions. Units are recalled after their war against Nodrul ends; remaining fronts are checked weekly."
 VAL_New_Supply_Base: "Independent Supply Base"
 VAL_New_Supply_Base_desc: "We will connect our own northern resource belt to the workshops and roads of integrated Occidia. This requires ending transitional administration in Balchansk, Harbour and the Mining Settlement. These territories will replace Vorkerland's supplies; temporary export payments will no longer be the budget's only support."
 VAL_Northern_Settlement: "Defeat Nodrul"
 VAL_Northern_Settlement_desc: "Nodrul's intervention will not end with a separate border agreement. Kefreyt will not enter a major northern war without its own base. At least one complete tribal settlement must first be secured under Kefreyt or a Kefreyt administration."
 VAL_Stelander_Ultimatum: "Ultimatum to Stelander"
 VAL_Stelander_Ultimatum_desc: "We will demand recognition of Kefreyt's borders in Occidia. A friendly government may accept a trade agreement; Shabrat considers the western lands part of his future state. Refusal opens preparations for a new war."
 VAL_Campaign_Secured: "Kefreyt's Order"
 VAL_Campaign_Secured_desc: "The campaign ends when Nodrul and Stelander lose their independent military power and the cannibal lands enter our sphere. The disappearance of countries from the map is not enough: their economic base must actually answer to Kefreyt."
 VAL_supply_base_secured_tt: "All eight cannibal states are owned and controlled by Kefreyt or its subjects. Antolla, Fareyn, Himber, Balchansk, Harbour and the Mining Settlement are owned and controlled by Kefreyt itself."
 VAL_campaign_objectives_tt: "Kefreyt is independent and at peace. It directly owns the northern resource belt; the remaining cannibal lands belong to it or its subjects. Nodrul, Stelander's party government and Shabrat's state are defeated or subordinate, with their main territory in Kefreyt's sphere. Peaceful republics in districts gained during Stelander's split, and lands ceded to Yapert in the northern peace, do not require reconquest."
 VAL_campaign_against_nod: "Prepare a Campaign Against Nodrul"
 VAL_campaign_against_nod_desc: "Mobilisation lasts 30 days and costs 60 political power. A campaign against Nodrul is available only after a §Yreal victory over Stelander§!: its successor governments must be destroyed or subordinated to Kefreyt and the Steland core territory must be inside Kefreyt's sphere. A northern foothold is also required. If Shabrat is already at war with Nodrul, Kefreyt joins that same war; otherwise a separate war begins. Losing control of Stelander, the foothold, the target, or the target entering our faction cancels preparations."
 VAL_campaign_against_stelander: "Prepare for War: [FROM.GetName]"
 VAL_campaign_against_stelander_desc: "Mobilisation lasts 30 days and costs 60 political power. A separate war against the selected country then begins. The target's disappearance, subordination or entry into our faction cancels preparations. The end of other wars does not count as victory over this target."
 VAL_campaign_preparation_tt: "War against the selected country begins in 30 days if conditions still hold. Another such campaign is unavailable during preparation."
 VAL_nod_campaign_foothold_tt: "A separate campaign against Nodrul requires a northern foothold: every state of at least one tribal bloc must be owned and controlled by Kefreyt or its administration."
 VAL_nod_requires_stelander_victory_tt: "Kefreyt must first win a §Yreal victory over Stelander§!: STP and STS must be destroyed or subordinated to Kefreyt and their core territory must lie inside Kefreyt's sphere."
 VAL_campaign_cancelled_tt: "Preparations cancelled. Political costs are not refunded."
 VAL_stelander_ultimatum: "Present Terms: [FROM.GetName]"
 VAL_stelander_ultimatum_desc: "After the civil war, demand recognition of Occidia. The recipient replies within 21 days. Its leader, relations and earlier supplies influence the AI's choice. Acceptance grants a trade agreement for 180 days; refusal opens 30-day campaign preparations. The agreement does not count as complete campaign victory."
 VAL_stelander_offer_tt: "The recipient has 21 days to respond. An unanswered ultimatum is treated as rejected after the deadline."
 VAL_stelander_terms_tt: "Kefreyt's borders in Occidia are recognised. Western districts owned and controlled by the recipient are ceded to Kefreyt; all three secured states form a temporary contract administration if integration is not yet complete. Both countries gain +5% trade income for 180 days; Kefreyt cannot launch this campaign before the agreement expires. Stelander remains independent."
 VAL_stelander_trade_terms: "Neighbourhood Trade Agreement"
 VAL_stelander_trade_terms_desc: "The parties have temporarily recognised the borders in Occidia and agreed on trade terms."
 val_contract.343.t: "Kefreyt Demands Recognition of the Borders"
 val_contract.343.shabrat: "Kefreyt demands recognition of its rule in Occidia and the cession of the western districts we control, if we still hold them. In return it offers a six-month trade agreement.\n\nShabrat sees this as entrenching Stelander's disintegration. Earlier arms deliveries gave the seller no right to dispose of his territories. Refusal allows Kefreyt to prepare another campaign; our own revenge remains our government's business."
 val_contract.343.friendly: "Kefreyt proposes settling the western border and opening trade for six months. Good relations allow an agreement without another war, but recognition means abandoning claims to Occidia. If we still own and control the western districts, their transfer will be required.\n\nAcceptance preserves independence. Refusal leaves Kefreyt free to prepare a campaign."
 val_contract.343.d: "Kefreyt demands recognition of its rule in Occidia. A signature brings a six-month trade agreement; refusal may bring military preparations. We must cede the western districts that we own and control.\n\nThe terms remain open for 21 days. Delay will be interpreted as refusal."
 val_contract.343.refuse: "Reject the terms. Close the offer."
 val_contract.343.accept: "Recognise the border and sign the treaty."
 VAL_regional_settlement: "Regional Treaty System"
 VAL_regional_settlement_desc: "Subordinate territories and common settlement rules provide steady revenue for Kefreyt's treasury."
 val_contract.345.t: "Kefreyt's Campaign Is Complete"
 val_contract.345.d: "Nodrul no longer determines the north's future. Stelander's independent military centre is broken, and the cannibal lands have entered Kefreyt's system. Warehouses, roads and workshops are bound by agreements now backed by force.\n\nThe campaign's main goals are achieved. The game continues: holding what we have gained will require the same army, supplies and treasury."
 val_contract.345.a: "Secure the new order."
