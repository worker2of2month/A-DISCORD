 VAL_frontier_begin_offensive_desc:0 "Begin war against the selected target and its northern alliance. Nodrul first issues an ultimatum, leaving Kefreyt 100 days to defeat the coalition before intervention."
 VAL_frontier_withdraw_demand: "Withdraw the Frontier Ultimatum"
 VAL_frontier_withdraw_demand_desc: "Close the current campaign and end the paid transport contract. Another ultimatum to the same recipient is possible after the original 180-day period."
 VAL_frontier_withdraw_tt:0 "Withdraw the demands, release temporary coalition participants and end the transport contract. The northern tribes retain their own alliance. Preparation costs are not refunded. Withdrawing a northern-tribe demand also opens the non-expansion route; this is not a victory."
