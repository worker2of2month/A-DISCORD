 VAL_frontier_workshops: "Open Repair Workshops: [FROM.GetName]"
 VAL_frontier_workshops_desc: "Invest 500 treasury funds in a repair base on Kefreyt’s own territory. After 90 days, [FROM.GetName] receives one additional building slot and one military factory. Subject administrations are excluded. Loss of ownership or control, capitulation or a new war cancels the project and refunds 500 treasury funds. Work may proceed in several districts simultaneously."
