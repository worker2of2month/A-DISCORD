 VAL_weapons_menu_desc:0 "Partner: [VALMenuPartnerName].\n\nReady stock is a one-off sale for full payment. Quarterly agreements cover four deliveries in a year and cost 100 political power to sign. No advance or passive income. Buyers may be at peace.\n\nQuarterly supply: [VALOrderMenuStatus]"

 VAL_ready_menu_desc:0 "Packages: 25000 / 50000 / 100000 / 200000 rifles for 500 / 1000 / 2250 / 5000 treasury. The buyer receives weapons; Kefreyt receives payment.\n\nRequires the unlocking focus, a free slot, equipment and buyer funds. Unavailable offers are hidden. Large packages are on the next page."

 VAL_orders_menu_desc:0 "Partner: [VALMenuPartnerName].\n\n[VALOrderMenuStatus]\n\nSigning fee: £pol_power 100 on buyer acceptance. Four deliveries over a year, no advance. Payment on dispatch only. First delivery within 90 days; early dispatch does not open the next quarter. A missed deadline grants 15 days of grace, then termination. Hover an offer for its quarterly quantity and price."

