 VAL_cw_neutral_srp_tt: "If the republics already exist and are at peace, their mobilisation orders will be closed: Kefreyt will not be their customer."
 val_rework.2.t: "Signatures Instead of Oaths"
 val_rework.2.d: "There is no throne in the accounting hall. There is a table, a seal and a queue of captains who have come to check their rates, not swear allegiance.\n\nSolgalov does not promise them a homeland. He promises payment, cartridges and someone who will come if the agreement is broken."
 val_rework.2.a: "Open the ledger."
 val_rework.3.t: "The Harvest of Ash"
 val_rework.3.d: "Spent cases and parched furrows still lie beyond the villages. The people know how to live among metal better than among grain.\n\nNow the state must decide what matters more to preserve: the people who can still hold a rifle, or the homesteads that can still feed the workshops."
 val_rework.3.a: "Count what remains."
 val_rework.4.t: "Contracts Outlive Kings"
 val_rework.4.d: "The register no longer depends on one man. Captains, workshops and headquarters have been brought into one ledger, and that ledger will outlive any baron who places his seal upon it."
 val_rework.4.a: "Let the system endure."
 val_rework.5.t: "The Steel Ledger's Balance"
 val_rework.5.trade: "The Stelander deliveries have been paid for and fulfilled. The arsenals now have grounds to expand output, and the treasury has its share of someone else's war."
 val_rework.5.military: "The northern passes have become a military account. Headquarters demands new production lines and leaves field experience to those who led the columns."
 val_rework.5.neutral: "The clearing house is closing the Stelander ledger. Without a fulfilled arms contract or a secured Occidian base, the government cannot present a new market to the arsenals as an accomplished fact. Some companies preserved their reserves; others returned from an unsuccessful campaign. A promise alone does not pay for expanded production.\n\nThe task now is to reconcile commitments, restore confidence in government decisions, and put the remaining resources in order."
 val_rework.5.a: "Close the account."
 val_rework.6.t: "Cathedrals of the Workshop"
 val_rework.6.d: "In Kefreyt, a temple is a shift that has not gone cold. Workshop vaults hold soot better than any prayer, and steel leaves the fire already bearing its buyer's address.\n\nSolgalov is not building a cathedral for the faithful. He is installing another line so the country can pay for bread in the same language it uses to frighten its neighbours."
 val_rework.6.a: "Light the furnaces."
 val_rework.7.t: "Companies in One Ledger"
 val_rework.7.d: "Captains have long treated their companies as private shops. Now each shop receives a number, a rate and someone who will ask where the cartridges went.\n\nThe register does not make them patriots. It makes them predictable: those listed receive payment; those missing are left with empty wagons."
 val_rework.7.a: "Open the register."
 val_rework.8.t: "October's Shadow"
 val_rework.8.d: "Steland remembers October as a wound. Kefreyt remembers it as a signature that can still be presented.\n\nThe new northern road does not require love. It is enough that the old account still frightens those who once put their seals upon it."
 val_rework.8.a: "Keep the papers."
 val_rework.9.t: "Stelander: New Courses of Action"
 val_rework.9.d: "Reports from Stelander confirm open fighting between the party forces and the resistance. Intelligence summaries are becoming orders: brokers seek buyers, captains review routes, and arsenals count uncommitted weapons.\n\nThe Stelander crisis branch has opened in the national focus tree. It can formalise arms deliveries, prepare a separate operation in the mountain passes, or keep the reserves at home. Existing commitments remain binding; this briefing neither selects a policy nor declares war.\n\n[ROOT.VALGetStelanderCrisisStatus]"
 val_rework.9.a: "Review the available courses."
 val_rework.10.t: "The Buyer Burned"
 val_rework.10.d: "The western addresses no longer answer. Wagons stand on sidings, and brokers offer the same signatures that have already lost all meaning.\n\nKefreyt knows how to live without friends. Without a market, it does not. While Vorkerland's ashes are still hot, we must decide who will pay for the next shifts."
 val_rework.10.a: "Redraw the routes."
 val_rework.11.t: "War for Hire"
 val_rework.11.d: "Other people's blood is cheaper than our own land. A company leaves with rations, rifles and a term of service, and the treasury receives what Kefreyt's fields cannot grow.\n\nSolgalov does not sell glory. He sells discipline for a fixed term and demands that payment arrive before the casualty lists."
 val_rework.11.a: "Name the price."
 VAL_ops_family_remaining_tt: "There is still a contract type available to offer."
 VAL_northern_export_buyer_choice_tt: "The recipient will decide whether to accept the shipment. Refusal returns the rifles."
 VAL_northern_export_accepted_tt: "Shipment accepted. Kefreyt receives the agreed revenue; the recipient receives the rifles."
 VAL_northern_export_refused_tt: "The recipient refused. Reserved rifles will return to Kefreyt's stockpile."
 VAL_northern_finance_buyer_choice_tt: "The market's authority will decide whether to admit Kefreyt's brokers. Refusal refunds the treasury funds."
 VAL_northern_finance_accepted_tt: "The broker network will expand by one level."
 VAL_northern_finance_refused_tt: "Access denied. The invested §Y50§! will return to the treasury."
 VAL_westerholm_offer_tt: "Vorkerland will receive an offer to expand steel extraction in [38.GetName] and grant Kefreyt the rights. Acceptance opens additional deliveries until the civil war."
 VAL_westerholm_accepted_tt: "Kefreyt gains steel rights in [38.GetName] until Vorkerland collapses or the deposit is lost."
 VAL_westerholm_refused_tt: "Vorkerland rejected the supply expansion. Rights to the deposit remain unchanged."
 val_contract.310.t: "Kefreyt's Shipment"
 val_contract.310.d: "A Kefreyt column carrying rifles waits at the border. Accepting means receiving the weapons; Kefreyt will collect the revenue at the agreed price. Refusal sends the wagons back."
 val_contract.310.a: "Accept the shipment."
 val_contract.310.b: "Send the column back."
 val_contract.311.t: "Kefreyt's Shipment"
 val_contract.320.t: "Vorkerland Metal Concession"
 val_contract.320.d: "Kefreyt offers to buy the steel rights to the western deposit. Acceptance preserves our formal ownership of the district, but the ore and rent will enter Kefreyt's ledger. Refusal keeps the seam in our hands."
 val_contract.320.a: "Cede the rights."
 val_contract.320.b: "Reject the concession."
 val_contract.330.t: "Kefreyt's Brokers"
 val_contract.330.d: "Kefreyt's offices request permanent market access. Acceptance expands their network. Refusal refunds their treasury investment, but not their political costs."
 val_contract.330.a: "Admit the offices."
 val_contract.330.b: "Deny access."
