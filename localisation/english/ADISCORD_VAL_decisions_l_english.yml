l_english:
 VAL_Operational_Directorate: "Operations Directorate"
 VAL_Operational_Directorate_desc: "Our neighbours cannot be treated as one continuous frontier. The directorate will combine information on passes, markets, garrisons and regional authorities in a single, constantly updated map."
 VAL_Ministry_Of_Contract_Memory: "Ministry of Contract Records"
 VAL_Ministry_Of_Contract_Memory_desc: "The state needs more than rifles: it needs the authority to explain why every new contract was inevitable. The ministry will open one permanent propaganda campaign slot."
 VAL_Paid_Loyalty: "Paid Loyalty"
 VAL_Paid_Loyalty_desc: "The captains' loyalty must depend on the payment register, not their personal closeness to the ruler."
 VAL_Provincial_Brokers: "Provincial Brokers"
 VAL_Provincial_Brokers_desc: "Local brokers will collect applications, recruit contractors and provide early warning of unrest."
 VAL_Closed_Ledgers: "Closed Ledgers"
 VAL_Closed_Ledgers_desc: "Centralised accounting will prevent captains from concealing men and weapons in parallel books."
 VAL_State_Above_Captains: "The State Above the Captains"
 VAL_State_Above_Captains_desc: "The contract system will outlive its founders only when no company can consider itself the state's equal."
 VAL_Quarterly_Contract_Norm: "Quarterly Contract Quota"
 VAL_Quarterly_Contract_Norm_desc: "Every ninety days, the arsenals must reserve and dispatch four thousand rifles against Kefreyt's standing export commitments. This is a separate reputation quota, not one of the targeted export-contract decisions. Meeting it sustains confidence and revenue; failure damages creditworthiness."
 VAL_Contract_Accounting_Office: "Industrial Budget"
 VAL_Contract_Accounting_Office_desc: "Accounting for state orders will bring arsenal accounts, tax payments and production plans together. The reform increases recurring treasury income and reduces administrative expenditure."
 VAL_Salvage_Every_Barrel: "Restoring Weapon Reserves"
 VAL_Salvage_Every_Barrel_desc: "Warehouse commissions will return serviceable weapons to circulation. Salvaging decommissioned stock will build a reserve without diverting new production lines."
 VAL_Standardize_Rifle_Lots: "Standardise Rifle Batches"
 VAL_Standardize_Rifle_Lots_desc: "Common tolerances and markings will simplify repairs, exports and quarterly deliveries."
 VAL_Merchant_Rail_Yards: "Commercial Rail Yards"
 VAL_Merchant_Rail_Yards_desc: "Military cargo must leave the country without spending weeks at congested stations."
 VAL_Mobilize_Machine_Shops: "Machine Tool Programme"
 VAL_Mobilize_Machine_Shops_desc: "Dependence on imported equipment turns any interruption of trade into an industrial disaster. Machine shops will receive a common plan to repair and manufacture tools for Kefreyt's factories."
 VAL_Arsenal_Reserve: "Arsenal Reserve"
 VAL_Arsenal_Reserve_desc: "Some of our output must be withheld from immediate sale. An emergency reserve will let us meet our obligations even during mobilisation."
 VAL_Westerholm_Concessions: "Additional Vorkerland Supplies"
 VAL_Westerholm_Concessions_desc: "We will propose that Vorkerland expand the deposit in [38.GetName] and grant us rights to its steel. The agreement lasts only until Vorkerland collapses or the supply area is lost."
 VAL_Company_Rosters: "Company Rosters"
 VAL_Company_Rosters_desc: "Every mercenary company will enter a single register of personnel, equipment and obligations."
 VAL_Border_Survey_Corps: "Border Survey Corps"
 VAL_Border_Survey_Corps_desc: "Small teams will survey roads, bridges and passes along the routes of our immediate ambitions."
 VAL_Contractor_Officers: "Contract Officers"
 VAL_Contractor_Officers_desc: "Our best commanders will receive state contracts and common training requirements. The reform raises army organisation by §G3%§! above the current level of the contract forces."
 VAL_Motorized_Columns: "Motorised Columns"
 VAL_Motorized_Columns_desc: "Mobile columns will organise deliveries to scattered companies. Army supply consumption will fall by §G3%§!, independently of other military reforms."
 VAL_Field_Repair_Corps: "Field Repair Corps"
 VAL_Field_Repair_Corps_desc: "Repair teams will follow the companies and return equipment to service. Army organisation recovery will improve by §G3%§!, independently of other military reforms."
 VAL_Reserve_Battalions: "Reserve Battalions"
 VAL_Reserve_Battalions_desc: "The state will form a reserve of its own, independent of current private orders."
 VAL_Contract_General_Staff: "Contract General Staff"
 VAL_Contract_General_Staff_desc: "The staff will coordinate company plans, transport offices and trophy accounting. Planning speed will increase by §G5%§! and equipment capture by §G3%§!, even with a fully developed contract army."
 VAL_Vorkerland_Contracts_Burn: "Vorkerland Supplies Severed"
 VAL_Vorkerland_Contracts_Burn_desc: "The collapse of our main market has left arsenals unpaid and suppliers without guarantees. We will close the most dangerous obligations and use the released reserves to keep production running. This is the first of six crisis programmes."
 VAL_Inventory_The_Empty_Yards: "Industrial Inventory"
 VAL_Inventory_The_Empty_Yards_desc: "The government needs verified figures on machine tools, raw materials and unfinished orders. An inventory will establish which plants can resume work immediately and which need new equipment."
 VAL_military_operations: "Military Operations"
 VAL_military_operations_desc: "The operational situation in Occidia, the northern lands and South Tsaygen. Colours reflect current control. Sales are found under Export Contracts."
 VAL_contract_management: "Contract Management"
 VAL_contract_management_desc: "Run the domestic machinery of the contract state. Propaganda campaigns are limited by available media slots, while the quarterly delivery norm protects Kefreyt's reputation, revenue and ability to service its debt."
 VAL_operations_panel_title: "OPERATIONS MAP"
 VAL_operations_panel_tt: "The map shows Steland, [CIN.GetName], [OSF.GetName] and the northern borderlands. Participants use the same country names as the main map."
 VAL_operations_map_tt: "The lands of Kefreyt, Stelander, Nodrul and the cannibals. Countries are shown in their national colours according to current state control. Internal borders and yellow hatching for divided control appear only in territory administered by Kefreyt.\n\nEconomic recovery requires the northern economic base and the integration of Occidia. Ertia is not required for recovery."
 VAL_operations_legend: "§RKefreyt§! / lighter - administration\n§BLocal authority§!   §OEnemy§!   §gOther controller§!"
 VAL_focus_operations_map_unlock_tt: "Unlocks the §YMilitary Operations§! decision category and an interactive map of neighbouring regions."
 VAL_ops_finance_cin_contacts: "Contacts with [CIN.GetNameDef]"
 VAL_ops_finance_cin_contacts_desc: "For £political_power_texticon §Y10§! and £ADISCORD_economy_treasury_texticon §Y50§!, [CIN.GetName] will decide within §Y21 days§! whether to admit Kefreyt's brokers. Acceptance raises the network by §Y1 level§! (§G+2%§! trade income, capped at §Y3§! / §G6%§!). Refusal, disappearance, capitulation or war refunds §Y50§!; political costs are not refunded. Current network: §Y[?VAL_CIN_influence|0]/3§!."
 VAL_ops_sell_rifles_to_cin: "Rifles for [CIN.GetNameDef]"
 VAL_ops_sell_rifles_to_cin_desc: "Reserve £infantry_equipment_texticon §Y[VALGetExportRifleQuantity]§! rifles. After §Y21 days§!, [CIN.GetName] will accept or reject the shipment. Acceptance gives Kefreyt £ADISCORD_economy_treasury_texticon §G[VALGetExportIncome]§! and raises the buyer's network by §Y2 levels§! (up to §Y3§!, each granting §G2%§! trade income). Refusal, disappearance, capitulation or war returns the rifles. After Military Adviser Contracts, the offer will go to the second northern buyer if it can still accept the shipment. £political_power_texticon §Y10§! is not refunded. Quantity and revenue are fixed when the reserve is placed."
 VAL_ops_finance_osf_contacts: "Contacts with [OSF.GetNameDef]"
 VAL_ops_finance_osf_contacts_desc: "For £political_power_texticon §Y10§! and £ADISCORD_economy_treasury_texticon §Y50§!, [OSF.GetName] will decide within §Y21 days§! whether to admit Kefreyt's brokers. Acceptance raises the network by §Y1 level§! (§G+2%§! trade income, capped at §Y3§! / §G6%§!). Refusal, disappearance, capitulation or war refunds §Y50§!; political costs are not refunded. Current network: §Y[?VAL_OSF_influence|0]/3§!."
 VAL_ops_sell_rifles_to_osf: "Rifles for [OSF.GetNameDef]"
 VAL_ops_sell_rifles_to_osf_desc: "Reserve £infantry_equipment_texticon §Y[VALGetExportRifleQuantity]§! rifles. After §Y21 days§!, [OSF.GetName] will accept or reject the shipment. Acceptance gives Kefreyt £ADISCORD_economy_treasury_texticon §G[VALGetExportIncome]§! and raises the buyer's network by §Y2 levels§! (up to §Y3§!, each granting §G2%§! trade income). Refusal, disappearance, capitulation or war returns the rifles. After Military Adviser Contracts, the offer will go to the second northern buyer if it can still accept the shipment. £political_power_texticon §Y10§! is not refunded. Quantity and revenue are fixed when the reserve is placed."
 VAL_campaign_rifles_and_bread: "Rifles and Bread Campaign"
 VAL_campaign_rifles_and_bread_desc: "For fifty days, link military production to the promise of everyday security. Occupies one propaganda slot."
 VAL_campaign_contracts_feed_families: "Contracts Feed Families Campaign"
 VAL_campaign_contracts_feed_families_desc: "For sixty days, present the contract economy as the only guarantee of employment and order."
 VAL_campaign_no_promise_without_payment: "No Promises Without Payment Campaign"
 VAL_campaign_no_promise_without_payment_desc: "For forty-five days, turn our tough business reputation into a political and commercial asset."
 VAL_campaign_the_mine_was_stolen: "They Stole Our Mine Campaign"
 VAL_campaign_the_mine_was_stolen_desc: "Following the loss of Vorkerland's metal, direct public anger outward and prepare society to fight for a new source of metal."
 VAL_quarterly_contract_deadline: "Quarterly Quota Deadline"
 VAL_quarterly_contract_deadline_desc: "We must deliver §Y4000 rifles§! by the end of the quarter. Missing the deadline lowers contract reputation by one level and immediately starts the next ninety-day period."
 VAL_pay_quarterly_contract_norm: "Meet the Quarterly Quota"
 VAL_pay_quarterly_contract_norm_desc: "Deduct §Y4000 rifles§! and fulfil the current quota. A successful delivery restores one lost reputation level, up to the maximum."
 VAL_big_buyers: "Major Buyers"
 VAL_big_buyers_desc: "While Vorkerland retains a unified market, major buyers provide a steady flow of orders: §G+20§! weekly income, §G+20%§! trade income, §G+10%§! civilian industry income, §G+8%§! military industry income, §G+8%§! investment confidence and §G+5%§! production efficiency growth.\n\nThe price of this dependence is §R+5%§! social expenditure, §R+5%§! state overload growth, §R-5%§! creditworthiness and §R-3%§! stability.\n\n    §RAny upheaval among our partners will end this support.§!\n\nKefreyt gains rights to steel in [33.GetName]. Deliveries end if civil war breaks out in Vorkerland or the state is lost. Kefreyt's homeland contains only oil."
 VAL_westerholm_concession_income: "Vorkerland Concession"
 VAL_westerholm_concession_income_desc: "Kefreyt receives metal and rental income from developing a deposit in Vorkerland."
 VAL_vorkerland_contract_disruptions: "Vorkerland Supplies Severed"
 VAL_vorkerland_contract_disruptions_desc: "Lost orders and raw materials have devastated revenue and factory utilisation. Exports temporarily sustain the treasury. The Independent Supply Base focus removes this penalty after the cannibal lands are subordinated and Occidia's Balchansk, Harbour and Mining Settlement are integrated."
 VAL_vorkerland_metal_shortage: "Vorkerland Metal Shortage"
 VAL_vorkerland_metal_shortage_desc: "Losing control of the Vorkerland deposit has deprived industry of its established raw material supply."
 VAL_contract_reputation_3: "Impeccable Contract Reputation"
 VAL_contract_reputation_3_desc: "Kefreyt meets its quarterly deliveries precisely on time; buyers and creditors consider it reliable."
 VAL_contract_reputation_2: "Sound Contract Reputation"
 VAL_contract_reputation_2_desc: "Recent deliveries have generally been honoured, but the market no longer grants Kefreyt its former reliability premium."
 VAL_contract_reputation_1: "Damaged Contract Reputation"
 VAL_contract_reputation_1_desc: "Repeated failures reduce income, damage creditworthiness and increase debt servicing costs."
 VAL_contract_reputation_0: "Contract Default"
 VAL_contract_reputation_0_desc: "The market no longer trusts Kefreyt's promises. Revenue has collapsed, credit has contracted and old debts have grown heavier."
 VAL_Ministry_Auditors: "Ministry Auditors"
 VAL_Ministry_Auditors_desc: "Auditors will reconcile export agreements and payments to recover missed fees for the budget. Trade income will rise by §G5%§!, independently of the contract administration level."
 VAL_Central_Payment_Office: "Central Payments Office"
 VAL_Central_Payment_Office_desc: "State orders will be settled through a single office capable of distinguishing temporary delays from systemic failure."
 VAL_Provincial_Contract_Courts: "Provincial Contract Courts"
 VAL_Provincial_Contract_Courts_desc: "Disputes between manufacturers, brokers and companies will follow one state procedure."
 VAL_Captains_Cannot_Veto: "Captains Have No Veto"
 VAL_Captains_Cannot_Veto_desc: "Commanders will retain a voice in military matters, but can no longer block state decisions by threatening to terminate private contracts."
 VAL_State_Contract: "State Contract"
 VAL_State_Contract_desc: "The payments office, courts and subordinate captains form a lasting political system, rather than a temporary alliance around one ruler."
 VAL_Wireless_Contract_Bureau: "Contract Broadcasting Bureau"
 VAL_Wireless_Contract_Bureau_desc: "Radio, leaflets and frontline correspondents will receive a common editorial plan and permanent funding."
 VAL_Stories_From_The_Front: "Stories from the Front"
 VAL_Stories_From_The_Front_desc: "Instead of abstract slogans, the bureau will show real people whose families live from production and military service."
 VAL_Two_Concurrent_Narratives: "Two Concurrent Narratives"
 VAL_Two_Concurrent_Narratives_desc: "Separate domestic and foreign editorial offices will allow one additional propaganda campaign to run at the same time."
 VAL_Munitions_Board: "Munitions Board"
 VAL_Munitions_Board_desc: "The board will combine army requisitions and export obligations into a single production schedule."
 VAL_Export_Clearing_House: "Direct Settlement"
 VAL_Export_Clearing_House_desc: "The export clearing house will reconcile mutual obligations and direct payments into the state budget without a chain of private collectors. The revenue base will expand and administrative costs will fall."
 VAL_Standard_Cartridges: "Standard Cartridges"
 VAL_Standard_Cartridges_desc: "Uniform cartridges and packaging will reduce warehouse losses and simplify supply for contract companies."
 VAL_Three_Shift_Arsenals: "Expanding Serial Production"
 VAL_Three_Shift_Arsenals_desc: "Restored machine tools must produce compatible items in large batches. A stable shift system will consolidate industrial reconstruction."
 VAL_Reserve_Accounting: "Strategic Stockpile System"
 VAL_Reserve_Accounting_desc: "Raw material and weapon reserves will be recorded under common standards. This will supply the field army, fulfil foreign orders and keep factories running through the next interruption of deliveries."
 VAL_Industrial_Mobilization_Plan: "New Industrial Policy"
 VAL_Industrial_Mobilization_Plan_desc: "We will bring emergency measures into one production plan. This is the last of six initial programmes: some penalties will remain until victory, restored trade and a postwar debt settlement."
 VAL_Company_Service_Code: "Contract Service Code"
 VAL_Company_Service_Code_desc: "Common service rules will define each company's responsibilities to headquarters, the state and neighbouring units."
 VAL_Contract_NCO_Schools: "Contract NCO Schools"
 VAL_Contract_NCO_Schools_desc: "Common training for junior commanders will let companies act together without losing control on the march."
 VAL_Logistics_Command: "Logistics Command"
 VAL_Logistics_Command_desc: "Field repairs, transport and warehouses will answer to one command with a shared picture of stockpiles."
 VAL_Operational_Reserves: "Operational Reserves"
 VAL_Operational_Reserves_desc: "Reserve battalions will receive standard weapons and deployment routes designated in advance."
 VAL_Army_Of_The_Ledger: "Army of the Ledger"
 VAL_Army_Of_The_Ledger_desc: "Contract companies finally become an army, with common headquarters, supply, reserves and a chain of command."
 VAL_Foreign_Broker_Licences: "Foreign Broker Licences"
 VAL_Foreign_Broker_Licences_desc: "We will open a unified export office. Governments at war in the north, Stelander and Vorkerland will be able to buy our rifles. Short contracts will help us weather the loss of former supplies."
 VAL_Northern_Clearing_House: "Second Export Desk"
 VAL_Northern_Clearing_House_desc: "A separate settlement team will handle a second arms contract. Each agreement still needs its own buyer, their consent to payment and a real shipment of weapons."
 VAL_Contingency_Ledgers: "Military Adviser Contracts"
 VAL_Contingency_Ledgers_desc: "The experience of Kefreyt's staffs also has a price. We will authorise one paid advisory mission: the recipient gains military assistance and our treasury receives temporary income."
 VAL_contract_administration_1: "Contract Administration I"
 VAL_contract_administration_1_desc: "Unified registers improve revenue collection and state resilience."
 VAL_contract_administration_2: "Contract Administration II"
 VAL_contract_administration_2_desc: "Central settlement and contract courts strengthen taxation, trade and political control."
 VAL_contract_administration_3: "Contract Administration III"
 VAL_contract_administration_3_desc: "The completed contract system raises revenue and reduces the burden on the state apparatus."
 VAL_contract_industry_1: "Contract Industry I"
 VAL_contract_industry_1_desc: "Verified orders accelerate efficiency growth on weapon production lines."
 VAL_contract_industry_2: "Contract Industry II"
 VAL_contract_industry_2_desc: "Standardisation and accounting raise output and reduce losses from material shortages."
 VAL_contract_industry_3: "Contract Industry III"
 VAL_contract_industry_3_desc: "The mobilisation plan unites the arsenals into a mature military industry."
 VAL_contract_army_1: "Contract Army I"
 VAL_contract_army_1_desc: "Company rosters provide a foundation for shared organisation and planning."
 VAL_contract_army_2: "Contract Army II"
 VAL_contract_army_2_desc: "Common officer standards, repairs and supply strengthen the forces."
 VAL_contract_army_3: "Contract Army III"
 VAL_contract_army_3_desc: "A common staff turns separate companies into a cohesive, coordinated army."
 VAL_contract_propaganda_office: "Contract Propaganda Bureau"
 VAL_contract_propaganda_office_desc: "A permanent editorial office sustains public order and readiness through coordinated campaigns."
 VAL_contract_propaganda_upgrade_tt: "Activates the hidden permanent contract broadcasting bonus."
 VAL_factory_cathedrals_drive_tt: "For §Y365 days§!: military factory construction speed §G+10%§!."
 VAL_hot_production_lines_tt: "Maximum production efficiency §G+3%§!."
 VAL_northern_roads_drive_tt: "For §Y365 days§!: infrastructure construction speed §G+10%§!."
 VAL_focus_contract_board_tt: "Grants access to the §Ycontract board§! and foreign operations."
 VAL_focus_authority_5_tt: "§G+5§! §Ycontract authority§!."
 VAL_focus_authority_10_tt: "§G+10§! §Ycontract authority§!."
 VAL_focus_captain_retainers_tt: "Unlocks §Yretained captains§! for special contracts."
 VAL_focus_count_captains_tt: "Unlocks a §Ycount and audit§! of the captains."
 VAL_focus_foreign_operations_tt: "Unlocks §Yforeign operations§! on the interactive map."
 VAL_focus_quality_arsenal_tt: "Activates the contract state's §Yquality arsenal§! specialisation."
 VAL_focus_broad_resource_network_tt: "Activates the contract state's §Ybroad resource network§! specialisation."
 VAL_focus_supply_contracts_tt: "Activates the contract state's §Ysupply contracts§! specialisation."
 VAL_focus_resource_raider_tt: "Activates Gromov's §Yresource raider§! doctrine."
 VAL_focus_manpower_preservation_tt: "Activates the Harvest of Ash §Ymanpower preservation§! model."
 VAL_focus_rear_mobilization_tt: "Activates the Harvest of Ash §Yrear mobilisation§! model."
 VAL_focus_north_coercive_tt: "Activates the §Ycoercive measures§! specialisation for northern policy."
 VAL_focus_northern_operations_tt: "Unlocks §Ynorthern operations§! on the military map."
 VAL_rework_debug: "§RDEBUG:§! Kefreyt"
 VAL_rework_debug_desc: "Kefreyt system controls. Visible only in debug mode."
 VAL_debug_initialize_systems: "§RDEBUG:§! Initialise Systems"
 VAL_debug_initialize_systems_desc: "Reruns safe initialisation of the economy, propaganda, quarterly quota and resource states."
 VAL_debug_unlock_operations_map: "§RDEBUG:§! Unlock Operations Map"
 VAL_debug_unlock_operations_map_desc: "Forcibly enables the military operations category and its interactive map."
 VAL_debug_disrupt_vorkerland_contracts: "§RDEBUG:§! Disrupt Vorkerland Contracts"
 VAL_debug_disrupt_vorkerland_contracts_desc: "Enables the loss of Vorkerland revenue and opens the corresponding emergency branch."
 VAL_debug_lose_westerholm_metal: "§RDEBUG:§! Lose Vorkerland Metal"
 VAL_debug_lose_westerholm_metal_desc: "Simulates losing resource rights and enables the metal shortage."
 VAL_debug_reputation_maximum: "§RDEBUG:§! Maximum Reputation"
 VAL_debug_reputation_maximum_desc: "Sets contract reputation to its highest level."
 VAL_debug_reputation_minimum: "§RDEBUG:§! Contract Default"
 VAL_debug_reputation_minimum_desc: "Sets contract reputation to its lowest level."
 VAL_debug_grant_contract_reserves: "§RDEBUG:§! Grant Test Reserves"
 VAL_debug_grant_contract_reserves_desc: "Adds treasury funds, rifles and support equipment for testing decisions."
 VAL_debug_reset_rework_state: "§RDEBUG:§! Reset Debug States"
 VAL_debug_reset_rework_state_desc: "Removes only debug crisis stages and test Vorkerland penalties, without changing focus progress."
 VAL_contract_state: "Contract State"
 VAL_contract_state_desc: "Contract Authority: §Y[?VAL_contract_authority|0]/100§! — §Y[VALGetContractAuthorityBand]§!. The bonuses below are recalculated when authority or a completed military, industrial or administrative specialisation changes."
 VAL_CONTRACT_AUTHORITY_DOMINANT: "unified command"
 VAL_CONTRACT_AUTHORITY_CENTRALIZED: "centralised command"
 VAL_CONTRACT_AUTHORITY_COHERENT: "stable system"
 VAL_CONTRACT_AUTHORITY_BROKERED: "regulated market"
 VAL_CONTRACT_AUTHORITY_FRAGMENTED: "scattered captains"
