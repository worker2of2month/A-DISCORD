 VAL_trade_routes:0 "Trade routes"
 VAL_trade_routes_desc:0 "Security: §Y[?VAL_corridor_security|0]/3§!. £ADISCORD_economy_trade_texticon Grey market: §Y[?VAL_black_market_pressure|0]/100§!.\nBrokers: §Y[?VAL_broker_dependence|0]/3§!. Weekly change: §Y[?VAL_black_market_last_delta|=0]§!.\nLost to the grey market last week: £ADISCORD_economy_treasury_texticon §Y[?VAL_black_market_loss_last_week|1]§!.\nTotal lost: £ADISCORD_economy_treasury_texticon §Y[?VAL_black_market_loss_total|1]§!.\nHover over the map for thresholds and causes."
 VAL_trade_map_tt:0 "Rail sections have sleepers. Dashed connections link nodes without a continuous railway. Colours show contractual corridor availability. Hover over a route name below the map.\n\nThe §Ygrey market§! diverts regular treasury income into underground trade. Losses apply to the ordinary budget, positive weekly bonuses and corridor payments. One-off rewards, loans and deposit refunds are unaffected.\n\nOnly the current tier applies:\n§Y0-24§!: no losses.\n§Y25-49§!: income §Y-10%§!; administration expenses §Y+2%§!; stability §Y-1%§!.\n§Y50-74§!: income §Y-25%§!; administration expenses §Y+5%§!; stability §Y-3%§!.\n§Y75-100§!: income §Y-50%§!; administration expenses §Y+10%§!; stability §Y-6%§!; political power §Y-0.05/day§!.\n\nLast week means income lost in the latest completed budget period; total means losses since tracking began. Extra administration expenses are excluded. Forecasts and opening the panel do not increase these counters. Route amounts already reflect current losses.\n\nWeekly change:\n- +3 per disrupted previously operating route;\n- +2 while at war, +3 when housing is overcrowded;\n- +1 per level of broker dependence;\n- -2 when all commissioned routes operate, with at least one open;\n- -1 per level of security.\nAt pressure 50 or higher and security below 3, operating routes are marked at risk; this warning alone does not close a route, but the income reductions above apply."
 VAL_trade_map_legend:0 "§GOpen§!  §YAt risk§!  §RStopped§!\nGrey dashed line - not commissioned"
