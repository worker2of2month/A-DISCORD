 VAL_hire_partner_volunteers_desc:0 "Receive £manpower_texticon [VALHireDecisionPeople] people from partner reserves for £ADISCORD_economy_treasury_texticon [VALHireDecisionPrice] treasury.\n\nSending an offer reserves its price from Kefreyt treasury. The partner receives payment only after consent and manpower transfer. Refusal, expiry or failed conditions return the reserved payment. Recruitment from this partner can repeat 365 days after settlement."

