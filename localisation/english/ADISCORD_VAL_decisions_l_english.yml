 VAL_livonn_settlement_category_desc: "After defeating the mountain republics, Kefreyt also established a military administration in §Y[45.GetName]§!. The prewar treaty with Shabrat promised the district to the resistance. Kefreyt must now decide whether a signature remains binding after victory."
 VAL_honor_livonn_agreement: "Honour the Treaty with Shabrat"
 VAL_honor_livonn_agreement_desc: "Transfer §Y[45.GetName]§! to Shabrat's side, as promised before intervention. Other territories occupied by Kefreyt during the campaign remain under our control."
 VAL_keep_livonn: "Keep Livonin for Kefreyt"
 VAL_keep_livonn_desc: "Declare the prewar agreement void. §Y[45.GetName]§! remains under Kefreyt's administration."
 VAL_frontier_transport_contract: "Hire Transport Columns"
 VAL_frontier_transport_contract_desc: "Pay the hauliers and assign them 100 trucks from the army reserve. Army supply consumption falls by 10% for 180 days. The contract ends early if the ultimatum is withdrawn or the frontier campaign ends. Funds and trucks are spent without refund; a new contract can be placed after the previous one ends."
 VAL_frontier_transport_columns: "Expeditionary Transport Columns"
 VAL_frontier_transport_columns_desc: "Paid hauliers and assigned trucks serve the frontier expedition. The contract lasts no more than 180 days and ends with the campaign."
