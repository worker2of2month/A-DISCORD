 VAL_export_offer_pending: "Awaiting a response to the export offer"
 VAL_export_customer_cooldown: "The previous agreement has not yet expired"
 VAL_campaign_mobilizing: "Another campaign is being prepared"
 VAL_campaign_target: "This country is the target of preparations"
 VAL_stelander_offer_pending: "Awaiting Stelander's response"
 VAL_stelander_refused: "The government rejected the ultimatum"
 VAL_stelander_truce: "An agreement with Kefreyt is in force"
 NKA: "Northern Contract Administration"
 NKA_DEF: "the Northern Contract Administration"
 NKA_ADJ: "Northern Kefreyt"
 NKA_Contract_Council: "Viktor Karst"
 autonomy_VAL_contract_administration: "Kefreyt Contract Administration"
 VAL_create_northern_administration: "Establish the Northern Contract Administration"
 VAL_create_northern_administration_desc: "Antolla, Fareyn and Himber will form Kefreyt's own resource belt. The other five northern states will unite in a dependent administration with its capital in Kilnet. The treaty grants Kefreyt 15% of civilian and 30% of military factories, a 35% share of recruits in colonial templates and preferential access to raw materials. The administration retains its own army."
 VAL_northern_administration_ready_tt: "All eight northern states are owned and controlled by Kefreyt or its subjects; Kefreyt and the tribal states are at peace. The administration either does not yet exist or remains our peaceful puppet and owns part of the resource belt. Creation requires at least one of the five states to be transferred to belong to Kefreyt or a country with more than one state."
 VAL_northern_administration_tt: "Antolla, Fareyn and Himber pass into Kefreyt's direct ownership. Medron, Heland, Milkham, Kilnet and Khebtava form the Northern Contract Administration with special treaty status. Its capital is Kilnet. Possessions outside the eight northern states are not transferred."
 val_contract.346.t: "Northern Contract Administration"
 val_contract.346.d: "The northern agreements have been brought into a unified administrative system. Antolla, Fareyn and Himber remain under Kefreyt's direct rule: their raw material industries form part of the country's own economic base.\n\nThe other five states have been transferred to the Northern Contract Administration, with its capital in Kilnet. It retains local units and personnel records; Kefreyt receives 15% of civilian and 30% of military factories, construction access and preferential trade. The treaty excludes an independent military policy."
 val_contract.346.a: "Approve the unified administration."
 OCA: "Occidian Contract Administration"
 OCA_DEF: "the Occidian Contract Administration"
 OCA_ADJ: "Occidian"
 OCA_Contract_Council: "Interim Administrative Board"
 VAL_Occidian_Registries: "Census of the Occidian Districts"
 VAL_Occidian_Registries_desc: "The interim administration must restore land registers, enterprise records and local civil service. While the districts remain separately governed, its board will prepare them for incorporation into Kefreyt's system."
 VAL_Integrate_Occidia: "Integrating Occidia"
 VAL_Integrate_Occidia_desc: "We will transfer Balchansk, Harbour and the Mining Settlement from transitional administration to Kefreyt's direct rule. If the prewar agreement with Shabrat over Livonin has already been honoured, that district remains with Steland. Reconciling land rights, factory accounts and garrison supplies takes 35 days after the census is complete. Livonin enters the agreement only as a possession of defeated Occidia or Kefreyt; territory belonging to Stelander and other countries remains with its owner."
 VAL_occidian_administration_secured_tt: "The Occidian administration is subordinate to Kefreyt, has not capitulated and is at peace. It owns and fully controls Balchansk, Harbour and the Mining Settlement. If it owns Livonin, it must also fully control it."
 VAL_integrate_occidia_tt: "Balchansk, Harbour, the Mining Settlement and retained Livonin pass into Kefreyt's direct ownership and control. Livonin is not taken from Stelander or another country. If the interim administration has no other possessions, it is dissolved and its troops transfer to Kefreyt. The districts do not automatically become Kefreyt's cores."
 VAL_create_occidian_administration: "Establish Occidia's Interim Administration"
 VAL_create_occidian_administration_desc: "We will establish transitional administration in Balchansk, Harbour and the Mining Settlement. A census and subsequent integration through focuses will incorporate the retained districts into Kefreyt. Livonin enters the agreement only as a possession of defeated Occidia or Kefreyt; territory belonging to Stelander and other countries remains with its owner."
 VAL_occidian_administration_ready_tt: "Balchansk, Harbour and the Mining Settlement are available for transitional administration. Foreign occupation or continuing war delays transfer; a peaceful subject of Kefreyt may cede a district only if it remains on the map afterwards. Integration is not yet complete. At least one district belongs to a country with more than one state, allowing the administration to be established safely. Livonin enters the agreement only as a possession of defeated Occidia or Kefreyt; territory belonging to Stelander and other countries remains with its owner."
 VAL_occidian_administration_tt: "Balchansk, Harbour and the Mining Settlement form the Occidian Contract Administration under Kefreyt. The prewar agreement may separately return Livonin to Shabrat. Direct integration of retained districts becomes available through Census of the Occidian Districts and Integrating Occidia. Livonin enters the agreement only as a possession of defeated Occidia or Kefreyt; territory belonging to Stelander and other countries remains with its owner."
 VAL_contract_industry: "Contract Industry"
 VAL_contract_industry_desc: "Arsenals and civilian contractors work under common production agreements. Investment increases the output of existing enterprises."
 VAL_economic_collapse: "Economic Collapse: Disrupted Supplies"
 VAL_economic_collapse_desc: "Civil war in Vorkerland severed orders, payments and access to metal. Crisis programmes completed: [?VAL_economic_recovery_steps|0]/9. The first six restore production during the crisis; the final three require victory, a new supply base and returning customers. Factory reputation recovers separately."
 VAL_economic_miracle: "Restored Economy"
 VAL_economic_miracle_desc: "Nine programmes have restored production and settlement. Victory opened new trade routes and replaced the former dependence on Vorkerland. Investments in arsenals and civilian enterprises remain in effect."
 VAL_economic_recovery_delta: "Easing the Economic Collapse"
 VAL_arsenal_investment_delta: "Developing Contract Industry"
 VAL_civilian_investment_delta: "Developing Civilian Contractors"
 VAL_economic_miracle_unlock_tt: "The ninth programme replaces §YEconomic Collapse§! with §GRestored Economy§!. Accumulated investments are retained."
 VAL_defeat_Returning_Columns: "The Columns Return"
 VAL_defeat_Returning_Columns_desc: "The operation ended in retreat, not negotiations or a profitable contract. The columns return short of men, equipment and their old confidence that any risk can be covered by another signature. First, Kefreyt must acknowledge the scale of its defeat."
 VAL_defeat_Commanders_Take_The_Ledger: "The Commanders Take the Ledger"
 VAL_defeat_Commanders_Take_The_Ledger_desc: "After Solgalov's cabinet falls, the Commanders' Council takes control of army records, warehouses and state accounts. Its task is simple: not to win the next war, but to prevent the country from falling apart after the one it lost."
 VAL_defeat_Count_The_Remaining_Rifles: "Count the Remaining Rifles"
 VAL_defeat_Count_The_Remaining_Rifles_desc: "After the retreat, paper strength matters less than how many weapons actually remain in storage, how many barrels can be repaired and which companies can still hold formation."
 VAL_defeat_Reopen_The_Depots: "Open the Surviving Depots"
 VAL_defeat_Reopen_The_Depots_desc: "Reserves once saved for the next expedition are now needed by factories, railways and garrisons. Military logistics must serve the state itself again."
 VAL_defeat_Articles_Of_Command: "Articles of Military Administration"
 VAL_defeat_Articles_Of_Command_desc: "The Commanders' Council must not become an assembly of rival staffs. Powers, supply responsibilities and authority over reserves will be recorded as precisely as contracts once were."
 VAL_defeat_No_Second_Expedition: "There Will Be No Second Expedition"
 VAL_defeat_No_Second_Expedition_desc: "Repeating an offensive merely because the army knows how to attack means repeating the defeat. The eastern frontier is closed to new adventures while Kefreyt restores its people, industry and administration."
 VAL_defeat_Field_Hospitals_First: "Field Hospitals First"
 VAL_defeat_Field_Hospitals_First_desc: "Doctors and evacuation teams take priority over new offensive staffs. The country is too small to treat losses as an ordinary line in a contract again."
 VAL_defeat_Bring_The_Captains_Home: "Bring the Captains Home"
 VAL_defeat_Bring_The_Captains_Home_desc: "Experienced commanders are needed in Kefreyt's garrisons, training centres and warehouses, not on foreign passes. The Council gathers scattered personnel back into a common system."
 VAL_defeat_Contracts_Without_Conquest: "Contracts Without Conquest"
 VAL_defeat_Contracts_Without_Conquest_desc: "Kefreyt will remain a state of contracts, but a contract no longer needs to end with a column crossing someone else's border. Exports, production and paid services must once again yield more than occupation."
 VAL_frontier_postwar_ready_tt:0 "Kefreyt is independent, has not capitulated and is not barred from regional confrontation by its defeat settlement. The Stelander civil war does not have to end."
 VAL_command_balance: "The Generals and Solgalov"
 VAL_command_balance_category: "Distribution of Powers"
 VAL_general_staff_side: "The Generals"
 VAL_solgalov_side: "Valera Solgalov"
 VAL_command_compromise: "Coordinated Administration"
 VAL_general_staff_control: "General Staff Autonomy"
 VAL_solgalov_control: "Solgalov's Control"
 VAL_staff_authority: "Expand Staff Authority"
 VAL_solgalov_authority: "Confirm Solgalov's Authority"
 VAL_Andrei_Rudnev: "Andrei Rudnev"
 NOD_VAL_Contract_Council: "Nodrul Contract Commission"
 autonomy_VAL_contract_administration_desc: "Contract Administration\nLocal institutions manage the economy and recruit their own troops. Kefreyt appoints the leadership, receives a contractual share of production and directs foreign policy. Independent wars and alliance creation are unavailable."
 VAL_admin_restore_offices: "Restore the Institutions"
 VAL_admin_restore_offices_desc: "We will open district offices and resume population registration. The new administration's orders must reach the towns without passing through field headquarters."
 VAL_admin_reopen_workshops: "Reopen the Workshops"
 VAL_admin_reopen_workshops_desc: "We will place the first reconstruction order in the capital's industrial hub. A new civilian factory will give the administration repair capacity of its own."
 VAL_admin_local_guard: "Supply the Local Guard"
 VAL_admin_local_guard_desc: "We will receive 5000 rifles for our own forces and organise officer training. New units will not appear automatically: personnel and remaining equipment must come from local reserves."
 VAL_admin_supply_depots: "Restore the Capital's Roads"
 VAL_admin_supply_depots_desc: "We will connect warehouses and urban workshops with serviceable roads. The capital's infrastructure gains one level."
 VAL_admin_professional_service: "Professional Service"
 VAL_admin_professional_service_desc: "We will regularise service in the local forces. Headquarters will gain experience and command power to train its own formations."
 VAL_admin_ratify_charter: "Ratify the Contract Charter"
 VAL_admin_ratify_charter_desc: "We will establish the powers of civilian institutions, army supply procedures and obligations to our protecting power. The charter gives the administration a political foundation for further recovery."
 VAL_receive_stelander_border: "Complete the Transfer of Border Districts"
 VAL_receive_stelander_border_desc: "Complete district transfers delayed by foreign occupation. This decision concerns only land belonging to the subordinate Steland Administration; neutral countries lose no territory."
 VAL_receive_stelander_border_tt: "[46.GetName] and [29.GetName], if owned by the Steland Administration, pass to Kefreyt if controlled by the administration or Kefreyt itself."
 VAL_stelander_victory_tt: "Military victory establishes the Steland Contract Administration under Andrei Rudnev. [46.GetName] and [29.GetName], if owned by the defeated country, pass to Kefreyt; its other lands and army remain with the puppet. Foreign occupation delays a disputed district's transfer. Kefreyt adopts the name Kefreyt Commonwealth and a new flag."
 VAL_nod_victory_tt: "A standalone Kefreyt victory turns Nodrul into the Nodrul Contract Administration. If Shabrat is already fighting Nodrul, Kefreyt instead joins his war: on victory, Nodrul-owned states pass to whichever of the two actually controls them at surrender, while northern settlements already awarded to their claimants are preserved."
 val_contract.347.t: "Steland Contract Administration"
 val_contract.347.d: "Military victory has acquired a civilian successor. Administration of defeated Stelander passes to Andrei Rudnev's contract government. Local institutions and the army remain, but foreign policy and leadership appointments now depend on Kefreyt.\n\nThe treaty provides for direct integration of [46.GetName] and [29.GetName] if they belong to the defeated country. Transfer of land under foreign occupation is delayed until control returns. Its remaining territory stays under the administration; neutral countries' borders are preserved.\n\nA new Steland flag rises over the institutions. Kefreyt announces the formation of the Kefreyt Commonwealth, a union of the metropole and its contract states."
 val_contract.347.a: "Secure the contract administration."
 val_contract.348.t: "Nodrul Contract Administration"
 val_contract.348.d:0 "Nodrul military rule gives way to contract government. Ashiya and Kussington retain the central institutions, while Esnos, Brioland and Treya receive a separate council. Surviving troops remain with local administrations. The royal insignia are replaced by a treaty flag bearing the northern sun and Kefreyt olive branch."
 val_contract.348.a: "The north will join the Commonwealth."
 VAL_commonwealth: "Kefreyt Commonwealth"
 VAL_commonwealth_DEF: "the Kefreyt Commonwealth"
 VAL_commonwealth_ADJ: "Kefreyt"
 VAL_commonwealth_etatism: "Kefreyt Commonwealth"
 VAL_commonwealth_etatism_DEF: "the Kefreyt Commonwealth"
 VAL_commonwealth_etatism_ADJ: "Kefreyt"
 STL_VAL_administration: "Steland Contract Administration"
 STL_VAL_administration_DEF: "the Steland Contract Administration"
 STL_VAL_administration_ADJ: "Stelandian"
 STL_VAL_administration_etatism: "Steland Contract Administration"
 STL_VAL_administration_etatism_DEF: "the Steland Contract Administration"
 STL_VAL_administration_etatism_ADJ: "Stelandian"
 NOD_VAL_administration: "Nodrul Protectorate"
 NOD_VAL_administration_DEF: "the Nodrul Protectorate"
 NOD_VAL_administration_ADJ: "Nodrulian"
 NOD_VAL_administration_etatism: "Nodrul Protectorate"
 NOD_VAL_administration_etatism_DEF: "the Nodrul Protectorate"
 NOD_VAL_administration_etatism_ADJ: "Nodrulian"
 VAL_ratify_postwar_administration: "Ratify the Contract Administration"
 VAL_ratify_postwar_administration_desc: "Establish special contract rule in a country already subordinate to us. Its leadership, flag and reconstruction programme will be brought into line with the postwar charter."
 VAL_Audit_Lost_Contracts: "Review the Failed Contracts"
 VAL_Audit_Lost_Contracts_desc: "Vorkerland's collapse left unpaid invoices and cargo without recipients. We will separate fulfilled obligations from lost orders and publish compensation procedures. Restoring trust begins with acknowledging our own debts."
 VAL_Guarantee_Deliveries: "Guarantee Delivery Dates"
 VAL_Guarantee_Deliveries_desc: "For too long, Kefreyt sold certainty along with weapons and then demanded that buyers believe its explanations for delays. Now every signed order receives metal, components and a place in the production schedule reserved in advance. The dispatch date becomes part of the obligation, and missing it appears in the same books as profit.\n\nThe contract state will restore trust through a habit of delivering promises on the appointed day, not through arsenal advertising."
 VAL_Independent_Trials: "Independent Acceptance Inspections"
 VAL_Independent_Trials_desc: "We will admit customers' representatives to weapon trials. Common quality requirements and open inspection records will restore the factories' credibility, lost with the western market."
 VAL_Returning_Buyers: "Returning Customers"
 VAL_Returning_Buyers_desc: "Proven quality and punctual deliveries bring the first repeat orders. Their advances will restore some working capital. This is a way out of isolation, but our former reputation requires safe trade routes and an end to war."
 VAL_Reopen_Trade_Routes: "Open the Postwar Routes"
 VAL_Reopen_Trade_Routes_desc: "After victory, a military map bears little resemblance to a trade map. A broken bridge is no more useful because our flag flies above it, and an occupied warehouse means nothing without regular caravans. Engineers and contract offices will reconnect northern deposits, Occidian administrations and arsenals in a single transport network.\n\nThe new routes must replace dependence on Vorkerland's brokers with cargo that actually reaches the factories every week, not a slogan about self-reliance.\n\n$VAL_economic_settlement_ready_tt$"
 VAL_Settle_Industrial_Debts: "Settle Industrial Debts"
 VAL_Settle_Industrial_Debts_desc: "During the war, factories lived on advances, requisitions and promises that different departments recorded in different books. Captains regard some expenditure as a military risk. Workshop owners call it state debt. The treasury cannot build a peacetime system while everyone holds their own version of the bill.\n\nA commission will reconcile obligations, write off what was the campaign's cost and establish a permanent payment schedule. Kefreyt knows how to demand that others honour contracts. Now it must apply the same rule to itself.\n\n$VAL_economic_settlement_ready_tt$"
 VAL_Return_To_World_Market: "Known Around the World Again"
 VAL_Return_To_World_Market_desc: "Peace is secured, debts are settled and new routes supply the factories with raw materials. Proven contracts restore the arms factories' international reputation. The final programme completes economic recovery and raises maximum production efficiency.\n\n$VAL_economic_settlement_ready_tt$"
 VAL_Veterans_Of_The_Campaign: "Experience of the Victorious Army"
 VAL_Veterans_Of_The_Campaign_desc: "Victory left Kefreyt more than new roads and casualty lists. For the first time, company commanders conducted a prolonged campaign within a common supply system, unified staff schedules and the oversight of the state register. This experience is too costly to disperse among private companies again.\n\nSergei Volkov will collect operational reviews and turn the victorious units' habits into a training programme. A veteran should return from war with a manual for the next army, not a little army of his own."
 VAL_arsenal_reputation: "Arms Factory Reputation"
 VAL_arsenal_reputation_desc: "Customer confidence: [?VAL_arsenal_reputation_stage|0]/5. Civil war in Vorkerland erases our former reputation. Four programmes rebuild trust; returning to the world market after victory unlocks the final level and raises maximum production efficiency. Compliance with quarterly deliveries is tracked separately."
 VAL_arsenal_reputation_delta: "Restoring Customer Confidence"
 VAL_arsenal_quality_delta: "International Recognition of Quality"
 VAL_quality_trials_bonus: "Independent Weapon Inspections"
 VAL_econ_development_fund: "Industrial Development Fund"
 VAL_econ_development_fund_desc: "We will establish long-term financing for major industrial programmes. State banks and enterprises will coordinate investment and equipment deliveries."
 VAL_econ_precision_industry: "Precision Machine Tools"
 VAL_econ_precision_industry_desc: "Precision tools determine the quality of the entire production chain. We will assemble a common equipment order and prepare enterprises for installation."
 VAL_econ_special_metallurgy: "Specialist Metallurgy Contracts"
 VAL_econ_special_metallurgy_desc: "Rare alloys and electronic components need reliable supplies. Common delivery standards will connect our factories and foreign purchases to industry's actual needs."
 VAL_econ_automation: "Automated Arsenals"
 VAL_econ_automation_desc: "We will authorise an automation programme. The focus only opens the project; automation is installed after the separate paid industrial decision completes its multi-month work and material requirements."
 VAL_econ_logistics: "Industrial Transport Network"
 VAL_econ_logistics_desc: "Production needs secure transport. This focus authorises paid orders for freight vehicles and armoured trains using models already mastered by industry; equipment is delivered only after the industrial contract completes."
 VAL_econ_computing: "Kefreyt Computing Network"
 VAL_econ_computing_desc: "We will authorise a national computing complex. The focus opens the programme; the permanent benefit is installed only after the separately funded project completes."
 VAL_econ_defense_orders: "High-Technology Military Orders"
 VAL_econ_defense_orders_desc: "We will coordinate production runs of reconnaissance vehicles and combat platforms with industry. Military specialists will prepare common requirements for the new equipment."
 VAL_econ_export_finance: "Industrial Export Finance"
 VAL_econ_export_finance_desc: "Moving from one-off deals to export finance will give enterprises predictable settlement. Foreign trade revenue should support the next wave of investment."
 VAL_econ_integrated_economy: "Full-Cycle Contract Economy"
 VAL_econ_integrated_economy_desc: "We will unite precision manufacturing, transport and computing capacity in a common system. Enterprises will coordinate supplies and development across the production chain."
 VAL_Bezhaysk_Operation: "Operation Against Bezhaysk"
 VAL_Bezhaysk_Operation_desc: "Defeating Stelander opens the road to Bezhaysk. After completing state reforms, we will prepare a separate operation against the capital territory and order the offensive."
 VAL_bezhaysk_operation_war_tt:0 "§RDeclares war on Bezhaysk.§! Victory triggers Kefreyt's separate settlement."
 VAL_bezhaysk_operation_available_tt: "Stelander is defeated and its lands are secured by Kefreyt or its administrations. Kefreyt is independent and at peace; Bezhaysk exists, is independent, has not capitulated and is not in our alliance."
 VAL_Resource_War_Contracts: "Resource War Contracts"
 VAL_Resource_War_Contracts_desc:0 "Choose a side and negotiate postwar extraction rights in exchange for actual military aid. The recipient must accept the agreement."
 VAL_resource_war_arms:0 "Send arms to [FROM.GetName]"
 VAL_resource_war_arms_desc:0 "Deliver 25000 rifles from our stockpile. Two shipments fulfil the arms obligation. The recipient pays no treasury; the reward is the postwar concession."
 VAL_resource_war_personnel:0 "Send mercenaries to [FROM.GetName]"
 VAL_resource_war_personnel_desc:0 "Transfer 2000 manpower and grant advisors for 70 days at a cost of 2000 manpower and 25 command power. This fulfils the personnel obligation. No divisions are created automatically."
 VAL_resource_war_arms_offer_tt: "Offer valid for 14 days: 25000 rifles for 100 treasury funds. Transfer and payment occur only after buyer acceptance; Kefreyt receives arms contract income for 70 days."
 VAL_resource_war_personnel_offer_tt: "Offer valid for 14 days: 2000 servicemen for the manpower pool and military advisers for 70 days, for 100 treasury funds. Upon acceptance, Kefreyt spends 2000 manpower and 25 command power."
 val_contract.341.personnel: "Kefreyt offers 2000 servicemen to replenish our manpower pool and staff instructors for 70 days. The price is 100 treasury funds. The instructors increase planning speed by 10%, organisation recovery by 5% and army experience gain by 5%.\n\nThe offer is valid for 14 days. Personnel transfer and payment occur together upon acceptance."
 VAL_resource_war_personnel_accepted_tt: "For 100 treasury funds, we receive 2000 manpower and Kefreyt military advisers for 70 days. Kefreyt spends 2000 manpower and 25 command power, receiving +10 weekly income for 70 days."
 VAL_negotiate_nam_metals: "Discuss an Island Concession with the Viceroy"
 VAL_negotiate_nam_metals_desc:0 "Offer aid in exchange for Western Island extraction rights following the governor's victory. The agreement locks our side. Preparing the offer costs 50 political power, not refunded on refusal."
 VAL_nam_concession_negotiable_tt:0 "The resource war is active; no side is selected. The governor is independent and holds the Western Island district. No rival offer or recent Eflorian contract is active."
 VAL_nam_concession_terms_tt:0 "After acceptance: 90 days for 50000 rifles OR 2000 personnel OR two volunteer divisions for 30 consecutive days. Full aid and the governor's victory grant Western Island extraction rights."
 VAL_register_nam_concession: "Register the Island Concession"
 VAL_register_nam_concession_desc: "If victory is already secured but occupation prevented the rights transfer, register extraction once the Viceroy regains control."
 VAL_nam_concession_ready_tt: "The Viceroy accepted the treaty, received the agreed aid and won the resource war. Independent Svetlogorye owns and controls the Western Island District. Kefreyt is independent and not at war with Svetlogorye; the rights have not yet been transferred."
 VAL_nam_concession_reward_tt: "Kefreyt gains resource rights in the Western Island District, with a base supply of 16 steel. The district remains with Svetlogorye."
 val_contract.349.t: "Kefreyt Proposes an Island Treaty"
 val_contract.349.d:0 "Kefreyt offers help in exchange for Western Island extraction rights after our victory. Within 90 days it must deliver 50000 rifles, 2000 personnel, or maintain two volunteer divisions for 30 consecutive days. No concession is owed without full aid. Kefreyt cannot supply the opposing side until the war ends."
 val_contract.349.accept: "Agree on the concession terms"
 val_contract.349.refuse: "Keep the deposits free of a treaty"
 VAL_frontier_nod_forecast_tt: "Nodrul: [VALGetNodFrontierIntervention]"
 VAL_nod_frontier_joined: "§Ralready fighting on the tribes' side§!"
 VAL_nod_frontier_expected: "§YNodrul will issue an ultimatum and give Kefreyt 100 days to finish the tribal campaign.§!"
 VAL_nod_frontier_unavailable: "§Gwill not join at present: participation conditions or alliance compatibility are not met§!"
 VAL_postwar_administration: "Postwar Administration"
 VAL_postwar_administration_desc: "Kefreyt integrates directly held territory as a continuous administrative frontier. Only an owned, controlled non-core state bordering an existing Kefreyt core may be nationalised. One nationalisation programme runs at a time; when it finishes, the new core opens its own neighbouring states for the next step. Autonomous contract administrations remain separate until their land is directly incorporated."
 VAL_nationalise_region: "Nationalise Border State: [FROM.GetName]"
 VAL_nationalise_region_desc: "Extend Kefreyt's citizenship, taxation and military registration across the administrative frontier. The target must be directly owned and controlled, non-core, and border an existing Kefreyt core. After §Y120 days§! it becomes a core and enables nationalisation of its own neighbours. Only one state may be processed at a time. If eligibility is lost, the §Y50§! political-power cost is refunded."
 VAL_proclaim_commonwealth: "Proclaim the Kefreyt Commonwealth"
 VAL_proclaim_commonwealth_desc: "Establish the postwar settlement through a common state treaty. Kefreyt receives a new name and flag; autonomous administrations retain their territories and special status."
 VAL_commonwealth_requirements_tt: "Contracts Outlive Kings is complete; Kefreyt is independent, has not capitulated and is at peace; the northern tribes, Nodrul and Stelander are subordinate according to the campaign goals; the northern resource belt is held; Kefreyt owns and controls §Y[29.GetName]§! and §Y[46.GetName]§!; stability is at least §Y50%§!"
 VAL_commonwealth_proclaimed_tt: "The state adopts the name §YKefreyt Commonwealth§! and a new flag. Puppet status and territories are preserved."
 VAL_staff_influence: "The Generals' Advisory Voice"
 VAL_staff_dominance: "General Staff Dictate"
 VAL_solgalov_influence: "Solgalov's Advantage"
 VAL_solgalov_dominance: "Solgalov's Personal Rule"
 VAL_command_balance_category_desc: "The generals demand autonomy in military affairs; Solgalov demands control over orders and appointments. Moderate influence brings advantages; extreme dominance by either side reduces stability.\n\nLosing an owned core state during war shifts the balance §Y10%§! toward the generals. Retaking such a state restores §Y5%§! of Solgalov's influence. Losing the same state again without first retaking it does not count."
 VAL_staff_authority_desc: "Grant the General Staff additional authority over appointments and planning."
 VAL_solgalov_authority_desc: "Confirm the head of state's right to approve military contracts and personnel decisions."
 VAL_staff_operational_mandate: "Delegate Operational Command to the Staff"
 VAL_staff_operational_mandate_desc: "Delegate operational planning to the generals during war. Requires §Y25§! command power. Authority lasts §Y90 days§! and ends early upon peace."
 VAL_staff_war_mandate: "Staff Operational Autonomy"
 VAL_staff_war_mandate_desc: "Command may coordinate operations without separate authorisation from the chancellery. The temporary mandate ends with the war."
 VAL_contract_audit: "Audit Military Contracts"
 VAL_contract_audit_desc: "During peace, audit staff expenditure and strengthen civilian control over military orders."
 VAL_reconcile_command: "Convene a Conciliation Commission"
 VAL_reconcile_command_desc: "Reconcile the powers of the chancellery and General Staff. The balance shifts §Y20%§! away from the dominant side toward the centre."
 VAL_settle_command_crisis: "Revise the Distribution of Powers"
 VAL_settle_command_crisis_desc: "Extreme concentration of power obstructs government. Revising mandates shifts the balance §Y40%§! away from the dominant side toward the centre."
 VAL_focus_export_market_open_tt:0 "Opens sales of 25000 rifles for 500 treasury and the route to large orders. Northern partners can buy in peacetime."
 VAL_focus_adviser_contracts_ready_tt: "Unlocks paid military-adviser offers. Adviser missions use their own slot: only one Kefreyt adviser contract may be active at a time."
 VAL_focus_paid_program_authorization_tt: "§YAuthorization only:§! the listed industrial programme must still be funded and completed through the §YIndustrial Programmes§! decisions before its material reward is received."
 VAL_occidian_registries_reward_tt: "The §YOccidian Contract Administration§! gains §G+5% Stability§! and §G+50 Political Power§!."
 VAL_frontier_nationalisation_chain_tt: "Unlocks repeatable map nationalisation for directly held §Ystates adjacent to an existing Kefreyt core§!. Each completed core expands the next set of eligible neighbouring states."
 VAL_nationalise_region_complete_tt: "The state becomes a §YKefreyt core§!. Its directly held neighbours may now become eligible for the next nationalisation programme."
 VAL_fund_contract_chancery: "Fund the Contract Chancery"
 VAL_fund_contract_chancery_desc: "Buy administrative capacity instead of waiting for the political apparatus to recover on its own. Spend treasury funds on clerks, provincial offices and contract processing to gain political power. This may be repeated every 90 days."


 # Stelander crisis focus presentation
 VAL_stelander_title_war: "Civil War in Stelander"
 VAL_stelander_title_aftermath: "After the Stelander Split"
 VAL_arms_title_delivered: "Deliveries Fulfilled"
 VAL_arms_title_war: "Supplies for the Resistance"
 VAL_arms_title_aftermath: "Review the Arms Contracts"
 VAL_passes_title_secured: "Secure the Mountain Passes"
 VAL_passes_title_review: "Review the Occidian Campaign"
 VAL_passes_title_war: "Operation in the Passes"
 VAL_passes_title_mobilizing: "Deploy towards the Passes"
 VAL_passes_title_prepare: "Plan the Mountain Operation"
 VAL_reserves_title_war: "Preserve the Reserves"
 VAL_reserves_title_aftermath: "Reserves after the Split"
 VAL_steel_title_trade: "Production Contracts"
 VAL_steel_title_victory: "Arsenals after Victory"
 VAL_steel_title_review: "Revise Our Commitments"
 VAL_stelander_status_defeated: "Kefreyt has been defeated. Its former foreign-policy programme is closed."
 VAL_stelander_status_secured: "The Occidian base is secured. Contract administration and later integration can proceed once their focus conditions are met."
 VAL_stelander_status_repelled: "The Occidian campaign ended in defeat. Selecting military intervention alone does not grant victory rewards."
 VAL_stelander_status_campaign: "War with the Occidian Revival Union is underway. The result is determined by the war, not by completing a focus."
 VAL_stelander_status_mobilizing: "The 21-day mobilisation against Occidia is underway. Supplies to the resistance do not cancel this separate campaign."
 VAL_stelander_status_settled: "The Occidian campaign has been settled. Final rewards depend on fulfilled deliveries and territory actually secured."
 VAL_stelander_status_neutral: "Neutrality has been chosen: weapons and troops stay at home. This choice closes the supply and intervention routes."
 VAL_stelander_status_civil_war: "The resistance is fighting the party government. Deliveries require buyer consent and sufficient resources. Orders for the Occidian campaign cannot be given before day 60 after the split and require a separate mobilisation."
 VAL_stelander_status_aftermath: "The Stelander civil war is no longer active. Civil-war deliveries are closed; a separate Occidian campaign depends on the current conditions."
 VAL_stelander_status_prewar: "The Stelander civil war has not begun. The crisis focus branch opens when hostilities start."
 VAL_arms_desc_delivered: "The deliveries have been paid for and fulfilled. We will consolidate the experience and prepare production contracts. This focus does not deliver the same weapons twice or reopen a completed deal."
 VAL_arms_desc_war: "While the resistance fights the party government, we can offer weapons or contract formations. The buyer must accept the price; existing stocks and prepared units are transferred. These deliveries remain compatible with a separate campaign against Occidia."
 VAL_arms_desc_aftermath: "We will review our chosen trade policy and use its field reports. New deliveries under the civil-war programme are no longer available. Industrial expansion requires a fulfilled contract or a secured Occidian base."
 VAL_passes_desc_secured: "The Occidian base is under our administration. We will consolidate field reports and prepare to formalise the gains. This focus does not start the war again; contract administration and integration are handled separately."
 VAL_passes_desc_review: "The military campaign has ended. We will reconcile its expenses and field reports. Choosing intervention does not itself constitute victory or grant a claim to foreign territory."
 VAL_passes_desc_war: "The Occidian campaign is underway. We will coordinate the staffs and consolidate combat experience. Peace and territorial gains depend on the actual military result."
 VAL_passes_desc_prepare: "Prepare the command for a separate war against the Occidian Revival Union. Orders for a 21-day mobilisation become available 60 days after the Stelander split while the intervention window remains open. Victorious Stelander may begin its own preparations 90 days after the civil war ends, temporarily closing our window. Victory establishes a contract administration over secured districts; the Livonin agreement is settled separately without taking third-party land."
 VAL_stelander_focus_unlocked_tt: "§YThe Stelander crisis focus branch is now visible.§! The opening focus takes §Y14 days§!, followed by supply, mountain-operation or reserve policies taking §Y21 days§! each. Earlier government commitments constrain the choice. Titles and descriptions follow the current situation; the aftermath branch remains visible when the civil war ends.\n\n[ROOT.VALGetStelanderCrisisStatus]"
 VAL_stelander_focus_current_status_tt: "[ROOT.VALGetStelanderCrisisStatus]"
 VAL_nod_ultimatum:0 "Nodrul ultimatum: 100 days"
 VAL_nod_ultimatum_desc:0 "Nodrul demands an end to the northern expedition. Kefreyt has 100 days from receipt to defeat every participating cannibal ally and secure the territorial objective. Defeating one ally is not enough. Success closes the threat. Otherwise Nodrul joins their existing war; a victorious Stelander party allied with Nodrul may follow. Peace, Kefreyt subjugation or removal of the Nodrul threat cancels the mission."
 VAL_nod_ultimatum_success_tt:0 "The northern coalition is defeated. Nodrul intervention is averted and campaign settlement follows."
 VAL_nod_ultimatum_timeout_tt:0 "If the northern coalition remains undefeated, Nodrul joins its war against Kefreyt. The clock begins on delivery, not when this option is selected."
 val_rework.118.t:0 "Nodrul’s Ultimatum"
 val_rework.118.d:0 "Nodrul has demanded an end to Solgalov’s northern expedition. The demand carries a direct threat: if the war drags on, Nodrul will intervene on the cannibals’ side.\n\nHeadquarters has one hundred days from delivery to defeat the entire participating northern alliance. The fall of a single member is insufficient. Nodrul will not enter this war under the ultimatum before the deadline.\n\nThe clock has already started. Delaying this reply will not extend it."
 val_rework.118.a:0 "Inform headquarters."
 val_rework.120.t:0 "Southern Tsaygen Seized"
 val_rework.120.d:0 "The first reliable reports from Southern Tsaygen arrived after sunrise. ERT columns entered the town during the Vorkerland collapse, occupied the station and administrative buildings, and replaced the Kefreyt registry before our border command could react.\n\nNo treaty transferred the district. No contract released it. The map changed because armed men reached it first. Officers in Tsaygen are already asking the same question as the cabinet: when do we go back?\n\nSolgalov's answer is simple. Southern Tsaygen is not a future acquisition. It is unfinished business."
 val_rework.120.a:0 "We will take it back."
 VAL_nod_ultimatum_objective_tt:0 "Every participating northern tribe is defeated and the territorial objective is secured. A liberated ally must be defeated again."
 VAL_nod_ultimatum_cancel_tt:0 "The campaign ends, Kefreyt capitulates or loses independence, or Nodrul can no longer maintain this threat."

 VAL_subcontract_quarterly_norm:0 "Subcontract the quarterly order"

 VAL_subcontract_quarterly_norm_desc:0 "Pay independent workshops 1000 treasury to fulfil the order. Our rifles stay in reserve and reputation is preserved. This option provides neither a reputation increase nor military experience. It closes the other payment option for this quarter."

 VAL_quarterly_delivery_result_tt:0 "At quarter end: §G+1§! reputation tier (up to maximum), §G15§! army experience and §G15§! command power. This quarter cannot be paid twice."

 VAL_quarterly_subcontract_result_tt:0 "Subcontractors fulfil the order: reputation is preserved without military rewards. The current quarterly deadline is unchanged."

 VAL_reclamation_industrial_sites:0 "Industry on recovered land"

 VAL_reclamation_industrial_sites_desc:0 "Reclamation must bring jobs back. Recovered and registered land can receive funded contracts for two civilian factories. Each region receives its own contract, allowing several sites to be developed at once."

 VAL_reclamation_industry:0 "Develop recovered industrial sites"

 VAL_reclamation_industry_desc:0 "After all three reclamation stages, invest 1000 treasury for 60 days: two building slots and two civilian factories. Requires ownership, control and at most 18 civilian factories. Losing eligibility refunds the deposit in full. One industrial contract per region."

 VAL_reclamation_industry_result_tt:0 "The target region gains §G2§! building slots and §G2§! civilian factories. Other regions may develop in parallel."
 VAL_focus_reclamation_roads_preview_tt:0 "§YWhat the decision does:§! starts a §Y90-day§! cleanup in a polluted state for £ADISCORD_economy_treasury_texticon §Y500§!. On completion: §G+1§! infrastructure (or §G+1§! building slot at the cap) and one third of the original pollution penalties are offset."
 VAL_focus_reclamation_water_preview_tt:0 "§YWhat the decision does:§! after road clearance, starts a §Y90-day§! water-and-soil cleanup for £ADISCORD_economy_treasury_texticon §Y500§!. On completion: §G+2§! building slots and pollution-penalty compensation rises to two thirds."
 VAL_focus_reclamation_settlement_preview_tt:0 "§YWhat the decision does:§! after cleanup, starts a §Y90-day§! resettlement stage for £ADISCORD_economy_treasury_texticon §Y500§!. On completion pollution penalties are fully removed, the state gains §G+1§! building slot and §G+1§! civilian factory if it has fewer than 20."
 VAL_focus_reclamation_industry_preview_tt:0 "§YWhat the decision does:§! after full reclamation, invest £ADISCORD_economy_treasury_texticon §Y1000§! for §Y60 days§! to add §G+2§! building slots and §G+2§! civilian factories in the selected state."

 VAL_reclamation_stage_1_tt:0 "At least one owned and controlled region has completed road works."

 VAL_reclamation_stage_2_tt:0 "At least one owned and controlled region has completed water treatment."

 VAL_reclamation_stage_3_tt:0 "At least one owned and controlled region has completed all three reclamation stages."

 VAL_cost_treasury1000:0 "£ADISCORD_economy_treasury_texticon §Y1000§!"

 VAL_cost_treasury1000_blocked:0 "£ADISCORD_economy_treasury_texticon §R1000§!"

 VAL_cost_treasury1000_tooltip:0 "£ADISCORD_economy_treasury_texticon §Y1000§!"

 VAL_reclamation_industry_refund_tt:0 "Industrial development is cancelled: 1000 treasury is refunded to Kefreyt. Reclamation is retained."

 VAL_QUARTERLY_SUBCONTRACTED:0 "§GFulfilled: subcontracted order.§! Reputation will be preserved at quarter end."

 VAL_QUARTERLY_DELIVERED:0 "§GFulfilled: arsenal delivery.§! Military rewards and reputation are granted at quarter end."

 VAL_QUARTERLY_PENDING:0 "§YOrder not yet fulfilled.§!"

VAL_reclamation_industry_available_tt:0 "We own and control the region, all three reclamation stages are complete, and it has at most 18 civilian factories."

 VAL_negotiate_yubora:0 "Negotiate Yubora's future"
 VAL_negotiate_yubora_desc:0 "The Frontier survived the northern war, but Yuboria remains under Nodrul. Propose a joint campaign and a division of postwar authority: two Yuborian administrations under the Frontier and two Nodrul administrations under Kefreyt. The agreement can also be concluded during the war."
 VAL_nod_frontier_offer_possible_tt:0 "The Frontier is independent, at peace with Kefreyt and outside Nodrul's faction; Nodrul won the northern war and holds Yuboria."
 VAL_nod_frontier_no_pending_tt:0 "No pending Frontier negotiations or another operation in preparation."
 VAL_nod_frontier_terms_tt:0 "The Frontier will join Kefreyt in its war against Nodrul. After victory, the two Yuborian contract administrations of Iskhait and Duchebia pass under Frontier protection. The Nodrul Protectorate and Esnos Administration remain under Kefreyt. The transfer requires an independent Frontier at peace with Kefreyt."
 VAL_frontier_refusal_war_tt:0 "The Frontier will declare war on Kefreyt. Kefreyt's contract administrations will join its side."
 val_contract.350.t:0 "Two sides of one treaty"
 val_contract.350.d:0 "Kefreyt is preparing an operation against Nodrul and proposes agreeing on Yubora's future before the fighting begins. Iskhait and Duchebia would enter the Frontier's sphere, while Ashiya, Kussington and Esnos would come under Kefreyt's contract rule.\n\nThis is not a promise of a united Yubora. Two local administrations would share our protection and answer to us in foreign affairs. Refusing preserves our right to demand different terms after the war, with no assurance that Kefreyt will then concede. Acceptance commits the Frontier to join Kefreyt when its operation against Nodrul begins, or immediately if the war is already under way."
 val_contract.350.refuse:0 "We will not endorse this partition in advance."
 val_contract.350.accept:0 "Accept the proposed partition terms."
 val_contract.351.t:0 "The Frontier replies"
 val_contract.351.accepted:0 "The Frontier accepted the agreement and pledged to join Kefreyt in the war against Nodrul. After victory, Iskhait and Duchebia will pass under its protection. The Nodrul Protectorate and Esnos Administration will remain under Kefreyt.\n\nThe Frontier joins immediately if Kefreyt is already at war with Nodrul; otherwise it will enter when the operation begins. No territory changes hands in advance: the agreement determines who will govern it after victory."
 val_contract.351.refused:0 "The Frontier has declined the preliminary agreement. Kefreyt may prepare the operation alone. Victory will not settle the Yuboran question: the Frontier may later demand both Yuboran administrations."
 val_contract.351.a:0 "Account for this in our preparations."
 val_contract.352.t:0 "The Frontier demands Yubora"
 val_contract.352.d:0 "Nodrul has fallen, but the Frontier refuses to recognise Kefreyt as its successor in Yubora. Its envoys argue that the northern war gave Nodrul power over Yubora, not the right to pass it to the next victor.\n\nThe demand covers Iskhait and Duchebia. Their borders and local institutions would remain, under Frontier protection. Kefreyt would retain the Nodrul Protectorate and Esnos Administration.\n\nWe have twenty-one days to answer. Compliance ends the dispute peacefully; refusal means war with the Frontier. Without an answer, Kefreyt's delegation will sign the transfer."
 val_contract.352.accept:0 "Transfer both Yuboran administrations to the Frontier."
 val_contract.352.refuse:0 "We will not yield. Let them try."
 val_contract.352.obsolete:0 "The original terms no longer apply."
 val_contract.348.partition:0 "Four contract administrations replace Nodrul's unified system. Ashiya and Kussington remain in the Nodrul Protectorate; Esnos, Brioland and Treya receive a separate council. Yuboran government is divided between Iskhait and Duchebia.\n\nNodrul's royal insignia give way to the treaty flag with its northern sun and olive branch. Local institutions and surviving troops remain, but foreign affairs pass to the patrons. A signed agreement places both Yuboran administrations under the Frontier; without it, they remain under Kefreyt and their future may still provoke conflict."
 ECA:0 "Esnos Contract Administration"
 ECA_DEF:0 "the Esnos Contract Administration"
 ECA_ADJ:0 "Esnosian"
 DCA:0 "Duchebia Contract Administration"
 DCA_DEF:0 "the Duchebia Contract Administration"
 DCA_ADJ:0 "Duchebian"
 YPR_VAL_administration:0 "Yubora Contract Administration"
 YPR_VAL_administration_DEF:0 "the Yubora Contract Administration"
 YPR_VAL_administration_ADJ:0 "Yuboran"
 ECA_Contract_Council:0 "Esnos Treaty Council"
 DCA_Contract_Council:0 "Duchebia Treaty Council"
 YPR_Contract_Council:0 "Iskhait Treaty Council"

 VAL_Company_Mandates:0 "Company Representation"
 VAL_Company_Mandates_desc:0 "Company commanders sell military service, but their rights cannot be renegotiated with every dispute. Delegates elected by the companies will present their common demands to the government. A standing procedure for negotiation will strengthen the political influence of the contract state."
 VAL_Contract_Arbitration:0 "Contract Arbitration"
 VAL_Contract_Arbitration_desc:0 "Disputes over pay and service must not turn into insubordination. A joint arbitration commission representing the state and the companies will hear claims and issue binding rulings. Acceptance of those rulings will give the government lasting support among the mercenaries."

 VAL_Armored_Design_Bureau:0 "Armored Vehicle Design Bureau"
 VAL_Armored_Design_Bureau_desc:0 "The companies need vehicles built for prolonged service and repairs far from the factories. A dedicated bureau at the arms combine will develop chassis, armor and weapons for a new generation of tanks."
 VAL_Serial_Armor_Production:0 "Serial Tank Production"
 VAL_Serial_Armor_Production_desc:0 "Each company orders its own vehicle and then struggles to find spare parts. Standard components and long-term orders will let our factories build armored vehicles in series at a lower cost."
 VAL_Tank_Crew_School:0 "Tank Crew School"
 VAL_Tank_Crew_School_desc:0 "Driver, gunner and commander must work as one crew. A training company and proving ground will prepare instructors and test new vehicles before they enter service."
 VAL_Armored_Contract_Companies:0 "Armored Vehicle Procurement"
 VAL_Armored_Contract_Companies_desc:0 "Secure long-term tank deliveries for the contract army. Agreed procurement plans will support larger production runs, while maintenance contracts establish common standards for spare parts and acceptance testing. Factories will be able to reduce vehicle costs without sacrificing reliability."
 VAL_armor_serial_production:0 "Serial Armor Production"
 VAL_armor_serial_production_desc:0 "Standard components and steady orders reduce the production cost of reconnaissance, combat and heavy armored platforms."
 VAL_armor_contract_production:0 "Armored Vehicle Contracts"
 VAL_armor_contract_production_desc:0 "Serial orders, standardized spare parts and mandatory acceptance testing reduce the cost of armored platforms and improve their reliability."

 VAL_final_war:0 "Final War: [ROOT.VALGetFinalEnemy]"
 VAL_final_war_desc:0 "[ROOT.VALGetFinalPhase]\nTension: §Y[?VAL_final_escalation|0]/100§!. It rises by §R5§! each peaceful week. At 100 war begins; negotiations reduce tension by 15. Other wars and unfinished northern operations pause its growth.\n\nSupplies: [ROOT.VALGetFinalSupply]\nReconnaissance: [ROOT.VALGetFinalRecon]\nReconnaissance preparation opens at 25 tension and expanded reserve contracts at 50. Prepared bonuses last through the crisis and war. If Nodrul and Stelander are allied, both participants must be defeated.\n\nRefugees can be admitted and trained in the population and grey markets category. Each regional campaign offers up to three waves; volunteer training takes 35 days."
 VAL_FINAL_ENEMY_COALITION:0 "Nodrul and Stelander"
 VAL_FINAL_ENEMY_NOD:0 "Nodrul"
 VAL_FINAL_PHASE_PREPARING:0 "§YPreparing for confrontation.§!"
 VAL_FINAL_PHASE_WAR:0 "§RThe war has begun.§!"
 VAL_FINAL_PHASE_VICTORY:0 "§GThe final campaign ended in victory.§!"
 VAL_FINAL_PHASE_CLOSED:0 "The crisis is over. Temporary military preparations have ended."
 VAL_FINAL_PHASE_WAITING:0 "Preparations will open after northern operations end if Nodrul remains an independent opponent."
 VAL_FINAL_PREPARATION_READY:0 "§Gready§!"
 VAL_FINAL_PREPARATION_MISSING:0 "not prepared"
 VAL_final_reduce_tension:0 "Reopen Negotiations with Nodrul"
 VAL_final_reduce_tension_desc:0 "Limited concessions and paid mediation will buy three weeks. At home, negotiations will be seen as a sign of weakness."
 VAL_final_reduce_tension_tt:0 "Tension falls by §G15§!, buying three additional weeks at its normal rate of growth."
 VAL_final_register_reserves:0 "Register the Reserves"
 VAL_final_register_reserves_desc:0 "Military commissioners will introduce limited conscription over 28 days. A higher existing law will never be downgraded. Political power is refunded on cancellation or if the law has already been raised."
 VAL_final_reserve_registration_tt:0 "After §Y28 days§!, introduce §YLimited Conscription§!. Cancellation or an already raised law refunds §Y150§! political power."
 VAL_final_stockpile_supplies:0 "Prepare Army Depots"
 VAL_final_stockpile_supplies_desc:0 "Purchase and distribute supplies for a sustained campaign. Preparation takes 35 days and continues if war starts earlier. Cancellation before delivery refunds the money."
 VAL_final_supply_preparation_tt:0 "After §Y35 days§!, army supply consumption falls by §G10%§! through the crisis and war. Cancellation refunds §Y500§! coins."
 VAL_final_supply_ready_tt:0 "Army supply consumption: §G-10%§! through the crisis and war."
 VAL_final_reconnaissance:0 "Survey the Offensive Routes"
 VAL_final_reconnaissance_desc:0 "Over 21 days, the staff will combine maps, intelligence reports and reconnaissance. Preparation improves planning and reveals information about Nodrul's army. Cancellation refunds the political power."
 VAL_final_reconnaissance_start_tt:0 "After §Y21 days§!: §G+20§! army intelligence on Nodrul and §G+15%§! planning speed through the crisis and war. Cancellation refunds §Y75§! political power."
 VAL_final_reconnaissance_ready_tt:0 "Planning speed: §G+15%§! through the crisis and war."
 VAL_final_expand_reserve_contracts:0 "Expand Reserve Contracts"
 VAL_final_expand_reserve_contracts_desc:0 "Offer emergency contracts to people outside the existing reserve. After 28 days, the recruitable population share rises by one percentage point. Emergency obligations end with the crisis and war."
 VAL_final_reserve_contracts_start_tt:0 "After §Y28 days§!: §G+1.00 percentage point§! recruitable population through the crisis and war. Cancellation refunds §Y100§! political power."
 VAL_final_reserve_contracts_ready_tt:0 "Recruitable population: §G+1.00 percentage point§! through the crisis and war."
 VAL_final_war_preparation:0 "Final War Preparations"
 VAL_final_war_preparation_desc:0 "Paid supply depots, reconnaissance and reserve contracts prepare Kefreyt for confrontation with Nodrul. Temporary bonuses end with the crisis and war."

 VAL_regional_administration_campaign:0 "Establish civil administration across all regions"
 VAL_regional_administration_campaign_desc:0 "A joint programme for all owned and controlled non-core states with compliance below 60 or resistance at least 20. For 50 political power, each eligible state immediately gains 15 compliance and loses 10 resistance. Available again after 90 days. States with an integration programme already in progress are excluded."

# Campaign briefing
 VAL_startup_country:0 "§YKEFREYT§!\n\nKefreyt lives by contracts, arsenals and the sale of force. Arms factories and mercenary companies give it influence far beyond its borders, but each new commitment needs payment and supply.\n\nBehind industrial power lie a weak social foundation, the consequences of earlier wars and commanders with interests of their own. The state must bind these forces to shared obligations, or yield once more to private arrangements.\n\n§YFirst priorities§!\nStrengthen the contract system, review the budget and check army requirements. In the north, a choice awaits between closer trade and a policy of pressure. Arms production only pays off when routes and customers can be relied upon."
 VAL_startup_guide:0 "§YKefreyt route§!\n\n§Y1. Build the core.§! $VAL_The_Contract_State$ -> $VAL_The_Weaponry_Baron$ -> $VAL_One_Ledger_One_Banner$ open the main system. Then choose your industrial and army specialisation.\n\n§Y2. Choose the northern course.§! $VAL_Trading_Partners$ develops trade; $VAL_October_Of_2160$ increases pressure. These branches are mutually exclusive.\n\n§Y3. Count the price of every deal.§! Before an export, check treasury, rifle stockpiles and a free corridor. Sold equipment cannot reinforce your army, and a used contract slot stays occupied until its operation ends.\n\n§Y4. Survive the Stelander crisis.§! Choose one course: arms for the resistance, a northern campaign or preserving the arsenals. $VAL_The_Steel_Contract$ opens the post-war route.\n\n§Y5. Open the post-war decisions.§! $VAL_Contracts_Outlive_Kings$ -> $VAL_frontier_conference$ -> logistics and one of two administrations -> $VAL_frontier_security_plan$ open the northern ultimatum. After Nodrul's defeat, its separate war with Bezhaysk is closed by the Kefreyt settlement; Bezhaysk's capitulation is needed only for its own post-war outcome. The southern line begins with $VAL_Return_Southern_Tsaygen$, then continues beyond the Perimeter through $VAL_frontier_return_irem$. Later southern and eastern operations require control of the relevant states.\n\n§YIn brief§!: the economy pays for contracts, the army holds their gains, and working corridors decide whether a shipment arrives."
 VAL_startup_path_0_title:0 "Trading Partners"
 VAL_startup_path_1_title:0 "October of 2160"
 VAL_startup_path_0:0 "§YTRADING PARTNERS§!\n\nExpand northern influence through trade relations and contract institutions. This choice strengthens the economic side of cooperation and leads to further engagement with northern neighbours.\n\nThe route favours a gradual expansion of state capacity through trade, production and paid operations. It does not automatically bring peace with every neighbour.\n\nChoosing it closes the alternative northern branch, October of 2160."
 VAL_startup_path_1:0 "§YOCTOBER OF 2160§!\n\nBack contract policy with force and a willingness to exert pressure in the north. This choice strengthens the military side of the course, while troops still need supplies and later operations still require payment.\n\nThe branch does not replace scripted war-entry requirements: concrete actions remain tied to their focuses, decisions and events.\n\nChoosing it closes the alternative northern branch, Trading Partners."
 VAL_startup_path_0_details:0 "§YTRADE: OPENING THE BRANCH§!\n\nAfter Market Roads North, choose Trading Partners. October of 2160 becomes unavailable.\n\nDifferent Views on Freedom sets the terms of future cooperation with the Frontier. Compromise offers both Yuborian administrations; a firm policy offers Iskhait alone and reserves Duchebia for Kefreyt. The Frontier answers independently; preliminary consent eases later military negotiations.\n\nA military treaty is offered separately after Northern Settlement. Participation in the Stelander civil war follows its own story chain."
 VAL_startup_path_1_details:0 "§YPRESSURE: OPENING THE BRANCH§!\n\nAfter Market Roads North, choose October of 2160. It excludes Trading Partners and provides artillery and war support.\n\nDifferent Views on Freedom lets you reserve Duchebia for Kefreyt and offer the Frontier only Iskhait. These terms are harder to negotiate. Compromise, offering both administrations, remains available: the previous branch does not dictate the answer.\n\nThese are preliminary talks. Frontier war entry requires a separate treaty after Northern Settlement. Refusal leaves the risk of postwar demands for both administrations."
 VAL_Balchansk_Charter:0 "Balchansk Charter"
 VAL_Balchansk_Charter_desc:0 "Establish chartered administration in Balchansk instead of directly integrating Occidia. The administration receives its own charter and political resources, while Kefreyt retains transit contracts. This route excludes direct integration."
 VAL_Balchansk_Clearing_House:0 "Balchansk Clearing House"
 VAL_Balchansk_Clearing_House_desc:0 "A joint clearing house connects the Balchansk administration to Kefreyt arsenals and trading offices. The administration gains an economic institution; Kefreyt receives an industrial research bonus and political resources."

 VAL_defer_northern_expansion:0 "Defer Northern Expansion"
 VAL_defer_northern_expansion_desc:0 "Territorial acquisitions must not stop trade and recovery. We will defer the campaign against the northern tribes and proceed through returning buyers and foreign clearing houses. The northern ultimatum remains an option later."
 VAL_defer_northern_expansion_ready_tt:0 "The frontier security plan is complete; Kefreyt is independent, has not capitulated and is at peace. No frontier ultimatum, campaign or mobilisation is active. No northern settlement has been signed."
 VAL_defer_northern_expansion_tt:0 "Bypass $VAL_frontier_treaty_offices$ without receiving its rewards. Economic recovery can continue after $VAL_Returning_Buyers$ and $VAL_Contingency_Ledgers$. Stelander diplomacy remains available, but a separate campaign against Nodrul requires returning to northern expansion and securing a tribal foothold. This route grants no territory, resources, military victory rewards or right to proclaim a new state. Issuing another northern ultimatum cancels this choice."
 VAL_northern_expansion_deferred_tt:0 "Northern expansion was explicitly deferred; the frontier security plan is complete and no war, ultimatum or mobilisation is active."
 VAL_economic_settlement_ready_tt:0 "The actual military campaign objectives are met, or northern expansion was deferred and both $VAL_Returning_Buyers$ and $VAL_Contingency_Ledgers$ are complete while Kefreyt is independent and at peace."

 VAL_defeat_Revise_The_Settlement: "Revise the Peace Settlement"
 VAL_defeat_Revise_The_Settlement_desc: "The Council can accept defeat and renounce another expedition, or declare the settlement temporary. Revenge requires restored depots, re-equipped units and the return of the captains. Another defeat will cost Kefreyt its independence, not merely its government."
 VAL_defeat_Refit_For_Return: "Re-equip the Returning Units"
 VAL_defeat_Refit_For_Return_desc: "Another expedition cannot begin with the same empty depots. Restored arsenals will arm the field units, while commanders revise their training around the lessons of defeat in the mountains."
 VAL_defeat_Return_To_The_Passes: "Return to the Passes"
 VAL_defeat_Return_To_The_Passes_desc: "Preparations are complete. The Council orders a new war against Shabrat’s Stelander. Victory will place Stelander under a contract administration; defeat will let Shabrat annex Kefreyt in full. There will be no second limited peace."
 VAL_council_revanche_available_tt: "The independent Council of Commanders rules Kefreyt after its defeat. Shabrat still leads an independent Stelander; neither country has capitulated and they do not share a faction."
 VAL_council_revanche_launch_available_tt: "The Council and Shabrat’s Stelander remain independent opponents. Kefreyt is at peace; revision of the settlement, refitting, the return of the captains, mountain preparations, frontline arsenals and supplies for the second campaign are complete."
 VAL_council_revanche_stakes_tt: "§YOpens preparations for a war of revenge against Stelander.§!\n§RAnother defeat lets Shabrat annex Kefreyt in full.§! The peaceful No Second Expedition route becomes unavailable."
 VAL_council_revanche_war_tt: "§RKefreyt declares war on Shabrat’s Stelander.§!\n§YKefreyt victory:§! a subordinate contract administration in Stelander.\n§RShabrat victory:§! full annexation of Kefreyt instead of a limited peace."

 VAL_defeat_Rebuild_The_Registry: "Rebuild the Civil Register"
 VAL_defeat_Rebuild_The_Registry_desc: "The council inherited a country, not merely the remnants of an expeditionary army. A restored civil register allows directly held frontier regions to be integrated after the change of government."
 VAL_defeat_Repair_The_Workshops: "Put the Machine Tools Back to Work"
 VAL_defeat_Repair_The_Workshops_desc: "Put repairs and civilian orders ahead of another expedition. Investment in civilian industry survives either subsequent political choice by the council."
 VAL_defeat_Restore_Freight_Routes: "Restore Freight Routes"
 VAL_defeat_Restore_Freight_Routes_desc: "The army and workshops need the same roads. Improve a weak link in the domestic transport network; a fully developed network instead releases resources for administration."
 VAL_defeat_Veterans_Register: "Register Returning Veterans"
 VAL_defeat_Veterans_Register_desc: "Account for scattered formations, restore service records and bring fit veterans back into an organised reserve. Support for their families strengthens confidence in the council."
 VAL_defeat_Staff_College: "The Council Staff College"
 VAL_defeat_Staff_College_desc: "Turn the experience of defeat into a staff-training programme. Its graduates serve either a defensive army or another expedition, independently of Shabrat’s personal fate."
 VAL_defeat_Civilian_Contracts: "Civilian Contracts"
 VAL_defeat_Civilian_Contracts_desc: "Contracts must be paid through delivery rather than occupation. Expand civilian production and direct the proceeds toward domestic recovery."
 VAL_defeat_Technical_Institute: "Institute of Applied Technology"
 VAL_defeat_Technical_Institute_desc: "Direct part of the staff and factory training effort toward civilian research. The institute brings engineers and instructors into a permanent research programme."
 VAL_defeat_Mountain_Exercises: "Study the Mountain Campaign"
 VAL_defeat_Mountain_Exercises_desc: "Replacing lost rifles is not enough. Training must account for mountain passes, separated columns and cooperation with engineers."
 VAL_defeat_Frontline_Arsenals: "Arsenals for the Second Expedition"
 VAL_defeat_Frontline_Arsenals_desc: "Revanche cannot depend on a single issue of rifles. Build a sustainable industrial basis for arming and reinforcing the field formations."
 VAL_defeat_Supply_For_The_Return: "Stockpiles for the Return"
 VAL_defeat_Supply_For_The_Return_desc: "Before issuing the war order, accumulate rifles, artillery and support equipment. The council will not send formations to the passes before its transport and staff programmes are complete."
 VAL_defeat_Recovered_State: "A Stable Administration"
 VAL_defeat_Recovered_State_desc: "Whatever its foreign-policy choice, the council must complete domestic recovery. Once the wars end, transport, civil records and industry will operate under one budget."
 VAL_council_recovery_available_tt: "The Council of Commanders remains in power after the defeat; Kefreyt is independent and has not capitulated."
 VAL_council_recovered_state_available_tt: "The Council of Commanders governs independent Kefreyt; the country has not capitulated and is no longer at war."
 VAL_raise_mountain_contractors_tt: "Deploy §Y2 mountain divisions§! of §Y6300 personnel§! each in an owned and controlled state. Each has §Y6 mountaineer battalions§! and an engineer company at §Y100%§! manpower and equipment. Personnel and equipment are included in the reward and are not deducted from free reserves. The template is fixed and normal recruitment is allowed. This is a one-time grant."
 VAL_raise_reserve_battalions_tt: "Deploy §Y2 reserve infantry divisions§! of §Y6300 personnel§! each in an owned and controlled state. Each has §Y6 infantry battalions§! and an engineer company at §Y100%§! manpower and equipment. Personnel and equipment are included in the reward and are not deducted from free reserves. The template is fixed and normal recruitment is allowed. This is a one-time grant."
 VAL_contract_service: "Contract Service"
 VAL_contract_service_desc: "Kefreyt recruits paid volunteers. Contracts define each soldier's term of service, wages and duties, while permanent cadres accelerate operational planning and the recovery of company cohesion, while service experience reduces non-combat losses. This system supports a professional army but limits the pool of recruits."
 VAL_contract_service_locked_tt: "Contract Service can only be replaced through a focus or event."

 VAL_partner_contract:0 "Special agreement: [FROM.GetName]"
 VAL_partner_contract_desc:0 "Partner-specific military contracts, advisers, aid, resource concessions or transit. Only supported options are shown. Recruitment, trade agreements and weapons deliveries have separate decisions."
 VAL_partner_menu_tt:0 "Open partner-specific military services, aid, resource and transit agreements."
 VAL_partner_trade:0 "Sign annual trade agreement - £pol_power 100"
 VAL_partner_arms:0 "Sell 25000 rifles"
 VAL_partner_hire:0 "Recruit local volunteers"
 VAL_partner_trade_tt:0 "Kefreyt pays £pol_power 100 on acceptance. Term: 365 days. Kefreyt weekly income: [VALMarketQuoteIncome]; partner income: 1. No automatic renewal. War or capitulation ends income early; the fee is not refunded."
 VAL_partner_hire_tt:0 "Kefreyt pays for manpower from the partner stock: CIN and COF £manpower_texticon §Y3000§! for £ADISCORD_economy_treasury_texticon §Y300§!; OSF and TFF §Y4000§! for §Y400§!; APH §Y2000§! for §Y200§!; YPR §Y5000§! for §Y500§!. Recruitment from the same partner is available again after §Y180 days§!."
 VAL_partner_offer_unavailable_tt:0 "Unavailable: check treasury, stocks, export capacity and pending negotiations."
 VAL_partner_trade_accepted_tt:0 "We receive 1 treasury weekly for 365 days. [VALTradeFeeTerms] No automatic renewal."
 VAL_partner_hire_accepted_tt:0 "Transfer 5000 volunteers from our reserves to Kefreyt and receive 500 treasury, provided the deal remains valid."
 VAL_partner_market_income:0 "Trade Agreement Income"
 VAL_partner_market_income_desc:0 "The annual trade agreement with Kefreyt provides 1 treasury per week until expiry or early termination."
 VAL_Bulk_Arms_Contracts:0 "Wholesale Arms Contracts"
 VAL_Bulk_Arms_Contracts_desc:0 "Offer batches of 50000 rifles for 1000 treasury. The shipment requires actual stock and buyer consent."
 VAL_Army_Arsenal_Orders:0 "Army Arsenal Orders"
 VAL_Army_Arsenal_Orders_desc:0 "Offer 100 000 rifles for 2250 treasury. Orders use the existing export slots."
 VAL_Strategic_Arms_Exports:0 "Strategic Arms Exports"
 VAL_Strategic_Arms_Exports_desc:0 "Offer 200 000 rifles for 5000 treasury. Acceptance requires the full payment and stock. Declined proposals leave the weapons in storage."
 val_contract.361.t:0 "Special agreements: [VALMenuPartnerName]"
 val_contract.361.d:0 "The office has prepared three proposals. A trading office costs 200 treasury and provides weekly income. An arms order sells 25000 rifles for 500 treasury. Recruitment transfers real volunteers from the partner reserve to ours.\n\nTerms depend on the country; tooltips list the full prices. Unavailable proposals are hidden. The partner may decline. Refusal or timeout leaves resources with their owners."
 val_contract.362.t:0 "An Offer from Kefreyt"
 val_contract.362.d:0 "Kefreyt offers a 365-day agreement, earning us 1 treasury weekly. War or capitulation ends income early. [VALTradeFeeTerms]\n\nThe offer lasts 35 days. No answer means refusal. No automatic renewal."
 val_contract.364.t:0 "An Offer from Kefreyt"
 val_contract.364.d:0 "Kefreyt offers 500 treasury for 5000 volunteers from our available reserves. Payment and manpower transfer together after consent.\n\nThe offer lasts 35 days. Declined or invalid offers refund the reserved payment to Kefreyt."
 VAL_partner_arms_tt:0 "Offer £infantry_equipment_texticon §Y25000§! rifles for £ADISCORD_economy_treasury_texticon §G500§!. Acceptance pays Kefreyt and dispatches its stock. The order occupies one export slot for §Y14 days§!. Nothing is debited before consent."
 VAL_partner_arms_accepted_tt:0 "We pay Kefreyt £ADISCORD_economy_treasury_texticon §Y500§! and receive £infantry_equipment_texticon §G25000§! rifles from its stock. Later focuses do not alter this quote. Dispatch uses the normal equipment transfer mechanism."
 VAL_export_arms_order:0 "Sell 25000 Rifles: [FROM.GetName]"
 VAL_export_arms_order_desc:0 "$VAL_partner_arms_tt$"
 val_contract.363.t:0 "Kefreyt: 25000 Rifles"
 val_contract.363.d:0 "Kefreyt offers 25000 rifles for 500 treasury from its actual stocks. Acceptance pays for the entire order and dispatches it. Funds and stocks are checked again before settlement.\n\nThe offer lasts 35 days. Refusal or timeout leaves our money and their weapons untouched."
 VAL_partner_bulk_tt:0 "Offer £infantry_equipment_texticon §Y50000§! rifles for £ADISCORD_economy_treasury_texticon §G1000§!. Acceptance pays Kefreyt and dispatches its stock. The order occupies one export slot for §Y14 days§!. Nothing is debited before consent."
 VAL_partner_bulk_accepted_tt:0 "We pay Kefreyt £ADISCORD_economy_treasury_texticon §Y1000§! and receive £infantry_equipment_texticon §G50000§! rifles from its stock. Later focuses do not alter this quote. Dispatch uses the normal equipment transfer mechanism."
 VAL_export_bulk_order:0 "Sell 50000 Rifles: [FROM.GetName]"
 VAL_export_bulk_order_desc:0 "$VAL_partner_bulk_tt$"
 val_contract.365.t:0 "Kefreyt: 50000 Rifles"
 val_contract.365.d:0 "Kefreyt offers 50000 rifles for 1000 treasury from its actual stocks. Acceptance pays for the entire order and dispatches it. Funds and stocks are checked again before settlement.\n\nThe offer lasts 35 days. Refusal or timeout leaves our money and their weapons untouched."
 VAL_partner_arsenal_tt:0 "Offer £infantry_equipment_texticon §Y100000§! rifles for £ADISCORD_economy_treasury_texticon §G2250§!. Acceptance pays Kefreyt and dispatches its stock. The order occupies one export slot for §Y14 days§!. Nothing is debited before consent."
 VAL_partner_arsenal_accepted_tt:0 "We pay Kefreyt £ADISCORD_economy_treasury_texticon §Y2250§! and receive £infantry_equipment_texticon §G100000§! rifles from its stock. Later focuses do not alter this quote. Dispatch uses the normal equipment transfer mechanism."
 VAL_export_arsenal_order:0 "Sell 100000 Rifles: [FROM.GetName]"
 VAL_export_arsenal_order_desc:0 "$VAL_partner_arsenal_tt$"
 val_contract.366.t:0 "Kefreyt: 100000 Rifles"
 val_contract.366.d:0 "Kefreyt offers 100000 rifles for 2250 treasury from its actual stocks. Acceptance pays for the entire order and dispatches it. Funds and stocks are checked again before settlement.\n\nThe offer lasts 35 days. Refusal or timeout leaves our money and their weapons untouched."
 VAL_partner_strategic_tt:0 "Offer £infantry_equipment_texticon §Y200000§! rifles for £ADISCORD_economy_treasury_texticon §G5000§!. Acceptance pays Kefreyt and dispatches its stock. The order occupies one export slot for §Y14 days§!. Nothing is debited before consent."
 VAL_partner_strategic_accepted_tt:0 "We pay Kefreyt £ADISCORD_economy_treasury_texticon §Y5000§! and receive £infantry_equipment_texticon §G200000§! rifles from its stock. Later focuses do not alter this quote. Dispatch uses the normal equipment transfer mechanism."
 VAL_export_strategic_order:0 "Sell 200000 Rifles: [FROM.GetName]"
 VAL_export_strategic_order_desc:0 "$VAL_partner_strategic_tt$"
 val_contract.367.t:0 "Kefreyt: 200000 Rifles"
 val_contract.367.d:0 "Kefreyt offers 200000 rifles for 5000 treasury from its actual stocks. Acceptance pays for the entire order and dispatches it. Funds and stocks are checked again before settlement.\n\nThe offer lasts 35 days. Refusal or timeout leaves our money and their weapons untouched."

 VAL_Wasteland_Charter:0 "Southern administration charter"

 VAL_Wasteland_Charter_desc:0 "Establish a Kefreyt subject administration on the secured bridgehead. Its borders expand only as subsequent military operations succeed."

 VAL_Southern_Expansion:0 "Expand the southern bridgehead"

 VAL_Southern_Expansion_desc:0 "Begin the next war against the eastern remnants. On their capitulation, the administration receives available states 167, 170, 171, 184, 185 and 203. Territory held by unrelated powers is not transferred."
 VAL_southern_expansion_war_tt:0 "§RDeclares war on ERT§! for the southern territories."

 VAL_Eastern_Expansion:0 "Eastern security belt"

 VAL_Eastern_Expansion_desc:0 "From the southern garrisons, begin an operation against IRT. Victory transfers available states 178, 180, 181, 182, 183, 193, 206 and 207 from the operations map to the administration. Remote IRT holdings are excluded."
 VAL_eastern_expansion_war_tt:0 "§RDeclares war on IRT§! for the eastern belt."

 VAL_perimeter_open_tt:0 "The Perimeter has fallen and the southern territories are open"

 VAL_wasteland_charter_tt:0 "State 169 forms the §YSouthern Contract Administration§! under Kefreyt. Irem remains directly governed by VAL."
 VAL_wasteland_charter_available_tt:0 "Kefreyt controls state 169, is not at war with Irem and has not created the Southern Contract Administration."
 VAL_southern_expansion_available_tt:0 "The Southern Contract Administration exists; Irem is ready for war and belongs to no foreign faction."
 VAL_eastern_expansion_available_tt:0 "The southern administration holds states 184 and 185; Irem is ready for war and Kefreyt has no conflicting frontier war."
 VAL_stelander_equal_pact_available_tt:0 "Kefreyt recognised Stelander as an equal partner; a peaceful eligible partner is available."

 WCA:0 "Southern Contract Administration"

 WCA_DEF:0 "the Southern Contract Administration"

 WCA_ADJ:0 "Southern Contract"

 WCA_Contract_Council:0 "Southern Contract Commission"
 VAL_partner_negotiations_ready_tt:0 "Both countries exist, have not capitulated and are at peace with each other. No negotiations are pending; 30 days have passed since the previous offer to this partner."
 VAL_partner_desk_free_tt:0 "Kefreyt has no pending export proposal or unfinished legacy operation."
 VAL_partner_export_slot_tt:0 "An export slot is free. Licences open the first; the second export desk opens another. An accepted order occupies a slot for 70 days."
 VAL_partner_customer_ready_tt:0 "Eligible northern partner or listed wartime customer. No war with Kefreyt, capitulation or conflicting obligation; 30 days since the last offer and 70 since the last purchase. The Stelander Resistance uses its own agreements during the civil war."
 VAL_partner_arms_funds_tt:0 "Buyer treasury: at least £ADISCORD_economy_treasury_texticon §Y500§!."
 VAL_partner_arms_stock_tt:0 "Kefreyt has a full shipment in stock: at least £infantry_equipment_texticon §Y25000§! rifles."
 VAL_partner_bulk_funds_tt:0 "Buyer treasury: at least £ADISCORD_economy_treasury_texticon §Y1000§!."
 VAL_partner_arsenal_funds_tt:0 "Buyer treasury: at least £ADISCORD_economy_treasury_texticon §Y2250§!."
 VAL_partner_strategic_funds_tt:0 "Buyer treasury: at least £ADISCORD_economy_treasury_texticon §Y5000§!."
 VAL_contract_grant_300_tt:0 "Treasury: £ADISCORD_economy_treasury_texticon §G+300§!."

 VAL_resource_war_aid:0 "Resource War"
 VAL_northern_war_aid:0 "Aid to the North"
 VAL_resource_war_aid_desc:0 "Side: [VALGetResourceAidSide]. Obligations: [VALGetResourceAidStatus].\n\nFulfil the contract to receive Western Island extraction rights after your side wins. Sides cannot be changed. Send volunteers through the chosen country's diplomatic window.\n\nRifles delivered: [?VAL_resource_aid_rifles|0]/50000. Personnel: [?VAL_resource_aid_personnel|0]/2000. Two volunteer divisions: [?VAL_resource_aid_volunteer_days|0]/30 consecutive days."
 VAL_northern_war_aid_desc:0 "Recipients: [YPR.GetName], [COF.GetName] and [TFF.GetName]. Obligations: [VALGetNorthernAidStatus].\n\nAid to all three countries counts together. Distribute supplies and volunteers among members still fighting Nodrul. Further deliveries remain available after fulfilling the pledge until the northern campaign ends.\n\nTotal rifles: [?VAL_northern_aid_rifles|0]/50000. Personnel: [?VAL_northern_aid_personnel|0]/2000. At least two volunteer divisions in total: [?VAL_northern_aid_volunteer_days|0]/30 consecutive days."
 VAL_choose_northern_aid:0 "Pledge aid to the northern coalition"
 VAL_choose_northern_aid_desc:0 "Within 90 days deliver 50000 rifles, send 2000 personnel, or maintain at least two volunteer divisions for 30 consecutive days, counted across all three northern recipients. Full aid and coalition victory grant a temporary bonus. Defeat of the northern campaign brings a penalty; inconclusive peace gives no reward."
 VAL_northern_aid_terms_tt:0 "90 days to deliver a combined 50000 rifles OR 2000 personnel OR maintain at least two volunteer divisions for 30 consecutive days across [YPR.GetName], [COF.GetName] and [TFF.GetName]. Full aid and coalition victory: +15% trade income and +10% war support for 180 days. Coalition defeat: -5% to both for 180 days. Inconclusive peace gives no bonus."
 VAL_northern_aid_arms:0 "Send northern aid to [FROM.GetName]"
 VAL_northern_aid_arms_desc:0 "Transfer 25000 rifles to this northern country. Two shipments to any coalition members fulfil the shared arms pledge. Further deliveries remain available until the campaign ends."
 VAL_northern_aid_personnel:0 "Send northern personnel to [FROM.GetName]"
 VAL_northern_aid_personnel_desc:0 "Transfer 2000 manpower to this northern country and provide military advisors for 70 days. Costs 2000 manpower and 25 command power. Counts towards the shared coalition pledge. No divisions are automatically created. Further detachments remain available until the campaign ends."
 VAL_aid_arms_delivery_tt:0 "[FROM.GetName] receives 25000 rifles from our stockpile, credited to this contract."
 VAL_aid_personnel_delivery_tt:0 "[FROM.GetName] receives 2000 manpower and military advisors for 70 days. Costs 2000 manpower and 25 command power; fulfils the obligation."
 VAL_resource_aid_deadline:0 "Fulfil the resource war contract"
 VAL_resource_aid_deadline_desc:0 "Side: [VALGetResourceAidSide]. Complete one option within 90 days.\n\n- Rifles: [?VAL_resource_aid_rifles|0]/50000.\n- Personnel: [?VAL_resource_aid_personnel|0]/2000.\n- Two volunteer divisions: [?VAL_resource_aid_volunteer_days|0]/30 consecutive days.\n\nAn early recall resets volunteer progress. Failure forfeits extraction rights even if your side wins."
 VAL_northern_aid_deadline:0 "Fulfil the northern aid pledge"
 VAL_northern_aid_deadline_desc:0 "Shared pledge to [YPR.GetName], [COF.GetName] and [TFF.GetName]. Complete one form of aid within 90 days, counted across all three recipients.\n\n- Rifles: [?VAL_northern_aid_rifles|0]/50000.\n- Personnel: [?VAL_northern_aid_personnel|0]/2000.\n- At least two volunteer divisions in total: [?VAL_northern_aid_volunteer_days|0]/30 consecutive days.\n\nThe timer resets if fewer than two divisions remain with active recipients. Insufficient aid earns no victory reward. Only defeat of the northern campaign triggers the penalty, not the loss of one recipient."
 VAL_negotiate_efl_metals:0 "Support the Eflor-Azhar coalition"
 VAL_negotiate_efl_metals_desc:0 "Offer aid in exchange for Western Island extraction rights following coalition victory. The agreement locks our side. Preparing the offer costs 50 political power, not refunded on refusal."
 VAL_efl_concession_negotiable_tt:0 "The resource war is active; no side is selected. Eflor is independent. No rival offer or recent contract with the governor is active."
 VAL_efl_concession_terms_tt:0 "After acceptance: 90 days for 50000 rifles OR 2000 personnel OR two volunteer divisions for 30 consecutive days. Full aid and coalition victory grant extraction rights if Eflor owns and controls the Western Island district."
 val_contract.368.t:0 "Kefreyt offers aid to the coalition"
 val_contract.368.d:0 "Kefreyt offers help for Western Island extraction rights after coalition victory, if Eflor gains the district. Within 90 days Kefreyt must deliver 50000 rifles, 2000 personnel, or maintain two volunteer divisions for 30 consecutive days. Insufficient aid earns no concession. Kefreyt cannot supply the governor until the war ends."
 val_contract.371.t:0 "Insufficient aid"
 val_contract.371.d:0 "The promised aid did not arrive in sufficient volume before the deadline or the end of the campaign. Limited shipments and a brief volunteer deployment do not fulfil the contract. No reward can be claimed for this aid."
 val_contract.371.a:0 "The obligations were not met"
 val_contract.372.t:0 "Northern aid succeeds"
 val_contract.372.d:0 "The northern coalition has prevailed and Nodrul has been defeated. Our supplies and personnel proved the reliability of our pledge. Trade income increases by 15% and war support by 10% for 180 days."
 val_contract.372.a:0 "Our contribution mattered"
 val_contract.373.t:0 "Defeat of the northern coalition"
 val_contract.373.d:0 "The northern coalition we pledged to support has lost its campaign against Nodrul. The setback has damaged trade ties and confidence in foreign operations. Trade income and war support decrease by 5% for 180 days."
 val_contract.373.a:0 "Accept the consequences"
 VAL_resource_volunteer_mandate:0 "Resource war volunteers"
 VAL_resource_volunteer_mandate_desc:0 "Allows volunteers to the chosen side until the resource war ends. Select divisions in the recipient's diplomatic window."
 VAL_northern_aid_success:0 "Successful northern aid"
 VAL_northern_aid_success_desc:0 "Fulfilling our pledge to the victorious northern coalition has strengthened trade ties and support for foreign policy."
 VAL_northern_aid_failure:0 "Failed northern aid"
 VAL_northern_aid_failure_desc:0 "Defeat of the northern coalition has temporarily weakened trade ties and support for foreign policy."
