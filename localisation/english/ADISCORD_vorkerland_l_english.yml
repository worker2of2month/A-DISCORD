 ADISCORD_vorkerland_preparation.1.t:0 "Who receives the last order"
 ADISCORD_vorkerland_preparation.1.d:0 "The institutions still share a seal, but answer to different people. Factory councils demand the right to defend their workshops. Vlad's chancery collects commanders' signatures. Dorian Worx offers emergency authority to those who keep communications and production running.\n\nChoose the apparatus that will receive your prepared packages. This opens six sites and two simultaneous preparation channels. Each completed order must withstand a competing institutional claim. You may play any claimant at the split, but agreements and assets keep their recorded recipients."
