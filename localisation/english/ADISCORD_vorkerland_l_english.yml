 TVA_trial_logistics_choice_tt:0 "Opens the focus §Y$TVA_test_adaptive_logistics$§!. After it is completed, a trial takes §Y30§! days and costs $TVA_trial_logistics_cost$. Success accelerates support research and temporarily improves repairs, supply and army speed."
 TVA_assault_programme_unlock_tt:0 "Weapon series strengthen frontline replenishment if a war against a civil-conflict participant continues when the shipment arrives."
