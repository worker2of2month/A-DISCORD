 ADISCORD_vorkerland_preparation.41.t:0 "A District Stops Paying"
 ADISCORD_vorkerland_preparation.41.d:0 "The Eastern District treasury has sent the capital a letter instead of a payment order. The district council is 'temporarily keeping' its tax revenue: its depots are empty, the garrison has gone unpaid for two months, and the council considers it wasteful to pay a centre that cannot even answer a telegram.\n\nThe finance ministry proposes to send collectors with an escort. Worcker's secretariat advises a deferment: the letter is polite, and the next one may arrive without a signature."
 ADISCORD_vorkerland_preparation.41.a:0 "The collectors will travel with an escort."
 ADISCORD_vorkerland_preparation.41.b:0 "Grant the district a deferment."
 ADISCORD_vorkerland_preparation.42.t:0 "The Depot Strike"
 ADISCORD_vorkerland_preparation.42.d:0 "The locomotive depots of the junction have stopped. The drivers demand the wages owed since spring and the removal of the line manager the capital appointed. Without the depots not a single grain train and not a single company will leave.\n\nThe district staff is ready to take the station under guard. The railway council asks for the depots to be placed under its management. Worx's engineers offer a new timetable that will put the trains back on the line if they may reassign the crews."
 ADISCORD_vorkerland_preparation.42.a:0 "The district staff will take the station."
 ADISCORD_vorkerland_preparation.42.b:0 "The depots pass to the railway council."
 ADISCORD_vorkerland_preparation.42.c:0 "Let the engineers draw up a new timetable."
 ADISCORD_vorkerland_preparation.43.t:0 "Kefreyt's Advance"
 ADISCORD_vorkerland_preparation.43.d:0 "Kefreyt's brokers offer an advance on future metal deliveries from the Westerholm mines. The money is needed now: the treasury closes the month in deficit. But the centre would sign while the district mines the ore, and Westerholm already asks why its metal is being sold without it.\n\nThe capital can accept the advance in its own name. Or it can send the brokers to the district administration: the treasury gains nothing, but the district will remember that the centre did not trade away its land."
 ADISCORD_vorkerland_preparation.43.a:0 "Sign in the centre's name."
 ADISCORD_vorkerland_preparation.43.b:0 "Let them deal with the district."
 ADISCORD_vorkerland_preparation.44.t:0 "Incident on the Itoran Line"
 ADISCORD_vorkerland_preparation.44.d:0 "A patrol vanished overnight on the demilitarised line with Itora. In the morning it was found on the Itoran side: whether the soldiers lost their way in the fog or walked over on their own, nobody knows. Itora returns the men and demands an explanation, and the district papers write that the centre cannot hold even its own border.\n\nThe district commissar asks to handle the matter himself and not to turn fog into war. The staff proposes to reinforce the line from the reserves."
 ADISCORD_vorkerland_preparation.44.a:0 "The district commissar will handle it."
 ADISCORD_vorkerland_preparation.44.b:0 "Reinforce the line from the reserves."
 ADISCORD_vorkerland_preparation.45.t:0 "Rumours About the Tower"
 ADISCORD_vorkerland_preparation.45.d:0 "A rumour runs through the capital that the Unity Tower is empty: the ministers have long worked from bunkers outside the city, and only the guards and the portraits remain in the halls. The rumour is absurd, but people repeat it in the queues, and the district delegates refuse to attend sessions until they see the government with their own eyes.\n\nThe committees demand that the Tower be closed to outsiders and the rumour-mongers found. The capital could do the opposite: invite the district delegates to an inspection and show them offices at work."
 ADISCORD_vorkerland_preparation.45.a:0 "Close the Tower and find the gossips."
 ADISCORD_vorkerland_preparation.45.b:0 "Invite the delegates to an inspection."
 ADISCORD_vorkerland_preparation.46.t:0 "The Engineers Leave"
 ADISCORD_vorkerland_preparation.46.d:0 "Forty engineers have left the capital's design bureaus in a month. Some went to the districts, which pay in food; some, rumour says, joined Dorian Worx in Vorkensberg. Those who remain have written a collective letter: they will keep working if the bureaus receive budgets of their own and the right to decide without party commissars.\n\nThe committees propose to forbid specialists from leaving. Worx proposes to accept the letter."
 ADISCORD_vorkerland_preparation.46.a:0 "Forbid specialists to leave."
 ADISCORD_vorkerland_preparation.46.b:0 "Grant the bureaus autonomy."
 ADISCORD_vorkerland_preparation.47.t:0 "The Officers' Understanding"
 ADISCORD_vorkerland_preparation.47.d:0 "Counter-intelligence has intercepted letters between officers of a district staff. There is no plot in them, at least not yet: the officers discuss whom they will obey if contact with the capital breaks, and almost all of them name Vlad Petrichev.\n\nThe committees demand a purge. The staff advises buying loyalty with promotions and decorations. There is a third way: pretend nobody read the letters and let the districts decide for themselves whom their officers serve."
 ADISCORD_vorkerland_preparation.47.a:0 "Carry out a purge."
 ADISCORD_vorkerland_preparation.47.b:0 "Hand out promotions."
 ADISCORD_vorkerland_preparation.47.c:0 "Ignore the letters."
 ADISCORD_vorkerland_preparation.48.t:0 "The Bread Queue"
 ADISCORD_vorkerland_preparation.48.d:0 "The capital's bread queues form before dawn. The districts keep their grain in their own depots and sell it at their own prices. The committees propose to requisition bread by force; the district councils propose to open the capital's markets to their traders.\n\nWorx's engineers have brought a ration ledger: if the depots and rations are counted, there is enough bread, but the census will have to be paid for."
 ADISCORD_vorkerland_preparation.48.a:0 "Requisition the grain."
 ADISCORD_vorkerland_preparation.48.b:0 "Open the markets to district traders."
 ADISCORD_vorkerland_preparation.48.c:0 "Introduce the ration ledger."
 ADISCORD_vorkerland_prep_ready_1:0 "§Gsecured: Worker committee§!"
 ADISCORD_vorkerland_prep_ready_2:0 "§Gsecured: Vlad military staff§!"
 ADISCORD_vorkerland_prep_ready_3:0 "§Gsecured: Dorian directorate§!"
 ADISCORD_vorkerland_continuity_guard:0 "Federal Continuity Guard"
 ADISCORD_vorkerland_prep_federal_summary:0 "Government support: [ROOT.GetVorkerlandPrepPatron]. Active channels: [?ADISCORD_vorkerland_prep_active|0]/2.\nCompleted packages retain their recorded recipient when you change the played side. Each dispute lasts 21 days; silence concedes the package.\nCentral arsenal: [GetVorkerlandPrepArsenal]\nRailway directorate: [GetVorkerlandPrepRail]\nVorkernsberg workshops: [GetVorkerlandPrepIndustry]\nFederal garrison: [GetVorkerlandPrepGarrison]\nConfederation registers: [GetVorkerlandPrepArchives]\nGovernment emergency communications: [GetVorkerlandPrepCommunications]"
 ADISCORD_vorkerland_prep_district_summary:0 "The Confederation has a few months left. Whatever is hidden in a region now will belong to whoever holds it after the partition."
 ADISCORD_vorkerland_prep_treaty_deferred:0 "After independence, our army will support [FROM.GetVorkerlandPrepPatron] and join its coalition and wars."
 ADISCORD_vorkerland_prep_treaty_immediate:0 "Our army immediately joins the coalition of [FROM.GetName] and participates in the same wars."
 ADISCORD_vorkerland_egc_settlement_tt:0 "At reunification, the Zshat Junta, all its territory and its army become part of Vorkerland regardless of the winner or any treaty."
 ADISCORD_vorkerland_district_settlement_tt:0 "After our partner's victory, we retain our country and territory."

 # Worx: postwar research and personal rule.
 WRK_worx_research_category:0 "Dorian Worx's Madness"
 WRK_worx_research_category_desc:0 "The postwar directorate. The political course determines the doctor's powers, madness growth and available programmes. All programmes share one slot."
 WRK_worx_personal_rule:0 "Worx's Personal Interference"
 WRK_worx_personal_rule_desc:0 "Dorian's growing obsession disrupts civil institutions and military production."
 WRK_worx_value:0 "Madness: §Y[?WRK_worx_madness|1] / 100§!"
 WRK_worx_needle:0 "§RI§!"
 WRK_worx_status:0 "[GetWorxMadnessStatus]"
 WRK_worx_growth:0 "[GetWorxMadnessGrowth] | Demands: §Y[?WRK_worx_demand|0] / 4§!"
 WRK_worx_operation_report:0 "[GetWorxResearchOperation]"
 WRK_worx_status_0:0 "Cold confidence"
 WRK_worx_status_1:0 "§YObsessive demands§!"
 WRK_worx_status_2:0 "§OSuspected sabotage§!"
 WRK_worx_status_3:0 "§RCompulsory correction§!"
 WRK_worx_status_supervised:0 "§GAuthority limited by the directorate§!"
 WRK_worx_status_suspended:0 "Directorate operations suspended"
 WRK_worx_growth_active:0 "Growth: §R+[?WRK_worx_growth_total|2]§! per day"
 WRK_worx_growth_stopped:0 "Growth stopped"
 WRK_worx_operation_basic:0 "§Y1 / 1§!: load trials. See the decision timer below."
 WRK_worx_operation_expanded:0 "§Y1 / 1§!: expanded programme. See the timer below."
 WRK_worx_operation_oversight:0 "§Y1 / 1§!: transfer of powers. See the timer below."
 WRK_worx_operation_none:0 "§G0 / 1§!: research slot available"
 WRK_worx_rules_tt:0 "Madness starts at 20 and grows daily, including during programmes. Current growth: §Y[?WRK_worx_growth_total|2]§!. Thresholds 25, 50 and 75 each add §R-3%§! stability and §R-2%§! military output.\n\nAt 100 a crisis settles immediately: §R-10%§! stability, §R100§! £political_power_texticon, madness falls to 70. A Dissenting Opinion reduces the losses to §R-5%§!, §R50§! £political_power_texticon and 60 madness. Demands rise one tier.\n\nBasic trials remove §G[?WRK_worx_basic_relief|0]§! madness; expanded trials remove §G[?WRK_worx_expanded_relief|0]§!. Results towards the next demand tier: [?WRK_worx_results|0] / [?WRK_worx_result_threshold|0]. Maximum tier IV; basic prices 75/100/125/150 and expanded prices 150/200/250/300 £political_power_texticon. Reviews and civil science do not raise demands.\n\nDoctor, Your Time Is Up opens the transfer of powers. Only its completion stops madness growth and closes compulsory programmes. Subjugation, capitulation or a change of leader cancels paid work and refunds the actual payment. Accumulated values are retained.\n\nI Foresaw Everything opens a 35-day struggle for the institutes. Restore Obedience takes 14 days and costs 200 £political_power_texticon. Failure ends personal administration: stability -15%, military output -15%, political power gain -0.5. An open event does not stop the clock; subjugation and capitulation pause it."
 WRK_worx_slot_free_tt:0 "The shared research slot is free"
 WRK_worx_operational_tt:0 "An independent Technical Directorate is operating under Worx"
 WRK_worx_basic:0 "Human Endurance Trials"
 WRK_worx_basic_desc:0 "Worx demands a study of human endurance. The military will assign participants without obtaining their consent. The report informs army standards; public knowledge of the coercion causes unrest.\n\nDuration: 14 days. Paid at the start, results on completion. Loss of independence, capitulation or a change of leadership cancels the project with a full refund and releases the slot."
 WRK_worx_expanded:0 "Expanded Research Programme"
 WRK_worx_expanded_desc:0 "The directorate extends compulsory research to industrial workforces. Experimental working conditions provide data for new production processes. Wider coercion provokes greater public opposition.\n\nDuration: 28 days. Paid at the start, results on completion. Cancellation returns the entire payment."
 WRK_worx_oversight:0 "Limit Worx's Authority"
 WRK_worx_oversight_desc:0 "The board has advanced from the right to dissent to control over appointments. It will now take over the institutes, release compulsory participants and end Worx's unilateral research orders. The doctor retains his formal office.\n\nDuration: 35 days. Madness keeps rising and the shared slot remains occupied. Cancellation refunds payment in full."
 WRK_worx_basic_result_tt:0 "After §Y14 days§!: madness §G-[?WRK_worx_basic_relief|0]§!, §G5§! £army_experience, stability §R-1%§!. One result towards rising demands."
 WRK_worx_expanded_result_tt:0 "After §Y28 days§!: madness §G-[?WRK_worx_expanded_relief|0]§!, one §G25%§! industry bonus, stability §R-2.5%§!. One result towards rising demands."
 WRK_worx_oversight_result_tt:0 "After §Y35 days§!: madness is cleared, growth and penalties end, compulsory research closes. §G+5%§! stability."
 WRK_worx_cancel_tt:0 "The entire payment is returned. No result or demand increase; the shared slot is released."
 WRK_worx_expanded_bonus:0 "Expanded programme findings"
 ADISCORD_vorkerland_postwar.20.t:0 "After the Last Report"
 ADISCORD_vorkerland_postwar.20.d:0 "The first postwar meeting concerned restored substations, budgets and workers returning home. Dorian Worx turned a page and asked why the institutes were reducing their observation programmes. The end of military necessity did not satisfy him.\n\nThe civil war, he explained, had left the central question unanswered: why do people destroy the systems on which their lives depend? Victory supplied the means to investigate. He demanded the continuation of emergency recruitment into the studies. Participants' consent was absent from the required paperwork.\n\nThe directorate must choose between further experiments and institutions strong enough to limit its leader's personal demands."
 ADISCORD_vorkerland_postwar.20.a:0 "Open the postwar register."
 ADISCORD_vorkerland_postwar.21.t:0 "The Council Held the Institutes"
 ADISCORD_vorkerland_postwar.21.d:0 "During the night Worx ordered several institute directors replaced and their records transferred to a special commission. Municipal offices refused to comply without council signatures. The directorate had its own registers, staff and communications.\n\nSome work still stopped. Reconciling contradictory orders consumed resources and public trust. The council preserved its institutions, but Worx withdrew only after an increase in future research demands.\n\nAlready applied: -5% stability, -50 £political_power_texticon; madness reduced to 60 and demands raised one tier, up to IV."
 ADISCORD_vorkerland_postwar.21.a:0 "The council now has grounds to act."
 ADISCORD_vorkerland_postwar.22.t:0 "Compulsory Correction"
 ADISCORD_vorkerland_postwar.22.d:0 "Worx declared discrepancies in the reports evidence of sabotage. Directors were ordered to stop work, surrender their archives and present themselves for inspection. Other departments simultaneously demanded production continue on schedule.\n\nFor days the institutions struggled to determine which signatures remained valid. Factories lost shifts and families crowded reception halls while a new commission demanded expanded research. When Worx resumed ordinary meetings, nobody discussed revising its objectives.\n\nAlready applied: -10% stability, -100 £political_power_texticon; madness reduced to 70 and demands raised one tier, up to IV."
 ADISCORD_vorkerland_postwar.22.a:0 "Get the institutions working again."
 ADISCORD_vorkerland_postwar.23.t:0 "The Second Signature"
 ADISCORD_vorkerland_postwar.23.d:0 "The new institute charter occupied only a few pages. Orders from the head of the directorate now required a second signature, a council decision and participants' consent. Review commissions could stop existing programmes.\n\nWorx studied the document, then asked who would answer for the time lost to discussion. The council chairman replied that responsibility would now be shared alongside the right to decide.\n\nDorian retained his office. The institutes gained the power to refuse him. Compulsory programmes are closed; personal interference no longer governs the state."
 ADISCORD_vorkerland_postwar.23.a:0 "Circulate the charter to every institute."
