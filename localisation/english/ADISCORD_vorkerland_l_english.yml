 VAD_crown_government_tt:0 "Petrichev's independent imperial government is active."
 VAD_crown_industrial_district_tt:0 "We own and control a district with a crown charter and at least one civilian or military factory."
 VAD_crown_policy_available_tt:0 "Petrichev's imperial government is active. We own and control the district, which retains its crown charter and at least one civilian or military factory. It has no active district privileges, collateral pledge or unfinished chancery project."
 VAD_crown_policy_cancellation_tt:0 "If the district loses its charter, industry or our control, or the imperial government ceases to operate, the full payment is returned. On reunification or annexation, the successor receives any unsettled payment. Completed investment is not refunded; loss of the district or charter removes its local result."
