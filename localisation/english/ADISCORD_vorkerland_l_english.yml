 RUS_bunker_workshop_delta:0 "Underground Arsenal"
 RUS_bunker_workshop:0 "Level 3: Underground Arsenal"
 RUS_bunker_workshop_desc:0 "Machine tools are lowered one by one, dismantled down to the last casing. Here, an air raid warning will not halt a shift, but every motor will demand its share of power.\n\nDuration: 21 days. Required spare power capacity: 3. Once completed, this level uses 3 power and grants the permanent effects shown below. Only one room can be chosen on this level.\n$RUS_bunker_contract_tt$\n\nAn operational workshop opens engineering orders and workshop training: orders deliver §G150§! £support_equipment_texticon instead of 100, and training grants §G40§! economic development progress instead of 25. Equipment and knowledge belong to the country.\n\nSerial Ordnance Orders adds 3% military factory output. Aircraft Workshops adds 3% production efficiency growth."
 RUS_bunker_workshop_cost_pp_ok:0 "§Y25§! £political_power_texticon"
 RUS_bunker_workshop_cost_pp_low:0 "§R25§! £political_power_texticon"
