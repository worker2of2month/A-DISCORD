 VAD_crown_privileges_unlock_tt:0 "Equipping chartered districts temporarily improves their economy and supplies, strengthening confidence in the restoration."
 VAD_crown_collateral_unlock_tt:0 "Pledging a district's economy secures arms now, but temporarily reduces available local factories and weakens confidence in the restoration."
 VAD_crown_district_privileges:0 "Supported District Privileges"
 VAD_crown_district_privileges_desc:0 "The chancery supports the district economy and confirms the administration's authority over local stores."
 VAD_crown_district_collateral:0 "Economy under Crown Collateral"
 VAD_crown_district_collateral_desc:0 "Part of the district economy is servicing obligations to arms suppliers."
