 VAD_crown_privileges_programme_desc:0 "The district administration has submitted a list of projects previously denied assistance. Its workshops will receive equipment, and local services will recover control over stores requisitioned by passing troops. The charter now binds the capital's chancery as well."
 VAD_crown_collateral_programme:0 "Obtain Arms against District Collateral"
 VAD_crown_collateral_programme_desc:0 "The suppliers agree to release arms from their warehouses against district enterprises. The chancery will arrange inventories and transport; the local administration will service the obligation after the inspectors depart. The charter ledger gains a new page bearing the creditors' seals."
