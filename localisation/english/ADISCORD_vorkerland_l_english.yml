 WRK_worx_directorate_desc:0 "The powers of research institutes under the directorate's chosen course."
 WRK_worx_title_ordinary:0 "Scientific Directorate"
 WRK_worx_title_personal:0 "Humanity Must Be Corrected"
 WRK_worx_title_council:0 "Even Genius Answers to Protocol"
 WRK_worx_title_emergency:0 "Emergency Directorate"
 WRK_worx_title_failure:0 "Collapse of Personal Administration"
 WRK_worx_emergency_status:0 "§RStruggle for the institutes: [?WRK_worx_emergency_days|0] days§!"
