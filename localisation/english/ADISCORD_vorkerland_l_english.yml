 RUS_bunker_generator:0 "Expand the Generator Hall"
 RUS_bunker_generator_desc:0 "Backup generators will be connected through independent switchboards. Power is needed by working pumps, machine tools and lamps, not rooms drawn on a plan.\n\nDuration: 21 days. Adds 4 power capacity. Two expansions are available: base capacity 4 → 8 → 12. The turbine reserve focus adds another 2 power capacity.\n$RUS_bunker_contract_tt$"
