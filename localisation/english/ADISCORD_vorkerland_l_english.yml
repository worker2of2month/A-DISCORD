 ADISCORD_ivanland_proclaim_norvane: "Proclaim Norvein"
 ADISCORD_ivanland_proclaim_norvane_desc: "Transfer states [90.GetName] and [91.GetName] to Matvey Mateusk's civilian administration. The Krait Directorate will retain a separate dependent status and receive states [93.GetName] and [94.GetName]."
 ADISCORD_ivanland_form_norvane_alliance: "Conclude the Norvein Alliance"
 ADISCORD_ivanland_form_norvane_alliance_desc: "Secure the outcome of the intervention through a treaty with Mateusk's administration and create a common defensive alliance."
 ADISCORD_ivanland_invite_wit: "Invite Rimat"
 ADISCORD_ivanland_invite_wit_desc: "Invite Rimat to join the Itora-Norvein Alliance."
 faction_ivanland_norvane_alliance: "Itora-Norvein Alliance"
 ADISCORD_vorkerland_tgd_grid_collapse: "Urban Grid Collapse"
 ADISCORD_vorkerland_tgd_grid_collapse_desc: "Emergency outages have paralysed industry, repairs and supply in Firnov and Techlar. All available inhabitants are assigned to urban maintenance, leaving the army only its pre-allocated technical reserve. Once the two neighbouring threats have been eliminated, the grid can be rebuilt in 120 days.\n\n\n\n\n\n £GFX_ADISCORD_urban_decay_banner \n\n\n"
 ADISCORD_vorkerland_tgd_living_grid: "Firnov and Techlar's Urban Grid"
 ADISCORD_vorkerland_tgd_living_grid_desc: "The Firnov-Techlar metropolitan area is a single organism of power stations, underground railways, factories and distribution centres. The city's engineers repair it under fire and supply the defence efficiently, but all available inhabitants remain assigned to maintaining the grid."
 ADISCORD_vorkerland_tgd_rebuild_grid: "Restart the Urban Grid"
 ADISCORD_vorkerland_tgd_rebuild_grid_desc: "Begin a 120-day restoration of the power system after eliminating Volnograd and Ebern."
