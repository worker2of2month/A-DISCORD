 ADISCORD_vorkerland_empire_army:0 "Army of the World Empire"
 ADISCORD_vorkerland_empire_army_desc:0 "A unified staff, a mass reserve and centralized supply. The army grows stronger as imperial programs are completed."
 ADISCORD_vorkerland_empire_industry:0 "State War Production Plan"
 ADISCORD_vorkerland_empire_industry_desc:0 "Military enterprises work to a unified state order. Completed programs progressively increase output.\n\n\n\n\n\n £GFX_ADISCORD_industry_banner \n\n\n"
 WRK_empire_arsenal_site_tt:0 "An owned and controlled core state has room for 4 military factories."
 WRK_empire_civil_site_tt:0 "An owned and controlled core state has room for 3 civilian factories."
 WRK_empire_war_tt:0 "The western war against Itora will begin. Allies enter through existing agreements and side choices; the outcome determines the military subjugation of the enemy."
 ADISCORD_vorkerland_postwar.4.t:0 "After the Common Victory"
 ADISCORD_vorkerland_postwar.4.d:0 "The common enemy has fallen, but two centres of authority still occupy the capital. District commanders await Petrichev's orders; worker delegations turn to Worcker. During the war, disagreements could be postponed until victory. There is nowhere left to postpone them.\n\nAdvocates of personal rule urge Worcker to dissolve the emergency council. They promise to end every dispute with a single order, and already describe Petrichev as an obstacle to the new state. Others demand a renewed common mandate and joint institutions to govern the peace. Victory has given the allies a choice they never had beneath the ruins of the Tower."
 ADISCORD_vorkerland_postwar.4.council:0 "Confirm the common mandate"
 ADISCORD_vorkerland_postwar.4.close:0 "This council can no longer decide."
 ADISCORD_vorkerland_postwar.4.empire:0 "Support Worcker's personal rule"
 WRK_joint_preserve_council_tt:0 "The joint government remains in office. Its postwar tree of reconstruction, military reform and district agreements stays available; Worcker's coup will no longer take place."
 WRK_joint_world_empire_choice_tt:0 "The joint council will be dissolved and Vlad Petrichev executed. Nikita Worcker will lead the etatist World Empire and receive its separate focus tree. Completed programmes and their decision unlocks are retained."
 ADISCORD_vorkerland_postwar.5.t:0 "[WRK.GetVorkerlandEmpireProclamationTitle]"
 ADISCORD_vorkerland_postwar.5.d:0 "[WRK.GetVorkerlandEmpireProclamationDesc]"
 ADISCORD_vorkerland_postwar.5.a:0 "[WRK.GetVorkerlandEmpireProclamationResponse]"
 WRK_empire_itora_operational_plan:0 "The Itoran Operational Plan"
 WRK_empire_itora_operational_plan_desc:0 "The staff compares supply routes, axes of advance and enemy reserves. The campaign must have attainable operational objectives as well as imperial slogans."
 WRK_empire_itora_must_fall:0 "Itora Must Fall"
 WRK_empire_itora_must_fall_desc:0 "Preparations are complete. The empire begins the western war and calls its allies to its side. Victory must place Itora under Vorkerland's rule."
 WRK_empire_building_offices_tt:0 "§Y2§! more §YDistrict Reconstruction§! programmes may run at the same time."
 WRK_empire_military_conventions:0 "Military Conventions of the West"
 WRK_empire_military_conventions_desc:0 "The empire offers its neighbours protection, not equality. The military conventions promise garrisons, weapons and a place in the coming order to those who choose a side before the march begins."
 WRK_empire_district_guarantees:0 "Imperial Guarantees to the Districts"
 WRK_empire_district_guarantees_desc:0 "The former administrative districts remember the civil war and still fight one another. The empire promises them amnesty, local garrisons and protection from their neighbours if they stand with it against Itora."
 WRK_empire_district_guarantees_tt:0 "The lean of [PWR.GetName], [PSD.GetName] and [ZAO.GetName] shifts toward Vorkerland by §Y20§!. Our influence in the West grows by §Y5§!."
 WRK_empire_garrison_compact:0 "The Garrison Compact"
 WRK_empire_garrison_compact_desc:0 "Signatories of the conventions receive rifles and equipment from imperial depots. Their garrisons will be the first line of the march on Itora."
 WRK_veyran_empire_etatism:0 "Veyran Empire"
