 ADISCORD_vorkerland_prep_offer_egc:0 "Zshat: recognise district command"
 ADISCORD_vorkerland_prep_offer_egc_desc:0 "District officers retain command of their army during the civil war. The alliance supplies 100 £support_equipment_texticon. At reunification, the Zshat Junta, all its territory and its army become part of restored Vorkerland regardless of which claimant wins.\n\nPayment is taken only after the other country accepts and both parties are rechecked. Refusal is free. Before the split, this binds the district to [ROOT.GetVorkerlandPrepPatron] after independence. Later agreements take effect immediately. Joining another faction or fighting the promised staff prevents entry. The treaty does not grant postwar independence."
 ADISCORD_vorkerland_prep_offer_egc_tt:0 "The junta retains its command during the war and receives 100 £support_equipment_texticon. At reunification, its territory and army pass to Vorkerland even under an active treaty. The government must first consent."
 ADISCORD_vorkerland_preparation.20.egc.d:0 "[FROM.GetName] offers an alliance on these terms. District officers retain command of their army during the civil war. The alliance supplies 100 £support_equipment_texticon. At reunification, our country, all its territory and its army become part of restored Vorkerland regardless of which claimant wins.\n\n[GetVorkerlandTreatyTiming] Joining another faction or fighting the promised partner invalidates the treaty. The treaty does not guarantee postwar independence. Payment and delivery occur together on acceptance; if circumstances have changed, the offer can only be closed."
