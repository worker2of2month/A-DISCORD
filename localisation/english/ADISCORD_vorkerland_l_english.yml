 # Directorate story scenes
 ADISCORD_vorkerland_postwar.31.t:0 "A Space for a Name"
 ADISCORD_vorkerland_postwar.31.d:0 "Two columns failed to agree in the first postwar return. Forty people had been dispatched; the laboratory register listed thirty-nine. The secretary brought the sheet to Worx, expecting an order to search. The doctor asked him to check the addition.\n\nA letter was attached to the back. A woman wanted to send winter clothes to her husband, who had left under a departmental order before the war ended. Worx read the first line and turned the page over. He wanted to know why the missing man was still receiving rations.\n\nThe secretary supplied a name. The doctor looked up. 'I remembered it. What is the question?' The secretary could find no question suitable for this form. Between the dispatch number and the expenditure column, there was room to write the name."
 ADISCORD_vorkerland_postwar.31.a:0 "Leave the letter beside the return."
 ADISCORD_vorkerland_postwar.31.b:0 "Enter the name and forward the letter."
 WRK_worx_story_madness_plus_5_tt:0 "Worx's madness: §R+5§!."
 ADISCORD_vorkerland_postwar.31.c:0 "Keep only the registration number."
 WRK_worx_story_madness_minus_5_tt:0 "Worx's madness: §G-5§!."
 ADISCORD_vorkerland_postwar.32.t:0 "The Lamp in the Last Window"
 ADISCORD_vorkerland_postwar.32.d:0 "The directorate changed its night watch, but the lamp in the last window on the third floor remained lit. Worx sat before three identical reports. On each, the word 'suspended' was circled in red.\n\nHe answered the question about sleep calmly. During the war, people had promised to resume work after victory. Victory had come; inexplicably, they did not intend to resume. Every pause meant convincing them of the obvious again tomorrow. Tomorrow could not be lost.\n\nThe secretary offered to remove two copies. The doctor pinned them beneath his palm. He knew they were copies: the page numbers and the stain on the last sheet matched. It was simply easier when a promise existed in triplicate."
 ADISCORD_vorkerland_postwar.32.a:0 "Close the door quietly."
 ADISCORD_vorkerland_postwar.32.b:0 "Reserve the night shift for urgent work."
 WRK_worx_story_madness_plus_3_tt:0 "Worx's madness: §R+3§!."
 ADISCORD_vorkerland_postwar.32.c:0 "Keep the reports arriving through the night."
 WRK_worx_story_madness_minus_8_tt:0 "Worx's madness: §G-8§!."
 ADISCORD_vorkerland_postwar.33.t:0 "In Another Hand"
 ADISCORD_vorkerland_postwar.33.d:0 "At the morning meeting Worx placed two pages before a laboratory director. The first ordered a measurement repeated. The second called repetition a pointless delay. The doctor asked who had changed the conclusion.\n\nThe director studied the edge of the table. Worx had written both instructions: the first two days ago, the second during the night. The secretary had retained the incoming numbers so no order would be lost. That diligence now made the situation unbearable.\n\nThe doctor compared the slant of the letters. He did not deny his handwriting. 'Then I was given different information between these entries.' Nobody could name it. Worx ordered a search, and the meeting continued without the laboratory director."
 ADISCORD_vorkerland_postwar.33.a:0 "Both pages remain on file."
 ADISCORD_vorkerland_postwar.33.b:0 "Check the original data independently."
 ADISCORD_vorkerland_postwar.33.c:0 "Invalidate the earlier instruction."
 ADISCORD_vorkerland_postwar.34.t:0 "Do Not Switch It Off"
 ADISCORD_vorkerland_postwar.34.d:0 "When the generator stopped, the doctor noticed the silence before the darkness. Ventilation fell quiet, footsteps ceased outside his door, the recorder stopped. He stood and demanded to know who had given the order.\n\nThe electrician explained that a damaged cable was being replaced. Worx listened until he said, 'It is safer for the people.' Then the doctor demanded the names of everyone at the switch. He understood the technical cause. What he could not endure was that several people had agreed among themselves and stopped an entire system without his permission.\n\nThe lights returned after eight minutes. Worx remained standing by the laboratory door, listening to the instruments and asking whether every line was running. The electrician waited for permission to leave. His name had already been recorded."
 ADISCORD_vorkerland_postwar.34.a:0 "The generator is running again."
 ADISCORD_vorkerland_postwar.34.b:0 "Uphold the engineers' right to stop faulty lines."
 WRK_worx_story_madness_plus_8_tt:0 "Worx's madness: §R+8§!."
 ADISCORD_vorkerland_postwar.34.c:0 "Require personal approval for every shutdown."
 WRK_worx_story_madness_minus_10_tt:0 "Worx's madness: §G-10§!."
 ADISCORD_vorkerland_postwar.35.t:0 "After the First Series"
 ADISCORD_vorkerland_postwar.35.d:0 "The results of the first paid series arrived in an unlabelled folder. Worx read the table, returned to its beginning and, for the first time in days, asked for tea. He even asked whether the night shift was receiving hot meals.\n\nThe accompanying physician tried to use the change in his mood. She described a man who could no longer find his way to his dormitory after the trials. The doctor let her speak, then asked whether he had behaved that way before. There was no such entry in the earlier record.\n\n'Then it is a result,' Worx said, drawing the folder towards him. Columns for another study had already been ruled on the next page. The secretary was still holding the tea."
 ADISCORD_vorkerland_postwar.35.a:0 "The folder has been received."
 ADISCORD_vorkerland_postwar.36.t:0 "Habituation"
 ADISCORD_vorkerland_postwar.36.d:0 "The third completed series was received by the duty clerk. He checked the signatures, dated the folder and pointed to the shelf. The physician remembered when such files were taken to the doctor personally. They now stood between reagent accounts and linen requests.\n\nWorx arrived towards evening. He praised the results but began reading at the limitations: too narrow a sample, too little time, insufficient grounds for a general conclusion. Nobody had promised a general conclusion, yet it proved impossible to argue.\n\nHe wrote neatly in the margin: extend observation. The physician asked how many more people would be required. 'Enough,' the doctor replied, 'that we do not have to repeat this conversation.'"
 ADISCORD_vorkerland_postwar.36.a:0 "Extend observation."
 ADISCORD_vorkerland_postwar.37.t:0 "There Is Never Enough Data"
 ADISCORD_vorkerland_postwar.37.d:0 "By the sixth series, the secretary could recognise the doctor's calm days by the sound of his pencil. On calm days Worx underlined sentences. On other days he punctured the paper, pressing repeatedly at one point.\n\nToday the paper held. Every measurement fitted the proposed model. The team leader ventured that the work might be finished. The pencil stopped. Had the staff, the doctor asked, selected data to match the expected answer?\n\nAn error could be corrected by another trial. Agreement required an investigation into the staff's honesty. The secretary understood before the others and silently brought fresh forms. Worx nodded gratefully. This was how a good team ought to work."
 ADISCORD_vorkerland_postwar.37.a:0 "Prepare the next series."
 ADISCORD_vorkerland_postwar.38.t:0 "A Result with a Minus Sign"
 ADISCORD_vorkerland_postwar.38.d:0 "Re-examination did not confirm the conclusion. A young researcher wrote this on the first page, without the customary qualifications. His superior suggested moving it to an appendix. He refused: the first twenty pages would then describe something that had not happened.\n\nWorx read the paper standing. He demanded the log, another copy, then recalculated a column himself. There was no error. 'Do you understand that this cancels six months?' The researcher replied that a conclusion could be cancelled; the six months had already happened.\n\nThe doctor sat down. For once he did not know which order would end the conversation. The work on his desk met his requirements exactly. That was what made it intolerable."
 ADISCORD_vorkerland_postwar.38.a:0 "Leave the conclusion on the desk."
 ADISCORD_vorkerland_postwar.38.b:0 "Circulate the method and its negative result."
 ADISCORD_vorkerland_postwar.38.c:0 "Restrict access pending further approval."
 ADISCORD_vorkerland_postwar.39.t:0 "The Person Who Turns Off the Light"
 ADISCORD_vorkerland_postwar.39.d:0 "The cleaner arrived after midnight. Worx once moved his chair so she could wash beneath the desk. Now he asked her to wait in the corridor, sometimes until morning.\n\nOne night she entered anyway. Torn pages lay on the floor; untouched cups of tea stood on the desk. The doctor asked why she arrived at precisely the same time each night. She showed him the schedule. His signature was at the bottom.\n\nWorx studied it, then explained that an institution could not depend on another person's routine. He was polite and thorough, as if lecturing. The woman held her bucket with both hands. Finally, he asked her not to turn off the light, even when the office was empty."
 ADISCORD_vorkerland_postwar.39.a:0 "The light will remain on."
 ADISCORD_vorkerland_postwar.40.t:0 "A Non-Research Case"
 ADISCORD_vorkerland_postwar.40.d:0 "The district clinic finally repaired an instrument that had stood idle for three months. Its first patient was an elderly fitter. He did not ask about the prognosis, only when he could climb the stairs to his home again.\n\nThe physician reported the number treated and sent a copy to the directorate. Worx returned it with a question: where was the comparison group? She replied that she was treating people. That did not require leaving some patients without help.\n\nThe response criticised misuse of equipment. Beneath it, in another hand, was permission to continue admissions until further notice. The fitter came unassisted the next morning. He climbed slowly, paused on the landing and asked for his coat."
 ADISCORD_vorkerland_postwar.40.a:0 "Open tomorrow's appointments."
 ADISCORD_vorkerland_postwar.40.b:0 "Uphold the priority of treatment."
 ADISCORD_vorkerland_postwar.40.c:0 "Prepare a separate observational report for the doctor."
 ADISCORD_vorkerland_postwar.41.t:0 "A Return Ticket"
 ADISCORD_vorkerland_postwar.41.d:0 "The discharge form said: fit to return. The soldier read it three times and asked where to. The nurse first thought he could not see properly. Then she understood that for years the word had meant the front.\n\nThe rehabilitation director brought the programme's results to the directorate. Worx asked why the report listed people who had not rejoined their units. Some, the director replied, had gone home. The doctor waited for the explanation to continue. It did not.\n\nAt the railway booking office, the soldier found his hospital tag in his pocket. He could not quite bring himself to throw it away. The clerk asked his name. He answered before remembering his number."
 ADISCORD_vorkerland_postwar.41.a:0 "A one-way ticket. Home."
 ADISCORD_vorkerland_postwar.42.t:0 "After the Command"
 ADISCORD_vorkerland_postwar.42.d:0 "The trial group completed its exercise faster than a regular unit. That occupied the report's first line. The remaining lines recorded equipment expenditure and participant losses. Worx read the first and asked to hear it aloud.\n\nThe officer stood opposite, holding his cap by the peak. One returning participant still had to be reminded that the exercise was over. He stood at every sharp sound and waited for an order nobody was giving. The doctor asked how precisely he obeyed it.\n\nThe officer looked at the door. The man waited outside, neatly buttoned and shaved. Worx suggested recording the observation as another programme success. The cap bent in the officer's hands; he hurriedly straightened its peak."
 ADISCORD_vorkerland_postwar.42.a:0 "Enter the observation in the report."
 ADISCORD_vorkerland_postwar.43.t:0 "Three Steps"
 ADISCORD_vorkerland_postwar.43.d:0 "Three steps remained between the entrance and lift in the rebuilt house. The plan did not classify them as an obstacle: each step met the standard. The third-floor residents wrote that they could not take a wheelchair outside without their neighbours' help.\n\nThe letter reached Worx with the occupancy report. He checked the measurements, then requested a photograph. A man held the door, a woman stood beside the wheelchair, and between them lay a small, flawlessly built staircase.\n\nThe doctor ordered a ramp. The secretary was recording it when Worx asked how many other cases had been omitted from the model. He was not angry with the residents. That troubled the secretary more: the doctor spoke as though the world itself were concealing necessary data."
 ADISCORD_vorkerland_postwar.43.a:0 "Add the ramp to the plan."
 ADISCORD_vorkerland_postwar.44.t:0 "What Can Be Seen Through Glass"
 ADISCORD_vorkerland_postwar.44.d:0 "The new rules for laboratory records were discussed without the doctor. Some proposed opening them to colleagues; others wanted only the director to hold the complete picture. The order was in effect by evening.\n\nWorx walked past the laboratory windows. People worked behind each, and none revealed everything happening within."
 ADISCORD_vorkerland_postwar.44.a:0 "The access rules are approved."
 ADISCORD_vorkerland_postwar.44.glass:0 "Two conflicting graphs were pinned to the shared board. Previously, one would have been removed before the doctor arrived. Now the measurement log lay beside them, and staff from the next laboratory came to compare their records.\n\nWorx stopped at the board. The discrepancy was explained without an immediate culprit being offered. The discussion lasted nearly an hour. He repeatedly tried to end it with an order; each time, someone asked another question.\n\nThe graphs remained after he left. Nobody rushed to remove them. Transparent walls had not made the doctor a different person. They allowed everyone else not to face him alone."
 ADISCORD_vorkerland_postwar.44.boxes:0 "The first laboratory recorded a man as discharged. The second recorded his arrival. Two days were missing between those entries. Their directors could not compare dates: each was permitted to read only his own section.\n\nThe complete logs were brought to Worx. He spread them across his desk and observed that compartmentalisation was working. Nobody but him possessed enough information to draw an incorrect general conclusion.\n\nThe secretary asked who should correct the missing dates. The doctor would handle it personally. By evening he still held the logs, while the directors had new assignments. The only desk where the missing two days could be recovered had run out of room."
 ADISCORD_vorkerland_postwar.45.t:0 "Family Circumstances"
 ADISCORD_vorkerland_postwar.45.d:0 "The supply director asked to remove his brother from the next list. He brought a medical certificate, confirmation of employment and a district director's letter. All were genuine. Worx checked every signature.\n\nThen he asked why no such documents had accompanied the other lists. The director began explaining that he had not previously known the personal circumstances. Exactly, Worx replied: that was why personal circumstances must not affect procedure.\n\nThe certificate was returned without a decision. The director took it with both hands, as though it might crumble. Worx watched him leave and told the secretary that a claim to privilege had been defeated today. He sounded sincerely satisfied."
 ADISCORD_vorkerland_postwar.45.a:0 "There will be no exceptions."
 ADISCORD_vorkerland_postwar.46.t:0 "In the Presence of a Witness"
 ADISCORD_vorkerland_postwar.46.d:0 "The woman was asked for the case number. She gave her husband's name. The commission secretary began to repeat the question, but the chair stopped him and asked that the name be recorded.\n\nWorx sat at the end of the table with a folder of technical justifications. Several times he tried to establish which decision the commission considered erroneous. The woman was not describing an error. Her husband had feared missing the departmental bus and had left home without breakfast.\n\nThat detail belonged to no item on the agenda. The doctor waited for it to be removed from the minutes. The chair ordered it retained. For once, another person's story continued in Worx's presence without becoming an answer to his question."
 ADISCORD_vorkerland_postwar.46.a:0 "Record it without abridgement."
 ADISCORD_vorkerland_postwar.47.t:0 "A Duplicate Key"
 ADISCORD_vorkerland_postwar.47.d:0 "The doctor's new pass opened his office, the library and two research rooms. The administrative archive did not respond. Worx presented the card again, then called the attendant.\n\nThe attendant checked a list and suggested requesting access through the commission. The doctor asked who had compiled it. The employee supplied a name and remained by the door. Behind him hung instructions signed by several directors. There was no space for Worx's signature.\n\nAn hour later Worx returned to his office and began a calculation. The secretary heard the familiar words: 'The procedure will have to be revised.' This time he entered them in the suggestions register. Nothing else happened before the end of the working day."
 ADISCORD_vorkerland_postwar.47.a:0 "The application will follow the established procedure."
 ADISCORD_vorkerland_postwar.48.t:0 "The Country Fits on the Desk"
 ADISCORD_vorkerland_postwar.48.d:0 "The map covered the entire conference table. Every district was marked with population, production and the number of institutions still requiring inspection. Worx removed a portrait from the wall to make room for another table.\n\nHe responded to the report on complaints with unexpected gentleness. People were not to blame for failing to understand the future, he said. They were taught to preserve habits, protect relatives and trust their own senses. Expecting different behaviour without first changing the conditions would be unscientific.\n\nHe proposed that the directorate stop arguing with each person separately. The secretary asked what the new arrangement should be called. Worx looked at the map, which contained no blank spaces. 'Normal.'"
 ADISCORD_vorkerland_postwar.48.a:0 "Approve the norm."
 ADISCORD_vorkerland_postwar.49.t:0 "Someone Else's Signature"
 ADISCORD_vorkerland_postwar.49.d:0 "After the western settlement, documents arrived on paper of three different sizes. Worx asked that they be put into a common format. A republic's representative observed that the signatures could not be moved onto another sheet.\n\nThe doctor looked up. War or negotiations had ended, yet somebody else's signature still limited his actions. He asked the secretary to read the terms again."
 ADISCORD_vorkerland_postwar.49.a:0 "Read all the terms."
 ADISCORD_vorkerland_postwar.49.civil:0 "The western republic's representative brought a signed charter and a list of the local council's powers. Worx paused at its right to refuse departmental requests. He called it a source of unpredictability.\n\nThe representative agreed: another government's answer could not be known in advance. That was why an agreement existed. The secretary prepared to amend the wording, but Worx silently turned the page.\n\nAfterwards the doctor requested three scenarios for a refusal. For the first time, a neighbouring government's refusal entered the calculation as a permissible event. Nobody supposed that Worx had come to like it."
 ADISCORD_vorkerland_postwar.49.administrative:0 "A technical trusteeship's representative brought a list of local specialists. Worx wrote institution numbers beside their names. The representative asked who would approve transfers between districts.\n\nThe doctor indicated the new coordinating body. It had no premises yet, but already accepted requests. Asked about families, Worx proposed another field on the form. The representative tried to continue; the secretary was already offering the next sheet.\n\nThe meeting report declared the technical disagreements resolved. On the way out, the representative asked where objections were submitted. The attendant pointed back to the same door."
 ADISCORD_vorkerland_postwar.50.t:0 "The Last Blank Sheet"
 ADISCORD_vorkerland_postwar.50.d:0 "One page of the annual report remained blank. It had once held the leader's address. The secretary no longer knew which draft was final.\n\nWorx studied the clean paper. Outside, the shift began and people crossed the yard on their own errands. None followed the paths exactly as drawn on the circulation plan. The doctor picked up his pencil."
 ADISCORD_vorkerland_postwar.50.a:0 "Continue the work."
 ADISCORD_vorkerland_postwar.50.council:0 "The draft annual report was returned to the doctor with comments. One sentence had been struck out, another moved to an appendix. Worx laid it over his calculations and left it untouched for a long time.\n\nBeyond the glass the laboratory worked. Staff argued, someone laughed, someone prepared to go home. The doctor could enter and ask a question. He could no longer order the argument to end with the answer he wanted.\n\nTowards evening the secretary received the amended text. In the margin: 'I disagree with the conclusion.' No threat or instruction followed. The country had neither cured Worx nor made him love people. It had learned to live with his disagreement without surrendering itself to him."
 ADISCORD_vorkerland_postwar.50.quiet:0 "This time the annual report was accepted without corrections. Production had recovered, institutions obeyed instructions and fresh results arrived on time. Worx spoke quietly, almost kindly. The secretary caught himself calling it a good day.\n\nThen the next programme's list arrived. The doctor signed without interrupting a discussion of the city library's repairs. He saw no contradiction. People should read books, live in sound houses and provide the system with the material it required.\n\nLeaving, the secretary glanced at the report's last page. 'Conditions stabilised.' For the first time, he wished there were an error in the document."
 ADISCORD_vorkerland_postwar.50.crisis:0 "A certificate accompanied the annual report: the principal targets had been met. Worx crossed out 'principal'. It meant that somebody had already decided which deviations could be ignored.\n\nHe ordered the directors assembled, then cancelled the meeting: prepared answers would prove nothing. He demanded the original logs, then forbade their removal from the laboratories: pages could be substituted in transit. The secretary stood at the door with two incompatible instructions and waited for a third.\n\nOutside, the shift began. On the circulation plan people moved in straight lines. In the yard they stopped, talked and walked around puddles. The doctor drew another line. The last page was no longer blank."
 ADISCORD_vorkerland_postwar.32.after:0 "The directorate changed its night watch, but the lamp in the last window on the third floor remained lit. Worx sat before three identical reports. On each, the word 'suspended' was circled in red.\n\nHe answered the question about sleep calmly. During the war, people had promised to resume work after victory. Victory had come; inexplicably, they did not intend to resume. Every pause meant convincing them of the obvious again tomorrow. Tomorrow could not be lost.\n\nThe secretary offered to remove two copies. The doctor pinned them beneath his palm. He knew they were copies: the page numbers and the stain on the last sheet matched. It was simply easier when a promise existed in triplicate.\n\nThe secretary passed this record to the commission after the doctor's personal authority had been restricted. The duty log had to reconstruct events: Worx had left no separate instruction."
 ADISCORD_vorkerland_postwar.33.after:0 "At the morning meeting Worx placed two pages before a laboratory director. The first ordered a measurement repeated. The second called repetition a pointless delay. The doctor asked who had changed the conclusion.\n\nThe director studied the edge of the table. Worx had written both instructions: the first two days ago, the second during the night. The secretary had retained the incoming numbers so no order would be lost. That diligence now made the situation unbearable.\n\nThe doctor compared the slant of the letters. He did not deny his handwriting. 'Then I was given different information between these entries.' Nobody could name it. Worx ordered a search, and the meeting continued without the laboratory director.\n\nThe secretary passed this record to the commission after the doctor's personal authority had been restricted. The duty log had to reconstruct events: Worx had left no separate instruction."
 ADISCORD_vorkerland_postwar.34.after:0 "When the generator stopped, the doctor noticed the silence before the darkness. Ventilation fell quiet, footsteps ceased outside his door, the recorder stopped. He stood and demanded to know who had given the order.\n\nThe electrician explained that a damaged cable was being replaced. Worx listened until he said, 'It is safer for the people.' Then the doctor demanded the names of everyone at the switch. He understood the technical cause. What he could not endure was that several people had agreed among themselves and stopped an entire system without his permission.\n\nThe lights returned after eight minutes. Worx remained standing by the laboratory door, listening to the instruments and asking whether every line was running. The electrician waited for permission to leave. His name had already been recorded.\n\nThe secretary passed this record to the commission after the doctor's personal authority had been restricted. The duty log had to reconstruct events: Worx had left no separate instruction."
 WKR_measured_republic_dynamic:0 "Republic of Measurable Results"
 WKR_measured_republic_dynamic_desc:0 "Bagley measures his mandate in working shops, fulfilled orders and lives preserved. Production standards and military doctrine become parts of the same institution."
 WKR_programme_slot_tt:0 "The previous national order has been completed or cancelled."
 WKR_programme_order_tt:0 "[ROOT.GetName] receives the order. Capitulation, loss of independence or the end of the civil war cancel it with a full refund. At reunification, restored Vorkerland receives the refund."
 WRK_prewar_programmes_tt:0 "The budget, political pillars and the fate of the government shape preparation for the collapse. Material projects are available in preparation decisions."
 WKR_rifle_contract:0 "Order a Standard Rifle Batch"
 WKR_rifle_contract_desc:0 "The workshops hold too many incompatible parts. A common order sheet must turn separate batches into consistent production."
 WKR_staff_course:0 "Run Operational Planning Courses"
 WKR_staff_course_desc:0 "Staff officers study the same reports until their different maps begin to describe the same war."
 WKR_support_contract:0 "Order Field Support Kits"
 WKR_support_contract_desc:0 "Companies need more than rifles. Signals gear, medical supplies and tools must appear on the same manifests as ammunition."
 WKR_workshop_contract:0 "Expand Vorkerland Armament Workshops"
 WKR_workshop_contract_desc:0 "An empty factory hall is not yet a workshop. Suppliers and machinists gather around one table to turn its plan into working stations."
 WKR_ration_contract:0 "Supply the Workers' Districts"
 WKR_ration_contract_desc:0 "Delivery schedules appear at the gates. People will judge the new ledger by whether the carts reach the last street."
 WKR_rail_contract:0 "Assemble a Night Freight Train"
 WKR_rail_contract_desc:0 "Shielded lamps light the stations at night. Dispatchers must guide the train through junctions that answered to separate authorities only yesterday."
 WKR_artillery_contract:0 "Order Artillery Batteries"
 WKR_artillery_contract_desc:0 "A firing table matters only beside a serviceable gun. Factories check tolerances while gunners accept every batch against a common specification."
 WKR_pattern_contract:0 "Adopt Purchased Industrial Drawings"
 WKR_pattern_contract_desc:0 "Translators and machinists argue over notation. The purchased design must speak the language of our workshops."
 WRK_requisition_emergency_tools:0 "Requisition Emergency Tools"
 WRK_requisition_emergency_tools_desc:0 "The commission opens the warehouse ledgers and hears their owners' objections. A common emergency does not make property claims disappear."
 WRK_finance_evacuation_stock:0 "Purchase Evacuation Train Stores"
 WRK_finance_evacuation_stock_desc:0 "District treasurers reconcile the stations' requests. Wagons must arrive with tools and serviceable fittings, not promises alone."
 WRK_register_volunteer_reserve:0 "Register Emergency Volunteers"
 WRK_register_volunteer_reserve_desc:0 "Committees visit homes and check the volunteer lists. Every name must have an assembly point behind it, not somebody else's signature."
 WRK_drill_emergency_staff:0 "Hold District Staff Exercises"
 WRK_drill_emergency_staff_desc:0 "District officers gather around shared maps. Old boundaries of authority must be discussed before a real front runs through them."
 WRK_order_standard_tools:0 "Purchase Standard Workshop Kits"
 WRK_order_standard_tools_desc:0 "Engineers strike rare dimensions from the list. Whatever breaks far from the main factory must be repairable where it stands."

 # Western political mandate
 WKR_bop:0 "Western Emergency Mandate"
 WKR_bop_chairman:0 "The Chairman"
 WKR_bop_councils:0 "Front Councils"
 WKR_bop_even:0 "Negotiated Powers"
 WKR_bop_chairman_influence:0 "Authority of the Chairman"
 WKR_bop_chairman_dominance:0 "Mandate of the First Revolution"
 WKR_bop_councils_influence:0 "Influence of the Front Executive"
 WKR_bop_councils_dominance:0 "Executive Majority"
 WKR_administration_active_tt:0 "The western government is independent, has not capitulated and remains in the civil campaign."
 WKR_presidential_course_tt:0 "Nikita Worcker or the emergency committee of his supporters leads a neo-vorkerist government."
 WKR_executive_course_tt:0 "Anton Bagley leads the utilitarian executive."
 WKR_mandate_fixed_tt:0 "Fixes the chosen political course. Later balance shifts retain their modifiers but no longer replace the government."
 WKR_balance_mandate_tt:0 "Before the first political focus is completed, a balance of at least 60% toward the chairman or the executive changes the government. Once the mandate is fixed, only the powers of each side change."
 WKR_chairman_choice_tt:0 "The majority will support the First Revolution. Nikita Worcker will lead if he remained with the western forces; otherwise, his supporters will form an emergency committee."
 WKR_executive_choice_tt:0 "The majority will entrust the government to Anton Bagley and his executive, opening the constitutional course of distribution, accountability and agreements."
 WKR_rally_the_chairmans_delegates:0 "Rally the Chairman's Delegates"
 WKR_rally_the_chairmans_delegates_desc:0 "Factory delegates bring the banners of the First Revolution into the hall. To them the chairman is a promise that neither a staff report nor a new production norm can revoke."
 WKR_convene_the_executive_session:0 "Convene the Executive Session"
 WKR_convene_the_executive_session_desc:0 "Representatives of the fronts and workshops compare delivery lists. The executive seeks support from those willing to answer to neighbouring republics for every signature on a common agreement."
 WKR_mandate_open_status:0 "The mandate is still being debated. A balance of at least 60% toward the chairman or the executive will replace the government. The first political focus fixes the course."
 WKR_mandate_presidential_status:0 "The mandate of the First Revolution is fixed. The balance determines the powers of each side while preserving the chosen government."
 WKR_mandate_executive_status:0 "The executive mandate is fixed. The balance determines the powers of each side while preserving the chosen government."
 ADISCORD_vorkerland_claimant.1.c:0 "The adopted mandate remains in force."
 ADISCORD_vorkerland_claimant.5.t:0 "The Chairman's Mandate"
 ADISCORD_vorkerland_claimant.5.nikita.d:0 "The hall is still noisy when the chairman approaches the rostrum. The delegates have laid too many debts at each other's feet to mistake an old name for an answer. Yet the vote has been taken: the front councils entrust Nikita Worcker with gathering the western forces around the promise of the First Revolution.\n\nThe executive's ledgers remain on the table. Once again, it is the chairman who signs them."
 ADISCORD_vorkerland_claimant.5.legacy.d:0 "The chairman's chair remains empty. Some delegates speak of a debt to his name; others of a revolution that must not disappear with one man. War continues beyond the windows, and waiting has long become as much a luxury as full depots.\n\nThe majority entrusts its powers to an emergency committee. Its members govern in the name of Worcker's legacy and promise to finish the revolution he began. Nobody takes the empty chair; another table is placed before it."
 ADISCORD_vorkerland_claimant.5.a:0 "In the name of the First Revolution."
 ADISCORD_vorkerland_claimant.6.t:0 "The Executive Takes Office"
 ADISCORD_vorkerland_claimant.6.d:0 "Anton Bagley brings no new oath to the session, only a folder of reconciled ledgers. Workshop representatives recognise their orders, railwaymen their disputed trains, and front delegates their promised deliveries. For the first time, the same people have signed all these lists.\n\nA majority of the councils entrusts the government to the executive. Bagley promises that authority will be judged by obligations fulfilled. The banners remain in the hall, but the next argument already concerns who will answer for the missing wagons."
 ADISCORD_vorkerland_claimant.6.a:0 "Responsibility is proven by action."

 # Railway councils
 WKR_organize_railway_council:0 "Railway Council: [FROM.GetName]"
 WKR_organize_railway_council_desc:0 "Factory shipments, troop trains and requests from local depots converge at the junction. Dispatchers, track crews and front delegates will form a council to reconcile the accumulated ledgers and coordinate shifts. Nearby units will no longer have to search other headquarters for the station chief."
 WKR_railway_council:0 "Railway Council"
 WKR_railway_council_desc:0 "Dispatchers and depot crews work from a common ledger of the western forces."
 WKR_railway_context_tt:0 "The western government is independent, has not capitulated and remains in the civil campaign. The fully controlled, owned state contains a supply hub."
 WKR_railway_slot_tt:0 "The shared railway council programme queue is free."
 WKR_railway_target_tt:0 "This state has neither a railway council nor unfinished work to organise one."
 WKR_railway_unlock_tt:0 "Councils can improve local supplies and division movement in owned states with supply hubs."
 WKR_railway_programme_tt:0 "On completion, the state receives a railway council until the civil campaign ends. It operates while we fully control the state and retain its supply hub."
 WKR_railway_cancellation_tt:0 "Loss of full control or the supply hub, capitulation, subjugation and the end of the campaign cancel unfinished work with a full refund. United Vorkerland receives the refund at reunification; an annexer receives it at annexation. A completed council dissolves when the state is lost or the campaign ends; recapturing the state allows it to be rebuilt for the full price."
 WKR_railway_order_pending:0 "A railway council is being organised. Paid: §Y[?WKR_railway_order_pp|0]§! £political_power_texticon §Y[?WKR_railway_order_manpower|0]§! £population_texticon §Y[?WKR_railway_order_support|0]§! £support_equipment_texticon §Y[?WKR_railway_order_trains|0]§! £train_texticon."
 WKR_railway_order_idle:0 "The shared railway council programme queue is free."
 WKR_railway_cost:0 "§Y40§! £political_power_texticon §Y500§! £population_texticon §Y40§! £support_equipment_texticon §Y5§! £train_texticon"
 WKR_railway_cost_blocked:0 "§R40§! £political_power_texticon §R500§! £population_texticon §R40§! £support_equipment_texticon §R5§! £train_texticon"
 WKR_railway_cost_tooltip:0 "§Y40§! £political_power_texticon §Y500§! £population_texticon §Y40§! £support_equipment_texticon §Y5§! £train_texticon"

 WKR_supply_coalition_partner:0 "Arm a coalition partner: [FROM.GetName]"
 WKR_supply_coalition_partner_desc:0 "Front delegates bring reports of empty depots and letters from their commanders. Our factory committees can assign a shipment to allied units so that the neighbouring sector does not fall silent in the middle of an offensive."
 WKR_coalition_supply_context_tt:0 "The western government remains in the civil campaign. The partner has not capitulated, belongs to our coalition and fights on our side in the same war."
 WKR_coalition_supply_unlock_tt:0 "Enables arms deliveries to coalition partners fighting in a shared war."
 WKR_coalition_supply_cost:0 "§Y25§! £political_power_texticon §Y1000§! £infantry_equipment_texticon §Y50§! £support_equipment_texticon"
 WKR_coalition_supply_cost_blocked:0 "§R25§! £political_power_texticon §R1000§! £infantry_equipment_texticon §R50§! £support_equipment_texticon"
 WKR_coalition_supply_cost_tooltip:0 "§Y25§! £political_power_texticon §Y1000§! £infantry_equipment_texticon §Y50§! £support_equipment_texticon"
 WKR_negotiate_republic_recognition:0 "Independence treaty: [FROM.GetName]"
 WKR_negotiate_republic_recognition_desc:0 "Republican envoys bring maps with different borders and the same fear of a new unifier. Signatures on a treaty must convince both delegations that the western government is prepared to live alongside neighbours it can no longer regard as its districts."
 WKR_recognition_available_tt:0 "Frealor or the Truman Republic exists, is independent, has not capitulated and is not at war with us. No treaty or unanswered offer exists. The western government remains in the civil campaign and has §Y50§! £political_power_texticon."
 WKR_recognition_unlock_tt:0 "A treaty with each republic strengthens the western government's legitimacy and preserves the signatory's independence after our victory."
 WKR_recognition_offer_tt:0 "[FROM.GetName] receives an offer lasting 14 days. Acceptance costs us §Y50§! £political_power_texticon and grants §G+0.04§! legitimacy; both sides sign a non-aggression pact. The signatory remains independent if we win. Refusal, expiry or invalid conditions incur no charge."
 WKR_recognition_cost:0 "§Y50§! £political_power_texticon on acceptance"
 WKR_recognition_cost_blocked:0 "§R50§! £political_power_texticon on acceptance"
 WKR_recognition_cost_tooltip:0 "§Y50§! £political_power_texticon is charged only when the other side accepts."
 WKR_independence_treaty_tt:0 "The western government recognises our independence and signs a non-aggression pact with us. If it wins, united Vorkerland will uphold the treaty without demanding our submission. We retain our alliance and control of our own wars. The western government gains 0.04 legitimacy."
 ADISCORD_vorkerland_diplomacy.17.t:0 "Signatures Instead of Old Borders"
 ADISCORD_vorkerland_diplomacy.17.d:0 "The western government's envoys have laid a short draft treaty on the table. It contains none of the familiar references to a temporary rebellion or the duties of a former district: our republic is called an independent party. The delegation asks for recognition in return and promises that the document will remain binding after the centre is reunified.\n\nThe chancery debates the value of such promises. Some see a chance to settle the old dispute while the western committees still have reasons to negotiate. Others advise waiting until the war ends: a victor always reads treaties differently. A secretary is already waiting outside with two clean copies."
 ADISCORD_vorkerland_diplomacy.17.close:0 "Leave the draft unsigned."
 ADISCORD_vorkerland_diplomacy.17.accept:0 "Recognise one another."
 WKR_recognition_targets_tt:0 "At least one independent republic is eligible for a treaty."

 # Imperial restoration and succession variants
 WRK_empire_after_the_tribunal_worcker:0 "After the Tribunal"
 WRK_empire_after_the_tribunal_petrichev:0 "The Victor's Crown"
 WRK_empire_after_the_tribunal_desc_worcker:0 "The sentence has been carried out, the council dissolved, and the army waits for the new ruler's word. Worcker promises one state without co-rulers. The shadow of Petrishchev remains in the staffs and barracks, and the court must reckon with it."
 WRK_empire_after_the_tribunal_desc_petrichev:0 "The Tower rises above the capital again, but restored stone has not restored the old order. Petrichev receives the districts' oaths as more than a temporary commander. They will serve a state whose ambitions reach beyond the military district."
 ADISCORD_vorkerland_empire_court_worcker:0 "The Imperial Court"
 ADISCORD_vorkerland_empire_court_petrichev:0 "Crown Service"
 ADISCORD_vorkerland_empire_court_desc_worcker:0 "The chairman's court, the single party and the cult of the rescued ruler. The court grows stronger as imperial programmes are completed."
 ADISCORD_vorkerland_empire_court_desc_petrichev:0 "Petrichev's chancery turns wartime obedience into permanent public service. Office and landed grants bind the districts to the crown through different obligations."
 ADISCORD_vorkerland_empire_bop_worcker:0 "The Shadow of Petrishchev"
 ADISCORD_vorkerland_empire_bop_petrichev:0 "Crown and Uniform"
 ADISCORD_vorkerland_empire_bop_court_worcker:0 "Worcker's Court"
 ADISCORD_vorkerland_empire_bop_court_petrichev:0 "Crown Chancery"
 ADISCORD_vorkerland_empire_category_worcker:0 "The Shadow of Petrishchev"
 ADISCORD_vorkerland_empire_category_petrichev:0 "Crown and Uniform"
 ADISCORD_vorkerland_empire_category_desc_worcker:0 "After Petrishchev's execution, Worcker's court and the officer corps compete for influence. A leaning court brings political power, leaning officers bring military strength. When the balance reaches §Y80%§! toward the corps, the generals prepare a plot."
 ADISCORD_vorkerland_empire_category_desc_petrichev:0 "Petrichev has reunited the country, but the victorious commanders refuse to become ordinary public servants. The chancery demands common law while the corps protects its district powers. Chancery influence strengthens civilian government; corps influence strengthens the army. At §Y80%§! corps influence, the generals prepare a challenge to the crown."
 WRK_empire_imperial_governors_desc_worcker:0 "The former district states pass to imperial governors. The chairman appoints each governor personally, and each answers to him alone."
 WRK_empire_imperial_governors_desc_petrichev:0 "District governments give way to crown governors. Petrichev insists that an oath must no longer be a bargain between separate headquarters: each appointed governor answers to the capital for an entire district."
 WRK_empire_staff_without_petrishchev_worcker:0 "A Staff Without Petrishchev"
 WRK_empire_staff_without_petrishchev_petrichev:0 "The Crown General Staff"
 WRK_empire_staff_without_petrishchev_desc_worcker:0 "Petrishchev's appointees retire, and officers who owe their careers to the chairman take their places. The staff loses some of its people but gains a single command."
 WRK_empire_staff_without_petrishchev_desc_petrichev:0 "The victorious district staff becomes the empire's general staff. Petrichev retains experienced commanders but separates personal loyalty to a general from service to the state. Orders must now reach every corps through one chain."
 WRK_empire_tower_coronation_desc_worcker:0 "Ministers, governors and commanders swear their oath to Worcker in the Unity Tower. The chairman's power becomes unquestionable, and the court finally prevails over the generals."
 WRK_empire_tower_coronation_desc_petrichev:0 "In the restored Tower, ministers and commanders swear allegiance to Petrichev as the supreme sovereign. The crown is no longer a promise: those who recently ruled their districts at will have recognized its authority."
 WRK_empire_veyran_order_desc_worcker:0 "The empire no longer lives in the shadow of the tribunal. The court and the officer corps are built into one system of government, and Petrishchev's name has become history rather than a threat."
 WRK_empire_veyran_order_desc_petrichev:0 "The campaign is over, and the crown charter becomes the foundation of a peacetime state. Petrichev settles the roles of the chancery and army in the restored empire. The districts no longer decide whether to recognize the capital; they argue about their place within its order."
 WRK_empire_veyran_order_tt_worcker:0 "The Shadow of Petrishchev fades: the balance between the court and the officer corps is removed along with its bonuses and the threat of a plot."
 WRK_empire_veyran_order_tt_petrichev:0 "The balance between the crown chancery and officer corps ends, together with its bonuses and the threat of a conspiracy. Governor appointments remain available."
 ADISCORD_vorkerland_postwar.5.a_worcker:0 "His rescuer had become expendable."
 ADISCORD_vorkerland_postwar.5.a_petrichev:0 "Restoration has become an empire."
 ADISCORD_vorkerland_postwar.5.t_worcker:0 "Worcker Executes Petrichev"
 ADISCORD_vorkerland_postwar.5.t_petrichev:0 "Petrichev Proclaims the Empire"
 ADISCORD_vorkerland_postwar.5.d_worcker:0 "In the first weeks after their common victory, the emergency council ceased to exist. Vlad Petrichev, who had rescued Nikita Worcker from the rubble and shared power with him during the civil war, was arrested by his own guards. A closed tribunal accused him of preparing a military coup. His sentence was carried out on Worcker's personal orders.\n\nA changed ruler appeared before the cameras: a full beard, dark clothes and a cold promise to end the country's fragmentation. Worcker proclaimed the Vorkerland World Empire. The new regime made statism the foundation of the state, subordinated civilian institutions to a single center and demanded an unconditional military oath.\n\nIts first orders called for expanded arsenals, mass recruitment and preparations for a campaign against Itora. The man whose life Petrichev once saved no longer intends to share power with anyone."
 ADISCORD_vorkerland_postwar.5.d_petrichev:0 "After completing the settlement and restoring the Unity Tower, Vlad Petrichev proclaimed the World Empire of Vorkerland. The former eastern district commander receives oaths from officials and officers who until recently represented separate governments.\n\nThe imperial mandate continues the course chosen during the civil war. Petrichev remains head of state; the chancery prepares new appointments while the army demands recognition for its victories. For some, victory means the return of common law. For others, it gives the victors the right to dispose of the country.\n\nWestern capitals received the proclamation with apprehension. The empire has not declared its next war, but its name gives its neighbours little confidence that reunifying the former districts will satisfy it."
 ADISCORD_vorkerland_postwar.60.d_worcker:0 "Officers who remember Petrishchev no longer hide their irritation. In the staffs they call the tribunal a mistake and Worcker's court a gathering of officials who never saw the front. The security service has intercepted lists: several corps commanders are ready to demand guarantees for the army from the chairman and, if refused, to bring their units into the streets of the capital.\n\nWorcker can strike first and arrest the plotters, at the risk of weakening the army on the eve of war. Or he can buy the generals' loyalty with seats in the imperial council and new powers for the staff."
 ADISCORD_vorkerland_postwar.60.d_petrichev:0 "The officers who carried Petrichev to victory increasingly call the chancery an obstacle. Land grants and district appointments have not satisfied them: they now demand the right to determine the government. Counterintelligence has uncovered an agreement among several commanders to march their troops towards the capital if the crown rejects their terms.\n\nPetrichev must decide what the unity of his victors is worth. Arrests would show that an oath grants no right to dictate to the sovereign. Seats on the council may prevent a revolt, but they would turn an extraordinary demand into a permanent right."
 ADISCORD_vorkerland_postwar.61.d_empire_worcker:0 "After Itora's capitulation, Nikita Worcker climbed the Unity Tower and declared that the name Vorkerland belonged to the age of fragmentation. The state takes the name of the Veyran Empire, the monarchy once swept away by the First Revolution. The arms of the old empire hang over the ministries again, and the western states receive governors instead of elected councils.\n\nFor those who remember Petrishchev, it is a return to the past they fought against. For everyone else, it is a sign that the civil war is over and the centre no longer intends to share power."
 ADISCORD_vorkerland_postwar.61.d_empire_petrichev:0 "After Itora's capitulation, Vlad Petrichev announced the restoration of the Veyran Empire. The Unity Tower heard titles and territorial names that the First Revolution had tried to consign to the past. For district commanders, this day marked the end of a campaign; for the chancery, the beginning of governing new possessions.\n\nPetrichev retained the authority won in the civil war and extended it westward. The empire must now determine whether its victorious headquarters will support the crown or remain its permanent partners in rule."
 WRK_petrichev_empire_transition_tt:0 "After this focus, Petrichev retains power and receives the World Empire tree."
 WRK_empire_crown_service:0 "Crown Service Ranks"
 WRK_empire_crown_service_desc:0 "Petrichev offers officials a place in the new state through service, rather than their patrons' victories. Common ranks will bind provincial offices to the capital and return capable administrators to ruined towns."
 WRK_empire_crown_service_tt:0 "Unlocks district reconstruction with §Y2§! concurrent projects."
 WRK_empire_officer_estates:0 "Military Estates"
 WRK_empire_officer_estates_desc:0 "The commanders will not abandon the districts they held through the war. The crown recognizes their holdings in return for permanent service. The estates will support the throne, though local industry will feel who now has first claim to people and land."
 WRK_empire_officer_estates_tt:0 "Unlocks governor appointments. Each controlled core governorate receives a military estate: §G+2000§! £manpower_texticon once, $MODIFIER_LOCAL_MANPOWER$: §G+15%§!, $MODIFIER_LOCAL_FACTORIES$: §R-10%§!. Existing governorates also qualify; occupied districts receive their grant after liberation."
 WRK_empire_crown_charter:0 "The Common Crown Charter"
 WRK_empire_crown_charter_desc:0 "Service to the crown acquires written limits. The charter defines the districts' obligations and Petrichev's right to enforce them. Victory ceases to be a temporary agreement among headquarters: the empire gains an order that outlives an individual command."
 WRK_empire_delta_crown_charter:0 "Crown Service"
 WRK_empire_officer_estate:0 "Military Estate"
 ADISCORD_vorkerland_empire_settled_category_desc:0 "The final settlement has defined the powers of the chancery and army. The struggle between court and staff has ended; imperial governors continue to take charge of the districts."
 TVA_exchange_unlock_tt:0 "Unlocks agreements exchanging the directorate's equipment for specialists from independent districts, subject to their consent."
 TVA_engineering_service_unlock_tt:0 "Cadre training will add §G35§! reserve instead of §Y20§! at the same price and duration, including training already underway. Reserve is capped at §Y100§!."
 TVA_exchange_active_tt:0 "The utilitarian directorate is independent, has not capitulated and is still fighting the civil war."
 TVA_offer_specialist_exchange:0 "Offer specialist exchange: [FROM.GetName]"
 TVA_offer_specialist_exchange_desc:0 "Personal connections still link the laboratories and district workshops. They offer a way to arrange the relocation of an experienced team and equipment deliveries for those who continue working at home."
 TVA_exchange_available_tt:0 "The directorate is active; [FROM.GetName] exists, is independent, has not capitulated and is not at war with us; no previous offer awaits its reply. At least §Y40§! £political_power_texticon and §Y100§! £support_equipment_texticon are available."
 TVA_exchange_offer_tt:0 "Negotiations are paid for immediately. [FROM.GetName] receives an offer with §Y14 days§! to reply. Only upon acceptance, with conditions still met, the directorate spends a further §Y30§! £political_power_texticon and transfers §Y100§! £support_equipment_texticon, receiving §G600§! £population_texticon and §G10§! cadre reserve, capped at §Y100§!. Rejection or lost eligibility cancels the exchange; the negotiation fee is not refunded."
 TVA_exchange_accept_tt:0 "We transfer §R600§! £population_texticon to the directorate and receive §G100§! £support_equipment_texticon from its stocks. The directorate spends a further §Y30§! £political_power_texticon and gains §G10§! cadre reserve, capped at §Y100§!. Both countries' resources and eligibility are checked on acceptance."
 ADISCORD_vorkerland_diplomacy.18.t:0 "Specialists for the Directorate"
 ADISCORD_vorkerland_diplomacy.18.d:0 "Dorian Worx's representatives have brought an inventory of equipment the utilitarians can supply to our workshops. In return, they ask us to send a team of technicians, foremen and support staff to their laboratories.\n\nThe proposal avoids diplomatic flourishes: workplaces, accommodation and the host's responsibilities. Our manufacturers point out that experienced people are scarce here as well. We may accept the exchange or keep our specialists at home."
 ADISCORD_vorkerland_diplomacy.18.close:0 "Keep our specialists at home."
 ADISCORD_vorkerland_diplomacy.18.accept:0 "Agree to the exchange."
 TVA_cadre_training_gain_engineering:0 "35"
 TVA_cadre_training_gain_standard:0 "20"
 TVA_exchange_has_partner_tt:0 "At least one independent district exists, has not capitulated and is not at war with the directorate."
 TVA_emergency_series_programme_standard_tt:0 "The series delivers §G4500§! £infantry_equipment_texticon and §G60§! £support_equipment_texticon. Network load rises by §R20§!, cadre reserve falls by §R10§!, and the balance shifts §Y10%§! towards calculation. Standard-series requirements must still be met on delivery."
 TVA_emergency_series_programme_war_tt:0 "The larger series delivers §G6000§! £infantry_equipment_texticon and §G90§! £support_equipment_texticon. Network load rises by §R30§!, cadre reserve falls by §R15§!, and the balance shifts §Y10%§! towards calculation. On delivery, network load must not exceed §Y65§! and cadre reserve must be at least §Y30§!."
 TVA_emergency_series_standard_available_tt:0 "The directorate is active; calculation exceeds 10%, network load is at most 75 and cadre reserve is at least 20; continuous mobilisation or maximum throughput has been adopted."
 TVA_emergency_series_war_available_tt:0 "The directorate is active and has adopted war load; network load is at most 65 and cadre reserve is at least 30."
 TVA_war_load_series_result_tt:0 "Network load: §R+30§!. Cadre reserve: §R-15§!."
 TVA_maintenance_reduction_civil:0 "35"
 TVA_maintenance_reduction_standard:0 "25"

 # Decisive-war personnel
 TVA_final_operation_available_tt:0 "The independent Utilitarian Republic is fighting in the decisive war for Vorkerland; the selected personnel operation has not yet been carried out."
 TVA_frontline_cadre_cost:0 "§Y40§! £political_power_texticon §Y20§! £command_power_texticon §Y30§! cadre reserve"
 TVA_frontline_cadre_cost_blocked:0 "§R40§! £political_power_texticon §R20§! £command_power_texticon §R30§! cadre reserve"
 TVA_frontline_cadre_cost_tooltip:0 "Requires §Y40§! £political_power_texticon, §Y20§! £command_power_texticon and §Y30§! cadre reserve points. Payment is taken when the specialists are dispatched."
 TVA_protected_core_cost:0 "§Y35§! £political_power_texticon §Y100§! £support_equipment_texticon §Y30§! cadre reserve"
 TVA_protected_core_cost_blocked:0 "§R35§! £political_power_texticon §R100§! £support_equipment_texticon §R30§! cadre reserve"
 TVA_protected_core_cost_tooltip:0 "Requires §Y35§! £political_power_texticon, §Y100§! £support_equipment_texticon and §Y30§! cadre reserve points. Resources are spent when the specialists move to shelter."
 TVA_frontline_cadre_result_tt:0 "Cadre reserve: §R-30§!. This expenditure is permanent. The combat regime ends when the republic leaves the decisive war or loses its independence; payment is not refunded."
 TVA_protected_core_result_tt:0 "Cadre reserve: §R-30§!. Protected reserve: §G+30§!; ordinary programmes cannot use it. Following a utilitarian victory, these specialists and the remaining cadres preserve trial results for the reunited republic, even after the temporary regime expires. The total reserve counted is capped at §Y100§!. The combat regime ends on leaving the decisive war or losing independence; payment is not refunded."
 TVA_frontline_cadre_unlock_tt:0 "Allows a single deployment of reserve specialists during the decisive war to strengthen attacks and unit recovery."
 TVA_protected_core_unlock_tt:0 "Allows a single operation during the decisive war to strengthen defence and research while preserving the technical core for the postwar republic."

