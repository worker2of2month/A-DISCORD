 WKR_volunteer_expedition_unlock_tt:0 "Permission lasts until the civil campaign ends. While at peace, offer existing divisions to a country at war through Send Volunteers; its acceptance and the normal restrictions of that diplomatic action still apply."
 WKR_pattern_contract_unlock_tt:0 "The order delivers §G100§! £support_equipment_texticon, an industrial research bonus and a temporary programme for adopting foreign designs."
 VAD_guards_programme:0 "Raise a district guards regiment"
 VAD_guards_programme_desc:0 "District rolls are opened beside the regimental colours. Career soldiers receive local recruits, engineers inspect the train, and the chancery assigns the regiment its first garrison."
 VAD_local_militia_programme:0 "Organise the local militia"
 VAD_local_militia_programme_desc:0 "The council selects commanders whom the district knows. Joint patrols replace anonymous sentries, and the commandant's orders gain the signatures of neighbours."
 VAD_guards_doctrine_context_tt:0 "Petrichev's independent imperial government continues the civil campaign."
 VAD_local_militia_doctrine_context_tt:0 "The independent joint government of Worker and Petrichev continues the civil campaign."
 VAD_guards_focus_site_tt:0 "Hold at least one chartered district with an unspent cohort, without an uprising or demilitarisation."
 VAD_local_militia_focus_site_tt:0 "Hold at least one functioning commandant district without an uprising, local militia or demilitarisation."
 VAD_guards_available_tt:0 "The imperial government continues the civil campaign. The district is owned and held, has a charter and an unspent cohort, and has no uprising or demilitarisation."
 VAD_local_militia_available_tt:0 "The joint cabinet continues the civil campaign. The district is owned and held, has a commandant administration and has no uprising, local militia or demilitarisation."
 VAD_guards_unlock_tt:0 "Unlocks a guards regiment of four infantry battalions and engineers: §Y3000§! £population_texticon come from an unspent district cohort; the remaining personnel and weapons are paid through the order."
 VAD_local_militia_unlock_tt:0 "Local militia slows commandant unrest and expands district recruitment while occupying part of its factories."
 VAD_guards_result_tt:0 "One fully equipped guards regiment will form in §Y[FROM.GetName]§!: four infantry battalions and engineers, §Y4300§! £population_texticon, starting experience §Y35%§!. The district cohort supplies §Y3000§! £population_texticon and is spent; $VAD_crown_recruitment_disruption_tt$ Of the paid equipment, §Y60§! £support_equipment_texticon is consumed organising the local recruitment."
 VAD_local_militia_result_tt:0 "§Y[FROM.GetName]§! receives local militia: unrest §G-20§!, monthly unrest growth §G-10§! (minimum zero), $MODIFIER_LOCAL_MANPOWER$ §G+10%§!, $MODIFIER_LOCAL_FACTORIES$ §R-5%§!. Paid personnel and arms remain in district security; no field division is created. Lasts until the administration is lost or the civil campaign ends."
 VAD_doctrine_order_cancellation_tt:0 "Cancellation returns the full payment and does not spend the district cohort. On reunification, the successor receives any unsettled payment."
 VAD_local_militia:0 "Joint cabinet local militia"
 VAD_local_militia_desc:0 "The district council guards streets and stores alongside the commandant administration."
 VAD_local_militia_tt:0 "Monthly commandant unrest growth: §G-10§! (minimum zero)."
 VAD_guard_regiment_unit:0 "Restoration Guards Regiment"
 VAD_oath_pending_guards:0 "§YGuards regiment: [var:VAD_oath_state.GetName]§! - district cohort reserved; weapons and additional personnel paid."
 VAD_oath_pending_local_militia:0 "§YLocal militia: [var:VAD_oath_state.GetName]§! - paid personnel and weapons assigned to district security."
 VAD_guards_cost:0 "§Y60§! £political_power_texticon §Y1300§! £population_texticon §Y3870§! £infantry_equipment_texticon §Y90§! £support_equipment_texticon §Y32§! $ADISCORD_squad_weapons_equipment_short$"
