 VAD_final_operations_context_tt:0 "Central war preparations or the central war are in progress, and the district administration remains active."
 VAD_district_march_site_tt:0 "A fully held chartered or commandant district has no uprising or active march commitment. A commandant district must have unrest below §Y70§!."
 VAD_city_redoubts_site_tt:0 "A fully held chartered or commandant district has no uprising, contains victory-point provinces, and each has at most §Y8§! land fort levels."
 VAD_district_march_programme:0 "Prepare a march from [FROM.GetName]"
 VAD_district_march_programme_desc:0 "District officials assemble supply columns, release clerks for field headquarters and send military orders to local workshops. The columns approaching the capital must have working institutions behind them."
 VAD_city_redoubts_programme:0 "Fortify the towns of [FROM.GetName]"
 VAD_city_redoubts_programme_desc:0 "Commandants and civic offices compare their town plans. Stone buildings become strongpoints, firing positions cover the approaches, and residents are assigned places in the shelters."
 VAD_district_march_available_tt:0 "The central war against another claimant continues; the selected district can support the march, and no other march plan or district commitment is active."
 VAD_city_redoubts_available_tt:0 "$VAD_final_operations_context_tt$ $VAD_city_redoubts_site_tt$"
 VAD_district_march_unlock_tt:0 "Unlocks district preparations for an offensive: a temporary army plan at the cost of local production and commandant unrest."
 VAD_city_redoubts_unlock_tt:0 "Unlocks construction of two land fort levels in the towns of a selected district."
 VAD_district_march_result_tt:0 "The result starts after preparation is complete. Under a commandant, [FROM.GetName] gains §R+30§! unrest; chartered districts do not incur this penalty. Loss of the district administration ends the plan. The historical district recruitment cohort is not spent."
 VAD_city_redoubts_result_tt:0 "All victory-point provinces in [FROM.GetName] are fortified. The buildings remain after the war and changes of administration."
 VAD_final_operations_cancellation_tt:0 "If conditions are lost before completion, VAD receives a full refund. On country handoff, the unsettled deposit follows the settlement recipient."
 VAD_march_commitment:0 "District march commitment"
 VAD_march_commitment_desc:0 "Workshops supply the columns while district clerks accompany the field headquarters."
 VAD_oath_pending_district_march:0 "March: [?VAD_oath_state.GetName]"
 VAD_oath_pending_city_redoubts:0 "Urban fortifications: [?VAD_oath_state.GetName]"
 VAD_district_march_cost:0 "§Y45§! £political_power_texticon  §Y1000§! £population_texticon  §Y120§! £support_equipment_texticon"
