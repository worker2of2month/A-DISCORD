 ADISCORD_vorkerland_prep_offer_eyr:0 "Eyrmi: civil administration guarantee"
 ADISCORD_vorkerland_prep_offer_eyr_desc:0 "Local councils retain their country and administration after victory. The alliance supplies 13500 £infantry_equipment_texticon.\n\nPayment is taken only after the other country accepts and both parties are rechecked. Refusal is free. Before the split, this binds the district to [ROOT.GetVorkerlandPrepPatron] after independence. Later agreements take effect immediately. Joining another faction or fighting the promised staff prevents entry. The partner's victory guarantees independence."
 ADISCORD_vorkerland_prep_offer_eyr_tt:0 "Local councils retain their country and administration after victory. The alliance supplies 13500 £infantry_equipment_texticon. The government must first consent."
 ADISCORD_vorkerland_preparation.20.eyr.d:0 "[FROM.GetName] offers an alliance on these terms. Local councils retain their country and administration after victory. The alliance supplies 1,500 rifles.\n\n[GetVorkerlandTreatyTiming] Joining another alliance or fighting the promised partner breaks the treaty. They undertake to preserve our country after victory. Payment and delivery occur together on acceptance; if circumstances have changed, the offer can only be closed."
 ADISCORD_vorkerland_prep_cost_35_0_0_100_0_0:0 "§Y35§! £political_power_texticon §Y100§! £support_equipment_texticon"
