 ADISCORD_vorkerland_postwar.24.t:0 "The Right to Record an Objection"
 ADISCORD_vorkerland_postwar.24.d:0 "The secretary paused at the final line. Under the old procedure it would declare unanimous approval. This time a director asked to retain his objection. Worx studied the page, then signed the adjacent box.\n\nFor the institutes it is a small victory: a negative finding can be reported without confessing sabotage. For the doctor it is a reminder that the country he rebuilt can answer back. The board does not yet control guards or funding, but its disagreement now exists on paper."
 ADISCORD_vorkerland_postwar.24.a:0 "Keep it in the minutes."
 ADISCORD_vorkerland_postwar.25.t:0 "The Only Signature"
 ADISCORD_vorkerland_postwar.25.d:0 "The office door no longer lists visiting hours. Institute directors enter when summoned, submit reports and await instructions. Board meetings grow rarer: decisions arrive before sessions begin.\n\nWorx calls it liberation from bureaucracy. On the first day he returns a programme with an instruction to remove approvals and shorten deadlines. His signature is sufficient authority. The executors must explain the consequences themselves."
 ADISCORD_vorkerland_postwar.25.a:0 "Begin immediately."
 ADISCORD_vorkerland_postwar.26.t:0 "Thirty-Five Days"
 ADISCORD_vorkerland_postwar.26.d:0 "The doctor placed two failed reports on the table and declared them part of a conspiracy. Commissioners must restore unified control of the institutes within thirty-five days of sovereign government.\n\nThe board remains in session. Its members gather signatures for a transfer of administration if the ultimatum fails. Worx is certain there is enough time. His executors must still secure funds and complete the operation before the deadline."
 ADISCORD_vorkerland_postwar.26.a:0 "The clock is already running."
 ADISCORD_vorkerland_postwar.27.t:0 "The Institutes Answer"
 ADISCORD_vorkerland_postwar.27.d:0 "The commissioners returned with signed orders and a new chain of command. Directors who refused the doctor's authority have left their offices. Reports arrive on time again.\n\nWorx declares that resistance was foreseen. The emergency directorate retains its scientific capacity, but its calm rests on obedience. His programmes continue, and new demands will follow."
 ADISCORD_vorkerland_postwar.27.a:0 "Continue the work."
 ADISCORD_vorkerland_postwar.28.t:0 "Without His Permission"
 ADISCORD_vorkerland_postwar.28.d:0 "The deadline passed. The head of security handed the keys to the board; orders from the personal office are no longer executed. Worx demands the institute directors attend him. For the first time, nobody comes.\n\nThe doctor formally remains head of state, but administration and compulsory programmes have been taken from him. Broken production chains, accusations and leaderless offices remain. The board has ended personal rule, but rebuilding administration will demand further effort."
 ADISCORD_vorkerland_postwar.28.a:0 "Assume administration."
 ADISCORD_vorkerland_postwar.29.t:0 "The Subject of Research"
 ADISCORD_vorkerland_postwar.29.d:0 "The new state plan has no end date. Worx struck it out himself: correcting humanity cannot depend on a calendar. Institutes receive permanent staffs and departments compulsory participation obligations.\n\nOfficial reports describe the civil war as the final proof of humanity's inadequacy. The doctor promises a society without recurring mistakes. Those who must pay for that promise have no seat at the table."
 ADISCORD_vorkerland_postwar.29.a:0 "Approve without an end date."
 ADISCORD_vorkerland_postwar.30.t:0 "Science After the Doctor"
 ADISCORD_vorkerland_postwar.30.d:0 "The meeting discussed grants, equipment and participants' right to refuse research. Worx attended, asked questions and argued with speakers. His remarks entered the minutes on the same terms as everyone else's.\n\nThe institutes retain their specialists and archives. Personal will no longer replaces board decisions; dependent territories receive civil charters with lighter production obligations. Nobody promises an infallible future. An error can at least be acknowledged."
 ADISCORD_vorkerland_postwar.30.a:0 "Proceed to the next item."
 WRK_worx_government_tt:0 "The sovereign directorate operates under Worx's formal leadership"
 WRK_worx_response_time_tt:0 "More than 14 days remain before the ultimatum expires"

 # Extended postwar directorate
 WRK_worx_extended_normal_tt:0 "The directorate is sovereign and no emergency ultimatum is pending."
 WRK_worx_focus_relief_10_tt:0 "Under Worx's personal rule: madness §G-10§!. Demands do not change."
 WRK_worx_missing_signatures:0 "Absent from the Registers"
 WRK_worx_missing_signatures_desc:0 "The council controls the laboratory, but not its past. The search for the missing begins with orders nobody agreed to sign."
 WRK_worx_open_minutes:0 "Not in the Minutes"
 WRK_worx_open_minutes_desc:0 "Open records let universities verify the directorate's findings. Useful data will be published alongside the names of those responsible."
 WRK_worx_delta_sealed_minutes:0 "Directorate institutional change"
 WRK_worx_sealed_minutes:0 "For Official Use Only"
 WRK_worx_sealed_minutes_desc:0 "The commission retains the archive. Officials return to work knowing their past is in a secure, locked cabinet."
 WRK_worx_public_hearing:0 "The Witness Has a Name"
 WRK_worx_public_hearing_desc:0 "Even a sealed archive cannot erase the right to be heard. The commission will hear people, not excerpts from their medical records."
 WRK_worx_delta_right_of_appeal:0 "Directorate institutional change"
 WRK_worx_right_of_appeal:0 "A Right of Appeal"
 WRK_worx_right_of_appeal_desc:0 "A director's signature can now be challenged. Administration will slow down, but an order will cease to be the final word."
 WRK_worx_delta_constitution_lives:0 "Directorate institutional change"
 WRK_worx_constitution_lives:0 "The Manual Outlives Its Author"
 WRK_worx_constitution_lives_desc:0 "Worx keeps his office and his work. The country gains rules that apply even when the doctor disagrees."
 WRK_worx_delta_temporary_forever:0 "Directorate institutional change"
 WRK_worx_focus_pressure_0_05_tt:0 "Under Worx's personal rule: daily madness growth §R+0.05§!."
 WRK_worx_temporary_forever:0 "Temporary Means Forever"
 WRK_worx_temporary_forever_desc:0 "Emergency powers proved more useful than a constitution. The doctor sees no reason to return them to people who still ask questions."
 WRK_worx_delta_signed_absence:0 "Directorate institutional change"
 WRK_worx_signed_absence:0 "Signatures Are Redundant"
 WRK_worx_signed_absence_desc:0 "The apparatus will execute the doctor's presumed wishes. Responsibility will vanish between an order and its verbal confirmation."
 WRK_worx_delta_one_signature:0 "Directorate institutional change"
 WRK_worx_focus_relief_5_tt:0 "Under Worx's personal rule: madness §G-5§!. Demands do not change."
 WRK_worx_one_signature:0 "One Signature for Everyone"
 WRK_worx_one_signature_desc:0 "No experiment begins without Worx's personal approval. The queue grows, but the doctor feels in control of every detail again."
 WRK_worx_no_exceptions:0 "No Exceptions Provided"
 WRK_worx_no_exceptions_desc:0 "Directives now apply to directors' families as well. Fear of the universal rule replaces loyalty to individual superiors."
 WRK_worx_doctor_remembers:0 "The Doctor Remembers"
 WRK_worx_doctor_remembers_desc:0 "The personal archive brings objections, reports and delays into one index. Every discovered error demands another proof that the doctor was right."
 WRK_worx_delta_world_not_ready:0 "Directorate institutional change"
 WRK_worx_world_not_ready:0 "The World Is Not Ready"
 WRK_worx_world_not_ready_desc:0 "Society failed its encounter with the future. Worx concludes that society must change, not his calculations."
 WRK_worx_laboratory_inventory:0 "A Country Behind the Glass"
 WRK_worx_laboratory_inventory_desc:0 "After the war, institutes exist on paper and equipment is scattered across warehouses. An inventory will return their tools."
 WRK_worx_measuring_silence:0 "Silence Is a Measurement"
 WRK_worx_measuring_silence_desc:0 "The absence of results irritates Worx. New instruments will provide verifiable readings before he demands another experimental series."
 WRK_worx_control_group:0 "The Control Group"
 WRK_worx_control_group_desc:0 "We will examine the existing material first. Reanalysis calms the doctor less than a new experiment, but does not raise his demands."
 WRK_worx_names_obstruct:0 "Names Obstruct Statistics"
 WRK_worx_names_obstruct_desc:0 "Only numbers remain on the cards. Each new series brings results and a brief respite paid for in human lives."
 WRK_worx_delta_duplicate_records:0 "Directorate institutional change"
 WRK_worx_duplicate_records:0 "Check Against the Original"
 WRK_worx_duplicate_records_desc:0 "A copied error cannot support a theory. Laboratory records will be checked before reaching the director's desk."
 WRK_worx_night_shift:0 "Questions Are Easier at Night"
 WRK_worx_night_shift_desc:0 "Night staff receive their own instruments and permission to finish ongoing work. A steady flow of reports briefly relieves Worx's dread of silence."
 WRK_worx_delta_glass_walls:0 "Directorate institutional change"
 WRK_worx_glass_walls:0 "Glass Walls"
 WRK_worx_glass_walls_desc:0 "Adjacent laboratories will see each other's methods. Verification becomes slower and failures harder to hide."
 WRK_worx_black_boxes:0 "Black Boxes"
 WRK_worx_black_boxes_desc:0 "Each team knows only its own task. The doctor alone sees the whole picture, and every discrepancy becomes his private anxiety."
 WRK_worx_comparable_results:0 "All Else Being Equal"
 WRK_worx_comparable_results_desc:0 "Common measurement conditions will compare laboratories instead of their directors' eloquence."
 WRK_worx_focus_relief_15_tt:0 "Under Worx's personal rule: madness §G-15§!. Demands do not change."
 WRK_worx_returned_reports:0 "Return for Revision"
 WRK_worx_returned_reports_desc:0 "A negative result will no longer mean no work was done. The director receives explanations instead of empty columns."
 WRK_worx_new_material:0 "The Material Resists"
 WRK_worx_new_material_desc:0 "Technicians demand that alloys be tested before operators are blamed. They will need dedicated testing rigs."
 WRK_worx_delta_honest_failure:0 "Directorate institutional change"
 WRK_worx_honest_failure:0 "A Negative Result"
 WRK_worx_honest_failure_desc:0 "The shared method permits failure without destroying the logbook. The doctor dislikes it, but reproducible results convince even him."
 WRK_worx_delta_no_final_version:0 "Directorate institutional change"
 WRK_worx_no_final_version:0 "No Final Version"
 WRK_worx_no_final_version_desc:0 "Every model remains open to revision. Science need not end with its director's working day."
 WRK_worx_delta_perfect_specimen:0 "Directorate institutional change"
 WRK_worx_perfect_specimen:0 "The Specimen Is Perfect"
 WRK_worx_perfect_specimen_desc:0 "Worx approves a standard that production must meet. Deviations will be corrected through new trials, never by revising the standard."
 WRK_worx_tomorrow_test:0 "Repeat Tomorrow"
 WRK_worx_tomorrow_test_desc:0 "The laboratory network has methods, staff and a budget. It can now continue without a fresh order every morning."
 WRK_worx_delta_mind_without_sleep:0 "Directorate institutional change"
 WRK_worx_focus_relief_20_tt:0 "Under Worx's personal rule: madness §G-20§!. Demands do not change."
 WRK_worx_mind_without_sleep:0 "Reason Needs No Sleep"
 WRK_worx_mind_without_sleep_desc:0 "Scientific panels will answer the doctor around the clock. It is expensive, but silent laboratories cost the country more."
 WRK_worx_delta_grid_ledger:0 "Directorate institutional change"
 WRK_worx_grid_ledger:0 "The Meter Cannot Lie"
 WRK_worx_grid_ledger_desc:0 "The directorate will compare power consumption with real factory output. Imaginary workshops and their rations will disappear from the accounts."
 WRK_worx_delta_light_for_machines:0 "Directorate institutional change"
 WRK_worx_light_for_machines:0 "The Machines Need the Light"
 WRK_worx_light_for_machines_desc:0 "Priority for laboratories and workshops leaves homes in darkness. The doctor considers this reason enough to demand more results."
 WRK_worx_delta_city_serves_complex:0 "Directorate institutional change"
 WRK_worx_city_serves_complex:0 "The City Serves the Complex"
 WRK_worx_city_serves_complex_desc:0 "Housing and transport become part of production planning. Even the directorate must admit that workers do not materialise beside their machines."
 WRK_worx_serial_numbers:0 "Every Bolt Has a Number"
 WRK_worx_serial_numbers_desc:0 "A common order will connect repair shops with arsenals. A paid batch takes time and tools, then delivers weapons and vehicles."
 WRK_worx_standard_parts:0 "Fits Without Adjustment"
 WRK_worx_standard_parts_desc:0 "Interchangeable parts will end endless workshop adjustments. The promised future depends on this unremarkable work."
 WRK_worx_counted_reserves:0 "In the Depot, Not the Report"
 WRK_worx_counted_reserves_desc:0 "A stock audit will recover equipment lost between departments. Factory invoices will finally meet actual crates."
 WRK_worx_delta_waste_has_value:0 "Directorate institutional change"
 WRK_worx_waste_has_value:0 "Even Scrap Belongs to the State"
 WRK_worx_waste_has_value_desc:0 "Rejected parts will be dismantled and failure reports sent to the laboratory. The doctor will find value in what he wanted destroyed yesterday."
 WRK_worx_tooling_upgrade_tt:0 "Standardised batch orders deliver an additional §G200§! £support_equipment_texticon at the same price and duration."
 WRK_worx_conveyor_memory:0 "The Assembly Line Remembers"
 WRK_worx_conveyor_memory_desc:0 "Repeatable operations will be built into the tooling. Each subsequent batch produces more finished tools from the same input."
 WRK_worx_civilian_batch:0 "First for Those Who Remained"
 WRK_worx_civilian_batch_desc:0 "A civilian factory will serve the domestic market. Its output will restore a purpose to peaceful work."
 WRK_worx_arsenal_batch:0 "Peace Can Wait Its Turn"
 WRK_worx_arsenal_batch_desc:0 "A new arsenal gets premises and staff before civilian enterprises. The western borders will not wait for reconstruction."
 WRK_worx_delivery_schedule:0 "Delivery Is Part of the Product"
 WRK_worx_delivery_schedule_desc:0 "Finished goods receive transport and carriers receive a workable schedule. A product left in the factory yard changes nothing."
 WRK_worx_delta_repair_before_replace:0 "Directorate institutional change"
 WRK_worx_repair_before_replace:0 "Repair Costs Less Than a New World"
 WRK_worx_repair_before_replace_desc:0 "Engineers gain permission to repair old equipment. Not every breakdown requires another design revolution."
 WRK_worx_delta_reserve_capacity:0 "Directorate institutional change"
 WRK_worx_reserve_capacity:0 "A Spare Line"
 WRK_worx_reserve_capacity_desc:0 "Spare tooling keeps a series running when a workshop stops. Some resources must stand idle so the country does not."
 WRK_worx_delta_no_idle_state:0 "Directorate institutional change"
 WRK_worx_no_idle_state:0 "No Downtime Recorded"
 WRK_worx_no_idle_state_desc:0 "The chain from measurement to delivery is complete. Behind the dry report stand people the directorate still prefers not to notice."
 WRK_worx_staff_after_battle:0 "Complete the Form After Battle"
 WRK_worx_staff_after_battle_desc:0 "The staff will distinguish battlefield experience from convenient excuses. Reports must return even when the calculation failed."
 WRK_worx_soldier_returns:0 "The Soldier Must Return"
 WRK_worx_soldier_returns_desc:0 "The medical service will restore wounded soldiers to life, not merely to duty. The doctor considers this a dubious use of laboratory time."
 WRK_worx_return_unplanned:0 "Return Not Provided For"
 WRK_worx_return_unplanned_desc:0 "Assault training becomes another experimental series. The doctor needs results, and the staff must account for people as a consumed resource."
 WRK_worx_lesson_paid:0 "The Lesson Has Been Paid For"
 WRK_worx_lesson_paid_desc:0 "Training experience must be absorbed before the next offensive. Repeating the same mistake does not make it scientific."
 WRK_worx_ambulance_columns:0 "The Road Back"
 WRK_worx_ambulance_columns_desc:0 "Every supply route will have a return journey. Casualties and damaged equipment will no longer depend on incidental transport."
 WRK_worx_calibrated_fire:0 "Correct for a Living Target"
 WRK_worx_calibrated_fire_desc:0 "Artillery crews receive serviceable guns and updated tables. Worx will acknowledge an error when it can be measured."
 WRK_worx_delta_orders_arrive:0 "Directorate institutional change"
 WRK_worx_orders_arrive:0 "The Order Must Arrive"
 WRK_worx_orders_arrive_desc:0 "Signallers will connect headquarters and repair units. The most precise order is useless without someone to receive it."
 WRK_worx_delta_break_model:0 "Directorate institutional change"
 WRK_worx_break_model:0 "Open Along the Incision"
 WRK_worx_break_model_desc:0 "Concentrate forces on one sector. The offensive consumes more supplies but breaks the enemy's model of the battle."
 WRK_worx_delta_patient_front:0 "Directorate institutional change"
 WRK_worx_patient_front:0 "Wait for Their Mistake"
 WRK_worx_patient_front_desc:0 "Mobile reserves and layered defence will force the enemy to abandon its plan first. We will be ready for that mistake."
 WRK_worx_map_survives:0 "The Map Survived the Meeting"
 WRK_worx_map_survives_desc:0 "Commanders receive an agreed procedure. Doctrine will finally describe the available troops instead of an imagined future army."
 WRK_worx_enough_shells:0 "Ammunition for Tomorrow"
 WRK_worx_enough_shells_desc:0 "Set aside weapons to replace losses. An offensive must not end with its first expenditure report."
 WRK_worx_radio_discipline:0 "Only Numbers on the Air"
 WRK_worx_radio_discipline_desc:0 "Standard radio messages reduce delays and errors. The doctor receives continuous data and commanders receive intelligible reports."
 WRK_worx_delta_proof_in_service:0 "Directorate institutional change"
 WRK_worx_proof_in_service:0 "Accepted for Service"
 WRK_worx_proof_in_service_desc:0 "Proven procedures become part of replacement training. New soldiers will not have to pay for every lesson again."
 WRK_worx_delta_war_has_end:0 "Directorate institutional change"
 WRK_worx_war_has_end:0 "War Must Have an End"
 WRK_worx_war_has_end_desc:0 "The staff must finish campaigns, not endlessly confirm the director's calculations. Supply planning will follow attainable war aims."
 WRK_worx_population_is_here:0 "The Population Is Still Here"
 WRK_worx_population_is_here_desc:0 "Cities have returned to the directorate's maps, but their inhabitants have no place in its calculations. Begin by acknowledging their existence."
 WRK_worx_census_without_names:0 "Count Those Who Remain"
 WRK_worx_census_without_names_desc:0 "A postwar census will establish district needs. Worx receives data independent of each local director's mood."
 WRK_worx_compulsory_welfare:0 "Your Wellbeing Is Mandatory"
 WRK_worx_compulsory_welfare_desc:0 "State clinics will treat ordinary illness and the wounds of war. The doctor resents seeing his equipment used for treatment again."
 WRK_worx_complaints_deviations:0 "Complaints and Other Deviations"
 WRK_worx_complaints_deviations_desc:0 "Citizens' complaints become material for behavioural trials. The directorate promises to eliminate the causes of discontent without specifying who it considers a cause."
 WRK_worx_delta_normal_range:0 "Directorate institutional change"
 WRK_worx_normal_range:0 "Within Normal Limits"
 WRK_worx_normal_range_desc:0 "Combined records reveal differences between districts. The argument over acceptable deviations now takes place in tables."
 WRK_worx_school_of_answers:0 "Questions After Class"
 WRK_worx_school_of_answers_desc:0 "Technical schools will admit workers' children. Teachers are instructed to cultivate independent thought according to the approved plan."
 WRK_worx_delta_housing_grid:0 "Directorate institutional change"
 WRK_worx_housing_grid:0 "Keys Will Be Issued by List"
 WRK_worx_housing_grid_desc:0 "Housing will be restored near workplaces. A person deserves an address even if the directorate prefers an employee number."
 WRK_worx_ordinary_day:0 "An Ordinary Working Day"
 WRK_worx_ordinary_day_desc:0 "A predictable routine replaces emergency mobilisation. For people it is a return to life; for the doctor, fewer unknowns."
 WRK_worx_delta_human_face:0 "Directorate institutional change"
 WRK_worx_human_face:0 "A Face on the Identity Card"
 WRK_worx_human_face_desc:0 "Local commissions may consider individual circumstances. The system will retain room for cases that do not fit a column."
 WRK_worx_delta_no_individual:0 "Directorate institutional change"
 WRK_worx_no_individual:0 "A Personal File Instead of a Person"
 WRK_worx_no_individual_desc:0 "A unified index replaces local discretion. Every exception becomes a system error requiring the doctor's intervention."
 WRK_worx_paper_citizens:0 "Paper Will Bear Anything"
 WRK_worx_paper_citizens_desc:0 "District offices receive common forms and compatible archives. Perfect records will not simplify life, but will stop losing people between desks."
 WRK_worx_delta_family_leave:0 "Directorate institutional change"
 WRK_worx_family_leave:0 "Home Before Lights Out"
 WRK_worx_family_leave_desc:0 "Leave and weekends will no longer depend on a superior's personal permission. Rested people return to work without escorts."
 WRK_worx_delta_institutional_childhood:0 "Directorate institutional change"
 WRK_worx_institutional_childhood:0 "The State Will Raise Them"
 WRK_worx_institutional_childhood_desc:0 "Residential training complexes will prepare recruits for the army and industry. Parents will be told that their children's future is too important for private decisions."
 WRK_worx_citizen_by_schedule:0 "A Citizen by Schedule"
 WRK_worx_citizen_by_schedule_desc:0 "Transport connects homes, schools and workplaces. Timetables will finally reflect actual distances rather than planned achievements."
 WRK_worx_delta_permission_to_live:0 "Directorate institutional change"
 WRK_worx_permission_to_live:0 "Permission to Live"
 WRK_worx_permission_to_live_desc:0 "The directorate will approve minimum guarantees of supplies and rest. The document never mentions dignity, but people will feel the consequences."
 WRK_worx_clinic_upgrade_tt:0 "District clinics also return §G400§! £manpower_texticon; registry programmes grant an additional §G10§! £army_experience."
 WRK_worx_safety_confirmed:0 "Safety Confirmed"
 WRK_worx_safety_confirmed_desc:0 "The institutional network can deliver its programmes. Worx will call it proof that he was right, regardless of the country's chosen path."
 WRK_worx_maps_have_weight:0 "The Map Has Weight"
 WRK_worx_maps_have_weight_desc:0 "Western routes will become paid stocks of transport and tools. The directorate must supply its plans at its own expense."
 WRK_worx_help_has_terms:0 "Assistance Has Conditions"
 WRK_worx_help_has_terms_desc:0 "Engineering delegations will prepare common specifications. Every offer of help carries an estimate, not a right to seize another country's stores."
 WRK_worx_delta_border_means_customs:0 "Directorate institutional change"
 WRK_worx_border_means_customs:0 "A Border Means Customs"
 WRK_worx_border_means_customs_desc:0 "Compatible documents simplify trade without abolishing neighbouring governments. Duties and permits remain matters for agreement."
 WRK_worx_border_means_range:0 "A Border Means Range"
 WRK_worx_border_means_range_desc:0 "The staff will translate diplomatic distances into supply requirements. The opponent must know that real guns stand behind the calculations."
 WRK_worx_corridor_upgrade_tt:0 "Corridor depot programmes deliver an additional §G200§! £motorized_texticon at the same price and duration."
 WRK_worx_delta_corridor_dispatch:0 "Directorate institutional change"
 WRK_worx_corridor_dispatch:0 "Delivery to the Border"
 WRK_worx_corridor_dispatch_desc:0 "Align internal transport with western routes. A vehicle reserve will serve agreements and military supply through one proven system."
 WRK_worx_after_final_account:0 "After the Final Reckoning"
 WRK_worx_after_final_account_desc:0 "The western settlement is complete. The directorate must now maintain order where a declaration of victory is not enough."
 WRK_worx_local_signatures:0 "Let Them Sign for Themselves"
 WRK_worx_local_signatures_desc:0 "Civil charters will secure local administration in technical trusteeships. The directorate's obligations become part of the same document."
 WRK_worx_delta_appointed_custodians:0 "Directorate institutional change"
 WRK_worx_appointed_custodians:0 "A Custodian Will Be Appointed"
 WRK_worx_appointed_custodians_desc:0 "Directorate representatives will coordinate trusteeship industry under the existing settlement. A common schedule will bring new disputes."
 WRK_worx_common_gauge:0 "The Same Track Gauge"
 WRK_worx_common_gauge_desc:0 "Common technical standards will connect the western economies to Vorkerland. First, our equipment must reach the new junctions."
 WRK_worx_southern_estimates:0 "The South Exceeds the Estimate"
 WRK_worx_southern_estimates_desc:0 "Ebern and Afrela require separate estimates. A reserve of transport and repair equipment will support the already authorised southern campaigns."
 WRK_worx_delta_distant_service:0 "Directorate institutional change"
 WRK_worx_distant_service:0 "Service Beyond the Warranty"
 WRK_worx_distant_service_desc:0 "Field workshops will operate beyond the familiar supply network. A single broken vehicle must not decide a campaign's length."
 WRK_worx_world_preselected:0 "The World Passed Initial Screening"
 WRK_worx_world_preselected_desc:0 "The directorate will compare treaties, trusteeships and military deliveries. Beyond the laboratory lie variables that cannot simply be deleted."
 WRK_worx_delta_export_method:0 "Directorate institutional change"
 WRK_worx_export_method:0 "Export the Method"
 WRK_worx_export_method_desc:0 "Interstate technical councils will exchange proven solutions. The directorate's influence can grow without another offensive order."
 WRK_worx_delta_export_model:0 "Directorate institutional change"
 WRK_worx_export_model:0 "Export the Specimen"
 WRK_worx_export_model_desc:0 "Worx presents his country as a compulsory model. Every deviation abroad becomes another personal challenge."
 WRK_worx_terms_accepted:0 "Terms Accepted for Execution"
 WRK_worx_terms_accepted_desc:0 "A permanent apparatus will support foreign policy. Its authority remains bounded by concluded agreements and existing campaign plans."
 WRK_worx_delta_end_of_observation:0 "Directorate institutional change"
 WRK_worx_end_of_observation:0 "Observation Continues"
 WRK_worx_end_of_observation_desc:0 "The doctor studies the map as he once studied the laboratory table. The country has grown; the question of who owns its future remains."
