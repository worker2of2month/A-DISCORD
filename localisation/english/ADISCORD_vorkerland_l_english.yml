 ADISCORD_vorkerland_pw_delta_conf_shared_standards:0 "Shared Standards"
 ADISCORD_vorkerland_pw_delta_conf_elected_officers:0 "Elected Officers"
 ADISCORD_vorkerland_pw_delta_conf_people_in_arms:0 "The People in Arms"
 ADISCORD_vorkerland_pw_delta_conf_red_engineers:0 "Red Engineers"
 ADISCORD_vorkerland_pw_delta_conf_army_of_the_republics:0 "Army of the Republics"
 WRK_tech_directorate_plan:0 "It Was Always Coming to This"
 WRK_tech_directorate_plan_desc:0 "Worx sees his calculations vindicated in the ruined capital. His technical reserve waited years for the old order to fail. Victory must now be turned into government."
 WRK_tech_grid_repair_crews:0 "Grid Repair Crews"
 WRK_tech_grid_repair_crews_desc:0 "Electricians restore substations and lines. Without power there are neither factories nor laboratories."
 WRK_tech_district_metrics:0 "From Ashes, by Blueprint"
 WRK_tech_district_metrics_desc:0 "Every ruined district will receive a reconstruction schedule. A blueprint must become a commitment to those who survived the war."
 WRK_tech_automated_workshops:0 "First, Start the Machines"
 WRK_tech_automated_workshops_desc:0 "Industrial sites receive priority supplies. Cities must wait for new production lines to finance their reconstruction."
 WRK_tech_municipal_utilities:0 "First, Restore the Light"
 WRK_tech_municipal_utilities_desc:0 "Housing and public services receive materials before closed institutes. District administrations gain the capacity to act without the doctor's personal commissioners."
 WRK_tech_measured_economy:0 "The Country Works Around the Clock"
 WRK_tech_measured_economy_desc:0 "Continuous work requires a sustainable system. The civilian course provides shifts and repairs; closed complexes obtain more output at the cost of harsher discipline."
 WRK_tech_machine_tool_pool:0 "Nothing Beyond Necessity"
 WRK_tech_machine_tool_pool_desc:0 "Repair crews, arsenals and laboratories need the same machines. The directorate will establish common allocation rules and a programme for testing industrial processes."
 WRK_tech_standardized_arsenals:0 "Standardized Arsenals"
 WRK_tech_standardized_arsenals_desc:0 "Arms works are built to one design and produce the same models. The army receives predictable supply."
 WRK_tech_national_laboratories:0 "National Laboratories"
 WRK_tech_national_laboratories_desc:0 "The directorate opens a network of laboratories working on state tasks rather than departmental interests."
 WRK_tech_specialist_schools:0 "Specialist Schools"
 WRK_tech_specialist_schools_desc:0 "Technical schools train operators, signallers and fitters for the new factories and for the army."
 WRK_tech_engineering_corps:0 "War Can Be Calculated"
 WRK_tech_engineering_corps_desc:0 "Logistics and engineering give headquarters reliable figures. New methods must still be tested on an active front."
 WRK_tech_mechanized_staff:0 "Amendments Written in Blood"
 WRK_tech_mechanized_staff_desc:0 "Regimental reports force revisions to elegant calculations. Viktor Hess will turn them into practical manuals and make the institutes answer the front's questions."
 WRK_tech_measured_front:0 "The Machine Will Shield the Soldier"
 WRK_tech_measured_front_desc:0 "A trained soldier is difficult to replace. Repair services and motorised reserves will support the army; trial teams must preserve their personnel and equipment."
 WRK_tech_fire_superiority:0 "Losses Fit the Model"
 WRK_tech_fire_superiority_desc:0 "Headquarters may expend reserves to test its calculations. Rapid findings cost lives, and replacement requests already accompany the first offensive model."
 WRK_tech_command_calculus:0 "Proven in Practice"
 WRK_tech_command_calculus_desc:0 "The adopted methods have passed field trials. Doctrine will record their limits as well as their strengths: no successful experiment removes the need for supplies."
 WRK_tech_supply_contracts:0 "They Will Open the Doors Themselves"
 WRK_tech_supply_contracts_desc:0 "Machine tools and repair crews can persuade where threats fail. Neighbours retain the right to refuse treaties; accepted obligations will anchor our presence."
 WRK_tech_technical_assistance:0 "Resistance Is Accounted For"
 WRK_tech_technical_assistance_desc:0 "The doctor treats refusal to cooperate as a defect in local government. Engineering teams prepare the corridor for troops if the western crisis ends in war."
 WRK_tech_southern_programme:0 "The Next Item on the Agenda"
 WRK_tech_southern_programme_desc:0 "Ebern and Afrela remain separate questions. The directorate opens southern campaign preparations without conflating them with the western settlement."
