 ADISCORD_vorkerland_postwar.60.t:0 "The Generals' Plot"
 ADISCORD_vorkerland_postwar.60.d:0 "[GetVorkerlandEmpireConspiracyDesc]"
 ADISCORD_vorkerland_postwar.60.d_faded:0 "The security service reports meetings of discontented officers, but the plotters' moment has passed. The court has regained its influence, and generals who demanded guarantees for the army a month ago now swear loyalty to the chairman. The lists go to the archive."
 ADISCORD_vorkerland_postwar.60.a:0 "Arrest the plotters."
 ADISCORD_vorkerland_postwar.60.b:0 "Give the generals seats in the council."
 ADISCORD_vorkerland_postwar.60.c:0 "Keep the lists for later."
 ADISCORD_vorkerland_postwar.61.t_empire:0 "Vorkerland Becomes the Veyran Empire"
 ADISCORD_vorkerland_postwar.61.d_empire:0 "[WRK.GetVorkerlandEmpireWesternVictoryDesc]"
 ADISCORD_vorkerland_postwar.61.t_worker:0 "The Union of Western and Eastern Republics Is Born"
 ADISCORD_vorkerland_postwar.61.d_worker:0 "The victory over Itora changed the map, and the congress decided to change the country's name. Vorkerland was the name of a besieged republic that barely survived the collapse. Now the western republics enter the common house, and the delegates voted for the Union of Western and Eastern Republics. The new constitution gives every republic its own council and binds the union to defend them with a common army.\n\nSceptics recall that the western councils appeared under the protection of a victorious army. Supporters answer that for the first time in a generation West and East live by one law rather than by the right of the strong."
 ADISCORD_vorkerland_postwar.61.t_technical:0 "Vorkerland Becomes the Technical Union of Forul"
 ADISCORD_vorkerland_postwar.61.d_technical:0 "The directorate ended the western campaign as it had waged it: by calculation. The engineering councils concluded that the name Vorkerland described only one country among many joined by common roads, power grids and workshops. The new state is named the Technical Union of Forul, after the whole region rather than one capital. Former districts and former enemies enter it as nodes of one system run by specialists.\n\nIn the western cities the new arms are met with reserve. The administration promises electricity, repairs and supply, but does not ask whether the inhabitants wish to become part of someone else's calculation."
 ADISCORD_vorkerland_postwar.61.a:0 "A new name for a new age."

# Worker confederation and technical directorate trees
 WRK_worker_west_mandate_offices: "Constitutional Bureaus of the West"
 WRK_worker_west_mandate_offices_desc: "The congress opens bureaus that explain to the people of Itora and Rimat what a place in the common house means."
 WRK_worker_west_solidarity_committees: "Solidarity Committees"
 WRK_worker_west_solidarity_committees_desc: "Workers' committees are ready to carry the confederate mandate where its deputies never reached."
 WRK_worker_west_mandate_for_itora: "A Mandate for Itora"
 WRK_worker_west_mandate_for_itora_desc: "The confederation offers Itora a place in the common house. Refusal will mean war."
 WRK_worker_west_confederate_charter: "Charter of the Western Republics"
 WRK_worker_west_confederate_charter_desc: "The new confederate republics receive a charter defining their place in the common house."
 WRK_utilitarian_west_corridor_survey:0 "Beyond the Laboratory"
 WRK_utilitarian_west_corridor_survey_desc:0 "Western roads and power grids cross our borders. The directorate must decide what neighbours will pay to join its projects."
 WRK_utilitarian_west_engineer_battalions:0 "Blueprints of the Future Border"
 WRK_utilitarian_west_engineer_battalions_desc:0 "Bridges, depots and repair stations must withstand the western crisis. Whatever our course, the army needs a prepared rear."
 WRK_utilitarian_west_engineering_border:0 "Present the Final Calculation"
 WRK_utilitarian_west_engineering_border_desc:0 "Military plans are ready. The directorate may begin the western campaign after the reconstruction period. An existing war needs no second declaration."
 WRK_utilitarian_west_technical_trusteeship:0 "Sovereignty Is Obsolete"
 WRK_utilitarian_west_technical_trusteeship_desc:0 "After victory, borders no longer shield defeated economies from the directorate. Technical administrations bind their production to our plan."
 WRK_worker_west_war_tt: "The §Ywar for the West§! against Itora begins. On victory Itora and its allies become confederate republics."
 WRK_utilitarian_west_war_tt: "The §Ywar for the West§! against Itora begins. On victory its frontier passes to Vorkerland and Itora falls under technical trusteeship."
 ADISCORD_vorkerland_worker_confederation_focus:0 "Confederation of Republics"
 ADISCORD_vorkerland_technical_directorate_focus:0 "Technical Directorate"
 WRK_route_influence_power_5_tt:0 "Our influence in the West: §Y+5§!."
 WRK_route_rebuild_slot_tt:0 "§Y1§! more §YDistrict Reconstruction§! programme may run at the same time."
 WRK_route_all_west_5_tt:0 "The lean of every western state toward Vorkerland grows by §Y5§!."
 WRK_conf_solidarity_abroad_tt:0 "The lean of [WPA.GetName] and [WPS.GetName] toward Vorkerland grows by §Y15§!, that of [ROM.GetName] and [TRU.GetName] by §Y10§!."
 WRK_tech_supply_contracts_tt:0 "The lean of [WPS.GetName] and [PWR.GetName] toward Vorkerland grows by §Y20§!, that of [PSD.GetName] and [ZAO.GetName] by §Y10§!."
 WRK_conf_council_of_republics:0 "Council of Republics"
 WRK_conf_council_of_republics_desc:0 "The Unity Tower stands over the capital again, but the country is run by a council of delegates from every republic. The confederation begins by sharing duties, not spoils."
 WRK_conf_veteran_resettlement:0 "Veteran Resettlement"
 WRK_conf_veteran_resettlement_desc:0 "Demobilized soldiers receive homes in the ruined districts and remain in the reserve of their republics."
 WRK_conf_cooperative_workshops:0 "Cooperative Workshops"
 WRK_conf_cooperative_workshops_desc:0 "Artels and workers' councils rebuild the workshops with their own shares. The council of republics takes over the reconstruction of ruined districts."
 WRK_conf_workers_housing:0 "Workers' Housing"
 WRK_conf_workers_housing_desc:0 "People first, factories second. New quarters bring families back to the cities, and repair crews gain permanent workers."
 WRK_conf_municipal_councils:0 "Rights of the Municipal Councils"
 WRK_conf_municipal_councils_desc:0 "The cities manage their own construction and contracts. Reconstruction moves faster where decisions are made on the spot."
 WRK_conf_social_guarantees:0 "Social Guarantees"
 WRK_conf_social_guarantees_desc:0 "Pensions, insurance and hospitals are written into the compact of the republics. Workers know what they work for and what they will fight for."
 WRK_conf_production_councils:0 "Production Councils"
 WRK_conf_production_councils_desc:0 "Every factory is run by a council of workers and engineers. The plan is drawn up from below but carried out to a common schedule."
 WRK_conf_republican_arsenals:0 "Arsenals of the Republics"
 WRK_conf_republican_arsenals_desc:0 "The republics build arms works together. Each receives a share of the orders and a share of responsibility for defence."
 WRK_conf_shared_standards:0 "Shared Standards"
 WRK_conf_shared_standards_desc:0 "Parts from one district fit the machines of another. The confederation produces more when it speaks one technical language."
 WRK_conf_research_soviets:0 "Research Soviets"
 WRK_conf_research_soviets_desc:0 "Universities and factory laboratories unite in a network of councils open to every republic."
 WRK_conf_republican_militias:0 "Militias of the Republics"
 WRK_conf_republican_militias_desc:0 "Every republic raises its own militia. The council gives them weapons, and they give the confederation soldiers."
 WRK_conf_elected_officers:0 "Elected Officers"
 WRK_conf_elected_officers_desc:0 "Commanders are elected by their soldiers and confirmed by the council. The army rests on trust, not fear."
 WRK_conf_people_in_arms:0 "The People in Arms"
 WRK_conf_people_in_arms_desc:0 "The whole confederation becomes a reserve. Every district trains people who will defend their land to the last."
 WRK_conf_red_engineers:0 "Red Engineers"
 WRK_conf_red_engineers_desc:0 "Skilled workers form engineer shock units: bridges, artillery and signals move ahead of the infantry."
 WRK_conf_army_of_the_republics:0 "Army of the Republics"
 WRK_conf_army_of_the_republics_desc:0 "Militias and regular units unite under a common staff. The confederation is ready to defend every republic as its own."
 WRK_conf_solidarity_abroad:0 "Solidarity Abroad"
 WRK_conf_solidarity_abroad_desc:0 "The workers' committees of Norven, Holden, Frealor and Zolotorevsk receive the confederation's support. Their voice will be heard in their own capitals."
 WRK_conf_charter_for_the_west:0 "Charter for the West"
 WRK_conf_charter_for_the_west_desc:0 "The council publishes a charter promising every western state a place in the common house and a vote within it."
 WRK_conf_southern_solidarity:0 "Solidarity with the South"
 WRK_conf_southern_solidarity_desc:0 "Ebern and Afrela remain outside the confederation. The council is ready to arm their workers if their governments refuse to listen."
 ADISCORD_vorkerland_pw_delta_conf_workers_housing:0 "Workers' Housing"
 ADISCORD_vorkerland_pw_delta_conf_municipal_councils:0 "Rights of the Municipal Councils"
