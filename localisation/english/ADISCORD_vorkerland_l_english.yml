 # --- Worx postwar directorate ---
 WRK_worx_opening_tt:0 "Madness §G-15§!."
 WRK_worx_cabinet_tt:0 "Daily madness growth becomes §Y0.35§!."
 WRK_worx_last_provisional:0 "The Last Provisional Government"
 WRK_worx_last_provisional_desc:0 "Provisional cabinets have survived too many permanent disasters. A directorate will divide administrative work between institutes and protect the doctor's research time."
 WRK_worx_operating_table:0 "A Country on the Operating Table"
 WRK_worx_operating_table_desc:0 "Ruined cities, exhausted soldiers and silent workshops become chapters in a single plan. The doctor requests authority to treat the entire country. The limits remain undefined."
 WRK_worx_council_course_tt:0 "Madness growth: §Y0.25§! per day. Demands rise after §Y5§! results. Independent reviews require no forced experiments."
 WRK_worx_right_to_error:0 "The Right to Be Wrong"
 WRK_worx_right_to_error_desc:0 "A failed experiment must lead to a revised hypothesis. The board will preserve negative findings and let institute directors halt a programme."
 WRK_worx_personal_course_tt:0 "Madness growth: §Y0.5§! per day. Demands rise after §Y2§! results. Accelerated trials take 7 days."
 WRK_worx_genius_permission:0 "Genius Needs No Permission"
 WRK_worx_genius_permission_desc:0 "Official signatures do not bring discovery closer. Worx may bypass collective decisions, and directors answer personally for every delay."
 WRK_worx_safeguards_tt:0 "Crises cost 5% stability and 50 £political_power_texticon, then reduce madness to 60."
 WRK_worx_dissenting_protocol:0 "A Dissenting Opinion"
 WRK_worx_dissenting_protocol_desc:0 "For the first time, minutes will retain objections the doctor wanted erased. The board can suspend orders before they paralyse an entire department."
 WRK_worx_delta_second_signature:0 "Change to directorate powers"
 WRK_worx_second_signature:0 "The Second Director's Signature"
 WRK_worx_second_signature_desc:0 "Laboratory orders will require an independent director's signature. The scientific board receives its own inspectors and can protect researchers from arbitrary punishment."
 WRK_worx_time_is_up:0 "Doctor, Your Time Is Up"
 WRK_worx_time_is_up_desc:0 "The directors are ready to take collective control. Archives, security and funding must still be transferred. Until then, Worx's signature opens every door."
 WRK_worx_relief_tt:0 "Completed basic trials remove §G30§! madness; expanded trials remove §G60§!. Demands still rise."
 WRK_worx_ethics_lags:0 "Ethics Lags Behind Progress"
 WRK_worx_ethics_lags_desc:0 "The doctor declares old restrictions a relic of a dead society. New protocols give him more data and leave their subjects fewer ways to refuse."
 WRK_worx_delta_consent:0 "Change to directorate powers"
 WRK_worx_consent_not_required:0 "Consent Is Not Required"
 WRK_worx_consent_not_required_desc:0 "Departments receive compulsory participation quotas. Recruitment no longer depends on local officials, and laboratories gain uninterrupted supplies. Subjects' families bear the cost."
 WRK_worx_delta_human_variable:0 "Change to directorate powers"
 WRK_worx_human_variable:0 "The Human Variable"
 WRK_worx_human_variable_desc:0 "Industry and the army gain direct access to institute results. Names disappear from reports: a variable is easier to transfer between tables."
 WRK_worx_delta_humanity:0 "Change to directorate powers"
 WRK_worx_correct_humanity:0 "Humanity Must Be Corrected"
 WRK_worx_correct_humanity_desc:0 "Worx no longer promises to restore people's former lives. Humanity itself is declared the cause of recurring disasters. The state receives a permanent mandate to correct its citizens."
 WRK_worx_delta_protocol:0 "Change to directorate powers"
 WRK_worx_even_genius:0 "Even Genius Answers to Protocol"
 WRK_worx_even_genius_desc:0 "Research institutes no longer belong to one man. Worx retains his formal office, while funding, appointments and participants' rights are protected by the board."
 WRK_worx_emergency_tt:0 "A struggle for the institutes begins: §Y35 days§! of sovereign rule. Complete Restore Obedience before the deadline or the board will seize administration."
 WRK_worx_foresaw_everything:0 "I Foresaw Everything"
 WRK_worx_foresaw_everything_desc:0 "Repeated breakdowns are declared deliberate sabotage. Worx demands emergency powers and promises to restore control within a month. The board prepares its response."
 WRK_worx_delta_reconstruction:0 "Change to postwar institutions"
 WRK_worx_delta_utilities:0 "Change to postwar institutions"
 WRK_worx_delta_workshops:0 "Change to postwar institutions"
 WRK_worx_delta_shifts:0 "Change to postwar institutions"
 WRK_worx_delta_continuous:0 "Change to directorate powers"
 WRK_worx_delta_shield:0 "Change to postwar institutions"
 WRK_worx_delta_losses:0 "Change to postwar institutions"
 WRK_worx_delta_proven:0 "Change to postwar institutions"
 WRK_worx_delta_corridor:0 "Change to postwar institutions"
 WRK_worx_delta_trusteeship:0 "Change to directorate powers"
 WRK_worx_subject_terms_tt:0 "Technical subjects receive civil charters: civilian and military factory contributions fall from 25% to 10%. Future subjects receive the same terms."
 WRK_worx_accepted_order:0 "An Order Worth Accepting"
 WRK_worx_accepted_order_desc:0 "Victory need not turn every neighbour into a closed institute. The directorate limits its powers and leaves local councils more production and autonomy."
 WRK_worx_review:0 "Independent Review"
 WRK_worx_review_desc:0 "The board presents reproducible findings and challenges failed hypotheses. No forced trials are conducted, and demands do not rise.\n\nDuration: 21 days. Pay at launch; receive results on completion. Cancellation refunds payment and reserved materials."
 WRK_worx_review_result_tt:0 "After 21 days: madness §G-15§!, no increase in demands."
 WRK_worx_review_price:0 "§Y50§! £political_power_texticon"
 WRK_worx_review_price_blocked:0 "§R50§! £political_power_texticon"
 WRK_worx_review_price_tooltip:0 "§Y50§! £political_power_texticon"
 WRK_worx_accelerated:0 "Trials Without Approval"
 WRK_worx_accelerated_desc:0 "The doctor bypasses review and personally approves a compulsory programme. A rapid report calms him without stopping escalating demands.\n\nDuration: 7 days. Pay at launch; receive results on completion. Cancellation refunds payment and reserved materials."
 WRK_worx_accelerated_result_tt:0 "After 7 days: madness §G-25§!, §G10§! £army_experience, stability §R-2%§!, one result."
 WRK_worx_accelerated_price:0 "§Y125§! £political_power_texticon"
 WRK_worx_accelerated_price_blocked:0 "§R125§! £political_power_texticon"
 WRK_worx_accelerated_price_tooltip:0 "§Y125§! £political_power_texticon"
 WRK_worx_field_trials:0 "Test the Calculations at the Front"
 WRK_worx_field_trials_desc:0 "An engineering team tests supply and command methods on an active front. Reserved equipment is consumed. Peace before completion cancels the programme.\n\nDuration: 21 days. Pay at launch; receive results on completion. Cancellation refunds payment and reserved materials."
 WRK_worx_field_trials_result_tt:0 "After 21 days at war: §G25§! £army_experience, a 50% doctrine bonus and a field result for Proven in Practice. Consumes 100 £support_equipment_texticon."
 WRK_worx_field_trials_price:0 "§Y75§! £political_power_texticon 100 £support_equipment_texticon"
 WRK_worx_field_trials_price_blocked:0 "§R75§! £political_power_texticon 100 £support_equipment_texticon"
 WRK_worx_field_trials_price_tooltip:0 "§Y75§! £political_power_texticon 100 £support_equipment_texticon"
 WRK_worx_mass_trials:0 "Test Acceptable Losses"
 WRK_worx_mass_trials_desc:0 "Headquarters assigns personnel to accelerated field testing. Completed trials permanently consume the reserve; cancellation returns it in full.\n\nDuration: 7 days. Pay at launch; receive results on completion. Cancellation refunds payment and reserved materials."
 WRK_worx_mass_trials_result_tt:0 "After 7 days at war: §G15§! £army_experience, one field result, stability §R-1%§!. Consumes 1000 £population_texticon."
 WRK_worx_mass_trials_price:0 "§Y50§! £political_power_texticon 1000 £population_texticon"
 WRK_worx_mass_trials_price_blocked:0 "§R50§! £political_power_texticon 1000 £population_texticon"
 WRK_worx_mass_trials_price_tooltip:0 "§Y50§! £political_power_texticon 1000 £population_texticon"
 WRK_worx_industrial:0 "Test the Production Cycle"
 WRK_worx_industrial_desc:0 "Institutes test an industrial process. The Human Variable adds forced research under personal rule; board oversight ends that practice.\n\nDuration: 28 days. Pay at launch; receive results on completion. Cancellation refunds payment and reserved materials."
 WRK_worx_industrial_result_tt:0 "After 28 days: a 50% industry bonus. Personal rule with The Human Variable also gives madness §G-35§!, stability §R-2%§! and one result."
 WRK_worx_industrial_price:0 "§Y100§! £political_power_texticon"
 WRK_worx_industrial_price_blocked:0 "§R100§! £political_power_texticon"
 WRK_worx_industrial_price_tooltip:0 "§Y100§! £political_power_texticon"
 WRK_worx_civil_science:0 "Open Research Competition"
 WRK_worx_civil_science_desc:0 "The board distributes research grants. Independent review takes time but requires no coercion and does not restore the doctor's personal programmes.\n\nDuration: 35 days. Pay at launch; receive results on completion. Cancellation refunds payment and reserved materials."
 WRK_worx_civil_science_result_tt:0 "After 35 days: one 50% electronics research bonus."
 WRK_worx_civil_science_price:0 "§Y75§! £political_power_texticon"
 WRK_worx_civil_science_price_blocked:0 "§R75§! £political_power_texticon"
 WRK_worx_civil_science_price_tooltip:0 "§Y75§! £political_power_texticon"
 WRK_worx_grand_programme:0 "National Correction Programme"
 WRK_worx_grand_programme_desc:0 "A permanent institute apparatus conducts a large compulsory programme. Administrative costs fall, while society continues paying for the doctor's results.\n\nDuration: 28 days. Pay at launch; receive results on completion. Cancellation refunds payment and reserved materials."
 WRK_worx_grand_programme_result_tt:0 "After 28 days: madness §G-50§!, a 75% industry bonus, stability §R-3%§! and one result."
 WRK_worx_grand_programme_price:0 "§Y75§! £political_power_texticon"
 WRK_worx_grand_programme_price_blocked:0 "§R75§! £political_power_texticon"
 WRK_worx_grand_programme_price_tooltip:0 "§Y75§! £political_power_texticon"
 WRK_worx_restore_obedience:0 "Restore Obedience"
 WRK_worx_restore_obedience_desc:0 "The doctor sends emergency commissioners into the institutes. The programme must finish before the ultimatum expires. An open event does not stop time; loss of sovereignty pauses the countdown and refunds payment.\n\nDuration: 14 days. Pay at launch; receive results on completion. Cancellation refunds payment and reserved materials."
 WRK_worx_restore_obedience_result_tt:0 "After 14 days, while the ultimatum is active: madness becomes 30, stability §R-10%§!, research §G+10%§!, military output §G+5%§!. Personal rule and madness growth continue."
 WRK_worx_restore_obedience_price:0 "§Y200§! £political_power_texticon"
 WRK_worx_restore_obedience_price_blocked:0 "§R200§! £political_power_texticon"
 WRK_worx_restore_obedience_price_tooltip:0 "§Y200§! £political_power_texticon"
