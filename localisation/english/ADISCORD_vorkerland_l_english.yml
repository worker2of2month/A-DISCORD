 RUS_bunker_upgrade_1:0 "Upgrade Level 1"
 RUS_bunker_upgrade_1_desc:0 "The existing room receives a second round of equipment. The purpose of the level remains unchanged.\n\nGuard: an additional +1.5% organisation and -1.5% training time. Shelters: an additional +2% stability.\nDuration: 21 days.\n$RUS_bunker_contract_tt$"
 RUS_bunker_upgrade_1_requirements_tt:0 "Level 1 is fitted and has not yet been upgraded. Available power: 0.\nGuard: an additional +1.5% organisation and -1.5% training time. Shelters: an additional +2% stability."
 RUS_bunker_upgrade_2:0 "Upgrade Level 2"
 RUS_bunker_upgrade_2_desc:0 "The existing room receives a second round of equipment. The purpose of the level remains unchanged.\n\nWater purification: an additional -2% attrition. Communications hub: an additional +4% planning speed.\nDuration: 21 days.\n$RUS_bunker_contract_tt$"
 RUS_bunker_upgrade_2_requirements_tt:0 "Level 2 is fitted and has not yet been upgraded. Available power: 0.\nWater purification: an additional -2% attrition. Communications hub: an additional +4% planning speed."
 RUS_bunker_upgrade_3:0 "Upgrade Level 3"
 RUS_bunker_upgrade_3_desc:0 "The existing room receives a second round of equipment. The purpose of the level remains unchanged.\n\nWorkshops: an additional +3% factory output. Granaries: an additional -1.25% consumer goods and +2 food per week. Uses 1 additional power.\nDuration: 21 days.\n$RUS_bunker_contract_tt$"
 RUS_bunker_upgrade_3_requirements_tt:0 "Level 3 is fitted and has not yet been upgraded. Available power: 1.\nWorkshops: an additional +3% factory output. Granaries: an additional -1.25% consumer goods and +2 food per week. Uses 1 additional power."
 RUS_bunker_upgrade_4:0 "Upgrade Level 4"
 RUS_bunker_upgrade_4_desc:0 "The existing room receives a second round of equipment. The purpose of the level remains unchanged.\n\nClinic: an additional +2% casualty trickleback. Laboratory: an additional +2% research speed. Uses 1 additional power.\nDuration: 21 days.\n$RUS_bunker_contract_tt$"
 RUS_bunker_upgrade_4_requirements_tt:0 "Level 4 is fitted and has not yet been upgraded. Available power: 1.\nClinic: an additional +2% casualty trickleback. Laboratory: an additional +2% research speed. Uses 1 additional power."
 RUS_bunker_upgrade_5:0 "Upgrade Level 5"
 RUS_bunker_upgrade_5_desc:0 "The existing room receives a second round of equipment. The purpose of the level remains unchanged.\n\nArchive: an additional +0.075 political power per day. Command hall: an additional +2% max planning and +1.5% army defence.\nDuration: 21 days.\n$RUS_bunker_contract_tt$"
 RUS_bunker_upgrade_5_requirements_tt:0 "Level 5 is fitted and has not yet been upgraded. Available power: 0.\nArchive: an additional +0.075 political power per day. Command hall: an additional +2% max planning and +1.5% army defence."
