 WKR_utilitarism_party_long: "Vorkerland Normative Reconstruction Directorate"
 WKR_Emergency_Coordination_Committee: "Emergency Coordination Committee"
 ADISCORD_vorkerland_phase.1.t: "Choose the Claimant"
 ADISCORD_vorkerland_phase.1.d: "The Republic is about to fracture. Normally this choice changes only the country controlled by the player; Worker's fate and the wars are decided independently. If Worker and Vadl have both ratified their emergency compact, however, its joint command is binding."
 ADISCORD_vorkerland_phase.1.a: "Control Worker's emergency committees."
 ADISCORD_vorkerland_phase.1.b: "Control Vlad and Armi's coalition."
 ADISCORD_vorkerland_phase.1.c: "Control Dorian Worx's technical administration."
 ADISCORD_vorkerland_phase.1.e: "Honour the Worker-Vadl emergency compact."

# --- rom_tru_l_english ---
 ADISCORD_vorkerland_rom_tru_category:0 "Southern Republics in Flames"

 ADISCORD_vorkerland_rom_desert_eagle_staff:0 "Desert Eagle Staff"
 ADISCORD_vorkerland_rom_desert_eagle_staff_desc:0 "Romanovsky gathered around the Frealor staff officers from the old confederation, signallers, and valley guides. They are few, but orders reach the companies faster than supply lines fall apart."
 ADISCORD_vorkerland_rom_valley_columns:0 "Valley Columns"
 ADISCORD_vorkerland_rom_valley_columns_desc:0 "Composite detachments of Frealor received a unified offensive schedule, field workshops, and the right to requisition transport without delay."
 ADISCORD_vorkerland_rom_stalled_offensive:0 "Stalled Offensive"
 ADISCORD_vorkerland_rom_stalled_offensive_desc:0 "The staff promised a swift operation, but the valleys swallowed men and supplies. Distrust of new orders is growing in the ranks."
 ADISCORD_vorkerland_rom_valley_compact:0 "Frealor Valley Compact"
 ADISCORD_vorkerland_rom_valley_compact_desc:0 "Military and valley councils formalised the division of authority: the staff is responsible for defence, the communities for supply and restoring the economy."

 ADISCORD_vorkerland_tru_emergency_river_council:0 "Emergency River Council"
 ADISCORD_vorkerland_tru_emergency_river_council_desc:0 "Zlatorech factories, river guilds, and Truman's staff were brought together into a single mobilisation council. Every bridge, warehouse, and foundry now operates on a front-line schedule."
 ADISCORD_vorkerland_tru_crossing_columns:0 "River Crossing Columns"
 ADISCORD_vorkerland_tru_crossing_columns_desc:0 "Mobile groups have pre-distributed pontoon bridges, repair teams, and reserves among the key crossings."
 ADISCORD_vorkerland_tru_stalled_offensive:0 "Disrupted River Schedule"
 ADISCORD_vorkerland_tru_stalled_offensive_desc:0 "The promised swift defeat of the provisional administration did not materialise. The factories demand a new plan, and the units are losing faith in the staff's schedules."
 ADISCORD_vorkerland_tru_river_congress:0 "Zlatorech Congress"
 ADISCORD_vorkerland_tru_river_congress_desc:0 "Representatives of cities, factories, and front-line units turned emergency mobilisation into a durable republican order."

 ADISCORD_vorkerland_rom_assemble_valley_columns:0 "Assemble Valley Columns"
 ADISCORD_vorkerland_rom_assemble_valley_columns_desc:0 "In twenty-one days the staff will combine scattered reserves into another line brigade and prepare a brief offensive window."
 ADISCORD_vorkerland_rom_break_valley_administration:0 "Break the Valley Administration"
 ADISCORD_vorkerland_rom_break_valley_administration_desc:0 "Frealor has 180 days to eliminate the Valley Administration. Victory will strengthen the republic; a protracted war will undermine trust in the staff."
 ADISCORD_vorkerland_rom_charter_valley_councils:0 "Ratify the Valley Councils Charter"
 ADISCORD_vorkerland_rom_charter_valley_councils_desc:0 "After victory it is necessary to reach agreement with the returned communities before military administration becomes a new occupation authority."

 ADISCORD_vorkerland_tru_arm_river_battalions:0 "Arm the River Battalions"
 ADISCORD_vorkerland_tru_arm_river_battalions_desc:0 "Civilian guilds will transfer men, transport, and repair kits to the army, and the factories will assemble an additional line brigade."
 ADISCORD_vorkerland_tru_break_zlatorech_administration:0 "Crush the Provisional Administration"
 ADISCORD_vorkerland_tru_break_zlatorech_administration_desc:0 "Within 150 days Zlatorech must retake the western bank. Otherwise the emergency council will lose its right to dictate the republic's front-line rhythm."
 ADISCORD_vorkerland_tru_convene_river_congress:0 "Convene the Zlatorech Congress"
 ADISCORD_vorkerland_tru_convene_river_congress_desc:0 "Victory allows temporary orders to be replaced by an agreement among cities, factories, and front-line units on the republic's future."

 ADISCORD_vorkerland_rom_tru.1.t:0 "The Desert Eagle Shows Its Hand"
 ADISCORD_vorkerland_rom_tru.1.d:0 "The Valley Administration rejected Frealor's orders and closed the roads south. Erwin von Romanovsky declared that the republic would not survive another partition: the staff is gathering old officers, local councils are opening warehouses, and columns are moving toward the passes. The war must be short — otherwise that very staff will become a new burden for Frealor."
 ADISCORD_vorkerland_rom_tru.1.a:0 "Concentrate the columns into a single fist."
 ADISCORD_vorkerland_rom_tru.2.t:0 "The River Will No Longer Divide the Republic"
 ADISCORD_vorkerland_rom_tru.2.d:0 "The provisional administration entrenched itself on the western bank and declared itself the sole lawful authority of Zlatorech. Nikita Truman convened the factory directors, commanders, and representatives of the river guilds. Their emergency council is putting crossings and foundries on a wartime schedule — with a promise to return authority to the citizens after victory."
 ADISCORD_vorkerland_rom_tru.2.a:0 "Launch the river mobilisation plan."

# --- stalemate_l_english ---
 ADISCORD_vorkerland_ai_breakthrough_window:0 "Emergency Operational Window"
 ADISCORD_vorkerland_ai_breakthrough_window_desc:0 "For seventy-five days, exhausted attacking staffs receive strict rail priorities, mobile repair crews, and authority to force a decision on the surviving front."

# --- story_l_english ---
 ADISCORD_vorkerland_story.1.t: "The Claimants Go to War"
 ADISCORD_vorkerland_story.1.d: "The last emergency channels between Vorkerland's surviving central governments have gone silent. The remaining claimants now recognize one another as enemies. Verified fighting links every required claimant front; the struggle for the centre has begun."
 ADISCORD_vorkerland_story.1.a: "The centre will decide the republic's fate."
 ADISCORD_vorkerland_story.2.t: "Grand Vorkernsberg Falls"
 ADISCORD_vorkerland_story.2.d: "Forces credited to [ROOT.GetNameDef] have broken into Grand Vorkernsberg and displaced the worker claimant's central command. The emergency committees have not yet surrendered, but the loss of the old capital has shaken their authority across the front."
 ADISCORD_vorkerland_story.2.a: "The old centre has changed hands."
 ADISCORD_vorkerland_story.3.t: "Isaiah Falls"
 ADISCORD_vorkerland_story.3.d: "Forces credited to [ROOT.GetNameDef] now control Isaiah, the seat of Vlad's wartime coalition. Its surviving ministries are withdrawing under fire while rival broadcasts declare the western command broken."
 ADISCORD_vorkerland_story.3.a: "The coalition has lost its capital."
 ADISCORD_vorkerland_story.4.t: "Northwerk Falls"
 ADISCORD_vorkerland_story.4.d: "Forces credited to [ROOT.GetNameDef] have seized Northwerk and its command exchanges. Doctor Dorian Worx's technocratic administration continues the war from dispersed facilities, but the directorates have lost their political centre."
 ADISCORD_vorkerland_story.4.a: "The technocrats are retreating."
 ADISCORD_vorkerland_story.5.t: "The Captured Command Apparatus"
 ADISCORD_vorkerland_story.5.d: "The first rival claimant has capitulated. Staff officers, code clerks and logistics chiefs are now in our custody. Some can be folded into the victorious command; others warn that preserving the defeated apparatus will carry its rivalries into the next campaign."
 ADISCORD_vorkerland_story.5.a: "Integrate the useful headquarters."
 ADISCORD_vorkerland_story.5.b: "Dissolve the apparatus and release its clerks."
 ADISCORD_vorkerland_story.6.t: "After the Guns"
 ADISCORD_vorkerland_story.6.worker.d: "Vorkerland is whole again under [ROOT.GetLeader]. Worker's loyalists and Anton Bagley's emergency administrators agree that the wartime state cannot remain unchanged, but they disagree over whether its command network or its civilian institutions should carry reconstruction."
 ADISCORD_vorkerland_story.6.joint.d: "Vorkerland is whole again under [ROOT.GetLeader]. Vlad's coalition and the joint councils that survived beside it must now decide whether reunification will be directed from one central command or guaranteed through a charter for the provinces."
 ADISCORD_vorkerland_story.6.worx.d: "Vorkerland is whole again under Doctor Dorian Worx. The technocratic administration can preserve the wartime directorates as instruments of reconstruction, or subject its emergency laboratories and planning bureaus to a formal audit."
 ADISCORD_vorkerland_story.6.worker.a: "Retain the emergency staff for reconstruction."
 ADISCORD_vorkerland_story.6.worker.b: "Restore the civilian ministries."
 ADISCORD_vorkerland_story.6.joint.a: "Bind the councils to a common command."
 ADISCORD_vorkerland_story.6.joint.b: "Issue a charter of provincial guarantees."
 ADISCORD_vorkerland_story.6.worx.a: "Doctor Worx will retain the technocratic directorates."
 ADISCORD_vorkerland_story.6.worx.b: "Audit the emergency laboratories."
 ADISCORD_vorkerland_story.7.t: "The Worker Government Reunifies Vorkerland"
 ADISCORD_vorkerland_story.7.d: "The last central front has closed. Under [ROOT.GetLeader], the worker republic has restored a single administration over Vorkerland and begun converting its emergency committees into institutions of reconstruction."
 ADISCORD_vorkerland_story.7.a: "A battered republic survives."
 ADISCORD_vorkerland_story.8.t: "Vlad's Coalition Reunifies Vorkerland"
 ADISCORD_vorkerland_story.8.d: "The last central front has closed. Vlad's coalition and its surviving joint councils have restored a single Vorkerland, balancing central command against the promises made to provincial allies during the war."
 ADISCORD_vorkerland_story.8.a: "The coalition has inherited the centre."
 ADISCORD_vorkerland_story.9.t: "Doctor Worx Reunifies Vorkerland"
 ADISCORD_vorkerland_story.9.d: "The last central front has closed. Doctor Dorian Worx has reunited Vorkerland beneath a technocratic administration, and the wartime directorates are already measuring the republic's reconstruction in power, transport and production targets."
 ADISCORD_vorkerland_story.9.a: "The technocracy begins its reconstruction."
 ADISCORD_vorkerland_story.10.t: "Worker Lives: The Chairman Is with the Loyalists"
 ADISCORD_vorkerland_story.10.d: "A day after the Unity Tower, the chairman's guard brought Nikita Worker up out of the complex's lower levels. The first recording of his voice went out over front-line transmitters rather than central radio; the old broadcast network no longer exists. He declares that the transition is unfinished, that the emergency powers therefore stand, and that anyone speaking for the republic apart from him is speaking for a mutiny. The districts that spent the week waiting for confirmation of his death have been given confirmation of the opposite, and must now decide what that is worth to them."
 ADISCORD_vorkerland_story.10.a: "The chairman has outlived his own centre."
 ADISCORD_vorkerland_story.11.t: "Petrichev Carries Worker Out of the Rubble"
 ADISCORD_vorkerland_story.11.d: "A Central District column reached the cordon around the Unity Tower before the capital's own emergency committees did. Nikita Worker was brought out alive, burned, without his guard and without a single working channel to his own government. Vlad Petrichev announces that the lawful head of state is under the protection of the army, and the same day seats a Joint Emergency Council around him. In Grand Vorkernsberg the announcement is read differently: the chairman was not rescued, he was taken. Which of the two men now disposes of the other has not been answered officially, and by all appearances will not be."
 ADISCORD_vorkerland_story.11.a: "Rescue or arrest - the first order will tell."
 ADISCORD_vorkerland_story.12.t: "Worker Is Not Found"
 ADISCORD_vorkerland_story.12.d: "Rescue teams have cleared three levels of the Unity Tower and found neither the chairman, nor his guard, nor a body. The official statement speaks of a loss of contact with the leadership, in the same words it used yesterday. Four incompatible accounts have appeared in a single day: he was taken north through a service tunnel; he is still under the lower levels; he never entered the complex that morning; he is held by a district that has not yet decided what to do with him. Every version suits somebody and none of them is confirmed. Until there is a body the republic has neither a living head of state nor a dead one, and the succession rests on rumour."
 ADISCORD_vorkerland_story.12.a: "Neither living nor dead."
 ADISCORD_vorkerland_story.13.t: "Nikita Worker Is Dead"
 ADISCORD_vorkerland_story.13.d: "The chairman's body was identified on the lower levels of the Unity Tower, a few dozen metres from the hall where every act of the transition had been signed for twenty-five years. The announcement is short, without detail and without a date for the funeral: there is no one to hold it and nowhere to hold it. The man they called the Vorkerland Caligula was the last person still entitled to speak for the whole confederation, and the procedure of succession disappears with him, because it had been written through him. The districts that spent the week demanding an answer from the centre discover for the first time that there is no centre left - not as a building, but as an address. Every government Vorkerland has after this will date its own legitimacy from today rather than from the constitution."
 ADISCORD_vorkerland_story.13.a: "An age has ended under the rubble."
 ADISCORD_vorkerland_story.41.t: "The Worker Government Has Capitulated"
 ADISCORD_vorkerland_story.41.d: "The worker republic has ended organised resistance. The emergency committees that considered themselves the direct continuation of the constitution are being dissolved or transferred to another command; their archives, staffs and registers pass to the victor. Of the three answers to what Vorkerland ought to become, the federal one is no longer defended by an army."
 ADISCORD_vorkerland_story.41.a: "There is one claimant fewer."
 ADISCORD_vorkerland_story.42.t: "Vlad's Coalition Has Capitulated"
 ADISCORD_vorkerland_story.42.d: "The wartime coalition at Isaiah has ended organised resistance. The chancery, the officer staffs and the district depots pass to the victor, and with them the whole vertical Vlad Petrichev built as a replacement for the institutions that had disappeared. The argument that the army is the last working institution of the country has just been tested in practice."
 ADISCORD_vorkerland_story.42.a: "There is one claimant fewer."
 ADISCORD_vorkerland_story.43.t: "Worx's Directorate Has Capitulated"
 ADISCORD_vorkerland_story.43.d: "The technocratic administration has ended organised resistance. The calculations, drawings and switching networks of the directorates pass to the victor almost intact - they had been looked after better than the divisions. The project that promised to survey the ruins and rebuild them to plan was beaten by the front rather than by the arithmetic, and that will remain the main objection to it for a long time."
 ADISCORD_vorkerland_story.43.a: "There is one claimant fewer."
 ADISCORD_vorkerland_story.50.t: "Grand Vorkernsberg Taken"
 ADISCORD_vorkerland_story.50.d: "Forces credited to [ROOT.GetNameDef] have entered Grand Vorkernsberg, the largest city of the republic and its political address ever since the revolution. The business quarter, the radar posts, the fuel stores and ten runways are here, and so is the anteroom the districts carried their grievances to for twenty-five years. Holding this city is not enough to hold the country, but no one can call themselves the government of Vorkerland while somebody else gives orders in it."
 ADISCORD_vorkerland_story.50.a: "The war for the symbols continues."
 ADISCORD_vorkerland_story.51.t: "Isaiah Taken"
 ADISCORD_vorkerland_story.51.d: "Forces credited to [ROOT.GetNameDef] have taken Isaiah, the seat of the Central District together with its oil, its chromium and the harbour at Port Amir. It is not only an administrative centre: the district supplied half of its own divisions through these wharves and arms lines. The staffs are withdrawing to reserve exchanges, and the victor inherits the only place on the central theatre where oil, a port and a weapons plant sit in one city."
 ADISCORD_vorkerland_story.51.a: "The war for the symbols continues."
 ADISCORD_vorkerland_story.52.t: "Northwerk Taken"
 ADISCORD_vorkerland_story.52.d: "Forces credited to [ROOT.GetNameDef] have seized Northwerk, the northern district with the switching exchanges and the reactor around which Dorian Worx assembled his administration of specialists. The directorates are dispersing to secondary facilities; their calculations, drawings and plans go on working, but the political address of technical reconstruction now belongs to somebody else."
 ADISCORD_vorkerland_story.52.a: "The war for the symbols continues."
 ADISCORD_vorkerland_story.53.t: "The Unity Tower Changes Hands"
 ADISCORD_vorkerland_story.53.d: "Forces credited to [ROOT.GetNameDef] have occupied the perimeter of the Unity Tower. There is almost nothing there to take: the complex burned out on the first day, leaving a science block, a few workshops and one runway, and the surviving population of the quarter would make a small town. The place has no military value, which is precisely why all three are fighting over it. The war began when the site that held the right to speak for the country ceased to exist; whoever stands on its ruins claims that right. On paper only - but the argument was always about paper."
 ADISCORD_vorkerland_story.53.a: "The war for the symbols continues."
 ADISCORD_vorkerland_story.54.t: "Eyrmi Taken"
 ADISCORD_vorkerland_story.54.d: "Forces credited to [ROOT.GetNameDef] have entered Eyrmi, the most populous node of the central theatre: eleven and a half million people, seven industrial complexes, arms lines, a civil reactor and an airfield of ten runways. The district that spent years arguing with the centre over its own administration has been given another foreign garrison administration; how many of its orders will actually be carried out is a separate question from whose flag hangs over the district office."
 ADISCORD_vorkerland_story.54.a: "The war for the symbols continues."
 ADISCORD_vorkerland_story.55.t: "Sudheim Taken"
 ADISCORD_vorkerland_story.55.d: "Forces credited to [ROOT.GetNameDef] have taken Sudheim, the south-eastern district where the steel, the rare alloys and seven industrial complexes come together. What everything else is made out of is poured here. While Sudheim worked for the old centre the war was an argument about authority; it is now also an argument about who will have metal next year."
 ADISCORD_vorkerland_story.55.a: "The war for the symbols continues."
 ADISCORD_vorkerland_story.56.t: "Old Vorkernsberg Taken"
 ADISCORD_vorkerland_story.56.d: "Forces credited to [ROOT.GetNameDef] have taken Old Vorkernsberg. The city is older than the republic: the crown ran its wars from here, the reactor that feeds half the capital agglomeration stands here, and so do the workshops the new centre never managed to bring fully under its own command. Whoever holds it gets the power supply and the awkward company of people who remember at least two previous governments."
 ADISCORD_vorkerland_story.56.a: "The war for the symbols continues."
 ADISCORD_vorkerland_story.57.t: "Kronberg Taken"
 ADISCORD_vorkerland_story.57.d: "Forces credited to [ROOT.GetNameDef] have taken Kronberg, the industrial district with seven arms factories and the densest concentration of war production anywhere in Vorkerland. Shells and small arms went out from here to every front at once, including the enemy's. Losing Kronberg does not decide the war within a week, but it decides what the war will be fought with in six months."
 ADISCORD_vorkerland_story.57.a: "The war for the symbols continues."
 ADISCORD_vorkerland_story.58.t: "Sutritsa Taken"
 ADISCORD_vorkerland_story.58.d: "Forces credited to [ROOT.GetNameDef] have entered Sutritsa, the principal naval base of the central theatre, with a deep harbour, shipyards and an airfield. The whole warring middle of the country has exactly two doors to the sea, Sutritsa and Port Amir, and everything that arrives from outside - fuel, machine tools, other people's volunteers - comes through one of them. Whoever holds Sutritsa half decides whether Vorkerland's war stays Vorkerland's own affair."
 ADISCORD_vorkerland_story.58.a: "The war for the symbols continues."
 ADISCORD_vorkerland_story.59.t: "Zshatsk Taken"
 ADISCORD_vorkerland_story.59.d: "Forces credited to [ROOT.GetNameDef] have taken Zshatsk. The district is small - three industrial complexes, two arms plants, an airfield - but it sits on a junction, and its garrison authorities have consistently refused to recognise any centre that declared itself lawful. The new commandant's office is moving into a town that has already changed hands several times, each government leaving faster than the last."
 ADISCORD_vorkerland_story.59.a: "The war for the symbols continues."
 ADISCORD_vorkerland_story.60.t: "Severin Taken"
 ADISCORD_vorkerland_story.60.d: "Forces credited to [ROOT.GetNameDef] have entered Severin in the middle of the Virden forests. The town stands on steel: ore fields, three industrial complexes and arms lines moved well away from the capital long ago for exactly this contingency. The forest that was meant to hide them from somebody else's aircraft is now hiding the people who came to take them."
 ADISCORD_vorkerland_story.60.a: "The war for the symbols continues."
 ADISCORD_vorkerland_story.61.t: "Velin Taken"
 ADISCORD_vorkerland_story.61.d: "Forces credited to [ROOT.GetNameDef] have taken Velin, the junction of the Central Sloboda where the roads of the interior districts meet. There are no rare alloys here and no way to the sea, only second-tier factories, an airfield and a crossroads. But both sides moved everything they were moving against each other through that crossroads, and the next offensive by any claimant now goes either through Velin or the long way round and late."
 ADISCORD_vorkerland_story.61.a: "The war for the symbols continues."
 ADISCORD_vorkerland_story.31.t: "Worker Declares the Transition Unfinished"
 ADISCORD_vorkerland_story.31.d: "Nikita Worker has told the front councils that the transition is unfinished, and that the emergency powers therefore cannot be finished either. The old confederation is named not as the goal but as a draft: the country will be reassembled through front committees and personal loyalty to the chairman rather than through the districts and their officials. The practical consequences were announced in the same speech - a worker levy, an open volunteer channel to the free republics, and the promise that the whole mandate will eventually be vested in one man. The stability of the rear is described, in as many words, as an acceptable price."
 ADISCORD_vorkerland_story.31.a: "The transition is the war."
 ADISCORD_vorkerland_story.32.t: "Bagley: Authority Is Measured in Deliveries"
 ADISCORD_vorkerland_story.32.d: "Anton Bagley, to whom the worker government passed after the Unity Tower, has abandoned the language of revolution. His government undertakes to publish the ration, the output norm and the deadlines, and to record itself as at fault when they are missed. Legitimacy is declared to be neither an inheritance nor a personal loyalty but a result that can be checked against a ledger. The line ends with the republic bound to its own published norms: a slower advance, in exchange for a home front that does not crack in the second year of the war."
 ADISCORD_vorkerland_story.32.a: "The ledger is the mandate."
 ADISCORD_vorkerland_story.33.t: "Petrichev Reclaims the Imperial Mandate"
 ADISCORD_vorkerland_story.33.d: "Vlad Petrichev has declared that what must be restored is not the republic but order, and that order has only one form, which is hierarchy. The chancery takes back the right of decree, the officer families are given back their old estates and ranks, and the civil administration is reduced to an executing body. The line leads to a crowned restoration - an empire without the old crown but with the old machinery. The staffs will get better, the rear quieter and angrier, and foreign partners will be offered a simple bargain: recognise the lawful government and get a predictable neighbour."
 ADISCORD_vorkerland_story.33.a: "Order has one form."
 ADISCORD_vorkerland_story.34.t: "A Dual Chamber Is Seated in Isaiah"
 ADISCORD_vorkerland_story.34.d: "The Joint Emergency Council has announced that the rescued chairman and the district guard will govern together, and has seated a dual chamber in Isaiah: one house from the districts and the command, the other from the worker quarters. The district rolls are being opened, and with them a broad levy. This is the most cumbersome construction in Vorkerland and the hardest to knock over: it attacks slowly and widely, but a state built this way cannot be taken out of the war by one blow at its capital."
 ADISCORD_vorkerland_story.34.a: "Two houses, one war."
 ADISCORD_vorkerland_story.35.t: "The Directorate Declares Continuous Mobilisation"
 ADISCORD_vorkerland_story.35.d: "The Vorkernsberg directorate has published a calculation showing that the scarce resource in this war is time, not people and not machine tools. The civil grid is switched over to feeding the war, the population is entered into the balance as a labour input, and the research programmes are cut in favour of output. Doctor Dorian Worx signed the document without reservations: the machine is to be worn out deliberately and the war won before it stops. An error in the schedule will cost not a lost battle but the entire construction at once."
 ADISCORD_vorkerland_story.35.a: "Time is the scarce resource."
 ADISCORD_vorkerland_story.36.t: "The Directorate Enacts the Preservation Protocol"
 ADISCORD_vorkerland_story.36.d: "The Vorkernsberg directorate has published the opposite calculation: the scarce resource is trained people, and spending them on the tempo of an offensive is forbidden. The design bureaus are being evacuated inland, specialists are withdrawn from front-line work, the defence is built to be cheap to hold, and research continues during the war rather than after it. Doctor Dorian Worx states that the republic can be lost on the map and still won in knowledge. An army run this way will attack markedly worse, and the protocol says so in writing."
 ADISCORD_vorkerland_story.36.a: "People are the scarce resource."
 ADISCORD_vorkerland_news.1.t: "Norvein Proclaimed"
 ADISCORD_vorkerland_news.1.d: "Ivanland has concluded its northern operation and dissolved the provisional defence front. Matvey Mateuska's Norvein received states 90 and 91, while Anton Selevyostrov's Kraitsk Directorate took states 93 and 94. Both regimes depend on Itora, and the surviving northern republics have already resumed their interrupted war."
 ADISCORD_vorkerland_news.1.a: "A new regime has appeared on the frontier."
 ADISCORD_vorkerland_news.2.t: "Ivanland Withdraws from Norvein"
 ADISCORD_vorkerland_news.2.d: "Ivanland's operation has failed. Neither Norvein nor the dependent Kraitsk Directorate was created: states 90 and 91 returned to Grain, while states 93 and 94 returned to Rivendell. The provisional Northern Defence Front has dissolved and the northern administrations have resumed their internecine wars. Vadim Ivanchik's government has declared an emergency course after the defeat."
 ADISCORD_vorkerland_news.2.a: "The north is at war with itself again."
