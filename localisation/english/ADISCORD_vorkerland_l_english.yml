 RUS_bunker_granary_requirements_tt:0 "Required spare power capacity: 1. Once completed, this level uses 1 power and grants the permanent effects shown below. Only one room can be chosen on this level."
 RUS_bunker_clinic_delta:0 "Surgical Level"
 RUS_bunker_clinic:0 "Level 4: Surgical Level"
 RUS_bunker_clinic_desc:0 "For the first time, field surgeons will have light, sterile water and a place to bring the wounded back to life. The Khan's ledgers will learn to count lives saved.\n\nDuration: 21 days. Required spare power capacity: 2. Once completed, this level uses 2 power and grants the permanent effects shown below. Only one room can be chosen on this level.\n$RUS_bunker_contract_tt$\n\nAn operational clinic opens district paramedic training and raises its reward to §G40§! social-system development progress instead of 25. Acquired knowledge survives the loss of the bunker.\n\nReturn of the Wounded adds another 5% casualty trickleback."
 RUS_bunker_clinic_cost_pp_ok:0 "§Y25§! £political_power_texticon"
 RUS_bunker_clinic_cost_pp_low:0 "§R25§! £political_power_texticon"
