 RUS_bunker_laboratory_delta:0 "Deep Laboratory"
 RUS_bunker_laboratory:0 "Level 4: Deep Laboratory"
 RUS_bunker_laboratory_desc:0 "There are no stars underground, but there is quiet for calculations. The engineers have demanded a separate power line and the right to put unwelcome truths in their reports.\n\nDuration: 21 days. Required spare power capacity: 3. Once completed, this level uses 3 power and grants the permanent effects shown below. Only one room can be chosen on this level.\n$RUS_bunker_contract_tt$\n\nIf this laboratory is operational when Reactor Alloys finishes, the country also receives a §G50%§! bonus for one support technology. The airship unlock does not depend on room selection or political course.\n\nJoint Air and Ground Operations reduces air accident chance by 5%."
 RUS_bunker_laboratory_cost_pp_ok:0 "§Y25§! £political_power_texticon"
 RUS_bunker_laboratory_cost_pp_low:0 "§R25§! £political_power_texticon"
