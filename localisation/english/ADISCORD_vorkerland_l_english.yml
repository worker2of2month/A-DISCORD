 ADISCORD_vorkerland_news.3.t: "Elections in Vorkerland"
 ADISCORD_vorkerland_news.3.worker.d: "Vorkerland's electoral commissions have announced Nikita Worcker's victory. After the civil war he put his powers to a vote and kept his post. Neo-Vorkerism remains the state ideology.\n\nThe emergency government now rests on an electoral mandate. For the neighbours, this means the restored Vorkerland will be led by the same authorities as before."
 ADISCORD_vorkerland_news.3.yastrebtsev.d: "Vorkerland's electoral commissions have announced Mark Yastrebtsev's victory. Following the vote held after the civil war, Nikita Worcker is stepping down as leader. The humanists will form the government.\n\nThe emergency cabinet is ending its work. A new government will take charge of the country's reconstruction."
 ADISCORD_vorkerland_news.3.filopo.d: "Vorkerland's electoral commissions have announced Necro Filopo's victory. The vote called after the civil war has removed Nikita Worcker from power and brought the chauvinists into government.\n\nThe new authorities inherit a country that has barely survived its collapse. Former members of the confederation and foreign neighbours alike are watching their course closely."
 ADISCORD_vorkerland_news.3.a: "The results are in."

 ADISCORD_vorkerland_news.4.t: "Vorkerland Rebuilds the Unity Tower"
 ADISCORD_vorkerland_news.4.d: "The government of [ROOT.GetNameDef] has announced the restoration of the Unity Tower, damaged by the explosion at the start of the civil war. Workers, engineers and archivists are returning the complex to its former appearance. Once the work is complete, it will again house the organs of government, a communications hub and the state archive."
 ADISCORD_vorkerland_news.4.a: "The Tower will be rebuilt."
 ADISCORD_vorkerland_central_initiative:0 "Operational initiative"
 ADISCORD_vorkerland_central_initiative_desc:0 "Coordinated staff work grants a temporary advantage against the other central claimants. Lasts at most two years from the outbreak and ends on capitulation, the end of the civil war, or a player taking control of a central claimant."

# --- rus_crisis_l_english ---
 RUS_world_anarchy: "Anarchy"
 RUS_world_anarchy_DEF: "anarchy"
 RUS_world_anarchy_ADJ: "Ruined"
 RUS_last_bunker: "Khan's Bunker"
 RUS_last_bunker_DEF: "Khan's bunker"
 RUS_last_bunker_ADJ: "Bunker"
 RUS_last_empire_crisis: "The Last Sky"
 RUS_last_empire_crisis_desc: "[GetRUSCrisisLaunchClock]\n\nThe reactor powers Khan's orbital programme. The Montar Empire, Vald Union and Timer Chamber prepare to intervene. An independent southern victor and an eastern hegemon that has finished its wars may join. Existing factions and other wars remain in place. Mobilization takes 90 days, leaving another 365 days to prevent launch. Losing the entire reactor perimeter permanently disables the programme. Khan's defeat dissolves the empire; a successful launch opens the final epilogue."
 RUS_crisis_invasion_countdown: "Until the regional intervention"
 RUS_crisis_invasion_countdown_desc: "Ninety days after exposure, independent regional powers will intervene. The southern victor and eastern hegemon must have finished their wars. Their allies and subjects enter the same side of the war while retaining their factions. A country fighting an existing participant cannot join its side; an earlier independent war against Khan keeps its own settlement. Eligibility is checked on the day of intervention. Closing events does not change the deadline."
 RUS_crisis_defence_countdown: "Until the orbital strike"
 RUS_crisis_defence_countdown_desc: "There are 455 days from exposure: 90 days to prepare and 365 more before launch. Defeat Khan or capture the entire reactor perimeter ($STATE_176$, $STATE_177$, $STATE_188$, $STATE_192$) to prevent launch. Existing factions and other wars continue. A liberated participant must be defeated again."
 RUS_crisis_establish_special_zone: "Special zone: [FROM.GetName]"
 RUS_crisis_establish_special_zone_desc: "Establish a sanitary frontier administration in this restored fragment. It will become our subject; the other fragments remain independent until a separate decision is taken."
 RUS_crisis_fragment_available_tt: "The fragment is independent, outside a faction and at peace."
 RUS_empire_proclaimed_tt: "The Last Empire has been proclaimed."
 RUS_crisis_course_open_tt: "Defensive preparations remain available until launch or the empire's collapse."
 RUS_imperial_frontier_campaign: "Imperial campaign: [FROM.GetName]"
 RUS_imperial_frontier_campaign_desc: "Start a war to annex a neighbouring country. A shared border is required; the target must be independent and outside a faction. The empire opens one front at a time. Preparations for the last campaign against the hegemon and the campaign itself temporarily block new frontier wars."
 RUS_imperial_frontier_not_crisis_tt:0 "The orbital programme has not been exposed or has been permanently stopped; the coalition war is over."
 RUS_crisis_war_active_tt: "Regional powers are fighting the Last Empire."
 RUS_crisis_won_tt: "Every remaining participant in the intervention has been defeated."
 RUS_crisis_warning_tt: "Regional powers will review their readiness to intervene in §Y90 days§!. Launch follows §Y455 days§! after exposure if Khan retains power and reactor access."
 ADISCORD_rus_crisis.1.t: "Under One Sky"
 ADISCORD_rus_crisis.1.d: "Intelligence reports converge on one conclusion: Khan is building a reactor-powered orbital weapon. Its targets include factories, communication hubs and capitals. Stelander and Kefreyt are only the first names on the list. This programme threatens the world that makes all our states possible.\n\nThe Montar Empire, Vald Union and Timer Chamber prepare an expedition. The independent victor in the south may join; the eastern hegemon must first finish its wars. The staffs have allowed ninety days to prepare. One further year will remain before the predicted launch.\n\nA common threat has not produced a common government. States retain their factions and old fronts continue under their existing orders. Each participating government must bring its allies to the reactor perimeter while this war still has a purpose."
 ADISCORD_rus_crisis.1.a: "Stop Khan first."
 ADISCORD_rus_crisis.2.t: "The Last Sky"
 ADISCORD_rus_crisis.2.d: "The reactor no longer works to keep homes lit. Its output feeds the programme with which Khan intends to end the age of great states. The orbital system's final beam will strike the reactor's own core. Khan expects the catastrophe to destroy the industrial world and leave survivors dependent on the nearest fortified estate and its master.\n\nThe Montar Empire, Vald Union and Timer Chamber discuss intervention. An independent southern victor and the eastern hegemon may also march once their wars are over. Their staffs will issue orders in ninety days. Khan only needs to hold the reactor until launch.\n\nThe engineers give a total of four hundred and fifty-five days. Work continues while even one of the four accessible reactor zones remains in imperial hands. If the entire perimeter is lost, the programme cannot be restored during this campaign."
 ADISCORD_rus_crisis.2.a: "Guard the reactor."
 ADISCORD_rus_crisis.3.t: "War Against the Clock"
 ADISCORD_rus_crisis.3.d: "The preparation deadline has passed. Governments still able to intervene order their forces towards the Last Empire. Their allies and subjects join the same side of the war while retaining their own commands and factions. Existing wars continue.\n\nThe launch deadline remains unchanged. Capturing the entire reactor perimeter disables the programme, but the war still requires a military settlement. If Khan falls, his empire dissolves into independent territories. If he defeats every remaining participant, their lands are absorbed into the empire and the orbital clock keeps running."
 ADISCORD_rus_crisis.3.a: "The clock is running."
 ADISCORD_rus_crisis.4.other: "The imperial army has been defeated, and the Khan's authority is collapsing with it. Subject governments renounce their allegiance and earlier conquests escape the capital's rule. Independent administrations and armed domains emerge across the Khan's own lands.\n\nNo one inherits a ready-made empire. A fragmented frontier replaces the common enemy, with local rulers competing for roads, stockpiles and authority. Victory has removed the Khan; order in his former lands must be built anew."
 ADISCORD_rus_crisis.4.t: "An empire without its Khan"
 ADISCORD_rus_crisis.4.val: "The Khan's army has been defeated. His chancery has been dissolved, he has been removed from power, and local administrations are returning to the empire's former lands.\n\nKefreyt may leave these fragments independent or establish a sanitary frontier administration in each one separately. Neighbouring countries' lands are excluded from this partition."
 ADISCORD_rus_crisis.4.sts: "The Last Empire has dissolved with the Khan's authority. Local republics are restoring their institutions, and the former imperial centre passes to local administration.\n\nStelander may leave the fragments independent or establish sanitary frontier zones in them individually. This settlement does not transfer lands belonging to countries outside the empire."
 ADISCORD_rus_crisis.4.nod: "The Khan's last orders have gone unheeded. Northern troops have seized the centres of administration, while the subordinate aimags refuse to keep fighting for a fallen empire. The old regions will restore their own administrations within the Khan's former territory. Nodrul may conclude separate agreements for special administration, but victory alone does not turn every liberated country into a dependency."
 ADISCORD_rus_crisis.4.a: "Settle the frontier."
 ADISCORD_rus_crisis.5.t: "The Intervention Defeated"
 ADISCORD_rus_crisis.5.d: "The last armies opposing Khan have surrendered. Their participating allies and subjects share their defeat: the lands of every remaining participant pass to the empire.\n\nVictory has not changed Khan's order. If the orbital programme is still active, the reactor will keep preparing the strike until its appointed deadline. Captured capitals and conquered factories remain in its calculations."
 ADISCORD_rus_crisis.5.a: "Begin administering the new lands."
 ADISCORD_rus_crisis.6.t: "Programme Closed"
 ADISCORD_rus_crisis.6.d: "The orbital programme has lost the conditions that sustained it. Launch is permanently cancelled. Recovering the reactor cannot restart the old countdown."
 ADISCORD_rus_crisis.6.a: "Understood."
 RUS_imperial_general_staff: "The imperial general staff"
 RUS_imperial_general_staff_desc: "The aimaq commanders are used to answering only for their own troops. The general staff will combine their reports into one defensive plan and open the Last Order campaign. The staff, supply lines, arsenal, second levy and perimeter deployment take eighty-four days in total, fitting within the warning period."
 RUS_western_supply_lines: "Supply the Perimeter"
 RUS_western_supply_lines_desc: "Trains and motor columns will connect the garrisons to rear depots. The railway towards Starolesye can be improved while the empire holds both ends."
 RUS_imperial_arsenals: "The imperial arsenal"
 RUS_imperial_arsenals_desc: "The chancery will turn the hosts' separate orders into a standing armaments programme and expand the capital's arsenal."
 RUS_aimaq_reserve: "The second muster"
 RUS_aimaq_reserve_desc: "The first muster built the empire. The second must provide recruits, rifles, squad weapons, and portable anti-air crews for a war against a power that has already subdued its neighbours."
 RUS_break_the_hegemon: "Defend the Reactor Perimeter"
 RUS_break_the_hegemon_desc: "Foreign staffs are preparing to march against Khan. While engineers assemble the orbital system, the army must establish barriers, supply its garrisons and block the roads to the reactor. New brigades will take positions around the complex."
 RUS_register_conquered_lands: "Inventory the Installations"
 RUS_register_conquered_lands_desc: "Engineers will map the surviving installations, cables and distribution nodes. Repair units receive equipment and rolling stock to deliver machinery wherever the perimeter still holds."
 RUS_empire_without_rivals: "Orbital Calculations"
 RUS_empire_without_rivals_desc: "Trajectory, stored energy and the return pulse must converge in a single calculation. A new scientific directorate receives a permanent place in imperial research."

