 ADISCORD_vorkerland_wtd_worx_protocols: "Worx's Protocols"
 ADISCORD_vorkerland_wtd_worx_protocols_desc: "After the republican centre split, Oytfort's engineers seized dispatch offices, communications centres and warehouses. The committee recognises Doctor Worx's strategic leadership and enters the war on his side, but replaces domestic politics with standards, permits and production quotas. Worcker's republic remains a separate and fully fledged participant in the civil war."
 faction_vorkerland_northern_defense_front: "Northern Defence Front"
 ADISCORD_vorkerland_northern_defense_front: "Northern Defence Front"
 ADISCORD_vorkerland_northern_defense_front_desc: "Facing foreign invasion, the northern headquarters suspended their mutual wars and joined their radio networks and reserves into a common defensive system. The truce will last only until Itora's campaign ends."
