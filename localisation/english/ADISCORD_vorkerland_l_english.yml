 WKR_pragmatism_party_long: "Worcker Revolutionary Party"
 WKR_utilitarism_party: "Normative Directorate"
 WKR_utilitarism_party_long: "Vorkerland Normative Reconstruction Directorate"
 WKR_Emergency_Coordination_Committee: "Emergency Coordination Committee"
 ADISCORD_vorkerland_phase.1.t: "Choose the Claimant"
 ADISCORD_vorkerland_phase.1.d:0 "The republic is about to collapse. This choice changes only the country controlled by the player; Worcker's fate and local conflicts are resolved independently. Lead Worcker's supporters, Vlad and Armi, or Dorian's directorate. Agreements with autonomous districts remain relevant but never force your allegiance. After 14 days without a choice, control passes to Worcker's supporters."
 ADISCORD_vorkerland_phase.1.a: "Control Worcker's emergency committees."
 ADISCORD_vorkerland_phase.1.b: "Control the military coalition."
 ADISCORD_vorkerland_phase.1.c: "Control Dorian Worx's technical administration."
 ADISCORD_vorkerland_phase.1.e: "Honour the Worcker-Vadl emergency compact."

# --- rom_tru_l_english ---
 ADISCORD_vorkerland_rom_tru_category:0 "Southern Republics in Flames"

 ADISCORD_vorkerland_rom_desert_eagle_staff:0 "Desert Eagle Staff"
 ADISCORD_vorkerland_rom_desert_eagle_staff_desc:0 "Romanovsky gathered around the Frealor staff officers from the old confederation, signallers, and valley guides. They are few, but orders reach the companies faster than supply lines fall apart."
 ADISCORD_vorkerland_rom_valley_columns:0 "Valley Columns"
 ADISCORD_vorkerland_rom_valley_columns_desc:0 "Composite detachments of Frealor received a unified offensive schedule, field workshops, and the right to requisition transport without delay."
 ADISCORD_vorkerland_rom_stalled_offensive:0 "Stalled Offensive"
 ADISCORD_vorkerland_rom_stalled_offensive_desc:0 "The staff promised a swift operation, but the valleys swallowed men and supplies. Distrust of new orders is growing in the ranks."
 ADISCORD_vorkerland_rom_valley_compact:0 "Frealor Valley Compact"
 ADISCORD_vorkerland_rom_valley_compact_desc:0 "Military and valley councils formalised the division of authority: the staff is responsible for defence, the communities for supply and restoring the economy."

 ADISCORD_vorkerland_tru_emergency_river_council:0 "Emergency River Council"
 ADISCORD_vorkerland_tru_emergency_river_council_desc:0 "Zlatorech factories, river guilds, and Truman's staff were brought together into a single mobilisation council. Every bridge, warehouse, and foundry now operates on a front-line schedule."
 ADISCORD_vorkerland_tru_crossing_columns:0 "River Crossing Columns"
 ADISCORD_vorkerland_tru_crossing_columns_desc:0 "Mobile groups have pre-distributed pontoon bridges, repair teams, and reserves among the key crossings."
 ADISCORD_vorkerland_tru_stalled_offensive:0 "Disrupted River Schedule"
 ADISCORD_vorkerland_tru_stalled_offensive_desc:0 "The promised swift defeat of the provisional administration did not materialise. The factories demand a new plan, and the units are losing faith in the staff's schedules."
 ADISCORD_vorkerland_tru_river_congress:0 "Zlatorech Congress"
 ADISCORD_vorkerland_tru_river_congress_desc:0 "Representatives of cities, factories, and front-line units turned emergency mobilisation into a durable republican order."

 ADISCORD_vorkerland_rom_assemble_valley_columns:0 "Assemble Valley Columns"
 ADISCORD_vorkerland_rom_assemble_valley_columns_desc:0 "In twenty-one days the staff will combine scattered reserves into another line brigade and prepare a brief offensive window."
 ADISCORD_vorkerland_rom_break_valley_administration:0 "Break the Valley Administration"
 ADISCORD_vorkerland_rom_break_valley_administration_desc:0 "Frealor has 180 days to eliminate the Valley Administration. Victory will strengthen the republic; a protracted war will undermine trust in the staff."
 ADISCORD_vorkerland_rom_charter_valley_councils:0 "Ratify the Valley Councils Charter"
 ADISCORD_vorkerland_rom_charter_valley_councils_desc:0 "After victory it is necessary to reach agreement with the returned communities before military administration becomes a new occupation authority."

 ADISCORD_vorkerland_tru_arm_river_battalions:0 "Arm the River Battalions"
 ADISCORD_vorkerland_tru_arm_river_battalions_desc:0 "Civilian guilds will transfer men, transport, and repair kits to the army, and the factories will assemble an additional line brigade."
 ADISCORD_vorkerland_tru_break_zlatorech_administration:0 "Crush the Provisional Administration"
 ADISCORD_vorkerland_tru_break_zlatorech_administration_desc:0 "Within 150 days Zlatorech must retake the western bank. Otherwise the emergency council will lose its right to dictate the republic's front-line rhythm."
 ADISCORD_vorkerland_tru_convene_river_congress:0 "Convene the Zlatorech Congress"
 ADISCORD_vorkerland_tru_convene_river_congress_desc:0 "Victory allows temporary orders to be replaced by an agreement among cities, factories, and front-line units on the republic's future."

 ADISCORD_vorkerland_rom_tru.1.t:0 "The Desert Eagle Shows Its Hand"
 ADISCORD_vorkerland_rom_tru.1.d:0 "The Valley Administration rejected Frealor's orders and closed the roads south. Erwin von Romanovsky declared that the republic would not survive another partition: the staff is gathering old officers, local councils are opening warehouses, and columns are moving toward the passes. The war must be short - otherwise that very staff will become a new burden for Frealor."
 ADISCORD_vorkerland_rom_tru.1.a:0 "Concentrate the columns into a single fist."
 ADISCORD_vorkerland_rom_tru.2.t:0 "The River Will No Longer Divide the Republic"
 ADISCORD_vorkerland_rom_tru.2.d:0 "The provisional administration entrenched itself on the western bank and declared itself the sole lawful authority of Zlatorech. Nikita Truman convened the factory directors, commanders, and representatives of the river guilds. Their emergency council is putting crossings and foundries on a wartime schedule - with a promise to return authority to the citizens after victory."
 ADISCORD_vorkerland_rom_tru.2.a:0 "Launch the river mobilisation plan."

# --- stalemate_l_english ---
 ADISCORD_vorkerland_ai_breakthrough_window:0 "Emergency Operational Window"
 ADISCORD_vorkerland_ai_breakthrough_window_desc:0 "For seventy-five days, exhausted attacking staffs receive strict rail priorities, mobile repair crews, and authority to force a decision on the surviving front."

# --- story_l_english ---
 ADISCORD_vorkerland_story.1.t: "The Claimants Go to War"
 ADISCORD_vorkerland_story.1.d: "The last emergency channels between Vorkerland's surviving governments have gone silent. The claimants have broken off talks and now treat one another as enemies. Fighting is under way on every front: the war for the centre of the country has begun."
 ADISCORD_vorkerland_story.1.a: "The talking is over."
 ADISCORD_vorkerland_story.2.t: "The Grand Vorkernsberg Region Falls"
 ADISCORD_vorkerland_story.2.d: "Troops of [ROOT.GetNameDef] and its allies have taken control of the entire Grand Vorkernsberg region. The republican government has lost not only its capital but every district of its home territory. Its emergency committees may still fight on elsewhere, but they have lost their base."
 ADISCORD_vorkerland_story.2.a: "Grand Vorkernsberg has fallen."
 ADISCORD_vorkerland_story.3.t: "The Isaiah Region Falls"
 ADISCORD_vorkerland_story.3.d: "Troops of [ROOT.GetNameDef] and its allies have occupied the entire Isaiah region, the home territory of the military coalition. Losing a single headquarters could still be passed off as a temporary retreat, but the coalition has now lost all of its core districts."
 ADISCORD_vorkerland_story.3.a: "Isaiah has fallen."
 ADISCORD_vorkerland_story.4.t: "The Northwerk Region Falls"
 ADISCORD_vorkerland_story.4.d: "Troops of [ROOT.GetNameDef] and its allies have occupied the entire Northwerk region. Doctor Dorian Worx's technocratic administration can keep fighting from dispersed facilities, but its home territory and its network of local command posts are lost."
 ADISCORD_vorkerland_story.4.a: "Northwerk has fallen."
 ADISCORD_vorkerland_story.5.t: "The Captured Command Apparatus"
 ADISCORD_vorkerland_story.5.d: "The first rival claimant has capitulated. Staff officers, code clerks and logistics chiefs are now in our custody. Some can be folded into the victorious command; others warn that preserving the defeated apparatus will carry its rivalries into the next campaign."
 ADISCORD_vorkerland_story.5.a: "Integrate the useful headquarters."
 ADISCORD_vorkerland_story.5.b: "Dissolve the apparatus and release its clerks."
 ADISCORD_vorkerland_story.6.t: "After the Guns"
 ADISCORD_vorkerland_story.6.worker.d: "Vorkerland is whole again under [ROOT.GetLeader]. Worcker's loyalists and Anton Bagley's emergency administrators agree that the wartime state cannot remain unchanged, but they disagree over whether its command network or its civilian institutions should carry reconstruction."
 ADISCORD_vorkerland_story.6.joint.d: "Vorkerland is whole again under [ROOT.GetLeader]. The military coalition and the joint councils that survived beside it must now decide whether reunification will be directed from one central command or guaranteed through a charter for the provinces."
 ADISCORD_vorkerland_story.6.worx.d: "Vorkerland is whole again under Doctor Dorian Worx. The technocratic administration can preserve the wartime directorates as instruments of reconstruction, or subject its emergency laboratories and planning bureaus to a formal audit."
 ADISCORD_vorkerland_story.6.worker.a: "Retain the emergency staff for reconstruction."
 ADISCORD_vorkerland_story.6.worker.b: "Restore the civilian ministries."
 ADISCORD_vorkerland_story.6.joint.a: "Bind the councils to a common command."
 ADISCORD_vorkerland_story.6.joint.b: "Issue a charter of provincial guarantees."
 ADISCORD_vorkerland_story.6.worx.a: "Doctor Worx will retain the technocratic directorates."
 ADISCORD_vorkerland_story.6.worx.b: "Audit the emergency laboratories."
 ADISCORD_vorkerland_story.7.t: "The Republican Government Reunifies Vorkerland"
 ADISCORD_vorkerland_story.7.d: "The last front in the centre of the country has closed. Under [ROOT.GetLeader], the worker republic has restored a single administration over Vorkerland and begun turning its emergency committees into bodies for peacetime reconstruction."
 ADISCORD_vorkerland_story.7.a: "The worker republic has won the war."
 ADISCORD_vorkerland_story.8.t: "Military Coalition Reunifies Vorkerland"
 ADISCORD_vorkerland_story.8.d: "The last front in the centre of the country has closed. The military coalition and the surviving joint councils have restored a united Vorkerland. The new authorities must now strike a balance between central command and the promises made to provincial allies during the war."
 ADISCORD_vorkerland_story.8.a: "The military coalition has won the war."
 ADISCORD_vorkerland_story.9.t: "Doctor Worx Reunifies Vorkerland"
 ADISCORD_vorkerland_story.9.d: "The last front in the centre of the country has closed. Doctor Dorian Worx has united Vorkerland under a technocratic administration. The wartime directorates are already drawing up reconstruction plans in terms of power output, transport and production."
 ADISCORD_vorkerland_story.9.a: "The technocrats have won the war."
 ADISCORD_vorkerland_story.10.t: "Worcker Is Alive and with the Loyalists"
 ADISCORD_vorkerland_story.10.d: "A day after the explosion in the Unity Tower, the chairman's guard brought Nikita Worcker out of the complex's lower levels. A recording of his address was broadcast by front-line transmitters, as central radio is no longer working. The chairman declared that the transition is not complete, that the emergency powers remain in force, and that anyone speaking for the republic other than him is a mutineer. The districts that spent the week waiting for news of his death must now decide how to deal with a living chairman."
 ADISCORD_vorkerland_story.10.a: "The chairman has survived."
 ADISCORD_vorkerland_story.11.t: "Petrichev Carries Worcker Out of the Rubble"
 ADISCORD_vorkerland_story.11.d: "A Central District column reached the cordon around the Unity Tower before the capital's emergency committees did. Nikita Worcker was carried out alive but burned, without his guard and with no way to contact his own government. Vlad Petrichev announced that the lawful head of state is under the army's protection, and the same day set up a Joint Emergency Council around him. In Grand Vorkernsberg the news was received differently: there, people believe the chairman was not rescued but seized. There has been no official word on which of the two men now answers to the other."
 ADISCORD_vorkerland_story.11.a: "Rescue or arrest?"
 ADISCORD_vorkerland_story.12.t: "Worcker Is Missing"
 ADISCORD_vorkerland_story.12.d: "Rescue teams have cleared three levels of the Unity Tower and found neither the chairman, nor his guard, nor a body. The official statement repeats yesterday's wording about a «loss of contact with the leadership». Within a day, four contradictory accounts have appeared: Worcker was taken north through a service tunnel; he is still buried under the lower levels; he was never in the complex that day; he is being held by one of the districts, which has not yet decided what to do with him. None of them has been confirmed. Until the chairman's fate is known, the question of succession remains open."
 ADISCORD_vorkerland_story.12.a: "Where is Worcker?"
 ADISCORD_vorkerland_story.13.t: "Nikita Worcker Is Dead"
 ADISCORD_vorkerland_story.13.d: "The chairman's body has been identified on the lower levels of the Unity Tower, a few dozen metres from the hall where every act of the transition was signed for twenty-five years. The announcement of his death is brief, with no details and no date for a funeral. Nikita Worcker was the last person entitled to speak for the whole confederation, and the order of succession was tied to him personally. Vorkerland no longer has a lawful procedure for transferring power, and the districts that spent the week waiting for instructions from the capital will now decide for themselves."
 ADISCORD_vorkerland_story.13.a: "Worcker is dead."
 ADISCORD_vorkerland_story.41.t: "The Republican Government Has Capitulated"
 ADISCORD_vorkerland_story.41.d: "The worker republic has ended organised resistance. The emergency committees that saw themselves as the lawful heirs of the constitution are being dissolved or placed under another command. Their archives, staffs and registers pass to the victor. Supporters of a federal Vorkerland no longer have an army to protect them."
 ADISCORD_vorkerland_story.41.a: "One claimant fewer."
 ADISCORD_vorkerland_story.42.t: "Military Coalition Has Capitulated"
 ADISCORD_vorkerland_story.42.d: "The Isaiah military coalition has ended organised resistance. The chancery, the officer staffs and the district depots pass to the victor, and with them the whole chain of command Vlad Petrichev built to replace the institutions that had collapsed. The coalition claimed that the army was the country's last working institution, but that army could not win the war."
 ADISCORD_vorkerland_story.42.a: "One claimant fewer."
 ADISCORD_vorkerland_story.43.t: "Worx's Directorate Has Capitulated"
 ADISCORD_vorkerland_story.43.d: "The technocratic administration has ended organised resistance. The directorates' calculations, blueprints and dispatch networks pass to the victor almost intact: they had been guarded more carefully than the divisions. The project that promised to rebuild the country according to plan was lost at the front."
 ADISCORD_vorkerland_story.43.a: "One claimant fewer."
 ADISCORD_vorkerland_story.31.t: "Worcker Declares the Transition Unfinished"
 ADISCORD_vorkerland_story.31.d: "Nikita Worcker has addressed the front councils and declared that the transition is not complete, which means the emergency powers remain in force. He called the old confederation a draft: the country is to be rebuilt through front committees and personal loyalty to the chairman, bypassing the districts and their officials. The same speech announced concrete measures: a worker levy, recruitment of volunteers for the free republics, and a promise that the whole mandate will eventually be vested in one man. The chairman openly admitted that he is prepared to sacrifice the stability of the home front for this."
 ADISCORD_vorkerland_story.31.a: "The state of emergency is extended."
 ADISCORD_vorkerland_story.32.t: "Bagley Bets on Supply"
 ADISCORD_vorkerland_story.32.d: "Anton Bagley, who took over the republican government after the explosion in the Unity Tower, has dropped the revolutionary rhetoric. His government promises to publish ration and output norms and delivery deadlines, and to openly accept responsibility when they are missed. Bagley proposes that his government's legitimacy be judged by the commitments it meets rather than by succession or personal loyalty. The advance will be slower under this course, but the home front should hold up through a long war."
 ADISCORD_vorkerland_story.32.a: "We'll see if he keeps his word."
 ADISCORD_vorkerland_story.33.t: "Petrichev Demands an Imperial Mandate"
 ADISCORD_vorkerland_story.33.d: "Vlad Petrichev has declared that what needs restoring is not the republic but order, and that the only reliable form of order is hierarchy. The chancery is taking back the right to issue decrees, officer families are getting back their old estates and ranks, and the civil administration is becoming an executive apparatus attached to the staffs. The course leads to a restored empire, without the old dynasty but with the old structure. The staffs will benefit, while discontent will grow in the rear. Petrichev is offering foreign partners a predictable neighbour in exchange for recognising his government as lawful."
 ADISCORD_vorkerland_story.33.a: "Petrichev has his eye on a crown."
 ADISCORD_vorkerland_story.34.t: "A Bicameral Assembly Convenes in Isaiah"
 ADISCORD_vorkerland_story.34.d: "The Joint Emergency Council has announced that the rescued chairman and the district guard will govern the country together, and has convened a bicameral assembly in Isaiah. One chamber represents the districts and the command, the other the worker quarters. District rolls have been opened, and a broad levy has been announced along with them. The arrangement is cumbersome and the army will advance slowly, but the state will not fall to a single blow against its capital."
 ADISCORD_vorkerland_story.34.a: "Power has been split in two."
 ADISCORD_vorkerland_story.35.t: "The Directorate Declares Continuous Mobilisation"
 ADISCORD_vorkerland_story.35.d: "The Vorkernsberg directorate has published a calculation according to which the scarcest resource in this war is time, not people or machine tools. The civilian power grid is being switched to the needs of the front, the population is entered in the balance as labour, and research programmes are being cut in favour of output. Doctor Dorian Worx signed the document without reservations. The plan accepts deliberate wear on industry and counts on winning before it breaks down; a mistake in the timing could bring down the whole system."
 ADISCORD_vorkerland_story.35.a: "Everything for the front."
 ADISCORD_vorkerland_story.36.t: "The Directorate Enacts the Preservation Protocol"
 ADISCORD_vorkerland_story.36.d: "The Vorkernsberg directorate has published the opposite calculation: the scarcest resource is trained specialists, and spending them for the sake of an offensive's tempo is forbidden. Design bureaus are being evacuated inland, specialists are being withdrawn from front-line work, defences are built to cost as little as possible, and research continues during the war. According to Doctor Dorian Worx, the republic can lose on the map and still win in knowledge. The text of the protocol states plainly that the army's offensive capability will drop noticeably."
 ADISCORD_vorkerland_story.36.a: "The directorate protects its people."
 ADISCORD_vorkerland_news.1.t: "Itora Wins the Northern Campaign"
 ADISCORD_vorkerland_news.1.d: "Itora has announced the end of its northern operation and dissolved the provisional defence front. Two new regimes have been set up on the occupied lands: Norvein under Matvey Mateuska and Anton Selevyostrov's Kraitsk Directorate. Both governments depend entirely on Itora.\n\nThe north has not become any calmer. The surviving republics are returning to their old disputes over borders and roads, and the new administrations are raising armies of their own. Itora has chosen buffer states over direct occupation; how viable they are remains to be seen."
 ADISCORD_vorkerland_news.1.a: "Itora has acquired satellites."
 ADISCORD_vorkerland_news.2.t: "Itora Is Defeated in the Northern Campaign"
 ADISCORD_vorkerland_news.2.d: "Itora's attempt to impose a new order in the north has failed. Plans to create Norvein and the dependent Kraitsk Directorate have come to nothing, the disputed territories have been returned to Grain and Rivendell, and the provisional Northern Defence Front has been dissolved.\n\nVadim Ivanchik's government has declared an emergency course after the defeat. Meanwhile, the northern administrations are resuming their wars with one another."
 ADISCORD_vorkerland_news.2.capitulated: "Itora's northern expedition has ended in complete military defeat. Itoran forces have capitulated, the provisional Northern Defence Front has been dissolved, and the disputed districts are returning to the northern administrations.\n\nNo new governments will appear on the lands Itora occupied. The victors are locking in the results of the war, and the northern republics are returning to their old conflicts."
 ADISCORD_vorkerland_news.2.a: "Itora's campaign has failed."
# --- rus_last_empire_l_english ---
 RUS_summon_the_aimaqs: "Summon the Aimaqs"
 RUS_summon_the_aimaqs_desc: "The free aimaqs accept a common banner only when a foreign army is already on their pastures. The khan's standard is raised so neighbours know who will speak for the steppe."
 RUS_arm_the_border_hosts: "Arm the Border Hosts"
 RUS_arm_the_border_hosts_desc: "The communes already keep rifles. What they lack is a shared stockpile and men willing to ride beyond their own ulus."
 RUS_watch_the_western_scar:0 "Protected patrols"
 RUS_watch_the_western_scar_desc: "The western edge has been silent too long. If the Dirty Zone opens, Khanate pickets will see it before any claimant capital."
 RUS_claim_the_opened_zone: "Claim the Opened Zone"
 RUS_claim_the_opened_zone_desc: "Dirty Zone settlements appeared without a master. The Land of the Khan will not wait for someone else to call them a buffer."
 RUS_drive_starolesye_back: "Drive Starolesye Back"
 RUS_drive_starolesye_back_desc: "The Starolesye Republic sits on the western belt. While it holds the neighbouring states, every khanate army remains trapped in the bunker."
 RUS_press_the_closed_zone: "Press the Closed Zone"
 RUS_press_the_closed_zone_desc: "Dirty Zone neighbours live and fight apart. The Land of the Khan can take them one at a time without joining the war for the Tower."
 RUS_seat_the_khan_chancery: "Seat the Khan's Chancery"
 RUS_seat_the_khan_chancery_desc: "If the aimaqs keep the land they take, the host needs a standing chancery. Otherwise the victory remains a raid."
 RUS_summon_the_aimaqs_tt: "The aimaqs accept a common muster as a defence of the land, not as a new capital."
 RUS_watch_the_western_scar_tt: "Pickets wait for the Dirty Zone to open. The wars themselves start only through separate decisions."
 RUS_claim_the_opened_zone_tt: "The Land of the Khan claims the western Dirty Zone belt. Wars open through decisions, not this focus."
 RUS_claim_the_opened_zone_available_tt: "The Dirty Zone must already be open."
 RUS_drive_starolesye_back_available_tt: "Starolesye must exist, or the khanate border war must already be under way."
 RUS_press_the_closed_zone_available_tt: "Starolesye must already be absorbed, or it must no longer exist."
 RUS_seat_the_khan_chancery_available_tt: "At least two Dirty Zone neighbours must already be held."
 ADISCORD_vorkerland_rus_dirty_campaign_category: "Khanate Campaign"
 ADISCORD_vorkerland_rus_dirty_campaign_category_desc: "The Land of the Khan takes Dirty Zone neighbours one front at a time. A new war does not start until the last one is closed."
 RUS_campaign_sla: "Finish Starolesye"
 RUS_campaign_sla_desc: "The border war left the republic without its western belt. The Land of the Khan now takes the remaining Starolesye land."
 RUS_campaign_rza: "March on the Reactor Belt"
 RUS_campaign_rza_desc: "The Reactor Zone Union holds the contaminated industrial node. The khanate army takes it only with a shared border and a free front."
 RUS_campaign_mlr: "Occupy the Lowland"
 RUS_campaign_mlr_desc: "The Little Lowland Republic sits on the next stretch after Starolesye. It is taken separately."
 RUS_campaign_ert: "Demand the Eastern Republic"
 RUS_campaign_ert_desc: "The Eastern Republic becomes a target only when khanate holdings already touch its border."
 RUS_campaign_irt: "Demand the Inner Lands"
 RUS_campaign_irt_desc: "The Inner Lands Republic follows the same rule: a shared border, one front, and a complete seizure."
 RUS_campaign_sca: "Demand the Southern Federation"
 RUS_campaign_sca_desc: "The Southern Federation is a distant neighbour. The decision appears only after khanate land has reached its frontier."
 RUS_proclaim_the_last_empire: "Proclaim the Last Empire"
 RUS_proclaim_the_last_empire_desc: "When the aimaqs have held enough Dirty Zone neighbours, the khan's chancery names the Land of the Khan the Last Empire and raises the second standard."
 RUS_campaign_sla_tt: "Declares war on Starolesye and demands all of its land."
 RUS_campaign_rza_tt: "Declares war on the Reactor Zone Union and demands all of its land."
 RUS_campaign_mlr_tt: "Declares war on the Little Lowland Republic and demands all of its land."
 RUS_campaign_ert_tt: "Declares war on the Eastern Republic and demands all of its land."
 RUS_campaign_irt_tt: "Declares war on the Inner Lands Republic and demands all of its land."
 RUS_campaign_sca_tt: "Declares war on the Southern Federation and demands all of its land."
 RUS_campaign_sla_border_tt: "Requires a land border with Starolesye."
 RUS_campaign_rza_border_tt: "Requires a land border with the Reactor Zone Union."
 RUS_campaign_mlr_border_tt: "Requires a land border with the Little Lowland Republic."
 RUS_campaign_ert_border_tt: "Requires a land border with the Eastern Republic."
 RUS_campaign_irt_border_tt: "Requires a land border with the Inner Lands Republic."
 RUS_campaign_sca_border_tt: "Requires a land border with the Southern Federation."
 RUS_proclaim_the_last_empire_available_tt: "Requires at least three Dirty Zone neighbours held, or no independent republics left there."
 RUS_proclaim_the_last_empire_prepared_tt: "Complete the military preparation first: The Second Aimaq Muster and Arm the Border Hosts provide five and three rifle brigades before the crisis begins."
 RUS_last_empire_cosmetic_tt: "The Land of the Khan raises the second standard. A Black Army lead names it the §YEmpire of the Black Banner§!; a scientist lead or a balance names it the §YLast Empire§!."
 RUS_proclaim_programme_tt:0 "§RThe final stage begins.§! If you control any reactor zone, proclamation immediately starts the orbital programme: §Y90 days§! until coalition intervention and §Y455 days§! until the strike. If the reactor perimeter is secured later, the countdown starts then. Winning the war does not stop the programme. The strike destroys the world and ends the regular campaign; losing the entire reactor perimeter permanently disables it."
 RUS_arm_the_border_hosts_tt: "Raises three rifle brigades in the capital from the mustered men and rifles."
 RUS_proclaim_the_last_empire_peace_tt: "Requires peace on every front, not only a closed Dirty Zone campaign."
 RUS_last_empire: "Last Empire"
 RUS_last_empire_ADJ: "Imperial"

