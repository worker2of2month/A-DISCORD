 VAD_oath_pending_order:0 "The chancery is preparing to restore order in a district."
 VAD_commandant_unrest_modifier_tt:0 "District unrest: §Y[?VAD_district_unrest|0]/100§!. At 100, a local uprising disables the commandanture benefits."
 VAD_district_unrest_status_tt:0 "Unrest in [FROM.GetName]: §Y[?FROM.VAD_district_unrest|0]/100§!. Monthly increase: §R[GetVADUnrestRate]§!. Uprising threshold: §Y100§!."
 VAD_unrest_rate_chancery:0 "10"
 VAD_unrest_rate_staff:0 "30"
 VAD_unrest_rate_regular:0 "20"
 VAD_restore_district_order:0 "Restore District Order"
 VAD_restore_district_order_desc:0 "The commandant has requested relief for the exhausted guards. Headquarters will send fresh teams, restore contact with the settlements and reopen the road to the district depots."
 VAD_district_order_available_tt:0 "The administration is active and fully holds the district with its commandanture; unrest is at least 40 and no other local operation is in progress."
 VAD_district_order_result_tt:0 "District unrest will fall by §G60§!, to a minimum of §Y0§!. The local uprising will end and the commandanture will remain and resume its work. Monthly unrest growth will continue."
 VAD_district_order_cost:0 "§Y25§! £political_power_texticon §Y500§! £population_texticon"
 VAD_district_order_cost_blocked:0 "§R25§! £political_power_texticon §R500§! £population_texticon"
 VAD_district_order_cost_tooltip:0 "§Y25§! £political_power_texticon §Y500§! £population_texticon"
 VAD_withdraw_district_commandant:0 "Withdraw the District Commandant"
 VAD_withdraw_district_commandant_desc:0 "Local elders are ready to reopen their offices if orders no longer bear the military commandant's signature. Headquarters will keep the district boundary on its maps but relinquish direct control over its economy."
 VAD_withdraw_commandant_available_tt:0 "The administration is active and fully holds the district with its commandanture; no paid local operation remains unfinished."
 VAD_withdraw_commandant_result_tt:0 "The commandanture, its benefits, unrest and local uprising will be removed. Previously invested resources are not refunded. A commandanture can be established again at its full price."
 ADISCORD_vorkerland_vad_district_uprising:0 "Uprising Against the Commandanture"
 VAD_district_uprising_tt:0 "The uprising disables local commandanture benefits. The district suffers §R-35%§! factory capacity, §R-30%§! local recruits, §R-25%§! local supplies and §R-10%§! controller army speed. Restoring order or withdrawing the commandant ends the crisis."
 ADISCORD_vorkerland_claimant.15.t:0 "The Districts Refuse to Obey"
 ADISCORD_vorkerland_claimant.15.d:0 "The first reports described a refusal to fulfil work orders. Then contact with the district depots went silent, barricades appeared at the checkpoints and the work crews went home. The commandants still hold their offices, but their orders no longer carry beyond the walls.\n\nHeadquarters demands reinforcements for the guards and the reopening of the roads. The chancery proposes recalling the most hated commandants and returning administration to local representatives. Each district will need its own decision."
 ADISCORD_vorkerland_claimant.15.a:0 "Review the district reports."

 VAD_crown_district_recruitment:0 "Crown District Levy"
 VAD_crown_district_recruitment_desc:0 "The chancery checks named warrants against the district charter. Local elders must release people from workshops and farms, recording each family's service in their books."
 VAD_joint_district_recruitment:0 "Joint Register Recruitment"
 VAD_joint_district_recruitment_desc:0 "Guard clerks and factory committees reconcile their rolls. The commandant demands that everyone still registered at a workshop report for service, while local representatives contest every name."
 VAD_crown_recruitment_available_tt:0 "We hold a chartered district that has not completed district recruitment and has no local operation in progress."
 VAD_joint_recruitment_available_tt:0 "We hold a commandant district that has not completed district recruitment, with no uprising or local operation in progress."
 VAD_crown_recruitment_site_tt:0 "There is an owned and controlled chartered district with an unused recruitment cohort."
 VAD_joint_recruitment_site_tt:0 "There is an owned and controlled commandant district with an unused recruitment cohort and no uprising."
 VAD_crown_recruitment_unlock_tt:0 "District charters will allow reserve recruitment at the expense of local factory capacity."
 VAD_joint_recruitment_unlock_tt:0 "Commandantures will be able to conduct expanded recruitment that raises local unrest."
 VAD_crown_recruitment_result_tt:0 "After preparation, Petrichev's District receives §G3000§! £population_texticon. The state loses §R10%§! local factory capacity while its civil-war administration remains active. Completed recruitment cannot be repeated in this state. Already recruited: §Y[?FROM.VAD_district_recruited|0]§! £population_texticon."
 VAD_joint_recruitment_result_tt:0 "After preparation, Petrichev's District receives §G4500§! £population_texticon. State unrest rises by §R30§!, up to §Y100§!, and may trigger an uprising. Completed recruitment cannot be repeated. Already recruited: §Y[?FROM.VAD_district_recruited|0]§! £population_texticon."
 VAD_recruitment_cancellation_tt:0 "Loss of ownership, control or the required administration, capitulation, subjugation and the end of the civil war cancel preparation and refund all political power and equipment. An uprising also cancels unfinished commandant recruitment. During a country handoff, the living successor receives the refund."
 VAD_crown_recruitment_disruption:0 "District Workers in Service"
 VAD_crown_recruitment_disruption_tt:0 "The state loses §R10%§! local factory capacity while its civil-war administration remains active."
 VAD_joint_recruitment_unrest_tt:0 "State unrest rises by §R30§!, up to §Y100§!. Reaching the threshold starts a local uprising; delivered recruits remain in the army."
 VAD_oath_pending_crown_recruitment:0 "Crown recruitment is in preparation. Paid: §Y[?VAD_oath_pp|0]§! £political_power_texticon §Y[?VAD_oath_support|0]§! £support_equipment_texticon."
 VAD_oath_pending_joint_recruitment:0 "Joint register recruitment is in preparation. Paid: §Y[?VAD_oath_pp|0]§! £political_power_texticon §Y[?VAD_oath_support|0]§! £support_equipment_texticon."
