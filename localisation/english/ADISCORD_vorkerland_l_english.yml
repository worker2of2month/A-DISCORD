 RUS_bunker_resupply_label:0 "Convoy: +[GetRUSBunkerConvoyAmount]\n[GetRUSBunker31pp]  [GetRUSBunkerFoodCash]"
 RUS_bunker_food_convoy:0 "Food Convoy"
 RUS_bunker_food_convoy_desc:0 "Trucks carrying grain, salt and preserved food unload at the upper airlock. Only complete shipments are accepted: the storehouse must have room for the whole delivery.\n\nThe convoy immediately adds §G40§! £supply_texticon (§G60§! after 'Heavy Freight Reserve') for §Y15§! £political_power_texticon and §Y500§! £ADISCORD_economy_treasury_texticon.\n\nEach fitted level consumes 1 food per week. An empty store means hunger: -5% army organisation and -5% stability. A store at least 75% full means the bunker is well fed: +5% stability and +5% reinforcement rate. Surplus can be sold to the aimaqs. Losing the bunker halts consumption and production; the remaining stockpile is preserved."
 RUS_bunker_food_convoy_available_tt:0 "The bunker is operational and the storehouse has room for the whole delivery: 40 £supply_texticon, or 60 after 'Heavy Freight Reserve'."
 RUS_bunker_food_convoy_tt:0 "Food reserve: §G+40§! £supply_texticon."
 RUS_bunker_food_convoy_large_tt:0 "Food reserve: §G+60§! £supply_texticon."
 RUS_bunker_rations_fed:0 "§GWell fed: +5% stability and reinforcement§!"
 RUS_bunker_food_sale:0 "Sell surplus to the aimaqs"
 RUS_bunker_food_sale_desc:0 "The bunker's stores are not bottomless: whatever does not fit spoils at the airlock. The aimaqs will gladly buy grain and preserves delivered at a fair price instead of by requisition. The sale empties the store and may end the bunker's well-fed state. Repeatable after 30 days."
 RUS_bunker_food_sale_available_tt:0 "The bunker is operational and holds at least 40 £supply_texticon."
 RUS_bunker_food_sale_cost:0 "§Y40§! £supply_texticon"
 RUS_bunker_food_sale_cost_blocked:0 "§R40§! £supply_texticon"
 RUS_bunker_food_sale_cost_tooltip:0 "Requires 40 £supply_texticon in the bunker store."
 RUS_bunker_food_sale_tt:0 "Treasury: §G+300§! £ADISCORD_economy_treasury_texticon."
 RUS_repair_depots_spirit:0 "Repair depots of the belt"
 RUS_repair_depots_spirit_desc:0 "Mobile crews repair machines on the shop floor instead of waiting for parts from the capital. The factories of the industrial belt run more evenly and keep their rhythm longer."
 RUS_strategic_freight_reserve_convoy_tt:0 "The food convoy delivers §G60§! £supply_texticon instead of 40 at the same price."
 RUS_bunker_food_cost:0 "[GetRUSBunker31pp]  [GetRUSBunkerFoodCash]"
 RUS_bunker_food_cost_blocked:0 "[GetRUSBunker31pp]  [GetRUSBunkerFoodCash]"
 RUS_bunker_food_cost_tooltip:0 "[GetRUSBunker31pp]  [GetRUSBunkerFoodCash]"
 RUS_bunker_rations_ok:0 "§GRations secured§!"
 RUS_bunker_rations_empty:0 "§RStarvation: no food§!"
 RUS_district_ledger:0 "One Ledger for All Aimaqs"
 RUS_district_ledger_desc:0 "The census gave every subject a name, but the districts still use incompatible records. A common supply ledger will connect workshops, stores, and the engineering service. Registered households support regular taxation, while new production standards feed into research.\n\nA balanced register replaces light dues. Other established tax policies are retained."
 RUS_courier_stations:0 "Stations of the Khan's Post"
 RUS_courier_stations_desc:0 "An order that arrives after winter is no longer an order. We will link district offices with regular motor mail and assign working vehicles to the dispatchers. Army couriers will be able to change crews and relay urgent reports at the same stations."
 RUS_district_paramedics:0 "A Medical Assistant for Every District"
 RUS_district_paramedics_desc:0 "Roadside clinics must keep working even when the capital forgets to send a doctor. District schools will train medical assistants familiar with local illnesses and military evacuation. Medical convoys will receive equipment from the centre, and new techniques will be shared throughout the service."
 RUS_covenant_of_service:0 "The Charter of Service"
 RUS_covenant_of_service_desc:0 "Loyalty to the Khan must outlast a change of commander. Pay, terms of service, and aid to families will be enshrined in a common charter; the aimaq courts will gain the right to demand its enforcement. We are buying not our subjects' silence, but their confidence that the state's word means something.\n\nBasic services replace charity relief. A more advanced welfare system is retained."
 RUS_recovery_depots:0 "Bring the Machines Back into Service"
 RUS_recovery_depots_desc:0 "The industrial belt now has enough factories for one faulty component to bring an entire district to a halt. A central repair depot will assemble mobile crews, a stock of tools and transport. The old cannery comes back first: the bunker needs food no less than the front needs machines."
 RUS_interchangeable_parts:0 "A Common Thread"
 RUS_interchangeable_parts_desc:0 "The Khan's workshops inherited dozens of incompatible standards. The board of engineers will approve common tolerances, dimensions, and drawings. Two rounds of retooling will gradually connect old machinery to new production without shutting down all industry for the sake of one model workshop."
 RUS_second_arsenal_shift:0 "The Arsenal's Second Shift"
 RUS_second_arsenal_shift_desc:0 "Mass production needs a line of its own, not a few night hours on someone else's machine. A new arms workshop in the capital district will begin producing components to common drawings. The state will expand the site in advance so that military orders do not displace civilian workshops."
 RUS_strategic_freight_reserve:0 "Heavy Freight Reserve"
 RUS_strategic_freight_reserve_desc:0 "A factory cannot help the front if its output stays on the loading platform. We will set aside a strategic reserve of locomotives and trucks from everyday freight. The same machines will run food convoys to the bunker: more cargo per trip and new stores at the airlock."
 RUS_field_evacuation_service:0 "Trains of Return"
 RUS_field_evacuation_service_desc:0 "A professional army has a duty to bring its wounded back from the front. Medical trains and field stations will receive equipment of their own; they will no longer have to be assembled from scratch before every war. Let a soldier's journey home begin at the forward dressing station."
 RUS_rifle_inspection_board:0 "Inspect the Khan's Arms"
 RUS_rifle_inspection_board_desc:0 "The different aimaqs brought different rifles and different habits into the army. An acceptance board will test the weapons' reliability in dust, frost, and long marches. Its findings will form the basis of the next weapon design, while the trial batches will replenish training stores."
 RUS_artillery_observers:0 "The Eyes of the Batteries"
 RUS_artillery_observers_desc:0 "Guns must fire where the enemy is now. Training batteries will receive their own observation teams, communications equipment, and practical fire-correction tables. Joint exercises for infantry and gunners will turn fire support from a matter of luck into a craft."
 RUS_staff_field_exercise:0 "Exercises Without Warning"
 RUS_staff_field_exercise_desc:0 "Headquarters will have to act without a predetermined ending: a lost crossing, broken communications, an unexpected offensive. The Khan will demand that mistakes be examined before the next war. A commander who can change his intentions on the march is worth more than a handsome plan on the wall."
 RUS_bunker_closed_cycle:0 "A Closed Food Cycle"
 RUS_bunker_closed_cycle_desc:0 "Five fitted levels already resemble a city, but a city eats every day. Mushroom chambers, food-waste processing, and strict sanitary controls will provide an additional weekly ration. This increase will be especially valuable if the third level houses an arsenal rather than grain chambers."
 RUS_bunker_reserve_turbine:0 "An Independent Turbine"
 RUS_bunker_reserve_turbine_desc:0 "Expanding the underground city should not begin every time by switching off the laboratory or the hospital. An additional turbine will have a separate power line and its own shift of mechanics. It will increase the complex's available power, leaving room for future upgrades to the levels."
 RUS_bunker_cold_stores:0 "Cold Stores"
 RUS_bunker_cold_stores_desc:0 "Today's surplus harvest is useless if it rots before the next interruption in supply. Insulated stores will increase the capacity of the food reserve. The builders will leave dry passageways for inspecting stocks: the underground city must account for and preserve its food, not simply pile it behind a door."
 RUS_bunker_machine_depot:0 "An Underground Machinery Reserve"
 RUS_bunker_machine_depot_desc:0 "Every lift, pump, and airtight door will one day need repairs. We will assemble a separate stock of tools for the engineering service so that fitting out the next level does not leave working rooms without maintenance. The delivery will enter the common equipment stockpile and can support paid construction work. A dedicated cash budget funds installation and modernization."
 RUS_bunker_emergency_rations:0 "Emergency Rations"
 RUS_bunker_emergency_rations_desc:0 "The stores are built: it is time to fill them. A purchased shipment of long-life food will replenish the underground reserve as far as its current capacity allows. This stockpile will buy time during a halt in production, but it will not end the steady consumption of food by the inhabitants of fitted levels."
 RUS_bunker_systems_college:0 "College of Underground Systems"
 RUS_bunker_systems_college_desc:0 "The bunker will outlive its creators only if the next shift understands how it works. Engineers will combine the plans for the power grid, ventilation, and workshops into a training course. Graduates will take that knowledge to surface enterprises and help improve industrial equipment throughout the country."
 RUS_bunker_food_output_focus_tt:0 "Bunker food production: §G+2§! £supply_texticon per week."
 RUS_bunker_power_focus_tt:0 "Bunker power capacity: §G+2§! £energy_consumption_texticon."
 RUS_bunker_food_capacity_focus_tt:0 "Food reserve capacity: §G+40§! £supply_texticon."
 RUS_bunker_food_reserve_focus_tt:0 "Reserve capacity: §G+20§! £supply_texticon. Stockpile: up to §G+40§! £supply_texticon within the new capacity. Any excess is lost."
