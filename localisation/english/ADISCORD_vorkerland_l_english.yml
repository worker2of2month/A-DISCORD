 ADISCORD_vorkerland_unaligned_solar_target_tt: "The Solarino victor is independent, has not capitulated and has not joined a coalition."

 faction_vorkerland_free_republics_league: "League of Free Republics"

 # Civil war, regional governments and reunification.
 ADISCORD_vorkerland_reactor_industrial_legacy: "Reactor Complex Legacy"
 ADISCORD_vorkerland_reactor_industrial_legacy_desc: "The industrial heart of old Vorkerland surrounded the zero-point reactor. Factory frames, abandoned machinery and technical warehouses retain enormous stocks of steel, aluminium, tungsten and chromium. Small batches of rare alloys and surviving precision components can also be recovered from the ruins. Salvage and reprocessing supply the region with valuable industrial materials."
 ADISCORD_vorkerland_reactor_industrial_legacy_tt:0 "$ADISCORD_vorkerland_reactor_industrial_legacy_desc$\n\nOnly surface scrap is worked today. The main deposits lie buried under collapsed halls; restoring the works returns them to the state's base resources."
 ADISCORD_vorkerland_zone_fragile_administration:0 "Scattered posts"
 ADISCORD_vorkerland_zone_fragile_administration_desc:0 "The republic rests on a handful of outposts, depots and stations scattered across contaminated land. It has no depth and no reserve institutions: losing a few settlements brings down the whole administration sooner than an ordinary state."
 ADISCORD_vorkerland_dirty_state: "Contaminated Territory"
 ADISCORD_vorkerland_dirty_state_desc: "This territory is contaminated and requires permanent restrictions on the use of its population, resources, construction and supply."
 ADISCORD_vorkerland_collapse_started: "Explosion in the Tower of Unity"
 ADISCORD_vorkerland_collapse_wars_started: "Vorkerland's Cascading Wars"
 ADISCORD_vorkerland_collapse_category: "War for Vorkerland"
 ADISCORD_vorkerland_collapse_category_desc: "After a brief mobilisation, the central claimants and peripheral states open several fronts at once. The Workers' Republic and Dorian Worx initially wage their own campaigns; their direct front opens only after a separate 45-day preparation period. Romelland and the Truman Republic may secure recognised coexistence; Vlad's restoration directorate refuses to recognise their independence."
 ADISCORD_vorkerland_erased_nations: "The Empire's Erased Peoples"
 ADISCORD_vorkerland_erased_nations_desc: "After the revolution, Vorkerland declared local languages, communal lands and indigenous names relics of the old world. Schools, resettlement and a unified register blurred the differences between peoples for decades. The collapse restored their right to speak for themselves, while leaving millions without a shared answer to who they now are."
 ADISCORD_vorkerland_erased_nations_relief_1: "Resettlement Archives Opened"
 ADISCORD_vorkerland_erased_nations_relief_1_desc: "The republic has acknowledged the secret registers and begun returning documents, names and communal land rights to families. Mistrust remains, but for the first time the state has stopped denying the problem itself."
 ADISCORD_vorkerland_erased_nations_relief_2: "Communal Councils Restored"
 ADISCORD_vorkerland_erased_nations_relief_2_desc: "Local councils have regained the right to use historical names, teach in their own languages and resolve land disputes. The consequences of past policy remain, but no longer define the republic's entire administration."
 ADISCORD_vorkerland_vad_imperial_chancery: "Chancellery of Continuous Authority"
 ADISCORD_vorkerland_vad_imperial_chancery_desc: "Vlad preserved the archives, personnel lists and protocols of the imperial administration. His staff makes decisions faster and plans operations better, but its habit of governing by decree irritates even its own supporters."
 ADISCORD_vorkerland_wkr_arsenal_command: "Arsenal Command"
 ADISCORD_vorkerland_wkr_arsenal_command_desc: "The emergency government immediately places factories, depots and headquarters on a wartime schedule. Production and offensives are more resilient than those of an improvised militia, but the civilian economy pays for a ready army."
 ADISCORD_vorkerland_republics_from_the_ruins: "Republics without a Metropole"
 ADISCORD_vorkerland_republics_from_the_ruins_desc: "With Vorkerland's collapse, the former autonomies no longer have to justify every law to a distant centre. Local councils, officers and communities argue over the future, but agree on one thing: the new republic must survive the war and prevent the capital from erasing its name again."
 ADISCORD_vorkerland_mobilized_periphery: "Mobilised Periphery"
 ADISCORD_vorkerland_mobilized_periphery_desc: "District warehouses, repair crews and local guards became the framework of a state within weeks. This improvised system conserves supplies and quickly returns units to service, but emergency administration bears down on civilian life."
 ADISCORD_vorkerland_tva_field_directorate: "Worx's Field Directorate"
 ADISCORD_vorkerland_tva_field_directorate_desc: "Dorian Worx placed university laboratories, the power grid and factory design bureaus under a single field headquarters. Prototypes reach the units quickly and the urban network supports several fronts, but civilian industry pays for this pace."
 ADISCORD_vorkerland_tva_field_directorate_2: "Unified Field Directorate"
 ADISCORD_vorkerland_tva_field_directorate_2_desc: "Frontline design bureaus, repair depots and dispatch offices no longer compete for the same machine tools. A single board allocates projects according to the armies' needs, shortening the delays between testing, production and delivery to the front."
 ADISCORD_vorkerland_tva_field_directorate_3: "Worx's Military Technical System"
 ADISCORD_vorkerland_tva_field_directorate_3_desc: "Dorian Worx has linked intelligence, design, production and supply into a single operational cycle. The system quickly corrects its own mistakes and gives the army a lasting advantage, but completes the subordination of the civilian economy to the logic of war."
 ADISCORD_vorkerland_tva_ideological_fanaticism: "Ideological Fanaticism"
 ADISCORD_vorkerland_tva_ideological_fanaticism_desc: "The directorate has declared Vorkensberg the final proof of technocracy's superiority. The city's headquarters are prepared to keep resisting after the outer districts fall, and surrender is treated as a betrayal of reason itself."
 ADISCORD_vorkerland_wrk_front_committees: "Front Committees"
 ADISCORD_vorkerland_wrk_front_committees_desc: "Local councils recruit additional troops, accelerate replacement training and return scattered units to service. The price is an increasingly severe mobilisation of civilian life."
 ADISCORD_vorkerland_wrk_rail_requisition: "Railway Reserve Requisition"
 ADISCORD_vorkerland_wrk_rail_requisition_desc: "Repair trains, warehouse tractors and departmental reserves have been transferred to the front. Supplies move faster, but the population sees the war consuming the last civilian reserves."
 ADISCORD_vorkerland_tva_grid_rerouting: "Urban Grid Rerouting"
 ADISCORD_vorkerland_tva_grid_rerouting_desc: "For several weeks, the directorate redirects power rings, repair depots and automated warehouses to the needs of selected fronts."
 ADISCORD_vorkerland_tva_logistics_disruption: "Disrupted Supply System"
 ADISCORD_vorkerland_tva_logistics_disruption_desc: "Vorkensberg specialists have infiltrated dispatch networks, falsified routing tables and disabled several repair centres. Orders and supplies reach the army dangerously late."
 ADISCORD_vorkerland_tva_prepared_defense: "Prepared Urban Defences"
 ADISCORD_vorkerland_tva_prepared_defense_desc: "The approaches to Vorkensberg have been divided into engineering sectors, warehouses dispersed, and garrisons deployed to protected positions in advance."
 ADISCORD_vorkerland_tva_fortress_garrisons: "Fortress Garrison Rotation"
 ADISCORD_vorkerland_tva_fortress_garrisons_desc: "Fresh units relieve exhausted troops in fortified strongpoints, maintaining the density of the defence without building new permanent lines."
 ADISCORD_vorkerland_btl_contract_support: "Bayrinzh Contract Corps"
 ADISCORD_vorkerland_btl_contract_support_desc: "Bayrinzh captains, instructors and logistics specialists work under a single military contract. Few in number, they nevertheless improve unit coordination and the speed of training."
 ADISCORD_vorkerland_btl_volunteer_contract: "Bayrinzh Commitment"
 ADISCORD_vorkerland_btl_volunteer_contract_desc: "The signed contract obliges Bayrinzh to maintain a field contingent on the side of its chosen client. The republic gains the right to send volunteer units immediately, regardless of world tension."
 ADISCORD_vorkerland_northern_operational_initiative: "Northern Operational Initiative"
 ADISCORD_vorkerland_northern_operational_initiative_desc: "One coalition concentrated transport, ammunition and staff officers in the decisive sector before its rivals. The advantage is temporary, but allows positional fighting to become a real advance."
 ADISCORD_vorkerland_val_contract_support: "Kefreyt Supply Line"
 ADISCORD_vorkerland_val_contract_support_desc: "Kefreyt has opened a paid channel for weapons, spare parts and warehouse specialists. The deliveries are modest by the standards of a major war, but noticeably ease pressure on industry and logistics."
 ADISCORD_vorkerland_eba_free_quays: "Ebern's Free Quays"
 ADISCORD_vorkerland_eba_free_quays_desc: "Macri's republic rests on port communities, private clubs, field hospitals and voluntary funds. This loose network recovers quickly from losses, though its citizens dislike war hysteria."
 ADISCORD_vorkerland_zta_golden_river_order: "Order of the Golden River"
 ADISCORD_vorkerland_zta_golden_river_order_desc: "Viktor Holt bound the river communities by an oath to restore indigenous names and defend the valley against new masters from the capital. The order attacks fiercely and clings to its land, but its harsh discipline divides society."
 ADISCORD_vorkerland_wpa_municipal_compact: "Norven Municipal Compact"
 ADISCORD_vorkerland_wpa_municipal_compact_desc: "Norven's towns preserved their elected councils, mutual aid warehouses and common militia. Reaching agreement takes time, but the population understands why it is defending the republic."
 ADISCORD_vorkerland_wps_factory_councils: "Holden Factory Councils"
 ADISCORD_vorkerland_wps_factory_councils_desc: "Engineers and workshop delegates manage production without a single directorate. Factories adapt quickly to military orders, but maintaining the council system consumes some civilian resources."
 ADISCORD_vorkerland_piv_macri_volunteer_mission: "Afrelan Mission in Ebern"
 ADISCORD_vorkerland_piv_macri_volunteer_mission_desc: "Afrela has opened recruitment of volunteers, instructors and medical teams for the Republic of Ebern. This assistance is intended to preserve a friendly hedonist republic on its border, but does not turn Vlad Macri into a dependent ruler."
 ADISCORD_vorkerland_consolidate_central_border: "Reunite Vorkerland's Heartland"
 ADISCORD_vorkerland_consolidate_central_border_desc: "Open fronts simultaneously against all neighbouring central states whose territory we claim. An existing war does not block this decision. The Workers' Republic and Dorian Worx cannot use it to declare war directly on one another."
 ADISCORD_vorkerland_prepare_worker_doctor_showdown: "Concentrate the Armies at the Final Border"
 ADISCORD_vorkerland_prepare_worker_doctor_showdown_desc: "One side has finished its initial wars. Over §Y45 days§!, the Workers' Republic and Dorian Worx will move divisions to their common border; the republic will then declare war on the Vorkensberg Directorate. The AI gives this front a high deployment priority but does not attack before the deadline."
 ADISCORD_vorkerland_open_regional_fronts: "Open the Regional Fronts"
 ADISCORD_vorkerland_open_regional_fronts_desc: "After the parties leave their former alliances, open all designated regional fronts. In the north, five republics will begin nine separate wars; in Ebern and Solarino, each of the three rivals will fight the other two."
 ADISCORD_vorkerland_raise_emergency_levies: "Deploy the Emergency Militia"
 ADISCORD_vorkerland_raise_emergency_levies_desc: "In §Y21 days§!, for §Y25§! £political_power_texticon, assemble two light local militia divisions in the capital. Available only once: this is a reserve to fill the front, rather than an unlimited source of troops."
 ADISCORD_vorkerland_rom_northern_intervention: "Frealor's Northern Operation"
 ADISCORD_vorkerland_rom_northern_intervention_desc: "An independent Frealor at peace will begin two limited wars for the Rimat Coast, Holden Plain and Eastern Autonomous Zone. §Y[72.GetName]§!, §Y[196.GetName]§! and §Y[322.GetName]§! must be occupied within §Y240 days§!; otherwise the operation ends without territorial gains."
 ADISCORD_vorkerland_wrk_activate_front_committees: "Convene the Front Committees"
 ADISCORD_vorkerland_wrk_activate_front_committees_desc: "Entrust local councils with additional recruitment and replacement training for §Y35 days§!. We receive manpower immediately, but lose some stability."
 ADISCORD_vorkerland_wrk_requisition_rail_stock: "Requisition the Railway Reserve"
 ADISCORD_vorkerland_wrk_requisition_rail_stock_desc: "Transfer departmental stocks, repair trains and 120 units of equipment to the army for §Y30 days§!. War support will fall slightly."
 ADISCORD_vorkerland_vad_open_imperial_registers: "Open the Imperial Registers"
 ADISCORD_vorkerland_vad_open_imperial_registers_desc: "Use reservist and transport archives to accelerate mobilisation and operational preparation for §Y35 days§!."
 ADISCORD_vorkerland_vad_form_field_commandantures: "Establish Field Commandant Offices"
 ADISCORD_vorkerland_vad_form_field_commandantures_desc: "For §Y35 days§!, establish fortified command centres and reserves in threatened sectors at the cost of some stability."
 ADISCORD_vorkerland_tva_reroute_city_grid: "Reroute the Urban Grid"
 ADISCORD_vorkerland_tva_reroute_city_grid_desc: "Direct Vorkensberg's power grid and repair capacity to the front for §Y28 days§! and produce §Y1200§! units of equipment."
 ADISCORD_vorkerland_tva_deploy_field_laboratories: "Deploy Field Laboratories"
 ADISCORD_vorkerland_tva_deploy_field_laboratories_desc: "Attach engineering teams to active units for §Y30 days§!, accelerating research, planning and offensive preparation."
 ADISCORD_vorkerland_tva_raise_technical_battalions: "Form Technical Battalions"
 ADISCORD_vorkerland_tva_raise_technical_battalions_desc: "For §Y40§! £political_power_texticon, form two inexpensive urban reserve units. Holden also receives a battalion if at war; Techlar can receive this assistance only once. The decision becomes available again after §Y120 days§!."
 ADISCORD_vorkerland_tva_disrupt_enemy_logistics: "Disrupt Enemy Logistics"
 ADISCORD_vorkerland_tva_disrupt_enemy_logistics_desc: "Disrupt the supply of every neighbouring state at war with Vorkensberg for §Y30 days§!. Another operation becomes possible after §Y60 days§!."
 ADISCORD_vorkerland_tva_infiltrate_wrk_rear: "Infiltrate $WRK$'s Rear"
 ADISCORD_vorkerland_tva_infiltrate_wrk_rear_desc: "Activate two pre-positioned cells in the Workers' Republic's mainland Southeastern and Oil and Gas Districts. This can be done only once. The detachments are small, but will force the enemy to divert troops from the front."
 ADISCORD_vorkerland_tva_infiltrate_vad_rear: "Infiltrate $VAD$'s Rear"
 ADISCORD_vorkerland_tva_infiltrate_vad_rear_desc: "Activate two pre-positioned cells in the mainland districts of Izaiya and Sutrtsy. This can be done only once. The detachments are small, but will disrupt command at the front."
 ADISCORD_vorkerland_tva_seal_city_approaches: "Seal the Approaches to Vorkensberg"
 ADISCORD_vorkerland_tva_seal_city_approaches_desc: "Once only, build four fort levels on three urban approaches and switch to the prepared defence plan for §Y60 days§!."
 ADISCORD_vorkerland_tva_rotate_fortress_garrisons: "Rotate the Fortress Garrisons"
 ADISCORD_vorkerland_tva_rotate_fortress_garrisons_desc: "Improve unit entrenchment and defence for §Y30 days§! without constructing additional permanent forts."
 ADISCORD_vorkerland_wrk_convene_front_soviets: "Convene the Congress of Front Councils"
 ADISCORD_vorkerland_wrk_convene_front_soviets_desc: "Over §Y60 days§!, agree on a common mobilisation procedure between councils, headquarters and party committees. This will ease the contradictions of the §Y'Home of the First Revolution'§! national spirit."
 ADISCORD_vorkerland_wrk_adopt_front_charter: "Adopt the Front Charter"
 ADISCORD_vorkerland_wrk_adopt_front_charter_desc: "Over §Y90 days§!, establish council representation, staff accountability and limits on emergency powers. The First Revolution spirit will become an advantage for the republic rather than a legacy of an unfinished transition."
 ADISCORD_vorkerland_tva_unify_front_bureaus: "Unify the Frontline Design Bureaus"
 ADISCORD_vorkerland_tva_unify_front_bureaus_desc: "Over §Y60 days§!, unite laboratories, repair depots and factory bureaus in a single board, improving §Y'Worx's Field Directorate'§!."
 ADISCORD_vorkerland_tva_close_operational_loop: "Complete the Operational Cycle"
 ADISCORD_vorkerland_tva_close_operational_loop_desc: "Over §Y90 days§!, connect intelligence, design, production and supply into Dorian Worx's single military technical system."
 ADISCORD_vorkerland_wrk_open_erased_archives: "Open the Resettlement Archives"
 ADISCORD_vorkerland_wrk_open_erased_archives_desc: "Over §Y90 days§!, acknowledge the secret registers, begin returning documents and take the first step towards reducing the consequences of erasing peoples. This political reform can be carried out during the war."
 ADISCORD_vorkerland_wrk_restore_displaced_councils: "Restore Communal Councils"
 ADISCORD_vorkerland_wrk_restore_displaced_councils_desc: "Over §Y120 days§!, return schools, names and limited land powers to local communities, further easing the national crisis."
 ADISCORD_vorkerland_wrk_enact_constitutional_guarantees: "Enshrine Constitutional Guarantees"
 ADISCORD_vorkerland_wrk_enact_constitutional_guarantees_desc: "Over §Y150 days§!, enshrine language, land and representation rights in the constitution and complete the dismantling of the old policy."
 ADISCORD_vorkerland_tva_integrate_wps: "Invite Holden into the Directorate"
 ADISCORD_vorkerland_tva_integrate_wps_desc: "Holden's factory councils have won in Norvein. Offer them autonomy under the protection of the Vorkensberg Directorate."
 ADISCORD_vorkerland_tva_integrate_tgd: "Invite Firnov-Techlar into the Directorate"
 ADISCORD_vorkerland_tva_integrate_tgd_desc: "The engineering college survived the struggle for the Ebern region. Bring its district into Dorian Worx's system as an autonomy."
 ADISCORD_vorkerland_restoration_coalition: "Coalition for Independent Reconstruction"
 ADISCORD_vorkerland_btl_support_wrk: "Contract with the Workers' Republic"
 ADISCORD_vorkerland_btl_support_wrk_desc: "Sell the services of Bayrinzh companies and instructors to $WRK$, open supply channels and send a volunteer contingent. This is a final choice of side in the war."
 ADISCORD_vorkerland_btl_support_vad: "Contract with Vlad"
 ADISCORD_vorkerland_btl_support_vad_desc: "Sell the services of Bayrinzh companies and instructors to the restoration directorate, open supply channels and send a volunteer contingent. This is a final choice of side in the war."
 ADISCORD_vorkerland_btl_support_tva: "Contract with Dorian Worx"
 ADISCORD_vorkerland_btl_support_tva_desc: "Sell the services of Bayrinzh companies and instructors to the Vorkensberg Directorate, open supply channels and send a volunteer contingent. This is a final choice of side in the war."
 ADISCORD_vorkerland_val_support_wrk: "Supply the Workers' Republic"
 ADISCORD_vorkerland_val_support_wrk_desc: "Open a Kefreyt arms supply line for $WRK$. No other main claimant will receive this contract."
 ADISCORD_vorkerland_val_support_vad: "Supply Vlad's Directorate"
 ADISCORD_vorkerland_val_support_vad_desc: "Open a Kefreyt arms supply line for the restoration directorate. No other main claimant will receive this contract."
 ADISCORD_vorkerland_val_support_tva: "Supply Dorian Worx"
 ADISCORD_vorkerland_val_support_tva_desc: "Open a Kefreyt arms supply line for the Vorkensberg Directorate. No other main claimant will receive this contract."
 ADISCORD_vorkerland_continue_reunification: "Continue Reunification"
 ADISCORD_vorkerland_continue_reunification_desc: "The central war gave us a claim to Vorkerland's inheritance, but did not hand us its territory. Open fronts against every available neighbouring state without waiting for other campaigns to end."
 ADISCORD_vorkerland_macri_piv_pact: "Conclude a Pact with Afrela"
 ADISCORD_vorkerland_macri_piv_pact_desc: "Ebern and Afrela will enter an equal defensive alliance. Macri's republic will remain independent."
 ADISCORD_vorkerland_restore_loyalist_district: "Return to Union with Vorkerland"
 ADISCORD_vorkerland_restore_loyalist_district_desc: "The regional war is won, and an independent Vorkerland has survived the catastrophe. Zaozersk or Volnograd may voluntarily restore their special district status while retaining their own administration. The Rimat Engineering Directorate cannot return to Vorkerland."
 ADISCORD_ivanland_prepare_northern_expedition: "Prepare the Northern Expedition"
 ADISCORD_ivanland_prepare_northern_expedition_desc: "Assign two civilian factories to supply the expeditionary corps for §Y120 days§!. If Itora retains the required army, manpower reserves and internal stability at the end of preparation, a limited §Y240-day§! intervention will begin automatically."
 ADISCORD_ivanland_limited_intervention: "Intervention in the Norvein Corridor"
 ADISCORD_ivanland_limited_intervention_desc: "The northern republics have temporarily suspended their internecine wars and created the §YNorthern Defence Front§!. Itora must physically occupy states §Y[90.GetName]§!, §Y[91.GetName]§!, §Y[93.GetName]§! and §Y[94.GetName]§! within §Y240 days§!.\n\n§GSuccess:§! §Y[90.GetName]§! and §Y[91.GetName]§! will form Matvey Mateuska's Norvein, and §Y[93.GetName]§! and §Y[94.GetName]§! Anton Selevyostrov's Krait Directorate. Both states will become separate clients of Itora.\n§RFailure:§! neither administration will be created, the territories will return to the northern republics, and Vadim Kulivanov will adopt statism. After the outcome, the surviving northerners will resume their interrupted wars."
 ADISCORD_vorkerland_collapse.80.t: "Expedition Cancelled"
 ADISCORD_vorkerland_collapse.80.d: "During preparation, Itora lost the strength or internal stability required for the northern operation. Headquarters is disbanding the expeditionary corps; there will be no second hidden deadline or automatic retry."
 ADISCORD_vorkerland_collapse.80.a: "Abandon the plan."
 ADISCORD_ivanland_second_intervention: "Intervene in the Northern Deadlock"
 ADISCORD_ivanland_second_intervention_desc: "If the Workers' Republic and Vlad's directorate continue fighting at §R100% exhaustion§!, and a surviving Vorkensberg has also reached §R100%§!, Itora will begin separate wars against Grain and the Rimat Engineering Directorate. A destroyed Vorkensberg is not counted."
 ADISCORD_ivanland_occupy_wrk_islands: "Occupy Remmel and Kairholm"
 ADISCORD_ivanland_occupy_wrk_islands_desc: "While the Workers' Republic's leadership is occupied with the civil war, land garrisons on the two isolated islands and transfer them to Itoran administration without declaring war. Cost: §Y50§! £political_power_texticon."
 ADISCORD_ivanland_guarantee_free_republics: "Guarantee the Free Republics"
 ADISCORD_ivanland_guarantee_free_republics_desc: "Before the civil war ends, guarantee the independence of Frealor and Zlatorechye for §Y100§! £political_power_texticon. Available only after Itora's successful intervention and the establishment of a common border with Frealor. If the guarantee is not issued before $WRK$ wins, each republic will separately either accept its former autonomous status or face a new war."
