 WKR_assault_column_order_tt:0 "Two councils leave the workshops. After training, WKR receives one assault column of six militia battalions in its capital, fully supplied with the paid personnel and rifles. Initial experience: §Y30%§!."
 WKR_assault_column_result_tt:0 "WKR receives one assault column in its capital: §Y6§! militia battalions, full strength and equipment, initial experience §Y30%§!."
 WKR_assault_column_pending:0 "Training §Y1§! assault column of §Y6§! militia battalions; §Y2§! councils committed. Paid: §Y[?WKR_council_order_pp|0]§! £political_power_texticon §Y[?WKR_council_order_manpower|0]§! £population_texticon §Y[?WKR_council_order_rifles|0]§! £infantry_equipment_texticon. This is a training order, not a deployed unit."
 WKR_assault_column_unit:0 "Workers' Assault Column"
