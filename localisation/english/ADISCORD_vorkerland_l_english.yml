 WKR_airfield_workshop:0 "Railway Council Aviation Workshop"
 WKR_airfield_workshop_desc:0 "Local workshops assign machinery and repair crews to the airfield facilities."
 WKR_airfield_workshop_district_tt:0 "A fully held owned supply hub has a railway council, an airbase and no aviation workshop yet."
 WKR_armoured_train_district_tt:0 "A fully held owned supply hub has a railway council and a military factory."
