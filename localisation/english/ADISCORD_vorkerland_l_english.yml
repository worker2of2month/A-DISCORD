 WRK_worx_two_crises_tt:0 "At least two crises of personal rule have occurred"
 WRK_worx_field_proven_tt:0 "At least one field programme has completed during a war"
 WRK_worx_no_emergency_tt:0 "No struggle for control of the institutes is underway"
