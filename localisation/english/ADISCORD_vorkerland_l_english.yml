 RUS_bunker_workshop_requirements_tt:0 "Required spare power capacity: 3. Once completed, this level uses 3 power and grants the permanent effects shown below. Only one room can be chosen on this level."
 RUS_bunker_granary_delta:0 "Grain Chambers"
 RUS_bunker_granary:0 "Level 3: Grain Chambers"
 RUS_bunker_granary_desc:0 "Dry chambers and stock records will spare the capital its panic buying. A good storehouse has no heroic appearance: it has a shelf life and a second key.\n\nDuration: 21 days. Required spare power capacity: 1. Once completed, this level uses 1 power and grants the permanent effects shown below. Only one room can be chosen on this level.\n$RUS_bunker_contract_tt$"
 RUS_bunker_granary_cost_pp_ok:0 "§Y25§! £political_power_texticon"
