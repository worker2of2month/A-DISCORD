# --- collapse_l_english ---
 ADISCORD_vorkerland_last_stand:0 "To the Last"
 ADISCORD_vorkerland_last_stand_desc:0 "Each claimant has sworn that no capital, archive, or field command will be surrendered while a final organised position remains. Defeat will come only after the state itself has been broken apart."
 ADISCORD_vorkerland_vad_imperial_registers:0 "Imperial Mobilisation Registers"
 ADISCORD_vorkerland_vad_imperial_registers_desc:0 "The chancery opens inherited transport, reserve, and depot registers, accelerating mobilisation and the preparation of deliberate operations."
 ADISCORD_vorkerland_vad_field_commandantures:0 "Field Commandantures"
 ADISCORD_vorkerland_vad_field_commandantures_desc:0 "A common network of forward command posts, fortified nodes, and reserve companies makes the defensive line denser and more responsive."
 ADISCORD_vorkerland_vad_standardized_logistics:0 "Standardised District Logistics"
 ADISCORD_vorkerland_vad_standardized_logistics_desc:0 "Common requisition forms, depot markings, and repair priorities reduce waste while damaged links are returned to service."
 ADISCORD_vorkerland_vad_prefectural_discipline:0 "Prefectural Discipline"
 ADISCORD_vorkerland_vad_prefectural_discipline_desc:0 "Reopened courts and recorded warrants let the restoration administration mobilise reserves without losing the operational plan in a thicket of rival orders."
 ADISCORD_vorkerland_vad_restoration_war_cabinet:0 "Restoration War Cabinet"
 ADISCORD_vorkerland_vad_restoration_war_cabinet_desc:0 "Vlad's permanent emergency cabinet joins law, mobilisation, and field command in one forceful chain. It plans and mobilises quickly, but its tightening rule strains public confidence."
 ADISCORD_vorkerland_vad_dual_authority_protocol:0 "Dual Authority Protocol"
 ADISCORD_vorkerland_vad_dual_authority_protocol_desc:0 "Worcker delegates retain civil oversight while the restoration staff controls operations. Recorded boundaries keep the two authorities from issuing contradictory orders."
 ADISCORD_vorkerland_vad_solar_corridor_intelligence:0 "Solar Corridor Intelligence"
 ADISCORD_vorkerland_vad_solar_corridor_intelligence_desc:0 "Bridge surveys, route tables, and political dossiers expose the weak points of both rival successor governments in Solarino."
 ADISCORD_vorkerland_vad_restoration_columns:0 "Restoration Columns"
 ADISCORD_vorkerland_vad_restoration_columns_desc:0 "Mobile supply, repair, and administrative teams are staged to follow an advance and keep its road network working."
 ADISCORD_vorkerland_tva_unattended_shifts:0 "Instrumented Unattended Shifts"
 ADISCORD_vorkerland_tva_unattended_shifts_desc:0 "Automated gauges and strict tolerances let selected lines run with smaller night crews, increasing output at the cost of breakdowns and civic strain.\n\n\n\n\n\n £GFX_ADISCORD_automation_banner \n\n\n"
 ADISCORD_vorkerland_tva_algorithmic_fire_plans:0 "Algorithmic Fire Plans"
 ADISCORD_vorkerland_tva_algorithmic_fire_plans_desc:0 "A central board converts observation, ammunition, and movement data into coordinated schedules for the directorate's batteries."
 ADISCORD_vorkerland_tva_bunker_specialist_cadres:0 "Bunker Specialist Cadres"
 ADISCORD_vorkerland_tva_bunker_specialist_cadres_desc:0 "Small engineering cadres survey urban strongpoints, improve existing cover, and train garrisons to exploit each prepared position."
 ADISCORD_vorkerland_tva_standardized_assault_teams:0 "Standardised Assault Teams"
 ADISCORD_vorkerland_tva_standardized_assault_teams_desc:0 "Technical battalions use common team tables and replacement drills, letting shattered assault groups return to action without improvised reorganisation."
 ADISCORD_vorkerland_tva_networked_observation_posts:0 "Networked Observation Posts"
 ADISCORD_vorkerland_tva_networked_observation_posts_desc:0 "Redundant field lines and measured reference points turn local observers into a responsive defensive and fire-control network."
 ADISCORD_vorkerland_tva_modular_repair_mandate:0 "Modular Repair Mandate"
 ADISCORD_vorkerland_tva_modular_repair_mandate_desc:0 "Field depots replace standard assemblies instead of rebuilding each machine in place, reducing delay, waste, and equipment losses.\n\n\n\n\n\n £GFX_ADISCORD_automation_banner \n\n\n"
 ADISCORD_vorkerland_tva_interchangeable_repair_modules:0 "Interchangeable Repair Modules"
 ADISCORD_vorkerland_tva_interchangeable_repair_modules_desc:0 "Published tolerances and shared workshop sheets let directorate depots reproduce the same repair assemblies across the entire network.\n\n\n\n\n\n £GFX_ADISCORD_automation_banner \n\n\n"
 ADISCORD_vorkerland_tva_prepositioned_switching_crews:0 "Pre-positioned Switching Crews"
 ADISCORD_vorkerland_tva_prepositioned_switching_crews_desc:0 "Mobile technicians and protected route tables stand ready to redirect rail traffic and power as the operational axis changes."
 ADISCORD_vorkerland_worx_adaptive_logistics_trial:0 "Adaptive Logistics Trial"
 ADISCORD_vorkerland_worx_adaptive_logistics_trial_desc:0 "Mobile repair teams test flexible depots, rerouted convoys and rolling maintenance schedules, keeping formations supplied while the network is under strain."
 ADISCORD_vorkerland_worx_second_protocol:0 "The Second Protocol"
 ADISCORD_vorkerland_worx_second_protocol_desc:0 "Worx's headquarters turns validated field trials into a lean campaign system built around repair columns, predictive routing, and tightly staged offensives."
 ADISCORD_vorkerland_tva_field_laboratories:0 "Field Laboratories"
 ADISCORD_vorkerland_tva_field_laboratories_desc:0 "Engineering teams test communications, ammunition, and assault equipment directly with formations in the field.\n\n\n\n\n\n £GFX_ADISCORD_vorkerland_tva_field_laboratories_banner \n\n\n"
 IBA_organize_transitional_council:0 "Organise the Transitional Council"
 IBA_organize_transitional_council_desc:0 "Mateusk must turn the corridor's provisional administration into a functioning cabinet and divide authority among its local communities."
 ADISCORD_vorkerland_civil_war_exhaustion:0 "Civil War Exhaustion"
 ADISCORD_vorkerland_civil_war_exhaustion_desc:0 "The prolonged struggle for central Vorkerland and each new wave of losses exhaust this side of the conflict. Exhaustion does not recede between fronts and disappears only after the central struggle is conclusively settled.\n\n\n\n\n\n £GFX_ADISCORD_vorkerland_civil_war_exhaustion_banner \n\n\n"
 ZAO_keep_the_western_registers_running:0 "Keep the Western Registers Running"
 ZAO_keep_the_western_registers_running_desc:0 "Bassam Zogby's administration cannot afford grand declarations while the old state is coming apart. Payrolls, ration lists and municipal orders must continue to move between offices, even if the capital no longer answers."
 ZAO_open_the_railway_storehouses:0 "Open the Railway Storehouses"
 ZAO_open_the_railway_storehouses_desc:0 "The western railway depots contain enough rifles, fuel and spare parts for a local defence, but only if their scattered inventories are brought under civilian accounting before rival commands strip them bare."
 ZAO_form_municipal_defence_boards:0 "Form Municipal Defence Boards"
 ZAO_form_municipal_defence_boards_desc:0 "Town councils will register volunteers, establish guarded communication posts and coordinate reserves with the remaining regular officers. The boards answer to the civil administration, not to an improvised military junta."
 ZAO_keep_zaozersk_sovereign:0 "Keep Zaozersk Sovereign"
 ZAO_keep_zaozersk_sovereign_desc:0 "Survival has given the western administration a mandate no distant claimant can simply revoke. Zaozersk will cooperate with its neighbours, but its registers, councils and armed forces will remain under its own law."
 ADISCORD_vorkerland_civil_war_exhaustion_score_tt:0 "Current exhaustion: §Y[?ADISCORD_vorkerland_civil_war_exhaustion|0]/100§!"
 ADISCORD_vorkerland_organized_defence:0 "Organised Defence"
 ADISCORD_vorkerland_organized_defence_desc:0 "There is nowhere left to fall back to, and that simplifies every decision. Staffs stop arguing about offensives, rear units go into the trenches alongside the line, and the depots held back for better days are opened today. Resistance on the edge of defeat is always more stubborn than resistance in the middle of a winning campaign, which is exactly why finishing a claimant off is harder than pushing one back."
 ADISCORD_vorkerland_legitimacy_dynamic:0 "Legitimacy of the Claim"
 ADISCORD_vorkerland_legitimacy_dynamic_desc:0 "No side inherited an undisputed right to speak for Workerland, so each proves it differently: the worker councils through working factories, the restoration through holding the historic capitals, the directorate through research and reconstruction. Recognition by the population, the army and the districts resolves into a single figure: the higher it stands, the more willingly people fight for this authority and the quieter the home front stays. Lost legitimacy returns more slowly than it is spent."
 ADISCORD_vorkerland_legitimacy_score_tt:0 "Legitimacy: §Y[?ADISCORD_vorkerland_legitimacy|2]§! §G(-1.00 to 1.00)§!"
 ADISCORD_vorkerland_join_claimant_coalition:0 "Place Ourselves Under [From.GetADISCORDDecisionCountryName]"
 ADISCORD_vorkerland_join_claimant_coalition_desc:0 "Our own quarrel is over. The neighbouring administration that disputed our authority no longer fights under its own flag, and the district staff can look beyond the next valley for the first time since the old state came apart. A central claimant is still fighting for Vorkerland as a whole, and it will accept us as a partner rather than as occupied ground: our officers keep their commands, our councils keep their registers, and our divisions take their place on the coalition's front instead of opening a war of our own. Nothing about this is charity on either side. They need the manpower of a region that has already proved it can hold ground, and we need a capital that can still issue equipment."
 ADISCORD_vorkerland_join_claimant_coalition_tt:0 "Join §Y[From.GetName]§! and fight on their side. [GetVorkerlandCoalitionSettlement] The federal capital passes to restored Vorkerland. While our coalition is at war, its leader's capitulation does not end our struggle."
 faction_vorkerland_emergency_coalition:0 "Emergency Committee Coalition"
 faction_vorkerland_central_administration_bloc:0 "Central Administration Bloc"
 faction_vorkerland_directorate_union:0 "Directorate Union"
 ADISCORD_vorkerland_regional_autonomy:0 "Regional Autonomy"
 ADISCORD_vorkerland_regional_autonomy_desc:0 "This district is administered by people who were born in it. Depots, rail sidings and reserve lists were drawn up by the same officials who now command them, and every road is known before it appears on a map. Nothing is being built here for the duration of the war, because the workshops that would have raised new plant are turning out cartridges and boots instead. The advantage exists only on this ground: it belongs to the state, not to the army, so a claimant that takes the district takes an ordinary province and not our homeground."
 ADISCORD_vorkerland_macri_volunteer_corps:0 "Afrelan Volunteer Corps"
 ADISCORD_vorkerland_macri_volunteer_corps_desc:0 "Afrela has decided that Vlad Macri's survival is worth more than a token gesture. The corps is recruited openly, shipped as a formed contingent instead of a trickle of stragglers, and the requirement to hold back a home army has been waived for the duration of the Ebern emergency."
 ADISCORD_vorkerland_civil_war_attrition:0 "Central Front Attrition"
 ADISCORD_vorkerland_collapse.100.t:0 "The Victor's Mandate"
 ADISCORD_vorkerland_collapse.100.d:0 "The republican government holds the centre again, but Nikita Worcker's emergency mandate has not yet become a permanent settlement. The commissions are ready to open the polling stations. Worcker can instead confirm his power by decree and close the question of succession."
 ADISCORD_vorkerland_collapse.100.a:0 "Open the polling stations."
 ADISCORD_vorkerland_collapse.100.b:0 "Confirm power by decree."
 ADISCORD_vorkerland_wrk_hold_elections_tt:0 "In §Y14 days§! the commissions will announce a winner. §YNikita Worcker§! (§Yneo-vorkerism§!), §YMark Yastrebtsev§! (§Yhumanism§!) and §YNecro Filopo§! (§Ychauvinism§!) each have an equal chance."
 ADISCORD_vorkerland_collapse.101.t:0 "Election Results"
 ADISCORD_vorkerland_collapse.101.worker.d:0 "The commissions have tallied the returns and declared Nikita Worcker the winner. Neo-vorkerism remains the ruling ideology, and the emergency cabinet now holds an electoral mandate rather than a decree."
 ADISCORD_vorkerland_collapse.101.yastrebtsev.d:0 "The commissions have tallied the returns and declared Mark Yastrebtsev the winner. Humanism becomes the ruling ideology, and Worcker yields the cabinet to the published result."
 ADISCORD_vorkerland_collapse.101.filopo.d:0 "The commissions have tallied the returns and declared Necro Filopo the winner. Chauvinism becomes the ruling ideology, and Worcker yields the cabinet to the published result."
 ADISCORD_vorkerland_collapse.101.a:0 "Accept the published result."

# --- diplomacy_l_english ---
 ADISCORD_vorkerland_diplomacy.19.t:0 "An Offer of Coalition"
 ADISCORD_vorkerland_diplomacy.19.d:0 "Envoys from [VAD.GetName] have arrived with a draft military treaty. They acknowledge that victory in the local war gives our authorities the right to speak for the district, but warn that the struggle for all of Vorkerland still lies ahead.\n\nThe delegation proposes coordinating command and taking the field together. The chancery calls this a guarantee of our place in the country's future settlement; the staff puts it more plainly: an allied front must withstand the blow as a whole. Signing the treaty will publicly commit us to a side."
 ADISCORD_vorkerland_diplomacy.19.close:0 "We will not sign the treaty now."
 ADISCORD_vorkerland_diplomacy.19.accept:0 "Conclude the military alliance."
 ADISCORD_vorkerland_diplomacy.20.t:0 "An Invitation to VAD's Front"
 ADISCORD_vorkerland_diplomacy.20.d:0 "The government of [VAD.GetName] offers to receive our military observers. The delegation is promised access to field headquarters and discussions with officers who took part in the operations.\n\nOur officers will be able to compare official reports with the condition of the army. The hosts have their own interests: a professional review of their battles and foreign testimony that their authority exists beyond the chancery's declarations. The embassy awaits a decision on the mission."
 ADISCORD_vorkerland_diplomacy.20.close:0 "Decline the invitation."
 ADISCORD_vorkerland_diplomacy.20.accept:0 "Send the observers."

 ADISCORD_vorkerland_regional_diplomacy_category: "Allies Beyond the Central Front"
 ADISCORD_vorkerland_regional_diplomacy_category_desc: "The sovereign victors in Solarino and Volnograd may join a claimant before or during the final war. Their answer never delays the central showdown."
 ADISCORD_vorkerland_vad_invite_victorious_sol: "Offer Solarino a Protectorate"
 ADISCORD_vorkerland_vad_invite_victorious_sol_desc: "Solarino has won its own war. We can recognise its local government and offer subordination to Armi within the restoration alliance. Velin remains part of Solarino, whose overlord will become the reunited Vorkerland."
 ADISCORD_vorkerland_wkr_invite_victorious_vla: "Invite the Volnograd Republic"
 ADISCORD_vorkerland_wkr_invite_victorious_vla_desc: "A victorious Volnograd can join the free republics rather than stand alone."
 ADISCORD_vorkerland_vad_restore_sol_by_force: "Restore Solarino by Force"
 ADISCORD_vorkerland_vad_restore_sol_by_force_desc: "The loyalists were defeated. Once Armi reaches the Solar frontier, it can overthrow an unaligned local victor and restore Solarino as a protectorate. Preparation takes 7 days. Cancellation or failed war entry refunds all §Y50§! £political_power_texticon."
 ADISCORD_vorkerland_wkr_counter_solar_restoration: "Challenge the Solar Protectorate"
 ADISCORD_vorkerland_wkr_counter_solar_restoration_desc: "A puppet government installed by Armi on our border cannot be ignored. This intervention accelerates the general three-way showdown instead of opening an isolated war."
 ADISCORD_vorkerland_solar_counter_preparation: "Solar Counter-Intervention Preparations"
 ADISCORD_vorkerland_solar_restoration_alliance: "Solar Restoration Alliance"
 ADISCORD_vorkerland_free_republics_alliance: "League of Free Republics"
 SOL_vorkerland_worker_protectorate: "Solarino Worcker Protectorate"
 SOL_vorkerland_worker_protectorate_DEF: "the Solarino Worcker Protectorate"
 SOL_vorkerland_worker_protectorate_ADJ: "Solarino"
 SOL_vorkerland_restoration_administration: "Solarino Administration"
 SOL_vorkerland_restoration_administration_DEF: "the Solarino Administration"
 SOL_vorkerland_restoration_administration_ADJ: "Solarino"
 ADISCORD_vorkerland_diplomacy.2.t: "The Armi Invitation"
 ADISCORD_vorkerland_diplomacy.2.d: "The government in Armi offers to recognise our victory and coordinate the struggle for Vorkerland. The agreement preserves Solarino's local government and Velin within its territory, but makes the republic a puppet of Armi. After reunification, this dependency passes to Vorkerland. If the central war has already begun, our army will join Armi's active fronts."
 ADISCORD_vorkerland_diplomacy.2.a: "Accept Armi's protectorate"
 ADISCORD_vorkerland_diplomacy.2.b: "Solarino stands alone"
 ADISCORD_vorkerland_diplomacy.3.t: "The Workerland Invitation"
 ADISCORD_vorkerland_diplomacy.3.d: "The worker republic's emergency government proposes a League of Free Republics. Volnograd remains sovereign and will join its ally's active fronts even if the final confrontation is already under way."
 ADISCORD_vorkerland_diplomacy.3.a: "Join the league"
 ADISCORD_vorkerland_diplomacy.3.b: "Decline the pact"
 RECALL_VOLUNTEERS_TITLE: "Recall Volunteers"
 RECALL_VOLUNTEERS_ACTION_DESC: "Immediately recall the volunteer contingent we sent to this country."
 RECALL_VOLUNTEERS_TOOLTIP: "§Y[This.GetNameWithFlag]§!: §Rthere are no volunteers from us here to recall.§!"
 RECALL_VOLUNTEERS_TOOLTIP_G: "§Y[This.GetNameWithFlag]§!: recall our volunteer contingent."
 ADISCORD_dirty_zone_title_tt: "§YExclusion Zone§!"
 ADISCORD_dirty_zone_desc_tt: "No central authority exists here. The surviving settlements are isolated from one another, and the contaminated territory remains closed to the outside world."
 ADISCORD_dirty_zone_diplomacy_tt: "Ordinary diplomatic relations cannot be conducted with this territory."
 ADISCORD_DIRTY_ZONE_SCREEN_TITLE: "EXCLUSION ZONE"
 ADISCORD_DIRTY_ZONE_SCREEN_STATUS: "§RACCESS DENIED§!"
 ADISCORD_DIRTY_ZONE_PROTOCOL_TITLE: "QUARANTINE PROTOCOL NO. 7"
 ADISCORD_DIRTY_ZONE_PROTOCOL_DESC: "No unified government or verified diplomatic address exists. Crossing the outer perimeter is prohibited until further notice."
 ADISCORD_DIRTY_ZONE_SIGNAL_TITLE: "CHANNEL STATUS"
 ADISCORD_DIRTY_ZONE_SIGNAL_STATUS: "§G> RECEIVING SIGNAL...§!\n§R> ORIGIN INSIDE CLOSED SECTOR.§!"
 ADISCORD_DIRTY_ZONE_SIGNAL_DESC: "An automated station is receiving fragmented emergency transmissions. The sender, authority, and coordinates cannot be verified; no two-way link has been established."
 ADISCORD_DIRTY_ZONE_LOCK_STATUS: "§RDIPLOMATIC ACTIONS LOCKED§!"
 ADISCORD_DIPLOMACY_RELATIONS_HEADER: "TIES AND OBLIGATIONS"
 ADISCORD_DIPLOMACY_ACTIONS_HEADER: "DIPLOMATIC CHANNELS"

# --- focus_decisions_l_english ---
 ADISCORD_vorkerland_focus_operations_category:0 "The Last Vorkerland Campaign"
 ADISCORD_vorkerland_focus_operations_category_desc:0 "Early district campaigns, civil integration of secured territory, and preparations for the final war between the claimants."
 ADISCORD_vorkerland_allied_support_category:0 "Support the Allied Front"
 ADISCORD_vorkerland_allied_support_category_desc:0 "Limited deliveries to an existing wartime ally. These measures neither create alliances nor pull neutral countries into a war."

 ADISCORD_vorkerland_focus_central_minor_front_deadline:0 "A Protracted Campaign Wave"
 ADISCORD_vorkerland_focus_central_minor_front_deadline_desc:0 "The command tracks every war opened by this wave. After 240 days the operational record is retired, but every live front continues until a real capitulation or peace."

 ADISCORD_vorkerland_launch_central_minor_wave_target_tt:0 "An adjacent independent central-campaign country is outside factions and claimant wars, and is open to our advance"
 ADISCORD_vorkerland_launch_central_minor_wave_recovery_tt:0 "Recovery after the previous wave is complete"
 ADISCORD_vorkerland_launch_central_minor_wave_pending_tt:0 "No launch of another wave is pending"
 ADISCORD_vorkerland_launch_central_minor_wave_deadline_tt:0 "The previous campaign wave has been closed"
 ADISCORD_vorkerland_launch_central_minor_wave_peace_tt:0 "Not at war with the central-campaign countries"
 ADISCORD_vorkerland_launch_central_minor_wave:0 "Open the Central Campaign Wave"
 ADISCORD_vorkerland_launch_central_minor_wave_desc:0 "After a one-day operational pause, declare war simultaneously on every viable central government along our present border. A new wave can begin only after all recorded fronts end and the army regroups."
 ADISCORD_vorkerland_integrate_eyr_district:0 "Establish the Eyrmi Civil Administration"
 ADISCORD_vorkerland_integrate_eyr_district_desc:0 "Register the population, reopen the district offices, and incorporate all secured Eyrmi territory into our administration."
 ADISCORD_vorkerland_integrate_egc_district:0 "Establish the Zshat Civil Administration"
 ADISCORD_vorkerland_integrate_egc_district_desc:0 "Replace the dissolved garrison command with ordinary district institutions across all secured Zshat territory."
 ADISCORD_vorkerland_integrate_riv_district:0 "Establish the Riven Civil Administration"
 ADISCORD_vorkerland_integrate_riv_district_desc:0 "Restore district government and incorporate all secured Riven territory into our administration."
 ADISCORD_vorkerland_integrate_rev_district:0 "Establish the Revel Civil Administration"
 ADISCORD_vorkerland_integrate_rev_district_desc:0 "Restore district government and incorporate all secured Revel territory into our administration."
 ADISCORD_vorkerland_integrate_yor_district:0 "Establish the Yor Civil Administration"
 ADISCORD_vorkerland_integrate_yor_district_desc:0 "Restore district government and incorporate all secured Yor territory into our administration."
 ADISCORD_vorkerland_integrate_ndn_district:0 "Establish the Norden Civil Administration"
 ADISCORD_vorkerland_integrate_ndn_district_desc:0 "Restore local institutions and incorporate the fully secured Norden district into our administration."
 ADISCORD_vorkerland_integrate_swb_district:0 "Establish the Old Vorkensberg Administration"
 ADISCORD_vorkerland_integrate_swb_district_desc:0 "Restore local institutions and incorporate the fully secured Old Vorkensberg district into our administration."
 ADISCORD_vorkerland_integrate_vhv_district:0 "Establish the Verkhovye Civil Administration"
 ADISCORD_vorkerland_integrate_vhv_district_desc:0 "Restore district government and incorporate all secured Verkhovye territory into our administration."
 ADISCORD_vorkerland_integrate_osv_district:0 "Establish the Ostvin Civil Administration"
 ADISCORD_vorkerland_integrate_osv_district_desc:0 "Restore district government and incorporate all secured Ostvin territory into our administration."
 ADISCORD_vorkerland_integrate_central_district_tt:0 "After the work is complete, the district becomes core territory if its former government is gone and we still own and control the entire district. Failure refunds the full payment. Restoring Vorkerland cancels unfinished integration and refunds it to the successor government."
 ADISCORD_vorkerland_central_showdown_command_ready_tt:0 "The claimant has authorised the final war and prepared its central front"
 ADISCORD_vorkerland_central_showdown_campaigns_closed_tt:0 "All nine district campaigns are closed and the seven-day launch cooldown has expired"
 ADISCORD_vorkerland_central_districts_integrated_tt:0 "All nine central districts are integrated and remain owned and controlled by the three claimants"
 ADISCORD_vorkerland_central_showdown_no_live_intervention_tt:0 "No separate claimant intervention is still active in Solarino"
 ADISCORD_vorkerland_commit_to_central_showdown:0 "Commit to the Central Showdown"
 ADISCORD_vorkerland_commit_to_central_showdown_desc:0 "Order the central war before the common deadline. Independent districts keep their territory and coalition allies enter the same war. Civil integration of conquered districts remains a separate process that can continue after victory."
 ADISCORD_vorkerland_wkr_retreat_levy_1:0 "Call the First Worcker Retreat Levy"
 ADISCORD_vorkerland_wkr_retreat_levy_1_desc:0 "After seven days, one under-equipped militia detachment will assemble at our still-controlled capital."
 ADISCORD_vorkerland_wkr_retreat_levy_2:0 "Call the Last Worcker Reserve"
 ADISCORD_vorkerland_wkr_retreat_levy_2_desc:0 "A final and weaker capital reserve. No further levies can be raised through this line."
 ADISCORD_vorkerland_vad_retreat_levy_1:0 "Call the First Chancery Retreat Levy"
 ADISCORD_vorkerland_vad_retreat_levy_1_desc:0 "After seven days, one under-equipped security detachment will assemble at our still-controlled capital."
 ADISCORD_vorkerland_vad_retreat_levy_2:0 "Call the Last Chancery Reserve"
 ADISCORD_vorkerland_vad_retreat_levy_2_desc:0 "A final and weaker capital reserve. No further levies can be raised through this line."
 ADISCORD_vorkerland_tva_retreat_levy_1:0 "Call the First Technical Retreat Levy"
 ADISCORD_vorkerland_tva_retreat_levy_1_desc:0 "After seven days, one under-equipped technical militia detachment will assemble at our still-controlled capital."
 ADISCORD_vorkerland_tva_retreat_levy_2:0 "Call the Last Technical Reserve"
 ADISCORD_vorkerland_tva_retreat_levy_2_desc:0 "A final and weaker capital reserve. No further levies can be raised through this line."
 ADISCORD_vorkerland_vad_continue_imperial_reunification:0 "Continue the Imperial Reunification"
 ADISCORD_vorkerland_vad_continue_imperial_reunification_desc:0 "Victory over the central claimants did not restore the whole country. The Imperial Chancery will press the surviving administrations of former Vorkerland one at a time, avoiding a wasteful web of simultaneous wars."
 ADISCORD_vorkerland_restore_core_claimant_homes:0 "Restore the Claimant Homelands"
 ADISCORD_vorkerland_restore_core_claimant_homes_desc:0 "Restore the heartlands of the three wartime governments after every listed state is again owned and controlled by the reunited country."
 ADISCORD_vorkerland_restore_core_central_historical:0 "Restore the Historical Centre"
 ADISCORD_vorkerland_restore_core_central_historical_desc:0 "Re-establish the restored state's administration across the historical centre, independently of the outlying territories."
 ADISCORD_vorkerland_restore_core_oitfort:0 "Integrate Oitfort"
 ADISCORD_vorkerland_restore_core_oitfort_desc:0 "Oitfort is already part of reunited Vorkerland after the wartime technical committee is dissolved. Once the state is fully owned and controlled by the central government, it can be restored as national territory."
 ADISCORD_vorkerland_restore_core_rimat:0 "Integrate Rimat"
 ADISCORD_vorkerland_restore_core_rimat_desc:0 "Restore Rimat as a national territory after the reunited state secures full ownership and control."
 ADISCORD_vorkerland_restore_core_techlar:0 "Integrate Techlar"
 ADISCORD_vorkerland_restore_core_techlar_desc:0 "Restore Techlar as a national territory after the reunited state secures full ownership and control."
 ADISCORD_vorkerland_restore_core_ebern:0 "Integrate Ebern"
 ADISCORD_vorkerland_restore_core_ebern_desc:0 "Restore Ebern as a national territory after the reunited state secures full ownership and control."
 ADISCORD_vorkerland_restore_core_solar:0 "Integrate the Solar District"
 ADISCORD_vorkerland_restore_core_solar_desc:0 "Restore the three Solarino-district cores after all three states are owned and controlled; no surviving Solarino government is required."
 ADISCORD_vorkerland_recognize_free_republics:0 "Recognise the Free Republics"
 ADISCORD_vorkerland_recognize_free_republics_desc:0 "Formally recognise the surviving independent republics of Frealor and Zlatorech and conclude non-aggression pacts with them."
 ADISCORD_vorkerland_send_vla_support_tranche_1:0 "Supply the Volnograd Auxiliary Front"
 ADISCORD_vorkerland_send_vla_support_tranche_1_desc:0 "After concluding an alliance with Volnograd, transfer 3000 £infantry_equipment_texticon and 30 £support_equipment_texticon to its active front. A second delivery cannot be prepared for 90 days."
 ADISCORD_vorkerland_send_vla_support_tranche_2:0 "Renew Volnograd Front Support"
 ADISCORD_vorkerland_send_vla_support_tranche_2_desc:0 "Send the second and final equipment delivery to Volnograd."
 ADISCORD_vorkerland_send_sol_support_tranche_1:0 "Supply the Solarino Allied Front"
 ADISCORD_vorkerland_send_sol_support_tranche_1_desc:0 "After an alliance with Solarino, or the republic's restoration under our protection, transfer 3000 £infantry_equipment_texticon and 30 £support_equipment_texticon to its active front. A second delivery cannot be prepared for 90 days."
 ADISCORD_vorkerland_send_sol_support_tranche_2:0 "Renew Solarino Front Support"
 ADISCORD_vorkerland_send_sol_support_tranche_2_desc:0 "Send the second and final limited equipment delivery to Solarino."
 ADISCORD_vorkerland_allied_supply_advisers:0 "Claimant Supply Advisers"
 ADISCORD_vorkerland_allied_supply_advisers_desc:0 "A temporary advisory mission is rationing the delivered materiel and coordinating its movement to the front."

 ADISCORD_vorkerland_consolidation_deadline:0 "The common command breaks apart"
 ADISCORD_vorkerland_consolidation_deadline_desc:0 "The claimants have at most 180 days to prepare and negotiate with district governments before the central war begins. Local victors may join a coalition while keeping their independence. A prepared claimant can order an earlier offensive. Conquest and civil integration are separate choices."
# --- postwar_ideas_l_english ---
 ADISCORD_vorkerland_worker_constitutional_settlement:0 "Constitutional Settlement"
 ADISCORD_vorkerland_worker_constitutional_settlement_desc:0 "Republican representation, workers' organisations, and the rights of returning communities now rest on permanent law rather than emergency decrees."
 ADISCORD_vorkerland_reunification_settlement:0 "Reunification Settlement"
 ADISCORD_vorkerland_reunification_settlement_desc:0 "A common chancery, accountable military districts, and a single body of law bind the restored state together."
 ADISCORD_vorkerland_measurable_republic:0 "The Technocratic Republic"
 ADISCORD_vorkerland_measurable_republic_desc:0 "Professional administration, published budgets, and technical review bind reconstruction policy to evidence and public results."
 ADISCORD_vorkerland_worker_reconstruction_compact_1:0 "Emergency Reconstruction Compact"
 ADISCORD_vorkerland_worker_reconstruction_compact_1_desc:0 "Councils coordinate urgent repairs under a temporary compact that moves resources quickly but strains civilian budgets and political attention."
 ADISCORD_vorkerland_worker_reconstruction_compact_2:0 "Republican Reconstruction Compact"
 ADISCORD_vorkerland_worker_reconstruction_compact_2_desc:0 "Public accounts, republican representation, and common relief standards turn emergency repairs into a stable cooperative programme."
 ADISCORD_vorkerland_worker_housing_guarantee:0 "Right of Return Housing Guarantee"
 ADISCORD_vorkerland_worker_housing_guarantee_desc:0 "The reunited republic guarantees shelter and essential services to returning communities while property claims are settled."
 ADISCORD_vorkerland_worker_local_reconstruction_grants:0 "Council Reconstruction Grants"
 ADISCORD_vorkerland_worker_local_reconstruction_grants_desc:0 "Local councils receive transparent grants for the projects they can reopen fastest, keeping initiative close to the communities being rebuilt."
 ADISCORD_vorkerland_joint_restoration_authority_1:0 "Provisional Restoration Authority"
 ADISCORD_vorkerland_joint_restoration_authority_1_desc:0 "Army and council officials share an improvised command structure whose speed is bought with administrative friction."
 ADISCORD_vorkerland_joint_restoration_authority_2:0 "Unified Restoration Authority"
 ADISCORD_vorkerland_joint_restoration_authority_2_desc:0 "A rebuilt chancery connects district commands, civilian law, and public records through one accountable hierarchy."
 ADISCORD_vorkerland_joint_civilian_transition:0 "Civilian District Transition"
 ADISCORD_vorkerland_joint_civilian_transition_desc:0 "District police return to civilian authority, improving legitimacy while the army relinquishes part of its emergency control."
 ADISCORD_vorkerland_joint_emergency_inspectorate:0 "Emergency District Inspectorate"
 ADISCORD_vorkerland_joint_emergency_inspectorate_desc:0 "Central inspectors retain temporary authority over arsenals and garrisons, improving readiness at a modest political cost."
 ADISCORD_vorkerland_technical_reconstruction_mandate_2:0 "Accountable Reconstruction Mandate"
 ADISCORD_vorkerland_technical_reconstruction_mandate_2_desc:0 "Published ledgers and audited service targets give the engineering directorate greater capacity with a smaller emergency burden."
 ADISCORD_vorkerland_public_utility_priority:0 "Public Utility Priority"
 ADISCORD_vorkerland_public_utility_priority_desc:0 "Homes and essential services receive the first allocations of power and transport capacity, improving daily stability at a civilian cost."
 ADISCORD_vorkerland_industrial_recovery_priority:0 "Industrial Recovery Priority"
 ADISCORD_vorkerland_industrial_recovery_priority_desc:0 "Factories receive the first repaired machinery and grid capacity, restoring output quickly while civilian demand waits.\n\n\n\n\n\n £GFX_ADISCORD_industry_banner \n\n\n"
 ADISCORD_vorkerland_tva_mobile_repair_trains:0 "Mobile Repair Trains"
 ADISCORD_vorkerland_tva_mobile_repair_trains_desc:0 "Rail-mounted workshops move engineers and spare parts between damaged junctions while the front remains mobile."
 ADISCORD_vorkerland_tva_emergency_output_board:0 "Emergency Production Board"
 ADISCORD_vorkerland_tva_emergency_output_board_desc:0 "Engineers and factory managers coordinate attainable wartime quotas, accepting a modest civilian burden to keep output stable."
 ADISCORD_vorkerland_tva_operational_audit:0 "Operational Audit"
 ADISCORD_vorkerland_tva_operational_audit_desc:0 "Common reports on supply, repairs, and losses let the staff correct plans before local failures spread across the front."
 ADISCORD_vorkerland_technical_reconstruction_mandate:0 "Technical Reconstruction Mandate"
 ADISCORD_vorkerland_technical_reconstruction_mandate_desc:0 "A temporary cabinet of engineers and civil administrators receives the resources needed for rapid reconstruction, together with strict reporting duties."
 ADISCORD_vorkerland_national_power_standard:0 "National Power Standard"
 ADISCORD_vorkerland_national_power_standard_desc:0 "Common voltages, load priorities, and repair procedures make the national grid easier to maintain and industry easier to supply."
 ADISCORD_vorkerland_public_engineering_service:0 "Public Engineering Service"
 ADISCORD_vorkerland_public_engineering_service_desc:0 "Permanent engineering offices test public equipment, retain technical expertise, and translate research into reliable production."
 ADISCORD_vorkerland_statistical_administration:0 "Statistical Administration"
 ADISCORD_vorkerland_statistical_administration_desc:0 "Regional offices use common public records and service standards, giving the central government better information and clearer responsibility."
 ADISCORD_vorkerland_ivanland_expeditionary_command:0 "Ivanland Expeditionary Command"
 ADISCORD_vorkerland_ivanland_expeditionary_command_desc:0 "A temporary headquarters coordinates Ivanland's limited northern expedition, concentrating staff work and supply without creating a permanent occupation army."

