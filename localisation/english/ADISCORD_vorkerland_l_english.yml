 RUS_bunker_command_delta:0 "Hall of the Final Order"
 RUS_bunker_command:0 "Level 5: Hall of the Final Order"
 RUS_bunker_command_desc:0 "The whole country is visible from here, as symbols on a wall. Behind every symbol are living people, and now every mistake on the map belongs to the Khan as well.\n\nDuration: 21 days. Required spare power capacity: 2. Once completed, this level uses 2 power and grants the permanent effects shown below. Only one room can be chosen on this level.\n$RUS_bunker_contract_tt$\n\nCommand Accountability adds another 3% planning speed."
