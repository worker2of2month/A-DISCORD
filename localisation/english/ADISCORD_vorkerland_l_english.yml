# State service, army development and aviation.
 RUS_permanent_government:0 "A Standing Government"
 RUS_permanent_government_desc:0 "Mark Rustan cannot settle every petition and supply order himself. A standing cabinet will assign each office duties that survive the arrival of the next messenger."
 RUS_state_budget:0 "The State Budget"
 RUS_state_budget_desc:0 "The aimaqs submit accounts at different times and under different rules. A common budget will identify expenses already paid and stop several offices charging for the same task."
 RUS_district_representation:0 "District Representation"
 RUS_district_representation_desc:0 "The council will seat people responsible for water, housing and workshops. Their right to report to the Khan will limit local patronage and make council decisions intelligible to the districts."
 RUS_civil_construction_board:0 "Civil Construction Board"
 RUS_civil_construction_board_desc:0 "The council will place civilian factory contracts in one schedule. Engineers can reuse plans, move crews between sites and prepare the next foundations before the current building is finished."
 RUS_trained_administrators_tt:0 "Civil-service training grants 35 state-development progress instead of 25. An operational aimaq archive adds another 15 when the programme is paid for."
 RUS_trained_administrators:0 "Trained Administrators"
 RUS_trained_administrators_desc:0 "The council will establish permanent courses for district officials. Land records and old budgets in the bunker archive will teach them to verify a document before applying their seal."
 RUS_military_governors:0 "Military Governors"
 RUS_military_governors_desc:0 "Each district commander will receive a mobilisation plan and must coordinate it with the local administration. Muster schedules will no longer depend on which order reaches an elder first."
 RUS_military_contract_board:0 "Military Procurement Board"
 RUS_military_contract_board_desc:0 "The staff will combine small regimental orders into a stable production programme. Factories can maintain longer runs while inspectors answer for deliveries to the entire army."
 RUS_command_accountability_synergy_tt:0 "An operational command hall grants an additional §G+3%§! planning speed, including when built later."
 RUS_command_accountability:0 "Command Accountability"
 RUS_command_accountability_desc:0 "Military authority requires responsibility for lives and stores. The Khan will establish a review of orders: commanders retain freedom to act, but can no longer blame losses on another office remaining silent."
 RUS_staff_college:0 "Staff Training"
 RUS_staff_college_desc:0 "A captain must know more than his own company. Staff courses will teach officers to combine reports, assess neighbouring formations and allocate their tasks in advance."
 RUS_integrated_signals_synergy_tt:0 "An operational signals hub adds §G+1§! percentage point to reinforcement chance, including when built later."
 RUS_integrated_signals:0 "Integrated Field Signals"
 RUS_integrated_signals_desc:0 "Every formation will use common call signs and reporting times. The underground communications hub can direct reserves from a shared picture of the battle once connected to the network."
 RUS_field_hospitals:0 "Field Hospitals"
 RUS_field_hospitals_desc:0 "Medical stations will receive transport, dressings and a common evacuation procedure. A wounded soldier must reach a surgeon before being listed as an irrecoverable loss."
 RUS_wounded_return_service_synergy_tt:0 "An operational surgical level returns another §G5%§! of combat casualties to the manpower pool, including when built later."
 RUS_wounded_return_service:0 "Return of the Wounded"
 RUS_wounded_return_service_desc:0 "After hospital treatment, soldiers need recovery and retraining. Field stations will join a permanent medical service, with the bunker surgical level treating the most difficult cases."
 RUS_battery_training:0 "Battery Training"
 RUS_battery_training_desc:0 "Batteries will train with observers and infantry. Shared firing tables will provide a basis for adopting new guns and fire-control equipment."
 RUS_serial_ordnance_orders_synergy_tt:0 "An operational underground arsenal grants another §G+3%§! military factory output, including when built later."
 RUS_serial_ordnance_orders:0 "Serial Ordnance Orders"
 RUS_serial_ordnance_orders_desc:0 "Inspectors will approve longer production runs instead of constantly changing models. The underground arsenal will use common tolerances and supply finished tooling to surface factories."
 RUS_armoured_trial_company:0 "Armoured Trial Company"
 RUS_armoured_trial_company_desc:0 "Instructors will organise a small training group to test armoured chassis and tactics. It must identify suitable vehicles before the country pays to equip entire formations."
 RUS_armoured_repair_service:0 "Army Repair Service"
 RUS_armoured_repair_service_desc:0 "A damaged vehicle should not be abandoned for want of a single component. Mobile workshops and recovery trucks will accompany the columns, returning machines to service and reducing supply consumption."
 RUS_airfield_capacity_tt:0 "The capital region [66.GetName] has room for two air-base levels."
 RUS_flight_school:0 "The Khan's Flight School"
 RUS_flight_school_desc:0 "Surviving aircraft are useless without crews who can bring them home. Instructors will establish flight logs and investigate every accident before it happens again."
 RUS_capital_airfields:0 "Capital District Airfields"
 RUS_capital_airfields_desc:0 "Reserve strips, access roads and dispersal areas will be restored. The first squadrons need working airfields before the campaign begins."
 RUS_fighter_cover:0 "Fighter Cover"
 RUS_fighter_cover_desc:0 "Workshops will ready the first batch of fighters while the school assigns pilots to alert flights. They will protect the capital, crossings and troops from hostile aircraft."
 RUS_assault_squadrons:0 "Assault Squadrons"
 RUS_assault_squadrons_desc:0 "Close-support aircraft will be assembled and their crews taught to identify friendly positions. Ground commanders will be able to call for an air strike on a specified target."
 RUS_aviation_fuel_reserve:0 "Fuel for Training Flights"
 RUS_aviation_fuel_reserve_desc:0 "The flight school must not cancel training whenever a convoy is delayed. A dedicated depot and its first fuel delivery will support training sorties and fighter alerts."
 RUS_aircraft_workshops_synergy_tt:0 "An operational underground arsenal grants another §G+3%§! production efficiency growth, including when built later."
 RUS_aircraft_workshops:0 "Aircraft Workshops"
 RUS_aircraft_workshops_desc:0 "Aircraft demand precision both on the ground and in the air. A new military workshop will serve aviation orders, while tooling from the underground arsenal helps production lines reach full output."
 RUS_air_control_network_synergy_tt:0 "An operational signals hub grants another §G+3%§! air mission efficiency, including when built later."
 RUS_air_control_network:0 "Air Control Posts"
 RUS_air_control_network_desc:0 "Observation posts will pass reports to airfields over a common network. The bunker signals hub can maintain the air picture and direct aircraft where they are needed."
 RUS_air_ground_coordination_synergy_tt:0 "An operational laboratory reduces air accident chance by another §G5%§!, including when built later."
 RUS_air_ground_coordination:0 "Joint Air and Ground Operations"
 RUS_air_ground_coordination_desc:0 "Pilots and ground commanders will prepare one battle plan. The bunker laboratory can test instruments and investigate failures so that support does not become a danger to friendly troops."
 RUS_government_service:0 "State Service"
 RUS_government_service_desc:0 "Permanent offices, a common budget and appointment rules connect the aimaqs to the capital. The political course determines the duties of this service."
 RUS_civil_service_training_bonus_tt:0 "Trained administrators: another §G+10§! state-development progress."
 RUS_civil_service_archive_bonus_tt:0 "Aimaq archive: another §G+15§! state-development progress."
 ADISCORD_rus_campaign.12.t:0 "Files on the Common Table"
 ADISCORD_rus_campaign.12.d:0 "The new administrators began their first meeting with a box of old files: receipts for a bridge never built, two deeds to one plot and a request for a water pump passed between districts for three years. The scientists expected a discussion of instruments. The elders expected taxes. Rustan ordered them to start with the pump.\n\nBy evening an official had been assigned, a deadline recorded and copies sent to the district and the archive. The council was far from unanimous, but disputes now had a subject and a record against which performance could be judged."
 ADISCORD_rus_campaign.12.a:0 "Let the signature be followed by work."
 ADISCORD_rus_campaign.13.t:0 "A Signed Order"
 ADISCORD_rus_campaign.13.d:0 "The commanders brought maps placing neighbouring formations in different positions at the same hour. Every staff had an explanation: a late messenger, a missing ledger, another office responsible. The Khan heard them out, then ordered the pre-battle orders laid side by side.\n\nThe new procedure did not forbid initiative. It required a task to name its recipient, its supplies and the officer responsible for cancelling it. Military governors kept authority in their districts, but their signatures would remain in the common command register."
 ADISCORD_rus_campaign.13.a:0 "Authority requires accountability."
 RUS_bunker_upgrade_2_benefit_2:0 "§G+10%§! planning speed"

# Imperial succession and war with Itora
 ADISCORD_vorkerland_world_empire_focus:0 "Vorkerland world empire"
 WRK_vorkerland_world_empire:0 "Vorkerland world empire"
 WRK_vorkerland_world_empire_DEF:0 "Vorkerland world empire"
 WRK_vorkerland_world_empire_ADJ:0 "Vorkerlander"
 WRK_vorkerland_world_empire_etatism:0 "Vorkerland world empire"
 WRK_vorkerland_world_empire_etatism_DEF:0 "Vorkerland world empire"
 WRK_vorkerland_world_empire_etatism_ADJ:0 "Vorkerlander"
 WRK_world_empire_party:0 "Imperial State Union"
 WRK_world_empire_party_long:0 "Worcker's Imperial State Union"
 ADISCORD_vorkerland_empire_army:0 "Army of the World Empire"
 ADISCORD_vorkerland_empire_army_desc:0 "A unified staff, a mass reserve and centralized supply. The army grows stronger as imperial programs are completed."
 ADISCORD_vorkerland_empire_industry:0 "State War Production Plan"
 ADISCORD_vorkerland_empire_industry_desc:0 "Military enterprises work to a unified state order. Completed programs progressively increase output."
 WRK_empire_arsenal_site_tt:0 "An owned and controlled core state has room for 4 military factories."
 WRK_empire_civil_site_tt:0 "An owned and controlled core state has room for 3 civilian factories."
 WRK_empire_war_tt:0 "The western war against Itora will begin. Allies enter through existing agreements and side choices; the outcome determines the military subjugation of the enemy."
 ADISCORD_vorkerland_postwar.5.t:0 "Worcker Executes Petrichev"
 ADISCORD_vorkerland_postwar.5.d:0 "One week after their common victory, the emergency council ceased to exist. Vlad Petrichev, who had rescued Nikita Worcker from the rubble and shared power with him during the civil war, was arrested by his own guards. A closed tribunal accused him of preparing a military coup. His sentence was carried out on Worcker's personal orders.\n\nA changed ruler appeared before the cameras: a full beard, dark clothes and a cold promise to end the country's fragmentation. Worcker proclaimed the Vorkerland world empire. The new regime made statism the foundation of the state, subordinated civilian institutions to a single center and demanded an unconditional military oath.\n\nIts first orders called for expanded arsenals, mass recruitment and preparations for a campaign against Itora. The man whose life Petrichev once saved no longer intends to share power with anyone."
 ADISCORD_vorkerland_postwar.5.a:0 "His rescuer had become expendable."
 WRK_empire_state_above_all:0 "The State Above All"
 WRK_empire_state_above_all_desc:0 "The emergency council is dissolved. Worcker demands an oath to one state: neither a rescued life nor an old friendship grants a claim to supreme power."
 WRK_empire_imperial_arsenals:0 "Imperial Arsenals"
 WRK_empire_imperial_arsenals_desc:0 "The first state orders reopen the arms workshops. Their output is reserved for the coming war with Itora."
 WRK_empire_steel_directorate:0 "The Steel Directorate"
 WRK_empire_steel_directorate_desc:0 "Steelworks, suppliers and military inspectors answer to one production plan. Departmental boundaries can no longer excuse missed deliveries."
 WRK_empire_war_industry:0 "Industry of Conquest"
 WRK_empire_war_industry_desc:0 "New arms lines are built for a mass army. Imperial orders sustain an uninterrupted flow of weapons."
 WRK_empire_reconstruction_trusts:0 "State Construction Trusts"
 WRK_empire_reconstruction_trusts_desc:0 "A unified construction authority rebuilds the productive base of the country. The war machine must rest on working enterprises."
 WRK_empire_mobilized_economy:0 "An Economy in Imperial Service"
 WRK_empire_mobilized_economy_desc:0 "Civilian enterprises receive steady orders while arms factories receive centralized supplies. The state plan covers the entire production cycle."
 WRK_empire_first_levy:0 "The First Imperial Levy"
 WRK_empire_first_levy_desc:0 "Recruitment offices assemble the first great reserve. Replacements train to a common schedule and establishment."
 WRK_empire_state_legions:0 "Legions of the State"
 WRK_empire_state_legions_desc:0 "A second wave of mobilization reinforces the regular formations. Loyalty to local commanders gives way to the discipline of a national army."
 WRK_empire_rifles_for_the_march:0 "Rifles for the Great March"
 WRK_empire_rifles_for_the_march_desc:0 "The state reserve opens its depots to rearm the army. Every new formation needs weapons, and the front needs replacements for its losses."
 WRK_empire_artillery_mass:0 "Massed Artillery"
 WRK_empire_artillery_mass_desc:0 "Guns and support equipment form a unified breakthrough reserve. The artillery preparation must suppress resistance before the infantry advances."
 WRK_empire_imperial_general_staff:0 "The Imperial General Staff"
 WRK_empire_imperial_general_staff_desc:0 "The staff gains the authority to combine reserves, artillery and supply in a single operation. Worcker's orders are now backed by a trained command system."
 WRK_empire_motor_columns:0 "Motorized Columns"
 WRK_empire_motor_columns_desc:0 "A reserve of trucks allows the rear services to support an advancing army. Imperial formations must not outrun their supply columns."
 WRK_empire_railway_command:0 "Unified Railway Command"
 WRK_empire_railway_command_desc:0 "Military transport receives a unified timetable and a locomotive reserve. The rear must deliver ammunition and replacements wherever the front requires them."
 WRK_empire_fighter_command:0 "Fighter Command"
 WRK_empire_fighter_command_desc:0 "Four hundred fighters provide the material foundation for a new air command. Air wings must now be deployed and trained to contest the skies."
 WRK_empire_close_air_support:0 "Frontline Close Air Support"
 WRK_empire_close_air_support_desc:0 "Ground-attack aircraft enter the air command reserve. Their mission is to support the breakthrough and disrupt approaching Itoran reserves."
 WRK_empire_combined_exercises:0 "Combined Arms Exercises"
 WRK_empire_combined_exercises_desc:0 "Infantry, artillery and aircraft rehearse cooperation before the great march. An error in training costs less than an error on the Itoran frontier."
 WRK_empire_total_mobilization:0 "The Empire Prepares to March"
 WRK_empire_total_mobilization_desc:0 "The army, industry and rear services have completed their preparations. The state concentrates its political strength on a war intended to establish Worcker's rule over the west."
 WRK_empire_itora_operational_plan:0 "The Itoran Operational Plan"
 WRK_empire_itora_operational_plan_desc:0 "The staff compares supply routes, axes of advance and enemy reserves. The campaign must have attainable operational objectives as well as imperial slogans."
 WRK_empire_supreme_command_order:0 "The Supreme Ruler's Order"
 WRK_empire_supreme_command_order_desc:0 "Worcker declares the Itoran question a matter of state survival. The final decision to begin the war rests with the supreme command."
 WRK_empire_itora_must_fall:0 "Itora Must Fall"
 WRK_empire_itora_must_fall_desc:0 "Preparations are complete. The empire begins the western war and calls its allies to its side. Victory must place Itora under Vorkerland's rule."
 WRK_empire_building_offices_tt:0 "§Y2§! more §YDistrict Reconstruction§! programmes may run at the same time."
 WRK_empire_imperial_building_offices:0 "Imperial Building Offices"
 WRK_empire_imperial_building_offices_desc:0 "Every province receives a building office answerable to the trust. Ruined districts are rebuilt not in the order of petitions but on the imperial schedule: arsenals and roads to the front come first."
 WRK_empire_military_conventions:0 "Military Conventions of the West"
 WRK_empire_military_conventions_desc:0 "The empire offers its neighbours protection, not equality. The military conventions promise garrisons, weapons and a place in the coming order to those who choose a side before the march begins."
 WRK_empire_garrison_compact:0 "The Garrison Compact"
 WRK_empire_garrison_compact_desc:0 "Signatories of the conventions receive rifles and equipment from imperial depots. Their garrisons will be the first line of the march on Itora."
 WRK_empire_delta_steel_directorate:0 "State War Production Plan"
 WRK_empire_delta_war_industry:0 "State War Production Plan"
