 TVA_issue_emergency_output_norms_metrics_tt:0 "Network load: §R+10§!."
 TVA_run_the_grid_at_war_load_metrics_tt:0 "Network load: §R+20§!. Unlocks a larger weapons series under either political course: more equipment at the cost of greater network wear and cadre losses. A series already paid for keeps its quoted terms."
