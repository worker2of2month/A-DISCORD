 # Civil development programmes
 RUS_aimaq_service_charter:0 "Aimaq Service Charter"
 RUS_aimaq_service_charter_desc:0 "The council will establish common rules for public service, accountable offices and the training of district clerks."
 RUS_civil_service_examinations:0 "Civil Service Examinations"
 RUS_civil_service_examinations_desc:0 "The chancery will train and examine new officials, giving districts an administration that can work without a fresh order for every task."
 RUS_civil_service_growth_tt:0 "Permanent base state development growth: §G+1§! progress per month before country modifiers."
 RUS_civil_service_training:0 "Train District Officials"
 RUS_civil_service_training_desc:0 "Fund teachers, books and field training for district clerks. This programme may be repeated after 180 days.\n\nTrained Administrators raises the reward from 25 to 35 progress; an operational aimaq archive adds another 15. The price and interval between programmes remain the same."
 RUS_district_health_programme:0 "Train District Paramedics"
 RUS_district_health_programme_desc:0 "Fund the training and placement of paramedics. This programme may be repeated after 180 days."
 RUS_workshop_training:0 "Train Workshop Masters"
 RUS_workshop_training_desc:0 "Send instructors from the machine school to train workshop masters and apprentices. This programme may be repeated after 180 days."
 RUS_development_programme_cost:0 "§Y25§! £political_power_texticon  §Y100§! £ADISCORD_economy_treasury_texticon"
 RUS_development_programme_cost_blocked:0 "§R25§! £political_power_texticon  §R100§! £ADISCORD_economy_treasury_texticon"
 RUS_development_programme_cost_tooltip:0 "Cost: §Y25§! £political_power_texticon and §Y100§! £ADISCORD_economy_treasury_texticon. Payment and progress are settled immediately."
 RUS_civil_service_training_ready_tt:0 "State development is below level 5, with no level increase awaiting the monthly update."
 RUS_civil_service_training_result_tt:0 "State development progress: §G+25§!. Current level: [?ADISCORD_state_development_level|0]/5; progress: [?ADISCORD_state_development_progress|1]/100. Level increases are processed at the next monthly update."
 RUS_district_health_programme_ready_tt:0 "Social-system development is below level 5, with no level increase awaiting the monthly update."
 RUS_district_health_programme_result_tt:0 "Social-system development progress: §G+25§! (§G+40§! with the corresponding operational bunker room). Current level: [?ADISCORD_social_system_development_level|0]/5; progress: [?ADISCORD_social_system_development_progress|1]/100. Level increases are processed at the next monthly update."
 RUS_workshop_training_ready_tt:0 "Economic development is below level 5, with no level increase awaiting the monthly update. Overstretch below 3, debt pressure below 60 and inflation below 40; advancing from level 4 requires state development level 4."
 RUS_workshop_training_result_tt:0 "Economic development progress: §G+25§! (§G+40§! with the corresponding operational bunker room). Current level: [?ADISCORD_economic_development_level|0]/5; progress: [?ADISCORD_economic_development_progress|1]/100. Level increases are processed at the next monthly update."
# --- postwar_expansion_l_english ---
 WRK_worker_pw_census: "Census of Returning Families"
 WRK_worker_pw_census_desc: "A census of returning families and surviving workshops will provide a firm basis for reconstruction. Work and functioning local administration come first."
 WRK_worker_pw_repair_crews: "Public Repair Brigades"
 WRK_worker_pw_repair_crews_desc: "Equipped repair crews will restore damaged enterprises under a common schedule, bringing existing capacity back into production."
 WRK_worker_pw_food_reserve: "A Common Bread Reserve"
 WRK_worker_pw_food_reserve_desc: "A common food reserve will support recruitment and training without forcing hungry towns to supply the army themselves."
 WRK_worker_pw_veteran_housing: "Homes for Veterans"
 WRK_worker_pw_veteran_housing_desc: "Civilian construction will create work for veterans and their families while expanding the industrial base for further reconstruction."
 WRK_worker_pw_municipal_network: "A Compact of Town and Country"
 WRK_worker_pw_municipal_network_desc: "Municipal agreements will restore deliveries severed by the front lines. Local institutions remain responsible for carrying out the common plan."
 WRK_worker_pw_recovery_complete: "The Republic Works Again"
 WRK_worker_pw_recovery_complete_desc: "Emergency repairs give way to sustained construction. The country must support its army while rebuilding civilian life."
 WRK_worker_pw_veteran_cadres: "Recall the Frontline Cadres"
 WRK_worker_pw_veteran_cadres_desc: "Surviving officers and veterans will restore the strength of existing formations before new headquarters compete for scarce recruits."
 WRK_worker_pw_rearmament: "Arms for the Popular Army"
 WRK_worker_pw_rearmament_desc: "Central depots will receive rifles and support equipment. Existing shortages take priority over forming additional under-equipped divisions."
 WRK_worker_pw_officer_school: "Schools for Company Commanders"
 WRK_worker_pw_officer_school_desc: "Junior officer training will restore platoon and company command. The experience of the civil war becomes a common training programme."
 WRK_worker_pw_field_exercises: "Joint Command Exercises"
 WRK_worker_pw_field_exercises_desc: "Field exercises will test cooperation between formerly separate armies. Common orders, communications and replacements prepare them for the western war."
 WRK_worker_pw_motor_pool: "Republican Supply Columns"
 WRK_worker_pw_motor_pool_desc: "Transport and repair units will receive vehicles and equipment, reducing the supply burden of formations at the front."
 WRK_worker_pw_artillery: "Artillery of the Workers Front"
 WRK_worker_pw_artillery_desc: "Guns will be distributed with support for their crews. Coordinated artillery fire must support infantry rather than encourage wasteful attacks."
 WRK_worker_pw_reserve: "A Volunteer Territorial Reserve"
 WRK_worker_pw_reserve_desc: "A fresh reserve will train through existing depots, replacing casualties and expanding the army as weapons become available."
 WRK_worker_pw_army_reform: "An Armed Union of Republics"
 WRK_worker_pw_army_reform_desc: "The completed reform establishes our own military system. Its institutions survive the end of the current foreign crisis."
 WRK_worker_pw_arsenals: "Union of Arms Cooperatives"
 WRK_worker_pw_arsenals_desc: "Surviving arms workshops will fulfil the first postwar defence order. Military production must expand before the long political settlement is complete."
 WRK_worker_pw_standards: "A Common Rifle Cartridge"
 WRK_worker_pw_standards_desc: "Common dimensions, ammunition and acceptance procedures will help production lines gain efficiency faster and reach a steady output for the field army."
 WRK_worker_pw_defence_cluster: "The Interrepublican Defence Order"
 WRK_worker_pw_defence_cluster_desc: "A new defence cluster will expand sustained weapons production. A single stockpile grant cannot support a prolonged war with Itora."
 WRK_worker_pw_machine_tools: "Tools for the Second Shift"
 WRK_worker_pw_machine_tools_desc: "Precision tools will raise the efficiency ceiling of existing lines while civilian suppliers receive their own production capacity."
 WRK_worker_pw_transport_works: "A Common Motor Pool"
 WRK_worker_pw_transport_works_desc: "Transport workshops will deliver the first batch of military vehicles and establish serial production."
 WRK_worker_pw_production_board: "A Plan of Mutual Deliveries"
 WRK_worker_pw_production_board_desc: "The production board will connect procurement, quality control and the actual needs of the army, increasing sustained military output."
 WRK_worker_pw_territorial_council: "Chamber of Republics"
 WRK_worker_pw_territorial_council_desc: "Territories will receive a defined place in common government. Victory must be followed by institutions able to carry out decisions."
 WRK_worker_pw_service_charter: "Representation for Veterans"
 WRK_worker_pw_service_charter_desc: "The service charter defines duties and guarantees. No district should become the private possession of its wartime commander."
 WRK_worker_pw_local_charters: "Protect the Local Councils"
 WRK_worker_pw_local_charters_desc: "Local powers will have clear boundaries. Citizens must know who is responsible for justice, supply and reconstruction."
 WRK_worker_pw_procurement_audit: "A Common Labour Inspectorate"
 WRK_worker_pw_procurement_audit_desc: "Procurement inspection will recover resources lost through intermediaries and make military contracts enforceable."
 WRK_worker_pw_treasury: "Treasury of the Common Home"
 WRK_worker_pw_treasury_desc: "A consolidated treasury will fund long-term programmes and turn promises of reconstruction into practical support."
 WRK_worker_pw_defence_compact: "A Federal Defence Compact"
 WRK_worker_pw_defence_compact_desc: "Common defence obligations connect the constitutional settlement to army reform, allowing the rear to withstand another war."
 WRK_worker_pw_subject_charter: "Charter of New Republics"
 WRK_worker_pw_subject_charter_desc: "Our charter defines dependent governments after victory: confederate republics, military administrations or technical trusteeships. Their political system follows the current government of Vorkerland."
 WRK_worker_pw_ebern_campaign: "End the Ebern Split"
 WRK_worker_pw_ebern_campaign_desc: "Macri has preserved an independent Ebern. This programme authorizes a decision to subjugate it. An allied Afrela joins the same war, and both must be defeated before the settlement."
 WRK_worker_pw_afrela_campaign: "The Afrelan Question"
 WRK_worker_pw_afrela_campaign_desc: "After settling Ebern, a separate decision can authorize the subjugation of Afrela. If it was already subordinated in the joint war, this focus is bypassed."
 WRK_worker_pw_regional_settlement: "Union of Free Producers"
 WRK_worker_pw_regional_settlement_desc: "Dependent governments have entered the agreed settlement. Permanent links and reconstruction can now support their common defence."
