 RUS_bunker_guard_compact:0 "Guard"
 RUS_bunker_guard_ui_tt:0 "§YInternal Guard Barracks§!\n[GetRUSBunkerRoomguard]\n\nCost: [GetRUSBunker11pp]  [GetRUSBunker11cash]  [GetRUSBunker11equipment]\nDuration: §Y21 days§!\nUses §Y2§! £energy_consumption_texticon.\n\nOn completion:\n§G+12%§! army organisation; §G-8%§! training time.\n\nOne room option per level. Payment is deducted once; cancelling the order refunds it in full."
 RUS_bunker_shelter_compact:0 "Shelters"
 RUS_bunker_shelter_ui_tt:0 "§YResidential Level§!\n[GetRUSBunkerRoomshelter]\n\nCost: [GetRUSBunker12pp]  [GetRUSBunker12cash]  [GetRUSBunker12equipment]\nDuration: §Y21 days§!\nUses §Y1§! £energy_consumption_texticon.\n\nOn completion:\n§G+10%§! national stability; §G+0.10§! £political_power_texticon per day.\n\nOne room option per level. Payment is deducted once; cancelling the order refunds it in full."
 RUS_bunker_upgrade_1_ui_tt:0 "§YUpgrade Level 1§!\n[GetRUSBunkerUpgrade1]\nProject: [GetRUSBunkerRecipe1].\n\nCost: [GetRUSBunker30pp]  [GetRUSBunker30cash]  [GetRUSBunker30equipment]\nDuration: §Y21 days§!\n\nGuard: an additional +8% organisation and -5% training time. Shelters: an additional +5% stability.\n\nImproves the room already selected. Dismantling removes the upgrade. Cancelling an unfinished order refunds the full payment."
 RUS_bunker_water_compact:0 "Water purification"
 RUS_bunker_water_ui_tt:0 "§YClosed Water Circuit§!\n[GetRUSBunkerRoomwater]\nRequires focus: [GetRUSBunkerRecipe2].\n\nCost: [GetRUSBunker13pp]  [GetRUSBunker13cash]  [GetRUSBunker13equipment]\nDuration: §Y21 days§!\nUses §Y1§! £energy_consumption_texticon.\n\nOn completion:\n§G-10%§! attrition.\nFood: §G+2§! £supply_texticon per week.\n\nOne room option per level. Payment is deducted once; cancelling the order refunds it in full."
 RUS_bunker_signals_compact:0 "Communications"
 RUS_bunker_signals_ui_tt:0 "§YWired Communications Hub§!\n[GetRUSBunkerRoomsignals]\nRequires focus: [GetRUSBunkerRecipe2].\n\nCost: [GetRUSBunker14pp]  [GetRUSBunker14cash]  [GetRUSBunker14equipment]\nDuration: §Y21 days§!\nUses §Y2§! £energy_consumption_texticon.\n\nOn completion:\n§G+18%§! planning speed.\n\nOne room option per level. Payment is deducted once; cancelling the order refunds it in full.\n\nIntegrated Field Signals adds 1 percentage point to reinforcement chance. Air Control Posts adds 3% air mission efficiency."
 RUS_bunker_upgrade_2_ui_tt:0 "§YUpgrade Level 2§!\n[GetRUSBunkerUpgrade2]\nProject: [GetRUSBunkerRecipe2].\n\nCost: [GetRUSBunker30pp]  [GetRUSBunker30cash]  [GetRUSBunker30equipment]\nDuration: §Y21 days§!\n\nWater purification: an additional -5% attrition. Communications hub: an additional +8% planning speed.\n\nImproves the room already selected. Dismantling removes the upgrade. Cancelling an unfinished order refunds the full payment."
 RUS_bunker_workshop_compact:0 "Workshops"
 RUS_bunker_workshop_ui_tt:0 "§YUnderground Arsenal§!\n[GetRUSBunkerRoomworkshop]\nRequires focus: [GetRUSBunkerRecipe3].\n\nCost: [GetRUSBunker15pp]  [GetRUSBunker15cash]  [GetRUSBunker15equipment]\nDuration: §Y21 days§!\nUses §Y3§! £energy_consumption_texticon.\n\nOn completion:\n§G+15%§! military factory output. The workshop also produces §G+4§! £infantry_equipment_texticon and §G+1§! £support_equipment_texticon per week.\n\nWhile operational, the arsenal opens paid decisions: Order Engineering Equipment delivers §G150§! £support_equipment_texticon instead of 100; Train Workshop Masters grants §G+40§! economic development progress instead of 25.\n\nOne room option per level. Payment is deducted once; cancelling the order refunds it in full.\n\nSerial Ordnance Orders adds 3% military factory output. Aircraft Workshops adds 3% production efficiency growth."
 RUS_bunker_granary_compact:0 "Granaries"
 RUS_bunker_granary_ui_tt:0 "§YGrain Chambers§!\n[GetRUSBunkerRoomgranary]\nRequires focus: [GetRUSBunkerRecipe3].\n\nCost: [GetRUSBunker16pp]  [GetRUSBunker16cash]  [GetRUSBunker16equipment]\nDuration: §Y21 days§!\nUses §Y1§! £energy_consumption_texticon.\n\nOn completion:\n§G-5%§! consumer goods.\nFood: §G+5§! £supply_texticon per week.\n\nOne room option per level. Payment is deducted once; cancelling the order refunds it in full."
 RUS_bunker_upgrade_3_ui_tt:0 "§YUpgrade Level 3§!\n[GetRUSBunkerUpgrade3]\nProject: [GetRUSBunkerRecipe3].\n\nCost: [GetRUSBunker30pp]  [GetRUSBunker30cash]  [GetRUSBunker30equipment]\nDuration: §Y21 days§!\n\nWorkshops: an additional +10% factory output and +6 £infantry_equipment_texticon / +1 £support_equipment_texticon per week. Granaries: an additional -3% consumer goods and +2 food per week. Uses 1 additional power.\n\nImproves the room already selected. Dismantling removes the upgrade. Cancelling an unfinished order refunds the full payment."
 RUS_bunker_clinic_compact:0 "Clinic"
 RUS_bunker_clinic_ui_tt:0 "§YSurgical Level§!\n[GetRUSBunkerRoomclinic]\nRequires focus: [GetRUSBunkerRecipe4].\n\nCost: [GetRUSBunker17pp]  [GetRUSBunker17cash]  [GetRUSBunker17equipment]\nDuration: §Y21 days§!\nUses §Y2§! £energy_consumption_texticon.\n\nOn completion:\n§G+16%§! casualty trickleback.\n\nWhile operational, the clinic opens the paid Train District Paramedics decision: §G+40§! social-system development progress instead of 25.\n\nOne room option per level. Payment is deducted once; cancelling the order refunds it in full.\n\nReturn of the Wounded adds another 5% casualty trickleback."
 RUS_bunker_laboratory_compact:0 "Laboratory"
 RUS_bunker_laboratory_ui_tt:0 "§YDeep Laboratory§!\n[GetRUSBunkerRoomlaboratory]\nRequires focus: [GetRUSBunkerRecipe4].\n\nCost: [GetRUSBunker18pp]  [GetRUSBunker18cash]  [GetRUSBunker18equipment]\nDuration: §Y21 days§!\nUses §Y3§! £energy_consumption_texticon.\n\nOn completion:\n§G+10%§! research speed.\n\nIf operational when Reactor Alloys finishes, the laboratory adds a §G50%§! bonus to one support technology research. The airborne battleship is also available when the surgical level is chosen.\n\nOne room option per level. Payment is deducted once; cancelling the order refunds it in full.\n\nJoint Air and Ground Operations reduces air accident chance by 5%."
 RUS_bunker_upgrade_4_ui_tt:0 "§YUpgrade Level 4§!\n[GetRUSBunkerUpgrade4]\nProject: [GetRUSBunkerRecipe4].\n\nCost: [GetRUSBunker30pp]  [GetRUSBunker30cash]  [GetRUSBunker30equipment]\nDuration: §Y21 days§!\n\nClinic: an additional +8% casualty trickleback. Laboratory: an additional +8% research speed. Uses 1 additional power.\n\nImproves the room already selected. Dismantling removes the upgrade. Cancelling an unfinished order refunds the full payment."
 RUS_bunker_archive_compact:0 "Archive"
 RUS_bunker_archive_ui_tt:0 "§YAimaq Archive§!\n[GetRUSBunkerRoomarchive]\nRequires focus: [GetRUSBunkerRecipe5].\n\nCost: [GetRUSBunker19pp]  [GetRUSBunker19cash]  [GetRUSBunker19equipment]\nDuration: §Y21 days§!\nUses §Y1§! £energy_consumption_texticon.\n\nOn completion:\n§G+0.35§! £political_power_texticon per day.\n\nOne room option per level. Payment is deducted once; cancelling the order refunds it in full.\n\nAfter Trained Administrators, the archive adds 15 state-development progress to each paid civil-service training programme."
 RUS_bunker_command_compact:0 "Command hall"
 RUS_bunker_command_ui_tt:0 "§YHall of the Final Order§!\n[GetRUSBunkerRoomcommand]\nRequires focus: [GetRUSBunkerRecipe5].\n\nCost: [GetRUSBunker20pp]  [GetRUSBunker20cash]  [GetRUSBunker20equipment]\nDuration: §Y21 days§!\nUses §Y2§! £energy_consumption_texticon.\n\nOn completion:\n§G+8%§! max planning; §G+8%§! army defence.\n\nOne room option per level. Payment is deducted once; cancelling the order refunds it in full.\n\nCommand Accountability adds another 3% planning speed."
 RUS_bunker_upgrade_5_ui_tt:0 "§YUpgrade Level 5§!\n[GetRUSBunkerUpgrade5]\nProject: [GetRUSBunkerRecipe5].\n\nCost: [GetRUSBunker30pp]  [GetRUSBunker30cash]  [GetRUSBunker30equipment]\nDuration: §Y21 days§!\n\nArchive: an additional +0.10 political power per day. Command hall: an additional +7% max planning and +7% army defence.\n\nImproves the room already selected. Dismantling removes the upgrade. Cancelling an unfinished order refunds the full payment."
 RUS_bunker_food_ui_tt:0 "§YFood Convoy§!\nCost: [GetRUSBunker31pp]  [GetRUSBunkerFoodCash]\n\nImmediately delivers §G40§! £supply_texticon, or §G60§! after Heavy Freight Reserve. Requires an operational complex with room for the entire delivery. Replenishing supplies removes the empty-stockpile penalty; it does not occupy the construction crew."
 RUS_bunker_guard_gui_reward_tt:0 "§G+12%§! army organisation; §G-8%§! training time."
 RUS_bunker_shelter_gui_reward_tt:0 "§G+10%§! national stability; §G+0.10§! £political_power_texticon per day."
 RUS_bunker_water_gui_reward_tt:0 "§G-10%§! attrition."
 RUS_bunker_signals_gui_reward_tt:0 "§G+18%§! planning speed."
 RUS_bunker_workshop_gui_reward_tt:0 "§G+15%§! military factory output."
 RUS_bunker_granary_gui_reward_tt:0 "§G-5%§! consumer goods."
 RUS_bunker_clinic_gui_reward_tt:0 "§G+16%§! casualty trickleback."
 RUS_bunker_laboratory_gui_reward_tt:0 "§G+10%§! research speed."
 RUS_bunker_archive_gui_reward_tt:0 "§G+0.35§! £political_power_texticon per day."
 RUS_bunker_command_gui_reward_tt:0 "§G+8%§! max planning; §G+8%§! army defence."
 RUS_bunker_metric_power:0 "POWER\n§Y[?RUS_bunker_used_power|0]/[?RUS_bunker_power|0]§! £energy_consumption_texticon"
 RUS_bunker_metric_food:0 "FOOD STOCKPILE\n§Y[?RUS_bunker_food|0]/[?RUS_bunker_food_capacity|0]§! £supply_texticon"
 RUS_bunker_metric_integrity:0 "INTEGRITY\n§Y[?RUS_bunker_integrity|0]/100§! £fort_texticon"
 RUS_bunker_metric_depth:0 "LEVELS\n§Y[?RUS_bunker_depth|0]/[?RUS_bunker_depth_limit|0]§! excavated"
 RUS_bunker_metric_power_tt:0 "§YComplex Power§!\nIn use: §Y[?RUS_bunker_used_power|0]§! £energy_consumption_texticon. Total: §Y[?RUS_bunker_power|0]§!. Available: §Y[?RUS_bunker_free_power|0]§!.\n\nInstallation and upgrades require available power. The two generator expansions add 4 each; the reserve turbine adds another 2. Dismantling a room frees up the power it uses."
 RUS_bunker_metric_food_tt:0 "§YFood§!\nStockpile: §Y[?RUS_bunker_food|0]/[?RUS_bunker_food_capacity|0]§! £supply_texticon. Well fed from §Y[?RUS_bunker_food_fed_line|0]§!.\nWeekly income: §G+[?RUS_bunker_food_output|0]§!. Consumption: §R-[?RUS_bunker_food_use|0]§!. Balance: §Y[?RUS_bunker_food_balance|0]§!.\n\nEach fitted room consumes 1. An empty store means hunger: -5% organisation and -5% stability. A store at 75% of capacity or more means the bunker is well fed: +5% stability and +5% reinforcement rate. Convoys refill the store; selling surplus to the aimaqs earns treasury."
 RUS_bunker_metric_integrity_tt:0 "§YStructural Integrity§!\nCurrent condition: §Y[?RUS_bunker_integrity|0]/100§! £fort_texticon.\n\nNormal excavation removes 20, accelerated excavation 35. Reinforcement restores 40, up to a maximum of 100; available at 60 structural integrity or less. Below 40: -5% military factory output and -5% army organisation. Normal excavation requires at least 40, accelerated excavation 55."
 RUS_bunker_metric_depth_tt:0 "§YComplex Readiness§!\nRooms fitted: §Y[?RUS_bunker_fitted|0]§!. Levels excavated: §Y[?RUS_bunker_depth|0]§!. Authorised depth: §Y[?RUS_bunker_depth_limit|0]§!.\n\n1. Excavate a new level.\n2. Click its image.\n3. Choose one of the two rooms.\n4. Upgrade the completed room.\n\nExcavation and installation are paid for separately. Each empty level grants +1% surrender limit."
 RUS_bunker_queue_ui_tt:0 "§YConstruction Queue§!\n[GetRUSBunkerWork]\nOrder: [GetRUSBunkerProjectName].\n\nOnly one paid project can be carried out at a time. Selecting another level does not cancel the work. The time remaining is shown on the active decision below. If the complex is lost, the country is subjugated or capitulates, or the legitimate government falls, an unfinished order is cancelled with a full refund. A lawful transfer of power to Oskol or Niva does not cancel the order."
 RUS_bunker_status_ui_tt:0 "§YUnderground Capital Status§!\n[GetRUSBunkerStatus]\n[GetRUSBunkerCondition]\n[GetRUSBunkerRations]\n\nWith unsafe vaults: -5% military factory output and -5% organisation. During starvation: -5% organisation and -5% stability.\n\nThe complex operates while the legitimate government governs an independent country and fully owns and controls the region of [66.GetName]. During a temporary loss, the layout and food stocks are preserved; bonuses, food consumption, and food production are suspended."
 RUS_bunker_excavate_button_label:0 "Excavate the Next Level"
 RUS_bunker_excavate_ui_tt:0 "§YExcavate the Next Level§!\nCost: [GetRUSBunker1pp]  [GetRUSBunker1cash]  [GetRUSBunker1equipment]\nDuration: §Y42 days§!\n\nCreates an empty level and removes §R20§! £fort_texticon. Requires at least §Y40§! structural integrity, an available crew, and a depth below the current authorised limit. An empty level grants +1% surrender limit; its room is chosen separately. Cancelling the order refunds the full payment."
 RUS_bunker_ui_rock:0 "Not excavated"
 RUS_bunker_ui_empty:0 "Empty level"
 RUS_bunker_queue_empty:0 "none"
 RUS_entrenched_reserves:0 "Prepared Lines"
 RUS_entrenched_reserves_desc:0 "Positional doctrine requires ground chosen in advance, stores, and paid engineering work. The defensive programme will turn the state's resources into a prepared line. Commanders will receive a specific line to prepare instead of an order to hold at any cost."
 RUS_fortress_engineers:0 "Fortified District Engineers"
 RUS_fortress_engineers_desc:0 "Earthworks do not end with the first trench. We will train engineers to maintain fortifications, disperse stores, and adapt shelters to the terrain. Training equipment will enter the engineering service's active stockpile."
 RUS_railway_coverage:0 "Reserves Behind the Second Line"
 RUS_railway_coverage_desc:0 "A line is held by more than its garrison. A separate locomotive fleet will bring reinforcements and ammunition from the country's interior. This transport will remain in the actual supply reserve after the staff has finished its calculations."
 RUS_mobile_supply_columns:0 "The Column Follows the Army"
 RUS_mobile_supply_columns_desc:0 "A mobile formation is useless if its fuel trucks and mechanics remain at its former headquarters. The mobile programme will bring the preparation of transport, supply, and commanders into a funded cycle. The general staff will be able to prepare the movement of the whole column, not just its vanguard."
 RUS_motor_pool_dispatch:0 "Motor Pool Dispatchers"
 RUS_motor_pool_dispatch_desc:0 "Every working vehicle must have an assignment and a relief driver. The dispatch service will separate the training, repair, and active fleets, and the state will provide its first additional batch of transport. The trucks can support supply operations or equip the troops. A unified transport schedule permanently reduces army supply consumption."
 RUS_combined_arms_trials:0 "Mobile Repair Teams"
 RUS_combined_arms_trials_desc:0 "An offensive's pace is limited not by its fastest truck, but by the time needed to repair the last one. We will test field workshops alongside infantry and artillery. Two research programmes will turn successful solutions into standard equipment for support units."
 RUS_local_service_committees:0 "Local Works Committees"
 RUS_local_service_committees_desc:0 "The council of aimaqs acquires meaning when residents see the results of their decisions. Its first task will be paid work on the capital's transport hub, on which deliveries to the aimaqs depend. Each new order will check the condition of the roads and actual control of the district."
 RUS_assembly_budget:0 "The Council's Treasury"
 RUS_assembly_budget_desc:0 "Local self-government without funding becomes an argument over other people's promises. The council will receive an initial fund for its programmes. The money will enter the common treasury, and the Khan must decide which district receives work first."
 RUS_regional_self_help:0 "District Medical Cooperatives"
 RUS_regional_self_help_desc:0 "The aimaqs can maintain their own medical services if they receive the knowledge and tools. The cooperatives will combine aid to families with the preparation of field stations. The centre will provide equipment and open a research course in support services."
 RUS_inspection_chamber:0 "Construction Audit Chamber"
 RUS_inspection_chamber_desc:0 "The Khan's Chancery must know which buildings stand on the ground and which exist only in its ledgers. Inspectors will compare the reports with the districts' needs. Once the audit is complete, the government will be able to fund military workshops in the capital district. An additional site will be reserved in advance for the first order."
 RUS_single_supply_register:0 "Unified Supply Register"
 RUS_single_supply_register_desc:0 "Fragmented procurement overpays middlemen and leaves builders without tools. We will bring the contracts into one ledger, return unspent funds to the treasury, and transfer the recorded stocks to the engineering service. The register must pay for real work, not more registers."
 RUS_provincial_commissioners:0 "Road Service Commissioners"
 RUS_provincial_commissioners_desc:0 "The road belongs to every department, which is why none has ever been responsible for it. The Chancery will appoint commissioners to connect district depots with the aimaq capitals. Their vehicle fleet will become available to the state supply system."
 RUS_surface_contracts:0 "Invest in the Day Shift"
 RUS_surface_contracts_desc:0 "The ruined workshops must work in daylight again. The surface development policy will channel substantial paid orders into conventional industry. The bunker will retain all its basic capabilities, but surface enterprises will receive the special investment programmes."
 RUS_open_freight_exchange:0 "Open Freight Exchange"
 RUS_open_freight_exchange_desc:0 "A new factory must receive raw materials and send its products to the customer. The freight exchange will coordinate major enterprises' schedules with the transport reserve actually available. A state allocation of locomotives and vehicles will handle the first round of shipments."
 RUS_underground_fund:0 "Underground Self-Sufficiency Fund"
 RUS_underground_fund_desc:0 "A shelter wholly dependent on daily deliveries from the surface remains at the mercy of the first siege. The underground development policy will unlock paid programmes for self-sufficient supply. Surface factories will continue to develop, but special investment will strengthen the complex's resilience."
 RUS_autonomous_workshops:0 "Self-Sufficient Workshop Service"
 RUS_autonomous_workshops_desc:0 "Self-sufficiency needs its own mechanics and spare power, not merely a closed door. The workshops will receive additional power, and the storerooms will gain reserve space. These permanent capabilities will remain part of the complex as its modules change."
 RUS_bunker_layer_service_school:0 "A Crew for Every Level"
 RUS_bunker_layer_service_school_desc:0 "The first level can already be built, but an operational complex needs a permanent engineering service. We will train a dedicated crew and give it the equipment for installation and modernization. The materials will enter the common stockpile and can pay for whichever work the player chooses. The training programme lays the groundwork for support technology research."
 RUS_bunker_reserve_shaft:0 "Reserve Power Shaft"
 RUS_bunker_reserve_shaft_desc:0 "While the tunnellers work deeper underground, the power engineers will lay an independent service line. One additional unit of power will allow greater freedom in choosing modules and their upgrades. The project will strengthen the complex regardless of its current layout."
 RUS_bunker_water_recycling:0 "Water Recycling Circuit"
 RUS_bunker_water_recycling_desc:0 "Water feeds not only the pipes in the living quarters, but food production as well. An additional purification stage will return some of that consumption to circulation. It will increase weekly food output while the complex is operational and help feed the deeper levels."
 RUS_bunker_contingency_reservoir:0 "A Reserve Between Shifts"
 RUS_bunker_contingency_reservoir_desc:0 "Even a working production level sometimes shuts down. We will build additional storerooms and deliver the first batch of long-life supplies. The reserve will give the residents time to wait for repairs, and the increased capacity will remain after the last rations have been consumed."
 RUS_autonomous_workshops_tt:0 "Bunker power capacity: §G+1§! £energy_consumption_texticon. Food reserve capacity: §G+20§! £supply_texticon."
 RUS_bunker_reserve_shaft_tt:0 "Bunker power capacity: §G+1§! £energy_consumption_texticon."
 RUS_bunker_water_recycling_tt:0 "Food production: §G+1§! £supply_texticon per week."
 RUS_bunker_contingency_reservoir_tt:0 "Food reserve capacity: §G+20§! £supply_texticon. Stockpile: §G+20§! £supply_texticon within the new capacity."
 RUS_bunker_airlocks_capacity_tt:0 "Sealed storerooms: §G+20§! £supply_texticon capacity. Stockpile: §G+20§! £supply_texticon within the new capacity."
 RUS_bunker_commission_reserve_tt:0 "Underground capital reserve: §G+20§! £supply_texticon capacity and §G+20§! £supply_texticon added to the stockpile within the new capacity."
 RUS_development_programmes:0 "The Khan's State Programmes"
 RUS_development_programmes_desc:0 "The chosen policy determines which projects the government can fund. Orders are fulfilled upon payment, and repeat orders become available after the stated interval. Buildings appear in the capital region of [66.GetName]; equipment is deducted from the army's current stockpile. Training programmes grant lasting national progress and do not require control of the capital state. Level increases are processed at the next monthly update."
 RUS_defensive_preparation:0 "Prepare Defensive Lines"
 RUS_defensive_preparation_desc:0 "Engineering teams will prepare positions and disperse supplies against a possible attack. The preparations last 120 days; another cycle can be funded once they expire."
 RUS_defensive_preparation_available_tt:0 "The legitimate government rules an independent country and controls the capital complex; the fortified lines programme is unlocked and the previous preparations have ended."
 RUS_defensive_preparation_spirit:0 "Prepared Defensive Lines"
 RUS_defensive_preparation_spirit_desc:0 "Engineering teams mark out fallback positions, inspect the approaches, and build shelters for the first-echelon units. Delivered tools and work assigned in advance allow troops to prepare better positions and hold the line with greater confidence. The funded programme lasts 120 days."
 RUS_mobile_preparation:0 "Prepare Marching Columns"
 RUS_mobile_preparation_desc:0 "Repair teams and mobile depots will prepare supplies for the offensive. The preparations last 120 days; another cycle can be funded once they expire."
 RUS_mobile_preparation_available_tt:0 "The legitimate government rules an independent country and controls the capital complex; the mobile supply programme is unlocked and the previous preparations have ended."
 RUS_mobile_preparation_spirit:0 "Prepared Marching Columns"
 RUS_mobile_preparation_spirit_desc:0 "Supply trains receive their routes, repair teams their assembly points, and intermediate depots their issue quotas. A column can keep moving while the rear brings up supplies and returns equipment to service. The prepared network speeds troop movements and reduces supply consumption for 120 days."
 RUS_aimaq_public_works:0 "Fund Roads in the Capital Aimaq"
 RUS_aimaq_public_works_desc:0 "Local committees will assemble construction cooperatives and provide them with tools. The country gains +5% construction speed for 180 days; infrastructure in the region of [66.GetName] increases by one level if it has not yet reached 5. When the roads are fully developed, the cooperatives continue working on other building sites. The benefits are granted upon payment; another order becomes available when the cooperatives finish their service."
 RUS_aimaq_public_works_available_tt:0 "The legitimate government rules an independent country and fully owns and controls the region of [66.GetName]; local committees are unlocked and the previous construction programme has ended."
 RUS_chancery_reconstruction:0 "Fund the Capital Arsenal Expansion"
 RUS_chancery_reconstruction_desc:0 "The Inspection Chamber will pay to commission a new weapons production line in the region of [66.GetName]. One military factory appears immediately upon payment and occupies a normal building slot. Another order becomes available after 180 days."
 RUS_chancery_reconstruction_available_tt:0 "The legitimate government rules an independent country and fully owns and controls the region of [66.GetName]; the Inspection Chamber is unlocked and the state has a free military factory slot."
 RUS_surface_industrial_contract:0 "Fund a Surface Factory"
 RUS_surface_industrial_contract_desc:0 "The surface industrial contract commissions a civilian factory in the region of [66.GetName] immediately upon payment. The enterprise occupies a normal building slot. Another contract can be signed after 180 days."
 RUS_surface_industrial_contract_available_tt:0 "The legitimate government rules an independent country and fully owns and controls the region of [66.GetName]; the surface industrial policy has been chosen and the state has a free civilian factory slot."
 RUS_subterranean_supply_contract:0 "Fund a Self-Sufficient Food Circuit"
 RUS_subterranean_supply_contract_desc:0 "The Underground Fund will purchase equipment for processing and storing food. Each of the two circuits increases permanent output and storage capacity. Installation takes place upon payment; the second contract becomes available after 60 days. Built: [?RUS_bunker_autonomy_contracts|0]/2."
 RUS_subterranean_supply_contract_available_tt:0 "The legitimate government rules an independent country and controls the capital complex; the Underground Fund has been chosen and fewer than two self-sufficient circuits have been funded."
 RUS_subterranean_supply_reward_tt:0 "Permanent output: §G+1§! £supply_texticon per week. Storage capacity: §G+20§! £supply_texticon. The equipment is retained if the complex is temporarily lost; production runs only while the bunker is operational."
 RUS_public_campaigns:0 "The Khan's Voice"
 RUS_public_campaigns_desc:0 "Radio, printed leaflets, and aimaq assemblies can support different tasks of state.\n\nFree shared campaign slots: §Y[?ADISCORD_available_campaign_slots|0]§!. Each address occupies one slot for its entire duration. Two editorial offices allow two addresses to run simultaneously.\n\nIf the Khan loses his independent authority, active addresses end; the slot is freed, but political power spent on a campaign already begun is not refunded. The wartime campaign 'The Last Order' also ends when peace returns."
 RUS_public_campaign_slot_available_tt:0 "A campaign slot is available: §Y[?ADISCORD_available_campaign_slots|0]§!. The first comes from $RUS_khan_broadcast_service$ and the second from $RUS_parallel_public_addresses$."
 RUS_public_campaign_first_slot_tt:0 "One editorial office: §G+1§! slot in the shared pool of paid campaigns."
 RUS_public_campaign_second_slot_tt:0 "Second editorial office: another §G+1§! slot in the shared pool of paid campaigns."
 RUS_campaign_voice_of_the_aimaqs:0 "One Voice for All Aimaqs"
 RUS_campaign_voice_of_the_aimaqs_desc:0 "The capital's announcer will hand the airwaves over to the elders of distant aimaqs. Their voices will tell of neighbours, road repairs, and settled disputes: the state must be heard at times other than when it demands obedience."
 RUS_campaign_bread_and_shelter:0 "Bread and Shelter for Every Family"
 RUS_campaign_bread_and_shelter_desc:0 "Reports on supplies, queues, and the work of the shelters will take the place of empty promises. Families must know why they have to save today and who is responsible for tomorrow's delivery. The campaign helps organize the home front; food deliveries to the bunker still require a separate order."
 RUS_campaign_rifles_protect_home:0 "This Rifle Protects Your Home"
 RUS_campaign_rifles_protect_home_desc:0 "Factory noticeboards will display letters from the units that received their weapons. A worker's name, a rifle's serial number, and a soldier's thanks will connect a long shift to the defence of a particular home."
 RUS_campaign_the_khan_keeps_his_word:0 "The Government Answers for Its Word"
 RUS_campaign_the_khan_keeps_his_word_desc:0 "The editorial office will read out fulfilled decisions alongside the names of those responsible. Every grand promise will acquire a date, a place, and a verifiable result: order rests on trust in the ruler's word."
 RUS_campaign_surface_trade:0 "Open Roads, Working Workshops"
 RUS_campaign_surface_trade_desc:0 "Trade news, contractors' announcements, and reports of new construction will bring movement back to the surface. A caravan needs a buyer, a workshop needs an order, and a construction brigade needs confidence that its materials will arrive."
 RUS_campaign_last_order:0 "The Last Order: Hold Your Home"
 RUS_campaign_last_order_desc:0 "During war, addresses by frontline soldiers and the Khan's direct order will sustain the units' morale. This campaign runs only while the country is at war. When peace returns, it ends and frees its slot; the political power spent is not refunded."
 RUS_khan_broadcast_service:0 "The Capital's Voice in Every Aimaq"
 RUS_khan_broadcast_service_desc:0 "Rumour reaches a distant aimaq faster than an official order. The radio service will connect the capital's editorial office to district loudspeakers, while leaflets carrying the addresses will reach those without receivers. The first editorial shift runs campaigns on aimaq unity and supply; military, state, and trade propaganda is unlocked through its respective focuses, so that each branch is responsible for its own promise."
 RUS_parallel_public_addresses:0 "Two Editorial Offices, One Broadcast"
 RUS_parallel_public_addresses_desc:0 "The front needs one message, the families in the rear another. A second editorial office and its own printing shift will allow two different addresses to run simultaneously. An active campaign will no longer have to be cut short for the next one: each will retain its own payment, duration, and purpose. The Khan expands the service's capabilities, while the government will decide which promises go out over the airwaves."
 RUS_public_works_spirit:0 "Public Works Cooperatives"
 RUS_public_works_spirit_desc:0 "The communities send carpenters, masons, and carters to the cooperatives. The treasury pays for tools and labour, while local craftsmen share their experience with neighbouring brigades. Coordinated deliveries and a steady workforce speed construction throughout the country; the programme lasts 180 days."
 RUS_black_army_bookmark:0 "$RUS_black_army$"
 RUS_black_army_bookmark_desc:0 "$RUS_black_army_desc$"
 RUS_bunker_complex_bookmark:0 "$RUS_bunker_complex$"
 RUS_bunker_complex_bookmark_desc:0 "$RUS_bunker_complex_desc$"
 RUS_black_army:0 "Black Army"
 RUS_black_army_desc:0 "Beneath the black banners gather detachments that only yesterday obeyed different elders. The men bring their own weapons, know their neighbours in the ranks, and are ready to defend their native aimaq. Beyond its borders, the differences in their rules, training, and understanding of duty become clear.\n\nThe Black Army must learn to fight as a single force. Regimental ledgers, a trained reserve, and common military service bind the war bands to headquarters; the chosen doctrine determines whether they hold fortified lines or advance in mobile columns. As the army grows, its command gains ever more grounds to demand a voice of its own in the country's future."
 RUS_black_army_state_tt:0 "Organization: §Y[GetRUSArmyOrganization]§!\nDoctrine: §Y[GetRUSArmyDoctrine]§!\nThe Black Army receives §G+5%§! attack, while military focuses and the Black Army branch change the spirit's other parameters. Room bonuses are displayed separately under 'Bunker System'. Temporary troop preparations remain in effect until their duration ends. The influence of the scientists and the Black Army is shown in the balance of power."
 RUS_bunker_system_state_tt:0 "[GetRUSBunkerStatus]\nFitted levels: §Y[?RUS_bunker_fitted|0]/5§!; integrity: §Y[?RUS_bunker_integrity|0]/100§! £fort_texticon\nPower: §Y[?RUS_bunker_used_power|0]/[?RUS_bunker_power|0]§! £energy_consumption_texticon; stockpile: §Y[?RUS_bunker_food|0]/[?RUS_bunker_food_capacity|0]§! £supply_texticon\nBuilding and upgrading rooms changes this spirit. Army reforms are retained independently of the complex."
 RUS_army_doctrine_patient:0 "Patient Warfare"
 RUS_army_doctrine_swift:0 "Mobile Columns"
 RUS_army_doctrine_undecided:0 "Undecided"
 RUS_army_organization_regular:0 "Common Military Service"
 RUS_army_organization_reserves:0 "Trained Reserve"
 RUS_army_organization_registers:0 "Unified Unit Rolls"
 RUS_army_organization_hosts:0 "Aimaq Detachments"
 RUS_bunker_depth_2_tt:0 "Allows excavation down to the second level. Excavation and fitting out are paid for separately."
 RUS_army_organization_delta:0 "Black Army Modification"
 RUS_army_empire_delta:0 "Black Army Modification"
 RUS_state_balance:0 "Scientists - Black Army"
 RUS_state_balance_category:0 "Scientists and the Black Army"
 RUS_state_balance_category_desc:0 "Two forces argue beneath the ground. The §YBlack Army§! holds the gates and the front and demands men, rations and a single command. The §YScientists§! keep the light, the water and the laboratories without which the underground country will not survive the winter. Both have sworn to the Khan: the Black Army is led by $RUS_black_army_leader$, the scientists by $RUS_scientists_leader$.\n\nBlack Army support: §Y[?RUS_black_army_support|%0]§!\nScientist support: §Y[?RUS_scientists_support|%0]§!\n\nSupport above 50% grants £political_power_texticon and pulls the balance toward its side every week; support below 50% costs £political_power_texticon. Focuses, the measures in this category and laboratory projects change support. The leading side at the proclamation decides the realm's form: the Empire of the Black Banner if the Black Army leads, or the Last Empire if the scientists lead or the balance holds. Each measure can be repeated after 90 days."
 RUS_state_balance_compromise:0 "Oath of both forces"
 RUS_state_balance_government_tt:0 "Mark Rustan rules; the country is independent, has not capitulated and the empire has not dissolved."
 RUS_bop_relief:0 "Extra rations for the science shifts"
 RUS_bop_relief_desc:0 "Hand part of the underground stores to the shifts that run the pumps, filters and laboratories. Fed shifts work calmly, and the scientists gain a louder voice over the stores. The food is spent at once; an empty store can cause hunger in fitted halls. Repeatable after 90 days."
 RUS_bop_relief_room_tt:0 "Scientist influence has not yet reached 85% of its side of the scale."
 RUS_bop_reserve:0 "Ration the Black Army reserve"
 RUS_bop_reserve_desc:0 "Feed the volunteers at the Black Army muster points. The country gains reservists and the army a larger say over the stores. These are men for reinforcement and recruitment, not armed divisions. The food is spent at once; an empty store can cause hunger. Repeatable after 90 days."
 RUS_bop_reserve_room_tt:0 "Black Army influence has not yet reached 85% of its side of the scale."
 RUS_bop_mediation:0 "Convene the army and science council"
 RUS_bop_mediation_desc:0 "Pay for a joint assembly of Black Army commanders, scientists and the treasury. Settling their powers brings the sides toward a compromise, and both leave feeling that the Khan has heard them. Repeatable after 90 days."
 RUS_bop_mediation_needed_tt:0 "The balance is outside the central range of -10% to +10%."
 RUS_bop_mediation_result_tt:0 "The balance moves §Y15%§! toward the centre. §YScientist§! and §YBlack Army§! support: §G+5%§!."
 RUS_bop_relief_cost:0 "§Y25§! £political_power_texticon  §Y20§! £supply_texticon"
 RUS_bop_relief_cost_blocked:0 "§R25§! £political_power_texticon  §R20§! £supply_texticon"
 RUS_bop_relief_cost_tooltip:0 "Requires 25 £political_power_texticon and 20 £supply_texticon from the bunker's stocks."
 RUS_bop_reserve_cost:0 "§Y30§! £political_power_texticon  §Y30§! £supply_texticon"
 RUS_bop_reserve_cost_blocked:0 "§R30§! £political_power_texticon  §R30§! £supply_texticon"
 RUS_bop_reserve_cost_tooltip:0 "Requires 30 £political_power_texticon and 30 £supply_texticon from the bunker's stocks."
 RUS_bop_mediation_cost:0 "§Y40§! £political_power_texticon  §Y200§! £ADISCORD_economy_treasury_texticon"
 RUS_bop_mediation_cost_blocked:0 "§R40§! £political_power_texticon  §R200§! £ADISCORD_economy_treasury_texticon"
 RUS_bop_mediation_cost_tooltip:0 "Requires 40 £political_power_texticon and 200 £ADISCORD_economy_treasury_texticon."
 RUS_black_army_leader:0 "$RUS_Mark_Rustan$"
 RUS_scientists_leader:0 "$RUS_Mark_Rustan$"
 RUS_scientists_side:0 "Scientists"
 RUS_black_army_side:0 "Black Army"
 RUS_scientists_influence:0 "Weight of the laboratories"
 RUS_scientists_dominance:0 "Rule of the scientists"
 RUS_black_army_influence:0 "Weight of the Black Army"
 RUS_black_army_dominance:0 "Rule of the Black Army"
 RUS_faction_support:0 "Scientist and Black Army support"
 RUS_faction_support_state_tt:0 "Black Army support: §Y[?RUS_black_army_support|%0]§!, scientist support: §Y[?RUS_scientists_support|%0]§!. Support above 50% grants £political_power_texticon and pulls the balance toward its side."
 RUS_bop_relief_support_tt:0 "§YScientist§! support: §G+15%§!. §YBlack Army§! support: §R-10%§!."
 RUS_bop_reserve_support_tt:0 "§YBlack Army§! support: §G+15%§!. §YScientist§! support: §R-10%§!."
 RUS_black_army_banner_delta:0 "Black Army change"
 RUS_course_scientists_10_tt:0 "Balance of power: §Y10%§! toward the §YScientists§!."
 RUS_course_scientists_15_tt:0 "Balance of power: §Y15%§! toward the §YScientists§!."
 RUS_course_black_army_10_tt:0 "Balance of power: §Y10%§! toward the §YBlack Army§!."
 RUS_course_black_army_15_tt:0 "Balance of power: §Y15%§! toward the §YBlack Army§!."
 RUS_support_scientists_10_tt:0 "§YScientist§! support: §G+10%§!."
 RUS_support_black_army_10_tt:0 "§YBlack Army§! support: §G+10%§!."
 RUS_scientists_council:0 "The Khan's council of scientists"
 RUS_scientists_council_desc:0 "The census showed that the bunker does not stand on soldiers alone. Engineers, chemists and doctors have repaired the pumps, filters and generators for years without a voice in the country's affairs. Mark Rustan will gather them into a council and chair it himself: the knowledge of the underground becomes a matter of state rather than the private care of single workshops.\n\nState leadership choice: the scientific council excludes the military course. Its continuation provides a civilian factory and technical institutes; industrialization, CBRN troops and the airship remain available to both paths."
 RUS_scientists_workshops:0 "Workshops of the council"
 RUS_scientists_workshops_desc:0 "The council will merge the scattered workshop estimates into a single fund. A site in the capital district is assigned and a civilian factory is put into operation. The scientists receive means they will have to account for before the Khan."
 RUS_scientists_power_compact:0 "Light and bread of the underground"
 RUS_scientists_power_compact_desc:0 "The scientists will send engineers to add power to the complex and keep food production running. These capacities belong to the whole bunker and stay useful under any layout of its layers. The better the machines run, the more weight those who understand them carry.\n\nThe council establishes technical institutes in place of informal instruction, basic schools or apprenticeship. Other specialized educational policies are retained."
 RUS_scientists_power_compact_tt:0 "Bunker power: §G+1§! £energy_consumption_texticon. Food production: §G+1§! £supply_texticon per week."
 RUS_black_army_oath:0 "Oath of the Black Army"
 RUS_black_army_oath_desc:0 "The Black Army grew from the hundreds that defended the bunker gates. Now Mark Rustan takes its oath in person: every aimaq names men for the common reserve, and the capital service equips them with engineering tools. The army gains a real foundation, and the Khan a host answerable to him alone.\n\nState leadership choice: the military course excludes the scientific council. Its continuation provides an arms factory, centralized supply and army reforms; industrialization, CBRN troops and the airship remain available to both paths."
 RUS_black_army_staff:0 "Black Army staff"
 RUS_black_army_staff_desc:0 "The staff begins with the economy of the front: depots need someone responsible, trains a timetable, engineers their tools. A capital arsenal gives the command its own production base and turns orders into a working rear."
 RUS_black_army_banner:0 "Charter of the Black Banner"
 RUS_black_army_banner_desc:0 "A single charter will bind reconnaissance, defence in depth and the preparation of a general offensive. No hundred leaves its neighbour without help, and the staff must prepare its lines in advance. The charter makes the Khan's army a force the scientists must reckon with too.\n\nCentralized depots replace local foraging, civilian contracts or regional warehouses. Other specialized logistics policies are retained."
 RUS_experimental_laboratories:0 "Experimental laboratories"
 RUS_experimental_laboratories_desc:0 "The bunker's science wing has grown, but the real samples do not lie underground. Around the ruined zero-point reactor stand the workshops, alloy stores and surviving components of old Vorkerland. The Khan's scientists will open field laboratories at the edge of the reactor zone and take on projects once thought impossible."
 RUS_experimental_laboratories_tt:0 "Laboratory projects require control of at least one reactor zone. After 'Reactor Alloys' the single §Yairborne battleship§! becomes available."
 RUS_experimental_labs_category:0 "Experimental laboratories"
 RUS_experimental_labs_category_desc:0 "Field laboratories take samples from the ruins of the old industrial centre around the reactor. Only one project runs at a time. Work is possible while the Khan controls at least one reactor zone - Northern, Eastern, Western or Southern. Scientific or military leadership does not close these projects. If every reactor zone or the capital is lost, the project stops and its full price is returned."
 RUS_lab_reactor_alloys:0 "Reactor alloys"
 RUS_lab_reactor_alloys_desc:0 "The scientists will recover samples of light heat-resistant alloys from the ruins of the reactor complex and restore the means to work them. The project gives an industrial head start and material for the hull of a future airborne battleship. The work takes 60 days.\n\nAn operational underground laboratory at completion adds a §G50%§! bonus for one support technology."
 RUS_lab_reactor_alloys_cost:0 "§Y50§! £political_power_texticon  §Y300§! £ADISCORD_economy_treasury_texticon"
 RUS_lab_reactor_alloys_cost_blocked:0 "§R50§! £political_power_texticon  §R300§! £ADISCORD_economy_treasury_texticon"
 RUS_lab_reactor_alloys_cost_tooltip:0 "Requires 50 £political_power_texticon and 300 £ADISCORD_economy_treasury_texticon."
 RUS_lab_reactor_alloys_support_tt:0 "§YScientist§! support: §G+10%§!. §YBlack Army§! support: §R-5%§!.\nUnlocks the §YAirborne battleship§! project."
 RUS_lab_zeppelin:0 "Airborne battleship"
 RUS_lab_zeppelin_desc:0 "The archives of old Vorkerland kept the drawings of an armoured airship that never left the ground. With reactor alloys and surviving engines the scientists can assemble a single hull. The crew is drafted at once. A second ship cannot be built, and a lost hull cannot be replaced. The work takes 150 days.\n\nAvailable under both scientific and military leadership, including either extreme of the balance of power."
 RUS_lab_zeppelin_cost:0 "§Y100§! £political_power_texticon  §Y1000§! £ADISCORD_economy_treasury_texticon  §Y400§! £manpower_texticon"
 RUS_lab_zeppelin_cost_blocked:0 "§R100§! £political_power_texticon  §R1000§! £ADISCORD_economy_treasury_texticon  §R400§! £manpower_texticon"
 RUS_lab_zeppelin_cost_tooltip:0 "Requires 100 £political_power_texticon, 1000 £ADISCORD_economy_treasury_texticon and 400 £manpower_texticon for the crew."
 RUS_lab_zeppelin_result_tt:0 "The §YAirborne Battleship «Zeppelin»§! appears in the capital with a full crew and armament. §YScientist§! and §YBlack Army§! support: §G+10%§!."
 RUS_lab_reactor_access_tt:0 "The Khan controls at least one reactor zone: Northern, Eastern, Western or Southern."
 RUS_lab_slot_free_tt:0 "No other project is running in the laboratories."
 RUS_lab_cancel_warning_tt:0 "If the Khan loses every reactor zone or the capital, the project stops and its full price is returned."
 RUS_lab_refunded_tt:0 "Project stopped. Political power, treasury and crew have been returned."
 RUS_reactor_belt_inventory:0 "Inventory of the reactor belt"
 RUS_reactor_belt_inventory_desc:0 "The skeletons of old Vorkerland's factories stand around the reactor. Under the fallen roofs lie mills, furnaces and metal stores nobody has reached since the accident. The Khan's engineers will draw up an inventory: what can be lifted, what must be cut and where the load-bearing walls still hold. The first salvage goes straight to the treasury."
 RUS_reactor_foundries:0 "Foundries of the belt"
 RUS_reactor_foundries_desc:0 "A restored hall is only the beginning. A foundry beside it can process the recovered metal on site instead of hauling scrap across the country. Every restored work of the belt will gain its own arms shop."
 RUS_reactor_foundries_tt:0 "Every belt work already restored that we own and control: §G+1§! slot and §G+1§! military factory. Works restored later receive the same at once."
 RUS_reactor_sorties:0 "Sorties into the reactor"
 RUS_reactor_sorties_desc:0 "The most valuable things lie where no one can live: in the halls next to the core. Volunteers in protective suits will go beyond the perimeter for days and return with instruments, alloys and documents. Not everyone comes back."
 RUS_reactor_decontamination:0 "Decontamination brigades"
 RUS_reactor_decontamination_desc:0 "The scientists have taught the sortie groups to wash their gear, change filters and leave the zone through proven corridors. Losses fall and the haul grows heavier."
 RUS_reactor_decontamination_tt:0 "Reactor sorties consume §Y20§! £support_equipment_texticon instead of 40 and recover §G+250§! £ADISCORD_economy_treasury_texticon instead of 150. Applies to subsequent expeditions."
 RUS_reactor_belt_category:0 "Reactor belt"
 RUS_reactor_belt_category_desc:0 "Six states around the reactor - the Northern, Eastern, Western and Southern reactor zones, Eastern Grey Strip and Marden - hold the buried stocks of the old industry. Today only surface scrap is worked there.\n\nRestoring a work returns the buried resources to its state together with a slot and a civilian factory. One state is restored at a time; if it is lost, the project is cancelled and its price returned. Reactor sorties require control of at least one reactor zone."
 RUS_restore_reactor_works:0 "Restore the works: [FROM.GetName]"
 RUS_restore_reactor_works_desc:0 "Clear the rubble, brace the surviving spans and start the hall again. The work takes 120 days."
 RUS_restore_reactor_works_cost:0 "§Y50§! £political_power_texticon  §Y400§! £ADISCORD_economy_treasury_texticon"
 RUS_restore_reactor_works_cost_blocked:0 "§R50§! £political_power_texticon  §R400§! £ADISCORD_economy_treasury_texticon"
 RUS_restore_reactor_works_cost_tooltip:0 "Requires 50 £political_power_texticon and 400 £ADISCORD_economy_treasury_texticon."
 RUS_reactor_works_idle_tt:0 "No other work of the belt is being restored."
 RUS_reactor_works_cancel_tt:0 "If the state is lost, the work stops and its full price is returned."
 RUS_reactor_works_refund_tt:0 "Work stopped. Political power and treasury have been returned."
 RUS_reactor_works_result_tt:0 "The state regains its buried resources, §G+1§! slot and §G+1§! civilian factory. After 'Foundries of the Belt' it also gains §G+1§! slot and §G+1§! military factory."
 RUS_reactor_sortie:0 "Sortie into the reactor"
 RUS_reactor_sortie_desc:0 "Send a volunteer group to the reactor core for instruments, alloys and archives. The group is away for 30 days; protective equipment is consumed on departure, without deducting manpower. Repeatable after 60 days."
 RUS_reactor_sortie_cost:0 "§Y25§! £political_power_texticon  §Y[GetRUSReactorSortieEquipment]§! £support_equipment_texticon"
 RUS_reactor_sortie_cost_blocked:0 "§R25§! £political_power_texticon  §R[GetRUSReactorSortieEquipment]§! £support_equipment_texticon"
 RUS_reactor_sortie_cost_tooltip:0 "Requires §Y25§! £political_power_texticon and §Y[GetRUSReactorSortieEquipment]§! £support_equipment_texticon. Supplies are consumed on departure."
 RUS_reactor_sortie_losses_tt:0 "Protective suits, filters and tools are consumed on departure. No manpower is deducted."
 RUS_reactor_sortie_cancel_tt:0 "The group is recalled without a haul. Consumed supplies and political power are not refunded."
 RUS_reactor_sortie_result_tt:0 "Treasury: §G+150§! £ADISCORD_economy_treasury_texticon, or §G+250§! if commissioned after Decontamination Brigades. §YScientist§! support: §G+5%§!."
