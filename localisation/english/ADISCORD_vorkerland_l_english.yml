 ADISCORD_vorkerland_tgd_grid_collapse: "Urban Grid Collapse"
 ADISCORD_vorkerland_tgd_grid_collapse_desc: "Emergency outages have paralysed industry, repairs and supply in Firnov and Techlar. All available inhabitants are assigned to urban maintenance, leaving the army only its pre-allocated technical reserve. Once the two neighbouring threats have been eliminated, the grid can be rebuilt in 120 days."
 ADISCORD_vorkerland_tgd_living_grid: "Firnov and Techlar's Urban Grid"
 ADISCORD_vorkerland_tgd_living_grid_desc: "The Firnov-Techlar metropolitan area is a single organism of power stations, underground railways, factories and distribution centres. The city's engineers repair it under fire and supply the defence efficiently, but all available inhabitants remain assigned to maintaining the grid."
 ADISCORD_vorkerland_tgd_rebuild_grid: "Restart the Urban Grid"
 ADISCORD_vorkerland_tgd_rebuild_grid_desc: "Begin a 120-day restoration of the power system after eliminating Volnograd and Ebern."
