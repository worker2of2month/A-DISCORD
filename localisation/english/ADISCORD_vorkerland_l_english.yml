 RUS_bunker_reinforce:0 "Reinforce the Vaults"
 RUS_bunker_reinforce_desc:0 "The crew returns to galleries already excavated. No new meters will appear in the report: their work is measured by those who return from the next shift.\n\nDuration: 21 days. Available at 60 structural integrity or below. Restores 40 structural integrity, up to a maximum of 100. Structural integrity of at least 40 removes the emergency penalties.\n$RUS_bunker_contract_tt$"
