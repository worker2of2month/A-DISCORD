 WRK_utilitarian_pw_veteran_housing: "Settlements for Technical Specialists"
 WRK_utilitarian_pw_veteran_housing_desc: "Civilian construction will create work for veterans and their families while expanding the industrial base for further reconstruction."
 WRK_utilitarian_pw_municipal_network: "Connect the Municipal Networks"
 WRK_utilitarian_pw_municipal_network_desc: "Municipal agreements will restore deliveries severed by the front lines. Local institutions remain responsible for carrying out the common plan."
 WRK_utilitarian_pw_recovery_complete: "Complete the Emergency Cycle"
 WRK_utilitarian_pw_recovery_complete_desc: "Emergency repairs give way to sustained construction. The country must support its army while rebuilding civilian life."
 WRK_utilitarian_pw_veteran_cadres: "Preserve the Trained Crews"
 WRK_utilitarian_pw_veteran_cadres_desc: "Surviving officers and veterans will restore the strength of existing formations before new headquarters compete for scarce recruits."
 WRK_utilitarian_pw_rearmament: "A Field Army Equipment Standard"
 WRK_utilitarian_pw_rearmament_desc: "Central depots will receive rifles and support equipment. Existing shortages take priority over forming additional under-equipped divisions."
 WRK_utilitarian_pw_officer_school: "School for Technical Officers"
 WRK_utilitarian_pw_officer_school_desc: "Junior officer training will restore platoon and company command. The experience of the civil war becomes a common training programme."
 WRK_utilitarian_pw_field_exercises: "Field Interoperability Trials"
 WRK_utilitarian_pw_field_exercises_desc: "Field exercises will test cooperation between formerly separate armies. Common orders, communications and replacements prepare them for the western war."
 WRK_utilitarian_pw_motor_pool: "Repair and Transport Battalions"
 WRK_utilitarian_pw_motor_pool_desc: "Transport and repair units will receive vehicles and equipment, reducing the supply burden of formations at the front."
 WRK_utilitarian_pw_artillery: "A Coordinated Artillery Network"
 WRK_utilitarian_pw_artillery_desc: "Guns will be distributed with support for their crews. Coordinated artillery fire must support infantry rather than encourage wasteful attacks."
 WRK_utilitarian_pw_reserve: "A Reserve of Trained Specialists"
 WRK_utilitarian_pw_reserve_desc: "A fresh reserve will train through existing depots, replacing casualties and expanding the army as weapons become available."
 WRK_utilitarian_pw_army_reform: "An Army of Continuous Supply"
 WRK_utilitarian_pw_army_reform_desc: "The completed reform establishes our own military system. Its institutions survive the end of the current foreign crisis."
 WRK_utilitarian_pw_arsenals: "Restore the Arms Lines"
 WRK_utilitarian_pw_arsenals_desc: "Surviving arms workshops will fulfil the first postwar defence order. Military production must expand before the long political settlement is complete."
 WRK_utilitarian_pw_standards: "Catalogue of Interchangeable Parts"
 WRK_utilitarian_pw_standards_desc: "Common dimensions, ammunition and acceptance procedures will help production lines gain efficiency faster and reach a steady output for the field army."
 WRK_utilitarian_pw_defence_cluster: "A Defence Machinery Cluster"
 WRK_utilitarian_pw_defence_cluster_desc: "A new defence cluster will expand sustained weapons production. A single stockpile grant cannot support a prolonged war with Itora."
 WRK_utilitarian_pw_machine_tools: "Precision Machine Acceptance"
 WRK_utilitarian_pw_machine_tools_desc: "Precision tools will raise the efficiency ceiling of existing lines while civilian suppliers receive their own production capacity."
 WRK_utilitarian_pw_transport_works: "Serial Transport Platforms"
 WRK_utilitarian_pw_transport_works_desc: "Transport workshops will deliver the first batch of military vehicles and establish serial production."
 WRK_utilitarian_pw_production_board: "Defence Production Dispatch"
 WRK_utilitarian_pw_production_board_desc: "The production board will connect procurement, quality control and the actual needs of the army, increasing sustained military output."
 WRK_utilitarian_pw_territorial_council: "Council of Territorial Directorates"
 WRK_utilitarian_pw_territorial_council_desc: "Territories will receive a defined place in common government. Victory must be followed by institutions able to carry out decisions."
 WRK_utilitarian_pw_service_charter: "Return of Skilled Personnel"
 WRK_utilitarian_pw_service_charter_desc: "The service charter defines duties and guarantees. No district should become the private possession of its wartime commander."
 WRK_utilitarian_pw_local_charters: "Municipal Technical Charters"
 WRK_utilitarian_pw_local_charters_desc: "Local powers will have clear boundaries. Citizens must know who is responsible for justice, supply and reconstruction."
 WRK_utilitarian_pw_procurement_audit: "Independent Acceptance of State Orders"
 WRK_utilitarian_pw_procurement_audit_desc: "Procurement inspection will recover resources lost through intermediaries and make military contracts enforceable."
 WRK_utilitarian_pw_treasury: "A Consolidated Reconstruction Balance"
 WRK_utilitarian_pw_treasury_desc: "A consolidated treasury will fund long-term programmes and turn promises of reconstruction into practical support."
 WRK_utilitarian_pw_defence_compact: "Joint Defence Protocol"
 WRK_utilitarian_pw_defence_compact_desc: "Common defence obligations connect the constitutional settlement to army reform, allowing the rear to withstand another war."
 WRK_utilitarian_pw_subject_charter: "Charter of Technical Trusteeship"
 WRK_utilitarian_pw_subject_charter_desc: "Our charter defines dependent governments after victory: confederate republics, military administrations or technical trusteeships. Their political system follows the current government of Vorkerland."
 WRK_utilitarian_pw_ebern_campaign: "Integrate the Ebern Junction"
 WRK_utilitarian_pw_ebern_campaign_desc: "Macri has preserved an independent Ebern. This programme authorizes a decision to subjugate it. An allied Afrela joins the same war, and both must be defeated before the settlement."
 WRK_utilitarian_pw_afrela_campaign: "The Afrelan Industrial Corridor"
 WRK_utilitarian_pw_afrela_campaign_desc: "After settling Ebern, a separate decision can authorize the subjugation of Afrela. If it was already subordinated in the joint war, this focus is bypassed."
 WRK_utilitarian_pw_regional_settlement: "An Interregional Technical Network"
 WRK_utilitarian_pw_regional_settlement_desc: "Dependent governments have entered the agreed settlement. Permanent links and reconstruction can now support their common defence."
 ADISCORD_vorkerland_postwar_institutions: "Restored Institutions of Vorkerland"
 ADISCORD_vorkerland_postwar_institutions_desc: "The accumulated effects of postwar military, industrial and reconstruction programmes."
 ADISCORD_vorkerland_pw_delta_repair: "Organized Repairs"
 ADISCORD_vorkerland_pw_delta_civil_building: "Restored Construction Industry"
 ADISCORD_vorkerland_pw_delta_cadres: "Returning Cadres"
 ADISCORD_vorkerland_pw_delta_officers: "Junior Officer Schools"
 ADISCORD_vorkerland_pw_delta_exercises: "Joint Field Exercises"
 ADISCORD_vorkerland_pw_delta_logistics: "Regular Army Supply"
 ADISCORD_vorkerland_pw_delta_training: "A Trained Reserve"
 ADISCORD_vorkerland_pw_delta_worker_army: "An Armed Union of Republics"
 ADISCORD_vorkerland_pw_delta_standards: "Defence Procurement Standards"
 ADISCORD_vorkerland_pw_delta_tools: "Precision Factory Acceptance"
 ADISCORD_vorkerland_pw_delta_output: "Coordinated Defence Output"
 ADISCORD_vorkerland_pw_delta_joint_army: "An Army under One Command"
 ADISCORD_vorkerland_pw_delta_utilitarian_army: "An Army of Continuous Supply"
 WRK_pw_subject_charter_tt: "Dependent countries adopt the political system of the current Vorkerland government. The worker route creates confederate republics; the military route creates military administrations; the technical route creates technical trusteeships."
 WRK_pw_ebern_war_tt: "Begins a war to subjugate Ebern. An allied Afrela joins the same war. Every participant must be defeated before dependent governments are established under our chosen system."
 WRK_pw_afrela_war_tt: "Begins a war to subjugate Afrela. Victory establishes a dependent government under our chosen system."
 WRK_pw_no_other_war_tt: "Vorkerland is not fighting another war"
 WRK_pw_ebern_target_tt: "Macri rules Ebern, has defeated its rival governments and controls its main territories"
 WRK_pw_afrela_target_tt: "Ebern is Vorkerland's subject, or has ceased to exist and Vorkerland owns and controls its main territories"
 autonomy_WRK_military_administration: "Military Administration"
 ADISCORD_vorkerland_postwar.3.t: "A New Order on the Southern Frontier"
 ADISCORD_vorkerland_postwar.3.d: "The fighting has ended with the establishment of dependent governments. Local institutions retain their territories, but foreign policy and defence obligations now follow their agreement with Vorkerland.\n\nThe restored centre has gained more than a frontier. It now bears responsibility for the order established beyond it. Military administrations, confederate republics and technical directorates divide authority differently, but each must turn victory into everyday government."
 ADISCORD_vorkerland_postwar.3.a: "Put the agreements into effect"
 ADISCORD_vorkerland_pw_ebern_campaign: "Launch the Ebern Campaign"
 ADISCORD_vorkerland_pw_ebern_campaign_desc: "$WRK_pw_ebern_war_tt$"
 ADISCORD_vorkerland_pw_afrela_campaign: "Launch the Afrela Campaign"
 ADISCORD_vorkerland_pw_afrela_campaign_desc: "$WRK_pw_afrela_war_tt$"
 ADISCORD_vorkerland_pw_delta_attack: "Offensive Drill"
 WRK_pw_reconstruction_unlock_tt: "§Y1§! reconstruction programme may run at a time; each core region is rebuilt once."
 WRK_pw_reconstruction_slot_tt: "§Y1§! more §YDistrict Reconstruction§! programme may run at the same time."
 WRK_pw_rebuild_slot_tt: "At least one construction programme is free. Running now: §Y[?ADISCORD_vorkerland_pw_rebuild_active|0]§!. Reconstruction focuses raise the number of programmes"
 WRK_pw_rebuild_start_tt: "After §Y60§! days the region receives the programme result. If the region is lost, the programme stops and the right to it remains. Each region is rebuilt once."
 ADISCORD_vorkerland_pw_rebuild_district: "Rebuild the District"
 ADISCORD_vorkerland_pw_rebuild_district_desc: "The war left broken roads, empty workshops and people without work. The programme sends builders, materials and orders to [From.GetName]. What rises from the ruins depends on the reconstruction course: cooperative workshops, a garrison arsenal or a measured engineering network."
 WRK_pw_treaty_charter_tt: "Western regions accept a §YTreaty on the West§! more readily: the chance of acceptance rises noticeably."
 WRK_pw_local_charters_tt: "Guarantees of local power make a §YTreaty on the West§! even more attractive: the chance of acceptance rises more than from any other charter."
 WRK_pw_arm_front_partners_tt: "Each current western member of the §YConfederate Front§! receives §Y3000§! rifles and §Y300§! support equipment."
 WRK_pw_local_coalition_tt: "The country's faction has no members other than Ebern and Afrela"
 WRK_pw_no_subjects_tt: "The country has no subjects of its own"
 WRK_pw_independent_command_tt: "Vorkerland leads its faction or belongs to no faction"
 WRK_pw_campaign_idle_tt: "The previous southern expedition has ended"
 WRK_pw_settlement_complete_tt: "The settlement of dependent governments is complete"
