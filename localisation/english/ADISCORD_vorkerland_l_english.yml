# Technical administration
 ADISCORD_vorkerland_tva_administration:0 "Technical Administration"
 ADISCORD_vorkerland_tva_administration_desc:0 "Network load: §Y[?TVA_network_load|0]/100§!\nCadre reserve: §Y[?TVA_cadre_reserve|0]/100§!\nNext trial success chance: §Y[?TVA_trial_success_chance|0]%§!\nProtected reserve: §Y[?TVA_protected_cadre|0]§! (preserved for the postwar republic)\n[GetTVAPendingTrial]\nCrew coordination: §Y[?TVA_crew_standards|0]/3§!.\n\nLoad above 50 reduces military factory output by 0.2% per point. Each reserve point above or below 50 changes research speed by 0.1%. Maintenance, crew training, production programmes and public reporting share one administration slot."
 TVA_administration_dynamic:0 "Technical Administration"
 TVA_administration_status_tt:0 "Network load: §Y[?TVA_network_load|0]/100§!. Cadre reserve: §Y[?TVA_cadre_reserve|0]/100§!. Crew coordination: §Y[?TVA_crew_standards|0]/3§!."
