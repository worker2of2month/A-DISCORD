 WRK_vorkerland_utilitarian_republic: "Utilitarian Republic of Vorkerland"
 WRK_vorkerland_utilitarian_republic_DEF: "the Utilitarian Republic of Vorkerland"
 WRK_vorkerland_utilitarian_republic_ADJ: "Vorkerland"
 WKR_pragmatism_party: "Worker Revolutionary Party"
 WKR_pragmatism_party_long: "Worker Revolutionary Party"
