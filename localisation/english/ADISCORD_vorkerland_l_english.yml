l_english:
# --- buildings_l_english ---
 ADISCORD_unity_tower_complex: "Unity Tower Complex"
 ADISCORD_unity_tower_complex_plural: "Unity Tower Complexes"
 ADISCORD_unity_tower_complex_desc: "The confederation's administrative, research, and communications core. The Tower accelerates coordination and construction in the Central District, while its hardened archives and computation systems place a visible burden on the power grid."
 ADISCORD_techlar_metallurgical_combine: "Techlar Energy and Metallurgy Combine"
 ADISCORD_techlar_metallurgical_combine_plural: "Techlar Energy and Metallurgy Combines"
 ADISCORD_techlar_metallurgical_combine_desc: "An integrated chain for dismantling old machinery, enriching ore, and electric smelting. It is the region's largest steel source, at the cost of construction capacity, power, and usable land across the Firnov agglomeration."

# --- civil_war_focus_l_english ---
 VAD_convene_collegial_staff:0 "Convene the Collegial Staff"
 VAD_convene_collegial_staff_desc:0 "Worker does not stand beside Petrichev, but a crown need not be the only source of authority. District commanders can form a common government whose chairman answers to the staff for every order."
 VAD_require_collective_directives:0 "Require Collective Directives"
 VAD_require_collective_directives_desc:0 "Decisions must pass across a common table before reaching field headquarters. Regular garrison rotation will loosen the ties that turn commandants into local masters."
 VAD_delegate_to_front_commands:0 "Delegate to Front Commands"
 VAD_delegate_to_front_commands_desc:0 "A commander on the ground sees what the capital cannot. Authority to act independently must come with responsibility for field depots and relations with the district."
 VAD_codify_staff_mandate:0 "Codify the Staff Mandate"
 VAD_codify_staff_mandate_desc:0 "The officers' temporary agreement must become a system of government. A statute will define the chairman's authority and the point at which an order requires the directorate's consent."
 WRK_joint_ratify_staff_constitution:0 "Ratify the Military Republic Constitution"
 WRK_joint_ratify_staff_constitution_desc:0 "The restored Unity Tower once again speaks to the whole country. The directorate must establish its right to govern in peacetime and recognise the limits of emergency authority. Petrichev will sign the constitution as chairman, not sovereign."
 VAD_collegial_mandate_available_tt:0 "Worker was not rescued by Petrichev; the independent government has not chosen another political course."
 VAD_collegial_government_active_tt:0 "An independent military directorate chaired by Petrichev is in power."
 VAD_collegial_mandate_chosen_tt:0 "Petrichev will chair the collegial staff. The joint cabinet and imperial course become unavailable."
 VAD_staff_mandate_survives_tt:0 "The directorate's mandate survives national reunification."
 VAD_staff_republic_tt:0 "The country adopts the military republic identity; Petrichev remains chairman of the directorate."
 VAD_staff_party:0 "£GFX_generic_etatism_military_committee_party_texticon Military Directorate"
 VAD_staff_party_long:0 "£GFX_generic_etatism_military_committee_party_texticon Collegial General Staff of Vorkerland"
 VAD_vorkerland_staff_republic:0 "Vorkerland Military Republic"
 VAD_vorkerland_staff_republic_DEF:0 "the Vorkerland Military Republic"
 VAD_vorkerland_staff_republic_ADJ:0 "Vorkerlander"
 VAD_collegial_staff_dynamic:0 "Military Directorate Mandate"
 VAD_collegial_staff_dynamic_desc:0 "A common statute defines the authority of the chairman and field commanders."
 VAD_staff_collective_delta:0 "Collective Planning"
 VAD_staff_delegation_delta:0 "Front Command Autonomy"
 VAD_staff_constitution_delta:0 "Military Republic Constitution"
 VAD_staff_rotation_programme:0 "Rotate the District Garrison"
 VAD_staff_rotation_programme_desc:0 "A new garrison will replace units too closely tied to the local commandant. Quartermasters will inspect the stores in the presence of the directorate's representatives."
 VAD_staff_depot_programme:0 "Establish a Field Depot"
 VAD_staff_depot_programme_desc:0 "The commander is gathering stores closer to the troops. District officials must negotiate transport, premises and loading crews with the army."
 VAD_staff_rotation_unlock_tt:0 "District rotation reduces unrest and temporarily improves local supplies."
 VAD_staff_depot_unlock_tt:0 "A field depot temporarily improves supplies and troop movement, while raising district unrest."
 VAD_staff_rotation_available_tt:0 "The directorate is active; we own and control a commandant district without an active rotation or field depot."
 VAD_staff_depot_available_tt:0 "The directorate is active; we own and control a commandant district without an uprising, active rotation or field depot."
 VAD_staff_rotation_result_tt:0 "After §Y21 days§! in the selected district: unrest §G-30§! (minimum §Y0§!), the uprising ends; controller local supplies §G+15%§! for §Y70 days§!."
 VAD_staff_depot_result_tt:0 "After §Y21 days§! in the selected district: controller local supplies §G+25%§! and army speed §G+5%§! for §Y70 days§!; unrest §R+20§!. At §Y100§!, an uprising begins and suspends local benefits."
 VAD_staff_programme_cancellation_tt:0 "Losing the district, its commandant administration or the directorate's authority cancels unfinished work with a full refund. Local benefits are suspended during an uprising and removed when the commandant administration closes."
 VAD_staff_rotated_garrison:0 "Rotated Garrison"
 VAD_staff_field_depot:0 "Directorate Field Depot"
 VAD_oath_pending_staff_rotation:0 "Garrison rotation: §Y[?VAD_oath_state.GetName]§!."
 VAD_oath_pending_staff_depot:0 "Field depot: §Y[?VAD_oath_state.GetName]§!."
 ADISCORD_vorkerland_claimant.13.staff.d:0 "A summary of signed directives lies on Petrichev's desk. Every commander now knows which decisions are his to make and which require the common council. For the first time, the directorate addresses the districts as one authority. Its chairman demands that headquarters obey the order they have just established."
 ADISCORD_vorkerland_claimant.13.staff.a:0 "The staff is bound by its own statute."
 VAD_staff_rotation_cost:0 "§Y25§! £political_power_texticon §Y500§! £population_texticon §Y60§! £support_equipment_texticon"
 VAD_staff_rotation_cost_blocked:0 "§R25§! £political_power_texticon §R500§! £population_texticon §R60§! £support_equipment_texticon"
 VAD_staff_rotation_cost_tooltip:0 "Cost: §Y25§! £political_power_texticon §Y500§! £population_texticon §Y60§! £support_equipment_texticon."
 VAD_staff_depot_cost:0 "§Y25§! £political_power_texticon §Y100§! £support_equipment_texticon"
 VAD_staff_depot_cost_blocked:0 "§R25§! £political_power_texticon §R100§! £support_equipment_texticon"
 VAD_staff_depot_cost_tooltip:0 "Cost: §Y25§! £political_power_texticon §Y100§! £support_equipment_texticon."
 VAD_vorkerland_collegial_staff:0 "Vorkerland Military Directorate"
 VAD_vorkerland_collegial_staff_DEF:0 "Vorkerland Military Directorate"
 VAD_vorkerland_collegial_staff_ADJ:0 "Vorkerlandian"
 VAD_collegial_petrichev_desc:0 "Vlad Petrichev chairs a council of district commanders. His authority rests on a service mandate, while decisions about the country pass through the general staff. Worker has no place in this government, and claims to a crown do not define it."

 VAD_convene_joint_congress:0 "Convene the Two Delegations"
 VAD_convene_joint_congress_desc:0 "Worker and Petrichev united two camps with their signatures, yet district commandants still listen only to headquarters. Workers need their own seats at the table where the fate of their districts is decided. The alliance will outlive the war only if it wins recognition beyond the capital."
 VAD_sign_joint_operational_orders:0 "Sign Joint Operational Plans"
 VAD_sign_joint_operational_orders_desc:0 "Field headquarters still argue over whose seal makes an order binding. Worker and Petrichev can end that argument with a common operational plan. But an order bearing two signatures remains an order, and not every district will welcome it."
 VAD_joint_congress_programme:0 "Receive the District Delegations"
 VAD_joint_congress_programme_desc:0 "Representatives of workshops, garrisons and local administrations arrive in the capital. Around a common table, they must agree what a commandant may demand of a district and where that authority ends."
 VAD_joint_operations_programme:0 "Coordinate the Next Operation"
 VAD_joint_operations_programme_desc:0 "Petrichev's officers compare their maps with Worker's representatives. Once a common plan is approved, district administrations will have to subordinate their own needs to it. This time, nobody can appeal to a contradictory order from the other cabinet."
 VAD_joint_congress_district_tt:0 "A district we own and control has a commandant administration and at least §Y20§! unrest."
 VAD_joint_congress_available_tt:0 "The joint government is in office; a commandant district we own and control has at least §Y20§! unrest."
 VAD_joint_operations_available_tt:0 "The joint government is at war; the previous joint operational orders have expired."
 VAD_joint_congress_unlock_tt:0 "District delegations can negotiate lower unrest in every commandant district we hold."
 VAD_joint_operations_unlock_tt:0 "Unlocks temporary operational orders for the army at the cost of higher unrest in commandant districts."
 VAD_joint_congress_result_tt:0 "After §Y14 days§!: unrest falls by §G20§! in every commandant district we own and control (minimum §Y0§!); active local uprisings there end."
 VAD_joint_operations_result_tt:0 "After §Y14 days§!: joint operational orders take effect. Unrest rises by §R10§! in every commandant district we own and control (maximum §Y100§!); reaching §Y100§! starts a local uprising."
 VAD_joint_programme_cancellation_tt:0 "Occupies the shared chancery queue until completion. Losing the conditions cancels the programme and refunds its full payment; a country handoff transfers the refund to our successor."
 VAD_joint_operational_orders:0 "Joint Operational Orders"
 VAD_joint_operational_orders_desc:0 "Headquarters and council have agreed on a common campaign plan. Field units receive a single set of orders whose execution is the responsibility of both leaders."
 VAD_oath_pending_joint_congress:0 "The district congress is in session. Paid: §Y[?VAD_oath_pp|0]§! £political_power_texticon §Y[?VAD_oath_manpower|0]§! £population_texticon."
 VAD_oath_pending_joint_operations:0 "A joint operation is being prepared. Paid: §Y[?VAD_oath_pp|0]§! £political_power_texticon §Y[?VAD_oath_support|0]§! £support_equipment_texticon."
 VAD_joint_congress_cost:0 "§Y35§! £political_power_texticon §Y500§! £population_texticon"
 VAD_joint_congress_cost_blocked:0 "§R35§! £political_power_texticon §R500§! £population_texticon"
 VAD_joint_congress_cost_tooltip:0 "Cost: §Y35§! £political_power_texticon §Y500§! £population_texticon."
 VAD_joint_operations_cost:0 "§Y30§! £political_power_texticon §Y100§! £support_equipment_texticon"
 VAD_joint_operations_cost_blocked:0 "§R30§! £political_power_texticon §R100§! £support_equipment_texticon"
 VAD_joint_operations_cost_tooltip:0 "Cost: §Y30§! £political_power_texticon §Y100§! £support_equipment_texticon."

 ADISCORD_vorkerland_wkr_administration:0 "Worker Councils"
 ADISCORD_vorkerland_wkr_administration_desc:0 "Councils established: §Y[?ADISCORD_vorkerland_wkr_councils|0]§!. Working in the rear: §Y[?WKR_working_councils|0]§!. Assigned to the army, including training: §Y[?ADISCORD_vorkerland_wkr_councils_mobilized|0]§!.\n\n[GetWKRCouncilOrder]\n\n[GetWKRPoliticalMandate]\n\n[GetWKRRailwayOrder]"
 WKR_mobilize_factory_columns:0 "Assemble the Factory Columns"
 WKR_mobilize_factory_columns_desc:0 "Factory whistles give way to drill commands. Two councils assemble their workers into a common column: workshop rosters become company rolls, and the duty foremen sign for their arms."
 WKR_council_context_tt:0 "The emergency government is independent, has not capitulated and remains in the civil-war campaign; we own and control the capital."
 WKR_council_order_free_tt:0 "No other paid worker-council formation is being prepared."
 WKR_council_seats_1_tt:0 "At least one uncommitted council is working in the rear."
 WKR_council_seats_2_tt:0 "At least two uncommitted councils are working in the rear."
 WKR_council_unlock_tt:0 "Councils can form factory detachments from paid personnel and weapons."
 WKR_council_order_1_tt:0 "One council leaves its workshops. After training, WKR receives one factory detachment in the capital: three militia battalions equipped with the paid personnel and rifles."
 WKR_council_order_2_tt:0 "Two councils leave their workshops. After training, WKR receives two factory detachments in the capital, each with three militia battalions equipped with the paid personnel and rifles."
 WKR_council_order_cancellation_tt:0 "Lacking an owned and controlled capital, capitulation, subjugation or the end of the civil conflict cancels training: the full payment is returned and the councils resume rear-area work. Reunified Workerland receives the refund during the handoff. A change of leader does not cancel the order."
 WKR_council_delivered_tt:0 "WKR receives §Y[?WKR_delivered_councils|0]§! factory detachments in the capital. Each has three militia battalions with paid personnel and rifles."
 WKR_council_order_pending:0 "Factory detachments in training: §Y[?WKR_council_order_units|0]§!. Paid: §Y[?WKR_council_order_pp|0]§! £political_power_texticon §Y[?WKR_council_order_manpower|0]§! £population_texticon §Y[?WKR_council_order_rifles|0]§! £infantry_equipment_texticon. These formations have not yet deployed."
 WKR_council_order_idle:0 "No paid formations are in training."
 WKR_factory_battalion_unit:0 "Factory Detachment"
 WKR_councils_batch_mobilized_dummy:0 "Two Councils Join the Army"
 WKR_council_order_cost:0 "§Y25§! £political_power_texticon §Y3000§! £population_texticon §Y2700§! £infantry_equipment_texticon"
 WKR_council_order_cost_blocked:0 "§R25§! £political_power_texticon §R3000§! £population_texticon §R2700§! £infantry_equipment_texticon"
 WKR_council_order_cost_tooltip:0 "§Y25§! £political_power_texticon §Y3000§! £population_texticon §Y2700§! £infantry_equipment_texticon"
 WKR_council_batch_cost:0 "§Y50§! £political_power_texticon §Y6000§! £population_texticon §Y5400§! £infantry_equipment_texticon"
 WKR_council_batch_cost_blocked:0 "§R50§! £political_power_texticon §R6000§! £population_texticon §R5400§! £infantry_equipment_texticon"
 WKR_council_batch_cost_tooltip:0 "§Y50§! £political_power_texticon §Y6000§! £population_texticon §Y5400§! £infantry_equipment_texticon"
# District administration
 ADISCORD_vorkerland_vad_administration:0 "Headquarters and Chancery"
 ADISCORD_vorkerland_vad_administration_desc:0 "Active charters: §Y[?ADISCORD_vorkerland_vad_charters|0]§!. Commandantures: §Y[?ADISCORD_vorkerland_vad_commandants|0]§!.\n[GetVADOathProject]\n\nThe chancery handles one district programme at a time. Charters are limited to three districts; crown commissions add three more slots. Commandantures start at 20 unrest and add [GetVADUnrestRate] each month: 10 above 10% chancery influence, 30 above 60% staff dominance, otherwise 20. At 100 a local uprising begins. Lost or withdrawn administrations may be rebuilt at full price."
 VAD_bop:0 "Headquarters and Chancery"
 VAD_bop_staff:0 "Army Headquarters"
 VAD_bop_chancery:0 "District Chancery"
 VAD_bop_even:0 "Agreed Orders"
 VAD_bop_staff_influence:0 "Army Priority"
 VAD_bop_staff_dominance:0 "Orders Above Law"
 VAD_bop_chancery_influence:0 "Civil Registers"
 VAD_bop_chancery_dominance:0 "Chancery Authority"
 VAD_administration_active_tt:0 "The military district is independent, has not capitulated and remains in the civil-war campaign."
 VAD_oath_slot_tt:0 "The chancery is not handling another district programme."
 VAD_oath_target_tt:0 "We own and control the district; it has no existing oath or pending application."
 VAD_charter_available_tt:0 "The district administration is active, the target is held and a charter place is free."
 VAD_commandant_available_tt:0 "The military district is active and fully holds the target state."
 VAD_oath_pending_charter:0 "The chancery is drafting a district charter."
 VAD_oath_pending_commandant:0 "Headquarters is establishing a commandanture."
 VAD_oath_idle:0 "The chancery is ready for a new application."
 VAD_oath_cancellation_tt:0 "Losing the state, capitulation, subjugation or the end of the civil conflict cancels the application with a full refund. Reunified Workerland receives the refund during the handoff."
 VAD_charter_unlock_tt:0 "District charters expand local recruitment and strengthen legitimacy."
 VAD_commandant_unlock_tt:0 "Commandantures expand local recruitment and access to factories but accumulate unrest. A separate operation can restore order, or the commandant can be withdrawn."
 VAD_charter_programme_tt:0 "The charter grants §G+20%§! local manpower, adds §G0.03§! legitimacy and shifts the balance §Y15%§! towards the chancery."
 VAD_commandant_programme_tt:0 "The commandanture grants §G+10%§! local manpower and §G+15%§! local factories, costs §R0.02§! legitimacy and shifts the balance §Y15%§! towards headquarters. The commandanture starts at §Y20/100§! unrest; monthly growth follows the staff and chancery balance. A local uprising begins at §R100§!."
 VAD_give_the_staff_priority:0 "Give Army Headquarters Priority"
 VAD_give_the_staff_priority_desc:0 "Field commanders demand answers before the chancery has finished its deliberations. Petrishchev allows headquarters to allocate people and transport first."
 VAD_hear_the_district_petitions:0 "Hear the District Petitions"
 VAD_hear_the_district_petitions_desc:0 "District administrations submit lists of disputed requisitions and people taken in breach of earlier commitments. The chancery will require headquarters to reconcile its orders with the registers."
