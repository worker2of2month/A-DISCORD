 ADISCORD_vorkerland_empire_bop_court:0 "[GetVorkerlandEmpireCourtSide]"
 ADISCORD_vorkerland_empire_bop_corps:0 "The Officer Corps"
 ADISCORD_vorkerland_empire_balance_even:0 "Fragile Balance"
 ADISCORD_vorkerland_empire_court_influence:0 "Influence of the Court"
 ADISCORD_vorkerland_empire_court_dominance:0 "Rule of the Court"
 ADISCORD_vorkerland_empire_corps_influence:0 "Influence of the Officers"
 ADISCORD_vorkerland_empire_corps_dominance:0 "Dictate of the Staffs"
 ADISCORD_vorkerland_empire_corps_conspiracy:0 "The Generals' Plot"
 ADISCORD_vorkerland_empire_category:0 "[GetVorkerlandEmpireCategoryName]"
 ADISCORD_vorkerland_empire_category_desc:0 "[GetVorkerlandEmpireCategoryDesc]"
 WRK_empire_appoint_governor:0 "Imperial Governor"
 WRK_empire_appoint_governor_desc:0 "The governor takes charge of a district on behalf of the empire. A charter from the capital defines the office, but daily government begins with the oath of local institutions."
 WRK_empire_appoint_governor_start_tt:0 "An imperial governor takes office in this state in §Y30§! days. Losing the district, its core status or national independence cancels the appointment without a refund."
 WRK_empire_military_governors_tt:0 "New §YImperial Governors§! install a military administration: §G+25%§! local recruitable population and §G+20%§! supply in the state, §G+4000§! £manpower_texticon, and a §Y2%§! shift toward the officer corps."
 WRK_empire_civil_governors_tt:0 "New §YImperial Governors§! install a civil administration: §G+10%§! factory output and §G+15%§! construction speed in the state, §G+2000§! £manpower_texticon, and a §Y5%§! shift toward the court."
 WRK_empire_staff_advisor_tt:0 "Chief of staff §YPavel Barsov§! becomes available."
 WRK_empire_western_ultimatum_tt:0 "The western crisis escalates: §R+10§! tension, and the war with Itora comes closer."
 WRK_empire_veyran_order_tt:0 "[GetVorkerlandEmpireOrderTooltip]"
 WRK_empire_after_the_tribunal:0 "[GetVorkerlandEmpireFoundationName]"
 WRK_empire_after_the_tribunal_desc:0 "[GetVorkerlandEmpireFoundationDesc]"
 WRK_empire_court_of_the_chairman:0 "The Chairman's Court"
 WRK_empire_court_of_the_chairman_desc:0 "A court forms around Worcker: secretaries, advisers and former district officials who owe him everything. It gives the chairman support that does not depend on the generals."
 WRK_empire_erase_petrishchev:0 "Erase Petrishchev's Name"
 WRK_empire_erase_petrishchev_desc:0 "The portraits come down, orders bearing his signature are rewritten, and the newspapers no longer mention the chairman's rescuer. The army must forget whom it swore to in the war."
 WRK_empire_posthumous_rehabilitation:0 "Posthumous Rehabilitation"
 WRK_empire_posthumous_rehabilitation_desc:0 "Worcker admits that Petrishchev served the state and blames his entourage. The officers get their hero back, and with him the confidence that their voice weighs more in the empire than the court's."
 WRK_empire_state_union:0 "The Imperial State Union"
 WRK_empire_state_union_desc:0 "The empire's single party unites officials, officers and factory directors. Membership opens the way to office, and expulsion closes it forever."
 WRK_empire_saved_chairman_cult:0 "Cult of the Rescued Chairman"
 WRK_empire_saved_chairman_cult_desc:0 "The story of the rescue from the rubble is rewritten: now fate itself carried Worcker out. Posters, textbooks and broadcasts teach that the empire exists because its chairman survived."
 WRK_empire_imperial_governors:0 "Imperial Governorates"
 WRK_empire_imperial_governors_desc:0 "[GetVorkerlandEmpireGovernorsDesc]"
 WRK_empire_military_governors:0 "Military Governors"
 WRK_empire_military_governors_desc:0 "Retired commanders become governors. They know how to gather recruits and keep order, but they serve the staffs rather than the court."
 WRK_empire_civil_governors:0 "Civil Governors"
 WRK_empire_civil_governors_desc:0 "Court officials become governors. They rebuild factories and building sites, and the officers in the states answer to civil authority."
 WRK_empire_imperial_census:0 "The Imperial Census"
 WRK_empire_imperial_census_desc:0 "For the first time since the collapse, the governors count the people of the former districts. The census reveals reserves no district staff knew about."
 WRK_empire_staff_without_petrishchev:0 "[GetVorkerlandEmpireStaffName]"
 WRK_empire_staff_without_petrishchev_desc:0 "[GetVorkerlandEmpireStaffDesc]"
 WRK_empire_guard_legions:0 "Guard Legions"
 WRK_empire_guard_legions_desc:0 "The best formations become the empire's guard and receive guns, support equipment and picked officers. The guard is strong, but it remembers that it can dictate terms."
 WRK_empire_imperial_levy:0 "The Imperial Levy"
 WRK_empire_imperial_levy_desc:0 "Every state must provide its share of conscripts. A mass army holds the front with numbers and stays loyal to the throne rather than to individual commanders."
 WRK_empire_legions_of_the_west:0 "Legions of the West"
 WRK_empire_legions_of_the_west_desc:0 "Trucks and a locomotive reserve prepare the army for the march west. The legions must move faster than the enemy can shift its reserves."
 WRK_empire_imperial_air_command:0 "Imperial Air Command"
 WRK_empire_imperial_air_command_desc:0 "Fighters and ground-attack aircraft are combined under one command attached to the general staff. The empire will not yield the sky over the western front."
 WRK_empire_imperial_treasury:0 "A Treasury Without the Republic"
 WRK_empire_imperial_treasury_desc:0 "The district treasuries are abolished and taxes flow into one imperial treasury. State orders plan output years ahead."
 WRK_empire_district_tribute:0 "Tribute from the Districts"
 WRK_empire_district_tribute_desc:0 "The former districts pay the empire in money, weapons and food. The treasury fills at once, but the states remember who came for the tribute with an armed escort."
 WRK_empire_imperial_works:0 "Imperial Works"
 WRK_empire_imperial_works_desc:0 "The empire rebuilds what the civil war destroyed. New factories and district reconstruction must show that the centre not only takes but also builds."
 WRK_empire_tribute_arsenals:0 "Arsenals from Tribute"
 WRK_empire_tribute_arsenals_desc:0 "The collected tribute pays for new arms factories. Their lines work for the march against Itora."
 WRK_empire_building_offices:0 "Imperial Building Offices"
 WRK_empire_building_offices_desc:0 "Every province receives a building office answerable to the imperial works. Ruined districts are rebuilt in parallel rather than one after another."
 WRK_empire_war_economy:0 "An Economy for the March"
 WRK_empire_war_economy_desc:0 "Civilian and military enterprises work to one war plan. The empire prepares its rear for a long campaign in the west."
 WRK_empire_western_ultimatum:0 "Ultimatum to the West"
 WRK_empire_western_ultimatum_desc:0 "The empire demands that the western capitals choose a side without delay. The ultimatum rallies the army and brings the war with Itora closer."
 WRK_empire_imperial_peace:0 "The Imperial Peace"
 WRK_empire_imperial_peace_desc:0 "Itora has capitulated, and for the first time in years there is no front in the west. The empire stands its army down and secures the victory with administration rather than bayonets."
 WRK_empire_tower_coronation:0 "The Oath in the Unity Tower"
 WRK_empire_tower_coronation_desc:0 "[GetVorkerlandEmpireCoronationDesc]"
 WRK_empire_marshals_council:0 "The Council of Marshals"
 WRK_empire_marshals_council_desc:0 "The victors over Itora receive permanent seats in the imperial council. The army becomes a pillar of the state, and its commanders a second court."
 WRK_empire_veyran_order:0 "The Veyran Order"
 WRK_empire_veyran_order_desc:0 "[GetVorkerlandEmpireOrderDesc]"
 WRK_empire_delta_after_the_tribunal:0 "The Imperial Court"
 WRK_empire_delta_court_of_the_chairman:0 "The Imperial Court"
 WRK_empire_delta_erase_petrishchev:0 "The Imperial Court"
 WRK_empire_delta_state_union:0 "The Imperial Court"
 WRK_empire_delta_saved_chairman_cult:0 "The Imperial Court"
 WRK_empire_delta_tower_coronation:0 "The Imperial Court"
 WRK_empire_delta_posthumous_rehabilitation:0 "Army of the World Empire"
 WRK_empire_delta_staff_without_petrishchev:0 "Army of the World Empire"
