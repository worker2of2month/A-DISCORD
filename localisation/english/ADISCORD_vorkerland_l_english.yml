 TVA_bop_consent_influence:0 "Negotiated Shifts"
 TVA_bop_consent_dominance:0 "Mandate of the Councils"
 TVA_trial_pending:0 "Paid programme: [GetTVATrialProtocol]. Fixed success chance: §Y[?TVA_trial_chance|0]%§!."
 TVA_trial_idle:0 "No paid trial is in progress."
 TVA_trial_wear_tt:0 "Network load: §R+10§!. Cadre reserve: §R-5§!."
 TVA_programme_slot_tt:0 "The administration programme slot is free."
 TVA_administration_active_tt:0 "The directorate is independent, has not capitulated and the civil conflict has not ended."
 TVA_maintenance_available_tt:0 "The directorate is active and the network needs maintenance."
 TVA_cadre_training_available_tt:0 "The directorate is active; the cadre reserve is not full or crew coordination can still improve."
 TVA_emergency_series_available_tt:0 "[GetTVASeriesRequirements]"
 TVA_programme_cancellation_tt:0 "Losing the conditions refunds the entire payment. On reunification, Vorkerland receives the refund."
 TVA_maintenance_programme:0 "Service the Overloaded Junctions"
 TVA_maintenance_programme_desc:0 "Dispatchers take the most worn junctions off the line. Repair crews finally have time to reach contacts they previously had to replace under load."
 TVA_maintenance_programme_tt:0 "Maintenance removes §G[GetTVAMaintenanceReduction]§! network load, down to a minimum of §Y0§!."
 TVA_maintenance_result_tt:0 "Network load: §G-[GetTVAMaintenanceReduction]§!, down to a minimum of §Y0§!."
 TVA_cadre_training_programme:0 "Train Replacement Engineers and Dispatchers"
 TVA_cadre_training_programme_desc:0 "Every irreplaceable specialist needs an apprentice at their side. Factory councils negotiate shifts and release mentors from emergency assignments."
 TVA_cadre_training_programme_tt:0 "Training adds §G[GetTVACadreTrainingGain]§! cadre reserve, capped at §Y100§!; removes §G5§! network load and shifts the balance §Y10%§! towards consent."
 TVA_cadre_training_result_tt:0 "Cadre reserve: §G+[GetTVACadreTrainingGain]§!, capped at §Y100§!. Network load: §G-5§!."
 TVA_emergency_series_programme:0 "Order an Emergency Arms Batch"
 TVA_emergency_series_programme_desc:0 "The board rewrites the schedule in favour of the arms workshops. Other orders move to the back of the queue while experienced shifts remain at their machines until the batch is delivered."
 TVA_emergency_series_programme_tt:0 "[GetTVASeriesProgramme]"
 TVA_emergency_series_result_tt:0 "Network load: §R+20§!. Cadre reserve: §R-10§!."
 TVA_confirm_schedule:0 "Confirm the Board's Mandatory Schedule"
 TVA_confirm_schedule_desc:0 "The common schedule gains the force of an order. Workshop chiefs must justify every deviation from the calculation, even when the city itself is the reason."
 TVA_hear_councils:0 "Hear the Engineering and City Councils"
 TVA_hear_councils_desc:0 "Representatives of those who carry out the orders enter the dispatch room. Arguments over shifts and municipal power become part of government."
 ADISCORD_vorkerland_claimant.25.t:0 "The Batch Passed Its Trial"
 ADISCORD_vorkerland_claimant.25.d:0 "The field logs arrived on Worx's desk. Engineers' notes agreed with the commanders' reports: the experimental batch had survived the demands of the calculation. The designers now had a tested solution instead of a promise.\n\nThe dispatch office is already preparing a regular schedule for the trial crews. Even a successful experiment leaves worn junctions and people who need relief."
 ADISCORD_vorkerland_claimant.25.a:0 "Pass the tested solutions to the designers."
 ADISCORD_vorkerland_claimant.26.t:0 "The Weak Point"
 ADISCORD_vorkerland_claimant.26.d:0 "The field logs did not confirm the calculation. Some contacts failed; some crews needed more time than the schedule allowed. The team returned a detailed failure register.\n\nWorx demanded that the records remain unedited. The next batch will begin with these pages, but first the trial crews must return to regular work and the network must recover."
 ADISCORD_vorkerland_claimant.26.a:0 "Record every failure."
