 VAD_coalition_guarantees:0 "Offer a coalition treaty to [FROM.GetName]"
 VAD_coalition_guarantees_desc:0 "Local victory leaves disputed borders and suspicious neighbours. The chancery delegation carries a treaty for a common war and a seat at the coalition table."
 VAD_foreign_observers:0 "Invite observers from [FROM.GetName]"
 VAD_foreign_observers_desc:0 "Routes through the frontline headquarters are being prepared for foreign officers. Our commanders will have to answer difficult questions as well as present their successful operations."
 VAD_coalition_guarantees_focus_tt:0 "Central preparations or the central war are in progress; the administration is active, VAD can lead a coalition, and an independent local victor outside any faction is available."
 VAD_foreign_observers_focus_tt:0 "The administration is active, VAD is fighting in the Vorkerland campaign, and an eligible independent partner exists among SOL, ROM and TRU."
 VAD_coalition_guarantees_available_tt:0 "$VAD_coalition_guarantees_focus_tt$ The selected country holds its capital, is at peace, has no surviving local rival and is not considering another offer from us."
 VAD_foreign_observers_available_tt:0 "$VAD_foreign_observers_focus_tt$ The selected country has not capitulated, is not at war with VAD, has not already sent observers and is not considering another offer from us."
 VAD_coalition_guarantees_unlock_tt:0 "Unlocks negotiations for a local victor to join VAD's coalition and wars, subject to its consent."
 VAD_foreign_observers_unlock_tt:0 "Unlocks military missions: army experience and legitimacy in exchange for a partner's access to intelligence on VAD, subject to its consent."
 VAD_coalition_guarantees_result_tt:0 "After preparation, [FROM.GetName] receives the offer and has up to 14 days to reply. Acceptance joins it to VAD's coalition and our side in current wars. It becomes a mandatory major until the campaign ends: the coalition cannot be defeated while it remains standing. The deposit is spent after entry is confirmed."
 VAD_foreign_observers_result_tt:0 "After preparation, [FROM.GetName] receives an invitation and has up to 14 days to reply. Only acceptance delivers the results below and grants VAD §G+6§! percentage points of legitimacy. The partner gains intelligence on our army. One report per country per campaign."
 VAD_foreign_offer_refund_tt:0 "Refusal, loss of conditions or the end of the campaign refunds the full unsettled deposit to VAD; a country handoff transfers the refund to its successor. An undeliverable reply is refunded no later than 30 days after payment. An open offer blocks a new offer to the same partner."
 VAD_coalition_guarantees_accept_tt:0 "Join VAD's coalition and its side in all current wars. Our country becomes a mandatory major until the campaign ends. VAD pays for the treaty; none of our resources are debited."
 VAD_foreign_observers_accept_tt:0 "Deliver the military report; VAD also gains 6 percentage points of legitimacy. None of our resources are debited. Another report is unavailable during this campaign."
 VAD_oath_pending_coalition_guarantees:0 "Coalition treaty: [event_target:VAD_foreign_partner.GetName]"
 VAD_oath_pending_foreign_observers:0 "Military observers: [event_target:VAD_foreign_partner.GetName]"
