 ADISCORD_vorkerland_news.3.t: "Elections in Vorkerland"
 ADISCORD_vorkerland_news.3.worker.d: "Vorkerland's electoral commissions have announced Nikita Worcker's victory. After the civil war he put his powers to a vote and kept his post. Neo-Vorkerism remains the state ideology.\n\nThe emergency government now rests on an electoral mandate. For the neighbours, this means the restored Vorkerland will be led by the same authorities as before."
 ADISCORD_vorkerland_news.3.yastrebtsev.d: "Vorkerland's electoral commissions have announced Mark Yastrebtsev's victory. Following the vote held after the civil war, Nikita Worcker is stepping down as leader. The humanists will form the government.\n\nThe emergency cabinet is ending its work. A new government will take charge of the country's reconstruction."
 ADISCORD_vorkerland_news.3.filopo.d: "Vorkerland's electoral commissions have announced Necro Filopo's victory. The vote called after the civil war has removed Nikita Worcker from power and brought the chauvinists into government.\n\nThe new authorities inherit a country that has barely survived its collapse. Former members of the confederation and foreign neighbours alike are watching their course closely."
 ADISCORD_vorkerland_news.3.a: "The results are in."

 ADISCORD_vorkerland_news.4.t: "Vorkerland Rebuilds the Unity Tower"
 ADISCORD_vorkerland_news.4.d: "The government of [ROOT.GetNameDef] has announced the restoration of the Unity Tower, damaged by the explosion at the start of the civil war. Workers, engineers and archivists are returning the complex to its former appearance. Once the work is complete, it will again house the organs of government, a communications hub and the state archive."
 ADISCORD_vorkerland_news.4.a: "The Tower will be rebuilt."
 ADISCORD_vorkerland_central_initiative:0 "Operational initiative"
 ADISCORD_vorkerland_central_initiative_desc:0 "Coordinated staff work grants a temporary advantage against the other central claimants. Lasts at most two years from the outbreak and ends on capitulation, the end of the civil war, or a player taking control of a central claimant."

# --- postwar_expansion_l_english ---
 WRK_joint_pw_census: "Survey the Ruined Districts"
 WRK_joint_pw_census_desc: "A census of returning families and surviving workshops will provide a firm basis for reconstruction. Work and functioning local administration come first."
 WRK_joint_pw_repair_crews: "Military Reconstruction Teams"
 WRK_joint_pw_repair_crews_desc: "Equipped repair crews will restore damaged enterprises under a common schedule, bringing existing capacity back into production."
 WRK_joint_pw_food_reserve: "Restore Bread Distribution"
 WRK_joint_pw_food_reserve_desc: "A common food reserve will support recruitment and training without forcing hungry towns to supply the army themselves."
 WRK_joint_pw_veteran_housing: "Settlements for Service Families"
 WRK_joint_pw_veteran_housing_desc: "Civilian construction will create work for veterans and their families while expanding the industrial base for further reconstruction."
 WRK_joint_pw_municipal_network: "Restore District Administration"
 WRK_joint_pw_municipal_network_desc: "Municipal agreements will restore deliveries severed by the front lines. Local institutions remain responsible for carrying out the common plan."
 WRK_joint_pw_recovery_complete: "A State beyond Emergency Rule"
 WRK_joint_pw_recovery_complete_desc: "Emergency repairs give way to sustained construction. The country must support its army while rebuilding civilian life."
 WRK_joint_pw_veteran_cadres: "Reassemble the Cadre Corps"
 WRK_joint_pw_veteran_cadres_desc: "Surviving officers and veterans will restore the strength of existing formations before new headquarters compete for scarce recruits."
 WRK_joint_pw_rearmament: "Recover the Regimental Arsenals"
 WRK_joint_pw_rearmament_desc: "Central depots will receive rifles and support equipment. Existing shortages take priority over forming additional under-equipped divisions."
 WRK_joint_pw_officer_school: "School for Junior Officers"
 WRK_joint_pw_officer_school_desc: "Junior officer training will restore platoon and company command. The experience of the civil war becomes a common training programme."
 WRK_joint_pw_field_exercises: "Manoeuvres of the Restored Army"
 WRK_joint_pw_field_exercises_desc: "Field exercises will test cooperation between formerly separate armies. Common orders, communications and replacements prepare them for the western war."
 WRK_joint_pw_motor_pool: "A Motorized Staff Reserve"
 WRK_joint_pw_motor_pool_desc: "Transport and repair units will receive vehicles and equipment, reducing the supply burden of formations at the front."
 WRK_joint_pw_artillery: "Corps Artillery"
 WRK_joint_pw_artillery_desc: "Guns will be distributed with support for their crews. Coordinated artillery fire must support infantry rather than encourage wasteful attacks."
 WRK_joint_pw_reserve: "The Second Mobilization Class"
 WRK_joint_pw_reserve_desc: "A fresh reserve will train through existing depots, replacing casualties and expanding the army as weapons become available."
 WRK_joint_pw_army_reform: "An Army under One Command"
 WRK_joint_pw_army_reform_desc: "The completed reform establishes our own military system."
 WRK_joint_pw_arsenals: "State Arms Yards"
 WRK_joint_pw_arsenals_desc: "Surviving arms workshops will fulfil the first postwar defence order. Military production must expand before the long political settlement is complete."
 WRK_joint_pw_standards: "Standardize Army Supplies"
 WRK_joint_pw_standards_desc: "Common dimensions, ammunition and acceptance procedures will help production lines gain efficiency faster and reach a steady output for the field army."
 WRK_joint_pw_defence_cluster: "A Mobilization Industry District"
 WRK_joint_pw_defence_cluster_desc: "A new defence cluster will expand sustained weapons production. A single arms shipment cannot support a prolonged war with Itora."
 WRK_joint_pw_machine_tools: "Machine Tools for the Arsenals"
 WRK_joint_pw_machine_tools_desc: "Precision tools will improve existing production lines while civilian suppliers receive their own production capacity."
 WRK_joint_pw_transport_works: "Military Transport Workshops"
 WRK_joint_pw_transport_works_desc: "Transport workshops will deliver the first batch of military vehicles and establish serial production."
 WRK_joint_pw_production_board: "The General Staff Contract"
 WRK_joint_pw_production_board_desc: "The production board will connect procurement, quality control and the actual needs of the army, increasing sustained military output."
 WRK_joint_pw_territorial_council: "Council of Military and Civil Districts"
 WRK_joint_pw_territorial_council_desc: "Territories will receive a defined place in common government. Victory must be followed by institutions able to carry out decisions."
 WRK_joint_pw_service_charter: "Charter of Service"
 WRK_joint_pw_service_charter_desc: "The service charter defines duties and guarantees. No district should become the private possession of its wartime commander."
 WRK_joint_pw_local_charters: "Civil Courts in the Restored Lands"
 WRK_joint_pw_local_charters_desc: "Local powers will have clear boundaries. Citizens must know who is responsible for justice, supply and reconstruction."
 WRK_joint_pw_procurement_audit: "Military Procurement Inspection"
 WRK_joint_pw_procurement_audit_desc: "Procurement inspection will recover resources lost through intermediaries and make military contracts enforceable."
 WRK_joint_pw_treasury: "A Unified Treasury"
 WRK_joint_pw_treasury_desc: "A consolidated treasury will fund long-term programmes and turn promises of reconstruction into practical support."
 WRK_joint_pw_defence_compact: "Duties of the Frontier Administrations"
 WRK_joint_pw_defence_compact_desc: "Common defence obligations connect the constitutional settlement to army reform, allowing the rear to withstand another war."
 WRK_joint_pw_subject_charter: "Statute of Dependent Administrations"
 WRK_joint_pw_subject_charter_desc: "The charter will define the powers and obligations of dependent governments after victory."
 WRK_joint_pw_ebern_campaign: "End the Macri Regime"
 WRK_joint_pw_ebern_campaign_desc: "Macri has preserved an independent Ebern on the former confederate lands. We will prepare a campaign to subjugate it and face its ally Afrela. The defeated countries will retain their territories under dependent governments."
 WRK_joint_pw_afrela_campaign: "Subordinate the Afrelan Rear"
 WRK_joint_pw_afrela_campaign_desc: "After settling Ebern, we will turn to Afrela. The campaign will establish a dependent government under our charter."
 WRK_joint_pw_regional_settlement: "A Belt of Military Administrations"
 WRK_joint_pw_regional_settlement_desc: "Dependent governments have entered the agreed settlement. Permanent links and reconstruction can now support their common defence."
 ADISCORD_vorkerland_postwar_institutions: "Restored Institutions of Vorkerland"
 ADISCORD_vorkerland_postwar_institutions_desc: "The accumulated effects of postwar military, industrial and reconstruction programmes."
 ADISCORD_vorkerland_pw_delta_repair: "Organized Repairs"
 ADISCORD_vorkerland_pw_delta_civil_building: "Restored Construction Industry"
 ADISCORD_vorkerland_pw_delta_cadres: "Returning Cadres"
 ADISCORD_vorkerland_pw_delta_officers: "Junior Officer Schools"
 ADISCORD_vorkerland_pw_delta_logistics: "Regular Army Supply"
 ADISCORD_vorkerland_pw_delta_training: "A Trained Reserve"
 ADISCORD_vorkerland_pw_delta_standards: "Defence Procurement Standards"
 ADISCORD_vorkerland_pw_delta_tools: "Precision Factory Acceptance"
 ADISCORD_vorkerland_pw_delta_output: "Coordinated Defence Output"
 ADISCORD_vorkerland_pw_delta_joint_army: "An Army under One Command"
 WRK_pw_subject_charter_tt: "Dependent countries adopt the political system of the current Vorkerland government. The worker route creates confederate republics; the military route creates military administrations; the technical route creates technical trusteeships."
 WRK_pw_ebern_war_tt: "Begins a war to subjugate Ebern. An allied Afrela joins the same war. Every participant must be defeated before dependent governments are established under our chosen system."
 WRK_pw_afrela_war_tt: "Begins a war to subjugate Afrela. Victory establishes a dependent government under our chosen system."
 WRK_pw_no_other_war_tt: "Vorkerland is not fighting another war"
 WRK_pw_ebern_target_tt: "Macri rules Ebern, has defeated its rival governments and controls its main territories"
 WRK_pw_afrela_target_tt: "Ebern is Vorkerland's subject, or has ceased to exist and Vorkerland owns and controls its main territories"
 autonomy_WRK_military_administration: "Military Administration"
 ADISCORD_vorkerland_postwar.3.t: "A New Order on the Southern Frontier"
 ADISCORD_vorkerland_postwar.3.d: "The fighting has ended with the establishment of dependent governments. Local institutions retain their territories, but foreign policy and defence obligations now follow their agreement with Vorkerland.\n\nThe restored centre has gained more than a frontier. It now bears responsibility for the order established beyond it. Military administrations, confederate republics and technical directorates divide authority differently, but each must turn victory into everyday government."
 ADISCORD_vorkerland_postwar.3.a: "Put the agreements into effect"
 ADISCORD_vorkerland_pw_ebern_campaign: "Launch the Ebern Campaign"
 ADISCORD_vorkerland_pw_ebern_campaign_desc: "$WRK_pw_ebern_war_tt$"
 ADISCORD_vorkerland_pw_afrela_campaign: "Launch the Afrela Campaign"
 ADISCORD_vorkerland_pw_afrela_campaign_desc: "$WRK_pw_afrela_war_tt$"
 ADISCORD_vorkerland_pw_delta_attack: "Offensive Drill"
 WRK_pw_reconstruction_unlock_tt: "§Y1§! reconstruction programme may run at a time; each core region is rebuilt once."
 WRK_pw_reconstruction_slot_tt: "§Y1§! more §YDistrict Reconstruction§! programme may run at the same time."
 WRK_pw_rebuild_slot_tt: "At least one construction programme is free. Running now: §Y[?ADISCORD_vorkerland_pw_rebuild_active|0]§!. Reconstruction focuses raise the number of programmes"
 WRK_pw_rebuild_start_tt: "After §Y60§! days the region receives the programme result. If the region is lost, the programme stops and the right to it remains. Each region is rebuilt once."
 ADISCORD_vorkerland_pw_rebuild_district: "Rebuild the District"
 ADISCORD_vorkerland_pw_rebuild_district_desc: "The war left broken roads, empty workshops and people without work. The programme sends builders, materials and orders to [From.GetName]. What rises from the ruins depends on the reconstruction course: cooperative workshops, a garrison arsenal or a measured engineering network."
 WRK_pw_treaty_charter_tt: "The lean of every western state toward Vorkerland grows by §Y5§!."
 WRK_pw_local_charters_tt: "The lean of every western state toward Vorkerland grows by §Y10§!."
 WRK_pw_arm_front_partners_tt: "Each current western member of the §YConfederate Front§! receives §Y27000§! £infantry_equipment_texticon and §Y300§! £support_equipment_texticon."
 WRK_pw_local_coalition_tt: "The country's faction has no members other than Ebern and Afrela"
 WRK_pw_no_subjects_tt: "The country has no subjects of its own"
 WRK_pw_independent_command_tt: "Vorkerland leads its faction or belongs to no faction"
 WRK_pw_campaign_idle_tt: "The previous southern expedition has ended"
 WRK_pw_settlement_complete_tt: "The settlement of dependent governments is complete"
