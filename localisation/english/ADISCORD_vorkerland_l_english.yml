 ADISCORD_vorkerland_wrk_preparations_carry_over_tt:0 "At the split, this general preparation package goes to the apparatus selected in Who receives the last order. Local caches keep their own recipients."
 ADISCORD_vorkerland_prep_worker_reserves_fixed_tt:0 "This explicitly assigned reserve remains with the Worker committee after the split, regardless of the general staff chosen."
 ADISCORD_vorkerland_unlock_core_restoration_decisions_tt: "§GUnlocks decisions§! to restore core status in separate regional packages. Every state in a package must be owned and controlled."
 WRK_worker_recognize_free_republics_tt: "§GUnlocks diplomatic decisions§! to recognise surviving independent Vorkerland republics."
 WRK_worker_write_constitutional_guarantees_tt: "§GPermanently removes§! the remaining legacy of the erased-nations policy and establishes a lasting constitutional settlement."
 TVA_technocratic_directorate_tt: "Dorian Worx leads a §Ytechnocratic directorate§! based on engineering expertise, public records, and direct administrative responsibility."
 WRK_technocratic_reconstruction_mandate_tt: "Establishes a §Ytemporary reconstruction mandate§!. Its specialised bodies will be consolidated by the route's final focus."
 WRK_technocratic_republic_settlement_tt: "Replaces the temporary reconstruction bodies with a §Gpermanent technocratic settlement§!."
 WKR_affirm_worker_mandate: "Define the Western Emergency Mandate"
 WKR_affirm_worker_mandate_desc: "The western claimant needs a common military and industrial mandate before its actual government decides whether legitimacy rests with Nikita Worcker's loyalist councils or Anton Bagley's emergency executive."
 VAD_proclaim_joint_charter: "Proclaim the Restoration Charter"
 VAD_proclaim_joint_charter_desc: "The military district promises to restore common law among the ruins of the confederation. Petrichev brings the chancery and commanders to one table, but signatures on the first charter have yet to settle who will have the final word."
 TVA_codify_utilitarian_directorate: "Codify Worx's Technocratic Programme"
 TVA_codify_utilitarian_directorate_desc: "Doctor Dorian Worx will place engineers, statisticians, and experienced civil servants under one accountable wartime cabinet. Authority will rest on demonstrated competence, controlled trials, and the ability to keep public systems working."
 ADISCORD_vorkerland_claimant_focus_phase_tt: "Available while the temporary claimant system remains active"
 ADISCORD_vorkerland_central_showdown_phase_tt: "Available after the war between the central claimants has begun"
 WRK_measure_confederation_fault_lines: "Measure the Confederation's Fault Lines"
 WRK_measure_confederation_fault_lines_desc: "District reports no longer agree on taxes, troop obligations, or even which decrees remain binding. The republic must know where the structure will break before it gives way."
 WRK_convene_council_of_republics: "Convene the Council of Republics"
 WRK_convene_council_of_republics_desc: "One last conference can secure written commitments from the republics and place constitutional continuity ahead of improvisation."
 WRK_inventory_emergency_stores: "Inventory the Emergency Stores"
 WRK_inventory_emergency_stores_desc: "Weapons, preserved food, and railway spares will be counted and dispersed before a single seizure can deprive the centre of them."
 WRK_bind_districts_to_charter: "Bind the Districts to the Charter"
 WRK_bind_districts_to_charter_desc: "The charter cannot stop the crisis, but signed obligations will give loyal administrators a common procedure when central orders fall silent."
 WRK_disperse_railway_reserves: "Disperse the Railway Reserves"
 WRK_disperse_railway_reserves_desc: "Reserve rifles and repair stocks will leave the capital warehouses for guarded depots along the surviving rail corridors."
 WRK_issue_continuity_orders: "Issue Continuity Orders"
 WRK_issue_continuity_orders_desc: "Sealed orders will tell the army and civil service whom to contact, what to preserve, and how to act if the confederate chain of command disappears."
 WRK_reopen_emergency_workshops:0 "Reopen emergency workshops"
 WRK_reopen_emergency_workshops_desc:0 "Repair shops still receive tools through federal stores. We will assemble serviceable equipment for district projects before factory directors put their own guards at the gates. The next choice is what the factory should preserve: weapons for the first battle or skilled workers for a long war."
 WRK_prioritize_arsenal_output:0 "Arms for the first battle"
 WRK_prioritize_arsenal_output_desc:0 "The factory will work military shifts. A district programme will turn time and equipment into a rifle shipment ready for the split. Specialist evacuation must be set aside: the same workers cannot board trains and keep the machines running."
 WRK_preserve_machine_tools:0 "Preserve the factory workforce"
 WRK_preserve_machine_tools_desc:0 "Commanders demand rifles now, but without skilled workers and technical records there will be nobody to fulfil the next order. We will prepare specialist and workshop evacuation, giving the future headquarters a foundation for industrial recovery at the cost of an immediate arms shipment."
 WRK_collect_officer_returns:0 "Reconcile garrison rolls"
 WRK_collect_officer_returns_desc:0 "The same reservists appear on several unit rolls. We will verify their attendance and return them to a single register before issuing weapons. Headquarters can then choose between a local guard and a training reserve to be deployed after the split."
 WRK_contract_local_garrisons:0 "Contract the local garrisons"
 WRK_contract_local_garrisons_desc:0 "Local commanders need troops for depots, bridges and city streets. A district programme will assign paid recruits and weapons to them. The prepared guard will deploy at the split, leaving these men unavailable for a central training reserve."
 WRK_prepare_officer_reserve:0 "Preserve a training reserve"
 WRK_prepare_officer_reserve_desc:0 "Recruits will remain with their instructors instead of being assigned immediately. The district programme will preserve paid weapons and personnel for the future headquarters. After the split it can deploy a better trained formation, but additional training will take time."
 WRK_prepare_civil_evacuation:0 "Plan the civilian evacuation"
 WRK_prepare_civil_evacuation_desc:0 "The chancery will arrange a route for Worcker to reach the loyalists through the civilian communications hub. An order alone saves nobody: the district evacuation must still be funded, completed and defended. Vlad's military route is incompatible with this plan."
 WRK_prepare_military_evacuation:0 "Entrust evacuation to the army"
 WRK_prepare_military_evacuation_desc:0 "Civilian orders may stop reaching their recipients before the convoy leaves the capital. Vlad's men will prepare Worcker's rescue through the military evacuation programme. Success places him under military protection; an unfinished or conceded communications hub cannot be secured by an order on paper."
 WRK_emergency_central_budget:0 "The Centre's Emergency Budget"
 WRK_emergency_central_budget_desc:0 "Every district tax goes straight to the capital, and Worcker's committees decide how it is spent. The centre gains money and power; the districts gain a grievance and a reason to prepare emergencies of their own."
 WRK_district_emergency_powers:0 "Powers to the Districts"
 WRK_district_emergency_powers_desc:0 "The districts may collect taxes and keep garrisons without the capital's consent. The centre loses its levers, but the districts fear their government less, and the district staffs grow stronger."
 WRK_requisition_commissions:0 "Requisition Commissions"
 WRK_requisition_commissions_desc:0 "Committee commissions tour the district depots with the right to seize anything registered to the confederation. The reports call it an inventory."
 WRK_district_treasuries:0 "District Treasuries"
 WRK_district_treasuries_desc:0 "Every district receives a treasury of its own, and Worx's engineers receive the right to audit it. The money stays where it is, but for the first time in years it can be counted."
 WRK_last_common_budget:0 "The Last Common Budget"
 WRK_last_common_budget_desc:0 "Whichever way the reform went, this is the last budget all the districts sign together. Its articles will fund the districts' joint preparations for the coming crisis."
 WRK_party_cell_rolls:0 "Party Cell Rolls"
 WRK_party_cell_rolls_desc:0 "Worcker's committees count their cells in the factories and offices. Every name on the list is someone who will know whom to obey on the day the country breaks."
 WRK_factory_committee_councils:0 "Factory Committees"
 WRK_factory_committee_councils_desc:0 "Shop committees may dispose of their plants' stores in an emergency. The factories hold on to the centre as long as the centre holds on to them."
 WRK_district_staff_exercises:0 "District Staff Exercises"
 WRK_district_staff_exercises_desc:0 "The district staffs exercise communications and the movement of reserves. The exercises test not only the signals but also whom the officers salute first."
 WRK_petrichev_depots:0 "Petrichev's Depots"
 WRK_petrichev_depots_desc:0 "Vlad Petrichev's eastern district takes the army depots under guard. Officially it is a security measure; in practice it holds the keys to a future army."
 WRK_worx_network_register:0 "Worx's Network Register"
 WRK_worx_network_register_desc:0 "Dorian Worx's engineers compile a register of substations, signal lines and pumping stations. Whoever holds the register can switch the country back on."
 WRK_machine_tool_fund:0 "The Machine Tool Fund"
 WRK_machine_tool_fund_desc:0 "The best machine tools of the capital's plants pass into a special fund run by the technical councils. They cannot be sold, requisitioned or removed without the engineers' signature."
 WRK_stake_on_one_pillar:0 "Stake Everything on One Pillar"
 WRK_stake_on_one_pillar_desc:0 "Worcker no longer shares his trust evenly. The camp entrusted with the last order receives everything, and the others learn that nobody owes them anything on the day of the collapse."
 WRK_balance_the_pillars:0 "Balance the Pillars"
 WRK_balance_the_pillars_desc:0 "The committees, the staffs and the engineers receive equal shares: nobody grows strong enough to take the country, and nobody leaves empty-handed."
 WRK_inspect_the_unity_tower:0 "Inspect the Unity Tower"
 WRK_inspect_the_unity_tower_desc:0 "A commission inspects the Unity Tower's guard, communications and emergency exits. The report draws few conclusions but asks many questions about who will be inside if something happens."
 WRK_reinforce_the_tower_guard:0 "Reinforce the Tower Guard"
 WRK_reinforce_the_tower_guard_desc:0 "The Tower's guard passes to loyal committees, and Worcker stays in the building to show that the centre is not afraid. If the blow comes, it will meet people ready to carry the chairman out."
 WRK_disperse_the_government:0 "Disperse the Government"
 WRK_disperse_the_government_desc:0 "The ministries move to the districts, and the sessions meet in different cities. A single blow cannot destroy such a government, but gathering it again will not be easy either."
 WRK_last_common_budget_slot_tt:0 "Up to §Y3§! preparation projects can run at once instead of §Y2§!."
 WRK_reinforce_the_tower_guard_tt:0 "If no evacuation project at [40.GetName] has decided Worcker's fate, he is more likely to stay with the loyalists after the blast: about §Y70%§! instead of §Y60%§!; about §Y5%§! missing and about §Y2%§! killed."
 WRK_disperse_the_government_tt:0 "If no evacuation project at [40.GetName] has decided Worcker's fate, the blast cannot kill him, but he goes missing more often: about §Y19%§! instead of §Y10%§!."
 VAD_review_district_obligations: "Review the District's Obligations"
 VAD_review_district_obligations_desc: "The district administration will reconcile its obligations to the centre with the supplies and institutions it can actually maintain."
 VAD_open_continuity_registers: "Open the Continuity Registers"
 VAD_open_continuity_registers_desc: "Old service rolls and transport ledgers can preserve an administrative chain even if the federal ministries cease to answer."
 VAD_drill_district_guard: "Drill the District Guard"
 VAD_drill_district_guard_desc: "A compact guard trained to obey district command will be more useful than a mass levy that scatters at the first contradictory order."
 VAD_secure_administrative_archives: "Secure the Administrative Archives"
 VAD_secure_administrative_archives_desc: "Personnel files, tax rolls, and legal seals will be copied and placed beyond the reach of a single raid on the district capital."
 VAD_disperse_eastern_depots: "Disperse District Depots"
 VAD_disperse_eastern_depots_desc: "Equipment will be moved into small protected depots from which the district guard can draw without waiting for the confederate quartermaster."
 VAD_form_emergency_chancery: "Form the Emergency Chancery"
 VAD_form_emergency_chancery_desc: "A provisional chancery will bind the chosen continuity plan to one public chain of orders, preserve its records, and give the district guard a recognised emergency mandate."
 WKR_convene_front_soviets:0 "Convene the Front Councils"
 WKR_convene_front_soviets_desc: "With Nikita Worcker safe among loyalists, soldiers, railway crews, and factory delegates can turn the First Revolution's promise into a working wartime republic. If the chairman has not returned to the western forces, the delegates will gather in his name and entrust the revolution to an emergency committee."
 WKR_organize_factory_battalions: "Organise the Factory Battalions"
 WKR_organize_factory_battalions_desc: "Workplace committees will provide screened volunteers and replacement cadres, accepting short-term disruption for immediate strength."
 WKR_put_railways_under_councils: "Put the Railways under the Councils"
 WKR_put_railways_under_councils_desc: "Local councils will coordinate repair teams and military traffic, keeping the retreat routes open without surrendering them to an unaccountable staff."
 WKR_authorize_retreat_levies: "Authorise the Retreat Levies"
 WKR_authorize_retreat_levies_desc: "Rear districts may raise a limited number of emergency formations when a front gives way. They are a reserve of last resort, not a new uncontrolled army."
 WKR_form_revolutionary_supply_commission: "Form the Revolutionary Supply Commission"
 WKR_form_revolutionary_supply_commission_desc: "Railway councils, cooperative depots, and field quartermasters will publish one supply ledger and release a limited reserve to the front."
 WKR_train_shopfloor_officers: "Train Shopfloor Officers"
 WKR_train_shopfloor_officers_desc: "Experienced foremen and union organisers will receive short staff courses so emergency levies have officers who know both their soldiers and their equipment."
 WKR_open_free_republics_channel: "Open Nikita's Republican Channel"
 WKR_open_free_republics_channel_desc: "Nikita's government will turn ideological sympathy in Volnograd into a bounded offer of military cooperation while keeping the front's authority answerable to public councils."
 WKR_empower_front_executive: "Empower Bagley's Front Executive"
 WKR_empower_front_executive_desc: "Anton Bagley's fallback administration will grant the front executive temporary authority over reserves and railway priorities. Its mandate is technical, conditional, and limited to the emergency."
 WKR_reopen_collective_workshops: "Reopen the Collective Workshops"
 WKR_reopen_collective_workshops_desc: "Cooperative machine shops and abandoned assembly halls will be joined into one accountable network of wartime production."
 WKR_publish_emergency_constitution: "Publish Nikita's Emergency Constitution"
 WKR_publish_emergency_constitution_desc: "The loyalist councils will publish the limits of command, the rights of delegates, and the obligation to review every exceptional power after the war."
 WKR_authorize_normative_command:0 "Prioritise the Operations Staff"
 WKR_authorize_normative_command_desc:0 "Even a perfect plan is useless when commanders cannot read their neighbours' reports. Bagley proposes a common language of orders and responsibility for carrying them out."
 WKR_bind_workshops_to_directive:0 "Prioritise the Factory Directorates"
 WKR_bind_workshops_to_directive_desc:0 "Staff officers demand the impossible when they do not know what leaves the factory gates. Let the directors agree on production and deliveries before the generals draw their arrows."
 WKR_settle_front_authority: "Settle the Front's Authority"
 WKR_settle_front_authority_desc: "Nikita's published mandate or Bagley's directive apparatus will now define how political orders reach the same shared army and industrial base."
 WKR_coordinate_counterattack_cells: "Coordinate Counterattack Cells"
 WKR_coordinate_counterattack_cells_desc: "Factory battalions, shopfloor officers, and retreat levies will be organised into small reserves able to reinforce a threatened junction without emptying the whole front."
 WKR_stockpile_interchange_reserves: "Stockpile Interchange Reserves"
 WKR_stockpile_interchange_reserves_desc: "Rail councils and collective workshops will hold a measured reserve of tools, rolling stock, and support equipment at the western interchanges."
 WKR_republic_fights_as_one: "The Western Claimant Fights as One"
 WKR_republic_fights_as_one_desc: "Whether governed by Nikita Worcker's loyalist councils or Anton Bagley's utilitarian fallback, the western claimant now has one authority, one field system, and one industrial timetable for the contest in the centre."
 WKR_establish_workers_air_command: "Establish the Workers' Air Command"
 WKR_establish_workers_air_command_desc: "Pilots, mechanics, and ground observers will answer to one compact command able to cover the western army instead of hoarding aircraft at the capital."
 WKR_keep_frontline_sorties_flying: "Keep the Frontline Sorties Flying"
 WKR_keep_frontline_sorties_flying_desc: "Dedicated fighter and strike-aircraft lines, replacement airframes, and a protected fuel allotment will let the air command survive more than the opening battles."
 WKR_raise_mobile_fortification_crews: "Raise Mobile Fortification Crews"
 WKR_raise_mobile_fortification_crews_desc: "Rail-borne engineering crews will prepare a shallow line along the front that actually exists when they arrive, rather than pouring concrete around yesterday's headquarters."
 WKR_secure_the_southern_corridor: "Secure the Southern Corridor"
 WKR_secure_the_southern_corridor_desc: "The western junctions will receive repaired roads, guarded stores, and a common movement ledger for any army ordered towards Solarino."
 WKR_rehearse_operation_southbound: "Rehearse Operation Southbound"
 WKR_rehearse_operation_southbound_desc: "Air controllers, field engineers, and supply columns will practise one timed southern advance before the government commits the republic to another front."
 WKR_intervene_in_solyarino: "Intervene in Solarino"
 WKR_intervene_in_solyarino_desc: "The western government will secure the southern approach. We will preserve Solarino as a worker protectorate under $WKR$."
 WKR_intervene_in_solyarino_available_tt: "Central preparation or the live central showdown must be active. $VAD$ must not have reserved or begun its own Solarino intervention, no restoration settlement may be pending, and $WKR$ must control a physical land approach to at least one valid target. A simultaneous war with $VAD$ does not block this focus."
 WKR_intervene_in_solyarino_effect_tt: "Declares separate wars on every valid surviving government among §YSolarino, the Solveyne Republic, and the Slobodskaya City Administration§!. Each declaration is checked the next day and retried at most once. Once the central war begins, §YArmi§! may contest the same unaligned southern governments. Claimant wars follow the shared outbreak procedure. After victory, exactly §Yfive authored Solarino states§! are assembled under §Y$SOL$§! as $WKR$'s worker protectorate."
 WKR_open_the_remaining_fronts: "Open the Remaining Fronts"
 WKR_open_the_remaining_fronts_desc: "The western government will no longer wait while its central rivals bar the way one by one. We will prepare a simultaneous offensive against the remaining independent governments."
 WKR_open_the_remaining_fronts_available_tt: "At least one independent central minor or rival central major must still exist and not already be at war with $WKR$. The central-district campaign must have gone protracted, or the live central showdown must be active. $WKR$ must already have unlocked the central war, rehearsed the southern operation, intervened in Solarino, or have no remaining Solarino target."
 WKR_open_the_remaining_fronts_effect_tt: "Declares separate annexation wars on every remaining independent central minor among §Y$EYR$, $EGC$, $RIV$, $REV$, $YOR$, $NDN$, $SWB$, $VHV$, and $OSV$§!, and on every remaining rival central major among §Y$VAD$ and $TVA$§!. Distance does not block the declaration. Available after the central war begins. Coalition members are not separate targets; allies keep their membership."
 VAD_open_imperial_registers: "An Empire Without a Crown"
 VAD_open_imperial_registers_desc: "Petrichev sees the surviving district as the foundation of a state that need not seek authority from every new council. Crown commissions will hear the claims of officials and officers, while the chancery registers bind their service to a common oath."
 VAD_form_field_commandantures: "Establish the Joint Government"
 VAD_form_field_commandantures_desc: "Worcker's rescue kept open a conversation that civil war could have ended forever. Petrichev now offers worker delegates a seat beside the staff and chancery. Shared authority begins by admitting that neither side can speak for everyone."
 VAD_imperial_mandate_available_tt: "The military district remains independent and the joint government has not been established."
 VAD_joint_mandate_available_tt: "The military district remains independent, Nikita Worcker was rescued by Petrichev, and the imperial course has not been adopted."
 VAD_imperial_mandate_chosen_tt:0 "Fixes Petrichev's imperial course through reunification and opens the imperial settlement, followed by the World Empire after the Tower is restored. The joint government can no longer be established; a rescued Nikita Worcker remains in the country."
 VAD_joint_mandate_chosen_tt:0 "Places the joint government of Worcker and Petrichev in charge. This cabinet survives reunification; a separate postwar choice determines its future."
 VAD_invite_sol_delegation: "Open the Solarino Policy"
 VAD_invite_sol_delegation_desc: "We will offer the victorious republic Vlad's protectorate, including Velin. If its regional rivals seize power, we will prepare an intervention to establish a subordinate Solarino administration."
 VAD_establish_mobile_headquarters: "Establish Mobile Headquarters"
 VAD_establish_mobile_headquarters_desc: "A headquarters that can abandon a threatened office without losing its registers will keep the district army coherent through a retreat."
 VAD_dispatch_solland_liaison_mission: "Dispatch the Solarino Liaison Mission"
 VAD_dispatch_solland_liaison_mission_desc: "The mission will contact the victor of the Solarino war and prepare either a formal treaty or the plans for a future intervention."
 VAD_standardize_district_logistics: "Standardise District Logistics"
 VAD_standardize_district_logistics_desc: "Common requisition forms, depot marks, and convoy schedules will keep the commandantures supplied when the headquarters moves."
 VAD_reconstitute_district_guard: "Reconstitute the District Guard"
 VAD_reconstitute_district_guard_desc: "Surviving guard cadres will be rebuilt into territorial formations tied to the mobile headquarters instead of scattered among local patrons."
 VAD_inventory_eastern_works: "Inventory the Eastern Works"
 VAD_inventory_eastern_works_desc: "The chancery will count machine tools, protected storehouses, and transport crews before issuing promises the eastern districts cannot fulfil."
 VAD_reopen_armament_depots: "Reopen the Armament Depots"
 VAD_reopen_armament_depots_desc: "A verified chain of workshops and guarded depots will give the restoration army a permanent production base."
 VAD_restore_crown_commissions: "Restore the Crown Commissions"
 VAD_restore_crown_commissions_desc: "Vlad will revive the old commissions as recorded offices of republican restoration, not as private military households."
 VAD_bind_officers_to_chancery: "Bind Officers to the Chancery"
 VAD_bind_officers_to_chancery_desc: "Every ordinary restoration command will carry a named civil warrant and return its reports to the military chancery."
 VAD_guarantee_worker_committees: "Guarantee the Worcker Committees"
 VAD_guarantee_worker_committees_desc: "The rescued Worcker and Vlad will protect elected committees from military dissolution while the joint government remains under wartime pressure."
 VAD_ratify_joint_command: "Ratify the Joint Command"
 VAD_ratify_joint_command_desc: "Worcker delegates and restoration officers will ratify one bounded command compact without erasing either source of legitimacy."
 VAD_settle_restoration_authority: "Settle Restoration Authority"
 VAD_settle_restoration_authority_desc: "The military chancery or the joint council with civilian delegates will now define the political authority behind the same eastern army, logistics, and diplomatic programme."
 VAD_balance_council_and_command: "Complete the Restoration War State"
 VAD_balance_council_and_command_desc: "The selected political settlement, mobile staff, eastern depots, and Solarino liaison now form a coherent claimant capable of contesting the centre."
 VAD_assemble_joint_general_staff: "Assemble the Joint General Staff"
 VAD_assemble_joint_general_staff_desc: "Civil administrators and field commandants will submit to one operational timetable for the coming central contest."
 VAD_restore_prefectural_courts: "Restore the Prefectural Courts"
 VAD_restore_prefectural_courts_desc: "Reopened courts will turn emergency requisitions into recorded judgements, giving Vlad's mobilisation a legal chain that can survive the front moving again."
 VAD_issue_crown_mobilization_warrants: "Issue Crown Mobilisation Warrants"
 VAD_issue_crown_mobilization_warrants_desc: "Behind the crown seal are the names of people expected at assembly points. The restoration chancery must reconcile army demands with the obligations written into district charters."
 VAD_turn_the_chancery_into_a_war_cabinet: "Turn the Chancery into a War Cabinet"
 VAD_turn_the_chancery_into_a_war_cabinet_desc: "Vlad will replace scattered temporary offices with a permanent cabinet able to join law, mobilisation, and field command-at the cost of tightening the emergency regime."
 VAD_elect_district_commissars: "Elect District Commissars"
 VAD_elect_district_commissars_desc: "The joint government will let district assemblies choose commissioners who can carry worker guarantees into the army's administrative chain."
 VAD_merge_guard_and_worker_rolls: "Merge Guard and Worcker Rolls"
 VAD_merge_guard_and_worker_rolls_desc: "Guard records and factory rosters will become one audited reserve pool, preventing officers and committees from mobilising the same people twice."
 VAD_sign_the_dual_authority_protocol: "Sign the Dual Authority Protocol"
 VAD_sign_the_dual_authority_protocol_desc: "A permanent protocol will divide civil oversight and operational command between the rescued Worcker's delegates and Vlad's staff without paralysing either."
 VAD_map_the_solar_corridors: "Map the Solar Corridors"
 VAD_map_the_solar_corridors_desc: "Liaison reports will be converted into route tables, bridge surveys, and intelligence dossiers for both rival governments still contesting Solarino."
 VAD_preposition_restoration_columns: "Pre-position Restoration Columns"
 VAD_preposition_restoration_columns_desc: "Mobile supply and administration columns will assemble behind the eastern roads, ready to support an ally or follow a restoration force south."
 VAD_define_the_solar_settlement: "Define the Solar Settlement"
 ADISCORD_vorkerland_vad_solar_window_closed_tt:0 "The central war has begun. A separate preparatory intervention in Solarino is no longer available."
 VAD_define_the_solar_settlement_desc: "The restoration coalition must now bind its Solarino policy to a public settlement: compact with a surviving republic, or a bounded intervention against its usurpers."
 VAD_open_the_remaining_fronts: "Open the Remaining Fronts"
 VAD_open_the_remaining_fronts_desc: "If the restoration government is stalled on a surviving central district or a rival claimant, it will open every remaining central front at once rather than wait for a neighbouring corridor."
 VAD_open_the_remaining_fronts_available_tt: "At least one independent central minor or rival central major must still exist and not already be at war with $VAD$. The central-district campaign must have gone protracted, or the live central showdown must be active. $VAD$ must already have unlocked the central war, signed dual authority, mapped the solar corridors, or declared an imperial or dual-chamber settlement."
 VAD_open_the_remaining_fronts_effect_tt: "Declares separate annexation wars on every remaining independent central minor among §Y$EYR$, $EGC$, $RIV$, $REV$, $YOR$, $NDN$, $SWB$, $VHV$, and $OSV$§!, and on every remaining rival central major among §Y$WKR$ and $TVA$§!. Distance does not block the declaration. Available after the central war begins. Coalition members are not separate targets; allies keep their membership."
 VAD_reconcile_emergency_district_rolls: "Reconcile the Emergency District Rolls"
 VAD_reconcile_emergency_district_rolls_desc: "Military, labour, and ration rolls will be reconciled district by district so the restoration government knows whom it can still call upon."
 VAD_restore_eastern_supply_corridors: "Restore the Eastern Supply Corridors"
 VAD_restore_eastern_supply_corridors_desc: "Repair columns will reopen the eastern roads and depots that connect Vlad's administration to the remaining central fronts."
 VAD_convert_emergency_workshops: "Turn Repair Workshops to War Production"
 VAD_convert_emergency_workshops_desc: "The eastern repair sheds will be reorganised into a modest but dependable source of arms and field equipment."
 VAD_publish_interim_restoration_register: "Publish the Interim Restoration Register"
 VAD_publish_interim_restoration_register_desc: "A public register of districts, commands, and emergency obligations will turn the restoration coalition into a government that can outlast the war."
 TVA_reroute_city_grid: "Reroute the City Grid"
 TVA_reroute_city_grid_desc: "Worx's engineers will prioritise workshops, pumps, and railway substations according to a single measurable emergency schedule."
 TVA_deploy_field_laboratories: "Deploy the Field Laboratories"
 TVA_deploy_field_laboratories_desc: "Small technical teams attached to the army will test repairs and tactics at the point of failure instead of waiting for reports to reach the capital."
 TVA_raise_technical_battalions:0 "Test Technical Battalions"
 TVA_raise_technical_battalions_desc:0 "Engineers and trained workers will form experimental teams for sectors where broken infrastructure is as dangerous as the enemy. Their field logs must show which skills can be passed to the next shift and which exist only on a staff timetable."
 TVA_seal_the_approaches: "Survey the Defensive Approaches"
 TVA_seal_the_approaches_desc: "Engineers will survey fallback lines, bridges, and railway junctions so the army can defend the capital without wasting men on an improvised fortress belt."
 TVA_issue_emergency_output_norms: "Issue Emergency Output Norms"
 TVA_issue_emergency_output_norms_desc: "The directorate will publish attainable emergency quotas and release a measured equipment reserve instead of exhausting every workshop at once."
 TVA_build_mobile_repair_trains: "Build Mobile Repair Trains"
 TVA_build_mobile_repair_trains_desc: "Rail-mounted teams will move tools and engineers between damaged junctions, preserving the army's technical reserve as the front shifts."
 TVA_publish_operational_metrics: "Standardise Operational Reporting"
 TVA_publish_operational_metrics_desc: "Headquarters, depots, and field workshops will use one concise report for supply, repairs, losses, and reserve strength. Decisions can then be corrected from evidence instead of competing estimates."
 TVA_optimize_for_throughput: "Optimise for Throughput"
 TVA_optimize_for_throughput_desc: "The directorate will accept longer shifts and accelerated wear to place rifles in depots immediately. The figures will improve, but the social cost will be recorded rather than denied."
 TVA_protect_irreplaceable_specialists: "Protect Irreplaceable Specialists"
 TVA_protect_irreplaceable_specialists_desc: "Engineers and instrument makers cannot be replaced by another levy. Protected teams will preserve technical knowledge even when immediate output suffers."
 TVA_standardize_emergency_administration: "Standardise Emergency Administration"
 TVA_standardize_emergency_administration_desc: "Whichever priority was chosen, every bureau will now use the same loss tables, authority limits, and review schedule. The field directorate becomes a real government."
 TVA_delegate_to_algorithmic_board: "Delegate to the Algorithmic Board"
 TVA_delegate_to_algorithmic_board_desc: "A mixed board of engineers and statisticians will calculate priorities under published constraints, leaving Worx responsible for the assumptions rather than hiding behind the result."
 TVA_select_trial_protocol: "Select a Field-Trial Protocol"
 TVA_select_trial_protocol_desc: "Doctor Worx will require one controlled battlefield experiment before technical doctrine is integrated across the whole army."
 TVA_test_remote_fire_control: "Test Remote Fire Control"
 TVA_test_remote_fire_control_desc: "Field laboratories will test wired observation, corrected firing tables, and remote coordination on one bounded sector."
 TVA_test_adaptive_logistics: "Test Adaptive Logistics"
 TVA_test_adaptive_logistics_desc: "Repair teams will test flexible depot schedules and rerouting rules against real battlefield interruptions."
 TVA_integrate_field_results: "Integrate the Field Results"
 TVA_integrate_field_results_desc: "The selected trial will be reviewed, its failures recorded, and only the repeatable procedures distributed to the wider command."
 TVA_harden_switching_stations: "Harden the Switching Stations"
 TVA_harden_switching_stations_desc: "Mobile repair trains will pre-position parts and bypass plans at the grid and railway switches most likely to fail under attack."
 TVA_close_operational_loop: "Link Staff and Production"
 TVA_close_operational_loop_desc: "The general staff, railway administration, and production boards will work to one timetable. Worx's government enters the central war as a disciplined technical administration, not an improvised laboratory command."
 TVA_unattended_shifts: "Authorise Unattended Shifts"
 TVA_unattended_shifts_desc: "Instrumented production lines can run through the night with smaller crews, provided the board accepts stoppages, damaged tools, and the strain imposed on the civic grid as measured costs."
 TVA_delegate_fire_plans_to_board: "Delegate Fire Plans to the Board"
 TVA_delegate_fire_plans_to_board_desc: "The algorithmic board will compare ammunition stocks, observation reports, and predicted enemy movement before issuing a single fire schedule to every participating battery."
 TVA_bunker_specialist_cadres: "Form Bunker Specialist Cadres"
 TVA_bunker_specialist_cadres_desc: "Protected engineers will be grouped into compact cadres trained to survey firing arcs, reinforce existing shelters, and teach infantry how to hold an urban strongpoint."
 TVA_standardize_assault_teams: "Standardise Assault Teams"
 TVA_standardize_assault_teams_desc: "The technical battalions will use one compact table of engineers, automatic-rifle groups, runners, and replacements, letting battered teams reform without another round of improvisation."
 TVA_network_observation_posts: "Network the Observation Posts"
 TVA_network_observation_posts_desc: "Field telephones, measured reference points, and redundant reporting channels will turn scattered observers into a single fire-control network."
 TVA_mandate_modular_repair: "Mandate Modular Repair"
 TVA_mandate_modular_repair_desc: "Repair depots will stop rebuilding every damaged machine as a unique case. Standard assemblies can be exchanged in the field and restored later under controlled conditions."
 TVA_print_interchangeable_repair_modules: "Print Interchangeable Repair Modules"
 TVA_print_interchangeable_repair_modules_desc: "The best results from the chosen metric and field trial will be converted into tolerances, parts lists, and workshop sheets that any directorate depot can reproduce."
 TVA_preposition_switching_crews: "Pre-position Switching Crews"
 TVA_preposition_switching_crews_desc: "Mobile crews, spare relays, and protected route tables will wait behind the front, ready to redirect power and rail traffic as soon as the operational axis changes."
 TVA_cross_validate_trial_logs: "Cross-validate the Trial Logs"
 TVA_cross_validate_trial_logs_desc: "Laboratory records, field reports, and production ledgers will be compared line by line. The discrepancies matter more than the flattering averages."
 TVA_authorize_iteration_two: "Authorise Iteration Two"
 TVA_authorize_iteration_two_desc: "With every failure recorded and every module reproducible, Worx can issue a second operational protocol: a temporary but coherent system for the next campaign."
 TVA_open_the_remaining_fronts: "Open the Remaining Fronts"
 TVA_open_the_remaining_fronts_desc: "If the directorate is stalled on a surviving central district or a rival claimant, it will treat the remaining independent governments as a single operational set and open them together."
 TVA_open_the_remaining_fronts_available_tt: "At least one independent central minor or rival central major must still exist and not already be at war with $TVA$. The central-district campaign must have gone protracted, or the live central showdown must be active. $TVA$ must already have unlocked the central war or authorised iteration two."
 TVA_open_the_remaining_fronts_effect_tt: "Declares separate annexation wars on every remaining independent central minor among §Y$EYR$, $EGC$, $RIV$, $REV$, $YOR$, $NDN$, $SWB$, $VHV$, and $OSV$§!, and on every remaining rival central major among §Y$WKR$ and $VAD$§!. Distance does not block the declaration. Available after the central war begins. Coalition members are not separate targets; allies keep their membership."
 WRK_worker_convene_reunification_congress: "Convene the Reunification Congress"
 WRK_worker_convene_reunification_congress_desc: "The victorious republican government will ask surviving councils and republics to define reunification as renewed consent rather than a conqueror's decree."
 WRK_worker_restore_unity_tower: "Restore the Unity Tower"
 WRK_worker_restore_unity_tower_desc: "The republican government will return the Tower to its former silhouette and make the ruins an open centre of the republic."
 WRK_worker_confederation_tree_tt:0 "On the next day the §YConfederation of Republics§! tree opens. Completed settlement focuses keep their results."
 WRK_joint_restore_unity_tower: "Restore the Tower by Charter"
 WRK_joint_restore_unity_tower_desc: "The joint chancery will restore the Tower as a shared symbol of law, the army, and the districts."
 WRK_joint_west_frontier_commands:0 "[GetVADStaffWrkJointWestFrontierCommands]"
 WRK_joint_west_frontier_commands_restoration: "Frontier Commands"
 WRK_joint_west_frontier_commands_staff:0 "Frontier Commands"
 WRK_joint_west_frontier_commands_desc:0 "[GetVADStaffWrkJointWestFrontierCommandsDesc]"
 WRK_joint_west_frontier_commands_desc_restoration: "The empire creates commands for the marches it considers its own."
 WRK_joint_west_frontier_commands_desc_staff:0 "The directorate will divide responsibility for the western border among district headquarters. A common frontier requires coordinated orders."
 WRK_joint_west_imperial_columns:0 "[GetVADStaffWrkJointWestImperialColumns]"
 WRK_joint_west_imperial_columns_restoration: "Imperial Columns"
 WRK_joint_west_imperial_columns_staff:0 "Western Operational Columns"
 WRK_joint_west_imperial_columns_desc:0 "[GetVADStaffWrkJointWestImperialColumnsDesc]"
 WRK_joint_west_imperial_columns_desc_restoration: "The columns assemble at the northern corridor."
 WRK_joint_west_imperial_columns_desc_staff:0 "Commanders assemble their columns at the northern corridor. Every formation must know its task and its neighbours along the march."
 WRK_joint_west_return_of_the_marches:0 "[GetVADStaffWrkJointWestReturnOfTheMarches]"
 WRK_joint_west_return_of_the_marches_restoration: "Return of the Marches"
 WRK_joint_west_return_of_the_marches_staff:0 "A Common Order in the Marches"
 WRK_joint_west_return_of_the_marches_desc:0 "[GetVADStaffWrkJointWestReturnOfTheMarchesDesc]"
 WRK_joint_west_return_of_the_marches_desc_restoration: "Petrichev demands that Itora's marches return to the empire."
 WRK_joint_west_return_of_the_marches_desc_staff:0 "The directorate demands that the western districts accept a common system of administration. The chairman must agree the terms with those responsible for enforcing them."
 WRK_joint_west_imperial_settlement:0 "[GetVADStaffWrkJointWestImperialSettlement]"
 WRK_joint_west_imperial_settlement_restoration: "Imperial Settlement"
 WRK_joint_west_imperial_settlement_staff:0 "Military Settlement of the West"
 WRK_joint_west_imperial_settlement_desc:0 "[GetVADStaffWrkJointWestImperialSettlementDesc]"
 WRK_joint_west_imperial_settlement_desc_restoration: "The empire orders the conquered West under a single statute."
 WRK_joint_west_imperial_settlement_desc_staff:0 "Headquarters are preparing a common statute for the western territories. The military republic must establish where commandants' authority ends and local administrations' responsibility begins."
 WRK_utilitarian_restore_unity_tower: "Reconstruct the Tower from Plans"
 WRK_utilitarian_restore_unity_tower_desc: "The directorate will rebuild the Tower from surviving calculations and return it to service as a communications and administrative hub."
 WRK_technical_directorate_tree_tt:0 "On the next day the §YTechnical Directorate§! tree opens. Completed settlement focuses keep their results."
 WRK_west_crisis_add_tt: "Western reckoning: §Y+10§!."
 WRK_west_final_ready_tt: "The western question is open, Itora is not conducting an intervention and the war for the West has not started"
 WRK_joint_west_war_tt: "The §Ywar for the West§! against Itora begins. Victory establishes dependent military administrations in Itora and its allies."
 WRK_worker_open_erased_nations_archives: "Open the Erased Nations Archives"
 WRK_worker_open_erased_nations_archives_desc: "Suppressed registers and testimony will be published so displaced communities can prove who they were and what was taken from them."
 WRK_worker_recognize_free_republics: "Recognise the Free Republics"
 WRK_worker_recognize_free_republics_desc: "The Congress will no longer treat every surviving republic as a rebel province. Those that preserved their independence and did not oppose the new order may receive a formal treaty instead of a demand for unconditional submission."
 WRK_worker_fund_cooperative_reconstruction: "Fund Cooperative Reconstruction"
 WRK_worker_fund_cooperative_reconstruction_desc: "Railway crews and local cooperatives will receive a modest public works fund to reconnect communities before constitutional borders are settled."
 WRK_worker_restore_displaced_councils: "Restore the Displaced Councils"
 WRK_worker_restore_displaced_councils_desc: "Representative councils will return before borders and offices are finally settled, easing the burden left by forced erasure."
 WRK_worker_authorize_homecoming_commissions: "Authorise the Homecoming Commissions"
 WRK_worker_authorize_homecoming_commissions_desc: "Mixed local commissions will document return claims and open a controlled path for restoring the national territories of the reunited state."
 WRK_worker_prioritize_housing_guarantees: "Guarantee Homes Before Titles"
 WRK_worker_prioritize_housing_guarantees_desc: "Returning families need roofs, utilities, and legal protection before the congress settles every disputed title. A national guarantee will carry the immediate burden."
 WRK_worker_devolve_reconstruction_grants: "Devolve the Reconstruction Grants"
 WRK_worker_devolve_reconstruction_grants_desc: "Local councils know which bridges, clinics, and workshops can reopen first. The congress will fund them directly and require public accounts in return."
 WRK_worker_ratify_republican_compact: "Ratify the Republican Compact"
 WRK_worker_ratify_republican_compact_desc: "The relief programme and local reconstruction settlement will become a common compact: republics retain a voice, while the reunited state guarantees equal rights and shared recovery."
 WRK_worker_write_constitutional_guarantees: "Write the Constitutional Guarantees"
 WRK_worker_write_constitutional_guarantees_desc: "The constitution will guarantee republican representation, workers' organisations, and the protection of returning communities. Emergency resettlement rule will give way to permanent law."
 WRK_joint_convene_restoration_council: "Convene the Restoration Council"
 WRK_joint_convene_restoration_council_desc: "The victorious military coalition will convene a council combining legal continuity with the authority of the army that retook the centre. If Nikita Worcker survived through Vlad's intervention, their emergency compromise will become the basis of the new government."
 WRK_joint_publish_amnesty_registers: "Publish the Amnesty Registers"
 WRK_joint_publish_amnesty_registers_desc: "Named combatants who surrender their arms can return to civil life, while perpetrators of organised atrocities remain outside the amnesty."
 WRK_joint_establish_military_districts: "Establish the Military Districts"
 WRK_joint_establish_military_districts_desc: "Reunified territory will be organised into accountable military districts capable of enforcing orders without recreating a patchwork of private commands."
 WRK_joint_reopen_district_rail_commands: "Reopen the District Rail Commands"
 WRK_joint_reopen_district_rail_commands_desc: "Civil engineers and district staffs will jointly restore the rail commands that connect garrisons, depots, and returning administrations."
 WRK_joint_issue_integration_warrants: "Issue the Integration Warrants"
 WRK_joint_issue_integration_warrants_desc: "The restoration council will issue named warrants for each region instead of granting territorial rights through a blanket decree."
 WRK_joint_restore_central_chancery: "Restore the Central Chancery"
 WRK_joint_restore_central_chancery_desc: "A rebuilt chancery will reconcile army orders, district reports, and civilian law into one durable state record."
 WRK_joint_civilianize_district_police: "Civilianise the District Police"
 WRK_joint_civilianize_district_police_desc: "Routine policing will return to trained civilian offices, leaving the army responsible for borders and exceptional threats rather than daily government."
 WRK_joint_retain_emergency_inspectorate: "Retain the Emergency Inspectorate"
 WRK_joint_retain_emergency_inspectorate_desc: "A small central inspectorate will keep auditing arsenals, garrisons, and district commands until the restored state can trust every chain of command."
 WRK_joint_codify_single_chain_of_command: "Codify One Chain of Command"
 WRK_joint_codify_single_chain_of_command_desc: "Whether district security passes quickly to civilians or remains under inspection, every official will answer to one published hierarchy and one body of law."
 WRK_joint_impose_reunification_settlement: "Enact the Reunification Settlement"
 WRK_joint_impose_reunification_settlement_desc: "Amnesty and common law will replace military administration. The republics will receive an orderly path back, but no competing armies or sovereignties will remain inside the restored state."
 WRK_utilitarian_form_reconstruction_directorate: "Form the Reconstruction Directorate"
 WRK_utilitarian_form_reconstruction_directorate_desc: "Worx will give engineers and civil administrators a temporary mandate to restore power, transport, housing, and industry. The directorate must publish its programme and account for the resources it uses."
 WRK_utilitarian_standardize_power_grid: "Standardise the Power Grid"
 WRK_utilitarian_standardize_power_grid_desc: "Common voltages, repair protocols, and load priorities will reconnect the restored capital to a national system."
 WRK_utilitarian_rebuild_machine_tool_pool: "Rebuild the Machine-Tool Reserve"
 WRK_utilitarian_rebuild_machine_tool_pool_desc: "A surveyed reserve of machine tools and standard replacement parts will restart one industrial centre and support the next generation of industrial research."
 WRK_utilitarian_expand_national_laboratories: "Establish the Public Engineering Service"
 WRK_utilitarian_expand_national_laboratories_desc: "Former field laboratories will become a permanent civil service for testing power, communications, and industrial equipment before national procurement."
 WRK_utilitarian_publish_integration_metrics: "Audit the Regional Administrations"
 WRK_utilitarian_publish_integration_metrics_desc: "The state will publish whether each regional administration actually controls its territory and provides transport, power, records, and public order. Meeting those conditions will open a lawful path to restoring national status."
 WRK_utilitarian_rationalize_districts: "Redraw the Service Districts"
 WRK_utilitarian_rationalize_districts_desc: "Administrative borders and responsibilities will follow transport, population, and the real reach of public services instead of the fronts inherited from the civil war."
 WRK_utilitarian_prioritize_public_utilities: "Prioritise Public Utilities"
 WRK_utilitarian_prioritize_public_utilities_desc: "Power, water, and transport capacity will go first to homes and essential services, even when factories must wait for the next allocation cycle."
 WRK_utilitarian_prioritize_industrial_recovery: "Prioritise Industrial Recovery"
 WRK_utilitarian_prioritize_industrial_recovery_desc: "Reliable mass production will shorten every later reconstruction programme. The directorate will accept a temporary civilian burden to restore industrial throughput first."
 WRK_utilitarian_publish_reconstruction_ledger: "Publish the Reconstruction Ledger"
 WRK_utilitarian_publish_reconstruction_ledger_desc: "A single public ledger will show allocations, delays, repairs, and measurable results, turning the emergency mandate into an accountable national programme."
 WRK_utilitarian_build_measurable_republic: "Establish the Technocratic Republic"
 WRK_utilitarian_build_measurable_republic_desc: "The emergency directorate will give way to permanent institutions: a professional civil service, published budgets, technical review of policy, and a government answerable for concrete public results."
 ADISCORD_vorkerland_claimant.1.t: "Who Speaks for the Front?"
 ADISCORD_vorkerland_claimant.1.d: "The first congress after the collapse is crowded with railway delegates, exhausted officers, and factory organisers carrying incompatible lists of urgent needs. The republic must decide whose records become the common truth."
 ADISCORD_vorkerland_claimant.1.a:0 "The republic rests on the mandate of the First Revolution."
 ADISCORD_vorkerland_claimant.1.b:0 "Entrust the government to Bagley's executive."
 ADISCORD_vorkerland_claimant.2.t: "Authority Beyond the Barricades"
 ADISCORD_vorkerland_claimant.2.d: "The soviets argue whether the emergency republic will survive through voluntary partners or through a stronger executive at home. Even after the constitutional choice, its practical limits remain contested."
 ADISCORD_vorkerland_claimant.2.a: "Legitimacy must remain public."
 ADISCORD_vorkerland_claimant.2.b: "Keep the bargaining inside the command room."
 ADISCORD_vorkerland_claimant.3.t: "The Workshops Demand a Priority"
 ADISCORD_vorkerland_claimant.3.d: "The reopened workshops cannot repair locomotives, machine rifle parts, and replace civilian pumps at the same time. Their councils demand a written priority before accepting the next shift."
 ADISCORD_vorkerland_claimant.3.a: "The front receives the first production run."
 ADISCORD_vorkerland_claimant.3.b: "Keep the repair network intact."
 ADISCORD_vorkerland_claimant.4.t: "The Western Mandate Takes Form"
 ADISCORD_vorkerland_claimant.4.nikita.d: "Nikita Worcker's loyalist councils have survived long enough to write the limits of emergency power. Delegates now dispute whether public oversight or operational review should dominate the final mandate."
 ADISCORD_vorkerland_claimant.4.anton.d: "Anton Bagley's fallback executive has joined railways, workshops, and field command under one directive. Its officials now dispute whether the apparatus should privilege central coordination or material reserves."
 ADISCORD_vorkerland_claimant.4.nikita.a: "Keep the mandate public."
 ADISCORD_vorkerland_claimant.4.nikita.b: "Give delegates a formal war review."
 ADISCORD_vorkerland_claimant.4.anton.a: "Centralise the directive council."
 ADISCORD_vorkerland_claimant.4.anton.b: "Protect the material reserve."
 ADISCORD_vorkerland_claimant.10.t: "Ink on the Restoration Charter"
 ADISCORD_vorkerland_claimant.10.d: "Jurists want every emergency power entered in the chancery register. Field commanders answer that a seal is worthless if the road carrying it is already lost."
 ADISCORD_vorkerland_claimant.10.a: "No authority without a recorded warrant."
 ADISCORD_vorkerland_claimant.10.b: "Give the mobile staff room to act."
 ADISCORD_vorkerland_claimant.11.t: "Reports from Solarino"
 ADISCORD_vorkerland_claimant.11.d: "The liaison mission returns with incomplete maps, rival delegations, and several incompatible accounts of who can still speak for Solarino. The chancery must decide how much of the report to publish."
 ADISCORD_vorkerland_claimant.11.a: "Publish the diplomatic assessment."
 ADISCORD_vorkerland_claimant.11.b: "Send the military annex to the general staff."
 ADISCORD_vorkerland_claimant.12.t: "The Keys to the Eastern Depots"
 ADISCORD_vorkerland_claimant.12.d: "Depot keepers will reopen their gates only after receiving named warrants. The army wants the reserve issued before another retreat cuts the road."
 ADISCORD_vorkerland_claimant.12.a: "Release the inspected reserve."
 ADISCORD_vorkerland_claimant.12.b: "Preserve the distributed depot chain."
 ADISCORD_vorkerland_claimant.13.t: "Authority Behind the Eastern Army"
 ADISCORD_vorkerland_claimant.13.joint.d: "The military chancery and the rescued Worcker's delegates have agreed to govern together for the emergency. They must now decide whether civil guarantees or staff unity receives the stronger safeguard."
 ADISCORD_vorkerland_claimant.13.vlad.d: "The military administration has rebuilt a recorded chain from crown commissions to field headquarters. The chancery must decide whether warrants or immediate command receives priority."
 ADISCORD_vorkerland_claimant.13.joint.a: "Entrench the civil guarantees."
 ADISCORD_vorkerland_claimant.13.joint.b: "Protect the joint staff's authority."
 ADISCORD_vorkerland_claimant.13.vlad.a: "Every order requires a crown warrant."
 ADISCORD_vorkerland_claimant.13.vlad.b: "Let the chancery command the emergency."
 ADISCORD_vorkerland_claimant.14.t: "The Solar Settlement"
 ADISCORD_vorkerland_claimant.14.joint.d: "The joint council has before it the liaison maps, reserve columns, and the final report on Solarino's regional war. Worcker delegates demand a compact that can be defended publicly; the restoration staff insists that no hostile successor can be allowed to hold the southern roads."
 ADISCORD_vorkerland_claimant.14.vlad.d: "The cabinet has reduced the Solarino question to a written mandate. A surviving republic may recognise Armi and enter the restoration coalition with Velin; a victorious usurper will face the prepared columns, and the destroyed republic will be replaced by a subordinate Solarino administration."
 ADISCORD_vorkerland_claimant.14.joint.a: "Issue the Solar Compact mandate."
 ADISCORD_vorkerland_claimant.14.vlad.a: "Seal the restoration mandate."
 ADISCORD_vorkerland_claimant.20.t: "The First Honest Tables"
 ADISCORD_vorkerland_claimant.20.d: "The directorate's first consolidated report is worse than the estimates: missing tools, duplicated battalions, and substations counted twice. Worx refuses to improve the numbers by decree."
 ADISCORD_vorkerland_claimant.20.a: "Publish the correction and rebuild trust."
 ADISCORD_vorkerland_claimant.20.b: "Issue one operational table immediately."
 ADISCORD_vorkerland_claimant.21.t: "A Government of Measurable Limits"
 ADISCORD_vorkerland_claimant.21.d: "Production boards and protected specialist teams now report to the same administration. Their disagreement has become measurable, but it has not disappeared."
 ADISCORD_vorkerland_claimant.21.a: "Let the losses remain visible."
 ADISCORD_vorkerland_claimant.21.b: "Circulate the detailed tables only to commanders."
 ADISCORD_vorkerland_claimant.22.t: "Power for the Workshops"
 ADISCORD_vorkerland_claimant.22.d: "A repaired feeder line can serve the armament works or stabilise several residential districts. Both choices can be justified; only one can receive the next shipment of transformers."
 ADISCORD_vorkerland_claimant.22.a: "Feed the armament line first."
 ADISCORD_vorkerland_claimant.22.b: "Keep the civic grid stable."
 ADISCORD_vorkerland_claimant.23.t: "Worx Selects the Field Trial"
 ADISCORD_vorkerland_claimant.23.d: "The laboratories can support only one properly controlled experiment before the central campaign. Doctor Dorian Worx insists that the choice be explicit and its failures remain in the record."
 ADISCORD_vorkerland_claimant.23.a: "Trial technical reserve battalions."
 ADISCORD_vorkerland_claimant.23.b: "Trial remote fire control."
 ADISCORD_vorkerland_claimant.23.c: "Trial adaptive logistics."
 ADISCORD_vorkerland_claimant.24.t: "The Error Between Three Ledgers"
 ADISCORD_vorkerland_claimant.24.d: "The laboratory, field headquarters, and production board all describe the same trial differently. Worx refuses to average the discrepancy away; the second iteration must begin from one admitted source of error."
 ADISCORD_vorkerland_claimant.24.a: "Correct the audit method."
 ADISCORD_vorkerland_claimant.24.b: "Model field variance explicitly."
 ADISCORD_vorkerland_claimant.24.c: "Recalibrate the production tolerances."
 ADISCORD_vorkerland_claimant.30.t: "The Western Claimant Is Ready for the Centre"
 ADISCORD_vorkerland_claimant.30.d: "Political authority, field officers, railway councils, and workshops now answer one emergency system. Under Nikita's public mandate or Bagley's directive apparatus, the western claimant is no longer an improvised defence committee."
 ADISCORD_vorkerland_claimant.30.a: "The western mandate now carries an army."
 ADISCORD_vorkerland_claimant.31.t: "The Restoration State Takes Shape"
 ADISCORD_vorkerland_claimant.31.d: "The chancery can trace an order from its chosen political settlement to mobile headquarters and eastern depot. The military administration or the joint council with civilian delegates can now contest the centre."
 ADISCORD_vorkerland_claimant.31.a: "Law and command will advance together."
 ADISCORD_vorkerland_claimant.32.t: "The Operational Loop Closes"
 ADISCORD_vorkerland_claimant.32.d: "For the first time, the same figures guide the staff, grid dispatchers, laboratories, and repair trains. Worx's directorate is ready to be judged by the result."
 ADISCORD_vorkerland_claimant.32.a: "Measure us against the coming campaign."
 ADISCORD_vorkerland_claimant.100.t: "The Western Claimant Prepares to Contest Central Vorkerland"
 ADISCORD_vorkerland_claimant.100.d: "The western war administration has announced a unified emergency command backed by factory battalions, railway councils, and reopened workshops. Observers disagree whether Nikita Worcker's public mandate or Anton Bagley's directive apparatus can survive the campaign."
 ADISCORD_vorkerland_claimant.100.a: "Another claimant is ready."
 ADISCORD_vorkerland_claimant.101.t: "The Eastern Restoration Coalition Completes Its War Administration"
 ADISCORD_vorkerland_claimant.101.d: "The military chancery, the possible joint council, mobile headquarters, and eastern depots now operate under one selected charter. Supporters call it lawful restoration; rivals see a disciplined claimant preparing to impose its settlement."
 ADISCORD_vorkerland_claimant.101.a: "The eastern claimant has found its form."
 ADISCORD_vorkerland_claimant.102.t: "Worx Links the Directorate to the Front"
 ADISCORD_vorkerland_claimant.102.d: "Dorian Worx's technical directorate has connected production reports, field laboratories, power dispatch, and repair trains to one operational system. Its claim to govern will now be tested in the centre."
 ADISCORD_vorkerland_claimant.102.a: "The figures will meet the battlefield."
 ADISCORD_vorkerland_prewar_compact_requires_both_tt:0 "Signing gives the centre §Y5000§! £infantry_equipment_texticon and §G+3%§! £stability_texticon; after the split the Emergency Committee receives them as well. Each of the four districts ratifies separately and receives §Y2500§! £infantry_equipment_texticon and §G+3%§! £stability_texticon once both parties have signed. Another district cannot veto our pact. A ratified pact gives the Emergency Committee and the Central Administrative District §G+0.05§! legitimacy at the start of the civil war. Signatories favour the Worcker coalition; the player remains free to choose."
 ADISCORD_vorkerland_prewar_category:0 "Inheritance of the Confederation"
 ADISCORD_vorkerland_prewar_category_desc:0 "[GetVorkerlandPreparationSummary]\n\n§YTHE CAMPS§!\nWorcker's committees: §Y[?global.ADISCORD_vorkerland_camp_committees|0]§! / 100\nPetrichev's district staff: §Y[?global.ADISCORD_vorkerland_camp_staff|0]§! / 100\nWorx's engineers: §Y[?global.ADISCORD_vorkerland_camp_engineers|0]§! / 100\nAt the split a camp with §Y50§! influence arms its claimant; from §Y75§! it supplies it in full.\n\n§YTHE CENTRE AND THE DISTRICTS§!\nA centre lean of §Y0.30§! gives the heir another §Y9000§! £infantry_equipment_texticon and §Y40§! £political_power_texticon. A district lean of §Y0.30§! gives the heir §G+0.05§! legitimacy."
 ADISCORD_vorkerland_prewar_hide_reserves:0 "Hide Reserves: [FROM.GetName]"
 ADISCORD_vorkerland_prewar_hide_reserves_desc:0 "Rifles leave the warehouses for inconspicuous depots, and reservists receive an assembly address known only to the local staff. When the Confederation breaks apart, the cache will be opened by whichever authority receives the region."
 ADISCORD_vorkerland_reserve_cache_cost:0 "§Y25§! £political_power_texticon §Y1500§! £infantry_equipment_texticon"
 ADISCORD_vorkerland_reserve_cache_cost_blocked:0 "§R25§! £political_power_texticon §R1500§! £infantry_equipment_texticon"
 ADISCORD_vorkerland_reserve_cache_cost_tooltip:0 "§Y25§! £political_power_texticon §Y1500§! £infantry_equipment_texticon"
 ADISCORD_vorkerland_reserve_cache_slot_tt:0 "A cache slot is free: two, and two more after dispersing the reserves or the district depots"
 ADISCORD_vorkerland_reserve_cache_begin_tt:0 "The cache will be ready in §Y30§! days. If the Confederation breaks apart sooner, the owner of the region receives only the rifles, without the reservists."
 ADISCORD_vorkerland_reserve_cache_ready_tt:0 "The cache is ready: at the start of the civil war the owner of the region receives §Y1500§! £infantry_equipment_texticon and §Y1500§! £manpower_texticon."
 ADISCORD_vorkerland_reserve_cache_extra_slots_tt:0 "§G2§! more reserve caches can be prepared."
 ADISCORD_vorkerland_reserve_cache_to_wkr_tt:0 "After the split the region passes to the §YVorkerland Emergency Committee§!."
 ADISCORD_vorkerland_reserve_cache_to_tva_tt:0 "After the split the region passes to the §YVorkensberg Directorate§!."
 ADISCORD_vorkerland_reserve_cache_to_vad_tt:0 "After the split the region passes to the §YCentral Administrative District§!."
 ADISCORD_vorkerland_reserve_cache_to_eyr_tt:0 "After the split the region passes to the §YRepublic of Eyrmi§!."
 ADISCORD_vorkerland_reserve_cache_to_egc_tt:0 "After the split the region passes to the §YZshat Junta§!."
 ADISCORD_vorkerland_reserve_cache_to_riv_tt:0 "After the split the region remains with §YRiven§!."
 ADISCORD_vorkerland_reserve_cache_to_yor_tt:0 "After the split the region remains with the §YYor Republic§!."
 ADISCORD_vorkerland_wrk_council_mandate_tt:0 "The Emergency Committee begins the civil war with §G+0.10§! legitimacy."
 ADISCORD_vorkerland_wrk_charter_mandate_tt:0 "The Emergency Committee begins the civil war with §G+0.05§! legitimacy."
 ADISCORD_vorkerland_district_archives_endorsement_tt:0 "When the district first joins a claimant coalition, the archives give its leader §G+0.05§! legitimacy."
 ADISCORD_vorkerland_showdown_focus_live_war_tt: "The §Ycentral showdown§! must be active, and this claimant must still be fighting another central belligerent."

 WRK_open_worker_vadl_backchannel: "Convene the Autonomous Administrations"
 WRK_open_worker_vadl_backchannel_desc: "Invite Eyrmia, its garrison district, Riven and Yor to agree on emergency supply and continuity of local government."
 WRK_offer_emergency_compact: "Offer an Emergency Compact"
 WRK_offer_emergency_compact_desc: "The centre and each autonomous administration will ratify the guarantees separately. The compact will preserve local institutions and provide an arms reserve, but it cannot end the struggle for power after the Unity Tower falls."
 WRK_mobilize_loyal_republics: "Mobilise the Loyal Republics"
 WRK_mobilize_loyal_republics_desc: "A failed negotiation would expose our intentions while the districts drift away. We will instead ask the loyal republics for officers, railway guards, and explicit mobilisation schedules."
 WRK_place_reserves_under_worker: "Place the Reserves under Worcker"
 WRK_place_reserves_under_worker_desc: "District stores and replacement rolls will answer the central Worcker administration before rival emergency governments can requisition them."
 VAD_prepare_vadl_worker_terms: "Negotiate Autonomy Guarantees"
 VAD_prepare_vadl_worker_terms_desc: "The district may accept common emergency rules or prepare its own command independently of the centre."
 VAD_ratify_emergency_compact: "Ratify the Emergency Compact"
 VAD_ratify_emergency_compact_desc: "Ratification by the centre and all four autonomous administrations releases the agreed local reserves."
 VAD_activate_eastern_mandate: "Establish District Command"
 VAD_activate_eastern_mandate_desc: "Local recruitment and supply belong to this administration and survive the collapse."
 VAD_seal_district_arsenals: "Seal the District Arsenals"
 VAD_seal_district_arsenals_desc: "Secure district stocks for the local garrison."
 VAD_assess_central_demands:0 "The Centre's Demands"
 VAD_assess_central_demands_desc:0 "The capital sends ever new demands: taxes in advance, men for the reserve, reports every week. The district administration counts how much of it it is willing to fulfil."
 VAD_loyalty_to_the_centre:0 "Loyalty to the Centre"
 VAD_loyalty_to_the_centre_desc:0 "The district fulfils the capital's demands and hands over its reservists. The centre grows stronger, and the district garrison grows used to obeying the common staff."
 VAD_own_emergency_rule:0 "An Emergency of Our Own"
 VAD_own_emergency_rule_desc:0 "The district administration declares an emergency of its own and stops waiting for the capital's permission. The district grows calmer, but the centre loses its hold."
 VAD_central_garrison_compact:0 "The Central Garrison Compact"
 VAD_central_garrison_compact_desc:0 "The district garrison receives rifles and officers from the capital in exchange for a promise to march on the common order."
 VAD_district_emergency_council:0 "The District Emergency Council"
 VAD_district_emergency_council_desc:0 "A council of district officials, officers and plant managers takes over the decisions the capital used to sign."

 WKR_establish_front_operations_bureau: "Establish the Front Operations Bureau"
 WKR_establish_front_operations_bureau_desc: "The republic's constitutional settlement must now survive contact with a moving front. A small bureau will coordinate reinforcements, plans, and command-power requests without replacing the councils."
 WKR_authorize_republican_mission_commands: "Authorise Republican Mission Commands"
 WKR_authorize_republican_mission_commands_desc: "Nikita's public mandate can support temporary commands with narrow written tasks. Their authority ends with the mission, while the front gains a clear source of orders."
 WKR_issue_normative_campaign_tables: "Issue Normative Campaign Tables"
 WKR_issue_normative_campaign_tables_desc: "Bagley's apparatus will convert the campaign into binding schedules for supply, planning, and unit readiness. The tables sacrifice political ease for consistency at the front."
 WKR_form_rolling_factory_groups: "Form Rolling Factory Groups"
 WKR_form_rolling_factory_groups_desc: "Machine crews and compact workshops will follow the railway reserve, restoring weapons close to the fighting instead of waiting for damaged stock to return west."
 WKR_reopen_night_freight_corridors: "Reopen the Night Freight Corridors"
 WKR_reopen_night_freight_corridors_desc: "Blackout timetables and repair teams can keep the two western freight corridors moving."
 WKR_arm_the_mobile_reserve: "Arm the Mobile Reserve"
 WKR_arm_the_mobile_reserve_desc: "A trained reserve is useless if its radios, field tools, and command posts remain scattered among district depots. We will assemble one deployable force behind the threatened sector."
 WKR_coordinate_the_rolling_front: "Coordinate the Rolling Front"
 WKR_coordinate_the_rolling_front_desc: "Factories, freight trains, and the mobile reserve will move to one campaign rhythm. The arrangement is demanding, but for a short window it can keep an offensive from exhausting itself."

 VAD_convene_campaign_directorate: "Convene the Campaign Directorate"
 VAD_convene_campaign_directorate_desc: "The interim register describes who may issue orders; the directorate will ensure those orders reach a live front with reinforcements and staff work behind them."
 VAD_issue_prefectural_field_decrees: "Issue Prefectural Field Decrees"
 VAD_issue_prefectural_field_decrees_desc: "Vlad will replace the provisional war cabinet with a mature prefectural system whose decrees carry both legal force and operational priority."
 VAD_seat_front_commissars: "Seat Front Commissars"
 VAD_seat_front_commissars_desc: "The joint council will place civilian delegates inside the field command. Their presence turns dual authority from a temporary bargain into a functioning wartime protocol."
 VAD_standardize_restoration_columns: "Standardise the Restoration Columns"
 VAD_standardize_restoration_columns_desc: "Identical load tables, march intervals, and repair allotments will let eastern columns exchange supplies without waiting for a chancery ruling."
 VAD_advance_under_one_register: "Advance under One Register"
 VAD_advance_under_one_register_desc: "Whether authority rests with Vlad's prefectures or the joint council, the final advance will be recorded, supplied, and commanded through one public chain."

 TVA_merge_iteration_with_field_command: "Merge Iteration with Field Command"
 TVA_merge_iteration_with_field_command_desc: "The second protocol was tested in reports. Worx will now integrate it with the operational loop and expose its assumptions to the demands of a live front."
 TVA_mass_produce_assault_modules: "Mass-Produce Assault Modules"
 TVA_mass_produce_assault_modules_desc: "The technical-battalion trial will become interchangeable assault kits that ordinary formations can receive without creating another specialist army."
 TVA_link_observers_to_fire_control: "Link Observers to Fire Control"
 TVA_link_observers_to_fire_control_desc: "Observation reports will enter the same tables used by remote fire-control teams, reducing delay between a verified target and a corrected firing solution."
 TVA_turn_repair_trains_into_supply_web: "Turn Repair Trains into a Supply Web"
 TVA_turn_repair_trains_into_supply_web_desc: "Adaptive-logistics results will connect repair trains, switching crews, and forward depots into a network that reroutes around measured disruption."
 TVA_run_live_front_validation: "Run Live-Front Validation"
 TVA_run_live_front_validation_desc: "Worx will publish a final wartime test against real losses, delays, and equipment failures."

 ADISCORD_vorkerland_wrk_loyal_republics_mobilized: "Loyal Republics Mobilised"
 ADISCORD_vorkerland_wrk_loyal_republics_mobilized_desc: "District mobilisation schedules and trained railway guards let Worcker recover organisation faster during the opening emergency."
 ADISCORD_vorkerland_vad_eastern_mandate: "District Mobilization"
 ADISCORD_vorkerland_vad_eastern_mandate_desc: "Local offices coordinate recruitment and arms workshops to supply the district garrison."
 ADISCORD_vorkerland_wkr_front_operations_bureau: "Front Operations Bureau"
 ADISCORD_vorkerland_wkr_front_operations_bureau_desc: "A permanent wartime staff coordinates planning, reinforcements, and command-power requests for the western claimant."
 ADISCORD_vorkerland_wkr_republican_mission_commands: "Republican Mission Commands"
 ADISCORD_vorkerland_wkr_republican_mission_commands_desc: "Narrow public mandates give field commands urgency without surrendering the councils' constitutional authority."
 ADISCORD_vorkerland_wkr_normative_campaign_tables: "Normative Campaign Tables"
 ADISCORD_vorkerland_wkr_normative_campaign_tables_desc: "Binding operational schedules improve planning depth and supply discipline, but deepen the regime's political austerity."
 ADISCORD_vorkerland_wkr_rolling_factory_groups: "Rolling Factory Groups"
 ADISCORD_vorkerland_wkr_rolling_factory_groups_desc: "Mobile workshops add speed and breakthrough capacity while accepting the wear of improvised field production."
 ADISCORD_vorkerland_wkr_night_freight_corridors: "Night Freight Corridors"
 ADISCORD_vorkerland_wkr_night_freight_corridors_desc: "Blackout freight schedules reduce supply demand and accelerate repair along the western network."
 ADISCORD_vorkerland_wkr_rolling_front: "The Rolling Front"
 ADISCORD_vorkerland_wkr_rolling_front_desc: "For a brief offensive window, the western claimant trades a heavier supply burden for attack, breakthrough, and organisational recovery."
 ADISCORD_vorkerland_vad_campaign_directorate: "Campaign Directorate"
 ADISCORD_vorkerland_vad_campaign_directorate_desc: "A single staff turns registered authority into faster planning, reinforcement, and command decisions."
 ADISCORD_vorkerland_vad_restoration_war_cabinet_2: "Prefectural War Directorate"
 ADISCORD_vorkerland_vad_restoration_war_cabinet_2_desc: "Vlad's mature war government preserves the restoration cabinet's authority while adding a sharper offensive and reinforcement system."
 ADISCORD_vorkerland_vad_dual_authority_protocol_2: "Front Commissars' Protocol"
 ADISCORD_vorkerland_vad_dual_authority_protocol_2_desc: "The joint government keeps its dual legitimacy while improving planning depth and recovery between engagements."
 ADISCORD_vorkerland_vad_standardized_restoration_columns: "Standardised Restoration Columns"
 ADISCORD_vorkerland_vad_standardized_restoration_columns_desc: "Common load tables let the eastern columns move faster and consume less supply."
 ADISCORD_vorkerland_vad_joint_front_operation: "Joint Front Operation"
 ADISCORD_vorkerland_vad_joint_front_operation_desc: "Council delegates and field officers share a reinforced command and a disciplined supply plan."
 ADISCORD_vorkerland_vad_prefectural_offensive: "Prefectural Offensive"
 ADISCORD_vorkerland_vad_prefectural_offensive_desc: "Vlad's decrees accelerate mobilisation, planning, and attack for one registered offensive."
 ADISCORD_vorkerland_tva_integrated_second_protocol: "Integrated Second Protocol"
 ADISCORD_vorkerland_tva_integrated_second_protocol_desc: "The second iteration now links planning, supply, repair, and field organisation in one measured protocol."
 ADISCORD_vorkerland_tva_assault_modules: "Assault Modules"
 ADISCORD_vorkerland_tva_assault_modules_desc: "Interchangeable assault packages strengthen attack and breakthrough while feeding practical lessons back into production."
 ADISCORD_vorkerland_tva_linked_fire_control: "Linked Fire Control"
 ADISCORD_vorkerland_tva_linked_fire_control_desc: "Observers and firing teams now share one verified operational picture."
 ADISCORD_vorkerland_tva_supply_web: "Adaptive Supply Web"
 ADISCORD_vorkerland_tva_supply_web_desc: "Repair trains and forward depots reroute supply around disruption, reducing attrition and accelerating repairs."
 ADISCORD_vorkerland_tva_live_front_validated: "Live Front Validated"
 ADISCORD_vorkerland_tva_live_front_validated_desc: "The directorate has tested its integrated system against real campaign data and corrected the surviving model."

 # Claimant variant branches: WKR neo-vorkerist line.
 WKR_declare_the_revolution_unfinished: "The Revolution Is Not Finished"
 WKR_declare_the_revolution_unfinished_desc: "Chairman Worcker survived Vorkergrad, and the Chairman does not intend to be a caretaker. The emergency government declares that the revolution was interrupted rather than completed, and that everything the republic still owns belongs to finishing it."
 WKR_raise_the_worker_levy: "Raise the Worcker Levy"
 WKR_raise_the_worker_levy_desc: "Every shop committee is given a quota in men rather than in output. The levy fills the line battalions in weeks instead of months, and it fills them with people who have never held a rifle."
 WKR_vest_all_power_in_the_chairman: "All Power to the Chairman"
 WKR_vest_all_power_in_the_chairman_desc: "The front soviets vote themselves out of the decision. For the duration of the emergency the Chairman's signature is the constitution, and the free republics beyond the border are invited to send whoever they can spare."

 # Claimant variant branches: WKR utilitarian line.
 WKR_govern_by_delivered_results: "Govern by Delivered Results"
 WKR_govern_by_delivered_results_desc: "Bagley has no revolutionary biography and does not pretend to one. The directorate asks to be judged on tonnes, kilowatts and rations delivered, and quietly stops asking to be judged on anything else."
 WKR_publish_the_ration_ledger: "Publish the Ration Ledger"
 WKR_publish_the_ration_ledger_desc:0 "The ration ledger belongs beside the production report. It is difficult to demand exact quotas from someone who does not know whether there will be bread tonight."
 WKR_bind_the_republic_to_its_norms: "Bind the Republic to Its Norms"
 WKR_bind_the_republic_to_its_norms_desc: "Authority is written down as a procedure instead of being granted to a person. It is a slower republic and a duller one, but its workshops know what they will be asked for next quarter."

 # Claimant variant branches: VAD imperial restoration line.
 VAD_reclaim_the_imperial_mandate: "Reclaim the Imperial Mandate"
 VAD_reclaim_the_imperial_mandate_desc: "Petrichev stops describing the chancery as an emergency measure. The registers are reopened under the old seals, and the Vadl restoration begins speaking in the language of a state that never legally ended."
 VAD_recall_the_officer_estates: "Recall the Officer Estates"
 VAD_recall_the_officer_estates_desc: "Officers dismissed by the republic are written back into the seniority lists at their old rank. Staff work improves immediately; the districts that remember why they were dismissed do not."
 VAD_crown_the_restoration: "Crown the Restoration"
 VAD_crown_the_restoration_desc: "The chancery declares the restoration complete in law before it is complete on the map. Foreign offices that would rather deal with a legitimist Vorkerland now have a document to point at."

 # Claimant variant branches: VAD joint council line.
 VAD_seat_the_dual_chamber: "Seat the Dual Chamber"
 VAD_seat_the_dual_chamber_desc: "The rescued chairman and the district guard sit in the same room and sign the same orders. Neither side trusts the arrangement, and both sides need it more than they need to be right."
 VAD_open_the_district_rolls: "Open the District Rolls"
 VAD_open_the_district_rolls_desc: "Guard registers and worker committee lists are merged into a single call-up roll. The joint government can reach into places the chancery alone was never allowed to touch."
 VAD_bind_crown_and_council: "Bind Crown and Council"
 VAD_bind_crown_and_council_desc: "The dual authority protocol is written into the chain of command instead of being renegotiated every month. The state becomes very difficult to knock over and noticeably slow to strike."

 # Claimant variant branches: TVA continuous mobilisation line.
 TVA_declare_continuous_mobilization: "Declare Continuous Mobilisation"
 TVA_declare_continuous_mobilization_desc: "Worx publishes the directorate's answer: the scarce resource is time. Every other quantity in the model - grid capacity, civilian supply, the condition of the workforce - is reclassified as an input that may be spent."
 TVA_convert_the_civil_grid: "Convert the Civil Grid"
 TVA_convert_the_civil_grid_desc: "Municipal load is cut to the minimum that keeps the water moving and the rest is switched to the workshops. The directorate has calculated that the city can survive the winter on the difference."
 TVA_run_the_republic_as_one_process: "Run the Republic as One Process"
 TVA_run_the_republic_as_one_process_desc: "Production, transport and replacement are scheduled from a single sheet at a single takt time. The republic stops being an argument between departments and becomes a machine that is visibly wearing out."

 # Claimant variant branches: TVA preservation protocol line.
 TVA_enact_the_preservation_protocol: "Enact the Preservation Protocol"
 TVA_enact_the_preservation_protocol_desc: "Worx publishes the other answer: the scarce resource is trained people. A specialist lost this winter cannot be replaced before the war ends, so the model is rebuilt around not losing them."
 TVA_evacuate_the_design_bureaus: "Evacuate the Design Bureaus"
 TVA_evacuate_the_design_bureaus_desc: "Drawing offices, instrument shops and their staff are moved out of artillery range before anything else is loaded. The front waits three weeks for its trains; the laboratories keep working."
 TVA_certify_the_surviving_cadre: "Certify the Surviving Cadre"
 TVA_certify_the_surviving_cadre_desc: "Everyone still alive is re-examined and re-rated, and the ratings are enforced. The directorate ends the war with fewer divisions than it could have raised, and with an army that does not have to be taught twice."

 # Claimant variant national spirits.
 ADISCORD_vorkerland_wkr_unfinished_revolution: "Unfinished Revolution"
 ADISCORD_vorkerland_wkr_unfinished_revolution_desc: "The Chairman's survival is the government's only mandate. War support and conscription rise; the home front and the workshops pay for it."
 ADISCORD_vorkerland_wkr_worker_levy: "Worcker Levy"
 ADISCORD_vorkerland_wkr_worker_levy_desc: "Shop committees are filling the battalions faster than the training establishment can absorb them."
 ADISCORD_vorkerland_wkr_chairmans_mandate: "The Chairman's Mandate"
 ADISCORD_vorkerland_wkr_chairmans_mandate_desc: "One signature ends every argument. Attacks are pressed harder and volunteers move freely, and no institution is left that could absorb a mistake."
 ADISCORD_vorkerland_wkr_delivery_mandate: "Mandate of Delivery"
 ADISCORD_vorkerland_wkr_delivery_mandate_desc: "The directorate's legitimacy is measured in output. Industry and construction improve; enthusiasm for the offensive does not."
 ADISCORD_vorkerland_wkr_ration_ledger: "Published Ration Ledger"
 ADISCORD_vorkerland_wkr_ration_ledger_desc: "Printed accounts of what was promised and what arrived hold the districts together while the front does not move."
 ADISCORD_vorkerland_wkr_normative_republic: "Normative Republic"
 ADISCORD_vorkerland_wkr_normative_republic_desc: "Authority lives in written procedure. The factories run at a predictable pace, and nobody improvises an offensive."
 ADISCORD_vorkerland_vad_imperial_mandate: "Imperial Mandate"
 ADISCORD_vorkerland_vad_imperial_mandate_desc: "The chancery governs by decree under the old seals: excellent staff work, cheap commanders, and a rear that has agreed to none of it."
 ADISCORD_vorkerland_vad_officer_estates: "Recalled Officer Estates"
 ADISCORD_vorkerland_vad_officer_estates_desc: "Reinstated officers are rebuilding the staffs and the training pipeline, at a visible cost in civilian goods."
 ADISCORD_vorkerland_vad_crowned_restoration: "Crowned Restoration"
 ADISCORD_vorkerland_vad_crowned_restoration_desc: "A legally complete restoration fights better and negotiates better, and still cannot make the districts love it."
 ADISCORD_vorkerland_vad_dual_chamber: "Dual Chamber"
 ADISCORD_vorkerland_vad_dual_chamber_desc: "Two authorities sign every order. The country is calm and broadly mobilised; the staff work suffers accordingly."
 ADISCORD_vorkerland_vad_district_rolls: "Open District Rolls"
 ADISCORD_vorkerland_vad_district_rolls_desc: "Guard and committee registers merged into one call-up reach further than either could alone."
 ADISCORD_vorkerland_vad_crown_and_council: "Crown and Council"
 ADISCORD_vorkerland_vad_crown_and_council_desc: "Dual authority written into the chain of command. The state is very hard to break and slow to hit hard."
 ADISCORD_vorkerland_tva_continuous_mobilization: "Continuous Mobilisation"
 ADISCORD_vorkerland_tva_continuous_mobilization_desc: "The directorate optimises for time. Capacity and manpower are spent freely; research, order and stability are the account it is drawn from."
 ADISCORD_vorkerland_tva_converted_grid: "Converted Civil Grid"
 ADISCORD_vorkerland_tva_converted_grid_desc: "Municipal power and labour redirected to the workshops for one accounting season."
 ADISCORD_vorkerland_tva_single_process: "One Process"
 ADISCORD_vorkerland_tva_single_process_desc: "The whole republic runs on one schedule and one takt. Throughput is excellent; the people running it are not being replaced."
 ADISCORD_vorkerland_tva_preservation_protocol: "Preservation Protocol"
 ADISCORD_vorkerland_tva_preservation_protocol_desc: "The directorate optimises for trained people. Research and defence hold up; the output figures do not."
 ADISCORD_vorkerland_tva_evacuated_bureaus: "Evacuated Design Bureaus"
 ADISCORD_vorkerland_tva_evacuated_bureaus_desc: "The drawing offices work through the winter behind the front, at the cost of the trains that carried them there.\n\n\n\n\n\n £GFX_ADISCORD_vorkerland_tva_field_laboratories_banner \n\n\n"
 ADISCORD_vorkerland_tva_certified_cadre: "Certified Cadre"
 ADISCORD_vorkerland_tva_certified_cadre_desc: "A smaller, re-examined army that holds ground cheaply and cannot be hurried."

 # Claimant depth branches: war economy, variant doctrine, late war,
 # legitimacy and diplomacy.
 WKR_convene_the_production_soviet: "Convene the Production Soviet"
 WKR_convene_the_production_soviet_desc: "Delegates from every working shop in loyalist hands sit in one hall and take the decisions the ministries no longer can. Nothing is produced by the meeting itself, but from now on there is a body that can be blamed."
 WKR_strip_the_civil_economy: "Strip the Civil Economy"
 WKR_strip_the_civil_economy_desc: "Every lathe that turns for the districts is turned over to the front. The republic will make shells and it will not make shoes, and the soviet has voted to say so out loud."
 WKR_keep_the_bread_ration: "Keep the Bread Ration"
 WKR_keep_the_bread_ration_desc: "The ration is not cut. The districts stay quiet, the recruiting queues stay full, and the shell counts stay lower than the front asks for. The soviet has decided the republic must survive its own war."
 WKR_doctrine_of_the_armed_people: "Doctrine of the Armed People"
 WKR_doctrine_of_the_armed_people_desc: "The Chairman's staff writes the shortest training programme in Vorkerland's history. A worker who can hold a line after four weeks is worth more, on this arithmetic, than one who could have held it perfectly after twelve."
 WKR_break_them_with_numbers: "Unite the Battalions into Assault Columns"
 WKR_break_them_with_numbers_desc: "Factory detachments are used to their own banners and familiar commanders. Common slogans alone will not carry them through a fortified line. The Chairman's staff proposes placing neighbouring battalions under one command and teaching them to advance together. The councils must decide whom to trust with the people still expected at their machines."
 WKR_doctrine_of_measured_force: "Doctrine of Measured Force"
 WKR_doctrine_of_measured_force_desc: "The norms commission rules that an attack which cannot be supplied is not an attack but a casualty list. The republic's divisions will be fewer, will hold longer, and will not be spent to make a point."
 WKR_replace_men_with_output: "Replace Men With Output"
 WKR_replace_men_with_output_desc: "Where the front asks for another battalion, the norms commission sends another train of equipment instead. It is slower, it is measurable, and it can be defended in front of the soviet."
 WKR_throw_the_reserves_forward:0 "Prepare the Assault Echelon"
 WKR_throw_the_reserves_forward_desc:0 "The councils are drawing up a common schedule for the reserves. Workshops send their people, supplies and remaining communications equipment to headquarters. The offensive must begin when the whole echelon is ready, not when another commander demands reinforcements."
 WKR_dig_in_along_the_interchange:0 "Prepare the Junctions for Siege"
 WKR_dig_in_along_the_interchange_desc:0 "Station councils are turning familiar tracks and warehouses into defensive districts. The workers know every approach and embankment. If the front reaches a junction, that knowledge must serve the whole republic."
 WKR_seat_the_factory_councils: "Seat the Factory Councils"
 WKR_seat_the_factory_councils_desc: "Elected councils take formal standing in every plant the republic still runs. It is a slow way to be believed, and for a government that seized power in a night, being believed is the scarce commodity."
 WKR_publish_the_production_returns: "Publish the Production Returns"
 WKR_publish_the_production_returns_desc: "Real figures, unrounded, posted at every gate. The republic stakes its standing on the numbers being good, which requires that the numbers actually be good."
 WKR_requisition_in_the_republics_name: "Requisition in the Republic's Name"
 WKR_requisition_in_the_republics_name_desc: "Warehouses opened, columns of men marched off the shop floor, receipts written that everyone knows will never be honoured. The front is fed today and the republic is a little less legitimate tomorrow."
 WKR_arm_the_bracket_victors: "Arm the Bracket Victors"
 WKR_arm_the_bracket_victors_desc:0 "The local wars in the centre reveal their victors. Their delegates arrive at the front councils under different banners with the same request: deliver the promised aid to the units now holding a common front with us."
 WKR_seek_outside_recognition:0 "Recognise the Independent Republics"
 WKR_seek_outside_recognition_desc:0 "Frealor and the Truman Republic no longer regard themselves as temporarily detached districts. To speak to them as neighbours, we must sign words that were once forbidden even in conversation. Their recognition in return can give the western committees a standing that force alone cannot secure."
 VAD_convene_the_restoration_treasury: "Convene the Restoration Treasury"
 VAD_convene_the_restoration_treasury_desc: "The chancery reconstitutes a treasury out of surviving district ledgers and whatever the old finance ministry left behind. It can now decide, formally, who is going to pay for this war."
 VAD_levy_the_crown_estates: "Levy the Crown Estates"
 VAD_levy_the_crown_estates_desc: "The estates are called on for men and for money, at rates last used in a war nobody living remembers. The districts comply, and they remember who asked."
 VAD_protect_the_district_markets: "Protect the District Markets"
 VAD_protect_the_district_markets_desc: "The treasury rules that a restoration which starves its own districts restores nothing. Requisition is capped, the markets stay open, and the army stays the size the markets will bear."
 VAD_doctrine_of_the_officer_estates: "Doctrine of the Officer Estates"
 VAD_doctrine_of_the_officer_estates_desc:0 "An officer patent is once again a personal obligation to the crown. Regimental families bring experience and connections to the staff, but demand the right to judge who deserves their uniform. The imperial military school rests on a narrow circle accustomed to answering for its orders."
 VAD_restore_the_guards_regiments: "Restore the Guards Regiments"
 VAD_restore_the_guards_regiments_desc:0 "The guards must unite the throne with districts that honour their charters. Local recruits will enter the rolls beside career soldiers, while engineers teach them to hold crossings and roads. An old regimental name alone cannot accomplish this."
 VAD_doctrine_of_the_district_levies: "Doctrine of the District Levies"
 VAD_doctrine_of_the_district_levies_desc:0 "The joint cabinet recognises each district's right to name its regiment and choose people trusted by their neighbours. Worker sees the foundation of a new union in these rolls; Petrichev sees an army that still has to learn to obey a common command."
 VAD_train_the_council_militias: "Train the Council Militias"
 VAD_train_the_council_militias_desc:0 "A commandant cannot speak to a district through a sentry box forever. Local councils offer their own people to guard stores and streets. Their presence will bind the military administration to the population, although some workers will never return to an ordinary shift."
 VAD_march_on_the_old_capital: "March on the Old Capital"
 VAD_march_on_the_old_capital_desc: "The chancery commits the restoration to finishing the argument where it started. Everything the staff has been saving is put into one axis of advance."
 VAD_fortify_the_restoration_line: "Fortify the Restoration Line"
 VAD_fortify_the_restoration_line_desc: "The restoration stops advancing and starts building. What it holds it will hold permanently, and it invites the other claimants to break themselves against it."
 VAD_stage_the_coronation_rites:0 "Confirm District Privileges"
 VAD_stage_the_coronation_rites_desc:0 "A charter must mean more than a signature beneath a promise of loyalty. District administrations ask us to confirm their rights to workshops, roads and local stores. The chancery is ready to support its obligations with assistance that people can see beyond the ceremonial hall."
 VAD_mortgage_the_regalia:0 "Pledge Crown Property"
 VAD_mortgage_the_regalia_desc:0 "The crown inventories are full of valuables that cannot hold a single defensive line. Petrichev proposes accepting arms consignments secured against district enterprises. The administration will keep its charter, but part of its economy will service the suppliers' claims."
 TVA_run_the_grid_at_war_load: "Run the Grid at War Load"
 TVA_run_the_grid_at_war_load_desc:0 "Dispatchers combine the weapons workshops into a single production shift. Civilian consumers wait their turn while the best technicians stay at their machines until the batch is accepted. Each new timetable is signed by the people who will have to restore the grid afterwards."
 TVA_hold_back_civil_power:0 "Preserve Civilian Supply"
 TVA_hold_back_civil_power_desc:0 "Dispatchers make room for scheduled shutdowns. Laboratories, pumping stations and residential districts receive their own place in the timetable; repair crews no longer have to wait for a breakdown to reach a worn-out junction."
 TVA_doctrine_of_continuous_assault: "Doctrine of Continuous Assault"
 TVA_doctrine_of_continuous_assault_desc: "The directorate treats the front as a process with a cycle time and sets about shortening it. Attacks are scheduled, not decided, and the schedule does not have a rest day in it."
 TVA_doctrine_of_the_measured_front: "Doctrine of the Measured Front"
 TVA_doctrine_of_the_measured_front_desc: "Worx's protocol treats a trained crew as the scarcest item in the republic's inventory, because it is. The front advances only where the measurement says the advance will hold."
 TVA_spend_the_reserve_cadre:0 "Send Specialists to the Front"
 TVA_spend_the_reserve_cadre_desc:0 "Reserve engineers are being prepared to serve with line units. They know the weaknesses of their own weapons and can remedy them under fire, but every frontline assignment puts the promised return to civilian drawing boards further out of reach."
 TVA_seal_the_technical_core:0 "Shelter the Technical Core"
 TVA_seal_the_technical_core_desc:0 "The directorate draws up lists of specialists who must not be lost with the forward workshops. Protected workplaces and separate retreat routes are prepared for them. The republic must preserve the people who can rebuild it after the war."
 TVA_publish_the_reconstruction_index: "Publish the Reconstruction Index"
 TVA_publish_the_reconstruction_index_desc:0 "The districts need reasons to trust our reports. We will open the original logs and let a commission name what it finds, even when its conclusions embarrass the directorate."
 TVA_divert_the_research_budget: "Divert the Research Budget"
 TVA_divert_the_research_budget_desc:0 "The laboratories and the front draw on the same people and working instruments. Worx proposes turning part of the research workshops over to military inspectors. Department heads are already listing the experiments they will have to suspend."
 TVA_open_the_technical_exchange: "Open the Technical Exchange"
 TVA_open_the_technical_exchange_desc:0 "War has cut the old network of institutes and experimental workshops apart. Specialists still work in the districts, constrained by their own facilities. The directorate will offer them a place in its laboratories and equipment for the workshops they leave behind."
 TVA_build_the_engineering_service:0 "Build the Engineering Service"
 TVA_build_the_engineering_service_desc:0 "A drawing is useless without someone able to explain it to the next shift. Permanent instructors will join the laboratories, turning the trial crews' experience into training for our own technicians."
 ADISCORD_vorkerland_wkr_doctrine: "Published Programme"
 ADISCORD_vorkerland_wkr_doctrine_desc: "The line the councils published. Its weight is the weight of the argument: a government that is still believed fights the war it described, and one that has lost the argument is left holding a pamphlet."
 ADISCORD_vorkerland_vad_doctrine: "Published Programme"
 ADISCORD_vorkerland_vad_doctrine_desc: "The line the chancery published. Its weight is the weight of the argument: a government that is still believed fights the war it described, and one that has lost the argument is left holding a pamphlet."
 ADISCORD_vorkerland_tva_doctrine: "Published Programme"
 ADISCORD_vorkerland_tva_doctrine_desc: "The line the directorate published. Its weight is the weight of the argument: a government that is still believed fights the war it described, and one that has lost the argument is left holding a pamphlet."
 ADISCORD_vorkerland_wkr_war_economy: "Councils on a War Footing"
 ADISCORD_vorkerland_wkr_councils:0 "Worker Councils"
 ADISCORD_vorkerland_wkr_councils_tt:0 "Councils established: §Y[?ADISCORD_vorkerland_wkr_councils|0]§!; assigned to the army, including training: §Y[?ADISCORD_vorkerland_wkr_councils_mobilized|0]§!."
 ADISCORD_vorkerland_wkr_mobilize_council:0 "Send a Council to the Front"
 ADISCORD_vorkerland_wkr_mobilize_council_desc:0 "The council closes its shop and marches its workers into a battalion under its own banner. The front gains trained men and factory rifles; the factory keeps idle machines until the war is over."
 ADISCORD_vorkerland_wkr_working_council_tt:0 "A council is still working in the factories"
 ADISCORD_vorkerland_wkr_requisition_councils_tt:0 "Unlocks accelerated training of two factory detachments for their full personnel and weapons cost."
 ADISCORD_vorkerland_vad_grant_district_charter:0 "Grant a Charter: [FROM.GetName]"
 ADISCORD_vorkerland_vad_grant_district_charter_desc:0 "The chancery recognises the region's own registers, courts and elected elders. In return the district swears to the restoration and raises volunteers who fight for their own rights rather than for a ration."
 ADISCORD_vorkerland_vad_impose_commandant_rule:0 "Impose Commandant Rule: [FROM.GetName]"
 ADISCORD_vorkerland_vad_impose_commandant_rule_desc:0 "The commandanture takes the district's recruitment rolls and stores without the consent of local authorities. The elders answer to army officers, and the district remembers who arrived with warrants."
 ADISCORD_vorkerland_vad_charter_slot_tt:0 "Another charter can be granted: three, and three more after the crown commissions are restored"
 ADISCORD_vorkerland_vad_charter_slots_tt:0 "§G3§! more district charters can be granted."
 ADISCORD_vorkerland_vad_charter_result_tt:0 "Legitimacy §G+0.03§!. The state gains §G+20%§! local manpower while we hold it."
 ADISCORD_vorkerland_vad_commandant_result_tt:0 "Legitimacy §R-0.02§!. The state gains §G+10%§! local manpower and §G+15%§! local factories while we hold it. Initial unrest: §Y20/100§!."
 ADISCORD_vorkerland_vad_oath_lost_tt:0 "The state was lost before the oath: the full price is refunded. A new application may be made after recapture."
 ADISCORD_vorkerland_vad_chartered_district:0 "District Charter"
 ADISCORD_vorkerland_vad_commandant_district:0 "Commandant Rule"
 ADISCORD_vorkerland_tva_run_field_trial:0 "Run a Field Trial"
 ADISCORD_vorkerland_tva_run_field_trial_desc:0 "A prototype batch goes to the front with engineers and observation logs. A good run gives the designers a proven solution; a bad one gives them a list of failures the next batch will not repeat."
 ADISCORD_vorkerland_tva_trial_cost:0 "[GetTVATrialCost]"
 ADISCORD_vorkerland_tva_trial_cost_blocked:0 "[GetTVATrialCostBlocked]"
 ADISCORD_vorkerland_tva_trial_cost_tooltip:0 "[GetTVATrialCost]"
 ADISCORD_vorkerland_tva_trial_context_tt:0 "The trial protocol is approved. The technical administration is independent, has not capitulated and is fighting a participant in the civil war."
 ADISCORD_vorkerland_tva_trial_settlement_tt:0 "The programme, price and success chance are fixed on payment. A newly completed focus changes only future orders. Leaving the civil war, capitulation or subjugation returns all payment without a result or iteration. On reunification Vorkerland receives the refund; direct annexation transfers it to the victor."
 ADISCORD_vorkerland_tva_trial_chance_tt:0 "New trial success chance: §Y[?TVA_trial_success_chance|0]%§!, fixed on payment. Base 40%, plus 15% per iteration up to 85%; load of 70 adds -20%, load of 90 adds -35%; reserve of 75 adds +10%, reserve below 30 adds -15%. Final chance is limited to 5-95%."
 ADISCORD_vorkerland_tva_iteration_tt:0 "A completed iteration raises the base field trial chance by §G15%§! up to §Y85%§!. The final chance depends on network load and cadre reserves and is limited to §Y5-95%§!."
 ADISCORD_vorkerland_tva_trial_legitimacy_tt:0 "Legitimacy §G+0.02§!."
 ADISCORD_vorkerland_tva_trial_failed_tt:0 "The prototype batch is lost, but its failures are on record."
 ADISCORD_vorkerland_tva_trial_bonus:0 "Field Trial"
 ADISCORD_vorkerland_pw_council_output_tt:0 "Councils that stayed in the factories during the war become permanent: factory output §G+[?ADISCORD_vorkerland_pw_council_output|%]§! (§G+2%§! for each working council)."
 ADISCORD_vorkerland_pw_council_veterans_tt:0 "The council battalions come home: §Y[?ADISCORD_vorkerland_pw_council_veterans|0]§! £manpower_texticon (§Y5000§! for each council sent to the front)."
 ADISCORD_vorkerland_pw_charter_construction_tt:0 "The new state recognises the wartime district charters: construction speed §G+[?ADISCORD_vorkerland_pw_charter_construction|%]§! (§G+3%§! for each charter)."
 ADISCORD_vorkerland_pw_amnesty_manpower_tt:0 "The amnesty for commandant districts brings hidden conscripts back: §Y[?ADISCORD_vorkerland_pw_amnesty_manpower|0]§! £manpower_texticon (§Y3000§! for each district under commandant rule)."
 ADISCORD_vorkerland_pw_iteration_efficiency_tt:0 "Field-trial practice passes to the national laboratories: production efficiency cap §G+[?ADISCORD_vorkerland_pw_iteration_efficiency|%]§! (§G+1%§! per iteration up to §Y8%§!, multiplied by the retained share of the cadre reserve)."
 ADISCORD_vorkerland_wkr_war_economy_desc: "The production soviet sets the shop floor somewhere between what the front asks for and what the ration promises. Wherever it is set, the setting is worth exactly as much as the districts still turning out work - and the political bill for having set it arrives whether they do or not."
 ADISCORD_vorkerland_wkr_doctrine_armed_people: "Doctrine of the Armed People"
 ADISCORD_vorkerland_wkr_doctrine_armed_people_desc: "More divisions, raised faster, knowing less."
 ADISCORD_vorkerland_wkr_doctrine_measured_force: "Doctrine of Measured Force"
 ADISCORD_vorkerland_wkr_doctrine_measured_force_desc: "Fewer divisions that hold ground and stay supplied."
 ADISCORD_vorkerland_wkr_doctrine_output_over_men: "Output Over Men"
 ADISCORD_vorkerland_wkr_doctrine_output_over_men_desc: "Equipment sent where a battalion was asked for, and a longer wait for both."
 ADISCORD_vorkerland_wkr_reserves_forward:0 "Prepared Breakthrough"
 ADISCORD_vorkerland_wkr_reserves_forward_desc:0 "Headquarters has concentrated the reserves and coordinated the assault echelon. The frontline councils must now carry out their common plan."
 ADISCORD_vorkerland_vad_war_economy: "The Warrants and the Treasury"
 ADISCORD_vorkerland_vad_war_economy_desc: "The restoration treasury decides how far the old warrants reach into the districts. Every mile of ground lost means the same warrant raises fewer men, while the resentment it bought is banked and does not decay."
 ADISCORD_vorkerland_vad_doctrine_officer_estates: "Doctrine of the Officer Estates"
 ADISCORD_vorkerland_vad_doctrine_officer_estates_desc: "The best-led divisions in Vorkerland, and the fewest recruits behind them."
 ADISCORD_vorkerland_vad_doctrine_district_levies: "Doctrine of the District Levies"
 ADISCORD_vorkerland_vad_doctrine_district_levies_desc: "Rolls that fill quickly and regiments that learn slowly."
 ADISCORD_vorkerland_vad_march_on_the_capital: "March on the Old Capital"
 ADISCORD_vorkerland_vad_march_on_the_capital_desc: "Everything the staff was saving, committed to one axis."
 ADISCORD_vorkerland_tva_doctrine_continuous_assault: "Doctrine of Continuous Assault"
 ADISCORD_vorkerland_tva_doctrine_continuous_assault_desc: "The front run as a process, with no rest day in the schedule."
 ADISCORD_vorkerland_tva_doctrine_line_replacement:0 "Frontline Replenishment"
 ADISCORD_vorkerland_tva_doctrine_line_replacement_desc:0 "A weapon shipment goes directly to the units that requested it. Crews return to their positions sooner, but the rush wears down their equipment."
 ADISCORD_vorkerland_tva_doctrine_measured_front: "Doctrine of the Measured Front"
 ADISCORD_vorkerland_tva_doctrine_measured_front_desc: "An army that only advances where the measurement says it will hold."
 ADISCORD_vorkerland_tva_doctrine_fewer_better_crews:0 "Crew Coordination"
 ADISCORD_vorkerland_tva_doctrine_fewer_better_crews_desc:0 "Engineers and commanders establish a shared working procedure. The unit keeps its experience even when individual specialists are replaced."
 ADISCORD_vorkerland_tva_reserve_cadre_spent: "Reserve Cadre Spent"
 ADISCORD_vorkerland_tva_reserve_cadre_spent_desc: "The specialists held back since the beginning, issued to the line."
 ADISCORD_vorkerland_tva_technical_core_sealed: "Technical Core Sealed"
 ADISCORD_vorkerland_tva_technical_core_sealed_desc: "The people who know how it is built are not allowed near the front."
 WKR_commit_shopfloor_squadrons:0 "Council Aviation Workshops"
 WKR_commit_shopfloor_squadrons_desc:0 "The mechanics at the western airfields know that every sortie rests on hours of work on the ground. Railway councils can assemble repair crews and arrange spare parts from the neighbouring workshops."
 WKR_screen_the_interchange_sky:0 "Armoured Trains for the Main Lines"
 WKR_screen_the_interchange_sky_desc:0 "Drivers take their trains across open stretches where there is little shelter from air raids. Factory delegates propose armour around the locomotives and anti-aircraft posts on the wagons. Frontline supplies must survive an encounter with enemy aircraft."
 WKR_send_republican_volunteers: "Republican Volunteers"
 WKR_send_republican_volunteers_desc:0 "Other republics abroad have no one to offer them a hand. While our own fronts are quiet, volunteers can bind their fate to ours. Those who return will bring experience and friendships that no diplomatic correspondence could purchase."
 WKR_license_outside_patterns: "Licensed Patterns"
 WKR_license_outside_patterns_desc:0 "The republic need not invent every part anew. A foreign drawing becomes our tool when a machinist can explain it, reproduce it and correct it."
 VAD_task_the_guards_for_close_support:0 "Prepare Forward Airfields"
 VAD_task_the_guards_for_close_support_desc:0 "The flying units are falling behind the advancing columns. District engineers seek level ground beside the roads while local administrations gather workers for new runways. The air arm needs footholds beyond the reach of the capital's chancery."
 VAD_cover_the_district_capitals:0 "Organize District Air Defence"
 VAD_cover_the_district_capitals_desc:0 "Stations and workshops lose their cover whenever the aircraft leave for the front. District authorities propose permanent anti-aircraft positions around vital junctions. Defending the rear will become a regular duty of the local garrisons."
 VAD_issue_restoration_guarantees:0 "Guarantees to District Governments"
 VAD_issue_restoration_guarantees_desc:0 "The victors of local wars are reluctant to obey a new capital. The chancery must offer a treaty that district rulers and the common army command can both sign."
 VAD_seat_the_observer_missions:0 "Invite Military Observers"
 VAD_seat_the_observer_missions_desc:0 "Foreign officers see our war through embassy reports. Let them visit the headquarters and roads used by our commanders, then tell their governments about the country they have seen."
 TVA_print_unattended_strike_packages:0 "Network-Guided Strike Aviation"
 TVA_print_unattended_strike_packages_desc:0 "Air observers see the battle, but their reports grow stale before reaching the airfield. Worx's laboratories will combine them into a common stream for ground controllers. Pilots retain control of their aircraft, though people behind screens will increasingly determine their routes and the moment of attack."
 TVA_keep_the_interdictors_on_station:0 "Keep the Interceptors on Station"
 TVA_keep_the_interdictors_on_station_desc:0 "Power plants and switching stations serve the front every day. Patrol pairs will rotate above them while workshops prepare reserve aircraft and ground crews assemble the air picture. The directorate must preserve both its planes and the network that allows them to act together."
 ADISCORD_vorkerland_wkr_republican_volunteers: "Republican Volunteers"
 ADISCORD_vorkerland_wkr_republican_volunteers_desc:0 "Republican expeditions connect the workers councils to comrades abroad. Behind every detachment stand letters from families, requests for supplies and obligations to the host country."
 ADISCORD_vorkerland_wkr_licensed_patterns: "Licensed Patterns"
 ADISCORD_vorkerland_wkr_licensed_patterns_desc: "Drawings in, factory time out."
 ADISCORD_vorkerland_tva_unattended_strike:0 "Network-Guided Strike Aviation"
 ADISCORD_vorkerland_tva_unattended_strike_desc:0 "Air observers see the battle, but their reports grow stale before reaching the airfield. Worx's laboratories will combine them into a common stream for ground controllers. Pilots retain control of their aircraft, though people behind screens will increasingly determine their routes and the moment of attack."
 ADISCORD_vorkerland_tva_interdictor_station:0 "Keep the Interceptors on Station"
 ADISCORD_vorkerland_tva_interdictor_station_desc:0 "Power plants and switching stations serve the front every day. Patrol pairs will rotate above them while workshops prepare reserve aircraft and ground crews assemble the air picture. The directorate must preserve both its planes and the network that allows them to act together."
 ADISCORD_vorkerland_prewar_wrk_compact_course_tt: "The worker side has chosen the emergency compact course."
 ADISCORD_vorkerland_prewar_wrk_hardline_course_tt: "The worker side has chosen to mobilize loyal republics."
 ADISCORD_vorkerland_prewar_district_compact_course_tt: "The district administration chose an agreement with the centre."
 ADISCORD_vorkerland_prewar_district_hardline_course_tt: "The district administration chose independent mobilization."
 ADISCORD_vorkerland_tva_iteration_prerequisite_tt: "A field-trial package must already have been selected."

 WRK_joint_restore_civil_service:0 "Restore the Civil Service"
 WRK_joint_restore_civil_service_desc:0 "District offices will take economic duties back from field commands and return a wartime workshop to civilian production."
 WRK_joint_audit_district_arsenals:0 "Restore the District Arsenals"
 WRK_joint_audit_district_arsenals_desc:0 "Repair teams will recover weapons left in district depots. The first batch will return to the national stockpile; the remaining issue will follow the chosen reconstruction priority."
 WRK_joint_train_postwar_officers:0 "Train the Postwar Officer Corps"
 WRK_joint_train_postwar_officers_desc:0 "Joint command courses will examine the lessons of the civil war. Officers from different districts will learn common procedures for service in a regular army."
 WRK_joint_transfer_garrisons_to_civil_order:0 "Civil Administration Comes First"
 WRK_joint_transfer_garrisons_to_civil_order_desc:0 "Civil offices will take over routine duties, freeing staff officers for joint exercises."
 WRK_joint_inspect_remaining_arsenals:0 "The District Inspectorate Comes First"
 WRK_joint_inspect_remaining_arsenals_desc:0 "Inspectors will first finish the depot audit and return the remaining weapons to the national stockpile."
 WRK_joint_ratify_common_state_budget:0 "Ratify the Common State Budget"
 WRK_joint_ratify_common_state_budget_desc:0 "The chancery will bring civilian expenditure and army requirements into one budget."
 WRK_reconstruction_factory_site_tt:0 "A controlled core state has a free civilian factory slot"
 WRK_reconstruction_industry_bonus:0 "Technical Specialist School"
 WRK_west_reconstruction_ready_tt:0 "At least 180 days have passed since Vorkerland reunified"

 TVA_public_audit_programme:0 "Prepare a Public Reconstruction Report"
 TVA_public_audit_programme_desc:0 "District records disagree with the department heads. An editorial commission will read the original logs and publish its conclusions without seeking approval from the officials whose work it examines."
 TVA_public_audit_available_tt:0 "The independent wartime administration is active; the previous report no longer affects public confidence."
 TVA_public_audit_healthy_tt:0 "Network load is at most §Y50§! and the cadre reserve is at least §Y50§!."
 TVA_public_audit_programme_tt:0 "On publication, the commission assesses the §Ycurrent§! network. Load at most §Y50§! and cadre reserve at least §Y50§! grant §G+8%§! legitimacy and §G+3%§! stability for §Y70§! days. Otherwise: §R-4%§! legitimacy and §R-3%§! stability for §Y70§! days. An adverse report is published without refunding its price.\nCurrent assessment: [GetTVAPublicAuditAssessment]."
 TVA_public_audit_assessment_good:0 "§Gthe measurements support recovery§! (load [ROOT.TVA_network_load|2], reserve [ROOT.TVA_cadre_reserve|2])"
 TVA_public_audit_assessment_bad:0 "§Rthe measurements expose a crisis§! (load [ROOT.TVA_network_load|2], reserve [ROOT.TVA_cadre_reserve|2])"
 TVA_public_audit_success_tt:0 "Directorate legitimacy: §G+8%§!."
 TVA_public_audit_failure_tt:0 "Directorate legitimacy: §R-4%§!."
 TVA_public_audit_unlock_tt:0 "A public report strengthens confidence if the network and cadre reserve have recovered. Publishing adverse findings causes a crisis of confidence."
 TVA_research_conversion_programme:0 "Convert Laboratory Workshops to Arms Production"
 TVA_research_conversion_programme_desc:0 "The research buildings have machine tools, instruments and people who know how to use them. Military inspectors are ready to take over the workshops; department heads will have to shelve their experiments and surrender their benches to a new shift."
 TVA_research_conversion_available_tt:0 "The independent wartime administration is active; the laboratories have finished their previous conversion."
 TVA_research_conversion_programme_tt:0 "The paid specialists transfer to arms workshops. After delivery they remain in production; the laboratories take §Y70§! days to restore their research work."
 TVA_research_conversion_result_tt:0 "Network load: §R+15§! (capped at §Y100§!). Directorate legitimacy: §R-5%§!."
 TVA_research_conversion_unlock_tt:0 "Laboratory workshops can produce arms consignments at the cost of research time and additional network load."
 TVA_public_confidence:0 "Confidence in the Public Report"
 TVA_public_confidence_desc:0 "The original logs support the directorate's promises. District representatives accept the findings and demand continued access to future reports."
 TVA_public_accountability_crisis:0 "Public Accountability Crisis"
 TVA_public_accountability_crisis_desc:0 "The published records reveal how far departmental claims have drifted from conditions in the districts. The directorate has kept its promise of openness, but now faces uncomfortable questions."
 TVA_research_diversion:0 "Laboratories on Military Shifts"
 TVA_research_diversion_desc:0 "Research logs have been put away while the benches serve arms inspectors. Resuming experiments will require time and available workshops."
 ADISCORD_vorkerland_claimant.27.t:0 "The Figures Withstand Scrutiny"
 ADISCORD_vorkerland_claimant.27.d:0 "The public report was laid out before the district representatives. Its summary tables were followed by shift logs, repair records and rosters of active crews. This time the inspectors did not have to explain away every discrepancy: the network was working, and the workshops still had people able to replace those lost.\n\nThe speaker finished without the usual appeal to trust the directorate. One delegate asked that the documents remain in the reading room. Worx nodded. The promise of openness now had a consequence that would be harder to withdraw than to announce."
 ADISCORD_vorkerland_claimant.27.a:0 "Keep the records open."
 ADISCORD_vorkerland_claimant.28.t:0 "Uncomfortable Entries"
 ADISCORD_vorkerland_claimant.28.d:0 "The commission delivered its report without the corrections expected by department heads. In some districts the network could not bear its load; in others, shifts depended on the last available trained personnel. Behind the neat summary tables lay logs recording the same failures week after week.\n\nBefore the session, a secretary proposed delaying publication. Worx looked at the delegates already assembled and ordered the copies distributed. The promise had been kept. Now the hall was full of questions that a new reporting form could not answer."
 ADISCORD_vorkerland_claimant.28.a:0 "The answers will have to be substantive."
 ADISCORD_vorkerland_claimant.29.t:0 "Arms from Laboratory Benches"
 ADISCORD_vorkerland_claimant.29.d:0 "Military inspectors signed for the first consignment. Workshops that recently assembled experimental instruments are now sealing crates of weapons. The craftsmen have learned the new routine, and department heads can no longer reclaim them with a single order.\n\nUpstairs, locked rooms still hold unfinished experiments. The head of security asked when their seals could be removed. The answer was that the front had received its delivery, but the laboratories would take much longer to resume work. Those empty rooms did not appear in today's report."
 ADISCORD_vorkerland_claimant.29.a:0 "Send the delivery record to headquarters."
