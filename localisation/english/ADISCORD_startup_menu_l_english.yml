 ADISCORD_startup_guide_note:0 "Focus and decision tooltips show current prices, deadlines and requirements. This guide explains what to look for."
 ADISCORD_startup_paths_note:0 "§YCAMPAIGN DIRECTIONS§!\n\nSelect a path to read about it. Detailed requirements remain hidden until you reveal spoilers.\n\nReading a briefing does not select a political course."
 ADISCORD_startup_guide_budget:0 "§YCheck the budget first§!\n\nOpen the economy panel through the treasury indicator. Look beyond cash reserves to income, spending and debt: a large treasury does not guarantee a sustainable budget.\n\nKeep a reserve for national decisions. Treasury funds and political power are different resources; an operation may need both, as well as manpower and weapons. Read the full price before paying.\n\nAvoid spending every reserve on simultaneous projects. Account for current commitments and approaching story deadlines; paid preparation only helps if it can finish in time."
 ADISCORD_startup_guide_army:0 "§YSupply matters more than division count§!\n\nCheck equipment shortages in logistics, reinforcement of existing units and available manpower. New formations compete with the field army for real resources.\n\nMatch production lines to your division templates. Infantry equipment, support equipment and artillery must reach existing demand; extra recruitment plans do not create stockpiles.\n\nBefore advancing, check supply routes and railway capacity. Remote fronts and damaged hubs can halt even a well-equipped army.\n\nPromised, paid and already deployed formations are different things. Read their delivery conditions and identify the recipient."
 ADISCORD_startup_guide_diplomacy:0 "§YDiplomacy follows scripted routes§!\n\nWar declarations, alliance creation and joining an alliance are handled by the designated focuses, decisions and events. Ordinary diplomacy buttons cannot replace these actions.\n\nCheck what a focus actually unlocks: an immediate result, an offer to another country, or a separate paid decision. Receiving an offer does not mean a deal is settled. In Kefreyt\'s tree, the §GFOCUS TREE§! line names hidden focuses that the current focus can reveal. A yellow progression line means additional focuses or world conditions are still required.\n\nBefore choosing a side, read the peace and allied participation conditions. An external war may continue after an internal conflict ends.\n\nWatch active missions and deadlines: waiting for a convenient moment does not necessarily stop a political crisis."
