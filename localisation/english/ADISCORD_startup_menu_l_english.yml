 ADISCORD_startup_world_body:0 "§YHOW THE WORLD REACHED 2160§!\n\n§YThe Veyran era§!\nThe Veyran Empire long dominated Forul. Its monarchies relied on hereditary privilege, crown institutions and the army. Expansion created dependent territories, garrisons and roads linking them to the centre. The reactor project promised power for cities and industry, but the old authorities controlled access to new technology.\n\n§YThe catastrophe of 2130§!\nThe reactor's destruction left the surrounding industrial belt in ruins. People died, families lost contact, and survivors sought shelter underground. The First Revolution followed the catastrophe. It changed the country's political order without repairing the disaster's destruction.\n\n§YThe First Revolution§!\nThe Veyran monarchy was overthrown. The imperial court was dispersed, the crown administration dissolved, and the new republic took the name Vorkerland. Victory over the throne became the basis of its legitimacy.\n\nThe old system of government broke with the old regime. Army headquarters disputed authority with party committees, districts retained emergency powers, and purges left departments short of experienced staff. Compromise with opponents could readily be condemned as attempted restoration.\n\n§YA transition without an end date§!\nNikita Worker promised to hold the country together until the revolution and economic recovery were complete. A constitution and confederation were meant to reconcile the powers of the centre, autonomous republics and dependent administrations. Yet reconstruction became grounds for repeatedly postponing elections and extending emergency rule.\n\nThe republic imposed coercive uniformity: local languages and names were displaced from schools and registers, communities lost land, and people were resettled. Regime change did not resolve the conflict between state authority and the population's rights.\n\n§YThe economy after the upheavals§!\nThe continent retained reactors, aircraft, computing centres and arms factories. Advanced industry stood beside damaged roads and settlements reliant on a single working water source. Authority had to be sustained through deliveries, repairs and communications. The exhausted confederation increasingly replaced long-term projects with emergency measures, while local administrations kept resources for their own needs.\n\n§Y1 January 2160§!\nVorkerland still unites disparate territories, but their reports disagree on taxes, military obligations and valid decrees. Districts have their own administrations and troops, while reliable succession to central authority remains unsettled. The weakening of a state that shaped the continent for decades calls agreements and economic ties far beyond its borders into question. Forul enters a new era with this inheritance."
