 ADISCORD_science_development_1: "Lost Knowledge"
 ADISCORD_science_development_1_desc: "Scientific institutions have lost their staff or facilities. Surviving knowledge is used in isolation."
 ADISCORD_science_development_2: "Rebuilding Scientific Schools"
 ADISCORD_science_development_2_desc: "Scientists are rebuilding training and laboratories, but research remains limited."
 ADISCORD_science_development_3: "Scientific Institutes"
 ADISCORD_science_development_3_desc: "Working institutes sustain specialist training and regular research."
 ADISCORD_science_development_4: "Developed Research Network"
 ADISCORD_science_development_4_desc: "Laboratories and institutes share results and support major research programmes."
 ADISCORD_science_development_5: "Advanced Science"
 ADISCORD_science_development_5_desc: "Strong scientific schools can pursue advanced research and rapidly apply new knowledge."
