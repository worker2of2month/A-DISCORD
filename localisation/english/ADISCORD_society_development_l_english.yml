l_english:
 ADISCORD_society_development_1: "Fractured Society"
 ADISCORD_society_development_1_desc: "People distrust institutions, their neighbours and collective action. Political mobilisation is weak, public life is fragmented, and people survive as isolated individuals rather than as a united society."
 ADISCORD_society_development_2: "Weary Society"
 ADISCORD_society_development_2_desc: "Society still functions, but is exhausted, passive and politically numb. People can obey, work and survive, but rarely organise and have little faith in shared projects."
 ADISCORD_society_development_3: "Functioning Society"
 ADISCORD_society_development_3_desc: "A normal social structure with basic civic trust, public order and functioning institutions. This society can support reform, mobilisation and long-term projects, although its weaknesses remain visible."
 ADISCORD_society_development_4: "Cohesive Society"
 ADISCORD_society_development_4_desc: "Society has strong civic organisations, internal trust and collective discipline. Institutions can rely on the population, making national projects easier to carry out."
 ADISCORD_society_development_5: "Mobilised Society"
 ADISCORD_society_development_5_desc: "Society is capable of exceptional collective effort. The population can endure hardship, support sweeping reforms and mobilise for war or reconstruction, but excessive mobilisation puts pressure on individual freedoms."
 ADISCORD_social_system_development_1: "Collapsed Social Services"
 ADISCORD_social_system_development_1_desc: "Education, healthcare and social protection are broken or almost absent. Human capital is weak, social mobility is low, and the state cannot reliably protect its population."
 ADISCORD_social_system_development_2: "Basic Social Services"
 ADISCORD_social_system_development_2_desc: "The country has basic schools, primary healthcare and some social services, but quality is uneven and access too often depends on region, class or political connections."
 ADISCORD_social_system_development_3: "Functioning Social Services"
 ADISCORD_social_system_development_3_desc: "Education, healthcare and social support operate at an acceptable level. The state can train specialists, maintain public health and sustain a stable workforce."
 ADISCORD_social_system_development_4: "Developed Social Infrastructure"
 ADISCORD_social_system_development_4_desc: "Strong education, healthcare and social protection systems. Human capital is high, public services are reliable, and the country can support complex economic and military development."
 ADISCORD_social_system_development_5: "Welfare State"
 ADISCORD_social_system_development_5_desc: "An advanced social model with strong education, healthcare, social security and public services. The population is healthier, better educated and more productive, but maintaining this system requires resources and administrative capacity."
 ADISCORD_army_development_1: "Decaying Garrisons"
 ADISCORD_army_development_1_desc: "The army exists largely on paper. Units are poorly trained, logistics are weak, officers are corrupt or demoralised, and combat readiness is extremely low."
 ADISCORD_army_development_2: "Outdated Army"
 ADISCORD_army_development_2_desc: "The armed forces can hold basic positions, but their doctrine, equipment and training are outdated. The army may retain its traditions, but lacks modern integration."
 ADISCORD_army_development_3: "Functioning Armed Forces"
 ADISCORD_army_development_3_desc: "A regular army with functioning command structures, basic logistics, trained officers and adequate doctrine. It can fight a conventional war, but enjoys no substantial advantages."
 ADISCORD_army_development_4: "Professional Army"
 ADISCORD_army_development_4_desc: "A well-trained, disciplined army with competent officers, stronger logistics, high readiness and coherent doctrine. It can conduct complex operations."
 ADISCORD_army_development_5: "Integrated Military System"
 ADISCORD_army_development_5_desc: "An advanced army in which doctrine, logistics, industry, the officer corps and command systems work as a single mechanism. This level brings substantial military advantages, but should be difficult to achieve."
 ADISCORD_cultural_development_1: "Cultural Decay"
 ADISCORD_cultural_development_1_desc: "Social norms have deteriorated, cultural institutions are weak, and society is gripped by cynicism, escapism or destructive habits. People consume culture but produce little of it."
 ADISCORD_cultural_development_2: "Mass Consumer Culture"
 ADISCORD_cultural_development_2_desc: "Culture exists mainly as entertainment, consumption and spectacle. It can stabilise society in peacetime, but weakens discipline and long-term resilience."
 ADISCORD_cultural_development_3: "Civic Culture"
 ADISCORD_cultural_development_3_desc: "A balanced cultural environment with functioning schools, media, social norms and civic ethics. Society shares a language of legitimacy and responsibility."
 ADISCORD_cultural_development_4: "Disciplined Culture"
 ADISCORD_cultural_development_4_desc: "A strong cultural framework with high social discipline, serious institutions and a shared national or civic project. This strengthens cohesion, but can become rigid."
 ADISCORD_cultural_development_5: "Mobilising Culture"
 ADISCORD_cultural_development_5_desc: "Culture becomes a powerful force for mobilisation. Education, public ethics, art, media and institutions serve a major national project. This strengthens cohesion, but reduces pluralism and flexibility."
 ADISCORD_state_development_1: "Crumbling Administration"
 ADISCORD_state_development_1_desc: "The state barely functions. Orders are ignored, corruption dominates, taxes are poorly collected, and the government cannot reliably implement policy."
 ADISCORD_state_development_2: "State on Paper"
 ADISCORD_state_development_2_desc: "The state formally exists, with ministries, laws and procedures. But much of its administration is ineffective, captured by factions or dependent on informal networks."
 ADISCORD_state_development_3: "Functioning State"
 ADISCORD_state_development_3_desc: "A normal state administration. Bureaucracy, tax collection, law enforcement and administration function at a basic level. The country can implement policy, though not always efficiently."
 ADISCORD_state_development_4: "Effective Administration"
 ADISCORD_state_development_4_desc: "A competent state with a disciplined bureaucracy, reliable institutions and a strong ability to implement decisions. Reform, mobilisation and development projects become easier."
 ADISCORD_state_development_5: "Administrative Machine"
 ADISCORD_state_development_5_desc: "A highly effective state apparatus capable of rapid implementation, close coordination and extensive control over national resources. It is a powerful instrument, but can be bureaucratic and rigid."
 ADISCORD_economic_development_1: "Ruined Economy"
 ADISCORD_economic_development_1_desc: "Production chains are broken, markets distrust the state, and the economy relies on improvised deals and foreign handouts. The country can survive, but cannot grow with confidence."
 ADISCORD_economic_development_2: "Fragile Economy"
 ADISCORD_economic_development_2_desc: "The economy functions, but depends too heavily on particular ports, intermediaries, raw materials or political connections. Any serious crisis can quickly turn weakness into collapse."
 ADISCORD_economic_development_3: "Functioning Economy"
 ADISCORD_economic_development_3_desc: "A normal economy with functioning markets, basic industry, services and a clear financial environment. Growth is possible, but requires careful policy and investment."
 ADISCORD_economic_development_4: "Developed Economy"
 ADISCORD_economic_development_4_desc: "The economy has stable industry, quality services, predictable markets and the ability to support complex government projects."
 ADISCORD_economic_development_5: "Integrated Economy"
 ADISCORD_economic_development_5_desc: "Production, finance, trade and infrastructure form a powerful system. This economy can quickly support reform and war, but requires competent management."
