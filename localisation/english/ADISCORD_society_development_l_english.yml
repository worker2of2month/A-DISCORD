 ADISCORD_society_development_1_tt: "§YFractured Society§!\nPeople distrust institutions, their neighbours and collective action. They survive as isolated individuals rather than as a united society.\n\n§YEffects:§!\nStability: §R-6%§!\n§R-0.05§! £political_power_texticon"
 ADISCORD_society_development_2_tt: "§YWeary Society§!\nSociety still functions, but is exhausted, passive and politically numb.\n\n§YEffects:§!\nStability: §R-3%§!"
 ADISCORD_society_development_3_tt: "§YFunctioning Society§!\nBasic civic trust, public order and functioning institutions are in place.\n\n§YEffects:§!\nStability: §G+2%§!"
 ADISCORD_society_development_4_tt: "§YCohesive Society§!\nStrong civic organisations, internal trust and collective discipline support national projects.\n\n§YEffects:§!\nStability: §G+5%§!\n§G+0.03§! £political_power_texticon"
 ADISCORD_society_development_5_tt: "§YMobilised Society§!\nSociety is capable of exceptional collective effort, but excessive mobilisation puts pressure on individual freedoms.\n\n§YEffects:§!\nStability: §G+8%§!\nWar Support: §G+4%§!\n§G+0.05§! £political_power_texticon\nConsumer Goods Factories Factor: §R+2%§!"
 ADISCORD_social_system_development_1_tt: "§YCollapsed Social Services§!\nEducation, healthcare and social protection are broken or almost absent.\n\n§YEffects:§!\nResearch Speed: §R-5%§!\nStability: §R-2%§!\nConstruction Speed: §R-3%§!"
 ADISCORD_social_system_development_2_tt: "§YBasic Social Services§!\nBasic schools, primary healthcare and some services exist, but quality is uneven.\n\n§YEffects:§!\nResearch Speed: §R-2%§!"
 ADISCORD_social_system_development_3_tt: "§YFunctioning Social Services§!\nEducation, healthcare and social support operate at an acceptable level.\n\n§YEffects:§!\nResearch Speed: §G+1%§!\nStability: §G+1%§!"
 ADISCORD_social_system_development_4_tt: "§YDeveloped Social Infrastructure§!\nStrong education, healthcare and social protection systems improve human capital.\n\n§YEffects:§!\nResearch Speed: §G+4%§!\nConstruction Speed: §G+3%§!\nStability: §G+2%§!"
 ADISCORD_social_system_development_5_tt: "§YWelfare State§!\nAn advanced social model makes the population healthier, better educated and more productive, but requires resources.\n\n§YEffects:§!\nResearch Speed: §G+6%§!\nStability: §G+3%§!\nConstruction Speed: §G+4%§!\nConsumer Goods Factories Factor: §R+3%§!"
 ADISCORD_army_development_1_tt: "§YDecaying Garrisons§!\nThe army exists largely on paper, with poor training, weak logistics and low readiness.\n\n§YEffects:§!\nDivision Organization: §R-8%§!\nOrganization Recovery: §R-8%§!\nTraining Time: §R+12%§!\nCommand Power Gain: §R-0.05§!"
 ADISCORD_army_development_2_tt: "§YOutdated Army§!\nThe armed forces can hold positions, but their doctrine, equipment and training are outdated.\n\n§YEffects:§!\nDivision Organization: §R-4%§!\nOrganization Recovery: §R-4%§!\nTraining Time: §R+6%§!"
 ADISCORD_army_development_3_tt: "§YFunctioning Armed Forces§!\nFunctioning command structures, basic logistics and adequate doctrine.\n\n§YEffects:§!\nDivision Organization: §G+2%§!\nOrganization Recovery: §G+2%§!"
 ADISCORD_army_development_4_tt: "§YProfessional Army§!\nCompetent officers, better logistics, high readiness and coherent doctrine.\n\n§YEffects:§!\nDivision Organization: §G+5%§!\nOrganization Recovery: §G+5%§!\nTraining Time: §G-4%§!\nCommand Power Gain: §G+0.05§!"
 ADISCORD_army_development_5_tt: "§YIntegrated Military System§!\nDoctrine, logistics, industry, the officer corps and command work as one system.\n\n§YEffects:§!\nDivision Organization: §G+8%§!\nOrganization Recovery: §G+8%§!\nTraining Time: §G-6%§!\nCommand Power Gain: §G+0.10§!\nConsumer Goods Factories Factor: §R+2%§!"
 ADISCORD_cultural_development_1_tt: "§YCultural Decay§!\nSocial norms have deteriorated, cultural institutions are weak, and cynicism has become the common language.\n\n§YEffects:§!\nStability: §R-5%§!\nIdeology Drift Defence: §R-10%§!\n§R-0.03§! £political_power_texticon"
 ADISCORD_cultural_development_2_tt: "§YMass Consumer Culture§!\nCulture stabilises peaceful life through entertainment and spectacle, but weakens lasting discipline.\n\n§YEffects:§!\nStability: §R-2%§!\nWar Support: §R-2%§!"
 ADISCORD_cultural_development_3_tt: "§YCivic Culture§!\nFunctioning schools, media, social norms and basic civic ethics are in place.\n\n§YEffects:§!\nStability: §G+2%§!\nIdeology Drift Defence: §G+5%§!"
 ADISCORD_cultural_development_4_tt: "§YDisciplined Culture§!\nA strong cultural framework strengthens cohesion and encourages a more serious public outlook.\n\n§YEffects:§!\nStability: §G+4%§!\nIdeology Drift Defence: §G+10%§!\n§G+0.03§! £political_power_texticon"
 ADISCORD_cultural_development_5_tt: "§YMobilising Culture§!\nCulture becomes a force for mobilising a major national project, but reduces flexibility.\n\n§YEffects:§!\nStability: §G+6%§!\nWar Support: §G+4%§!\nIdeology Drift Defence: §G+15%§!\nResearch Speed: §R-1%§!"
 ADISCORD_state_development_1_tt: "§YCrumbling Administration§!\nOrders are ignored, corruption dominates, taxes are poorly collected, and policy goes unimplemented.\n\n§YEffects:§!\n§R-0.10§! £political_power_texticon\nConsumer Goods Factories Factor: §R+4%§!\nConstruction Speed: §R-5%§!"
 ADISCORD_state_development_2_tt: "§YState on Paper§!\nMinistries and procedures exist, but the administration is weak, fragmented and dependent on informal networks.\n\n§YEffects:§!\n§R-0.05§! £political_power_texticon\nConsumer Goods Factories Factor: §R+2%§!"
 ADISCORD_state_development_3_tt: "§YFunctioning State§!\nBureaucracy, tax collection, law enforcement and administration function at a basic level.\n\n§YEffects:§!\n§G+0.02§! £political_power_texticon\nConstruction Speed: §G+2%§!"
 ADISCORD_state_development_4_tt: "§YEffective Administration§!\nA disciplined bureaucracy and a strong ability to implement decisions accelerate reform.\n\n§YEffects:§!\n§G+0.06§! £political_power_texticon\nConsumer Goods Factories Factor: §G-2%§!\nConstruction Speed: §G+4%§!"
 ADISCORD_state_development_5_tt: "§YAdministrative Machine§!\nThe state apparatus can rapidly coordinate and exercise extensive control over national resources.\n\n§YEffects:§!\n§G+0.10§! £political_power_texticon\nConsumer Goods Factories Factor: §G-3%§!\nConstruction Speed: §G+6%§!\nStability: §R-1%§!"
 ADISCORD_economic_development_1_tt: "§YRuined Economy§!\nProduction chains are broken, markets distrust the state, and the economy relies on improvised deals.\n\n§YEffects:§!\nConsumer Goods Factories Factor: §R+5%§!\nConstruction Speed: §R-8%§!\nFactory Output: §R-5%§!"
 ADISCORD_economic_development_2_tt: "§YFragile Economy§!\nThe economy functions, but depends too heavily on particular ports, intermediaries, raw materials or political connections.\n\n§YEffects:§!\nConsumer Goods Factories Factor: §R+2%§!\nConstruction Speed: §R-3%§!"
 ADISCORD_economic_development_3_tt: "§YFunctioning Economy§!\nFunctioning markets, basic industry, services and a clear financial environment allow the country to operate normally.\n\n§YEffects:§!\nConstruction Speed: §G+2%§!\nFactory Output: §G+2%§!"
 ADISCORD_economic_development_4_tt: "§YDeveloped Economy§!\nStable industry, quality services and predictable markets support complex projects.\n\n§YEffects:§!\nConsumer Goods Factories Factor: §G-1%§!\nConstruction Speed: §G+4%§!\nFactory Output: §G+4%§!"
 ADISCORD_economic_development_5_tt: "§YIntegrated Economy§!\nProduction, finance, trade and infrastructure form a powerful system for growth and mobilisation.\n\n§YEffects:§!\nConsumer Goods Factories Factor: §G-2%§!\nConstruction Speed: §G+6%§!\nFactory Output: §G+6%§!\nResearch Speed: §G+2%§!"
