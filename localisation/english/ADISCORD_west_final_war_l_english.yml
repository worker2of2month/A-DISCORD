 ADISCORD_west_lean_subject:0 "§gsubject state§!"
 ADISCORD_west_lean_wrk_ally:0 "§Y[?ADISCORD_west_lean|+0]§!, ready to stand with Vorkerland"
 ADISCORD_west_lean_ivn_ally:0 "§Y[?ADISCORD_west_lean|+0]§!, ready to stand with Itora"
 ADISCORD_west_lean_wrk_tilt:0 "§Y[?ADISCORD_west_lean|+0]§!, leans to Vorkerland"
 ADISCORD_west_lean_ivn_tilt:0 "§Y[?ADISCORD_west_lean|+0]§!, leans to Itora"
 ADISCORD_west_lean_undecided:0 "§Y[?ADISCORD_west_lean|+0]§!, undecided"
 ADISCORD_west_send_envoys:0 "Send an Embassy"
 ADISCORD_west_send_envoys_desc:0 "Envoys promise protection, trade and a place in the West's future order. Each mission shifts the mood of the government and the street a little."
 ADISCORD_west_send_envoys_tt:0 "[From.GetName]'s lean shifts toward us by §Y[?ROOT.ADISCORD_west_influence_power|0]§!."
 ADISCORD_west_ship_arms:0 "Ship Arms"
 ADISCORD_west_ship_arms_desc:0 "Rifles from our depots persuade better than speeches. The recipient will remember who armed its garrisons."
 ADISCORD_west_ship_arms_tt:0 "We hand §Y9000§! £infantry_equipment_texticon from our stockpile to [From.GetName]. [From.GetName]'s lean shifts toward us by §Y[?ROOT.ADISCORD_west_influence_power|0]§! plus §Y5§!."
 ADISCORD_west_ship_arms_stock_tt:0 "At least §Y9000§! £infantry_equipment_texticon are in stock"
 ADISCORD_west_ally_lean_tt:0 "The country leans toward us by at least §Y50§!"
 ADISCORD_west_ivn_league_command_tt:0 "Itora belongs to no foreign faction"
 ADISCORD_west_ivn_offer_league:0 "Invite to the League"
 ADISCORD_west_ivn_offer_league_desc:0 "Itora offers a neighbour a place in the League of Free Republics: mutual defence, the common hospital of the marches and a voice in the future settlement. The answer remains the neighbour's own."
 ADISCORD_west_ivn_offer_league_tt:0 "[From.GetName] will receive an invitation to the §YLeague of Free Republics§! and will answer itself. Acceptance binds the country to Itora in the war for the West. Western pressure on acceptance: §Y+10§!."
 ADISCORD_west_call_to_arms:0 "Call to Arms"
 ADISCORD_west_call_to_arms_desc:0 "Our neighbour's non-alignment no longer withstands the pressure of the war. We ask it to stand with us while the outcome is still open."
 ADISCORD_west_call_to_arms_tt:0 "[From.GetName] will receive a call to enter the war on our side and will answer itself."
 ADISCORD_west_neutrality_tt:0 "The country stays neutral: it makes peace with both sides and is not subject to the final settlement. At a lean of §Y±20§! or beyond it lets the troops of the claimant it leans to pass through its land."
 ADISCORD_west_call_accept_tt:0 "The country enters the war for the West on the calling claimant's side."
 ADISCORD_west_call_refuse_tt:0 "The country remains neutral."
 ADISCORD_west.10.c:0 "Remain neutral."
 ADISCORD_west.46.t:0 "Call to Arms"
 ADISCORD_west.46.d:0 "[From.GetName] asks us to give up non-alignment and stand with it in the war for the West. Its envoys recall the deliveries and promises of recent months.\n\nOur lean: §Y[?ADISCORD_west_lean|+0]§!."
 ADISCORD_west.46.a:0 "We march."
 ADISCORD_west.46.b:0 "We stay out of the war."
 ADISCORD_west.47.t:0 "A New Ally"
 ADISCORD_west.47.d:0 "[From.GetName] gives up non-alignment and enters the war for the West on our side."
 ADISCORD_west.47.a:0 "Welcome to the front."
 ADISCORD_west.48.t:0 "Call Refused"
 ADISCORD_west.48.d:0 "[From.GetName] stays out of the war for the West."
 ADISCORD_west.48.a:0 "We will see how long that lasts."

 ADISCORD_west_free_republics_lean_tt:0 "The lean of [ROM.GetName] and [TRU.GetName] shifts toward Vorkerland by §Y30§!."

# Itoran courses
 ADISCORD_west_ivn_humanitarian_convoys:0 "Humanitarian Convoys"
 ADISCORD_west_ivn_humanitarian_convoys_desc:0 "The hospital columns of the marches carry medicine and food to the neighbours. The gratitude of people is stronger than envoys' speeches."
 ADISCORD_west_ivn_humanitarian_convoys_tt:0 "[From.GetName]'s lean shifts toward Itora by §Y[?ROOT.ADISCORD_west_influence_power|0]§! plus §Y10§!."
 ADISCORD_west_ivn_ultimatum:0 "Ultimatum to a Neighbour"
 ADISCORD_west_ivn_ultimatum_desc:0 "The emergency committee demands that a neighbour recognise the protectorate of the marches. The threat works quickly but brings the great war closer."
 ADISCORD_west_ivn_ultimatum_tt:0 "[From.GetName]'s lean shifts toward Itora by §Y25§!. Before the war begins, western pressure grows by §Y10§!."

# Revanche course
 ADISCORD_west_ivn_revanche_legion:0 "Marches Legion"
 ADISCORD_west_ivn_revanche_legion_desc:0 "The veterans of the revolt march ahead of the army. They fight for revanche, not for order, and do not count losses."
 ADISCORD_west.1.d_ivn_revanche:0 "General Karn promised the march regiments revanche, and the legion follows him. The northern expedition retreated before Vorkerland; now Itora returns, without the humanists and without the cabinet.\n\nVictory must make Vorkerland part of the marches."
 ADISCORD_west.31.d_ivn_revanche:0 "The Marches Legion has completed its revanche. Vorkerland and its allies are annexed to Itora, and the northern corridor has become an inner road of the marches.\n\nThe West is one country."

