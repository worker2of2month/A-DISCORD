 ADISCORD_west_ivn_faction: "League of Free Republics"
 autonomy_WRK_confederate_republic: "Confederate Republic"
 autonomy_WRK_technical_trusteeship: "Technical Trusteeship"
 autonomy_IVN_guaranteed_confederation: "Guaranteed Confederation"
 autonomy_IVN_emergency_trusteeship: "Emergency Trusteeship"

 ADISCORD_west_final_war_category: "War for the West"
 ADISCORD_west_final_war_category_desc: "Western reckoning: §Y[?global.ADISCORD_west_crisis|0]§! / 100.\n\n[ADISCORDWestStatus]"
 ADISCORD_west_status_crisis: "After the 180-day reconstruction period, monthly pressure resumes. Each month of reunified Vorkerland adds §Y5§!; western focuses of both powers and each entry into the League of Free Republics add §Y10§!. At §Y100§! Vorkerland starts the war for the West. Either claimant's final focus may start it earlier.\n\nNo one will stay out of the war: Rimat, Norvane, Krait, the corridor districts and the free republics will take a side."
 ADISCORD_west_status_war: "The war for the West is under way. Peace without a victor is impossible. The war ends with a claimant's capitulation, or after §Y720§! days by points. A side scores one point for each northern corridor district it holds and for each piece of enemy home ground it occupies: the Old March and the Itoran frontier, or Vorkerland's Central District. Holding one's own land scores nothing; the defending side wins a tie."
 ADISCORD_west_status_no_rival: "Vorkerland has no western rival left. At the start of next month it will be recognised as suzerain of the West."
 ADISCORD_west_status_resolved: "The war for the West is over. The region has one suzerain."
 ADISCORD_west_status_closed: "The western question opens once a claimant reunifies Vorkerland."
 ADISCORD_west_join_wrk_tt: "The country joins the §YConfederate Front§! or fights on Vorkerland's side until the final settlement."
 ADISCORD_west_join_ivn_tt: "The country joins the §YLeague of Free Republics§! or fights on Itora's side until the final settlement."
 ADISCORD_west_league_accept_tt: "The country joins the §YLeague of Free Republics§!. Western reckoning: §Y+10§!."
 ADISCORD_west_league_refuse_tt: "The country stays outside the alliance. In the war for the West it will choose a side or stay out of the war by its lean."

 ADISCORD_west_wrk_solidarity_committees: "Solidarity Committees"
 ADISCORD_west_wrk_solidarity_committees_desc: "The confederation's workers' committees march for a mandate, not for plunder. They promise Itora a place in the common house and hold harder than its generals expected."
 ADISCORD_west_wrk_imperial_columns: "Imperial Columns"
 ADISCORD_west_wrk_imperial_columns_desc: "Petrichev reclaims the marches the way he gathered the districts: by columns, orders and deadlines. The empire is in a hurry, and the rear pays for it."
 ADISCORD_west_wrk_engineer_battalions: "Engineer Battalions"
 ADISCORD_west_wrk_engineer_battalions_desc: "The Worx directorate wages war like a construction site: roads, bridges and depots move ahead of the divisions, and every captured station joins the common plan at once."
 ADISCORD_west_ivn_humanist_shield: "Humanist Shield"
 ADISCORD_west_ivn_humanist_shield_desc: "Itora defends not a border but the people behind it. Hospitals, shelters and the march militia hold the ground the army promised never to give up."
 ADISCORD_west_ivn_emergency_order: "Emergency Order"
 ADISCORD_west_ivn_emergency_order_desc: "The committee has suspended elections and put the marches on a war footing. Itora marches west before Vorkerland comes to it."
 ADISCORD_west_ivn_committee_line: "Committee Line"
 ADISCORD_west_ivn_committee_line_desc: "The committee never chose a course, but the frontier garrisons know their task: hold the Old March."
 ADISCORD_west_wrk_corridor_push: "Corridor Offensive"
 ADISCORD_west_wrk_corridor_push_desc: "The confederation's reserves are thrown at the northern corridor."
 ADISCORD_west_ivn_march_defence: "Defence of the Marches"
 ADISCORD_west_ivn_march_defence_desc: "The marches dig in and do not retreat without orders."

 ADISCORD_west_wrk_corridor_offensive: "Corridor Offensive"
 ADISCORD_west_wrk_corridor_offensive_desc: "The confederation gathers its reserves for a blow at the northern corridor."
 ADISCORD_west_ivn_hold_the_marches: "Hold the Marches"
 ADISCORD_west_ivn_hold_the_marches_desc: "The committee puts the frontier marches into all-round defence."

 ADISCORD_west.1.t: "The West Cannot Be Shared"
 ADISCORD_west.1.d_wrk_worker: "The confederate congress offered Itora what the returning districts received: a place in the common house, its own government and a voice in the council of republics. The Itoran committee answered that it needs no one else's house.\n\nThe solidarity committees march to the Norvane corridor. If the mandate wins, Itora will remain Itora - but as a member of the confederation."
 ADISCORD_west.1.d_wrk_joint: "Vlad Petrichev recognises neither Itora's borders nor its committee. The marches once paid taxes to Vorkerland, and the empire means to take them back entirely.\n\nThe imperial columns march on the corridor. This war will not end with a subject: the defeated will become provinces."
 ADISCORD_west.1.d_wrk_utilitarian: "The Worx directorate has costed the corridor: every station, bridge and depot outside a common plan costs the West more than a war.\n\nThe engineer battalions move ahead of the divisions. Itora's frontier must join the common network, and its industry must work under technical trusteeship."
 ADISCORD_west.1.d_ivn_shield: "The Itoran committee promised to protect people, not lines on a map. Now war tests that promise: Rimat, Norvane and the free republics watch whether Itora can hold the corridor.\n\nThe humanist shield is raised. If it holds, Vorkerland will keep its government - under an Itoran guarantee."
 ADISCORD_west.1.d_ivn_emergency: "The emergency committee did not wait for Vorkerland's columns to reach the Old March. Elections are suspended, the marches mobilised and the Norvane corridor declared the first objective.\n\nIf the march succeeds, Vorkerland will pass under Itoran emergency trusteeship."
 ADISCORD_west.1.d_ivn_committee: "The Itoran committee never chose a course, but Vorkerland did not wait for its decision. The march garrisons take up their positions.\n\nOnly one suzerain will remain in the West."
 ADISCORD_west.1.a: "The West will be one."
 ADISCORD_west.2.t: "The War for the West"
 ADISCORD_west.2.d: "Reunified Vorkerland and Itora have entered open war. The northern corridor, recently divided among the districts of the civil war, has become the only road between the two powers.\n\nRimat, Norvane, Krait, the corridor districts and the free republics are choosing sides. No one in the West stays out."
 ADISCORD_west.2.a: "The corridor will decide everything."
 ADISCORD_west.3.t: "A Shadow over the Corridor"
 ADISCORD_west.3.d: "Reunified Vorkerland is moving its headquarters to the northern corridor, and Itora is fortifying the marches. Diplomats on both sides still speak of peace, but the depots fill faster than the talks progress.\n\nObservers agree on one thing: the West will not stay divided for long."
 ADISCORD_west.3.a: "It is a matter of time."
 ADISCORD_west.10.t: "War at Our Borders"
 ADISCORD_west.10.d: "Vorkerland and Itora are at war for the West. Our roads and stations lie between the fronts, and both sides await our answer. We may stand with one of them, or stay out of the war and let only the one we trust more pass through our land.\n\nOur lean: §Y[?ADISCORD_west_lean|+0]§! (plus toward Vorkerland, minus toward Itora)."
 ADISCORD_west.10.a: "With Vorkerland."
 ADISCORD_west.10.b: "With Itora."
 ADISCORD_west.31.t_wrk: "Vorkerland Is Suzerain of the West"
 ADISCORD_west.31.t_ivn: "Itora Is Suzerain of the West"
 ADISCORD_west.31.d_wrk_unopposed: "Itora can no longer contest the primacy of reunified Vorkerland. The western question is closed without a final war.\n\nThe confederation once again speaks for the whole West."
 ADISCORD_west.31.d_wrk_worker: "The confederate mandate has won. Itora and its allies have entered the common house as confederate republics: they keep their governments, but their armies and foreign policy answer to the council of republics.\n\nNikita Worker calls it not a conquest but a homecoming."
 ADISCORD_west.31.d_wrk_joint: "Peace has been signed with Vorkerland. Itora and its allies retain their local institutions under Vorkerland military administrations. The first commandants have reached the western marches."
 ADISCORD_west.31.d_wrk_utilitarian: "The Worx directorate has drawn the new border on an engineering map. Itora's frontier is joined to the common network, and Itora itself works under technical trusteeship.\n\nThe West is united not by a flag but by a plan."
 ADISCORD_west.31.d_ivn_shield: "The humanist shield has held. The northern corridor has passed to Itora, and Vorkerland keeps its government as a confederation under Itoran guarantee.\n\nThe Itoran committee promises that this guarantee protects people rather than dictating their laws."
 ADISCORD_west.31.d_ivn_emergency: "The emergency march has ended in victory. The corridor is annexed to Itora, and Vorkerland is placed under the emergency trusteeship of its commissioners.\n\nYesterday's besieged republic has become master of the West."
 ADISCORD_west.31.d_ivn_committee: "Itora held the marches and forced Vorkerland to admit defeat. The northern corridor has passed to it, and Vorkerland has become its subject.\n\nThe West has one suzerain."
 ADISCORD_west.31.t_truce: "Truce in the West"
 ADISCORD_west.31.d_truce: "The war for the West has given neither side the advantage. Neither Vorkerland nor Itora holds more of the enemy's land than it has lost, and the general staffs have signed a truce along the line of contact.\n\nBoth governments remain in power, but the western question is unanswered: the West has no suzerain, and the corridor still divides two armies."
 ADISCORD_west.31.a: "The West is one."
 ADISCORD_west.31.b: "The West remains divided."
 ADISCORD_west.40.t: "Invitation to the League"
 ADISCORD_west.40.d: "Itora invites us to join the League of Free Republics. The committee promises protection from Vorkerland and recognition of our government.\n\nJoining will bind us to Itora in the coming war for the West. Refusing will leave us alone between two powers."
 ADISCORD_west.40.a: "Join the League."
 ADISCORD_west.40.b: "Keep our independence."
 ADISCORD_west.41.t: "The League Grows"
 ADISCORD_west.41.d: "[From.GetName] joins the League of Free Republics."
 ADISCORD_west.41.a: "Another shield."
 ADISCORD_west.42.t: "The League Refused"
 ADISCORD_west.42.d: "[From.GetName] declines the invitation to the League of Free Republics."
 ADISCORD_west.42.a: "Their choice."
 ADISCORD_west_status_reconstruction:0 "A §Y180-day reconstruction period§! follows Vorkerland's reunification. Neither champion may start the War for the West, and monthly pressure is suspended. Focuses and League membership still add pressure. Monthly growth resumes and final war focuses become available after this period."
 ADISCORD_west_wrk_offer_front_treaty: "Offer a Treaty on the West"
 ADISCORD_west_wrk_offer_front_treaty_desc: "Vorkerland will not wait while Itora gathers the whole West into its League. Envoys offer a neighbour a place in the Confederate Front: common defence, supplies and a voice in the future settlement. The answer remains the neighbour's own."
 ADISCORD_west_wrk_offer_front_treaty_tt: "[From.GetName] will receive an offer to join the §YConfederate Front§! and will answer itself. Acceptance binds the country to Vorkerland in the war for the West. Western pressure on acceptance: §Y+10§!."
 ADISCORD_west_wrk_front_command_tt: "Vorkerland is not a member of another faction"
 ADISCORD_west_wrk_treaty_target_tt: "The country is independent, outside any faction, not at war with anyone, not weighing another offer, and the war for the West has not begun"
 ADISCORD_west_front_accept_tt: "The country joins the §YConfederate Front§!. Western pressure: §Y+10§!."
 ADISCORD_west_front_refuse_tt: "The country stays outside the alliance. In the war for the West it will choose a side or stay out of the war by its lean."
 ADISCORD_west.43.t: "A Treaty on the West"
 ADISCORD_west.43.d: "Envoys from [From.GetName] have brought a draft treaty. Vorkerland offers us a place in the Confederate Front: common defence of the corridor, supplies for our garrisons and a voice in the future settlement of the West.\n\nSigning binds us to Vorkerland in the war against Itora. Refusing keeps our freedom but will not keep us out of the war: when it begins, we will still have to choose."
 ADISCORD_west.43.a: "Sign the treaty."
 ADISCORD_west.43.b: "Turn the envoys away."
 ADISCORD_west.44.t: "The Front Grows"
 ADISCORD_west.44.d: "[From.GetName] signs the treaty and joins the Confederate Front."
 ADISCORD_west.44.a: "Another stretch of the corridor."
 ADISCORD_west.45.t: "The Treaty Refused"
 ADISCORD_west.45.d: "[From.GetName] declines to sign the treaty on the West."
 ADISCORD_west.45.a: "We will remember."

# Influence over the western states
