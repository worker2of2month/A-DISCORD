l_english:
 autonomy_STP_provisional_administration:0 "Stelander Provisional Administration"

 STP_pc_heg_administrations:0 "Administrations of the Hegemony"
 STP_pc_heg_administrations_desc:0 "The Hegemony needs more than occupied maps. Defeated governments can be reorganised into temporary administrations that retain their own territories. A separate programme will integrate neighbouring regions directly owned by Steland."
 STP_pc_heg_final_north:0 "Break the Northern Ring"
 STP_pc_heg_final_north_desc:0 "Independent power in the north has become incompatible with Steland's claim to regional primacy. Nodrul, Yubor and the Frontier will be forced into the new order if they have not already submitted."
 STP_pc_heg_final_kefreyt:0 "The Last Contract"
 STP_pc_heg_final_kefreyt_desc:0 "After the northern campaign, an independent Kefreyt may still contest the regional order. The Last Contract means war to impose its submission if an earlier campaign has not settled the issue. A limited peace preserving its independence does not end the struggle for hegemony."

 STP_heg_nationalisation_unlock_tt:0 "The Hegemony route can use the existing repeatable regional nationalisation programme."
 STP_heg_administration_unlock_tt:0 "Unlocks provisional administrations for defeated §YNodrul§!, §YYubor§!, §Ythe Frontier§! and §YKefreyt§!."
 STP_heg_northern_war_tt:0 "Begins the final northern campaign against independent §YNodrul§!, §YYubor§! and §Ythe Frontier§!. Governments already subordinated to Steland are not attacked again."
 STP_heg_northern_resolved_tt:0 "The northern stage is completed or bypassed; Steland is at peace with Nodrul, Yubor, the Frontier and Kefreyt."
 STP_heg_kefreyt_war_tt:0 "Begins the final war to subjugate independent §YKefreyt§!. Victory establishes a Stelander provisional administration."

 STP_hegemony_administration:0 "Hegemonic Administration"
 STP_hegemony_administration_desc:0 "The Hegemony preserves defeated countries as dependent administrations with their own territories and governments."

 STP_heg_establish_nod_administration:0 "Establish the Nodrul Provisional Administration"
 STP_heg_establish_nod_administration_desc:0 "Replace the defeated Nodrul government with a temporary administration subordinate to Steland."

 STP_heg_establish_ypr_administration:0 "Establish the Yubor Provisional Administration"
 STP_heg_establish_ypr_administration_desc:0 "Replace the defeated Yubor government with a temporary administration subordinate to Steland."

 STP_heg_establish_tff_administration:0 "Establish the Frontier Provisional Administration"
 STP_heg_establish_tff_administration_desc:0 "Replace the defeated Frontier government with a temporary administration subordinate to Steland."

 STP_heg_establish_val_administration:0 "Establish the Kefreyt Provisional Administration"
 STP_heg_establish_val_administration_desc:0 "Replace the defeated Kefreyt government with a temporary administration subordinate to Steland."
 STP_pc_heg_frontier_ain: "Ainholm under Frontier Administration"
 STP_pc_heg_frontier_ain_desc: "An independent Ainholm remains outside the order we have established. Its lands can be placed under our dependent Frontier government instead of creating another separate administration. This requires a military campaign: the new arrangement begins with victory, not a signature on a map."
 STP_pc_heg_frontier_cof: "The Forest Lands of the Frontier"
 STP_pc_heg_frontier_cof_desc: "The rule of the Children of the Forest has no place within our system of dependent administrations. A campaign against the cult would expand the Frontier and entrust its government with the conquered lands. The Frontier must take part in the war whose outcome it will benefit from."
 STP_heg_frontier_ain_war_tt: "Declares war on independent Ainholm and brings our Frontier subject into the same war on our side. Victory over Ainholm transfers its lands to the Frontier, provided it remains our subject and has not capitulated."
 STP_heg_frontier_cof_war_tt: "Declares war on the independent Cult of the Children of the Forest and brings our Frontier subject into the same war on our side. Victory over the cult transfers its lands to the Frontier, provided it remains our subject and has not capitulated."

 NKA_STS_administration:0 "Northern Military Administration"
 NKA_STS_administration_DEF:0 "the Northern Military Administration"
 NKA_STS_administration_ADJ:0 "Northern"
 STP_pc_heg_northern_administration:0 "Unified Northern Administration"
 STP_pc_heg_northern_administration_desc:0 "With Kefreyt subordinated, the northern border needs its own administration. Irim and Erstantpeo will provide its rear base, with roads leading to Antolla, Farein and Himber and onward into cannibal territory. A single military administration will replace the separate dependent governments. Subordinated cannibal territories will join it without another campaign; independent states will remain beyond its borders until defeated."
 STP_heg_northern_administration_tt:0 "Creates a dependent §YNorthern Military Administration§! with its own leader. Transfers §YIrim§!, §YErstantpeo§! and already subordinated cannibal territories to it. Independent countries and foreign occupations are excluded. Cannibal subjects without outside holdings merge while retaining their troops."
 STP_pc_heg_cannibal_campaign:0 "Close the Cannibal Frontier"
 STP_pc_heg_cannibal_campaign_desc:0 "Unified administration cannot stop raids while independent cannibal states remain across the border. The northern administration will support a common campaign and receive the defeated territories, giving border garrisons a single supply network."
 STP_heg_cannibal_campaign_tt:0 "Starts a shared war against the remaining independent states of §Y$CIN$§!, §Y$OSF$§! and §Y$APH$§!. Defeated countries join the §YNorthern Military Administration§!. Existing subjects and absent countries are skipped. The focus is bypassed when no independent targets remain."
