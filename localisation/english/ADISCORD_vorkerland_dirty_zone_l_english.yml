l_english:
 ADISCORD_vorkerland_dirty_zone.1.t: "News Is Coming Out of the Dirty Zone Again"
 ADISCORD_vorkerland_dirty_zone.1.d: "For the first time in years, reports that can actually be verified are coming out from behind the Dirty Zone perimeter. Old roads are reopening, communication lines long thought dead are working again, and the borders of local administrations are appearing on maps. The territory outsiders had written off as a contaminated wasteland turns out to be inhabited, with its own governments and its own wars. Neighbouring states are now trying to work out who they will have to deal with."
 ADISCORD_vorkerland_dirty_zone.1.a: "The Zone turns out to be inhabited."

 ADISCORD_debug_open_vorkerland_dirty_zone: "§RDEBUG:§! Open the Dirty Zone"
 ADISCORD_debug_open_vorkerland_dirty_zone_desc: "Skips the three-year wait and launches the normal Dirty Zone reveal."
