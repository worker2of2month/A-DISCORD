 FE_DIFFICULTY: "Difficulty"
 FE_DIFFICULTY_VERY_EASY:0 "Respite"
 FE_DIFFICULTY_VERY_EASY_TOOLTIP:0 "§YVery easy difficulty§!\nFor discovering the world and stories of Abyss of Discord.\n\nYour industry equips the army faster, construction and research progress more quickly, and political choices are easier to afford. Troops need fewer supplies and can operate without them for longer. AI countries receive no industrial or research bonuses.\n\nDuring war or an approaching threat, AI countries aim to recruit smaller armies while retaining their normal replacement policies."
 FE_DIFFICULTY_EASY:0 "Spark"
 FE_DIFFICULTY_EASY_TOOLTIP:0 "§YEasy difficulty§!\nFor learning new countries and their mechanics.\n\nModest assistance with production, construction, research and political power leaves more room for mistakes. Supply is slightly more forgiving. AI countries receive no industrial or research bonuses.\n\nDuring war or an approaching threat, AI countries moderately reduce their desired army size."
 FE_DIFFICULTY_NORMAL:0 "Discord"
 FE_DIFFICULTY_NORMAL_TOOLTIP:0 "§YNormal difficulty§!\nThe baseline balance of Abyss of Discord.\n\nThe player and AI receive the same difficulty modifiers. Your country, political course and preparations for war determine the outcome of the campaign.\n\nAI countries use their normal recruitment, production and campaign preparation plans."
 FE_DIFFICULTY_HARD:0 "Rift"
 FE_DIFFICULTY_HARD_TOOLTIP:0 "§YHard difficulty§!\nFor players familiar with the campaign who want stronger opponents.\n\nAll AI-controlled countries build, research and produce equipment faster. Their production gains efficiency more quickly, and their armies need fewer supplies and less fuel. The player retains normal capabilities.\n\nDuring war or an approaching threat, AI countries put more emphasis on army expansion, equipment reserves and military construction. Extra recruitment requires spare manpower, equipment and a healthy budget. Countries also use production and supply priorities tailored to their campaigns."
 FE_DIFFICULTY_VERY_HARD:0 "Abyss"
 FE_DIFFICULTY_VERY_HARD_TOOLTIP:0 "§RVery hard difficulty§!\nFor experienced players prepared for a prolonged struggle to survive.\n\nAll AI-controlled countries receive major industrial and research bonuses, expand equipment production more quickly, and use supplies and fuel more efficiently. The player retains normal capabilities. Preparation and manoeuvre will be essential.\n\nDuring war or an approaching threat, AI countries pursue larger armies, equipment reserves and military industry more strongly. Extra recruitment remains limited by manpower, equipment, current training and the budget. Countries use preparation priorities tailored to their campaigns.\n\nThe AI weighs relative army strength when concentrating forces, prioritises enemy capitals and reduces the appeal of heavily fortified states. In scripted wars, tactics adapt within the current phase: equipped forces with an advantage favour selective attacks, while equipment shortages or a stronger opponent favour careful execution. War objectives, mandatory defensive phases and regrouping periods remain in force."
 FE_DIFFICULTY_UNKNOWN: "Secret Difficulty"
