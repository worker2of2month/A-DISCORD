 LOADING_TIP_0: "'War is nothing but the continuation of state policy by other means.'\n- Carl von Clausewitz, On War"
 LOADING_TIP_1: "'Everything in war is very simple, but the simplest thing is difficult.'\n- Carl von Clausewitz, On War"
 LOADING_TIP_2: "'War is the realm of uncertainty: three quarters of the factors on which action depends are hidden in fog.'\n- Carl von Clausewitz, On War"
 LOADING_TIP_3: "'All warfare is based on deception.'\n- Sun Tzu, The Art of War"
 LOADING_TIP_4: "'The supreme art of war is to break the enemy's resistance without fighting.'\n- Sun Tzu, The Art of War"
 LOADING_TIP_5: "'If you know the enemy and know yourself, you need not fear the result of a hundred battles.'\n- Sun Tzu, The Art of War"
 LOADING_TIP_6: "'There is no instance of a country benefiting from prolonged warfare.'\n- Sun Tzu, The Art of War"
 LOADING_TIP_7: "'Attack where the enemy is unprepared; appear where you are not expected.'\n- Sun Tzu, The Art of War"
 LOADING_TIP_8: "'It is much safer to be feared than loved, if one must choose between the two.'\n- Niccolo Machiavelli, The Prince"
 LOADING_TIP_9: "'All armed prophets have conquered, and all unarmed prophets have perished.'\n- Niccolo Machiavelli, The Prince"
 LOADING_TIP_10: "'He who abandons what is done for what ought to be done prepares his ruin rather than his preservation.'\n- Niccolo Machiavelli, The Prince"
 LOADING_TIP_11: "'A prince must be a fox to avoid traps and a lion to frighten wolves.'\n- Niccolo Machiavelli, The Prince"
 LOADING_TIP_12: "'An injury must be inflicted in such a way that there is no fear of revenge.'\n- Niccolo Machiavelli, The Prince"
 LOADING_TIP_13: "'While men live without a common power to keep them all in awe, they are in a state of war of every man against every man.'\n- Thomas Hobbes, Leviathan"
