l_english:
 VAL_Equal_Powers_Pact:0 "A Pact of Equal Powers"
 VAL_Equal_Powers_Pact_desc:0 "Recognition ended the immediate dispute over Occidia. We can now propose something rarer: a treaty that treats Stelander as a sovereign partner rather than a future client."
 VAL_Joint_General_Staff:0 "Joint General Staff Talks"
 VAL_Joint_General_Staff_desc:0 "Officers from both states will coordinate mobilisation plans, logistics and intelligence without merging their command structures."
 VAL_Cross_Border_Contracts:0 "Cross-Border Contracts"
 VAL_Cross_Border_Contracts_desc:0 "Mutual procurement, transit guarantees and clearing arrangements will turn the political settlement into a durable economic relationship."
 VAL_Two_States_One_Frontier:0 "Two States, One Frontier"
 VAL_Two_States_One_Frontier_desc:0 "The border dispatcher has two telephones. When an engine breaks down on the line, she calls both stations and writes down which one will send help. The capitals are still revising the treaty. On the railway, people already know whose voice to expect on the other end."
 VAL_equal_powers_offer_tt:0 "Offer an equal alliance. Refusal leaves the military route available."
 VAL_joint_staff_tt:0 "Allied Stelander joins Kefreyt's current and future wars against Nodrul."
 VAL_cross_border_contracts_tt:0 "Expands trade and procurement ties created by the equality treaty."
 VAL_two_states_frontier_tt:0 "Makes the alliance permanent and coordinates northern campaigns. Both countries receive the ending \"In Duplicate\" unless their joint victory over Nodrul has already brought it about."
 VAL_current_stelander_ally_tt:0 "Kefreyt and the Stelander government that signed the pact are independent, remain in the same faction and have both avoided capitulation."
 VAL_equal_alliance_accept_tt:0 "Kefreyt and Stelander enter the same alliance as equal sovereign partners."
 VAL_stelander_equal_alliance_name:0 "Kefreyt-Stelander Compact"

 val_contract.354.t:0 "An Alliance of Equals"
 val_contract.354.d:0 "Kefreyt has returned our national territory and formally recognised our sovereignty. Its government now proposes a permanent alliance built around mutual defence, coordinated logistics and equal political status. Accepting would bind the two states together without creating a protectorate or hierarchy."
 val_contract.354.accept:0 "Sign the compact."
 val_contract.354.refuse:0 "Recognition is enough."

 val_rework.224.t:0 "An Offer from Kefreyt"
 val_rework.224.d:0 "The envoy lays a map before Shabrat. Kefreyt is ready to march against Nodrul. Its officers want clearance at the border and liaison teams at both headquarters.\n\nThe southern districts are outlined in pencil. \"Your commandants stay here after the war,\" says the envoy. Kefreyt wants the northern roads for its administrations. Shabrat looks up. The man has orders to march even if he goes home without a signature."
 val_rework.224.accept:0 "Sign the compact and exchange radio frequencies."
 val_rework.224.refuse:0 "Take back the map. We command our own forces."
 val_rework.224.closed:0 "Strike the matter from the agenda."
 val_rework.225.t:0 "After the Frontier Surrender"
 val_rework.225.d:0 "The last transmission from Frontier headquarters confirms the surrender. The chief of staff asks that the families be told where the wounded have been taken. On the expedition map, the duty officer crosses out the call signs of the depots that were to supply the advance.\n\nKefreyt must issue new orders. The diplomats are ready to approach Nodrul for a ceasefire. At the next table the army has spread out a map of alternative roads."
 val_rework.225.withdraw:0 "Withdraw our forces and sign the armistice."
 val_rework.225.continue:0 "Find another road. The campaign continues."
 val_rework.226.t:0 "Shabrat and Kefreyt Sign a Military Pact"
 val_rework.226.d:0 "Shabrat has accepted Kefreyt's offer of a joint campaign. Liaison officers have delivered matching maps to both headquarters. Border posts have the call signs of the approaching columns. Kefreyt has joined Shabrat's war against Nodrul.\n\nThe envoys also confirmed their terms for peace. Steland is to govern the southern districts, while Kefreyt intends to establish its contract administrations in the north."
 val_rework.226.a:0 "The staffs synchronise their watches."
 val_rework.227.t:0 "Shabrat Rejects Kefreyt's Offer"
 val_rework.227.d:0 "Kefreyt's delegation has returned with an unsigned treaty. Shabrat has refused to coordinate commands or settle postwar borders. His troops fighting Nodrul are still under their original orders.\n\nIn Kefreyt, officers have opened sealed orders for an independent advance. Two armies are marching on Nodrul without an agreement on its partition."
 val_rework.227.a:0 "Each headquarters answers for its own campaign."
 val_rework.228.t:0 "The Allies Divide Nodrul's Lands"
 val_rework.228.d:0 "Following Nodrul's surrender, Shabrat's representatives reported for duty in Ashiya, Ostrium, Kasiliya and Cussington. Officials from Kefreyt's contract administrations headed north. At Nodrul's former headquarters, both delegations signed the boundary map.\n\nRailway clerks were the first to copy the line onto their own charts. At the stations, crews are already asking who stamps the freight bills and who issues passes for the return trip."
 val_rework.228.a:0 "The railway now answers to two authorities."
 val_rework.229.t:0 "Kefreyt Withdraws from the War with Nodrul"
 val_rework.229.d:0 "Following the Frontier's fall, Kefreyt has agreed to end its northern expedition. Expedition headquarters has ordered its columns to withdraw. At the crossings, traffic is being separated and platforms cleared for hospital trains.\n\nThe order bears the signature of Kefreyt's commander. Neither Frontier headquarters nor Shabrat has issued a ceasefire order to its troops."
 val_rework.229.a:0 "The guns fall silent on the Kefreyt front."
 val_rework.230.t:0 "Kefreyt Will Fight On After the Frontier Falls"
 val_rework.230.d:0 "Kefreyt has confirmed the surrender of Frontier headquarters and ordered its troops to continue the war with Nodrul. Dispatchers have received new supply routes. At the stations, workers are taking down signs for lost depots and diverting empty trains to other junctions.\n\nThe first convoy is already on the bypass road. Soldiers' families have been told that their return will have to wait."
 val_rework.230.a:0 "The convoys take the long way round."
 val_rework.231.t:0 "Kefreyt and Shabrat March Separately"
 val_rework.231.d:0 "Kefreyt has confirmed orders to advance against Nodrul. Asked about talks with Shabrat, the military secretary laid the morning dispatch from the Frontier before the correspondents. Its last page listed casualties from fighting Steland's troops.\n\nNo liaison officers will go to Shabrat's headquarters. On the Frontier, troops are waiting for orders from their own commanders."
 val_rework.231.a:0 "The guns are still firing on the Frontier."

 val_rework.232.t:0 "In Duplicate"
 val_rework.232.kefreyt:0 "Two copies of the alliance treaty barely fitted on the border stationmaster's desk. While the delegates signed, the dispatcher kept one elbow on her train graph. The engine hauling a load of rails had been under steam for forty minutes. They had promised her the desk back by noon.\n\nKefreyt's delegate was the first to notice a pencilled correction on the graph. Across the border, water had washed out an embankment. The neighbours wanted their repair crew to go first and promised to take the rails that evening. He would usually have had to clear the change with the capital. He checked the article he had just signed, picked up the receiver and told the Stelander dispatcher which section of track was free.\n\nOnce the papers were gone, the dispatcher rubbed out one line on her graph and drew another. The receipt for the rails came that evening. The delegate filed it as the first item of correspondence under the treaty."
 val_rework.232.stelander:0 "The Stelander delegation brought the alliance treaty to the border station in a worn leather briefcase. In the side pocket was a note from the track foreman. Overnight, water had eaten into the embankment. Unless his crew got through by noon, there would be nowhere to unload the rails due from Kefreyt that evening.\n\nAfter the signing, the delegate handed one copy to his neighbours, packed the other and asked to be put through to the foreman. Word had already reached him that Kefreyt had cleared the line. What he needed now was a name on the requisition for the crew and tools. The delegate spelled out his own surname. On his side of the border, the work was his responsibility.\n\nBy evening the bank was shored up. The foreman counted the rails and sent a receipt across the border. The treaty reached the capital the next morning with both seals in place and a damp thumbprint on the cover."
 val_rework.232.a:0 "Evening delivery received."
 val_rework.233.t:0 "Kefreyt and Stelander Make Their Alliance Permanent"
 val_rework.233.d:0 "Representatives of Kefreyt and Stelander signed a permanent alliance treaty at a border station. Each government retains its own military command and authority over its railways. A direct line between the border services lets dispatchers arrange train movements and send repair crews without referring each request to the capitals.\n\nThe first document exchanged under the new arrangements was a receipt for a consignment of rails. Each delegation took home one copy of the treaty."
 val_rework.233.a:0 "Two seals on the treaty."
 VAL_shabrat_accept_campaign_tt:0 "Steland and Kefreyt will share an alliance. Kefreyt will join our war against Nodrul. A joint victory awards us Ashiya, Ostrium, Kasiliya and Cussington."
 VAL_shabrat_refuse_campaign_tt:0 "Kefreyt will launch a separate expedition without a partition agreement."
 VAL_frontier_exit_tt:0 "Kefreyt will withdraw its expedition and sign a 180-day truce with Nodrul. The Frontier and Shabrat will continue their existing wars, including against each other if they are enemies."
