l_english:
 VAL_Equal_Powers_Pact:0 "A Pact of Equal Powers"
 VAL_Equal_Powers_Pact_desc:0 "Recognition ended the immediate dispute over Occidia. We can now propose something rarer: a treaty that treats Stelander as a sovereign partner rather than a future client."
 VAL_Joint_General_Staff:0 "Joint General Staff Talks"
 VAL_Joint_General_Staff_desc:0 "Officers from both states will coordinate mobilisation plans, logistics and intelligence without merging their command structures."
 VAL_Cross_Border_Contracts:0 "Cross-Border Contracts"
 VAL_Cross_Border_Contracts_desc:0 "Mutual procurement, transit guarantees and clearing arrangements will turn the political settlement into a durable economic relationship."
 VAL_Two_States_One_Frontier:0 "Two States, One Frontier"
 VAL_Two_States_One_Frontier_desc:0 "The alliance will become a permanent element of the regional order. Neither state is subordinate to the other."
 VAL_equal_powers_offer_tt:0 "Send Stelander a formal proposal for an alliance of equal sovereign states."
 VAL_joint_staff_tt:0 "Deepens military coordination with Stelander while preserving separate command."
 VAL_cross_border_contracts_tt:0 "Expands trade and procurement ties created by the equality treaty."
 VAL_two_states_frontier_tt:0 "Makes the equal alliance permanent and coordinates future northern wars."
 VAL_equal_alliance_accept_tt:0 "Kefreyt and Stelander enter the same alliance as equal sovereign partners."
 VAL_stelander_equal_alliance_name:0 "Kefreyt-Stelander Compact"

 val_contract.354.t:0 "An Alliance of Equals"
 val_contract.354.d:0 "Kefreyt has returned our national territory and formally recognised our sovereignty. Its government now proposes a permanent alliance built around mutual defence, coordinated logistics and equal political status. Accepting would bind the two states together without creating a protectorate or hierarchy."
 val_contract.354.accept:0 "Sign the compact."
 val_contract.354.refuse:0 "Recognition is enough."
