l_english:
 ADISCORD_vorkerland_story.1.t: "The Claimants Go to War"
 ADISCORD_vorkerland_story.1.d: "The last emergency channels between Vorkerland's surviving central governments have gone silent. The remaining claimants now recognize one another as enemies. Verified fighting links every required claimant front; the struggle for the centre has begun."
 ADISCORD_vorkerland_story.1.a: "The centre will decide the republic's fate."
 ADISCORD_vorkerland_story.2.t: "Grand Vorkernsberg Falls"
 ADISCORD_vorkerland_story.2.d: "Forces credited to [ROOT.GetNameDef] have broken into Grand Vorkernsberg and displaced the worker claimant's central command. The emergency committees have not yet surrendered, but the loss of the old capital has shaken their authority across the front."
 ADISCORD_vorkerland_story.2.a: "The old centre has changed hands."
 ADISCORD_vorkerland_story.3.t: "Isaiah Falls"
 ADISCORD_vorkerland_story.3.d: "Forces credited to [ROOT.GetNameDef] now control Isaiah, the seat of Vlad's wartime coalition. Its surviving ministries are withdrawing under fire while rival broadcasts declare the western command broken."
 ADISCORD_vorkerland_story.3.a: "The coalition has lost its capital."
 ADISCORD_vorkerland_story.4.t: "Northwerk Falls"
 ADISCORD_vorkerland_story.4.d: "Forces credited to [ROOT.GetNameDef] have seized Northwerk and its command exchanges. Doctor Dorian Worx's technocratic administration continues the war from dispersed facilities, but the directorates have lost their political centre."
 ADISCORD_vorkerland_story.4.a: "The technocrats are retreating."
 ADISCORD_vorkerland_story.5.t: "The Captured Command Apparatus"
 ADISCORD_vorkerland_story.5.d: "The first rival claimant has capitulated. Staff officers, code clerks and logistics chiefs are now in our custody. Some can be folded into the victorious command; others warn that preserving the defeated apparatus will carry its rivalries into the next campaign."
 ADISCORD_vorkerland_story.5.a: "Integrate the useful headquarters."
 ADISCORD_vorkerland_story.5.b: "Dissolve the apparatus and release its clerks."
 ADISCORD_vorkerland_story.6.t: "After the Guns"
 ADISCORD_vorkerland_story.6.worker.d: "Vorkerland is whole again under [ROOT.GetLeader]. Worker's loyalists and Anton Bagley's emergency administrators agree that the wartime state cannot remain unchanged, but they disagree over whether its command network or its civilian institutions should carry reconstruction."
 ADISCORD_vorkerland_story.6.joint.d: "Vorkerland is whole again under [ROOT.GetLeader]. Vlad's coalition and the joint councils that survived beside it must now decide whether reunification will be directed from one central command or guaranteed through a charter for the provinces."
 ADISCORD_vorkerland_story.6.worx.d: "Vorkerland is whole again under Doctor Dorian Worx. The technocratic administration can preserve the wartime directorates as instruments of reconstruction, or subject its emergency laboratories and planning bureaus to a formal audit."
 ADISCORD_vorkerland_story.6.worker.a: "Retain the emergency staff for reconstruction."
 ADISCORD_vorkerland_story.6.worker.b: "Restore the civilian ministries."
 ADISCORD_vorkerland_story.6.joint.a: "Bind the councils to a common command."
 ADISCORD_vorkerland_story.6.joint.b: "Issue a charter of provincial guarantees."
 ADISCORD_vorkerland_story.6.worx.a: "Doctor Worx will retain the technocratic directorates."
 ADISCORD_vorkerland_story.6.worx.b: "Audit the emergency laboratories."
 ADISCORD_vorkerland_story.7.t: "The Worker Government Reunifies Vorkerland"
 ADISCORD_vorkerland_story.7.d: "The last central front has closed. Under [ROOT.GetLeader], the worker republic has restored a single administration over Vorkerland and begun converting its emergency committees into institutions of reconstruction."
 ADISCORD_vorkerland_story.7.a: "A battered republic survives."
 ADISCORD_vorkerland_story.8.t: "Vlad's Coalition Reunifies Vorkerland"
 ADISCORD_vorkerland_story.8.d: "The last central front has closed. Vlad's coalition and its surviving joint councils have restored a single Vorkerland, balancing central command against the promises made to provincial allies during the war."
 ADISCORD_vorkerland_story.8.a: "The coalition has inherited the centre."
 ADISCORD_vorkerland_story.9.t: "Doctor Worx Reunifies Vorkerland"
 ADISCORD_vorkerland_story.9.d: "The last central front has closed. Doctor Dorian Worx has reunited Vorkerland beneath a technocratic administration, and the wartime directorates are already measuring the republic's reconstruction in power, transport and production targets."
 ADISCORD_vorkerland_story.9.a: "The technocracy begins its reconstruction."
 ADISCORD_vorkerland_news.1.t: "Norvein Proclaimed"
 ADISCORD_vorkerland_news.1.d: "Ivanland has concluded its northern operation and dissolved the provisional defence front. Matvey Mateuska's Norvein received states 90 and 91, while Anton Selevyostrov's Kraitsk Directorate took states 93 and 94. Both regimes depend on Itora, and the surviving northern republics have already resumed their interrupted war."
 ADISCORD_vorkerland_news.1.a: "A new regime has appeared on the frontier."
 ADISCORD_vorkerland_news.2.t: "Ivanland Withdraws from Norvein"
 ADISCORD_vorkerland_news.2.d: "Ivanland's operation has failed. Neither Norvein nor the dependent Kraitsk Directorate was created: states 90 and 91 returned to Grain, while states 93 and 94 returned to Rivendell. The provisional Northern Defence Front has dissolved and the northern administrations have resumed their internecine wars. Vadim Ivanchik's government has declared an emergency course after the defeat."
 ADISCORD_vorkerland_news.2.a: "The north is at war with itself again."
