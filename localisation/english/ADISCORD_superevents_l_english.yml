l_english:
  superevent_vorkerland_civilwar_title: "The Vorkerland Civil War"
  superevent_vorkerland_civilwar_quote: "When words cease to cling closely to things, kingdoms fall, empires wane and vanish.\n\n- Ezra Pound"
  superevent_vorkerland_civilwar_comment: "No empire has ever been eternal"

  superevent_stelander_empire_title: "Proclamation of the Stelander Imperial Union!"
  superevent_stelander_empire_quote: "When a man has nothing left to be proud of, he begins to take pride in his ethnicity.\n\n- Arthur Schopenhauer"
  superevent_stelander_empire_comment: "Stelander raises its head again"

  superevent_vorkerland_dirty_opening_title: "The Dirty Zone Opens"
  superevent_vorkerland_dirty_opening_quote: "Communications returned before the fear had faded. Beyond the perimeter, governments, borders, and orders appeared again."
  superevent_vorkerland_dirty_opening_comment: "The silent zone fractured into new territories"

  superevent_vorkerland_worker_victory_title: "Restoration of the Confederation"
  superevent_vorkerland_worker_victory_quote: "Unity returned not as the old order, but as an agreement among those who survived its collapse."
  superevent_vorkerland_worker_victory_comment: "Worcker preserved a federal Vorkerland"

  superevent_vorkerland_vlad_victory_title: "The Military Restoration of Vorkerland"
  superevent_vorkerland_vlad_victory_quote: "When the institutions vanished, the army declared itself the only institution left."
  superevent_vorkerland_vlad_victory_comment: "Vlad Petrichev imposed an imperial order"

  superevent_vorkerland_joint_victory_title: "The Joint Restoration of Vorkerland"
  superevent_vorkerland_joint_victory_quote: "The army retook the centre, but victory became law only when the two camps agreed to share power."
  superevent_vorkerland_joint_victory_comment: "The emergency council held Vorkerland together"

  superevent_vorkerland_dorian_victory_title: "The Technical Reconstruction of Vorkerland"
  superevent_vorkerland_dorian_victory_quote: "The ruins were catalogued, measured, and incorporated into a new plan of administration."
  superevent_vorkerland_dorian_victory_comment: "Dorian Worx entrusted the country to specialist administrations"
