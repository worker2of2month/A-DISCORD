l_english:
 ADISCORD_bezhaysk_postwar_operations: "Bezhaysk Postwar Operations"
 ADISCORD_bezhaysk_postwar_operations_desc: "After Bezhaysk falls, neighbouring territories can be subordinated through dependent administrations instead of distorting the map with direct annexation."
 ADISCORD_bezhaysk_subjugate_forest_val: "Operation Against the Children of the Forest"
 ADISCORD_bezhaysk_subjugate_forest_val_desc: "Flaem Prana and Grandfather Lishay's Hut remain outside the new order. Kefreyt can launch a separate late campaign and turn the territory into a contract administration after victory."
 ADISCORD_bezhaysk_subjugate_forest_nod: "Subordinate the Children of the Forest"
 ADISCORD_bezhaysk_subjugate_forest_nod_desc: "The old limited northern campaign was not designed to eliminate the Cult. After the Bezhaysk settlement, Nodrul can wage a separate war and place Flaem Prana under permanent protection."
 autonomy_NOD_protected_administration: "Nodrul Protected Administration"
