 # BEGIN GENERATED: tools.builders.build_adiscord_ainholm_mandate
 AIN_concession_economy: "Concession Economy"
 AIN_concession_economy_desc: "Ainholm's industry, mining and main roads have been handed over to companies tied to the Republic of Nodrul. In exchange, the colonial administration receives investment and access to markets, but a substantial share of its revenue and resources flows to the mother country."
 # END GENERATED: tools.builders.build_adiscord_ainholm_mandate
 STP_hedonism_with_no_bondaries: "Hedonism Without Borders"
 STP_hedonism_with_no_bondaries_desc: "The state has stopped pretending to educate its citizens and become a purveyor of pleasure. Its borders are open to capital, vice and tourists, while morality has been replaced by a price list.\n\nAs long as the shop windows shine, the system learns one lesson: keep people fed, occupied and slightly intoxicated. It works until the party ends and everyone receives the bill at once."
 STP_hedonism_army_restriction_tt: "§RRegular army and police templates are locked, and training new ordinary divisions is prohibited.§!\n§GArmy headquarters are exempt from this restriction.§!"
 STP_hedonism_army_restriction_reason: "The regular army is restricted by the policy of Hedonism Without Borders"
 STP_hidden_slaves_trade: "Extensive Slave Trade Network"
 STP_hidden_slaves_trade_desc: "Behind the facade of the free market lies a market in unfree people. The traffic passes quietly through ports, warehouses, agencies, contracts and disappearing names.\n\nOfficially, it does not exist. Unofficially, it is one of the most efficient channels of profit and control. In this business, the merchandise does not complain, because it has no voice."
 STP_legalize: "Legalised Soft Drugs"
 STP_legalize_desc: "Discontent was treated with a painkiller rather than reform. Soft drugs became legal, the market became regulated, and the treasury gained new revenue.\n\nThe crowds grew quieter, the streets brighter, the reports more flattering. The side effect is plain: society learns to wait out the present rather than think about the future."
 STP_worldwide_famous_tourist_destination: "Steland's Economic Miracle"
 STP_worldwide_famous_tourist_destination_desc: "Steland has been turned into a brand: a resort, a showcase and a legend. Foreign currency flows in, service wears a flawless smile, and every stain is wiped away before it enters the frame.\n\nThe miracle rests on appearances. While tourists watch the fireworks, they do not ask who carried the powder or swept away the ashes."
 STP_fading_father: "The Regime's Father Is Fading"
 STP_fading_father_desc: "Ivanov's illness weakens the government and reduces stability. After his death, the penalty remains until civil administration is restored."
 NOD_home_of_hedonist_revolution: "Birthplace of the Hedonist Revolution"
 NOD_home_of_hedonist_revolution_desc: "This place is no longer a country: it is a manifesto wrapped in neon and expensive fabric.\n\nThe revolution was not proclaimed in its squares. It was sold as a way of life. Freedom became a commodity, pleasure a civic duty, and ideology an advertising slogan. Anyone who doubts it is dismissed as merely boring rather than condemned as an enemy.\n\nFrom outside, it looks triumphant: parties, shop windows, tourism and a ceaseless flow of money. Within, the system rests on a cynical bargain: the state guarantees the festivities, and the people ask no questions about the price or those who disappear backstage.\n\nWhile the music plays, the party smiles at the world. But every smile relies on a muscle that grows tired. When the lights go out, the revolution of pleasure will confront its eternal problem: it does not know how to die quietly."
 NOD_hedonism_with_no_bondaries: "Hedonism Without Borders"
 NOD_hedonism_with_no_bondaries_desc: "The state has stopped pretending to educate its citizens and become a purveyor of pleasure. Its borders are open to capital, vice and tourists, while morality has been replaced by a price list.\n\nAs long as the shop windows shine, the system learns one lesson: keep people fed, occupied and slightly intoxicated. It works until the party ends and everyone receives the bill at once."
 VAL_mercenary_state: "Mercenary State"
 VAL_mercenary_state_desc: "Loyalty here is measured by the rate, not the oath. The state has rebuilt itself around the contract: rapid recruitment, strict discipline and cold efficiency.\n\nThe ideology is simple: whoever pays is right. But the more the country earns from war, the less it remembers what makes life worth living.\n\nContract pay raises army expenses by 25%. Final reforms remove this premium gradually: 5 percentage points per focus, up to 25 in total. Relief survives a change of government course. Other upkeep discounts apply separately."
 VAL_worldwide_famous_weponry: "World-Renowned Arms Factories"
 VAL_worldwide_famous_weponry_desc: "The factories here are like cathedrals: loud, hot and sacred. Their assembly lines produce steel that will speak in place of diplomacy a month from now.\n\nTheir reputation is impeccable: precision, reliability and scale. So is the price: it is always paid in someone else's blood."
 VAL_harvest_of_ash: "Land of Ash"
 VAL_harvest_of_ash_desc: "The land here is cursed. It no longer yields life, only barbed wire and dry branches reaching skywards like the bony hands of the dead. Peasants harvest unexploded shells and their ancestors' bones. Hunger is no visitor here, but the permanent master, and even the setting sun seems sickly and blood-red.\n\n\n\n\n\n £GFX_VAL_harvest_of_ash_banner \n\n\n\n$VAL_reclamation_completion_tt$"
 WRK_ashes_of_the_crown: "Ashes of the Crown"
 WRK_ashes_of_the_crown_desc: "The old order burned without grandeur, in the everyday business of papers, orders and fear. The crown turned to ash, and with it the familiar system of loyalties.\n\nWe inherited ruined symbols and a crowd that remembers greatness but has forgotten how to pay for it. The power vacuum smells of smoke: whoever draws the first breath will begin dictating the new age.\n\n\n\n\n\n £GFX_WRK_ashes_of_the_crown_banner \n\n"
 WRK_hourglass_of_discord: "Hourglass of Discord"
 WRK_hourglass_of_discord_desc: "The sand has almost run out. Every swing of the pendulum brings us closer to the inevitable end. Old institutions are collapsing, the economy is in agony, and people in the streets whisper of the approaching end of the world. We are not drawing up five-year plans; we are trying to survive another day. This is a race against death, and death is winning.\n\nDo you hear that sound? It is not a heartbeat, but the ticking of a mechanism counting down the last minutes of our era. The sand has almost run out, and it is red-hot. We do not work for the future: there is no future. We work to survive this evening. Every second of delay costs hundreds of lives."
 WRK_constitution_of_the_republic: "Constitution of the Republic"
 WRK_constitution_of_the_republic_desc: "The new constitution is an attempt to turn chaos into procedure: to write rules where force decided matters yesterday, and give the country at least one shared point of reference.\n\nThe document looks like salvation, but paper cannot hold the cracks together on its own. Unless the republic learns to obey its own articles, the constitution will become a gravestone for its hopes rather than a foundation.\n\n\n\n\n\n £GFX_WRK_constitution_of_the_republic_banner \n\n"
 WRK_birthplace_of_the_first_revolution: "Birthplace of the First Revolution"
 WRK_birthplace_of_the_first_revolution_desc: "The Vorkerland monarchy did not survive the First Revolution. The imperial court was dispersed, the crown's administration dissolved, and the new republic declared the overthrow of the throne its founding act. For the regime, this is more than history: its right to govern derives from victory over the monarchy.\n\nBut in breaking the throne, the revolutionaries also broke the unified chain of authority. Army headquarters argue with party committees, districts retain emergency powers, and purged departments are filled with loyal but inexperienced staff. Any compromise can easily be branded a restoration, so the state spends its strength on an endless hunt for counterrevolution rather than reconstruction.\n\n§RThis national spirit will disappear if power passes to an ideology unrelated to Vorkerism.§!\n\n\n\n\n\n £GFX_WRK_birthplace_of_the_first_revolution_banner \n\n"
 WRK_birthplace_of_the_first_revolution_front_republic: "Front Republic of the First Revolution"
 WRK_birthplace_of_the_first_revolution_front_republic_desc: "The congress of frontline councils forced party committees, headquarters and local administrations to recognise a common mobilisation system. The republic still operates under emergency powers, but these are now divided among institutions capable of taking responsibility for supplies and reinforcements."
 WRK_birthplace_of_the_first_revolution_renewed_mandate: "Renewed Mandate of the First Revolution"
 WRK_birthplace_of_the_first_revolution_renewed_mandate_desc: "The Front Charter turned the memory of the throne's overthrow from an excuse for endless purges into a concrete agreement: the councils provide recruits and taxes, while the centre guarantees representation and limits on emergency authority. The military republic remains harsh, but its institutions reinforce one another for the first time."
 RUS_national_spirit: "Rusnia's Free Communities"
 RUS_national_spirit_desc: "Rusnia is held together by the habit of disputing every order, rather than by orders themselves. Local communities are armed, stubborn and rarely ask the capital for permission to survive.\n\nThese free communities collect taxes poorly and tolerate authority even less. But when a foreign boot steps onto their soil, yesterday's disputants quickly remember that freedom sometimes speaks in volleys."
 RUS_last_empire_spirit: "The Last Empire"
 RUS_last_empire_spirit_desc: "The free communities have not disappeared, but they no longer dispute their own commands. The aimags, sotnias and the Khan's chancery have been assembled into a single state that calls itself the last empire among the ruins of the western belt."
 VLA_national_spirit: "Eastern District Administration"
 VLA_national_spirit_desc: "The Eastern Military District is trying to survive the end of the old world through headquarters, depots and temporary commissions. Military administrators promise order without grand speeches: repair the roads, hold the arsenals and reach agreements with anyone still willing to listen.\n\nBut authority born of emergency rule rarely looks legitimate. Every new order rests on a question no one speaks aloud: is this already a state, or merely a military chancery among Vorkerland's ruins?"
 NAM_national_spirit: "The Governor System"
 DAN_national_spirit: "Communal Discipline"
 DAN_national_spirit_desc: "Daniyaland does not ask citizens to believe in the state: it demands that they work alongside it. Communes, militias and factory committees follow a single harsh rhythm, where personal opinion ends at the workshop gate. For many, it is also an attempt to preserve the memory of another continent, where Expeditionary Group #42 originated and its first orders were left behind.\n\nThis discipline makes the country resilient and ready for war. But the more evenly society marches, the more clearly one hears exhaustion cracking beneath the ranks."
 PIV_national_spirit: "Festival of Malt"
 PIV_national_spirit_desc: "Afrela has made craft, trade and feasting into a philosophy of state. Here they know how to sell joy, reconcile after an argument and build an economy around a mug that is always half full.\n\nWhile the music plays, the country is stable and content. Trouble begins when festivities must give way to mobilisation, and a toast to an order."
 IVN_national_spirit: "Humanist Shield"
 IVN_national_spirit_desc: "Itora believes that the state should protect people before lines on a map. This faith did not arise in a vacuum: the memory of our Vorkerland, its guarantees, fears and collapse still leads local politicians to choose caution over a glorious adventure.\n\nThat belief gives society an inner strength. But the shield is heavy: it is carried by taxpayers, doctors, teachers and soldiers who must prove that mercy is not weakness."
 APH_national_spirit: "The Red Feast"
 APH_national_spirit_desc: "Anthropophagorum lives by the law of the hunt. Victory here is no metaphor but a feast, in which the enemy's fear becomes part of the war machine and defeat on one's own side quickly becomes a lesson for everyone else.\n\nThis culture produces ferocious fighters and cheap courage. Yet a country accustomed to feeding on its enemies has little understanding of labour, science or the very idea of a future without blood."
 WIT_national_spirit: "City of Swift Agreements"
 WIT_national_spirit_desc: "Rimat survived because it calculated the cost of conflict faster, not because it was stronger than its neighbours. Trading houses, prefects and guild brokers are used to settling crises through deals before they turn into orders.\n\nThis order makes the country flexible, educated and comparatively inexpensive to govern. But a society accustomed to negotiation struggles when a bayonet is needed in place of a signature."
 BOR_itoran_relief_charter: "Itoran Relief Charter"
 BOR_itoran_relief_charter_desc: "Itora pays for some of Borea's roads, hospitals and depots. The aid stabilises the border, but binds the republican budget to obligations towards a foreign patron."
 RIN_two_oaths: "Two Incompatible Oaths"
 RIN_two_oaths_desc: "The northern houses swear loyalty to Montera; the south lives by Vorkerland charters. They stand together against external pressure, but any peacetime decision breaks one of their two oaths."
 RIN_palace_guard: "Palatine Guard"
 RIN_palace_guard_desc: "Well-paid regiments guard the court, communications hubs and main roads. They are highly trained, but their upkeep consumes funds that ordinary garrisons lack."
 RIN_southern_charter_mobilization: "Militia of the Southern Charters"
 RIN_southern_charter_mobilization_desc: "The southern cities have opened the arsenals of the old trading houses and placed their militias under a single command. The charters give them a common purpose, but cannot replace a stable state."
 RIN_northern_crown_columns: "Columns of the Northern Crown"
 RIN_northern_crown_columns_desc: "The northern houses have organised noble levies and palatine troops into marching columns. Montera supplies them with weapons without turning a local war into a common allied front."
 RIN_charter_compact: "Charter of the Southern Cities"
 RIN_charter_compact_desc: "Having survived the split, the cities have established their old trade charters as the basis of common law. The palatine retains his throne, but can no longer promise one country to two foreign patrons."
 RIN_crown_palatin: "Crown Palatinate"
 RIN_crown_palatin_desc: "The northern oath has become the order of the state. The court receives Montera's weapons and protection in exchange for dependence and the duty to guard imperial roads."
 KRM_slag_road_compact: "Slag Road Compact"
 KRM_slag_road_compact_desc: "Slag heaps are turned into roadbeds, and each mine must maintain a stretch of road to the common sorting hub. The League gains raw materials and reliable logistics, but its people live amid dust and heavy traffic."
 LMN_permanent_quarantine: "Permanent Quarantine"
 LMN_permanent_quarantine_desc: "Defensive lines, screening points and sealed depots make the cordon a difficult target. The same restrictions obstruct free labour, migration and normal mobilisation."
 RLY_closed_circuit: "Closed Circuit"
 RLY_closed_circuit_desc: "Surrounded by an exclusion zone, Releyn is forced to reuse its water, parts and heat. The republic is remarkably self-sufficient, but cannot quickly replace lost equipment or withstand the opening of an external front."
 WCG_living_filter: "Living Filter"
 WCG_living_filter_desc: "Every road is a screening camp, every depot a quarantine reserve, and every inhabitant must both work and serve the cordon. Vorkerland takes half the civilian industry and most military orders. The remaining economy suffocates under permits, requisitions and constant rotation to limit radiation exposure."
 BRN_polar_signal_line: "Polar Signal Line"
 BRN_polar_signal_line_desc: "Radio masts and intermediate depots allow supplies to reach the northern districts, but the entire system depends on a handful of roads and the discipline of local garrisons."
 KHV_geothermal_colleges: "Geothermal Colleges"
 KHV_geothermal_colleges_desc: "Engineering schools are linked to mines and heating plants. Research reaches production quickly, although maintaining the complex network costs the population dearly."
 ELN_census_engines: "State Accounting Engines"
 ELN_census_engines_desc: "A network of computing stations accelerates research and the allocation of orders, but constant inspections and corrections irritate even loyal specialists."
 HON_civic_compact: "Civic Compact of the Provinces"
 HON_civic_compact_desc: "Taxes, roads and mobilisation duties are established by an open agreement. The provinces retain a voice, while the centre receives predictable resources for common policy."
 SKN_reserve_districts: "Permanent Reserve Districts"
 SKN_reserve_districts_desc: "Every administration keeps registers of people, vehicles and depots. Mobilisation is swift, but maintaining the system constantly diverts a share of peacetime production."
 LYS_bonded_warehouses: "Collateral Warehouse Network"
 LYS_bonded_warehouses_desc: "Goods can be pledged as collateral, resold in transit and quickly sent to the factory that needs them. The system speeds up trade, but strengthens the warehouse owners' power."
 VES_border_charters: "Border Road Charters"
 VES_border_charters_desc: "A community receives land and materials in exchange for maintaining a stretch of road, a depot and a fortified position."
 MON_throne_of_fifteen_crowns: "Throne of Fifteen Crowns"
 MON_throne_of_fifteen_crowns_desc: "Defeated dynasties retained their titles but swore allegiance to the Arkens. The splendid court strengthens imperial legitimacy while consuming enormous resources."
 MON_imperial_general_staff: "Imperial General Staff"
 MON_imperial_general_staff_desc: "Common maps, schedules and training programmes allow a large army to deploy swiftly in any direction."
 MON_arsenal_belt: "Montera's Arsenal Belt"
 MON_arsenal_belt_desc: "The southern cities are linked by military orders, railways and standardised workshops. Productivity is high, but the civilian economy must yield to the army."
 MON_hierarchy_of_peoples: "Imperial Hierarchy of Peoples"
 MON_hierarchy_of_peoples_desc: "Propaganda promises every estate a place in the common advance, but assigns rights and duties by descent. The system supplies many soldiers and produces ever more concealed discontent."
 KDR_law_of_a_thousand_miles: "Law of the Sun Road"
 KDR_law_of_a_thousand_miles_desc: "Every station on the great highway must supply the throne's caravans, maintain a watch and recognise Kadir's supreme authority."
 RHM_cistern_parliament: "Charter of the Common Well"
 RHM_cistern_parliament_desc: "Rakhma's water is recognised as a common asset. The cities jointly maintain the cisterns and elect representatives to distribute reserves."
 SDR_dry_river_patrols: "Dry Riverbed Patrol Chain"
 SDR_dry_river_patrols_desc: "Small outposts relay news, escort supply trains and secure dangerous crossings without a cumbersome central bureaucracy."
 MZR_common_water_charter: "Common Water Ration Charter"
 MZR_common_water_charter_desc: "Wells and catchments are considered a public resource. Rations change with available reserves, but common rules protect outlying settlements from the whims of local owners."
 KYZ_free_qanat_compact: "Free Qanat Compact"
 KYZ_free_qanat_compact_desc: "Each community maintains its own stretch of underground water channel, while major repairs are carried out jointly under mutual oaths rather than orders from a central authority."
 SHL_nine_furnaces_compact: "Nine Furnaces Pact"
 SHL_nine_furnaces_compact_desc: "Nine industrial houses coordinate purchasing, exports and energy prices, keeping profit and power within a closed circle."
 GLP_prismatic_trade_code: "Port Code"
 GLP_prismatic_trade_code_desc: "Common rules govern port fees, cargo insurance and coastal workshops."
 AZH_black_basin_levy: "Black Basin Mobilisation"
 AZH_black_basin_levy_desc: "District administrations maintain a common military register and reserve formations, placing supply under central command."
 WEF_frontier_municipalism: "Programme of Shared Results"
 WEF_frontier_municipalism_desc: "Municipalities retain their autonomy, but receive materials only for projects with proven benefits for Fenn's supplies, communications and security."
 COF_national_spirit: "Blood of the Grove"
 BJK_nodrul_influence: "Nodrul Influence"
 BJK_nodrul_influence_desc: "Nodrul money, advisers and political intermediaries have worked their way into the Bezhaysk court and its governing circles. The kingdom remains formally sovereign, but important decisions are made under the shadow of a stronger northern patron. This influence lasts only while Nodrul itself remains an independent power."
