 NAM_order_field_infantry: "Order: Field Infantry"
 NAM_order_field_infantry_desc: "§YCOST§!: §Y15§! £political_power_texticon §Y100§! £ADISCORD_economy_treasury_texticon §Y6300§! £manpower_texticon\n§YDEPLOYMENT§!: at the start of the resource war.\n§YCOOLDOWN§!: §Y14§! £time_texticon days after use.\n\n§YRESULT§!\n§G1§! £divisions_texticon field infantry division: six infantry battalions and engineers.\nDeployment: the first fully held district among Sukhorechye, Eastern Sukhorechye and South Coast."
