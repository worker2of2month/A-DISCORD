 # Armed services
 NAM_navy_dynamic:0 "Svetlogorye Flotilla"
 NAM_navy_dynamic_desc:0 "South Harbour links the mainland to the islands. Patrol ships, transport crews and repair yards form the foundations of an independent naval service."
 NAM_air_dynamic:0 "Svetlogorye Air Service"
 NAM_air_dynamic_desc:0 "Inherited aircraft need mechanics, pilots and an independent flight command. The air service brings airfields and squadrons together to defend the country."
 NAM_landing_school:0 "Naval Landing School"
 NAM_landing_school_desc:0 "Island garrisons must learn more than waiting for ships: they must be able to land on a hostile shore. Captains and infantry officers will develop a common system for landings and supply."
 NAM_grp_landing_school_tt:0 "Garrison support: §G+5§! £NAM_support_garr_texticon."
 NAM_flight_school:0 "Svetlogorye Flight School"
 NAM_flight_school_desc:0 "With the central departments gone, pilots and instructors have lost their common command. Our own school will bring them together at the capital airfield and restore regular crew training."
 NAM_air_ground_service:0 "Airfield Ground Service"
 NAM_air_ground_service_desc:0 "An aircraft starts with work on the ground. Mechanics will receive common instructions, spare-parts stores and a procedure for accepting repaired machines."
 NAM_air_interceptors:0 "Cover for the Oilfields"
 NAM_air_interceptors_desc:0 "Pumping stations and fuel stores are too important to face raids with anti-aircraft fire alone. Alert fighters will respond to observers and cover the industrial basin."
 NAM_air_support:0 "Battlefield Aviation"
 NAM_air_support_desc:0 "Our formations fight over narrow roads and isolated crossings. Attack squadrons will respond to ground commanders and clear the way for advancing columns."
 NAM_air_operations:0 "Unified Flight Command"
 NAM_air_operations_desc:0 "Separate squadrons must follow a common plan. Controllers, observers and headquarters will coordinate routes, crew rotations and target handovers."
 NAM_air_fighter_order:0 "Purchase Fighters"
 NAM_air_fighter_order_desc:0 "The purchasing commission accepts refurbished fighters with their technical records. Each aircraft is inspected and flight-tested before being issued to a squadron."
 NAM_air_cas_order:0 "Purchase Attack Aircraft"
 NAM_air_cas_order_desc:0 "Aircraft workshops will prepare a batch of attack aircraft. Inspectors check weapons fittings, communications and engines before handing them over to the squadrons."
