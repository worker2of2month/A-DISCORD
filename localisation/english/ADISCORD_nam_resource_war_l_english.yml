 NAM_order_resource_guard: "Order: Field Guard"
 NAM_order_resource_guard_desc: "§YCOST§!: §Y25§! £political_power_texticon §Y200§! £ADISCORD_economy_treasury_texticon §Y9600§! £manpower_texticon\n§YDEPLOYMENT§!: at the start of the resource war.\n§YCOOLDOWN§!: §Y14§! £time_texticon days after use.\n\n§YRESULT§!\n§G1§! £divisions_texticon resource guard division: nine infantry battalions, engineers and an artillery battery.\nDeployment: Northern Deposits; if lost, the nearest held district."
