 NAM_order_resource_guard_tt: "Treasury: §R-200§! £ADISCORD_economy_treasury_texticon.\nAt the start of the resource war: §G1§! £divisions_texticon fully equipped resource guard division with nine infantry battalions, an engineer company and a support artillery battery. Deployment: $STATE_67$; if the assembly point is lost, another held district is selected."
 NAM_order_field_infantry: "Order: Field Infantry"
