 NAM_mil_forward_supply_desc:0 "Cost: §Y25§! £political_power_texticon §Y150§! £ADISCORD_economy_treasury_texticon §Y60§! £support_equipment_texticon. Preparation: §Y14§! £time_texticon days.\n\nEstablish a depot behind an already prepared line. Work occupies one shared defence-line preparation slot and the chosen district. $NAM_mil_forward_supply_delivered_tt$\n\nLoss of the district, capitulation, subjugation or resolution of the resource conflict refunds unfinished work and releases the slot. A completed depot closes under those conditions without a refund. A lost depot can be rebuilt at full price once the §Y30§! £time_texticon cooldown from preparation completion has elapsed."
