 ADISCORD_nam_resource_war.80.t: "The Centre Is Gone"
 ADISCORD_nam_resource_war.80.d: "The morning telegraph from the capital never came. By noon every line had fallen silent - the government line, the bank line and the one through which the metropole had sent its oil quotas for decades. In the evening the first refugees arrived from the south and told what the chancery at first refused to believe: Vorkerland as everyone knew it is no more. The capital is burning, the ministries have scattered, and the men who signed our orders are either dead or looking for someone to swear allegiance to.\n\nEgor Rom ordered that the portraits stay on the walls and the flags stay up - for now. The governors gathered in the hall without an agenda: for the first time in the history of the oilfields there was no one to report to. Tankers wait at the piers of South Harbour with cargo nobody will pay for. Quotas, concessions, garrison wages - everything that bound the colony to the metropole was cut in a single night.\n\nThe neighbours have understood it too. In Eflor and Azhar they already say that Svetlogorye's oil has no master. Veter's underground is celebrating: the enemy it named its first has vanished before anyone could overthrow it. From now on we answer for the oilfields, the city and every seal ourselves. No one will come to save us - and no one will tell us how to live again."
 ADISCORD_nam_resource_war.80.a: "We are on our own."
 NAM_center_vanished_tt: "Colonial programmes close: the metropolitan concession stops paying and the 'Colony of Vorkerland' category disappears.\nNew national focus branches open for an independent Svetlogorye.\nNext, the chancery gathers to sign the declaration of independence."
 ADISCORD_nam_resource_war.81.t: "Flight to the Islands"
 ADISCORD_nam_resource_war.81.d: "The last transports left South Harbour at night, without lights. On the piers stayed those for whom there was no room: companies that fought their way from the northern fields too late, supply columns, wounded men who could not be carried up the gangways. Officers called names from the lists, and every line struck through meant a man left to the mercy of the victors.\n\nThere was nowhere to load the equipment. It was pushed off the piers straight into the water: guns, lorries, crates of rifles and ammunition. Quartermasters signed write-off reports until a glow rose over the port - Rom had ordered that the enemy should not find a single working barrel. The sappers left last. Behind them pumping stations burned, gantries fell and the depots on the oilfields went up in flames. The coalition will get our land, but it will get it scorched.\n\nAt dawn the islands met the exiles with a cold wind and empty barracks. There is no oil here and almost no industry, only steel, harbours and the sea. The government of Svetlogorye lives as long as its flag flies over the islands. What remains is to decide what it will become: a refuge for the defeated or a springboard for the return."
 ADISCORD_nam_resource_war.81.a: "We will return to South Harbour."
 ADISCORD_nam_resource_war.81.b: "First, survive."
 NAM_exile_evacuation_tt: "Evacuation: of §Y[?NAM_exile_divisions_before|0]§! divisions, §R[?NAM_exile_divisions_lost|0]§! were left on the mainland. §Y[?NAM_exile_divisions_after|0]§! divisions are in exile: those that crossed kept their own composition and are gathered at the island capital.\nThere are not enough weapons for everyone: every division on the islands has lost §R45%§! of its strength and §R50%§! of its organisation.\nDumped into the sea: §R[?NAM_exile_rifles_dumped|0]§! £infantry_equipment_texticon and §R[?NAM_exile_heavy_dumped|0]§! units of support equipment and artillery.\nThe oilfields, roads and South Harbour are burnt: the fields yield no resources to their new owners for §Y180§! days."
 NAM_exile_vow_tt: "Readiness for the return: §G+10§!."
 NAM_exile_salvage_tt: "Salvaged cargo: §G+40§! loot."
 ADISCORD_nam_resource_war.82.t: "Veter's Leaflets"
 ADISCORD_nam_resource_war.82.d: "In the morning the workers of the Northern Deposits found leaflets in every changing room, in the canteen and even in the foreman's hut. There is one signature - Yaroslav Veter. The text is short: the oilfields belong to those who work them, and the governors are temporary guests it is time to see off. The gendarmes tore the leaflets down by noon, but by evening they were being retold in every workers' settlement.\n\nThe underground no longer hides in cellars. It has printing presses, couriers and its own people in the oilfield offices. The chancery awaits a decision: go through the lists before the network grows, or buy off the districts before their discontent becomes someone else's banner."
 ADISCORD_nam_resource_war.82.a: "Arrests from the gendarmerie lists."
 ADISCORD_nam_resource_war.82.b: "Money for the districts' schools and hospitals."
 ADISCORD_nam_resource_war.82.c: "Paper will put up with anything."
 NAM_ug_82_a_tt: "Underground: §G-10§!.\nDistrict support: §R-5§! £NAM_support_dist_texticon."
 NAM_ug_82_b_tt: "Treasury: §R-100§! £ADISCORD_economy_treasury_texticon.\nUnderground: §G-5§!.\nDistrict support: §G+6§! £NAM_support_dist_texticon."
 NAM_ug_ignore_tt: "The underground keeps growing."
 ADISCORD_nam_resource_war.83.t: "Strike on the Oilfields"
 ADISCORD_nam_resource_war.83.d: "The pumps stopped in three shifts at once. The strike committee, behind which everyone sees Veter's hand, demands the withheld wages, the cancellation of the governors' fines and the release of the arrested. Until the demands are met, the oil will go neither into tank cars nor into tankers.\n\nThe garrisons are ready to drive the workers back by force, but their commanders warn that every arrest turns a silent sympathiser into a fighter of the underground. The oilmen are counting their losses and ask for the matter to be settled by the end of the week."
 ADISCORD_nam_resource_war.83.a: "Break up the committee, arrest the ringleaders."
 ADISCORD_nam_resource_war.83.b: "Pay the debts and cancel the fines."
 ADISCORD_nam_resource_war.83.c: "Wait until their money runs out."
 NAM_ug_83_a_tt: "Underground: §G-15§!.\nDistrict support: §R-10§! £NAM_support_dist_texticon."
 NAM_ug_83_b_tt: "Treasury: §R-200§! £ADISCORD_economy_treasury_texticon.\nUnderground: §G-8§!.\nDistrict support: §G+8§! £NAM_support_dist_texticon.\nOil worker support: §G+4§! £NAM_support_oil_texticon."
 NAM_ug_83_c_tt: "Oil worker support: §R-6§! £NAM_support_oil_texticon."
 ADISCORD_nam_resource_war.84.t: "The City Is Ready to Rise"
 ADISCORD_nam_resource_war.84.d: "The gendarmerie reports no longer read like reports: they are a map of the coming uprising. In Svetlogorsk weapons are kept in cellars and attics, Veter has his own block commanders, and after sunset the patrols avoid the workers' quarters. A single shot would be enough to bring the city into the streets.\n\nThe commandant asks to send troops into the city and declare martial law. Rom's advisers whisper something else: Veter is still ready to talk if given a reason. Delay means only one thing - the next spark may be the last."
 ADISCORD_nam_resource_war.84.a: "Send the garrisons into Svetlogorsk."
 ADISCORD_nam_resource_war.84.b: "Open a secret channel to Veter."
 ADISCORD_nam_resource_war.84.c: "Wait."
 NAM_ug_84_a_tt: "Underground: §G-20§!.\nGarrison support: §G+5§! £NAM_support_garr_texticon.\nDistrict support: §R-10§! £NAM_support_dist_texticon.\nIf the ladder of seals already exists, it shifts §Y0.05§! towards the vertical."
 NAM_ug_84_b_tt: "Treasury: §R-150§! £ADISCORD_economy_treasury_texticon.\nUnderground: §G-15§!.\nDistrict support: §G+8§! £NAM_support_dist_texticon.\nNamestnik support: §R-8§! £NAM_support_nam_texticon."
 NAM_ug_84_c_tt: "Underground: §R+5§!."
 ADISCORD_nam_resource_war.85.t: "Fire on the Oilfield"
 ADISCORD_nam_resource_war.85.d: "During the night a trunk pipeline valve exploded on the oilfield in [NAM_ug_field.GetName]. The firemen put out the flames only by morning, but two wells burnt out and the pumping station stands without a roof. On the scorched wall someone had chalked the familiar sign of the underground.\n\nThe field manager asks for money for repairs, the gendarmes for permission to raid the surrounding settlements. The governor advises calling it an accident: to admit sabotage is to admit that Veter can strike anywhere."
 ADISCORD_nam_resource_war.85.a: "Repair crews, at once."
 ADISCORD_nam_resource_war.85.b: "Raids on the surrounding settlements."
 ADISCORD_nam_resource_war.85.c: "Put it down to worn equipment."
 NAM_ug_85_a_tt: "The fire has already lowered the field's condition by §R15§!.\nTreasury: §R-100§! £ADISCORD_economy_treasury_texticon.\nField condition: §G+10§!.\nOil worker support: §G+3§! £NAM_support_oil_texticon."
 NAM_ug_85_b_tt: "The fire has already lowered the field's condition by §R15§!.\nUnderground: §G-8§!.\nDistrict support: §R-6§! £NAM_support_dist_texticon."
 NAM_ug_85_c_tt: "The fire has already lowered the field's condition by §R15§!.\nUnderground: §R+3§!."
 ADISCORD_nam_resource_war.86.t: "Raid on the Arsenal"
 ADISCORD_nam_resource_war.86.d: "The garrison depot at the crossroads was taken without a single shot: the sentries were found tied up, the gates opened with a key of their own, and the underground's lorry left for the hills an hour before the guard changed. The inventory counted [?NAM_ug_rifles_stolen|0] rifles missing, and every one of them is now in Veter's hands.\n\nThe tracks are still fresh, and the mounted gendarmerie is ready to follow them. The chief of the rear proposes something else: double the guard on every depot before the underground comes back for the rest. There is a third opinion too - that these rifles will never be found."
 ADISCORD_nam_resource_war.86.a: "Pursue them while the tracks are fresh."
 ADISCORD_nam_resource_war.86.b: "Double the depot guards."
 ADISCORD_nam_resource_war.86.c: "Do not chase ghosts."
 NAM_ug_86_a_tt: "§R[?NAM_ug_rifles_stolen|0]§! £infantry_equipment_texticon stolen, the underground grew by §R4§!.\nEven odds: recover §G1000§! £infantry_equipment_texticon and weaken the underground by §G6§! - or lose §R500§! £manpower_texticon in an ambush."
 NAM_ug_86_b_tt: "§R[?NAM_ug_rifles_stolen|0]§! £infantry_equipment_texticon stolen, the underground grew by §R4§!.\nTreasury: §R-100§! £ADISCORD_economy_treasury_texticon.\nGarrison support: §G+4§! £NAM_support_garr_texticon.\nThe depots will not be raided for §Y180§! days."
 NAM_ug_86_c_tt: "§R[?NAM_ug_rifles_stolen|0]§! £infantry_equipment_texticon stolen, the underground grew by §R4§!.\nUnderground: §R+3§!.\nDistrict support: §G+2§! £NAM_support_dist_texticon."
 ADISCORD_nam_resource_war.87.t: "Attempt on a Governor"
 ADISCORD_nam_resource_war.87.d: "The governor of the South Coast was shot on the steps of his own office, in broad daylight, in front of the petitioners. The gunman escaped through the market, and by evening leaflets with the sentence were going round the city: 'for the levies, for the quotas, for our children on the oilfields'. Veter's signature stood at the bottom like a seal under a decree.\n\nThe governors demand an answer every district will remember. The districts wait to see whether reprisals without trial will begin. Rom understands that whatever the chancery does, it will be read as the answer to a single question: who really holds power in Svetlogorye."
 ADISCORD_nam_resource_war.87.a: "Martial law in the districts."
 ADISCORD_nam_resource_war.87.b: "A funeral and an honest investigation."
 ADISCORD_nam_resource_war.87.c: "Hush the matter up."
 NAM_ug_87_a_tt: "Underground: §G-10§!.\nNamestnik support: §G+6§! £NAM_support_nam_texticon.\nDistrict support: §R-8§! £NAM_support_dist_texticon.\nIf the ladder of seals already exists, it shifts §Y0.05§! towards the vertical."
 NAM_ug_87_b_tt: "Underground: §G-5§!.\nNamestnik support: §G+3§! £NAM_support_nam_texticon."
 NAM_ug_87_c_tt: "Namestnik support: §R-8§! £NAM_support_nam_texticon."
 NAM_piracy: "Flotillas of the Exile"
 NAM_piracy_desc: "Loot: §Y[?NAM_pirate_loot|0]§!. Notoriety: §Y[?NAM_pirate_notoriety|0]§! / 100 - [NAMGetPirateNotoriety].\nFlotillas at sea: §Y[?NAM_pirate_raids_active|0]§! of §Y[?NAM_pirate_raid_slots|0]§!.\nReadiness for the return: §Y[?NAM_revenge_readiness|0]§! / 100. Marines: §Y[?NAM_marine_orders_paid|0]§! of §Y[?NAM_marine_order_cap|0]§! trained. [NAMGetLandingForecast]\n\nA raid along the neighbouring coasts lasts §Y15§! days, brings loot and raises notoriety; notoriety falls by §Y3§! each month. From §Y50§! the coalition may close the harbours with a blockade, from §Y75§! it may shell the islands. A war of return from exile begins with a landing at South Harbour: §Y2§! marine divisions, a third for a trained division or with readiness for the return of §Y70§! or more."
 NAM_pirate_notoriety_quiet: "§Gwe are hardly spoken of§!"
 NAM_pirate_notoriety_known: "§Ythe ports talk about us§!"
 NAM_pirate_notoriety_wanted: "§Rthe coalition may declare a blockade§!"
 NAM_pirate_notoriety_hunted: "§Rthe coalition may shell the islands§!"
 NAM_landing_forecast_three: "Landing now: §Y3§! divisions."
 NAM_landing_forecast_two: "Landing now: §Y2§! divisions."
 NAM_pirate_raid: "Raid on Shipping"
 NAM_pirate_raid_desc: "A flotilla sails out onto the nearby trade routes of [FROM.GetName] and hunts its convoys for §Y15§! days. A successful raid brings loot and fuel, a rare one a whole caravan with arms and ships; a failed one costs a ship or a crew. The more ships we have, the surer the luck; the louder our notoriety and the fresher the memory of an earlier raid on the same country, the higher the risk. Raids on Eflor and Azhar anger the coalition most."
 NAM_cost_pirate_raid: "§Y10§! £political_power_texticon §Y1000§! £fuel_texticon"
 NAM_cost_pirate_raid_blocked: "§R10§! £political_power_texticon §R1000§! £fuel_texticon"
 NAM_cost_pirate_raid_tooltip: "§Y10§! £political_power_texticon §Y1000§! £fuel_texticon\nThe fuel returns if the raid is interrupted."
 NAM_pirate_slot_free_tt: "A flotilla is free: §Y[?NAM_pirate_raids_active|0]§! of §Y[?NAM_pirate_raid_slots|0]§! at sea, never more than §Y3§!"
 NAM_pirate_fleet_tt: "At least one ship is available"
 NAM_pirate_not_lying_low_tt: "The flotillas are not lying low after the coalition's answer"
 NAM_pirate_target_valid_tt: "No other raid is under way against this country, and it is neither an ally nor a subject of Svetlogorye"
 NAM_pirate_raid_started_tt: "A flotilla puts to sea and takes one raid place."
 NAM_pirate_raid_result_tt: "Outcome of the raid:\n- success: §G+50§! loot (§G+60§! from coalition convoys) and §G+1000§! £fuel_texticon; notoriety §R+6§! (§R+10§! against Eflor and Azhar);\n- rich prize: §G+100§! loot, §G+2000§! £fuel_texticon, §G+1000§! £infantry_equipment_texticon and §G+3§! £convoy_texticon; notoriety §R+8§! (§R+12§!);\n- failure: a patrol ship or §R1000§! £manpower_texticon lost; notoriety §R+3§! (§R+5§!)."
 NAM_pirate_raid_refund_tt: "Raid interrupted: §G1000§! £fuel_texticon return and the raid place is freed. Political power is not refunded."
 NAM_pirate_buy_arms: "Black-Market Rifles"
 NAM_pirate_buy_arms_desc: "Dealers in foreign ports gladly trade loot for weapons whose origin is better left unasked."
 NAM_cost_pirate_arms: "§Y40§! loot"
 NAM_cost_pirate_arms_blocked: "§R40§! loot"
 NAM_cost_pirate_arms_tooltip: "§Y40§! loot"
 NAM_pirate_spend_40_tt: "Loot: §R-40§!."
 NAM_pirate_buy_heavy_arms: "Black-Market Heavy Weapons"
 NAM_pirate_buy_heavy_arms_desc: "Guns and support equipment cost more and take longer to arrive, but without them a landing cannot hold its beachhead."
 NAM_cost_pirate_heavy_arms: "§Y70§! loot"
 NAM_cost_pirate_heavy_arms_blocked: "§R70§! loot"
 NAM_cost_pirate_heavy_arms_tooltip: "§Y70§! loot"
 NAM_pirate_spend_70_tt: "Loot: §R-70§!."
 NAM_pirate_buy_convoys: "Captured Transports"
 NAM_pirate_buy_convoys_desc: "Shipowners who cannot pay their harbour dues sell their vessels together with their crews. Both the islands and the future landing need transports."
 NAM_cost_pirate_convoys: "§Y60§! loot"
