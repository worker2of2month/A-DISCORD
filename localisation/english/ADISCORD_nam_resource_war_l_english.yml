 NAM_treasury_chancellery: "Treasury Chamber"
 NAM_treasury_chancellery_desc: "Svetlogorye's treasury receives a chamber of its own. Money can now be borrowed, raised by decree or invested - if one knows the price."
 NAM_machine_imports: "Machine Imports"
 NAM_machine_imports_desc: "The chamber negotiates the purchase of machine tools for oil. Each batch becomes a new factory in South Harbour."
 NAM_fuel_inspectorate: "Oil Inspectorate"
 NAM_fuel_inspectorate_desc: "Inspectors find more oil at the fields than the reports showed."
 NAM_patronage_fund: "Patronage Fund"
 NAM_patronage_fund_desc: "Group loyalty can be bought. The fund does so openly and by tariff."
 NAM_emergency_fund: "Emergency Fund"
 NAM_emergency_fund_desc: "Money set aside settles any incident without bargaining."
 NAM_treasury_balance: "Balanced Treasury"
 NAM_treasury_balance_desc: "The treasury has learned to collect as much as it spends. The surplus goes to development."
 NAM_crisis_office: "Incident Office"
 NAM_crisis_office_desc: "Fires, strikes and scandals no longer catch the chancellery off guard. The office prepares measures in advance."
 NAM_field_firefighters: "Oilfield Fire Brigades"
 NAM_field_firefighters_desc: "Every oil field receives a fire brigade and a stock of foam."
 NAM_customs_guard: "Customs Guard"
 NAM_customs_guard_desc: "The guard intercepts contraband and shares the seizures with the treasury."
 NAM_strike_mediators: "Mediators"
 NAM_strike_mediators_desc: "Mediators settle with strikers more cheaply than any chancellery concession."
 NAM_chancellery_purge: "Purge of the Chancellery"
 NAM_chancellery_purge_desc: "An audit removes the greediest from the chancellery. The namestniks are displeased, the districts glad."
 NAM_crisis_doctrine: "Emergency Statute"
 NAM_crisis_doctrine_desc: "Every misfortune has a procedure. Incidents happen less often and cost less."
