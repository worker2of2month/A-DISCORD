 NAM_line_built_tt:0 "If the district is still owned and controlled by us and has a land border with another country, each border province receives level §Y1§! forts, while border towns with victory points receive level §Y2§! forts. Otherwise, the deposit returns to the treasury. After losing and recovering the district, its line can be prepared again at full price."
 NAM_line_refund_tt: "Work interrupted: §G100§! £ADISCORD_economy_treasury_texticon return to the treasury and the slot is released. Political power is not refunded."
 NAM_scorch_wells: "Scorch the Wells"
 NAM_scorch_wells_desc: "Retreating units have received a harsh order: put the oilfield out of action. Engineers are preparing demolition charges while foremen try to evacuate workers and records."
 NAM_scorch_threat_tt: "The front has reached the field: part of the district or a neighbouring district is held by the enemy"
 NAM_scorch_wells_tt:0 "The field yields no resources and serves no oil contracts for §Y180§! £time_texticon; condition is reduced to at most §R10/100§!.\nWhile controlled by an enemy at war with us during the resource war: their army speed §G-20%§!, attrition §G+15%§!, local supply §G-1§!. Liberation ends these military penalties; fires and damage remain.\nThe wells do not contribute to Svetlogorye's capture penalty until the fires end. Oil workers: §R-10§! £NAM_support_oil_texticon; seal discipline: §R-5§!."
 NAM_hold_field_67: "Hold the Northern Deposits"
