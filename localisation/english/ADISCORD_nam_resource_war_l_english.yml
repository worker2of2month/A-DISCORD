 ADISCORD_nam_resource_war.11.t: "A Map in Place of the Ledger"
 ADISCORD_nam_resource_war.11.d: "The duty officer spread a map of the roads to the oilfields before Rom. The reports did not yet make it clear where units stood and where communications were merely delayed. Rom asked that the time be recorded for each message. When he asked about the road to the Northern Deposits, he was given a number of battalions. He repeated the question: could supply trucks get through?\n\nThe staff expected the governor to approve the prepared orders. Rom recognised the routine: first an account of the situation, then the decision they wanted from their superior. Here a mistake could cost the lives of people he had never seen. He asked them to separate confirmed information from assumptions and let the officers finish their briefing.\n\nThe war's diplomatic limit is 420 days after hostilities begin. By then the mediators will add up the oil of the fields that remain with Svetlogorye: the Northern Deposits count 80, the South Coast 36, Sukhorechye 24, East Sukhorechye 12, the Svetlogorsk District 12. A hundred or more together with a captured border district of Eflor or Azhar means recognised independence and a new border; a hundred or more without such a district means a standoff on the old border, with no recognition treaty. 36 to 99 brings a compromise peace with cessions and tribute. Less than 36 costs the whole mainland: the government will withdraw to the islands, and without islands the country will be partitioned. The war can end earlier: by the enemies' capitulation or ours, by a week of holding every border district of the neighbours together with our own fields, or by a week in which the enemy holds the Northern Deposits and one more field. A countdown and orders to hold the fields have appeared among the decisions.\n\nSvetlogorsk remains a separate question. A paid compact that had operated for sixty days before the attack prevents the uprising. Without it, everything depends on the strength of the underground. The emergency focus branch is available immediately, regardless of unfinished peacetime plans.\n\nAnother signalman waited by the telephone. Rom moved his cup away from the edge of the map and asked to be connected to the supply staff."
 ADISCORD_nam_resource_war.11.d_successor: "Svetlogorye's staff no longer debates the wording of the ultimatum. An officer spreads out a map of the roads to the fields: the Northern Deposits, the Svetlogorsk District, the South Coast, Sukhorechye and East Sukhorechye. Every field held will become a line in the future peace treaty.\n\nThe war's diplomatic limit is 420 days after hostilities begin. By then the mediators will add up the oil of the fields that remain with Svetlogorye: the Northern Deposits count 80, the South Coast 36, Sukhorechye 24, East Sukhorechye 12, the Svetlogorsk District 12. A hundred or more together with a captured border district of Eflor or Azhar means recognised independence and a new border; a hundred or more without such a district means a standoff on the old border, with no recognition treaty. 36 to 99 brings a compromise peace with cessions and tribute. Less than 36 costs the whole mainland: the government will withdraw to the islands, and without islands the country will be partitioned. The war can end earlier: by the enemies' capitulation or ours, by a week of holding every border district of the neighbours together with our own fields, or by a week in which the enemy holds the Northern Deposits and one more field. A countdown and orders to hold the fields have appeared among the decisions.\n\nSvetlogorsk remains a separate question. A paid compact that had operated for sixty days before the attack prevents the uprising. Without it, everything depends on the strength of the underground. The emergency focus branch is available immediately, regardless of unfinished peacetime plans."
 ADISCORD_nam_resource_war.11.a: "Let us hear from the supply staff."
 ADISCORD_nam_resource_war.12.t: "The Postwar Meeting"
 ADISCORD_nam_resource_war.12.d: "After the treaty was signed, Mezentsev reread the article recognising Svetlogorye. Eflor and Azhar had recognised its independence. Their alliance survived and border units remained in position, but negotiations could now refer to a concluded agreement. Rom asked whether its terms had been circulated to the districts: they still knew more rumours than details.\n\nAt the meeting on postwar government, the heads of offices began with shortages of people and materials. Then it emerged that they proposed keeping some wartime orders in force. The district representatives demanded a deadline: many questions had been postponed during the fighting, and now they wanted to know who would control local revenues and hear complaints.\n\nRom was accustomed to using temporary powers. They had let him cut through approvals and get things done; without them he would have to persuade people he could have ordered yesterday. He did not consider every objection reasonable, but he remembered how each new necessity in Vorkerland had postponed the promised return to ordinary government.\n\nThe course chosen before the war must be established in law. The administrative hierarchy will retain the central government's leading role; a charter will give the districts defined rights. If the choice has been deferred, it must now be made. Rom asked the authors of both drafts to explain what powers they left to the government and where someone could appeal against its decisions. They would discuss one article at a time, starting with the procedure for hearing complaints."
 ADISCORD_nam_resource_war.12.d_standoff_successor: "The war has ended on the old border. Eflor and Azhar have not signed a treaty recognising Svetlogorye's independence; their alliance survives. Military depots need replenishing, and the districts await repairs and a return to ordinary government.\n\nAt the postwar meeting, heads of offices propose keeping some emergency powers. District representatives demand limits on those powers and a procedure for appealing decisions. The prewar course must be established in law without waiting for a treaty with the neighbours: the administrative hierarchy will retain the central government's leading role, while a charter will define the districts' rights. If the choice has been deferred, it must now be made."
 ADISCORD_nam_resource_war.12.d_successor: "Eflor and Azhar have recognised Svetlogorye's independence. Their alliance survives and troops remain at the border. Military depots need replenishing; the districts await repairs and a return to ordinary government.\n\nAt the postwar meeting, heads of offices propose keeping some emergency powers. District representatives demand limits on those powers and a procedure for appealing decisions. The prewar course must be established in law: the administrative hierarchy will retain the central government's leading role, while a charter will define the districts' rights. If the choice has been deferred, it must now be made."
 ADISCORD_nam_resource_war.12.d_standoff: "Mezentsev returned the announcement of the war's end to Rom: the word 'recognition' had to be crossed out. Eflor and Azhar had agreed to stop at the old border, but had not confirmed Svetlogorye's independence by treaty. Rom instructed that this be explained plainly to the districts. After so many promises, announcing an achievement they had not secured seemed particularly unwise.\n\nAt the meeting on postwar government, the heads of offices began with shortages of people and materials. Then it emerged that they proposed keeping some wartime orders in force. The district representatives demanded a deadline: many questions had been postponed during the fighting, and now they wanted to know who would control local revenues and hear complaints.\n\nRom was accustomed to using temporary powers. They had let him cut through approvals and get things done; without them he would have to persuade people he could have ordered yesterday. He did not consider every objection reasonable, but he remembered how each new necessity in Vorkerland had postponed the promised return to ordinary government.\n\nThe course chosen before the war must be established in law. The administrative hierarchy will retain the central government's leading role; a charter will give the districts defined rights. If the choice has been deferred, it must now be made. Rom asked the authors of both drafts to explain what powers they left to the government and where someone could appeal against its decisions. They would discuss one article at a time, starting with the procedure for hearing complaints."
 ADISCORD_nam_resource_war.12.a: "Let us discuss the law."
 ADISCORD_nam_resource_war.13.t: "The Meeting Continues"
 ADISCORD_nam_resource_war.13.d: "Half an hour had been set aside for a meeting with the national university's leadership, district representatives and oilfield managers. The university wanted to invite lecturers and engineers; the institutions had not yet agreed who would pay for their travel and housing. Rom had hoped to hear everyone before his evening appointments, but the conversation stalled at the first question.\n\nOne university official suggested referring to the old Vorkerland regulation. It left the decision to the administration. A district representative asked who would then pay to house the visiting specialists. An oilfield manager wanted to know whether the invited engineers could combine teaching with work for him. Rom listened and made brief notes. He was more at home in this discussion than at a military council.\n\nHe knew the old regulation. Its convenience lay in allowing appointments to be made before all the costs were known. When complaints began, another office had to answer them. Rom had already opened his mouth to suggest the familiar procedure, but instead asked them to finish calculating housing and salaries first. The manager reminded him of the deadlines.\n- That is why I am asking now, Rom replied. Who receives this person, and from what funds will they be paid?\n\nThe half hour had passed. People in the waiting room were asking whether the next appointments would go ahead. Rom asked his secretary to explain the delay and stayed at the table. The law on postwar government was in force, the university had begun work, factories needed orders and those returning home needed a living. They still had to agree on arrangements they could actually carry out.\n\nThe university official named a sum. Mezentsev asked whether it included the upkeep of the housing. Rom returned to his first note and asked them not to move on until this question was settled."
 ADISCORD_nam_resource_war.13.d_successor: "The archive found an old form: a foreign capital's emblem, a governor's signature and a long list of approvals. A young clerk asked whether the blank reverse could be reused. The archivist agreed.\n\nNew forms discuss the institute, district budgets, factory orders and people coming home. Arguments have not disappeared. Some think the administration too strong; others fear it is too weak. Troops still stand at the border. But the arguments now have an addressee here, inside the country.\n\nThe civil office continues receiving visitors. People come to ask about work, housing and the return of their relatives. Institutions must put the adopted laws into practice and answer these questions."
 ADISCORD_nam_resource_war.13.a: "Clarify the costs."
 ADISCORD_nam_resource_war.70.t: "Rom's Address"
 ADISCORD_nam_resource_war.70.t_successor: "Government Address"
 ADISCORD_nam_resource_war.70.d: "There were a few minutes left before the broadcast. Rom asked the technician to read the first line from his seat; he wanted to know how loudly he needed to speak. A familiar official greeting came from the loudspeaker next door, in someone else's voice. Rom winced and crossed out the address to 'heads of districts and administrations'. The amended version began with the residents of Svetlogorye.\n\nThree drafts lay on the desk. The governors proposed assuring the country that offices and garrisons were performing their duties and that orders remained in force. The district representatives and oil workers' artels wanted to hear when local revenues would serve those who lived and worked here. The officers demanded a clear statement to the neighbours that the fields would be defended. Every draft bore the names of people the government could not manage without.\n\nRom tried combining them. The resulting speech promised everyone money, left everyone's powers intact and made security cost nothing. He read halfway through and returned to the separate sheets. During the revolution, promises like these had sounded convincing. Later he himself had had to explain to petitioners why what they had been promised could not yet be delivered.\n\nThe technician signalled that the connection was ready. People at the fields and ports were waiting, including those who had never visited his office. Rom left his marked-up text beside the microphone. Without it he might spend too long explaining the circumstances and never say what he intended to do. He needed to choose his priority: keep the administration functioning, put local needs before other expenditure, or affirm the determination to defend the fields."
 ADISCORD_nam_resource_war.70.d_successor: "For the first time the Svetlogorsk radio station was switched through to every oilfield at once. In the Klyuchevsk barracks the bunks were pushed towards the loudspeakers, loading stopped in the South Harbour, and in the chancellery the clerks stood in the corridor because the offices had run out of chairs. The government is preparing an address; three drafts of the speech lie on the desk.\n\nThe governors had written the first: about order, about seals that no longer answer to a distant capital, and about a country held together by people who know how to carry out an order. The district representatives and the oil workers' artels had brought the second: Svetlogorye's oil must feed those who extract it, not only those who sign for it. The garrison officers had sketched the third, short as a report: the neighbours are waiting for us to weaken, and we will not give them a single well.\n\nListeners will judge the government's intentions by its priorities. The administration wants its powers confirmed, residents want attention to local needs, and garrisons want support in defending the fields."
 ADISCORD_nam_resource_war.70.a: "Affirm the authority of administrations and garrisons."
 ADISCORD_nam_resource_war.70.b: "Put residents and oilfields first."
 ADISCORD_nam_resource_war.70.c: "Affirm our readiness to defend the fields."
