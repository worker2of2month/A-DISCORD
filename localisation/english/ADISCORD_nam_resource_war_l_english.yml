 NAM_exile_drill: "Drill on the Island Beaches"
 NAM_exile_drill_desc: "§YCOST§!: §Y20§! £political_power_texticon §Y30§! [NAMGetDrillCurrency]\n§YCOMPLETION§!: §Y30§! £time_texticon days\n§YCOOLDOWN§!: §Y15§! £time_texticon days after completion.\n\n§YRESULT§!\nBoat landings, pier assaults and night marches prepare the exiles' return.\nOn completion: §G+15§! £army_experience, readiness for the return §G+10§!.\n\n§YIF INTERRUPTED§!\nThe deposit is refunded; political power is not refunded."
