 NAM_bw_support_rules:0 "Loyalty of the pillars: §Y[?NAM_loyalty|0]§! / 100\nTotal from the pillars: ([?NAM_loy_political_power_gain|=+2] £political_power_texticon /day, [?NAM_loy_stability_factor|=+1%] £stability_texticon).\n\nNamestniks: §Y[?NAM_grp_nam_support|0]§! ([NAMGetNamestnikSupportEffect]) (influence §Y[?NAM_grp_nam_influence|0]§!)\nOil workers: §Y[?NAM_grp_oil_support|0]§! ([?NAM_loy_fuel_gain_factor|=+0%] £fuel_texticon) (influence §Y[?NAM_grp_oil_influence|0]§!)\nDistricts: §Y[?NAM_grp_dist_support|0]§! ([NAMGetDistrictSupportEffect]) (influence §Y[?NAM_grp_dist_influence|0]§!)\nGarrisons: §Y[?NAM_grp_garr_support|0]§! ([?NAM_loy_army_org|=+0%] £organization_texticon) (influence §Y[?NAM_grp_garr_influence|0]§!)\nExport houses: §Y[?NAM_grp_trade_support|0]§! ([?NAM_loy_trade_income|=+0%] £ADISCORD_economy_trade_texticon) (influence §Y[?NAM_grp_trade_influence|0]§!)\n\nLoyalty above 50 increases political power and stability; below 50 it reduces them. A group with 70 support or more grants a bonus, 25 or less a penalty. Once a month every group's support moves 0.5 towards 50. At 20 a group grows restless; at 85 it presents a demand.\n\nA pillar with §Y70§! support or more can trade §Y15§! support for a §Y120-day§! favour. After independence, every §Y120 days§! the rival of the weakest pillar names a term; a refusal costs that pillar §Y15§! support, and an unheard rival of a pillar below §Y25§! will claim power."
 NAM_bw_programme_rules:0 "Svetlogorsk compact: [NAMGetCompactStatus].\n\nOil throughput: §Y[?NAM_oil_throughput|0]§! units, §Y[?NAM_oil_committed|0]§! committed (contracts: §Y[?NAM_oil_contracts|0]§!). Free for overland buyers: §Y[?NAM_oil_free_land_units|0]§!, for overseas buyers: §Y[?NAM_oil_free_units|0]§!. Field projects: §Y[?NAM_projects_in_progress|0]§! of §Y[?NAM_project_slots|0]§!.\n\nFocuses establish institutions; paid programmes turn authority into deliveries and services. Restitution pressure brings the resource war closer. During it, hold as much oil as possible by §Yday 420§!: §Y100§! points or more keep independence (together with a captured border district of the neighbours, also a recognition treaty and a new border), §Y36§! to §Y99§! lead to a compromise peace, below §Y36§! to partition. Capitulation of the enemies ends the war earlier."
