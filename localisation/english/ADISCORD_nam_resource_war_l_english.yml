  # Piracy window
 NAM_pw_loot_label:0 "Loot"
 NAM_pw_loot_value:0 "§Y[?NAM_pirate_loot|0]§!"
 NAM_pw_loot_tt:0 "§YFLOTILLA LOOT§!\n- Successful raid: §G+50§! loot.\n- Eflor and Azhar convoys: §G+60§! loot.\n- Rich prize: §G+100§! loot.\n\n§YSPENDING§!\nLoot pays for the black market, drills and marines; fences exchange it for treasury. Buttons below the map show exact prices and results."
 NAM_pw_coalition_label:0 "Coalition"
 NAM_pw_coalition_value:0 "[NAMPwCoalition]"
 NAM_pw_coalition_blockade:0 "§Rblockade§!"
 NAM_pw_coalition_lying_low:0 "§Ywe lie low§!"
 NAM_pw_coalition_hunted:0 "§Rthreatens a raid§!"
 NAM_pw_coalition_wanted:0 "§Rthreatens a blockade§!"
 NAM_pw_coalition_calm:0 "§Gcalm§!"
 NAM_pw_coalition_tt:0 "Every raid raises notoriety; it falls by §Y3§! each month. Raids on Eflor's and Azhar's lanes anger the coalition most.\nFrom §Y50§! the coalition may close the harbours with a §Y90§!-day blockade: raid success §Rx0.7§!, failure §Rx1.3§!. From §Y75§! it may shell the islands. After its answer the flotillas may lie low for a while, and no new raid can start.\n\nNow: notoriety §Y[?NAM_pirate_notoriety|0]§! / 100 - [NAMGetPirateNotoriety]."
 NAM_pw_landing_label:0 "Landing"
 NAM_pw_landing_value:0 "[NAMPwLandingShort]"
 NAM_pw_landing_three:0 "§Y3§! divisions"
 NAM_pw_landing_two:0 "§Y2§! divisions"
 NAM_pw_landing_tt:0 "The war of return opens with a landing at South Harbour: §Y2§! marine divisions, a third if at least one order is prepared or readiness for the return is §Y70§! or more. Further trained divisions form in the island capital.\n\n[NAMGetLandingForecast]"
 NAM_pw_map_legend:0 "Yellow - lane open, red - a flotilla at sea, blue - escorted convoys, grey - lane closed. An anchor sends a flotilla."
 NAM_pw_islands_label:0 "Islands of exile"
 NAM_pw_lane_oil_name:0 "Oil Run"
 NAM_pw_lane_coast_name:0 "Northern Coast Run"
 NAM_pw_lane_strait_name:0 "Luren Strait"
 NAM_pw_lane_crossing_name:0 "Charden Ferry"
 NAM_pw_route_oil_tt:0 "§YOil Run§!: tankers of [AZH.GetName] bound for the bay of [EFL.GetName] past the eastern cape of the main island.\n[NAMPwLaneOilStatus]\n\nPrice: [NAMPwRaidCost]. The flotilla sails for §Y15§! days; if the raid is interrupted, the fuel returns.\n\nOutcome (base: success §Y50§!, prize §Y15§!, failure §Y35§!):\n- success: §G+60§! loot and §G+1000§! £fuel_texticon, the lane's owners lose §R2000§! £fuel_texticon between them; notoriety §R+10§!;\n- prize: §G+100§! loot, §G+2000§! £fuel_texticon, §G+9000§! £infantry_equipment_texticon, §G+3§! £convoy_texticon, the owners lose §R3000§! £fuel_texticon between them; notoriety §R+12§!;\n- failure: a patrol ship or §R1000§! £manpower_texticon; notoriety §R+5§!.\n\nChance factors:\n- [NAMPwShipsFactor]\n- [NAMPwLaneOilAlert]\n- [NAMPwBlockadeFactor]\n- [NAMPwNotorietyFactor]\n- The richest cargoes: prize §Gx1.5§!.\n\nThere is no pause between raids, but after a raid the lane's owners stay alert for §Y90§! days."
 NAM_pw_route_coast_tt:0 "§YNorthern Coast Run§!: ships of [RIV.GetName] and [EFL.GetName] along the mainland shore north of the islands.\n[NAMPwLaneCoastStatus]\n\nPrice: [NAMPwRaidCost]. The flotilla sails for §Y15§! days; if the raid is interrupted, the fuel returns.\n\nOutcome (base: success §Y50§!, prize §Y15§!, failure §Y35§!):\n- success: §G+60§! loot and §G+1000§! £fuel_texticon, the lane's owners lose §R2000§! £fuel_texticon between them; notoriety §R+10§!;\n- prize: §G+100§! loot, §G+2000§! £fuel_texticon, §G+9000§! £infantry_equipment_texticon, §G+3§! £convoy_texticon, the owners lose §R3000§! £fuel_texticon between them; notoriety §R+12§!;\n- failure: a patrol ship or §R1000§! £manpower_texticon; notoriety §R+5§!.\nWithout Eflor's ships it is a lane without the coalition: §G+50§! loot, notoriety §R+6§!, §R+8§! and §R+3§!.\n\nChance factors:\n- [NAMPwShipsFactor]\n- [NAMPwLaneCoastAlert]\n- [NAMPwBlockadeFactor]\n- [NAMPwNotorietyFactor]\n\nThere is no pause between raids, but after a raid the lane's owners stay alert for §Y90§! days."
 NAM_pw_route_strait_tt:0 "§YLuren Strait§!: ships of [ULV.GetName] and [LUR.GetName] in the strait south of the islands.\n[NAMPwLaneStraitStatus]\n\nPrice: [NAMPwRaidCost]. The flotilla sails for §Y15§! days; if the raid is interrupted, the fuel returns.\n\nOutcome (base: success §Y50§!, prize §Y15§!, failure §Y35§!):\n- success: §G+50§! loot and §G+1000§! £fuel_texticon, the lane's owners lose §R2000§! £fuel_texticon between them; notoriety §R+6§!;\n- prize: §G+100§! loot, §G+2000§! £fuel_texticon, §G+9000§! £infantry_equipment_texticon, §G+3§! £convoy_texticon, the owners lose §R3000§! £fuel_texticon between them; notoriety §R+8§!;\n- failure: a patrol ship or §R1000§! £manpower_texticon; notoriety §R+3§!.\n\nChance factors:\n- [NAMPwShipsFactor]\n- [NAMPwLaneStraitAlert]\n- [NAMPwBlockadeFactor]\n- [NAMPwNotorietyFactor]\n\nThere is no pause between raids, but after a raid the lane's owners stay alert for §Y90§! days."
 NAM_pw_route_crossing_tt:0 "§YCharden Ferry§!: ships of [CHD.GetName] between the islands to the bay of [RIV.GetName].\n[NAMPwLaneCrossingStatus]\n\nPrice: [NAMPwRaidCost]. The flotilla sails for §Y15§! days; if the raid is interrupted, the fuel returns.\n\nOutcome (base: success §Y50§!, prize §Y15§!, failure §Y35§!):\n- success: §G+50§! loot and §G+1000§! £fuel_texticon, the lane's owners lose §R2000§! £fuel_texticon between them; notoriety §R+6§!;\n- prize: §G+100§! loot, §G+2000§! £fuel_texticon, §G+9000§! £infantry_equipment_texticon, §G+3§! £convoy_texticon, the owners lose §R3000§! £fuel_texticon between them; notoriety §R+8§!;\n- failure: a patrol ship or §R1000§! £manpower_texticon; notoriety §R+3§!.\n\nChance factors:\n- [NAMPwShipsFactor]\n- [NAMPwLaneCrossingAlert]\n- [NAMPwBlockadeFactor]\n- [NAMPwNotorietyFactor]\n\nThere is no pause between raids, but after a raid the lane's owners stay alert for §Y90§! days."
