 NAM_pirate_raid_lane_oil: "Raid the Oil Run"
 NAM_pirate_raid_lane_oil_desc: "Azhar tankers carry Black Coast oil to Eflor Bay, rounding the eastern cape of our main island. The flotilla waits off the cape while lookouts compare silhouettes with shipping guides."
 NAM_pirate_lane_oil_result_tt: "Outcome of the raid on the Oil Run:\n- success: §G+60§! loot and §G+1000§! £fuel_texticon, the lane's owners lose §R2000§! £fuel_texticon between them; notoriety §R+10§!;\n- prize: §G+100§! loot, §G+2000§! £fuel_texticon, §G+9000§! £infantry_equipment_texticon, §G+3§! £convoy_texticon, the owners lose §R3000§! £fuel_texticon between them; notoriety §R+12§!;\n- failure: a patrol ship or §R1000§! £manpower_texticon; notoriety §R+5§!.\nThe richest cargoes: prize outcome weight §Gx1.5§!.\nThe lane's owners stay alert for §Y90§! days."
 NAM_pirate_raid_lane_coast: "Raid the Northern Coast Run"
 NAM_pirate_raid_lane_coast_desc: "Coastal ships from Riven and Eflor follow the mainland shore north of the islands, within sight of our lighthouses. The flotilla intercepts them in the narrows between the shore and the islands."
 NAM_pirate_lane_coast_result_tt: "Outcome of the raid on the Northern Coast Run:\n- success: §G+60§! loot and §G+1000§! £fuel_texticon, the lane's owners lose §R2000§! £fuel_texticon between them; notoriety §R+10§!;\n- prize: §G+100§! loot, §G+2000§! £fuel_texticon, §G+9000§! £infantry_equipment_texticon, §G+3§! £convoy_texticon, the owners lose §R3000§! £fuel_texticon between them; notoriety §R+12§!;\n- failure: a patrol ship or §R1000§! £manpower_texticon; notoriety §R+5§!.\nWithout Eflor's ships it is a lane without the coalition: §G+50§! loot, notoriety §R+6§!, §R+8§! and §R+3§!.\nThe lane's owners stay alert for §Y90§! days."
 NAM_pirate_raid_lane_strait: "Raid the Luren Strait"
 NAM_pirate_raid_lane_strait_desc: "Ships from the Ulven repair yards and the common ports of Luren pass through the strait south of the islands. The flotilla takes position while shore lookouts record passing vessels."
 NAM_pirate_lane_strait_result_tt: "Outcome of the raid on the Luren Strait:\n- success: §G+50§! loot and §G+1000§! £fuel_texticon, the lane's owners lose §R2000§! £fuel_texticon between them; notoriety §R+6§!;\n- prize: §G+100§! loot, §G+2000§! £fuel_texticon, §G+9000§! £infantry_equipment_texticon, §G+3§! £convoy_texticon, the owners lose §R3000§! £fuel_texticon between them; notoriety §R+8§!;\n- failure: a patrol ship or §R1000§! £manpower_texticon; notoriety §R+3§!.\nThe lane's owners stay alert for §Y90§! days."
 NAM_pirate_raid_lane_crossing: "Raid the Charden Ferry"
 NAM_pirate_raid_lane_crossing_desc: "Cargo and mail ships from the large southern island cross the sea and pass between our islands towards Riven Bay. The flotilla waits for them in the inter-island strait."
 NAM_pirate_lane_crossing_result_tt: "Outcome of the raid on the Charden Ferry:\n- success: §G+50§! loot and §G+1000§! £fuel_texticon, the lane's owners lose §R2000§! £fuel_texticon between them; notoriety §R+6§!;\n- prize: §G+100§! loot, §G+2000§! £fuel_texticon, §G+9000§! £infantry_equipment_texticon, §G+3§! £convoy_texticon, the owners lose §R3000§! £fuel_texticon between them; notoriety §R+8§!;\n- failure: a patrol ship or §R1000§! £manpower_texticon; notoriety §R+3§!.\nThe lane's owners stay alert for §Y90§! days."
