 NAM_grp_commissioner_plan_tt:0 "Group support:\n  Namestniks: §G+6§! £NAM_support_nam_texticon\n  Oil workers: §R-4§! £NAM_support_oil_texticon"
 NAM_second_ledger_tt:0 "Immediately into the concealed reserve: §G+100§! £ADISCORD_economy_treasury_texticon.\nWhile the metropole exists, §Y45§! £ADISCORD_economy_treasury_texticon of the centre's share go into a hidden reserve every month; treasury income is not reduced.\nWhen independence is proclaimed, the reserve enters the treasury."
 NAM_grp_second_ledger_tt:0 "Group support:\n  Export houses: §G+3§! £NAM_support_trade_texticon\n  Oil workers: §G+3§! £NAM_support_oil_texticon\n  Namestniks: §R-5§! £NAM_support_nam_texticon"
 NAM_metropolitan_instructors_tt:0 "Weber's underground: §G-10§!."
 NAM_grp_metropolitan_instructors_tt:0 "Group support:\n  Garrisons: §G+4§! £NAM_support_garr_texticon"
 NAM_quiet_officer_lists_tt:0 "When independence is proclaimed: §G+3000§! £manpower_texticon, garrison support §G+6§! £NAM_support_garr_texticon."
 NAM_grp_quiet_officer_lists_tt:0 "Group support:\n  Garrisons: §G+6§! £NAM_support_garr_texticon"
 NAM_sand_runs_out_vertical_tt:0 "When independence is proclaimed, the ladder of seals shifts §Y0.10§! towards the vertical."
 NAM_sand_runs_out_districts_tt:0 "When independence is proclaimed, the ladder of seals shifts §Y0.10§! towards the districts."
 NAM_last_centre_register_reserve_tt:0 "Hidden reserve: §G+150§! £ADISCORD_economy_treasury_texticon."
 NAM_hidden_reserve_paid_tt:0 "The second ledger's hidden reserve enters the treasury: §G+[?NAM_hidden_reserve|0]§! £ADISCORD_economy_treasury_texticon."
 # ----- Defeated tree: island exile -----
 NAM_exile_mainland_contacts:0 "Couriers to the Mainland"
 NAM_exile_mainland_contacts_desc:0 "Our people stayed on the fields: foremen, teachers, former clerks. Fishing boats will carry letters and money to them and bring back news of the new masters."
 NAM_exile_armed_underground:0 "The Armed Underground"
 NAM_exile_armed_underground_desc:0 "Reports are not enough; we need deeds. The underground will receive weapons and start burning depots and cutting lines at the Northern Deposits and in South Harbour."
 NAM_exile_civic_underground:0 "Lists of the Loyal"
 NAM_exile_civic_underground_desc:0 "Not everyone who stayed is ready to shoot, but many are ready to wait. We will draw up lists of the loyal - those who will open the gates and take over the offices on the day of the return."
 NAM_exile_harbour_pilots:0 "Pilots of South Harbour"
 NAM_exile_harbour_pilots_desc:0 "A landing at South Harbour would be ruined by shoals, not guns. Pilots who fled to the islands will chart the fairways and lead the transports to the quays. The marines will land at South Harbour, and Eflor and Azhar will meet us together. The council of the pillars approves the plan: first the harbour, then the oilfields, then everything else."
 NAM_exile_voice_of_svetlogorye:0 "The Voice of Svetlogorye"
 NAM_exile_voice_of_svetlogorye_desc:0 "Every evening the island transmitter reads the names of the towns we will take back. It is heard in Svetlogorsk kitchens and in the occupiers' barracks."
 NAM_exile_klyuchevsk_strike:0 "The Klyuchevsk Strike"
 NAM_exile_klyuchevsk_strike_desc:0 "The new masters of Klyuchevsk want our oil. The drillers will stop the rigs, and every week of the strike will cost them more than any raid."
 NAM_exile_general_staff:0 "A Staff in Exile"
 NAM_exile_general_staff_desc:0 "We will form a staff from the surviving officers. It has no regiments, but it has maps of the mainland and the time to teach recruits to fight."
 NAM_exile_landing_craft:0 "Landing Barges"
 NAM_exile_landing_craft_desc:0 "Fishing barges and coasters will be refitted to carry troops."
 NAM_exile_cadre_army:0 "A Cadre Army"
 NAM_exile_cadre_army_desc:0 "A small but trained army: every soldier went through the resource war and knows what he fights for. The garrisons will back this choice."
 NAM_exile_levy_of_exiles:0 "Levy of the Exiles"
 NAM_exile_levy_of_exiles_desc:0 "There are more refugees on the islands than soldiers. Everyone who can hold a rifle goes under arms, even if the islands tire of the call-up."
 NAM_exile_arms_purchases:0 "Arms Purchases"
 NAM_exile_arms_purchases_desc:0 "The island treasury paid for a lot of rifles, guns and equipment before the defeat. It is time to collect it from the brokers' warehouses."
 NAM_exile_marine_orders:0 "Marines"
 NAM_exile_marine_orders_desc:0 "The landing will be opened by naval riflemen, not line regiments. We open orders for marine battalions and issue their first equipment."
 NAM_exile_strike_from_the_sea:0 "Strike from the Sea"
 NAM_exile_strike_from_the_sea_desc:0 "The landing will deliver the main blow. More marines and more transports - and South Harbour falls before the coalition can bring up its reserves."
 NAM_exile_strike_from_within:0 "Strike from Within"
 NAM_exile_strike_from_within_desc:0 "The landing will be small, but it will be met. Staff officers will cross to the mainland and prepare a rising for the day of the landing."
 NAM_exile_landing_school:0 "Landing School"
 NAM_exile_landing_school_desc:0 "On the island beaches we drill the landing: embarkation, crossing, going ashore under fire. Every battalion must pass it at least once."
 NAM_exile_sea_raiders:0 "Sea Hunters"
 NAM_exile_sea_raiders_desc:0 "Our fleet is small, but coalition ships sail without escort. The first hunters put to sea for other people's cargo."
 NAM_exile_fences:0 "Fences for the Loot"
 NAM_exile_fences_desc:0 "Captured cargo must become money. The harbour fences on the islands ask no questions when they are paid in advance."
 NAM_exile_letters_of_marque:0 "Letters of Marque"
 NAM_exile_letters_of_marque_desc:0 "The government issues letters to the captains: they fight under our flag and only against our enemies. The coalition will call it piracy, but foreign ports will treat us more calmly."
 NAM_exile_free_brotherhood:0 "The Free Brotherhood"
 NAM_exile_free_brotherhood_desc:0 "The captains choose their prey and share with the treasury. The catch is richer and the crews larger, but every port will talk about us."
 NAM_exile_tanker_raids:0 "Hunting the Tankers"
 NAM_exile_tanker_raids_desc:0 "Foreign tankers now carry our oil out of South Harbour. We will intercept them at the mouth of the strait - the oil will come back to us at least this way."
 NAM_exile_black_market:0 "Black Market for Arms"
 NAM_exile_black_market_desc:0 "The fences know where rifles are sold without papers. Loot buys what money cannot."
 NAM_exile_privateer_captains:0 "Privateer Captains"
 NAM_exile_privateer_captains_desc:0 "The best captains get real warships: escort ships from the island yard become the core of the raiding fleet."
 NAM_exile_hidden_anchorages:0 "Hidden Anchorages"
 NAM_exile_hidden_anchorages_desc:0 "In the bays of the small islands we fit out anchorages the coalition does not know about. Raiders will return there instead of the main port."
 NAM_exile_raider_squadron:0 "Raider Squadron"
 NAM_exile_raider_squadron_desc:0 "A light cruiser can scatter any coalition convoy. It is seen from afar, but nobody can outrun it."
 NAM_exile_wolfpacks:0 "Wolfpacks"
 NAM_exile_wolfpacks_desc:0 "Submarines strike unseen and leave before the escort arrives. The coalition will have a harder time telling where the trouble comes from."
 NAM_exile_corsair_admiralty:0 "Privateer Admiralty"
 NAM_exile_corsair_admiralty_desc:0 "Scattered crews become a fleet. The admiralty will assign the raids and prepare the ships to escort the landing."
 NAM_exile_island_chancellery:0 "Island Chancellery"
 NAM_exile_island_chancellery_desc:0 "The ministries are crowded into harbour offices. We will house the chancellery properly and build roads from the capital to the quays."
 NAM_exile_free_port:0 "A Free Port"
 NAM_exile_free_port_desc:0 "We open the harbour to every trader without duties. The treasury gets its fees, the export houses get work, and we get ships of our own."
 NAM_exile_naval_port:0 "A Naval Port"
 NAM_exile_naval_port_desc:0 "The harbour belongs to the fleet, not to traders. We will build a yard and close the quays to foreign ships."
 NAM_exile_refugee_barracks:0 "Refugee Barracks"
 NAM_exile_refugee_barracks_desc:0 "The refugees will live in barracks next to the training camps. It is cramped and hard, but every man from the barracks will join the army of the return."
 NAM_exile_refugee_homesteads:0 "Island Homesteads"
 NAM_exile_refugee_homesteads_desc:0 "We will give the refugees land and work near the capital. They will put down roots, and the islands will become a home rather than a camp."
 NAM_exile_coastal_batteries:0 "Coastal Batteries"
 NAM_exile_coastal_batteries_desc:0 "The coalition may come here as well. Coastal batteries will cover the main harbours of the islands."
 NAM_exile_island_steel:0 "Island Steel"
 NAM_exile_island_steel_desc:0 "The island mines worked at half strength while oil decided everything. Now every rifle depends on them."
 NAM_exile_island_foundry:0 "The Foundry"
 NAM_exile_island_foundry_desc:0 "Island steel will no longer be sold abroad. A foundry beside the mine will give the army weapons of its own."
 NAM_exile_overseas_districts:0 "Overseas Districts"
 NAM_exile_overseas_districts_desc:0 "The islands are no longer a colony of a colony. Their people feed, arm and defend Svetlogorye and receive the same rights as the mainland."
