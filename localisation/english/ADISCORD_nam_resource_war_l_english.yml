 NAM_counterinsurgency_sweep: "Gendarmerie Sweep"
 NAM_counterinsurgency_sweep_desc: "Gendarmes cordon off roads, check papers and search suspect houses. Local residents will need an explanation of whom the patrols are seeking and why they have come here."
