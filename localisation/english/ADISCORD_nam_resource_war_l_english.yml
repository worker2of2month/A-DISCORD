 NAM_guarded_wells_tt:0 "During the resource war, fields we own and control gain §G+0.5§! local supply, §G-10%§! enemy army speed and §G+25%§! infrastructure repair speed. Guards resume work when a field is liberated."
 NAM_prewar_mandate_rules_tt:0 "At the start of the resource war, the prewar balance of seals fixes Rom's course and its separate postwar branch: below §Y-25%§!, governor §Yetatism§!; above §Y+25%§!, district §Yhumanism§!; §Y-25%§! through §Y+25%§! inclusive, §Ypragmatism§! and a government of compacts. A ruler who has already seized power remains in office."
