l_english:
 service_etatism: "Service Etatism"
 service_etatism_desc: "§YService Etatism§!\n\nAuthority is justified by the ability to maintain supplies, defend borders and keep institutions working. After the fall of Vorkerland, Egor Rom preserves the administrative apparatus but redirects its service to Svetlogorye. Power demands personal accountability, and independence begins with carrying out decisions of one's own.\n\nFormer governors can no longer justify levies by orders from a distant capital. The state demands reliable depots, paid wages and the execution of instructions. The right to govern rests on service to the country, and public office carries responsibility for its results.\n\nThe limits of this authority remain to be settled. A unified hierarchy promises speed and discipline; an agreement with the districts gives citizens the right to inspect expenditure and challenge decisions. Whatever its institutions, Svetlogorye must become a state accountable to the people who live in it."

 faction_eflor_azhar_restitution_alliance: "Eflor-Azhar Alliance"
 SLF: "Svetlogorsk Uprising"
 SLF_DEF: "the Svetlogorsk Uprising"
 SLF_ADJ: "Svetlogorsk"
 SLF_humanism: "Svetlogorsk Uprising"
 SLF_humanism_DEF: "the Svetlogorsk Uprising"
 SLF_humanism_party: "Provisional Insurgent Headquarters"
 SLF_Yaroslav_Veter: "Yaroslav Veter"
 ADISCORD_coastal_patrol_vessel: "Coastal Patrol Vessel"
 ADISCORD_coastal_patrol_ship: "Coastal Patrol Vessels"
 ADISCORD_coastal_patrol_ship_desc: "Simple small warships for convoy escort, reconnaissance and control of local straits."
 ADISCORD_coastal_patrol_ship_1: "Resource War Patrol Vessel"
 ADISCORD_coastal_patrol_ship_1_short: "Patrol Vessel"
 ADISCORD_coastal_patrol_ship_1_desc: "A dependable coastal vessel with light guns, torpedoes and minimal anti-aircraft armament."
 modifier_experience_gain_ADISCORD_coastal_patrol_vessel_training_factor: "Coastal Patrol Vessel Training Experience Gain"
 modifier_experience_gain_ADISCORD_coastal_patrol_vessel_mission_factor: "Coastal Patrol Vessel Mission Experience Gain"
 modifier_experience_gain_ADISCORD_coastal_patrol_vessel_combat_factor: "Coastal Patrol Vessel Combat Experience Gain"
 ADISCORD_nam_extraction_defence_corps: "Oilfield Defence Corps"
 ADISCORD_nam_extraction_defence_corps_desc: "Svetlogorye has dispersed its reserves in advance, stationed engineers on the approaches to the oilfields and reorganised its garrisons into a proper field army. It has fewer potential allies than the coalition, but has no intention of surrendering the fields to a swift offensive."
 ADISCORD_nam_restitution_coalition: "Territorial Restitution Coalition"
 ADISCORD_nam_restitution_coalition_desc: "Eflor and Azhar have established a permanent military and political alliance to recover the territories and resource infrastructure seized by Vorkerland and inherited by Svetlogorye. Their joint headquarters coordinates a single war and will remain the foundation of their security afterwards."
 ADISCORD_nam_insurgent_columns: "Insurgent Columns"
 ADISCORD_nam_insurgent_columns_desc: "Deserters, underground activists and local militia from the northern resource belt have formed independent columns. They can hold a short internal front on modest supplies, but lack the heavy forces of a regular army."
 ADISCORD_nam_profitable_volunteer_contracts: "Resource Assistance Contracts"
 ADISCORD_nam_profitable_volunteer_contracts_desc: "Participation in the war will pay off only if access to fuel and transport is agreed in advance. The governments are sending limited volunteer forces without assuming the obligations of the entire coalition."
 ADISCORD_nam_treaty_independence: "Charter of Recognised Independence"
 ADISCORD_nam_treaty_independence_desc: "Eflor and Azhar have formally renounced the right to determine Svetlogorye's future by force. The charter's border annexes establish a new frontier, while the neighbours' signatures turn a de facto break with Vorkerland into recognised independence."
 ADISCORD_nam_first_strike_corps: "First Strike Corps"
 ADISCORD_nam_first_strike_corps_desc: "Svetlogorye's army left its prepared lines to strike first. Surprise has bought time, but the engineering positions and dispersed reserves stayed behind: the corps fights at half the strength it would have had in defence."
 NAM_seal_discipline_dynamic: "Seal Discipline"
 NAM_seal_discipline_dynamic_desc: "Every step of the ladder holds its sector of the front as long as it believes the next step will not waver. Seal discipline: §Y[?NAM_seal_discipline|0]§!/100 ([?NAM_seal_org_factor|=+1%] £organization_texticon). Above 50 it strengthens the army's organisation; below 50 it erodes it."
 NAM_scorched_wells: "Scorched Wells"
 NAM_scorched_wells_desc: "If a field cannot be held, it must not fall to the enemy. Sappers lay charges at the derricks and pumping stations in advance, and the oil workers know they will have to answer to their own crews for every fire."
 NAM_scorched_wells_modifier: "Scorched Wells"
 NAM_scorched_wells_modifier_desc: "The wells are burning and the pumps destroyed. Neither the old nor the new owner will draw resources here until the field is restored."

 # Restitution pressure
 NAM_restitution: "Restitution Pressure"
 NAM_restitution_desc: "Pressure: §Y[?NAM_rw_tension|0]§! / 100. [NAMGetTensionNext]\n\nPressure grows by §Y6§! each month. Fuel deliveries to Eflor and Azhar reduce it by §Y2§! per recipient, a fuel embargo on either adds §Y1§! each, and two or more formations prepared under mobilisation orders add §Y1§!. At §Y40§! the neighbours send notes, at §Y70§! a joint ultimatum. At §Y100§! war begins, but not earlier than §Y300 days§! after Vorkerland's collapse."
 NAM_rw_next_idle: "Restitution pressure no longer grows."
 NAM_rw_next_dispatched: "§RThe neighbours have begun deploying: war will start within weeks.§!"
 NAM_rw_next_notes: "Next threshold: §Y40§! - restitution notes."
 NAM_rw_next_ultimatum: "Next threshold: §Y70§! - the ultimatum."
 NAM_rw_next_war: "Next threshold: §Y100§! - war. The minimum period has already passed."
 NAM_rw_next_time_bought: "Azhar is holding its troops back: no war begins until the §Y75 days§! of the bought delay have passed."
 NAM_rw_next_window: "Next threshold: §Y100§! - war, but not earlier than §Y300 days§! after the collapse."
 NAM_rw_next_window_protocol: "Next threshold: §Y100§! - war, but the Klyuchevsk protocol has moved it to no earlier than §Y665 days§! after the collapse."
 NAM_restitution_note: "Counter-Note"
 NAM_restitution_note_desc: "The chancellery answers every claim with a counter-list: ledgers, treaties of the Vorkerland era, signatures of the neighbours' own officials. Notes do not end the dispute, but they buy time. Repeatable after §Y60 days§!."
 NAM_restitution_note_tt: "Restitution pressure: §G-8§!."

 # Mobilisation, defence lines and war missions
 NAM_mobilisation: "Mobilisation of Svetlogorye"
 NAM_mobilisation_desc: "[NAMGetOrdersSummary] Lines under construction: §Y[?NAM_lines_in_progress|0]§! of §Y[?NAM_line_slots|0]§!. Seal discipline: §Y[?NAM_seal_discipline|0]§!/100 ([?NAM_seal_org_factor|=+1%] £organization_texticon).\n\nAn order debits its price and its recruits at once. The treasury equips the formation, and the formation itself takes position at full strength on the day the war begins. Before the war, orders can be released, returning treasury, fuel and recruits; political power is not refunded.\n\nOrders to hold the fields:\n- Northern Deposits: [NAMGetHold67]\n- South Coast: [NAMGetHold689]\n- Sukhorechye: [NAMGetHold690]"
 NAM_hold_67_running: "§Y[?NAM.days_mission_timeout@NAM_hold_field_67|0]§! days left"
 NAM_hold_689_running: "§Y[?NAM.days_mission_timeout@NAM_hold_field_689|0]§! days left"
 NAM_hold_690_running: "§Y[?NAM.days_mission_timeout@NAM_hold_field_690|0]§! days left"
 NAM_hold_none: "no order"
 NAM_orders_summary_open: "Prepared formations: §Y[?NAM_orders_paid|0]§! of §Y[?NAM_order_cap|0]§! (at most §Y6§!)."
 NAM_orders_summary_delivered: "The war has begun and no new orders are taken. On its first day §Y[?NAM_orders_delivered|0]§! prepared formations took the field: field guards §Y[?NAM_orders_delivered_guard|0]§!, field infantry §Y[?NAM_orders_delivered_infantry|0]§!, motorised divisions §Y[?NAM_orders_delivered_motor|0]§!, coastal detachments §Y[?NAM_orders_delivered_coastal|0]§!."
 NAM_orders_summary_closed: "The resource war is over: there are no more mobilisation orders."
 NAM_order_slot_free_tt: "The war has not begun, and prepared formations are below the limit: §Y[?NAM_orders_paid|0]§! of §Y[?NAM_order_cap|0]§!, at most §Y6§!"
 NAM_order_resource_guard: "Order: Field Guard"
 NAM_order_resource_guard_desc: "A field guard infantry division will be raised for the outbreak of war: nine infantry battalions, an engineer company and an artillery battery. It will take position on the Northern Deposits or, if the enemy holds them by then, in the nearest district still in our hands."
 NAM_order_resource_guard_tt: "Treasury: §R-200§! £ADISCORD_economy_treasury_texticon.\nA fully equipped field guard infantry division appears on the day the war begins.\nRestitution pressure: §R+2§!."
 NAM_order_field_infantry: "Order: Field Infantry"
 NAM_order_field_infantry_desc: "A field infantry division will be raised for the outbreak of war: six infantry battalions and an engineer company. It will take position in Sukhorechye, East Sukhorechye or on the South Coast - in the first of these districts that is fully in our hands."
 NAM_order_field_infantry_tt: "Treasury: §R-100§! £ADISCORD_economy_treasury_texticon.\nA fully equipped field infantry division appears on the day the war begins.\nRestitution pressure: §R+2§!."
 NAM_order_motor_column: "Order: Motorised Division"
 NAM_order_motor_column_desc: "A motorised division will be raised for the outbreak of war: four motorised infantry battalions on tracked armoured carriers, an engineer company and an artillery battery. It is the mobile reserve near the Northern Deposits, able to reach the places foot infantry would reach too late. The price covers the carriers and their fuel, and if we do not yet have the armoured carrier programme, the first order provides it as well."
 NAM_order_motor_column_tt: "Treasury: §R-250§! £ADISCORD_economy_treasury_texticon.\nA fully equipped motorised division on armoured carriers appears on the day the war begins.\nRestitution pressure: §R+2§!."
 NAM_order_coastal_battalion: "Order: Coastal Battalion"
 NAM_order_coastal_battalion_desc: "A coastal detachment will be raised for the outbreak of war: three infantry battalions and an artillery battery to defend the South Harbour."
 NAM_order_coastal_battalion_tt: "Treasury: §R-50§! £ADISCORD_economy_treasury_texticon.\nA fully equipped coastal detachment appears in the South Harbour on the day the war begins.\nRestitution pressure: §R+2§!."
