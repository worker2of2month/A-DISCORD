 NAM_state_plan:0 "Central Production Plan"
 NAM_state_plan_desc:0 "The chancellery will combine state orders into one production schedule. Factory managers will answer to a common commission instead of bargaining with every governor."
 NAM_regional_trusts:0 "District Trusts"
 NAM_regional_trusts_desc:0 "Governors will retain economic initiative through supervised trusts. The treasury will demand completed contracts while leaving local managers to organise the work."
 NAM_unified_standards:0 "Common Industrial Standards"
 NAM_unified_standards_desc:0 "Basin workshops use incompatible parts and their own quality measures. State engineers will compile a common catalogue for suppliers and manufacturers."
 NAM_state_logistics_grid:0 "Basin Trunk Routes"
 NAM_state_logistics_grid_desc:0 "Cargo must travel between the fields and the harbour on schedule. Road administrations will receive common dispatching, repair crews and transport."
 NAM_state_project_bureaus:0 "State Design Bureaus"
 NAM_state_project_bureaus_desc:0 "Permanent design teams will replace scattered departmental offices. They will carry complex work from drawings to acceptance and retain knowledge between orders."
 NAM_public_utilities:0 "Public Utility Networks"
 NAM_public_utilities_desc:0 "The districts will begin with water, electricity and roads to workers' neighbourhoods. Joint orders will give smaller administrations a stronger voice with contractors."
 NAM_municipal_services:0 "Public Services"
 NAM_municipal_services_desc:0 "The Charter must be felt in reception offices, libraries and training workshops. District assemblies will organise services that once depended on a governor's favour."
 NAM_civic_audit:0 "Elected Auditors"
 NAM_civic_audit_desc:0 "Residents have a right to know where oil revenues go. Elected district auditors will publish their conclusions for neighbouring administrations and the local press."
 NAM_district_workshops:0 "District Workshops"
 NAM_district_workshops_desc:0 "Repairs and everyday orders should not wait for an opening in the capital's workshops. New enterprises on the coast and in Dryriver will serve nearby settlements."
 NAM_open_libraries:0 "Open Libraries"
 NAM_open_libraries_desc:0 "Technical manuals and new research will no longer remain locked in departmental archives. The districts will establish reading rooms and circulate publications."
 NAM_pragmatic_compact:0 "A Compact without Dominance"
 NAM_pragmatic_compact_desc:0 "Neither the districts nor the governors imposed their own order. Rom will propose a government of agreed obligations, with limits on every power and responsibility for every promise."
 NAM_commercial_courts:0 "Commercial Arbitration"
 NAM_commercial_courts_desc:0 "A dispute between an oilfield and the treasury must not stop an entire town. Arbitration boards will demand records from both sides and issue enforceable rulings."
 NAM_export_clearing:0 "Export Clearing House"
 NAM_export_clearing_desc:0 "Trading houses will combine settlements for major fuel shipments. The treasury will guarantee delivery and collect its share when each transaction closes."
 NAM_machine_tool_contracts:0 "Machine Tools on Credit"
 NAM_machine_tool_contracts_desc:0 "Part of the trading revenue will remain with equipment suppliers. Long contracts will link machine deliveries to installation and maintenance."
 NAM_contract_register:0 "Register of Obligations"
 NAM_contract_register_desc:0 "The same property must not secure several secret promises. A common register will identify collateral, entitled creditors and the priority of each contract."
 NAM_port_agreement:0 "Unified Harbour Agreement"
 NAM_port_agreement_desc:0 "Shipowners, dockworkers and customs officers will agree on one schedule and a common acceptance procedure. Cargo will no longer disappear between competing seals."
 NAM_warehouse_receipts:0 "Warehouse Receipts"
 NAM_warehouse_receipts_desc:0 "Certified stocks will secure commercial contracts. Sealed tanks, independent bookkeepers and storage for large consignments will make the guarantees credible."
 NAM_insured_caravans:0 "Insured Convoys"
 NAM_insured_caravans_desc:0 "Insurance contributions will fund escorts and ship repairs. Shared liability will keep trading houses committed to convoy services even during quiet months."
 NAM_commercial_reserve:0 "Treasury Guarantee Reserve"
 NAM_commercial_reserve_desc:0 "After reconciling their obligations, trading houses will pay agreed contributions into a treasury reserve. It will honour guarantees without breaking funded orders."
 NAM_commercial_reserve_tt:0 "Treasury: §G+500§! £ADISCORD_economy_treasury_texticon."
 NAM_balanced_accounts:0 "Mutual Guarantees"
 NAM_balanced_accounts_desc:0 "The government can demand performance because it has learned to honour its own obligations. The harbour, clearing house and treasury will combine their guarantees."
 NAM_prag_ending_republic:0 "Republic of Compacts"
 NAM_prag_ending_republic_desc:0 "A public compact will define the limits of government, districts and commercial associations. Rom will remain an arbiter bound by the same rules as everyone else."
 NAM_prag_ending_directorate:0 "State Commercial Council"
 NAM_prag_ending_directorate_desc:0 "A standing council of the treasury and major commercial associations will take the central decisions. Rom will chair it as guarantor of their obligations."
 NAM_prag_settlement_agreements:0 "Settlement Agreements"
 NAM_prag_settlement_agreements_desc:0 "Neighbours will be offered common settlement rules and protection for commercial obligations. They will keep their administrations and armies while recognising Svetlogorsk's contractual primacy."
 NAM_prag_partner_supply:0 "Supplying Treaty Partners"
 NAM_prag_partner_supply_desc:0 "Treaties require reliable deliveries. Svetlogorsk will prepare transport and a system for supplying fuel to allies and dependent members of the settlement system."
 NAM_prag_south_guarantees:0 "Guarantees for Southern Contracts"
 NAM_prag_south_guarantees_desc:0 "The treasury cannot guarantee southern obligations while a foreign hegemon controls their fulfilment. The council will prepare a common campaign and announce the terms of settlement."
 NAM_prewar_pragmatic_mandate_tt:0 "The balance was between §Y-25%§! and §Y+25%§! inclusive at war entry: the pragmatic mandate was fixed"
 NAM_pragmatic_ending_tt:0 "The struggle for the seals is settled. The state administration adopts the chosen constitutional settlement."
 NAM_prag_settlement_agreements_tt:0 "Eflor and Azhar receive a voluntary economic contract: their own government and army, §Y15%§! civilian industry and trade privileges for Svetlogorye, with no manpower or military factory transfer. Members must support the common side in the southern war. Refusal does not start a war."
 NAM_prag_south_guarantees_tt:0 "The order to march against Shahrabad is agreed. It will be carried out after the common warning ends and both sides are ready for war."
 NAM_administration_default_title:0 "Svetlogorye Administration"
 NAM_administration_prag_republic_title:0 "Republic of Compacts"
 NAM_administration_prag_directorate_title:0 "State Commercial Council"
 ADISCORD_nam_debug_start_resource_war_tt:0 "Starts the resource war through the normal participant setup and freezes Svetlogorye's current balance of power."
 ADISCORD_nam_debug_resolve_nam_victory_tt:0 "Svetlogorye wins recognition, border territories and the postwar focus tree; the defeated coalition receives its treaty penalties. The recorded political course remains unchanged."
 ADISCORD_nam_debug_resolve_coalition_victory_tt:0 "The mainland is divided between Eflor and Azhar. Svetlogorye retreats into exile if it has eligible islands; otherwise Eflor annexes its remaining territory."
 ADISCORD_nam_debug_resolve_compromise_tt:0 "Peace follows current oilfield control: the coalition retains captured fields; Svetlogorye keeps the rest, receives the defeat tree and starts fuel tribute."
 ADISCORD_nam_debug_resolve_standoff:0 "§RDEBUG:§! Hold independence without border gains"
 ADISCORD_nam_debug_resolve_standoff_desc:0 "The neighbours' offensive runs out of momentum and both sides cease fire."
 ADISCORD_nam_debug_resolve_standoff_tt:0 "Peace without border gains or coalition penalties. Svetlogorye retains independence and receives the postwar tree for its recorded political course."
 ADISCORD_nam_debug_prepare_etatism:0 "§RDEBUG:§! Prewar course: etatism"
 ADISCORD_nam_debug_prepare_etatism_desc:0 "The governors secure the decisive voice in government."
 ADISCORD_nam_debug_prepare_etatism_tt:0 "Sets Svetlogorye's balance of power to §Y-50%§!. The resource war will record the etatist course when it starts."
 ADISCORD_nam_debug_prepare_pragmatism:0 "§RDEBUG:§! Prewar course: pragmatism"
 ADISCORD_nam_debug_prepare_pragmatism_desc:0 "The districts and governors agree on a common working arrangement."
 ADISCORD_nam_debug_prepare_pragmatism_tt:0 "Sets Svetlogorye's balance of power to §Y0%§!. The resource war will record the pragmatic course when it starts."
 ADISCORD_nam_debug_prepare_humanism:0 "§RDEBUG:§! Prewar course: humanism"
 ADISCORD_nam_debug_prepare_humanism_desc:0 "District assemblies secure the decisive voice in national affairs."
 ADISCORD_nam_debug_prepare_humanism_tt:0 "Sets Svetlogorye's balance of power to §Y+50%§!. The resource war will record the humanist course when it starts."
 ADISCORD_nam_debug_start_ready_tt:0 "The metropolitan collapse has begun; the resource war has not happened; Svetlogorye, Eflor and Azhar exist, are at peace and control their required starting territories."
