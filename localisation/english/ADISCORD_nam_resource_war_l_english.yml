 NAM_wartime_programmes_tt: "The resource war is under way, or the War for the South with Svetlogorye leading the northern camp"
 NAM_startup_region:0 "§YTHE SOUTHERN RESOURCE BELT: SVETLOGORYE'S SURROUNDINGS§!\n\nThe situation at the beginning of 2160.\n\n§YWorkerland: authority over the autonomy§!\nSvetlogorye belongs to the confederation's system of dependent territories. Viceroys administer the oil basin through reports, districts and garrisons, but central orders increasingly exceed the centre's capabilities. Workerland's weakness makes control of local resources a more urgent question.\n\n§YEflor: the demand to reclaim land§!\nThe republic's nationalist leadership places territorial unity above local autonomy. Oil-producing lands once taken by Workerland remain disputed. To Eflor, the viceroyal administration embodies the order that entrenched that loss.\n\n§YAzhar: the Directorate of the Black Basin§!\nSamir Azhar united the districts through common accounting of manpower, supplies and fuel. The Directorate maintains reserves and subjects supply to a state plan. Its territorial claims are backed by mobilisation capacity, and the struggle over the oil basin has both economic and political significance.\n\n§YShahrabad and southern trade routes§!\nShahrabad concentrates the region's population, metallurgy and industrial capital. Its furnaces need water, raw materials and dependable exports; Keyzan, Mazar and Veir's ports influence these flows. Svetlogorye's oil wealth belongs to this wider trading system, where a local dispute can affect the whole South."
 NAM_startup_country: "§YSVETLOGORYE IN 2160§!\n\n§YThe oil basin and imperial authority§!\nSvetlogorye took shape within Vorkerland's dependent administrative system. Oil lands and adjoining infrastructure were assigned to it by Vorkerland's administration. Their inhabitants lived under foreign rule for generations. State borders recorded the centre's decision without erasing memories of the land's former allegiance.\n\nOil made the southern basin an important source of resources. Shipment plans, garrison supplies and export accounts became part of everyday life alongside the oilfields. Wealth lay underground; authority over it passed through institutions tied to a distant capital.\n\n§YThe ladder of namestniks§!\nImperial administrators built government as a chain of appointed representatives. Each office reported to the next, and each rung had a seal and the power to halt a decision. The ladder collected resources and maintained discipline but showed the country to the centre mainly through reports.\n\nOver time, administrative procedure became a power of its own. Approval determined who received money and access to stocks; an error could become a state secret. The apparatus counted others' expenses more readily than its own. Duplicate ledgers allowed one office to appear as several functioning institutions.\n\n§YWhen the orders diverged§!\nThe weakening of Vorkerland's centre did not abolish the old chain of command. Instructions kept arriving in Svetlogorye: ship oil, leave the wagons untouched, follow a new order instead of the previous one. Egor Rom's shelves held papers that could no longer all be acted upon. Formal authority increasingly failed to reflect available people, warehouses and transport.\n\nNamestniks demanded discipline, districts contested levies, and oil workers waited for their earnings. Garrisons needed real fuel and export houses completed shipments. Parts of the same economy made incompatible demands on the government. Pay delays and collections fed discontent in Svetlogorsk, the country's largest city.\n\nOn the map, an office might have a regiment behind it; on the road, a single checkpoint represented its authority. Fuel stalled between departmental reports, while repair shops could do more than their budgets admitted. The system maintained the appearance of full accounting even as real work increasingly relied on local people and informal arrangements.\n\n§YAt the start of 2160§!\nEvery line of namestnik authority leads to Egor Rom, while Kirill Mezentsev brings its obligations together in the payroll. Svetlogorye remains a dependent territory of Vorkerland with the South's largest oilfields. The inherited apparatus still functions, although trust in its seals has weakened. Accumulated oil wealth coexists with unpaid wages and a dispute over who owns it."
 NAM_startup_guide_groups_title:0 "Pillars, power and underground"
 NAM_startup_guide_groups:0 "§YWHO HOLDS SVETLOGORYE TOGETHER§!\n\n§YFive pillars§!\nIn $NAM_supports$, watch the namestniks, oil workers, districts, garrisons and export houses. Support measures their attitude; weight measures their influence. Concessions to one pillar can hurt another. Focuses and paid decisions reshape institutions and relations with the groups. One strong gauge cannot secure the whole government.\n\n§YThe ladder of seals§!\nIndependence opens the balance between central authority and the districts. The vertical strengthens collection and administration, but its dominance costs stability and research. District power helps construction, science and public stability at the expense of political power and collection. Focuses, patronage and political events move the balance.\n\n§YRom's rivals§!\nRepresentatives of the pillars make demands and expect promises to be fulfilled. Check the deadline and price of each commitment. Refusal or a broken promise with weak support can trigger a struggle for the seals and a change of leader. Reserve money for incidents and concessions alongside military spending.\n\n§YYaroslav Weber's underground§!\nIt operates from the start: district discontent and stronger central authority help it grow. Fires, depot raids and assassination attempts can follow. Colonial sweeps are available early; later the vertical hunts caches, while the districts can negotiate an amnesty and recruit Weber as a commander.\n\n§YPreventing the uprising§!\nA completed amnesty prevents it. Alternatively, unlock the Svetlogorsk guarantees and pay for the compact: it must operate for 60 uninterrupted days before the war while you own and control the city. Without these protections, underground strength of 60 or more triggers an uprising; 30-59 gives a fifty-percent chance, and below 30 there is none. Prepare the city before hostilities."
 NAM_startup_guide_oil_title:0 "Basin, contracts and islands"
 NAM_startup_guide_oil:0 "§YOIL MUST REACH ITS BUYER§!\n\n§YWhile the metropole survives§!\n$NAM_colony$ offers shipments to Vorkerland and trade concessions. They bring revenue and change pillar support. Colonial programmes close when the centre collapses, so do not base permanent expenses solely on their income.\n\n§YThe basin map§!\nAfter $NAM_inventory$, open $NAM_national_programmes$. The map shows field condition, throughput, committed capacity and projects. Oil on the map, stored fuel and capacity available for contracts are different figures. Losing or damaging a node reduces delivery capacity.\n\n§YRepair and development§!\nWell repairs, field refineries, the Klyuchevsk pipeline and sea terminal require unlocks, payment and time. Check project slots and ownership of the required districts. The pipeline needs Sukhorechye and the South Harbour; the terminal serves distant buyers. Losing a construction site interrupts work and refunds the deposit.\n\n§YFuel contracts§!\nA buyer must accept your offer. An active contract occupies capacity and exchanges §Y15000§! £fuel_texticon from your stockpile for §G40§! £ADISCORD_economy_treasury_texticon each month. Without enough fuel, both delivery and payment are skipped. War with the buyer ends the contract.\n\n§YOverseas districts§!\nThe islands offer steel, convoy services and concessions. Deals with Kefreite require the other side's consent. Develop the harbours and defend the archipelago: it can sustain the campaign after the mainland is lost. See Paths for the consequences.\nAn active export dispatch office adds §G+30§! £ADISCORD_economy_treasury_texticon for each completed monthly delivery."
 NAM_startup_guide_war_title:0 "Pressure and the resource war"
 NAM_startup_guide_war:0 "§YPREPARATION AND THE FRONT§!\n\n§YThe deadline§!\nThe 450-day countdown begins with Vorkerland's collapse. Four one-time diplomatic actions can add up to 225 days; the territorial protocol separately adds 365 days. Notes and the ultimatum warn of the approaching deadline. Avoiding introductory focuses does not stop the crisis. A voluntary first strike ends the wait.\n\n§YAnswering the ultimatum§!\nThe Klyuchevsk protocol cedes East Sukhorechye and imposes a year of fuel tribute, postponing the threat by a year. Buying time from Azhar grants 75 days but does not remove it from the coalition. You may reject the demands or strike first: a pre-emptive war starts quickly with a weaker defensive bonus.\n\n§YMobilise before the shooting§!\nUse $NAM_mobilisation$ to pay for formations and prepare lines. Orders reserve resources now; formations deploy at the outbreak of war. Before hostilities, cancelling returns treasury funds, fuel and recruits, but not political power. Check order limits, project durations and replacement stocks. City preparation is covered under Pillars.\n\n§YThe war can end early§!\nCapitulations and decisive territorial control can bring peace before the deadline. Svetlogorye needs its fields and all enemy border belts. The coalition needs the Northern Deposits and one additional field. Territorial outcomes are checked again after 7 days: losing key ground can end the war before the timer expires.\n\n§YIf the war reaches day 420§!\nCurrent control decides the score: Northern Deposits 80, South Coast 36, Sukhorechye 24, East Sukhorechye and Svetlogorsk District 12 each. At least 100 points plus an occupied enemy border district bring the victory treaty; without that district, a standoff restores the old border. 36-99 points mean compromise; below 36 means defeat.\n\n§YSeal discipline§!\nCasualties and lost fields weaken army organisation through discipline. Watch holding missions, supply and wartime programmes. The settlement determines your next focus tree."
 NAM_startup_guide_plan_title:0 "First steps"
 NAM_startup_guide:0 "§YFIRST STEPS AS SVETLOGORYE§!\n\n§Y1. Conduct the inventory.§! Start with $NAM_inventory$. Check the treasury, weekly balance, fuel and garrisons. While Vorkerland survives, use colonial trade and keep track of the underground.\n\n§Y2. Inspect the pillars and basin.§! Compare all five groups' support and influence in $NAM_supports$. In $NAM_national_programmes$, check field condition, free capacity, ongoing projects and contracts.\n\n§Y3. Choose how to govern.§! The vertical and districts open different preparations. On the district route, allow time for talks with Weber or payment followed by 60 days of the Svetlogorsk compact. The vertical needs cache hunts and readiness for an internal front.\n\n§Y4. Budget for independence.§! Colonial income disappears with the centre. Repair fields, negotiate deliveries and retain fuel for the army. An offer is not yet an active contract.\n\n§Y5. Prepare before the attack.§! Follow the single crisis deadline. Pay for mobilisation orders, prepare lines and finish projects on time. The ultimatum can buy time through material concessions.\n\n§Y6. Defend the decisive ground.§! Losing the Northern Deposits and another field can end the war early. Keep reserves and watch discipline. Victory or a standoff opens the postwar tree; compromise or island exile opens the defeat tree. Paths describes the continuations."
 NAM_startup_path_0_title:0 "Etatism: governors"
 NAM_startup_path_0:0 "§YGOVERNORS IN POWER§!\n\nStrengthen the governors before the resource war to steer Rom towards etatism. The balance of power at the start of hostilities determines the course continued by the postwar constitution.\n\nVictory or a stalemate opens the service state: authority registers, garrisons and oil quotas. Choose a central production plan or regional trusts. Both lead to common standards, logistics and project bureaus.\n\nThe political ending establishes a strict hierarchy or a service republic. Southern policy centres on governorships and subjugating Shahrabad.\n\nReveal spoilers for the entry threshold, endings and southern-war preparation."
 NAM_startup_path_0_details:0 "§YETATISM: ENTRY AND CHOICES§!\n\n§YHow to enter§!\nHave a balance below -25, towards the governors, when the resource war begins. The course is fixed at that moment; later shifts do not change it. Rom adopts etatism if he still rules. Victory or a stalemate opens the postwar tree: complete \"$NAM_recognition$\", then \"$NAM_service_state$\". No single prewar focus determines the route by itself.\n\n§YDevelopment§!\n\"$NAM_state_plan$\" unlocks a paid production schedule for military industry; \"$NAM_regional_trusts$\" unlocks regional contracts for civilian construction and trade. Choose one. Common standards, logistics and project bureaus follow. The authority register, garrisons and oil quotas lead to \"$NAM_ladder_of_seals$\", which also requires common standards.\n\n§YEndings§!\n\"$NAM_ladder_ending_iron$\" establishes the Iron Ladder; \"$NAM_ladder_ending_service$\" creates the Service Republic. Each has its own country name and national spirit. A successful coup keeps its winner in power.\n\n§YPreparing for the South§!\nComplete \"$NAM_svetlogorye$\", \"$NAM_oil_exchange$\", \"$NAM_ladder_of_seals$\" and \"$NAM_south_desert_offices$\". The crisis opens no earlier than 2165, once both sides are prepared, followed by a 56-day warning. \"$NAM_south_seal_over_furnaces$\" prepares the war order without bypassing that warning. Victory turns Shahrabad and its allies into governorships."
 NAM_startup_path_1_title:0 "Humanism: districts"
 NAM_startup_path_1:0 "§YDISTRICT SELF-GOVERNMENT§!\n\nStrengthen the districts before the resource war to steer Rom towards humanism. City guarantees and negotiations with the underground help address the internal conflict while you prepare for an external one.\n\nVictory or a stalemate opens the charter, district council, oil fund and militia. Choose public utilities or municipal services, then develop workshops, education and accountable government.\n\nThe common fuel market leads to a federation or an Oil Union. Southern policy relies on agreements with neighbours and a common front against Shahrabad.\n\nReveal spoilers for the balance threshold, leadership changes and southern-war preparation."
 NAM_startup_path_1_details:0 "§YHUMANISM: CHARTER AND ENDINGS§!\n\n§YHow to enter§!\nHave a balance above +25, towards the districts, when the resource war begins. The course is fixed at war entry; later shifts do not change it. Rom adopts humanism if he still rules. After victory or a stalemate, complete \"$NAM_recognition$\" and open \"$NAM_federal_charter$\". Guarantees to Svetlogorsk help protect the city but do not replace the balance requirement.\n\n§YDevelopment§!\n\"$NAM_public_utilities$\" unlocks a paid construction and utilities programme; \"$NAM_municipal_services$\" unlocks public services supporting research and stability at an additional administrative cost. Choose one. Civic audits, workshops and libraries develop the country further. The council, oil fund and militia lead to \"$NAM_common_fuel_market$\", which also requires the civic audit.\n\n§YLeadership§!\n\"$NAM_charter_ending_federation$\" brings Nadezhda Ladygina to power and establishes humanism. \"$NAM_charter_ending_oil_union$\" transfers power to Kirill Mezentsev and the oil interests. Each ending has its own country name and national spirit. A successful coup keeps its winner in power.\n\n§YPreparing for the South§!\nComplete \"$NAM_svetlogorye$\", \"$NAM_oil_exchange$\", \"$NAM_common_fuel_market$\" and \"$NAM_south_fenn_guarantee$\". War preparation opens no earlier than 2165, once both sides are ready, followed by a 56-day warning. Neighbours must agree to an alliance; \"$NAM_south_oil_charter$\" prepares the campaign against Shahrabad. Victory establishes oil charters in the South."
 NAM_startup_path_2_title:0 "Pragmatism: compacts"
 NAM_startup_path_2:0 "§YTHE PRAGMATIC REPUBLIC§!\n\nKeep the districts and governors in balance before the resource war. Rom becomes the arbiter of their obligations, with a separate compact-based state branch available after victory or a stalemate.\n\nCommercial courts, ports and reliable settlements underpin this route. Choose trade specialisation or machine-tool deliveries, then develop warehouses and convoy insurance. Paid programmes reward planning your treasury spending.\n\nThe ending establishes a republic of compacts or a commercial council. Neighbours receive economic offers, while the struggle against Shahrabad protects southern obligations.\n\nReveal spoilers for the balance range, treaty conditions and differences between the endings."
 NAM_startup_path_2_details:0 "§YPRAGMATISM: BALANCE AND COMPACTS§!\n\n§YHow to enter§!\nKeep the balance between -25 and +25 inclusive when the resource war begins. That result is fixed at war entry; later shifts cannot change the route. Rom adopts pragmatism if he still rules. After victory or a stalemate, complete \"$NAM_recognition$\", then \"$NAM_pragmatic_compact$\". The governors' and districts' branches are unavailable under this mandate.\n\n§YDevelopment§!\n\"$NAM_commercial_courts$\" unlocks paid arbitration. Choose \"$NAM_export_clearing$\" for trade or \"$NAM_machine_tool_contracts$\" for industry. The port line develops warehouses, insured caravans and commercial reserves. Programmes are treasury-funded decisions; completing their focus does not pay for them.\n\n§YTwo forms of government§!\nAfter \"$NAM_balanced_accounts$\", choose \"$NAM_prag_ending_republic$\" or \"$NAM_prag_ending_directorate$\". The republic supports stability and cheaper administration. The council favours trade and military output at the expense of stability. Both keep Rom's pragmatic course if he has not already been removed.\n\n§YNeighbours and the South§!\n\"$NAM_prag_settlement_agreements$\" offers Eflor and Azhar voluntary economic agreements. Refusal does not start a war. An accepting partner retains its government and army but takes on economic and alliance obligations. \"$NAM_prag_partner_supply$\" unlocks fuel support for partners.\n\nSouthern preparation requires \"$NAM_svetlogorye$\", \"$NAM_oil_exchange$\", \"$NAM_balanced_accounts$\" and \"$NAM_prag_partner_supply$\". The crisis opens no earlier than 2165 after both sides prepare, followed by a 56-day warning. \"$NAM_prag_south_guarantees$\" prepares the campaign; victory establishes economic agreements in the South."
 NAM_startup_path_3_title:0 "Defeat: what comes next"
 NAM_startup_path_3:0 "§YMAINLAND OR ISLANDS§!\n\nA compromise in the resource war leaves Svetlogorye on part of the mainland. Its defeat tree offers revenge or economic recovery and an agreement with the victors.\n\nTotal defeat with surviving islands leads to exile. The island council offers radicals or humanists. The corporate route develops later from the humanists' dependence on investors.\n\nEach island route has a separate page below covering entry, return preparations and the resulting state. Rom's prewar balance does not restrict the island council's choice."
 NAM_startup_path_3_details:0 "§YDEFEAT: CONTINUING THE CAMPAIGN§!\n\n§YCompromise§!\nAt 36-99 points on the final check, Svetlogorye keeps its controlled fields and islands, cedes enemy-held land and pays a year of fuel tribute. The defeat tree offers recovery and revenge or agreement with the coalition. Economic reconciliation does not guarantee protection from a later Shahrabad attack.\n\n§YIsland flight§!\nA full coalition victory takes the mainland. Continuing requires surviving overseas possessions under your control; the capital moves there. Without suitable islands, the country is annexed. Evacuation saves part of the army but much of the stockpile is lost.\n\n§YChoosing a government§!\nAfter the flight, \"$ADISCORD_nam_resource_war.100.t$\" appears. Choose \"$ADISCORD_nam_resource_war.100.a$\" for Karamyshev's radicals or \"$ADISCORD_nam_resource_war.100.b$\" for Weber's humanists. Both overthrow Rom. There is no prewar balance threshold. The event allows seven days to answer; leaving it unattended selects the first option.\n\n§YThe third route§!\nCorporations are not a third council option. First choose the humanists, then allow the companies to take power. See \"Corporates in exile\" for the exact thresholds.\n\n§YReturning§!\nEach island course has its own war focus against Eflor and Azhar. Prepare its prerequisites, navy and landing forces; check peace, independence and the absence of tribute. Unlocking the focus does not replace winning the war."
 NAM_startup_paths_note:0 "Viewing does not choose a course. Reveal spoilers for entry conditions and endings."
 NAM_startup_path_4_title:0 "Radicals in exile"
 NAM_startup_path_4:0 "§YTHE PILLAR JUNTA§!\n\nAfter defeat and flight to the islands, give power to Svetlogorye's pillars. Rostislav Karamyshev unites officers, captains and oil workers around a forcible return to the mainland.\n\nRequisitions, military industry and sea raiding define this course. Loot pays for arms and landing forces while the islands become a fortress. Choose your treatment of the old officers, privateer organisation and preparations for the strike.\n\nAfter returning, the junta holds conquered territory through garrisons and prepares a southern campaign. Its final goal is the Dominion of the Pillars.\n\nReveal spoilers for the council answer, key focuses and further offensive requirements."
 NAM_startup_path_4_details:0 "§YRADICALS: ENTRY AND DESTINATION§!\n\n§YEntry§!\nYou need the island-exile outcome of the resource war. In \"$ADISCORD_nam_resource_war.100.t$\", choose \"$ADISCORD_nam_resource_war.100.a$\". Rostislav Karamyshev replaces Rom with an etatist junta and a separate tree. Rom's prewar course does not block this choice; there is no second council to switch to the humanists.\n\n§YIsland preparations§!\nBuild the Neo-Svetlogorsk fortress, fuel dumps, cadet corps and landing craft. Choose a purge of the namestnik's loyalists or an officer amnesty. Decide between letters of marque and a free brotherhood for the raiders.\n\nAfter \"$NAM_exile_sea_raiders$\", sea raids require ships, an available flotilla and fuel. Success is uncertain. Loot pays for weapons, convoys, training and marines. Infamy increases the danger of blockades and punitive raids.\n\n§YReturn and rule§!\n\"$NAM_rad_war_of_return$\" requires harbour preparations, the island fortress, fuel dumps, cadet corps, landing craft and corsair admiralty. Begin at peace, independent and free of fuel tribute. Victory restores the homeland; conquered foreign territory supports requisitions, plunder and garrison rule.\n\n§YEnding§!\nConsolidate authority over the returned south. The next great war requires consolidation of at least 70. \"$NAM_rad_great_war$\" leads to the southern campaign, then tribute, garrisons and machinery transfers to the islands. \"$NAM_rad_dominion_of_pillars$\" completes the pillars' dominion over the conquered region."
 NAM_startup_path_5_title:0 "Humanists in exile"
 NAM_startup_path_5:0 "§YTHE FREE ISLANDS§!\n\nAfter the flight, give power to Yaroslav Weber's humanists. They build civilian government, welcome refugees and attract foreign capital for recovery and return.\n\nFree zones, housing, education and district agreements underpin the route. Investment helps equip an army, but companies increasingly demand political influence. Keep control of the partnership.\n\nVictory on the mainland creates federal districts; the southern campaign extends the union. The humanist ending is the Union Constitution. If the boards capture the government, the corporate route replaces it.\n\nReveal spoilers for entry and ways to preserve Weber's government."
 NAM_startup_path_5_details:0 "§YHUMANISTS: WEBER AND FEDERATION§!\n\n§YEntry§!\nAfter island exile, choose \"$ADISCORD_nam_resource_war.100.b$\" in \"$ADISCORD_nam_resource_war.100.t$\". Yaroslav Weber replaces Rom. Neither a prior amnesty nor a district-aligned prewar balance is required. Free zones open, accumulated loot becomes foreign capital and the piracy route closes.\n\n§YPreserving the government§!\nForeign capital funds orders; corporate influence measures political power. Watch both. \"$NAM_hum_regulated_partnership$\" unlocks \"$NAM_corp_curb_influence$\". Union contracts, the charter commission and municipal harbour also restrain companies. \"$NAM_hum_open_doors$\", company towns and concessions strengthen investors.\n\nDemands arrive at 70 and 90 influence. Concessions bring a takeover closer; resistance costs resources. Avoid reaching 100 or remaining at 90 or above for three consecutive monthly checks. A monthly check below 90 resets the counter. Lowering influence after the takeover has been scheduled cannot cancel it.\n\n§YReturn§!\nDevelop the island economy, citizen army, marine contracts and mainland contacts. Choose an exile parliament or a national salvation cabinet. \"$NAM_hum_war_of_return$\" starts the return war after preparations. The homeland returns to Svetlogorye and new territories become federal districts.\n\n§YEnding§!\nRebuild harbours, sign federal treaties and raise consolidation. The great southern war requires at least 70 consolidation. \"$NAM_hum_great_war$\" expands the union southward, followed by a union parliament, university, common market and a choice of common currency or army. \"$NAM_hum_union_constitution$\" establishes the Union's constitution if the companies have not taken over."
 NAM_startup_path_6_title:0 "Corporates in exile"
 NAM_startup_path_6:0 "§YTHE STATE OF BOARDS§!\n\nThis route begins within humanist exile. Allow dependence on investors to become a transfer of power to corporations. Mark Olshansky's council of boards receives its own tree.\n\nChoose to retain Weber's ministers as a facade or purge them. Concessions, shareholders and company courts replace civilian institutions; contracts build the army and navy.\n\nReturning becomes a struggle for control of assets. Individual corporations receive districts, earning income and developing their specialisations. The southern campaign culminates in the Union of Boards.\n\nReveal spoilers for the transition requirements and choices that lead to it."
 NAM_startup_path_6_details:0 "§YCORPORATES: TAKEOVER AND CONCESSIONS§!\n\n§YHumanists first§!\nAfter island exile, choose Weber's humanists at the council. There is no separate corporate answer, and the radical route cannot make this transition. Rom's prewar balance does not determine the takeover.\n\n§YTransferring power§!\nIncrease company influence through \"$NAM_hum_open_doors$\", \"$NAM_corp_court_investors$\", company towns, the harbour concession and concessions in events. Several active free zones and leasing workers also increase monthly influence growth. Capital itself is not the takeover threshold.\n\nA takeover is scheduled at 100 influence or after three consecutive monthly checks at 90 or above. The demands at 70 and 90 are warnings, not the transition itself. Wait for \"$ADISCORD_nam_resource_war.103.t$\" and its only answer. Mark Olshansky takes power under commercial hedonism and the corporate tree loads. Completed humanist focuses remain completed.\n\n§YGovernment§!\nAfter \"$NAM_hum_board_of_governors$\", choose figurehead ministers or a ministry purge. Develop the boards' charter, concessions, company courts, guards and a private navy. \"$NAM_board_war_of_return$\" prepares the return to the mainland. Select corporate owners for Eflor and Azhar; existing federal districts also pass to company boards.\n\n§YDestination§!\nAfter returning, develop oilfields and reconstruction contracts. The southern campaign requires preparation and at least 70 consolidation; \"$NAM_board_great_war$\" opens the struggle for new assets. Choose owners' specialisations in Sardan, Rakhma and Kadir. \"$NAM_board_union_of_boards$\" completes the union of corporate possessions."
 # Oil monopoly and the islands
 NAM_fuel_shortage: "Broken Svetlogorsk Supplies"
 NAM_fuel_shortage_desc: "The Svetlogorsk fuel contract ended when the war began. The tankers did not arrive, and their replacement has yet to be found."
 NAM_fuel_embargo_modifier: "Svetlogorsk Fuel Embargo"
 NAM_fuel_embargo_modifier_desc: "Svetlogorye has closed its fields and terminals to this country. The embargo lasts until the Svetlogorsk government lifts it."
 NAM_island_convoy_route: "Island Convoy Line"
 NAM_island_convoy_route_desc: "Regular convoys carry the ore of the overseas districts and bring their supplies. The island no longer feels forgotten."
 NAM_island_steel_levy_modifier:0 "Island Steel Levy"
 NAM_island_steel_levy_modifier_desc:0 "The collection office diverts part of the island ore to settle treasury obligations. Miners and concession holders revise their shipping ledgers."
 NAM_south_convoy_blockade: "Svetlogorsk Convoy Hunters"
 NAM_south_convoy_blockade_desc: "Svetlogorsk ships intercept the tankers and barges bound for the furnaces. The factories receive less fuel and work intermittently."
 NAM_oil_unit_free_tt: "Svetlogorye has a free unit of oil throughput for this buyer (overland: §Y[?NAM_oil_free_land_units|0]§!, for overseas buyers: §Y[?NAM_oil_free_units|0]§!)"
 NAM_oil_buyer_eligible_tt: "The country is not at war with us, does not yet buy our fuel, is not awaiting an answer to another offer of ours, is not under our embargo and does not receive fuel under a treaty with us"
 NAM_oil_contract_offer: "Offer a Fuel Contract"
 NAM_oil_contract_offer_desc: "Commercial representatives are sending the buyer a draft standing oil agreement. The parties must agree on delivery schedules and responsibility for every consignment."
 NAM_oil_contract_offer_tt: "The buyer receives an offer and will reply in the coming days. Free capacity is checked again when the reply arrives.\nOn acceptance: §G+5§! £NAM_support_oil_texticon and §G+5§! £NAM_support_trade_texticon. The contract occupies §Y1§! unit of throughput.\nEach month the buyer receives §Y15000§! £fuel_texticon from our stocks and the treasury earns §G40§! £ADISCORD_economy_treasury_texticon. An active export dispatch office adds §G+30§! £ADISCORD_economy_treasury_texticon per completed delivery. Insufficient fuel skips both delivery and payment; war with the buyer ends the contract. The sea terminal serves only [VAL.GetName], [STP.GetName], [STS.GetName] and [RUS.GetName]."
 NAM_oil_contract_end: "Cancel a Fuel Contract"
 NAM_oil_contract_end_desc: "The trading office will notify the buyer that the contract is ending. Clerks will reconcile the final waybills and close its entry in the standing deliveries register."
 NAM_oil_contract_end_tt: "The contract ends and its unit of throughput is freed.\nThe buyer's opinion of us worsens.\nExport houses: §R-3§! £NAM_support_trade_texticon."
 NAM_fuel_embargo: "Fuel Embargo"
 NAM_fuel_embargo_desc:0 "Our neighbours count on our deliveries even while disputing our borders. An export ban will force them to look elsewhere for oil."
 NAM_fuel_embargo_valid_tt:0 "The country exists, does not buy our fuel under contract, is not under embargo and does not receive tribute from us"
 NAM_fuel_embargo_lift: "Lift the Fuel Embargo"
 NAM_fuel_embargo_lift_desc:0 "Middlemen are waiting for permission to load cargo again. Lifting the ban will let us return to negotiations with the buyer."
 NAM_fuel_embargo_lift_tt:0 "Export houses: §G+5§! £NAM_support_trade_texticon."
 NAM_project_slot_free_tt: "A project slot is free: §Y[?NAM_projects_in_progress|0]§! of §Y[?NAM_project_slots|0]§! in use (at most §Y2§!)"
 NAM_project_state_ready_tt: "The field is owned and controlled by us and has no other project in progress"
 NAM_project_not_scorched_tt: "The field's wells have not been scorched in the last §Y180 days§!"
 NAM_project_condition_low_tt: "The field's condition is below §Y100§!"
 NAM_project_harbour_held_tt: "§YSouth Harbour§! is owned and controlled by us"
 NAM_project_started_150_tt: "Treasury: §R-150§! £ADISCORD_economy_treasury_texticon; the deposit returns if the work is interrupted.\nOne project slot is occupied."
 NAM_project_started_300_tt: "Treasury: §R-300§! £ADISCORD_economy_treasury_texticon; the deposit returns if the work is interrupted.\nOne project slot is occupied."
 NAM_project_started_350_tt: "Treasury: §R-350§! £ADISCORD_economy_treasury_texticon; the deposit returns if the work is interrupted.\nOne project slot is occupied."
 NAM_project_started_250_tt: "Treasury: §R-250§! £ADISCORD_economy_treasury_texticon; the deposit returns if the work is interrupted.\nOne project slot is occupied."
 NAM_project_refund_tt: "Work is interrupted: the treasury deposit is returned and the project slot is released. Political power is not refunded."
 NAM_project_repair_wells: "Repair the Wells"
 NAM_project_repair_wells_desc: "Crews replace pumps, clear wells and restore access roads. The oilfield should work at its designed capacity again."
 NAM_project_repair_done_tt: "Field condition: §G+30§!, or §G+45§! with the firefighters, up to §Y100§!. Throughput is recalculated. Losing or scorching the field, or its full restoration by another service, returns the treasury deposit."
 NAM_project_refinery: "Build a Field Refinery"
 NAM_project_refinery_desc: "Engineers are marking out a fuel processing site by the oilfields. Builders must connect the new installations to roads, tanks and the existing facilities in the district."
 NAM_project_refinery_done_tt: "If we still own and control the oilfield, the district gains a building slot and a §Ysynthetic refinery§!. Field throughput increases by §G1§! only while we control it. If construction fails, the treasury deposit is returned."
 NAM_project_pipeline: "Lay the Klyuchevsk Pipeline"
 NAM_project_pipeline_desc: "The pipeline route must connect Sukhorechye with South Harbour. Surveyors are checking river crossings while builders arrange access to the pumping stations."
 NAM_project_pipeline_done_tt: "If we still own and control Sukhorechye and South Harbour, the pipeline is completed. It provides §G+1§! throughput only while we control both districts. If construction fails, the treasury deposit is returned."
 NAM_project_sea_terminal: "Build a Sea Terminal"
 NAM_project_sea_terminal_desc: "Port engineers have presented plans for an oil terminal at South Harbour. Tankers, storage tanks and dispatch services must work to an agreed arrangement along the quays."
 NAM_project_terminal_done_tt: "If we still own and control South Harbour, the sea terminal is completed. It provides §G+1§! unit of throughput only under our control and only for [VAL.GetName], [STP.GetName], [STS.GetName] and [RUS.GetName]. If construction fails, the treasury deposit is returned."
