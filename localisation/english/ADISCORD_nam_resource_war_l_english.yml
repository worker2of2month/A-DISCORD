 NAM_order_marines: "Marine Order"
 NAM_order_marines_desc: "§YCOST§!: §Y50§! loot §Y4300§! £manpower_texticon\n§YDEPLOYMENT§!: at the start of the war of return.\n§YCOOLDOWN§!: §Y14§! £time_texticon days after use.\n\n§YRESULT§!\n§G1§! £divisions_texticon marine division. The first joins the South Harbour landing; others form in the island capital.\nBefore the war, cancellation refunds loot and recruits."
