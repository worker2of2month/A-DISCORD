 NAM_pw_buy_heavy_arms_label:0 "Heavy weapons"
 NAM_pw_buy_heavy_arms_price:0 "[NAMPwCostHeavyArms]"
 NAM_pw_buy_heavy_arms_tt:0 "§YBlack-Market Heavy Weapons§!\n§G+150§! support equipment and §G+60§! guns.\nPrice: [NAMPwCostHeavyArms]. The next deal in §Y30§! days.\n[NAMPwHeavyArmsStatus]"
