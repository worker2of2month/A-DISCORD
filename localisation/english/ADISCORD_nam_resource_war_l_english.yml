 # Ladder of seals: favours
 NAM_favour_nam: "Favour to the Governors"
 NAM_favour_nam_desc: "For §Y120 days§! the governors control appointments in their districts and in return collect taxes diligently. The favour costs §Y15§! governor support; the next favour is possible only after §Y180 days§!."
 NAM_favour_nam_ready_tt: "Governor support is at least §Y70§! £NAM_support_nam_texticon"
 NAM_favour_nam_tt: "Governor support: §R-15§! £NAM_support_nam_texticon.\nThe ladder of seals shifts §Y0.10§! towards the vertical."
 NAM_favour_oil: "Favour to the Oilfields"
 NAM_favour_oil_desc: "For §Y120 days§! the oil workers receive a share of the revenue and allocate their own shifts. The favour costs §Y15§! oil worker support; the next favour is possible only after §Y180 days§!."
 NAM_favour_oil_ready_tt: "Oil worker support is at least §Y70§! £NAM_support_oil_texticon"
 NAM_favour_oil_tt: "Oil worker support: §R-15§! £NAM_support_oil_texticon.\nThe ladder of seals shifts §Y0.05§! towards the districts."
 NAM_favour_dist: "Favour to the Districts"
 NAM_favour_dist_desc: "For §Y120 days§! the districts control their own construction, schools and local levies. The favour costs §Y15§! district support; the next favour is possible only after §Y180 days§!."
 NAM_favour_dist_ready_tt: "District support is at least §Y70§! £NAM_support_dist_texticon"
 NAM_favour_dist_tt: "District support: §R-15§! £NAM_support_dist_texticon.\nThe ladder of seals shifts §Y0.10§! towards the districts."
 NAM_favour_garr: "Favour to the Garrisons"
 NAM_favour_garr_desc: "For §Y120 days§! the garrisons receive priority supply and the right to recruit. The favour costs §Y15§! garrison support; the next favour is possible only after §Y180 days§!."
 NAM_favour_garr_ready_tt: "Garrison support is at least §Y70§! £NAM_support_garr_texticon"
 NAM_favour_garr_tt: "Garrison support: §R-15§! £NAM_support_garr_texticon.\nThe ladder of seals shifts §Y0.05§! towards the vertical."
 NAM_favour_trade: "Favour to the Export Houses"
 NAM_favour_trade_desc: "For §Y120 days§! the export houses receive reduced duties and a share in every contract. The favour costs §Y15§! export house support; the next favour is possible only after §Y180 days§!."
 NAM_favour_trade_ready_tt: "Export house support is at least §Y70§! £NAM_support_trade_texticon"
 NAM_favour_trade_tt: "Export house support: §R-15§! £NAM_support_trade_texticon."
 NAM_favour_nam_idea: "Favour to the Governors"
 NAM_favour_nam_idea_desc: "The governors have received their share of power and pay for it with diligent levies and obedient offices."
 NAM_favour_oil_idea: "Favour to the Oilfields"
 NAM_favour_oil_idea_desc: "The oilfields work for themselves and therefore work better: full shifts, working pumps."
 NAM_favour_dist_idea: "Favour to the Districts"
 NAM_favour_dist_idea_desc: "The districts build what they need themselves and do not wait for the chancery's permission for every bridge."
 NAM_favour_garr_idea: "Favour to the Garrisons"
 NAM_favour_garr_idea_desc: "The garrisons receive equipment and recruits first and answer with discipline."
 NAM_favour_trade_idea: "Favour to the Export Houses"
 NAM_favour_trade_idea_desc: "The export houses trade on privileged terms and share with the treasury a profit that did not exist before."
 NAM_seal_junta: "Junta of Seals"
 NAM_seal_junta_desc: "The new ruler took the seals by force. The chancery executes orders faster than ever, but people remember how he came to power."

 # Ladder of seals: endings
 NAM_spirit_iron_ladder: "Reliance on the Namestniks"
 NAM_spirit_iron_ladder_desc: "Every rung of the ladder is fixed by law and by a garrison. An order travels from the chancery to the last post without dispute - and without room for error."
 NAM_spirit_service_republic: "Accountable Government"
 NAM_spirit_service_republic_desc: "An office in Svetlogorye is a duty, not a possession. Officials answer for the result, not for the seal beneath it."
 NAM_spirit_federation: "Federal Compact"
 NAM_spirit_federation_desc: "The districts manage their own affairs and the common council the common ones. Government is slower, but its decisions are carried out without coercion."
 NAM_spirit_oil_union: "Public Oilfields"
 NAM_spirit_oil_union_desc: "Oilfields and districts are bound by a common agreement: every barrel is counted, every share is paid, and the oil works for the whole country."
 NAM_ending_coup_leader_tt: "The ruler who took the seals by force remains at the head of the country and keeps his course."
 NAM_ending_iron_leader_tt: "§YEgor Rom§! rules the Svetlogorye State (§YEtatism§!)."
 NAM_ending_iron_name_tt: "The country takes the name §YSvetlogorye State§!."
 NAM_ending_iron_ladder_tt: "The ladder of seals shifts §Y0.20§! towards the vertical.\nRivals no longer present demands."
 NAM_ending_service_leader_tt: "§YEgor Rom§! leads the Svetlogorye Republic (§YService Etatism§!)."
 NAM_ending_service_name_tt: "The country takes the name §YSvetlogorye Republic§!."
 NAM_ending_service_ladder_tt: "The ladder of seals shifts §Y0.10§! towards the districts.\nRivals no longer present demands."
 NAM_ending_federation_leader_tt: "§YNadezhda Ladygina§! chairs the council of districts. The §YSvetlogorsk Civic League§! (§YHumanism§!) becomes the ruling party; no elections are held."
 NAM_ending_federation_name_tt: "The country takes the name §YSvetlogorye Federation§!."
 NAM_ending_federation_ladder_tt: "The ladder of seals shifts §Y0.20§! towards the districts.\nRivals no longer present demands."
 NAM_ending_oil_union_leader_tt: "§YKirill Mezentsev§! leads the Svetlogorye Union (§Y$contractual_etatism$§!); Egor Rom leaves the leadership."
 NAM_ending_oil_union_name_tt: "The country takes the name §YSvetlogorye Union§!."
 NAM_ending_oil_union_ladder_tt: "The ladder of seals shifts §Y0.10§! towards the districts.\nRivals no longer present demands."

 # Ladder of seals: declaration and rivals
 ADISCORD_nam_groups.12.t: "The Declaration of Svetlogorye"
 ADISCORD_nam_groups.12.d: "Vorkerland has fallen apart, and the telegraph no longer brings orders from the capital. In the chancery hall Egor Rom reads the declaration of independence before governors, commandants and district representatives. The text is ready; the signatures are not, because each side wants its own signature to come first.\n\nThe governors recall that it was the ladder of seals that kept the oilfields from collapse. The districts reply that without their consent the declaration will remain one more paper nobody carries out. The first signature will decide nothing for ever, but it will show on whom the new state means to rest."
 ADISCORD_nam_groups.12.a: "The governors sign first."
 ADISCORD_nam_groups.12.b: "The districts sign first."
 NAM_declaration_vertical_tt: "Governor support: §G+5§! £NAM_support_nam_texticon."
 NAM_declaration_districts_tt: "District support: §G+5§! £NAM_support_dist_texticon."
