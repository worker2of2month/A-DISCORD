 NAM_bw_underground_full_tt:0 "Yaroslav Veter's Underground: §Y[?NAM_underground|0]§! / 100\n[NAMGetUndergroundStatus]\n\nStrength of the underground: §Y[?NAM_underground|0]§! / 100. [NAMGetUndergroundStatus]\n\nEach month the underground grows by §Y2§! while district support is below §Y40§!, and by another §Y1§! while the ladder of seals leans towards the vertical; a paid Svetlogorsk compact lowers it by §Y3§!. At the start of the resource war a strength of §Y60§! or more raises the uprising for certain, §Y30§! to §Y59§! with a §Y50%§! chance, and below §Y30§! there is no uprising. The districts can negotiate with Veter; the vertical can hunt for his caches."
