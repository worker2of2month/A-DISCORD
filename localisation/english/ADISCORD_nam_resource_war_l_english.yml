 # Notes of Egor Rom
 ADISCORD_nam_memoir.read_on: "Read on."
 ADISCORD_nam_memoir.put_away: "Put the notes away."
 ADISCORD_nam_memoir.close: "Close the notes."
 ADISCORD_nam_memoir.1.t: "Notes of Egor Rom: The Seal"
 ADISCORD_nam_memoir.1.d: "I was given my first seal at seventeen. It was wooden, with a chipped edge, and it went only on the waybills of the Klyuchevsk office: how many barrels received, how many sent, how many lost on the way. More was always lost than written down. The senior clerk explained to me that a seal does not certify the truth - it certifies that the truth no longer interests anyone.\n\nI remembered that better than the multiplication table. Ten years later I had the office's brass seal; twenty years later, a governor's seal. With every rung there were more of them, and each weighed less: at the bottom a seal decided whether a crew was paid, at the top whether another order went off to a capital where nobody would read it.\n\nVorkerland built us as a ladder down which oil descended and up which orders climbed. Nobody asked where the ladder led if there was no one at the top."
 ADISCORD_nam_memoir.11.d: "Now I sit in the office where I once waited for an audience with a folder of waybills, and I put the last seal myself. Sometimes I think the ladder could be taken apart and built into a house. Sometimes I think that without it nothing would remain here but oilfields and people dividing them with their fists.\n\nKirill Mezentsev says I think too much about seals and too little about ledgers. He is right: a ledger shows whom we owe. But a seal shows who will answer when there is nothing left to pay. I want everyone who lives in Svetlogorye to know that answer - even if the answer turns out to be me.\n\nI am not writing this for posterity. Posterity will read only the seals. I write it for myself, to remember: the wooden seal with the chipped edge still lies in my desk drawer."
 ADISCORD_nam_memoir.2.t: "Notes of Egor Rom: Klyuchevsk"
 ADISCORD_nam_memoir.2.d: "My father drilled wells in Klyuchevsk until a well took his arm. His compensation was signed four years later: three signatures in the office, two in the district, one in the capital. By then he believed none of them.\n\nKlyuchevsk smells as it did in my childhood: crude oil, burnt rubber and the salty wind from Sukhorechye. The derricks stand where the first governors put them, and half of them run on the foremen's word of honour. Arseny Tarkhanov calls these fields his own, and in a sense he is right: nobody else knows where every barrel lies underground.\n\nIn the reports the oilfields are numbers. On the ground they are people who rise before dawn and return to the barracks after the numbers have already gone out by telegraph."
 ADISCORD_nam_memoir.12.d: "The neighbours say this oil was theirs until Vorkerland moved the border. Perhaps. But which of them went down the shaft when the gas was burning? Who paid the widows? Our rights to these fields are written not in treaties but in sick notes.\n\nI will not say this at the negotiations: diplomats do not accept sick notes as evidence. I will say it at the oilfields, and there I will be understood better than in any chancery. Oil has made Svetlogorye rich on paper. If we do not learn to share it with those who extract it, it will make us truly poor.\n\nMy father died without learning that his son had become governor. Perhaps that is for the best: he would have asked when his compensation was coming."
 ADISCORD_nam_memoir.3.t: "Notes of Egor Rom: The City and the Underground"
 ADISCORD_nam_memoir.3.d: "In Svetlogorsk the walls say what the chancery does not say aloud. I read them every morning on my way to the office. Some demand bread, others open accounts, others simply list officials' surnames. Mine is written more often than any other, and I take that as recognition.\n\nI knew Yaroslav Veter as a boy: he carried his street's petitions to the office and waited in the corridor for an answer until evening. He never received one. Then the petitions stopped coming, and leaflets with his signature appeared on the walls. I was told he has caches, couriers and people in the garrisons. I was not told why the boy with the petition became a man with caches. That I know myself."
 ADISCORD_nam_memoir.13.d: "The inspectors propose finding the caches and finishing the matter. The districts propose sitting down with him at a table. Both are right, and that is the whole trouble: an underground can be crushed, but the reason it appeared cannot.\n\nIf the war comes before we decide, Veter will choose for us. He will bring people into the streets on the day the army stands at the oilfields, and the city will become a third front. I do not want to fight Svetlogorsk. But I cannot let Svetlogorsk decide for the whole country.\n\nToday the wall by the station read: \"The seal does not answer.\" I stopped the car and looked at the words for a long time. Then I ordered them left unpainted."
 ADISCORD_nam_memoir.4.t: "Notes of Egor Rom: The Neighbours"
 ADISCORD_nam_memoir.4.d: "The archive holds three maps of the basin. On the first the border follows the river, on the second the old road, and on the third there is no border at all: Vorkerland drew maps for itself, not for its neighbours. Eflor holds the first, Azhar the second. We were left with the third.\n\nI have met people from Eflor and Azhar more often than my own governors. They are not villains. They remember how their land was taken and believe the time has come to collect the debt. The trouble is that the debt was long ago invested in derricks, pipes and barracks where our people live. Returning the land means evicting them. Not returning it means war."
 ADISCORD_nam_memoir.14.d: "Samir Azhar counts fuel the way I count seals: every barrel and every signature. One can come to terms with him if the price is named in advance. Eflor speaks the language of grievance, and that language is harder: a grievance cannot be paid off in tanker cars.\n\nEvery month the pressure on the border grows. I am brought notes that must be answered with notes and reports that must be answered with orders. Sometimes I think the war will be started not by a politician but by a clerk who sends the wrong paper to the wrong department.\n\nI ordered all three maps kept together. When this is over, someone will have to draw a fourth."
 ADISCORD_nam_memoir.5.t: "Notes of Egor Rom: What a State Owes"
 ADISCORD_nam_memoir.5.d: "People often ask me who I was under Vorkerland. I answer: a man who put seals under other people's decisions. Now the decisions are mine, and so are the seals. It has proved heavier than I expected.\n\nThe state we are building need not be kind. But it must be understandable: a person must know where his tax goes, who answers for late wages and whom to go to if nobody wants to answer. The empire gave no such answers because it did not need to be understood. We do, or people will not tolerate us."
 ADISCORD_nam_memoir.15.d: "The governors want the ladder to remain. The districts want it taken apart. I climbed it too long to believe it can simply be thrown away, and I know its rungs too well to believe it will survive another generation without repair.\n\nPerhaps I am not the man who will finish this work. Perhaps a council will finish it, perhaps one of my rivals, and perhaps it will never be finished. But if in twenty years someone in Svetlogorye opens these notes and does not understand what I was so worried about, we will have succeeded.\n\nHere I end my notes. I will give the wooden seal to a museum. Let it lie under glass and certify nothing more."

 # Archive documents
 ADISCORD_nam_archive.1.t: "Archive: Letters to the Centre"
 ADISCORD_nam_archive.1.d: "A chancery cabinet held a folder of outgoing letters to the capital from the last six years. Forty-two letters about late wages, seventeen about a shortage of pipes, nine about fires at the oilfields. Each bears a registration stamp. None has an answer.\n\nThe last letter is signed by Rom himself: he asked permission to spend the local fuel reserve on repairing the Klyuchevsk pumps. Below it, in another hand, someone has pencilled: \"Await instructions.\" There were no instructions.\n\nThe archivist asked where to put the folder. Rom ordered it left on the table in the reception room, so that every visitor could see what waiting had cost."
 ADISCORD_nam_archive.1.a: "Leave it in plain sight."
 ADISCORD_nam_archive.2.t: "Archive: Drafts of the Declaration"
 ADISCORD_nam_archive.2.d: "The draft declaration of independence was rewritten eleven times. In the first version Svetlogorye was called a \"provisional administration\", in the fifth a \"self-governing territory\"; in the ninth the word \"state\" appeared for the first time, and it was struck out twice.\n\nThe final text does not mention Vorkerland once. That was Vera Saburova's suggestion: a state, she said, does not begin by explaining why it is no longer a province. The governors' signatures stand on the left, those of the district representatives on the right, and between them remains a space nobody ever filled.\n\nA copy was sent to the neighbours. Azhar acknowledged receipt the next day, Eflor a week later."
 ADISCORD_nam_archive.2.a: "File it as document number one."
 ADISCORD_nam_archive.3.t: "Archive: Quiet Wells"
 ADISCORD_nam_archive.3.d: "The quarterly oilfield inspection report: fires - none, arson - none, leaflets on derricks - two, both old. For the first time in ten years the column \"underground incidents\" contains a dash.\n\nAttached is a note from the head of the Klyuchevsk guard: the workers no longer hide newspapers, and the foremen come of their own accord to report strangers. He writes that he does not know whose credit this is - the talks, the raids or simply wages paid on time - and asks that none of them be changed.\n\nRom underlined the last sentence and sent the note to the chancery marked: \"Adopt as an instruction.\""
 ADISCORD_nam_archive.3.a: "Adopt as an instruction."
 ADISCORD_nam_archive.4.t: "Archive: Minutes of the Council of Pillars"
 ADISCORD_nam_archive.4.d: "The minutes of the first arbitration council of the pillars run to forty pages. Twenty of them are arguments about the order of speakers. The governors demanded to speak first, the garrisons last, and the export houses proposed drawing lots and were ready to pay for it.\n\nOn substance the council took three decisions: the pillars argue in the chancery, not in the streets; every complaint receives an answer within thirty days; a rival who has been heard has no right to demand more by force. The minutes bear the signatures of Arseny Tarkhanov, Lev Kornilov, Taras Drozdov and Vera Saburova. Drozdov signed so hard that the pen tore the paper.\n\nRom ordered the original kept in the safe and copies sent to every office."
 ADISCORD_nam_archive.4.a: "Send out the copies."
 ADISCORD_nam_archive.5.t: "Archive: The General Staff Plan"
 ADISCORD_nam_archive.5.d: "The plan for the defence of the basin is bound in three volumes. The first describes the roads to the fields and the times for moving reserves, the second the lines and depots, the third what to do if the first two fail. The third volume is the thinnest.\n\nIn the margin of the first volume the commandant of the garrisons wrote: \"Oil does not retreat.\" The chief of staff added below: \"People retreat, which is why we need roads.\" A third hand underlined both sentences and added a question mark.\n\nThe plan rests on a simple calculation: the neighbours are stronger in the field, Svetlogorye at its own oilfields. Every day held raises the price of the war for the enemy. The staff asks for money for mobilisation and honestly warns that without it these volumes will remain neatly bound paper."
 ADISCORD_nam_archive.5.a: "Approve the plan."
 ADISCORD_nam_archive.6.t: "Archive: The Border Act"
 ADISCORD_nam_archive.6.d: "The act demarcating the new border was signed in a border hut painted a different colour on each side. The commissions argued over every post, but in the end agreed on a line drawn not on the map but along real posts, roads and wells.\n\nAttached are the lists of prisoners of war who have returned home and an inventory of oilfields restored after the fighting. The last page is a short letter from an Eflorian engineer asking permission to visit his brother's grave on the Svetlogorsk side. Permission was granted the same day.\n\nThe archivist entered the act in the register as number one. The earlier numbers remain with documents signed in a foreign capital."
 ADISCORD_nam_archive.6.a: "Enter it in the register."

  # Focus trees: main, post-war chapter, defeat chapter
 NAM_metropolitan_quota:0 "The Metropolitan Quota"
 NAM_metropolitan_quota_desc:0 "Vorkerland has sent a new oil quota, and once again it does not say how the oil will be paid for. First we collect what sits in the field depots; then we decide who receives it."
 NAM_deliver_the_quota:0 "Fill the Quota"
 NAM_deliver_the_quota_desc:0 "The namestniks are used to measuring loyalty to the capital in tank cars. We ship the full quota: the metropole will remember the chancellery's diligence, and the oil workers will remember the empty tanks."
 NAM_metropolitan_depots:0 "The Metropolitan Depots"
 NAM_metropolitan_depots_desc:0 "The imperial depots in Svetlogorye belong to the capital on paper, but our garrisons guard them. While the link with Vorkerland still holds, we transfer the rifles, equipment and guns to local units through proper channels."
 NAM_concealed_reserve:0 "A Reserve off the Books"
 NAM_concealed_reserve_desc:0 "Part of the output can be written off as leaks, fires and faulty meters. The oil workers will keep it in separate tanks for Svetlogorye, and the namestniks will know that the chancellery lied to the capital."
 NAM_letters_to_the_centre:0 "Letters to the Centre"
 NAM_letters_to_the_centre_desc:0 "Rom writes to the capital every week, and the replies come ever more rarely. We keep copies: one day this correspondence will show when the empire stopped answering."
 NAM_independence_day:0 "A Seal of Our Own"
 NAM_independence_day_desc:0 "Vorkerland has collapsed, and the last order from the capital was never signed. Svetlogorye declares independence: the chancellery's seals no longer bear a foreign crest."
 NAM_neutral_basin:0 "A Basin Outside the War"
 NAM_neutral_basin_desc:0 "Eflor and Azhar demand the return of lands the empire took from them. We declare the basin neutral: Svetlogorye threatens no one and is ready to trade, provided the border dispute is settled at a table and not on the oilfields."
 NAM_basin_is_ours:0 "The Basin Is Ours"
 NAM_basin_is_ours_desc:0 "Every derrick in the basin was raised by local workers, not by Eflorian surveyors. We say so openly and move the garrisons to the border: the neighbours will hear a challenge, but they will understand the fields will not be given away."
 NAM_provisional_statute:0 "The Provisional Statute"
 NAM_provisional_statute_desc:0 "Independence cannot rest on the old regulations of the namestnik office. A provisional statute will define who makes the laws, who carries them out and where to complain about them until the country chooses a permanent order."
 NAM_rom_address:0 "Rom's Address"
 NAM_rom_address_desc:0 "Egor Rom speaks for the first time not as a namestnik but as head of state. He promises no easy winter; he promises that every order now has a person behind it who can be named."
 NAM_tax_rolls:0 "The Tax Rolls"
 NAM_tax_rolls_desc:0 "The old taxpayer rolls were compiled for the capital and missed half the districts entirely. The new rolls cover every oilfield and depot, and the levies will finally reach a treasury of our own."
 NAM_namestnik_circuits:0 "Namestnik Circuits"
 NAM_namestnik_circuits_desc:0 "Namestniks receive permanent inspection circuits and the right to settle disputes on the spot. The vertical comes closer to the people, and its seal grows heavier."
 NAM_district_assemblies:0 "District Assemblies"
 NAM_district_assemblies_desc:0 "Each district convenes an elected assembly that approves local levies and audits its namestnik. Decisions take longer, but no one can call them foreign."
 NAM_seal_courts:0 "Seal Courts"
 NAM_seal_courts_desc:0 "A dispute over a signature is no longer won by whoever holds the older seal. Special courts will hear complaints against namestniks and districts alike under one law."
 NAM_garrison_assembly:0 "Garrison Assembly"
 NAM_garrison_assembly_desc:0 "The commandants have things to say about pay, barracks and the border. We give them an assembly of their own before they start speaking over the chancellery's head."
 NAM_rivals_ledger:0 "The Rivals' Ledger"
 NAM_rivals_ledger_desc:0 "Arseny Tarkhanov, Lev Kornilov, Taras Drozdov and Vera Saburova are waiting for one of Rom's pillars to weaken. The chancellery will keep a ledger of their supporters and shore up the pillars the rivals count on most."
 NAM_hear_klyuchevsk:0 "Hear Klyuchevsk"
 NAM_hear_klyuchevsk_desc:0 "Arseny Tarkhanov, namestnik of Klyuchevsk, speaks for the oilfields: extraction must stay in the hands of those who run it. If we accept his terms, the oil workers will open their reserves and the port offices will be left dissatisfied."
 NAM_hear_the_harbour:0 "Hear the Harbour"
 NAM_hear_the_harbour_desc:0 "Lev Kornilov holds the South Harbour quays and the island runs. He asks for ships and chartering rights; the oilfields fear their oil will become someone else's merchandise again."
 NAM_hear_the_commandant:0 "Hear the Commandant"
 NAM_hear_the_commandant_desc:0 "Commandant Taras Drozdov demands weapons for the garrisons and quiet in the districts. The depots will open for his soldiers, and the district assemblies will remember whose word weighed more."
 NAM_hear_the_registrar:0 "Hear the Registrar"
 NAM_hear_the_registrar_desc:0 "Senior Registrar of Seals Vera Saburova knows where every signature and every awkward file is kept. Her support will strengthen the chancellery, but the commandants dislike seeing the army's fate decided in an archive."
 NAM_pillar_arbitration:0 "Arbitration of the Pillars"
 NAM_pillar_arbitration_desc:0 "Having heard the rivals, Rom sits between them as arbiter. No pillar will get everything, but each will leave with a paper it can show to its own people."
 NAM_underground_reports:0 "Underground Reports"
 NAM_underground_reports_desc:0 "Leaflets signed by Yaroslav Veter keep turning up in the northern belt. We combine reports from the police, the oilfields and the districts into one summary to learn who helps him and why."
 NAM_veter_channel:0 "A Channel to Veter"
 NAM_veter_channel_desc:0 "The districts know people who know Veter. Through them the chancellery will offer to talk instead of shoot; the garrisons will see it as weakness."
 NAM_cache_hunters:0 "Cache Hunters"
 NAM_cache_hunters_desc:0 "The underground lives on hidden weapons caches in abandoned wells and mines. Special garrison teams will hunt them across the belt without asking the districts' permission."
 NAM_amnesty_lists:0 "Amnesty Lists"
 NAM_amnesty_lists_desc:0 "Anyone who lays down arms before the deadline will not be tried for the past. The districts draw up the lists, the namestniks their objections, and Veter's followers wonder for the first time whether to stay underground."
 NAM_mine_councils:0 "Field Councils"
 NAM_mine_councils_desc:0 "Workers' councils gain the right to settle shifts, safety and hiring on the oilfields themselves. The underground has less to promise, and extraction runs without strikes."
 NAM_informers:0 "Informer Network"
 NAM_informers_desc:0 "Every fifth member of the underground owes someone, and every tenth is ready to sell his comrades. The chancellery pays for names, and the districts begin to fear their own neighbours."
 NAM_field_gendarmes:0 "Oilfield Gendarmerie"
 NAM_field_gendarmes_desc:0 "The oilfields receive their own armed guard, answering directly to the chancellery. It will not let the underground burn the derricks, but the workers will have to work under its watch."
 NAM_quiet_wells:0 "Quiet Wells"
 NAM_quiet_wells_desc:0 "For the first time in months, not a single leaflet was found on the oilfields. Quiet does not yet mean consent, but it is enough to plan production."
 NAM_contract_bureau:0 "The Contract Bureau"
 NAM_contract_bureau_desc:0 "Svetlogorye holds most of the world's oil yet still sells it like a colony, through other people's middlemen. The bureau will sign fuel contracts in the state's name and make sure every unit of output is promised at a profit."
 NAM_overseas_buyers:0 "Overseas Buyers"
 NAM_overseas_buyers_desc:0 "Kefreyt, Stelander, Steland and the Land of the Khan are ready to pay for oil if it can be taken aboard a tanker. South Harbour needs a tanker terminal that serves sea voyages alone."
 NAM_field_repair_crews:0 "Field Repair Crews"
 NAM_field_repair_crews_desc:0 "Worn pumps and clogged wells eat into output faster than any war. Standing crews will restore wells on the chancellery's order, not whenever a contractor turns up."
 NAM_refinery_programme:0 "Refinery Programme"
 NAM_refinery_programme_desc:0 "A refinery next to the field turns crude into fuel for our own army. The programme will decide where to build and assign a crew of oil workers to each plant."
 NAM_klyuchevsk_pipeline:0 "The Klyuchevsk Pipeline Route"
 NAM_klyuchevsk_pipeline_desc:0 "Sukhorechye's oil reaches South Harbour in tank cars that are easier to intercept than to guard. We map the pipeline route and buy up pipe from the old imperial depots."
 NAM_deep_wells:0 "Deep Wells"
 NAM_deep_wells_desc:0 "Beneath the depleted strata of the Northern Deposits lie horizons the empire never reached. New drilling will give the basin another unit of throughput."
 NAM_fuel_depots:0 "Harbour Storage"
 NAM_fuel_depots_desc:0 "Oil without tanks must be sold at once and at any price. Storage at South Harbour will let us stockpile fuel for the army and wait for a better buyer."
 NAM_second_drilling_crew:0 "A Second Drilling Crew"
 NAM_second_drilling_crew_desc:0 "One drilling crew runs only one project at a time. A second lets us repair wells on one field while building on another."
 NAM_basin_roads:0 "Basin Roads"
 NAM_basin_roads_desc:0 "Between the Northern Deposits and Sukhorechye, lorries run along ruts that the first rain washes away. Hard roads will speed deliveries for the oilfields and the army alike."
 NAM_mobilisation_office:0 "Mobilisation Office"
 NAM_mobilisation_office_desc:0 "The neighbours are counting the days to war, and we cannot meet it with garrisons alone. The office will prepare divisions on order that take their positions on the very first day of the war."
 NAM_line_survey:0 "Line Survey"
 NAM_line_survey_desc:0 "Surveyors and sappers will walk the border of every oilfield district and mark where trenches would hold the enemy longest. From their maps the defence lines can be prepared in advance."
 NAM_line_engineers:0 "Line Engineers"
 NAM_line_engineers_desc:0 "Experienced companies of the oilfield guard take on another sector. Defence lines can now be prepared in more districts at once."
 NAM_reserve_rolls:0 "Reserve Rolls"
 NAM_reserve_rolls_desc:0 "Everyone who served in the garrisons under the empire is entered in the rolls with an address and a trade. The office can accept one more mobilisation order without stripping the oilfields."
 NAM_motor_column_orders:0 "Motor Column Orders"
 NAM_motor_column_orders_desc:0 "Oilfield lorries can carry more than pipes. The office will accept orders for motor columns able to seal a breach before the enemy reaches the derricks."
 NAM_officer_courses:0 "Officer Courses"
 NAM_officer_courses_desc:0 "Garrison commanders know how to stand guard, not how to lead a division into battle. Accelerated staff courses will give the army officers who know both the regulations and the ground."
 NAM_coastal_battalions:0 "Coastal Battalions"
 NAM_coastal_battalions_desc:0 "South Harbour is Svetlogorye's only gate to the sea, and the enemy knows it. A coastal battery will cover the harbour entrance, and the office will accept orders for battalions to defend it."
 NAM_coastal_watch:0 "Coastal Watch"
 NAM_coastal_watch_desc:0 "Lookout posts on the headlands and the harbour radio station will spot a foreign ship before it nears the quays."
 NAM_island_levy_office:0 "Island Levy Office"
 NAM_island_levy_office_desc:0 "Great Island, the Western Island District and Middle Island mine steel yet pay almost nothing to the treasury. A namestnik office will impose a special levy; the islanders will comply more grudgingly."
 NAM_island_concession:0 "Island Concession"
 NAM_island_concession_desc:0 "Middle Island's steel can be mined with other people's hands and other people's money. We offer the concession to Kefreyt or Veyr: the island stays ours, and the treasury is paid in advance."
 NAM_island_convoys:0 "Island Convoys"
 NAM_island_convoys_desc:0 "The islands are supplied by chance sailings, and every storm cuts them off for weeks. A regular convoy service will carry ore out and supplies in on a schedule."
 NAM_island_governors:0 "Island Administrators"
 NAM_island_governors_desc:0 "The overseas districts need quays, roads and depots, not only tax collectors. The administrators receive funds for works the islands will remember longer than any decree."
 NAM_restitution_desk:0 "The Restitution Desk"
 NAM_restitution_desk_desc:0 "Eflor and Azhar send claim after claim, and each one demands an answer. A dedicated desk in the chancellery will reply with counter-ledgers and treaties from the Vorkerland era, buying time."
 NAM_court_azhar:0 "Win Over Azhar"
 NAM_court_azhar_desc:0 "Azhar needs fuel more than it needs the lands of Sukhorechye. A free shipment of oil will remind its government that trading with Svetlogorye pays better than fighting it."
 NAM_fuel_leverage:0 "Fuel Leverage"
 NAM_fuel_leverage_desc:0 "The neighbours demand our land but fill their engines with our oil. The chancellery gains the right to close the oilfields and terminals to them, and the coalition will learn what its claim costs."
 NAM_basin_talks:0 "Basin Talks"
 NAM_basin_talks_desc:0 "Mediators propose sitting down at one table with Eflor and Azhar. An agreement on the border is unlikely, but every month of talks is another month without war."
 NAM_eflor_fuel_prices:0 "Prices for Eflor"
 NAM_eflor_fuel_prices_desc:0 "Eflor buys Svetlogorye's oil through middlemen and pays less than anyone else. New prices will fill the treasury, and the Eflorian papers will call them robbery."
 NAM_general_staff_plan:0 "General Staff Plan"
 NAM_general_staff_plan_desc:0 "The staff brings the talks, the neighbours' pressure and the state of the garrisons together into one war plan. It assumes the worst and therefore allows one more mobilisation order."
 NAM_discipline_of_seals:0 "No One Abandons the Seal"
 NAM_discipline_of_seals_desc:0 "In war every step of the ladder holds its sector as long as it believes the next step will not waver. A special order reminds namestniks and commandants that an abandoned seal is answered for like an abandoned trench."
 NAM_volunteer_levies:0 "Volunteer Levies"
 NAM_volunteer_levies_desc:0 "At the stations and oilfields, those left off the mobilisation rolls are signing up. Weapons for them will be found in the depots, and commanders among retired NCOs."
 NAM_wells_under_guard:0 "Wells Under Guard"
 NAM_wells_under_guard_desc:0 "The oilfields will not be blown up; they will be defended. Sappers fortify the approaches to the Northern Deposits and the Svetlogorsk District, and the oil workers come to believe they will have somewhere to return to."
 NAM_last_reserve:0 "The Last Reserve"
 NAM_last_reserve_desc:0 "The staff opens the depots it kept for an emergency. The emergency has come."
 NAM_district_volunteers:0 "District Volunteers"
 NAM_district_volunteers_desc:0 "The districts raise their own detachments to defend their oilfields. Many who read Veter's leaflets yesterday are joining the ranks today."
 NAM_martial_seals:0 "Martial Seals"
 NAM_martial_seals_desc:0 "Namestniks receive the right of court-martial in their districts. The seal decides everything again, and whoever disobeys it will answer before a tribunal."
 NAM_oil_score:0 "The Oil Score"
 NAM_oil_score_desc:0 "The mediators are counting the oil of every field still held. The staff publishes its own score so that every soldier knows what his sector of the front is worth."
 NAM_veterans_return:0 "The Veterans Return"
 NAM_veterans_return_desc:0 "The soldiers of the resource war return to the districts with experience the imperial garrisons never had. The cadre lists keep the best in the army; the rest go back to the oilfields."
 NAM_svetlogorsk_shipyards:0 "Svetlogorsk Shipyards"
 NAM_svetlogorsk_shipyards_desc:0 "The Svetlogorsk District can build ships, not just repair other people's. A new yard will give the country a merchant fleet of its own."
 NAM_aftermath_commission:0 "Aftermath Commission"
 NAM_aftermath_commission_desc:0 "Victory has left disputed villages, prisoners and broken roads along the border with Eflor and Azhar. The commission will decide whether this frontier becomes a place of trade or of the next blow."
 NAM_normalisation:0 "Normalisation"
 NAM_normalisation_desc:0 "Svetlogorye renounces its claims on Azhari land and offers the neighbours a return to trade. The commandants call it a concession to the defeated; the port offices call it the start of profitable years."
 NAM_border_revenge:0 "A Score to Settle"
 NAM_border_revenge_desc:0 "The coalition came for our oilfields and lost. Now let the neighbours pay for this war with Upper Loren."
 NAM_prisoner_exchange:0 "Prisoner Exchange"
 NAM_prisoner_exchange_desc:0 "Prisoners on both sides are still waiting in camps. The exchange will bring people home and become the first treaty with former enemies carried out without gunfire."
 NAM_border_trade_posts:0 "Border Trading Posts"
 NAM_border_trade_posts_desc:0 "Trading posts open where checkpoints stood, and Svetlogorye's oil flows through them straight to the neighbours. The new route adds another unit of throughput."
 NAM_frontier_bunkers:0 "Frontier Bunkers"
 NAM_frontier_bunkers_desc:0 "If the neighbours come again, they will meet concrete, not trenches. Bunkers will rise on the approaches to Middle Loren."
 NAM_border_incidents:0 "Border Incidents"
 NAM_border_incidents_desc:0 "Svetlogorye's patrols cross the demarcation line ever more often. Each skirmish weakens the neighbours and reminds them who won the war."
 NAM_aftermath_settled:0 "The Border Settles"
 NAM_aftermath_settled_desc:0 "Whatever path Svetlogorye has taken, the border with Eflor and Azhar no longer changes every month. The commission closes the files of the war and hands its records to the archive."
 NAM_oil_ministry:0 "Ministry of Oil"
 NAM_oil_ministry_desc:0 "The oilfields are no longer divided among wartime departments. The Ministry of Oil will unite extraction, refining and contracts, and at once finds the reserve for one more unit of throughput."
 NAM_middle_loren_wells:0 "Middle Loren Wells"
 NAM_middle_loren_wells_desc:0 "Middle Loren lies at the edge of the basin, and its fields have so far worked without roads or workshops. The city receives an enterprise and the district its access roads."
 NAM_reclaim_230:0 "The Western Island's Steel"
 NAM_reclaim_230_desc:0 "Kefreyt mines the steel of the Western Island District under a wartime agreement. The war is won, and the chancellery demands new terms: payment or the return of the mining rights."
 NAM_export_consortium:0 "Export Consortium"
 NAM_export_consortium_desc:0 "The port offices merge into a consortium with shared tankers and long-term agreements. Contracts gain two new units of throughput, and the oilfields gain buyers instead of refineries of their own."
 NAM_state_refineries:0 "State Refineries"
 NAM_state_refineries_desc:0 "Oil that can be refined at home need not be sold at someone else's price. The state builds refineries at the Northern Deposits and in Sukhorechye."
 NAM_oil_exchange:0 "Oil Exchange"
 NAM_oil_exchange_desc:0 "The price of Svetlogorye's oil is now set in Svetlogorye. The exchange brings sellers and buyers together and takes its share of every deal."
 NAM_south_allied_fuel_office:0 "Allied Fuel Office"
 NAM_south_allied_fuel_office_desc:0 "The allies of the northern camp fight on Svetlogorye's fuel or not at all. The office will route deliveries so that every tank car reaches the front."
 NAM_south_convoy_hunters:0 "Convoy Hunters"
 NAM_south_convoy_hunters_desc:0 "Tankers and barges carry fuel to the furnaces of Shahrabad. Svetlogorye's ships will take to their routes and let the furnaces go cold."
 NAM_rus_crisis_watch:0 "Eyes on the Land of the Khan"
 NAM_rus_crisis_watch_desc:0 "The Khan is building an empire and an orbital programme, and a coalition is already gathering against him. The chancellery must decide how Svetlogorye answers: with oil for the defenders or with a bill for it."
 NAM_rus_fuel_for_coalition:0 "Fuel for the Coalition"
 NAM_rus_fuel_for_coalition_desc:0 "Svetlogorye sends fuel to those who stood against the Khan. Our oil becomes a contribution to the common defence rather than merchandise in someone else's war."
 NAM_rus_demand_share:0 "Demand a Share"
 NAM_rus_demand_share_desc:0 "The defenders need our oil, and Svetlogorye will set a price for it. Whoever wants fuel for the war against the Khan will pay and take our interests into account."
 NAM_rus_expedition_staff:0 "Expeditionary Staff"
 NAM_rus_expedition_staff_desc:0 "Whatever the answer to the Khan, Svetlogorye's army needs a staff able to operate far from the basin. Its officers will study the northern front and prepare depots for an expedition."
 NAM_defeat_count_losses:0 "Counting the Losses"
 NAM_defeat_count_losses_desc:0 "The defeat took the oilfields - under the compromise peace with its tribute, or together with the whole mainland. Before deciding what comes next, the chancellery must honestly count what Svetlogorye has left."
 NAM_defeat_rump_cabinet:0 "Cabinet of Those Who Remain"
 NAM_defeat_rump_cabinet_desc:0 "Half the ministers lost their districts along with their posts. Rom forms a cabinet from those who remain and promises every pillar a seat at the table."
 NAM_defeat_harbour_economy:0 "A Harbour Economy"
 NAM_defeat_harbour_economy_desc:0 "Without the northern oilfields, the harbours become the country's chief asset: the South Harbour if it is still ours, or the island ports. Trade, chartering and ship repair must replace at least part of the lost oil."
 NAM_defeat_island_refuge:0 "Island Refuge"
 NAM_defeat_island_refuge_desc:0 "The overseas districts remain with Svetlogorye, and families and depots from the lost coast are already moving there. The islands need quays and roads to receive them."
 NAM_defeat_purge_of_seals:0 "Purge of the Seals"
 NAM_defeat_purge_of_seals_desc:0 "Namestniks who surrendered oilfields without a fight lose their seals. The districts gain the right to name the guilty, and the ladder grows shorter."
 NAM_defeat_refugee_quarters:0 "Refugee Quarters"
 NAM_defeat_refugee_quarters_desc:0 "Refugees from the lost oilfields are filling the ports Svetlogorye still holds. New quarters and a workshop in the South Harbour, or in the capital if the harbour is lost, will give them homes and work, and the army men."
 NAM_defeat_island_foundries:0 "Island Foundries"
 NAM_defeat_island_foundries_desc:0 "Great Island's steel no longer needs shipping to the mainland. A foundry on the island itself will turn out weapons far from the new border."
 NAM_defeat_revenge:0 "The Course of Return"
 NAM_defeat_revenge_desc:0 "The peace is signed but not accepted. Svetlogorye will prepare to win back its oilfields, and every line of the budget now serves that aim."
 NAM_defeat_accommodation:0 "The Course of Accommodation"
 NAM_defeat_accommodation_desc:0 "The war is lost, but one can trade with the victors too. Svetlogorye recognises the new borders and seeks profit from its former enemies, not revenge."
 NAM_defeat_rebuild_arsenal:0 "Rebuild the Arsenal"
 NAM_defeat_rebuild_arsenal_desc:0 "The arms workshops go over to full shifts: in the South Harbour if it is still ours, otherwise in the capital. The new army will begin with rifles of its own."
 NAM_defeat_hidden_reserve:0 "The Hidden Reserve"
 NAM_defeat_hidden_reserve_desc:0 "Not all the oil was lost with the fields. If the chancellery once hid a reserve from the metropole, it can now hide it from the victors as well. A government in exile trades part of the reserve for transports to run convoys between the islands."
 NAM_defeat_underground_return:0 "Underground in the Lost Lands"
 NAM_defeat_underground_return_desc:0 "People who remember Svetlogorye remain on the seized oilfields. Underground cells will gather intelligence, weapons and signatures, and the chancellery will claim everything taken by the peace treaty."
 NAM_defeat_officer_cadres:0 "Officer Cadres"
 NAM_defeat_officer_cadres_desc:0 "An army beaten once must learn from its mistakes. The officers of the resource war will become instructors for the new intakes."
 NAM_defeat_new_levies:0 "New Levies"
 NAM_defeat_new_levies_desc:0 "The conscription rolls are drawn up anew across every remaining district and island. The new battalions will receive their weapons at once, not on the eve of battle."
 NAM_defeat_war_chest:0 "The War Chest"
 NAM_defeat_war_chest_desc:0 "Harbour revenues are set aside in a special fund that appears in no ledger shown to the victors. It will pay for the guns of the next war and, on the islands, for a shipyard in the capital, without which the flotilla will never return to the mainland."
 NAM_defeat_war_of_return:0 "War of Return"
 NAM_defeat_war_of_return_desc:0 "The army is rebuilt, the oilfields are waiting. Svetlogorye is ready to demand back what the peace treaty took from it."
 NAM_defeat_early_tribute:0 "Buy Out the Tribute"
 NAM_defeat_early_tribute_desc:0 "A year of tribute turns every tank car into a reminder of defeat. One large payment will close the obligation early and free the oilfields for contracts of our own."
 NAM_defeat_oil_union:0 "An Oil Union with the Neighbours"
 NAM_defeat_oil_union_desc:0 "Eflor and Azhar have taken the oilfields but do not know how to work them. Svetlogorye's engineers and joint contracts will give all three countries more oil than enmity would."
 NAM_defeat_open_border:0 "An Open Border"
 NAM_defeat_open_border_desc:0 "Families divided by the new border receive the right of free passage. Some of those who left return to Svetlogorye."
 NAM_defeat_joint_fields:0 "Joint Fields"
 NAM_defeat_joint_fields_desc:0 "Mixed crews work the disputed deposits, and the revenue is shared by treaty. Svetlogorye earns a share from the oilfields it lost in the war."
 NAM_defeat_road_south:0 "The Road South"
 NAM_defeat_road_south_desc:0 "Our former enemies watch Shahrabad with the same unease as we do. Svetlogorye offers Eflor and Azhar an alliance against the furnaces of the South."
 NAM_defeat_southern_charter:0 "The Southern Compact"
 NAM_defeat_southern_charter_desc:0 "The alliance with former enemies is ready for its test. If Shahrabad does not back down, the War for the South will decide whose treaty holds in the desert."
 NAM_defeat_oil_peace:0 "Oil Peace"
 NAM_defeat_oil_peace_desc:0 "Svetlogorye will fight neither for the north nor for the south. Its oil is sold to everyone who pays, and this peace will prove more profitable than any victory."
 NAM_defeat_second_chapter:0 "The Second Chapter"
 NAM_defeat_second_chapter_desc:0 "Svetlogorye has survived defeat without falling apart. Whatever path the country has chosen, its history continues on its own strength."
 NAM_independent_tt:0 "Vorkerland has collapsed, and Svetlogorye is subject to no other country"
