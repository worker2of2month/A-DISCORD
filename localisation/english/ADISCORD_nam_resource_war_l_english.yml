 NAM_pw_notoriety_status:0 "[NAMGetPirateNotoriety]; marks: §Y50§! blockade, §Y75§! raid"
 NAM_pw_notoriety_tt:0 "§YNOTORIETY§!\nCoalition attention to the flotillas: [NAMGetPirateNotoriety].\n\n§YCHANGES§!\n- Successful raid: §R+6§!; prize: §R+8§!; failure: §R+3§!.\n- Eflor and Azhar lanes: §R+10§!, §R+12§! and §R+5§! respectively.\n- Each month: §G-3§!.\n\n§YCOALITION RESPONSE§!\n- At least §Y50§! - a possible island blockade.\n- At least §Y75§! - a possible punitive raid.\n- Responses are at least §Y120§! £time_texticon days apart.\nAbove §Y59§!, raid success multiplier: §Rx0.8§!."
 NAM_pw_revenge_label:0 "Readiness"
 NAM_pw_revenge_value:0 "§Y[?NAM_revenge_readiness|0]§! / 100"
 NAM_pw_revenge_status:0 "[NAMGetLandingForecast] Mark §Y70§! - a third division."
 NAM_pw_revenge_tt:0 "§YREADINESS FOR THE RETURN§!\nBeach drills: §G+10§! readiness. Responses to coalition actions also affect it.\n\n§YSOUTH HARBOUR LANDING§!\n- Base force: §Y2§! £divisions_texticon of marines.\n- Third division: a prepared order or readiness of at least §Y70§!.\n[NAMGetLandingForecast]"
 NAM_pw_fleet_label:0 "Flotillas"
