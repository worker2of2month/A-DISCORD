 ADISCORD_coastal_patrol_vessel: "Coastal Patrol Vessel"
 ADISCORD_coastal_patrol_ship: "Coastal Patrol Vessels"
 ADISCORD_coastal_patrol_ship_desc: "Simple small warships for convoy escort, reconnaissance and control of local straits."
 ADISCORD_coastal_patrol_ship_1: "Resource War Patrol Vessel"
 ADISCORD_coastal_patrol_ship_1_short: "Patrol Vessel"
 ADISCORD_coastal_patrol_ship_1_desc: "A dependable coastal vessel with light guns, torpedoes and minimal anti-aircraft armament."
 modifier_experience_gain_ADISCORD_coastal_patrol_vessel_training_factor: "Coastal Patrol Vessel Training Experience Gain"
 modifier_experience_gain_ADISCORD_coastal_patrol_vessel_mission_factor: "Coastal Patrol Vessel Mission Experience Gain"
 modifier_experience_gain_ADISCORD_coastal_patrol_vessel_combat_factor: "Coastal Patrol Vessel Combat Experience Gain"
 ADISCORD_nam_extraction_defence_corps: "Oilfield Defence Corps"
 ADISCORD_nam_extraction_defence_corps_desc: "Svetlogorye has dispersed its reserves in advance, stationed engineers on the approaches to the oilfields and reorganised its garrisons into a proper field army. It has fewer potential allies than the coalition, but has no intention of surrendering the fields to a swift offensive."
 ADISCORD_nam_restitution_coalition: "Territorial Restitution Coalition"
 ADISCORD_nam_restitution_coalition_desc: "Eflor and Azhar have established a permanent military and political alliance to recover the territories and resource infrastructure seized by Vorkerland and inherited by Svetlogorye. Their joint headquarters coordinates a single war and will remain the foundation of their security afterwards."
 ADISCORD_nam_insurgent_columns: "Insurgent Columns"
 ADISCORD_nam_insurgent_columns_desc: "Deserters, underground activists and local militia from the northern resource belt have formed independent columns. They can hold a short internal front on modest supplies, but lack the heavy forces of a regular army."
 ADISCORD_nam_profitable_volunteer_contracts: "Resource Assistance Contracts"
 ADISCORD_nam_profitable_volunteer_contracts_desc: "Participation in the war will pay off only if access to fuel and transport is agreed in advance. The governments are sending limited volunteer forces without assuming the obligations of the entire coalition."
 ADISCORD_nam_treaty_independence: "Charter of Recognised Independence"
 ADISCORD_nam_treaty_independence_desc: "Eflor and Azhar have formally renounced the right to determine Svetlogorye's future by force. The charter's border annexes establish a new frontier, while the neighbours' signatures turn a de facto break with Vorkerland into recognised independence."
 ADISCORD_nam_first_strike_corps: "First Strike Corps"
 ADISCORD_nam_first_strike_corps_desc: "Svetlogorye's army left its prepared lines to strike first. Surprise has bought time, but the engineering positions and dispersed reserves stayed behind: the corps fights at half the strength it would have had in defence."
 NAM_seal_discipline_dynamic: "Seal Discipline"
 NAM_seal_discipline_dynamic_desc: "Every step of the ladder holds its sector of the front as long as it believes the next step will not waver. Seal discipline: §Y[?NAM_seal_discipline|0]§!/100 ([?NAM_seal_org_factor|=+1%] £organization_texticon). Above 50 it strengthens the army's organisation; below 50 it erodes it."
 NAM_scorched_wells: "Scorched Wells"
 NAM_scorched_wells_desc: "If a field cannot be held, it must not fall to the enemy. Sappers lay charges at the derricks and pumping stations in advance, and the oil workers know they will have to answer to their own crews for every fire."
 NAM_scorched_wells_modifier: "Scorched Wells"
 NAM_scorched_wells_modifier_desc: "The wells are burning and the pumps destroyed. Neither the old nor the new owner will draw resources here until the field is restored."

 # Restitution pressure
 NAM_restitution: "Restitution Pressure"
 NAM_restitution_desc: "§YNEIGHBOURING PRESSURE§!\nPressure: §Y[?NAM_rw_tension|0] / 100§! £world_tension_texticon\n[NAMGetTensionNext]\n\n§YMONTHLY GROWTH§!\n- §R+6§! £world_tension_texticon - base growth.\n- §G-2§! per fuel recipient: Eflor and Azhar.\n- §R+1§! per fuel embargo against them.\n- §R+1§! with two or more paid formations.\n\n§YCRISIS THRESHOLDS§!\n- §Y40§! - restitution notes.\n- §Y70§! - a joint ultimatum.\n- §R100§! - war once the minimum waiting period ends.\nBase period after Vorkerland collapses: §Y300§! £time_texticon days. Current delays are shown in the summary above."
 NAM_rw_next_idle: "Restitution pressure no longer grows."
 NAM_rw_next_dispatched: "§RThe neighbours have begun deploying: war will start within weeks.§!"
 NAM_rw_next_notes: "Next threshold: §Y40§! - restitution notes."
 NAM_rw_next_ultimatum: "Next threshold: §Y70§! - the ultimatum."
 NAM_rw_next_war: "Next threshold: §Y100§! - war. The minimum period has already passed."
 NAM_rw_next_time_bought: "Azhar is holding its troops back: no war begins until the §Y75 days§! of the bought delay have passed."
 NAM_rw_next_window: "Next threshold: §Y100§! - war, but not earlier than §Y300 days§! after the collapse."
 NAM_rw_next_window_protocol: "Next threshold: §Y100§! - war, but the Klyuchevsk protocol has moved it to no earlier than §Y665 days§! after the collapse."
 NAM_restitution_note: "Counter-Note"
 NAM_restitution_note_desc: "§YCOST§!: §Y25§! £political_power_texticon\n§YCOOLDOWN§!: §Y60§! £time_texticon days after use.\n\n§YRESULT§!\nThe chancellery answers claims with ledgers, Vorkerland-era treaties and the neighbours' own officials' signatures.\nRestitution pressure: §G-8§! £world_tension_texticon."
 NAM_restitution_note_tt: "Restitution pressure: §G-8§!."

 # Mobilisation, defence lines and war missions
 NAM_mobilisation: "Mobilisation of Svetlogorye"
 NAM_mobilisation_desc: "§YPREPARED FORMATIONS§!\n[NAMGetOrdersSummary]\n\n§YPAYMENT AND DEPLOYMENT§!\nAn order debits its price and recruits immediately. The treasury equips the formation; it deploys at full strength on the day the war begins.\nCancellation before the war returns treasury, fuel and recruits. Political power is not refunded.\n\n§YOILFIELD DEFENCE§!\nLines under construction: §Y[?NAM_lines_in_progress|0] / [?NAM_line_slots|0]§! £fort_texticon\nSeal discipline: §Y[?NAM_seal_discipline|0] / 100§!\nArmy organisation: [?NAM_seal_org_factor|=+1%] £organization_texticon\n\n§YHOLD ORDERS§!\n- Northern Deposits: [NAMGetHold67]\n- South Coast: [NAMGetHold689]\n- Sukhorechye: [NAMGetHold690]"
