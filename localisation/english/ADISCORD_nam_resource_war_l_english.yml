 ADISCORD_nam_debug_resolve_coalition_victory:0 "§RDEBUG:§! Win the resource war as Eflor and Azhar"
 ADISCORD_nam_debug_resolve_coalition_victory_desc:0 "The coalition dictates the partition of Svetlogorye's mainland."
 ADISCORD_nam_debug_resolve_nam_victory:0 "§RDEBUG:§! Win the resource war as Svetlogorye"
 ADISCORD_nam_debug_resolve_nam_victory_desc:0 "The neighbours acknowledge Svetlogorye's authority over its oilfields."
