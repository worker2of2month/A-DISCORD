 NAM_fuel_shortage: "Broken Svetlogorsk Supplies"
 NAM_fuel_shortage_desc: "The Svetlogorsk fuel contract ended when the war began. The tankers did not arrive, and their replacement has yet to be found."
 NAM_fuel_embargo_modifier: "Svetlogorsk Fuel Embargo"
 NAM_fuel_embargo_modifier_desc: "Svetlogorye has closed its fields and terminals to this country. The embargo lasts until the Svetlogorsk government lifts it."
 NAM_island_convoy_route: "Island Convoy Line"
 NAM_island_convoy_route_desc: "Regular convoys carry the ore of the overseas districts and bring their supplies. The island no longer feels forgotten."
 NAM_south_convoy_blockade: "Svetlogorsk Convoy Hunters"
 NAM_south_convoy_blockade_desc: "Svetlogorsk ships intercept the tankers and barges bound for the furnaces. The factories receive less fuel and work intermittently."
 NAM_oil_unit_free_tt: "Svetlogorye has a free unit of oil throughput for this buyer (overland: §Y[?NAM_oil_free_land_units|0]§!, for overseas buyers: §Y[?NAM_oil_free_units|0]§!)"
 NAM_oil_buyer_eligible_tt: "The country is not at war with us, does not yet buy our fuel, is not awaiting an answer to another offer of ours, is not under our embargo and does not receive fuel under a treaty with us"
 NAM_oil_contract_offer: "Offer a Fuel Contract"
 NAM_oil_contract_offer_desc: "§YCOST§!: §Y50§! £political_power_texticon\n§YCOOLDOWN§!: §Y30§! £time_texticon days after use.\n\n§YRESULT§!\n§YAFTER THE BUYER ACCEPTS§!\nMonthly: §Y1500§! £fuel_texticon from our stockpile to the buyer, §G40§! £ADISCORD_economy_treasury_texticon to the treasury.\nThe contract occupies §Y1§! throughput unit.\n\n§YDELIVERY CONDITIONS§!\nThe South Harbour sea terminal serves only Kefreyt, Stelander, Steland and the Khan's Land.\nWith less than §Y1500§! £fuel_texticon in stock, both delivery and payment are skipped that month. War with the buyer ends the contract.\nAn active export dispatch office adds §G+30§! £ADISCORD_economy_treasury_texticon for each completed monthly delivery."
 NAM_oil_contract_offer_tt: "The buyer receives the offer and answers within days. The free unit is checked again at the answer.\nIf it signs:\n  Oil workers: §G+5§! £NAM_support_oil_texticon\n  Export houses: §G+5§! £NAM_support_trade_texticon"
 NAM_oil_contract_end: "Cancel a Fuel Contract"
 NAM_oil_contract_end_desc: "§YRESULT§!\nDeliveries to the buyer end. Frees §G1§! throughput unit."
 NAM_oil_contract_end_tt: "The contract ends and its unit of throughput is freed.\nThe buyer's opinion of us worsens.\nExport houses: §R-3§! £NAM_support_trade_texticon."
 NAM_fuel_embargo: "Fuel Embargo"
 NAM_fuel_embargo_desc: "§YCOST§!: §Y25§! £political_power_texticon\n§YCOOLDOWN§!: §Y30§! £time_texticon days after use.\n\n§YRESULT§!\nFields and terminals close to the selected country until the embargo is lifted.\nAgainst Eflor or Azhar: restitution pressure §R+1§! £world_tension_texticon each month."
 NAM_fuel_embargo_valid_tt: "The country does not buy our fuel under contract, is not under embargo and does not receive tribute or treaty fuel from us"
 NAM_fuel_embargo_tt: "The country receives the §YSvetlogorsk fuel embargo§! until it is lifted.\nIts opinion of us: §R-25§!.\nExport houses: §R-10§! £NAM_support_trade_texticon."
 NAM_fuel_embargo_lift: "Lift the Fuel Embargo"
 NAM_fuel_embargo_lift_desc: "§YRESULT§!\nReopen the fields and terminals to this country.\nExport house support: §G+5§! £NAM_support_trade_texticon."
 NAM_fuel_embargo_lift_tt: "The embargo ends together with the opinion penalty it caused.\nExport houses: §G+5§! £NAM_support_trade_texticon."
 NAM_project_slot_free_tt: "A project slot is free: §Y[?NAM_projects_in_progress|0]§! of §Y[?NAM_project_slots|0]§! in use (at most §Y2§!)"
 NAM_project_state_ready_tt: "The field is owned and controlled by us and has no other project in progress"
 NAM_project_not_scorched_tt: "The field's wells have not been scorched in the last §Y180 days§!"
 NAM_project_condition_low_tt: "The field's condition is below §Y100§!"
 NAM_project_harbour_held_tt: "§YSouth Harbour§! is owned and controlled by us"
 NAM_project_started_150_tt: "Treasury: §R-150§! £ADISCORD_economy_treasury_texticon; the deposit returns if the work is interrupted.\nOne project slot is occupied."
 NAM_project_started_300_tt: "Treasury: §R-300§! £ADISCORD_economy_treasury_texticon; the deposit returns if the work is interrupted.\nOne project slot is occupied."
 NAM_project_started_350_tt: "Treasury: §R-350§! £ADISCORD_economy_treasury_texticon; the deposit returns if the work is interrupted.\nOne project slot is occupied."
 NAM_project_started_250_tt: "Treasury: §R-250§! £ADISCORD_economy_treasury_texticon; the deposit returns if the work is interrupted.\nOne project slot is occupied."
 NAM_project_refund_tt: "Work interrupted: the deposit returns to the treasury and the project slot is freed."
 NAM_project_repair_wells: "Repair the Wells"
 NAM_project_repair_wells_desc: "§YCOST§!: §Y25§! £political_power_texticon §Y150§! £ADISCORD_economy_treasury_texticon\n§YCOMPLETION§!: §Y45§! £time_texticon days\n\n§YRESULT§!\nCrews replace pumps, clear wells and restore access roads.\nField condition: §Y[?FROM.NAM_field_condition|0] / 100§!; repairs add §G30§!, up to §Y100§!. Throughput is recalculated from condition.\n\n§YIF INTERRUPTED§!\nLosing a required district interrupts the work: the treasury deposit is refunded, political power is not."
 NAM_project_repair_done_tt: "If the field is still ours, its condition rises by §G30§! (up to §Y100§!) and throughput is recalculated. Otherwise the deposit returns to the treasury."
 NAM_project_refinery: "Build a Field Refinery"
 NAM_project_refinery_desc: "§YCOST§!: §Y40§! £political_power_texticon §Y300§! £ADISCORD_economy_treasury_texticon\n§YCOMPLETION§!: §Y90§! £time_texticon days\n\n§YRESULT§!\nThe district gains a building slot and a synthetic refinery.\nField throughput: §G+1§! while the district remains under our control.\n\n§YIF INTERRUPTED§!\nLosing a required district interrupts the work: the treasury deposit is refunded, political power is not."
 NAM_project_refinery_done_tt: "If the field is still ours, the district gains a building slot and a §Ysynthetic refinery§!, and the field's throughput rises by §G1§!. Otherwise the deposit returns to the treasury."
 NAM_project_pipeline: "Lay the Klyuchevsk Pipeline"
 NAM_project_pipeline_desc: "§YCOST§!: §Y35§! £political_power_texticon §Y350§! £ADISCORD_economy_treasury_texticon\n§YCOMPLETION§!: §Y120§! £time_texticon days\n\n§YRESULT§!\nA pipeline connects Sukhorechye with South Harbour.\nThroughput: §G+1§! while both districts remain under our control.\n\n§YIF INTERRUPTED§!\nLosing a required district interrupts the work: the treasury deposit is refunded, political power is not."
 NAM_project_pipeline_done_tt: "If Sukhorechye and South Harbour are still ours, throughput rises by §G1§!. Otherwise the deposit returns to the treasury."
 NAM_project_sea_terminal: "Build a Sea Terminal"
 NAM_project_sea_terminal_desc: "§YCOST§!: §Y30§! £political_power_texticon §Y250§! £ADISCORD_economy_treasury_texticon\n§YCOMPLETION§!: §Y90§! £time_texticon days\n\n§YRESULT§!\nThe South Harbour terminal adds §G+1§! throughput unit exclusively for overseas customers: Kefreyt, Stelander, Steland and the Khan's Land.\n\n§YIF INTERRUPTED§!\nLosing a required district interrupts the work: the treasury deposit is refunded, political power is not."
 NAM_project_terminal_done_tt: "If South Harbour is still ours, §G1§! unit of throughput becomes available to overseas buyers. Otherwise the deposit returns to the treasury."
 NAM_cost_project_repair: "§Y25§! £political_power_texticon §Y150§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_project_repair_blocked: "§R25§! £political_power_texticon §R150§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_project_repair_tooltip: "§Y25§! £political_power_texticon §Y150§! £ADISCORD_economy_treasury_texticon\nThe treasury returns if the work is interrupted."
 NAM_cost_project_refinery: "§Y40§! £political_power_texticon §Y300§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_project_refinery_blocked: "§R40§! £political_power_texticon §R300§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_project_refinery_tooltip: "§Y40§! £political_power_texticon §Y300§! £ADISCORD_economy_treasury_texticon\nThe treasury returns if the work is interrupted."
 NAM_cost_project_pipeline: "§Y35§! £political_power_texticon §Y350§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_project_pipeline_blocked: "§R35§! £political_power_texticon §R350§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_project_pipeline_tooltip: "§Y35§! £political_power_texticon §Y350§! £ADISCORD_economy_treasury_texticon\nThe treasury returns if the work is interrupted."
 NAM_cost_project_terminal: "§Y30§! £political_power_texticon §Y250§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_project_terminal_blocked: "§R30§! £political_power_texticon §R250§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_project_terminal_tooltip: "§Y30§! £political_power_texticon §Y250§! £ADISCORD_economy_treasury_texticon\nThe treasury returns if the work is interrupted."
 NAM_overseas_districts: "Overseas Districts"
 NAM_overseas_districts_desc: "§YISLAND POSSESSIONS§!\nResources: steel £steel_texticon, aluminium £aluminium_texticon, tungsten £tungsten_texticon.\nMost islanders still feel like strangers to the mainland. Island independence is not on the table.\n\n§YISLAND ADMINISTRATION§!\n- Tax levies for the treasury.\n- A regular convoy line £convoy_texticon.\n- Sales of extraction rights to neighbours.\nCurrent levies, convoys and concessions are shown in the export summary under $NAM_national_programmes$."
 NAM_island_steel_levy: "Island Steel Levy"
 NAM_island_steel_levy_desc: "§YCOST§!: §Y20§! £political_power_texticon\n§YDURATION§!: §Y180§! £time_texticon days\n§YCOOLDOWN§!: §Y60§! £time_texticon days after completion.\n\n§YRESULT§!\nGreat Island, Western Island District and Middle Island pay a special steel levy.\nEach of these islands under our rule provides §G30§! £ADISCORD_economy_treasury_texticon and loses §R2%§! compliance each month."
 NAM_island_steel_levy_tt: "Every month while the levy runs, each of the three islands under our rule pays §G30§! £ADISCORD_economy_treasury_texticon and loses §R2%§! compliance."
 NAM_island_convoy_service: "Island Convoy Service"
 NAM_island_convoy_service_desc: "§YCOST§!: §Y25§! £political_power_texticon §Y150§! £ADISCORD_economy_treasury_texticon\n§YDURATION§!: §Y180§! £time_texticon days\n§YCOOLDOWN§!: §Y180§! £time_texticon days after use.\n\n§YRESULT§!\nPay for regular sailings between the harbour and the overseas districts. Convoys carry ore out and supplies in, and the islands obey more readily a government that remembers them.\n§G+8§! £convoy_texticon. Islands under our rule gain §G+15%§! £resources_texticon resource extraction and §G+5%§! compliance growth."
 NAM_island_convoy_service_tt: "Each island under our rule receives the §YIsland Convoy Line§! for §Y180 days§!: resource extraction §G+15%§!, compliance growth §G+5%§!.\nTreasury: §R-150§! £ADISCORD_economy_treasury_texticon."
 NAM_cost_convoy_service: "§Y25§! £political_power_texticon §Y150§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_convoy_service_blocked: "§R25§! £political_power_texticon §R150§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_convoy_service_tooltip: "§Y25§! £political_power_texticon §Y150§! £ADISCORD_economy_treasury_texticon\nThe price is paid on selection."
 NAM_island_concession_231: "Middle Island Steel Concession"
 NAM_island_concession_231_desc: "§YCOST§!: §Y20§! £political_power_texticon\n§YCOOLDOWN§!: §Y60§! £time_texticon days after use.\n\n§YRESULT§!\nOffer steel extraction rights on Middle Island. If the buyer accepts, the treasury receives §G300§! £ADISCORD_economy_treasury_texticon; we retain the island.\n\n§YTERMINATION§!\nWar with the concession holder or loss of the island ends the concession."
 NAM_concession_231_free_tt: "Middle Island is owned and controlled by us; the concession is neither sold nor awaiting an answer; the country is not at war with us"
 NAM_island_concession_231_tt: "The country receives the offer and answers within days. If it agrees, it pays §Y300§! £ADISCORD_economy_treasury_texticon and receives the extraction rights of Middle Island.\nExport houses: §G+6§! £NAM_support_trade_texticon."
 NAM_renegotiate_val_concession: "Renegotiate the Kefreyt Concession"
 NAM_renegotiate_val_concession_desc: "§YCOST§!: §Y25§! £political_power_texticon\n§YCOOLDOWN§!: §Y60§! £time_texticon days after use.\n\n§YRESULT§!\nRenegotiate Kefreyt's wartime concession in the Western Island District.\nKefreyt chooses between paying §G300§! £ADISCORD_economy_treasury_texticon to our treasury once or giving up the concession."
 NAM_val_renegotiation_free_tt: "Kefreyt has answered the previous demand"
 NAM_renegotiate_val_concession_tt: "Kefreyt receives the demand. If it pays §Y300§! £ADISCORD_economy_treasury_texticon, the concession continues; if it refuses, the extraction rights return to us and relations with Kefreyt worsen."
 NAM_request_val_aid: "Ask Kefreyt for Aid against a Concession"
 NAM_request_val_aid_desc: "§YCOOLDOWN§!: §Y30§! £time_texticon days after use.\n\n§YRESULT§!\nOffer Kefreyt extraction rights in the Western Island District in exchange for weapons, mercenaries or volunteers.\nThe aid package and final terms require Kefreyt's agreement."
 NAM_request_val_aid_paid: "Ask Kefreyt for Paid Aid"
 NAM_request_val_aid_paid_desc: "§YCOOLDOWN§!: §Y30§! £time_texticon days after use.\n\n§YRESULT§!\nOffer to buy weapons, mercenaries or volunteers from Kefreyt without granting extraction rights.\nThe agreed deal determines the price and aid package."
 NAM_val_aid_fee_tt: "The treasury holds at least §Y400§! £ADISCORD_economy_treasury_texticon"
 NAM_south_allied_fuel: "Fuel for the Southern Allies"
 NAM_south_allied_fuel_desc: "§YCOST§!: §Y25§! £political_power_texticon\n§YCOOLDOWN§!: §Y45§! £time_texticon days after use.\n\n§YRESULT§!\nEach northern-camp ally receives §G2500§! £fuel_texticon from our stockpile.\nDeliveries proceed while fuel lasts; the next ally receives nothing if the stockpile is insufficient."
 NAM_south_allied_fuel_tt: "Every ally of the northern side in the War for the South receives §G2500§! £fuel_texticon and §G+2%§! war support; the same fuel is taken from our stocks. Deliveries continue while §Y2500§! £fuel_texticon remain in stock."
 NAM_south_convoy_interdiction: "Intercept Shahrabad's Convoys"
 NAM_south_convoy_interdiction_desc: "§YCOST§!: §Y20§! £political_power_texticon §Y2000§! £fuel_texticon\n§YDURATION§!: §Y60§! £time_texticon days\n§YCOOLDOWN§!: §Y60§! £time_texticon days after use.\n\n§YRESULT§!\nThe convoy hunters sail against the tanker and barge routes that feed Shahrabad's furnaces.\nShahrabad loses §R5000§! £fuel_texticon and receives a temporary convoy blockade. Our naval experience: §G+5§! £navy_experience."
 NAM_south_blockade_free_tt: "The previous interception of Shahrabad's convoys has ended"
 NAM_cost_convoy_interdiction: "§Y20§! £political_power_texticon §Y2000§! £fuel_texticon"
 NAM_cost_convoy_interdiction_blocked: "§R20§! £political_power_texticon §R2000§! £fuel_texticon"
 NAM_cost_convoy_interdiction_tooltip: "§Y20§! £political_power_texticon §Y2000§! £fuel_texticon\nThe price is paid on selection."
 ADISCORD_nam_debug_damage_fields: "§RDEBUG:§! Damage Svetlogorsk Fields"
 ADISCORD_nam_debug_damage_fields_desc: "Lowers the condition of the Northern Deposits and the South Coast District by 40 and recalculates oil throughput. Reinforced security halves damage to owned and controlled fields while active."

 ADISCORD_nam_oil.1.t: "Svetlogorsk Fuel"
 ADISCORD_nam_oil.1.d: "A Svetlogorsk trade envoy has brought a draft contract. Svetlogorye offers monthly fuel deliveries from its fields - 1500 £fuel_texticon every month, for as long as the agreement holds and there is no war between us.\n\nSvetlogorsk fields produce most of the South's oil, and the ministries understand that this contract will be hard to give up later. A signature brings fuel now, but makes our depots depend on Egor Rom's decisions."
 ADISCORD_nam_oil.1.a: "We will manage without Svetlogorsk oil."
 ADISCORD_nam_oil.1.b: "Sign the contract."
 NAM_oil_1_a_tt: "No contract is concluded."
 NAM_oil_1_b_tt: "Every month we receive §G1500§! £fuel_texticon while Svetlogorye has free throughput and fuel in stock. A war with Svetlogorye ends the deliveries and causes a fuel shortage for §Y90 days§!."
 ADISCORD_nam_oil.2.t: "The Buyer's Answer"
 ADISCORD_nam_oil.2.d_signed: "[FROM.GetNameDefCap] signs the contract. The first tankers leave the fields within the month, and the harbour offices are already counting the revenue.\n\nEvery contract takes part of the fields' throughput, but it gives the neighbours a stake in keeping Svetlogorsk oil flowing."
 ADISCORD_nam_oil.2.d_lapsed: "[FROM.GetNameDefCap] agrees to the contract, but by the time of signing the fields have no free throughput left. The offices apologise for the delay and promise to return to the matter once capacity is free."
 ADISCORD_nam_oil.2.d_refused: "[FROM.GetNameDefCap] declines the contract. Its ministries prefer not to tie their depots to Svetlogorye - at least for now."
 ADISCORD_nam_oil.2.a: "Noted."
 ADISCORD_nam_oil.4.t: "The Steel of Middle Island"
 ADISCORD_nam_oil.4.d: "Svetlogorye offers the steel extraction rights of Middle Island. The mines stay under the Svetlogorsk flag, but their entire output will go to us. The price is 300 £ADISCORD_economy_treasury_texticon, paid once.\n\nThe concession lasts as long as the island belongs to Svetlogorye and there is no war between us."
 ADISCORD_nam_oil.4.a: "Decline."
 ADISCORD_nam_oil.4.b: "Buy the concession."
 NAM_oil_4_a_tt: "No concession is concluded."
 NAM_oil_4_b_tt: "Treasury: §R-300§! £ADISCORD_economy_treasury_texticon.\nWe receive the extraction rights of §YMiddle Island§!."
 ADISCORD_nam_oil.5.t: "The Concession Answer"
 ADISCORD_nam_oil.5.d_signed: "[FROM.GetNameDefCap] buys the Middle Island steel concession. The money is already in the treasury, and new shift lists hang at the mines."
 ADISCORD_nam_oil.5.d_refused: "[FROM.GetNameDefCap] declines the steel concession. The Middle Island mines keep working for Svetlogorye."
 ADISCORD_nam_oil.5.a: "Noted."
 ADISCORD_nam_oil.6.t: "New Concession Terms"
 ADISCORD_nam_oil.6.d: "The Svetlogorsk chancellery demands a review of the Western Island District concession. An agreement concluded in wartime no longer suits a recognised state: Svetlogorye demands a one-time payment of 300 £ADISCORD_economy_treasury_texticon. Refusal means the end of the concession.\n\nKefreyt knows that one can argue with the owner of an island only up to a point."
 ADISCORD_nam_oil.6.a: "Pay and keep the concession."
 ADISCORD_nam_oil.6.b: "Refuse the new terms."
 ADISCORD_nam_oil.close: "The matter is already settled."
 NAM_oil_6_a_tt: "Treasury: §R-300§! £ADISCORD_economy_treasury_texticon.\nThe extraction rights in the §YWestern Island District§! remain ours."
 NAM_oil_6_b_tt: "The concession ends: the extraction rights return to Svetlogorye.\nOur opinion of Svetlogorye worsens."
 ADISCORD_nam_oil.7.t: "Kefreyt's Answer"
 ADISCORD_nam_oil.7.d_paid: "Kefreyt has accepted the new terms and transferred the money. The Western Island District concession continues, but Svetlogorye now sets its price."
 ADISCORD_nam_oil.7.d_revoked: "Kefreyt has refused to pay. The concession is ended, and the Western Island District mines work for Svetlogorye again. The namestniks call it justice restored; Kefreyt calls it an insult."
 ADISCORD_nam_oil.7.a: "Noted."
 ADISCORD_nam_oil.10.t: "Oil for the Coalition"
 ADISCORD_nam_oil.10.d: "The war against the Land of the Khan runs on several fronts, and every allied staff has the same fuel consumption report on its wall. The coalition's envoys ask Svetlogorye directly: will its oil be shared?\n\nThe oil workers advise naming a price - there will be no other moment like this. The officers remind Rom that without the allies' fuel the Khan's armies will reach the Svetlogorsk fields as well. The export houses propose ordinary contracts: fuel for money, under rules the allies already know."
 ADISCORD_nam_oil.10.a: "Svetlogorye's share comes first."
 ADISCORD_nam_oil.10.b: "Fuel the coalition."
 ADISCORD_nam_oil.10.c: "Offer the allies contracts."
 NAM_oil_10_a_tt: "Oil workers: §G+6§! £NAM_support_oil_texticon\nExport houses: §G+6§! £NAM_support_trade_texticon\nThe coalition allies' opinion of us worsens."
 NAM_oil_10_b_tt: "Every coalition ally receives §G3000§! £fuel_texticon while our stock holds that much fuel; the allies' opinion of us improves."
 NAM_oil_10_c_tt: "Coalition allies among our buyers receive a fuel contract offer. Each contract still needs free throughput."

