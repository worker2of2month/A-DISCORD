 NAM_pw_notoriety_status:0 "[NAMGetPirateNotoriety]; marks: §Y50§! blockade, §Y75§! raid"
 NAM_pw_notoriety_tt:0 "§YNOTORIETY§!\nCoalition attention to the flotillas: [NAMGetPirateNotoriety].\n\n§YCHANGES§!\n- Successful raid: §R+6§!; prize: §R+8§!; failure: §R+3§!.\n- Eflor and Azhar lanes: §R+10§!, §R+12§! and §R+5§! respectively.\n- Each month: §G-3§!.\n\n§YCOALITION RESPONSE§!\n- At least §Y50§! - a possible island blockade.\n- At least §Y75§! - a possible punitive raid.\n- Responses are at least §Y120§! £time_texticon days apart.\nAbove §Y59§!, raid success multiplier: §Rx0.8§!."
 NAM_pw_revenge_label:0 "Readiness"
 NAM_pw_revenge_value:0 "§Y[?NAM_revenge_readiness|0]§! / 100"
 NAM_pw_revenge_status:0 "[NAMGetLandingForecast] Mark §Y70§! - a third division."
 NAM_pw_revenge_tt:0 "§YREADINESS FOR THE RETURN§!\nBeach drills: §G+10§! readiness. Responses to coalition actions also affect it.\n\n§YSOUTH HARBOUR LANDING§!\n- Base force: §Y2§! £divisions_texticon of marines.\n- Third division: a prepared order or readiness of at least §Y70§!.\n[NAMGetLandingForecast]"
 NAM_pw_fleet_label:0 "Flotillas"
 NAM_pw_fleet_value:0 "at sea §Y[?NAM_pirate_raids_active|0]§! of §Y[?NAM_pirate_raid_slots|0]§!, ships §Y[?num_ships|0]§!"
 NAM_pw_fleet_tt:0 "§YFLOTILLAS AT SEA§!\nRaid slots: §Y[?NAM_pirate_raid_slots|0]§! £navy_anchor_texticon, limit §Y3§!. Exile focuses unlock more slots.\nRaid duration: §Y15§! £time_texticon days.\n\n§YMARKERS§!\n- Red - a flotilla at sea.\n- Yellow ring - a free slot.\n- Grey - a locked slot.\n\n§YFLEET STRENGTH§!\nMore than §Y2§! ships improve raid success, more than §Y5§! improve it further."
 NAM_pw_marine_label:0 "Marines"
 NAM_pw_marine_value:0 "prepared §Y[?NAM_marine_orders_paid|0]§! of §Y[?NAM_marine_order_cap|0]§!"
 NAM_pw_marine_tt:0 "§YMARINE ORDERS§!\nOrder capacity: §Y[?NAM_marine_order_cap|0]§! £divisions_texticon, limit §Y3§!.\nPrice per division: §Y50§! loot and §Y4300§! £manpower_texticon.\nReady for the start of the war of return.\n\n§YMARKERS§!\n- Yellow shield - a trained division.\n- Ring - a free order.\n- Grey shield - a locked order.\n\n§YCANCELLATION§!\nBefore the war, orders can be cancelled by decision: loot and recruits are returned."
 NAM_pw_actions_locked:0 "Exile focuses open the black market, the fences, the drill and the marines."
