 NAM_pirate_fence_loot: "Sell Loot to the Fences"
 NAM_pirate_fence_loot_desc: "§YCOST§!: §Y50§! loot\n§YCOOLDOWN§!: §Y30§! £time_texticon days after use.\n\n§YRESULT§!\nThe fences pay a pittance for loot, but the exile's treasury is empty and wages will not wait.\nTreasury: §G+100§! £ADISCORD_economy_treasury_texticon."
