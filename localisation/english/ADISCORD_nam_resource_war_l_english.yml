 # Ladder of seals: favours
 NAM_favour_nam: "Favour to the Governors"
 NAM_favour_nam_desc: "§YCOST§!: §Y15§! £NAM_support_nam_texticon support\n§YDURATION§!: §Y120§! £time_texticon days\n§YCOOLDOWN§!: §Y180§! £time_texticon days after use.\n\n§YRESULT§!\nThe governors control appointments in their districts and in return collect taxes diligently.\nDaily: §G+0.30§! £political_power_texticon. Tax collection: §G+10%§! £ADISCORD_economy_tax_texticon."
 NAM_favour_nam_ready_tt: "Governor support is at least §Y70§! £NAM_support_nam_texticon"
 NAM_favour_nam_tt: "Governor support: §R-15§! £NAM_support_nam_texticon.\nThe ladder of seals shifts §Y0.10§! towards the vertical."
 NAM_favour_oil: "Favour to the Oilfields"
 NAM_favour_oil_desc: "§YCOST§!: §Y15§! £NAM_support_oil_texticon support\n§YDURATION§!: §Y120§! £time_texticon days\n§YCOOLDOWN§!: §Y180§! £time_texticon days after use.\n\n§YRESULT§!\nThe oil workers receive a share of the revenue and allocate their own shifts.\nFuel gain: §G+30%§! £fuel_texticon. Production efficiency growth and local resource extraction: §G+10%§! each."
 NAM_favour_oil_ready_tt: "Oil worker support is at least §Y70§! £NAM_support_oil_texticon"
 NAM_favour_oil_tt: "Oil worker support: §R-15§! £NAM_support_oil_texticon.\nThe ladder of seals shifts §Y0.05§! towards the districts."
 NAM_favour_dist: "Favour to the Districts"
 NAM_favour_dist_desc: "§YCOST§!: §Y15§! £NAM_support_dist_texticon support\n§YDURATION§!: §Y120§! £time_texticon days\n§YCOOLDOWN§!: §Y180§! £time_texticon days after use.\n\n§YRESULT§!\nThe districts control their own construction, schools and local levies.\n§G+10%§! £stability_texticon; construction §G+15%§! £construction_speed_texticon; research §G+5%§! £research_speed_texticon."
 NAM_favour_dist_ready_tt: "District support is at least §Y70§! £NAM_support_dist_texticon"
 NAM_favour_dist_tt: "District support: §R-15§! £NAM_support_dist_texticon.\nThe ladder of seals shifts §Y0.10§! towards the districts."
 NAM_favour_garr: "Favour to the Garrisons"
