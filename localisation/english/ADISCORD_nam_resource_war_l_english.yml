 NAM_pw_notoriety_label:0 "Notoriety"
 NAM_pw_notoriety_value:0 "§Y[?NAM_pirate_notoriety|0]§! / 100"
 NAM_pw_notoriety_status:0 "[NAMGetPirateNotoriety]; marks: §Y50§! blockade, §Y75§! raid"
 NAM_pw_notoriety_tt:0 "Notoriety is the coalition's attention to our flotillas. A successful raid: §R+6§!, a prize: §R+8§!, a failure: §R+3§!; on Eflor's and Azhar's lanes §R+10§!, §R+12§! and §R+5§!. Each month §G-3§!.\nFrom §Y50§! the coalition may declare a blockade of the islands, from §Y75§! it may launch a punitive raid; it answers at most once in §Y120§! days.\nAbove §Y59§! raid success §Rx0.8§!."
 NAM_pw_revenge_label:0 "Readiness"
 NAM_pw_revenge_value:0 "§Y[?NAM_revenge_readiness|0]§! / 100"
 NAM_pw_revenge_status:0 "[NAMGetLandingForecast] Mark §Y70§! - a third division."
 NAM_pw_revenge_tt:0 "Readiness for the return grows with drill on the island beaches (§G+10§! per drill) and changes with our answers to the coalition. From §Y70§! the landing at South Harbour gains a third marine division even without a prepared order."
 NAM_pw_fleet_label:0 "Flotillas"
 NAM_pw_fleet_value:0 "at sea §Y[?NAM_pirate_raids_active|0]§! of §Y[?NAM_pirate_raid_slots|0]§!, ships §Y[?num_ships|0]§!"
 NAM_pw_fleet_tt:0 "Each flotilla runs one raid of §Y15§! days. Raid slots: §Y[?NAM_pirate_raid_slots|0]§!, never more than §Y3§!; exile focuses open new ones.\nRed mark - a flotilla at sea, yellow ring - a free slot, grey - not open yet.\nMore than §Y2§! ships improve raid success, more than §Y5§! even more."
 NAM_pw_marine_label:0 "Marines"
