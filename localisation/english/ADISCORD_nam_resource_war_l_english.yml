 # ----- Colony, underground, island exile and piracy -----
 NAM_colony: "Colony of Vorkerland"
 NAM_colony_desc: "Svetlogorye remains the metropole's oil colony.\n\n§YTRADE WITH THE METROPOLE§!\nTrade houses: §Y[?NAM_wrk_trade_level|0] / 3§! £NAM_support_trade_texticon\nConcession: [NAMGetWrkConcession][NAMGetHiddenReserve]\n\n§YCOLONIAL SECURITY§!\nWeber's underground: §Y[?NAM_underground|0] / 100§! £operatives_boost_resistance_texticon\nGendarmerie sweeps weaken the network but lower district support.\nGrowth, threats and countermeasures are listed under $NAM_underground$.\n\n§REVACUATION AT COLLAPSE§!\nAt collapse, the administration will seize the entire open treasury and fuel stocks. Only completed shelters are protected; oil deposits remain.\nShelters: §Y[?NAM_hidden_reserve|0]§! £ADISCORD_economy_treasury_texticon; §Y[?NAM_hidden_fuel|0]§! £fuel_texticon."
 NAM_wrk_metropole_present_tt: "The metropole exists"
 NAM_wrk_fuel_shipment: "Fuel Shipment to the Metropole"
 NAM_wrk_fuel_shipment_desc: "The metropole has sent another request for fuel. Oilfield services will assign tank cars while trading houses arrange shipment through the established imperial offices."
 NAM_cost_wrk_fuel_shipment: "§Y40000§! £fuel_texticon"
 NAM_cost_wrk_fuel_shipment_blocked: "§R40000§! £fuel_texticon"
 NAM_cost_wrk_fuel_shipment_tooltip: "§Y40000§! £fuel_texticon\nThe fuel goes to the metropole."
 NAM_wrk_fuel_shipment_tt: "Treasury: §G+[?NAM_wrk_shipment_income|0]§! £ADISCORD_economy_treasury_texticon.\nNamestnik support: §G+4§! £NAM_support_nam_texticon.\nOil worker support: §R-3§! £NAM_support_oil_texticon.\nThe metropole receives §Y40000§! £fuel_texticon and remembers the favour. Revenue grows with the level of the trading houses."
 NAM_wrk_trade_concession: "Metropolitan Trade Concession"
 NAM_wrk_trade_concession_desc: "Trading houses are seeking their own authority to make oil deals. The chancellery must agree the concession with imperial offices and decide who will sign the export papers."
 NAM_cost_wrk_trade_concession: "§Y50§! £political_power_texticon §Y200§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_wrk_trade_concession_blocked: "§R50§! £political_power_texticon §R200§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_wrk_trade_concession_tooltip: "§Y50§! £political_power_texticon §Y200§! £ADISCORD_economy_treasury_texticon\nThe treasury returns if the negotiations are interrupted."
 NAM_wrk_concession_started_tt: "Treasury: §R-200§! £ADISCORD_economy_treasury_texticon; the deposit returns if the negotiations are interrupted."
 NAM_wrk_concession_signed_tt: "Concession signed: §G+[?NAM_wrk_trade_weekly_income|2]§! £ADISCORD_economy_treasury_texticon in weekly economic income while the metropole exists. Equivalent to §Y[?NAM_wrk_trade_income|0]§! per month."
 NAM_wrk_concession_refund_tt: "Negotiations interrupted: §G200§! £ADISCORD_economy_treasury_texticon return to the treasury. Political power is not refunded."
 NAM_wrk_concession_status_active: "§Gsigned§!: §Y[?NAM_wrk_trade_weekly_income|2]§! £ADISCORD_economy_treasury_texticon per week through the economy (§Y[?NAM_wrk_trade_income|0]§! per month)."
 NAM_wrk_concession_status_talks: "§Ynegotiations under way§!."
 NAM_wrk_concession_status_none: "not signed; after signing: §Y[?NAM_wrk_trade_weekly_income|2]§! £ADISCORD_economy_treasury_texticon per week (§Y[?NAM_wrk_trade_income|0]§! per month)."
 NAM_hidden_reserve_status_active: "\nHidden reserve: §Y[?NAM_hidden_reserve|0]§! £ADISCORD_economy_treasury_texticon, paid into the treasury at independence."
