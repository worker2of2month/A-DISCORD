 NAM_Matvei_Prichal: "Matvei Severtsev"
 NAM_Grigory_Levashov: "Grigory Levashov"
 NAM_Egor_Rom_desc: "Egor Rom began as a clerk in the Klyuchevsk office and climbed the ladder of seals to become governor of all Svetlogorye. He knows the price of every signature and remembers how many barrels of oil each one cost. His power rests not on affection but on the fact that without him the papers stop moving."
 NAM_Arseny_Klyuch_advisor_desc: "Governor of Klyuchevsk and master of the largest oilfields. He speaks for the oil workers but counts their earnings as his own."
 NAM_Lev_Gavanov_advisor_desc: "Master of the South Harbour and the overseas districts. He knows every captain and every buyer across the sea."
 NAM_Taras_Shtyk_advisor_desc: "Commandant of the garrisons. The soldiers trust him more than the chancery, and he makes no secret of it."
 NAM_Vera_Pechat_advisor_desc: "Senior registrar of seals. Every governor's appointment passes through her register."
 NAM_Arseny_Klyuch_leader_desc: "Arseny Tarkhanov took power in the name of the oilfields. Now Klyuchevsk oil is the state treasury, and the state treasury is his cash box."
 NAM_Lev_Gavanov_leader_desc: "Lev Kornilov rules from the South Harbour. He promises Svetlogorye trade with the whole world and expects obedience in return."
 NAM_Taras_Shtyk_leader_desc: "Taras Drozdov marched the garrisons into the chancery. His order is simple: command, execution, report to the commandant."
 NAM_Vera_Pechat_leader_desc: "Vera Saburova knows where every seal of Svetlogorye lies. Now all of them are kept in her register."
 NAM_Nadezhda_Okrug_desc: "Nadezhda Ladygina chairs the council of districts. Her authority is bounded by the charter and rests on the consent of the districts."
 NAM_Kirill_Vykup_desc: "For years Kirill Mezentsev balanced the chancery's ledgers. Now he leads the Svetlogorye Union, where every barrel is accounted for in a common agreement."
 NAM_trait_keeper_of_seals: "Keeper of Seals"
 NAM_trait_oil_ledger: "Oil Ledger"
 NAM_trait_usurper_of_seals: "Usurper of Seals"
 NAM_trait_klyuchevsk_magnate: "Magnate of Klyuchevsk"
 NAM_trait_harbour_master: "Master of the Harbour"
 NAM_trait_garrison_commandant: "Commandant of the Garrisons"
 NAM_trait_registrar_of_seals: "Registrar of Seals"
 NAM_trait_council_chair: "Chair of the District Council"
 NAM_trait_oil_union_treasurer: "Treasurer of the Oil Union"

