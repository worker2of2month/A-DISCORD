 ADISCORD_nam_resource_war.88.t:0 "The Metropole's Last Train"
 ADISCORD_nam_resource_war.88.d:0 "The central cashiers left before the chancellery received their recall orders. Government trucks waited outside the banks at night; the oilfields closed their sidings until the last tank cars had departed north. By morning, the desks held inventories marked \"Evacuated to the central government\".\n\nThey took everything recorded in the open ledgers: the colony's cash, fuel from public depots and consignments still awaiting local acceptance. Clerks who had promised to wait for the governor's signature produced orders from another authority. The harbour telephones fell silent.\n\nYet every inventory had its limits. Inspectors had never reached certain warehouses; some accounts did not exist in the pages sent to them. Local bookkeepers and oil workers must now open what they managed to conceal and discover what Svetlogorye has truly retained."
 ADISCORD_nam_resource_war.88.a:0 "Open our own books."
