  # Piracy window
 NAM_pw_loot_label:0 "Loot"
 NAM_pw_loot_value:0 "§Y[?NAM_pirate_loot|0]§!"
 NAM_pw_loot_tt:0 "§YFLOTILLA LOOT§!\n- Successful raid: §G+50§! loot.\n- Eflor and Azhar convoys: §G+60§! loot.\n- Rich prize: §G+100§! loot.\n\n§YSPENDING§!\nLoot pays for the black market, drills and marines; fences exchange it for treasury. Buttons below the map show exact prices and results."
 NAM_pw_coalition_label:0 "Coalition"
 NAM_pw_coalition_value:0 "[NAMPwCoalition]"
 NAM_pw_coalition_blockade:0 "§Rblockade§!"
 NAM_pw_coalition_lying_low:0 "§Ywe lie low§!"
 NAM_pw_coalition_hunted:0 "§Rthreatens a raid§!"
 NAM_pw_coalition_wanted:0 "§Rthreatens a blockade§!"
 NAM_pw_coalition_calm:0 "§Gcalm§!"
 NAM_pw_coalition_tt:0 "Every raid raises notoriety; it falls by §Y3§! each month. Raids on Eflor's and Azhar's lanes anger the coalition most.\nFrom §Y50§! the coalition may close the harbours with a §Y90§!-day blockade: raid success §Rx0.7§!, failure §Rx1.3§!. From §Y75§! it may shell the islands. After its answer the flotillas may lie low for a while, and no new raid can start.\n\nNow: notoriety §Y[?NAM_pirate_notoriety|0]§! / 100 - [NAMGetPirateNotoriety]."
 NAM_pw_landing_label:0 "Landing"
 NAM_pw_landing_value:0 "[NAMPwLandingShort]"
 NAM_pw_landing_three:0 "§Y3§! divisions"
 NAM_pw_landing_two:0 "§Y2§! divisions"
 NAM_pw_landing_tt:0 "The war of return opens with a landing at South Harbour: §Y2§! marine divisions, a third if at least one order is prepared or readiness for the return is §Y70§! or more. Further trained divisions form in the island capital.\n\n[NAMGetLandingForecast]"
 NAM_pw_map_legend:0 "Yellow - lane open, red - a flotilla at sea, blue - escorted convoys, grey - lane closed. An anchor sends a flotilla."
