 NAM_pirate_spend_50_tt: "Loot: §R-50§!."
 NAM_receive_100_tt: "Treasury: §G+100§! £ADISCORD_economy_treasury_texticon."
 NAM_exile_drill: "Drill on the Island Beaches"
 NAM_exile_drill_desc: "Thirty days of landings from boats onto rocks, assaults on piers and night marches. Every drill brings closer the day the exiles return to South Harbour."
 NAM_cost_exile_drill: "§Y20§! £political_power_texticon §Y30§! loot"
 NAM_cost_exile_drill_blocked: "§R20§! £political_power_texticon §R30§! loot"
 NAM_cost_exile_drill_tooltip: "§Y20§! £political_power_texticon §Y30§! loot\nThe loot returns if the drill is interrupted."
