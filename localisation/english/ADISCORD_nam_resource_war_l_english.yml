 ADISCORD_coastal_patrol_vessel: "Coastal Patrol Vessel"
 ADISCORD_coastal_patrol_ship: "Coastal Patrol Vessels"
 ADISCORD_coastal_patrol_ship_desc: "Simple small warships for convoy escort, reconnaissance and control of local straits."
 ADISCORD_coastal_patrol_ship_1: "Resource War Patrol Vessel"
 ADISCORD_coastal_patrol_ship_1_short: "Patrol Vessel"
 ADISCORD_coastal_patrol_ship_1_desc: "A dependable coastal vessel with light guns, torpedoes and minimal anti-aircraft armament."
 modifier_experience_gain_ADISCORD_coastal_patrol_vessel_training_factor: "Coastal Patrol Vessel Training Experience Gain"
 modifier_experience_gain_ADISCORD_coastal_patrol_vessel_mission_factor: "Coastal Patrol Vessel Mission Experience Gain"
 modifier_experience_gain_ADISCORD_coastal_patrol_vessel_combat_factor: "Coastal Patrol Vessel Combat Experience Gain"
 ADISCORD_nam_extraction_defence_corps: "Oilfield Defence Corps"
 ADISCORD_nam_extraction_defence_corps_desc: "Svetlogorye has dispersed its reserves in advance, stationed engineers on the approaches to the oilfields and reorganised its garrisons into a proper field army. It has fewer potential allies than the coalition, but has no intention of surrendering the fields to a swift offensive."
 ADISCORD_nam_restitution_coalition: "Territorial Restitution Coalition"
 ADISCORD_nam_restitution_coalition_desc: "Eflor and Azhar have established a permanent military and political alliance to recover the territories and resource infrastructure seized by Vorkerland and inherited by Svetlogorye. Their joint headquarters coordinates a single war and will remain the foundation of their security afterwards."
 ADISCORD_nam_insurgent_columns: "Insurgent Columns"
 ADISCORD_nam_insurgent_columns_desc: "Deserters, underground activists and local militia from the northern resource belt have formed independent columns. They can hold a short internal front on modest supplies, but lack the heavy forces of a regular army."
 ADISCORD_nam_profitable_volunteer_contracts: "Resource Assistance Contracts"
 ADISCORD_nam_profitable_volunteer_contracts_desc: "Participation in the war will pay off only if access to fuel and transport is agreed in advance. The governments are sending limited volunteer forces without assuming the obligations of the entire coalition."
 ADISCORD_nam_treaty_independence: "Charter of Recognised Independence"
 ADISCORD_nam_treaty_independence_desc: "Eflor and Azhar have formally renounced the right to determine Svetlogorye's future by force. The charter's border annexes establish a new frontier, while the neighbours' signatures turn a de facto break with Vorkerland into recognised independence."
 ADISCORD_nam_prewar_defence_category: "Svetlogorye's Prewar Defences"
 ADISCORD_nam_prewar_defence_category_desc: "After Vorkerland's collapse, demands from the neighbours are only a matter of time. While the borders remain formally peaceful, the administration can prepare field positions along two likely axes of attack."
 ADISCORD_nam_fortify_extraction_line: "Fortify the Oilfield Line"
 ADISCORD_nam_fortify_extraction_line_desc: "Engineer companies will prepare strongpoints on the western roads and fortify the junction shielding the central oilfields from simultaneous pressure by Eflor and Azhar. Work will take §Y35 days§!."
 ADISCORD_nam_fortify_azhar_approaches: "Secure the Azhar Approaches"
 ADISCORD_nam_fortify_azhar_approaches_desc: "Field fortifications will block the eastern passages into the resource basin and the approaches to the South Coast District. Work will take §Y35 days§!."
 ADISCORD_nam_resource_war.2.t: "The Svetlogorsk Uprising"
 ADISCORD_nam_resource_war.2.d: "With Svetlogorye's main forces tied down along its external borders, deserters, underground activists and opponents of the old colonial administration have seized a compact foothold within the northern resource belt. The Provisional Insurgent Headquarters has denounced Svetlogorye as a continuation of Vorkerland's system of governors and opened an internal front."
 ADISCORD_nam_resource_war.2.a: "Another front, but no reason to surrender."
 ADISCORD_nam_resource_news.1.t: "Eflor and Azhar Invade Svetlogorye"
 ADISCORD_nam_resource_news.1.d: "The unresolved dispute over the northern oilfields has erupted into open war. Following Vorkerland's collapse, Eflor and Azhar demanded the return of territories and resource infrastructure that the former imperial administration had seized from its neighbours and subsequently transferred to Svetlogorye. Svetlogorye's government rejected their joint ultimatum, and the armies of both countries crossed the border.\n\nRakhma and Mazar have authorised limited volunteer corps, tying their assistance to future fuel contracts. A local border dispute has quickly become the first major test of who will control the economic legacy of the fallen Vorkerland."
 ADISCORD_nam_resource_news.1.a: "The imperial inheritance is contested by force once more."
 ADISCORD_nam_resource_news.2.t: "Svetlogorye Partitioned Between Eflor and Azhar"
 ADISCORD_nam_resource_news.2.d: "Svetlogorye's organised defence has ended. Eflor has taken control of the Northern Oilfields, the western terminals and Svetlogorsk. Azhar has occupied the maritime districts of the Black Basin and the southern port. The Provisional Insurgent Headquarters has been dissolved, and Svetlogorye's former administration no longer exists as an independent government.\n\nThe Eflor-Azhar Alliance has declared its original war aims fulfilled and begun demarcating the new border. The victors have recovered much of the territory they claimed before the war, but have also inherited ruined infrastructure, a disputed population and the task of governing lands that spent several generations outside their states."
 ADISCORD_nam_resource_news.2.a: "The victors draw a new border."
 ADISCORD_nam_resource_news.3.t: "Svetlogorye Wins Recognition of Its Independence"
 ADISCORD_nam_resource_news.3.d: "Svetlogorye's army has held the Northern Oilfields and forced Eflor and Azhar to accept peace. For the first time, the signed charter recognises Svetlogorye as a separate state rather than a temporary administration on former Vorkerland territory. The border agreement provides for a limited territorial transfer and leaves the Black Basin dispute unresolved, without further offensives.\n\nThe Svetlogorsk insurgents have been disarmed, but the Eflor-Azhar alliance has survived the war. For the region's other states, the outcome carries a broader significance: one successor to the imperial system has turned its de facto autonomy into a status recognised by treaty."
 ADISCORD_nam_resource_news.3.a: "Independence in practice is now independence by treaty."
 ADISCORD_nam_resource_news.5.t: "Uprising Breaks Out in Svetlogorsk"
 ADISCORD_nam_resource_news.5.d: "Svetlogorye's internal crisis has escalated into open war. While the administration's main forces are engaged against Eflor and Azhar, armed opponents of the governor system have seized the Svetlogorsk District and proclaimed a Provisional Insurgent Headquarters. Garrisons, deserters and underground organisations have united under a separate command and opened a front against their own government.\n\nThe uprising proclaims no new regional empire and lays no claim to all of Svetlogorye. Its immediate aim is to destroy the administrative system inherited from Vorkerland. The government now faces three simultaneous tasks: hold the resource belt, halt the external offensive and recover the capital district."
 ADISCORD_nam_resource_news.5.a: "The foreign war has become a civil war as well."
 ADISCORD_nam_resource_news.6.t: "The Svetlogorsk Uprising Is Crushed"
 ADISCORD_nam_resource_news.6.d: "Svetlogorye's government troops have eliminated the armed foothold in the Svetlogorsk District. The Provisional Insurgent Headquarters has ceased to exist as a separate military force, and the district has returned to the administration's control. Surviving formations have been disarmed or dispersed.\n\nClosing the internal front does not end the resource war. Eflor and Azhar continue to fight for the oilfields and coastal infrastructure, but Svetlogorye can once again direct its main reserves against external enemies. For the governor system, this is the first major political victory since Vorkerland's collapse."
 ADISCORD_nam_resource_news.6.a: "The internal front is closed."
 ADISCORD_nam_resource_news.7.t: "Svetlogorye Accepts a Peaceful Partition"
 ADISCORD_nam_resource_news.7.d: "Svetlogorye's administration has abandoned its attempt to preserve Vorkerland's territorial legacy by force. After closed negotiations with Eflor and Azhar, the governors agreed to withdraw their troops and transfer the disputed districts under a joint protocol. Eflor receives the Northern Oilfields, western terminals and Svetlogorsk District; Azhar receives the maritime districts of the Black Basin and the southern coast.\n\nGarrisons have been ordered to lay down their arms without resistance. Officials have been offered guarantees of continued service or departure, and Svetlogorye's central administration will cease to exist as a separate government. The war for the resource basin, which many regarded as inevitable, has ended before the first shot."
 ADISCORD_nam_resource_news.7.a: "The imperial inheritance was divided at the negotiating table."

 ADISCORD_nam_debug_start_resource_war: "§RDEBUG:§! Start the Svetlogorye Resource War"
 ADISCORD_nam_debug_start_resource_war_desc: "Releases Svetlogorye from its old alliance ties, creates the permanent Eflor-Azhar alliance and launches their joint war against Svetlogorye."
 ADISCORD_nam_debug_resolve_coalition_victory: "§RDEBUG:§! Divide Svetlogorye among the Victors"
 ADISCORD_nam_debug_resolve_coalition_victory_desc: "Divides all of Svetlogorye between Eflor and Azhar, eliminates the Svetlogorye Uprising and preserves the victors' alliance."
 ADISCORD_nam_debug_resolve_nam_victory: "§RDEBUG:§! Confirm Svetlogorye's Victory"
 ADISCORD_nam_debug_resolve_nam_victory_desc: "Ends the war with recognition of Svetlogorye, a limited transfer of a border state and elimination of the surviving rebel army; the neighbouring states' alliance remains."
