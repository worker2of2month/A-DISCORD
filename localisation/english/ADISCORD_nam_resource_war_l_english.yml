 NAM_Arseny_Klyuch: "Arseny Tarkhanov"
 NAM_Lev_Gavanov: "Lev Kornilov"
 NAM_Taras_Shtyk: "Taras Drozdov"
 NAM_Vera_Pechat: "Vera Saburova"
