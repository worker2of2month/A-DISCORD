 NAM_oil_contract_offer: "Offer a Fuel Contract"
 NAM_oil_contract_offer_desc: "Offer this country regular deliveries of Svetlogorsk fuel. Every month the buyer receives §Y1500§! £fuel_texticon from our stocks and the treasury earns §G40§! £ADISCORD_economy_treasury_texticon. A contract occupies one unit of throughput; the South Harbour sea terminal serves only Kefreyt, Stelander, Steland and the Land of the Khan. In a month with less than §Y1500§! £fuel_texticon in stock, delivery and payment are skipped. A war with the buyer ends the contract."
