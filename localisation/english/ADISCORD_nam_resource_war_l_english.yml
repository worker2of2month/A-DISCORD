 NAM_pw_loot_label:0 "Loot"
 NAM_pw_loot_value:0 "§Y[?NAM_pirate_loot|0]§!"
 NAM_pw_loot_tt:0 "The exile flotillas' loot. A successful raid brings §G+50§! (§G+60§! from Eflor's and Azhar's convoys), a rich prize §G+100§!.\nBlack market: rifles §Y40§!, transports §Y60§!, heavy weapons §Y70§!.\nFences: §G100§! £ADISCORD_economy_treasury_texticon for §Y50§! loot.\nDrill - §Y30§!, a marine division - §Y50§!."
 NAM_pw_coalition_label:0 "Coalition"
 NAM_pw_coalition_value:0 "[NAMPwCoalition]"
 NAM_pw_coalition_blockade:0 "§Rblockade§!"
 NAM_pw_coalition_lying_low:0 "§Ywe lie low§!"
 NAM_pw_coalition_hunted:0 "§Rthreatens a raid§!"
 NAM_pw_coalition_wanted:0 "§Rthreatens a blockade§!"
 NAM_pw_coalition_calm:0 "§Gcalm§!"
 NAM_pw_coalition_tt:0 "Every raid raises notoriety; it falls by §Y3§! each month. Raids on Eflor and Azhar anger the coalition most.\nFrom §Y50§! the coalition may close the harbours with a §Y90§!-day blockade: raid success §Rx0.7§!, failure §Rx1.3§!. From §Y75§! it may shell the islands. After its answer the flotillas may lie low for a while, and no new raid can start.\n\nNow: notoriety §Y[?NAM_pirate_notoriety|0]§! / 100 - [NAMGetPirateNotoriety]."
 NAM_pw_landing_label:0 "Landing"
 NAM_pw_landing_value:0 "[NAMPwLandingShort]"
 NAM_pw_landing_three:0 "§Y3§! divisions"
 NAM_pw_landing_two:0 "§Y2§! divisions"
 NAM_pw_landing_tt:0 "The war of return opens with a landing at South Harbour: §Y2§! marine divisions, a third if at least one order is prepared or readiness for the return is §Y70§! or more. Further trained divisions form in the island capital.\n\n[NAMGetLandingForecast]"
 NAM_pw_map_legend:0 "Yellow - lane open, red - a flotilla at sea, blue - escorted convoys, grey - lane closed. An anchor sends a flotilla."
 NAM_pw_islands_label:0 "Islands of exile"
 NAM_pw_lane_EFL_name:0 "Eflor"
 NAM_pw_lane_AZH_name:0 "Azhar"
 NAM_pw_lane_ULV_name:0 "Ulven"
 NAM_pw_lane_RIV_name:0 "Riven"
 NAM_pw_lane_LUR_name:0 "Luren"
 NAM_pw_lane_CHD_name:0 "Charden"
 NAM_pw_route_EFL_tt:0 "§Y[EFL.GetName]§!: coalition convoys off the islands' northern shore.\n[EFL.NAMPwRaidStatus]\n\nPrice: [NAMPwRaidCost]. The flotilla sails for §Y15§! days; if the raid is interrupted, the fuel returns.\n\nOutcome (base: success §Y50§!, prize §Y15§!, failure §Y35§!):\n- success: §G+60§! loot, §G+1000§! £fuel_texticon, the target loses §R2000§! £fuel_texticon; notoriety §R+10§!;\n- prize: §G+100§! loot, §G+2000§! £fuel_texticon, §G+1000§! £infantry_equipment_texticon, §G+3§! £convoy_texticon, the target loses §R3000§! £fuel_texticon; notoriety §R+12§!;\n- failure: a patrol ship or §R1000§! £manpower_texticon; notoriety §R+5§!.\n\nChance factors:\n- [NAMPwShipsFactor]\n- [EFL.NAMPwAlertFactor]\n- [NAMPwBlockadeFactor]\n- [NAMPwNotorietyFactor]\n\nThere is no pause between raids, but a raided country stays alert for §Y90§! days."
 NAM_pw_route_AZH_tt:0 "§Y[AZH.GetName]§!: fuel tankers of the Black Coast.\n[AZH.NAMPwRaidStatus]\n\nPrice: [NAMPwRaidCost]. The flotilla sails for §Y15§! days; if the raid is interrupted, the fuel returns.\n\nOutcome (base: success §Y50§!, prize §Y15§!, failure §Y35§!):\n- success: §G+60§! loot, §G+1000§! £fuel_texticon, the target loses §R2000§! £fuel_texticon; notoriety §R+10§!;\n- prize: §G+100§! loot, §G+2000§! £fuel_texticon, §G+1000§! £infantry_equipment_texticon, §G+3§! £convoy_texticon, the target loses §R3000§! £fuel_texticon; notoriety §R+12§!;\n- failure: a patrol ship or §R1000§! £manpower_texticon; notoriety §R+5§!.\n\nChance factors:\n- [NAMPwShipsFactor]\n- [AZH.NAMPwAlertFactor]\n- [NAMPwBlockadeFactor]\n- [NAMPwNotorietyFactor]\n\nThere is no pause between raids, but a raided country stays alert for §Y90§! days."
 NAM_pw_route_ULV_tt:0 "§Y[ULV.GetName]§!: ships of the Ulven repair yards in the strait off the western islands.\n[ULV.NAMPwRaidStatus]\n\nPrice: [NAMPwRaidCost]. The flotilla sails for §Y15§! days; if the raid is interrupted, the fuel returns.\n\nOutcome (base: success §Y50§!, prize §Y15§!, failure §Y35§!):\n- success: §G+50§! loot, §G+1000§! £fuel_texticon, the target loses §R2000§! £fuel_texticon; notoriety §R+6§!;\n- prize: §G+100§! loot, §G+2000§! £fuel_texticon, §G+1000§! £infantry_equipment_texticon, §G+3§! £convoy_texticon, the target loses §R3000§! £fuel_texticon; notoriety §R+8§!;\n- failure: a patrol ship or §R1000§! £manpower_texticon; notoriety §R+3§!.\n\nChance factors:\n- [NAMPwShipsFactor]\n- [ULV.NAMPwAlertFactor]\n- [NAMPwBlockadeFactor]\n- [NAMPwNotorietyFactor]\n\nThere is no pause between raids, but a raided country stays alert for §Y90§! days."
 NAM_pw_route_RIV_tt:0 "§Y[RIV.GetName]§!: coasters from the Riven bay to the western islands.\n[RIV.NAMPwRaidStatus]\n\nPrice: [NAMPwRaidCost]. The flotilla sails for §Y15§! days; if the raid is interrupted, the fuel returns.\n\nOutcome (base: success §Y50§!, prize §Y15§!, failure §Y35§!):\n- success: §G+50§! loot, §G+1000§! £fuel_texticon, the target loses §R2000§! £fuel_texticon; notoriety §R+6§!;\n- prize: §G+100§! loot, §G+2000§! £fuel_texticon, §G+1000§! £infantry_equipment_texticon, §G+3§! £convoy_texticon, the target loses §R3000§! £fuel_texticon; notoriety §R+8§!;\n- failure: a patrol ship or §R1000§! £manpower_texticon; notoriety §R+3§!.\n\nChance factors:\n- [NAMPwShipsFactor]\n- [RIV.NAMPwAlertFactor]\n- [NAMPwBlockadeFactor]\n- [NAMPwNotorietyFactor]\n\nThere is no pause between raids, but a raided country stays alert for §Y90§! days."
 NAM_pw_route_LUR_tt:0 "§Y[LUR.GetName]§!: ships of the common Luren ports at the eastern mouth of the strait.\n[LUR.NAMPwRaidStatus]\n\nPrice: [NAMPwRaidCost]. The flotilla sails for §Y15§! days; if the raid is interrupted, the fuel returns.\n\nOutcome (base: success §Y50§!, prize §Y15§!, failure §Y35§!):\n- success: §G+50§! loot, §G+1000§! £fuel_texticon, the target loses §R2000§! £fuel_texticon; notoriety §R+6§!;\n- prize: §G+100§! loot, §G+2000§! £fuel_texticon, §G+1000§! £infantry_equipment_texticon, §G+3§! £convoy_texticon, the target loses §R3000§! £fuel_texticon; notoriety §R+8§!;\n- failure: a patrol ship or §R1000§! £manpower_texticon; notoriety §R+3§!.\n\nChance factors:\n- [NAMPwShipsFactor]\n- [LUR.NAMPwAlertFactor]\n- [NAMPwBlockadeFactor]\n- [NAMPwNotorietyFactor]\n- Rich cargoes: prize §Gx1.5§!.\n\nThere is no pause between raids, but a raided country stays alert for §Y90§! days."
 NAM_pw_route_CHD_tt:0 "§Y[CHD.GetName]§!: cargo and mail ships from the great southern island.\n[CHD.NAMPwRaidStatus]\n\nPrice: [NAMPwRaidCost]. The flotilla sails for §Y15§! days; if the raid is interrupted, the fuel returns.\n\nOutcome (base: success §Y50§!, prize §Y15§!, failure §Y35§!):\n- success: §G+50§! loot, §G+1000§! £fuel_texticon, the target loses §R2000§! £fuel_texticon; notoriety §R+6§!;\n- prize: §G+100§! loot, §G+2000§! £fuel_texticon, §G+1000§! £infantry_equipment_texticon, §G+3§! £convoy_texticon, the target loses §R3000§! £fuel_texticon; notoriety §R+8§!;\n- failure: a patrol ship or §R1000§! £manpower_texticon; notoriety §R+3§!.\n\nChance factors:\n- [NAMPwShipsFactor]\n- [CHD.NAMPwAlertFactor]\n- [NAMPwBlockadeFactor]\n- [NAMPwNotorietyFactor]\n- Rich cargoes: prize §Gx1.5§!.\n\nThere is no pause between raids, but a raided country stays alert for §Y90§! days."
