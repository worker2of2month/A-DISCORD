 # Notes of Egor Rom
 ADISCORD_nam_memoir.read_on: "Read on."
 ADISCORD_nam_memoir.put_away: "Put the notes away."
 ADISCORD_nam_memoir.close: "Close the notes."
 ADISCORD_nam_memoir.1.t: "Notes of Egor Rom: The Seal"
 ADISCORD_nam_memoir.1.d: "At seventeen I worked in the Klyuchevsk administration. My first job was handling waybills: how many barrels arrived, how many left, how many were missing. I was given a wooden stamp with a chipped edge. Every evening the senior clerk checked that it was back in its drawer. This irritated me; I thought he doubted my honesty. Later I understood that if the stamp went missing, he would be the first to answer for it.\n\nOnce the total on a waybill did not match its individual entries. I put it aside and took the next one. A carter came, then a storekeeper; both explained that the shipment could not wait. I asked them to bring a corrected sheet. They went to find the man who had drawn it up, and I remained convinced I had done the right thing. I never asked where he was or when he would return.\n\nSuch incidents seldom appeared in the annual report. It counted cargo and deadlines, but not the time people spent waiting in the administration's yard. I learned to find a missing signature quickly. Sometimes I really helped settle a matter; sometimes I merely sent the petitioner elsewhere and cleared my desk. I already understood the difference, though I preferred not to think about it.\n\nLater, at the imperial court, the paper was better and the forms of address stricter. A scribe had to convey someone else's decision accurately, spoil nothing and avoid unwanted attention. I could do that. I knew whom to approach before lunch, whose correction to copy without argument and where to leave a document so it would be noticed. They did not keep me for my convictions.\n\nAfter the revolution I kept my surname and continued serving. When I accepted the governorship, the habit of first checking the approvals did not disappear. I had more authority, but my first question was still the same: who has already agreed, and who can still object?"
 ADISCORD_nam_memoir.11.d: "By habit I prefer taking up a matter when everything is prepared. The attachments are in place, the expenses calculated and the people responsible named. Such a file is easy to sign and pass along. An unprepared one delays the work; it is easy to tell yourself it should first be put in order. I have used that explanation too often to consider it invariably honest.\n\nThe managers know my habits. When they want quick agreement they bring a prepared resolution. It usually says who must carry out the order, but not always who will pay. If I start asking, I am told the matter is urgent. Sometimes that is true. Urgency does not supply the money, yet after several such conversations one wants simply to end the meeting.\n\nMezentsev once returned an estimate with two totals. One included delivery; the other covered only the purchase. I nearly chose the smaller one because it fitted the remaining allowance. Kirill asked who would transport the goods for free. He spoke without mockery, which made it worse. I had to admit I was looking for a convenient sum rather than the right answer.\n\nThe recalculation delayed the purchase. The manager came to ask why the matter had stopped when the money had already been promised. I said delivery costs were being clarified. He observed that the carrier would not keep the old price indefinitely. We summoned Mezentsev again. He brought the first estimate, where transport had occupied a separate line; when the total was prepared, that line had been moved to another attachment.\n\nI instructed them to put the expenses back in one statement and agree it with the carrier. The manager asked me to sign at least the purchase so that the shipment would not be lost. By then my next appointments had begun. I told him to wait and left both estimates before me. Half an hour later the secretary reminded me that the manager was still in the corridor."
 ADISCORD_nam_memoir.2.t: "Notes of Egor Rom: Klyuchevsk"
 ADISCORD_nam_memoir.2.d: "My father was a driller in Klyuchevsk. He lost an arm in an accident. The decision granting compensation was issued four years later; in conversation people constantly confused the wait for payment with the recognition of his entitlement. To an official these were different stages of the case. Father wanted to know what he would live on, and understood each new reply as a promise of money.\n\nI remember him rereading a notice he had received. It acknowledged what had happened and referred to the procedure for further consideration. He asked me to explain the last line. I could already decipher such wording and said the case had finally been accepted. I could not tell him when he would be paid. Later I wrote many similar letters myself.\n\nAt the oilfields I still find it easier to speak to a manager than a crew. The manager knows what information belongs in a report and prepares it beforehand. The workers begin with what has broken, who has not received what they are owed and who promised to look into it. The conversation takes longer; names need checking. Sometimes I catch myself waiting for them to finish.\n\nArseny Tarkhanov knows Klyuchevsk well and readily demonstrates that it cannot manage without him. He can explain which pump will stop without repairs and where an experienced foreman is needed. From this he concludes that he should be trusted in everything else too. Some of his arguments are hard to dispute. But knowing the field does not explain why one debt has been paid and another deferred again.\n\nWhen I ask for a complaint to be examined, I receive the administration's answer. It may be perfectly drafted. It shows where the petition went and on what grounds. To discover whether the person received what was due, I have to ask a separate question. Usually that is the question whose answer is not yet ready."
 ADISCORD_nam_memoir.12.d: "In negotiations over the deposits I am shown documents about their former owners. I cannot dismiss them simply because these lands are now administered from Svetlogorsk. Vorkerland changed borders without consulting everyone affected. Some of those working at the fields may themselves have lost land or moved here because of someone else's decision.\n\nYet transferring a district to the neighbours would explain nothing by itself to its present inhabitants. Who would assume obligations to the workers? Would they keep their homes and wages? What would happen to families who wanted to stay, and to those who chose to leave? I dislike hearing these questions answered with generalities about restored justice. I dislike it still more when I notice the same words in our reply.\n\nIn an office it is convenient to count oil as income. At the fields one must see the expenses that keep it coming: repairs, supplies, treatment for the injured. If these are deferred, the figures look better for a while. A manager has grounds to report success and explain the next breakdown as unforeseen circumstances. I have accepted such explanations and know why people keep bringing them.\n\nFather died before I became governor. Sometimes I imagine telling him of my appointment. He would surely have asked about the work, and I would have begun describing my powers. I do not know whether he would have been pleased. He had reasons to dislike my superiors, and his son's new position would not necessarily have changed his mind.\n\nHis experience did not give me a ready method of government. When the treasury is short, one must choose and refuse someone. But I can at least distinguish a refusal from a promise I do not intend to fulfil. People at the fields understand that difference without explanation. I would like my administration to stop confusing the two."
 ADISCORD_nam_memoir.3.t: "Notes of Egor Rom: The City and the Underground"
 ADISCORD_nam_memoir.3.d: "From notes on Svetlogorsk written before the talks with the underground.\n\nIn the mornings, on my way to the office, I saw writing on the walls. Some demanded bread, some the opening of the accounts, and some named officials who should be removed. My surname appeared often. The official accompanying me assured me it was all the work of a small group of known agitators. Perhaps some slogans were written by the same people. It did not follow that everyone else was content.\n\nI remembered Weber as a young man. He brought petitions from his street and waited a long time in the corridor. I cannot claim to have read every one; some were dealt with without me. The intake register still recorded their transfer to a department. The clerk who had received him had moved elsewhere, and nobody immediately knew whom to ask about the reply.\n\nLater the reports about him mentioned depots, couriers and people in the garrisons. I asked whether the old petitions survived. They were not found at once. Incoming papers were in one place, departmental replies in another, and repeat petitions had been filed separately. While these were being assembled I was again told Weber was dangerous. I did not dispute it; I wanted to know what we had done before such a report became necessary.\n\nThe report proposed adding the petitions to the files on the underground. I asked whether this meant nobody would now answer them. The inspector said the petitioners' connections had to be established first. The conversation returned to the depots. I demanded that dated copies of the petitions remain in the file: a list of couriers alone could not tell me who had come to the administration or when.\n\nThat evening I asked for the petitions to be left with me. Some were drafted so badly I wanted to return them at once for improper form. I marked which information was actually needed for a decision and which we demanded out of habit. There was less of the former than I expected. This did not make the next morning's conversation with the inspectors any easier."
 ADISCORD_nam_memoir.13.d: "The inspectors wanted an order concerning the depots. District representatives proposed opening talks. Each explained why the other method would merely waste time. The inspectors spoke of weapons; the districts spoke of support among the inhabitants. At first I tried to obtain a joint assessment. There was none, and nobody intended to sign for someone else's risk.\n\nI did not want fighting in Svetlogorsk. Families, workshops and depots were there, along with people who might support neither the government nor Weber. Yet I feared a concession would teach everyone else how to deal with the governor. That fear seldom appeared in my official answers. At meetings I preferred to speak about the interests of the state.\n\nOne thing was clear: finding weapons did not settle the dispute over wages and levies. But paying wages did not justify declaring that the weapons were gone. Any course required its results to be checked. I asked for separate reports on those detained, recovered stores and complaints that had been examined. A general statement that the situation was calm could tell me none of this.\n\nA proposal for a meeting reached me through people trusted in the districts. I spent a long time clarifying what they could promise in my name. Perhaps this looked like another attempt to delay matters. In part it was: while the intermediary's authority was under discussion, I did not have to answer the demand itself.\n\nAt the next meeting someone asked whether the intermediary had received his authority. Mezentsev reminded me of the draft reply that had been on my desk since the previous day. I began looking for it among the inspectors' reports. The district representative waited without suggesting another way out. I had to put the other papers aside and read the draft aloud. At the list of possible concessions I stopped and asked him to explain the second line."
 ADISCORD_nam_memoir.4.t: "Notes of Egor Rom: The Neighbours"
 ADISCORD_nam_memoir.4.d: "From notes on negotiations with Eflor and Azhar.\n\nI asked the archive to retrieve old maps of the basin. They drew the border differently: one commission used a river, another a road. Vorkerland's economic plans sometimes showed no political boundary at all; their authors needed to mark pipelines and loading sites. Such a plan is convenient to keep in an office until someone asks on what grounds we control the land.\n\nThe people from Eflor and Azhar referred to their own documents. I did not consider every demand just, but it would be a mistake to think they had invented everything merely for our oil. Behind the claims were lost revenues, old expropriation decisions and the expectations of people who had been promised restitution. The neighbouring governments also had reasons to choose convenient evidence and overlook the rest.\n\nI had to do the same. Before a meeting, staff prepared a file of arguments in our favour. If I asked about a contradictory document, they began explaining why it was better not to present it. Sometimes the explanation was reasonable. Sometimes we simply hoped the other side did not know of it. I did not always insist on pursuing the discussion.\n\nA different border would mean a different administration. What that would change for residents depended on terms not yet agreed. Someone would keep a job, someone would wish to leave, someone would demand former property back. Saying a concession would inevitably evict everyone was convenient for our reply. Promising that nobody would lose anything was convenient for theirs.\n\nI asked for each territorial claim to be accompanied by practical questions: roads, housing, debts, supplies. The envoys did not always want to discuss them. Our own staff disliked the work too. It forced them to see which promises would not fit into a short declaration about a border."
 ADISCORD_nam_memoir.14.d: "In discussions with Azhar it was often possible to name a price. Fuel, postponement, a delivery date: these could be asked about directly. I asked them to record not only the price but when the next delivery would be demanded. The envoys agreed to discuss details later. I wanted a more precise answer before the fuel was sent.\n\nWith Eflor we discussed land, the position of its people and past humiliations. Our memoranda often shortened this to the word 'revanchism'. It spared them listing awkward details. I asked that those be kept at least in the attachments; otherwise at the next meeting we would again have to pretend we were hearing of them for the first time.\n\nI did not want to exchange supervision from the capital for a neighbour's patronage. But saying so was easier than deciding which agreement should be refused. A loan might carry us through a difficult month. A guarantee might postpone an attack. Every proposal needed its terms read carefully, especially those that would apply if a deadline was missed.\n\nMezentsev asked what I considered an acceptable concession. I replied with a list of things that could not be surrendered. He returned to the question. A refusal protects one from accusations of weakness until the moment comes to make it stand. Then troops, reserves and people's willingness to bear the expense are needed. At that point I usually wanted another round of talks.\n\nWe kept the maps with the documents used to compile them. At the next discussion it should be possible to check each line instead of citing its age. I did not expect this to make the neighbours withdraw their claims. I hoped at least not to spend an entire morning disputing something we ourselves had copied incorrectly."
 ADISCORD_nam_memoir.5.t: "Notes of Egor Rom: What a State Owes"
 ADISCORD_nam_memoir.5.d: "From notes on local government written before Vorkerland's collapse.\n\nAt court I copied the decisions of people who did not need to explain them to me. After the revolution there were more explanations. They spoke of the people, a common future and the necessity of a period of transition. A scribe's work remained familiar: record accurately, forward promptly, do not confuse the addressee. I had not chosen this service to help transform the world.\n\nAs governor I was useful to people who needed an executor. I could reach agreements, did not always argue and knew which questions were best brought to a superior with an answer already prepared. It would be untrue to write that I thought only of Svetlogorye's independence from the beginning. At first I wanted to manage my appointment and give nobody cause to doubt me.\n\nLater it became clear how many orders could not be reconciled. Ship more oil and preserve reserves, cut spending and keep work moving, maintain order and do not trouble the capital with complaints. In such cases a subordinate chooses which failure to report later. I managed this for quite a long time. The inhabitants did not always benefit from my resourcefulness.\n\nI want Svetlogorye to manage its affairs without this dependence. Nor do I see a benefit in handing the same powers to the southern dictatorships for a promise of protection. Yet I do not know what arrangement would let us dispense with many habits on which my own work rests. Removing foreign supervision is not enough; afterwards we must reach agreement with people we could previously refer to higher authority.\n\nWhen asked about the future order, I begin with familiar questions: who decides, who pays and where a complaint goes. Sometimes this clarifies the dispute. Sometimes I am merely avoiding the question of who should have the right to appoint me. It is an unpleasant distinction, but it should be recorded."
 ADISCORD_nam_memoir.15.d: "The governors believe that without the existing administration, districts will retain revenues and dispute every instruction. The districts reply that they already pay for an apparatus that has no obligation to listen. I understand both arguments and use that understanding to postpone choosing. At a meeting this looks cautious. Outside the meeting, the matter remains unsettled.\n\nThe hierarchy could lose unnecessary approvals and require officials to answer for results. With the districts we could establish rights that cannot be revoked whenever they inconvenience the government. Either way I would have to give up the convenience of settling a dispute with one telephone call. If I reserved that right for myself as an exception, someone would certainly wish to use it after me.\n\nPeople I know through work often come to see me. They explain the circumstances beforehand, name mutual acquaintances and ask only to be heard. Without prompting, the secretary makes time for them. A stranger may wait much longer for an appointment. When I asked why one visitor had been admitted ahead of the queue, I was told I usually requested that he be shown straight in.\n\nIn the draft of my next instruction I marked questions that needed answers: who may appeal a decision, where they obtain a copy of its grounds, and whom they approach after refusal. These are notes, not an established procedure. They must be discussed with those who will work under it, to learn which objections concern the work and which defend familiar powers.\n\nOn the last page I wrote that the proposals should be referred to a commission. I listed several names, then crossed out two: one was occupied with supply, the other connected to the office being complained about. I left space for the deadline. The secretary asked whether a fair copy could be prepared. I said I would finish the list first, and put it aside until morning."

 # Archive documents
 ADISCORD_nam_archive.1.t: "Archive: Letters to the Centre"
 ADISCORD_nam_archive.1.d: "The archive file contains outgoing letters from six years: forty-two concerning wages, seventeen concerning pipes, nine concerning fires at the fields. At first the report's compiler noted that there were no replies. The archivist brought a second volume: replies from the capital's offices were kept separately. Most acknowledged receipt, requested calculations or referred the matter to another department.\n\nCross-checking revealed repeated petitions. The same damage appeared in the original request, a clarification of costs and a reminder about deadlines. Counting letters produced three cases examined. According to the attached report, the pump installation had remained out of service throughout. Not every delay came from the capital: the local office had twice returned an estimate without specifying which line needed correction.\n\nThe latest request bears Rom's signature. He asked for permission to use the local fuel reserve to repair Klyuchevsk's pumps. Below it survives the instruction 'Await orders', beside a later note: 'Check the installation's condition.' There is no result of that inspection beneath it.\n\nThe report distinguishes correspondence from execution. Each matter is accompanied by the latest known sum, the responsible department and information on what was actually done. Blank spaces have been left blank: the documents provide no grounds for considering this work finished."
 ADISCORD_nam_archive.1.a: "Check what was carried out."
 ADISCORD_nam_archive.2.t: "Archive: Drafts of the Declaration"
 ADISCORD_nam_archive.2.d: "Eleven versions survive in the file on the declaration of independence. The early ones differ chiefly in what to call the new administration. Later revisions become more substantial: who collects payments, who commands the garrisons and which former obligations Svetlogorye assumes.\n\nOne drafter tried to preserve every instruction issued by the metropole. A marginal question asked about orders the new government did not intend to carry out. The next version replaced the general formula with a list of obligations. The list took more space and drew more objections: each line could now be discussed separately.\n\nVera Saburova left a comment on the approval of expenditure. The wording allowed districts to be invited to the discussion and everything then decided without them. Administrative representatives, in turn, asked who would answer for supply if approvals dragged on. The final text retains traces of the dispute; disagreements not settled by the declaration are attached.\n\nThe file contains copies sent to the neighbours and records of delivery. Azhar acknowledged receipt the following day, Eflor a week later. The archival inventory specifically notes that acknowledgment of receipt does not mean recognition of independence. Sending the declaration cannot substitute for such a letter."
 ADISCORD_nam_archive.2.a: "File it as document number one."
 ADISCORD_nam_archive.3.t: "Archive: Quiet Wells"
 ADISCORD_nam_archive.3.d: "The oilfield inspectors' summary records fewer incidents in the areas they checked. Shift logs and a separate note from Klyuchevsk's chief of security are attached. He reports that foremen have begun warning them about strangers more often, and some workers' complaints have been resolved locally.\n\nThe compiler proposed describing the situation as calm. The reviewer asked that the list of inspected sites remain: the information did not cover the entire basin. An absence of arson where the inspection took place said nothing about weapons stored in another district. The leaflet report also included a qualification: the copies found might have lain there for a long time, and their date of distribution could not be established.\n\nThe documents list the reasons for change separately. In some places talks helped, in others stronger security, in others a supply demand that had been fulfilled. The inspectors do not attribute the whole result to one measure. They ask that work on complaints not cease simply because the latest summary looks better than the last.\n\nA brief note by Rom survives on the copy: 'What do we continue doing, and who is responsible?' The attachment lists the next inspections. The document does not declare the underground gone or close the other reports on the city."
 ADISCORD_nam_archive.3.a: "Continue the inspections."
 ADISCORD_nam_archive.4.t: "Archive: Minutes of the Council of Pillars"
 ADISCORD_nam_archive.4.d: "The first arbitration council's minutes run to forty pages. Much of the meeting concerned the handling of disputes. The administration feared any order could be held up by a complaint; district representatives feared every order they contested would be declared urgent. The garrisons demanded separate provisions for supply.\n\nThe minutes include comments submitted by oilfield, garrison and port administrations. In one attachment a fuel allocation was considered agreed; in another the same delivery was disputed. Reading them together revealed that the parties were citing different versions of the estimate. For the first time, discussion moved from authority in general to a sum for which each side was prepared to answer.\n\nThe council established that complaints would be heard in the chancellery and answered within thirty days. A dispute did not permit a party to force a decision through violence. The attachment specified who received a complaint, who obtained the calculations and how a missing reply would be recorded. Agreement on the procedure did not imply agreement with every future ruling.\n\nThe original was placed in safekeeping and copies sent to the administrations. On the covering sheet Rom added an instruction to keep the attachments with the minutes. Without them the general agreement to cooperate looked much more convincing, but it would have been impossible to tell what the parties had actually agreed."
 ADISCORD_nam_archive.4.a: "Send out the copies."
 ADISCORD_nam_archive.5.t: "Archive: The General Staff Plan"
 ADISCORD_nam_archive.5.d: "The basin defence plan has three parts: movement of troops, placement of stores and action if particular roads are lost. Fields, bridges and unloading sites are marked on the map. Some roads have two travel times beside them: an estimate and a figure obtained after checking the transport. They differ considerably.\n\nThe staff insists that units must not be considered ready merely because they are on a list. A formation still needing weapons and vehicles cannot be assigned as a reserve for the same day. Mobilisation orders are considered separately from existing units; an attachment lists what their delivery by the opening of hostilities will require.\n\nNotes to the plan discuss a question unwelcome to the oilfield administrations: which deliveries must be postponed if the army needs the transport. The administrations ask for exact dates. The staff replies that these can be refined once orders are placed and stocks checked. Rom marked the passage and demanded that the reply remain in the final version.\n\nApproving the plan expands the scope for preparation but does not replace payment or execution. Mobilisation orders must still be issued, resources allocated and ready formations sent along checked routes. There is ample space for amendments in the attachments; they will have to be entered as reports arrive."
 ADISCORD_nam_archive.5.a: "Approve the plan."
 ADISCORD_nam_archive.6.t: "Archive: The Border Act"
 ADISCORD_nam_archive.6.d: "The postwar border file contains the demarcation act and the commissions' working papers. The peace treaty established the general line; on the ground they still had to clarify approaches to posts, access to wells and stretches of road that staff maps did not show precisely.\n\nThe commissions' objections are preserved beside the final plan. In one case the dispute concerned a place-name, in another which side would maintain a culvert. To the central offices these looked like minor matters. For residents, the answer determined whom to approach after the first stretch of road washed out.\n\nLists of returned prisoners and reports on repairs to the fields are attached. A separate request comes from an Eflor engineer seeking permission to visit his brother's grave on the Svetlogorye side. It bears an approval and a record of referral to the border service. The permit does not abolish checks at the post, but the duty officer now has grounds to admit the visitor.\n\nThe archivist linked the file to prewar maps so that former names could be found without a new enquiry. Documents concerning disputed areas remain open to additions. A recognised border did not free the administrations from working together; it gave them grounds for discussing specific questions."
 ADISCORD_nam_archive.6.d_standoff: "The file on the cessation of hostilities contains plans of border posts and a list of current border instructions. The armies stopped on the old frontier. There is no treaty recognising Svetlogorye's independence; the inventory's compiler noted this on the cover so that technical records would not be presented as a diplomatic agreement.\n\nOn the ground, roads, wells and the passage of people still require decisions. One report mentions a damaged pipe beneath a road; another concerns families seeking news of relatives on the other side. Correspondence on these questions does not establish a general settlement with the neighbours.\n\nThe military insists that each authorised crossing must not become a precedent for the next. Civil offices ask to be informed of refusals, otherwise visitors spend weeks going between the chancellery and the post. The file preserves the conditions of each reply and the name of whoever confirmed it. The general word 'settled' has been replaced by a list of questions on which a decision exists.\n\nReports on repairs to local roads and fields are attached. Postwar work continues, although the question of independence remains open for Eflor and Azhar. The next commission will need these records without attributing to them the force of a treaty that does not exist."
 ADISCORD_nam_archive.6.a: "Enter it in the register."

  # Focus trees: main, post-war chapter, defeat chapter
 NAM_metropolitan_quota:0 "The Metropolitan Quota"
 NAM_metropolitan_quota_desc:0 "Vorkerland has sent a new oil quota, and once again it does not say how the oil will be paid for. First we collect what sits in the field depots; then we decide who receives it."
 NAM_deliver_the_quota:0 "Fill the Quota"
 NAM_deliver_the_quota_desc:0 "The namestniks are used to measuring loyalty to the capital in tank cars. We ship the full quota: the metropole will remember the chancellery's diligence, and the oil workers will remember the empty tanks."
 NAM_metropolitan_depots:0 "The Metropolitan Depots"
 NAM_metropolitan_depots_desc:0 "The imperial depots in Svetlogorye belong to the capital on paper, but our garrisons guard them. While the link with Vorkerland still holds, we transfer the rifles, equipment and guns to local units through proper channels."
 NAM_concealed_reserve:0 "A Reserve off the Books"
 NAM_concealed_reserve_desc:0 "Part of the output can be written off as leaks, fires and faulty meters. The oil workers will keep it in separate tanks for Svetlogorye, and the namestniks will know that the chancellery lied to the capital."
 NAM_letters_to_the_centre:0 "The Calm Before the Storm"
 NAM_letters_to_the_centre_desc:0 "Rom still sends reports to the capital, but replies arrive less and less often. Behind the terse orders for more supplies, we can no longer hear an authority capable of protecting us. The metropole is falling apart, and those who spoke for the entire empire only yesterday can barely hold on to their own capital.\n\nIn Svetlogorye, the imperial flag still flies. We still wait for couriers and check our papers against the capital's seals. Yet beneath these routines, our isolation becomes ever clearer. While the calm lasts, we must gather our reports and preserve what we can rely on when the storm finally reaches us."
 NAM_centre_hourglass:0 "The Centre's Hourglass"
 NAM_centre_hourglass_desc:0 "An emergency commissioner has arrived from the capital with a delivery plan in which no deadline lies beyond next month. The metropole no longer plans in years: it tries to survive the next day and demands that the colony pay for it in oil. The commissioner wants an answer, and Rom can give it only once."
 NAM_commissioner_plan:0 "Seal the Commissioner's Plan"
 NAM_commissioner_plan_desc:0 "The namestniks will put their seals under the emergency plan. Fuel will travel to the metropole by the trainload, and rifles from its depots will come back. The fields will work for someone else's war, and the underground will remember who signed the requisitions."
 NAM_second_ledger:0 "The Second Ledger"
 NAM_second_ledger_desc:0 "The reports to the commissioner will stay spotless, but the metropole's share will settle in a separate book. If the centre holds, the book will have to be burned. If it falls, Svetlogorye will have money nobody knows about except the trading houses and the oil workers."
 NAM_metropolitan_instructors:0 "Metropolitan Instructors"
 NAM_metropolitan_instructors_desc:0 "Instructor officers have come from the capital with the echelons. They drill the garrisons by the metropole's regulations and clear Weber's people out of the barracks along the way."
 NAM_quiet_officer_lists:0 "Quiet Officer Lists"
 NAM_quiet_officer_lists_desc:0 "The garrison staff is drawing up lists of officers who will stay with Svetlogorye whatever happens in the capital. Officially it is a leave roster. In truth it is the staff of an army that does not exist yet."
 NAM_sand_runs_out:0 "The Sand Runs Out"
 NAM_sand_runs_out_desc:0 "The telegraph from the capital arrives late, and its orders contradict one another. The namestniks and the districts already argue over who will hold the seal once the centre falls silent for good. Our answer to the commissioner decides where that argument begins."
 NAM_last_centre_register:0 "The Centre's Last Register"
 NAM_last_centre_register_desc:0 "The commissioner takes the colony's last register back to the capital. Whether it carries rifles for our depots or figures that hide the second ledger's reserve depends on whom we have served all these months."
 NAM_independence_day:0 "A Seal of Our Own"
 NAM_independence_day_desc:0 "Vorkerland has collapsed, and the last order from the capital was never signed. Svetlogorye declares independence: the chancellery's seals no longer bear a foreign crest."
 NAM_neutral_basin:0 "A Basin Outside the War"
 NAM_neutral_basin_desc:0 "Eflor and Azhar demand the return of lands the empire took from them. We declare the basin neutral: Svetlogorye threatens no one and is ready to trade, provided the border dispute is settled at a table and not on the oilfields."
 NAM_basin_is_ours:0 "The Basin Is Ours"
 NAM_basin_is_ours_desc:0 "Every derrick in the basin was raised by local workers, not by Eflorian surveyors. We say so openly and move the garrisons to the border: the neighbours will hear a challenge, but they will understand the fields will not be given away."
 NAM_provisional_statute:0 "The Provisional Statute"
 NAM_provisional_statute_desc:0 "Independence cannot rest on the old regulations of the namestnik office. A provisional statute will define who makes the laws, who carries them out and where to complain about them until the country chooses a permanent order."
 NAM_rom_address:0 "Rom's Address"
 NAM_rom_address_desc:0 "Egor Rom speaks for the first time not as a namestnik but as head of state. He promises no easy winter; he promises that every order now has a person behind it who can be named."
 NAM_tax_rolls:0 "Land Registry and Technical Service"
 NAM_tax_rolls_desc:0 "Plots, workshops and roads must appear on common plans. Surveyors, engineers and accountants will form a service able to turn government proposals into building sites."
 NAM_namestnik_circuits:0 "Namestnik Circuits"
 NAM_namestnik_circuits_desc:0 "Namestniks receive permanent inspection circuits and the right to settle disputes on the spot. The vertical comes closer to the people, and its seal grows heavier."
 NAM_district_assemblies:0 "District Assemblies"
 NAM_district_assemblies_desc:0 "Each district convenes an elected assembly that approves local levies and audits its namestnik. Decisions take longer, but no one can call them foreign."
 NAM_seal_courts:0 "Seal Courts"
 NAM_seal_courts_desc:0 "A dispute over a signature is no longer won by whoever holds the older seal. Special courts will hear complaints against namestniks and districts alike under one law."
 NAM_garrison_assembly:0 "Military Acceptance Office"
 NAM_garrison_assembly_desc:0 "Garrison officers will agree common standards for arms deliveries. Suppliers must demonstrate that their equipment is fit for service."
 NAM_hear_klyuchevsk:0 "Hear Klyuchevsk"
 NAM_hear_klyuchevsk_desc:0 "Arseny Tarkhanov, namestnik of Klyuchevsk, speaks for the oilfields: extraction must stay in the hands of those who run it. If we accept his terms, the oil workers will open their reserves and the port offices will be left dissatisfied."
 NAM_hear_the_harbour:0 "Hear the Harbour"
 NAM_hear_the_harbour_desc:0 "Lev Kornilov holds the South Harbour quays and the island runs. He asks for ships and chartering rights; the oilfields fear their oil will become someone else's merchandise again."
 NAM_hear_the_commandant:0 "Arm the Garrisons"
 NAM_hear_the_commandant_desc:0 "The commandant demands arms for the men who will hold the oilfields. Training teams will accept new deliveries and drill the garrisons before our neighbours cross the border."
 NAM_hear_the_registrar:0 "Civilian Technical Service"
 NAM_hear_the_registrar_desc:0 "The registrar proposes an independent service of engineers, teachers and draughtsmen. It will develop the country's own technical solutions, while the staff demands immediate spending on arsenals."
 NAM_pillar_arbitration:0 "National Development Programme"
 NAM_pillar_arbitration_desc:0 "The council combines industrial proposals into a common plan. A civilian enterprise in the north will support new workshops and settlements."
 NAM_underground_reports:0 "Underground Reports"
 NAM_underground_reports_desc:0 "Leaflets signed by Yaroslav Weber keep turning up in the northern belt. We combine reports from the police, the oilfields and the districts into one summary to learn who helps him and why."
 NAM_weber_channel:0 "A Channel to Weber"
 NAM_weber_channel_desc:0 "The districts know people who know Weber. Through them the chancellery will offer to talk instead of shoot; the garrisons will see it as weakness."
 NAM_cache_hunters:0 "Cache Hunters"
 NAM_cache_hunters_desc:0 "The chancellery will compare informants reports with maps of hidden depots. The gendarmes need guides, manifests and the names of those opening the gates to the underground."
 NAM_mine_councils:0 "Amnesty and Oilfield Councils"
 NAM_mine_councils_desc:0 "The districts list those willing to leave the underground. Workers councils take responsibility for shifts, safety and hiring at the oilfields. Peace with Weber must rest on an agreement both sides are prepared to honour."
 NAM_field_gendarmes:0 "Oilfield Gendarmerie"
 NAM_field_gendarmes_desc:0 "The oilfields receive a permanent armed guard. Under its protection, emergency crews can work at damaged derricks without waiting for the police investigation to end."
 NAM_contract_bureau:0 "The Contract Bureau"
 NAM_contract_bureau_desc:0 "Svetlogorye holds most of the world's oil yet still sells it like a colony, through other people's middlemen. The bureau will sign fuel contracts in the state's name and make sure every unit of output is promised at a profit."
 NAM_overseas_buyers:0 "Overseas Buyers"
 NAM_overseas_buyers_desc:0 "Kefreyt, Stelander, Steland and the Land of the Khan are ready to pay for oil if it can be taken aboard a tanker. South Harbour needs a tanker terminal that serves sea voyages alone."
 NAM_field_repair_crews:0 "Field Repair Crews"
 NAM_field_repair_crews_desc:0 "Worn pumps and clogged wells eat into output faster than any war. Standing crews will restore wells on the chancellery's order, not whenever a contractor turns up."
 NAM_refinery_programme:0 "Refinery Programme"
 NAM_refinery_programme_desc:0 "A refinery next to the field turns crude into fuel for our own army. The programme will decide where to build and assign a crew of oil workers to each plant."
 NAM_klyuchevsk_pipeline:0 "The Klyuchevsk Pipeline Route"
 NAM_klyuchevsk_pipeline_desc:0 "Sukhorechye's oil reaches South Harbour in tank cars that are easier to intercept than to guard. We map the pipeline route and buy up pipe from the old imperial depots."
 NAM_deep_wells:0 "Deep Wells"
 NAM_deep_wells_desc:0 "Beneath the depleted strata of the Northern Deposits lie horizons the empire never reached. New drilling will reach these reserves."
 NAM_fuel_depots:0 "Harbour Storage"
 NAM_fuel_depots_desc:0 "Oil without tanks must be sold at once and at any price. Storage at South Harbour will let us stockpile fuel for the army and wait for a better buyer."
 NAM_second_drilling_crew:0 "A Second Drilling Crew"
 NAM_second_drilling_crew_desc:0 "New drillers arrive at the oilfields with their own tools and habits. The foremen introduce them to the troublesome wells, and the maintenance books acquire the names of those who will answer for these machines."
 NAM_basin_roads:0 "Basin Roads"
 NAM_basin_roads_desc:0 "Between the Northern Deposits and Sukhorechye, lorries run along ruts that the first rain washes away. Hard roads will speed deliveries for the oilfields and the army alike."
 NAM_mobilisation_office:0 "Mobilisation Office"
 NAM_mobilisation_office_desc:0 "The neighbours are counting the days to war, and we cannot meet it with garrisons alone. At the office desks, clerks check reservist rolls, sort district reports and seek commanders who can be trusted with yesterday's workers."
 NAM_line_survey:0 "Line Survey"
 NAM_line_survey_desc:0 "Surveyors and sappers will walk the border of every oilfield district and mark where trenches would hold the enemy longest. From their maps the defence lines can be prepared in advance."
 NAM_line_engineers:0 "Line Engineers"
 NAM_line_engineers_desc:0 "Oilfield guard officers know which roads wash out in spring and which bridges cannot bear a heavy vehicle. Their field notes will lie beside the engineers' maps: a defensive line begins with understanding the ground."
 NAM_reserve_rolls:0 "Reserve Rolls"
 NAM_reserve_rolls_desc:0 "Everyone who served in the garrisons under the empire is entered in the rolls with an address and a trade. The office can prepare replacements without stripping the oilfields."
 NAM_officer_courses:0 "Officer Courses"
 NAM_officer_courses_desc:0 "Garrison commanders know how to stand guard, not how to lead a division into battle. Accelerated staff courses will give the army officers who know both the regulations and the ground."
 NAM_coastal_battalions:0 "Coastal Defence"
 NAM_coastal_battalions_desc:0 "The South Harbour connects the mainland to the islands. Battery crews, observers and port guards must work as a single service."
 NAM_island_levy_office:0 "Island Levy Office"
 NAM_island_levy_office_desc:0 "Great Island, the Western Island District and Middle Island mine steel yet pay almost nothing to the treasury. A namestnik office will impose a special levy; the islanders will comply more grudgingly."
 NAM_island_concession:0 "Island Concession"
 NAM_island_concession_desc:0 "Middle Island's steel can be mined with other people's hands and other people's money. We offer the concession to Kefreyt or Veyr: the island stays ours, and the treasury is paid in advance."
 NAM_restitution_desk:0 "The Restitution Desk"
 NAM_restitution_desk_desc:0 "Eflor and Azhar send claim after claim, and each one demands an answer. A dedicated desk in the chancellery will reply with counter-ledgers and treaties from the Vorkerland era, buying time."
 NAM_court_azhar:0 "Win Over Azhar"
 NAM_court_azhar_desc:0 "Mediators bring Azhar's officials and our oil producers to the same table. Their factories need deliveries; we need an agreement that draws our neighbours away from a war over Sukhorechye."
 NAM_fuel_leverage:0 "Fuel Leverage"
 NAM_fuel_leverage_desc:0 "The neighbours demand our land but fill their engines with our oil. The chancellery gains the right to close the oilfields and terminals to them, and the coalition will learn what its claim costs."
 NAM_general_staff_plan:0 "General Staff Plan"
 NAM_general_staff_plan_desc:0 "The staff brings the talks, the neighbours' pressure and the state of the garrisons together into one war plan. It assumes the worst and calls for replacements to be prepared in advance."
 NAM_discipline_of_seals:0 "No One Abandons the Seal"
 NAM_discipline_of_seals_desc:0 "In war every step of the ladder holds its sector as long as it believes the next step will not waver. A special order reminds namestniks and commandants that an abandoned seal is answered for like an abandoned trench."
 NAM_volunteer_levies:0 "Volunteer Levies"
 NAM_volunteer_levies_desc:0 "At the stations and oilfields, those left off the mobilisation rolls are signing up. Weapons for them will be found in the depots, and commanders among retired NCOs."
 NAM_wells_under_guard:0 "Wells Under Guard"
 NAM_wells_under_guard_desc:0 "The oilfields will not be blown up; they will be defended. Sappers fortify the approaches to the Northern Deposits and the Svetlogorsk District, and the oil workers come to believe they will have somewhere to return to."
 NAM_last_reserve:0 "The Last Reserve"
 NAM_last_reserve_desc:0 "The staff opens the depots it kept for an emergency. The emergency has come."
 NAM_district_volunteers:0 "District Volunteers"
 NAM_district_volunteers_desc:0 "The districts raise their own detachments to defend their oilfields. Many who read Weber's leaflets yesterday are joining the ranks today."
 NAM_martial_seals:0 "Martial Seals"
 NAM_martial_seals_desc:0 "Namestniks receive the right of court-martial in their districts. The seal decides everything again, and whoever disobeys it will answer before a tribunal."
 NAM_oil_score:0 "The Oil Score"
 NAM_oil_score_desc:0 "The mediators are counting the oil of every field still held. The staff publishes its own score so that every soldier knows what his sector of the front is worth."
 NAM_veterans_return:0 "The Veterans Return"
 NAM_veterans_return_desc:0 "The soldiers of the resource war return to the districts with experience the imperial garrisons never had. The cadre lists keep the best in the army; the rest go back to the oilfields."
 NAM_svetlogorsk_shipyards:0 "Svetlogorsk Shipyards"
 NAM_svetlogorsk_shipyards_desc:0 "The Svetlogorsk District can build ships, not just repair other people's. A new yard will give the country a merchant fleet of its own."
 NAM_normalisation:0 "Normalisation"
 NAM_normalisation_desc:0 "Svetlogorye renounces its claims on Azhari land and offers the neighbours a return to trade. The commandants call it a concession to the defeated; the port offices call it the start of profitable years.\n\nPrisoners on both sides are still waiting in camps. The exchange will bring people home and become the first treaty with former enemies carried out without gunfire.\n\nTrading posts open where checkpoints stood, and Svetlogorye's oil flows through them straight to the neighbours.\n\nWhatever path Svetlogorye has taken, the border with Eflor and Azhar no longer changes every month. The commission closes the files of the war and hands its records to the archive."
 NAM_border_revenge:0 "Armed Border"
 NAM_border_revenge_desc:0 "The frontier garrisons will not repeat the retreat towards the oilfields. As the commission sends its war records to the archive, engineers survey the roads and approaches to the towns. The neighbours must see a country able to defend its own border."
 NAM_oil_ministry:0 "Ministry of Oil"
 NAM_oil_ministry_desc:0 "The oilfields are no longer divided among wartime departments. The Ministry of Oil will unite extraction, refining and contracts."
 NAM_middle_loren_wells:0 "Middle Loren Wells"
 NAM_middle_loren_wells_desc:0 "Middle Loren lies at the edge of the basin, and its fields have so far worked without roads or workshops. The city receives an enterprise and the district its access roads."
 NAM_reclaim_230:0 "The Western Island's Steel"
 NAM_reclaim_230_desc:0 "Kefreyt mines the steel of the Western Island District under a wartime agreement. The war is won, and the chancellery demands new terms: payment or the return of the mining rights."
 NAM_export_consortium:0 "Export Consortium"
 NAM_export_consortium_desc:0 "The port offices merge into a consortium with shared tankers and long-term agreements. The oilfields gain buyers instead of refineries of their own."
 NAM_state_refineries:0 "State Refineries"
 NAM_state_refineries_desc:0 "Oil that can be refined at home need not be sold at someone else's price. The state builds refineries at the Northern Deposits and in Sukhorechye."
 NAM_oil_exchange:0 "Oil Exchange"
 NAM_oil_exchange_desc:0 "The price of Svetlogorye's oil is now set in Svetlogorye. The exchange brings sellers and buyers together and takes its share of every deal."
 NAM_south_allied_fuel_office:0 "Allied Fuel Office"
 NAM_south_allied_fuel_office_desc:0 "The allies of the northern camp fight on Svetlogorye's fuel or not at all. The office will route deliveries so that every tank car reaches the front."
 NAM_south_convoy_hunters:0 "Convoy Hunters"
 NAM_south_convoy_hunters_desc:0 "Tankers and barges carry fuel to the furnaces of Shahrabad. Svetlogorye's ships will take to their routes and let the furnaces go cold."
 NAM_rus_crisis_watch:0 "Eyes on the Land of the Khan"
 NAM_rus_crisis_watch_desc:0 "The Khan is building an empire and an orbital programme, and a coalition is already gathering against him. The chancellery must decide how Svetlogorye answers: with oil for the defenders or with a bill for it."
 NAM_rus_fuel_for_coalition:0 "Fuel for the Coalition"
 NAM_rus_fuel_for_coalition_desc:0 "Svetlogorye sends fuel to those who stood against the Khan. Our oil becomes a contribution to the common defence rather than merchandise in someone else's war."
 NAM_rus_demand_share:0 "Demand a Share"
 NAM_rus_demand_share_desc:0 "The defenders need our oil, and Svetlogorye will set a price for it. Whoever wants fuel for the war against the Khan will pay and take our interests into account."
 NAM_rus_expedition_staff:0 "Expeditionary Staff"
 NAM_rus_expedition_staff_desc:0 "Whatever the answer to the Khan, Svetlogorye's army needs a staff able to operate far from the basin. Its officers will study the northern front and prepare depots for an expedition."
 NAM_defeat_count_losses:0 "Counting the Losses"
 NAM_defeat_count_losses_desc:0 "The defeat took the oilfields - under the compromise peace with its tribute, or together with the whole mainland. Before deciding what comes next, the chancellery must honestly count what Svetlogorye has left."
 NAM_defeat_rump_cabinet:0 "Cabinet of Those Who Remain"
 NAM_defeat_rump_cabinet_desc:0 "Half the ministers lost their districts along with their posts. Rom forms a cabinet from those who remain and promises every pillar a seat at the table."
 NAM_defeat_harbour_economy:0 "A Harbour Economy"
 NAM_defeat_harbour_economy_desc:0 "Without the northern oilfields, the harbours become the country's chief asset: the South Harbour if it is still ours, or the island ports. Trade, chartering and ship repair must replace at least part of the lost oil."
 NAM_defeat_island_refuge:0 "Island Refuge"
 NAM_defeat_island_refuge_desc:0 "The overseas districts remain with Svetlogorye, and families and depots from the lost coast are already moving there. The islands need quays and roads to receive them."
 NAM_defeat_purge_of_seals:0 "Purge of the Seals"
 NAM_defeat_purge_of_seals_desc:0 "Namestniks who surrendered oilfields without a fight lose their seals. The districts gain the right to name the guilty, and the ladder grows shorter."
 NAM_defeat_refugee_quarters:0 "Refugee Quarters"
 NAM_defeat_refugee_quarters_desc:0 "Refugees from the lost oilfields are filling the ports Svetlogorye still holds. New quarters and a workshop in the South Harbour, or in the capital if the harbour is lost, will give them homes and work, and the army men."
 NAM_defeat_island_foundries:0 "Island Foundries"
 NAM_defeat_island_foundries_desc:0 "Great Island's steel no longer needs shipping to the mainland. A foundry on the island itself will turn out weapons far from the new border."
 NAM_defeat_revenge:0 "The Course of Return"
 NAM_defeat_revenge_desc:0 "The peace is signed but not accepted. Svetlogorye will prepare to win back its oilfields, and every line of the budget now serves that aim."
 NAM_defeat_accommodation:0 "The Course of Accommodation"
 NAM_defeat_accommodation_desc:0 "The war is lost, but one can trade with the victors too. Svetlogorye recognises the new borders and seeks profit from its former enemies, not revenge."
 NAM_defeat_rebuild_arsenal:0 "Rebuild the Arsenal"
 NAM_defeat_rebuild_arsenal_desc:0 "The arms workshops go over to full shifts: in the South Harbour if it is still ours, otherwise in the capital. The new army will begin with rifles of its own."
 NAM_defeat_hidden_reserve:0 "The Hidden Reserve"
 NAM_defeat_hidden_reserve_desc:0 "Not all the oil was lost with the fields. If the chancellery once hid a reserve from the metropole, it can now hide it from the victors as well. A government in exile trades part of the reserve for transports to run convoys between the islands."
 NAM_defeat_officer_cadres:0 "Officer Cadres"
 NAM_defeat_officer_cadres_desc:0 "An army beaten once must learn from its mistakes. The officers of the resource war will become instructors for the new intakes. People who remember Svetlogorye remain on the seized oilfields. Underground cells will gather intelligence, weapons and signatures, and the chancellery will claim everything taken by the peace treaty."
 NAM_defeat_new_levies:0 "New Levies"
 NAM_defeat_new_levies_desc:0 "The conscription rolls are drawn up anew across every remaining district and island. The new battalions will receive their weapons at once, not on the eve of battle."
 NAM_defeat_war_chest:0 "The War Chest"
 NAM_defeat_war_chest_desc:0 "Harbour revenues are set aside in a special fund that appears in no ledger shown to the victors. It will pay for the guns of the next war and, on the islands, for a shipyard in the capital."
 NAM_defeat_war_of_return:0 "War of Return"
 NAM_defeat_war_of_return_desc:0 "The army is rebuilt, the oilfields are waiting. Svetlogorye is ready to demand back what the peace treaty took from it."
 NAM_defeat_early_tribute:0 "Buy Out the Tribute"
 NAM_defeat_early_tribute_desc:0 "A year of tribute turns every tank car into a reminder of defeat. One large payment will close the obligation early and free the oilfields for contracts of our own."
 NAM_defeat_oil_union:0 "An Oil Union with the Neighbours"
 NAM_defeat_oil_union_desc:0 "Eflor and Azhar have taken the oilfields but do not know how to work them. Svetlogorye's engineers and joint contracts will give all three countries more oil than enmity would. Mixed crews work the disputed deposits, and the revenue is shared by treaty. Svetlogorye earns a share from the oilfields it lost in the war."
 NAM_defeat_open_border:0 "An Open Border"
 NAM_defeat_open_border_desc:0 "Families divided by the new border receive the right of free passage. Some of those who left return to Svetlogorye."
 NAM_defeat_road_south:0 "The Road South"
 NAM_defeat_road_south_desc:0 "Our former enemies watch Shahrabad with the same unease as we do. Svetlogorye offers Eflor and Azhar an alliance against the furnaces of the South."
 NAM_defeat_southern_charter:0 "The Southern Compact"
 NAM_defeat_southern_charter_desc:0 "The alliance with former enemies is ready for its test. If Shahrabad does not back down, the War for the South will decide whose treaty holds in the desert."
 NAM_defeat_oil_peace:0 "Oil Peace"
 NAM_defeat_oil_peace_desc:0 "The trading houses bring merchant ships back to the port, and factories turn from emergency orders to peacetime work. Garrisons still watch the southern roads: oil contracts need calm, while Shahrabad keeps its intentions to itself."
 NAM_defeat_second_chapter:0 "The Second Chapter"
 NAM_defeat_second_chapter_desc:0 "Svetlogorye has survived defeat without falling apart. Whatever path the country has chosen, its history continues on its own strength."
 NAM_independent_tt:0 "Vorkerland has collapsed, and Svetlogorye is subject to no other country"
 NAM_restitution_clock_tt:0 "Resource-war preparation is still active."
