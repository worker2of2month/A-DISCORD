 NAM_cost_order_motor_tooltip: "§Y25§! £political_power_texticon §Y250§! £ADISCORD_economy_treasury_texticon §Y4600§! £manpower_texticon §Y3000§! £fuel_texticon\nThe price is debited on selection; before the war, treasury, fuel and recruits return on release."
 NAM_cost_order_coastal: "§Y10§! £political_power_texticon §Y50§! £ADISCORD_economy_treasury_texticon §Y3300§! £manpower_texticon"
 NAM_cost_order_coastal_blocked: "§R10§! £political_power_texticon §R50§! £ADISCORD_economy_treasury_texticon §R3300§! £manpower_texticon"
 NAM_cost_order_coastal_tooltip: "§Y10§! £political_power_texticon §Y50§! £ADISCORD_economy_treasury_texticon §Y3300§! £manpower_texticon\nThe price is debited on selection; before the war, treasury and recruits return on release."
 NAM_order_release: "Release the Mobilised"
 NAM_order_release_desc: "Disband every prepared formation before the war begins. Recruits return to the reserve, treasury and fuel to the budget; political power spent on the orders is not refunded."
 NAM_order_release_tt: "Every prepared formation is disbanded. The recruits, each order's treasury price in £ADISCORD_economy_treasury_texticon and §Y3000§! £fuel_texticon for every motorised division are returned."
 NAM_prepare_line: "Prepare a Defence Line"
 NAM_prepare_line_desc: "Engineer companies will build field fortifications along this district's border with other countries within §Y35 days§!. A line can only be prepared in a district with a land border to another country. As many lines can be built at once as there are open slots. If the district is lost before completion, the deposit returns to the treasury; a lost line can be prepared again once the district is recovered."
 NAM_cost_line: "§Y30§! £political_power_texticon §Y100§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_line_blocked: "§R30§! £political_power_texticon §R100§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_line_tooltip: "§Y30§! £political_power_texticon §Y100§! £ADISCORD_economy_treasury_texticon\nThe treasury is refunded if the work is interrupted."
 NAM_line_slot_free_tt: "A defence-line slot is free: §Y[?NAM_lines_in_progress|0]§! of §Y[?NAM_line_slots|0]§! in use"
 NAM_line_started_tt: "Treasury: §R-100§! £ADISCORD_economy_treasury_texticon; the deposit returns if the work is interrupted.\nOne defence-line slot is occupied."
 NAM_line_built_tt: "If the district is still ours, every province on its border with another country receives fortifications of level §Y1§!, and border towns with victory points receive level §Y2§!. Otherwise the deposit returns to the treasury."
 NAM_line_refund_tt: "Work interrupted: §G100§! £ADISCORD_economy_treasury_texticon return to the treasury and the slot is released."
 NAM_scorch_wells: "Scorch the Wells"
 NAM_scorch_wells_desc: "If a field cannot be held, it can be stripped of its value. Burning the wells leaves the deposit without output for §Y180 days§! - for us and for whoever takes it next. Restoring the field will require a separate programme."
 NAM_scorch_threat_tt: "The front has reached the field: part of the district or a neighbouring district is held by the enemy"
 NAM_scorch_wells_tt: "The deposit yields no resources for §Y180 days§!, whoever owns it; the field's condition falls to §Y10§!.\nOil workers: §R-10§! £NAM_support_oil_texticon.\nSeal discipline: §R-5§!."
 NAM_hold_field_67: "Hold the Northern Deposits"
 NAM_hold_field_67_desc: "A §Y120-day§! order. If the field is still under our control when it expires, the garrison receives fuel and rewards, and seal discipline grows stronger."
 NAM_hold_field_689: "Hold the South Coast"
 NAM_hold_field_689_desc: "A §Y120-day§! order. If the field is still under our control when it expires, the garrison receives fuel and rewards, and seal discipline grows stronger."
 NAM_hold_field_690: "Hold Sukhorechye"
 NAM_hold_field_690_desc: "A §Y120-day§! order. If the field is still under our control when it expires, the garrison receives fuel and rewards, and seal discipline grows stronger."
 NAM_hold_field_discipline_tt: "Seal discipline: §G+10§!."
 NAM_hold_field_lost_tt: "The field is lost: the order closes without a reward."

 # Restitution events
 ADISCORD_nam_resource_war.20.t: "Notes of Restitution"
 ADISCORD_nam_resource_war.20.d: "Couriers from Eflor and Azhar arrived on the same day, and hardly by chance. Their folders hold copies of the Vorkerland decrees that once gave the northern fields and their roads to the governorate, together with a demand to return them to their lawful owners. The notes are polite, but each comes with an annex listing the wells.\n\nKirill Mezentsev believes correspondence will buy time: every decree can be met with a ledger, every signature with another signature. The garrison officers reply that time is needed for trenches, not letters. Egor Rom understands both sides and knows that the neighbours will read any answer as a signal."
 ADISCORD_nam_resource_war.20.a: "Answer note with note."
 ADISCORD_nam_resource_war.20.b: "Reject the claims publicly."
 NAM_rw_20_a_tt: "Restitution pressure: §G-5§!.\nAn exchange of notes begins."
 NAM_rw_20_b_tt: "Restitution pressure: §R+5§!."
 ADISCORD_nam_resource_war.21.t: "The Joint Ultimatum"
 ADISCORD_nam_resource_war.21.d: "This time the visitors are military attaches, not couriers. Eflor and Azhar demand the return of the northern fields and recognition of their right to restitution of all Vorkerland oil property. The deadline is given in days, not weeks.\n\nRom has four answers. The Klyuchevsk protocol would give East Sukhorechye to Azhar and bind Svetlogorye to a year of fuel tribute, but it would delay the war. The Azhar staff will settle for less: for tank cars of fuel it will hold its troops back for two and a half months, though it will not leave the alliance with Eflor. He can refuse and rely on the army. Or he can strike first, before the neighbours finish deploying, and become the aggressor in the eyes of the whole South."
 ADISCORD_nam_resource_war.21.a: "Reject the ultimatum."
 ADISCORD_nam_resource_war.21.b: "Sign the Klyuchevsk protocol."
 ADISCORD_nam_resource_war.21.c: "Buy time from Azhar."
 ADISCORD_nam_resource_war.21.e: "Strike first."
 NAM_rw_21_a_tt: "Restitution pressure: §R+10§!."
 NAM_rw_21_b_tt: "§YEast Sukhorechye§! passes to Azhar; Svetlogorye keeps a claim on it.\nA §Y365-day§! tribute begins: §Y1500§! £fuel_texticon each month to Eflor and to Azhar.\nRestitution pressure: §G-40§!.\nThe earliest war date moves §Y365 days§! later, and the final deadline is postponed once."
 NAM_rw_21_c_tt: "Azhar receives §Y12000§! £fuel_texticon of our fuel.\nFor §Y75 days§! no war begins, even if restitution pressure reaches §Y100§!; the nearest war deadline moves §Y75 days§! later.\nAzhar stays in the alliance with Eflor and will go to war alongside it. The delay can be bought only once."
 NAM_rw_21_e_tt: "War begins within §Y7 days§!, and Svetlogorye declares it.\nInstead of the Oilfield Defence Corps, the army receives the §YFirst Strike Corps§!, half as strong.\nWar support of Eflor and Azhar: §R+10%§!."

 # Seal discipline events
 ADISCORD_nam_resource_war.30.t: "The Seals Waver"
 ADISCORD_nam_resource_war.30.d: "The districts send reports the staff would rather not read. Governors delay replacements, citing a lack of men; some garrisons fall back without orders, and in the rear people say the ladder holds only through fear of the next step.\n\nThe officers ask for money for front-line bonuses. The commandants propose field tribunals. Or the government can wait and hope next week goes better."
 ADISCORD_nam_resource_war.30.a: "Hold on with what we have."
 ADISCORD_nam_resource_war.30.b: "Pay front-line bonuses."
 ADISCORD_nam_resource_war.30.c: "Introduce field tribunals."
 NAM_seal_30_b_tt: "Treasury: §R-150§! £ADISCORD_economy_treasury_texticon.\nSeal discipline: §G+15§!."
 NAM_seal_30_c_tt: "Seal discipline: §G+12§!.\nGroup support:\n  Garrisons: §G+5§! £NAM_support_garr_texticon\n  Districts: §R-5§! £NAM_support_dist_texticon"
 ADISCORD_nam_resource_war.31.t: "The Ladder Cracks"
 ADISCORD_nam_resource_war.31.d: "Two districts have stopped answering the staff's telegrams. In a third, the governor negotiates with the enemy in his own name, and deserters gather at the stations because nobody dares to arrest them.\n\nKirill Mezentsev proposes opening the oil reserve and paying those still holding the front in fuel. The commandants demand a state of emergency in every district. Rom understands that one more defeat and the ladder will fall apart."
 ADISCORD_nam_resource_war.31.a: "Wait for the turn."
 ADISCORD_nam_resource_war.31.b: "Open the oil reserve."
 ADISCORD_nam_resource_war.31.c: "Declare a state of emergency."
 NAM_seal_31_b_tt: "Seal discipline: §G+20§!."
 NAM_seal_31_c_tt: "Seal discipline: §G+15§!.\nGroup support:\n  Districts: §R-10§! £NAM_support_dist_texticon"
 ADISCORD_nam_resource_war.32.t: "The Night of Seals"
 ADISCORD_nam_resource_war.32.d: "During the night the seals were brought to the chancellery. Not one or two: the governors of three districts, garrison commandants and the heads of field offices surrendered the signs of their authority and left without waiting for orders. By morning the corridors held people who had no intention of surrendering anything.\n\nThe vertical gathers power back by force. Those who still hold seals demand one chief and one order. Among them is already a man who believes that chief should not be Egor Rom."
 ADISCORD_nam_resource_war.32.a: "Gather the seals again."
 NAM_seal_32_a_tt: "The ladder of seals shifts §Y0.20§! towards the vertical.\nSeal discipline recovers to §Y30§!.\nWithin §Y60 days§!, a rival of Rom may demand the leadership of the country."

 ADISCORD_nam_resource_war.2.t: "The Svetlogorsk Uprising"
 ADISCORD_nam_resource_war.2.d: "With Svetlogorye's main forces tied down along its external borders, Yaroslav Veter has brought the underground out of hiding. Deserters, underground activists and opponents of the old colonial administration have seized a compact foothold within the northern resource belt. The Provisional Insurgent Headquarters under Veter has denounced Svetlogorye as a continuation of Vorkerland's system of governors and opened an internal front."
 ADISCORD_nam_resource_war.2.a: "Another front, but no reason to surrender."
 ADISCORD_nam_resource_war.3.t: "The Svetlogorye Contracts"
 ADISCORD_nam_resource_war.3.d: "War has broken out around Svetlogorye's resource basin. For Kefreite, the crisis is more than another border conflict: it has opened a new set of military, supply and political contracts. The resource-war focus branch has now been revealed. Its first focus still follows the normal prerequisite chain."
 ADISCORD_nam_resource_war.3.a: "Open the contract files."
 ADISCORD_nam_resource_news.1.t: "Eflor and Azhar Invade Svetlogorye"
 ADISCORD_nam_resource_news.1.d: "The armies of Eflor and Azhar crossed into Svetlogorye within hours of the talks collapsing. The trigger was the Svetlogorye government's refusal to accept an ultimatum over the northern oilfields and the infrastructure around them. Both states regard these lands as their own: they were handed to Svetlogorye under the Vorkerland administration.\n\nRakhma and Mazar are not officially at war, but have allowed volunteers to enlist in exchange for future fuel contracts. Svetlogorye must now defend on two fronts at once while covering its oilfields and transport hubs."
 ADISCORD_nam_resource_news.1.d_strike: "Svetlogorye has struck first. With talks over the northern oilfields deadlocked, Egor Rom's army crossed into Eflor before the neighbours could finish deploying. Eflor has called the attack proof that the governors' ladder understands only force and summoned its allies to arms.\n\nRakhma and Mazar are not officially at war, but have allowed volunteers to enlist in exchange for future fuel contracts. Surprise has bought Svetlogorye time, but its army has left its prepared positions, and the neighbours have gained the pretext they lacked."
 ADISCORD_nam_resource_news.1.a: "The war for the oilfields has begun."
 ADISCORD_nam_resource_news.2.t: "Svetlogorye Partitioned Between Eflor and Azhar"
 ADISCORD_nam_resource_news.2.d: "Organised resistance in Svetlogorye has ended. Eflor has taken the Northern Oilfields, the western terminals and Svetlogorsk; Azhar holds the maritime districts of the Black Basin and the southern port. The Provisional Insurgent Headquarters has been dissolved, and Svetlogorye's former administration no longer exists as an independent government.\n\nThe allies have declared their war aims achieved and begun marking out the new border. Along with the land they have inherited wrecked oilfields, damaged roads and a population that lived under someone else's rule for several generations."
 ADISCORD_nam_resource_news.2.a: "Svetlogorye has been partitioned."
 ADISCORD_nam_resource_news.2.t_exile: "Svetlogorye's Government Flees to the Islands"
 ADISCORD_nam_resource_news.2.d_exile: "Mainland Svetlogorye has fallen. Eflor has taken the Northern Deposits and Svetlogorsk, Azhar the southern fields and the South Harbour. The Provisional Insurgent Headquarters has been dissolved, and the victors are already drawing a new border across the former oilfields.\n\nEgor Rom's government did not sign its own end. The last steamers carried the chancellery, the archive of seals and the remnants of the army to the overseas islands, and the new capital across the strait has declared that Svetlogorye lives on. Its authorities promise to return to the mainland, but for now they have only shipyards, fishing ports and people who remember where they were driven from."
 ADISCORD_nam_resource_news.2.a_exile: "The islands are not the end."
 ADISCORD_nam_resource_news.3.t: "Svetlogorye Wins Recognition of Its Independence"
 ADISCORD_nam_resource_news.3.d: "Svetlogorye has held the Northern Oilfields and forced Eflor and Azhar to sign a peace. The treaty recognises Svetlogorye as an independent state and hands it the border districts of the defeated: Eflor cedes the Moren district, the Loren borderland and the city of Middle Loren, Azhar its seaboard. The defeated leave the war with a ruined economy and a disgraced army. The question of the Black Basin remains open, but the fighting has stopped.\n\nThe Svetlogorsk insurgent formations have been disarmed. Eflor and Azhar remain allies, so the border dispute could flare up again."
 ADISCORD_nam_resource_news.3.t_standoff: "The War for Svetlogorsk Oil Ends in a Standoff"
 ADISCORD_nam_resource_news.3.d_standoff: "The diplomatic limit of the war for the oilfields has expired. The armies of Eflor and Azhar never broke the defence of the oil basin, but Svetlogorye never carried the war onto its neighbours' land either. The mediators fixed the line where it ran before the first shots: no border changes, nobody pays reparations and nobody signs a recognition treaty.\n\nSvetlogorye keeps its independence and its fields, and the Svetlogorsk insurgent formations have been disarmed. Eflor and Azhar call the standoff a respite; Svetlogorsk calls it a victory that still has to be secured. The neighbours' alliance remains, and the dispute over the basin stays open."
 ADISCORD_nam_resource_news.3.a: "Svetlogorye has kept its independence."
 ADISCORD_nam_resource_news.5.t: "Uprising Breaks Out in Svetlogorsk"
 ADISCORD_nam_resource_news.5.d: "While Svetlogorye's main forces fight Eflor and Azhar, an uprising has broken out behind the lines. Yaroslav Veter, who spent years building the underground of the northern resource belt, has brought it into the streets: opponents of the governor system have seized the Svetlogorsk District and announced a Provisional Insurgent Headquarters. They have been joined by some of the garrisons, deserters and underground groups.\n\nThe insurgents claim neither all of Svetlogorye nor a new state of their own. Veter demands the abolition of the governors' administration left over from Vorkerland. The government must now hold the oilfields, stop the foreign offensive and retake the capital district at the same time."
 ADISCORD_nam_resource_news.5.a: "Svetlogorye now has a third front."
 ADISCORD_nam_resource_news.6.t: "The Svetlogorsk Uprising Is Crushed"
 ADISCORD_nam_resource_news.6.d: "Svetlogorye's government troops have retaken the Svetlogorsk District. The Provisional Insurgent Headquarters has been dissolved, and the surviving bands have been disarmed or scattered. Yaroslav Veter left the city with his last couriers: his underground is broken, but not betrayed.\n\nThe war with Eflor and Azhar goes on, but Svetlogorye can now move its reserves to the external front. Supporters of the governors call the suppression of the uprising the new authorities' first major victory since the fall of Vorkerland."
 ADISCORD_nam_resource_news.6.a: "The uprising has been crushed."
 ADISCORD_nam_resource_news.7.t: "Svetlogorye Signs a Compromise Peace"
 ADISCORD_nam_resource_news.7.d: "The war for the oilfields has ended without a capitulation. The diplomatic deadline expired, and the mediators reduced the outcome to a simple count: which fields remained with Svetlogorye and which were already held by the coalition's armies. The occupied fields pass to Eflor and Azhar; the Svetlogorsk District, if the government failed to hold it, goes to Eflor, and its new masters dissolve the Provisional Insurgent Headquarters.\n\nSvetlogorye keeps its remaining fields, the South Harbour and its overseas districts, but must deliver fuel to both neighbours for a year. The governors call the treaty a respite, the districts the price of survival, and in Eflor and Azhar they say the dispute over the basin has only been postponed."
 ADISCORD_nam_resource_news.7.a: "Svetlogorye survives, but will pay for it."

 ADISCORD_nam_debug_start_resource_war: "§RDEBUG:§! Start the Svetlogorye Resource War"
 ADISCORD_nam_debug_start_resource_war_desc: "Releases Svetlogorye from its old alliance ties, creates the permanent Eflor-Azhar alliance and launches their joint war against Svetlogorye."
 ADISCORD_nam_debug_resolve_coalition_victory: "§RDEBUG:§! Divide Svetlogorye among the Victors"
 ADISCORD_nam_debug_resolve_coalition_victory_desc: "Divides all of Svetlogorye between Eflor and Azhar, eliminates the Svetlogorye Uprising and preserves the victors' alliance."
 ADISCORD_nam_debug_resolve_nam_victory: "§RDEBUG:§! Confirm Svetlogorye's Victory"
 ADISCORD_nam_debug_resolve_nam_victory_desc: "Ends the war with recognition of Svetlogorye, the transfer of Eflorian and Azhari border districts, punitive spirits for the defeated and elimination of the surviving rebel army; the neighbouring states' alliance remains."
 ADISCORD_nam_debug_resolve_compromise: "§RDEBUG:§! Svetlogorye Compromise Peace"
 ADISCORD_nam_debug_resolve_compromise_desc: "Concludes the compromise peace at once: fields held by the coalition pass to Eflor and Azhar, Svetlogorye keeps the rest and begins a year of fuel tribute."
 ADISCORD_nam_debug_add_tension: "§RDEBUG:§! Restitution Pressure +30"
 ADISCORD_nam_debug_add_tension_desc: "Adds 30 points of restitution pressure and checks the note, ultimatum and war thresholds."

 # National focus campaign
 NAM_inventory: "Inventory of a Vanishing Empire"
 NAM_inventory_desc: "Egor Rom's shelves still hold contradictory orders from the capital. Before choosing a future, we must discover which stores, people and powers actually belong to Svetlogorye."
 NAM_open_ledgers: "The Price of Every Seal"
 NAM_open_ledgers_desc: "The governors count everyone else's expenses. Kirill Mezentsev will open their own accounts and expose offices that exist only on paper."
 NAM_vertical: "Rom's Single Signature"
 NAM_vertical_desc: "The hierarchy remains, but orders will no longer stall between offices. Governors receive common collection targets and answer personally to Rom. Executing orders efficiently does not reconcile their opponents."
 NAM_districts: "The Districts Sign Back"
 NAM_districts_desc: "District representatives must sign more than receipts for orders. Rom retains the government while councils gain scrutiny of levies and spending. Collection becomes less convenient, but government gains partners."
 NAM_inspectors: "Inspectors Put Their Names Down"
 NAM_inspectors_desc: "Inspectors must sign their findings in person. Comparing depot ledgers with actual crates will return missing weapons to the garrisons."
 NAM_public_payroll: "The Payroll in the Square"
 NAM_public_payroll_desc: "A public payroll distinguishes real service from inherited privilege. The first open accounts will not end poverty, but they can disarm the underground's strongest accusation."
 NAM_emergency_writ: "An Emergency Writ"
 NAM_emergency_writ_desc: "War must not find the governors arguing about permission to open an arsenal. Establish a priced emergency release and a separate operation against insurgent depots."
 NAM_district_guarantees: "Guarantees for Svetlogorsk"
 NAM_district_guarantees_desc: "The city that supplies the country wants a say in its earnings. Prepare a funded civic compact. A last-minute signature is not trust."
 NAM_one_budget: "A Budget with No Hidden Drawer"
 NAM_one_budget_desc: "Public accounts and central inspection disagree on politics, but both have found money that never reached the treasury. Return it to the budget."
 NAM_well_register: "Every Well Has an Address"
 NAM_well_register_desc: "An extraction report is no substitute for a working tanker. Match wells to access roads and recover fuel stranded between ministries."
 NAM_export_quays: "Oil Pays for the State"
 NAM_export_quays_desc: "Port offices may sell cargoes from the actual fuel reserve. Each sale funds the treasury and leaves less fuel for our own forces."
 NAM_domestic_refining: "Oil Stays at Home"
 NAM_domestic_refining_desc: "A well's value does not end at an export quay. Fuel for workshops and transport can become domestic equipment instead of another cargo sold abroad."
 NAM_insured_cargoes: "A Return Cargo on Every Voyage"
 NAM_insured_cargoes_desc: "Export voyages should return with containers and spare parts. Combine scattered shipping into a serviceable trade line."
 NAM_machine_shops: "Spare Parts for the Oilfields"
 NAM_machine_shops_desc: "A workshop that repairs pumps can do more than its budget admits. A common order equips engineers with tools and prepares military production."
 NAM_civilian_combine: "A Town Around the Wells"
 NAM_civilian_combine_desc: "Maintaining the wells should sustain a permanent town. A repair complex in the Northern Fields will reduce dependence on visiting contractors."
 NAM_technical_college: "Engineers Above Instructions"
 NAM_technical_college_desc: "A successful repair must not become a disciplinary case for ignoring a manual. Unite the oilfield laboratories in a technical institute with its own research budget."
 NAM_count_garrisons: "Garrisons on Paper and on the Road"
 NAM_count_garrisons_desc: "Every office has a regiment on the map; on the road it may have a single sentry. Reconcile personnel and stores before choosing between fixed positions and a mobile reserve."
 NAM_field_guards: "An Army of Strongpoints"
 NAM_field_guards_desc: "Oilfields cannot retreat. Train units to hold prepared nodes and conserve supplies, accepting slower movement as the price of endurance."
 NAM_mobile_columns: "An Army of Crossroads"
 NAM_mobile_columns_desc: "Not every position can be held, but a lost road can be retaken. Mobile columns assemble quickly at the cost of heavier supply demand."
 NAM_engineer_depots: "Tools Before Rifles"
 NAM_engineer_depots_desc: "Engineers should not have to find tools after reaching their positions. Reserve equipment for engineer companies and garrison training."
 NAM_motor_pool: "A Common Motor Pool"
 NAM_motor_pool_desc: "An official's staff car is less important than field supply. Pool the administrations' vehicles in a reserve the army can actually use."
 NAM_quartermaster: "Every Depot Knows Its Front"
 NAM_quartermaster_desc: "Paying for supply must release weapons, not generate another request. Make the first delivery from audited reserves; subsequent batches for the standing army and reserve will be available through paid orders."
 NAM_port_arsenal: "The South Coast Arsenal"
 NAM_port_arsenal_desc: "The port must receive raw materials and make weapons even when land routes are cut. Build an arsenal beside the working quays."
 NAM_harbour_service: "The Port Never Closes"
 NAM_harbour_service_desc: "Office hours must not halt loading. A port service will coordinate dockers, pilots and suppliers into one working chain."
 NAM_repair_yard: "Our Own Repair Quay"
 NAM_repair_yard_desc: "A damaged vessel should not disappear into a foreign port indefinitely. Give the South Coast workshops a yard for repairs and construction."
 NAM_escort_school: "Escort to the Last Buoy"
 NAM_escort_school_desc: "The fleet's first job is to bring merchant ships home. An escort school teaches crews to detect danger before the engagement begins."
 NAM_island_accounts: "The Overseas Districts Keep Accounts"
 NAM_island_accounts_desc: "The overseas holdings remain a disputed imperial inheritance. Civil accounts and port services can provide administration without pretending a decree makes colonies a homeland."
 NAM_alarm: "No Longer a Border Dispute"
 NAM_alarm_desc: "The coalition wants the oilfields. Peacetime plans must not delay the emergency staff."
 NAM_hold_basin: "The Oilfields Have No Rear"
 NAM_hold_basin_desc: "The Northern Fields decide this war. Issue tools and artillery to their defenders and adopt temporary entrenchment instructions."
 NAM_relief_columns: "The Road Still Open"
 NAM_relief_columns_desc: "Supply must move to today's threatened sector. Allocate transport and permit the use of our own fuel for emergency equipment batches."
 NAM_counterstroke: "Retake the Junctions"
 NAM_counterstroke_desc: "A counterstroke should reopen supply roads. A temporary planning group will coordinate limited attacks with the means to hold recovered junctions."
 NAM_recognition: "Independence in Ink"
 NAM_recognition_desc: "The neighbours have recognised Svetlogorye. Its people can now debate their state without waiting for an absent capital."
 NAM_service_state: "A State of Accountable Service"
 NAM_service_state_desc: "Emergency command bought time. A permanent state must define what it expects of its officials. Rom retains authority, while responsibility reaches his own office."
 NAM_federal_charter: "The District Charter"
 NAM_federal_charter_desc: "Wartime concessions become lasting rules. Districts retain scrutiny and a share in budgeting, while the central government retains the army and foreign representation."
 NAM_law_after_war: "Rules Beyond the Emergency"
 NAM_law_after_war_desc: "Victors can keep emergency rule forever. Establish permanent terms and appeals consistent with the country's chosen institutions."
 NAM_civil_repair: "Rebuild What We Defended"
 NAM_civil_repair_desc: "A victory speech cannot restart extraction. Build a civilian enterprise on the South Coast and put repair crews back to work."
 NAM_civil_dividend: "Civilian Dividend"
 NAM_civil_dividend_desc: "Victory revenues fund civilian construction, giving weapons production lower priority."
 NAM_armed_peace: "Standing Defence Order"
 NAM_armed_peace_desc: "Army readiness is paid for by slower civilian construction."
 NAM_national_university: "A Country of Its Own Specialists"
 NAM_national_university_desc: "An oil state remains vulnerable while outsiders solve its difficult problems. Expand the technical institute into a university with an independent research budget."
 NAM_svetlogorye: "Svetlogorye Answers for Itself"
 NAM_svetlogorye_desc: "This country once occupied a line in someone else's report. It now has recognised borders, its own specialists and institutions its government must answer for. Its future will no longer arrive as a letter from elsewhere."
 NAM_wartime_entrenchment: "Basin Defence Instructions"
 NAM_wartime_entrenchment_desc: "Temporary engineering preparation applies only to the resource war."
 NAM_counterstroke_staff: "Limited Counterstroke Staff"
 NAM_counterstroke_staff_desc: "Temporary offensive coordination applies only to the resource war."
 NAM_rebel_depot_maps: "Maps of Insurgent Depots"
 NAM_rebel_depot_maps_desc: "Inspectors' records assist attacks against the Svetlogorsk uprising."
 NAM_wage_arrears: "Deferred Payroll"
 NAM_wage_arrears_desc: "Old wage arrears have been deferred until the next quarter."
 NAM_housing_programme: "Homes for Those Who Returned"
 NAM_housing_programme_desc: "A funded civilian programme accelerates construction."
 NAM_sign_compact: "Fund the Svetlogorsk Compact"
 NAM_sign_compact_desc: "Fund the district civil offices. The compact must operate for §Y60 uninterrupted days before the resource war begins§! under our ownership and control to prevent the uprising. Maturing during the war does not change its initial outcome. Losing the district ends the compact; after recovery it can be funded again before the war."
 NAM_export_fuel: "Sell a Reserve Fuel Cargo"
 NAM_export_fuel_desc: "Sell §Y5000§! £fuel_texticon for §G250§! £ADISCORD_economy_treasury_texticon. Requires ownership and control of the port district. Repeat after §Y30 days§!."
 NAM_workshop_batch: "Fuel an Extra Workshop Shift"
 NAM_workshop_batch_desc: "Use §Y3000§! £fuel_texticon to produce §G120§! £support_equipment_texticon. Repeat after §Y30 days§!."
 NAM_supply_order: "Pay for a Field Delivery"
 NAM_supply_order_desc: "Deliver §G13500§! £infantry_equipment_texticon and §G60§! £support_equipment_texticon to our stockpiles. Repeat after §Y45 days§!."
 NAM_emergency_arsenal: "Emergency Arsenal Release"
 NAM_emergency_arsenal_desc: "During the resource war issue §G2000§! £infantry_equipment_texticon and §G100§! £support_equipment_texticon. Repeat after §Y45 days§!."
 NAM_counterinsurgency: "Locate the Underground Depots"
 NAM_counterinsurgency_desc: "Gain §G+8%§! attack against the Svetlogorsk uprising for §Y60 days§! and recover §G1000§! £infantry_equipment_texticon. Available once during an actual war with the rebels."
 NAM_relief_batch: "Supply the Threatened Sector"
 NAM_relief_batch_desc: "Use §Y3000§! £fuel_texticon to deliver §G800§! £infantry_equipment_texticon and §G60§! £support_equipment_texticon. Resource war only; repeat after §Y30 days§!."
 NAM_veteran_housing: "Fund the Return to Civilian Life"
 NAM_veteran_housing_desc: "Gain §G5%§! construction speed for §Y60 days§!. Another programme is available after §Y60 days§!."
 NAM_postwar_rearmament: "Fulfil the Standing Defence Order"
 NAM_postwar_rearmament_desc: "Receive §G2000§! £infantry_equipment_texticon and §G80§! £support_equipment_texticon. Repeat after §Y45 days§!."
