 ADISCORD_nam_crisis.1.t: "Oilfield Fire"
 ADISCORD_nam_crisis.1.d: "A well at the Northern Deposits caught fire during the night. The flames have spread to the storage tanks, and the workers ask how much the chancellery is willing to pay to stop them."
 ADISCORD_nam_crisis.1.a: "Put it out at any cost."
 ADISCORD_nam_crisis.1.b: "Let it burn out."
 ADISCORD_nam_crisis.1.z: "Emergency fund."
 ADISCORD_nam_crisis.2.t: "Oil Workers' Strike"
 ADISCORD_nam_crisis.2.d: "The oilfield shifts have not come to work. The oil workers demand a raise and promise not to return until they get it."
 ADISCORD_nam_crisis.2.a: "Raise wages."
 ADISCORD_nam_crisis.2.b: "Break the strike."
 ADISCORD_nam_crisis.2.z: "Emergency fund."
 ADISCORD_nam_crisis.3.t: "Chancellery Scandal"
 ADISCORD_nam_crisis.3.d: "Newspapers have found receipts in the chancellery showing namestniks taking money for signatures. The districts demand a trial."
 ADISCORD_nam_crisis.3.a: "Hush it up."
 ADISCORD_nam_crisis.3.b: "Public trial."
 ADISCORD_nam_crisis.3.z: "Emergency fund."
 ADISCORD_nam_crisis.4.t: "Export House Smuggling"
 ADISCORD_nam_crisis.4.d: "The export houses are shipping oil past customs. We can demand our share and look away - or strike at the smuggling."
 ADISCORD_nam_crisis.4.a: "Take a share."
 ADISCORD_nam_crisis.4.b: "Stop the smuggling."
 ADISCORD_nam_crisis.5.t: "Garrison Desertion"
 ADISCORD_nam_crisis.5.d: "Garrison soldiers are leaving their posts, complaining of unpaid wages. The officers ask for money or a tribunal."
 ADISCORD_nam_crisis.5.a: "Pay the arrears."
 ADISCORD_nam_crisis.5.b: "Convene a tribunal."
 ADISCORD_nam_crisis.5.z: "Emergency fund."
