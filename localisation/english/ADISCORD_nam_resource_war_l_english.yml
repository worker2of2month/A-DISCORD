 NAM_crisis_office: "Incident Office"
 NAM_crisis_office_desc: "Fires, strikes and scandals no longer catch the chancellery off guard. The office keeps an emergency fund and a procedure for every misfortune."
 NAM_field_firefighters: "Oilfield Fire Brigades"
 NAM_field_firefighters_desc: "Every oil field receives a fire brigade and a stock of foam, and mediators settle with strikers more cheaply than any chancellery concession."
 NAM_chancellery_purge: "Purge of the Chancellery"
 NAM_chancellery_purge_desc: "An audit removes the greediest from the chancellery, and the customs guard shares seized goods with the treasury. The namestniks are displeased, the districts glad."
 NAM_field_firefighters_tt: "An oilfield fire is put out at no treasury cost. Conceding to striking oil workers costs §Y100§! £ADISCORD_economy_treasury_texticon instead of §Y250§!."
 NAM_chancellery_purge_tt: "Oilfield audits also recover §G150§! £ADISCORD_economy_treasury_texticon for §R-6§! £NAM_support_trade_texticon; export house support must be at least §Y30§!.\nHushing up a scandal costs §Y30§! £political_power_texticon instead of §Y60§!. The share of discovered contraband is §G250§! £ADISCORD_economy_treasury_texticon instead of §G100§!."
 NAM_crisis_office_tt:0 "Time until future incidents: §G+60§! £time_texticon. Response time: §G+7§! £time_texticon. Also extends the current timer."
 NAM_grp_chancellery_purge_tt: "Group support:\n  Namestniks: §R-5§! £NAM_support_nam_texticon\n  Districts: §G+5§! £NAM_support_dist_texticon"
 NAM_treasury: "Treasury of Svetlogorye"
 NAM_treasury_desc: "§YSTATE TREASURY§!\nAvailable: §Y[?ADISCORD_economy_treasury|0]§! £ADISCORD_economy_treasury_texticon\n\n§YMANAGING FUNDS§!\nTreasury and political power can be exchanged for each other; rates are listed in the decisions.\n\n§YEMERGENCY FUND§!\nIncidents happen about once a year. The fund settles any of them without loss."
 NAM_bond_payments: "Bond Payments"
 NAM_bond_payments_desc: "The chancellery pays the holders of oil bonds."
 NAM_oil_bonds: "Oil Bonds"
 NAM_oil_bonds_desc: "The treasury is preparing securities backed by future oil revenue. Buyers will demand certified obligations and a clear settlement procedure."
 NAM_emergency_decrees: "Emergency Decrees"
 NAM_emergency_decrees_desc: "The chancellery is authorising extraordinary levies by decree. Local administrations will receive signed ledgers and instructions for their collectors."
 NAM_buy_machine_tools: "Buy Machine Tools"
 NAM_buy_machine_tools_desc: "Commercial representatives are offering machine tools for South Harbour. Engineers will inspect the equipment and prepare the premises before treasurers sign the acceptance papers."
 NAM_fuel_audit: "Oilfield Audit"
 NAM_fuel_audit_desc: "Inspectors compare the tank cars with their manifests. Behind the corrected figures lie stocks that warehouse owners would rather forget."
 NAM_crisis_fund: "Replenish the Emergency Fund"
 NAM_crisis_fund_desc: "Part of the treasury is kept outside the ordinary budget. When a fire or scandal demands immediate action, officials will not need to hunt for an unused budget line."
 NAM_crisis_prevention: "Incident Prevention"
 NAM_crisis_prevention_desc: "Inspections, drills and rewards for caution cost the chancellery less than a rushed investigation. The service will check people and equipment before the next disaster reaches the papers."
 NAM_crisis_fund_tt: "One current or future incident can be settled §Gwithout loss§! by spending the fund. It remains available until used."
 NAM_crisis_prevention_tt:0 "The next incident is delayed by §G60§! £time_texticon."
 NAM_crisis_fund_used_tt: "The emergency fund is spent."
 NAM_crisis_free_tt: "Costs nothing."
 NAM_crisis_pay_250_tt: "Treasury: §R-250§! £ADISCORD_economy_treasury_texticon."
 NAM_crisis_pay_100_tt: "Treasury: §R-100§! £ADISCORD_economy_treasury_texticon."
 ADISCORD_nam_crisis.1.t: "Oilfield Fire"
 ADISCORD_nam_crisis.1.d: "A well at the Northern Deposits caught fire during the night. The flames have spread to the storage tanks, and the workers ask how much the chancellery is willing to pay to stop them."
 ADISCORD_nam_crisis.1.a: "Put it out at any cost."
 ADISCORD_nam_crisis.1.b: "Let it burn out."
 ADISCORD_nam_crisis.1.z: "Emergency fund."
 ADISCORD_nam_crisis.2.t: "Oil Workers' Strike"
 ADISCORD_nam_crisis.2.d: "The oilfield shifts have not come to work. The oil workers demand a raise and promise not to return until they get it."
 ADISCORD_nam_crisis.2.a: "Raise wages."
 ADISCORD_nam_crisis.2.b: "Break the strike."
 ADISCORD_nam_crisis.2.z: "Emergency fund."
 ADISCORD_nam_crisis.3.t: "Chancellery Scandal"
 ADISCORD_nam_crisis.3.d: "Newspapers have found receipts in the chancellery showing namestniks taking money for signatures. The districts demand a trial."
 ADISCORD_nam_crisis.3.a: "Hush it up."
 ADISCORD_nam_crisis.3.b: "Public trial."
 ADISCORD_nam_crisis.3.z: "Emergency fund."
 ADISCORD_nam_crisis.4.t: "Export House Smuggling"
 ADISCORD_nam_crisis.4.d: "The export houses are shipping oil past customs. We can demand our share and look away - or strike at the smuggling."
 ADISCORD_nam_crisis.4.a: "Take a share."
 ADISCORD_nam_crisis.4.b: "Stop the smuggling."
 ADISCORD_nam_crisis.5.t: "Garrison Desertion"
 ADISCORD_nam_crisis.5.d: "Garrison soldiers are leaving their posts, complaining of unpaid wages. The officers ask for money or a tribunal."
 ADISCORD_nam_crisis.5.a: "Pay the arrears."
 ADISCORD_nam_crisis.5.b: "Convene a tribunal."
 ADISCORD_nam_crisis.5.z: "Emergency fund."
