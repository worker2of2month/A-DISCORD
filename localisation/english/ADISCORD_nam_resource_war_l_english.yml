 NAM_wartime_programmes_tt: "The resource war is under way, or the War for the South with Svetlogorye leading the northern camp"
 NAM_startup_region:0 "§YTHE SOUTHERN RESOURCE BELT: SVETLOGORYE'S SURROUNDINGS§!\n\nThe situation at the beginning of 2160.\n\n§YWorkerland: authority over the autonomy§!\nSvetlogorye belongs to the confederation's system of dependent territories. Viceroys administer the oil basin through reports, districts and garrisons, but central orders increasingly exceed the centre's capabilities. Workerland's weakness makes control of local resources a more urgent question.\n\n§YEflor: the demand to reclaim land§!\nThe republic's nationalist leadership places territorial unity above local autonomy. Oil-producing lands once taken by Workerland remain disputed. To Eflor, the viceroyal administration embodies the order that entrenched that loss.\n\n§YAzhar: the Directorate of the Black Basin§!\nSamir Azhar united the districts through common accounting of manpower, supplies and fuel. The Directorate maintains reserves and subjects supply to a state plan. Its territorial claims are backed by mobilisation capacity, and the struggle over the oil basin has both economic and political significance.\n\n§YShahrabad and southern trade routes§!\nShahrabad concentrates the region's population, metallurgy and industrial capital. Its furnaces need water, raw materials and dependable exports; Keyzan, Mazar and Veir's ports influence these flows. Svetlogorye's oil wealth belongs to this wider trading system, where a local dispute can affect the whole South."
 NAM_startup_country: "§YSVETLOGORYE IN 2160§!\n\n§YThe oil basin and imperial authority§!\nSvetlogorye took shape within Vorkerland's dependent administrative system. Oil lands and adjoining infrastructure were assigned to it by Vorkerland's administration. Their inhabitants lived under foreign rule for generations. State borders recorded the centre's decision without erasing memories of the land's former allegiance.\n\nOil made the southern basin an important source of resources. Shipment plans, garrison supplies and export accounts became part of everyday life alongside the oilfields. Wealth lay underground; authority over it passed through institutions tied to a distant capital.\n\n§YThe ladder of namestniks§!\nImperial administrators built government as a chain of appointed representatives. Each office reported to the next, and each rung had a seal and the power to halt a decision. The ladder collected resources and maintained discipline but showed the country to the centre mainly through reports.\n\nOver time, administrative procedure became a power of its own. Approval determined who received money and access to stocks; an error could become a state secret. The apparatus counted others' expenses more readily than its own. Duplicate ledgers allowed one office to appear as several functioning institutions.\n\n§YWhen the orders diverged§!\nThe weakening of Vorkerland's centre did not abolish the old chain of command. Instructions kept arriving in Svetlogorye: ship oil, leave the wagons untouched, follow a new order instead of the previous one. Egor Rom's shelves held papers that could no longer all be acted upon. Formal authority increasingly failed to reflect available people, warehouses and transport.\n\nNamestniks demanded discipline, districts contested levies, and oil workers waited for their earnings. Garrisons needed real fuel and export houses completed shipments. Parts of the same economy made incompatible demands on the government. Pay delays and collections fed discontent in Svetlogorsk, the country's largest city.\n\nOn the map, an office might have a regiment behind it; on the road, a single checkpoint represented its authority. Fuel stalled between departmental reports, while repair shops could do more than their budgets admitted. The system maintained the appearance of full accounting even as real work increasingly relied on local people and informal arrangements.\n\n§YAt the start of 2160§!\nEvery line of namestnik authority leads to Egor Rom, while Kirill Mezentsev brings its obligations together in the payroll. Svetlogorye remains a dependent territory of Vorkerland with the South's largest oilfields. The inherited apparatus still functions, although trust in its seals has weakened. Accumulated oil wealth coexists with unpaid wages and a dispute over who owns it."
 NAM_startup_guide_groups_title: "Institutions and pillars"
 NAM_startup_guide_groups: "§YHOW THE ADMINISTRATIVE LADDER WORKS§!\n\n§YWhere to check the situation§!\nThe $NAM_supports$ decision section shows relations with five groups. After the opening imperial inventory, look for paid programmes in $NAM_national_programmes$. Focuses reshape shared institutions; their results appear in the combined institutional modifier.\n\n§YSupport and weight§!\nSupport measures a group's attitude to the government; weight measures its influence. They are different values. Support of 70 or more gives the group's bonus; 25 or less gives a penalty. Overall loyalty above or below 50 changes political power and stability. Each month support moves 0.5 points towards 50, so strong results need maintenance.\n\n§YGrumbling and demands§!\nSupport of 20 or less can produce grumbling, while 85 or more can produce demands. The council of supports unlocks concessions and bribery. Helping one group angers its rival: compare both gauges before paying. Maximum support is not complete protection from political events.\n\n§YChoose the structure§!\nAfter assessing the cost of each seal, choose central authority or the districts. Rom's single signature opens inspectors and emergency writs; district signatures open public accounts and guarantees to Svetlogorsk. Paths explains the courses in detail; during preparation, check which decisions your own branch can use.\n\n§YKeep money for incidents§!\nRandom incidents can require urgent spending. The incident service lowers their likelihood and opens a fund; fire brigades and cleaning up the chancery make outcomes cheaper. Do not spend every reserve on another reform if an unexpected payment would stop current preparations."
 NAM_startup_guide_oil_title: "Oil, treasury and army"
 NAM_startup_guide_oil: "§YOIL, CASH AND A READY ARMY§!\n\n§YStart with three figures§!\nCheck stored fuel, the treasury and the weekly balance. Oil underground, fuel in storage and available money serve different purposes. A sale brings one-off revenue; army and institutional upkeep continues after the deal.\n\n§YOpen oilfield programmes§!\nRegistering the wells returns fuel to circulation and opens an oilfield audit. Then choose oil sales to finance the state or domestic processing. Read the unlocked decisions: a focus opens a programme, while its orders require separate payment.\n\n§YMatch orders to deadlines§!\nThe budget focus opens bonds and emergency decrees; the oilfield spare-parts focus opens machinery purchases. Check every price and the duration on each decision. Treasury funds and political power are both spent when both prices are listed. Expected revenue from a future sale cannot pay for today's order.\n\n§YSea exports§!\nThe port opening focus, repair yard and convoy school support the harbour. Check maritime programme conditions and funds for implementation, especially when exports are supposed to cover new expenses.\n\n§YGarrisons§!\nThe garrison census, your chosen field guard or mobile columns, quartermasters and port arsenal prepare the army. After receiving units, inspect their equipment and supply. Keep weapons for replacements and fuel for active forces: a profitable sale should not undermine preparation for the resource war."
 NAM_startup_guide_war_title: "The resource war"
 NAM_startup_guide_war: "§YPREPARING FOR THE RESOURCE WAR§!\n\n§YThe threat comes from outside§!\nA regional crisis develops after Vorkerland's collapse: Eflor and Azhar attack the oil basin, while Svetlogorsk may revolt. Restitution pressure grows every month: notes arrive at 40, an ultimatum at 70, and at 100, but not earlier than 300 days after the collapse, war begins. Before then, issue mobilisation orders and prepare defence lines: the wartime army is a small core plus the formations you prepared.\n\n§YIf you chose the districts§!\nThe compact requires guarantees to Svetlogorsk and a separate paid decision funding civilian services. By the outbreak of war, it must have operated for 60 uninterrupted days while you own and control the city. This prevents the revolt. Completing the focus one day before war is insufficient: allow time to unlock and pay for the decision, followed by the compact's full working period.\n\n§YIf you chose central authority§!\nDistrict guarantees are unavailable on this route. Prepare for an internal front and check emergency issue and stockpile-search decisions opened by $NAM_emergency_writ$. The other branch's compact cannot replace your military preparations.\n\n§YVictory condition§!\nForce the enemies to capitulate, or hold 100 points of oil by day 420 of the war: the Northern Deposits give 80, the South Coast 36, Sukhorechye 24, East Sukhorechye 12, the Svetlogorsk District 12. A recognition treaty and a new border also require holding at least one border district of Eflor or Azhar on that day; 100 points without one bring a standoff on the old border. With 36 to 99 points the country survives through a compromise peace; below 36 it is partitioned. You do not need to hold the fields continuously: control on the day of the check counts.\n\n§YDuring the fighting§!\nThe military branch opens programmes for holding the fields, supply and counterattack. Check for new decisions after its focuses. Ordinary diplomatic war declarations and alliances are disabled. Postwar alternatives and the consequences of defeat are explained under Paths."
 NAM_startup_guide_plan_title: "First steps"
 NAM_startup_guide: "§YFIRST STEPS AS SVETLOGORYE§!\n\n§Y1. Conduct the inventory.§! Begin with the inventory of the disappearing empire, then open the government decisions. Compare cash, the weekly balance, fuel and the actual condition of your garrisons.\n\n§Y2. Inspect the supports.§! Open $NAM_supports$ and check the support and weight of all five groups. A concession to one can bring another closer to crisis. Grumbling begins at 20 or less; demands arise at 85 or more.\n\n§Y3. Choose the preparation your route permits.§! On the district route, unlock guarantees and fund Svetlogorsk's civilian services with time for 60 uninterrupted days of operation. On the central authority route, prepare for an internal front and use your own emergency decisions.\n\n§Y4. Connect oil to expenses.§! Exports bring money; domestic processing develops the economy. Compare fuel stocks with army needs before selling. Income from a future agreement does not replace funds for a current order.\n\n§Y5. Finish essential programmes.§! A decision's price, duration and conditions remain after the unlocking focus is complete. Choose work that can deliver before the threat, and preserve reserves for incidents and replacements.\n\n§Y6. Watch the war timer.§! Victory comes through defeating the coalition or the oil score at the day-420 check: the Northern Deposits matter most, but they alone are not enough for full victory. Prepare to defend that area and read newly opened military decisions. Political outcomes are described under Paths."
 NAM_startup_path_0_title: "Rule of the Namestniks"
 NAM_startup_path_0: "§YRULE OF THE NAMESTNIKS§!\n\nThrough Rom's single signature and emergency writs, Svetlogorye becomes a service state. The register of powers, the namestnik garrisons and oil quotas gather power in the chancellery, and the 'Unified Administration' makes it the order of the whole country.\n\nThis path grants strong political power and obedient occupied lands, but the districts lose their voice. Its war for the South is 'Subjugate Shahrabad': Shahrabad must become one more step of the ladder."
 NAM_startup_path_0_details: "§YRULE OF THE NAMESTNIKS: CONDITIONS AND REWARDS§!\n\n§YEntry§!\n'State of Service Responsibility' requires 'Signature Under Independence' and the 'Emergency Writ' of the vertical branch. The path closes the district charter.\n\n§YBranch§!\n'Register of Powers' opens the district audit, 'Namestnik Garrisons' grant permanent garrisons, 'Oil Quotas' fuel. The 'Unified Administration' needs both.\n\n§YEndings§!\n'Establish the New Order' strengthens the namestniks and the army. The 'Civic Reforms' path ends with 'Proclaim the Republic' and increases the influence of the districts and oil workers. The endings are exclusive and redistribute group influence.\n\n§YThe South§!\n'Black Basin' subjugates Azhar, 'Desert Namestnik Offices' Kadir and Eflor. 'Subjugate Shahrabad' needs 'Svetlogorye Answers for Itself', a matured southern crisis and peace, and declares war on Shahrabad. Victory turns the South into namestnik offices."
 NAM_startup_path_1_title: "District Self-Government"
 NAM_startup_path_1: "§YDISTRICT SELF-GOVERNMENT§!\n\nThe path of the districts' signatures and guarantees to Svetlogorsk turns the ladder into a federation of districts. The district council, the oil fund and the militia build a common fuel market where the namestniks are not the only voice.\n\nThis path grants stability, research and allies, but the namestniks lose power. Its war for the South is 'Charter Against the Cartel': fuel for water for the neighbours and a common front against Shahrabad."
 NAM_startup_path_1_details: "§YDISTRICT SELF-GOVERNMENT: CONDITIONS AND REWARDS§!\n\n§YEntry§!\n'Charter of the Districts' requires 'Signature Under Independence' and 'Guarantees to Svetlogorsk' from the districts branch. The path closes the service state.\n\n§YBranch§!\n'Council of Districts', the 'Oil Fund' with fuel for allies and the 'District Militia' lead to the 'Common Fuel Market'.\n\n§YEndings§!\n'Establish the Federation' gives the districts the decisive voice. The 'Rule of the Oil Workers' path ends with 'Establish the Union' and strengthens the oil workers and export houses. The endings are exclusive and redistribute group influence.\n\n§YThe South§!\n'Oil for Water' offers an alliance to Fenn, Rahma, Sardan and Azhar; 'Fenn's Guarantee' subjugates Eflor. 'Charter Against the Cartel' needs 'Svetlogorye Answers for Itself', a matured southern crisis and peace, and declares war on Shahrabad."
