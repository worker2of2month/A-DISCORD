 NAM_econ_export_dispatch_desc:0 "Cost: §Y25§! £political_power_texticon §Y50§! £ADISCORD_economy_treasury_texticon. Operates for §Y180§! £time_texticon days. Repeat after §Y30§! £time_texticon days.\n\nDispatchers reduce intermediary losses on contracts already accepted by buyers. $NAM_econ_export_dispatch_result_tt$\n\nRequires an active contract and owned, controlled South Harbour. Each buyer still consumes §Y1500§! £fuel_texticon. Loss of the harbour, capitulation or subjugation closes the office without a refund. Shortages or loss of customers do not extend its term."
