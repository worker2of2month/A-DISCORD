 NAM_bw_support_rules:0 "§YPILLAR LOYALTY§!\nLoyalty: §Y[?NAM_loyalty|0] / 100§!\nTotal effect: [?NAM_loy_political_power_gain|=+2] £political_power_texticon /day; [?NAM_loy_stability_factor|=+1%] £stability_texticon.\nAbove §Y50§! loyalty grants a bonus; below it imposes a penalty. Each pillar card shows its support, influence and current effect.\n\n§YSUPPORT AND PETITIONS§!\n- At least §G70§! - a group bonus; §R25§! or less - a penalty.\n- §R20§! or less - possible unrest; at least §Y85§! - a demand.\n- Each month support moves §Y0.5§! towards §Y50§!.\n- Petitions from groups and rivals: at least §Y90§! £time_texticon days apart.\n- A group repeats unrest or demands after §Y360§! £time_texticon days.\n\n§YFAVOURS AND CONCESSIONS§!\nFavours require §Y70§! support: cost §Y15§!, duration §Y120§! £time_texticon days, repeat after §Y180§! £time_texticon days from issue. Availability is shown on the pillar card.\nThe §YCouncil of Pillars§! focus opens concessions: cost §Y30§! £political_power_texticon, repeat after §Y60§! £time_texticon days. One group gains support at another's expense; exact changes are listed in the decision.\n\n§YRIVALS AFTER INDEPENDENCE§!\nThe rival of the weakest pillar names a term at most once every §Y240§! £time_texticon days. Refusal costs that pillar §R15§! support. An unheard rival whose pillar has less than §R25§! support will claim power."
 NAM_bw_programme_rules:0 "§YOILFIELD PROJECTS§!\nIn progress: §Y[?NAM_projects_in_progress|0] / [?NAM_project_slots|0]§! £under_construction_texticon\nFocuses unlock programmes; paid orders deliver supplies and working institutions.\n\n§YEXPORTS AND PREPARATION§!\nDelivery capacity, customers and island agreements appear in the export summary below the map.\nWar pressure is covered under Restitution Pressure; prepared formations under Mobilisation of Svetlogorye.\n\n§YRESOURCE WAR OUTCOME§!\nDiplomatic deadline: §Y420§! £time_texticon days.\n- At least §Y100§! oil points - independence. A captured enemy border district grants recognition with a new border; otherwise the old border remains.\n- §Y36-99§! - a compromise peace.\n- Below §R36§! - partition.\nEnemy capitulation ends the war earlier."
 NAM_bw_rules_hint:0 "Rules"
 NAM_bw_loyalty:0 "Pillar loyalty: §Y[?NAM_loyalty|0]§! / 100"
 NAM_bw_selected_district:0 "SELECTED DISTRICT"
 NAM_bw_map_legend:0 "§GOur control§!   §ROccupied§!   Grey: another owner\n§YOutline: selection§! - click a district number."
 NAM_bw_map_help:0 "Click a district number for its status and actions below the map. Hover for its full report. Selecting a district neither starts work nor spends resources."
