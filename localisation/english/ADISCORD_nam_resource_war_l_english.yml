 NAM_counterinsurgency_sweep_desc: "§YCOST§!: §Y20§! £political_power_texticon §Y75§! £ADISCORD_economy_treasury_texticon\n§YCOMPLETION§!: §Y21§! £time_texticon days\n§YREPEAT IN DISTRICT§!: after §Y120§! £time_texticon days from completion.\n\n§YRESULT§!\nGendarmes search the district, check papers and arrest suspects.\nUnderground: §G-8§! £operatives_boost_resistance_texticon, or §G-12§! in Svetlogorsk. District support: §R-4§! £NAM_support_dist_texticon.\n\n§YRISK AND CANCELLATION§!\nExcesses further reduce stability and district support while strengthening the underground. Loyal garrisons reduce this risk.\nAn interrupted sweep refunds the treasury deposit; political power is not refunded."
