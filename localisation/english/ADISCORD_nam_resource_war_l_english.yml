 NAM_bond_payments: "Bond Payments"
 NAM_bond_payments_desc: "The chancellery pays the holders of oil bonds."
 NAM_oil_bonds: "Oil Bonds"
 NAM_oil_bonds_desc: "Money now against future oil. The payments will cost the chancellery political weight."
 NAM_emergency_decrees: "Emergency Decrees"
 NAM_emergency_decrees_desc: "The chancellery imposes one-off levies by decree. Money arrives at once, and the districts' patience wanes."
 NAM_buy_machine_tools: "Buy Machine Tools"
 NAM_buy_machine_tools_desc: "A batch of machine tools becomes a new civilian factory in South Harbour."
 NAM_fuel_audit: "Oilfield Audit"
 NAM_fuel_audit_desc: "Inspectors open the ledgers and find hidden oil."
 NAM_crisis_fund: "Replenish the Emergency Fund"
 NAM_crisis_fund_desc: "Money set aside will settle the next incident without loss."
 NAM_crisis_prevention: "Incident Prevention"
