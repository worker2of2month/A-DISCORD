 NAM_wartime_programmes_tt: "The resource war is under way, or the War for the South with Svetlogorye leading the northern camp"
 NAM_startup_region:0 "§YTHE SOUTHERN RESOURCE BELT: SVETLOGORYE'S SURROUNDINGS§!\n\nThe situation at the beginning of 2160.\n\n§YWorkerland: authority over the autonomy§!\nSvetlogorye belongs to the confederation's system of dependent territories. Viceroys administer the oil basin through reports, districts and garrisons, but central orders increasingly exceed the centre's capabilities. Workerland's weakness makes control of local resources a more urgent question.\n\n§YEflor: the demand to reclaim land§!\nThe republic's nationalist leadership places territorial unity above local autonomy. Oil-producing lands once taken by Workerland remain disputed. To Eflor, the viceroyal administration embodies the order that entrenched that loss.\n\n§YAzhar: the Directorate of the Black Basin§!\nSamir Azhar united the districts through common accounting of manpower, supplies and fuel. The Directorate maintains reserves and subjects supply to a state plan. Its territorial claims are backed by mobilisation capacity, and the struggle over the oil basin has both economic and political significance.\n\n§YShahrabad and southern trade routes§!\nShahrabad concentrates the region's population, metallurgy and industrial capital. Its furnaces need water, raw materials and dependable exports; Keyzan, Mazar and Veir's ports influence these flows. Svetlogorye's oil wealth belongs to this wider trading system, where a local dispute can affect the whole South."
 NAM_startup_country: "§YSVETLOGORYE IN 2160§!\n\n§YThe oil basin and imperial authority§!\nSvetlogorye took shape within Vorkerland's dependent administrative system. Oil lands and adjoining infrastructure were assigned to it by Vorkerland's administration. Their inhabitants lived under foreign rule for generations. State borders recorded the centre's decision without erasing memories of the land's former allegiance.\n\nOil made the southern basin an important source of resources. Shipment plans, garrison supplies and export accounts became part of everyday life alongside the oilfields. Wealth lay underground; authority over it passed through institutions tied to a distant capital.\n\n§YThe ladder of namestniks§!\nImperial administrators built government as a chain of appointed representatives. Each office reported to the next, and each rung had a seal and the power to halt a decision. The ladder collected resources and maintained discipline but showed the country to the centre mainly through reports.\n\nOver time, administrative procedure became a power of its own. Approval determined who received money and access to stocks; an error could become a state secret. The apparatus counted others' expenses more readily than its own. Duplicate ledgers allowed one office to appear as several functioning institutions.\n\n§YWhen the orders diverged§!\nThe weakening of Vorkerland's centre did not abolish the old chain of command. Instructions kept arriving in Svetlogorye: ship oil, leave the wagons untouched, follow a new order instead of the previous one. Egor Rom's shelves held papers that could no longer all be acted upon. Formal authority increasingly failed to reflect available people, warehouses and transport.\n\nNamestniks demanded discipline, districts contested levies, and oil workers waited for their earnings. Garrisons needed real fuel and export houses completed shipments. Parts of the same economy made incompatible demands on the government. Pay delays and collections fed discontent in Svetlogorsk, the country's largest city.\n\nOn the map, an office might have a regiment behind it; on the road, a single checkpoint represented its authority. Fuel stalled between departmental reports, while repair shops could do more than their budgets admitted. The system maintained the appearance of full accounting even as real work increasingly relied on local people and informal arrangements.\n\n§YAt the start of 2160§!\nEvery line of namestnik authority leads to Egor Rom, while Kirill Mezentsev brings its obligations together in the payroll. Svetlogorye remains a dependent territory of Vorkerland with the South's largest oilfields. The inherited apparatus still functions, although trust in its seals has weakened. Accumulated oil wealth coexists with unpaid wages and a dispute over who owns it."
 NAM_startup_guide_groups_title:0 "Pillars, power and underground"
 NAM_startup_guide_groups:0 "§YWHO HOLDS SVETLOGORYE TOGETHER§!\n\n§YFive pillars§!\nIn $NAM_supports$, watch the namestniks, oil workers, districts, garrisons and export houses. Support measures their attitude; weight measures their influence. Concessions to one pillar can hurt another. Focuses and paid decisions reshape institutions and relations with the groups. One strong gauge cannot secure the whole government.\n\n§YThe ladder of seals§!\nIndependence opens the balance between central authority and the districts. The vertical strengthens collection and administration, but its dominance costs stability and research. District power helps construction, science and public stability at the expense of political power and collection. Focuses, patronage and political events move the balance.\n\n§YRom's rivals§!\nRepresentatives of the pillars make demands and expect promises to be fulfilled. Check the deadline and price of each commitment. Refusal or a broken promise with weak support can trigger a struggle for the seals and a change of leader. Reserve money for incidents and concessions alongside military spending.\n\n§YYaroslav Weber's underground§!\nIt operates from the start: district discontent and stronger central authority help it grow. Fires, depot raids and assassination attempts can follow. Colonial sweeps are available early; later the vertical hunts caches, while the districts can negotiate an amnesty and recruit Weber as a commander.\n\n§YPreventing the uprising§!\nA completed amnesty prevents it. Alternatively, unlock the Svetlogorsk guarantees and pay for the compact: it must operate for 60 uninterrupted days before the war while you own and control the city. Without these protections, underground strength of 60 or more triggers an uprising; 30-59 gives a fifty-percent chance, and below 30 there is none. Prepare the city before hostilities."
 NAM_startup_guide_oil_title:0 "Basin, contracts and islands"
 NAM_startup_guide_oil:0 "§YOIL MUST REACH ITS BUYER§!\n\n§YWhile the metropole survives§!\n$NAM_colony$ offers shipments to Vorkerland and trade concessions. They bring revenue and change pillar support. Colonial programmes close when the centre collapses, so do not base permanent expenses solely on their income.\n\n§YThe basin map§!\nAfter $NAM_inventory$, open $NAM_national_programmes$. The map shows field condition, throughput, committed capacity and projects. Oil on the map, stored fuel and capacity available for contracts are different figures. Losing or damaging a node reduces delivery capacity.\n\n§YRepair and development§!\nWell repairs, field refineries, the Klyuchevsk pipeline and sea terminal require unlocks, payment and time. Check project slots and ownership of the required districts. The pipeline needs Sukhorechye and the South Harbour; the terminal serves distant buyers. Losing a construction site interrupts work and refunds the deposit.\n\n§YFuel contracts§!\nA buyer must accept your offer. An active contract occupies capacity and exchanges §Y1500§! £fuel_texticon from your stockpile for §G40§! £ADISCORD_economy_treasury_texticon each month. Without enough fuel, both delivery and payment are skipped. War with the buyer ends the contract. Contracts with Eflor and Azhar slow restitution pressure; embargoes accelerate it.\n\n§YOverseas districts§!\nThe islands offer steel, convoy services and concessions. Deals with Kefreite require the other side's consent. Develop the harbours and defend the archipelago: it can sustain the campaign after the mainland is lost. See Paths for the consequences.\nAn active export dispatch office adds §G+30§! £ADISCORD_economy_treasury_texticon for each completed monthly delivery."
 NAM_startup_guide_war_title:0 "Pressure and the resource war"
 NAM_startup_guide_war:0 "§YPREPARATION AND THE FRONT§!\n\n§YTwo clocks§!\nRestitution pressure rises after Vorkerland collapses: notes arrive at 40 and an ultimatum at 70. Pressure of 100 allows an attack from day 300 after the collapse. Even low pressure does not cancel the separate attack deadline at 420-480 days. Delays and circumstances can move it; avoiding introductory focuses does not stop the crisis.\n\n§YAnswering the ultimatum§!\nThe Klyuchevsk protocol cedes East Sukhorechye and imposes a year of fuel tribute, postponing the threat by a year. Buying time from Azhar grants 75 days but does not remove it from the coalition. You may reject the demands or strike first: a pre-emptive war starts quickly with a weaker defensive bonus.\n\n§YMobilise before the shooting§!\nUse $NAM_mobilisation$ to pay for formations and prepare lines. Orders reserve resources now; formations deploy at the outbreak of war. Before hostilities, cancelling returns treasury funds, fuel and recruits, but not political power. Check order limits, project durations and replacement stocks. City preparation is covered under Pillars.\n\n§YThe war can end early§!\nCapitulations and decisive territorial control can bring peace before the deadline. Svetlogorye needs its fields and all enemy border belts. The coalition needs the Northern Deposits and one additional field. Territorial outcomes are checked again after 7 days: losing key ground can end the war before the timer expires.\n\n§YIf the war reaches day 420§!\nCurrent control decides the score: Northern Deposits 80, South Coast 36, Sukhorechye 24, East Sukhorechye and Svetlogorsk District 12 each. At least 100 points plus an occupied enemy border district bring the victory treaty; without that district, a standoff restores the old border. 36-99 points mean compromise; below 36 means defeat.\n\n§YSeal discipline§!\nCasualties and lost fields weaken army organisation through discipline. Watch holding missions, supply and wartime programmes. The settlement determines your next focus tree."
 NAM_startup_guide_plan_title:0 "First steps"
 NAM_startup_guide:0 "§YFIRST STEPS AS SVETLOGORYE§!\n\n§Y1. Conduct the inventory.§! Start with $NAM_inventory$. Check the treasury, weekly balance, fuel and garrisons. While Vorkerland survives, use colonial trade and keep track of the underground.\n\n§Y2. Inspect the pillars and basin.§! Compare all five groups' support and influence in $NAM_supports$. In $NAM_national_programmes$, check field condition, free capacity, ongoing projects and contracts.\n\n§Y3. Choose how to govern.§! The vertical and districts open different preparations. On the district route, allow time for talks with Weber or payment followed by 60 days of the Svetlogorsk compact. The vertical needs cache hunts and readiness for an internal front.\n\n§Y4. Budget for independence.§! Colonial income disappears with the centre. Repair fields, negotiate deliveries and retain fuel for the army. An offer is not yet an active contract.\n\n§Y5. Prepare before the attack.§! Follow pressure and the separate crisis deadline. Pay for mobilisation orders, prepare lines and finish projects on time. The ultimatum can buy time through material concessions.\n\n§Y6. Defend the decisive ground.§! Losing the Northern Deposits and another field can end the war early. Keep reserves and watch discipline. Victory or a standoff opens the postwar tree; compromise or island exile opens the defeat tree. Paths describes the continuations."
 NAM_startup_path_0_title: "Rule of the Namestniks"
 NAM_startup_path_0:0 "§YRULE OF THE NAMESTNIKS§!\n\nEgor Rom gathers power around a single signature, inspectors and emergency writs. The vertical helps administer revenues and garrisons but deepens conflict with the districts and underground. Order depends on the support of those carrying out its instructions.\n\nAfter the resource war, the service state develops a register of powers, garrisons and oil quotas. Decide whether to entrench a rigid ladder or give it republican institutions. In the South, this course leads towards subordinating neighbours and fighting for authority over Shahrabad.\n\nReveal spoilers for entry conditions, leaders and consequences."
 NAM_startup_path_0_details:0 "§YTHE VERTICAL: COURSE AND ENDINGS§!\n\n§YPostwar access§!\nVictory and a standoff open the postwar tree. After $NAM_recognition$, $NAM_service_state$ is available if you did not choose $NAM_districts$ before the war. It excludes the district charter.\n\n§YState organisation§!\nThe register of powers, namestnik garrisons and oil quotas lead to $NAM_ladder_of_seals$. Restore the economy alongside this branch and choose normalisation with former enemies or border revenge.\n\n§YTwo endings§!\n$NAM_ladder_ending_iron$ establishes the Iron Ladder and Rom's etatist course. $NAM_ladder_ending_service$ creates Rom's Service Republic. These exclusive endings change the country's name, national spirit and balance of power. If a coup has already succeeded, its winner retains the leadership.\n\n§YThe war for the South§!\nThe Black Basin and desert namestnik offices prepare regional subjugation. $NAM_south_seal_over_furnaces$ requires the preceding focuses, a mature southern crisis and peace. Victory turns Shahrabad and its allies into namestnik territories. Military programmes, fuel supply and convoy warfare remain relevant."
 NAM_startup_path_1_title: "District Self-Government"
 NAM_startup_path_1:0 "§YDISTRICT SELF-GOVERNMENT§!\n\nThe districts demand open accounts and guarantees in place of a single signature. Their course supports science, construction and social stability while limiting the chancellery's power. The Svetlogorsk compact and talks with Weber offer political responses to the internal conflict.\n\nAfter the resource war, the charter brings together a district council, oil fund and militia. A common fuel market can underpin a federation or rule by the oil workers. In the South, this path relies on agreements, deliveries and a common front against Shahrabad.\n\nReveal spoilers for entry conditions, leaders and consequences."
 NAM_startup_path_1_details:0 "§YTHE DISTRICTS: CHARTER AND ENDINGS§!\n\n§YPostwar access§!\nVictory and a standoff open the postwar tree. After $NAM_recognition$, $NAM_federal_charter$ is available if you did not choose $NAM_vertical$ before the war. It excludes the service state. Svetlogorsk's guarantees help prevent the uprising but are not a separate postwar entry requirement.\n\n§YBefore the war§!\nPay for the city compact and allow 60 uninterrupted days before hostilities. Talks with Yaroslav Weber have several stages: only the completed amnesty prevents the uprising and recruits him as a commander. Beginning negotiations alone does not protect the city.\n\n§YTwo endings§!\nThe district council, oil fund and militia lead to the common fuel market. The Federation brings Nadezhda Ladygina to power on a humanist course; Kirill Mezentsev leads the Oil Union. Each ending gives the country its own name and national spirit and changes pillar influence and the balance of power. After a successful coup, its winner remains in charge.\n\n§YThe war for the South§!\nOil for Water offers alliances to neighbours, while the Charter Against the Cartel leads to war with Shahrabad after preparation and the crisis has matured. An alliance needs the partner's answer. Further programmes let you supply allied fuel or disrupt enemy shipping."
 NAM_startup_path_2_title:0 "Defeat and return"
 NAM_startup_path_2:0 "§YTHE CAMPAIGN AFTER DEFEAT§!\n\nLosing the resource war does not always end Svetlogorye's story. A compromise preserves part of the mainland; surviving islands can shelter a government that has lost the entire basin. Each outcome has a continuation in the defeat tree.\n\nOn the mainland, choose between recovering lost territory and reaching an agreement with the victors. In exile, rebuild the economy and army: develop island ports, settle refugees, maintain mainland contacts and prepare a return by sea.\n\nReveal spoilers for survival conditions, maritime raids and the route home."
 NAM_startup_path_2_details:0 "§YDEFEAT: COMPROMISE AND THE ISLANDS§!\n\n§YCompromise peace§!\nWith 36-99 points at the final check, Svetlogorye keeps controlled fields and its islands, cedes enemy-held territory and owes a year of fuel tribute. The defeat tree offers reconstruction and revenge or accommodation with the coalition. Accommodation can end tribute early, develop oil cooperation and lead towards the struggle for the South.\n\n§YIsland exile§!\nA full coalition victory takes the mainland. If Svetlogorye retains an overseas district, the capital moves there; without islands it is annexed. Evacuation saves only part of the army and much of the stockpile is lost. The island branch builds a government in exile, refugee settlements, ports, a raiding fleet and an army of return.\n\n§YRaids and loot§!\nAfter $NAM_exile_sea_raiders$, use the shipping-lane map in $NAM_piracy$. Raids require ships, a free flotilla and fuel; success is not guaranteed. Loot buys treasury funds, weapons, convoys, drills and marines. Notoriety and the vigilance of lane owners increase the risk of retaliatory blockades and punitive raids.\n\n§YReturning home§!\nOn the mainland, prepare cadres and the underground; in exile, build the Council of Return and Army of Return. Check readiness, peace, independence and the end of tribute at $NAM_defeat_war_of_return$. Exile begins its return with a landing at the South Harbour; prepared marines and readiness reinforce it. Recovering the lost lands requires victory in another war."
