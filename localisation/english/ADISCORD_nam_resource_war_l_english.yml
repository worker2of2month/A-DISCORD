 # Ladder of seals: declaration and rivals
 ADISCORD_nam_groups.12.t: "The Declaration of Svetlogorye"
 ADISCORD_nam_groups.12.d: "Before the meeting Rom asked for the declaration to be read aloud. It emerged that one paragraph gave Svetlogorye control over its revenues, while another still pledged compliance with every previous instruction from the metropole. The drafter suggested keeping the second provision for continuity. Rom asked whether that included the instructions that had prompted them to declare independence. The paragraph was sent back for revision.\n\nThe rest proved harder. The governors agreed to end their subordination to the capital provided their own powers remained intact. They collected payments, ran the depots and could name the people who would carry out tomorrow's orders. The district representatives replied that the population had long paid for these institutions while having little say in their decisions. They would not sign the declaration merely as invited witnesses.\n\nRom knew most of those present through his work. One needed hurrying along, another needed reminding about expenses, and a third could be approached in advance. Previously he had settled their disputes within the bounds of his authority. Now each wanted to know where that authority would come from after independence.\n\nThe secretary prepared space for the signatures. Their order was once again for Rom to decide. If the governors signed first, the new government would draw support from the existing administration. If the districts signed first, they would have to receive more weight in joint decisions. Rom could choose his allies for this meeting; the others' agreement would still have to be won."
 ADISCORD_nam_groups.12.d_successor: "Vorkerland has fallen apart, and the telegraph no longer brings orders from the capital. In the chancery hall the head of government reads the declaration of independence before governors, commandants and district representatives. The text is ready; the signatures are not, because each side wants its own signature to come first.\n\nThe governors recall that it was the ladder of seals that kept the oilfields from collapse. The districts reply that without their consent the declaration will remain one more paper nobody carries out. The first signature will decide nothing for ever, but it will show on whom the new state means to rest."
 ADISCORD_nam_groups.12.a: "The governors sign first."
 ADISCORD_nam_groups.12.b: "The districts sign first."
 NAM_declaration_vertical_tt: "Governor support: §G+5§! £NAM_support_nam_texticon."
 NAM_declaration_districts_tt: "District support: §G+5§! £NAM_support_dist_texticon."
