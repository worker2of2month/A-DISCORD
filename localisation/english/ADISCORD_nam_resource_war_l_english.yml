 # Ladder of seals: endings
 NAM_spirit_iron_ladder: "Reliance on the Namestniks"
 NAM_spirit_iron_ladder_desc: "Every rung of the ladder is fixed by law and by a garrison. An order travels from the chancery to the last post without dispute - and without room for error."
 NAM_spirit_service_republic: "Accountable Government"
 NAM_spirit_service_republic_desc: "An office in Svetlogorye is a duty, not a possession. Officials answer for the result, not for the seal beneath it."
 NAM_spirit_federation: "Federal Compact"
 NAM_spirit_federation_desc: "The districts manage their own affairs and the common council the common ones. Government is slower, but its decisions are carried out without coercion."
 NAM_spirit_oil_union: "Public Oilfields"
 NAM_spirit_oil_union_desc: "Oilfields and districts are bound by a common agreement: every barrel is counted, every share is paid, and the oil works for the whole country."
