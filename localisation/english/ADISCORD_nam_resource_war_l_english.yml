 NAM_hold_field_689: "Hold the South Coast"
 NAM_hold_field_689_desc: "South Coast commanders are checking the lines between the oilfields and coastal roads. Every approach on the map must have an officer responsible for its defence."
 NAM_hold_field_690: "Hold Sukhorechye"
 NAM_hold_field_690_desc: "Sukhorechye connects the oilfields to the roads leading to the harbour. Local headquarters are preparing the defence of settlements, pumping stations and supply routes."
 NAM_hold_field_discipline_tt: "Seal discipline: §G+10§!."
 NAM_hold_field_lost_tt: "The field is lost: the order closes without a reward."

 # Restitution events
 ADISCORD_nam_resource_war.20.t: "Notes of Restitution"
 ADISCORD_nam_resource_war.20.d: "Rom instructed that Eflor's and Azhar's envoys be received separately. The notes they delivered were almost identical: return the northern fields and roads annexed under Vorkerland's administration. Copies of decrees accompanied the demands. The envoys insisted on describing the proposed transfer as the restoration of lawful rights.\n\nAfter they left, Mezentsev laid out the attachments to both notes. To answer them they needed to establish which areas each side claimed, where it drew the boundary and whose rights it invoked. He proposed discussing these questions one at a time. While the neighbours answered enquiries and compared claims, Svetlogorye could gain time to prepare.\n\nRom read one decree in full. His work had taught him what expropriation documents looked like: who received the land, who was entitled to compensation and which objections were left unheard. A Vorkerland decree did not by itself make what had happened just. But the people now living at the fields had not made those decisions, and it was their jobs and homes that might be lost.\n\nA garrison officer asked whether the correspondence meant they were ready to retreat. Rom did not answer immediately. Rejecting the demands would be easy; afterwards the question of defending the border would return to him. He asked Mezentsev to leave the notes and prepare a separate list of matters still open to discussion. The government had yet to decide whether to begin negotiations."
 ADISCORD_nam_resource_war.20.d_successor: "Eflor's and Azhar's envoys have demanded the return of the northern fields and adjoining roads. The notes include Vorkerland decrees assigning these lands to the governorate and lists of the deposits. The neighbours consider this the restoration of their rights.\n\nMezentsev proposes asking for the boundaries of each claim and discussing the disputed areas separately. Correspondence will clarify their positions and buy time to prepare. Garrison officers fear that opening talks will be treated as consent to concessions, and propose refusal. The government must choose its reply."
 ADISCORD_nam_resource_war.20.a: "Answer note with note."
 ADISCORD_nam_resource_war.20.b: "Reject the claims publicly."
 ADISCORD_nam_resource_war.21.t: "The Joint Ultimatum"
 ADISCORD_nam_resource_war.21.d: "The military attaches brought a joint ultimatum. This time it included a deadline. Asked to explain the disputed points, one visitor replied that the governments of Eflor and Azhar already knew everything they needed to. Rom had them escorted to the waiting room and returned to his own officials.\n\nMezentsev outlined the Klyuchevsk protocol: East Sukhorechye would pass to Azhar, and Svetlogorye would pay a year's tribute in fuel. This would postpone the war, but the concession would have to be explained to the people of the ceded district. There had also been a separate discussion with Azhar's staff: in exchange for fuel it would hold its troops back for two and a half months. Azhar would not leave its alliance with Eflor.\n\nRom asked who guaranteed compliance. Mezentsev listed the known commitments and stopped. Everything he had left unsaid was clear: a delay would buy time but would not prevent another demand. Rom remembered how many of Vorkerland's emergency measures had been introduced pending a further decision and then left in place for years.\n\nThe officers proposed refusal. Some thought they should attack at once, before the neighbours finished deploying. Such an order would let the army act first and make Svetlogorye responsible for starting the war. Rom asked them to check again which units were actually ready. He did not want to hear, after the first losses, that they had meant readiness on paper.\n\nThe attaches waited outside. The government could accept the territorial concession and tribute, buy a separate delay from Azhar, reject the demands or start the war itself. Rom put away the draft of another request for clarification. Nobody intended to answer it."
 ADISCORD_nam_resource_war.21.d_successor: "This time the visitors are military attaches, not couriers. Eflor and Azhar demand the return of the northern fields and recognition of their right to restitution of all Vorkerland oil property. The deadline is given in days, not weeks.\n\nThe government has four answers. The Klyuchevsk protocol would give East Sukhorechye to Azhar and bind Svetlogorye to a year of fuel tribute, but it would delay the war. The Azhar staff will settle for less: for tank cars of fuel it will hold its troops back for two and a half months, though it will not leave the alliance with Eflor. It can refuse and rely on the army. Or it can strike first, before the neighbours finish deploying, and become the aggressor in the eyes of the whole South."
 ADISCORD_nam_resource_war.21.a: "Reject the ultimatum."
 ADISCORD_nam_resource_war.21.b: "Sign the Klyuchevsk protocol."
 ADISCORD_nam_resource_war.21.c: "Buy time from Azhar."
 ADISCORD_nam_resource_war.21.e: "Strike first."
 NAM_rw_21_b_tt:0 "§YEast Sukhorechye§! passes to Azhar; Svetlogorye keeps its claim.\nA §Y365§! £time_texticon tribute begins: §Y1500§! £fuel_texticon monthly to both Eflor and Azhar.\nThe current resource-war deadline gains §G365§! £time_texticon. The protocol can be signed once."
 NAM_rw_21_c_tt:0 "Azhar receives §Y12000§! £fuel_texticon. The current war deadline gains §G75§! £time_texticon.\nThis payment and the early focus agreement share one delay. Azhar remains in the coalition."
 NAM_rw_21_e_tt: "War begins within §Y7 days§!, and Svetlogorye declares it.\nInstead of the Oilfield Defence Corps, the army receives the §YFirst Strike Corps§!, half as strong.\nWar support of Eflor and Azhar: §R+10%§!."

 # Seal discipline events
 ADISCORD_nam_resource_war.30.t: "The Seals Waver"
 ADISCORD_nam_resource_war.30.d: "The districts send reports the staff would rather not read. Governors delay replacements, citing a lack of men; some garrisons fall back without orders, and in the rear people say the ladder holds only through fear of the next step.\n\nThe officers ask for money for front-line bonuses. The commandants propose field tribunals. Or the government can wait and hope next week goes better."
 ADISCORD_nam_resource_war.30.a: "Hold on with what we have."
 ADISCORD_nam_resource_war.30.b: "Pay front-line bonuses."
 ADISCORD_nam_resource_war.30.c: "Introduce field tribunals."
 NAM_seal_30_b_tt: "Treasury: §R-150§! £ADISCORD_economy_treasury_texticon.\nSeal discipline: §G+15§!."
 NAM_seal_30_c_tt: "Seal discipline: §G+12§!.\nGroup support:\n  Garrisons: §G+5§! £NAM_support_garr_texticon\n  Districts: §R-5§! £NAM_support_dist_texticon"
 ADISCORD_nam_resource_war.31.t: "The Ladder Cracks"
 ADISCORD_nam_resource_war.31.d: "Two districts have stopped answering the staff's telegrams. In a third, the governor negotiates with the enemy in his own name, and deserters gather at the stations because nobody dares to arrest them.\n\nKirill Mezentsev proposes opening the oil reserve and paying those still holding the front in fuel. The commandants demand a state of emergency in every district. Rom understands that one more defeat and the ladder will fall apart."
 ADISCORD_nam_resource_war.31.a: "Wait for the turn."
 ADISCORD_nam_resource_war.31.b: "Open the oil reserve."
 ADISCORD_nam_resource_war.31.c: "Declare a state of emergency."
 NAM_seal_31_b_tt: "Seal discipline: §G+20§!."
 NAM_seal_31_c_tt: "Seal discipline: §G+15§!.\nGroup support:\n  Districts: §R-10§! £NAM_support_dist_texticon"
 ADISCORD_nam_resource_war.32.t: "The Night of Seals"
 ADISCORD_nam_resource_war.32.d: "During the night the seals were brought to the chancellery. Not one or two: the governors of three districts, garrison commandants and the heads of field offices surrendered the signs of their authority and left without waiting for orders. By morning the corridors held people who had no intention of surrendering anything.\n\nThe vertical gathers power back by force. Those who still hold seals demand one chief and one order. Among them is already a man who believes that chief should not be Egor Rom."
 ADISCORD_nam_resource_war.32.a: "Gather the seals again."
 NAM_seal_32_a_tt: "The ladder of seals shifts §Y0.20§! towards the vertical.\nSeal discipline recovers to §Y30§!.\nWithin §Y60 days§!, a rival of Rom may demand the leadership of the country."

 ADISCORD_nam_resource_war.2.t: "The Svetlogorsk Uprising"
 ADISCORD_nam_resource_war.2.d: "With Svetlogorye's main forces tied down along its external borders, Yaroslav Weber has brought the underground out of hiding. Deserters, underground activists and opponents of the old colonial administration have seized a compact foothold within the northern resource belt. The Provisional Insurgent Headquarters under Weber has denounced Svetlogorye as a continuation of Vorkerland's system of governors and opened an internal front."
 ADISCORD_nam_resource_war.2.a: "Another front, but no reason to surrender."
 ADISCORD_nam_resource_war.3.t: "The Svetlogorye Contracts"
 ADISCORD_nam_resource_war.3.d: "War has broken out around Svetlogorye's resource basin. For Kefreite, the crisis is more than another border conflict: it has opened a new set of military, supply and political contracts. The resource-war focus branch has now been revealed. Its first focus still follows the normal prerequisite chain."
 ADISCORD_nam_resource_war.3.a: "Open the contract files."
 ADISCORD_nam_resource_news.1.t: "Eflor and Azhar Invade Svetlogorye"
 ADISCORD_nam_resource_news.1.d: "The armies of Eflor and Azhar crossed into Svetlogorye within hours of the talks collapsing. The trigger was the Svetlogorye government's refusal to accept an ultimatum over the northern oilfields and the infrastructure around them. Both states regard these lands as their own: they were handed to Svetlogorye under the Vorkerland administration.\n\nRakhma and Mazar are not officially at war, but have allowed volunteers to enlist in exchange for future fuel contracts. Svetlogorye must now defend on two fronts at once while covering its oilfields and transport hubs."
 ADISCORD_nam_resource_news.1.d_strike: "Svetlogorye has struck first. With talks over the northern oilfields deadlocked, Egor Rom's army crossed into Eflor before the neighbours could finish deploying. Eflor has called the attack proof that the governors' ladder understands only force and summoned its allies to arms.\n\nRakhma and Mazar are not officially at war, but have allowed volunteers to enlist in exchange for future fuel contracts. Surprise has bought Svetlogorye time, but its army has left its prepared positions, and the neighbours have gained the pretext they lacked."
 ADISCORD_nam_resource_news.1.a: "The war for the oilfields has begun."
 ADISCORD_nam_resource_news.2.t: "Svetlogorye Partitioned Between Eflor and Azhar"
 ADISCORD_nam_resource_news.2.d: "Organised resistance in Svetlogorye has ended. Eflor has taken the Northern Oilfields, the western terminals and Svetlogorsk; Azhar holds the maritime districts of the Black Basin and the southern port. The Provisional Insurgent Headquarters has been dissolved, and Svetlogorye's former administration no longer exists as an independent government.\n\nThe allies have declared their war aims achieved and begun marking out the new border. Along with the land they have inherited wrecked oilfields, damaged roads and a population that lived under someone else's rule for several generations."
 ADISCORD_nam_resource_news.2.a: "Svetlogorye has been partitioned."
 ADISCORD_nam_resource_news.2.t_exile: "Svetlogorye's Government Flees to the Islands"
 ADISCORD_nam_resource_news.2.d_exile: "Mainland Svetlogorye has fallen. Eflor has taken the Northern Deposits and Svetlogorsk, Azhar the southern fields and the South Harbour. The Provisional Insurgent Headquarters has been dissolved, and the victors are already drawing a new border across the former oilfields.\n\nEgor Rom's government did not sign its own end. The last steamers carried the chancellery, the archive of seals and the remnants of the army to the overseas islands, and the new capital across the strait has declared that Svetlogorye lives on. Its authorities promise to return to the mainland, but for now they have only shipyards, fishing ports and people who remember where they were driven from."
 ADISCORD_nam_resource_news.2.a_exile: "The islands are not the end."
 ADISCORD_nam_resource_news.3.t: "Svetlogorye Wins Recognition of Its Independence"
 ADISCORD_nam_resource_news.3.d: "Svetlogorye has held the Northern Oilfields and forced Eflor and Azhar to sign a peace. The treaty recognises Svetlogorye as an independent state and hands it the border districts of the defeated: Eflor cedes the Moren district, the Loren borderland and the city of Middle Loren, Azhar its seaboard. The defeated leave the war with a ruined economy and a disgraced army. The question of the Black Basin remains open, but the fighting has stopped.\n\nThe Svetlogorsk insurgent formations have been disarmed. Eflor and Azhar remain allies, so the border dispute could flare up again."
 ADISCORD_nam_resource_news.3.t_standoff: "The War for Svetlogorsk Oil Ends in a Standoff"
 ADISCORD_nam_resource_news.3.d_standoff: "The diplomatic limit of the war for the oilfields has expired. The armies of Eflor and Azhar never broke the defence of the oil basin, but Svetlogorye never carried the war onto its neighbours' land either. The mediators fixed the line where it ran before the first shots: no border changes, nobody pays reparations and nobody signs a recognition treaty.\n\nSvetlogorye keeps its independence and its fields, and the Svetlogorsk insurgent formations have been disarmed. Eflor and Azhar call the standoff a respite; Svetlogorsk calls it a victory that still has to be secured. The neighbours' alliance remains, and the dispute over the basin stays open."
 ADISCORD_nam_resource_news.3.a: "Svetlogorye has kept its independence."
 ADISCORD_nam_resource_news.5.t: "Uprising Breaks Out in Svetlogorsk"
 ADISCORD_nam_resource_news.5.d: "While Svetlogorye's main forces fight Eflor and Azhar, an uprising has broken out behind the lines. Yaroslav Weber, who spent years building the underground of the northern resource belt, has brought it into the streets: opponents of the governor system have seized the Svetlogorsk District and announced a Provisional Insurgent Headquarters. They have been joined by some of the garrisons, deserters and underground groups.\n\nThe insurgents claim neither all of Svetlogorye nor a new state of their own. Weber demands the abolition of the governors' administration left over from Vorkerland. The government must now hold the oilfields, stop the foreign offensive and retake the capital district at the same time."
 ADISCORD_nam_resource_news.5.a: "Svetlogorye now has a third front."
 ADISCORD_nam_resource_news.6.t: "The Svetlogorsk Uprising Is Crushed"
 ADISCORD_nam_resource_news.6.d: "Svetlogorye's government troops have retaken the Svetlogorsk District. The Provisional Insurgent Headquarters has been dissolved, and the surviving bands have been disarmed or scattered. Yaroslav Weber left the city with his last couriers: his underground is broken, but not betrayed.\n\nThe war with Eflor and Azhar goes on, but Svetlogorye can now move its reserves to the external front. Supporters of the governors call the suppression of the uprising the new authorities' first major victory since the fall of Vorkerland."
 ADISCORD_nam_resource_news.6.a: "The uprising has been crushed."
 ADISCORD_nam_resource_news.7.t: "Svetlogorye Signs a Compromise Peace"
 ADISCORD_nam_resource_news.7.d: "The war for the oilfields has ended without a capitulation. The diplomatic deadline expired, and the mediators reduced the outcome to a simple count: which fields remained with Svetlogorye and which were already held by the coalition's armies. The occupied fields pass to Eflor and Azhar; the Svetlogorsk District, if the government failed to hold it, goes to Eflor, and its new masters dissolve the Provisional Insurgent Headquarters.\n\nSvetlogorye keeps its remaining fields, the South Harbour and its overseas districts, but must deliver fuel to both neighbours for a year. The governors call the treaty a respite, the districts the price of survival, and in Eflor and Azhar they say the dispute over the basin has only been postponed."
 ADISCORD_nam_resource_news.7.a: "Svetlogorye survives, but will pay for it."

 ADISCORD_nam_debug_start_resource_war:0 "§RDEBUG:§! Start the resource war"
