 NAM_wrk_emergency_echelon: "An Echelon for the Centre"
 NAM_wrk_emergency_echelon_desc: "§YCOST§!: §Y25§! £political_power_texticon §Y3000§! £fuel_texticon\n§YCOMPLETION§!: §Y21§! £time_texticon days\n§YLIMIT§!: §Y3§! echelons, §Y[?NAM_wrk_echelons_delivered|0]§! sent.\n\n§YRESULT§!\nThe metropole receives §Y3000§! £fuel_texticon; its depots send back §G6000§! £infantry_equipment_texticon and §G60§! units of support equipment.\nSupport: namestniks §G+2§! £NAM_support_nam_texticon.\n\n§YIF INTERRUPTED§!\nIf the metropole vanishes before the train leaves, the fuel returns. Political power is not refunded."
