 NAM_bw_overview_help:0 "Click a district number for its status and actions below the map. Hover for its full report. Selecting a district neither starts work nor spends resources.\n\n§YOILFIELD PROJECTS§!\nIn progress: §Y[?NAM_projects_in_progress|0] / [?NAM_project_slots|0]§! £under_construction_texticon\nFocuses unlock programmes; paid orders deliver supplies and working institutions.\n\n§YEXPORTS AND PREPARATION§!\nDelivery capacity, customers and island agreements appear in the export summary below the map.\nThe war deadline is shown under Preparing for the Resource War; prepared formations under Mobilisation of Svetlogorye.\n\n§YRESOURCE WAR OUTCOME§!\nDiplomatic deadline: §Y420§! £time_texticon days.\n- At least §Y100§! oil points - independence. A captured enemy border district grants recognition with a new border; otherwise the old border remains.\n- §Y36-99§! - a compromise peace.\n- Below §R36§! - partition.\nEnemy capitulation ends the war earlier."
