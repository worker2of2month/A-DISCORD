 SLF: "Svetlogorsk Uprising"
 SLF_DEF: "the Svetlogorsk Uprising"
 SLF_ADJ: "Svetlogorsk"
 SLF_humanism: "Svetlogorsk Uprising"
 SLF_humanism_DEF: "the Svetlogorsk Uprising"
 SLF_humanism_party: "Provisional Insurgent Headquarters"
 SLF_Yaroslav_Veter: "Yaroslav Veter"
 ADISCORD_coastal_patrol_vessel: "Coastal Patrol Vessel"
 ADISCORD_coastal_patrol_ship: "Coastal Patrol Vessels"
 ADISCORD_coastal_patrol_ship_desc: "Simple small warships for convoy escort, reconnaissance and control of local straits."
 ADISCORD_coastal_patrol_ship_1: "Resource War Patrol Vessel"
 ADISCORD_coastal_patrol_ship_1_short: "Patrol Vessel"
 ADISCORD_coastal_patrol_ship_1_desc: "A dependable coastal vessel with light guns, torpedoes and minimal anti-aircraft armament."
 modifier_experience_gain_ADISCORD_coastal_patrol_vessel_training_factor: "Coastal Patrol Vessel Training Experience Gain"
 modifier_experience_gain_ADISCORD_coastal_patrol_vessel_mission_factor: "Coastal Patrol Vessel Mission Experience Gain"
 modifier_experience_gain_ADISCORD_coastal_patrol_vessel_combat_factor: "Coastal Patrol Vessel Combat Experience Gain"
 ADISCORD_nam_extraction_defence_corps: "Oilfield Defence Corps"
 ADISCORD_nam_extraction_defence_corps_desc: "Svetlogorye has dispersed its reserves in advance, stationed engineers on the approaches to the oilfields and reorganised its garrisons into a proper field army. It has fewer potential allies than the coalition, but has no intention of surrendering the fields to a swift offensive."
 ADISCORD_nam_restitution_coalition: "Territorial Restitution Coalition"
 ADISCORD_nam_restitution_coalition_desc: "Eflor and Azhar have established a permanent military and political alliance to recover the territories and resource infrastructure seized by Vorkerland and inherited by Svetlogorye. Their joint headquarters coordinates a single war and will remain the foundation of their security afterwards."
 ADISCORD_nam_insurgent_columns: "Insurgent Columns"
 ADISCORD_nam_insurgent_columns_desc: "Deserters, underground activists and local militia from the northern resource belt have formed independent columns. They can hold a short internal front on modest supplies, but lack the heavy forces of a regular army."
 ADISCORD_nam_profitable_volunteer_contracts: "Resource Assistance Contracts"
 ADISCORD_nam_profitable_volunteer_contracts_desc: "Participation in the war will pay off only if access to fuel and transport is agreed in advance. The governments are sending limited volunteer forces without assuming the obligations of the entire coalition."
 ADISCORD_nam_treaty_independence: "Charter of Recognised Independence"
 ADISCORD_nam_treaty_independence_desc: "Eflor and Azhar have formally renounced the right to determine Svetlogorye's future by force. The charter's border annexes establish a new frontier, while the neighbours' signatures turn a de facto break with Vorkerland into recognised independence."
 ADISCORD_nam_prewar_defence_category: "Svetlogorye's Prewar Defences"
 ADISCORD_nam_prewar_defence_category_desc: "After Vorkerland's collapse, demands from the neighbours are only a matter of time. While the borders remain formally peaceful, the administration can prepare field positions along two likely axes of attack."
 ADISCORD_nam_fortify_extraction_line: "Fortify the Oilfield Line"
 ADISCORD_nam_fortify_extraction_line_desc: "Engineer companies will prepare strongpoints on the western roads and fortify the junction shielding the central oilfields from simultaneous pressure by Eflor and Azhar. Work will take §Y35 days§!."
 ADISCORD_nam_fortify_azhar_approaches: "Secure the Azhar Approaches"
 ADISCORD_nam_fortify_azhar_approaches_desc: "Field fortifications will block the eastern passages into the resource basin and the approaches to the South Coast District. Work will take §Y35 days§!."
 ADISCORD_nam_resource_war.2.t: "The Svetlogorsk Uprising"
 ADISCORD_nam_resource_war.2.d: "With Svetlogorye's main forces tied down along its external borders, deserters, underground activists and opponents of the old colonial administration have seized a compact foothold within the northern resource belt. The Provisional Insurgent Headquarters has denounced Svetlogorye as a continuation of Vorkerland's system of governors and opened an internal front."
 ADISCORD_nam_resource_war.2.a: "Another front, but no reason to surrender."
 ADISCORD_nam_resource_war.3.t: "The Svetlogorye Contracts"
 ADISCORD_nam_resource_war.3.d: "War has broken out around Svetlogorye's resource basin. For Kefreite, the crisis is more than another border conflict: it has opened a new set of military, supply and political contracts. The resource-war focus branch has now been revealed. Its first focus still follows the normal prerequisite chain."
 ADISCORD_nam_resource_war.3.a: "Open the contract files."
 ADISCORD_nam_resource_news.1.t: "Eflor and Azhar Invade Svetlogorye"
 ADISCORD_nam_resource_news.1.d: "The armies of Eflor and Azhar crossed into Svetlogorye within hours of the talks collapsing. The trigger was the Svetlogorye government's refusal to accept an ultimatum over the northern oilfields and the infrastructure around them. Both states regard these lands as their own: they were handed to Svetlogorye under the Vorkerland administration.\n\nRakhma and Mazar are not officially at war, but have allowed volunteers to enlist in exchange for future fuel contracts. Svetlogorye must now defend on two fronts at once while covering its oilfields and transport hubs."
 ADISCORD_nam_resource_news.1.a: "The war for the oilfields has begun."
 ADISCORD_nam_resource_news.2.t: "Svetlogorye Partitioned Between Eflor and Azhar"
 ADISCORD_nam_resource_news.2.d: "Organised resistance in Svetlogorye has ended. Eflor has taken the Northern Oilfields, the western terminals and Svetlogorsk; Azhar holds the maritime districts of the Black Basin and the southern port. The Provisional Insurgent Headquarters has been dissolved, and Svetlogorye's former administration no longer exists as an independent government.\n\nThe allies have declared their war aims achieved and begun marking out the new border. Along with the land they have inherited wrecked oilfields, damaged roads and a population that lived under someone else's rule for several generations."
 ADISCORD_nam_resource_news.2.a: "Svetlogorye has been partitioned."
 ADISCORD_nam_resource_news.3.t: "Svetlogorye Wins Recognition of Its Independence"
 ADISCORD_nam_resource_news.3.d: "Svetlogorye has held the Northern Oilfields and forced Eflor and Azhar to sign a peace. The treaty recognises Svetlogorye as an independent state, while a small strip of border territory passes to its neighbours. The question of the Black Basin remains open, but the fighting has stopped.\n\nThe Svetlogorsk insurgent formations have been disarmed. Eflor and Azhar remain allies, so the border dispute could flare up again."
 ADISCORD_nam_resource_news.3.a: "Svetlogorye has kept its independence."
 ADISCORD_nam_resource_news.5.t: "Uprising Breaks Out in Svetlogorsk"
 ADISCORD_nam_resource_news.5.d: "While Svetlogorye's main forces fight Eflor and Azhar, an uprising has broken out behind the lines. Opponents of the governor system have seized the Svetlogorsk District and announced a Provisional Insurgent Headquarters. They have been joined by some of the garrisons, deserters and underground groups.\n\nThe insurgents claim neither all of Svetlogorye nor a new state of their own. Their demand is the abolition of the governors' administration left over from Vorkerland. The government must now hold the oilfields, stop the foreign offensive and retake the capital district at the same time."
 ADISCORD_nam_resource_news.5.a: "Svetlogorye now has a third front."
 ADISCORD_nam_resource_news.6.t: "The Svetlogorsk Uprising Is Crushed"
 ADISCORD_nam_resource_news.6.d: "Svetlogorye's government troops have retaken the Svetlogorsk District. The Provisional Insurgent Headquarters has been dissolved, and the surviving bands have been disarmed or scattered.\n\nThe war with Eflor and Azhar goes on, but Svetlogorye can now move its reserves to the external front. Supporters of the governors call the suppression of the uprising the new authorities' first major victory since the fall of Vorkerland."
 ADISCORD_nam_resource_news.6.a: "The uprising has been crushed."
 ADISCORD_nam_resource_news.7.t: "Svetlogorye Accepts a Peaceful Partition"
 ADISCORD_nam_resource_news.7.d: "Svetlogorye has agreed to partition its territory following talks with Eflor and Azhar. Eflor receives the Northern Oilfields, the western terminals and Svetlogorsk District; Azhar receives the maritime districts of the Black Basin and the southern coast.\n\nGarrisons have been ordered not to obstruct the handover. Officials may stay on under the new authorities or leave. Once the transfer is complete, the central government of Svetlogorye will be dissolved."
 ADISCORD_nam_resource_news.7.a: "Svetlogorye yields without a fight."

 ADISCORD_nam_debug_start_resource_war: "§RDEBUG:§! Start the Svetlogorye Resource War"
 ADISCORD_nam_debug_start_resource_war_desc: "Releases Svetlogorye from its old alliance ties, creates the permanent Eflor-Azhar alliance and launches their joint war against Svetlogorye."
 ADISCORD_nam_debug_resolve_coalition_victory: "§RDEBUG:§! Divide Svetlogorye among the Victors"
 ADISCORD_nam_debug_resolve_coalition_victory_desc: "Divides all of Svetlogorye between Eflor and Azhar, eliminates the Svetlogorye Uprising and preserves the victors' alliance."
 ADISCORD_nam_debug_resolve_nam_victory: "§RDEBUG:§! Confirm Svetlogorye's Victory"
 ADISCORD_nam_debug_resolve_nam_victory_desc: "Ends the war with recognition of Svetlogorye, a limited transfer of a border state and elimination of the surviving rebel army; the neighbouring states' alliance remains."

 # National focus campaign
 NAM_inventory: "Inventory of a Vanishing Empire"
 NAM_inventory_desc: "Egor Rom's shelves still hold contradictory orders from the capital. Before choosing a future, we must discover which stores, people and powers actually belong to Svetlogorye."
 NAM_open_ledgers: "The Price of Every Seal"
 NAM_open_ledgers_desc: "The governors count everyone else's expenses. Kirill Vykup will open their own accounts and expose offices that exist only on paper."
 NAM_vertical: "Rom's Single Signature"
 NAM_vertical_desc: "The hierarchy remains, but orders will no longer stall between offices. Governors receive common collection targets and answer personally to Rom. Executing orders efficiently does not reconcile their opponents."
 NAM_districts: "The Districts Sign Back"
 NAM_districts_desc: "District representatives must sign more than receipts for orders. Rom retains the government while councils gain scrutiny of levies and spending. Collection becomes less convenient, but government gains partners."
 NAM_inspectors: "Inspectors Put Their Names Down"
 NAM_inspectors_desc: "Inspectors must sign their findings in person. Comparing depot ledgers with actual crates will return missing weapons to the garrisons."
 NAM_public_payroll: "The Payroll in the Square"
 NAM_public_payroll_desc: "A public payroll distinguishes real service from inherited privilege. The first open accounts will not end poverty, but they can disarm the underground's strongest accusation."
 NAM_emergency_writ: "An Emergency Writ"
 NAM_emergency_writ_desc: "War must not find the governors arguing about permission to open an arsenal. Establish a priced emergency release and a separate operation against insurgent depots."
 NAM_district_guarantees: "Guarantees for Svetlogorsk"
 NAM_district_guarantees_desc: "The city that supplies the country wants a say in its earnings. Prepare a funded civic compact. It must function for sixty days before hostilities: a last-minute signature is not trust."
 NAM_one_budget: "A Budget with No Hidden Drawer"
 NAM_one_budget_desc: "Public accounts and central inspection disagree on politics, but both have found money that never reached the treasury. Return it to the budget."
 NAM_well_register: "Every Well Has an Address"
 NAM_well_register_desc: "An extraction report is no substitute for a working tanker. Match wells to access roads and recover fuel stranded between ministries."
 NAM_export_quays: "Oil Pays for the State"
 NAM_export_quays_desc: "Port offices may sell cargoes from the actual fuel reserve. Each sale funds the treasury and leaves less fuel for our own forces."
 NAM_domestic_refining: "Oil Stays at Home"
 NAM_domestic_refining_desc: "A well's value does not end at an export quay. Fuel for workshops and transport can become domestic equipment instead of another cargo sold abroad."
 NAM_insured_cargoes: "A Return Cargo on Every Voyage"
 NAM_insured_cargoes_desc: "Export voyages should return with containers and spare parts. Combine scattered shipping into a serviceable trade line."
 NAM_machine_shops: "Spare Parts for the Oilfields"
 NAM_machine_shops_desc: "A workshop that repairs pumps can do more than its budget admits. A common order equips engineers with tools and prepares military production."
 NAM_civilian_combine: "A Town Around the Wells"
 NAM_civilian_combine_desc: "Maintaining the wells should sustain a permanent town. A repair complex in the Northern Fields will reduce dependence on visiting contractors."
 NAM_technical_college: "Engineers Above Instructions"
 NAM_technical_college_desc: "A successful repair must not become a disciplinary case for ignoring a manual. Unite the oilfield laboratories in a technical institute with its own research budget."
 NAM_count_garrisons: "Garrisons on Paper and on the Road"
 NAM_count_garrisons_desc: "Every office has a regiment on the map; on the road it may have a single sentry. Reconcile personnel and stores before choosing between fixed positions and a mobile reserve."
 NAM_field_guards: "An Army of Strongpoints"
 NAM_field_guards_desc: "Oilfields cannot retreat. Train units to hold prepared nodes and conserve supplies, accepting slower movement as the price of endurance."
 NAM_mobile_columns: "An Army of Crossroads"
 NAM_mobile_columns_desc: "Not every position can be held, but a lost road can be retaken. Mobile columns assemble quickly at the cost of heavier supply demand."
 NAM_engineer_depots: "Tools Before Rifles"
 NAM_engineer_depots_desc: "Engineers should not have to find tools after reaching their positions. Reserve equipment for engineer companies and garrison training."
 NAM_motor_pool: "A Common Motor Pool"
 NAM_motor_pool_desc: "An official's staff car is less important than field supply. Pool the administrations' vehicles in a reserve the army can actually use."
 NAM_quartermaster: "Every Depot Knows Its Front"
 NAM_quartermaster_desc: "Paying for supply must release weapons, not generate another request. Make the first delivery from audited reserves; subsequent batches for the standing army and reserve will be available through paid orders."
 NAM_port_arsenal: "The South Coast Arsenal"
 NAM_port_arsenal_desc: "The port must receive raw materials and make weapons even when land routes are cut. Build an arsenal beside the working quays."
 NAM_harbour_service: "The Port Never Closes"
 NAM_harbour_service_desc: "Office hours must not halt loading. A port service will coordinate dockers, pilots and suppliers into one working chain."
 NAM_repair_yard: "Our Own Repair Quay"
 NAM_repair_yard_desc: "A damaged vessel should not disappear into a foreign port indefinitely. Give the South Coast workshops a yard for repairs and construction."
 NAM_escort_school: "Escort to the Last Buoy"
 NAM_escort_school_desc: "The fleet's first job is to bring merchant ships home. An escort school teaches crews to detect danger before the engagement begins."
 NAM_island_accounts: "The Overseas Districts Keep Accounts"
 NAM_island_accounts_desc: "The overseas holdings remain a disputed imperial inheritance. Civil accounts and port services can provide administration without pretending a decree makes colonies a homeland."
 NAM_alarm: "No Longer a Border Dispute"
 NAM_alarm_desc: "The coalition wants the oilfields. Hold the Northern Fields until day 420 of the war, or force both opponents to capitulate. Peacetime plans must not delay the emergency staff."
 NAM_hold_basin: "The Oilfields Have No Rear"
 NAM_hold_basin_desc: "The Northern Fields decide this war. Issue tools and artillery to their defenders and adopt temporary entrenchment instructions."
 NAM_relief_columns: "The Road Still Open"
 NAM_relief_columns_desc: "Supply must move to today's threatened sector. Allocate transport and permit the use of our own fuel for emergency equipment batches."
 NAM_counterstroke: "Retake the Junctions"
 NAM_counterstroke_desc: "A counterstroke should reopen supply roads. A temporary planning group will coordinate limited attacks with the means to hold recovered junctions."
 NAM_recognition: "Independence in Ink"
 NAM_recognition_desc: "The neighbours have recognised Svetlogorye. Its people can now debate their state without waiting for an absent capital. Civilian reconstruction does not depend on completing wartime focuses."
 NAM_service_state: "A State of Accountable Service"
 NAM_service_state_desc: "Emergency command bought time. A permanent state must define what it expects of its officials. Rom retains authority, while responsibility reaches his own office."
 NAM_federal_charter: "The District Charter"
 NAM_federal_charter_desc: "Wartime concessions become lasting rules. Districts retain scrutiny and a share in budgeting, while the central government retains the army and foreign representation."
 NAM_law_after_war: "Rules Beyond the Emergency"
 NAM_law_after_war_desc: "Victors can keep emergency rule forever. Establish permanent terms and appeals consistent with the country's chosen institutions."
 NAM_civil_repair: "Rebuild What We Defended"
 NAM_civil_repair_desc: "A victory speech cannot restart extraction. Build a civilian enterprise on the South Coast and put repair crews back to work."
 NAM_civil_dividend: "Civilian Dividend"
 NAM_civil_dividend_desc: "Victory revenues fund civilian construction, giving weapons production lower priority."
 NAM_armed_peace: "Standing Defence Order"
 NAM_armed_peace_desc: "Army readiness is paid for by slower civilian construction."
 NAM_national_university: "A Country of Its Own Specialists"
 NAM_national_university_desc: "An oil state remains vulnerable while outsiders solve its difficult problems. Expand the technical institute into a university with another independent research budget."
 NAM_svetlogorye: "Svetlogorye Answers for Itself"
 NAM_svetlogorye_desc: "This country once occupied a line in someone else's report. It now has recognised borders, its own specialists and institutions its government must answer for. Its future will no longer arrive as a letter from elsewhere."
 NAM_directorate: "United Directorate"
 NAM_directorate_desc: "A single signature accelerates orders and collection. Researchers still have to justify every departure from the manual."
 NAM_councils: "Consent of the Districts"
 NAM_councils_desc: "District scrutiny makes administration easier, but consent cannot reproduce the old coercive levies."
 NAM_service_republic: "Republic of Public Service"
 NAM_service_republic_desc: "Permanent authority carries personal responsibility. Industrial orders remain the foundation of the state."
 NAM_charter_republic: "Republic of the District Charter"
 NAM_charter_republic_desc: "Common institutions operate under the district charter. Open accounts and professional initiative are ordinary government."
 NAM_export_offices: "Oil Export Offices"
 NAM_export_offices_desc: "Export offices earn income from transport. Extra sales consume actual fuel through a national decision."
 NAM_refining_network: "Domestic Refining Network"
 NAM_refining_network_desc: "Refining supplies local workshops. Extra equipment batches consume the country's own fuel."
 NAM_static_doctrine: "Oilfield Strongpoint Doctrine"
 NAM_static_doctrine_desc: "Prepared positions conserve supplies at the cost of movement speed."
 NAM_mobile_doctrine: "Crossroads Columns"
 NAM_mobile_doctrine_desc: "Rapid concentration puts more pressure on supply."
 NAM_escort_service: "Maritime Escort Service"
 NAM_escort_service_desc: "Practised escort procedures help merchant ships reach their ports."
 NAM_overseas_service: "Overseas Civil Service"
 NAM_overseas_service_desc: "Civil offices reduce unrest in overseas holdings and remain a treasury expense."
 NAM_wartime_entrenchment: "Basin Defence Instructions"
 NAM_wartime_entrenchment_desc: "Temporary engineering preparation applies only to the resource war."
 NAM_counterstroke_staff: "Limited Counterstroke Staff"
 NAM_counterstroke_staff_desc: "Temporary offensive coordination applies only to the resource war."
 NAM_rebel_depot_maps: "Maps of Insurgent Depots"
 NAM_rebel_depot_maps_desc: "Inspectors' records assist attacks against the Svetlogorsk uprising."
 NAM_wage_arrears: "Deferred Payroll"
 NAM_wage_arrears_desc: "Old wage arrears have been deferred until the next quarter."
 NAM_housing_programme: "Homes for Those Who Returned"
 NAM_housing_programme_desc: "A funded civilian programme accelerates construction."
 NAM_sign_compact: "Fund the Svetlogorsk Compact"
 NAM_sign_compact_desc: "Fund the district civil offices. The compact must operate for §Y60 uninterrupted days before the resource war begins§! under our ownership and control to prevent the uprising. Maturing during the war does not change its initial outcome. Losing the district ends the compact; after recovery it can be funded again before the war."
 NAM_export_fuel: "Sell a Reserve Fuel Cargo"
 NAM_export_fuel_desc: "Sell §Y5000§! £fuel_texticon for §G250§! £ADISCORD_economy_treasury_texticon. Requires ownership and control of the port district. Repeat after §Y30 days§!."
 NAM_workshop_batch: "Fuel an Extra Workshop Shift"
 NAM_workshop_batch_desc: "Use §Y3000§! £fuel_texticon to produce §G120§! £support_equipment_texticon. Repeat after §Y30 days§!."
 NAM_supply_order: "Pay for a Field Delivery"
 NAM_supply_order_desc: "Deliver §G1500§! £infantry_equipment_texticon and §G60§! £support_equipment_texticon to our stockpiles. Repeat after §Y45 days§!."
 NAM_emergency_arsenal: "Emergency Arsenal Release"
 NAM_emergency_arsenal_desc: "During the resource war issue §G2000§! £infantry_equipment_texticon and §G100§! £support_equipment_texticon. Repeat after §Y45 days§!."
 NAM_counterinsurgency: "Locate the Underground Depots"
 NAM_counterinsurgency_desc: "Gain §G+8%§! attack against the Svetlogorsk uprising for §Y60 days§! and recover §G1000§! £infantry_equipment_texticon. Available once during an actual war with the rebels."
 NAM_relief_batch: "Supply the Threatened Sector"
 NAM_relief_batch_desc: "Use §Y3000§! £fuel_texticon to deliver §G800§! £infantry_equipment_texticon and §G60§! £support_equipment_texticon. Resource war only; repeat after §Y30 days§!."
 NAM_veteran_housing: "Fund the Return to Civilian Life"
 NAM_veteran_housing_desc: "Gain §G5%§! construction speed for §Y60 days§!. Another programme is available after §Y60 days§!."
 NAM_postwar_rearmament: "Fulfil the Standing Defence Order"
 NAM_postwar_rearmament_desc: "Receive §G2000§! £infantry_equipment_texticon and §G80§! £support_equipment_texticon. Repeat after §Y45 days§!."
