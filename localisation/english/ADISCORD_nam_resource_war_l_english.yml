 NAM_national_programmes:0 "Svetlogorye Programmes"
 NAM_national_programmes_desc:0 "§YSVETLOGORSK COMPACT§!\n[NAMGetCompactStatus].\n\n§YLOCAL PROGRAMMES§!\nSelect repairs, oilfield development and defensive lines on the map. National orders and deliveries are listed in the decisions below.[NAMGetCapturedWellsReport][NAMGetPrewarMandateRecord]"
 NAM_compact_ready: "§Gworking for at least 60 days§!"
 NAM_compact_maturing: "§Ysigned; requires 60 uninterrupted days§!"
 NAM_compact_absent: "not signed"
 NAM_receive_250_tt: "Treasury: §G+250§! £ADISCORD_economy_treasury_texticon."
 NAM_compact_paid_tt: "Civilian services in Svetlogorsk begin §Y60§! £time_texticon days of continuous operation. If that period is completed under our ownership and control before the resource war begins, the compact prevents the initial uprising. Maturing during the war cannot change that outcome. Losing ownership or control ends the compact; after recovering the district it may be paid for again before the war."
 NAM_compact_signable_tt: "We own and control Svetlogorsk; the compact is unsigned and the resource war has neither begun nor ended."
 NAM_current_war_tt: "The resource war with Eflor and Azhar is active."
 NAM_victory_tt: "The resource war ended with recognition of Svetlogorye's independence."
 NAM_war_objective_tt: "Victory: force the enemies to capitulate, or on §Yday 420§! of the war reach an oil score of §Y100§! or more while holding a captured enemy border district - the Moren District, the Loren Borderland, Middle Loren City or the Azhar Seaboard. The Northern Deposits give §Y80§!, the South Coast §Y36§!, Sukhorechye §Y24§!, East Sukhorechye §Y12§!, the Svetlogorsk District §Y12§!. A score of §Y100§! or more without a border district is a standoff: the war ends on the old border, without a recognition treaty and without punishing the neighbours. A score of §Y36§! to §Y99§! leads to a compromise peace. The timer is shown in national decisions."
 NAM_defend_fields: "Hold the Oil Basin"
 NAM_defend_fields_desc: "The fate of Svetlogorye is being decided at the wells, on the roads and in the border districts. Headquarters is checking reports while the government prepares to defend at the negotiating table what the troops can hold."
 ADISCORD_nam_resource_war.109.t: "The Same Surname"
 ADISCORD_nam_resource_war.109.d: "Egor Rom paused over an old signature. The ink had faded and the edge of the page had yellowed, but the surname was still legible. When he first wrote it, the country was still the Veyran Empire and he was an ordinary court scribe. He knew where to submit a petition, whose office should hold a document and when to bring it for signature. Sometimes he needed to go unnoticed; sometimes he needed to arrive before anyone else. None of this required a grand vision.\n\nThe crisis began long before the monarchy fell. Inside the palace it became reports, moved between ledgers and acquired wording that could carry it through to the next meeting. Outside the palace walls, life kept getting harder. Then the zero-point reactor exploded. After the catastrophe, accumulated despair poured into the streets, and a mass uprising swept away the authority whose orders Rom had so recently copied out in a careful hand.\n\nWorker and Dorian Worx promised freedom and a new life. People listened because they no longer wanted the old one. Official speeches described both men as sons of the lowest castes, rising with the people against the throne. Rom remembered their assurance and their ease with words that people at court learned from childhood. Sometimes he thought he recognised something behind the new names. But a scribe's memory was no proof, and he was in no hurry to ask about anyone's past.\n\nThe revolutionaries changed their surnames. An old name could be discarded along with the old order, left in papers that few people now cared to examine. 'Work' meant 'the people'; the name Vorkerland promised a country to those who had never had a voice in it. Rom listened to these explanations and kept signing as before. He did not feel reborn. He still had his handwriting, his habits and his ability to carry out an instruction.\n\nThe monarchy gave way to the Vorkerland dictatorship. Orders acquired new justifications and offices acquired new masters. Rom found a place here too: sometimes useful, sometimes quick enough to seize an opportunity. In time he was entrusted with Svetlogorye, Vorkerland's last colony on the western continent. The former court scribe became a governor. On paper it was an enormous change. Someone else's signature stood beneath the appointment; beneath his acceptance was the same signature he had always used."
 ADISCORD_nam_resource_war.109.a: "Time to attend to Svetlogorye."
 ADISCORD_nam_resource_war.10.t: "The Desk We Inherited"
 ADISCORD_nam_resource_war.10.d: "Egor Rom asked for the chain-of-command chart to be taken down. Every local office led to another office, and every line eventually reached Vorkerland. Now there was no common centre behind them. The chart was too large for his desk; he folded its top away. The country Rom had served had broken apart. Svetlogorye's institutions still had to work.\n\nKirill Mezentsev placed a payroll beside it. The oilfield workers wanted to know why their wages were late again; Svetlogorsk was collecting signatures against the levies. The governors demanded discipline first. District representatives wanted to see the accounts. Rom heard them all. He knew far too well how to compose a reply that would change nothing.\n\nOnce, people had been promised freedom and a new life. Now they brought him complaints he could file, forward to the capital and cease to notice. It required neither cruelty nor any particular faith in the state. He only had to do his own part of the work correctly. He had served that way for years.\n\nRom had no intention of becoming another prophet. He wanted Svetlogorye to live beyond Vorkerland's mad machinery and the patronage of the southern dictatorships. Foreign protection would bring foreign demands again, while the people here would still expect him to answer for them. Yet independence would not fill the treasury. He needed to keep the institutions working, keep the oilfields running and decide whose needs could wait no longer.\n\nHe pulled the payroll towards him. The old arrears could be paid in full, the oilfields alone could be paid first, or the money could be kept until the next quarter. Full payment would give people some relief at a greater expense. Paying the oilfields first would leave the city waiting. Deferral would leave the government with the money and those who had already worked with unpaid wages. This time Rom would have to answer for the decision he signed."
 ADISCORD_nam_resource_war.10.a: "Pay the people now."
 ADISCORD_nam_resource_war.10.b: "Keep the money until the next quarter."
 ADISCORD_nam_resource_war.10.c: "Pay the oilfields first."
