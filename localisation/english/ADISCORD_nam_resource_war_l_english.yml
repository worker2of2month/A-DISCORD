 NAM_grp_crisis_rivals_tt: "The group's rivals: §G+8§!, the group itself: §R-5§!. Stability: §R-2%§!."
 NAM_grp_crisis_wait_tt: "Stability: §R-4%§!. Group support recovers only over time."
 NAM_grp_demand_accept_tt: "The group gets its way: namestniks - §G+75§! £political_power_texticon, oil workers - §G+5000§! £fuel_texticon, districts - §G+3%§! £stability_texticon, garrisons - §G+25§! £army_experience, export houses - §G+250§! £ADISCORD_economy_treasury_texticon. Its rivals: §R-10§!."
