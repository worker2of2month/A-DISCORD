 # Focus trees: exile revolution
 # ----- Defeat tree: exile revolution, shared -----
 NAM_war_of_return_won_tt:0 "The War of Return has been won"
 # ----- Exile radicals: the pillar junta and the great return -----
 NAM_rad_pillar_junta:0 "The Pillar Junta"
 NAM_rad_pillar_junta_desc:0 "The namestnik is deposed, and the seals now belong to those who held the islands all these months: garrison commanders, oil foremen and captains. The Pillar Junta promises no freedoms. It promises to take back the mainland at any price."
 NAM_grp_rad_pillar_junta_tt:0 "Group support:\n  Garrisons: §G+8§! £NAM_support_garr_texticon\n  Oil workers: §G+4§! £NAM_support_oil_texticon\n  Namestniks: §R-10§! £NAM_support_nam_texticon"
 NAM_rad_tribunals:0 "Revolutionary Tribunals"
 NAM_rad_tribunals_desc:0 "The namestnik's loyalists still sit in the offices and depots. The tribunals will purge them within a week and send the convicted to penal companies that will be the first to hit the beach."
 NAM_rad_tribunals_tt:0 "Readiness for the return: §G+10§!."
 NAM_grp_rad_tribunals_tt:0 "Group support:\n  Namestniks: §R-8§! £NAM_support_nam_texticon\n  Districts: §R-4§! £NAM_support_dist_texticon"
 NAM_rad_pact_of_pillars:0 "Pact of the Pillars"
 NAM_rad_pact_of_pillars_desc:0 "The pillars will not cut each other's throats. They pool their coffers, divide the spoils by shares and pay together for the war each of them is waiting for."
 NAM_rad_pact_of_pillars_tt:0 "Loot: §G+40§!."
 NAM_grp_rad_pact_of_pillars_tt:0 "Group support:\n  Oil workers: §G+4§! £NAM_support_oil_texticon\n  Export houses: §G+4§! £NAM_support_trade_texticon"
 NAM_rad_war_council:0 "War Council of the Pillars"
 NAM_rad_war_council_desc:0 "Decisions of war no longer wait for the namestnik's signature. The council of the pillars sits at the staff, and each of its members answers for his sector of the coming front."
 NAM_rad_war_council_tt:0 "Readiness for the return: §G+5§!."
 NAM_rad_island_requisitions:0 "Island Requisitions"
 NAM_rad_island_requisitions_desc:0 "The warehouses of the trading houses and the district granaries pass to the council. The owners receive receipts - to be paid after the return, if anyone is left to pay them."
 NAM_grp_rad_island_requisitions_tt:0 "Group support:\n  Districts: §R-5§! £NAM_support_dist_texticon\n  Export houses: §R-3§! £NAM_support_trade_texticon"
 NAM_rad_great_war_plan:0 "Plan of the Great War"
 NAM_rad_great_war_plan_desc:0 "Sardan, Rakhma and Kadir will meet us together. The council accepts this: one great war is better than three small ones, and after it no one in the South will dare refuse us."
 # ----- After the return: the radicals strip the conquered south -----
 NAM_rad_spoils_of_return:0 "Spoils of the Return"
 NAM_rad_spoils_of_return_desc:0 "The depots of the defeated stand open, their oil and grain belong to the victor. The conquered lands will not become our provinces - they will become our storeroom."
 NAM_rad_labour_camps:0 "Labour Camps"
 NAM_rad_labour_camps_desc:0 "Prisoners and the unreliable will work off their guilt in the oilfields and quarries. The camps are built where hands are needed, not where people can live."
 NAM_grp_rad_labour_camps_tt:0 "Group support:\n  Garrisons: §G+4§! £NAM_support_garr_texticon\n  Districts: §R-6§! £NAM_support_dist_texticon"
 NAM_rad_garrison_rule:0 "Garrison Rule"
 NAM_rad_garrison_rule_desc:0 "Commandants rule the conquered lands. Every village sends recruits, every town keeps a garrison, and any spark is put out before it becomes a fire."
 NAM_grp_rad_garrison_rule_tt:0 "Group support:\n  Garrisons: §G+8§! £NAM_support_garr_texticon\n  Export houses: §R-4§! £NAM_support_trade_texticon"
 NAM_rad_extraction_trusts:0 "Extraction Trusts"
 NAM_rad_extraction_trusts_desc:0 "The oilfields of the defeated pass to the trusts of the pillars. The trusts build no schools and mend no roads - they pump oil while it flows."
 NAM_rad_has_conquered_state_tt:0 "We control at least one conquered state"
 NAM_rad_extraction_trusts_tt:0 "Up to §Y3§! conquered states: oil production §G+2§! in each."
 NAM_grp_rad_extraction_trusts_tt:0 "Group support:\n  Oil workers: §G+6§! £NAM_support_oil_texticon\n  Garrisons: §R-3§! £NAM_support_garr_texticon"
 NAM_rad_machines_to_islands:0 "Machines to the Capital"
 NAM_rad_machines_to_islands_desc:0 "The factories of the conquered lands will be stripped to the last lathe and carried to the capital. There they will make weapons; the defeated keep the empty halls."
 NAM_rad_conquered_factory_tt:0 "A conquered state under our control has a civilian factory"
 NAM_rad_machines_to_islands_tt:0 "Up to §Y2§! conquered states: §R-1§! civilian factory in each.\nCapital: §G+1§! military factory for every factory carried away."
 NAM_rad_dominion_of_pillars:0 "Dominion of the Pillars"
 NAM_rad_dominion_of_pillars_desc:0 "The junta no longer calls itself provisional. The pillars rule the metropole and its storeroom, and their power rests on what was taken by force and is held by force."
 NAM_grp_rad_dominion_of_pillars_tt:0 "Group support:\n  Garrisons: §G+6§! £NAM_support_garr_texticon\n  Oil workers: §G+6§! £NAM_support_oil_texticon\n  Namestniks: §R-10§! £NAM_support_nam_texticon\n  Districts: §R-10§! £NAM_support_dist_texticon"
 # ----- Exile humanists: Yaroslav Weber's government -----
 NAM_hum_veter_government:0 "Yaroslav Weber's Government"
 NAM_hum_veter_government_desc:0 "Yaroslav Weber, until yesterday the leader of the underground, heads the government in exile. His humanists promise to return the mainland not as plunder but as a common home of free districts."
 NAM_grp_hum_veter_government_tt:0 "Group support:\n  Districts: §G+8§! £NAM_support_dist_texticon\n  Namestniks: §R-10§! £NAM_support_nam_texticon"
 NAM_hum_free_zones:0 "Free Zones"
 NAM_hum_free_zones_desc:0 "The islands have nothing to pay for a war with, but they have harbours, steel and people. Foreign companies that open business here will pay no taxes - they will pay for our return."
 NAM_hum_free_zones_tt:0 "Foreign capital: §G+30§!.\nCorporate influence: §Y+5§!."
 NAM_hum_open_doors:0 "Open Doors"
 NAM_hum_open_doors_desc:0 "Any company ready to invest will receive a charter without long inspections. Capital will come quickly."
 NAM_hum_open_doors_tt:0 "Foreign capital: §G+60§!.\nCorporate influence: §R+15§!.\nFree zones: §G+1§! slot (at most §Y3§!)."
 NAM_hum_regulated_partnership:0 "Regulated Partnership"
 NAM_hum_regulated_partnership_desc:0 "Charters are granted under strict rules: open accounts, local workers, the government's right to revoke the contract. There will be less money, but Svetlogorye will gain no new masters."
 NAM_hum_regulated_partnership_tt:0 "Foreign capital: §G+25§!.\nCorporate influence: §G-10§!."
 NAM_hum_steel_exchange:0 "The Steel Exchange"
 NAM_hum_steel_exchange_desc:0 "Island steel leaves for next to nothing through middlemen. Our own exchange will sell it to the companies directly and at a fair price."
 NAM_hum_steel_exchange_tt:0 "Foreign capital: §G+20§!."
 NAM_hum_innovation_parks:0 "Innovation Parks"
 NAM_hum_innovation_parks_desc:0 "The companies bring workshops and engineers to the islands. We will give them quarters by the harbours, where the new machines will work for our workers and our apprentices."
 NAM_hum_innovation_parks_tt:0 "Corporate influence: §Y+5§!."
 NAM_hum_labour_bureau:0 "Labour Contract Bureau"
 NAM_hum_labour_bureau_desc:0 "The refugees need work, the companies need hands. The bureau signs contracts on behalf of the government and makes sure the workers come home with money."
 NAM_hum_labour_bureau_tt:0 "Foreign capital: §G+15§!."
 NAM_hum_union_contracts:0 "Union Agreements"
 NAM_hum_union_contracts_desc:0 "The contracts are signed by the district unions, not by each worker alone. The companies pay less than they would like, but the islands stay calm."
 NAM_hum_union_contracts_tt:0 "Foreign capital: §G+15§!.\nCorporate influence: §G-5§!."
 NAM_grp_hum_union_contracts_tt:0 "Group support:\n  Districts: §G+5§! £NAM_support_dist_texticon"
 NAM_hum_company_towns:0 "Company Towns"
 NAM_hum_company_towns_desc:0 "The companies build housing, shops and workshops for their workers themselves. The towns grow quickly, but everything in them - from bread to order - belongs to the company."
 NAM_hum_company_towns_tt:0 "Foreign capital: §G+50§!.\nCorporate influence: §R+10§!."
 NAM_hum_charter_harbours:0 "Chartered Harbours"
 NAM_hum_charter_harbours_desc:0 "The companies receive their own quays in exchange for ships that will sail under our flag. One more harbour becomes a free zone."
 NAM_hum_charter_harbours_tt:0 "Free zones: §G+1§! slot (at most §Y3§!).\nForeign capital: §G+20§!."
 NAM_hum_charter_commission:0 "The Charter Commission"
 NAM_hum_charter_commission_desc:0 "The commission will examine every charter: who pays, to whom and for what. The companies will not like it, but the government must know how much power it has sold."
 NAM_hum_charter_commission_tt:0 "Corporate influence: §G-15§!."
 NAM_hum_board_of_governors:0 "The Board of Governors"
 NAM_hum_board_of_governors_desc:0 "The companies no longer ask - they govern. The Board of Governors divides the islands into plots, and each plot is ruled by the board of its company."
 NAM_hum_board_of_governors_tt:0 "Foreign capital: §G+80§!."
 NAM_grp_hum_board_of_governors_tt:0 "Group support:\n  Export houses: §G+8§! £NAM_support_trade_texticon\n  Districts: §R-6§! £NAM_support_dist_texticon"
 NAM_hum_company_guard:0 "The Company Guard"
 NAM_hum_company_guard_desc:0 "Every company has its own guards, and the Board of Governors has its own army. It is equipped better than any government regiment."
 NAM_hum_company_guard_tt:0 "Marine order limit: §G+1§! (at most §Y3§!).\nCorporate influence: §Y+5§!."
 # ----- Exile humanists: the federal programme and the allies of the return -----
 NAM_hum_federal_programme:0 "The Federal Programme"
 NAM_hum_federal_programme_desc:0 "Svetlogorye will return not as a namestnik's domain but as a union of districts. Every district will have its own council, its own budget and a voice in the common government."
 NAM_grp_hum_federal_programme_tt:0 "Group support:\n  Districts: §G+6§! £NAM_support_dist_texticon\n  Export houses: §G+2§! £NAM_support_trade_texticon"
 NAM_hum_appeal_to_nations:0 "Appeal to the Nations"
 NAM_hum_appeal_to_nations_desc:0 "Weber appeals to Kefreyt, Stelander, Veyr and Shahrabad: Svetlogorye was driven out by force, but it has renounced neither its land nor the right to live on it in freedom."
 NAM_hum_split_coalition:0 "Splitting the Coalition"
 NAM_hum_split_coalition_desc:0 "Sardan, Rakhma and Kadir gained less from the victory than they expected. We will remind them of it and ask whether foreign oilfields are worth dying for."
 NAM_hum_split_coalition_tt:0 "Readiness for the return: §G+5§!."
 NAM_hum_mainland_committees:0 "Committees on the Mainland"
 NAM_hum_mainland_committees_desc:0 "Committees gather in South Harbour and at the Northern Deposits. They print leaflets, hide weapons and prepare the city for the day our own come from the sea."
 NAM_hum_mainland_committees_tt:0 "Readiness for the return: §G+10§!."
 # ----- Exile humanists: the citizen army -----
 NAM_hum_citizen_army:0 "The Citizen Army"
 NAM_hum_citizen_army_desc:0 "The army of the return will be an army of citizens: volunteers from the districts, not mercenaries or penal companies. Each of them knows what he goes ashore for."
 NAM_hum_citizen_army_tt:0 "Readiness for the return: §G+5§!."
 NAM_hum_credit_arms:0 "Arms on Credit"
 NAM_hum_credit_arms_desc:0 "The companies are ready to supply rifles and machine guns against future charters on the mainland. The debt will have to be repaid, but the army gets its weapons now."
 NAM_hum_credit_arms_tt:0 "Corporate influence: §Y+5§!."
 NAM_hum_district_militia:0 "District Militia"
 NAM_hum_district_militia_desc:0 "Every district will raise its own companies. They are trained worse than regular regiments, but there are many of them, and they fight for their homes."
 NAM_grp_hum_district_militia_tt:0 "Group support:\n  Districts: §G+5§! £NAM_support_dist_texticon"
 NAM_hum_hired_instructors:0 "Hired Instructors"
 NAM_hum_hired_instructors_desc:0 "With the companies' money we will hire officers who have been through other people's wars. They will make soldiers of the volunteers, and the companies will remember who paid for it."
 NAM_hum_hired_instructors_tt:0 "Corporate influence: §R+10§!."
 NAM_hum_marine_contracts:0 "Marine Contracts"
 NAM_hum_marine_contracts_desc:0 "The marine battalions will be equipped with corporate capital. Every contract is a company that will land at South Harbour."
 NAM_hum_landing_rehearsals:0 "Rehearsals on Chartered Ships"
 NAM_hum_landing_rehearsals_desc:0 "The companies lease us their ships. On them the marines will rehearse the landing as many times as it takes."
 NAM_hum_landing_rehearsals_tt:0 "Marine order limit: §G+1§! (at most §Y3§!).\nReadiness for the return: §G+10§!."
 NAM_hum_army_of_citizens:0 "An Army of Citizens"
 NAM_hum_army_of_citizens_desc:0 "The regiments are formed, the marines trained, the weapons paid for. The army of citizens is ready to return the mainland to its people."
 NAM_hum_army_of_citizens_tt:0 "Readiness for the return: §G+15§!."
 NAM_hum_return_manifesto:0 "Manifesto of the Return"
 NAM_hum_return_manifesto_desc:0 "Weber promises the liberated lands not tribunals or camps but seats on the union council. The manifesto will be read in every district on the islands and the mainland before the landing begins."
 NAM_hum_return_manifesto_tt:0 "Readiness for the return: §G+5§!."
 # ----- After the return: the humanists build a federal union -----
 NAM_hum_federal_districts:0 "Federal Districts"
 NAM_hum_federal_districts_desc:0 "The defeated countries will not be annexed. They become federal districts of Svetlogorye: with their own governments, but with a common treasury, a common army and a common future."
 NAM_hum_federal_districts_tt:0 "Every federal district: stability §G+5%§!."
 NAM_hum_has_federal_district_tt:0 "We have at least one federal district"
 NAM_hum_union_council:0 "The Union Council"
 NAM_hum_union_council_desc:0 "Representatives of every district gather for the first session of the union council. Here the budget, the orders and the disputed lands will be divided - with words, not weapons."
 NAM_grp_hum_union_council_tt:0 "Group support:\n  Districts: §G+6§! £NAM_support_dist_texticon"
 NAM_hum_union_roads:0 "Union Roads"
 NAM_hum_union_roads_desc:0 "The districts are tied together by common roads and common factories. Every new factory in a district works for the whole union."
 NAM_hum_union_roads_tt:0 "Capital of every federal district: infrastructure §G+1§!, civilian factory §G+1§!.\nConsolidation: §G+5§!."
 NAM_hum_board_districts:0 "Districts under the Boards"
 NAM_hum_board_districts_desc:0 "The Board of Governors extends its rule to the mainland. Every district receives a company board, and its factories work on the board's orders."
 NAM_hum_board_districts_tt:0 "Capital of every federal district: military factory §G+1§!.\nForeign capital: §G+60§!.\nCorporate influence: §Y+10§!."
 NAM_hum_districts_charter:0 "Charter of Equal Districts"
 NAM_hum_districts_charter_desc:0 "No district stands above another, not even the metropole. The charter guarantees the districts self-government and the union their voluntary loyalty."
 NAM_hum_districts_charter_tt:0 "Every federal district: stability §G+10%§!.\nConsolidation: §G+15§!."
 NAM_grp_hum_districts_charter_tt:0 "Group support:\n  Districts: §G+8§! £NAM_support_dist_texticon"
 NAM_hum_metropole_charter:0 "Charter of the Metropole"
 NAM_hum_metropole_charter_desc:0 "The union needs a centre able to make decisions. The charter of the metropole leaves the districts their councils, but the last word always belongs to the government of Svetlogorye."
 NAM_hum_metropole_charter_tt:0 "Every federal district: stability §R-5%§!.\nConsolidation: §G+10§!."
 NAM_grp_hum_metropole_charter_tt:0 "Group support:\n  Districts: §R-4§! £NAM_support_dist_texticon\n  Export houses: §G+4§! £NAM_support_trade_texticon"
 NAM_hum_union_constitution:0 "Constitution of the Union"
 NAM_hum_union_constitution_desc:0 "The union council adopts a constitution. Svetlogorye is no longer a namestnik's domain or a state in exile, but a union that has chosen its own form."
 NAM_grp_hum_union_constitution_tt:0 "Group support:\n  Districts: §G+6§! £NAM_support_dist_texticon\n  Namestniks: §R-6§! £NAM_support_nam_texticon"
 # ----- Defeat tree: shared exile keys (round 2) -----
 NAM_consolidation_5_tt:0 "Consolidation: §G+5§!."
 NAM_great_war_ready_tt:0 "The great war can begin"
 NAM_great_war_won_tt:0 "The great war has been won"
 NAM_great_war_start_tt:0 "The §Ygreat war§! begins against §YSardan§!, §YRakhma§! and §YKadir§!. Victory brings them under Svetlogorye's rule on our course's terms; our capitulation means the end of the state."
 # ----- Exile radicals: the return (renamed) -----
 NAM_rad_enemy_lists:0 "Lists for Two Capitals"
 NAM_rad_enemy_lists_desc:0 "Eflor and Azhar divided our mainland. In both capitals we will have our own people: rumours, arson and lists of those who will answer first."
 NAM_rad_enemy_lists_tt:0 "Readiness for the return: §G+10§!."
 NAM_rad_return_plan:0 "Plan of the Return"
 NAM_rad_return_plan_desc:0 "The marines will land at South Harbour, and Eflor and Azhar will meet us together. The council of the pillars approves the plan: first the harbour, then the oilfields, then everything else."
 NAM_rad_return_plan_tt:0 "Readiness for the return: §G+10§!."
 # ----- Radicals: holding the reconquered lands -----
 NAM_rad_spoils_of_return_tt:0 "Consolidation: §G+5§!."
 NAM_rad_labour_camps_tt:0 "Consolidation: §G+5§!."
 NAM_rad_martial_law:0 "Martial Law"
 NAM_rad_martial_law_desc:0 "Martial law rules the reconquered lands: curfew, passes and execution for a weapon in the house. Order here will rest on fear until it begins to rest on habit."
 NAM_rad_martial_law_tt:0 "Consolidation: §G+10§!."
 NAM_rad_oil_seizure:0 "Seizure of the Fields"
 NAM_rad_oil_seizure_desc:0 "The oilfields that foreign managers held for two years return to the pillars together with their stocks, machinery and workers."
 NAM_rad_oil_seizure_tt:0 "Oilfield throughput: §G+1§! unit."
 NAM_rad_garrison_belt:0 "Belt of Garrisons"
 NAM_rad_garrison_belt_desc:0 "Every crossroads and every pumping station gets its post. The garrisons stand so close that no underground band can slip between them."
 NAM_rad_garrison_belt_tt:0 "Consolidation: §G+10§!."
 NAM_grp_rad_garrison_belt_tt:0 "Group support:\n  Garrisons: §G+5§! £NAM_support_garr_texticon"
 NAM_rad_hostage_system:0 "Hostages from Every Settlement"
 NAM_rad_hostage_system_desc:0 "Every settlement hands hostages to the commandant. They answer for a shot from around the corner, and the settlements quickly learn to give up the shooters themselves."
 NAM_rad_hostage_system_tt:0 "Consolidation: §G+20§!."
 NAM_grp_rad_hostage_system_tt:0 "Group support:\n  Districts: §R-6§! £NAM_support_dist_texticon"
 NAM_rad_collaborator_councils:0 "Councils of the Obedient"
 NAM_rad_collaborator_councils_desc:0 "The namestniks' old clerks and the local rich are ready to serve any power. Let them run the settlements in our name and answer for them with their heads."
 NAM_rad_collaborator_councils_tt:0 "Consolidation: §G+10§!."
 NAM_grp_rad_collaborator_councils_tt:0 "Group support:\n  Namestniks: §G+4§! £NAM_support_nam_texticon"
 NAM_rad_field_tribunals:0 "Field Tribunals"
 NAM_rad_field_tribunals_desc:0 "The tribunals follow the troops. Whoever served Eflor or Azhar will answer before them the same day."
 NAM_rad_field_tribunals_tt:0 "Consolidation: §G+10§!."
 NAM_rad_pacification:0 "Pacification"
 NAM_rad_pacification_desc:0 "The reconquered lands are silent. It is neither peace nor consent."
 NAM_rad_pacification_tt:0 "Consolidation: §G+15§!."
 # ----- Radicals: preparing the great war -----
 NAM_rad_three_capitals:0 "Lists for Three Capitals"
 NAM_rad_three_capitals_desc:0 "Sardan, Rakhma and Kadir are next. Our people are already in their capitals: they know the depots, the bridges and the names of those who will resist."
 NAM_rad_penal_legions:0 "Penal Legions"
 NAM_rad_penal_legions_desc:0 "From the camps and prisons we will raise legions with nothing to lose. They will go in the first wave, and no one will ask how many of them come back."
 NAM_rad_plunder_economy:0 "Economy of Spoils"
 NAM_rad_plunder_economy_desc:0 "Everything taken from Eflor and Azhar works for the next war: fuel, guns and money from their treasuries."
 # ----- Radicals: after the great war -----
 NAM_rad_southern_tribute:0 "Tribute of the South"
 NAM_rad_southern_tribute_desc:0 "The defeated pay tribute in fuel, money and people. The South is no longer Svetlogorye's neighbour - it is its storeroom."
 NAM_rad_sardan_levies:0 "Levies of Sardan"
 NAM_rad_sardan_levies_desc:0 "The settlements of Sardan must provide recruits. They will serve far from home, where they have nowhere to run."
 NAM_grp_rad_sardan_levies_tt:0 "Group support:\n  Garrisons: §G+3§! £NAM_support_garr_texticon"
 NAM_rad_kadir_tolls:0 "Tolls on Kadir's Caravans"
 NAM_rad_kadir_tolls_desc:0 "The caravan routes of Kadir now pass through our checkpoints. Every pack pays a toll to the pillars."
 NAM_grp_rad_kadir_tolls_tt:0 "Group support:\n  Export houses: §G+4§! £NAM_support_trade_texticon"
 NAM_rad_army_of_dominion:0 "Army of the Dominion"
 NAM_rad_army_of_dominion_desc:0 "The army that took the South stays in it. Its officers gain experience, land and the habit of never being contradicted."
 NAM_rad_rakhma_wells:0 "The Wells of Rakhma"
 NAM_rad_rakhma_wells_desc:0 "For centuries the Well League of Rakhma divided the desert's water and oil. Now the pillars' trust divides them, and divides them in its own favour."
 NAM_rad_rakhma_wells_tt:0 "Oilfield throughput: §G+1§! unit."
 NAM_grp_rad_rakhma_wells_tt:0 "Group support:\n  Oil workers: §G+4§! £NAM_support_oil_texticon"
 NAM_rad_pillar_estates:0 "Estates of the Pillars"
 NAM_rad_pillar_estates_desc:0 "The best lands of the South go to the commanders and foremen of the pillars. Each of them is now not only a general but a landlord."
 NAM_grp_rad_pillar_estates_tt:0 "Group support:\n  Garrisons: §G+5§! £NAM_support_garr_texticon\n  Oil workers: §G+5§! £NAM_support_oil_texticon\n  Export houses: §G+3§! £NAM_support_trade_texticon\n  Districts: §R-8§! £NAM_support_dist_texticon"
 # ----- Humanists: federating the reconquered lands -----
 NAM_hum_union_council_tt:0 "Consolidation: §G+5§!."
 NAM_hum_federal_treaties:0 "Federal Treaties"
 NAM_hum_federal_treaties_desc:0 "Every district signs its own treaty: what it decides itself, what it passes to the union and what the union owes it in return. A signed treaty holds better than a garrison."
 NAM_hum_federal_treaties_tt:0 "Consolidation: §G+15§!."
 NAM_grp_hum_federal_treaties_tt:0 "Group support:\n  Districts: §G+4§! £NAM_support_dist_texticon"
 NAM_hum_harbour_rebuilding:0 "Rebuilding the Harbour"
 NAM_hum_harbour_rebuilding_desc:0 "The companies and the government invest in South Harbour and the burnt oilfields. People who have work and a roof do not join the underground."
 NAM_hum_harbour_rebuilding_tt:0 "Consolidation: §G+10§!.\nCorporate influence: §Y+5§!."
 NAM_hum_truth_commission:0 "Truth Commission"
 NAM_hum_truth_commission_desc:0 "Instead of tribunals, a truth commission. Whoever served Eflor or Azhar will say so openly and receive an amnesty; whoever committed crimes will answer before a court."
 NAM_hum_truth_commission_tt:0 "Consolidation: §G+10§!."
 NAM_grp_hum_truth_commission_tt:0 "Group support:\n  Districts: §G+4§! £NAM_support_dist_texticon"
 NAM_hum_district_police:0 "District Police"
 NAM_hum_district_police_desc:0 "Order in the districts is kept not by soldiers but by police recruited from the local people and answerable to the district councils."
 NAM_hum_district_police_tt:0 "Consolidation: §G+10§!."
 NAM_hum_union_accepted:0 "The Union Accepted"
 NAM_hum_union_accepted_desc:0 "Eflor and Azhar do not love us, but they have accepted the union: their councils sit, their taxes go to the common treasury, their sons serve in the common army."
 NAM_hum_union_accepted_tt:0 "Consolidation: §G+15§!."
 # ----- Humanists: preparing the great war -----
 NAM_hum_southern_offer:0 "An Offer to the South"
 NAM_hum_southern_offer_desc:0 "Sardan, Rakhma and Kadir will be offered entry into the union of their own free will. They will refuse, but their governments will split between those who wanted to accept and those who forbade it."
 NAM_hum_federal_army:0 "The Federal Army"
 NAM_hum_federal_army_desc:0 "The districts send their regiments to the common army of the union. Eflorian and Azhari companies will go into battle beside the Svetlogorsk ones."
 NAM_hum_union_war_bonds:0 "Union War Bonds"
 NAM_hum_union_war_bonds_desc:0 "The union issues bonds, and the companies buy them first. The weapons for the great war will be bought on credit."
 NAM_hum_union_war_bonds_tt:0 "Corporate influence: §Y+5§!."
 NAM_hum_union_call:0 "Call of the Union"
 NAM_hum_union_call_desc:0 "The union council declares: the South will be free of the rulers who divided it as plunder. Every district of the union sends its people."
 # ----- Humanists: after the great war -----
 NAM_hum_southern_districts:0 "New Districts of the South"
 NAM_hum_southern_districts_desc:0 "Sardan, Rakhma and Kadir become federal districts. The union stretches from the islands to the desert."
 NAM_grp_hum_southern_districts_tt:0 "Group support:\n  Districts: §G+4§! £NAM_support_dist_texticon"
 NAM_hum_dry_river_works:0 "Works on the Dry River"
 NAM_hum_dry_river_works_desc:0 "Sardan lives by a river that flows only in spring. The union builds roads and workshops in its capital so that the district lives on more than waiting for water."
 NAM_hum_dry_river_works_tt:0 "If §YSardan§! is a federal district: its stability §G+5%§!, infrastructure §G+1§! and civilian factory §G+1§! in its capital."
 NAM_hum_water_compact:0 "The Water Compact"
 NAM_hum_water_compact_desc:0 "The Well League of Rakhma keeps its right to divide the water, but divides it by a compact common to the whole union."
 NAM_hum_water_compact_tt:0 "If §YRakhma§! is a federal district: its stability §G+10%§!, infrastructure §G+1§! in its capital."
 NAM_hum_union_parliament:0 "The Union Parliament"
 NAM_hum_union_parliament_desc:0 "The union council becomes a parliament: deputies are elected in every district, from the islands to the caravan towns."
 NAM_grp_hum_union_parliament_tt:0 "Group support:\n  Districts: §G+6§! £NAM_support_dist_texticon"
 NAM_hum_caravan_charter:0 "The Caravan Charter"
 NAM_hum_caravan_charter_desc:0 "The Caravan Union of Kadir receives a charter: its routes are open to the whole union, and the tolls go to the common treasury."
 NAM_hum_caravan_charter_tt:0 "If §YKadir§! is a federal district: its stability §G+5%§!, infrastructure §G+1§! in its capital."
 NAM_hum_union_university:0 "The Union University"
 NAM_hum_union_university_desc:0 "Students from every district study at one university. In a generation the union will have engineers who need no explanation of why it exists."
 NAM_hum_union_currency:0 "The Union Currency"
 NAM_hum_union_currency_desc:0 "All districts pay in one coin. Trade between them grows, and the union treasury earns from the issue."
 NAM_hum_union_currency_tt:0 "Every federal district: stability §G+5%§!."
 NAM_hum_union_army:0 "The Union Army"
 NAM_hum_union_army_desc:0 "The district regiments merge into one army with a common staff and common regulations. The union no longer depends on the goodwill of the district councils."
 NAM_hum_common_market:0 "The Common Market"
 NAM_hum_common_market_desc:0 "There are no customs between the districts. Island oil, desert water and caravan goods move freely across the union."
 NAM_grp_hum_common_market_tt:0 "Group support:\n  Export houses: §G+6§! £NAM_support_trade_texticon"
 # ----- Exile humanists: the corporate boards -----
 NAM_board_efl_district_tt:0 "§YEflor§! is a federal district"
 NAM_board_azh_district_tt:0 "§YAzhar§! is a federal district"
 NAM_board_constitution:0 "Statute of the Boards"
 NAM_board_constitution_desc:0 "The company boards write Svetlogorye a statute much like that of a joint-stock company: capital votes, and the Board of Governors settles disputes."
 NAM_board_corporate_courts:0 "Company Courts"
 NAM_board_corporate_courts_desc:0 "Disputes over land, hiring and debts are settled by company courts. They are fast, incorruptible by outsiders and never forget who pays them."
 NAM_board_corporate_courts_tt:0 "Consolidation: §G+10§!.\nCorporate influence: §Y+5§!."
 NAM_board_shareholders:0 "The Shareholders' Assembly"
 NAM_board_shareholders_desc:0 "Once a year the shareholders meet to renew or revoke the companies' charters. Each vote weighs as much as its shares are worth."
 NAM_board_shareholders_tt:0 "Foreign capital: §G+40§!."
 NAM_board_district_auction:0 "Auction of the Districts"
 NAM_board_district_auction_desc:0 "Every federal district will be run by one company. The right to run it is sold at auction to the highest bidder."
 NAM_board_eflor_oil:0 "Eflor to Yuzhneft"
 NAM_board_eflor_oil_desc:0 "The oil concern receives Eflor whole: its oilfields, pipes and workers. Oil will flow faster, and Eflor will become one big drilling rig."
 NAM_board_eflor_oil_tt:0 "Owner of §YEflor§!: the §YYuzhneft oil concern§!.\nOilfield throughput: §G+1§! unit.\nForeign capital: §G+40§!."
 NAM_board_eflor_steel:0 "Eflor to Island Steel"
 NAM_board_eflor_steel_desc:0 "The steel trust receives Eflor and builds its works in the capital. The district will smelt metal for the whole union."
 NAM_board_eflor_steel_tt:0 "Owner of §YEflor§!: the §YIsland Steel trust§!.\nCapital of Eflor: military factory §G+1§!.\nForeign capital: §G+40§!."
 NAM_board_azhar_shipping:0 "Azhar to the Sea Line"
 NAM_board_azhar_shipping_desc:0 "The shipping line receives the ports of Azhar and builds its fleet there. The ships will sail under the company's flag, but carry our cargo."
 NAM_board_azhar_shipping_tt:0 "Owner of §YAzhar§!: the §YSea Line shipping company§!.\nForeign capital: §G+40§!."
 NAM_board_azhar_bank:0 "Azhar to Island Credit"
 NAM_board_azhar_bank_desc:0 "The Island Credit bank buys up Azhar's debts and takes it into management. Money will pour in, and with it the bank's influence."
 NAM_board_azhar_bank_tt:0 "Owner of §YAzhar§!: the §YIsland Credit bank§!.\nForeign capital: §G+80§!.\nCorporate influence: §Y+5§!."
 NAM_board_stock_mobilisation:0 "Stock-Market Mobilisation"
 NAM_board_stock_mobilisation_desc:0 "The companies issue war shares against the future spoils of the South. The exchange pays for weapons, company guards and officers - and waits for dividends."
 NAM_board_stock_mobilisation_tt:0 "Consolidation: §G+10§!.\nCorporate influence: §R+10§!."
 NAM_board_union_of_boards:0 "Union of the Boards"
 NAM_board_union_of_boards_desc:0 "Svetlogorye has become a union of companies: every district belongs to its board, and the boards to the Board of Governors. State and market have become one and the same."
 NAM_board_union_of_boards_tt:0 "Foreign capital: §G+100§!."
 # ----- Exile trees: radical war focuses -----
 NAM_rad_war_of_return:0 "Operation Black Tide"
 NAM_rad_war_of_return_desc:0 "The junta neither asks nor negotiates. The landing will strike South Harbour, and Eflor and Azhar will learn that Svetlogorye has come back for what is its own and for its debts."
 NAM_rad_great_war:0 "March on the South"
 NAM_rad_great_war_desc:0 "The returned lands are subdued and their garrisons are strong. Sardan, Rakhma and Kadir divided our mainland - now the pillars will come for their wells, their caravans and their people."
 # ----- Exile trees: humanist war focuses -----
 NAM_hum_war_of_return:0 "Operation Homecoming"
 NAM_hum_war_of_return_desc:0 "The manifesto has been read and the committees await the signal. The citizen army lands at South Harbour not for revenge but to give the districts back their home - and Eflor and Azhar will become its neighbours, not its masters."
 NAM_hum_great_war:0 "War for a Union of the South"
 NAM_hum_great_war_desc:0 "Sardan, Rakhma and Kadir have rejected the union. The federation comes to them with an army, but it promises every defeated country a seat on the common council, not a camp."
 # ----- Corporate tree -----
 NAM_board_humanist_facade:0 "Ministers for Show"
 NAM_board_humanist_facade_desc:0 "Weber's ministers keep their offices and sign whatever the board has decided. The districts see familiar faces and do not worry yet."
 NAM_grp_board_humanist_facade_tt:0 "Group support:\n  Districts: §G+5§! £NAM_support_dist_texticon\n  Export houses: §R-2§! £NAM_support_trade_texticon"
 NAM_board_purge_ministers:0 "Purge of the Ministries"
 NAM_board_purge_ministers_desc:0 "The board has no use for ministers who remember the manifesto. Company managers take over the offices, and the old officials are paid off."
 NAM_grp_board_purge_ministers_tt:0 "Group support:\n  Export houses: §G+6§! £NAM_support_trade_texticon\n  Districts: §R-5§! £NAM_support_dist_texticon"
 NAM_board_island_concessions:0 "Island Concessions"
 NAM_board_island_concessions_desc:0 "Every quay and warehouse of the capital is let out as a concession. The companies build with their own money, and the board takes a share of every cargo."
 NAM_board_island_concessions_tt:0 "Foreign capital: §G+40§!."
 NAM_board_landing_contracts:0 "Landing Contract"
 NAM_board_landing_contracts_desc:0 "The return to the mainland is a deal like any other. The board hires marines under contract and pays for them with company capital."
 NAM_board_landing_contracts_tt:0 "Limit of marine orders: §G+1§! (at most §Y3§!).\nReadiness for the return: §G+10§!."
 NAM_board_private_navy:0 "Company Fleet"
 NAM_board_private_navy_desc:0 "The shipping lines arm their vessels. Escort ships and new transports will guard the board's convoys - and the landing, if it is still ahead."
 NAM_board_war_of_return:0 "Operation Controlling Stake"
 NAM_board_war_of_return_desc:0 "The mainland oilfields are the most valuable asset the board does not yet own. The companies have paid for the war and expect their return with the first oil of the Northern Deposits."
 NAM_board_homeland_concession:0 "The Oilfields to Yuzhneft"
 NAM_board_homeland_concession_desc:0 "The returned oilfields will not become common property. The Yuzhneft concern receives them as a concession, repairs the wells and pays the board for every ton."
 NAM_board_homeland_concession_tt:0 "Oilfield throughput: §G+1§! unit.\nForeign capital: §G+40§!."
 NAM_grp_board_homeland_concession_tt:0 "Group support:\n  Oil workers: §G+4§! £NAM_support_oil_texticon\n  Districts: §R-2§! £NAM_support_dist_texticon"
 NAM_board_security_contracts:0 "Security Contracts"
 NAM_board_security_contracts_desc:0 "Order in the returned lands is kept not by the army but by the company guards. They receive rifles from the board's depots and pay for the districts' calm with their own men."
 NAM_board_security_contracts_tt:0 "Consolidation: §G+10§!."
 NAM_board_reconstruction_tenders:0 "Reconstruction Tenders"
 NAM_board_reconstruction_tenders_desc:0 "Burnt South Harbour will be rebuilt by whoever offers the board the best share. The companies compete for the contracts, and the city gets new quays."
 NAM_board_reconstruction_tenders_tt:0 "Consolidation: §G+10§!.\nForeign capital: §G+30§!."
 NAM_board_great_war:0 "The Shareholders' War"
 NAM_board_great_war_desc:0 "Sardan, Rakhma and Kadir are the last markets of the South the board does not own. The shareholders vote for war, and the companies send their invoices in advance."
 NAM_board_sdr_district_tt:0 "§YSardan§! is a federal district"
 NAM_board_rhm_district_tt:0 "§YRakhma§! is a federal district"
 NAM_board_kdr_district_tt:0 "§YKadir§! is a federal district"
 NAM_board_sardan_arsenal:0 "Sardan to the Coastal Arsenal"
 NAM_board_sardan_arsenal_desc:0 "The arms company receives Sardan. Its workshops will make rifles for the company guards, and the first batch is already on its way to the board's depots."
 NAM_board_sardan_arsenal_tt:0 "Owner of §YSardan§!: the §YCoastal Arsenal arms company§!."
 NAM_board_sardan_artel:0 "Sardan to the Artel"
 NAM_board_sardan_artel_desc:0 "The Artel labour agency receives Sardan and its people. Sardan's hands will be leased out - and some of them will put on a uniform."
 NAM_board_sardan_artel_tt:0 "Owner of §YSardan§!: the §YArtel labour agency§!."
 NAM_board_rakhma_oil:0 "Rakhma to Yuzhneft"
 NAM_board_rakhma_oil_desc:0 "The wells of Rakhma pass to the oil concern. The first tank trains go to the board's depots, the rest to the exchange."
 NAM_board_rakhma_oil_tt:0 "Owner of §YRakhma§!: the §YYuzhneft oil concern§!.\nForeign capital: §G+40§!."
 NAM_board_rakhma_steel:0 "Rakhma to Island Steel"
 NAM_board_rakhma_steel_desc:0 "The steel trust receives Rakhma and builds a works in its capital. The desert will yield not only oil but shells."
 NAM_board_rakhma_steel_tt:0 "Owner of §YRakhma§!: the §YIsland Steel trust§!.\nForeign capital: §G+40§!."
 NAM_board_kadir_shipping:0 "Kadir to the Sea Line"
 NAM_board_kadir_shipping_desc:0 "The shipping company receives Kadir and its caravan routes. The goods of the desert will reach the sea in the company's holds."
 NAM_board_kadir_shipping_tt:0 "Owner of §YKadir§!: the §YSea Line shipping company§!."
 NAM_board_kadir_bank:0 "Kadir to Island Credit"
 NAM_board_kadir_bank_desc:0 "The bank receives Kadir with its tolls and its debts. Every caravan will pay interest to the board."
 NAM_board_kadir_bank_tt:0 "Owner of §YKadir§!: the §YIsland Credit bank§!.\nForeign capital: §G+80§!."
 # ----- Exile wars: renewal after a closure outside the treaty -----
 NAM_exile_renew_war_of_return: "A New War of Return"
 NAM_exile_renew_war_of_return_desc: "The last war of return broke off without a capitulation: other hands took the enemy out of it, and Eflor and Azhar still hold our home. The companies are refilled, and the army asks for orders again."
 NAM_renew_great_war: "A New March on the South"
 NAM_renew_great_war_desc: "The last great war broke off without a capitulation: another hand took the enemy out of it before its capitals fell. The returned south is held, and the neighbours still stand outside our power."
 # Focus trees: exile construction
 # ----- Exile trees: radical politics -----
 NAM_rad_purge_of_loyalists:0 "Purge of the Namestnik's Men"
 NAM_rad_purge_of_loyalists_desc:0 "The officers and officials who served the namestnik will not serve the pillars. The war council removes them and hands their posts to its own people."
 NAM_grp_rad_purge_of_loyalists_tt:0 "Group support:\n  Namestniks: §R-8§! £NAM_support_nam_texticon\n  Garrisons: §G+3§! £NAM_support_garr_texticon"
 NAM_rad_officer_amnesty:0 "Amnesty for the Namestnik's Officers"
 NAM_rad_officer_amnesty_desc:0 "The junta has few men who can command a regiment. The namestnik's officers are pardoned and return to the ranks - under the eye of the war council."
 NAM_grp_rad_officer_amnesty_tt:0 "Group support:\n  Namestniks: §G+6§! £NAM_support_nam_texticon\n  Garrisons: §R-3§! £NAM_support_garr_texticon"
 # ----- Exile trees: radical fortress islands -----
 NAM_rad_prison_shipyards:0 "Convict Shipyards"
 NAM_rad_prison_shipyards_desc:0 "Prisoners and debtors lay down slipways at Yuzhnoostrovsk. They work in chains, but the hulls grow faster than at any free yard."
 NAM_rad_island_fuel_dumps:0 "Stores of the Island Arsenal"
 NAM_rad_island_fuel_dumps_desc:0 "The foundry and the shipyards give weapons and hulls, but without reserves they are useless. Vaults for fuel and rifles are cut into the rock of the capital island."
 # ----- Exile trees: radical Neo-Svetlogorsk -----
 NAM_rad_labour_battalions:0 "Labour Battalions"
 NAM_rad_labour_battalions_desc:0 "Refugees who cannot pay for their bread work it off. Battalions under garrison guard lay roads on the Southern Islands and the Middle Island."
 NAM_grp_rad_labour_battalions_tt:0 "Group support:\n  Districts: §R-4§! £NAM_support_dist_texticon\n  Garrisons: §G+2§! £NAM_support_garr_texticon"
 NAM_rad_neo_svetlogorsk:0 "Neo-Svetlogorsk"
 NAM_rad_neo_svetlogorsk_desc:0 "The junta does not treat the islands as a temporary refuge. The exile capital takes the name of the lost city, and the first anti-aircraft batteries rise over its harbour."
 NAM_rad_barrack_towns:0 "Barrack Towns"
 NAM_rad_barrack_towns_desc:0 "The refugee tent camps give way to barracks beside the mines. Housing goes to those who work in the shops or enlist."
 NAM_grp_rad_barrack_towns_tt:0 "Group support:\n  Districts: §R-3§! £NAM_support_dist_texticon"
 NAM_rad_convict_power_plant:0 "Convict Power Plant"
 NAM_rad_convict_power_plant_desc:0 "Prisoners build a power plant on the edge of the capital. Its current goes to a new workshop, not to the townspeople's homes."
 NAM_rad_ore_conveyors:0 "Ore Conveyors"
 NAM_rad_ore_conveyors_desc:0 "Instead of a power plant, the convicts run conveyors from the steel mines to the piers. There will be more ore, and it will be easier to ship."
 NAM_rad_military_roads:0 "Military Roads"
 NAM_rad_military_roads_desc:0 "Every island gets a road from its pier to its barracks. The labour battalions build it and the garrison sappers accept it."
 NAM_rad_penal_mines:0 "Penal Mines"
 NAM_rad_penal_mines_desc:0 "New tungsten and chromium workings open on the Eastern Islands and in the Northern District. Those sentenced by the tribunals work them."
 NAM_grp_rad_penal_mines_tt:0 "Group support:\n  Districts: §R-3§! £NAM_support_dist_texticon"
 NAM_rad_island_airfields:0 "Island Airfields"
 NAM_rad_island_airfields_desc:0 "Sand spits are levelled into runways. The capital and the Middle Island get airfields for scouts and fighters."
 NAM_rad_fortress_capital:0 "Fortress Neo-Svetlogorsk"
 NAM_rad_fortress_capital_desc:0 "The exile capital becomes a fortress: anti-aircraft positions, a radar on the lighthouse and pillboxes around the old harbour of the Big Island."
 NAM_rad_fortress_capital_tt:0 "Readiness for the return: §G+10§!."
 # ----- Exile trees: radical army -----
 NAM_rad_cadet_corps:0 "Island Cadet Corps"
 NAM_rad_cadet_corps_desc:0 "Refugees' sons study in the former warehouses of the trading houses. The corps trains junior commanders and armourers."
 # ----- Exile trees: humanist politics -----
 NAM_hum_exile_parliament:0 "Parliament in Exile"
 NAM_hum_exile_parliament_desc:0 "Yaroslav Weber convenes the district deputies who fled to the islands. A parliament without a country is still better than a government without a parliament."
 NAM_grp_hum_exile_parliament_tt:0 "Group support:\n  Districts: §G+6§! £NAM_support_dist_texticon\n  Namestniks: §R-3§! £NAM_support_nam_texticon"
 NAM_hum_salvation_cabinet:0 "Cabinet of National Salvation"
 NAM_hum_salvation_cabinet_desc:0 "Elections can wait. Weber rules by decree together with the garrison commanders, and decisions no longer drown in debate."
 NAM_grp_hum_salvation_cabinet_tt:0 "Group support:\n  Garrisons: §G+4§! £NAM_support_garr_texticon\n  Districts: §R-3§! £NAM_support_dist_texticon"
 # ----- Exile trees: humanist island administration -----
 NAM_hum_coast_guard:0 "Island Coast Guard"
 NAM_hum_coast_guard_desc:0 "Volunteers from the fishing villages man the batteries at Yuzhnoostrovsk and Rybachy."
 NAM_hum_civil_airport:0 "Neo-Svetlogorsk Airport"
 NAM_hum_civil_airport_desc:0 "Foreign airlines link the exile capital with the world. The airport's runways and hangars serve military aircraft as well."
 # ----- Exile trees: humanist Neo-Svetlogorsk -----
 NAM_hum_neo_svetlogorsk:0 "Free City of Neo-Svetlogorsk"
 NAM_hum_neo_svetlogorsk_desc:0 "Weber's government declares the exile capital a free city and gives it the name of the lost home. Foreign investors are the first to answer."
 NAM_hum_neo_svetlogorsk_tt:0 "Foreign capital: §G+25§!."
 NAM_hum_loan_roads:0 "Roads on a Foreign Loan"
 NAM_hum_loan_roads_desc:0 "The banks lend money for roads on every island. The loan will be repaid in concessions, and the companies understand that better than we do."
 NAM_hum_loan_roads_tt:0 "Corporate influence: §R+5§!."
 NAM_hum_refugee_housing:0 "Refugee Housing Cooperatives"
 NAM_hum_refugee_housing_desc:0 "Refugees pool their money to build homes, and the city gives land and brick. A man with a roof is readier to serve."
 NAM_grp_hum_refugee_housing_tt:0 "Group support:\n  Districts: §G+4§! £NAM_support_dist_texticon"
 NAM_hum_harbour_concession:0 "Harbour Concession"
 NAM_hum_harbour_concession_desc:0 "A foreign company will deepen the harbour and build new piers at its own expense. In return it takes a share of the port dues and a voice in the port's affairs."
 NAM_hum_harbour_concession_tt:0 "Foreign capital: §G+40§!.\nCorporate influence: §R+10§!."
 NAM_hum_municipal_harbour:0 "Municipal Harbour"
 NAM_hum_municipal_harbour_desc:0 "The harbour stays the city's property. Building will be slower and paid with our own money, but the piers will not pass to foreign owners."
 NAM_hum_municipal_harbour_tt:0 "Corporate influence: §G-5§!."
 NAM_grp_hum_municipal_harbour_tt:0 "Group support:\n  Districts: §G+4§! £NAM_support_dist_texticon"
 NAM_hum_island_power_grid:0 "Island Power Grid"
 NAM_hum_island_power_grid_desc:0 "The turbines are bought abroad and local crews string the wires. The city gets power, and the suppliers get new debtors."
 NAM_hum_island_power_grid_tt:0 "Corporate influence: §R+5§!."
 NAM_hum_free_port_shipyards:0 "Free Port Shipyards"
 NAM_hum_free_port_shipyards_desc:0 "A shipyard is laid down by the new piers. It will repair merchant ships and build its own."
 NAM_hum_water_works:0 "Aqueduct and Ore-Washing Plant"
 NAM_hum_water_works_desc:0 "A new aqueduct brings water to the mines. The washing plant cleans the ore on the spot, and the same workers yield more metal."
 NAM_hum_people_university:0 "People's University"
 NAM_hum_people_university_desc:0 "Scholars and engineers who fled the mainland open a university for every resident of Neo-Svetlogorsk. Tuition is free, and the laboratories work for the city."
 NAM_grp_hum_people_university_tt:0 "Group support:\n  Districts: §G+4§! £NAM_support_dist_texticon"
 NAM_hum_corporate_polytechnic:0 "Polytechnic of the Concerns"
 NAM_hum_corporate_polytechnic_desc:0 "The companies open their own college. It trains foremen for their workshops and takes its fees in patents."
 NAM_hum_corporate_polytechnic_tt:0 "Foreign capital: §G+30§!.\nCorporate influence: §R+10§!."
 NAM_hum_free_city_charter:0 "Charter of the Free City"
 NAM_hum_free_city_charter_desc:0 "The townspeople adopt the charter of Neo-Svetlogorsk: an elected council, an open port and common workshops. The city built in exile now lives by its own law."
 NAM_hum_free_city_charter_tt:0 "Readiness for the return: §G+10§!."
 # ----- Exile trees: humanist citizen army -----
 NAM_hum_officer_college:0 "Officer College"
 NAM_hum_officer_college_desc:0 "Veterans and hired instructors open a college for the commanders of the volunteers. It teaches staff work, signals and supply."
 # ----- Corporate tree: exile construction -----
 NAM_board_mercenary_battalions:0 "Mercenary Battalions"
 NAM_board_mercenary_battalions_desc:0 "The concerns' security firms recruit battalions from veterans of foreign wars. They bring their own weapons, and the board pays their wages."
 NAM_board_mercenary_battalions_tt:0 "Corporate influence: §R+5§!."
 NAM_board_company_capital:0 "Capital of the Concerns"
 NAM_board_company_capital_desc:0 "The board moves its offices to the island capital. A business quarter grows around the exchange, and the city looks more and more like a headquarters."
 NAM_board_company_capital_tt:0 "Foreign capital: §G+30§!."
 NAM_board_company_housing:0 "Company Quarters"
 NAM_board_company_housing_desc:0 "The concerns build housing and workshops for their workers. Flats come with the contract, and leaving the employer now means losing the roof."
 NAM_board_company_housing_tt:0 "Corporate influence: §R+5§!."
 NAM_board_company_docks:0 "Sea Line Docks"
 NAM_board_company_docks_desc:0 "The shipping company builds its own docks in the capital and puts new transports on the line."
 NAM_board_company_airport:0 "The Board's Airport"
 NAM_board_company_airport_desc:0 "Directors do not like to wait for steamers. The airport links the islands with the world's exchanges, and its landing fees fill the board's coffers."
 NAM_board_company_airport_tt:0 "Foreign capital: §G+20§!."
 NAM_disrupt_print_supply:0 "Disrupt Underground Printing Supplies"
 NAM_disrupt_print_supply_desc:0 "Deliveries of paper, ink and type metal reveal clandestine presses. Monitoring warehouses and orders will slow the circulation of leaflets. The programme lasts 60 days; political power spent on starting it is not refunded."
 NAM_intercept_underground_couriers:0 "Break the Courier Network"
 NAM_intercept_underground_couriers_desc:0 "Typesetters know couriers, and couriers lead to safe houses. Arrests immediately weaken Weber's network, but searches and detentions alienate the districts. Another operation becomes available after 60 days."
 NAM_print_network_active_tt:0 "The underground is active in Svetlogorye; the resource war has not begun"
 NAM_print_supply_control_tt:0 "For §Y60 days§!, monthly underground growth is reduced by §G3§! £operatives_boost_resistance_texticon."
 NAM_print_supply_cancel_tt:0 "Control of underground printing ends. Political power already spent is not refunded."
 NAM_courier_network_disrupted_tt:0 "Underground strength: §G-12§! £operatives_boost_resistance_texticon.\nDistrict support: §R-4§! £NAM_support_dist_texticon."
 NAM_colonial_rifle_contract:0 "Order Arms Against the Quota"
 NAM_colonial_rifle_contract_desc:0 "Cost: §Y30§! £political_power_texticon. Preparation: §Y21§! £time_texticon days.\n\nThe fulfilled quota opens depots for our garrisons.\n§G+4500§! £infantry_equipment_texticon, §G+40§! £support_equipment_texticon.\nRepeat 60 days after completion.\n\nCollapse of the centre, loss of the project territory or an inoperable administration cancels the order and refunds the full price."
 NAM_colonial_rifle_contract_result_tt:0 "After §Y21§! £time_texticon days: §G+4500§! £infantry_equipment_texticon, §G+40§! £support_equipment_texticon."
 NAM_colonial_fuel_reserve:0 "Fill the Concealed Tanks"
 NAM_colonial_fuel_reserve_desc:0 "Cost: §Y25§! £political_power_texticon. Preparation: §Y21§! £time_texticon days.\n\nPart of the output stays in local storage.\n§G+6000§! £fuel_texticon.\nRepeat 60 days after completion.\n\nCollapse of the centre, loss of the project territory or an inoperable administration cancels the order and refunds the full price."
 NAM_colonial_fuel_reserve_result_tt:0 "After §Y21§! £time_texticon days: §G+6000§! £fuel_texticon."
 NAM_colonial_workshops:0 "South Harbour Arms Workshops"
 NAM_colonial_workshops_desc:0 "Cost: §Y60§! £political_power_texticon. Preparation: §Y35§! £time_texticon days.\n\nMachine tools from the return cargo will arm the army.\nSouth Harbour: military factory §G+1§!, building slot §G+1§!.\nRepeat 120 days after completion.\n\nCollapse of the centre, loss of the project territory or an inoperable administration cancels the order and refunds the full price. The price is also refunded if another construction project takes the remaining space."
 NAM_colonial_workshops_result_tt:0 "After §Y35§! £time_texticon days: South Harbour: military factory §G+1§!, building slot §G+1§!."
 NAM_colonial_artillery_contract:0 "Artillery and Signals Contract"
 NAM_colonial_artillery_contract_desc:0 "Cost: §Y45§! £political_power_texticon. Preparation: §Y28§! £time_texticon days.\n\nDepot contacts equip artillery and signals units.\n§G+60§! £artillery_texticon, §G+40§! £support_equipment_texticon.\nRepeat 90 days after completion.\n\nCollapse of the centre, loss of the project territory or an inoperable administration cancels the order and refunds the full price."
 NAM_colonial_artillery_contract_result_tt:0 "After §Y28§! £time_texticon days: §G+60§! £artillery_texticon, §G+40§! £support_equipment_texticon."
 NAM_colonial_gendarme_operation:0 "Sever the Cells' Contacts"
 NAM_colonial_gendarme_operation_desc:0 "Cost: §Y35§! £political_power_texticon. Preparation: §Y14§! £time_texticon days.\n\nGendarmes intercept contacts and coordinate searches.\n§G-15§! £operatives_boost_resistance_texticon, §R-3§! £NAM_support_dist_texticon.\nRepeat 60 days after completion.\n\nCollapse of the centre, loss of the project territory or an inoperable administration cancels the order and refunds the full price."
 NAM_colonial_gendarme_operation_result_tt:0 "After §Y14§! £time_texticon days: §G-15§! £operatives_boost_resistance_texticon, §R-3§! £NAM_support_dist_texticon."
 NAM_colonial_volunteer_training:0 "Oilfield Militia Training"
 NAM_colonial_volunteer_training_desc:0 "Cost: §Y40§! £political_power_texticon. Preparation: §Y21§! £time_texticon days.\n\nLocal instructors assemble volunteers at the oilfields.\n§G+3000§! £population_texticon, §G+1500§! £infantry_equipment_texticon, §G+3§! £NAM_support_dist_texticon.\nRepeat 90 days after completion.\n\nCollapse of the centre, loss of the project territory or an inoperable administration cancels the order and refunds the full price."
 NAM_colonial_volunteer_training_result_tt:0 "After §Y21§! £time_texticon days: §G+3000§! £population_texticon, §G+1500§! £infantry_equipment_texticon, §G+3§! £NAM_support_dist_texticon."
 NAM_colonial_reserve_fund:0 "Shelter the Centre's Share"
 NAM_colonial_reserve_fund_desc:0 "Cost: §Y35§! £political_power_texticon. Preparation: §Y14§! £time_texticon days.\n\nThe chancery redirects central payments to a local reserve.\nConcealed reserve: §G+150§! £ADISCORD_economy_treasury_texticon. Paid at independence.\nRepeat 45 days after completion.\n\nCollapse of the centre, loss of the project territory or an inoperable administration cancels the order and refunds the full price."
 NAM_colonial_reserve_fund_result_tt:0 "After §Y14§! £time_texticon days: Concealed reserve: §G+150§! £ADISCORD_economy_treasury_texticon. Paid at independence."
 NAM_colonial_officer_course:0 "Field Command Courses"
 NAM_colonial_officer_course_desc:0 "Cost: §Y35§! £political_power_texticon. Preparation: §Y21§! £time_texticon days.\n\nInstructors hold staff exercises.\n§G+20§! £army_experience, §G+4§! £NAM_support_garr_texticon.\nRepeat 90 days after completion.\n\nCollapse of the centre, loss of the project territory or an inoperable administration cancels the order and refunds the full price."
 NAM_colonial_officer_course_result_tt:0 "After §Y21§! £time_texticon days: §G+20§! £army_experience, §G+4§! £NAM_support_garr_texticon."
 NAM_colonial_local_register:0 "Assemble a Local Officer Reserve"
 NAM_colonial_local_register_desc:0 "Cost: §Y35§! £political_power_texticon. Preparation: §Y21§! £time_texticon days.\n\nReservists loyal to local commanders report through discreet registers.\n§G+4000§! £population_texticon, §G+4§! £NAM_support_garr_texticon.\nAvailable once.\n\nCollapse of the centre, loss of the project territory or an inoperable administration cancels the order and refunds the full price."
 NAM_colonial_local_register_result_tt:0 "After §Y21§! £time_texticon days: §G+4000§! £population_texticon, §G+4§! £NAM_support_garr_texticon."
 NAM_colonial_emergency_stocks:0 "Stockpile for the Day of Collapse"
 NAM_colonial_emergency_stocks_desc:0 "Cost: §Y35§! £political_power_texticon. Preparation: §Y14§! £time_texticon days.\n\nLocal depots receive supplies before deliveries cease.\n§G+3000§! £fuel_texticon, §G+1500§! £infantry_equipment_texticon.\nAvailable once.\n\nCollapse of the centre, loss of the project territory or an inoperable administration cancels the order and refunds the full price."
 NAM_colonial_emergency_stocks_result_tt:0 "After §Y14§! £time_texticon days: §G+3000§! £fuel_texticon, §G+1500§! £infantry_equipment_texticon."
 NAM_colonial_warehouse_transfer:0 "Transfer Departmental Depots to the Army"
 NAM_colonial_warehouse_transfer_desc:0 "Cost: §Y40§! £political_power_texticon. Preparation: §Y14§! £time_texticon days.\n\nA final inventory assigns departmental stocks to Svetlogorye's army.\n§G+3000§! £infantry_equipment_texticon, §G+40§! £support_equipment_texticon.\nAvailable once.\n\nCollapse of the centre, loss of the project territory or an inoperable administration cancels the order and refunds the full price."
 NAM_colonial_warehouse_transfer_result_tt:0 "After §Y14§! £time_texticon days: §G+3000§! £infantry_equipment_texticon, §G+40§! £support_equipment_texticon."
 NAM_colonial_archive_transfer:0 "Take Over the Centre's Accounts"
 NAM_colonial_archive_transfer_desc:0 "Cost: §Y50§! £political_power_texticon. Preparation: §Y14§! £time_texticon days.\n\nCopies of central orders recover outstanding payments.\n§G+150§! £ADISCORD_economy_treasury_texticon, §G+3%§! £stability_texticon.\nAvailable once.\n\nCollapse of the centre, loss of the project territory or an inoperable administration cancels the order and refunds the full price."
 NAM_colonial_archive_transfer_result_tt:0 "After §Y14§! £time_texticon days: §G+150§! £ADISCORD_economy_treasury_texticon, §G+3%§! £stability_texticon."
 NAM_campaign_add_slot_tt:0 "Gain §G1§! additional propaganda campaign slot."
 NAM_colonial_programme_operable_tt:0 "The administration operates, Svetlogorye remains a colony and the metropole exists"
 NAM_colonial_gendarme_result_tt:0 "Underground: §G-15§! £operatives_boost_resistance_texticon. District support: §R-3§! £NAM_support_dist_texticon."
 NAM_colonial_volunteers_result_tt:0 "District support: §G+3§! £NAM_support_dist_texticon."
 NAM_colonial_officers_result_tt:0 "Garrison support: §G+4§! £NAM_support_garr_texticon."
 NAM_colonial_reserve_result_tt:0 "Concealed reserve: §G+150§! £ADISCORD_economy_treasury_texticon. Paid at independence."
 NAM_colonial_archive_result_tt:0 "Svetlogorye treasury: §G+150§! £ADISCORD_economy_treasury_texticon."
 NAM_campaign_answer_leaflets:0 "Every Leaflet Carries Someone Else's Orders"
 NAM_campaign_answer_leaflets_desc:0 "Newspapers and oilfield radio challenge underground promises and expose recruiters. Cost: §Y25§! £political_power_texticon. Occupies one propaganda slot for §Y60§! £time_texticon days. Monthly underground growth: §G-2§! £operatives_boost_resistance_texticon; weekly stability: §G+0.2%§! £stability_texticon. Repeat 30 days after completion. Amnesty, the resource war, loss of Svetlogorsk or capitulation ends the campaign and releases its slot without refund."
 NAM_campaign_answer_leaflets_tt:0 "For §Y60§! £time_texticon days, monthly underground growth falls by §G2§! £operatives_boost_resistance_texticon."
 NAM_colonial_pipeline_guard:0 "Standing Pipeline Watch Posts"
 NAM_colonial_pipeline_guard_desc:0 "Watch posts inspect passes and cell supply routes. Cost: §Y25§! £political_power_texticon. For §Y60§! £time_texticon days, monthly underground growth falls by §G2§! £operatives_boost_resistance_texticon. Repeat 30 days after completion. Continues after independence until the resource war. No refund when the operation ends."
 NAM_colonial_pipeline_guard_tt:0 "For §Y60§! £time_texticon days, monthly underground growth falls by §G2§! £operatives_boost_resistance_texticon."
 NAM_pipeline_guard_cancel_tt:0 "Pipeline protection ends. The price is not refunded."
 NAM_colonial_reserve_ready_tt:0 "The concealed reserve exists and has not yet been paid at independence"

 # Independent institutions and public mobilisation
 NAM_ind_sovereign_collections:0 "Revenue Under Our Own Seal"
 NAM_ind_sovereign_collections_desc:0 "Cost: §Y30§! £political_power_texticon. Duration: §Y14§! £time_texticon days. Repeat: §Y90§! £time_texticon days after completion.\n\nThe chancery reconciles payments previously sent to the centre and directs them into independent Svetlogorye's treasury.\nSvetlogorye treasury: §G+250§! £ADISCORD_economy_treasury_texticon.\n\nLoss of independence or an inoperable administration cancels the order with a full refund. War and a change of focus tree do not themselves cancel it."
 NAM_ind_sovereign_collections_result_tt:0 "After §Y14§! £time_texticon days: Svetlogorye treasury: §G+250§! £ADISCORD_economy_treasury_texticon."
 NAM_ind_border_dossier:0 "Compile a Boundary Dossier"
 NAM_ind_border_dossier_desc:0 "Cost: §Y30§! £political_power_texticon. Duration: §Y21§! £time_texticon days. Repeat: §Y90§! £time_texticon days after completion.\n\nArchivists and trading offices assemble maps, payments and treaties into evidence for a response to the neighbours. This lowers pressure but does not cancel the resource conflict's scheduled deadline.\nRestitution pressure: §G-12§! £world_tension_texticon. Trading house support: §G+3§! £NAM_support_trade_texticon.\n\nClosure of the dispute, dispatch of the war order, pressure falling to zero, loss of independence or an inoperable administration refunds the full price."
 NAM_ind_border_dossier_result_tt:0 "After §Y21§! £time_texticon days: Restitution pressure: §G-12§! £world_tension_texticon. Trading house support: §G+3§! £NAM_support_trade_texticon."
 NAM_ind_defence_supply:0 "Supply the Army of Independence"
 NAM_ind_defence_supply_desc:0 "Cost: §Y40§! £political_power_texticon. Duration: §Y21§! £time_texticon days. Repeat: §Y90§! £time_texticon days after completion.\n\nDomestic military orders equip the army and train specialists. The programme continues through war and its settlement while Svetlogorye remains independent.\nTo Svetlogorye's stockpiles: §G+6000§! £infantry_equipment_texticon, §G+60§! £support_equipment_texticon. §G+10§! £army_experience.\n\nLoss of independence or an inoperable administration cancels the order with a full refund. War and a change of focus tree do not themselves cancel it."
 NAM_ind_defence_supply_result_tt:0 "After §Y21§! £time_texticon days: To Svetlogorye's stockpiles: §G+6000§! £infantry_equipment_texticon, §G+60§! £support_equipment_texticon. §G+10§! £army_experience."
 NAM_ind_statute_commissions:0 "Send Statute Commissions to the Districts"
 NAM_ind_statute_commissions_desc:0 "Cost: §Y35§! £political_power_texticon. Duration: §Y21§! £time_texticon days. Repeat: §Y60§! £time_texticon days after completion.\n\nTravelling commissions resolve disputes over authority, explain the new appeals procedure and coordinate local institutions.\n§G+2%§! £stability_texticon. District support: §G+6§! £NAM_support_dist_texticon; governor support: §G+3§! £NAM_support_nam_texticon.\n\nLoss of independence or an inoperable administration cancels the order with a full refund. War and a change of focus tree do not themselves cancel it."
 NAM_ind_statute_commissions_result_tt:0 "After §Y21§! £time_texticon days: §G+2%§! £stability_texticon. District support: §G+6§! £NAM_support_dist_texticon; governor support: §G+3§! £NAM_support_nam_texticon."
 NAM_ind_reservist_register:0 "Compile a Unified Reservist Register"
 NAM_ind_reservist_register_desc:0 "Cost: §Y35§! £political_power_texticon. Duration: §Y28§! £time_texticon days. Repeat: §Y120§! £time_texticon days after completion.\n\nUnified service records identify trained reservists previously lost between departments. They enter Svetlogorye's manpower pool.\nSvetlogorye manpower: §G+4000§! £population_texticon.\n\nLoss of independence or an inoperable administration cancels the order with a full refund. War and a change of focus tree do not themselves cancel it."
 NAM_ind_reservist_register_result_tt:0 "After §Y28§! £time_texticon days: Svetlogorye manpower: §G+4000§! £population_texticon."
 NAM_ind_border_dossier_delivered_tt:0 "Restitution pressure: §G-12§! £world_tension_texticon. Trading house support: §G+3§! £NAM_support_trade_texticon."
 NAM_ind_statute_commissions_support_tt:0 "District support: §G+6§! £NAM_support_dist_texticon; governor support: §G+3§! £NAM_support_nam_texticon."
 NAM_independent_programmes_operable_tt:0 "Svetlogorye is independent, the centre has collapsed and the administration operates"
 NAM_ind_border_dossier_possible_tt:0 "Svetlogorye is independent, Eflor retains its claim, pressure is above zero and no resource-war order has been dispatched"
 NAM_campaign_our_own_word:0 "Our Word, Our Country"
 NAM_campaign_our_own_word_desc:0 "Radio, newspapers and public meetings carry the head of state's address forward: independence requires daily responsibility, and defence concerns everyone.\n\nCost: §Y30§! £political_power_texticon. Occupies one propaganda slot for §Y60§! £time_texticon days. Weekly: §G+0.3%§! £stability_texticon and §G+0.3%§! £war_support_modifiericons_texticon. Repeat §Y60§! £time_texticon days after completion.\n\nCapitulation or subjugation ends the campaign and returns its slot without refund. War and peace do not themselves end the campaign."

 # Administrative programmes
 NAM_admin_common_stores:0 "Pool Departmental Stores"
 NAM_admin_common_stores_delivered_tt:0 "§G+100§! £support_equipment_texticon, §G+2000§! £fuel_texticon."
 NAM_admin_common_stores_result_tt:0 "After §Y21§! £time_texticon days: §G+100§! £support_equipment_texticon, §G+2000§! £fuel_texticon."
 NAM_admin_common_stores_desc:0 "Cost: §Y30§! £political_power_texticon. Duration: §Y21§! £time_texticon days. Repeat §Y90§! £time_texticon days after completion.\n\nAuditors reconcile departmental ledgers and move unused supplies into common storage.\n§G+100§! £support_equipment_texticon, §G+2000§! £fuel_texticon.\n\nCapitulation, subjugation or loss of programme conditions refunds the entire price. War and focus-tree changes do not themselves cancel an order. Svetlogorye receives every result."
 NAM_admin_compulsory_delivery:0 "Order a Compulsory Delivery"
 NAM_admin_compulsory_delivery_delivered_tt:0 "§G+4500§! £infantry_equipment_texticon. §R-6§! £NAM_support_dist_texticon, §R-3§! £NAM_support_oil_texticon. §Y-5%§! $NAM_ladder_bop$."
 NAM_admin_compulsory_delivery_result_tt:0 "After §Y7§! £time_texticon days: §G+4500§! £infantry_equipment_texticon. §R-6§! £NAM_support_dist_texticon, §R-3§! £NAM_support_oil_texticon. §Y-5%§! $NAM_ladder_bop$."
 NAM_admin_compulsory_delivery_desc:0 "Cost: §Y25§! £political_power_texticon. Duration: §Y7§! £time_texticon days. Repeat §Y60§! £time_texticon days after completion.\n\nGovernors open local depots under a single writ. Faster supply costs the goodwill of districts and oilfields.\n§G+4500§! £infantry_equipment_texticon. §R-6§! £NAM_support_dist_texticon, §R-3§! £NAM_support_oil_texticon. §Y-5%§! $NAM_ladder_bop$.\n\nCapitulation, subjugation or loss of programme conditions refunds the entire price. War and focus-tree changes do not themselves cancel an order. Svetlogorye receives every result."
 NAM_admin_warehouse_inspection:0 "Inspect Garrison Depots"
