 NAM_national_programmes:0 "Svetlogorye Programmes"
 NAM_national_programmes_desc:0 "Svetlogorsk compact: [NAMGetCompactStatus]."
 NAM_compact_ready: "§Gworking for at least 60 days§!"
 NAM_compact_maturing: "§Ysigned; requires 60 uninterrupted days§!"
 NAM_compact_absent: "not signed"
 NAM_receive_250_tt: "Treasury: §G+250§! £ADISCORD_economy_treasury_texticon."
 NAM_compact_paid_tt: "The Svetlogorsk compact begins §Y60 days§! of uninterrupted work; its maturity is checked at the outbreak of war."
 NAM_compact_signable_tt: "We own and control Svetlogorsk; the compact is unsigned and the resource war has neither begun nor ended."
 NAM_current_war_tt: "The resource war with Eflor and Azhar is active."
 NAM_victory_tt: "The resource war ended with recognition of Svetlogorye's independence."
 NAM_war_objective_tt: "Victory: force the enemies to capitulate, or on §Yday 420§! of the war reach an oil score of §Y100§! or more while holding a captured enemy border district - the Moren District, the Loren Borderland, Middle Loren City or the Azhar Seaboard. The Northern Deposits give §Y80§!, the South Coast §Y36§!, Sukhorechye §Y24§!, East Sukhorechye §Y12§!, the Svetlogorsk District §Y12§!. A score of §Y100§! or more without a border district is a standoff: the war ends on the old border, without a recognition treaty and without punishing the neighbours. A score of §Y36§! to §Y99§! leads to a compromise peace. The timer is shown in national decisions."
 NAM_defend_fields: "Hold the Oil Basin"
 NAM_defend_fields_desc: "The war reaches its diplomatic limit §Y420 days§! after it begins. The oil of the fields under our control is then added up: Northern Deposits §Y80§!, South Coast §Y36§!, Sukhorechye §Y24§!, East Sukhorechye §Y12§!, Svetlogorsk District §Y12§!. §Y100§! or more together with a captured enemy border district (Moren District, Loren Borderland, Middle Loren City, Azhar Seaboard) brings recognised independence and a new border, §Y100§! or more without such a district a standoff on the old border, §Y36§! to §Y99§! a compromise peace with cessions and a year of tribute, below §Y36§! partition. Capitulation of the enemies ends the war earlier."
 ADISCORD_nam_resource_war.10.t: "The Desk We Inherited"
 ADISCORD_nam_resource_war.10.d: "Egor Rom asked for the chain-of-command chart to be taken down. Every local office led to another office, and every line eventually reached Vorkerland. The chart was too large for his desk. He folded its top away.\n\nKirill Mezentsev laid a payroll over it. Oilfield workers wanted to know who now controlled their earnings; Svetlogorsk was gathering signatures against the levies. The governors wanted discipline restored first. District representatives demanded open accounts. Rom kept both folders.\n\nThe first decision nevertheless required money, not a new constitution. Old wage arrears could be settled now or deferred until the next quarter. Neither choice would decide what should hold the country together."
 ADISCORD_nam_resource_war.10.a: "Pay the people now."
 ADISCORD_nam_resource_war.10.b: "Keep the money until the next quarter."
 ADISCORD_nam_resource_war.10.c: "Pay the oilfields first."
 NAM_rw_10_c_tt: "Group support:\n  Oil workers: §G+8§! £NAM_support_oil_texticon\n  Districts: §R-5§! £NAM_support_dist_texticon"
 ADISCORD_nam_resource_war.close: "This matter belongs to the past."
 NAM_spend_250_tt: "Treasury: §R-250§! £ADISCORD_economy_treasury_texticon."
 ADISCORD_nam_resource_war.11.t: "A Map in Place of the Ledger"
 ADISCORD_nam_resource_war.11.d: "Rom's staff no longer debates the wording of the ultimatum. An officer spreads out a map of the roads to the fields: the Northern Deposits, the Svetlogorsk District, the South Coast, Sukhorechye and East Sukhorechye. Every field held will become a line in the future peace treaty.\n\nThe war's diplomatic limit is 420 days after hostilities begin. By then the mediators will add up the oil of the fields that remain with Svetlogorye: the Northern Deposits count 80, the South Coast 36, Sukhorechye 24, East Sukhorechye 12, the Svetlogorsk District 12. A hundred or more together with a captured border district of Eflor or Azhar means recognised independence and a new border; a hundred or more without such a district means a standoff on the old border, with no recognition treaty. 36 to 99 brings a compromise peace with cessions and tribute. Less than 36 costs the whole mainland: the government will withdraw to the islands, and without islands the country will be partitioned. The war can end earlier: by the enemies' capitulation or ours, by a week of holding every border district of the neighbours together with our own fields, or by a week in which the enemy holds the Northern Deposits and one more field. A countdown and orders to hold the fields have appeared among the decisions.\n\nSvetlogorsk remains a separate question. A paid compact that had operated for sixty days before the attack prevents the uprising. Without it, everything depends on the strength of the underground. The emergency focus branch is available immediately, regardless of unfinished peacetime plans."
 ADISCORD_nam_resource_war.11.a: "Our people live on this map."
 ADISCORD_nam_resource_war.12.t: "Peace Does Not Answer the Question"
 ADISCORD_nam_resource_war.12.d: "The treaty seals have dried. Eflor and Azhar recognised independence, but they remain neighbours and allies. Depots need replenishment; towns await repairs rather than another parade.\n\nTwo folders return to the desk: make the administrative hierarchy a permanent state, or bind the district guarantees into a charter. The course chosen before the war must become law. If the government postponed that choice, peace gives it no further excuse.\n\nFor the first time, Egor Rom signs a document without a space for a superior authority."
 ADISCORD_nam_resource_war.12.d_standoff: "The truce on the old border has held for some days now. Eflor and Azhar signed no recognition: their mediators merely recorded that the armies stopped where they stood before the war. The neighbours' alliance is intact, the depots are empty, and the towns await repairs rather than a parade.\n\nTwo folders return to the desk: make the administrative hierarchy a permanent state, or bind the district guarantees into a charter. The course chosen before the war must become law without waiting for anyone else's signature.\n\nEgor Rom signs a document with no space for a superior authority - or for the neighbours."
 ADISCORD_nam_resource_war.12.a: "Now we answer for ourselves."
 ADISCORD_nam_resource_war.13.t: "Issued by Svetlogorye"
 ADISCORD_nam_resource_war.13.d: "The archive found an old form: a foreign capital's emblem, a governor's signature and a long list of approvals. A young clerk asked whether the blank reverse could be reused. The archivist agreed.\n\nNew forms discuss the institute, district budgets, factory orders and people coming home. Arguments have not disappeared. Some think the administration too strong; others fear it is too weak. Troops still stand at the border. But the arguments now have an addressee here, inside the country.\n\nRom watched the queue outside the civil office. A state, it seemed, was not the final seal on a paper. It was the obligation to open the door again tomorrow."
 ADISCORD_nam_resource_war.13.a: "The office will open tomorrow."
 ADISCORD_nam_resource_war.70.t: "Rom's Address"
 ADISCORD_nam_resource_war.70.d: "For the first time the Svetlogorsk radio station was switched through to every oilfield at once. In the Klyuchevsk barracks the bunks were pushed towards the loudspeakers, loading stopped in the South Harbour, and in the chancellery the clerks stood in the corridor because the offices had run out of chairs. Egor Rom spoke without notes, although three drafts of the speech lay on the desk before him.\n\nThe governors had written the first: about order, about seals that no longer answer to a distant capital, and about a country held together by people who know how to carry out an order. The district representatives and the oil workers' artels had brought the second: Svetlogorye's oil must feed those who extract it, not only those who sign for it. The garrison officers had sketched the third, short as a report: the neighbours are waiting for us to weaken, and we will not give them a single well.\n\nRom knew that today every word would become a promise. Those he addressed would remember the speech as a contract. The others would remember it as a bill still to be presented to them."
 ADISCORD_nam_resource_war.70.a: "Speak of order and the seals."
 ADISCORD_nam_resource_war.70.b: "Speak of the oil that feeds the people."
 ADISCORD_nam_resource_war.70.c: "Speak of the wells we will not surrender."
 NAM_rom_address_a_tt: "Group support:\n  Governors: §G+5§! £NAM_support_nam_texticon\n  Garrisons: §G+5§! £NAM_support_garr_texticon\n  Districts: §R-3§! £NAM_support_dist_texticon"
 NAM_rom_address_b_tt: "Group support:\n  Oil workers: §G+6§! £NAM_support_oil_texticon\n  Districts: §G+6§! £NAM_support_dist_texticon\n  Export houses: §R-3§! £NAM_support_trade_texticon"
 NAM_rom_address_c_tt: "Group support:\n  Garrisons: §G+5§! £NAM_support_garr_texticon\n  Export houses: §R-5§! £NAM_support_trade_texticon"
 NAM_compact_war_closed: "the resource war has ended"
 NAM_compact_ratified_status: "§Gaccepted at the outbreak of war; uprising prevented§!"
 NAM_compact_wartime_unavailable: "§Ythe compact provides no wartime guarantee§!"
 ADISCORD_nam_resource_war.10.before: "Orders still arrive from the capital. One demands faster oil shipments, another forbids spending reserves, and a third returns an unsigned budget. Egor Rom asked for the command chart to be spread across his desk. It contained more lines than the desk had room for.\n\nKirill Mezentsev placed a payroll beside it. Oilfield workers wanted to know why payment was late again; Svetlogorsk was collecting signatures against the levies. Governors demanded discipline, while district representatives wanted open accounts. Vorkerland still exists, but its authority no longer answers those questions for the local government.\n\nThe first decision requires money. Old arrears can be paid now or deferred until the next quarter. Both political folders will remain on the desk. If the link to the capital finally breaks, Svetlogorye must face that day with working institutions."
 NAM_compact_interrupted_status: "§Ylocal service interrupted; uprising was already prevented§!"
 NAM_south_final_ready_tt: "The southern crisis is open, Shahrabad is not fighting a limited war with Mazar, Keyzan or Veyr, and the War for the South has not started"
 NAM_south_seal_over_furnaces: "Subjugate Shahrabad"
 NAM_south_seal_over_furnaces_desc: "The namestnik ladder demands of the furnaces what it demands of every district: a report, a seal and the right to halt a decision. If Shahrabad refuses, emergency writs will raise the districts."
 NAM_south_seal_over_furnaces_tt: "The §YWar for the South§! begins. Every independent desert state will choose a side. On victory Shahrabad and its allies become §YSvetlogorye namestnik offices§!."
 NAM_south_oil_charter: "Charter against the Cartel"
 NAM_south_oil_charter_desc: "The Oil Charter offers its neighbours fuel and self-government. Shahrabad's furnaces offer buyouts, debt and monopoly. Only one agreement can remain in the south."
 NAM_south_oil_charter_tt: "The §YWar for the South§! begins. Every independent desert state will choose a side. On victory Shahrabad and its allies keep their administrations and join the §YOil Charter§!."
 NAM_south_black_basin: "The Black Basin"
 NAM_south_black_basin_desc: "Azhar lost the war but kept its depots and garrisons. The namestnik ladder demands that the Black Basin receive a namestnik from Svetlogorye."
 NAM_south_black_basin_tt: "§YAzhar§! is told to become a Svetlogorye namestnik office. If it refuses, we declare war on it for full annexation."
 NAM_south_desert_offices: "Desert Offices"
 NAM_south_desert_offices_desc: "Every new seal lengthens the ladder but makes it stronger. Kadir and Eflor receive the same demand: accept a namestnik or answer to the army."
 NAM_south_desert_offices_tt: "§YKadir§! and §YEflor§! are told to become Svetlogorye namestnik offices. If a country refuses, we declare war on it for full annexation."
 NAM_south_oil_for_water: "Oil for Water"
 NAM_south_oil_for_water_desc: "Svetlogorye has fuel; the deserts have water and roads. The Oil Charter offers Fenn, Rakhma, Sardan and even Azhar a common agreement instead of endless bargaining."
 NAM_south_oil_for_water_tt: "§YFenn§!, §YRakhma§!, §YSardan§! and §YAzhar§! are invited to join Svetlogorye's alliance. Refusal does not lead to war."
 NAM_south_fenn_guarantee: "Fenn's Guarantee"
 NAM_south_fenn_guarantee_desc: "Eflor still regards Fenn as a rebel province. The charter demands that Eflor join the agreement on common terms and leave Fenn alone."
 NAM_south_fenn_guarantee_tt: "§YEflor§! is told to join the Oil Charter as a satellite. If it refuses, we declare war on it for full annexation."
 NAM_administration_dynamic: "Svetlogorye Chancellery"
 NAM_administration_dynamic_desc: "The namestnik ladder has become a government. Every reform changes the same chancellery: its signatures, budgets, oil fields and relations with the districts.\n\n\n\n\n\n £GFX_RUS_chancery_mandate_banner \n\n\n"
 NAM_garrison_dynamic: "Svetlogorye Garrisons"
 NAM_garrison_dynamic_desc: "Oilfield guards, crossroads columns and sea escorts add up to a single military tradition of Svetlogorye.\n\n\n\n\n\n £GFX_RUS_black_army_banner \n\n\n"
 NAM_seal_registry: "Register of Powers"
 NAM_seal_registry_desc: "Every seal receives a number, every namestnik a reporting deadline. The ladder the empire built now serves Svetlogorye and counts its money."
 NAM_namestnik_garrisons: "Namestnik Garrisons"
 NAM_namestnik_garrisons_desc: "A namestnik answers for order in his district and receives a permanent garrison. The soldiers know the ground, and the district knows whom it obeys."
 NAM_oil_quotas: "Oil Quotas"
 NAM_oil_quotas_desc: "The oil fields work to state quotas. The fuel reserve becomes an instrument of policy rather than a commodity for a chance buyer."
 NAM_ladder_of_seals: "Unified Administration"
 NAM_ladder_of_seals_desc: "The ladder is complete: every rung knows its place, every order its path. Now it can be extended beyond Svetlogorye."
 NAM_district_council: "Council of Districts"
 NAM_district_council_desc: "The districts receive a permanent council that approves the budget and audits the ministries. Slower, but decisions are made by those who will carry them out."
 NAM_oil_fund: "Oil Fund"
 NAM_oil_fund_desc: "Part of the oil revenue goes into the charter's common fund. It pays for deliveries to neighbours ready to bind their future to Svetlogorye."
 NAM_district_militia: "District Militia"
 NAM_district_militia_desc: "Every district keeps its own militia. It will not replace the army, but it will not give up its oil fields without a fight."
 NAM_common_fuel_market: "Common Fuel Market"
 NAM_common_fuel_market_desc: "The charter sets common rules for selling fuel. Neighbours buy by agreement, not at a namestnik's mercy."
 NAM_south_war_council: "War Council of the South"
 NAM_south_war_council_desc: "The War for the South needs one headquarters. The council brings district commanders, oil workers and allies to one table."
 NAM_south_oil_tap: "The Oil Tap"
 NAM_south_oil_tap_desc: "Shahrabad's furnaces burn foreign fuel. Cutting it off means stopping their factories before their armies."
 NAM_south_field_fortresses: "Oilfield Fortresses"
 NAM_south_field_fortresses_desc: "The Northern Deposits and the Svetlogorsk District become fortified zones. Every derrick must cost the enemy a division."
 NAM_south_counteroffensive: "Counteroffensive on the Furnaces"
 NAM_south_counteroffensive_desc: "The defence has bought time. Now Svetlogorye's army marches on the furnaces before Shahrabad recovers."
 NAM_south_heritage: "Heritage of the South"
 NAM_south_heritage_desc: "Svetlogorye secures its primacy in the south. The chancellery establishes common relations with satellites, namestnik offices and charter members, preserving their territories and local governments."
 NAM_south_war_council_idea: "War Council of the South"
 NAM_south_war_council_idea_desc: "A single headquarters coordinates districts and allies until the end of the War for the South."
 NAM_south_counteroffensive_idea: "Counteroffensive on the Furnaces"
 NAM_south_counteroffensive_idea_desc: "Svetlogorye's army attacks while the enemy's fuel runs out."
 NAM_district_audit: "District Audit"
 NAM_district_audit_desc: "Auditors climb the ladder of seals and return to the treasury what the districts held back."
 NAM_charter_fuel_aid: "Charter Fuel"
 NAM_charter_fuel_aid_desc: "The Oil Fund sends fuel to Svetlogorye's allies in the south."
 NAM_south_cut_fuel: "Cut the Fuel"
 NAM_south_cut_fuel_desc: "Caravans and pipelines leading to Shahrabad's furnaces are ordered to stop."
 NAM_charter_members_tt: "At least one southern state belongs to Svetlogorye's alliance"
 NAM_charter_fuel_aid_tt: "Every southern member of Svetlogorye's alliance receives §Y2500§! £fuel_texticon and §G+3%§! £stability_texticon."
 NAM_public_campaigns: "Voice of Svetlogorye"
 NAM_public_campaigns_desc: "Departmental newspapers, oilfield radio and district assemblies explain why Svetlogorye needs a single authority. As many campaigns run at once as there are open slots.\n\nFree campaign slots: §Y[?ADISCORD_available_campaign_slots|0]§!"
 NAM_campaign_slot_available_tt: "A campaign slot is free: §Y[?ADISCORD_available_campaign_slots|0]§!"
 NAM_campaign_second_slot_tt: "A second campaign slot opens for the §YVoice of Svetlogorye§!."
 NAM_campaign_oil_is_ours: "“The Oil Belongs to Svetlogorye”"
 NAM_campaign_oil_is_ours_desc: "Posters at the oil fields remind workers that the neighbours call this land their own. Every derrick is a border that must be defended."
 NAM_campaign_every_seal_counts: "“Every Seal Counts”"
 NAM_campaign_every_seal_counts_desc: "The chancellery publishes district reports and promises that no signature will vanish without trace. Order becomes visible."
 NAM_campaign_wages_on_time: "“Wages on Time”"
 NAM_campaign_wages_on_time_desc: "Newspapers print payment schedules, and inspectors make sure promises match the ledgers. People spend less on hoarding."
 NAM_campaign_ladder_holds: "“The Ladder Holds”"
 NAM_campaign_ladder_holds_desc: "The namestniks explain that the hierarchy protects everyone from the chaos of collapse. Signatures move faster, collections are fuller."
 NAM_campaign_charter_of_districts: "“Charter of the Districts”"
 NAM_campaign_charter_of_districts_desc: "The districts tell of schools, bridges and workshops built under the common charter. People take up common works more willingly."
 NAM_campaign_furnaces_threaten_the_desert: "“The Furnaces Threaten the Desert”"
 NAM_campaign_furnaces_threaten_the_desert_desc: "The chancellery portrays Shahrabad as a greedy cartel that wants to burn other people's oil in its furnaces. The south must choose whom to believe."
 NAM_supports: "Pillars of Svetlogorye"
 NAM_supports_desc:0 ""
 NAM_loyalty_dynamic: "Pillars of Svetlogorye"
 NAM_loyalty_dynamic_desc: "Svetlogorye's authority rests on five groups. Their support, weighted by their influence, determines the loyalty of the state."
 NAM_supports_council: "Council of Pillars"
 NAM_supports_council_desc: "Namestniks, oil workers, districts, garrisons and export houses sit at one table. Svetlogorye rests not on a single seal but on the balance of those who recognise it."
 NAM_supports_oil_compact: "Compact with the Oil Fields"
 NAM_supports_oil_compact_desc: "Oil workers receive job guarantees and a share of revenue. The export houses are unhappy, but the fields run without interruption."
 NAM_supports_export_houses: "Export Houses"
 NAM_supports_export_houses_desc: "The export houses receive the right to ship oil under long-term contracts. The treasury fills, and the oil fields feel sold."
 NAM_supports_balance: "Balance of Pillars"
 NAM_supports_balance_desc: "No group may become stronger than the state. The chancellery learns to concede a little to each."
 NAM_ladder_ending_iron: "Establish the New Order"
 NAM_ladder_ending_iron_desc: "The ladder becomes the state. The namestniks gain more power than they ever held under the empire."
 NAM_ladder_ending_service: "Proclaim the Republic"
 NAM_ladder_ending_service_desc: "§YCivic Reforms§!\n\nThe ladder turns into a civil service. The districts and oil fields gain more weight in government."
 NAM_charter_ending_federation: "Establish the Federation"
 NAM_charter_ending_federation_desc: "§YDistrict Self-Government§!\n\nThe districts gain the decisive voice in the state. The namestnik ladder is left in the past."
 NAM_charter_ending_oil_union: "Establish the Union"
 NAM_charter_ending_oil_union_desc: "§YRule of the Oil Workers§!\n\nThe oil fields become the heart of the state. Oil workers gain weight they never had before."
