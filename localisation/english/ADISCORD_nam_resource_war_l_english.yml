 NAM_exile_drill_refund_tt: "Drill interrupted: §G30§! loot returns. Political power is not refunded."
 NAM_order_marines: "Marine Order"
 NAM_order_marines_desc: "The loot covers the equipment, the islands provide the men. A trained marine division appears on the day the war of return begins: the first goes into the landing at South Harbour, the others are formed at the island capital. Before the war the order can be cancelled with the loot and the men returned."
 NAM_cost_order_marines: "§Y50§! loot §Y4300§! £manpower_texticon"
 NAM_cost_order_marines_blocked: "§R50§! loot §R4300§! £manpower_texticon"
 NAM_cost_order_marines_tooltip: "§Y50§! loot §Y4300§! £manpower_texticon\nBefore the war of return, the loot and the men return when the order is cancelled."
 NAM_marine_slot_free_tt: "Another division can be trained: §Y[?NAM_marine_orders_paid|0]§! of §Y[?NAM_marine_order_cap|0]§! trained, never more than §Y3§!; the war of return has not begun"
 NAM_order_marines_tt: "Loot: §R-50§!.\nA fully equipped marine division appears on the day the war of return begins."
 NAM_order_marines_release: "Cancel the Marine Orders"
 NAM_order_marines_release_desc: "Dismiss the trained marine divisions before the war of return begins."
 NAM_order_marines_release_tt: "Each of the §Y[?NAM_marine_orders_paid|0]§! trained divisions returns §G50§! loot and §G4300§! £manpower_texticon."
 ADISCORD_nam_resource_war.90.t: "The Flotilla Returns"
 ADISCORD_nam_resource_war.90.d_success: "The flotilla came back to harbour with its holds down to the waterline. Off the coast of [NAM_pirate_target.GetName] it intercepted a convoy, took its fuel and left before the escort arrived. On the islands the loot is already being shared out, and men retell how the captains raised Svetlogorye's old flag over the captured ships."
 ADISCORD_nam_resource_war.90.d_prize: "The islands have never seen such a prize. Off the coast of [NAM_pirate_target.GetName] the flotilla boarded a whole caravan: fuel, crates of rifles and the ships themselves, which now sail under our flag. The captains were greeted on the pier as heroes, and the harbour taverns already sing of the next raid."
 ADISCORD_nam_resource_war.90.d_failure: "The flotilla came back empty-handed. Off the coast of [NAM_pirate_target.GetName] the convoy sailed under a strong escort, and the raiders came under fire as soon as they appeared on the horizon. The captains blame traitors in the ports, the sailors blame the captains. The exile's fleet is too small to lose ships and men on every failed sortie."
 ADISCORD_nam_resource_war.90.a: "Enter it in the log."
 NAM_pirate_report_haul_tt: "Loot: §G+[?NAM_pirate_last_loot|0]§!, §Y[?NAM_pirate_loot|0]§! in total.\nNotoriety: §Y[?NAM_pirate_notoriety|0]§! / 100."
 NAM_pirate_report_ship_lost_tt: "A patrol ship was lost.\nNotoriety: §Y[?NAM_pirate_notoriety|0]§! / 100."
 NAM_pirate_report_crew_lost_tt: "§R1000§! £manpower_texticon lost.\nNotoriety: §Y[?NAM_pirate_notoriety|0]§! / 100."
 ADISCORD_nam_resource_war.91.t: "Svetlogorsk Pirates"
 ADISCORD_nam_resource_war.91.d: "The captains of our convoys report an attack on the open sea. The attackers made no secret of who they were: the flag of Svetlogorye's government in exile flew over their ships. Part of the cargo is lost, the insurers are raising their prices, and the harbour offices demand that the government protect our shipping."
 ADISCORD_nam_resource_war.91.a: "Strengthen the convoy escorts."
 ADISCORD_nam_resource_war.92.t: "Blockade of the Islands"
 ADISCORD_nam_resource_war.92.d: "The coalition's squadrons have dropped anchor at the entrance to the island harbours. Their commander sent an ultimatum with the very first launch: every vessel under Svetlogorye's flag that puts to sea will be treated as a pirate and sunk without warning. The fishermen stay ashore, the merchants turn their ships towards foreign ports.\n\nThe flotilla captains propose to wait until the coalition's attention slackens. The treasurer knows whom on the squadron staff one can pay for blind nights. And in the barracks men say ever louder that the blockade proves only one thing: the enemy fears us."
 ADISCORD_nam_resource_war.92.a: "Lie low."
 ADISCORD_nam_resource_war.92.b: "Pay for blind nights."
 ADISCORD_nam_resource_war.92.c: "Let them blockade."
 NAM_pirate_92_a_tt: "Notoriety: §G-15§!.\nNo raids for §Y60§! days."
 NAM_pirate_92_b_tt: "Loot: §R-50§!.\nNotoriety: §G-10§!."
 NAM_pirate_92_c_tt: "Blockade of the islands for §Y90§! days: fuel gain §R-25%§!, trade income §R-15%§!, weaker convoy raiding and more failed raids.\nReadiness for the return: §G+5§!."
 ADISCORD_nam_resource_war.93.t: "Punitive Raid"
 ADISCORD_nam_resource_war.93.d: "At dawn the coalition's ships opened fire on the capital of the exile. Shells fell on the harbour and on the warehouses by the piers, the sheds caught fire, the old lighthouse collapsed. A few hours later a demand came from the flagship: hand over the captains who led the flotillas and surrender the loot, or the shelling will be repeated and a landing will follow.\n\nRom's advisers disagree. Some urge putting to sea everything that floats. Others think a few surrendered captains a small price for the life of the islands. Still others propose scattering the flotilla among distant coves and disappearing for a long time."
 ADISCORD_nam_resource_war.93.a: "Give battle."
 ADISCORD_nam_resource_war.93.b: "Hand over the captains."
 ADISCORD_nam_resource_war.93.c: "Scatter the flotilla."
 NAM_pirate_93_a_tt: "Even odds: repel the raid (navy experience §G+5§!, readiness for the return §G+5§!) - or lose a patrol ship and §R1000§! £manpower_texticon.\nNotoriety: §R+5§!."
 NAM_pirate_93_b_tt: "Loot: §R-40%§!.\nNotoriety: §G-25§!.\nReadiness for the return: §R-5§!."
 NAM_pirate_93_c_tt: "Notoriety: §G-15§!.\nNo raids for §Y90§! days."
 ADISCORD_nam_resource_war.94.t: "Landing at South Harbour"
 ADISCORD_nam_resource_war.94.d: "The transports approached South Harbour in the pre-dawn fog along the same fairways by which the fleet had once left for exile. The marines jumped straight into the cold water and ran over the stones to the piers where our guns had once been pushed into the sea. The enemy garrison woke to gunfire already on the embankment.\n\nThe return began where the flight ended. The islands now hold a beachhead on the mainland, and the coming days will decide everything: whether the coalition can throw the landing back into the sea, or Svetlogorye stands on its own land again."
 ADISCORD_nam_resource_war.94.a: "For Svetlogorye!"
 NAM_landing_report_tt: "Beachhead taken: South Harbour is under our control and the enemy garrison has been thrown back.\nMarine divisions landed at South Harbour: §Y[?NAM_marines_landed|0]§!.\nTrained divisions taken into service: §Y[?NAM_marines_orders_delivered|0]§!."
 NAM_landing_island_tt: "The landing is limited to §Y3§! divisions: another §Y[?NAM_marines_island|0]§! trained divisions were formed at the island capital."
 NAM_pirate_blockade: "Blockade of the Islands"
 ADISCORD_tech_svetlogorsk_marine_corps: "Svetlogorsk Marine Corps"
 ADISCORD_tech_svetlogorsk_marine_corps_desc: "Battalions of the exile, trained to land from the sea and take piers under fire."
 # Focus trees: colony and exile
 # ----- Main tree: colony (before the collapse) -----
 NAM_wrk_trade_house:0 "A Trade House in the Metropole"
 NAM_wrk_trade_house_desc:0 "For years our oil offices traded through other people's agents. We will open our own house in Vorkerland: our warehouses, our clerks and the right to sign contracts in the name of Svetlogorye."
 NAM_wrk_return_cargo:0 "Return Voyages"
 NAM_wrk_return_cargo_desc:0 "The tankers leave for the metropole full and come back empty. Let them carry machine tools on the way back: South Harbour has the hands for a new factory."
 NAM_colonial_watch:0 "Colonial Watch Reports"
 NAM_colonial_watch_desc:0 "The colonial watch writes reports that nobody reads. We will gather them into one summary: where pipes are cut, who prints the leaflets and where Veter's people go."
 NAM_imperial_gendarmes:0 "Imperial Gendarmerie"
 NAM_imperial_gendarmes_desc:0 "We will ask the metropole for gendarmes. They do not know our fields and will not ask who is guilty, but the underground will fall silent for a long time. The districts will not forgive it."
 NAM_oilfield_militia:0 "Oilfield Self-Defence"
 NAM_oilfield_militia_desc:0 "The drillers know better than any guard who walks near the rigs at night. We will hand rifles to the crews and let them guard their own fields."
 NAM_pipeline_patrols:0 "Pipeline Linesmen"
 NAM_pipeline_patrols_desc:0 "The underground strikes the pipes because nobody guards them. Linesmen with dogs and a telephone post on every verst will save both the oil and the roads to Klyuchevsk."
 NAM_print_shop_raid:0 "Veter's Print Shop"
 NAM_print_shop_raid_desc:0 "The underground's leaflets are printed somewhere near the capital. We will find the press and those who carry the type: every captured typesetter tells more than ten leaflets."
 NAM_colony_order:0 "Order on the Fields"
 NAM_colony_order_desc:0 "The fields work without interruption again, and buyers in the metropole notice it. A quiet year is worth more than any promise in a letter."
 # ----- Main tree: colony tooltips -----
 NAM_wrk_trade_level_up_tt:0 "Standing of our trade houses in the metropole: §G+1§! (at most §Y3§!). It raises the payment for a fuel shipment and the income of the trade concession."
 NAM_grp_wrk_trade_house_tt:0 "Group support:\n  Export houses: §G+6§! £NAM_support_trade_texticon\n  Namestniks: §R-3§! £NAM_support_nam_texticon"
 NAM_colonial_watch_tt:0 "Veter's underground: §G-5§!."
 NAM_imperial_gendarmes_tt:0 "Veter's underground: §G-12§!."
 NAM_grp_imperial_gendarmes_tt:0 "Group support:\n  Namestniks: §G+6§! £NAM_support_nam_texticon\n  Districts: §R-5§! £NAM_support_dist_texticon"
 NAM_oilfield_militia_tt:0 "Veter's underground: §G-6§!."
 NAM_grp_oilfield_militia_tt:0 "Group support:\n  Oil workers: §G+5§! £NAM_support_oil_texticon\n  Districts: §G+4§! £NAM_support_dist_texticon\n  Namestniks: §R-4§! £NAM_support_nam_texticon"
 NAM_pipeline_patrols_tt:0 "Veter's underground: §G-5§!."
 NAM_print_shop_raid_tt:0 "Veter's underground: §G-8§!."
 # ----- Defeated tree: island exile -----
 NAM_exile_island_government:0 "A Government on the Islands"
 NAM_exile_island_government_desc:0 "The mainland is lost, but the seals, the treasury and the flag crossed the strait. While a government sits on the islands, Svetlogorye has not surrendered - it is waiting."
 NAM_exile_mainland_contacts:0 "Couriers to the Mainland"
 NAM_exile_mainland_contacts_desc:0 "Our people stayed on the fields: foremen, teachers, former clerks. Fishing boats will carry letters and money to them and bring back news of the new masters."
 NAM_exile_armed_underground:0 "The Armed Underground"
 NAM_exile_armed_underground_desc:0 "Reports are not enough; we need deeds. The underground will receive weapons and start burning depots and cutting lines at the Northern Deposits and in South Harbour."
 NAM_exile_civic_underground:0 "Lists of the Loyal"
 NAM_exile_civic_underground_desc:0 "Not everyone who stayed is ready to shoot, but many are ready to wait. We will draw up lists of the loyal - those who will open the gates and take over the offices on the day of the return."
 NAM_exile_harbour_pilots:0 "Pilots of South Harbour"
 NAM_exile_harbour_pilots_desc:0 "A landing at South Harbour would be ruined by shoals, not guns. Pilots who fled to the islands will chart the fairways and lead the transports to the quays."
 NAM_exile_voice_of_svetlogorye:0 "The Voice of Svetlogorye"
 NAM_exile_voice_of_svetlogorye_desc:0 "Every evening the island transmitter reads the names of the towns we will take back. It is heard in Svetlogorsk kitchens and in the occupiers' barracks."
 NAM_exile_klyuchevsk_strike:0 "The Klyuchevsk Strike"
 NAM_exile_klyuchevsk_strike_desc:0 "The new masters of Klyuchevsk want our oil. The drillers will stop the rigs, and every week of the strike will cost them more than any raid."
 NAM_exile_return_council:0 "Council of the Return"
 NAM_exile_return_council_desc:0 "The underground, the army and the fleet sit at one table. The council of the return will set the day of the landing and divide the work on the mainland."
 NAM_exile_home_harbour:0 "Back in South Harbour"
 NAM_exile_home_harbour_desc:0 "The government returns to the old capital. The quays are broken and the warehouses empty, but our flag flies over the chancellery again. We start with the port and the roads."
 NAM_exile_general_staff:0 "A Staff in Exile"
 NAM_exile_general_staff_desc:0 "We will form a staff from the surviving officers. It has no regiments, but it has maps of the mainland and the time to teach recruits to fight."
 NAM_exile_landing_craft:0 "Landing Barges"
 NAM_exile_landing_craft_desc:0 "Fishing barges and coasters will be refitted to carry troops. Without them the army of the return stays on the islands."
 NAM_exile_cadre_army:0 "A Cadre Army"
 NAM_exile_cadre_army_desc:0 "A small but trained army: every soldier went through the resource war and knows what he fights for. The garrisons will back this choice."
 NAM_exile_levy_of_exiles:0 "Levy of the Exiles"
 NAM_exile_levy_of_exiles_desc:0 "There are more refugees on the islands than soldiers. Everyone who can hold a rifle goes under arms, even if the islands tire of the call-up."
 NAM_exile_arms_purchases:0 "Arms Purchases"
 NAM_exile_arms_purchases_desc:0 "The island treasury paid for a lot of rifles, guns and equipment before the defeat. It is time to collect it from the brokers' warehouses."
 NAM_exile_marine_orders:0 "Marines"
 NAM_exile_marine_orders_desc:0 "The landing will be opened by naval riflemen, not line regiments. We open orders for marine battalions and issue their first equipment."
 NAM_exile_strike_from_the_sea:0 "Strike from the Sea"
 NAM_exile_strike_from_the_sea_desc:0 "The landing will deliver the main blow. More marines and more transports - and South Harbour falls before the coalition can bring up its reserves."
 NAM_exile_strike_from_within:0 "Strike from Within"
 NAM_exile_strike_from_within_desc:0 "The landing will be small, but it will be met. Staff officers will cross to the mainland and prepare a rising for the day of the landing."
 NAM_exile_landing_school:0 "Landing School"
 NAM_exile_landing_school_desc:0 "On the island beaches we drill the landing: embarkation, crossing, going ashore under fire. Every battalion must pass it at least once."
 NAM_exile_army_of_return:0 "The Army of the Return"
 NAM_exile_army_of_return_desc:0 "The regiments are trained, the weapons issued, the barges wait at the quays. The army of the return has one task, and it knows where to carry it out."
 NAM_exile_sea_raiders:0 "Sea Hunters"
 NAM_exile_sea_raiders_desc:0 "Our fleet is small, but coalition ships sail without escort. The first hunters put to sea for other people's cargo."
 NAM_exile_fences:0 "Fences for the Loot"
 NAM_exile_fences_desc:0 "Captured cargo must become money. The harbour fences on the islands ask no questions when they are paid in advance."
 NAM_exile_letters_of_marque:0 "Letters of Marque"
 NAM_exile_letters_of_marque_desc:0 "The government issues letters to the captains: they fight under our flag and only against our enemies. The coalition will call it piracy, but foreign ports will treat us more calmly."
 NAM_exile_free_brotherhood:0 "The Free Brotherhood"
 NAM_exile_free_brotherhood_desc:0 "The captains choose their prey and share with the treasury. The catch is richer and the crews larger, but every port will talk about us."
 NAM_exile_tanker_raids:0 "Hunting the Tankers"
 NAM_exile_tanker_raids_desc:0 "Foreign tankers now carry our oil out of South Harbour. We will intercept them at the mouth of the strait - the oil will come back to us at least this way."
 NAM_exile_black_market:0 "Black Market for Arms"
 NAM_exile_black_market_desc:0 "The fences know where rifles are sold without papers. Loot buys what money cannot."
 NAM_exile_privateer_captains:0 "Privateer Captains"
 NAM_exile_privateer_captains_desc:0 "The best captains get real warships: two escort ships from the island yard become the core of the raiding fleet."
 NAM_exile_hidden_anchorages:0 "Hidden Anchorages"
 NAM_exile_hidden_anchorages_desc:0 "In the bays of the small islands we fit out anchorages the coalition does not know about. Raiders will return there instead of the main port."
 NAM_exile_raider_squadron:0 "Raider Squadron"
 NAM_exile_raider_squadron_desc:0 "A light cruiser can scatter any coalition convoy. It is seen from afar, but nobody can outrun it."
 NAM_exile_wolfpacks:0 "Wolfpacks"
 NAM_exile_wolfpacks_desc:0 "Submarines strike unseen and leave before the escort arrives. The coalition will have a harder time telling where the trouble comes from."
 NAM_exile_corsair_admiralty:0 "Privateer Admiralty"
 NAM_exile_corsair_admiralty_desc:0 "Scattered crews become a fleet. The admiralty will assign the raids and prepare the ships to escort the landing."
 NAM_exile_island_chancellery:0 "Island Chancellery"
 NAM_exile_island_chancellery_desc:0 "The ministries are crowded into harbour offices. We will house the chancellery properly and build roads from the capital to the quays."
 NAM_exile_free_port:0 "A Free Port"
 NAM_exile_free_port_desc:0 "We open the harbour to every trader without duties. The treasury gets its fees, the export houses get work, and we get ships of our own."
 NAM_exile_naval_port:0 "A Naval Port"
 NAM_exile_naval_port_desc:0 "The harbour belongs to the fleet, not to traders. We will build a yard and close the quays to foreign ships."
 NAM_exile_refugee_census:0 "Census of the Refugees"
 NAM_exile_refugee_census_desc:0 "Hundreds of thousands fled to the islands. We will register everyone: who can work, who can serve, who needs a roof."
 NAM_exile_island_lines:0 "Inter-Island Lines"
 NAM_exile_island_lines_desc:0 "The islands are joined only by the sea. Quays, roads to them and a ferry timetable will turn the archipelago into one country."
 NAM_exile_refugee_barracks:0 "Refugee Barracks"
 NAM_exile_refugee_barracks_desc:0 "The refugees will live in barracks next to the training camps. It is cramped and hard, but every man from the barracks will join the army of the return."
 NAM_exile_refugee_homesteads:0 "Island Homesteads"
 NAM_exile_refugee_homesteads_desc:0 "We will give the refugees land and work near the capital. They will put down roots, and the islands will become a home rather than a camp."
 NAM_exile_coastal_batteries:0 "Coastal Batteries"
 NAM_exile_coastal_batteries_desc:0 "The coalition may come here as well. Coastal batteries will cover the main harbours of the islands."
 NAM_exile_island_steel:0 "Island Steel"
 NAM_exile_island_steel_desc:0 "The island mines worked at half strength while oil decided everything. Now every rifle depends on them."
 NAM_exile_island_foundry:0 "The Foundry"
 NAM_exile_island_foundry_desc:0 "Island steel will no longer be sold abroad. A foundry beside the mine will give the army weapons of its own."
 NAM_exile_overseas_districts:0 "Overseas Districts"
 NAM_exile_overseas_districts_desc:0 "The islands are no longer a colony of a colony. Their people feed, arm and defend Svetlogorye and receive the same rights as the mainland."
