 NAM_bw_port_guidance:0 "Order the terminal and pipeline in government programmes. Their current status is shown here."
 NAM_bw_export_detail:0 "§YOIL DELIVERIES§!\nThroughput: §Y[?NAM_oil_throughput|0]§! units.\nCommitted: §Y[?NAM_oil_committed|0]§!; contracts: §Y[?NAM_oil_contracts|0]§![NAMBasinTribute].\nFree: land §Y[?NAM_oil_free_land_units|0]§!, sea §Y[?NAM_oil_free_units|0]§!.\n\n§YCUSTOMERS AND RESTRICTIONS§!\nCustomers: [NAMBasinClientsNone][EFL.NAMBasinClient][AZH.NAMBasinClient][VAL.NAMBasinClient][STP.NAMBasinClient][STS.NAMBasinClient][RHM.NAMBasinClient][MZR.NAMBasinClient][SHL.NAMBasinClient][RUS.NAMBasinClient][WEF.NAMBasinClient][KDR.NAMBasinClient][SDR.NAMBasinClient][GLP.NAMBasinClient][KYZ.NAMBasinClient]\nEmbargoes: [NAMBasinEmbargoNone][EFL.NAMBasinEmbargo][AZH.NAMBasinEmbargo][SHL.NAMBasinEmbargo]\n\n§YISLAND AGREEMENTS§!\nSteel levy: [NAMBasinLevy].\nConvoy line: [NAMBasinConvoy].\n[231.GetName] concession: [NAMBasinConcession231].\n\n§YCONTRACT TERMS§!\nOne capacity unit serves one permanent delivery.\nEach month: §Y15000§! £fuel_texticon for the buyer, §G40§! £ADISCORD_economy_treasury_texticon for the treasury. Without fuel in stock, both delivery and payment are skipped for that month.\nThe South Harbour sea terminal serves overseas customers only. Contracts, embargoes and islands are managed in their own decision sections.\nAn active export dispatch office adds §G+30§! £ADISCORD_economy_treasury_texticon for each completed monthly delivery."
 NAM_bw_summary_compact:0 "Capacity §Y[?NAM_oil_throughput|0]§! - committed §Y[?NAM_oil_committed|0]§!, contracts §Y[?NAM_oil_contracts|0]§![NAMBasinTribute].\nFree: land §Y[?NAM_oil_free_land_units|0]§!, overseas §Y[?NAM_oil_free_units|0]§!. Projects §Y[?NAM_projects_in_progress|0]§! / §Y[?NAM_project_slots|0]§!.\nEmbargoes: [NAMBasinEmbargoNone][EFL.NAMBasinEmbargo][AZH.NAMBasinEmbargo][SHL.NAMBasinEmbargo]\nIsland levy: [NAMBasinLevy]; convoys: [NAMBasinConvoy].\n[231.GetName] concession: [NAMBasinConcession231]."
