 NAM_grp_oilfield_militia_tt:0 "Group support:\n  Oil workers: §G+5§! £NAM_support_oil_texticon\n  Districts: §G+4§! £NAM_support_dist_texticon\n  Namestniks: §R-4§! £NAM_support_nam_texticon"
