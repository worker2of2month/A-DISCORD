 NAM_cost_line_tooltip: "§Y30§! £political_power_texticon §Y100§! £ADISCORD_economy_treasury_texticon\nThe treasury is refunded if the work is interrupted."
 NAM_line_slot_free_tt: "A defence-line slot is free: §Y[?NAM_lines_in_progress|0]§! of §Y[?NAM_line_slots|0]§! in use"
 NAM_line_started_tt: "Treasury: §R-100§! £ADISCORD_economy_treasury_texticon; the deposit returns if the work is interrupted.\nOne defence-line slot is occupied."
 NAM_line_built_tt: "If the district is still ours, every province on its border with another country receives fortifications of level §Y1§!, and border towns with victory points receive level §Y2§!. Otherwise the deposit returns to the treasury."
 NAM_line_refund_tt: "Work interrupted: §G100§! £ADISCORD_economy_treasury_texticon return to the treasury and the slot is released."
 NAM_scorch_wells: "Scorch the Wells"
 NAM_scorch_wells_desc: "§YCOST§!: §Y20§! £political_power_texticon\n§YDURATION§!: §Y180§! £time_texticon days\n\n§YRESULT§!\nThe field produces nothing for us or its next owner.\nField condition falls to §R10 / 100§!; recovery requires a separate programme.\nOil worker support: §R-10§! £NAM_support_oil_texticon. Seal discipline: §R-5§!."
 NAM_scorch_threat_tt: "The front has reached the field: part of the district or a neighbouring district is held by the enemy"
 NAM_scorch_wells_tt: "The deposit yields no resources for §Y180 days§!, whoever owns it; the field's condition falls to §Y10§!.\nOil workers: §R-10§! £NAM_support_oil_texticon.\nSeal discipline: §R-5§!."
 NAM_hold_field_67: "Hold the Northern Deposits"
 NAM_hold_field_67_desc: "§YDEADLINE§!: §Y120§! £time_texticon days\n\n§YRESULT§!\nIf the field remains under our control at the deadline while the resource war continues:\n- §G+3000§! £fuel_texticon.\n- §G+3%§! £war_support_modifiericons_texticon.\n- Seal discipline: §G+10§!.\n\n§YIF THE FIELD IS LOST§!\nThe order ends without a reward."
 NAM_hold_field_689: "Hold the South Coast"
 NAM_hold_field_689_desc: "§YDEADLINE§!: §Y120§! £time_texticon days\n\n§YRESULT§!\nIf the field remains under our control at the deadline while the resource war continues:\n- §G+3000§! £fuel_texticon.\n- §G+3%§! £war_support_modifiericons_texticon.\n- Seal discipline: §G+10§!.\n\n§YIF THE FIELD IS LOST§!\nThe order ends without a reward."
