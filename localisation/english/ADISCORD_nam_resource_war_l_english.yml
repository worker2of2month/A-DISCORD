 NAM_order_release_tt: "Every prepared formation is disbanded. The recruits, each order's treasury price in £ADISCORD_economy_treasury_texticon and §Y3000§! £fuel_texticon for every motorised division are returned."
 NAM_prepare_line: "Prepare a Defence Line"
 NAM_prepare_line_desc: "§YCOST§!: §Y30§! £political_power_texticon §Y100§! £ADISCORD_economy_treasury_texticon\n§YCOMPLETION§!: §Y35§! £time_texticon days\n\n§YRESULT§!\nField fortifications along the district's border with other countries. Requires a land border and a free defensive-line slot.\n\n§YIF THE DISTRICT IS LOST§!\nUnfinished works refund the treasury deposit. A lost line can be prepared again after recovering the district."
 NAM_cost_line: "§Y30§! £political_power_texticon §Y100§! £ADISCORD_economy_treasury_texticon"
