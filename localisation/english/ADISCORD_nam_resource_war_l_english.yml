 ADISCORD_nam_resource_war.80.t: "The Centre Is Gone"
 ADISCORD_nam_resource_war.80.d: "The duty signalman brought the first report of the collapse of the central administration. Rom asked whether the government channel had confirmed it. The signalman said that was the channel he was trying to reach. Another message arrived an hour later, then a third; they still named the same offices, but different men in charge. Nobody could say which order was the latest.\n\nRom asked that the flags remain in place until the meeting. In his youth he had seen how quickly officials learned to address new masters. Back then he only had to wait until it was clear whose orders to copy. Now the people in his waiting room needed his decision: the port wanted permission to ship oil, the garrison wanted its supplies confirmed, and the governors wanted to know who was responsible for collecting revenue. Rom told his secretary to invite them all in.\n\nMezentsev began with the tankers. The cargo had been prepared under the old quotas, but nobody could confirm payment from the capital. Shipping it now meant putting the risk on the local treasury; holding it meant answering to the captains and oilfield administrations. Someone suggested asking the ministry again. Rom asked who there would receive the enquiry. There was no answer.\n\nOver the years he had often imagined Svetlogorye without supervision from the capital. In those thoughts there was usually time to reach agreement with the districts, build up reserves and speak to the neighbours. Now everything needed attention at once. Eflor and Azhar remembered how these fields had passed into Vorkerland's hands. Weber's underground operated in the city. None of those disputes had ended with the metropole.\n\nRom pulled his chair closer to the table so that he could see those seated at either end.\n- Let us start with the port. What are our obligations concerning these ships?"
 ADISCORD_nam_resource_war.80.d_successor: "After the collapse of the central administration, government channels stopped confirming orders. Conflicting reports arrive from Vorkerland about new officials and headquarters. The port requests permission to ship oil, and the garrisons want their supplies confirmed. Quotas and payments with the metropole no longer rest on a common government.\n\nGovernors, commandants and district representatives have gathered for a meeting. They must determine who is responsible for local revenues and existing commitments. Eflor and Azhar maintain their claims to the fields, and Weber's underground maintains its demands on the administration. The collapse of the centre has settled none of these disputes.\n\nSvetlogorye must make its own decisions about government and independence. Colonial directives cease to apply; relations between local institutions must be established anew."
 ADISCORD_nam_resource_war.80.a: "We are on our own."
 NAM_center_vanished_tt:0 "Colonial programmes close: the metropolitan concession stops paying and the \"Colony of Vorkerland\" category disappears.\nCompleting \"The Calm Before the Storm\" makes independent Svetlogorye preparation branches available.\nThe chancellery will next meet to sign the declaration of independence."
 ADISCORD_nam_resource_war.81.t: "Flight to the Islands"
 ADISCORD_nam_resource_war.81.d: "The last transports left South Harbour at night, without lights. On the piers stayed those for whom there was no room: companies that fought their way from the northern fields too late, supply columns, wounded men who could not be carried up the gangways. Officers called names from the lists, and every line struck through meant a man left to the mercy of the victors.\n\nThere was nowhere to load the equipment. It was pushed off the piers straight into the water: guns, lorries, crates of rifles and ammunition. Quartermasters signed write-off reports until a glow rose over the port - Rom had ordered that the enemy should not find a single working barrel. The sappers left last. Behind them pumping stations burned, gantries fell and the depots on the oilfields went up in flames. The coalition will get our land, but it will get it scorched.\n\nAt dawn the islands met the exiles with a cold wind and empty barracks. There is no oil here and almost no industry, only steel, harbours and the sea. The government of Svetlogorye lives as long as its flag flies over the islands. What remains is to decide what it will become: a refuge for the defeated or a springboard for the return. The decision cannot wait - the officers from the piers and Weber's people are already walking to the old customs house, where the council is called."
 ADISCORD_nam_resource_war.81.a: "We will return to South Harbour."
 ADISCORD_nam_resource_war.81.b: "First, survive."
 NAM_exile_evacuation_tt: "Evacuation: of §Y[?NAM_exile_divisions_before|0]§! divisions, §R[?NAM_exile_divisions_lost|0]§! were left on the mainland. §Y[?NAM_exile_divisions_after|0]§! divisions are in exile: those that crossed kept their own composition and are gathered at the island capital.\nThere are not enough weapons for everyone: every division on the islands has lost §R45%§! of its strength and §R50%§! of its organisation.\nDumped into the sea: §R[?NAM_exile_rifles_dumped|0]§! £infantry_equipment_texticon and §R[?NAM_exile_heavy_dumped|0]§! units of support equipment and artillery.\nThe oilfields, roads and South Harbour are burnt: the fields yield no resources to their new owners for §Y180§! days."
 NAM_exile_vow_tt: "Readiness for the return: §G+10§!."
 NAM_exile_salvage_tt: "Salvaged cargo: §G+40§! loot."
 ADISCORD_nam_resource_war.82.t: "Weber's Leaflets"
 ADISCORD_nam_resource_war.82.d: "In the morning the workers of the Northern Deposits found leaflets in every changing room, in the canteen and even in the foreman's hut. There is one signature - Yaroslav Weber. The text is short: the oilfields belong to those who work them, and the governors are temporary guests it is time to see off. The gendarmes tore the leaflets down by noon, but by evening they were being retold in every workers' settlement.\n\nThe underground no longer hides in cellars. It has printing presses, couriers and its own people in the oilfield offices. The chancery awaits a decision: go through the lists before the network grows, or buy off the districts before their discontent becomes someone else's banner."
 ADISCORD_nam_resource_war.82.a: "Arrests from the gendarmerie lists."
 ADISCORD_nam_resource_war.82.b: "Money for the districts' schools and hospitals."
 ADISCORD_nam_resource_war.82.c: "Paper will put up with anything."
 NAM_ug_82_a_tt: "Underground: §G-10§!.\nDistrict support: §R-5§! £NAM_support_dist_texticon."
 NAM_ug_82_b_tt: "Treasury: §R-100§! £ADISCORD_economy_treasury_texticon.\nUnderground: §G-5§!.\nDistrict support: §G+6§! £NAM_support_dist_texticon."
 NAM_ug_ignore_tt: "The underground keeps growing."
 ADISCORD_nam_resource_war.83.t: "Strike on the Oilfields"
 ADISCORD_nam_resource_war.83.d: "The pumps stopped in three shifts at once. The strike committee, behind which everyone sees Weber's hand, demands the withheld wages, the cancellation of the governors' fines and the release of the arrested. Until the demands are met, the oil will go neither into tank cars nor into tankers.\n\nThe garrisons are ready to drive the workers back by force, but their commanders warn that every arrest turns a silent sympathiser into a fighter of the underground. The oilmen are counting their losses and ask for the matter to be settled by the end of the week."
 ADISCORD_nam_resource_war.83.a: "Break up the committee, arrest the ringleaders."
 ADISCORD_nam_resource_war.83.b: "Pay the debts and cancel the fines."
 ADISCORD_nam_resource_war.83.c: "Wait until their money runs out."
 NAM_ug_83_a_tt: "Underground: §G-15§!.\nDistrict support: §R-10§! £NAM_support_dist_texticon."
 NAM_ug_83_b_tt: "Treasury: §R-200§! £ADISCORD_economy_treasury_texticon.\nUnderground: §G-8§!.\nDistrict support: §G+8§! £NAM_support_dist_texticon.\nOil worker support: §G+4§! £NAM_support_oil_texticon."
 NAM_ug_83_c_tt: "Oil worker support: §R-6§! £NAM_support_oil_texticon."
 ADISCORD_nam_resource_war.84.t: "The City Is Ready to Rise"
 ADISCORD_nam_resource_war.84.d: "The gendarmerie reports no longer read like reports: they are a map of the coming uprising. In Svetlogorsk weapons are kept in cellars and attics, Weber has his own block commanders, and after sunset the patrols avoid the workers' quarters. A single shot would be enough to bring the city into the streets.\n\nThe commandant asks to send troops into the city and declare martial law. Rom's advisers whisper something else: Weber is still ready to talk if given a reason. Delay means only one thing - the next spark may be the last."
 ADISCORD_nam_resource_war.84.a: "Send the garrisons into Svetlogorsk."
 ADISCORD_nam_resource_war.84.b: "Open a secret channel to Weber."
 ADISCORD_nam_resource_war.84.c: "Wait."
 NAM_ug_84_a_tt: "Underground: §G-20§!.\nGarrison support: §G+5§! £NAM_support_garr_texticon.\nDistrict support: §R-10§! £NAM_support_dist_texticon.\nIf the ladder of seals already exists, it shifts §Y0.05§! towards the vertical."
 NAM_ug_84_b_tt: "Treasury: §R-150§! £ADISCORD_economy_treasury_texticon.\nUnderground: §G-15§!.\nDistrict support: §G+8§! £NAM_support_dist_texticon.\nNamestnik support: §R-8§! £NAM_support_nam_texticon."
 NAM_ug_84_c_tt: "Underground: §R+5§!."
 ADISCORD_nam_resource_war.85.t: "Fire on the Oilfield"
 ADISCORD_nam_resource_war.85.d: "During the night a trunk pipeline valve exploded on the oilfield in [NAM_ug_field.GetName]. The firemen put out the flames only by morning, but two wells burnt out and the pumping station stands without a roof. On the scorched wall someone had chalked the familiar sign of the underground.\n\nThe field manager asks for money for repairs, the gendarmes for permission to raid the surrounding settlements. The governor advises calling it an accident: to admit sabotage is to admit that Weber can strike anywhere."
 ADISCORD_nam_resource_war.85.a: "Repair crews, at once."
 ADISCORD_nam_resource_war.85.b: "Raids on the surrounding settlements."
 ADISCORD_nam_resource_war.85.c: "Put it down to worn equipment."
 NAM_ug_85_a_tt: "The fire has already damaged the field. Base damage is §R15§! condition points; reinforced security in effect at the time halves it.\nTreasury: §R-100§! £ADISCORD_economy_treasury_texticon.\nField condition: §G+10§!.\nOil worker support: §G+3§! £NAM_support_oil_texticon."
 NAM_ug_85_b_tt: "The fire has already damaged the field. Base damage is §R15§! condition points; reinforced security in effect at the time halves it.\nUnderground: §G-8§!.\nDistrict support: §R-6§! £NAM_support_dist_texticon."
 NAM_ug_85_c_tt: "The fire has already damaged the field. Base damage is §R15§! condition points; reinforced security in effect at the time halves it.\nUnderground: §R+3§!."
 ADISCORD_nam_resource_war.86.t: "Raid on the Arsenal"
 ADISCORD_nam_resource_war.86.d: "The garrison depot at the crossroads was taken without a single shot: the sentries were found tied up, the gates opened with a key of their own, and the underground's lorry left for the hills an hour before the guard changed. The inventory counted [?NAM_ug_rifles_stolen|0] rifles missing, and every one of them is now in Weber's hands.\n\nThe tracks are still fresh, and the mounted gendarmerie is ready to follow them. The chief of the rear proposes something else: double the guard on every depot before the underground comes back for the rest. There is a third opinion too - that these rifles will never be found."
 ADISCORD_nam_resource_war.86.a: "Pursue them while the tracks are fresh."
 ADISCORD_nam_resource_war.86.b: "Double the depot guards."
 ADISCORD_nam_resource_war.86.c: "Do not chase ghosts."
 NAM_ug_86_a_tt: "§R[?NAM_ug_rifles_stolen|0]§! £infantry_equipment_texticon stolen, the underground grew by §R4§!.\nEven odds: recover up to §G1000§! £infantry_equipment_texticon from the stolen stock and weaken the underground by §G6§! - or lose §R500§! £manpower_texticon in an ambush."
 NAM_ug_86_b_tt: "§R[?NAM_ug_rifles_stolen|0]§! £infantry_equipment_texticon stolen, the underground grew by §R4§!.\nTreasury: §R-100§! £ADISCORD_economy_treasury_texticon.\nGarrison support: §G+4§! £NAM_support_garr_texticon.\nThe depots will not be raided for §Y180§! days."
 NAM_ug_86_c_tt: "§R[?NAM_ug_rifles_stolen|0]§! £infantry_equipment_texticon stolen, the underground grew by §R4§!.\nUnderground: §R+3§!.\nDistrict support: §G+2§! £NAM_support_dist_texticon."
 ADISCORD_nam_resource_war.87.t: "Attempt on a Governor"
 ADISCORD_nam_resource_war.87.d: "The governor of the South Coast was shot on the steps of his own office, in broad daylight, in front of the petitioners. The gunman escaped through the market, and by evening leaflets with the sentence were going round the city: 'for the levies, for the quotas, for our children on the oilfields'. Weber's signature stood at the bottom like a seal under a decree.\n\nThe governors demand an answer every district will remember. The districts wait to see whether reprisals without trial will begin. Rom understands that whatever the chancery does, it will be read as the answer to a single question: who really holds power in Svetlogorye."
 ADISCORD_nam_resource_war.87.a: "Martial law in the districts."
 ADISCORD_nam_resource_war.87.b: "A funeral and an honest investigation."
 ADISCORD_nam_resource_war.87.c: "Hush the matter up."
 NAM_ug_87_a_tt: "Underground: §G-10§!.\nNamestnik support: §G+6§! £NAM_support_nam_texticon.\nDistrict support: §R-8§! £NAM_support_dist_texticon.\nIf the ladder of seals already exists, it shifts §Y0.05§! towards the vertical."
