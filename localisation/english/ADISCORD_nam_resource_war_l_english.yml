 NAM_pw_marine_tt:0 "Each order prepares a marine division for the war of return: §Y50§! loot and §Y4300§! £manpower_texticon. Up to §Y[?NAM_marine_order_cap|0]§! can be prepared, never more than §Y3§!.\nYellow shield - a trained division, ring - a free order, grey - not open yet.\nBefore the war begins, orders can be cancelled by decision: the loot and the men return."
