 ADISCORD_nam_resource_war.90.t: "The Flotilla Returns"
 ADISCORD_nam_resource_war.90.d_success: "The flotilla came back to harbour with its holds down to the waterline. On the [NAMPwLastLane] it intercepted a convoy, took its fuel and left before the escort arrived. The shipowners counting the losses: [NAMPwLastVictims]. On the islands the loot is already being shared out, and men retell how the captains raised Svetlogorye's old flag over the captured ships."
 ADISCORD_nam_resource_war.90.d_prize: "The islands have never seen such a prize. On the [NAMPwLastLane] the flotilla boarded a whole caravan: fuel, crates of rifles and the ships themselves, which now sail under our flag. The shipowners counting the losses: [NAMPwLastVictims]. The captains were greeted on the pier as heroes, and the harbour taverns already sing of the next raid."
 ADISCORD_nam_resource_war.90.d_failure: "The flotilla came back empty-handed. On the [NAMPwLastLane] the convoy ([NAMPwLastVictims]) sailed under a strong escort, and the raiders came under fire as soon as they appeared on the horizon. The captains blame traitors in the ports, the sailors blame the captains. The exile's fleet is too small to lose ships and men on every failed sortie."
 ADISCORD_nam_resource_war.90.a: "Enter it in the log."
 NAM_pirate_report_haul_tt: "Loot: §G+[?NAM_pirate_last_loot|0]§!, §Y[?NAM_pirate_loot|0]§! in total.\nNotoriety: §Y[?NAM_pirate_notoriety|0]§! / 100."
 NAM_pirate_report_ship_lost_tt: "A patrol ship was lost.\nNotoriety: §Y[?NAM_pirate_notoriety|0]§! / 100."
 NAM_pirate_report_crew_lost_tt: "§R1000§! £manpower_texticon lost.\nNotoriety: §Y[?NAM_pirate_notoriety|0]§! / 100."
 ADISCORD_nam_resource_war.91.t: "Svetlogorsk Pirates"
 ADISCORD_nam_resource_war.91.d: "The captains of our convoys report an attack on the [NAMPwLastLane] off the islands of the exiles. The attackers made no secret of who they were: the flag of Svetlogorye's government in exile flew over their ships. Part of the cargo is lost, the insurers are raising their prices, and the harbour offices demand that the government protect our shipping."
 ADISCORD_nam_resource_war.91.a: "Strengthen the convoy escorts."
 ADISCORD_nam_resource_war.92.t: "Blockade of the Islands"
 ADISCORD_nam_resource_war.92.d: "The coalition's squadrons have dropped anchor at the entrance to the island harbours. Their commander sent an ultimatum with the very first launch: every vessel under Svetlogorye's flag that puts to sea will be treated as a pirate and sunk without warning. The fishermen stay ashore, the merchants turn their ships towards foreign ports.\n\nThe flotilla captains propose to wait until the coalition's attention slackens. The treasurer knows whom on the squadron staff one can pay for blind nights. And in the barracks men say ever louder that the blockade proves only one thing: the enemy fears us."
 ADISCORD_nam_resource_war.92.a: "Lie low."
 ADISCORD_nam_resource_war.92.b: "Pay for blind nights."
 ADISCORD_nam_resource_war.92.c: "Let them blockade."
 NAM_pirate_92_a_tt: "Notoriety: §G-15§!.\nNo raids for §Y60§! days."
 NAM_pirate_92_b_tt: "Loot: §R-50§!.\nNotoriety: §G-10§!."
 NAM_pirate_92_c_tt: "Blockade of the islands for §Y90§! days: fuel gain §R-25%§!, trade income §R-15%§!, weaker convoy raiding and more failed raids.\nReadiness for the return: §G+5§!."
 ADISCORD_nam_resource_war.93.t: "Punitive Raid"
 ADISCORD_nam_resource_war.93.d: "At dawn the coalition's ships opened fire on the capital of the exile. Shells fell on the harbour and on the warehouses by the piers, the sheds caught fire, the old lighthouse collapsed. A few hours later a demand came from the flagship: hand over the captains who led the flotillas and surrender the loot, or the shelling will be repeated and a landing will follow.\n\nThe pillars' council is divided. Some urge putting to sea everything that floats. Others think a few surrendered captains a small price for the life of the islands. Still others propose scattering the flotilla among distant coves and disappearing for a long time."
 ADISCORD_nam_resource_war.93.a: "Give battle."
 ADISCORD_nam_resource_war.93.b: "Hand over the captains."
 ADISCORD_nam_resource_war.93.c: "Scatter the flotilla."
 NAM_pirate_93_a_tt: "Even odds: repel the raid (navy experience §G+5§!, readiness for the return §G+5§!) - or lose a patrol ship and §R1000§! £manpower_texticon.\nNotoriety: §R+5§!."
 NAM_pirate_93_b_tt: "Loot: §R-40%§!.\nNotoriety: §G-25§!.\nReadiness for the return: §R-5§!."
 NAM_pirate_93_c_tt: "Notoriety: §G-15§!.\nNo raids for §Y90§! days."
 ADISCORD_nam_resource_war.94.t: "Landing at South Harbour"
 ADISCORD_nam_resource_war.94.d: "The transports approached South Harbour in the pre-dawn fog along the same fairways by which the fleet had once left for exile. The marines jumped straight into the cold water and ran over the stones to the piers where our guns had once been pushed into the sea. The enemy garrison woke to gunfire already on the embankment.\n\nThe return began where the flight ended. The islands now hold a beachhead on the mainland, and the coming days will decide everything: whether the coalition can throw the landing back into the sea, or Svetlogorye stands on its own land again."
 ADISCORD_nam_resource_war.94.a: "For Svetlogorye!"
 NAM_landing_report_tt: "Beachhead taken: South Harbour is under our control and the enemy garrison has been thrown back.\nMarine divisions landed at South Harbour: §Y[?NAM_marines_landed|0]§!.\nTrained divisions taken into service: §Y[?NAM_marines_orders_delivered|0]§!."
 NAM_landing_island_tt: "The landing is limited to §Y3§! divisions: another §Y[?NAM_marines_island|0]§! trained divisions were formed at the island capital."
 NAM_pirate_blockade: "Blockade of the Islands"
 ADISCORD_tech_svetlogorsk_marine_corps: "Svetlogorsk Marine Corps"
 ADISCORD_tech_svetlogorsk_marine_corps_desc: "Battalions of the exile, trained to land from the sea and take piers under fire."
 # Focus trees: colony and exile
 # ----- Main tree: colony (before the collapse) -----
 NAM_wrk_trade_house:0 "A Trade House in the Metropole"
 NAM_wrk_trade_house_desc:0 "For years our oil offices traded through other people's agents. We will open our own house in Vorkerland: our warehouses, our clerks and the right to sign contracts in the name of Svetlogorye."
 NAM_wrk_return_cargo:0 "Return Voyages"
 NAM_wrk_return_cargo_desc:0 "The tankers leave for the metropole full and come back empty. Let them carry machine tools on the way back: South Harbour has the hands for a new factory."
 NAM_colonial_watch:0 "Colonial Watch Reports"
 NAM_colonial_watch_desc:0 "The colonial watch writes reports that nobody reads. We will gather them into one summary: where pipes are cut, who prints the leaflets and where Weber's people go."
 NAM_imperial_gendarmes:0 "Imperial Gendarmerie"
 NAM_imperial_gendarmes_desc:0 "We will ask the metropole for gendarmes. They do not know our fields and will not ask who is guilty, but the underground will fall silent for a long time. The districts will not forgive it."
 NAM_oilfield_militia:0 "Oilfield Self-Defence"
 NAM_oilfield_militia_desc:0 "The drillers know better than any guard who walks near the rigs at night. We will hand rifles to the crews and let them guard their own fields."
 NAM_pipeline_patrols:0 "Pipeline Linesmen"
 NAM_pipeline_patrols_desc:0 "The underground strikes the pipes because nobody guards them. Linesmen with dogs and a telephone post on every verst will save both the oil and the roads to Klyuchevsk."
 NAM_print_shop_raid:0 "Find the Ink of the Coming Uprising"
 NAM_print_shop_raid_desc:0 "The underground's leaflets are printed somewhere near the capital. We will find the press and those who carry the type: every captured typesetter tells more than ten leaflets. Seized samples will let us trace paper deliveries and identify underground couriers."
 NAM_colony_order:0 "Order on the Fields"
 NAM_colony_order_desc:0 "The fields work without interruption again, and buyers in the metropole notice it. A quiet year is worth more than any promise in a letter."
 # ----- Main tree: colony tooltips -----
 NAM_wrk_trade_level_up_tt:0 "Standing of our trade houses in the metropole: §G+1§! (at most §Y3§!). It raises the payment for a fuel shipment and the income of the trade concession."
