 NAM_colony: "Colony of Vorkerland"
 NAM_colony_desc: "Svetlogorye remains the metropole's oil colony. Trade houses: level §Y[?NAM_wrk_trade_level|0]§! / 3. Metropolitan concession: [NAMGetWrkConcession]\n\nVeter's underground: §Y[?NAM_underground|0]§! / 100, change over the last month: §Y[?NAM_underground_growth|0]§!. [NAMGetUndergroundNext]\n\nThe underground grows by §Y3§! each month, by another §Y2§! while district support is below §Y40§! and by §Y1§! more below §Y25§!; district support of §Y60§! or more lowers the growth by §Y1§!. A network of §Y30§! or more can set a field on fire, rob an arsenal or kill a governor. Gendarmerie sweeps weaken it but embitter the districts."
 NAM_wrk_metropole_present_tt: "The metropole exists"
 NAM_wrk_fuel_shipment: "Fuel Shipment to the Metropole"
 NAM_wrk_fuel_shipment_desc: "Tankers sail to the metropole beyond the quota. The capital pays for them in hard coin and remembers who helped it through a difficult month. The governors are pleased, the oilmen are not: the fuel leaves their tanks. The price of a shipment rises with the standing of our trade houses."
 NAM_cost_wrk_fuel_shipment: "§Y4000§! £fuel_texticon"
 NAM_cost_wrk_fuel_shipment_blocked: "§R4000§! £fuel_texticon"
 NAM_cost_wrk_fuel_shipment_tooltip: "§Y4000§! £fuel_texticon\nThe fuel goes to the metropole."
 NAM_wrk_fuel_shipment_tt: "Treasury: §G+[?NAM_wrk_shipment_income|0]§! £ADISCORD_economy_treasury_texticon.\nNamestnik support: §G+4§! £NAM_support_nam_texticon.\nOil worker support: §R-3§! £NAM_support_oil_texticon.\nThe metropole receives §Y4000§! £fuel_texticon and remembers the favour."
 NAM_wrk_trade_concession: "Metropolitan Trade Concession"
 NAM_wrk_trade_concession_desc: "Svetlogorye's trade houses ask the metropole for the right to sell oil past the imperial offices. The negotiations take §Y45§! days; a signed concession pays every month while the metropole exists: §Y25§! £ADISCORD_economy_treasury_texticon plus §Y15§! for each level of the trade houses."
 NAM_cost_wrk_trade_concession: "§Y50§! £political_power_texticon §Y200§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_wrk_trade_concession_blocked: "§R50§! £political_power_texticon §R200§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_wrk_trade_concession_tooltip: "§Y50§! £political_power_texticon §Y200§! £ADISCORD_economy_treasury_texticon\nThe treasury returns if the negotiations are interrupted."
 NAM_wrk_concession_started_tt: "Treasury: §R-200§! £ADISCORD_economy_treasury_texticon; the deposit returns if the negotiations are interrupted."
 NAM_wrk_concession_signed_tt: "The concession is signed: §G+[?NAM_wrk_trade_income|0]§! £ADISCORD_economy_treasury_texticon a month until the metropole falls."
 NAM_wrk_concession_refund_tt: "Negotiations interrupted: §G200§! £ADISCORD_economy_treasury_texticon return to the treasury. Political power is not refunded."
 NAM_wrk_concession_status_active: "§Gsigned§!, paying §Y[?NAM_wrk_trade_income|0]§! £ADISCORD_economy_treasury_texticon a month."
 NAM_wrk_concession_status_talks: "§Ynegotiations under way§!."
 NAM_wrk_concession_status_none: "not signed; once signed it will pay §Y[?NAM_wrk_trade_income|0]§! £ADISCORD_economy_treasury_texticon a month."
 NAM_counterinsurgency_sweep: "Gendarmerie Sweep"
 NAM_counterinsurgency_sweep_desc: "The gendarmerie combs the district for Veter's cells: searches, document checks, arrests on denunciations. The sweep lasts §Y21§! days. In Svetlogorsk, where the underground has most of its people, it hits harder, but every sweep embitters the districts and excesses make new martyrs. A district can be swept again after §Y120§! days."
 NAM_cost_counterinsurgency_sweep: "§Y20§! £political_power_texticon §Y75§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_counterinsurgency_sweep_blocked: "§R20§! £political_power_texticon §R75§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_counterinsurgency_sweep_tooltip: "§Y20§! £political_power_texticon §Y75§! £ADISCORD_economy_treasury_texticon\nThe treasury returns if the sweep is interrupted."
 NAM_sweep_slot_free_tt: "No other sweep is under way"
 NAM_sweep_started_tt: "Treasury: §R-75§! £ADISCORD_economy_treasury_texticon; the deposit returns if the sweep is interrupted.\nOnly one sweep runs at a time."
 NAM_sweep_done_tt: "Underground: §G-8§!, §G-12§! in Svetlogorsk.\nDistrict support: §R-4§! £NAM_support_dist_texticon.\nWith a §Y30%§! chance (§Y15%§! with garrison support of §Y60§! or more) there are excesses: stability §R-2%§!, another §R-4§! £NAM_support_dist_texticon district support, underground §R+3§!."
 NAM_sweep_refund_tt: "Sweep interrupted: §G75§! £ADISCORD_economy_treasury_texticon return to the treasury. Political power is not refunded."
 NAM_underground_next_idle: "The underground no longer grows."
 NAM_underground_next_40: "At §Y40§! the underground comes out of the shadows."
 NAM_underground_next_60: "At §Y60§! the underground brings the oilfields out on strike."
