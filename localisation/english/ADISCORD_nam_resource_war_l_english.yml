 NAM_captured_wells_shock:0 "Oilfields in Enemy Hands"
 NAM_captured_wells_shock_desc:0 "Lost oilfields undermine confidence in victory and the supply of military industry."
 NAM_captured_wells_warning_tt:0 "Enemy-held working wells penalise Svetlogorye in proportion to their share of total basin capacity: up to §R-30%§! £war_support_texticon and §R-20%§! military factory output. Damaged wells count by condition; scorched wells do not count for §Y180§! £time_texticon. Recapture reduces the penalty; the end of the resource war removes it."
 NAM_captured_wells_report:0 "\n\n§YOILFIELDS IN ENEMY HANDS§!\nCaptured working capacity: §Y[?NAM_captured_capacity|1] / [?NAM_basin_capacity|0]§!\nWar support: [?NAM_captured_war_support|=+1%] £war_support_texticon; military factory output: [?NAM_captured_factory_output|=+1%].\nLiberating fields reduces the penalty. Scorched wells do not count until the fires end."
