 NAM_pw_fence_loot_label:0 "To the fences"
 NAM_pw_fence_loot_price:0 "[NAMPwCostFence]"
 NAM_pw_fence_loot_tt:0 "§YSell Loot to the Fences§!\n§G+100§! £ADISCORD_economy_treasury_texticon for §Y50§! loot.\nPrice: [NAMPwCostFence]. The next deal in §Y30§! days.\n[NAMPwFenceStatus]"
 NAM_pw_exile_drill_label:0 "Drill"
 NAM_pw_exile_drill_price:0 "[NAMPwCostDrill]"
 NAM_pw_exile_drill_tt:0 "§YDrill on the Island Beaches§!\n§Y30§! days of drill: army experience §G+15§!, readiness for the return §G+10§!. If the drill is interrupted, the loot returns.\nPrice: [NAMPwCostDrill]. After the drill - §Y15§! days of rest.\n[NAMPwDrillStatus]"
 NAM_pw_order_marines_label:0 "Marines"
 NAM_pw_order_marines_price:0 "[NAMPwCostMarines]"
 NAM_pw_order_marines_tt:0 "§YMarine Order§!\nA division is trained for the war of return: the first joins the landing at South Harbour, the others form in the island capital. Before the war the order can be cancelled by decision, and the loot and the men return.\nPrice: [NAMPwCostMarines]. The next order in §Y14§! days.\n[NAMPwMarinesStatus]"
 NAM_underground_uprising:0 "§RThe underground has launched an uprising. Talks are suspended.§!"
 NAM_underground_inactive:0 "The pre-war network no longer grows or carries out raids."
 # ----- Exile revolution: radicals or humanists -----
 NAM_exile_politics: "Preparing the Return"
 NAM_exile_politics_desc: "The namestnik fell on the very first night on the islands, and the exile's course is settled for good. The pillars of Svetlogorye and Yaroslav Weber's humanists pay for the return in different ways, but both need the landing at South Harbour: here the exiles prepare for it."
 NAM_exile_council_next_tt: "Right after the landing on the islands a council meets: the namestnik will be overthrown, and power will pass to §Ythe pillars of Svetlogorye§! or §YWeber's humanists§!."
 ADISCORD_nam_resource_war.100.t: "Who Takes the Seals"
 ADISCORD_nam_resource_war.100.d: "Less than a day after the landing, the council of the island government met in the old customs house: in the hall where ore was once weighed, maps of the lost mainland now hang on the walls. Namestnik [ROOT.GetLeader] opened the session with his usual speech on the discipline of the seals, but nobody was listening anymore. The men who led the army out of South Harbour want to know who will lead it back.\n\nThe officers and elders of the pillars rose first - the garrisons, the oil crews, the harbour offices. Their demand is short: power to those who hold the guns, the islands a military camp, the sea a larder, and the neighbours who took the fields will pay for everything. Behind them stand the flotillas, ready to sail on the first order.\n\nOn the other side of the hall sit Yaroslav Weber's people. The former leader of the underground, whom the chancery called a bandit for years, speaks of free islands open to foreign money, of contracts instead of plunder and of a south that can be united rather than conquered. Bankers from foreign ports are already waiting in the hotel by the pier.\n\nThe namestnik looks at the hall and understands that his time is over. It only remains to decide whose hands will take the seals."
 ADISCORD_nam_resource_war.100.a: "Power to the pillars of Svetlogorye."
 ADISCORD_nam_resource_war.100.b: "Power to Weber's humanists."
 NAM_exile_radical_tt: "The namestnik is overthrown. The pillars' junta takes power under §YRostislav Karamyshev§! (etatism).\nPirate flotillas, the black market and marines paid in loot open.\nNational spirit §YJunta of the Pillars§!: war support §G+10%§!, political power §G+10%§!, army organisation §G+5%§!, stability §R-5%§!.\nReadiness for the return: §G+5§!."
 NAM_exile_humanist_tt: "The namestnik is overthrown. The humanists take power under §YYaroslav Weber§!.\nThe pirate flotillas stay in harbour; foreign corporations will pay for the return: the «Free Zones» category opens.\nAll of the exile's loot is sold to investors and becomes foreign capital.\nNational spirit §YFree Islands§!: stability §G+8%§!, research speed §G+3%§!, war support §R-5%§!.\nCorporate influence: §Y20§! / 100."
 NAM_Rostislav_Karamyshev: "Rostislav Karamyshev"
 NAM_Rostislav_Karamyshev_desc: "Rostislav Karamyshev commanded the South Harbour coast guard and was the last to leave the piers during the evacuation. On the islands he gathered the garrison officers, the elders of the oil crews and the flotilla captains around him. He promises neither reforms nor elections - only the return."
 NAM_Mark_Olshansky: "Mark Olshansky"
 NAM_Mark_Olshansky_desc: "Mark Olshansky represented the largest investor consortium on the islands and then headed the united council of boards. He speaks the language of balance sheets and dividends and is sure that the return to the mainland is simply the largest deal in Svetlogorye's history."
 NAM_Yaroslav_Weber_leader_desc: "Yaroslav Weber went from leaflets in the changing rooms of the fields to the cabinet of the government in exile. His humanists promise free islands, contracts instead of plunder and a south united in a federation rather than conquered by force."
 NAM_trait_pillar_junta_chief: "Chief of the Pillars' Junta"
 NAM_trait_corsair_patron: "Patron of the Flotillas"
 NAM_trait_voice_of_the_districts: "Voice of the Districts"
 NAM_trait_chairman_of_the_boards: "Chairman of the Boards"
 NAM_exile_pillar_junta: "Junta of the Pillars"
 NAM_exile_pillar_junta_desc: "The garrisons, the oil crews and the harbour offices rule the islands as a military camp. Everything serves the return: people, ships and plunder."
 NAM_exile_free_islands: "Free Islands"
 NAM_exile_free_islands_desc: "Yaroslav Weber's government has opened the islands to foreign money and to its own citizens. Here people argue more and march less."
 # Humanist exile: corporations and free zones
 NAM_free_zones: "Free Zones"
 NAM_free_zones_desc: "Foreign capital: §Y[?NAM_corp_capital|0]§!, income last month §G+[?NAM_corp_last_income|0]§!.\nCorporate influence: §Y[?NAM_corp_influence|0]§! / 100, change last month §Y[?NAM_corp_last_drift|0]§! - [NAMGetCorpBand]\nFree zones: §Y[?NAM_free_zones_active|0]§! of §Y[?NAM_free_zone_slots|0]§!, in negotiation §Y[?NAM_free_zones_pending|0]§!.\n\nEach free zone brings §Y20§! capital a month plus §Y0.3§! per point of influence, exempts investors from taxes (tax collection §R-3%§!) and raises influence by §Y1§! a month, while the government itself pushes it down by §Y1§!. Below §Y30§! the investors pay little; from §Y30§! influence brings research, efficiency and trade; from §Y70§! it costs stability and political power; from §Y90§! the boards demand the seals. Three months at §Y90§! or more, or §Y100§! at once, and the corporations take power."
 NAM_corp_band_low: "§Ycautious investors§!: little money, no benefits."
 NAM_corp_band_balance: "§Gbalance§!: research §G+5%§!, efficiency §G+3%§!, trade income §G+10%§!."
 NAM_corp_band_pressure: "§Rpressure of the boards§!: research §G+8%§!, efficiency §G+5%§!, trade income §G+15%§!, stability §R-5%§!, political power §R-10%§!."
 NAM_corp_band_seals: "§Rthe boards demand the seals§!: research §G+10%§!, efficiency §G+5%§!, trade income §G+20%§!, stability §R-10%§!, political power §R-20%§!. Three months at this level and the corporations take power."
 NAM_corp_band_takeover: "§Rthe corporations rule§!: research §G+10%§!, efficiency §G+8%§!, trade income §G+25%§!, stability §R-5%§!, political power §R-15%§!."
 NAM_corp_dynamic: "Foreign Corporations"
 NAM_corp_dynamic_desc: "The investors' capital feeds the exile, and their boards speak ever louder in the government. The strength of that influence sets both the benefit and the price."
 NAM_free_zone_state: "Free Zone"
 NAM_free_zone_state_desc: "Tax holidays, foreign managers and duty-free construction."
 NAM_corp_steel_export_state: "Steel for Export"
 NAM_corp_steel_export_state_desc: "The island's ore goes to foreign plants under contract."
 NAM_corporate_board_state: "Corporate Board"
 NAM_corporate_board_state_desc: "A board of directors governs the island: the mines work around the clock and the workers are bound by contracts."
 NAM_corp_charter_free_zone: "Charter a Free Zone"
 NAM_corp_charter_free_zone_desc: "Thirty days of negotiations with the investors: the island receives tax holidays, duty-free construction and foreign managers. The zone brings capital every month, but every new zone strengthens the corporations."
 NAM_corp_zone_slot_free_tt: "There is room for a new free zone: §Y[?NAM_free_zones_active|0]§! chartered and §Y[?NAM_free_zones_pending|0]§! in negotiation of §Y[?NAM_free_zone_slots|0]§!, at most §Y3§!"
 NAM_corp_charter_started_tt: "Negotiations with the investors begin; a free-zone slot is taken. Political power is not refunded if the negotiations fail."
 NAM_corp_charter_done_tt: "If the island is still ours, a free zone opens:\n- construction speed in the state §G+25%§!, resources §G+10%§!, §G1§! more building slot;\n- national tax collection §R-3%§!;\n- foreign capital: §G+20§! at once and income every month;\n- corporate influence: §R+5§! at once and §R+1§! a month."
 NAM_corp_charter_cancel_tt: "The negotiations have failed: the free-zone slot is released. Political power is not refunded."
 NAM_corp_sell_steel: "Sell the Island Steel"
 NAM_corp_sell_steel_desc: "The steel, aluminium and tungsten of the islands go to foreign plants under a long-term contract. The money arrives at once, but for sixty days our workshops are left without their own raw materials."
 NAM_corp_owns_island_tt: "Svetlogorye owns at least one island"
 NAM_corp_sell_steel_tt: "Foreign capital: §G+60§!.\nCorporate influence: §R+3§!.\nResources of each of our islands §R-50%§! for §Y60§! days."
 NAM_corp_labour_contract: "Lease Workers"
 NAM_corp_labour_contract_desc: "Three thousand islanders leave for the investors' yards and mines for ninety days. The companies pay in advance, and the people come home when the contract ends."
 NAM_cost_corp_labour: "§Y3000§! £manpower_texticon"
 NAM_cost_corp_labour_blocked: "§R3000§! £manpower_texticon"
 NAM_cost_corp_labour_tooltip: "§Y3000§! £manpower_texticon\nThe workers return after §Y90§! days or if the contract breaks down."
 NAM_corp_labour_started_tt: "Foreign capital: §G+45§!.\nCorporate influence: §R+4§! at once and §R+1§! a month while the workers are under contract.\n§Y3000§! £manpower_texticon return when the contract ends."
 NAM_corp_labour_return_tt: "The workers return: §G+3000§! £manpower_texticon."
 NAM_corp_innovation_park: "Investors' Innovation Park"
 NAM_corp_innovation_park_desc: "Foreign engineers open laboratories and pilot workshops on the islands. In ninety days our workshops will receive their technologies, and the corporations new seats on the councils."
 NAM_cost_corp_park: "§Y25§! £political_power_texticon §Y60§! capital"
 NAM_cost_corp_park_blocked: "§R25§! £political_power_texticon §R60§! capital"
 NAM_cost_corp_park_tooltip: "§Y25§! £political_power_texticon §Y60§! capital\nThe capital returns if the work is interrupted."
 NAM_corp_park_started_tt: "Foreign capital: §R-60§!; it returns if the work is interrupted."
 NAM_corp_park_done_tt: "Corporate influence: §R+5§!."
 NAM_corp_park_refund_tt: "The work is interrupted: §G60§! capital returns. Political power is not refunded."
 NAM_corp_buy_arms: "Arms from the Investors"
 NAM_corp_buy_arms_desc: "Companies that need order on the islands gladly sell arms to the government that will keep that order."
 NAM_cost_corp_arms: "§Y60§! capital"
 NAM_cost_corp_arms_blocked: "§R60§! capital"
 NAM_cost_corp_arms_tooltip: "§Y60§! capital"
 NAM_corp_spend_60_tt: "Foreign capital: §R-60§!."
 NAM_corp_influence_up_2_tt: "Corporate influence: §R+2§!."
 NAM_corp_curb_influence: "Rein In the Boards"
 NAM_corp_curb_influence_desc: "An audit of the contracts, fewer investor seats on the councils and public hearings. The corporations will retreat, but the investors will get nervous."
 NAM_corp_influence_above_zero_tt: "Corporate influence is above §Y0§!"
 NAM_corp_curb_tt: "Corporate influence: §G-10§!."
 NAM_corp_court_investors: "Court the Investors"
 NAM_corp_court_investors_desc: "New guarantees, council seats and promises of future concessions bring fresh money to the islands - and new masters."
 NAM_corp_court_tt: "Foreign capital: §G+40§!.\nCorporate influence: §R+10§!."
 NAM_order_marines_corp: "Marines on the Investors' Capital"
 NAM_order_marines_corp_desc: "The capital pays for the equipment, the islands provide the men. A prepared marine division appears on the day the war of return begins: the first joins the landing at South Harbour, the rest form in the island capital. Before the war the order can be cancelled and the capital and men returned."
 NAM_cost_order_marines_corp: "§Y60§! capital §Y4300§! £manpower_texticon"
 NAM_cost_order_marines_corp_blocked: "§R60§! capital §R4300§! £manpower_texticon"
 NAM_cost_order_marines_corp_tooltip: "§Y60§! capital §Y4300§! £manpower_texticon\nBefore the war of return the capital and men return if the order is cancelled."
 NAM_order_marines_corp_tt: "Foreign capital: §R-60§!.\nA fully manned marine division appears on the day the war of return begins."
 NAM_order_marines_corp_release: "Cancel the Marine Orders"
 NAM_order_marines_corp_release_desc: "Disband the prepared marine divisions before the war of return begins."
 NAM_order_marines_corp_release_tt: "For each of the §Y[?NAM_marine_orders_paid|0]§! prepared divisions, §G60§! capital and §G4300§! £manpower_texticon return."
 ADISCORD_nam_resource_war.101.t: "The Boards Demand Guarantees"
 ADISCORD_nam_resource_war.101.d: "The representatives of the foreign companies came to the government not with a request but with a draft decree. Their boards have invested too much in the islands to depend on the council's moods: they demand guarantees against nationalisation, seats on the budget commissions and the right to appoint the managers of the free zones.\n\nWeber remembers how the underground began: with people who were left without a voice. Now a voice is demanded by those who pay for the return. Refusal will cost political weight, concession the government's future, and silence will be read as consent."
 ADISCORD_nam_resource_war.101.a: "Reject the draft decree."
 ADISCORD_nam_resource_war.101.b: "Sign the guarantees."
 ADISCORD_nam_resource_war.101.c: "Postpone the answer."
 NAM_corp_101_a_tt: "Corporate influence: §G-8§!."
 NAM_corp_101_b_tt: "Foreign capital: §G+40§!.\nCorporate influence: §R+5§!."
 NAM_corp_101_c_tt: "Corporate influence: §R+2§!."
 ADISCORD_nam_resource_war.102.t: "The Boards Demand the Seals"
 ADISCORD_nam_resource_war.102.d: "The board of directors of the united companies has sent the government not a draft but an ultimatum. The corporations demand control of the islands: the budget, the harbour police and the right to sign treaties in Svetlogorye's name. Without that, they say, the money for the return will run out tomorrow.\n\nThe government understands that more than accounts stand behind the ultimatum. The guards of the depots, the piers and half of the transports have long been paid by the companies. They can still be stopped - by an emergency decree or by buying back their shares. To yield means to prepare for the day the seals pass into other hands."
 ADISCORD_nam_resource_war.102.a: "Emergency decree."
 ADISCORD_nam_resource_war.102.b: "Buy back the shares."
 ADISCORD_nam_resource_war.102.c: "Give them seats on the council."
 NAM_corp_102_a_tt: "Corporate influence: §G-20§!."
 NAM_corp_102_b_tt: "Foreign capital: §R-150§!.\nCorporate influence: §G-15§!."
 NAM_corp_102_c_tt: "Foreign capital: §G+80§!.\nCorporate influence: §R+5§!.\nIf influence stays at §Y90§! or more for three months or reaches §Y100§!, the corporations take power."
 ADISCORD_nam_resource_war.103.t: "The Board of Directors Takes Power"
 ADISCORD_nam_resource_war.103.d: "In the morning it was not soldiers who entered the government building, but lawyers. The board of directors of the united companies presented a resolution already signed by most of the ministers: the administration of the islands passes to the boards, and Mark Olshansky will head the government. The harbour guard, paid by the companies, took the piers during the night.\n\nYaroslav Weber remains in the government but no longer leads it. Nobody has cancelled the course towards a federation of the south - the boards have merely recounted it in shares. The Free Islands have become Corporate Svetlogorye, and every island is now governed by a board of directors."
 ADISCORD_nam_resource_war.103.a: "The shareholders are pleased."
 NAM_corp_takeover_tt: "§YMark Olshansky§! (commercial hedonism) heads the government; the hedonists become the ruling party.\nThe country becomes §YCorporate Svetlogorye§!.\nEach of our islands receives a §YCorporate Board§!: resources §G+15%§!, construction speed §G+15%§!, recruitable population §R-20%§!.\nCorporate influence is fixed at §Y100§!: research §G+10%§!, efficiency §G+8%§!, trade income §G+25%§!, stability §R-5%§!, political power §R-15%§!. The boards can no longer be reined in.\nThe humanists' course towards a federation of the south continues.\nEvery federal district passes to one of six corporations: it gives the district its own profile and pays the board dividends every month.\nThe focus tree of §Ythe board of directors§! opens; the humanists' completed focuses are kept."
 NAM_corporate_state: "Corporate Svetlogorye"
 NAM_corporate_state_ADJ: "$NAM_ADJ$"
 NAM_corporate_state_DEF: "Corporate Svetlogorye"
 # Great war of return and the southern settlement
 NAM_war_of_return_ready_compromise: "Svetlogorye has survived the compromise peace, the tribute is paid, the country is independent and at peace, and at least one lost field or South Harbour belongs to an independent country outside our alliance"
 NAM_war_of_return_terms_compromise: "The war is fought against the current owners of the lost fields. Capitulation of every owner returns the fields to Svetlogorye; our capitulation leads to the complete partition of the country. The war has no time limit: it lasts until one side capitulates completely."
 NAM_wor_coalition_faction: "Southern Defence Coalition"
 autonomy_NAM_federal_district: "Svetlogorye Federal District"
 EFL_NAM_federal_district: "Eflor Federal District of Svetlogorye"
 EFL_NAM_federal_district_ADJ: "$EFL_ADJ$"
 EFL_NAM_federal_district_DEF: "the Eflor Federal District of Svetlogorye"
 AZH_NAM_federal_district: "Azhar Federal District of Svetlogorye"
 AZH_NAM_federal_district_ADJ: "$AZH_ADJ$"
 AZH_NAM_federal_district_DEF: "the Azhar Federal District of Svetlogorye"
 RHM_NAM_federal_district: "Rakhma Federal District of Svetlogorye"
 RHM_NAM_federal_district_ADJ: "$RHM_ADJ$"
 RHM_NAM_federal_district_DEF: "the Rakhma Federal District of Svetlogorye"
 SDR_NAM_federal_district: "Sardan Federal District of Svetlogorye"
 SDR_NAM_federal_district_ADJ: "$SDR_ADJ$"
 SDR_NAM_federal_district_DEF: "the Sardan Federal District of Svetlogorye"
 KDR_NAM_federal_district: "Kadir Federal District of Svetlogorye"
 KDR_NAM_federal_district_ADJ: "$KDR_ADJ$"
 KDR_NAM_federal_district_DEF: "the Kadir Federal District of Svetlogorye"
 ADISCORD_nam_resource_war.60.d_exile: "The transports left the island harbours at night with their lights out, as they once left South Harbour. Only now they are going back. Svetlogorye's government in exile has declared war on those who divided the mainland - Eflor and Azhar.\n\nThe neighbours closed ranks in a common coalition at once. Against us stand two armies used to treating our oil as their plunder; we have the islands, the fleet and the marines who will be the first to step onto the piers. There is nowhere left to retreat: if we lose, the islands will be divided after the mainland. If we win, Eflor and Azhar will answer to Svetlogorye for everything. There will be no mediators: this war ends only when one side capitulates."
 ADISCORD_nam_resource_war.60.d_target_exile: "Svetlogorye's government in exile has declared war on Eflor and Azhar. Its landing force is already sailing for South Harbour, and on the islands they speak of revenge on those who divided the mainland. Both countries have joined a temporary defensive coalition.\n\nIf Svetlogorye capitulates, its islands will be annexed. If both allies fall, they will share one fate. There will be no truce: the war lasts until one side capitulates completely."
 ADISCORD_nam_resource_war.62.d_won_radical: "The coalition's last capital has capitulated. The pillars' junta did not wait for mediators: Svetlogorye's flag flies over the offices of Eflor and Azhar, and their governments are dissolved. The conquered lands are annexed and handed to the requisition commands.\n\nKaramyshev promised the return - and returned more than the fields. Now these lands will work for Svetlogorye rather than for themselves: no new factories, no schools, under the guard of camp towers. The islands celebrate, but in the conquered towns people already whisper of a new underground, and the junta has yet to hold what it has taken."
 ADISCORD_nam_resource_war.62.d_won_federal: "The coalition's last capital has capitulated. Instead of requisition commands, lawyers of the federal council came to the defeated cities: Eflor and Azhar keep their governments but become federal districts of Svetlogorye. Their resources, factories and recruits now serve the common federation, as they once served the Vorkerland confederation.\n\nThe government calls this unification, not conquest. The investors call it the largest market in the south. The fields have come home, but the new districts have yet to believe that the federation is not another name for occupation."
 ADISCORD_nam_resource_news.8.t: "The End of Svetlogorye"
 ADISCORD_nam_resource_news.8.d: "Svetlogorye's war has ended in defeat. The coalition's troops took the island capital, and the government in exile capitulated. [ROOT.GetName] annexes the islands together with everything Svetlogorye managed to retake on the mainland.\n\nSo ends the history of a country that once owned most of the world's oil. Its flags are taken down from the offices, its flotillas surrendered in the victors' ports, and its fields are divided by the neighbours for good."
 ADISCORD_nam_resource_news.8.a: "The oil of the south has changed hands."
 ADISCORD_nam_resource_news.9.t_radical: "Svetlogorye's Junta Conquers the South"
 ADISCORD_nam_resource_news.9.d_radical: "The war of return has ended in Svetlogorye's victory. Eflor and Azhar have capitulated, and the pillars' junta has annexed both states. The governments are dissolved, the depots sealed by requisition commands, and labour camps are being built in the conquered states.\n\nThe exiles who were recently called pirates stand by their derricks again. The neighbours of the south wonder whether the junta will stop here."
 ADISCORD_nam_resource_news.9.t_federal: "The Federation of Svetlogorye"
 ADISCORD_nam_resource_news.9.d_federal: "The war of return has ended in Svetlogorye's victory. Eflor and Azhar have capitulated but kept their governments: they are now federal districts of Svetlogorye. Their resources, factories and recruits serve the common federation, and their delegates sit in the federal council.\n\nSome see in this the rebirth of the old confederation, others the largest deal in the history of the south. The neighbours wonder whether they too will be offered a seat in this union."
 ADISCORD_nam_resource_news.9.a: "The south changes masters."
 NAM_southern_lands: "The Southern Lands"
 NAM_southern_lands_desc: "After the wars of the exile the south answers to Svetlogorye. The pillars' junta holds the conquered states with labour camps and requisitions; the humanists convene the council of federal districts, whose resources, factories and recruits serve the federation."
 NAM_conquered_state_modifier: "Conquered Land"
 NAM_conquered_state_modifier_desc: "The junta builds neither roads, nor schools, nor factories for the defeated."
 NAM_labour_camp_state: "Labour Camp"
 NAM_labour_camp_state_desc: "The people of the state work in the mines and fields under guard."
 NAM_stripped_state: "Plundered State"
 NAM_stripped_state_desc: "The depots are empty, the machine tools carried off, the transport driven away."
 NAM_radical_labour_camp: "Labour Camp"
 NAM_radical_labour_camp_desc: "Thirty days for fences, barracks and towers. After that the people of the state work in the mines and fields for Svetlogorye under the junta's guard. Nothing is built here, and resistance grows."
 NAM_labour_camp_started_tt: "Construction of the camp begins."
 NAM_labour_camp_done_tt: "If the state is still ours: state resources §G+50%§!, recruitable population §R-50%§!, construction in the state stops, compliance growth §R-10%§!, resistance target §R+15%§!."
 NAM_labour_camp_cancel_tt: "Construction of the camp is interrupted. Political power is not refunded."
 NAM_radical_strip_state: "Requisition the State"
 NAM_radical_strip_state_desc: "The requisition commands empty the depots, dismantle the machine tools and drive off the transport. A state can be plundered only once."
 NAM_strip_state_tt: "Treasury: §G+80§! £ADISCORD_economy_treasury_texticon and another §G+120§! £ADISCORD_economy_treasury_texticon if the state has a civilian factory: it will be dismantled.\nIf the state has a military factory, it will be dismantled: §G+1500§! £infantry_equipment_texticon, §G+100§! support equipment and §G+40§! artillery.\nFuel: §G+1000§! £fuel_texticon.\nState resources §R-25%§! and compliance growth §R-5%§! for §Y365§! days."
 NAM_federal_council_session: "Session of the Federal Council"
 NAM_federal_council_session_desc: "The delegates of one federal district sit down at the table of the federal council. The district votes the federal levy, and its people gain a voice in the common government."
 NAM_federal_council_tt: "Treasury: §G+60§! £ADISCORD_economy_treasury_texticon.\nIn the federal district: stability §G+5%§!, humanism popularity §G+10%§!."
 NAM_drill_currency_loot: "loot"
 NAM_drill_currency_capital: "capital"
 # ----- Exile war, consolidation, great war and the corporate districts -----
 NAM_war_of_return_ready_exile: "The government in exile has overthrown the namestnik, is independent and at peace, Eflor or Azhar still stands, the war of return from exile is neither won nor under way, and the War for the South is not under way"
 NAM_war_of_return_terms_exile: "A war against §YEflor and Azhar§!: both fight in one temporary coalition, and the marines land at South Harbour.\nCapitulation of both returns the fields and the harbour, and the defeated face the government's course: under the pillars' junta - annexation and exploitation, under the humanists - federal districts of Svetlogorye.\nOur capitulation - the annexation of Svetlogorye together with its islands.\nThe war has no time limit: it lasts until one side capitulates completely."
 NAM_exile_found_new_capital_tt: "The exile capital is founded anew: the island is named §YNeo-Svetlogorye§! and its main city §YNeo-Svetlogorsk§!. The new names remain after the return to the mainland."
 NAM_neo_svetlogorsk: "Neo-Svetlogorsk"
 NAM_neo_svetlogorye: "Neo-Svetlogorye"
 ADISCORD_nam_resource_news.9.d_great_radical: "Svetlogorye's great war has ended in victory. The last states of the south have capitulated, and the pillars' junta has annexed them all. The governments are dissolved, the depots sealed, and new labour camps are being built in the conquered states.\n\nThe exiles once called pirates now rule the whole south from the fields to the desert. Their power rests on garrisons, and the whole world knows how it pays for its oil."
 ADISCORD_nam_resource_news.9.d_great_federal: "Svetlogorye's great war has ended in victory. The last states of the south have capitulated but kept their governments: they too are now federal districts of Svetlogorye. Their resources, factories and recruits serve the common federation, and delegates of the whole south sit in one council.\n\nNever has the south been so united, and never has it depended so much on one capital. The money of foreign investors is already flowing into the ports of the new districts."
 NAM_great_war_consolidated_tt: "The hold on the returned south is consolidated: consolidation at least §Y70§! (now §Y[?NAM_consolidation|0]§!)"
 NAM_great_war_targets_tt: "Rakhma, Sardan, Kadir, Eflor or Azhar still stands outside our power"
 NAM_great_war_terms_tt: "A great war against everyone still standing in the south: §YRakhma, Sardan and Kadir§!, and Eflor and Azhar if they are still independent. The dormant neighbours wake, and all targets fight in one temporary coalition.\nCapitulation of every participant - the government's course for each: under the pillars' junta - annexation and exploitation, under the humanists - federal districts of Svetlogorye.\nOur capitulation - the annexation of Svetlogorye.\nThe war has no time limit: it lasts until one side capitulates completely."
 ADISCORD_nam_resource_war.105.t: "The Great War"
 ADISCORD_nam_resource_war.105.d: "Having consolidated its hold on the returned lands, Svetlogorye is no longer content with the fields. Our columns march to the borders of Rakhma, Sardan and Kadir - states that traded our oil throughout the years of exile and divided our south into spheres of influence.\n\nThe neighbours understand that this is no longer about a return but about who will own the whole south. They are gathering a last coalition. If it holds, Svetlogorye will lose everything it has achieved. If it falls, the south will speak with one voice - the one our government chooses."
 ADISCORD_nam_resource_war.105.d_target: "Svetlogorye, which has retaken its fields, has declared a great war on everything still standing in the south. Its army, hardened in the war of return, marches on our borders, and our neighbours are joining a temporary defensive coalition.\n\nIf Svetlogorye capitulates, it will be annexed. If every member of the coalition falls, each will share one fate. There will be no truce: the war lasts until one side capitulates completely."
 ADISCORD_nam_resource_war.105.a: "The whole south - or nothing."
 ADISCORD_nam_resource_war.105.b: "We will defend our land."
 ADISCORD_nam_resource_war.107.t: "The End of the Great War"
 ADISCORD_nam_resource_war.107.d_won_radical: "The coalition's last capital has capitulated. The pillars' junta has annexed the whole south: the governments are dissolved, the depots sealed, and the requisition commands are already listing every mine and every factory.\n\nNever has Svetlogorye been so large and so hated. Karamyshev promised the return - and led the islands to power over desert and sea. Now that power will have to be held with bayonets."
 ADISCORD_nam_resource_war.107.d_won_federal: "The coalition's last capital has capitulated. The defeated keep their governments but become federal districts of Svetlogorye, and delegates of the whole south sit at one table of the federal council for the first time.\n\nThe south is united - not conquered, as the government says, but bound by treaties, credits and a common market. It remains to prove that this federation will outlive those who signed it."
 ADISCORD_nam_resource_war.107.a: "So be it."
 NAM_consolidation: "Consolidation of Power"
 NAM_consolidation_desc: "Consolidation: §Y[?NAM_consolidation|0]§! / 100, change last month §Y[?NAM_consolidation_growth|0]§!.\n\nEach month the hold on the returned south grows by §Y2§!; with stability below §Y40%§! by §Y2§! less. The junta holds the conquered states with garrisons: their upkeep costs §Y3§! £ADISCORD_economy_treasury_texticon a month for every conquered state until consolidation reaches §Y100§!. The humanists strengthen the federation with treaties and reconstruction. While consolidation is below §Y70§!, the states may revolt or take to the streets."
 NAM_consolidation_dynamic: "Hold on the Returned South"
 NAM_consolidation_dynamic_desc: "The firmer the hold on the returned states, the calmer the country and the faster the new lands comply."
 NAM_rad_garrison_order: "Garrison Order"
 NAM_rad_garrison_order_desc: "Ninety days of reinforced garrisons in the conquered states: patrols on the roads, a commandant's office in every town, a pass for every worker."
 NAM_rad_garrison_order_tt: "For §Y90§! days: consolidation §G+3§! a month, garrison upkeep §R20§! £ADISCORD_economy_treasury_texticon a month."
 NAM_rad_garrison_order_end_tt: "The reinforced garrisons return to barracks."
 NAM_rad_terror_campaign: "Campaign of Intimidation"
 NAM_rad_terror_campaign_desc: "Hostages, curfews and show trials break the resistance - for a while."
 NAM_rad_terror_tt: "Consolidation: §G+8§!."
 NAM_hum_federal_treaty: "Federal Treaty"
 NAM_hum_federal_treaty_desc: "The federal council signs a treaty with a district: its rights, its share in the federation and the capital's obligations are put on paper."
 NAM_hum_federal_treaty_tt: "Consolidation: §G+6§!.\nIn the federal district: stability §G+5%§!, humanism popularity §G+5%§!."
 NAM_hum_reconstruction_fund: "Reconstruction Fund"
 NAM_hum_reconstruction_fund_desc: "For sixty days foreign capital rebuilds the districts ruined by the war: bridges, waterworks, schools. The capital returns if the work is interrupted."
 NAM_cost_hum_reconstruction: "§Y60§! capital"
 NAM_cost_hum_reconstruction_blocked: "§R60§! capital"
 NAM_cost_hum_reconstruction_tooltip: "§Y60§! capital\nThe capital returns if the work is interrupted."
 NAM_hum_reconstruction_started_tt: "Foreign capital: §R-60§!; it returns if the work is interrupted."
 NAM_hum_reconstruction_done_tt: "Consolidation: §G+10§!."
 NAM_hum_reconstruction_refund_tt: "The work is interrupted: §G60§! capital returns."
 ADISCORD_nam_resource_war.104.t: "The Restless South"
 ADISCORD_nam_resource_war.104.d_radical: "At night someone blew up the bridge in [NAM_cons_place.GetName] over which the requisition commands carried away grain and ore. By morning slogans in the local dialect covered the walls of the commandant's office, and in the villages nobody saw, nobody heard and nobody knows where the men with rifles hide.\n\nThe commandant asks for reinforcements and the right to take hostages. The treasurer suggests another way: the elders are ready to name names for money. We can also do nothing - but then tomorrow the next bridge will go."
 ADISCORD_nam_resource_war.104.d_federal: "In the capital of the [NAM_cons_district.GetName] district people have taken to the streets: a dockers' strike turned into a march on the federal representation. They demand that the federation pay for what it takes - for ore, for recruits, for the taxes that go to a distant capital.\n\nThe federal council can send mediators and hear the demands. The investors are ready to pay for a quick aid package. We can also wait it out, but then discontent will become a habit."
 ADISCORD_nam_resource_war.104.a: "A punitive garrison."
 ADISCORD_nam_resource_war.104.b: "Pay the elders."
 ADISCORD_nam_resource_war.104.c: "Ignore it."
 ADISCORD_nam_resource_war.104.e: "Send federal mediators."
 ADISCORD_nam_resource_war.104.f: "An aid package from the investors."
 ADISCORD_nam_resource_war.104.g: "Let them protest."
 NAM_cons_104_a_tt: "Consolidation: §G+4§!."
 NAM_cons_104_b_tt: "Treasury: §R-100§! £ADISCORD_economy_treasury_texticon.\nConsolidation: §G+2§!."
 NAM_cons_104_c_tt: "Consolidation: §R-6§!."
 NAM_cons_104_e_tt: "Consolidation: §G+3§!.\nDistrict stability: §G+3%§!."
 NAM_cons_104_f_tt: "Foreign capital: §R-40§!.\nConsolidation: §G+4§!."
 NAM_cons_104_g_tt: "Consolidation: §R-5§!."
 NAM_corp_name_1: "the Yuzhneft Concern"
 NAM_corp_name_2: "the Island Steel Trust"
 NAM_corp_name_3: "Sea Line Shipping"
 NAM_corp_name_4: "the Coastal Arsenal Company"
 NAM_corp_name_5: "the Artel Agency"
 NAM_corp_name_6: "the Island Credit Bank"
 NAM_corp_owner_1_district: "District of the Yuzhneft Concern"
 NAM_corp_owner_1_district_desc: "The oil concern pumps everything that can be pumped: fuel §G+25%§!, stability §R-5%§!. To the board: §Y8§! capital and §Y500§! £fuel_texticon a month."
 NAM_corp_owner_2_district: "District of the Island Steel Trust"
 NAM_corp_owner_2_district_desc: "The steel trust opens new mines: resources §G+15%§!, stability §R-3%§!. To the board: §Y10§! capital a month."
 NAM_corp_owner_3_district: "District of Sea Line Shipping"
 NAM_corp_owner_3_district_desc: "The shipping company turns the district into a transit hub: trade income §G+15%§!, consumer goods §R+3%§!. To the board: §Y10§! capital a month."
 NAM_corp_owner_4_district: "District of the Coastal Arsenal Company"
 NAM_corp_owner_4_district_desc: "The arms company retools the factories for its orders: production efficiency §G+10%§!, war support §R-5%§!. To the board: §Y6§! capital and §Y300§! £infantry_equipment_texticon a month."
 NAM_corp_owner_5_district: "District of the Artel Agency"
 NAM_corp_owner_5_district_desc: "The labour agency recruits workers across the district: recruitable population §G+5%§!, stability §R-8%§!. To the board: §Y12§! capital a month."
 NAM_corp_owner_6_district: "District of the Island Credit Bank"
 NAM_corp_owner_6_district_desc: "The bank lends to the district's factories against its taxes: industrial capacity §G+5%§!, tax collection §R-10%§!. To the board: §Y15§! capital a month."
 NAM_corp_auction_district: "Auction a District Concession"
 NAM_corp_auction_district_desc: "The board of boards puts a district's concession up for auction. The next corporation in line receives it, and the board its bid."
 NAM_corp_auction_tt: "The district passes to the next corporation.\nForeign capital: §G+60§!.\nDistrict stability: §R-5%§!."
 NAM_corp_board_arbitration: "Board Arbitration"
 NAM_corp_board_arbitration_desc: "The dispute between two corporations over a district has gone to the board's arbiters. Until it is settled, the district pays no dividends."
 NAM_cost_corp_arbitration: "§Y25§! £political_power_texticon §Y30§! capital"
 NAM_cost_corp_arbitration_blocked: "§R25§! £political_power_texticon §R30§! capital"
 NAM_cost_corp_arbitration_tooltip: "§Y25§! £political_power_texticon §Y30§! capital"
 NAM_corp_arbitration_tt: "Foreign capital: §R-30§!.\nEqual odds: the district stays with its owner or passes to the claimant. The district pays dividends again."
 NAM_corp_charter_renewal: "Renew a District Charter"
 NAM_corp_charter_renewal_desc: "A district's charter is renewed for another term: the corporation pays for the renewal, the district receives guarantees."
 NAM_corp_renewal_tt: "Foreign capital: §G+40§!.\nDistrict stability: §G+5%§!."
 ADISCORD_nam_resource_war.108.t: "The Corporations Divide a District"
 ADISCORD_nam_resource_war.108.d: "A complaint has reached the board of boards: [NAM_corp_dispute_district.NAMGetCorpClaimantName] demands the concession on the [NAM_corp_dispute_district.GetName] district, now held by [NAM_corp_dispute_district.NAMGetCorpOwnerName]. The claimant promises a generous fee for a decision in its favour; the current owner threatens lawsuits and the recall of its credits.\n\nThe directors look at the chairman. Any decision will offend one of the corporations, and a postponed one will offend both: while the dispute lasts, the district pays nothing."
 ADISCORD_nam_resource_war.108.a: "Give the district to the claimant."
 ADISCORD_nam_resource_war.108.b: "Confirm the owner's rights."
 ADISCORD_nam_resource_war.108.c: "Refer the dispute to the arbiters."
 NAM_corp_108_a_tt: "The district passes to the claimant.\nForeign capital: §G+40§!."
 NAM_corp_108_b_tt: "The district stays with its owner.\nForeign capital: §R-20§! - compensation to the claimant."
 NAM_corp_108_c_tt: "The dispute goes to the board's arbitration: until it is settled the district pays no dividends."
