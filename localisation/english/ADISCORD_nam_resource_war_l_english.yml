 NAM_rival_name_4: "$NAM_Lev_Gavanov$"
 NAM_rival_pillar_1: "Governors"
 NAM_rival_pillar_2: "Oil workers"
 NAM_rival_pillar_3: "Garrisons"
 NAM_rival_pillar_4: "Export houses"
 NAM_rival_term_1: "§Y100§! £political_power_texticon for the register of seals"
 NAM_rival_term_2: "§Y8000§! £fuel_texticon for the Klyuchevsk depots"
 NAM_rival_term_3: "§Y5000§! £manpower_texticon of garrison replacements"
 NAM_rival_term_4: "§Y200§! £ADISCORD_economy_treasury_texticon for the port houses"
 NAM_rival_refusal_heard: "The rival was heard in council: \"[NAMGetRivalPillar]\" support falls by §R8§!, but he will not claim power."
 NAM_rival_refusal_coup: "\"[NAMGetRivalPillar]\" support falls by §R15§!.\n§RThe pillar is already below 25: [NAMGetRivalName] will demand the leadership of the country.§!"
 NAM_rival_refusal_plain: "\"[NAMGetRivalPillar]\" support falls by §R15§!. If the pillar drops below §Y25§!, the next refusal will give the rival grounds to claim power."
 ADISCORD_nam_groups.20.t: "A Demand: [NAMGetRivalName]"
 ADISCORD_nam_groups.20.d_pechat: "Vera Saburova arrived unannounced and laid the register of appointments on the desk. Half of the governors' seals have expired and the new forms are unpaid. She demands that 100 £political_power_texticon be invested in the register and gives the chancery 60 days.\n\nThe governors stand behind her. If refused, she will not argue: she will simply stop registering appointments, and the ladder will start to crumble rung by rung."
 ADISCORD_nam_groups.20.d_klyuch: "Arseny Tarkhanov has come from Klyuchevsk with a delegation of foremen. The field depots are empty: the army and exports have taken everything. He demands that 8000 £fuel_texticon be returned to the oilfields within 60 days, or the oil workers will stop regarding the chancery as their own.\n\nTarkhanov speaks calmly, but the foremen behind him are silent in the way people are silent before a strike."
 ADISCORD_nam_groups.20.d_shtyk: "Taras Drozdov has sent a report, not a request. The garrisons are under strength, posts are held by a single man, and the commandant demands 5000 £manpower_texticon of replacements within 60 days.\n\nAt the end of the report he notes that soldiers remember who feeds them. It can be read as concern for the service. It can also be read as a warning."
 ADISCORD_nam_groups.20.d_gavanov: "Lev Kornilov receives guests in the South Harbour and talks of trade with the whole world. The port houses need money for quays and cargo insurance: 200 £ADISCORD_economy_treasury_texticon within 60 days.\n\nKornilov promises the investment will pay off. He does not promise that the houses will stay loyal if the chancery refuses."
 ADISCORD_nam_groups.20.a: "Accept the terms."
 ADISCORD_nam_groups.20.b: "Refuse."
 NAM_rival_demand_accept_tt: "A §Y60-day§! mission begins: as soon as we have [NAMGetRivalTerm], the term is fulfilled and paid, and \"[NAMGetRivalPillar]\" support rises by §G10§!. If the deadline passes, it counts as a refusal."
 NAM_rival_demand_refuse_tt: "[NAMGetRivalRefusal]"
 NAM_rival_demand: "A Rival's Terms"
 NAM_rival_demand_desc: "§YDEADLINE§!: §Y60§! £time_texticon days\n\n§YRESULT§!\n§YRIVAL§!: [NAMGetRivalName]\n§YDEMAND§!: [NAMGetRivalTerm].\nThe demand is fulfilled as soon as we have the necessary means.\n\n§YAT THE DEADLINE§!\nAn unmet demand counts as a refusal."
 NAM_rival_demand_met_tt: "We have [NAMGetRivalTerm]"
 NAM_rival_demand_paid_tt: "We hand over [NAMGetRivalTerm].\n\"[NAMGetRivalPillar]\" support: §G+10§!."
 NAM_rival_demand_broken_tt: "The deadline has passed and the promise is broken. [NAMGetRivalRefusal]"
 ADISCORD_nam_groups.21.t: "[NAMGetRivalName] Claims the Seals"
 ADISCORD_nam_groups.21.d_pechat: "In the morning the registry did not open. Vera Saburova has moved the register of appointments to the governorate building, and without her signature no office can replace its head. The governors have gathered around her and demand that the chancery be led by someone who knows where every seal lies.\n\nIf we yield, the register will rule Svetlogorye. If we resist, we will need the garrisons or the streets - and one of them must be on our side."
 ADISCORD_nam_groups.21.d_klyuch: "The Klyuchevsk oilfields have stopped on Arseny Tarkhanov's order. The foremen are not on strike - they are waiting to see whom the chancery recognises. Tarkhanov offers a simple bargain: the oil will flow again when the country is run by the man who extracts it.\n\nWithout Klyuchevsk, Svetlogorye has neither fuel nor money. To yield is to hand the state to the oilfields. Resistance is possible, but it needs someone who does not depend on his oil."
 ADISCORD_nam_groups.21.d_shtyk: "The Svetlogorsk garrisons have occupied the crossroads, the telegraph and the station. Taras Drozdov calls it a security measure and demands the leadership of the country before the neighbours exploit the chancery's weakness.\n\nThere is nobody to arrest the commandant: the garrisons obey him. Only the districts remain - if they take to the streets, the soldiers will have to choose whom to aim at."
 ADISCORD_nam_groups.21.d_gavanov: "The South Harbour is closed. Lev Kornilov has held the tankers at the quays and announced that the port obeys only a government that knows how to trade. Overseas buyers are already asking whom to sign contracts with.\n\nKornilov has no army, but he holds the money and the way to the sea. If we yield, Svetlogorye becomes a trading house. If we resist, the garrisons or the districts will have to take the harbour back."
 ADISCORD_nam_groups.21.a: "Arrest the rebel."
 ADISCORD_nam_groups.21.b: "Bring the districts into the streets."
 ADISCORD_nam_groups.21.c: "Yield the seals."
 NAM_rival_can_arrest_tt: "The rebel does not command the garrisons, garrison support is at least §Y50§!, and §Y75§! £political_power_texticon are available"
 NAM_rival_can_rally_tt: "District support is at least §Y60§! and the ladder of seals leans towards the districts"
 NAM_coup_arrest_tt: "[NAMGetRivalName] leaves Svetlogorsk politics for good.\n\"[NAMGetRivalPillar]\" support: §R-10§!."
 NAM_coup_rally_tt: "[NAMGetRivalName] leaves Svetlogorsk politics for good.\nGroup support:\n  Governors: §R-10§! £NAM_support_nam_texticon\n  Districts: §G+5§! £NAM_support_dist_texticon"
 NAM_coup_yield_tt: "§R[NAMGetRivalName] becomes head of Svetlogorye for the rest of its course§!; Egor Rom resigns.\nThe §YJunta of Seals§! is imposed for §Y365 days§!.\n\"[NAMGetRivalPillar]\" support: §G+15§!, district support: §R-10§! £NAM_support_dist_texticon.\nThe ladder of seals shifts §Y0.15§! towards the vertical; underground: §R+10§!.\nRivals no longer present demands."

 # Underground
 NAM_underground: "Yaroslav Weber's Underground"
 NAM_underground_desc:0 "§YUNDERGROUND STATUS§!\nStrength: §Y[?NAM_underground|0] / 100§! £operatives_boost_resistance_texticon\n[NAMGetUndergroundStatus]\n[NAMGetUndergroundNext]\n\n§YMONTHLY GROWTH§!\nFrom the first days of the colony until the resource war:\n- §R+3§! £operatives_boost_resistance_texticon - base growth.\n- §R+2§! - district support below §Y40§! £NAM_support_dist_texticon; another §R+1§! below §Y25§!.\n- §R+2§! - the ladder of seals leans towards the vertical.\n- §G-1§! - district support at least §Y60§! £NAM_support_dist_texticon.\n- §G-3§! - the Svetlogorsk compact is paid.\n- §G-3§! - underground printing supplies are being controlled.\nLast month: [?NAM_underground_growth|=-0] £operatives_boost_resistance_texticon.\n\n§YTHREATS§!\nAt §Y30§! £operatives_boost_resistance_texticon or more, strikes at fields, depots and governors become possible.\nAt the start of the resource war, without amnesty or a ratified compact:\n- Below §G30§! - no uprising.\n- §Y30-59§! - a §Y50%§! chance of uprising.\n- At least §R60§! - an uprising is certain.\nPipeline watch posts and the counter-leaflet campaign each reduce monthly growth by a further §G2§! £operatives_boost_resistance_texticon while active."
 NAM_underground_status_high: "§RWeber is ready to raise the city.§!"
 NAM_underground_status_mid: "§YThe underground may rise.§!"
 NAM_underground_status_low: "§GThe underground is too weak to rise.§!"
 NAM_underground_amnestied: "§GYaroslav Weber accepted the amnesty; the underground is gone.§!"
 NAM_weber_talks_1: "First Meeting with Weber"
 NAM_weber_talks_1_desc: "§YCOST§!: §Y25§! £political_power_texticon\n§YCOMPLETION§!: §Y30§! £time_texticon days\n§YRETRY IF INTERRUPTED§!: after §Y30§! £time_texticon days\n\n§YRESULT§!\nDistrict intermediaries offer Weber a meeting.\nAfter talks: underground §G-10§! £operatives_boost_resistance_texticon, district support §G+3§! £NAM_support_dist_texticon.\n\n§YIF INTERRUPTED§!\nAn uprising in Svetlogorsk interrupts talks. Political power is not refunded."
 NAM_weber_talks_possible_tt: "The underground exists, no uprising has begun and Svetlogorye can act"
 NAM_weber_talks_started_tt: "In §Y30 days§! the talks produce a result unless they are broken off."
 NAM_weber_talks_1_tt: "Underground: §G-10§!.\nDistrict support: §G+3§! £NAM_support_dist_texticon.\nThe second round of talks opens."
 NAM_weber_talks_1_cancel_tt: "The talks are broken off. The political power spent is not refunded."
 NAM_weber_talks_2: "Second Meeting: Lists and Guarantees"
 NAM_weber_talks_2_desc: "§YCOST§!: §Y50§! £political_power_texticon §Y100§! £ADISCORD_economy_treasury_texticon\n§YCOMPLETION§!: §Y30§! £time_texticon days\n§YRETRY IF INTERRUPTED§!: after §Y30§! £time_texticon days\n\n§YRESULT§!\nGuarantees to Weber: public detention lists and paid service for those leaving the underground.\nAfter talks: underground §G-10§! £operatives_boost_resistance_texticon, districts §G+5§! £NAM_support_dist_texticon, namestniks §R-3§! £NAM_support_nam_texticon.\n\n§YIF INTERRUPTED§!\nThe treasury deposit is refunded. Political power is not refunded."
 NAM_weber_talks_2_started_tt: "Treasury: §R-100§! £ADISCORD_economy_treasury_texticon.\nIn §Y30 days§! the talks produce a result unless they are broken off."
 NAM_weber_talks_2_cancel_tt: "The talks are broken off. Treasury: §G+100§! £ADISCORD_economy_treasury_texticon; the political power spent is not refunded."
 NAM_weber_talks_2_tt: "Underground: §G-10§!.\nGroup support:\n  Districts: §G+5§! £NAM_support_dist_texticon\n  Governors: §R-3§! £NAM_support_nam_texticon\nThe last round - the amnesty - opens."
 NAM_weber_talks_3: "Amnesty for Yaroslav Weber"
 NAM_weber_talks_3_desc: "§YCOST§!: §Y75§! £political_power_texticon §Y200§! £ADISCORD_economy_treasury_texticon\n§YCOMPLETION§!: §Y45§! £time_texticon days\n§YRETRY IF INTERRUPTED§!: after §Y30§! £time_texticon days\n\n§YRESULT§!\nAmnesty permanently dissolves the underground and prevents the Svetlogorsk uprising. Yaroslav Weber becomes a Svetlogorye general.\nCompletion requires district support.\n\n§YIF INTERRUPTED§!\nThe treasury deposit is refunded. Political power is not refunded."
 NAM_weber_amnesty_backing_tt: "District support is at least §Y50§!"
 NAM_weber_talks_3_started_tt: "Treasury: §R-200§! £ADISCORD_economy_treasury_texticon.\nIn §Y45 days§! the amnesty is proclaimed unless the talks are broken off."
 NAM_weber_talks_3_cancel_tt: "The talks are broken off. Treasury: §G+200§! £ADISCORD_economy_treasury_texticon; the political power spent is not refunded."
 NAM_weber_amnesty_tt: "§GThe underground dissolves for good: there will be no Svetlogorsk uprising.§!\n§YYaroslav Weber§! enters Svetlogorye's service as a general.\nGroup support:\n  Districts: §G+10§! £NAM_support_dist_texticon\n  Governors: §R-5§! £NAM_support_nam_texticon\nThe ladder of seals shifts §Y0.10§! towards the districts."
 NAM_cost_weber_talks_2: "§Y50§! £political_power_texticon §Y100§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_weber_talks_2_blocked: "§R50§! £political_power_texticon §R100§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_weber_talks_2_tooltip: "§Y50§! £political_power_texticon §Y100§! £ADISCORD_economy_treasury_texticon\nThe price is paid when the talks begin. If they are broken off, the treasury is refunded but the political power is not."
 NAM_cost_weber_talks_3: "§Y75§! £political_power_texticon §Y200§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_weber_talks_3_blocked: "§R75§! £political_power_texticon §R200§! £ADISCORD_economy_treasury_texticon"
 NAM_cost_weber_talks_3_tooltip: "§Y75§! £political_power_texticon §Y200§! £ADISCORD_economy_treasury_texticon\nThe price is paid when the talks begin. If they are broken off, the treasury is refunded but the political power is not."
 NAM_hunt_caches: "Hunt the Underground's Caches"
 NAM_hunt_caches_desc: "§YCOST§!: §Y30§! £political_power_texticon\n§YCOOLDOWN§!: §Y30§! £time_texticon days after use.\n§YSAME DISTRICT§!: after §Y180§! £time_texticon days\n\n§YRESULT§!\nInspectors and field gendarmes search the district.\nTo our stockpile: §G+4500§! £infantry_equipment_texticon.\nUnderground: §G-10§! £operatives_boost_resistance_texticon; districts: §R-5§! £NAM_support_dist_texticon."
 NAM_underground_left_tt: "The underground still exists"
 NAM_caches_not_searched_tt: "The district has not been searched in the last §Y180 days§!"
 NAM_hunt_caches_tt: "Underground: §G-10§!.\nDistrict support: §R-5§! £NAM_support_dist_texticon."
 ADISCORD_nam_groups.30.t: "Yaroslav Weber Leaves the Underground"
 ADISCORD_nam_groups.30.d: "The third round of talks ended not in a back room but on the square by the station. Yaroslav Weber came without guards and handed the district representatives the lists of his caches. In return the chancery publishes an amnesty: nobody from the underground will be prosecuted for the past if they lay down their arms.\n\nWeber has not become an ally of the government. He has become a man the districts trust more than the chancery, and who will now serve in Svetlogorye's army. There will be no more uprising in Svetlogorsk - unless the chancery once again stops answering petitions."
 ADISCORD_nam_groups.30.a: "Let the city remember this day."

 # Mobilisation reports
 NAM_orders_delivered_tt: "Every prepared formation has taken the field: §Y[?NAM_orders_delivered|0]§!.\n  Field guards: §Y[?NAM_orders_delivered_guard|0]§!\n  Field infantry: §Y[?NAM_orders_delivered_infantry|0]§!\n  Motorised divisions: §Y[?NAM_orders_delivered_motor|0]§!\n  Coastal detachments: §Y[?NAM_orders_delivered_coastal|0]§!"
 NAM_orders_none_delivered_tt: "No formations were prepared under mobilisation orders: the standing units and the three baseline reserve divisions hold the front."
 ADISCORD_nam_resource_war.24.t: "Mobilisation Stood Down"
 ADISCORD_nam_resource_war.24.d: "The neighbours never crossed the border: the staff has cancelled the alert and the coalition troops have returned to barracks. The deadline for which Svetlogorye prepared its mobilisation has passed without a war.\n\nThe chancery has disbanded every prepared formation and returned to the budget whatever could still be returned: treasury, fuel and people. The political power spent on the orders is not returned."
 ADISCORD_nam_resource_war.24.a: "Let the people go back to work."
 NAM_orders_refunded_tt: "Formations disbanded: field guards §Y[?NAM_orders_refunded_guard|0]§!, field infantry §Y[?NAM_orders_refunded_infantry|0]§!, motorised divisions §Y[?NAM_orders_refunded_motor|0]§!, coastal detachments §Y[?NAM_orders_refunded_coastal|0]§!.\nThe recruits, the treasury and the motorised divisions' fuel have been returned."

 # War of return
 NAM_war_of_return_ready_tt: "[NAMGetWarOfReturnReady]"
 NAM_war_of_return_start_tt: "The §Ywar of return§! begins. [NAMGetWarOfReturnTerms]"
 ADISCORD_nam_resource_war.60.t: "The War of Return"
 ADISCORD_nam_resource_war.60.d: "The army rebuilt after the defeat has crossed the new border. Svetlogorye has declared war on the owners of its former fields and the South Harbour and demands the return of the Northern Deposits, the Svetlogorsk District, the South Coast, Sukhorechye and the harbour.\n\nThis time there is nowhere to retreat. If we lose, the neighbours will take everything left on the mainland. If we win, the fields come home. There will be no mediators: the war ends only when one side lays down its arms."
 ADISCORD_nam_resource_war.60.d_target: "Svetlogorye has declared a war of return. Its army demands the fields that passed to us under the compromise peace. If Svetlogorye capitulates, its lands will be partitioned for good; if every current owner of the fields falls, they return to Svetlogorye. There will be no truce: the war lasts until one side capitulates completely."
 ADISCORD_nam_resource_war.60.a: "Forward, to the fields."
 ADISCORD_nam_resource_war.60.b: "We will defend our land."
 NAM_war_of_return_terms_tt: "[NAMGetWarOfReturnTerms]"
 ADISCORD_nam_resource_war.62.t: "The End of the War of Return"
 ADISCORD_nam_resource_war.62.d_won: "The last owner of our fields has capitulated. No mediators were needed: Svetlogorsk columns already stand by the derricks, and our flags fly over the offices again. The Northern Deposits and the other fields are coming home.\n\nThe price was high, but now it is a price paid for our own, not for someone else's decision."
 ADISCORD_nam_resource_war.62.a: "Back to work."

 # Punishment of the defeated coalition
 NAM_ruined_economy: "Ruined Economy"
 NAM_ruined_economy_desc: "The war for Svetlogorsk oil has bankrupted the treasury and the factories. Until the debts are paid and the workshops rebuilt, the economy runs at half strength."
 NAM_army_of_shame: "Army of Shame"
 NAM_army_of_shame_desc: "The army lost a war it had been promised to win in a single campaign. Officers avoid each other's eyes, soldiers do not trust orders, and recruits are in no hurry to report."

