 NAM_bw_summary_text:0 "Throughput: §Y[?NAM_oil_throughput|0]§! units, §Y[?NAM_oil_committed|0]§! committed: contracts §Y[?NAM_oil_contracts|0]§![NAMBasinTribute].\nFree: overland §Y[?NAM_oil_free_land_units|0]§!, for overseas buyers §Y[?NAM_oil_free_units|0]§!.\nBuyers: [NAMBasinClientsNone][EFL.NAMBasinClient][AZH.NAMBasinClient][VAL.NAMBasinClient][STP.NAMBasinClient][STS.NAMBasinClient][RHM.NAMBasinClient][MZR.NAMBasinClient][SHL.NAMBasinClient][RUS.NAMBasinClient][WEF.NAMBasinClient][KDR.NAMBasinClient][SDR.NAMBasinClient][GLP.NAMBasinClient][KYZ.NAMBasinClient]\nEmbargo: [NAMBasinEmbargoNone][EFL.NAMBasinEmbargo][AZH.NAMBasinEmbargo][SHL.NAMBasinEmbargo]\nIslands: steel levy - [NAMBasinLevy]; convoy line - [NAMBasinConvoy]; [231.GetName] concession - [NAMBasinConcession231]."
 NAM_bw_summary_tt:0 "One throughput unit is one standing delivery. Each month a contract gives the buyer §Y1500§! £fuel_texticon and the treasury §G40§! £ADISCORD_economy_treasury_texticon; a month without the fuel in stock skips the delivery and the payment. The South Harbour sea terminal serves only overseas buyers. Contracts, embargoes and the islands are managed in their own decision categories.\nAn active export dispatch office adds §G+30§! £ADISCORD_economy_treasury_texticon for each completed monthly delivery."
 NAM_bw_tribute:0 ", tribute to Eflor and Azhar §Y2§!"
