 NAM_cost_pirate_convoys_tooltip: "§Y60§! loot"
 NAM_pirate_spend_60_tt: "Loot: §R-60§!."
 NAM_pirate_fence_loot: "Sell Loot to the Fences"
 NAM_pirate_fence_loot_desc: "The fences pay a pittance for loot, but the exile's treasury is empty and wages will not wait."
 NAM_cost_pirate_fence: "§Y50§! loot"
 NAM_cost_pirate_fence_blocked: "§R50§! loot"
