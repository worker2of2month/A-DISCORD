 NAM_pw_lane_crossing_name:0 "Charden Ferry"
 NAM_pw_route_oil_tt:0 "§YOil Run§!: tankers of [AZH.GetName] bound for the bay of [EFL.GetName] past the eastern cape of the main island.\n[NAMPwLaneOilStatus]\n\nPrice: [NAMPwRaidCost]. The flotilla sails for §Y15§! days; if the raid is interrupted, the fuel returns.\n\nOutcome (base weights: success §Y50§!, prize §Y15§!, failure §Y35§!):\n- success: §G+60§! loot and §G+1000§! £fuel_texticon, the lane's owners lose §R2000§! £fuel_texticon between them; notoriety §R+10§!;\n- prize: §G+100§! loot, §G+2000§! £fuel_texticon, §G+9000§! £infantry_equipment_texticon, §G+3§! £convoy_texticon, the owners lose §R3000§! £fuel_texticon between them; notoriety §R+12§!;\n- failure: a patrol ship or §R1000§! £manpower_texticon; notoriety §R+5§!.\n\nOutcome weight multipliers:\n- [NAMPwShipsFactor]\n- [NAMPwLaneOilAlert]\n- [NAMPwBlockadeFactor]\n- [NAMPwNotorietyFactor]\n- The richest cargoes: prize outcome weight §Gx1.5§!.\n\nThere is no pause between raids, but after a raid the lane's owners stay alert for §Y90§! days."
 NAM_pw_route_coast_tt:0 "§YNorthern Coast Run§!: ships of [RIV.GetName] and [EFL.GetName] along the mainland shore north of the islands.\n[NAMPwLaneCoastStatus]\n\nPrice: [NAMPwRaidCost]. The flotilla sails for §Y15§! days; if the raid is interrupted, the fuel returns.\n\nOutcome (base weights: success §Y50§!, prize §Y15§!, failure §Y35§!):\n- success: §G+60§! loot and §G+1000§! £fuel_texticon, the lane's owners lose §R2000§! £fuel_texticon between them; notoriety §R+10§!;\n- prize: §G+100§! loot, §G+2000§! £fuel_texticon, §G+9000§! £infantry_equipment_texticon, §G+3§! £convoy_texticon, the owners lose §R3000§! £fuel_texticon between them; notoriety §R+12§!;\n- failure: a patrol ship or §R1000§! £manpower_texticon; notoriety §R+5§!.\nWithout Eflor's ships it is a lane without the coalition: §G+50§! loot, notoriety §R+6§!, §R+8§! and §R+3§!.\n\nOutcome weight multipliers:\n- [NAMPwShipsFactor]\n- [NAMPwLaneCoastAlert]\n- [NAMPwBlockadeFactor]\n- [NAMPwNotorietyFactor]\n\nThere is no pause between raids, but after a raid the lane's owners stay alert for §Y90§! days."
 NAM_pw_route_strait_tt:0 "§YLuren Strait§!: ships of [ULV.GetName] and [LUR.GetName] in the strait south of the islands.\n[NAMPwLaneStraitStatus]\n\nPrice: [NAMPwRaidCost]. The flotilla sails for §Y15§! days; if the raid is interrupted, the fuel returns.\n\nOutcome (base weights: success §Y50§!, prize §Y15§!, failure §Y35§!):\n- success: §G+50§! loot and §G+1000§! £fuel_texticon, the lane's owners lose §R2000§! £fuel_texticon between them; notoriety §R+6§!;\n- prize: §G+100§! loot, §G+2000§! £fuel_texticon, §G+9000§! £infantry_equipment_texticon, §G+3§! £convoy_texticon, the owners lose §R3000§! £fuel_texticon between them; notoriety §R+8§!;\n- failure: a patrol ship or §R1000§! £manpower_texticon; notoriety §R+3§!.\n\nOutcome weight multipliers:\n- [NAMPwShipsFactor]\n- [NAMPwLaneStraitAlert]\n- [NAMPwBlockadeFactor]\n- [NAMPwNotorietyFactor]\n\nThere is no pause between raids, but after a raid the lane's owners stay alert for §Y90§! days."
 NAM_pw_route_crossing_tt:0 "§YCharden Ferry§!: ships of [CHD.GetName] between the islands to the bay of [RIV.GetName].\n[NAMPwLaneCrossingStatus]\n\nPrice: [NAMPwRaidCost]. The flotilla sails for §Y15§! days; if the raid is interrupted, the fuel returns.\n\nOutcome (base weights: success §Y50§!, prize §Y15§!, failure §Y35§!):\n- success: §G+50§! loot and §G+1000§! £fuel_texticon, the lane's owners lose §R2000§! £fuel_texticon between them; notoriety §R+6§!;\n- prize: §G+100§! loot, §G+2000§! £fuel_texticon, §G+9000§! £infantry_equipment_texticon, §G+3§! £convoy_texticon, the owners lose §R3000§! £fuel_texticon between them; notoriety §R+8§!;\n- failure: a patrol ship or §R1000§! £manpower_texticon; notoriety §R+3§!.\n\nOutcome weight multipliers:\n- [NAMPwShipsFactor]\n- [NAMPwLaneCrossingAlert]\n- [NAMPwBlockadeFactor]\n- [NAMPwNotorietyFactor]\n\nThere is no pause between raids, but after a raid the lane's owners stay alert for §Y90§! days."
