 NAM_mobilisation_active_desc:0 "§YPREPARED FORMATIONS§!\n[NAMGetOrdersSummary]\n\n§YPAYMENT AND DEPLOYMENT§!\nAn order debits its price and recruits immediately. The treasury equips the formation; it deploys at full strength on the day the war begins.\nCancellation before the war returns treasury, fuel and recruits. Political power is not refunded.\n\n§YOILFIELD DEFENCE§!\nLines under construction: §Y[?NAM_lines_in_progress|0] / [?NAM_line_slots|0]§! £fort_texticon\nSeal discipline: §Y[?NAM_seal_discipline|0] / 100§!\nArmy organisation: [?NAM_seal_org_factor|=+1%] £organization_texticon\n\n§YHOLD ORDERS§!\n- Northern Deposits: [NAMGetHold67]\n- South Coast: [NAMGetHold689]\n- Sukhorechye: [NAMGetHold690]"
