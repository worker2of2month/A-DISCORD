 NAM_concede_nam: "Concession to the Namestniks"
 NAM_concede_nam_desc: "§YCOST§!: §Y30§! £political_power_texticon\n§YCOOLDOWN§!: §Y60§! £time_texticon days after use.\n\n§YRESULT§!\nThe namestniks receive new powers and honorary posts.\nSupport: namestniks §G+12§! £NAM_support_nam_texticon; districts §R-5§! £NAM_support_dist_texticon."
 NAM_concede_nam_tt: "Group support:\n  Namestniks: §G+12§! £NAM_support_nam_texticon\n  Districts: §R-5§! £NAM_support_dist_texticon"
 NAM_concede_oil: "Concession to the Oil Workers"
 NAM_concede_oil_desc: "§YCOST§!: §Y30§! £political_power_texticon\n§YCOOLDOWN§!: §Y60§! £time_texticon days after use.\n\n§YRESULT§!\nThe oil fields receive a pay rise and new barracks.\nSupport: oil workers §G+12§! £NAM_support_oil_texticon; export houses §R-5§! £NAM_support_trade_texticon."
 NAM_concede_oil_tt: "Group support:\n  Oil workers: §G+12§! £NAM_support_oil_texticon\n  Export houses: §R-5§! £NAM_support_trade_texticon"
 NAM_concede_dist: "Concession to the Districts"
 NAM_concede_dist_desc: "§YCOST§!: §Y30§! £political_power_texticon\n§YCOOLDOWN§!: §Y60§! £time_texticon days after use.\n\n§YRESULT§!\nThe districts receive the right to dispose of part of the local dues.\nSupport: districts §G+12§! £NAM_support_dist_texticon; namestniks §R-5§! £NAM_support_nam_texticon."
 NAM_concede_dist_tt: "Group support:\n  Districts: §G+12§! £NAM_support_dist_texticon\n  Namestniks: §R-5§! £NAM_support_nam_texticon"
 NAM_concede_garr: "Concession to the Garrisons"
 NAM_concede_garr_desc: "§YCOST§!: §Y30§! £political_power_texticon\n§YCOOLDOWN§!: §Y60§! £time_texticon days after use.\n\n§YRESULT§!\nThe garrisons receive new equipment and supply priority.\nSupport: garrisons §G+12§! £NAM_support_garr_texticon; export houses §R-5§! £NAM_support_trade_texticon."
 NAM_concede_garr_tt: "Group support:\n  Garrisons: §G+12§! £NAM_support_garr_texticon\n  Export houses: §R-5§! £NAM_support_trade_texticon"
 NAM_concede_trade: "Concession to the Export Houses"
 NAM_concede_trade_desc: "§YCOST§!: §Y30§! £political_power_texticon\n§YCOOLDOWN§!: §Y60§! £time_texticon days after use.\n\n§YRESULT§!\nThe export houses receive preferential oil export quotas.\nSupport: export houses §G+12§! £NAM_support_trade_texticon; oil workers §R-5§! £NAM_support_oil_texticon."
 NAM_concede_trade_tt: "Group support:\n  Export houses: §G+12§! £NAM_support_trade_texticon\n  Oil workers: §R-5§! £NAM_support_oil_texticon"
 ADISCORD_nam_groups.1.t: "A Pillar Grows Restless"
 ADISCORD_nam_groups.1.d_nam: "The namestniks are no longer sure the chancellery remembers on whom Svetlogorye rests. Reports are delayed, seals are applied late, and the districts say the old ladder may remember how to halt decisions.\n\nIf we do not answer now, grumbling will turn into sabotage."
 ADISCORD_nam_groups.1.d_oil: "The oil fields are restless. Oil workers gather at the offices and demand to know why their work feeds everyone but themselves. Foremen warn that the next shift may not come out.\n\nWithout oil, Svetlogorye loses both money and fuel."
 ADISCORD_nam_groups.1.d_dist: "The districts believe the chancellery is deciding for them again. Assemblies refuse to approve dues, and local councils send complaint after complaint.\n\nThe districts will not take up arms, but they may stop working for the state."
 ADISCORD_nam_groups.1.d_garr: "Garrison officers say the army is remembered only before a war. Pay is late, depots are emptying, and the barracks talk ever louder about whom they actually serve.\n\nA discontented garrison is more dangerous than any neighbour."
 ADISCORD_nam_groups.1.d_trade: "The export houses are losing contracts and patience. Merchants close accounts, cargo sits in port, and brokers look for buyers beyond Svetlogorye.\n\nThe treasury will feel it first."
 ADISCORD_nam_groups.1.a: "Make concessions."
 ADISCORD_nam_groups.1.b: "Lean on their rivals."
 ADISCORD_nam_groups.1.c: "Wait out the discontent."
 ADISCORD_nam_groups.2.t: "A Pillar's Demand"
 ADISCORD_nam_groups.2.d_nam: "The namestniks feel their strength. Their assembly demands that the ladder hold the right of the final signature, and promises in return an order not even the empire knew.\n\nAgreeing strengthens them but weakens the districts."
 ADISCORD_nam_groups.2.d_oil: "The oil workers demand a fixed share of the oil fields' revenue. In return they promise unprecedented output.\n\nAgreeing pleases the oil fields, but the export houses lose profit."
 ADISCORD_nam_groups.2.d_dist: "The districts demand that their assemblies approve every chancellery decision within their borders. In return they promise calm and order locally.\n\nAgreeing pleases the districts, but the namestniks will take it as a defeat."
 ADISCORD_nam_groups.2.d_garr: "The garrisons demand a place of their own in the government. In return the officers promise an army ready for any war.\n\nAgreeing strengthens the army, but the export houses will pay for its upkeep."
 ADISCORD_nam_groups.2.d_trade: "The export houses demand a monopoly on oil exports. In return they are ready to pay a large sum into the treasury at once.\n\nAgreeing fills the treasury, but the oil fields will feel sold."
 ADISCORD_nam_groups.2.a: "Accept the demand."
 ADISCORD_nam_groups.2.b: "Refuse."
 ADISCORD_nam_groups.11.t: "A New Order for Svetlogorye"
 ADISCORD_nam_groups.11.d_iron: "The ladder of seals has become the state. Namestniks govern the districts in the chancellery's name, garrisons stand at every office, and decisions flow from the top without long disputes.\n\nSvetlogorye has become strong and obedient. It remains to be seen for how long."
 ADISCORD_nam_groups.11.d_service: "The ladder has turned into a civil service. Posts are earned by work, the districts and oil fields take part in government, and the namestniks have become officials.\n\nSvetlogorye has become a state of servants, not of seals."
 ADISCORD_nam_groups.11.d_federation: "The charter has become a federation of districts. Each district manages its own affairs, and common questions go to the council. Only archives remain of the old ladder.\n\nSvetlogorye has become a union of communities bound by a common agreement."
 ADISCORD_nam_groups.11.d_oil_union: "The charter has become the foundation of the Svetlogorye Union. The oil fields are run by workers and the state, and oil has become the foundation of the common order.\n\nSvetlogorye has become a state of oil workers."
 ADISCORD_nam_groups.11.a: "Such is the new Svetlogorye."
 NAM_grp_crisis_concede_tt: "Political power: §R-50§!. Group support: §G+15§!."
 NAM_grp_crisis_rivals_tt: "The group's rivals: §G+8§!, the group itself: §R-5§!. Stability: §R-2%§!."
 NAM_grp_crisis_wait_tt: "Stability: §R-4%§!. Group support recovers only over time."
 NAM_grp_demand_accept_tt: "The group gets its way: namestniks - §G+75§! £political_power_texticon, oil workers - §G+5000§! £fuel_texticon, districts - §G+3%§! £stability_texticon, garrisons - §G+25§! £army_experience, export houses - §G+250§! £ADISCORD_economy_treasury_texticon. Its rivals: §R-10§!."
 NAM_grp_demand_refuse_tt: "Group support: §R-15§!."
 NAM_crisis_office: "Incident Office"
 NAM_crisis_office_desc: "Fires, strikes and scandals no longer catch the chancellery off guard. The office keeps an emergency fund and a procedure for every misfortune."
 NAM_field_firefighters: "Oilfield Fire Brigades"
 NAM_field_firefighters_desc: "Every oil field receives a fire brigade and a stock of foam, and mediators settle with strikers more cheaply than any chancellery concession."
 NAM_chancellery_purge: "Purge of the Chancellery"
 NAM_chancellery_purge_desc: "An audit removes the greediest from the chancellery, and the customs guard shares seized goods with the treasury. The namestniks are displeased, the districts glad."
 NAM_field_firefighters_tt: "An oilfield fire is put out at no cost to the treasury.\nConceding to striking oil workers costs §Y100§! £ADISCORD_economy_treasury_texticon instead of §Y250§!."
 NAM_chancellery_purge_tt: "Hushing up a chancellery scandal costs §Y30§! £political_power_texticon instead of §Y60§!.\nThe share of seized contraband: §G250§! £ADISCORD_economy_treasury_texticon instead of §G100§!."
 NAM_crisis_office_tt: "Incidents happen §Ghalf as often§!."
 NAM_grp_chancellery_purge_tt: "Group support:\n  Namestniks: §R-5§! £NAM_support_nam_texticon\n  Districts: §G+5§! £NAM_support_dist_texticon"
 NAM_treasury: "Treasury of Svetlogorye"
 NAM_treasury_desc: "§YSTATE TREASURY§!\nAvailable: §Y[?ADISCORD_economy_treasury|0]§! £ADISCORD_economy_treasury_texticon\n\n§YMANAGING FUNDS§!\nTreasury and political power can be exchanged for each other; rates are listed in the decisions.\n\n§YEMERGENCY FUND§!\nIncidents happen about once a year. The fund settles any of them without loss."
 NAM_bond_payments: "Bond Payments"
 NAM_bond_payments_desc: "The chancellery pays the holders of oil bonds."
 NAM_oil_bonds: "Oil Bonds"
 NAM_oil_bonds_desc: "§YDURATION§!: §Y120§! £time_texticon days\n§YCOOLDOWN§!: §Y180§! £time_texticon days after use.\n\n§YRESULT§!\nThe treasury immediately receives §G250§! £ADISCORD_economy_treasury_texticon against future oil.\n\n§YOBLIGATION§!\nBond payments: §R-0.10§! £political_power_texticon per day."
 NAM_emergency_decrees: "Emergency Decrees"
 NAM_emergency_decrees_desc: "§YCOST§!: §Y50§! £political_power_texticon\n§YCOOLDOWN§!: §Y90§! £time_texticon days after use.\n\n§YRESULT§!\nOne-off levies by chancellery decree: treasury §G+500§! £ADISCORD_economy_treasury_texticon immediately."
 NAM_buy_machine_tools: "Buy Machine Tools"
 NAM_buy_machine_tools_desc: "§YCOST§!: §Y300§! £ADISCORD_economy_treasury_texticon\n§YCOOLDOWN§!: §Y120§! £time_texticon days after use.\n\n§YRESULT§!\nMachine tools immediately provide §G1§! £construction_speed_civfactory_texticon civilian factory in South Harbour."
 NAM_fuel_audit: "Oilfield Audit"
