l_english:
 NOD_Naval_Command:0 "Nodrul Naval Command"
 NOD_Naval_Command_desc:0 "Create a permanent naval staff, train crews and develop new ship designs to protect trade routes and dependent coasts."
 NOD_Cussington_Naval_Yards:0 "Cussington Dockyards"
 NOD_Cussington_Naval_Yards_desc:0 "Build dockyards in our port to sustain shipbuilding and maritime transport."
 NOD_Sea_Lane_Escorts:0 "Sea Lane Escorts"
 NOD_Sea_Lane_Escorts_desc:0 "Commission restored destroyers and convoys to protect army supply and overseas deployments."
 NOD_Submarine_Blockade:0 "Submarine Blockade"
 NOD_Submarine_Blockade_desc:0 "Commission submarines to intercept enemy shipping while surface escorts protect our own routes."
 NOD_Landing_Staff:0 "Nodrul Marine Corps"
 NOD_Landing_Staff_desc:0 "Open a marine school and organise a marine brigade with engineers."
 NOD_Blockade_Squadron:0 "Blockade Squadron"
 NOD_Blockade_Squadron_desc:0 "Restore heavy cruisers to control sea zones and support operations against enemy ports alongside our escorts."
 ADISCORD_tech_nodrul_marine_corps:0 "Nodrul Marine Corps"
 ADISCORD_tech_nodrul_marine_corps_desc:0 "Training marine battalions to capture ports and hold coastal bridgeheads."
