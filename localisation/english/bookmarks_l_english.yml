l_english:
 GATHERING_STORM_NAME: "The Wounded Lion"
 GATHERING_STORM_DESC: "The Vorkerland Empire was long regarded as the continent's dominant power, but its time has passed. Vorkerland burns amid internal conflicts, collapsed institutions and old debts that no one can hide any longer.\n\nNew states are rising from the ruins of the old order, each with its own fears, resources and political ambitions. The continent is entering an age in which old borders no longer guarantee a future, and power will belong to those who can turn chaos into a functioning system."
 OTHER_GATHERING_STORM_DESC: "New centres of power are emerging across the continent. Some struggle to survive among the ruins of the empire; others are already preparing their own advance."
 BLITZKRIEG_NAME: "After the Blow"
 BLITZKRIEG_DESC: "By 2183, the first upheavals had ceased to be news and become the order of the day. The states that survived the collapse of the old system have secured their borders, reassessed their allies and grown accustomed to the thought that the next war may begin without warning."
 HITTING_FAN_DESC: "Yes, that is right. Your umbrella collection may come in handy today."
 STP_BOOKMARK_DESC: "Although Stelander escaped conquest during Vorkerland's supposedly great expansion, its burned villages still remember the bombardments and the blood spilled on once peaceful soil.\n\nThe country is ruled by the hedonist Chamber of High Houses party. In public, it advocates minimal state interference in the economy and citizens' private lives. In practice, its principal ambitions are wealth and power, and so far it has secured both.\n\nThe party leader, who once promised that no more blood would be spilled on Stelander's soil, is now serving his fourth consecutive term. His party knows that the old man on whom the system depends has little time left. So does the resistance led by Maksim Shabrat."
 VAL_BOOKMARK_DESC: "Kefreyt grew around arms factories, clearing houses and mercenary companies. Valera Solgalov binds his captains not by inherited loyalty but by a common register of contracts, rates and access to production: the state promises no affection, only the enforcement of obligations.\n\nBehind the efficiency of the arsenals stands a country that manufactures rifles more reliably than bread. Poisoned soil, emptying villages and a chronic shortage of raw materials make foreign markets a matter of survival. Army depots feed settlements, while weapons exports pay for food, medicine and metal.\n\nDefeat in the General Council's border war of 2145 taught Kefreyt to calculate the price of victory. Solgalov now prefers to secure the contract, customer and supply line before using force. Vorkerland's collapse removes the country's largest buyer, but the crisis in Stelander opens a new market for influence: trade agreements, resource concessions and armed pressure can turn a neighbour's disorder into Kefreyt's system of obligations."
 VAL_bookmark_the_weaponry_baron: "The Arms Baron"
 VAL_bookmark_the_weaponry_baron_desc: "Valera Solgalov holds the country together through a chain of factories, brokers and captains. His authority is measured by whether the assembly lines keep moving, the companies are paid and the state register can turn private force into one system of obligations."
 VAL_bookmark_different_views_on_freedom: "Different Views on Freedom"
 VAL_bookmark_different_views_on_freedom_desc: "For Kefreyt's neighbours, freedom means the right to refuse another power. In Kefreyt it too often begins with the right to sign a contract — and ends with the obligation to fulfil it even when somebody else pays the price."
 VAL_bookmark_contracts_outlive_kings: "Contracts Outlive Kings"
 VAL_bookmark_contracts_outlive_kings_desc: "Leaders grow old, parties fracture and borders move. Solgalov wants to leave behind more than a personal clientele: a system of agreements binding the state, arsenals and army more tightly than any oath."

