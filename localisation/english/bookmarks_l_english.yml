 VAL_bookmark_route_solgalov_tt: "§YSolgalov's Contracts§!\n§LEvery war has a bill of lading.§!\n\nSolgalov knows his wagons in the dark.\nYesterday they went out loaded with steel.\nToday they carry the keys to the frontier\ndepots.\n\n\n\n\n£GFX_VAL_bookmark_route_solgalov_banner\n \n \n \n \n \n \n "
 VAL_bookmark_route_captains_tt: "§YKrutov's Council of Commanders§!\n§LThe baron is calling for the third time.§!\n\nKrutov lays his old contract on the table, then\nsets his company badge on top. One by one\nthe captains pull off their gloves. The telephone\nat his elbow keeps ringing.\n\n\n\n\n£GFX_VAL_bookmark_route_captains_banner\n \n \n \n \n \n \n "
 VAL_bookmark_route_settlement_tt: "§YKefreyt After the War§!\n§LThe last checkpoint still has its keys.§!\n\nA captain, a civil servant and a delegate from\nthe arms works wait at the bridge. Each carries\na different order naming the road's new owner.\n\n\n\n\n£GFX_VAL_bookmark_route_settlement_banner\n \n \n \n \n \n \n "
 NAM_bookmark_route_governors_tt: "§YThe Governors' Ladder§!\n§LOnly one copy reaches the top floor.§!\n\nThe field has run out of fuel for its pumps. The\nmessenger has passed three waiting rooms.\nBehind the last door, Egor Rom studies his\nsignature.\n\n\n\n\n£GFX_NAM_bookmark_route_governors_banner\n \n \n \n \n \n \n "
 NAM_bookmark_route_districts_tt: "§YThe District Charter§!\n§LHere, every well is named for the driller who\nsank it.§!\n\nThey brought the charter out to the field. The\nmechanic wiped her hand on her coat and still\nleft a black mark on the paper. The others\nsigned beside it.\n\n\n\n\n£GFX_NAM_bookmark_route_districts_banner\n \n \n \n \n \n \n "
 NAM_bookmark_route_contracts_tt: "§YThe Republic of Contracts§!\n§LThe valve opens from both sides.§!\n\nDelegates from two districts meet by an oil\ntank. One cooperative owns the tank cars, the\nother the line to the port. They sign on the\nbonnet of a lorry. The capital's seal is no longer\nrequired.\n\n\n\n\n£GFX_NAM_bookmark_route_contracts_banner\n \n \n \n \n \n \n "
 NAM_bookmark_route_exile_tt: "§YGovernment in Exile§!\n§LSame call sign. A different shore.§!\n\nOn the island pier the chancellery fits on a\npacking case and a folding chair. The\noperator tries the oilfields' frequency once\nmore. This time someone answers.\n\n\n\n\n£GFX_NAM_bookmark_route_exile_banner\n \n \n \n \n \n \n "
 SHL_bookmark_route_ten_tt: "§YThe Conclave of Ten§!\n§LThe tenth seal is still hot.§!\n\nThere is an extra chair in the hall of nine\nhouses. The founder carries its new crest in his\nwork gloves. Nobody asks him to take them\noff.\n\n\n\n\n£GFX_SHL_bookmark_route_ten_banner\n \n \n \n \n \n \n "
 SHL_bookmark_route_cities_tt: "§YThe Southern Compact§!\n§LEach bank holds a key to the crossing.§!\n\nMehran Arbin watches the chain drop at the\nlanding. The far bank lowers its chain in\nanswer. The compact bears the seals of cities\non both sides of the river.\n\n\n\n\n£GFX_SHL_bookmark_route_cities_banner\n \n \n \n \n \n \n "
 SHL_bookmark_route_nur_tt: "§YThe Furnace Directorate§!\n§LOne hand lights the first furnace.§!\n\nJalil Nur can hear the works start up from his\ncontrol booth. By the telephone a clerk holds a\nlist of towns. Each is expected to acknowledge\nthe order.\n\n\n\n\n£GFX_SHL_bookmark_route_nur_banner\n \n \n \n \n \n \n "
 SHL_bookmark_route_regency_tt: "§YThe Council of Crests§!\n§LThe old chair is back beneath the canopy.§!\n\nThe regent's great seal glints at Darius Safir's\nbelt. The houses take note of who helped him\nfasten it and who had to wait outside.\n\n\n\n\n£GFX_SHL_bookmark_route_regency_banner\n \n \n \n \n \n \n "
 SHL_bookmark_route_commune_tt: "§YThe Commune of Fire§!\n§OToday the whistle sounded from the shop floor.§!\n\nThe night forewoman turns the key. Behind her,\nfitters and founders wait for the gates to swing\napart. Salim Darzi has come with them. For the\nfirst time the shift opens the furnaces itself.\n\n\n\n\n£GFX_SHL_bookmark_route_commune_banner\n \n \n \n \n \n \n "
 RUS_bookmark_route_khan_tt: "§YThe Last Empire§!\n§R\"Humanity has one road left to freedom.\nI will topple the emperors one by one.\nMine will be the last empire.\"§!\n§g- Mark Rustan§!\n\nThe steppe riders swear their oaths to the Khan.\nIn the bunker, Korneev asks how anyone will\nknow when the wars are over. Rustan closes\nthe file marked \"Last Sunset\".\n\"A bell will ring.\"\n\n\n\n\n£GFX_RUS_bookmark_route_khan_banner\n \n \n \n \n \n \n "
 RUS_bookmark_route_scientists_tt: "§YKorneev's Scientific Council§!\n§LAn engineer's handwriting is on the bunker\norders.§!\n\nGleb Korneev lays his hand on the control\nwheel. Behind the glass the instruments come\nalive. For the first time, the officer at the door\nwaits for the man in the lab coat.\n\n\n\n\n£GFX_RUS_bookmark_route_scientists_banner\n \n \n \n \n \n \n "
 RUS_bookmark_route_guard_tt: "§YThe Black Banner Empire§!\n§RThe Black Army has sworn its oath. The Khan\nwas not invited.§!\n\nTagir Mansurov steps out onto the concrete\nramp. Beyond it, a column of headlights burns\nin the steppe. At the turn for Vorkerland, a\nblack standard unfurls above the lead vehicle.\n\n\n\n\n£GFX_RUS_bookmark_route_guard_banner\n \n \n \n \n \n \n "
 IVN_bookmark_route_committee_tt: "§YThe Emergency Committee§!\n§LThe line to the capital is back. The voice is\nunfamiliar.§!\n\nThe operator patches the last line through to\nthe committee. Kulivanov asks for the marches.\nThe answer takes a little longer than usual.\n\n\n\n\n£GFX_IVN_bookmark_route_committee_banner\n \n \n \n \n \n \n "
 IVN_bookmark_route_legion_tt: "§YThe Eternal Imperium§!\n§RThe Black Sun has risen over Itora.§!\n\nYesterday the legion carried its standard down\na forest track. Today the banners of every\nmarch dip before it in the square. Leonid Stalk\ntakes the first salute of a united Itora.\n\n\n\n\n£GFX_IVN_bookmark_route_legion_banner\n \n \n \n \n \n \n "
 IVN_bookmark_route_directorate_tt: "§YThe Military Directorate of the Marches§!\n§LThe fort opens its gates by its own clock.§!\n\nRostislav Karn greets the morning in the\nguardhouse. The magistrate's chair has been\npushed to the wall. The duty officer's map\ncase has taken its place.\n\n\n\n\n£GFX_IVN_bookmark_route_directorate_banner\n \n \n \n \n \n \n "
 IVN_bookmark_route_communes_tt: "§YThe Union of Free Communes§!\n§LThe town hall key will stay in town.§!\n\nEvery bench in the village school is taken. The\nneighbouring communes have laid their seals\non the windowsill. A woman straight off shift\nhas the floor.\n\n\n\n\n£GFX_IVN_bookmark_route_communes_banner\n \n \n \n \n \n \n "
 IVN_bookmark_route_marches_tt: "§YThe Council of Autonomous Marches§!\n§LBeyond the pass, one beacon answers\nanother.§!\n\nThe surveyor looks through his glass. Signal\ntowers emerge from the mist in neighbouring\nvalleys. Each march lights its own lamp.\n\n\n\n\n£GFX_IVN_bookmark_route_marches_banner\n \n \n \n \n \n \n "
 WRK_bookmark_route_worker_tt: "§YWorcker's Return§!\n§LAt last a light comes on in the rear carriage.§!\n\nOn the western platform someone opens the\ncase with the old standard. Worcker can see it\nfrom his window. For the first time in months,\npeople say the country's full name aloud.\n\n\n\n\n£GFX_WRK_bookmark_route_worker_banner\n \n \n \n \n \n \n "
 WRK_bookmark_route_staff_tt: "§YPetrishchev's Military District§!\n§LThe commander threw the points to the capital\nhimself.§!\n\nVlad Petrishchev folds the dispatch into his\ninside pocket. The signalman is waiting for\npermission to show a green light.\n\n\n\n\n£GFX_WRK_bookmark_route_staff_banner\n \n \n \n \n \n \n "
 WRK_bookmark_route_technicians_tt: "§YDoctor Worx's Technocracy§!\n§LThe cabinet line is disconnected while the\nexperiment runs.§!\n\nSomeone breathes beneath the lamp. A line\ntrembles on the chart. Doctor Worx sees it first,\nfrom his place beside the bed. The cabinet will\nwait until morning for his decision.\n\n\n\n\n£GFX_WRK_bookmark_route_technicians_banner\n \n \n \n \n \n \n "
 WRK_bookmark_route_joint_tt: "§YThe Joint Government§!\n§LTwo telephones ring at the exchange.§!\n\nOne line runs to Petrishchev's staff, the other to\nWorcker's cabinet. The operator enters their first\njoint order in a single logbook.\n\n\n\n\n£GFX_WRK_bookmark_route_joint_banner\n \n \n \n \n \n \n "
 WRK_bookmark_route_bagley_tt: "§YAnton Bagley's Executive Committee§!\n§LThe assembly will meet on the shop floor.§!\n\nThey stop the flywheel at the press. As its last\nturn dies away, even the workers at the far\ngate can hear Anton Bagley call the roll.\n\n\n\n\n£GFX_WRK_bookmark_route_bagley_banner\n \n \n \n \n \n \n "
 VAL_bookmark_route_korsch_tt: "§YEduard Korsch's Revenge§!\n§LThe veterans arrive one at a time. The gate is\nopen.§!\n\nAn old regimental ribbon hangs from the\nfactory fence. Korsch stops beside it. On the\nother side, somebody lights a second lantern.\n\n\n\n\n£GFX_VAL_bookmark_route_korsch_banner\n \n \n \n \n \n \n "
 ADISCORD_BOOKMARK_IN_DEVELOPMENT_TT: "This country's full campaign is in development. The small flags and emblems show its known political paths."
 ADISCORD_BOOKMARK_IN_DEVELOPMENT: "In development"
 OTHER_GATHERING_STORM_DESC: "Far from Unity Tower, people keep time in other ways. In Kadir a caravan guide answers for the stretch of road from one well to the next. In Rakhma neighbours decide together how to share the water in a drought. A skipper from Veyr needs to know whether the next harbour will honour the insurance on his cargo.\n\nThese countries have their place on the map of Forul. Each will have its own reason to heed the news from Vorkerland."
 HITTING_FAN_DESC: "Yes, that is right. Your umbrella collection may come in handy today."
 VAL_BOOKMARK_DESC: "An arms worker's family in Kefreyt knows which day the flour train is due. The soil around many of the factories is poisoned. Even where grain still grows, there is little of it. Crates of weapons go out by rail and grain, metal and medicine come back. When a customer is late paying, the factory shop feels it before the papers carry the news.\n\nIn 2145 the General Council tried to seize Stelander's farmland and raw materials by force. It was Valera Solgalov who led the troops out of encirclement. The captains who made it home remembered who had brought them back. The generals made the popular commander head of state, expecting to direct him. By 2160 portraits are all that remains of their council, and the seal on the pay warrants is Solgalov's.\n\nNow a single register binds the captains and the arsenals. The companies are waiting for their wages and the exchange is waiting for the next order from Vorkerland, the country's largest customer. At the Stelander pass men are already pricing escorts, haulage and rights of passage. On both sides of the border there are families for whom the last conversation about that road ended with a death notice."
 VAL_bookmark_the_weaponry_baron: "The Arms Baron"
 VAL_bookmark_the_weaponry_baron_desc: "Valera Solgalov holds the country together through a chain of factories, brokers and captains. His authority is measured by whether the assembly lines keep moving, the companies are paid and the state register can turn private force into one system of obligations."
 VAL_bookmark_different_views_on_freedom: "Different Views on Freedom"
 VAL_bookmark_different_views_on_freedom_desc: "For Kefreyt's neighbours, freedom means the right to refuse another power. In Kefreyt it too often begins with the right to sign a contract - and ends with the obligation to fulfil it even when somebody else pays the price."
 VAL_bookmark_contracts_outlive_kings: "Contracts Outlive Kings"
 VAL_bookmark_contracts_outlive_kings_desc: "Leaders grow old, parties fracture and borders move. Solgalov wants to leave behind more than a personal clientele: a system of agreements binding the state, arsenals and army more tightly than any oath."

 BM_HISTORY_TITLE: "Brief History"
 HITTING_FAN_NAME: "And So It Begins"
 NAM_BOOKMARK_DESC: "Egor Rom, a driller's son from Klyuchevsk, was seventeen when he began copying oil waybills. His father lost an arm in the field. The ruling on compensation took four years. Rom remembered how many desks a family petition could cross and what it meant to hold the pen at the last one.\n\nHe served as a clerk at the Veyran court, lived through the First Revolution and became governor of Svetlogorye. Now the paperwork for the entire oil basin comes to him. Vorkerland counts the fields as its western foothold. Eflor and Azhar remember whose land was taken. For the crews who keep the pumps working, the border starts at the plant gate.\n\nAs long as orders arrive from the capital, the chain of governors holds. In the districts people are already arguing about who should run the fields if contact breaks down. Yaroslav Weber's supporters are organising in the Svetlogorsk District. To the south the houses of Shahrabad keep an eye on the tank cars. Everyone has a reason to want their own signature on the next waybill."
 SHL_BOOKMARK_DESC: "At a shift change in Shahrabad, the outgoing crew stays at the furnace until the next crew takes charge of the fire. Under the Law of Continuous Fire a house keeps its main furnace and its vote in the Conclave as long as the fire burns. If the brickwork goes cold, the furnace passes to the city. Nine hereditary houses depend on the hands of craftsmen whose quarters do not even appear on the city register.\n\nJalil Nur of the minor house of Nur presides over the Conclave. The houses' petitions for raw materials lie before him. At the door wait shift delegates with their records of wear in the brickwork. They can bring the furnaces to a halt and leave the workshops intact. The houses have guards of their own. For a long time Nur has managed to bring both sides to the same table.\n\nIn Devyatipechye the craftsmen and engineers have set out to build a tenth furnace. The old law names no heir to it. The houses, the cities and the workers' quarters each have someone in mind to own the first melt. Water suppliers in Keyzan, carriers in Veyr and oil workers in Svetlogorye are following the dispute. The southern deserts will have to live with whoever gains the right to dispose of Shahrabad's fire."
 RUS_BOOKMARK_DESC: "In Khan's Land every aimak knows who will stand watch at the ford and who can lend horses if strangers appear across the river. Local disputes are settled close to home. The armed communities have entrusted Mark Rustan to speak for them. Persuading them to honour an order from the capital once the riders have gone home is another matter.\n\nA bunker is taking shape beneath the capital. The engineer Gleb Korneev has people who can bring a dead power line back into service. Tagir Mansurov, commander of the guard, has the Black Army troops who must hold the road while the crews work above ground. Both need supplies and the trust of the aimaks. Behind one door there are workshop shifts to arrange. Behind another the names of the dead are being read, along with the names of those held responsible.\n\nRustan lost family when the reactor was destroyed, and then his brother in the revolution. To him the road to the old industrial belt leads back to the events that started it all. The scientists, the guard and the Khan himself are willing to take that road together. Each has a different country in mind for the day the bunker gates open."
 IVN_BOOKMARK_DESC: "In Itora's border marches a teacher, a doctor and a signals operator may well have shared a school bench. The districts run their own schools and hospitals. These local obligations shaped the idea of a republic that brought Vadim Kulivanov and his Roar of Freedom party to power. A family living right on the border has as much claim to help as anyone in the capital.\n\nThe marches also provide for their own defence. Someone who runs a storehouse by day may be called to his reserve unit that night. Along the western roads local councils are counting the families their shelters can take. Officers want to know whether the same roads will carry troop transports. What the republic does with those roads in a crisis will tell its neighbours how far they can trust its promise of protection."
 MON_BOOKMARK_DESC: "Marius II Arken ended the War of the Five Banners and declared Montera heir to the northern crowns. The defeated dynasties kept their titles. At court it is still possible to see all fifteen crowns and hear the houses dispute their order of precedence. The question of who receives their oath of allegiance has been settled.\n\nRails link the southern arsenals. To a general staff officer a railway means a date on which a regiment will arrive. To the foreman it means another military order that pushes civilian work down the list. The imperial hierarchy determines whose sons enjoy full rights and whose must prove their loyalty by serving. Rina still has its own court and its own army. The records in the capital say the palatinate is bound to the empire by oath. In the barracks they have a better idea whose order a soldier of Rina will hear first."
 WRK_BOOKMARK_DESC: "At Unity Tower reports come in from the colonies, the autonomous republics and the military districts. On Nikita Worcker's map they still belong to one confederation. In the supply ledgers each territory has its own stores. In the barracks each has its own commander. An order from the centre has to be agreed with people who have the means to insist on their own terms.\n\nThe First Revolution ended the Veyran monarchy. Alongside a promise of freedom the new government inherited the old garrisons and the distant possessions. The republic adopted a constitution. Its last election was held in 2135. A whole generation has grown up accustomed to one man giving the final word in a dispute between the capital and a district.\n\nOn the first morning of 2160 the signal operators are still on duty in the Tower. As long as they keep the offices connected, Worcker's agreements hold from the western oilfields to the army depots. The districts have yet to agree on whom they would obey if one day the Tower fell silent."
 COUNTRY_SELECTION_CHARACTER_DESC_NAME: "$NAME|Y$"
 NAM_bookmark_hold_the_basin: "Hold the Basin"
 NAM_bookmark_hold_the_basin_desc: "Eflor and Azhar call the war a return of their land. Svetlogorye must hold the Northern Deposits or vanish from the map."
 NAM_bookmark_ladder_or_charter: "Ladder or Charter"
 NAM_bookmark_ladder_or_charter_desc: "The namestnik ladder or the district charter - the choice decides both the country's order and the way it gathers the south."
 NAM_bookmark_seal_over_furnaces: "Subjugate Shahrabad"
 NAM_bookmark_seal_over_furnaces_desc: "The oil belt and Shahrabad's furnaces cannot coexist. Only one of them will win the War for the South."
 SHL_bookmark_continuous_fire: "Continuous Fire"
 SHL_bookmark_continuous_fire_desc: "At the doors of the Conclave, nine houses present their seals. Each house owes its seat to the people who kept its furnace alight through the night."
 SHL_bookmark_five_courses: "Five Courses of the Conclave"
 SHL_bookmark_five_courses_desc: "Houses, cities and shift delegates argue beneath the Conclave's vaults. Each sees a different future for Shakhrabad and the surrounding deserts."
 SHL_bookmark_war_for_the_south: "War for the South"
 SHL_bookmark_war_for_the_south_desc: "Keyzan, Veyr and Mazar are only the beginning. The last war will decide whether the deserts belong to the furnaces or to the oil belt."
 RUS_bookmark_underground_capital: "Underground Capital"
 RUS_bookmark_underground_capital_desc: "The bunker beneath the capital grows layer by layer. It may become a shelter for the people or a sealed throne for their rulers."
 RUS_bookmark_last_empire: "The Last Empire"
 RUS_bookmark_last_empire_desc: "Rustan's name is already cut into the imperial seal. Below, behind an armoured door, Korneev gathers the scientists. At the bunker gates the sentries take their orders from Mansurov. Whoever reaches the radio room first will read the proclamation."
 RUS_bookmark_heart_of_the_continent: "Heart of the Continent"
 RUS_bookmark_heart_of_the_continent_desc: "The centre of the continent will belong to the Khan's state - or to no one. Holding it means breaking the hegemon."
 RUS_bookmark_operation_last_sunset: "Operation Last Sunset"
 RUS_bookmark_operation_last_sunset_desc: "The Khan aims an orbital weapon at the reactor in the heart of the continent. Neighbouring powers prepare to invade while the Black Army holds the perimeter and the scientists finish their calculations. If the order to strike is carried out, the war will end along with the world it was fought over."
