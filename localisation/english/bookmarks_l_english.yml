l_english:
 GATHERING_STORM_NAME: "The Wounded Lion"
 GATHERING_STORM_DESC: "The Vorkerland Empire was long regarded as the continent's dominant power, but its time has passed. Vorkerland burns amid internal conflicts, collapsed institutions and old debts that no one can hide any longer.\n\nNew states are rising from the ruins of the old order, each with its own fears, resources and political ambitions. The continent is entering an age in which old borders no longer guarantee a future, and power will belong to those who can turn chaos into a functioning system."
 OTHER_GATHERING_STORM_DESC: "New centres of power are emerging across the continent. Some struggle to survive among the ruins of the empire; others are already preparing their own advance."
 BLITZKRIEG_NAME: "After the Blow"
 BLITZKRIEG_DESC: "By 2183, the first upheavals had ceased to be news and become the order of the day. The states that survived the collapse of the old system have secured their borders, reassessed their allies and grown accustomed to the thought that the next war may begin without warning."
 HITTING_FAN_DESC: "Yes, that is right. Your umbrella collection may come in handy today."
 STP_BOOKMARK_DESC: "Although Stelander escaped conquest during Vorkerland's supposedly great expansion, its burned villages still remember the bombardments and the blood spilled on once peaceful soil.\n\nThe country is ruled by the hedonist Chamber of High Houses party. In public, it advocates minimal state interference in the economy and citizens' private lives. In practice, its principal ambitions are wealth and power, and so far it has secured both.\n\nThe party leader, who once promised that no more blood would be spilled on Stelander's soil, is now serving his fourth consecutive term. His party knows that the old man on whom the system depends has little time left. So does the resistance led by Maksim Shabrat."
 VAL_BOOKMARK_DESC: "Kefreyt grew around arms factories, clearing houses and mercenary companies. Valera Solgalov binds his captains not by inherited loyalty but by a common register of contracts, rates and access to production: the state promises no affection, only the enforcement of obligations.\n\nBehind the efficiency of the arsenals stands a country that manufactures rifles more reliably than bread. Poisoned soil, emptying villages and a chronic shortage of raw materials make foreign markets a matter of survival. Army depots feed settlements, while weapons exports pay for food, medicine and metal.\n\nDefeat in the General Council's border war of 2145 taught Kefreyt to calculate the price of victory. Solgalov now prefers to secure the contract, customer and supply line before using force. Vorkerland's collapse removes the country's largest buyer, but the crisis in Stelander opens a new market for influence: trade agreements, resource concessions and armed pressure can turn a neighbour's disorder into Kefreyt's system of obligations."
 VAL_bookmark_the_weaponry_baron: "The Arms Baron"
 VAL_bookmark_the_weaponry_baron_desc: "Valera Solgalov holds the country together through a chain of factories, brokers and captains. His authority is measured by whether the assembly lines keep moving, the companies are paid and the state register can turn private force into one system of obligations."
 VAL_bookmark_different_views_on_freedom: "Different Views on Freedom"
 VAL_bookmark_different_views_on_freedom_desc: "For Kefreyt's neighbours, freedom means the right to refuse another power. In Kefreyt it too often begins with the right to sign a contract - and ends with the obligation to fulfil it even when somebody else pays the price."
 VAL_bookmark_contracts_outlive_kings: "Contracts Outlive Kings"
 VAL_bookmark_contracts_outlive_kings_desc: "Leaders grow old, parties fracture and borders move. Solgalov wants to leave behind more than a personal clientele: a system of agreements binding the state, arsenals and army more tightly than any oath."

 BM_HISTORY_TITLE: "Brief History"
 HITTING_FAN_NAME: "And So It Begins"
 ADISCORD_BOOKMARK_WIP: "§YWIP§!"
 NAM_BOOKMARK_DESC: "Svetlogorye is a Vorkerland autonomy built as a ladder of namestniks: every rung has a seal, a report and the right to halt the decision below it. Egor Rom holds this ladder together for the sake of an oil basin the empire once took from its neighbours.\n\nWhen Vorkerland falls, Eflor and Azhar will declare war to reclaim the land, and Yaroslav Veter's underground may rise in the Svetlogorsk District. A Svetlogorye that survives must choose between the namestnik ladder and an oil charter of the districts.\n\nEither path leads south. The namestniks demand submission from Azhar, Kadir and Eflor; the charter buys allies with fuel. Sooner or later the oil belt will collide with Shahrabad's furnaces, and only one of them will hold the south."
 SHL_BOOKMARK_DESC: "Shahrabad is ruled by the Conclave of Nine Furnaces. The Law of Continuous Fire ties each house's hereditary vote to the work of its main furnace, while Jalil Nur keeps their rivalry from stopping production.\n\nOvertime shifts provoke cold strikes in the workers' quarters, reforms provoke the crests' ultimatum. Keyzan blocks the qanats, Veyr taxes the metal, and Mazar counts Shahrabad's metal as part of its ration. The tenth furnace will force the Conclave to choose a course: a new house, open cities or Nur's directorate, while crises may lead to Darius Safir's regency or the Commune of Fire.\n\nEach course gathers the deserts in its own way - through debt, charters, an iron march, crests or councils. The last War for the South will decide whether the deserts belong to the furnaces or to Svetlogorye's oil belt."
 RUS_BOOKMARK_DESC: "Khan's Land rests on armed aimaks that tolerate a common representative more easily than a permanent capital. Mark Rustan gathers them into the Black Army while a bunker grows beneath the capital: a shelter, a command post and a promise to survive the next catastrophe.\n\nThe underground complex demands food, money and difficult decisions, and above ground the balance between the aimaks and the headquarters decides whom the army obeys. The Khan, General Oskol or the restorer Niva will proclaim a common state - the Last Empire, the Empire of the Black Banner or the Power of Restoration.\n\nThe heart of the continent will not be shared. Either the Khan's state unites the centre and breaks the hegemon, or the centre remains a land without a single power."
 COUNTRY_SELECTION_CHARACTER_DESC_NAME: "$NAME|Y$"
 NAM_bookmark_hold_the_basin: "Hold the Basin"
 NAM_bookmark_hold_the_basin_desc: "Eflor and Azhar call the war a return of their land. Svetlogorye must hold the Northern Deposits or vanish from the map."
 NAM_bookmark_ladder_or_charter: "Ladder or Charter"
 NAM_bookmark_ladder_or_charter_desc: "The namestnik ladder gives strength and speed, the district charter consent and allies. The choice decides both the country's order and the way it gathers the south."
 NAM_bookmark_seal_over_furnaces: "A Seal over the Furnaces"
 NAM_bookmark_seal_over_furnaces_desc: "The oil belt and Shahrabad's furnaces cannot coexist. Only one of them will win the War for the South."
 SHL_bookmark_continuous_fire: "Continuous Fire"
 SHL_bookmark_continuous_fire_desc: "The nine furnaces must keep working: the treasury and the houses' votes in the Conclave depend on raw material, repairs and shifts."
 SHL_bookmark_five_courses: "Five Courses of the Conclave"
 SHL_bookmark_five_courses_desc: "A tenth house, open cities, Nur's directorate, a regency of crests or the Commune of Fire. Each course runs the furnaces and gathers the deserts in its own way."
 SHL_bookmark_war_for_the_south: "War for the South"
 SHL_bookmark_war_for_the_south_desc: "Keyzan, Veyr and Mazar are only the beginning. The last war will decide whether the deserts belong to the furnaces or to the oil belt."
 RUS_bookmark_underground_capital: "Underground Capital"
 RUS_bookmark_underground_capital_desc: "The bunker beneath the capital grows layer by layer. It may become a shelter for the people or a sealed throne for their rulers."
 RUS_bookmark_last_empire: "The Last Empire"
 RUS_bookmark_last_empire_desc: "The Khan, Oskol or Niva will proclaim a common state. The course decides its name, army and order, but not the price of unification."
 RUS_bookmark_heart_of_the_continent: "Heart of the Continent"
 RUS_bookmark_heart_of_the_continent_desc: "The centre of the continent will belong to the Khan's state - or to no one. Holding it means breaking the hegemon."
