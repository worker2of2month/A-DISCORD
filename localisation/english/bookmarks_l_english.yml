l_english:
 GATHERING_STORM_NAME: "The Wounded Lion"
 GATHERING_STORM_DESC: "In 2130 someone in a reactor-belt shelter kept a tally of the people who had made it down, the water left in store and the days until the filters needed changing. Higher up the same page was the time a work crew had gone on shift. Then contact with the surface broke off. The reactor's destruction turned years of unrest in the cities of the Veyran Empire into open revolt.\n\nThe First Revolution brought down the monarchy. Nikita Worcker gave the country the name Vorkerland. Portraits of the imperial family came down in the palace offices. The clerks who knew how to get a train through three districts were back at their desks the next morning. Along with the archives, the republic inherited the garrisons, the distant oilfields and the debts owed to its neighbours.\n\nBy 2160, Unity Tower still transmits Worcker's orders. At a railway station the ministry in the capital and the district command can both requisition the same wagon of grain. Both have an official seal and an armed escort. The stationmaster must decide who gets the bread and whose signature will answer for it afterwards.\n\nBeyond the confederation people listen closely to these disputes. Vorkerland guaranteed the peace in Stelander. Its orders feed the factory towns of Kefreyt, and oil leaves Svetlogorye in its name. On the morning of 1 January 2160 all those agreements are still in force. Across Forul people are reading their copies again."
 ADISCORD_BOOKMARK_MENU_ENTRY: "$GATHERING_STORM_NAME$"
 ADISCORD_BOOKMARK_CHRONICLE: "Chronicle of Forul"
 ADISCORD_BOOKMARK_COUNTRIES: "Nations of Forul"
 ADISCORD_BOOKMARK_TO_MAP: "Continue to map"
 ADISCORD_BOOKMARK_ATLAS_HINT: "Other countries"
 ADISCORD_BOOKMARK_SPIRITS: "National spirits"
