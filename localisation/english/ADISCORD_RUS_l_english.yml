 RUS_bunker_strip_1:0 "Level 1: Refitting"
 RUS_bunker_strip_1_desc:0 "Dismantle the existing room and free its power capacity. Depth and structural integrity are preserved; the installation cost is not refunded. After dismantling, any specialization for this level may be purchased again."
 RUS_bunker_strip_2:0 "Level 2: Refitting"
 RUS_bunker_strip_2_desc:0 "Dismantle the existing room and free its power capacity. Depth and structural integrity are preserved; the installation cost is not refunded. After dismantling, any specialization for this level may be purchased again."
 RUS_bunker_strip_3:0 "Level 3: Refitting"
 RUS_bunker_strip_3_desc:0 "Dismantle the existing room and free its power capacity. Depth and structural integrity are preserved; the installation cost is not refunded. After dismantling, any specialization for this level may be purchased again."
 RUS_bunker_strip_4:0 "Level 4: Refitting"
 RUS_bunker_strip_4_desc:0 "Dismantle the existing room and free its power capacity. Depth and structural integrity are preserved; the installation cost is not refunded. After dismantling, any specialization for this level may be purchased again."
 RUS_bunker_strip_5:0 "Level 5: Refitting"
 RUS_bunker_strip_5_desc:0 "Dismantle the existing room and free its power capacity. Depth and structural integrity are preserved; the installation cost is not refunded. After dismantling, any specialization for this level may be purchased again."
 RUS_khan_governing_tt:0 "The country is led by Mark Rustan; it is independent and has not capitulated."
 RUS_bunker_operational_tt:0 "Mark Rustan governs an independent country that has not capitulated, and owns and fully controls the region of [66.GetName]."
 RUS_bunker_slot_free_tt:0 "The construction crew is available: there is no other paid underground order."
 RUS_bunker_contract_tt:0 "Payment is held in reserve when work begins; nothing is charged again on completion. Only one order can be carried out at a time. Loss of ownership or control of the region of [66.GetName], subjugation, capitulation or the fall of the legitimate government cancels the order and refunds the payment in full. The completed layout is preserved during a temporary loss, but its effects are inactive. A lawful transition from the Khan to Oskol or Niva preserves both construction and payment."
 RUS_bunker_refunded_tt:0 "The unfinished underground order has been canceled. All reserved payment is refunded exactly once."
 RUS_bunker_strip_tt:0 "The room is dismantled without a refund. Its upgrade is also lost. Power capacity is freed; depth and structural integrity remain unchanged."
 RUS_bunker_complex:0 "Bunker System"
 RUS_bunker_complex_desc:0 "The underground capital begins with a blueprint and the first excavation. Behind the airtight doors, there must be homes, workshops, hospitals, supplies and headquarters: an entire city capable of surviving the destruction of the surface. Every equipped level brings that promise closer, taking up space and demanding power, food and labor.\n\nThe bunker system grows with its completed rooms and their upgrades. Its purpose will be determined by those in charge: a refuge for residents, a bastion for the army or a sealed center of power. Operational rooms grant the country their benefits while the complex is held and functioning; damaged vaults and empty stores turn life underground into an ordeal."
 RUS_bunker_online:0 "§GComplex operational§!"
 RUS_bunker_offline:0 "§RComplex unavailable§!"
 RUS_bunker_safe:0 "§GVaults stable§!"
 RUS_bunker_danger:0 "§RVaults at risk of collapse§!"
 RUS_bunker_idle:0 "§Gavailable§!"
 RUS_bunker_busy:0 "§Ybusy§!"
 RUS_bunker_empty:0 "Empty Gallery"
 RUS_bunker_rock:0 "Unsurveyed Rock"
 RUS_bunker_depth_3_tt:0 "Allows excavation down to the third level. Excavating and equipping each level must be paid for separately."
 RUS_bunker_depth_5_tt:0 "Allows excavation down to the fifth level. Excavating and equipping each level must be paid for separately."
 RUS_bunker_five_tt:0 "Five levels are equipped; structural integrity is at least 60; no work remains unfinished."
 RUS_bunker_three_tt:0 "At least three levels are equipped; structural integrity is at least 40."
 RUS_bunker_construction:0 "Underground Capital - Five Levels"
 RUS_bunker_construction_desc:0 "Construction is available from the first day. Select a level image to equip or upgrade it. Hover over it to see prices, durations and requirements."
 RUS_count_the_hearths:0 "Count the Hearths"
 RUS_count_the_hearths_desc:0 "Rustan knows the names of the chieftains, but not the number of households they call their own. Census takers will travel to the aimaqs with blank books and orders to count people, not promises."
 RUS_council_mandate:0 "Council of the Aimaqs"
 RUS_council_mandate_desc:0 "The elders bring lists of their communities' needs and promises to the capital. Every council decision passes through lengthy debate, but each delegate must answer for it to their own people on returning home. The consent of the aimaqs strengthens authority and domestic peace; the general military muster takes longer than headquarters would like."
 RUS_aimaq_council:0 "Places Around the Common Fire"
 RUS_aimaq_council_desc:0 "The chieftains will gain the right to debate in a single hall. In return for their recognized powers, they must answer for supplies, justice and the names of those who signed each order."
 RUS_chancery_mandate:0 "One Seal of the Khan"
 RUS_chancery_mandate_desc:0 "A single seal gives orders from the capital authority in every aimaq. The chancery sets deadlines, consolidates scattered records and demands compliance without waiting for another council of elders. The government musters people and implements decisions faster, but each such victory reminds the communities of the rights they had to surrender.\n\n\n\n\n\n £GFX_RUS_chancery_mandate_banner \n\n\n"
 RUS_seal_chancery:0 "One Seal"
 RUS_seal_chancery_desc:0 "The right to speak in the Khan's name cannot be handed out with travel papers. The chancery will bring orders into a single chain and take responsibility for its rigidity."
 RUS_written_oaths:0 "Oaths on Paper"
 RUS_written_oaths_desc:0 "The council and the chancery distribute authority differently, but both must answer for promised deliveries. Written commitments will secure the allocation of engineering equipment to district services. An oath becomes convincing when it is followed by equipment that can actually be used; the editorial office will then be able to report on promises fulfilled."
 RUS_paid_administration:0 "Paid Public Service"
 RUS_paid_administration_desc:0 "A clerk is paid for a properly kept register, a collector for money delivered to the treasury. Permanent service gives officials employment and a livelihood, and gives the state the means to hold them accountable for results. Less money disappears between the capital's ledger and the district granary, reducing the cost of administration."
 RUS_pay_the_officials:0 "Salaries Instead of Exactions"
 RUS_pay_the_officials_desc:0 "A clerk who lives off every signature inevitably sells the state one page at a time. Regular salaries are expensive, but now accuracy can be demanded."
 RUS_winter_granaries:0 "Winter Ledgers"
 RUS_winter_granaries_desc:0 "Counting the grain before frost sets in means avoiding winter requisitions. A copy of the storehouse ledger will remain with those who fill the granaries."
 RUS_district_courts:0 "Judgment Before Gunfire"
 RUS_district_courts_desc:0 "Not every dispute over land should end in a campaign. Traveling courts will secure reconciliation between communities and free people from the obligation to take part in feuds. Those who once guarded disputed boundaries can return to state service; a sealed ruling will prove more useful than another raid."
 RUS_school_of_scribes:0 "School of Scribes and Mechanics"
 RUS_school_of_scribes_desc:0 "To the Khan, a literate person has long meant a useful person. Now, at the same table, students learn to draw up estimates, read blueprints and spot forgeries.\n\nBasic schools replace informal instruction. A more advanced education system is retained."
 RUS_roadside_clinics:0 "Roadside Hospitals"
 RUS_roadside_clinics_desc:0 "A cart carrying a wounded person needs an address, not the hope of encountering a healer. A network of small hospitals will connect scattered settlements better than grand manifestos."
 RUS_a_country_of_names:0 "A Country of Individual Names"
 RUS_a_country_of_names_desc:0 "The last census book no longer has a line for 'others.' Rustan learns the price of true authority: everyone he orders to be protected becomes a particular person."
 RUS_surface_workshops:0 "Workshops Above the Bunker"
 RUS_surface_workshops_desc:0 "The underground shelter cannot survive without people outside. Old repair sheds will be brought together into a factory yard capable of making fittings, a cart or a new door. The workshops also open the way for trade promotion: caravans will receive orders, and the treasury will receive money for the next level."
 RUS_treasury_400_tt:0 "The treasury receives §G400§! £ADISCORD_economy_treasury_texticon."
 RUS_salvage_inventory:0 "Register of Surviving Machine Tools"
 RUS_salvage_inventory_desc:0 "A machine tool without documentation is not scrap. Inspectors will determine what can be restored before the most enterprising owners sell it by weight."
 RUS_machine_school:0 "School of Machine Setters"
 RUS_machine_school_desc:0 "A working machine tool is useless without someone who knows when to stop it. The school will occupy an empty warehouse beside the first workshop."
 RUS_power_grid:0 "A Grid Above Ground"
 RUS_power_grid_desc:0 "Power lines will link workshops and settlements into a common economic network. The underground generators will remain a separate matter: relying on a single switch would make things far too easy for the enemy.\n\nThe shared grid enables the transition from an agrarian to an industrializing economy. An existing advanced system is retained."
 RUS_freight_yards:0 "Unloading Yards"
 RUS_freight_yards_desc:0 "The capital's gates should receive a freight train, not a queue of wagon columns. Dispatchers need locomotives, and workshops need spare assemblies to repair them."
 RUS_standard_calibres:0 "One Caliber for Every Order"
 RUS_standard_calibres_desc:0 "All too often, a new batch of cartridges does not fit an old batch of rifles. Unified procurement inspection will put an end to this costly variety."
 RUS_civilian_shift:0 "A Second Civilian Shift"
 RUS_civilian_shift_desc:0 "A military order has more voices behind it than a civilian one. The Khan will reserve a work shift for civilian production, or repairs to the capital will remain a military promise forever.\n\nRegulated shifts replace guild protections or loose contracts. Other established labour policies are retained."
 RUS_precision_lathes:0 "Precision Machine Tools"
 RUS_precision_lathes_desc:0 "Variation between parts is measured in more than metal: it means delays and lives lost. The new line will make fewer different things, but they will be interchangeable."
 RUS_treasury_300_tt:0 "The treasury receives §G300§! £ADISCORD_economy_treasury_texticon."
 RUS_industrial_belt:0 "The Capital's Industrial Ring"
 RUS_industrial_belt_desc:0 "The settlements around the bunker have become a city while the chancery still counts them as a temporary camp. It is time to recognize this city and provide it with permanent services.\n\nIndustrial employment and urban services establish an industrial society in place of traditional or agrarian society. Completing the bunker is not required."
 RUS_engineers_collegium:0 "College of Engineers"
 RUS_engineers_collegium_desc:0 "The Khan will have a council allowed to say, 'That will not hold.' The right to challenge an order when calculations are at stake will become a new custom of state."
 RUS_treasury_500_tt:0 "The treasury receives §G500§! £ADISCORD_economy_treasury_texticon."
 RUS_bunker_survey:0 "Blueprint of the Underground Capital"
 RUS_bunker_survey_desc:0 "The tunneling crews can begin work now. A state survey will give them a geological map, their first major payment and engineering equipment for paid projects. The Khan will gain the means to choose between depth, power and structural integrity, rather than permission to open the construction site for the first time."
 RUS_bunker_airlocks:0 "Two Doors from Daylight"
 RUS_bunker_airlocks_desc:0 "The first barracks or residential level is already available to the construction service. Airtight passages will now allow additional storerooms to be fitted near the entrance. Their permanent capacity and the first food shipment will help supply the complex once new residents arrive."
 RUS_bunker_power_school:0 "The Generator Hall"
 RUS_bunker_power_school_desc:0 "The chief engineer wrote four units of power at the bottom of the plan. The top sheet of requests already calls for twelve. Promises will have to yield to the generators."
 RUS_bunker_shift_work:0 "Two Underground Shifts"
 RUS_bunker_shift_work_desc:0 "Additional shifts will speed up excavation. The foreman demands that the price be written into the order: less time for reinforcement means weaker vaults."
 RUS_bunker_deep_gallery:0 "Beyond the Old Bulkhead"
 RUS_bunker_deep_gallery_desc:0 "The first samples allow the shaft to continue down to the third level. There is enough room there for utilities and production, provided the upper galleries are not left without reinforcement."
 RUS_bunker_utilities:0 "Water or Wire"
 RUS_bunker_utilities_desc:0 "The engineers are arguing over the second level. To some, clean water is the foundation of life; to others, a timely order is the foundation of defense. The installation order will make the final choice."
 RUS_treasury_200_tt:0 "The treasury receives §G200§! £ADISCORD_economy_treasury_texticon."
 RUS_bunker_working_heart:0 "Bread or Steel"
 RUS_bunker_working_heart_desc:0 "The third level cannot hold both a full arsenal and sufficient grain chambers. The underground budget will now become a political decision."
 RUS_bunker_lower_horizons:0 "Lower Horizons"
 RUS_bunker_lower_horizons_desc:0 "Unfamiliar rock begins beyond the third level. The shaft can go deeper only once the upper floors become a functioning complex, rather than a triumphant photograph of empty walls."
 RUS_bunker_science_wing:0 "Light on the Fourth Level"
 RUS_bunker_science_wing_desc:0 "Doctors and researchers ask for the same things: cleanliness, reliable light and quiet. They will have to agree whose work will first find a home under the protection of the rock."
 RUS_bunker_memory_vault:0 "Memory or Command"
 RUS_bunker_memory_vault_desc:0 "The heart of the complex will be on the final level. The archive will preserve the country after its ruler dies. The command hall will help the ruler prevent both his own death and that of his country."
 RUS_bunker_commission:0 "The Test of Silence"
 RUS_bunker_commission_desc:0 "The external power switch will be shut off for a full day. If the complex holds, its residents will hear their own lives for the first time, rather than the work of builders. If it does not, the celebration can wait."
 RUS_open_city_policy:0 "A City for the Living"
 RUS_open_city_policy_desc:0 "Families, doctors and teachers pass through the airtight doors. The underground capital is being built for life: its residents gain a place in a shared future, and researchers gain the chance to work beside the workshops. This arrangement strengthens trust and science, though it makes it harder for the state to demand an endless siege from its citizens. The civil rights adopted here also apply beyond the complex."
 RUS_bunker_open_city:0 "A City for the Living"
 RUS_bunker_open_city_desc:0 "Rustan orders some checkpoints removed and the lower doors left open for civilian services. The shelter will become a capital if people can come here on business, rather than under orders."
 RUS_sealed_throne_policy:0 "Throne Beneath the Mountain"
 RUS_sealed_throne_policy_desc:0 "Access to the deep halls is governed by passes and orders from headquarters. Supplies, communications and protected rooms serve the task of withstanding a siege and preserving command when the surface becomes a battlefield. This discipline strengthens defense and the will to continue the war, but residents have ever less influence over their own fate. The established order extends throughout the state."
 RUS_bunker_sealed_throne:0 "Headquarters Beneath the Mountain"
 RUS_bunker_sealed_throne_desc:0 "The final doors will close, each assigned the name of the person responsible. The government built a place from which even the end of the world could be managed. Now it must avoid confusing government with waiting for the end."
 RUS_muster_books:0 "Regimental Rolls"
 RUS_muster_books_desc:0 "A chieftain brings a warband, but headquarters must know how many people and rifles it contains. A common ledger will allow aid to be sent where it is truly needed. Regimental posters and lists of names will launch the 'This Rifle Defends Your Home' campaign, while the depot will receive weapons for new brigades."
 RUS_quartermaster_service:0 "The Supply Train Service"
 RUS_quartermaster_service_desc:0 "A unit that lives off the nearest homestead soon runs out of homesteads. A permanent supply train will let the army march farther without turning its rear into a wasteland."
 RUS_patient_doctrine_delta:0 "Changes to the Black Army"
 RUS_patient_doctrine_delta_desc:0 "Defense and supply conservation at the cost of offensive speed."
 RUS_patient_war:0 "Patient Warfare"
 RUS_patient_war_desc:0 "Headquarters need not answer every challenge immediately. Prepared positions, stockpiled supplies and precise calculations will allow the army to choose when to strike."
 RUS_swift_doctrine_delta:0 "Changes to the Black Army"
 RUS_swift_doctrine_delta_desc:0 "A mobile offensive requires more supplies."
 RUS_swift_columns:0 "Swift Columns"
 RUS_swift_columns_desc:0 "While a neighbor is still looking for the main road on a map, the Khan's troops should already be at the next crossroads. That speed will have to be paid for with additional supplies."
 RUS_officer_courses:0 "Courses for Sotniks"
 RUS_officer_courses_desc:0 "A sotnik must know not only how to be first into the attack, but also how to be last to check the casualty roll. These courses will leave commanders with fewer fine excuses."
 RUS_field_sappers:0 "Field Engineering Service"
 RUS_field_sappers_desc:0 "A bridge, a trench and a winter road are different answers to the same question: how to get people through to the next day. Sappers will no longer be parceled out among other headquarters."
 RUS_artillery_tables:0 "Firing Tables"
 RUS_artillery_tables_desc:0 "The old batteries know each gun's range through their crews' memories. Common tables will preserve that knowledge when the crews change."
 RUS_reserve_rotations:0 "Reserve Rotation"
 RUS_reserve_rotations_desc:0 "People returning from the front should not vanish from the regimental roll. Rotating service will give the army a reserve and an allotment of small arms, while leaving the economy at least some of its workers."
 RUS_anti_air_posts:0 "The Sky Above Headquarters"
 RUS_anti_air_posts_desc:0 "An aircraft can see the bunker entrances more easily than a map of its corridors. Observation posts and anti-air batteries will protect what even a deep shelter needs to avoid becoming a trap. The batteries receive 180 units of ammunition immediately and assemble another 2 units of anti-air equipment each week."
 RUS_professional_service_delta:0 "Changes to the Black Army"
 RUS_professional_service_delta_desc:0 "Regular training binds the aimaqs into a single military system."
 RUS_army_of_the_khanate:0 "An Army That Will Return"
 RUS_army_of_the_khanate_desc:0 "Orders now require plans not only for battle, but also for the return. The Black Army is ceasing to be a gathering of warbands whose fate ends beyond the nearest hill."
 RUS_postwar_roads: "Protected Power Lines"
 RUS_postwar_roads_desc: "Substations and cable routes need protection from the advancing armies. Held reactor zones receive fortifications and anti-aircraft installations; troops receive additional air defence weapons."
 RUS_imperial_academy: "Guidance System"
 RUS_imperial_academy_desc: "The computers must keep the beam on target through interference, broken communications and damaged ground stations. Engineers will develop manufacturing solutions while the staff practises switching to reserve controls."
 RUS_treasury_600_tt:0 "The treasury receives §G600§! £ADISCORD_economy_treasury_texticon."
 RUS_tomorrow_above_ground: "The Last Order"
 RUS_tomorrow_above_ground_desc: "The calculations are delivered, the power lines protected and the guards know their positions. Khan must confirm the order for which the programme exists. Until the appointed day, the army will hold the perimeter."
 RUS_treasury_220_tt:0 "The treasury receives §G220§! £ADISCORD_economy_treasury_texticon."
 RUS_engineering_order_cost:0 "[GetRUSOrderengineering_orderpp]; [GetRUSOrderengineering_ordercash]"
 RUS_engineering_order_cost_blocked:0 "[GetRUSOrderengineering_orderpp]; [GetRUSOrderengineering_ordercash]"
 RUS_engineering_order_cost_tooltip:0 "[GetRUSOrderengineering_orderpp]; [GetRUSOrderengineering_ordercash]"
 RUS_engineering_order:0 "Order Engineering Equipment"
 RUS_engineering_order_desc:0 "The workshops assemble pumps, fittings, cable and tools for construction crews and field sappers.\n\nPayment and delivery are immediate; another order may be placed after 60 days.\n\nDelivery: §G100§! £support_equipment_texticon, or §G150§! at the same price with an operational underground workshop."
 RUS_rifle_order_cost:0 "[GetRUSOrderrifle_orderpp]; [GetRUSOrderrifle_ordercash]"
 RUS_rifle_order_cost_blocked:0 "[GetRUSOrderrifle_orderpp]; [GetRUSOrderrifle_ordercash]"
 RUS_rifle_order_cost_tooltip:0 "[GetRUSOrderrifle_orderpp]; [GetRUSOrderrifle_ordercash]"
 RUS_rifle_order:0 "Order Standard-Caliber Weapons"
 RUS_rifle_order_desc:0 "Procurement purchases an agreed batch of weapons for regular recruitment and unit reinforcement. Formations receive personnel and equipment through the usual channels.\n\nPayment and delivery are immediate; another order may be placed after 60 days."
 RUS_market_surplus_cost:0 "[GetRUSOrdermarket_surpluspp]; [GetRUSOrdermarket_surplusrifles]"
 RUS_market_surplus_cost_blocked:0 "[GetRUSOrdermarket_surpluspp]; [GetRUSOrdermarket_surplusrifles]"
 RUS_market_surplus_cost_tooltip:0 "[GetRUSOrdermarket_surpluspp]; [GetRUSOrdermarket_surplusrifles]"
 RUS_market_surplus:0 "Sell Depot Surpluses"
 RUS_market_surplus_desc:0 "After depot inventories are checked, surplus weapons can be sold to local security cooperatives. The equipment is deducted from the actual national stockpile.\n\nPayment and delivery are immediate; another order may be placed after 60 days."
 ADISCORD_rus_campaign.1.t:0 "Five Levels of Silence"
 ADISCORD_rus_campaign.1.d:0 "In the night, Rustan woke to knocking in the wall. People were working behind the concrete: stripping away old paneling, searching for water, arguing over whether the ceiling would survive another winter. The Khan listened for a long time before calling the duty officer.\n\nA plan of the shelter was brought to the table. Three different hands gave the same corridor three different names. The lower rooms were missing from the plan entirely. 'This is not a capital,' the engineer said. 'It is a place where we hope to wait things out.' Rustan did not answer at once. He was used to issuing orders about roads, borders and other people's loyalty. Here, the question was what would remain beneath his own feet.\n\nIn the morning, the chieftains of the aimaqs will receive an invitation. Scribes will begin counting households, workshops will assemble tools, and engineers will inspect the vaults. The Khan has an army and a name. He must now build a country that will outlive the next campaign.\n\nThe construction service has already received twenty units of engineering equipment and an advance for the first excavation. Work can be ordered immediately in the underground capital, without waiting for the state survey."
 ADISCORD_rus_campaign.1.a:0 "Let us begin with those who live above."
 ADISCORD_rus_campaign.2.t:0 "The Person Behind the Number"
 ADISCORD_rus_campaign.2.d:0 "The first register listed fewer households than the chiefs had promised, and more people than the treasury had expected. Some families had hidden from the collectors for years; others were still paying for sons who had long since left home.\n\nThe old scribe laid two books before the Khan. One portrayed a strong country: neat figures, punctual deliveries, no empty lines. The other portrayed the real one. Rustan ran his finger over the corrections and ordered both to be kept. 'The first, to remember how they lie to us. The second, to have something to govern by.'\n\nOutside the door, they were already arguing over a new council and a new seal. This time, the argument would begin with a known number of living people."
 ADISCORD_rus_campaign.2.a:0 "Leave the corrections visible."
 ADISCORD_rus_campaign.3.t:0 "Another Horizon"
 ADISCORD_rus_campaign.3.d:0 "The last cart was rolled to the lift just before dawn. Beyond the temporary barrier lay a new level: unfinished, unfurnished, with lamps hanging from exposed cables.\n\nThe foreman would not allow a ceremony. He listed the cracks, pointed out the anchoring marks, and only then handed over the excavation certificate. The empty hall was not yet a barracks, a hospital, or an arsenal. Now the Khan would have to decide whose work would occupy this space and how much power it could be promised.\n\nOn the wall beside the level number, someone had chalked the names of the night shift. Rustan ordered them left there until the fitting-out was complete."
 ADISCORD_rus_campaign.3.a:0 "First, let us inspect the vaults."
 ADISCORD_rus_campaign.4.t:0 "A Signature Without a Title"
 ADISCORD_rus_campaign.4.d:0 "On the last page of the new census, Rustan found his own name. The scribe had added neither a title nor a special colour of ink. The entry looked just like thousands of others.\n\nThe Khan summoned its author. The man tried to explain that the register's format made no provision for exceptions, then fell silent. Rustan asked whether the format had a place for the dead. The scribe nodded. 'Then leave it that way. A good book should still be useful after I am gone.'\n\nThe order was copied without that phrase. But the scribe remembered it."
 ADISCORD_rus_campaign.4.a:0 "The book stays."
 ADISCORD_rus_campaign.5.t:0 "The Right to Say No"
 ADISCORD_rus_campaign.5.d:0 "The board's first meeting ended in a refusal. The engineers returned the military department's plans for an overloaded bridge. Headquarters sent a document bearing the Khan's seal. The board attached its calculations and sent the document back again.\n\nRustan was urged to punish such insolence. He asked for the calculations to be read aloud, waited for the awkward silence, and signed a revised estimate. A state where everyone agrees with the ruler builds bridges that lead only one way far too often.\n\nThe following day, for the first time, an amended order reached the workshops bearing the same seal that had certified the original mistake."
 ADISCORD_rus_campaign.5.a:0 "Calculations carry more weight than haste."
 ADISCORD_rus_campaign.6.t:0 "A Plan That Can Be Carried Out"
 ADISCORD_rus_campaign.6.d:0 "The chief engineer laid out five sheets, one beneath another. The first: entrances and housing. The second: water or communications. The third: bread or steel. The fourth: medicine or research. The fifth he left almost blank.\n\n'First we cut through the rock, then we install the equipment. One crew cannot work at two faces. One generator cannot be counted twice. And if we rush, the vaults will start paying the price for us.' The Khan asked where the throne would stand. The engineer pointed to the upper floor: for now, where the construction could be seen.\n\nThe first reserve of money and the first issue of equipment appeared in the margins of the estimate. For the first time, the bunker had a future set out in costs and deadlines, rather than wishes."
 ADISCORD_rus_campaign.6.a:0 "Give the crew its first commission."
 ADISCORD_rus_campaign.7.t:0 "Beyond the Noise of Machinery"
 ADISCORD_rus_campaign.7.d:0 "The upper floors already followed a schedule of their own. Mechanics worked behind a closed door, storekeepers argued in the corridor, and the duty officer cursed someone else's cable. The bunker was no longer an empty space waiting to be filled.\n\nThe lower level was quieter. A geologist handed the Khan a piece of dark rock and suggested stopping where they were. Not because they could go no further. Because every metre beyond this point would cost more.\n\nRustan left the stone on the table beside his seal. He signed the authorisation for two new levels without a celebratory address. The country had already paid for the right to choose. Now it had to learn to choose without haste."
 ADISCORD_rus_campaign.7.a:0 "The lower floors will have their estimates too."
 ADISCORD_rus_campaign.8.t:0 "A Day Without the Surface"
 ADISCORD_rus_campaign.8.d:0 "The external power switch was thrown at noon. A few lamps flickered, the pumps changed pitch, and the duty officer reported that the complex was running on its own power.\n\nFor the first few hours, everyone listened closely. By evening, they had stopped. The night shift went to work, the ledgers were closed downstairs, and someone fell asleep by the stairs with a bundle under their head. The test succeeded at the moment people forgot it was taking place.\n\nThe Khan walked all five levels. He paused at the last door. Here, power could be hidden away from the country. Or the country could be given a place where it would carry on even through its worst day. Concrete would not make that choice for him."
 ADISCORD_rus_campaign.8.a:0 "We still have to decide whom these doors serve."
 ADISCORD_rus_campaign.9.t:0 "The Open Stairway"
 ADISCORD_rus_campaign.9.d:0 "The new order was shorter than any of the construction estimates. Some internal guard posts were removed; civilian services received regular public opening hours; the access list was replaced by a work schedule.\n\nThe guard commander warned that this would make security harder to maintain. The Khan agreed. The engineer observed that more people would now be using the stairs. The Khan agreed with him too. Rustan did not answer the third objection: people were already waiting at the entrance who needed a functioning office, not a ruler.\n\nThe bunker did not become a city on the day it opened. It became one when the first person entered without fearing that the door would be locked behind them."
 ADISCORD_rus_campaign.9.a:0 "Let them come about their business."
 ADISCORD_rus_campaign.10.t:0 "A Throne Beneath the Mountain"
 ADISCORD_rus_campaign.10.d:0 "The doors were closed in sequence, from top to bottom. Keys and names were checked at every post. The final report was delivered almost in a whisper, though there was no reason to speak quietly in the command hall.\n\nThe walls would withstand a blow. The cables would keep orders flowing. The stores would allow them to wait. Rustan had received exactly what he had demanded of the builders: a place from which his rule could not simply be driven out. Yet the stronger that certainty grew, the more distant the voices above ground seemed.\n\nThe Khan left the keys to the upper doors on the table. The shelter was ready. Now he alone was responsible for ensuring that he did not turn it into his own tomb while he still lived."
 ADISCORD_rus_campaign.10.a:0 "Keep communications with the surface open."
 ADISCORD_rus_campaign.11.t: "The Last Order"
 ADISCORD_rus_campaign.11.d:0 "There was no longer a neighbouring hegemon on the map that could order the Khan to retreat. The victory reports were filed away; captured banners were removed from the corridors because they got in the way of moving furniture.\n\nThat morning, people came to Rustan with ordinary business. A bridge was needed. The school had run out of room. In a new district, there was a dispute over the price of grain. The Khan listened, gradually realising that these requests spoke of victory more clearly than the lands he had annexed. People expected to live under his reign, not merely wait it out.\n\nHe went up to the surface before the changing of the guard. Smoke hung over the workers' settlements, and the first truck was making its way along the road. The Last Empire greeted another day, and that day did not require a final order."
 ADISCORD_rus_campaign.11.a:0 "Put the bridge first on the agenda."
