 RUS_bunker_archive_compact:0 "Archive"
 RUS_bunker_archive_ui_tt:0 "§YAimaq Archive§!\n§G+0.35§! £political_power_texticon per day.\n\nCost: [GetRUSBunker19pp]  [GetRUSBunker19cash]  [GetRUSBunker19equipment]\nDuration: §Y28 days§!\nUpkeep: §Y1§! £energy_consumption_texticon; §Y1§! £supply_texticon per week.\n\nAfter Trained Administrators, an operational archive adds §G+15§! £ADISCORD_country_development_texticon state progress to each paid civil-service training programme.\n\n[GetRUSBunkerRoomarchive]\nRequires focus: [GetRUSBunkerRecipe5].\n\n[GetRUSBunkerForecastarchive]"
