 RUS_bunker_granary_cost_blocked:0 "[GetRUSBunker16pp]; [GetRUSBunker16cash]; [GetRUSBunker16equipment]"
 RUS_bunker_granary_cost_tooltip:0 "[GetRUSBunker16pp]; [GetRUSBunker16cash]; [GetRUSBunker16equipment]"
 RUS_bunker_granary_requirements_tt:0 "Required spare power capacity: 1. Once completed, this level uses 1 power and grants the permanent effects shown below. Only one room can be chosen on this level."
 RUS_bunker_clinic_delta:0 "Surgical Level"
 RUS_bunker_clinic:0 "Level 4: Surgical Level"
 RUS_bunker_clinic_desc:0 "For the first time, field surgeons will have light, sterile water and a place to bring the wounded back to life. The Khan's ledgers will learn to count lives saved.\n\nDuration: 21 days. Required spare power capacity: 2. Once completed, this level uses 2 power and grants the permanent effects shown below. Only one room can be chosen on this level.\n$RUS_bunker_contract_tt$\n\nAn operational clinic opens district paramedic training and raises its reward to §G40§! social-system development progress instead of 25. Acquired knowledge survives the loss of the bunker.\n\nReturn of the Wounded adds another 5% casualty trickleback."
 RUS_bunker_clinic_cost_pp_ok:0 "§Y25§! £political_power_texticon"
 RUS_bunker_clinic_cost_pp_low:0 "§R25§! £political_power_texticon"
 RUS_bunker_clinic_cost_cash_ok:0 "§Y350§! £ADISCORD_economy_treasury_texticon"
 RUS_bunker_clinic_cost_cash_low:0 "§R350§! £ADISCORD_economy_treasury_texticon"
 RUS_bunker_clinic_cost_equipment_ok:0 "§Y40§! £infantry_equipment_texticon equipment"
 RUS_bunker_clinic_cost_equipment_low:0 "§R40§! £infantry_equipment_texticon equipment"
 RUS_bunker_clinic_cost:0 "[GetRUSBunker17pp]; [GetRUSBunker17cash]; [GetRUSBunker17equipment]"
 RUS_bunker_clinic_cost_blocked:0 "[GetRUSBunker17pp]; [GetRUSBunker17cash]; [GetRUSBunker17equipment]"
 RUS_bunker_clinic_cost_tooltip:0 "[GetRUSBunker17pp]; [GetRUSBunker17cash]; [GetRUSBunker17equipment]"
 RUS_bunker_clinic_requirements_tt:0 "Required spare power capacity: 2. Once completed, this level uses 2 power and grants the permanent effects shown below. Only one room can be chosen on this level."
 RUS_bunker_laboratory_delta:0 "Deep Laboratory"
 RUS_bunker_laboratory:0 "Level 4: Deep Laboratory"
 RUS_bunker_laboratory_desc:0 "There are no stars underground, but there is quiet for calculations. The engineers have demanded a separate power line and the right to put unwelcome truths in their reports.\n\nDuration: 21 days. Required spare power capacity: 3. Once completed, this level uses 3 power and grants the permanent effects shown below. Only one room can be chosen on this level.\n$RUS_bunker_contract_tt$\n\nIf this laboratory is operational when Reactor Alloys finishes, the country also receives a §G50%§! bonus for one support technology. The airship unlock does not depend on room selection or political course.\n\nJoint Air and Ground Operations reduces air accident chance by 5%."
 RUS_bunker_laboratory_cost_pp_ok:0 "§Y25§! £political_power_texticon"
 RUS_bunker_laboratory_cost_pp_low:0 "§R25§! £political_power_texticon"
 RUS_bunker_laboratory_cost_cash_ok:0 "§Y350§! £ADISCORD_economy_treasury_texticon"
