 RUS_bunker_workshop:0 "Level 3: Underground Arsenal"
 RUS_bunker_workshop_desc:0 "Machine tools are lowered one by one, dismantled down to the last casing. Here, an air raid warning will not halt a shift, but every motor will demand its share of power.\n\nConstruction: §Y28 days§!. One room per level.\nFood upkeep: §Y1§! £supply_texticon per week.\n\nPaid programmes while operational: Order Engineering Equipment delivers §G150§! £support_equipment_texticon instead of 100; Train Workshop Masters grants §G+40§! £ADISCORD_country_development_texticon economic progress instead of 25.\n\n[GetRUSBunkerForecastworkshop]"
