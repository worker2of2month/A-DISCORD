# --- rus_last_empire_l_english ---
 RUS_khan:0 "Khan"
 RUS_summon_the_aimaqs: "Summon the Aimaqs"
 RUS_summon_the_aimaqs_desc: "The free aimaqs accept a common banner only when a foreign army is already on their pastures. The khan's standard is raised so neighbours know who will speak for the steppe."
 RUS_arm_the_border_hosts: "Arm the Border Hosts"
 RUS_arm_the_border_hosts_desc: "The communes already keep rifles. What they lack is a shared stockpile and men willing to ride beyond their own ulus."
 RUS_watch_the_western_scar:0 "Protected patrols"
 RUS_watch_the_western_scar_desc: "The western edge has been silent too long. If the Dirty Zone opens, Khanate pickets will see it before any claimant capital."
 RUS_claim_the_opened_zone: "Claim the Opened Zone"
 RUS_claim_the_opened_zone_desc: "Dirty Zone settlements appeared without a master. The Land of the Khan will not wait for someone else to call them a buffer."
 RUS_drive_starolesye_back: "Drive Starolesye Back"
 RUS_drive_starolesye_back_desc: "The Starolesye Republic sits on the western belt. While it holds the neighbouring states, every khanate army remains trapped in the bunker."
 RUS_press_the_closed_zone: "Press the Closed Zone"
 RUS_press_the_closed_zone_desc: "Dirty Zone neighbours live and fight apart. The Land of the Khan can take them one at a time without joining the war for the Tower."
 RUS_seat_the_khan_chancery: "Operation Last Sunset"
 RUS_seat_the_khan_chancery_desc:0 "On the Khan's maps, the conquered lands already share a single colour. Now their garrisons, arsenals and reactor sites must answer to one command. The imperial chancery will bind them into a common system, while preparations for Operation Last Sunset begin behind the bunker doors.\n\nThe people are promised an empire that will put an end to war. In the scientists' classified calculations, that promise takes on another meaning. There is still time before the empire is proclaimed; afterwards, the reactor is to power a weapon that will recognise neither borders nor a safe rear. The Khan prepares to give his final signature. The world still awaits the dawn."
 RUS_summon_the_aimaqs_tt: "The aimaqs accept a common muster as a defence of the land, not as a new capital."
 RUS_watch_the_western_scar_tt: "Pickets wait for the Dirty Zone to open. The wars themselves start only through separate decisions."
 RUS_claim_the_opened_zone_tt: "The Land of the Khan claims the western Dirty Zone belt. Wars open through decisions, not this focus."
 RUS_claim_the_opened_zone_available_tt: "The Dirty Zone must already be open."
 RUS_drive_starolesye_back_available_tt: "Starolesye must exist, or the khanate border war must already be under way."
 RUS_press_the_closed_zone_available_tt: "Starolesye must already be absorbed, or it must no longer exist."
 RUS_seat_the_khan_chancery_available_tt: "At least two Dirty Zone neighbours must already be held."
 ADISCORD_vorkerland_rus_dirty_campaign_category: "Khanate Campaign"
 ADISCORD_vorkerland_rus_dirty_campaign_category_desc: "The Land of the Khan can wage several Dirty Zone campaigns at once. Each new campaign requires a land border with its target; each republic is conquered separately."
 RUS_campaign_sla: "Finish Starolesye"
 RUS_campaign_sla_desc: "The border war left the republic without its western belt. The Land of the Khan now takes the remaining Starolesye land."
 RUS_campaign_rza: "March on the Reactor Belt"
 RUS_campaign_rza_desc: "The Reactor Zone Union holds the contaminated industrial node. The khanate army takes it only with a shared border and a free front."
 RUS_campaign_mlr: "Occupy the Lowland"
 RUS_campaign_mlr_desc: "The Little Lowland Republic sits on the next stretch after Starolesye. It is taken separately."
 RUS_campaign_ert: "Demand the Eastern Republic"
 RUS_campaign_ert_desc: "The Eastern Republic becomes a target only when khanate holdings already touch its border."
 RUS_campaign_irt: "Demand the Inner Lands"
 RUS_campaign_irt_desc: "The Inner Lands Republic follows the same rule: a shared border and a complete seizure."
 RUS_campaign_sca: "Demand the Southern Federation"
 RUS_campaign_sca_desc: "The Southern Federation is a distant neighbour. The decision appears only after khanate land has reached its frontier."
 RUS_proclaim_the_last_empire: "Proclaim the Last Empire"
 RUS_proclaim_the_last_empire_desc:0 "The aimaqs and conquered lands recognise the Khan's common authority. Proclaiming the state will turn his ambitions into an open challenge to his neighbours."
 RUS_campaign_sla_tt: "Declares war on Starolesye and demands all of its land."
 RUS_campaign_rza_tt: "Declares war on the Reactor Zone Union and demands all of its land."
 RUS_campaign_mlr_tt: "Declares war on the Little Lowland Republic and demands all of its land."
 RUS_campaign_ert_tt: "Declares war on the Eastern Republic and demands all of its land."
 RUS_campaign_irt_tt: "Declares war on the Inner Lands Republic and demands all of its land."
 RUS_campaign_sca_tt: "Declares war on the Southern Federation and demands all of its land."
 RUS_campaign_sla_not_active_tt: "The full campaign against Starolesye has not yet been declared."
 RUS_campaign_sla_border_tt: "Requires a land border with Starolesye."
 RUS_campaign_rza_border_tt: "Requires a land border with the Reactor Zone Union."
 RUS_campaign_mlr_border_tt: "Requires a land border with the Little Lowland Republic."
 RUS_campaign_ert_border_tt: "Requires a land border with the Eastern Republic."
 RUS_campaign_irt_border_tt: "Requires a land border with the Inner Lands Republic."
 RUS_campaign_sca_border_tt: "Requires a land border with the Southern Federation."
 RUS_proclaim_the_last_empire_available_tt: "Requires control of every accessible region in all six Dirty Zone belts, except regions controlled by Kefreyt or its subjects."
 RUS_proclaim_the_last_empire_prepared_tt: "Complete the military preparation first: The Second Aimaq Muster and Arm the Border Hosts provide five and three rifle brigades before the crisis begins."
 RUS_proclaim_programme_tt:0 "§RPotential coalition members: [MON.GetName], [VLD.GetName], [TMR.GetName] and [BTL.GetName].§! Regional victors and their allies may also join.\n\nControl of any reactor zone starts the countdown: §R90 days until coalition intervention§! and §R455 days until the orbital strike§!. If the perimeter is secured later, the countdown starts then.\n\n§RWinning the war does not stop the strike. It will destroy the world and end the regular campaign.§! Losing the entire reactor perimeter permanently disables the programme."
 RUS_arm_the_border_hosts_tt: "Raises three rifle brigades in the capital from the mustered men and rifles."
 RUS_proclaim_the_last_empire_peace_tt: "Requires peace on every front, not only a closed Dirty Zone campaign."
 RUS_last_empire: "Last Empire"
 RUS_last_empire_ADJ: "Imperial"

# --- rus_crisis_l_english ---
 RUS_world_anarchy: "Anarchy"
 RUS_world_anarchy_DEF: "anarchy"
 RUS_world_anarchy_ADJ: "Ruined"
 RUS_last_bunker: "Khan's Bunker"
 RUS_last_bunker_DEF: "Khan's bunker"
 RUS_last_bunker_ADJ: "Bunker"
 RUS_crisis_player_attack: "Attack the Khan"
 RUS_crisis_player_attack_desc: "Our regional victory allows us to attack the Khan before he proclaims his empire or reveals the orbital programme. This decision is available when both countries are controlled by players. If the intervention has already begun, we will enter the common war against the Khan."
 RUS_crisis_player_attack_tt: "Start a war against the Khan. If the intervention is already underway, join its war together with our allies. This decision neither starts the orbital programme nor changes its deadlines."
 RUS_crisis_player_attack_side_tt: "We are not at war with any member of the intervention against the Khan."
 RUS_crisis_reactor_alliance: "Reactor Pact"
 RUS_last_empire_crisis: "The Last Sky"
 RUS_last_empire_crisis_desc: "[GetRUSCrisisPhase]\n[GetRUSCrisisLaunchClock]\n\n§RDefeating the coalition does not stop the orbital strike. Losing the entire reactor perimeter permanently disables the programme.§!\n\nPotential coalition members: §R[MON.GetName], [VLD.GetName], [TMR.GetName], [BTL.GetName]§! and regional war victors. Late participants may send volunteers and receive an invitation to join §Y90 days§! before the strike. Existing factions remain.\n\n§RKhan's defeat dissolves the empire. The strike destroys the world and ends the normal campaign.§!"
 RUS_crisis_phase_preparing:0 "Phase: coalition intervention preparations."
 RUS_crisis_phase_war:0 "Phase: confrontation with the coalition."
 RUS_crisis_phase_victory:0 "Phase: coalition defeated."
 RUS_crisis_phase_inactive:0 "Phase: crisis inactive."
 RUS_crisis_programme_stopped_tt:0 "The Khan has lost power or independence, capitulated, or completed or disabled the orbital programme"
 RUS_crisis_reactor_access_lost_tt:0 "The Khan controls none of the four reactor zones"
 RUS_crisis_invasion_stage_closed_tt:0 "The preparation stage for regional intervention has ended or been cancelled"
 RUS_crisis_invasion_countdown: "Until the regional intervention"
 RUS_crisis_invasion_countdown_desc: "Ninety days after exposure, the independent Montar Empire, Vald Union, Timer Chamber and Free Republic of Bayrinzh will intervene. Bayrinzh, Montar and Timer form the Reactor Pact if not already bound to other factions. The southern victor and eastern hegemon must have finished their wars. Their allies and subjects enter the same side of the war while retaining their factions. A country fighting an existing participant cannot join its side; an earlier independent war against Khan keeps its own settlement. Eligibility is checked on the day of intervention. Closing events does not change the deadline."
 RUS_crisis_defence_countdown: "Until the orbital strike"
 RUS_crisis_defence_countdown_desc: "There are 455 days from exposure: 90 days to prepare and 365 more before launch. Defeat Khan or capture the entire reactor perimeter ($STATE_176$, $STATE_177$, $STATE_188$, $STATE_192$) to prevent launch. Existing factions and other wars continue. A liberated participant must be defeated again."
 RUS_crisis_establish_special_zone: "Special zone: [FROM.GetName]"
 RUS_crisis_establish_special_zone_desc: "Establish a sanitary frontier administration in this restored fragment. It will become our subject; the other fragments remain independent until a separate decision is taken."
 RUS_crisis_fragment_available_tt: "The fragment is independent, outside a faction and at peace."
 RUS_empire_proclaimed_tt: "The Last Empire has been proclaimed."
 RUS_crisis_course_open_tt: "Defensive preparations remain available until launch or the empire's collapse."
 RUS_imperial_frontier_campaign: "Imperial campaign: [FROM.GetName]"
 RUS_imperial_frontier_campaign_desc: "Start a war to annex a neighbouring country. A shared border is required; the target must be independent and outside a faction. The empire opens one front at a time. Preparations for the last campaign against the hegemon and the campaign itself temporarily block new frontier wars."
 RUS_imperial_frontier_not_crisis_tt:0 "The orbital programme has not been exposed or has been permanently stopped; the coalition war is over."
 RUS_crisis_war_active_tt: "Regional powers are fighting the Last Empire."
 RUS_crisis_won_tt: "Every remaining participant in the intervention has been defeated."
 RUS_crisis_warning_tt: "Regional powers will review their readiness to intervene in §Y90 days§!. Launch follows §Y455 days§! after exposure if Khan retains power and reactor access."
 ADISCORD_rus_crisis.1.t: "Under One Sky"
 ADISCORD_rus_crisis.1.d: "Intelligence reports converge on one conclusion: Khan is building a reactor-powered orbital weapon. Its targets include factories, communication hubs and capitals. Stelander and Kefreyt are only the first names on the list. This programme threatens the world that makes all our states possible.\n\nThe Montar Empire, Vald Union, Timer Chamber and Free Republic of Bayrinzh prepare an expedition. The independent victors in the south and west may join; the eastern hegemon must first finish its wars. The staffs have allowed ninety days to prepare. One further year will remain before the predicted launch.\n\nBayrinzh has proposed the Reactor Pact to the Montar Empire and the Timer Chamber. Participants free of other alliances will unite their commands when the expedition begins. Existing factions remain intact and old fronts continue under their existing orders. Each participating government must bring its allies to the reactor perimeter while this war still has a purpose."
 ADISCORD_rus_crisis.1.a: "Stop Khan first."
 ADISCORD_rus_crisis.2.t: "The Last Sky"
 ADISCORD_rus_crisis.2.d: "The reactor no longer works to keep homes lit. Its output feeds the programme with which Khan intends to end the age of great states. The orbital system's final beam will strike the reactor's own core. Khan expects the catastrophe to destroy the industrial world and leave survivors dependent on the nearest fortified estate and its master.\n\nThe Montar Empire, Vald Union, Timer Chamber and Free Republic of Bayrinzh discuss intervention. Independent southern and western victors and the eastern hegemon may also march once their wars are over. Their staffs will issue orders in ninety days. Khan only needs to hold the reactor until launch.\n\nThe engineers give a total of four hundred and fifty-five days. Work continues while even one of the four accessible reactor zones remains in imperial hands. If the entire perimeter is lost, the programme cannot be restored during this campaign."
 ADISCORD_rus_crisis.2.a: "Guard the reactor."
 ADISCORD_rus_crisis.3.t: "War Against the Clock"
 ADISCORD_rus_crisis.3.d: "The preparation deadline has passed. Governments still able to intervene order their forces towards the Last Empire. Their allies and subjects join the same side of the war while retaining their own commands and factions. Existing wars continue.\n\nThe launch deadline remains unchanged. Capturing the entire reactor perimeter disables the programme, but the war still requires a military settlement. If Khan falls, his empire dissolves into independent territories. If he defeats every remaining participant, their lands are absorbed into the empire and the orbital clock keeps running."
 ADISCORD_rus_crisis.3.a: "The clock is running."
 ADISCORD_rus_crisis.4.other: "The imperial army has been defeated, and the Khan's authority is collapsing with it. Subject governments renounce their allegiance and earlier conquests escape the capital's rule. Independent administrations and armed domains emerge across the Khan's own lands.\n\nNo one inherits a ready-made empire. A fragmented frontier replaces the common enemy, with local rulers competing for roads, stockpiles and authority. Victory has removed the Khan; order in his former lands must be built anew."
 ADISCORD_rus_crisis.4.t: "An empire without its Khan"
 ADISCORD_rus_crisis.4.val: "The Khan's army has been defeated. His chancery has been dissolved, he has been removed from power, and local administrations are returning to the empire's former lands.\n\nKefreyt may leave these fragments independent or establish a sanitary frontier administration in each one separately. Neighbouring countries' lands are excluded from this partition."
 ADISCORD_rus_crisis.4.sts: "The Last Empire has dissolved with the Khan's authority. Local republics are restoring their institutions, and the former imperial centre passes to local administration.\n\nStelander may leave the fragments independent or establish sanitary frontier zones in them individually. This settlement does not transfer lands belonging to countries outside the empire."
 ADISCORD_rus_crisis.4.nod: "The Khan's last orders have gone unheeded. Northern troops have seized the centres of administration, while the subordinate aimags refuse to keep fighting for a fallen empire. The old regions will restore their own administrations within the Khan's former territory. Nodrul may conclude separate agreements for special administration, but victory alone does not turn every liberated country into a dependency."
 ADISCORD_rus_crisis.4.a: "Settle the frontier."
 ADISCORD_rus_crisis.5.t: "The Intervention Defeated"
 ADISCORD_rus_crisis.5.d: "The last armies opposing Khan have surrendered. Their participating allies and subjects share their defeat: the lands of every remaining participant pass to the empire.\n\nVictory has not changed Khan's order. If the orbital programme is still active, the reactor will keep preparing the strike until its appointed deadline. Captured capitals and conquered factories remain in its calculations."
 ADISCORD_rus_crisis.5.a: "Begin administering the new lands."
 ADISCORD_rus_crisis.6.t: "Programme Closed"
 ADISCORD_rus_crisis.6.d: "The orbital programme has lost the conditions that sustained it. Launch is permanently cancelled. Recovering the reactor cannot restart the old countdown."
 ADISCORD_rus_crisis.6.a: "Understood."
 RUS_imperial_general_staff: "The imperial general staff"
 RUS_imperial_general_staff_desc: "The aimaq commanders are used to answering only for their own troops. The general staff will combine their reports into one defensive plan and open the Last Order campaign."
 RUS_western_supply_lines: "Supply the Perimeter"
 RUS_western_supply_lines_desc: "Trains and motor columns will connect the garrisons to rear depots. The railway towards Starolesye can be improved while the empire holds both ends."
 RUS_imperial_arsenals: "The imperial arsenal"
 RUS_imperial_arsenals_desc: "The chancery will turn the hosts' separate orders into a standing armaments programme and expand the capital's arsenal."
 RUS_aimaq_reserve: "The second muster"
 RUS_aimaq_reserve_desc: "The first muster built the empire. The second must provide recruits, rifles, squad weapons, and portable anti-air crews for a war against a power that has already subdued its neighbours."
 RUS_break_the_hegemon: "Defend the Reactor Perimeter"
 RUS_break_the_hegemon_desc: "Foreign staffs are preparing to march against Khan. While engineers assemble the orbital system, the army must establish barriers, supply its garrisons and block the roads to the reactor. New brigades will take positions around the complex."
 RUS_register_conquered_lands: "Inventory the Installations"
 RUS_register_conquered_lands_desc: "Engineers will map the surviving installations, cables and distribution nodes. Repair units receive equipment and rolling stock to deliver machinery wherever the perimeter still holds."
 RUS_empire_without_rivals: "Orbital Calculations"
 RUS_empire_without_rivals_desc: "Trajectory, stored energy and the return pulse must converge in a single calculation. A new scientific directorate receives a permanent place in imperial research."

