 RUS_bunker_signals:0 "Level 2: Wired Communications Hub"
 RUS_bunker_signals_desc:0 "Cables converging in a single hall turn the shouts of messengers into verified reports. An order must arrive before its recipient dies.\n\nDuration: 21 days. Required spare power capacity: 2. Once completed, this level uses 2 power and grants the permanent effects shown below. Only one room can be chosen on this level.\n$RUS_bunker_contract_tt$\n\nIntegrated Field Signals adds 1 percentage point to reinforcement chance. Air Control Posts adds 3% air mission efficiency."
