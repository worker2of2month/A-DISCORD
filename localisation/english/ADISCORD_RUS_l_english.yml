 RUS_restoration_state_ADJ:0 "Imperial"
 ADISCORD_rus_crisis.4.government.t:0 "The Unified State Collapses"
 ADISCORD_rus_crisis.4.army.d:0 "The Black Banner has been lowered. The Khan's Black Army has been defeated, Mark Rustan removed, and the unified headquarters no longer binds the western republics into a single state. Local governments are returning to the lands of the fallen empire.\n\nOur government can leave these fragments independent or establish sanitary border administrations in each of them separately. Each special zone is created through a separate decision; neighbouring states' lands are not included in this partition."
 ADISCORD_rus_crisis.4.reconstruction.d:0 "The Last Empire has not survived the war. The Khan's council of scientists has been dissolved, Mark Rustan removed, and the common institutions no longer bind the western republics together. Local governments are returning to their own borders and budgets.\n\nOur government can leave these fragments independent or establish sanitary border administrations in each of them separately. Each special zone is created through a separate decision; neighbouring states' lands are not included in this partition."
