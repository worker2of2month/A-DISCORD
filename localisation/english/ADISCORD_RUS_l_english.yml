# --- rus_country_content ---
 RUS_crisis_laser_countdown: "Project Last Sky"
 RUS_crisis_laser_countdown_desc: "The reactor charges the orbital system. Its final beam will strike the reactor core and unleash a catastrophe that destroys the industrial world. Hold at least one of the four reactor zones ($STATE_176$, $STATE_177$, $STATE_188$, $STATE_192$) until the 455-day deadline. Losing the whole perimeter or Khan's government permanently cancels launch. Defeating the coalition does not stop the clock."
 ADISCORD_rus_crisis.10.t: "The Sky Will Remain Dark"
 ADISCORD_rus_crisis.10.d: "The orbital programme has lost its reactor perimeter or Khan's government. Launch is permanently disabled. Recapturing the reactor cannot restore the sequence.\n\nIf the coalition war has begun, it continues until a military outcome. Stopping the weapon saved the cities; it did not decide the fate of the empire."
 ADISCORD_rus_crisis.10.a: "Launch cancelled."
 ADISCORD_rus_crisis.15.t: "Ninety Days to the Strike"
 ADISCORD_rus_crisis.15.d: "The first armies that marched against Khan have not stopped his programme. Ninety days remain before the orbital strike. If the reactor keeps working until the deadline, our cities will also be in the line of fire.\n\nThe governments at war with the empire ask us to march at once. We can enter the common war together with our allies and subjects, or stay out and send only volunteers."
 ADISCORD_rus_crisis.15.a: "March against Khan."
 ADISCORD_rus_crisis.15.b: "Stay out of the war."
 RUS_crisis_second_wave_join_tt: "Enter the war against Khan together with our allies and subjects. If the first wave of the intervention has already been defeated, the war begins anew. The strike deadline does not change."
 RUS_crisis_second_wave_stay_tt: "We do not enter the war. While the coalition war against Khan continues, we may send volunteers under relaxed conditions."
 ADISCORD_rus_crisis.16.t: "The Second Wave"
 ADISCORD_rus_crisis.16.d: "[FROM.GetNameDefCap] enters the war against the empire. Ninety days remain before the programme completes, and new armies are marching on the reactor perimeter while the clock is still running."
 ADISCORD_rus_crisis.16.a: "Hold the perimeter."
 ADISCORD_rus_crisis.17.t: "Foreign Eyes Over the Steppe"
 ADISCORD_rus_crisis.17.rumours.d: "The reactor is discussed more often in neighbouring capitals. Merchants repeat rumours of night trains, Montar newspapers print maps of the reactor belt, and the Timer Chamber asks why Khan needs so many engineers.\n\nFor now these are only rumours. If they become evidence, the neighbours will not wait for Khan to announce his plans himself.\n\nThe rumours now have a copy of a Khanate ledger behind them. A foreign seal on its covering letter proves it has already passed through several embassies. The next preparation will be harder to dismiss as routine civilian work.\n\nA mixed commission of the neighbours has set out for the border behind the letter. The scientists propose to show it the turbines and laboratories, the quartermasters to hide the works underground, the treasury to buy the inspectors' goodwill, and the Black Army simply not to let them past the outposts."
 ADISCORD_rus_crisis.17.observers.d: "The Montar Empire has sent observers to our borders, and its allies exchange reports on every train bound for the reactor. Neighbouring staffs are already drafting campaign plans.\n\nA little more, and their preparations will end without any announcement. Then they, not we, will start the war.\n\nA new letter demands an explanation for the movement of military supplies and access to civilian facilities. The embassy can prepare a reply, but assurances alone will not suffice: the observers will keep counting trains.\n\nThis time the observers have come with a commission's authority and wait for an answer at the gates. The scientists are ready to lead them through the civilian workshops, the quartermasters to hide everything superfluous, the treasury to pay, and the Black Army demands that they be put back across the border."
 ADISCORD_rus_crisis.17.truth:0 "Show the commission part of the truth."
 ADISCORD_rus_crisis.17.hide:0 "Hide the works before it arrives."
 ADISCORD_rus_crisis.17.bribe:0 "Buy the commission's goodwill."
 ADISCORD_rus_crisis.17.expel:0 "Close the gates on the commission."
 ADISCORD_rus_crisis.18.murmur.t: "Murmurs in the Trenches"
 ADISCORD_rus_crisis.18.murmur.d: "The centurions all report the same thing: Black Army soldiers no longer believe the bulletins. Rations have been cut, the wounded take three days to reach the rear, and lost aimaqs are discussed at every campfire. For now it is only talk, but the officers no longer stop it.\n\nHeadquarters can issue double rations from the reserves or demand patience. The next time such a choice may cost more."
 ADISCORD_rus_crisis.18.desertion.t: "Empty Trenches"
 ADISCORD_rus_crisis.18.desertion.d: "At night entire squads leave their positions for their home aimaqs. Militiamen drop their rifles at the crossings, and the centurions have stopped sending lists of the missing to headquarters. The Black Army demands the right to judge deserters on the spot.\n\nWe can set up blocking posts and give the army more power, or send the militia home and keep the core of the army."
 ADISCORD_rus_crisis.18.conspiracy.t: "Conspiracy at Headquarters"
 ADISCORD_rus_crisis.18.conspiracy.d: "The guard intercepted an unsigned note: several commanders discuss who will take the seal if Khan does not live until spring. No names are given, but the handwriting is familiar. The army is no longer sure that Khan will lead it out of this war.\n\nKhan may purge headquarters at the risk of leaving the front without experienced commanders, or hand command to the Black Army and buy its loyalty. If nothing changes, there will be no further warning."
 ADISCORD_rus_crisis.18.rations: "Issue double rations to the front."
 ADISCORD_rus_crisis.18.endure: "Let them endure."
 ADISCORD_rus_crisis.18.barriers: "Set up blocking posts."
 ADISCORD_rus_crisis.18.release: "Send the militia home."
 ADISCORD_rus_crisis.18.purge: "Purge headquarters."
 ADISCORD_rus_crisis.18.yield: "Hand command to the army."
 ADISCORD_rus_crisis.20.t: "Death of the Khan"
 ADISCORD_rus_crisis.20.d: "News arrived from across the front that was first taken for a ruse: Mark Rustan is dead. Some reports speak of a shot at headquarters, others of poison in the field kitchen. Whoever gave the order, the Black Army no longer serves the common state.\n\nThe aimaqs recall their hundreds, garrisons surrender fortresses without a fight, and the reactor perimeter is left without a master. The Last Empire breaks into independent territories as quickly as it was assembled."
 ADISCORD_rus_crisis.20.a: "The empire did not long outlive its Khan."
 RUS_suspicion_warning_tt: "Neighbours' suspicion: §Y[?RUS_suspicion|0]§!/100 £RUS_suspicion_texticon. At §Y100§! £RUS_suspicion_texticon the coalition attacks without its 90-day mobilisation."
 ADISCORD_rus_crisis.1.exposed.d: "The intelligence reports no longer need to be pieced together: the evidence lies on every staff table. Khan is building a reactor-powered orbital system, and its targets include factories, communication hubs and capitals.\n\nThere will be no time to prepare. The Montar Empire, Vald Union, Timer Chamber and Free Republic of Bayrinzh march at once; independent southern and western victors and an eastern hegemon that have finished their wars may join them. Khan is forced to proclaim his state openly. Four hundred and fifty-five days remain before the predicted launch."
 ADISCORD_rus_crisis.2.exposed.d: "The secret could not be kept. The neighbours learned of the programme before Khan could announce it himself, and they did not wait: their armies march without the usual ninety days of mobilisation.\n\nKhan proclaims his state under fire. The reactor still powers the orbital system, and the engineers give the same total of four hundred and fifty-five days. Work continues while even one of the four accessible reactor zones remains in imperial hands."
 RUS_crisis_exposed_warning_tt: "The coalition marches §Yimmediately§!. Launch follows §Y455 days§! after exposure if Khan retains power and reactor access."
 RUS_crisis_strike_caption: "Now I am become Death, the destroyer of worlds.\n- J. Robert Oppenheimer, quoting the Bhagavad Gita"
 RUS_crisis_close_superevent: "Close"
 RUS_crisis_epilogue_caption: "THE LAST SKY\nThe beam is aimed at the heart of the reactor."
 RUS_crisis_watch_epilogue: "Epilogue"
 RUS_crisis_epilogue_next: "Continue"
 RUS_crisis_epilogue_finish: "Finish reading"
 RUS_crisis_epilogue_2_title: "THE LAST ORDER"
 RUS_crisis_epilogue_2_body: "The beam entered the reactor, and for a few moments there were no shadows. Then the shock wave tore through buildings, streets and shelters. Where people had been working, only incandescent wreckage remained. A black column rose above the complex, with white light burning inside it.\n\nWindows went dark across the cities. On the last surviving frequencies, voices pleaded for help, repeated addresses, called out names. They broke off mid-word. Ash settled on water and bread; people carried it into shelters on their clothes and in their hair. Those who escaped the fire did not yet know that the danger had come with them.\n\nThe catastrophe claimed billions of lives. Some died in the fire and beneath the rubble; others did not survive the hunger, disease and cold that followed. Nobody remained to count the dead."
 RUS_crisis_epilogue_3_title: "WORX'S LEGACY"
 RUS_crisis_epilogue_3_body: "Dorian Worx had once invented the zero-point reactor. His drawings held enough power for cities, factories and machines. Now those sheets lay beneath the wreckage, and the inventor's name remained on plates beside dead control panels.\n\nThe reactor explosion unleashed a powerful electromagnetic pulse. Far beyond the fire, instruments went dark, communications failed and equipment stopped. People in surviving shelters turned radio dials and changed batteries. Some still heard other voices. Most heard only static.\n\nThe first survivors emerged with torches. They searched for entrances to buried cellars and called to those who had not escaped. By morning, the torches were going out."
 RUS_crisis_epilogue_4_title: "A WORLD WITHOUT CAPITALS"
 RUS_crisis_epilogue_4_body: "Stelander and Kefreyt were still transmitting orders. In the west and south, borders closed. Officials promised aid and told people to wait. The trains never came. Empty roads stretched behind the refugee columns; ahead stood soldiers who could no longer feed their own families.\n\nStates died piece by piece: distant garrisons, then cities, then capitals. Armed men claimed the wells. A cup of water cost tools, land, freedom. Children were forbidden to approach strangers. Old maps fed the stoves. No border protected anyone now."
 RUS_crisis_epilogue_5_title: "LAND AND OATH"
 RUS_crisis_epilogue_5_body: "Feudal fragmentation took the place of the great states. A former commander held a bridge, a granary owner collected tribute from villages, and a shelter garrison claimed every field as far as the next hill. To live beside a well meant surrendering crops, labour and sons for the lord's war band.\n\nPromises of protection were written on the backs of old orders. Oaths were sworn to those who still had weapons and supplies. Their children inherited the keys to the stores, along with power over everyone who came asking for bread.\n\nEach evening, the settlements counted those returning from the fields. Then they shut their gates. Outside lay the road that had once crossed an entire country."
 RUS_crisis_epilogue_6_title: "THE LAST BUNKER"
 RUS_crisis_epilogue_6_body: "Underground, Khan listened to the ventilation. Generators still ran behind the walls. Sentries changed shifts. Clerks stamped new orders. The doors stayed shut. Even when someone knocked from outside. In time, the knocking stopped.\n\nOne state remained on the map. Its borders were concrete, steel and a reserve of air. Above, people divided the remnants of the world. Below, each morning brought another report of victory. The radio operator called the capitals from the old list. After every name, he waited for a reply. Khan ordered him not to shorten the pauses."
 RUS_crisis_epilogue_7_title: "THE LAST FREQUENCY"
 RUS_crisis_epilogue_7_body: "Inside the bunker, spare valves and fuses were carefully saved. The transmitter received power even when lighting in the living quarters was rationed. Every session began the same way: a call sign, an order to acknowledge, a long pause.\n\nOnce, a human voice broke through the interference. It asked for medicine and gave directions to a river crossing. The operator asked who commanded the district. The stranger did not understand. Contact was lost before anyone learned his name.\n\nThe log read: contact not established. Khan received another list of silent capitals. He rested a finger on one line and ordered another call. Above ground, people were already transmitting different names, but nobody in the bunker could put them on the map."
 RUS_crisis_epilogue_8_title: "SIGNAL LOST"
 RUS_crisis_epilogue_8_body: "Khan lives.\nBeyond the sealed doors lie anarchy, hunger and ash. The Last Empire is buried underground.\n\nThe transmitter is still running.\nThere will be no reply.\n\nEsc opens the game menu."
 RUS_crisis_regional_wars_available_tt: "The final epilogue has not begun."
 ADISCORD_rus_campaign.11.active_project: "A diagram of the reactor complex was placed on Rustan's desk. Corrections covered its margins: a rerouted cable, a reserve generator, a road that could no longer carry a convoy. Behind every note were people still working under the threat of attack.\n\nThe engineers reported that the guidance system was ready. The staff confirmed the garrison deployments. Nobody promised that the perimeter would hold, but everyone knew their positions. The reactor continued to charge the orbital system; the final beam would return to its own core. There was still time before the appointed deadline.\n\nKhan signed the order. Outside, officials argued about repairing a bridge and feeding the workers. Those instructions needed his signature too. Rustan ordered supplies maintained until the last day. After that day, by his calculations, a unified empire would need neither bridge nor chancery."
 ADISCORD_rus_campaign.11.active_project.a: "Continue preparations for the strike."
 RUS_crisis_programme_focus_available_tt: "The orbital programme is active: Khan holds power and at least one reactor zone."
 RUS_crisis_reactor_guard: "Guard of the Last Sky"
 RUS_crisis_reactor_guard_desc: "The garrisons hold their positions and conserve supplies until the orbital programme ends. Defeating the intervention does not release them; disabling the laser or removing Khan ends their duty."
 RUS_crisis_volunteer_mandate: "Volunteers Against Khan"
 RUS_crisis_volunteer_mandate_desc: "This government has not entered the war against Khan but allows volunteers to reach the reactor perimeter. Volunteer limits are relaxed while the coalition war continues."
 ADISCORD_rus_last_sky_plan: "Defend the orbital programme"
 RUS_crisis_launch_clock_active: "Until the orbital strike: §Y[?RUS.days_mission_timeout@RUS_crisis_laser_countdown|0]§! days."
 RUS_crisis_launch_clock_inactive: "The launch countdown is not running."
