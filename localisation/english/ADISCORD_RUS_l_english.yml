 RUS_bunker_laboratory_requirements_tt:0 "Required spare power capacity: 3. Once completed, this level uses 3 power and grants the permanent effects shown below. Only one room can be chosen on this level."
 RUS_bunker_archive_delta:0 "Aimaq Archive"
 RUS_bunker_archive:0 "Level 5: Aimaq Archive"
 RUS_bunker_archive_desc:0 "Treaties, censuses and maps will be kept together, rather than in the chests of influential families. The state needs a memory that no one person can own.\n\nDuration: 21 days. Required spare power capacity: 1. Once completed, this level uses 1 power and grants the permanent effects shown below. Only one room can be chosen on this level.\n$RUS_bunker_contract_tt$\n\nAfter Trained Administrators, the archive adds 15 state-development progress to each paid civil-service training programme."
 RUS_bunker_archive_cost_pp_ok:0 "§Y25§! £political_power_texticon"
 RUS_bunker_archive_cost_pp_low:0 "§R25§! £political_power_texticon"
