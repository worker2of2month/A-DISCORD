 RUS_bunker_excavate_desc:0 "Methodical excavation: geologists guide the working face according to their samples, and supports are installed before the next cartload of rock is removed.\n\nDuration: 70 days. Requires at least 40 structural integrity. On completion: the next level; structural integrity -20. An empty level adds 1% to the surrender limit. Below 40 structural integrity, penalties of -5% military factory output and -5% army organization apply.\n$RUS_bunker_contract_tt$"
