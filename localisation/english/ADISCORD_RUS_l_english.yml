 RUS_bunker_archive_delta:0 "Aimaq Archive"
 RUS_bunker_archive:0 "Level 5: Aimaq Archive"
 RUS_bunker_archive_desc:0 "Treaties, censuses and maps will be kept together, rather than in the chests of influential families. The state needs a memory that no one person can own.\n\nConstruction: §Y28 days§!. One room per level.\nFood upkeep: §Y1§! £supply_texticon per week.\n\nAfter Trained Administrators, an operational archive adds §G+15§! £ADISCORD_country_development_texticon state progress to each paid civil-service training programme.\n\n[GetRUSBunkerForecastarchive]"
