 RUS_bunker_food_convoy:0 "Food Convoy"
 RUS_bunker_food_convoy_desc:0 "Trucks carrying grain, salt and preserved food unload at the upper airlock. Only complete shipments are accepted: the storehouse must have room for the whole delivery.\n\nThe convoy immediately adds §G40§! £supply_texticon (§G60§! after 'Heavy Freight Reserve') for §Y15§! £political_power_texticon and §Y165§! £ADISCORD_economy_treasury_texticon.\n\nEach fitted level consumes 1 food per week; refugees, levies and new states add more mouths. An empty store brings the 'Hunger in the Galleries' spirit (stability §R-20%§!, war support §R-10%§!, army organisation §R-15%§!, military factory output §R-15%§!, research §R-10%§!, §R-0.25§! £political_power_texticon per day). A store at least 75% full (60% after 'A Reserve Between Shifts') means the bunker is well fed: +5% stability and +5% reinforcement rate. Surplus can be sold to the aimaqs. Losing the bunker halts consumption and production; the remaining stockpile is preserved."
 RUS_bunker_food_convoy_available_tt:0 "The bunker is operational and the storehouse has room for the whole delivery: 40 £supply_texticon, or 60 after 'Heavy Freight Reserve'."
 RUS_bunker_food_convoy_tt:0 "Food reserve: §G+40§! £supply_texticon."
 RUS_bunker_food_convoy_large_tt:0 "Food reserve: §G+60§! £supply_texticon."
 RUS_bunker_rations_fed:0 "§GWell fed: +5% stability and reinforcement§!"
 RUS_bunker_food_sale:0 "Sell surplus to the aimaqs"
 RUS_bunker_food_sale_desc:0 "The bunker's stores are not bottomless: whatever does not fit spoils at the airlock. The aimaqs will gladly buy grain and preserves delivered at a fair price instead of by requisition. The sale empties the store and may end the bunker's well-fed state. Repeatable after 30 days."
 RUS_bunker_food_sale_available_tt:0 "The bunker is operational and holds at least 40 £supply_texticon."
 RUS_bunker_food_sale_cost:0 "§Y40§! £supply_texticon"
 RUS_bunker_food_sale_cost_blocked:0 "§R40§! £supply_texticon"
 RUS_bunker_food_sale_cost_tooltip:0 "Requires 40 £supply_texticon in the bunker store."
 RUS_bunker_food_sale_tt:0 "Treasury: §G+100§! £ADISCORD_economy_treasury_texticon."
 RUS_repair_depots_spirit:0 "Repair depots of the belt"
 RUS_repair_depots_spirit_desc:0 "Mobile crews repair machines on the shop floor instead of waiting for parts from the capital. The factories of the industrial belt run more evenly and keep their rhythm longer.\n\n\n\n\n\n £GFX_ADISCORD_industry_banner \n\n\n"
 RUS_strategic_freight_reserve_convoy_tt:0 "The food convoy delivers §G60§! £supply_texticon instead of 40 at the same price."
