 ADISCORD_rus_campaign.36.t:0 "Office Hours"
 ADISCORD_rus_campaign.36.d:0 "I wrapped the receipt in a scarf to keep it dry. They were demanding my husband's tax again. He had died in autumn. The elder knew, and so did the collector, but the new register listed two adults in our household. At the chancery they told me to bring the old register. It had burned before the Khan's men arrived. My son stood beside me, his sleeves pulled over his fingers. I sat outside the door rehearsing explanations. None sounded convincing enough.\n\nMother used to say that before the catastrophe every document had its place. People could travel to another town, write home and receive an answer. Then came the reactor, and 2130, which until her death she called simply 'that year'. Afterwards came news of revolution in Vorkerland. Seals changed, names changed, the armed men changed. We were left with other people's papers demanding grain. Mother taught me to keep them all: you never knew which authority might return.\n\nWhen the corridor fell silent, I thought the office was closing. The clerk stood up. The guard took his hand off his belt. A man I had never seen stood in the doorway, and I did not need to ask who he was. People said the Khan never aged, that underground he could hear every name spoken aloud. A neighbour claimed to have seen him years ago. Later she refused to speak of it. I watched the edge of his sleeve, afraid to raise my eyes.\n\nHe asked why I had come. I stumbled over the word 'husband' and held out the scarf with the paper still inside. The Khan did not take it. The clerk read it aloud, explained the error and began promising punishment for the collector. The Khan interrupted:\n- You count the dead. Who counts the living?\nHe asked how many children I had, who worked, how we fed ourselves. I answered so quickly that a pause seemed enough to make my answers wrong. The clerk opened another ledger.\n\nMy son had been standing by the wall throughout. When the Khan turned, he straightened and hid his hands behind his back, as if caught doing something wrong. The Khan looked at the sleeves that were too long for him. He seemed about to speak, but paused. Then he pointed to the bench:\n- Sit down.\nThe boy looked at the guard. The Khan repeated it more quietly. He moved a folder off the bench himself and waited until my son sat down. I opened my mouth to thank him, but he had turned back to the clerk.\n\nThey ordered the tax corrected. At the exit I pressed the receipt against my chest, and the guard impatiently pointed to the door. I had come to prove my husband was dead. Now the chancery knew how many of us remained, where we lived and what work we could do. Behind me the pen was still scratching. I did not turn around."
 ADISCORD_rus_campaign.36.a:0 "Please do not summon me again."
 ADISCORD_rus_campaign.37.t:0 "Beneath the Old Paint"
 ADISCORD_rus_campaign.37.d:0 "The oldest plan of the bunker bore neither the Khan's seal nor a command room. It showed ventilation shafts, reservoirs and rows of identical rectangles. For a long time I took them for crates. Then I found the note: sleeping places. Whoever had drawn the sheet had tried to fit in as many people as possible, yet left an aisle wide enough for a stretcher. The name in the corner had faded. The dimensions were still legible.\n\nThe construction office cupboard held a logbook from 2130. After the first entries about the reactor catastrophe, it stopped recording the occupations of those arriving. It listed numbers of people, filter conditions, remaining water. Several pages were filled with requests for news of relatives. On one, a duty officer had written: No answer from the surface. Another hand had added the same words below. I ran a finger along the edge. The page had been turned so often that it felt as soft as cloth.\n\nFurther on came sheets bearing new seals. In the years after the catastrophe and the revolution in Vorkerland, commanders changed here, and rooms changed purpose. A former family room became a storeroom, then a guardroom. Old labels were painted over and replaced. Now we were stripping that paint for a cable run, and the word 'distribution' emerged from the wall. What had been distributed was no longer legible. A worker asked whether to leave the lettering. I told him to leave it for now.\n\nI brought only the drawing to the Khan. He listened in silence as I explained the wider staircase. When I mentioned stretchers, he looked up:\n- How many people will you lose if the passage stays as it is?\nI gave an estimate. He demanded an exact figure. I had to explain that it depended on the accident, the shift and where a collapse occurred. The Khan waited until I finished, then ordered the estimate revised. He asked nothing about who had lived here before.\n\nWhen I returned, the worker had his brush ready. The wall needed space for a new room number. I measured the old lettering and copied the dimensions into my notebook, without knowing why. Then I allowed him to paint. Tomorrow people would come here needing light, air and a passage wide enough to use. The plan would bear another seal. I would try to preserve at least the passage."
 ADISCORD_rus_campaign.37.a:0 "Keep the passage wide enough."
 ADISCORD_rus_campaign.38.t:0 "News from Above"
 ADISCORD_rus_campaign.38.d:0 "Through the receiver I hear the sentry hastily getting to his feet. He reports on the gates, the watch, the ammunition. I ask about the weather. He falls silent, and I imagine him looking at his commander: has he missed something, said too much? Then he answers that it is raining. A chair creaks nearby. The sentry starts his report again. I let him finish.\n\nIn 2130 it was still possible to hope that the worst had happened. The reactor was destroyed, our relatives were gone, but I was alive, my brother was alive; if we reached another day, something would remain. I remember that waiting better than the faces. First you wait for news. Then you search for someone who might have seen your loved ones. Then you stop asking because you already recognise the expression that precedes the answer. Two of our family remained. During the revolution in Vorkerland, my brother died too.\n\nThe people above know none of this. To them I have always been the Khan. They pass around stories they would never dare repeat before my guards. Let them. In those stories I never wait for an answer, never arrive too late, never stand outside someone else's door with a useless question. They have invented a convenient past for me. The real one belongs to me alone. No one is left to say the name Mark as it was said at home.\n\nThe sentry is still waiting. In the background someone coughs, then abruptly falls quiet. The morning returns lie before me. One records six who did not return from work; below, the section chief has written: Acceptable losses. I have circled the first word. Let him bring the work orders, the names, the departure time of every shift. Let him show where I accepted this. He has already sent a revised total, but I returned the paper. Six people could not disappear between two columns.\n\nSometimes a child among the petitioners hides his hands in his sleeves and waits for permission to sit. I notice him before I can decide why I am looking. I want to seat him, feed him, remove the adults before whom he stands so carefully straight. For a few moments I know what frightens him without any report. Then I have to mind my voice: my bark would make him flinch just as anyone else's would. Even after taking the bread, he remains standing. I move to the window so that he will finally begin to eat.\n\nThe bunker has passed its trial. The pumps are running; the lower floors are dry. Beneath the returns lies a request from several families for leave to join their relatives before winter. The clerk has attached a list: two mechanics, a medic, the rest employed in the stores. I push the sheet aside. First the lower level must be finished. Then people will be needed to fit it out. In the margin I write briefly: Do not resubmit. Summon when work is complete. I add no date.\n\n- Carry on, I say.\nThe reply is immediate. I hold the receiver to my ear for a few more seconds. There will be no familiar voice at the other end."
 ADISCORD_rus_campaign.38.a:0 "Carry on."
 ADISCORD_rus_campaign.39.t:0 "Beyond the Perimeter"
 ADISCORD_rus_campaign.39.d:0 "The first report arrived before the changing of the guard. Passes were no longer checked on the old road, abandoned vehicles stood beside the barriers, and the border telephone answered in the voice of a man who did not know the old call signs. Then other posts began to speak. The perimeter had not been breached in a single battle: the service that had kept it sealed had broken into separate garrisons, each deciding whom to let through and whose orders to obey.\n\nMaps of the western belt were spread across the table at the Khan's headquarters. Beneath the hatching that had marked forbidden land for years lay roads, warehouses and inhabited settlements. Each had its own councils, commanders and armed men. The Dirty Zone was no empty space to be occupied with one order, but an entire region where power was already being contested. Its roads now led to the Khan's Land as well.\n\nRustan listened to the reports for a long time without looking away from the map. Then he drew the list of border companies towards him and ordered the aimaq representatives assembled. While his neighbours argued over who could speak for the newly opened lands, the Khan intended to press claims of his own. He still had to decide which roads to take first, and whether he had the strength to hold what lay beyond them."
 ADISCORD_rus_campaign.39.a:0 "It is time to look beyond our outposts."
 RUS_dirty_zone_focuses_unlocked_tt:0 "A new national focus branch for expansion into the Dirty Zone is revealed, beginning with §Y$RUS_claim_the_opened_zone$§!, followed by §Y$RUS_drive_starolesye_back$§! and §Y$RUS_press_the_closed_zone$§!. Previous focuses and the conditions for each stage remain required. The relevant focuses unlock campaigns, which are launched through separate decisions."
