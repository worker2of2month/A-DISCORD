 ADISCORD_rus_campaign.12.t:0 "Files on the Common Table"
 ADISCORD_rus_campaign.12.d:0 "The new administrators began their first meeting with a box of old files: receipts for a bridge never built, two deeds to one plot and a request for a water pump passed between districts for three years. The scientists expected a discussion of instruments. The elders expected taxes. Rustan ordered them to start with the pump.\n\nBy evening an official had been assigned, a deadline recorded and copies sent to the district and the archive. The council was far from unanimous, but disputes now had a subject and a record against which performance could be judged. An elder from a distant district asked for another copy for the people who had collected money for the pump. The scribe reached for a clean sheet; once, a petitioner would simply have been shown the door."
 ADISCORD_rus_campaign.12.a:0 "Let the signature be followed by work."
 ADISCORD_rus_campaign.13.t:0 "A Signed Order"
 ADISCORD_rus_campaign.13.d:0 "The commanders brought maps placing neighbouring formations in different positions at the same hour. Every staff had an explanation: a late messenger, a missing ledger, another office responsible. The Khan heard them out, then ordered the pre-battle orders laid side by side.\n\nThe new procedure did not forbid initiative. It required a task to name its recipient, its supplies and the officer responsible for cancelling it. Military governors kept authority in their districts, but their signatures would remain in the common command register. The youngest commander lingered beside the register: his report could not account for everyone who had returned. Rustan ordered him to wait for the roll call. The line remained blank until morning."
 ADISCORD_rus_campaign.13.a:0 "Authority requires accountability."
