 RUS_bunker_metric_depth:0 "LEVELS\n§Y[?RUS_bunker_depth|0]/[?RUS_bunker_depth_limit|0]§! excavated"
 RUS_bunker_metric_power_tt:0 "§YComplex Power§!\nIn use: §Y[?RUS_bunker_used_power|0]§! £energy_consumption_texticon. Total: §Y[?RUS_bunker_power|0]§!. Available: §Y[?RUS_bunker_free_power|0]§!.\n\nInstallation and upgrades require available power. The two generator expansions add 4 each; the reserve turbine adds another 2. Dismantling a room frees up the power it uses.\nSupply contracts reserve: §Y[?RUS_bunker_energy_export_power|0]§! £energy_consumption_texticon. Included in used capacity and released after 90 days."
 RUS_bunker_metric_food_tt:0 "§YFood: [?RUS_bunker_food|0]/[?RUS_bunker_food_capacity|0]§! £supply_texticon\n[GetRUSBunkerFoodState]\nWeekly: §G+[?RUS_bunker_food_output|0]§! supplied, §R-[?RUS_bunker_food_use|0]§! consumed. Balance: [?RUS_bunker_food_balance|=+0] £supply_texticon.\n\nWell fed from §Y[?RUS_bunker_food_fed_line|0]§! £supply_texticon: §G+5%§! stability and reinforcement rate.\nWith an empty store: [GetRUSBunkerHungerPenalty]\n\nConsumption: §Y1§! £supply_texticon per room, plus §Y[?RUS_bunker_mouths|0]§! for refugees, levies and surface states. Every two months, [GetRUSBunkerSpoilageRate] of stocks above §Y75%§! capacity spoil; last loss: §R[?RUS_bunker_food_spoiled|0]§! £supply_texticon.\nConvoys refill stocks immediately. Water purification and granaries provide steady supplies. Overflow from a full store is lost."
 RUS_bunker_spoilage_standard:0 "§Y10%§!"
 RUS_bunker_spoilage_reduced:0 "§Y5%§!"
 RUS_bunker_hunger_penalty_standard:0 "stability §R-20%§!, war support §R-10%§!, army organisation and military factory output §R-15%§!, research §R-10%§!, §R-0.25§! £political_power_texticon per day."
 RUS_bunker_hunger_penalty_rationed:0 "stability §R-10%§!, war support, army organisation, military factory output and research §R-5%§!, §R-0.10§! £political_power_texticon per day."
 RUS_bunker_metric_integrity_tt:0 "§YStructural integrity: [?RUS_bunker_integrity|0]/100§! £fort_texticon\n[GetRUSBunkerIntegrityEffect]\n\nOn completion:\n- Normal excavation: §R-20§! £fort_texticon. Requires at least §Y40§! integrity.\n- Accelerated excavation: §R-[?RUS_bunker_rush_damage|0]§! £fort_texticon. Requires at least [GetRUSBunkerRushMinimum].\n- Reinforcement: §G+[?RUS_bunker_reinforce_amount|0]§! £fort_texticon, capped at §Y100§!. Available at §Y60§! or below.\n\nBelow §R40§!: §R-5%§! military factory output and army organisation. Waiting does not consume integrity."
 RUS_bunker_rush_minimum_standard:0 "§Y55§!"
 RUS_bunker_rush_minimum_trained:0 "§Y40§!"
 RUS_bunker_metric_depth_tt:0 "§YComplex Readiness§!\nRooms fitted: §Y[?RUS_bunker_fitted|0]§!. Levels excavated: §Y[?RUS_bunker_depth|0]§!. Authorised depth: §Y[?RUS_bunker_depth_limit|0]§!.\n\n1. Excavate a new level.\n2. Click its image.\n3. Choose one of the two rooms.\n4. Upgrade the completed room.\n\nExcavation and installation are paid for separately. Each empty level grants +1% surrender limit."
 RUS_bunker_queue_ui_tt:0 "§YConstruction Queue§!\n[GetRUSBunkerWork]\nOrder: [GetRUSBunkerProjectName].\n\nOnly one paid project can be carried out at a time. Selecting another level does not cancel the work. The time remaining is shown on the active decision below. If the complex is lost, the country is subjugated or capitulates, or the legitimate government falls, an unfinished order is cancelled with a full refund. A lawful transfer of power to Oskol or Niva does not cancel the order."
 RUS_bunker_status_ui_tt:0 "§YUnderground Capital Status§!\n[GetRUSBunkerStatus]\n[GetRUSBunkerCondition]\n[GetRUSBunkerFoodState]\n\nIntegrity below §R40§!: §R-5%§! military factory output and army organisation.\nWith an empty store: [GetRUSBunkerHungerPenalty]\n\nThe complex operates while the legitimate government rules an independent country and owns and controls [66.GetName]. Losing access preserves the layout and food stocks; bonuses, food production and consumption are suspended."
 RUS_bunker_excavate_button_label:0 "[GetRUSBunkerNextFloor]"
 RUS_bunker_excavate_ui_tt:0 "§YExcavate the Next Level§!\nCost: [GetRUSBunker1pp]  [GetRUSBunker1cash]  [GetRUSBunker1equipment]\nDuration: §Y70 days§!\n\nResult: §G+1§! empty level, §G+1%§! surrender limit; integrity §R-20§! £fort_texticon. Build its room separately.\nRequires an operational complex, a free crew, integrity of at least §Y40§! and depth below the authorised limit. Cancellation refunds the full payment.\n\n[GetRUSBunkerForecastexcavate]"
 RUS_bunker_ui_rock:0 "Not excavated"
 RUS_bunker_ui_empty:0 "Empty level"
 RUS_bunker_queue_empty:0 "Construction crew available"
 RUS_entrenched_reserves:0 "Prepared Lines"
 RUS_entrenched_reserves_desc:0 "Positional doctrine requires ground chosen in advance, stores, and paid engineering work. The defensive programme will turn the state's resources into a prepared line. Commanders will receive a specific line to prepare instead of an order to hold at any cost."
 RUS_fortress_engineers:0 "Fortified District Engineers"
 RUS_fortress_engineers_desc:0 "Earthworks do not end with the first trench. We will train engineers to maintain fortifications, disperse stores, and adapt shelters to the terrain. Training equipment will enter the engineering service's active stockpile."
 RUS_railway_coverage:0 "Reserves Behind the Second Line"
 RUS_railway_coverage_desc:0 "A line is held by more than its garrison. A separate locomotive fleet will bring reinforcements and ammunition from the country's interior."
 RUS_mobile_supply_columns:0 "The Column Follows the Army"
 RUS_mobile_supply_columns_desc:0 "A mobile formation is useless if its fuel trucks and mechanics remain at its former headquarters. The mobile programme will bring the preparation of transport, supply, and commanders into a funded cycle. The general staff will be able to prepare the movement of the whole column, not just its vanguard."
 RUS_motor_pool_dispatch:0 "Motor Pool Dispatchers"
 RUS_motor_pool_dispatch_desc:0 "Every working vehicle must have an assignment and a relief driver. The dispatch service will separate the training, repair, and active fleets, and the state will provide its first additional batch of transport. The trucks can support supply operations or equip the troops. A unified transport schedule will reduce the army's demand for supplies."
 RUS_combined_arms_trials:0 "Mobile Repair Teams"
 RUS_combined_arms_trials_desc:0 "An offensive's pace is limited not by its fastest truck, but by the time needed to repair the last one. We will test field workshops alongside infantry and artillery. Two research programmes will turn successful solutions into standard equipment for support units."
 RUS_local_service_committees:0 "Local Works Committees"
 RUS_local_service_committees_desc:0 "The council of aimaqs acquires meaning when residents see the results of their decisions. Its first task will be paid work on the capital's transport hub, on which deliveries to the aimaqs depend."
 RUS_assembly_budget:0 "The Council's Treasury"
 RUS_assembly_budget_desc:0 "Local self-government without funding becomes an argument over other people's promises. The council will receive an initial fund for its programmes. The money will enter the common treasury, and the Khan must decide which district receives work first."
 RUS_assembly_budget_tt:0 "Treasury: §G+300§! £ADISCORD_economy_treasury_texticon. Council public works cost §Y15§! £political_power_texticon instead of §Y25§! £political_power_texticon."
 RUS_single_supply_register_treasury_tt:0 "Treasury: §G+100§! £ADISCORD_economy_treasury_texticon."
 RUS_civil_service_society_bonus_tt:0 "Train District Officials additionally grants §G+15§! £ADISCORD_country_development_texticon society development progress."
 RUS_civil_service_state_bonus_tt:0 "Train District Officials additionally grants §G+15§! £ADISCORD_country_development_texticon state development progress."
 RUS_aimaq_public_works_cost:0 "[GetRUSAimaqPublicWorksPP]; [GetRUSBunker15cash]; [GetRUSBunker15equipment]"
 RUS_aimaq_public_works_cost_blocked:0 "[GetRUSAimaqPublicWorksPP]; [GetRUSBunker15cash]; [GetRUSBunker15equipment]"
 RUS_aimaq_public_works_cost_tooltip:0 "[GetRUSAimaqPublicWorksPP]; [GetRUSBunker15cash]; [GetRUSBunker15equipment]"
 RUS_regional_self_help:0 "District Medical Cooperatives"
 RUS_regional_self_help_desc:0 "The aimaqs can maintain their own medical services if they receive the knowledge and tools. The cooperatives will combine aid to families with the preparation of field stations. The centre will provide equipment and open a research course in support services."
 RUS_inspection_chamber:0 "Construction Audit Chamber"
 RUS_inspection_chamber_desc:0 "The Khan's Chancery must know which buildings stand on the ground and which exist only in its ledgers. Inspectors will compare the reports with the districts' needs. Once the audit is complete, the government will be able to fund military workshops in the capital district. An additional site will be reserved in advance for the first order."
 RUS_single_supply_register:0 "Unified Supply Register"
 RUS_single_supply_register_desc:0 "Fragmented procurement overpays middlemen and leaves builders without tools. We will bring the contracts into one ledger, return unspent funds to the treasury, and transfer the recorded stocks to the engineering service. The register must pay for real work, not more registers."
 RUS_provincial_commissioners:0 "Road Service Commissioners"
 RUS_provincial_commissioners_desc:0 "The road belongs to every department, which is why none has ever been responsible for it. The Chancery will appoint commissioners to connect district depots with the aimaq capitals. Their vehicle fleet will become available to the state supply system."
 RUS_surface_contracts:0 "Invest in the Day Shift"
 RUS_surface_contracts_desc:0 "The ruined workshops must work in daylight again. The surface development policy will channel substantial paid orders into conventional industry."
 RUS_open_freight_exchange:0 "Open Freight Exchange"
 RUS_open_freight_exchange_desc:0 "A new factory must receive raw materials and send its products to the customer. The freight exchange will coordinate major enterprises' schedules with the transport reserve actually available. A state allocation of locomotives and vehicles will handle the first round of shipments."
 RUS_underground_fund:0 "Underground Self-Sufficiency Fund"
 RUS_underground_fund_desc:0 "A shelter wholly dependent on daily deliveries from the surface remains at the mercy of the first siege. The underground fund will finance self-sufficient supplies for the complex."
 RUS_autonomous_workshops:0 "Self-Sufficient Workshop Service"
 RUS_autonomous_workshops_desc:0 "Self-sufficiency needs its own mechanics and spare power, not merely a closed door. The workshops will receive additional power, and the storerooms will gain reserve space."
 RUS_bunker_layer_service_school:0 "A Crew for Every Level"
 RUS_bunker_layer_service_school_desc:0 "An operational complex needs a permanent engineering service. We will train a dedicated crew and give it the equipment for installation and modernization. The training programme lays the groundwork for support technology research."
 RUS_bunker_reserve_shaft:0 "Reserve Power Shaft"
 RUS_bunker_reserve_shaft_desc:0 "While the tunnellers work deeper underground, the power engineers will lay an independent service line."
 RUS_bunker_water_recycling:0 "Water Recycling Circuit"
 RUS_bunker_water_recycling_desc:0 "Water feeds not only the pipes in the living quarters, but food production as well. An additional purification stage will return some of that consumption to circulation. It will increase weekly food output while the complex is operational and help feed the deeper levels."
 RUS_bunker_contingency_reservoir:0 "A Reserve Between Shifts"
 RUS_bunker_contingency_reservoir_desc:0 "Even a working production level sometimes shuts down. We will build additional storerooms and deliver the first batch of long-life supplies. The reserve will give the residents time to wait for repairs, and the increased capacity will remain after the last rations have been consumed."
 RUS_autonomous_workshops_tt:0 "Bunker power capacity: §G+2§! £energy_consumption_texticon. Food reserve capacity: §G+40§! £supply_texticon."
 RUS_bunker_reserve_shaft_tt:0 "Bunker power: §G+2§! £energy_consumption_texticon. One more energy contract can be signed."
 RUS_bunker_airlocks_tt:0 "Vault integrity: §G+20§! £fort_texticon at once. 'Reinforce the Vaults' restores §G60§! £fort_texticon instead of §Y40§!."
 RUS_bunker_layer_service_school_tt:0 "Rushed excavation removes §R20§! £fort_texticon integrity instead of §R35§! and is available from §Y40§! integrity instead of §Y55§!."
 RUS_bunker_utilities_rooms_tt:0 "Bunker System, second level: with water treatment §G-5%§! attrition, with the signals hub §G+5%§! planning speed."
 RUS_bunker_working_heart_rooms_tt:0 "Bunker System, third level: with the workshop §G+5%§! military factory output, with the granary §G-3%§! consumer goods."
 RUS_bunker_science_wing_rooms_tt:0 "Bunker System, fourth level: with the clinic §G+5%§! casualty trickleback, with the laboratory §G+5%§! research speed."
 RUS_bunker_memory_vault_rooms_tt:0 "Bunker System, fifth level: with the archive §G+0.10§! £political_power_texticon per day, with the command post §G+5%§! maximum planning."
 RUS_bunker_silence_trial:0 "Trial by Silence"
 RUS_bunker_silence_trial_desc:0 "The commission tests whether the bunker can live without help from above. For thirty days the store must not run empty and the vaults must not weaken below §Y60§! £fort_texticon."
 RUS_bunker_silence_trial_start_tt:0 "The §YTrial by Silence§! begins for §Y30§! days. If the store never runs empty and integrity ends at §Y60§! £fort_texticon or more: §G+5%§! stability, §G+50§! £political_power_texticon, §G+20§! £supply_texticon to capacity and stock. Otherwise §R-5%§! stability."
 RUS_bunker_silence_trial_outcome_tt:0 "Trial result: on success §G+5%§! stability, §G+50§! £political_power_texticon and §G+20§! £supply_texticon to capacity and stock; on failure §R-5%§! stability."
 RUS_bunker_water_recycling_tt:0 "Food production: §G+2§! £supply_texticon per week."
 RUS_bunker_contingency_reservoir_tt:0 "Food reserve capacity: §G+60§! £supply_texticon. Stockpile: §G+60§! £supply_texticon within the new capacity. The bunker is well fed from §Y60%§! of capacity instead of §Y75%§!."
 RUS_development_programmes:0 "The Khan's State Programmes"
 RUS_development_programmes_desc:0 "The chosen policy determines which projects the government can fund. Orders are fulfilled upon payment, and repeat orders become available after the stated interval. Buildings appear in the capital region of [66.GetName]; equipment is deducted from the army's current stockpile. Training programmes grant lasting national progress and do not require control of the capital state. Level increases are processed at the next monthly update."
 RUS_defensive_preparation:0 "Prepare Defensive Lines"
 RUS_defensive_preparation_desc:0 "Engineering teams will prepare positions and disperse supplies against a possible attack. The preparations last 120 days; another cycle can be funded once they expire."
 RUS_defensive_preparation_available_tt:0 "The legitimate government rules an independent country and controls the capital complex; the fortified lines programme is unlocked and the previous preparations have ended."
 RUS_defensive_preparation_spirit:0 "Prepared Defensive Lines"
 RUS_defensive_preparation_spirit_desc:0 "Engineering teams mark out fallback positions, inspect the approaches, and build shelters for the first-echelon units. Delivered tools and work assigned in advance allow troops to prepare better positions and hold the line with greater confidence. The funded programme lasts 120 days.\n\n\n\n\n\n £GFX_RUS_black_army_banner \n\n\n"
 RUS_mobile_preparation:0 "Prepare Marching Columns"
 RUS_mobile_preparation_desc:0 "Repair teams and mobile depots will prepare supplies for the offensive. The preparations last 120 days; another cycle can be funded once they expire."
 RUS_mobile_preparation_available_tt:0 "The legitimate government rules an independent country and controls the capital complex; the mobile supply programme is unlocked and the previous preparations have ended."
 RUS_mobile_preparation_spirit:0 "Prepared Marching Columns"
 RUS_mobile_preparation_spirit_desc:0 "Supply trains receive their routes, repair teams their assembly points, and intermediate depots their issue quotas. A column can keep moving while the rear brings up supplies and returns equipment to service. The prepared network speeds troop movements and reduces supply consumption for 120 days.\n\n\n\n\n\n £GFX_RUS_black_army_banner \n\n\n"
 RUS_aimaq_public_works:0 "Fund Roads in the Capital Aimaq"
 RUS_aimaq_public_works_desc:0 "Local committees will assemble construction cooperatives and provide them with tools. The country gains +5% construction speed for 180 days; infrastructure in the region of [66.GetName] increases by one level if it has not yet reached 5. When the roads are fully developed, the cooperatives continue working on other building sites. The benefits are granted upon payment; another order becomes available when the cooperatives finish their service."
 RUS_aimaq_public_works_available_tt:0 "The legitimate government rules an independent country and fully owns and controls the region of [66.GetName]; local committees are unlocked and the previous construction programme has ended."
 RUS_chancery_reconstruction:0 "Fund the Capital Arsenal Expansion"
 RUS_chancery_reconstruction_desc:0 "The Inspection Chamber will pay to commission a new weapons production line in the region of [66.GetName]. One military factory appears immediately upon payment and occupies a normal building slot. Another order becomes available after 180 days."
 RUS_chancery_reconstruction_available_tt:0 "The legitimate government rules an independent country and fully owns and controls the region of [66.GetName]; the Inspection Chamber is unlocked and the state has a free military factory slot."
 RUS_surface_industrial_contract:0 "Fund a Surface Factory"
 RUS_surface_industrial_contract_desc:0 "The surface industrial contract commissions a civilian factory in the region of [66.GetName] immediately upon payment. The enterprise occupies a normal building slot. Another contract can be signed after 180 days."
 RUS_surface_industrial_contract_available_tt:0 "The legitimate government rules an independent country and fully owns and controls the region of [66.GetName]; the surface industrial policy has been chosen and the state has a free civilian factory slot."
 RUS_subterranean_supply_contract:0 "Fund a Self-Sufficient Food Circuit"
 RUS_subterranean_supply_contract_desc:0 "The Underground Fund will purchase equipment for processing and storing food. Each of the two circuits increases permanent output and storage capacity. Installation takes place upon payment; the second contract becomes available after 60 days. Built: [?RUS_bunker_autonomy_contracts|0]/2."
 RUS_subterranean_supply_contract_available_tt:0 "The legitimate government rules an independent country and controls the capital complex; the Underground Fund has been chosen and fewer than two self-sufficient circuits have been funded."
 RUS_subterranean_supply_reward_tt:0 "Permanent output: §G+1§! £supply_texticon per week. Storage capacity: §G+20§! £supply_texticon. The equipment is retained if the complex is temporarily lost; production runs only while the bunker is operational."
 RUS_public_campaigns:0 "The Khan's Voice"
 RUS_public_campaigns_desc:0 "Radio, printed leaflets, and aimaq assemblies can support different tasks of state.\n\nFree shared campaign slots: §Y[?ADISCORD_available_campaign_slots|0]§!. Each address occupies one slot for its entire duration. Two editorial offices allow two addresses to run simultaneously.\n\nIf the Khan loses his independent authority, active addresses end; the slot is freed, but political power spent on a campaign already begun is not refunded. The wartime campaign 'The Last Order' also ends when peace returns."
 RUS_public_campaign_slot_available_tt:0 "A campaign slot is available: §Y[?ADISCORD_available_campaign_slots|0]§!. The first comes from $RUS_khan_broadcast_service$ and the second from $RUS_parallel_public_addresses$."
 RUS_public_campaign_first_slot_tt:0 "One editorial office: §G+1§! slot in the shared pool of paid campaigns."
 RUS_public_campaign_second_slot_tt:0 "Second editorial office: another §G+1§! slot in the shared pool of paid campaigns."
 RUS_campaign_voice_of_the_aimaqs:0 "One Voice for All Aimaqs"
 RUS_campaign_voice_of_the_aimaqs_desc:0 "The capital's announcer will hand the airwaves over to the elders of distant aimaqs. Their voices will tell of neighbours, road repairs, and settled disputes: the state must be heard at times other than when it demands obedience."
 RUS_campaign_bread_and_shelter:0 "Bread and Shelter for Every Family"
 RUS_campaign_bread_and_shelter_desc:0 "Reports on supplies, queues, and the work of the shelters will take the place of empty promises. Families must know why they have to save today and who is responsible for tomorrow's delivery. The campaign helps organize the home front; food deliveries to the bunker still require a separate order."
 RUS_campaign_rifles_protect_home:0 "This Rifle Protects Your Home"
 RUS_campaign_rifles_protect_home_desc:0 "Factory noticeboards will display letters from the units that received their weapons. A worker's name, a rifle's serial number, and a soldier's thanks will connect a long shift to the defence of a particular home."
 RUS_campaign_the_khan_keeps_his_word:0 "The Government Answers for Its Word"
 RUS_campaign_the_khan_keeps_his_word_desc:0 "The editorial office will read out fulfilled decisions alongside the names of those responsible. Every grand promise will acquire a date, a place, and a verifiable result: order rests on trust in the ruler's word."
 RUS_campaign_surface_trade:0 "Open Roads, Working Workshops"
 RUS_campaign_surface_trade_desc:0 "Trade news, contractors' announcements, and reports of new construction will bring movement back to the surface. A caravan needs a buyer, a workshop needs an order, and a construction brigade needs confidence that its materials will arrive."
 RUS_campaign_last_order:0 "The Last Order: Hold Your Home"
 RUS_campaign_last_order_desc:0 "During war, addresses by frontline soldiers and the Khan's direct order will sustain the units' morale. This campaign runs only while the country is at war. When peace returns, it ends and frees its slot; the political power spent is not refunded."
 RUS_khan_broadcast_service:0 "The Capital's Voice in Every Aimaq"
 RUS_khan_broadcast_service_desc:0 "Rumour reaches a distant aimaq faster than an official order. The radio service will connect the capital's editorial office to district loudspeakers, while leaflets carrying the addresses will reach those without receivers. The first editorial shift runs campaigns on aimaq unity and supply."
 RUS_parallel_public_addresses:0 "Two Editorial Offices, One Broadcast"
 RUS_parallel_public_addresses_desc:0 "The front needs one message, the families in the rear another. A second editorial office and its own printing shift will allow two different addresses to run simultaneously. The Khan expands the service's capabilities, while the government will decide which promises go out over the airwaves."
 RUS_foreign_press_bureau:0 "Foreign Press Bureau"
 RUS_foreign_press_bureau_desc:0 "Foreign correspondents will write about the steppe regardless. Better that they write about what they are shown: a bureau attached to the broadcast service will issue passes, guides and ready-made reports on peaceful workshops. The scientists will decide what the guests may see."
 RUS_quiet_perimeter:0 "The Quiet Perimeter"
 RUS_quiet_perimeter_desc:0 "Fewer foreign eyes at the reactor mean fewer questions. The Black Army will close the approaches to the reactor belt, clear surplus columns from the roads and admit only its own people to the works. The guards' rations will pay for the silence."
 RUS_good_neighbour_charter:0 "Charter of Good Neighbourliness"
 RUS_good_neighbour_charter_desc:0 "The Khan will sign a border charter and invite the neighbours to inspect the outposts alongside his scribes. A joint commission will not dispel every suspicion, but each of its tours takes one more argument for war away from the neighbouring staffs."
 RUS_public_works_spirit:0 "Public Works Cooperatives"
 RUS_public_works_spirit_desc:0 "The communities send carpenters, masons, and carters to the cooperatives. The treasury pays for tools and labour, while local craftsmen share their experience with neighbouring brigades. Coordinated deliveries and a steady workforce speed construction throughout the country; the programme lasts 180 days."
 RUS_black_army_bookmark:0 "$RUS_black_army$"
 RUS_black_army_bookmark_desc:0 "$RUS_black_army_desc$"
 RUS_bunker_complex_bookmark:0 "$RUS_bunker_complex$"
 RUS_bunker_complex_bookmark_desc:0 "$RUS_bunker_complex_desc$"
 RUS_black_army:0 "Black Army"
 RUS_black_army_desc:0 "Beneath the black banners gather detachments that only yesterday obeyed different elders. The men bring their own weapons, know their neighbours in the ranks, and are ready to defend their native aimaq. Beyond its borders, the differences in their rules, training, and understanding of duty become clear.\n\nThe Black Army must learn to fight as a single force. Regimental ledgers, a trained reserve, and common military service bind the war bands to headquarters; the chosen doctrine determines whether they hold fortified lines or advance in mobile columns. As the army grows, its command gains ever more grounds to demand a voice of its own in the country's future.\n\n\n\n\n\n £GFX_RUS_black_army_banner \n\n\n"
 RUS_black_army_state_tt:0 "Organization: §Y[GetRUSArmyOrganization]§!\nDoctrine: §Y[GetRUSArmyDoctrine]§!\nThe Black Army receives §G+5%§! attack, while military focuses and the Black Army branch change the spirit's other parameters. Room bonuses are displayed separately under 'Bunker System'. Temporary troop preparations remain in effect until their duration ends. The influence of the scientists and the Black Army is shown in the balance of power."
 RUS_bunker_system_state_tt:0 "[GetRUSBunkerStatus]\nFitted levels: §Y[?RUS_bunker_fitted|0]/5§!; integrity: §Y[?RUS_bunker_integrity|0]/100§! £fort_texticon\nPower: §Y[?RUS_bunker_used_power|0]/[?RUS_bunker_power|0]§! £energy_consumption_texticon; stockpile: §Y[?RUS_bunker_food|0]/[?RUS_bunker_food_capacity|0]§! £supply_texticon\nUnderground market and generator rent: §G+[?RUS_bunker_income|0]§! £ADISCORD_economy_treasury_texticon per month (§Y12§! plus §Y3§! per fitted level); paid to the treasury in full, without budget modifiers.\nBuilding and upgrading rooms changes this spirit. Army reforms are retained independently of the complex."
 RUS_army_doctrine_patient:0 "Patient Warfare"
 RUS_army_doctrine_swift:0 "Mobile Columns"
 RUS_army_doctrine_undecided:0 "Undecided"
 RUS_army_organization_regular:0 "Common Military Service"
 RUS_army_organization_reserves:0 "Trained Reserve"
 RUS_army_organization_registers:0 "Unified Unit Rolls"
 RUS_army_organization_hosts:0 "Aimaq Detachments"
 RUS_bunker_depth_2_tt:0 "Allows excavation down to the second level. Excavation and fitting out are paid for separately."
 RUS_army_organization_delta:0 "Black Army Modification"
 RUS_army_empire_delta:0 "Black Army Modification"
 RUS_state_balance:0 "Scientists - Black Army"
 RUS_state_balance_category:0 "Scientists and the Black Army"
 RUS_state_balance_category_desc:0 "Two forces argue beneath the ground. The §YBlack Army§! holds the gates and the front and demands men, rations and a single command. The §YScientists§! keep the light, the water and the laboratories without which the underground country will not survive the winter. Both have sworn to the Khan: the Black Army is led by $RUS_black_army_leader$, the scientists by $RUS_scientists_leader$.\n\nBlack Army support: §Y[?RUS_black_army_support|%0]§!\nScientist support: §Y[?RUS_scientists_support|%0]§!\n\n[GetRUSSuspicionStatus][GetRUSMoraleStatus]"
 RUS_state_balance_measures_category:0 "Balance Measures"
 RUS_favour_shock_fist:0 "Rustan's Shock Fist"
 RUS_favour_shock_fist_desc:0 "Rustan will put his best companies under the Khan's general order and lead the breakthrough himself. The Black Army will grant the request, but it will remember that its commander charged again for someone else's politics."
 RUS_favour_black_army_musters:0 "Black Army Musters"
 RUS_favour_black_army_musters_desc:0 "The Black Army's muster points will open their rolls: reservists the army kept for itself will pass into the general draft. The commanders will obey, but they will count every man they give up."
 RUS_favour_guard_instructors:0 "Guard Instructors"
 RUS_favour_guard_instructors_desc:0 "Guard veterans will leave their units for a while and serve as instructors across the regiments. The army grows more experienced, and the Black Army more resentful: its best men are used as teachers."
 RUS_favour_night_shifts:0 "Night Shifts in the Laboratories"
 RUS_favour_night_shifts_desc:0 "The scientists will work two shifts if the Khan does not ask how much longer they can bear it. Research speeds up, and the laboratories' exhaustion weighs on their view of the government."
 RUS_favour_prototypes:0 "Prototypes"
 RUS_favour_prototypes_desc:0 "The laboratories will hand their unfinished machine and instrument prototypes to the workshops. The factories receive ready solutions, and the scientists feel their work was taken halfway through."
 RUS_favour_reactor_current:0 "Reactor Current for the Factories"
 RUS_favour_reactor_current_desc:0 "The scientists will switch part of the reactor current from the laboratories to the factory lines. The machines run faster, the experiments wait, and the scientists will not forget it."
 RUS_favour_army_20_cost:0 "§Y20%§! Black Army support"
 RUS_favour_army_20_cost_blocked:0 "§R20%§! Black Army support"
 RUS_favour_army_20_cost_tooltip:0 "Requires at least §Y20%§! Black Army support."
 RUS_favour_army_20_tt:0 "Black army support: §R-20%§!. Below 50% the faction stops granting £political_power_texticon and pulling the balance its way."
 RUS_favour_army_15_cost:0 "§Y15%§! Black Army support"
 RUS_favour_army_15_cost_blocked:0 "§R15%§! Black Army support"
 RUS_favour_army_15_cost_tooltip:0 "Requires at least §Y15%§! Black Army support."
 RUS_favour_army_15_tt:0 "Black army support: §R-15%§!. Below 50% the faction stops granting £political_power_texticon and pulling the balance its way."
 RUS_favour_science_20_cost:0 "§Y20%§! scientists support"
 RUS_favour_science_20_cost_blocked:0 "§R20%§! scientists support"
 RUS_favour_science_20_cost_tooltip:0 "Requires at least §Y20%§! scientists support."
 RUS_favour_science_20_tt:0 "Scientists support: §R-20%§!. Below 50% the faction stops granting £political_power_texticon and pulling the balance its way."
 RUS_favour_science_15_cost:0 "§Y15%§! scientists support"
 RUS_favour_science_15_cost_blocked:0 "§R15%§! scientists support"
 RUS_favour_science_15_cost_tooltip:0 "Requires at least §Y15%§! scientists support."
 RUS_favour_science_15_tt:0 "Scientists support: §R-15%§!. Below 50% the faction stops granting £political_power_texticon and pulling the balance its way."
 RUS_state_balance_compromise:0 "Oath of both forces"
 RUS_state_balance_government_tt:0 "Mark Rustan rules; the country is independent, has not capitulated and the empire has not dissolved."
 RUS_bop_relief:0 "Extra rations for the science shifts"
 RUS_bop_relief_desc:0 "Hand part of the underground stores to the shifts that run the pumps, filters and laboratories. Fed shifts work calmly, and the scientists gain a louder voice over the stores. The food is spent at once; an empty store can cause hunger in fitted halls. Repeatable after 90 days."
 RUS_bop_relief_room_tt:0 "Scientist influence has not yet reached 85% of its side of the scale."
 RUS_bop_reserve:0 "Ration the Black Army reserve"
 RUS_bop_reserve_desc:0 "Feed the volunteers at the Black Army muster points. The country gains reservists and the army a larger say over the stores. These are men for reinforcement and recruitment, not armed divisions. The food is spent at once; an empty store can cause hunger. Repeatable after 90 days."
 RUS_bop_reserve_room_tt:0 "Black Army influence has not yet reached 85% of its side of the scale."
 RUS_bop_mediation:0 "Convene the army and science council"
 RUS_bop_mediation_desc:0 "Pay for a joint assembly of Black Army commanders, scientists and the treasury. Settling their powers brings the sides toward a compromise, and both leave feeling that the Khan has heard them. Repeatable after 90 days."
 RUS_bop_mediation_needed_tt:0 "The balance is outside the central range of -10% to +10%."
 RUS_bop_mediation_result_tt:0 "The balance moves §Y15%§! toward the centre. §YScientist§! and §YBlack Army§! support: §G+5%§!."
 RUS_bop_relief_cost:0 "§Y30§! £supply_texticon"
 RUS_bop_relief_cost_blocked:0 "§R30§! £supply_texticon"
 RUS_bop_relief_cost_tooltip:0 "Requires 30 £supply_texticon from the bunker's stocks."
 RUS_bop_reserve_cost:0 "§Y40§! £supply_texticon"
 RUS_bop_reserve_cost_blocked:0 "§R40§! £supply_texticon"
 RUS_bop_reserve_cost_tooltip:0 "Requires 40 £supply_texticon from the bunker's stocks."
 RUS_bop_mediation_cost:0 "§Y20§! £political_power_texticon  §Y65§! £ADISCORD_economy_treasury_texticon"
 RUS_bop_mediation_cost_blocked:0 "§R20§! £political_power_texticon  §R65§! £ADISCORD_economy_treasury_texticon"
 RUS_bop_mediation_cost_tooltip:0 "Requires 20 £political_power_texticon and 65 £ADISCORD_economy_treasury_texticon."
 RUS_suspicion_opens_tt:0 "§ROn exposure, [MON.GetName] and its allies attack without 90 days of preparation. Khan must proclaim his state.§!\nExposure requires all of the following:\n- §Y100§! £RUS_suspicion_texticon.\n- Control of all accessible Dirty Zone regions except those held by Kefreyt or its subjects.\n- Control of at least one reactor region.\n- No ongoing wars.\n\nThe first territorial gain opens the gauge at §Y10§! £RUS_suspicion_texticon. Suspicion grows monthly and through reactor work, laboratory projects and campaigns."
 RUS_suspicion_focus_relief_tt:0 "While the suspicion gauge is open, its monthly growth: §G-1§! £RUS_suspicion_texticon."
 RUS_suspicion_gain_4_tt:0 "Neighbours' suspicion: §R+4§! £RUS_suspicion_texticon."
 RUS_suspicion_gain_6_tt:0 "Neighbours' suspicion: §R+6§! £RUS_suspicion_texticon."
 RUS_suspicion_gain_8_tt:0 "Neighbours' suspicion: §R+8§! £RUS_suspicion_texticon."
 RUS_suspicion_gain_10_tt:0 "Neighbours' suspicion: §R+10§! £RUS_suspicion_texticon."
 RUS_suspicion_gain_12_tt:0 "Neighbours' suspicion: §R+12§! £RUS_suspicion_texticon."
 RUS_suspicion_relief_15_tt:0 "Neighbours' suspicion: §G-15§! £RUS_suspicion_texticon."
 RUS_suspicion_relief_8_tt:0 "Neighbours' suspicion: §G-8§! £RUS_suspicion_texticon."
 RUS_suspicion_relief_12_tt:0 "Neighbours' suspicion: §G-12§! £RUS_suspicion_texticon."
 RUS_inspection_hide_cost_tt:0 "Rations: §R-20§! £supply_texticon; the reactor works stop and some reservists are sent home: §R-500§! £manpower_texticon."
 RUS_inspection_bribe_cost_tt:0 "Treasury: §R-65§! £ADISCORD_economy_treasury_texticon."
 RUS_suspicion_relief_25_tt:0 "Neighbours' suspicion: §G-25§! £RUS_suspicion_texticon."
 RUS_suspicion_relief_10_tt:0 "Neighbours' suspicion: §G-10§! £RUS_suspicion_texticon."
 RUS_suspicion_relief_20_tt:0 "Neighbours' suspicion: §G-20§! £RUS_suspicion_texticon."
 RUS_suspicion_positive_tt:0 "Neighbours' suspicion is above zero."
 RUS_suspicion_open_tt:0 "The neighbours are already watching the Khan: the suspicion gauge is open."
 RUS_suspicion_status:0 "§YNeighbours' suspicion: [?RUS_suspicion|0]/100§! £RUS_suspicion_texticon\n§ROn exposure, [MON.GetName] and its allies attack without 90 days of preparation. Khan must proclaim his state.§!\nExposure requires all of the following:\n- §Y100§! £RUS_suspicion_texticon.\n- Control of all accessible Dirty Zone regions except those held by Kefreyt or its subjects.\n- Control of at least one reactor region.\n- No ongoing wars.\n\nMonthly growth: base §R+3§! £RUS_suspicion_texticon[GetRUSSuspicionArmyGrowth][GetRUSSuspicionBroadcastRelief][GetRUSSuspicionThroneRelief][GetRUSSuspicionBureauRelief][GetRUSSuspicionEnergyRelief]."
 RUS_suspicion_status_closed:0 ""
 RUS_suspicion_growth_none:0 ""
 RUS_suspicion_growth_army_influence:0 ", Black Army influence §R+2§! £RUS_suspicion_texticon"
 RUS_suspicion_growth_army_dominance:0 ", Black Army dominance §R+4§! £RUS_suspicion_texticon"
 RUS_suspicion_growth_broadcast:0 ", 'Two Editorial Offices, One Broadcast' §G-1§! £RUS_suspicion_texticon"
 RUS_suspicion_growth_sealed_throne:0 ", 'Headquarters Beneath the Mountain' §G-1§! £RUS_suspicion_texticon"
 RUS_suspicion_growth_press_bureau:0 ", 'Foreign Press Bureau' §G-1§! £RUS_suspicion_texticon"
 RUS_suspicion_energy_cover:0 "Present the Reactor as an Energy Programme"
 RUS_suspicion_energy_cover_desc:0 "The scientists will show foreign observers turbines, power lines and workshops while the orbital calculations are moved to closed archives. The neighbours will see a power station under construction, not a weapon. Current suspicion: §Y[?RUS_suspicion|0]§!/100 £RUS_suspicion_texticon. Repeatable after 60 days."
 RUS_suspicion_energy_cover_cost:0 "§Y60§! £ADISCORD_economy_treasury_texticon"
 RUS_suspicion_energy_cover_cost_blocked:0 "§R60§! £ADISCORD_economy_treasury_texticon"
 RUS_suspicion_energy_cover_cost_tooltip:0 "Requires 60 £ADISCORD_economy_treasury_texticon."
 RUS_suspicion_energy_cover_support_tt:0 "§YScientist§! support: §G+5%§!."
 RUS_suspicion_disperse_musters:0 "Disperse the Black Army Musters"
 RUS_suspicion_disperse_musters_desc:0 "The muster points near the reactor perimeter are too conspicuous. The Black Army will send some reservists home and move its exercises to distant aimaqs, leaving only ordinary guards at the reactor. Current suspicion: §Y[?RUS_suspicion|0]§!/100 £RUS_suspicion_texticon. Repeatable after 60 days."
 RUS_suspicion_disperse_musters_cost:0 "§Y15§! £supply_texticon  §Y500§! £manpower_texticon"
 RUS_suspicion_disperse_musters_cost_blocked:0 "§R15§! £supply_texticon  §R500§! £manpower_texticon"
 RUS_suspicion_disperse_musters_cost_tooltip:0 "Requires 15 £supply_texticon from the bunker's stocks and 500 £manpower_texticon."
 RUS_suspicion_disperse_musters_support_tt:0 "§YBlack Army§! support: §G+5%§!."
 RUS_suspicion_envoys:0 "Send Envoys to the Montar Empire"
 RUS_suspicion_envoys_desc:0 "Khan's envoys will carry assurances of peaceful intent, gifts and invitations to the opening of new workshops to the Montar Empire. The Montar staffs will not stop counting divisions, but they will postpone part of their preparations. Current suspicion: §Y[?RUS_suspicion|0]§!/100 £RUS_suspicion_texticon. Repeatable after 120 days."
 RUS_suspicion_envoys_cost:0 "§Y30§! £political_power_texticon  §Y85§! £ADISCORD_economy_treasury_texticon"
 RUS_suspicion_envoys_cost_blocked:0 "§R30§! £political_power_texticon  §R85§! £ADISCORD_economy_treasury_texticon"
 RUS_suspicion_envoys_cost_tooltip:0 "Requires 30 £political_power_texticon and 85 £ADISCORD_economy_treasury_texticon."
 RUS_suspicion_ration_aid:0 "Send Rations to the Hungry Borderlands"
 RUS_suspicion_ration_aid_desc:0 "The underground stores will give part of their rations to starving settlements across the border. It is hard to call for war against those who feed your people. The food is deducted immediately; an empty store may cause hunger. Current suspicion: §Y[?RUS_suspicion|0]§!/100 £RUS_suspicion_texticon. Repeatable after 60 days."
 RUS_suspicion_ration_aid_cost:0 "§Y30§! £supply_texticon"
 RUS_suspicion_ration_aid_cost_blocked:0 "§R30§! £supply_texticon"
 RUS_suspicion_ration_aid_cost_tooltip:0 "Requires 30 £supply_texticon from the bunker's stocks."
 RUS_suspicion_border_bribes:0 "Buy the Silence of the Border Posts"
 RUS_suspicion_border_bribes_desc:0 "The treasury will pay generously to foreign scribes, outpost commanders and the merchants who carry reports to the neighbouring staffs. Money does not change foreign plans, but it delays alarming reports for a long time. Current suspicion: §Y[?RUS_suspicion|0]§!/100 £RUS_suspicion_texticon. Repeatable after 90 days."
 RUS_suspicion_border_bribes_cost:0 "§Y200§! £ADISCORD_economy_treasury_texticon"
 RUS_suspicion_border_bribes_cost_blocked:0 "§R200§! £ADISCORD_economy_treasury_texticon"
 RUS_suspicion_border_bribes_cost_tooltip:0 "Requires 200 £ADISCORD_economy_treasury_texticon."
 RUS_suspicion_press_tour:0 "Hold a Press Tour of the Peaceful Workshops"
 RUS_suspicion_press_tour_desc:0 "The Foreign Press Bureau will take correspondents through turbine halls, schools and workshops, and the scientists will answer questions about the reactor so that the answers sound dull. Current suspicion: §Y[?RUS_suspicion|0]§!/100 £RUS_suspicion_texticon. Repeatable after 60 days."
 RUS_suspicion_press_tour_cost:0 "§Y50§! £ADISCORD_economy_treasury_texticon"
 RUS_suspicion_press_tour_cost_blocked:0 "§R50§! £ADISCORD_economy_treasury_texticon"
 RUS_suspicion_press_tour_cost_tooltip:0 "Requires 50 £ADISCORD_economy_treasury_texticon."
 RUS_suspicion_reactor_camouflage:0 "Conceal the Reactor Works"
 RUS_suspicion_reactor_camouflage_desc:0 "Black Army guards will move the works to night shifts, cover the sites with camouflage nets and route the columns along distant roads. The guards need rations and the nets need money. The food is deducted immediately. Current suspicion: §Y[?RUS_suspicion|0]§!/100 £RUS_suspicion_texticon. Repeatable after 90 days."
 RUS_suspicion_reactor_camouflage_cost:0 "§Y40§! £supply_texticon  §Y50§! £ADISCORD_economy_treasury_texticon"
 RUS_suspicion_reactor_camouflage_cost_blocked:0 "§R40§! £supply_texticon  §R50§! £ADISCORD_economy_treasury_texticon"
 RUS_suspicion_reactor_camouflage_cost_tooltip:0 "Requires 40 £supply_texticon from the bunker's stocks and 50 £ADISCORD_economy_treasury_texticon."
 RUS_suspicion_border_commission:0 "Convene the Border Commission"
 RUS_suspicion_border_commission_desc:0 "Under the charter of good neighbourliness, foreign officers and the Khan's scribes will tour the outposts together, compare maps and dine in the garrisons at the Khan's expense. The food is deducted immediately. Current suspicion: §Y[?RUS_suspicion|0]§!/100 £RUS_suspicion_texticon. Repeatable after 120 days."
 RUS_suspicion_border_commission_cost:0 "§Y20§! £supply_texticon  §Y65§! £ADISCORD_economy_treasury_texticon"
 RUS_suspicion_border_commission_cost_blocked:0 "§R20§! £supply_texticon  §R65§! £ADISCORD_economy_treasury_texticon"
 RUS_suspicion_border_commission_cost_tooltip:0 "Requires 20 £supply_texticon from the bunker's stocks and 65 £ADISCORD_economy_treasury_texticon."
 RUS_shadow_rifles:0 "Buy Weapons From Foreign Depots"
 RUS_shadow_rifles_desc:0 "Quartermasters at the neighbouring outposts sell written-off rifles and spare parts for cash if the buyer asks for no invoices. The deal is quick, but someone will recount every crate in a foreign depot. Current suspicion: §Y[?RUS_suspicion|0]§!/100 £RUS_suspicion_texticon. Repeatable after 90 days."
 RUS_shadow_rifles_cost:0 "§Y35§! £ADISCORD_economy_treasury_texticon"
 RUS_shadow_rifles_cost_blocked:0 "§R35§! £ADISCORD_economy_treasury_texticon"
 RUS_shadow_rifles_cost_tooltip:0 "Requires 35 £ADISCORD_economy_treasury_texticon."
 RUS_shadow_rifles_room_tt:0 "Neighbours' suspicion is below §Y92§! £RUS_suspicion_texticon: after the deal it stays below §Y100§! £RUS_suspicion_texticon."
 RUS_shadow_designs:0 "Steal the Neighbours' Designs"
 RUS_shadow_designs_desc:0 "Our people in the neighbouring workshops will copy the breech and carriage drawings in a single night. The scientists receive ready solutions, and the neighbours receive proof that the Khan has ears in their halls. Current suspicion: §Y[?RUS_suspicion|0]§!/100 £RUS_suspicion_texticon. Repeatable after 120 days."
 RUS_shadow_designs_cost:0 "§Y15§! £political_power_texticon"
 RUS_shadow_designs_cost_blocked:0 "§R15§! £political_power_texticon"
 RUS_shadow_designs_cost_tooltip:0 "Requires 15 £political_power_texticon."
 RUS_shadow_designs_room_tt:0 "Neighbours' suspicion is below §Y88§! £RUS_suspicion_texticon: after the theft it stays below §Y100§! £RUS_suspicion_texticon."
 RUS_stolen_designs:0 "Stolen Designs"
 RUS_shadow_engineers:0 "Lure Away Their Engineers"
 RUS_shadow_engineers_desc:0 "The neighbouring engineers have gone unpaid for a long time. The Khan will offer them rations, quarters underground and work in their trade, and their former superiors will soon understand where their best people went. Current suspicion: §Y[?RUS_suspicion|0]§!/100 £RUS_suspicion_texticon. Repeatable after 120 days."
 RUS_shadow_engineers_cost:0 "§Y25§! £supply_texticon"
 RUS_shadow_engineers_cost_blocked:0 "§R25§! £supply_texticon"
 RUS_shadow_engineers_cost_tooltip:0 "Requires 25 £supply_texticon from the bunker's stocks."
 RUS_shadow_engineers_room_tt:0 "Neighbours' suspicion is below §Y90§! £RUS_suspicion_texticon: after the hiring it stays below §Y100§! £RUS_suspicion_texticon."
 RUS_shadow_engineers_ready_tt:0 "Economic development can still grow."
 RUS_shadow_engineers_result_tt:0 "Economic development progress: §G+20§!."
 RUS_energy_contract:0 "Connect [FROM.GetName] to the Generators"
 RUS_energy_contract_desc:0 "The bunker's generators produce more current than the underground halls need. The neighbouring settlements will pay for light and pumps, and dependence on the Khan's grid will make them more careful when they talk of war."
 RUS_energy_contract_cost:0 "§Y1§! £energy_consumption_texticon"
 RUS_energy_contract_cost_blocked:0 "§R1§! £energy_consumption_texticon"
 RUS_energy_contract_cost_tooltip:0 "Requires §Y1§! £energy_consumption_texticon of free bunker power."
 RUS_energy_contract_result_tt:0 "Your country: §G+8§! £ADISCORD_economy_treasury_texticon per month; suspicion growth §G-1§! £RUS_suspicion_texticon per month. Reserves §Y1§! £energy_consumption_texticon power.\nCurrent contracts: §Y[?RUS_energy_contracts|0]§!/[GetRUSEnergyContractLimit].\n\n§RWar with [FROM.GetName] ends the contract.§! The buyer, §R[FROM.GetName]§!, receives for §Y90 days§!: §R-15%§! military factory output, §R-20%§! construction speed, §R-5%§! army organisation."
 RUS_energy_contract_limit_2:0 "§Y2§!"
 RUS_energy_contract_limit_3:0 "§Y3§!"
 RUS_energy_contract_limit_4:0 "§Y4§!"
 RUS_energy_contract_end:0 "End the Contract With [FROM.GetName]"
 RUS_energy_contract_end_desc:0 "Disconnect the line without a war and return the power to the bunker."
 RUS_energy_contract_end_tt:0 "The contract ends: the power returns to the bunker, and the §G+8§! £ADISCORD_economy_treasury_texticon monthly income and slower suspicion growth stop. No 'Power Cut' penalty is applied."
 RUS_power_cut:0 "Power Cut"
 RUS_suspicion_growth_energy:0 ", energy contracts §G-[?RUS_energy_contracts|0]§! £RUS_suspicion_texticon"
 RUS_war_spoils_full_tt:0 "Spoils: §G+100§! £ADISCORD_economy_treasury_texticon, §G+3000§! £infantry_equipment_texticon, §G+1500§! £manpower_texticon, §G+30§! £supply_texticon to the bunker's stocks."
 RUS_war_spoils_half_tt:0 "Spoils: §G+50§! £ADISCORD_economy_treasury_texticon, §G+1500§! £infantry_equipment_texticon, §G+750§! £manpower_texticon, §G+15§! £supply_texticon to the bunker's stocks."
 RUS_aimaq_levy:0 "Call Up the Aimaq Levy"
 RUS_aimaq_levy_desc:0 "The aimaq elders will bring shepherds, carters and hunters if the bunker feeds them and hands out weapons. This is no army: the levies break easily and will go home when the war ends. In exchange they take no one from the conscription rolls."
 RUS_aimaq_levy_cost:0 "§Y30§! £supply_texticon  §Y2700§! £infantry_equipment_texticon"
 RUS_aimaq_levy_cost_blocked:0 "§R30§! £supply_texticon  §R2700§! £infantry_equipment_texticon"
 RUS_aimaq_levy_cost_tooltip:0 "Requires 30 £supply_texticon from the bunker's stocks and 2700 £infantry_equipment_texticon in the stockpile."
 RUS_aimaq_levy_room_tt:0 "A war is under way and its levy limit is not exhausted: §Y3§! calls, §Y+2§! after 'Judgment Before Gunfire', §Y+1§! after 'Garrison Under the Mountain'."
 RUS_aimaq_levy_result_tt:0 "§Y2§! 'Aimaq Levy' divisions appear in the capital (§Y3§! militia battalions each, half of their rifles). No one is taken from the recruit pool. When every war ends, the levies disband without returning men or rifles. While a levy is under arms, the bunker feeds it: ration use §R+1§! £supply_texticon per week."
 RUS_refugees_food_tt:0 "Rations: up to §R-30§! £supply_texticon from the bunker's stocks."
 RUS_refugees_settle_cost_tt:0 "Treasury: §R-35§! £ADISCORD_economy_treasury_texticon."
 RUS_refugees_settle_result_tt:0 "Society development progress: §G+15§!."
 RUS_winter_tt:0 "Winter: bunker ration use §R+3§! £supply_texticon per week for §Y90§! days (§R+1§! after 'Winter Ledgers')."
 RUS_winter_food_tt:0 "Rations: §G+30§! £supply_texticon to the bunker's stocks."
 RUS_winter_grain_cost_tt:0 "Treasury: §R-50§! £ADISCORD_economy_treasury_texticon."
 ADISCORD_rus_crisis.31.t:0 "Refugees at the Gates"
 ADISCORD_rus_crisis.31.d:0 "After the neighbouring outposts fell, families came down the roads to the bunker: carts of household goods, old men carried by their sons, children who have never seen an underground city. They flee the war the Khan brought, and they ask the Khan himself for protection.\n\nThe galleries have room for working hands, but every new mouth will eat part of the winter stores. The people can be settled in the aimaqs at the treasury's expense, or the gates can be closed and the steppe left to them."
 ADISCORD_rus_crisis.31.a:0 "Take everyone underground."
 ADISCORD_rus_crisis.31.b:0 "Settle them in the aimaqs."
 ADISCORD_rus_crisis.31.c:0 "Close the gates."
 ADISCORD_rus_crisis.32.t:0 "Winter Over the Steppe"
 ADISCORD_rus_crisis.32.d:0 "The first snow has closed the roads to the distant aimaqs. The pumps run longer, the galleries burn more light, and the generator shifts need double rations. The quartermasters reckon the stores will last only with strict economy.\n\nThe senior shifts propose sending expeditions to the surface: abandoned settlements still hold depots, but foreign patrols will notice every sortie. The treasury can buy grain from the neighbours if the money can be found."
 ADISCORD_rus_crisis.32.a:0 "Tighten our belts until spring."
 ADISCORD_rus_crisis.32.b:0 "Send expeditions to the surface."
 ADISCORD_rus_crisis.32.c:0 "Buy grain from the neighbours."
 ADISCORD_rus_crisis.33.a:0 "Spring."
 RUS_vorkerland_airlift:0 "Vorkerland Airlift"
 RUS_vorkerland_airlift_desc:0 "Vorkerland transports drop sacks of grain and crates of tinned food over the steppe. The pilots ask no questions about the Khan: those fed today will not join a stranger tomorrow. But Vorkerland talks more and more about its own troubles, and every drop may be smaller than the last.\n\nA new load arrives every §Y50§! days: first a large one, then a smaller one, then a meagre one. If unrest breaks out in Vorkerland, the airlift ends early."
 RUS_vorkerland_airlift_next_tt:0 "Another Vorkerland aid drop passes over the bunker."
 RUS_bunker_mushroom_farm:0 "Lay Out a Mushroom Farm"
 RUS_bunker_mushroom_farm_desc:0 "Mushrooms can be grown on sawdust and kitchen waste in the damp workings beyond the old bulkhead. A farm needs no sun, but its lamps, fans and pumps run day and night.\n\nEach farm gives §G+2§! £supply_texticon per week and permanently uses §Y1§! £energy_consumption_texticon. Up to §Y3§! farms can be built, one at a time. Farms now: §Y[?RUS_bunker_farms|0]§!/3."
 RUS_bunker_mushroom_farm_cost:0 "§Y65§! £ADISCORD_economy_treasury_texticon  §Y1§! £energy_consumption_texticon"
 RUS_bunker_mushroom_farm_cost_blocked:0 "§R65§! £ADISCORD_economy_treasury_texticon  §R1§! £energy_consumption_texticon"
 RUS_bunker_mushroom_farm_cost_tooltip:0 "Requires 65 £ADISCORD_economy_treasury_texticon in the treasury and 1 £energy_consumption_texticon of free bunker power."
 RUS_bunker_mushroom_farm_tt:0 "Treasury: §R-65§! £ADISCORD_economy_treasury_texticon. §Y1§! £energy_consumption_texticon of power is used from the start of work.\nIn §Y45§! days, bunker food: §G+2§! £supply_texticon per week."
 RUS_bunker_mushroom_farm_done_tt:0 "The mushroom farm is ready: bunker food §G+2§! £supply_texticon per week, §Y1§! £energy_consumption_texticon of power used permanently."
 RUS_bunker_mushroom_farm_cancel_tt:0 "The bunker is lost: work stops and §G65§! £ADISCORD_economy_treasury_texticon return to the treasury."
 RUS_bunker_farm_ready_tt:0 "The Khan governs, the bunker works, at least §Y2§! layers have been dug, there are fewer than §Y3§! farms, and no other farm is being built."
 RUS_aimaq_food_requisition:0 "Food Requisition in the Aimaqs"
 RUS_aimaq_food_requisition_desc:0 "The Khan's scribes will go through the annexed aimaqs and list every granary. Each household will give the bunker a share of its grain and dried meat. The stores will fill quickly, but the steppe will remember who took its bread, and the neighbours will see the requisition convoys. Repeatable after 90 days."
 RUS_food_requisition_tt:0 "Bunker food: §G+40§! £supply_texticon; anything that does not fit in the store is lost."
 RUS_food_requisition_ready_tt:0 "The Khan governs, the bunker works, and the country controls more than §Y3§! states."
 RUS_refugees_mouths_tt:0 "Bunker ration use: §R+1§! £supply_texticon per week permanently."
 RUS_bunker_spoil_focus_tt:0 "Every two months, §G5%§! of the stock above 75% of store capacity spoils instead of §R10%§!."
 RUS_airlift_food_60_tt:0 "Bunker food: §G+60§! £supply_texticon; anything that does not fit in the store is lost."
 RUS_airlift_food_35_tt:0 "Bunker food: §G+35§! £supply_texticon; anything that does not fit in the store is lost."
 RUS_airlift_food_15_tt:0 "Bunker food: §G+15§! £supply_texticon; anything that does not fit in the store is lost."
 RUS_airlift_cash_75_tt:0 "The load is sold to the aimaqs: treasury §G+75§! £ADISCORD_economy_treasury_texticon."
