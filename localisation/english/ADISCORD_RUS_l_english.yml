 RUS_bunker_signals:0 "Level 2: Wired Communications Hub"
 RUS_bunker_signals_desc:0 "Cables converging in a single hall turn the shouts of messengers into verified reports. An order must arrive before its recipient dies.\n\nConstruction: §Y28 days§!. One room per level.\nFood upkeep: §Y1§! £supply_texticon per week.\n\n[GetRUSBunkerForecastsignals]"
