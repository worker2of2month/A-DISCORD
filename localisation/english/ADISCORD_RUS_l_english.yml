 RUS_bunker_workshop_compact:0 "Workshops"
 RUS_bunker_workshop_ui_tt:0 "§YUnderground Arsenal§!\n§G+15%§! military factory output.\nWeekly stockpile delivery: §G+4§! £infantry_equipment_texticon and §G+1§! £support_equipment_texticon.\n\nCost: [GetRUSBunker15pp]  [GetRUSBunker15cash]  [GetRUSBunker15equipment]\nDuration: §Y28 days§!\nUpkeep: §Y3§! £energy_consumption_texticon; §Y1§! £supply_texticon per week.\n\nPaid programmes while operational: Order Engineering Equipment delivers §G150§! £support_equipment_texticon instead of 100; Train Workshop Masters grants §G+40§! £ADISCORD_country_development_texticon economic progress instead of 25.\n\n[GetRUSBunkerRoomworkshop]\nRequires focus: [GetRUSBunkerRecipe3].\n\n[GetRUSBunkerForecastworkshop]"
