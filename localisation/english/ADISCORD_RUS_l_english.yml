 RUS_restore_wasteland_refund_tt:0 "Cancellation refunds §G75§! £political_power_texticon, §G335§! £ADISCORD_economy_treasury_texticon and §G200§! £support_equipment_texticon. No improvements are delivered."
 ADISCORD_rus_crisis.24.t:0 "New Borders on Foreign Maps"
 ADISCORD_rus_crisis.24.d:0 "The first report from the new borders arrived beside a trade ledger. Merchants were already changing their routes, border clerks were renaming checkpoints, and embassies were requesting information about Khan garrisons. The steppe was no longer an unchanging entry in an old atlas.\n\nRustan had not yet proclaimed an empire. Beyond his lands, however, people were already discussing how many troops he could arm and where he would send them next. The chancery might come later; foreign observers would not wait for its doors to open.\n\nThe scientists propose opening civilian workshops to visitors. The army offers to disperse its mustering grounds. Envoys request funds for talks. Every new preparation will now attract attention, and concealing it will carry a price."
 ADISCORD_rus_crisis.24.a:0 "Let them see less than we prepare."
