 RUS_bunker_granary:0 "Level 3: Grain Chambers"
 RUS_bunker_granary_desc:0 "Dry chambers and stock records will spare the capital its panic buying. A good storehouse has no heroic appearance: it has a shelf life and a second key.\n\nConstruction: §Y28 days§!. One room per level.\nFood upkeep: §Y1§! £supply_texticon per week.\n\n[GetRUSBunkerForecastgranary]"
