 RUS_bunker_upgrade_1:0 "Upgrade Level 1"
 RUS_bunker_upgrade_1_desc:0 "The existing room receives a second round of equipment. The purpose of the level remains unchanged.\n\nDuration: §Y28 days§!.\n\n[GetRUSBunkerForecastUpgrade1]"
 RUS_bunker_upgrade_1_requirements_tt:0 "Level 1 is fitted and has not yet been upgraded. Available power: 0.\nGuard: an additional +1.5% organisation and -1.5% training time. Shelters: an additional +2% stability."
 RUS_bunker_upgrade_2:0 "Upgrade Level 2"
 RUS_bunker_upgrade_2_desc:0 "The existing room receives a second round of equipment. The purpose of the level remains unchanged.\n\nDuration: §Y28 days§!.\n\n[GetRUSBunkerForecastUpgrade2]"
 RUS_bunker_upgrade_2_requirements_tt:0 "Level 2 is fitted and has not yet been upgraded. Available power: 0.\nWater purification: an additional -2% attrition. Communications hub: an additional +4% planning speed."
