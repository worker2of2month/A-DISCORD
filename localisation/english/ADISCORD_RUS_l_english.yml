 RUS_bunker_clinic:0 "Level 4: Surgical Level"
 RUS_bunker_clinic_desc:0 "For the first time, field surgeons will have light, sterile water and a place to bring the wounded back to life. The Khan's ledgers will learn to count lives saved.\n\nConstruction: §Y28 days§!. One room per level.\nFood upkeep: §Y1§! £supply_texticon per week.\n\nPaid programme while operational: Train District Paramedics grants §G+40§! £ADISCORD_country_development_texticon social-system progress instead of 25.\n\n[GetRUSBunkerForecastclinic]"
