# --- rus_perimeter_story ---
 ADISCORD_rus_campaign.14.t:0 "The Night Shift"
 ADISCORD_rus_campaign.14.d:0 "The telephone at the abandoned checkpoint rang after midnight. Its field cable ended in a ditch. The sentry initially thought the sound came from the next room. A tired voice asked him to admit the maintenance shift, as though it called here every night.\n\nAt dawn an unmarked truck approached the perimeter. Its driver carried fresh filters, an old Vorkerland pass and the exact name of the checkpoint, erased from its sign years ago. Seeing unfamiliar guards, he turned back. The patrol did not follow beyond the warning posts.\n\nThe Khan received the telephone and the report. A technician found a separate receiver inside: someone had preserved communications where nothing was supposed to remain alive. A wet fingerprint marked the copy of the driver's pass. Beside it stood a service designation: Dead Zone Perimeter. Rustan ordered the post added to the map. That night the telephone rang again, inside his chancery."
 ADISCORD_rus_campaign.14.a:0 "Write down every word."
 ADISCORD_rus_campaign.15.t:0 "Two Invoices"
 ADISCORD_rus_campaign.15.d:0 "The papers collected by dealers along the western border contained two invoices. One belonged to the force guarding a crossing. The other belonged to the men who had spent three winters trying to burn it. The intermediaries and seals differed. The crate numbers were consecutive.\n\nA clerk traced both payments to one Vorkerland depot. It supplied ammunition, medicine and spare parts to both sides, never enough for either to win outright. Each attempt at reconciliation was followed by another delivery and another report of betrayal.\n\nThe final sheet named no recipient. Instead it read: Prevent lasting coordination of routes. Below stood the funeral expenses of a guide who had intended to lead a joint expedition towards the reactor. He had died on a road both sides considered safe. Rustan studied the matching numbers. Someone had been paying carefully to keep this war alive."
 ADISCORD_rus_campaign.15.a:0 "Find whoever kept these accounts."
 ADISCORD_rus_campaign.16.t:0 "The Name on the Drawing"
 ADISCORD_rus_campaign.16.d:0 "The reactor-belt inventory began with a factory archive. Early zero-point drawings bore Dorian Worx's name beside the title of scientific director. As a scientist of the Veyran Empire, he had calculated the assemblies, argued with contractors and personally approved revisions. This had been his creation.\n\nThe technical notes promised power for cities and industry. His handwritten margins told another story. Beside the estimate for a palace substation: Another century of light in the same windows. Beside a demand to restrict access: a list of monarchies and hereditary privileges. The last entry read: They will buy electricity from the future to prevent it from ever arriving.\n\nThe Khan ran his finger along the signature. Until now the reactor had been someone else's ruin, left by someone else's mistake. The ruin now had a creator, and its creator had a reason to hate those he served."
 ADISCORD_rus_campaign.16.a:0 "Keep the drawings and their annotations together."
 ADISCORD_rus_campaign.17.t:0 "Beyond the Rock"
 ADISCORD_rus_campaign.17.d:0 "Workers in the distant gallery heard three short knocks and one long one. A miner answered with his tool handle. The reply came from the other side. The plans showed neither a tunnel nor a pipe there.\n\nThe engineer stopped the machinery and inspected an old service cable leading towards the western facilities. Its armour could carry vibrations. That explanation reassured the shift until a disconnected intercom asked for dry clothes. The voice named a reactor workshop listed as lost during the evacuation.\n\nThe Khan demanded an exact transcript. The report recorded the time, witnesses and words of someone nobody had seen. An old foreman signed last. He asked that no watchman be left alone: tomorrow the voice might be familiar. Rustan authorised paired watches. He offered no explanation of what they were guarding."
 ADISCORD_rus_campaign.17.a:0 "Nobody goes down alone."
 ADISCORD_rus_campaign.18.t:0 "The Signature Beneath the Blast"
 ADISCORD_rus_campaign.18.d:0 "A box of technical papers entrusted to the bunker contained a copy of the emergency log. Among routine instructions lay a separate order: disable the outer safeguards, withdraw selected specialists, preserve the deep assembly. Dorian Worx had signed it.\n\nThis was no commission report written after the disaster. The order preceded it. A communications recording confirmed that the reactor's creator had secretly directed its destruction. The duty officer twice asked about evacuating the remaining shifts. Worx ordered the sequence to continue. After the second question, only noise remained.\n\nAn accompanying memorandum outlined the political consequences. The destruction would break the monarchies of the Veyran Empire and open the way for Worker. Dorian called it the beginning of an experiment. The Khan finished reading on his feet. Someone had written the names of workers left inside along the margin. Beside one name stood a drawing of a small house."
 ADISCORD_rus_campaign.18.a:0 "That signature stays in the archive."
 ADISCORD_rus_campaign.19.t:0 "The Expedition That Never Left"
 ADISCORD_rus_campaign.19.d:0 "While preparations for reactor sorties were under way, a guide brought the file of an earlier expedition. Three settlements had agreed to travel together: one provided vehicles, another food, the third people familiar with old service roads. Only the departure date remained unsettled.\n\nThen each received a warning. The first was told its neighbours would sell it to the perimeter guards. The second learned that the vehicles were mined. The third received a list of hostages bearing their children's names. The meeting ended in gunfire. A week later a maintenance convoy used those roads with Vorkerland passes.\n\nThe guide had kept the warnings. One letter bore the same chipped impression on every sheet. Asked why nobody had compared them before, he replied that people stopped visiting one another after the funerals. Their shared map still carried three signatures. Its route reached confidently to the reactor's inner ring."
 ADISCORD_rus_campaign.19.a:0 "Give the commanders copies of these warnings."
 ADISCORD_rus_campaign.20.t:0 "Maintain the Cage"
 ADISCORD_rus_campaign.20.d:0 "The decontamination specialists received a recovered perimeter-service manual. Its first pages covered filters, water and radiation checks. Then came prohibited work: do not restore continuous power to the inner lines; do not unite local administrations; do not admit research parties to the deep assembly.\n\nThe final appendix explained why Vorkerland preserved the Dead Zone. A remnant of the zero-point reactor survived beneath the ruined complex. It could not be considered inert. The service was to maintain broken roads, communications and authority around it, admitting only its own crews through narrow corridors. Most posts received sanitary instructions alone. Few knew the perimeter's full purpose.\n\nWorx's order required isolation to continue after loss of contact with the centre or a change of government. A separate clause forbade dismantling the core. The Khan paused at a pencilled note: Destruction of the casing does not mean termination of the process. People had been living beside a cage and mistaking it for ruins."
 ADISCORD_rus_campaign.20.a:0 "First understand what these walls contain."
 ADISCORD_rus_campaign.21.t:0 "A Satellite Without a State"
 ADISCORD_rus_campaign.21.d:0 "Among old communications diagrams an engineer found a line ending at no ground station. It led to a satellite tracking facility. Vorkerland's catalogue listed the craft as decommissioned. A classified log retained orbital corrections and contact schedules from after its official retirement.\n\nThe reactor plans identified the same line as the Beam control channel. The orbital installation had belonged to old Vorkerland. It had been removed from public records rather than destroyed with the ground facilities. One calculation reversed the direction of energy transfer: from the satellite into the reactor's deep assembly. The final page had been cut out.\n\nThe Khan climbed to the guard post beneath a clear sky. Could the craft be seen without instruments? The engineer said one would need to know where to look. Rustan stood with his head tilted back, then ordered the schedule preserved and no transmission made on the recovered frequency."
 ADISCORD_rus_campaign.21.a:0 "Listen only, for now."
 ADISCORD_rus_campaign.22.t:0 "The Limit of the Experiment"
 ADISCORD_rus_campaign.22.d:0 "Copies of Dorian Worx's classified calculations reached the laboratory. An early table confined the blast's consequences to the reactor complex and surrounding territory. A later table was covered in corrections. Where the limit had stood, someone had written: Not established.\n\nThe surviving zero point could receive an external impulse. Under certain conditions, energy returned to the process instead of dispersing through the ruined casing. Worx specifically examined a Beam strike from Vorkerland's old satellite. The calculation yielded no safe boundary: destruction of the reactor threatened a catastrophe on a world scale. The conclusion demanded that all access to launch controls be prevented.\n\nHis accompanying note to the perimeter service no longer discussed progress. It demanded the recovery of missing plans and detention of anyone capable of reading them. The last sentence was underlined repeatedly: The experiment must not acquire a second author. Rustan requested a copy. For the first time, the laboratory director hesitated before obeying."
 ADISCORD_rus_campaign.22.a:0 "Put it in front of me."
 ADISCORD_rus_campaign.23.t:0 "The Transmitter Was Off"
 ADISCORD_rus_campaign.23.d:0 "Signal crews compared recordings from old perimeter frequencies. Some voices belonged to a service library: appeals for help, shift roll calls, evacuation orders. Transmitters played them beside roads that were to remain empty. Logs recorded which messages persuaded guides to turn back.\n\nOne shift, however, reported a transmission absent from the library. A woman named the guards and begged them not to close a door. The post commander ordered the equipment disconnected. Her voice continued for eleven minutes. A technician attached the power-disconnection report, noting that the backup battery had been on his desk.\n\nCould another post have transmitted it? The signal officer said yes. Rustan pointed to the last line. One of the named guards had entered service nine days after the incident. His surname had been crossed out, then restored in another hand."
 ADISCORD_rus_campaign.23.a:0 "Keep both entries."
 ADISCORD_rus_campaign.24.t:0 "A Reserve for the Next Government"
 ADISCORD_rus_campaign.24.d:0 "The foundry supply records contained an inventory of mothballed machine tools. Equipment had been removed from ordinary use in small consignments, accompanied by tooling stocks and specialists' personnel files. The recipient was Dorian Worx's technical reserve.\n\nAn attached memorandum predated Worker's rise to power. Dorian expected his ideas to disrupt supplies and set the country's institutions against one another. He had assigned personnel, depots and armed groups to each predicted crisis. Worx intended to attack when Worker lost his support and seize the centres of administration before rival claimants.\n\nA marginal note read: The population must first exhaust its trust in the alternatives. Rustan read it aloud. Nobody answered. The author intended to await other people's hunger beside full warehouses, then present those stores as proof of his right to govern. Whether his forecast would come true depended on living people beyond the pages of this file."
 ADISCORD_rus_campaign.24.a:0 "His waiting had depots and garrisons."
 ADISCORD_rus_campaign.25.t:0 "Fear of a Motionless World"
 ADISCORD_rus_campaign.25.d:0 "A collection of scientific papers was sorted for the college. In a classified appendix Dorian Worx described a world capable of prolonging its existence indefinitely without changing. Dynasties inherited power stations, officials inherited prohibitions, children inherited their parents' assigned places. He called even immortality in such a world an improved form of imprisonment.\n\nHis notes then turned to Vorkerland. The fall of the Veyran Empire's monarchies, Worker's government, the expected collapse of his ideas and an offensive by a prepared technical authority appeared as stages of one experiment. Dorian feared history would stop without a push. He reserved the right to choose its force for himself.\n\nThe Khan asked the lecturer to read the final page. Worx compared people to generations of researchers: some began the work, others received its results. There was no place for those who refused to participate. Rustan closed the file. After a long silence he asked what separated Worx from a ruler who believed only his own order could give the world a future. The lecturer did not answer for him."
 ADISCORD_rus_campaign.25.a:0 "Let that question remain open."

# Campaign briefing
 RUS_startup_country:0 "§YTHE KHAN'S LAND IN 2160§!\n\nMark Rustan unites the aimaqs, border hosts and people of the underground complex. Local agreements lose their force beyond each settlement: the country needs common records, permanent supply and institutions capable of carrying out orders. The Khan begins with land that still has to become a state.\n\n§YTwo pillars of one ruler§!\nThe Black Army guards the entrances and frontiers, demanding reserves and unified command. Scientists maintain generators, water and laboratories. Both answer to Rustan but envision different futures. Choosing a state programme does not freeze their support or the balance of power.\n\n§YUnderground and above ground§!\nThe bunker offers protection and practical capabilities, but needs power, food and sound foundations. The surface needs schools, roads, workshops and doctors. Leaving agrarian economics and traditional society behind requires focuses, laws and paid development programmes.\n\n§YBeyond the western frontier§!\nVorkerland's collapse opens the Dirty Zone. Border campaigns can lead to imperial proclamation and further wars. Expansion makes it increasingly important to understand the next step: access to the reactor perimeter is tied to the campaign's late crisis."
 RUS_startup_guide_state_title:0 "Government and development"
 RUS_startup_guide_bunker_title:0 "Bunker resources"
 RUS_startup_guide_campaign_title:0 "Campaigns and the late crisis"
 RUS_startup_guide_plan_title:0 "First steps"
 RUS_startup_guide_state:0 "§YHOW THE KHAN'S GOVERNMENT WORKS§!\n\n§YChoosing a course§!\nAfter Count the Hearths, choose the scientific council or the Black Army oath. These focuses are mutually exclusive. Rustan remains the country's ruler on either route.\n\n§YBalance and support are separate§!\nScientists are on the left of the power balance, the Black Army on the right. Position determines current state advantages and costs. Each faction also has its own support: above 50% it provides political power and pulls the balance towards itself every week; below 50% it costs political power. Focuses, political measures and laboratory projects affect these values.\n\nModerate scientific influence improves research and production efficiency growth at the cost of recruitable population. Dominance also reduces army organisation and stability. Military influence improves planning and organisation; army dominance increases supply and administrative costs, slows research and reduces stability. Compromise supports stability.\n\n§YModernisation§!\nThe state, society, army, social system, economy and culture develop separately. Shared branches establish administration, education, labour rules and civilian services; focuses unlock paid programmes. Read each law's effects and current development rates: a factory alone does not transform society.\n\nThe treasury funds individual projects, while the weekly balance shows recurring costs. Compare the upkeep of new institutions with income before starting another programme."
 RUS_startup_guide_bunker:0 "§YTHE BUNKER AS PART OF THE COUNTRY§!\n\n§YLayers and rooms§!\nExcavation opens layers; fitting them determines their purpose. Each layer offers alternatives. Workshops support industry, clinics recover casualties and laboratories accelerate research. Read requirements, price, duration and final effects before ordering work.\n\n§YPower§!\nGenerators determine the equipment the complex can sustain. Free power is needed for rooms and upgrades. An energy sale pays immediately but reserves some free power for the contract's duration; existing rooms keep operating. Do not promise the same capacity to construction and a customer.\n\n§YFood§!\nStock, storage capacity and weekly balance describe different things: what remains, how much can be delivered and whether reserves are growing. Fitted layers consume food. A convoy replenishes stock once, while production and rations change the continuing balance. Empty stores with occupied rooms cause hunger and national penalties.\n\n§YIntegrity§!\nExcavation damages the structure. Below 40 integrity, army organisation and military factory output suffer. Reinforcement restores safety; rushed excavation needs a larger integrity reserve. Use the displayed forecast for the completed order.\n\n§YLinks to the surface§!\nWorking workshops, clinics and laboratories support relevant development programmes. Rooms help national modernisation but do not replace schools, civilian industry and institutional reforms."
 RUS_startup_guide_campaign:0 "§YFROM BORDER CAMPAIGNS TO EMPIRE§!\n\n§YCampaigns against neighbours§!\nThe opening chain assembles the aimaqs, arms the border hosts and watches the neighbouring order collapse. Focuses unlock opportunities; decisions start campaigns when their conditions are met. Several Dirty Zone campaigns can be fought simultaneously, without waiting for the previous war to end. Ordinary diplomatic war declarations and alliance creation are unavailable.\n\n§YImperial proclamation§!\nThe decision requires prepared government, control of every accessible Dirty Zone region and peace. Regions controlled by Kefreyt or its subjects do not need to be retaken before proclamation. The state's name follows the current power balance: military influence produces the Black Banner Empire; scientists or compromise produce the Last Empire. Later campaigns have their own conditions; southern and western operations require victory over the eastern hegemon first.\n\n§RRead this before proclaiming the empire§!\nOnce the empire exists and the Khan controls any region of the reactor perimeter, the orbital crisis starts automatically. It is neither a separate laboratory purchase nor an exclusive reward for one political course. Gaining access later can also trigger it.\n\nIntervention preparations last 90 days. The total time to the strike is 455 days from disclosure. Potential opponents include Montar, the Vald Union, Timer, Bayrinzh and regional victors; their actual participation depends on their circumstances.\n\nLosing the entire reactor perimeter permanently cancels the programme but does not itself end the war. The Khan's defeat dissolves the empire. Defeating the interveners does not stop an active countdown. A player completing the programme reaches world destruction and the final epilogue. Prepare the army and economy before starting that clock."
 RUS_startup_guide:0 "§YFIRST STEPS AS THE KHAN§!\n\n§Y1. Inspect the economy.§! Compare treasury, weekly balance and current laws. Plan bunker expenses alongside surface construction.\n\n§Y2. Complete the census and choose your support.§! Scientists offer a civilian and technical programme; the Black Army offers a military and administrative programme. Shared branches remain useful to both.\n\n§Y3. Supply the bunker before expanding.§! Compare free power, weekly food consumption and integrity. A completed room must remain operational.\n\n§Y4. Build lasting capabilities.§! Schools, supply services, government and development programmes gradually overcome the starting conditions. Check which decision each focus unlocks.\n\n§Y5. Watch both factions.§! Support and balance continue changing after your choice. Dominance brings strong benefits and continuing costs.\n\n§Y6. Prepare each campaign.§! Check recruits, equipment, reinforcements and roads. Political progress does not supply existing divisions.\n\n§Y7. Plan the late game.§! CBRN preparation and the airborne battleship are available to both courses. An empire with access to the reactor perimeter starts the common crisis automatically; imperial proclamation is more than a flag change."
 RUS_startup_path_0_title:0 "Scientific council"
 RUS_startup_path_1_title:0 "Black Army"
 RUS_startup_path_0:0 "§YTHE KHAN'S SCIENTIFIC COUNCIL§!\n\nEngineers, chemists and doctors kept the underground complex running for years. Their knowledge now becomes the foundation of a state programme. Rustan heads the council and ties his authority to those able to provide light, food and trained specialists.\n\n§YHow it plays§!\nThe opening chain provides industrial research assistance, a civilian factory, and additional bunker power and food production. Education can advance to technical institutes. The aimaq council opens local services, an assembly budget and a service charter.\n\nThis course supports gradual reconstruction: people and institutions first, then production and complex projects. It does not abandon armies or conquest, but makes civilian economics and knowledge the Khan's principal support. Scientific influence improves research at the expense of recruitment and military capabilities.\n\n§YShared future§!\nThe industrial belt, general army training, CBRN development and airborne battleship remain available. Bunker planning and army tactics are separate choices. Imperial proclamation and the orbital crisis follow common conditions: scientific government does not guarantee a peaceful ending.\n\nThe details list rewards, restrictions and late consequences."
 RUS_startup_path_1:0 "§YTHE BLACK ARMY'S OATH§!\n\nThe Khan makes the hosts guarding the bunker and aimaq frontiers the foundation of government. Personal loyalty binds them to Rustan; a common staff turns separate formations into a permanent force. The army demands orders backed by recruits, warehouses and working arsenals.\n\n§YHow it plays§!\nThe opening chain provides manpower and support equipment, followed by a military factory. The charter improves organisation, defence and planning; centralised depots replace early supply arrangements. The Khan's chancery opens inspections, common supply records and provincial commissioners.\n\nThis course suits a state preparing for war and governing through administrative discipline. Military influence strengthens the army but demands more supply and administrative spending. Black Army dominance also slows research and reduces stability.\n\n§YShared future§!\nCivilian industry, schools, development programmes, the bunker and laboratory projects still matter. The military course does not close CBRN preparation or the airborne battleship. Military influence at proclamation can name the Black Banner Empire; the late reactor crisis remains common to both routes.\n\nThe details explain rewards, independent choices and the boundary between ordinary expansion and the campaign's ending."
 RUS_startup_path_0_details:0 "§YSCIENTISTS: REWARDS AND LIMITS§!\n\nAfter Count the Hearths, choose the scientific council. The Black Army oath and its dedicated continuation close. Later balance changes do not remove this exclusion.\n\n§YOpening programme§!\n- The council: one 50% industrial research bonus, a shift towards scientists and increased scientific support.\n- Council workshops: one civilian factory in the capital region while it is owned and controlled.\n- Underground light and food: +1 bunker power and +1 weekly food production. Technical institutes replace early education laws; a more specialised existing law is preserved.\n\n§YGovernment branch§!\nThe aimaq council leads to local services, an assembly budget, mutual assistance and a service charter. General administration and social and economic development need their own focuses and paid programmes. Choosing scientists does not grant every reform immediately.\n\n§YSeparate choices§!\nAn open underground city or sealed headquarters determines the bunker's role; surface contracts or the underground fund sets an economic priority; positional preparation or mobile columns determines a military approach. These are independent branches.\n\n§YLate projects§!\nThe airborne battleship requires experimental laboratories, reactor perimeter access and payment. Both routes can build it even at extreme power balance. Its unique hull cannot be rebuilt after loss.\n\n§REmpire and reactor§!\nAn empire controlling any perimeter region automatically starts the crisis. The countdown lasts 455 days; intervention begins after the first 90. Defeating the coalition does not cancel the strike. Losing the whole perimeter permanently disables the programme, the Khan's defeat dissolves the empire, and player completion destroys the world."
 RUS_startup_path_1_details:0 "§YBLACK ARMY: REWARDS AND LIMITS§!\n\nAfter Count the Hearths, choose the Black Army oath. The scientific council and its dedicated continuation close. Mark Rustan leads both political pillars; the military course does not appoint another ruler.\n\n§YOpening programme§!\n- The oath: 2000 £manpower_texticon and 80 £support_equipment_texticon, a military balance shift and increased army support.\n- Black Army staff: one military factory in the capital region while it is owned and controlled.\n- Black Banner charter: +3% organisation, +5% defence and +3% planning through permanent army reforms. Centralised depots replace early supply laws; a more specialised existing law is preserved.\n\n§YChancery and discipline§!\nThe chancery leads to inspections, common supply records, commissioners and civil service training. Census, schools, workshops, social programmes and shared industrialisation remain available independently of the chosen pillar.\n\n§YBalance is not the focus choice§!\nThe military course and current military influence are separate. Support measures can move the balance after the branch is chosen. At proclamation, military influence above 10% gives the Black Banner Empire name; scientists and compromise give the Last Empire.\n\n§YIndependent branches§!\nTactics, surface contracts or underground funding, and an open city or sealed headquarters have their own focuses. Laboratories, CBRN preparation and the unique airborne battleship do not require switching to the scientific course.\n\n§RThe late war§!\nAfter imperial proclamation, reactor perimeter access automatically triggers the common crisis. Intervention begins after 90 days; the total countdown is 455 days from disclosure. Defeating the interveners does not stop it. Losing the entire perimeter permanently cancels the programme but leaves the war running. The Khan's defeat fragments the state; player completion destroys the world."

# --- rus_starting_ideas ---
 RUS_aimaq_compact: "Free Communities of the Khanate"
 RUS_aimaq_compact_desc: "The Khanate is held together by the habit of disputing every order, rather than by orders themselves. Local communities are armed, stubborn and rarely ask the capital for permission to survive.\n\nThese free communities collect taxes poorly and tolerate authority even less. But when a foreign boot steps onto their soil, yesterday's disputants quickly remember that freedom sometimes speaks in volleys."
 RUS_last_empire_spirit: "The Last Empire"
 RUS_last_empire_spirit_desc: "The free communities have not disappeared, but they no longer dispute their own commands. The aimags, sotnias and the Khan's chancery have been assembled into a single state that calls itself the last empire among the ruins of the western belt.\n\n\n\n\n\n £GFX_RUS_chancery_mandate_banner \n\n\n"
 RUS_crisis_world_ended_title:0 "THE END OF THE WORLD"

 ADISCORD_rus_campaign.26.t:0 "Until the End of the Lesson"
 ADISCORD_rus_campaign.26.d:0 "In the dream, he always noticed the sleeves first. The land was not yet called Vorkerland. School exercise books bore the words Veyran Empire, with two lines beneath the coat of arms: one for the pupil's name, the other for his caste. The lower line had to be filled in first. The teacher said it helped prevent misunderstandings. After the revolution, the coats of arms were torn down, the streets renamed, the old forms used as kindling. Mark Rustan had watched exercise books like those burn. He thought he might finally be able to forget. But in the dream, the lower line was always filled in.\n\nThe sleeves were white, with two mother-of-pearl buttons at the wrist. Children of his caste were allowed one, made of bone. Every morning the teacher inspected their cuffs before asking about their lessons. She took each small hand between two fingers, turned it towards the light and let it go. Afterwards, she straightened some children's collars. She told the others to step aside.\n\nThey stood between the map cupboard and the classroom door. The older boy was eating an apple. He peeled it in one thin, unbroken strip, and Mark watched it sway beside his boot. Looking someone in the face was insolence. Looking at the floor meant you were hiding bad intentions. He had never found the right place to look. Behind the door, they were explaining how the Veyran Empire worked.\n- Each estate is entrusted with its own service.\n\nThe boy asked him to lift his chin. His voice was bored, almost gentle. It was the voice you used when asking someone to hold your books while you tied a shoelace.\n\nMark looked towards the end of the corridor. The younger children's teacher stood there. She had seen the knife. He knew because her eyes dropped to the other boy's hand, then rose to his white cuffs. She went into the staff room. She turned the handle carefully so the door would not slam.\n\n- Don't move, the boy said. It'll come out crooked.\nMark backed against the cupboard. There was nowhere else to go. When it began to hurt, he was surprised that the lesson behind the door continued. The teacher was saying the same words. Children were turning pages. For some reason, he had expected everything to stop."
 ADISCORD_rus_campaign.26.a:0 "Wake up"
 ADISCORD_rus_campaign.26.continue:0 "Enter the classroom"
 ADISCORD_rus_campaign.27.d:0 "He entered the classroom with his palm pressed to his cheek. The teacher stopped halfway through a sentence. He looked at Mark, then at the boy in the doorway. The boy had put away the knife and was still holding the apple.\n- What happened?\nMark began to answer.\n- I am asking your senior.\nHis senior said they had been playing. The teacher nodded. So quickly, as though those were the only words he had been waiting for. Then he asked someone to close the door: there was a draught from the corridor.\n\nMark was still standing in front of the first desk. If he moved his hand, the teacher would see. He would have to see how serious it was.\n- Go outside and make yourself presentable.\nA chart of rights and duties hung on the wall. Mark knew his own row by heart. Reading the others was permitted, but the teacher disliked questions about them.\n- It hurts, he said.\nA few children turned to look. The teacher waited until they were sitting straight again.\n- That does not exempt you from the rules of conduct.\n\nIn the dream, silence always followed. The teacher came over, took his wrist and moved his palm away from his face. He examined the cheek carefully. Mark stopped breathing with relief. Now he had seen it. The teacher took out a handkerchief. He wiped his own fingers.\n- Bring a cloth tomorrow. You must clean up after yourself.\nAnd he returned to the blackboard.\n\nMark tried to leave, but the door opened into the same classroom. He was standing in front of the first desk again. The teacher was looking at the cuffs again. Somewhere behind the cupboard a child began to cry, and Mark recognised his own voice before he opened his mouth. Then the bell rang. The teacher waited for it to stop. The bell did not stop.\n\nAfter waking, Mark sat in the dark for a long time, his palm pressed to his face. Outside the door, the duty officer shifted from foot to foot.\n- Did you call?\nHe wanted to ask for water. The simple word would not come. First, he needed permission."
 ADISCORD_rus_campaign.27.a:0 "The lesson is over"

 ADISCORD_rus_campaign.28.t:0 "A Clean Page"
 ADISCORD_rus_campaign.28.d:0 "Mark Rustan could not remember who had taken him to the school superintendent. In the dream, he was always already sitting in a chair before the desk. His feet did not reach the floor. The bandage pulled tight against his cheek, and he was afraid to move his mouth: it felt as though something beneath the cloth might open again. The superintendent placed a clean sheet of paper before him.\n- Tell me what happened. In order.\nMark began with the map cupboard. The apple. The teacher at the end of the corridor. The superintendent listened carefully, nodding from time to time. He checked the time and asked for witnesses' names. When Mark faltered, he even offered him water. For the first time that morning, he felt a little better.\n\nBehind the superintendent hung the coat of arms of the Veyran Empire and the school timetable. Beneath them stood a cupboard of personal files. Glass doors covered the upper shelves. The lower ones, where the papers of children from his caste were kept, were packed so tightly that some folders had to be forced in with a knee.\n\nThe superintendent asked for the older boy's surname. The pen stopped. He looked at Mark again. Then he took out another form and laid it over the first.\n- Do you understand that this is a serious accusation?\nMark nodded.\n- Then try not to get anything else confused.\n\nThe younger children's teacher arrived almost at once. In the office, she smelled of cold air and soap. Mark turned his whole body towards her. She stood by the door, so close. Now she did not have to enter the corridor or take away the knife. All she had to do was speak.\n- Did you witness the incident?\n- I saw the children talking.\n- A weapon?\nShe adjusted her cuff.\n- Senior pupils are permitted personal cutlery.\nThe superintendent wrote down her answer.\n\nThen the classroom teacher came in. He confirmed that Mark had entered without permission, interrupted the explanation and refused to leave at once. The superintendent asked separately about his cheek.\n- What condition was the pupil in?\n- Agitated. Speaking incoherently.\nMark wanted to object, but the superintendent raised a finger. He had not finished writing. Both teachers left. Neither looked at him before closing the door."
 ADISCORD_rus_campaign.28.a:0 "Wake up"
 ADISCORD_rus_campaign.28.continue:0 "Hear the superintendent out"
 ADISCORD_rus_campaign.29.d:0 "- Listen carefully, the superintendent said. We want to help you here. But help begins with honesty.\nHe read aloud what he had written. It appeared that Mark had harassed a senior pupil, been reprimanded and then attempted to slander his family. The bandage was mentioned too: 'Arrived with part of his face concealed.'\n- But underneath it...\n- Take it off.\n\nMark obeyed. The superintendent leaned closer. He studied the cheek for a long time. Then he slid a small mirror towards him. The skin was unbroken. Mark ran his fingers over it. Again. The pain remained exactly where it ought to be. The superintendent waited patiently.\n- Now do you understand why you must not speak too hastily?\n\nA child began to cry on the other side of the wall. Mark lifted his head. There was a windowless storeroom there. He had once helped carry broken desks inside and knew it had no second door. The child spoke through the tears. About the map cupboard, the apple, the teacher.\n\nThe superintendent moved the inkwell closer.\n- Write here that you have no complaint.\nBeyond the wall, someone asked for the older boy's surname. The crying stopped.\n\nMark looked at the sheet. It was completely blank now. No testimony, no accusation, no space for a signature. The superintendent still pointed to where he should write. The pen scratched the paper. The ink left no mark.\n- Press harder.\nMark pressed. Something sobbed quietly beneath the desk. The superintendent covered the sheet with his palm.\n- There we are. Now it never happened.\n\nAfter waking, Mark felt his cheek for a long time. He traced the uneven scar with a finger, returned to its beginning and traced it again. Only when he heard the morning footsteps outside the door did he allow himself to lower his hand."
 ADISCORD_rus_campaign.29.a:0 "I remember"

 ADISCORD_rus_campaign.30.t:0 "The Place by the Window"
 ADISCORD_rus_campaign.30.d:0 "Mark Rustan recognised the school by the smell of wet wool. Over the years he had forgotten its address, the colour of its roof, even how many floors it had. But the smell remained: children's coats drying beside the stove, the younger pupils forbidden to move away until the fabric stopped steaming. Children of the higher castes had a separate cloakroom. A woman with warm hands took their things.\n\nHis guards stood at the entrance now. Mark could not remember why he had ordered them to bring him here. One of his escorts was already holding the door. Another waited for instructions by the stairs. Everything was as it should be: first they checked the building, then he went inside.\n- No one inside, the officer reported.\nUpstairs, a chair scraped across the floor. Mark went up alone. He knew which step would creak. He stepped over it before he remembered.\n\nPale rectangles remained on the walls where portraits had been removed. Only the coat of arms above the classroom door was still in place. Beneath it, in gold letters: Veyran Empire. No dust, no traces of the revolution. Someone had wiped the plaque recently. A drop of water still clung to its lower edge.\n\nHe opened the door. The children stood. They were all the same age as before. The girl by the stove hid her fingers inside her sleeves. A pencil case with a broken lid lay on the second desk. A boy in the back row held a hand against his ear, though Mark no longer remembered why. The teacher stood beside the blackboard.\n- We have been expecting you.\n\nMark looked at the map cupboard. It was closed. By the door, where he had once stood with his palm against his cheek, the floor had been scrubbed down to pale wood.\n- Carry on, Mark said.\nThe teacher did not move. The children remained standing. Mark repeated himself, louder. The girl by the stove flinched, but no one sat down. Then the teacher cautiously indicated the empty desk by the window.\n- Your place.\n\nMark recognised it at once. The boy with the white cuffs had sat here. There was a good view of the yard; in winter an extra brazier stood beside this desk. Those sitting nearby were forbidden to block the light.\n- I used to sit somewhere else.\nThe teacher looked towards the back of the classroom, where the last desk almost touched the wall.\n- The register has already been corrected.\n\nMark wanted to say that nothing needed correcting. But the children were still standing. One boy began to sink slowly as his cramped legs gave way. The teacher noticed. Mark sat down. The chairs came down together."
 ADISCORD_rus_campaign.30.a:0 "Wake up"
 ADISCORD_rus_campaign.30.continue:0 "Look at the desk"
 ADISCORD_rus_campaign.31.d:0 "The desk was too small. His knees pressed against the wood. On its lid lay an apple, peeled in one long, unbroken strip. An open pencil case stood beside it. The knife was inside.\n\nMark turned towards the door. His officers sat in the back row. Their greatcoats were buttoned, their hands folded before them. One met his gaze and immediately looked at the blackboard.\n- We have a new pupil today, the teacher said.\nA boy stood in the doorway, wearing boots that were too large. Mark could not make out his face. He was looking at the single bone button at the wrist. At the other hand, with which the boy held up a sleeve that was too long.\n\n- Come here, the teacher said.\nThe boy approached the first desk.\n- Introduce yourself.\nHe said something. Mark did not hear it.\n- Louder. No one will hurt you here.\n\nMark put his palm over the pencil case, covering the knife. The boy stopped speaking. The teacher followed his gaze and gave the patient smile he reserved for explaining simple things.\n- You must not stare at other people's belongings.\n\nMark stood up. Everyone sprang up after him. He meant to walk around the desk, but the boy backed towards the map cupboard. He knew exactly where to go. The back of his head was already touching the wood.\n- I only...\nMark heard his own voice. Low, adult, irritated at having been misunderstood again. The teacher took the boy by the shoulders.\n- Stand still when you are being spoken to.\n\nMark looked at his own hands. The pencil case was still on the desk. He was holding the knife.\n\nWhen he woke, he jerked his hand away from the edge of the bed. A chair creaked outside the door: the duty officer had risen at the sound. Mark sat until his breathing steadied. Then he asked the officer to sit down. The reply came through the door:\n- Yes, sir.\nThe chair did not creak again."
 ADISCORD_rus_campaign.31.a:0 "This is not why I came here"

 ADISCORD_rus_campaign.32.t:0 "Until the Bell"
 ADISCORD_rus_campaign.32.d:0 "This time, Mark Rustan was quick enough. He caught the other boy's wrist before the blade touched his cheek. He did not understand how. He simply knew when the boy would stop chewing, when he would tilt his head slightly, when he would say the familiar words.\n- Don't move.\nMark was already holding his arm.\n\nFor a few moments, nothing happened. The lesson continued behind the door. The younger children's teacher stood at the end of the corridor. Everything was in its place, but the pain did not come. Mark carefully touched his cheek with his free hand. The skin was unbroken. He almost laughed.\n\nThe boy jerked, trying to break free. The mother-of-pearl buttons struck Mark's fingers. The knife remained open.\n- Let go.\nMark tightened his grip. For the first time, his senior looked him straight in the eye. Without boredom. Without the certainty with which he had shown the knife. Now he too was waiting for someone to come over.\n\n- Teacher! Mark called.\nSilence fell behind the door. He called again, louder. The teacher at the end of the corridor turned towards them. Mark had time to think that she would leave again, carefully closing the door behind her. But she came over.\n\nThe classroom teacher came out next. Behind him appeared the superintendent, his keys on a chain. The woman from the higher castes' cloakroom arrived, wiping her hands on her apron. Even the headmaster, whom Mark had only seen at celebrations, came down from his floor. They stood in a semicircle. Everyone was looking at the knife.\n\nMark deliberately turned the other boy's hand so that everyone could see the blade. He was afraid someone might later say they could not make it out from where they stood.\n- He wanted to cut me.\nThe teacher nodded. Mark fell silent in surprise.\n- We can see, the headmaster said.\nThe corridor was bright. The coat of arms of the Veyran Empire hung beneath the ceiling. This time no one blocked it with a shoulder; no one pretended to be busy. Mark could see every face. Now it had to end. He waited.\n\nThe boy pulled at his arm again. Mark's fingers began to tremble.\n- Take it away from him.\nNo one moved. The headmaster looked at the superintendent. The superintendent turned to the teacher. The teacher adjusted his collar and asked:\n- Can you hold on for now?\nMark did not understand.\n- So he doesn't hurt anyone.\nHe nodded. Of course he could. A little longer. The adults visibly relaxed.\n\nChildren peered out of the classroom. The teacher told them not to crowd the doorway. Someone asked whether break would come soon. She said they would have to be patient. Mark held on."
 ADISCORD_rus_campaign.32.a:0 "Wake up"
 ADISCORD_rus_campaign.32.continue:0 "A little longer"
 ADISCORD_rus_campaign.33.d:0 "His fingers slowly went numb. The older boy's wrist grew slippery, and Mark had to grasp it with his other hand. Now he could no longer check his cheek.\n- I can't hold on any more.\nThe teacher crouched before him. Mark had never seen his face so close. Tired eyes. A small crack in the lower lip. A pillow crease on his cheek: the teacher must have slept later than usual that morning.\n- Just until the bell.\nHe said it quietly, almost confidentially. As though the two of them understood something the others could not.\n\nMark looked at the clock. There was no minute hand. He wanted to show the teacher, but the man had already straightened up.\n\nThere were more adults now. They stood along the walls, leaving a narrow passage down the middle. Everyone kept their proper place. Those with a single button on their cuffs stayed closer to the stairs. No one left. No one helped.\n\nThe older boy had stopped trying to break free. He looked at his own arm as though it belonged to someone else.\n- It hurts, he said.\nThe teacher bent down at once.\n- Did you hear him? Be careful.\nMark tried to loosen his grip. The knife immediately moved towards his face. He seized the wrist with both hands again. Someone among the adults sighed in disapproval.\n\nMark wanted to scream, but he was afraid that screaming would make his fingers open. So he only looked at them, one by one. At the teacher. At the superintendent. At the woman with warm hands. The headmaster took out his watch, opened the cover and put it away without looking at the dial.\n- Well then, he said. Everything is quiet for now.\n\nMark woke with his hands clenched together at his chest. For a long time he opened his fingers one by one. The room was dark. The scar on his cheek hurt, though he had not touched it. Outside the door, the duty officers spoke quietly.\n- Wake him?\n- No need. Everything is quiet for now."
 ADISCORD_rus_campaign.33.a:0 "When will the bell ring?"

 ADISCORD_rus_campaign.34.t:0 "You May Go"
 ADISCORD_rus_campaign.34.d:0 "The bell rang as Mark Rustan opened the door. An ordinary school bell. A slight rattle, a brief strained note before the end. Mark remembered the sound, though in every previous dream it either never began or could not stop. Now it had stopped.\n\nThe classroom doors swung open. Children poured into the corridor, talking and bumping shoulders. Someone ran down the stairs, holding a bag. The teacher reprimanded them, but without her former severity: lessons were over, and the offence no longer mattered much. Mark stood against the wall, letting them pass. No one feared him. No one stood when he approached. A girl caught him with her elbow, muttered an apology and ran on. For the first time, he thought he might leave with everyone else.\n\nDownstairs, coats were being collected. The woman with warm hands fastened the younger children's buttons. Through the open doors he could see the street. Snow was falling. Parents waited by the fence, horses shifted their weight, a cabman adjusted a blanket. The coat of arms of the Veyran Empire hung on the wall. It was small. An ordinary tin plaque with darkened edges. For some reason, Mark had imagined it much larger.\n\nThe superintendent came down last. He carried the register under one arm and sorted through his keys with the other hand.\n- Still here?\nMark looked at the open door.\n- May I go?\nThe superintendent looked surprised.\n- Of course. It's all over.\nHe walked past. The keys jingled beside Mark's ear, and he felt such relief that he had to brace a palm against the wall.\n\nThen a chair moved upstairs. Mark lifted his head.\n- Someone's still there.\nThe superintendent stopped at the exit.\n- One pupil. No one has come for him yet.\n- Who?\n- You know him.\nSomeone called to the superintendent from outside. He turned up his collar and left. The door stayed open. Mark could see the street all the way to the stairs.\n\nThe upstairs lights were already out. Only a lamp above the teacher's desk burned in the familiar classroom. A narrow yellow strip stretched beneath the door. The boy sat at the last desk. His boots did not reach the floor. One sleeve was turned back; the other covered his fingers. The bandage had been removed from his cheek. Mark could see the uneven line he would later find on his own face every day. A clean sheet of paper lay on the desk. There was no knife anywhere.\n\n- Come on, Mark said.\nThe boy raised his head. He was not surprised. As though he had been waiting for this particular visitor and had begun to fear he would not come.\n- The lesson is over, Mark repeated.\n- I heard.\n- Then get up."
 ADISCORD_rus_campaign.34.a:0 "Wake up"
 ADISCORD_rus_campaign.34.continue:0 "Hold out a hand"
 ADISCORD_rus_campaign.35.d:0 "The boy obediently climbed down from his chair. He approached the door and stopped before the threshold. Mark held out his hand. Small fingers settled into his palm. Cold, a little sticky. He pulled gently, then harder. The boy did not move. He did not resist. He did not hold the doorframe. He simply remained on the other side, however hard Mark pulled.\n\n- I haven't been given permission.\nMark felt himself growing angry.\n- I'm giving you permission.\nThe boy looked up at him.\n- Who are you?\n\nMark opened his mouth. He could give his name. His title. List the people who would carry out his orders. His guards were waiting downstairs. Somewhere there was a telephone into which he needed only to say a few words. But here it would all sound the way it had always sounded in this corridor. He knelt.\n- I've come for you.\n\nThe boy looked at his cheek. Then he carefully touched the scar with one finger.\n- So it does stay?\nMark nodded.\n\nA switch clicked behind him. The corridor grew darker. The younger children's teacher stood by the stairs.\n- We need to close.\nMark did not turn.\n- He can't get out.\n- Yes.\nShe said it without surprise. Mark tightened his grip on the child's hand.\n- Then I'll stay.\n\nThe teacher waited. She had always known how to wait until a child realised for himself how inconvenient he was being. Downstairs, the front door slammed. Mark could no longer see the street.\n- You have things to do in the morning, she said.\nHe wanted to reply that he had nothing to do. But he had already remembered the desk in the bunker, the folders laid ready, the people who would be waiting for him to wake. He remembered how long it had been since he had slept until morning.\n\nThe boy was still holding his hand.\n- Will you come again?\nMark looked at him. He needed to say yes. The teacher stood beside the light switch. Mark felt the little fingers open. Not all at once. One by one, as though the boy was trying to do it so the adult would not have to free his own hand.\n- I'll wait, he said.\n\nMark stepped into the corridor. Before closing the door, he looked back. The boy was already sitting at the last desk, his hands laid before him. Mark turned the handle carefully so the door would not slam.\n\nIn the morning, he woke before the duty officer. For the first time in months, his hands did not hurt. The pillow was dry. He lay still, listening to the ventilation, and knew he would never return to that school. When breakfast arrived, Mark asked them not to close the door. The duty officer stopped on the threshold.\n- Are you expecting someone?\nFor a long time Mark stared past him, into the empty corridor."
 ADISCORD_rus_campaign.35.a:0 "Leave it open"

 # National commissions and the final requests
 RUS_work_order_idle_tt:0 "The shared construction and artillery order queue is free."
 RUS_work_order_refund_tt:0 "Losing control of the bunker or Khan rule cancels the order and refunds every payment. Construction also refunds if the site has no room left."
 RUS_civil_factory_order:0 "Commission a civilian factory"
 RUS_civil_factory_order_desc:0 "The construction board will prepare a site in [66.GetName] and deliver its machinery.\n\nDuration: 45 days. Result: one civilian factory. Construction and artillery orders share one queue. Cooldown after completion: 180 days. Loss of control, Khan rule or building capacity refunds the entire payment."
 RUS_civil_factory_order_site_lost_tt:0 "The Khan has lost power or the bunker in [66.GetName]; the civil construction programme is unavailable or the state has no free civilian factory slot"
 RUS_civil_factory_order_site_tt:0 "The Khan rules; we own and control the bunker in [66.GetName], with room for a civilian factory."
 RUS_civil_factory_order_result_tt:0 "After §Y45 days§!: §G+1§! civilian factory in [66.GetName]. Occupies the shared order queue."
 RUS_artillery_order:0 "Commission a battery equipment set"
 RUS_artillery_order_desc:0 "Trained batteries will receive a serial batch of guns and tools.\n\nDuration: 30 days. Delivers 120 basic artillery pieces to the national stockpile. Shares the civilian factory order queue. Cooldown after completion: 90 days. Loss of bunker control or Khan rule refunds the entire payment."
 RUS_artillery_order_site_tt:0 "The Khan rules and we own and control the bunker in [66.GetName]."
 RUS_artillery_order_result_tt:0 "After §Y30 days§!: §G120§! basic artillery pieces for the national stockpile. Occupies the shared order queue."
 RUS_district_relief:0 "Fulfil district representatives' requests"
 RUS_district_relief_desc:0 "District representatives have compiled requests for food and repairs to public buildings. The council will distribute aid from bunker stocks.\n\nAid arrives immediately. Cooldown: 90 days. After the imperial proclamation, keeping these promises also restores army morale."
 RUS_district_relief_available_tt:0 "District representation is established and the Khan retains power and control of the bunker."
 RUS_district_relief_result_tt:0 "Stability: §G+2%§!. Scientist support: §G+5 percentage points§!. After the imperial proclamation, army morale: §G+5§!."
 RUS_machine_reserve_granted_tt:0 "One machinery reserve is ready. Release all of it for production or spend part on emergency bunker repairs. Choose through national development decisions."
 RUS_machine_reserve_release:0 "Release the machinery reserve for production"
 RUS_machine_reserve_release_desc:0 "Issue the tools to workshops and release the reserve budget. This consumes the entire reserve and closes its emergency repair option."
 RUS_machine_reserve_release_available_tt:0 "The bunker is operational and the machinery reserve is unused."
 RUS_machine_reserve_release_result_tt:0 "To the national stockpile: §G400§! £support_equipment_texticon. To the treasury: §G600§! £ADISCORD_economy_treasury_texticon. The machinery reserve is fully consumed."
 RUS_machine_reserve_repair:0 "Use the machinery reserve for emergency repairs"
 RUS_machine_reserve_repair_desc:0 "Emergency crews will replace damaged pumps and doors from the reserve. Available at integrity 40 or lower. Repairs are immediate and neither occupy nor cancel the paid bunker construction queue. The remaining tools and budget go to the country. The reserve can only be used once."
 RUS_machine_reserve_repair_available_tt:0 "The bunker is operational, the reserve is unused and integrity is 40 or lower."
 RUS_machine_reserve_repair_result_tt:0 "Bunker integrity: §G+60§! (up to 100). To the stockpile: §G200§! £support_equipment_texticon. To the treasury: §G300§! £ADISCORD_economy_treasury_texticon. The machinery reserve is fully consumed."
 RUS_last_sky_closed_tt:0 "The programme has ended or this request has already been answered. Close without consequences."
 ADISCORD_rus_crisis.21.t:0 "The evacuation list"
 ADISCORD_rus_crisis.21.d:0 "An engineer brought two folders to the Khan. One held orbital calculations; the other listed doctors, teachers and archive keepers. The second folder had no place in the transport plan.\n\nThe people whom the state taught to read drawings and treat wounds now ask for space for their families and boxes of records. The engineer does not dispute the order. He asks who will need the calculations if no one remains to explain them to children.\n\nTransport and accommodation require 50 £ADISCORD_economy_treasury_texticon and 50 £support_equipment_texticon. Evacuation will not stop the orbital countdown."
 ADISCORD_rus_crisis.21.course.d:0 "The scientific council met in the room where the Khan once promised to make knowledge a matter of state. Lists of doctors and teachers, archive inventories and transport requests now cover the table. Workshops still fulfil military orders; no vehicles were reserved for these people.\n\nThe speaker asks to preserve those who can still heal and teach. Nobody asks aloud what will remain above ground. The Khan hears only the rustle of paper.\n\nTransport and accommodation require 50 £ADISCORD_economy_treasury_texticon and 50 £support_equipment_texticon. Evacuation will not stop the orbital countdown."
 ADISCORD_rus_crisis.21.decline:0 "Keep the transport at the front's disposal."
 ADISCORD_rus_crisis.21.accept:0 "Assign vehicles and prepare accommodation."
 RUS_last_sky_science_accept_tt:0 "Cost: §R50§! £ADISCORD_economy_treasury_texticon and §R50§! £support_equipment_texticon. Scientist support: §G+10 percentage points§!. Army morale: §G+5§!. The strike deadline is unchanged."
 RUS_last_sky_science_decline_tt:0 "Scientist support: §R-10 percentage points§!. Stocks remain with the country. The strike deadline is unchanged."
 ADISCORD_rus_crisis.22.t:0 "Those who must relieve the guard"
 ADISCORD_rus_crisis.22.d:0 "The regiments sent the same requests: rest for instructors, accommodation for wounded officers, and food for the men being trained to relieve them. The officer school still graduates junior commanders, but more and more leave without their promised supply column.\n\nThe reserve chief laid a ledger before the Khan. It lists no new divisions. It names serving soldiers who were promised trained replacements. He asks for accommodation funds and access to the food stores.\n\nThis requires 35 £ADISCORD_economy_treasury_texticon and 30 £supply_texticon from bunker stocks. Deployed units hold their positions; no new formations are created."
 ADISCORD_rus_crisis.22.course.d:0 "Black Army headquarters still remembers the oath. Every aimaq promised men; the capital promised supplies and a common reserve. Now commanders have returned a copy of that order. Its margins list dead instructors and companies without replacements for exhausted officers.\n\nThey do not demand that the perimeter guards withdraw. They demand food and quarters for the replacement cadre while it can still be trained. The Khan looks at his own seal beneath the old promise.\n\nThis requires 35 £ADISCORD_economy_treasury_texticon and 30 £supply_texticon from bunker stocks. Deployed units hold their positions; no new formations are created."
 ADISCORD_rus_crisis.22.decline:0 "The reserve must wait its turn for supplies."
 ADISCORD_rus_crisis.22.accept:0 "Open the stores for the replacement cadre."
 RUS_last_sky_army_accept_tt:0 "Cost: §R35§! £ADISCORD_economy_treasury_texticon and §R30§! £supply_texticon. Black Army support: §G+10 percentage points§!. Army morale: §G+8§!. The strike deadline is unchanged."
 RUS_last_sky_army_decline_tt:0 "Black Army support: §R-10 percentage points§!. Army morale: §R-5§!. Stocks remain with the country."
 ADISCORD_rus_crisis.23.t:0 "A promise above ground"
 ADISCORD_rus_crisis.23.d:0 "A bundle of the Khan's charters arrived at the bunker gates. They named postal stations, schools, clinics and homes promised protection. The envoys did not know which promises still stood. They asked for food and shelter funds before the roads closed.\n\nA radio operator had prepared an address about resolve. One envoy asked whether they might receive a supply column instead of another address. The prepared text contained no answer.\n\nAid requires 35 £ADISCORD_economy_treasury_texticon and 40 £supply_texticon from bunker stocks. It will help people now; it will not rescind the strike order."
 ADISCORD_rus_crisis.23.course.d:0 "District representatives took their places at the common table. When first admitted to the Khan, they reported on water, housing and workshops. Today every ledger ends with the same question: how many people can still be sheltered, and what will feed them?\n\nEach has a copy of the charter granting representation. Nobody waves it. The eldest places his beside the list of those in need and asks that this request be fulfilled before the roads close. Outside, the radio service waits with another address to the aimaqs.\n\nAid requires 35 £ADISCORD_economy_treasury_texticon and 40 £supply_texticon from bunker stocks. It will help people now; it will not rescind the strike order."
 ADISCORD_rus_crisis.23.decline:0 "The stocks must remain underground."
 ADISCORD_rus_crisis.23.accept:0 "Send the promised aid."
