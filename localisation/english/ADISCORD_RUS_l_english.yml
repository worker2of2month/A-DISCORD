 RUS_restore_wasteland_desc:0 "Restore [FROM.GetName]: §Y120 days§!.\nResult: §Ywasteland -> rural§!; §G+1§! infrastructure level, capped at §Y5§!. One project at a time.\n\n§RCancelled§! if ownership or control is lost, the state category changes, or Khan rule ends. §GFull payment refunded.§!\nCompleted improvements survive a change of owner."
