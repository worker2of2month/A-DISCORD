 RUS_bunker_clinic_compact:0 "Clinic"
 RUS_bunker_clinic_ui_tt:0 "§YSurgical Level§!\n§G+16%§! casualty trickleback.\n\nCost: [GetRUSBunker17pp]  [GetRUSBunker17cash]  [GetRUSBunker17equipment]\nDuration: §Y28 days§!\nUpkeep: §Y2§! £energy_consumption_texticon; §Y1§! £supply_texticon per week.\n\nPaid programme while operational: Train District Paramedics grants §G+40§! £ADISCORD_country_development_texticon social-system progress instead of 25.\n\n[GetRUSBunkerRoomclinic]\nRequires focus: [GetRUSBunkerRecipe4].\n\n[GetRUSBunkerForecastclinic]"
 RUS_bunker_laboratory_compact:0 "Laboratory"
 RUS_bunker_laboratory_ui_tt:0 "§YDeep Laboratory§!\n§G+10%§! research speed.\n\nCost: [GetRUSBunker18pp]  [GetRUSBunker18cash]  [GetRUSBunker18equipment]\nDuration: §Y28 days§!\nUpkeep: §Y3§! £energy_consumption_texticon; §Y1§! £supply_texticon per week.\n\nReactor Alloys: an extra §G50%§! research bonus for one support technology if the laboratory operates at completion. The airborne battleship is also available with a clinic.\n\n[GetRUSBunkerRoomlaboratory]\nRequires focus: [GetRUSBunkerRecipe4].\n\n[GetRUSBunkerForecastlaboratory]"
