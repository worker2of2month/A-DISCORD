 RUS_bunker_guard:0 "Level 1: Internal Guard Barracks"
 RUS_bunker_guard_desc:0 "The guard will have permanent barracks and a training yard beneath a concrete sky. Discipline begins with a bed that a soldier does not share with a crate of ammunition.\n\nConstruction: §Y28 days§!. One room per level.\nFood upkeep: §Y1§! £supply_texticon per week.\n\n[GetRUSBunkerForecastguard]"
