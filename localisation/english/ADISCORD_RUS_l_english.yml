 RUS_bunker_water:0 "Level 2: Closed Water Circuit"
 RUS_bunker_water_desc:0 "Filters, tanks and a pump workshop will provide the garrison with clean water and field units with replacement parts. Water will cease to be a daily gamble.\n\nConstruction: §Y28 days§!. One room per level.\nFood upkeep: §Y1§! £supply_texticon per week.\n\n[GetRUSBunkerForecastwater]"
