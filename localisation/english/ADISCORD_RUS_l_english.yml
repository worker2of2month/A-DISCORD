 ADISCORD_rus_crisis.34.t:0 "The First Drop over the Steppe"
 ADISCORD_rus_crisis.34.d:0 "In the morning three transports bearing the Vorkerland emblem passed over the bunker. Parachutes opened over the wasteland, and Black Army pickets gathered sacks of grain, crates of tinned food and barrels of oil until dark. The flight commander's note said only one thing: help will keep coming while Vorkerland has fuel.\n\nThe quartermasters want to take the load straight down to the stores. The treasurers object: the aimaqs will pay well for such tins, and the treasury needs money more."
 ADISCORD_rus_crisis.34.a:0 "Take the load down to the stores."
 ADISCORD_rus_crisis.34.b:0 "Sell the load to the aimaqs."
 ADISCORD_rus_crisis.35.t:0 "The Second Drop"
 ADISCORD_rus_crisis.35.d:0 "The planes came again, but now there are two of them and half as many parachutes. The pilots who landed by the bunker to refuel speak reluctantly: Vorkerland is cutting rations for its own garrisons, and committees ration the fuel. Half of the load is last year's grain.\n\nIf this goes on, the next drop will be the last."
 ADISCORD_rus_crisis.35.a:0 "Take the load down to the stores."
 ADISCORD_rus_crisis.35.b:0 "Sell the load to the aimaqs."
 ADISCORD_rus_crisis.36.t:0 "The Last Plane"
 ADISCORD_rus_crisis.36.d:0 "A single transport crossed the steppe. It dropped a few sacks and turned west without a second pass. Later the radio operators made out intercepted traffic: in Vorkerland the commanders are dividing the depots, garrisons are seizing the airfields, and the last fuel is kept for a war of their own. The aid is over.\n\nFrom now on the bunker can rely only on its own farms, aimaqs and convoys."
 ADISCORD_rus_crisis.36.a:0 "Take what there is down to the stores."
 ADISCORD_rus_crisis.36.b:0 "Sell the remains to the aimaqs."
 ADISCORD_rus_crisis.37.t:0 "The Sky Is Empty"
 ADISCORD_rus_crisis.37.d:0 "The appointed day passed, but the Vorkerland planes never came. The western frequencies carry only orders, curses and the call signs of units that no longer obey the capital. Unrest has begun in Vorkerland, and no one there will remember their hungry neighbours.\n\nFrom now on the bunker can rely only on its own farms, aimaqs and convoys."
 ADISCORD_rus_crisis.37.a:0 "Then we will feed ourselves."
 ADISCORD_rus_crisis.38.t:0 "Tainted Water"
 ADISCORD_rus_crisis.38.d:0 "The purification pumps raised murky water smelling of iron and rot. The orderlies found dead rats in the filters and traces of an old leak from the lower levels. Several shifts are already down with fever.\n\nThe pumps can be shut and the system flushed while the galleries drink from the stores. New filters can be bought on the surface. Or the people can drink what there is and hope the fever passes."
 ADISCORD_rus_crisis.38.a:0 "Shut the pumps and drink from the stores."
 ADISCORD_rus_crisis.38.b:0 "Buy new filters."
 ADISCORD_rus_crisis.38.c:0 "Drink it as it is."
 ADISCORD_rus_crisis.39.t:0 "The Granary Collapses"
 ADISCORD_rus_crisis.39.d:0 "At night the vault of the granary on the third layer gave way. Sacks, barrels and racks of tinned food lie under stone and concrete. The engineers say part of the stock can still be saved if supports go in at once, before the rock settles.\n\nThe Black Army offers to throw its own men into the rubble. The engineers ask for money for supports and the authority to pull workers from other sites."
 ADISCORD_rus_crisis.39.a:0 "Write off what is buried."
 ADISCORD_rus_crisis.39.b:0 "Put in supports."
 ADISCORD_rus_crisis.39.c:0 "Let the Black Army dig."
 ADISCORD_rus_crisis.40.t:0 "Cattle Plague"
 ADISCORD_rus_crisis.40.d:0 "Bad news comes from the annexed aimaqs: a plague has gone through the herds. The herders slaughter the sick animals and ask the bunker for grain to survive the season, or they will leave the land with their families.\n\nThe headquarters has vets for one aimaq; medicine must be bought from the neighbours. Or the surviving cattle can be taken by force before the herders slaughter them."
 ADISCORD_rus_crisis.40.a:0 "Feed the aimaqs from the stores."
 ADISCORD_rus_crisis.40.b:0 "Buy medicine."
 ADISCORD_rus_crisis.40.c:0 "Take the surviving cattle."
 ADISCORD_rus_crisis.30.t:0 "Spoils of the Campaign"
 ADISCORD_rus_crisis.30.d:0 "The last outposts have surrendered, and the Black Army's wagons are rolling toward the bunker. The inventories list the district office's cash box, a rifle depot, sacks of grain and a column of prisoners who could be put to work underground.\n\nThe quartermasters propose to haul away everything down to the last crate. The aimaq elders ask to leave a share to the people who will now live on this land under the Khan. The neighbours will judge the Khan by what remains in place."
 ADISCORD_rus_crisis.30.a:0 "Haul away everything down to the last crate."
 ADISCORD_rus_crisis.30.b:0 "Leave a share to the aimaqs."
