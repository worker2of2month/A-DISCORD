 RUS_scientists_council:0 "The Khan's council of scientists"
 RUS_scientists_council_desc:0 "The census showed that the bunker does not stand on soldiers alone. Engineers, chemists and doctors have repaired the pumps, filters and generators for years without a voice in the country's affairs. Mark Rustan will gather them into a council and chair it himself: the knowledge of the underground becomes a matter of state rather than the private care of single workshops."
 RUS_scientists_workshops:0 "Workshops of the council"
 RUS_scientists_workshops_desc:0 "The council will merge the scattered workshop estimates into a single fund. A site in the capital district is assigned and a civilian factory is put into operation. The scientists receive means they will have to account for before the Khan."
 RUS_scientists_power_compact:0 "Light and bread of the underground"
 RUS_scientists_power_compact_desc:0 "The scientists will send engineers to add power to the complex and keep food production running. The better the machines run, the more weight those who understand them carry."
 RUS_scientists_power_compact_tt:0 "Bunker power: §G+1§! £energy_consumption_texticon. Food production: §G+1§! £supply_texticon per week."
 RUS_black_army_oath:0 "Oath of the Black Army"
 RUS_black_army_oath_desc:0 "The Black Army grew from the hundreds that defended the bunker gates. Now Mark Rustan takes its oath in person: every aimaq names men for the common reserve, and the capital service equips them with engineering tools. The army gains a real foundation, and the Khan a host answerable to him alone."
 RUS_black_army_staff:0 "Black Army staff"
 RUS_black_army_staff_desc:0 "The staff begins with the economy of the front: depots need someone responsible, trains a timetable, engineers their tools. A capital arsenal gives the command its own production base and turns orders into a working rear."
 RUS_black_army_banner:0 "Charter of the Black Banner"
 RUS_black_army_banner_desc:0 "A single charter will bind reconnaissance, defence in depth and the preparation of a general offensive. No hundred leaves its neighbour without help, and the staff must prepare its lines in advance. The charter makes the Khan's army a force the scientists must reckon with too."
 RUS_experimental_laboratories:0 "Experimental laboratories"
 RUS_experimental_laboratories_desc:0 "The bunker's science wing has grown, but the real samples do not lie underground. Around the ruined zero-point reactor stand the workshops, alloy stores and surviving components of old Vorkerland. The Khan's scientists will open field laboratories at the edge of the reactor zone and take on projects once thought impossible."
 RUS_experimental_laboratories_tt:0 "Laboratory projects require control of at least one reactor zone. After 'Reactor Alloys' the single §Yairborne battleship§! becomes available."
 RUS_experimental_labs_category:0 "Experimental laboratories"
 RUS_experimental_labs_category_desc:0 "Field laboratories take samples from the ruins of the old industrial centre around the reactor. Only one project runs at a time. Work is possible while the Khan controls at least one reactor zone - Northern, Eastern, Western or Southern. Scientific or military leadership does not close these projects. If every reactor zone or the capital is lost, the project stops and its full price is returned."
 RUS_lab_reactor_alloys:0 "Reactor alloys"
 RUS_lab_reactor_alloys_desc:0 "The scientists will recover samples of light heat-resistant alloys from the ruins of the reactor complex and restore the means to work them. The project gives an industrial head start and material for the hull of a future airborne battleship. The work takes 60 days.\n\nAn operational underground laboratory at completion adds a §G50%§! bonus for one support technology."
 RUS_lab_reactor_alloys_cost:0 "§Y50§! £political_power_texticon  §Y100§! £ADISCORD_economy_treasury_texticon"
 RUS_lab_reactor_alloys_cost_blocked:0 "§R50§! £political_power_texticon  §R100§! £ADISCORD_economy_treasury_texticon"
 RUS_lab_reactor_alloys_cost_tooltip:0 "Requires 50 £political_power_texticon and 100 £ADISCORD_economy_treasury_texticon."
 RUS_lab_reactor_alloys_support_tt:0 "§YScientist§! support: §G+10%§!. §YBlack Army§! support: §R-5%§!.\nUnlocks the §YAirborne battleship§! project."
 RUS_lab_zeppelin:0 "Airborne battleship"
 RUS_lab_zeppelin_desc:0 "The archives of old Vorkerland kept the drawings of an armoured airship that never left the ground. With reactor alloys and surviving engines the scientists can assemble a single hull. The crew is drafted at once. A second ship cannot be built, and a lost hull cannot be replaced. The work takes 150 days.\n\nAvailable under both scientific and military leadership, including either extreme of the balance of power."
 RUS_lab_zeppelin_cost:0 "§Y100§! £political_power_texticon  §Y335§! £ADISCORD_economy_treasury_texticon  §Y400§! £manpower_texticon"
 RUS_lab_zeppelin_cost_blocked:0 "§R100§! £political_power_texticon  §R335§! £ADISCORD_economy_treasury_texticon  §R400§! £manpower_texticon"
 RUS_lab_zeppelin_cost_tooltip:0 "Requires 100 £political_power_texticon, 335 £ADISCORD_economy_treasury_texticon and 400 £manpower_texticon for the crew."
 RUS_lab_zeppelin_result_tt:0 "The §YAirborne Battleship «Zeppelin»§! appears in the capital with a full crew and armament. §YScientist§! and §YBlack Army§! support: §G+10%§!."
 RUS_lab_reactor_access_tt:0 "The Khan controls at least one reactor zone: Northern, Eastern, Western or Southern."
 RUS_lab_slot_free_tt:0 "No other project is running in the laboratories."
 RUS_lab_unavailable_tt:0 "Laboratories are unavailable: the Khan has lost power, bunker control or access to all reactor zones, or the laboratory programme is not unlocked"
 RUS_lab_reactor_alloys_order_closed_tt:0 "The Reactor Alloys order is no longer in progress"
 RUS_lab_zeppelin_order_closed_tt:0 "The Air Battleship order is no longer in progress"
 RUS_lab_cancel_warning_tt:0 "If the Khan loses every reactor zone or the capital, the project stops and its full price is returned."
 RUS_lab_refunded_tt:0 "Project stopped. Political power, treasury and crew have been returned."
 RUS_reactor_belt_inventory:0 "Inventory of the reactor belt"
 RUS_reactor_belt_inventory_desc:0 "The skeletons of old Vorkerland's factories stand around the reactor. Under the fallen roofs lie mills, furnaces and metal stores nobody has reached since the accident. The Khan's engineers will draw up an inventory: what can be lifted, what must be cut and where the load-bearing walls still hold. The first salvage goes straight to the treasury."
 RUS_reactor_foundries:0 "Foundries of the belt"
 RUS_reactor_foundries_desc:0 "A restored hall is only the beginning. A foundry beside it can process the recovered metal on site instead of hauling scrap across the country. Every restored work of the belt will gain its own arms shop."
 RUS_reactor_foundries_tt:0 "Every belt work already restored that we own and control: §G+1§! slot and §G+1§! military factory. Works restored later receive the same at once."
 RUS_reactor_sorties:0 "Sorties into the reactor"
 RUS_reactor_sorties_desc:0 "The most valuable things lie where no one can live: in the halls next to the core. Volunteers in protective suits will go beyond the perimeter for days and return with instruments, alloys and documents. Not everyone comes back."
 RUS_reactor_decontamination:0 "Decontamination brigades"
 RUS_reactor_decontamination_desc:0 "The scientists have taught the sortie groups to wash their gear, change filters and leave the zone through proven corridors. Losses fall and the haul grows heavier."
 RUS_reactor_decontamination_tt:0 "Reactor sorties consume §Y20§! £support_equipment_texticon instead of 40 and recover §G+85§! £ADISCORD_economy_treasury_texticon instead of 150. Applies to subsequent expeditions."
 RUS_reactor_belt_category:0 "Reactor belt"
 RUS_reactor_belt_category_desc:0 "Six states around the reactor - the Northern, Eastern, Western and Southern reactor zones, Eastern Grey Strip and Marden - hold the buried stocks of the old industry. Today only surface scrap is worked there.\n\nRestoring a work returns the buried resources to its state together with a slot and a civilian factory. One state is restored at a time; if it is lost, the project is cancelled and its price returned. Reactor sorties require control of at least one reactor zone."
 RUS_restore_reactor_works:0 "Restore the works: [FROM.GetName]"
 RUS_restore_reactor_works_desc:0 "Clear the rubble, brace the surviving spans and start the hall again. The work takes 120 days."
 RUS_restore_reactor_works_cost:0 "§Y50§! £political_power_texticon  §Y135§! £ADISCORD_economy_treasury_texticon"
 RUS_restore_reactor_works_cost_blocked:0 "§R50§! £political_power_texticon  §R135§! £ADISCORD_economy_treasury_texticon"
 RUS_restore_reactor_works_cost_tooltip:0 "Requires 50 £political_power_texticon and 135 £ADISCORD_economy_treasury_texticon."
 RUS_reactor_works_idle_tt:0 "No other work of the belt is being restored."
 RUS_reactor_works_cancel_tt:0 "If the state is lost, the work stops and its full price is returned."
 RUS_reactor_works_refund_tt:0 "Work stopped. Political power and treasury have been returned."
 RUS_reactor_works_result_tt:0 "The state regains its buried resources, §G+1§! slot and §G+1§! civilian factory. After 'Foundries of the Belt' it also gains §G+1§! slot and §G+1§! military factory."
 RUS_reactor_sortie:0 "Sortie into the reactor"
 RUS_reactor_sortie_desc:0 "Send a volunteer group to the reactor core for instruments, alloys and archives. The group is away for 30 days; protective equipment is consumed on departure, without deducting manpower. Repeatable after 60 days."
 RUS_reactor_sortie_cost:0 "§Y25§! £political_power_texticon  §Y[GetRUSReactorSortieEquipment]§! £support_equipment_texticon"
 RUS_reactor_sortie_cost_blocked:0 "§R25§! £political_power_texticon  §R[GetRUSReactorSortieEquipment]§! £support_equipment_texticon"
 RUS_reactor_sortie_cost_tooltip:0 "Requires §Y25§! £political_power_texticon and §Y[GetRUSReactorSortieEquipment]§! £support_equipment_texticon. Supplies are consumed on departure."
 RUS_reactor_sortie_losses_tt:0 "Protective suits, filters and tools are consumed on departure. No manpower is deducted."
 RUS_reactor_sortie_cancel_tt:0 "The group is recalled without a haul. Consumed supplies and political power are not refunded."
 RUS_reactor_sortie_result_tt:0 "Treasury: §G+50§! £ADISCORD_economy_treasury_texticon, or §G+250§! if commissioned after Decontamination Brigades. §YScientist§! support: §G+5%§!."
