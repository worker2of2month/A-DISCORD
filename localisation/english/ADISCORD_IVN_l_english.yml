 ADISCORD_ivn.2.c:0 "Stand with Karn."
 ADISCORD_ivn.2.e:0 "For the free communes!"
 ADISCORD_ivn.2.f:0 "The marches will decide their own future."
 ADISCORD_ivn.2.c_tt:0 "Lead Rostislav Karn's §YMilitary Directorate§!. The five-sided civil war begins."
 ADISCORD_ivn.2.e_tt:0 "Lead the §YUnion of Free Communes§!. The five-sided civil war begins."
 ADISCORD_ivn.2.f_tt:0 "Lead the §YCouncil of Autonomous Marches§!. The five-sided civil war begins."
 IVN_cw_diplomacy_category:0 "The Itoran Civil War"
 IVN_cw_diplomacy_category_desc:0 "Five governments contest Itora. The Committee and the Liberation Legion seek national unity; the Directorate, communes and autonomous marches may recognise either through a treaty. Negotiated reunification preserves their forces and establishes permanent guarantees. Defeating one participant does not end the war: reunification requires the disappearance of every other independent claimant."
 IVN_cw_send_offer:0 "Offer reunification: [FROM.GetName]"
 IVN_cw_send_offer_desc:0 "Envoys cross the front with a proposal for a common government. Recognition must rest on promises that will outlive the war."
 IVN_cw_offer_price_tt:0 "At least §Y75§! £political_power_texticon is available for an accepted treaty"
 IVN_cw_offer_ready_tt:0 "The delegation is ready for negotiations"
 IVN_cw_offer_terms_tt:0 "[FROM.GetName] receives a voluntary reunification offer. Pay §Y75§! £political_power_texticon only if accepted. Its territory, forces, stocks and treasury join us; treaty guarantees survive the war. Unfinished paid programmes close and their deposits return to the united country. The recipient has §Y7 days§! to answer; rejection or expiry costs nothing."
 IVN_cw_accept_offer_tt:0 "Recognise the common command of [FROM.GetName]. Our territory and forces join the sender, who pays §Y75§! £political_power_texticon and preserves our guarantees. A player on this side takes control of the united country. Unfinished paid programmes close with their deposits returned."
 IVN_cw_emergency_arms:0 "Open local weapons depots"
 IVN_cw_emergency_arms_desc:0 "The workshops still hold serviceable rifles, and the towns have people ready to defend their homes. Command gathers them under a common banner."
 IVN_cw_military_guarantees:0 "Representation of the Military Staff"
 IVN_cw_military_guarantees_desc:0 "Karn recognised the common command in return for a permanent role for the officer corps in government."
 IVN_cw_communal_guarantees:0 "Guarantees of the Free Communes"
 IVN_cw_communal_guarantees_desc:0 "The communes retain elected councils and a voice in decisions about mobilising their inhabitants."
 IVN_cw_regional_guarantees:0 "Charter of the Autonomous Marches"
 IVN_cw_regional_guarantees_desc:0 "The marches recognised a united country while retaining their administrations and an agreed share of local revenue."
 ADISCORD_ivn.11.t:0 "A proposal for a common government"
 ADISCORD_ivn.11.d:0 "The delegation from [FROM.GetName] arrived under a white flag. Its envoys propose ending the fratricide, combining our forces and recognising one government. They offer to enshrine our rights in a settlement that will survive the war.\n\nFor the officers this means a place for the staff in government; for the communes, elected councils and a say in conscription; for the marches, their own administrations and local revenues. Behind the door, commanders argue. Some see salvation in the treaty. Others see the abandonment of the cause for which they took up arms."
 ADISCORD_ivn.11.a:0 "We will continue our own struggle."
 ADISCORD_ivn.11.b:0 "Recognise the common government on these terms."
 ADISCORD_ivn.12.t:0 "Itora reunited"
 ADISCORD_ivn.12.d:0 "Itora's last independent military government has ceased to exist. [IVN.GetLeader] announces the restoration of a united country. Roadblocks are coming down, representatives of the marches assemble in the capital and surviving formations receive common orders.\n\nBattles alone did not determine the result. Agreements concluded during the civil war now enter the structure of the new state. Families search for the missing and workshops reopen. Itora must still learn to live with the memory of five banners."
 ADISCORD_ivn.12.a:0 "A different Itora begins."
