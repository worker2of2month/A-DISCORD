l_english:
 IVN_order_dynamic: "Order of Itora"
 IVN_order_dynamic_desc: "The sum of the Emergency Committee's reforms: hospitals, march schools, the army and preparation for the western question."
 IVN_committee_report: "Report of the Emergency Committee"
 IVN_committee_report_desc: "The Itoran committee has collected reports from every march. The republic knows how many hospitals, depots and soldiers it has - and how many it lacks."
 IVN_hospital_registers: "Hospital Registers"
 IVN_hospital_registers_desc: "Each march receives a list of the hospitals and shelters it answers for to the committee."
 IVN_school_of_the_marches: "Schools of the Marches"
 IVN_school_of_the_marches_desc: "Frontier schools train engineers, doctors and signallers for the whole republic."
 IVN_social_insurance_offices: "Social Insurance Offices"
 IVN_social_insurance_offices_desc: "Insurance introduced after Vorkerland's collapse becomes a state service with its own offices."
 IVN_committee_mandate: "Mandate of the Committee"
 IVN_committee_mandate_desc: "The committee receives a mandate from the marches to settle the western question. It remains to choose the answer."
 IVN_humanist_shield: "Humanist Shield"
 IVN_humanist_shield_desc: "Itora will defend people, not lines on a map. The free republics of the West will be its allies, and aid to refugees and neighbours becomes the committee's main argument."
 IVN_emergency_order: "Emergency Order"
 IVN_emergency_order_desc: "The committee suspends elections and places the marches under martial law. Itora no longer waits for others to settle the West and speaks to its neighbours in the language of force."
 IVN_shield_league_of_republics: "League of Free Republics"
 IVN_shield_league_of_republics_desc: "Itora opens the League of Free Republics to every neighbour ready to stand with it. Invitations go to those who already lean toward Itora."
 IVN_shield_territorial_defence: "Territorial Defence"
 IVN_shield_territorial_defence_desc: "The frontier by the northern corridor receives fortified lines."
 IVN_shield_red_cross_corridors: "Corridors of Mercy"
 IVN_shield_red_cross_corridors_desc: "Refugees from Vorkerland receive protected roads. Many stay to serve Itora, and the humanitarian convoys of the marches are ready to reach the neighbours."
 IVN_shield_marches_militia: "March Militia"
 IVN_shield_marches_militia_desc: "Every march fields a trained militia to defend its own land."
 IVN_shield_over_the_west: "Shield over the West"
 IVN_shield_over_the_west_desc: "Itora demands guarantees for the corridor and the free republics from Vorkerland. Refusal will mean war."
 IVN_emergency_war_ministry: "War Ministry"
 IVN_emergency_war_ministry_desc: "The general staff of the marches becomes a ministry with the right of direct command."
 IVN_emergency_requisitions: "Emergency Requisitions"
 IVN_emergency_requisitions_desc: "March factories switch to military orders without consulting the councils."
 IVN_emergency_corridor_claims: "Claims on the Corridor"
 IVN_emergency_corridor_claims_desc: "The committee declares the northern corridor Itora's natural border."
 IVN_emergency_general_levy: "General Levy"
 IVN_emergency_general_levy_desc: "The emergency order requires every march to field its full contingent."
 IVN_emergency_march_west: "March to the West"
 IVN_emergency_march_west_desc: "Itora will strike first, before reunified Vorkerland gathers its strength."
 IVN_west_heritage: "Heritage of the West"
 IVN_west_heritage_desc: "The war is over. Itora must turn victory into an order for the whole West."
 IVN_march_reconstruction: "Rebuild the Old March"
 IVN_march_reconstruction_desc: "The capital march receives new workshops and warehouses, and the committee approves a construction programme for all the marches."
 IVN_upper_march_mines: "Mines of the Upper March"
 IVN_upper_march_mines_desc: "The old mines of the Upper March yield steel again."
 IVN_old_march_railways: "Railways of the Marches"
 IVN_old_march_railways_desc: "The roads between the marches are rebuilt for military traffic."
 IVN_war_industry_plan: "War Industry Plan"
 IVN_war_industry_plan_desc: "The committee approves a plan for arms factories in the Old and Upper Marches."
 IVN_frontier_fortifications: "Frontier Fortifications"
 IVN_frontier_fortifications_desc: "The Eastern March and the frontier receive fortified lines."
 IVN_coastal_dockyards: "Coastal Dockyards"
 IVN_coastal_dockyards_desc: "The Old March port receives a dockyard to protect the island administration."
 IVN_research_council: "Research Council"
 IVN_research_council_desc: "The engineers, doctors and signallers of the marches unite in one research council."
 IVN_marches_general_staff: "General Staff of the Marches"
 IVN_marches_general_staff_desc: "The march garrisons receive a common staff and common defence plans."
 IVN_mountain_rangers: "Mountain Rangers"
 IVN_mountain_rangers_desc: "Itora's highlands are the best teacher for infantry that must fight in the corridor."
 IVN_citizen_reserve: "Citizen Reserve"
 IVN_citizen_reserve_desc: "Every trained citizen remains in the reserve of their march. At the right moment the committee can call up the whole reserve."
 IVN_northern_corps: "Northern Corps"
 IVN_northern_corps_desc: "The best units of the marches form a corps for operations in the north."
 IVN_air_cover_of_the_marches: "Air Cover of the Marches"
 IVN_air_cover_of_the_marches_desc: "The Old March receives airfields and a pilot school."
 IVN_coastal_flotilla: "Coastal Flotilla"
 IVN_coastal_flotilla_desc: "The flotilla guards the link with the island administration. Patrol experience will accelerate one naval equipment research project."
 IVN_west_war_council: "War Council of the West"
 IVN_west_war_council_desc: "The committee creates a war council for the war for the West."
 IVN_west_counterstroke: "Counterstroke"
 IVN_west_counterstroke_desc: "The march reserves stand ready to meet Vorkerland's offensive with a counterstroke."
 IVN_watch_the_unity_tower: "Watch the Unity Tower"
 IVN_watch_the_unity_tower_desc: "Committee intelligence watches Vorkerland's capital. If the Tower falls, Itora must know first."
 IVN_northern_expedition_plan: "Northern Expedition Plan"
 IVN_northern_expedition_plan_desc: "The general staff stockpiles supplies for a possible intervention in the north."
 IVN_norvane_mandate: "Norvane Mandate"
 IVN_norvane_mandate_desc: "Norvane and Krait have become Itora's clients. The committee arms them and secures the alliance begun by the intervention."
 IVN_lessons_of_the_retreat: "Lessons of the Retreat"
 IVN_lessons_of_the_retreat_desc: "The failed intervention taught the army more than any victory."
 IVN_west_question: "The Western Question"
 IVN_west_question_desc: "Vorkerland is one again. Itora must decide how it will meet its return."
 IVN_humanist_shield_tt: "Itora chooses the §Yhumanist shield§!: defence of the free republics and the corridor. If Itora wins the war for the West, Vorkerland becomes a confederation under its guarantee."
 IVN_emergency_order_tt: "Elections are suspended and the etatists take power. If Itora wins the war for the West, Vorkerland passes under its emergency trusteeship."
 IVN_shield_over_the_west_tt: "The §Ywar for the West§! against Vorkerland begins."
 IVN_emergency_march_west_tt: "The §Ywar for the West§! against Vorkerland begins."
 IVN_west_crisis_add_tt: "Western reckoning: §Y+10§!."
 IVN_west_final_ready_tt: "Vorkerland is reunified, the western question is open, the Itoran intervention is over and the war for the West has not started"
 IVN_west_question_open_tt: "The western question is open or the war for the West is under way"
 IVN_west_wrk_reunified_tt: "A claimant has reunified Vorkerland"
 IVN_west_reconstruction_ready_tt:0 "At least 180 days have passed since Vorkerland reunified"

# Courses, programmes and the western states
 IVN_trade_republic:0 "Trade Republic of the Marches"
 IVN_trade_republic_desc:0 "The merchant councils of the marches have long fed the committee and paid its army. Now they take power: Itora will buy allies, roads and time, and fight only when no bargain remains."
 IVN_trade_republic_tt:0 "Government passes to the pragmatists and elections remain. In the war for the West the defeated become ordinary satellites of Itora, and the army receives the §YMerchant League§! spirit."
 IVN_emergency_protectorates:0 "Protectorates of the Marches"
 IVN_emergency_protectorates_desc:0 "The emergency committee declares the border neighbours Itora's zone of responsibility. Those who refuse a protectorate will receive an ultimatum."
 IVN_trade_compacts:0 "Trade Compacts"
 IVN_trade_compacts_desc:0 "The merchant councils sign compacts on tariffs, warehouses and caravan passage with the neighbours. Each compact is one more voice for Itora."
 IVN_trade_free_ports:0 "Free Ports"
 IVN_trade_free_ports_desc:0 "The port of the Old March becomes a free harbour: new warehouses, workshops and a yard for merchant ships."
 IVN_trade_merchant_banks:0 "Merchant Banks"
 IVN_trade_merchant_banks_desc:0 "The banks of the marches lend to factories against state orders. Money moves faster than the committee's decrees."
 IVN_trade_hired_columns:0 "Hired Columns"
 IVN_trade_hired_columns_desc:0 "The trading houses hire caravan guards and arm them at their own expense. In war these columns will stand in the line beside the army of the marches."
 IVN_trade_market_of_the_west:0 "Market of the West"
 IVN_trade_market_of_the_west_desc:0 "Itora becomes the main market of the region. Whoever sells and buys in the marches will not want to fight against them."
 IVN_trade_market_of_the_west_tt:0 "The lean of every western state shifts toward Itora by §Y5§!."
 IVN_trade_war_for_the_ports:0 "War for the Harbours"
 IVN_trade_war_for_the_ports_desc:0 "Vorkerland has closed the roads and threatens the ports of the marches. The merchant councils admit that no bargain remains; the price will now be paid by the army."
 IVN_trade_war_for_the_ports_tt:0 "The §Ywar for the West§! against Vorkerland begins."
 IVN_march_fair:0 "Fair of the Marches"
 IVN_march_fair_desc:0 "The last funds of the plan go to civilian factories in the Eastern March. The republic will be richer than its rival."
 IVN_arms_contracts:0 "Arms Contracts"
 IVN_arms_contracts_desc:0 "The last funds of the plan go to arms works in the Upper March. The republic will be better armed than its rival."
 IVN_marches_planning_board:0 "Planning Board of the Marches"
 IVN_marches_planning_board_desc:0 "The factories, mines and workshops of the marches receive a common order bureau and standards."
 IVN_norvane_mandate_tt:0 "The lean of [IBA.GetName] and [IBL.GetName] shifts toward Itora by §Y20§!."
 IVN_envoys_to_the_districts:0 "Envoys to the Districts"
 IVN_envoys_to_the_districts_desc:0 "Vorkerland's former administrative districts hold the corridor. The committee sends envoys before the imperial commissioners arrive."
 IVN_envoys_to_the_districts_tt:0 "The lean of [PWR.GetName], [PSD.GetName] and [ZAO.GetName] shifts toward Itora by §Y15§!."
 IVN_old_friends_of_rimat:0 "Old Friends of Rimat"
 IVN_old_friends_of_rimat_desc:0 "Rimat remembers Itora's guarantees, and Frealor and Zolotorevsk its hospitals. The committee reminds them."
 IVN_old_friends_of_rimat_tt:0 "The lean of [WIT.GetName] shifts toward Itora by §Y20§!, that of [ROM.GetName] and [TRU.GetName] by §Y10§!."
 IVN_western_press_bureau:0 "Western Press Bureau"
 IVN_western_press_bureau_desc:0 "The newspapers and radio of the marches reach the whole West. Every embassy and every compact of Itora now comes with its own voice."
 IVN_influence_power_5_tt:0 "Our influence in the West: §Y+5§!."
 IVN_influence_power_10_tt:0 "Our influence in the West: §Y+10§!."
 IVN_marches_category:0 "Marches of Itora"
 IVN_marches_category_desc:0 "The committee's construction and reserve programmes for the marches."
 IVN_march_workshops:0 "Workshops of the Marches"
 IVN_march_workshops_desc:0 "The committee pays for workshops in one of the marches. The work takes two months."
 IVN_march_workshops_tt:0 "In §Y60§! days §Y1§! civilian factory appears in a core state with room. If no room remains, the programme returns §Y50§! £political_power_texticon."
 IVN_march_workshops_limit_tt:0 "The programme has been completed fewer than §Y3§! times"
 IVN_march_workshops_site_tt:0 "A controlled core state has room for a civilian factory"
 IVN_reserve_call_up:0 "Call Up the Citizen Reserve"
 IVN_reserve_call_up_desc:0 "The reservists of the marches gather for training and return to the ranks. In six weeks the army receives trained replacements."
