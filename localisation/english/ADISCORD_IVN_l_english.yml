l_english:
 IVN_order_dynamic: "Order of Itora"
 IVN_order_dynamic_desc: "The sum of the Emergency Committee's reforms: hospitals, march schools, the army and preparation for the western question."
 IVN_committee_report: "Report of the Emergency Committee"
 IVN_committee_report_desc: "The Itoran committee has collected reports from every march. The republic knows how many hospitals, depots and soldiers it has - and how many it lacks."
 IVN_hospital_registers: "Hospital Registers"
 IVN_hospital_registers_desc: "Each march receives a list of the hospitals and shelters it answers for to the committee."
 IVN_school_of_the_marches: "Schools of the Marches"
 IVN_school_of_the_marches_desc: "Frontier schools train engineers, doctors and signallers for the whole republic."
 IVN_social_insurance_offices: "Social Insurance Offices"
 IVN_social_insurance_offices_desc: "Insurance introduced after Vorkerland's collapse becomes a state service with its own offices."
 IVN_committee_mandate: "Mandate of the Committee"
 IVN_committee_mandate_desc: "The committee receives a mandate from the marches to settle the western question. It remains to choose the answer."
 IVN_humanist_shield: "Humanist Shield"
 IVN_humanist_shield_desc: "Itora will defend people, not lines on a map. The free republics of the West will be its allies, and aid to refugees and neighbours becomes the committee's main argument."
 IVN_emergency_order: "Emergency Order"
 IVN_emergency_order_desc: "The committee suspends elections and places the marches under martial law. Itora no longer waits for others to settle the West and speaks to its neighbours in the language of force."
 IVN_shield_league_of_republics: "League of Free Republics"
 IVN_shield_league_of_republics_desc: "Itora opens the League of Free Republics to every neighbour ready to stand with it. Invitations go to those who already lean toward Itora."
 IVN_shield_territorial_defence: "Territorial Defence"
 IVN_shield_territorial_defence_desc: "The frontier by the northern corridor receives fortified lines."
 IVN_shield_red_cross_corridors: "Corridors of Mercy"
 IVN_shield_red_cross_corridors_desc: "Refugees from Vorkerland receive protected roads. Many stay to serve Itora, and the humanitarian convoys of the marches are ready to reach the neighbours."
 IVN_shield_marches_militia: "March Militia"
 IVN_shield_marches_militia_desc: "Every march fields a trained militia to defend its own land."
 IVN_shield_over_the_west: "Shield over the West"
 IVN_shield_over_the_west_desc: "Itora demands guarantees for the corridor and the free republics from Vorkerland. Refusal will mean war."
 IVN_emergency_war_ministry: "War Ministry"
 IVN_emergency_war_ministry_desc: "The general staff of the marches becomes a ministry with the right of direct command."
 IVN_emergency_requisitions: "Emergency Requisitions"
 IVN_emergency_requisitions_desc: "March factories switch to military orders without consulting the councils."
 IVN_emergency_corridor_claims: "Claims on the Corridor"
 IVN_emergency_corridor_claims_desc: "The committee declares the northern corridor Itora's natural border."
 IVN_emergency_general_levy: "General Levy"
 IVN_emergency_general_levy_desc: "The emergency order requires every march to field its full contingent."
 IVN_emergency_march_west: "March to the West"
 IVN_emergency_march_west_desc: "Itora will strike first, before reunified Vorkerland gathers its strength."
 IVN_west_heritage: "Heritage of the West"
 IVN_west_heritage_desc: "The war is over. Itora must turn victory into an order for the whole West."
 IVN_march_reconstruction: "Rebuild the Old March"
 IVN_march_reconstruction_desc: "The capital march receives new workshops and warehouses, and the committee approves a construction programme for all the marches."
 IVN_upper_march_mines: "Mines of the Upper March"
 IVN_upper_march_mines_desc: "The old mines of the Upper March yield steel again."
 IVN_old_march_railways: "Railways of the Marches"
 IVN_old_march_railways_desc: "The roads between the marches are rebuilt for military traffic."
 IVN_war_industry_plan: "War Industry Plan"
 IVN_war_industry_plan_desc: "The committee approves a plan for arms factories in the Old and Upper Marches."
 IVN_frontier_fortifications: "Frontier Fortifications"
 IVN_frontier_fortifications_desc: "The Eastern March and the frontier receive fortified lines."
 IVN_coastal_dockyards: "Coastal Dockyards"
 IVN_coastal_dockyards_desc: "The Old March port receives a dockyard to protect the island administration."
 IVN_research_council: "Research Council"
 IVN_research_council_desc: "The engineers, doctors and signallers of the marches unite in one research council."
 IVN_marches_general_staff: "General Staff of the Marches"
 IVN_marches_general_staff_desc: "The march garrisons receive a common staff and common defence plans."
 IVN_mountain_rangers: "Mountain Rangers"
 IVN_mountain_rangers_desc: "Itora's highlands are the best teacher for infantry that must fight in the corridor."
 IVN_citizen_reserve: "Citizen Reserve"
 IVN_citizen_reserve_desc: "Every trained citizen remains in the reserve of their march. At the right moment the committee can call up the whole reserve."
 IVN_northern_corps: "Northern Corps"
 IVN_northern_corps_desc: "The best units of the marches form a corps for operations in the north."
 IVN_air_cover_of_the_marches: "Air Cover of the Marches"
 IVN_air_cover_of_the_marches_desc: "The Old March receives airfields and a pilot school."
 IVN_coastal_flotilla: "Coastal Flotilla"
 IVN_coastal_flotilla_desc: "The flotilla guards the link with the island administration."
 IVN_west_war_council: "War Council of the West"
 IVN_west_war_council_desc: "The committee creates a war council for the war for the West."
 IVN_west_counterstroke: "Counterstroke"
 IVN_west_counterstroke_desc: "The march reserves stand ready to meet Vorkerland's offensive with a counterstroke."
 IVN_watch_the_unity_tower: "Watch the Unity Tower"
 IVN_watch_the_unity_tower_desc: "Committee intelligence watches Vorkerland's capital. If the Tower falls, Itora must know first."
 IVN_northern_expedition_plan: "Northern Expedition Plan"
 IVN_northern_expedition_plan_desc: "The general staff stockpiles supplies for a possible intervention in the north."
 IVN_norvane_mandate: "Norvane Mandate"
 IVN_norvane_mandate_desc: "Norvane and Krait have become Itora's clients. The committee arms them and secures the alliance begun by the intervention."
 IVN_lessons_of_the_retreat: "Lessons of the Retreat"
 IVN_lessons_of_the_retreat_desc: "The failed intervention taught the army more than any victory."
 IVN_west_question: "The Western Question"
 IVN_west_question_desc: "Vorkerland is one again. Itora must decide how it will meet its return."
 IVN_humanist_shield_tt: "Itora chooses the §Yhumanist shield§!: defence of the free republics and the corridor. If Itora wins the war for the West, Vorkerland becomes a confederation under its guarantee."
 IVN_emergency_order_tt: "Elections are suspended and the etatists take power. If Itora wins the war for the West, Vorkerland passes under its emergency trusteeship."
 IVN_shield_over_the_west_tt: "The §Ywar for the West§! against Vorkerland begins."
 IVN_emergency_march_west_tt: "The §Ywar for the West§! against Vorkerland begins."
 IVN_west_crisis_add_tt: "Western reckoning: §Y+10§!."
 IVN_west_final_ready_tt: "Vorkerland is reunified, the western question is open, the Itoran intervention is over and the war for the West has not started"
 IVN_west_question_open_tt: "The western question is open or the war for the West is under way"
 IVN_west_wrk_reunified_tt: "A claimant has reunified Vorkerland"
 IVN_west_reconstruction_ready_tt:0 "At least 180 days have passed since Vorkerland reunified"

# Courses, programmes and the western states
 IVN_emergency_protectorates:0 "Protectorates of the Marches"
 IVN_emergency_protectorates_desc:0 "The emergency committee declares the border neighbours Itora's zone of responsibility. Those who refuse a protectorate will receive an ultimatum."
 IVN_march_fair:0 "Fair of the Marches"
 IVN_march_fair_desc:0 "The last funds of the plan go to civilian factories in the Eastern March. The republic will be richer than its rival."
 IVN_arms_contracts:0 "Arms Contracts"
 IVN_arms_contracts_desc:0 "The last funds of the plan go to arms works in the Upper March. The republic will be better armed than its rival."
 IVN_marches_planning_board:0 "Planning Board of the Marches"
 IVN_marches_planning_board_desc:0 "The factories, mines and workshops of the marches receive a common order bureau and standards."
 IVN_norvane_mandate_tt:0 "The lean of [IBA.GetName] and [IBL.GetName] shifts toward Itora by §Y20§!."
 IVN_envoys_to_the_districts:0 "Envoys to the Districts"
 IVN_envoys_to_the_districts_desc:0 "Vorkerland's former administrative districts hold the corridor. The committee sends envoys before the imperial commissioners arrive."
 IVN_envoys_to_the_districts_tt:0 "The lean of [PWR.GetName], [PSD.GetName] and [ZAO.GetName] shifts toward Itora by §Y15§!."
 IVN_old_friends_of_rimat:0 "Old Friends of Rimat"
 IVN_old_friends_of_rimat_desc:0 "Rimat remembers Itora's guarantees, and Frealor and Zolotorevsk its hospitals. The committee reminds them."
 IVN_old_friends_of_rimat_tt:0 "The lean of [WIT.GetName] shifts toward Itora by §Y20§!, that of [ROM.GetName] and [TRU.GetName] by §Y10§!."
 IVN_western_press_bureau:0 "Western Press Bureau"
 IVN_western_press_bureau_desc:0 "The newspapers and radio of the marches reach the whole West. Every embassy and every compact of Itora now comes with its own voice."
 IVN_influence_power_5_tt:0 "Our influence in the West: §Y+5§!."
 IVN_influence_power_10_tt:0 "Our influence in the West: §Y+10§!."
 IVN_marches_category:0 "Marches of Itora"
 IVN_marches_category_desc:0 "The committee's construction and reserve programmes for the marches."
 IVN_march_workshops:0 "Workshops of the Marches"
 IVN_march_workshops_desc:0 "The committee pays for workshops in one of the marches. The work takes two months."
 IVN_march_workshops_tt:0 "In §Y60§! days §Y1§! civilian factory appears in a core state with room. If no room remains, the programme returns §Y50§! £political_power_texticon."
 IVN_march_workshops_limit_tt:0 "The programme has been completed fewer than §Y3§! times"
 IVN_march_workshops_site_tt:0 "A controlled core state has room for a civilian factory"
 IVN_reserve_call_up:0 "Call Up the Citizen Reserve"
 IVN_reserve_call_up_desc:0 "The reservists of the marches gather for training and return to the ranks. In six weeks the army receives trained replacements."

# Revolt of the marches and revanche
 IVC:0 "Itoran Liberation Legion"
 IVC_DEF:0 "the Itoran Liberation Legion"
 IVC_ADJ:0 "Legionary"
 IVC_chauvinism_party:0 "£GFX_generic_chauvinism_national_front_party_texticon Itoran Patriotic Union"
 IVC_chauvinism_party_long:0 "£GFX_generic_chauvinism_national_front_party_texticon Itoran Patriotic Union"
 IVN_northern_question_settled_tt:0 "The northern expedition is over or can no longer begin"
 IVN_expedition_not_failed_tt:0 "The northern expedition did not end in failure, or the cabinet returned power to the Committee"
 IVN_expedition_not_won_tt:0 "The northern expedition did not end in victory"
 IVN_revolt_over_tt:0 "The revolt of the marches is not under way"
 IVN_cabinet_survived_tt:0 "After the failed expedition, the emergency cabinet has crushed the revolt of the marches"
 IVN_revanche_of_the_marches:0 "Revanche of the Marches"
 IVN_revanche_of_the_marches_desc:0 "The legion has taken the capital and the Itoran Patriotic Union holds power. The shame of the northern expedition will not be forgotten: the marches will take back the north and make Vorkerland pay for the retreat."
 IVN_revanche_of_the_marches_tt:0 "Itora chooses §Yrevanche§!. In the war for the West the army receives the §YItoran Liberation Legion§! spirit, and the defeated will be annexed to Itora."
 IVN_revanche_legion_veterans:0 "Veterans of the Legion"
 IVN_revanche_legion_veterans_desc:0 "The soldiers of the revolt become the cadre of a new army. They have already fought their own and will not falter before Vorkerland."
 IVN_revanche_iron_protectorate:0 "Iron Protectorate"
 IVN_revanche_iron_protectorate_desc:0 "The neighbours learn that the new Itora does not ask for allies, it appoints them. Whoever refuses the protectorate will receive an ultimatum."
 IVN_revanche_arsenals:0 "Arsenals of Revanche"
 IVN_revanche_arsenals_desc:0 "The Upper March turns to war production. Every factory works for the coming campaign."
 IVN_revanche_corridor_by_force:0 "The Corridor by Force"
 IVN_revanche_corridor_by_force_desc:0 "The northern corridor is declared land of the marches. Its people may choose a side while Itora still asks."
 IVN_revanche_march_on_vorkerland:0 "March on Vorkerland"
 IVN_revanche_march_on_vorkerland_desc:0 "The legion marches where the expedition retreated. This time the marches will not stop at the corridor."
 IVN_revanche_march_on_vorkerland_tt:0 "The §Ywar for the West§! against Vorkerland begins."
 ADISCORD_ivn.2.t:0 "Five banners over Itora"
 ADISCORD_ivn.2.d:0 "The northern expedition returned without victory. While the emergency cabinet closed newspapers and summoned reserves, frontier regiments refused to lay down their arms. In Vedrina, Serenga, Talara and Kantoria, Leonid Stalk proclaimed the Itoran Liberation Legion. He blames the Committee for the soldiers' deaths and demands a new government.\n\nVadim heads the Emergency Committee of Itora. Yet the rebellion has no common headquarters: Rostislav Karn gathers a Military Directorate in the Northern March, Ilvan and Olsia proclaim a Union of Free Communes, and the eastern administrations establish a Council of Autonomous Marches. The general demands obedience to the army, the communes defend elected councils, and the administrators defend their territories' autonomy.\n\nThe Committee demands loyalty to the capital. The Legion calls for its liberation. Envoys can still pass between their lines, but five governments are already distributing weapons. Itora enters civil war."
 ADISCORD_ivn.2.a:0 "Stand with Vadim and the Committee."
 ADISCORD_ivn.2.a_tt:0 "Lead the §YEmergency Committee of Itora§!. The five-sided civil war begins."
 ADISCORD_ivn.2.b:0 "Lead Stalk's Liberation Legion."
 ADISCORD_ivn.2.b_tt:0 "Lead Leonid Stalk's §YItoran Liberation Legion§!. The five-sided civil war begins."
 ADISCORD_ivn.3.t:0 "Civil War in Itora"
 ADISCORD_ivn.3.d:0 "The return of the defeated northern expedition has divided Itora. Vadim holds the capital for the Emergency Committee, while Leonid Stalk leads the Itoran Liberation Legion from Vedrina. Rostislav Karn's northern staff, the free communes of Ilvan and Olsia and the Council of Autonomous Marches have proclaimed governments of their own.\n\nNone recognises the others' right to speak for the whole country. New checkpoints appear on the roads, garrisons divide their stores and families see soldiers depart under different banners. As the armies take their positions, envoys seek those still willing to negotiate."
 ADISCORD_ivn.3.a:0 "The marches against the capital."
 ADISCORD_ivn.4.t:0 "The Committee reunites Itora"
 ADISCORD_ivn.4.d:0 "The Emergency Committee's last independent opponent has ceased its struggle. Vadim declares Itora united as loyal formations return to their marches. Military reports give way to lists of the missing, ruined workshops and roads awaiting repair.\n\nVictory does not erase agreements. Representatives of reconciled parties arrive in the capital with signed guarantees. The Committee must prove that its promises will outlive the emergency."
 ADISCORD_ivn.4.a:0 "Order is restored."
 ADISCORD_ivn.5.t:0 "The Legion Takes the Old March"
 ADISCORD_ivn.5.d:0 "The Emergency Committee has fallen, and the remaining independent governments of the marches have ceased their struggle. Leonid Stalk takes power in reunited Itora on behalf of the Liberation Legion. Veterans march through the capital, followed by inhabitants who fled during the fighting.\n\nThe new government promises to restore the country's dignity after the northern disaster. Its duties now extend beyond war: rebuilding the marches, deciding the fate of the defeated and honouring treaties with those who agreed to lay down their arms."
 ADISCORD_ivn.5.a:0 "The marches demand revanche."

 IVC_humanism_party: "£GFX_IVN_roar_of_freedom_party_texticon Roar of Freedom"
 IVC_humanism_party_long: "£GFX_IVN_roar_of_freedom_party_texticon Roar of Freedom"
 IVC_utilitarism_party: "£GFX_generic_utilitarism_planning_party_texticon Itora Salvation Committee"
 IVC_utilitarism_party_long: "£GFX_generic_utilitarism_planning_party_texticon Itora Salvation Committee"
 IVC_pragmatism_party: "£GFX_generic_pragmatism_administrative_coalition_party_texticon Itora Stabilisation Party"
 IVC_pragmatism_party_long: "£GFX_generic_pragmatism_administrative_coalition_party_texticon Itora Stabilisation Party"
 IVC_anarchism_party: "£GFX_generic_anarchism_communal_federation_party_texticon Itora Self-Defence Union"
 IVC_anarchism_party_long: "£GFX_generic_anarchism_communal_federation_party_texticon Itora Self-Defence Union"
 IVC_technocracy_party: "£GFX_generic_technocracy_scientific_collegium_party_texticon Itora Infrastructure Headquarters"
 IVC_technocracy_party_long: "£GFX_generic_technocracy_scientific_collegium_party_texticon Itora Infrastructure Headquarters"
 IVC_etatism_party: "£GFX_IVN_emergency_committee_party_texticon Itora Emergency Committee"
 IVC_etatism_party_long: "£GFX_IVN_emergency_committee_party_texticon Itora Emergency Committee"
 IVC_hedonism_party: "£GFX_generic_hedonism_cultural_club_party_texticon Itora Nomenklatura Club"
 IVC_hedonism_party_long: "£GFX_generic_hedonism_cultural_club_party_texticon Itora Nomenklatura Club"

# Committee and staff, trust of the frontier marches
 IVN_marches_initialize_tt:0 "Opens the §YCommittee and Staff§! balance and §Yfrontier trust§!. Staff influence determines the Military Directorate's army share during civil war; trust affects local programmes and garrison defections."
 IVN_command_bop:0 "Committee and Staff"
 IVN_command_category:0 "Committee and Staff"
 IVN_command_category_desc:0 "The Committee and the Staff dispute command of the army. The Liberation Legion receives 35% of regular formations at the split. Karn's Directorate receives 10%, 5% after his dismissal, or 15% after his promotion or staff dominance. The communes and autonomists receive 8% and 7%; the Committee keeps the remainder."
 IVN_committee_side:0 "Committee"
 IVN_staff_side:0 "Staff of the Marches"
 IVN_command_compromise:0 "Balance of Powers"
 IVN_committee_influence:0 "Voice of the Committee"
 IVN_committee_control:0 "Civil Control of the Army"
 IVN_committee_dominance:0 "Generals Sidelined"
 IVN_staff_influence:0 "Voice of the Staff"
 IVN_staff_control:0 "The Army Decides Itself"
 IVN_staff_dominance:0 "Rule of the Staff"
 IVN_staff_leads_tt:0 "The §YCommittee and Staff§! balance favours the staff"
 IVN_committee_leads_tt:0 "The §YCommittee and Staff§! balance favours the Committee"
 IVN_cabinet_won_tt:0 "The cabinet won the war of the marches"
 IVN_march_loyal:0 "Loyal March"
 IVN_march_disloyal:0 "Unreliable March"
 IVN_march_trust_now_tt:0 "Trust of [FROM.GetName] in the capital: §Y[?FROM.IVN_march_trust|0]§! of §Y100§!"
 IVN_march_measure_ready_tt:0 "No other measure is running in the march and none was taken in the last §Y30§! days"
 IVN_march_trust_plus_10_tt:0 "Trust of [FROM.GetName]: §G+10§!"
 IVN_march_trust_plus_12_tt:0 "Trust of [FROM.GetName]: §G+12§!"
 IVN_march_trust_plus_15_tt:0 "Trust of [FROM.GetName]: §G+15§!"
 IVN_march_trust_minus_8_tt:0 "Trust of [FROM.GetName]: §R-8§!"
 IVN_march_trust_minus_15_tt:0 "Trust of [FROM.GetName]: §R-15§!"
 IVN_march_hospital_train:0 "Hospital Train: [FROM.GetName]"
 IVN_march_hospital_train_desc:0 "A Committee hospital train stands at the march's station for three weeks. The doctors see everyone who comes and do not ask how the village voted."
 IVN_march_veterans_fund:0 "Veterans' Fund: [FROM.GetName]"
 IVN_march_veterans_fund_desc:0 "The march's veterans receive pensions and land from the common fund. Many of them return to the reserve."
 IVN_march_school_grant:0 "School Grant: [FROM.GetName]"
 IVN_march_school_grant_desc:0 "The Committee pays for teachers and for the road to a new school. The march's children will learn from the capital's books."
 IVN_march_commissar:0 "Committee Commissar: [FROM.GetName]"
 IVN_march_commissar_desc:0 "A commissar with signing authority goes to the march. He settles disputes with the garrison in the name of the civil authority."
 IVN_march_officer_assembly:0 "Officers' Assembly: [FROM.GetName]"
 IVN_march_officer_assembly_desc:0 "The garrison's officers meet the heads of the march's communities. The army promises to protect, the march to feed."
 IVN_march_levy:0 "Levy in the March: [FROM.GetName]"
 IVN_march_levy_desc:0 "The draft board arrives in the march ahead of schedule. Families see their sons off and remember who took them."

# Balance decisions
 IVN_command_staff_conference:0 "Conference at the Staff of the Marches"
 IVN_command_staff_conference_desc:0 "The Committee invites the generals to set out their plans. Those who have been heard obey more willingly."
 IVN_command_committee_hearings:0 "Committee Hearings"
 IVN_command_committee_hearings_desc:0 "Deputies summon the generals to open hearings. The army reports to the republic."
 IVN_command_budget_to_staff:0 "Defence Budget to the Staff"
 IVN_command_budget_to_staff_desc:0 "The staff gains the right to spend the defence budget without approval. In two months the army will have new guns and rifles, and new habits."
 IVN_command_civil_audit:0 "Civil Audit of the Army"
 IVN_command_civil_audit_desc:0 "Committee auditors inspect the staff's depots. What was listed as written off returns to the arsenals."

# Expedition
 IVN_expedition_category:0 "Northern Expedition"
 IVN_expedition_category_desc:0 "Programmes of the corps that can be used at a chosen moment while the northern expedition lasts."
 IVN_expedition_supply_columns:0 "Expedition Trains"
 IVN_expedition_supply_columns_desc:0 "Columns of lorries follow the corps along the corridor roads. The soldiers receive bread and cartridges where they fight."
 IVN_expedition_storm_assault:0 "Storm Columns"
 IVN_expedition_storm_assault_desc:0 "The corps' best companies go in the first wave. Their task is to enter a town before the enemy recovers."
 IVN_expedition_krait_bridgehead:0 "Krait Bridgehead"
 IVN_expedition_krait_bridgehead_desc:0 "Sappers throw crossings at Krait. The corps crosses the river in one dash and leaves bridges behind it."

# Revolt of the marches: the cabinet
 IVN_civil_war_category:0 "Revolt of the Marches"
 IVN_civil_war_category_desc:0 "The emergency cabinet is at war with the Itoran Liberation Legion. Marches that still trust the capital can be won back without a fight."
 IVN_march_borders_our_lines_tt:0 "The march borders land we control"
 IVN_cw_amnesty_trust_tt:0 "The march's trust in the capital is at least §Y60§!"
 IVN_cw_amnesty_offer:0 "Amnesty: [FROM.GetName]"
 IVN_cw_amnesty_offer_desc:0 "The cabinet's envoys promise the march's garrison pardon and pay. If the march still believes in the capital, it will open its gates."
 IVN_cw_amnesty_offer_tt:0 "In §Y30§! days [FROM.GetName] comes over to us if it is still held by the legion, keeps a trust of at least §Y60§! and borders our land. Its garrison brings §Y3000§! £manpower_texticon and the legion loses as many. Otherwise the price is returned."
 IVN_cw_capital_militia:0 "Militia of the Old March"
 IVN_cw_capital_militia_desc:0 "The capital's working districts raise a militia. It is poorly trained but knows every street."
 IVN_cw_issue_war_bonds:0 "War Loan"
 IVN_cw_issue_war_bonds_desc:0 "The cabinet issues defence bonds. The money goes to the factories and the debt will fall on peacetime."
 IVN_cw_rimat_arms:0 "Arms from Rimat"
 IVN_cw_rimat_arms_desc:0 "The trading houses of Rimat sell the cabinet rifles and guns from their stocks. Rimat remembers who guaranteed its freedom."
 IVN_cw_military_tribunals:0 "Military Tribunals"
 IVN_cw_military_tribunals_desc:0 "The colonels introduce tribunals for desertion and treason. The front holds, but the marches remember the sentences."
 IVN_cw_tribunals_trust_tt:0 "Trust of every frontier march: §R-5§!"
 IVN_cw_island_convoys:0 "Island Convoys"
 IVN_cw_island_convoys_desc:0 "Ships of the Island Administration bring reservists and weapons to the mainland from depots prepared for a rainy day."

# Revolt of the marches: the legion
 IVC_legion_category:0 "Itoran Liberation Legion"
 IVC_legion_category_desc:0 "The legion makes war at its marches' expense. Cabinet garrisons that do not trust the capital can be called over."
 IVC_garrison_appeal_trust_tt:0 "The march's trust in the capital is below §Y40§!"
 IVC_garrison_appeal:0 "Appeal to the Garrison: [FROM.GetName]"
 IVC_garrison_appeal_desc:0 "Former comrades write to the march's garrison: the capital betrayed the corps, the legion does not abandon its own."
 IVC_garrison_appeal_tt:0 "In §Y30§! days [FROM.GetName] comes over to the legion if it is still held by the cabinet, its trust in the capital stays below §Y40§! and it borders our land. Its garrison brings §Y3000§! £manpower_texticon and the cabinet loses as many. Otherwise the price is returned."
 IVC_requisition_march:0 "Requisition: [FROM.GetName]"
 IVC_requisition_march_desc:0 "The legion's quartermasters take bread, metal and men of fighting age against receipts of the future government."
 IVC_veterans_muster:0 "Muster of Veterans"
 IVC_veterans_muster_desc:0 "Veterans of the northern expedition receive the legion's call-up papers. Most come without a second summons."
 IVC_march_on_the_capital:0 "Offensive on the Capital"
 IVC_march_on_the_capital_desc:0 "The legion throws all its strength into the offensive south. If the blow fails, there may not be another chance like it."
 IVC_border_smugglers:0 "Smuggling over the Border"
 IVC_border_smugglers_desc:0 "Caravans carry cartridges and guns over the Boreyan passes and the northern corridor."
 IVC_border_smugglers_closed_tt:0 "The cabinet has not closed the Boreyan border"
 IVC_legion_dynamic:0 "Order of the Legion"
 IVC_legion_dynamic_desc:0 "The sum of the Itoran Liberation Legion's decisions: the army, the marches and the promises of Leonid Stalk."

# Spirits of the revolt
 IVN_cw_divided_army:0 "Divided Army"
 IVN_cw_divided_army_desc:0 "Regiments that swore to one republic fire on each other. Commanders do not know whose orders their soldiers will follow."
 IVN_cw_loyal_officers:0 "Loyal Officers"
 IVN_cw_loyal_officers_desc:0 "The officers Karn did not take with him hold the cabinet's army together."
 IVN_cw_war_bonds:0 "Defence Bonds"
 IVN_cw_war_bonds_desc:0 "The war loan's money goes to the factories, and citizens buy less and wait for victory."
 IVN_cw_counterstroke_idea:0 "The Cabinet's Counterstroke"
 IVN_cw_counterstroke_idea_desc:0 "Reserves and artillery are gathered for one blow. The cabinet's army attacks."
 IVN_cw_storm_of_vedrina:0 "Storm of Vedrina"
 IVN_cw_storm_of_vedrina_desc:0 "The cabinet's army marches on the legion's capital."
 IVC_legion_vow:0 "Oath of the Legion"
 IVC_legion_vow_desc:0 "The soldiers of the marches swore to the land they defended. They will fight to the end, but the marches keep them out of their own pockets."
 IVC_storm_of_the_capital:0 "Storm of the Capital"
 IVC_storm_of_the_capital_desc:0 "The legion throws everything into the last blow on the Old March."
 IVN_rule_of_the_legion_council:0 "Rule of the Legion Council"
 IVN_rule_of_the_legion_council_desc:0 "Itora is governed by the council of commanders who won the war of the marches. Order here is strict and politics superfluous."
 IVN_rule_of_the_patriotic_union:0 "Rule of the Patriotic Union"
 IVN_rule_of_the_patriotic_union_desc:0 "The Itoran Patriotic Union came to power with the legion. Its rallies fill whole towns, and its enemies keep silent."

# Events
 ADISCORD_ivn.6.t:0 "The Expedition Returns"
 ADISCORD_ivn.6.d:0 "The northern corps comes home without victory. Trains of wounded stand at the stations of Vedrina and Talara, and the capital's papers are already looking for culprits. At the Staff of the marches they speak of the deputies' betrayal; in the Committee, of the generals' arrogance.\n\nThe cabinet must answer now. In a month the regiments will reach their barracks and decide whom to obey, and they will remember what the capital said on the day they came back."
 ADISCORD_ivn.6.a:0 "The staff failed the campaign."
 ADISCORD_ivn.6.a_tt:0 "Trust of the northern marches [92.GetName], [95.GetName], [96.GetName] and [97.GetName]: §R-10§!"
 ADISCORD_ivn.6.b:0 "The cabinet takes the blame."
 ADISCORD_ivn.6.b_tt:0 "Trust of every frontier march: §G+10§!"
 ADISCORD_ivn.6.c:0 "Reward those who came back."
 ADISCORD_ivn.6.c_tt:0 "Trust of the northern marches [92.GetName], [95.GetName], [96.GetName] and [97.GetName]: §G+15§!"
 ADISCORD_ivn.7.t:0 "A March Changed Sides"
 ADISCORD_ivn.7.d:0 "The garrison of [IVN_defected_march.GetName] opened its gates to the enemy. The soldiers went over with the town, and our posts on the roads were the last to learn of it."
 ADISCORD_ivn.7.a:0 "It can still be won back."
 ADISCORD_ivn.8.t:0 "The Generals Fall Silent"
 ADISCORD_ivn.8.d:0 "The Committee has taken the army under full control. Deputies sign the orders, and the Staff of the marches answers them briefly and late. Officers say they have been turned into clerks, and some are already writing their resignations.\n\nPart of the staff's powers can be returned. Or the resignations can be accepted and new commanders raised, but the army will remember how it was treated."
 ADISCORD_ivn.8.a:0 "Give the staff its voice back."
 ADISCORD_ivn.8.b:0 "Accept the resignations."
 ADISCORD_ivn.8.b_tt:0 "Trust of the northern marches [92.GetName], [95.GetName], [96.GetName] and [97.GetName]: §R-5§!"
 ADISCORD_ivn.9.t:0 "The Staff's Ultimatum"
 ADISCORD_ivn.9.d:0 "The Staff of the marches no longer asks but demands: a separate budget, the right to appoint commanders, and the closure of the papers that write about the army. Colonels wait in the Committee's anteroom, and no one knows how many regiments stand behind them.\n\nThe Committee can accept the terms and keep the peace in the capital. Or it can summon the deputies and remind the army whom it serves, if the army is still willing to listen."
 ADISCORD_ivn.9.a:0 "Accept the staff's terms."
 ADISCORD_ivn.9.a_tt:0 "Trust of the northern marches [92.GetName], [95.GetName], [96.GetName] and [97.GetName]: §G+5§!"
 ADISCORD_ivn.9.b:0 "Summon the Committee."

# Focuses of the frontier, the command, the islands, the revolt and the legion
 IVN_lakora_textile_mills:0 "Lakora Textile Mills"
 IVN_lakora_textile_mills_desc:0 "Lakora sews greatcoats and bandages for the whole republic. Factory work keeps frontier families closer to the capital than any proclamation."
 IVN_trust_lakora_5_tt:0 "Trust of [99.GetName]: §G+5§!"
 IVN_moressa_foundries:0 "Moressa Foundries"
 IVN_moressa_foundries_desc:0 "The old Moressa foundries cast barrels and plates again. The Committee pays for every melt, and the town sees the capital's money for the first time in ten years."
 IVN_trust_moressa_5_tt:0 "Trust of [98.GetName]: §G+5§!"
 IVN_ilvan_canal:0 "Ilvan Canal"
 IVN_ilvan_canal_desc:0 "The canal links Ilvan and Olsia with the river of the Old March. Barges carry grain south and timber north, and the frontier stops being the republic's dead end."
 IVN_trust_ilvan_olsia_5_tt:0 "Trust of [100.GetName] and [101.GetName]: §G+5§!"
 IVN_committee_war_economy:0 "The Committee's Economy"
 IVN_committee_war_economy_desc:0 "The planning board gains the right to allocate raw materials between the marches. Factories now argue with the figures of a common plan rather than with the Committee."
 IVN_expedition_supply_trains:0 "Expedition Trains"
 IVN_expedition_supply_trains_desc:0 "The corps will march along the broken roads of the corridor. The Committee gathers lorries, field kitchens and depots along the border so the soldiers are not left without bread on the third day."
 IVN_expedition_storm_columns:0 "Storm Columns"
 IVN_expedition_storm_columns_desc:0 "The Staff of the marches picks its best companies for storm columns. They are to enter the corridor towns first, before the northern republics can dig in."
 IVN_expedition_krait_crossing:0 "Krait Crossing"
 IVN_expedition_krait_crossing_desc:0 "Sappers survey the fords and bridges at Krait. If the corps holds the crossing, the southern lands of the corridor will be cut off from their capitals."
 IVN_expedition_field_hospitals:0 "Field Hospitals"
 IVN_expedition_field_hospitals_desc:0 "The doctors of the marches follow the corps. The wounded come home on hospital trains rather than in casualty lists, and frontier families know the republic did not abandon their sons."
 IVN_trust_northern_10_tt:0 "Trust of the northern marches [92.GetName], [95.GetName], [96.GetName] and [97.GetName]: §G+10§!"
 IVN_frontier_audit:0 "Audit of the Frontier"
 IVN_frontier_audit_desc:0 "A Committee commission tours the eight frontier marches. Its report is indecently honest: Vedrina dislikes the capital, Serenga does not believe it, and Olsia is still waiting."
 IVN_trust_all_5_tt:0 "Trust of every frontier march: §G+5§!"
 IVN_frontier_veterans_fund:0 "Veterans' Fund"
 IVN_frontier_veterans_fund_desc:0 "The veterans of Vorkerland's collapse receive pensions from a common fund. Vedrina and Talara hear from the Committee, for the first time, promises that are kept rather than orders."
 IVN_trust_vedrina_talara_10_tt:0 "Trust of [95.GetName] and [96.GetName]: §G+10§!"
 IVN_frontier_school_grants:0 "School Grants"
 IVN_frontier_school_grants_desc:0 "The schools of the marches receive money for teachers and for the roads that reach them. Frontier children learn from the same books as children of the capital."
 IVN_trust_moressa_lakora_5_tt:0 "Trust of [98.GetName] and [99.GetName]: §G+5§!"
 IVN_frontier_commissars:0 "Committee Commissars"
 IVN_frontier_commissars_desc:0 "A commissar with signing authority goes to every march. He answers to the Committee, not to the staff, and the garrisons see civil authority above them for the first time."
 IVN_frontier_officer_councils:0 "Officers' Assemblies"
 IVN_frontier_officer_councils_desc:0 "Garrison officers decide the needs of their own marches. The frontier gains a voice, but that voice comes from the barracks."
 IVN_frontier_vedrina_charter:0 "Charter of Vedrina"
 IVN_frontier_vedrina_charter_desc:0 "Vedrina is a town of regiments and old grievances. The charter recognises its right to a local council and its own budget, and the Committee promises to stop deciding for it in the capital."
 IVN_trust_vedrina_15_tt:0 "Trust of [95.GetName]: §G+15§!"
 IVN_frontier_border_police:0 "Border Guard"
 IVN_frontier_border_police_desc:0 "The border with the corridor is no longer held by the staff's garrisons but by the guard of the marches. Locals serve near their own homes and know every path."
 IVN_trust_serenga_talara_5_tt:0 "Trust of [92.GetName] and [96.GetName]: §G+5§!"
 IVN_frontier_lakora_settlers:0 "Settlers of the Inner Marches"
 IVN_frontier_lakora_settlers_desc:0 "Refugees from Vorkerland receive land in Moressa, Lakora, Ilvan and Olsia. The new farms owe the republic everything they have."
 IVN_trust_inner_8_tt:0 "Trust of the inner marches [98.GetName], [99.GetName], [100.GetName] and [101.GetName]: §G+8§!"
 IVN_frontier_pact_of_marches:0 "Pact of the Marches"
 IVN_frontier_pact_of_marches_desc:0 "The eight frontier marches sign a common pact with the Committee. It does not erase old grievances, but it gives them a seat at one table rather than in the street."
 IVN_trust_all_10_tt:0 "Trust of every frontier march: §G+10§!"
 IVN_command_question:0 "Who Commands the Army"
 IVN_command_question_desc:0 "The Itoran constitution is silent on who orders the army of the marches in an emergency. The Committee and the staff answer differently, and the answer is needed before the march begins."
 IVN_command_civil_control:0 "Civil Control"
 IVN_command_civil_control_desc:0 "The army answers to the Committee, full stop. Generals receive a budget and respect, but orders to march are signed by the civil authority."
 IVN_command_staff_autonomy:0 "Autonomy of the Staff"
 IVN_command_staff_autonomy_desc:0 "The Staff of the marches plans the defence and the northern march itself. The Committee sets goals but does not interfere with how the army reaches them."
 IVN_command_war_ministry_civilians:0 "A Civilian Defence Minister"
 IVN_command_war_ministry_civilians_desc:0 "The defence ministry is led by a deputy, not a general. His first act is to open the depots the staff had listed as empty."
 IVN_command_parliament_oversight:0 "Parliamentary Oversight"
 IVN_command_parliament_oversight_desc:0 "Soldiers of the marches may write complaints directly to deputies. Letters from the barracks are read aloud in session, and officers learn to answer for their men."
 IVN_command_general_inspectorate:0 "General Inspectorate"
 IVN_command_general_inspectorate_desc:0 "Staff inspectors examine every regiment of the marches. Weak commanders are removed without trial, strong ones promoted without consulting the Committee."
 IVN_command_staff_academy:0 "Staff Academy"
 IVN_command_staff_academy_desc:0 "A staff academy opens in the Old March. Its graduates know the corridor from maps and studies of the collapse campaigns, not from rumour."
 IVN_command_promote_karn:0 "Karn Leads the Corps"
 IVN_command_promote_karn_desc:0 "General Rostislav Karn is the best commander of the marches and the most dangerous man in Vedrina. The Committee gives him the northern corps: let his ambition work for the republic."
 IVN_command_promote_karn_tt:0 "During the civil war, Karn's Directorate receives §Y15%§! of the regular army instead of §Y10%§!, an additional §Y10000§! £manpower_texticon and §Y25§! £army_experience"
 IVN_trust_vedrina_10_tt:0 "Trust of [95.GetName]: §G+10§!"
 IVN_command_sideline_karn:0 "Retire Karn"
 IVN_command_sideline_karn_desc:0 "The Committee sends General Karn into honourable retirement. Vedrina takes it as an insult, but the corps will be led by officers who remember their oath."
 IVN_command_sideline_karn_tt:0 "During the civil war, the Directorate receives §Y5%§! of the regular army instead of §Y10%§! and §Y10000§! £manpower_texticon fewer recruits. The Committee gains §YLoyal Officers§! for §Y180§! days."
 IVN_trust_vedrina_minus_10_tt:0 "Trust of [95.GetName]: §R-10§!"
 IVN_command_unified_command:0 "Unified Command"
 IVN_command_unified_command_desc:0 "The dispute over command of the army is settled, at least on paper. The marches have one staff, one set of maps and one chain of orders."
 IVN_islands_survey:0 "Survey of the Islands"
 IVN_islands_survey_desc:0 "The Island Administration receives visitors from the capital for the first time in years. The commission counts piers, depots and the people the republic can rely on if the mainland burns."
 IVN_islands_naval_station:0 "Naval Station"
 IVN_islands_naval_station_desc:0 "Raidal receives berths for the republic's ships. Convoys between the mainland and the islands no longer depend on the weather and fishing boats."
 IVN_islands_fisheries:0 "Fishing Cooperatives"
 IVN_islands_fisheries_desc:0 "The island cooperatives receive a state order for fish and preserves. Mainland towns eat more cheaply and the islands grow rich on deliveries."
 IVN_islands_refuge:0 "Island Refuge"
 IVN_islands_refuge_desc:0 "Depots, schools and barracks are prepared on the islands in case of trouble on the mainland. If the marches rise, men and weapons for the cabinet will come from here."
 IVN_islands_refuge_tt:0 "During the revolt of the marches the islands will send the cabinet reinforcements and weapons."
 IVN_islands_fortress:0 "Island Fortress"
 IVN_islands_fortress_desc:0 "Batteries close the shores of Raidal. Whoever comes from the sea, the islands will remain the republic."
 IVN_islands_charter:0 "Island Charter"
 IVN_islands_charter_desc:0 "The charter fixes the rights of the Island Administration and its duty to the republic. The islands know what they fight for, and the capital knows what it can count on."
 IVN_cw_cabinet_at_war:0 "A Wartime Cabinet"
 IVN_cw_cabinet_at_war_desc:0 "The regiments of Vedrina march south, and in the capital sits a cabinet that a month ago answered for the failed expedition. Now it answers for whether Itora remains one country."
 IVN_cw_defend_the_old_march:0 "Defence of the Old March"
 IVN_cw_defend_the_old_march_desc:0 "The capital digs ditches on its outskirts. Working districts build barricades, and the schools become muster points for the militia."
 IVN_cw_lakora_line:0 "The Lakora Line"
 IVN_cw_lakora_line_desc:0 "A line of trenches rises between Moressa, Lakora and the legion's regiments. It runs through fields where bread was sown in spring."
 IVN_cw_armoured_trains:0 "Armoured Trains"
 IVN_cw_armoured_trains_desc:0 "The workshops of the Old March clad trains with sheet steel. The railways built for the expedition now carry guns against their own."
 IVN_cw_reserve_divisions:0 "Reserve Divisions"
 IVN_cw_reserve_divisions_desc:0 "Reservists of the southern marches receive rifles at the stations and leave for the front within a week. They are trained on the way."
 IVN_cw_artillery_parks:0 "Artillery Parks"
 IVN_cw_artillery_parks_desc:0 "The cabinet gathers guns from every depot in the republic. The legion left with the best regiments, but the guns stayed in the capital's arsenals."
 IVN_cw_counterstroke:0 "Counterstroke"
 IVN_cw_counterstroke_desc:0 "The reserves and the guns are assembled. The cabinet's staff prepares a blow that should throw the legion back past Kantoria."
 IVN_cw_take_vedrina:0 "Storm of Vedrina"
 IVN_cw_take_vedrina_desc:0 "The legion holds out in its capital. To end the war, the cabinet will have to take the town where the army of the marches was born."
 IVN_cw_emergency_powers:0 "Emergency Powers"
 IVN_cw_emergency_powers_desc:0 "The cabinet gains the right to issue laws without deputies for the duration of the revolt. The only question is who will use that right."
 IVN_cw_government_of_colonels:0 "Government of Colonels"
 IVN_cw_government_of_colonels_desc:0 "Colonels loyal to the cabinet take the ministries. They fight their former comrades and do not intend to return power to the deputies before victory."
 IVN_cw_return_of_the_committee:0 "Return of the Committee"
 IVN_cw_return_of_the_committee_desc:0 "Kulivanov dissolves the emergency cabinet and returns power to the Committee. The republic will fight as a republic, with deputies, newspapers and elections after the war."
 IVN_cw_return_of_the_committee_tt:0 "The government returns to §Yhumanism§!. After the victory over the legion the §YHumanist Shield§! course opens again."
 IVN_cw_war_ministry_of_colonels:0 "The Colonels' War Ministry"
 IVN_cw_war_ministry_of_colonels_desc:0 "The ministry works like a staff: reports in the morning, orders by noon, executions for sabotage by evening."
 IVN_cw_martial_law:0 "Martial Law"
 IVN_cw_martial_law_desc:0 "Martial law extends to the whole republic. Draft boards work around the clock, and the newspapers print only bulletins."
 IVN_cw_citizens_committees:0 "Citizens' Committees"
 IVN_cw_citizens_committees_desc:0 "Defence committees of deputies, doctors and teachers form in every town. They gather volunteers and do not let the army forget whom it fights for."
 IVN_trust_inner_5_tt:0 "Trust of the inner marches [98.GetName], [99.GetName], [100.GetName] and [101.GetName]: §G+5§!"
 IVN_cw_red_cross_of_the_marches:0 "Red Cross of the Marches"
 IVN_cw_red_cross_of_the_marches_desc:0 "The Committee's orderlies work on both sides of the front. In Vedrina and Talara they are let into the legion's hospitals, and the rebels learn that the capital feeds their families."
 IVN_cw_victory_programme:0 "Programme of Victory"
 IVN_cw_victory_programme_desc:0 "The cabinet publishes a programme: everything for the front, but after the war the marches are rebuilt at the republic's expense. Factories work three shifts."
 IVN_cw_appeal_to_the_marches:0 "Appeal to the Marches"
 IVN_cw_appeal_to_the_marches_desc:0 "Kulivanov speaks on the radio to the legion's soldiers: whoever returns home will not be tried. Not all believe, but many listen."
 IVN_trust_northern_5_tt:0 "Trust of the northern marches [92.GetName], [95.GetName], [96.GetName] and [97.GetName]: §G+5§!"
 IVN_cw_war_loan:0 "War Loan"
 IVN_cw_war_loan_desc:0 "Citizens of the capital buy defence bonds. The money goes to factories, and the bonds to every home that now has a stake in victory."
 IVN_cw_rimat_and_neighbours:0 "Rimat and the Neighbours"
 IVN_cw_rimat_and_neighbours_desc:0 "Itora guaranteed Rimat's independence and now asks for a favour in return. The trading houses of Rimat are ready to sell arms, for money and future treaties."
 IVN_cw_factories_to_the_front:0 "Factories to the Front"
 IVN_cw_factories_to_the_front_desc:0 "The workshops of the Old and Southern Marches switch to cartridges and rifles. The republic can no longer wait for the legion to tire."
 IVN_cw_close_the_boreyan_border:0 "Close the Boreyan Border"
 IVN_cw_close_the_boreyan_border_desc:0 "Smugglers carry cartridges to the legion over the Boreyan passes. The cabinet comes to terms with the republic's border guards and closes the trails."
 IVN_cw_close_the_boreyan_border_tt:0 "The legion can no longer buy arms with the §YSmuggling over the Border§! decision."
 IVN_cw_propaganda_of_unity:0 "One Itora"
 IVN_cw_propaganda_of_unity_desc:0 "Posters, leaflets and radio repeat one thing: the marches and the capital are one country. The legion is still strong, but its soldiers begin to ask what they fight for."
 IVN_cw_marches_united_again:0 "The Marches United Again"
 IVN_cw_marches_united_again_desc:0 "The legion's last regiments have laid down their arms. The republic's flag flies over Vedrina again, but its streets will look on soldiers from the capital as strangers for a long time."
 IVN_pw_marches_reunited:0 "After the Revolt"
 IVN_pw_marches_reunited_desc:0 "The war of the marches is over, but every frontier family has someone who fought on the other side. The new authority must decide what to do with the defeated."
 IVN_pw_amnesty:0 "Amnesty"
 IVN_pw_amnesty_desc:0 "The defeated are sent home. Officers lose their ranks, soldiers do not. Many will return to the army that was their enemy only yesterday."
 IVN_trust_all_15_tt:0 "Trust of every frontier march: §G+15§!"
 IVN_pw_tribunals:0 "Tribunals"
 IVN_pw_tribunals_desc:0 "The ringleaders are tried in public and the sentences printed in the papers. The new authority shows that no one will again raise regiments against the capital unpunished."
 IVN_trust_all_minus_10_tt:0 "Trust of every frontier march: §R-10§!"
 IVN_pw_rebuild_vedrina:0 "Rebuild Vedrina"
 IVN_pw_rebuild_vedrina_desc:0 "Vedrina and Talara lie in ruins after the assaults. The republic rebuilds them first, so the frontier sees that the capital came not only with troops."
 IVN_pw_veterans_settlement:0 "Veterans of Two Wars"
 IVN_pw_veterans_settlement_desc:0 "Soldiers of the northern expedition and of the revolt now serve in the same regiments. They share the memory of defeats and a common score to settle with the north."
 IVN_pw_frontier_garrisons:0 "Frontier Garrisons"
 IVN_pw_frontier_garrisons_desc:0 "Garrisons occupy the northern border again, but now they are commanded by officers tested in the war of the marches."
 IVN_pw_charter_of_the_marches:0 "Statute of the Marches"
 IVN_pw_charter_of_the_marches_desc:0 "A new statute fixes the rights of the frontier marches and the duties of the capital. The victors write it, but everyone signs."
 IVN_pw_memory_of_the_retreat:0 "Memory of the Retreat"
 IVN_pw_memory_of_the_retreat_desc:0 "Itora survived defeat in the north and a war with itself. Now it looks west again and knows the price of every campaign."
 IVC_legion_oath:0 "Oath of the Legion"
 IVC_legion_oath_desc:0 "On the square of Vedrina the regiments of the marches swear an oath not to the cabinet or the Committee but to the land they defended. Leonid Stalk reads it first."
 IVC_veterans_of_the_expedition:0 "Veterans of the Expedition"
 IVC_veterans_of_the_expedition_desc:0 "The soldiers who came back from the north have not forgiven the capital the retreat. The legion calls them back to the ranks under their old banners."
 IVC_assault_companies:0 "Assault Companies"
 IVC_assault_companies_desc:0 "The best companies of the northern corps become the legion's striking fist. They know how to take towns; the corridor taught them."
 IVC_trophy_depots:0 "Frontier Depots"
 IVC_trophy_depots_desc:0 "The depots of the northern marches, filled for the expedition, fell to the legion. The cabinet stocked them for a war in the north; the legion will use them closer to home."
 IVC_vedrina_passes:0 "Passes of Vedrina"
 IVC_vedrina_passes_desc:0 "The hills around Vedrina become a fortified district. If the cabinet comes for the legion's capital, it will pay for every slope."
 IVC_frontier_cavalry:0 "Mobile Detachments"
 IVC_frontier_cavalry_desc:0 "The lorries and motorcycles of the border guard are gathered into mobile detachments. The legion fights faster than the cabinet can read its bulletins."
 IVC_march_on_the_old_march:0 "March on the Old March"
 IVC_march_on_the_old_march_desc:0 "The capital is not a fortress but a town weary of the cabinet. The legion's staff plans the offensive south."
 IVC_storm_the_capital:0 "Storm the Capital"
 IVC_storm_the_capital_desc:0 "The legion stands at the outskirts of the Old March. One more blow, and the cabinet either surrenders or flees to the islands."
 IVC_karn_takes_command:0 "Stalk Takes Command"
 IVC_karn_takes_command_desc:0 "Leonid Stalk did not ask for power, but he did not refuse it. The legion needs one voice, and that voice speaks from the staff in Vedrina."
 IVC_council_of_the_legion:0 "Council of the Legion"
 IVC_council_of_the_legion_desc:0 "The legion is ruled by a council of regimental commanders. No parties and no rallies: officers decide, soldiers obey, the marches wait for victory."
 IVC_council_of_the_legion_tt:0 "If the legion wins, Itora receives the spirit §YRule of the Legion Council§!."
 IVC_patriotic_union:0 "Patriotic Union"
 IVC_patriotic_union_desc:0 "The Itoran Patriotic Union comes out of hiding and becomes the legion's party. It promises the marches not orders but a voice, loud and angry."
 IVC_patriotic_union_tt:0 "If the legion wins, Itora receives the spirit §YRule of the Patriotic Union§!."
 IVC_council_field_courts:0 "Field Courts"
 IVC_council_field_courts_desc:0 "Looters and deserters are tried the same day. The marches fear the legion but also respect it: there is no plunder behind its lines."
 IVC_council_officers_cabinet:0 "Cabinet of Officers"
 IVC_council_officers_cabinet_desc:0 "The legion council appoints ministers from staff officers. The marches are run like the supply of an army: precisely and without argument."
 IVC_union_mass_rallies:0 "Union Rallies"
 IVC_union_mass_rallies_desc:0 "Union speakers address the squares of the marches. Young people join the legion a whole street at a time."
 IVC_union_patriotic_press:0 "Patriotic Press"
 IVC_union_patriotic_press_desc:0 "Union newspapers circulate in the cabinet's lands too. Every march reads how the capital abandoned the northern corps."
 IVN_trust_cabinet_held_minus_5_tt:0 "Trust of the cabinet's frontier marches: §R-5§!"
 IVC_new_itora:0 "A New Itora"
 IVC_new_itora_desc:0 "The legion is no longer a revolt but a government awaiting its capital. Its decrees are already obeyed in half the marches."
 IVC_requisitions_of_the_marches:0 "Requisitions of the Marches"
 IVC_requisitions_of_the_marches_desc:0 "The legion has no treasury, only the marches. Quartermasters take bread, steel and horses against receipts the future government will honour."
 IVC_smuggling_routes:0 "Smuggling Routes"
 IVC_smuggling_routes_desc:0 "Caravans of cartridges cross the Boreyan passes and the northern corridor. They are paid for with the expedition's trophies."
 IVC_vedrina_workshops:0 "Workshops of Vedrina"
 IVC_vedrina_workshops_desc:0 "The regiments' repair shops become arms works. Vedrina makes its own rifles."
 IVC_roads_of_the_legion:0 "Roads of the Legion"
 IVC_roads_of_the_legion_desc:0 "The legion's sappers repair the roads between its regiments. Reinforcements reach the front in a day rather than a week."
 IVC_war_economy_of_the_marches:0 "War Economy of the Marches"
 IVC_war_economy_of_the_marches_desc:0 "Every factory of the marches works to the legion's orders. The owners grumble, but it is hard to argue with a quartermaster holding a rifle."
 IVC_captured_arsenals:0 "Captured Arsenals"
 IVC_captured_arsenals_desc:0 "Arsenals the cabinet failed to evacuate pass to the legion along with their watchmen and inventories."
 IVC_shame_of_the_expedition:0 "Shame of the Expedition"
 IVC_shame_of_the_expedition_desc:0 "The legion never tires of the reminder: the corps did not lose in the north, it was betrayed in the capital. The story is told in every tavern of the marches."
 IVC_appeal_to_the_garrisons:0 "Appeal to the Garrisons"
 IVC_appeal_to_the_garrisons_desc:0 "The cabinet's garrisons receive letters from former comrades. The legion does not ask for treason; it offers a return to their own."
 IVC_legion_newspaper:0 "The Legion's Newspaper"
 IVC_legion_newspaper_desc:0 "\"Voice of the Marches\" is printed daily in Vedrina. It is read in the trenches of both sides."
 IVC_agents_in_the_old_march:0 "Agents in the Old March"
 IVC_agents_in_the_old_march_desc:0 "The legion's supporters in the capital spread rumours, disrupt deliveries and write Stalk's name on the walls."
 IVC_veterans_letters:0 "Veterans' Letters"
 IVC_veterans_letters_desc:0 "Veterans write home: the legion feeds, heals and keeps its word. Families of the marches begin to trust Vedrina more than the capital."
 IVN_trust_legion_held_minus_5_tt:0 "Trust of the legion's marches in the capital: §R-5§!"
 IVC_the_marches_rise:0 "The Marches Rise"
 IVC_the_marches_rise_desc:0 "The revolt stops being the regiments' affair alone. Villages, depots and workers' settlements of the frontier rise."
 IVC_northern_contacts:0 "Northern Contacts"
 IVC_northern_contacts_desc:0 "The legion's officers fought in the corridor and know the commanders there. Old enemies come to terms faster than old allies."
 IVC_boreyan_volunteers:0 "Volunteers from beyond the Pass"
 IVC_boreyan_volunteers_desc:0 "Mercenaries and fugitives come from beyond the Boreyan border. The legion does not ask what they are running from."
 IVC_corridor_veterans:0 "Lessons of the Corridor"
 IVC_corridor_veterans_desc:0 "The legion studies the battles of the northern expedition. Its officers know why the corps lost and do not mean to repeat the mistakes."
 IVC_promise_of_revanche:0 "Promise of Revanche"
 IVC_promise_of_revanche_desc:0 "Stalk promises that after the capital the legion will march north and finish what the cabinet did not let it finish."
 IVN_parliament_sessions:0 "Session of Parliament"
 IVN_parliament_sessions_desc:0 "For the first time since Vorkerland's collapse the Itoran parliament meets for a full session. The Committee reports to the deputies, and the parties divide the seats on the new commissions."
 IVN_parliament_coalition_pragmatists:0 "Coalition with the Pragmatists"
 IVN_parliament_coalition_pragmatists_desc:0 "The humanists come to terms with the Stabilisation Party. The new coalition counts money, mends roads and dislikes generals who ask for more."
 IVN_parliament_coalition_etatists:0 "Coalition with the Etatists"
 IVN_parliament_coalition_etatists_desc:0 "The humanists share power with the etatist Emergency Committee. The state grows stronger, and the Staff of the marches gains allies in the government."
 IVN_parliament_budget_reform:0 "Budget Reform"
 IVN_parliament_budget_reform_desc:0 "Parliament rewrites the budget: fewer emergency items, more money for the marches. The Eastern March gets its first large construction project in ten years."
 IVN_parliament_defence_law:0 "Defence Law"
 IVN_parliament_defence_law_desc:0 "A new law obliges every march to keep a trained reserve. Draft boards receive lists, and the staff receives men."
 IVN_parliament_press_freedom:0 "Freedom of the Press"
 IVN_parliament_press_freedom_desc:0 "The papers of the marches write about the capital whatever they think. The Committee dislikes it, but the frontier feels heard for the first time."
 IVN_parliament_emergency_statute:0 "Statute of Emergency"
 IVN_parliament_emergency_statute_desc:0 "Parliament writes the rules for war in advance: who declares martial law, who lifts it and how long it may last."
 IVN_parliament_ban_the_union:0 "Ban the Patriotic Union"
 IVN_parliament_ban_the_union_desc:0 "The Itoran Patriotic Union is outlawed. Its clubs are closed and its papers confiscated, and its leaders leave for Vedrina, to the regiments that listen to them."
 IVN_parliament_ban_the_union_tt:0 "If the marches rise, the §YItoran Liberation Legion§! receives §Y5000§! £manpower_texticon fewer."
 IVN_trust_northern_minus_5_tt:0 "Trust of the northern marches [92.GetName], [95.GetName], [96.GetName] and [97.GetName]: §R-5§!"
 IVN_parliament_tolerate_the_union:0 "Tolerate the Patriotic Union"
 IVN_parliament_tolerate_the_union_desc:0 "The Union remains in parliament and on the streets. As long as its speakers curse the capital from the rostrum rather than the barricades, the Committee is willing to listen."
 IVN_parliament_tolerate_the_union_tt:0 "If the marches rise, the Union's branches back the §YItoran Liberation Legion§! at once: it receives another §Y5000§! £manpower_texticon."
 IVN_parliament_republic_of_marches:0 "Republic of the Marches"
 IVN_parliament_republic_of_marches_desc:0 "Parliament adopts an amendment: the marches are not provinces of the capital but its foundation. Itora enters the western question as a country that knows who decides in it."
 IVN_rc_reconstruction_council:0 "Reconstruction Council"
 IVN_rc_reconstruction_council_desc:0 "The northern question is closed, and for the first time in years the republic can think about the next decade rather than the next disaster. The Reconstruction Council gathers ministers, engineers and envoys of the marches in a single hall."
 IVN_rc_revolt_settled_tt:0 "The revolt of the marches is not under way and can no longer begin"
 IVN_rc_industry_census:0 "Industrial Census"
 IVN_rc_industry_census_desc:0 "The council's enumerators visit every workshop, mine and depot of the marches. For the first time the republic has an honest map of what survived, what was looted and what can be raised within a year."
 IVN_rc_civilian_priority:0 "Civilian Priority"
 IVN_rc_civilian_priority_desc:0 "The council gives the first machine tools to civilian plants. Moressa and Ilvan will make ploughs, cloth and lorries, and weapons will wait until people have bread."
 IVN_rc_military_priority:0 "Military Priority"
 IVN_rc_military_priority_desc:0 "The West will not leave Itora alone while its army is weak. The machine tools go to Lakora and the Eastern March, where the ore of the marches will again become barrels and shells."
 IVN_rc_consumer_cooperatives:0 "Consumer Cooperatives"
 IVN_rc_consumer_cooperatives_desc:0 "The shops of the inner marches join cooperatives with shared depots and shared prices. An Olsian farmer no longer sells his harvest to a middleman for nothing."
 IVN_rc_export_offices:0 "Export Offices"
 IVN_rc_export_offices_desc:0 "The republic's offices sell the cloth and grain of the marches to the neighbours and bring back blueprints and machine tools. Every deal teaches Itoran engineers what they missed during the years of war."
 IVN_rc_arms_workshops:0 "Arms Workshops"
 IVN_rc_arms_workshops_desc:0 "The workshops of the Eastern March run three shifts. The first batches of rifles go not to the depots but straight to the regiments that have waited for them since the war."
 IVN_rc_state_arms_orders:0 "State Arms Orders"
 IVN_rc_state_arms_orders_desc:0 "The republic orders guns years in advance. The plant in the Old March Forest gets a guaranteed contract, and its designers get the right to make mistakes."
 IVN_rc_steel_of_the_marches:0 "Steel of the Marches"
 IVN_rc_steel_of_the_marches_desc:0 "The Lakora and Western March pits flooded during the troubles are pumped out and shored up again. A narrow-gauge line from the Western March carries ore to furnaces that no longer stand idle."
 IVN_rc_synthetic_plant:0 "Synthetic Plant"
 IVN_rc_synthetic_plant_desc:0 "Itora has neither oil nor rubber, but it has coal and chemists. A plant rises in the Middle March to turn the one into the other."
 IVN_rc_upper_march_quarries:0 "Upper March Quarries"
 IVN_rc_upper_march_quarries_desc:0 "The council's geologists find bauxite and chromium ore in the Upper March. A road is built to the quarries, and the mountain villages have work again."
 IVN_rc_private_concessions:0 "Private Concessions"
 IVN_rc_private_concessions_desc:0 "The council leases the seaboard yards and workshops to those willing to invest their own money. The pragmatists are pleased, and the Committee hopes the profit will stay in the marches."
 IVN_rc_state_trusts:0 "State Trusts"
 IVN_rc_state_trusts_desc:0 "The factories of the marches merge into trusts run from the capital. The etatists get what they have argued for for years: one economy, one plan and one line of responsibility."
 IVN_rc_industrial_cluster:0 "Old March Industrial Hub"
 IVN_rc_industrial_cluster_desc:0 "A belt of factories grows around the capital, linked by shared roads, a power station and schools for foremen. Itora is no longer a country of scattered workshops."
 IVN_rc_roads_commission:0 "Roads Commission"
 IVN_rc_roads_commission_desc:0 "Itora's roads still remember the columns of the collapse: broken bridges, burnt stations, abandoned crossings. The commission begins with the most remote marches, which lorries cannot reach even in summer."
 IVN_rc_northern_military_roads:0 "Military Roads to the North"
 IVN_rc_northern_military_roads_desc:0 "New lines run to Serenga and Kantoria, towards the corridor border. If the West burns again, the army of the marches will reach the border in days rather than weeks."
 IVN_rc_southern_trade_roads:0 "Southern Trade Roads"
 IVN_rc_southern_trade_roads_desc:0 "The council puts its money where it returns fastest: into the roads of the Southern March and the Northern Shore. Goods will travel along them, not regiments."
 IVN_rc_vedrina_depot:0 "Vedrina Depot"
 IVN_rc_vedrina_depot_desc:0 "The Vedrina locomotive depot assembles trains again, armoured ones included. The town of regiments gets work that does not depend on the favour of the staff."
 IVN_rc_trust_vedrina_5_tt:0 "Trust of [95.GetName]: §G+5§!"
 IVN_rc_corridor_staging:0 "Corridor Staging Points"
 IVN_rc_corridor_staging_desc:0 "Lorry parks and barracks for units on the march are built along the northern border. A regiment that reaches the corridor no longer sleeps in the open."
 IVN_rc_coastal_road:0 "Coastal Road"
 IVN_rc_coastal_road_desc:0 "A road along the Southern Seaboard links the fishing villages to the towns of the marches. Warehouses and canneries grow up around the piers."
 IVN_rc_seaboard_fair:0 "Seaboard Fair"
 IVN_rc_seaboard_fair_desc:0 "Merchants from every march and from the neighbours come to the first seaboard fair since the wars. People see full stalls and begin to believe that the peace will last."
 IVN_rc_capital_development:0 "Building the Old March"
 IVN_rc_capital_development_desc:0 "The capital clears the wastelands of the collapse for new districts and factory sites. The Old March grows again instead of patching holes."
 IVN_rc_eastern_line:0 "Eastern Line"
 IVN_rc_eastern_line_desc:0 "A lateral road is laid along the Boreyan border, and pillboxes are set along it. The neighbours are friendly, but the council remembers how quickly neighbours change."
 IVN_rc_bridge_engineers:0 "Bridge Engineers"
 IVN_rc_bridge_engineers_desc:0 "The sapper companies that rebuilt the bridges of the marches become a permanent corps. They build fast and know where the army will need a bridge."
 IVN_rc_transport_network:0 "Unified Transport Network"
 IVN_rc_transport_network_desc:0 "The roads, lines and bridges of the marches are joined into one network with one timetable. The most distant outpost is now two days from the capital."
 IVN_rc_academy_of_the_marches:0 "Academy of the Marches"
 IVN_rc_academy_of_the_marches_desc:0 "Scholars who scattered to the provinces during the troubles receive a common home in the Old March. The academy promises them laboratories, a salary and the right to work without glancing at the front."
 IVN_rc_applied_institutes:0 "Applied Institutes"
 IVN_rc_applied_institutes_desc:0 "The academy works for the factories: every laboratory is attached to a workshop, every topic is approved by the council. Science becomes part of the reconstruction plan."
 IVN_rc_free_universities:0 "Free Universities"
 IVN_rc_free_universities_desc:0 "The universities of the marches receive self-government and the right to choose their own subjects. The humanists call it the return of the republic, and the factories grumble that results will take a long time."
 IVN_rc_radio_laboratory:0 "Radio Laboratory"
 IVN_rc_radio_laboratory_desc:0 "The academy's engineers build field radios and equipment for staffs. For the first time the army of the marches will be able to talk to its regiments without runners."
 IVN_rc_medical_faculty:0 "Medical Faculty"
 IVN_rc_medical_faculty_desc:0 "A medical faculty with a clinic for the whole march opens in Lakora. The doctors trained here will go to the regiments and to villages that have not seen a doctor since the war."
 IVN_rc_science_center:0 "Science Town"
 IVN_rc_science_center_desc:0 "A science town with laboratories, dormitories and experimental workshops is built outside the capital. Itora no longer chases its neighbours but prepares to overtake them."
 IVN_rc_weapons_bureau:0 "Weapons Bureau"
 IVN_rc_weapons_bureau_desc:0 "The bureau's designers take apart the trophies of every war of the marches in search of the best. Itora's new rifle will be simpler, lighter and more reliable than the old ones."
 IVN_rc_motor_bureau:0 "Motor Bureau"
 IVN_rc_motor_bureau_desc:0 "The bureau receives the first domestically assembled lorries and orders to turn them into an armoured vehicle. The engineers argue about armour, engines and whether the roads of the marches will bear them."
 IVN_rc_cipher_bureau:0 "Cipher Bureau"
 IVN_rc_cipher_bureau_desc:0 "The academy's mathematicians work on the staff's ciphers and on intercepted dispatches of the neighbours. The newspapers never mention the bureau, but the whole council reads its reports."
 IVN_rc_republic_of_scholars:0 "Republic of Scholars"
 IVN_rc_republic_of_scholars_desc:0 "Graduates of the academy lead factories, staffs and ministries. Itora, which lived by war for years, learns to live by knowledge."
 IVN_rc_social_ministry:0 "Ministry of Restoring Life"
 IVN_rc_social_ministry_desc:0 "The new ministry answers not for factories but for people: for housing, hospitals, pensions and schools. Its first officials go to the frontier rather than to offices in the capital."
 IVN_rc_universal_pensions:0 "Universal Pensions"
 IVN_rc_universal_pensions_desc:0 "Every old person of the marches receives a pension, whether they fought or not. It is expensive, but for the first time the state comes to every home with money rather than a call-up notice."
 IVN_rc_veterans_first:0 "Veterans First"
 IVN_rc_veterans_first_desc:0 "The council's money goes first to those who fought for the marches, whichever side they stood on. Veterans return to the regiments knowing that their families will be cared for."
 IVN_rc_district_hospitals:0 "District Hospitals"
 IVN_rc_district_hospitals_desc:0 "Every district of the marches gets a hospital with a surgeon and a maternity ward. In Serenga and Talara these are the first hospitals in twenty years."
 IVN_rc_public_schools:0 "Public Schools"
 IVN_rc_public_schools_desc:0 "School becomes compulsory for every child of the marches, and teachers are paid by the republic. In ten years Itora will have a generation that can read blueprints."
 IVN_rc_invalid_workshops:0 "Workshops of the War Disabled"
 IVN_rc_invalid_workshops_desc:0 "Workshops open in Kantoria where those maimed in the wars of the marches work. They sew, mend and assemble, and the town stops hiding its veterans."
 IVN_rc_trust_kantoria_10_tt:0 "Trust of [97.GetName]: §G+10§!"
 IVN_rc_veterans_colonies:0 "Veterans' Settlements"
 IVN_rc_veterans_colonies_desc:0 "Veterans receive land in the Old March Forest and a loan for a house. The settlements of former soldiers become a reserve that always knows where to go when the alarm sounds."
 IVN_rc_social_contract:0 "Social Contract of the Marches"
 IVN_rc_social_contract_desc:0 "The council publishes a simple contract: the republic undertakes to heal, teach and feed, the marches to work and serve. It is read aloud in the square of every town."
 IVN_rc_refugee_return:0 "Return of the Refugees"
 IVN_rc_refugee_return_desc:0 "Families who fled Serenga and Vedrina during the troubles receive passage home and a reconstruction loan. The empty streets of the northern marches fill again."
 IVN_rc_trust_vedrina_serenga_10_tt:0 "Trust of [92.GetName] and [95.GetName]: §G+10§!"
 IVN_rc_labour_code:0 "Labour Code"
 IVN_rc_labour_code_desc:0 "The eight-hour day, injury insurance and the right to a union become law. The factories lose cheap hands but gain workers who stay."
 IVN_rc_march_councils:0 "Councils of the Marches"
 IVN_rc_march_councils_desc:0 "Elected councils of the marches distribute the social funds instead of officials from the capital. The frontier gains power over its own life, and the capital fewer levers."
 IVN_rc_capital_governors:0 "Governors from the Capital"
 IVN_rc_capital_governors_desc:0 "Each march receives a governor from the capital with authority over the social funds. The money arrives faster, but the frontier feels watched again."
 IVN_rc_trust_all_minus_5_tt:0 "Trust of every frontier march: §R-5§!"
 IVN_rc_welfare_republic:0 "Republic of Care"
 IVN_rc_welfare_republic_desc:0 "Itora emerges from reconstruction as a country where a soldier has a home, a widow a pension and a child a school. The marches are ready to stand for such a republic if the West comes again."
 IVN_rc_army_reform:0 "Reform of the Army of the Marches"
 IVN_rc_army_reform_desc:0 "An army that went through the northern march and the troubles knows more about its weaknesses than any staff. The reform commission gathers that experience before it is forgotten."
 IVN_rc_mass_reserve:0 "Mass Reserve Army"
 IVN_rc_mass_reserve_desc:0 "Every man of the marches serves and stays in the reserve until forty. Itora cannot buy the best army in the West, but it can field the most numerous one."
 IVN_rc_professional_army:0 "Professional Mobile Army"
 IVN_rc_professional_army_desc:0 "The army of the marches becomes smaller, but it serves on contract, rides lorries and trains for years. Such an army cannot hold the whole border, but it will reach the place where the war is decided."
 IVN_rc_territorial_regiments:0 "Territorial Regiments"
 IVN_rc_territorial_regiments_desc:0 "Reservists are assigned to the regiments of their own marches and know their own lines. If an enemy crosses the border, he will be met by men defending their own homes."
 IVN_rc_reserve_officer_school:0 "Reserve Officer School"
 IVN_rc_reserve_officer_school_desc:0 "Teachers, engineers and agronomists of the marches take reserve officer courses. A mass army needs commanders, and the republic trains them in advance."
 IVN_rc_motorised_brigades:0 "Motorised Brigades"
 IVN_rc_motorised_brigades_desc:0 "The first brigades of the army of the marches move onto lorries and receive anti-tank batteries. They learn to cover in a day what infantry covers in a week."
 IVN_rc_staff_war_games:0 "Staff War Games"
 IVN_rc_staff_war_games_desc:0 "Officers of the professional army play out the war for the West on maps dozens of times. Every lost game becomes a new paragraph of the field manual."
 IVN_rc_artillery_regiments:0 "Artillery Regiments"
 IVN_rc_artillery_regiments_desc:0 "The guns lying in the depots of the marches are formed into regiments with their own tractors and anti-air cover. Itoran infantry no longer attacks without fire behind it."
 IVN_rc_western_war_plan:0 "Plan for the War of the West"
 IVN_rc_western_war_plan_desc:0 "The staff draws up a plan in case of a great war with Vorkerland: axes, timings, lines. The republic hopes it will not be needed but keeps it in the safe."
 IVN_rc_border_fortresses:0 "Border Fortresses"
 IVN_rc_border_fortresses_desc:0 "Serenga and Vedrina, through which the wars from the north always came, receive pillboxes and fortified nodes. The corridor is no longer an open door into Itora."
 IVN_rc_army_of_the_republic:0 "Army of the Republic"
 IVN_rc_army_of_the_republic_desc:0 "The army of the marches is no longer a collection of garrisons and militias. The republic has a force with one manual, one set of weapons and one oath."
 IVN_rc_air_and_sea:0 "Sky and Shore"
 IVN_rc_air_and_sea_desc:0 "For the first time the council sets aside money for aviation and the fleet. It is not much, and the airmen and sailors immediately start arguing over who needs it more."
 IVN_rc_air_wing:0 "Air Wing of the Marches"
 IVN_rc_air_wing_desc:0 "The airmen get the money. The airfields at Lakora and Vedrina are expanded, and the republic's patrols appear over the frontier."
 IVN_rc_coastal_navy:0 "Coastal Fleet"
 IVN_rc_coastal_navy_desc:0 "The sailors get the money. The Old March harbour is deepened, and the republic's merchant ships gain the right to warship escort."
 IVN_rc_flight_schools:0 "Flight Schools"
 IVN_rc_flight_schools_desc:0 "The flying clubs of the marches become flight schools with veteran instructors. Young pilots learn on machines assembled right there in the airfield workshops."
 IVN_rc_seaboard_shipyard:0 "Seaboard Shipyard"
 IVN_rc_seaboard_shipyard_desc:0 "A shipyard for patrol vessels is laid down on the Southern Seaboard. Its first slipways are built by the same workers who recently repaired fishing schooners."
 IVN_rc_coastal_defence_zone:0 "Coastal Defence Zone"
 IVN_rc_coastal_defence_zone_desc:0 "Coastal batteries and anti-aircraft posts cover the seaboard and the capital. Itora will no longer be caught unawares from the sea or the sky."
 IVN_rc_joint_staff:0 "Joint Staff"
 IVN_rc_joint_staff_desc:0 "The airmen, sailors and infantry of the marches sit at one table for the first time. From now on coastal operations are planned together, not each in its own department."
 IVN_reconstruction_category:0 "Reconstruction of the Republic"
 IVN_reconstruction_category_desc:0 "The Reconstruction Council divides money and people between the building sites, laboratories and regiments of the marches. Every programme takes time, and the council chooses where to begin."
 IVN_rc_mine_survey:0 "Mine Survey"
 IVN_rc_mine_survey_desc:0 "The council's geologists travel to the march with drills and maps of the old workings. If the seam is confirmed, the mine will open before winter."
 IVN_rc_mine_survey_ready_tt:0 "No mine has been opened in this march and no survey is under way"
 IVN_rc_fen_drainage:0 "Draining the Rinval Fens"
 IVN_rc_fen_drainage_desc:0 "Canals and pumping stations are to turn the fens into fields and building ground. The work will take more than one season, and the drained land will become home to new settlements."
 IVN_rc_laboratory_contracts:0 "Laboratory Contracts"
 IVN_rc_laboratory_contracts_desc:0 "The Academy of the Marches receives an order for a specific problem and the money to solve it. The scholars work to a deadline, and the factories wait for finished blueprints."
 IVN_rc_laboratory_contracts_limit_tt:0 "Contracts concluded: §Y[?IVN_rc_laboratory_contracts_done|0]§! of §Y3§!"
 IVN_rc_housing_programme:0 "Housing Programme"
 IVN_rc_housing_programme_desc:0 "Building crews arrive in the march with brick, timber and plans for standard houses. Families who lived in dugouts and barracks get a roof over their heads."
 IVN_rc_housing_ready_tt:0 "The march has not yet received a housing programme"
 IVN_rc_reserve_musters:0 "Reserve Musters"
 IVN_rc_reserve_musters_desc:0 "The reservists of the marches leave their fields and workshops and return to barracks for two months. Old soldiers remember their service, and the young learn from them."
 IVN_rc_field_manoeuvres:0 "Field Manoeuvres"
 IVN_rc_field_manoeuvres_desc:0 "The brigades of the professional army hold great manoeuvres near the border. Staff umpires note every mistake so that it is not repeated in a real war."
 IVN_rc_reserve_drilled:0 "Drilled Reserve"
 IVN_rc_reserve_drilled_desc:0 "The reservists have recently been mustered and remember their companies, their lines and their alarm signals."
 IVN_rc_manoeuvre_lessons:0 "Lessons of the Manoeuvres"
 IVN_rc_manoeuvre_lessons_desc:0 "The reviews of the last manoeuvres still lie on the staff's tables, and brigade commanders know where they went wrong."
 IVN_sh_league_secretariat:0 "The League Secretariat"
 IVN_sh_league_secretariat_desc:0 "A permanent secretariat of the League of free republics opens in the Old March. Its clerks write to Rimat, Norvane and the corridor more often than the foreign ministry does."
 IVN_sh_rimat_compact:0 "The Rimat Compact"
 IVN_sh_rimat_compact_desc:0 "Itora guaranteed Rimat's freedom back in the years of the collapse. Now the guarantee gains a road through Talara and depots of arms for the city militia."
 IVN_sh_rimat_compact_tt:0 "The leaning of [WIT.GetName] shifts towards Itora by §Y10§!."
 IVN_sh_charter_of_free_republics:0 "Charter of the Free Republics"
 IVN_sh_charter_of_free_republics_desc:0 "The deputies draft a charter that any republic of the West can sign. The right to elections, to courts and to one's own militia comes in it before the right to an alliance."
 IVN_sh_civil_defence_council:0 "Civil Defence Council"
 IVN_sh_civil_defence_council_desc:0 "Town by town the marches elect civil defence councils. Teachers and postmen learn to fight fires and to shoot at aircraft Itora has not yet seen."
 IVN_sh_open_league:0 "An Open League"
 IVN_sh_open_league_desc:0 "The League's doors are open to all who sign the charter, even to yesterday's rivals. Itora is ready to argue with its neighbours in session rather than on the border."
 IVN_sh_open_league_tt:0 "The leaning of every western state shifts towards Itora by §Y5§!."
 IVN_sh_armed_covenant:0 "The Armed Covenant"
 IVN_sh_armed_covenant_desc:0 "The League is not a club but an oath. Those already standing beside Itora receive weapons and common defence plans before any new signatures on the charter."
 IVN_sh_northern_friends:0 "Friends in the North"
 IVN_sh_northern_friends_desc:0 "The northern republics remember who stood at Krait in the years of the collapse. The League sends them field telephones, ambulances and people who know how to use them."
 IVN_sh_northern_friends_tt:0 "The leaning of [IBA.GetName] and [IBL.GetName] shifts towards Itora by §Y10§!."
 IVN_sh_corridor_mediation:0 "Mediation in the Corridor"
 IVN_sh_corridor_mediation_desc:0 "The League offers the corridor districts what Vorkerland will not: a court where their quarrels with a neighbour are heard without soldiers. Meanwhile Itora mends the roads its judges will travel."
 IVN_sh_push_corridor_10_tt:0 "The leaning of [PWR.GetName], [PSD.GetName] and [ZAO.GetName] shifts towards Itora by §Y10§!."
 IVN_sh_officer_exchange:0 "Officer Exchange"
 IVN_sh_officer_exchange_desc:0 "Itoran officers serve in the allies' staffs and the allies' officers in the staffs of the marches. Within a year the covenant has common regulations and common maps."
 IVN_sh_reserve_of_the_republic:0 "Reserve of the Republic"
 IVN_sh_reserve_of_the_republic_desc:0 "Every citizen of the marches spends a month in training and takes a rifle home. A republic that does not want war must be able to raise an army within a week."
 IVN_sh_league_congress:0 "The League Congress"
 IVN_sh_league_congress_desc:0 "Delegates of the free republics gather in one hall for the first time. They argue for three weeks and part with a common word on Vorkerland that every newspaper in the West can print."
 IVN_sh_free_press_of_the_west:0 "Free Press of the West"
 IVN_sh_free_press_of_the_west_desc:0 "The League's printing houses publish newspapers in every dialect of the West. They carry no orders, only news, and that is why they are believed."
 IVN_sh_free_press_of_the_west_tt:0 "The leaning of [WPA.GetName] and [WPS.GetName] shifts towards Itora by §Y10§!."
 IVN_sh_defence_in_depth:0 "Defence in Depth"
 IVN_sh_defence_in_depth_desc:0 "Behind the frontier line rises a second one, at Kantoria and Lakora. If Vorkerland breaks through, it will be met where the marches have time to gather."
 IVN_sh_mobile_reserve:0 "Mobile Reserve"
 IVN_sh_mobile_reserve_desc:0 "The best battalions of the marches move onto lorries. Their place is not in the trenches but on the roads leading to any stretch of the border."
 IVN_sh_league_railway:0 "The League Railway"
 IVN_sh_league_railway_desc:0 "A new line links Moressa and Kantoria with the northern railway. Reservists will reach the front on it within a day, and bread will reach the allies within two."
 IVN_sh_shield_of_free_republics:0 "Shield of the Free Republics"
 IVN_sh_shield_of_free_republics_desc:0 "Itora no longer asks its neighbours for trust - it has earned it. If Vorkerland comes to the West, it will meet not one republic but their common will."
 IVN_sh_league_at_war:0 "The League at War"
 IVN_sh_league_at_war_desc:0 "The League secretariat becomes its war council. Volunteers from Rimat and the northern republics enlist in the regiments of the marches right at the stations."
 IVN_sh_west_war_tt:0 "The war for the West is under way and Itora is fighting Vorkerland"
 IVN_sh_league_field_hospitals:0 "League Field Hospitals"
 IVN_sh_league_field_hospitals_desc:0 "Doctors of the free republics set up hospitals behind the marches. A wounded soldier returns to the ranks rather than to the casualty lists."
 IVN_sh_hold_the_line:0 "Hold the Line"
 IVN_sh_hold_the_line_desc:0 "The League will not attack first. The marches dig in at Serenga and wait for Vorkerland to break its regiments against them."
 IVN_sh_relief_of_the_corridor:0 "Relief of the Corridor"
 IVN_sh_relief_of_the_corridor_desc:0 "The corridor districts wait to see whether the League will come to their aid. The mobile reserve of the marches crosses the border to answer them before Vorkerland does."
 IVN_sh_volunteers_of_free_republics:0 "Volunteers of the Free Republics"
 IVN_sh_volunteers_of_free_republics_desc:0 "From all over the West come people who do not want to live under Vorkerland's tutelage. They bring their workshops, their guns and their stubbornness."
 IVN_sh_confederation_of_the_west:0 "Confederation of the West"
 IVN_sh_confederation_of_the_west_desc:0 "The war is over and the League becomes a confederation. Its members keep their councils and laws, and Itora answers for none of them ever fighting a neighbour again."
 IVN_sh_west_won_tt:0 "Itora has won the war for the West"
 IVN_em_cabinet_of_national_defence:0 "Cabinet of National Defence"
 IVN_em_cabinet_of_national_defence_desc:0 "The emergency cabinet sits every day, and its decisions take effect the same evening. Ministers answer not to deputies but to deadlines."
 IVN_em_state_arsenals:0 "State Arsenals"
 IVN_em_state_arsenals_desc:0 "A state arsenal is built in the Southern March. The cabinet does not wait for private works to agree a price - it pays itself and sets the quota itself."
 IVN_em_decrees_of_the_cabinet:0 "Decrees of the Cabinet"
 IVN_em_decrees_of_the_cabinet_desc:0 "The cabinet's decrees are printed on the front pages and parliament's laws on the back. The country quickly gets used to who decides here."
 IVN_em_border_commissariat:0 "Border Commissariat"
 IVN_em_border_commissariat_desc:0 "The cabinet creates a commissariat for corridor affairs. Its envoys come to the neighbours not with requests but with lists of what Itora considers its interests."
 IVN_em_war_tribunals:0 "War Tribunals"
 IVN_em_war_tribunals_desc:0 "Profiteers, deserters and loose talkers are tried in a day. Order comes quickly, and the frontier remembers who was taken away first."
 IVN_em_trust_all_minus_5_tt:0 "Trust of every frontier march: §R-5§!"
 IVN_em_council_of_industrialists:0 "Council of Industrialists"
 IVN_em_council_of_industrialists_desc:0 "Factory owners receive seats on a council attached to the cabinet. They fill the war orders without argument, but in return their goods reach the shops before the soldiers' rations."
 IVN_em_rail_requisition:0 "Railway Requisition"
 IVN_em_rail_requisition_desc:0 "The railways pass under the cabinet's control. Passenger trains run less often, but troop trains reach Vedrina on schedule."
 IVN_em_labour_conscription:0 "Labour Conscription"
 IVN_em_labour_conscription_desc:0 "Every adult of the marches owes a month on the defence works. Roads and depots rise quickly, and in Moressa and Lakora the grumbling grows louder."
 IVN_em_trust_inner_minus_5_tt:0 "Trust of the inner marches [98.GetName], [99.GetName], [100.GetName] and [101.GetName]: §R-5§!"
 IVN_em_war_contracts:0 "War Contracts"
 IVN_em_war_contracts_desc:0 "The council of industrialists signs contracts a year ahead. The depots of the marches fill up before the treasury can count the debt."
 IVN_em_trusteeship_plans:0 "Trusteeship Plans"
 IVN_em_trusteeship_plans_desc:0 "The commissariat is already drawing up lists of officials for Vorkerland's western district. The local chiefs hear of it and wonder whom they will serve tomorrow."
 IVN_em_trusteeship_plans_tt:0 "The leaning of [ZAO.GetName] shifts towards Itora by §Y15§!."
 IVN_em_war_economy_law:0 "War Economy Law"
 IVN_em_war_economy_law_desc:0 "The cabinet declares the economy of the marches a war economy. Every factory receives a plan, every plan a deadline and every deadline a person answerable for it."
 IVN_em_northern_depots:0 "Northern Depots"
 IVN_em_northern_depots_desc:0 "Depots and a field airfield rise near Talara. An army bound for the corridor will find everything there except time to prepare."
 IVN_em_shock_army:0 "The Shock Army"
 IVN_em_shock_army_desc:0 "The cabinet stakes everything on the few: the best regiments receive the best officers and the right to strike first. The rest of the army will hold what they take."
 IVN_em_total_mobilisation:0 "Total Mobilisation"
 IVN_em_total_mobilisation_desc:0 "Call-up papers go to everyone who can hold a rifle. Itora will not be better than Vorkerland - it will be bigger."
 IVN_em_occupation_administration:0 "Occupation Administration"
 IVN_em_occupation_administration_desc:0 "The commissariat teaches officers to govern occupied towns: to feed, to count and to punish. The tutelage of the West will begin on the first day of the war."
 IVN_em_state_of_emergency:0 "The Emergency State"
 IVN_em_state_of_emergency_desc:0 "The state of emergency is no longer a temporary measure. This is Itora now: a country that lives as if the war will begin tomorrow morning."
 IVN_em_war_cabinet_in_session:0 "The Cabinet at Headquarters"
 IVN_em_war_cabinet_in_session_desc:0 "The cabinet moves into the staff headquarters. Ministers sleep in railway carriages, and supply decisions are made at the front map."
 IVN_em_armoured_train_columns:0 "Armoured Train Columns"
 IVN_em_armoured_train_columns_desc:0 "The requisitioned railways gain their masters: the cabinet's armoured trains head for the corridor border ahead of the infantry."
 IVN_em_storm_the_corridor:0 "Storm the Corridor"
 IVN_em_storm_the_corridor_desc:0 "The cabinet demands results by its next session. The regiments of the marches march into the corridor without waiting for the rear to catch up."
 IVN_em_front_requisitions:0 "Front Requisitions"
 IVN_em_front_requisitions_desc:0 "Commissars take everything in the frontline marches that can shoot or haul. The army is armed, and the villages will remember this winter."
 IVN_em_military_governors:0 "Military Governors"
 IVN_em_military_governors_desc:0 "The cabinet appoints a governor in uniform to every occupied town. Local men go either to the labour gangs or to the Itoran auxiliary companies."
 IVN_em_emergency_trusteeship:0 "Emergency Trusteeship"
 IVN_em_emergency_trusteeship_desc:0 "The defeated West passes under the cabinet's tutelage. Its factories work for Itora, its roads are mended by Itoran sappers, and its elections are postponed until better times."
 IVN_rv_legion_government:0 "The Legion Government"
 IVN_rv_legion_government_desc:0 "The legion has won and now it governs. Officers from Vedrina sit in the ministries, and every morning they ask not about the budget but about when the army will march north."
 IVN_rv_council_staff_regulations:0 "The Council's Regulations"
 IVN_rv_council_staff_regulations_desc:0 "The legion council writes new regulations for the whole Itoran army. They have no room for rallies or speeches - only for orders, plans and the commander's responsibility."
 IVN_rv_council_rules_tt:0 "Itora is governed by the §Ylegion council§!"
 IVN_rv_book_of_grievances:0 "The Book of Grievances"
 IVN_rv_book_of_grievances_desc:0 "The legion publishes a book about everything the marches lost because of Vorkerland: burned villages, abandoned garrisons and the failed expedition. It is read aloud in every barracks."
 IVN_rv_union_mass_rallies:0 "Mass Rallies"
 IVN_rv_union_mass_rallies_desc:0 "The Patriotic Union brings whole towns into the squares. Speakers talk about the north as if the border had already moved, and the crowd believes them."
 IVN_rv_union_rules_tt:0 "The §YPatriotic Union§! rules Itora"
 IVN_rv_council_military_districts:0 "Military Districts"
 IVN_rv_council_military_districts_desc:0 "The marches are divided into military districts, each ruled not by a governor but by a commander. Roads to the border are built on the staff's orders, not on residents' petitions."
 IVN_rv_coerce_the_corridor:0 "Coerce the Corridor"
 IVN_rv_coerce_the_corridor_desc:0 "The legion does not persuade its neighbours; it puts a choice before them. The corridor delegations leave the Old March pale and pliant."
 IVN_rv_coerce_the_corridor_tt:0 "The leaning of [PWR.GetName], [PSD.GetName] and [ZAO.GetName] shifts towards Itora by §Y15§!."
 IVN_rv_arm_the_frontier:0 "Arm the Frontier"
 IVN_rv_arm_the_frontier_desc:0 "Vedrina, the cradle of the legion, receives its own arms works. The town that raised the revolt now forges the weapons of revenge."
 IVN_rv_union_militia_of_the_marches:0 "The Union's Militia"
 IVN_rv_union_militia_of_the_marches_desc:0 "The Union forms its own militia in every march. Its training is hasty, but its members come to muster by whole streets."
 IVN_rv_council_karns_general_staff:0 "Karn's General Staff"
 IVN_rv_council_karns_general_staff_desc:0 "General Karn assembles a general staff from those who fought with him against the cabinet. They have taken the Old March once and know how to take cities."
 IVN_rv_corridor_fifth_column:0 "The Fifth Column"
 IVN_rv_corridor_fifth_column_desc:0 "Men who speak the dialect of the marches and know where the foreign depots stand appear in the corridor towns. When the legion comes, guides will meet it."
 IVN_rv_vedrina_gun_works:0 "Vedrina Gun Works"
 IVN_rv_vedrina_gun_works_desc:0 "The Vedrina works begin casting gun barrels. The first guns go not to the depot but straight to the training range by the border."
 IVN_rv_union_patriotic_labour:0 "Patriotic Labour"
 IVN_rv_union_patriotic_labour_desc:0 "The Union brings people out not only to rallies but to building sites. Lakora receives a new factory built on Sundays by volunteers' hands."
 IVN_rv_army_of_revenge:0 "The Army of Revenge"
 IVN_rv_army_of_revenge_desc:0 "The cabinet's regiments and the legion's regiments merge into one army. It has one oath, one grievance and one goal beyond the northern border."
 IVN_rv_storm_battalions:0 "Storm Battalions"
 IVN_rv_storm_battalions_desc:0 "Veterans of the revolt become the core of storm battalions. They receive lorries and the right to choose their own officers."
 IVN_rv_forward_bases:0 "Forward Bases"
 IVN_rv_forward_bases_desc:0 "An airfield is built near Serenga and anti-air batteries near Vedrina. The legion prepares the border not for defence but for a leap."
 IVN_rv_legion_of_the_west:0 "Legion of the West"
 IVN_rv_legion_of_the_west_desc:0 "The Itoran Liberation Legion is no longer the army of one province. It calls itself the legion of the whole West and promises to return the marches to where they stood before the collapse."
 IVN_rv_the_march_begins:0 "The March Begins"
 IVN_rv_the_march_begins_desc:0 "The legion marches north again, but now all of Itora is behind it. The stations play marches that half a year ago were heard only in Vedrina."
 IVN_rv_council_operational_plan:0 "Karn's Operational Plan"
 IVN_rv_council_operational_plan_desc:0 "Karn's general staff plans the offensive day by day. Every division knows where it will be in a week, and nearly always gets there."
 IVN_rv_lightning_march:0 "Lightning March"
 IVN_rv_lightning_march_desc:0 "The legion's columns march without halts, leaving stragglers behind. Whoever enters the corridor towns first will be their master."
 IVN_rv_methodical_advance:0 "Methodical Advance"
 IVN_rv_methodical_advance_desc:0 "The legion is in no hurry. First the Vedrina guns speak, then the infantry goes in, and no hill once taken is given back."
 IVN_rv_union_levee_en_masse:0 "Levee en Masse"
 IVN_rv_union_levee_en_masse_desc:0 "The Union declares that every patriot must join the ranks. Militias leave for the front by whole towns, leaving the marches without working hands."
 IVN_rv_total_war_of_the_marches:0 "Total War of the Marches"
 IVN_rv_total_war_of_the_marches_desc:0 "Revenge tolerates no half-measures. Itora fights with everything it has and does not intend to stop at the corridor's borders."
 IVN_rv_annexation_of_the_west:0 "Annexation of the West"
 IVN_rv_annexation_of_the_west_desc:0 "The defeated do not become allies or wards - they become marches. The legion installs its commandants from the Old March to Vorkerland's former capital."
 IVN_shield_course_category:0 "The Humanist Shield"
 IVN_shield_course_category_desc:0 "The League of free republics gathers the West around Itora with words, bread and a common defence."
 IVN_emergency_course_category:0 "The Emergency Order"
 IVN_emergency_course_category_desc:0 "The emergency cabinet prepares the marches for the war for the West without asking what it will cost."
 IVN_revanche_course_category:0 "Revanche of the Marches"
 IVN_revanche_course_category_desc:0 "The legion government turns the grievances of the marches into an army, factories and a plan for the march north."
 IVN_sh_league_assembly:0 "League Assembly"
 IVN_sh_league_assembly_desc:0 "Delegates of the free republics gather in the Old March. While the sessions last, all of Itora listens to their speeches on the radio."
 IVN_sh_league_assembly_tt:0 "The leaning of every western state shifts towards Itora by §Y8§!."
 IVN_sh_west_unresolved_tt:0 "The war for the West has not yet ended"
 IVN_sh_volunteer_brigades:0 "Volunteer Brigades"
 IVN_sh_volunteer_brigades_desc:0 "The civil defence councils gather volunteers from every march. They train on Sundays, in schools and in factory yards."
 IVN_em_requisition_drive:0 "Requisition Drive"
 IVN_em_requisition_drive_desc:0 "The cabinet's commissioners tour warehouses, workshops and shops. Whatever the army can use leaves for the military depots."
 IVN_em_border_exercises:0 "Border Exercises"
 IVN_em_border_exercises_desc:0 "The regiments of the marches hold exercises right at the corridor border. The neighbours see their fires at night and draw conclusions."
 IVN_em_west_before_war_tt:0 "The war for the West has not yet begun"
 IVN_rv_arsenal_shift:0 "The Arsenals' Second Shift"
 IVN_rv_arsenal_shift_desc:0 "The arsenals of the marches work day and night. Workers sleep at their machines and the shops empty, because all the iron goes to the war."
 IVN_rv_staff_war_games:0 "The Council's Staff Games"
 IVN_rv_staff_war_games_desc:0 "Karn's general staff plays out the march north on maps and models. Every mistake on the table is a regiment saved in the field."
 IVN_rv_union_rallies:0 "§YPROPAGANDA:§! Union Rallies"
 IVN_rv_union_rallies_desc:0 "The Patriotic Union holds rallies in every march. Speakers promise revenge, and volunteers are signed up beside the platforms."
 IVN_sh_spirit_shield_of_free_republics:0 "Shield of the Free Republics"
 IVN_sh_spirit_shield_of_free_republics_desc:0 "Itora stands for the freedom of the West not by force but by its neighbours' trust, and that trust makes it stronger."
 IVN_em_spirit_state_of_emergency:0 "The Emergency State"
 IVN_em_spirit_state_of_emergency_desc:0 "The cabinet rules by decree, the factories work to war plans, and the country lives as if the war will begin tomorrow."
 IVN_rv_spirit_legion_of_the_west:0 "Legion of the West"
 IVN_rv_spirit_legion_of_the_west_desc:0 "The legion calls itself the army of the whole West and promises to return the marches to where they stood before the collapse."
 IVN_sh_unbroken_line:0 "The Unbroken Line"
 IVN_sh_unbroken_line_desc:0 "The marches have dug in and await the blow. Every trench knows who stands to its right and left."
 IVN_sh_liberation_offensive:0 "Relief of the Corridor"
 IVN_sh_liberation_offensive_desc:0 "The League's mobile reserve enters the corridor, and the locals show it the roads."
 IVN_em_storm_of_the_corridor:0 "Storm of the Corridor"
 IVN_em_storm_of_the_corridor_desc:0 "The cabinet demands quick results, and the army throws everything it has into battle."
 IVN_rv_karns_operational_plan:0 "Karn's Operational Plan"
 IVN_rv_karns_operational_plan_desc:0 "The offensive is planned day by day, and the legion's divisions advance exactly to schedule."
 IVN_rv_lightning_march_spirit:0 "Lightning March"
 IVN_rv_lightning_march_spirit_desc:0 "The legion's columns march without halts, and the rear barely keeps up."
 IVN_rv_methodical_advance_spirit:0 "Methodical Advance"
 IVN_rv_methodical_advance_spirit_desc:0 "First the guns speak, then the infantry goes in, and no line once taken is given up."
 IVC_legion_general_staff:0 "General Staff of the Legion"
 IVC_legion_general_staff_desc:0 "The staff of the northern corps moves into the Vedrina gymnasium. Maps of the marches lie on the desks, and the blackboard lists in chalk the regiments the legion does not have yet."
 IVC_assault_groups:0 "Assault Groups"
 IVC_assault_groups_desc:0 "Companies are split into groups of twenty: sappers, machine gunners, grenadiers. Each group takes one house, one trench, one crossing."
 IVC_legion_batteries:0 "Batteries of the Legion"
 IVC_legion_batteries_desc:0 "The guns the northern corps dragged back from the corridor are formed into batteries. Gunlayers learn to fire by the maps of the marches, not by foreign grid squares."
 IVC_fire_and_assault:0 "Fire and Assault"
 IVC_fire_and_assault_desc:0 "The assault groups attack behind the barrage rather than after it. Gunners and infantrymen sit at the same briefing for the first time."
 IVC_hill_war_of_vedrina:0 "War in the Hills of Vedrina"
 IVC_hill_war_of_vedrina_desc:0 "The hills around Vedrina are cut by ravines and old workings. The regiments of the marches know every path here; the cabinet's troops know them only from maps."
 IVC_mountain_rifles:0 "Mountain Rifles"
 IVC_mountain_rifles_desc:0 "Hunters, foresters and miners of Vedrina become the legion's riflemen. They receive light rifles and ropes; the rest they will teach themselves."
 IVC_ridge_flak_posts:0 "Flak Posts on the Ridges"
 IVC_ridge_flak_posts_desc:0 "The aircraft stayed with the cabinet, but the ridges stayed with the legion. Every height gets a flak post and a telephone line to the staff."
 IVC_anti_tank_companies:0 "Anti-Tank Companies"
 IVC_anti_tank_companies_desc:0 "The cabinet clads its trains with steel and brings armoured cars out of the depots. The legion needs men who will not run when iron rolls towards their trench."
 IVC_motorised_columns:0 "Motorised Columns"
 IVC_motorised_columns_desc:0 "The timber lorries, buses and mail vans of the marches receive legion numbers. The infantry rides to the front instead of walking to it for a week."
 IVC_armoured_train_hunters:0 "Armoured Train Hunters"
 IVC_armoured_train_hunters_desc:0 "The cabinet's armoured trains are strong while there are rails beneath them. The legion's mobile groups learn to blow the track and strike locomotives from ambush."
 IVC_legion_campaign_plan:0 "The Campaign Plan"
 IVC_legion_campaign_plan_desc:0 "Two schools argue at the staff. One would hold the marches and bleed the cabinet white; the other would march on the capital before the cabinet runs out of doubts."
 IVC_war_on_the_frontier:0 "War on the Frontier"
 IVC_war_on_the_frontier_desc:0 "The legion will not march on the capital through minefields. Let the cabinet come into the marches and pay for every hill until its soldiers ask what they are fighting for."
 IVC_decisive_march:0 "The Decisive March"
 IVC_decisive_march_desc:0 "Every month of war works for the cabinet: it has the depots, the ports and the islands. Stalk decides to strike now, before the capital gets used to the idea that it can be defended."
 IVC_hold_every_ridge:0 "Hold Every Ridge"
 IVC_hold_every_ridge_desc:0 "The legion's defence is built not as a line but as a net: trenches on the slopes, machine guns in the ravines, reserves behind every height."
 IVC_counterattacks_from_the_hills:0 "Counterattacks from the Hills"
 IVC_counterattacks_from_the_hills_desc:0 "When the cabinet's offensive runs out of breath at the foot of the hills, the legion's reserves come down. Prisoners are sent to Vedrina to dig new trenches."
 IVC_columns_to_the_south:0 "Columns to the South"
 IVC_columns_to_the_south_desc:0 "The legion's columns march by night, without halts or baggage trains. Lorries pick up the stragglers; the wounded are left in villages that have already raised the flag of the marches."
 IVC_break_the_lakora_line:0 "Break the Lakora Line"
 IVC_break_the_lakora_line_desc:0 "The trenches between Moressa and Lakora are the last thing standing between the legion and the southern marches. The staff draws every gun it can find towards them."
 IVC_army_of_the_marches:0 "Army of the Marches"
 IVC_army_of_the_marches_desc:0 "The rebel regiments have become an army, with their own regulations, hospitals and heroes. In the marches it is no longer called the legion, simply the army."
 IVC_general_offensive_plan:0 "Plan of the General Offensive"
 IVC_general_offensive_plan_desc:0 "Stalk gathers the regimental commanders one last time before the great blow. Three men know the date; the rest will learn it from a signal flare."
 IVC_artillery_preparation:0 "Artillery Preparation"
 IVC_artillery_preparation_desc:0 "Shells hoarded since the start of the revolt are carried to the front. The barrage will be short, but the cabinet's trenches will remember it to the end of the war."
 IVC_offensive_supply_dumps:0 "Offensive Supply Dumps"
 IVC_offensive_supply_dumps_desc:0 "Behind the front, stacks of crates grow by night: cartridges, bandages, biscuits, petrol. The quartermasters count them in days rather than tons."
 IVC_last_reserves:0 "The Last Reserves"
 IVC_last_reserves_desc:0 "The convalescent are discharged from the hospitals, every second man is taken from the rear garrisons. The marches give the legion the last men they can give."
 IVC_the_last_push:0 "The Last Push"
 IVC_the_last_push_desc:0 "The flare rises over Vedrina at four in the morning. The whole legion climbs out of its trenches at once; it will not have a second morning like this."
 IVC_hunt_for_the_cabinet:0 "Hunt for the Cabinet"
 IVC_hunt_for_the_cabinet_desc:0 "Ministers burn their papers and look for berths on the steamers to the islands. The legion's patrols close the roads to the coast before the cabinet can decide whether to flee."
 IVC_council_military_governors:0 "Military Governors"
 IVC_council_military_governors_desc:0 "The council appoints a governor in uniform to every legion march. The burgomasters stay in office, but the seal is now kept at the commandant's office."
 IVC_trust_legion_held_minus_10_tt:0 "Trust of the legion's marches in the capital: §R-10§!"
 IVC_amnesty_needs_trust_tt:0 "The cabinet can offer an amnesty to a legion march only while its trust in the capital is at least §Y60§!."
 IVC_council_staff_academy:0 "Staff Academy"
 IVC_council_staff_academy_desc:0 "The council opens courses for junior officers in Vedrina. The lectures are read by colonels who commanded the corps in the corridor only last spring."
 IVC_council_war_production_board:0 "War Production Board"
 IVC_council_war_production_board_desc:0 "The factories of the marches receive not requests but orders signed by the council. A director who fails an order answers to a field court."
 IVC_council_letters_to_old_comrades:0 "Letters to Old Comrades"
 IVC_council_letters_to_old_comrades_desc:0 "The council's officers write to former classmates serving the cabinet. They do not call for treason; they ask whom those men will obey after the war."
 IVC_council_military_railway:0 "Military Railway"
 IVC_council_military_railway_desc:0 "The railwaymen of the marches come under the staff. Timetables are drawn from front reports, and passenger trains run when there is room left."
 IVC_council_cross_of_the_marches:0 "Cross of the Marches"
 IVC_council_cross_of_the_marches_desc:0 "The council institutes its own decoration: an iron cross on a ribbon in the colours of the frontier. It is presented on the parade ground before the whole regiment, and only for battle."
 IVC_council_professional_cadres:0 "Professional Cadres"
 IVC_council_professional_cadres_desc:0 "The council does not want a crowd with rifles. The legion takes those who pass selection; the rest are sent to dig trenches and mend roads."
 IVC_council_strategic_reserve:0 "Strategic Reserve"
 IVC_council_strategic_reserve_desc:0 "The council keeps several regiments behind Vedrina that not even the division commanders know about. They will go into battle only on Stalk's order."
 IVC_council_rule_of_the_staff:0 "Rule of the Staff"
 IVC_council_rule_of_the_staff_desc:0 "The council of the legion no longer deliberates; it issues orders. The marches are run like a single division, and that division has one staff."
 IVC_council_terms_for_the_capital:0 "Terms for the Capital"
 IVC_council_terms_for_the_capital_desc:0 "The council announces its terms: the cabinet's officers keep their ranks if they lay down their arms before the month is out. The terms do not cover the ministers."
 IVC_union_militia_of_the_marches:0 "Militia of the Marches"
 IVC_union_militia_of_the_marches_desc:0 "The union raises a militia street by street and shop by shop. Commanders are elected at meetings, and rifles are handed out straight from the wagons."
 IVC_union_cells_in_the_old_march:0 "Cells in the Old March"
 IVC_union_cells_in_the_old_march_desc:0 "The union still has thousands of members in the capital and the southern marches. Now they meet in flats and wait for a signal from Vedrina."
 IVC_union_workers_detachments:0 "Workers' Detachments"
 IVC_union_workers_detachments_desc:0 "The workshops of Talara pass to the union's workers' detachments. They work two shifts and guard the shops against the cabinet's saboteurs themselves."
 IVC_union_youth_battalions:0 "Youth Battalions"
 IVC_union_youth_battalions_desc:0 "Senior pupils leave for the legion a whole graduating class at a time. Teachers see them off at the station and do not know whether to be proud or to weep."
 IVC_union_lists_of_traitors:0 "Lists of Traitors"
 IVC_union_lists_of_traitors_desc:0 "The union posts on the squares the names of those waiting for the cabinet's return. Their houses pass to legionaries' families, and they themselves to the roads south."
 IVC_union_great_rally:0 "The Great Rally in Vedrina"
 IVC_union_great_rally_desc:0 "A hundred thousand people gather on Vedrina's main square. Stalk speaks briefly, but his words are repeated in every march for a week afterwards."
 IVC_union_marching_columns:0 "Marching Columns of the Union"
 IVC_union_marching_columns_desc:0 "The union's columns march to the front with songs and banners. The legion's commanders wince, but such companies do not retreat while they sing."
 IVC_union_agitators_to_the_south:0 "Agitators to the South"
 IVC_union_agitators_to_the_south_desc:0 "The union's speakers cross the front line with sacks of leaflets. In the southern marches they are caught, but two come in place of every one taken."
 IVC_trust_cabinet_held_minus_10_tt:0 "Trust of the cabinet's frontier marches in the capital: §R-10§!"
 IVC_union_peoples_legion:0 "The People's Legion"
 IVC_union_peoples_legion_desc:0 "The legion is no longer an army of officers. The union has turned it into a people in arms, and that people knows where to go."
 IVC_union_march_of_the_marches:0 "March of the Marches"
 IVC_union_march_of_the_marches_desc:0 "The union calls everyone who can walk to the capital. Behind the legion's regiments thousands of people with flags stream along the roads, and the cabinet sees them from the roofs of the Old March."
 IVC_legion_quartermaster_corps:0 "Quartermaster Corps"
 IVC_legion_quartermaster_corps_desc:0 "The northern corps' quartermasters register everything that rolls, shoots or feeds. The legion's rear begins with ledgers."
 IVC_requisition_committees:0 "Requisition Committees"
 IVC_requisition_committees_desc:0 "In every district the legion sets up a committee of three: an officer, a clerk and a local veteran. The committee decides how much grain and how many men the village gives the front."
 IVC_fair_purchase:0 "Fair Purchase"
 IVC_fair_purchase_desc:0 "Stalk forbids taking anything from the marches for nothing. Quartermasters pay with receipts valid at any commandant's office, and the marches count the legion as their own."
 IVC_confiscated_workshops:0 "Confiscated Workshops"
 IVC_confiscated_workshops_desc:0 "The workshops of owners who fled to the cabinet pass to the legion along with their machines and workers. The workers are paid in rations."
 IVC_labour_service:0 "Labour Service"
 IVC_labour_service_desc:0 "Men unfit for the ranks are turned out for works: trenches at Serenga, bridges, roads. Those who refuse are entered on the same lists as deserters."
 IVC_legion_receipts:0 "Receipts of the Legion"
 IVC_legion_receipts_desc:0 "The quartermasters' receipts circulate in the marches like money. Shopkeepers take them more willingly than the cabinet's notes: an army stands behind them, not a promise."
 IVC_workshop_contracts:0 "Workshop Contracts"
 IVC_workshop_contracts_desc:0 "The legion signs contracts with the workshops of Kantoria. The owners remain owners, but they work for the front and are paid in full for it."
 IVC_workshops_of_the_marches:0 "Workshops of the Marches"
 IVC_workshops_of_the_marches_desc:0 "The repair depots of Serenga and the artels of Vedrina become factories. For the first time the legion's marches make more for the war than they consume."
 IVC_field_hospitals:0 "Field Hospitals"
 IVC_field_hospitals_desc:0 "The monasteries and schools of the marches become hospitals. Wounded legionaries return to the ranks, and their mothers see that the legion does not abandon its own."
 IVC_answer_to_the_amnesty:0 "Answer to the Amnesty"
 IVC_answer_to_the_amnesty_desc:0 "The cabinet promises forgiveness to the marches that return to the capital. The legion replies with a list of villages burned by the cabinet's punitive detachments during the expedition."
 IVC_rear_of_the_legion_secured:0 "Rear of the Legion"
 IVC_rear_of_the_legion_secured_desc:0 "The legion now has a rear: depots, hospitals, workshops and people who know what it all is for. The revolt has become a state under martial law."
 IVC_agitators_across_the_front:0 "Agitators across the Front"
 IVC_agitators_across_the_front_desc:0 "The legion sends its people across the front: pedlars, postmen, sextons. They carry not weapons but news that the cabinet's papers do not print."
 IVC_leaflets_over_moressa:0 "Leaflets over Moressa"
 IVC_leaflets_over_moressa_desc:0 "The wind from the hills carries the legion's leaflets over Moressa and Lakora. They hold no appeals, only the names of soldiers from these marches who died in the corridor."
 IVC_trust_moressa_lakora_minus_10_tt:0 "Trust of [98.GetName] and [99.GetName] in the capital: §R-10§!"
 IVC_depot_saboteurs:0 "Depot Saboteurs"
 IVC_depot_saboteurs_desc:0 "Railwaymen who sympathise with the legion know where the cabinet keeps its cartridges. Depots burn at night, and the capital looks for culprits among its own."
 IVC_radio_vedrina:0 "Radio Vedrina"
 IVC_radio_vedrina_desc:0 "A transmitter in the Vedrina bell tower broadcasts to the whole republic every evening. The legion's bulletins are heard even in the capital's barracks, behind closed windows."
 IVC_strikes_in_the_old_march:0 "Strikes in the Old March"
 IVC_strikes_in_the_old_march_desc:0 "Workers at the capital's factories demand bread and an end to the war. The cabinet sends soldiers to the gates, and every such company is a gift to the legion's newspaper."
 IVC_capital_loses_the_marches:0 "The Capital Loses the Marches"
 IVC_capital_loses_the_marches_desc:0 "Kulivanov's portraits stop being hung in the cabinet's marches. Village elders answer the capital's orders with silence and wait to see who arrives first."
 IVC_deserters_welcome:0 "Deserters Welcome"
 IVC_deserters_welcome_desc:0 "The legion announces that every cabinet soldier who crosses the line with his rifle will get rations and a place in the regiment of his march. They cross by night, singly and by platoons."
 IVC_rumours_of_the_islands:0 "Rumours of the Islands"
 IVC_rumours_of_the_islands_desc:0 "A rumour creeps through the capital: the ministers already hold cabins on the steamers to the islands. The cabinet's denials only confirm it."
 IVC_couriers_to_the_corridor:0 "Couriers to the Corridor"
 IVC_couriers_to_the_corridor_desc:0 "The legion's couriers cross into the corridor over the passes of Serenga and Talara. The northern commanders do not love Itora, but they love Itoran gold."
 IVC_corridor_black_market:0 "Black Market of the Corridor"
 IVC_corridor_black_market_desc:0 "The markets of the corridor sell everything left over from the northern wars. The legion buys anti-tank rifles and field telephones wholesale."
 IVC_northern_instructors:0 "Northern Instructors"
 IVC_northern_instructors_desc:0 "A few officers the corps fought in the corridor come to Vedrina to train the legionaries. They are paid double and asked no questions."
 IVC_quiet_northern_border:0 "A Quiet Northern Border"
 IVC_quiet_northern_border_desc:0 "No one threatens the legion from the north any longer. The garrisons of the border posts load into trains and head south."
 IVC_northern_debt:0 "A Debt to the North"
 IVC_northern_debt_desc:0 "The north lends the legion arms against a promise of future grain and timber. Stalk signs without haggling: a victorious Itora will pay."
 IVC_legion_war_category:0 "The Legion's War"
 IVC_legion_war_category_desc:0 "The staff in Vedrina does not wage war by orders alone. Drills, contracts, caravans from the north and people beyond the front decide it as much as the regiments do."
 IVC_assault_group_drill:0 "Assault Group Drill"
 IVC_assault_group_drill_desc:0 "Battalions are withdrawn from the line to the training ground near Vedrina. For a month they storm mock trenches and houses until every man knows his place in the group."
 IVC_fortify_march:0 "Fortify a March"
 IVC_fortify_march_desc:0 "The legion's sappers and local work gangs dig trenches and build pillboxes on the approaches to the march. The work goes on day and night before the enemy comes closer."
 IVC_requisition_columns:0 "Requisition Columns"
 IVC_requisition_columns_desc:0 "The committees' columns tour the districts of the legion's marches. They take rifles from hunting lodges, lorries from the artels and men from the villages."
 IVC_fair_purchase_contracts:0 "Purchase Contracts"
 IVC_fair_purchase_contracts_desc:0 "The legion's quartermasters sign contracts with the workshops and depots of the marches and pay them in full. Deliveries come more slowly, but without complaints."
 IVC_propaganda_cabinet_marches:0 "§YPROPAGANDA:§! The Truth about the Cabinet"
 IVC_propaganda_cabinet_marches_desc:0 "The legion prints the lists of the dead from the corridor, the cabinet's orders to retreat and the soldiers' letters. All of it spreads through the marches that still obey the capital."
 IVC_depot_sabotage:0 "Sabotage of the Cabinet's Depots"
 IVC_depot_sabotage_desc:0 "Railwaymen and storekeepers who sympathise with the legion prepare to set fire to depots behind the cabinet's lines. They need money, explosives and a few weeks."
 IVC_northern_arms_caravan:0 "Caravan from the Corridor"
 IVC_northern_arms_caravan_desc:0 "The legion's couriers arrange a new consignment of arms with the northern commanders. The caravan will cross the passes while the legion holds the marches on the corridor border."
 IVC_officer_defection_talks:0 "Talks with the Cabinet's Officers"
 IVC_officer_defection_talks_desc:0 "The legion council meets the cabinet's regimental commanders in secret. Those who come over with their men are promised rank, pay and oblivion."
 IVC_trust_cabinet_held_minus_8_tt:0 "Trust of the cabinet's frontier marches in the capital: §R-8§!"
 IVC_northern_caravan_route_tt:0 "We control [92.GetName], [95.GetName] or [96.GetName] on the corridor border"
 IVC_assault_groups_idea:0 "Assault Groups"
 IVC_assault_groups_idea_desc:0 "Battalions drilled near Vedrina attack in groups and take trenches before the enemy understands where the blow comes from."
 IVC_defence_in_depth_idea:0 "Defence in Depth"
 IVC_defence_in_depth_idea_desc:0 "Trenches on the slopes, machine guns in the ravines and reserves behind every height. The legion's defence can only be broken piece by piece."
 IVC_forced_march_idea:0 "Forced March"
 IVC_forced_march_idea_desc:0 "The legion's columns march by night without halts. They tire, but they arrive where no one expects them."
 IVC_offensive_staff_work_idea:0 "Preparing the General Offensive"
 IVC_offensive_staff_work_idea_desc:0 "The legion's staff plans the offensive by the hour: who goes forward, when, and behind which barrage."
 IVC_artillery_preparation_idea:0 "Artillery Preparation"
 IVC_artillery_preparation_idea_desc:0 "The legion's hoarded shells fall on the cabinet's trenches before every attack."
 IVC_offensive_supply_dumps_idea:0 "Offensive Supply Dumps"
 IVC_offensive_supply_dumps_idea_desc:0 "Crates of cartridges, bandages and petrol stand right behind the front. The advancing regiments need not wait for the baggage trains."
 IVC_last_push_idea:0 "The Last Push"
 IVC_last_push_idea_desc:0 "The whole legion has climbed out of its trenches at once. It will not have a second morning like this, and every soldier knows it."
 IVC_march_momentum_idea:0 "Momentum of the March"
 IVC_march_momentum_idea_desc:0 "The columns of the decisive march do not stop at broken positions; they push on while the cabinet gathers its reserves."
 IVC_hill_counteroffensive_idea:0 "Counteroffensive from the Hills"
 IVC_hill_counteroffensive_idea_desc:0 "The regiments that held the frontier war come down from the hills. They know every slope they will advance along."
 IVC_council_unified_command_idea:0 "Unified Command"
 IVC_council_unified_command_idea_desc:0 "The legion council runs the marches like a single division. An order from Vedrina reaches a company within hours."
 IVC_union_fervour_idea:0 "Fervour of the Union"
 IVC_union_fervour_idea_desc:0 "The union's companies go into battle with songs and banners. They are hard to stop while they sing."
 IVN_nm_mandate_council:0 "The Mandate Council"
 IVN_nm_mandate_council_desc:0 "A mandate council convenes in Norvane: Itoran commissioners, Matvey Mateusk's people and the envoys of Anton Selevyostrov. For the first time in years the corridor is governed by the minutes of one table rather than orders from the front."
 IVN_nm_clients_ready_tt:0 "[IBA.GetName] or [IBL.GetName] remains our subject"
 IVN_nm_arms_for_norvane:0 "Arms for the Clients"
 IVN_nm_arms_for_norvane_desc:0 "The armies of Norvane and Krait are made of militiamen and the remnants of northern garrisons. The arsenals of the marches give them guns and field kit so the new governments survive their first winter."
 IVN_nm_corridor_survey:0 "Survey of the Corridor"
 IVN_nm_corridor_survey_desc:0 "Engineers of the marches walk the corridor from Norvane to Krait. The bridges blown up in the wars of the collapse are marked on the maps, and the first gangs are already repairing the track."
 IVN_nm_mandate_liaison:0 "Liaison Officers"
 IVN_nm_mandate_liaison_desc:0 "Officers of the marches serve at the headquarters of Norvane and Krait. They teach the new armies to read maps and wait for orders, and teach them along the way to look south, towards Itora."
 IVN_nm_lean_clients_10_tt:0 "The lean of [IBA.GetName] and [IBL.GetName] shifts towards Itora by §Y10§!."
 IVN_nm_corridor_refugees:0 "Return of the Refugees"
 IVN_nm_corridor_refugees_desc:0 "Camps of refugees from the corridor have stood in Moressa and Lakora since the first days of the collapse. Now trains carry the people home, and the inner marches breathe freely for the first time in a long while."
 IVN_nm_direct_administration:0 "Direct Administration"
 IVN_nm_direct_administration_desc:0 "Itoran commissioners take their seats in the ministries of Norvane and Krait. Mateusk and Selevyostrov sign what is brought to them, and the corridor becomes the rear of the army of the marches."
 IVN_nm_lean_clients_20_tt:0 "The lean of [IBA.GetName] and [IBL.GetName] shifts towards Itora by §Y20§!."
 IVN_nm_client_self_government:0 "Self-Government of the Clients"
 IVN_nm_client_self_government_desc:0 "The Committee decides that councils of their own, not commissioners, will hold the corridor. Norvane and Krait gain the right to their own laws, and Itora gains neighbours who are not waiting for a convenient hour to turn away from it."
 IVN_nm_corridor_garrisons:0 "Corridor Garrisons"
 IVN_nm_corridor_garrisons_desc:0 "Fortified posts rise along the northern edge of the corridor. The surviving republics are at war with one another again, and the mandate needs a border their wars cannot spill across."
 IVN_nm_corridor_volunteers:0 "Volunteers of the Corridor"
 IVN_nm_corridor_volunteers_desc:0 "The commissioners open recruiting stations of the army of the marches in the corridor towns. The youth of Norvane and Krait come for pay and rations, though their elders call it a new mobilisation under a foreign flag."
 IVN_nm_mandate_arsenal:0 "The Mandate Arsenal"
 IVN_nm_mandate_arsenal_desc:0 "An arsenal for the mandate garrisons is built in Serenga, on the road into the corridor. Shells and rifles no longer travel across the whole republic from the Old March."
 IVN_nm_corridor_councils:0 "Councils of the Corridor"
 IVN_nm_corridor_councils_desc:0 "The towns of Norvane and Krait elect local councils. The Committee sends observers, not lists of candidates, and the northerners vote for the first time without soldiers at the polling station door."
 IVN_nm_corridor_trade_treaty:0 "The Trade Treaty"
 IVN_nm_corridor_trade_treaty_desc:0 "Itora opens the markets of the marches to the timber and coal of the corridor and builds workshops in Norvane and Krait in return. Trade binds the clients to the republic more tightly than any garrison."
 IVN_nm_norvane_charter:0 "The Norvane Charter"
 IVN_nm_norvane_charter_desc:0 "The charter fixes the rights of the corridor and Itora's obligations to it. Mateusk calls it the first constitution of the north not written at a victor's dictation."
 IVN_nm_lean_clients_15_tt:0 "The lean of [IBA.GetName] and [IBL.GetName] shifts towards Itora by §Y15§!."
 IVN_nm_corridor_telegraph:0 "Corridor Telegraph"
 IVN_nm_corridor_telegraph_desc:0 "Wires are strung along the railway from the Old March to Krait. An order from headquarters reaches the northern outpost in an hour rather than in three days by courier."
 IVN_nm_northern_trunk_line:0 "The Northern Trunk Line"
 IVN_nm_northern_trunk_line_desc:0 "The railway runs again from the Old March through Vedrina into the corridor. It carries grain and coal and, when needed, divisions that will reach the northern edge of the mandate within a week."
 IVN_nm_corridor_depots:0 "Corridor Depots"
 IVN_nm_corridor_depots_desc:0 "Army depots are laid down at the junctions of the trunk line. If the north needs the army of the marches again, it will find its stores a few days' march away rather than in the capital."
 IVN_nm_krait_university:0 "Krait University"
 IVN_nm_krait_university_desc:0 "A university opens in Krait with Itoran professors and northern students. In a few years the corridor will be run by people who studied from the republic's books."
 IVN_nm_northern_neighbours:0 "Neighbours of the Mandate"
 IVN_nm_northern_neighbours_desc:0 "Beyond the edge of the corridor lie the republics that recently fought the corps of the marches. The Committee offers them trade through Krait and mediation in their own disputes."
 IVN_nm_lean_north_10_tt:0 "The lean of [PWR.GetName], [PSD.GetName], [WPA.GetName] and [WPS.GetName] shifts towards Itora by §Y10§!."
 IVN_nm_northern_shield:0 "The Northern Shield"
 IVN_nm_northern_shield_desc:0 "The corridor is no longer a breach in the republic's border but its northern shield. Norvane and Krait stand between the marches and the wars of the north, and Itora knows that behind them lie its own towns."
 IVN_nm_retreat_inquiry:0 "The Retreat Inquiry"
 IVN_nm_retreat_inquiry_desc:0 "Deputies, officers and widows sit at one table to work out why the corps left the corridor. The inquiry sits in public: a republic that hides its defeats will lose the next war as well."
 IVN_nm_rearmament_plan:0 "Rearmament Plan"
 IVN_nm_rearmament_plan_desc:0 "The corps abandoned guns, lorries and half its rifles in the corridor. The planning board counts the losses and, for the first time, writes a military order for the defence of its own marches rather than for a march."
 IVN_nm_northern_border_line:0 "The Northern Border Line"
 IVN_nm_northern_border_line_desc:0 "Trenches are dug along the corridor border where the expedition's columns marched only last summer. The north is no longer the goal of a campaign but the direction trouble may come from."
 IVN_nm_veterans_of_the_north:0 "Veterans of the Northern March"
 IVN_nm_veterans_of_the_north_desc:0 "The soldiers back from the corridor expect not medals but an honest word that their march was not in vain. The Committee meets them at the stations of Vedrina and Serenga and pays its wage arrears in full."
 IVN_nm_expedition_prisoners:0 "Exchange of Prisoners"
 IVN_nm_expedition_prisoners_desc:0 "Thousands of the corps' soldiers remain in the camps of the northern republics. The Committee bargains for each of them with grain, money and a promise never to enter the corridor in arms again."
 IVN_nm_lean_corridor_10_tt:0 "The lean of [PWR.GetName] and [PSD.GetName] shifts towards Itora by §Y10§!."
 IVN_nm_new_rifle_pattern:0 "A New Rifle Pattern"
 IVN_nm_new_rifle_pattern_desc:0 "The corps' rifles jammed in the mud of the corridor. The gunsmiths of Moressa are commissioned for a pattern that will survive a northern autumn."
 IVN_nm_artillery_school:0 "Artillery School"
 IVN_nm_artillery_school_desc:0 "The corps marched north almost without guns and paid for it in infantry. An artillery school opens in the Old March, and its first graduates go straight to the northern line."
 IVN_nm_northern_air_watch:0 "Northern Air Watch"
 IVN_nm_northern_air_watch_desc:0 "Foreign scouts flew over the corridor, and the corps had no airfield closer than the capital. A field airfield is built in Kantoria and anti-aircraft batteries are set up."
 IVN_nm_purge_officer_corps:0 "Purge of the Officer Corps"
 IVN_nm_purge_officer_corps_desc:0 "The inquiry names names, and the Committee seeks no excuses. Commanders who abandoned their regiments in the corridor stand trial, and the northern garrisons see it as reprisal against their own."
 IVN_nm_rehabilitate_officers:0 "Rehabilitation of the Corps"
 IVN_nm_rehabilitate_officers_desc:0 "The Staff of the marches answers the inquiry: the army did all it could with what it was given. Disgraced commanders return to service, and the northern garrisons believe again that the capital will not give them up."
 IVN_nm_citizen_officers:0 "Citizen Officers"
 IVN_nm_citizen_officers_desc:0 "Teachers, engineers and reservists from the inner marches take the places of the dismissed commanders. They know the regulations less well, but they swore their oath to the republic, not to the staff."
 IVN_nm_court_of_honour:0 "Court of Honour"
 IVN_nm_court_of_honour_desc:0 "The officers' assembly judges its own, without deputies or newspapers. The acquitted leave the hall as heroes of Serenga and Talara, the condemned without their epaulettes but without the shame of a tribunal."
 IVN_nm_trust_serenga_talara_10_tt:0 "Trust of [92.GetName] and [96.GetName]: §G+10§!"
 IVN_nm_new_field_manual:0 "A New Field Manual"
 IVN_nm_new_field_manual_desc:0 "The study of the retreat becomes a manual. The new instructions teach regiments to hold a line, to withdraw without panic and not to outrun their trains on the broken roads of the north."
 IVN_nm_anti_armour_lessons:0 "Lessons of the Armoured Cars"
 IVN_nm_anti_armour_lessons_desc:0 "The northern republics drove the corps back with armoured cars and machine-gun lorries. The marches answer with anti-tank batteries at every station."
 IVN_nm_mobile_reserve:0 "Mobile Reserve"
 IVN_nm_mobile_reserve_desc:0 "The reserve of the marches is put on lorries. It will not have to walk for a week to a breakthrough, as the corps walked to Krait."
 IVN_nm_serenga_fortress:0 "Serenga Fortress"
 IVN_nm_serenga_fortress_desc:0 "Serenga stands on the main road from the north. It is turned into a fortress with batteries and underground stores, so the next enemy stops at its ramparts."
 IVN_nm_trust_serenga_5_tt:0 "Trust of [92.GetName]: §G+5§!"
 IVN_nm_northern_rokada:0 "The Northern Lateral Road"
 IVN_nm_northern_rokada_desc:0 "A road is laid along the border from Serenga to Talara and Kantoria. Reserves will move along the front on it instead of along broken tracks through the capital."
 IVN_nm_invalid_homes:0 "Homes for the Maimed"
 IVN_nm_invalid_homes_desc:0 "Every march opens a home for soldiers who came back without legs and without work. The frontier sees that the republic remembers them not only on the day of a funeral."
 IVN_nm_veterans_settlements:0 "Veterans' Settlements"
 IVN_nm_veterans_settlements_desc:0 "Veterans receive land and workshops in Ilvan. The new settlements are built by the same sappers who threw bridges across at Krait."
 IVN_nm_loyal_garrisons:0 "Loyal Garrisons"
 IVN_nm_loyal_garrisons_desc:0 "Not every northern regiment followed Karn. The cabinet pays the loyal garrisons double wages and prints their names in the capital's newspapers."
 IVN_nm_revolt_active_tt:0 "The revolt of the marches is under way"
 IVN_nm_trust_cabinet_held_10_tt:0 "Trust of the cabinet's frontier marches: §G+10§!"
 IVN_nm_letter_to_vedrina:0 "A Letter to Vedrina"
 IVN_nm_letter_to_vedrina_desc:0 "Mothers and widows of the legion's soldiers write an open letter: come home, you will not be judged for other men's mistakes. The cabinet prints it in a larger run than any leaflet."
 IVN_nm_trust_legion_held_10_tt:0 "Trust of the legion's marches in the capital: §G+10§!"
 IVN_nm_army_after_defeat:0 "The Army after Defeat"
 IVN_nm_army_after_defeat_desc:0 "A year after the retreat the army of the marches looks like an army again: it has a manual, a reserve and roads to the border. It has not forgotten the corridor, and that is exactly why it will not repeat it."
 IVN_nm_frontier_reconciliation:0 "Reconciliation of the Frontier"
 IVN_nm_frontier_reconciliation_desc:0 "The regiments and marches that shared the blame for the north finally speak to each other without weapons. The Committee declares a day of remembrance for the expedition, and Vedrina marks it together with the capital."
 IVN_nm_lesson_of_the_north:0 "The Lesson of the North"
 IVN_nm_lesson_of_the_north_desc:0 "The republic has learned what cost it a corps: a campaign begins only with a solid rear and a united army. Now Itora has both."
 IVN_mandate_category:0 "The Corridor Mandate"
 IVN_mandate_category_desc:0 "Norvane and the Krait Directorate stand on Itoran rifles, Itoran money and Itoran patience. The mandate council decides how much of each the corridor receives this month."
 IVN_retreat_category:0 "Lessons of the Retreat"
 IVN_retreat_category_desc:0 "The corps came back from the corridor without a victory. The inquiry, the staff and the planning board turn its defeat into manuals, orders and fortifications while the marches still remember what it cost."
 IVN_nm_mandate_mission:0 "Mandate Mission"
 IVN_nm_mandate_mission_desc:0 "A delegation of the mandate council travels to the client's capital with gifts, auditors and a long list of promises. It is received the more warmly the closer the garrisons of the marches stand."
 IVN_nm_mandate_arms_convoy:0 "Arms Train"
 IVN_nm_mandate_arms_convoy_desc:0 "The factories of the marches assemble a separate order for the client's army. The train leaves for the north under guard, and until it arrives nobody in the corridor knows how many wagons it carries."
 IVN_nm_corridor_roadworks:0 "Corridor Roadworks"
 IVN_nm_corridor_roadworks_desc:0 "A sapper brigade of the marches repairs bridges and track in one of the corridor lands. The local authorities provide workers, Itora provides engineers and rails."
 IVN_nm_mandate_officers:0 "Itoran Companies"
 IVN_nm_mandate_officers_desc:0 "Companies from the marches pass into the client's service with their officers and colours. The commissioners call it assistance, the northerners call it supervision."
 IVN_nm_client_credit:0 "Credit for Self-Government"
 IVN_nm_client_credit_desc:0 "The mandate council opens a credit line for the client. Itoran builders do the work, and the debt is repaid in goods the northerners will learn to make themselves."
 IVN_nm_client_credit_limit_tt:0 "[FROM.GetName] has received fewer than §Y2§! factories on credit"
 IVN_nm_mission_lean_tt:0 "The lean of [FROM.GetName] shifts towards Itora by §Y10§!."
 IVN_nm_retreat_debriefing:0 "Debriefing the Returned"
 IVN_nm_retreat_debriefing_desc:0 "The inquiry questions another company back from the corridor. The soldiers speak of abandoned trains, of orders that came a day late, and of how they were brought out all the same."
 IVN_nm_debriefing_limit_tt:0 "Debriefings held fewer than §Y3§! times"
 IVN_nm_rearmament_order:0 "Rearmament Order"
 IVN_nm_rearmament_order_desc:0 "The planning board places an order for what the corps lacked in the corridor: anti-tank guns, anti-aircraft guns and field equipment. Factories that sewed greatcoats yesterday switch to barrels and gun carriages."
 IVN_nm_border_works:0 "Border Fortifications"
 IVN_nm_border_works_desc:0 "Sappers fortify a stretch of the northern border: they pour concrete firing points, dig communication trenches and mine the fords."
 IVN_nm_veterans_reenlistment:0 "Re-enlist the Veterans"
 IVN_nm_veterans_reenlistment_desc:0 "Veterans of the northern march are called back to the regiments. Many return, but in the northern villages people ask ever more loudly how many more times the capital will ask for their sons."
 IVN_nm_ensign_school:0 "Ensign School"
 IVN_nm_ensign_school_desc:0 "Accelerated courses train junior commanders from reservists and students. The regiments receive officers who swore their oath to the Committee rather than to the old staff."
 IVN_nm_recall_disgraced_officers:0 "Recall Disgraced Officers"
 IVN_nm_recall_disgraced_officers_desc:0 "The staff reviews another case of a commander dismissed after the retreat. The acquitted officer gets his regiment back, and his comrades get proof that the staff does not abandon its own."
 IVN_nm_mandate_commissioners:0 "Itoran Commissioners"
 IVN_nm_mandate_commissioners_desc:0 "The country's ministries and headquarters work under the eye of Itoran commissioners. The army receives weapons and order, the government ever less right to decide for itself."
 IVN_nm_corridor_self_rule:0 "Self-Rule of the Corridor"
 IVN_nm_corridor_self_rule_desc:0 "Itora entrusts the country with its own councils and laws. Local authority rests not on foreign bayonets but on the consent of its own towns."
 IVN_nm_officer_purge:0 "Purge of the Officer Corps"
 IVN_nm_officer_purge_desc:0 "The regiments have lost commanders who are on trial for the retreat. The new officers do not yet know their soldiers, nor the staff its new officers."
 IVN_cb_loyal_fleet:0 "The Fleet Stays with the Republic"
 IVN_cb_loyal_fleet_desc:0 "Not a single ship sailed for Vedrina: the sailors swore their oath to the republic, not to the generals of the marches. The cabinet has what the legion lacks - the sea and the islands beyond it."
 IVN_cb_raidal_lifeline:0 "The Raidal Bridge"
 IVN_cb_raidal_lifeline_desc:0 "Every night transports leave Raidal for the mainland with volunteers and rifles from the island depots. The islands the capital long ignored now feed its front."
 IVN_cb_southern_dockyards:0 "Dockyards of the Southern Seaboard"
 IVN_cb_southern_dockyards_desc:0 "The workshops of the Southern Seaboard turn from fishing schooners to patrol boats. They are built fast and rough, but the legion has nothing to answer them with."
 IVN_cb_coastal_blockade:0 "Naval Blockade"
 IVN_cb_coastal_blockade_desc:0 "The fleet's boats intercept coasters carrying cartridges to the legion from foreign harbours. Every barge sent to the bottom is a rebel company without ammunition."
 IVN_cb_ship_guns_ashore:0 "Ship Guns Ashore"
 IVN_cb_ship_guns_ashore_desc:0 "The guns of old cruisers are lifted from their decks onto railway flatcars. Fleet gunners teach army artillerymen to fire at a target they cannot see."
 IVN_cb_air_arm:0 "The Cabinet's Air Arm"
 IVN_cb_air_arm_desc:0 "Part of the squadrons flew to Vedrina with their pilots. The cabinet gathers the remaining aircraft on the airfields of the Old March and trains new pilots in battle itself."
 IVN_cb_air_reconnaissance:0 "Aerial Reconnaissance"
 IVN_cb_air_reconnaissance_desc:0 "Light aircraft pass over the legion's positions every morning. By noon the cabinet's staff has fresh maps, and Stalk's regiments can no longer move their reserves unseen."
 IVN_cb_rail_strikes:0 "Strikes on the Junctions"
 IVN_cb_rail_strikes_desc:0 "Bombers go for the stations of Vedrina and Kantoria. The legion lives on the railway, and every broken bridge stops its trains for a week."
 IVN_cb_capital_air_defence:0 "Sky over the Capital"
 IVN_cb_capital_air_defence_desc:0 "Anti-aircraft guns go up on the roofs of the Old March, and shelters are dug in the Southern March. The legion's raids will no longer catch the capital unprepared."
 IVN_cb_behind_the_lines:0 "Behind the Legion's Lines"
 IVN_cb_behind_the_lines_desc:0 "In the legion's marches remain teachers, railwaymen and widows who do not believe in Stalk. The cabinet sends them couriers, money and the hope that the republic will soon return."
 IVN_cb_trust_legion_10_tt:0 "Trust of the legion's marches in the capital: §G+10§!"
 IVN_cb_underground_committees:0 "Underground Committees"
 IVN_cb_underground_committees_desc:0 "The underground blows no bridges: it prints the lists of the amnestied, hides deserters and talks to weary companies. The marches prepare to return without a fight."
 IVN_cb_trust_legion_15_tt:0 "Trust of the legion's marches in the capital: §G+15§!"
 IVN_cb_sabotage_detachments:0 "Sabotage Detachments"
 IVN_cb_sabotage_detachments_desc:0 "Cabinet officers cross the front line with explosives and maps of the depots. The legion will feel the war in its rear, but the people of the marches will pay for every round-up."
 IVN_cb_refugee_columns:0 "Refugee Columns"
 IVN_cb_refugee_columns_desc:0 "Families fleeing the legion's mobilisation walk south on every road. The cabinet meets them at the stations, feeds them and enrols the men in the reserve."
 IVN_cb_trust_cabinet_5_tt:0 "Trust of the cabinet's frontier marches: §G+5§!"
 IVN_cb_northern_battalions:0 "Battalions of the Northern Marches"
 IVN_cb_northern_battalions_desc:0 "Fugitives from Vedrina, Talara and Kantoria ask for weapons. They form battalions that know every path on the other side of the front."
 IVN_cb_ring_around_vedrina:0 "A Ring around Vedrina"
 IVN_cb_ring_around_vedrina_desc:0 "The fleet has closed the sea, the air arm the sky and the underground the rear roads. The legion is left only with what it can hold with bayonets."
 IVN_wl_victors_of_the_west:0 "Victors of the West"
 IVN_wl_victors_of_the_west_desc:0 "Vorkerland has signed the peace on the Old March's terms. Itora, recently thought a province of a collapsed power, now decides what the West will be."
 IVN_wl_hegemon_ivn_tt:0 "Itora won the war for the West"
 IVN_wl_corridor_administration:0 "Corridor Commandants"
 IVN_wl_corridor_administration_desc:0 "The corridor districts passed to Itora under the peace treaty. A commandant's office opens in every town, and its first task is to make people stop waiting for their former masters."
 IVN_wl_corridor_census:0 "Census of the Corridor"
 IVN_wl_corridor_census_desc:0 "Census-takers walk the farmsteads and stations of the corridor. For the first time since the collapse every inhabitant holds a paper stating whose citizen he is."
 IVN_wl_corridor_census_tt:0 "For every corridor district we own: §G+2500§! £manpower_texticon"
 IVN_wl_corridor_roads:0 "Roads of the Corridor"
 IVN_wl_corridor_roads_desc:0 "The war-torn corridor roads are repaired by the same sappers who mined them not long ago. Lorries of grain, not columns, will travel them now."
 IVN_wl_fate_of_vorkerland:0 "The Fate of Vorkerland"
 IVN_wl_fate_of_vorkerland_desc:0 "The power from whose wreckage Itora grew now depends on its decisions. The Old March must show that the victor of the West can do more than win."
 IVN_wl_western_congress:0 "Congress of the West"
 IVN_wl_western_congress_desc:0 "Delegations of the western republics gather in the Old March. They came not to defeated Vorkerland but to Itora, and each wants to learn what its friendship is worth."
 IVN_wl_push_all_15_tt:0 "Every western state leans §Y15§! further toward Itora. States leaning to us by §Y50§! or more are open to scientific exchange and will join the §YCouncil of the West§!."
 IVN_wl_rimat_compact:0 "Compact with Rimat"
 IVN_wl_rimat_compact_desc:0 "Rimat was the one neighbour Itora could count on in its worst days. The new compact opens the border at Talara for trade and promises Rimat a voice in the affairs of the West."
 IVN_wl_push_rimat_tt:0 "[WIT.GetName] leans §Y25§! further toward Itora."
 IVN_wl_northern_republics:0 "The Northern Republics"
 IVN_wl_northern_republics_desc:0 "The northern republics remember that Itora twice came into the corridor with troops. Now it comes with trade agents and doctors, and that works better than any army."
 IVN_wl_push_north_tt:0 "[PWR.GetName], [PSD.GetName] and [ZAO.GetName] lean §Y20§! further toward Itora."
 IVN_wl_concert_of_the_west:0 "Council of the West"
 IVN_wl_concert_of_the_west_desc:0 "The republics of the West sit at one table with Itora. It is not yet an alliance, but already an order in which disputes are settled in council rather than on the march."
 IVN_wl_concert_of_the_west_tt:0 "For every sovereign western state leaning to us by §Y50§! or more, or allied with us: §G+15§! £political_power_texticon and §G+1500§! £manpower_texticon volunteers, and that state gains §G+3%§! stability."
 IVN_wl_army_after_victory:0 "The Victors' Army"
 IVN_wl_army_after_victory_desc:0 "The regiments return to barracks to music and flowers. A week after the parade the republic must decide what to do with an army it no longer needs, or needs more than ever."
 IVN_wl_demobilisation:0 "Demobilisation"
 IVN_wl_demobilisation_desc:0 "The soldiers go back to their machines and fields. The republic risks being left without an army, but marches weary of two wars finally get their sons back."
 IVN_wl_standing_army:0 "A Standing Army"
 IVN_wl_standing_army_desc:0 "The staff convinces the Committee that peace in the West rests on divisions, not treaties. The regular regiments stay under arms and go to garrison the corridor."
 IVN_wl_veterans_land:0 "Land for the Veterans"
 IVN_wl_veterans_land_desc:0 "The demobilised receive plots and loans in Ilvan and Olsia. Workshops and farmsteads grow where the reserve regiments once stood."
 IVN_wl_army_of_the_west:0 "Army of the West"
 IVN_wl_army_of_the_west_desc:0 "The arsenals of the Old March keep working after the war. A republic that has chosen to be a hegemon must arm its own army."
 IVN_wl_peace_of_the_victors:0 "The Victors' Peace"
 IVN_wl_peace_of_the_victors_desc:0 "The dispute over the army is settled. The republic now has its own answer to the question the next crisis in the West will bring to it."
 IVN_wl_hegemony_of_the_marches:0 "Hegemony of the Marches"
 IVN_wl_hegemony_of_the_marches_desc:0 "The small republic of the marches has become the centre of the West. Its flag hangs in capitals that recently had never heard of it, and its laws are read in the towns of the corridor."
 IVN_wl_under_the_hegemon:0 "Under the Hegemon's Hand"
 IVN_wl_under_the_hegemon_desc:0 "The army of the marches has laid down its arms, and Vorkerland's commissioners have arrived in the Old March. Itora has lost the war but has not yet lost itself."
 IVN_wl_hegemon_wrk_tt:0 "Vorkerland won the war for the West"
 IVN_wl_count_the_losses:0 "Counting the Losses"
 IVN_wl_count_the_losses_desc:0 "The government publishes the lists of the dead, the missing and the captured. An honest count is bitter, but the families of the marches at least know whom they may still await."
 IVN_wl_trust_held_10_tt:0 "Trust of the frontier marches Itora still holds: §G+10§!"
 IVN_wl_quiet_resistance:0 "Quiet Resistance"
 IVN_wl_quiet_resistance_desc:0 "Officers go into the reserve, not into retirement. Depots are emptied on paper, not in fact, and every mobilisation plan is written in two copies."
 IVN_wl_accommodation:0 "Living with the Victor"
 IVN_wl_accommodation_desc:0 "The government tells the marches the truth: Vorkerland has come to stay. Better to trade with the hegemon and build than to wait for a war Itora has already lost."
 IVN_wl_hidden_depots:0 "Hidden Depots"
 IVN_wl_hidden_depots_desc:0 "Part of the arsenals never reached the commission's inventories. Rifles lie greased in the cellars of schools and monasteries until they are needed again."
 IVN_wl_lost_lands_underground:0 "Underground of the Lost Lands"
 IVN_wl_lost_lands_underground_desc:0 "In the lands now listed as Vorkerland's remain people who remember the republic. Couriers cross the border one way, and young men unwilling to serve a foreign army cross it the other."
 IVN_wl_staff_in_reserve:0 "A Staff in Reserve"
 IVN_wl_staff_in_reserve_desc:0 "The disbanded Staff of the marches keeps meeting in private flats. Its officers study the lost war and prepare the army Itora does not yet have."
 IVN_wl_federal_contracts:0 "Federal Contracts"
 IVN_wl_federal_contracts_desc:0 "The factories of the marches are offered Vorkerland's orders. The republic works for the victor, but the machines, the workers and the skills remain in Itora."
 IVN_wl_order_without_commissioners:0 "Order without Commissioners"
 IVN_wl_order_without_commissioners_desc:0 "The local councils of the marches carry out the peace terms themselves, without waiting for foreign inspectors. The hegemon is satisfied, and the marches keep their own officials."
 IVN_wl_trust_held_5_tt:0 "Trust of the frontier marches Itora still holds: §G+5§!"
 IVN_wl_hegemons_engineers:0 "The Hegemon's Engineers"
 IVN_wl_hegemons_engineers_desc:0 "Vorkerland's engineers come to the factories of the marches, and Itoran students go to their institutes. The victor teaches the vanquished without meaning to."
 IVN_wl_rebuild_old_march:0 "Rebuild the Old March"
 IVN_wl_rebuild_old_march_desc:0 "The capital patches its roofs, bridges and workshops. Its reconstruction is the first thing Itora does after the war with its own hands and for itself."
 IVN_wl_frontier_refugees:0 "Refugees of the Frontier"
 IVN_wl_frontier_refugees_desc:0 "Families with bundles walk south from the lost and ruined marches. Ilvan gives them land and work in new factories."
 IVN_wl_university_of_the_marches:0 "University of the Marches"
 IVN_wl_university_of_the_marches_desc:0 "A university opens in the Old March to train engineers, doctors and teachers. Itora lost the war of arms and does not intend to lose the war of knowledge."
 IVN_wl_marches_endure:0 "The Marches Endure"
 IVN_wl_marches_endure_desc:0 "Itora lives under a foreign hegemony, but it lives. Its schools are open, its factories work, and the memory of the republic passes from fathers to children."
 IVN_wl_armed_truce:0 "Armed Truce"
 IVN_wl_armed_truce_desc:0 "The war for the West ended without a victor. The armies stand where the deadline found them, and no one believes this peace will last long."
 IVN_wl_truce_tt:0 "The war for the West ended in a truce without a victor"
 IVN_wl_truce_commission:0 "Truce Commission"
 IVN_wl_truce_commission_desc:0 "Officers of both sides meet at a station in the corridor to exchange prisoners and draw the line of demarcation. Every kilometre of that line costs hours of argument."
 IVN_wl_line_of_the_marches:0 "Line of the Marches"
 IVN_wl_line_of_the_marches_desc:0 "The staff proposes a simple answer: if there is no peace, there must be a wall. The northern marches become a fortified belt no surprise attack will cross."
 IVN_wl_open_corridor:0 "An Open Corridor"
 IVN_wl_open_corridor_desc:0 "The Committee bets on trade. As long as cargo moves through the corridor, both sides have something to lose, and a new war becomes too expensive."
 IVN_wl_northern_forts:0 "Northern Forts"
 IVN_wl_northern_forts_desc:0 "Concrete forts rise above Serenga, Talara and Kantoria. They are built to last centuries, as if the border will never move again."
 IVN_wl_observation_posts:0 "Observation Posts"
 IVN_wl_observation_posts_desc:0 "Observation posts, airfields and anti-aircraft batteries go up on the heights near Vedrina. No column on the far side of the line will pass unnoticed."
 IVN_wl_frontier_reserve:0 "Frontier Reserve"
 IVN_wl_frontier_reserve_desc:0 "Depots and reserve muster points are set up in the border towns. If the line catches fire, the regiments will rise within a day."
 IVN_wl_customs_on_the_highway:0 "Customs on the Highway"
 IVN_wl_customs_on_the_highway_desc:0 "A customs house opens at Serenga for the goods of the corridor. The duties fill the treasury, and the customs officers know more about the neighbours than any intelligence service."
 IVN_wl_southern_harbours:0 "Southern Harbours"
 IVN_wl_southern_harbours_desc:0 "While the corridor stays under the guns, goods go by sea. The Southern Seaboard builds warehouses and piers for trade with Rimat and distant shores."
 IVN_wl_mixed_commissions:0 "Mixed Commissions"
 IVN_wl_mixed_commissions_desc:0 "Engineers of both sides repair the bridges and waterworks of the borderland together. They will not agree on peace, but they will agree on how to keep the towns alive."
 IVN_wl_peace_without_victory:0 "Peace without Victory"
 IVN_wl_peace_without_victory_desc:0 "Itora did not win the war for the West, but it did not lose it either. The marches learn to live on a border that may become a front again any day."
 IVN_wl_border_armoured_trains:0 "Border Armoured Trains"
 IVN_wl_border_armoured_trains_desc:0 "Armoured trains run along the lateral railway behind the line. They will not replace the army, but they will quickly carry it to wherever trouble begins."
 IVN_wl_towns_of_the_border:0 "Towns of the Border"
 IVN_wl_towns_of_the_border_desc:0 "Talara and Kantoria receive new factories. A border where people live and work holds better than one where only soldiers stand."
 IVN_wl_long_truce:0 "The Long Truce"
 IVN_wl_long_truce_desc:0 "Year after year the truce is extended by another year. Itora stands on its border, strong enough to be left alone and calm enough to leave others alone."
 IVN_cb_partisan_supply:0 "Supply the Underground"
 IVN_cb_partisan_supply_desc:0 "Cabinet couriers carry money, leaflets and rifles across the front line. The march's underground will receive them at night at a forest halt and hide them until its hour comes."
 IVN_cb_partisan_supply_rifles_tt:0 "The depots hold §Y1800§! £infantry_equipment_texticon for the underground"
 IVN_cb_partisan_supply_tt:0 "The underground receives §Y1800§! £infantry_equipment_texticon. In §Y30§! days the trust of [FROM.GetName] in the capital rises by §G+15§!, and its roads suffer from sabotage. If the march leaves the legion first or the revolt ends, the price and the rifles return."
 IVN_cb_sabotage_raid:0 "Saboteurs' Raid"
 IVN_cb_sabotage_raid_desc:0 "A sabotage group slips into a legion march with maps of its depots and workshops. By morning the workshops burn, and Stalk's patrols search every house."
 IVN_cb_sabotage_raid_trust_tt:0 "Trust of [FROM.GetName] in the capital: §R-5§!. No other measure can be taken in the march for §Y30§! days."
 IVN_west_legacy_category:0 "Legacy of the West"
 IVN_west_legacy_category_desc:0 "The war for the West is over. Now Itora lives with its outcome and builds its future upon it."
 IVN_wl_integrate_district:0 "Bring the District into the Republic"
 IVN_wl_integrate_district_desc:0 "A civil board replaces the commandant's office, and the district's schools begin to teach the laws of the republic. In a few months nobody here will speak of the former masters."
 IVN_wl_integrate_district_tt:0 "In §Y120§! days the district of [FROM.GetName] becomes our national region and gains §Y1§! level of infrastructure. If we lose the district before then, the price returns."
 IVN_wl_western_exchange:0 "Scientific Exchange with a Neighbour"
 IVN_wl_western_exchange_desc:0 "Professors and engineers of the two republics exchange chairs and laboratories. A friendship sealed with shared blueprints lasts longer than treaties."
 IVN_wl_western_exchange_limit_tt:0 "Fewer than §Y4§! scientific exchanges held"
 IVN_wl_western_friend_tt:0 "The country is not at war with us and leans to us by §Y50§! or more, or is allied with us"
 IVN_wl_western_exchange_tt:0 "In §Y60§! days we gain an industry research bonus, and [FROM.GetName] gains §G+2%§! stability. If the country disappears or goes to war with us before then, the price returns."
 IVN_wl_veterans_cooperatives:0 "Cooperatives of the Demobilised"
 IVN_wl_veterans_cooperatives_desc:0 "Companies back from the war do not scatter to their homes but form cooperatives. They are given a loan, machines and an old warehouse by the station."
 IVN_wl_veterans_cooperatives_limit_tt:0 "Fewer than §Y3§! cooperatives founded"
 IVN_wl_veterans_manpower_tt:0 "The reserve holds §Y5000§! £manpower_texticon demobilised men"
 IVN_wl_veterans_cooperatives_tt:0 "The reserve loses §Y5000§! £manpower_texticon. In §Y60§! days a national region with free space gains §Y1§! civilian factory. If no space remains, §Y40§! £political_power_texticon and §Y5000§! £manpower_texticon return."
 IVN_wl_corridor_garrison:0 "Garrison the District"
 IVN_wl_corridor_garrison_desc:0 "A regular company takes over the barracks on the outskirts and starts by digging. A month later pillboxes stand on the district's border, and the town knows who keeps order here."
 IVN_wl_corridor_garrison_rifles_tt:0 "The depots hold §Y1800§! £infantry_equipment_texticon for the garrison"
 IVN_wl_corridor_garrison_tt:0 "The garrison receives §Y1800§! £infantry_equipment_texticon. In §Y30§! days the border of [FROM.GetName] gains §Y1§! level of fortifications. If we lose the district, the price and the rifles return."
 IVN_wl_lost_march_sabotage:0 "Strike of the Underground"
 IVN_wl_lost_march_sabotage_desc:0 "The underground of a lost land prepares a strike against the hegemon's factories. Its people work in the very workshops they are to stop."
 IVN_wl_lost_march_sabotage_tt:0 "In §Y30§! days the factories of [FROM.GetName] are damaged and repair more slowly, §Y1500§! £manpower_texticon come over to us, and the round-ups cost us §R-2%§! stability. If the land leaves Vorkerland before then, the price returns."
 IVN_wl_federal_orders:0 "The Hegemon's Order"
 IVN_wl_federal_orders_desc:0 "Vorkerland places a military order with the factories of the marches. The victor pays, but the workshop, the machines and the craftsmen stay in Itora."
 IVN_wl_vorkerland_subject_tt:0 "Itora is subject to Vorkerland"
 IVN_wl_federal_orders_limit_tt:0 "Fewer than §Y3§! orders fulfilled"
 IVN_wl_federal_orders_tt:0 "In §Y90§! days a national region with free space gains §Y1§! military factory. If no space remains, §Y50§! £political_power_texticon return."
 IVN_wl_frontier_alert:0 "Alert on the Line"
 IVN_wl_frontier_alert_desc:0 "An alert is declared along the line of demarcation. Reservists receive their call-up papers, garrisons man the trenches, and the staff checks how many hours a real mobilisation would take."

# Five-sided civil war and negotiated reunification.
