l_english:
 ADISCORD_vorkerland_focus_operations_category:0 "The Last Vorkerland Campaign"
 ADISCORD_vorkerland_focus_operations_category_desc:0 "Focus-authorized measures for the central showdown and the controlled reunification that follows it."
 ADISCORD_vorkerland_allied_support_category:0 "Support the Allied Front"
 ADISCORD_vorkerland_allied_support_category_desc:0 "Bounded deliveries to an existing wartime ally. These measures neither create alliances nor pull neutral countries into a war."

 ADISCORD_vorkerland_focus_central_minor_front_deadline:0 "Conclude the Current Consolidation Front"
 ADISCORD_vorkerland_focus_central_minor_front_deadline_desc:0 "The verified campaign against our named central target will be forcibly settled after 240 days; it cannot silently block the next stage forever."

 ADISCORD_vorkerland_consolidate_eyr:0 "Open the Eyrmi Front"
 ADISCORD_vorkerland_consolidate_eyr_desc:0 "After a one-day faction-detachment check, open our single active consolidation front against the Republic of Eyrmi."
 ADISCORD_vorkerland_consolidate_egc:0 "Open the Zshat Front"
 ADISCORD_vorkerland_consolidate_egc_desc:0 "After a one-day faction-detachment check, open our single active consolidation front against the Zshat Junta."
 ADISCORD_vorkerland_consolidate_riv:0 "Open the Riven Front"
 ADISCORD_vorkerland_consolidate_riv_desc:0 "After a one-day faction-detachment check, open our single active consolidation front against Riven."
 ADISCORD_vorkerland_consolidate_rev:0 "Open the Revel Front"
 ADISCORD_vorkerland_consolidate_rev_desc:0 "After a one-day faction-detachment check, open our single active consolidation front against Revel."
 ADISCORD_vorkerland_consolidate_yor:0 "Open the Yor Front"
 ADISCORD_vorkerland_consolidate_yor_desc:0 "After a one-day faction-detachment check, open our single active consolidation front against the Yor Republic."
 ADISCORD_vorkerland_consolidate_ndn:0 "Open the Norden Front"
 ADISCORD_vorkerland_consolidate_ndn_desc:0 "After a one-day faction-detachment check, open our single active consolidation front against Norden."
 ADISCORD_vorkerland_consolidate_swb:0 "Open the Old Vorkensberg Front"
 ADISCORD_vorkerland_consolidate_swb_desc:0 "After a one-day faction-detachment check, open our single active consolidation front against Old Vorkensberg."
 ADISCORD_vorkerland_consolidate_vhv:0 "Open the Verkhovye Front"
 ADISCORD_vorkerland_consolidate_vhv_desc:0 "After a one-day faction-detachment check, open our single active consolidation front against Verkhovye."
 ADISCORD_vorkerland_consolidate_osv:0 "Open the Ostvin Front"
 ADISCORD_vorkerland_consolidate_osv_desc:0 "After a one-day faction-detachment check, open our single active consolidation front against Ostvin."
 ADISCORD_vorkerland_commit_to_central_showdown:0 "Commit to the Central Showdown"
 ADISCORD_vorkerland_commit_to_central_showdown_desc:0 "Once all nine central minors are terminal and no consolidation front remains, hand the simultaneous three-edge launch to the central phase controller."
 ADISCORD_vorkerland_wkr_retreat_levy_1:0 "Call the First Worker Retreat Levy"
 ADISCORD_vorkerland_wkr_retreat_levy_1_desc:0 "After seven days, one under-equipped militia detachment will assemble at our still-controlled capital."
 ADISCORD_vorkerland_wkr_retreat_levy_2:0 "Call the Last Worker Reserve"
 ADISCORD_vorkerland_wkr_retreat_levy_2_desc:0 "A final and weaker capital reserve. No further levies can be raised through this line."
 ADISCORD_vorkerland_vad_retreat_levy_1:0 "Call the First Chancery Retreat Levy"
 ADISCORD_vorkerland_vad_retreat_levy_1_desc:0 "After seven days, one under-equipped security detachment will assemble at our still-controlled capital."
 ADISCORD_vorkerland_vad_retreat_levy_2:0 "Call the Last Chancery Reserve"
 ADISCORD_vorkerland_vad_retreat_levy_2_desc:0 "A final and weaker capital reserve. No further levies can be raised through this line."
 ADISCORD_vorkerland_tva_retreat_levy_1:0 "Call the First Technical Retreat Levy"
 ADISCORD_vorkerland_tva_retreat_levy_1_desc:0 "After seven days, one under-equipped technical militia detachment will assemble at our still-controlled capital."
 ADISCORD_vorkerland_tva_retreat_levy_2:0 "Call the Last Technical Reserve"
 ADISCORD_vorkerland_tva_retreat_levy_2_desc:0 "A final and weaker capital reserve. No further levies can be raised through this line."
 ADISCORD_vorkerland_restore_core_claimant_homes:0 "Restore the Claimant Homelands"
 ADISCORD_vorkerland_restore_core_claimant_homes_desc:0 "Restore the shared claimant homelands once every state in this exact package is owned and controlled. This package is independent of the other restoration decisions."
 ADISCORD_vorkerland_restore_core_central_historical:0 "Restore the Historical Centre"
 ADISCORD_vorkerland_restore_core_central_historical_desc:0 "Re-establish WRK administration across the complete historical central package, independently of the rim territories."
 ADISCORD_vorkerland_restore_core_rimat:0 "Integrate Rimat"
 ADISCORD_vorkerland_restore_core_rimat_desc:0 "Restore the WRK core in Rimat after securing full ownership and control of the state."
 ADISCORD_vorkerland_restore_core_techlar:0 "Integrate Techlar"
 ADISCORD_vorkerland_restore_core_techlar_desc:0 "Restore the WRK core in Techlar after securing full ownership and control of the state."
 ADISCORD_vorkerland_restore_core_ebern:0 "Integrate Ebern"
 ADISCORD_vorkerland_restore_core_ebern_desc:0 "Restore the WRK core in Ebern after securing full ownership and control of the state."
 ADISCORD_vorkerland_restore_core_solar:0 "Integrate the Solar District"
 ADISCORD_vorkerland_restore_core_solar_desc:0 "Restore the three Solar-district cores after all three states are owned and controlled; no surviving SOL government is required."
 ADISCORD_vorkerland_send_vla_support_tranche_1:0 "Supply the Volnograd Auxiliary Front"
 ADISCORD_vorkerland_send_vla_support_tranche_1_desc:0 "After the WKR-VLA alliance is accepted, transfer 300 infantry equipment and 30 support equipment to Volnograd's active front. A second delivery cannot be prepared for 90 days."
 ADISCORD_vorkerland_send_vla_support_tranche_2:0 "Renew Volnograd Front Support"
 ADISCORD_vorkerland_send_vla_support_tranche_2_desc:0 "Send the second and final bounded equipment tranche to Volnograd."
 ADISCORD_vorkerland_send_sol_support_tranche_1:0 "Supply the Solnechnaya Allied Front"
 ADISCORD_vorkerland_send_sol_support_tranche_1_desc:0 "After the VAD-SOL alliance or verified restoration, transfer 300 infantry equipment and 30 support equipment to SOL's active allied front. A second delivery cannot be prepared for 90 days."
 ADISCORD_vorkerland_send_sol_support_tranche_2:0 "Renew Solnechnaya Front Support"
 ADISCORD_vorkerland_send_sol_support_tranche_2_desc:0 "Send the second and final bounded equipment tranche to Solnechnaya."
 ADISCORD_vorkerland_allied_supply_advisers:0 "Claimant Supply Advisers"
 ADISCORD_vorkerland_allied_supply_advisers_desc:0 "A temporary advisory mission is rationing the delivered materiel and coordinating its movement to the front."
