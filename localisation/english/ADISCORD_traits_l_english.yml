 iron_hand: "Iron Hand"
 Veteran_Of_War: "War Veteran"
 Emergency_Powers: "Emergency Powers"
 High_Political_Aspirations: "Boundless Ambition"
 Marshal_Of_War: "War Marshal"
 The_Weaponry_Baron: "Arms Baron"
 STP_party_loyalist: "Loyal to Party Rule"
 STP_party_loyalist_desc: "Will remain with the party government if Stelander splits."
 STP_shabrat_loyalist: "Shabrat Supporter"
 STP_shabrat_loyalist_desc: "Will side with Shabrat and the resistance if Stelander splits."
 STP_local_councils_loyalist: "Local Council Supporter"
 STP_local_councils_loyalist_desc: "Will lead the local councils' forces as an independent side in the civil war if Stelander splits."
 STP_ravel_undecided: "Ravel's Choice"
 STP_ravel_undecided_desc: "Ravel will join Shabrat if the $STP_cw_officer_contacts$ focus is completed before the split. Otherwise, he will remain with the party government."
 STP_drake_undecided: "Drake's Choice"
 STP_drake_undecided_desc: "Drake will join Shabrat if the $STP_Turn_The_Young_Officers$ focus is completed before the split. Otherwise, he will remain with the party government."
 BOR_frontier_mediator: "Frontier Mediator"
 BOR_frontier_mediator_desc: "Borey turns the competing demands of refugees, garrisons and communities into workable agreements without promising complete consensus."
 RIN_last_palatin: "The Last Palatine"
 RIN_last_palatin_desc: "Alaric can turn ceremonial authority into military orders and personally keeps a divided court from open treason."
 LMN_quarantine_commissioner: "Quarantine Line Commissioner"
 LMN_quarantine_commissioner_desc: "Lemann knows every checkpoint and depot along the cordon, but treats civil administration as an extension of emergency isolation."
 WCG_gate_commandant: "Commandant of the Last Gate"
 WCG_gate_commandant_desc: "Raut can hold a line of outposts despite shortages of troops and supplies, but regards the population as another flow to be sorted and detained."
 KRL_winter_crown: "Winter Crown"
 KRL_winter_crown_desc: "Karel knows the value of patience, a fortified depot and the loyalty of clans whose lands are cut off by snow for months."
 HON_first_citizen: "First Citizen"
 HON_first_citizen_desc: "Woke turns disputes between councils into lasting decisions and takes personal responsibility for carrying out the agreed programme."
 SKN_iron_marshal: "Iron Marshal"
 SKN_iron_marshal_desc: "Skad demands precise plans from his headquarters and the resources to carry them out from his country, even when military discipline holds up civilian decisions."
 VES_warden_of_western_gates: "Warden of the Western Gates"
 VES_warden_of_western_gates_desc: "Vest personally tours the outposts and insists that every road have a reserve depot and a prepared position."
 MON_emperor_of_the_northern_marches: "Emperor of the Northern Marches"
 MON_emperor_of_the_northern_marches_desc: "Marius combines the personal authority of a victor with control over headquarters and court. His decisions are swift, and dissent can easily be branded a betrayal of the empire's shared destiny."
 KDR_keeper_of_caravan_law: "Keeper of the Sun Road"
 KDR_keeper_of_caravan_law_desc: "Rashid turns reverence for the sun and the road into a discipline that unites scattered caravans."
 RHM_first_voice_of_cisterns: "First Voice of the Circle"
 RHM_first_voice_of_cisterns_desc: "Faris seeks decisions that leave no city without representation or access to common reserves."
 SDR_marshal_of_the_dry_bed: "Senior Warden of the Riverbed"
 SDR_marshal_of_the_dry_bed_desc: "Hamid swiftly changes patrol and supply routes when the old roads disappear beneath the sand."
 MZR_stewards_of_common_wells: "Stewards of the Common Wells"
 MZR_stewards_of_common_wells_desc: "The assembly judges decisions by the number of settlements supplied, the cost of delivery and the reserves preserved."
 KYZ_voice_of_the_communes: "Voice of the Communities"
 KYZ_voice_of_the_communes_desc: "The assembly's representative may speak for Keyzan, but cannot issue orders to its communities without their open consent."
 SHL_mediator_of_nine_furnaces: "First Mediator of the Conclave"
 SHL_mediator_of_nine_furnaces_desc: "Jalil prevents the rivalry between houses from stopping the furnaces while their common wealth continues to grow."
 GLP_broker_of_glass_ports: "Chamber Chairman"
 GLP_broker_of_glass_ports_desc: "Miran reconciles the interests of the ports and major trading companies."
 AZH_warden_of_the_black_basin: "Head of the Directorate"
 AZH_warden_of_the_black_basin_desc: "Samir demands troops and supplies from every district under a single state plan."
 WEF_mayor_of_the_last_bridge: "Reconstruction Coordinator"
 WEF_mayor_of_the_last_bridge_desc: "Elina directs limited resources to places where repairing a road or bridge will bring the greatest shared benefit."
