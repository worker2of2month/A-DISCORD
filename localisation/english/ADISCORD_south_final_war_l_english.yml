 ADISCORD_south_final_war_category: "War for the South"
 ADISCORD_south_final_war_category_desc: "§YSOUTHERN CRISIS§!\nShahrabad's rival: [ADISCORDSouthNorthSide].\n\n[ADISCORDSouthStatus]"
 ADISCORD_south_north_side_nam: "§YSvetlogorye§!"
 ADISCORD_south_north_side_efl: "§YEflor's Restitution Alliance§!"
 ADISCORD_south_north_side_azh: "§YAzhar§!"
 ADISCORD_south_north_side_unknown: "§Rnone§!"
 ADISCORD_south_north_side_nam_plain: "Svetlogorye"
 ADISCORD_south_north_side_efl_plain: "Eflor's Restitution Alliance"
 ADISCORD_south_north_side_azh_plain: "Azhar"
 ADISCORD_south_north_side_unknown_plain: "no one"
 ADISCORD_south_status_crisis: "§YSOUTHERN CRISIS§!\nThe warning begins from §Y2165§! once both sides complete their key focuses.\n\n[ADISCORDSouthShlReadiness]\n\n[ADISCORDSouthNorthReadiness]"
 ADISCORD_south_status_war: "§RWAR FOR THE SOUTH§!\nThe war has no deadline and cannot end in a draw. Only the capitulation of one side's champion decides the outcome.\n\n[ADISCORDSouthStrain]"
 ADISCORD_south_status_no_rival: "Shahrabad has no northern rival left. At the end of the next furnace cycle it will be recognised as suzerain of the south."
 ADISCORD_south_status_closed: "The crisis opens once Svetlogorye's resource war has an outcome."

 ADISCORD_south_join_shl_tt: "The country joins the §YUnion of Furnaces§! or fights on its side until the final settlement."
 ADISCORD_south_join_north_tt: "The country fights on the side of [ADISCORDSouthNorthSide] until the final settlement."

 ADISCORD_south_shl_house_contracts: "House Mercenary Contracts"
 ADISCORD_south_shl_house_contracts_desc: "The houses finance the war as a deal: companies are hired against the revenue of future oil, and losses are charged to the account of victory."
 ADISCORD_south_shl_city_levies: "City Levies"
 ADISCORD_south_shl_city_levies_desc: "Every city of the Southern Compact fields its own levy. They stubbornly hold land they consider their own."
 ADISCORD_south_shl_last_pour: "The Last Pour"
 ADISCORD_south_shl_last_pour_desc: "Nur's Directorate turns every furnace to the front. The factories run without rest, and the patience of the quarters is spent as quickly as raw material."
 ADISCORD_south_shl_promised_fiefs: "Promised Fiefs"
 ADISCORD_south_shl_promised_fiefs_desc: "The regent hands out Svetlogorye's future holdings before they are taken. House guards fight for their share, and the state pays in obligations."
 ADISCORD_south_shl_oil_uprising: "The Oil Workers' Rising"
 ADISCORD_south_shl_oil_uprising_desc: "Shift councils call to the oil workers beyond the front. The commune fights not for a new border, but against the namestnik ladder itself."
 ADISCORD_south_shl_campaign_repelled: "Failed Campaign"
 ADISCORD_south_shl_campaign_repelled_desc: "The Restitution Alliance has held Svetlogorye's former lands. Shahrabad counts its losses and prepares another campaign."
 ADISCORD_south_nam_emergency_writs: "Emergency Writs"
 ADISCORD_south_nam_emergency_writs_desc: "Namestniks may mobilise districts without the usual approvals. The ladder of signatures works faster, but every order costs the centre political weight."
 ADISCORD_south_nam_charter_levies: "Charter against the Cartel"
 ADISCORD_south_nam_charter_levies_desc: "The charter districts defend their own oil fields. Svetlogorye promises its neighbours fuel and self-government instead of a suzerain's seal."
 ADISCORD_south_restitution_line: "Restitution Line"
 ADISCORD_south_restitution_line_desc: "Eflor and Azhar hold Svetlogorye's former lands. They can repel a campaign, but cannot offer the south a common order."

 ADISCORD_south.1.t: "The South Cannot Be Shared"
 ADISCORD_south.1.d_shl_houses: "The Conclave of Ten has counted the price of oil and decided it is cheaper to take the fields than to buy from the namestniks. The houses open their treasuries to mercenary companies, Veyr insures military cargo, and every victory is already written into the debt books.\n\nThis is a war for raw fuel for the furnaces. If it succeeds, Svetlogorye will remain on the map - as a concession working for the houses."
 ADISCORD_south.1.d_shl_cities: "The Council of Cities declares war not on Svetlogorye, but on the namestnik ladder. The Southern Compact promises the districts beyond the front the same charter that Khazar and Keyzan received.\n\nThe city levies march out of their quarters. Every occupied district must become a new member of the compact, not a new province."
 ADISCORD_south.1.d_shl_directorate: "Nur's Directorate no longer negotiates. Military orders have displaced civilian revenue, and the furnaces work for the front without pause.\n\nThe iron march heads for the oil belt. The Directorate promises the south one order, one budget and one administrator."
 ADISCORD_south.1.d_shl_regency: "Regent Darius Safir has gathered the house guards under one banner. Svetlogorye's future holdings are already divided on paper, and every house knows which share its companies fight for.\n\nThe War of Crests promises the houses land, and the state debts it will have to pay after victory."
 ADISCORD_south.1.d_shl_commune: "The shift councils send across the front not only levies, but leaflets. Svetlogorye's oil workers serve the same ladder of seals from which the commune freed Shahrabad's furnaces.\n\nThe Commune of Fire calls on them to rise. This war must end not with a new border, but with the fall of the namestnik system."
 ADISCORD_south.1.d_shl_conclave: "The Conclave of Nine never agreed on a new order, but the oil embargo would not wait. Houses, cities and the Directorate argue over the war's aims after it has already begun.\n\nShahrabad enters the War for the South without a single course. The armies will decide."
 ADISCORD_south.1.d_nam_namestniks: "The namestnik ladder demands of the furnaces what it demands of every Svetlogorye district: a report, a seal and the right to halt a decision. Shahrabad has refused.\n\nEmergency writs mobilise the districts. If the furnaces fall, their masters will become one more rung of the ladder."
 ADISCORD_south.1.d_nam_charter: "The Oil Charter promised its neighbours fuel, self-government and protection. Shahrabad's furnaces offer a different order - buyouts, debt and monopoly.\n\nSvetlogorye fights not for a seal over the furnaces, but so that a single agreement remains in the south. The charter districts defend their own oil fields."
 ADISCORD_south.1.d_nam_directorate: "Svetlogorye did not have time to choose its own course after the resource war, but the deserts will wait no longer. The chancellery puts the districts on a war footing.\n\nOnly one suzerain will remain in the south."
 ADISCORD_south.1.d_restitution: "Shahrabad marches on the lands Eflor and Azhar took from Svetlogorye. The Restitution Alliance can hold them, but has no plan for the whole south.\n\nThis is a war not for dominance, but for survival. If the line holds, the furnaces will withdraw - until the next campaign."
 ADISCORD_south.1.a: "The south will be one."

 ADISCORD_south.2.t: "War for the South"
 ADISCORD_south.2.d_nam: "Svetlogorye and Shahrabad are at open war. The oil belt and the furnace district can no longer coexist: each claimant demands that the south accept its order.\n\nThe desert states cannot stand aside. Kadir, Rakhma, Sardan, Mazar, Keyzan and Veyr choose sides, because the only route between the fronts runs through their roads and wells."
 ADISCORD_south.2.d_restitution: "Shahrabad has marched on Svetlogorye's former lands held by Eflor and Azhar. The Restitution Alliance does not claim the whole south, but will not surrender the oil belt to the furnaces either.\n\nThe desert states choose sides. There are no neutral roads left."
 ADISCORD_south.2.a: "The desert is a front again."

 ADISCORD_south.3.t: "A Shadow over the Desert"
 ADISCORD_south.3.d: "Caravans travel under guard more and more often, and prices for fuel and metal rise faster than clerks can record them. Svetlogorye and Shahrabad exchange notes on duties, embargoes and rights of passage.\n\nThe desert capitals no longer ask whether there will be a War for the South. They ask on whose side they will have to fight."
 ADISCORD_south.3.a: "Time is running out."

 ADISCORD_south.10.t: "The South Demands an Answer"
 ADISCORD_south.10.d: "The War for the South has begun. Our roads, wells and stations lie between the armies of two claimants, and neither will let us stand aside.\n\nThe Union of Furnaces promises a share in Shahrabad's victory. The northern camp led by [ADISCORDSouthNorthSidePlain] demands the same. Whoever wins, the south will be one after the war. It remains to decide on whose side we meet that peace."
 ADISCORD_south.10.a: "Stand with Shahrabad."
 ADISCORD_south.10.b: "Stand with the northern camp."

 ADISCORD_south.31.t_shl: "The South under Shahrabad's Furnaces"
 ADISCORD_south.31.t_nam: "The South under Svetlogorye's Seal"
 ADISCORD_south.31.d_shl_unopposed: "Neither Svetlogorye nor the states that held its lands remain in the north. Shahrabad is recognised as suzerain of the south without a final war: the furnaces are the only power left that can speak for the deserts.\n\nNeighbours send delegations to Khazar. Now they will learn what order Shahrabad offers the south."
 ADISCORD_south.31.d_shl_houses: "The War for the South has ended in victory for the Conclave of Ten. The northern rival remains on the map as a house oil concession: its fields work for Shahrabad's treasuries, and its neighbours become the cartel's debtors and clients.\n\nThe Golden Gates are open to the whole south - at a price set by the houses."
 ADISCORD_south.31.d_shl_cities: "The Southern Compact's victory ended not in annexation, but in charters. The defeated kept their own administrations and became members of the compact under Shahrabad's protection.\n\nThe Council of Cities promises that the south will be a union of self-governing communities. It will soon be clear whether that union survives peacetime."
 ADISCORD_south.31.d_shl_directorate: "Nur's Directorate has won the War for the South and annexed the defeated. The oil belt, the road stations and the desert wells now answer to Shahrabad's single budget.\n\nThe iron march is over. The long work of governing lands that never asked for this order begins."
 ADISCORD_south.31.d_shl_regency: "The house regency has won the War of Crests. The defeated states are annexed, and their lands are already promised to the houses as future fiefs.\n\nThe hereditary republic has become mistress of the south. Now it must pay the obligations that helped it win."
 ADISCORD_south.31.d_shl_commune: "The Commune of Fire has won. Svetlogorye's namestnik system is destroyed, the oil fields are handed to the shift councils, and the risen districts have joined the common commune.\n\nFrom Khazar to the oil belt, the south is governed for the first time by those who work at the furnaces and wells."
 ADISCORD_south.31.d_shl_conclave: "Shahrabad has become the sole suzerain of the south. The Conclave of Nine annexed the defeated without deciding who will hold power over the new state.\n\nThe dispute over Shahrabad's future now concerns the whole south."
 ADISCORD_south.31.d_nam_namestniks: "Svetlogorye has won the War for the South. Shahrabad and its allies have become namestnik offices: every furnace, every well and every station now reports to the ladder of seals.\n\nThe namestnik system once imposed by the empire has become the order of the whole south."
 ADISCORD_south.31.d_nam_charter: "The Oil Charter has won. Shahrabad and its allies keep their own administrations, but join the charter under Svetlogorye's protection and depend on its fuel.\n\nNeighbours who were recently at war now sign one agreement."
 ADISCORD_south.31.d_nam_directorate: "Svetlogorye has won the War for the South. The defeated have become its satellites, and the oil belt the centre of a new southern order.\n\nWhat that order will be has yet to be decided."
 ADISCORD_south.31.a: "The south has a suzerain."

 ADISCORD_south.32.t: "The Restitution Line Holds"
 ADISCORD_south.32.d: "Shahrabad's campaign against Svetlogorye's former lands has been stopped. Eflor and Azhar have kept the oil belt, but cannot unify the south themselves.\n\nThe furnaces count their losses again. The crisis is not over, and in a year Shahrabad may march again."
 ADISCORD_south.32.a: "The war is only postponed."
 ADISCORD_south_offer_submit_accept_tt: "We become a satellite of §Y[FROM.GetName]§!."
 ADISCORD_south_offer_annex_accept_tt: "Our country joins §Y[FROM.GetName]§! together with its army."
 ADISCORD_south_offer_alliance_accept_tt: "We join the alliance of §Y[FROM.GetName]§!."
 ADISCORD_south_offer_war_refuse_tt: "§Y[FROM.GetName]§! declares war on us for full annexation."
 ADISCORD_south_offer_alliance_refuse_tt: "We stay outside the alliance. There will be no war."
 ADISCORD_south_offer_alliance_switch_accept_tt: "We leave our current alliance and join the alliance of §Y[FROM.GetName]§!. Our former allies continue without us, but this does not start a war with them."
 ADISCORD_south_offer_war_refuse_faction_tt: "§Y[FROM.GetName]§! declares war on us for full annexation. Our faction partners join that war on our side. The defeated side is annexed by the victor once its last participant capitulates."
 ADISCORD_south.40.d_alliance_switch: "[FROM.GetNameDefCap] invites us to change alliances. Its envoys promise protection, profitable trade and a place in the south's future order if we leave our present allies and stand beside them.\n\nRefusal will not lead to war now: we remain in our current alliance. But when the War for the South begins, we will have to choose a side anyway."
 ADISCORD_south.40.t_submit: "A Demand for Submission"
 ADISCORD_south.40.t_annex: "A Demand for Union"
 ADISCORD_south.40.t_alliance: "An Invitation to Alliance"
 ADISCORD_south.40.d_submit_shl: "Shahrabad's envoys have brought not a note but a bill. The houses list debts, tolls and rights they consider their own, and offer a simple way out: our country becomes their satellite, and trade runs through the Golden Gates.\n\nRefusal means war. The furnaces' armies already stand by our roads."
 ADISCORD_south.40.d_submit_shl_charter: "Shahrabad's Council of Cities offers us a Southern Compact charter. We keep our own administration, but the road stations and foreign policy pass under the compact's protection.\n\nThe compact does not hide that refusal will not be accepted. Its levies are ready to free the road by force."
 ADISCORD_south.40.d_submit_nam_namestnik: "An official has arrived from Svetlogorye with a seal and a ready decree appointing a namestnik. Our administration stays in place, but every decision it makes will climb the ladder of signatures.\n\nThe Svetlogorsk chancellery calls refusal a rebellion. Its army is ready to suppress it."
 ADISCORD_south.40.d_submit_nam_charter: "Svetlogorye invites us into the Oil Charter: fuel at an agreed price, our own administration and the alliance's protection in exchange for a common foreign policy.\n\nThe offer comes with troops at the border. The charter considers refusal a threat to all its members."
 ADISCORD_south.40.d_annex: "Shahrabad no longer offers alliances or protectorates. Nur's Directorate demands that our country join it: our administration becomes part of a single budget, our army part of its army.\n\nIf we refuse, the iron march will pass through our lands."
 ADISCORD_south.40.d_alliance_shl: "Shahrabad invites us into its alliance. Membership promises the protection of the furnaces and a share in the south's future order, but it will draw us into the war that must come between Shahrabad and Svetlogorye.\n\nRefusal will not lead to war now. But when that war begins, we will have to choose a side anyway."
 ADISCORD_south.40.d_alliance_nam: "Svetlogorye invites us into its alliance. The Oil Charter promises fuel, protection and the right to manage our own affairs, but its members will march with Svetlogorye in the War for the South.\n\nRefusal will not lead to war now. But when that war begins, we will have to choose a side anyway."
 ADISCORD_south.40.a: "Accept."
 ADISCORD_south.40.b: "Refuse."
 ADISCORD_south.42.t: "Our Terms Are Accepted"
 ADISCORD_south.42.d: "[FROM.GetNameDefCap] accepts our offer. Another part of the south will stand on our side when the last war begins."
 ADISCORD_south.42.a: "The south gathers around us."
 ADISCORD_south.43.t: "Our Terms Are Rejected"
 ADISCORD_south.43.d:0 "[FROM.GetNameDefCap] rejects our offer. If we demanded submission or union, the army has already received its orders. If we offered an alliance, the War for the South will settle the question."
 ADISCORD_south.43.a: "They will regret their choice."
 ADISCORD_south.44.t: "The Underground Loses Its Footing"
 ADISCORD_south.44.d: "Svetlogorye has signed a compact with its districts, and the workers no longer want an uprising. Yaroslav Weber's underground has returned part of the weapons the commune carried across the desert.\n\nThe War for the South will begin without a rising behind enemy lines."
 ADISCORD_south.44.a: "Then we will free them ourselves."
 ADISCORD_south.45.t: "Uprising in Svetlogorye"
 ADISCORD_south.45.d: "On the first day of the War for the South, the oil workers of the Svetlogorsk District rose in revolt. Yaroslav Weber led the underground out of the workers' quarters with rifles smuggled in by Shahrabad's commune.\n\nSvetlogorye must fight on two fronts: against the furnaces in the south and against its own oil fields behind the lines."
 ADISCORD_south.45.a: "The fire has reached the wells."
 ADISCORD_south_status_resolved: "The war for the South is over. The region has one suzerain."

 ADISCORD_south_preparation: "Final preparations for the War for the South"
 ADISCORD_south_preparation_desc: "Headquarters finish deployment, ambassadors wind down negotiations, and border garrisons receive sealed orders."
 ADISCORD_south_preparation_ready_tt: "The year is 2165 or later; both sides have completed their key preparation focuses. The War for the South category lists the requirements and each side's readiness."
 ADISCORD_south_status_return: "§YSVETLOGORYE RETURNS§!\nThe shared southern campaign and new submission demands wait for the return and further exile campaign. Preparation for the shared war resumes after that campaign ends."
 ADISCORD_south_status_preparation: "§YPREPARATION FOR THE WAR FOR THE SOUTH§!\nWar becomes possible from §Y2165§! after both sides complete their key focuses. A §Y56§!-day deployment warning follows. Unfinished preparation postpones the war.\n\n[ADISCORDSouthShlReadiness]\n\n[ADISCORDSouthNorthReadiness]\n\nReadiness is checked every 28 days. An offensive focus can be completed during the warning; its declaration waits for the shared deadline."
 ADISCORD_south.40.closed: "The circumstances of these negotiations must be reassessed."
 ADISCORD_south.32.d_nam: "Svetlogorye and Shahrabad end their campaign without a decisive advantage. Neither side has secured enough of the key districts to claim the South.\n\nThe armies return behind the prewar lines. Peace establishes no hegemon and transfers no defeated territory. Both sides gain time to rebuild before another confrontation."

 ADISCORD_south_story_ready_tt: "The exile campaign is complete: victory in the return, followed by victory in the great war or no remaining opponents."

 ADISCORD_south_warning_elapsed_tt: "56 days have passed since the war warning."

 ADISCORD_south_warning_notice_tt: "The War for the South can begin in 56 days. Its countdown is shown in the decisions category. A completed offensive focus issues its order after 56 days; without orders, the automatic attack waits another 28 days."

 ADISCORD_south_status_warning: "§RWAR WARNING§!\nBoth sides have completed preparation. All declarations remain blocked until the §Y56§!-day warning ends. The mission shows the time remaining. The attack can then begin on the next furnace cycle; ongoing wars and unfinished return campaigns still block it. A completed offensive focus issues its order after 56 days; without orders, the automatic attack waits another 28 days."

 ADISCORD_south_shl_ready: "§GShahrabad is ready.§! Its key industrial and army focuses are complete."

 ADISCORD_south_shl_pending: "§YShahrabad is preparing.§! All three focuses are required: $SHL_conclave_rules$, $SHL_metal_market$ and $SHL_conclave_army$. Any political course remains available."

 ADISCORD_south_north_ready: "§GThe northern side is ready.§! Svetlogorye has completed its route's focuses; Eflor or Azhar requires a settled resource war."

 ADISCORD_south_north_pending:0 "§YSvetlogorye is preparing.§!\n- Resource war victory: $NAM_svetlogorye$, $NAM_oil_exchange$, $NAM_pw_transport_commission$, $NAM_pw_southern_army$ and $NAM_pw_freight_schedule$. The capstones require selected army and transport courses, an operational supply hub and material reserves.\n- Etatists also need $NAM_ladder_of_seals$ and $NAM_south_desert_offices$.\n- Humanists also need $NAM_common_fuel_market$ and $NAM_south_fenn_guarantee$.\n- Pragmatists also need $NAM_balanced_accounts$ and $NAM_prag_partner_supply$.\n- Compromise: $NAM_defeat_rump_cabinet$, $NAM_defeat_harbour_economy$ and $NAM_defeat_road_south$.\n- Revenge: $NAM_defeat_revenge$ and $NAM_defeat_second_chapter$.\n- Exile: $NAM_rad_great_war_plan$, $NAM_hum_union_call$ or $NAM_board_stock_mobilisation$; return wars must end.\n- Cancelled resource war: $NAM_seal_courts$, $NAM_civilian_combine$ and $NAM_officer_courses$."
 ADISCORD_south_offensive_policy_tt:0 "The country's political course permits a southern offensive."
 autonomy_NAM_economic_contract:0 "Economic Treaty Member"
 ADISCORD_south_nam_contract_logistics:0 "Contract Logistics"
 ADISCORD_south_nam_contract_logistics_desc:0 "Settlement obligations coordinate the harbour, transport companies and campaign supply offices."
 ADISCORD_south.1.d_nam_contracts:0 "Svetlogorsk's council declared that letters alone can no longer protect southern obligations. Trade routes, collateral and supplies depend on a government that does not consider itself bound by the contracts it signed. Military preparations have become public policy.\n\nThe government speaks of orderly settlements while headquarters marks crossings and warehouses on its maps. After victory, new members will retain their administrations and armies but accept common economic terms and responsibility for the treaty's security."
 ADISCORD_south.31.d_nam_contracts:0 "The southern campaign has ended with economic treaties under Svetlogorsk's primacy. Local administrations remain in office and armies retain their own headquarters. New commissions allocate civilian orders and establish the victor's trading rights.\n\nSvetlogorye calls the arrangement a community of obligations. Members retain their states, though they no longer choose their side independently in the next major war."
 ADISCORD_south.40.t_contract:0 "A Settlement Treaty Offer"
 ADISCORD_south.40.d_contract:0 "Svetlogorsk's envoys offer to include our country in a common settlement system. They do not demand the dissolution of our government or the transfer of our army to foreign commanders. The treaty instead defines economic obligations to Svetlogorye and a common side in the southern confrontation.\n\nThe council allows us to refuse without war over this answer. Signing nevertheless creates real dependency: foreign policy becomes part of the common treaty, and our previous alliance must be left before the new terms take effect."
 ADISCORD_south_offer_contract_accept_tt:0 "We become a dependent economic treaty member under Svetlogorye. We retain our government and army, transfer 15% of civilian factories, and grant +60% extra trade and -20% overlord trade cost. No manpower or military factories are transferred. We leave our previous alliance and must support Svetlogorye's side in the southern war."
 ADISCORD_south_offer_contract_refuse_tt:0 "The treaty will not be signed. Refusal starts no war and leaves our current alliance intact."
 ADISCORD_south.43.d_contract:0 "[FROM.GetNameDefCap] declines the economic compact. The envoys return the unsigned draft; trading houses will continue working under their existing agreements. This refusal will not be followed by a military order."
 ADISCORD_south_preparation_timeout_tt:0 "The warning period expires. If the war conditions still hold, the next check executes Svetlogorye's prepared order first, otherwise Shahrabad's order.\nWithout an order, Shahrabad starts the war after §Y84§! £time_texticon days from the warning. Checks occur every §Y28§! £time_texticon days.\nBoth sides must remain ready, offensive policy must permit the attack, and the southern crisis must still be active. Cancelling the warning grants no reward and imposes no penalty."
 ADISCORD_south_strain_none:0 ""
 ADISCORD_south_strain_low:0 "Cost of the war: §Y[?ADISCORD_south_war_strain|0]§!/100 - the home front holds."
 ADISCORD_south_strain_mid:0 "Cost of the war: §Y[?ADISCORD_south_war_strain|0]§!/100 - §Ythe quarters are tiring of the war.§!"
 ADISCORD_south_strain_high:0 "Cost of the war: §R[?ADISCORD_south_war_strain|0]§!/100 - §Rthe home front is on the edge; there will be serious consequences.§!"
 ADISCORD_south_strain_crisis:0 "Cost of the war: §R[?ADISCORD_south_war_strain|0]§!/100 - §Rthe home front is giving way.§!"
 ADISCORD_south_war_strain_dynamic:0 "Cost of the War"
 ADISCORD_south_district_order:0 "Order: Take [FROM.GetName]"
 ADISCORD_south_district_order_desc:0 "Staff officers spread the district map across the table and draw arrows to its stations and crossroads. The order will go to the troops with a date that no one may move."
 ADISCORD_south_cost_district_order:0 "§Y50§! £political_power_texticon §Y25§! £command_power_texticon"
 ADISCORD_south_cost_district_order_blocked:0 "§R50§! £political_power_texticon §R25§! £command_power_texticon"
 ADISCORD_south_cost_district_order_tooltip:0 "§Y50§! £political_power_texticon §Y25§! £command_power_texticon"
 ADISCORD_south_order_slot_free_tt:0 "No district order is in force"
 ADISCORD_south_district_order_mission:0 "Order: Take [?ADISCORD_south_order_state.GetName]"
 ADISCORD_south_district_order_mission_desc:0 "Couriers have carried the order to every divisional staff. Each evening the staff marks on the map how far the columns have come, and each evening the deadline is one day closer."
 ADISCORD_south_order_taken_tt:0 "Our side controls §Y[?ADISCORD_south_order_state.GetName]§!"
 ADISCORD_south_order_success_strain_tt:0 "Cost of the war: §G-8§!"
 ADISCORD_south_order_failure_strain_tt:0 "Cost of the war: §R+4§!"
 ADISCORD_south_campaign_over_tt:0 "The War for the South is over"
 ADISCORD_south_hold_districts:0 "Hold the Districts"
 ADISCORD_south_hold_districts_desc:0 "Every key district our side still holds means stations, depots and thousands of people watching whether the front will stand. The staff asks one thing of the garrisons: give up not a single street."
 ADISCORD_south_hold_next_tt:0 "While the war continues, a new holding period begins within §Y28§! £time_texticon days."
 ADISCORD_south_hold_all_tt:0 "The enemy holds none of our key districts"
 ADISCORD_south_hold_one_lost_tt:0 "The enemy holds one of our key districts"
 ADISCORD_south_hold_all_strain_tt:0 "Cost of the war: §G-6§!"
 ADISCORD_south_order_failed:0 "Failed Order"
 ADISCORD_south_order_failed_desc:0 "The columns did not reach the ordered district in time. The staff is looking for someone to blame, and in the trenches men already say that the orders are written by people who have never seen the front."
 ADISCORD_south_crisis_crackdown_strain_tt:0 "Cost of the war: §G-25§!"
 ADISCORD_south_crisis_stores_strain_tt:0 "Cost of the war: §G-35§!"
 ADISCORD_south.50.t:0 "The Home Front Gives Way"
 ADISCORD_south.50.d_shl:0 "This morning the smelters' quarters did not come to the furnaces. Workers' wives stand at the foundry gates holding death notices, and the guard does not dare to disperse them. In the barracks men whisper that the next column north will be made of them.\n\nThe houses demand an answer from the conclave by evening: order or bread."
 ADISCORD_south.50.d_north:0 "The queue at the ration point stretched over three blocks and by noon had turned into a crowd. On the oil fields the pumps have stopped: the crews refuse to work until someone tells them when the war will end.\n\nThe district namestniks send telegram after telegram to the capital, asking which of them the troops will support."
 ADISCORD_south.50.a:0 "Send troops into the quarters."
 ADISCORD_south.50.b:0 "Open the army stores."
 ADISCORD_south_request_expedition:0 "Allied Expedition: [FROM.GetName]"
 ADISCORD_south_request_expedition_desc:0 "A courier rides to the allied court with a letter under the staff's seal. It holds no threats, only the account of the war: how many men have been given already and how many more will be needed before the enemy yields."
 ADISCORD_south_court_defector:0 "Court a Defector: [FROM.GetName]"
 ADISCORD_south_court_defector_desc:0 "A quiet offer travels to the enemy court through neutral merchants and captured officers. There they count their losses and look at a map where the front draws ever closer to their own capital."
 ADISCORD_south_cost_expedition:0 "§Y50§! £political_power_texticon §Y120§! £ADISCORD_economy_treasury_texticon"
 ADISCORD_south_cost_expedition_blocked:0 "§R50§! £political_power_texticon §R120§! £ADISCORD_economy_treasury_texticon"
 ADISCORD_south_cost_expedition_tooltip:0 "§Y50§! £political_power_texticon §Y120§! £ADISCORD_economy_treasury_texticon\nThe price is refunded if the ally refuses or does not answer."
 ADISCORD_south_cost_defector:0 "§Y80§! £political_power_texticon"
 ADISCORD_south_cost_defector_blocked:0 "§R80§! £political_power_texticon"
 ADISCORD_south_cost_defector_tooltip:0 "§Y80§! £political_power_texticon\nThe price is refunded if the offer is refused or left unanswered."
 ADISCORD_south_request_slot_free_tt:0 "The previous request has been answered"
 ADISCORD_south_ally_can_send_tt:0 "The ally has §Y9000§! £manpower_texticon and §Y1500§! £infantry_equipment_texticon"
 ADISCORD_south_defector_wavering_tt:0 "Our side controls its capital, or its war support is below §Y30%§! (§Y40%§! after a hard line in the desert)"
 ADISCORD_south_expedition_request_tt:0 "The ally receives the request. If it agrees, it gives §Y3000§! £manpower_texticon and §Y500§! £infantry_equipment_texticon per division, and §Y2§! \"Desert Expedition\" divisions form at our capital (§Y3§! after the focus supporting the desert). They arrive with the ally's men and rifles; our stockpile supplies the rest of their equipment and reinforcements.\nOn refusal or without an answer the price is refunded."
 ADISCORD_south_defector_request_tt:0 "The enemy receives the offer. If it agrees, it makes peace with our side and joins our war against its former leader. The main war goes on.\nOn refusal or without an answer the price is refunded."
 ADISCORD_south_expedition_refuse_tt:0 "Our men and rifles stay at home. The requesting side gets its price back."
 ADISCORD_south_expedition_send_tt:0 "We give §R3000§! £manpower_texticon and §R500§! £infantry_equipment_texticon for each expedition division, §Y2§! or §Y3§! of them."
 ADISCORD_south_defector_refuse_tt:0 "We stay in our current alliance."
 ADISCORD_south_defector_accept_tt:0 "We make peace with the side led by [FROM.GetName], leave our current alliance and join the war against our former leader."
 ADISCORD_south.60.t:0 "A Request for Troops"
 ADISCORD_south.60.d:0 "The envoy of [FROM.GetNameDef] has brought a letter under the staff's seal. The ally asks neither for money nor for fuel, but for men: battalions to stand beside its columns on the main front. Our commanders argue until midnight. Some say the ally will not hold the line without this help; others count how many families will be left without their sons."
 ADISCORD_south.60.a:0 "Our men are needed at home."
 ADISCORD_south.60.b:0 "Raise the expedition."
 ADISCORD_south.61.t:0 "The Expedition Arrives"
 ADISCORD_south.61.d:0 "The columns of [FROM.GetNameDef] enter our capital at dawn. Soldiers in dusty greatcoats carry their own banners, and their officers ask first of all where the staff is and where to go next."
 ADISCORD_south.61.a:0 "There is a place for them at the front."
 ADISCORD_south.62.t:0 "No Expedition"
 ADISCORD_south.62.d:0 "The courier returns with a polite letter. [FROM.GetNameDefCap] regrets that it cannot spare the men: its own borders, its own losses, its own mothers at the gates. The treasurers silently return the deposit to the chests."
 ADISCORD_south.62.a:0 "We will manage ourselves."
 ADISCORD_south.63.t:0 "A Secret Offer"
 ADISCORD_south.63.d:0 "Through a captured officer an offer has come from [FROM.GetNameDef]: peace for us if we turn our guns against our former ally. No one in the council hall says the word \"treason\" aloud. Everyone looks at the map, at the front line by our gates and at the empty seats around the table."
 ADISCORD_south.63.a:0 "We will not betray the alliance."
 ADISCORD_south.63.b:0 "Accept peace and change sides."
 ADISCORD_south.64.t:0 "The Defector"
 ADISCORD_south.64.d:0 "[FROM.GetNameDefCap] recalls its envoys from the enemy staff and opens the roads through its land to us. Yesterday's enemy is not yet a friend, but its columns already face the other way."
 ADISCORD_south.64.a:0 "The enemy is one country smaller."
 ADISCORD_south.65.t:0 "The Offer Is Refused"
 ADISCORD_south.65.d:0 "The captured officer comes back without an answer, and a week later his name appears among the executed. [FROM.GetNameDefCap] holds to its old alliance, and the talk of peace will have to be held another way."
 ADISCORD_south.65.a:0 "Then the front will decide."
