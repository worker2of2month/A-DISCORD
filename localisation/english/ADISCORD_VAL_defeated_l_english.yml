l_english:
 VAL_defeat_Returning_Columns:0 "The Columns Return"
 VAL_defeat_Returning_Columns_desc:0 "The operation ended not in a favorable contract but in retreat. Kefreyt must first account for the men, equipment, and confidence that did not return."
 VAL_defeat_Commanders_Take_The_Ledger:0 "The Commanders Take the Ledger"
 VAL_defeat_Commanders_Take_The_Ledger_desc:0 "With Solgalov's cabinet gone, the Council of Commanders takes control of army books, depots, and state accounts. Its first task is preventing a defeated state from coming apart."
 VAL_defeat_Count_The_Remaining_Rifles:0 "Count the Remaining Rifles"
 VAL_defeat_Count_The_Remaining_Rifles_desc:0 "Paper formations matter less than weapons that still exist, barrels that can be repaired, and companies that can still hold a line."
 VAL_defeat_Reopen_The_Depots:0 "Reopen the Surviving Depots"
 VAL_defeat_Reopen_The_Depots_desc:0 "Reserves once saved for another expedition must now sustain factories, railways, and garrisons at home."
 VAL_defeat_Articles_Of_Command:0 "Articles of Command"
 VAL_defeat_Articles_Of_Command_desc:0 "The council cannot become a collection of competing staffs. Authority over supply, reserves, and appointments will be written down as precisely as any contract."
 VAL_defeat_No_Second_Expedition:0 "There Will Be No Second Expedition"
 VAL_defeat_No_Second_Expedition_desc:0 "Repeating the offensive merely because the army knows how to attack would repeat the defeat. The western border closes to new adventures while Kefreyt recovers."
 VAL_defeat_Field_Hospitals_First:0 "Field Hospitals First"
 VAL_defeat_Field_Hospitals_First_desc:0 "Doctors and evacuation teams take priority over new offensive staffs. Kefreyt is too small to treat casualties as another contractual expense."
 VAL_defeat_Bring_The_Captains_Home:0 "Bring the Captains Home"
 VAL_defeat_Bring_The_Captains_Home_desc:0 "Experienced officers are needed in garrisons, schools, and depots rather than on foreign passes. The council gathers the surviving cadre back into one system."
 VAL_defeat_Contracts_Without_Conquest:0 "Contracts Without Conquest"
 VAL_defeat_Contracts_Without_Conquest_desc:0 "Kefreyt will remain a contract state, but a contract no longer has to end with columns crossing someone else's border. Exports, production, and paid services must again cost less than occupation."
