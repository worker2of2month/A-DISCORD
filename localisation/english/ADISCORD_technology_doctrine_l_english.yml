 ADISCORD_line_artillery_desc: "A full artillery battalion for divisional firepower; substantially more expensive and supply-heavy than a support battery."
 ADISCORD_metallurgical_complex: "Metallurgical Complex"
 ADISCORD_metallurgical_complex_plural: "Metallurgical Complexes"
 ADISCORD_metallurgical_complex_desc: "A heavy combine turning poor and reclaimed feedstock into steel. Extremely expensive, slot-consuming, and burdensome to the regional power grid and construction sector. Only one heavy resource complex is allowed per state."
 ADISCORD_electrolysis_complex: "Electrolysis Complex"
 ADISCORD_electrolysis_complex_plural: "Electrolysis Complexes"
 ADISCORD_electrolysis_complex_desc: "An energy-intensive ore enrichment and electrolysis chain for aluminium production. It buys strategic autonomy with immense construction cost, a state slot, and a substantial regional burden."
 ADISCORD_strategic_mining_complex: "Strategic Mining Complex"
 ADISCORD_strategic_mining_complex_plural: "Strategic Mining Complexes"
 ADISCORD_strategic_mining_complex_desc: "Deep shafts, chemical leaching, and automated sorting lines for tungsten. The most expensive resource complex, reducing local construction capacity, power balance, and available labor."
 ADISCORD_thermal_power_complex: "Power Generation Complex"
 ADISCORD_thermal_power_complex_plural: "Power Generation Complexes"
 ADISCORD_thermal_power_complex_desc: "A large generation, storage, and distribution complex serving the regional power grid. It eases the energy shortage, but its equipment and service workforce impose a heavy local burden."
