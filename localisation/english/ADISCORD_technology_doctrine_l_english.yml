l_english:
 ADISCORD_doctrine_salvage_line_infantry_desc: "Infantry formations learn to fight with standardized salvage and repaired weapons."
 ADISCORD_doctrine_distributed_militias_desc: "Local formations hold ground while the central army restores mobility."
 ADISCORD_doctrine_emergency_replacement_system_desc: "Replacement systems push trained bodies and repaired equipment back to units quickly."
 ADISCORD_doctrine_total_restoration_front_desc: "Civil reconstruction and military mobilization become a single front."
 ADISCORD_doctrine_people_and_scrap_desc: "Mass, repair culture, and improvised equipment become an operational method."
 ADISCORD_doctrine_remote_weapon_coordination_desc: "Remote stations and vehicle sensors coordinate fire without exposing crews."
 ADISCORD_doctrine_heavy_breakthrough_columns_desc: "Heavy tanks concentrate for decisive penetration."
 ADISCORD_doctrine_drone_screened_advance_desc: "Recon drones screen armored movement and expose ambushes."
 ADISCORD_doctrine_autonomous_repair_cycles_desc: "Armored recovery vehicles return damaged tanks to combat faster."
 ADISCORD_doctrine_armored_decision_warfare_desc: "Tank forces seek a rapid operational decision before opponents can adapt."
 ADISCORD_doctrine_reconnaissance_saturation_desc: "Persistent sensors and scouts deny the enemy concealment."
 ADISCORD_doctrine_predictive_operational_planning_desc: "Staff models identify viable attacks and supply failures in advance."
 ADISCORD_doctrine_integrated_fire_control_desc: "Networked observers and support weapons compress the kill chain."
 ADISCORD_doctrine_distributed_command_cells_desc: "Small command cells preserve control when headquarters are hit."
 ADISCORD_doctrine_algorithmic_campaigning_desc: "Campaign planning accepts machine assistance as a normal staff function."
 ADISCORD_doctrine_urban_defense_grids_desc: "Cities are wired into layered local defenses."
 ADISCORD_doctrine_hardened_logistics_desc: "Supply routes use redundancy, concealment, and protected nodes."
 ADISCORD_doctrine_radiation_zone_operations_desc: "Troops train to move and fight around contaminated terrain."
 ADISCORD_doctrine_counteroffensive_reserves_desc: "Mobile reserves punish attackers once they are fixed by defenses."
 ADISCORD_doctrine_national_redoubt_protocols_desc: "The state plans for survival through encirclement, bombardment, and systemic collapse."
 ADISCORD_air_doctrine_disposable_airframes_desc: "Cheap drones absorb risk that would destroy scarce crewed aircraft."
