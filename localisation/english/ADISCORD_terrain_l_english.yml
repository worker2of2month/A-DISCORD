l_english:
 vorkernsberg: "Vorkernsberg"
 vorkernsberg_desc: "A dense urban conurbation of layered development, transport interchanges, and industrial districts. Manoeuvre is constrained while defenders can rely on the city's infrastructure."
 contaminated: "Contaminated Zone"
 contaminated_desc: "Terrain contaminated by hazardous chemical and radioactive substances. Ruined roads, the need for protective equipment, and constant exposure risks severely hinder movement, supply, and combat operations."
 water_strongest_current: "Strongest Current"
 water_strongest_current_desc: "A relentless pole-to-pole current tearing between the western and the central continent. For centuries it smashed or carried off every ship that tried the crossing, which is why the two shores never met. Fleets here struggle to keep formation and to spot the enemy, but drifting mines are swept away."
 reactor_zone: "Reactor Zone"
 reactor_zone_desc: "Once the industrial centre of Vorkerland, this region held vast factory complexes powered by a zero-point reactor. Now the ruins of the destroyed reactor loom over dead workshops. Discharges from its ruptured core have poisoned the soil, water and air so thoroughly that entering the reactor zone means instant death. Neither settlement, work nor the passage of troops is possible: the former industrial heartland has become an impassable dead land."
 desert_city: "Desert City"
 desert_city_desc: "Low, dense clay and sandstone quarters gathered around wells and markets. Open sandy approaches give attackers little cover, heat and scarce water wear down garrisons, yet the city remains a hub of caravan roads."
 hill_city: "Hill City"
 hill_city_desc: "Stone quarters climb the hillsides in terraces, and streets turn into stairways and narrow ascents. Every assault goes uphill, vehicles have no room to deploy, and defenders hold the heights above neighbouring quarters."
 fada_city: "Fada"
 fada_city_desc: "The capital of Stelander descends from the mountains to the sea: the Bronze Congress, squares and embankments are surrounded by heavy stone buildings. The capital guard holds every quarter, while broad approaches link the city with the port and the provinces."
 dopotoydron_city: "Dopotoydron City"
 dopotoydron_city_desc: "The capital of Kefreyt grew around the arms combine: workshops, warehouses and marshalling yards stretch across many blocks. Vehicles pass between the halls and stocks are well sheltered, but the vast factory roofs are easy to see from the air."
 south_harbour_city: "South Harbour"
 south_harbour_city_desc: "The port capital of the Svetlogorye Governorate on the desert shore. Quays, the lighthouse and warehouses keep supplies moving even under fire, but the low waterfront gives little cover and the heat wears down garrisons."
 svetlogorye_town: "Svetlogorye Town"
 svetlogorye_town_desc: "Low oil towns among dry hills. Quarters are scattered around the wells and pipelines, streets lie open to wind and dust, and the long roads between settlements wear out transport."
 kefreyt_city: "Kefreyt City"
 kefreyt_city_desc: "Cramped blocks of tenements where buses, lorries and crowds stand in the same jam. Vehicles have no room to deploy, and defenders hide in every courtyard and gateway."
 stelander_city: "Stelander City"
 stelander_city_desc: "The old towns of Stelander climb the slopes: stairways, terraces and narrow steep streets. Every assault goes uphill, and defenders hold the upper quarters above the attackers."
 rich_city: "Wealthy City"
 rich_city_desc: "The boulevards, arcades and stone facades of the wealthy cities of Nodrul and Stelander. Wide avenues open the front to an attack, but the massive buildings still shelter defenders from aircraft."
