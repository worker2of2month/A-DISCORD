 vorkernsberg: "Vorkernsberg"
 vorkernsberg_desc: "A dense urban conurbation of layered development, transport interchanges, and industrial districts. Manoeuvre is constrained while defenders can rely on the city's infrastructure."
 contaminated: "Contaminated Zone"
 contaminated_desc: "Terrain contaminated by hazardous chemical and radioactive substances. Ruined roads, the need for protective equipment, and constant exposure risks severely hinder movement, supply, and combat operations."
