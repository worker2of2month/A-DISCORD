 ADISCORD_economy_dashboard_simple_header: "FINANCES ARE AUTOMATIC | DECISIONS LAST 3 MONTHS"
 ADISCORD_economy.2.t: "Postwar Demobilisation Has Begun"
 ADISCORD_economy.2.d: "The war has ended, and the country is automatically returning to peacetime conditions. No separate management is required.\n\nAlready completed:\n- the emergency military budget has been reduced to its standard level;\n- total mobilisation or war economy has been reduced to partial mobilisation;\n- excessive conscription has been reduced to limited conscription.\n\nOver the next six months, workers and orders will return to the civilian economy. The base reduction in war fatigue will be §G5 points per month§! instead of 1, although recent casualties may weaken recovery in the first month. Civilian construction will accelerate, while arms production and war support temporarily decline. The exact effects appear in the war fatigue tooltip. A new war immediately halts demobilisation."
 ADISCORD_economy.2.a: "Return the country to civilian life."
 ADISCORD_economy_auto_loan_popup_title: "DEFICIT COVERED BY AN AUTOMATIC LOAN"
 ADISCORD_economy_auto_loan_popup_desc: "The treasury could not cover the weekly settlement. The state automatically borrowed [?ADISCORD_economy_auto_loan_popup_amount|1], exactly the uncovered portion of the deficit.\n\n§RThe consequences have already been applied:§! debt has risen, every 100 borrowed added 1 percentage point of inflation, and interest has been added to future expenses.\n\nDebt: [?ADISCORD_economy_debt|0]  |  Inflation: [?ADISCORD_economy_inflation|1]%\nInterest: [?ADISCORD_economy_weekly_interest|2] per week ([?ADISCORD_economy_interest_share_income|1]% of weekly income)\nPressure: [?ADISCORD_economy_debt_pressure|0]/100\n\nTo avoid further borrowing, restore a weekly surplus or maintain treasury reserves."
 ADISCORD_economy_auto_loan_popup_ok: "UNDERSTOOD"
 ADISCORD_economy_loan_blocked_ratio: "§RUnavailable:§! the interest burden is too high. Reduce the principal debt or increase income first."
 ADISCORD_economy_loan_blocked_debt_room: "§RUnavailable:§! debt pressure is too high for another manual loan."
 ADISCORD_economy_loan_blocked_external_room: "§RUnavailable:§! the current level of debt risk rules out external borrowing."
