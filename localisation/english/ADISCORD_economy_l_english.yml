 ADISCORD_economy_action_internal_bonds_tt: "§YIssue internal bonds§!\n§GImmediate:§! up to +100 treasury.\n§RCost:§! up to +115 debt and +1.0 pp inflation. Interest remains in weekly expenses until repaid.\n\n§YCurrent§!\nTreasury: [?ADISCORD_economy_treasury|0]/[?ADISCORD_economy_treasury_cap|0]\nDebt: [?ADISCORD_economy_debt|0], state [?ADISCORD_economy_debt_state|0]/4\nInterest: [?ADISCORD_economy_weekly_interest|2] per week ([?ADISCORD_economy_interest_share_income|1]% of income)\nDebt pressure: [?ADISCORD_economy_debt_pressure|0]/100  Creditworthiness: [?ADISCORD_economy_creditworthiness|0]/100\n\n[GetADISCORDInternalBondsAvailabilityLoc]"
 ADISCORD_economy_action_external_loan_tt: "§YTake an external loan§!\n§GImmediate:§! up to +150 treasury.\n§RCost:§! up to +190 debt, +1.5 pp inflation, price shock, fiscal stress, and state load. Interest remains in weekly expenses until repaid.\n\n§YCurrent§!\nTreasury: [?ADISCORD_economy_treasury|0]/[?ADISCORD_economy_treasury_cap|0]\nDebt: [?ADISCORD_economy_debt|0], state [?ADISCORD_economy_debt_state|0]/4\nInterest: [?ADISCORD_economy_weekly_interest|2] per week ([?ADISCORD_economy_interest_share_income|1]% of income)\nDebt pressure: [?ADISCORD_economy_debt_pressure|0]/100  Creditworthiness: [?ADISCORD_economy_creditworthiness|0]/100\n\n[GetADISCORDExternalLoanAvailabilityLoc]"
 ADISCORD_economy_action_repay_debt_tt: "§YRepay part of the debt§!\nSpend up to §R50§! treasury to remove the same amount of debt. This reduces fiscal stress and state load.\n\nRequires §Y50§! treasury and any outstanding debt."
 ADISCORD_economy_action_restructure_debt_tt: "§YRestructure debt§!\nWrites off about §G15%§! of current debt, but raises fiscal stress, state load, and the restructuring penalty. Interest indicators are recalculated immediately.\n\nRequires at least §Y100§! debt and a current risk signal."
 ADISCORD_economy_action_stabilization_tt: "§YStabilization package§!\nCosts §R100§! treasury and reduces inflation, fiscal stress, deficit pressure, price shock, and state load.\n\nRequires §Y100§! treasury and visible macroeconomic pressure."
 ADISCORD_economy_action_war_taxes_tt: "§YIntroduce war taxes§!\nProvides §G40–65§! treasury depending on the economic model and starts a 30-day mobilization effect. It raises state load and war fatigue.\n\nRequires an eligible model and no active war-tax effect."

