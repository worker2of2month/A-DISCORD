 ADISCORD_economy_overflow_investments: "Internal investment"
 ADISCORD_economy_overflow_investments_desc: "Cash above the treasury cap funds domestic construction. Every 10 treasury units pay for the next week of +5% construction speed. Unspent funds are retained; the program pauses when it cannot fund another week.\n\nUnspent fund: [?ADISCORD_economy_overflow_investment_fund|1]."
 ADISCORD_economy.4.t: "Reserves committed to construction"
 ADISCORD_economy.4.d: "The treasury exceeded its reserve cap. The excess has been committed to domestic investment, funding new construction work.\n\nThe Internal investment national spirit increases construction speed by 5%. Each week costs 10 treasury units from the accumulated surplus. There is no second charge to the treasury. If the fund cannot cover the next week, the program pauses until it receives more funding."
 ADISCORD_economy.4.a: "Put the reserves to work."

 ADISCORD_economy_projects:0 "Major industrial programmes"
 ADISCORD_economy_projects_desc:0 "Only one programme can run at a time. Treasury is paid at the start; three civilian factories, rare components and rare alloys remain allocated throughout the work. These are ongoing supply requirements, not one-off stockpile tokens. A shortage, loss of industrial capacity, capitulation or loss of independence cancels the order: 75% of the treasury payment is refunded and 25% is lost. Equipment and permanent benefits arrive only on full completion. Military contracts require the relevant researched equipment."
