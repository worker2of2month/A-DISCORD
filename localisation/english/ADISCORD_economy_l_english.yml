 economy_desc: "Economic mobilization determines how much of the economy is directed toward military needs. Higher levels accelerate military production and factory conversion, but reduce the capacity available to the civilian sector."
 ADISCORD_economic_system_laws: "Economic System"
 ADISCORD_economic_system_laws_desc: "The economic system defines the balance between private initiative, social obligations, and public administration. The chosen model shapes industry, public finances, development, and the economic measures available to the state."
 ADISCORD_economic_system_agrarian: "Agrarian Economy"
 ADISCORD_economic_system_agrarian_desc: "Production rests on agriculture, local resources, and labor-intensive sectors. This system consumes less energy and supports stability, but limits industrial output, research, and access to credit."
 ADISCORD_economic_system_industrializing: "Industrializing Economy"
 ADISCORD_economic_system_industrializing_desc: "Capital and labor are directed into factories and infrastructure. Industrialization accelerates growth and the adoption of modern production methods, but increases economic strain while output and research still lag behind developed economies."
 ADISCORD_economic_system_free_market: "Free Market"
 ADISCORD_economic_system_free_market_desc: "Private ownership, competition, and open exchange direct investment and production. Trade income, efficiency, and creditworthiness improve, but tax collection and the retention of resources at home weaken."
 ADISCORD_economic_system_mixed: "Mixed Economy"
 ADISCORD_economic_system_mixed_desc: "Market mechanisms operate alongside public regulation and social obligations. This produces modest gains in output, revenue, and stability without the advantages of narrow specialization."
 ADISCORD_economic_system_state_coordinated: "State-Regulated Economy"
 ADISCORD_economic_system_state_coordinated_desc: "The state directs investment and infrastructure development while enterprises retain operational autonomy. Construction, revenue, and financial resilience improve, but coordination consumes additional administrative and political resources."
 ADISCORD_economic_system_planned_bureaucratic: "Administrative Command Economy"
 ADISCORD_economic_system_planned_bureaucratic_desc: "Government agencies allocate resources and production targets through binding plans. Industrial capacity and domestic supply improve, but production becomes harder to redirect while administrative costs, energy demand, and fiscal strain increase."
 ADISCORD_economic_system_syndicalist: "Syndicalist Economy"
 ADISCORD_economic_system_syndicalist_desc: "Enterprises are managed by worker associations and industrial unions that coordinate production between collectives. The system supports employment and civilian industry, but constrains private investment and requires continuous coordination."
 ADISCORD_economic_system_oligarchic_clan: "Clan Economy"
 ADISCORD_economic_system_oligarchic_clan_desc: "Influential groups divide control over resources and industries among themselves. Rents and trade support production, but tax collection, creditworthiness, stability, and fiscal discipline weaken."
 ADISCORD_economic_system_technocratic: "Technocratic Economy"
 ADISCORD_economic_system_technocratic_desc: "Technocratic rule or advanced economic and state institutions place key decisions in the hands of expert bodies. Research, productivity, and growth accelerate, but administrative and research spending, energy demand, and political strain increase."

