 ADISCORD_economy_topbar_treasury_value: "[?ADISCORD_economy_treasury|0]"
 ADISCORD_economy_topbar_treasury_tooltip: "§YTREASURY AND ECONOMY§!\nCurrent: [?ADISCORD_economy_treasury|0] / [?ADISCORD_economy_treasury_cap|0]\nRecommended reserve: [?ADISCORD_economy_safe_reserve|Y0] (4 weeks of expenses)\nWeekly income: [?ADISCORD_economy_weekly_income|G1]\nWeekly expenses: [?ADISCORD_economy_weekly_expenses|R1]\nWeekly balance: [?ADISCORD_economy_weekly_balance|=+1]\n\n§YHOW IT WORKS§!\nThe balance is settled once a week. A §Gsurplus§! builds reserves; a §Rdeficit§! consumes them. Any uncovered deficit is borrowed automatically, raising debt, interest and inflation. Cash above the reserve cap funds internal investment: every 10 units pay for one week of faster construction (+5%). Unspent investment fund: [?ADISCORD_economy_overflow_investment_fund|1].\n\nDebt: [?ADISCORD_economy_debt|0] ([?ADISCORD_economy_debt_income_ratio|0]% of annual income)\nWeekly interest: [?ADISCORD_economy_weekly_interest|2] ([?ADISCORD_economy_interest_share_income|1]% of weekly income)\nDebt pressure: [?ADISCORD_economy_debt_pressure|0]/100\nLast automatic loan: [?ADISCORD_economy_last_auto_borrowing|Y1]\n\n§GClick to manage the economy.§!"
