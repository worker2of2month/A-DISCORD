 ADISCORD_economy_treasury_tt: "§YTREASURY§!\nCurrent: [?ADISCORD_economy_treasury|0] of [?ADISCORD_economy_treasury_cap|0]\nWeekly change: [?ADISCORD_economy_weekly_balance|=+1]\nRecommended reserve: [?ADISCORD_economy_safe_reserve|Y0]\n§LAn uncovered deficit automatically becomes debt.§!"
 ADISCORD_economy_treasury_delayed_tt: "§YTREASURY DETAILS§!\nWeekly income: [?ADISCORD_economy_weekly_income|G2]\nWeekly expenses: [?ADISCORD_economy_weekly_expenses|R2]\nWeekly balance: [?ADISCORD_economy_weekly_balance|=+2]\nRecommended reserve: [?ADISCORD_economy_safe_reserve|Y0]. At the current deficit, it lasts about [?ADISCORD_economy_deficit_runway|1] weeks. §Y260§! means at least five years or no current deficit.\n\nMonthly income total: [?ADISCORD_economy_monthly_income|G2]. Development and state load: [?ADISCORD_economy_income_multiplier|0]%. Overall treasury income: [?ADISCORD_economy_final_overall_income_factor_bp|0]%. The weekly amount is that total at §Y3/13§!.\nPersonal income: [?ADISCORD_economy_personal_income|G1]\nBusiness income: [?ADISCORD_economy_business_income|G1]\nResearch expenses: [?ADISCORD_economy_research_expenses|R1]\nConstruction expenses: [?ADISCORD_economy_construction_expenses|R1]\nDebt service: [?ADISCORD_economy_debt_service|R1]\n\nTreasury above [?ADISCORD_economy_treasury_cap|0] goes into the investment fund."
 ADISCORD_economy_debt_tt: "§YDEBT§!\nPrincipal: [?ADISCORD_economy_debt|0]\nRate: [?ADISCORD_economy_interest_rate|1]%  |  creditworthiness: [?ADISCORD_economy_creditworthiness|0]/100\nWeekly interest: [?ADISCORD_economy_weekly_interest|2]\nInterest share: [?ADISCORD_economy_interest_share_income|1]% of income  |  pressure: [?ADISCORD_economy_debt_pressure|0]/100\nState: [?ADISCORD_economy_debt_state|0]/4 - [GetADISCORDDebtEffectsLoc]\nInterest-share thresholds: §Y10/25/40%§!; severe-state streaks: §Y4/13§! settlements."
 ADISCORD_economy_debt_delayed_tt: "§YDEBT DETAILS§!\nPrincipal: [?ADISCORD_economy_debt|0]\nWeekly interest: [?ADISCORD_economy_weekly_interest|2]\nInterest share of weekly income: [?ADISCORD_economy_interest_share_income|1]%\nState: [?ADISCORD_economy_debt_state|0]/4\nRate: [?ADISCORD_economy_interest_rate|1]%  |  Creditworthiness: [?ADISCORD_economy_creditworthiness|0]/100\n\nFiscal strain begins at §Y10%§! and debt crisis at §Y25%§! of weekly income.\nBudget emergency requires §Y4§! consecutive settlements at §Y40%§! or more: [?ADISCORD_economy_debt_emergency_streak|0]/4.\nDefault requires §Y13§! such settlements and a negative weekly balance: [?ADISCORD_economy_debt_default_streak|0]/13.\nRepayment immediately recalculates the state and can remove a more severe penalty. Principal has no separate maximum.\n\nCurrent effect: [GetADISCORDDebtEffectsLoc]"
 ADISCORD_economy_inflation_tt: "§YINFLATION§!\nCurrent: [?ADISCORD_economy_inflation|1]%\nWeekly equivalent of the last macro change: [?ADISCORD_economy_weekly_inflation_change|=+2] pp\nPenalty thresholds: §Y10/25/50/75%§!\n[GetADISCORDInflationEffectsLoc]"
 ADISCORD_economy_inflation_delayed_tt: "§YINFLATION DETAILS§!\nCurrent: [?ADISCORD_economy_inflation|1]%\nWeekly equivalent of the last macro change: [?ADISCORD_economy_weekly_inflation_change|=+2] pp (the exact §Y3/13§! conversion, not engine-tick precision).\nConsumer-goods burden: ×[?ADISCORD_economy_inflation_expense_multiplier|2]. This is a display of the active penalty, not another cash expense.\n\nEmission pressure: [?ADISCORD_economy_emission_pressure|1]\nDeficit pressure: [?ADISCORD_economy_deficit_pressure|1]\nPrice shock: [?ADISCORD_economy_price_shock|1]\nBorrowing and war can add pressure; a surplus alone does not remove market inflation.\nStabilization and emission cuts reduce it. Planned economies receive shortages and state load instead.\n\nPenalty thresholds: §Y10/25/50/75%§!\nCurrent effect: [GetADISCORDInflationEffectsLoc]"

 ADISCORD_economy_income_tt: "§YWEEKLY INCOME§!\nTotal: [?ADISCORD_economy_weekly_income|G2]. The treasury receives this amount automatically once a week.\nFixed weekly bonuses: [?ADISCORD_economy_final_weekly_income_bonus|G2]\n\n§YMonthly lines§!\nPopulation: [?ADISCORD_economy_personal_income|G1]\nBusiness and trade: [?ADISCORD_economy_business_income|G1]\nCivilian industry: [?ADISCORD_economy_consumer_goods_income|G1]\nMilitary industry: [?ADISCORD_economy_factory_income|G1]\nResource rent: [?ADISCORD_economy_resource_income|G1]\nEconomic buildings: [?ADISCORD_economy_building_income|G1]\n\nDevelopment and state load: [?ADISCORD_economy_income_multiplier|0]%\nOverall treasury income: [?ADISCORD_economy_final_overall_income_factor_bp|0]%\nMonthly total: [?ADISCORD_economy_monthly_income|G2]\n\nThe weekly amount is that monthly total at §Y3/13§!, plus fixed bonuses."
 ADISCORD_economy_expenses_tt: "§YWEEKLY EXPENSES§!\nTotal: [?ADISCORD_economy_weekly_expenses|R2]. The treasury pays this amount automatically once a week.\n\n§YMonthly lines§!\nArmed forces: army [?ADISCORD_economy_army_expenses|R1], air force [?ADISCORD_economy_airforce_expenses|R1], navy [?ADISCORD_economy_navy_expenses|R1]\nMilitary industry: [?ADISCORD_economy_military_factory_expenses|R1]\nConstruction: [?ADISCORD_economy_construction_expenses|R1]\nSocial support: [?ADISCORD_economy_social_expenses|R1]\nResearch: [?ADISCORD_economy_research_expenses|R1]\nAdministration and repair: [?ADISCORD_economy_admin_expenses|R1] / [?ADISCORD_economy_repair_expenses|R1]\nDebt service: [?ADISCORD_economy_debt_service|R1]\n\nOverall expenses: [?ADISCORD_economy_final_overall_expense_factor_bp|0]%\nMonthly total: [?ADISCORD_economy_monthly_expenses|R2]\n\nThe weekly amount is that monthly total at §Y3/13§!."
 ADISCORD_economy_budget_breakdown_tt: "§YWHERE THE BALANCE COMES FROM§!\nWeekly income: [?ADISCORD_economy_weekly_income|G2]\nWeekly expenses: [?ADISCORD_economy_weekly_expenses|R2]\n§YWeekly balance:§! [?ADISCORD_economy_weekly_balance|=+2]\n\n§YIncome - monthly base§!\nResource rents: [?ADISCORD_economy_resource_income|G1]\nBusiness and trade: [?ADISCORD_economy_business_income|G1]\nPopulation taxes: [?ADISCORD_economy_personal_income|G1]\nCivilian industry: [?ADISCORD_economy_consumer_goods_income|G1]\nMilitary industry: [?ADISCORD_economy_factory_income|G1]\nEconomic buildings: [?ADISCORD_economy_building_income|G1]\n\n§YExpenses - monthly base§!\nArmy: [?ADISCORD_economy_army_expenses|R1]  Air force: [?ADISCORD_economy_airforce_expenses|R1]  Navy: [?ADISCORD_economy_navy_expenses|R1]\nMilitary industry: [?ADISCORD_economy_military_factory_expenses|R1]\nSocial budget: [?ADISCORD_economy_social_expenses|R1]\nScience: [?ADISCORD_economy_research_expenses|R1]\nConstruction: [?ADISCORD_economy_construction_expenses|R1]\nAdministration: [?ADISCORD_economy_admin_expenses|R1]\nRepairs: [?ADISCORD_economy_repair_expenses|R1]\nDebt interest: [?ADISCORD_economy_debt_service|R1]\n\nDevelopment and national burden: [?ADISCORD_economy_income_multiplier|0]%\nTotal treasury income: [?ADISCORD_economy_final_overall_income_factor_bp|0]%\nMonthly income total: [?ADISCORD_economy_monthly_income|G2]\nTotal expenses: [?ADISCORD_economy_final_overall_expense_factor_bp|0]%\nMonthly expense total: [?ADISCORD_economy_monthly_expenses|R2]\n\nThese monthly totals are converted to weekly amounts at the §Y3/13§! ratio. Adjust only taxes and the budgets you need: everything else is calculated automatically."
 ADISCORD_economy_balance_tt: "§YWEEKLY BALANCE§!\nIncome: [?ADISCORD_economy_weekly_income|G2]\nExpenses: [?ADISCORD_economy_weekly_expenses|R2]\nBalance: [?ADISCORD_economy_weekly_balance|=+2]"
 ADISCORD_economy_balance_delayed_tt: "§YWHERE THE BALANCE COMES FROM§!\nTreasury: [?ADISCORD_economy_treasury|0]\nWeekly income: [?ADISCORD_economy_weekly_income|G2]\nWeekly expenses: [?ADISCORD_economy_weekly_expenses|R2]\n§YWeekly balance:§! [?ADISCORD_economy_weekly_balance|=+2]\nRecommended reserve: [?ADISCORD_economy_safe_reserve|Y0]\nDeficit runway: [?ADISCORD_economy_deficit_runway|Y1] weeks (260 means at least five years).\n\n§YIncome - monthly base§!\nResource rent: [?ADISCORD_economy_resource_income|G1]\nBusiness and trade: [?ADISCORD_economy_business_income|G1]\nPersonal taxes: [?ADISCORD_economy_personal_income|G1]\nCivilian industry: [?ADISCORD_economy_consumer_goods_income|G1]\nMilitary industry: [?ADISCORD_economy_factory_income|G1]\nEconomic buildings: [?ADISCORD_economy_building_income|G1]\n\n§YExpenses - monthly base§!\nArmy: [?ADISCORD_economy_army_expenses|R1]  Air force: [?ADISCORD_economy_airforce_expenses|R1]  Navy: [?ADISCORD_economy_navy_expenses|R1]\nMilitary industry: [?ADISCORD_economy_military_factory_expenses|R1]\nSocial budget: [?ADISCORD_economy_social_expenses|R1]\nResearch: [?ADISCORD_economy_research_expenses|R1]\nConstruction: [?ADISCORD_economy_construction_expenses|R1]\nAdministration: [?ADISCORD_economy_admin_expenses|R1]\nRepairs: [?ADISCORD_economy_repair_expenses|R1]\nDebt interest: [?ADISCORD_economy_debt_service|R1]\n\nDevelopment and state load: [?ADISCORD_economy_income_multiplier|0]%\nOverall treasury income: [?ADISCORD_economy_final_overall_income_factor_bp|0]%\nMonthly income total: [?ADISCORD_economy_monthly_income|G2]\nOverall expenses: [?ADISCORD_economy_final_overall_expense_factor_bp|0]%\nMonthly expense total: [?ADISCORD_economy_monthly_expenses|R2]\n\nThose monthly totals become the weekly settlement at the exact §Y3/13§! ratio."
 ADISCORD_economy_summary_tt: "§YREADING THE DASHBOARD§!\n§YModel§! is the country's lasting economic system. §YState§! summarizes current growth or crisis. §YDevelopment§! is long-term capacity.\n\nState load and war fatigue are separate indicators. Hover over each risk row for causes, thresholds, and active penalties."
 ADISCORD_economy_modifier_factors_tt: "§YCOUNTRY FACTORS§!\n§L100% is the normal value. Above 100% strengthens a factor; for expenses and inflation pressure this is usually worse.§!\n\nTax collection: [?ADISCORD_economy_final_tax_collection_factor_bp|0]%\nTrade income: [?ADISCORD_economy_final_trade_income_factor_bp|0]%\nCivilian-factory income: [?ADISCORD_economy_final_civilian_factory_income_factor_bp|0]%\nArmy expenses: [?ADISCORD_economy_final_army_expense_factor_bp|0]%\nConstruction expenses: [?ADISCORD_economy_final_construction_expense_factor_bp|0]%\nDebt service: [?ADISCORD_economy_final_debt_service_factor_bp|0]%\nInterest rate: [?ADISCORD_economy_final_interest_rate_factor_bp|0]%\nCreditworthiness: [?ADISCORD_economy_final_creditworthiness_factor_bp|0]%\nInflation pressure: [?ADISCORD_economy_final_inflation_pressure_factor_bp|0]%\nPrice stability: [?ADISCORD_economy_final_price_stability_factor_bp|0]%\nDevelopment growth: [?ADISCORD_country_development_final_economic_growth_factor_bp|0]%"
 ADISCORD_economy_buildings_tt: "§YCHOOSING AN ECONOMIC BUILDING§!\n§YBusiness center§! improves cash income and treasury space; its base net effect is §G+1.20/month§!.\n§YResearch center§! costs §R-0.27/month§!, but improves development and research.\n§YIndustrial cluster§! gives §G+5%§! functional military factories per level in its region; the current combined equivalent is §G+[?ADISCORD_economy_cluster_factory_output_percent|1]%§!. Its factories consume more energy, but the building now has a positive base budget.\n\nOnly intact buildings in controlled states provide income and network bonuses. Research and industrial network bonuses grow at §Y1/2/4/6§! buildings."
 ADISCORD_economy_stretched_tt: "§YSTATE LOAD§!\nCurrent: [?ADISCORD_economy_stretched_score|0]/100, level [?ADISCORD_economy_stretched_level|0]/4. Penalties change at §Y20/40/60/80§!.\n\n§YCurrent effect§!\n[GetADISCORDStateLoadEffectsLoc]\n\n§YCurrent sources§!\nDebt pressure: [?ADISCORD_economy_debt_pressure|0]\nWar fatigue level: [?ADISCORD_economy_war_fatigue_level|0]/4\nDemographic losses: [?ADISCORD_economy_demographic_fatigue_score|0]/100\nPeople outside the civilian economy: level [?ADISCORD_economy_workforce_drain_level|0]/4\nFiscal stress: [?ADISCORD_economy_fiscal_stress|0]/100\nDeficit pressure: [?ADISCORD_economy_deficit_pressure|0]/100\nBombing disruption: level [?ADISCORD_economy_bombing_disruption_level|0]/4\nEmergency measures: [?ADISCORD_economy_action_overload_residue|0]\n\nRestore a surplus, rebuild the treasury, and stop debt and inflation from rising. Postwar demobilization lowers the military budget and mobilization laws."
 ADISCORD_economy_war_fatigue_tt: "§YWAR FATIGUE§!\nCurrent: [?ADISCORD_economy_war_fatigue_score|0]/100, level [?ADISCORD_economy_war_fatigue_level|0]/4. Casualties last month: [?ADISCORD_economy_monthly_casualties_delta_k|0] thousand.\nDemobilization: [GetADISCORDDemobilizationStatusLoc]\n\n§YWhat changes the value each month§!\nWar adds §R+2§!, an emergency army budget adds another §R+2§!, and severe casualties add up to §R+4§!. Peace removes §G-1§!, while postwar demobilization removes another §G-4§!. Recent casualties can slow recovery during the first month of peace.\n\nLevels change at §Y15/30/50/75§!. Direct penalties begin at level two; every level also adds §R+8 points§! to state load.\n\n§YCurrent effect§!\n[GetADISCORDWarFatigueEffectsLoc]"
 ADISCORD_economy_demobilization_status_inactive: "§Linactive§!"
 ADISCORD_economy_demobilization_status_active: "§Gactive§!, [?ADISCORD_economy_postwar_demobilization_months|0] months remaining\n§GPeace dividend:§! stability +2%, civilian construction +10%, army expenses -10%, development growth +5%; inflation pressure and state-load gain -10%.\n§RTransition cost:§! factory output -8%, military-factory construction -15%, dockyard construction -10%, war support -5%."

 ADISCORD_economy_inflation_effect_none: "§GBelow 10%: no separate penalty.§!"
 ADISCORD_economy_inflation_effect_rising: "§Y10-24%:§! consumer goods §R+1%§!, construction §R-1%§!."
 ADISCORD_economy_inflation_effect_high: "§O25-49%:§! consumer goods §R+4%§!, stability §R-3%§!, construction §R-3%§!."
 ADISCORD_economy_inflation_effect_severe: "§R50-74%:§! consumer goods §R+8%§!, stability §R-6%§!, construction §R-7%§!, factory output §R-3%§!."
