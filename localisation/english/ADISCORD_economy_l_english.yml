 ADISCORD_economy_advice_critical: "§RSystemic danger.§! Stabilize immediately, cut emergency spending, and rebuild the treasury."
 ADISCORD_economy_advice_auto_loan: "§RThe last settlement borrowed automatically.§! The weekly balance is still negative; raise taxes or cut a budget before the next cash tick."
 ADISCORD_economy_advice_debt: "§RDebt is dangerous.§! Stop new borrowing and use the surplus for repayment."
 ADISCORD_economy_advice_inflation: "§OPrices are escaping control.§! Avoid new loans and save 100 treasury for stabilization."
 ADISCORD_economy_advice_deficit: "§YThe budget is in deficit.§! Raise taxes or lower spending gradually; each policy change has a cooldown."
 ADISCORD_economy_advice_war: "§YWar pressure is rising.§! Watch war fatigue and avoid an unnecessary emergency army budget."
 ADISCORD_economy_advice_growth: "§GThe economy has room to grow.§! Build economic assets or cautiously lower taxes."
 ADISCORD_economy_advice_balanced: "§GThe position is manageable.§! Maintain a treasury reserve and avoid changing several policies at once."
