 ADISCORD_economy_increase_army_spending: "Increase Army Spending"
 ADISCORD_business_center: "Business Centre"
 ADISCORD_business_center_plural: "Business Centres"
 ADISCORD_business_center_desc: "§YRole: income§!\nBase net contribution per level before modifiers: §G+30.15 per month§! (about §G+6.96 per week§!). A business centre adds 30 to the services base, 0.25 direct income and 0.10 administrative expenses. Actual income depends on the economic model, taxes and national modifiers.\n\nTreasury capacity: §G+100§! before modifiers. The state gains §G+5%§! building construction speed, §G+10%§! building slots and §G+5%§! resource output. Income counts only undamaged levels in owned and controlled states; each additional centre in the country costs more to build."
 ADISCORD_science_center: "Science Centre"
 ADISCORD_science_center_plural: "Science Centres"
 ADISCORD_science_center_desc: "§YRole: research§!\nA national network of 1/2/4/6 undamaged centres grants §G+5%/+10%/+15%/+20%§! research speed respectively. Tiers replace one another rather than stacking.\n\nAt science budget level 3, the net contribution per level before national modifiers is §R-0.62 per month§!. Treasury capacity: §G+40§! before modifiers. The centre accelerates development and strengthens administration. The state gains §G+5%§! building construction speed, §G+6%§! building slots, §G-5%§! energy consumption by local factories and §G+3%§! resource output; each additional centre costs more to build."
 ADISCORD_industrial_cluster: "Industrial Cluster"
 ADISCORD_industrial_cluster_plural: "Industrial Clusters"
 ADISCORD_industrial_cluster_desc: "§YRole: income and local military production§!\nEach level grants §G+10% output to undamaged military factories in this state§!, up to §G+30%§! at three levels. Current nationwide equivalent: §G+[?ADISCORD_economy_cluster_factory_output_percent|1]%§!. A cluster without military factories provides no such production bonus.\n\nBase net contribution before modifiers: §G+9.86 per month§! (about §G+2.28 per week§!); with arms income available, §G+9.98 per month§!. The national cluster network raises factory output separately. The state gains §G+10%§! building construction speed, §G+8%§! building slots and §G+5%§! resource output; factory energy consumption rises by 10%. Only undamaged levels in owned and controlled states count; each additional cluster costs more to build."
 ADISCORD_economy_cluster_local_factory_output: "Regional Industrial Clusters"
 ADISCORD_economy_cluster_local_factory_output_desc: "The weighted equivalent of the bonus to undamaged military factories located in owned and controlled states with industrial clusters."
