 economy: "Economic Mobilisation"
 trade_laws: "Trade Policy"
 trade_laws_desc: "The rules governing foreign trade, resource exports and access to markets. Trade policy affects industry, research, exports and treasury income from trade."
 undisturbed_isolation: "Undisturbed Isolation"
 undisturbed_isolation_desc: "The state is barely prepared for an external crisis. Civilian industry is absorbed by domestic needs, military construction is weak, and the mobilisation apparatus has not been deployed."
 isolation_desc: "The country has limited interaction with the outside world and retains a weak mobilisation system. This reduces the national burden but severely constrains military production."
 civilian_economy_desc: "A peacetime economic system. Civilian construction and the domestic market remain priorities, while military industry and factory conversion expand slowly."
 low_economic_mobilisation: "Preparatory Mobilisation"
 low_economic_mobilisation_desc: "The state begins preparing industry for a possible war without dismantling the peacetime order. Military industry receives its first priorities, but the civilian economy remains important."
 partial_economic_mobilisation_desc: "A substantial share of the economy is placed on a war footing. Military factory construction and conversion accelerate, while civilian construction begins to yield to the front's needs."
 war_economy_desc: "Military needs become the overriding priority. Military industry grows faster, but civilian income, stability and economic governability begin to suffer."
 tot_economic_mobilisation: "Total Mobilisation"
 tot_economic_mobilisation_desc: "The economy is pushed almost to its limit for the war effort. Military industry receives the maximum resources, but civilian life, stability and long-term development pay a heavy price."
 free_trade_desc: "The country opens its resources and markets to the outside world. This accelerates industry and research and raises trade income, but makes the economy more transparent to foreign intelligence and less insulated during a crisis."
 export_focus: "Export Priority"
 export_focus_desc: "A balanced trade system: a substantial share of resources is exported, while the state retains room for domestic planning."
 limited_exports_desc: "The state reduces exports and retains more resources at home. This is useful during war, but reduces the benefits of open trade."
 closed_economy_desc: "Foreign trade is sharply restricted and market access is blocked. This system suits wartime self-sufficiency, but reduces flexibility and trade income."
