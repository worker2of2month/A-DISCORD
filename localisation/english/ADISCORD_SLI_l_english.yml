 VAL_Island_Treaty:0 "Treaty with the Stelander Islands"
 VAL_Island_Treaty_desc:0 "Civil war on the mainland ended the Nodrul mandate. The Island Council has declared independence, but its harbours still depend on neighbouring markets. We will offer the islands accession to Kefreyt. Their council will have the final say."
 VAL_Island_Operation:0 "Occupy the Stelander Islands"
 VAL_Island_Operation_desc:0 "The accession treaty did not succeed. We can resolve the dispute by landing troops. This order starts a war; the islands must still be captured and held."
 VAL_island_treaty_available_tt:0 "The Stelander civil war has begun. Kefreyt is independent and has not capitulated. The islands are independent, at peace, outside any faction, and own and control their archipelago."
 VAL_island_treaty_offer_tt:0 "Offer the Island Council accession to Kefreyt. Acceptance transfers its territory and troops; refusal unlocks the focus Occupy the Stelander Islands."
 VAL_island_operation_available_tt:0 "The accession treaty did not succeed. Kefreyt is independent and has not capitulated; the islands are independent, at peace, outside any faction, and own and control their archipelago."
 SLI_join_kefreyt_tt:0 "The island country joins Kefreyt with all its territory and troops."
 SLI_refuse_kefreyt_tt:0 "The islands remain independent. Kefreyt may prepare a military operation through a separate focus."
 ADISCORD_SLI.1.t:0 "The Stelander Islands Declare Independence"
 ADISCORD_SLI.1.d:0 "The outbreak of civil war in Stelander has reached the islands. Declaring that the old arrangement no longer ensures their safety, the Island Council has terminated the Nodrul mandate. The administration's flag, with its Stelander symbols, has been lowered above the harbour. A blue banner bearing seven white stars has taken its place.\n\nThe council will govern the islands independently. As fronts form on the mainland, the young republic must define its relations with Nodrul and Kefreyt. Independence alone guarantees neither safe shipping nor supplies."
 ADISCORD_SLI.1.a:0 "The archipelago now has its own flag."
 ADISCORD_SLI.2.t:0 "Kefreyt Offers Accession"
 ADISCORD_SLI.2.d:0 "Kefreyt's delegation has submitted an accession treaty to the Island Council. The archipelago would join Kefreyt and its armed forces would enter a common command. In return, the islands would gain access to mainland supply networks and coastal protection.\n\nThe council must choose between its recently declared independence and membership in a larger country. The delegates warn that refusal may lead to a military operation, but they cannot sign on the council's behalf."
 ADISCORD_SLI.2.a:0 "Sign the accession treaty."
 ADISCORD_SLI.2.b:0 "We will remain independent."
 ADISCORD_SLI.2.c:0 "Circumstances have changed; close the treaty."
 ADISCORD_SLI.3.t:0 "The Island Council Replies"
 ADISCORD_SLI.3.accepted:0 "The Island Council has accepted the accession treaty. The Stelander Islands have joined Kefreyt and their local forces have entered our command. The harbours and civil administration are joining the common system."
 ADISCORD_SLI.3.refused:0 "The Island Council has rejected accession. The republic remains independent. Our command may now prepare a separate operation to occupy the archipelago if the government chooses to pursue it."
 ADISCORD_SLI.3.a:0 "The reply has arrived."
