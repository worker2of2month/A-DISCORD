l_english:
 TFF_frontier_defense_confederation: "Frontier Defense Confederation"
 TFF_frontier_defense_confederation_DEF: "the Frontier Defense Confederation"
 TFF_frontier_defense_confederation_ADJ: "Frontier"

 tff_emergency_war_coordinator: "Emergency War Coordinator"
 tff_emergency_war_coordinator_desc: "A limited wartime mandate inside the Frontier's anarchist system. The coordinator joins supply and defence without claiming to be head of state."

 ADISCORD_TFF.1.t: "The Empty Chair"
 ADISCORD_TFF.1.d: "Before the war the empty chair in the assembly hall was treated as proof of freedom. Nobody had the right to give orders to every settlement of the Frontier.\n\nNow a regular Nodrul army stands against them. Field commanders want common supply and one defensive scheme. Commune delegates bring the same complaint: isolated bands last a few days, then run out of ammunition and lose the neighbour on their flank.\n\nThe gathering does not elect a president. It gives Colt Ardent a limited mandate as Emergency War Coordinator. He is to match requests, allot reserves, and keep Free Rifles from dying alone because a political rule forbade a common command. When the war ends the mandate can be withdrawn. While it lasts the country takes the name Frontier Defense Confederation."
 ADISCORD_TFF.1.a: "Record the mandate."
 ADISCORD_TFF_empty_chair_result_tt: "Colt Ardent receives a limited military mandate. The country takes the name Frontier Defense Confederation. Wartime decisions open for as long as the war with Nodrul continues."

 TFF_emergency_frontier_command: "Emergency Frontier Command"
 TFF_emergency_frontier_command_desc: "The communes accepted a common military command only for the duration of the war. Supply and defence pass through one staff, but the political system remains anarchist."
 TFF_free_rifle_levy: "Free Rifle Levy"
 TFF_free_rifle_levy_desc: "Separate bands temporarily accept a common levy and faster training."
 TFF_commune_coordination: "Commune Coordination"
 TFF_commune_coordination_desc: "Settlements send manpower and supply requests through one table without giving up local self-rule."
 TFF_common_supply_network: "Common Supply Depots"
 TFF_common_supply_network_desc: "Field depots take cargo from several communes and issue it on a single set of papers."
 TFF_unified_field_command: "Unified Field Command"
 TFF_unified_field_command_desc: "Band commanders agree plans and reinforcements through the war coordinator."

 TFF_frontier_at_war: "The Frontier at War"
 TFF_frontier_at_war_desc: "Emergency command joins the levy, supply, and the Nodrul border for as long as the wartime mandate lasts."
 TFF_call_the_free_rifles: "Call the Free Rifles"
 TFF_call_the_free_rifles_desc: "The bands will send men into a common reserve. Training speeds up, but the assembly will treat a forced levy as a break with the old custom."
 TFF_coordinate_the_communes: "Coordinate the Communes"
 TFF_coordinate_the_communes_desc: "Settlement delegates will match requests for men, weapons, and routes. Coordination steadies the rear and army organisation."
 TFF_establish_common_supply_depots: "Establish Common Supply Depots"
 TFF_establish_common_supply_depots_desc: "Field depots on the border will cut supply consumption. If Odar is still held, the road to the line will be improved there."
 TFF_fortify_the_nodrul_border: "Fortify the Nodrul Border"
 TFF_fortify_the_nodrul_border_desc: "In Odar we will raise works only on the three approaches to Esnos. This is not a belt around the whole Frontier."
 TFF_authorize_unified_field_command: "Authorize Unified Field Command"
 TFF_authorize_unified_field_command_desc: "Band commanders will accept a common planning and reinforcement scheme for the length of the mandate."
 ADISCORD_TFF.10.t: "The Frontier Creates a Joint Wartime Command"
 ADISCORD_TFF.10.d: "The Free Frontier Assembly has created the Frontier Defence Confederation for the duration of the war with Nodrul. Supply, reserves and operational planning will now pass through a common military staff led by Colt Ardent under a limited emergency mandate.\n\nThe communes retain their local political authority, and the assembly has not created a presidency or permanent central government. The new command exists to coordinate the war and can be dissolved when the mandate ends."
 ADISCORD_TFF.10.a: "The communes accept a common wartime staff."

 ADISCORD_TFF.11.t:0 "The Frontier Re-enters the Northern War"
 ADISCORD_TFF.11.d:0 "The Frontier has entered another war against Nodrul, this time alongside Kefreyt under their agreement on Yuboria. Frontier commanders are calling up reserves and moving supplies to the northern roads.\n\nThe agreement assigns the Yuborian administrations to Frontier protection after victory, while Kefreyt is to control the Nodrul territories covered by its contract administrations. Both governments have therefore tied their territorial settlement to the outcome of the same campaign."
 ADISCORD_TFF.11.a:0 "The joint campaign begins."
 TFF_kefreyt_northern_campaign:0 "A New Northern Campaign"
 TFF_kefreyt_northern_campaign_desc:0 "The agreement with Kefreyt gives the Frontier a chance to return to Yuboria. Joint supply plans and reserve mobilization strengthen its army for the common war. These bonuses end with the campaign, capitulation or loss of independence."
