 STP_ps_val_send_supply_cost_tooltip: "§Y12000§! £infantry_equipment_texticon"
 STP_ps_val_send_supply: "Send Weapons to the Stelander Underground"
 STP_ps_val_send_supply_desc: "12000 rifles from actual stockpiles. Preparation takes 28 days; the first dispatch takes 35 days. Without a connected overland route, the cargo waits and does not appear at its destination. Before the split, the rifles remain in a district cache in Niansas; afterwards, they are delivered to the resistance. Interception transfers them to the Party."
 STP_ps_val_intelligence_cost: "§Y450§! £ADISCORD_economy_treasury_texticon"
 STP_ps_val_intelligence_cost_blocked: "§R450§! £ADISCORD_economy_treasury_texticon"
 STP_ps_val_intelligence_cost_tooltip: "§Y450§! £ADISCORD_economy_treasury_texticon"
 STP_ps_val_intelligence: "Investigate Kefreyt's Requisition"
 STP_ps_val_intelligence_work: "Investigate Kefreyt's Requisition - In Progress"
 STP_ps_val_intelligence_desc: "Identify the current shipment's route in 7 days. Interception then needs another 14 days and a separate payment. Start intelligence with at least 22 days remaining before departure. An unfinished order refunds its payment if the shipment disappears or changes."
 STP_ps_val_intelligence_work_desc: "450 treasury units reserved. The result is delivered only if the programme's conditions still hold; cancellation refunds the deposit once."
 STP_ps_val_intercept_cost: "§Y1200§! £ADISCORD_economy_treasury_texticon"
 STP_ps_val_intercept_cost_blocked: "§R1200§! £ADISCORD_economy_treasury_texticon"
 STP_ps_val_intercept_cost_tooltip: "§Y1200§! £ADISCORD_economy_treasury_texticon"
 STP_ps_val_intercept: "Intercept the Known Overland Route"
 STP_ps_val_intercept_work: "Intercept the Known Overland Route - In Progress"
 STP_ps_val_intercept_desc: "Prepare to intercept the identified shipment along its active land route in 14 days. Captured cargo reaches our stockpiles instead of the resistance. Start with at least 15 days remaining before departure. An unfinished order refunds its payment if its conditions cease to hold."
 STP_ps_val_intercept_work_desc: "1200 treasury units reserved. The result is delivered only if the programme's conditions still hold; cancellation refunds the deposit once."
 STP_ps_val_pressure_cost: "§Y1500§! £ADISCORD_economy_treasury_texticon"
 STP_ps_val_pressure_cost_blocked: "§R1500§! £ADISCORD_economy_treasury_texticon"
 STP_ps_val_pressure_cost_tooltip: "§Y1500§! £ADISCORD_economy_treasury_texticon"
 STP_ps_val_pressure: "Pressure the Intermediaries"
 STP_ps_val_pressure_work: "Pressure the Intermediaries - In Progress"
 STP_ps_val_pressure_desc: "§YApplies immediately.§! Extends the current departure preparation by §Y14 days§!. For 60 days, subsequent shipments also take 14 days longer to prepare. With no active departure timer, only future shipments are affected. Available again after 60 days."
 STP_ps_val_pressure_work_desc: "1500 treasury units reserved. The result is delivered only if the programme's conditions still hold; cancellation refunds the deposit once."
 STP_ps_val_departure: "Preparing Kefreyt's Shipment"
 STP_ps_val_route_wait: "Waiting for an Open Overland Route"
 STP_ps_opposition_preparation_second: "Second Underground District Operation"
 STP_ps_opposition_preparation_second_desc: "After the first operation finishes, Shabrat opens a second parallel cycle, even before the election. It has a separate target and deadline. Success grants 20 influence; entrenched networks establish an administration and prepare military assets. Disrupting one operation does not stop the other. The second cycle stops opening new operations with fewer than 56 days left in the election."
 STP_ps_interrupt_opposition_second: "Disrupt the Second District Operation"
 STP_ps_interrupt_opposition_second_desc: "This response targets the marked district of the second operation. The reward is its disruption and local influence; no recurring loyalty increase is granted."

 STP_ps_opposition_target_second: "The second underground operation is being prepared in this district"
 STP_ps_district_rebuild_cost: "§Y4000§! £ADISCORD_economy_treasury_texticon"
 STP_ps_district_rebuild_cost_blocked: "§R4000§! £ADISCORD_economy_treasury_texticon"
 STP_ps_district_rebuild_cost_tooltip: "§Y4000§! £ADISCORD_economy_treasury_texticon"
 STP_ps_district_rebuild: "District Industrial Reconstruction"
 STP_ps_district_rebuild_desc: "4000 treasury units, 56 days: one civilian factory in the selected district. Requires control and space for construction. Only one district may be funded at a time; losing eligibility refunds the deposit. An emergency cabinet remains a separate operation."
 STP_ps_exile_formation_cost: "§Y1800§! £ADISCORD_economy_treasury_texticon; §Y6000§! £manpower_texticon; §Y5400§! £infantry_equipment_texticon"
 STP_ps_exile_formation_cost_blocked: "§R1800§! £ADISCORD_economy_treasury_texticon; §R6000§! £manpower_texticon; §R5400§! £infantry_equipment_texticon"
 STP_ps_exile_formation_cost_tooltip: "§Y1800§! £ADISCORD_economy_treasury_texticon; §Y6000§! £manpower_texticon; §Y5400§! £infantry_equipment_texticon"
 STP_ps_exile_formation: "Form an Exile Brigade"
 STP_ps_exile_formation_work: "Form an Exile Brigade - In Progress"
 STP_ps_exile_formation_desc: "1800 treasury units, 6000 men and 5400 rifles are reserved until delivery after 28 days. The result is one brigade of six territorial battalions. Cancellation refunds all three resources."
 STP_ps_exile_formation_work_desc: "1800 treasury units reserved. The result is delivered only if the programme's conditions still hold; cancellation refunds the deposit once."
 STP_ps_exile_formation_result_tt: "A brigade of six territorial battalions: 1800 treasury units, 6000 men and 5400 rifles are reserved until delivery after 28 days. Cancellation refunds all three resources."
 STP_ps_transport_idea_desc: "A temporary, paid army transport service."
 STP_ps_route_guard_idea_desc: "Protection of the active Congress-Niansas transport link."
 STP_ps_reserve_idea_desc: "Paid training and recovery for existing units."
 STP_ps_engineers_idea_desc: "Foreign specialists operate only during the northern war."
 STP_ps_expedition_idea_desc: "A paid supply reserve for troops that have entered the war."
 STP_ps_defence_dynamic_desc: "Offensive capabilities return in three stages: communications, supply and offensive preparation. This restriction does not reduce defensive firepower."
 STP_ps_nodes_dynamic_desc: "Losing the Congress slows planning; losing Niansas restricts army movement. Retaking a province removes its current penalty."
 STP_ps_empty: ""
 STP_ps_war_report: "\n§YArmy reorganisation: [?STP_ps_stage|0]/4§!\n[STPGetPartyGovernment]\nBreakthrough: §R[?STP_ps_breakthrough|%0]§!; planning: §R[?STP_ps_planning|%0]§!. This penalty does not affect defence. Complete the stages through the decisions below; losing an operational government pauses preparation."
 STP_ps_congress_held: "The government is operating in the Congress."
 STP_ps_cabinet_operating: "The reserve cabinet is functioning. The Congress is lost; its functions have not been fully restored."
 STP_ps_government_lost: "No functioning government: reorganisation is paused. A free emergency cabinet is available."
 STP_ps_handoff_disabled: "The Party's defeat does not transfer the player to Nodrul."
 STP_ps_asylum_accepted: "Asylum has been agreed."
 STP_ps_asylum_unconfirmed: "Asylum is unconfirmed or the host country is unavailable."
 STP_ps_exile_desc: "The organisation operates in Nodrul with the host government's consent. Nodrul's army and treasury do not copy the defeated Party's resources. Loyalty of the surviving apparatus upon evacuation: [?STP_ps_exile_loyalty|0]. Returning requires acceptance of dependency and an actual military victory."
 STP_ps_program_available_tt: "The programme is available in the current phase; the government and recipient are available, the channel is free and the required preparation is complete. Additional conditions are listed in the description."
 STP_ps_asylum_title: "Asylum Guarantees"
 STP_ps_asylum_desc: "Stelander's government requests advance permission to house the surviving Party organisation here in the event of military defeat. The exiles will not replace Nodrul's leader, automatically receive its army or oblige us to wage a war for their return."
 STP_ps_asylum_accept: "Guarantee asylum."
 STP_ps_asylum_decline: "Decline these commitments."
 STP_ps_nod_route_wait: "Waiting for the Northern Route"
 STP_ps_nod_route_wait_desc: "Requires a connected land border with Nodrul, or the Lower Market and a functioning Nodrulian port. Before dispatch, the entire reserve can be refunded. Losing the port does not block an eligible overland route."
 STP_ps_return_council_name: "Provisional Party Council"
 STP_ps_return_council_desc: "A council of surviving Party representatives, formed after their return with Nodrul's support."
 STP_ps_preparation_report: "§YGovernment preparation§!\nThe civilian course accelerates communications, arsenals accelerate supply, and the mobile reserve accelerates offensive preparation. Radio and reserve headquarters help only after their funded projects finish. A relevant faction below 35 support adds 7 days to a new stage; free reorganisation remains available."
 STP_pc_investment_seed_funding_tt:0 "Initial funding: §G+500§! £ADISCORD_economy_treasury_texticon"
 STP_pc_materials_program:0 "The Material Basis of Reconstruction"
 STP_pc_materials_program_desc:0 "Common supply standards and coordinated construction orders help the republic expand extraction and establish domestic production of rare materials."
 modifier_production_speed_ADISCORD_rare_components_plant_factor:0 "Rare components plant construction speed"
 modifier_production_speed_ADISCORD_rare_alloy_foundry_factor:0 "Rare alloy foundry construction speed"
 STP_pc_investment_development_fund: "The Republic's Investment Budget"
 STP_pc_investment_development_fund_desc:0 "We will establish long-term financing for major industrial programmes. State banks and enterprises will coordinate investment and equipment deliveries. The fund will improve national creditworthiness."
 STP_pc_investment_precision_industry: "Restore Precision Manufacturing"
 STP_pc_investment_precision_industry_desc: "Precision machine tools determine the quality of the entire production chain. We will consolidate equipment orders and prepare enterprises for installation. Enterprises will need supplies of rare components and alloys."
 STP_pc_investment_special_metallurgy: "The Material Basis of Reconstruction"
 STP_pc_investment_special_metallurgy_desc:0 "Rare alloys and electronic components require reliable supply. Common procurement standards will connect our own factories and foreign purchases to industry's actual needs."
 STP_pc_investment_automation: "Automate the Republic's Factories"
 STP_pc_investment_automation_desc: "We will agree on an automation programme. New production lines will connect separate workshops into a common manufacturing process."
 STP_pc_investment_logistics: "Mechanise State Supply"
 STP_pc_investment_logistics_desc: "Industry needs reliable transport. We will renew truck fleets and protected railway convoys to connect factories with their suppliers."
 STP_pc_investment_computing: "The Republic's Computing Complex"
 STP_pc_investment_computing_desc: "Research institutions and public administration will share a computing network. Engineers will bring scattered data and calculations together."
 STP_pc_investment_defense_orders: "Special Orders for the Republican Army"
 STP_pc_investment_defense_orders_desc: "We will coordinate production runs of reconnaissance vehicles and combat platforms with industry. Military specialists will prepare common requirements for the new equipment."
 STP_pc_investment_export_finance: "Industrial Export Bank"
 STP_pc_investment_export_finance_desc: "Moving from one-off deals to export finance will give enterprises predictable payments. Foreign-trade revenue must support the next wave of investment."
 STP_pc_investment_integrated_economy: "The Second Reconstruction Economy"
 STP_pc_investment_integrated_economy_desc: "We will unite precision manufacturing, transport and computing capacity in a common system. Enterprises will coordinate supplies and development across the production chain."
 STP_occidia_prepare_invasion: "Reclaim Occidia"
 STP_occidia_prepare_invasion_desc: "Kefreyt left the mountain republic outside its control. Once 90 days have passed since the civil war ended, the victorious Stelander can turn to reclaiming Occidia. Preparation takes 21 days, after which a war to annex the republic will begin. Active guarantees and the republican charter prohibit the attack."
 STP_occidia_invasion_available_tt: "At least 90 days have passed since the civil war ended. We are victorious, independent, at peace and outside any faction. Occidia is independent, borders us, is at peace and belongs to no faction. Neither side has active guarantees or a republican charter. Kefreyt has not begun mobilisation or entered the Occidian war."
 STP_occidia_prepare_invasion_tt: "In §Y21 days§!, war will begin against §Y[SRP.GetName]§!. Until preparation is complete, Kefreyt cannot begin its own intervention. Victory will annex the republic; its army does not pass to our command. Changed conditions cancel preparation without refunding political costs."
 STP_occidia_invasion_warning: "Stelander Prepares to Invade"
 STP_occidia_invasion_warning_desc: "The victor of the Stelandic civil war is preparing to annex our republic. We have 21 days from the start of preparations to deploy our defences."
 STP_ps_government_operational_tt: "The government is functioning in the Congress or a provisional cabinet."
 STP_ps_staff_recovery_tt: "The first stage of command reorganisation is complete."
 STP_ps_counterattack_ready_tt: "All three reorganisation stages are complete; the government is functioning."
 STP_ps_congress_fell_tt: "The Bronze Congress was lost during this civil war."
 NOD_cw_accept_northern_defeat: "Accept Defeat in the Northern War"
 NOD_cw_accept_northern_defeat_desc: "Continuing the northern war threatens complete collapse. We can accept the terms of defeat before the country capitulates."
 NOD_cw_accept_northern_defeat_available_tt: "The northern war has lasted at least §Y90 days§!, and either our surrender progress is at least §Y70%§! or the coalition holds §Y[17.GetName]§! and has broken into §Y[13.GetName]§! or §Y[12.GetName]§!. Nodrul has not yet capitulated and is at war with all three members of the northern coalition."
 NOD_cw_accept_northern_defeat_effect_tt: "Applies Nodrul's northern-war defeat settlement: peace with the northern coalition and transfer of the states §Y[17.GetName]§! and §Y[18.GetName]§!, if owned by us, to an independent §Y[YPR.GetName]§! if it exists. Our subject §Y[AIN.GetName]§! also leaves this war. Defeat closes the northern intervention route. Other wars continue."
 STP_ps_return_available_tt: "A Party committee operates in Nodrul, the terms of return have been accepted, and military preparation and the campaign focus are complete. Stelander has not yet been restored. Shabrat has not capitulated, shares no faction with Nodrul and is not its subject. The campaign has neither begun nor ended."
 STP_party_district_survey_tt: "In an accessible Niansas: §G+10§! Party influence. Resistance preparations are preserved."
 STP_party_mobile_reserve_tt: "At the split, the Party will also attempt to pay for §Y2 brigades§! from its share of the stockpiles: £manpower_texticon §Y12000§! and £infantry_equipment_texticon §Y10800§! in total. Unpaid units will not appear. The stated offensive preparation lasts §Y35 days from the start of hostilities§!."
 STP_ps_asylum_scope_tt: "The agreement covers asylum for the Party leadership and evacuated funds. Control of Nodrul is not transferred to the player."
 STP_cw_northern_call_blocked_tt: "Nodrul cannot call Stelander or the Stelander Islands into war while the northern war continues."
 STP_pw_take_bezhaysk: "Take Bezhaysk"
 STP_pw_take_bezhaysk_desc:0 "The civil war has ended, and the army once again has unified command and supply. We can now prepare a campaign against Bezhaysk. Headquarters will determine the lines of advance. Sotnikov's military directory will unite the defeated feudal holdings under one subordinate administration; other postwar Stelander governments will incorporate them into their own territory."
 STP_pw_launch_bezhaysk_operation: "Launch the Bezhaysk Offensive"
 STP_pw_launch_bezhaysk_operation_desc:0 "The operational plan is ready. Order the troops to cross the border and capture the capital domain of Bezhaysk. This decision starts the war immediately. A victory by Sotnikov's military directory will unite the defeated feudal holdings in a subordinate Bezhaysk Administration. Under other Stelander governments, they will be incorporated directly."
 STP_pw_bezhaysk_available_tt:0 "Stelander's postwar government has won the civil war, is independent and is at peace. Bezhaysk exists, is independent, has not capitulated, and owns and controls its capital state; our countries do not share a faction."
 NOD_cw_northern_push:0 "Northern offensive deadline"
 NOD_cw_northern_push_desc:0 "The offensive has supplies for 85 days from the start of the northern war. Events in Stelander do not reset the clock. If any northern enemy remains at war, Stalled Army replaces the offensive: attack -10%, division speed -10%, supply consumption +10%. Peace or Nodrul capitulation removes these effects."
 NOD_cw_stalled_army:0 "Stalled Army"
 NOD_cw_stalled_army_desc:0 "Supplies have fallen behind the northern advance. This penalty lasts until the wars against Yubora, the Forest and the Frontier end.\n\n\n\n\n\n £GFX_ADISCORD_vorkerland_civil_war_exhaustion_banner \n\n\n"
 NOD_cw_stalled_army_tt:0 "If the northern war continues, Stalled Army replaces the offensive until peace: attack -10%, speed -10%, supply consumption +10%. A surviving Yubor gains Yuboran Defensive Momentum (+12% defence, +10% organization recovery, -5% supply consumption, +2 max entrenchment); a surviving Forest gains The Forest Holds the Line (+10% defence, +8% organization, +8% reinforce rate, -5% supply consumption); and a surviving Frontier gains Frontier Counteroffensive (+8% attack, +10% breakthrough, +10% organization recovery, +5% speed)."
 YPR_cw_northern_resolve:0 "Yuboran Defensive Momentum"
 YPR_cw_northern_resolve_desc:0 "Yubor has endured seventy days of Nodrul's northern offensive. Exhausted assault columns and overstretched supply routes give the defenders time to harden the line and rotate battered formations. This bonus lasts while Yubor remains at war with Nodrul."
 COF_cw_northern_resolve:0 "The Forest Holds the Line"
 COF_cw_northern_resolve_desc:0 "The Forest has endured seventy days of Nodrul's northern offensive. Its defenders have registered the approaches, improved rotations and learned to close breakthroughs before they widen. This bonus lasts while the Forest remains at war with Nodrul."
 TFF_cw_northern_resolve:0 "Frontier Counteroffensive"
 TFF_cw_northern_resolve_desc:0 "The Frontier has survived the first seventy days of Nodrul's northern offensive. With the enemy advance losing momentum, ranger columns can leave their emergency positions and begin striking exposed roads and flanks. This bonus lasts while the Frontier remains at war with Nodrul."
 STP_cw_organize_underground:0 "Raise the Party Rear"
 STP_cw_organize_underground_desc:0 "Scouts will contact Shabrat supporters behind party lines and supply armed cells with our personnel and weapons. The cells can disrupt the rear, but risk encirclement without support."
 STP_cw_raise_rear_cell:0 "Raise an uprising in [FROM.GetName]"
 STP_cw_raise_rear_cell_desc:0 "Pay for and immediately deploy one cell of two territorial battalions behind Party lines: §Y2000§! £manpower_texticon, §Y1800§! £infantry_equipment_texticon and §Y35§! £political_power_texticon. The formation belongs to Shabrat and starts fully equipped with 20% experience.\n\nEach of the six districts can be used once while owned and controlled by the Party. The formation appears in enemy territory; encirclement and supply remain real threats. New uprisings are unavailable after the civil war."
 STP_cw_rear_cell_target_tt:0 "The party still controls the selected district."
 STP_cw_rear_cell_result_tt:0 "Deploy one fully equipped formation of two territorial battalions for Shabrat. Pay 2000 manpower, 1800 rifles and §Y35§! £political_power_texticon once. This district cannot rise again."
 STP_cw_rear_cell_cost:0 "§Y35§! £political_power_texticon  £manpower_texticon §Y2000§!  £infantry_equipment_texticon §Y1800§!"
 STP_cw_rear_cell_cost_blocked:0 "§R35§! £political_power_texticon  £manpower_texticon §R2000§!  £infantry_equipment_texticon §R1800§!"
 STP_cw_rear_cell_cost_tooltip:0 "Requires §Y35§! £political_power_texticon, £manpower_texticon §Y2000§! and £infantry_equipment_texticon §Y1800§!, paid once when the formation is created."
 STP_cw_operation_success_tt:0 "The current objective is secured. A temporary army bonus follows; headquarters selects another target if fewer than three operations have been resolved."
 STP_cw_operation_timeout_tt:0 "The objective was not secured within 49 days. A temporary army penalty follows. Peace cancels an unfinished operation without penalty."
 STP_cw_operation_cancel_tt:0 "Cancel without penalty if the civil war ends or the resistance capitulates."

