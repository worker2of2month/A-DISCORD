 STP_ps_exile_offer_title: "A Request from the Surviving Leadership"
 STP_ps_exile_offer_desc: "The Party's army has been defeated. Its surviving organisers request asylum. Acceptance neither takes control of Nodrul away from you nor changes its leader. You may receive the organisation without promising a war to restore it."
 STP_ps_exile_refuse: "Close the representation."
 STP_ps_exile_accept: "Grant asylum."
 STP_ps_exile_arrived_title: "Representation in Exile"
 STP_ps_exile_arrived_desc: "The war for Stelander has been lost. Shabrat controls the country, and the surviving Party organisation begins its work in Nodrul. Only funds evacuated in advance have been preserved. The host country's army, treasury and government remain its own. Returning will require a separate political agreement and a real military victory."
 STP_ps_exile_arrived_ok: "Begin the representation's work."
 STP_ps_return_title: "The Restored Government"
 STP_ps_return_desc: "Nodrul has won the campaign of return. Stelander has been restored as a subject state on its core territories. Surviving leaders may return; the dead remain dead. Old wartime orders do not resume."
 STP_ps_remain_nod: "Continue as Nodrul."
 STP_ps_control_stp: "Lead the restored Stelander."
 STP_ps_return_terms_tt: "Returning will restore Stelander as a subject state of Nodrul. Military victory is required; paying for preparation is no substitute."
