 ADISCORD_STP_pw.6.t: "Medicine and Prohibition"
 ADISCORD_STP_pw.6.d: "Two reports arrive on Shabrat's desk with the new departmental regulations. Investigators list warehouses, intermediaries, front pharmacies and familiar political patrons. The drug trade built connections under the old regime that survived the fall of the Chamber. The security officials demand a total ban: every exception, they argue, will shelter the same old business.\n\nHospital doctors signed the second report. They are not asking for retail sales. They list wounded patients, difficult operations and cases where ordinary painkillers are insufficient. They propose supplies restricted to registered hospitals, with every shipment recorded and named staff responsible for dispensing it. This arrangement will require funding, inspections and trustworthy oversight.\n\nBoth sides want to keep dealers off the streets. They disagree on whether the door should remain open for hospitals. Shabrat must settle the question in law."
 ADISCORD_STP_pw.6.a: "A total ban. No exceptions."
 ADISCORD_STP_pw.6.b: "Allow medical use only."
