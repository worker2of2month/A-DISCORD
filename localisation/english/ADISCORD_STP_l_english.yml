 STP_ch_cooperate:0 "Joint production programme"
 STP_ch_cooperate_desc:0 "Fund another local training and joint production stage. Three stages provide grounds for renegotiating the mandate even without an external war. A 60-day interval applies; adviser influence grows. Stage 1 trains local industrial staff; stage 2 establishes domestic appointments; stage 3 builds one civilian factory in the capital, or grants two 50% industry research bonuses if no construction space remains."
