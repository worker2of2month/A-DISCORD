 STP_ch_fulfil_security_effect_tt:0 "Pledge to §YSecurity Service§! fulfilled: it will not cost §R−3% stability§! in the final review."
 STP_ch_pledge_army_effect_tt:0 "§YArmy Command§! votes at the congress go to [STPGetChapterNominee].\nIf that candidate wins, «Fulfil pledge: Army Command» appears. §RAn unfulfilled pledge§! worsens the final review."
 STP_ch_fulfil_army_effect_tt:0 "Pledge to §YArmy Command§! fulfilled: it will not cost §R−3% stability§! in the final review.\nAlso: §Rthe army gains emergency powers§!: you will later need «Ratify civilian control»."
 STP_ch_pledge_advisers_effect_tt:0 "§YNodrul advisers§! votes at the congress go to [STPGetChapterNominee].\nIf that candidate wins, «Fulfil pledge: Nodrul advisers» appears. §RAn unfulfilled pledge§! worsens the final review."
 STP_ch_fulfil_advisers_effect_tt:0 "Pledge to §YNodrul advisers§! fulfilled: it will not cost §R−3% stability§! in the final review.\nAlso: northern advisers regain access to the economy."
 STP_ch_pledge_merchants_effect_tt:0 "§YMerchants§! votes at the congress go to [STPGetChapterNominee].\nIf that candidate wins, «Fulfil pledge: Merchants» appears. §RAn unfulfilled pledge§! worsens the final review."
 STP_ch_fulfil_merchants_effect_tt:0 "Pledge to §YMerchants§! fulfilled: it will not cost §R−3% stability§! in the final review.\nAlso: trade income §G+5%§!; supply reserve created, trade crisis removed."
 STP_ch_pledge_radicals_effect_tt:0 "§YHedonist Radicals§! votes at the congress go to [STPGetChapterNominee].\nIf that candidate wins, «Fulfil pledge: Hedonist Radicals» appears. §RAn unfulfilled pledge§! worsens the final review."
 STP_ch_fulfil_radicals_effect_tt:0 "Pledge to §YHedonist Radicals§! fulfilled: it will not cost §R−3% stability§! in the final review.\nAlso: stability §G+2%§!, administration costs §R+3%§!, collective bargaining law."
 STP_ch_appoint_security_ministry_1_effect_tt:0 "Planning speed §G+2%§!. The army gains emergency powers (civilian control will be needed); with your own command, organisation §G+3%§!. The bonus is added permanently to the «The Renewed Presidium» spirit.\nThe other option in this pair becomes unavailable. «Majority commitments» needs one appointment in each of the three pairs."
 STP_ch_appoint_security_ministry_2_effect_tt:0 "Stability §G+1%§!. The bonus is added permanently to the «The Renewed Presidium» spirit.\nThe other option in this pair becomes unavailable. «Majority commitments» needs one appointment in each of the three pairs."
 STP_ch_appoint_economy_ministry_1_effect_tt:0 "All treasury income §G+1.5%§!. The bonus is added permanently to the «The Renewed Presidium» spirit.\nThe other option in this pair becomes unavailable. «Majority commitments» needs one appointment in each of the three pairs."
 STP_ch_appoint_economy_ministry_2_effect_tt:0 "Treasury capacity §G+5%§!. The bonus is added permanently to the «The Renewed Presidium» spirit.\nThe other option in this pair becomes unavailable. «Majority commitments» needs one appointment in each of the three pairs."
 STP_ch_appoint_appointments_1_effect_tt:0 "Political power gain §G+0.02§! per day. The bonus is added permanently to the «The Renewed Presidium» spirit.\nThe other option in this pair becomes unavailable. «Majority commitments» needs one appointment in each of the three pairs."
 STP_ch_appoint_appointments_2_effect_tt:0 "Administration costs §G−1.5%§!. The bonus is added permanently to the «The Renewed Presidium» spirit.\nThe other option in this pair becomes unavailable. «Majority commitments» needs one appointment in each of the three pairs."
 STP_ch_cooperate_effect_tt:0 "Joint programme stage: army experience §G+10§!, §YNodrul advisers§!: influence up to §Y+5 pp§!, support §G+12§!.\nStage 1 — local specialists (economy foundation); stage 2 — personnel service (appointments foundation); stage 3 — a civilian factory in the capital or two industry research bonuses.\nThree stages open the window to leave the protectorate. Repeatable after 60 days."
 STP_ch_request_release_effect_tt:0 "Nodrul receives the request and answers within §Y22 days§!. Consent means independence without war. Refusal or silence keeps the protectorate; you can ask again after 60 days."
 STP_ch_armed_break_effect_tt:0 "§RThe protectorate ends and war with Nodrul begins.§!\nVictory leads to your own congress without having to conquer the north. Defeat restores the protectorate; investments are kept."
 STP_ch_supply_buffer_effect_tt:0 "An independent supply reserve is created: §Gno trade crisis after the reforms§! (or it ends if already running)."
 STP_ch_civilian_control_effect_tt:0 "The army's emergency powers §Gno longer cause a military crisis§! in the final review."
 STP_ch_security_review_effect_tt:0 "The security service crisis §Gends§!; the directorate itself is kept."
 STP_ch_break_guarantees_effect_tt:0 "§YConservatives§!: support §G+8§!.\n§RNorthern guarantees are broken§!: unless restored before the final review ends, a northern crisis follows."
 STP_ch_restore_guarantees_effect_tt:0 "§YArmy Command§!: support §R−5§!. The northern treaty is restored and §Gthe northern crisis ends§!."
 STP_ch_aid_effect_tt:0 "Nodrul decides within §Y22 days§!. If it agrees: §G+6,000§! rifles and §G+450§! treasury; northern advisers regain access to the army and economy; §YNodrul advisers§!: influence up to §Y+5 pp§!, support §G+12§!.\nNext request no sooner than in 23 days."
 STP_ch_pressure_1_timeout_tt:0 "§RStage 2/4 «Sanctions and aid withdrawal» (120 days).§! While Nodrul keeps economic access, trade income §R−15%§!.\nNext target: the economy if its advisers are still there; otherwise appointments (the adviser caucus grows); otherwise the army.\nPressure stops if you accept the protectorate, or if Nodrul goes to war with Stelander or loses its independence."
 STP_ch_pressure_2_timeout_tt:0 "§RStage 3/4 «Intervention preparations» (90 days).§! The trade penalty under economic access remains.\nNext target: the economy if its advisers are still there; otherwise appointments (the adviser caucus grows); otherwise the army.\nPressure stops if you accept the protectorate, or if Nodrul goes to war with Stelander or loses its independence."
 STP_ch_pressure_3_timeout_tt:0 "§RStage 4/4 «Final ultimatum» (30 days).§! Invasion follows.\nNext target: the economy if its advisers are still there; otherwise appointments (the adviser caucus grows); otherwise the army.\nPressure stops if you accept the protectorate, or if Nodrul goes to war with Stelander or loses its independence."
 STP_ch_pressure_4_timeout_tt:0 "§RNodrul invades Stelander.§!\nPressure stops if you accept the protectorate, or if Nodrul goes to war with Stelander or loses its independence."
 STP_ch_crisis_deadline_timeout_tt:0 "The review concludes. Each unfulfilled pledge — stability §R−3%§!. No civilian control — military veto and stability §R−12%§!; broken northern treaty — Nodrul breaks away, stability §R−8%§!; no supply reserve — shortages for 180 days; no oversight of the security service — departmental veto, stability §R−8%§!. Problems already solved do not return."
