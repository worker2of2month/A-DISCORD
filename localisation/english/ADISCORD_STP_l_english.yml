 STP_party_inspection_state_2: "Inspect Officials in New Monaia"
 STP_party_inspection_state_2_desc: "The party commission is checking appointments, passes and telephone logs in New Monaia.\n\n§YWhen the timer ends§!, the commission will inspect the underground network in this district. Choose a response through map decisions before the inspection ends.\n\n§YIf we do nothing:§! garrison connections, supply and sabotage will be lost. The commission will also expose the administration or, if none exists, the local agreement; Livonin's ratified agreement is protected. An exposed network suspends local operations for §R56 days§!. Discovered connections or weapon reserves shift legitimacy §R4% towards the party§!; a fruitless inspection shifts it §G2% towards Shabrat§!.\n\n§YHow to respond:§!\n- §YDelay the Work§!: buy another 14 days for £political_power_texticon §Y35§!; the delay alone does not protect the network.\n- §YFalse Trail§!: prepare it in §Y7 days§! before the timer ends. It may preserve the network, but failure risks losses; the risk depends on suspicion on the day the commission finishes.\n- §YSurrender an Official§!: sacrifice the administration while preserving prepared military connections and stockpiles.\n- §YOpen the Registers§!: preserve the administration at the cost of the military network.\nBoth concessions take effect immediately, each costs £political_power_texticon §Y25§! and shifts legitimacy §R2% towards the party§!; work in the district will stop until the inspection ends. Response availability depends on focuses and local connections."
 STP_party_inspection_state_3: "Inspect Officials in Niansas Region"
 STP_party_inspection_state_3_desc: "The party commission is inspecting records, tank cars and district officials in Niansas Region.\n\n§YWhen the timer ends§!, the commission will inspect the underground network in this district. Choose a response through map decisions before the inspection ends.\n\n§YIf we do nothing:§! garrison connections, supply and sabotage will be lost. The commission will also expose the administration or, if none exists, the local agreement; Livonin's ratified agreement is protected. An exposed network suspends local operations for §R56 days§!. Discovered connections or weapon reserves shift legitimacy §R4% towards the party§!; a fruitless inspection shifts it §G2% towards Shabrat§!.\n\n§YHow to respond:§!\n- §YDelay the Work§!: buy another 14 days for £political_power_texticon §Y35§!; the delay alone does not protect the network.\n- §YFalse Trail§!: prepare it in §Y7 days§! before the timer ends. It may preserve the network, but failure risks losses; the risk depends on suspicion on the day the commission finishes.\n- §YSurrender an Official§!: sacrifice the administration while preserving prepared military connections and stockpiles.\n- §YOpen the Registers§!: preserve the administration at the cost of the military network.\nBoth concessions take effect immediately, each costs £political_power_texticon §Y25§! and shifts legitimacy §R2% towards the party§!; work in the district will stop until the inspection ends. Response availability depends on focuses and local connections."
 STP_party_inspection_state_29: "Inspect Officials in Kreiden"
 STP_party_inspection_state_29_desc: "The party commission is counting shifts, passes and factory seals in Kreiden.\n\n§YWhen the timer ends§!, the commission will inspect the underground network in this district. Choose a response through map decisions before the inspection ends.\n\n§YIf we do nothing:§! garrison connections, supply and sabotage will be lost. The commission will also expose the administration or, if none exists, the local agreement; Livonin's ratified agreement is protected. An exposed network suspends local operations for §R56 days§!. Discovered connections or weapon reserves shift legitimacy §R4% towards the party§!; a fruitless inspection shifts it §G2% towards Shabrat§!.\n\n§YHow to respond:§!\n- §YDelay the Work§!: buy another 14 days for £political_power_texticon §Y35§!; the delay alone does not protect the network.\n- §YFalse Trail§!: prepare it in §Y7 days§! before the timer ends. It may preserve the network, but failure risks losses; the risk depends on suspicion on the day the commission finishes.\n- §YSurrender an Official§!: sacrifice the administration while preserving prepared military connections and stockpiles.\n- §YOpen the Registers§!: preserve the administration at the cost of the military network.\nBoth concessions take effect immediately, each costs £political_power_texticon §Y25§! and shifts legitimacy §R2% towards the party§!; work in the district will stop until the inspection ends. Response availability depends on focuses and local connections."
 STP_party_inspection_state_45: "Inspect Officials in Livonin District"
 STP_party_inspection_state_45_desc: "The party commission is investigating whom the Livonin council is discussing a future without Fada with.\n\n§YWhen the timer ends§!, the commission will inspect the underground network in this district. Choose a response through map decisions before the inspection ends.\n\n§YIf we do nothing:§! garrison connections, supply and sabotage will be lost. The commission will also expose the administration or, if none exists, the local agreement; Livonin's ratified agreement is protected. An exposed network suspends local operations for §R56 days§!. Discovered connections or weapon reserves shift legitimacy §R4% towards the party§!; a fruitless inspection shifts it §G2% towards Shabrat§!.\n\n§YHow to respond:§!\n- §YDelay the Work§!: buy another 14 days for £political_power_texticon §Y35§!; the delay alone does not protect the network.\n- §YFalse Trail§!: prepare it in §Y7 days§! before the timer ends. It may preserve the network, but failure risks losses; the risk depends on suspicion on the day the commission finishes.\n- §YSurrender an Official§!: sacrifice the administration while preserving prepared military connections and stockpiles.\n- §YOpen the Registers§!: preserve the administration at the cost of the military network.\nBoth concessions take effect immediately, each costs £political_power_texticon §Y25§! and shifts legitimacy §R2% towards the party§!; work in the district will stop until the inspection ends. Response availability depends on focuses and local connections."
 STP_party_inspection_state_46: "Inspect Officials in Hoskheit"
 STP_party_inspection_state_46_desc: "The party commission is checking port keys, warehouse ledgers and night-shift lists in Hoskheit.\n\n§YWhen the timer ends§!, the commission will inspect the underground network in this district. Choose a response through map decisions before the inspection ends.\n\n§YIf we do nothing:§! garrison connections, supply and sabotage will be lost. The commission will also expose the administration or, if none exists, the local agreement; Livonin's ratified agreement is protected. An exposed network suspends local operations for §R56 days§!. Discovered connections or weapon reserves shift legitimacy §R4% towards the party§!; a fruitless inspection shifts it §G2% towards Shabrat§!.\n\n§YHow to respond:§!\n- §YDelay the Work§!: buy another 14 days for £political_power_texticon §Y35§!; the delay alone does not protect the network.\n- §YFalse Trail§!: prepare it in §Y7 days§! before the timer ends. It may preserve the network, but failure risks losses; the risk depends on suspicion on the day the commission finishes.\n- §YSurrender an Official§!: sacrifice the administration while preserving prepared military connections and stockpiles.\n- §YOpen the Registers§!: preserve the administration at the cost of the military network.\nBoth concessions take effect immediately, each costs £political_power_texticon §Y25§! and shifts legitimacy §R2% towards the party§!; work in the district will stop until the inspection ends. Response availability depends on focuses and local connections."
 STP_party_inspection_state_53: "Inspect Officials in Old Fadian Forest"
 STP_party_inspection_state_53_desc: "The party commission is questioning foresters, road supervisors and village elders in Old Fada.\n\n§YWhen the timer ends§!, the commission will inspect the underground network in this district. Choose a response through map decisions before the inspection ends.\n\n§YIf we do nothing:§! garrison connections, supply and sabotage will be lost. The commission will also expose the administration or, if none exists, the local agreement; Livonin's ratified agreement is protected. An exposed network suspends local operations for §R56 days§!. Discovered connections or weapon reserves shift legitimacy §R4% towards the party§!; a fruitless inspection shifts it §G2% towards Shabrat§!.\n\n§YHow to respond:§!\n- §YDelay the Work§!: buy another 14 days for £political_power_texticon §Y35§!; the delay alone does not protect the network.\n- §YFalse Trail§!: prepare it in §Y7 days§! before the timer ends. It may preserve the network, but failure risks losses; the risk depends on suspicion on the day the commission finishes.\n- §YSurrender an Official§!: sacrifice the administration while preserving prepared military connections and stockpiles.\n- §YOpen the Registers§!: preserve the administration at the cost of the military network.\nBoth concessions take effect immediately, each costs £political_power_texticon §Y25§! and shifts legitimacy §R2% towards the party§!; work in the district will stop until the inspection ends. Response availability depends on focuses and local connections."
