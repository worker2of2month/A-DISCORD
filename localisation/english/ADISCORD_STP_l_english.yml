 STP_party_civil_service_program_unlock_summary_tt:0 "Accelerates state development for 42 days."
 STP_ps_build_hq_unlock_summary_tt:0 "Prepares reserve headquarters to restore the cabinet faster."
 STP_ps_prepare_evacuation_unlock_summary_tt:0 "Prepares evacuation and requests asylum from Nodrul."
 STP_ps_evacuate_funds_unlock_summary_tt:0 "Reserves funds for exile; refused asylum means losing them."
 STP_ps_fund_nod_unlock_summary_tt:0 "Funds Nodrul's arms purchases."
 STP_ps_arm_nod_unlock_summary_tt:0 "Delivers weapons to Nodrul's northern front."
