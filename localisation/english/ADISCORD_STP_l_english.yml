 STP_ch_pledge_conservatives_effect_tt:0 "§YConservatives§! votes at the congress go to [STPGetChapterNominee].\nIf that candidate wins, «Fulfil pledge: Conservatives» appears. §RAn unfulfilled pledge§! worsens the final review."
