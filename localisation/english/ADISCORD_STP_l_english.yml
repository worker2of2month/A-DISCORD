 STP_ch_pledge_borons_effect_tt:0 "§YBorons§! votes at the congress go to [STPGetChapterNominee].\nIf that candidate wins, «Fulfil pledge: Borons» appears. §RAn unfulfilled pledge§! worsens the final review."
 STP_ch_fulfil_borons_effect_tt:0 "Pledge to §YBorons§! fulfilled: it will not cost §R−3% stability§! in the final review.\nAlso: administration costs §G−4%§!."
