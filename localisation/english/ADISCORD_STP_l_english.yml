 ADISCORD_STP_cw.80.frontier_subject:0 "The Northern Defence Alliance has been crushed. Nodrul has abolished the government of the Cult of the Children of the Forest and installed a dependent administration within Yuboria's historical borders. The Free Frontier has capitulated; it keeps its statehood, but now under Nodrul's rule.\n\nNew dependent states and lands under direct Nodrul administration have appeared in the north. Local institutions must comply with the victor's terms, and Nodrul's command can move the freed-up troops south."

# Campaign briefing
 STP_startup_country:0 "§YSTELANDER IN 2160§!\n\nStelander survived an almost endless war with Vorkerland and kept its own flag, but peace transformed the country as deeply as the bombings did. Nodrul's hedonist revolution arrived through money, advisers and local allies; after the Fada Pact, Stelander became a dependent §Yshadow state of Nodrul§!.\n\n§YPyotr Ivanov and the party§!\nIvanov is the man who stopped the raids and made peace the foundation of the regime. Around him grew the Chamber of High Houses: it promises personal freedom and limited government, while the High Houses control licences, ports, media and access to wealth. Behind the resort showcase lie poor mountain districts, political dependence and the Lower Market — a network of human trafficking and de facto slavery protected by connections inside the apparatus.\n\n§YMaksim Shabrat§!\nShabrat leads the resistance. He wants to break the party's political monopoly, expose the regime's archives and restore the country's ability to determine its own future. His network relies on districts, officials, miners, former soldiers and part of the officer corps. Votes are not enough: he needs functioning administrations, weapons and agreements with the army.\n\n§YSuccession crisis§!\nIvanov is gravely ill. Once his personal authority disappears, the party, the resistance and foreign patrons will be fighting not merely for the presidency, but for the structure of the state itself."
 STP_startup_guide:0 "§YFIRST STEPS§!\n\n§Y1. Choose a side.§! The opening focuses introduce the crisis. The main mechanics open after you commit to Shabrat or the Party.\n\n§Y2. Treat the opening tree as a deadline.§! You are not expected to finish every opening focus before the crisis advances. Pick the programme that matters most. Leaving useful focuses unfinished is part of the intended tradeoff.\n\n§Y3. Prepare selectively.§! As Shabrat, secure one or two key districts and the army agreements that make them usable. As the Party, answer announced operations, preserve apparatus loyalty and protect the districts that matter instead of searching everywhere.\n\n§Y4. Read the gauges literally.§! On the election balance, the Party is on the left and Shabrat is on the right. Suspicion controls commission pressure. Shared slots limit simultaneous operations. Bright district colours show who is positioned to receive the state at the split.\n\n§Y5. Economy and debt.§! Treasury is cash on hand and weekly balance is the recurring flow. Borrowing is an intended tool when a timed objective arrives before the cash does, but interest makes it a strategic tradeoff. Open the Economy screen to compare income, expenses, debt and the deadline before simply waiting for cash to accumulate.\n\n§Y6. Technology.§! Follow prerequisite lines and read the practical effect before the flavour text. Industrial technologies often trade factory output, construction or extraction gains against higher energy demand. Permanent specialisation choices can lock the alternative branch.\n\n§Y7. Keep a real reserve.§! Prepared formations still consume manpower and equipment. The election grants a mandate, not free divisions, and it does not end the crisis. Check active missions before committing to a long focus."
 STP_startup_guide_history_title:0 "From War to Revolution"
 STP_startup_guide_history:0 "§YHOW MODERN STELANDER WAS CREATED§!\n\nBefore Ivanov's regime, the country called itself Steland: a union of mountain communities, towns and military associations that had resisted Vorkerland expansion for decades. Resistance saved the country from direct conquest, but made mobilisation, shortages and air-raid alarms part of ordinary life.\n\nAgainst that background, Nodrul underwent the Hedonist Revolution. An alliance of aristocrats, wealthy houses and privileged guilds replaced the old order with a promise of personal freedom, consumption and the right not to take part in politics. After victory, Nodrul began exporting the model.\n\nIn Steland, the coup was supported by Nodrul money, propaganda, intermediaries and part of the local elite. Foreign pressure mattered, but so did war exhaustion: much of the population was ready to accept almost any order that could end the conflict. That is how an imported revolution could be presented as national salvation."
 STP_startup_guide_nodrul_title:0 "Ivanov and Nodrul"
 STP_startup_guide_nodrul:0 "§YWHY WE DEPEND ON NODRUL§!\n\nPyotr Ivanov built his legitimacy on one achievement: the Fada Pact stopped Vorkerland's air raids. In exchange for peace, Stelander disarmed parts of the old mountain alliances, opened its ports, accepted trade concessions and admitted Nodrul advisers, lawyers and political missions.\n\nThis became the §Yshadow mandate§!. Nodrul does not administer every ministry directly. The dependency runs deeper: credit, recognition, party schools, media, consultants and part of the elite personnel are tied to the northern patron. Stelander formally retains a government and an army, but the regime's external support and much of its political language sit inside the Nodrul system.\n\nIvanov was the ideal intermediary. His authority made concessions look like the price of peace rather than subordination. His illness therefore threatens Nodrul as much as the party: after his death, the mandate will have to prove its “voluntary” character without the man who created it."
 STP_startup_guide_party_title:0 "The Party and the Lower Market"
 STP_startup_guide_party:0 "§YWHAT THE PARTY'S SHOWCASE HIDES§!\n\nThe Chamber of High Houses promises private freedom, cheap pleasure and a state that asks few questions. For many people this really is better than generations of war, which is precisely why the regime cannot be reduced to fear alone.\n\nBut wealth is distributed extremely unevenly. The High Houses and guilds control licences, ports, mines and profitable contracts; the capital and resorts grow faster than the highlands, where schools close and local institutions fail to reproduce their own specialists. The party increasingly imports expertise from Nodrul rather than developing it at home.\n\nThe darkest layer is the §YLower Market§!: a network of clubs, warehouses, agencies, fraudulent contracts and private security through which abducted people, forced labour and child trafficking pass. It is de facto slavery wrapped in commercial paperwork. Parts of the police and bureaucracy protect it because a complete payment ledger could reveal not one isolated crime, but the architecture of the regime."
 STP_startup_guide_shabrat_title:0 "How to Play the Crisis"
 STP_startup_path_0_title:0 "Shabrat's course"
 STP_startup_path_1_title:0 "Party course"
 STP_startup_path_0:0 "§YSHABRAT'S COURSE§!\n\nThe resistance seeks power through public support, district organisation and military agreements. Its position depends on more than the election result: institutions and formations must survive the preparation period.\n\nThis route requires dividing limited resources between the political campaign and practical military readiness. A strong mandate helps, but cannot replace functioning administrations and reliable command.\n\nReveal the requirements to read about the exceptional election outcome."
 STP_startup_path_1:0 "§YPARTY COURSE§!\n\nPreserve party rule after the departure of the leader who held the old order together. District institutions, security and army command become the foundations of the struggle against the resistance.\n\nThe opening programme is deliberately time-limited. You will not finish every useful focus, so decide which political, military and financial preparations the Party actually needs before the split.\n\nPolitical victory grants a mandate, but does not eliminate armed conflict. Preparation must provide troops with recruits, weapons and defensible positions before the split. Later choices follow the events and focuses available after the war."
 STP_startup_path_0_details:0 "§YSHABRAT: EXCEPTIONAL OUTCOME REQUIREMENTS§!\n\nA limited party revolt requires all of the following:\n- Shabrat's side chosen, with Shabrat available and not arrested;\n- legitimacy of at least 80%;\n- a surviving public command agreement;\n- Ravel available and not arrested, with a prepared garrison in [2.GetName] or [29.GetName];\n- resistance administrations in [2.GetName] and [3.GetName], owned and controlled by your country and continuously active for more than 20 days.\n\nThese conditions are checked when the election is resolved. An ordinary victory does not guarantee this outcome. Failing one condition preserves individual preparation results, but leaves the larger military split in place.\n\nThe northern neighbour prepares intervention separately; peace on its front does not imply immediate entry."
 STP_startup_path_1_details:0 "§YPARTY: ELECTIONS AND CIVIL WAR§!\n\nA party victory determines the mandate; it does not cancel the civil war. Before the crisis resolves, use available party decisions and check district and army readiness.\n\nLocal preparation affects the distribution of territory, stockpiles and troops. Political strength should not be mistaken for payment for new formations.\n\nThe story's side choice and creation of wartime participants are separate stages. Read any offer to switch countries before answering: it determines the campaign you continue and the recipient of prepared forces.\n\nDo not assume external aid is automatic. Neighbouring intervention depends on those countries' own situations and event conditions."
