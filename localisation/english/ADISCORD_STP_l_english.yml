 STP_cw_strike_squadrons:0 "Assemble the Flight Reserve"
 STP_cw_strike_squadrons_desc:0 "Some air units stayed with the Party. Before promising continuous cover, we must restore reserve aircraft and assemble ground crews. The workshops need time and money."
 STP_cw_forward_airstrips:0 "Closer to the Firing Line"
 STP_cw_forward_airstrips_desc:0 "Expand Abliya and prepare a forward strip. Coordinated strike sorties become available first; the second aircraft batch waits for a unified flight schedule."
 STP_cw_assault_air_cover:0 "One Flight Schedule"
 STP_cw_assault_air_cover_desc:0 "Coordinate ground requests, workshop shifts and flight schedules. Both aircraft batches and timed air operations become available. The same crews cannot support a strike operation and restore reserve aircraft simultaneously."
 STP_cw_assault_air_cover_idea:0 "Air Cover for the Assault"
 STP_cw_assault_air_cover_idea_desc:0 "Shabrat's attack aircraft escort the columns and suppress the Party's firing positions."
 STP_party_presidium_broadcast:0 "Address by the Presidium"
 STP_party_presidium_broadcast_desc:0 "Rumours of the split reached the districts before the government's orders. The Presidium must state the purpose of the war and explain why the internal troops continue to fight. A unified bulletin will connect the Party secretaries' speeches with the situation at the front."
 STP_party_front_correspondents:0 "Party Correspondents"
 STP_party_front_correspondents_desc:0 "District newspapers have people on both sides of the front. The security service will combine their reports on transport, garrisons and public sentiment into a common assessment. Expanding its powers will strengthen the service and provoke discontent among the borons."
 STP_party_family_commissions:0 "Family Assistance Commissions"
 STP_party_family_commissions_desc:0 "People wait at reception offices for news of the missing, confirmation of service and help finding places for their children. We will assign specific servicemen's families to district commissions. Party support must be felt beyond the barracks as well."
 STP_party_regimental_organizers:0 "Regimental Party Organisers"
 STP_party_regimental_organizers_desc:0 "We will send organisers into the regiments who know how to resolve complaints, relay orders and work with headquarters. Command needs contact with the people in the units, and the Presidium needs to know how its decisions are being carried out. This network's emergency powers will remain in effect until civilian government is restored."
 STP_party_district_supply:0 "The Districts Supply the Front"
 STP_party_district_supply_desc:0 "Family commissions know conditions in the districts, while regimental organisers know what the units need. We will combine their requests with transport manifests. Checking recipients and return journeys will reduce losses between the district depot and the front."
 STP_party_northern_lesson:0 "The Northern Lesson"
 STP_party_northern_lesson_desc:0 "Nodrul's assistance has ended in defeat. The staff must honestly recount its reserves, remove the promised columns from its maps and tell the units what they can still rely on."
 STP_party_without_patrons:0 "Without Patrons"
 STP_party_without_patrons_desc:0 "The party existed long before Nodrul's advisers and will survive their departure. New orders and appeals must convince the army and the districts that this war is our own."
 STP_pw_party_veterans_congress:0 "Congress of Frontline Delegates"
 STP_pw_party_veterans_congress_desc:0 "The new leadership must hear the people who kept the Party in power. Delegates from the units and districts demand decisions on the future of the demobilised, assistance for families and the place of veterans in the state after Ivanov. The congress's resolutions will become the Presidium's commitment to the victors."
 STP_pw_party_family_pensions:0 "Pensions for the Families of the Fallen"
 STP_pw_party_family_pensions_desc:0 "We will turn military certificates into a permanent register of families who have lost their breadwinner. District authorities will receive uniform rules for payments and disputed cases. These guarantees will strengthen trust in the state, but maintaining them will require ongoing expenditure."
 STP_pw_party_civilian_retraining:0 "Civilian Trades for Veterans"
 STP_pw_party_civilian_retraining_desc:0 "Enterprises need skilled workers, and demobilised soldiers need jobs after long service. Technical schools will open accelerated courses linked to orders from construction and manufacturing organisations."
 STP_pw_party_veteran_reserve:0 "Veterans in the Training Reserve"
 STP_pw_party_veteran_reserve_desc:0 "Experienced sergeants and junior officers will become instructors in reserve units. Their service will speed up the training of replacements for the regular army."
 STP_pw_party_social_guarantees:0 "Secure Social Guarantees"
 STP_pw_party_social_guarantees_desc:0 "Pension lists have been compiled, and the future of the demobilised has been settled. We will make these commitments part of the district authorities' regular work. For families, the Party's victory will mean something concrete: the assistance they are entitled to, a clear place of service, or the opportunity to return to civilian work."

 # Siege vehicle special project
 STP_sp_taran:0 "Project Taran"
 STP_sp_taran_desc:0 "A heavy assault vehicle for Shabrat's shield infantry. A low armoured casemate, broad tracks and a short gun support urban assaults and attacks on fortified positions. Its protection and firepower come at the cost of low speed, expensive production and high supply demand.\n\nResearch requires a land warfare facility, a scientist and the $ADISCORD_tech_hardened_computers$, $ADISCORD_tech_automated_assembly$ and $ADISCORD_tech_heavy_composite_cores$ technologies. Completion unlocks serial production, delivers one prototype to the stockpile and creates an editable assault group template. Recruiting it requires the remaining vehicles, equipment and personnel from our own reserves."
 STP_taran:0 "Taran Siege Vehicles"
 STP_taran_desc:0 "A heavy assault battalion with 24 Taran vehicles and support equipment. Strong in cities and against fortifications, but slow and demanding to supply. Mountains and marshes severely limit its effectiveness."
 STP_taran_equipment:0 "Taran Siege Vehicle"
 STP_taran_equipment_short:0 "Taran"
 STP_taran_equipment_desc:0 "An armoured tracked vehicle supporting shield infantry at close range. Its heavy short-barrelled gun is intended to suppress infantry and fortified positions."
 STP_taran_equipment_1:0 "TSh-63 Taran"
 STP_taran_equipment_1_short:0 "TSh-63"
 STP_taran_equipment_1_desc:0 "$STP_taran_equipment_desc$"
 STP_taran_project_unlocked_tt:0 "Gives access to the §YTaran§! special project at a land warfare facility."
 STP_taran_template_tt:0 "Creates the editable §YTaran Assault Group§! template: one siege vehicle battalion, four shield infantry battalions and an engineer company. Recruitment requires our own personnel and equipment."
 STP_pw_party_naval_staff:0 "Republican Naval Staff"
 STP_pw_party_naval_staff_desc:0 "A unified naval staff will organise surviving ships, train crews and coordinate new designs with army requirements."
 STP_pw_party_naval_yards:0 "Republican Dockyards"
 STP_pw_party_naval_yards_desc:0 "Build dockyards in a controlled port to sustain the republican fleet and replace losses."
 STP_pw_party_naval_escorts:0 "Republican Destroyers"
 STP_pw_party_naval_escorts_desc:0 "Commission restored destroyers and convoys to protect the fleet and its supply routes."
 STP_pw_party_battle_squadron:0 "Republican Cruiser Squadron"
 STP_pw_party_battle_squadron_desc:0 "A sustained restoration programme will return heavy cruisers to service as the core of the surface squadron."
 STP_pw_party_naval_fire_support:0 "Guns off the Coast"
 STP_pw_party_naval_fire_support_desc:0 "Light cruisers will reinforce the escorts while the landing staff coordinates embarkation, bombardment and port supply."
 STP_pc_navy_capital:0 "Flagship of Stelander"
 STP_pc_navy_capital_desc:0 "Restore a heavy cruiser and train its crew to support the escort fleet and coastal landings."

 # Campaign epilogues
 STP_epilogue_continue:0 "The story continues."
 STP_epilogue_thanks_tt:0 "Thank you for playing A-Discord! You can continue this campaign or start a new one to discover another path."
 STP_epilogue_thanks:0 "The A-Discord team thanks you for playing. Thank you for guiding this country through war, choosing its future and staying with its characters to this page. We hope the story has left you with more than a new border on the map.\n\nThis is the epilogue to your chosen path. You can continue playing: remaining focuses, decisions and events stay available. In a new campaign, different choices will lead to another story."
 ADISCORD_STP_ch.60.t:0 "Epilogue: Signatures on a Common Charter"
 ADISCORD_STP_ch.60.a_desc:0 "Crow's chamber debates late into the evening. Houses count their contributions, districts demand what they were promised, and the secretary rewrites the minutes. This dull routine conceals an achievement of peace: a disagreement can now leave the square in a folder instead of on a stretcher.\n\nYou led the Party to a charter that binds ownership to responsibility. It will not prevent new disputes. But the next generation will have a table at which to begin them.\n\n$STP_epilogue_thanks$"
 ADISCORD_STP_ch.60.b_desc:0 "The old houses keep their windows lit after dark. Pedigrees open doors again, patronage becomes office, and a handshake carries more weight than a public speech. Crow has secured an order his allies know how to understand and defend.\n\nYou preserved the republic by entrusting it to familiar families. Some see restored confidence; others see that peace need not bring equality. Beyond those gates, another generation is growing up with questions about its place.\n\n$STP_epilogue_thanks$"
 ADISCORD_STP_ch.61.t:0 "Epilogue: When the Festival Ends"
 ADISCORD_STP_ch.61.a_desc:0 "By dawn the square is empty. Workers dismantle the stage, someone carries a child home, and musicians share the last tea. Tomorrow will bring the same need for bread, medicine and repairs. But tonight belonged to everyone who chose to come.\n\nYou brought Hedersett's path to the open squares. Celebration neither erased the war nor paid for reconstruction. It gave people a reason to gather beyond orders and fear. That freedom will now need protecting on ordinary days.\n\n$STP_epilogue_thanks$"
 ADISCORD_STP_ch.61.b_desc:0 "The club lights go out, but its service entrance remains open. Guests depart, the staff begin another shift, and the manager checks tomorrow's invitations. Under Hedersett, pleasure has become an industry and admission a mark of rank.\n\nYou built an order of privileged clubs. Its patrons know how to arrange magnificent evenings and pay the right bills. Behind their music are the voices of those who set the tables. The republic's future depends on them too.\n\n$STP_epilogue_thanks$"
 ADISCORD_STP_ch.62.t:0 "Epilogue: After the Last Order"
 ADISCORD_STP_ch.62.a_desc:0 "Weil's headquarters posts a new schedule: exercises, barracks repairs and border duty. Veterans learn to live without waiting for an offensive; civilian institutions make decisions in their own name again. Peace proves to be a craft of its own.\n\nYou allowed the army to return to service. Its experience remains with the country, but war no longer explains every part of government. The hardest order may be to admit that one need not command everything.\n\n$STP_epilogue_thanks$"
 ADISCORD_STP_ch.62.b_desc:0 "Maps and economic reports arrive at the meeting together. Weil listens as carefully as he once listened to dispatches from the front. Factories, districts and roads form one plan, with a deadline and an officer responsible for each task.\n\nYou left the republic under command. It knows how to rally before danger and carry out difficult orders. Those born after the war will judge it differently: by how much room the formation leaves for a life of their own.\n\n$STP_epilogue_thanks$"
 ADISCORD_STP_ch.63.t:0 "Epilogue: Open Until Evening"
 ADISCORD_STP_ch.63.a_desc:0 "A new sign appears on a workshop door. Inside, people argue over metal prices, wait for a customer and teach an apprentice to hold a tool. To Lansky, these small businesses form a country that can no longer be held together by a single order.\n\nYou chose independent workshops. Their freedom requires working courts, clear rules and daily labour. But the future can now begin beyond the capital, assembled at thousands of separate benches.\n\n$STP_epilogue_thanks$"
 ADISCORD_STP_ch.63.b_desc:0 "The contract fills several folders. Industrialists, banks and a government representative have signed it. The factories are already preparing new shifts. Lansky has achieved a scale that a small workshop could only dream of.\n\nYou bound the republic together through major orders. Production grew, and so did obligations to everyone who trusted the promised output. Today the signatures look like victory. Their true weight will be measured by those reporting to the machines tomorrow.\n\n$STP_epilogue_thanks$"
 ADISCORD_STP_ch.64.t:0 "Epilogue: The Right to Open the File"
 ADISCORD_STP_ch.64.a_desc:0 "The commission receives a reply, complete with dates, signatures and explanations that must withstand public scrutiny. Korvina's department resents the request, but hands over the documents. The service is learning that questions can be asked of it too.\n\nYou kept the state's protection while defining its legal limits. No charter enforces itself. Yet the person across the official's desk now has more than an appeal for mercy: they have grounds to demand an answer.\n\n$STP_epilogue_thanks$"
 ADISCORD_STP_ch.64.b_desc:0 "The lights go out one row at a time in Korvina's archive. Cards retain names, connections and assessments of loyalty. By morning, some of these notes will become decisions whose origins nobody will explain.\n\nYou built a state of sealed dossiers. It hears a great deal and knows how to warn its opponents. Its citizens have learned caution too. Even when the streets are quiet, they remember that every sentence may have a second listener.\n\n$STP_epilogue_thanks$"
 ADISCORD_STP_ch.65.t:0 "Epilogue: At the Northern Table"
 ADISCORD_STP_ch.65.a_desc:0 "Renner opens the negotiation folder. This time it contains more than outside demands: local institutions have prepared accounts, revenue figures and proposals they can stand behind. The northern representative must listen longer than usual.\n\nYou gave the country grounds to speak in its own voice. This does not itself change its international status or erase signed obligations. But the distance between pleading for relief and arriving prepared for negotiations has now been crossed.\n\n$STP_epilogue_thanks$"
 ADISCORD_STP_ch.65.b_desc:0 "Northern statements arrive on schedule. Renner checks the terms, local offices distribute funds, and restored services begin another working day. A provisional arrangement has become an everyday order.\n\nYou chose stability under northern patronage. It supported reconstruction while preserving the price of dependence in each new account. For those who survived collapse and war, this may be a welcome reprieve. The next generation will inherit the question of its cost.\n\n$STP_epilogue_thanks$"
 ADISCORD_STP_pc.60.t:0 "Epilogue: The Weight of a Common Order"
 ADISCORD_STP_pc.60.d:0 "The map on the capital's desk shows the order the country has worked towards. The northern ring no longer closes in, and Kefreyt no longer dictates terms by force. The main roads of the new order lead to a single centre.\n\nYou brought Shabrat's hegemony to its regional conclusion. This outcome made possible what had once been a speech: a shared system of administration, supply and obligations. Now every broken road and empty warehouse will become the responsibility of those who shape this order.\n\nWhen the bands fall silent, the first stack of ordinary cases leaves the office. The order established on the map must still be sustained every day.\n\n$STP_epilogue_thanks$"
 ADISCORD_STP_pc.61.t:0 "Epilogue: The Right to Stand Beside"
 ADISCORD_STP_pc.61.d:0 "Several identical tables await the delegates. Accepting an invitation, contesting its terms or declining it are now decisions for the neighbouring governments themselves. The undertaking begun by Shabrat has acquired a measure beyond the number of obedient capitals.\n\nYou brought the republican course to a coalition of equals. Its strength depends on consent, and freedom of choice includes the possibility of an unwelcome answer. This was why emergency powers were limited and space restored to civilian institutions.\n\nThe future remains open. At this table, at least, it can be discussed without first demanding submission.\n\n$STP_epilogue_thanks$"
 ADISCORD_STP_pc.62.t:0 "Epilogue: Who Keeps the Seal"
 ADISCORD_STP_pc.62.directory:0 "Emergency rule is no longer a countdown. The military directorate remains: its signatures approve budgets, its orders define service, and its officers answer for the state. The future could no longer be postponed - postponement itself became the decision.\n\nYou completed the political path of military rule. Its supporters see a guarantee against another catastrophe. Others ask when the country will be able to live without permanent supervision from headquarters. The answer lies beyond the last order, in the ordinary days ahead.\n\n$STP_epilogue_thanks$"
 ADISCORD_STP_pc.62.gornin:0 "Gornin's name appears on the new letterhead. The military handover has brought in a man who intends to speak to the districts through civilian representation. His own programme still needs decisions and work; a new signature cannot enact it for him.\n\nYou brought the country to a point where its seal could pass beyond the circle of commanders. After the war, having that choice matters in itself. The promised civilian order must now acquire substance.\n\n$STP_epilogue_thanks$"
 ADISCORD_STP_pc.62.vera:0 "Vera Tikh accepts the folders of unfinished business. Lists, appointments and economic accounts are the material from which she must build her order. The handover opened her path without answering any of tomorrow's questions.\n\nYou chose a successor for whom government begins with a record of people and obligations. Behind the tidy rows are living fates. The character of this administration will emerge in how it treats those who do not fit a prepared column.\n\n$STP_epilogue_thanks$"
 ADISCORD_STP_pc.62.shabrat:0 "The seal returns to Shabrat. He comes back to a country that has experienced victory, military rule and the possibility of choosing another signature. It cannot return to the beginning: its obligations remain in force.\n\nYou settled the succession by bringing back the founder. He must now live alongside institutions created after his first struggle for power. This story leaves him facing responsibility for what has already been written, rather than a blank page.\n\n$STP_epilogue_thanks$"
 ADISCORD_STP_pc.62.retained:0 "No new letterhead will be printed. A handover was discussed, but the seal remains with the current leader. The office clears away the spare folders and its staff return to work.\n\nYou settled the succession by retaining the incumbent. This does not make the promised transfer a completed fact, nor does it revoke existing laws. The country will live with the chosen signature, while its future takes shape through the orders that follow.\n\n$STP_epilogue_thanks$"
