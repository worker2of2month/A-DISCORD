 STP_pw_party_north_subject_status: "The country returned to Nodruls protectorate. Northern aid comes with limits on independence."
 STP_pw_party_north_victory_status: "The northern threat has ended; Nodrul did not restore the protectorate."
 STP_pw_party_north_war_status: "The war with Nodrul is underway."
 STP_pw_party_north_pending_status: "Nodrul is considering the offer. The invasion deadline continues to approach."
 STP_pw_party_north_refused_status: "No agreement was reached. Negotiations did not extend the northern deadline."
