 STP_pw_party_command_security_status: "The security service approves officer appointments; commanders must address its objections."
 STP_pw_party_command_unset_status: "Authority between the staff and security service remains unsettled."
 STP_pw_party_credit_contracts_status: "Recovery rests on funded trading-house contracts and protection against seizures."
 STP_pw_party_credit_requisition_status: "Emergency seizures filled the treasury at the cost of lower income; distribution remained with the state."
