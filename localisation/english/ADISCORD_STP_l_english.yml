 STP_pe_security_policy_b_idea_desc:0 "Korvina will retain personal control of the material. The directorate gains an instrument of discipline, while citizens remain unable to explain why some allegations proceed and others disappear. Remains in force until the final settlement."
 STP_pe_security_crisis:0 "The Case Against the Victors"
 STP_pe_security_crisis_desc:0 "The dispute has halted fulfilment of obligations. Complete the unlocked programme or choose a settlement in the event."
 STP_pe_security_backlash:0 "Closed Departmental Purge"
 STP_pe_security_backlash_desc:0 "The dispute was settled through temporary concessions. Their cost survives a change of party leader."
 STP_pe_security_ending_a_idea:0 "A Service Within the Law"
 STP_pe_security_ending_a_idea_desc:0 "The service retains its powers within a verifiable procedure. Public confidence improves, while the directorate accepts the costs of accountability."
 STP_pe_security_ending_b_idea:0 "The State of Closed Dossiers"
 STP_pe_security_ending_b_idea_desc:0 "Closed dossiers become the basis of government. Orders are enforced more confidently, but stability rests on fear of whoever controls the archive."
 STP_pe_security_programme:0 "Independent Review of Wartime Files"
 STP_pe_security_programme_desc:0 "The commission will prepare fulfilment before the settlement date or resolve an existing dispute. Work takes 35 days and survives a change of party leader. Capitulation or the fall of party rule returns the deposit; political costs are not refunded."
 ADISCORD_STP_ch.44.t:0 "The Case Against Our Own"
 ADISCORD_STP_ch.44.d:0 "Korvina recognises the signatures in a new file. One order bears the name of the man who saved party headquarters; another belongs to an official now judging everyone else's loyalty. Her staff suggest postponement for the unity of the victors. The material must enter the common register in ninety days. An independent review can separate evidence from departmental revenge before the confrontation becomes public."
 ADISCORD_STP_ch.44.a:0 "Begin the preparations."
 ADISCORD_STP_ch.50.t:0 "The Case Against the Victors"
 ADISCORD_STP_ch.50.d:0 "Copies of wartime orders have escaped the directorate. Relatives of detainees demand answers, while officials accuse investigators of undermining victory. Korvina can fund an urgent independent review, conduct a closed purge with concessions to the apparatus, or await the commission. The scandal is already weakening trust and enforcement."
 ADISCORD_STP_ch.50.prepared:0 "The settlement date has arrived, but the prepared commission has already reconciled the disputed documents and terms. The parties have no grounds to halt institutional work. The government can continue its programme on the basis of fulfilled commitments."
 ADISCORD_STP_ch.50.a:0 "Fund an independent review of the evidence."
 ADISCORD_STP_ch.50.b:0 "Settle the case within the directorate."
 ADISCORD_STP_ch.50.c:0 "Leave the dispute to the commission."
 ADISCORD_STP_ch.50.z:0 "Take note."
 ADISCORD_STP_ch.56.t:0 "The New Order Has Been Tested"
 ADISCORD_STP_ch.56.a_desc:0 "The service retains its powers within a verifiable procedure. Public confidence improves, while the directorate accepts the costs of accountability."
 ADISCORD_STP_ch.56.b_desc:0 "Closed dossiers become the basis of government. Orders are enforced more confidently, but stability rests on fear of whoever controls the archive."
 ADISCORD_STP_ch.56.a:0 "This is the course we have chosen."
 STP_pe_regent_opening:0 "The Payment Date"
 STP_pe_regent_opening_desc:0 "Northern assistance carries deadlines and signatures. Renner orders a comparison of received supplies with outstanding obligations before discrepancies become grounds for further intervention."
 STP_pe_regent_policy_a:0 "Redeem the Obligations in Order"
 STP_pe_regent_policy_a_desc:0 "Resources will go towards settling obligations and maintaining local accounts. Construction proceeds more slowly, but administration becomes cheaper and more self-reliant."
 STP_pe_regent_policy_b:0 "Exchange Time for Privileges"
 STP_pe_regent_policy_b_desc:0 "Renner will extend economic privileges to maintain the pace of reconstruction. Work accelerates at the cost of part of the country's future revenue."
 STP_pe_regent_work_a:0 "Our Own Accounting Offices"
 STP_pe_regent_work_a_desc:0 "Local accounting offices will fund a civilian factory under domestic management. The country gains production with which to meet its obligations without new northern concessions."
 STP_pe_regent_work_b:0 "Northern Equipment in the Districts"
 STP_pe_regent_work_b_desc:0 "Northern equipment will reach local depots: rifles and support equipment will replenish domestic units. Receiving the supplies does not alter the external mandate."
 STP_pe_regent_settlement:0 "Two Signatures on the Settlement"
 STP_pe_regent_settlement_desc:0 "The joint settlement must list actual deliveries and outstanding debt. Renner does not abolish the mandate, but insists that both parties recognise the same document. The signed settlement closes this dispute and refunds any commission still in progress."
 STP_pe_regent_next_day:0 "The Price of the Presence"
 STP_pe_regent_next_day_desc:0 "Local offices must learn to operate without constant advice. Renner funds administration and industrial accounting courses; the external mandate remains in force."
 STP_pe_regent_commission:0 "The Balance of Aid and Dependence"
 STP_pe_regent_commission_desc:0 "Settling the payment dispute permits a reliable balance sheet. Assistance, local expenditure and surrendered revenue will be recorded separately."
 STP_pe_regent_course_a:0 "Prepare a Treaty Revision"
 STP_pe_regent_course_a_desc:0 "Stelander will prepare staff and accounts for a negotiated revision of its dependence. This strengthens its bargaining position; release still requires Nodrul's separate agreement."
 STP_pe_regent_course_b:0 "A Long Mandate for the Advisers"
 STP_pe_regent_course_b_desc:0 "Advisers receive a stable working arrangement and local offices receive predictable supplies under existing contracts. Faster work is purchased through continued privileges."
 STP_pe_regent_ending_a:0 "Our Own Basis for Negotiation"
 STP_pe_regent_ending_a_desc:0 "Local institutions make negotiations possible with properly prepared accounts. Administrative costs fall; a change in international status remains subject to a separate agreement."
 STP_pe_regent_ending_b:0 "An Established Northern Order"
 STP_pe_regent_ending_b_desc:0 "The protectorate becomes an established economic order. Reconstruction advances faster, while a share of revenue remains tied to the terms of the northern presence."
 STP_pe_regent_policy_a_idea:0 "Redeem the Obligations in Order"
 STP_pe_regent_policy_a_idea_desc:0 "Resources will go towards settling obligations and maintaining local accounts. Construction proceeds more slowly, but administration becomes cheaper and more self-reliant. Remains in force until the final settlement."
 STP_pe_regent_policy_b_idea:0 "Exchange Time for Privileges"
 STP_pe_regent_policy_b_idea_desc:0 "Renner will extend economic privileges to maintain the pace of reconstruction. Work accelerates at the cost of part of the country's future revenue. Remains in force until the final settlement."
 STP_pe_regent_crisis:0 "The Northern Payment Falls Due"
 STP_pe_regent_crisis_desc:0 "The dispute has halted fulfilment of obligations. Complete the unlocked programme or choose a settlement in the event."
 STP_pe_regent_backlash:0 "Extended Northern Privileges"
 STP_pe_regent_backlash_desc:0 "The dispute was settled through temporary concessions. Their cost survives a change of party leader."
 STP_pe_regent_ending_a_idea:0 "Our Own Basis for Negotiation"
 STP_pe_regent_ending_a_idea_desc:0 "Local institutions make negotiations possible with properly prepared accounts. Administrative costs fall; a change in international status remains subject to a separate agreement."
 STP_pe_regent_ending_b_idea:0 "An Established Northern Order"
 STP_pe_regent_ending_b_idea_desc:0 "The protectorate becomes an established economic order. Reconstruction advances faster, while a share of revenue remains tied to the terms of the northern presence."
 STP_pe_regent_programme:0 "Reconcile the Northern Obligations"
 STP_pe_regent_programme_desc:0 "The commission will prepare fulfilment before the settlement date or resolve an existing dispute. Work takes 35 days and survives a change of party leader. Capitulation or the fall of party rule returns the deposit; political costs are not refunded."
 ADISCORD_STP_ch.45.t:0 "The Payment Date"
 ADISCORD_STP_ch.45.d:0 "Renner receives a northern statement with a red line beneath the total. Advisers consider the aid delivered, district stores report shortages, and local treasuries have already made some payments. Reconciliation is due in ninety days. A prepared commission can settle discrepancies without new privileges for the patron; without it, the dispute will affect ongoing construction."
 ADISCORD_STP_ch.45.a:0 "Begin the preparations."
 ADISCORD_STP_ch.51.t:0 "The Northern Payment Falls Due"
 ADISCORD_STP_ch.51.d:0 "The northern statement and local receipts still do not agree. Contractors have suspended work pending recognition of the settlement. Renner can fund an urgent reconciliation, extend privileges to remove the claims, or leave the matter to the commission. None of these responses by itself changes Stelander's international status."
 ADISCORD_STP_ch.51.prepared:0 "The settlement date has arrived, but the prepared commission has already reconciled the disputed documents and terms. The parties have no grounds to halt institutional work. The government can continue its programme on the basis of fulfilled commitments."
 ADISCORD_STP_ch.51.a:0 "Fund urgent reconciliation of the accounts."
 ADISCORD_STP_ch.51.b:0 "Extend the economic privileges."
 ADISCORD_STP_ch.51.c:0 "Leave the dispute to the commission."
 ADISCORD_STP_ch.51.z:0 "Take note."
 ADISCORD_STP_ch.57.t:0 "The New Order Has Been Tested"
 ADISCORD_STP_ch.57.a_desc:0 "Local institutions make negotiations possible with properly prepared accounts. Administrative costs fall; a change in international status remains subject to a separate agreement."
 ADISCORD_STP_ch.57.b_desc:0 "The protectorate becomes an established economic order. Reconstruction advances faster, while a share of revenue remains tied to the terms of the northern presence."
 ADISCORD_STP_ch.57.a:0 "This is the course we have chosen."
