 STP_pf_advisers_tt: "§YNodrulian Advisers§!\nNodrul's influence over military planning and leadership decisions.\n\n£planning_speed_texticon Planning speed: [?STP_pf_advisers_effect|=+1%].\nProgram: §Y[?STP_pf_advisers_program|0]/2§!. Beneficial effect cap: §Y[?STP_pf_advisers_capacity|1%]§!.\nContribution to apparatus loyalty: §Y[?STP_pf_advisers_contribution|1]§! points.\n\nStage 1: Nodrul's Military Mission.\nStage 2: Joint Defence Commission.\nAt 20% influence and 70 support: §G+5% / +7% / +9%§!.\nSupport above 50 grants a benefit, below 50 a penalty. Influence scales both. Focuses develop programs and raise benefit caps. Program upgrades do not amplify penalties. Negotiations change political support but do not replace reform.\n[GetSTPPFAdviserConnection]\n\nEndorsement: [STPGetChapterAdvisersEndorsement]."
