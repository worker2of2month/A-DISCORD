 ADISCORD_STP_pc.5.absent:0 "Draft government programmes lay on the table. The Charter limited emergency power, but did not yet say who would exercise authority within those limits. Shabrat reread the clause on terms of office. It would now apply to his own orders.\n\nHis programme began with Steland's unity. The districts would have to recognise a common homeland and the government would have to demand common service. Tikhoreva's papers began with restored homes. Notes in the margin explained that districts counted restoration differently: in one, a family had received its keys; in another, materials had merely been promised.\n\nSotnikov could not lead the cabinet. His absence did not remove the question behind the Charter: how would the liberating government differ from its predecessor when people began to oppose it? The head of government's signature would be the first answer."
 ADISCORD_STP_pc.5.b:0 "Sotnikov. People need protection from their own government too."
 ADISCORD_STP_pc.5.c:0 "Tikhoreva. Let the government answer for how people live."
 ADISCORD_STP_pc.5.closed:0 "No further decision is required."
 ADISCORD_STP_pc.5.a_tt:0 "Maksim Shabrat will lead the government. Ideology: Chauvinism. Consolidating the Charter will unlock his programme of 25 focuses with its own branches, laws and events, and close the programmes of Sotnikov and Tikhoreva."
 ADISCORD_STP_pc.5.b_tt:0 "Grigory Sotnikov will lead the government. Ideology: Humanism. Consolidating the Charter will unlock his programme of 25 focuses with its own branches, laws and events, and close the programmes of Shabrat and Tikhoreva."
 ADISCORD_STP_pc.5.c_tt:0 "Vera Tikhoreva will lead the government. Ideology: Utilitarism. Consolidating the Charter will unlock her programme of 25 focuses with its own branches, laws and events, and close the programmes of Sotnikov and Shabrat."
 STP_pc_charter_government_choice_tt:0 "Choose a Charter government led by Sotnikov, Shabrat or Tikhoreva. Unavailable candidates cannot be selected."
 STP_pc_charter_programme_unlock_tt:0 "Unlocks the chosen head of government's personal programme. Shared reconstruction and neighbouring liberation tasks remain available."
 ADISCORD_STP_pc.63.cabinet:0 "By evening, the government secretariat had received the Assembly's minutes: its nominee for district administrator had been rejected. The cabinet's candidate had supplied troops through the worst months of the war. The deputies proposed a woman who had organised bread distribution and returning families during the fighting. They knew her work and wanted her to answer to them.\n\nThe appointment orders were already prepared. They now had to wait. The Charter allowed deputies to refuse the government's choice, even when the cabinet considered its candidate indispensable. Respecting that right proved harder than writing it down.\n\nThe government can confirm the Assembly's nominee and accept the political cost of conceding. It can demand further negotiations and leave the district waiting. Neither course permits it simply to disregard the vote."
 ADISCORD_STP_pc.64.cabinet:0 "A case against a commander accused of unlawful detention reached the government secretariat. Alongside the orders were statements from families who had spent weeks asking where their relatives were held. The signatures belonged to officers whose wartime achievements were beyond dispute.\n\nTheir comrades requested a military commission. It could suspend those responsible and examine the orders while keeping operational information within the army. The families demanded a public civilian trial: access to evidence, the right to testify, and an equal right of appeal.\n\nA public trial will require the cabinet to withstand pressure from commanders. As officers testify and temporarily hand over their duties, staff coordination will suffer. A closed commission will restore order in the units sooner, but civilians will have to trust the army's own conclusions. Nobody proposes exempting the accused from investigation on the strength of past service."

 ADISCORD_STP_pc.65.t:0 "Files Without a Verdict"
 ADISCORD_STP_pc.65.d:0 "A list of prisoners whose cases had outlasted several changes of guards was placed on Sotnikov's desk. Some had served the former authorities, some had been denounced by neighbours, and others had simply vanished from the release register. The prison director asked for more time: witnesses had scattered and records had burned.\n\nIf they waited for every grievance to fade, the commission's representative said, those doors would never open. Sotnikov traced an entry without a date of accusation. He knew that dangerous opponents might be among the prisoners. Yet missing evidence could not become proof of guilt.\n\nThe commission proposed a public review involving relatives and counsel. Command preferred a faster examination by accountable officers while civilian institutions gained experience. The cabinet had to decide who would first receive the keys.\n\nCivilian review fulfils this Charter obligation. An officers' examination offers a faster answer, but its conclusions must subsequently pass through civilian oversight."
 ADISCORD_STP_pc.65.a:0 "Open the files to civilian review."
 ADISCORD_STP_pc.65.b:0 "Entrust the review to accountable officers."
 ADISCORD_STP_pc.66.t:0 "Who Speaks for the Whole"
 ADISCORD_STP_pc.66.d:0 "Resistance banners still hung in the chamber when district representatives brought their amendments to the civic oath. Everyone recognised a shared duty to the country. The dispute concerned who could explain that duty: a single national assembly or locally elected councils.\n\nShabrat listened in silence. His supporters argued that a nation divided for too long must now answer danger with one voice. A border delegate replied that his district had already paid for unity with ruined homes and should not have to prove its loyalty through silence.\n\nCommon citizenship leaves no strangers among our own, Shabrat answered. Even his closest colleagues understood those words differently. A solemn national oath could place collective duty above local disputes. District deliberation could instead shape that duty, with the army combining the proposals into a common defence programme. Either choice would mark the character of the new state."
 ADISCORD_STP_pc.66.a:0 "Let national duty speak with one voice."
 ADISCORD_STP_pc.66.b:0 "Give the districts a voice in the common decision."
 ADISCORD_STP_pc.67.t:0 "An Error in a Correct Table"
 ADISCORD_STP_pc.67.d:0 "The reconstruction report balanced down to its final line. Deliveries had been accepted, money recorded and deadlines met. Then a workshop sent a letter: its equipment had arrived on time, but the building still had no heating. Under the approved method, the project was complete. Nobody could work there.\n\nTikhoreva asked that the letter remain in the meeting papers. The department head proposed correcting the indicator and finishing the work without making one mistake a dispute over the whole programme. The public commission wanted disclosure: people shown only a final figure could not tell the cabinet what lay behind it.\n\nComprehensive remedial work would cost more and finish sooner; staged acceptance would let local teams finish for less money over a longer period. Neither partial certificate would produce an operating factory. The construction deposit would remain attached to the site until final acceptance and be returned in full if the pilot was abandoned."
 ADISCORD_STP_pc.67.a:0 "Complete remedial work and inspect the whole workshop."
 ADISCORD_STP_pc.67.b:0 "Accept working components and finish the rest in stages."
 ADISCORD_STP_pc.68.t:0 "The Right to Return Home"
 ADISCORD_STP_pc.68.d:0 "Sotnikov's final programme meeting began without a military report. A woman rehoused after evacuation spoke first. She thanked the government for a promised reply delivered on time. A workshop employee, a veterans' representative and counsel from a reviewed prison case followed her.\n\nSotnikov did not turn their accounts into a flawless picture. Ruined neighbourhoods, unresolved disputes and unanswered requests remained. But institutions could now hear a claim without waiting for orders from above, while the army learned to protect their independent work.\n\nHe had long been responsible for ensuring that their people held their positions, he said. Government was also responsible for giving them somewhere to return. The Charter had not finished reconstruction. It had made the return to civilian life an obligation that citizens could require the state to fulfil.\n\nA ledger of the cabinet's obligations remains on the table. An unfinished judicial review, labour agreement or paid programme will not become complete through a final speech. These matters can be settled after the meeting. Recognition belongs to a republic that has honoured its promises and retained its chosen army model."
 ADISCORD_STP_pc.68.a:0 "The state answers to the living."
 ADISCORD_STP_pc.69.t:0 "Citizens of One Country"
 ADISCORD_STP_pc.69.d:0 "Shabrat received the final district register of civic documents. Resistance veterans, displaced families, factory workers and people who had recently lived on opposite sides of the front appeared together. The cover carried no list of services to the movement. It bore only the country's name.\n\nPreparations for a memorial gathering were under way outside. Some wished to recount every victory. Others asked to name the dead and hear from those rebuilding homes. Shabrat made room for both accounts. Memory should bind citizens through shared duty, without replacing the districts' present work.\n\nThey could no longer gather their people only before another battle, he told the cabinet. The national state had workshops, trained formations and a common citizenship. The Charter obliged it to recognise everyone under its protection as its own. The programme had ended; ordinary government would now put those words to the test."
 ADISCORD_STP_pc.69.a:0 "Common citizenship binds the state as well."
 ADISCORD_STP_pc.70.t:0 "A Report That Can Be Checked"
 ADISCORD_STP_pc.70.d:0 "Vera Tikhoreva closed the programme report and returned it to the secretary. Under the old procedure it would have gone to the archive marked complete. Now the final table would be published alongside its source records, commission objections and a list of work the cabinet had not finished.\n\nA minister observed that this gave opponents too many convenient questions. If a question was convenient only for an opponent, Tikhoreva replied, they had asked it themselves too rarely. Openness could not replace competence. The new institutions still had to distinguish useful scrutiny from endless approval.\n\nYet the state could explain where money had gone, why a supplier had been chosen and which experience had changed a plan. Errors no longer justified secrecy. The Charter preserved the limits of power; within them the cabinet had built a system that could be checked and corrected. Utility had become a promise to the public, rather than the last word in an argument with it."
 ADISCORD_STP_pc.67.c:0 "Abandon the pilot and return the entire deposit."
 ADISCORD_STP_pc.70.c:0 "Submit a provisional report and continue the work."
 ADISCORD_STP_pc.70.pending.d:0 "Vera Tikhoreva placed the programme ledger on the table. It listed completed decisions alongside work the cabinet could not yet certify. The secretary suggested postponing the hearing until the last certificate arrived. Tikhoreva shook her head: the public should know about outstanding obligations as well as achievements.\n\nA provisional report does not cancel the expenditure audit, the paid pilot or the correction of service standards. Reserved funds remain attached to current operations and their executors remain responsible. After final acceptance and verification, the cabinet can return to the question of its legacy. Today an honest report matters more than a premature celebration."
 ADISCORD_STP_pc.70.a:0 "The next report will face the same scrutiny."
 STP_charter_sotnikov_oath:0 "General Sworn to the Charter"
 STP_charter_sotnikov_guarantor:0 "Guarantor of the Charter"
 STP_charter_shabrat_founder:0 "Founder of the Resistance"
 STP_charter_shabrat_first_citizen:0 "First Citizen"
 STP_charter_tikhoreva_auditor:0 "Auditor with an Open File"
 STP_charter_tikhoreva_steward:0 "Steward of the Common Cause"
 STP_pc_charter_ravel_army_chief:0 "Ravel at the Head of the Charter Army"
 STP_pc_charter_barchel_high_command:0 "Barchel on the National Defence Staff"
 STP_pc_charter_labour_arbitration:0 "Labour Arbitration"
 STP_pc_charter_labour_arbitration_desc:0 "An elected commission hears disputes between workers and workshops. Its rulings are fairer, but every change on the shop floor now passes through lengthy approval."
 STP_pc_charter_trusted_accounts:0 "Accounts People Trust"
 STP_pc_charter_trusted_accounts_desc:0 "The cabinet published its report together with its own error. Citizens more readily accept decisions from a government whose figures they can check."
 STP_pc_charter_hard_norms:0 "Hard Norms"
 STP_pc_charter_hard_norms_desc:0 "District administrations are funded for meeting their targets. Production adapts quickly to new tasks, but people increasingly complain that the figures no longer see them."
 STP_pc_charter_sotnikov_legacy_law:0 "The State Answers to the Living"
 STP_pc_charter_sotnikov_legacy_law_desc:0 "Sotnikov's legacy. Courts, district reception offices and civilian oversight have become part of ordinary life: government answers citizens' complaints, not only orders from above."
 STP_pc_charter_sotnikov_legacy_defenders:0 "Every Citizen a Defender of the Charter"
 STP_pc_charter_sotnikov_legacy_defenders_desc:0 "Sotnikov's legacy. The army is bound by law, and its reserve is made up of citizens who know they are defending their own rights."
 STP_pc_charter_shabrat_legacy_districts:0 "Common Citizenship Binds the State"
 STP_pc_charter_shabrat_legacy_districts_desc:0 "Shabrat's legacy. The districts share in common decisions, and the national state answers to everyone who lives under its protection."
 STP_pc_charter_shabrat_legacy_nation:0 "One Nation, One Defence"
 STP_pc_charter_shabrat_legacy_nation_desc:0 "Shabrat's legacy. The memory of the resistance and common service have joined the country, and its citizens stand ready to answer any threat with one voice."
 STP_pc_charter_tikhoreva_legacy_ledger:0 "The Open Ledger"
 STP_pc_charter_tikhoreva_legacy_ledger_desc:0 "Tikhoreva's legacy. Every expense, decision and error of the cabinet is open to scrutiny. Trust in the state has grown and administration has become cheaper."
 STP_pc_charter_tikhoreva_legacy_utility:0 "A State of Useful Works"
 STP_pc_charter_tikhoreva_legacy_utility_desc:0 "Tikhoreva's legacy. Decisions follow verified results, and workshops and laboratories quickly adopt what has proven to work."
 ADISCORD_STP_pc.68.b:0 "Every citizen will defend the Charter."
 ADISCORD_STP_pc.69.b:0 "One nation, one defence."
 ADISCORD_STP_pc.70.b:0 "Let the results speak for us."
 ADISCORD_STP_pc.80.t:0 "The Commandant's Trial"
 ADISCORD_STP_pc.80.d:0 "The new court held its first public session in a former warehouse: no other hall in the city could hold everyone who wished to attend. In the dock sat the commandant of a resistance transit camp. His unit had held the river crossing through the hardest weeks of the war. On his order, eleven people suspected of informing for the party had been shot without trial.\n\nVeterans of his unit stood in the hall beside the widows of the executed. Some brought medals, others photographs. The defence asked the court to consider the circumstances: contact with command had been cut, and betrayal had already cost the unit dozens of lives. The prosecution replied that the Charter does not divide people into those who may be killed without evidence and those who may not.\n\nSotnikov received three draft decisions. The civilian court was ready to hear the case openly, like any other, and show that merit does not place anyone above the law. A military board proposed closed proceedings with a public verdict: the army would answer for its own officer. Some veterans demanded that his years in the resistance be counted in his favour and that he simply be dismissed from service.\n\nIf they forgave him what they had tried the party for, the commission chair warned, no one would believe them again. If they condemned him as a party executioner, the chief of staff replied, the men who had stood with him at the crossing would stop believing them. Sotnikov knew that whatever he chose would become the model for the cases to come.\n\nAn open court establishes civilian proceedings. A military panel leaves an obligation of civilian review. An exception for the veteran becomes a general precedent of military immunity; fulfilling the Charter requires repealing it and submitting the case to oversight."
 ADISCORD_STP_pc.80.a:0 "Try him openly, like anyone else."
 ADISCORD_STP_pc.80.b:0 "A military board, but a public verdict."
 ADISCORD_STP_pc.80.c:0 "Count his years in the resistance."
 ADISCORD_STP_pc.81.t:0 "The Whistle Stayed Silent"
 ADISCORD_STP_pc.81.d:0 "In the morning the repair workshops' whistle did not sound. The workers came to the gates but did not go to their machines. A sheet on the notice board listed three demands: pay for overtime shifts, restore the day off abolished by a wartime order, and admit an elected representative to the allocation of housing.\n\nThe workshop director asked for a patrol. Orders to repair bridges and wagons were stalled, and every idle day pushed back the return of refugees to rebuilt districts. The workers' representative answered that these were the people who had rebuilt the workshops under fire, and they would not go back to working under the laws of wartime.\n\nSotnikov remembered signing that very order abolishing days off. It had seemed unavoidable then. Now the Charter guaranteed workers a voice, and the first dispute would show what that guarantee was worth. He could accept the demands at the cost of the cabinet's political capital. He could send the dispute to labour arbitration, which would hear it by the rules but slow production for months. Or he could ask the workers to postpone the dispute until reconstruction was over, at the risk that the Charter's promise would be dismissed as empty words.\n\nHonouring the agreement requires 40 £political_power_texticon and 300 £ADISCORD_economy_treasury_texticon for agreed payments and services. Arbitration or postponement preserves that obligation; the expiry of arbitration does not fund the settlement."
 ADISCORD_STP_pc.81.a:0 "Accept the workers' demands."
 ADISCORD_STP_pc.81.b:0 "Refer the dispute to labour arbitration."
 ADISCORD_STP_pc.81.c:0 "Ask them to wait until reconstruction is over."
 ADISCORD_STP_pc.82.t:0 "The Citizen's Oath"
 ADISCORD_STP_pc.82.d:0 "The text of the common civic oath was ready. It remained to decide who had the right to swear it. In the districts, thousands of people who had served the former authorities awaited an answer: clerks, railwaymen, teachers and junior officers who had not fired on the resistance, but had not joined it either.\n\nShabrat's comrades argued openly. Some reminded him that the country could not recover if half of its skilled workers remained outside the law. Others demanded a probation period: loyalty had to be proven by deeds, not by a single signature. The most uncompromising wanted citizenship only for those who had proven their devotion to the nation during the war.\n\nThey had not fought to draw up a new list of strangers, Shabrat said. But the hall held people who had buried relatives after denunciations by those very clerks. The Charter obliged the state to recognise its citizens. It did not say how quickly to forgive."
 ADISCORD_STP_pc.82.a:0 "One oath for everyone."
 ADISCORD_STP_pc.82.b:0 "Probation for those who served the party."
 ADISCORD_STP_pc.82.c:0 "Citizenship must be earned."
 ADISCORD_STP_pc.83.t:0 "A Settlement Off the Register"
 ADISCORD_STP_pc.83.d:0 "Reconciling the district registers revealed that a mountain district had no record of one settlement. It appeared neither in prewar lists, nor in party ledgers, nor in resistance reports. Yet people lived there: several hundred families who had fled the war and built homes on abandoned pastures.\n\nThe district chief proposed registering the settlement from the resistance lists. Everyone who had received help from the units was recorded there, and the rest could be added later. The surveyors objected: such lists turned citizenship into a reward for past service rather than a right to the state's protection.\n\nShabrat studied the blank space on the map for a long time. A census would take time and require people who were needed in other districts. A quick registration would spare the cabinet's resources, but leave some of the inhabitants without papers."
 ADISCORD_STP_pc.83.a:0 "Send surveyors and doctors."
 ADISCORD_STP_pc.83.b:0 "Register them from the resistance lists."
 ADISCORD_STP_pc.84.t:0 "An Unsigned Line"
 ADISCORD_STP_pc.84.d:0 "The reconstruction expense report was being prepared for publication when an accountant found an unsigned line. A large sum had passed through a district supply office, but the papers held neither an acceptance record nor the name of anyone responsible. The money might have paid for urgent repairs that no one had time to document. It might also have vanished.\n\nThe head of the office asked to delay publication: the cabinet's opponents would turn a single line into proof of theft everywhere. The public commission's representative reminded him that the Charter had promised to disclose the information by which the government would be judged, not only its convenient totals.\n\nAn open commission would publish the disputed entry and collect testimony, causing immediate controversy and requiring political work. A professional audit would keep its evidence confidential until reconciliation, take longer and require paid specialists. Its complete findings would also be published. New pilot contracts would wait for a demonstrated answer under either procedure."
 ADISCORD_STP_pc.84.a:0 "Open the accounts and appoint a public commission."
 ADISCORD_STP_pc.84.b:0 "Commission a professional audit followed by full publication."
 ADISCORD_STP_pc.85.t:0 "The Target Against the Person"
 ADISCORD_STP_pc.85.d:0 "A district hospital met its admissions target six months early and was held up as an example in the cabinet's summary. A week later a doctor's letter arrived: to meet the norm, patients had been discharged early, serious cases were sent to the neighbouring district, and calls to remote settlements were no longer counted at all.\n\nThe head of the district health office did not hide his decisions. He had met the approved target, received the promised funds and invested them in a new ward. Punishing him would teach other chiefs to distrust the cabinet's rules. Leaving things as they were would teach them that the rules exist to be evaded.\n\nThe cabinet can revise the rules to account for difficult cases and retrain staff. Alternatively, it can preserve the common target while requiring every difficult case and remote call to be counted, funding inspectors to verify the correction sooner. Both programmes must demonstrate the remedy in practice. An attractive number will no longer be enough for the final report."
 ADISCORD_STP_pc.85.a:0 "Revise the standard and retrain the staff."
 ADISCORD_STP_pc.85.b:0 "Keep the common standard and verify the quality of care."
 ADISCORD_STP_pc.71.t:0 "An Oath Without the Founder"
 ADISCORD_STP_pc.71.d:0 "The banner was carried into the headquarters courtyard without speeches. Officers who only last spring had argued over whom Shabrat would support now stood in a single line and repeated Sotnikov's short oath after him: to serve the state, to carry out orders, and not to stop before the war is over.\n\nNobody mentioned Shabrat. His portrait stayed in the chancellery, but the papers for signature now go to a different office. Sotnikov signs them standing and hands them straight to his adjutant. The directorate no longer calls itself temporary.\n\nTwo maps lie beside the orders. The first preserves the borders for which the old governments fought. The second marks factory districts, wharves and the lands that can support garrisons. Sotnikov studies the second sheet, then tells the clerk to prepare separate registers for the field army and the district administrations. Shabrat's arrest has left the resistance with a commander who has nobody left to whom he can hand over victory.\n\nHe must now decide how much authority the local commanders will retain and how many men the districts can contribute to the common army. The old names remain in the dispatches for now. The orders are already being written for a different state."
 ADISCORD_STP_pc.71.a:0 "The chain of command will not break."
 ADISCORD_STP_pc.72.t:0 "The Directorate of the Sword"
 ADISCORD_STP_pc.72.d:0 "There are no more red arrows along the borders on the headquarters map. Former Kefreyt has been divided: its factory regions, Spastlant and Zoilong form the Arsenal District; Irim, the Borderlands and Erstantpeo answer directly to the capital. The Northern Naval District retains the ports and coastal garrisons of former Nodrul. A belt of direct administration runs between them. The Bezhaysk holdings have been united in a separate subordinate administration, with one council replacing the former feudal courts. Occidia and the lands of the defeated cannibal tribes are entered in the same order book as the old provinces of Stelander.\n\nAround the map stand officials carrying different returns. The arsenal has accounted for its weapons, the naval district for its transport, and the rear administrations for their new population registers and planned works. The share that the districts owe the centre is fixed in their governing terms. Local commanders answer for what remains. A border now marks both the destination of an order and the person responsible for carrying it out.\n\nSotnikov never gave a victory speech. He ordered the old map to be sent to the archive and a new one hung in its place, without the former frontiers. A state that grew out of a resistance without its founder has become an army that knows how to govern. What it does in peacetime will be decided by orders, not by votes.\n\nWhen headquarters emptied, the adjutant asked whether space should be left on the new map for future arrows. Sotnikov ordered the stores, schools and district offices marked first. Until the next order, the state would have to learn to live within its own borders."
 ADISCORD_STP_pc.72.a:0 "One hand holds the north."
 ADISCORD_STP_pc.90.t:0 "The Prisoner of the Inner Yard"
 ADISCORD_STP_pc.90.d:0 "The prisoner lists of Fada were found in the party guard's office, among packets that were never sent. Almost every name had been crossed out before the assault. One remained unmarked: a cell on the second floor, a separate post, no exercise in the yard.\n\nShabrat was brought to headquarters in a closed car. He had grown thin but held himself straight, and his first question was who now signs the orders. The escort answered by the regulations. Sotnikov went out to him alone, without an adjutant, and the conversation lasted less than a quarter of an hour. Headquarters never learned what was said. It learned something else: officers who had served the founder before the war were already standing at the gate, asking when he would be released.\n\nThe directorate cannot pretend this man does not exist. He can be held under headquarters guard, far from his old connections. Or he can be placed under honourable arrest in Abilia: the city will see that the victors take no revenge on their founder, but his supporters will also find it easier to reach him."
 ADISCORD_STP_pc.90.a:0 "Headquarters will guard him."
 ADISCORD_STP_pc.90.b:0 "Honourable arrest in Abilia."
 STP_sdir_custody_guard_tt:0 "§YShabrat§! is held under headquarters guard. A loyalist plot begins only if stability falls below §Y30%§! or surrender progress exceeds §Y25%§!. The plot is exposed by restoring stability to §Y40%§! with surrender progress no higher than §Y10%§!."
 STP_sdir_custody_honour_tt:0 "§YShabrat§! lives under honourable arrest. A loyalist plot begins if stability falls below §Y45%§! or surrender progress exceeds §Y25%§!. The plot is exposed by restoring stability to §Y55%§! with surrender progress no higher than §Y10%§!."
 ADISCORD_STP_pc.91.t:0 "The Keys to the Inner Yard"
 ADISCORD_STP_pc.91.d:0 "Sotnikov came to Shabrat without an escort and laid two documents on the table: the order dissolving the directorate and the keys to the room where the government seals had been kept throughout the war. The war is over, the districts have accounted for their work, and the army has received what it was promised. Keeping the founder locked away any longer would mean admitting that the resistance had fought for a new guard at his door.\n\nShabrat did not touch the keys for a long time. Then he asked what the army would demand in return. Sotnikov answered that the army demands nothing. It wants to know only one thing: who will give the next order, and whether that order will be revenge.\n\nThe transfer will not be quiet. The directorate's officers are waiting to see whether their commander remains with the new government. The founder's supporters expect their offices back. Shabrat must decide whether to keep Sotnikov as chief of staff or let him go together with the directorate."
 ADISCORD_STP_pc.91.a:0 "Sotnikov will remain chief of staff."
 ADISCORD_STP_pc.91.b:0 "The directorate leaves with him."
 STP_sdir_founder_returns_tt:0 "§YMaksim Shabrat§! leads Steland again and continues the hegemony course. The military directorate is dissolved: its unfinished programmes are cancelled with a full refund."
 STP_sdir_sotnikov_army_chief:0 "Sotnikov at the Head of the Staff"
 ADISCORD_STP_pc.92.t:0 "Night in the Inner Yard"
 ADISCORD_STP_pc.92.d:0 "The guard changed half an hour early. The new sentries knew the password and asked no passes of those who drove up to the founder's house after midnight. By morning only one office in directorate headquarters still had its light on: officers who had sworn to Sotnikov that spring were drawing up a list of those to be detained.\n\nSotnikov was taken without a shot. He did not call the guard and asked only one thing: that his papers be handed to the archive complete. Shabrat came out to the crowd in the yard in the same greatcoat in which he had been taken out of Fada and said briefly that the state once again answers to its founder.\n\nThe coup did not pass without a trace. Some directorate commanders were removed that same night, the rest await inspection. The army obeyed, but its staffs now hold more suspicion than order."
 ADISCORD_STP_pc.92.a:0 "The seal returns to the founder."
 ADISCORD_STP_pc.93.t:0 "The Cells Exposed"
 ADISCORD_STP_pc.93.d:0 "The lists were found on a courier who travelled too often between Abilia and the old guard's garrisons. They held no plans for an assault: only names, addresses and the times the guard changed at the founder's house. That was enough.\n\nThe arrested officers were not tried in public. Some were sent to distant posts, others dismissed without the right to wear the uniform. Shabrat was moved to a separate wing of headquarters and his entire guard was replaced. No one speaks to him now except the duty officer.\n\nThe directorate held. The loyalists lost people, connections and time. Sotnikov retains a choice he can now make without looking over his shoulder at other men's knives: entrench the directorate or one day return the seal of his own free will."
 ADISCORD_STP_pc.93.a:0 "The directorate holds."
 STP_pc_charter_sotnikov_reintegration:0 "Veterans Returning to Civilian Life"
 STP_pc_charter_sotnikov_reintegration_desc:0 "A one-time civilian employment programme: §Y60§! £political_power_texticon §Y600§! £ADISCORD_economy_treasury_texticon, §Y35 days§!. Establishes §G1§! civilian factory for returning families and veterans and grants §G+2%§! stability. The site is checked at payment and completion. A change of cabinet, capitulation or loss of all eligible sites refunds full payment; a cancelled programme can be retried."
 STP_pc_charter_sotnikov_complete_justice:0 "The Second Judicial Priority"
 STP_pc_charter_sotnikov_complete_justice_desc:0 "Spend §Y50§! £political_power_texticon to open the remaining strand: the commandant's case or detention review. Its event determines the procedure. A change of cabinet before the answer refunds payment."
 STP_pc_charter_sotnikov_review_command:0 "Submit Decisions to Civilian Oversight"
 STP_pc_charter_sotnikov_review_command_desc:0 "Spend §Y50§! £political_power_texticon to review all military decisions already announced and repeal the veteran's exception. Military prosecution replaces immunity; stability: §G+2%§!. Unopened cases remain unfinished."
 STP_pc_charter_sotnikov_complete_social:0 "Fund the Second Social Priority"
 STP_pc_charter_sotnikov_complete_social_desc:0 "Cost: §Y50§! £political_power_texticon §Y300§! £ADISCORD_economy_treasury_texticon. After clinics, housing adds §G+5%§! construction speed. After housing, public hospitals are enacted; an already active law returns §Y40§! £political_power_texticon. One-time, without repeating the selected focus."
 STP_pc_charter_sotnikov_settle_labour:0 "Honour the Labour Agreement"
 STP_pc_charter_sotnikov_settle_labour_desc:0 "Fund deferred demands or implement arbitration: §Y40§! £political_power_texticon §Y300§! £ADISCORD_economy_treasury_texticon. Stability: §G+4%§!; labour arbitration is removed. The obligation is fulfilled once. Collective bargaining must remain in force."
 STP_pc_charter_sotnikov_supply_contract:0 "Civilian Rear-Service Contract"
 STP_pc_charter_sotnikov_supply_contract_desc:0 "Order §Y150§! £support_equipment_texticon and §Y50§! £motorized_texticon for §Y300§! £ADISCORD_economy_treasury_texticon. Delivery after §Y21 days§! also grants 20 army experience. One-time. A change of cabinet, capitulation, loss of all controlled home territory or repeal of civilian contracts refunds full payment. A cancelled order can be retried."
 STP_pc_charter_sotnikov_confirm_legacy:0 "Confirm the Charter's Fulfilment"
 STP_pc_charter_sotnikov_confirm_legacy_desc:0 "After the concluding meeting, fulfilled obligations can be presented at no cost. A professional army establishes civilian law; territorial reserves establish citizen-defenders. Both judicial cases, the labour agreement, workshop, second social priority, delivered stores and current laws are checked. The legacy and guarantor's authority are granted once."
 STP_pc_charter_sotnikov_workshop_site_tt:0 "An owned and controlled state has room for a civilian factory"
 STP_pc_charter_sotnikov_reintegration_free_tt:0 "No reintegration programme has already been paid for"
 STP_pc_charter_sotnikov_supply_free_tt:0 "No rear-service order has already been paid for"
 STP_pc_charter_sotnikov_justice_wait_tt:0 "The first judicial event has been answered; no other paid hearing awaits an answer"
 STP_pc_charter_sotnikov_second_justice_tt:0 "The remaining judicial case opens. Civilian proceedings fulfil the obligation; officers' conclusions require later oversight."
 STP_pc_charter_sotnikov_civil_review_tt:0 "Military decisions already announced have passed civilian review; the veteran's exception is repealed. Unopened cases remain unfinished."
 STP_pc_charter_sotnikov_prisons_civil_tt:0 "Civilian detention review is complete; this Charter obligation is fulfilled."
 STP_pc_charter_sotnikov_prisons_review_tt:0 "The officers' conclusions require a separate civilian review once oversight is established."
 STP_pc_charter_sotnikov_trial_civil_tt:0 "Civilian jurisdiction also binds the victors; the commandant's case counts towards the legacy."
 STP_pc_charter_sotnikov_trial_review_tt:0 "The military panel leaves an obligation of civilian review, available through a later decision."
 STP_pc_charter_sotnikov_trial_exception_tt:0 "The veteran's privilege establishes military immunity. The legacy is unavailable until repeal and civilian review."
 STP_pc_charter_sotnikov_labour_settled_tt:0 "The labour agreement is funded and honoured. Collective bargaining must remain in force for the legacy."
 STP_pc_charter_sotnikov_labour_pending_tt:0 "The obligation remains. Fulfilment costs §Y40§! £political_power_texticon §Y300§! £ADISCORD_economy_treasury_texticon; expiry of arbitration does not waive payment."
 STP_pc_charter_sotnikov_reintegration_result_tt:0 "After §Y35 days§!: §G1§! civilian factory on an owned, controlled site and §G+2%§! stability. One-time. A change of cabinet, capitulation or loss of all eligible sites refunds full payment."
 STP_pc_charter_sotnikov_supply_result_tt:0 "After §Y21 days§!: §G150§! £support_equipment_texticon, §G50§! £motorized_texticon and 20 army experience. Failure of the active contract refunds full payment. Successful delivery cannot be repeated."
 STP_pc_charter_sotnikov_justice_settled_tt:0 "Both cases have completed civilian review; civilian oversight remains and military immunity is absent"
 STP_pc_charter_sotnikov_labour_kept_tt:0 "The labour agreement is honoured and collective bargaining remains"
 STP_pc_charter_sotnikov_social_kept_tt:0 "The reintegration workshop is built and the second social priority is funded"
 STP_pc_charter_sotnikov_supply_kept_tt:0 "The rear-service order is delivered and civilian contracts remain"
 STP_pc_charter_sotnikov_army_kept_tt:0 "The selected model remains: a cadre army for professional service or territorial reserves for citizens"
 STP_pc_charter_sotnikov_legacy_conditions_tt:0 "The legacy requires civilian completion of both judicial cases, an honoured labour agreement, reintegration workshop, second social priority and rear-service delivery. Civilian oversight, collective bargaining, civilian contracts and the selected army model must remain. Professional service leads to civilian law; territorial reserves to citizen-defenders. Obligations can be fulfilled later."
 STP_pc_charter_sotnikov_provisional_tt:0 "The cabinet continues without a legacy or new guarantor powers. Remaining programmes and decisions stay available. Once obligations are fulfilled, Confirm the Charter's Fulfilment grants the earned outcome without an additional payment."
 ADISCORD_STP_pc.68.provisional:0 "First honour the remaining promises."
 ADISCORD_STP_pc.68.unfinished:0 "For the concluding meeting, the cabinet office prepared a folder marked Charter Fulfilment. It contained court findings, workers' letters, workshop contracts and orders from headquarters. A space for Sotnikov's signature had already been left on the cover.\n\nThe commission chair opened it before the report began. A signature had to confirm more than the existence of reports. The commission checked civilian proceedings, the labour agreement, payment and delivery of programmes, and the current rules of army service. Even an enacted law did not by itself demonstrate that institutions continued to follow it. The ledger did not yet establish that every obligation had been fulfilled and remained in force.\n\nThe staff representative proposed approving the overall result and leaving the remaining questions to the departments. Sotnikov drew the unsigned sheet towards him. They already knew how to appoint someone responsible, he said. Now they had to wait for an answer. He ordered the open cases returned to their responsible offices and preserved the citizens' right to demand completion.\n\nThe meeting ended without proclaiming a new legacy. The cabinet would continue its work; courts, workshops and army services would have to present fulfilled obligations. They could then return to this table without changing the meaning of their promises."
