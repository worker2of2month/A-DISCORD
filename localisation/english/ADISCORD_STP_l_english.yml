l_english:
 STP_party_minister_change_allowed_tt:0 "On Shabrat's route, Party ministers can only be changed after the civil war begins or with special permission."
 # Focus filters
 FOCUS_FILTER_STP_PREPARATION_SLOTS:0 "Preparation Slots"
 FOCUS_FILTER_STP_DISTRICT_ADMINISTRATIONS:0 "District Administrations"
 FOCUS_FILTER_STP_ELECTIONS:0 "Elections and Legitimacy"
 FOCUS_FILTER_STP_ARMY_PREPARATION:0 "Army Preparation and Weapons"
 FOCUS_FILTER_STP_UNDERGROUND:0 "Underground and Sabotage"
 FOCUS_FILTER_STP_NODRUL:0 "Countering Nodrul"

 # Focuses
 STP_NECTAR_OF_GODS: "Nectar of the Gods"
 STP_NECTAR_OF_GODS_desc: "Ivanov's order seems secure precisely because so few people still ask what holds it together."
 STP_REVOLUTION_FROM_THE_NORTH: "The Revolution from the North"
 STP_REVOLUTION_FROM_THE_NORTH_desc: "To understand modern Stelander, we must remember how a Nodrul political project became the country's domestic order."
 STP_SMILE_YOU_ARE_WELCOME: "Smile, You Are Welcome"
 STP_SMILE_YOU_ARE_WELCOME_desc: "Festivals, open waterfronts and bustling ports must show Stelander to be peaceful, modern and welcoming."
 STP_STATE_OF_THE_REPUBLIC: "The State of the Republic"
 STP_STATE_OF_THE_REPUBLIC_desc: "With the budget approved, the cabinet prepares its report for the president. At the reception, it becomes clear that Ivanov can no longer work at his former pace. We must decide whom to entrust with preparations for the transfer of power."
 STP_2160_program: "The 2160 Programme"
 STP_2160_program_desc: "The government is bringing the accumulated problems together into a single programme for the old order's last peaceful year."
 STP_2160_budget: "The 2160 Budget"
 STP_2160_budget_desc: "The cabinet must decide how much the state can spend on preserving the existing order and how much on rebuilding it."
 STP_BEHIND_THE_LIGHTS: "Behind the Capital's Lights"
 STP_BEHIND_THE_LIGHTS_desc: "The resort showcase hides the highlands, the Lower Market and a network already preparing to challenge the party monopoly."
 STP_current_spending: "Cover Current Expenditure"
 STP_current_spending_desc: "Accumulated obligations cannot be carried forward into the next reporting period forever."
 STP_internal_investment: "Domestic Investment"
 STP_internal_investment_desc: "Some funding should go towards projects that will create new capacity for the country, rather than merely pay old bills."
 STP_BALANCED_APPROPRIATIONS: "Balance the Appropriations"
 STP_BALANCED_APPROPRIATIONS_desc: "After the disputes between departments, the budget can finally be assembled around a single set of priorities."
 STP_highland_program: "The Highland Districts Programme"
 STP_highland_program_desc: "The highland districts need a separate policy for supply, infrastructure and relations with local administrations."
 STP_regional_agreements: "Agreements with the Districts"
 STP_regional_agreements_desc: "Local authorities will receive formal commitments from the centre in exchange for more predictable cooperation."
 STP_central_district_funding: "Central Funding for the Districts"
 STP_central_district_funding_desc: "The capital will assume a greater share of the costs, and with it a greater share of control."
 STP_HIGHLAND_SETTLEMENT: "The Highland Compromise"
 STP_HIGHLAND_SETTLEMENT_desc: "The new arrangement must connect local interests to the central government's resources."
 STP_port_reform: "Port Reform"
 STP_port_reform_desc: "The trading harbours are too important to the state to continue operating under a patchwork of temporary rules."
 STP_private_port_management: "Private Port Management"
 STP_private_port_management_desc: "Private operators will receive greater freedom in exchange for trade, investment and speed."
 STP_state_port_oversight: "State Oversight of the Ports"
 STP_state_port_oversight_desc: "The port system will remain under direct state control, even if that proves more expensive."
 STP_PORT_AUTHORITY_2160: "The 2160 Port Authority"
 STP_PORT_AUTHORITY_2160_desc: "With a management model chosen, the scattered harbours can be brought into a single administrative system."
 STP_personnel_policy: "Personnel Policy"
 STP_personnel_policy_desc: "Expanding the programme depends not only on money, but also on people capable of managing it."
 STP_foreign_specialists: "Foreign Specialists"
 STP_foreign_specialists_desc: "Invited engineers and administrators will quickly fill the skills gap, but will create a new dependency."
 STP_local_training: "Train Our Own Specialists"
 STP_local_training_desc: "Our own training system will take longer to establish, but will gradually free us from reliance on foreign specialists."
 STP_CIVIL_SERVICE_REGISTER: "A Unified Service Register"
 STP_CIVIL_SERVICE_REGISTER_desc: "The new personnel system must turn temporary appointments into a lasting state apparatus."
 STP_defense_budget: "Expand the Capital Arsenals"
 STP_defense_budget_desc: "We will build two military factories in the capital state under our control and unlock an additional equipment order. Prioritising the military rules out expanded ministry funding. Basic district administration and protection of Congress remain available."
 STP_garrison_funding: "Garrison Funding"
 STP_garrison_funding_desc: "Existing units will receive the personnel, supplies and funding needed for a permanent presence in key areas."
 STP_mobilization_reserve: "Mobilisation Reserve"
 STP_mobilization_reserve_desc: "Stockpiles, transport and trained reserves will allow the army to expand more quickly when peacetime ends."
 STP_READINESS_REVIEW: "Readiness Review"
 STP_READINESS_REVIEW_desc: "Garrisons and reserves will be brought into a single deployment plan for a sudden crisis."
 STP_nodrul_agreement: "The Nodrul Agreement"
 STP_nodrul_agreement_desc: "Nodrul's presence remains part of Stelander's security system, but its terms can no longer be left undefined."
 STP_extend_nodrul_missions: "Expand Nodrul's Missions"
 STP_extend_nodrul_missions_desc: "Additional advisers will strengthen the existing system while increasing our dependence on an external guarantor."
 STP_reduce_nodrul_presence: "Reduce Nodrul's Presence"
 STP_reduce_nodrul_presence_desc: "Stelander will begin taking back responsibilities that Nodrul's organisations have performed for years."
 STP_FRONTIER_PROTOCOL_2160: "Border Security Protocol"
 STP_FRONTIER_PROTOCOL_2160_desc: "Once the political decision is made, the parties can formally establish the new arrangements along the border."
 STP_ADRESS_PARTY_CRISIS: "Rally Our Supporters"
 STP_ADRESS_PARTY_CRISIS_desc: "We will reach an agreement with delegates willing to support Shabrat. An open coalition will strengthen his electoral position and give officials grounds to keep working through a change of government."
 STP_PRESIDENT_REMAINS_IN_OFFICE: "The Presidium's Powers"
 STP_PRESIDENT_REMAINS_IN_OFFICE_desc: "While Ivanov remains head of state, the presidium must ensure his decisions are carried out without his constant personal intervention. We will formalise the departments' working powers. This will unlock basic preparations in the capital and district administration regardless of the subsequent budget priority."
 STP_CONTINUITY_OF_AUTHORITY: "Continuity of Authority"
 STP_CONTINUITY_OF_AUTHORITY_desc: "Orders must keep passing through the apparatus as though nothing at the top has changed."
 STP_Govern_In_His_Name: "Support the Party"
 STP_Govern_In_His_Name_desc: "The cabinet will continue under party leadership. The briefing will show §Yapparatus loyalty§! instead of security service suspicion: holding the districts, sealing the electoral record and disrupting the couriers' work. Shabrat's underground operates independently."
 STP_Show_Him_The_Truth: "Support Shabrat"
 STP_Show_Him_The_Truth_desc: "Shabrat has our support. His preparatory focuses and operations on the state map will become available. The decision was made at the meeting following the first decline in Ivanov's health."
 STP_PARTY_DISCIPLINE: "District Intelligence"
 STP_PARTY_DISCIPLINE_desc: "We will check the staffing of district offices and the position of the garrisons. In Niansas, we will strengthen party influence without conducting searches. Then we must choose: negotiate with commanders and preserve local connections, or empower emergency commissioners to seize underground stockpiles."
 STP_SEAL_THE_WESTERN_WING: "Seal the Western Wing"
 STP_SEAL_THE_WESTERN_WING_desc: "Access to the president will depend on clearance, not old acquaintances."
 STP_ROTATE_DISTRICT_COMMAND: "Emergency Commissioners"
 STP_ROTATE_DISTRICT_COMMAND_desc: "We will send commissioners to New Monaia and Kreiden: they will conduct searches, seize any stockpiles they find and prepare party garrisons. The purges will reduce stability by 5% and rule out the negotiated approach. Further paid district inspections will become available; fruitless searches will strengthen Shabrat's mandate. Intercepting announced operations remains available under either approach."
 STP_BURN_THE_CLIENT_ARCHIVES: "Burn the Client Archives"
 STP_BURN_THE_CLIENT_ARCHIVES_desc: "Some documents are more dangerous to keep than to destroy."
 STP_GUARANTEE_MINISTERS: "Fund the Ministries"
 STP_GUARANTEE_MINISTERS_desc: "We will preserve the departments' core staff and fund the apparatus's work. The presidium can then establish a cash reserve. This priority rules out the expanded capital arsenal programme, but leaves district administration, reserve preparation and protection of Congress available."
 STP_EMERGENCY_APPOINTMENTS: "Emergency Appointments"
 STP_EMERGENCY_APPOINTMENTS_desc: "In a crisis, offices must be held by people ready to carry out an order without lengthy consultations."
 STP_DISTRICT_GOVERNMENT: "District Administration"
 STP_DISTRICT_GOVERNMENT_desc: "We will assign an additional staff team to local work. The overall limit on operations being prepared simultaneously will increase by one. This basic capability does not depend on the choice between ministries and arsenals."
 STP_CONFIRM_DISTRICT_ADMINISTRATIONS: "Confirm the District Administrations"
 STP_CONFIRM_DISTRICT_ADMINISTRATIONS_desc: "Local governments will retain their powers and their responsibility for order."
 STP_PRESIDENTIAL_COMMISSIONERS: "Presidential Commissioners"
 STP_PRESIDENTIAL_COMMISSIONERS_desc: "Representatives of the centre will travel to key districts with a direct mandate from the presidential administration."
 STP_PUBLIC_INFORMATION_POLICY: "Public Information Policy"
 STP_PUBLIC_INFORMATION_POLICY_desc: "The government must establish exactly what the country is entitled to know about events at the top."
 STP_MEDICAL_BULLETINS: "Medical Bulletins"
 STP_MEDICAL_BULLETINS_desc: "Regular reports from the doctors must contain rumours and show that the situation is under control."
 STP_RESTRICT_HEALTH_INFORMATION: "Restrict Health Information"
 STP_RESTRICT_HEALTH_INFORMATION_desc: "The president's condition is becoming a matter of state stability rather than public curiosity."
 STP_FADA_PACT: "The FADA Pact"
 STP_FADA_PACT_desc: "External guarantees must be reaffirmed before our neighbours decide that the internal crisis has opened a window of opportunity."
 STP_RENEW_THE_CULTURAL_MANDATE: "Renew the Cultural Mandate"
 STP_RENEW_THE_CULTURAL_MANDATE_desc: "The old ties with Nodrul can demonstrate that Ivanov's international arrangements will outlive Ivanov himself."
 STP_THE_PARTY_CLOSES_RANKS: "Secure District Obedience"
 STP_THE_PARTY_CLOSES_RANKS_desc: "We will extend the chosen arrangements to Hoskheit and Old Fadian Forest. Under the negotiated approach, we will strengthen influence without dismantling others' connections. Under emergency administration, we will conduct inspections that destroy underground preparations. Neither option transfers the district automatically."
 STP_cw_security_collegium: "Security Collegium"
 STP_cw_security_collegium_desc: "Immediately after choosing the party course, we will establish a collegium capable of interrupting announced courier operations. An interception takes ten days and requires a free preparation team. We must first unlock a way to respond, then develop district inspections and the formal recording of proceedings."
 STP_cw_counter_network: "A Counter-Network in the Garrisons"
 STP_cw_counter_network_desc: "We will regain control over connections in New Monaia and Kreiden. Party influence in these districts will grow, and headquarters will receive command power."
 STP_cw_protocol_office: "Electoral Records Office"
 STP_cw_protocol_office_desc: "The party office will take charge of recording delegates and seals. During the election, we can seal the electoral record once to shift the mandate towards the party."
 STP_cw_public_lists: "Open Lists"
 STP_cw_public_lists_desc: "Publishing verified lists will shift the election further towards the party, but bureaucratic clans will see it as pressure: loyalty and stability will fall."
 STP_cw_quiet_registers: "Quiet Registers"
 STP_cw_quiet_registers_desc: "A closed review of the registers will preserve discipline in the offices. Apparatus loyalty will rise more than after publication, but the shift in the mandate will be smaller."
 STP_cw_press_office: "Party Press Office"
 STP_cw_press_office_desc: "The press office will link district offices to the presidium. It will unlock a repeatable 14-day directive that strengthens the party mandate and apparatus loyalty at the cost of political power and stability. An unfinished directive does not alter an election that has already closed."
 STP_cw_capital_oath: "Mobile Reserve"
 STP_cw_capital_oath_desc: "Instead of fortifying Congress, we will prepare a reserve for rapid counterattacks. When the split occurs, the party will attempt to deploy two additional brigades using its own personnel and weapons; these will take priority over ordinary recruitment. Headquarters will receive offensive preparation for the first 35 days of fighting. Withdrawing forces from permanent garrisons will reduce stability by 3%."
 STP_cw_party_mandate: "The Apparatus Mandate"
 STP_cw_party_mandate_desc: "We will combine district policy with a functioning press office or supply administration into a common mandate. No budgetary or military choice alone can replace the preparation of institutions."
 STP_Count_The_Loyalists: "Check the Delegate Lists"
 STP_Count_The_Loyalists_desc: "We will connect district organisers with central department staff. The network will provide a steady source of political power and unlock district work, while trusted intermediaries can delay the party commission's arrival."
 STP_The_Last_Confession: "The Last Confession"
 STP_The_Last_Confession_desc: "A few minutes alone with Ivanov may matter more than weeks of public politics."
 STP_Call_For_Shabrat: "Shabrat's Headquarters"
 STP_Call_For_Shabrat_desc: "A permanent headquarters will handle negotiations with officials and preparations for public agreements. The political power gained can be spent on district administrations or protecting connections already established."
 STP_cw_delay_election_commission: "Delay the Electoral Commission"
 STP_cw_delay_election_commission_desc: "Through headquarters, we will demand another review of credentials and postpone the result. §YThe effect applies as soon as the focus is selected§!, before its 14-day timer runs: the current vote and active credentials review are extended by §Y80 days§!, while suspicion rises by §R15§!. Once started, the focus cannot be cancelled manually."
 STP_Turn_The_Young_Officers: "Win Over the Young Officers"
 STP_Turn_The_Young_Officers_desc: "Severin Drake will agree to support Shabrat. When the split occurs, he will join the resistance, and his headquarters will gain organisation recovery and planning speed."
 STP_Garrisons_Hesitate: "An Agreement with the Garrisons"
 STP_Garrisons_Hesitate_desc: "We will allocate political power to agreements with the garrisons and guarantee the officers' official powers. This will weaken Shabrat's electoral support. Forming units still requires personnel, weapons and separate preparations."
 STP_Rumours_In_The_Highlands: "Rumours in the Highlands"
 STP_Rumours_In_The_Highlands_desc: "In the highland districts, political rumours quickly become routes, caches and lists of reliable people."
 STP_The_Mountain_Printing_House: "The Mountain Printing House"
 STP_The_Mountain_Printing_House_desc: "A few old presses can print more than leaflets if the government suddenly loses its voice."
 STP_The_Silent_Mountain_March: "District Administrations"
 STP_The_Silent_Mountain_March_desc: "We will agree with officials in [2.GetName] that they will keep working after the change of government. Shabrat's support will grow, and the administration can prepare to hand over the district. It must be protected from party inspections until the results are declared."
 STP_The_Lower_Market: "The Lower Market"
 STP_The_Lower_Market_desc: "Where official departments exchange papers, the lower market exchanges favours, debts and secrets."
 STP_Steal_The_Black_Ledger: "Steal the Black Ledger"
 STP_Steal_The_Black_Ledger_desc: "A single register can link party intermediaries, contractors and people who would prefer never to appear together in one document."
 STP_The_First_Witness: "The First Witness"
 STP_The_First_Witness_desc: "Documents are useful, but a living person can sometimes destroy a carefully constructed account of events."
 STP_Kefreite_Security_Offer: "Request Kefreyt's Help"
 STP_Kefreite_Security_Offer_desc: "We will propose that Kefreyt send three reinforced volunteer divisions. If it agrees, their personnel and equipment will be paid for from Kefreyt's reserves, and the units will pass to Shabrat's command when the split occurs. They will remain until the war ends; their composition cannot be changed, and no new units can be recruited from this template. The agreement provides for no territorial concessions."
 STP_No_Mercenaries_In_Our_Mountains: "No Deals with Bandits"
 STP_No_Mercenaries_In_Our_Mountains_desc: "Local commanders know their people and can reinforce their units even after heavy fighting. Instead of Kefreyt's divisions, we will prepare two brigades and our own personnel service using resistance stockpiles."
 STP_THE_MOUNTAIN_WINDOW: "Choose the Day of the Uprising"
 STP_THE_MOUNTAIN_WINDOW_desc: "The northern campaign ties down Nodrul's army. We will prepare our uprising while our neighbour's main forces are occupied. Starting the revolt will interrupt the election and unfinished operations; waiting will allow us to receive a mandate, but the enemy may have time to free its troops."
 STP_INCAPACITY_PROTOCOL: "Incapacity Protocol"
 STP_INCAPACITY_PROTOCOL_desc: "The state must decide in advance who signs orders if the president can no longer do so."
 STP_EMERGENCY_PRESIDIUM: "A Working Presidium"
 STP_EMERGENCY_PRESIDIUM_desc: "After agreements with the districts or emergency command rotation, we will bring the departments and command together into a single working body. Both approaches allow the campaign to continue, but the results of local policy remain."
 STP_THE_FATHER_OF_PEACE_IS_GONE: "The Father of Peace Is Gone"
 STP_THE_FATHER_OF_PEACE_IS_GONE_desc: "Ivanov's signature will never appear on another document. Everything he held together through personal authority now belongs to whoever can seize it."
 STP_PARTY_INHERITS_THE_STATE: "The Party Inherits the State"
 STP_PARTY_INHERITS_THE_STATE_desc: "Hedersett inherits an apparatus, not a throne, and considers it a far more valuable inheritance."
 STP_NO_ONE_CONTROLS_THE_TRANSITION: "No One Controls the Transition"
 STP_NO_ONE_CONTROLS_THE_TRANSITION_desc: "Orders diverge, garrisons choose sides, and a political dispute becomes a struggle for the very territory of the state."
 STP_SHABRAT_AT_THE_PALACE: "Shabrat to the Palace"
 STP_SHABRAT_AT_THE_PALACE_desc: "The capital changes hands before it can realise that the old system has already ended."
 STP_SOTNIKOV_TAKES_COMMAND: "Sotnikov Takes Command"
 STP_SOTNIKOV_TAKES_COMMAND_desc: "When the political plan collapses, what remains is officers, depots and a man willing to forge them into a new chain of command."
 STP_bookmark_support_shabrat: "Support the Resistance"
 STP_bookmark_support_shabrat_desc: "Shabrat and his supporters are still weak, but the weak are often the first to see the cracks in a system. Supporting them means putting Stelander's future above the comfortable lie of the present."
 STP_bookmark_last_banquet: "Operation Last Banquet"
 STP_bookmark_last_banquet_desc: "When a political transition cannot be arranged through law, it is arranged through conspiracy. The last banquet may become the moment the old elite loses its immunity, rather than a celebration."
 STP_bookmark_support_party: "Support the Party"
 STP_bookmark_support_party_desc: "The party knows every office, list, source of money and weakness in the country. Supporting it means choosing manageable rot over an unknown collapse."
 # Preparation and districts
 STP_elections_in_the_party: "Elections in the Party"
 STP_elections_in_the_party_desc: "[STPGetElectionBriefing]"
 STP_display_party_suspicion_loc: "\n\n§YOperational Briefing§!\n\n £STP_suspicion §YSecurity Service Suspicion§!: [STPGetSuspicionValue] (£political_power_texticon [?STP_sus_political_power_factor|=+1%]) - [STPGetSuspicionBand].\n[STPGetSuspicionExplanation]"
 STP_display_apparatus_loyalty_loc: "\n\n§YOperational Briefing§!\n\n £political_power_texticon §YApparatus Loyalty§!: [STPGetLoyaltyValue] (£political_power_texticon [?STP_loy_political_power_factor|=+1%], £stability_texticon [?STP_loy_stability_factor|=+1%]) - [STPGetLoyaltyBand].\n[STPGetLoyaltyExplanation]"
 STP_SUSPICION_VALUE_LOW: "§G[?STP_party_suspicion|0]%§!"
 STP_SUSPICION_VALUE_MEDIUM: "§Y[?STP_party_suspicion|0]%§!"
 STP_SUSPICION_VALUE_HIGH: "§R[?STP_party_suspicion|0]%§!"
 STP_SUSPICION_BAND_HIDDEN: "network undetected"
 STP_SUSPICION_BAND_NOTICED: "the services notice discrepancies"
 STP_SUSPICION_BAND_WATCHED: "under surveillance"
 STP_SUSPICION_BAND_COMPROMISED: "network partially exposed"
 STP_SUSPICION_BAND_MANHUNT: "arrest will follow at 100%"
 STP_SUSPICION_EXPLANATION_HIDDEN: "§gThe services do not yet see a common pattern in individual contacts and movements. The underground can act freely without spending political power on constant cover.§!"
 STP_SUSPICION_EXPLANATION_NOTICED: "§gAnalysts are noticing repeated discrepancies. New operations already require caution, but the network's structure remains hidden.§!"
 STP_SUSPICION_EXPLANATION_WATCHED: "§gSuspicious contacts are under surveillance. The party now runs two commissions simultaneously, while political work becomes bogged down in checks, surveillance and changes of communication channels.§!"
 STP_SUSPICION_EXPLANATION_COMPROMISED: "§gPart of the network has been identified. The services are matching names, routes and sources of funding, forcing the underground to devote ever more effort to survival.§!"
 STP_SUSPICION_EXPLANATION_MANHUNT: "§gFrom 90 to 99, the service is already tracking Shabrat's list. Suspicion can still be reduced before the gauge reaches 100%. At 100%, Shabrat will be arrested; lowering the gauge cannot reverse an arrest that has already taken place.§!"
 STP_LOYALTY_VALUE_HIGH: "§G[?STP_apparatus_loyalty|0]%§!"
 STP_LOYALTY_VALUE_MEDIUM: "§Y[?STP_apparatus_loyalty|0]%§!"
 STP_LOYALTY_VALUE_LOW: "§R[?STP_apparatus_loyalty|0]%§!"
 STP_LOYALTY_BAND_LOCKED: "the apparatus stands united"
 STP_LOYALTY_BAND_OBEDIENT: "the districts obey"
 STP_LOYALTY_BAND_HELD: "control is maintained"
 STP_LOYALTY_BAND_STRAINED: "discipline is cracking"
 STP_LOYALTY_BAND_FRACTURED: "the apparatus is falling apart"
 STP_LOYALTY_EXPLANATION_LOCKED: "§gOffices, seals and district headquarters follow a single order. Shabrat's couriers spend more time on each operation, while the apparatus's political work proceeds without constant disruption.§!"
 STP_LOYALTY_EXPLANATION_OBEDIENT: "§gMost district chiefs follow directives. Inspections and the electoral records office are producing results, but some underground connections remain alive.§!"
 STP_LOYALTY_EXPLANATION_HELD: "§gThe party holds the offices, but local clans bargain over every appointment. Loyalty must be reinforced through inspections and disruption of announced courier operations.§!"
 STP_LOYALTY_EXPLANATION_STRAINED: "§gPart of the district apparatus is already looking towards Shabrat. Political work is bogged down, and couriers manage to finish their preparations before our inspections arrive.§!"
 STP_LOYALTY_EXPLANATION_FRACTURED: "§gSeals and appointments no longer follow a common authority. The underground operates almost openly, while the cabinet spends resources keeping its own people in line.§!"
 ivanov_health_is_getting_worse: "§YIvanov's Health Is Deteriorating!§!"
 STP_debug_increase_suspicion: "§RDEBUG:§! Increase Party Suspicion"
 STP_debug_increase_suspicion_desc: "Increases §Ysecurity service suspicion§! by §R10§! points for testing."
 STP_debug_decrease_suspicion: "§RDEBUG:§! Decrease Party Suspicion"
 STP_debug_decrease_suspicion_desc: "Decreases §Ysecurity service suspicion§! by §G10§! points for testing."
 STP_debug_increase_loyalty: "§RDEBUG:§! Increase Apparatus Loyalty"
 STP_debug_increase_loyalty_desc: "Increases §Yapparatus loyalty§! by §G10§! points for testing."
 STP_debug_decrease_loyalty: "§RDEBUG:§! Decrease Apparatus Loyalty"
 STP_debug_decrease_loyalty_desc: "Decreases §Yapparatus loyalty§! by §R10§! points for testing."
 STP_debug_worsen_ivanov: "§RDEBUG:§! Worsen Ivanov's Condition"
 STP_debug_worsen_ivanov_desc: "Moves Ivanov's condition §Rone stage worse§! for testing. Maximum: stage 5/5."
 STP_debug_improve_ivanov: "§RDEBUG:§! Improve Ivanov's Condition"
 STP_debug_improve_ivanov_desc: "Moves Ivanov's condition §Gone stage better§! for testing. Minimum: stage 1/5."
 STP_debug_set_bop: "§RDEBUG:§! Enable BOP"
 STP_battle_for_stelander: "The Battle for Stelander"
 STP_battle_for_stelander_desc: "[STPGetPreparationInstructions]\n\n§YBefore the split, check§!\n• §YDistricts:§! a bright colour on the map shows the actual transfer; a pale colour shows only the current lead.\n• §YOperations:§! §C[?STP_political_action_slots_available|0]§! of §Y[?STP_political_action_slots_total|0]§! slots available. [STPGetPreparationPressure]\n• §YLast inspection:§! [STPGetLastPartyResponse]\n• §YShared reserve:§! £manpower_texticon §Y[?manpower|0]§!, £infantry_equipment_texticon §Y[?num_equipment@infantry_equipment|0]§!. Prepared units require real resources; the exact price is shown by the decision that forms them.[STPGetKefreytArmyCommitment]\n• §YNodrul:§! [STPGetNodStatus]\n\nThe split, loss of a district or counterintelligence can interrupt a local operation. Its own conditions state whether payments and stockpiles are returned."
 STP_PREPARATION_PRESSURE_PARTY: "§YShabrat's Underground:§! the timer shows preparations by his couriers. High apparatus loyalty delays the next operation; low loyalty accelerates it. Inspect the indicated district or intercept preparations after establishing the security collegium."
 STP_PREPARATION_PRESSURE_SHABRAT: "§YParty Commissions:§! the mission specifies the target and deadline. At suspicion of 50 or above, the party runs two commissions simultaneously. Garrison negotiations, supply work and sabotage may be exposed before they are complete."
 STP_regions_panel_title: "Whom Will Stelander Obey?"
 STP_regions_panel_tt: "Bright colours show whom a district will §Yactually join§! at the split. Pale colours show only the current lead.\n\n§YAn ordinary contested district§! joins Shabrat if at least one condition is met:\n- the resistance is entrenched and the administration has worked for §Y21 days§!;\n- resistance influence has reached §G90%§! - absolute dominance is sufficient on its own;\n- Shabrat's legitimacy is above §Y55%§! - a strong mandate takes contested districts without a prepared administration.\n\n§YNiansas§!: the §YRoad through Niansas§! focus unlocks the §YTake Over the Regional Administration§! operation. Entrenched resistance and any positive legitimacy advantage for Shabrat (§Y>0§!) are sufficient."
 STP_regions_map_tt: "§7Grey§! - contested state; §Cblue§! - Resistance; §0purple§! - Party; §Yyellow§! - local forces. Bright shades match the transfer at the split; pale shades show only a lead. Legitimacy above §Y55%§! gives contested districts to Shabrat."
 STP_regions_legend: "§7CONTESTED§!   §CRESISTANCE§!   §0PARTY§!   §YLOCAL FORCES§!"
 ADISCORD_STP_regions.1.t: "A Country in Duplicate"
 ADISCORD_STP_regions.1.d: "The map on the table before Shabrat is not a map of the front, but a map of allegiance. In one state, a chief's signature will prove decisive; in another, a council's word; in a third, the key to a depot. The party still considers these lands a single country, and will therefore send commissions wherever the network reveals itself most clearly. Before the split, we must decide what matters most in each state: claiming it for ourselves, using the locals to push the Party out, or leaving it contested while preparing one decisive asset."
 ADISCORD_STP_regions.1.a: "Begin the Battle for Stelander"
