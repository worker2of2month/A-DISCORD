 STP_ps_emergency_cabinet_desc: "1200 treasury units, 7 days. Relocates the cabinet to a held district outside Fada and resumes the interrupted stage. Retaking the Congress, losing the selected district during the work or ending the war refunds the deposit. Once relocated, losing this district while the Congress remains lost defeats the party."
 STP_ps_emergency_cabinet_administrative: "Assemble a Cabinet with District Resources"
 STP_ps_emergency_cabinet_administrative_desc: "Free, 14 days. District administrators establish a cabinet in a held district outside Fada. Work must finish before the crisis expires. Once relocated, losing this district while the Congress remains lost defeats the party."
 STP_ps_stage_available_tt: "The government is functioning; the current stage is neither active nor paused."
 STP_ps_cabinet_available_tt: "The civil war is ongoing, the government is not functioning, and a district outside Fada is owned and controlled. The cabinet has not already relocated and no other relocation is underway."
 STP_ps_congress_deadline: "Save the Party Government"
 STP_ps_congress_deadline_desc: "After losing the Bronze Congress, retake it or finish relocating the cabinet within 21 days. Failure defeats the party. Retaking the Congress preserves the remaining time for a later loss instead of granting another full deadline."
 STP_ps_congress_siege: "Fighting for the Bronze Congress"
 STP_ps_congress_siege_desc: "Shabrat's assault groups have broken into the Bronze Congress. The government keeps working while the siege lasts. Retake the Congress within §Y7 days§! or it will count as fallen."
 STP_ps_congress_siege_fall_tt: "If the Bronze Congress is not retaken, it counts as fallen: stability §R-15%§!, war support §R-10%§!, apparatus loyalty §R-20§! and a §Y21-day§! government crisis."
 STP_ps_congress_under_siege: "The Congress is contested: the government works until the siege ends."
 STP_ps_capital_defence_dynamic: "Defence of Fada"
 STP_ps_capital_defence_dynamic_desc: "While the party holds the Bronze Congress during the first two reorganisation stages, the army gains §G+10%§! defence. During a siege of the Congress the bonus is §G+20%§!. The bonus ends once the Congress has fallen."
 STP_ps_congress_siege_party_tt: "The Bronze Congress counts as fallen only if Shabrat holds it for §Y7 days§!.\nDuring the siege the government keeps working and the army gains §G+20%§! defence.\nFada militia raised: §Y[?STP.STP_ps_fada_militia_count|0]§!. Each costs §Y6000§! £manpower_texticon and §Y5400§! £infantry_equipment_texticon."
 STP_ps_congress_siege_resistance_tt: "Hold the Bronze Congress for §Y7 days§!. If the party does not retake it in time, a §Y21-day§! crisis of its government begins."
 STP_ps_congress_siege_repelled_tt: "The siege is lifted: the Bronze Congress is back in party hands and no government crisis begins."
 STP_ps_congress_siege_fell_party_tt: "A §Y21-day§! crisis begins: retake the Congress or finish relocating the cabinet to a held district outside Fada."
 STP_ps_congress_siege_fell_resistance_tt: "The party government crisis lasts §Y21 days§!. Hold the Congress and keep the party from relocating its cabinet before the deadline."
 ADISCORD_STP_cw.230.t: "Fighting in the Bronze Congress"
 ADISCORD_STP_cw.230.d_party: "In the morning the line to the government quarter went dead mid-sentence. An hour later a courier with a bandaged arm reported that Shabrat's assault groups had come through the north courtyard and taken the assembly hall. The guards still hold the stairwells and the archive wing, but the party flag no longer flies over the dome.\n\nFada did not wait for orders. The factories opened their workshop armouries, and workers' militia marched on the Congress along the same streets they had walked to rallies a week before.\n\nThe staff gives itself a week. If the building is not back by then, the whole country will hear that the Congress has fallen."
 ADISCORD_STP_cw.230.d_resistance: "Our assault groups are inside the Bronze Congress. The assembly hall is taken, but the party has not left: its guards hold the stairwells, the archive wing and the cellars, and militia from the workers' districts are already marching on the square.\n\nTaking the building is not enough. We must hold it long enough for the whole country to see that the government has lost its home. The staff believes that will take a week."
 ADISCORD_STP_cw.230.a: "Not one step back from the Congress."
 ADISCORD_STP_cw.230.b: "Hold every floor."
 ADISCORD_STP_cw.231.t: "The Assault on the Congress Is Repelled"
 ADISCORD_STP_cw.231.d_party: "By dawn the last of Shabrat's stormtroopers had been driven out of the assembly hall. The building is burnt out inside and the bronze doors are scarred by bullets, but the flag flies over the dome again, and the papers will print the photograph before rumours of the government's fall reach the districts.\n\nThe militia are going back to their workshops, though many of them remain under arms."
 ADISCORD_STP_cw.231.d_resistance: "We could not hold the Bronze Congress. Party troops and workers' militia retook the building before we could dig in, and the assault groups withdrew with losses.\n\nThe party government still works in the capital. The next assault will have to be prepared from the beginning."
 ADISCORD_STP_cw.231.a: "The Congress stands."
 ADISCORD_STP_cw.231.b: "Prepare another assault."
 ADISCORD_STP_cw.232.t: "The Bronze Congress Has Fallen"
 ADISCORD_STP_cw.232.d_party: "A week of fighting ended in silence. The archive guard surrendered, the last militia withdrew from the government quarter, and a foreign flag now hangs over the dome of the Congress.\n\nThe ministries are scattered across the suburbs, and seals and mobilisation lists are leaving on lorries. The government has three weeks to retake the building or reassemble in another district before the country decides that the party is gone."
 ADISCORD_STP_cw.232.d_resistance: "The Bronze Congress has been ours for a week. Party troops could not retake it, and the party government has lost the place from which it was used to giving orders.\n\nThe party now has three weeks to retake the Congress or relocate its cabinet. If we hold the building and stop it from reassembling, the civil war will be decided."
 ADISCORD_STP_cw.232.a: "Save the government."
 ADISCORD_STP_cw.232.b: "Hold the Congress."
 STP_ps_cabinet_work: "Establishing the Provisional Government"
 STP_ps_cabinet_work_desc: "The cabinet is being established in §Y[event_target:STP_ps_cabinet_seat.GetName]§!. Completion resumes the paused reorganisation with its saved duration. Hold this district until the war ends or the Congress is retaken. Losing it during the work cancels relocation and refunds the deposit without extending the crisis."
