 ADISCORD_STP_preparation.28.t: "The Last Shift"
 ADISCORD_STP_preparation.28.good: "By the end of the shift, the foreman had gone several weeks without borrowing parts from another workshop. A new bearing arrived on time, wages cleared that morning, and one of the old presses was working without a brace welded from scrap. The workers still complained about quotas and heat, but today the factory at least did not ask them for a daily miracle."
 ADISCORD_STP_preparation.28.bad: "Half an hour before the shift ended, the press stopped again. The warehouse had no replacement, so the foreman sent an apprentice to search discarded machinery for a compatible assembly. Wages had arrived, but prices at the factory shop had risen first. Nobody called it a catastrophe. A bad month in Stelander looked like this: work continued, with everything held together by wire, acquaintances and one more extension."
 ADISCORD_STP_preparation.28.war: "The siren sounded after the night shift had already begun. Nobody ran for a shelter: it was the signal to switch to wartime production. Civilian orders were pushed against the wall and army manifests appeared on the line. An older worker quietly noted that his father had heard very different sirens during the old war. The factory was working until dawn again, only the reasons had new names."
 ADISCORD_STP_preparation.28.a: "Another shift tomorrow."
 ADISCORD_STP_preparation.29.t: "Train to the Grey Border"
 ADISCORD_STP_preparation.29.d: "The passenger train slowed where ordinary greenery gave way to the grey band of the old restricted corridor. The conductor routinely asked everyone to keep the windows shut. Beyond the hills stood the remains of transmission lines built for late Vorkerland's flagship energy project.\n\nAn old man by the window corrected a younger passenger: it had not been an ordinary nuclear station. The complex had been built around an experimental zero-point reactor, an enormously expensive project meant to provide near-limitless power and prove the state's technical supremacy. After the accident, arguments over what exactly happened inside outlived the state itself. The grey lands remained."
 ADISCORD_STP_preparation.29.a: "The train moves on."
 ADISCORD_STP_preparation.30.t: "The Old Substation"
 ADISCORD_STP_preparation.30.d: "A repair crew opened a substation that maps still identified by its Vorkerland number. Inside were oversized cables and connectors designed for a grid that no longer existed. The engineer explained to the apprentices that nodes like this had belonged to a unified energy programme centred on the zero-point reactor.\n\nOnly isolated pieces of the megaproject remained. They were stripped for copper, restored into local grids or simply avoided. For the workers, the past was not a legend about the end of the world. It was an unusual bolt, an obsolete diagram and a warning not to walk beyond the concrete marker."
 ADISCORD_STP_preparation.30.a: "Useful inheritance can still be dangerous."
 ADISCORD_STP_preparation.31.t: "Dossier: Maksim Shabrat"
 ADISCORD_STP_preparation.31.d: "The intelligence folder was thinner than Solgalov expected. There were almost no photographs: Maksim Shabrat does not speak on state broadcasts and keeps no open army. His network lives in the highlands. Leaflets are printed in abandoned workshops and school basements, and miners, drivers and former sappers carry news faster than official orders.\n\nShabrat's strength is memory. He ties the old Vorkerland bombings to the regime's present crimes, and in the mountain villages that link sounds more convincing than any Party newspaper. Ivanov is dying, the Party is looking for a successor and Nodrul is defending its mandate. If Stelander splits, the highlands will be the first front.\n\nThe same reports show the network's weakness. It has people and caches, but it lacks rifles, ammunition and officers. The security services are searching the districts, and every cache they find damages trust in the movement.\n\nVelsky attached a short note. The underground does not need an ally who must be told the aims of the war. It needs a supplier who asks no unnecessary questions and delivers on time. Kefreyt can sell it weapons now: the rifles will go to the Niansas cache and pass to the resistance at the split. A discovered cargo would be evidence against Shabrat, but a paid delivery remains a deal, not a promise."
 ADISCORD_STP_preparation.31.a: "Open a closed supply channel."
 ADISCORD_STP_preparation.31.b: "Only watch for now."
 STP_ps_val_dossier_wait_tt: "The supply channel can still open if Shabrat's envoy approaches Kefreyt."
 ADISCORD_STP_preparation.32.t: "Kefreyt Rifles for the Highlands"
 ADISCORD_STP_preparation.32.d: "Kefreyt's offer came through a broker from a border firm. Twenty-five thousand rifles have already been taken from army depots and are waiting for dispatch. Kefreyt sets no political conditions: payment in advance, and the cargo will be delivered to the Niansas cache.\n\nKefreyt's lawyers did not mention what happens if the cache is found during a search. For them, the deal ends at delivery. For Shabrat's people, it only begins: the depot must be guarded until the open split."
 ADISCORD_STP_preparation.32.a: "Pay for the shipment."
 ADISCORD_STP_preparation.32.b: "Decline the deal."
 STP_ps_val_sale_payment_tt: "Treasury: §R-500§! £ADISCORD_economy_treasury_texticon\nKefreyt will send §Y25000§! £infantry_equipment_texticon. Preparation takes 28 days; the first dispatch takes 35 days. Before the split, the rifles go to the Niansas cache and pass to the resistance at the split. If the channel closes before delivery, the money is returned.\n$STP_ps_val_sale_pause_tt$"
 ADISCORD_STP_preparation.33.t: "Stelander Did Not Buy the Shipment"
 ADISCORD_STP_preparation.33.d: "Stelander either did not answer or refused. The broker returned the specification unsigned, and the depot took back the reserved rifles. The channel to Shabrat's people remains open: another offer can be sent later."
 ADISCORD_STP_preparation.33.a: "Return the shipment to the depot."
 STP_ps_val_sale_returned_tt: "The reserved §Y25000§! £infantry_equipment_texticon have been returned to the depot.\n$STP_ps_val_sale_pause_tt$"
 STP_ps_val_sell_rifles: "Sell Rifles to Shabrat's People"
 STP_ps_val_sell_rifles_desc: "The underground buys §Y25000§! £infantry_equipment_texticon for §Y500§! £ADISCORD_economy_treasury_texticon before the open split. Preparation takes 28 days; the first dispatch takes 35 days. Before the split, the cargo stays in the Niansas cache and then passes to the resistance. On Shabrat's route, Stelander must first agree and pay. On the Party route, the sale is a credit that Steland repays when the war begins. An intercepted shipment goes to the Party, and nobody pays for it.\n$STP_ps_val_sale_pause_tt$"
