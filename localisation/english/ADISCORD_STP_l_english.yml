 STP_ps_loyal_aircrews_desc: "Most pilots and technical services support Shabrat. A Party resolution cannot hold the airfields: reliable commanders, separate communications and assigned crews are needed. Organise the air units that will remain with the government when the country splits."
 STP_ps_loyal_aircrews_tt:0 "At the split, the Party retains approximately §Y50%§! of existing air wings and §Y50%§! of aviation reserves instead of the usual §Y40%§!. The remainder goes to Shabrat. This focus creates no aircraft; the engine rounds the wing share."

