 ADISCORD_STP_pw.8.t: "Judgment on the Old Order"
 ADISCORD_STP_pw.8.d: "A queue had formed outside the courthouse before the hearing opened. Some brought photographs of missing relatives; others carried confiscation records and orders bearing the signatures of Party officials. Inside, the list of detainees was read aloud. Several names had to be skipped: their owners had escaped, and the empty seats in the dock especially angered those who had waited years for this day.\n\nThe prosecutor demanded a single verdict. Party leaders, ministers and loyal officers had upheld the same order, then defended it by force. Their execution would bring the war to a clear conclusion. Seized archives and registers would pass to the new administrations, and appointments once secured through Party connections would be reviewed. Outside, the crowd was already demanding the rope for every traitor.\n\nThe ministries submitted different proposals. Lorian Vell knows the hospital network, Vesper Monray the schools, and Adrian Vels the standing diplomatic agreements. They could return to service after screening, under the new government's supervision. Headquarters would also accept Keitel and Dallon if they remained among the detainees: experienced officers were scarce even after victory. The remaining defendants would face individual proceedings.\n\nThe presiding judge closed the file containing the proposed collective sentence. One course already had an order prepared for the commandant. The other would require personnel files, new oaths and the signatures of people willing to answer for those they pardoned."
 ADISCORD_STP_pw.8.mercy: "Pardon the specialists. Try the others individually."
 ADISCORD_STP_pw.8.execute: "Hang every traitor."
 ADISCORD_STP_pw.8.closed: "This decision is no longer ours to make."
