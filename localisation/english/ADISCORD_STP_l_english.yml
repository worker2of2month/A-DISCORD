 STP_cw_check_district_command_unlock_summary_tt:0 "Disrupts the district underground and strengthens apparatus loyalty."
 STP_cw_interrupt_opposition_unlock_summary_tt:0 "Disrupts a liaison operation and strengthens the party in the district."
 STP_cw_seal_protocol_unlock_summary_tt:0 "Strengthens party electoral legitimacy and apparatus loyalty."
 STP_cw_publish_directive_unlock_summary_tt:0 "Strengthens the party in the election at the cost of stability."
