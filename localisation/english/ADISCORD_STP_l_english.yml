 STP_pf_army_tt: "§YArmy Command§!\nUnified command, professional appointments and frontline supply.\n\n£STP_pf_organization_effect Army organization: [?STP_pf_army_effect|=+1%].\nProgram: §Y[?STP_pf_army_program|0]/2§!. Beneficial effect cap: §Y[?STP_pf_army_capacity|1%]§!.\nContribution to apparatus loyalty: §Y[?STP_pf_army_contribution|1]§! points.\n\nStage 1: A Headquarters, Not a Commandant's Office.\nStage 2: Field General Staff / District Defence Corps.\nAt 20% influence and 70 support: §G+3% / +4% / +5%§!.\nSupport above 50 grants a benefit, below 50 a penalty. Influence scales both. Focuses develop programs and raise benefit caps. Program upgrades do not amplify penalties. Negotiations change political support but do not replace reform.\n\nEndorsement: [STPGetChapterArmyEndorsement]."
