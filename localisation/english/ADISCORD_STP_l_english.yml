 STP_ps_arm_nod: "Weapons for the Northern Front"
 STP_ps_arm_nod_desc: "Send Nodrul §Y12000§! rifles, §Y100§! artillery pieces and §Y60§! support equipment for its northern front. The price includes transport. If that war ends or the agreement becomes invalid before delivery, the paid reserve is refunded."
 STP_ps_engineers_nod_cost: "§Y3000§! £ADISCORD_economy_treasury_texticon"
 STP_ps_engineers_nod_cost_blocked: "§R3000§! £ADISCORD_economy_treasury_texticon"
