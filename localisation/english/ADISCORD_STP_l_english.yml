 STP_party_factions:0 "Apparatus and Preparation"
 STP_party_factions_desc: "Support determines cooperation; influence determines political weight. Concessions retain rival opposition instead of making every faction stronger. Negotiations cost §Y35§! £political_power_texticon and share a 30-day interval. At 60% influence or above, support can recover without handing over more offices.\n[STPGetPartyPreparationReport][STPGetPostwarCoalitionReport][STPGetWarStrainReport]"
 STP_pf_title: "BALANCE WITHIN THE PARTY"
 STP_pf_total: "Apparatus loyalty: §Y[?STP_apparatus_loyalty|1]/100§!"
 STP_pf_help: "Below emblem: live effect.\nSupport 50: neutral.\nPrograms: focus upgrades.\nHover: stages and caps."
 STP_pf_formula_tt: "Apparatus loyalty = sum of (influence × support) / 100.\nStrengthening a satisfied group reinforces the apparatus; strengthening a dissatisfied one weakens it.\nGeneral loyalty rewards change every faction's support by the stated number of points, within 0-100.\nThe threshold of 70 slows underground preparations; below 25, they accelerate. Once the war begins, political and economic consequences remain, but the preparatory underground no longer operates."
 STP_pf_cooldown_tt: "30 days have passed since the last faction agreement"
 STP_pf_nod_contacts_tt: "Nodrul exists, has not capitulated and is not at war with us; the sovereign course has not yet been fixed"
 STP_pf_balance_dynamic: "Balance of Party Factions"
 STP_pf_conservatives_name: "Conservatives"
 STP_pf_conservatives_badge: "C"
 STP_pf_conservatives_influence_loc: "Influence: §Y[?STP_pf_conservatives_influence|1]%§!"
 STP_pf_conservatives_support_loc: "Support: §Y[?STP_pf_conservatives_support|1]/100§!"
 STP_pf_conservatives_tt: "§YConservatives§!\nContinuity of government and control over appointments.\n\n£ADISCORD_economy_tax_texticon Administration expenses: [?STP_pf_conservatives_effect|=-1%].\nProgram: §Y[?STP_pf_conservatives_program|0]/2§!. Beneficial effect cap: §Y[?STP_pf_conservatives_capacity|1%]§!.\nContribution to apparatus loyalty: §Y[?STP_pf_conservatives_contribution|1]§! points.\n\nStage 1: Wartime Lists.\nStage 2: Charter of the Party State.\nAt 20% influence and 70 support: §G-3% / -4% / -5%§!.\nSupport above 50 grants a benefit, below 50 a penalty. Influence scales both. Focuses develop programs and raise benefit caps. Program upgrades do not amplify penalties. Negotiations change political support but do not replace reform.\n\nEndorsement: [STPGetChapterConservativesEndorsement]."
 STP_pf_negotiate_conservatives: "Preserve Personnel Guarantees"
 STP_pf_negotiate_conservatives_desc: "Continuity of government and control over appointments. The agreement strengthens this faction and displeases the Radical Hedonists. Cost: £political_power_texticon 35. All agreements share a 30-day cooldown."
 STP_pf_conservatives_room_tt: "Conservative influence is below 60% or support is below 60; at 60% influence or higher, negotiations change support only."
 STP_pf_conservatives_deal_tt: "§YConservatives§!: influence up to §Y+5 percentage points§! (up to 60%, with other shares reduced proportionately), support §G+12§!. §YRadical Hedonists§!: support §R-12§!. Support is bounded by 0-100; apparatus loyalty and faction effects are recalculated. At 60% influence or higher, no additional offices are transferred: only support changes."
