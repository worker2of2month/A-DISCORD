 STP_debug_start_battle_for_stelander: "§RDEBUG:§! Start the Battle for Stelander"
 STP_debug_start_battle_for_stelander_desc: "Triggers the introductory event, selects Shabrat's side and starts district work. The first commission will be appointed in 21 days; its inspection will last 40 days."
 STP_debug_reset_battle_for_stelander: "§RDEBUG:§! Reset the Battle for Stelander"
 STP_debug_reset_battle_for_stelander_desc: "Removes all regional assets and influence, then recreates the system with its initial values."
 STP_debug_end_battle_for_stelander: "§RDEBUG:§! End the Battle for Stelander"
 STP_debug_end_battle_for_stelander_desc: "Removes regional variables, flags and the active party inspection."
 STP_scenario_debug: "§RDEBUG:§! Stelander"
 STP_scenario_debug_desc:0 "Debug controls are available only to a human player in debug mode. New political checks appear after the $STP_pw_party_new_republic$ focus; one-time events do not replay."
 STP_debug_start_civil_war: "§RDEBUG:§! Start the Civil War"
 STP_debug_start_civil_war_desc: "Skips preparation and elections, then triggers the normal split. If no side has been chosen, the player remains with the party."
 STP_debug_resolve_party_victory: "§RDEBUG:§! Party Victory"
 STP_debug_resolve_party_victory_desc: "Starts the normal split if necessary and confirms party victory an hour later. The player switches to STP if still playing the resistance."
 STP_debug_resolve_shabrat_victory: "§RDEBUG:§! Shabrat's Victory"
 STP_debug_resolve_shabrat_victory_desc: "Starts the normal split if necessary and confirms Shabrat's victory an hour later. The player switches to STS if still playing the party."
 STP_REGION_RESISTANCE_INFLUENCE_VALUE: "[?STP_resistance_influence|0]%"
 STP_REGION_PARTY_INFLUENCE_VALUE: "[?STP_party_influence|0]%"
 STP_REGION_LOCAL_FORCES_INFLUENCE_VALUE: "[?STP_local_forces_influence|0]%"
 STP_cw_agree_with_commander: "Negotiate with the Commander: [FROM.GetName]"
 STP_cw_agree_with_commander_desc: "For §Y45§! £political_power_texticon and £command_power_texticon §Y20§!, the commander will prepare personnel for two additional party brigades in §Y14 days§!. Negotiations do not count as a search and do not alter legitimacy; underground connections will survive. Apparatus loyalty: §G+6§!. At the split, the units will appear in party-controlled states if the district remains with the party and sufficient personnel and weapons are available. The operation occupies one preparation slot; loss of control or suspension of district work interrupts negotiations."
 STP_cw_commander_agreement_tt: "If the district remains with the party, we will prepare two additional brigades. Their personnel are reserved before the general allocation. Each unit requires £manpower_texticon §Y6000§! and £infantry_equipment_texticon §Y5400§! from party stockpiles. Underground connections are preserved."
 STP_cw_evacuate_garrison_officers: "Evacuate the Officers to Abilia"
 STP_cw_evacuate_garrison_officers_desc: "For §Y35§! £political_power_texticon and in §Y7 days§!, we will evacuate officers connected to us from the district under commission inspection. Local garrison connections will disappear, but the cadres will be preserved for two additional brigades. At the split, the units can be formed in states owned and controlled by the resistance, provided it has enough personnel and weapons. One group can be saved from each garrison: evacuated personnel cannot be recruited again. The operation occupies one slot and must finish before this commission's verdict. The commission will inspect other connections as usual."
 STP_cw_evacuation_result_tt: "The garrison officers will move to Abilia; §Y12§! influence will pass to the party. At the split, Shabrat will be able to form two brigades regardless of the district's fate. Each requires £manpower_texticon §Y6000§! and £infantry_equipment_texticon §Y5400§! from his stockpiles. The local garrison cannot be recruited again."
 STP_cw_garrison_evacuated: "This garrison's cadres have already been evacuated to Abilia"
 STP_cw_garrison_evacuation_in_progress: "The officers' evacuation began during the current inspection"
 STP_cw_opposition_target: "An announced underground operation is being prepared in the district"
 STP_REGION_GARRISON_EVACUATED: "\n  §C- officers in Abilia: two Shabrat brigades regardless of the district's fate§!; each requires £manpower_texticon §Y6000§! and £infantry_equipment_texticon §Y5400§!. The local garrison cannot be recruited again."
 STP_REGION_GARRISON_EVACUATING: "\n  §Y- officers are being evacuated to Abilia: 7 days, before the current commission's verdict.§!"
 STP_OPPOSITION_NO_TARGET: "operation disrupted or no suitable districts available"
 STP_OPPOSITION_ADMINISTRATION: "\n\n§RUnderground Objective:§! strengthen the network. After 28 days of preparation, influence will increase by 12; if its position is entrenched, the underground will gain a local administration. A command inspection will disrupt this operation."
 STP_OPPOSITION_GARRISON: "\n\n§RUnderground Objective:§! win over the garrison. Once the operation is complete, it can provide Shabrat with a brigade requiring payment if the district changes sides. A command inspection will disrupt the operation."
 STP_OPPOSITION_SUPPLY: "\n\n§RUnderground Objective:§! prepare a depot. On completion, 1200 will leave the treasury if available. If the district changes sides, Shabrat will receive supply support and up to 500 fuel from Stelander's reserve. A command inspection will disrupt the operation."
 STP_OPPOSITION_SABOTAGE: "\n\n§RUnderground Objective:§! arm saboteurs. On completion, 2400 rifles will leave the shared stockpile for a forest cache if enough are available. At the split, they will go to the district's owner; if the forest remains under party control, one existing infrastructure level will be damaged. A command inspection will disrupt the operation."
 STP_OPPOSITION_INFLUENCE: "\n\n§RUnderground Objective:§! secure influence before the split. Success will provide 12 influence and shift legitimacy 4% towards Shabrat. A command inspection will disrupt the operation."
 STP_preparation_slot_available_tt: "A preparation slot is available"
 STP_preparation_district_open_tt: "District work has not been suspended by counterintelligence or the surrender of an official"
 STP_FALSE_TRAIL_ODDS_HIDDEN: "At the end of the commission, the game makes a single roll based on suspicion that day (currently [?STP_party_suspicion|0]). Outcomes: convincing trail §G60%§!, imperfect trail 30%, courier detained 10%, counterintelligence breakthrough 0%."
 STP_FALSE_TRAIL_ODDS_LOW: "At the end of the commission, the game makes a single roll based on suspicion that day (currently [?STP_party_suspicion|0]). Outcomes: convincing trail §G35%§!, imperfect trail 40%, courier detained 20%, counterintelligence breakthrough §R5%§!."
 STP_FALSE_TRAIL_ODDS_MEDIUM: "At the end of the commission, the game makes a single roll based on suspicion that day (currently [?STP_party_suspicion|0]). Outcomes: convincing trail 15%, imperfect trail 35%, courier detained 35%, counterintelligence breakthrough §R15%§!."
 STP_FALSE_TRAIL_ODDS_HIGH: "At the end of the commission, the game makes a single roll based on suspicion that day (currently [?STP_party_suspicion|0]). Outcomes: convincing trail 5%, imperfect trail 20%, courier detained 40%, counterintelligence breakthrough §R35%§!."
 STP_network_result_tt: "§Y[FROM.GetName]§!: resistance influence §C+12§!. Suspicion: §R+6§!."
 STP_disperse_result_tt: "Suspicion: §G-10§! (minimum 0)."
 STP_official_result_tt: "§Y[FROM.GetName]§!: resistance administration. Resistance influence: §C+8§!. Suspicion: §R+6§!."
 STP_council_agreement_result_tt: "§Y[FROM.GetName]§!: agreement to join Shabrat. Local forces' influence: §Y+10§!. Suspicion: §R+3§!."
 STP_false_trail_result_tt: "The current commission §Gimmediately ends its inspection§! and follows the false trail. Prepared assets are preserved. The district cannot be targeted by another commission for §Y28 days§!. Shabrat legitimacy: §G+4%§!. Local forces: §G+4§! influence. Suspicion: §G-4§!. Party influence: §R+3§!."
 STP_region_operation_2_result_tt: "§Y[2.GetName]§!: resistance garrison and administration. Resistance influence: §C+15§!. Suspicion: §R+7§!. A surviving agreement provides a foothold and two brigades requiring payment if the district actually changes sides. The commission can prevent the transfer; evacuating the officers preserves the units without the local foothold."
 STP_region_operation_3_result_tt: "§Y[3.GetName]§!: supply depot. Resistance influence: §C+6§!. Suspicion: §R+5§!."
 STP_region_operation_29_result_tt: "§Y[29.GetName]§!: resistance garrison and administration. Resistance influence: §C+15§!. Suspicion: §R+8§!. A surviving agreement provides a foothold and two brigades requiring payment if the district actually changes sides. The commission can prevent the transfer; evacuating the officers preserves the units without the local foothold."
 STP_region_operation_45_result_tt: "§Y[45.GetName]§!: resistance administration. Resistance influence: §C+12§!. Suspicion: §R+4§!."
 STP_region_operation_46_result_tt: "§Y[46.GetName]§!: supply depot. Resistance influence: §C+8§!. Suspicion: §R+6§!."
 STP_region_operation_53_result_tt: "§Y[53.GetName]§!: sabotage team with £infantry_equipment_texticon §Y2400§! paid rifles. Resistance influence: §C+6§!. Suspicion: §R+10§!."
 STP_cw_sabotage_capital_preparation_tt: "Separate operation in §Y[28.GetName]§!:\n- Preparation time: §Y14 days§!.\n- Cost paid on launch: §Y10§! £political_power_texticon and £infantry_equipment_texticon §Y2400§!.\n- Uses §Y1 preparation slot§! while active.\nIf the team is lost, the operation can be repeated at the same price. Ordinary district operations remain unavailable in the capital."
 STP_cw_sabotage_capital_result_tt: "When preparation in §Y[28.GetName]§! is complete:\n- A sabotage team is ready.\n- Resistance influence: §G+12§!.\n- Party suspicion: §R+8§!.\n\nAt the split, if the team survives and the party owns and controls the capital:\n- Damage to §Y2§! infrastructure levels and §Y1§! military factory.\n- Party army organisation: §R-15%§! for §Y70 days§!.\n- Party planning speed: §R-25%§! for §Y70 days§!.\nIf the capital joins the resistance, the sabotage will not trigger and the buildings will be preserved."
 STP_cw_sabotage_industry_result_tt: "If the party retains §Y[29.GetName]§! at the split: damage to §Y2§! civilian factories; for §Y70 days§!, military factory output §R-20%§! and production efficiency cap §R-15%§!. If the district joins the resistance, the factories will be preserved. Resistance influence §G+10§!, suspicion §R+5§!."
 STP_cw_capital_owned_tt: "We own the capital"
 STP_cw_delay_election_tt: "§YAs soon as the focus is selected§!, the current vote and active credentials review are extended by §Y80 days§!."
 STP_cw_vorkerland_collapsed_tt: "Vorkerland has collapsed"
 STP_cw_loyalty_start_tt: "Apparatus loyalty starts at §Y40§!: this is the support of seven factions, weighted by their influence. High loyalty delays courier operations and provides political power; low loyalty accelerates the underground and harms stability."
 STP_cw_loyalty_plus_4_tt: "Support from all factions: §G+4§! (maximum 100). Apparatus loyalty is recalculated according to their influence."
 STP_cw_loyalty_plus_5_tt: "Support from all factions: §G+5§! (maximum 100). Apparatus loyalty is recalculated according to their influence."
 STP_cw_loyalty_plus_6_tt: "Support from all factions: §G+6§! (maximum 100). Apparatus loyalty is recalculated according to their influence."
 STP_cw_loyalty_plus_8_tt: "Support from all factions: §G+8§! (maximum 100). Apparatus loyalty is recalculated according to their influence."
 STP_cw_loyalty_plus_10_tt: "Support from all factions: §G+10§! (maximum 100). Apparatus loyalty is recalculated according to their influence."
 STP_cw_loyalty_minus_6_tt: "Support from all factions: §R-6§! (minimum 0). Apparatus loyalty is recalculated according to their influence."
 STP_cw_loyalty_minus_8_tt: "Support from all factions: §R-8§! (minimum 0). Apparatus loyalty is recalculated according to their influence."
 STP_cw_security_collegium_tt: "An order will become available to intercept an announced courier operation in the specified district."
 STP_cw_protocol_office_tt: "During the election, the electoral record can be sealed once: §Y35§! £political_power_texticon, 14 days, one preparation slot."
 STP_cw_public_lists_tt: "Public lists shift the mandate further, but harm apparatus loyalty and stability."
 STP_cw_quiet_registers_tt: "A closed review preserves office discipline at the cost of a smaller shift in the mandate."
 STP_cw_counter_network_tt: "In §Y[2.GetName]§! and §Y[29.GetName]§!, party influence: §G+10§!."
 STP_cw_press_office_tt: "A repeatable party directive order will become available: §Y40§! £political_power_texticon, 14 days, one preparation slot."
 STP_cw_capital_oath_tt: "The capital garrison will reaffirm its obedience to the cabinet. Headquarters will receive experience and command power."
 STP_cw_party_mandate_tt: "The apparatus brings the presidium and district programme together into a common electoral mandate."
 STP_cw_interrupt_opposition: "Intercept the Couriers: [FROM.GetName]"
 STP_cw_interrupt_opposition_desc: "For §Y40§! £political_power_texticon and in §Y10 days§!, we will disrupt the announced courier operation in [FROM.GetName]. We must finish before their timer ends; the operation occupies one slot. Success gives the party 8 influence, shifts legitimacy 3% towards the party and raises apparatus loyalty by 8. A new target will appear the next day."
 STP_cw_interrupt_opposition_tt: "The announced courier operation in §Y[FROM.GetName]§! is disrupted. Party influence: §G+8§!. Shabrat's legitimacy: §G-3%§!."
 STP_cw_publish_directive: "Issue a Party Directive"
 STP_cw_publish_directive_desc: "For §Y40§! £political_power_texticon and in §Y14 days§!, the departmental editorial office will issue a directive. Legitimacy will shift 4% towards the party, apparatus loyalty will rise by 6 and stability will fall by 2%. The operation occupies one slot and can be repeated after 28 days."
 STP_cw_publish_directive_tt: "The directive shifts the mandate towards the party and reinforces departmental discipline."
 STP_cw_seal_protocol: "Seal the Electoral Record"
 STP_cw_seal_protocol_desc: "For §Y35§! £political_power_texticon and in §Y14 days§!, the office will secure the seals and delegate lists. Legitimacy will shift 6% towards the party, and apparatus loyalty will rise by 8. The order is available once while the election is underway and occupies one slot."
 STP_cw_seal_protocol_tt: "The electoral record's seals are secured by the party until the election ends."
 STP_district_check_result_tt: "§Y[FROM.GetName]§!: underground organisations seized and their work prohibited for §Y56 days§!. Party influence: §0+15§!. Discovered organisations give the party 4% legitimacy; a fruitless inspection gives Shabrat 2%."
 STP_rifle_cache_result_tt: "The £infantry_equipment_texticon §Y160000§! paid rifles will reach Abilia's reserve for Shabrat. If preparation closes or the depot is full, the shipment will return to the shared state stockpile."
 STP_inspection_delay_result_tt: "The selected commission in §Y[FROM.GetName]§! will be extended by §Y14 days§!. Other commissions retain their deadlines. One preparation slot will be occupied throughout this period; when preparation ends, it will be freed without refunding political power."
 STP_party_inspection_active: "A party commission is working in the district"
 STP_resistance_garrison_asset: "The district garrison supports the resistance"
 STP_inspection_resolution_tt: "When the timer ends, the commission applies the chosen response. Without an accepted concession, military contacts are exposed and civil connections checked. A successfully completed false trail ends the current inspection early."
 STP_preparation_rifle_refund_tt: "Cancellation returns only weapons still reserved by this order. Political power is not refunded."
 # Legitimacy
 STP_shabrat_election_legitimacy: "Party Election Legitimacy"
 STP_shabrat_election_legitimacy_desc: "The gauge shows whose victory the delegates will recognise. Shabrat needs a value above §Y+10%§! when the election ends to win. At §Y+10%§! or below, the party apparatus retains the electoral record. Above §Y+55%§!, contested districts join Shabrat even without a prepared administration; the republics and Livonin agreement retain their separate grounds.\n\nPersonnel and rifles are first reserved for paid preparations and baseline armies. An ordinary Party victory plans §Y16§! line brigades and §Y6§! assault divisions for each side, with the surplus divided §Y40% / 40% / 20%§! between the party, Shabrat and the republics. A Shabrat victory plans §Y14 / 16§! line brigades and divides the surplus §Y30% / 50% / 20%§!. Shortages limit actual deployments; local garrisons and caches are handled separately.\n\nAircraft pass to Shabrat. Only the completed §YLoyal air units§! focus preserves roughly §Y20%§! of the wings and aircraft reserves for the party.\n\nThe election ends in civil war regardless of the result. In an early uprising, unallocated personnel are divided equally between the party and resistance, while weapons are divided §Y40% / 40% / 20%§! between the party, resistance and republics."
 STP_party_election_legitimacy_side: "Party Apparatus"
 STP_shabrat_election_legitimacy_side: "Shabrat"
 STP_election_legitimacy_contested_range: "The Electoral Record Remains with the Apparatus"
 STP_party_election_low_control_range: "A Narrow Apparatus Lead"
 STP_party_election_medium_control_range: "A Steady Apparatus Lead"
 STP_party_election_high_control_range: "A Majority for the Apparatus"
 STP_party_election_total_control_range: "Delegates Support the Apparatus"
 STP_shabrat_election_low_control_range: "A Narrow Shabrat Lead"
 STP_shabrat_election_medium_control_range: "A Steady Shabrat Lead"
 STP_shabrat_election_high_control_range: "A Majority for Shabrat"
 STP_shabrat_election_total_control_range: "Delegates Support Shabrat"
 STP_shabrat_election_bop_category: "Party Elections"
 STP_shabrat_election_bop_category_desc: "§YHow to read the scale§!: Left is the Party Apparatus and right is Shabrat. Moving right is political progress for the resistance. Shabrat-side range tooltips preview the post-election military spirit his future side can receive if he wins. They are not a current national bonus for Stelander.\n\nFocuses unlock political work, but statements alone are not enough. Every 35 days, delegates review credentials. The absence of a functioning administration in Monaia or Niansas costs Shabrat 8% legitimacy each.\n\n§YDistrict Transfers at the Split§!: an ordinary contested district joins Shabrat with entrenched influence and an administration that has worked for 21 days. §G90% resistance influence§! guarantees the transfer even without an administration. Shabrat's strong mandate §Yabove 55%§! also secures a contested district. In Niansas, after the §YRoad through Niansas§! focus, a special operation can be conducted with any positive legitimacy advantage for Shabrat (§Y>0§!).\n\n§YSuspicion§!: at §Y60%§!, a §Rsecond commission§! is unlocked and the Party can conduct two inspections simultaneously. §Y70%§! marks the crisis stage of surveillance. At §R90%§!, Shabrat is on operational watchlists. At §R100%§!, Shabrat will be arrested if still available. An arrest that has already taken place is irreversible. Before an inspection begins, a selected district can be shielded from new commissions for §Y40 days§! for §Y25§! £political_power_texticon and £ADISCORD_economy_treasury_texticon §Y600§!. This protection does not cancel an inspection already in progress."
 STP_cw_bop_shabrat_majority_preview_tt:0 "§YFuture Shabrat-side mandate§!: if Shabrat wins the election, his future side receives §G+20% Army Organization Regain§!, §G+10% Core Defence§!, §G-15% Training Time§! and §G+20% Mobilization Speed§!.\n§LPreview only. These modifiers are not active on current Stelander.§!"
 STP_cw_bop_shabrat_strong_preview_tt:0 "§YFuture Shabrat-side mandate§!: if Shabrat wins with a strong mandate, his future side receives §G+30% Army Organization Regain§!, §G+15% Core Defence§!, §G-20% Training Time§! and §G+30% Mobilization Speed§!.\n§LPreview only. These modifiers are not active on current Stelander.§!"
 STP_cw_negotiate_with_delegates: "Negotiate with Delegates"
 STP_cw_negotiate_with_delegates_desc: "Secure the support of wavering delegates in 14 days. Negotiations occupy one preparation slot. New negotiations are available while our side's advantage on the legitimacy gauge remains below 55%: one deal cannot win over the committed opponents who remain."
 STP_cw_open_election_campaign: "Open Campaigning"
 STP_cw_open_election_campaign_desc: "A public campaign takes 21 days and one preparation slot. Three campaigns can be held during the election: general, district and final. The second unlocks after the first 35 days of the election, and the third after 70 days. For Shabrat's second campaign, an administration in Monaia or Niansas must have worked for 21 days; for the third, both are required. If a required administration is lost before completion, the campaign fails without refunding political expenses.\n\nCampaigns completed: [?STP_cw_completed_public_campaigns|0] of 3."
 STP_cw_election_operation_slot_tt: "A preparation slot is available."
 STP_debug_increase_party_bop: "§RDEBUG:§! BOP: Increase Party Influence by 25"
 STP_debug_increase_party_bop_desc: "Shifts the balance of power §Y25 points§! towards the party apparatus."
 STP_debug_increase_shabrat_bop: "§RDEBUG:§! BOP: Increase Shabrat's Influence by 25"
 STP_debug_increase_shabrat_bop_desc: "Shifts the balance of power §Y25 points§! towards Shabrat."
 # Interface
 STP_STATE_FACE_TITLE: "Leader's Health"
 STP_STATE_FACE_STAGE_1_loc: "Stable Condition"
 STP_STATE_FACE_STAGE_2_loc: "Growing Exhaustion"
 STP_STATE_FACE_STAGE_3_loc: "Severe Weakness"
 STP_STATE_FACE_STAGE_4_loc: "Critical Condition"
 STP_STATE_FACE_STAGE_5_loc: "The Leader's Death"
 STP_STATE_FACE_STAGE_1_TOOLTIP:0 "§YStage 1/5 - Stable Condition§!\n\nIvanov remains capable of working and personally holds the apparatus together. His health does not yet place additional pressure on the regime's stability.\n\n£stability_texticon §YEffect on Stability:§! §G0%§!"
 STP_STATE_FACE_STAGE_2_TOOLTIP:0 "§YStage 2/5 - Growing Exhaustion§!\n\nSigns of overwork are emerging. The apparatus still compensates for the leader's weakness through discipline, but the system's dependence on one man is becoming apparent.\n\n£stability_texticon §YEffect on Stability:§! §R-5%§!"
 STP_STATE_FACE_STAGE_3_TOOLTIP:0 "§YStage 3/5 - Severe Weakness§!\n\nIvanov increasingly acts through confidants, recordings and prepared speeches. Within the regime, succession can no longer be treated as a distant threat.\n\n£stability_texticon §YEffect on Stability:§! §R-10%§!"
 STP_STATE_FACE_STAGE_4_TOOLTIP:0 "§YStage 4/5 - Critical Condition§!\n\nThe formal hierarchy remains, but its centre has almost ceased to function. Elites and security officials are preparing for a power vacuum while the leader is still alive.\n\n£stability_texticon §YEffect on Stability:§! §R-20%§!"
 STP_STATE_FACE_STAGE_5_TOOLTIP:0 "§YStage 5/5 - The Leader's Death§!\n\nIvanov no longer holds the system together personally. The machinery of state continues by inertia while its participants decide who will inherit the remaining power.\n\n£stability_texticon §YEffect on Stability:§! [?STP_fading_father_stability_factor|=+0%]"
 # Civil war
 STP_cw_first_health_decline: "Ivanov's health has deteriorated for the first time"
 STS: "Steland"
 STS_DEF: "Steland"
 STS_ADJ: "Stelandian"
 SRP: "Occidian Revival Union"
 SRP_DEF: "the Occidian Revival Union"
 SRP_ADJ: "Occidian"
 SRP_Federal_Council: "Occidian Union Council"
 STP_cw_election_window: "Electing a New Chairman: 140 Days"
 STP_cw_election_window_desc: "Voting lasts §Y140 days§!. The Delay the Electoral Commission focus extends the current vote and credentials review by §Y80 days§! once. Shabrat needs more than §Y10%§! legitimacy on his side to win and receive a military mandate. Above §Y55%§!, contested districts join him even without a prepared administration. Support of at least §Y80%§!, recognition from the military command, and administrations in Monaia and Niansas that have worked uninterrupted for at least §Y21 days§! by the announcement of the result will limit the party's uprising to a revolt in the capital. Losing an administration resets its duration; after restoration, the count starts again.\n\nAt the split, personnel and weapons are allocated to prepared units first, then to the basic armies. The remainder is distributed in favour of the election winner. Military and political preparations use shared slots; operations already begun must be finished before the split."
 STP_cw_raise_district_network: "Expand the Underground Network in [FROM.GetName]"
 STP_cw_raise_district_network_desc: "In §Y14 days§!, we will establish connections in [FROM.GetName]. After strengthening the resistance, we can recruit the local administration; together they will determine the district's transfer at the split. Check the map forecast."
 STP_cw_prepare_rifle_cache: "Replenish the Resistance Reserve"
 STP_cw_prepare_rifle_cache_desc: "During the election, we will allocate £infantry_equipment_texticon §Y160000§! equipment from state depots to Abilia's reserve. Delivery takes §Y28 days§!, §Y35§! £political_power_texticon and one preparation slot; suspicion rises by 5. The total reserve, including shipments in transit, is limited to §Y960000§! equipment. Only a completed order will go entirely to the resistance. At the split, an unfinished delivery returns to the state stockpile before it is divided; political power is not refunded."
 STP_cw_disperse_network: "Lie Low"
 STP_cw_disperse_network_desc: "We will suspend open activity and change couriers for §Y10 days§!. The operation can be repeated after §Y30 days§!."
 STP_cw_trigger_northern_incident: "Present the Border Evidence"
 STP_cw_trigger_northern_incident_desc: "We will publish documents concerning preparations for intervention and demand an investigation. For §Y25§! £political_power_texticon, Nodrul's active preparation period will be extended once by §G56 days§!. This decision does not cancel an intervention already underway or restart preparations that have been closed."
 STP_cw_supply_the_north: "Northern Shipment: [FROM.GetName]"
 STP_cw_supply_the_north_desc: "For §Y40§! £political_power_texticon, we will send [FROM.GetName] £infantry_equipment_texticon §Y24000§! equipment from our stockpiles. Delivery takes 21 days; another shipment to this recipient becomes available after a 42-day cooldown. Only one shipment can be in transit at a time.\n\nThe recipient must remain at war with Nodrul. If cancelled, the weapons return, but the organisational expenses do not. At the split, undelivered weapons return to Stelander's shared stockpile before it is divided. The delivery helps the northerners reinforce their divisions; it does not directly change the intervention deadline."
 STP_cw_start_uprising: "Begin Shabrat's Uprising"
 STP_cw_start_uprising_desc: "While Nodrul is fighting its northern war, we can begin an early uprising. This opportunity closes after its army returns. The uprising interrupts the election and unfinished operations; Shabrat will receive no electoral mandate.\n\nDistrict preparations determine footholds, stockpiles and additional units. You will continue as Shabrat."
 STP_cw_cost_240_rifles: "£infantry_equipment_texticon §Y2400§!"
 STP_cw_war_council:0 "War and Recovery"
 STP_cw_war_council_desc:0 "Choose the programme you need and check its price and duration. Unit formation consumes real reserves.\n[STPGetPartySurvival][STPGetRecoveryReport][STPGetKefreytArmyCommitment][STPGetWarStrainReport][STPGetStalledWarReport]"
 STP_cw_raise_territorial_brigade: "Form a Territorial Brigade"
 STP_cw_raise_territorial_brigade_tt: "£manpower_texticon §Y6000§! personnel and £infantry_equipment_texticon §Y5400§! infantry equipment will be allocated from our reserves. §Y1 territorial brigade§! of six line battalions will appear in a state we own and control, fully supplied with personnel and weapons."
 STP_cw_raise_territorial_brigade_desc:0 "After the mobilization register, form one fully equipped territorial brigade every 14 days for §Y25§! £political_power_texticon. Shabrat recruits volunteers without using manpower or weapons reserves. The party and republics also pay £manpower_texticon §Y6000§! personnel and £infantry_equipment_texticon §Y5400§! rifles. Requires a state we own and control. Emergency orders close after peace."
 STP_CW_FORECAST_REPUBLICS: "§YOccidia§!"
 STP_CW_FORECAST_RESISTANCE: "§GShabrat's Resistance§!"
 STP_CW_FORECAST_PARTY: "§RParty Government§!"
 STP_CW_FORECAST_REASON_OVERWHELMING: "\n§GReason:§! the resistance controls at least §Y90%§! influence. Such absolute dominance alone guarantees that the district joins Shabrat."
 STP_CW_FORECAST_REASON_NIANSAS_SECURED: "\n§GReason:§! Niansas's regional administration has already been taken over; the district will join Shabrat if entrenched influence is maintained."
 STP_CW_FORECAST_REASON_SECURED: "\n§GReason:§! the conditions for transferring the district to Shabrat have already been met."
 STP_CW_FORECAST_REASON_COUNTERINTELLIGENCE: "\n§RWhy the Party Still Holds It:§! counterintelligence has closed regional preparations. The Resistance Entrenched status alone does not mean a transfer. A prepared administration, Shabrat's strong mandate above 55%, or absolute resistance influence of at least 90% is required."
 STP_CW_FORECAST_REASON_NIANSAS_ROUTE: "\n§YWhy the Party Still Holds It:§! the resistance is entrenched, but a basis for transfer is not ready. Shabrat's route: §YRoad through Niansas§!, a legitimacy advantage of §Y>0§!, and §YTake Over the Regional Administration§!. Other grounds: 90% influence, an administration aged 21 days, or a mandate above 55%."
 STP_CW_FORECAST_REASON_ADMINISTRATION_RECENT: "\n§YWhy the Party Still Holds It:§! the resistance administration has not yet worked for §Y21 days§!. After that, the district may join Shabrat if entrenched influence is maintained."
 STP_CW_FORECAST_REASON_ADMINISTRATION: "\n§YWhy the Party Still Holds It:§! the resistance is entrenched, but no administration is ready. Joining Shabrat requires an administration aged §Y21 days§!, 90% influence, or a mandate above 55%."
 STP_CW_FORECAST_REASON_INFLUENCE: "\n§YWhy the Party Still Holds It:§! the resistance has not yet secured the district's transfer. It needs entrenched influence and a basis for transfer; at §Y90%§! influence, the district will join Shabrat automatically."
 STP_CW_CACHE_READY: "Weapon cache: §Y[?STP_cw_cached_rifles|0]§! units"
 STP_CW_CACHE_PENDING: "Cache preparation: §Y[?STP_cw_pending_rifles|0]§! units in transit"
 STP_cw_defensive_preparation: "Prepared Defence"
 STP_cw_defensive_preparation_desc: "Headquarters has linked fortifications, reserves and supply routes into a common defensive plan."
 STP_cw_offensive_preparation: "Orders to the Districts"
 STP_cw_offensive_preparation_desc: "Commanders received their tasks for the opening weeks of the offensive in advance. Stockpiles and momentum will last only a short time."
 ADISCORD_STP_preparation.1.t: "When the Door Closed"
 ADISCORD_STP_preparation.1.d: "The report on the state of the republic followed its familiar course. Ivanov sat beside the map, ministers took turns reciting figures, and the secretary moved folders from left to right. Halfway through the report, the president asked to hear a paragraph that had already been read. A few minutes later, he lost his place again. The doctor approached the table and, for the first time, did not wait for permission.\n\nThe remaining meetings were cancelled. The ministers were asked to leave for the adjoining hall, and the doors to the presidential office closed. Almost immediately, Hedersett instructed the chancery to route current paperwork through the cabinet. He spoke quietly, as though this were a temporary adjustment to the schedule.\n\nShabrat appeared in the corridor before the last officials had dispersed. Under his arm was a folder with no coat of arms or registration number. He asked for ten minutes alone with Ivanov. Hedersett replied that the president needed rest. No one present believed the argument was about health.\n\nUntil today, the state could pretend that nothing at the top had changed. Now even the right to open a single door meant the right to speak for Stelander's future."
 ADISCORD_STP_preparation.1.a: "Let Shabrat in."
 ADISCORD_STP_preparation.3.t: "The Last Signature"
 ADISCORD_STP_preparation.3.d: "Pyotr Ivanov signed his last document in the evening. The signature came out uneven, and the secretary held the sheet for a moment, as though about to ask the president to sign again. Then he thought better of it.\n\nBy morning, the office was closed. The doctors came out first. Hedersett followed and asked the head of the chancery to prepare an address to the nation. He offered no solemn phrases. Pyotr Ivanov, the man whom several generations associated with the end of the war, had died in the night.\n\nThe news spread faster than the official announcement. Flowers began appearing at monuments. Old bells rang in the highland districts. In the ministries, officials continued stamping documents with the name of a man who was no longer alive. No one yet knew what to replace it with.\n\nHedersett took over current affairs and called an election for a new chairman. Shabrat demanded that the procedure be opened to district delegates and the army. The party apparatus began checking lists, garrisons and the commissions' powers. The country was given a deadline to answer the question postponed throughout Ivanov's peace: who owns power after the man on whom it rested?"
 ADISCORD_STP_preparation.3.a: "The country woke without Ivanov."
 ADISCORD_STP_preparation.4.t: "The Disputed Electoral Record"
 ADISCORD_STP_preparation.4.d: "The count finished late at night. The last sheets were entered into the record, the seals checked twice, and the district representatives signed. Then the secretary handed the document to the losing side.\n\nNo signature followed.\n\nAt first they argued over a few credentials. Then over the commission's right to consider them valid. Then over whether the congress itself had the right to hand the country to a man whom part of the army did not recognise. While the lawyers argued in the hall, queries were already arriving from garrisons asking whose orders should be considered lawful.\n\nThe external war had changed the map faster than the chancery could change the electoral rules. Some administrations no longer controlled the territories in whose name they voted. Some units were already receiving two mutually exclusive orders. There would be no second vote.\n\nBy dawn, it was clear that the dispute was no longer about the record. The paper merely marked the moment when one country began recognising two different authorities."
 ADISCORD_STP_preparation.4.a: "The record was no longer just paper."
 ADISCORD_STP_preparation.10.t: "The Northern Campaign"
 ADISCORD_STP_preparation.10.d: "There were two directions on the map before Tobis Bentliks. To the south lay Stelander, where Ivanov's death was turning decades of Nodrul's influence into a disputed inheritance. To the north, Yubor, the Cult of the Children of the Forest and the Free Frontier were assembling a defensive alliance.\n\nThe general staff proposed settling the northern question first. As long as these states retained their armies and a shared border, any major move south would leave Nodrul vulnerable. Diplomats objected that every month of delay gave Shabrat time to turn a resistance into a government.\n\nBentliks spent a long time looking at Stelander rather than the offensive arrows. For Nodrul, this country had always proved that a treaty, a school and the right adviser could achieve more than an occupying army. If it had to be held by force after Ivanov's death, the very idea of such an order would be called into question.\n\nAn attempt could be made to settle the north quickly. Stelander had made no promise to wait."
 ADISCORD_STP_preparation.10.a: "Secure the north first."
 ADISCORD_STP_preparation.10.b: "The army will be needed closer to Stelander."
 ADISCORD_STP_preparation.13.t: "Nodrul Turns North"
 ADISCORD_STP_preparation.13.d: "The first reports came from railway workers. Trains that usually headed for the southern depots began moving north. Intelligence then confirmed the transfer of headquarters and engineer units. Nodrul was preparing for a war of its own.\n\nNo one at Shabrat's headquarters called the northern states allies. They were not fighting for Steland and probably cared little about its elections. But every battalion Bentliks sent against them could not cross our border at the same time.\n\nNew markers appeared on the map. For the first time in the crisis, the clock was not working only against us. No one knew how long the advantage would last.\n\n§YWe can reinforce that advantage.§! The §Y'Northern Dossier'§! branch can lead into §Y'Arm the North'§! and then the §Y'Northern Aid Desk'§!. Once the war begins, decisions let us ship weapons to the northern states, fund fortifications, send engineers and sabotage Nodrul's rear."
 ADISCORD_STP_preparation.13.party: "The first reports came from railway workers. Nodrulian trains and headquarters units were moving north: Bentliks was preparing to open a front of his own. For the Party, the arithmetic was unpleasant — every division committed there was one less division available to reach Stelander if the internal crisis became a war.\n\nBut the northern front can be supported. The §Y'Northern Partner'§! branch lets the Party finance Nodrul, send weapons and reinforce its active army. If the north collapses, the Party loses its most important external reserve."
 ADISCORD_STP_preparation.13.a: "Someone else's war bought us time — and we can help it last."
 ADISCORD_STP_preparation.13.party_a: "The north cannot be abandoned."
 STP_cw_northern_event_help_tt: "§YYou can directly aid Nodrul's northern opponents.§!\n§Y'Arm the North'§! unlocks weapon shipments, while the §Y'Northern Aid Desk'§! opens fortifications, engineer missions and sabotage against Nodrul. These tools transfer to Shabrat's resistance after the split."
 STP_ps_northern_event_help_tt: "§YThe Party can support Nodrul on the northern front.§!\n§Y'Northern Partner'§!, §Y'Credit to the War Ministry'§! and §Y'Arms for the Northern Front'§! open financing, equipment shipments and engineer support."
 ADISCORD_STP_preparation.14.t: "The North Fell Silent"
 ADISCORD_STP_preparation.14.d: "For several days intelligence waited for confirmation, but the northern campaign never began. Orders might have been cancelled in Nodrul, the alliance might have lost its purpose, or circumstances might have changed before mobilisation was complete. The reason no longer mattered.\n\nOn the headquarters map, the pins marking Nodrul's units began moving back towards the southern roads. Preparations for intervention in Stelander required no open war and could continue behind closed doors.\n\nShabrat silently removed several marks showing the time we had gained. If the party was not defeated quickly, the next column on that road might be heading for us."
 ADISCORD_STP_preparation.14.a: "Now the clock works only against us."
 ADISCORD_STP_cw.20.t: "The West after Stelander"
 ADISCORD_STP_cw.20.d: "A new border appeared on Kefreyt's map. Where a united state had stood until recently, there were now party territory, Shabrat's resistance and western republics that refused to obey either.\n\nThe military saw an opportunity to end old territorial disputes. The contract administrations viewed the same map differently. The resistance needed weapons, the republics needed defence, and any eventual winner would one day rebuild the ruined roads, mines and depots. The war created several markets at once.\n\nKefreyt could prepare its own operation, limit itself to selling arms to one side, or stay out. None of these choices was neutral for the future border. The only question was what risk the country was willing to write into a contract."
 ADISCORD_STP_cw.20.a: "Prepare our own operation."
 ADISCORD_STP_cw.20.b: "Stay out of this war."
 ADISCORD_STP_cw.20.c: "Open an arms channel for the resistance."
 ADISCORD_STP_cw.20.committed: "Our course is already fixed by orders and contracts."
 STP_cw_val_mobilization_tt: "A 21-day mobilisation will begin. On completion, Kefreyt will declare a separate war on the Occidian Revival Union if both countries remain independent, outside factions, at peace and sharing a border. [43.GetName], [44.GetName] and [88.GetName] can be obtained only after victory; [45.GetName] is excluded."
 VAL_cw_intervention_preparation: "Mobilisation against the Western Republics"
 VAL_cw_intervention_preparation_desc: "Kefreyt and the republics remain at peace until the 21-day ultimatum expires. A separate war will then begin between them if both countries remain independent, share a border and have not entered another war or faction. If the conditions change, mobilisation is cancelled."
 ADISCORD_STP_cw.23.t: "The Outcome of the Eastern Operation"
 ADISCORD_STP_cw.23.victory: "The Occidian Revival Union's army has been defeated. The states of [43.GetName], [44.GetName] and [88.GetName] are designated for a temporary contract administration under Kefreyt's authority. If the republics are still fighting another war or a third party occupies some districts, the transfer is postponed until conditions normalise and is completed through the decision to establish the administration. Direct annexation of the districts will require a census and subsequent integration focuses.\n\nContract authority has increased by 5. The war with the republics is over; other wars and contracts remain in effect."
 ADISCORD_STP_cw.23.defeat: "The republics repelled the offensive and forced our headquarters to end the operation. The war with them has ended without territorial gains.\n\nContract authority has fallen by 10. The government must restore trust in its orders and supply arrangements; other wars and contracts remain in effect."
 ADISCORD_STP_cw.23.cancelled: "By the time the ultimatum was due to be enforced, the target or conditions of intervention had changed. Headquarters cancelled mobilisation; no war began. Once the conditions are restored, a new order can be issued through the mobilisation decision."
 ADISCORD_STP_cw.23.a: "Review the operation's outcome."
 ADISCORD_STP_cw.30.t: "Three Authorities, One Country"
 ADISCORD_STP_cw.30.d: "At 05:40, the state radio's morning broadcast was interrupted. The announcer read the party government's decree on emergency measures. Seven minutes later, another recording appeared on the same frequency. Shabrat's headquarters declared that the government had lost the right to issue orders. In the west, the councils announced the creation of their own union.\n\nBy the time the ministries opened, Stelander already existed in three versions. Stationmasters decided which trains to let through. Commanders opened sealed packets of orders. District administrations took down some portraits and left others in place. Where no decision was made in time, armed men made it for the officials.\n\nThe Bronze Congress remained with the party. Abila went to the resistance. The western republics closed their roads to both sides. The common army, created to defend one country, began to divide by garrison, depot and the officers' personal promises.\n\nThe choice made for months in offices and on the map of influence now had to be made openly."
 ADISCORD_STP_cw.30.a: "[STPGetHandoffOption]"
 ADISCORD_STP_cw.30.b: "Lead Shabrat's resistance."
 ADISCORD_STP_cw.30.c: "Defend the Occidian Revival Union."
 STP_cw_pay_officials: "Officials of the Forest District"
 STP_cw_pay_officials_desc: "Officials in [53.GetName] will prepare to transfer the administration to Shabrat. The allocated political power will allow work in the district to continue. In exchange, administration expenses will increase by 10% for 70 days; the prepared administration must still be protected from inspections."
 STP_cw_repair_niansas: "Road through Niansas"
 STP_cw_repair_niansas_desc: "We will restore the road in [3.GetName] so that freight movement no longer depends on ministers' personal orders. We will improve infrastructure, slightly strengthen Shabrat's legitimacy and unlock the special §YTake Over the Regional Administration§! operation.\n\nThe operation is available when the resistance is entrenched in Niansas and legitimacy favours Shabrat by at least a small margin (§Y>0§!). On completion, the district gains a separate basis for joining Shabrat. If resistance influence reaches §G90%§!, the operation is no longer needed: the district will transfer automatically."
 STP_cw_port_budget: "Port Appropriations"
 STP_cw_port_budget_desc: "We will allocate funds to the treasury and prepare Niansas's depot routes. If the party eliminates the depot, the unlocked decision will allow the routes to be prepared again at full cost.\n\n§YImportant:§! prepared supply alone does not transfer the district. Transfer requires an administration ready after 21 days, §G90%§! resistance influence, Shabrat's strong mandate above §Y55%§!, or the special operation unlocked by the §YRoad through Niansas§! focus."
 STP_cw_officer_contacts: "Conversations without Epaulettes"
 STP_cw_officer_contacts_desc: "Edmund Ravel will agree to support Shabrat. At the split, he will join the resistance."
 STP_cw_prepare_capital_sabotage: "Charges near Congress"
 STP_cw_prepare_capital_sabotage_desc: "Connections among capital officials allow us to prepare a strike against garrison command."
 STP_cw_prepare_industry_sabotage: "Disrupting Kreiden's Shifts"
 STP_cw_prepare_industry_sabotage_desc: "Recruited workers in Kreiden will prepare a strike against the party's industrial supply. The focus unlocks a separate 14-day operation costing §Y10§! £political_power_texticon and 2400 rifles. If the prepared district remains with the party at the split, two civilian factory levels will be damaged and military production will suffer a penalty for 70 days."
 STP_cw_district_printing: "District Printing Houses"
 STP_cw_district_printing_desc: "Printing houses will support the general election campaign and communications between district organisations. A second preparation operation can be conducted alongside the first."
 STP_cw_local_council_envoys: "Envoys to the Councils"
 STP_cw_local_council_envoys_desc: "We will recognise Livonin District's councils as a negotiating party. Their influence will rise by 10, and we will receive §Y35§! £political_power_texticon. An autonomy agreement is still required for the district to join Shabrat; without it, strengthening the councils helps the republics."
 STP_cw_autonomy_guarantees: "Ratify the Agreement"
 STP_cw_autonomy_guarantees_desc: "The councils have already concluded a paid agreement for Livonin District to join Shabrat. We will formalise it in 21 days: party inspections will no longer be able to cancel this agreement. At the same time, we will guarantee the independence of the breakaway western councils. After the split, we can pay to supply them against Kefreyt; after victory, we must decide the guarantees' fate. Livonin District's other assets remain vulnerable."
 STP_cw_northern_dossier: "External Connections"
 STP_cw_northern_dossier_desc: "Intelligence on Nodrul's army will increase by 15 and on its civilian services by 10. Headquarters will receive §Y25§! £political_power_texticon, and intermediaries will contact the border district councils. In the north, we can prepare a diplomatic delay or arrange arms deliveries. After the deliveries, the aid desk will unlock: fortifications, engineers and sabotage behind Nodrul's lines. Separate negotiations will unlock an agreement with Kefreyt and preparations for local volunteers."
 STP_cw_seize_vorkerland_stores: "Depots of the Collapsed Confederation"
 STP_cw_seize_vorkerland_stores_desc: "After Vorkerland's collapse, abandoned depots on the Stelander side can be seized without an agreement with the claimants. Our stockpile will receive £infantry_equipment_texticon §Y12000§! equipment, and headquarters will receive §Y35§! £political_power_texticon."
 STP_cw_seize_vorkerland_accounts: "Vorkerland's Frozen Accounts"
 STP_cw_seize_vorkerland_accounts_desc: "No one remains to defend the confederal accounts on our side. The government will place these funds under the local treasury’s administration."
 STP_cw_border_evidence: "Border Evidence"
 STP_cw_border_evidence_desc: "We will collect orders, border guards' testimony and information on preparations for intervention. Headquarters will receive §Y75§! £political_power_texticon, 15 command power, +20 army intelligence and +15 civilian intelligence on Nodrul. The documents will unlock the shared northern aid desk, and publishing them will give Shabrat considerably more time before intervention."
 STP_cw_arm_the_north: "Arm the North"
 STP_cw_arm_the_north_desc: "We will immediately allocate £infantry_equipment_texticon §Y72000§! equipment and §Y60§! £political_power_texticon. Once the war begins, we can choose a recipient and send another 2400 equipment from stockpiles. This focus unlocks the northern aid desk. The supply channel will remain with the resistance."
 STP_cw_northern_desk: "Northern Aid Desk"
 STP_cw_northern_desk_desc: "After arming the allies or preparing the border dossier, we will establish a separate aid service for the northern alliance. Intelligence on Nodrul's army will increase by 10; headquarters will receive §Y50§! £political_power_texticon and 15 command power. As long as Nodrul exists, we can build fortifications on its front, send engineer teams and conduct sabotage behind its lines. The desk stays with Shabrat after the split and occupies no preparation slots."
 STP_cw_northern_desk_tt: "Unlocks the §YAid to the North§! category. Fortifications and engineers are available on the active northern front. Sabotage against Nodrul can also be conducted during the civil war."
 STP_cw_northern_observers_tt: "When the northern war begins, army intelligence on Nodrul will be refreshed by §G15§!. After the split, the §Yresistance§! will receive fresh information: §G+15§! army intelligence on Nodrul."
 STP_cw_cabinet_archives: "Departmental Documents"
 STP_cw_cabinet_archives_desc: "Through officials, we will obtain appointment lists, records and closed accounts. New intermediaries will strengthen the supporters' network. The documents can then be published or used in negotiations with ministers."
 STP_cw_expose_the_cabinet: "Open the Closed Accounts"
 STP_cw_expose_the_cabinet_desc: "Publishing the accounts will strengthen support for Shabrat and give his headquarters resources for political work. The party will view district organisers' activities with greater suspicion. A private deal with the ministers will become impossible after publication."
 STP_cw_buy_silence: "Reach an Agreement with the Ministers"
 STP_cw_buy_silence_desc: "Part of the cabinet will agree to cooperate in exchange for continued payments. We will receive more political power for negotiations and reduce party suspicion, but electoral support will grow less than after a public exposé. Administration expenses will increase by 10% for 70 days."
 STP_cw_unified_headquarters: "Orders from One Headquarters"
 STP_cw_unified_headquarters_desc: "We will bring the detachments under common command. Army organisation will increase by another 3%, and planning speed by 5%. Pre-war officer training will remain; these measures will complement it."
 STP_cw_open_conscription: "Open Conscription"
 STP_cw_open_conscription_desc: "Resistance headquarters introduces Extensive Conscription in place of volunteers or limited recruitment. New reservists arrive gradually, and training replacements takes longer."
 STP_cw_wartime_laboratories: "Wartime Laboratories"
 STP_cw_wartime_laboratories_desc: "We will bring design bureaus and factory laboratories into a single military programme. A second research slot will open for 180 days. If civilian authority returns sooner, the programme will close along with the military regime."
 STP_cw_wartime_laboratories_tt: "The second slot lasts 180 days. Once civilian authority returns, the programme is no longer available and closes immediately."
 STP_cw_wartime_laboratories_available_tt: "Civilian authority has not yet returned."
 STP_cw_emergency_laboratories_cancel_tt: "Civilian authority has returned."
 STP_cw_mobilization_register: "Mobilisation Register"
 STP_cw_mobilization_register_desc: "The register unlocks two ways to reinforce. A territorial brigade deploys immediately for §Y25§! £political_power_texticon, 6000 personnel and 5400 rifles. For §Y40§! £political_power_texticon, a training reserve commits 12000 personnel and 10800 rifles for 21 days and produces two brigades with 30% starting experience."
 STP_cw_wartime_arsenals: "Wartime Arsenals"
 STP_cw_wartime_arsenals_desc: "The capital's workshops switch to military production. Two new factories and additional shifts for 140 days will support reinforcement of the front. Repair stockpiles will provide 20000 rifles and 120 guns. The war council will be able to purchase finished batches of weapons with money and expand arsenals in controlled states."
 STP_cw_supply_routes: "Roads to the Front"
 STP_cw_supply_routes_desc: "We will expand the road network and organise deliveries. The supply service will reduce army supply consumption by 8%. The war council will be able to order the front to regroup for 21 days: units will recover at the cost of offensive momentum."
 STP_cw_congress_in_session: "Congress Remains in Session"
 STP_cw_congress_in_session_desc: "We will fortify the approaches to the Bronze Congress and place the troops under unified command. Army organisation will rise by 5% and planning speed by 10%, but supply consumption will increase by 5%. Supply preparations will help cover this expense."
 STP_cw_guard_the_pier: "Hold the Waterfront"
 STP_cw_guard_the_pier_desc: "The Lower Market port must hold its sector of the front even after Congress is lost. Headquarters will unlock a defensive plan lasting 35 days for 25 command power. The order requires control of the port itself; it can be repeated after 56 days, once any other front plan has ended."
 STP_cw_road_to_fada: "Open the Road to Fada"
 STP_cw_road_to_fada_desc: "We will improve the road on a controlled approach and organise rotation of forward units. If Niansas is ours, work will take place there; otherwise, in any state we own with an unfinished network. A front regrouping order will unlock for use before advancing on Fada."
 STP_cw_last_banquet: "The Last Banquet"
 STP_cw_last_banquet_desc: "Headquarters will draw up a one-time offensive plan against the Bronze Congress. For £command_power_texticon §Y25§!, a 21-day operation will begin: the objective is control of the Bronze Congress. Success within this period is recorded. If the period expires without control of the Bronze Congress, war support will fall by 10 percentage points. Reinforce your assault divisions before issuing the order: the plan cannot replace missing guns and rifles."
 STP_cw_line_formations: "Line Brigades"
 STP_cw_line_formations_desc: "We will organise line brigades: six battalions as the initial establishment, which can be changed in the designer. Army organisation will increase by another 4%. Headquarters will receive 25 experience and 20 command power for subsequent orders."
 STP_cw_capital_counteroffensive: "General Counteroffensive"
 STP_cw_capital_counteroffensive_desc: "The operations directorate can launch a general offensive only after all three stages of reorganisation are complete. The functioning government may be in Congress or outside the capital. The army will receive offensive preparation for 28 days; headquarters will receive 10 experience and 20 command power."
 STP_cw_inner_ring: "The Inner Ring"
 STP_cw_inner_ring_desc: "Rear administrations and the garrison will combine the defence of city districts into a single ring. Fortifications are built only in capital strongpoints we hold. A lost district receives no free structures for the enemy."
 STP_cw_assault_columns: "Assault Columns"
 STP_cw_assault_columns_desc: "We will begin preparing assault columns following the general offensive plan. The focus takes seven days and unlocks a repeatable reinforced division order, so the entire preparation period is not consumed by coordination. Personnel, equipment and money come from actual reserves; an unaffordable order remains visible."
 STP_cw_assault_columns_order_tt: "If £manpower_texticon §Y7900§!, £infantry_equipment_texticon §Y7110§! and a full support complement are available, §Y1 reinforced division§! will be formed. Otherwise, the order will not deduct reserves."
 STP_cw_harbour_batteries: "Waterfront Batteries"
 STP_cw_harbour_batteries_desc: "Coastal batteries and urban anti-air defences will cover the Lower Market. This work is directed by port headquarters and does not require the inner ring to be completed first. We must own the capital state and hold the port itself; depots will receive 40 sets of anti-air equipment."
 STP_cw_cut_capital_roads: "Cut the Capital's Roads"
 STP_cw_cut_capital_roads_desc: "We will strike Fada's supply routes. While the capital is not ours, its road network will suffer damage. Attack will increase by 8% and planning speed by 10% for 28 days. Headquarters will receive 15 command power."
 STP_cw_district_levies: "District Recruitment"
 STP_cw_district_levies_desc: "We will open recruitment in controlled districts: 12000 personnel and 12000 rifles will enter the reserve and immediately go towards two line brigades if territorial control and the current price permit."
 STP_cw_district_levies_order_tt: "If sufficient personnel, rifles and controlled territory are available after the reserve arrives, §Y2 line brigades§! will be formed. Otherwise, the personnel and weapons will remain in the reserve."
 STP_cw_government_quarter_assault: "Assault on the Government Quarter"
 STP_cw_government_quarter_assault_desc: "We will coordinate artillery and assault units against the Bronze Congress. For 21 days, attack will rise by 15%, breakthrough by 20% and planning speed by 10%. Depots will receive 60 guns; headquarters will receive 25 command power."
 STP_cw_hold_resource_belt: "Hold the Resource Belt"
 STP_cw_hold_resource_belt_desc: "We will strengthen supply in Kreiden, Monaia or Abilia. Army supply consumption will fall by 5%. If the chosen district still has room for road development, one infrastructure level will be built."
 STP_cw_mountain_staff: "Mountain Pass Headquarters"
 STP_cw_mountain_staff_desc: "We will bring the councils' detachments under one command. Organisation recovery will increase by 8%. Headquarters will receive 15 experience and 15 command power."
 STP_cw_pass_watch: "Outposts on the Passes"
 STP_cw_pass_watch_desc: "We will fortify the republics' capital strongpoint and unlock the western frontier defence order. Cover will be established at [43.GetName]."
 STP_cw_hold_the_passes: "Hold the Passes"
 STP_cw_hold_the_passes_desc: "We will put the army on the defensive for 35 days: defence +15%, attack -15%, speed -10%. If we hold [44.GetName], additional cover will be established there."
 STP_cw_raid_the_approaches: "Raid the Approaches"
 STP_cw_raid_the_approaches_desc: "We will assemble forces for a sortie against Kefreyt. For 28 days, attack will rise by 8% and planning speed by 10%. Headquarters will receive 20 command power."
 STP_cw_federal_defence: "Joint Defence of the Republics"
 STP_cw_federal_defence_desc: "The councils will retain independent detachments and organise their rotation on the front line. Supply consumption will fall by 8% and organisation recovery will accelerate by 10%, but maximum organisation will decrease by 5%. Such an army handles regrouping better than continuous combat."
 STP_cw_western_frontier: "The Western Frontier"
 STP_cw_western_frontier_desc: "We will fortify the capital strongpoint and prepare a defence plan for the republics lasting §Y35 days§!. It can be enacted for £command_power_texticon §Y25§! while we control [43.GetName] and are at war with Kefreyt. Another order becomes available §Y56 days§! after the previous one; any active offensive, defensive or regrouping order must have ended."
 STP_cw_first_postwar_budget: "The First Peacetime Budget"
 STP_cw_first_postwar_budget_desc: "The winner returns state spending to an ordinary peacetime budget. External wars and the mountain republics' conflict do not block post-war recovery for the civil war's victor."
 STP_cw_restore_civil_authority: "Restore Civilian Authority"
 STP_cw_restore_civil_authority_desc: "We will return administration to civilian departments. The political network and the cabinet's emergency powers will be dissolved. Stelander's succession crisis will end: the stability penalty following Ivanov's death will be removed. Accumulated improvements to military administration will remain."
 STP_cw_uprising_conditions_tt: "The order is prepared, elections are underway and Stelander's original territories are intact. Nodrul is fighting at least one active northern army."
 STP_cw_external_intervention:0 "Foreign Operations"
 STP_cw_external_intervention_desc:0 "Allied aid, shipment countermeasures and active foreign threats are managed here. Each order has its own delivery conditions.\n[STPGetPartyForeignReport]"
 STP_cw_northern_aid: "Aid to the North"
 STP_cw_northern_aid_desc: "Shabrat's separate service for the northern alliance. Fortifications and engineers operate only on the front against Nodrul. Sabotage behind its lines can also be conducted during the civil war. Arms deliveries remain under External Intervention."
 STP_cw_nod_warning: "[STPGetNodReadinessTitle]"
 STP_nod_readiness_north: "Nodrul Is Fighting in the North"
 STP_nod_readiness_mobilization: "Nodrul Is Mobilising the Northern Front"
 STP_nod_readiness_intervention: "Nodrul Is Preparing to Intervene!"
 STP_cw_nod_warning_desc: "§YCurrent Situation:§! [STPGetNodStatus]\n\nThis countdown shows headquarters' readiness for future intervention in Stelander, not the deadline for an attack on Yubor. Preparation runs alongside the northern campaign. When the period expires, Nodrul is ready to act, but the northern front blocks entry; after the northern war ends, another seven days are needed for redeployment.\n\nDefeat the party or capture the Bronze Congress within the Last Banquet deadline to foil the intervention. Prepared border evidence allows readiness to be delayed once by ten days; weapons for Nodrul's northern opponents help them hold an actual front line."
 STP_cw_val_ultimatum: "Kefreyt's Ultimatum: 21 Days"
 STP_cw_val_ultimatum_desc: "Kefreyt has ordered mobilisation against the Occidian Revival Union. The republics remain at peace until the 21-day ultimatum ends. A separate war will then begin if both countries remain independent, share a border and have not entered another war or faction. Western territories can be lost only after military defeat."
 STP_cw_nod_northern_diversion: "Nodrul Is Ready, but Tied Down in the North"
 STP_cw_nod_northern_diversion_desc: "Intervention preparations are complete. Nodrul cannot enter while at least one northern army holds out against it. After the northern war ends, seven days will remain for redeployment. There will be no new full preparation period."
 STP_cw_nod_intervention_cancelled: "Nodrul's Intervention Is Unavailable"
 STP_cw_nod_intervention_cancelled_desc: "Nodrul cannot join the party's side in this civil war. This may be due to defeat in the north, the party's defeat, subjugation of participants or failure to meet the entry conditions. Cancelled preparations will not resume; another intervention in this conflict is not provided for."
 STP_cw_nod_intervention_entered: "Nodrul Has Entered the War"
 STP_cw_nod_intervention_entered_desc: "Nodrul's troops are fighting alongside the party against the resistance. The northern strategy bought us time, but we must now hold an expanded front."
 ADISCORD_STP_cw.40.t: "Too Many Trucks"
 ADISCORD_STP_cw.40.d: "First, intermediaries reported additional fuel tankers near Nodrul's southern depots. Then came new hospital beds, spare bridge sections and maps of our roads. None of these items alone proved preparations for intervention. Together, they left little room for another explanation.\n\nBentliks's government had announced nothing yet. This was precisely how Nodrul preferred to act. A decision should appear inevitable only after all the necessary work had been done.\n\nThe northern war can hold back its army, but not its staff officers and depots. If the party holds out long enough, the border will be crossed by an army that prepared in advance, not improvised volunteers.\n\nAn intervention begins long before the first soldier steps onto our soil."
 ADISCORD_STP_cw.40.a: "Then we must count trains, not statements."
 ADISCORD_STP_cw.41.t: "The Advisers Cross the Border"
 ADISCORD_STP_cw.41.d: "In the morning, a border post reported the first column. A few minutes later, contact was lost. By noon, confirmations had arrived from three districts at once. Nodrul's units had been ordered to enter the war on the side of the party government.\n\nFor decades, the capital had called Bentliks's people advisers, observers, lawyers and guarantors. Their presence was explained as the price of peace and a feature of the Fadian order. Now the argument over words was over. The adviser crossed the border in an armoured vehicle.\n\nParty command had gained an external army. For the resistance, the war was no longer merely a struggle over Ivanov's inheritance. If Steland had ever intended to prove it could exist without someone else's mandate, the moment could scarcely have been worse."
 ADISCORD_STP_cw.41.a: "Now treaties speak the language of artillery."
 ADISCORD_STP_cw.42.t: "Preparations on the Southern Border"
 ADISCORD_STP_cw.42.d: "The lawyers brought Bentliks a draft document before the military had finished assessing the forces. It contained no mention of an invasion. It proposed assistance to Stelander's lawful government at its request, protection of existing agreements and restoration of order. The space for the Stelander side's signature was still blank.\n\nThis was how Nodrul had built its influence for decades. First an institution was created, then a treaty, then a person who could place the right signature beneath it. The civil war merely made the final step less elegant.\n\nSupporting the party will preserve the system built under Ivanov. The price will now be measured in mobilised units and potential casualties, rather than grants, advisers and loans. Refusal means allowing Stelander, for the first time in a generation, to determine the outcome of an internal crisis without Nodrul's decision."
 ADISCORD_STP_cw.42.a: "Prepare assistance for the party army."
 ADISCORD_STP_cw.42.b: "Do not turn influence into occupation."
 ADISCORD_STP_cw.42.c: "The Bronze Congress is already lost. Close the project."
 STP_cw_nod_consent_tt: "Independent intervention preparations will begin for §Y135 days§!. The northern war blocks entry, but not the countdown. After the northern campaign ends, the troops need §Y7 days§! to redeploy. The party's defeat or Nodrul's defeat will cancel intervention."
 NOD_cw_intervention_preparation: "Preparing Aid for the Party Army"
 NOD_cw_intervention_preparation_desc: "Preparation continues independently of elections and the northern war. Once complete, the army is ready to support party forces. Entry requires the northern war to end, seven days of redeployment and continued fighting between the party and Shabrat."
 STP_cw_nod_neutrality: "Nodrul Remains Neutral"
 STP_cw_nod_neutrality_desc: "Nodrul's government has refused to take part in the civil war. The release of its army from the north will no longer trigger preparations for intervention."
 ADISCORD_STP_cw.43.t: "The Operation's Final Order"
 ADISCORD_STP_cw.43.victory: "The party administration once again controls Stelander's main centres. Nodrul's units have been ordered to halt the offensive and hand occupied districts to its officials. There will be no annexation. That was never the objective.\n\nSomething else matters more to Bentliks. A separate Stelander still exists on the map, but its government knows whose army preserved its power. Sometimes dependency works best precisely when another flag can once again be raised at the border."
 ADISCORD_STP_cw.43.withdrawal: "The party army fell apart before Nodrul could change the war's outcome. Without a government to support, the operation's legal framework lost its purpose. Headquarters ordered a withdrawal.\n\nThe columns are leaving along the same roads they entered. Stelander will be left with the dead, abandoned depots and a very simple conclusion: for the first time in decades, Nodrul's decision was not enough."
 ADISCORD_STP_cw.43.defeat: "The operation ended in defeat. Nodrul's units failed to restore party rule and were ordered to cease hostilities. In the Chamber, wording is already being prepared that will contain neither failure nor retreat.\n\nBut documents cannot change the essential fact. Stelander, which for decades showcased Nodrul's model of influence, emerged from the crisis against its creators' wishes."
 ADISCORD_STP_cw.43.a: "Close the operational file."
 ADISCORD_STP_preparation.1.b: "The cabinet must retain control."
 STP_cw_first_decline_tt: "A reception with Ivanov will take place. His health will deteriorate for the first time; in the event, we will choose Shabrat or the party."
 STP_cw_branch_choice_tt: "The choice was made in the event marking Ivanov's first health decline. Preparations for the chosen side are available."
 STP_cw_army_split_tt: "Abilia will always join Shabrat. The current formation plan is in the Battle for Stelander category; actual forces will be limited by personnel and weapons."
 STP_cw_party_preparation_tt: "The state map will open. The briefing will show §Yapparatus loyalty§! instead of security service suspicion. The underground will begin work in one district. The Party Discipline focus unlocks command inspections. Abilia will always join Shabrat; the formation plan is in the same category."
 STP_cw_officers_tt: "At the split, §YEdmund Ravel§! will join Shabrat. The resistance will receive 10 army experience and £command_power_texticon §Y15§!."
 STP_cw_young_officers_tt: "At the split, §YSeverin Drake§! will join Shabrat. The resistance will receive 15 army experience."
 STP_cw_operation_slot_tt: "Preparation slots: +1. Political and military operations share the same pool."
 STP_cw_livonn_agreement_tt: "Inspections can no longer remove the agreement for §Y[45.GetName]§! to join Shabrat. Other district assets remain vulnerable. After civilian authority returns, Shabrat will decide the charter's fate."
 STP_cw_local_recruits_tt: "We will prepare two permanent resistance brigades. Each requires £manpower_texticon §Y6000§! and £infantry_equipment_texticon §Y5400§! from its stockpiles; personnel will be reserved before the general allocation."
 STP_cw_reserve_brigade_tt: "£infantry_equipment_texticon §Y160000§! equipment will be deducted from state depots and reserved in Abilia for the resistance. At the split, the plan will allow two additional brigades to deploy if its reserves contain sufficient personnel and weapons. Stockpiles and depot capacity are checked again when the focus completes."
 STP_cw_pending_staff_tt: "The resistance will receive the displayed Military Administration after the split. Before then, the party army does not receive this bonus."
 STP_cw_warehouse_service_tt: "The entire resistance army will receive the displayed supply improvement after the split; it will remain after the war."
 STP_cw_supply_depot_tt: "Resistance influence in §Y[46.GetName]§!: §C+10§!. A depot can be prepared through a separate decision."
 STP_cw_niansas_administration_tt: "A resistance administration has been prepared in §Y[3.GetName]§!. It helps preserve civilian administration and transfer the district with sufficient local support. A party inspection can disrupt the agreement."
 STP_cw_early_orders_tt: "The resistance will receive the spirit from the first day of the war. Headquarters will also receive 10 army experience and £command_power_texticon §Y15§!."
 STP_cw_secure_niansas_tt: "In §Y[3.GetName]§!, caches are seized and officials prepared by the underground are removed. Party influence: §0+15§!. Protection against courier activity: §Y56§! days. Inspections are conducted only in districts we own and control that are open to operations."
 STP_cw_secure_garrisons_tt: "In §Y[2.GetName]§! and §Y[29.GetName]§!, caches are seized and underground connections severed. Party influence: §0+15§! in each. District operations are blocked for §Y56§! days. At the split, each of these districts that remains with the party will allow two additional brigades to be formed. Each requires £manpower_texticon §Y6000§! personnel and £infantry_equipment_texticon §Y5400§! equipment from its reserves. Inspections are conducted only in districts we own and control that are open to operations."
 STP_cw_secure_depots_tt: "In §Y[46.GetName]§! and §Y[53.GetName]§!, caches are seized and underground connections severed. Party influence: §0+15§! in each. Protection against courier activity: §Y56§! days. Inspections are conducted only in districts we own and control that are open to operations."
 STP_cw_party_reserve_tt: "At the split, the party will be able to form two additional brigades. Each requires £manpower_texticon §Y6000§! personnel and £infantry_equipment_texticon §Y5400§! equipment from its reserves."
 STP_cw_party_defence_tt: "The party will receive the spirit from the first day of the war."
 STP_cw_kefreyt_offer_tt: "Kefreyt will receive a request for §Ythree reinforced volunteer divisions§! for Shabrat's army. If it agrees, it will pay for them from its own reserves. Ready units will arrive at the split; if reserves are insufficient, Kefreyt will continue equipping them and can send them during the war. The contingent will be recalled after the war; its composition and recruitment are fixed."
 STP_cw_check_district_command: "Inspect District Command: [FROM.GetName]"
 STP_cw_check_district_command_desc: "In 21 days, we will seize caches, remove recruited officials and sever connections with the garrison. Party influence will rise by 15 and apparatus loyalty by 4. Underground district operations will be blocked for 56 days. Discovered organisations shift legitimacy 4% towards the party; a fruitless inspection shifts it 2% towards Shabrat. The operation occupies one slot.\n\nIn New Monaia and Kreiden, we will also prepare party garrisons: if the district remains with the party, each will allow another two territorial brigades to be paid for from its stockpiles."
 ADISCORD_STP_preparation.6.t: "Shabrat's Envoy"
 ADISCORD_STP_preparation.6.d: "The envoy arrived without a diplomatic convoy and asked to meet the contract forces administration rather than a minister. He placed one folder on the table. Inside was an exact list of personnel, weapons and transport needed for three reinforced divisions.\n\nThe request was unusually direct. Shabrat neither demanded that Kefreyt enter the war nor offered territory. The units were to pass under his command only after Stelander's open split, then return home. The lawyers reread the terms several times, looking for a hidden obligation. There was none.\n\nThe military saw something else in the document. If Stelander fell apart, three ready divisions could achieve more than months of diplomacy. And the first accepted request would almost inevitably create a second. Kefreyt rarely invests in another country's war for gratitude, but sometimes the right to sit at the table when the winner starts counting debts is enough."
 ADISCORD_STP_preparation.6.a: "Prepare the contingent."
 ADISCORD_STP_preparation.6.b: "Do not tie Kefreyt to someone else's crisis."
 ADISCORD_STP_preparation.7.a: "Acknowledged."
 ADISCORD_STP_preparation.8.t: "Kefreyt's Reply"
 ADISCORD_STP_preparation.8.accepted: "The reply arrived on heavy paper without a greeting. Request accepted. Personnel were withdrawn from the current reserve, equipment began to be assembled in separate depots, and headquarters was ordered to keep the formations off public lists until Stelander's split.\n\nAt the bottom was a single line: 'Command will be transferred when the agreed circumstances arise.' For Kefreyt, that was enough."
 ADISCORD_STP_preparation.8.refused: "The folder came back closed. A short resolution stood on the first sheet: 'Allocate no resources.' Kefreyt attached no political explanation.\n\nFor Shabrat's headquarters, the refusal meant one simple thing. Everything that did not come across the border would have to be found inside the country."
 STP_cw_abila_reserve: "Abilia Reserve"
 STP_cw_abila_reserve_desc: "In 28 days, we will prepare reservists and transfer £infantry_equipment_texticon §Y160000§! equipment to Abilia's depot. At the split, the resistance can deploy two additional brigades, paying for them with its own personnel and weapons. Abilia's reserve is not included in the general division of state stockpiles."
 STP_cw_warehouse_inventory: "Depot Service"
 STP_cw_warehouse_inventory_desc: "Supply officers need coordinated requests, reliable storekeepers and a system for issuing materiel. We will prepare this service for the future resistance army. Weapon stockpiles can be replenished through separate decisions."
 STP_cw_supply_officers: "Supply Officers"
 STP_cw_supply_officers_desc: "Supply officers will coordinate the issue of materiel to future units. Connections in [46.GetName] will strengthen now, and district depot preparation will unlock. The depot requires time, funding and the preservation of local connections."
 STP_cw_district_administration: "Niansas Administration"
 STP_cw_district_administration_desc: "Officials in [3.GetName] will recognise Shabrat's headquarters as a negotiating party. The prepared administration will strengthen his electoral mandate and can transfer authority after the result is announced. The agreement remains in effect until a party commission replaces the local officials."
 STP_cw_courier_service: "Courier Service"
 STP_cw_courier_service_desc: "Permanent couriers will improve the supporters' network and document delivery. Headquarters will gain additional political power, while careful transmission of orders will reduce party suspicion. An additional slot will allow one more preparation operation to be conducted simultaneously."
 STP_cw_operational_orders: "Orders to the Districts"
 STP_cw_operational_orders_desc: "Commanders will receive their tasks for the opening weeks of the uprising in advance."
 STP_cw_capital_reserve: "Capital Reserve Plan"
 STP_cw_capital_reserve_desc: "We will add two more party line brigades to the deployment plan. These are not free divisions: at the split, they will be formed only from available recruits and equipment. Preparation is available under either budget priority."
 STP_cw_protect_congress: "Protect the Bronze Congress"
 STP_cw_protect_congress_desc: "We will concentrate forces around Congress and build fortifications. The army will receive defensive preparation for the first 35 days of fighting. The mobile reserve will become unavailable: we are committing to holding the government centre on which the cabinet's work depends."
 STP_cw_opposition_preparation: "Shabrat's Couriers Are Preparing"
 STP_cw_opposition_preparation_desc: "Operation target: §Y[STPGetOppositionTarget]§!. The target is announced in advance and shown on the map. The first operation lasts 60 days, subsequent operations 28; apparatus loyalty of 70 or more adds another 10 days, while loyalty below 25 shortens it by 7. The mission shows the time remaining. A 21-day command inspection disrupts preparation; the security collegium allows it to be intercepted in 10 days. Courier success gives 20 influence, shifts legitimacy 4% towards Shabrat and lowers loyalty by 6. The underground first seeks an entrenched position and a local administration; the next operation prepares a garrison, a depot for 1200 from the treasury, or saboteurs for 2400 rifles from the shared stockpile. Military results and conditions are shown on the map. An ordinary election result leads to a large war; an exceptional mandate with recognition from the command and district administrations may limit the revolt."
 STP_cw_treasury_1200_tt: "Treasury: §G+1200§!. Funds above the treasury cap are not retained."
 STP_cw_suspicion_minus_5_tt: "Party suspicion: §G-5§! (minimum 0)."
 STP_cw_suspicion_5_tt: "Party suspicion: §R+5§! (maximum 100)."
 STP_cw_suspicion_minus_10_tt: "Party suspicion: §G-10§! (minimum 0)."
 STP_cw_suspicion_8_tt: "Party suspicion: §R+8§! (maximum 100)."
 STP_cw_suspicion_10_tt: "Party suspicion: §R+10§! (maximum 100)."
 STP_cw_suspicion_12_tt: "Party suspicion: §R+12§! (maximum 100)."
 STP_cw_suspicion_15_tt: "Party suspicion: §R+15§! (maximum 100)."
 STP_cw_niansas_influence_tt: "Resistance influence in Niansas: §G+12§!."
 STP_cw_headquarters_tt: "Unlocks recruitment of district administrations and surrendering an official to a commission. Negotiations with councils and protection of connections are separate map operations."
 STP_cw_private_payments: "Secret Payments"
 STP_cw_private_payments_desc: "Agreements with officials are paid through administration expenses. The surcharge lasts 70 days; a new agreement renews its duration. The state's split ends the payments early."
 STP_cw_arsenal_shifts: "Additional Shifts"
 STP_cw_arsenal_shifts_desc: "The arsenals adopt an expanded schedule for 140 days. Military factory output and production efficiency growth increase by 25%."
 STP_cw_emergency_laboratories: "Wartime Laboratories"
 STP_cw_emergency_laboratories_desc: "The emergency programme maintains a second research slot. It lasts 180 days or until civilian authority returns."
 STP_cw_forest_officials_tt: "Resistance influence in §Y[53.GetName]§!: §C+12§!. An administration is prepared for the district's transfer to Shabrat. Influence must remain entrenched until the split for the transfer to occur. A party inspection can disrupt preparations."
 STP_cw_port_supply_tt: "There is one effect for the entire resistance army; a second depot will not strengthen it. If enough fuel is available, §Y500§! will be transferred from party stockpiles. A commission can disrupt preparations."
 STP_cw_council_envoys_tt: "Local forces' influence in §Y[45.GetName]§!: §Y+10§!. No autonomy agreement has been concluded yet: at the split, the district may join the republics if local forces retain the most influence."
 STP_cw_border_evidence_tt: "Shabrat's headquarters will be able to spend §Y35§! £political_power_texticon once to delay Nodrul's active intervention preparations by §G35 days§!. The decision is available before and after the split while the northern troops are still preparing."
 STP_cw_network_transfer_tt: "The accumulated Supporters' Network will pass to Shabrat at the split and dissolve after civilian authority returns."
 STP_cw_civil_authority_ideas_tt: "Civil authority consolidates the postwar order. The political network, emergency cabinet powers and military administration of the party and resistance end with the civil war."
 STP_cw_resistance_network_dynamic: "Supporters' Network"
 STP_cw_resistance_network_dynamic_desc: "Intermediaries and officials support Shabrat. Contacts and paperwork gradually strengthen a single network. It transfers to the resistance at the split and remains active until the civil war ends."
 STP_cw_party_administration_dynamic: "Party Administration"
 STP_cw_party_administration_dynamic_desc: "Ministers and the presidium coordinate government departments. Measures accumulate here and support party rule until the civil war ends."
 STP_cw_military_staff_dynamic: "Military Administration"
 STP_cw_military_staff_dynamic_desc: "Staff work, officer training and supply determine army capabilities. Each measure adds to the previous preparations. The party and resistance lose these military bonuses when the civil war ends."
 STP_party_suspicion_dynamic_modifier: "Security Service Suspicion"
 STP_party_suspicion_dynamic_modifier_desc: "Growing suspicion complicates the work of Shabrat's supporters and reduces political power gain. The effect lasts until the uprising begins or the election ends."
 STP_apparatus_loyalty_dynamic_modifier: "Apparatus Loyalty"
 STP_apparatus_loyalty_dynamic_modifier_desc: "The obedience of offices, district headquarters and official seals to the electoral record. High loyalty provides political power and stability; low loyalty takes them away. Lasts until the uprising begins or the election ends."
 STP_cw_command_power_25_cost: "£command_power_texticon §Y25§!"
 STP_cw_command_power_25_cost_blocked: "£command_power_texticon §R25§!"
 STP_cw_command_power_25_cost_tooltip: "Cost: £command_power_texticon §Y25§!"
 STP_cw_launch_last_banquet: "Launch Operation Last Banquet"
 STP_cw_launch_last_banquet_desc: "This one-time operation requires war with the party and control of Niansas. The objective is control of the Bronze Congress within §Y21 days§!. The order costs £command_power_texticon §Y25§!. If time expires without the objective, war support falls by §R10 percentage points§!. The operation cannot be launched again. A defensive plan or regrouping cannot begin during the offensive."
 STP_cw_delay_inspection_live_tt: "A party commission is still working in the selected district"
 STP_cw_last_banquet_deadline: "The Last Banquet Deadline"
 STP_cw_last_banquet_deadline_desc: "The resistance must take control of the Bronze Congress in the days remaining. Success within this period is retained. If time expires without control of the Bronze Congress, war support will fall by 10 percentage points. Losing Niansas after launch does not cancel the operation."
 STP_cw_last_banquet_objective_tt: "Fada is controlled"
 STP_cw_last_banquet_objective_open_tt: "Fada is not yet under our control"
 STP_cw_last_banquet_launch_tt: "An offensive will begin for 21 days. A separate countdown will show the deadline for capturing Fada."
 STP_cw_last_banquet_success_tt: "Fada was captured within the allotted time. Objective complete."
 STP_cw_last_banquet_fail_tt: "Time expired without control of the Bronze Congress. War support: §R-10 percentage points§!."
 STP_cw_northern_incident_result_tt: "Nodrul's active intervention preparations will be extended by §G56 days§!. This decision will not stop troops already ready or already in the war."
 STP_cw_nod_prep_active_tt: "Nodrul is still preparing to intervene"
 STP_cw_purchase_arsenal_batch: "Purchase Finished Weapons"
 STP_cw_purchase_arsenal_batch_desc: "The war council will buy a batch of restored weapons from private workshops: 16000 rifles, 60 guns, 48 sets of crew-served weapons, 30 units of additional equipment and 20 anti-air guns. The delivery arrives immediately; the next batch will be available in 42 days. Reinforce existing units first, then form new ones."
 STP_cw_arsenal_batch_cost: "£ADISCORD_economy_treasury_texticon §Y420§!"
 STP_cw_arsenal_batch_cost_blocked: "£ADISCORD_economy_treasury_texticon §R420§!"
 STP_cw_arsenal_batch_cost_tooltip: "Cost: £ADISCORD_economy_treasury_texticon §Y420§!"
 STP_cw_regroup_the_front: "Regroup the Front"
 STP_cw_regroup_the_front_desc: "The order costs 25 command power and rules out battle plans until its duration ends. It can be issued again after 42 days. Its effect ends when the war ends."
 STP_cw_train_reserve_brigades: "Train Two Reserve Brigades"
 STP_cw_train_reserve_brigades_desc:0 "Spend §Y40§! £political_power_texticon to train two fully equipped territorial brigades in §Y21 days§!, with §Y30%§! starting experience. Shabrat pays only for organizing volunteers; the party and republics also reserve 12000 personnel and 10800 rifles. Cancellation returns only manpower and weapons actually reserved; political power is not refunded. Requires a state we own and control. Only one reserve can train at a time; new orders close after peace."
 STP_cw_reserve_training_start_tt: "£manpower_texticon §Y12000§! personnel and £infantry_equipment_texticon §Y10800§! rifles will be allocated from our country's available stockpile for 21 days. Organising training costs §Y40§! £political_power_texticon."
 STP_cw_reserve_training_result_tt: "Our country will receive §Y2§! fully equipped territorial brigades with §Y30%§! starting experience in states it owns and controls. Training is already paid for. Upon capitulation, the end of the military threat or the loss of all formation locations, only personnel and weapons actually reserved will return to the stockpile. The republics can prepare units before Kefreyt attacks while its threat remains."
 STP_cw_expand_arsenal: "Expand the Arsenal in [FROM.GetName]"
 STP_cw_expand_arsenal_desc: "We will invest 1200 treasury units in a new military factory in [FROM.GetName]. Construction takes 35 days and reduces total military factory output by 10%. Only one project can proceed at a time. If the state is lost, we capitulate or the military threat ends, the project is cancelled and half the payment is returned; the remainder has already been spent on work. The republics can build arsenals before Kefreyt attacks while its threat remains."
 STP_cw_deliberate_offensive: "Prepared Offensive"
 STP_cw_deliberate_offensive_desc: "Headquarters has concentrated artillery and coordinated assault units on the main axis. The war council cannot change the order before the operation ends."
 STP_cw_static_defence: "Positional Defence"
 STP_cw_static_defence_desc: "Units dig into their positions, sacrificing mobility and offensive capabilities."
 STP_cw_front_reorganization: "Front Regrouping"
 STP_cw_front_reorganization_desc: "Units recover organisation and reduce supply consumption. Offensive capabilities remain limited until regrouping ends."
 STP_cw_reserve_training_cost:0 "[STPGetReserveTrainingCost]"
 STP_cw_reserve_training_cost_blocked:0 "[STPGetReserveTrainingCostBlocked]"
 STP_cw_reserve_training_cost_tooltip:0 "[STPGetReserveTrainingCostTooltip]"
 STP_cw_arsenal_expansion_cost: "£ADISCORD_economy_treasury_texticon §Y1200§!"
 STP_cw_arsenal_expansion_cost_blocked: "£ADISCORD_economy_treasury_texticon §R1200§!"
 STP_cw_arsenal_expansion_cost_tooltip: "Cost: £ADISCORD_economy_treasury_texticon §Y1200§!"
 STP_cw_livonn_active_agreement_tt: "A paid agreement with local councils is active in Livonin District under Stelander's control"
 STP_cw_hold_the_pier: "Enact the Waterfront Defence Plan"
 STP_cw_hold_the_pier_desc: "Requires control of Fada and war with the resistance. The order costs 25 command power and can be repeated after 56 days. Offensive and regrouping orders are unavailable until the plan ends."
 STP_cw_defend_western_frontier: "Enact the Republics' Defence Plan"
 STP_cw_defend_western_frontier_desc: "Requires control of [43.GetName] and war with Kefreyt. The order costs 25 command power and can be repeated after 56 days. Offensive and regrouping orders are unavailable until the plan ends."
 STP_cw_started: "The civil war has begun"
 STP_cw_union_wars_finished: "The civil war in Stelander has ended"
 STP_cw_elections_finished: "The chairman's election has ended"
 STP_sided_with_Maksim_flag: "Shabrat has been supported"
 STP_sided_with_the_party_flag: "The party has been supported"
 STP_cw_headquarters_ready: "Shabrat's headquarters has been formed"
 STP_cw_garrison_program: "Garrison connections have been prepared"
 STP_cw_northern_crisis_pending: "Nodrul is preparing a northern campaign"
 STP_cw_recruitment_program: "The territorial brigade programme is open"
 STP_cw_uprising_prepared: "The uprising plan is prepared"
 STP_party_counterintelligence_asset: "Party counterintelligence is active in the district"
 STP_region_player_operations_allowed: "Political operations can be conducted in the district"
 ADISCORD_STP_cw.30.shabrat: "Shabrat was declared the election winner. For a few hours, it seemed that a single line in the record would be enough for a peaceful transfer of power. Then party command refused to obey the new chairman's orders.\n\nTwo sets of orders spread across the country. In some districts, officials kept their offices and simply changed the recipients of their reports. In others, garrisons occupied administrations before they could choose sides. Abila recognised Shabrat. The party held the Bronze Congress and a substantial share of the forces. The western councils took advantage of the split and declared independence.\n\nShabrat had won a mandate, but not the entire state. Now the election result would have to be defended by the units, commanders and depots willing to recognise it as lawful."
 ADISCORD_STP_cw.30.party: "The party apparatus declared its result final. Shabrat's representatives left the hall before the ceremony ended, and a few hours later his headquarters denounced the record as imposed.\n\nAbila refused to obey the capital. In the highland districts, networks that had existed for years as an alternative administrative layer were activated. Party commissioners occupied communications hubs and depots wherever they arrived first. In the west, the councils announced that they no longer recognised either side.\n\nThe party kept the seals, part of the army and the capital. Shabrat kept the people willing to live without those seals. By evening, the dispute over legality had become a front line."
 STP_cw_legitimacy_initialized: "The struggle for legitimacy has begun"
 STP_cw_shabrat_election_victory: "Shabrat has won an electoral mandate"
 STP_cw_party_election_victory: "The party has retained the electoral record"
 STP_battle_for_stelander_active: "Preparations for Stelander's split continue"
 STP_cw_delay_inspection: "Delay the Commission: [FROM.GetName]"
 STP_cw_delay_inspection_desc: "Our people will demand additional records be checked in the selected district. For §Y35§! £political_power_texticon, only this commission is immediately extended by §Y14 days§!. One preparation slot will be occupied for the same §Y14 days§!. After completion, repetition in the same district is blocked for §Y60 days§!. If the commission is already gone, no political power is deducted. If preparation ends, the slot is freed exactly once."
 STP_cw_open_civil_registers: "Open the Civil Registers"
 STP_cw_open_civil_registers_desc: "We will present civil documents to the commission and dismantle the local military network. For §Y25§! £political_power_texticon, the administration will remain on our side, but garrison connections, supply and sabotage will be lost. Weapons in the local reserve will return to the district's owner; Kefreyt's volunteers will return home. This concession creates no evacuated units.\n\nThe response takes effect immediately and occupies no slot. Local operations will be suspended until the commission ends; network operations already begun will be cancelled. Their political power and treasury expenses are not refunded, and allocated weapons are returned only once. Legitimacy will shift §R2%§! towards the party. Military connections can be rebuilt at full price after the inspection."
 STP_cw_civil_registers_result_tt: "Civil administration will survive. Garrison connections, supply and sabotage in the district will be dismantled; the weapon reserve will return to the district's owner, and volunteers to Kefreyt. Current local network operations will be cancelled without refunding political power or treasury expenses. New local operations remain unavailable until the commission ends."
 STP_cw_civil_registers_command_risk_tt: "§RIf this is the last prepared garrison in [2.GetName] or [29.GetName], the command agreement will lose effect.§! Unfinished negotiations will be cancelled without refunding §Y75§! £political_power_texticon. An agreement already concluded will cease to strengthen the mandate or enable a limited revolt until a garrison is restored."
 STP_cw_sacrifice_local_contact: "Surrender a District Official"
 STP_cw_sacrifice_local_contact_desc: "We will name the official who signed our documents to the commission. His administrative connections will be lost immediately, but the current inspection will spare prepared garrison connections, supply, sabotage and stockpiles. Work in the district will stop until the inspection ends.\n\nThis reduces the chances of transferring the district to the resistance: the administration can be recruited again after the inspection. Any agreement with a local council survives. The response takes effect immediately for §Y25§! £political_power_texticon and occupies no slot. Suspicion will fall by §G4§!, and legitimacy will shift §R2%§! towards the party."
 STP_cw_surrender_contact_tt: "The local resistance administration will be lost. The current inspection will preserve other prepared assets and reserves, but new district operations are unavailable until it ends. Suspicion: §G-4§! (minimum 0)."
 STP_false_trail_in_progress: "A false trail is being prepared for the current commission"
 STP_false_trail_prepared: "A false trail is prepared for the current commission"
 STP_inspection_concession_prepared: "The commission's terms are accepted; district work is suspended"
 STP_cw_prepared_supply_lines: "Prepared Supply Routes"
 STP_cw_prepared_supply_lines_desc: "Depots prepared in advance support the opening weeks of resistance mobilisation. Supply consumption falls and organisation recovery accelerates for 21 days. One surviving depot in Niansas or Hoskheit is sufficient; a second does not double this shared effect."
 STP_cw_northern_engineer_mission: "Northern Engineer Team"
 STP_cw_northern_engineer_mission_desc: "Shabrat's engineers help the allied army accelerate field fortification and entrenchment. The team works for 45 days while the recipient is at war with Nodrul."
 NOD_cw_northern_offensive: "Nodrul's Northern Offensive"
 NOD_cw_northern_offensive_desc:0 "The opening offensive lasts 85 days from the start of the northern war. If the war against Yubora, the Forest or the Frontier continues, Stalled Army replaces it. Both spirits end with the northern war."
 STP_cw_nod_disrupted_rear: "Nodrul's Disrupted Rear"
 STP_cw_nod_disrupted_rear_desc: "Shabrat's sabotage disrupts supply and the pace of redeployment. For 42 days, Nodrul's army consumes more supplies and moves more slowly."
 STP_cw_party_sabotage_aftermath: "Disrupted Party Production"
 STP_cw_party_sabotage_aftermath_desc: "Shabrat's planted charges strike at shifts and deliveries. For 70 days, the party's military factories produce less and build efficiency more slowly."
 STP_cw_party_battle_spirit: "The Battle for Stelander"
 STP_cw_party_battle_spirit_desc: "The party's regular units hold to a unified headquarters and the established order. Unit coordination and prepared orders help them hold the front against the resistance. The spirit lasts until this war ends."
 STP_cw_resistance_battle_spirit: "The Battle for Stelander"
 STP_cw_resistance_battle_spirit_desc: "Resistance detachments rely on local connections, rapidly change positions and return to action after battle. Even the loss of important centres does not mean an immediate abandonment of the struggle. The spirit lasts while the war continues against the party or Nodrul after it joins the party's side."
 STP_cw_republics_battle_spirit: "The Battle for Stelander"
 STP_cw_republics_battle_spirit_desc: "Mountain communities defend their own passes and settlements. Knowledge of the terrain helps them fortify positions faster and dig in deeper. The spirit appears when Kefreyt attacks and is removed when this separate war ends."
 ADISCORD_STP_preparation.15.t: "Nectar of the Gods"
 ADISCORD_STP_preparation.15.d: "Morning began late in Stelander. By nine, the sun was already reflecting off the seaside hotels, but the streets were only beginning to stir. Workers washed the remains of yesterday's festival from the pavement. Music drifted from windows, and passenger airships rose above the port.\n\nA queue had already formed at the kiosk opposite Central Station. Dozens of identical frosted-glass bottles stood in the display. The golden label depicted a cup beneath a rising sun. 'NECTAR OF THE GODS.' Below, in small print, it read: 'Licensed by the Chamber of High Houses and Privileged Guilds. Consume responsibly. Enjoy freely.'\n\nGuidebooks advised foreigners to try the nectar as soon as they arrived. It was served in casinos, nightclubs and expensive restaurants. Cheaper varieties were sold in vending machines near factories and dormitories.\n\nSome claimed it made music sound better; others said it made talking to strangers easier. Others bought a bottle after their shift and sat outside their homes, watching the resort lights reflected in the water.\n\nThe government never called it a drug. Official documents used the phrase 'recreational preparation for general access.'\n\nOnce, such substances had been sold underground. A single dose could mean a prison sentence, and trading a few crates could cost you your property. Then Ivanov came.\n\nHe said the state should not tell a person what to do in their own bedroom, what to drink at their own table or how to forget a hard day's work. After decades of mobilisation, curfews and funerals, it sounded almost revolutionary.\n\nSteland was tired. Here, war was remembered through more than monuments. People still lived who could recognise an approaching Vorkerland bomber by the sound of its engine. The elderly spoke of winters when children slept in tunnels, safer there than at home.\n\nFor them, freedom meant neither parliament nor a constitution. Freedom meant a night without a siren.\n\nAfter the Fada Pact, the aircraft really did disappear. Mountain alliances laid down their arms. Roads opened. Foreign ships returned to the port. Hotels appeared where military depots had stood. Where ammunition had once been distributed, they now sold wine, pills, stimulants and the famous nectar."
 ADISCORD_STP_preparation.15.a: "Freedom meant a night without a siren."
 ADISCORD_STP_preparation.27.t: "Long Opening Events"
 ADISCORD_STP_preparation.27.d: "The first Stelander focuses contain several long story events about the country and its recent past. Would you like to read them in this campaign?\n\nSkipping changes only the presentation of lore. Focuses, their rewards, the economy, the route choice and the succession crisis continue unchanged."
 ADISCORD_STP_preparation.27.no: "No, take me to the game"
 ADISCORD_STP_preparation.27.yes: "Yes, I want to read them"
 ADISCORD_STP_preparation.16.t: "Ivanov and the Price of Peace"
 ADISCORD_STP_preparation.16.d: "Ivanov stood in every other square. In bronze, with a raised hand; in marble, with a child. Young on posters from the years of peace, old on state screens.\n\nBeneath one such screen, a man in a work jacket took a bottle from the vendor and swallowed a few mouthfuls at the counter. The screen showed a newsreel. Black-and-white footage of a ruined mountain settlement gave way to a colour panorama of the modern capital. Then came tourists, casinos and children running through a fountain. The announcer's voice was calm. 'Our fathers knew the price of war. Our children have the right not to know it.'\n\nThe man finished his nectar and threw the bottle away. Behind him stood an elderly woman with a shopping bag. When the announcer said 'Stelander,' the woman whispered, 'Steland.' No one noticed. The queue moved on.\n\nIn twenty years, legalisation had become one of the country's most profitable industries. The High Houses received production licences. The Guilds controlled supplies. Foreigners came to Stelander for things that could get them arrested at home.\n\nThe state received taxes. The worker received an evening that passed a little faster. The tourist received a story to tell friends. The Chamber called it freedom. And in a sense, it was freedom. Almost no one here cared whom a person slept with, what they drank, what they played or how much money they left at a casino table.\n\nThere were only a few subjects a well-mannered person preferred not to touch. One should not ask who owned the mines. Or read the appendices to the Fada Pact too closely. One should not wonder why state schools in some mountain districts closed faster than new resorts opened. One should not ask a policeman why some traders were detained while others' trucks passed through checkpoints without inspection. Above all, one should not ask where the people whose names sometimes appeared on the walls of the Lower City disappeared to.\n\nFor everything else, there was nectar.\n\nBy noon, the waterfront was full. The music grew louder. The first guests began gathering at the casino. A young couple took photographs beside Ivanov's statue. A golden bottle appeared on the screen above the square. 'YOU HAVE EARNED A QUIET LIFE.'\n\nThe advertisement gave way to the state coat of arms, then to Pyotr Ivanov's face. He looked noticeably older than his monuments. 'Peace is not weakness,' he said. 'Peace is our people's greatest victory.' People in the square barely paused. They had heard these words many times. Someone raised a bottle towards the screen; someone else never looked up.\n\nFar away, above the resorts and roads to the border, snow lay on the ruins of villages that never appeared in tourist brochures. There, they still said 'Steland.' In the capital, the word was gradually becoming a historical term. This was Stelander. Safe. Rich. Free. And as long as the music played loudly enough, few people thought to ask what exactly held its peace together."
 ADISCORD_STP_preparation.16.a: "Peace was worth the price."
 ADISCORD_STP_preparation.23.t:0 "The Revolution from the North"
 ADISCORD_STP_preparation.23.d:0 "The Hedonist Revolution was born not in Steland, but in Nodrul. There, an alliance of local aristocrats, wealthy houses and privileged guilds overthrew the old elite and offered society a new bargain: less duty, less austerity, more personal freedom, consumption and the right not to take part in politics. The old order demanded sacrifice; the new one promised that the state worked best when ordinary people did not have to think about it every day.\n\nAfter victory, Nodrul began exporting this model to its neighbours. Money, propagandists, lawyers, creditors and political intermediaries entered war-exhausted Steland. They did not create discontent from nothing: the country had already spent decades under mobilisation, shortages and Vorkerland air raids. In the highlands, politics had long been measured not in programmes, but in whether the next village would survive the winter.\n\nPart of the local nobility and the owners of the ports saw a chance to preserve their property and rebuild the country around peacetime trade. For most of the population the promise was simpler still — an end to the endless war. When Nodrul offered reopened roads, ships returning to the harbours and nights without air-raid alarms, the old oaths of the mountain alliances began to sound like a promise of continued suffering.\n\nPyotr Ivanov became the man who tied the imported revolution to national salvation. He did not defeat Vorkerland on the battlefield. Instead, the Fada Pact stopped the raids, reopened roads and ports, and gave the country a respite it had not known for generations. That allowed Ivanov to present concessions not as surrender, but as the price of a sky without bombers.\n\nThe price, however, was written into the annexes. Parts of the old alliances were disarmed, trade and resource obligations were fixed by treaty, and Nodrul gained access to Stelander's laws, personnel, credit and political institutions. Advisers replaced garrisons; party schools, funds and specialists replaced military administration.\n\nThat is how the present mandate emerged. Stelander retains its own flag, government and army, but much of its stability depends on Nodrul. It is not ordinary occupation. The leash is almost invisible for as long as the country walks where it is expected to go."
 ADISCORD_STP_preparation.23.a:0 "Peace proved more persuasive than the old independence."
 ADISCORD_STP_preparation.25.t:0 "Behind the Capital's Lights"
 ADISCORD_STP_preparation.25.d:0 "The Chamber of High Houses likes to say that it leaves citizens alone. That is not entirely false. In Stelander, people really can drink, gamble, use legal recreational drugs, speak openly about private life and pursue pleasure more freely than under the old military order. For a generation raised among mobilisations and funerals, that freedom became proof that Ivanov's peace worked.\n\nNon-interference ends where money and power begin. The High Houses and privileged guilds control licences, ports, mines, media and major contracts. The resort capital grows rich, the waterfront shines and foreign tourists see the country as an endless festival. In the highlands, meanwhile, schools close, roads are repaired last, young specialists leave and local administrations increasingly depend on intermediaries appointed from the centre.\n\nThe system does not try to make everyone equally poor. Quite the opposite: it is very good at creating islands of wealth. That contrast is precisely what makes it vulnerable. The brighter the showcase becomes, the easier it is to see the districts that pay for the celebration and receive almost nothing from it.\n\nBelow even that lies the Lower Market. It is not one district and not one criminal organisation, but a network of clubs, warehouses, agencies, treatment zones, fraudulent contracts and private security. Through it pass abducted people, debt bondage, forced labour and human trafficking, including children. Slavery is rarely called slavery here: a victim may have a contract, a debt, a registered employer and even an official pass — only no meaningful right to leave.\n\nThe police know enough to understand the scale of the system, but are too entangled with it to expose everything at once. Some units are paid by the Houses, others look away on orders, and others convince themselves that isolated abuses do not invalidate the peace as a whole. That is why the regime fears not one witness, but a complete archive of payments and routes. Such a record could turn a collection of crimes into a map of the state.\n\nMaksim Shabrat has made that map into a political weapon. His resistance did not grow from a single circle of conspirators: it brought together district activists, officials, miners, drivers, former sappers and officers who no longer believe that dependence on Nodrul and the rule of the Chamber are the unavoidable price of peace. Shabrat has no finished alternative state or open army yet, but he does have a network, documents and people capable of acting in several districts at once.\n\nWhile Ivanov was healthy, the party could dismiss all of this as noise from the margins. Now the president is fading. With him disappears the man whose name justified peace, dependency and the wealth of the High Houses alike. The succession question is therefore becoming a larger one: whether the regime itself has the right to outlive its creator."
 ADISCORD_STP_preparation.25.a:0 "Behind the showcase, people are already preparing to break it."
 ADISCORD_STP_cw.70.t: "The Fight over Ivanov's Succession Turns to War"
 ADISCORD_STP_cw.70.d: "Following Pyotr Ivanov's death, the dispute over his successor has turned into open war. The party government holds the capital and the state apparatus. Maksim Shabrat can count on part of the garrisons and district administrations, as well as underground networks prepared before the election. In the west, local councils have recognised neither side and proclaimed the Occidian Revival Union.\n\nThe army has split. Commanders receive contradictory orders over the same lines, and depots open on party instructions one day and on resistance orders the next. Nodrul has made it clear that it does not regard events in Stelander as a purely internal matter. Kefreyt is keeping a close watch on the western border."
 ADISCORD_STP_cw.70.a: "Stelander has split apart."
 ADISCORD_STP_cw.71.t: "The Party Government Holds Stelander"
 ADISCORD_STP_cw.71.d: "Maksim Shabrat's organised resistance has been defeated. Party units are returning to the district centres, dismantling checkpoints and restoring the capital's authority. The government has declared the civil war over and called the victory proof that Ivanov's system can outlive its founder.\n\nThe pre-war country has not been restored. The western republics still ignore the capital, and thousands of former resistance fighters and officials are waiting to learn their fate. Talk of a possible Nodrul intervention has shown how much the old order depended on outside support.[STPGetVictoryNews]"
 ADISCORD_STP_cw.71.a: "The party has held on to power."
 ADISCORD_STP_cw.72.t: "Shabrat Wins Stelander's Civil War"
 ADISCORD_STP_cw.72.d: "The party government's last organised units have laid down their arms. Maksim Shabrat's forces have occupied the Bronze Congress and the key institutions of the capital. The civil ministries have not been disbanded: officials have been asked to stay at their posts until a permanent cabinet is formed.\n\nWith the party gone, Nodrul has lost its political foothold in Stelander, but the country's old borders have not come back. The western republics remain independent, and the regime's archives are only beginning to open. The new authorities must now merge underground networks, the army and the surviving bureaucracy into a single state."
 ADISCORD_STP_cw.72.a: "Shabrat has taken the capital."
 VAL_cw_republics_grace_elapsed_tt: "At least 60 days have passed since Stelander's collapse."
 ADISCORD_STP_cw.73.t: "Kefreyt Invades Occidia"
 ADISCORD_STP_cw.73.d: "After the ultimatum expired, Kefreyt's columns crossed the border of the Occidian Revival Union. Kefreyt demands the transfer of [43.GetName], [44.GetName] and [88.GetName], citing old agreements on resources, roads and security. The western republics have rejected the demands and placed their forces under a single command.\n\nOfficially, this war has nothing to do with the civil war in Stelander, but it would hardly have been possible without the country's collapse. Stelander's former administrative lines have become state borders, and its neighbours have started dividing up what it left behind."
 ADISCORD_STP_cw.73.a: "Kefreyt wants its share."
 ADISCORD_STP_cw.80.t: "Nodrul Imposes a New Order on the North"
 ADISCORD_STP_cw.80.d: "The Northern Defence Alliance has been crushed. Nodrul's troops have occupied the lands of the Cult of the Children of the Forest and abolished its government. The Yubor People's Republic keeps its historical core, but has become dependent on Nodrul. The Free Frontier made a separate peace and kept its independence.\n\nFor decades Nodrul extended its influence through advisers, treaties and other countries' administrations. This campaign is the first time in many years that it has got its way by direct military force. The troops freed by the campaign are back at the disposal of Nodrul's leadership, and neighbouring governments are already revising their defence plans."
 ADISCORD_STP_cw.80.limited: "Nodrul has won a military victory over the Northern Defence Alliance, but could not carry out its original post-war plan. Some disputed lands changed hands during the campaign, and the peace has fixed a front line that differs from the calculations of Nodrul's staff.\n\nThe northern front is closed nonetheless. Nodrul's opponents no longer act as a single alliance, and its command can turn back to the south."
 ADISCORD_STP_cw.80.a: "The north is now under Nodrul's control."
 ADISCORD_STP_cw.81.t: "The Northern Alliance Stops Nodrul"
 ADISCORD_STP_cw.81.d: "The northern campaign has ended in Nodrul's retreat. Its government has agreed to end the war with the Yubor People's Republic, the Cult of the Children of the Forest and the Free Frontier. Esnos and Brioland pass to Yubor; the other alliance members keep their governments and armies.\n\nThe defeat has not caused a state crisis in Nodrul. But its attempt to win by force what it was used to obtaining through advisers, treaties and dependent administrations has failed, and for the first time Nodrul's army has had to accept an opponent's terms."
 ADISCORD_STP_cw.81.limited: "The northern states have forced Nodrul to end its campaign and kept their governments. The peace treaty covers only those parts of Esnos and Brioland that Nodrul still held when talks began; lands that had passed to third countries are not affected.\n\nThe resulting borders are messier than the alliance demanded, but Nodrul has failed to dictate its terms to the north."
 ADISCORD_STP_cw.81.a: "Nodrul has pulled back."
 ADISCORD_STP_cw.82.t: "Nodrul Opens the Northern Front"
 ADISCORD_STP_cw.82.d: "Nodrul's troops crossed the northern border after the last round of talks failed. The Yubor People's Republic, the Cult of the Children of the Forest and the Free Frontier, which until recently quarrelled among themselves over roads, land and influence, responded by forming the Northern Defence Alliance and agreed to fight as a single coalition until Nodrul's offensive is stopped.\n\nNodrul says the campaign is meant to end instability on the border and remove a threat to regional security. The northern governments call the invasion an attempt to impose on them the same dependency in which Nodrul held Stelander for decades. The region is now caught up in two wars at once: in the south, the struggle over Ivanov's inheritance continues."
 ADISCORD_STP_cw.82.a: "War has broken out in the north."
 STP_nod_alliance: "Stelander-Nodrul Alliance"
 STP_northern_defence_alliance: "Northern Defence Alliance"
 STP_cw_cache_capacity_tt: "After delivery, Abilia's total reserve, including weapons in transit, will not exceed £infantry_equipment_texticon §Y960000§!."
 NOD_cw_northern_conscription: "Northern Conscription"
 NOD_cw_northern_conscription_desc: "The northern campaign has required more personnel than headquarters expected. We will obtain government approval to expand conscription: Extensive Conscription will take effect in 35 days. New reservists will arrive gradually, and training replacements will take longer.\n\nIf the northern campaign ends or the law changes sooner, the order will be cancelled and political power refunded. If intervention has already been approved, mobilisation is maintained during redeployment. Ordinary demobilisation applies after the threat ends."
 NOD_cw_northern_mobilization: "Mobilisation on the Northern Border"
 NOD_cw_northern_mobilization_desc: "In 28 days, Nodrul's army will begin a war against the defensive alliance of Yubor, the Cult of the Children of the Forest and the Free Frontier. Stelander's split does not cancel the order. Intervention preparations may run alongside the northern campaign; the northern front blocks only entry. After the campaign ends without Nodrul's defeat, seven days of redeployment and any remaining preparations must be completed."
 STP_cw_northern_supply_idle_tt: "The previous northern shipment has been delivered or returned."
 STP_cw_northern_supply_delivery_tt: "§Y[FROM.GetName]§! will receive £infantry_equipment_texticon §Y24000§! if it remains at war with Nodrul and has not capitulated. Otherwise, the weapons return to the sender."
 STP_cw_northern_supply_cost: "§Y40§! £political_power_texticon £infantry_equipment_texticon §Y24000§!"
 STP_cw_northern_supply_cost_blocked: "§R40§! £political_power_texticon £infantry_equipment_texticon §R24000§!"
 STP_cw_northern_supply_cost_tooltip: "Cost: §Y40§! £political_power_texticon £infantry_equipment_texticon §Y24000§!. Only weapons are returned upon cancellation."
 STP_cw_district_administration_2_tt: "A resistance administration has been prepared in §Y[2.GetName]§!. It helps preserve civilian administration and transfer the district with sufficient local support. A party inspection can disrupt the agreement."
 STP_cw_defensive_lines: "Prepare Defensive Lines"
 STP_cw_defensive_lines_desc: "Engineers will prepare a line around Abilia for the resistance to occupy at the split. Headquarters will also receive §Y50§! £political_power_texticon to expand the work. Positions in other stronghold districts require separate funding and time."
 STP_cw_heavy_reserve: "Reinforced Battle Groups"
 STP_cw_heavy_reserve_desc: "We will organise recruitment and supply for reinforced units with artillery and support formations. A separate order will cover personnel, weapons and training; up to four divisions can be prepared for Shabrat's future army."
 STP_cw_national_mandate: "Guarantees for the Transfer of Power"
 STP_cw_national_mandate_desc: "We will secure public recognition of the electoral procedure and open negotiations with the military command to obey the announced result. With broad support and an active garrison commitment, party resistance can be limited to a separate revolt. This requires Monaia's and Niansas's administrations to have worked for at least 21 days without being lost by the time the result is announced. If a large war cannot be avoided, political preparations will strengthen Shabrat's mandate."
 STP_cw_election_mandate_dynamic: "Mandate to Rebuild the State"
 STP_cw_election_mandate_dynamic_desc: "The announced election result helps gather reserves, restore fighting strength and hold our own territory. The scale of support is determined before the split; weapons and prepared units are accounted for separately."
 STP_cw_secure_election_result: "Secure the Army's Recognition of the Result"
 STP_cw_secure_election_result_desc: "[STPGetPublicAgreementTiming]\n\nThe command's public commitment lasts 50 days after negotiations. Ravel and at least one prepared garrison must survive until the result is announced. If Shabrat wins, the agreement further strengthens his military mandate even if a large war begins. Limiting the party revolt also requires legitimacy of at least 80% and administrations in [2.GetName] and [3.GetName], each working continuously for at least 21 days by the announcement. If an administration is lost and restored, its duration starts again. Negotiations occupy a preparation slot; political expenses are not refunded if they fail. Losing the election gives Shabrat no military recognition."
 STP_cw_public_command_available_tt: "§YRavel§! is available and not arrested; a prepared garrison survives in §Y[2.GetName]§! or §Y[29.GetName]§!."
 STP_cw_public_command_agreement_tt: "The command recognises the announced result for §Y50 days§! while §YRavel§! is available and a prepared garrison survives. A limited revolt also requires §Y80%§! legitimacy and at least §Y21 days§! of continuous work by both administrations in §Y[2.GetName]§! and §Y[3.GetName]§! by the announcement; losing an administration resets its duration. If Shabrat wins, the agreement further strengthens his military mandate regardless of the revolt's scale:"
 STP_cw_national_mandate_tt: "An exceptional mandate and the command's public commitment can limit the revolt to party strongholds if both administrations in §Y[2.GetName]§! and §Y[3.GetName]§! have worked continuously for at least §Y21 days§! by the announcement. Losing an administration restarts its duration. An ordinary election victory gives Shabrat's future side a military spirit: faster organisation recovery, stronger defence of its own territory and faster reserve training."
 STP_cw_prepare_defensive_line: "Defensive Lines: [FROM.GetName]"
 STP_cw_prepare_defensive_line_desc: "In 35 days, engineers will prepare positions and materials. At the split, fortifications in this state's border provinces will gain two additional levels. The state's owner receives the lines: secure its transfer first. Unfinished work is interrupted by the split or loss of control; its costs are not refunded."
 STP_cw_defensive_lines_tt: "The line in §Y[1.GetName]§! is prepared: at the split, the resistance will receive §Gtwo additional fortification levels§! along Abilia's borders. Separate paid projects of §Y21 days§! each become available in §Y[2.GetName]§! and §Y[3.GetName]§!."
 STP_cw_defensive_line_result_tt: "At the split, fortifications along the borders of §Y[FROM.GetName]§! will gain §Ytwo additional levels§!. They go to the state's actual owner."
 STP_cw_prepare_assault_group: "Prepare a Reinforced Division"
 STP_cw_prepare_assault_group_desc: "An order for one reinforced division: six infantry and two artillery battalions with engineers, support artillery and anti-air. Recruitment and weapons purchases are included in the price of 500 from the treasury; state stockpiles are not used.\n\nPreparation takes 28 days and one slot. Four divisions can be ordered. Ready units will enter Shabrat's army at the split. If preparation is interrupted, the money is returned."
 STP_cw_assault_group_tt: "Unlocks paid preparation of up to §Yfour reinforced divisions§! for Shabrat's army: §Y28 days§! each, with artillery, engineers and anti-air. Personnel and weapons are reserved in advance; ready units are fully equipped."
 STP_cw_assault_group_capacity_tt: "Fewer than four reinforced divisions have been prepared."
 STP_cw_assault_group_result_tt: "At the split, Shabrat's army will receive §Yone fully equipped reinforced division§!. Its personnel and weapons have already been paid for and are excluded from the general division."
 NOD_cw_northern_redeployment: "Redeployment from the Northern Front"
 NOD_cw_northern_redeployment_desc: "The northern campaign has ended. Troop redeployment takes seven days; remaining intervention preparations continue simultaneously. The army will enter when both tasks are complete, if the party is still holding out."
 STP_cw_nod_redeployment: "Nodrul Is Redeploying Its Troops!"
 STP_cw_nod_redeployment_desc: "The northern war has ended. Nodrul is redeploying its army towards Stelander. When this mission ends and intervention preparations are complete, it can join the party's side. Defeating the party will close this opportunity."
 ADISCORD_STP_preparation.19.t: "Call-Up Notices"
 ADISCORD_STP_preparation.19.d: "The first call-up notices were delivered before conscription was officially announced. Post offices stacked them beside electricity bills and resort advertisements. The reason field bore a neutral phrase: 'reserve readiness review.'\n\nMen with old army bags appeared at railway stations. Some had served in the final years of the war; others were putting on a uniform for the first time. Commanders spoke of defending depots, bridges and administrative buildings. Asked whom they would defend them against, they gave the same answer: no decision had been made yet.\n\nMeanwhile, rifles were already being counted in the depots. Party representatives checked officer lists. Shabrat's people searched for those willing to refuse an order against their own district. The state still called itself peaceful, but for the first time since the Fada Pact, it was assembling a reserve for something other than an external army.\n\nMost of the conscripts did not yet belong to either side. That was precisely why each side hurried to be the first to explain what serving Stelander meant."
 ADISCORD_STP_preparation.19.a: "The army was preparing for a question not yet asked."
 ADISCORD_STP_cw.30.limited: "Shabrat had won more than a majority. Key commanders and district administrations recognised the result. When Hedersett tried to contest the transfer of power, most of the state continued working without him.\n\nThe party uprising did not engulf the country. Units loyal to the old apparatus entrenched themselves around the capital and the Bronze Congress. They retained the guard, certain depots and officials for whom a party defeat meant too much. The remaining districts recognised the new government.\n\nThis is still a war, but no longer a war between two equal states. Hedersett needs one success and enough time for Nodrul's help to turn the capital revolt into something larger. Shabrat needs to end it first."
 STP_cw_defensive_line_cost: "§Y50§! £political_power_texticon £ADISCORD_economy_treasury_texticon §Y1200§!"
 STP_cw_defensive_line_cost_blocked: "§R50§! £political_power_texticon £ADISCORD_economy_treasury_texticon §R1200§!"
 STP_cw_defensive_line_cost_tooltip: "Cost: §Y50§! £political_power_texticon £ADISCORD_economy_treasury_texticon §Y1200§!."
 STP_cw_fund_northern_forts: "Fortify the Northern Line: [FROM.GetName]"
 STP_cw_fund_northern_forts_desc: "In 28 days, engineers will prepare border positions in the selected district. One fortification level will appear on the border with Nodrul. Only one such project can run at a time; if disrupted, treasury funds are returned, but political power is not."
 STP_cw_send_northern_engineers: "Send Engineers: [FROM.GetName]"
 STP_cw_send_northern_engineers_desc: "In 21 days, we will send an engineer team to the selected northern ally. Field fortification and entrenchment will accelerate for 45 days. Another team can be sent to the same recipient 35 days after completion."
 STP_cw_sabotage_nodrul: "Sabotage Nodrul's Rear: [FROM.GetName]"
 STP_cw_sabotage_nodrul_desc: "In 28 days, saboteurs will strike the selected district in Nodrul. Success damages infrastructure and disrupts Nodrul's army's tempo and supply for 42 days. Active intervention preparations will be delayed by 21 days. The operation can also run during the civil war. Without active preparations, the intervention deadline is neither changed nor restored."
 STP_cw_northern_aid_ready_tt: "The northern aid desk is open and Nodrul still holds out"
 STP_cw_northern_fort_idle_tt: "No other northern defensive line is under construction"
 STP_cw_northern_fort_front_tt: "The district is on the front against Nodrul and does not yet have this defensive line"
 STP_cw_northern_fort_refund_tt: "£ADISCORD_economy_treasury_texticon The previously paid amount will return to the treasury."
 STP_cw_northern_fort_result_tt: "§Y1§! fortification level will appear on the border of §Y[FROM.GetName]§!."
 STP_cw_northern_engineer_idle_tt: "No other engineer team is in transit"
 STP_cw_northern_engineer_ready_tt: "The recipient has no active engineer team"
 STP_cw_northern_engineer_refund_tt: "£ADISCORD_economy_treasury_texticon The previously paid amount will return to the treasury."
 STP_cw_nod_sabotage_idle_tt: "No other sabotage operation is underway in Nodrul's rear"
 STP_cw_nod_owned_tt: "The district is owned and controlled by Nodrul"
 STP_cw_nod_sabotage_result_tt: "Infrastructure in §Y[FROM.GetName]§! will be damaged. Nodrul's rear will be disrupted for §Y42 days§!; active intervention preparations will be delayed by §Y21 days§!."
 STP_cw_assault_group_cost: "£ADISCORD_economy_treasury_texticon §Y6000§!"
 STP_cw_assault_group_cost_blocked: "£ADISCORD_economy_treasury_texticon §R6000§!"
 STP_cw_assault_group_cost_tooltip: "Cost of the complete order: £ADISCORD_economy_treasury_texticon §Y6000§!. Personnel and weapons are purchased as part of the order."
 ADISCORD_STP_cw.70.limited: "Maksim Shabrat has been declared the winner of the election and recognised by most district administrations and a large part of the army. The party leadership refused to hand over power and called out loyal units, but the revolt has been bottled up around the Bronze Congress and a few capital garrisons.\n\nElsewhere in the country, institutions are mostly working under the new government. In the west, local councils have used the crisis to declare independence. In Nodrul, officials are debating whether to back the remaining party forces."
 STP_cw_start_uprising_tt: "The election will be interrupted. The country and army will begin to split; prepared units and depots will determine each side's strength. Hostilities begin after the side is chosen."
 STP_cw_arsenal_idle_tt: "No other arsenal is being expanded"
 STP_cw_nod_busy_in_north_tt: "Nodrul is tied down by an active northern war"
 STP_nod_status_intervened: "§Rhas joined the party's side.§!"
 STP_nod_status_closed: "the intervention threat has ended."
 STP_nod_status_northern_war: "§Yis fighting in the north.§! Entry is currently impossible; redeployment will be required after the war."
 STP_nod_status_redeploying: "§Ris redeploying troops from the north.§! §Y[?NOD.days_mission_timeout@NOD_cw_northern_redeployment|0]§! days remaining."
 STP_nod_status_neutral: "has declined to intervene."
 STP_nod_status_ready: "§Rthe army is ready to intervene.§!"
 STP_nod_status_preparing: "is preparing to intervene - §Y[?NOD.days_mission_timeout@NOD_cw_intervention_preparation|0]§! days until ready."
 STP_nod_status_northern_mobilization: "is preparing a northern campaign; hostilities have not yet begun."
 STP_nod_status_observing: "is watching the crisis; the northern front does not yet distract its army."

 STP_cw_kefreyt_volunteers_cost_tt: "Kefreyt will provide £manpower_texticon §Y23700§! men, £infantry_equipment_texticon §Y21330§! rifles, §Y144§! sets of squad weapons, §Y90§! support equipment, §Y180§! artillery pieces and §Y60§! anti-air weapons. The entire package is paid for once the personnel and equipment have been assembled. If reserves are insufficient, Kefreyt will continue assembling the force; the civil war does not cancel the agreement."
 STP_ARMY_KEFREYT_COMMITMENT: "\nKefreyt has prepared another §Y3§! volunteer divisions with artillery and anti-air support for the resistance. They will remain until the war ends."
 STP_cw_credentials_review: "Verification of Delegates' Credentials"
 STP_cw_credentials_review_desc: "The Party secretariat challenges Shabrat's delegate lists wherever no one can verify the signatures. Every §Y35 days§!, the absence of a functioning administration in [2.GetName] or [3.GetName] costs §R8%§! legitimacy for each missing administration. No legitimacy is lost if both remain intact. The commission can destroy the organisation: provide cover, open the civil registers or rebuild it before the next review. The headquarters focus postpones the current review by §Y80 days§! once. Campaigning restores lost support, but occupies the same slot as military preparation."
 STP_cw_monaya_credentials_missing_tt: "There is no functioning Shabrat administration under our control in [2.GetName]"
 STP_cw_niansas_credentials_missing_tt: "There is no functioning Shabrat administration under our control in [3.GetName]"
 ADISCORD_STP_preparation.20.t: "Office Hours"
 ADISCORD_STP_preparation.20.d: "By eight in the morning, two queues had already formed outside the district administration. One was waiting for certificates confirming payments to reservists' families; the other was trying to find out exactly who the new call-up would affect. The secretary brought a second chair into the corridor, placed an inkwell on the windowsill and began writing down names on the back of an old poster. The direct telephone line to the capital had been silent all morning.\n\nThree documents lay on the district chief's desk which, in the past, would not even have reached discussion without presidential permission. An emergency fund had to be opened after a road collapsed, a doctor's appointment to a mountain settlement confirmed, and fuel released to a reserve battalion. The requests had been sent yesterday. No reply had arrived.\n\nAt noon, new forms arrived from the capital. Every one still bore the printed name of Pyotr Ivanov. The district chief took the first sheet, stared for a long time at the empty signature line, then wrote his own surname and added: 'On the instructions of the presidential administration.' He had received no such instructions. An hour later, seven more documents had been processed in the same way.\n\nNo one called it disobedience. People needed their money, the road needed repairing, and fuel had to be issued. The state kept working because its officials were gradually learning to make decisions that had once existed only after one man's signature.\n\nBy evening, the telephone from the capital still had not rung. The queues were booked in again for tomorrow."
 ADISCORD_STP_preparation.20.a: "The work continued in the name of a man who no longer directed it."
 ADISCORD_STP_preparation.21.t: "A Place at the Table"
 ADISCORD_STP_preparation.21.d: "Twelve cups were set out for the morning meeting, as usual. Ministers and department heads took eleven places. The twelfth cup remained before the chairman's empty seat.\n\nIvanov's assistant opened a folder and began reading the agenda. The first item required the president's signature. So did the second. Attached to the third was a note from the War Ministry requesting confirmation of an order issued several days earlier. No one in the room knew whether Ivanov would see any of these papers.\n\nIn the past, a meeting like this would have stopped. A decision taken without the president was considered provisional, and a document without his signature was returned to its sender. Today, Hedersett asked the assistant to continue. One minister objected. Another pointed out that the port could not wait for the chairman's recovery. Within minutes, those present were allocating expenditure, appointing officials and approving orders Ivanov had never seen.\n\nNo one uttered the word 'successor'. There was no need.\n\nBy the end of the meeting, the papers were no longer in front of the empty chair. They lay before Hedersett. The president's assistant noticed first. He said nothing and simply continued taking the minutes.\n\nAfter the meeting, an attendant began collecting the cups. When she reached Ivanov's place, she paused for a moment. The cup was untouched. Tomorrow's list still called for twelve.\n\nBut for the first time in decades, eleven people had governed Stelander for an entire day."
 ADISCORD_STP_preparation.21.a: "The country was learning to live without the man who was still its president."
 NOD_cw_call_ain: "Call in Ainholm's Forces"
 NOD_cw_call_ain_desc: "The Ainholm Mandate's forces will enter the northern war on our side. The colony's participation will end with the northern campaign."
 SRP_council_authority: "District Council Authority"
 SRP_council_authority_desc: "The districts supply their own units and retain civilian administration. Proximity to local depots eases supply, but the joint headquarters must coordinate its orders with several councils."
 SRP_emergency_command: "Emergency Headquarters Powers"
 SRP_emergency_command_desc: "Kefreyt's attack forced the councils to entrust the coordination of defence to headquarters. Commanders organise unit rotations and a common operational plan. These powers last only until the war with Kefreyt ends; Shabrat's victory or defeat does not revoke them."
 SRP_council_supply: "Paid Supplies for the Districts"
 SRP_council_supply_desc: "Shabrat's government has paid for weapons and work at local workshops. For 42 days, military factory output increases by 20% and organisation recovery by 10%. The programme ends when the war against Kefreyt is over or independence is lost."
 STP_cw_council_guarantees: "Guarantees to the District Councils"
 STP_cw_council_guarantees_desc: "The pre-war agreement survived the split. Shabrat promised to preserve the councils' autonomy and gained the ability to finance their supplies if Kefreyt attacks. Once civilian government returns, a decision must be made on whether that promise will become a permanent charter."
 STP_cw_republican_charter: "Charter of District Cooperation"
 STP_cw_republican_charter_desc: "Stelander has recognised the republics' independence. Joint orders and agreements between workshops accelerate civilian industrial construction on both sides. The charter does not create a military alliance or draw its signatories into one another's wars."
 STP_cw_central_authority: "Central Government Powers"
 STP_cw_central_authority_desc: "The government has refused to formalise its commitments to the district councils. Unified state procurement increases military factory output by 10% and reduces administrative expenditure by 5%. The republics are no longer promised supplies or joint programmes."
 SRP_distrust_stelander: "Distrust of Stelander"
 SRP_distrust_stelander_desc: "Shabrat's government has retreated from its pre-war guarantees. The councils are strengthening the defence of their own territories and preparing to rely on themselves. Refusing the charter does not, in itself, start another war."
 STP_cw_fund_republican_supplies: "Fund Supplies for the Republics"
 STP_cw_fund_republican_supplies_desc: "For 300 treasury units, we will purchase supplies from private vendors for the republics: 12000 rifles and 30 support equipment will reach their stockpiles. District workshops and unit recovery will receive support for 42 days. Our own weapons stockpile is not spent. Another shipment may be funded after 42 days if the republics' war with Kefreyt is still ongoing."
 STP_cw_republican_supplies_available_tt: "Both sides are independent and honour the agreement; the republics are at war with Kefreyt, have not capitulated and have completed their previous supply programme"
 STP_cw_republican_supplies_cost: "£ADISCORD_economy_treasury_texticon §Y300§!"
 STP_cw_republican_supplies_cost_blocked: "£ADISCORD_economy_treasury_texticon §R300§!"
 STP_cw_republican_supplies_cost_tooltip: "Cost: £ADISCORD_economy_treasury_texticon §Y300§!"
 STP_cw_negotiate_republican_charter: "Negotiate a District Charter"
 STP_cw_negotiate_republican_charter_desc: "Civilian government has been restored. We can now return to the pre-war guarantees and settle relations with the independent republics. Their separate war with Kefreyt does not prevent negotiations."
 STP_cw_republican_charter_available_tt: "Shabrat has defeated the Party; both sides are independent, have not capitulated, maintain the pre-war guarantees and are not already in negotiations"
 ADISCORD_STP_cw.90.t: "Signatures on the Charter"
 ADISCORD_STP_cw.90.d: "The district council representatives brought a copy of the agreement signed before the split. The paper has yellowed along its folds; beside Shabrat's signature are those of the people who kept local government running throughout it all.\n\nThe councils now propose to confirm the republics' independence and open joint procurement for civilian workshops. The document does not include a military alliance. The central chancellery proposes concentrating orders at our own military factories and reducing consultation with districts which no longer answer to the capital. Refusing the charter will end assistance to the councils.\n\nThe representatives await an answer. The war changed the map, but the signatures remain the same."
 ADISCORD_STP_cw.90.a: "Confirm the guarantees and sign the charter."
 ADISCORD_STP_cw.90.b: "Leave these matters to the central chancellery."
 ADISCORD_STP_cw.90.close: "Circumstances have changed."
 ADISCORD_STP_cw.91.t: "A Letter from the District Councils"
 ADISCORD_STP_cw.91.guaranteed: "The letter arrived with a lorry driver. The councils confirmed the pre-war agreement: the republics would govern their own districts independently, while Shabrat would maintain his promised guarantees.\n\nA list of workshops and depots was attached on the reverse. If Kefreyt attacks, paid arms shipments can be organised through them. At the bottom, a different hand had added: 'We will still need the agreement after the war.'"
 ADISCORD_STP_cw.91.independent: "The district councils' letter contains no request for a governor to be appointed. The republics announced the formation of their own administration and proposed avoiding clashes along the border.\n\nThe military demands a common defence plan; local representatives want to retain control of supplies and personnel. If Kefreyt attacks, headquarters will receive emergency powers, but the councils have no intention of dissolving themselves. Victory in the capital will not settle their future."
 ADISCORD_STP_cw.91.a: "Acknowledged."
 STP_cw_public_campaign_basis_tt: "At least one of the three campaigns remains unused, and its electoral stage has begun. Shabrat's second campaign requires an administration in Monaya or Niansas; the third requires both. Each required administration must have operated continuously for 21 days."
 STP_cw_delegate_support_available_tt: "Our side's advantage on the legitimacy scale is below 55%"
 STP_cw_command_timing_no_election: "The election has not begun. The agreement remains valid for only 50 days after negotiations conclude."
 STP_cw_command_timing_early: "§YToo early for the normal election result.§! Negotiations take 35 days, after which the agreement lasts for 50 days. An agreement signed now may expire before the votes are counted; signing early does not move the election date."
 STP_cw_command_timing_late: "§RNegotiations can no longer finish before the normal election result.§! No more than 35 days remain until then."
 STP_cw_command_timing_ready: "§GThe agreement will take effect in time and remain valid for the normal election result.§! Negotiations take 35 days, after which the commitment lasts for 50 days."
 STP_cw_military_committee_fund: "Military Committee Funds"
 STP_cw_military_committee_fund_desc: "The military proposes using funds raised by supporters to equip an assault formation. The committee will receive the money immediately, but civilian delegates will see this as preparation for a seizure of power. Construction of our own workshops will have to wait."
 STP_cw_military_fund_tt: "The treasury will receive £ADISCORD_economy_treasury_texticon §Y18000§! - the cost of three reinforced divisions. Each order through the already unlocked decision takes §Y28 days§! and occupies a preparation slot; the focus itself creates no units. Any unspent money is divided with the common treasury when the split occurs."
 STP_cw_abila_workshops: "Abilia Workshops"
 STP_cw_abila_workshops_desc: "We will establish military production in Abilia: four military factories and four building slots. The workshops will not deliver a ready assault formation before the uprising, but they will be able to replace losses after the first battles. The military committee will not receive funding for a separate reinforced formation."
 STP_cw_abila_workshops_tt: "When the split occurs, Abilia and its four military factories pass to the resistance. Until the division, their output enters the common state stockpile; production is assigned through the normal interface."
 STP_cw_election_time_21_tt: "More than 21 days remain until the election result: the campaign can finish in time"
 STP_cw_election_time_14_tt: "More than 14 days remain until the election result: negotiations can finish in time"
 STP_pw_republic_dynamic: "Republic of the Districts"
 STP_pw_republic_dynamic_desc: "The republic's civilian institutions, restored economy and professional army. Post-war decisions determine their combined capabilities."
 STP_pw_party_dynamic: "The Renewed Presidium"
 STP_pw_party_dynamic_desc: "Permanent Party administration, industrial planning and a regular army. Their capabilities depend on the chosen model of post-war reconstruction."
 STP_pw_reconstruction_available_tt: "Our side has won the civil war and its wartime programmes have ended."
 STP_pw_industry_reserve_tt: "If no suitable site is available, the treasury will receive a construction reserve instead of a new factory: £ADISCORD_economy_treasury_texticon §Y900§!. The permanent industrial specialisation is retained."
 STP_pw_civil_factory_or_reserve_tt: "Builds §Y1 Civilian Factory§! in an owned, controlled Stelandic region with a free slot. If no suitable site exists, the treasury receives £ADISCORD_economy_treasury_texticon §Y900§! instead."
 STP_pw_arms_factory_or_reserve_tt: "Builds §Y1 Military Factory§! in an owned, controlled Stelandic region with a free slot. If no suitable site exists, the treasury receives £ADISCORD_economy_treasury_texticon §Y900§! instead."
 STP_pw_republic_new_republic: "Services Return to the Districts"
 STP_pw_republic_new_republic_desc: "Residents need doctors, postmen and civil servants as much as they need a new constitution. We will open a paid public-services programme and restore trust in the new administration."
 STP_pw_republic_district_authority: "District Administrations"
 STP_pw_republic_district_authority_desc: "Military commandants will transfer economic affairs to permanent administrations. Common rules will reduce expenditure and spare the cabinet from settling every local dispute."
 STP_pw_republic_civil_records: "Restore the Registers"
 STP_pw_republic_civil_records_desc: "Without records of residents, property and obligations, neither benefits nor taxes can be administered. Archivists and local councils will bring the surviving documents together. Nodrul will be notified that its former mandate is under review."
 STP_pw_republic_open_settlement: "Retain Local Personnel"
 STP_pw_republic_open_settlement_desc: "We will retain specialists who took no part in repression. Swift reconciliation will build trust, but command will have to accommodate the diversity of the new administration."
 STP_pw_republic_firm_settlement: "Review Appointments"
 STP_pw_republic_firm_settlement_desc: "District commissions will review appointments. The cabinet will gain a more dependable administration at the cost of prolonged disputes and weaker local support."
 STP_pw_republic_civil_charter: "Civil Service Charter"
 STP_pw_republic_civil_charter_desc: "We will define officials' responsibilities, the complaints procedure and the limits of district administrations' powers. These rules will apply under any future political settlement."
 STP_pw_republic_restore_roads: "Reconnect the Economy"
 STP_pw_republic_restore_roads_desc: "We will link the capital to district centres and restore road services. The first works will improve one road, while further construction will proceed faster."
 STP_pw_republic_homes_for_returnees: "Bring Working Families Home"
 STP_pw_republic_homes_for_returnees_desc: "Housing and reliable roads will allow evacuated families to return. We can then finance the reopening of workshops where returning specialists will work."
 STP_pw_republic_civil_workshops: "Cooperative Workshops"
 STP_pw_republic_civil_workshops_desc: "We will bring small workshops together in durable production cooperatives. A new civilian factory will serve as the model for the next wave of construction."
 STP_pw_republic_accountable_arsenals: "Arsenals under Civilian Oversight"
 STP_pw_republic_accountable_arsenals_desc: "The army will retain the arms-production capacity it needs, but its operations will be brought into the public state budget. We will restore one factory and organise supplies to the plants already operating."
 STP_pw_republic_industrial_settlement: "An Economy without Emergency Orders"
 STP_pw_republic_industrial_settlement_desc: "We will coordinate orders for civilian workshops and arsenals so that they no longer compete for the same workers and machinery. Production will receive a steady flow of work."
 STP_pw_republic_army_register: "Register the Frontline Units"
 STP_pw_republic_army_register_desc: "We will bring separate detachments into a common army register and open a personnel-training programme. The divisions will remain, but replacements and supplies will be centrally organised."
 STP_pw_republic_officer_school: "School for Field Commanders"
 STP_pw_republic_officer_school_desc: "Resistance commanders will teach new officers the lessons that helped their units survive. A common curriculum will combine junior commanders' initiative with regular training."
 STP_pw_republic_supply_service: "District Supply Service"
 STP_pw_republic_supply_service_desc: "District depots will operate to a common schedule. Units will recover their combat readiness faster and lose fewer supplies in transit."
 STP_pw_republic_professional_service: "The Republic's Professional Army"
 STP_pw_republic_professional_service_desc: "Standing formations will receive common service regulations and replacement training. This is the foundation both for defending the passes and for future campaigns abroad."
 STP_pw_republic_settled_state: "Conclude Emergency Reconstruction"
 STP_pw_republic_settled_state_desc: "Civilian services, workshops and the regular army must be functioning before the emergency budget closes. Completing three paid programmes will consolidate industrial growth and restore the population's confidence."
 STP_pw_party_new_republic: "The State after Ivanov"
 STP_pw_party_new_republic_desc: "Victory preserved the Party, but did not restore the old system of government. The victorious leadership must rebuild the ministries, industry and the guard, then define relations between the centre and the district organisations. An agreement with local elites and an emergency chain of command are distinct domestic courses. Relations with Nodrul are settled separately."
 STP_pw_party_district_authority: "District Secretariats"
 STP_pw_party_district_authority_desc: "We will restore a single chain of administration from the presidium to the districts. Permanent secretariats will reduce the expense of parallel commissions and speed up the execution of decisions."
 STP_pw_party_civil_records: "Wartime Lists"
 STP_pw_party_civil_records_desc: "Party files list rebels and draft evaders alongside engineers who failed to obtain permission to evacuate. A review of their cases will determine whom we return to work and whom we declare an enemy."
 STP_pw_party_open_settlement: "An Agreement with District Elites"
 STP_pw_party_open_settlement_desc: "We will bring specialists back and recognise the district organisations' role in reconstruction. The course that follows will formalise their powers and retain local personnel. This will accelerate civilian work at the cost of some freedom for the central secretariat."
 STP_pw_party_firm_settlement: "An Emergency Party Hierarchy"
 STP_pw_party_firm_settlement_desc: "The new leadership regards uncertainty over appointments as the continuation of war by other means. We will establish personnel commissions and a single chain of command. A security reserve will become a separate paid measure. Strengthening the centre comes at the price of purges, the costs of oversight and the loss of specialists."
 STP_pw_party_civil_charter: "Charter of the Party State"
 STP_pw_party_civil_charter_desc: "After the congress of district secretariats or the creation of an executive secretariat, we will establish a permanent framework for the Party state. The charter does not erase the chosen model: the negotiated system preserves local initiative, while the hierarchy preserves central control. Military, economic and foreign-policy choices remain independent."
 STP_pw_party_restore_roads: "Restore the Routes to the Ports"
 STP_pw_party_restore_roads_desc: "Military transport disrupted the districts' links to the coast. We will restore a common plan for the road services so that cargo can reach the ports again and workers can reach their factories."
 STP_pw_party_homes_for_returnees: "Labour District Reception Offices"
 STP_pw_party_homes_for_returnees_desc: "District reception offices will match workforce registers with housing and returning families. We can then finance the reconstruction of one controlled port district: a civilian factory and its access routes."
 STP_pw_party_civil_workshops: "Restore the Resort Economy"
 STP_pw_party_civil_workshops_desc: "Before the war, coastal revenue sustained a substantial part of the state apparatus. We will restore civilian enterprises and allow the houses to resume servicing ports and resorts. These funds can no longer be promised to defence plants at the same time."
 STP_pw_party_accountable_arsenals: "War Orders instead of the Season"
 STP_pw_party_accountable_arsenals_desc: "We will postpone the return of the holiday season: materials, workers and new capacity will go to defence enterprises. The army will grow stronger sooner, but the civilian economy will have to wait."
 STP_pw_party_industrial_settlement: "The Post-war Production Plan"
 STP_pw_party_industrial_settlement_desc: "Commercial reconstruction or the defence combine has already determined the economy's priority. We will now bring taxation, capital expenditure and production plans together in a normal post-war budget. The differences between the two models remain; this shared focus merely ends emergency administration."
 STP_pw_party_army_register: "Take Stock of the Internal Forces"
 STP_pw_party_army_register_desc: "The internal troops won the struggle for government, but their departmental rolls are no basis for a regular army. We will count the units and open a paid re-equipment programme: weapons, support equipment and trucks will enter the common army stockpile."
 STP_pw_party_officer_school: "A Headquarters, Not a Commandant's Office"
 STP_pw_party_officer_school_desc: "Commanders were trained to guard buildings and suppress unrest. Now they must prepare operations involving several formations, work with maps and maintain communications with neighbouring units."
 STP_pw_party_supply_service: "Supply the Border Units"
 STP_pw_party_supply_service_desc: "We will make logistics the organising principle of the new army. Permanent depots and unified accounting will replace departmental allocations, while border units receive priority according to actual need. This course leads to district defence corps and rules out reliance on an independent field headquarters."
 STP_pw_party_professional_service: "An Army beyond the Capital"
 STP_pw_party_professional_service_desc: "We will make field service the organising principle of the new army. The internal troops will adopt a common programme of manoeuvres, joint exercises and commander training for multi-formation operations. This course leads to a field general staff and rules out deep specialisation in district logistics."
 STP_pw_party_settled_state: "End Emergency Rule"
 STP_pw_party_settled_state_desc: "Emergency rule can end only after four questions have been settled: how Party authority is organised, how the economy earns its revenue, what kind of army the country maintains, and on what terms it exists alongside Nodrul. Unfinished purges will then cease, and the presidium will take responsibility for the state's ordinary life."
 STP_pw_party_external_mandate: "An External Mandate"
 STP_pw_party_external_mandate_desc: "Emergency rule is over, but the powers beyond Stelander still define its security. The presidium must settle the questions that the civil war left outside the country's borders."
 STP_pw_party_bezhaysk_campaign: "The Bezhaysk Campaign"
 STP_pw_party_bezhaysk_campaign_desc: "Bezhaysk and its feudal holdings remain an independent military centre on our flank. Headquarters will prepare a separate campaign, after which the war council can give the order to advance."
 STP_pw_party_kefreyt_campaign: "The Kefreyt Campaign"
 STP_pw_party_kefreyt_campaign_desc: "Kefreyt survived our civil war with its contract system, army and regional influence intact. If it remains independent, the presidium will authorise a separate campaign against it."
 STP_pw_party_regional_order: "A Regional Order"
 STP_pw_party_regional_order_desc: "The Bezhaysk and Kefreyt questions are settled. The state can replace emergency external operations with a permanent system of borders, supply and regional administration."
 STP_pw_party_northern_march: "The Northern March"
 STP_pw_party_northern_march_desc: "Bezhaysk and Kefreyt no longer threaten our flanks, but Nodrul, Yubor, the Frontier, the Forest and Ainholm still stand to the north. Their armies, treaties and patrons keep dragging Stelander into other people's wars. The presidium is ready to end this: the march will subordinate the northern governments without erasing them from the map. Each will keep its own administration, but its decisions will be made in our capital."
 STP_pw_party_great_stelander: "Proclaim Great Stelander"
 STP_pw_party_great_stelander_desc: "The northern governments have signed their acts of subordination, and Kefreyt's border lands are governed from our capital again. For the first time the coast, the mountains and the northern forests answer to a single centre. The presidium proclaims Great Stelander - a state that no longer negotiates its borders with its neighbours."
 STP_pw_party_launch_bezhaysk_operation: "Launch the Bezhaysk Operation"
 STP_pw_party_launch_bezhaysk_operation_desc: "The plan is approved. This decision immediately begins the war against Bezhaysk. Once its capital falls, the participating feudal bloc will be incorporated into Stelander."
 STP_pw_party_bezhaysk_available_tt: "The Party's postwar government is independent and at peace. Bezhaysk exists, is independent, has not capitulated, and owns and controls its capital state. The two countries must not share a faction."
 STP_pw_party_launch_kefreyt_operation: "Launch the Kefreyt Operation"
 STP_pw_party_launch_kefreyt_operation_desc: "The plan is approved. This decision immediately begins the war against independent Kefreyt. Our victory will preserve Kefreyt as a dependent state and return the Stelander lands held by Kefreyt and its subjects to our administration."
 STP_pw_party_kefreyt_available_tt: "The Party's postwar government is independent and at peace. Kefreyt exists, is independent, has not capitulated and does not share a faction with Stelander."
 STP_pw_party_regional_order_tt: "The Bezhaysk and Kefreyt campaigns are finished, or the corresponding independent states no longer require a separate war."
 STP_pw_party_launch_northern_march: "Begin the Northern March"
 STP_pw_party_launch_northern_march_desc: "The staff has approved the offensive plan. This decision declares war on every independent northern government: Nodrul, Yubor, the Free Frontier, the Cult of the Children of the Forest and Ainholm."
 STP_pw_party_launch_northern_march_available_tt: "The Party's postwar government is independent and at peace. Nodrul is neither preparing an invasion nor fighting its own northern war. A year has passed since a lost northern march. At least one independent government remains in the north."
 STP_pw_party_launch_northern_march_tt: "Stelander declares war on every independent northern government. Their former patrons lose authority over them, and alliances with outside countries are dissolved.\n\nA capitulated government signs a white peace and becomes a §Ypuppet§! of Stelander the next day. Ainholm is separated from Nodrul and also becomes our puppet.\n\nWhen no independent government remains in the north: §G+100§! £political_power_texticon, war support §G+5%§!.\nIf Stelander capitulates, the war ends in a white peace with the whole northern side and no annexation: stability §R-10%§!, war support §R-10%§!, a new march no sooner than a year later."
 STP_pw_party_northern_march_resolved_tt: "The Northern March is complete: Nodrul, Yubor, the Free Frontier, the Cult of the Children of the Forest and Ainholm are subordinate to Stelander or no longer exist."
 STP_pw_party_great_stelander_identity_tt: "The country is proclaimed §YGreat Stelander§!. Stelander's puppets become §Ycontrolled governments§!."
 STP_pw_party_district_congress: "Congress of District Secretariats"
 STP_pw_party_district_congress_desc: "Compromise must become an institution rather than a series of personal promises. The district secretariats will receive a regular congress and the right to coordinate some economic decisions in advance. The centre loses a little operational freedom, but gains predictable execution, a tax base and fewer reasons to govern through emergency commissions again."
 STP_pw_party_executive_secretariat: "Executive Secretariat"
 STP_pw_party_executive_secretariat_desc: "A single chain of orders needs a body that checks compliance every day. The executive secretariat will bring appointments, reporting and departmental oversight into one administration. Decisions will cost the centre less and move faster politically, but constant pressure on the districts will leave its mark on internal stability."
 STP_pw_party_commercial_recovery: "Reopen the Coastal Economy"
 STP_pw_party_commercial_recovery_desc: "We will lift emergency restrictions on civilian commerce, expand warehousing and restore long-term shipping. Port contracts must become the foundation of reliable trade."
 STP_pw_party_defence_combine: "Defence Production Combine"
 STP_pw_party_defence_combine_desc: "We will organise state orders into a single production chain covering metalworking, repairs, artillery and small arms. Military purchasers and factory management will coordinate the combine’s work."
 STP_pw_party_fortress_corps: "District Defence Corps"
 STP_pw_party_fortress_corps_desc: "If the new army's first task is to survive the next crisis, well-supplied district corps must form its backbone. Common depots, replacement routes and defensive plans will reduce supply consumption and accelerate unit recovery. This is the path to a durable front, not a rapid offensive."
 STP_pw_party_field_staff: "Field General Staff"
 STP_pw_party_field_staff_desc: "A regular army must be able to operate beyond the capital's guard posts and prepare its operations in advance. The field staff will receive authority to coordinate divisional plans, conduct manoeuvres and judge commanders by their performance in the field. The price is foregoing deeper specialisation in district logistics."
 STP_pw_party_joint_defence_board: "Joint Defence Commission"
 STP_pw_party_joint_defence_board_desc: "The renewed protectorate must be more than a paper arrangement. Stelander will bring its own headquarters and northern advisers into a permanent commission, formalising the exchange of plans and supply standards. Even if a separate arms deal falls through, the system linking us to our patron will remain."
 STP_pw_party_armed_neutrality: "Armed Independence"
 STP_pw_party_armed_neutrality_desc: "Rejecting a patron makes sense only if we can defend that decision. We will build an arms reserve, standardise supply and require industry to maintain mobilisation stockpiles. Independence will become a funded military policy rather than a declaration."
 STP_pw_party_foreign_settlement: "Confirm Our International Status"
 STP_pw_party_foreign_settlement_desc: "Our international status can be considered settled only after the chosen course has been tested in practice. A protectorate settles the question through a treaty with Nodrul. Independence must survive its ultimatum and, if an invasion begins, force the north to recognise a sovereign Stelander through military action."
 STP_pw_infantry_lessons_bonus: "Lessons of the Civil War"
 ADISCORD_STP_preparation.8.pending: "Kefreyt agreed to help, but its quartermasters returned the requisition marked as incomplete. The units are still being assembled. The agreement has not been cancelled, even if Stelander splits before they are ready.\n\nShabrat's headquarters read that wording several times. The assistance exists on paper. Now they must hold the route by which it can arrive."
 ADISCORD_STP_preparation.8.delivered: "Abilia heard the columns before it saw them. The vehicles entered the city at dawn, followed by artillery and anti-air weapons. A liaison officer handed Shabrat a packet of orders and briefly reported that three divisions were ready to come under his command.\n\nThere was no ceremony at the station. The war had already begun, and Kefreyt had not come for a photograph."
 STP_ARMY_KEFREYT_PENDING: "\nKefreyt has agreed to help: §Y3 volunteer divisions are being assembled§!. They have not yet been paid for or added to our army; we must hold Abilia for them to arrive."
 STP_cw_renew_kefreyt_request: "Resume Negotiations with Kefreyt"
 STP_cw_renew_kefreyt_request_desc: "Request three volunteer divisions again after a refusal. If Kefreyt agrees, it will assign a ready contingent or begin assembling one. Negotiations may be repeated after 30 days."
 ADISCORD_STP_pc.1.t: "The List Grows"
 ADISCORD_STP_pc.1.d: "The service is already recording the addresses of printing houses and safe houses. This is not an arrest yet, but the threshold has been named."
 ADISCORD_STP_pc.1.a: "Keep the network quiet"
 ADISCORD_STP_pc.2.t: "The Night List"
 ADISCORD_STP_pc.2.d: "From ninety to ninety-nine, the names are already on the list. Suspicion can still be reduced while the scale remains below one hundred. At one hundred, arrest follows immediately; lowering the scale afterwards will not undo an arrest that has already taken place."
 ADISCORD_STP_pc.2.a: "Continue"
 ADISCORD_STP_pc.3.t: "Arrest"
 ADISCORD_STP_pc.3.d: "They did not need to look for the name on the form twice. It had been entered on the night list alongside printing-house addresses and keys to school basements. By morning, the highlands were still arguing over whether it was true, while in Fada the inner courtyard had already been sealed.\n\nShabrat was taken alive. The Party neither declared him dead nor offered a bargain. For the apparatus, it was enough that the man who called Ivanov a transaction could no longer move freely.\n\nThe network did not disappear with him. What disappeared was the one person who could speak for all of it."
 ADISCORD_STP_pc.3.a: "Transfer command to Sotnikov"
 ADISCORD_STP_pc.3.a_tt: "Sotnikov takes over the resistance. He does not become the leader of the Party's STP."
 ADISCORD_STP_pc.3.b: "Maintain the network under Gornin's protocol"
 ADISCORD_STP_pc.3.b_tt: "Gornin is introduced as a contender. He does not become the leader of the Party's STP."
 ADISCORD_STP_pc.4.t: "Steland Hegemony"
 ADISCORD_STP_pc.4.d: "The councils were still in session when the decree was already on the desk. It contained no mention of an 'empire'. Its terms were simpler: Steland would no longer fit its survival around someone else's calendar, and disputed districts would no longer have the right to halt an order.\n\nSome of the victors recognised the highlands' old fear in it: that the Party would be followed by a new master with a local name. Others recognised what they had awaited since the first day of war: a country that spoke first again.\n\nThere is no way back across this threshold. Whoever follows Shabrat will inherit the system, not the right to choose another one on his behalf."
 ADISCORD_STP_pc.4.a: "Confirm the course"
 ADISCORD_STP_pc.5.t: "Freedom against Slavery"
 ADISCORD_STP_pc.5.d: "The charter did not promise peace. It promised something else: the army would not appoint district authorities, a district would not decide on war, and war would not abolish the expiry of emergency powers.\n\nNo one placed Shabrat's suitcase by the door. They placed him within a framework in which his word carried the greatest weight - until the assembly decided otherwise.\n\nThis offered no shelter to the neighbours. A regime that treated a person as merchandise or a contract company remained an enemy. What changed was what Steland had the right to become after victory on foreign soil: a master or an ally."
 ADISCORD_STP_pc.5.a: "Sign the charter"
 ADISCORD_STP_pc.6.t: "Headquarters Takes Over the Resistance"
 ADISCORD_STP_pc.6.d: "Sotnikov does not take the Party's seat. He takes over the resistance's chain of command, and only that."
 ADISCORD_STP_pc.6.a: "Accept command"
 ADISCORD_STP_pc.6.a_tt: "Command passes to Sotnikov on the resistance side."
 ADISCORD_STP_pc.7.t: "The Seal Can Be Passed On"
 ADISCORD_STP_pc.7.d: "The course is already fixed. Only the person who speaks for the country will change."
 ADISCORD_STP_pc.7.a: "Keep the successor"
 ADISCORD_STP_pc.7.b: "Bring Shabrat back"
 ADISCORD_STP_pc.7.c: "Hand over to Gornin"
 ADISCORD_STP_pc.7.da: "Hand over to Tikh"
 ADISCORD_STP_pc.8.t: "Death of the Founder"
 ADISCORD_STP_pc.8.d: "Shabrat is dead. There is no resurrection. The seal remains with whoever already holds office."
 ADISCORD_STP_pc.8.a: "Continue without him"
 ADISCORD_STP_pc.9.t: "The Reckoning with Kefreyt"
 ADISCORD_STP_pc.9.d: "This is not a debt for past assistance. It concerns the corridor, depots or core territories Kefreyt currently holds."
 ADISCORD_STP_pc.9.a: "Present the claim"
 ADISCORD_STP_pc.9.b: "Accept the terms"
 ADISCORD_STP_pc.9.c: "Refuse"
 ADISCORD_STP_pc.10.t: "The Post-war Mandate"
 ADISCORD_STP_pc.10.d: "The war in Steland has ended, but Nodrul's capital does not regard its outcome as final. A note has been delivered to the new government: a change of power does not cancel earlier claims and obligations.\n\nThe statement leaves the question of Nodrul's mandate open. It contains neither an order to the troops nor instructions to dispatch weapons; the dispute is becoming a diplomatic crisis to which Steland must respond."
 ADISCORD_STP_pc.10.a: "The mandate remains in force."
 STP_pc_nod_crisis_opened_tt: "Steland's post-war crisis with Nodrul has begun. The response depends on the chosen political course. This statement does not, by itself, declare war or send weapons."
 ADISCORD_STP_pc.11.t: "An Independent Government"
 ADISCORD_STP_pc.11.d: "The package will be agreed locally. Refusal leaves the same leaders in place, without a cosmetic change or an alliance."
 ADISCORD_STP_pc.11.a: "Accept the package"
 ADISCORD_STP_pc.11.b: "Refuse"
 ADISCORD_STP_pc.12.t: "Emergency Decree"
 ADISCORD_STP_pc.12.d: "The decree is already on the desk. The course need not be finalised yet, but the powers have already been defined."
 ADISCORD_STP_pc.12.a: "Keep the decree"
 ADISCORD_STP_pc.13.t: "Gornin's Protocol"
 ADISCORD_STP_pc.13.d: "Gornin already handled the cabinet's paperwork. Now he is being named as a contender, not merely a minister."
 ADISCORD_STP_pc.13.a: "Add him to the list"
 ADISCORD_STP_pc.14.t: "Tikhoreva's Register"
 ADISCORD_STP_pc.14.d: "The archive is opening as an institution. Tikh joins as custodian of the records, not as head of state."
 ADISCORD_STP_pc.14.a: "Open the register"
 ADISCORD_STP_pc.15.t: "Nodrul Responds"
 ADISCORD_STP_pc.15.d: "Nodrul's note arrived after the civil war had ended. Its authors refuse to regard the new government's victory as a final settlement of earlier obligations and maintain their claims to influence in Steland.\n\nFor now, no military order has followed these words. The government must determine its response within the chosen political course; the note itself does not start another war."
 ADISCORD_STP_pc.15.a: "Take note"
 ADISCORD_STP_pc.16.t: "Where Will the Capital Be?"
 ADISCORD_STP_pc.16.d: "Victory returned the country to Shabrat, but left the question of its centre unsettled. During the uprising the resistance government worked from Abiliya. Orders were printed there, the first taxes of the new regime were collected there, and the columns that later entered Fada were assembled there. For many of Shabrat's supporters, Abiliya has again become what it was before the age of the party state: the historic capital of Steland.\n\nFada, however, remains the largest city in the country and the former centre of the state apparatus. Its districts already contain ministry buildings, archives, communications hubs and transport infrastructure designed to govern the whole country. Returning the government there would make administration easier, but it would also tie the new regime to the place from which Ivanov ruled.\n\nTwo draft decrees now lie on Shabrat's desk. One confirms Abiliya as the capital. The other returns the government to Fada."
 ADISCORD_STP_pc.16.a: "The capital will remain in Abiliya"
 ADISCORD_STP_pc.16.b: "The government will move to Fada"
 ADISCORD_STP_pc.11.c: "Conclude without a package"
 STP_pc_liberation_package_accept_tt: "The package is accepted. The local government remains in office, the previous dependency is formally ended, and the country receives the corresponding postwar status."
 STP_pc_liberation_package_refuse_tt: "The package is rejected. The current government and status remain in place without an imposed regime change."
 STP_pc_after_victory: "The Government of Victory"
 STP_pc_after_victory_desc: "The capital has been taken, but a united state still has to be assembled. We will approve a common reconstruction plan. Civilian services, industry and the army will require separate investments; a permanent cabinet and the country's political settlement will determine the choices that follow."
 STP_pc_count_ruins: "Survey the Destruction"
 STP_pc_count_ruins_desc: "First, we must establish what survived. A survey of roads and houses will show which core territories remain in Kefreyt's hands and where the economy can still be repaired."
 STP_pc_war_ledgers: "Wartime Obligations"
 STP_pc_war_ledgers_desc: "We will collect the agreements, receipts and promises made during the uprising. If Kefreyt supplied volunteers, a separate settlement can be made with it. Its plans along the border will still demand attention."
 STP_pc_name_steland: "Call the Country Steland"
 STP_pc_name_steland_desc: "The resistance no longer conceals its name. On maps and in correspondence, the country is once again called Steland."
 STP_pc_two_borders: "Two Borders"
 STP_pc_two_borders_desc: "The border service will study the deployment of Kefreyt's and Nodrul's forces. The cabinet must know where garrisons are simply rotating and where a new campaign is being prepared."
 STP_pc_army_from_resistance: "From Detachments to an Army"
 STP_pc_army_from_resistance_desc: "The detachments that took the mountain passes must be organised into permanent formations. A war with a neighbour does not cancel that task."
 STP_pc_army_field_count: "Field Accounting"
 STP_pc_army_field_count_desc: "Headquarters will count the rifles and men on the pass. A weapons shortage damages organisation before it changes the map."
 STP_pc_army_officers: "The Officer Corps"
 STP_pc_army_officers_desc: "Field commanders will learn a common staff language. If the founder has already been arrested, the safe-house network will be repaired separately."
 STP_pc_army_supply: "Supply the Passes"
 STP_pc_army_supply_desc: "Depots in Abilia or Hoskheit must supply the mountain formations, not just the capital's garrison."
 STP_pc_army_mountain: "Mountain Defence"
 STP_pc_army_mountain_desc: "We will incorporate the lessons of mountain warfare into the training of regular units. The defence of our own territory will gain a lasting advantage."
 STP_pc_army_against_heavy: "Against Heavier Forces"
 STP_pc_army_against_heavy_desc: "We will train anti-tank crews and open paid orders for infantry equipment and artillery. Command will be able to replenish stockpiles before the chosen campaign."
 STP_pc_army_limited_offense: "A Limited Offensive"
 STP_pc_army_limited_offense_desc: "Our staffs will practise an offensive with a limited objective and supply prepared in advance. A decision will allow a temporary boost to be activated when the army is ready to attack."
 STP_pc_army_hegemony_cadres: "Loyal Cadres"
 STP_pc_army_hegemony_cadres_desc: "Officer schools will train commanders for an army that supports the foreign policy of a strong centre."
 STP_pc_army_republic_control: "An Army under the Law"
 STP_pc_army_republic_control_desc: "The civilian government will control appointments. Trust in the army will grow, although coordinating plans will take longer."
 STP_pc_army_staff_doctrine: "General Staff Doctrine"
 STP_pc_army_staff_doctrine_desc: "The general staff will receive broad powers over planning and unit organisation. The cabinet will have to share political initiative with it."
 STP_pc_navy_reach_water: "Reach the Sea"
 STP_pc_navy_reach_water_desc: "We have no port of our own. Headquarters is preparing a plan for Fada and Hoskheit, but that will not produce ships."
 STP_pc_navy_coast: "Coastal Defence"
 STP_pc_navy_coast_desc: "We will establish a coastal command and train specialists to protect ports and coastal routes. Three restored escort ships and thirty transports will form the first flotilla. The staff will gain the means to plan naval invasions, while crews receive fuel for their first operations."
 STP_pc_navy_ports: "Bring the Ports under Oversight"
 STP_pc_navy_ports_desc: "The port service will organise cargo inspections and depot protection. Smuggling channels must no longer offer foreign agents an open door."
 STP_pc_navy_lanes: "Protect the Sea Lanes"
 STP_pc_navy_lanes_desc: "Research into coastal craft and escorts. Battleships are not part of the programme."
 STP_pc_navy_yards: "Affordable Shipbuilding"
 STP_pc_navy_yards_desc: "We will expand ship-repair facilities in one of our controlled ports. Two dockyards will support a permanent naval programme. Another three escort ships and thirty transports will enter service with a fuel reserve to cover the landing route and supply the bridgehead."
 STP_pc_navy_escorts: "Escort Duty"
 STP_pc_navy_escorts_desc: "We will train crews to escort transports and coordinate naval operations with shore services. Two restored early-series cruisers will form the core of the force. Escorts will screen them against light ships, while cruiser guns support the landing. A fuel reserve will cover the opening operation; continued supply remains our responsibility."
 STP_pc_navy_deny: "Deny the Enemy Fleet"
 STP_pc_navy_deny_desc: "We will fortify the coastline and strengthen the ports' anti-air defences. The enemy will have to fight for a landing before it reaches the mountain roads."
 STP_pc_navy_heg_inspection: "Inspect the Clients"
 STP_pc_navy_heg_inspection_desc: "A dependency spirit binds the client's port. Inspections increase resistance, but do not replace the leader."
 STP_pc_navy_lib_no_basing: "Their Port Is Not Ours"
 STP_pc_navy_lib_no_basing_desc: "A permanent base in an ally's territory requires its consent. Violating that rule breaks the coalition."
 STP_pc_navy_staff: "Coastal Shipping under Staff Direction"
 STP_pc_navy_staff_desc: "Military escorts take priority over merchant routes. This does not unlock general-staff focuses for Barchel."
 STP_pc_air_crews: "Aircrew Cadres"
 STP_pc_air_crews_desc: "We will train pilots, mechanics and controllers. New research will allow us to choose an aircraft the country can maintain on its own."
 STP_pc_air_fields: "Airfields"
 STP_pc_air_fields_desc: "We will prepare an airfield for two new air groups and conduct staff exercises. Construction will take place in a controlled region where the base can still be expanded."
 STP_pc_air_shield: "Shield the Skies"
 STP_pc_air_shield_desc: "We will strengthen ground-based air defence and accelerate fighter development to protect our cities and mountain passes."
 STP_pc_air_support: "Support the Troops"
 STP_pc_air_support_desc: "We will coordinate aviation with ground units. New aircraft must help the army where mountain roads cannot carry heavy artillery."
 STP_pc_air_recon: "Reconnaissance over the Passes"
 STP_pc_air_recon_desc: "Fifteen intelligence points on both neighbours and a decision to repeat the sortie."
 STP_pc_air_import: "Orders for Private Aircraft Suppliers"
 STP_pc_air_import_desc: "We will unlock a repeatable purchase of one hundred basic fighters for 120 treasury units. The focus itself prepares the procurement arrangements; money is deducted only when the decision is selected."
 STP_pc_air_domestic: "Domestic Assembly"
 STP_pc_air_domestic_desc: "We will expand military production and prepare our own aviation programme. A new factory and two research bonuses will reduce dependence on foreign supplies."
 STP_pc_air_heg_pressure: "Air Power as Pressure"
 STP_pc_air_heg_pressure_desc: "A strike against a hub as an ultimatum. This is not liberation."
 STP_pc_air_lib_rules: "Do Not Strike an Ally"
 STP_pc_air_lib_rules_desc: "Strikes on a partner's hubs are forbidden. The coalition rests on this rule."
 STP_pc_air_staff: "Reconnaissance before Gestures"
 STP_pc_air_staff_desc: "The directorate strengthens reconnaissance rather than staging a demonstrative raid."
 STP_pc_shabrat_cabinet: "The Founder's Cabinet"
 STP_pc_shabrat_cabinet_desc: "Victory gave the country a name, but its departments are still empty. We will appoint the people who ran the districts, depots and safe houses during the war. The alliance will receive a permanent name, and the ministries will cease to be vacant posts."
 STP_pc_shabrat_politics: "The Founder's Politics"
 STP_pc_shabrat_politics_desc: "Victory brought together people with different visions of the future. Shabrat must decide whether to become the arbiter of a strong centre or the guarantor of independent civilian institutions."
 STP_pc_hegemony_open: "Steland Hegemony"
 STP_pc_hegemony_open_desc: "We will concentrate political initiative in the government. Some supporters of district autonomy will withdraw, but the cabinet will be able to prepare a common course more quickly."
 STP_pc_freedom_open: "Freedom against Slavery"
 STP_pc_freedom_open_desc: "We will recognise the district councils' and assembly's right to influence decisions. Coordination will take time, but the new government will gain broader support."
 STP_pc_shared_archive_policy: "An Archive, Not a Sentence upon the Country"
 STP_pc_shared_archive_policy_desc: "We will open the archives to researchers and the commission investigating the old regime's crimes. Working with these documents must become a permanent service, not an extension of personal vengeance."
 STP_pc_heg_unity: "Unity of the Victors"
 STP_pc_heg_unity_desc: "The council under Shabrat loses its veto over appointments. This decree does not revoke the guarantees to the SRP."
 STP_pc_heg_emergency: "Emergency Powers"
 STP_pc_heg_emergency_desc: "We will grant industry emergency powers for 180 days. Military output and war support will rise, along with administrative expenditure."
 STP_pc_heg_subordinate: "Subordinate the Centres of Power"
 STP_pc_heg_subordinate_desc: "District commissioners will answer to the government. A single chain of decisions will reduce administrative costs and expand recruitment capacity."
 STP_pc_heg_limit_parties: "Limit Political Competition"
 STP_pc_heg_limit_parties_desc: "We will concentrate political activity within registered organisations. This will strengthen the government's initiative, but narrow the scope for independent research."
 STP_pc_heg_lock: "The Course Is Set"
 STP_pc_heg_lock_desc: "We will commit to a strong centre and regional primacy. Shabrat will remain in charge, and the civilian republican path will close."
 STP_pc_heg_person: "The Founder's Name in Law"
 STP_pc_heg_person_desc: "We will make the founder the final authority in disputes between departments and districts. His standing will accelerate the work of the political apparatus."
 STP_pc_heg_regional_system: "A Regional System"
 STP_pc_heg_regional_system_desc: "We will prepare industry for permanent external commitments. Greater utilisation of military factories will require a more expensive administrative apparatus."
 STP_pc_heg_val_audit: "The Reckoning with Kefreyt"
 STP_pc_heg_val_audit_desc: "We will review the terms of Kefreyt's contracts and prepare the government's position for negotiations over a new border settlement."
 STP_pc_heg_val_terms: "Political Guarantees from Kefreyt"
 STP_pc_heg_val_terms_desc: "We will ask Kefreyt to recognise Steland's political primacy. It may accept or refuse. Refusal leaves military preparations available; war will not begin without a separate order."
 STP_pc_heg_val_force: "Plan the Mountain Campaign"
 STP_pc_heg_val_force_desc: "Following Kefreyt's refusal, headquarters will draw up a campaign plan. First, we must fund 35 days of supply preparation, then decide within 90 days whether to launch the offensive. Kefreyt will receive a warning and time to prepare its defence."
 STP_pc_heg_nod_break: "Challenge the Northern Mandate"
 STP_pc_heg_nod_break_desc: "We will ask Nodrul to recognise a reversal of the relationship: henceforth, decisions in the region will require Steland's consent. Refusal does not start a war automatically."
 STP_pc_heg_nod_force: "Plan the Northern Campaign"
 STP_pc_heg_nod_force_desc: "Following Nodrul's refusal, we will prepare supplies and reconnaissance for the northern front. A separate programme will take 35 days and require funding. The order to go to war will remain the government's decision."
 STP_pc_heg_clients: "Dependent Governments"
 STP_pc_heg_clients_desc: "We will bring neighbours that recognise our primacy into a regional league. Only governments which have already accepted the relevant terms will join."
 STP_pc_heg_burden: "The Price of Primacy"
 STP_pc_heg_burden_desc: "We will establish a permanent apparatus to coordinate external forces. The army will gain better organisation at the cost of additional administrative expenditure."
 STP_pc_lib_assembly: "Assembly of the Districts"
 STP_pc_lib_assembly_desc: "Laws will pass through the assembly. Shabrat remains head of state, but loses some of his day-to-day influence."
 STP_pc_lib_institutions: "Independent Institutions"
 STP_pc_lib_institutions_desc: "We will establish an independent judiciary and a permanent representative chamber. Predictable rules will lower administrative expenditure and support research."
 STP_pc_lib_civil_army: "The Army Answers to Civilians"
 STP_pc_lib_civil_army_desc: "The government will receive the right to approve military commanders. If Sotnikov is available, his experience will be retained in a civilian defence council."
 STP_pc_lib_lock: "The Charter Is Established"
 STP_pc_lib_lock_desc: "We will secure civilian rule and the independence of representative institutions. Shabrat remains head of state, but the hegemonic path closes."
 STP_pc_lib_competition: "Political Competition"
 STP_pc_lib_competition_desc: "We will open political competition within the new order. Gornin and Tikh will be able to present their programmes before a possible transfer of power."
 STP_pc_lib_succession: "Power That Can Be Passed On"
 STP_pc_lib_succession_desc: "Shabrat will choose between continuing to lead and transferring power to one of the nominated civilian successors."
 STP_pc_lib_emergency_limit: "Emergencies Have an Expiry Date"
 STP_pc_lib_emergency_limit_desc: "We will define the limits of emergency mobilisation. During war, a temporary reserve call-up may be declared separately at a cost in command power."
 STP_pc_lib_prepare_neighbors: "Political Preparation in the Neighbouring States"
 STP_pc_lib_prepare_neighbors_desc: "We will establish a permanent service to monitor our neighbours. For a separate payment, it will be able to update intelligence on their armed forces."
 STP_pc_lib_local_contacts: "Talk to Those beyond the Border"
 STP_pc_lib_local_contacts_desc: "We will establish links with civilian groups and specialists in neighbouring countries. Economic intelligence will help the government assess the consequences of intervention."
 STP_pc_lib_crisis: "The Intervention Crisis"
 STP_pc_lib_crisis_desc: "A stronger border service and a reserve of command power will allow us to face an open crisis prepared. This step does not yet declare war."
 STP_pc_lib_war: "War of Liberation"
 STP_pc_lib_war_desc: "Open border crises will be settled by war with the neighbour concerned. If crises with Kefreyt and Nodrul are active at the same time, we will have to fight on two fronts. A war already under way will receive the same plan for a post-war settlement."
 STP_pc_lib_transition: "Transitional Administration"
 STP_pc_lib_transition_desc: "We will fund a temporary administration and offer defeated neighbours a transitional agreement. The political outcome depends on their response."
 STP_pc_lib_independent_gov: "An Independent Government"
 STP_pc_lib_independent_gov_desc: "The transitional commissions are concluding their work. Instead of permanently supervising our neighbours, the cabinet will concentrate on civilian construction and reduce administrative expenditure."
 STP_pc_lib_coalition: "A Coalition of Equals"
 STP_pc_lib_coalition_desc: "We will bring governments that accepted the terms of liberation into a defensive coalition. Every participant must confirm its choice."
 STP_pc_sot_chain: "The Chain of Command"
 STP_pc_sot_chain_desc: "Without the political founder, headquarters assumes responsibility for coordinating scattered units. A unified chain of orders will restore control."
 STP_pc_sot_field: "Field Commanders"
 STP_pc_sot_field_desc: "Sotnikov will use the experience of field commanders to accelerate operational preparation."
 STP_pc_sot_regions: "District Formations"
 STP_pc_sot_regions_desc: "The districts provide men to headquarters, not to the council."
 STP_pc_sot_state: "The Staff State"
 STP_pc_sot_state_desc: "The administration answers to the chain of command, not the assembly."
 STP_pc_sot_two_threats: "Two Threats, One Headquarters"
 STP_pc_sot_two_threats_desc: "Intelligence will assess Nodrul's and Kefreyt's forces. A change of commander does not erase the information or the common task of defence."
 STP_pc_sot_limits: "The Limits of Military Rule"
 STP_pc_sot_limits_desc: "A directorate for 180 days. Sotnikov only."
 STP_pc_sot_shabrat_question: "The Living Founder"
 STP_pc_sot_shabrat_question_desc: "We will determine the place of the former political leadership in the new order."
 STP_pc_sot_keep_command: "The Directorate Remains"
 STP_pc_sot_keep_command_desc: "We will formalise the military directorate's authority and its responsibility for national defence."
 STP_pc_sot_transfer: "Transfer of the Seal"
 STP_pc_sot_transfer_desc: "We will open the transfer of power to one of the civilian successors already introduced."
 STP_pc_sot_val_defense: "No Kefreyt Depots"
 STP_pc_sot_val_defense_desc: "Defence and withdrawal, not hegemony."
 STP_pc_sot_nod_watch: "No Return for Nodrul's Advisers"
 STP_pc_sot_nod_watch_desc: "A border regime without client status."
 STP_pc_gornin_charter: "The Protocol Becomes Law"
 STP_pc_gornin_charter_desc: "Gornin will formalise the procedures of civilian institutions and reduce administrative expenditure."
 STP_pc_vera_lists: "The Register before the Banner"
 STP_pc_vera_lists_desc: "Tikh will investigate the former regime's connections. Political independence will grow, but inspections of enterprises will temporarily disrupt production."
 STP_pc_after_victory_tt: "The victors' coalition holds together until a course is fixed: §G+5%§! stability, §R-3%§! organisation."
 STP_pc_count_ruins_tt: "Shows which STP/STS core territories Kefreyt still holds."
 STP_pc_name_steland_tt: "The country receives the cosmetic name Steland."
 STP_pc_army_register_tt: "A temporary register until the republic's permanent army focus is completed."
 STP_pc_navy_reach_water_tt: "There is no port. This focus does not build ships."
 STP_pc_navy_heg_inspection_tt: "Inspections maintain the client spirit and increase resistance."
 STP_pc_navy_lib_no_basing_tt: "A permanent base in an ally's territory requires its event response first."
 STP_pc_air_import_tt: "Procurement without new debt if Kefreyt's shipment has already arrived."
 STP_pc_air_heg_pressure_tt: "A strike against a hub as an ultimatum."
 STP_pc_air_lib_rules_tt: "Strikes against a partner's hubs are forbidden."
 STP_pc_founder_rules: "The founder is in power"
 STP_pc_named_successor_rules: "The course's designated successor is in power"
 STP_pc_course_continues: "The founder or a designated successor maintains the course"
 STP_pc_hegemony_continues: "Hegemony is led by the founder or a successor to the established course"
 STP_pc_freedom_continues: "The charter is upheld by the founder or a successor to the established course"
 STP_pc_shabrat_politics_tt: "Consolidating hegemony and adopting the freedom charter are points of no return."
 STP_pc_hegemony_open_tt: "Opens Steland Hegemony. Does not change ideology."
 STP_pc_freedom_open_tt: "Opens Freedom against Slavery. Does not change ideology."
 STP_pc_shared_archive_policy_tt: "Introduces Vera Tikh if the archive has not already named her."
 STP_pc_heg_regional_system_tt: "A framework for the neighbours outside the diplomatic interface."
 STP_pc_heg_val_audit_tt: "If the issue has not yet been raised, the cabinet will receive information about Kefreyt's claims. Treaty terms will be offered by the next focus; refusal does not, by itself, start a war."
