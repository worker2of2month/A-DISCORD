 ADISCORD_STP_pc.100.t: "Letters No Longer Read Aloud"
 ADISCORD_STP_pc.100.d: "The chancellery had accumulated letters from men whose signatures Shabrat remembered from wartime reports. They wrote about different things: a dismissed commissioner, a closed meeting, a warehouse transferred to someone from the capital. Each letter ended with the same question: when would anyone consult them again?\n\nThe secretary suggested a separate file. That would make the correspondence easier to track.\n- And the answers? Shabrat asked.\n- We could prepare a common reply.\n\nShabrat traced the name of a commander who had once held a mountain pass without orders. Back then, independence had been called initiative. Now a note about a breach of procedure was attached to the man's letter.\n- A separate file, he said. But show me the list first."
 ADISCORD_STP_pc.100.a: "Leave the file here."
 ADISCORD_STP_pc.101.t: "The Last Signature"
 ADISCORD_STP_pc.101.d: "One space remained blank on the appointment order. The district assembly and personnel commission had already signed; a resolution from the founder was now required above them.\n\nThe district envoy recalled that the candidate had been chosen at a general meeting. Shabrat asked who would answer if the man disrupted deliveries. The envoy named the council.\n- A council consists of many people, Shabrat replied. An order needs one signature.\n\nA second list was placed on the desk. None of these people had been elected in the districts, but the chancellery vouched for every one. The assemblies could retain the right to nominate candidates while the founder kept final approval. Or there could simply be one list."
 ADISCORD_STP_pc.101.a: "Use the chancellery's list."
 ADISCORD_STP_pc.102.t: "To Whom They Swear"
 ADISCORD_STP_pc.102.d: "The commanders received the new oath with an order fixing the ceremony date. Shabrat's name stood where the text had once referred to a government created by a common victory.\n\nNobody at the meeting disputed his achievements. The objection concerned something else: would promises of pay, care for the wounded and the return of soldiers to their homes remain binding? Or would personal loyalty allow every obligation to be postponed again?\n- Loyalty cannot be made of qualifications, said the chancellery secretary.\n- Service cannot be made of promises alone, came the reply.\n\nShabrat could approve the text unchanged and demand immediate obedience. Or he could spend political capital on a separate commitment to the army, one the commanders could hold him to after the ceremony."
 ADISCORD_STP_pc.102.a: "Take the oath without qualifications."
 ADISCORD_STP_pc.103.t: "In the Margins of the Anniversary Edition"
 ADISCORD_STP_pc.103.d: "The editor brought the corrected proofs. The account of a garrison changing sides had lost the negotiator's name. The story of winter supplies no longer mentioned the council that found the grain. Between the paragraphs appeared a sentence about the founder's common design.\n\nAn ageing correspondent placed an old newspaper beside the proofs. In the wartime edition, Shabrat thanked the very people whose names had now been crossed out.\n- Back then we had to bring the country together, the editor said.\n- And now?\n- Now it needs a common history.\n\nThe correspondent took back the old issue. He made no further corrections. The printer received permission to proceed the next morning; several former underground organisers stopped bringing their recollections to the editorial office."
 ADISCORD_STP_pc.103.a: "Send the edition to print."
 ADISCORD_STP_pc.104.t: "No Expiry Date"
 ADISCORD_STP_pc.104.d: "The lawyer read the new law twice. Its powers were listed in detail: appointments, binding orders, arbitration between institutions. No expiry date was given.\n\nHe asked whether an annual report on the continuation of the mandate should remain. The founder would still decide, but the districts could ask questions and demand answers on the record.\n- That would suggest authority begins again every year, the secretary objected.\n- Or remind us why it was granted.\n\nBeside Shabrat lay the original wartime agreement. It contained fewer powers and more signatures. The new sheet was ready to be submitted."
 ADISCORD_STP_pc.104.a: "Permanent powers need no renewal."
 ADISCORD_STP_pc.105.t: "They Too Were Called Victors"
 ADISCORD_STP_pc.105.d: "Seats had been reserved for correspondents. Excerpts from the open letter were read to the defendants: a demand to restore the assemblies' voice, a reminder that emergency powers were temporary, a request to publish chancellery expenses. The indictment called it an attempt to divide the state.\n\nOne veteran asked to read the letter in full. The chairman told him to answer only the questions put to him. A photograph of the victory assembly hung behind the chairman; the defendant stood in its front row.\n\nThe government had already secured its public demonstration of supremacy. Dismissals and a ban on political activity remained to be confirmed. Commuting the sentence would mean retreating before its own press, but some former comrades would still recognise the gesture."
 ADISCORD_STP_pc.105.a: "Confirm the dismissals and political ban."
 ADISCORD_STP_pc.106.t: "Blank Lines in the Minutes"
 ADISCORD_STP_pc.106.d: "The invitation mentioned a discussion of personnel matters. The minute-taker was told to wait outside. Unsigned resignation letters lay on the desk.\n\nAn old commissioner read his letter and remarked that he had never requested retirement on health grounds. The secretary offered another wording. Shabrat remained silent while they argued over the words.\n- Your families will not be left without support, he finally said. And there will be no accusations in the newspapers.\n\nTheir departure could be financed through permanent honorary positions in the administration. Or political capital could secure a separate agreement without creating recurring expenses. Either way, the former allies would leave the office without the right to reopen the dispute."
 ADISCORD_STP_pc.106.a: "Retain honorary positions and their upkeep."
 ADISCORD_STP_pc.107.t: "One Signature beneath a Common Victory"
 ADISCORD_STP_pc.107.d: "The final session approved a procedure under which the founder's decisions no longer required the old council's consent. The prepared text passed without amendments. Several seats were empty; the new commissioners looked towards Shabrat before raising their hands.\n\nAfter the session, the plaque bearing the collective leadership's name was taken down. The old chairs remained in the waiting room, but people now waited for permission to enter, not for a common meeting to begin.\n\nThe veterans' letters had not disappeared. The institution that could turn their resentment into a binding question for government had. Shabrat signed the first decree under the new procedure. There was room for one name at the bottom of the sheet."
 ADISCORD_STP_pc.107.a: "Send the decree for implementation."
 ADISCORD_STP_pc.101.b: "The districts nominate; I approve."
 ADISCORD_STP_pc.102.b: "Put our obligations to the army in writing."
 ADISCORD_STP_pc.104.b: "Retain an annual public report."
 ADISCORD_STP_pc.105.b: "Commute the sentence to removal from office."
 ADISCORD_STP_pc.106.b: "Negotiate departure without new permanent posts."
 ADISCORD_STP_pc.107.accepted: "At the final session, the old comrades still occupied their seats. They had retained access to the chancellery, the right to bring delegations and agreed terms for those who chose to leave. The new law contained no right to stop the founder's decisions.\n\nOne veteran asked for the old promises to remain in the minutes. Shabrat agreed. The secretary filed the list as an appendix that no longer required a separate vote.\n\nAfter the session they talked in the corridor, as they once had. Then each returned to his office. The common victory had kept its witnesses, but only one person could now dispose of it. Shabrat signed the first decree under the new procedure."
