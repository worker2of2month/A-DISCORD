 STP_pf_advisers_deal_tt: "§YNodrulian Advisers§!: influence up to §Y+5 percentage points§! (up to 60%, with other shares reduced proportionately), support §G+12§!. §YArmy Command§!: support §R-12§!. Support is bounded by 0-100; apparatus loyalty and faction effects are recalculated. At 60% influence or higher, no additional offices are transferred: only support changes."
