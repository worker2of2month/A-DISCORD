 STP_ps_val_send_supply: "Send Weapons to the Stelander Underground"
 STP_ps_val_send_supply_desc: "1200 rifles from actual stockpiles. Preparation takes 28 days; the first dispatch takes 35 days. Without a connected overland route, the cargo waits and does not appear at its destination. Before the split, the rifles remain in a district cache in Niansas; afterwards, they are delivered to STS. Interception transfers them to the Party."
 STP_ps_val_intelligence_cost: "£ADISCORD_economy_treasury_texticon §Y450§!"
 STP_ps_val_intelligence_cost_blocked: "£ADISCORD_economy_treasury_texticon §R450§!"
 STP_ps_val_intelligence_cost_tooltip: "£ADISCORD_economy_treasury_texticon §Y450§!"
 STP_ps_val_intelligence: "Investigate Kefreyt's Requisition"
 STP_ps_val_intelligence_work: "Investigate Kefreyt's Requisition - In Progress"
 STP_ps_val_intelligence_desc: "Identify the current shipment's route in 7 days. Interception then needs another 14 days and a separate payment. Start intelligence with at least 22 days remaining before departure. An unfinished order refunds its payment if the shipment disappears or changes."
 STP_ps_val_intelligence_work_desc: "450 treasury units reserved. The result is delivered only if the programme's conditions still hold; cancellation refunds the deposit once."
 STP_ps_val_intercept_cost: "£ADISCORD_economy_treasury_texticon §Y1200§!"
 STP_ps_val_intercept_cost_blocked: "£ADISCORD_economy_treasury_texticon §R1200§!"
