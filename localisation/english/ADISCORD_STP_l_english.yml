 STP_ps_emergency_cabinet_prepared: "Activate the Reserve Headquarters"
 STP_ps_emergency_cabinet_prepared_desc: "600 treasury units, 7 days. The prepared headquarters receives the government in a held district outside Fada. Reorganisation resumes from its saved duration. Once relocated, losing this district while the Congress remains lost defeats the party."
