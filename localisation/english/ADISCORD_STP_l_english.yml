 STP_party_services_delivered_tt:0 "The paid restoration of ministries has been completed."
 STP_party_industry_delivered_tt:0 "The paid port and industrial supply restoration has been completed."
 STP_party_district_consent_tt:0 "Borons support is at least 50, or 35 with the prewar district compact. Faction negotiations can restore support."
 STP_party_central_consent_tt:0 "Security Service support is at least 50, or 35 with prewar emergency commissioners. Faction negotiations can restore support."
 STP_party_commercial_consent_tt:0 "Merchants support is at least 45. Negotiating with them reduces Security Service support."
 STP_party_military_consent_tt:0 "Army Command support is at least 45. Negotiating with it reduces Nodrul advisers support."
 ADISCORD_STP_pc.26.b:0 "Fund a permanent economic secretariat for the congress."
 ADISCORD_STP_pc.27.b:0 "Fund a permanent departmental oversight commission."
 STP_party_settlement_26_tt:0 "Pay 540 from the treasury. Borons and Merchants support: +8; Security Service: -12. Faction influence and the district settlement remain unchanged."
 STP_party_settlement_27_tt:0 "Pay 540 from the treasury. Security Service and Conservatives support: +8; Borons: -12. Faction influence and the central administration remain unchanged."

 ADISCORD_STP_cw.80.frontier_subject:0 "The Northern Defence Alliance has been crushed. Nodrul has abolished the government of the Cult of the Children of the Forest and installed a dependent administration within Yuboria's historical borders. The Free Frontier has capitulated; it keeps its statehood, but now under Nodrul's rule.\n\nNew dependent states and lands under direct Nodrul administration have appeared in the north. Local institutions must comply with the victor's terms, and Nodrul's command can move the freed-up troops south."

# Campaign briefing
 STP_startup_region:0 "§YEASTERN FORUL: STELANDER'S SURROUNDINGS§!\n\nThe situation at the beginning of 2160.\n\n§YNodrul: patron and rule-maker§!\nThe Fad Pact ended Workerland's bombing, but tied Stelander to Nodrul. Advisers, foundations, media and party schools embedded this dependence in everyday government. To Nodrul, a stable neighbouring regime means preserving its own influence; an independent Stelander challenges that entire arrangement.\n\n§YKefreyt: weapons and obligations§!\nKefreyt's factories and mercenary companies allow it to intervene in foreign crises. Solgalov has an interest in guarding mountain passes, supplying arms and securing resource concessions. His assistance carries a price: weapons arrive with agreements that may outlive the government that signed them.\n\n§YWorkerland: the memory of war§!\nThe former enemy remains a guarantor of the system established after the Fad Pact. Yet the confederation is exhausted and divided over its own institutions. Stelander depends on agreements whose strength is determined beyond its borders.\n\n§YThe east beyond the major capitals§!\nEflor defends territorial unity, Yubor organises power around production, and Bezhaysk retains its crown and separate estates. Forest communities and the Free Frontier defend local autonomy. Trade connects the region, but its societies disagree deeply about authority and security."
 STP_startup_country:0 "§YSTELANDER IN 2160§!\n\n§YSteland of the mountain alliances§!\nBefore it became a country of resorts, Steland lived through generations of war. Mountain alliances held the passes, while residents endured mobilisation, shortages and Vorkerland's air raids. Old oaths bound communities in resistance to an external enemy but promised no end to the bloodshed. More and more families wanted, above all, a winter without bombing.\n\n§YPyotr Ivanov and the High Houses§!\nThe new order came from Nodrul. There, wealthy houses and privileged guilds overthrew the old elite, promising less austerity and greater personal freedom. Money, agitators, creditors and political brokers followed that idea into exhausted Steland. Some local nobles and port owners backed the change, hoping to preserve their property and return to peaceful trade.\n\nPyotr Ivanov tied this change of power to national salvation. The Fada Pact stopped the raids and opened roads and harbours. People raised under air-raid sirens recognised him as the Father of Peace. The Chamber of High Houses and Privileged Guilds established itself around him.\n\n§YThe price of peace§!\nSome mountain alliances were disarmed; trade and resource obligations became treaty commitments. Nodrul gained access to the country's laws, appointments, credit and political institutions. Stelander kept its flag and government but became a dependent shadow state. Peace was real; so was the order in which foreign patronage protected local elites.\n\n§YThe resort order§!\nOver twenty years, the legal nectar trade became one of the most profitable industries. Houses received licences, guilds controlled supplies, and the treasury collected taxes. Casinos, promenades and resorts became the face of the new Stelander. The party retained its monopoly on power alongside broad private freedoms, while memories of war justified silence about the price of tranquillity.\n\nIn the mountains, villages remained unrepaired and schools closed. The Lower Market tied human trafficking to connections within the state apparatus. The capital's prosperity did not become the whole country's experience.\n\nStaffing policy reinforced this dependence. The houses found it cheaper to hire engineers, lawyers and managers from Nodrul and the southern republics than to train local people. A visiting specialist depended on a contract; a local worker on the employer. Alongside school closures, this eroded the country's ability to pass on its own knowledge.\n\n§YMaksim Shabrat§!\nBy 2160, resistance to this order had gathered around Shabrat. His network linked district activists, officials, miners, former soldiers and part of the officer corps. Ivanov is gravely ill, but the system built under him still functions. Stelander enters a new era with two incompatible memories of the same peace: deliverance from bombs and the loss of self-determination."
 STP_startup_guide:0 "§YECONOMY AND FIRST STEPS§!\n\n§Y1. Choose an affordable programme.§! After choosing a side, read its decisions, deadlines and prices. You are not expected to finish every opening focus before the crisis develops. Leaving a useful focus unfinished can be the price of completing a more important preparation.\n\n§Y2. Open the economy panel.§! The treasury is cash available now; the weekly balance is recurring cash flow. Compare income, government upkeep and upcoming operation payments. A one-off payment does not fix a persistent deficit; a positive balance does not mean you can afford a large order today.\n\n§Y3. Match borrowing to the deadline.§! Borrowing can fund an essential project before cash accumulates, but interest increases later expenses. Read the financial objective and its deadline, then compare saving time with the cost of credit. Do not tie up your entire reserve in construction when an inspection may soon need a response.\n\n§Y4. Technology should serve a purpose.§! Follow prerequisite lines. Industrial technologies may exchange higher output, construction or extraction for increased energy consumption. A permanent specialisation can close an alternative branch. Research is useful when your economy can employ its result.\n\n§Y5. Preserve manpower and weapons.§! Prepared brigades need real stocks; deployed troops need replacements and supplies. Compare the preparation report with your stores before the split. After changing sides, inspect the units and territory actually received, along with active missions.\n\nA practical order is to check finances and deadlines, choose districts, fund preparations and protect them from inspections. Political branches and special outcomes are covered under Paths."
 STP_startup_guide_history_title:0 "Preparation and deadlines"
 STP_startup_guide_history:0 "§YTHE CRISIS DOES NOT WAIT FOR YOUR FOCUS TREE§!\n\n§YWhere to find the deadlines§!\nAfter the introductory focuses and your choice of side, open §Y$STP_elections_in_the_party$§! in Decisions. Watch Ivanov's health, the vote and active missions. Leaving a focus unfinished does not stop the political crisis. Decisions take time of their own: add this to the duration of the focus that unlocks them.\n\n§YChoose a programme you can finish§!\nMilitary and political preparations share operation slots. If all slots are occupied, another operation must wait. Unlocking a decision is only the first step: pay for it and leave enough time for delivery. Finishing preparations in one important district is more useful than opening several programmes just before the split.\n\n§YWhat the election measures§!\nThe Party is on the left of the legitimacy balance, Shabrat on the right. Party suspicion is separate: strong public support does not conceal an underground network. The vote gives its winner a mandate and affects the division of territory and reserves, but an ordinary victory does not prevent armed conflict.\n\n§YA mandate is not readiness§!\nThe election result does not replace an agreement with the commanders, local administration or paid military preparations. Special political outcomes are explained under Paths. During preparation, check that each agreement remains intact and that there is time to complete your work.\n\nRead active missions before starting a long focus. An announced inspection, vote or external threat may require a response before it finishes."
 STP_startup_guide_nodrul_title:0 "Districts and army reserves"
 STP_startup_guide_nodrul:0 "§YWHAT YOU PREPARE IN THE DISTRICTS§!\n\n§YOpen the regional map§!\nInspect the decisions and status of the selected district. Administration, garrison contacts, a supply depot and sabotage produce different results. A district's colour indicates its expected side in the split; it does not prove that troops or weapons are ready.\n\n§YAs Shabrat§!\nStart with one or two districts you can hold. Connect civilian administration with local military support and supplies. Read the territorial transfer conditions: influence, a local agreement and military preparation cannot replace one another. A lost administration can be restored, but its period of uninterrupted work starts again.\n\n§YAs the Party§!\nCompare announced resistance operations with the loyalty of your apparatus and the condition of important districts. Inspections are useful where there is a network to uncover. Commission expenses compete with your own preparations; the same political resources cannot fund every direction at once.\n\n§YPaid projects occupy capacity§!\nShared slots limit parallel preparations, while local work can also occupy the district itself. Read each blocking condition: it may concern a slot, deadline, territorial control or an unfinished order. Arsenal construction uses one shared paid order; selecting another district does not bypass the wait.\n\n§YPlanned units and the actual army§!\nDistinguish planned formations from reserves already paid for in the preparation report. At the split, prepared units receive real manpower and weapons first, followed by the base armies. A nominal number of brigades does not guarantee full deployment. Keep resources for equipment and replacements, and finish essential work before the split."
 STP_startup_guide_party_title:0 "Inspections and cover"
 STP_startup_guide_party:0 "§YHOW TO ANSWER A PARTY COMMISSION§!\n\n§YThe timer belongs to one district§!\nRead the inspection mission, then open the responses on the regional map. The commission checks the local network and paid work still in progress. Waiting for construction to finish does not conceal it. Available responses depend on your focuses and contacts in that district.\n\n§YDelay buys time§!\nDelaying the commission grants 14 more days for §Y35§! £political_power_texticon. This does not protect the network by itself: use the extra time to prepare a response. A false trail needs 7 days before the inspection ends; its risk depends on suspicion when the commission finishes.\n\n§YConcessions protect different assets§!\nHanding over an official sacrifices the administration to preserve completed military contacts and stocks. Opening the registers preserves the administration at the expense of the military network. Each concession costs §Y25§! £political_power_texticon, shifts legitimacy towards the Party and stops local work until the inspection ends. Decide which local result matters most before choosing.\n\n§YDoing nothing also has consequences§!\nThe commission can destroy prepared contacts, supply arrangements and sabotage, and expose an administration or local agreement. An exposed network blocks local operations for 56 days. The mission lists the exact losses and exceptions: ratified agreements may receive separate protection.\n\n§YSuspicion is an ongoing cost§!\nBefore starting an operation, compare its benefit with the suspicion it adds and the next inspection. Lower suspicion helps future checks but does not cancel an active mission. As the Party, choose targets by local signs of preparation rather than map colour alone."
 STP_startup_guide_shabrat_title:0 "Economy and first steps"
 STP_startup_path_0_title:0 "The resistance"
 STP_startup_path_1_title:0 "Party course"
 STP_startup_path_0:0 "§YSHABRAT AND THE RESISTANCE§!\n\nThe resistance seeks power through public support, district organisation and military agreements. Votes alone are insufficient: administrations, commanders and prepared stockpiles must survive the split. Victory removes the common enemy, but opens the argument over the country's future.\n\n§YShabrat: republic and Charter§!\nVictory should restore the right to decide who governs. The district assembly limits emergency powers, the army answers to civilians and independent institutions prepare a transfer of power. Abroad, this course leads towards fighting dependency and slavery, independent neighbouring governments and a coalition of equals. Potential partners retain the right to refuse.\n\n§YShabrat: hegemony and empire§!\nThe founder retains authority to finish reconstruction and impose a new order on his neighbours. Personal power, unified command and expansion become the continuation of the revolution. This route leads to an empire, replacing the temporary mandate with the victor's permanent rule.\n\n§YSotnikov: resistance without Shabrat§!\nThe founder's arrest does not end the struggle. If Sotnikov remains available, he takes command of the resistance. Field commanders, district formations and a common staff become his foundations. After the war, the directorate must choose between permanent military rule and handing the seal to civilian leadership.\n\n§YCivilian successors§!\nGornin seeks to turn revolutionary decisions into durable institutions; Tikhorev represents another civilian succession option. Their accession depends on meeting the candidates and reaching the transfer events. A new leader inherits existing commitments.\n\nReveal the details for the political fork, limited revolt requirements and consequences of arrest."
 STP_startup_path_1:0 "§YTHE PARTY AFTER IVANOV§!\n\nThe Party must survive its founder's death, the country's split and the struggle over victory's inheritance. There is not enough time for every useful opening focus: choose key districts, protect the apparatus and prepare real troops. After the war, the question becomes who controls the state you preserved.\n\n§YCyan Crowe: the Chamber and old Houses§!\nConservatives rebuild order through property, agreements and established families. House debts must be settled, including whether common obligations bind the regime's patrons. The outcome may be a compact of equal obligations or a republic of old families.\n\n§YRufus Hedersett: the continuing festival§!\nRadicals promise to revive public life and build consent around pleasure. Laws, clubs, district festivals and medical bills reveal its cost. The route branches towards a carnival of open squares or an empire of privileged clubs.\n\n§YMilitary collegium: government under command§!\nThe army demands order, trained personnel and reliable supply. Reconstruction involves service, demobilisation and veterans' futures. The government can return the army to professional duties or make command a permanent part of republican government.\n\n§YPavel Lanskoy: a republic of contracts§!\nEconomic managers rely on trade, ports and paid production orders. Secure deliveries and decide who gains access to reconstruction. The choice lies between a market of independent workshops and a republic of large contracts.\n\n§YVera Korvina: security rule§!\nArchives, institutional inspections and control of the security apparatus underpin authority. Investigating wartime cases raises the question of limits on the service itself: accountable legal procedure or a state of closed dossiers.\n\n§YEdgar Renner: the northern regent§!\nUnder Nodrul's mandate, reconstruction relies on northern credit, specialists and guarantees. Build local institutions for future negotiations or consolidate the northern order. A functioning local apparatus also matters when seeking to revise dependency.\n\nThe details explain how war, the congress and foreign status lead to these programmes."
 STP_startup_path_0_details:0 "§YSHABRAT: EXCEPTIONAL OUTCOME REQUIREMENTS§!\n\nA limited party revolt requires all of the following:\n- Shabrat's side chosen, with Shabrat available and not arrested;\n- legitimacy of at least 80%;\n- a surviving public command agreement;\n- Ravel available and not arrested, with a prepared garrison in [2.GetName] or [29.GetName];\n- resistance administrations in [2.GetName] and [3.GetName], owned and controlled by your country and continuously active for more than 20 days.\n\nThese conditions are checked when the election is resolved. An ordinary victory does not guarantee this outcome. Failing one condition preserves individual preparation results, but leaves the larger military split in place.\n\nThe northern neighbour prepares intervention separately; peace on its front does not imply immediate entry.\n\n§YShabrat's two choices§!\nIn the event about what comes after the founders, retaining emergency powers opens Steland Hegemony; giving the assembly the right to refuse the government opens Freedom Against Slavery. These routes are mutually exclusive. The answer unlocks the chosen focus without immediately granting its rewards. The Charter leads to civilian control and a coalition of equals; hegemony leads to empire and domination of neighbours.\n\n§YArrest and Sotnikov§!\nAfter Shabrat's arrest, an available Sotnikov takes over the resistance, not the Party government. His postwar branch builds a staff state. Limiting military authority establishes a 180-day directorate term; subsequent focuses either retain military rule or open the succession event. The term limit alone does not appoint a civilian leader.\n\n§YSuccession§!\nThe transfer event allows retaining the leader, returning an available Shabrat, or choosing an available civilian successor: Gornin or Tikhorev. The established course does not reset. If Sotnikov is unavailable, surviving personnel affect succession; Barchel does not inherit all of Sotnikov's personal focuses."
 STP_startup_path_1_details:0 "§YPARTY: ELECTIONS AND CIVIL WAR§!\n\nA party victory determines the mandate; it does not cancel the civil war. Before the crisis resolves, use available party decisions and check district and army readiness.\n\nLocal preparation affects the distribution of territory, stockpiles and troops. Political strength should not be mistaken for payment for new formations.\n\nThe story's side choice and creation of wartime participants are separate stages. Read any offer to switch countries before answering: it determines the campaign you continue and the recipient of prepared forces.\n\nDo not assume external aid is automatic. Neighbouring intervention depends on those countries' own situations and event conditions.\n\n§YWho leads the Party§!\nMilitary support and faction agreements influence who inherits victory. The postwar congress has five candidates: Crowe's conservatives, Hedersett's radicals, the military collegium, Lanskoy's economic managers and Korvina's security service. Delegation votes determine the winner, rather than overall apparatus loyalty. A tie restricts the choice to the leading candidates. Promises to allies become government commitments.\n\n§YThe northern regent§!\nRenner comes to power through dependency on Nodrul, not as a sixth congress candidate. The protectorate preserves established local institutions. Revising the mandate requires a separate decision: economic success does not automatically grant independence. Liberation restores a previously elected government; if no congress was held, the contest for its mandate begins after dependency ends.\n\n§YWhere the programmes lead§!\nCrowe chooses between common obligations and old-family privileges. Hedersett between open squares and licensed clubs. The military between returning to service and permanent government. Lanskoy between independent workshops and large contracts. Korvina between legal procedure and closed dossiers. Renner between a local basis for negotiations and consolidation of the northern order.\n\nEach programme must pass through its own decisions and crises before reaching its conclusion. When the promised order is reviewed, the government has 90 days to address outstanding pledges, civilian control, supply and northern guarantees. Unresolved conflicts have individual consequences; naming a political course does not remove them."
