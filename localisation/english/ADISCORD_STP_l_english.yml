 STP_recruit_regional_official: "Find a Signature in the Right Office"
 STP_recruit_regional_official_desc: "In §Y18 days§!, we will establish an administration in a district where the resistance already has a foothold. Transferring an ordinary district requires both officials and entrenched influence: check the map forecast. In Livonin, a separate agreement with the council establishes the administration."
 STP_cw_secure_niansas_administration: "Take Over the Regional Administration"
 STP_cw_secure_niansas_administration_desc: "In §Y14 days§!, Shabrat's people will link road logistics to the regional office and prepare an order for Niansas to change sides. The operation is unlocked by the §YRoad through Niansas§! focus and requires entrenched resistance influence and at least a minimal legitimacy advantage for Shabrat (§Y>0§!). Success creates a separate basis for transferring Niansas without needing to raise legitimacy to 55%.\n\nSuspicion: §R+4§!. If resistance influence has already reached 90%, the special operation is unnecessary."
 STP_cw_niansas_positive_legitimacy_tt: "Legitimacy favours Shabrat by at least a small margin (§Y>0§!)"
 STP_cw_secure_niansas_result_tt: "§GNiansas's regional administration will be prepared to join Shabrat.§!"
 STP_bargain_with_local_councils: "Let the Council Remember Its Own Voice"
 STP_bargain_with_local_councils_desc: "In §Y21 days§!, we will reach an agreement with the Livonin council. While the agreement remains in force, the district will join Shabrat; its administration can then be brought in through a separate operation."
 STP_prepare_false_trail: "Plant a False Trail"
 STP_prepare_false_trail_desc: "In §Y7 days§!, we will prepare cover against the current commission in [FROM.GetName]. It must be ready before the commission finishes; the trail does not carry over to the next inspection. Instead of taking the risk, we can accept the commission's terms: sacrifice an official or, once that response is unlocked, dismantle the military network to save the civil administration.\n\n[STP.STPGetFalseTrailOdds]\nThis is a single roll on the commission's final day, not an average outcome. A convincing trail gives Shabrat 4% legitimacy, an imperfect one gives 1%; a detained courier gives the party 3%, and a counterintelligence breakthrough gives 6%.\n\nA breakthrough will cost us the administration, garrison connections, supply, sabotage and local agreements; work in the district will be suspended for §Y56 days§!. Of the local agreements, only Livonin's ratified agreement will survive."
 STP_region_unique_operation_2: "Negotiate with Monaia's Garrison"
 STP_region_unique_operation_2_desc: "In §Y35 days§!, we will secure support for Shabrat from New Monaia's garrison and administration. Surviving connections will help hold the district and form two additional brigades at the split. Each will require £manpower_texticon §Y4000§! personnel and £infantry_equipment_texticon §Y320§! equipment from resistance reserves.\n\nResistance influence: §G+15§!, suspicion: §R+7§!. The agreement alone cannot transfer the district: entrenched influence and 21 days of administration work are required. The operation occupies one preparation slot. If the connection is lost, negotiations can be repeated at full price."
 STP_region_unique_operation_3: "Restore the Niansas Depot"
 STP_region_unique_operation_3_desc: "We will restore the depot lost after the port budget was allocated. Niansas's tank cars and routes will be prepared for the split. If the district joins Shabrat, he will receive supply support for §Y21 days§!: supply consumption §G-10%§!, organisation recovery §G+5%§!. We will also transfer §Y500§! fuel from party stockpiles if enough is available. Hoskheit will add its own 500 fuel, but will not strengthen the shared supply effect.\n\nResistance influence: §G+6§!, suspicion: §R+5§!. If the route is lost, preparations can be repeated with the same duration and price."
 STP_region_unique_operation_29: "Negotiate with Kreiden's Garrison"
 STP_region_unique_operation_29_desc: "In §Y35 days§!, we will secure support for Shabrat from Kreiden's garrison and administration. Surviving connections will help hold the district and form two additional brigades at the split. Each will require £manpower_texticon §Y4000§! personnel and £infantry_equipment_texticon §Y320§! equipment from resistance reserves.\n\nResistance influence: §G+15§!, suspicion: §R+8§!. The agreement alone cannot transfer the district: entrenched influence and 21 days of administration work are required. The operation occupies one preparation slot. If the connection is lost, negotiations can be repeated at full price."
 STP_region_unique_operation_45: "Prepare Livonin's Administration"
 STP_region_unique_operation_45_desc: "After reaching an agreement with the council, we will prepare personnel for Livonin's administration. Under the commission's ordinary outcome, the administration will be exposed first, preserving the council agreement. A counterintelligence breakthrough or command inspection may also disrupt the agreement.\n\nResistance influence: §G+12§!, suspicion: §R+4§!. If the contact is lost, preparations can be repeated with the same duration and price."
 STP_region_unique_operation_46: "Secure Supply through Hoskheit"
 STP_region_unique_operation_46_desc: "We will hand Hoskheit's depot keys and routes to Shabrat's people. If the district joins the resistance, it will receive supply support for §Y21 days§!: supply consumption §G-10%§!, organisation recovery §G+5%§!. We will also transfer §Y500§! fuel from party stockpiles if enough is available. Niansas will add its own 500 fuel, but will not strengthen the shared supply effect.\n\nResistance influence: §G+8§!, suspicion: §R+6§!. If the route is lost, preparations can be repeated with the same duration and price."
 STP_region_unique_operation_53: "Mine the Roads of Old Fada"
 STP_region_unique_operation_53_desc: "We will plant charges on Old Fada's roads. At the split, if the district remains owned and controlled by the party, one infrastructure level will be damaged. If the district joins the resistance, the roads will be preserved. The party can foil the sabotage through an inspection and, after the demolition, restore infrastructure through ordinary repairs.\n\nPreparation requires £infantry_equipment_texticon §Y240§! equipment. Resistance influence: §G+6§!, suspicion: §R+10§!. If the sabotage team is lost, preparations can be repeated with the same duration and price."
 STP_cw_sabotage_capital: "Plant Charges near Congress"
 STP_cw_sabotage_capital_desc: "In §Y14 days§!, we will prepare sabotage in Fada. Ordinary district operations remain unavailable in the capital. At the split, if the party retains ownership and control, one infrastructure level and one military factory will be damaged. If the capital joins the resistance, the buildings will be preserved. A capital held by the party will reduce its military production for §Y42 days§!.\n\nPreparation requires £political_power_texticon §Y20§! and £infantry_equipment_texticon §Y360§! equipment. Resistance influence: §G+8§!, suspicion: §R+12§!. If the team is lost, preparations can be repeated with the same duration and price."
 STP_cw_sabotage_party_industry: "Disrupt Kreiden's Shifts"
 STP_cw_sabotage_party_industry_desc: "In §Y14 days§!, we will plant a charge at Kreiden's civilian factories. At the split, if the party retains ownership and control, one civilian factory will be damaged. If the district joins the resistance, production will be preserved. A district held by the party will reduce its military production for §Y42 days§!. The party can foil the sabotage through an inspection.\n\nPreparation requires £political_power_texticon §Y10§! and £infantry_equipment_texticon §Y240§! equipment. Resistance influence: §G+6§!, suspicion: §R+10§!. If the team is lost, preparations can be repeated with the same duration and price."
 STP_party_inspection_state_2: "Inspect Officials in New Monaia"
 STP_party_inspection_state_2_desc: "The party commission is checking appointments, passes and telephone logs in New Monaia.\n\n§YWhen the timer ends§!, the commission will inspect the underground network in this district. Choose a response through map decisions before the inspection ends.\n\n§YIf we do nothing:§! garrison connections, supply and sabotage will be lost. The commission will also expose the administration or, if none exists, the local agreement; Livonin's ratified agreement is protected. An exposed network suspends local operations for §R56 days§!. Discovered connections or weapon reserves shift legitimacy §R4% towards the party§!; a fruitless inspection shifts it §G2% towards Shabrat§!.\n\n§YHow to respond:§!\n- §YDelay the Work§!: buy another 14 days for £political_power_texticon §Y35§!; the delay alone does not protect the network.\n- §YFalse Trail§!: prepare it in §Y7 days§! before the timer ends. It may preserve the network, but failure risks losses; the risk depends on suspicion on the day the commission finishes.\n- §YSurrender an Official§!: sacrifice the administration while preserving prepared military connections and stockpiles.\n- §YOpen the Registers§!: preserve the administration at the cost of the military network.\nBoth concessions take effect immediately, each costs £political_power_texticon §Y25§! and shifts legitimacy §R2% towards the party§!; work in the district will stop until the inspection ends. Response availability depends on focuses and local connections."
 STP_party_inspection_state_3: "Inspect Officials in Niansas Region"
 STP_party_inspection_state_3_desc: "The party commission is inspecting records, tank cars and district officials in Niansas Region.\n\n§YWhen the timer ends§!, the commission will inspect the underground network in this district. Choose a response through map decisions before the inspection ends.\n\n§YIf we do nothing:§! garrison connections, supply and sabotage will be lost. The commission will also expose the administration or, if none exists, the local agreement; Livonin's ratified agreement is protected. An exposed network suspends local operations for §R56 days§!. Discovered connections or weapon reserves shift legitimacy §R4% towards the party§!; a fruitless inspection shifts it §G2% towards Shabrat§!.\n\n§YHow to respond:§!\n- §YDelay the Work§!: buy another 14 days for £political_power_texticon §Y35§!; the delay alone does not protect the network.\n- §YFalse Trail§!: prepare it in §Y7 days§! before the timer ends. It may preserve the network, but failure risks losses; the risk depends on suspicion on the day the commission finishes.\n- §YSurrender an Official§!: sacrifice the administration while preserving prepared military connections and stockpiles.\n- §YOpen the Registers§!: preserve the administration at the cost of the military network.\nBoth concessions take effect immediately, each costs £political_power_texticon §Y25§! and shifts legitimacy §R2% towards the party§!; work in the district will stop until the inspection ends. Response availability depends on focuses and local connections."
 STP_party_inspection_state_29: "Inspect Officials in Kreiden"
