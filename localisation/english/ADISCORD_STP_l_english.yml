 STP_pe_trade_ending_b_idea_desc:0 "The trading republic commits to scale. Great contracts sustain output while tying up part of future revenue in state guarantees."
 STP_pe_trade_programme:0 "Audit the Paid Deliveries"
 STP_pe_trade_programme_desc:0 "The commission will prepare fulfilment before the settlement date or resolve an existing dispute. Work takes 35 days and survives a change of party leader. Capitulation or the fall of party rule returns the deposit; political costs are not refunded."
 ADISCORD_STP_ch.43.t:0 "The Price of an Open Season"
 ADISCORD_STP_ch.43.d:0 "Three competing estimates presented to Lanskoy contain the same mistake on the final line. The suppliers insist it is coincidence. Warehouses meanwhile demand new advances for goods already paid for. The main contracts fall due in ninety days. Auditing the delivery notes now may prevent a general breakdown."
 ADISCORD_STP_ch.43.a:0 "Begin the preparations."
 ADISCORD_STP_ch.49.t:0 "Postwar Suppliers' Collusion"
 ADISCORD_STP_ch.49.d:0 "Major suppliers have postponed delivery at the same time, citing identical difficulties. Factories await components while warehouses retain prepaid goods. Lanskoy can fund an urgent settlement and delivery, accept state guarantees for an immediate agreement, or continue the audit. Output and revenue fall while the dispute remains open."
 ADISCORD_STP_ch.49.prepared:0 "The settlement date has arrived, but the prepared commission has already reconciled the disputed documents and terms. The parties have no grounds to halt institutional work. The government can continue its programme on the basis of fulfilled commitments."
 ADISCORD_STP_ch.49.a:0 "Fund urgent fulfilment of the contracts."
 ADISCORD_STP_ch.49.b:0 "Transfer the contractors' risk to the state."
 ADISCORD_STP_ch.49.c:0 "Leave the dispute to the commission."
 ADISCORD_STP_ch.49.z:0 "Take note."
 ADISCORD_STP_ch.55.t:0 "The New Order Has Been Tested"
 ADISCORD_STP_ch.55.a_desc:0 "Independent workshops form a durable network of orders. Its efficiency improves through the continuing work of arbitration and inspection offices."
 ADISCORD_STP_ch.55.b_desc:0 "The trading republic commits to scale. Great contracts sustain output while tying up part of future revenue in state guarantees."
 ADISCORD_STP_ch.55.a:0 "This is the course we have chosen."
 STP_pe_security_opening:0 "The Case Against Our Own"
 STP_pe_security_opening_desc:0 "Korvina receives files linking the victors' signatures to disappearances and confiscations. The service must choose between the immunity of its own people and the credibility of its findings."
 STP_pe_security_policy_a:0 "Names in an Open Hearing"
 STP_pe_security_policy_a_desc:0 "An open hearing allows victims to name those responsible. Trust improves, but the apparatus must spend effort answering questions and defending earlier decisions."
 STP_pe_security_policy_b:0 "The Chairwoman's Special File"
 STP_pe_security_policy_b_desc:0 "Korvina will retain personal control of the material. The directorate gains an instrument of discipline, while citizens remain unable to explain why some allegations proceed and others disappear."
 STP_pe_security_work_a:0 "Witnesses Under Legal Protection"
 STP_pe_security_work_a_desc:0 "Protected witnesses and citizens exonerated by their testimony will return to service. The open procedure restores part of the manpower reserve and confidence in the investigation."
 STP_pe_security_work_b:0 "Inspect the Inspectors"
 STP_pe_security_work_b_desc:0 "An internal inspectorate will audit the service's own accounts and appointments. Removing false records and duplicate offices reduces recurring administrative costs."
 STP_pe_security_settlement:0 "A Signature on the Record"
 STP_pe_security_settlement_desc:0 "Every conclusion must bear the name of someone responsible for it. The record will enter the register of powers, preserving names through future reshuffles. The signed settlement closes this dispute and refunds any commission still in progress."
 STP_pe_security_next_day:0 "Silence Demands an Answer"
 STP_pe_security_next_day_desc:0 "Closed cases concern people excluded from ordinary life. A dedicated budget permits regular reviews and returns exonerated citizens to service."
 STP_pe_security_commission:0 "Compare Confessions and Orders"
 STP_pe_security_commission_desc:0 "Once the scandal is settled, confessions can be compared with actual orders. The review restores confidence in findings that survive scrutiny."
 STP_pe_security_course_a:0 "Accountability of the Directors"
 STP_pe_security_course_a_desc:0 "Office does not excuse a signed order. Directors will receive clear limits and an obligation to explain their use of force."
 STP_pe_security_course_b:0 "The Archive Above the Office"
 STP_pe_security_course_b_desc:0 "The archive will survive changes of director, but the chair retains control of access. Political standing will depend on the contents of closed files."
 STP_pe_security_ending_a:0 "A Service Within the Law"
 STP_pe_security_ending_a_desc:0 "The service retains its powers within a verifiable procedure. Public confidence improves, while the directorate accepts the costs of accountability."
 STP_pe_security_ending_b:0 "The State of Closed Dossiers"
 STP_pe_security_ending_b_desc:0 "Closed dossiers become the basis of government. Orders are enforced more confidently, but stability rests on fear of whoever controls the archive."
 STP_pe_security_policy_a_idea:0 "Names in an Open Hearing"
 STP_pe_security_policy_a_idea_desc:0 "An open hearing allows victims to name those responsible. Trust improves, but the apparatus must spend effort answering questions and defending earlier decisions. Remains in force until the final settlement."
