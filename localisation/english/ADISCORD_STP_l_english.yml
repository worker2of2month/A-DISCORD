 STP_pf_radicals_tt: "§YRadical Hedonists§!\nFreedom in public life and an end to conservative Party tutelage.\n\n£ADISCORD_economy_burden_texticon War fatigue growth: [?STP_pf_radicals_effect|=-1%].\nProgram: §Y[?STP_pf_radicals_program|0]/2§!. Beneficial effect cap: §Y[?STP_pf_radicals_capacity|1%]§!.\nContribution to apparatus loyalty: §Y[?STP_pf_radicals_contribution|1]§! points.\n\nStage 1: An Agreement with District Elites.\nStage 2: Congress of District Secretariats.\nAt 20% influence and 70 support: §G-5% / -7% / -9%§!.\nSupport above 50 grants a benefit, below 50 a penalty. Influence scales both. Focuses develop programs and raise benefit caps. Program upgrades do not amplify penalties. Negotiations change political support but do not replace reform.\n\nEndorsement: [STPGetChapterRadicalsEndorsement]."
