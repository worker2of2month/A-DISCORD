 STP_party_constitution_category: "Future of the Revolution"
 STP_party_constitution_category_desc: "The balance follows the difference between Radical and Conservative party influence. Negotiations with any of the seven factions may change influence.\n\nA final course requires a §Y50%§! advantage and faction support of at least §Y60§!. Rule of the High Houses establishes private societies and soft drug legalization; Revolution Without Restraint establishes public orgies and hard drug legalization. Completing either focus settles the political outcome."
 STP_pw_party_back_conservatives: "Secure High House Support"
 STP_pw_party_back_conservatives_desc: "Agree appointments and a program with the Conservatives. Shares the 30-day cooldown of existing faction negotiations. Influence changes immediately update the balance."
 STP_pw_party_back_radicals: "Convene Radical Delegates"
 STP_pw_party_back_radicals_desc: "Agree appointments and a program for continuing the revolution. Shares the 30-day cooldown of existing faction negotiations. Influence changes immediately update the balance."
 STP_pw_party_high_houses:0 "Property arbitration"
 STP_pw_party_high_houses_desc:0 "Recognise property through a public register rather than another leadership selection. Wartime acquisitions and local privileges remain separate questions."
 STP_pw_party_unbound_revolution:0 "Equal access to public goods"
 STP_pw_party_unbound_revolution_desc:0 "Open public institutions beyond privileged houses. Wider access strains supply; an independent reserve or commercial charter can prevent a crisis."
