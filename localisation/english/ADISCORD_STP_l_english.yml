 # Civil-war aviation programmes
 STP_cw_air_service_columns:0 "Engines Back in Service"
 STP_cw_air_service_columns_desc:0 "Improve Abliya roads to supply the workshops and unlock the second repair batch early. Coordinated strike sorties will follow under a unified flight schedule."
 STP_cw_restore_air_reserve:0 "The First Workshop Shift"
 STP_cw_restore_air_reserve_desc:0 "Restore 30 ground-attack aircraft at Abliya in 21 days. This is the first of two finite batches. Air operations cannot start during the repairs. Losing Abliya or ending the civil war cancels the order and refunds its full price."
 STP_cw_complete_air_reserve:0 "The Last Reserve Aircraft"
 STP_cw_complete_air_reserve_desc:0 "After the first batch, restore another 30 ground-attack aircraft in 21 days. This exhausts the reserve; further aircraft require production. Air operations cannot start during repairs. Losing Abliya or ending the war refunds the order."
