 STP_ch_break_guarantees:0 "Revoke northern guarantees"
 STP_ch_break_guarantees_desc:0 "Place northern appointments under the centre. Conservative support rises, but the promised northern autonomy is violated. Unless the treaty is restored before the crisis ends, Nodrul will leave the dependency."
