 STP_military_operations: "Military Operations"
 STP_military_operations_desc: "An operational map of Stelander and its neighbours after the civil war. Colours show the current controllers of states."
 STP_operations_map_tt: "Stelander, Kefreyt, Nodrul, Bezhaysk, the Cult of the Children of the Forest, Yubora, the Free Frontier and the southern lands. Each state uses its current controller's national colour. Borders are highlighted in territory administered by Stelander; yellow hatching marks divided control."

 STP_pw_party_revolution_capital: "The New Capital of the Revolution"
 STP_pw_party_revolution_capital_desc:0 "Link independent external policy to preparations for the party congress. The candidate is elected after the external status is settled, not through a separate ideological-pole choice."
 STP_pw_party_northern_contacts: "Contacts with Northern Comrades"
 STP_pw_party_northern_contacts_desc: "Build a delegation and communications network among northern Party organisations. The separately funded programme takes 21 days and remains possible during war with Nodrul."
 STP_pw_party_nod_congress: "The Nodrul Congress"
 STP_pw_party_nod_congress_desc: "Offer Nodrul its own administration under Stelander's supremacy. Nodrul has 21 days to accept or refuse. Acceptance ends our mutual war and makes Nodrul our puppet. Refusal unlocks campaign preparation. Once this congress concludes, defeating Nodrul in the existing war also establishes a puppet instead of a white peace."
 STP_pw_party_northern_campaign: "The Northern Campaign"
 STP_pw_party_northern_campaign_desc: "Nodrul rejected the congress terms. A separately funded 35-day programme will deliver 6000 rifles, 60 support equipment and 20 army experience to Stelander. A separate decision then starts the war if necessary; deliveries support our existing war if Nodrul has already invaded."
 STP_pw_party_former_patron: "The Former Patron"
 STP_pw_party_former_patron_desc: "Consolidate Nodrul's dependency with officer training and an industrial order. Stelander funds the programmes; Nodrul receives the equipment and factory."
 STP_pw_party_revolution_capital_tt:0 "Northern talks remain available. The domestic congress opens after the external status is settled; programmes depend on the elected winner."
 STP_pw_party_revolution_no_compact_tt: "No independence buyout has been signed or is awaiting a reply"
 STP_pw_party_northern_network_ready_tt: "The funded northern contacts programme is complete"
 STP_pw_party_nod_congress_refused_tt: "Nodrul refused the congress terms or failed to reply in time"
 STP_pw_party_nod_congress_tt: "Nodrul receives a demand for submission and 21 days to reply. Acceptance ends our mutual war; refusal unlocks the Northern Campaign focus. After this focus completes, Nodrul's capitulation to our forces establishes a puppet instead of a white peace. Talks do not stop an invasion."
 STP_pw_party_nod_congress_refusal_tt: "Reject the terms. Stelander may prepare a northern campaign; refusal does not itself declare war."
 STP_pw_party_nod_subject_tt: "The war between Nodrul and Stelander ends. Nodrul leaves its previous faction; a faction led by Nodrul is dissolved. After one day Nodrul becomes Stelander's puppet, provided both countries exist and neither has become a third country's subject."
 STP_pw_party_fund_northern_contacts: "Prepare Northern Supporters"
 STP_pw_party_fund_northern_contacts_desc: "In 21 days, prepare northern delegates and communications, unlocking the Nodrul Congress and adding 20 civilian intelligence on Nodrul. Costs £political_power_texticon 35 and £ADISCORD_economy_treasury_texticon 540. Cancellation refunds the treasury payment but not political power."
 STP_pw_party_fund_northern_contacts_result_tt: "After §Y21 days§!: the northern network enables the Nodrul Congress; §G+20§! civilian intelligence on Nodrul. Subjugation or capitulation of either country cancels the programme and refunds §Y540§! £ADISCORD_economy_treasury_texticon, but not political power."
 STP_pw_party_prepare_northern_campaign: "Supply the Northern Campaign"
 STP_pw_party_prepare_northern_campaign_desc: "In 35 days, Stelander receives 6000 rifles, 60 support equipment and 20 army experience. A separate order may then start the war. Costs £political_power_texticon 50 and £ADISCORD_economy_treasury_texticon 900. Cancellation refunds the treasury payment but not political power."
 STP_pw_party_prepare_northern_campaign_result_tt: "After §Y35 days§!, Stelander receives §G6000§! £infantry_equipment_texticon, §G60§! support equipment and §G20§! army experience. Unlocks the attack order if no war exists. Cancellation refunds §Y900§! £ADISCORD_economy_treasury_texticon, but not political power."
 STP_pw_party_northern_work_available_tt: "The required focus is complete; Stelander and Nodrul exist, remain independent and have not capitulated. No other northern programme holds the budget, this preparation is incomplete and Nodrul's submission is not being processed"
 STP_pw_party_launch_northern_campaign: "Launch the Northern Campaign"
 STP_pw_party_launch_northern_campaign_desc: "Declare war to puppet Nodrul. Its capitulation to our forces establishes a subject government. If Nodrul already invaded, no new declaration is needed: the same settlement applies after the Nodrul Congress."
 STP_pw_party_launch_northern_campaign_available_tt: "The Northern Campaign focus and funded supply preparation are complete; both countries are independent, have not capitulated, are not at war with each other and do not share a faction"
 STP_pw_party_launch_northern_campaign_tt: "Stelander declares a war to puppet Nodrul. Victory makes Nodrul our subject."
 STP_pw_party_nod_joint_training: "Joint Officer Training"
 STP_pw_party_nod_joint_training_desc: "A one-time programme funded by Stelander: £political_power_texticon 35 and £ADISCORD_economy_treasury_texticon 720. Both countries receive 15 army experience; Nodrul receives 6000 rifles and 60 support equipment without spending its own resources."
 STP_pw_party_nod_joint_training_available_tt: "Nodrul remains under our control; neither country has capitulated and they are not at war with each other"
 STP_pw_party_nod_industrial_program: "An Industrial Order for Nodrul"
 STP_pw_party_nod_industrial_program_desc: "A one-time programme funded by Stelander: £political_power_texticon 50 and £ADISCORD_economy_treasury_texticon 1350. Nodrul receives a civilian factory in an owned, controlled state with a free building slot, without spending its own treasury."
 STP_pw_party_nod_industrial_program_available_tt: "Nodrul remains under our control and owns a controlled state with a free factory slot; neither country has capitulated or is at war with the other"
 ADISCORD_STP_pc.40.t: "The Nodrul Congress"
 ADISCORD_STP_pc.40.d: "Delegates from Stelander have brought a resolution of their Congress. The Party that survived the civil war no longer recognises our exclusive right to speak for the revolution. Northern comrades have also signed the demand; their couriers have spent weeks preparing this assembly.\n\nThey offer to retain our local administration under Stelander's political and military supremacy. Acceptance means dependency on our former client and withdrawal from our faction; if we lead that faction, it will be dissolved. Any war between us and Stelander will end.\n\nRefusal preserves our independence for now, but permits Stelander to prepare a campaign for our submission. If war is already underway, they intend to impose these terms by force. We have 21 days to reply; silence counts as refusal."
 ADISCORD_STP_pc.40.refuse: "The revolution needs no new patron."
 ADISCORD_STP_pc.40.accept: "Recognise Stelander's supremacy."
 ADISCORD_STP_pc.42.t: "An Answer to the North"
 ADISCORD_STP_pc.42.accepted: "Nodrul has become Stelander's subject. Its administration will continue to govern locally, but its foreign policy and military obligations now depend on our government. The old patronage has reversed direction.\n\nPractical work must follow. Once the new relationship is consolidated, we can fund joint officer training and an industrial order for Nodrul. Our treasury will cover the expense; the northern partner will receive the equipment and factory."
 ADISCORD_STP_pc.42.refused: "The northern government has not accepted the congress terms. Nodrul remains independent, and our Party must decide whether it is ready to enforce its demands.\n\nThe staff can prepare the northern campaign and fund its supplies. If there is no war yet, the attack remains a separate decision. If Nodrul has already crossed the border, the congress has defined our answer: seek its capitulation and establish a dependent government in the north."
 ADISCORD_STP_pc.42.a: "We shall proceed."
