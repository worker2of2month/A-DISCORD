 STP_ch_pressure_1:0 "Nodrul’s demand"
 STP_ch_pressure_1_desc:0 "Stage 1/4. The mission displays the remaining time. Without a settlement, escalation continues; ordinary decisions do not reset the clock. One paid 42-day extension is available."
 STP_ch_pressure_2:0 "Sanctions and withdrawal of aid"
 STP_ch_pressure_2_desc:0 "Stage 2/4. The mission displays the remaining time. Without a settlement, escalation continues; ordinary decisions do not reset the clock. One paid 42-day extension is available."
 STP_ch_pressure_3:0 "Intervention preparations"
 STP_ch_pressure_3_desc:0 "Stage 3/4. The mission displays the remaining time. Without a settlement, escalation continues; ordinary decisions do not reset the clock. One paid 42-day extension is available."
 STP_ch_pressure_4:0 "Final ultimatum"
 STP_ch_pressure_4_desc:0 "Stage 4/4. The mission displays the remaining time. Without a settlement, escalation continues; ordinary decisions do not reset the clock. One paid 42-day extension is available."
 STP_ch_crisis_deadline:0 "The promised order under pressure"
 STP_ch_crisis_deadline_desc:0 "90 days to resolve outstanding pledges, civilian control, supply and the northern treaty. Each unresolved issue has its own consequence; resolved issues do not return through a random roll. Judicial oversight of the security service is checked separately."
 ADISCORD_STP_ch.2.t:0 "The price of independence"
 ADISCORD_STP_ch.2.d:0 "Nodrul demands continued access to Stelander’s institutions. Independence now requires trained commanders behind each recalled adviser and domestic supply behind each cancelled contract.\n\nDemands lead to sanctions, intervention preparations and a final ultimatum. Deadlines are visible in decisions. Talks with northern allies and a voluntary protectorate remain alternatives within the same struggle."
 ADISCORD_STP_ch.2.a:0 "Continue"
 ADISCORD_STP_ch.3.t:0 "The external question is settled"
 ADISCORD_STP_ch.3.d:0 "The external status is settled. Delegates now demand a decision on who controls the institutions they built. Government support is not a vote for a candidate: every caucus brings its own endorsement and agreements.\n\nThe congress freezes the vote. The winner inherits ministries, allies and the promises that secured the result, not a clean slate.\n\nThe presidency is contested by the conservatives, Hedersett, Veil, Lanskoy and Korvina."
 ADISCORD_STP_ch.3.a:0 "Continue"
 ADISCORD_STP_ch.4.t:0 "A state under mandate"
 ADISCORD_STP_ch.4.d:0 "Nodrul gains authority over external policy, but domestic life continues. Trained staff, the army and enterprises remain in place. Where domestic institutions are missing, advisers retain practical power.\n\nJoint programmes can expand local capabilities. The same staff can prepare a revised mandate, provided the government does not spend its time on concessions without returns.\n\nNodrul appoints Edgar Renner to lead the government. If an elected government preceded subjugation, liberation restores it and its interrupted programme without a new ballot."
 ADISCORD_STP_ch.4.a:0 "Continue"
 ADISCORD_STP_ch.6.1:0 "Confirm the Conservative Presidium"
 ADISCORD_STP_ch.6.2:0 "Confirm Rufus Hedersett"
 ADISCORD_STP_ch.6.3:0 "Confirm the military candidate"
 STP_ch_offer_closed:0 "Circumstances have changed"
 ADISCORD_STP_ch.6.t:0 "The congress result"
 ADISCORD_STP_ch.6.d:0 "Conservative mandate: [?STP_ch_votes_1|1]. Radical mandate: [?STP_ch_votes_2|1]. Military mandate: [?STP_ch_votes_3|1]. Economic bloc mandate: [?STP_ch_votes_4|1]. Security service mandate: [?STP_ch_votes_5|1].\n\nThe candidate with the most votes is elected. Abstentions do not transfer to the winner. Tied candidates share first place and the congress chooses only between them. Credentials are closed: new negotiations do not rewrite these totals."
 ADISCORD_STP_ch.7.accept:0 "Recognise independence"
 ADISCORD_STP_ch.7.refuse:0 "Maintain the mandate"
 ADISCORD_STP_ch.7.t:0 "Revising the Stelander mandate"
 ADISCORD_STP_ch.7.d:0 "Stelander proposes ending its dependency while preserving cooperation. Domestic command, supply and appointments allow it to function without northern supervision. Edgar Renner must arrange a transfer of authority without severing ties with Nodrul.\n\nConsent ends Renner’s mandate. A government elected before subjugation resumes its interrupted work; if no congress has taken place, Stelander begins the contest for its mandate. Refusal does not automatically begin a war."
 ADISCORD_STP_ch.8.t:0 "The mandate remains"
 ADISCORD_STP_ch.8.d:0 "Consent to independence was not obtained. Domestic institutions survive: the government may continue cooperation, return to talks after the interval, or prepare armed separation."
 ADISCORD_STP_ch.8.a:0 "Continue"
 ADISCORD_STP_ch.9.t:0 "Promises come due"
 ADISCORD_STP_ch.9.d:0 "The government programme is in effect. The unresolved questions now matter more than the coalition’s name: emergency powers, northern guarantees, supply and delegate agreements.\n\nThe government has 90 days. Decisions display each unresolved issue. Obligations settled in advance do not become a new crisis.\n\nIf the security service has exceptional powers, judicial oversight must be established. Otherwise a departmental veto will take effect when the deadline expires."
 ADISCORD_STP_ch.9.a:0 "Continue"
 ADISCORD_STP_ch.10.t:0 "The order and its price"
 ADISCORD_STP_ch.10.d:0 "[STPGetPostwarConstitution]\n\nThe consequences of the government’s decisions are settled. Preserved institutions keep working; expired obligations cannot be presented as fresh rewards. The result is reflected in caucus relations, Nodrul’s status and the constraints on government."
 ADISCORD_STP_ch.10.a:0 "Continue"
 STP_ch_model_ally:0 "A model ally"
 STP_ch_model_ally_desc:0 "Cooperation and domestic institutions can coexist: local staff must survive every external status."
 STP_ch_local_apparatus:0 "Autonomy through the apparatus"
 STP_ch_local_apparatus_desc:0 "Cooperation and domestic institutions can coexist: local staff must survive every external status."
 STP_ch_congress:0 "Close the party congress"
 STP_ch_congress_desc:0 "Freeze the delegates and hold the vote. The winner inherits every agreement as a government obligation."
 STP_ch_cabinet:0 "Distribute government powers"
 STP_ch_cabinet_desc:0 "Assign security, economic management and party appointments. Coalition partners remain separate caucuses."
 STP_ch_first_promises:0 "The majority’s obligations"
 STP_ch_first_promises_desc:0 "Publish the agreements that secured victory."
 STP_ch_rules:0 "The government begins its work"
 STP_ch_rules_desc:0 "Confirm the cabinet, appointments and the fulfilment of congress pledges."
 STP_ch_congress_unlock_tt:0 "Closes voting and determines the government. Once the result is accepted, a new focus branch appears: §Y$STP_ch_cabinet$§! → §Y$STP_ch_first_promises$§! → §Y$STP_ch_rules$§!."
 STP_ch_cabinet_phase_tt:0 "The congress has elected a government; the cabinet is being formed."
 STP_ch_security_ministry_appointed_tt:0 "In '$STP_ch_chapters$' decisions, make one security appointment: '$STP_ch_appoint_security_ministry_1$' or '$STP_ch_appoint_security_ministry_2$'."
 STP_ch_economy_ministry_appointed_tt:0 "In '$STP_ch_chapters$' decisions, make one economic appointment: '$STP_ch_appoint_economy_ministry_1$' or '$STP_ch_appoint_economy_ministry_2$'."
 STP_ch_appointments_appointed_tt:0 "In '$STP_ch_chapters$' decisions, make one party appointment: '$STP_ch_appoint_appointments_1$' or '$STP_ch_appoint_appointments_2$'."
 STP_ch_rules_unlock_tt:0 "[STPGetChapterProgramUnlock]\nCabinet formation is complete. Continue the current leader's programme; unfulfilled agreements remain in decisions."
 STP_ch_program_pending_tt:0 "The elected government programme becomes available after the election."
 STP_ch_program_1_unlock_tt:0 "Unlocks the conservative programme focuses: §Y$STP_pw_party_high_houses$§! → §Y$STP_ch_property_charter$§!."
 STP_ch_program_2_unlock_tt:0 "Unlocks the radical programme focuses: §Y$STP_pw_party_unbound_revolution$§! → §Y$STP_ch_free_labour$§!."
 STP_ch_program_3_unlock_tt:0 "Unlocks the military programme focuses: §Y$STP_ch_service_act$§! → §Y$STP_ch_regular_service$§!."
 STP_ch_program_4_unlock_tt:0 "Unlocks the economic programme focuses: §Y$STP_ch_production_agreements$§! → §Y$STP_ch_market_charter$§!."
 STP_ch_program_5_unlock_tt:0 "Unlocks the security service programme focuses: §Y$STP_ch_security_directorate$§! → §Y$STP_ch_register_of_powers$§!."
 STP_ch_promises_tt:0 "Unlocks the next focus: §Y$STP_ch_rules$§!.\n§YMajority obligations§! remain available until the crisis ends. Broken agreements are counted separately for every caucus."
 STP_ch_service_act:0 "The permanent army act"
 STP_ch_service_act_desc:0 "Victorious formations become the state army. The government must define the duration of emergency powers and command accountability."
 STP_ch_property_charter:0 "A register of recognised rights"
 STP_ch_property_charter_desc:0 "Register the rights of houses and owners. Commercial privileges and district appointments remain separate obligations."
 STP_ch_free_labour:0 "Free labour and personal rights"
 STP_ch_free_labour_desc:0 "End slave labour and recognise collective bargaining. Personal freedom does not exempt party institutions from accountability."
 STP_ch_regular_service:0 "Staff, service and accountability"
 STP_ch_regular_service_desc:0 "Establish permanent organisation and supply. Military victory does not end emergency powers by itself."
 STP_ch_program_settlement:0 "Put the new order to the test"
 STP_ch_program_settlement_desc:0 "Bring the programme into effect and test unresolved contradictions."
 STP_ch_institutional_review:0 "Institutions rather than emergency rule"
 STP_ch_institutional_review_desc:0 "Review unresolved issues before the deadline."
 STP_ch_chapters:0 "Stelander’s political order"
 STP_ch_chapters_desc:0 "§YStage:§! [STPGetPoliticalChapter]. [STPGetChapterPhaseHint]\n[STPGetChapterPressureLine]\n\n§YDomestic foundations§! (all three are needed to leave Nodrul's control):\n  Army: [STPGetChapterArmyFoundation]\n  Economy: [STPGetChapterEconomyFoundation]\n  Appointments: [STPGetChapterPartyFoundation]\n\n§YNegotiator:§! [STPGetChapterNominee].\n§YCongress votes:§! £STP_ch_conservatives_texticon conservatives §Y[?STP_ch_votes_1|1]§!, £STP_ch_radicals_texticon radicals §Y[?STP_ch_votes_2|1]§!, £STP_ch_army_texticon military §Y[?STP_ch_votes_3|1]§!, £STP_ch_merchants_texticon Lanskoy §Y[?STP_ch_votes_4|1]§!, £STP_ch_security_texticon Korvina §Y[?STP_ch_votes_5|1]§!.\n§YUnfulfilled winning pledges:§! [?STP_ch_unpaid_promises|0]. [STPGetChapterRisks]"
 STP_pf_settled_note:0 "After the congress the faction balance is frozen: bonuses are kept but no longer change."
 STP_pw_programme:0 "Government programme"
 STP_pw_programme_desc:0 "Postwar programme decisions. §YReforms§! are done once and permanently strengthen the «Postwar state» spirit. The other decisions can be repeated. New decisions are unlocked by focuses: the veterans branch and the current government's programme."
 STP_pw_prog_veteran_artels:0 "Reform: Veteran work crews"
 STP_pw_prog_veteran_artels_desc:0 "Front-line veterans take contracts to rebuild workshops and depots. Demobilised companies become construction crews under party committees."
 STP_pw_prog_insurance_fund:0 "Reform: State insurance fund"
 STP_pw_prog_insurance_fund_desc:0 "Pensions, allowances and family payments are merged into one fund. Fewer intermediaries mean lower costs and fewer grievances."
 STP_pw_prog_houses_cadastre:0 "Reform: Cadastre of the Houses"
 STP_pw_prog_houses_cadastre_desc:0 "The Chamber compiles a full register of the Houses' land, workshops and debts. The state finally knows what it owns."
 STP_pw_prog_festival_brigades:0 "Reform: Festival brigades"
 STP_pw_prog_festival_brigades_desc:0 "Festival clubs and artels raise volunteer brigades. Poorly trained, but numerous and willing."
 STP_pw_prog_cadet_corps:0 "Reform: Cadet corps"
 STP_pw_prog_cadet_corps_desc:0 "The standing army gets its own school for junior officers. Graduates join their units already trained."
 STP_pw_prog_state_contracts:0 "Reform: State contracts"
 STP_pw_prog_state_contracts_desc:0 "Lanskoy places a long-term arms order with the rebuilt plants, guaranteed by the treasury for years ahead."
 STP_pw_prog_apparatus_audit:0 "Reform: Apparatus audit"
 STP_pw_prog_apparatus_audit_desc:0 "Korvina's inspectors go through every office. Redundant posts are cut and orders start being carried out on time."
 STP_pw_prog_joint_courses:0 "Reform: Joint courses"
 STP_pw_prog_joint_courses_desc:0 "Northern specialists teach Stelander engineers and staff officers. The knowledge stays even if the advisers leave."
 STP_pw_prog_reconstruction_bonds:0 "Reconstruction bonds"
 STP_pw_prog_reconstruction_bonds_desc:0 "The party sells bonds to veterans, clubs and Houses. The money goes to reconstruction."
 STP_pw_prog_reconstruction_bonds_tt:0 "Treasury: §G+1200§! £ADISCORD_economy_treasury_texticon."
 STP_pw_prog_house_reception:0 "Reception at the Chamber"
 STP_pw_prog_house_reception_desc:0 "The Houses pay generously for an evening at the Chamber and expect the government to hear their requests."
 STP_pw_prog_peoples_festival:0 "People's festival"
 STP_pw_prog_peoples_festival_desc:0 "The squares open again for bands and street tables, paid for by the treasury."
 STP_pw_prog_grand_manoeuvres:0 "Grand manoeuvres"
 STP_pw_prog_grand_manoeuvres_desc:0 "The standing army exercises at full strength: marches, crossings and supply drills."
 STP_pw_prog_export_quota:0 "Export quota"
 STP_pw_prog_export_quota_desc:0 "Trading houses may export goods above plan; part of the revenue goes to the treasury."
 STP_pw_prog_export_quota_tt:0 "Treasury: §G+1500§! £ADISCORD_economy_treasury_texticon."
 STP_pw_prog_targeted_purge:0 "Targeted purge"
 STP_pw_prog_targeted_purge_desc:0 "The directorate removes officials who sabotage government decisions."
 STP_pw_prog_northern_credit:0 "Northern credit"
 STP_pw_prog_northern_credit_desc:0 "Nodrul opens a credit line for Stelander, guaranteed by the regent."
 STP_pw_prog_northern_credit_tt:0 "Treasury: §G+1000§! £ADISCORD_economy_treasury_texticon."
 STP_pw_prog_district_grants:0 "District grants"
 STP_pw_prog_district_grants_desc:0 "The treasury pays urgent grants to the districts: officials gain room for compromise, and the cabinet gains time to carry out its decisions."
 STP_pw_prog_district_grants_tt:0 "Treasury: §R-540§! £ADISCORD_economy_treasury_texticon; stability §G+2%§!, political power §G+15§!."
 STP_pw_prog_trade_credit:0 "Keep the trade moving"
 STP_pw_prog_trade_credit_desc:0 "The treasury insures the trading houses and pays for another transport cycle to restore the domestic market."
 STP_pw_prog_trade_credit_tt:0 "Treasury: §R-720§! £ADISCORD_economy_treasury_texticon; §G+250§! motorised equipment, political power §G+20§!."
 STP_pw_prog_defence_orders:0 "Pay the defence orders"
 STP_pw_prog_defence_orders_desc:0 "The military office places another paid order. The plants receive work, and the army receives weapons for the next crisis."
 STP_pw_prog_defence_orders_tt:0 "Treasury: §R-900§! £ADISCORD_economy_treasury_texticon; rifles, support equipment and artillery go to the stockpile."
 STP_pw_prog_public_works:0 "Public works"
 STP_pw_prog_public_works_desc:0 "The government funds road crews and family payments. Money returns to the districts as people and stability."
 STP_pw_prog_public_works_tt:0 "Treasury: §R-540§! £ADISCORD_economy_treasury_texticon; stability §G+3%§!, manpower §G+3000§!."
 STP_ch_train_army_effect_tt:0 "Political power and treasury are paid now. In §Y28 days§! you gain own command: this foundation counts, and removing the northern advisers no longer causes a penalty (army organisation §R-15%§!).\nOn completion - §YArmy Command§!: influence up to §Y+5 pp§!, support §G+12§!.\nIf cancelled, the treasury is refunded but not the political power."
 STP_ch_remove_army_effect_tt:0 "Nodrul loses this lever and shifts its demands to the remaining ones.\n§RUntil your own institution is ready:§! army organisation §R-15%§!.\nThe current pressure countdown is §Ynot reset§!."
 STP_ch_train_economy_effect_tt:0 "Political power and treasury are paid now. In §Y28 days§! you gain local specialists: this foundation counts, and removing the northern advisers no longer causes a penalty (factory output §R-20%§!).\nOn completion - §YMerchants§!: influence up to §Y+5 pp§!, support §G+12§!.\nIf cancelled, the treasury is refunded but not the political power."
 STP_ch_remove_economy_effect_tt:0 "Nodrul loses this lever and shifts its demands to the remaining ones.\n§RUntil your own institution is ready:§! factory output §R-20%§!.\nThe current pressure countdown is §Ynot reset§!."
 STP_ch_train_party_effect_tt:0 "Political power and treasury are paid now. In §Y28 days§! you gain own personnel service: this foundation counts, and removing the northern advisers no longer causes a penalty (administration costs §R+15%§!).\nOn completion - §YBorons§!: influence up to §Y+5 pp§!, support §G+12§!.\nIf cancelled, the treasury is refunded but not the political power."
 STP_ch_remove_party_effect_tt:0 "Nodrul loses this lever and shifts its demands to the remaining ones.\n§RUntil your own institution is ready:§! administration costs §R+15%§!.\nThe current pressure countdown is §Ynot reset§!."
 STP_ch_trade_delay_effect_tt:0 "§Y1,000§! rifles are handed to Nodrul. The current pressure stage (and the invasion countdown, if running) is extended by §G42 days§!. Once per campaign."
 STP_ch_accept_protection_effect_tt:0 "Stelander becomes a §YNodrul protectorate§!.\n§GPressure and the invasion countdown stop§!; any war with Nodrul ends in a white peace; you leave your faction.\nThe country, army, institutions and investments are kept. Joint programmes and the path to liberation open."
 STP_ch_northern_guarantees_effect_tt:0 "Northern guarantees accepted. This is one of the conditions for bringing Nodrul under political control (with the northern network, reconstruction and defence).\n§RRevoking them later§! causes a northern crisis."
 STP_ch_nominate_1_effect_tt:0 "Negotiator: §Ythe conservative candidate§!. Groups you sign agreements with will vote for this candidate at the congress.\nThis does not pick the winner. §RThe choice is final.§!"
 STP_ch_nominate_2_effect_tt:0 "Negotiator: §Ythe radical candidate (Hedersett)§!. Groups you sign agreements with will vote for this candidate at the congress.\nThis does not pick the winner. §RThe choice is final.§!"
 STP_ch_nominate_3_effect_tt:0 "Negotiator: §Ythe military candidate§!. Groups you sign agreements with will vote for this candidate at the congress.\nThis does not pick the winner. §RThe choice is final.§!"
 STP_ch_nominate_4_effect_tt:0 "Negotiator: §YPavel Lanskoy (economists)§!. Groups you sign agreements with will vote for this candidate at the congress.\nThis does not pick the winner. §RThe choice is final.§!"
 STP_ch_nominate_5_effect_tt:0 "Negotiator: §YVera Korvina (security service)§!. Groups you sign agreements with will vote for this candidate at the congress.\nThis does not pick the winner. §RThe choice is final.§!"
 STP_ch_pledge_conservatives_effect_tt:0 "§YConservatives§! votes at the congress go to [STPGetChapterNominee].\nIf that candidate wins, «Fulfil pledge: Conservatives» appears. §RAn unfulfilled pledge§! worsens the final review."
 STP_ch_fulfil_conservatives_effect_tt:0 "Pledge to §YConservatives§! fulfilled: it will not cost §R-3% stability§! in the final review.\nAlso: stability §G+2%§!."
 STP_ch_pledge_borons_effect_tt:0 "§YBorons§! votes at the congress go to [STPGetChapterNominee].\nIf that candidate wins, «Fulfil pledge: Borons» appears. §RAn unfulfilled pledge§! worsens the final review."
 STP_ch_fulfil_borons_effect_tt:0 "Pledge to §YBorons§! fulfilled: it will not cost §R-3% stability§! in the final review.\nAlso: administration costs §G-4%§!."
 STP_ch_pledge_security_effect_tt:0 "§YSecurity Service§! votes at the congress go to [STPGetChapterNominee].\nIf that candidate wins, «Fulfil pledge: Security Service» appears. §RAn unfulfilled pledge§! worsens the final review."
 STP_ch_fulfil_security_effect_tt:0 "Pledge to §YSecurity Service§! fulfilled: it will not cost §R-3% stability§! in the final review."
 STP_ch_pledge_army_effect_tt:0 "§YArmy Command§! votes at the congress go to [STPGetChapterNominee].\nIf that candidate wins, «Fulfil pledge: Army Command» appears. §RAn unfulfilled pledge§! worsens the final review."
 STP_ch_fulfil_army_effect_tt:0 "Pledge to §YArmy Command§! fulfilled: it will not cost §R-3% stability§! in the final review.\nAlso: §Rthe army gains emergency powers§!: you will later need «Ratify civilian control»."
 STP_ch_pledge_advisers_effect_tt:0 "§YNodrul advisers§! votes at the congress go to [STPGetChapterNominee].\nIf that candidate wins, «Fulfil pledge: Nodrul advisers» appears. §RAn unfulfilled pledge§! worsens the final review."
 STP_ch_fulfil_advisers_effect_tt:0 "Pledge to §YNodrul advisers§! fulfilled: it will not cost §R-3% stability§! in the final review.\nAlso: northern advisers regain access to the economy."
 STP_ch_pledge_merchants_effect_tt:0 "§YMerchants§! votes at the congress go to [STPGetChapterNominee].\nIf that candidate wins, «Fulfil pledge: Merchants» appears. §RAn unfulfilled pledge§! worsens the final review."
 STP_ch_fulfil_merchants_effect_tt:0 "Pledge to §YMerchants§! fulfilled: it will not cost §R-3% stability§! in the final review.\nAlso: trade income §G+5%§!; supply reserve created, trade crisis removed."
 STP_ch_pledge_radicals_effect_tt:0 "§YHedonist Radicals§! votes at the congress go to [STPGetChapterNominee].\nIf that candidate wins, «Fulfil pledge: Hedonist Radicals» appears. §RAn unfulfilled pledge§! worsens the final review."
 STP_ch_fulfil_radicals_effect_tt:0 "Pledge to §YHedonist Radicals§! fulfilled: it will not cost §R-3% stability§! in the final review.\nAlso: stability §G+2%§!, administration costs §R+3%§!, collective bargaining law."
 STP_ch_appoint_security_ministry_1_effect_tt:0 "Planning speed §G+2%§!. The army gains emergency powers (civilian control will be needed); with your own command, organisation §G+3%§!. The bonus is added permanently to the «The Renewed Presidium» spirit.\nThe other option in this pair becomes unavailable. «Majority commitments» needs one appointment in each of the three pairs."
 STP_ch_appoint_security_ministry_2_effect_tt:0 "Stability §G+1%§!. The bonus is added permanently to the «The Renewed Presidium» spirit.\nThe other option in this pair becomes unavailable. «Majority commitments» needs one appointment in each of the three pairs."
 STP_ch_appoint_economy_ministry_1_effect_tt:0 "All treasury income §G+1.5%§!. The bonus is added permanently to the «The Renewed Presidium» spirit.\nThe other option in this pair becomes unavailable. «Majority commitments» needs one appointment in each of the three pairs."
 STP_ch_appoint_economy_ministry_2_effect_tt:0 "Treasury capacity §G+5%§!. The bonus is added permanently to the «The Renewed Presidium» spirit.\nThe other option in this pair becomes unavailable. «Majority commitments» needs one appointment in each of the three pairs."
 STP_ch_appoint_appointments_1_effect_tt:0 "Political power gain §G+0.02§! per day. The bonus is added permanently to the «The Renewed Presidium» spirit.\nThe other option in this pair becomes unavailable. «Majority commitments» needs one appointment in each of the three pairs."
 STP_ch_appoint_appointments_2_effect_tt:0 "Administration costs §G-1.5%§!. The bonus is added permanently to the «The Renewed Presidium» spirit.\nThe other option in this pair becomes unavailable. «Majority commitments» needs one appointment in each of the three pairs."
 STP_ch_cooperate_effect_tt:0 "Joint programme stage: army experience §G+10§!, §YNodrul advisers§!: influence up to §Y+5 pp§!, support §G+12§!.\nStage 1 - local specialists (economy foundation); stage 2 - personnel service (appointments foundation); stage 3 - a civilian factory in the capital or two industry research bonuses.\nThree stages open the window to leave the protectorate. Repeatable after 60 days."
 STP_ch_request_release_effect_tt:0 "Nodrul receives the request and answers within §Y22 days§!. Consent means independence without war. Refusal or silence keeps the protectorate; you can ask again after 60 days."
 STP_ch_armed_break_effect_tt:0 "§RThe protectorate ends and war with Nodrul begins.§!\nVictory leads to your own congress without having to conquer the north. Defeat restores the protectorate; investments are kept."
 STP_ch_supply_buffer_effect_tt:0 "An independent supply reserve is created: §Gno trade crisis after the reforms§! (or it ends if already running)."
 STP_ch_civilian_control_effect_tt:0 "The army's emergency powers §Gno longer cause a military crisis§! in the final review."
 STP_ch_security_review_effect_tt:0 "The security service crisis §Gends§!; the directorate itself is kept."
 STP_ch_break_guarantees_effect_tt:0 "§YConservatives§!: support §G+8§!.\n§RNorthern guarantees are broken§!: unless restored before the final review ends, a northern crisis follows."
 STP_ch_restore_guarantees_effect_tt:0 "§YArmy Command§!: support §R-5§!. The northern treaty is restored and §Gthe northern crisis ends§!."
 STP_ch_aid_effect_tt:0 "Nodrul decides within §Y22 days§!. If it agrees: §G+6,000§! rifles and §G+450§! treasury; northern advisers regain access to the army and economy; §YNodrul advisers§!: influence up to §Y+5 pp§!, support §G+12§!.\nNext request no sooner than in 23 days."
 STP_ch_pressure_1_timeout_tt:0 "§RStage 2/4 «Sanctions and aid withdrawal» (120 days).§! While Nodrul keeps economic access, trade income §R-15%§!.\nNext target: the economy if its advisers are still there; otherwise appointments (the adviser caucus grows); otherwise the army.\nPressure stops if you accept the protectorate, or if Nodrul goes to war with Stelander or loses its independence."
 STP_ch_pressure_2_timeout_tt:0 "§RStage 3/4 «Intervention preparations» (90 days).§! The trade penalty under economic access remains.\nNext target: the economy if its advisers are still there; otherwise appointments (the adviser caucus grows); otherwise the army.\nPressure stops if you accept the protectorate, or if Nodrul goes to war with Stelander or loses its independence."
 STP_ch_pressure_3_timeout_tt:0 "§RStage 4/4 «Final ultimatum» (30 days).§! Invasion follows.\nNext target: the economy if its advisers are still there; otherwise appointments (the adviser caucus grows); otherwise the army.\nPressure stops if you accept the protectorate, or if Nodrul goes to war with Stelander or loses its independence."
 STP_ch_pressure_4_timeout_tt:0 "§RNodrul invades Stelander.§!\nPressure stops if you accept the protectorate, or if Nodrul goes to war with Stelander or loses its independence."
 STP_ch_crisis_deadline_timeout_tt:0 "The review concludes. Each unfulfilled pledge - stability §R-3%§!. No civilian control - military veto and stability §R-12%§!; broken northern treaty - Nodrul breaks away, stability §R-8%§!; no supply reserve - shortages for 180 days; no oversight of the security service - departmental veto, stability §R-8%§!. Problems already solved do not return."
 STP_ch_phase_hint_1:0 "Nodrul demands concessions. Build your own institutions, remove advisers or accept the protectorate; pick a negotiator and gather group votes."
 STP_ch_phase_hint_2:0 "Run joint programmes and build foundations; when the window opens, negotiate an exit or break away."
 STP_ch_phase_hint_3:0 "Win group votes through agreements and close the congress via the focus."
 STP_ch_phase_hint_4:0 "Pick one appointment in each pair."
 STP_ch_phase_hint_5:0 "Fulfil pledges and complete the programme focuses."
 STP_ch_phase_hint_6:0 "Final review under way: resolve remaining crises before the deadline."
 STP_ch_phase_hint_7:0 "The order is settled."
