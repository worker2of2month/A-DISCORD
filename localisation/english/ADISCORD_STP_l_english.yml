 STP_cw_launch_air_operation:0 "Schedule Strike Sorties"
 STP_cw_launch_air_operation_desc:0 "Assign ground crews to a 21-day offensive: CAS mission efficiency +10%, ground support +8%. Actual aircraft must fly combat missions to provide the bonus. Reserve repairs are unavailable during the operation. The next operation may start 42 days after the previous one began."
