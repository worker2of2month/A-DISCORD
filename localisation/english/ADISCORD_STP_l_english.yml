 # Послевоенные договорённости партии
 ADISCORD_STP_pc.23.apparatus: "Entrust appointments to the old apparatus."
 ADISCORD_STP_pc.23.districts: "Give the districts a place in the cabinet."
 ADISCORD_STP_pc.23.delegates: "Bring in delegates of the radical wing."
 STP_pw_party_cabinet_apparatus_tt: "The cabinet will rely on the conservatives. A common mandate for negotiations with Nodrul requires their support to remain at least §Y60§!."
 STP_pw_party_cabinet_districts_tt: "The cabinet will rely on the Borons. A common mandate for negotiations with Nodrul requires their support to remain at least §Y60§!."
 STP_pw_party_cabinet_delegates_tt: "The cabinet will rely on the radical hedonists. A common mandate for negotiations with Nodrul requires their support to remain at least §Y60§!."
 STP_pw_party_promise_districts: "District representatives lay the prewar agreement with local commanders on the table. When the capital needed their help, it promised consultation. They now demand the same treatment for civilian appointments."
 STP_pw_party_promise_rotation: "The commanders remember the prewar rotation: the capital has already shown that it can replace local leaders. The Borons demand guarantees that emergency appointments will not become the normal order."
 STP_pw_party_promise_emergency: "Wartime appointments were rushed, leaving several offices with incompatible lists of authority. Each now insists that its own list should be final."
 ADISCORD_STP_pc.34.t: "Two signatures on an order"
 ADISCORD_STP_pc.34.d: "The army register uncovers units taking orders from two offices. The general staff considers them army formations; the security service cites their commanders emergency credentials. Personal calls settled such disputes during the war. Now appointments and exercises are being delayed.\n\nSecurity chiefs want to approve every officer. The commanders argue that an army with two masters will remain a collection of garrisons. Northern advisers offer to mediate, at the price of access to personnel files.\n\n[STPGetPostwarCabinet]\n\nAn independent staff will improve military organisation while weakening internal control. Security oversight will strengthen the government but slow planning. This arrangement determines whose consent the northern crisis will require."
 ADISCORD_STP_pc.34.army: "Personnel decisions belong to the general staff."
 ADISCORD_STP_pc.34.security: "Appointments require security service approval."
 STP_pw_party_security_objects_tt: "Security service support: §R-8§!. The northern agreement will require army support of at least §Y60§!."
 STP_pw_party_army_objects_tt: "Army support: §R-8§!. The northern agreement will require security service support of at least §Y60§! and army support of at least §Y45§!."
 ADISCORD_STP_pc.35.t: "Whose money rebuilds the country"
 ADISCORD_STP_pc.35.d: "The tax offices have reopened, but their first returns fall short of the recovery budget. Trading houses offer to restore port traffic if the government funds initial contracts and protects them from emergency seizures. They will then handle supplier accounts, including northern ones.\n\nThe security service brings a different list: assets that can be seized immediately. This fills the treasury without bargaining with their owners, but damages future trade. Restored public offices will have to distribute the proceeds.\n\n[STPGetPostwarCabinet]\n\nThis also shapes the future delegation to Nodrul. Private contracts need the merchants trust. State distribution needs functioning ministries and at least limited cooperation from those handling cross-border payments."
 ADISCORD_STP_pc.35.requisition: "Authorise emergency requisitions."
 ADISCORD_STP_pc.35.contracts: "Fund the trading houses contracts."
 STP_pw_party_requisition_tt: "Treasury: §G+540§! £ADISCORD_economy_treasury_texticon. Merchant support: §R-12§!. The northern agreement requires restored civilian services and merchant support of at least §Y45§!."
 STP_pw_party_contracts_tt: "Cost: §Y360§! £ADISCORD_economy_treasury_texticon. The northern agreement requires merchant support of at least §Y60§!."
 STP_pw_party_offer_compact: "Offer a settlement of northern obligations"
 STP_pw_party_offer_compact_desc: "The cabinet, military authorities and economic representatives can offer Nodrul §Y1350§! £ADISCORD_economy_treasury_texticon in return for abandoning the invasion and recognising independence. Payment occurs only if Nodrul agrees; it may refuse. The reply window is §Y21 days§!, while invasion preparations continue. Signatory support and treasury funds are checked again on reply. The offer can be sent once."
 STP_pw_party_cabinet_backed_tt: "The chosen cabinet faction - conservatives, Borons or radical hedonists - retains at least §Y60§! support"
 STP_pw_party_command_backed_tt: "With an independent staff: army support is at least §Y60§!. With security oversight: security support is at least §Y60§! and army support at least §Y45§!"
 STP_pw_party_supply_backed_tt: "Complete the officer-school focus and either supply-service or professional-service focus; deliver at least §Y1§! industrial recovery project"
 STP_pw_party_credit_backed_tt: "With private contracts: merchant support is at least §Y60§!. After requisitions: deliver at least §Y1§! civilian-service recovery project and maintain at least §Y45§! merchant support"
 STP_pw_party_compact_no_pending_tt: "Nodrul is not already considering our offer"
 STP_pw_party_compact_time_tt: "At least §Y22 days§! remain before the northern invasion"
 STP_pw_party_compact_funds_tt: "The treasury holds §Y1350§! £ADISCORD_economy_treasury_texticon for payment upon Nodrulian consent"
 STP_pw_party_compact_offer_tt: "Nodrul receives an offer of §Y1350§! £ADISCORD_economy_treasury_texticon to end invasion preparations. Nothing is paid now. Refusal or loss of signatory support leaves the threat in place; negotiations do not extend the deadline."
 ADISCORD_STP_pc.36.t: "An offer from Stelander"
 ADISCORD_STP_pc.36.d: "The Stelander delegation brings a settlement signed by its cabinet, military authorities and representatives of the recovering economy. They offer a single treasury payment of 1350. In exchange, Nodrul must abandon invasion preparations and its demand to restore the protectorate.\n\nOur advisers warn that accepting would surrender the chance to restore the old arrangement by threat alone. Yet this is no longer a helpless government: the delegation has restored industry, domestic officer training and an agreement among several party groups behind it.\n\nWe can accept payment and an independent neighbour, or insist on our original demands. The decision remains ours. Military preparations continue until an answer is given."
 ADISCORD_STP_pc.36.refuse: "Money cannot replace our northern guarantees."
 ADISCORD_STP_pc.36.accept: "Accept payment and withdraw our demands."
 STP_pw_party_compact_refused_tt: "Invasion preparations continue on the existing deadline. No payment occurs."
 STP_pw_party_compact_settlement_tt: "Stelander pays Nodrul §Y1350§! £ADISCORD_economy_treasury_texticon. The northern threat ends and Stelander remains independent. Previously paid preparations remain with Stelander. The agreement creates no faction."
 ADISCORD_STP_pc.37.t: "The northern reply"
 ADISCORD_STP_pc.37.accepted: "The northern delegation accepts the settlement. Payment has been transferred and invasion preparations withdrawn. Advisers leave the military offices without a right to return under the old agreements.\n\nThe presidium argues over who secured the result. The staff cites military readiness, merchants point to the payment, and party officials claim cabinet unity. Each is only partly right: without the others, its signature would have carried little weight.\n\nIndependence has been preserved by treaty. The financial price is paid, but the people who built the majority remain at the table."
 ADISCORD_STP_pc.37.refused: "The northern agreement has not been signed. Nodrul either rejected the terms or the funds and political support behind them were no longer available when the reply arrived. No compensation was paid.\n\nNegotiations did not halt military preparations. If the northern threat is still active, its original deadline stands. The cabinet must rely on the supply system, command arrangements and internal agreements it has built."
 ADISCORD_STP_pc.37.a: "Report to the cabinet."
 ADISCORD_STP_pc.38.t: "A seat for the northern representative"
 ADISCORD_STP_pc.38.d: "The joint defence commission opens its first meeting. The northern representative immediately asks for a role in approving staff appointments. Nodrul sees this as a natural extension of the protectorate; our officers see a question of who will command them.\n\n[STPGetPostwarCommand]\n\nThe advisers propose a permanent joint bureau: faster operational coordination at the expense of a larger administration funded by us. Our commanders want the mission limited to liaison and training. Domestic appointments would strengthen the formations, but joint plans would require separate negotiation. The protectorate remains either way; its everyday workings are being decided."
 ADISCORD_STP_pc.38.joint: "Establish a permanent joint bureau."
 ADISCORD_STP_pc.38.domestic: "The mission trains; our staff makes appointments."
 ADISCORD_STP_pc.39.t: "After emergency rule"
 ADISCORD_STP_pc.39.d: "The last sign reading temporary administration has been removed from the chancery. Many offices and officials remain, but their authority now rests on the decisions made after the war.\n\n[STPGetPostwarCabinet]\n\n[STPGetPostwarCommand]\n\n[STPGetPostwarCredit]\n\n[STPGetPostwarNorth]\n\n[STPGetPostwarMission]\n\nThe party preserved the state by distributing power among those willing to sustain it. Ending emergency rule confirms that arrangement. Its participants retain their institutions and their memory of the concessions that created them.\n\n[STPGetPostwarConstitution]"
 ADISCORD_STP_pc.39.a: "The government resumes ordinary business."
 STP_pw_party_cabinet_apparatus_status: "The cabinet relies on the conservatives and continuity of appointments."
 STP_pw_party_cabinet_districts_status: "The Borons entered the cabinet as district representatives; their consent became part of government."
 STP_pw_party_cabinet_delegates_status: "Radical hedonists gained cabinet seats and a voice in renewing the apparatus."
 STP_pw_party_cabinet_unset_status: "The postwar cabinet has not yet been settled."
