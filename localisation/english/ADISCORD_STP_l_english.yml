 ADISCORD_STP_pw.6.t: "Medicine and Prohibition"
 ADISCORD_STP_pw.6.d: "Two reports arrive on Shabrat's desk with the new departmental regulations. Investigators list warehouses, intermediaries, front pharmacies and familiar political patrons. The drug trade built connections under the old regime that survived the fall of the Chamber. The security officials demand a total ban: every exception, they argue, will shelter the same old business.\n\nHospital doctors signed the second report. They are not asking for retail sales. They list wounded patients, difficult operations and cases where ordinary painkillers are insufficient. They propose supplies restricted to registered hospitals, with every shipment recorded and named staff responsible for dispensing it. This arrangement will require funding, inspections and trustworthy oversight.\n\nBoth sides want to keep dealers off the streets. They disagree on whether the door should remain open for hospitals. Shabrat must settle the question in law."
 ADISCORD_STP_pw.6.a: "A total ban. No exceptions."
 ADISCORD_STP_pw.6.b: "Allow medical use only."

 ADISCORD_STP_pw.7.t: "The Name Above the Entrance"
 ADISCORD_STP_pw.7.d: "The entrance to the Bronze Congress still bore the marks of the fighting. Workers had cleared the broken glass from the vestibule, but left the lettering on the facade alone. The temporary commandant sent Shabrat a short note: repairs could continue, but a new sign required an approved inscription.\n\nSome in the chancellery defended the old name. It had become part of the city's everyday language; defeating the Party did not require erasing every familiar word. District delegates proposed the Congress of Free Stelander: let the building bear the name of the country from which it would now draw its authority. Those charged with bringing yesterday's enemies to the same table preferred the Palace of Accord. Underground veterans submitted a fourth proposal, the House of Resistance, in memory of those who had not lived to see this day.\n\nFour sketches lay on the desk, each with a space for a signature. At the bottom of the sheet, the building superintendent had added that the old letters could be preserved in the city museum."
 ADISCORD_STP_pw.7.a: "Keep the name Bronze Congress."
 ADISCORD_STP_pw.7.b: "The Congress of Free Stelander."
