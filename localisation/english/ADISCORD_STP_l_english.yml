 STP_cw_take_fada: "§YBreak the Party Government§!"
 STP_cw_take_fada_desc: "Capturing the §YBronze Congress in Fada§! begins a §Y7-day§! siege. If the party does not retake the Congress in time, it counts as fallen and a §Y21-day§! government crisis begins; after the first fall, a later loss reopens the crisis at once. The party can retake the Congress or relocate its cabinet. After relocation, victory requires capturing the new cabinet district while holding the Congress, or ordinary capitulation.\n\n[STPGetCongressCabinet]\n\nThis general objective renews after 365 days without deciding the war. The Last Banquet operation keeps its separate deadline."
 STP_cw_hold_fada: "§RPreserve the Party Government§!"
 STP_cw_hold_fada_desc: "Losing the §YBronze Congress§! begins a §Y7-day§! siege: the government keeps working and Fada raises its militia. If the Congress is not retaken in time, it counts as fallen and a §Y21-day§! crisis begins; after the first fall, a later loss reopens the crisis at once. Retake it or finish relocating the cabinet to a held district outside Fada. Free relocation takes 14 days; an emergency cabinet or prepared headquarters is faster. After relocation, losing the new district while the Congress remains lost defeats the party. Ordinary capitulation also ends the war.\n\n[STPGetCongressCabinet]\n\nThis general objective renews after 365 days and does not replace the crisis deadline."
 STP_cw_fada_captured_tt: "The party government is not functioning: its recovery deadline expired or its relocated cabinet district was lost while the Bronze Congress remains lost."
 STP_cw_fada_victory_tt: "§GThe party government collapses. Shabrat wins the civil war.§!"
 STP_cw_fada_defeat_tt: "§RThe government can no longer continue the war. The party is defeated.§!"
 STP_cw_fada_timeout_tt: "§YThe mission renews if the civil war continues. The countdown does not decide the war.§!"
 STP_pc_council_revanche_title: "Kefreyt Returns to the Passes"
 STP_pc_council_revanche_desc: "The Council of Commanders, installed after Kefreyt’s defeat, has rejected the peace settlement. Rebuilt columns are crossing Stelander’s border again. This is no remnant of Solgalov’s expedition: the Council has deliberately chosen a war of revenge.\n\nShabrat has ruled out another limited peace. Should the Council lose, Kefreyt will be annexed in full. A Kefreyt victory, on the other hand, will install a subordinate administration in Stelander."
 STP_pc_council_revanche_response: "This time, we finish it."

 STP_pw_regional_citizenship: "Common Citizenship"
 STP_pw_regional_citizenship_desc: "Victory changes borders, not civil administration. A common citizenship register will support the gradual integration of annexed neighbouring regions into the country."
 STP_pw_cadastral_commissions: "Land Commissions"
 STP_pw_cadastral_commissions_desc: "Reconcile disputed land titles, archives and tax records. Commission rulings give local institutions a workable legal basis."
 STP_pw_regional_connections: "Connect Regional Centres"
 STP_pw_regional_connections_desc: "Reconnect regional centres with the common market."
 STP_pw_workshop_contracts: "Orders for Local Workshops"
 STP_pw_workshop_contracts_desc: "Give local workshops civilian orders and bring their output into the common production register. Annexed regions that need employment will receive priority."
 STP_pw_local_officer_courses: "Local Officer Courses"
 STP_pw_local_officer_courses_desc: "Common training standards connect local garrisons to the national command. Instructors receive equipment for signals, engineering and supply duties."
 STP_pw_common_market: "A Common Domestic Market"
 STP_pw_common_market_desc: "Unify land records, transport and production into one economic system."
 STP_pw_kefreyt_settlement: "Administer Former Kefreyt"
 STP_pw_kefreyt_settlement_desc: "Kefreyt has lost its independence, but its industry and population still require a settlement. We will restore military production in annexed Kefreyt territory."
 STP_postwar_administration: "Citizenship and Regional Integration"
 STP_postwar_administration_desc: "New borders require a common citizenship system. Integrate multiple eligible neighbouring regions simultaneously, each for §Y50§! £political_power_texticon over §Y120 days§!. Peace, independence, direct ownership and control, and a border with a directly held core are required. Cancellation refunds the payment."
 STP_pw_nationalise_region: "Nationalise Region"
 STP_pw_nationalise_region_desc: "Region: §Y[FROM.GetName]§!.\n\nFor §Y50§! £political_power_texticon over §Y120 days§!, this region becomes a core of our country under normal game rules. It must be directly owned and controlled by us and border a directly held core. Multiple eligible regions may be integrated simultaneously; each programme is paid separately. War, loss of control or other eligibility conditions cancels the project and refunds its payment. The new core opens its neighbours to further integration."
 STP_pw_integration_target_tt: "The civil war has been won and settled; the country is independent and at peace. The region is directly owned and controlled, is not already a core and borders a directly held core."
 STP_pw_integration_slot_tt: "This region is not reserved by an existing integration programme."
 STP_pw_integration_complete_tt: "The region is now a §Ycore state§!. Its directly held neighbours may now become available for further integration."
