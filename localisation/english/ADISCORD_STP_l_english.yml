 STP_ch_nominate_4:0 "£STP_ch_merchants_texticon Negotiations: Pavel Lanskoy"
 STP_ch_nominate_5:0 "£STP_ch_security_texticon Negotiations: Vera Korvina"
 STP_ch_nominate_4_desc:0 "Negotiate subsequent agreements for the economic bloc. Lanskoy starts with the merchants but needs other groups for a majority. His programme offers production agreements and a market charter. The negotiator is chosen once: selecting one closes the other candidates."
 STP_ch_nominate_5_desc:0 "Negotiate subsequent agreements for the security service. Korvina promises central administration and order; her agency will need separate judicial oversight. The negotiator is chosen once: selecting one closes the other candidates."
 STP_ch_nominate_4_requirements:0 "The campaign and ballot remain open; no negotiator has been selected yet."
 STP_ch_nominate_5_requirements:0 "The campaign and ballot remain open; no negotiator has been selected yet."
 ADISCORD_STP_ch.6.4:0 "Confirm Pavel Lanskoy"
 ADISCORD_STP_ch.6.5:0 "Confirm Vera Korvina"
 STP_ch_production_agreements:0 "Production Agreements"
 STP_ch_production_agreements_desc:0 "Lanskoy links rebuilt enterprises through long-term orders. Merchants gain predictable demand and military industry gains higher output. Other coalition promises remain binding."
 STP_ch_production_agreements_tt:0 "Military factory output: §G+12%§!."
 STP_ch_market_charter:0 "Domestic Market Charter"
 STP_ch_market_charter_desc:0 "Expand trade and entrust part of supply to independent contractors. Higher revenue brings disruption risks: prepare a supply reserve or fulfil the merchants agreement before the final review."
 STP_ch_market_charter_tt:0 "Trade income: §G+12%§!. Without a reserve or a fulfilled trade pledge, supply shortages become a risk."
 STP_ch_security_directorate:0 "Unified Security Directorate"
 STP_ch_security_directorate_desc:0 "Korvina unites local services under one directorate. Centralization strengthens order but raises administrative spending and grants exceptional powers. Accountability must be settled separately."
 STP_ch_security_directorate_tt:0 "Stability: §G+8%§!; administration costs: §R+5%§!. The service's emergency powers risk a departmental veto without judicial oversight."
 STP_ch_register_of_powers:0 "Register of Powers"
 STP_ch_register_of_powers_desc:0 "Define the everyday responsibilities of the directorate and local administrations. Independent review of complaints requires a separate agreement with the service; a register alone does not limit its emergency powers."
 STP_ch_register_of_powers_tt:0 "Political power gain: §G+12%§!."
 STP_ch_security_review:0 "Judicial Oversight of the Service"
 STP_ch_security_review_desc:0 "Limit exceptional service powers and introduce independent complaint review. Resolves its crisis while retaining the directorate. If unresolved, the outcome is a loss of 8 stability points and a departmental veto: -10% political power gain."
 STP_ch_security_review_requirements:0 "An elected government is in office; the service holds emergency powers; judicial oversight is not yet in place."
 STP_ch_security_review_cost:0 "§Y75§! £political_power_texticon"
 STP_ch_security_review_cost_blocked:0 "§R75§! £political_power_texticon"
 STP_ch_security_review_cost_tooltip:0 "Cost: §Y75§! £political_power_texticon"
 STP_ch_risks_security:0 "§RThe security service lacks judicial oversight.§!"

 STP_pw_party_constitution_military_status:0 "The congress entrusted its mandate to the military leadership, whose programme rests on regular service and unified command."

 STP_pw_party_constitution_economic_status:0 "The congress elected Pavel Lanskoy. His government pursues production agreements and a market charter; supply must withstand the additional strain."

 STP_pw_party_constitution_security_status:0 "The congress elected Vera Korvina. The Security Directorate holds a political mandate; judicial oversight determines the limits of its powers."

 STP_ps_plot_1: "Underground supply sabotage"
 STP_ps_plot_1_desc: "Shabrat’s agents have infiltrated transport offices. In §Y21 days§!, sabotage will increase supply consumption by §R8%§! and reduce organisation recovery by §R5%§! for §Y21 days§!. Route security takes §Y7 days§!; start before the last seven days of the countdown."
 STP_ps_plot_2: "Forged orders in preparation"
 STP_ps_plot_2_desc: "The underground is copying headquarters seals and recruiting couriers. In §Y21 days§!, forged orders will reduce planning speed by §R10%§! and organisation recovery by §R5%§! for §Y21 days§!. Checking headquarters communications takes §Y7 days§!."
 STP_ps_plot_3: "Underground strike preparations"
 STP_ps_plot_3_desc: "Shabrat’s organisers plan a military factory strike in §Y21 days§!. Ignoring it costs §R2%§! stability and reduces military factory output by §R5%§! for §Y21 days§!. Talks with workers take §Y7 days§!."
 STP_ps_counter_plot_1: "Secure the supply routes"
 STP_ps_counter_plot_1_desc: "Check manifests, guard depots and replace compromised dispatchers. Disrupt the plot in §Y7 days§! for §Y10§! £political_power_texticon and §Y300§! £ADISCORD_economy_treasury_texticon. The threat countdown continues during this work."
 STP_ps_counter_plot_2: "Verify headquarters communications"
 STP_ps_counter_plot_2_desc: "Check seals, replace codes and verify courier lists. Disrupt the plot in §Y7 days§! for §Y15§! £political_power_texticon and §Y10§! £command_power_texticon. The threat countdown continues during this work."
 STP_ps_counter_plot_3: "Negotiate with factory delegates"
 STP_ps_counter_plot_3_desc: "Address family supply complaints and overdue payments to deny the underground support. Disrupt the plot in §Y7 days§! for §Y10§! £political_power_texticon and §Y450§! £ADISCORD_economy_treasury_texticon. The threat countdown continues during this work."
 STP_ps_counter_plot_paid_tt: "Pay for a §Y7-day§! counter-operation. If the war or threat ends first, unfinished work refunds the payment. Starting the counter-operation does not stop the threat countdown."
 STP_ps_counter_plot_result_tt: "If the enemy is still preparing, disrupt the plot and close this threat. No new threat will begin for at least §Y35 days§!."
 STP_ps_supply_disrupted: "Disrupted supply schedules"
 STP_ps_supply_disrupted_desc: "Shabrat’s underground disrupted the transport offices. Dispatchers are restoring routes and timetables."
 STP_ps_false_orders: "Forged orders"
 STP_ps_false_orders_desc: "Command is checking contradictory orders and restoring trust in headquarters communications."
 STP_ps_factory_strike: "Military factory stoppage"
 STP_ps_factory_strike_desc: "Underground organisers exploited workers’ grievances to disrupt military production."
 ADISCORD_STP_cw.207.t:0 "The war behind the lines"
 ADISCORD_STP_cw.207.1:0 "A transport office discovered manifests for shipments that never left their depots. Several dispatchers have disappeared, while an intercepted courier carried a list of warehouses. Security officers believe Shabrat’s supporters are preparing a coordinated sabotage operation.\n\nThe attack is expected in about three weeks. Securing routes and checking staff will take seven days. Without a response, the army will consume more supplies and recover organisation more slowly for three weeks. The counter-operation is available in the war council decisions."
 ADISCORD_STP_cw.207.2:0 "A district headquarters received a redeployment order that central command had never issued. Its seal was forged, but the paper and signature were convincing. Checks on the couriers exposed an underground network working for Shabrat.\n\nIn about three weeks, the network intends to distribute an entire series of such orders. Verifying codes and courier lists takes seven days. Otherwise, the confusion will hinder planning and organisation recovery for three weeks. A counter-operation is available in the war council decisions."
 ADISCORD_STP_cw.207.3:0 "Identical leaflets are circulating in military factories, calling for a coordinated stoppage over delayed wages and shortages affecting workers’ families. Factory delegates confirm that the organisers receive instructions from Shabrat’s supporters.\n\nThe strike is planned for about three weeks from now. Talks and payments take seven days. Failure to intervene costs two points of stability and reduces military factory output by five percent for three weeks. Talks can be opened through the war council decisions."
 ADISCORD_STP_cw.207.a:0 "Inform the war council."
