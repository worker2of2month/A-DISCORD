 STP_cw_kefreyt_volunteers_cost_tt: "Kefreyt will provide £manpower_texticon §Y23700§! men, £infantry_equipment_texticon §Y1830§! rifles, §Y144§! sets of squad weapons, §Y90§! support equipment, §Y180§! artillery pieces and §Y60§! anti-air weapons. The entire package is paid for once the personnel and equipment have been assembled. If reserves are insufficient, Kefreyt will continue assembling the force; the civil war does not cancel the agreement."
 STP_ARMY_KEFREYT_COMMITMENT: "\nKefreyt has prepared another §Y3§! volunteer divisions with artillery and anti-air support for the resistance. They will remain until the war ends."
 STP_cw_credentials_review: "Verification of Delegates' Credentials"
 STP_cw_credentials_review_desc: "The Party secretariat challenges Shabrat's delegate lists wherever no one can verify the signatures. Every §Y35 days§!, the absence of a functioning administration in [2.GetName] or [3.GetName] costs §R8%§! legitimacy for each missing administration. No legitimacy is lost if both remain intact. The commission can destroy the organisation: provide cover, open the civil registers or rebuild it before the next review. The headquarters focus postpones the current review by §Y80 days§! once. Campaigning restores lost support, but occupies the same slot as military preparation."
 STP_cw_monaya_credentials_missing_tt: "There is no functioning Shabrat administration under our control in [2.GetName]"
 STP_cw_niansas_credentials_missing_tt: "There is no functioning Shabrat administration under our control in [3.GetName]"
 ADISCORD_STP_preparation.20.t: "Office Hours"
 ADISCORD_STP_preparation.20.d: "By eight in the morning, two queues had already formed outside the district administration. One was waiting for certificates confirming payments to reservists' families; the other was trying to find out exactly who the new call-up would affect. The secretary brought a second chair into the corridor, placed an inkwell on the windowsill and began writing down names on the back of an old poster. The direct telephone line to the capital had been silent all morning.\n\nThree documents lay on the district chief's desk which, in the past, would not even have reached discussion without presidential permission. An emergency fund had to be opened after a road collapsed, a doctor's appointment to a mountain settlement confirmed, and fuel released to a reserve battalion. The requests had been sent yesterday. No reply had arrived.\n\nAt noon, new forms arrived from the capital. Every one still bore the printed name of Pyotr Ivanov. The district chief took the first sheet, stared for a long time at the empty signature line, then wrote his own surname and added: 'On the instructions of the presidential administration.' He had received no such instructions. An hour later, seven more documents had been processed in the same way.\n\nNo one called it disobedience. People needed their money, the road needed repairing, and fuel had to be issued. The state kept working because its officials were gradually learning to make decisions that had once existed only after one man's signature.\n\nBy evening, the telephone from the capital still had not rung. The queues were booked in again for tomorrow."
 ADISCORD_STP_preparation.20.a: "The work continued in the name of a man who no longer directed it."
 ADISCORD_STP_preparation.21.t: "A Place at the Table"
 ADISCORD_STP_preparation.21.d: "Twelve cups were set out for the morning meeting, as usual. Ministers and department heads took eleven places. The twelfth cup remained before the chairman's empty seat.\n\nIvanov's assistant opened a folder and began reading the agenda. The first item required the president's signature. So did the second. Attached to the third was a note from the War Ministry requesting confirmation of an order issued several days earlier. No one in the room knew whether Ivanov would see any of these papers.\n\nIn the past, a meeting like this would have stopped. A decision taken without the president was considered provisional, and a document without his signature was returned to its sender. Today, Hedersett asked the assistant to continue. One minister objected. Another pointed out that the port could not wait for the chairman's recovery. Within minutes, those present were allocating expenditure, appointing officials and approving orders Ivanov had never seen.\n\nNo one uttered the word 'successor'. There was no need.\n\nBy the end of the meeting, the papers were no longer in front of the empty chair. They lay before Hedersett. The president's assistant noticed first. He said nothing and simply continued taking the minutes.\n\nAfter the meeting, an attendant began collecting the cups. When she reached Ivanov's place, she paused for a moment. The cup was untouched. Tomorrow's list still called for twelve.\n\nBut for the first time in decades, eleven people had governed Stelander for an entire day."
 ADISCORD_STP_preparation.21.a: "The country was learning to live without the man who was still its president."
 NOD_cw_call_ain: "Call in Ainholm's Forces"
 NOD_cw_call_ain_desc: "The Ainholm Mandate's forces will enter the northern war on our side. The colony's participation will end with the northern campaign."
 SRP_council_authority: "District Council Authority"
 SRP_council_authority_desc: "The districts supply their own units and retain civilian administration. Proximity to local depots eases supply, but the joint headquarters must coordinate its orders with several councils."
 SRP_emergency_command: "Emergency Headquarters Powers"
 SRP_emergency_command_desc: "Kefreyt's attack forced the councils to entrust the coordination of defence to headquarters. Commanders organise unit rotations and a common operational plan. These powers last only until the war with Kefreyt ends; Shabrat's victory or defeat does not revoke them."
 SRP_council_supply: "Paid Supplies for the Districts"
 SRP_council_supply_desc: "Shabrat's government has paid for weapons and work at local workshops. For 42 days, military factory output increases by 20% and organisation recovery by 10%. The programme ends when the war against Kefreyt is over or independence is lost."
 STP_cw_council_guarantees: "Guarantees to the District Councils"
 STP_cw_council_guarantees_desc: "The pre-war agreement survived the split. Shabrat promised to preserve the councils' autonomy and gained the ability to finance their supplies if Kefreyt attacks. Once civilian government returns, a decision must be made on whether that promise will become a permanent charter."
 STP_cw_republican_charter: "Charter of District Cooperation"
 STP_cw_republican_charter_desc: "Stelander has recognised the republics' independence. Joint orders and agreements between workshops accelerate civilian industrial construction on both sides. The charter does not create a military alliance or draw its signatories into one another's wars."
 STP_cw_central_authority: "Central Government Powers"
 STP_cw_central_authority_desc: "The government has refused to formalise its commitments to the district councils. Unified state procurement increases military factory output by 10% and reduces administrative expenditure by 5%. The republics are no longer promised supplies or joint programmes."
 SRP_distrust_stelander: "Distrust of Stelander"
 SRP_distrust_stelander_desc: "Shabrat's government has retreated from its pre-war guarantees. The councils are strengthening the defence of their own territories and preparing to rely on themselves. Refusing the charter does not, in itself, start another war."
 STP_cw_fund_republican_supplies: "Fund Supplies for the Republics"
 STP_cw_fund_republican_supplies_desc: "For 300 treasury units, we will purchase supplies from private vendors for the republics: 1200 rifles and 30 support equipment will reach their stockpiles. District workshops and unit recovery will receive support for 42 days. Our own weapons stockpile is not spent. Another shipment may be funded after 42 days if the republics' war with Kefreyt is still ongoing."
 STP_cw_republican_supplies_available_tt: "Both sides are independent and honour the agreement; the republics are at war with Kefreyt, have not capitulated and have completed their previous supply programme"
 STP_cw_republican_supplies_cost: "£ADISCORD_economy_treasury_texticon §Y300§!"
 STP_cw_republican_supplies_cost_blocked: "£ADISCORD_economy_treasury_texticon §R300§!"
 STP_cw_republican_supplies_cost_tooltip: "Cost: £ADISCORD_economy_treasury_texticon §Y300§!"
 STP_cw_negotiate_republican_charter: "Negotiate a District Charter"
 STP_cw_negotiate_republican_charter_desc: "Civilian government has been restored. We can now return to the pre-war guarantees and settle relations with the independent republics. Their separate war with Kefreyt does not prevent negotiations."
 STP_cw_republican_charter_available_tt: "Shabrat has defeated the Party; both sides are independent, have not capitulated, maintain the pre-war guarantees and are not already in negotiations"
 ADISCORD_STP_cw.90.t: "Signatures on the Charter"
 ADISCORD_STP_cw.90.d: "The district council representatives brought a copy of the agreement signed before the split. The paper has yellowed along its folds; beside Shabrat's signature are those of the people who kept local government running throughout it all.\n\nThe councils now propose to confirm the republics' independence and open joint procurement for civilian workshops. The document does not include a military alliance. The central chancellery proposes concentrating orders at our own military factories and reducing consultation with districts which no longer answer to the capital. Refusing the charter will end assistance to the councils.\n\nThe representatives await an answer. The war changed the map, but the signatures remain the same."
 ADISCORD_STP_cw.90.a: "Confirm the guarantees and sign the charter."
 ADISCORD_STP_cw.90.b: "Leave these matters to the central chancellery."
 ADISCORD_STP_cw.90.close: "Circumstances have changed."
 ADISCORD_STP_cw.91.t: "A Letter from the District Councils"
 ADISCORD_STP_cw.91.guaranteed: "The letter arrived with a lorry driver. The councils confirmed the pre-war agreement: the republics would govern their own districts independently, while Shabrat would maintain his promised guarantees.\n\nA list of workshops and depots was attached on the reverse. If Kefreyt attacks, paid arms shipments can be organised through them. At the bottom, a different hand had added: 'We will still need the agreement after the war.'"
 ADISCORD_STP_cw.91.independent: "The district councils' letter contains no request for a governor to be appointed. The republics announced the formation of their own administration and proposed avoiding clashes along the border.\n\nThe military demands a common defence plan; local representatives want to retain control of supplies and personnel. If Kefreyt attacks, headquarters will receive emergency powers, but the councils have no intention of dissolving themselves. Victory in the capital will not settle their future."
 ADISCORD_STP_cw.91.a: "Acknowledged."
 STP_cw_public_campaign_basis_tt: "At least one of the three campaigns remains unused, and its electoral stage has begun. Shabrat's second campaign requires an administration in Monaya or Niansas; the third requires both. Each required administration must have operated continuously for 21 days."
 STP_cw_delegate_support_available_tt: "Our side's advantage on the legitimacy scale is below 55%"
 STP_cw_command_timing_no_election: "The election has not begun. The agreement remains valid for only 50 days after negotiations conclude."
 STP_cw_command_timing_early: "§YToo early for the normal election result.§! Negotiations take 35 days, after which the agreement lasts for 50 days. An agreement signed now may expire before the votes are counted; signing early does not move the election date."
 STP_cw_command_timing_late: "§RNegotiations can no longer finish before the normal election result.§! No more than 35 days remain until then."
 STP_cw_command_timing_ready: "§GThe agreement will take effect in time and remain valid for the normal election result.§! Negotiations take 35 days, after which the commitment lasts for 50 days."
 STP_cw_military_committee_fund: "Military Committee Funds"
 STP_cw_military_committee_fund_desc: "The military proposes using funds raised by supporters to equip an assault formation. The committee will receive the money immediately, but civilian delegates will see this as preparation for a seizure of power. Construction of our own workshops will have to wait."
 STP_cw_military_fund_tt: "The treasury will receive £ADISCORD_economy_treasury_texticon §Y18000§! - the cost of three reinforced divisions. Each order through the already unlocked decision takes §Y28 days§! and occupies a preparation slot; the focus itself creates no units. Any unspent money is divided with the common treasury when the split occurs."
 STP_cw_abila_workshops: "Abilia Workshops"
 STP_cw_abila_workshops_desc: "We will establish military production in Abilia: four military factories and four building slots. The workshops will not deliver a ready assault formation before the uprising, but they will be able to replace losses after the first battles. The military committee will not receive funding for a separate reinforced formation."
 STP_cw_abila_workshops_tt: "When the split occurs, Abilia and its four military factories pass to the resistance. Until the division, their output enters the common state stockpile; production is assigned through the normal interface."
 STP_cw_election_time_21_tt: "More than 21 days remain until the election result: the campaign can finish in time"
 STP_cw_election_time_14_tt: "More than 14 days remain until the election result: negotiations can finish in time"
 STP_pw_republic_dynamic: "Republic of the Districts"
 STP_pw_republic_dynamic_desc: "The republic's civilian institutions, restored economy and professional army. Post-war decisions determine their combined capabilities."
 STP_pw_party_dynamic: "The Renewed Presidium"
 STP_pw_party_dynamic_desc: "Permanent Party administration, industrial planning and a regular army. Their capabilities depend on the chosen model of post-war reconstruction."
 STP_pw_reconstruction_available_tt: "Our side has won the civil war and its wartime programmes have ended."
 STP_pw_industry_reserve_tt: "If no suitable site is available, the treasury will receive a construction reserve instead of a new factory: £ADISCORD_economy_treasury_texticon §Y900§!. The permanent industrial specialisation is retained."
 STP_pw_republic_new_republic: "Services Return to the Districts"
 STP_pw_republic_new_republic_desc: "Residents need doctors, postmen and civil servants as much as they need a new constitution. We will open a paid public-services programme and restore trust in the new administration."
 STP_pw_republic_district_authority: "District Administrations"
 STP_pw_republic_district_authority_desc: "Military commandants will transfer economic affairs to permanent administrations. Common rules will reduce expenditure and spare the cabinet from settling every local dispute."
 STP_pw_republic_civil_records: "Restore the Registers"
 STP_pw_republic_civil_records_desc: "Without records of residents, property and obligations, neither benefits nor taxes can be administered. Archivists and local councils will bring the surviving documents together. Nodrul will be notified that its former mandate is under review."
 STP_pw_republic_open_settlement: "Retain Local Personnel"
 STP_pw_republic_open_settlement_desc: "We will retain specialists who took no part in repression. Swift reconciliation will build trust, but command will have to accommodate the diversity of the new administration."
 STP_pw_republic_firm_settlement: "Review Appointments"
 STP_pw_republic_firm_settlement_desc: "District commissions will review appointments. The cabinet will gain a more dependable administration at the cost of prolonged disputes and weaker local support."
 STP_pw_republic_civil_charter: "Civil Service Charter"
 STP_pw_republic_civil_charter_desc: "We will define officials' responsibilities, the complaints procedure and the limits of district administrations' powers. These rules will apply under any future political settlement."
 STP_pw_republic_restore_roads: "Reconnect the Economy"
 STP_pw_republic_restore_roads_desc: "We will link the capital to district centres and restore road services. The first works will improve one road, while further construction will proceed faster."
 STP_pw_republic_homes_for_returnees: "Bring Working Families Home"
 STP_pw_republic_homes_for_returnees_desc: "Housing and reliable roads will allow evacuated families to return. We can then finance the reopening of workshops where returning specialists will work."
 STP_pw_republic_civil_workshops: "Cooperative Workshops"
 STP_pw_republic_civil_workshops_desc: "We will bring small workshops together in durable production cooperatives. A new civilian factory will serve as the model for the next wave of construction."
 STP_pw_republic_accountable_arsenals: "Arsenals under Civilian Oversight"
 STP_pw_republic_accountable_arsenals_desc: "The army will retain the arms-production capacity it needs, but its operations will be brought into the public state budget. We will restore one factory and organise supplies to the plants already operating."
 STP_pw_republic_industrial_settlement: "An Economy without Emergency Orders"
 STP_pw_republic_industrial_settlement_desc: "We will coordinate orders for civilian workshops and arsenals so that they no longer compete for the same workers and machinery. Production will receive a steady flow of work."
 STP_pw_republic_army_register: "Register the Frontline Units"
 STP_pw_republic_army_register_desc: "We will bring separate detachments into a common army register and open a personnel-training programme. The divisions will remain, but replacements and supplies will be centrally organised."
 STP_pw_republic_officer_school: "School for Field Commanders"
 STP_pw_republic_officer_school_desc: "Resistance commanders will teach new officers the lessons that helped their units survive. A common curriculum will combine junior commanders' initiative with regular training."
 STP_pw_republic_supply_service: "District Supply Service"
 STP_pw_republic_supply_service_desc: "District depots will operate to a common schedule. Units will recover their combat readiness faster and lose fewer supplies in transit."
 STP_pw_republic_professional_service: "The Republic's Professional Army"
 STP_pw_republic_professional_service_desc: "Standing formations will receive common service regulations and replacement training. This is the foundation both for defending the passes and for future campaigns abroad."
 STP_pw_republic_settled_state: "Conclude Emergency Reconstruction"
 STP_pw_republic_settled_state_desc: "Civilian services, workshops and the regular army must be functioning before the emergency budget closes. Completing three paid programmes will consolidate industrial growth and restore the population's confidence."
 STP_pw_party_new_republic: "The State after Ivanov"
 STP_pw_party_new_republic_desc: "Victory preserved the Party, but did not restore the old system of government. Hedersett must rebuild the ministries, industry and the guard, then define relations between the centre and the district organisations. An agreement with local elites and an emergency chain of command are distinct domestic courses. Relations with Nodrul are settled separately."
 STP_pw_party_district_authority: "District Secretariats"
 STP_pw_party_district_authority_desc: "We will restore a single chain of administration from the presidium to the districts. Permanent secretariats will reduce the expense of parallel commissions and speed up the execution of decisions."
 STP_pw_party_civil_records: "Wartime Lists"
 STP_pw_party_civil_records_desc: "Party files list rebels and draft evaders alongside engineers who failed to obtain permission to evacuate. A review of their cases will determine whom we return to work and whom we declare an enemy."
 STP_pw_party_open_settlement: "An Agreement with District Elites"
 STP_pw_party_open_settlement_desc: "We will bring specialists back and recognise the district organisations' role in reconstruction. The course that follows will formalise their powers and retain local personnel. This will accelerate civilian work at the cost of some freedom for the central secretariat."
 STP_pw_party_firm_settlement: "An Emergency Party Hierarchy"
 STP_pw_party_firm_settlement_desc: "Hedersett regards uncertainty over appointments as the continuation of war by other means. We will establish personnel commissions and a single chain of command. A security reserve will become a separate paid measure. Strengthening the centre comes at the price of purges, the costs of oversight and the loss of specialists."
 STP_pw_party_civil_charter: "Charter of the Party State"
 STP_pw_party_civil_charter_desc: "After the congress of district secretariats or the creation of an executive secretariat, we will establish a permanent framework for the Party state. The charter does not erase the chosen model: the negotiated system preserves local initiative, while the hierarchy preserves central control. Military, economic and foreign-policy choices remain independent."
 STP_pw_party_restore_roads: "Restore the Routes to the Ports"
 STP_pw_party_restore_roads_desc: "Military transport disrupted the districts' links to the coast. We will restore a common plan for the road services so that cargo can reach the ports again and workers can reach their factories."
 STP_pw_party_homes_for_returnees: "Labour District Reception Offices"
 STP_pw_party_homes_for_returnees_desc: "District reception offices will match workforce registers with housing and returning families. We can then finance the reconstruction of one controlled port district: a civilian factory and its access routes."
 STP_pw_party_civil_workshops: "Restore the Resort Economy"
 STP_pw_party_civil_workshops_desc: "Before the war, coastal revenue sustained a substantial part of the state apparatus. We will restore civilian enterprises and allow the houses to resume servicing ports and resorts. These funds can no longer be promised to defence plants at the same time."
 STP_pw_party_accountable_arsenals: "War Orders instead of the Season"
 STP_pw_party_accountable_arsenals_desc: "We will postpone the return of the holiday season: materials, workers and new capacity will go to defence enterprises. The army will grow stronger sooner, but the civilian economy will have to wait."
 STP_pw_party_industrial_settlement: "The Post-war Production Plan"
 STP_pw_party_industrial_settlement_desc: "Commercial reconstruction or the defence combine has already determined the economy's priority. We will now bring taxation, capital expenditure and production plans together in a normal post-war budget. The differences between the two models remain; this shared focus merely ends emergency administration."
 STP_pw_party_army_register: "Take Stock of the Internal Forces"
 STP_pw_party_army_register_desc: "The internal troops won the struggle for government, but their departmental rolls are no basis for a regular army. We will count the units and open a paid re-equipment programme: weapons, support equipment and trucks will enter the common army stockpile."
 STP_pw_party_officer_school: "A Headquarters, Not a Commandant's Office"
 STP_pw_party_officer_school_desc: "Commanders were trained to guard buildings and suppress unrest. Now they must prepare operations involving several formations, work with maps and maintain communications with neighbouring units."
 STP_pw_party_supply_service: "Supply the Border Units"
 STP_pw_party_supply_service_desc: "We will make logistics the organising principle of the new army. Permanent depots and unified accounting will replace departmental allocations, while border units receive priority according to actual need. This course leads to district defence corps and rules out reliance on an independent field headquarters."
 STP_pw_party_professional_service: "An Army beyond the Capital"
 STP_pw_party_professional_service_desc: "We will make field service the organising principle of the new army. The internal troops will adopt a common programme of manoeuvres, joint exercises and commander training for multi-formation operations. This course leads to a field general staff and rules out deep specialisation in district logistics."
 STP_pw_party_settled_state: "End Emergency Rule"
 STP_pw_party_settled_state_desc: "Emergency rule can end only after four questions have been settled: how Party authority is organised, how the economy earns its revenue, what kind of army the country maintains, and on what terms it exists alongside Nodrul. Unfinished purges will then cease, and the presidium will take responsibility for the state's ordinary life."
 STP_pw_party_district_congress: "Congress of District Secretariats"
 STP_pw_party_district_congress_desc: "Compromise must become an institution rather than a series of personal promises. The district secretariats will receive a regular congress and the right to coordinate some economic decisions in advance. The centre loses a little operational freedom, but gains predictable execution, a tax base and fewer reasons to govern through emergency commissions again."
 STP_pw_party_executive_secretariat: "Executive Secretariat"
 STP_pw_party_executive_secretariat_desc: "A single chain of orders needs a body that checks compliance every day. The executive secretariat will bring appointments, reporting and departmental oversight into one administration. Decisions will cost the centre less and move faster politically, but constant pressure on the districts will leave its mark on internal stability."
 STP_pw_party_commercial_recovery: "Reopen the Coastal Economy"
 STP_pw_party_commercial_recovery_desc: "We will lift emergency restrictions on civilian commerce, expand warehousing and restore long-term shipping. Port contracts must become the foundation of reliable trade."
 STP_pw_party_defence_combine: "Defence Production Combine"
 STP_pw_party_defence_combine_desc: "We will organise state orders into a single production chain covering metalworking, repairs, artillery and small arms. Military purchasers and factory management will coordinate the combine’s work."
 STP_pw_party_fortress_corps: "District Defence Corps"
 STP_pw_party_fortress_corps_desc: "If the new army's first task is to survive the next crisis, well-supplied district corps must form its backbone. Common depots, replacement routes and defensive plans will reduce supply consumption and accelerate unit recovery. This is the path to a durable front, not a rapid offensive."
 STP_pw_party_field_staff: "Field General Staff"
 STP_pw_party_field_staff_desc: "A regular army must be able to operate beyond the capital's guard posts and prepare its operations in advance. The field staff will receive authority to coordinate divisional plans, conduct manoeuvres and judge commanders by their performance in the field. The price is foregoing deeper specialisation in district logistics."
 STP_pw_party_joint_defence_board: "Joint Defence Commission"
 STP_pw_party_joint_defence_board_desc: "The renewed protectorate must be more than a paper arrangement. Stelander will bring its own headquarters and northern advisers into a permanent commission, formalising the exchange of plans and supply standards. Even if a separate arms deal falls through, the system linking us to our patron will remain."
 STP_pw_party_armed_neutrality: "Armed Independence"
 STP_pw_party_armed_neutrality_desc: "Rejecting a patron makes sense only if we can defend that decision. We will build an arms reserve, standardise supply and require industry to maintain mobilisation stockpiles. Independence will become a funded military policy rather than a declaration."
 STP_pw_party_foreign_settlement: "Confirm Our International Status"
 STP_pw_party_foreign_settlement_desc: "Our international status can be considered settled only after the chosen course has been tested in practice. A protectorate settles the question through a treaty with Nodrul. Independence must survive its ultimatum and, if an invasion begins, force the north to recognise a sovereign Stelander through military action."
 STP_pw_infantry_lessons_bonus: "Lessons of the Civil War"
 ADISCORD_STP_preparation.8.pending: "Kefreyt agreed to help, but its quartermasters returned the requisition marked as incomplete. The units are still being assembled. The agreement has not been cancelled, even if Stelander splits before they are ready.\n\nShabrat's headquarters read that wording several times. The assistance exists on paper. Now they must hold the route by which it can arrive."
 ADISCORD_STP_preparation.8.delivered: "Abilia heard the columns before it saw them. The vehicles entered the city at dawn, followed by artillery and anti-air weapons. A liaison officer handed Shabrat a packet of orders and briefly reported that three divisions were ready to come under his command.\n\nThere was no ceremony at the station. The war had already begun, and Kefreyt had not come for a photograph."
 STP_ARMY_KEFREYT_PENDING: "\nKefreyt has agreed to help: §Y3 volunteer divisions are being assembled§!. They have not yet been paid for or added to our army; we must hold Abilia for them to arrive."
 STP_cw_renew_kefreyt_request: "Resume Negotiations with Kefreyt"
 STP_cw_renew_kefreyt_request_desc: "Request three volunteer divisions again after a refusal. If Kefreyt agrees, it will assign a ready contingent or begin assembling one. Negotiations may be repeated after 30 days."
 ADISCORD_STP_pc.1.t: "The List Grows"
 ADISCORD_STP_pc.1.d: "The service is already recording the addresses of printing houses and safe houses. This is not an arrest yet, but the threshold has been named."
 ADISCORD_STP_pc.1.a: "Keep the network quiet"
 ADISCORD_STP_pc.2.t: "The Night List"
 ADISCORD_STP_pc.2.d: "From ninety to ninety-nine, the names are already on the list. Suspicion can still be reduced while the scale remains below one hundred. At one hundred, arrest follows immediately; lowering the scale afterwards will not undo an arrest that has already taken place."
 ADISCORD_STP_pc.2.a: "Continue"
 ADISCORD_STP_pc.3.t: "Arrest"
 ADISCORD_STP_pc.3.d: "They did not need to look for the name on the form twice. It had been entered on the night list alongside printing-house addresses and keys to school basements. By morning, the highlands were still arguing over whether it was true, while in Fada the inner courtyard had already been sealed.\n\nShabrat was taken alive. The Party neither declared him dead nor offered a bargain. For the apparatus, it was enough that the man who called Ivanov a transaction could no longer move freely.\n\nThe network did not disappear with him. What disappeared was the one person who could speak for all of it."
 ADISCORD_STP_pc.3.a: "Transfer command to Sotnikov"
 ADISCORD_STP_pc.3.a_tt: "Sotnikov takes over the resistance. He does not become the leader of the Party's STP."
 ADISCORD_STP_pc.3.b: "Maintain the network under Gornin's protocol"
 ADISCORD_STP_pc.3.b_tt: "Gornin is introduced as a contender. He does not become the leader of the Party's STP."
 ADISCORD_STP_pc.4.t: "Steland Hegemony"
 ADISCORD_STP_pc.4.d: "The councils were still in session when the decree was already on the desk. It contained no mention of an 'empire'. Its terms were simpler: Steland would no longer fit its survival around someone else's calendar, and disputed districts would no longer have the right to halt an order.\n\nSome of the victors recognised the highlands' old fear in it: that the Party would be followed by a new master with a local name. Others recognised what they had awaited since the first day of war: a country that spoke first again.\n\nThere is no way back across this threshold. Whoever follows Shabrat will inherit the system, not the right to choose another one on his behalf."
 ADISCORD_STP_pc.4.a: "Confirm the course"
 ADISCORD_STP_pc.5.t: "Freedom against Slavery"
 ADISCORD_STP_pc.5.d: "The charter did not promise peace. It promised something else: the army would not appoint district authorities, a district would not decide on war, and war would not abolish the expiry of emergency powers.\n\nNo one placed Shabrat's suitcase by the door. They placed him within a framework in which his word carried the greatest weight - until the assembly decided otherwise.\n\nThis offered no shelter to the neighbours. A regime that treated a person as merchandise or a contract company remained an enemy. What changed was what Steland had the right to become after victory on foreign soil: a master or an ally."
 ADISCORD_STP_pc.5.a: "Sign the charter"
 ADISCORD_STP_pc.6.t: "Headquarters Takes Over the Resistance"
 ADISCORD_STP_pc.6.d: "Sotnikov does not take the Party's seat. He takes over the resistance's chain of command, and only that."
 ADISCORD_STP_pc.6.a: "Accept command"
 ADISCORD_STP_pc.6.a_tt: "Command passes to Sotnikov on the resistance side."
 ADISCORD_STP_pc.7.t: "The Seal Can Be Passed On"
 ADISCORD_STP_pc.7.d: "The course is already fixed. Only the person who speaks for the country will change."
 ADISCORD_STP_pc.7.a: "Keep the successor"
 ADISCORD_STP_pc.7.b: "Bring Shabrat back"
 ADISCORD_STP_pc.7.c: "Hand over to Gornin"
 ADISCORD_STP_pc.7.da: "Hand over to Tikh"
 ADISCORD_STP_pc.8.t: "Death of the Founder"
 ADISCORD_STP_pc.8.d: "Shabrat is dead. There is no resurrection. The seal remains with whoever already holds office."
 ADISCORD_STP_pc.8.a: "Continue without him"
 ADISCORD_STP_pc.9.t: "The Reckoning with Kefreyt"
 ADISCORD_STP_pc.9.d: "This is not a debt for past assistance. It concerns the corridor, depots or core territories Kefreyt currently holds."
 ADISCORD_STP_pc.9.a: "Present the claim"
 ADISCORD_STP_pc.9.b: "Accept the terms"
 ADISCORD_STP_pc.9.c: "Refuse"
 ADISCORD_STP_pc.10.t: "The Post-war Mandate"
 ADISCORD_STP_pc.10.d: "The war in Steland has ended, but Nodrul's capital does not regard its outcome as final. A note has been delivered to the new government: a change of power does not cancel earlier claims and obligations.\n\nThe statement leaves the question of Nodrul's mandate open. It contains neither an order to the troops nor instructions to dispatch weapons; the dispute is becoming a diplomatic crisis to which Steland must respond."
 ADISCORD_STP_pc.10.a: "The mandate remains in force."
 STP_pc_nod_crisis_opened_tt: "Steland's post-war crisis with Nodrul has begun. The response depends on the chosen political course. This statement does not, by itself, declare war or send weapons."
 ADISCORD_STP_pc.11.t: "An Independent Government"
 ADISCORD_STP_pc.11.d: "The package will be agreed locally. Refusal leaves the same leaders in place, without a cosmetic change or an alliance."
 ADISCORD_STP_pc.11.a: "Accept the package"
 ADISCORD_STP_pc.11.b: "Refuse"
 ADISCORD_STP_pc.12.t: "Emergency Decree"
 ADISCORD_STP_pc.12.d: "The decree is already on the desk. The course need not be finalised yet, but the powers have already been defined."
 ADISCORD_STP_pc.12.a: "Keep the decree"
 ADISCORD_STP_pc.13.t: "Gornin's Protocol"
 ADISCORD_STP_pc.13.d: "Gornin already handled the cabinet's paperwork. Now he is being named as a contender, not merely a minister."
 ADISCORD_STP_pc.13.a: "Add him to the list"
 ADISCORD_STP_pc.14.t: "Tikhoreva's Register"
 ADISCORD_STP_pc.14.d: "The archive is opening as an institution. Tikh joins as custodian of the records, not as head of state."
 ADISCORD_STP_pc.14.a: "Open the register"
 ADISCORD_STP_pc.15.t: "Nodrul Responds"
 ADISCORD_STP_pc.15.d: "Nodrul's note arrived after the civil war had ended. Its authors refuse to regard the new government's victory as a final settlement of earlier obligations and maintain their claims to influence in Steland.\n\nFor now, no military order has followed these words. The government must determine its response within the chosen political course; the note itself does not start another war."
 ADISCORD_STP_pc.15.a: "Take note"
 ADISCORD_STP_pc.11.c: "Conclude without a package"
 STP_pc_after_victory: "The Government of Victory"
 STP_pc_after_victory_desc: "The capital has been taken, but a united state still has to be assembled. We will approve a common reconstruction plan. Civilian services, industry and the army will require separate investments; a permanent cabinet and the country's political settlement will determine the choices that follow."
 STP_pc_count_ruins: "Survey the Destruction"
 STP_pc_count_ruins_desc: "First, we must establish what survived. A survey of roads and houses will show which core territories remain in Kefreyt's hands and where the economy can still be repaired."
 STP_pc_war_ledgers: "Wartime Obligations"
 STP_pc_war_ledgers_desc: "We will collect the agreements, receipts and promises made during the uprising. If Kefreyt supplied volunteers, a separate settlement can be made with it. Its plans along the border will still demand attention."
 STP_pc_name_steland: "Call the Country Steland"
 STP_pc_name_steland_desc: "The resistance no longer conceals its name. On maps and in correspondence, the country is once again called Steland."
 STP_pc_two_borders: "Two Borders"
 STP_pc_two_borders_desc: "The border service will study the deployment of Kefreyt's and Nodrul's forces. The cabinet must know where garrisons are simply rotating and where a new campaign is being prepared."
 STP_pc_army_from_resistance: "From Detachments to an Army"
 STP_pc_army_from_resistance_desc: "The detachments that took the mountain passes must be organised into permanent formations. A war with a neighbour does not cancel that task."
 STP_pc_army_field_count: "Field Accounting"
 STP_pc_army_field_count_desc: "Headquarters will count the rifles and men on the pass. A weapons shortage damages organisation before it changes the map."
 STP_pc_army_officers: "The Officer Corps"
 STP_pc_army_officers_desc: "Field commanders will learn a common staff language. If the founder has already been arrested, the safe-house network will be repaired separately."
 STP_pc_army_supply: "Supply the Passes"
 STP_pc_army_supply_desc: "Depots in Abilia or Hoskheit must supply the mountain formations, not just the capital's garrison."
 STP_pc_army_mountain: "Mountain Defence"
 STP_pc_army_mountain_desc: "We will incorporate the lessons of mountain warfare into the training of regular units. The defence of our own territory will gain a lasting advantage."
 STP_pc_army_against_heavy: "Against Heavier Forces"
 STP_pc_army_against_heavy_desc: "We will train anti-tank crews and open paid orders for infantry equipment and artillery. Command will be able to replenish stockpiles before the chosen campaign."
 STP_pc_army_limited_offense: "A Limited Offensive"
 STP_pc_army_limited_offense_desc: "Our staffs will practise an offensive with a limited objective and supply prepared in advance. A decision will allow a temporary boost to be activated when the army is ready to attack."
 STP_pc_army_hegemony_cadres: "Loyal Cadres"
 STP_pc_army_hegemony_cadres_desc: "Officer schools will train commanders for an army that supports the foreign policy of a strong centre."
 STP_pc_army_republic_control: "An Army under the Law"
 STP_pc_army_republic_control_desc: "The civilian government will control appointments. Trust in the army will grow, although coordinating plans will take longer."
 STP_pc_army_staff_doctrine: "General Staff Doctrine"
 STP_pc_army_staff_doctrine_desc: "The general staff will receive broad powers over planning and unit organisation. The cabinet will have to share political initiative with it."
 STP_pc_navy_reach_water: "Reach the Sea"
 STP_pc_navy_reach_water_desc: "We have no port of our own. Headquarters is preparing a plan for Fada and Hoskheit, but that will not produce ships."
 STP_pc_navy_coast: "Coastal Defence"
 STP_pc_navy_coast_desc: "We will establish a coastal command and begin training specialists to protect ports and coastal routes."
 STP_pc_navy_ports: "Bring the Ports under Oversight"
 STP_pc_navy_ports_desc: "The port service will organise cargo inspections and depot protection. Smuggling channels must no longer offer foreign agents an open door."
 STP_pc_navy_lanes: "Protect the Sea Lanes"
 STP_pc_navy_lanes_desc: "Research into coastal craft and escorts. Battleships are not part of the programme."
 STP_pc_navy_yards: "Affordable Shipbuilding"
 STP_pc_navy_yards_desc: "We will expand ship-repair facilities in one of our controlled ports. Two dockyards will provide the foundation for a permanent naval programme."
 STP_pc_navy_escorts: "Escort Duty"
 STP_pc_navy_escorts_desc: "We will train crews to escort transports and coordinate naval operations with shore services."
 STP_pc_navy_deny: "Deny the Enemy Fleet"
 STP_pc_navy_deny_desc: "We will fortify the coastline and strengthen the ports' anti-air defences. The enemy will have to fight for a landing before it reaches the mountain roads."
 STP_pc_navy_heg_inspection: "Inspect the Clients"
 STP_pc_navy_heg_inspection_desc: "A dependency spirit binds the client's port. Inspections increase resistance, but do not replace the leader."
 STP_pc_navy_lib_no_basing: "Their Port Is Not Ours"
 STP_pc_navy_lib_no_basing_desc: "A permanent base in an ally's territory requires its consent. Violating that rule breaks the coalition."
 STP_pc_navy_staff: "Coastal Shipping under Staff Direction"
 STP_pc_navy_staff_desc: "Military escorts take priority over merchant routes. This does not unlock general-staff focuses for Barchel."
 STP_pc_air_crews: "Aircrew Cadres"
 STP_pc_air_crews_desc: "We will train pilots, mechanics and controllers. New research will allow us to choose an aircraft the country can maintain on its own."
 STP_pc_air_fields: "Airfields"
 STP_pc_air_fields_desc: "We will prepare an airfield for two new air groups and conduct staff exercises. Construction will take place in a controlled region where the base can still be expanded."
 STP_pc_air_shield: "Shield the Skies"
 STP_pc_air_shield_desc: "We will strengthen ground-based air defence and accelerate fighter development to protect our cities and mountain passes."
 STP_pc_air_support: "Support the Troops"
 STP_pc_air_support_desc: "We will coordinate aviation with ground units. New aircraft must help the army where mountain roads cannot carry heavy artillery."
 STP_pc_air_recon: "Reconnaissance over the Passes"
 STP_pc_air_recon_desc: "Fifteen intelligence points on both neighbours and a decision to repeat the sortie."
 STP_pc_air_import: "Orders for Private Aircraft Suppliers"
 STP_pc_air_import_desc: "We will unlock a repeatable purchase of one hundred basic fighters for 120 treasury units. The focus itself prepares the procurement arrangements; money is deducted only when the decision is selected."
 STP_pc_air_domestic: "Domestic Assembly"
 STP_pc_air_domestic_desc: "We will expand military production and prepare our own aviation programme. A new factory and two research bonuses will reduce dependence on foreign supplies."
 STP_pc_air_heg_pressure: "Air Power as Pressure"
 STP_pc_air_heg_pressure_desc: "A strike against a hub as an ultimatum. This is not liberation."
 STP_pc_air_lib_rules: "Do Not Strike an Ally"
 STP_pc_air_lib_rules_desc: "Strikes on a partner's hubs are forbidden. The coalition rests on this rule."
 STP_pc_air_staff: "Reconnaissance before Gestures"
 STP_pc_air_staff_desc: "The directorate strengthens reconnaissance rather than staging a demonstrative raid."
 STP_pc_shabrat_cabinet: "The Founder's Cabinet"
 STP_pc_shabrat_cabinet_desc: "Victory gave the country a name, but its departments are still empty. We will appoint the people who ran the districts, depots and safe houses during the war. The alliance will receive a permanent name, and the ministries will cease to be vacant posts."
 STP_pc_shabrat_politics: "The Founder's Politics"
 STP_pc_shabrat_politics_desc: "Victory brought together people with different visions of the future. Shabrat must decide whether to become the arbiter of a strong centre or the guarantor of independent civilian institutions."
 STP_pc_hegemony_open: "Steland Hegemony"
 STP_pc_hegemony_open_desc: "We will concentrate political initiative in the government. Some supporters of district autonomy will withdraw, but the cabinet will be able to prepare a common course more quickly."
 STP_pc_freedom_open: "Freedom against Slavery"
 STP_pc_freedom_open_desc: "We will recognise the district councils' and assembly's right to influence decisions. Coordination will take time, but the new government will gain broader support."
 STP_pc_shared_archive_policy: "An Archive, Not a Sentence upon the Country"
 STP_pc_shared_archive_policy_desc: "We will open the archives to researchers and the commission investigating the old regime's crimes. Working with these documents must become a permanent service, not an extension of personal vengeance."
 STP_pc_heg_unity: "Unity of the Victors"
 STP_pc_heg_unity_desc: "The council under Shabrat loses its veto over appointments. This decree does not revoke the guarantees to the SRP."
 STP_pc_heg_emergency: "Emergency Powers"
 STP_pc_heg_emergency_desc: "We will grant industry emergency powers for 180 days. Military output and war support will rise, along with administrative expenditure."
 STP_pc_heg_subordinate: "Subordinate the Centres of Power"
 STP_pc_heg_subordinate_desc: "District commissioners will answer to the government. A single chain of decisions will reduce administrative costs and expand recruitment capacity."
 STP_pc_heg_limit_parties: "Limit Political Competition"
 STP_pc_heg_limit_parties_desc: "We will concentrate political activity within registered organisations. This will strengthen the government's initiative, but narrow the scope for independent research."
 STP_pc_heg_lock: "The Course Is Set"
 STP_pc_heg_lock_desc: "We will commit to a strong centre and regional primacy. Shabrat will remain in charge, and the civilian republican path will close."
 STP_pc_heg_person: "The Founder's Name in Law"
 STP_pc_heg_person_desc: "We will make the founder the final authority in disputes between departments and districts. His standing will accelerate the work of the political apparatus."
 STP_pc_heg_regional_system: "A Regional System"
 STP_pc_heg_regional_system_desc: "We will prepare industry for permanent external commitments. Greater utilisation of military factories will require a more expensive administrative apparatus."
 STP_pc_heg_val_audit: "The Reckoning with Kefreyt"
 STP_pc_heg_val_audit_desc: "We will review the terms of Kefreyt's contracts and prepare the government's position for negotiations over a new border settlement."
 STP_pc_heg_val_terms: "Political Guarantees from Kefreyt"
 STP_pc_heg_val_terms_desc: "We will ask Kefreyt to recognise Steland's political primacy. It may accept or refuse. Refusal leaves military preparations available; war will not begin without a separate order."
 STP_pc_heg_val_force: "Plan the Mountain Campaign"
 STP_pc_heg_val_force_desc: "Following Kefreyt's refusal, headquarters will draw up a campaign plan. First, we must fund 35 days of supply preparation, then decide within 90 days whether to launch the offensive. Kefreyt will receive a warning and time to prepare its defence."
 STP_pc_heg_nod_break: "Challenge the Northern Mandate"
 STP_pc_heg_nod_break_desc: "We will ask Nodrul to recognise a reversal of the relationship: henceforth, decisions in the region will require Steland's consent. Refusal does not start a war automatically."
 STP_pc_heg_nod_force: "Plan the Northern Campaign"
 STP_pc_heg_nod_force_desc: "Following Nodrul's refusal, we will prepare supplies and reconnaissance for the northern front. A separate programme will take 35 days and require funding. The order to go to war will remain the government's decision."
 STP_pc_heg_clients: "Dependent Governments"
 STP_pc_heg_clients_desc: "We will bring neighbours that recognise our primacy into a regional league. Only governments which have already accepted the relevant terms will join."
 STP_pc_heg_burden: "The Price of Primacy"
 STP_pc_heg_burden_desc: "We will establish a permanent apparatus to coordinate external forces. The army will gain better organisation at the cost of additional administrative expenditure."
 STP_pc_lib_assembly: "Assembly of the Districts"
 STP_pc_lib_assembly_desc: "Laws will pass through the assembly. Shabrat remains head of state, but loses some of his day-to-day influence."
 STP_pc_lib_institutions: "Independent Institutions"
 STP_pc_lib_institutions_desc: "We will establish an independent judiciary and a permanent representative chamber. Predictable rules will lower administrative expenditure and support research."
 STP_pc_lib_civil_army: "The Army Answers to Civilians"
 STP_pc_lib_civil_army_desc: "The government will receive the right to approve military commanders. If Sotnikov is available, his experience will be retained in a civilian defence council."
 STP_pc_lib_lock: "The Charter Is Established"
 STP_pc_lib_lock_desc: "We will secure civilian rule and the independence of representative institutions. Shabrat remains head of state, but the hegemonic path closes."
 STP_pc_lib_competition: "Political Competition"
 STP_pc_lib_competition_desc: "We will open political competition within the new order. Gornin and Tikh will be able to present their programmes before a possible transfer of power."
 STP_pc_lib_succession: "Power That Can Be Passed On"
 STP_pc_lib_succession_desc: "Shabrat will choose between continuing to lead and transferring power to one of the nominated civilian successors."
 STP_pc_lib_emergency_limit: "Emergencies Have an Expiry Date"
 STP_pc_lib_emergency_limit_desc: "We will define the limits of emergency mobilisation. During war, a temporary reserve call-up may be declared separately at a cost in command power."
 STP_pc_lib_prepare_neighbors: "Political Preparation in the Neighbouring States"
 STP_pc_lib_prepare_neighbors_desc: "We will establish a permanent service to monitor our neighbours. For a separate payment, it will be able to update intelligence on their armed forces."
 STP_pc_lib_local_contacts: "Talk to Those beyond the Border"
 STP_pc_lib_local_contacts_desc: "We will establish links with civilian groups and specialists in neighbouring countries. Economic intelligence will help the government assess the consequences of intervention."
 STP_pc_lib_crisis: "The Intervention Crisis"
 STP_pc_lib_crisis_desc: "A stronger border service and a reserve of command power will allow us to face an open crisis prepared. This step does not yet declare war."
 STP_pc_lib_war: "War of Liberation"
 STP_pc_lib_war_desc: "Open border crises will be settled by war with the neighbour concerned. If crises with Kefreyt and Nodrul are active at the same time, we will have to fight on two fronts. A war already under way will receive the same plan for a post-war settlement."
 STP_pc_lib_transition: "Transitional Administration"
 STP_pc_lib_transition_desc: "We will fund a temporary administration and offer defeated neighbours a transitional agreement. The political outcome depends on their response."
 STP_pc_lib_independent_gov: "An Independent Government"
 STP_pc_lib_independent_gov_desc: "The transitional commissions are concluding their work. Instead of permanently supervising our neighbours, the cabinet will concentrate on civilian construction and reduce administrative expenditure."
 STP_pc_lib_coalition: "A Coalition of Equals"
 STP_pc_lib_coalition_desc: "We will bring governments that accepted the terms of liberation into a defensive coalition. Every participant must confirm its choice."
 STP_pc_sot_chain: "The Chain of Command"
 STP_pc_sot_chain_desc: "Without the political founder, headquarters assumes responsibility for coordinating scattered units. A unified chain of orders will restore control."
 STP_pc_sot_field: "Field Commanders"
 STP_pc_sot_field_desc: "Sotnikov will use the experience of field commanders to accelerate operational preparation."
 STP_pc_sot_regions: "District Formations"
 STP_pc_sot_regions_desc: "The districts provide men to headquarters, not to the council."
 STP_pc_sot_state: "The Staff State"
 STP_pc_sot_state_desc: "The administration answers to the chain of command, not the assembly."
 STP_pc_sot_two_threats: "Two Threats, One Headquarters"
 STP_pc_sot_two_threats_desc: "Intelligence will assess Nodrul's and Kefreyt's forces. A change of commander does not erase the information or the common task of defence."
 STP_pc_sot_limits: "The Limits of Military Rule"
 STP_pc_sot_limits_desc: "A directorate for 180 days. Sotnikov only."
 STP_pc_sot_shabrat_question: "The Living Founder"
 STP_pc_sot_shabrat_question_desc: "We will determine the place of the former political leadership in the new order."
 STP_pc_sot_keep_command: "The Directorate Remains"
 STP_pc_sot_keep_command_desc: "We will formalise the military directorate's authority and its responsibility for national defence."
 STP_pc_sot_transfer: "Transfer of the Seal"
 STP_pc_sot_transfer_desc: "We will open the transfer of power to one of the civilian successors already introduced."
 STP_pc_sot_val_defense: "No Kefreyt Depots"
 STP_pc_sot_val_defense_desc: "Defence and withdrawal, not hegemony."
 STP_pc_sot_nod_watch: "No Return for Nodrul's Advisers"
 STP_pc_sot_nod_watch_desc: "A border regime without client status."
 STP_pc_gornin_charter: "The Protocol Becomes Law"
 STP_pc_gornin_charter_desc: "Gornin will formalise the procedures of civilian institutions and reduce administrative expenditure."
 STP_pc_vera_lists: "The Register before the Banner"
 STP_pc_vera_lists_desc: "Tikh will investigate the former regime's connections. Political independence will grow, but inspections of enterprises will temporarily disrupt production."
 STP_pc_after_victory_tt: "The victors' coalition holds together until a course is fixed: §G+5%§! stability, §R-3%§! organisation."
 STP_pc_count_ruins_tt: "Shows which STP/STS core territories Kefreyt still holds."
 STP_pc_name_steland_tt: "The country receives the cosmetic name Steland."
 STP_pc_army_register_tt: "A temporary register until the republic's permanent army focus is completed."
 STP_pc_navy_reach_water_tt: "There is no port. This focus does not build ships."
 STP_pc_navy_heg_inspection_tt: "Inspections maintain the client spirit and increase resistance."
 STP_pc_navy_lib_no_basing_tt: "A permanent base in an ally's territory requires its event response first."
 STP_pc_air_import_tt: "Procurement without new debt if Kefreyt's shipment has already arrived."
 STP_pc_air_heg_pressure_tt: "A strike against a hub as an ultimatum."
 STP_pc_air_lib_rules_tt: "Strikes against a partner's hubs are forbidden."
 STP_pc_founder_rules: "The founder is in power"
 STP_pc_named_successor_rules: "The course's designated successor is in power"
 STP_pc_course_continues: "The founder or a designated successor maintains the course"
 STP_pc_hegemony_continues: "Hegemony is led by the founder or a successor to the established course"
 STP_pc_freedom_continues: "The charter is upheld by the founder or a successor to the established course"
 STP_pc_shabrat_politics_tt: "Consolidating hegemony and adopting the freedom charter are points of no return."
 STP_pc_hegemony_open_tt: "Opens Steland Hegemony. Does not change ideology."
 STP_pc_freedom_open_tt: "Opens Freedom against Slavery. Does not change ideology."
 STP_pc_shared_archive_policy_tt: "Introduces Vera Tikh if the archive has not already named her."
 STP_pc_heg_regional_system_tt: "A framework for the neighbours outside the diplomatic interface."
 STP_pc_heg_val_audit_tt: "If the issue has not yet been raised, the cabinet will receive information about Kefreyt's claims. Treaty terms will be offered by the next focus; refusal does not, by itself, start a war."
 STP_pc_heg_val_terms_tt: "An ultimatum. Acceptance creates a client; refusal opens the route to war."
 STP_pc_lib_institutions_tt: "Tikh may become an adviser, not the leader."
 STP_pc_lib_civil_army_tt: "If Sotnikov is free and serves the republic, he will also join the high command."
 STP_pc_sotnikov_civil_staff: "Sotnikov in the Civilian Staff"
 STP_pc_lib_competition_tt: "Gornin and Tikh will be introduced as candidates if they have not already entered politics. The next focus unlocks the choice of a successor."
 STP_pc_lib_prepare_neighbors_tt: "Political preparation for talks with Kefreyt and Nodrul. This is not yet a crisis or a war."
 STP_pc_lib_crisis_tt: "Formalises a crisis that is already open. The next step declares the war of liberation."
 STP_pc_lib_independent_gov_tt: "The next neighbour receives its own event if it has not yet been offered the package."
 STP_pc_sot_shabrat_question_tt: "Does not free the founder or change the leader."
 STP_pc_gornin_charter_tt: "Succession occurs only through a scripted event."
 STP_pc_treasury_20_tt: "§G+20§! £."
 STP_pc_treasury_50_tt: "§G+50§! £."
 STP_pc_treasury_100_tt: "§G+100§! £."
 STP_pc_treasury_minus_20_tt: "§R-20§! £."
 STP_pc_treasury_minus_40_tt: "§R-40§! £."
 STP_pc_treasury_minus_50_tt: "§R-50§! £."
 STP_pc_treasury_minus_60_tt: "§R-60§! £."
 STP_pc_treasury_minus_75_tt: "§R-75§! £."
 STP_pc_treasury_minus_80_tt: "§R-80§! £."
 STP_pc_at_bonus: "Against Heavier Forces"
 STP_pc_naval_bonus: "An Affordable Fleet"
 STP_pc_fighter_bonus: "Shield the Skies"
 STP_pc_cas_bonus: "Support the Troops"
 STP_pc_air_domestic_bonus: "Domestic Assembly"
 STP_pc_hegemony_league: "Steland League"
 STP_pc_liberation_coalition: "Coalition of Liberation"
 STS_steland: "Steland"
 STS_steland_DEF: "Steland"
 STS_steland_ADJ: "Stelandic"
 NOD_mandate_broken: "Nodrul without a Mandate"
 NOD_mandate_broken_DEF: "Nodrul without a Mandate"
 NOD_mandate_broken_ADJ: "Nodrulian"
 STP_pc_val_client: "Kefreyt Client"
 STP_pc_val_client_desc: "Kefreyt has recognised Steland's political primacy. This opens a route into the regional league while preserving its own government."
 STP_pc_nod_client: "Nodrul Client"
 STP_pc_nod_client_desc: "Nodrul has recognised Steland's political primacy. This opens a route into the regional league while preserving its own government."
 VAL_liberated_settlement: "Liberated Kefreyt"
 VAL_liberated_settlement_desc: "A register of captains without the right to veto the package."
 NOD_mandate_broken_desc: "Nodrul no longer has the right to return its advisers to the highlands."
 STP_pc_coalition_hold_delta: "The Post-victory Coalition"
 STP_pc_limited_offense: "A Limited Offensive"
 STP_pc_limited_offense_desc: "Forty-five days of increased attack and breakthrough, at the cost of stability outside core territories."
 STP_pc_emergency_decree: "Emergency Decree"
 STP_pc_emergency_decree_desc: "Emergency powers increase military output and war support while requiring additional administrative expenditure."
 STP_pc_directory_term: "The Directorate's Term"
 STP_pc_directory_term_desc: "Military administration strengthens army organisation at the cost of the cabinet's political initiative."
 STP_pc_watch_val_tt: "Permanent observation of Kefreyt. Not a war."
 STP_pc_watch_nod_tt: "Permanent observation of Nodrul. Not a war."
 STP_pc_civil_appointment_tt: "Civilian appointment of generals costs political influence."
 STP_pc_client_inspection_tt: "Inspection of a client's port increases resistance."
 STP_pc_air_recon_decision_tt: "Another reconnaissance sortie over the passes remains a separate operation."
 STP_pc_extend_emergency_tt: "Emergency powers can be extended only by a separate decision."
 STP_pc_authorized_recruit: "Authorised Recruitment"
 STP_pc_authorized_recruit_desc: "The districts provide personnel to the centre. Republican troops are not recalled from another front."
 STP_pc_mountain_defence: "Mountain Defence"
 STP_pc_mountain_defence_desc: "Training and control of the passes for one hundred and eighty days."
 STP_pc_heg_cadres: "Loyal Cadres"
 STP_pc_heg_cadres_desc: "Appointments pass through the founder's people."
 STP_pc_port_counterintel: "Port Control"
 STP_pc_port_counterintel_desc: "A closed channel for one hundred and eighty days. This does not revoke Nodrul's mandate."
 STP_pc_navy_staff_idea: "Staff-controlled Coastal Shipping"
 STP_pc_navy_staff_idea_desc: "Military escorts take priority over merchant routes."
 STP_pc_drift_defence: "Defend the Political Course"
 STP_pc_drift_defence_desc: "Registration of organisations restrains foreign agitation."
 STP_pc_founder_arbitration: "The Founder's Arbitration"
 STP_pc_founder_arbitration_desc: "His personal word takes precedence over a district veto."
 STP_pc_limited_emergency: "A Time-limited State of Emergency"
 STP_pc_limited_emergency_desc: "Ninety days of mobilisation with an end date declared in advance."
 STP_pc_occupation_admin: "Transitional Administration"
 STP_pc_occupation_admin_desc: "Ninety days of administrative expenditure until the target's capital is handed over to local authorities."
 STP_pc_border_watch: "The Kefreyt Cordon"
 STP_pc_border_watch_desc: "Defence without the right to establish depots across the border."
 STP_pc_nod_watch: "The Nodrul Cordon"
 STP_pc_nod_watch_desc: "A border regime without client status or the return of advisers."
 ADISCORD_STP_pw.1.t: "Steland"
 ADISCORD_STP_pw.1.d: "Two days before the new cabinet's first meeting, the state printing office sent proofs for approval. One read 'Republic of Stelander'. On the other, in the same typeface, stood a word that had not appeared on official seals for generations: 'Steland'.\n\nThe dispute was not about spelling. In the old highland documents, Steland was the country's name. The form 'Stelander' denoted a person or thing belonging to Steland. For decades, foreign chancelleries had written of the Stelander government, the Stelander administration and Stelander territories. After the Fada Pact, the modifier gradually became a noun. The Party established it as the name of its new order, as though the end of the war had brought a new country into existence.\n\nShabrat studied both sheets for a long time. He had no intention of claiming that the past decades had never happened. But the independence won after the civil war did not need a name that had grown out of a foreign chancellery and been adopted by its own regime. The new cabinet was not restoring a tribal union or a bygone century. It was restoring the country's right to name itself.\n\nThe head of the printing office asked which version should go to press."
 ADISCORD_STP_pw.1.a: "Print 'Steland'."
 ADISCORD_STP_pw.2.t: "The Archive That Survived the War"
 ADISCORD_STP_pw.2.d: "Combat engineers had to force open the archive vault's door. The retreating administration had removed the sign and taken part of the card index, but the fire never reached the basement. Decades of Ivanov's state remained on the shelves.\n\nWithin the first few hours, they found things the resistance had previously known only through rumour. Annexes to the Fada Pact omitted from the public version. Lists of Nodrulian advisers with access to the ministries. Transfers of rights to mines and water. The High Houses' secret accounts. Registers of detainees in which some names ended with the terse note 'transferred', although their families had received no news for years.\n\nSeveral of Shabrat's people proposed taking the documents straight to the journalists. After the war, the country wanted one great admission that everything the underground had said was true. Shabrat refused. First, every folder had to be numbered, copied, traced to its source, and every signature identified. Publication would follow only then.\n\nFor decades, the old regime had replaced history with a convenient story. It would be all too easy for the new state to do the same in reverse. If Steland intended to try people and revise treaties, it needed more than the victors' legends. It needed documents that would outlast the next government too."
 ADISCORD_STP_pw.2.a: "No document without a number."
 ADISCORD_STP_pw.3.t: "Monument to the Father of Peace"
 ADISCORD_STP_pw.3.d: "The crane arrived in the square early in the morning, although no one had ordered the monument's removal. The municipal service had decided that, after a change of government, it was better to be ready. By noon, resistance veterans, officials, journalists and several dozen residents had gathered around the bronze Ivanov.\n\nSomeone had already written 'capitulation' on the pedestal. Nearby, an elderly woman laid flowers. Her son had survived the final year of bombardment precisely because the Fada Pact was signed. A few metres away, a young soldier in Shabrat's army was showing his comrades his grandfather's name on a list of people who disappeared during the post-war purges.\n\nNeither side was entirely lying. Ivanov had ended a war Steland could barely continue. He had also built an order in which peace gradually became a justification for foreign influence, secret agreements and the Chamber's power. Tearing down the statue was easier than deciding which of these two histories should remain in the square.\n\nThe workers stopped the crane and waited for instructions. For the first time, Ivanov's own apparatus would not decide how he was remembered."
 ADISCORD_STP_pw.3.a: "Keep the monument. Replace the plaque."
 ADISCORD_STP_pw.3.b: "Move Ivanov to a museum."
 ADISCORD_STP_pw.4.t: "A Home with Two Keys"
 ADISCORD_STP_pw.4.d: "Two people came to the district administration with documents for the same flat. The first, a schoolteacher from a mountain district, had left during the final bombardments and kept his pre-war registration booklet all that time. The second, a railwayman's widow with a child, had received the same flat from the emergency committee after her home burned down during the civil war.\n\nBoth documents were genuine. One bore the seal of Ivanov's administration, the other that of the resistance's military council. The clerk placed them side by side and asked which was now considered lawful. Several soldiers by the door proposed a simple solution: return the flat to its pre-war owner. Then the widow asked where she was supposed to return to.\n\nShabrat refused to turn victory into another eviction. The old right could not simply be declared void, but neither could the new republic begin by ordering a family onto the street. The administration was instructed to register both claims, leave the current occupants in place until alternative housing was provided, and recognise the returning owner's right to a new home or compensation.\n\nThere were more than one or even a hundred such cases. Steland was quickly discovering that rebuilding a country did not mean putting everything back as it had been. Sometimes it meant deciding, for the first time, what to do with two people who each held a genuine key."
 ADISCORD_STP_pw.4.a: "Victory grants no right to someone else's door."
 ADISCORD_STP_pw.5.t: "Weapons on the Table"
 ADISCORD_STP_pw.5.d: "The queue outside the old army depot formed before dawn. Former resistance units brought rifles from Party arsenals, Kefreyt assault rifles, hunting carbines and crates of grenades which had spent years listed as flour, tools or nothing at all. Some weapons had their serial numbers filed off. That was how they had reached the mountains in the first place.\n\nThe commander of an old cell refused to surrender his rifle. He pointed out that the Party had also started with registers, then used those same lists to come for people at night. Several people in the queue silently agreed. A new uniform and a new seal did not automatically make the state someone they trusted with their weapons.\n\nShabrat unholstered his own pistol, removed the magazine and placed the weapon on the table before the clerk. His name became the first entry in the new register. He then signed an order: every armed detachment must either join the common army and accept a civilian chain of command, or surrender its heavy weapons and disband. There would be no separate army of the victors.\n\nBy evening, the queue had grown longer. Some left with duty orders, others with demobilisation papers. The resistance was handing the state the force that had once allowed it to survive. For the first time, it was doing so not because it had lost."
 ADISCORD_STP_pw.5.a: "No detachment outside the register."
 STP_pw_recovery_start_tt: "Opens post-war reconstruction. Three programmes remove the consequences of war: civilian services, workshops and the integration of detachments into the regular army. Only one programme can be funded at a time; progress is shown in the war council."
 STP_pw_reconstruction_dynamic: "The Civil War's Aftermath"
 STP_pw_reconstruction_dynamic_desc: "Disrupted production links and reconstruction expenditure hinder the new government. Each completed programme removes one third of the penalties."
 STP_pw_project_idle_tt: "No other funded reconstruction programme is active."
 STP_pw_recovery_complete_tt: "Victory in Stelander is secured; all three reconstruction programmes are complete."
 STP_pw_restore_services: "Restore Civilian Services"
 STP_pw_restore_services_desc: "We will return doctors, supply officers and civil servants to the districts. The work takes 42 days and occupies the shared reconstruction slot. Losing control of the capital or capitulating interrupts the programme and refunds the full payment."
 STP_pw_restore_services_result_tt: "After §Y42 days§!: §G+5%§! stability, §G-5%§! administrative expenditure and removal of one third of the reconstruction penalties."
 STP_pw_restart_workshops: "Restart the Restored Workshops"
 STP_pw_restart_workshops_desc: "We will pay for machinery, power connections and workers' return. After 56 days, the network of small workshops will provide two off-map civilian factories. The programme occupies the shared slot; losing the capital or capitulating refunds the payment."
 STP_pw_restart_workshops_result_tt: "After §Y56 days§!: §Y2 off-map civilian factories§! and removal of one third of the reconstruction penalties."
 STP_pw_integrate_veterans: "Integrate the Detachments into the Regular Army"
 STP_pw_integrate_veterans_desc: "We will fund personnel commissions, sergeant training and a common replacement service. The programme takes 35 days and occupies the shared slot. Existing divisions remain; losing the capital or capitulating refunds the payment."
 STP_pw_integrate_veterans_result_tt: "After §Y35 days§!: §G+10%§! organisation recovery, §Y25§! Army Experience and removal of one third of the reconstruction penalties."
 STP_pw_project_refund_tt: "The unused payment is returned to the treasury. The programme becomes available again once its conditions are restored."
 STP_pw_army_procurement: "Order a Re-equipment Package"
 STP_pw_army_procurement_desc: "We will place a paid order with private workshops: 4000 infantry equipment, 300 artillery pieces and 200 anti-tank guns. Another order becomes available after 90 days."
 STP_pw_air_procurement: "Purchase Combat Trainers"
 STP_pw_air_procurement_desc: "Private suppliers will deliver 100 basic fighters to equip our air units. The price is fixed; delivery does not depend on earlier assistance from Kefreyt. Another order is available after 120 days."
 STP_pw_border_dossier: "Update Intelligence on Neighbouring Armies"
 STP_pw_border_dossier_desc: "Military attaches and the border service will prepare intelligence on Kefreyt's and Nodrul's forces. The work can be repeated after 120 days."
 STP_pw_settle_kefreyt_accounts: "Settle the Account for Kefreyt's Assistance"
 STP_pw_settle_kefreyt_accounts_desc: "We will transfer 900 treasury units to Kefreyt to settle wartime supply accounts. Stability will rise by 5%. Payment does not create an alliance or guarantee that our neighbour will abandon its territorial claims."
 STP_pw_plan_offensive: "Prepare a Limited Offensive"
 STP_pw_plan_offensive_desc: "We will concentrate staff resources on a 45-day offensive operation. The order is available only during war and requires 50 command power. Another operation can be prepared after 75 days."
 STP_pw_emergency_reserves: "Order an Emergency Reserve Call-up"
 STP_pw_emergency_reserves_desc: "We will accelerate mobilisation for 90 days. The order is available during war, requires 25 command power and can be repeated after 120 days."
 STP_pc_val_refused_tt: "Kefreyt rejected the offer"
 STP_pc_offer_closed: "The offer is no longer valid."
 STP_pw_recovery_report: "\n\n§YNational reconstruction§!: [?STP_pw_recovery_progress|0] of 3 programmes completed. Civilian services, workshops and the army share a single budget slot. [STPGetRecoverySlot]"
 STP_pw_recovery_slot_free: "§GSlot available.§!"
 STP_pw_recovery_slot_busy: "§YA funded programme is under way.§! Another order cannot be placed until it finishes."
