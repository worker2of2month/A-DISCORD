 STP_pe_houses_guarantors_idea:0 "House Guarantees"
 STP_pe_houses_guarantors_idea_desc:0 "Local guarantors collect payments and maintain their own offices, reducing the state cost of enforcing agreements."
 STP_pe_security_inspectors_idea:0 "Internal Inspectorate"
 STP_pe_security_inspectors_idea_desc:0 "Inspecting the inspectors exposes duplicate expenses and false accounts, reducing administrative costs."
 STP_pe_festival_services_idea:0 "Public Square Services"
 STP_pe_festival_services_idea_desc:0 "Funded kitchens, cleaning and medical posts support daily life around the celebrations. Public services reduce household burdens and improve trust."
 STP_pe_regent_cadres_idea:0 "Local Administration Courses"
 STP_pe_regent_cadres_idea_desc:0 "Local administrators learn industrial accounting and new technologies. Training accelerates civilian reconstruction without granting advisers further powers."
 STP_pe_houses_course_a_idea:0 "Representation for the Taxpayers"
 STP_pe_houses_course_a_idea_desc:0 "Authority over public funds should carry an obligation to account to those who provided them. Taxpayers' delegates will sit alongside the envoys of the Houses."
 STP_pe_houses_course_b_idea:0 "Hereditary Seats"
 STP_pe_houses_course_b_idea_desc:0 "Recognised families will retain their seats in the Chamber. Succession becomes predictable, while new merchants and district officials remain petitioners outside its doors."
 STP_pe_houses_followup:0 "Collect House Arrears"
 STP_pe_houses_followup_desc:0 "Pay collectors to return overdue levies to the treasury. District expense books increase receipts. Delivery is immediate; repeat after 30 days."
 STP_pe_houses_followup_upgrade_tt:0 "Arrears collection: §Y1000§! instead of §Y750§! £ADISCORD_economy_treasury_texticon."
 STP_pe_festival_course_a_idea:0 "The Right to Leave the Festival"
 STP_pe_festival_course_a_idea_desc:0 "A free festival requires the freedom not to participate. This course requires the earlier guarantee of free labour and personal rights; a legal slave market is incompatible with it."
 STP_pe_festival_course_b_idea:0 "A Patron for Every Establishment"
 STP_pe_festival_course_b_idea_desc:0 "Every establishment will receive an influential protector and a clear chain of authority. Organisers can settle problems faster while consolidating control over the season's income."
 STP_pe_festival_followup:0 "Service the Public Squares"
 STP_pe_festival_followup_desc:0 "Fund kitchens, cleaning and medical posts around the public squares. Reviewing district complaints extends service; cultural and labour laws remain in force. Delivery is immediate; repeat after 30 days."
 STP_pe_festival_followup_upgrade_tt:0 "Public square services: §Y60§! instead of §Y30§! days."
 STP_pe_staff_course_a_idea:0 "An End to Military Powers"
 STP_pe_staff_course_a_idea_desc:0 "Emergency powers will receive an expiry date. Districts regain ordinary administration while the army retains its professional task of defending the country."
 STP_pe_staff_course_b_idea:0 "The Permanent Presence of the Staff"
 STP_pe_staff_course_b_idea_desc:0 "Staff representatives will remain in key ministries. Mobilisation planning becomes easier, while civilian budgets must account for a permanent military presence."
 STP_pe_staff_followup:0 "Hold Reserve Musters"
 STP_pe_staff_followup_desc:0 "Fund reserve musters and issue arms and equipment to reserve units. Reviewing orders increases equipment and army experience. Delivery is immediate; repeat after 30 days."
 STP_pe_staff_followup_upgrade_tt:0 "Reserve musters: §Y900§! rifles, §Y60§! support equipment and §Y15§! army experience."
 STP_pe_trade_course_a_idea:0 "Break Up the Trading Combines"
 STP_pe_trade_course_a_idea_desc:0 "Combined purchasing and supply offices will be separated. Lanskoy accepts greater oversight costs to give new producers access to public orders."
 STP_pe_trade_course_b_idea:0 "National Suppliers"
 STP_pe_trade_course_b_idea_desc:0 "Major contractors will receive long-term public contracts. Output rises, but the treasury becomes the permanent insurer of their mistakes."
 STP_pe_trade_followup:0 "Place a District Supply Order"
 STP_pe_trade_followup_desc:0 "Buy arms and support equipment from district workshops. The warehouse census increases deliveries for the same price. Delivery is immediate; repeat after 30 days."
 STP_pe_trade_followup_upgrade_tt:0 "District orders: §Y1350§! rifles and §Y90§! support equipment."
 STP_pe_security_course_a_idea:0 "Accountability of the Directors"
 STP_pe_security_course_a_idea_desc:0 "Office does not excuse a signed order. Directors will receive clear limits and an obligation to explain their use of force."
 STP_pe_security_course_b_idea:0 "The Archive Above the Office"
 STP_pe_security_course_b_idea_desc:0 "The archive will survive changes of director, but the chair retains control of access. Political standing will depend on the contents of closed files."
 STP_pe_security_followup:0 "Reopen Closed Cases"
 STP_pe_security_followup_desc:0 "Fund case reviews and return exonerated citizens to service. Checking confessions against orders increases releases and public trust. Delivery is immediate; repeat after 30 days."
 STP_pe_security_followup_upgrade_tt:0 "Case reviews: §Y1500§! £manpower_texticon and §G+2%§! stability."
 STP_pe_regent_course_a_idea:0 "Prepare a Treaty Revision"
 STP_pe_regent_course_a_idea_desc:0 "Stelander will prepare staff and accounts for a negotiated revision of its dependence. This strengthens its bargaining position; release still requires Nodrul's separate agreement."
 STP_pe_regent_course_b_idea:0 "A Long Mandate for the Advisers"
 STP_pe_regent_course_b_idea_desc:0 "Advisers receive a stable working arrangement and local offices receive predictable supplies under existing contracts. Faster work is purchased through continued privileges."
 STP_pe_regent_followup:0 "Fund Local Administrative Training"
 STP_pe_regent_followup_desc:0 "Fund administration and industrial accounting courses for local personnel. The aid and dependency audit extends training; the country's sovereignty status does not change. Delivery is immediate; repeat after 30 days."
 STP_pe_regent_followup_upgrade_tt:0 "Administrative training: §Y60§! instead of §Y30§! days."
