 STP_cw_open_local_depots:0 "Open the local depots"
 STP_cw_open_local_depots_desc:0 "District committees will gather reserves from departmental depots, hunting societies and volunteer militias. The front will receive 80000 rifles to replenish existing units in the opening days of the civil war."
 STP_cw_war_fund:0 "Resistance war fund"
 STP_cw_war_fund_desc:0 "Pool supporters' donations and district committee contributions in a war fund. Shabrat's treasury will receive 6000 monetary units for frontline supplies, weapons purchases and arsenal expansion."
 STP_cw_treasury_6000_tt:0 "The treasury will receive £ADISCORD_economy_treasury_texticon §G6000§! monetary units."
 STP_cw_volunteer_brigade_tt:0 "§Y1 fully equipped territorial volunteer brigade§! will appear in a state we own and control. Costs §Y6000§! £manpower_texticon; no rifles or treasury funds are taken from our reserves."
 STP_cw_volunteer_training_start_tt:0 "Spend §Y40§! £political_power_texticon and §Y12000§! £manpower_texticon to begin §Y21 days§! of training for two volunteer brigades. No rifles or treasury funds are spent. Manpower is refunded on cancellation; political power is not."
