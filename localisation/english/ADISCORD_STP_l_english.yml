 STP_REGION_ASSET_SUPPLY_NEEDS_DISTRICT: "\n  §Y- supply prepared; the district must join Shabrat to transfer fuel and support the army§!"
 STP_REGION_INSPECTION_CONCESSION: "\n\n§YInspection:§! the commission's terms have been accepted. Surviving civil or military connections are protected until its verdict; new operations in the district are suspended §Yuntil the current inspection ends§!. Its mission timer shows the remaining time."
 STP_REGION_INSPECTION_FALSE_TRAIL_READY: "\n\n§YInspection:§! the false trail is ready. This commission is guaranteed to follow it without exposing prepared assets."
 STP_REGION_INSPECTION_FALSE_TRAIL_PENDING: "\n\n§YInspection:§! the 7-day false-trail operation is underway. If it finishes before the timer, the current commission immediately ends its inspection."
 STP_REGION_INSPECTION_ACTIVE: "\n\n§YInspection:§! a commission is at work; its mission shows the time remaining. Possible responses: delay, a false trail, surrendering an official or opening the civil registers. Availability depends on completed focuses and local connections."
 STP_REGION_INSPECTION_COUNTERINTELLIGENCE: "\n\n§RCounterintelligence:§! regional actions are suspended for §Y56 days from its introduction§!. The district's Counterintelligence mission shows the time remaining."
