 STP_ch_institutions:0 "Domestic institutions and obligations"
 STP_ch_institutions_desc:0 "The consequences of dependency, appointments and honoured agreements. Chapter transitions do not remove institutions or investments."
 STP_ch_supply_crisis:0 "Disrupted independent supply"
 STP_ch_supply_crisis_desc:0 "Reforms proceeded without a commercial agreement or supply reserve. The penalty lasts 180 days."
