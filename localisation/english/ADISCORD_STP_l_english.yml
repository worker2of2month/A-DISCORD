 NOD_cw_accept_northern_status_quo:0 "Conclude peace in the north"
 NOD_cw_accept_northern_status_quo_desc:0 "More than 450 days of war have produced no decisive result. While neither side has achieved victory, the governments can end the northern campaign without territorial concessions. Only AI countries may take this decision, and all northern opponents must also be AI controlled."
 NOD_cw_accept_northern_status_quo_tt:0 "The northern war ends without annexations, new subjects or territorial transfers. Occupations end under white peace. Other wars continue. Kefreyt aid is settled as a neutral outcome."
 ADISCORD_STP_cw.83.t:0 "Northern War Ends Without a Victor"
 ADISCORD_STP_cw.83.d:0 "After more than four hundred and fifty days of fighting, Nodrul and the Northern Defence Alliance have agreed to end the war. Neither side gained a decisive advantage, and continuing the campaign demanded ever more men and equipment.\n\nThe agreement provides for neither territorial concessions nor changes of government. Troops are leaving occupied land. Nodrul has abandoned its attempt to impose its order on its neighbours, and the alliance has not obtained the concessions it hoped for. The question of the north's future remains open."
 ADISCORD_STP_cw.83.external:0 "The northern campaign has ended without a victor. The situation has changed, some participants have made separate agreements, and the original war plans no longer make sense. Nodrul and the remaining members of the Northern Defence Alliance are ceasing hostilities.\n\nThere will be no general treaty reorganising the region. Neither Nodrul's plan for dependent northern states nor the alliance's demands for border concessions have made it into the peace terms. Changes caused by other conflicts remain in force."
 ADISCORD_STP_cw.83.a:0 "The war has ended in a draw."
 # Party war: inheritance of the festival
 STP_Cyan_Crowe:0 "Cyan Crowe"
 STP_ph_six_chairs:0 "Six Chairs by the Bed"
 STP_ph_six_chairs_desc:0 "Six chairs stand by the bed of the Father of Peace, and each is already taken. Rufus Hedersett holds the apparatus, Marshal August Veil the General Staff, Vera Korvina the quiet service, Pavel Lanskoy the ports and casinos, Cyan Crowe the Chamber of High Houses, and Edgar Renner politely reminds everyone that without Nodrul there would be no bed at all. It is time to decide whose pen will sign orders after Ivanov."
 STP_ph_pen_of_staff:0 "The General Staff's Pen"
 STP_ph_pen_of_staff_desc:0 "Veil asks for little: the mobilisation lists and the right to see the patient first. In return the General Staff promises that the army will not choose between the party and the country. If victory comes, the generals will call it theirs."
 STP_ph_pen_of_silence:0 "The Quiet Service's Pen"
 STP_ph_pen_of_silence_desc:0 "Korvina brings folders, not demands. Each holds the names of Shabrat's people, their couriers and routes. The quiet service is ready to work before the resistance plants its first bomb. But she will keep the folders."
 STP_ph_pen_of_houses:0 "The High Houses' Pen"
 STP_ph_pen_of_houses_desc:0 "Cyan Crowe speaks so that only the addressee hears him. The Chamber will open its purses and calm the market's fear of war if the party admits the obvious: without the old houses nobody can pay for the festival."
 STP_ph_last_signature:0 "The Last Signature"
 STP_ph_last_signature_desc:0 "The succession decree is already printed. One signature is missing - a real one, or one that will be presented as real. Whoever holds the pen will enter history as the heir chosen by the Father of Peace himself."
 STP_ph_heirs_pact:0 "The Heirs' Pact"
 STP_ph_heirs_pact_desc:0 "Six people at one table agree not to divide the festival until the war is over. None of them trusts the others, but each understands that Shabrat will shoot them all alike."
 STP_ph_empty_chair:0 "One Chair Too Many"
 STP_ph_empty_chair_desc:0 "Hedersett has believed himself indispensable for too long. Pull the chair from under him now, before the shooting starts, and the war will be fought without festival speeches - and the victory will go to the holder of the pen."
 STP_ph_loyalty_plus_4_tt:0 "Support of every faction: §G+4§!. Apparatus loyalty is recalculated from their influence."
 STP_ph_loyalty_plus_5_tt:0 "Support of every faction: §G+5§!. Apparatus loyalty is recalculated from their influence."
 STP_ph_six_chairs_tt:0 "Unlocks the choice of the §Ysuccession pen§!. The chosen heir gains a §Yclaim on the victory§! in the civil war: once Shabrat is defeated, power passes to the strongest claim."
 STP_ph_pen_of_staff_tt:0 "§YAugust Veil's§! claim on the victory: §G+8§!."
 STP_ph_pen_of_silence_tt:0 "§YVera Korvina's§! claim on the victory: §G+8§!.\nShabrat's first announced sabotage plot in the civil war starts no earlier than day §Y49§! instead of §Y21§!."
 STP_ph_pen_of_houses_tt:0 "§YCyan Crowe's§! claim on the victory: §G+8§!.\nWar strain at the start of the civil war: §G-10§!."
 STP_ph_treasury_1500_tt:0 "Treasury: §G+1500§!. Funds above the treasury limit are lost."
 STP_ph_treasury_2000_tt:0 "Treasury: §G+2000§!. Funds above the treasury limit are lost."
 STP_ph_last_signature_tt:0 "The holder of the succession pen gains an additional claim on the victory: §G+6§!.\nIf Ivanov is already dead, the signature is doubtful: the legitimacy shift is smaller and stability falls."
 STP_ph_heirs_pact_tt:0 "War strain at the start of the civil war: §G-5§!."
 STP_ph_empty_chair_tt:0 "§YRadical Hedonists§!: support §R-15§!.\nThe pen holder's bloc: support §G+10§!.\n§YRufus Hedersett's§! claim on the victory: §R-10§!."
 STP_pv_war_budget:0 "Budget of a Besieged Showcase"
 STP_pv_war_budget_desc:0 "The resorts are empty, the casinos serve officers and the port accepts only military cargo. Every month of war burns what Stelander saved during twenty years of peace. The finance ministry proposes to stop pretending the season continues and to say plainly who will pay for victory."
 STP_pv_lower_market_ledgers:0 "Ledgers of the Lower Market"
 STP_pv_lower_market_ledgers_desc:0 "In the port cellars lie the books through which the money of clubs, warehouses and brokers passed for years. The party always pretended they did not exist. Now that money can buy rifles - if the party is willing to admit where it comes from."
 STP_pv_loyalty_tribunal:0 "Loyalty Tribunal"
 STP_pv_loyalty_tribunal_desc:0 "Travelling commissions visit staffs, depots and districts. Their task is not to judge but to remind: a bloc that bargains during the war will receive nothing after it."
 STP_pv_victory_committee:0 "Victory Committee"
 STP_pv_victory_committee_desc:0 "The last battle is not yet won, but the corridors already argue over who will enter the capital first. The Victory Committee must decide the main question: whose name will be chanted at the parade."
 STP_pv_glory_staff:0 "Glory to the General Staff"
 STP_pv_glory_staff_desc:0 "Soldiers and their commanders won the victory. The press writes about Veil's maps, not Hedersett's speeches. The army will remember who allowed it."
 STP_pv_glory_silence:0 "Glory to the Quiet Service"
 STP_pv_glory_silence_desc:0 "The war was won by those nobody saw: Korvina's people who exposed the underground in time. The heroes' names are not published, but their lists grow longer."
 STP_pv_glory_festival:0 "Glory to the Festival"
 STP_pv_glory_festival_desc:0 "Stelander fights for the right to celebrate again. Hedersett promises that after victory the festival will return louder than ever, and the festival guard marches past the stands."
 STP_pv_glory_wallets:0 "Glory to the Purses"
 STP_pv_glory_wallets_desc:0 "Without the ports' money there would be neither cartridges nor pay. Lanskoy demands that the newspapers remind everyone: the trading houses paid for victory, not the guns."
 STP_pv_victory_committee_ready_tt:0 "At least one front operation has been won, or the war has lasted at least §Y4§! months"
 STP_pv_victory_committee_tt:0 "Unlocks the choice of who receives the §Yglory of victory§! in public. The chosen figure gains a claim on the victory of §G+12§!."
 STP_pv_glory_staff_tt:0 "§YAugust Veil's§! claim on the victory: §G+12§!.\n§YArmy Command§!: support §G+8§!."
 STP_pv_glory_silence_tt:0 "§YVera Korvina's§! claim on the victory: §G+12§!.\n§YSecurity Service§!: support §G+8§!."
 STP_pv_glory_festival_tt:0 "§YRufus Hedersett's§! claim on the victory: §G+12§!.\n§YRadical Hedonists§!: support §G+8§!."
 STP_pv_glory_wallets_tt:0 "§YPavel Lanskoy's§! claim on the victory: §G+12§!.\n§YMerchants§!: support §G+8§!."
 STP_pv_strain_minus_5_tt:0 "War strain: §G-5§!"
 STP_pv_strain_minus_6_tt:0 "War strain: §G-6§!"
 STP_pv_strain_minus_8_tt:0 "War strain: §G-8§!"
 STP_pv_strain_minus_12_tt:0 "War strain: §G-12§!"
 STP_pv_strain_minus_15_tt:0 "War strain: §G-15§!"
 STP_pv_strain_plus_5_tt:0 "War strain: §R+5§!"
 STP_pv_strain_plus_10_tt:0 "War strain: §R+10§!"
 STP_pv_treasury_2500_tt:0 "Treasury: §G+2500§!. Funds above the treasury limit are lost."
 STP_pv_house_bonds_factions_tt:0 "§YConservatives§!: support §G+8§!. §YMerchants§!: support §R-6§!."
 STP_pv_sell_concessions_factions_tt:0 "§YRadical Hedonists§!: support §G+10§!. §YConservatives§!: support §R-10§!."
 STP_pv_requisition_casinos_factions_tt:0 "§YMerchants§!: support §R-12§!."
 STP_pv_northern_loan_claim_tt:0 "§YEdgar Renner's§! claim on the victory: §G+6§!."
 STP_pv_loyalty_commission_tt:0 "Every faction with support below §Y35§!: support §G+10§!.\n§YSecurity Service§!: support §G+4§!."
 STP_pv_front_1_timeout_tt:0 "Resolved at the deadline: the Congress and the Pier are held, and at least §Y[?STP_pv_front_target|0]§! heartland districts are controlled."
 STP_pv_front_2_timeout_tt:0 "Resolved at the deadline: at least §Y[?STP_pv_front_target|0]§! heartland districts are controlled."
 STP_pv_front_3_timeout_tt:0 "Resolved at the deadline: at least §Y[?STP_pv_front_target|0]§! heartland districts or Abiliya are controlled."
 STP_pv_front_1:0 "Ring around Fada"
 STP_pv_front_1_desc:0 "The resistance is testing whether the capital can survive the first blow. By the deadline the party must hold the Bronze Congress and the Pier without losing any of the §Y[?STP_pv_front_target|0]§! heartland districts it controls: Abiliya, New Monaii, the Niansa Region, Fada, Kreyden, the Livonin District, Khoskheyt and the Old Fada Forest.\n\nSuccess: the army earns recognition and strain falls. Failure: the Chamber and the radicals look for culprits and strain grows."
 STP_pv_front_2:0 "Take Back a District"
 STP_pv_front_2_desc:0 "Holding on is not enough: the country must see that the party can advance. By the deadline at least §Y[?STP_pv_front_target|0]§! heartland districts must be under control.\n\nSuccess: the command gains influence. Failure: the generals are blamed for passivity and the quiet service gains a pretext to inspect the staffs."
 STP_pv_front_3:0 "Breakthrough to Abiliya"
 STP_pv_front_3_desc:0 "Abiliya is Shabrat's first capital and his supporters' last hope. By the deadline the party must control at least §Y[?STP_pv_front_target|0]§! heartland districts or Abiliya itself.\n\nSuccess: the army gains experience and trust. Failure: money flees the country and the command loses face."
 STP_pv_printing_press:0 "Start the Printing Press"
 STP_pv_printing_press_desc:0 "The treasury can print a month's pay in advance. Soldiers get the money today; prices will catch up with them tomorrow."
 STP_pv_house_bonds:0 "War Bonds of the High Houses"
 STP_pv_house_bonds_desc:0 "The Chamber will buy victory bonds in exchange for postwar property guarantees. The trading houses pay their share without pleasure."
 STP_pv_sell_concessions:0 "Sell Lower Market Concessions"
 STP_pv_sell_concessions_desc:0 "The port's warehouses, clubs and treatment zones pass to whoever can pay at once. The radicals call it free trade. The conservatives call it a disgrace someone will write about one day."
 STP_pv_requisition_casinos:0 "Requisition the Coastal Casinos"
 STP_pv_requisition_casinos_desc:0 "The takings of the coastal gambling halls will go to the front. The owners do not argue aloud, but they remember."
 STP_pv_northern_loan:0 "Northern Loan"
 STP_pv_northern_loan_desc:0 "Nodrul is ready to open a credit line. Edgar Renner stresses that the terms will be soft. He does not say when they will harden."
 STP_pv_festival_levy:0 "Call Up the Festival Guard"
 STP_pv_festival_levy_desc:0 "Hedersett proposes to arm the guards of festivals, clubs and parades. These people shoot badly but march well, and they owe him."
 STP_pv_loyalty_commission:0 "Travelling Loyalty Commission"
 STP_pv_loyalty_commission_desc:0 "The tribunal's commission tours the wavering blocs, hands out promises and collects signatures. The quiet service reads both lists carefully."
 STP_pv_strain_dynamic:0 "War Strain"
 STP_pv_strain_dynamic_desc:0 "The resort economy pays for the war until it breaks. Strain rises every month, faster after losing the Congress and the Pier, and falls through war-economy decisions and victories at the front.\n\n\n\n\n\n £GFX_ADISCORD_vorkerland_civil_war_exhaustion_banner \n\n\n"
 STP_pv_generals_bargaining:0 "Generals at the Table"
 STP_pv_generals_bargaining_desc:0 "Staff officers are busier with letters than with maps."
 STP_pv_silent_service:0 "Silence of the Quiet Service"
 STP_pv_silent_service_desc:0 "Korvina has stopped reporting. The government learns of failures from the newspapers."
 STP_pv_festival_riots:0 "Festival Guard Riots"
 STP_pv_festival_riots_desc:0 "The guard celebrates without permission, and the city pays for its party."
 STP_pv_chamber_intrigue:0 "Intrigues of the Chamber"
 STP_pv_chamber_intrigue_desc:0 "The High Houses conduct their own negotiations and slow every government decision."
 STP_pv_northern_cold:0 "Northern Cold"
 STP_pv_northern_cold_desc:0 "The Nodrul advisers answer requests late and without signatures."
 STP_pv_outcome_houses:0 "The Chamber Sits Again"
 STP_pv_outcome_houses_desc:0 "The old houses accepted the victory. The state has become quieter, cheaper and slower."
 STP_pv_outcome_festival:0 "The Festival Goes On"
 STP_pv_outcome_festival_desc:0 "Hedersett turned the victory into the loudest festival in the country's history."
 STP_pv_outcome_staff:0 "Peace by Regulation"
 STP_pv_outcome_staff_desc:0 "The General Staff governs the country as it fought the war: with orders and deadlines."
 STP_pv_outcome_wallets:0 "The Showcase Is Open"
 STP_pv_outcome_wallets_desc:0 "The ports work, the casinos glow, and talk of war is discouraged."
 STP_pv_outcome_silence:0 "Silence After the Shots"
 STP_pv_outcome_silence_desc:0 "Order rests on the quiet service's lists. Nobody argues - at least not aloud."
 STP_pv_outcome_regent:0 "The Northern Regent"
 STP_pv_outcome_regent_desc:0 "Nodrul's money and advisers brought the victory, and now they write the budget."
 STP_pv_pyrrhic_victory:0 "Pyrrhic Victory"
 STP_pv_pyrrhic_victory_desc:0 "The war was won at the cost of the showcase: the resorts are empty and creditors wait at the door."
 STP_pv_clean_victory:0 "United Victory"
 STP_pv_clean_victory_desc:0 "The party came through the war without falling apart from within, and everyone can see it."
 STP_pv_kefreyt_bill:0 "Bill of the Kefreyt Contractors"
 STP_pv_kefreyt_bill_desc:0 "Weapons bought from Kefreyt's contractors during the war must be paid for with ore and water."
 STP_pv_strain_report:0 "\n\n§YInheritance of the Festival§!\nWar strain: §Y[?STP_pv_strain|0]§!/100. Thresholds: 40 - empty resorts, 70 - capital flight, 100 - bankruptcy of the showcase.\nClaims on the victory: Crowe §Y[?STP_pv_claim_1|1]§!, Hedersett §Y[?STP_pv_claim_2|1]§!, Veil §Y[?STP_pv_claim_3|1]§!, Lanskoy §Y[?STP_pv_claim_4|1]§!, Korvina §Y[?STP_pv_claim_5|1]§!, Renner §Y[?STP_pv_claim_6|1]§!. Currently leading: [STPGetVictoryClaimant]."
 STP_pv_claimant_1:0 "§YCyan Crowe and the Chamber of High Houses§!"
 STP_pv_claimant_2:0 "§YRufus Hedersett§!"
 STP_pv_claimant_3:0 "§YAugust Veil§!"
 STP_pv_claimant_4:0 "§YPavel Lanskoy§!"
 STP_pv_claimant_5:0 "§YVera Korvina§!"
 STP_pv_claimant_6:0 "§YEdgar Renner§!"
 STP_pv_aftertaste_pyrrhic:0 "The victory cost too much: the country has won a §YPyrrhic victory§!, and the next year will pass under the sign of debt."
 STP_pv_aftertaste_clean:0 "The party came through the war without losing a single pillar and won a §Yunited victory§!."
 STP_pv_aftertaste_plain:0 "The price of victory has yet to be counted - in the budget and in the lists."
 ADISCORD_STP_pv.1.t:0 "Six Chairs by the Bed"
 ADISCORD_STP_pv.1.d:0 "Petr Ivanov's bedroom always holds a silence no money can buy. Doctors whisper, secretaries walk without shoes, and at the head of the bed stand six chairs. Nobody arranged them on purpose. They were simply brought in one day, and since then each chair has belonged to someone.\n\nRufus Hedersett sits in the first, in dark glasses, reading the patient newspapers he orders himself. Marshal August Veil sits in the second and has never taken off his gloves. Vera Korvina takes the third; she comes without folders because she remembers everything. Pavel Lanskoy brings reports from the ports and casino takings - the only news that still pleases the Father of Peace. Cyan Crowe, chairman of the Chamber of High Houses, sits furthest away and hears the most. The last chair is formally empty, but every morning Edgar Renner of the Nodrul mission lays fresh flowers on it.\n\nIvanov no longer always recognises faces. But while his hand can still hold a pen, each of the six hopes to be the one who guides it to paper. Shabrat is preparing an uprising in the mountains. Here they prepare for something else - dividing a victory that does not yet exist."
 ADISCORD_STP_pv.1.a:0 "The festival will outlive its founder. The question is who inherits it."
 ADISCORD_STP_pv.2.t:0 "The Last Signature"
 ADISCORD_STP_pv.2.alive:0 "The succession decree was brought early in the morning while the doctors changed the bandages. Ivanov looked at the paper for a long time, as if trying to remember who had written it, and then asked whether the lights on the embankment were still lit. He was told they were. He signed.\n\nThe signature came out uneven, but real. By noon its copies hung in every district chancellery, and the newspapers printed a photograph of the pen beside a portrait of the young Father of Peace. The party received what the resistance will never have: the blessing of the man who bought the sky.\n\nThe other five at the bedside were the first to congratulate the winner. None of them will forget who held the pen."
 ADISCORD_STP_pv.2.dead:0 "The succession decree was signed after the Father of Peace had stopped breathing. Officially, an hour before his death. The doctors agreed with that time, the secretaries with the wording, and the chancellery seal with everything else.\n\nThe capital received the decree in silence. Too many saw how long the chancellery lights burned that night. Shabrat's people already spread leaflets with an enlarged copy of the signature and a question: why did a dead man's hand grow steadier than it was in life?\n\nThe party has its document. Trust will have to be won by other means."
 ADISCORD_STP_pv.2.a:0 "History remembers the signature, not the hour."
 ADISCORD_STP_pv.10.t:0 "Empty Resorts"
 ADISCORD_STP_pv.10.d:0 "For the first time in twenty years the garlands on the Fada embankment have gone dark. Hotels stand with closed shutters, croupiers have become quartermasters, and the last tourists left together with the foreign journalists. The finance ministry reports that the resort season on which the budget rested ended early - and nobody knows whether the next one will begin.\n\nOfficials offer three answers. The treasury can take Lower Market money: it is dirty, but plentiful and already here. The showcase can be honestly closed until the end of the war and thrift declared heroism. Or everyone can keep pretending nothing happened and hope the war proves shorter than the season."
 ADISCORD_STP_pv.10.a:0 "Let the Lower Market pay for the war."
 ADISCORD_STP_pv.10.a_tt:0 "Treasury: §G+1500§!. War strain: §G-10§!."
 ADISCORD_STP_pv.10.a_tt_pf:0 "§YRadical Hedonists§!: support §G+10§!. §YConservatives§!: support §R-10§!."
 ADISCORD_STP_pv.10.b:0 "Close the showcase until victory."
 ADISCORD_STP_pv.10.b_tt:0 "War strain: §G-5§!."
 ADISCORD_STP_pv.10.b_tt_pf:0 "§YMerchants§!: support §R-12§!."
 ADISCORD_STP_pv.10.c:0 "The season goes on. Print that."
 ADISCORD_STP_pv.10.c_tt:0 "War strain does not change."
 ADISCORD_STP_pv.10.c_tt_pf:0 "§YMerchants§!: support §G+6§!. §YRadical Hedonists§!: support §G+4§!."
 ADISCORD_STP_pv.11.t:0 "Capital Flight"
 ADISCORD_STP_pv.11.d:0 "At night three merchant ships left the port of Fada without cargo and with full safes. In the morning it turned out that the accounts of several High Houses had been emptied the day before. Bankers speak of temporary precautions. Shabrat's newspapers speak of rats leaving the ship first.\n\nIf nothing is done, other ships will follow. If the accounts are frozen, the Houses will remember it for a long time. Edgar Renner unobtrusively recalls that Nodrul knows how to guarantee other people's money - for a reasonable fee."
 ADISCORD_STP_pv.11.a:0 "Freeze the High Houses' accounts."
 ADISCORD_STP_pv.11.a_tt:0 "Treasury: §G+3000§!. War strain: §G-15§!."
 ADISCORD_STP_pv.11.a_tt_pf:0 "§YConservatives§!: support §R-15§!. §YMerchants§!: support §R-20§!."
 ADISCORD_STP_pv.11.b:0 "Let the money go to keep our friends."
 ADISCORD_STP_pv.11.b_tt:0 "§YMerchants§!: support §G+10§!. §YConservatives§!: support §G+10§!."
 ADISCORD_STP_pv.11.c:0 "Ask Nodrul for guarantees."
 ADISCORD_STP_pv.11.c_tt:0 "War strain: §G-20§!.\n§YEdgar Renner's§! claim on the victory: §G+6§!."
 ADISCORD_STP_pv.12.t:0 "Bankruptcy of the Showcase"
 ADISCORD_STP_pv.12.d:0 "The treasury can no longer pay the army, the officials and the creditors at the same time. The first have not received their pay, the second their bonuses, the third their interest. At the finance ministry's doors stands a queue in which officers in dress uniform elbow casino managers.\n\nStelander, which for twenty years sold the world an image of carefree luxury, publicly admits for the first time that there is no money. The party will have to name the culprit, and that name will decide who keeps paying."
 ADISCORD_STP_pv.12.common_tt:0 "Support of every faction: §R-8§!. War strain falls to §Y75§!."
 ADISCORD_STP_pv.12.a:0 "Declare a debt moratorium."
 ADISCORD_STP_pv.12.a_tt:0 "§YMerchants§!: support §R-10§!."
 ADISCORD_STP_pv.12.b:0 "The speculators are to blame."
 ADISCORD_STP_pv.12.b_tt:0 "§YMerchants§!: support §R-20§!. §YSecurity Service§!: support §G+8§!."
 ADISCORD_STP_pv.20.t:0 "The Generals Bargain"
 ADISCORD_STP_pv.20.d:0 "Vera Korvina put an intercepted letter on the table. Two corps commanders discuss with Shabrat's intermediary the terms on which the army might «stay neutral in a political dispute». The letter is polite and contains no threats. That is what frightens most.\n\nMarshal Veil insists he knew nothing, but adds that the army is tired of fighting for people who do not pay it on time. The General Staff awaits an answer not from the party but from him personally - and he wants the party to answer first."
 ADISCORD_STP_pv.20.a:0 "Give the staff everything it asks for."
 ADISCORD_STP_pv.20.a_tt:0 "§YArmy Command§!: support §G+20§!. §YNodrulian Advisers§!: support §R-8§!."
 ADISCORD_STP_pv.20.b:0 "Arrest the most talkative."
 ADISCORD_STP_pv.20.b_tt:0 "§YArmy Command§!: support §R-10§!."
 ADISCORD_STP_pv.20.c:0 "Let them bargain as long as they fight."
 ADISCORD_STP_pv.21.t:0 "Radio Silence"
 ADISCORD_STP_pv.21.d:0 "For the second week not a single report has come from the quiet service. Korvina's people still come to work, still draw their pay, and still tell nobody anything. The government learns about Shabrat's sabotage from the morning papers.\n\nKorvina explains the silence simply: the service will not work for people who hide the Chamber's archives and the Lower Market's accounts from it. She needs full access. Otherwise the party can fight blind."
 ADISCORD_STP_pv.21.a:0 "Open every archive to the quiet service."
 ADISCORD_STP_pv.21.a_tt:0 "§YSecurity Service§!: support §G+20§!. §YConservatives§!: support §R-10§!."
 ADISCORD_STP_pv.21.b:0 "Hand intelligence to the army."
 ADISCORD_STP_pv.21.b_tt:0 "§YSecurity Service§!: support §R-10§!."
 ADISCORD_STP_pv.21.c:0 "We will manage without her reports."
 ADISCORD_STP_pv.22.t:0 "Accounts Are Closing"
 ADISCORD_STP_pv.22.d:0 "Pavel Lanskoy did not come alone: behind him the managers of six port companies and the two largest casinos entered the waiting room. They make no threats. They simply show how much money has already been moved to Nodrul and the southern republics and how much will leave by the end of the month if the state gives no guarantees.\n\nLanskoy says the trading houses are not against the war. They are against a war after which they will have nothing to trade."
 ADISCORD_STP_pv.22.a:0 "Guarantee deposits from the treasury."
 ADISCORD_STP_pv.22.a_tt:0 "Treasury: §R-1500§!."
 ADISCORD_STP_pv.22.a_tt_pf:0 "§YMerchants§!: support §G+20§!."
 ADISCORD_STP_pv.22.b:0 "Nationalise the port accounts."
 ADISCORD_STP_pv.22.b_tt:0 "Treasury: §G+1500§!. War strain: §R+5§!."
 ADISCORD_STP_pv.22.b_tt_pf:0 "§YMerchants§!: support §R-15§!."
 ADISCORD_STP_pv.22.c:0 "Let them go. Their money will return after victory."
 ADISCORD_STP_pv.22.c_tt:0 "War strain: §R+12§!."
 ADISCORD_STP_pv.22.c_tt_pf:0 "§YMerchants§!: support §G+5§!."
 ADISCORD_STP_pv.23.t:0 "The Festival Guard Riots"
 ADISCORD_STP_pv.23.d:0 "The festival guard - people who spent twenty years guarding carnivals, clubs and parades - has occupied the warehouses on the embankment. They are not rising against the party: Hedersett's portraits hang over the warehouses. They demand what they were promised - wine, pay and the right not to go to the front.\n\nHedersett assures everyone the matter will be settled in one evening if the pleasure stores are opened. Marshal Veil proposes to disarm the guard and send it to the trenches. Meanwhile the city waits to hear whose music plays louder."
 ADISCORD_STP_pv.23.a:0 "Open the pleasure stores."
 ADISCORD_STP_pv.23.a_tt:0 "§YRadical Hedonists§!: support §G+20§!. §YConservatives§!: support §R-10§!."
 ADISCORD_STP_pv.23.b:0 "Disarm the guard."
 ADISCORD_STP_pv.23.b_tt:0 "§YRadical Hedonists§!: support §R-10§!."
 ADISCORD_STP_pv.23.c:0 "Wait for the party to end by itself."
 ADISCORD_STP_pv.24.t:0 "Plot in the Chamber"
 ADISCORD_STP_pv.24.d:0 "In a closed club on the upper tier of Fada, representatives of nine High Houses meet. Officially, to discuss a charity ball. Unofficially, to decide what price Shabrat would ask for sparing their estates if the party loses.\n\nCyan Crowe was not present, but knows everything. He offers the government two paths: invite the Chamber to the common table and give it a voice in war decisions - or show the plotters that the quiet service can listen too."
 ADISCORD_STP_pv.24.a:0 "Invite the Chamber to the table."
 ADISCORD_STP_pv.24.a_tt:0 "§YConservatives§!: support §G+20§!. §YRadical Hedonists§!: support §R-10§!."
 ADISCORD_STP_pv.24.b:0 "Show the Chamber the quiet room."
 ADISCORD_STP_pv.24.b_tt:0 "§YConservatives§!: support §R-10§!."
 ADISCORD_STP_pv.24.c:0 "Pretend we heard nothing."
 ADISCORD_STP_pv.25.t:0 "The Districts Waver"
 ADISCORD_STP_pv.25.d:0 "The district borons have stopped answering telegrams from the capital. Some claim the lines are damaged. Others honestly write that they are waiting to see whose army enters their towns first, so they know to whom they should hand taxes and recruits.\n\nIf the districts are given no reason to stay with the party, they will start hiding people - from both sides at once."
 ADISCORD_STP_pv.25.a:0 "Hand out district mandates."
 ADISCORD_STP_pv.25.a_tt:0 "§YBorons§!: support §G+20§!."
 ADISCORD_STP_pv.25.b:0 "Send commissars."
 ADISCORD_STP_pv.25.b_tt:0 "§YBorons§!: support §R-10§!."
 ADISCORD_STP_pv.25.c:0 "The districts will not go anywhere."
 ADISCORD_STP_pv.26.t:0 "The Northerners Count the Costs"
 ADISCORD_STP_pv.26.d:0 "Edgar Renner brought a neat folder to the ministry. It lists everything Nodrul has already given the party: advisers, credits, rifles, legal counsel. Beside each line stands a price. At the bottom is an empty space for a signature.\n\nRenner says the northerners are in no hurry. But the advisers appear at the staffs less often and deliveries arrive late. Nodrul wants to know whether the party sees it as an ally or a creditor."
 ADISCORD_STP_pv.26.a:0 "Sign the northern supply protocol."
 ADISCORD_STP_pv.26.a_tt:0 "§YNodrulian Advisers§!: support §G+20§!. §YArmy Command§!: support §R-8§!."
 ADISCORD_STP_pv.26.b:0 "Remind Nodrul whose war this is."
 ADISCORD_STP_pv.26.b_tt:0 "§YNodrulian Advisers§!: support §R-10§!."
 ADISCORD_STP_pv.26.c:0 "Stay silent and wait for deliveries."
 ADISCORD_STP_pv.30.t:0 "Front Report"
 ADISCORD_STP_pv.30.d1:0 "The resistance has brought forces to the outskirts of Fada. Intelligence reports that Shabrat wants to test the main question: can the party withstand the first real blow against the capital?\n\nThe General Staff receives six weeks. By the end, the Bronze Congress and the Pier must remain in our hands and the district line must not move back. If the capital stands, the army earns the right to speak in the name of victory. If not, the Chamber and the radicals will find culprits among their own."
 ADISCORD_STP_pv.30.d2:0 "The first weeks of war showed the capital can hold. Now the country needs another proof - that the party can recover what it lost.\n\nThe staff receives eight weeks to retake at least one heartland district. Success will strengthen the command; failure will give the quiet service a pretext to inspect every general."
 ADISCORD_STP_pv.30.d3:0 "The war enters its last phase. Abiliya, where Shabrat began his uprising, remains the symbol of resistance while his flag flies over it.\n\nThe staff receives ten weeks to take Abiliya or two more heartland districts. This is the army's last chance to prove the victory belongs to it."
 ADISCORD_STP_pv.30.a:0 "The orders are sent."
 ADISCORD_STP_pv.31.t_win:0 "Staff Objective Met"
 ADISCORD_STP_pv.31.t_loss:0 "Staff Objective Not Met"
 ADISCORD_STP_pv.31.t_win1:0 "Defensive Objective Met"
 ADISCORD_STP_pv.31.t_loss1:0 "Defensive Objective Not Met"
 ADISCORD_STP_pv.31.t_win2:0 "Offensive Plan Fulfilled"
 ADISCORD_STP_pv.31.t_loss2:0 "Offensive Behind Schedule"
 ADISCORD_STP_pv.31.t_win3:0 "Breakthrough Objective Met"
 ADISCORD_STP_pv.31.t_loss3:0 "Breakthrough Objective Not Met"
 ADISCORD_STP_pv.31.win1:0 "The ring around Fada did not close. The Bronze Congress still sits under the party flag and the Pier still receives military cargo. Marshal Veil personally toured the positions and made sure the newspapers photographed it.\n\nThe army earned recognition, and tension in the capital eased noticeably."
 ADISCORD_STP_pv.31.win2:0 "The party flag flies again over the retaken district. The staff reported success before the casualty lists arrived, and nobody in the capital asked about them.\n\nThe command strengthened its influence in the government. Korvina's people are checking the lists of the decorated."
 ADISCORD_STP_pv.31.win3:0 "The resistance has lost the ground where it began. Even if Shabrat still holds out, his people no longer believe the mountains will protect them forever.\n\nThe army gained experience, trust and the right to march first at the coming parade."
 ADISCORD_STP_pv.31.loss1:0 "The defensive objective was not fully met by the deadline. The directive required the Bronze Congress and the Pier to remain in Party hands, with at least the original number of districts under Party control. At least one of these conditions was not met. The Chamber demands explanations, and the radicals seek someone to blame.\n\nWar strain rose sharply. The government must explain why the staff report falls short of its promises."
 ADISCORD_STP_pv.31.loss2:0 "The offensive directive's deadline has passed, and the planned number of districts under Party control has not been reached. The staff blames the delay on a shortage of shells, the ministry on the generals' indecision, the quiet service on treason.\n\nThe command loses trust over its unfulfilled plan, and the security service gains a pretext to inspect the staffs."
 ADISCORD_STP_pv.31.loss3:0 "By the deadline, the Party had neither taken Abiliya nor reached the planned number of controlled districts. Shabrat's supporters call it their victory, while the capital's trading houses quietly move money abroad.\n\nThe promised offensive result has not materialized. The army loses trust and strain keeps growing."
 ADISCORD_STP_pv.31.a:0 "Understood."
 ADISCORD_STP_pv.40.t:0 "Contractors Sell to Both Sides"
 ADISCORD_STP_pv.40.d:0 "A representative of a private Kefreyt firm appeared at the defence ministry without invitation and without a flag. He does not hide that his colleagues already supply Shabrat. He simply believes each side deserves a supplier.\n\nThe firm offers rifles, guns and equipment from depots on the border. Nothing has to be paid now: the bill will arrive after the war - in ore, water and transit rights. The Nodrul advisers asked to be told of any contact with Kefreyt."
 ADISCORD_STP_pv.40.a:0 "Buy from the contractors."
 ADISCORD_STP_pv.40.a_tt:0 "After victory the country receives the §YBill of the Kefreyt Contractors§! for a year: overall income §R-8%§!."
 ADISCORD_STP_pv.40.a_tt_pf:0 "§YNodrulian Advisers§!: support §R-15§!."
 ADISCORD_STP_pv.40.b:0 "Refuse and inform the northerners."
 ADISCORD_STP_pv.40.b_tt:0 "§YNodrulian Advisers§!: support §G+10§!."
 ADISCORD_STP_pv.41.t:0 "Victory Committee"
 ADISCORD_STP_pv.41.d:0 "The first session of the Victory Committee lasted six hours, and less than one of them was spent on the war. The rest went to the order of speeches at the coming parade, the list of ministries and whose photograph will hang in the district chancelleries.\n\nThe strongest position currently belongs to [STPGetVictoryClaimant]. Claims on the victory: Crowe - [?STP_pv_claim_1|1], Hedersett - [?STP_pv_claim_2|1], Veil - [?STP_pv_claim_3|1], Lanskoy - [?STP_pv_claim_4|1], Korvina - [?STP_pv_claim_5|1], Renner - [?STP_pv_claim_6|1].\n\nThe committee can publicly give the glory to one side. It will not decide everything, but it will decide much: when Shabrat falls, power goes to the strongest claim."
 ADISCORD_STP_pv.41.a:0 "First victory. Then the parade."
 ADISCORD_STP_pv.50.t1:0 "The Chamber Sits Again"
 ADISCORD_STP_pv.50.d1:0 "When Shabrat's last detachment laid down its arms, the first to enter the capital were not tanks but the cars of the High Houses. Cyan Crowe opened a session of the Chamber that same evening. He spoke quietly, and for the first time in years the hall listened in silence.\n\nThe victory was credited neither to the generals nor to the radicals. It was called «a return of the natural order» in which the country is governed by those who pay for it. Hedersett received an honorary post without powers, Veil the Chamber's gratitude, Korvina a dinner invitation that everyone took as a warning.\n\nCrowe promises stability, a cheap government and peace without unnecessary noise. At the party congress his presidium will hold the victor's mandate. [STPGetVictoryAftertaste]"
 ADISCORD_STP_pv.50.t2:0 "The Festival Goes On"
 ADISCORD_STP_pv.50.d2:0 "Rufus Hedersett announced the victory from the balcony where the Father of Peace once spoke. Garlands were lit again over the embankment, wine was poured in the squares, and the festival guard marched past stands where ministers stood shoulder to shoulder with casino managers.\n\nHedersett promises the country what it wanted after every war: to forget. The archives stay closed, the lists unpublished, and questions about the price of victory inappropriate on festival days. The generals and the Chamber got their places on the stands, but the microphone stayed with him.\n\nAt the party congress the radical candidate will speak with the victor's mandate. [STPGetVictoryAftertaste]"
 ADISCORD_STP_pv.50.t3:0 "Peace by Regulation"
 ADISCORD_STP_pv.50.d3:0 "Marshal August Veil did not speak from the balcony. He read the order ending hostilities over the radio, drily and without a single epithet, and then announced that until civil institutions are restored the country will be governed by a military collegium.\n\nHedersett called it a temporary measure. Veil did not object. The festival guard was disbanded within a week, the casinos were ordered to pay a military tax, and the quiet service for the first time received an order signed not by a party secretary but by a general.\n\nThe army won the war and is now certain it can win the peace. At the party congress the military candidate will speak with the victor's mandate. [STPGetVictoryAftertaste]"
 ADISCORD_STP_pv.50.t4:0 "The Showcase Is Open"
 ADISCORD_STP_pv.50.d4:0 "Three days after the fighting ended, the first passenger ship in half a year entered the port of Fada. Pavel Lanskoy met it personally. The newspapers wrote not about the fallen or the prisoners but about the season starting on time.\n\nThe trading houses that paid for the war received the right to lead the reconstruction. Military spending was cut, the festival guard was sent to guard hotels, and talk of victory is to be conducted so as not to frighten tourists.\n\nLanskoy is sure a country that earns again will not want to recall how it paid. At the party congress his candidacy will hold the victor's mandate. [STPGetVictoryAftertaste]"
 ADISCORD_STP_pv.50.t5:0 "Silence After the Shots"
 ADISCORD_STP_pv.50.d5:0 "The parade was held without an orchestra. Vera Korvina explained that loud noises could provoke unrest. Nobody argued.\n\nThe lists compiled by the quiet service during the war were not destroyed after it. They were simply renamed. Former Shabrat supporters, wavering borons, talkative generals and overly generous merchants are invited to conversations after which they become noticeably quieter. Hedersett still speaks on the radio, but his speeches are now approved in advance.\n\nThe country is calmer than ever. At the party congress the security candidate will speak with the victor's mandate. [STPGetVictoryAftertaste]"
 ADISCORD_STP_pv.50.t6:0 "The Northern Regent"
 ADISCORD_STP_pv.50.d6:0 "The victory was celebrated at the Nodrul mission before the Bronze Congress. Edgar Renner raised a short toast: to Stelander's freedom, preserved thanks to its northern friends.\n\nNow those friends present the bill. The advisers stay in the ministries, the credits in the budget, and Renner receives the right to sign papers Ivanov used to sign. Hedersett calls it an alliance. Veil calls it an occupation without shots. Crowe stays silent, because the Chamber has already agreed with the north about its estates.\n\nThe party won the war but lost the question Shabrat fought for: whose voice speaks in Stelander. [STPGetVictoryAftertaste]"
 ADISCORD_STP_pv.50.a:0 "Victory always belongs to someone."
 STP_ch_houses_black_book:0 "The Chamber's Black Book"
 STP_ch_houses_black_book_desc:0 "Cyan Crowe knows where the Black Book lies - the register of the Lower Market's clients, brokers and patrons. The Chamber will not publish it. It will simply lock the book in its vault, and everyone whose name is written there will suddenly become the government's most devoted supporter."
 STP_ch_houses_black_book_tt:0 "Support of every faction: §G+8§!. Apparatus loyalty is recalculated from their influence."
 STP_ch_eternal_festival:0 "The Eternal Festival"
 STP_ch_eternal_festival_desc:0 "Hedersett declares that the festival will never again be interrupted. Resorts open free of charge to veterans, orchestras play in the squares again, and questions about the price of the war are declared bad manners."
 STP_ch_eternal_festival_tt:0 "§YRadical Hedonists§!: support §G+10§!. §YConservatives§!: support §R-6§!."
 STP_ch_staff_state:0 "The army and the state"
 STP_ch_staff_state_desc:0 "Veil settles the army's place in the postwar state. Its influence follows the decisions already made about the ministry, budget and the staff's role in politics."
 STP_ch_staff_state_tt:0 "§YArmy Command§!: support §G+10§!."
 STP_ch_season_open:0 "The Season Is Open"
 STP_ch_season_open_desc:0 "The ports welcome liners, the casinos foreigners and the trading houses state contracts. Pavel Lanskoy proves that the showcase can feed the country again if the military stop frightening it."
 STP_ch_season_open_tt:0 "§YMerchants§!: support §G+10§!."
 STP_ch_quiet_order:0 "Quiet Order"
 STP_ch_quiet_order_desc:0 "Korvina declares the emergency period over. Behind the outward calm stands the chosen settlement: an accountable service or a directorate with its own veto."
 STP_ch_quiet_order_tt:0 "The last purge ends if it is still active."
 STP_ch_quiet_order_tt_pf:0 "§YSecurity Service§!: support §G+10§!."
 STP_ch_war_victor_continuity_tt:0 "This faction already won the civil war and continues its own programme."
 STP_pv_season_treasury_tt:0 "Treasury: §G+3000§!. Funds above the treasury limit are lost."
 ADISCORD_STP_pv.31.t:0 "[STPGetFrontResultTitle]"
 ADISCORD_STP_pv.50.t:0 "[STPGetVictoryTitle]"
 STP_pv_news_1:0 "\n\nPower in the capital passes to the Chamber of High Houses. Its chairman Cyan Crowe promises «a natural order», quiet government and respect for property."
 STP_pv_news_2:0 "\n\nRufus Hedersett proclaimed victory from the Father of Peace's balcony and promised that the festival will return louder than ever."
 STP_pv_news_3:0 "\n\nMarshal August Veil announced that a military collegium will govern the country until civil institutions are restored."
 STP_pv_news_4:0 "\n\nThe government is now led by Pavel Lanskoy, who speaks for the ports and trading houses. His first decision opened the resort season."
 STP_pv_news_5:0 "\n\nVera Korvina of the security service has become the de facto head of government. The victory parade was held without an orchestra."
 STP_pv_news_6:0 "\n\nKey decisions are now signed by Edgar Renner of the Nodrul mission. In Nodrul the party's victory is called a shared one."
 # Party treasury decisions
 STP_pm_cost_600:0 "§Y600§! £ADISCORD_economy_treasury_texticon"
 STP_pm_cost_600_blocked:0 "§R600§! £ADISCORD_economy_treasury_texticon"
 STP_pm_cost_600_tooltip:0 "Cost: §Y600§! £ADISCORD_economy_treasury_texticon."
 STP_pm_cost_1200:0 "§Y1200§! £ADISCORD_economy_treasury_texticon"
 STP_pm_cost_1200_blocked:0 "§R1200§! £ADISCORD_economy_treasury_texticon"
 STP_pm_cost_1200_tooltip:0 "Cost: §Y1200§! £ADISCORD_economy_treasury_texticon."
 STP_pm_cost_2400:0 "§Y2400§! £ADISCORD_economy_treasury_texticon"
 STP_pm_cost_2400_blocked:0 "§R2400§! £ADISCORD_economy_treasury_texticon"
 STP_pm_cost_2400_tooltip:0 "Cost: §Y2400§! £ADISCORD_economy_treasury_texticon."
 STP_pm_secretary_envelopes:0 "Envelopes for District Secretaries"
 STP_pm_secretary_envelopes_desc:0 "District secretaries remember the party line more readily when an envelope waits on the desk at the end of the month. The money leaves quietly; the signatures return by morning."
 STP_pm_delegates_banquet:0 "Banquet for the Delegates"
 STP_pm_delegates_banquet_desc:0 "A delegate fed at the party's expense votes without unnecessary questions. The tables will be laid in the small hall of the High Houses; the treasury pays the bill."
 STP_pm_buy_newspaper_columns:0 "Buy Out the Morning Papers"
 STP_pm_buy_newspaper_columns_desc:0 "Editors are not for sale, but their columns are. For the coming weeks every front page will speak in the party's voice."
 STP_pm_district_clubs:0 "Subsidise the District Clubs"
 STP_pm_district_clubs_desc:0 "Dances, free wine and a party band every Saturday. Districts that are having fun do not listen to Shabrat's agitators."
 STP_pm_guard_bonuses:0 "Bonuses for the Party Guard"
 STP_pm_guard_bonuses_desc:0 "A guard paid its bonus early marches more briskly and argues less. Shabrat will see people on the streets who are ready to fight."
 STP_pm_buy_draft_lists:0 "Buy the Draft Lists"
 STP_pm_buy_draft_lists_desc:0 "Clerks at the district commissariats sell copies of the lists to whoever pays first. The party will know whom to call before Shabrat does."
 STP_pm_retired_officers:0 "Hire Retired Officers"
 STP_pm_retired_officers_desc:0 "Ivanov's retired officers are bored on their pensions and will gladly recall their trade for a good salary. Their lessons will stay in the party staffs."
 STP_pm_wavering_officials:0 "Settle the Waverers"
 STP_pm_wavering_officials_desc:0 "Officials who yesterday were waiting to see how the war ends will today receive a reason to pick a side. The reason comes in an envelope with the party seal."
 STP_pm_commissar_pay:0 "Pay the Political Commissars"
 STP_pm_commissar_pay_desc:0 "An unpaid commissar reads orders under his breath. Pay in advance, and the trenches will hear again what the party is fighting for."
 STP_pm_front_gala:0 "Gala for the Front"
 STP_pm_front_gala_desc:0 "Hedersett insists that even a war is an occasion to celebrate. The proceeds go to the front; the guests' gratitude stays with the apparatus."
 STP_pm_front_bonuses:0 "Frontline Bonuses"
 STP_pm_front_bonuses_desc:0 "A cash bonus for everyone who held their position. A soldier who has been paid believes there is still a state behind him."
 STP_pm_paid_recruiters:0 "Paid Recruiters"
 STP_pm_paid_recruiters_desc:0 "Recruiters are paid for every signature. They do not ask where a man came from and do not promise he will return."
 STP_pm_smuggler_rifles:0 "Smugglers' Rifles"
 STP_pm_smuggler_rifles_desc:0 "The Lower Market sells anything that shoots, as long as you pay cash and do not ask about serial numbers. The party pays."
 STP_pm_hired_instructors:0 "Hired Instructors"
 STP_pm_hired_instructors_desc:0 "Foreign instructors charge a great deal but teach quickly. Within a month the recruits will stop confusing the flank with the rear."
 STP_pm_widow_pensions:0 "Pensions for the Families of the Fallen"
 STP_pm_widow_pensions_desc:0 "The party pays the widows before Shabrat can tell them who is to blame. The rear grows quieter."
 # Party treasury: faction patronage
 STP_pm_fund_conservatives:0 "Donation to the Chamber"
 STP_pm_fund_conservatives_desc:0 "The Conservatives like to speak of tradition, but the Chamber's tradition is generous donors. A contribution to the Chamber's fund will open doors that speeches did not."
 STP_pm_fund_conservatives_tt:0 "§YConservatives§!: influence up to §Y+3 percentage points§! (up to 60%, with other shares reduced proportionately), support §G+6§!."
 STP_pm_fund_borons:0 "Gifts for the Borons"
 STP_pm_fund_borons_desc:0 "The Borons remember who sent gifts for the holidays and who sent only letters. Wine, horses and bills of exchange will remind them which side is more generous."
 STP_pm_fund_borons_tt:0 "§YBorons§!: influence up to §Y+3 percentage points§! (up to 60%, with other shares reduced proportionately), support §G+6§!."
 STP_pm_fund_security:0 "Bonus Fund for the Quiet Service"
 STP_pm_fund_security_desc:0 "The quiet service does not take bribes. It receives bonuses - for overtime hours no one is supposed to know about."
 STP_pm_fund_security_tt:0 "§YSecurity Service§!: influence up to §Y+3 percentage points§! (up to 60%, with other shares reduced proportionately), support §G+6§!."
 STP_pm_fund_army:0 "Officers' Pay in Advance"
 STP_pm_fund_army_desc:0 "Commanders paid a quarter in advance are more willing to sign the party's orders."
 STP_pm_fund_army_tt:0 "§YArmy Command§!: influence up to §Y+3 percentage points§! (up to 60%, with other shares reduced proportionately), support §G+6§!."
 STP_pm_fund_advisers:0 "Expenses of the Nodrulian Mission"
 STP_pm_fund_advisers_desc:0 "The Nodrulian advisers value comfort. Paid apartments, cars and interpreters make their advice noticeably friendlier."
 STP_pm_fund_advisers_tt:0 "§YNodrulian Advisers§!: influence up to §Y+3 percentage points§! (up to 60%, with other shares reduced proportionately), support §G+6§!."
 STP_pm_fund_merchants:0 "Buy Up the Promissory Notes"
 STP_pm_fund_merchants_desc:0 "The party will buy up the trading houses' overdue notes and forget about them. The merchants will not forget."
 STP_pm_fund_merchants_tt:0 "§YMerchants§!: influence up to §Y+3 percentage points§! (up to 60%, with other shares reduced proportionately), support §G+6§!."
 STP_pm_fund_radicals:0 "Pay for the Radicals' Festival"
 STP_pm_fund_radicals_desc:0 "The Radical Hedonists demand a festival, and there will be one. The treasury pays for the band, the wine and the fireworks; the radicals pay with loyalty."
 STP_pm_fund_radicals_tt:0 "§YRadical Hedonists§!: influence up to §Y+3 percentage points§! (up to 60%, with other shares reduced proportionately), support §G+6§!."
 # Resistance war: mandate of the mountains
 STP_hw_mandate_dynamic:0 "Mandate of the Mountains"
 STP_hw_coalition_rules:0 "Each group has its own support score.\n- Below §R25§! points: that group may trigger a crisis.\n- At §Y40§! or more: its course can be chosen by focus."
 STP_hw_coalition_values:0 "§YGroup support§! (0-100 points)\nArmy officers: §Y[?STP_hw_officers|0]/100§! £STP_hw_officers_texticon \nMountain councils: §Y[?STP_hw_councils|0]/100§! £STP_hw_councils_texticon \nUnderground press: §Y[?STP_hw_underground|0]/100§! £STP_hw_underground_texticon \n\nMandate of the Mountains: §Y[?STP_hw_mandate|0]/100§!"
 STP_hw_coalition_report:0 "\n\n§YShabrat's Coalition§!\n$STP_hw_coalition_values$\n\n§YSupport thresholds§!\n$STP_hw_coalition_rules$\n\n§YWhat the mandate affects§!\nThis is overall trust in the movement. Above §Y50§! it grants a bonus; below §Y50§! it imposes a penalty to stability, war support and conscription.\n\n§YAfter victory§!\nThe chosen course determines the postwar spirit. If no course was chosen, the strongest group determines it."
 STP_hw_mountain_mandate:0 "Mandate of the Mountains"
 STP_hw_mountain_mandate_desc:0 "Shabrat fights on the trust of the highlands, not on orders. The Mandate of the Mountains grows with victories and with the truth about the regime, and melts with every month of war, every requisition and every failure. The coalition stands on three pillars: the officers, the mountain councils and the underground press."
 STP_hw_mountain_mandate_tt:0 "Mandate of the Mountains: §G+5§!.\nUnlocks coalition decisions under War and Reconstruction.\n\n$STP_hw_coalition_rules$"
 STP_hw_leaflets_over_fada:0 "Leaflets over Fada"
 STP_hw_leaflets_over_fada_desc:0 "Lists of the mountain dead and the prices at which the party sold the peace will rain over the capital. Fada's barracks will start arguing about what they stand for."
 STP_hw_leaflets_over_fada_tt:0 "Underground press support: §G+10§! £STP_hw_underground_texticon .\nMandate of the Mountains: §G+5§!."
 STP_hw_council_of_passes:0 "Council of the Passes"
 STP_hw_council_of_passes_desc:0 "The elders of the passes will sit at one table with the staff. The councils will give men, but they will demand a voice in decisions the officers used to make alone."
 STP_hw_council_of_passes_tt:0 "Mountain council support: §G+15§! £STP_hw_councils_texticon .\nOfficer support: §R-5§! £STP_hw_officers_texticon .\n\n$STP_hw_coalition_rules$"
 STP_hw_open_black_book:0 "Open the Black Book"
 STP_hw_open_black_book_desc:0 "The client register of the Lower Market goes on air: names, routes, signatures. The party will have no answer, and its Nodrul patrons will have to explain whom they protected."
 STP_hw_open_black_book_tt:0 "Underground press support: §G+10§! £STP_hw_underground_texticon .\nMandate of the Mountains: §G+12§!."
 STP_hw_black_book_nod_tt:0 "If Nodrul is preparing an intervention, the preparation is delayed by §Y30§! days."
 STP_hw_black_book_ready_tt:0 "The cabinet archive was stolen, or underground press support is at least §Y50§! (now §Y[?STP_hw_underground|0]§! £STP_hw_underground_texticon )"
 STP_hw_unified_district_command:0 "Unified District Command"
 STP_hw_unified_district_command_desc:0 "The militias of the passes pass to a common staff. The fighting becomes easier to direct, but the councils will remember who took their commanders."
 STP_hw_unified_district_command_tt:0 "Officer support: §G+10§! £STP_hw_officers_texticon .\nMountain council support: §R-5§! £STP_hw_councils_texticon ."
 STP_hw_kefreyt_contract:0 "The Kefreyt Contract"
 STP_hw_kefreyt_contract_desc:0 "Kefreyt will deliver rifles, guns and quartermasters. The price is postwar resource rights and the question of whose independence the mountains are fighting for."
 STP_hw_kefreyt_contract_tt:0 "Officer support: §G+5§! £STP_hw_officers_texticon .\nUnderground press support: §R-10§! £STP_hw_underground_texticon .\nMandate of the Mountains: §R-8§!.\nThe movement keeps a debt to Kefreyt."
 STP_hw_mountains_pay:0 "The Mountains Pay Their Own Way"
 STP_hw_mountains_pay_desc:0 "Not a single foreign contract. The districts will give their own sons and their last reserves, and the victory will stay their own."
 STP_hw_mountains_pay_tt:0 "Mountain council support: §G+10§! £STP_hw_councils_texticon .\nOfficer support: §R-5§! £STP_hw_officers_texticon .\nMandate of the Mountains: §G+8§!."
 STP_hw_coalition_congress:0 "Congress of the Coalition"
 STP_hw_coalition_congress_desc:0 "Officers, elders and printers meet openly for the first time. The congress will decide who speaks for the victory."
 STP_hw_coalition_congress_tt:0 "Officer support: §G+5§! £STP_hw_officers_texticon .\nMountain council support: §G+5§! £STP_hw_councils_texticon .\nUnderground press support: §G+5§! £STP_hw_underground_texticon ."
 STP_hw_course_staff:0 "Officers' Directory"
 STP_hw_course_staff_desc:0 "The staff will finish the war. Afterwards a military directory will govern the country until the mountains learn to live without sirens."
 STP_hw_course_staff_tt:0 "Officer support: §G+20§! £STP_hw_officers_texticon .\nMountain council support: §R-5§! £STP_hw_councils_texticon .\nUnderground press support: §R-5§! £STP_hw_underground_texticon .\nAfter the victory: the Officers' Directory spirit."
 STP_hw_course_councils:0 "Republic of Councils"
 STP_hw_course_councils_desc:0 "Power goes down to the passes and the mining villages. The new republic will be slower, but no house will be able to buy it."
 STP_hw_course_councils_tt:0 "Mountain council support: §G+20§! £STP_hw_councils_texticon .\nOfficer support: §R-5§! £STP_hw_officers_texticon .\nUnderground press support: §R-5§! £STP_hw_underground_texticon .\nAfter the victory: the Republic of Councils spirit."
 STP_hw_course_truth:0 "Truth Commission"
 STP_hw_course_truth_desc:0 "The first act after the victory will be open trials of the Lower Market's clients. The country must see what paid for the festival."
 STP_hw_course_truth_tt:0 "Underground press support: §G+20§! £STP_hw_underground_texticon .\nOfficer support: §R-5§! £STP_hw_officers_texticon .\nMountain council support: §R-5§! £STP_hw_councils_texticon .\nAfter the victory: the Truth Commission spirit."
 STP_hw_officers_can_lead_tt:0 "Officer support at least §Y40§! (now §Y[?STP_hw_officers|0]§! £STP_hw_officers_texticon )"
 STP_hw_councils_can_lead_tt:0 "Mountain council support at least §Y40§! (now §Y[?STP_hw_councils|0]§! £STP_hw_councils_texticon )"
 STP_hw_underground_can_lead_tt:0 "Underground press support at least §Y40§! (now §Y[?STP_hw_underground|0]§! £STP_hw_underground_texticon )"
 STP_hw_staff_briefing:0 "Staff Briefing"
 STP_hw_staff_briefing_desc:0 "$STP_hw_coalition_values$\n\nThe staff gets a free hand in planning, and the councils get one more order without discussion."
 STP_hw_staff_briefing_tt:0 "Officer support: §G+12§! £STP_hw_officers_texticon .\nMountain council support: §R-4§! £STP_hw_councils_texticon ."
 STP_hw_council_guarantees:0 "Guarantees to the Councils"
 STP_hw_council_guarantees_desc:0 "$STP_hw_coalition_values$\n\nThe elders receive written promises: land, schools and their own militia after the war."
 STP_hw_council_guarantees_tt:0 "Mountain council support: §G+12§! £STP_hw_councils_texticon .\nOfficer support: §R-4§! £STP_hw_officers_texticon .\nMandate of the Mountains: §G+3§!."
 STP_hw_night_printing:0 "Night Printing"
 STP_hw_night_printing_desc:0 "$STP_hw_coalition_values$\n\nThe presses in school cellars will run until dawn again."
 STP_hw_night_printing_tt:0 "Underground press support: §G+12§! £STP_hw_underground_texticon .\nMandate of the Mountains: §G+2§!. Party war support: §R-1%§!."
 STP_hw_kefreyt_quartermasters_idea:0 "Kefreyt Quartermasters"
 STP_hw_kefreyt_quartermasters_idea_desc:0 "Kefreyt depots and accounts supply the front. Every delivery is written down as debt."
 STP_hw_mountain_levies_idea:0 "Mountain Levies"
 STP_hw_mountain_levies_idea_desc:0 "The districts raise their own men and hold their own passes."
 STP_hw_officers_sulk_idea:0 "A Resentful Staff"
 STP_hw_officers_sulk_idea_desc:0 "The dismissed officers work to regulation and no further."
 STP_hw_course_staff_idea:0 "Officers' Directory"
 STP_hw_course_staff_idea_desc:0 "A military directory governs for now. The army is in order; politics waits."
 STP_hw_course_councils_idea:0 "Republic of Councils"
 STP_hw_course_councils_idea_desc:0 "The districts and passes decide. Slowly, but they are heard."
 STP_hw_course_truth_idea:0 "Truth Commission"
 STP_hw_course_truth_idea_desc:0 "Open trials of the Lower Market's clients give the new government the right to speak."
 STP_hw_republic_of_mountains_idea:0 "Trust of the Mountains"
 STP_hw_republic_of_mountains_idea_desc:0 "The highlands believe the victory was their own."
 STP_hw_victory_on_credit_idea:0 "Victory on Credit"
 STP_hw_victory_on_credit_idea_desc:0 "The war is won, but the mountains are tired and the bills are still unpaid."
 ADISCORD_STP_hw.1.t:0 "Mandate of the Mountains"
 ADISCORD_STP_hw.1.d:0 "Shabrat cannot order the highlands to fight - only ask them. Miners, drivers and elders gave the resistance men and roads for one promise: this war will end the peace that was bought with other people's signatures.\n\nThe Mandate of the Mountains now stands at §Y[?STP_hw_mandate|0]§!. It grows with successful operations, the truth about the regime and holding Fada, and melts with every month of war and every failure. A high mandate strengthens stability, war support and conscription; a low one weakens them.\n\nThe coalition stands on three pillars: the officers (§Y[?STP_hw_officers|0]§!), the mountain councils (§Y[?STP_hw_councils|0]§!) and the underground press (§Y[?STP_hw_underground|0]§!). A neglected pillar will make itself heard."
 ADISCORD_STP_hw.1.a:0 "The mountains remember who fought for them."
 ADISCORD_STP_hw.10.t:0 "The Mountains Are Tired"
 ADISCORD_STP_hw.10.d:0 "Fewer villagers come out to see the columns off. Mothers ask the elders when their sons will return to the mines and the harvest, and the staff counts how many companies would remain if even some were let go."
 ADISCORD_STP_hw.10.a:0 "Send some of the conscripts home."
 ADISCORD_STP_hw.10.a_tt:0 "Mountain council support: §G+5§! £STP_hw_councils_texticon .\nMandate of the Mountains: §G+10§!."
 ADISCORD_STP_hw.10.b:0 "Nobody leaves until Fada is ours."
 ADISCORD_STP_hw.10.b_tt:0 "Officer support: §G+5§! £STP_hw_officers_texticon .\nMountain council support: §R-5§! £STP_hw_councils_texticon ."
 ADISCORD_STP_hw.11.t:0 "The Mandate Runs Out"
 ADISCORD_STP_hw.11.d:0 "The districts stop answering the staff. One pass has already let a party convoy through, another demands talks with Fada. If nothing is done, the movement will be an army without a country."
 ADISCORD_STP_hw.11.a:0 "Give the councils what they ask."
 ADISCORD_STP_hw.11.a_tt:0 "Mountain council support: §G+10§! £STP_hw_councils_texticon .\nMandate of the Mountains: §G+8§!."
 ADISCORD_STP_hw.11.b:0 "Impose martial law in the rear."
 ADISCORD_STP_hw.11.b_tt:0 "Officer support: §G+10§! £STP_hw_officers_texticon .\nUnderground press support: §R-10§! £STP_hw_underground_texticon .\nMandate of the Mountains: §G+3§!."
 ADISCORD_STP_hw.20.t:0 "The Staff's Ultimatum"
 ADISCORD_STP_hw.20.d:0 "Grigory Sotnikov brought Shabrat a letter signed by half the staff. The officers are tired of clearing every offensive with elders and printers and demand operational freedom - or their resignation."
 ADISCORD_STP_hw.20.a:0 "The staff gets its freedom."
 ADISCORD_STP_hw.20.a_tt:0 "Officer support: §G+20§! £STP_hw_officers_texticon .\nMountain council support: §R-5§! £STP_hw_councils_texticon .\nMandate of the Mountains: §R-5§!."
 ADISCORD_STP_hw.20.b:0 "Remove the signatories."
 ADISCORD_STP_hw.20.b_tt:0 "Officer support: §G+10§! £STP_hw_officers_texticon ."
 ADISCORD_STP_hw.21.t:0 "The Councils Recall Their Militia"
 ADISCORD_STP_hw.21.d:0 "Three passes have announced that their men are going home. The elders say it plainly: the staff takes their sons and gives them no say in the decisions."
 ADISCORD_STP_hw.21.a:0 "Sign guarantees of self-government."
 ADISCORD_STP_hw.21.a_tt:0 "Mountain council support: §G+20§! £STP_hw_councils_texticon ."
 ADISCORD_STP_hw.21.b:0 "Bring the companies back by force."
 ADISCORD_STP_hw.21.b_tt:0 "Mountain council support: §G+5§! £STP_hw_councils_texticon .\nMandate of the Mountains: §R-8§!."
 ADISCORD_STP_hw.22.t:0 "The Presses Fall Silent"
 ADISCORD_STP_hw.22.d:0 "The printers in the school cellars have stopped their machines. They will not print orders instead of the truth while the staff's censors strike the names of allies and patrons from the leaflets."
 ADISCORD_STP_hw.22.a:0 "Give the presses back their freedom."
 ADISCORD_STP_hw.22.a_tt:0 "Underground press support: §G+20§! £STP_hw_underground_texticon .\nOfficer support: §R-5§! £STP_hw_officers_texticon ."
 ADISCORD_STP_hw.22.b:0 "Military censorship stays."
 ADISCORD_STP_hw.22.b_tt:0 "Underground press support: §G+5§! £STP_hw_underground_texticon .\nMandate of the Mountains: §R-6§!."

 # Nodrul border war and treaty
 ADISCORD_STP_pc.48.t: "The Nodrul Border Treaty"
 ADISCORD_STP_pc.48.sts: "Nodrul has agreed to end the war. Shabrat's government has secured a new border: Nodrul-owned Ashya and Ostrium pass to Steland. Territory held by third powers is excluded from this treaty.\n\nBoth sides cease fire and recognise the new border. Nodrul abandons the armed restoration of the Party exiles. Its capital and remaining territory survive, while Shabrat gains the border districts and an end to this war."
 ADISCORD_STP_pc.48.nod: "The command has accepted Shabrat's terms: a ceasefire, recognition of the new border and the transfer of Nodrul-owned Ashya and Ostrium. Land held by third powers is excluded.\n\nCussington and the rest of the country remain under Nodrul's government. The Party exiles' restoration campaign is closed and pending paid orders are settled. The war against Shabrat is over."
 ADISCORD_STP_pc.48.sts_cw: "Nodrul's command has agreed to leave the civil war. Nodrul-owned Ashya and Ostrium pass to Steland; territory held by third powers is excluded from this treaty.\n\nThe northern front is closed, but the war is not over. The party government has lost its guarantor and fights on alone, while the released units can be turned against it."
 ADISCORD_STP_pc.48.nod_cw: "Continuing the war with Steland threatened the government's very existence. The command has accepted Shabrat's terms: withdrawal from the civil war, recognition of the new border and the transfer of Nodrul-owned Ashya and Ostrium. Land held by third powers is excluded.\n\nCussington and the rest of the country remain under Nodrul's government. The military alliance with the party government is dissolved, and pending paid orders are settled under existing obligations. The party will continue the war without Nodrul's units."
 ADISCORD_STP_pc.48.a: "Implement the treaty"
 ADISCORD_STP_pc.49.t: "War with Nodrul"
 ADISCORD_STP_pc.49.return: "Nodrul has announced a campaign to restore the Party government in Steland. The exile formations are marching alongside its army. Promises to the exiles have become orders: the border has been crossed and the diplomatic note delivered.\n\nShabrat's government regards this as an attempt to reverse the civil war. The army must hold the northern approaches and force Nodrul to abandon its campaign."
 ADISCORD_STP_pc.49.campaign: "Shabrat's government has ordered the campaign against Nodrul to begin. The preparations are over and the northern border has become a front.\n\nThe General Staff has been ordered to secure supply to the northern front and avoid a prolonged war. The government has communicated its terms for ending the campaign to its diplomats."
 ADISCORD_STP_pc.49.a: "Issue the orders"
 STP_nod_border_treaty_terms_tt: "Peace is concluded automatically when Nodrul reaches at least 40% surrender progress and Steland controls Nodrul-owned Ashya or Ostrium. Nodrul-owned Ashya and Ostrium pass to Steland unless held by a third power. The Party exiles abandon their armed restoration campaign."

 # Emergency support against Kefreyt
 STP_kc_emergency_staff:0 "Hold the Front"
 STP_kc_emergency_staff_desc:0 "War with Kefreyt demands that we concentrate our strength where the retreat can still be stopped. An emergency staff will coordinate orders, rotate exhausted units and distribute supplies. These measures buy time to replenish the army; they cannot replace weapons or recruits."
 STP_kc_war_production:0 "Wartime Shifts"
 STP_kc_war_production_desc:0 "Factories will increase weapons output and training units will accelerate reinforcement courses. The army must rebuild its stocks for the next phase of the campaign."
 STP_kc_army_supply:0 "Supply the Field Army"
 STP_kc_army_supply_desc:0 "Gather reserve weapons, repair serviceable stocks and deliver them to the front. Infantry will receive rifles, squad weapons and support equipment; artillery units will receive guns and anti-aircraft equipment. Deliveries enter our stockpiles to replenish existing formations or equip new ones."
 STP_kc_counterattack_plan:0 "Counteroffensive Plan"
 STP_kc_counterattack_plan_desc:0 "With formations replenished, the staff can prepare a coordinated attack. Reconnaissance will identify weak points, artillery will receive common objectives and reserves will follow an agreed deployment schedule."
 STP_kc_defence:0 "Emergency Defence"
 STP_kc_defence_desc:0 "The staff sustains the front and army supply during the Kefreyt threat. Lasts up to 180 days and ends when the war against Kefreyt ends."
 STP_kc_production:0 "Wartime Shifts"
 STP_kc_production_desc:0 "Accelerated weapons output and reinforcement training for the war against Kefreyt. Lasts up to 180 days and ends when the threat closes."
 STP_kc_counteroffensive:0 "Prepared Counteroffensive"
 STP_kc_counteroffensive_desc:0 "A coordinated offensive against Kefreyt. Lasts up to 90 days and ends with the war."
 STP_kc_threat_current_tt:0 "At war with Kefreyt, or a scripted campaign route against independent Kefreyt is open for preparation without an accepted settlement or truce."
 STP_kc_support_active_tt:0 "At war with Kefreyt, or within the 180-day emergency preparation window."
 STP_kc_naval_program_available_tt:0 "Shabrat controls an owned state with a naval base, and either postwar reconstruction or emergency preparation against Kefreyt is available."
 STP_kc_temporary_support_tt:0 "Support ends when the war against Kefreyt ends. Before the declaration it requires a continuing threat and lasts no longer than the 180-day preparation window; declaring war does not reset its duration."

 STP_ps_delivery_on_completion_tt: "When the programme completes, this country receives:"

 STP_ps_war_open_tt: "The civil war against Shabrat continues; the Party has not capitulated."

 STP_ps_order_free_tt: "The previous order for this programme has been settled."

 STP_ps_order_cooldown_tt: "The waiting period after the previous delivery has ended."

 STP_ps_reorg_1_result_tt: "On completion: the breakthrough penalty falls from -45% to -30%, and the planning speed penalty from -50% to -30%. Unlocks the second recovery stage and limited counterattacks; general offensives require all three stages."

 STP_ps_reorg_2_result_tt: "On completion: the breakthrough and planning speed penalties fall from -30% to -15%. Unlocks the third recovery stage."

 STP_ps_reorg_3_result_tt: "On completion: removes the remaining -15% breakthrough and planning speed penalties. An operational government can then proceed to the counteroffensive."

 STP_ps_build_radio_result_tt: "The completed radio network shortens the first command recovery stage by 7 days."

 STP_ps_build_hq_result_tt: "The completed headquarters shortens the second recovery stage by 7 days. If the government is lost, it unlocks restoration in 7 days for §Y600§! £ADISCORD_economy_treasury_texticon."

 STP_ps_institution_payment_result_tt: "On completion: advances one of the three stages of establishing permanent institutions. All three stages are required to choose the final administrative settlement."

 # Civil-war mountain training
 STP_cw_mountain_school: "Train Mountain Troops"
 STP_cw_mountain_school_desc: "Mountain roads demand small, well-trained formations. Instructors will establish mountain brigades with engineer companies, while the depots supply their equipment. The serving army will provide recruits and training."
 STP_cw_mountain_assault: "Assault the Passes"
 STP_cw_mountain_assault_desc: "Advance groups will learn to outflank firing positions along the slopes and hold captured passes until the main force arrives."
 STP_cw_mountain_training: "Wartime Mountain School"
 STP_cw_mountain_training_desc: "Faster special forces training and additional capacity support recruitment for the mountain front. The programme ends with the party-resistance war."
 STP_cw_mountain_assault_training: "Mountain Assault Training"
 STP_cw_mountain_assault_training_desc: "Mountaineers practise bypassing fortified positions, coordinating with engineers and holding captured heights. These bonuses last until the party-resistance war ends."
 STP_cw_mountain_war_active_tt: "The party-resistance war continues, and neither side has capitulated."
 STP_hw_stall_dynamic:0 "Stalled offensive"
 STP_hw_stall_dynamic_desc:0 "The promised victory keeps slipping away. Confidence in headquarters fades, formations recover more slowly and mobilization falters. A breakthrough can ease the strain."
 STP_hw_stall_report:0 "\n\n§YOffensive exhaustion: [?STP_hw_stall_stage|0]/3§!\nNext tier in §Y[?STP_hw_stall_remaining|0] days§!.\n$STP_hw_stall_rules$\nRemaining objectives:$STP_hw_stall_objectives$"
 STP_hw_stall_report_max:0 "\n\n§ROffensive exhaustion: 3/3§!\nMaximum tier reached.\n$STP_hw_stall_rules$\nRemaining objectives:$STP_hw_stall_objectives$"
 STP_hw_stall_rules:0 "Without new gains, exhaustion worsens after 90, 150 and 210 days: war support -5/-10/-15%, organization recovery -5/-10/-15%, mobilization speed 0/-15/-30%. The first capture of an eligible district removes one tier and grants 60 days until escalation, or 90 days when no penalties remain. Recaptures give no relief. Penalties end with the war against the Party."
 STP_hw_stall_objectives:0 "[2.STPGetStallObjective][3.STPGetStallObjective][28.STPGetStallObjective][29.STPGetStallObjective][45.STPGetStallObjective][46.STPGetStallObjective][53.STPGetStallObjective]"
 STP_hw_stall_objective_name:0 "\n- [This.GetName]"

 STP_party_houses_privileges_tt:0 "Treasury: §G+1800§!."
 STP_party_houses_privileges_tt_pf:0 "Conservatives: §G+10§! support.\nBorons: §G+6§! support."
 STP_party_houses_privileges:0 "Confirm the Houses' privileges"
 STP_party_houses_privileges_desc:0 "Crowe offers recognition of wartime acquisitions in return for money. The treasury receives immediate help, but collecting taxes will again require negotiations with each House."
 STP_party_houses_centralise_tt:0 "Conservatives: §R-8§! support.\nMerchants: §G+6§! support."
 STP_party_houses_centralise:0 "A single treasury"
 STP_party_houses_centralise_desc:0 "Wartime exemptions must end with the war. Independent tax collectors will answer to the ministry, including those protected by the families that brought Crowe to power."
 STP_party_houses_estates_tt:0 "Borons: §G+8§! support."
 STP_party_houses_estates:0 "District guarantors"
 STP_party_houses_estates_desc:0 "The Houses guarantee district administration and retain a share of local revenue. The centre gains reliable intermediaries while the borons secure their place in the settlement."
 STP_party_houses_audit_tt:0 "Borons: §R-6§! support.\nSecurity service: §G+5§! support."
 STP_party_houses_audit:0 "Inspectors without patrons"
 STP_party_houses_audit_desc:0 "Tax inspectors will be appointed by the capital and protected from local creditors. Their salaries cost money, but accounts will no longer disappear into family archives."
 STP_party_houses_closed_lists_tt:0 "Conservatives: §G+8§! support.\nHedonist radicals: §R-8§! support."
 STP_party_houses_closed_lists:0 "Order of the private societies"
 STP_party_houses_closed_lists_desc:0 "The Chamber returns social life to private salons under the Houses' patronage. Public festivities give way to private societies, and the legal drug market is restricted to light substances. The Chamber also reserves the right to draw up lists for public appointments."
 STP_party_houses_hearings_tt:0 "Borons: §G+6§! support.\nHedonist radicals: §G+5§! support.\nConservatives: §R-5§! support."
 STP_party_houses_hearings:0 "Hear the districts"
 STP_party_houses_hearings_desc:0 "District representatives may challenge appointments and property rulings. The Chamber accepts slower proceedings to win recognition beyond the capital."
 STP_party_houses_clients_tt:0 "Conservatives: §G+5§! support."
 STP_party_houses_clients:0 "The Chamber's clients"
 STP_party_houses_clients_desc:0 "Crowe ties appointments to personal guarantees. Officials owe their careers to the Chamber and know who will demand answers for a failed state order."
 STP_party_houses_public_register_tt:0 "Merchants: §G+8§! support."
 STP_party_houses_public_register:0 "An accessible register"
 STP_party_houses_public_register_desc:0 "A published register allows claims and contract terms to be checked. Courts gain work while merchants lose a reason to pay for access to documents."
 STP_party_houses_compact_tt:0 "Conservatives: §G+6§! support.\nBorons: §G+4§! support."
 STP_party_houses_compact:0 "The High Houses compact"
 STP_party_houses_compact_desc:0 "The postwar bargains become an established order. Crowe gains recognised authority, but district privileges and published guarantees cannot simply be dismissed by decree."
 STP_party_festival_patrons_tt:0 "Treasury: §G+2000§!."
 STP_party_festival_patrons_tt_pf:0 "Conservatives: §G+8§! support.\nMerchants: §G+6§! support.\nHedonist radicals: §R-4§! support."
 STP_party_festival_patrons:0 "Patrons of the festival"
 STP_party_festival_patrons_desc:0 "Hedersett promises the Houses seats on resort boards in return for reconstruction money. The funds arrive now; the political concessions will be collected later."
 STP_party_festival_levy_tt:0 "Treasury: §G+1200§!."
 STP_party_festival_levy_tt_pf:0 "Hedonist radicals: §G+10§! support.\nConservatives: §R-12§! support."
 STP_party_festival_levy:0 "Levy on privileged clubs"
 STP_party_festival_levy_desc:0 "Those enriched by the old order will finance the festival. An emergency levy gives the government its own funds and turns powerful club owners against the radicals."
 STP_party_public_orgies_tt:0 "Hedonist radicals: §G+10§! support.\nConservatives: §R-10§! support.\nBorons: §R-4§! support."
 STP_party_public_orgies:0 "Public orgies"
 STP_party_public_orgies_desc:0 "Hedersett brings previously private festivities into public life. The law permits public orgies involving consenting adults; municipalities must designate venues and answer residents' protests."
 STP_party_hard_drugs_tt:0 "Hedonist radicals: §G+8§! support.\nMerchants: §G+6§! support.\nArmy command: §R-8§! support."
 STP_party_hard_drugs:0 "Legalise hard drugs"
 STP_party_hard_drugs_desc:0 "Resort traders gain a legal market for hard drugs. Excise duties promise revenue, while hospitals and factories warn of addiction, poisonings and the loss of workers."
 STP_party_slave_market_tt:0 "Merchants: §G+8§! support.\nConservatives: §G+5§! support.\nArmy command: §R-6§! support.\nHedonist radicals: §R-6§! support."
 STP_party_slave_market:0 "Legalisation of slavery"
 STP_party_slave_market_desc:0 "The Lower Market demands legal recognition of human trafficking and forced labour. Hedersett can satisfy its patrons by turning captivity into registered property, creating an open source of social conflict."
 STP_party_festival_accounts_tt:0 "Borons: §G+4§! support."
 STP_party_festival_accounts:0 "The festival accounts"
 STP_party_festival_accounts_desc:0 "Owners demand their promised concessions and municipalities need money for new duties. The way Hedersett financed the first celebrations determines who now comes to collect."
 STP_party_festival_clinics_tt:0 "Borons: §G+6§! support.\nMerchants: §R-5§! support."
 STP_party_festival_clinics:0 "Fund public health"
 STP_party_festival_clinics_desc:0 "The government recognises that permission alone is not enough. Hospitals, inspectors and municipalities need funding; part of resort revenue will support treatment and labour oversight."
 STP_party_festival_immunity_tt:0 "Merchants: §G+8§! support.\nBorons: §R-8§! support."
 STP_party_festival_immunity:0 "Immunity for the organisers"
 STP_party_festival_immunity_desc:0 "Organisers seek protection from inspections and lawsuits. Resorts will bring in more money while families and districts carry the costs without an effective means of redress."
 STP_party_festival_charter_tt:0 "Hedonist radicals: §G+8§! support."
 STP_party_festival_charter:0 "Charter of the perpetual festival"
 STP_party_festival_charter_desc:0 "Hedersett embeds his social programme in the state. Its laws, revenues and district obligations will outlast the chairman; the next government inherits both the income and the consequences."
 STP_party_staff_demobilisation_tt:0 "Army command: §R-6§! support.\nMerchants: §G+6§! support."
 STP_party_staff_demobilisation:0 "Bring the soldiers home"
 STP_party_staff_demobilisation_desc:0 "Veil begins an orderly demobilisation. Returning workers revive the civilian economy, while officers lose some of the men and powers they commanded during the war."
 STP_party_staff_commandants_tt:0 "Army command: §G+10§! support.\nBorons: §R-8§! support."
 STP_party_staff_commandants:0 "Retain the commandants"
 STP_party_staff_commandants_desc:0 "Military administration remains in the districts until reconstruction is finished. Orders will travel faster, but local authorities will depend on uniformed officials."
 STP_party_staff_reserve_jobs_tt:0 "Army command: §G+5§! support."
 STP_party_staff_reserve_jobs:0 "Jobs for reservists"
 STP_party_staff_reserve_jobs_desc:0 "Veterans will rebuild bridges and workshops on the civilian payroll. Their discipline remains useful without permanent emergency rule."
 STP_party_staff_districts_tt:0 "Army command: §G+5§! support.\nMerchants: §R-4§! support."
 STP_party_staff_districts:0 "Supply districts"
 STP_party_staff_districts_desc:0 "Commandants combine depots and transport into military supply districts. The army gains reliable supply while civilian contractors lose priority."
 STP_party_staff_civilian_minister_tt:0 "Army command: §R-8§! support.\nBorons: §G+6§! support."
 STP_party_staff_civilian_minister:0 "A civilian defence minister"
 STP_party_staff_civilian_minister_desc:0 "The civilian cabinet regains control of budgets and senior appointments. The general staff retains its professional duties but loses the right to obstruct government decisions."
 STP_party_staff_veto_tt:0 "Army command: §G+12§! support.\nMerchants: §R-6§! support."
 STP_party_staff_veto:0 "The staff's deciding signature"
 STP_party_staff_veto_desc:0 "No budget or appointment will take effect without the staff's signature. The army promises order in return for a permanent say in civilian politics."
 STP_party_staff_public_budget_tt:0 "Merchants: §G+6§! support."
 STP_party_staff_public_budget:0 "Publish the defence budget"
 STP_party_staff_public_budget_desc:0 "Suppliers can challenge procurement and the treasury can compare prices. Reviews slow approvals but end the assumption that every military invoice must be paid."
 STP_party_staff_priority_orders:0 "Priority military orders"
 STP_party_staff_priority_orders_desc:0 "The staff reserves the best capacity for military contracts. Arsenals gain dependable production while civilian construction waits its turn."
 STP_party_service_constitution_tt:0 "Army command: §G+5§! support."
 STP_party_service_constitution:0 "The peacetime charter"
 STP_party_service_constitution_desc:0 "Temporary orders give way to permanent rules of service. Veil completes a settlement governed either by civilian oversight or an entrenched military veto."
 STP_party_trade_monopolies_tt:0 "Treasury: §G+2000§!."
 STP_party_trade_monopolies_tt_pf:0 "Merchants: §G+10§! support.\nBorons: §R-6§! support."
 STP_party_trade_monopolies:0 "Trading House concessions"
 STP_party_trade_monopolies_desc:0 "Major guilds offer immediate port investment in return for exclusive rights. Lanskoy gains quick results and creditors able to halt a large share of trade."
 STP_party_trade_tenders_tt:0 "Merchants: §R-6§! support.\nBorons: §G+7§! support."
 STP_party_trade_tenders:0 "Open tenders"
 STP_party_trade_tenders_desc:0 "Contracts will follow published terms. Reconstruction starts more slowly, but smaller producers can bid without the patronage of the largest guilds."
 STP_party_trade_advance_tt:0 "Treasury: §G+1800§!."
 STP_party_trade_advance:0 "Advance against the next season"
 STP_party_trade_advance_desc:0 "The trading Houses offer another advance against future receipts. Each new budget will begin by paying obligations accepted to reopen the ports quickly."
 STP_party_trade_credit_tt:0 "Borons: §G+5§! support."
 STP_party_trade_credit:0 "Credit for provincial workshops"
 STP_party_trade_credit_desc:0 "The state guarantees loans to small workshops and audits their use. Their goods arrive later than imports, but the productive capacity remains at home."
 STP_party_trade_imports_tt:0 "Treasury: §G+800§!."
 STP_party_trade_imports_tt_pf:0 "Merchants: §G+8§! support.\nNodrulian advisers: §G+4§! support."
 STP_party_trade_imports:0 "Open import corridors"
 STP_party_trade_imports_desc:0 "Imports fill warehouses before domestic factories recover. Suppliers gain favourable terms, making a border disruption an immediate government problem."
 STP_party_trade_industry_tt:0 "Army command: §G+6§! support.\nMerchants: §R-4§! support."
 STP_party_trade_industry:0 "A domestic production order"
 STP_party_trade_industry_desc:0 "Lanskoy commissions domestic supply chains. The project requires patience and concessions to manufacturers but keeps work going when foreign markets close."
 STP_party_trade_warehouses:0 "Reserve warehouses"
 STP_party_trade_warehouses_desc:0 "A share of imported goods goes into a state reserve. Stocks reduce the risk of a trade crisis but must be maintained even in good months."
 STP_party_trade_suppliers:0 "Domestic suppliers association"
 STP_party_trade_suppliers_desc:0 "Workshops agree on common standards and mutual supply. This creates a domestic fallback when a major contract fails and improves production reliability."
 STP_party_trade_republic_tt:0 "Merchants: §G+6§! support."
 STP_party_trade_republic:0 "A republic of trading agreements"
 STP_party_trade_republic_desc:0 "The new season closes the first stage of recovery. Trade and debt terms are secured; the next cabinet inherits functioning businesses and the obligations to those who financed them."
 STP_party_security_register_tt:0 "Security service: §R-6§! support.\nBorons: §G+6§! support."
 STP_party_security_register:0 "Register the wartime files"
 STP_party_security_register_desc:0 "Korvina enters wartime detentions in a common register. Families can trace missing relatives, and the service must answer for records previously treated as internal matters."
 STP_party_security_personal_files_tt:0 "Security service: §G+10§! support.\nBorons: §R-6§! support."
 STP_party_security_personal_files:0 "The chairwoman's personal files"
 STP_party_security_personal_files_desc:0 "Korvina keeps the key archives under her personal control. Information strengthens her hold on the apparatus, while detainees remain dependent on the service's discretion."
 STP_party_security_courts:0 "Investigative commissions"
 STP_party_security_courts_desc:0 "Commissions review wartime files and arbitrary rulings. Their work takes time and requires protecting witnesses from those who issued the orders."
 STP_party_security_network_tt:0 "Security service: §G+5§! support."
 STP_party_security_network:0 "A network of trusted inspectors"
 STP_party_security_network_desc:0 "Inspectors appointed by the service watch officials in every district. Administration becomes more dependable for the centre and more expensive for the treasury."
 STP_party_security_judicial_control_tt:0 "Security service: §R-10§! support.\nBorons: §G+6§! support."
 STP_party_security_judicial_control:0 "Judicial oversight of the service"
 STP_party_security_judicial_control_desc:0 "Warrants and complaints pass to courts independent of the directorate. Korvina limits the instrument that helped her win in return for lasting public trust."
 STP_party_security_immunity_tt:0 "Security service: §G+12§! support.\nHedonist radicals: §R-8§! support."
 STP_party_security_immunity:0 "Immunity of the directorate"
 STP_party_security_immunity_desc:0 "Operational decisions are placed beyond ordinary courts. The service promises quiet and demands a permanent role in appointments and public life."
 STP_party_security_restitution_tt:0 "Merchants: §G+8§! support.\nSecurity service: §R-4§! support."
 STP_party_security_restitution:0 "Return confiscated property"
 STP_party_security_restitution_desc:0 "Unlawful confiscations will be reversed. Owners return to work while the service and its intermediaries lose some of their wartime acquisitions."
 STP_party_security_cadres_tt:0 "Security service: §G+5§! support.\nMerchants: §R-4§! support."
 STP_party_security_cadres:0 "Appointments by clearance"
 STP_party_security_cadres_desc:0 "Every senior appointment requires security clearance. Control strengthens while professional competence increasingly gives way to political reliability."
 STP_party_security_settlement_tt:0 "Security service: §G+5§! support."
 STP_party_security_settlement:0 "The limits of state security"
 STP_party_security_settlement_desc:0 "The service's powers become part of the permanent state. Ending the emergency does not erase the archives, appointments and decisions accumulated under Korvina."
 STP_party_regent_mandate_tt:0 "Nodrulian advisers: §G+5§! support."
 STP_party_regent_mandate:0 "The northern regent's mandate"
 STP_party_regent_mandate_desc:0 "Renner proposes rebuilding the administration with Nodrul's help. The first appointments decide whether institutions answer to foreign advisers or Stelander's own officials."
 STP_party_regent_advisers_tt:0 "Nodrulian advisers: §G+10§! support.\nBorons: §R-6§! support."
 STP_party_regent_advisers:0 "Empower the advisers"
 STP_party_regent_advisers_desc:0 "Northern specialists gain authority over appointments and spending. Their help speeds recovery but makes independent decisions harder."
 STP_party_regent_local_cadres_tt:0 "Nodrulian advisers: §R-8§! support.\nBorons: §G+8§! support."
 STP_party_regent_local_cadres:0 "Stelander appointments"
 STP_party_regent_local_cadres_desc:0 "Local officials take the key posts. Training them costs more than importing a ready-made northern administration, but leaves the country with its own staff."
 STP_party_regent_joint_offices_tt:0 "Nodrulian advisers: §G+6§! support."
 STP_party_regent_joint_offices:0 "Joint departments"
 STP_party_regent_joint_offices_desc:0 "Local institutions work alongside northern representatives under their supervision. Renner gains reliable administration and Nodrul gains detailed knowledge of the country."
 STP_party_regent_local_budget_tt:0 "Borons: §G+6§! support."
 STP_party_regent_local_budget:0 "Local district budgets"
 STP_party_regent_local_budget_desc:0 "Districts receive funds managed by local treasurers. Their accounts will support later negotiations over the limits of northern intervention."
 STP_party_regent_accounts:0 "Accounts for the patron"
 STP_party_regent_accounts_desc:0 "A northern commission audits the use of assistance. Renner must defend his administrative settlement or yield to further demands from the advisers."
 STP_party_regent_concessions_tt:0 "Treasury: §G+2000§!."
 STP_party_regent_concessions_tt_pf:0 "Nodrulian advisers: §G+8§! support.\nMerchants: §R-6§! support."
 STP_party_regent_concessions:0 "Northern concessions"
 STP_party_regent_concessions_desc:0 "Nodrulian companies receive long-term rights in profitable businesses. Funds reach the treasury, but part of future revenue belongs to the concession holders."
 STP_party_regent_industry_tt:0 "Merchants: §G+8§! support.\nNodrulian advisers: §R-6§! support."
 STP_party_regent_industry:0 "Rebuild domestic workshops"
 STP_party_regent_industry_desc:0 "Renner backs businesses run by local owners. Progress is slower, but a northern creditor cannot control the entire production chain."
 STP_party_regent_customs_tt:0 "Nodrulian advisers: §G+5§! support."
 STP_party_regent_customs:0 "A joint customs service"
 STP_party_regent_customs_desc:0 "Advisers help organise border duties and cargo movements. Stelander gains stable receipts at the cost of a permanent northern presence at customs."
 STP_party_regent_schools_tt:0 "Borons: §G+5§! support.\nNodrulian advisers: §R-3§! support."
 STP_party_regent_schools:0 "Schools for local administrators"
 STP_party_regent_schools_desc:0 "The country needs its own engineers and accountants to negotiate assistance competently. Training reduces technical dependence without cancelling political agreements."
 STP_party_regent_guarantees_tt:0 "Borons: §G+4§! support.\nNodrulian advisers: §G+4§! support."
 STP_party_regent_guarantees:0 "Written limits of the mandate"
 STP_party_regent_guarantees_desc:0 "Renner secures a written division of authority between advisers and local departments. It limits arbitrary interference but does not grant independence by itself."
 STP_party_regent_settlement_tt:0 "Borons: §G+4§! support."
 STP_party_regent_settlement:0 "Terms of the northern presence"
 STP_party_regent_settlement_desc:0 "Renner's administration gains settled rules and functioning institutions. Independence remains a matter for negotiations with Nodrul; capacity and obligations survive a change of government."
 STP_party_property_disputes:0 "Disputed wartime property"
 STP_party_property_disputes_desc:0 "Several owners claim the same businesses. Some economic decisions remain frozen while their documents are reviewed."
 STP_party_officer_petitions:0 "Officers' petitions"
 STP_party_officer_petitions_desc:0 "Frontline officers demand guarantees and a clear place in the postwar settlement. The unresolved dispute obstructs orders."
 STP_party_contract_disputes:0 "Postwar contract disputes"
 STP_party_contract_disputes_desc:0 "Creditors, small workshops and guilds dispute the first postwar contracts. Deliveries are delayed while the parties await arbitration."
 STP_party_archive_backlog:0 "Unresolved wartime files"
 STP_party_archive_backlog_desc:0 "Wartime files have become the subject of institutional conflict. Detainees' relatives and property owners continue to demand answers."
 STP_party_mandate_disputes:0 "Disputed advisory powers"
 STP_party_mandate_disputes_desc:0 "Local institutions and northern advisers issue conflicting orders. An audit must establish responsibility."
 STP_party_hospital_overload:0 "Overloaded hospitals"
 STP_party_hospital_overload_desc:0 "Following the expansion of the drug market, hospitals face more poisonings and addiction. Production loses workers while districts demand treatment funding."
 STP_party_forced_labour_resistance:0 "Resistance to forced labour"
 STP_party_forced_labour_resistance_desc:0 "Legalised slavery has brought escapes, concealment and refusals to cooperate with overseers. Registering transactions has not removed human resistance."
 STP_party_festival_creditors:0 "Festival patrons' demands"
 STP_party_festival_creditors_desc:0 "Patrons of the first celebrations demand appointments and protection for their businesses. Their dispute restricts the cabinet."
 ADISCORD_STP_ch.20.a:0 "Recognise the wartime titles."
 ADISCORD_STP_ch.20.a_tt:0 "Conservatives: §G+8§! support.\nHedonist radicals: §R-6§! support."
 ADISCORD_STP_ch.20.b:0 "Review the documents, regardless of the signatures."
 ADISCORD_STP_ch.20.b_tt:0 "Conservatives: §R-6§! support.\nBorons: §G+6§! support."
 ADISCORD_STP_ch.20.t:0 "Two owners of one factory"
 ADISCORD_STP_ch.20.d:0 "Two sets of documents lie before the Chamber. One predates the war; the other was signed by the commander whose men held the factory during Shabrat's offensive. Both claimants helped the party and regard victory as proof of ownership.\n\nCrowe knows that every district has such cases. Recognising all wartime transactions reassures the victors but alienates former owners. Reviewing each claim requires a commission, resources and a willingness to invalidate some party orders."
 ADISCORD_STP_ch.20.z:0 "The former government no longer decides this matter."
 ADISCORD_STP_ch.21.a:0 "Guarantee transitional support."
 ADISCORD_STP_ch.21.a_tt:0 "Army command: §G+8§! support."
 ADISCORD_STP_ch.21.b:0 "The war is over; an order remains an order."
 ADISCORD_STP_ch.21.b_tt:0 "Army command: §R-8§! support.\nSecurity service: §G+5§! support."
 ADISCORD_STP_ch.21.t:0 "A letter from the front commanders"
 ADISCORD_STP_ch.21.d:0 "Regimental commanders have sent Veil a joint letter. They do not dispute the victory or refuse service. They ask who will support their families, where demobilised soldiers will work and whether the ministry will listen to those who survived the front.\n\nThe answer will shape the staff's relationship with its own officers. The state can pay for a transition to peace or demand discipline while leaving the dispute inside the army. Either answer must work beyond headquarters."
 ADISCORD_STP_ch.21.z:0 "The former government no longer decides this matter."
 ADISCORD_STP_ch.22.a:0 "Accept the guild guarantees."
 ADISCORD_STP_ch.22.a_tt:0 "Treasury: §G+1000§!."
 ADISCORD_STP_ch.22.a_tt_pf:0 "Merchants: §G+8§! support.\nBorons: §R-6§! support."
 ADISCORD_STP_ch.22.b:0 "The state will arbitrate independently."
 ADISCORD_STP_ch.22.b_tt:0 "Merchants: §R-6§! support.\nBorons: §G+8§! support."
 ADISCORD_STP_ch.22.t:0 "Who pays for reopening the ports"
 ADISCORD_STP_ch.22.d:0 "The guilds have brought Lanskoy a common list of claims. Major creditors demand loading priority and guaranteed payments. Small workshops complain that intermediaries withhold advances, citing wartime losses.\n\nAn open port is not yet a functioning market. The cabinet must decide whose terms guide future contracts. A deal with the guilds brings immediate funds; independent arbitration takes time and risks a confrontation with powerful patrons."
 ADISCORD_STP_ch.22.z:0 "The former government no longer decides this matter."
 ADISCORD_STP_ch.23.a:0 "Transfer the files to an independent commission."
 ADISCORD_STP_ch.23.a_tt:0 "Security service: §R-8§! support.\nBorons: §G+8§! support."
 ADISCORD_STP_ch.23.b:0 "Seal the archive under a personal order."
 ADISCORD_STP_ch.23.b_tt:0 "Security service: §G+8§! support.\nHedonist radicals: §R-6§! support."
 ADISCORD_STP_ch.23.t:0 "An archive that did not exist"
 ADISCORD_STP_ch.23.d:0 "A review of authority reveals an archive absent from every departmental register. It contains detention orders, lists of intermediaries and confiscation records. Several names belong to people now holding senior posts.\n\nOfficers ask Korvina to keep the material inside the directorate. Relatives of the missing demand at least confirmation that records exist. Her decision can strengthen personal control or show that the service answers to the state it claims to protect."
 ADISCORD_STP_ch.23.z:0 "The former government no longer decides this matter."
 ADISCORD_STP_ch.24.a:0 "Introduce joint signatures."
 ADISCORD_STP_ch.24.a_tt:0 "Nodrulian advisers: §G+8§! support.\nBorons: §R-6§! support."
 ADISCORD_STP_ch.24.b:0 "We answer for the local budget."
 ADISCORD_STP_ch.24.b_tt:0 "Nodrulian advisers: §R-8§! support.\nBorons: §G+8§! support."
 ADISCORD_STP_ch.24.t:0 "The northern inspection"
 ADISCORD_STP_ch.24.d:0 "A commission from Nodrul believes local departments interpret assistance terms too freely. Advisers propose a mandatory second signature for major spending and a presence at appointments. Stelander's officials reply that without authority they will become translators of foreign orders.\n\nRenner can yield or defend local competence. Neither answer ends the agreements with Nodrul; it decides who will carry them out."
 ADISCORD_STP_ch.24.z:0 "The former government no longer decides this matter."
 ADISCORD_STP_ch.25.a:0 "Let municipalities set venues and rules."
 ADISCORD_STP_ch.25.a_tt:0 "Borons: §G+6§! support.\nHedonist radicals: §R-4§! support."
 ADISCORD_STP_ch.25.b:0 "One programme of celebrations for every district."
 ADISCORD_STP_ch.25.b_tt:0 "Hedonist radicals: §G+8§! support.\nBorons: §R-8§! support."
 ADISCORD_STP_ch.25.obsolete:0 "The legal framework has already changed."
 ADISCORD_STP_ch.25.t:0 "The festival reaches the square"
 ADISCORD_STP_ch.25.d:0 "Hedersett's decree permits public orgies and assigns authorised events to municipal councils. Participation is restricted to consenting adults. State newspapers call it the end of the closed-salon era.\n\nOutside the newsrooms there is little agreement. Organisers demand venues and subsidies, residents dispute the use of public space, and district secretaries ask who will pay for security and cleaning. The chairman must decide how much discretion municipalities retain."
 ADISCORD_STP_ch.25.z:0 "The former government no longer decides this matter."
 ADISCORD_STP_ch.26.a:0 "Investigate the origin of every document."
 ADISCORD_STP_ch.26.a_tt:0 "Security service: §G+6§! support.\nMerchants: §R-8§! support."
 ADISCORD_STP_ch.26.b:0 "Recognise the licensed traders' registers."
 ADISCORD_STP_ch.26.b_tt:0 "Treasury: §G+800§!."
 ADISCORD_STP_ch.26.b_tt_pf:0 "Merchants: §G+8§! support.\nBorons: §R-8§! support."
 ADISCORD_STP_ch.26.obsolete:0 "The law no longer recognises these transactions."
 ADISCORD_STP_ch.26.t:0 "A seal on a human life"
 ADISCORD_STP_ch.26.d:0 "The first register of slave transactions arrives under an ordinary ministry reference number. Its rows contain names, prices and owners. The Lower Market celebrates legal recognition, while clerks debate whether to accept documents drafted during the war.\n\nOutside, families search for missing relatives. Legalisation has not ended abductions or disputes over freedom. The state must now investigate claims or accept traders' papers as sufficient grounds for captivity."
 ADISCORD_STP_ch.26.z:0 "The former government no longer decides this matter."
 ADISCORD_STP_ch.27.a:0 "Reserve part of the duty for treatment."
 ADISCORD_STP_ch.27.a_tt:0 "Treasury: §G+400§!."
 ADISCORD_STP_ch.27.a_tt_pf:0 "Borons: §G+5§! support.\nMerchants: §R-4§! support."
 ADISCORD_STP_ch.27.b:0 "The treasury needs all the receipts."
 ADISCORD_STP_ch.27.b_tt:0 "Treasury: §G+1200§!."
 ADISCORD_STP_ch.27.b_tt_pf:0 "Merchants: §G+6§! support.\nArmy command: §R-6§! support."
 ADISCORD_STP_ch.27.obsolete:0 "A new law has already closed the market."
 ADISCORD_STP_ch.27.t:0 "A new excise duty"
 ADISCORD_STP_ch.27.d:0 "After hard drugs are legalised, the guilds offer their first licence payments. Resort owners promise more visitors, while hospital directors request advance funding for addiction treatment and poisonings.\n\nVeil demands restrictions on use during service and manufacturers warn of missed shifts. Hedersett must decide whether receipts go to the general budget or partly remain with the medical service."
 ADISCORD_STP_ch.27.z:0 "The former government no longer decides this matter."
 ADISCORD_STP_ch.28.a:0 "Fund care and send medical teams."
 ADISCORD_STP_ch.28.a_tt:0 "Borons: §G+6§! support.\nMerchants: §R-4§! support."
 ADISCORD_STP_ch.28.b:0 "Leave the costs to local councils."
 ADISCORD_STP_ch.28.b_tt:0 "Borons: §R-10§! support.\nMerchants: §G+4§! support."
 ADISCORD_STP_ch.28.obsolete:0 "Account for the report under the new framework."
 ADISCORD_STP_ch.28.t:0 "Report from the emergency ward"
 ADISCORD_STP_ch.28.d:0 "Several weeks after the market opened, hospitals submit a joint report. Poisonings have risen, addiction care requires long-term support and smaller districts lack staff. Factory reports now track missed shifts separately.\n\nDoctors do not propose solving the problem by a single police order. They request reliable funding and authority to inspect sales. The government can expand care or leave local councils to cope alone."
 ADISCORD_STP_ch.28.z:0 "The former government no longer decides this matter."
 ADISCORD_STP_ch.29.a:0 "Review complaints and end unlawful detentions."
 ADISCORD_STP_ch.29.a_tt:0 "Merchants: §R-8§! support.\nBorons: §G+6§! support."
 ADISCORD_STP_ch.29.b:0 "Uphold the owners' claims."
 ADISCORD_STP_ch.29.b_tt:0 "Merchants: §G+8§! support.\nSecurity service: §G+5§! support.\nBorons: §R-10§! support."
 ADISCORD_STP_ch.29.obsolete:0 "Ownership of people has already been abolished."
 ADISCORD_STP_ch.29.t:0 "Empty places at the machines"
 ADISCORD_STP_ch.29.d:0 "Business owners report escapes and assistance offered to fugitives by nearby settlements. Forced labour proves less controllable than the trading Houses predicted: people hide, destroy records and refuse to surrender relatives.\n\nThe security service requests powers, while local administrations warn that raids will revive wartime grievances. The cabinet must choose between investigating complaints and extending owners' protection. The law remains in force until labour policy changes."
 ADISCORD_STP_ch.29.z:0 "The former government no longer decides this matter."
 ADISCORD_STP_ch.30.a:0 "Confirm the patrons' concessions."
 ADISCORD_STP_ch.30.a_tt:0 "Conservatives: §G+8§! support.\nHedonist radicals: §R-8§! support."
 ADISCORD_STP_ch.30.b:0 "Publish the accounts and continue inspections."
 ADISCORD_STP_ch.30.b_tt:0 "Hedonist radicals: §G+8§! support.\nConservatives: §R-8§! support.\nBorons: §G+4§! support."
 ADISCORD_STP_ch.30.c:0 "End the emergency levy."
 ADISCORD_STP_ch.30.c_tt:0 "Conservatives: §G+6§! support.\nHedonist radicals: §R-4§! support."
 ADISCORD_STP_ch.30.t:0 "The price of the first celebrations"
 ADISCORD_STP_ch.30.d:0 "The first celebrations are over and the bills have arrived. If the Houses financed them, their representatives demand appointments and protection for investments. If an emergency levy paid for them, club owners demand an end to inspections.\n\nDistrict secretaries point to municipal costs. Hedersett can secure concessions for major patrons or examine the accounts publicly. Earlier loans and tax decisions remain in place either way."
 ADISCORD_STP_ch.30.z:0 "The former government no longer decides this matter."
 STP_party_property_hearings:0 "Hear property disputes"
 STP_party_property_hearings_desc:0 "A commission compares prewar titles with wartime orders, allowing suspended economic decisions to proceed."
 STP_party_property_hearings_tt:0 "Borons: §G+4§! support."
 STP_party_officer_commission:0 "Negotiate peacetime service"
 STP_party_officer_commission_desc:0 "Staff and treasury representatives negotiate the officers' transition to peace without reversing the chosen military settlement."
 STP_party_officer_commission_tt:0 "Army command: §G+4§! support."
 STP_party_contract_arbitration:0 "Arbitrate the contracts"
 STP_party_contract_arbitration_desc:0 "Arbitration settles delivery priority and mutual claims. Existing loans and permanent concessions remain in force."
 STP_party_contract_arbitration_tt:0 "Merchants: §G+4§! support."
 STP_party_detention_review:0 "Review outstanding wartime files"
 STP_party_detention_review_desc:0 "Assign staff to outstanding files. The review addresses the backlog without changing the service's established powers."
 STP_party_detention_review_tt:0 "Borons: §G+4§! support."
 STP_party_mandate_audit:0 "Audit the mandate"
 STP_party_mandate_audit_desc:0 "A joint audit clarifies departmental responsibility and ends conflicting orders without changing Stelander's relationship with Nodrul."
 STP_party_mandate_audit_tt:0 "Nodrulian advisers: §G+3§! support.\nBorons: §G+3§! support."
 STP_party_health_commission:0 "Support overloaded hospitals"
 STP_party_health_commission_desc:0 "Send medical teams and organise addiction care. This resolves the acute crisis while the drug law's continuing effects remain."
 STP_party_health_commission_tt:0 "Borons: §G+4§! support."
 STP_party_labour_inspections:0 "Investigate detention complaints"
