 STP_ps_reserve_training_unlock_summary_tt:0 "Speeds up training and organization recovery for 42 days."
 STP_ps_secure_routes_unlock_summary_tt:0 "Strengthens defence on core territory for 42 days."
 STP_ps_emergency_cabinet_unlock_summary_tt:0 "Restores government operations after the centre is lost."
 STP_ps_institution_payment_unlock_summary_tt:0 "Funds a stage of permanent state institutions."
 STP_ps_district_rebuild_unlock_summary_tt:0 "Builds one civilian factory in the selected district."
 STP_pw_party_restore_ministries_unlock_summary_tt:0 "Grants political power and stability; restores the ministries."
 STP_pw_party_return_specialists_unlock_summary_tt:0 "Grants two industrial research bonuses."
 STP_pw_party_security_reserve_unlock_summary_tt:0 "Increases recruitable manpower and mobilization speed for 180 days."
 STP_pw_party_reopen_port_unlock_summary_tt:0 "Builds a civilian factory and improves port district infrastructure."
 STP_pw_party_refit_guard_unlock_summary_tt:0 "Delivers weapons, support equipment and trucks; grants army experience."
 STP_pw_party_launch_bezhaysk_operation_unlock_summary_tt:0 "Starts a war to annex Bezhaysk and its feudal bloc."
 STP_pw_party_launch_kefreyt_operation_unlock_summary_tt:0 "Starts a war to subjugate Kefreyt and reclaim our lands."
 STP_pw_party_standard_order_unlock_summary_tt:0 "Delivers small arms, artillery and support equipment."
 STP_pw_party_fund_northern_contacts_unlock_summary_tt:0 "Unlocks the Nodrul Congress and grants intelligence on Nodrul."
 STP_pw_party_prepare_northern_campaign_unlock_summary_tt:0 "Grants weapons and army experience; enables the offensive order."
 STP_pw_party_launch_northern_campaign_unlock_summary_tt:0 "Starts a war to subjugate Nodrul."
 STP_pw_party_launch_northern_march_unlock_summary_tt:0 "Starts a war to subordinate Nodrul, Yubor, the Frontier, the Forest and Ainholm."
 STP_pw_party_nod_joint_training_unlock_summary_tt:0 "Grants army experience to both countries and equipment to Nodrul."
 STP_pw_party_nod_industrial_program_unlock_summary_tt:0 "Builds one civilian factory in Nodrul at our expense."
 STP_pw_party_frontier_exercise_unlock_summary_tt:0 "Improves core defence and entrenchment for 180 days."
 STP_ch_cooperate_unlock_summary_tt:0 "Develops local staff and production towards revising the protectorate."
 STP_ch_request_release_unlock_summary_tt:0 "Requests Nodrul's consent to independence."
 STP_ch_armed_break_unlock_summary_tt:0 "Ends subjection and starts a war with Nodrul."
 STP_ch_civilian_control_unlock_summary_tt:0 "Establishes civilian control and resolves the military crisis."
 STP_ch_supply_buffer_unlock_summary_tt:0 "Secures independent supplies to soften the trade crisis."
 STP_ch_security_review_unlock_summary_tt:0 "Resolves the security service crisis while preserving its administration."
 STP_ps_build_radio_unlock_summary_tt:0 "Shortens the first army reorganization by 7 days."
 STP_ch_appoint_appointments_2_unlock_summary_tt:0 "To start §Y$STP_ch_first_promises$§!, make three appointments in $STP_ch_chapters$ decisions: one security, one economic and one party appointment. Choose one option from each pair."

 STP_ps_loyal_aircrews: "Loyal air units"
 STP_ps_loyal_aircrews_desc: "Most pilots and technical services support Shabrat. A Party resolution cannot hold the airfields: reliable commanders, separate communications and assigned crews are needed. Over 21 days, organise the air units that will remain with the government when the country splits."
 STP_ps_loyal_aircrews_tt: "At the split, the party retains roughly §Y20%§! of existing air wings and §Y20%§! of aircraft reserves. Shabrat receives the remainder. Without this focus, the party begins the civil war without inherited aircraft. The focus creates no aircraft; the engine rounds the wing allocation."

