 STP_pf_borons_support_loc: "Support: §Y[?STP_pf_borons_support|1]/100§!"
 STP_pf_borons_tt: "§YBorons§!\nLocal authority and protection of privileges against interference from the capital.\n\n£construction_speed_texticon Construction speed: [?STP_pf_borons_effect|=+1%].\nProgram: §Y[?STP_pf_borons_program|0]/2§!. Beneficial effect cap: §Y[?STP_pf_borons_capacity|1%]§!.\nContribution to apparatus loyalty: §Y[?STP_pf_borons_contribution|1]§! points.\n\nStage 1: Charters for District Organisations.\nStage 2: Congress of District Secretariats.\nAt 20% influence and 70 support: §G+3% / +4% / +5%§!.\nSupport above 50 grants a benefit, below 50 a penalty. Influence scales both. Focuses develop programs and raise benefit caps. Program upgrades do not amplify penalties. Negotiations change political support but do not replace reform.\n\nEndorsement: [STPGetChapterBoronsEndorsement]."
