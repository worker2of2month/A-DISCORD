 STP_ps_expedition_nod: "Prepare Expeditionary Supply"
 STP_ps_expedition_nod_desc: "Prepare reinforcement for Nodrul's expedition. Its §Y42-day§! effect activates only after actual intervention against Shabrat. Payment does not declare war. If intervention closes before delivery, the reserve is refunded."
 STP_ps_exile: "Party Representation in Nodrul"
 STP_ps_cancel_nod: "Cancel Northern Package Preparation"
 STP_ps_nod_dispatch: "Preparing the Northern Package"
 STP_ps_nod_delivery: "Northern Package in Transit"
 STP_ps_agreement_title: "A Protocol with Stelander"
 STP_ps_agreement_desc: "The Party government proposes sending loans, weapons and specialists at its own expense. Acceptance does not oblige Nodrul to declare war or spend its own treasury funds. Possible asylum for the Party leadership will be discussed in a separate protocol."
 STP_ps_agreement_accept: "Accept the agreed aid packages."
 STP_ps_agreement_decline: "Decline these commitments."
