 STP_cw_agree_with_commander: "Negotiate with the Commander: [FROM.GetName]"
 STP_cw_agree_with_commander_desc: "For £political_power_texticon §Y45§! and £command_power_texticon §Y20§!, the commander will prepare personnel for two additional party brigades in §Y14 days§!. Negotiations do not count as a search and do not alter legitimacy; underground connections will survive. Apparatus loyalty: §G+6§!. At the split, the units will appear in party-controlled states if the district remains with the party and sufficient personnel and weapons are available. The operation occupies one preparation slot; loss of control or suspension of district work interrupts negotiations."
 STP_cw_commander_agreement_tt: "If the district remains with the party, we will prepare two additional brigades. Their personnel are reserved before the general allocation. Each unit requires £manpower_texticon §Y4000§! and £infantry_equipment_texticon §Y320§! from party stockpiles. Underground connections are preserved."
 STP_cw_evacuate_garrison_officers: "Evacuate the Officers to Abilia"
 STP_cw_evacuate_garrison_officers_desc: "For £political_power_texticon §Y35§! and in §Y7 days§!, we will evacuate officers connected to us from the district under commission inspection. Local garrison connections will disappear, but the cadres will be preserved for two additional brigades. At the split, the units can be formed in states owned and controlled by the resistance, provided it has enough personnel and weapons. One group can be saved from each garrison: evacuated personnel cannot be recruited again. The operation occupies one slot and must finish before this commission's verdict. The commission will inspect other connections as usual."
 STP_cw_evacuation_result_tt: "The garrison officers will move to Abilia; §Y12§! influence will pass to the party. At the split, Shabrat will be able to form two brigades regardless of the district's fate. Each requires £manpower_texticon §Y4000§! and £infantry_equipment_texticon §Y320§! from his stockpiles. The local garrison cannot be recruited again."
 STP_cw_garrison_evacuated: "This garrison's cadres have already been evacuated to Abilia"
 STP_cw_garrison_evacuation_in_progress: "The officers' evacuation began during the current inspection"
 STP_cw_opposition_target: "An announced underground operation is being prepared in the district"
 STP_REGION_GARRISON_EVACUATED: "\n  §C- officers in Abilia: two Shabrat brigades regardless of the district's fate§!; each requires £manpower_texticon §Y4000§! and £infantry_equipment_texticon §Y320§!. The local garrison cannot be recruited again."
 STP_REGION_GARRISON_EVACUATING: "\n  §Y- officers are being evacuated to Abilia: 7 days, before the current commission's verdict.§!"
 STP_OPPOSITION_NO_TARGET: "operation disrupted or no suitable districts available"
 STP_OPPOSITION_ADMINISTRATION: "\n\n§RUnderground Objective:§! strengthen the network. After 28 days of preparation, influence will increase by 12; if its position is entrenched, the underground will gain a local administration. A command inspection will disrupt this operation."
 STP_OPPOSITION_GARRISON: "\n\n§RUnderground Objective:§! win over the garrison. Once the operation is complete, it can provide Shabrat with a brigade requiring payment if the district changes sides. A command inspection will disrupt the operation."
 STP_OPPOSITION_SUPPLY: "\n\n§RUnderground Objective:§! prepare a depot. On completion, 1200 will leave the treasury if available. If the district changes sides, Shabrat will receive supply support and up to 500 fuel from Stelander's reserve. A command inspection will disrupt the operation."
 STP_OPPOSITION_SABOTAGE: "\n\n§RUnderground Objective:§! arm saboteurs. On completion, 240 rifles will leave the shared stockpile for a forest cache if enough are available. At the split, they will go to the district's owner; if the forest remains under party control, one existing infrastructure level will be damaged. A command inspection will disrupt the operation."
 STP_OPPOSITION_INFLUENCE: "\n\n§RUnderground Objective:§! secure influence before the split. Success will provide 12 influence and shift legitimacy 4% towards Shabrat. A command inspection will disrupt the operation."
 STP_preparation_slot_available_tt: "A preparation slot is available"
 STP_preparation_district_open_tt: "District work has not been suspended by counterintelligence or the surrender of an official"
 STP_FALSE_TRAIL_ODDS_HIDDEN: "At the end of the commission, the game makes a single roll based on suspicion that day (currently [?STP_party_suspicion|0]). Outcomes: convincing trail §G60%§!, imperfect trail 30%, courier detained 10%, counterintelligence breakthrough 0%."
 STP_FALSE_TRAIL_ODDS_LOW: "At the end of the commission, the game makes a single roll based on suspicion that day (currently [?STP_party_suspicion|0]). Outcomes: convincing trail §G35%§!, imperfect trail 40%, courier detained 20%, counterintelligence breakthrough §R5%§!."
 STP_FALSE_TRAIL_ODDS_MEDIUM: "At the end of the commission, the game makes a single roll based on suspicion that day (currently [?STP_party_suspicion|0]). Outcomes: convincing trail 15%, imperfect trail 35%, courier detained 35%, counterintelligence breakthrough §R15%§!."
 STP_FALSE_TRAIL_ODDS_HIGH: "At the end of the commission, the game makes a single roll based on suspicion that day (currently [?STP_party_suspicion|0]). Outcomes: convincing trail 5%, imperfect trail 20%, courier detained 40%, counterintelligence breakthrough §R35%§!."
