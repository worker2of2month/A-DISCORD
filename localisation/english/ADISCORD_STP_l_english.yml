 STP_debug_start_battle_for_stelander: "§RDEBUG:§! Start the Battle for Stelander"
 STP_debug_start_battle_for_stelander_desc: "Triggers the introductory event, selects Shabrat's side and starts district work. The first commission will be appointed in 21 days; its inspection will last 40 days."
 STP_debug_reset_battle_for_stelander: "§RDEBUG:§! Reset the Battle for Stelander"
 STP_debug_reset_battle_for_stelander_desc: "Removes all regional assets and influence, then recreates the system with its initial values."
 STP_debug_end_battle_for_stelander: "§RDEBUG:§! End the Battle for Stelander"
 STP_debug_end_battle_for_stelander_desc: "Removes regional variables, flags and the active party inspection."
 STP_scenario_debug: "§RDEBUG:§! Stelander"
 STP_scenario_debug_desc: "Administrative entry points for the Stelander scenario. This category is visible only when the game is launched in debug mode."
 STP_debug_start_civil_war: "§RDEBUG:§! Start the Civil War"
 STP_debug_start_civil_war_desc: "Skips preparation and elections, then triggers the normal split. If no side has been chosen, the player remains with the party."
 STP_debug_resolve_party_victory: "§RDEBUG:§! Party Victory"
 STP_debug_resolve_party_victory_desc: "Starts the normal split if necessary and confirms party victory an hour later. The player switches to STP if still playing the resistance."
 STP_debug_resolve_shabrat_victory: "§RDEBUG:§! Shabrat's Victory"
 STP_debug_resolve_shabrat_victory_desc: "Starts the normal split if necessary and confirms Shabrat's victory an hour later. The player switches to STS if still playing the party."
