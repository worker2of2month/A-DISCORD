 STP_ps_exile_offer_title: "A Request from the Surviving Leadership"
 STP_ps_exile_offer_desc: "The Party's army has been defeated. Its surviving organisers request asylum. Acceptance neither takes control of Nodrul away from you nor changes its leader. You may receive the organisation without promising a war to restore it."
 STP_ps_exile_refuse: "Close the representation."
 STP_ps_exile_accept: "Grant asylum."
 STP_ps_exile_arrived_title: "Representation in Exile"
 STP_ps_exile_arrived_desc: "The war for Stelander has been lost. Shabrat controls the country, and the surviving Party organisation begins its work in Nodrul. Only funds evacuated in advance have been preserved. The host country's army, treasury and government remain its own. Returning will require a separate political agreement and a real military victory."
 STP_ps_exile_arrived_ok: "Begin the representation's work."
 STP_ps_return_title: "The Restored Government"
 STP_ps_return_desc: "Nodrul has won the campaign of return. Stelander has been restored as a subject state on its core territories. Surviving leaders may return; the dead remain dead. Old wartime orders do not resume."
 STP_ps_remain_nod: "Continue as Nodrul."
 STP_ps_control_stp: "Lead the restored Stelander."
 STP_ps_return_terms_tt: "Returning will restore Stelander as a subject state of Nodrul. Military victory is required; paying for preparation is no substitute."
 STP_ps_evacuate_funds_cost: "£ADISCORD_economy_treasury_texticon §Y3000§!"
 STP_ps_evacuate_funds_cost_blocked: "£ADISCORD_economy_treasury_texticon §R3000§!"
 STP_ps_evacuate_funds_cost_tooltip: "£ADISCORD_economy_treasury_texticon §Y3000§!"
 STP_ps_evacuate_funds: "Evacuate the Organisation's Reserve"
 STP_ps_evacuate_funds_desc: "Deducts 3000 treasury units once and places them in an evacuation reserve. If exile is accepted, Nodrul receives the funds; if the Party wins, the reserve is returned. Refusal of asylum means the evacuated funds are lost."
 STP_ps_accept_return_terms: "Accept the Terms of Return"
 STP_ps_accept_return_terms_desc: "Confirms Nodrul's approval of the Party return plan. Stelander will be restored as a subject of Nodrul only after a successful military campaign."
 STP_ps_launch_return: "Launch the Campaign of Return"
 STP_ps_launch_return_desc: "After the terms are accepted, launches the prepared return campaign against Shabrat. Victory restores Stelander as a subject of Nodrul."
 STP_ps_exile_training_cost: "£ADISCORD_economy_treasury_texticon §Y1800§!"
 STP_ps_exile_training_cost_blocked: "£ADISCORD_economy_treasury_texticon §R1800§!"
 STP_ps_exile_training_cost_tooltip: "£ADISCORD_economy_treasury_texticon §Y1800§!"
 STP_ps_exile_training: "Prepare the Return Headquarters"
 STP_ps_exile_training_work: "Preparing the Return Headquarters"
 STP_ps_exile_training_desc: "1800 treasury units and 28 days. Headquarters gains 15 Army Experience and prepares the political and military plan for returning. Formations are ordered separately, with their full personnel and equipment reserved."
 STP_ps_exile_training_work_desc: "1800 treasury units reserved. The result is delivered only if the programme's conditions still hold; cancellation refunds the deposit once."
 STP_ps_radio_network: "Government Communications Network"
 STP_ps_radio_network_desc: "Under the old system, almost every urgent order passed through a handful of capital hubs. Lose one station or one duty officer, and districts began waiting for confirmation that might never arrive. The Party will distribute transmitters, call-sign tables and copies of ciphers across independent communication posts.\n\nThis is not another radio station for speeches. It is a network in which capturing one office no longer means silence for the entire state."
 STP_ps_reserve_hq: "Reserve Headquarters"
 STP_ps_reserve_hq_desc: "For too long, the Bronze Congress has simultaneously been a symbol of power, an archive and the place from which the army expected its orders. A reserve headquarters will receive copies of maps, mobilisation lists, seals and communication channels in a separate protected building outside the government quarter.\n\nIf the capital comes under attack, the state will need not a monument to continuity, but a second desk whose occupants already know what to do."
 STP_ps_evacuation_plan: "Evacuation Plan"
 STP_ps_evacuation_plan_desc: "We will arrange communications, documents and evacuation of the organisation in advance. Funds are evacuated through a separate decision; the plan does not transfer the army or the remaining state treasury."
 STP_ps_northern_partner: "The Northern Ally"
 STP_ps_northern_partner_desc: "Nodrul is fighting its own war. We will offer assistance and establish permanent links between departments. The agreement does not replace its decision on intervention; asylum guarantees are discussed in a separate protocol."
 STP_ps_northern_credit: "A Loan to the War Ministry"
 STP_ps_northern_credit_desc: "The loan is paid from our treasury and enters Nodrul's budget. Supporting our ally competes with rebuilding our own army."
 STP_ps_northern_arms: "Weapons for the Northern Front"
 STP_ps_northern_arms_desc: "The northern front needs rifles, artillery and logistics equipment. Only supplies actually held in our depots can be transferred."
 STP_ps_northern_engineers: "Engineering Mission"
 STP_ps_northern_engineers_desc: "Engineers serve on the active northern front for a limited term. Their military effect ends when the war does."
 STP_ps_joint_staff: "Joint Headquarters"
 STP_ps_joint_staff_desc: "For the first time, Nodrulian officers and the Party staff will sit at one table not as advisers and wards, but as two armies that may need the same road. Common fuel requests, train routes and communication tables will be agreed in advance.\n\nNodrul will retain its own command. The Party will retain its own. Only what must function on the day good intentions cease to be enough for either side will be shared."
 STP_ps_expedition_logistics: "Support the Redeployment"
 STP_ps_expedition_logistics_desc: "We will prepare a supply reserve that takes effect only after Nodrul actually enters the war. The seven-day army redeployment remains mandatory."
 STP_ps_asylum_protocol: "Asylum Guarantees"
 STP_ps_asylum_protocol_desc: "Even defeat of the northern army does not preclude asylum, as long as Nodrul exists and retains an independent government. The agreement provides asylum for the Party leadership; control of Nodrul is not transferred."
 STP_ps_foreign_supply_desk: "Foreign Supply Bureau"
 STP_ps_foreign_supply_desk_desc: "Unlock intelligence on Kefreyt shipments, interception and supplier pressure. Choose between seizing a specific cargo and delaying supplies; each operation needs time and its own budget."
 STP_ps_ammunition_board: "Ammunition Reserve"
 STP_ps_ammunition_board_desc: "A mixed ordnance package can be ordered through the transport directorate or after expanding the arsenals. The government chooses which route to open first. Each order costs 2400 treasury units and takes 21 days; preparing the paperwork alone does not replenish the depots."
 STP_ps_operational_reserve: "Operational Reserve"
 STP_ps_operational_reserve_desc: "Make the army the foundation of the counterattack: activate the operational reserve programme immediately for 42 days and unlock its paid continuation. The army faction gains influence. This course excludes the route-security priority."
 STP_ps_route_security: "Route Security"
 STP_ps_route_security_desc: "Prioritise security of Congress and the Niansas communications route: activate route guards immediately for 42 days and unlock paid continuation. The security service gains influence. This course excludes the operational reserve."
 STP_ps_temporary_presidium: "Provisional Presidium"
 STP_ps_temporary_presidium_desc: "Losing the Congress requires a government empowered to authorise military expenditure. In seven days, we will approve a provisional presidium, gain another seven days for the active government crisis and unlock paid establishment of an emergency cabinet. The free administrative procedure remains available immediately; a reserve headquarters prepared in advance retains its accelerated option."
 STP_ps_restore_couriers: "Restore District Communications"
 STP_ps_restore_couriers_desc: "After the Bronze Congress fell, some telephone lines disappeared along with their offices; others became more dangerous than silence. District couriers will receive routes, reserve seals and authority to answer to the functioning provisional government.\n\nRestored communications unlock frontline regrouping and provide 25 command power for one such order. They allow the rear administration and an operations directorate to be established without waiting for the capital to be retaken."
 STP_ps_counter_supply: "Block Kefreyt's Supply Channels"
 STP_ps_counter_supply_desc: "Headquarters gains intelligence on Kefreyt's armed forces and immediately examines its current resistance shipment. You may then pay for interception or delay departure with immediate pressure. Future shipments require fresh reconnaissance."
 STP_ps_retake_congress: "The Government Returns"
 STP_ps_retake_congress_desc: "The army must actually retake the Bronze Congress quarter: a government decision cannot replace victory on the ground. After the building is recovered, we will bring the departments together there, check the archives and confirm the district administrations' authority.\n\nResuming operations increases stability and war support by 5 percentage points. This is a one-time result of the government's return; losing and retaking the quarter again grants no further reward."
 STP_ps_permanent_security: "Permanent Security Service"
 STP_ps_permanent_security_desc: "The centre must maintain a permanent apparatus and pay for its work. Reorganisation proceeds through three payments and establishes a centralised model of government."
 STP_ps_presidium_authority: "The Presidium's Authority"
 STP_ps_presidium_authority_desc: "The presidium's authority consolidates the paid reorganisation. District concessions are reviewed upon completion; the emergency apparatus becomes a permanent expense."
 STP_ps_district_fund: "District Reconstruction Fund"
 STP_ps_district_fund_desc: "The districts receive their own programme of actual construction projects. Distributing funds requires the restoration of administration to be completed."
 STP_ps_cells_agreement: "Agreement between the Cells"
 STP_ps_cells_agreement_desc: "District participation is secured in a permanent agreement. Instead of a single security apparatus, the organisation adopts decentralised administration and local obligations."
 STP_ps_exile_office: "Representation in Exile"
 STP_ps_exile_office_desc: "The organisation retains its independent political work, but operates under Nodrul's laws."
 STP_ps_exile_survivors: "Gather the Survivors"
 STP_ps_exile_survivors_desc: "We will assemble active organisers and restore records of the survivors. The dead and arrested do not return by a chancellery's decision."
 STP_ps_host_agreement: "An Agreement with Our Hosts"
 STP_ps_host_agreement_desc: "Nodrul retains its army, head of state and foreign policy. Exile formations require its resources and separate payment."
 STP_ps_exile_formations: "Exile Formations"
 STP_ps_exile_formations_desc: "We will prepare the cadres of new units. Each formation must be paid for in manpower and weapons; the Party's former army is not copied."
 STP_ps_return_terms: "The Price of Return"
 STP_ps_return_terms_desc: "A Party restored by Nodrul will depend on the military victor. These terms may be accepted through a separate decision, or the organisation may continue its work in exile."
 STP_ps_return_campaign_focus: "The Campaign of Return"
 STP_ps_return_campaign_focus_desc: "Political and military preparation allows a separate campaign to begin. If Nodrul is already fighting Shabrat, the existing war is used."
 STP_ps_northern_agreement_tt: "Nodrul will receive an offer to accept paid aid packages. War and asylum are agreed separately."
 STP_ps_central_result_tt: "Permanent model: stability +5%, daily political power +0.10, administrative expenditure +8%. Emergency district concessions are revoked."
 STP_ps_district_result_tt: "Permanent model: construction speed +8%, administrative expenditure -5%, daily political power -0.05. District concessions become part of the agreement."
