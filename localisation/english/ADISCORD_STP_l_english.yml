 # Personal hegemony and betrayed promises
 STP_pc_heg_chancellery: "The Right to Enter Unannounced"
 STP_pc_heg_chancellery_desc: "Letters once addressed to the whole government now arrive at a single office. The founder's chancellery will decide who receives an answer and who is granted an audience."
 STP_pc_heg_trusted_list: "One Signature on Every Appointment"
 STP_pc_heg_trusted_list_desc: "The districts have submitted their candidates, but every name now needs another signature. Shabrat intends to choose personally the people entrusted with the state."
 STP_pc_heg_old_guard: "Those Who Held the Pass"
 STP_pc_heg_old_guard_desc: "The men who held the passes and rallied broken units will not become petitioners in their own capital. Preserve their access to the founder and offer paid reserve service. Relying on the wartime brotherhood rules out replacing them with graduates of a new administrative school."
 STP_pc_heg_new_ladder: "Service Begins with an Examination"
 STP_pc_heg_new_ladder_desc: "Administrative appointments will depend on training, not a seat beside Shabrat on the wartime council. Train a new apparatus and secure its position through its own account of victory. Veterans keep their medals, but this route offers no return to reserve service."
 STP_pc_heg_personal_oath: "A Name in the Oath"
 STP_pc_heg_personal_oath_desc: "Shabrat's name has appeared in the new oath. The commanders are willing to discuss loyalty, but want to know which obligations the state will retain towards their soldiers. Commanders have 10 days to present their terms for the new oath."
 STP_pc_heg_official_history: "A Victory Without Coauthors"
 STP_pc_heg_official_history_desc: "Editors will receive a common plan for the anniversary edition. Staff disputes, independent district decisions and the names of those who still call victory a shared achievement will gradually disappear."
 STP_pc_heg_rewrite_mandate: "No Expiry Date"
 STP_pc_heg_rewrite_mandate_desc: "Emergency powers have outlived their original purpose. The chancellery will present a law making the continuation of the founder's authority the ordinary form of government. The draft undergoes a 21-day review before the terms of the new mandate are decided."
 STP_pc_heg_public_trial: "Yesterday's Comrades in the Dock"
 STP_pc_heg_public_trial_desc: "An open letter from former allies will become grounds for a public hearing. The government can present dissent as a threat to order, but veterans will see their comrades among the accused. Preparing the hearing takes 14 days."
 STP_pc_heg_closed_session: "An Exit with Dignity"
 STP_pc_heg_closed_session_desc: "Invitations will be sent without an agenda. Dissenters will be offered resignations and terms for their departure; preserving the appearance of unity will require real concessions. Negotiating the terms of departure takes 14 days."
 STP_pc_heg_revolution_name: "The Revolution Bears My Name"
 STP_pc_heg_revolution_name_desc: "The last powers of the collective leadership will pass to the founder. Former allies will either take their places within his order or lose the ability to challenge his decisions. The struggle over the form of government will be settled."
 STP_heg_betrayal: "A Sense of Betrayal"
 STP_heg_betrayal_desc: "Former allies watch a shared victory turn into personal rule. Betrayal changes through decisions and fulfilled obligations."
 STP_heg_betrayal_category: "The Price of Personal Rule"
 STP_heg_betrayal_category_desc: "Betrayal: §Y[?STP_heg_betrayal_score|0]/100§!.\n\n0-24: no penalties.\n25-49: §R-3%§! stability.\n50-74: §R-6%§! stability, §R-5%§! political power gain.\n75-100: §R-10%§! stability, §R-10%§! political power gain, §R+5%§! administrative expenses.\n\nThe chancellery handles one assignment at a time. Audiences can be repeated after 90 days. The veteran route opens a one-time paid reserve recall; completing it also delays the next audience by 90 days. Cancellation refunds the full payment. The Revolution Bears My Name closes the balance, removes its penalties and refunds unfinished payments."
