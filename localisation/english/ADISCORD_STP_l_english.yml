 STP_party_staff_drills_program_desc:0 "Put the guard staff through an accelerated cycle of mobilisation and command exercises. For §Y42 days§!, Military Development growth increases by §G+100%§!."
 STP_party_civil_service_program:0 "Civil Service School"
 STP_party_civil_service_program_desc:0 "Use the new civil register to accelerate training for district officials and apparatus cadres. For §Y42 days§!, State Development growth increases by §G+100%§!."

 # Postwar specialist training
 STP_pw_party_mountain_school: "Mountain Infantry School"
 STP_pw_party_mountain_school_desc: "The border staff needs formations able to operate on mountain passes with limited heavy support. Establish instructor courses and a mountain brigade organization with its own engineer company."
 STP_pw_party_marine_school: "Marine Infantry School"
 STP_pw_party_marine_school_desc: "An operational naval base will host a permanent school for landings, river crossings, port security and supplying a beachhead."
 STP_pw_republic_mountain_school: "Mountain Brigade Training"
 STP_pw_republic_mountain_school_desc: "Turn the experience of mountain detachments into a permanent programme for guides, signals personnel and engineers, with a common brigade organization."
 STP_pw_republic_marine_school: "Marine Infantry Training"
 STP_pw_republic_marine_school_desc: "Use the restored ports to establish a marine training centre and coordinate coastal operations with the fleet."
 STP_pw_specialist_naval_base_tt: "Owns and controls a state with a naval base."
 STP_pw_stelander_mountaineers:0 "Stelander Mountaineers"
 STP_pw_stelander_mountaineers_desc:0 "The mountain brigade school combines the experience of local guides with army training. Shabrat's mountaineers are trained to seize passes, hold the heights and maintain cohesion on difficult mountain routes."
 STP_pw_mountain_template_tt: "Creates the Stelander Mountain Brigade template with §Y6§! mountain battalions and an engineer company. Recruit brigades normally using national manpower and equipment."
 STP_pw_marine_template_tt: "Creates the Stelander Marine Brigade template with §Y6§! marine battalions and an engineer company. Recruit brigades normally using national manpower and equipment."
 ADISCORD_tech_stelander_marine_corps: "Stelander Marine Corps Organization"
 ADISCORD_tech_stelander_marine_corps_desc: "A permanent marine training and recruitment system established through the postwar army programme."

 # Postwar party constitution and special laws
 STP_pw_party_no_pending_compact_tt: "No independence settlement is awaiting a reply"
 STP_pw_party_laws_unlocked_tt: "Special party laws are established automatically through its political program."
 STP_drug_policy_laws: "Drug Regulation"
 STP_drug_policy_laws_desc: "Rules governing narcotic production, sale and use. Focuses and events establish this law; manual changes are unavailable."
 STP_law_slavery: "Slavery Act"
 STP_law_slavery_desc: "The law treats people as property and allows houses and enterprises to buy and exploit forced labor. Increased output and owners' revenue come with public unrest and the cost of enforcing coercion. Established by the focus creating the new party republic."
 STP_law_slavery_support_tt: "Both Boron and Merchant support are at least §Y50§!"
 STP_law_public_orgies: "Public Orgies"
 STP_law_public_orgies_desc: "Public orgies and open festivities for adults are legally permitted. Radicals celebrate the end of exclusive private entertainment, while Conservatives object to the erosion of social boundaries."
 STP_law_private_societies: "Private Pleasure Societies"
 STP_law_private_societies_desc: "Private clubs preserve the privileges of the High Houses and receive tax concessions."
 STP_law_light_drugs: "Legalization of Soft Drugs"
 STP_law_light_drugs_desc: "Licensed sales of soft drugs are permitted; hard drugs remain prohibited. Moderate revenues accompany additional healthcare costs."
 STP_law_hard_drugs: "Legalization of Hard Drugs"
 STP_law_hard_drugs_desc: "Licensed sales extend to hard drugs while soft drugs remain legal. Higher trade revenue comes with healthcare costs and lost productivity."
 STP_law_drug_prohibition: "Total Drug Prohibition"
 STP_law_drug_prohibition_desc: "The production, sale and use of narcotics are prohibited, including medical use. Enforcement requires administrative spending."
