 STP_EMERGENCY_PRESIDIUM_strategy_tt: "Faction support: Conservatives: §G+6§!; Security services: §G+6§!."
 STP_THE_PARTY_CLOSES_RANKS_strategy_tt: "Faction support: Conservatives: §G+8§!; Army command: §G+4§!."
