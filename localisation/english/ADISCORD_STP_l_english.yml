 STP_cw_sabotage_capital_result_tt: "If the party retains §Y[28.GetName]§! at the split: damage to §Y2§! infrastructure levels and §Y1§! military factory; for §Y70 days§!, its army organisation §R-15%§! and planning speed §R-25%§!. If the district joins the resistance, the buildings will be preserved. Resistance influence §G+12§!, suspicion §R+8§!."
 STP_cw_sabotage_industry_result_tt: "If the party retains §Y[29.GetName]§! at the split: damage to §Y2§! civilian factories; for §Y70 days§!, military factory output §R-20%§! and production efficiency cap §R-15%§!. If the district joins the resistance, the factories will be preserved. Resistance influence §G+10§!, suspicion §R+5§!."
