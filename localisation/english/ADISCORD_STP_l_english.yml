 STP_pf_security_tt: "§YSecurity Service§!\nInspections, agents and control of internal security.\n\n£STP_pf_stability_effect Stability: [?STP_pf_security_effect|=+1%].\nProgram: §Y[?STP_pf_security_program|0]/2§!. Beneficial effect cap: §Y[?STP_pf_security_capacity|1%]§!.\nContribution to apparatus loyalty: §Y[?STP_pf_security_contribution|1]§! points.\n\nStage 1: Presidium Personnel Commissions.\nStage 2: Executive Secretariat.\nAt 20% influence and 70 support: §G+1.6% / +2% / +2.6%§!.\nSupport above 50 grants a benefit, below 50 a penalty. Influence scales both. Focuses develop programs and raise benefit caps. Program upgrades do not amplify penalties. Negotiations change political support but do not replace reform.\n\nEndorsement: [STPGetChapterSecurityEndorsement]."
