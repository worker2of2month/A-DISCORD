 STP_ch_pressure_line_2:0 "§RNodrul pressure, stage 2/4 «Sanctions and aid withdrawal»:§! §Y[?days_mission_timeout@STP_ch_pressure_2|0]§! days left. [STPGetChapterPressureTarget]"
