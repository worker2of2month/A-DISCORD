 STP_ps_institution_payment_desc: "Cost: §Y2000§! £ADISCORD_economy_treasury_texticon units. Duration: 28 days. If its conditions no longer hold, the unfinished deposit is refunded."
 STP_ps_institution_payment_work_desc: "§Y2000§! £ADISCORD_economy_treasury_texticon units reserved. The result is delivered only if the programme's conditions still hold; cancellation refunds the deposit once."
 STP_ps_val_send_supply_cost: "§Y12000§! £infantry_equipment_texticon"
