 STP_PARTY_RESPONSE_PURGE: "§Rthe inspection purged a recruited official§!"
 STP_PARTY_RESPONSE_GARRISON: "§Rthe agreement with the local council was terminated; a party garrison was deployed§!"
 STP_PARTY_RESPONSE_RAID: "§Rsecurity forces struck the network's most conspicuous centre§!"
 STP_PARTY_RESPONSE_AUDIT: "§Ythe apparatus reinforced ordinary administrative discipline§!"
 STP_PARTY_RESPONSE_CONCESSION: "§Yan official was surrendered; military connections and stockpiles preserved§!"
