 # Charter cabinet programmes
 STP_pc_charter_sotnikov_mandate:0 "A Mandate for Human Dignity"
 STP_pc_charter_sotnikov_mandate_desc:0 "Sotnikov must prove that freedom can outlive the victorious army. His cabinet will judge its decisions by their effect on human dignity."
 STP_pc_charter_sotnikov_mandate_delta:0 "A Mandate for Human Dignity"
 STP_pc_charter_sotnikov_independent_bench:0 "Courts Beyond Command"
 STP_pc_charter_sotnikov_independent_bench_desc:0 "Military orders must not substitute for a judicial ruling. Independent hearings will protect citizens even against the victors."
 STP_pc_charter_sotnikov_independent_bench_delta:0 "Courts Beyond Command"
 STP_pc_charter_sotnikov_open_hearings:0 "Open Hearings"
 STP_pc_charter_sotnikov_open_hearings_desc:0 "Court decisions cannot remain behind the doors of headquarters. Publishing the reasons for a verdict will help distinguish law from personal revenge. This is the first judicial priority. District petition offices will later allow a separately funded review of detentions."
 STP_pc_charter_sotnikov_prison_review:0 "Reviewing Detentions"
 STP_pc_charter_sotnikov_prison_review_desc:0 "The wartime lists contain people with different responsibilities and histories. The cabinet will review disputed detentions while preserving accountability for proven crimes. This is the first judicial priority. District petition offices will later allow separate funding for the commandant's public case."
 STP_pc_charter_sotnikov_district_petitions:0 "District Petition Offices"
 STP_pc_charter_sotnikov_district_petitions_desc:0 "Many complaints never reach the capital. Local petition offices will let residents seek an answer without leaving their homes."
 STP_pc_charter_sotnikov_district_petitions_delta:0 "District Petition Offices"
 STP_pc_charter_sotnikov_civilian_inspectorate:0 "Civilian Inspection"
 STP_pc_charter_sotnikov_civilian_inspectorate_desc:0 "Security institutions must be inspected by people outside their chain of command. A common inspection procedure will constrain abuse without dismantling necessary services."
 STP_pc_charter_sotnikov_public_guarantees:0 "Guarantees Without Exceptions"
 STP_pc_charter_sotnikov_public_guarantees_desc:0 "The law is tested by those most easily denied its protection. The cabinet will secure a common standard of treatment for every citizen."
 STP_pc_charter_sotnikov_public_guarantees_delta:0 "Guarantees Without Exceptions"
 STP_pc_charter_sotnikov_civil_return:0 "Returning to Civilian Life"
 STP_pc_charter_sotnikov_civil_return_desc:0 "Those returning from war need work and a place in their community. A voluntary reintegration programme will help veterans without turning assistance into another order. A paid, one-time programme will establish a civilian workshop for returning families and veterans."
 STP_pc_charter_sotnikov_family_records:0 "Restoring Family Records"
 STP_pc_charter_sotnikov_family_records_desc:0 "Lost records prevent families from securing housing and proving kinship. Reconstruction will begin with people's testimony rather than demands for papers that no longer exist."
 STP_pc_charter_sotnikov_family_records_delta:0 "Restoring Family Records"
 STP_pc_charter_sotnikov_community_clinics:0 "Community Clinics"
 STP_pc_charter_sotnikov_community_clinics_desc:0 "Peace should also be visible in the queue for medical care. Community clinics will concentrate on recovery from wounds and accessible everyday treatment. Treatment receives the first budget. Worker representation will later allow a separately funded housing programme."
 STP_pc_charter_sotnikov_homes_for_families:0 "Homes for Families"
 STP_pc_charter_sotnikov_homes_for_families_desc:0 "Families cannot live indefinitely in wartime accommodation. An orderly repair programme will give building crews clear tasks and a practical sequence of work. Housing receives the first budget. Worker representation will later allow separate funding for district healthcare."
 STP_pc_charter_sotnikov_homes_for_families_delta:0 "Homes for Families"
 STP_pc_charter_sotnikov_workers_voice:0 "A Voice for Workers"
 STP_pc_charter_sotnikov_workers_voice_desc:0 "A workshop must listen to the people who keep it running. Elected representatives will help resolve disputes before production stops."
 STP_pc_charter_sotnikov_civil_workshops:0 "Workshops for Peace"
 STP_pc_charter_sotnikov_civil_workshops_desc:0 "Civilian work requires real equipment. The cabinet will support a civilian workshop where residents are already able to begin reconstruction."
 STP_pc_charter_sotnikov_vocational_retraining:0 "Learning a Civilian Trade"
 STP_pc_charter_sotnikov_vocational_retraining_desc:0 "A military speciality does not always support a family after war. Practical courses will connect veterans' experience with the needs of working enterprises."
 STP_pc_charter_sotnikov_vocational_retraining_delta:0 "Learning a Civilian Trade"
 STP_pc_charter_sotnikov_army_under_law:0 "An Army Under Law"
 STP_pc_charter_sotnikov_army_under_law_desc:0 "Military service protects civilian life rather than owning it. Common rules of authority will bind commanders to the institutions of the Charter."
 STP_pc_charter_sotnikov_citizen_reserve:0 "A Citizens' Reserve"
 STP_pc_charter_sotnikov_citizen_reserve_desc:0 "The defence of the country must not belong to a single caste. A territorial reserve of trained citizens will protect the districts and keep the army from becoming a power of its own again."
 STP_pc_charter_sotnikov_professional_service:0 "A Professional Service"
 STP_pc_charter_sotnikov_professional_service_desc:0 "A small volunteer army under civilian control will cost less than general mobilisation and return people to peaceful work."
 STP_pc_charter_sotnikov_medical_services:0 "A Service for the Wounded"
 STP_pc_charter_sotnikov_medical_services_desc:0 "A wounded soldier's return begins with timely treatment. Training medics and cooperating with civilian doctors will improve the recovery of formations."
 STP_pc_charter_sotnikov_medical_services_delta:0 "A Service for the Wounded"
 STP_pc_charter_sotnikov_defensive_drills:0 "Exercises for Defence"
 STP_pc_charter_sotnikov_defensive_drills_desc:0 "The army needs readiness for a threat rather than a reason to invent one. Defensive exercises will test communications, discipline and command."
 STP_pc_charter_sotnikov_field_supply:0 "Supply Without Requisitions"
 STP_pc_charter_sotnikov_field_supply_desc:0 "Residents should not fear the arrival of their own army. Planned supply will reduce formations' dependence on seizures from nearby settlements."
 STP_pc_charter_sotnikov_field_supply_delta:0 "Supply Without Requisitions"
 STP_pc_charter_sotnikov_rescue_stores:0 "Stores for Relief"
 STP_pc_charter_sotnikov_rescue_stores_desc:0 "During an emergency, assistance must arrive before an argument between departments. Rear services will prepare equipment for immediate relief work. A civilian contract will purchase support equipment and trucks. Arbitrary requisitions do not count as a fulfilled contract."
 STP_pc_charter_sotnikov_officer_responsibility:0 "Command Responsibility"
 STP_pc_charter_sotnikov_officer_responsibility_desc:0 "A good commander answers for people and for the consequences of an order. Reviewing exercises will make that responsibility part of daily staff work."
 STP_pc_charter_sotnikov_officer_responsibility_delta:0 "Command Responsibility"
 STP_pc_charter_sotnikov_peaceful_readiness:0 "Readiness to Preserve Peace"
 STP_pc_charter_sotnikov_peaceful_readiness_desc:0 "A restrained policy requires reliable defence. A prepared army will let the cabinet discuss peace without fear or empty threats."
 STP_pc_charter_sotnikov_peaceful_readiness_delta:0 "Readiness to Preserve Peace"
 STP_pc_charter_sotnikov_cabinet_review:0 "Reviewing the Promises"
 STP_pc_charter_sotnikov_cabinet_review_desc:0 "Courts, recovery and the army must serve the same citizen rather than three departments. The cabinet will compare the results of all three strands and close the gaps between them. Recognition requires civilian review of both judicial cases, an honoured labour agreement, both social priorities, a reintegration workshop and paid rear-service stores."
 STP_pc_charter_sotnikov_cabinet_review_delta:0 "Reviewing the Promises"
 STP_pc_charter_sotnikov_charter_fulfilled:0 "Freedom Becomes a Habit"
 STP_pc_charter_sotnikov_charter_fulfilled_desc:0 "The Charter is sustained by daily actions as well as signatures. Sotnikov's programme will conclude with a common commitment to preserve human dignity after the emergency ends. The legacy and guarantor's authority depend on fulfilled obligations and the retained army model. Unfinished work can be completed later through decisions."
 STP_pc_charter_shabrat_mandate:0 "The Charter's National Mandate"
 STP_pc_charter_shabrat_mandate_desc:0 "Shabrat sees the Charter as the foundation of a united and strong country. His cabinet will demand loyalty to a state obliged to protect its citizens."
 STP_pc_charter_shabrat_mandate_delta:0 "The Charter's National Mandate"
 STP_pc_charter_shabrat_common_citizenship:0 "One Citizenship"
 STP_pc_charter_shabrat_common_citizenship_desc:0 "A common country cannot rest on grades of citizenship. Unified documents will establish membership of the state above local privileges."
 STP_pc_charter_shabrat_common_citizenship_delta:0 "One Citizenship"
 STP_pc_charter_shabrat_domestic_suppliers:0 "Domestic Suppliers"
 STP_pc_charter_shabrat_domestic_suppliers_desc:0 "The country needs enterprises able to meet its needs. The cabinet will begin with reliable orders for existing domestic workshops."
 STP_pc_charter_shabrat_domestic_suppliers_delta:0 "Domestic Suppliers"
 STP_pc_charter_shabrat_district_registers:0 "Consolidating District Registers"
 STP_pc_charter_shabrat_district_registers_desc:0 "Scattered registers turn common policy into an argument over incompatible figures. Reconciling records will give districts an equal place in state administration."
 STP_pc_charter_shabrat_district_registers_delta:0 "Consolidating District Registers"
 STP_pc_charter_shabrat_resistance_memory:0 "Remembering the Resistance"
 STP_pc_charter_shabrat_resistance_memory_desc:0 "Victory must not dissolve into the private legends of commanders. A shared memory of resistance will bind districts to the country's history and responsibilities."
 STP_pc_charter_shabrat_district_grants:0 "National District Grants"
 STP_pc_charter_shabrat_district_grants_desc:0 "Unity is tested by whether resources reach distant districts. A grant programme will support local work from the common budget."
 STP_pc_charter_shabrat_tools_inventory:0 "An Inventory of Working Tools"
 STP_pc_charter_shabrat_tools_inventory_desc:0 "A new order is useless without working machines and tools. An equipment survey will direct technical assistance where it can produce results."
 STP_pc_charter_shabrat_national_service:0 "Serving the Common Country"
 STP_pc_charter_shabrat_national_service_desc:0 "Public office means serving the country rather than a patron. Common requirements for officials will strengthen the execution of decisions locally."
 STP_pc_charter_shabrat_citizens_protection:0 "Protecting Citizens"
 STP_pc_charter_shabrat_citizens_protection_desc:0 "A passport must mean real protection as well as an obligation to pay. The cabinet will establish a common response to threats against citizens' lives and property."
 STP_pc_charter_shabrat_citizens_protection_delta:0 "Protecting Citizens"
 STP_pc_charter_shabrat_national_schools:0 "Schools of the Common Country"
 STP_pc_charter_shabrat_national_schools_desc:0 "Children from different districts will live in the same state. A common educational foundation will give them a language for cooperation and an understanding of its history."
 STP_pc_charter_shabrat_national_compact:0 "A Commitment to the Country"
 STP_pc_charter_shabrat_national_compact_desc:0 "The state can expect loyalty only by meeting its own obligations. Citizenship arrangements will unite protection, service and equal treatment in a lasting rule."
 STP_pc_charter_shabrat_national_compact_delta:0 "A Commitment to the Country"
 STP_pc_charter_shabrat_district_workshops:0 "A Workshop for the District"
 STP_pc_charter_shabrat_district_workshops_desc:0 "Districts must participate in recovery through their own production. The state will support a civilian workshop connected to local needs."
 STP_pc_charter_shabrat_common_standards:0 "Common Industrial Standards"
 STP_pc_charter_shabrat_common_standards_desc:0 "Parts made in the same country should fit together. Common standards will reduce downtime and make deliveries between districts more reliable."
 STP_pc_charter_shabrat_common_standards_delta:0 "Common Industrial Standards"
 STP_pc_charter_shabrat_national_defence:0 "Defending the National Home"
 STP_pc_charter_shabrat_national_defence_desc:0 "Military strength has meaning when it stands behind a protected country. Common defence training will bring formations under a unified order of service."
 STP_pc_charter_shabrat_officer_oath:0 "An Oath to the State"
 STP_pc_charter_shabrat_officer_oath_desc:0 "An officer swears an oath to the country rather than a personal circle. Reviewing duties and conducting practical exercises will reinforce that distinction."
 STP_pc_charter_shabrat_citizenship_duty:0 "The Limits of National Duty"
 STP_pc_charter_shabrat_citizenship_duty_desc:0 "Common citizenship entails duties but grants no official unlimited power. Shabrat must decide where necessary discipline ends and arbitrary rule begins."
 STP_pc_charter_shabrat_citizenship_duty_delta:0 "The Limits of National Duty"
 STP_pc_charter_shabrat_national_arsenal:0 "A National Arsenal"
 STP_pc_charter_shabrat_national_arsenal_desc:0 "Defending the country requires domestic arms production. A new arsenal will join the existing supply system rather than become a commander's private possession."
 STP_pc_charter_shabrat_economic_sovereignty:0 "Economic Self-Reliance"
 STP_pc_charter_shabrat_economic_sovereignty_desc:0 "Self-reliance begins with working enterprises and achievable orders. The cabinet will secure production links able to withstand interruptions in outside supplies."
 STP_pc_charter_shabrat_economic_sovereignty_delta:0 "Economic Self-Reliance"
 STP_pc_charter_shabrat_district_reserves:0 "District Reserves"
 STP_pc_charter_shabrat_district_reserves_desc:0 "Trained people must know their place in national defence. A common reserve training procedure will reduce confusion when formations receive replacements."
 STP_pc_charter_shabrat_district_reserves_delta:0 "District Reserves"
 STP_pc_charter_shabrat_border_drills:0 "Testing Border Readiness"
 STP_pc_charter_shabrat_border_drills_desc:0 "The border needs coordinated action rather than loud declarations. Exercises will practise communication between local garrisons and field formations."
 STP_pc_charter_shabrat_protected_communities:0 "Resilient Civilian Communities"
 STP_pc_charter_shabrat_protected_communities_desc:0 "Behind the army stand the homes it is responsible for protecting. Work with local institutions will help restore order after emergencies."
 STP_pc_charter_shabrat_protected_communities_delta:0 "Resilient Civilian Communities"
 STP_pc_charter_shabrat_district_exchange:0 "Linking District Economies"
 STP_pc_charter_shabrat_district_exchange_desc:0 "Each district has tasks a neighbour performs better. Coordinated deliveries will turn local capabilities into shared industrial strength."
 STP_pc_charter_shabrat_district_exchange_delta:0 "Linking District Economies"
 STP_pc_charter_shabrat_defence_stores:0 "Stores for Defence"
 STP_pc_charter_shabrat_defence_stores_desc:0 "Appeals for resolve cannot replace engineering equipment and communications. Prepared stores will help formations keep their defences in working order."
 STP_pc_charter_shabrat_cabinet_review:0 "Bringing District Results Together"
 STP_pc_charter_shabrat_cabinet_review_desc:0 "Citizenship, production and defence must strengthen the same country. The cabinet will consolidate district results and close gaps between departments."
 STP_pc_charter_shabrat_cabinet_review_delta:0 "Bringing District Results Together"
 STP_pc_charter_shabrat_charter_fulfilled:0 "A Strong Country Under the Charter"
 STP_pc_charter_shabrat_charter_fulfilled_desc:0 "Shabrat will bind national strength to the state's duties towards citizens. Completing the programme will secure unity within the common constitutional order."
 STP_pc_charter_tikhoreva_mandate:0 "A Mandate for Measurable Results"
 STP_pc_charter_tikhoreva_mandate_desc:0 "Tikhoreva proposes judging the cabinet by completed work. Records will help correct decisions rather than justify any price through a useful outcome."
 STP_pc_charter_tikhoreva_mandate_delta:0 "A Mandate for Measurable Results"
 STP_pc_charter_tikhoreva_public_registers:0 "Open Public Registers"
 STP_pc_charter_tikhoreva_public_registers_desc:0 "A decision cannot be checked when only its executor can see its basis. Common registers will give institutions and citizens the same starting picture."
 STP_pc_charter_tikhoreva_public_registers_delta:0 "Open Public Registers"
 STP_pc_charter_tikhoreva_appointments_by_work:0 "Appointments by Work"
 STP_pc_charter_tikhoreva_appointments_by_work_desc:0 "An appointment should reflect the ability to perform its tasks. Verifiable requirements will help select officials without endless exchanges of personal recommendations."
 STP_pc_charter_tikhoreva_appointments_by_work_delta:0 "Appointments by Work"
 STP_pc_charter_tikhoreva_service_baselines:0 "Establishing Service Baselines"
 STP_pc_charter_tikhoreva_service_baselines_desc:0 "Before promising improvement, the government must know what residents receive today. The cabinet will establish baseline measures for essential public services."
 STP_pc_charter_tikhoreva_service_baselines_delta:0 "Establishing Service Baselines"
 STP_pc_charter_tikhoreva_limits_of_measurement:0 "Beyond the Indicator"
 STP_pc_charter_tikhoreva_limits_of_measurement_desc:0 "A convenient indicator can conceal an inconvenient human loss. Independent inspectors will be authorised to demand a complete repair of the pilot workshop before acceptance. This opens a faster, more expensive procedure alongside the ordinary staged inspection."
 STP_pc_charter_tikhoreva_independent_audit:0 "Audit Outside the Department"
 STP_pc_charter_tikhoreva_independent_audit_desc:0 "An institution cannot be the sole judge of its own work. This focus opens the previously selected expenditure audit: a public commission or professional reconciliation followed by full publication. The investigation requires its own funding and time."
 STP_pc_charter_tikhoreva_independent_audit_delta:0 "Audit Outside the Department"
 STP_pc_charter_tikhoreva_public_results:0 "Public Review of Results"
 STP_pc_charter_tikhoreva_public_results_desc:0 "Indicators are useful when they change practice. Following final acceptance of the workshop, the cabinet will examine the hospital that met its target at its patients' expense. The selected remedy must be funded and verified before the final report."
 STP_pc_charter_tikhoreva_public_results_delta:0 "Public Review of Results"
 STP_pc_charter_tikhoreva_published_accounts:0 "Publishing the Accounts"
 STP_pc_charter_tikhoreva_published_accounts_desc:0 "The common budget consists of resources unavailable for other needs. Publishing expenditure will make the cost of every decision open to scrutiny."
 STP_pc_charter_tikhoreva_published_accounts_delta:0 "Publishing the Accounts"
 STP_pc_charter_tikhoreva_accountable_service:0 "Accountable Public Service"
 STP_pc_charter_tikhoreva_accountable_service_desc:0 "Officials must understand both their task and the limits of their authority. Common accountability arrangements will preserve useful initiative and scrutiny of its consequences."
 STP_pc_charter_tikhoreva_reconstruction_balance:0 "Balancing Reconstruction"
 STP_pc_charter_tikhoreva_reconstruction_balance_desc:0 "A completed project must help the operating economy. Comparing costs with results will preserve arrangements that actually advance recovery."
 STP_pc_charter_tikhoreva_reconstruction_balance_delta:0 "Balancing Reconstruction"
 STP_pc_charter_tikhoreva_damage_survey:0 "Surveying the Damage"
 STP_pc_charter_tikhoreva_damage_survey_desc:0 "Reconstruction will begin with a survey of buildings and operating capacity. A map of needs will allow projects to be compared by their actual urgency."
 STP_pc_charter_tikhoreva_damage_survey_delta:0 "Surveying the Damage"
 STP_pc_charter_tikhoreva_repair_sequence:0 "Sequencing Repairs"
 STP_pc_charter_tikhoreva_repair_sequence_desc:0 "Not everything damaged can be repaired at once. The cabinet will prioritise work on which other services and production depend."
 STP_pc_charter_tikhoreva_repair_sequence_delta:0 "Sequencing Repairs"
 STP_pc_charter_tikhoreva_open_tenders:0 "Open Tenders"
 STP_pc_charter_tikhoreva_open_tenders_desc:0 "Orders should go to suppliers able to deliver at the published price. Transparent tenders will give the cabinet a continuing means of procuring needed equipment."
 STP_pc_charter_tikhoreva_standard_designs:0 "Tested Standard Designs"
 STP_pc_charter_tikhoreva_standard_designs_desc:0 "A recurring task does not need a fresh design from nothing. Tested plans will help builders save time without abandoning quality control."
 STP_pc_charter_tikhoreva_standard_designs_delta:0 "Tested Standard Designs"
 STP_pc_charter_tikhoreva_pilot_workshop:0 "A Pilot Workshop"
 STP_pc_charter_tikhoreva_pilot_workshop_desc:0 "A procedure must work before it is expanded. This focus opens a paid pilot through the chosen procurement method: an open contract or a standard design. Final acceptance must establish that the workshop operates; a construction report alone grants no factory."
 STP_pc_charter_tikhoreva_maintenance_schedule:0 "Scheduled Maintenance"
 STP_pc_charter_tikhoreva_maintenance_schedule_desc:0 "Emergency repairs cost more than timely maintenance. A common schedule will let enterprises sustain output without constantly wearing out their equipment."
 STP_pc_charter_tikhoreva_maintenance_schedule_delta:0 "Scheduled Maintenance"
 STP_pc_charter_tikhoreva_applied_research:0 "Research for Practice"
 STP_pc_charter_tikhoreva_applied_research_desc:0 "Researchers need questions that can be tested in practice. The cabinet will connect applied research to the needs of operating workshops and services."
 STP_pc_charter_tikhoreva_applied_research_delta:0 "Research for Practice"
 STP_pc_charter_tikhoreva_laboratory_records:0 "Open Laboratory Records"
 STP_pc_charter_tikhoreva_laboratory_records_desc:0 "A failed experiment also contains useful information. A common recording procedure will prevent researchers from repeating mistakes already tested."
 STP_pc_charter_tikhoreva_technical_instructors:0 "Technical Instructors"
 STP_pc_charter_tikhoreva_technical_instructors_desc:0 "A useful discovery must reach the person at the machine. Technical instructors will translate laboratory results into practical working methods."
 STP_pc_charter_tikhoreva_technical_instructors_delta:0 "Technical Instructors"
 STP_pc_charter_tikhoreva_field_trials:0 "Field Trials"
 STP_pc_charter_tikhoreva_field_trials_desc:0 "Equipment should be tested where it will be used. Field trials will compare technical specifications with formations' actual requirements."
 STP_pc_charter_tikhoreva_tested_arsenal:0 "An Arsenal of Tested Designs"
 STP_pc_charter_tikhoreva_tested_arsenal_desc:0 "Supply benefits from stable designs and clear requirements. This focus opens paid expansion into a series-production arsenal, requiring an operating pilot, corrected procedures and knowledge transferred to its users."
 STP_pc_charter_tikhoreva_measured_training:0 "Training With Feedback"
 STP_pc_charter_tikhoreva_measured_training_desc:0 "Exercises should expose weaknesses rather than confirm a prepared report. Their results will help commanders improve replacement training."
 STP_pc_charter_tikhoreva_measured_training_delta:0 "Training With Feedback"
 STP_pc_charter_tikhoreva_research_in_service:0 "Knowledge in Public Service"
 STP_pc_charter_tikhoreva_research_in_service_desc:0 "A practical result does not end with producing a new design. The cabinet will secure the transfer of knowledge to those maintaining equipment and responsible for its use."
 STP_pc_charter_tikhoreva_research_in_service_delta:0 "Knowledge in Public Service"
 STP_pc_charter_tikhoreva_cabinet_review:0 "A Comprehensive Programme Review"
 STP_pc_charter_tikhoreva_cabinet_review_desc:0 "Administration, recovery and research must be judged by the same honest measure. The cabinet will examine where achieved results justify the resources spent."
 STP_pc_charter_tikhoreva_cabinet_review_delta:0 "A Comprehensive Programme Review"
 STP_pc_charter_tikhoreva_charter_fulfilled:0 "A Useful State Under the Charter"
 STP_pc_charter_tikhoreva_charter_fulfilled_desc:0 "Tikhoreva will submit the programme's results together with its unfinished obligations. Demonstrated work can establish the cabinet's legacy. If inspections remain incomplete, a provisional report preserves the opportunity to finish them under the Charter."
 STP_pc_charter_sotnikov_available_tt:0 "Grigory Sotnikov leads the Charter government."
 STP_pc_charter_shabrat_available_tt:0 "Maksim Shabrat leads the Charter government."
 STP_pc_charter_tikhoreva_available_tt:0 "Vera Tikhoreva leads the Charter government."
 STP_pc_charter_tikhoreva_project_idle_tt:0 "No paid cabinet operation or acceptance report is awaiting settlement."
 STP_pc_charter_tikhoreva_audit_completed_tt:0 "The expenditure audit is complete and its evidenced findings have been published."
 STP_pc_charter_tikhoreva_pilot_operational_tt:0 "The accepted pilot workshop has a civilian factory and remains owned and controlled by us."
 STP_pc_charter_tikhoreva_norms_corrected_tt:0 "The revised rules have passed inspection and the identified harm has been corrected."
 STP_pc_charter_tikhoreva_site_current_tt:0 "The selected site remains owned and controlled by us and has a free factory slot."
 STP_pc_charter_tikhoreva_refund_tt:0 "Cancel the unfinished operation and return all reserved treasury funds, political power and support equipment. An unfinished site receives no factory."
 STP_pc_charter_tikhoreva_acceptance_closed_tt:0 "Close the open workshop acceptance window."
 STP_pc_charter_tikhoreva_final_review_closed_tt:0 "Close the open final report window."
 STP_pc_charter_tikhoreva_final_review_tt:0 "The report can establish a legacy supported by completed work. Unfinished programmes remain available after a provisional report."
 STP_pc_charter_tikhoreva_provisional_report_tt:0 "A provisional report preserves current institutions and paid obligations. Complete the expenditure audit, workshop acceptance and service correction to submit it again. No completed legacy is awarded yet."
 STP_pc_charter_tikhoreva_public_audit:0 "Audit the Accounts in Public"
 STP_pc_charter_tikhoreva_public_audit_desc:0 "The public commission will compare testimony, invoices and actual deliveries. Cost: §Y40§! £political_power_texticon; duration: §Y28 days§!. Its published findings explain the disputed expense and permit a paid pilot. Cancellation returns the reserved cost."
 STP_pc_charter_tikhoreva_public_audit_result_tt:0 "After §Y28 days§!, publish the evidenced findings and permit a paid pilot. Gain Accounts People Trust for §Y180 days§!. Cancellation returns the reserved cost."
 STP_pc_charter_tikhoreva_professional_audit:0 "Complete a Professional Audit"
 STP_pc_charter_tikhoreva_professional_audit_desc:0 "Specialists will reconcile the accounts without prematurely accusing the contractors. Full findings will be published after the audit. Cost: §Y300§! £ADISCORD_economy_treasury_texticon; duration: §Y42 days§!. New pilot contracts remain blocked until completion. Cancellation returns the reserved cost."
 STP_pc_charter_tikhoreva_professional_audit_result_tt:0 "After §Y42 days§!, publish the evidenced findings and permit a paid pilot. Gain Accounts People Trust for §Y180 days§!. Cancellation returns the reserved cost."
 STP_pc_charter_tikhoreva_contract_pilot:0 "Commission a Pilot Workshop"
 STP_pc_charter_tikhoreva_contract_pilot_desc:0 "An open contract will adapt the workshop to its selected site. Construction costs §Y900§! £ADISCORD_economy_treasury_texticon and takes §Y42 days§!. A controlled owned state with a free slot is selected. Acceptance then requires comprehensive remedial work for §Y180§! £ADISCORD_economy_treasury_texticon over 28 days, or staged work for §Y120§! £ADISCORD_economy_treasury_texticon over 42 days. Only final acceptance grants one civilian factory. Cancellation returns the full deposit."
 STP_pc_charter_tikhoreva_contract_pilot_result_tt:0 "Reserve §Y900§! £ADISCORD_economy_treasury_texticon. Acceptance begins after §Y42 days§!. No factory is granted while the defect remains, and the full construction deposit stays reserved until final acceptance."
 STP_pc_charter_tikhoreva_standard_pilot:0 "Build a Standard Pilot Workshop"
 STP_pc_charter_tikhoreva_standard_pilot_desc:0 "A tested design costs less but takes longer to prepare. Construction costs §Y720§! £ADISCORD_economy_treasury_texticon and takes §Y56 days§!. A controlled owned state with a free slot is selected. Acceptance then requires comprehensive remedial work for §Y180§! £ADISCORD_economy_treasury_texticon over 28 days, or staged work for §Y120§! £ADISCORD_economy_treasury_texticon over 42 days. Only final acceptance grants one civilian factory. Cancellation returns the full deposit."
 STP_pc_charter_tikhoreva_standard_pilot_result_tt:0 "Reserve §Y720§! £ADISCORD_economy_treasury_texticon. Acceptance begins after §Y56 days§!. No factory is granted while the defect remains, and the full construction deposit stays reserved until final acceptance."
 STP_pc_charter_tikhoreva_complete_acceptance:0 "Complete Comprehensive Acceptance"
 STP_pc_charter_tikhoreva_complete_acceptance_desc:0 "The independent inspectors authorised by Beyond the Indicator supervise concentrated remedial work and a final inspection. Additional cost: §Y180§! £ADISCORD_economy_treasury_texticon; duration: §Y28 days§!. Gain §G1§! civilian factory on the same site. If the site is lost or its free slot occupied, the original construction deposit and additional payment are returned."
 STP_pc_charter_tikhoreva_complete_acceptance_result_tt:0 "After §Y28 days§!, the corrected workshop receives §G1§! civilian factory on its selected site. Cancellation returns the original deposit and the additional §Y180§! £ADISCORD_economy_treasury_texticon."
 STP_pc_charter_tikhoreva_staged_acceptance:0 "Complete the Workshop in Stages"
 STP_pc_charter_tikhoreva_staged_acceptance_desc:0 "Working components are accepted separately while local teams finish the remainder. Additional cost: §Y120§! £ADISCORD_economy_treasury_texticon; duration: §Y42 days§!. Partial acceptance grants no factory. Final inspection grants §G1§! civilian factory on the same site. Cancellation returns the complete deposit and additional payment."
 STP_pc_charter_tikhoreva_staged_acceptance_result_tt:0 "After §Y42 days§!, final acceptance grants §G1§! civilian factory. No production reward is granted beforehand. Cancellation returns the original deposit and the additional §Y120§! £ADISCORD_economy_treasury_texticon."
 STP_pc_charter_tikhoreva_reopen_norm_review:0 "Review the Service Standard Case"
 STP_pc_charter_tikhoreva_reopen_norm_review_desc:0 "With the pilot workshop operating, the cabinet can examine why a hospital met its target at its patients' expense. Open the hearing now; payment follows when a specific corrective programme is chosen. If an earlier hearing closed after the workshop was lost, it can be convened again when control is restored."
 STP_pc_charter_tikhoreva_revise_norm:0 "Revise the Service Standard"
 STP_pc_charter_tikhoreva_revise_norm_desc:0 "The commission will include difficult cases and remote calls in funding rules and retrain officials. Cost: §Y30§! £political_power_texticon; duration: §Y35 days§!. An implementation check corrects the identified harm and grants §G+2%§! stability. Cancellation returns the reserved cost."
 STP_pc_charter_tikhoreva_revise_norm_result_tt:0 "After §Y35 days§!, practical verification grants §G+2%§! stability, ends Hard Norms and permits recognition of the cabinet's legacy. Cancellation returns the reserved cost."
 STP_pc_charter_tikhoreva_verify_norm:0 "Verify the Quality of Service"
 STP_pc_charter_tikhoreva_verify_norm_desc:0 "The common target remains, but funding must account for difficult cases and remote calls. Paid inspectors will verify these requirements. Cost: §Y300§! £ADISCORD_economy_treasury_texticon; duration: §Y28 days§!. Completion ends Hard Norms and grants §G+2%§! stability. Cancellation returns the reserved cost."
 STP_pc_charter_tikhoreva_verify_norm_result_tt:0 "After §Y28 days§!, quality checks confirm the correction: §G+2%§! stability, removal of Hard Norms and eligibility for the cabinet's legacy. Cancellation returns the reserved cost."
 STP_pc_charter_tikhoreva_replicate_pilot:0 "Expand the Verified Production Method"
 STP_pc_charter_tikhoreva_replicate_pilot_desc:0 "An operating pilot and corrected procedures permit a series-production arsenal. Requires Knowledge in Public Service. Cost: §Y450§! £ADISCORD_economy_treasury_texticon and §Y100§! £support_equipment_texticon; duration: §Y42 days§!. Gain §G1§! military factory in a selected controlled owned state with a free slot. Losing the pilot or site cancels the order and refunds the full deposit."
 STP_pc_charter_tikhoreva_replicate_pilot_result_tt:0 "After §Y42 days§!, gain §G1§! military factory at the selected site. Successful expansion enables the State of Useful Works legacy. Cancellation returns §Y450§! £ADISCORD_economy_treasury_texticon and §Y100§! £support_equipment_texticon."
 STP_pc_charter_tikhoreva_abandon_pilot:0 "Close the Unfinished Pilot"
 STP_pc_charter_tikhoreva_abandon_pilot_desc:0 "Withdraw before final acceptance. Recover the entire construction deposit: §Y[?STP_pc_charter_tikhoreva_deposit_treasury|0]§! £ADISCORD_economy_treasury_texticon. No factory is created. A new pilot can be commissioned at its full price when the requirements are met."
 STP_pc_charter_tikhoreva_ratify_programme:0 "Submit the Completed Report"
 STP_pc_charter_tikhoreva_ratify_programme_desc:0 "Following its provisional report, the cabinet has completed the expenditure audit, workshop acceptance and correction of service standards. The Open Ledger legacy is now available; completed expansion also permits a State of Useful Works. Submitting the report again requires no additional payment."
