 STP_pw_party_high_houses_government: "Government of the High Houses"
 STP_pw_party_high_houses_government_desc: "The Conservative majority consolidates appointments and the postwar administration under the High Houses."
 STP_pw_party_unbound_government: "Government of the Continuing Revolution"
 STP_pw_party_unbound_government_desc: "The Radical majority opens new markets and defends its social program as an independent center of the hedonist movement."
 STP_pw_party_constitution_protectorate_status: "Stelander has accepted northern protection and remains a puppet of Nodrul."
 STP_pw_party_constitution_conservative_status:0 "The congress entrusted its mandate to the Conservative Presidium, backed by the High Houses and the defence of property."
 STP_pw_party_constitution_radical_status:0 "The congress elected Rufus Hedersett. The radicals demand a continuing revolution and the emancipation of labour."
 STP_pw_party_constitution_open_status: "The final postwar political course has not yet been settled."
 STP_pw_party_northern_patron_lost: "Northern protection has ended"
 ADISCORD_STP_pc.47.t: "A New Homeland for the Revolution"
 ADISCORD_STP_pc.47.d: "At a ceremonial session of the presidium, Stelander has been proclaimed the new homeland of the revolution. A new banner has been raised over government buildings: a white sun in a golden laurel wreath on a blue field with a burgundy diagonal. The party leadership declared that its victory in the civil war gives it the right to decide the movement's future on its own.\n\nThe northern tradition keeps its place in official history, but its former mentors are no longer treated as unquestionable authorities. Governments dependent on Stelander have been instructed to fly the republic's older, simpler banner.\n\nThe party itself is not united. Conservatives want to lock in order and the privileges of the influential houses; radicals insist that the social revolution must go on."
 ADISCORD_STP_pc.47.stelander: "The movement's centre is here now."
 ADISCORD_STP_pc.47.foreign: "The revolution has a new centre."
 ADISCORD_STP_pc.52.t: "Great Stelander Proclaimed"
 ADISCORD_STP_pc.52.d: "The Party presidium has announced the creation of Great Stelander. Nodrul, Yubor, the Frontier, the Forest and Ainholm keep their own governments, but their armies, foreign treaties and economic plans must now be agreed with the centre. Kefreyt's border provinces have been incorporated into the metropole.\n\nAt a ceremonial session the Party leadership declared that the era of a fragmented coast is over. Great Stelander's neighbours now border a single state instead of half a dozen feuding governments."
 ADISCORD_STP_pc.52.stelander: "The north is ours."
 ADISCORD_STP_pc.52.subject: "Decisions are made in Stelander now."
 ADISCORD_STP_pc.52.foreign: "A new power has risen on the coast."
