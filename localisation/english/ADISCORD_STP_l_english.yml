 ADISCORD_STP_cw.94.t: "Hedersett Usurps Power"
 ADISCORD_STP_cw.94.d: "The order reached the ministries before the presidium had time to discuss it. Citing the country's armed split, Rufus Hedersett concentrated leadership of the Party government in his own hands. Orders to the troops, appointments and supply decisions must now pass through his office. Elections have been postponed indefinitely.\n\nAt the meeting, the secretary read out the document as already in force. Those who objected were invited to submit their comments in writing; their signatures were not required. By evening, district chancelleries had received new order templates and a demand to confirm their obedience.\n\nOfficial radio called it a temporary measure to preserve the state. Hedersett's opponents called it usurpation. As fronts formed beyond the capital, the Party apparatus received a single master."
 ADISCORD_STP_cw.94.a: "The orders have already been sent."
 ADISCORD_STP_cw.96.t: "No Turning Back"
 ADISCORD_STP_cw.96.d: "The headquarters fell silent when the radio operator laid the first reports on the table. Several garrisons had confirmed they were joining them. Others remained silent. The capital was broadcasting an order to lay down their arms.\n\nAn officer unfolded the map and reached for a pencil. Shabrat stopped him:\n- Contact the districts first. I need confirmations, not our assumptions.\n\nOutside the door, men were arguing about trucks. One column was short of fuel; another was waiting for men who had still been working in the mines yesterday. Shabrat signed an order to release the headquarters vehicles and handed the papers back to the radio operator.\n\nThe preparations were over. From now on, every order would carry a cost in lives."
 ADISCORD_STP_cw.96.a: "All on the line."
