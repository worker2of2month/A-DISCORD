 STP_pf_formula_tt: "Apparatus loyalty = sum of (influence × support) / 100.\nStrengthening a satisfied group reinforces the apparatus; strengthening a dissatisfied one weakens it.\nGeneral loyalty rewards change every faction's support by the stated number of points, within 0-100.\nThe threshold of 70 slows underground preparations; below 25, they accelerate. Once the war begins, political and economic consequences remain, but the preparatory underground no longer operates."
