 STP_ps_nod_rifle_purchase_desc: "Cost: §Y1500§! £ADISCORD_economy_treasury_texticon units. Duration: 14 days. If its conditions no longer hold, the unfinished deposit is refunded."
 STP_ps_nod_rifle_purchase_work_desc: "§Y1500§! £ADISCORD_economy_treasury_texticon units reserved. The result is delivered only if the programme's conditions still hold; cancellation refunds the deposit once."
 STP_ps_exile_offer_title: "A Request from the Surviving Leadership"
 STP_ps_exile_offer_desc: "The Party's army has been defeated. Its surviving organisers request asylum. Acceptance neither takes control of Nodrul away from you nor changes its leader. You may receive the organisation without promising a war to restore it."
 STP_ps_exile_refuse: "Close the representation."
 STP_ps_exile_accept: "Grant asylum."
 STP_ps_exile_arrived_title: "Representation in Exile"
 STP_ps_exile_arrived_desc: "The war for Stelander has been lost. Shabrat controls the country, and the surviving Party organisation begins its work in Nodrul. Only funds evacuated in advance have been preserved. The host country's army, treasury and government remain its own. Returning will require a separate political agreement and a real military victory."
 STP_ps_exile_arrived_ok: "Begin the representation's work."
 STP_ps_return_title: "The Restored Government"
 STP_ps_return_desc: "Nodrul has won the campaign of return. Stelander has been restored as a subject state on its core territories. Surviving leaders may return; the dead remain dead. Old wartime orders do not resume."
 STP_ps_remain_nod: "Continue as Nodrul."
 STP_ps_control_stp: "Lead the restored Stelander."
 STP_ps_return_terms_tt: "Returning will restore Stelander as a subject state of Nodrul. Military victory is required; paying for preparation is no substitute."
 STP_ps_evacuate_funds_cost: "§Y3000§! £ADISCORD_economy_treasury_texticon"
 STP_ps_evacuate_funds_cost_blocked: "§R3000§! £ADISCORD_economy_treasury_texticon"
 STP_ps_evacuate_funds_cost_tooltip: "§Y3000§! £ADISCORD_economy_treasury_texticon"
 STP_ps_evacuate_funds: "Evacuate the Organisation's Reserve"
 STP_ps_evacuate_funds_desc: "Deducts 3000 treasury units once and places them in an evacuation reserve. If exile is accepted, Nodrul receives the funds; if the Party wins, the reserve is returned. Refusal of asylum means the evacuated funds are lost."
 STP_ps_accept_return_terms: "Accept the Terms of Return"
 STP_ps_accept_return_terms_desc: "Confirms Nodrul's approval of the Party return plan. Stelander will be restored as a subject of Nodrul only after a successful military campaign."
 STP_ps_launch_return: "Launch the Campaign of Return"
 STP_ps_launch_return_desc: "After the terms are accepted, launches the prepared return campaign against Shabrat. Victory restores Stelander as a subject of Nodrul."
 STP_ps_exile_training_cost: "§Y1800§! £ADISCORD_economy_treasury_texticon"
 STP_ps_exile_training_cost_blocked: "§R1800§! £ADISCORD_economy_treasury_texticon"
 STP_ps_exile_training_cost_tooltip: "§Y1800§! £ADISCORD_economy_treasury_texticon"
 STP_ps_exile_training: "Prepare the Return Headquarters"
 STP_ps_exile_training_work: "Preparing the Return Headquarters"
 STP_ps_exile_training_desc: "1800 treasury units and 28 days. Headquarters gains 15 Army Experience and prepares the political and military plan for returning. Formations are ordered separately, with their full personnel and equipment reserved."
 STP_ps_exile_training_work_desc: "1800 treasury units reserved. The result is delivered only if the programme's conditions still hold; cancellation refunds the deposit once."
 STP_ps_radio_network: "Government Communications Network"
 STP_ps_radio_network_desc: "Under the old system, almost every urgent order passed through a handful of capital hubs. Lose one station or one duty officer, and districts began waiting for confirmation that might never arrive. The Party will distribute transmitters, call-sign tables and copies of ciphers across independent communication posts.\n\nThis is not another radio station for speeches. It is a network in which capturing one office no longer means silence for the entire state."
 STP_ps_reserve_hq: "Reserve Headquarters"
 STP_ps_reserve_hq_desc: "For too long, the Bronze Congress has simultaneously been a symbol of power, an archive and the place from which the army expected its orders. A reserve headquarters will receive copies of maps, mobilisation lists, seals and communication channels in a separate protected building outside the government quarter.\n\nIf the capital comes under attack, the state will need not a monument to continuity, but a second desk whose occupants already know what to do.\n\nHeadquarters will rehearse reserve deployment in advance."
 STP_ps_evacuation_plan: "Medical Service"
 STP_ps_evacuation_plan_desc: "The reserve headquarters needs a service capable of returning wounded soldiers to duty. We will assign medical teams to formations and organise casualty triage and dressing stations. The trained personnel will remain with the Party army after the split."
 STP_ps_northern_partner: "The Northern Ally"
 STP_ps_northern_partner_desc: "Nodrul is fighting its own war. We will offer assistance and establish permanent links between departments. We will raise the question of asylum when the reserve headquarters prepares an evacuation."
 STP_ps_northern_credit: "A Loan to the War Ministry"
 STP_ps_northern_credit_desc: "The loan is paid from our treasury and enters Nodrul's budget. Supporting our ally competes with rebuilding our own army."
 STP_ps_northern_arms: "Weapons for the Northern Front"
 STP_ps_northern_arms_desc: "The northern front needs rifles, artillery and logistics equipment."
 STP_ps_northern_engineers: "Engineering Mission"
 STP_ps_northern_engineers_desc: "Engineers will prepare for temporary service on the active northern front and train domestic logistics services."
 STP_ps_joint_staff: "Joint Headquarters"
 STP_ps_joint_staff_desc: "For the first time, Nodrulian officers and the Party staff will sit at one table not as advisers and wards, but as two armies that may need the same road. Common fuel requests, train routes and communication tables will be agreed in advance.\n\nNodrul will retain its own command. The Party will retain its own. Only what must function on the day good intentions cease to be enough for either side will be shared."
 STP_ps_expedition_logistics: "Support the Redeployment"
 STP_ps_expedition_logistics_desc: "We will prepare a supply reserve and routes for Nodrul's entry into the war."
 STP_ps_asylum_protocol: "Lessons of the Northern War"
 STP_ps_asylum_protocol_desc: "Reports from the northern front show how quickly established plans collapse when communications fail and conditions change. The joint staff will turn this experience into a course for Party commanders: assigning objectives, preparing reserves and coordinating neighbouring formations. Our army will need these skills before its first retreat."
 STP_ps_foreign_supply_desk: "Foreign Supply Bureau"
 STP_ps_foreign_supply_desk_desc: "We will organise intelligence on Kefreyt's shipments, interception and pressure on suppliers. The bureau will work to seize cargo and delay supplies."
 STP_ps_ammunition_board: "Ammunition Reserve"
 STP_ps_ammunition_board_desc: "We will arrange a mixed ordnance order for the army depots."
 STP_ps_operational_reserve: "Operational Reserve"
 STP_ps_operational_reserve_desc: "We will make the army the foundation of the counterattack and prepare an operational reserve. The army faction will gain influence."
 STP_ps_route_security: "Route Security"
 STP_ps_route_security_desc: "We will prioritise the security of Congress and the Niansas communications route. The security service will gain influence."
 STP_ps_temporary_presidium: "Provisional Presidium"
 STP_ps_temporary_presidium_desc: "Losing the Congress requires a government empowered to authorise military expenditure. We will approve a provisional presidium."
 STP_ps_restore_couriers: "Restore District Communications"
 STP_ps_restore_couriers_desc: "After the Bronze Congress fell, some telephone lines disappeared along with their offices; others became more dangerous than silence. District couriers will receive routes, reserve seals and authority to answer to the functioning provisional government."
 STP_ps_counter_supply: "Block Kefreyt's Supply Channels"
 STP_ps_counter_supply_desc: "Headquarters will gather intelligence on Kefreyt's armed forces and examine its planned shipment to the resistance. Reconnaissance will prepare the way for cargo interception or pressure on suppliers."
 STP_ps_retake_congress: "The Government Returns"
 STP_ps_retake_congress_desc: "The army must retake the Bronze Congress quarter. After the building is recovered, we will bring the departments together there, check the archives and confirm the district administrations' authority."
 STP_ps_permanent_security: "Permanent Security Service"
 STP_ps_permanent_security_desc: "The centre must maintain a permanent apparatus and pay for its work. Reorganisation establishes a centralised model of government."
 STP_ps_presidium_authority: "The Presidium's Authority"
 STP_ps_presidium_authority_desc: "The presidium's authority consolidates the reorganisation. District concessions are reviewed upon completion; the emergency apparatus becomes a permanent expense."
 STP_ps_district_fund: "District Reconstruction Fund"
 STP_ps_district_fund_desc: "The districts will receive their own construction programme."
 STP_ps_cells_agreement: "Agreement between the Cells"
 STP_ps_cells_agreement_desc: "District participation is secured in a permanent agreement. Instead of a single security apparatus, the organisation adopts decentralised administration and local obligations."
 STP_ps_exile_office: "Representation in Exile"
 STP_ps_exile_office_desc: "The organisation retains its independent political work, but operates under Nodrul's laws."
 STP_ps_exile_survivors: "Gather the Survivors"
 STP_ps_exile_survivors_desc: "We will assemble active organisers and restore records of the survivors. Nodrule will receive their military experience and collected material."
 STP_ps_host_agreement: "An Agreement with Our Hosts"
 STP_ps_host_agreement_desc: "Nodrul retains its army, head of state and foreign policy. Exile formations require its resources and separate payment."
 STP_ps_exile_formations: "Exile Formations"
 STP_ps_exile_formations_desc: "We will prepare the cadres of new units."
 STP_ps_return_terms: "The Price of Return"
 STP_ps_return_terms_desc: "A Party restored by Nodrul will depend on the military victor. These terms may be accepted, or the organisation may continue its work in exile."
 STP_ps_return_campaign_focus: "The Campaign of Return"
 STP_ps_return_campaign_focus_desc: "Political and military preparation allows a separate campaign to begin."
 STP_ps_northern_agreement_tt: "Nodrul will receive an offer to accept paid aid packages. War and asylum are agreed separately."
 STP_ps_central_result_tt: "Permanent model: stability +5%, +0.10 £political_power_texticon/day, administrative expenditure +8%. Emergency district concessions are revoked."
 STP_ps_district_result_tt: "Permanent model: construction speed +8%, administrative expenditure -5%, -0.05 £political_power_texticon/day. District concessions become part of the agreement."
 STP_ps_institution_payment_cost: "§Y2000§! £ADISCORD_economy_treasury_texticon"
 STP_ps_institution_payment_cost_blocked: "§R2000§! £ADISCORD_economy_treasury_texticon"
