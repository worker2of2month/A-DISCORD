 STP_cw_party_command_disruption: "Command Disruption"
 STP_cw_party_command_disruption_desc: "The outbreak of the split disrupted communications between Party headquarters. Commanders need time to restore reporting procedures and coordinate their plans."
 STP_cw_operation_tempo: "Exploit the Offensive"
 STP_cw_operation_tempo_desc: "Capturing the designated position allowed headquarters to coordinate its formations and prepare the next attack."
 STP_cw_operation_disorganization: "Conflicting Orders"
 STP_cw_operation_disorganization_desc: "The operation missed its deadline. Headquarters is revising the plans while formations restore their disrupted coordination."
 STP_cw_front_scouts: "Frontline Liaison Teams"
 STP_cw_front_scouts_desc: "We will link district groups to army headquarters. Intelligence on Party units will allow us to select an offensive sector before reserves arrive there."
 STP_cw_mobile_workshops: "Repairs behind the Advance"
 STP_cw_mobile_workshops_desc: "We will assemble gunsmiths and equipment in mobile workshops. Three batches of damaged rifles can return to service as funds become available. Workshop equipment will ship immediately, while arsenals move to longer shifts."
 STP_cw_frontline_relief: "Relief on the Front Line"
 STP_cw_frontline_relief_desc: "We will draw up a battalion rotation schedule and send replacements to active units. Exhausted formations must restore order rather than advance without pause."
 STP_cw_route_columns: "Supply Columns"
 STP_cw_route_columns_desc: "We will assign transport and a common movement schedule to forward depots. Supply must not stop after the first successful attack."
 STP_pc_val_renew_aid: "Renew the Wartime Agreements"
 STP_pc_val_renew_aid_desc: "Kefreyt helped us survive the civil war. We will propose replacing wartime obligations with a permanent supply and non-aggression agreement. Accounts already paid will be credited."
 STP_pc_val_border_compact: "Supply Agreement"
 STP_pc_val_border_compact_desc: "Kefreyt's volunteers did not assist us, but our factories and border districts need reliable trade. We will offer a paid agreement that preserves both countries' independence."
 STP_pc_val_ratify: "Ratify the Treaty with Kefreyt"
 STP_pc_val_ratify_desc: "We will incorporate the accepted terms into departmental procedures and coordinate industrial standards."
 STP_pc_nod_recognition: "Mutual Recognition"
 STP_pc_nod_recognition_desc: "We will renounce the subordination of our neighbour in exchange for recognition of the current government and a non-aggression pact. Nodrul will receive compensation for ending the dispute; it is entitled to reject the offer."
 STP_pc_nod_ratify: "Secure the Northern Border"
 STP_pc_nod_ratify_desc: "Following Nodrul's acceptance, we will agree on border-service procedures. Nodrul will retain an independent government."
 STP_pc_val_demand_offer_tt: "Kefreyt will receive a demand for political dependence. Refusal will unlock military preparations, but will not declare war."
 STP_pc_nod_demand_offer_tt: "Nodrul will receive a demand for political dependence. Acceptance makes Nodrul a Steland puppet that can later be annexed through the hegemony administration system. Refusal unlocks military preparations, but does not declare war."
 STP_pc_val_trade_offer_tt: "Kefreyt will receive an offer of a mutual treaty. Only after it accepts will we pay £ADISCORD_economy_treasury_texticon §Y1800§!, or §Y900§! if the wartime accounts have already been settled. Both countries will receive a non-aggression pact, §G+3%§! military factory output and §G-3%§! supply consumption. Kefreyt will remain independent."
 STP_pc_nod_border_offer_tt: "Nodrul will receive an offer of mutual recognition. After it accepts, we will pay £ADISCORD_economy_treasury_texticon §Y1350§!. Both countries will sign a non-aggression pact and reduce army expenditure by §G8%§!. Nodrul will remain independent."
 STP_pc_campaign_preparation_tt: "Unlocks paid supply preparation: £ADISCORD_economy_treasury_texticon §Y900§! and §Y35 days§!. The order to go to war will then remain available for §Y90 days§!. The enemy will receive a warning; the focus itself does not declare war."
 STP_pc_nod_confront_government_tt:0 "Nodrul has a functioning independent government"
 STP_pc_val_campaign_route_tt:0 "The political course authorising a campaign against Kefreyt remains in effect"
 STP_pc_val_campaign_route_ended_tt:0 "The political course authorising a campaign against Kefreyt is no longer in effect"
 STP_pc_val_campaign_deposit_tt:0 "Supply preparations against Kefreyt have already been paid for"
 STP_pc_val_confrontation_closed_tt:0 "Confrontation with Kefreyt is blocked by peace terms, government status, subjugation or a shared faction or a truce"
 STP_pc_val_terms_not_accepted_tt:0 "Kefreyt's peace terms have not been accepted"
 STP_pc_nod_campaign_route_tt:0 "The political course authorising a campaign against Nodrul remains in effect"
 STP_pc_nod_campaign_route_ended_tt:0 "The political course authorising a campaign against Nodrul is no longer in effect"
 STP_pc_nod_campaign_deposit_tt:0 "Supply preparations against Nodrul have already been paid for"
 STP_pc_nod_confrontation_closed_tt:0 "Confrontation with Nodrul is blocked by peace terms, government status, subjugation or a shared faction"
 STP_pc_nod_terms_not_accepted_tt:0 "Nodrul's peace terms have not been accepted"
 STP_pc_campaign_paid_tt: "Payment covers transport and the establishment of depots. Cancellation does not refund money already spent. After §Y35 days§!, readiness will allow the campaign to begin within §Y90 days§!."
 STP_pc_nod_refused_tt: "Nodrul rejected the offer"
 STP_pc_nod_terms_accepted: "Nodrul accepted the proposed terms"
 STP_pc_joint_workshops: "Shared Industrial Standards"
 STP_pc_offer_expired_desc: "The offer is no longer valid: relations between the countries have changed or a response has already been delivered. This document creates no new obligations."
 STP_pc_reject_terms: "Reject the terms."
 STP_pc_accept_compact: "Accept the mutual treaty."
 STP_pc_accept_client_terms: "Recognise Steland's political primacy."
 STP_pc_val_compact: "Kefreyt Supply Agreement"
 STP_pc_val_compact_desc: "The treaty establishes non-aggression and mutual supplies for industry and the army. Kefreyt remains independent."
 STP_pc_nod_compact: "Northern Border Agreement"
 STP_pc_nod_compact_desc: "Mutual recognition allows emergency expenditure on the northern border to be reduced without surrendering sovereignty."
 STP_pc_val_compact_settlement_tt: "Steland will pay for the treaty: 1800 from the treasury, or 900 if wartime accounts were previously settled. The funds will go to Kefreyt. The treaty grants both sides non-aggression, +3% military factory output and -3% supply consumption."
 STP_pc_nod_compact_settlement_tt: "Steland will pay Nodrul 1350 from the treasury. The treaty grants both sides non-aggression and -8% army expenditure; it creates no political dependence."
 ADISCORD_STP_pc.17.t: "Steland's Proposal"
 ADISCORD_STP_pc.17.compact: "Steland proposes a permanent supply and non-aggression agreement. Our departments will receive payment, while factories and army depots will gain agreed operating terms. If previous wartime accounts have already been settled, the new payment will be reduced.\n\nKefreyt's sovereignty is not affected. Refusal will leave the border without an agreement and allow Steland to proceed to military preparations."
 ADISCORD_STP_pc.17.demand: "A demand has arrived from Steland that we recognise its political primacy. We are offered the retention of our administration, but must coordinate foreign policy with our new neighbour.\n\nThis is not a settlement for earlier supplies. Acceptance means a dependent course; refusal may lead to preparations for an invasion."
 ADISCORD_STP_pc.18.t: "The Northern Border"
 ADISCORD_STP_pc.18.compact:0 "The northern delegation brought copies of the old mandate to the meeting. The Stelanders placed a new draft beside them, with those words gone. In place of protection, it offered mutual recognition, an end to the old dispute and a non-aggression pact. Compensation would allow both sides to write off some of the costs of the past and stop keeping their armies on permanent alert against one another.\n\nFor Nodrul, this meant acknowledging a simple fact its diplomats had avoided saying aloud for decades: the southern state was no longer a project for which the north bore a special responsibility. A signature could close an old era without another war."
 ADISCORD_STP_pc.18.demand: "Steland demands that Nodrul abandon the former mandate and recognise Steland\'s political primacy. Nodrul may keep its administration, but it will become a formal Steland client state and lose independent foreign policy.\\n\\nRefusal does not mean immediate war, but mobilisation along the border may follow."
 ADISCORD_STP_pc.20.t: "Preparations on the Border"
 ADISCORD_STP_pc.20.d: "After unsuccessful negotiations, Steland has begun funded transport operations towards the border. Headquarters links the movement of these columns to preparations for an offensive.\n\nWe have time to strengthen our defences. Deployment itself does not yet constitute a declaration of war; the neighbouring government has not issued its final order."
 ADISCORD_STP_pc.20.a: "Bring headquarters and the reserves to readiness."
 ADISCORD_STP_pc.21.t: "An Answer to the Proposal"
 ADISCORD_STP_pc.21.val_compact: "Kefreyt has accepted the supply and non-aggression agreement. The agreed payment has been transferred, and the industrial departments of both countries have begun their work. Kefreyt remains independent.\n\nThe government can now ratify the treaty through a separate focus and proceed to shared industrial standards."
 ADISCORD_STP_pc.21.val_client: "Kefreyt has agreed to recognise Steland's political primacy. Its administration remains in place, but its foreign-policy course is now tied to our government.\n\nRatification of the agreement is available. When the Imperial Union is created, Kefreyt will be able to join on the accepted terms."
 ADISCORD_STP_pc.21.val_refused:0 "Kefreyt returned the papers unsigned. The accompanying note contained no threats, only the familiar formula that the state would not accept obligations whose price was set by another party. A few hours later, Kefreyt's border units received orders to raise their readiness.\n\nIn Fada, the refusal was not declared grounds for war. Military headquarters simply opened the previously sealed maps of the mountain passes. The next stage of the dispute would now depend on whether the government chose to turn a diplomatic failure into a prepared campaign."
 ADISCORD_STP_pc.21.nod_compact:0 "Nodrul has agreed to bring the old mandate to an end through a treaty of mutual recognition. Both treasury services confirmed the compensation settlement, and the military received orders to cease emergency planning against one another. On paper, for the first time in a generation, the northern border was no longer a border between a protector and a dependent state.\n\nNeither side gained the right to call this a victory for the other. Perhaps that was precisely what made the agreement possible."
 ADISCORD_STP_pc.21.nod_client: "Nodrul has accepted Steland\'s political primacy and entered formal dependency as our puppet. Its administration remains in place, but foreign policy now answers to Steland.\\n\\nThe later hegemony administration programme can integrate Nodrul completely through a separate annexation decision."
 ADISCORD_STP_pc.21.nod_refused:0 "Nodrul refused to sign the proposed terms. Its reply neither called the old mandate a mistake nor acknowledged that it had ended. The northern government made it clear that the party's defeat did not give Steland the right to rewrite the regional order alone.\n\nHeadquarters in Fada received a copy of the note that same evening. A plan of the northern roads and depots already lay beside it. War had not yet begun, but diplomacy was no longer the only way to settle the dispute."
 ADISCORD_STP_pc.21.a: "Forward the documents to the government."
 STP_pw_party_northern_protocol: "A Protocol with Nodrul"
 STP_pw_party_northern_protocol_desc: "Victory over the uprising did not settle the question of our former dependence. We will request Nodrul's terms before choosing between returning to its protection and pursuing an independent course."
 STP_pw_party_protectorate: "Under Northern Protection"
 STP_pw_party_protectorate_desc: "We will accept Nodrul's offer of protection. Stelander will become its puppet again; the exchange of experience will help restore a regular army."
 STP_pw_party_sovereignty: "Rely on Our Own Strength"
 STP_pw_party_sovereignty_desc:0 "Declare an independent political course. Independence requires domestic military, economic and party institutions."
 STP_pw_party_northern_protocol_tt: "Nodrul will receive a request to renew the protectorate. Its agreement will unlock the corresponding focus, but the final choice remains with Stelander."
 STP_pw_party_protectorate_tt: "Stelander will once again become §YNodrul's puppet§!."
 STP_pw_party_nod_offer_accepted_tt: "Stelander will be able to accept the protectorate through a separate focus. The response itself does not change its status."
 STP_pw_party_nod_offer_pending: "Awaiting Nodrul's response"
 STP_pw_party_nod_offer_accepted: "Nodrul agrees to renew the protectorate"
 STP_pw_party_staff_exchange: "Staff Experience Exchange"
 ADISCORD_STP_pc.19.t: "The Protectorate Question"
 ADISCORD_STP_pc.19.d: "The Party has retained power in Stelander. Its representatives request terms for returning to our protection. Accepting the proposal will allow them to ratify the protectorate; until then, Stelander remains independent.\n\nRefusal will leave the presidium to rely solely on its own resources and independent policy."
 ADISCORD_STP_pc.19.refuse: "Let them answer for themselves."
 ADISCORD_STP_pc.19.accept: "We are ready to renew the protectorate."
 STP_pc_can_offer_nod_terms: "Nodrul is independent, is not at war with us and does not belong to our faction; no other unresolved offer exists"
 STP_pw_prepare_val_campaign: "Deploy Supplies against Kefreyt"
 STP_pw_prepare_val_campaign_desc: "Transport and forward depots cost £ADISCORD_economy_treasury_texticon §Y900§!. Preparation takes §Y35 days§!, and readiness lasts for §Y90 days§!. The enemy will receive a warning and a temporary defensive-preparation bonus. Cancellation does not refund the money; preparation ends if diplomatic conditions change."
 STP_pw_begin_val_campaign: "Begin the Campaign against Kefreyt"
 STP_pw_begin_val_campaign_desc: "Declare war according to the prepared plan. Depot readiness will be consumed, and the army will receive enhanced offensive preparation for §Y35 days§!. Victory will place Kefreyt under Steland as a provisional administration."
 STP_pc_val_campaign_ready: "Ready for the Kefreyt Campaign"
 STP_pc_val_campaign_ready_desc: "Forward depots and transport are ready. The order to begin the campaign is available while this spirit remains active."
 STP_pw_prepare_nod_campaign: "Deploy Supplies against Nodrul"
 STP_pw_prepare_nod_campaign_desc: "Transport and forward depots cost £ADISCORD_economy_treasury_texticon §Y900§!. Preparation takes §Y35 days§!, and readiness lasts for §Y90 days§!. The enemy will receive a warning and a temporary defensive-preparation bonus. Cancellation does not refund the money; preparation ends if diplomatic conditions change."
 STP_pw_begin_nod_campaign: "Begin the Campaign against Nodrul"
 STP_pw_begin_nod_campaign_desc: "Declare war according to the prepared plan. Depot readiness will be consumed, and the army will receive enhanced offensive preparation for §Y35 days§!. Victory will place Nodrul under Steland as a provisional administration."
 STP_pc_nod_campaign_ready: "Ready for the Nodrul Campaign"
 STP_pc_nod_campaign_ready_desc: "Forward depots and transport are ready. The order to begin the campaign is available while this spirit remains active."
 STP_pw_party_nod_military_mission: "Nodrul's Military Mission"
 STP_pw_party_nod_military_mission_desc: "We will ask our patron for an arms shipment from its stockpiles."
 STP_pw_party_domestic_pattern: "A Domestic Weapons Pattern"
 STP_pw_party_domestic_pattern_desc: "An independent Stelander must maintain its army without its northern patron's permission. We will support small-arms research and place a state order for infantry equipment, support equipment and artillery."
 STP_pw_party_border_staff: "Border Headquarters"
 STP_pw_party_border_staff_desc: "We will establish a unified headquarters for the external border. Artillery and anti-air guns will provide the material foundation of the joint border command."
 STP_pw_party_southern_defence: "Prepare the Southern Border"
 STP_pw_party_southern_defence_desc: "We will fortify the southern borders of our controlled districts. Regular frontier exercises will allow us to maintain army readiness."
 STP_postwar_nod_ultimatum: "The Northern Ultimatum"
 STP_postwar_nod_ultimatum_desc: "Rejecting the protectorate turns relations with Nodrul into a military crisis. Until the deadline expires, all we can do is prepare the country for the attack. The choice between submission and independence has already been made."
 STP_pw_party_nod_invasion_countdown: "Nodrul Prepares to Invade"
 STP_pw_party_nod_invasion_countdown_desc: "Nodrul is preparing to invade after the rejection of its protectorate. Before the deadline, prepare your defence or offer a settlement once if the cabinet, military authorities and economic representatives support it. Negotiations do not extend the deadline. Only an accepted and paid agreement ends the threat."
 STP_pw_party_nod_emergency_mobilization: "Emergency Mobilisation"
 STP_pw_party_nod_emergency_mobilization_desc: "Lift some recruitment restrictions, place an emergency order for army depots and recall men demobilised after the civil war. It is expensive, but we cannot meet Nodrul's first blow with a peacetime army."
 STP_pw_party_nod_fortify_border: "Seal the Northern Passes"
 STP_pw_party_nod_fortify_border_desc: "Engineering units will prepare permanent defensive positions in every controlled area directly bordering Nodrul. This will not stop an invasion on its own, but it will make the north pay for every pass."
 STP_pw_party_nod_staff_readiness: "Staff Plan 'North'"
 STP_pw_party_nod_staff_readiness_desc: "We will conduct a staff exercise for the only scenario that now matters: a full-scale war with Nodrul. Command will receive preassigned reserves, supply routes and withdrawal plans."
 STP_pw_party_nod_emergency_mobilization_idea: "Emergency Mobilisation"
 STP_pw_party_nod_emergency_mobilization_idea_desc: "The civil war has ended, but demobilisation has been cancelled in response to the threat of a northern invasion."
 STP_pw_party_nod_staff_readiness_idea: "Defence Plan against Nodrul"
 STP_pw_party_nod_staff_readiness_idea_desc: "Headquarters has prepared defensive lines, supplies and procedures to follow in the event of a breakthrough."
 STP_pw_nod_invasion_mandate: "Eliminate Independent Stelander"
 STP_pw_nod_invasion_mandate_desc: "Nodrul regards the independent Party regime as a breach of the post-war order and is committing its main forces to eliminating it. This is not a limited border operation: northern command must break through the defences, destroy the Party government and bring Stelander back under control. Stelander's capitulation in this war ends the independent campaign.\n\nThe offensive is planned for six months: if the war is still going by then, it gives way to §RSpent Invasion§! (division defence -15%) until the war with Stelander ends."
 STP_pw_nod_invasion_exhausted: "Spent Invasion"
 STP_pw_nod_invasion_exhausted_desc: "Six months of attacking have worn out the assault formations. The best divisions are stretched along the front, the reserves were burned in breakthroughs, and the lines are held with whatever is left. This penalty lasts until the war with Stelander ends.\n\n\n\n\n\n £GFX_ADISCORD_decline_banner \n\n\n"
 ADISCORD_STP_pc.28.t: "Nodrul's Final Protocol"
 ADISCORD_STP_pc.28.d: "Nodrul has recalled the representatives who discussed the protectorate. A notice of military preparations follows: the north regards Stelander rejection as a breach of the old order and will spend 90 days preparing an invasion.\n\nThe signatures gathered at home now matter. A government backed by its party, functioning command and restored production can propose a financial settlement. Nodrul may reject it. Until an agreement is signed and paid, the deadline remains in force.\n\n[STPGetPostwarCabinet]\n\n[STPGetPostwarCommand]\n\n[STPGetPostwarCredit]"
 ADISCORD_STP_pc.28.a: "Ninety days. Not one to spare."
 ADISCORD_STP_pc.29.t: "Nodrul Crosses the Border"
 ADISCORD_STP_pc.29.d: "The ultimatum expired during the night. The first reports arrived almost simultaneously: artillery barrages at the northern passes, columns moving towards the border roads, and the severing of the last communication lines between headquarters. Nodrul announced that it was restoring lawful order and eliminating the regime that had rejected its protection.\n\nFor the Party, this is no longer another post-war dispute. Defeat means the end of independent Stelander and of the very government that survived the civil war."
 ADISCORD_STP_pc.29.a: "There is nowhere left to retreat."
 ADISCORD_STP_pc.30.t: "The North Retreats"
 ADISCORD_STP_pc.30.d: "Nodrul's army is no longer capable of continuing its campaign against Stelander. The enemy headquarters has requested an end to hostilities, and the northern government has withdrawn its demand to restore the protectorate.\n\nThe independence that existed only in a Party resolution until recently has now been confirmed by war. With this outcome, foreign policy can at last be conducted without the assumption that Nodrul's return is inevitable."
 ADISCORD_STP_pc.30.a: "Now this truly is our border."
 STP_pw_party_restore_ministries: "Restore the Ministries"
 STP_pw_party_restore_ministries_desc: "For 540 treasury units and 28 days, we will restore the civilian apparatus. The result is §Y75§! £political_power_texticon, 5% stability and completion of the administrative programme. Losing the capital or eligibility for reconstruction cancels the order and refunds the entire deposit."
 STP_pw_party_reopen_port: "Restore a Port District"
 STP_pw_party_reopen_port_desc: "For 1080 treasury units and 42 days, we will build a civilian factory in one owned, controlled district with a naval base; infrastructure will increase by 1 if it has not reached its limit. Losing all suitable ports, available factory capacity or the capital cancels the order and refunds the deposit."
 STP_pw_party_refit_guard: "Re-equip the Internal Troops"
 STP_pw_party_refit_guard_desc: "For 900 treasury units and 49 days, we will receive 16000 infantry equipment, 120 support equipment, 100 trucks and 25 Army Experience. The materials enter Stelander's stockpile for its existing units. Cancellation refunds the entire deposit."
 STP_pw_party_return_specialists: "Fund Engineering Commissions"
 STP_pw_party_return_specialists_desc: "We will allocate 540 treasury units to return specialists to industrial research. Two research bonuses will accelerate the restoration of our technological base."
 STP_pw_party_security_reserve: "Assemble a Vetted Reserve"
 STP_pw_party_security_reserve_desc: "We will allocate 540 treasury units to assemble reservists who have passed Party vetting. Recruitable manpower and mobilisation speed will increase for 180 days."
 STP_pw_party_standard_order: "Order Domestic Weapons"
 STP_pw_party_standard_order_desc: "For 900 treasury units, we will receive 16000 infantry equipment, 100 support equipment and 100 artillery pieces. Another order becomes available after 120 days, provided Stelander remains independent."
 STP_pw_party_frontier_exercise: "Conduct Frontier Exercises"
 STP_pw_party_frontier_exercise_desc: "For 540 treasury units, we will organise exercises and prepare defensive positions. For 180 days, the army will defend core territory more effectively and entrench faster. Another exercise becomes available once the current programme ends."
 STP_pw_party_last_purge: "The Final Personnel Purge"
 STP_pw_party_last_purge_desc: "Loyalty screening has deprived headquarters and research institutes of experienced staff. Army organisation and research speed have temporarily declined."
 STP_pw_party_security_cordon: "Vetted Party Reserve"
 STP_pw_party_security_cordon_desc: "Funds have been allocated to assemble and train reservists whom Party authorities have cleared for service."
 STP_pw_party_frontier_drill: "Frontier Exercises"
 STP_pw_party_frontier_drill_desc: "Units have practised defending core territory and preparing field positions."
 STP_pw_party_recovery_start_tt: "Three paid programmes begin: ministries, port facilities and re-equipment of the internal troops. Only one order can be carried out at a time. Reconstruction progress is shown in the existing war council category."
 STP_pw_party_recovery_complete_tt: "All three paid Party reconstruction programmes are complete."
 STP_pw_party_guard_refitted_tt: "The paid re-equipment programme for the internal troops is complete."
 STP_pw_party_restore_ministries_result_tt: "After §Y28 days§!: §G+75§! £political_power_texticon, §G+5%§! stability and completion of the administrative programme. Cancellation refunds the entire deposit."
 STP_pw_party_reopen_port_result_tt: "After §Y42 days§!, in one owned, controlled district with a naval base: §G+1§! civilian factory and §G+1§! infrastructure, up to its limit. Completes the economic programme. Cancellation refunds the entire deposit."
 STP_pw_party_refit_guard_result_tt: "After §Y49 days§!, Stelander receives §Y1600§! £infantry_equipment_text_icon infantry equipment, §Y120§! support equipment, §Y100§! trucks and §G25§! Army Experience. Completes the army programme. Cancellation refunds the entire deposit."
 STP_pw_party_nod_contract_tt: "Nodrul will receive an offer to transfer 10000 infantry equipment and 100 support equipment from its stockpiles to Stelander for 450 treasury units. Payment occurs only with its consent and sufficient resources on both sides."
 STP_pw_party_nod_contract_settlement_tt: "Nodrul will transfer 10000 infantry equipment and 100 support equipment from its stockpiles to Stelander. Stelander will pay Nodrul 450 treasury units. Conditions and stockpiles are checked again upon acceptance."
 STP_pw_party_recovery_report: "\n\n§YPresidium programme§!: [?STP_pw_recovery_progress|0] of 3 orders completed. Ministries, port facilities and re-equipment of the internal troops share a single budget slot. [STPGetRecoverySlot]"
 ADISCORD_STP_pc.22.t: "Weapons for Stelander"
 ADISCORD_STP_pc.22.d:0 "Stelander's military mission arrived in Nodrul with an inventory detailed down to the last crate. The regular army lacked rifles, communications equipment and supplies for units that had only recently ceased to be civilian formations. Instead of asking for aid, the delegation proposed an ordinary transaction.\n\nNodrul was offered payment for ten thousand sets of infantry weapons and additional army equipment. For the northern government, this was an opportunity to earn money while strengthening a familiar regime on its southern border. To the party's opponents, such a shipment would look very different.\n\nThe contract lies on the table. All that remains is to decide what matters more to Nodrul now: its stockpiles, or a buyer that still wants to stay close."
 ADISCORD_STP_pc.22.refuse: "Keep the weapons with our own units."
 ADISCORD_STP_pc.22.accept: "Accept payment and transfer the weapons."
 ADISCORD_STP_pc.23.t: "Seats at the table"
 ADISCORD_STP_pc.23.d: "At the first postwar meeting, there are fewer seats than claimants to victory. The old secretaries bring appointment lists, district representatives bring wartime agreements, and the radical hedonists demand to know why the victorious party should be governed by the same people.\n\n[STPGetPostwarPromise]\n\nThe argument over the cabinet becomes an argument over who can restrain it. Conservatives want appointments handled by the apparatus; the Borons demand district consent; the radicals want their delegates to review the old cadres. Each can sustain a government, and each will expect its promises to be honoured. The Nodrulian representative listens, waiting to learn whose signature will bind the next agreement."
 ADISCORD_STP_pc.23.a: "First, make the state work again."
 ADISCORD_STP_pc.24.t: "The Military Mission's Reply"
 ADISCORD_STP_pc.24.accepted:0 "Nodrul's depots opened their gates in the morning. Stelander's inspectors checked the seals, crate numbers and inventory, after which the clearing house confirmed payment. By evening, the first trucks had left for the south.\n\nThe deal did not restore the old protectorate or give Nodrul new powers. It did something else: it showed that even after a war, the old dependency could return through entirely voluntary contracts rather than decrees. For the army, the result is simpler. The regiments have weapons they did not have yesterday."
 ADISCORD_STP_pc.24.refused: "The military mission returned without a supply agreement. Nodrul did not release weapons on the proposed terms. Stelander's funds remain in the treasury; the internal troops can continue re-equipping through our own reconstruction programme."
 ADISCORD_STP_pc.24.accepted_a: "Send the northern weapons to the regiments."
 ADISCORD_STP_pc.24.refused_a: "Then we will rearm on our own."
 STP_pw_party_has_port_capacity: "There is a controlled port district with space for a civilian factory"
 STP_cw_reserve_commanders: "Reserve Company Commanders"
 STP_cw_reserve_commanders_desc: "We will train commanders and their deputies for reserve units."
 STP_cw_casualty_routes: "Casualty Evacuation Routes"
 STP_cw_casualty_routes_desc: "Quartermasters will connect aid stations to transport and rest facilities."
 STP_cw_party_command_sabotage: "Disrupted Capital Command"
 STP_cw_party_command_sabotage_desc: "The attack on the capital's apparatus disrupted the Party headquarters. Commanders are restoring control over their units and coordinating their plans."
 STP_cw_disruption_cells: "Underground Combat Cells"
 STP_cw_disruption_cells_desc: "We will combine the industrial and capital underground's contacts into a network of combat cells. After the split, Shabrat will be able to fund operations against Party territorial brigades."
 STP_cw_disruption_cells_tt: "After the split, Shabrat's army will receive decisions targeting Party territorial brigades in Stelander's districts. An operation costing §Y35§! £political_power_texticon and £ADISCORD_economy_treasury_texticon §Y1200§! takes §Y21 days§! and destroys §Yone§! brigade present in the selected district. Only one operation can run at a time; successful operations must begin at least §Y45 days§! apart, with a maximum of §Ythree§! during the war. Losing the target or ending the war refunds the entire payment."
 STP_cw_disrupt_brigade: "Underground Strike against the Garrison: [FROM.GetName]"
 STP_cw_disrupt_brigade_desc: "Combat cells will eliminate one Party territorial brigade in the selected district. After 21 days, the formation will be destroyed along with its personnel and equipment. Allied, foreign and other division types are not valid targets. If no suitable brigade remains, the district changes controller or the war ends, the operation is cancelled with a full refund. No more than three operations can be completed successfully during the war."
 STP_cw_disruption_available_tt: "Shabrat is at war with the Party; neither side has capitulated; fewer than three operations have succeeded"
 STP_cw_disruption_idle_tt: "No other paid strike is active; 45 days have elapsed since the previous successful operation began"
 STP_cw_disruption_target_tt: "The Party controls the district and has at least one territorial brigade here"
 STP_cw_disruption_price: "§Y35§! £political_power_texticon £ADISCORD_economy_treasury_texticon §Y1200§!"
 STP_cw_disruption_price_blocked: "§R35§! £political_power_texticon £ADISCORD_economy_treasury_texticon §R1200§!"
 STP_cw_disruption_price_tooltip: "Cost: §Y35§! £political_power_texticon and £ADISCORD_economy_treasury_texticon §Y1200§!. Cancellation refunds both amounts."
 STP_cw_disruption_paid_tt: "A §Y28-day§! operation begins against one Party territorial brigade in the selected district. The network is occupied; the next successful order cannot begin until §Y60 days§! after the current operation started."
 STP_cw_disruption_result_tt: "If the target remains valid, §Yone§! Party territorial brigade in this district is destroyed. If the conditions no longer hold, §Y50§! £political_power_texticon and £ADISCORD_economy_treasury_texticon §Y1200§! are refunded."
 STP_cw_disruption_refund_tt: "Full refund: §Y35§! £political_power_texticon and the previously paid £ADISCORD_economy_treasury_texticon amount. The network becomes available; the successful-operation limit is not consumed."
 STP_pc_economy_count_the_cost: "A Unified State Treasury"
 STP_pc_economy_count_the_cost_desc: "The civil war ended before the accountants could establish what state remained after it. District coffers, factory ledgers and tax books must once again describe one country rather than several military administrations."
 STP_pc_economy_count_the_cost_tt: "Revenue and expenditure will be recalculated across the reunified territory. Reforms accumulate in the post-war republic's national spirit."
 STP_pc_economy_reopen_tax_offices: "The Republic's Tax Service"
 STP_pc_economy_reopen_tax_offices_desc: "During the war, collectors disappeared along with the archives, and enterprises paid whoever controlled the nearest road. The new government must restore a unified taxpayer register and separate taxation from field levies."
 STP_pc_economy_reopen_tax_offices_tt: "A unified taxpayer register turns wartime levies into steady state revenue."
 STP_pc_economy_repair_workshops: "Restart Civilian Workshops"
 STP_pc_economy_repair_workshops_desc: "Repair shops that were patching up trucks and rifles yesterday can once again manufacture equipment for mines, roads and homes. State orders must return them to civilian work."
 STP_pc_economy_repair_workshops_tt: "A civilian factory is built in an owned, controlled Stelandic region with available space. If no suitable region exists, the treasury receives §G900§! instead."
 STP_pc_economy_stabilize_currency: "Monetary Stabilisation"
 STP_pc_economy_stabilize_currency_desc: "After months of military IOUs, emergency purchases and separate coffers, the value of money has become a political question. The Council of Ministers and the banks must agree on which obligations the republic recognises and how it will honour them."
 STP_pc_economy_stabilize_currency_tt: "Inflation: §G-8§! percentage points. Deficit pressure: §G-10§! percentage points. Neither can fall below zero."
 STP_pc_economy_recovery_budget: "The First Development Budget"
 STP_pc_economy_recovery_budget_desc: "Reconstruction will no longer be a series of emergency payments. Roads, civilian industry, local administrations and debt will receive a shared budget planned for several years rather than the coming week."
 STP_pc_economy_recovery_budget_tt: "Steady revenue, expenditure management and civilian production are brought together in a long-term reconstruction programme."
 STP_pc_development_country_must_live: "Life After the War Bulletin"
 STP_pc_development_country_must_live_desc: "Victory explains who gained power, but not why people should build schools, workshops and roads again. State propaganda must exchange the language of the front for the language of reconstruction: Steland exists not for the next war, but for the life that follows it."
 STP_pc_development_country_must_live_tt: "Growth across all national development dimensions: §G+5%§!."
 STP_pc_development_posters_on_ruins: "Newspapers Return to the Districts"
 STP_pc_development_posters_on_ruins_desc: "The walls still bear the marks of shellfire, and that is where the new campaign's first posters will appear. Districts will compete not in numbers of volunteers, but in reopened schools, functioning services and restored streets."
 STP_pc_development_posters_on_ruins_tt: "Monthly society growth: §G+1§! £ADISCORD_country_development_texticon. Society development growth: §G+5%§! £ADISCORD_country_development_texticon."
 STP_pc_development_rebuild_as_duty: "Roofs and Machine Tools First"
 STP_pc_development_rebuild_as_duty_desc: "Work crews need roofing, bricks and functioning machine tools. Put the first resources where results can be seen within a shift. Construction and economic development take priority over expanding technical research; both routes lead back to national reconstruction."
 STP_pc_development_rebuild_as_duty_tt: "Economic development growth: §G+7%§! £ADISCORD_country_development_texticon. Construction speed: §G+5%§!."
 STP_pc_development_engineers_on_radio: "Let the Builders Speak"
 STP_pc_development_engineers_on_radio_desc: "Engineers receive seats on planning commissions and airtime to explain the choices behind reconstruction. Technical expertise accelerates research and state development, while the construction programme forgoes a separate priority."
 STP_pc_development_engineers_on_radio_tt: "State development growth: §G+7%§! £ADISCORD_country_development_texticon. Research speed: §G+3%§!."
 STP_pc_development_generation_reconstruction: "Victory Outside the Window"
 STP_pc_development_generation_reconstruction_desc: "If war shaped a generation of the front, peace must shape a generation of reconstruction. Schools, the press and state programmes will tie personal success to national growth rather than membership in another armed group."
 STP_pc_development_generation_reconstruction_tt: "Monthly society, state and economic growth: §G+1§! £ADISCORD_country_development_texticon in each dimension. Growth across all development dimensions: §G+8%§! £ADISCORD_country_development_texticon. Additional society, state and economic growth: §G+5%§!."
 STP_pc_development_reopen_universities: "Reopen the Universities"
 STP_pc_development_reopen_universities_desc: "Military headquarters took the best lecturers, laboratories lost equipment, and some institutes existed only on paper for years. The state will return funding, premises and the ability to plan beyond the next campaigning season to the universities."
 STP_pc_development_reopen_universities_tt: "Adds §G1 permanent research slot§!. Research speed: §G+2%§!."
 STP_pc_development_national_research_institutes: "National Research Institutes"
 STP_pc_development_national_research_institutes_desc: "Restored universities alone are not enough. The republic will establish a network of specialised institutes linked to industry, infrastructure and state planning. Science must become a permanent national function rather than a peacetime luxury."
 STP_pc_development_national_research_institutes_tt: "Adds another §G1 permanent research slot§!. Research speed: §G+3%§!. Economic and state development growth: §G+3%§!."
 STP_pc_development_captured_institutes: "Captured Institutes"
 STP_pc_development_captured_institutes_desc: "The national institutes have buildings and budgets, but they lack experienced people. The republic's victories opened access to foreign laboratories, factory archives and scientists who chose work over emigration. We will bring them into the common institute network on the same terms as our own specialists."
 STP_pc_development_captured_institutes_available_tt:0 "Stelander owns the capital state of Bezhaysk; or the subordinate Bezhaysk Administration owns and controls its capital; or Kefreyt or Nodrul is a subject of Stelander."
 STP_postwar_reconstruction_drive: "The First Reconstruction Plan"
 STP_postwar_reconstruction_drive_desc: "Victory ended the civil war, but did not restore normal life. The government must rebuild the economy, restore trust in the centre and persuade the districts to function once more as parts of a single state.\n\n§YReconstruction momentum:§! [?STP_pw_reconstruction_momentum|0]/100\n§YPublic confidence:§! [?STP_pw_public_confidence|0]/100\n§YRegional cohesion:§! [?STP_pw_regional_cohesion|0]/100\n\nAll three indicators must reach §Y70§! to complete the first plan."
 STP_pw_reconstruction_emergency_repairs: "Emergency Reconstruction Teams"
 STP_pw_reconstruction_emergency_repairs_desc: "Direct treasury funds towards bridges, substations, railway junctions and damaged workshops. Within weeks, these teams must show that the central government knows how to repair as well as mobilise.\n\nAfter 28 days: reconstruction momentum §G+15§!, regional cohesion §G+5§!, public confidence §G+3§!."
 STP_pw_reconstruction_district_congresses: "District Administration Congresses"
 STP_pw_reconstruction_district_congresses_desc: "Bring officials, municipal councils and military commandants together for a series of district meetings. The centre will receive a list of real problems, and the regions a channel of influence that does not run through armed headquarters.\n\nAfter 28 days: regional cohesion §G+15§!, public confidence §G+8§!, reconstruction momentum §G+2§!."
 STP_pw_reconstruction_publish_war_accounts: "Publish the Wartime Accounts"
 STP_pw_reconstruction_publish_war_accounts_desc: "Disclose some of the emergency expenditure, requisition lists and wartime debts. It will be painful for the cabinet, but silence about missing money destroys trust faster than any figures.\n\nAfter 21 days: public confidence §G+12§!, regional cohesion §G+4§!."
 STP_pw_reconstruction_veteran_housing: "Housing for Demobilised Soldiers"
 STP_pw_reconstruction_veteran_housing_desc: "Convert empty barracks, allocate construction materials and subsidise housing for families returning from the front. The war must have a visible end.\n\nAfter 42 days: public confidence §G+15§!, reconstruction momentum §G+8§!, regional cohesion §G+5§!."
 STP_pw_complete_first_reconstruction_plan: "Complete the First Reconstruction Plan"
 STP_pw_complete_first_reconstruction_plan_desc:0 "Essential services are functioning, the districts have rejoined a common administrative system, and society no longer lives in anticipation of another mobilisation. The first emergency phase can end, allowing a transition to long-term development.\n\nReward: stability §G+5%§!, treasury §G+100§!; permanent social, state and economic development growth §G+1§! £ADISCORD_country_development_texticon per month; economy income, construction speed and overall development growth §G+5%§!."
 STP_postwar_propaganda_campaigns: "Reconstruction Propaganda"
 STP_postwar_propaganda_campaigns_desc: "After the civil war, propaganda must compete for attention just as construction and administrative programmes compete for money. The number of simultaneous campaigns is limited by the available propaganda slots."
 STP_pw_campaign_country_is_being_built: "'A Country Rebuilt'"
 STP_pw_campaign_country_is_being_built_desc: "Posters, newsreels and local newspapers show road repairs, workshops opening and public services being restored instead of leaders on platforms."
 STP_pw_campaign_one_steland: "'One Steland'"
 STP_pw_campaign_one_steland_desc: "The campaign stresses that the front lines disappeared along with the military administrations. Districts must once again see one another as parts of a single state."
 STP_pw_campaign_engineers_of_peace: "'Engineers of Peace'"
 STP_pw_campaign_engineers_of_peace_desc: "Radio and newsreels turn engineers, doctors and teachers into symbols of the post-war state. Competence must become more prestigious than battlefield bravado."
 STP_pw_campaign_victory_means_normal_life: "'Victory Means a Normal Life'"
 STP_pw_campaign_victory_means_normal_life_desc: "The campaign's central message is simple: victory is measured not by the number of parades, but by whether people can once again plan their work, family and lives beyond the coming week."
 STP_party_preparation_available_tt: "Preparation is still under way, and we support the Party"
 STP_party_war_available_tt: "The Party is still at war with the resistance; the government has not capitulated"
 STP_party_compact_districts_tt: "Party influence in New Monaya and Kreyden: §G+15§! if we own and control the district and local operations are available. Other networks are not removed; garrisons are funded through separate agreements."
 STP_party_compact_depots_tt: "Party influence in Hoskheit and Old Fada Forest: §G+15§! while ownership, control and access are retained. These agreements do not destroy underground networks: conduct a separate inspection if necessary."
 STP_party_shared_stocks_tt: "The shipment enters Stelander's shared stockpiles before the split. Unused equipment will be divided between the sides under the civil-war rules, rather than reserved entirely for the Party."
 STP_party_civil_register_tt: "Party influence in Niansas and Hoskheit: §G+8§! while ownership, control and access are retained. Strengthening the chancelleries does not destroy other military networks."
 STP_party_staff_retained_tt: "The headquarters improvement remains with the Party after the split. It does not pass to Shabrat's army."
 STP_party_district_compact: "An Agreement with District Chiefs"
 STP_party_district_compact_desc: "We will conclude an agreement with the district chiefs. We will strengthen Party influence in New Monaya and Kreyden without destroying underground networks."
 STP_party_treasury_3600_tt: "The shared treasury receives £ADISCORD_economy_treasury_texticon §G3600§!. These funds may be spent on preparation before the split; they are not reserved exclusively for the party."
 STP_party_budget_reserve: "The Presidium's Reserve"
 STP_party_budget_reserve_desc: "We will arrange an emergency loan through the ministries. Officials must convince lenders that the state will honour its obligations despite the political crisis."
 STP_party_guard_workshops: "Capital Arsenal Orders"
 STP_party_guard_workshops_desc: "Military factories need orders, and the guard needs serviceable equipment. We will organise production of small arms, heavy squad weapons and equipment for headquarters services."
 STP_party_supply_directorate: "Garrison Supply Directorate"
 STP_party_supply_directorate_desc: "We will establish a common supply directorate. It will organise supply expenditure and the recovery of units."
 STP_party_civil_register: "District Chancelleries"
 STP_party_civil_register_desc: "Regional institutions must know which orders are in force and who is authorised to sign them. We will update the registers of Niansas and Hoskheit while maintaining continuity of local administration. This will strengthen the Party's position."
 STP_party_succession_protocol: "The Succession Procedure"
 STP_party_succession_protocol_desc: "Until the very last day, Ivanov's signature held departments together better than any regulation. Now the presidium needs a procedure that will not stop at the door to the president's ward. We will formalise the secretariat's authority and determine in advance who makes decisions when contact with the capital is lost."
 STP_party_war_transport: "Military Transport Columns"
 STP_party_war_transport_desc: "The army needs transport in the first weeks of war. Unified headquarters will assign repair routes and coordinate deliveries."
 STP_party_treasury_2400_tt: "The treasury will receive §G2400§! monetary units."
 STP_party_rear_administration: "Restore Administration behind the Lines"
 STP_party_rear_administration_desc: "We will appoint officials responsible for rations, payments and frontline requisitions. The rear answers to the functioning government: the Congress or a provisional presidium with restored district communications."
 STP_party_war_directorate: "Operations Directorate"
 STP_party_war_directorate_desc: "Rear administration and reserve management must serve the same operation. Once government communications are restored, we will establish a directorate to coordinate unit requests, replacements and staff plans."
 STP_party_district_charters: "Charters for District Organisations"
 STP_party_district_charters_desc: "Districts will retain some authority over personnel and receive a clearly defined share of responsibility for reconstruction. In return, local organisations undertake to implement the common budget and refrain from creating their own armed formations. These concessions reduce the secretariat's freedom, but make local administration more predictable."
 STP_party_local_cadres: "Retain Local Personnel"
 STP_party_local_cadres_desc: "The war left too few engineers and managers to judge everyone solely by whose orders they followed. District organisations will vouch for specialists. The centre will maintain common standards, but abandon the attempt to approve every appointment personally."
 STP_party_personnel_commissions: "Presidium Personnel Commissions"
 STP_party_personnel_commissions_desc: "Emergency appointments must become a permanent system of admission to state service. Commissions will vet managers and build a replacement reserve. This will give the centre more direct control, but taking specialists away from their work will slow reconstruction."
 STP_party_chain_of_command: "A Single Chain of Command"
 STP_party_chain_of_command_desc: "The new leadership has no intention of governing through endless agreements with every district secretary. Appointments, garrisons and ministerial orders will fall under one system. Strengthening command will require continuing expenditure on enforcement checks."
 STP_party_revenue_service: "Restore Revenue Collection"
 STP_party_revenue_service_desc: "The state needs a common financial framework. We will restore tax registers, reconcile port fees with actual turnover and establish uniform payment procedures. The economy will rely on regular receipts rather than one-off seizures."
 STP_party_port_contracts: "Long-term Port Contracts"
 STP_party_port_contracts_desc: "A civilian priority must bring turnover to the treasury and a planning horizon to enterprises. We will establish terms for warehouse leases, cargo handling and raw-material supplies. The state will relinquish some immediate control in exchange for lasting contracts."
 STP_party_industrial_board: "State Industrial Orders"
 STP_party_industrial_board_desc: "A military priority requires coordinated production runs, not isolated shipments. The industrial directorate will consolidate orders from the army and related enterprises. Arms output will rise, but contract oversight will remain an expense in the budget."
 STP_party_research_council: "Council for Applied Research"
 STP_party_research_council_desc: "Laboratories experienced the war differently. Some continued working with the army; others lost personnel and equipment. We will bring the surviving teams into a permanent council for industrial problems, communications and new technologies."
 STP_party_technical_institutes: "Reopen the Institutes"
 STP_party_technical_institutes_desc: "Once the ministries can again pay their staff and manage state orders, permanent research programmes can return to the institutes. Lecture halls and laboratories must train the next generation of specialists, not merely service departments' urgent requests."
 STP_party_ministries_restored_tt: "The 'Restore the Ministries' decision is complete"
 STP_party_factory_laboratories: "Factory Laboratories"
 STP_party_factory_laboratories_desc: "The institutes are enrolling students again, but their work stays on paper while the workshops stand idle. The restored port and factories will receive their own laboratories: testing, approvals and prototype refinement will happen beside the machine tools rather than in a ministry queue."
 STP_party_captured_archives: "Captured Archives"
 STP_party_captured_archives_desc: "A won campaign leaves Stelander with foreign design bureaus, test archives and specialists whom the new authorities are willing to keep in place. We will move the documents to the capital and open separate departments for captured developments at the institutes."
 STP_party_captured_archives_available_tt: "Stelander has won the Bezhaysk or Kefreyt campaign, or holds Kefreyt or Nodrul as a subject."
 STP_RESISTANCE_ELECTION_BRIEFING: "[STP_display_party_suspicion]\n\n§YKey suspicion thresholds§!\n§Y60%§!: the Party can run §Rtwo district commissions simultaneously§!.\n§Y70%§!: surveillance enters its crisis stage; new risky operations become particularly dangerous.\n§R90%§!: Shabrat is placed on operational watchlists. Suspicion can still be reduced before it reaches 100%.\n§R100%§!: if Shabrat is still available, he is §Rarrested immediately§!; lowering the scale does not undo an arrest that has already occurred.\n\nBefore an inspection starts, a district can be protected from new commissions for §Y40 days§!. If a commission is already active, use a §Yfalse trail§!: it takes 7 days and ends only that current inspection."
 STP_PARTY_ELECTION_BRIEFING: "§YParty objective§!: preserve the apparatus and key districts before the split.\nWatch announced underground operations: searches without a target help Shabrat. At 70+ apparatus loyalty, underground preparation slows down; below 25, it speeds up. An election victory does not prevent civil war.\nGovernment projects are under §YApparatus and Preparation§!; Nodrul and Kefreyt shipments are under §YForeign Operations§!."
 STP_RESISTANCE_MAP_INSTRUCTIONS: "Choose major operations: a garrison agreement, supplies or civilian administration. The map shows established networks and which side will receive each district."
 STP_PARTY_MAP_INSTRUCTIONS: "The map shows which districts will remain loyal to the Party and where the underground is active. Watch the couriers' announced target. Interception disrupts the current operation; an inspection destroys local networks; an agreement with a commander prepares a garrison. Influence and prepared units are different results."
 STP_REGION_PARTY_INSPECTION_STATUS: "\n\n§YParty inspection:§! a commission is working in the district. The resistance can prepare cover or sacrifice some connections. Watch the inspection's outcome and the underground's next announced operation."
 STP_party_form_assault_column: "Form an Assault Column"
 STP_party_form_assault_column_desc: "Immediately form one reinforced division using a fixed wartime template. All personnel and equipment are drawn from our actual reserves. Another order becomes available after §Y21 days§!, only while the civil war against the resistance continues. Once it ends, the old prices no longer apply. The Party's reinforced division template retains its original composition until the civil war ends; ordinary recruitment using it is not prohibited."
 STP_party_assault_price: "§Y7900§! £manpower_texticon §Y7110§! £infantry_equipment_texticon §Y48§! squads\n§Y30§! £support_equipment_texticon §Y60§! £artillery_texticon §Y20§! £anti_air_texticon"
