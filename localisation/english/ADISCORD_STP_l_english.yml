 # Party programmes and their consequences
 STP_pe_houses_opening:0 "The Houses Present Their Bill"
 STP_pe_houses_opening_desc:0 "The High Houses remember every wartime favour. Crow must reconcile their claims with their debts to the districts before gratitude becomes a permanent exemption from public obligations."
 STP_pe_houses_policy_a:0 "Arrears Have No Coat of Arms"
 STP_pe_houses_policy_a_desc:0 "Tax demands will reach even the estates that sheltered the victorious headquarters. Revenue will improve, at the cost of political effort spent enforcing the Chamber's own decisions."
 STP_pe_houses_policy_b:0 "Pay with Seats in the Chamber"
 STP_pe_houses_policy_b_desc:0 "Crow offers guaranteed representation in exchange for functioning institutions. Collections must be eased: the consent of the old families carries a measurable price."
 STP_pe_houses_work_a:0 "Audit the Closed Estates"
 STP_pe_houses_work_a_desc:0 "Auditors will uncover the arrears of closed estates and return the first collection to the treasury. Family privilege no longer conceals unpaid obligations."
 STP_pe_houses_work_b:0 "The Guarantors' Compact"
 STP_pe_houses_work_b_desc:0 "Guarantors will maintain local offices and enforce agreements. This reduces recurring state administration costs while entrenching the Houses locally."
 STP_pe_houses_settlement:0 "The First Postwar Collection"
 STP_pe_houses_settlement_desc:0 "Receipts from the first common collection will show whether the Chamber's signature carries more weight than a verbal promise. The commission's work will inform the register of recognised rights. The signed settlement closes this dispute."
 STP_pe_houses_next_day:0 "The Chamber Answers to the Country"
 STP_pe_houses_next_day_desc:0 "The Chamber must answer for more than promises. A working budget permits regular collection of arrears; the district review improves receipts."
 STP_pe_houses_commission:0 "District Expenditure Ledgers"
 STP_pe_houses_commission_desc:0 "Once the revenue dispute is settled, commitments can be compared with actual payments. Districts receive a common reporting form, allowing the Chamber to demand compliance without bargaining over every case."
 STP_pe_houses_course_a:0 "Representation for the Taxpayers"
 STP_pe_houses_course_a_desc:0 "Authority over public funds should carry an obligation to account to those who provided them. Taxpayers' delegates will sit alongside the envoys of the Houses."
 STP_pe_houses_course_b:0 "Hereditary Seats"
 STP_pe_houses_course_b_desc:0 "Recognised families will retain their seats in the Chamber. Succession becomes predictable, while new merchants and district officials remain petitioners outside its doors."
 STP_pe_houses_ending_a:0 "A Covenant of Equal Obligations"
 STP_pe_houses_ending_a_desc:0 "Crow ties property rights to common duties. Revenue administration becomes cheaper, though reconciling district interests continues to demand political work."
 STP_pe_houses_ending_b:0 "Republic of the Old Families"
 STP_pe_houses_ending_b_desc:0 "Order rests on a pact among the old families: seats, patronage and accountability within their circle. The Chamber acts with greater confidence, paying for consent through exemptions for its supporters."
 STP_pe_houses_policy_a_idea:0 "Arrears Have No Coat of Arms"
 STP_pe_houses_policy_a_idea_desc:0 "Tax demands will reach even the estates that sheltered the victorious headquarters. Revenue will improve, at the cost of political effort spent enforcing the Chamber's own decisions. Remains in force until the final settlement."
 STP_pe_houses_policy_b_idea:0 "Pay with Seats in the Chamber"
 STP_pe_houses_policy_b_idea_desc:0 "Crow offers guaranteed representation in exchange for functioning institutions. Collections must be eased: the consent of the old families carries a measurable price. Remains in force until the final settlement."
 STP_pe_houses_crisis:0 "District Revenue Boycott"
 STP_pe_houses_crisis_desc:0 "The dispute has halted fulfilment of obligations. Complete the unlocked programme or choose a settlement in the event."
 STP_pe_houses_backlash:0 "Concessions to the High Houses"
 STP_pe_houses_backlash_desc:0 "The dispute was settled through temporary concessions. Their cost survives a change of party leader."
 STP_pe_houses_ending_a_idea:0 "A Covenant of Equal Obligations"
 STP_pe_houses_ending_a_idea_desc:0 "Crow ties property rights to common duties. Revenue administration becomes cheaper, though reconciling district interests continues to demand political work."
 STP_pe_houses_ending_b_idea:0 "Republic of the Old Families"
 STP_pe_houses_ending_b_idea_desc:0 "Order rests on a pact among the old families: seats, patronage and accountability within their circle. The Chamber acts with greater confidence, paying for consent through exemptions for its supporters."
 STP_pe_houses_programme:0 "Commission on House Debts"
 STP_pe_houses_programme_desc:0 "The commission will prepare fulfilment before the settlement date or resolve an existing dispute. Work takes 35 days and survives a change of party leader. Capitulation or the fall of party rule returns the deposit; political costs are not refunded."
 ADISCORD_STP_ch.40.t:0 "The Houses Present Their Bill"
 ADISCORD_STP_ch.40.d:0 "Six bundles of petitions await Crow, each opening with a declaration of loyalty. They ask for estates, appointments and forgiveness of wartime arrears. District cashiers bring another list: roads, wages and empty accounts. The common collection falls due in ninety days. A commission set to work now can reconcile the documents before these interests collide."
 ADISCORD_STP_ch.40.a:0 "Begin the preparations."
 ADISCORD_STP_ch.46.t:0 "District Revenue Boycott"
 ADISCORD_STP_ch.46.d:0 "Several estate managers have closed their tills to district collectors. They call it a review of authority, even as their wagons use public roads. Crow can fund an urgent debt settlement, concede part of the revenue to end the boycott, or leave the dispute to the commission. Delayed collections are already reducing income."
 ADISCORD_STP_ch.46.prepared:0 "The settlement date has arrived, but the prepared commission has already reconciled the disputed documents and terms. The parties have no grounds to halt institutional work. The government can continue its programme on the basis of fulfilled commitments."
 ADISCORD_STP_ch.46.a:0 "Fund an urgent debt settlement."
 ADISCORD_STP_ch.46.b:0 "Concede part of the revenue for an agreement."
 ADISCORD_STP_ch.46.c:0 "Leave the dispute to the commission."
 ADISCORD_STP_ch.46.z:0 "Take note."
 ADISCORD_STP_ch.52.t:0 "The New Order Has Been Tested"
 ADISCORD_STP_ch.52.a_desc:0 "Crow ties property rights to common duties. Revenue administration becomes cheaper, though reconciling district interests continues to demand political work."
 ADISCORD_STP_ch.52.b_desc:0 "Order rests on a pact among the old families: seats, patronage and accountability within their circle. The Chamber acts with greater confidence, paying for consent through exemptions for its supporters."
 ADISCORD_STP_ch.52.a:0 "This is the course we have chosen."
 STP_pe_festival_opening:0 "The Festival Beyond the Capital"
 STP_pe_festival_opening_desc:0 "Hedersett sends the capital's festival into the districts. Local offices must receive performers, visitors and new rules, then explain who will pay for accommodation and medical care."
 STP_pe_festival_policy_a:0 "Tickets for the Workers' Quarters"
 STP_pe_festival_policy_a_desc:0 "Some venues and seats will open to people outside the private societies. Administrative costs rise, but the festival becomes a shared neighbourhood undertaking."
 STP_pe_festival_policy_b:0 "Licences for the Chosen Clubs"
 STP_pe_festival_policy_b_desc:0 "Clubs able to guarantee revenue and order will receive licences. Receipts increase, while the boundary between guests and the people serving them becomes more pronounced."
 STP_pe_festival_work_a:0 "Travelling Stages and Kitchens"
 STP_pe_festival_work_a_desc:0 "Travelling crews will build stages and kitchens with supply roads."
 STP_pe_festival_work_b:0 "Managers of the Night City"
 STP_pe_festival_work_b_desc:0 "Venue managers will pay licence fees into the treasury. In return they handle lodging, supplies and night security."
 STP_pe_festival_settlement:0 "Who Pays for the Morning"
 STP_pe_festival_settlement_desc:0 "Celebrations leave bills, patients and unfulfilled contracts behind. District offices must know who is responsible before those invoices reach the chairman. The signed settlement closes this dispute."
 STP_pe_festival_next_day:0 "After the Final Firework"
 STP_pe_festival_next_day_desc:0 "Celebrations leave squares, patients and bills behind. The government will fund regular public services without repealing the consequences of existing cultural and labour laws."
 STP_pe_festival_commission:0 "Complaints from the Outer Districts"
 STP_pe_festival_commission_desc:0 "Once the dispute is settled, districts will submit their accounts and complaints. Existing cultural and labour laws shape these problems; a new commission cannot repeal them by administrative order."
 STP_pe_festival_course_a:0 "The Right to Leave the Festival"
 STP_pe_festival_course_a_desc:0 "A free festival requires the freedom not to participate. A slave market is incompatible with that freedom."
 STP_pe_festival_course_b:0 "A Patron for Every Establishment"
 STP_pe_festival_course_b_desc:0 "Every establishment will receive an influential protector and a clear chain of authority. Organisers can settle problems faster while consolidating control over the season's income."
 STP_pe_festival_ending_a:0 "Carnival of the Open Squares"
 STP_pe_festival_ending_a_desc:0 "The squares remain open and participation voluntary. The state pays for access and services, gaining public consent at the cost of continuing expenditure."
 STP_pe_festival_ending_b:0 "Empire of the Privileged Clubs"
 STP_pe_festival_ending_b_desc:0 "The festival economy belongs to a circle of licensed patrons. It brings in more money, but residents increasingly distinguish its owners from those who serve them."
 STP_pe_festival_policy_a_idea:0 "Tickets for the Workers' Quarters"
 STP_pe_festival_policy_a_idea_desc:0 "Some venues and seats will open to people outside the private societies. Administrative costs rise, but the festival becomes a shared neighbourhood undertaking. Remains in force until the final settlement."
