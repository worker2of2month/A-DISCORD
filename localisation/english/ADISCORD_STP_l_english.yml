 STP_ch_request_release:0 "Negotiate independence"
 STP_ch_request_release_desc:0 "With domestic command, supply and appointments, request a revised mandate. Nodrul must consent; silence is not consent. Talks require a foreign war, a northern crisis or three joint programmes."
