 STP_cw_quiet_registers_strategy_tt: "Faction support: Conservatives: §G+10§!; Borons: §G+6§!."
 STP_GUARANTEE_MINISTERS_strategy_tt: "Ministerial guarantees shorten communications recovery by §G4 days§! for either reorganisation option. The concession to conservatives retains the radicals' opposition."
 STP_defense_budget_strategy_tt: "The defence budget shortens supply recovery by §G4 days§! for either reorganisation option. Military factories remain an alternative to the civilian treasury reserve."
 STP_cw_protect_congress_strategy_tt: "Prepared defence shortens the first reorganisation stage by §G3 days§! while retaining Congress fortification and the defensive reserve. This course excludes the mobile reserve."
 STP_cw_capital_oath_strategy_tt: "The mobile reserve shortens final offensive preparation by §G7 days§!. Earlier recovery stages remain mandatory; this course excludes Congress fortification."

 STP_cw_take_fada: "§YTake Fada: the Bronze Congress§!"
 STP_cw_take_fada_desc: "§YMain civil-war objective§!\n\nCapture the §YBronze Congress in Fada§! — this particular strongpoint, not the entire capital state. Resistance control of the Congress means §Gthe party loses and Shabrat wins the civil war§!.\n\nThe objective remains in effect throughout the civil war. After §Y365 days§!, its countdown renews if the war continues; time alone brings neither victory nor defeat. The separate Last Banquet operation keeps its own deadline."
 STP_cw_hold_fada: "§RHold Fada: the Congress falls, the party falls§!"
 STP_cw_hold_fada_desc: "§RDo not let the resistance capture the Bronze Congress.§!\n\nIf Shabrat takes the §YBronze Congress in Fada§!, the party loses the civil war. Remaining troops and a temporary presidium cannot avert this outcome. Losing other districts alone does not count as losing the Congress.\n\nThis warning lasts throughout the civil war. After §Y365 days§!, the countdown renews if the war continues; holding the Congress until it expires does not grant automatic victory."
 STP_cw_fada_captured_tt: "The resistance controls the Bronze Congress in Fada and the civil war is still in progress."
 STP_cw_fada_victory_tt: "§GThe party loses the civil war. Shabrat reunifies Stelander.§!"
 STP_cw_fada_defeat_tt: "§RResistance capture of the Bronze Congress defeats the party. Shabrat reunifies Stelander.§!"
 STP_cw_fada_timeout_tt: "§YThe mission renews if the civil war continues. The countdown does not decide the war.§!"
 STP_pc_council_revanche_title: "Kefreyt Returns to the Passes"
 STP_pc_council_revanche_desc: "The Council of Commanders, installed after Kefreyt’s defeat, has rejected the peace settlement. Rebuilt columns are crossing Stelander’s border again. This is no remnant of Solgalov’s expedition: the Council has deliberately chosen a war of revenge.\n\nShabrat has ruled out another limited peace. Should the Council lose, Kefreyt will be annexed in full. A Kefreyt victory, on the other hand, will install a subordinate administration in Stelander."
 STP_pc_council_revanche_response: "This time, we finish it."

 STP_pw_regional_citizenship: "Common Citizenship"
 STP_pw_regional_citizenship_desc: "Victory changes borders, not civil administration. A common citizenship register opens gradual integration of directly held neighbouring regions. Programmes operate only at peace; annexation alone does not turn foreign territory into core land."
 STP_pw_cadastral_commissions: "Land Commissions"
 STP_pw_cadastral_commissions_desc: "Reconcile disputed land titles, archives and tax records. Commission rulings give local institutions a workable legal basis and free political resources for further integration."
 STP_pw_regional_connections: "Connect Regional Centres"
 STP_pw_regional_connections_desc: "Reconnect regional centres with the common market. Infrastructure is improved on directly held territory; a fully developed network instead releases resources to civil administration."
 STP_pw_workshop_contracts: "Orders for Local Workshops"
 STP_pw_workshop_contracts_desc: "Give local workshops civilian orders and bring their output into the common production register. Directly held non-core regions receive priority because they need employment."
 STP_pw_local_officer_courses: "Local Officer Courses"
 STP_pw_local_officer_courses_desc: "Common training standards connect local garrisons to the national command. Instructors receive equipment for signals, engineering and supply duties."
 STP_pw_common_market: "A Common Domestic Market"
 STP_pw_common_market_desc: "Unify land records, transport and production into one economic system. Additional political resources allow further regional integration without replacing its paid programmes with automatic citizenship."
 STP_pw_kefreyt_settlement: "Administer Former Kefreyt"
 STP_pw_kefreyt_settlement_desc: "Independent Kefreyt no longer exists, but its industry and population still require a settlement. Restore military production in directly held Kefreyt territory; coring continues through the ordinary regional programmes."
 STP_postwar_administration: "Citizenship and Regional Integration"
 STP_postwar_administration_desc: "New borders require a common citizenship system. Integrate multiple eligible neighbouring regions simultaneously, each for §Y50§! £political_power_texticon over §Y120 days§!. Peace, independence, direct ownership and control, and a border with a directly held core are required. Cancellation refunds the payment."
 STP_pw_nationalise_region: "Integrate Region: [FROM.GetName]"
 STP_pw_nationalise_region_desc: "For §Y50§! £political_power_texticon over §Y120 days§!, this region becomes a core of our country under normal game rules. It must be directly owned and controlled by us and border a directly held core. Multiple eligible regions may be integrated simultaneously; each programme is paid separately. War, loss of control or other eligibility conditions cancels the project and refunds its payment. The new core opens its neighbours to further integration."
 STP_pw_integration_target_tt: "The civil war has been won and settled; the country is independent and at peace. The region is directly owned and controlled, is not already a core and borders a directly held core."
 STP_pw_integration_slot_tt: "This region is not reserved by an existing integration programme."
 STP_pw_integration_complete_tt: "The region is now a §Ycore state§!. Its directly held neighbours may now become available for further integration."
 STP_pw_integration_chain_tt: "Unlocks repeatable map integration: §Y50§! £political_power_texticon, §Y120 days§!, per directly held non-core bordering a directly held core. Multiple eligible regions may be integrated simultaneously. Peace is required; cancellation refunds the payment."
 STP_pw_integration_government_tt: "The civil war ended in our victory; the country is independent and has an operational postwar government."
 STP_pw_kefreyt_settlement_available_tt: "The country is independent and at peace after the civil war. Kefreyt no longer exists; at least one of its core states is directly owned and controlled by us."

