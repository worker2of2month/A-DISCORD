 # Story scenes after Ivanov: resistance, party and district administration.
 ADISCORD_STP_cw.100.t:0 "The Other Side of the Leaflet"
 ADISCORD_STP_cw.100.d:0 "The press stopped in the school basement before dawn. The girl at the roller held up the last clean sheet and looked at the two unfinished bundles. More paper was supposed to arrive during the night. The driver had not appeared. The teacher who had lent the underground the room quietly opened a cupboard and brought out old handwriting books. Children's names remained on some of the pages.\n\nThe typesetter suggested trimming the margins. The teacher objected that the appeal would no longer fit. They rearranged the lines until they decided to leave everything: on one side, the names of people killed in the mountains and words about the price of the Party's peace, on the other, an uneven 'I live in Stelander'. Ink showed through the thin paper. The youngest courier read both sides and laughed for the first time that night.\n\nThe bundles disappeared into tool bags, coat linings and empty crates. No courier knew the entire road to Fada. Each had only the next address and the person who should receive the parcel. On the streets where the leaflets appeared, people would read quickly, sometimes before trampling them underfoot or hiding them in a sleeve.\n\nThe teacher kept one spoiled page. Below the appeal, a child had once written: 'The weather will be fine tomorrow'. He put it in his register and went to open the classroom. The lesson would begin on time, if the pupils could reach it."
 ADISCORD_STP_cw.100.a:0 "Read it first. Then pass it on."
 ADISCORD_STP_cw.101.t:0 "People from the Passes"
 ADISCORD_STP_cw.101.d:0 "The village elders arrived before the officers. One brought a sack of dried apples, another left a shovel at the door: he had spent the morning clearing the road and had not been home. Arrows covered the map on the table. The elders began laying small lists of names over them. Shabrat asked them to leave room for the roads. An old man replied that these were the roads: here was the driver, here the blacksmith, here two families where horses could be changed.\n\nThe staff had expected to discuss reinforcements. Instead they had to consider who would mend a bridge, who would stay with the sick and whether a detachment could release the only miller for three days. An officer said a war could not follow a village calendar. The elder looked up. His village had no other calendar. Miss the season, and snow would close the pass regardless of orders.\n\nShabrat spread the map wider and began writing local names beside the routes. He remembered which old grievance could rally each district, but now discovered how little he knew of its ordinary life. He did not erase the movement arrow: the link with the next district had to be held. Beside it he noted how many people must remain at the mill. Marks appeared that belonged on no military map: a broken watermill, the medic's house, a stretch where children always crossed holding someone's hand.\n\nBy lunchtime the apples were gone. Not every question had been settled, but nobody still spoke of the mountains as empty space between depots. When the elders left, Shabrat kept their lists on the map. The next movement would have to be planned across other people's names."
 ADISCORD_STP_cw.101.a:0 "Someone lives on every road."
 ADISCORD_STP_cw.102.t:0 "A Name Read Aloud"
 ADISCORD_STP_cw.102.d:0 "Two tables stood inside a former ticket office. At one, clerks copied pages of the Black Book that had already been read on the radio. At the other, they helped visitors find names. The first arrivals knew exactly what they were seeking. By noon came those who had spent years persuading themselves there was no point in looking. They stood apart from the curious and barely spoke.\n\nAn elderly woman brought a photograph and a letter returned without explanation. The clerk searched for a name, then an agency, then a transport permit number. The book revealed no answer about her son's fate, only the signature of an official who had allowed a shipment through without inspection. It was not enough. For the first time in years, it was at least something a particular person could be asked to answer for.\n\nAt the other table they argued about which names to print next. A young typesetter wanted the whole list. The woman taking statements covered one page with her hand. It contained witnesses and home addresses. Publishing them would be easier than protecting them afterwards. They kept the names of the firms and the responsible officials' signatures, copying the rest separately for investigation.\n\nBefore closing, the elderly visitor asked to hear the entry again. Not louder, simply from the beginning. The clerk repeated the number, the date and the name. She straightened the edge of the photograph and sat down for the first time that day. Outside, people were still arguing over whether the book would change the war. At this table, it had found another task."
 ADISCORD_STP_cw.102.a:0 "Now the question has an address."
 ADISCORD_STP_cw.103.t:0 "The Number on the Crate"
 ADISCORD_STP_cw.103.d:0 "The loaders knew weapons had arrived when the quartermaster stopped making jokes. He walked around the truck, checked the seals and counted the long crates twice. Men waiting for rifles gathered at the gate but were asked to stand back: inspection came first. The foreign officer spoke calmly and kept returning to the same number on the delivery note.\n\nThe local storekeeper found a mountain pass misspelled in the document and corrected it in pencil. The officer asked for the correction to be certified. The storekeeper was surprised: it would not move the road. The officer replied that the road would remain, but the people checking the papers after the war might change. Both fell silent, then found someone with the necessary stamp.\n\nWhen the first lid came off, conversation at the gate stopped. One soldier ran a finger over the metal and withdrew his hand, leaving a dark streak on his sleeve. These weapons could be issued today. There would be no waiting for a workshop to finish another batch of parts. For a few minutes everyone looked only at what had arrived.\n\nThe storekeeper stayed after unloading to count the empty packing. Two documents lay in the folder: the received shipment and an undertaking concerning postwar resource rights. The second had not yet fallen due. He tied them together with one length of string. Tomorrow the crates would disperse among the units, while the folder would remain here. He had to clear a separate place for it on the shelf."
 ADISCORD_STP_cw.103.a:0 "Shipment received. Record retained."
 ADISCORD_STP_cw.104.t:0 "Before the First Snow"
 ADISCORD_STP_cw.104.d:0 "They gathered outside the smithy before daylight. People brought tools that would have no one to use them while their owners served with the detachments. Hammers, saws, a hand drill, an almost new plane. The blacksmith scolded them for putting iron directly on the ground. Then he found an old nail box and began tying an owner's name to every item.\n\nA young miner said anyone could have his pick. The old man disagreed: come back and decide for yourself. They argued about a strap that needed replacing and the current price of good steel. Neither mentioned the war. A truck waited by the road, its driver already starting the engine for the second time to warm the cab.\n\nA woman with two baskets divided food into parcels. Her son helped, too young to leave and old enough to be ashamed of tears. His father told him to keep an eye on the workshop stove. The boy asked until what date. The man looked towards the white line high above the road and answered: until I return. The blacksmith pretended to be busy with a knot.\n\nAfter the truck left, bootprints and a few broken lengths of cord remained in the yard. The old man carried the tools inside and left the far door unlocked. Those staying behind would still have work to do. He hung the plane higher, away from the damp, and checked once more that the slip bearing its owner's name was firmly attached."
 ADISCORD_STP_cw.104.a:0 "The tools will be waiting."
 ADISCORD_STP_cw.105.t:0 "Places at One Table"
 ADISCORD_STP_cw.105.d:0 "Chairs for the congress came from three neighbouring buildings. There were not enough matching ones, and the officer arranging the room wanted to seat the staff separately. Shabrat asked for another bench. An elder, a printing-house representative and a man in a greatcoat sat on it, the last forced to keep his map across his knees.\n\nThe first dispute concerned the appeal's wording. The staff had written that the country followed a single order. A council representative struck out 'order' and wrote 'decision'. The printer asked whose decision. While they searched for words, the woman bringing tea asked them to clear the folders: there was nowhere for the cups. Shabrat moved his first. The others followed.\n\nSeveral hours produced less agreement than the clerks had expected. But they learned why some districts sent supplies late, others distrusted front reports and still others heard the beginning of a requisition in every staff request. Shabrat tried to hurry the speakers. The elder reminded him how long the journey had taken. If they were only allowed to listen again, next time they could send an empty bench. Before the break, Shabrat nevertheless demanded the names of those who would carry the agreed instructions to the detachments. He would not let the delegates leave until the names were given.\n\nBy evening the appeal was shorter. Space remained below for all three sides to sign. As they left, each took their own folder and checked that their comments had not been forgotten. Shabrat stayed to read the final corrections. For the first time all day the hall was quiet, and the silence bore no resemblance to agreement on command."
 ADISCORD_STP_cw.105.a:0 "There must still be places at the table."
 ADISCORD_STP_cw.110.t:0 "The Red Light"
 ADISCORD_STP_cw.110.d:0 "The radio technician arrived with a spare valve and a screwdriver. Management had promised a short address, but three different scripts already lay beside the microphone. Each was marked 'final'. The announcer arranged them by delivery time and asked which to read. The argument continued in the corridor. The technician bent over the control board to avoid hearing who was involved.\n\nThere had always been a pause before Ivanov's addresses. The president settled into his chair, coughed softly and sometimes asked whether they were already recording. The editor removed those seconds from repeats, but everyone in the studio knew them by heart. Now the man behind the glass sat straight and waited for the red light. His script spoke of order, duty and fidelity to peace.\n\nA minute before transmission, another correction arrived. Instead of 'war', he must say 'armed rebellion'. The announcer drew a pencil through the line and checked that he could manage the new sentence in one breath. The technician opened the microphone. For a moment he thought he would hear the familiar cough. A steady, carefully trained voice came through the headphones immediately.\n\nNobody applauded afterwards. A secretary collected the pages, and the announcer asked for water. The technician entered the transmission time and the equipment's condition in the log. Everything worked properly. Before leaving, he switched off the light above the empty chair. State broadcasting continued. Eleven minutes remained until the next programme."
 ADISCORD_STP_cw.110.a:0 "You are listening to the state station."
 ADISCORD_STP_cw.111.t:0 "The Caption"
 ADISCORD_STP_cw.111.d:0 "The correspondent returned from the front with a wet bag, three exposed rolls of film and notes from district editors. The notes described roads and units on both sides of the front. A security officer collected them immediately. In the best photograph, soldiers stood beside an advertisement for an old holiday season. One held a mug, another tried to dry his socks. In the centre a very young soldier looked straight into the lens, as though waiting for the photographer to explain what happened next.\n\nThe editor liked it. He wrote: 'Defenders of peace enjoying a well-earned rest'. The correspondent said they had not been resting. They were waiting for orders, and the mug went round because the other dishes had been lost. The editor set down his pencil. Families needed to see living soldiers, he said. They had enough bad news without the newspaper. That was true, which made it harder to argue.\n\nThen the man checking material arrived. He asked them to remove the unit's name and the location. The correspondent agreed. Next came the torn sleeve, the empty shop window behind the men and the question in the eyes of the boy in the middle. The last could not be altered with a pencil. They chose another frame, in which everyone looked away.\n\nBefore printing, the photographer turned over the first picture and wrote down the names he had managed to learn. The paper would appear with a suitable caption and dignified faces. He put this print in an envelope to send back to the unit. If the address still worked, several families would have a photograph in which they could recognise someone without the editor's explanation."
 ADISCORD_STP_cw.111.a:0 "Keep the names on the back."
 ADISCORD_STP_cw.112.t:0 "After Office Hours"
 ADISCORD_STP_cw.112.d:0 "Five minutes before closing, eleven people still stood in the waiting room. The secretary knew the number precisely: she had told each that the units had not yet replied. A woman by the window held an army photograph. A man beside her brought two certificates with different dates. The last visitor had no papers at all, only her son's name and a description of his winter coat.\n\nThe commission chairman ordered another list of inquiries. He had already sent two and became angry when reminded. Without a unit number, a letter came back. Without a letter, no file could be opened. The secretary asked the woman without documents where the last postcard had come from and found the station's telephone number in an old directory. For a long time nobody answered.\n\nA guard began turning off the corridor lights. The secretary asked him to wait. He grumbled, then brought a chair for the man with the certificates, who had spent the day standing on an injured leg. The chairman came out to see why the visitors had not left and took the second telephone himself. Half an hour produced just one place name. The woman repeated it several times, afraid she would forget.\n\nThey closed later than usual. Nobody went home with a promise of peace, and most questions had to be copied over for tomorrow. The secretary kept the sheet with the station number. In the morning the chairman would again want a report of applications received. For the first time she wanted a separate column: how many people they had managed not to send back to the same closed door."
 ADISCORD_STP_cw.112.a:0 "Reception will begin on time tomorrow."
 ADISCORD_STP_cw.113.t:0 "Fifth on the List"
 ADISCORD_STP_cw.113.d:0 "The new regimental organiser arrived with a case of pamphlets and a tidy uniform. In the barracks they showed him a bunk beside the stove, beneath a window with a particularly strong night draught. He began explaining his work. The sergeant asked him to help with the roster first: on paper the squad had twelve men, but only nine spoons had been needed at supper.\n\nOne was in the infirmary, two had joined another company as replacements. Nobody had recorded the changes. The organiser found their names, corrected the list and heard a question from the corner about the fifth man down. He had received no letters from home for a month and had stopped speaking. The pamphlets explained how to strengthen confidence. His family's address was not in them.\n\nThat evening the organiser sat beside the silent soldier and talked for a long time about his own journey. Then they wrote a short inquiry together. At morning parade he still read the prescribed words about the Party and the country. The men listened a little more closely, though many faces remained wary. The speech remained an assigned duty. The previous evening's conversation had been something else.\n\nAfter lights out, the sergeant brought a blanket to stop the gap in the window. The organiser finished the family inquiry, then opened his report on morale. Beside the same name he wrote: 'Stopped believing communiques after letters ceased'. His superiors required explanations for silence. Beyond the wall, the soldier slept peacefully for the first time in several nights. He knew someone would help him find his family. They had not discussed the second entry."
 ADISCORD_STP_cw.113.a:0 "A person stands behind every line."
 ADISCORD_STP_cw.114.t:0 "The Last Bend"
 ADISCORD_STP_cw.114.d:0 "At the district depot they argued over how many trucks had arrived. The log said four. Three stood outside. The fourth driver finally called from the climb: a broken axle shaft, cargo intact, road blocked. The depot chief ordered the delay recorded. The young dispatcher asked whom that would help at the far end of the route.\n\nNo spare truck was available. A nearby workshop had a tractor, but its owner demanded it back before morning. The drivers were finishing their shifts, and one had to take medicine to his mother. The dispatcher copied the route onto a scrap of cardboard, arranged for someone to deliver the medicine and sent the tractor. It took more conversation than the entire week's ledger had needed paper.\n\nTowards morning the cargo reached the transfer point. The crates were wet, and markings had washed off two. Nobody would accept them unchecked. The driver sat on a step and dozed while the storekeeper opened the lids. When the last crate had been counted, the dispatcher placed a small dot beside the entry. It would not appear in the summary. It meant she could stop calling that address.\n\nThe chief praised the neatly completed log. The girl looked at him, then at the cardboard with its telephone numbers and names. The log mattered, or tomorrow they would lose another truck. But today's work had depended on the man with the tractor, someone staying beyond their shift and a promise to return the machine. She pinned the cardboard above her desk beside the compulsory portrait."
 ADISCORD_STP_cw.114.a:0 "Record the actual arrival."
 ADISCORD_STP_cw.115.t:0 "Two Lines"
 ADISCORD_STP_cw.115.d:0 "Two lights on the joint staff switchboard came on almost together. Commanders of neighbouring sectors wanted the same reserve group. The first was preparing an attack and reminded headquarters that his men had already taken their starting positions. The second needed cover for a withdrawal: delay would prevent his unit getting out before dawn. The operator connected them to different offices. Each returned the same word: 'Priority'.\n\nThe directorate's duty officer ordered both lines kept open. He established how long the reserve needed to travel and when each sector expected its next report. The first commander protested that he had explained everything yesterday. The second initially promised to hold as long as necessary, then gave a much shorter time when asked directly. The operator stopped filing her slips and pressed the earpiece closer.\n\nThe reserve was sent to cover the withdrawal. The planned attack had to wait. The angry commander demanded the name of the person making that decision and received it without hesitation. The officer neither promised other men nor called a cancelled advance a success. He required new communications arrangements and told them to inform their neighbours that the previous plan no longer applied. After a few seconds of silence, the order was repeated aloud.\n\nStatic crackled on the wires for a long time afterwards. The operator caught fragments but did not know whether the group would reach its destination in time. She recorded only the confirmed transmission. Previously each staff could end a call insisting its own request mattered most. Now one had received a refusal for which another office had accepted responsibility under its own name."
 ADISCORD_STP_cw.115.a:0 "An order needs someone to answer for it."
 ADISCORD_STP_pw.10.t:0 "The New Sign"
 ADISCORD_STP_pw.10.d:0 "They nailed the district administration's sign into the old holes. The new board was slightly shorter, leaving pale strips of earlier paint along the edges. Local economic and everyday affairs were passing from the commandant's office to a permanent administration. People already waited outside. A woman wanted to know where to report her missing documents. Two neighbours brought a boundary dispute. A former courier came to ask why his acquaintance had not been admitted ahead of the queue.\n\nThe head of the office knew that courier. During the fighting he had twice guided him along a dangerous road. Now he had to explain that this did not remove the queue. The courier took offence and went outside to smoke. A few minutes later he returned, took a sheet of paper and began his application beside everyone else. Nobody made a speech about it.\n\nThere were too few desks inside, and the only stamp kept sticking. An employee who had worked there under the previous government showed the new secretary how to turn its handle. He asked where unfinished cases were kept. She brought out an entire box. Its requests had survived changing flags, several managers and their own hope of an answer.\n\nBy closing time the box was hardly emptier. But every accepted application bore a date, and each visitor kept a copy naming the office. It was not much yet. Beyond the district there were still enough reasons to speak only of fronts and orders. Here, someone could leave with a paper that allowed them to return and ask what had been done about their request."
 ADISCORD_STP_pw.10.a:0 "Reception will continue tomorrow."
 ADISCORD_STP_pw.11.t:0 "The Stamp after Ivanov"
 ADISCORD_STP_pw.11.d:0 "The district office replaced its forms and removed the signs of two overlapping commissions. Orders were now supposed to arrive through one chain from the presidium, with replies returning the same way. The old forms still carried Ivanov's name below the crest. They were to be burned, but the facilities manager asked for the clean sides as scrap. A tightly wrapped pack of new forms arrived, and the secretary spent a long time squaring it against the desk. Outside waited people to whom the office's title mattered less than getting through its door.\n\nThe manager of a large firm was admitted first. He used a personal acquaintance and left his folder beneath a separate marker. Next came a woman who had repaired uniforms during the war. For the third time she was being asked to prove work already completed. The district chief examined her case and ordered the earlier receipt found. It took nearly an hour. The woman offered no thanks until she had a copy of the answer.\n\nAfter lunch a Party official inspected the staff lists. He underlined some names and asked separately about others. Once he left, the secretary saw the same people still waiting outside. The facilities manager distributed the old forms for rough notes. On the backs of calculations, petitions and explanations, the dead president's name appeared again.\n\nThat evening the chief applied the final stamp and complained that restoring order was harder than writing instructions. The secretary looked at two piles: cases settled and cases deferred. The Party was governing the districts again, but no signature could appeal to a living Father of Peace. Tomorrow's queue would have very particular people to ask."
 ADISCORD_STP_pw.11.a:0 "Now they must answer for themselves."
 ADISCORD_STP_cw.101.absent:0 "The village elders arrived before the officers. One brought a sack of dried apples, another left a shovel at the door: he had spent the morning clearing the road and had not been home. Arrows covered the map on the table. The elders began laying small lists of names over them. The chair asked them to leave room for the roads. An old man replied that these were the roads: here was the driver, here the blacksmith, here two families where horses could be changed.\n\nThe staff had expected to discuss reinforcements. Instead they had to consider who would mend a bridge, who would stay with the sick and whether a detachment could release the only miller for three days. An officer said a war could not follow a village calendar. The elder looked up. His village had no other calendar. Miss the season, and snow would close the pass regardless of orders.\n\nThe chair spread the map wider and asked the secretary to write local names beside the routes. Some were new to the staff. Marks appeared that belonged on no military map: a broken watermill, the medic's house, a stretch where children always crossed holding someone's hand.\n\nBy lunchtime the apples were gone. Not every question had been settled, but nobody still spoke of the mountains as empty space between depots. When the elders left, the secretary suggested filing their lists with the minutes. The chair kept the papers on the map. The next movement would have to be planned across other people's names."
 ADISCORD_STP_cw.105.absent:0 "Chairs for the congress came from three neighbouring buildings. There were not enough matching ones, and the officer arranging the room wanted to seat the staff separately. The chair of the meeting asked for another bench. An elder, a printing-house representative and a man in a greatcoat sat on it, the last forced to keep his map across his knees.\n\nThe first dispute concerned the appeal's wording. The staff had written that the country followed a single order. A council representative struck out 'order' and wrote 'decision'. The printer asked whose decision. While they searched for words, the woman bringing tea asked them to clear the folders: there was nowhere for the cups. The chair moved his first. The others followed.\n\nSeveral hours produced less agreement than the clerks had expected. But they learned why some districts sent supplies late, others distrusted front reports and still others heard the beginning of a requisition in every staff request. The secretary tried to hurry the speakers. The elder reminded him how long the journey had taken. If they were only allowed to listen again, next time they could send an empty bench. The chair ordered the minutes continued.\n\nBy evening the appeal was shorter. Space remained below for all three sides to sign. As they left, each took their own folder and checked that their comments had not been forgotten. The chair stayed to read the final corrections. For the first time all day the hall was quiet, and the silence bore no resemblance to agreement on command."

 # Sotnikov: military districts and frontier settlement
 STP_pc_sdir_occidia_campaign:0 "One Command for Occidia"
 STP_pc_sdir_occidia_campaign_desc:0 "The union councils held their lands while Stelander fell apart. Sotnikov recognises their service, but not the right of a separate headquarters to command the western ports and mines. The directorate will prepare to incorporate Occidia and openly revoke earlier promises of independence."
 STP_pc_sdir_central_command:0 "A Single Headquarters"
 STP_pc_sdir_central_command_desc:0 "Arsenals and shipyards will serve national orders first. The centre receives a larger share of district industry and can concentrate it on a chosen campaign. Commanders retain their local administrations, but have fewer resources of their own."
 STP_pc_sdir_field_compacts:0 "Compacts with the Commanders"
 STP_pc_sdir_field_compacts_desc:0 "Commanders will retain more factories and workshops to sustain their districts and rebuild local economies. Their oath and military subordination remain, but headquarters receives a smaller industrial share. Sotnikov will have to govern officers who possess means of their own."
 STP_pc_sdir_arsenal_programme:0 "An Order for the Arsenal District"
 STP_pc_sdir_arsenal_programme_desc:0 "Dopotoydron and the Zeigen workshops must manufacture equipment against a common order, supported by the economies of Spastlant and Zoilong. A funded supply programme will let the district command approve a contract and deliver completed equipment to headquarters."
 STP_pc_sdir_naval_programme:0 "An Order for the Naval District"
 STP_pc_sdir_naval_programme_desc:0 "Cussington's shipyards and depots will support common logistics. A funded order will provide transport by sea and land; the contractor must accept and complete it before headquarters can count the promised deliveries."
 STP_pc_sdir_rear_reconstruction:0 "The Rear under Direct Administration"
 STP_pc_sdir_rear_reconstruction_desc:0 "Irim, the Borderlands and Erstantpeo remain under direct directory administration. Spastlant and Zoilong have been assigned to the Arsenal District along with responsibility for supporting its industrial regions. Centrally funded infrastructure projects will concentrate on the direct rear, where Stelander owns the land and can keep the construction site secure."
 STP_sdir_central_command_tt:0 "Both military districts adopt central headquarters rule: the central share rises from §Y35%§! to §Y45%§! of military factories and from §Y20%§! to §Y25%§! of civilian factories. Districts retain less industry of their own. The manpower share for overlord formations remains §Y45%§!; independent autonomy promotion is closed."
 STP_sdir_field_compacts_tt:0 "Both military districts adopt commander compacts: the centre receives §Y15%§! of military factories and §Y10%§! of civilian factories. The districts retain the remaining industry. The manpower share for overlord formations remains §Y45%§!; independent autonomy promotion is closed."
 STP_sdir_map_settled_tt:0 "Occidia and the direct administration territories are incorporated and controlled by Stelander; Spastlant and Zoilong belong to the Arsenal District, and both military districts control their centres; the subordinate Bezhaysk Administration owns and controls its capital"
 STP_sdir_cannibal_lands_secured_tt:0 "Medron, Antolla, Farein, Himber, Heland, Milham, Kilnet and Hebtava are owned and controlled by Steland"
 STP_sdir_arsenal_delivered_tt:0 "The funded arsenal order has been delivered"
 STP_sdir_naval_delivered_tt:0 "The funded naval order has been delivered"
 STS_sword_directory:0 "Stelander Directorate"
 STS_sword_directory_DEF:0 "the Stelander Directorate"
 STS_sword_directory_ADJ:0 "Stelander"
 VAL_STS_arsenal_district:0 "Arsenal District"
 VAL_STS_arsenal_district_DEF:0 "the Arsenal District"
 VAL_STS_arsenal_district_ADJ:0 "Arsenal"
 NOD_STS_naval_district:0 "Northern Naval District"
 NOD_STS_naval_district_DEF:0 "the Northern Naval District"
 NOD_STS_naval_district_ADJ:0 "Northern Naval"
 STP_sdir_request_arsenal_programme:0 "Place an Arsenal Order"
 STP_sdir_request_arsenal_programme_desc:0 "Order §Y900§! £infantry_equipment_texticon and §Y100§! £support_equipment_texticon for §Y300§! £ADISCORD_economy_treasury_texticon. Production takes §Y21 days§!. A district order is charged only after its consent; refusal or insufficient funds at the reply closes the request without payment. An order at our own site is paid immediately. Only one arsenal request or funded order may be pending. Interrupted work refunds the full price."
 STP_sdir_request_naval_programme:0 "Place a Naval Order"
 STP_sdir_request_naval_programme_desc:0 "Order §Y20§! £convoy_texticon and §Y50§! £motorized_texticon for §Y300§! £ADISCORD_economy_treasury_texticon. Production takes §Y21 days§!. A district order is charged only after its consent; refusal or insufficient funds at the reply closes the request without payment. An order at our own site is paid immediately. Only one naval request or funded order may be pending. Interrupted work refunds the full price."
 STP_sdir_arsenal_work:0 "Manufacturing the Arsenal Order"
 STP_sdir_arsenal_work_desc:0 "Production is funded: after §Y21 days§!, Steland receives §G900§! £infantry_equipment_texticon and §G100§! £support_equipment_texticon. Dopotoydron must remain our owned and controlled site or a controlled territory of our arsenal subject. Failed conditions refund §Y300§! £ADISCORD_economy_treasury_texticon."
 STP_sdir_naval_work:0 "Manufacturing the Naval Order"
 STP_sdir_naval_work_desc:0 "Production is funded: after §Y21 days§!, Steland receives §G20§! £convoy_texticon and §G50§! £motorized_texticon. Cussington must remain our owned and controlled site or a controlled territory of our naval subject. Failed conditions refund §Y300§! £ADISCORD_economy_treasury_texticon."
 STP_sdir_programme_cost:0 "§Y300§! £ADISCORD_economy_treasury_texticon"
 STP_sdir_programme_cost_blocked:0 "§R300§! £ADISCORD_economy_treasury_texticon"
 STP_sdir_programme_cost_tooltip:0 "Price: §Y300§! £ADISCORD_economy_treasury_texticon. An order to a subject district is paid after its consent; domestic orders and rear projects are paid immediately."
 STP_sdir_arsenal_result_tt:0 "After agreement and payment, Steland receives §G900§! £infantry_equipment_texticon and §G100§! £support_equipment_texticon in §Y21 days§!. An interrupted funded order refunds its full price."
 STP_sdir_naval_result_tt:0 "After agreement and payment, Steland receives §G20§! £convoy_texticon and §G50§! £motorized_texticon in §Y21 days§!. An interrupted funded order refunds its full price."
 STP_sdir_programme_idle_tt:0 "This programme has no request awaiting a reply and no funded order in progress"
 STP_sdir_arsenal_site_tt:0 "Dopotoydron is owned and controlled by Steland, or controlled by its arsenal subject"
 STP_sdir_naval_site_tt:0 "Cussington is owned and controlled by Steland, or controlled by its naval subject"
 STP_sdir_rebuild_rear:0 "Develop Infrastructure: [FROM.GetName]"
 STP_sdir_rebuild_rear_desc:0 "Spend §Y300§! £ADISCORD_economy_treasury_texticon to build §G1§! infrastructure level in [FROM.GetName] over §Y21 days§!. Projects are available in owned and controlled Irim, the Borderlands and Erstantpeo with infrastructure below §Y5§!. Each region may have one funded project at a time; development can continue after completion. Losing the site or failing the conditions refunds the full payment."
 STP_sdir_rear_result_tt:0 "After §Y21 days§!: §G+1§! infrastructure level at the selected site, up to level §Y5§!. Losing the site or failing the conditions refunds §Y300§! £ADISCORD_economy_treasury_texticon."
 STP_sdir_refund_tt:0 "The full payment for the unfinished programme is returned to Steland."
 STP_sdir_rear_site_tt:0 "The site is owned and controlled Irim, the Borderlands or Erstantpeo, with infrastructure below 5 and no other funded project"
 ADISCORD_STP_pc.86.t:0 "An Order from Headquarters"
 ADISCORD_STP_pc.86.d:0 "The arsenal administration has received a new order. Headquarters requests 900 infantry equipment and 100 support equipment to be manufactured within 21 days. It will provide 300 treasury after our consent.\n\nThe workshop superintendent checked the order against the shift roster. This is new production; weapons already issued to units will remain with them. The order will bind Dopotoydron to the directorate's common supply system, but the district must accept it first.\n\nA signature confirms our agreement to deliver. If headquarters cannot pay when we reply, or the agreement is no longer valid, production will not begin."
 ADISCORD_STP_pc.86.a:0 "Accept the manufacturing order."
 ADISCORD_STP_pc.86.b:0 "Decline the order."
 ADISCORD_STP_pc.86.c:0 "The request is no longer valid."
 ADISCORD_STP_pc.87.t:0 "Shipyards for Common Service"
 ADISCORD_STP_pc.87.d:0 "Cussington command has received a proposal from headquarters: prepare 20 convoys and 50 trucks within 21 days. The directorate will fund production with 300 treasury only after our consent.\n\nTwo schedules lie on the desk - shipyard work and land transport assembly. Until now, each office reported only to its own superior. One common headquarters will now receive the completed delivery. The contract does not requisition existing stocks.\n\nThe commander may accept or decline. An invalid agreement or insufficient funds at headquarters will not create an unpaid obligation."
 ADISCORD_STP_pc.87.a:0 "Accept the transport order."
 ADISCORD_STP_pc.87.b:0 "Decline the order."
 ADISCORD_STP_pc.87.c:0 "The request is no longer valid."
 STP_pc_cannibal_campaign:0 "Secure the Cannibal Frontier"
 STP_pc_cannibal_campaign_desc:0 "Border settlements cannot recover while neighbouring tribal domains live by raiding. We will prepare a joint campaign against the remaining independent cannibal states. Victory must establish real administration of the land, not merely a new name on the staff map."
 STP_pc_cannibal_campaign_tt:0 "Starts one common war against all remaining independent and peaceful cannibal states. Every participant must be defeated before the full settlement. Territories and subjects of third countries are not targets of this campaign."
 STP_pc_cannibal_campaign_government_tt:0 "An independent postwar Stelander or Steland government can conduct reconstruction, has not capitulated and is at peace"
 STP_pc_cannibal_targets_available_tt:0 "At least one independent cannibal state remains; all such targets are at peace and outside our faction"
 STP_pc_cannibal_campaign_annex_tt:0 "After victory, the cannibal lands are incorporated directly into Steland. No separate northern administration is created."
 STP_pc_cannibal_campaign_subjects_tt:0 "After victory, local governments become subject administrations on their own territories."
 STP_pc_sdir_command_register:0 "Register of Commands"
 STP_pc_sdir_command_register_desc:0 "An order signed at headquarters must reach a responsible officer in every district. Active staffs, depots and civilian offices will enter one register of authority. Sotnikov gains the means to appoint those responsible, and commanders receive defined jurisdictions."
 STP_pc_sdir_military_prosecution:0 "A Prosecutor at Every Headquarters"
 STP_pc_sdir_military_prosecution_desc:0 "Victory does not exempt an officer from answering for an order. Military prosecutors will examine commanders' cases under an established procedure. This supports unit recovery, but training takes longer: authority must be learned as thoroughly as drill regulations. A common procedure will reduce district office spending on endless competing investigations."
 STP_pc_sdir_field_courts:0 "Courts with the Columns"
 STP_pc_sdir_field_courts_desc:0 "Military authority will not wait for every case to reach the capital. Field courts will follow the commands, speeding decisions and sustaining the will to continue the war. The population pays for this speed with less confidence in tomorrow. While retaining the existing military order, Sotnikov will assign permanent judicial teams to headquarters: disputes over authority must no longer delay operational planning."
 STP_pc_sdir_district_audit:0 "Audit the District Accounts"
 STP_pc_sdir_district_audit_desc:0 "Some ledgers list depots that were never built; others omit workshops already operating. Inspectors will compare requests with actual expenditure. The common treasury must fund institutions that exist, rather than signatures from influential commanders."
 STP_pc_sdir_service_records:0 "Records of Public Service"
 STP_pc_sdir_service_records_desc:0 "A former courier may administer a settlement, but a wartime biography cannot replace records of their work. Standard service files and a formal handover procedure will let district institutions grow without losing their obligations whenever a commander changes."
 STP_pc_sdir_officer_college:0 "The Directorate College"
 STP_pc_sdir_officer_college_desc:0 "Headquarters needs officers who can read a budget, a signals plan and a production drawing. Teachers and research groups will form a directorate college. Its laboratories open another research programme while the total remains below six."
 STP_pc_sdir_signal_corps:0 "Signals Corps"
 STP_pc_sdir_signal_corps_desc:0 "District armies must hear the same order even where civilian lines have been destroyed. Equipped signals nodes and standard staff electronics will give separate formations a common language of command."
 STP_pc_sdir_motor_columns:0 "Permanent Motor Columns"
 STP_pc_sdir_motor_columns_desc:0 "Supply will no longer depend on whatever transport remains after mobilisation. Permanent columns will receive vehicles and technical services. Both field formations and district levies need logistics beyond their home depots."
 STP_pc_sdir_mobile_operations:0 "Mobile Operations"
 STP_pc_sdir_mobile_operations_desc:0 "Sotnikov will let staffs shift the main effort quickly. Economical supply and prepared operational alternatives support movement between sectors. This chooses manoeuvre over prolonged reliance on a single position."
 STP_pc_sdir_prepared_positions:0 "An Army of Prepared Lines"
 STP_pc_sdir_prepared_positions_desc:0 "Every unit will know its assigned line, fallback sector and relief procedure. Headquarters will concentrate on cohesion and recovery after battle. Advances will rest on secured positions rather than continuous manoeuvre."
 STP_pc_sdir_forward_airfields:0 "Forward Airfields"
 STP_pc_sdir_forward_airfields_desc:0 "The coming campaigns need airfields close to the future front. A funded programme will expand air bases in the original Stelander regions and newly incorporated lands under direct administration. Headquarters selects the site, and construction begins only after money and vehicles are committed."
 STP_pc_sdir_integrated_staff:0 "Air and Ground in One Plan"
 STP_pc_sdir_integrated_staff_desc:0 "Pilots have often received their maps only after ground formations reached the line. Joint exercises and aviation research will combine reconnaissance, sortie preparation and advancing columns in one operational plan."
 STP_pc_sdir_arsenal_standards:0 "A Common Weapons Standard"
 STP_pc_sdir_arsenal_standards_desc:0 "A rifle must match the ammunition depot, and a spare part must fit the weapon in the next district. Common requirements and test results will let arsenals abandon incompatible habits inherited from the former armies."
 STP_pc_sdir_arsenal_machine_tools:0 "Standard Machine Tools"
 STP_pc_sdir_arsenal_machine_tools_desc:0 "An identical drawing does not guarantee an identical part. Engineers will standardise tooling and inspect production lines, allowing factories to expand output steadily instead of relearning each new order."
 STP_pc_sdir_arsenal_acceptance:0 "Accept and Expand the Arsenal"
 STP_pc_sdir_arsenal_acceptance_desc:0 "The first funded order must reach the troops before headquarters authorises expansion at Dopotoydron. Once delivery is verified, an additional military factory will be built at the controlled site. The country owning the arsenal receives the factory."
 STP_pc_sdir_naval_signals:0 "Common Naval Signals"
 STP_pc_sdir_naval_signals_desc:0 "Port administrations and ships must use one signalling system. Exercises and improved signals training will bring Cussington into the common command without requiring a separate order for every departure."
 STP_pc_sdir_convoy_escorts:0 "Escort Service"
 STP_pc_sdir_convoy_escorts_desc:0 "A delivery exists only when its cargo reaches the recipient. Additional convoys and naval research will support escort duties and protected communications. The district must answer for the whole journey, not merely departure from port."
 STP_pc_sdir_naval_repair_yards:0 "Cussington Repair Yards"
 STP_pc_sdir_naval_repair_yards_desc:0 "A completed transport order demonstrates that naval administration can deliver its commitments. Following acceptance, Cussington will gain one dockyard. It remains with the port owner, serving either the district fleet or direct central command."
 STP_pc_sdir_annexed_registers:0 "Citizenship for Incorporated Lands"
 STP_pc_sdir_annexed_registers_desc:0 "The map already uses one colour, but local institutions still operate under different rules. We will allocate §Y150§! £political_power_texticon for three regional integration procedures. A record of ownership must become a functioning civic order."
 STP_pc_sdir_covered_frontier:0 "Cover the New Frontier"
 STP_pc_sdir_covered_frontier_desc:0 "The incorporated regions need protection against air attack first. Headquarters will open a funded district air defence programme. Development resources will secure the frontier; a separate civilian workshop programme remains the alternative."
 STP_pc_sdir_return_to_work:0 "Return People to the Workshops"
 STP_pc_sdir_return_to_work_desc:0 "Territory must be held by more than garrisons. Funded civilian workshops will open across the incorporated lands. Employment and reliable supply take priority over a separate frontier air defence programme."
 STP_pc_sdir_fuel_depots:0 "Fuel for the Common Rear"
 STP_pc_sdir_fuel_depots_desc:0 "Irem's stocks and the western workshops no longer serve a separate military patron. Their work will enter a common fuel plan, with replenished reserves and industrial research into storage and processing."
 STP_pc_sdir_school_network:0 "District Technical Schools"
 STP_pc_sdir_school_network_desc:0 "The new territories need mechanics, clerks and technicians who will remain locally. District technical schools will connect training with operating enterprises and share useful industrial knowledge throughout the directorate."
 STP_pc_sdir_integrated_rear:0 "A Rear We Can Sustain"
 STP_pc_sdir_integrated_rear_desc:0 "The chosen frontier programme, fuel reserves and technical training must operate together. Coordinated orders and deliveries will let direct administration sustain the expanded territory without constantly requisitioning everything produced locally."
 STP_sdir_arsenal_expansion_site_tt:0 "Dopotoydron is owned and controlled by Steland or its arsenal subject, with a free military factory slot"
 STP_sdir_naval_expansion_site_tt:0 "Cussington is owned and controlled by Steland or its naval subject, with a free dockyard slot"
 STP_sdir_air_defence_project:0 "District air defence: [FROM.GetName]"
 STP_sdir_forward_airfield:0 "Forward airfield: [FROM.GetName]"
 STP_sdir_civil_workshop:0 "Civilian workshops: [FROM.GetName]"
 STP_sdir_air_defence_project_desc:0 "Spend §Y350§! £ADISCORD_economy_treasury_texticon and §Y100§! £support_equipment_texticon to establish air defence in [FROM.GetName]. After §Y28 days§!, build up to §G2§! state anti-air levels, up to a maximum of §Y5§!. Funds and equipment are reserved when work starts. One district construction project per state; different states may work concurrently. Losing the site, the end of directory rule or a filled building limit returns the entire payment."
 STP_sdir_forward_airfield_desc:0 "Spend §Y600§! £ADISCORD_economy_treasury_texticon and §Y200§! £motorized_texticon to prepare a forward airfield in [FROM.GetName]. After §Y35 days§!, build up to §G2§! air-base levels, up to a maximum of §Y10§!. Funds and trucks are reserved when work starts. One district construction project per state; different states may work concurrently. Losing the site, the end of directory rule or a filled building limit returns the entire payment."
 STP_sdir_civil_workshop_desc:0 "Spend §Y900§! £ADISCORD_economy_treasury_texticon and §Y100§! £support_equipment_texticon to open civilian workshops in [FROM.GetName]. After §Y42 days§!, build §G1§! civilian factory. A free building slot is required at payment and delivery. Funds and equipment are reserved when work starts. One district construction project per state; different states may work concurrently. Losing the site, the end of directory rule or no free slot at delivery returns the entire payment."
 STP_sdir_air_defence_project_cost:0 "§Y350§! £ADISCORD_economy_treasury_texticon §Y100§! £support_equipment_texticon"
 STP_sdir_air_defence_project_cost_blocked:0 "§R350§! £ADISCORD_economy_treasury_texticon §R100§! £support_equipment_texticon"
 STP_sdir_air_defence_project_cost_tooltip:0 "Cost: §Y350§! £ADISCORD_economy_treasury_texticon §Y100§! £support_equipment_texticon."
 STP_sdir_forward_airfield_cost:0 "§Y600§! £ADISCORD_economy_treasury_texticon §Y200§! £motorized_texticon"
