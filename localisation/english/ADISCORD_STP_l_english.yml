 STP_cw_open_local_depots_desc:0 "District committees will send available departmental and militia stocks to the front. The main reserve remains in Abila's depots: it must be sorted and evacuated while we retain control of the district."
 STP_cw_war_fund:0 "Resistance war fund"
 STP_cw_war_fund_desc:0 "Pool supporters' donations and district committee contributions in a war fund. Three installments force headquarters to choose what to finance first: rifle repairs, aircraft or arsenal expansion."
 STP_cw_treasury_6000_tt:0 "The treasury will receive £ADISCORD_economy_treasury_texticon §G6000§! monetary units."
 STP_cw_evacuate_depot: "Trains from Abila"
 STP_cw_evacuate_depot_desc: "Evacuate the remaining §Y50000§! £infantry_equipment_texticon over §Y35 days§!. Abila must remain owned and controlled throughout. Losing the district cancels delivery; recapturing it allows a fresh attempt. The programme closes when the war ends."
