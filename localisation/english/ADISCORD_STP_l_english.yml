 STP_pe_trade_crisis_desc:0 "The dispute has halted fulfilment of obligations. Complete the unlocked programme or choose a settlement in the event."
 STP_pe_trade_backlash:0 "State Guarantees to Contractors"
 STP_pe_trade_backlash_desc:0 "The dispute was settled through temporary concessions. Their cost survives a change of party leader."
