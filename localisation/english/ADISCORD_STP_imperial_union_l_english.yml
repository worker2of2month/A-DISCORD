 STP_imperial_union_category: "Stelander Imperial Union"
 STP_imperial_union_category_desc: "Kefreyt was the last external power capable of blocking Shabrat's imperial project. Once Kefreyt is defeated, Steland can formalize the new order as the Stelander Imperial Union."
