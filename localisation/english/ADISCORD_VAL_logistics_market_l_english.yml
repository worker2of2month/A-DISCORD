l_english:
 VAL_trade_corridors: "Contract Corridors"
 VAL_trade_corridors_desc: "Kefreyt can no longer treat trade as a line in a ledger. Cargo must physically pass through ports, depots, passes and dependent administrations.\n\nOperational corridors: §Y[?VAL_trade_corridors_active|0]/[?VAL_trade_corridors_capacity|0]§! commissioned\nRoute security: §Y[?VAL_corridor_security|0]/3§!\nGrey-market pressure: §Y[?VAL_black_market_pressure|0]/100§!\n\nEach open route brings §G20§! to the treasury every week. An upgraded route adds another §G10§!. A route only becomes an obligation after it has actually opened once; losing a key node thereafter stops the payment and feeds smuggling."

 VAL_population_markets: "People and Grey Markets"
 VAL_population_markets_desc: "Wars around Kefreyt and the opening of the Perimeter force families to leave their homes.\n\nDisplaced population: §Y[?VAL_displaced_population|0]§! × 10,000 people\nGrey-market pressure: §Y[?VAL_black_market_pressure|0]/100§!\n\nThe Stelander and Vorkerland wars, other regional wars and the opening of the Perimeter each create a bounded §Y180-day§! admission window. Up to §Ythree waves of 100,000§! refugees can be admitted from each source at §Y30-day§! intervals. Admitted people enter the displaced-population pool until they are resettled, employed, trained or returned."

 VAL_logistics_cost_50: "£ADISCORD_economy_treasury_texticon  §Y50§!"
 VAL_logistics_cost_100: "£ADISCORD_economy_treasury_texticon  §Y100§!"
 VAL_logistics_cost_250: "£ADISCORD_economy_treasury_texticon  §Y250§!"

 VAL_invest_occidian_corridor: "Capitalize the Occidian Trunk"
 VAL_invest_occidian_corridor_desc: "A §Y90-day§! project costing £ADISCORD_economy_treasury_texticon §Y750§!. +1 infrastructure in [43.GetName], [44.GetName] and [88.GetName]; the railway from [43.GetName] to [88.GetName] reaches level 3. An operational route earns §G10§! more per week. Only one corridor can be built at a time. Losing the route or capitulating cancels the project and refunds payment."
 VAL_invest_northern_corridor: "Reinforce the Northern Resource Belt"
 VAL_invest_northern_corridor_desc: "A §Y120-day§! project costing £ADISCORD_economy_treasury_texticon §Y1000§!. +1 infrastructure in [59.GetName], [60.GetName] and [61.GetName]; add 2 steel in [59.GetName] and 2 tungsten in [61.GetName]. An operational route earns §G10§! more per week. Only one corridor can be built at a time. Losing the route or capitulating cancels the project and refunds payment."
 VAL_invest_stelander_corridor: "Rebuild the Stelander Road"
 VAL_invest_stelander_corridor_desc: "A §Y60-day§! project costing £ADISCORD_economy_treasury_texticon §Y500§!. +1 infrastructure and +1 building slot in each of [29.GetName] and [46.GetName]. An operational route earns §G10§! more per week. Only one corridor can be built at a time. Losing the route or capitulating cancels the project and refunds payment."
 VAL_invest_vorkerland_corridor: "Restore the Old Vorkerland Channel"
 VAL_invest_vorkerland_corridor_desc: "A §Y75-day§! project costing £ADISCORD_economy_treasury_texticon §Y500§!. +1 infrastructure in [33.GetName]; grey-market pressure falls by 10. An operational route earns §G10§! more per week. Only one corridor can be built at a time. Losing the route or capitulating cancels the project and refunds payment."
 VAL_secure_trade_columns: "Contract Security Columns"
 VAL_secure_trade_columns_desc: "Hire convoy companies, warehouse auditors and road patrols. Every security level reduces weekly grey-market growth, while the operation immediately lowers pressure by §G5§!."
 VAL_open_emergency_bypass: "Open an Emergency Bypass"
 VAL_open_emergency_bypass_desc: "While a previously operational corridor is cut, brokers can assemble an expensive temporary chain of minor roads, river crossings and private depots. For §Y56 days§! it recovers §G20§! of weekly income, while feeding the grey market."

 VAL_close_refugee_border: "Close the Refugee Border"
 VAL_close_refugee_border_desc: "Suspend admission of new refugee groups, including outstanding offers. Border restrictions also reduce legal trade."
 VAL_open_refugee_border: "Reopen the Crossings"
 VAL_open_refugee_border_desc: "Restore trade and allow admission through offers that are still open. Reopening the border does not create new refugee waves."
 VAL_contract_refugee_labor: "Offer Work Contracts"
 VAL_contract_refugee_labor_desc: "Offer work contracts to §Y100,000§! displaced people. Gain §G2,500§! manpower and a construction bonus for §Y90 days§!."
 VAL_fund_resettlement_depots: "Resettle Refugees in [FROM.GetName]"
 VAL_fund_resettlement_depots_desc: "Move §Y100,000§! admitted refugees into [FROM.GetName] for §Y250§! treasury. The state gains §G100,000 permanent population§!. This program is limited to selected low-population Kefreyt home regions under our control, cannot operate while pollution reclamation is unfinished, and can be used only once per region."
 VAL_organize_refugee_return: "Organize Refugee Return"
 VAL_organize_refugee_return_desc: "Once regional wars end, arrange the safe return of §Y150,000§! people for §Y35§! political power. This relieves the resettlement system without granting stability or political power."
 VAL_license_grey_brokers: "License the Grey Brokers"
 VAL_license_grey_brokers_desc: "Do not destroy the underground network; make it pay for permission to operate. The treasury immediately receives §G50§!, while grey-market pressure rises by §R15§!."
 VAL_buy_contraband_arms: "Buy Arms Off the Ledger"
 VAL_buy_contraband_arms_desc: "When official corridors are overloaded or cut, private brokers can push weapons back onto the market. For §Y250§! treasury we receive §G1,500§! infantry weapons at the cost of §R10§! grey-market pressure."
 VAL_audit_broker_houses: "Audit the Broker Houses"
 VAL_audit_broker_houses_desc: "A joint treasury, military-police and contract-court operation will shut down the most brazen schemes. Grey-market pressure falls by §G25§!, but the operation costs §Y250§!."

 VAL_corridor_network_fragmented: "Fragmented Contract Network"
 VAL_corridor_network_fragmented_desc: "Most commissioned trade arteries are cut, or the network is still too narrow for dependable turnover."
 VAL_corridor_network_partial: "Working Contract Network"
 VAL_corridor_network_partial_desc: "Operational trunk routes are functioning reliably, but the system still depends on vulnerable individual nodes."
 VAL_corridor_network_integrated: "Integrated Contract Network"
 VAL_corridor_network_integrated_desc: "Occidia, the north, Stelander and the old Vorkerland channel have been joined into one commercial system."

 VAL_emergency_bypass: "Emergency Bypass Routes"
 VAL_emergency_bypass_desc: "A temporary web of private depots and minor roads keeps turnover alive while a primary corridor is closed."
 VAL_black_market_low: "Shadow Commerce"
 VAL_black_market_low_desc: "A small grey market covers isolated supply failures and even produces revenue, but requires growing administrative attention."
 VAL_black_market_high: "Parallel Economy"
 VAL_black_market_high_desc: "Smugglers now service a meaningful share of commerce. Money flows, but so do corruption, false invoices and illegal armed networks."
 VAL_black_market_crisis: "A State of Two Ledgers"
 VAL_black_market_crisis_desc: "Official and underground economies have become near-peers. The treasury still receives money, but the state increasingly does not know who actually controls goods, weapons and people."
 VAL_refugee_strain: "Overloaded Resettlement System"
 VAL_refugee_strain_desc: "Too many displaced people depend at once on Kefreyt's housing, transport, medical and food systems."
 VAL_closed_border_regime: "Closed Crossings"
 VAL_closed_border_regime_desc: "The emergency border regime reduces population inflow but delays legitimate deals as well."
 VAL_refugee_contract_labor: "Contracts for the Displaced"
 VAL_refugee_contract_labor_desc: "Part of the displaced population has received formal work contracts and entered construction and industrial projects."

 VAL_refugee_admission_tt: "Admit §Y100,000§! refugees. Grey-market pressure: §R+5§!."

 VAL_refugee_border_open_tt: "The border is open to refugees"

 VAL_refugee_capacity_tt:0 "There is room for another §Y100,000§! people, including those reserved for training."

 VAL_accept_vorkerland_refugees: "Admit Refugees from Vorkerland"

 VAL_accept_vorkerland_refugees_desc:0 "Admit another wave of §Y100,000§! refugees for §Y250§! coins. Up to §Ythree waves§! from this region may be accepted at §Y30-day§! intervals within §Y180 days§! of the border opening while the threat persists. Each wave raises grey-market pressure by §R5§!. Admission alone does not grant army manpower: volunteers must be trained."

 VAL_accept_stelander_refugees: "Admit Refugees from Stelander"

 VAL_accept_stelander_refugees_desc:0 "Admit another wave of §Y100,000§! refugees for §Y250§! coins. Up to §Ythree waves§! from this region may be accepted at §Y30-day§! intervals within §Y180 days§! of the border opening while the threat persists. Each wave raises grey-market pressure by §R5§!. Admission alone does not grant army manpower: volunteers must be trained."

 VAL_accept_nodrul_refugees: "Admit Refugees from Nodrul"

 VAL_accept_nodrul_refugees_desc:0 "Admit another wave of §Y100,000§! refugees for §Y250§! coins. Up to §Ythree waves§! from this region may be accepted at §Y30-day§! intervals within §Y180 days§! of the border opening while the threat persists. Each wave raises grey-market pressure by §R5§!. Admission alone does not grant army manpower: volunteers must be trained."

 VAL_accept_north_refugees: "Admit Refugees from the Northern Countries"

 VAL_accept_north_refugees_desc:0 "Admit another wave of §Y100,000§! refugees for §Y250§! coins. Up to §Ythree waves§! from this region may be accepted at §Y30-day§! intervals within §Y180 days§! of the border opening while the threat persists. Each wave raises grey-market pressure by §R5§!. Admission alone does not grant army manpower: volunteers must be trained."
 VAL_accept_perimeter_refugees: "Admit Refugees from Beyond the Perimeter"
 VAL_accept_perimeter_refugees_desc:0 "The opening of the Perimeter creates one §Y180-day§! admission window. Admit another wave of §Y100,000§! refugees for §Y250§! coins. Up to §Ythree waves§! may be accepted at §Y30-day§! intervals. Each wave raises grey-market pressure by §R5§!."
 VAL_refugee_resettlement_result_tt:0 "§Y100,000§! displaced people settle permanently in §Y[FROM.GetName]§!."
