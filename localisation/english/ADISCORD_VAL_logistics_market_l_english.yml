 VAL_refugee_wave_limit_tt:0 "Fewer than three waves have been admitted from this region."
 VAL_train_refugee_volunteers:0 "Train Refugee Volunteers"
 VAL_train_refugee_volunteers_desc:0 "Train £population_texticon §Y5,000§! available refugees for 35 days using §Y75§! £political_power_texticon and £infantry_equipment_texticon §Y5000§! infantry equipment. Trainees still need housing until completion. Capitulation or subjugation cancels training and refunds the people and costs."
 VAL_refugee_training_start_tt:0 "Reserve exactly £population_texticon §Y5,000§! refugees for §Y35 days§!, then add them to army manpower. Cancellation returns the volunteers, §Y75§! £political_power_texticon and £infantry_equipment_texticon §Y5000§! infantry equipment."
 VAL_refugee_window_open_tt: "An admission window is open for this refugee route. It lasts §Y180 days§! from the start of the flow. If this condition is unmet, the flow has not opened yet, its admission window has expired, or all three waves have already been admitted."
 VAL_refugee_war_active_tt: "This route's war is ongoing; the decision can be used once per year."
 VAL_refugee_perimeter_active_tt: "The Perimeter is open; the decision can be used once per year."

 VAL_local_training_start_tt:0 "Reserve £population_texticon §Y5,000§! local volunteers for §Y35 days§!. Cancellation returns the volunteers, §Y75§! £political_power_texticon and £infantry_equipment_texticon §Y5000§! infantry equipment."

 VAL_recruit_local_volunteers:0 "Recruit local volunteers"

 VAL_recruit_local_volunteers_desc:0 "Conscription remains at 1.25%. The additional contract reserve is 2% of the initial population of Kefreyt's seven states and does not replenish. Each intake trains £population_texticon §Y5,000§! local volunteers over 35 days for §Y75§! £political_power_texticon and £infantry_equipment_texticon §Y5000§! infantry equipment. Capitulation or subjugation refunds the full intake."

 VAL_training_cost:0 "£population_texticon §Y5000§! §Y75§! £political_power_texticon £infantry_equipment_texticon §Y5000§!"

 VAL_training_cost_blocked:0 "£population_texticon §R5000§! §R75§! £political_power_texticon £infantry_equipment_texticon §R5000§!"

 VAL_training_cost_tooltip:0 "Requires £population_texticon §Y5,000§! volunteers from the reserve named in the decision, §Y75§! £political_power_texticon and £infantry_equipment_texticon §Y5000§! infantry equipment."

 VAL_labor_program_tt:0 "Reserve £population_texticon §Y100,000§! available refugees for 90 days: +8% construction speed, +5% civilian income, -1% stability. All workers then return to the available pool."

 VAL_expand_refugee_housing:0 "Expand temporary settlements"

 VAL_expand_refugee_housing_desc:0 "Spend 500 coins to house 200,000 additional people after 45 days. Maximum capacity: one million. Capitulation or subjugation refunds the payment."

 VAL_housing_start_tt:0 "After 45 days: housing for 200,000 additional people."

 VAL_broker_market_open_tt:0 "Broker audit has ended; dealers are available again"

 VAL_broker_dependence_tt:0 "Broker dependence: +1, maximum 3. Each level adds +1 weekly grey-market pressure."

 VAL_broker_audit_tt:0 "Broker dependence: -1. Broker licences and contraband purchases are unavailable for 60 days."

 VAL_labor_cost:0 "£population_texticon §Y100 000§! §Y75§! £political_power_texticon"
 VAL_labor_cost_blocked:0 "£population_texticon §R100 000§! §R75§! £political_power_texticon"
 VAL_labor_cost_tooltip:0 "Requires £population_texticon §Y100,000§! available refugees and §Y75§! £political_power_texticon. People are reserved for 90 days and return on completion or cancellation."
