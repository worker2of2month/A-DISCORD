 VAL_refugee_border_open_tt: "The border is open to refugees"

 VAL_refugee_capacity_tt:0 "Total residents including reserved civilians will not exceed one million. Exceeding housing capacity causes overcrowding."

 VAL_accept_vorkerland_refugees: "Admit Refugees from Vorkerland"

 VAL_accept_vorkerland_refugees_desc:0 "Admit §Y300,000§! refugees for §Y100§! coins. Grey market: §R+3§!. Repeat after §Y90 days§!. The admitted population enters the resettlement reserve."

 VAL_accept_stelander_refugees: "Admit Refugees from Stelander"

 VAL_accept_stelander_refugees_desc:0 "Admit §Y200,000§! refugees for §Y100§! coins. Grey market: §R+3§!. Repeat after §Y90 days§!. The admitted population enters the resettlement reserve."

 VAL_accept_nodrul_refugees: "Admit Refugees from Nodrul"

 VAL_accept_nodrul_refugees_desc:0 "Admit §Y100,000§! refugees for §Y100§! coins. Grey market: §R+3§!. Repeat after §Y90 days§!. The admitted population enters the resettlement reserve."

 VAL_accept_north_refugees: "Admit Refugees from the Northern Countries"

 VAL_accept_north_refugees_desc:0 "Admit §Y100,000§! refugees for §Y100§! coins. Grey market: §R+3§!. Repeat after §Y90 days§!. The admitted population enters the resettlement reserve."
 VAL_accept_perimeter_refugees: "Admit Refugees from Beyond the Perimeter"
 VAL_accept_perimeter_refugees_desc:0 "Admit §Y100,000§! refugees for §Y100§! coins. Grey market: §R+3§!. Repeat after §Y90 days§!. The admitted population enters the resettlement reserve."
 VAL_refugee_resettlement_result_tt:0 "£population_texticon §Y100,000§! displaced people settle permanently in §Y[FROM.GetName]§!."
