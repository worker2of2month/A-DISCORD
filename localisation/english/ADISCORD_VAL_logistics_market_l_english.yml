 VAL_refugee_wave_limit_tt:0 "Fewer than three waves have been admitted from this region."
 VAL_train_refugee_volunteers:0 "Train Refugee Volunteers"
 VAL_train_refugee_volunteers_desc:0 "Train £population_texticon §Y5,000§! available refugees for 35 days using £pol_power §Y75§! political power and £infantry_equipment_texticon §Y5000§! infantry equipment. Trainees still need housing until completion. Capitulation or subjugation cancels training and refunds the people and costs."
 VAL_refugee_training_start_tt:0 "Reserve £population_texticon §Y10,000§! refugees for §Y35 days§!, then add them to army manpower. Cancellation returns the people, £pol_power §Y75§! political power and £infantry_equipment_texticon §Y5000§! infantry equipment."
 VAL_refugee_window_open_tt: "An admission window is open for this refugee route. It lasts §Y180 days§! from the start of the flow. If this condition is unmet, the flow has not opened yet, its admission window has expired, or all three waves have already been admitted."
 VAL_refugee_war_active_tt:0 "This route's war is ongoing. Admission is available once every §Y90 days§!."
 VAL_refugee_perimeter_active_tt:0 "The Perimeter is open. Admission is available once every §Y90 days§!."

 VAL_local_training_start_tt:0 "Reserve £population_texticon §Y5,000§! local volunteers for §Y35 days§!. Cancellation returns the volunteers, §Y75§! £political_power_texticon and £infantry_equipment_texticon §Y5000§! infantry equipment."

 VAL_offer_settlement_bounties:0 "Offer Settlement Bounties"
 VAL_offer_settlement_bounties_desc:0 "Pay relocation grants and guaranteed first contracts to attract workers and families from outside Kefreyt. The programme brings §Y30,000§! new civilians into the refugee system, costs §Y250§! treasury funds and raises grey-market pressure by §R2§!. Available once every §Y90 days§!."
 VAL_settlement_bounties_tt:0 "Gain £population_texticon §Y30,000§! available settlers. Grey-market pressure: §R+2§!."

 VAL_naturalize_refugee_households:0 "Naturalize Refugee Households"
 VAL_naturalize_refugee_households_desc:0 "Move established refugee households out of temporary status and into permanent contract citizenship. §Y20,000§! refugees leave the free refugee pool and create §Y10,000§! people in the local service reserve. Cost: §Y50§! political power. Available once every §Y45 days§!."
 VAL_naturalization_result_tt:0 "Convert £population_texticon §Y20,000§! refugees into £manpower_texticon §Y10,000§! local service reserve. Grey-market pressure: §G-1§!."

 VAL_emergency_service_contracts:0 "Issue Emergency Service Contracts"
 VAL_emergency_service_contracts_desc:0 "Bypass the normal training cycle and mobilize a full block of local contract reservists. Spend §Y500§! treasury funds, §Y25§! command power, £infantry_equipment_texticon §Y10,000§! infantry equipment and £population_texticon §Y10,000§! local reserve to gain £manpower_texticon §Y10,000§! manpower immediately. Stability: §R-1%§!. Available once every §Y90 days§!."
 VAL_emergency_service_cost:0 "§Y500§! £ADISCORD_economy_treasury_texticon  §Y25§! £command_power  §Y10000§! £infantry_equipment_texticon  §Y10000§! £population_texticon"
 VAL_emergency_service_result_tt:0 "Gain £manpower_texticon §Y10,000§! manpower immediately. Stability: §R-1%§!."

 VAL_recruit_local_volunteers:0 "Recruit local volunteers"

 VAL_recruit_local_volunteers_desc:0 "Conscription remains at 1.25%. The additional contract reserve is 2% of the initial population of Kefreyt's seven states and does not replenish. Each intake trains £population_texticon §Y5,000§! local volunteers over 35 days for §Y75§! £political_power_texticon and £infantry_equipment_texticon §Y5000§! infantry equipment. Capitulation or subjugation refunds the full intake."

 VAL_refugee_training_cost:0 "§Y10000§! £population_texticon  §Y75§! £pol_power  §Y5000§! £infantry_equipment_texticon"
 VAL_refugee_training_cost_blocked:0 "§R10000§! £population_texticon  §R75§! £pol_power  §R5000§! £infantry_equipment_texticon"
 VAL_refugee_training_cost_tooltip:0 "Requires §Y10,000§! £population_texticon available refugees, §Y75§! £pol_power political power and §Y5000§! £infantry_equipment_texticon infantry equipment."
 VAL_training_cost:0 "§Y5000§! £population_texticon  §Y75§! £political_power_texticon  §Y5000§! £infantry_equipment_texticon"

 VAL_training_cost_blocked:0 "§R5000§! £population_texticon  §R75§! £political_power_texticon  §R5000§! £infantry_equipment_texticon"

 VAL_training_cost_tooltip:0 "Requires §Y5,000§! £population_texticon volunteers from the reserve named in the decision, §Y75§! £political_power_texticon and §Y5000§! £infantry_equipment_texticon infantry equipment."

 VAL_labor_program_tt:0 "Reserve §Y100,000§! £population_texticon refugees for 90 days: §G+12%§! construction speed, §G+8%§! civilian income, §R-1%§! stability. The workers then return to the free reserve."

 VAL_expand_refugee_housing:0 "Expand temporary settlements"

 VAL_expand_refugee_housing_desc:0 "Spend §Y250§! coins to house §Y200,000§! additional people after §Y45 days§!. Maximum capacity: one million. Capitulation or subjugation refunds the payment."

 VAL_housing_start_tt:0 "After 45 days: housing for 200,000 additional people."

 VAL_broker_market_open_tt:0 "Broker audit has ended; dealers are available again"

 VAL_broker_dependence_tt:0 "Broker dependence: +1, maximum 3. Each level adds +1 weekly grey-market pressure."

 VAL_broker_audit_tt:0 "Broker dependence: -1. Broker licences and contraband purchases are unavailable for 60 days."

 VAL_labor_cost:0 "§Y100,000§! £population_texticon  §Y75§! £political_power_texticon"
 VAL_labor_cost_blocked:0 "§R100,000§! £population_texticon  §R75§! £political_power_texticon"
 VAL_labor_cost_tooltip:0 "Requires §Y100,000§! £population_texticon available refugees and §Y75§! £political_power_texticon."
