l_english:
 VAL_trade_corridors: "Contract Corridors"
 VAL_trade_corridors_desc: "Kefreite can no longer treat trade as a line in a ledger. Cargo must physically pass through ports, depots, passes and dependent administrations.\n\nOperational corridors: §Y[?VAL_trade_corridors_active|0]/[?VAL_trade_corridors_capacity|0]§! commissioned\nRoute security: §Y[?VAL_corridor_security|0]/3§!\nGrey-market pressure: §Y[?VAL_black_market_pressure|0]/100§!\n\nEach open route brings §G20§! to the treasury every week. An upgraded route adds another §G10§!. A route only becomes an obligation after it has actually opened once; losing a key node thereafter stops the payment and feeds smuggling."

 VAL_population_markets: "People and Grey Markets"
 VAL_population_markets_desc: "Wars around Kefreite move more than front lines. Families, workers, brokers and weapons without invoices cross the borders.\n\nDisplaced population: §Y[?VAL_displaced_population|0]§! × 10,000 people\nGrey-market pressure: §Y[?VAL_black_market_pressure|0]/100§!\n\nOpen borders take in more refugees. Closed borders reduce the flow but damage legal trade. The grey market can temporarily provide cash and arms, but high criminalization raises administrative costs and undermines stability."

 VAL_logistics_cost_50: "£ADISCORD_economy_treasury_texticon  §Y50§!"
 VAL_logistics_cost_100: "£ADISCORD_economy_treasury_texticon  §Y100§!"
 VAL_logistics_cost_250: "£ADISCORD_economy_treasury_texticon  §Y250§!"

 VAL_invest_occidian_corridor: "Capitalize the Occidian Trunk"
 VAL_invest_occidian_corridor_desc: "Balchansk, the Harbour and the inland depot must function as one commercial trunk. Kefreite will fund roads, warehouses and transfer yards. The route will earn §G10§! more per week."
 VAL_invest_northern_corridor: "Reinforce the Northern Resource Belt"
 VAL_invest_northern_corridor_desc: "Antolla, Farein and Himber form the northern raw-material artery. More infrastructure will turn a wartime supply line into a permanent commercial corridor. The route will earn §G10§! more per week."
 VAL_invest_stelander_corridor: "Rebuild the Stelander Road"
 VAL_invest_stelander_corridor_desc: "Kreiden and Hosheit are the gates to the Stelander market. Investment in both nodes will raise throughput and add §G10§! to weekly route revenue."
 VAL_invest_vorkerland_corridor: "Restore the Old Vorkerland Channel"
 VAL_invest_vorkerland_corridor_desc: "The South-Eastern District still remembers the old broker network. If its authority is not hostile to Kefreite, we can rebuild the depots and haulage links. The route will earn §G10§! more per week."
 VAL_secure_trade_columns: "Contract Security Columns"
 VAL_secure_trade_columns_desc: "Hire convoy companies, warehouse auditors and road patrols. Every security level reduces weekly grey-market growth, while the operation immediately lowers pressure by §G5§!."
 VAL_open_emergency_bypass: "Open an Emergency Bypass"
 VAL_open_emergency_bypass_desc: "While a previously operational corridor is cut, brokers can assemble an expensive temporary chain of minor roads, river crossings and private depots. For §Y56 days§! it recovers §G20§! of weekly income, while feeding the grey market."

 VAL_close_refugee_border: "Close the Refugee Border"
 VAL_close_refugee_border_desc: "Border guards will admit only registered contract cargo and approved lists. Displacement inflow will fall, but legal commerce will suffer."
 VAL_open_refugee_border: "Reopen the Crossings"
 VAL_open_refugee_border_desc: "Lift the emergency restrictions and restore civilian crossings. Trade recovers, but renewed regional wars will again drive people into Kefreite."
 VAL_contract_refugee_labor: "Offer Work Contracts"
 VAL_contract_refugee_labor_desc: "Move part of the displaced population from camps into paid industrial and construction contracts. §Y100,000§! displaced people are processed; the mobilization pool gains §G7,500§! and the economy receives a temporary construction boost."
 VAL_fund_resettlement_depots: "Fund Resettlement Depots"
 VAL_fund_resettlement_depots_desc: "Pay for housing, transport and documentation for §Y200,000§! displaced people. Organized registration relieves the social system and shrinks the space available to illegal brokers."
 VAL_organize_refugee_return: "Organize Refugee Return"
 VAL_organize_refugee_return_desc: "Once regional wars subside, contract offices can arrange the safe return of §Y150,000§! people. This lowers internal pressure and yields political capital."
 VAL_license_grey_brokers: "License the Grey Brokers"
 VAL_license_grey_brokers_desc: "Do not destroy the underground network; make it pay for permission to operate. The treasury immediately receives §G50§!, while grey-market pressure rises by §R15§!."
 VAL_buy_contraband_arms: "Buy Arms Off the Ledger"
 VAL_buy_contraband_arms_desc: "When official corridors are overloaded or cut, private brokers can push weapons back onto the market. For §Y50§! treasury we receive §G1,500§! infantry weapons at the cost of §R10§! grey-market pressure."
 VAL_audit_broker_houses: "Audit the Broker Houses"
 VAL_audit_broker_houses_desc: "A joint treasury, military-police and contract-court operation will shut down the most brazen schemes. Grey-market pressure falls by §G25§!, but the operation costs §Y100§!."

 VAL_corridor_network_fragmented: "Fragmented Contract Network"
 VAL_corridor_network_fragmented_desc: "Most commissioned trade arteries are cut, or the network is still too narrow for dependable turnover."
 VAL_corridor_network_partial: "Working Contract Network"
 VAL_corridor_network_partial_desc: "Operational trunk routes are functioning reliably, but the system still depends on vulnerable individual nodes."
 VAL_corridor_network_integrated: "Integrated Contract Network"
 VAL_corridor_network_integrated_desc: "Occidia, the north, Stelander and the old Vorkerland channel have been joined into one commercial system."

 VAL_emergency_bypass: "Emergency Bypass Routes"
 VAL_emergency_bypass_desc: "A temporary web of private depots and minor roads keeps turnover alive while a primary corridor is closed."
 VAL_black_market_low: "Shadow Commerce"
 VAL_black_market_low_desc: "A small grey market covers isolated supply failures and even produces revenue, but requires growing administrative attention."
 VAL_black_market_high: "Parallel Economy"
 VAL_black_market_high_desc: "Smugglers now service a meaningful share of commerce. Money flows, but so do corruption, false invoices and illegal armed networks."
 VAL_black_market_crisis: "A State of Two Ledgers"
 VAL_black_market_crisis_desc: "Official and underground economies have become near-peers. The treasury still receives money, but the state increasingly does not know who actually controls goods, weapons and people."
 VAL_refugee_strain: "Overloaded Resettlement System"
 VAL_refugee_strain_desc: "Too many displaced people depend at once on Kefreite's housing, transport, medical and food systems."
 VAL_closed_border_regime: "Closed Crossings"
 VAL_closed_border_regime_desc: "The emergency border regime reduces population inflow but delays legitimate deals as well."
 VAL_refugee_contract_labor: "Contracts for the Displaced"
 VAL_refugee_contract_labor_desc: "Part of the displaced population has received formal work contracts and entered construction and industrial projects."
