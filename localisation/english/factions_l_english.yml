 pax_romana_goal_name: "Pax Romana"
 building_up_guam_goal_name: "Expand Guam's Naval Base"
 the_two_seas_goal_name: "Expand Influence in the Baltic and Black Seas"
 the_two_seas_goal_desc: "We must establish a substantial military presence in both the Baltic and Black Seas."
 one_germany_goal_name: "Unite the German Regions"
 guardians_of_peace_goal_name: "Maintain World Peace"
 guardians_of_peace_goal_desc: "Clouds are gathering on the horizon. We must prevent war from breaking out too early, giving our alliance time to prepare for the inevitable conflict."
 growing_the_faction: "Expand the Faction"
