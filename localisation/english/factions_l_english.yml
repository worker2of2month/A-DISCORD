 a_great_fortress_goal_name: "Build Stronger Fortifications"
 aggressive_defense_goal_name: "Inflict Losses on Aggressors"
 war_on_communism_goal_name: "Declare War on Communism"
 war_on_communism_goal_desc: "The spread of communism must be stopped by any means necessary."
 war_on_democracy_goal_name: "Declare War on Democracy"
 defeat_of_communism_goal_name: "Defeat Communism"
 defeat_of_fascism_goal_name: "Defeat Fascism"
 defeat_of_anti_communists_goal_name: "Defeat the Counter-revolutionaries"
 defeat_of_anti_fascists_goal_name: "Spread Fascism across the Continent"
 defeat_of_anti_fascists_goal_desc: "We must crush every anti-fascist regime on our continent."
 defeating_our_enemies_goal_name: "Win the War"
 defeating_our_enemies_goal_desc: "These are troubled times, and war cannot be avoided. We must ensure that when it comes, we stand among the victors."
 is_victor_in_pc_tt: "Is on the winning side in a peace conference"
 a_military_base_goal_name: "Expand Military Industry"
 a_military_base_tech_bonus: "$a_military_base_goal_name$ Goal Bonus"
 resource_control_goal_name: "Control Strategic Resources"
 resource_control_goal_desc: "The faction must ensure it has the resources needed to confront global threats."
 secure_european_continent_goal_name: "Establish Fortress Europe"
 secure_european_continent_goal_desc: "We must ensure that the European continent supports our goals. [faction.GetName] will become Europe's dominant force."
 secure_north_africa_goal_name: "Control North Africa"
 secure_north_africa_goal_desc: "We must seek not only dominance in Europe, but more than a mere foothold in North Africa."
 an_armored_fist_goal_name: "Expand Our Armoured Forces"
 an_armored_fist_goal_desc: "New times create opportunities for new tactics. The future belongs to tanks. Our alliance must possess enough of them to dominate the battlefield."
 an_infantry_army_goal_name: "Expand Our Infantry"
 high_seas_fleet_goal_name: "Expand the Capital Ship Fleet"
 high_seas_fleet_goal_desc: "It is vital that our enemies do not gain control of the North Atlantic. If we prevent this, we need not fear a naval blockade, while our own fleets can operate freely."
 high_seas_fleet_tech_bonus: "$high_seas_fleet_goal_name$ Goal Bonus"
 control_the_chinese_coast_goal_name: "Control the Coastline"
 control_the_chinese_coast_goal_desc: "If attacked, we must retain access to our ports for as long as possible. Our survival depends on receiving goods from overseas."
 guerilla_expansion_goal_name: "Organise Resistance"
 guerilla_expansion_goal_desc: "We may lack the strength to fight the enemy on their terms. We will therefore fight them on ours."
 industrial_expansion_goal_name: "Industrial Expansion"
 industrial_domination_goal_name: "Expand Civilian Industry"
 industrial_domination_goal_desc: "Modern warfare rests on industrial capacity. Let us ensure that no one in the world can match ours."
 industrial_expansion_tech_bonus: "$industrial_expansion_goal_name$ Goal Bonus"
 industrial_research_goal_name: "Research $construction4$"
 industrial_research_goal_desc: "To become a major force, we must provide every faction member with modern industrial technology."
 secure_chinese_waters_goal_name: "Secure Chinese Waters"
 secure_chinese_waters_goal_desc: "We dominate on land, but our extensive coastline means we must ensure no one can attack us from the sea. Our security begins far from shore."
 faction_goal_subjugate_the_faction_name: "Subjugate the Faction"
 faction_goal_subjugate_the_faction_desc: "Only a united front under a strong leader can halt foreign invaders. Many voices will become a single harmonious chorus."
 faction_goal_north_subjugated_name: "Subjugate the North"
 faction_goal_north_subjugated_desc: "By concentrating on integrating this part of our faction, we will show the other warlords which way the wind is blowing and bring them into line."
 faction_goal_west_subjugated_name: "Subjugate the West"
 faction_goal_west_subjugated_desc: "By concentrating on integrating this part of our faction, we will show the other warlords which way the wind is blowing and bring them into line."
 faction_goal_south_subjugated_name: "Subjugate the South"
 faction_goal_south_subjugated_desc: "By concentrating on integrating this part of our faction, we will show the other warlords which way the wind is blowing and bring them into line."
 faction_goal_no_japanese_in_china_name: "Expel the Invaders"
 faction_goal_the_northern_mandate_name: "Control Eastern Siberia"
 faction_goal_the_northern_mandate_desc: "To offer our people hope of prosperity, we need Siberia's abundant territory and resources. Its current owners cannot manage these riches properly, giving us every right to the land."
 faction_goal_the_southern_mandate_name: "Control Southeast Asia"
 faction_goal_the_southern_mandate_desc: "In our former days of glory, our influence extended over the regions to our south, and we will regain control of them. Their wealth will provide us with endless opportunities."
 faction_goal_the_greater_game_name: "Control Central Asia"
 faction_goal_the_greater_game_desc: "Many empires tried to subdue Central Asia and were driven out. It is time for us to ride west across the steppes again."
 suppress_asian_communism_goal_name: "Combat Communism in Asia"
 suppress_asian_communism_goal_desc: "Communism threatens our traditional way of life and the natural order. We must work together to eradicate it wherever it appears."
 strategic_resource_control_goal_name: "Strategic Resource Control"
 strategic_resource_control_goal_desc: "Whoever controls strategic resources controls world politics."
 align_china_goal_name: "Bring China into Line"
 align_china_goal_desc: "China's competing factions threaten the security of the entire region. Replacing them with friendly ones would be the best solution."
 control_the_chinese_capitals_goal_name: "Capture China's Capitals"
 control_the_chinese_capitals_goal_desc: "Taking control of China's historical capitals will significantly weaken resistance to our plans."
 war_on_communism_in_asia_goal_name: "Declare War on Communism in Asia"
 war_on_communism_in_asia_goal_desc: "Communism can be defeated decisively only by force of arms. To protect ourselves from its influence, we must eradicate this contagion throughout Asia."
 coastal_security_goal_name: "Control the Coast"
 coastal_security_goal_desc: "We must achieve complete control of the seas of East and Southeast Asia. Only then can we guarantee that Western imperialists will not invade our shores."
 secure_the_oil_supply_goal_name: "Secure the Oil Supply"
 secure_the_oil_supply_goal_desc: "If we intend to fight a long war, we must secure sufficient oil supplies at any cost."
 secure_the_oil_supply_tech_bonus: "Secure the Oil Supply Goal Bonus"
 protector_of_peace_goal_name: "Guardian of Peace"
 protector_of_peace_goal_desc: "We will not intervene in wars in Europe or elsewhere. Instead, we will maintain peace and encourage other countries to resolve conflicts without violence."
 contain_japanese_expansion_asia_goal_name: "Contain Japanese Expansion"
 pan_americanism_goal_name: "Pan-Americanism"
 amerindian_liberation_goal_name: "Liberate the Indigenous Peoples of the Americas"
 amerindian_liberation_goal_desc: "The indigenous peoples of the New World must be freed from the yoke of the foreign invaders who now oppress them."
 islamic_brotherhood_goal_name: "Islamic Brotherhood"
 islamic_brotherhood_goal_desc: "Islamic countries worldwide must unite to resist those who seek to conquer and enslave us."
 baltic_security_goal_name: "Defend the Baltic"
 baltic_security_goal_desc: "To secure a peaceful future for our citizens, we must defend the Baltic with all our strength. Keeping it under our control will offer its people hope of prosperity."
 nordic_defence_goal_name: "Defend Northern Europe"
 nordic_defence_goal_desc: "To secure a peaceful future for our citizens, we must defend Northern Europe with all our strength. Only by shielding the region from intrusive empires can we preserve hope of prosperity."
 european_dominance_goal_name: "Establish European Dominance"
 european_dominance_goal_desc: "Uniting most of Europe under one banner will create a lasting alliance capable of withstanding even the most dangerous threats."
 asian_dominance_goal_name: "Establish Asian Dominance"
 asian_dominance_goal_desc: "Once our faction controls most of Asia, the world will have to take us seriously."
 middle_east_dominance_goal_name: "Control the Middle East"
 middle_east_dominance_goal_desc: "The Middle East stretches from the Arabian Peninsula and Lebanon to the mountains of Afghanistan. We must unite these lands and bring them under complete control. Working together, the region can become a major force."
 the_arteries_of_trade_goal_name: "Protect Trade Routes"
 the_arteries_of_trade_goal_desc: "To ensure our countries' survival, we must control the main trade routes."
 the_atomic_race_goal_name: "Build the First Atomic Bomb"
 the_atomic_race_goal_desc: "We must ensure that neither our present nor future enemies acquire nuclear weapons before us. Only by being first can we guarantee protection from the ambitions of other powers."
 the_atomic_race_complete_trigger_fail: "The first country to complete $sp_nuclear_bomb$ was not a member of [ROOT.GetFactionName]"
 rule_the_waves_goal_name: "Rule the Waves"
 eliminate_the_twin_threats_goal_name: "Eliminate the Twin Threats"
 disarm_aggression_central_powers_goal_name: "Disarm the Aggressors"
 rule_the_waves_tech_bonus: "Rule the Waves Goal Bonus"
 imperial_glory_goal_name: "Protect the Empire's Vital Resources"
 imperial_glory_goal_desc: "We must hold the key strongholds of our empire and its allies. Retaining control of assets across the world will show that we remain a force to be reckoned with."
 production_quotas_goal_name: "Meet Production Quotas"
 stall_the_fascist_threat_goal_name: "Stall the Fascist Threat"
 the_red_tide_goal_name: "Expand the Red Army"
 military_infrastructure_goal_name: "Build Military Infrastructure"
 military_infrastructure_goal_desc: "Developed infrastructure is essential to keeping the defenders of our borders properly supplied."
 ensure_military_r_d_goal_name: "Build Military Research Facilities"
 ensure_military_r_d_goal_desc: "We must maintain modern military standards by building facilities dedicated to researching and developing advanced prototypes and new concepts."
 spy_master_goal_name: "Appoint a Spymaster"
 spy_master_goal_desc: "One faction member must specialise in espionage and intelligence gathering to oversee and direct the faction's operations."
 convoy_sufficiency_goal_name: "Convoy Sufficiency"
 convoy_sufficiency_goal_desc: "To supply our troops overseas and meet industry's import needs, we must build a sufficiently large merchant fleet."
 develop_mexican_oil_goal_name: "Develop Mexican Oil Fields"
 develop_mexican_oil_goal_desc: "Developing Mexico's oil fields will provide fuel reserves for industrial and military needs."
 develop_curacao_oil_goal_name: "Develop Curacao's Oil Industry"
 develop_curacao_oil_goal_desc: "Curacao's refineries process much of Venezuela's oil. Increasing output will give our faction a reliable source of petroleum products."
 develop_venezuelan_oil_goal_name: "Develop Venezuelan Oil Fields"
 develop_venezuelan_oil_goal_desc: "Venezuela possesses abundant hydrocarbon reserves. Increasing extraction will provide our faction with fuel for military operations."
 develop_guyanan_bauxite_goal_name: "Expand Guyanese Bauxite Production"
 develop_guyanan_bauxite_goal_desc: "Expanding Guyana's bauxite mines will provide the raw material needed for large-scale aircraft production."
 develop_suriname_bauxite_goal_name: "Expand Surinamese Bauxite Production"
 develop_suriname_bauxite_goal_desc: "Developing Suriname's rich bauxite deposits will supply our faction with the raw material needed to expand its aircraft industry."
 develop_lappland_metals_goal_name: "Expand Lapland Metal Production"
 develop_lappland_metals_goal_desc: "Developing Lapland's rich metal deposits will give our faction a reliable source of iron and tungsten ores for arms production."
 develop_ploiesti_oil_fields_goal_desc: "To provide the faction with the fuel needed to continue the war, we must develop Europe's only oil fields, at Ploiesti."
 develop_baku_oil_fields_goal_name: "Develop Baku Oil Fields"
 develop_baku_oil_fields_goal_desc: "Developing Baku's oil fields will give us access to extensive hydrocarbon reserves essential to military operations."
 develop_iraqi_oil_goal_name: "Develop Iraqi Oil Fields"
 develop_iraqi_oil_goal_desc: "Expanding Iraq's oil extraction capacity will meet our forces' fuel requirements."
 develop_persian_oil_goal_name: "Develop Persian Oil Fields"
 develop_persian_oil_goal_desc: "Strengthening control of Persian oil fields and refineries will secure a reliable fuel source for our military objectives."
 develop_chinese_metals_goal_name: "Develop Chinese Metals"
