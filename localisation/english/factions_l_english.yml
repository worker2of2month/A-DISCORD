 control_attu_island_goal_name: "Control Attu Island"
 control_attu_island_goal_desc: "Capturing Attu will establish control of North Pacific shipping routes and enable operations along the Aleutian chain towards Alaska and America's Pacific coast."
 undo_versailles_goal_name: "Avenge the Treaty of Versailles"
 undo_versailles_goal_desc: "It is time to end this shameful diktat. We will reclaim our rightful territories!"
