 african_decolonization_goal_name: "Decolonise Africa"
 habsburg_hegemony_goal_name: "Habsburg Hegemony"
 indifference_is_a_threat_goal_desc: "With a major European conflict almost inevitable, we must avoid surprises. Countries that refuse to choose a side must be excluded."
 security_through_expansion_goal_name: "Security through Expansion"
 an_iron_curtain_goal_name: "An Iron Curtain"
