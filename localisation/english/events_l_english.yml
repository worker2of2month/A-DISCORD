l_english:
 ADISCORD_rin_crisis.1.t: "Two Oaths Demand an Answer"
 ADISCORD_rin_crisis.1.d: "The war in Vorkerland has torn apart the trade agreements that sustained the south, while persuading Montera to demand that the northern oath be honoured. The nobles of the Palatine Court are already raising the crown's banners; Rina's city councils reply that no foreign throne can override their charters. Alaric IV must choose, or admit that the united palatinate no longer exists."
 ADISCORD_rin_crisis.1.a: "The charters will outlast the crown."
 ADISCORD_rin_crisis.1.b: "The oath to Montera still stands."
 news.0.t: "Fighting Begins in Vorkerland"
 news.0.d: "Following the Confederation's collapse, the district governments have launched their first major wars against one another. Garrisons that answered to the same headquarters only yesterday now receive orders from opposite sides of the front. The claimants are no longer dividing documents, warehouses and routes: they are dividing the land.\n\nIn the square beside the Tower of Unity, the crowd finally sees what it has awaited and feared. The symbol of a common country stands above a war already under way, while local administrations act independently and no one can say who has the authority to stop them."
 news.0.a: "Approach the Tower of Unity."
 news.1.t: "An Empire Is Proclaimed in Steland"
 news.1.d: "Maksim Shabrat has signed the act transforming Steland into an empire. Transitional republican institutions will survive only insofar as they do not constrain the new supreme authority. The former electoral system has ended, and the head of state's powers are no longer tied to a postwar term or an emergency mandate.\n\nThe government argues that the republic was created to emerge from civil war, whereas the expanded state needs a permanent centre of command. Shabrat's supporters call the proclamation of the empire the culmination of the struggle for sovereignty. Former allies in the resistance who reject the new course describe it as the transformation of a victor's temporary authority into a permanent system.\n\nThe man who came to power promising to restore the country's right to determine its own future has now concentrated that right in a single institution. For its neighbours, the character of the regime is already a secondary concern: Steland openly declares itself a power capable of shaping the order beyond its own mountains."
 news.1.a: "The resistance became a state. The state became an empire."
 ADISCORD_rin_crisis.10.t: "The Rina Palatinate Splits"
 ADISCORD_rin_crisis.10.d: "The crisis of the two oaths has ended in an armed split across Rina. The northern houses, bound by their oath to Montera, have risen against the southern cities defending their Vorkerland charters. Part of the army has rallied to the northern court; the old boundary between legal traditions has become a front line.\n\nVorkerland's collapse removed the foundation of the old compromise. For the city councils, the charters remain the basis of self-government; for the northern nobility, loyalty to the crown outweighs the south's decisions. Neither side now recognises the other's right to speak for the entire palatinate. War will decide which oath becomes the law of the state."
 ADISCORD_rin_crisis.10.a: "Two oaths, two commands."
 ADISCORD_rin_crisis.11.t: "The Southern Cities Prevail in Rina"
 ADISCORD_rin_crisis.11.d: "The supporters of the southern charters have won Rina's civil war. The northern court no longer forms a separate military centre, and the palatinate's institutions are being determined by an agreement among the cities. Two incompatible oaths are giving way to a single legal order.\n\nVictory does not abolish the throne: the palatine remains, but the old trade charters become the foundation of common law. His authority can no longer rest on simultaneous obligations to the cities and a foreign crown. After military reunification, the victors must restore administration in the north and secure compliance with the agreement beyond the cities that supported them."
 ADISCORD_rin_crisis.11.a: "Now the charters must unite the country."
 ADISCORD_rin_crisis.12.t: "The Northern Court Prevails in Rina"
 ADISCORD_rin_crisis.12.d: "Rina's civil war has ended in victory for the northern court. Armed resistance in the southern cities has been broken, and the crown palatinate is being established as the country's common order. The supporters of the northern oath can now extend the court's authority beyond their former domains.\n\nFor the cities, this defeats their attempt to make the charters the supreme basis of state authority. The victors must govern territories that recently rejected their demands. The military outcome is settled; the stability of the restored palatinate will depend on whether the court can hold the south after the fighting ends."
 ADISCORD_rin_crisis.12.a: "The crown has restored its authority over the palatinate."
 ADISCORD_rin_crisis.13.t: "Armistice Confirms Rina's Partition"
 ADISCORD_rin_crisis.13.d: "Rina's opposing sides have ended the war while retaining separate administrations. The northern court holds its lands, while the southern cities continue under their common charter agreement. The crisis of the two oaths has produced no single victor.\n\nThe armistice ends the struggle for the entire palatinate, but does not restore its prewar institutions. Loyalty to the crown and civic liberties now exist on opposite sides of a border. For the population, this ends the current fighting; for the two governments, it means building relations with a neighbour whose rights they recently challenged by force."
 ADISCORD_rin_crisis.13.a: "The fighting ends. The division remains."
 ADISCORD_rin_crisis.14.t: "Rina Reaffirms Its Oath to Montera"
 ADISCORD_rin_crisis.14.d: "Rina's court has reaffirmed its loyalty to Montera, refusing to support the southern cities in the dispute over the two oaths. Against the backdrop of Vorkerland's collapse, the palatine has chosen royal authority and continued dependence on his northern patron.\n\nAn armed split has been avoided, but the concession does not resolve the conflict between the court and the city charters. The southern councils have lost their ability to determine the country's foreign policy, while the crown has assumed responsibility for preserving internal order. The old compromise ended with a decision by the court, rather than an agreement between both sides."
 ADISCORD_rin_crisis.14.a: "The palatine has chosen the northern oath."

