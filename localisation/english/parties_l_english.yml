 humanism_ideology: "Humanism"
 humanism_ideology_desc: "Humanism is a highly developed ideology founded on the value of human life and dignity. Unlike authoritarian and militarist approaches, humanism emphasises personal development, social ties and the common good. Its central aim is to build a society in which everyone can realise their potential, regardless of their origins or social circumstances."
 utilitarism_ideology: "Utilitarianism"
 utilitarism_ideology_desc: "Utilitarianism is a consequentialist and distinctly futuristic ideology that emphasises the greatest good for the greatest number. It judges the morality of actions, policies and decisions by their results, with the ultimate goal of maximising collective happiness and minimising suffering. Utilitarianism advocates a particular approach to government and social organisation, favouring decisions that produce the most beneficial outcomes for society and humanity as a whole."
 utilitarian_accelerationism: "Utilitarian Accelerationism"
 utilitarian_accelerationism_desc: "Utilitarian accelerationism is Anton Bagley's course: power is measured by delivery, rather than inheritance or revolutionary rhetoric. The government publishes rations, production targets and deadlines, and accepts responsibility when they are missed. Legitimacy is declared to be a result that can be checked against a ledger; the republic binds itself to its own standards to accelerate output and hold the home front through a second year of war. Supporters see an honest contract between the state and its people; opponents see a regime in which a human being becomes a line on a balance sheet and the pace of production matters more than consent."
 pragmatism_ideology: "Pragmatism"
 pragmatism_ideology_desc: "Pragmatism is a philosophical and political ideology focused on the practical usefulness of ideas, decisions and actions. It gives priority to concrete results and effective action, setting aside abstract theories and idealistic concepts. States that adopt a pragmatic approach concentrate on what works best in the circumstances, remaining flexible and adapting to changes around them."
 vorkerism: "Vorkerism"
 vorkerism_desc: "Vorkerism is Vorkerland's official ideology following the fall of the monarchy. It holds that the first revolution remains unfinished: until the country is rebuilt, the central government may postpone elections, extend emergency powers and govern the republics through provisional administrations. The transition has no end date, and any objection can be declared a threat to an order that has yet to be built. The regime is therefore inherently unstable: its legitimacy rests on Nikita Worcker's personality, uninterrupted communications and the centre's ability to distribute resources, while the districts already possess their own administrations and armed forces. Once succession or supply breaks down, administrative boundaries become national borders."
 neo_vorkerism: "Neo-Vorkerism"
 neo_vorkerism_desc: "Neo-Vorkerism is the mobilisation-oriented continuation of Vorkerism that emerged after the destruction of the Tower of Unity and a new revolution. The old confederation is no longer considered a functioning agreement: it must be assembled anew around the surviving centre, loyalist councils and Nikita Worcker's personal mandate. Emergency powers, military administration and the return of the breakaway republics are proclaimed necessary to defend the revolution. Supporters see this as cleansing the republican project of imperial inertia; opponents see a besieged regime in which provisional authority has become permanent and the cult of Worcker has replaced the promised transition to the rule of law."
 imperial_restorationism: "Imperial Restorationism"
 imperial_restorationism_desc: "Imperial restorationism is the doctrine of Vlad Petrishchev's chancellery: what must be restored is order, rather than the republic, and order has only one form: hierarchy. The right to issue decrees returns to the chancellery, estates and ranks return to the officer houses, and the civilian administration resumes its role as executor. This is an empire without its former crown but with its former structure: legitimacy rests on the continuity of registers, crown commissions and a predictable chain of authority, rather than elections or a personality cult. Supporters see the only way to reunite the country while its institutions still remember how to work; opponents see a restoration of the crown behind a republican facade."
 technocracy_ideology: "Technocracy"
 technocracy_ideology_desc: "Technocracy places science, technology and government based on evidence at the centre of social and economic life. A technocratic society makes decisions according to logic, scientific knowledge and practical data rather than political or ideological considerations. Technocratic states focus on using technology to maximise efficiency and improve their citizens' quality of life. Technocracy also contains an element of futurism, encouraging its adherents to consider the future and anticipate possible changes. These philosophical ideas inspire states to explore new horizons of development, apply innovative concepts and strive to create an ideal society."
 anarchism_ideology: "Anarchy"
 anarchism_ideology_desc: "Anarchism is a political and social ideology that seeks a society without structures of authority or hierarchy. An anarchist society emphasises self-government, free cooperation and the collective efforts of its citizens. States that choose an anarchist approach concentrate on horizontal networks, autonomous communities and direct democracy, freeing individuals from oppressive mechanisms of power."
 etatism_ideology: "Statism"
 etatism_ideology_desc: "Statism is a political and economic ideology that emphasises a strong central state as the main coordinator and administrator of social and economic life. In a statist society, the state actively regulates the economy, provides security and social welfare, and manages resources. Statist governments seek an effective, stable system in which public institutions maintain order, justice and progress, while intervening directly in economic activity to achieve their goals."
 contractual_etatism: "Contractual Statism"
 contractual_etatism_desc: "Contractual statism is the official ideology of the Kefreyt State Party. It regards the state as the supreme guarantor of obligations between factories, military companies, brokers and citizens. In a country where poisoned land produces rifles more readily than bread, fulfilling a contract becomes the foundation of law, order and survival itself. For contractual statists, war is neither a sacred duty nor senseless slaughter: it is a market that supplies Kefreyt with food, metal, employment and influence. As long as the State Party can pay the captains, keep the arsenals working and collect debts, its authority is considered legitimate; anyone who breaks the terms risks becoming neither a citizen nor an enemy, but an unpaid bill."
 hedonism_ideology: "Classical Hedonism"
 hedonism_ideology_desc: "Hedonism is a philosophical and moral ideology founded on the pursuit of pleasure and the minimisation of suffering. In a world inspired by hedonist principles, happiness and satisfaction are the highest goals, and life is seen as a search for physical, intellectual and emotional pleasures. States that choose a hedonist approach should focus on a society that improves quality of life, savours its experiences and meets the needs of its citizens."
 aristocratic_hedonism: "Aristocratic Hedonism"
 aristocratic_hedonism_desc: "Aristocratic hedonism is the ideology of the Hedonist Party. It holds that the state's highest purpose is neither equality nor universal welfare, but creating the conditions for a full, free and beautiful life for those able to truly appreciate it. To the hedonists, society is inevitably divided between a minority of creators, property owners, officers, patrons of the arts and arbiters of taste, and a majority obliged to sustain the order they establish. Membership of the new aristocracy is determined by more than birth: wealth, influence, education, beauty and the ability to turn one's own life into a work of art also count. \n\n The party promises ordinary citizens security, spectacles, limited material prosperity and release from the burden of political responsibility. In exchange, it demands loyalty, labour and recognition of the ruling elite's natural superiority. Luxury at the top is not considered a sign of decay: it is proclaimed proof of the state's vitality. If the palaces are lit, the theatres open and the tables of the nobility full, civilisation still exists."
 chauvinism_ideology: "Chauvinism"
 chauvinism_ideology_desc: "Chauvinism is an ideology founded on the belief that one group of people is superior to others. It is characterised by aggressive devotion to one's nation, culture or social class, expressed through hostility towards outsiders, other groups and alternative views. Chauvinism holds that members of one's own group possess special rights and privileges, while others are treated as inferior or threatening."
