l_english:
 dam: "Dam"
 dam_plural: "Dams"
 dam_desc: "A dam supplies additional electricity to the region, improving industrial efficiency and resource extraction. \n £energy_consumption_texticon"
 hidden_dam: "Dam"
 hidden_dam_desc: "A dam supplies additional electricity to the region, improving industrial efficiency and resource extraction."

 infrastructure: "Infrastructure"
 infrastructure_plural: "Infrastructure"
 infrastructure_desc: "This building improves the state's infrastructure, increasing supply throughput and the movement speed of your divisions."
 arms_factory: "Military Factory"
 arms_factory_plural: "Military Factories"
 arms_factory_desc: "This building produces new military equipment for the state. It can be converted to civilian production if necessary."
 dockyard: "Dockyard"
 dockyard_plural: "Dockyards"
 dockyard_desc: "This building produces new ships for the state."
 dam_mountain: "$dam$"
 dam_mountain_plural: "$dam_plural$"
 dam_mountain_desc: "$dam_desc$"
 canal_kiel: "Kiel Canal Locks"
 canal_kiel_plural: "$canal_kiel$"
 canal_kiel_desc: "The Kiel Canal cannot function properly without its locks. Destroying them will severely restrict movement and cargo transport for an extended period."
 canal_panama: "Panama Canal Locks"
 canal_panama_plural: "$canal_panama$"
 canal_panama_desc: "The Panama Canal cannot function properly without its locks. Destroying them will severely restrict movement and cargo transport for an extended period."
 industrial_complex: "Civilian Factory"
 industrial_complex_plural: "Civilian Factories"
 industrial_complex_desc: "This building supplies consumer goods and enables construction of new buildings. It can be converted to military production if necessary."
 air_base: "Air Base"
 air_base_plural: "Air Bases"
 air_base_desc: "This building allows your air forces to be stationed in the state."
 naval_base: "Naval Base"
 naval_base_plural: "Naval Bases"
 naval_base_desc: "Extends your fleet's range and allows repairs. Enables supply deliveries and resource exports by sea. Higher levels increase supply throughput."
 bunker: "Land Fort"
 bunker_plural: "Land Forts"
 bunker_desc: "This building imposes an attack penalty of $VALUE|+%0$ per fort level on attackers in land combat. Attacks from multiple directions reduce the effect of the fortifications."
 coastal_bunker: "Coastal Fort"
 coastal_bunker_plural: "Coastal Forts"
 coastal_bunker_desc: "This building imposes an attack penalty of $VALUE|+%0$ per fort level on attackers during naval invasions."
 anti_air_building: "Anti-Air"
 anti_air_building_plural: "Anti-Air"
 anti_air_building_desc: "This building protects the state against enemy bombers and fires on hostile aircraft."
 synthetic_refinery: "Synthetic Refinery"
 synthetic_refinery_plural: "Synthetic Refineries"
 synthetic_refinery_desc: "This building produces in the state"
 synthetic_refinery_amount: "$VALUE|Y0=$"
 synthetic_refinery_resource: "£resources_strip|$FRAME$"
 radar_station: "Radar Station"
 radar_station_plural: "Radar Stations"
 radar_station_desc: "Radar provides information on enemy troops in nearby states.\nHigher levels increase its range.\nIt also improves detection of enemy aircraft in the region, increasing your pilots' chances of success.\nRadar additionally improves detection of enemy fleets."
 rocket_site: "Rocket Site"
 rocket_site_plural: "Rocket Sites"
 rocket_site_desc: "This building allows you to deploy manufactured rockets in the state."
 nuclear_reactor_heavy_water: "Heavy Water Nuclear Reactor"
 nuclear_reactor_heavy_water_plural: "Heavy Water Nuclear Reactors"
 nuclear_reactor_heavy_water_desc: "This building produces enriched uranium in the state for use in nuclear weapons.\nHeavy water reactors are somewhat cheaper than graphite reactors, but produce less material for nuclear weapons."
 nuclear_reactor: "Nuclear Reactor"
 nuclear_reactor_plural: "Nuclear Reactors"
 nuclear_reactor_desc: "This building produces enriched uranium in the state for use in atomic weapons."
 commercial_nuclear_reactor: "Civilian Nuclear Reactor"
 commercial_nuclear_reactor_plural: "Civilian Nuclear Reactors"
 commercial_nuclear_reactor_desc: "This facility supplies enriched uranium for nuclear weapons and generates electricity for the civilian economy."
 nuclear_facility: "Nuclear Research Facility"
 nuclear_facility_plural: "Nuclear Research Facilities"
 nuclear_facility_desc: "Experimental nuclear research facilities enable projects that use nuclear energy."
 air_facility: "Aerodynamics and Avionics Facility"
 air_facility_plural: "Aerodynamics and Avionics Facilities"
 air_facility_desc: "Experimental aerodynamics and avionics facilities enable projects involving aircraft, rockets and electronics."
 naval_facility: "Naval Engineering Facility"
 naval_facility_plural: "Naval Engineering Facilities"
 naval_facility_desc: "Experimental naval engineering facilities enable projects to develop surface ships and submarines.\nThese facilities can be built only in coastal provinces."
 mega_gun_emplacement: "Multi-charge Large-calibre Gun"
 mega_gun_emplacement_plural: "Multi-charge Guns"
 mega_gun_emplacement_desc: "This large-calibre gun uses a multi-charge propulsion system to achieve an unprecedented firing range. A series of underground tunnels accelerates shells to supersonic speed before launching them at distant targets."
 stronghold_network: "Stronghold Network"
 stronghold_network_plural: "Stronghold Networks"
 stronghold_network_desc: "An extensive defensive system of massive bunkers and heavily fortified positions, built to repel enemy offensives and secure key strategic areas."
 land_facility: "Land Warfare Facility"
 land_facility_plural: "Land Warfare Facilities"
 land_facility_desc: "Experimental land warfare facilities enable research and development projects for land weapons, including special tanks, artillery and other equipment."
 landmark_statue_of_liberty: "Statue of Liberty"
 landmark_statue_of_liberty_plural: "$landmark_statue_of_liberty$"
 landmark_statue_of_liberty_desc: "The imposing Statue of Liberty rises proudly above New York Harbor, welcoming immigrants seeking a new life in the United States. Over time, it has become an embodiment of American ideals, freedom and the pursuit of happiness."
 landmark_big_ben: "Big Ben"
 landmark_big_ben_plural: "$landmark_big_ben$"
 landmark_big_ben_desc: "The Palace of Westminster's clock tower, known as Big Ben, is a cultural and historical symbol of Britain and parliamentary democracy. Built in 1859 in the Gothic Revival style, Big Ben is now the third-tallest tower in Britain."
 landmark_colosseum: "Colosseum"
 landmark_colosseum_plural: "$landmark_colosseum$"
 landmark_colosseum_desc: "The Colosseum, the largest amphitheatre of the ancient world, was built in the reign of Emperor Titus in the heart of Rome. Public spectacles continued to be held here even after the Roman Empire fell."
 landmark_cristo_redentor: "Christ the Redeemer"
 landmark_cristo_redentor_plural: "$landmark_cristo_redentor$"
 landmark_cristo_redentor_desc: "Completed in 1931, the statue of Christ the Redeemer towers over Rio de Janeiro. It is a national symbol of Brazil and holds profound significance for local Catholics."
 landmark_eiffel_tower: "Eiffel Tower"
 landmark_eiffel_tower_plural: "$landmark_eiffel_tower$"
 landmark_eiffel_tower_desc: "Built in 1889, the tower is named after its chief designer, Gustave Eiffel. Standing on the Champ de Mars, it is regarded as France's foremost symbol and a source of national pride."
 landmark_kremlin: "Moscow Kremlin"
 landmark_kremlin_plural: "$landmark_kremlin$"
 landmark_kremlin_desc: "The Kremlin is a fortress in central Moscow. Within its walls stands the Grand Kremlin Palace, formerly a residence of the Russian emperors. The Moskva River lies to the south, Saint Basil's Cathedral and Red Square to the east, and Alexander Garden to the west. Today, the Kremlin is universally recognised as a symbol of state power."
 landmark_berlin_reichstag: "Reichstag"
 landmark_berlin_reichstag_plural: "$landmark_berlin_reichstag$"
 landmark_berlin_reichstag_desc: "The Reichstag, officially the Imperial Assembly Building, is the historic parliament building on Berlin's Platz der Republik. It housed the federal council until the fire of 1933. The building is an important symbol for the German people and is often associated with the country as a whole."
 landmark_tokyo_imperial_palace: "Imperial Palace"
 landmark_tokyo_imperial_palace_plural: "$landmark_tokyo_imperial_palace$"
 landmark_tokyo_imperial_palace_desc: "Since the Meiji Restoration and the overthrow of the last shogun, the Tokyo Imperial Palace has been the emperor's principal residence. It symbolises the pride and reverence of the Japanese people, inspiring them to work diligently."
 landmark_national_diet: "National Diet Building"
 landmark_national_diet_plural: "$landmark_national_diet$"
 landmark_national_diet_desc: "The Kokkai-gijido houses both chambers of Japan's National Diet. Completed in early 1936, it was built almost entirely from Japanese materials, with few exceptions. The previous building was destroyed by a devastating fire in 1925. Although the parliament building has been destroyed repeatedly, this time it will stand for centuries!"
 landmark_hakko_ichiu: "Hakko Ichiu Monument"
 landmark_hakko_ichiu_plural: "$landmark_hakko_ichiu$"
 landmark_hakko_ichiu_desc: "The Hakko Ichiu Tower was erected to commemorate the 2600th anniversary of Japan's founding. The monument symbolises Japan's destiny to unite the eight corners of the world under one roof."
 landmark_hofburg_palace: "Hofburg Palace"
 landmark_hofburg_palace_plural: "$landmark_hofburg_palace$"
 landmark_hofburg_palace_desc: "The Hofburg is the former residence of the Habsburg dynasty, overlooking Heldenplatz. Perhaps an Austrian ruler, whether president or king, will one day govern from here again."
 landmark_berlin_volkshalle: "Hall of the People"
 landmark_berlin_volkshalle_plural: "$landmark_berlin_volkshalle$"
 landmark_berlin_volkshalle_desc: "The Hall of the People symbolises our people's indomitable will and their worthy ambition to dominate the world. It will show everyone that conquest can achieve anything and that our homeland can realise even seemingly impossible dreams."
 landmark_sadabad_complex: "Saadabad Complex"
 landmark_sadabad_complex_desc: "Built by the Qajars and expanded by the Pahlavi dynasty, the Saadabad Complex in northern Tehran serves as the shah's residence and a centre of power. Its palaces and gardens reflect Iran's shifting political landscape, from conservatism to modernism."
 landmark_taj_mahal: "Taj Mahal"
 landmark_taj_mahal_desc: "The Taj Mahal is a masterpiece of Mughal architecture. Its great white marble domes and intricately designed gardens make it one of India's foremost symbols, a testament to both imperial power and historical heritage."
 landmark_hagia_sophia: "Hagia Sophia"
 landmark_hagia_sophia_desc: "Standing at the crossroads of empires, Hagia Sophia has served as a Byzantine cathedral, an Ottoman mosque and a symbol of Istanbul's ever-changing rulers. Its massive dome and spacious halls reflect both its spiritual importance and the ambitions of those who sought to rule the city."
 naval_supply_hub: "Naval Supply Hub"
 naval_supply_hub_desc: "This building allows your fleets to resupply and refuel here as well as at their home ports, extending the range of §Ytask forces§!.\nA naval supply hub can be built only in a coastal province with a naval base of at least level 8."
 naval_headquarters: "Naval Headquarters"
 naval_headquarters_desc: "This building allows you to assign admirals, improving the effectiveness of §Ytask forces§! operating within the naval headquarters' range.\n\nNo more than $MAX|Y$ headquarters may have assigned admirals.\nCurrently assigned: $CURRNUM|H$\n\nNaval headquarters can be built only in a coastal province with a naval base of at least level 8."
 landmark_great_wall_section: "Great Wall"
 landmark_great_wall_section_desc: "Built by dozens of governments over hundreds of years, the Great Wall is a masterpiece of logistics. Today, it can be seen as a symbol of the courage and resolve of the Chinese people."
 landmark_great_wall_section_plural: "$landmark_great_wall_section$"
 landmark_nanjing_presidential_palace: "Nanjing Presidential Palace"
 landmark_nanjing_presidential_palace_desc: "Nanjing's Presidential Palace is an ancient and respected complex where Sun Yat-sen himself was inaugurated after the fall of the Qing dynasty."
 landmark_nanjing_presidential_palace_plural: "$landmark_nanjing_presidential_palace$"
 landmark_forbidden_city: "Forbidden City"
 landmark_forbidden_city_plural: "$landmark_forbidden_city$"
 landmark_forbidden_city_desc: "An ancient Ming government complex, the Forbidden City symbolises China's long harmony and prosperity. Faced with the threat of another Japanese invasion, its treasures and artefacts have now been secretly evacuated."
