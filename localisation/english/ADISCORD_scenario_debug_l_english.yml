 ADISCORD_test_wars_category: "Test Wars"
 ADISCORD_test_wars_category_desc: "Test decisions for checking regional conflicts."
 APH_start_test_war_with_OSF: "Test: War with OSF"
 APH_start_test_war_with_OSF_desc: "Start the subsequent test conflict between APH and OSF. If APH wins, it annexes OSF; if it loses, the borders remain unchanged."

 ADISCORD_debug_war_log_on: "§RDEBUG:§! Enable Peace Trace"
 ADISCORD_debug_war_log_on_desc: "Writes native capitulation and peace callbacks to game.log. Debug mode only; disable after testing."
 ADISCORD_debug_war_log_off: "§RDEBUG:§! Disable Peace Trace"
 ADISCORD_debug_war_log_off_desc: "Stops automatic peace tracing. Manual snapshots remain available."
 ADISCORD_debug_war_snapshot: "§RDEBUG:§! Dump War and Territory State"
 ADISCORD_debug_war_snapshot_desc: "Writes the current country, enemies, factions, capitals, owned states and controllers to game.log. Also records Kefreyt campaign variables and the disputed eastern states. Does not change the map."
 ADISCORD_debug_war_declare: "§RDEBUG:§! Raw War Against [FROM.GetName]"
 ADISCORD_debug_war_declare_desc: "Declares a real annexation war without initializing a story campaign. Use to isolate the generic peace handler. Does not create a faction or force a victory. Use only a disposable save."
 ADISCORD_debug_war_join_faction: "§RDEBUG:§! Join the Alliance of [FROM.GetName]"
 ADISCORD_debug_war_join_faction_desc: "Joins the selected country's existing faction, or creates one using the mod template. Does not join wars. Useful for reproducing a neutral faction member. Never replaces an existing membership."
 ADISCORD_debug_war_join_wars: "§RDEBUG:§! Join the Wars of [FROM.GetName]"
 ADISCORD_debug_war_join_wars_desc: "Adds this country to the selected ally's existing wars. Does not create parallel declarations. Check the war screen after advancing the simulation."
 ADISCORD_debug_war_occupy_capital: "§RDEBUG:§! Occupy the Capital of [FROM.GetName]"
 ADISCORD_debug_war_occupy_capital_desc: "Changes only the capital state controller. Advance time for native capitulation checks. Does not set defeated flags, transfer ownership or award a treaty."
 ADISCORD_debug_war_occupy_country: "§RDEBUG:§! Occupy the Owned States of [FROM.GetName]"
 ADISCORD_debug_war_occupy_country_desc: "Changes control, not ownership, of every state owned by the selected enemy. Includes remote pockets. Native callbacks decide whether a treaty is ready; an undefeated ally can still block it."
 ADISCORD_debug_war_liberate: "§RDEBUG:§! Restore Occupied States to [FROM.GetName]"
 ADISCORD_debug_war_liberate_desc: "Returns states occupied by this country or its subjects to their selected owner. Does not resurrect an annexed country. Advance time and verify that liberation blocks final peace again."
 ADISCORD_debug_war_white_peace: "§RDEBUG:§! White Peace with [FROM.GetName]"
 ADISCORD_debug_war_white_peace_desc: "Emergency cleanup, not a victory test. Native white peace can also end faction and subject war relations. No scripted victory reward is forced."
 ADISCORD_debug_war_major_on: "§RDEBUG:§! Make [FROM.GetName] a Test Major"
 ADISCORD_debug_war_major_on_desc: "Makes the selected non-major country a mandatory native war participant. Marks only this debug change, so the matching cleanup does not remove a pre-existing major setting."
 ADISCORD_debug_war_major_off: "§RDEBUG:§! Remove Test Major Status from [FROM.GetName]"
 ADISCORD_debug_war_major_off_desc: "Reverts only a major setting added with this debug tool. Do not use midway through a story campaign that requires this country to remain a major."
 ADISCORD_debug_war_val_start: "§RDEBUG:§! Start the Frontier War with [FROM.GetName]"
 ADISCORD_debug_war_val_start_desc: "Skips the demand and refusal, then calls the real Kefreyt campaign: coalition, majors and war entry. Still requires the actual post-Stelander-war world and valid territory. It does not forge a civil-war victory."
 ADISCORD_debug_war_val_check: "§RDEBUG:§! Recheck the Frontier Treaty"
 ADISCORD_debug_war_val_check_desc: "Runs the existing campaign check once against actual ownership, control and members. Does not mark any country defeated or bypass living allies."
 ADISCORD_debug_war_val_abort: "§RDEBUG:§! Abort the Frontier Test"
 ADISCORD_debug_war_val_abort_desc: "Calls the real campaign cleanup: ends its war relations, removes its temporary majors and its added alliance memberships. Gives no victory reward. Reload a pre-war save to replay the same map."
 ADISCORD_debug_war_reserves: "§RDEBUG:§! Add Test Army Reserves"
 ADISCORD_debug_war_reserves_desc: "Adds 50,000 manpower and 10,000 infantry equipment to the current country. Does not spawn armies or change the campaign result."
 ADISCORD_war_debug_faction: "Test Coalition"
