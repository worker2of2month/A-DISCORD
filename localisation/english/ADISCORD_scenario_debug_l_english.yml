 ADISCORD_test_wars_category: "Test Wars"
 ADISCORD_test_wars_category_desc: "Test decisions for checking regional conflicts."
 APH_start_test_war_with_OSF: "Test: War with OSF"
 APH_start_test_war_with_OSF_desc: "Start the subsequent test conflict between APH and OSF. If APH wins, it annexes OSF; if it loses, the borders remain unchanged."

 ADISCORD_debug_war_log_on: "§RDEBUG:§! Enable Peace Trace"
 ADISCORD_debug_war_log_on_desc: "Writes native capitulation and peace callbacks to game.log. Debug mode only; disable after testing."
 ADISCORD_debug_war_log_off: "§RDEBUG:§! Disable Peace Trace"
 ADISCORD_debug_war_log_off_desc: "Stops automatic peace tracing. Manual snapshots remain available."
 ADISCORD_debug_war_snapshot: "§RDEBUG:§! Dump War and Territory State"
 ADISCORD_debug_war_snapshot_desc: "Writes the current country, enemies, factions, capitals, owned states and controllers to game.log. Also records Kefreyt campaign variables and the disputed eastern states. Does not change the map."
 ADISCORD_debug_war_val_start: "§RDEBUG:§! Start the Frontier War with [FROM.GetName]"
 ADISCORD_debug_war_val_start_desc: "Skips the demand and refusal, then calls the real Kefreyt campaign: coalition, majors and war entry. Still requires the actual post-Stelander-war world and valid territory. It does not forge a civil-war victory."
 ADISCORD_debug_war_val_check: "§RDEBUG:§! Recheck the Frontier Treaty"
 ADISCORD_debug_war_val_check_desc: "Runs the existing campaign check once against actual ownership, control and members. Does not mark any country defeated or bypass living allies."
 ADISCORD_debug_war_val_abort: "§RDEBUG:§! Abort the Frontier Test"
 ADISCORD_debug_war_val_abort_desc: "Calls the real campaign cleanup: ends its war relations, removes its temporary majors and its added alliance memberships. Gives no victory reward. Reload a pre-war save to replay the same map."
 ADISCORD_debug_war_sts_vs_val: "§RDEBUG:§! Scenario: Shabrat vs Kefreyt"
 ADISCORD_debug_war_sts_vs_val_desc: "Starts a clean postwar war in which Kefreyt attacks Shabrat's Stelander. Uses the normal Kefreyt-Stelander capitulation and administration settlement."
 ADISCORD_debug_war_sts_vs_nod: "§RDEBUG:§! Scenario: Shabrat vs Nodrul"
 ADISCORD_debug_war_sts_vs_nod_desc: "Starts a clean postwar war in which Nodrul attacks Shabrat's Stelander. Kefreyt remains outside the war."
 ADISCORD_debug_war_sts_vs_val_nod: "§RDEBUG:§! Scenario: Shabrat vs Kefreyt + Nodrul"
 ADISCORD_debug_war_sts_vs_val_nod_desc: "Starts TWO INDEPENDENT wars at the same time: Kefreyt against Shabrat and Nodrul against Shabrat. Use this to verify that settlement with one aggressor does not incorrectly erase or consume the other war."
 ADISCORD_debug_war_stp_vs_val: "§RDEBUG:§! Scenario: Party vs Kefreyt"
 ADISCORD_debug_war_stp_vs_val_desc: "Starts a clean postwar war in which Kefreyt attacks Party-led Stelander. Uses the normal Kefreyt final-campaign settlement path."
 ADISCORD_debug_war_stp_vs_nod: "§RDEBUG:§! Scenario: Party vs Nodrul"
 ADISCORD_debug_war_stp_vs_nod_desc: "Starts the Party's real postwar Nodrul invasion scenario, including the normal invasion receipt and Nodrul war modifier."
 ADISCORD_debug_war_stp_vs_val_nod: "§RDEBUG:§! Scenario: Party vs Kefreyt + Nodrul"
 ADISCORD_debug_war_stp_vs_val_nod_desc: "Starts TWO INDEPENDENT wars at the same time: Kefreyt against Party-led Stelander and Nodrul's scripted invasion against the Party. This is the main double-ultimatum peace-routing test."
 ADISCORD_debug_war_frontier_with_nod: "§RDEBUG:§! Scenario: Frontier War + Nodrul Intervention"
 ADISCORD_debug_war_frontier_with_nod_desc: "Starts the selected northern tribal campaign through Kefreyt's real Frontier war code and pre-marks Nodrul's deadline as expired. The normal delayed war-entry callback then brings Nodrul in as guarantor."
 ADISCORD_debug_war_val_join_sts_nod: "§RDEBUG:§! Scenario: Shabrat + Kefreyt vs Nodrul"
 ADISCORD_debug_war_val_join_sts_nod_desc: "Starts Shabrat's war against Nodrul, then one hour later forms the temporary Kefreyt-Stelander wartime alliance and joins Kefreyt to THE SAME WAR. Victory tests the special first-war partition: Shabrat receives the south and Kefreyt keeps the north as contract administrations."
 ADISCORD_debug_war_val_vs_nod: "§RDEBUG:§! Scenario: Kefreyt vs Nodrul"
 ADISCORD_debug_war_val_vs_nod_desc: "Starts a standalone final-campaign war between Kefreyt and Nodrul after Stelander has already been brought into Kefreyt's sphere. Nodrul is registered through the real final-campaign settlement system."
 ADISCORD_debug_war_val_nod_victory: "§RDEBUG:§! Finish Nodrul War: Kefreyt Victory"
 ADISCORD_debug_war_val_nod_victory_desc: "Forces the current Kefreyt-Nodrul war through the production Nodrul scripted settlement. It does not directly annex Nodrul."
 ADISCORD_debug_war_val_victory: "§RDEBUG:§! Finish Current Kefreyt War: Victory"
 ADISCORD_debug_war_val_victory_desc: "Finishes the active Kefreyt QA war through its authored settlement: Frontier victory, shared Shabrat-Nodrul settlement, or the final STP/STS/NOD administration route."
 ADISCORD_debug_war_val_nod_reconcile: "§RDEBUG:§! Recheck Nodrul Scripted Peace"
 ADISCORD_debug_war_val_nod_reconcile_desc: "Re-runs final-campaign reconciliation and reserved settlement processing for Nodrul. Use this on a save where Nodrul has capitulated but the scripted peace did not complete."
 ADISCORD_debug_war_external_cleanup: "§RDEBUG:§! Abort External War Scenarios"
 ADISCORD_debug_war_external_cleanup_desc: "Emergency QA cleanup. Ends active VAL/NOD wars against STP or STS, closes the current Frontier/final debug campaign, clears joint-campaign receipts and removes the Party Nodrul invasion marker. Gives no victory settlement."
 ADISCORD_debug_war_reserves: "§RDEBUG:§! Add Test Army Reserves"
 ADISCORD_debug_war_reserves_desc: "Adds 50,000 manpower and 100,000 infantry equipment to the current country. Does not spawn armies or change the campaign result."
 ADISCORD_war_debug_faction: "Test Coalition"

 ADISCORD_debug_val_open_south_route: "§RDEBUG:§! Open Southern Concession"
 ADISCORD_debug_val_open_south_route_desc: "Enables the Eflor concession and refreshes the real southern trade-route conditions."
 ADISCORD_debug_val_close_south_route: "§RDEBUG:§! Close Southern Route"
 ADISCORD_debug_val_close_south_route_desc: "Clears the debug concession, commission and upgrade, then refreshes the network."
 ADISCORD_debug_val_upgrade_south_route: "§RDEBUG:§! Upgrade Southern Route"
 ADISCORD_debug_val_upgrade_south_route_desc: "Marks the southern route upgraded to test its increased income."
 ADISCORD_debug_val_reset_corridor_project: "§RDEBUG:§! Reset Corridor Project"
 ADISCORD_debug_val_reset_corridor_project_desc: "Refunds the current construction deposit and frees the project slot."
 ADISCORD_debug_val_fund_treasury: "§RDEBUG:§! Fund Kefreyt with 5000 Treasury"
 ADISCORD_debug_val_fund_treasury_desc: "Sets Kefreyt's treasury to 5000 and invalidates the budget cache."
