 vacant: "Vacant"
 vacant_desc: "The position is currently unfilled."

 # Law categories
 social_laws: "Social Laws"
 social_laws_desc: "Laws governing social structure, the information environment, social institutions, education, healthcare, and cultural policy."
 economic_laws: "Economic Laws"
 economic_laws_desc: "Laws governing the economic model, trade, and the fiscal burden."
 army_laws: "Military Laws"
 army_laws_desc: "Laws governing mobilization and the organization of the armed forces."
 ADISCORD_society_type_laws: "Social Structure"
 ADISCORD_society_type_laws_desc: "This category determines the social institutions and economic capabilities on which the country depends. More complex structures offer broader opportunities for development, but require more resources and competent administration."
 ADISCORD_society_type_traditional: "Traditional Society"
 ADISCORD_society_type_traditional_desc: "Society rests on custom, family, community, and local authority. It is stable and inexpensive for a weak state, but poorly suited to industrialization, mass education, and rapid mobilization."
 ADISCORD_society_type_agrarian: "Agrarian Society"
 ADISCORD_society_type_agrarian_desc: "Most people make their living from the land, resource extraction, and local production. This structure provides demographic and resource support, but limits industrial productivity, urbanization, and scientific progress."
 ADISCORD_society_type_industrial: "Industrial Society"
 ADISCORD_society_type_industrial_desc: "Factories, transport, mass employment, and labor discipline form the country's foundation. Industrial society expands production and military industry, but requires infrastructure and well-administered cities."
 ADISCORD_society_type_post_industrial: "Post-Industrial Society"
 ADISCORD_society_type_post_industrial_desc: "Services, education, administration, complex institutions, and technological supply chains come to the fore. This accelerates research and makes the economy more adaptable, but raises costs and dependence on a competent state apparatus."
 ADISCORD_society_type_information: "Information Society"
 ADISCORD_society_type_information_desc: "The country relies on data, computer networks, expert systems, and a dense concentration of knowledge. An information society surpasses a conventional post-industrial system in efficiency and research, but requires an advanced state, ample energy, and resilient social infrastructure."

 ADISCORD_information_laws: "Information Policy"
 ADISCORD_information_laws_desc: "This category sets the rules for the press, public forums, and official communications. Tighter control makes the public agenda easier to manage, but restricts independent exchange of views."
 ADISCORD_taxation_laws: "Tax System"
 ADISCORD_taxation_laws_desc: "This category determines how mandatory payments are recorded and collected. The chosen system changes the reliability of state revenue and the burden placed on the economy."
 ADISCORD_military_organization_laws: "Military Organization"
 ADISCORD_military_organization_laws_desc: "How the army is organized between local initiative, professional service, and centralized staff authority."

 ADISCORD_information_open_press: "Free Press"
 ADISCORD_information_open_press_desc: "Editors and public forums operate without prior government authorization. This supports the free exchange of ideas, but makes public opinion harder to manage."
 ADISCORD_information_licensed_press: "Regulated Press"
 ADISCORD_information_licensed_press_desc: "Newspapers and broadcasters operate under state rules and licenses. The government gains a more predictable information environment, but editorial independence is restricted."
 ADISCORD_information_state_bulletins: "State Media"
 ADISCORD_information_state_bulletins_desc: "Official bureaus and the outlets accountable to them distribute the principal news. The government can maintain a consistent line more easily, but access to alternative information declines."
 ADISCORD_information_wartime_censorship: "Wartime Censorship"
 ADISCORD_information_wartime_censorship_desc: "Military authorities review reports on the front, casualties, and supplies. This limits the spread of sensitive information during wartime, but reduces public access to a complete account."
 ADISCORD_information_sealed_networks: "State Information Control"
 ADISCORD_information_sealed_networks_desc: "Communications, the press, and public forums are placed under direct state supervision. Control strengthens administrative authority during a crisis, but suppresses independent sources and public initiative."

 ADISCORD_taxation_light_dues: "Local Taxation"
 ADISCORD_taxation_light_dues_desc: "Local taxes, duties, and negotiated contributions take precedence over a unified central administration. The system places a lighter burden on private activity and a weak state, but raises less revenue in a crisis."
 ADISCORD_taxation_balanced_register: "Unified Tax System"
 ADISCORD_taxation_balanced_register_desc: "Payments are organized in a clear register defining who owes what and to which authority. This provides a basic, predictable system for a state with average administrative capacity."
 ADISCORD_taxation_progressive_brackets: "Progressive Taxation"
 ADISCORD_taxation_progressive_brackets_desc: "The tax burden is distributed according to ability to pay. The public regards the system as fairer, but large businesses must hold larger reserves against greater risk."
 ADISCORD_taxation_industrial_tariffs: "Protectionist Tariffs"
 ADISCORD_taxation_industrial_tariffs_desc: "Tariffs and incentives direct factories toward selected industries. Growth becomes more focused, but less flexible."
 ADISCORD_taxation_extraction_quotas: "Emergency Levies"
 ADISCORD_taxation_extraction_quotas_desc: "An emergency system of requisitions and compulsory deliveries sharply increases resource collection, but burdens the civilian economy, undermines stability, and strains the state apparatus."

 ADISCORD_military_organization_militia_autonomy: "Territorial Militia"
 ADISCORD_military_organization_militia_autonomy_desc: "Local units assemble quickly and know their own territory. They are less effective than regular formations in a unified front line."
 ADISCORD_military_organization_cadre_army: "Cadre Army"
 ADISCORD_military_organization_cadre_army_desc: "A small professional core maintains order, trains the reserve, and places limited demands on society."
 ADISCORD_military_organization_contract_brigades: "Contract Service"
 ADISCORD_military_organization_contract_brigades_desc: "Military service is based on contracts with professional personnel. Unit readiness and effectiveness improve, but maintaining the army requires reliable funding."
 ADISCORD_military_organization_general_staff: "Centralized Command"
 ADISCORD_military_organization_general_staff_desc: "The general staff centralizes coordination and planning, accelerates mobilization, and improves army organization. Personnel training takes longer as a result."
 ADISCORD_military_organization_total_defense_grid: "Territorial Defense System"
 ADISCORD_military_organization_total_defense_grid_desc: "The state establishes territorial defenses and prepares reserves for mobilization in advance. National defense grows stronger, but civilian construction and social stability bear a greater burden."

 ADISCORD_welfare_laws: "Social Welfare"
 ADISCORD_welfare_laws_desc: "This category determines what assistance people receive in cases of poverty, illness, and loss of income. Broader protection strengthens social resilience, but requires continuous expenditure."
 ADISCORD_education_laws: "Education"
 ADISCORD_education_laws_desc: "This category determines the organization of schools and specialist training. A more developed system provides skilled personnel, but requires time and funding."
 ADISCORD_healthcare_laws: "Healthcare"
 ADISCORD_healthcare_laws_desc: "This category determines access to treatment and disease prevention. Developed healthcare strengthens society, but requires reliable funding and qualified staff."
 ADISCORD_cultural_policy_laws: "Cultural Policy"
 ADISCORD_cultural_policy_laws_desc: "This category determines the state's approach to culture, public customs, and civic associations. Supporting selected practices can reinforce common norms, but restricts other forms of expression."
 ADISCORD_industrial_policy_laws: "Industrial Policy"
 ADISCORD_industrial_policy_laws_desc: "This category determines how the state directs factories, workshops, and production networks. Priority industries receive more attention, but other economic needs may go unsupported."
 ADISCORD_labor_policy_laws: "Labor Policy"
 ADISCORD_labor_policy_laws_desc: "This category determines the rules governing employment, working hours, and worker protection. Stricter standards make labor more predictable, but limit the freedom of enterprises."
 ADISCORD_infrastructure_laws: "Infrastructure"
 ADISCORD_infrastructure_laws_desc: "This category determines how roads, supply hubs, and communications are built and maintained. The chosen approach changes the pace of network development and the investment required."
 ADISCORD_officer_corps_laws: "Officer Corps"
 ADISCORD_officer_corps_laws_desc: "How the army selects, promotes, and retains its commanders."
 ADISCORD_logistics_laws: "Military Logistics"
 ADISCORD_logistics_laws_desc: "How the army supplies its units, depots, and front-line routes."
 ADISCORD_training_laws: "Military Training"
 ADISCORD_training_laws_desc: "How instruction, call-ups, standards, and field training are organized."
 ADISCORD_internal_security_laws: "Internal Security"
 ADISCORD_internal_security_laws_desc: "How the state employs garrisons, police, and security services within the country."

 ADISCORD_welfare_basic_services: "Basic Social Assistance"
 ADISCORD_welfare_basic_services_desc: "The state maintains a minimal network of benefits, shelters, and social services. Assistance eases the most severe effects of poverty, but does not meet every need."
 ADISCORD_education_basic_schools: "Basic Schools"
 ADISCORD_education_basic_schools_desc: "Schools operate unevenly, but the state maintains a minimal system of literacy and personnel training."
 ADISCORD_healthcare_basic_clinics: "Primary Healthcare"
 ADISCORD_healthcare_basic_clinics_desc: "Primary care is unevenly available, but the country has the foundations of a healthcare system."
 ADISCORD_cultural_policy_public_entertainment: "Mass Culture"
 ADISCORD_cultural_policy_public_entertainment_desc: "The state permits and supports accessible entertainment, public celebrations, and popular publications. This creates common forms of leisure, but leaves little room for independent cultural initiatives."
 ADISCORD_industrial_policy_balanced_workshops: "Support for Private Industry"
 ADISCORD_industrial_policy_balanced_workshops_desc: "Industrial policy remains measured: the state supports production without excessive intervention in the market."
 ADISCORD_labor_policy_loose_contracts: "Flexible Employment"
 ADISCORD_labor_policy_loose_contracts_desc: "Employers and workers negotiate flexible terms, but weak labor protections can undermine stability."
 ADISCORD_infrastructure_patchwork_roads: "Local Road Administration"
 ADISCORD_infrastructure_patchwork_roads_desc: "Infrastructure is repaired as necessary, without a comprehensive plan but at low cost and with little delay."
 ADISCORD_officer_corps_local_seniority: "Promotion by Seniority"
 ADISCORD_officer_corps_local_seniority_desc: "Commanders advance through established circles and long-standing units. The system is familiar to the army, though not always efficient."
 ADISCORD_logistics_civilian_contracts: "Civilian Suppliers"
 ADISCORD_logistics_civilian_contracts_desc: "The army relies in part on civilian suppliers, warehouses, and carriers."
 ADISCORD_training_basic_drills: "Basic Drills"
 ADISCORD_training_basic_drills_desc: "Soldiers receive the minimum training needed for the army to maintain formation and discipline."
 ADISCORD_internal_security_local_garrisons: "Territorial Garrisons"
 ADISCORD_internal_security_local_garrisons_desc: "Garrisons help maintain order within the country, but divert part of the army's capacity from front-line training."

 ADISCORD_welfare_charity_relief: "Charitable Relief"
 ADISCORD_welfare_charity_relief_desc: "Charitable foundations, communities, and private donations provide aid to those in need. The state spends less, but support depends on local resources and does not reach everyone."
 ADISCORD_welfare_social_insurance: "Social Insurance"
 ADISCORD_welfare_social_insurance_desc: "Benefits and payments are tied to employment, contributions, and clear rules. Society gains greater security, although the system requires funding and administration."
 ADISCORD_welfare_universal_provision: "Universal Social Provision"
 ADISCORD_welfare_universal_provision_desc: "The state provides extensive assistance regardless of the recipient's status. Social security improves, but maintaining the system requires substantial public resources."
 ADISCORD_welfare_rationed_support: "Wartime Rationing"
 ADISCORD_welfare_rationed_support_desc: "Assistance and essential goods are distributed through quotas, registers, and queues. This concentrates resources during a crisis, but restricts consumption and ordinary life."
 ADISCORD_education_informal_instruction: "Local Education"
 ADISCORD_education_informal_instruction_desc: "Knowledge is passed on through families, workshops, tutors, and informal schools. The system costs very little, but gives the country an uneven base of trained personnel."
 ADISCORD_education_civic_curriculum: "Civic Education"
 ADISCORD_education_civic_curriculum_desc: "Schools teach a shared political framework alongside literacy. This strengthens loyalty and order, although the education system becomes less independent."
 ADISCORD_education_technical_institutes: "Technical Institutes"
 ADISCORD_education_technical_institutes_desc: "The state gives priority to engineers, skilled trades, and applied sciences. Factories gain the personnel they need, but education becomes more rigid and utilitarian."
 ADISCORD_education_elite_academies: "Elite Academies"
 ADISCORD_education_elite_academies_desc: "Selective schools and academies train administrators, military specialists, and researchers. The country gains a strong reserve of expertise, but access to education remains narrow."
 ADISCORD_healthcare_private_care: "Private Healthcare"
 ADISCORD_healthcare_private_care_desc: "Treatment is funded mainly by families, private physicians, and local associations. The state reduces expenditure, but access to care depends on income and place of residence."
 ADISCORD_healthcare_public_hospitals: "Public Hospitals"
 ADISCORD_healthcare_public_hospitals_desc: "A hospital network gives the population more reliable access to medical care. The system strengthens social resilience, but requires continuous funding."
 ADISCORD_healthcare_preventive_medicine: "Preventive Medicine"
 ADISCORD_healthcare_preventive_medicine_desc: "Public health services monitor disease and carry out preventive measures. Illness can be contained earlier, but the system requires specialists, record-keeping, and additional expenditure."
 ADISCORD_healthcare_military_medical_service: "Military Medical Service"
 ADISCORD_healthcare_military_medical_service_desc: "Healthcare is reorganized around the needs of the army, the rear, and the wounded. This preserves military effectiveness during wartime, but civilian clinics receive less attention."
 ADISCORD_cultural_policy_tolerated_subcultures: "Cultural Pluralism"
 ADISCORD_cultural_policy_tolerated_subcultures_desc: "Different cultural and social groups may openly maintain their practices. This broadens the exchange of ideas, but weakens common norms and centralized oversight of public life."
 ADISCORD_cultural_policy_civic_festivals: "Civic Holidays"
 ADISCORD_cultural_policy_civic_festivals_desc: "The state organizes ceremonies, municipal events, and shared commemorations. They foster a sense of community, but require continuous expenditure and administrative involvement."
 ADISCORD_cultural_policy_avant_garde_patronage: "Support for Contemporary Art"
 ADISCORD_cultural_policy_avant_garde_patronage_desc: "The state funds new artistic movements, exhibitions, and cultural research. This policy encourages creativity and the exchange of ideas, but meets resistance from supporters of established forms."
 ADISCORD_cultural_policy_national_mythmaking: "Patriotic Cultural Policy"
 ADISCORD_cultural_policy_national_mythmaking_desc: "Culture and education are organized around a shared historical narrative and state symbols. This strengthens collective identity, but narrows the scope for criticism and alternative interpretations of the past."
 ADISCORD_industrial_policy_artisan_markets: "Artisan Production"
 ADISCORD_industrial_policy_artisan_markets_desc: "Small workshops and independent producers meet local demand and provide employment. This model supports private initiative, but cannot expand large-scale industry rapidly."
 ADISCORD_industrial_policy_civilian_expansion: "Civilian Industry Priority"
 ADISCORD_industrial_policy_civilian_expansion_desc: "Industry is directed toward housing, factories, and peacetime production. The economy develops more broadly, but military plants do not receive absolute priority."
 ADISCORD_industrial_policy_military_prioritization: "Military Industry Priority"
 ADISCORD_industrial_policy_military_prioritization_desc: "Raw materials, equipment, and labor are directed first to military orders. Defense production grows faster, but civilian needs and ordinary consumption are restricted."
 ADISCORD_industrial_policy_state_planning_boards: "Industrial Planning"
 ADISCORD_industrial_policy_state_planning_boards_desc: "State agencies allocate orders and coordinate production networks. Enterprises operate more coherently, but the economy loses some flexibility and requires greater administrative oversight."
 ADISCORD_labor_policy_guild_protections: "Professional Associations"
 ADISCORD_labor_policy_guild_protections_desc: "Professional associations represent workers and help protect working conditions. Social stability improves, but enterprises assume additional obligations and operate less flexibly."
 ADISCORD_labor_policy_regulated_shifts: "Labor Regulation"
 ADISCORD_labor_policy_regulated_shifts_desc: "The state sets rules for working hours, shifts, and workplace conditions. Employment becomes safer and more predictable, but production loses some momentum."
 ADISCORD_labor_policy_technocratic_work_norms: "Scientific Management"
 ADISCORD_labor_policy_technocratic_work_norms_desc: "Work processes follow common standards, record-keeping, and the rational allocation of tasks. Enterprises use resources more efficiently, but labor management becomes stricter and more demanding."
 ADISCORD_labor_policy_mobilized_labor: "Labor Mobilization"
 ADISCORD_labor_policy_mobilized_labor_desc: "The state assigns workers to priority construction projects and industries by administrative order. This concentrates labor quickly, but restricts freedom of employment and raises social tensions."
 ADISCORD_infrastructure_regional_roadworks: "Regional Infrastructure Programs"
 ADISCORD_infrastructure_regional_roadworks_desc: "Regional authorities and contractors develop roads and communications under approved programs. The network expands consistently, but requires coordination between regions and continuing investment."
 ADISCORD_infrastructure_rail_corridors: "Rail Corridors"
 ADISCORD_infrastructure_rail_corridors_desc: "Priority is given to main lines, junctions, and transport between key centers. Supply becomes more reliable, but such a network requires substantial investment."
 ADISCORD_infrastructure_strategic_highways: "Strategic Highways"
 ADISCORD_infrastructure_strategic_highways_desc: "Roads are designed to move troops, cargo, and reserves. Mobilization accelerates, but civilian infrastructure is subordinated to military requirements."
 ADISCORD_infrastructure_military_depots: "Military Depots"
 ADISCORD_infrastructure_military_depots_desc: "The state stockpiles weapons, fuel, and food at major supply hubs. The army gains more reliable supplies, but maintaining the depots diverts resources from the civilian economy."
 ADISCORD_officer_corps_merit_commissions: "Merit-Based Selection"
 ADISCORD_officer_corps_merit_commissions_desc: "Officers are selected according to service records, examinations, and professional training. The quality of command improves, but reform slows training and meets resistance within the army."
 ADISCORD_officer_corps_political_commissars: "Political Commissars"
 ADISCORD_officer_corps_political_commissars_desc: "Officials placed over commanders are responsible for political direction, morale, and unit reliability. Loyalty improves, but purely military effectiveness suffers."
 ADISCORD_officer_corps_general_staff_academy: "General Staff Academy"
 ADISCORD_officer_corps_general_staff_academy_desc: "Senior commanders study campaign planning, supply, and cooperation between service branches. Decision-making improves, but training such an elite is expensive."
 ADISCORD_officer_corps_emergency_promotions: "Wartime Promotions"
 ADISCORD_officer_corps_emergency_promotions_desc: "During wartime, commanders are appointed to vacant posts more quickly. Mobilization capacity grows, but less thoroughly vetted appointees weaken unit organization."
 ADISCORD_logistics_local_foraging: "Local Supply Procurement"
 ADISCORD_logistics_local_foraging_desc: "The army draws food and materials from local areas. This reduces pressure on depots, but harms relations with the population and weakens unit discipline."
 ADISCORD_logistics_centralized_depots: "Centralized Supply System"
 ADISCORD_logistics_centralized_depots_desc: "The army is supplied through a network of major depots under unified administration. Front-line resource consumption falls, but the system entails additional administrative and military expenditure."
 ADISCORD_logistics_motorized_supply: "Motorized Supply"
 ADISCORD_logistics_motorized_supply_desc: "Motorized transport makes supply more reliable and efficient, helping units sustain their organization. Operating the system raises military costs and diverts industrial capacity."
 ADISCORD_logistics_emergency_requisitioning: "Emergency Requisitioning"
 ADISCORD_logistics_emergency_requisitioning_desc: "The state introduces compulsory seizures of food, materials, and transport for the army. Front-line supply improves, but the burden on the population and local administration increases."
 ADISCORD_training_irregular_exercises: "Periodic Military Drills"
 ADISCORD_training_irregular_exercises_desc: "Reservists attend periodic call-ups and local exercises. The reserve can be deployed quickly, but training standards and unit organization remain limited."
 ADISCORD_training_standardized_program: "Unified Training Program"
 ADISCORD_training_standardized_program_desc: "Training units follow common standards and schedules. The army becomes more predictable, and commanders know what to expect from incoming replacements."
 ADISCORD_training_officer_led_wargames: "Command-Post Exercises"
 ADISCORD_training_officer_led_wargames_desc: "Commanders practice warfare through maps, scenarios, and reviews of past mistakes. This develops planning, but requires time, staff resources, and an undisturbed training period."
 ADISCORD_training_accelerated_bootcamps: "Accelerated Military Training"
 ADISCORD_training_accelerated_bootcamps_desc: "Recruits complete a shortened program before assignment to active units. Reinforcement and mobilization accelerate, but unit organization declines."
 ADISCORD_internal_security_neighborhood_watch: "Volunteer Patrols"
 ADISCORD_internal_security_neighborhood_watch_desc: "Volunteer patrols and local observers help maintain public order. Internal stability improves, but some military resources are diverted from combat training."
 ADISCORD_internal_security_investigative_bureaus: "Political Police"
 ADISCORD_internal_security_investigative_bureaus_desc: "Special agencies investigate organized opposition and politically suspect groups. Internal control grows along with the authority of the coercive apparatus."
 ADISCORD_internal_security_emergency_patrols: "Emergency Patrols"
 ADISCORD_internal_security_emergency_patrols_desc: "During a crisis, streets, communications hubs, and depots are placed under reinforced control. This helps maintain order, but draws personnel and resources away from the regular army."
 ADISCORD_internal_security_internal_directorate: "State Security Service"
 ADISCORD_internal_security_internal_directorate_desc: "A unified service coordinates the police, garrisons, and political surveillance. Internal stability improves, but maintaining a centralized apparatus requires substantial resources."
