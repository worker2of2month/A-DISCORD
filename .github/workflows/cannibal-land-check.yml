name: Northern land check
on:
  push:
    branches: [fix/cannibal-clean-land]
    paths: [.github/workflows/cannibal-land-check.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependencies
        run: python -m pip install Pillow numpy
      - name: Apply and verify the isolated patch
        env:
          PATCH_REF: ${{ github.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$PATCH_REF"
          git show "$PATCH_REF:.github/cannibal_land_patch.py" > /tmp/cannibal_land_patch.py
          python /tmp/cannibal_land_patch.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: northern-land-qa
          path: /tmp/cannibal-land-qa
