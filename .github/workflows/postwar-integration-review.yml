name: Postwar nationalisation and branch review
on:
  push:
    branches: [codex/postwar-integration-review]
    paths:
      - .github/workflows/postwar-integration-review.yml
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install Pillow
      - name: Verify baseline, regression tests and clean delivery
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, os, re, subprocess, sys, zlib
          evidence = Path('/tmp/postwar-evidence')
          evidence.mkdir(exist_ok=True)
          encoded = ''.join(Path(f'.github/postwar-integration-payload-{i}.txt').read_text().strip() for i in (1, 2, 3))
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '5cb5d7c9544dada68189478a1f6268d4fe23736ccbee01bc585d59775373e2df'
          patch_path = evidence / 'postwar.patch'
          patch_path.write_bytes(patch)
          base = '84104110e06281b14a042976e26a871101d719a5'
          subprocess.run(['git', 'fetch', '--depth=1', 'origin', base], check=True)
          work = Path('/tmp/postwar-delivery')
          subprocess.run(['git', 'worktree', 'add', '--detach', str(work), base], check=True)
          os.chdir(work)
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == base
          def runlog(name, command):
              with (evidence / name).open('w') as output:
                  result = subprocess.run(command, stdout=output, stderr=subprocess.STDOUT, timeout=360)
              return result.returncode
          validator = [sys.executable, '-B', 'tools/validate_tc.py', '--limit', '300']
          suite = [sys.executable, '-B', '-m', 'unittest', 'discover', '-s', 'tools/tests', '-v']
          runlog('baseline-validation.log', validator)
          runlog('baseline-suite.log', suite)
          test_path = 'tools/tests/test_adiscord_postwar_nationalisation.py'
          subprocess.run(['git', 'apply', '--whitespace=error', '--include=' + test_path, str(patch_path)], check=True)
          red_rc = runlog('red.log', [sys.executable, '-B', '-m', 'unittest', 'tools.tests.test_adiscord_postwar_nationalisation'])
          red = (evidence / 'red.log').read_text()
          assert red_rc != 0 and 'FAILED (failures=12)' in red, red[-5000:]
          subprocess.run(['git', 'apply', '--check', '--whitespace=error', '--exclude=' + test_path, str(patch_path)], check=True)
          subprocess.run(['git', 'apply', '--whitespace=error', '--exclude=' + test_path, str(patch_path)], check=True)
          focused = [sys.executable, '-B', '-m', 'unittest',
                     'tools.tests.test_adiscord_postwar_nationalisation',
                     'tools.tests.test_adiscord_stp_party_survival',
                     'tools.tests.test_adiscord_val_stelander_defeat',
                     'tools.tests.test_adiscord_stp_gameplay_loop_regressions',
                     'tools.tests.test_adiscord_stp_postwar_economy',
                     'tools.tests.test_val_contract_ui']
          focused_rc = runlog('focused.log', focused)
          focused_text = (evidence / 'focused.log').read_text()
          print(focused_text)
          assert focused_rc == 0, 'Focused regressions failed'
          runlog('final-validation.log', validator)
          runlog('final-suite.log', suite)
          def validation_issues(label):
              text = (evidence / (label + '-validation.log')).read_text()
              assert text.startswith('A-Discord total-conversion validation'), text[:2000]
              assert '== Vanilla leftovers:' in text and 'Traceback' not in text, text[-5000:]
              return {re.sub(r':\d+(?=:|\n| |$)', ':LINE', line) for line in text.splitlines() if line.startswith('- ')}
          new_issues = sorted(validation_issues('final') - validation_issues('baseline'))
          (evidence / 'new-validation-issues.json').write_text(json.dumps(new_issues, indent=2))
          def suite_summary(label):
              text = (evidence / (label + '-suite.log')).read_text()
              count = re.search(r'Ran (\d+) tests? in ', text)
              assert count, 'Incomplete suite: ' + label
              failures = sorted(set(re.findall(r'^(?:FAIL|ERROR): (.+)$', text, re.M)))
              result = {'tests': int(count.group(1)), 'failing_test_ids': failures,
                        'summary': text[text.rfind('\nRan '):].strip()}
              (evidence / (label + '-suite-summary.json')).write_text(json.dumps(result, indent=2))
              return result
          baseline_suite, final_suite = suite_summary('baseline'), suite_summary('final')
          new_failures = sorted(set(final_suite['failing_test_ids']) - set(baseline_suite['failing_test_ids']))
          (evidence / 'new-test-failures.json').write_text(json.dumps(new_failures, indent=2))
          print(json.dumps({'new_validation_issues': new_issues, 'new_test_failures': new_failures,
                            'baseline_tests': baseline_suite['tests'], 'final_tests': final_suite['tests']}, indent=2))
          assert not new_issues, new_issues
          assert not new_failures, new_failures
          files = re.findall(r'^diff --git a/\S+ b/(\S+)$', patch.decode(), re.M)
          assert len(files) == len(set(files)) == 13, files
          assert all(not name.startswith('.github/') for name in files)
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'add', '--', *files], check=True)
          assert sorted(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()) == sorted(files)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          for name in files:
              data = Path(name).read_bytes()
              if name.startswith('localisation/'):
                  assert data.startswith(b'\xef\xbb\xbf'), name
              elif name.endswith('.txt'):
                  assert not data.startswith(b'\xef\xbb\xbf'), name
          hashes = {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in files}
          subprocess.run(['git', 'config', 'user.name', 'A-Discord development'], check=True)
          subprocess.run(['git', 'config', 'user.email', '81386071+worker2of2month@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'feat: add postwar nationalisation and expand Stelander and Council branches'], check=True)
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          branch = 'codex/postwar-nationalisation-ready-' + os.environ['GITHUB_RUN_ID']
          subprocess.run(['git', 'push', 'origin', head + ':refs/heads/' + branch], check=True)
          manifest = {'base': base, 'head': head, 'branch': branch, 'files': files,
                      'new_focuses': 18, 'focused_tests': int(re.search(r'Ran (\d+) tests?', focused_text).group(1)),
                      'red_test_failures': 12, 'new_validation_issues': new_issues,
                      'baseline_suite': baseline_suite, 'final_suite': final_suite,
                      'new_test_failures': new_failures, 'source_sha256': hashes, 'runtime_tested': False}
          (evidence / 'manifest.json').write_text(json.dumps(manifest, indent=2))
          print(json.dumps({k: v for k, v in manifest.items() if k not in ('baseline_suite', 'final_suite')}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postwar-nationalisation-verification
          path: /tmp/postwar-evidence
          retention-days: 3
