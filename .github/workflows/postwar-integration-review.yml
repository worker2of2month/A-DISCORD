name: Postwar nationalisation and branch review
on:
  push:
    branches: [codex/postwar-integration-review]
    paths:
      - .github/workflows/postwar-integration-review.yml
permissions:
  contents: write
  actions: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - uses: actions/download-artifact@v4
        with:
          name: postwar-nationalisation-final-verification
          run-id: 35686221912
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/verified-postwar
      - name: Integrate current main without replacing concurrent changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, re, subprocess, sys
          evidence = Path('/tmp/postwar-integrated'); evidence.mkdir(exist_ok=True)
          prior = json.loads(Path('/tmp/verified-postwar/manifest.json').read_text())
          old = '84104110e06281b14a042976e26a871101d719a5'
          feature = '726b311dd61088627367ac11133a468d9fd99a19'
          base = '0b3667dc6c2c3b93aa3adf215e6d5c4a14844b3c'
          assert prior['base'] == old and prior['head'] == feature
          assert prior['focused_tests'] == 129 and not prior['new_probe_failures']
          files = prior['files']
          assert len(files) == len(set(files)) == 13 and all(not x.startswith('.github/') for x in files)
          for ref in (old, feature, base):
              subprocess.run(['git', 'fetch', '--depth=1', 'origin', ref], check=True)
          work = Path('/tmp/postwar-integrated-delivery')
          subprocess.run(['git', 'worktree', 'add', '--detach', str(work), base], check=True)
          os.chdir(work)
          def runlog(name, command):
              with (evidence / name).open('w') as output:
                  result = subprocess.run(command, stdout=output, stderr=subprocess.STDOUT, timeout=240)
              return result.returncode
          validator = [sys.executable, '-B', 'tools/validate_tc.py', '--limit', '300']
          runlog('baseline-validation.log', validator)
          staff = [sys.executable, '-B', '-m', 'unittest', 'tools.tests.test_adiscord_playable_staff']
          baseline_staff = runlog('baseline-staff.log', staff)
          assert baseline_staff == 0, (evidence / 'baseline-staff.log').read_text()
          append_files = {'common/scripted_triggers/ADISCORD_STP_scripted_triggers.txt', 'common/scripted_triggers/ADISCORD_VAL_rework_triggers.txt'}
          resolutions = {}
          for index, name in enumerate(files):
              source = subprocess.run(['git', 'show', old + ':' + name], capture_output=True)
              original = source.stdout if source.returncode == 0 else None
              proposed = subprocess.check_output(['git', 'show', feature + ':' + name])
              assert hashlib.sha256(proposed).hexdigest() == prior['source_sha256'][name]
              path = Path(name)
              current = path.read_bytes() if path.exists() else None
              if current == original:
                  merged = proposed
                  resolutions[name] = 'unchanged in concurrent main'
              elif original is not None and name in append_files and current.startswith(original):
                  suffix = current[len(original):]
                  assert suffix.strip() and suffix not in proposed
                  merged = proposed + suffix
                  resolutions[name] = 'preserved complete independent staff-trigger append'
              else:
                  assert original is not None and current is not None, name
                  tmp = evidence / ('merge-' + str(index)); tmp.mkdir()
                  for label, data in [('current', current), ('base', original), ('feature', proposed)]:
                      (tmp / label).write_bytes(data)
                  result = subprocess.run(['git', 'merge-file', '-p', str(tmp / 'current'), str(tmp / 'base'), str(tmp / 'feature')], capture_output=True)
                  (tmp / 'result').write_bytes(result.stdout)
                  assert result.returncode == 0, 'Manual merge required: ' + name
                  merged = result.stdout
                  resolutions[name] = 'clean three-way merge'
              assert b'<<<<<<<' not in merged and b'>>>>>>>' not in merged
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(merged)
          (evidence / 'resolutions.json').write_text(json.dumps(resolutions, indent=2))
          focused = [sys.executable, '-B', '-m', 'unittest',
                     'tools.tests.test_adiscord_postwar_nationalisation',
                     'tools.tests.test_adiscord_stp_party_survival',
                     'tools.tests.test_adiscord_val_stelander_defeat',
                     'tools.tests.test_adiscord_stp_gameplay_loop_regressions',
                     'tools.tests.test_adiscord_stp_postwar_economy',
                     'tools.tests.test_val_contract_ui',
                     'tools.tests.test_adiscord_playable_staff']
          focused_rc = runlog('focused.log', focused)
          focused_text = (evidence / 'focused.log').read_text()
          print(focused_text, flush=True)
          assert focused_rc == 0
          runlog('final-validation.log', validator)
          def issues(label):
              text = (evidence / (label + '-validation.log')).read_text()
              assert text.startswith('A-Discord total-conversion validation') and '== Vanilla leftovers:' in text and 'Traceback' not in text
              return {re.sub(r':\d+(?=:|\n| |$)', ':LINE', line) for line in text.splitlines() if line.startswith('- ')}
          new_issues = sorted(issues('final') - issues('baseline'))
          (evidence / 'new-validation-issues.json').write_text(json.dumps(new_issues, indent=2))
          assert not new_issues, new_issues
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'add', '--', *files], check=True)
          assert sorted(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()) == sorted(files)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          for name in files:
              data = Path(name).read_bytes()
              if name.startswith('localisation/'): assert data.startswith(b'\xef\xbb\xbf'), name
              elif name.endswith('.txt'): assert not data.startswith(b'\xef\xbb\xbf'), name
          hashes = {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in files}
          (evidence / 'delivery.patch').write_bytes(subprocess.check_output(['git', 'diff', '--cached', '--full-index']))
          subprocess.run(['git', 'config', 'user.name', 'A-Discord development'], check=True)
          subprocess.run(['git', 'config', 'user.email', '81386071+worker2of2month@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'feat: add postwar nationalisation and expand Stelander and Council branches'], check=True)
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          branch = 'codex/postwar-nationalisation-integrated-' + os.environ['GITHUB_RUN_ID']
          subprocess.run(['git', 'push', 'origin', head + ':refs/heads/' + branch], check=True)
          manifest = {'base': base, 'head': head, 'branch': branch, 'files': files, 'new_focuses': 18,
                      'focused_tests': int(re.search(r'Ran (\d+) tests?', focused_text).group(1)),
                      'new_validation_issues': new_issues, 'resolutions': resolutions,
                      'prior_feature_verification_run': 35686221912, 'whole_suite_completed': False,
                      'source_sha256': hashes, 'runtime_tested': False}
          (evidence / 'manifest.json').write_text(json.dumps(manifest, indent=2))
          print(json.dumps(manifest, indent=2), flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postwar-nationalisation-integrated-verification
          path: /tmp/postwar-integrated
          retention-days: 3
