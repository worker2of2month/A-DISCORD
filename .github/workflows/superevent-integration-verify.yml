name: Superevent integration verification

on:
  push:
    branches:
      - integration/superevents-cleanup-20260917

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out integration tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Validate superevent ownership and event IDs
        run: |
          python tools/validators/validate_adiscord_superevents.py
          python -m tools.validators.validate_adiscord_event_ids
          python tools/validators/validate_adiscord_vorkerland_collapse.py --section superevents

      - name: Run focused regression suite
        run: |
          python -m unittest \
            tools.tests.test_validate_adiscord_superevents \
            tools.tests.test_adiscord_superevents_stp_empire \
            tools.tests.test_validate_adiscord_vorkerland_collapse \
            tools.tests.test_validate_adiscord_vorkerland_story \
            tools.tests.test_validate_adiscord_event_ids -v

      - name: Syntax and whitespace checks
        run: |
          python -m py_compile tools/validators/validate_tc.py
          git diff --check HEAD^

      - name: Remove temporary verifier
        run: |
          rm .github/workflows/superevent-integration-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove temporary superevent integration verifier"
          git push origin HEAD:integration/superevents-cleanup-20260917
