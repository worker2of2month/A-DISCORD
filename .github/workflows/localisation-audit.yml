name: Localisation audit
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/complete-english-localisation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Compile and validate English catalogues
        run: |
          python -B .github/apply_english.py > /tmp/translation-apply.log 2>&1
          python -B -m unittest discover -s tools/tests -p test_adiscord_english_localisation.py -v > /tmp/focused-suite.log 2>&1
          git diff --check -- localisation/english tools/tests/test_adiscord_english_localisation.py
      - name: Export reviewed text sources
        if: always()
        run: |
          python - <<'PY'
          import pathlib, subprocess, zipfile
          paths = subprocess.check_output(['git', 'ls-files', '--cached', '--others', '--exclude-standard', '-z']).decode().split('\0')
          suffixes = {'.py', '.json', '.md', '.yml', '.yaml', '.txt', '.gui', '.gfx', '.mod', '.lua', '.csv', '.asset', '.xml', '.ini', '.toml', '.tsv'}
          with zipfile.ZipFile('/tmp/adiscord-english-review.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in sorted(set(paths)):
                  p = pathlib.Path(name)
                  if p.is_file() and (p.suffix.lower() in suffixes or p.name in {'.gitignore', '.gitattributes'}):
                      archive.write(p, 'source/' + name)
              for p in pathlib.Path('/tmp').iterdir():
                  if p.is_file() and (p.suffix == '.log' or p.name == 'translation-report.json'):
                      archive.write(p, 'review/' + p.name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adiscord-english-review
          path: /tmp/adiscord-english-review.zip
          retention-days: 3
      - name: Repository validator
        run: python -B tools/validate_tc.py --limit 300 > /tmp/repository-validator.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adiscord-english-validator
          path: /tmp/repository-validator.log
          if-no-files-found: ignore
          retention-days: 3
