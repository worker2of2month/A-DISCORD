name: STP party gameplay work
on:
  push:
    branches: [codex/stp-party-gameplay-20260922]
    paths: ['.github/workflows/stp-party-work.yml', '.github/stp-party-apply.py']
permissions:
  contents: read
concurrency:
  group: stp-party-gameplay-work
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow numpy
      - name: Reproduce new contracts
        run: |
          python -B - <<'PY'
          import io, json, unittest
          suite=unittest.defaultTestLoader.loadTestsFromName('tools.tests.test_adiscord_stp_party_qol')
          out=io.StringIO()
          result=unittest.TextTestRunner(stream=out, verbosity=2).run(suite)
          print(out.getvalue())
          print('RED_SUMMARY',json.dumps({'tests':result.testsRun,'failures':len(result.failures),'errors':len(result.errors)}))
          assert not result.errors, 'Test harness error, not a missing feature'
          assert len(result.failures)>=10, 'Expected missing party changes'
          PY
      - name: Existing party regression baseline
        run: |
          python -B - <<'PY'
          import io,json,unittest
          names=['tools.tests.test_adiscord_stp_party_route','tools.tests.test_adiscord_stp_party_survival','tools.tests.test_adiscord_stp_party_balance','tools.tests.test_adiscord_stp_preparation']
          out=io.StringIO()
          result=unittest.TextTestRunner(stream=out,verbosity=1).run(unittest.defaultTestLoader.loadTestsFromNames(names))
          print('BASELINE',json.dumps({'tests':result.testsRun,'failures':[str(t) for t,_ in result.failures],'errors':[str(t) for t,_ in result.errors]}))
          PY
