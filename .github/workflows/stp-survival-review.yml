name: STP survival review
on:
  push:
    branches: [verify/stp-survival-20260919]
    paths: ['.github/workflows/stp-survival-review.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 430c0ef326a14f2ae092c9a9b16ec3ed83bb4881
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow numpy
      - name: Export pinned sources
        run: |
          mkdir -p /tmp/party-survival-review
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess,zipfile
          out=Path('/tmp/party-survival-review')
          names=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          hashes={}
          with zipfile.ZipFile(out/'source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in names:
                  p=Path(name)
                  if not name or not p.is_file() or name.startswith('.github/'):
                      continue
                  if p.suffix.lower() in {'.txt','.py','.json','.yml','.yaml','.md','.csv','.gfx','.gui','.mod','.lua','.xml','.map','.ini','.cfg','.toml'} or name in {'AGENTS.md','.gitignore','.gitattributes'}:
                      data=p.read_bytes()
                      try: data.decode('utf-8-sig')
                      except UnicodeDecodeError: continue
                      z.writestr(name,data)
                      hashes[name]=hashlib.sha256(data).hexdigest()
          (out/'source.json').write_text(json.dumps({'head':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),'hashes':hashes},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stp-survival-source
          path: /tmp/party-survival-review/source.*
          retention-days: 2
      - name: Baseline focused and full verification
        run: |
          python - <<'PY'
          import subprocess,json,time
          from pathlib import Path
          out=Path('/tmp/party-survival-review')
          jobs={
              'focused':['python','-B','-m','unittest','tools.tests.test_adiscord_stp_party_survival','tools.tests.test_adiscord_stp_party_route','tools.tests.test_adiscord_stp_preparation','tools.tests.test_adiscord_stp_civil_war','tools.tests.test_adiscord_stp_postwar_continuation','-v'],
              'suite':['python','-B','-m','unittest','discover','-s','tools/tests','-p','test_*.py','-v'],
              'validator':['python','-B','tools/validate_tc.py','--limit','300']}
          report={}
          for label,cmd in jobs.items():
              start=time.monotonic()
              with (out/(label+'.txt')).open('w') as log:
                  try:
                      result=subprocess.run(cmd,stdout=log,stderr=subprocess.STDOUT,timeout=1300)
                      code=result.returncode
                  except subprocess.TimeoutExpired:
                      code=124
              report[label]={'command':cmd,'exit':code,'seconds':time.monotonic()-start}
              print(label,report[label],flush=True)
          (out/'baseline.json').write_text(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stp-survival-baseline
          path: /tmp/party-survival-review/
          retention-days: 2
