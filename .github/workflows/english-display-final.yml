name: English display final review
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/english-display-final'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify display-only changes and prepare clean commits
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import json, os, re, subprocess, sys, textwrap
          root = Path.cwd()
          base = '2f110ab498612cd31dde6d557d32a57ec92d1266'
          tests = root / 'tools/tests/test_adiscord_english_localisation.py'
          before = tests.read_text()
          addition = r'''
          def test_starting_unit_display_names_use_the_shared_latin_script(self):
              import re
              from tools.validators.validate_adiscord_english_localisation import CYRILLIC
              root = Path(__file__).resolve().parents[2]
              untranslated = []
              for path in sorted((root / 'history/units').rglob('*.txt')):
                  for number, line in enumerate(path.read_text(encoding='utf-8-sig').splitlines(), 1):
                      if line.lstrip().startswith('#'):
                          continue
                      for name in re.findall(r'\bname\s*=\s*"([^"\n]*)"', line):
                          if CYRILLIC.search(name):
                              untranslated.append(f'{path.name}:{number}: {name}')
              self.assertEqual(untranslated, [])
          '''
          addition = textwrap.indent(textwrap.dedent(addition).strip() + '\n', '    ')
          marker = "\n\nif __name__ == '__main__':"
          assert marker in before and 'test_starting_unit_display_names_use_the_shared_latin_script' not in before
          tests.write_text(before.replace(marker, '\n' + addition + marker), encoding='utf-8')
          focused = [sys.executable, '-B', '-m', 'unittest', 'tools.tests.test_adiscord_english_localisation', '-v']
          with open('/tmp/english-display-red.log', 'w') as log:
              result = subprocess.run(focused, stdout=log, stderr=subprocess.STDOUT)
          assert result.returncode != 0
          red = Path('/tmp/english-display-red.log').read_text()
          assert 'FAIL: test_starting_unit_display_names_use_the_shared_latin_script' in red
          assert 'FAILED (failures=1)' in red
          changed_names = 0
          for tag, names in {
              'NOD': {'Кассингтонская флотилия': 'Cussington Flotilla', 'Охрана торговых путей': 'Trade Route Patrol'},
              'STP': {'Фадская флотилия': 'Fada Flotilla', 'Охрана побережья': 'Coastal Patrol'},
              'VAL': {'Кефрейтская флотилия': 'Kefreyt Flotilla', 'Охрана морских поставок': 'Maritime Supply Patrol'},
          }.items():
              path = root / f'history/units/{tag}.txt'
              before = path.read_bytes().decode('utf-8')
              text = before
              for source, target in names.items():
                  old, new = f'name = "{source}"', f'name = "{target}"'
                  assert text.count(old) == 1, (path, source)
                  text = text.replace(old, new)
                  changed_names += 1
              text, count = re.subn(r'\bname = "СК-(\d+)"', r'name = "SK-\1"', text)
              changed_names += count
              strip = lambda s: re.sub(r'\bname\s*=\s*"[^"\n]*"', 'name = "DISPLAY"', s)
              assert strip(before) == strip(text), 'Non-display OOB change'
              path.write_bytes(text.encode('utf-8'))
          assert changed_names == 20
          sys.path.insert(0, str(root))
          from tools.validators.validate_adiscord_english_localisation import TOKENS, read_entries
          source = root / 'localisation/english/ADISCORD_STP_l_english.yml'
          before = source.read_text(encoding='utf-8-sig')
          text = before
          replacements = {}
          for pattern, target in [(r'\bAbilia\b', 'Abiliya'), (r'\bHoskheit\b', 'Khoskheyt'), (r'\b(?:Monaia|Monaya)\b', 'Monaii'), (r'\bTikh\b', 'Tikhoreva')]:
              text, count = re.subn(pattern, target, text)
              replacements[target] = count
          assert Counter(TOKENS.findall(before)) == Counter(TOKENS.findall(text))
          source.write_text(text, encoding='utf-8-sig')
          with open('/tmp/english-display-green.log', 'w') as log:
              subprocess.run(focused, stdout=log, stderr=subprocess.STDOUT, check=True)
          files = ['history/units/NOD.txt', 'history/units/STP.txt', 'history/units/VAL.txt', 'localisation/english/ADISCORD_STP_l_english.yml', 'tools/tests/test_adiscord_english_localisation.py']
          actual = subprocess.check_output(['git', 'diff', '--name-only']).decode().splitlines()
          assert set(actual) == set(files), actual
          subprocess.run(['git', 'diff', '--check', '--', *files], check=True)
          russian, ru_issues = read_entries(root / 'localisation', 'russian')
          english, en_issues = read_entries(root / 'localisation', 'english')
          assert not ru_issues and not en_issues
          subprocess.run(['git', 'fetch', '--depth=1', 'origin', base], check=True)
          subprocess.run(['git', 'config', 'user.name', 'A-Discord localisation'], check=True)
          subprocess.run(['git', 'config', 'user.email', '81386071+worker2of2month@users.noreply.github.com'], check=True)
          env = dict(os.environ, GIT_INDEX_FILE='/tmp/english-display-index')
          subprocess.run(['git', 'read-tree', base], env=env, check=True)
          parent, commits = base, []
          for path in files:
              blob = subprocess.check_output(['git', 'hash-object', '-w', path]).decode().strip()
              subprocess.run(['git', 'update-index', '--add', '--cacheinfo', '100644', blob, path], env=env, check=True)
              assert subprocess.check_output(['git', 'diff', '--cached', '--name-only', parent], env=env).decode().splitlines() == [path]
              tree = subprocess.check_output(['git', 'write-tree'], env=env).decode().strip()
              message = 'l10n(en): translate starting fleet display names in ' + Path(path).name
              if path.startswith('localisation/'):
                  message = 'l10n(en): align Stelander place and character names with the English map'
              elif path.startswith('tools/'):
                  message = 'test(l10n): check starting unit display names for untranslated Cyrillic'
              commit = subprocess.check_output(['git', 'commit-tree', tree, '-p', parent], input=(message + '\n').encode()).decode().strip()
              commits.append({'path': path, 'blob': blob, 'commit': commit, 'parent': parent})
              parent = commit
          branch = 'codex/english-display-delivery-' + os.environ['GITHUB_RUN_ID']
          subprocess.run(['git', 'push', 'origin', parent + ':refs/heads/' + branch], check=True)
          manifest = {'base': base, 'head': parent, 'branch': branch, 'commits': commits, 'translated_display_names': changed_names, 'canonical_names': replacements, 'english_entries': len(english)}
          Path('/tmp/english-display-manifest.json').write_text(json.dumps(manifest, indent=2))
          print(json.dumps(manifest, indent=2))
          PY
      - name: Export evidence and final files
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('/tmp/english-display-review.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for p in Path('/tmp').glob('english-display-*'):
                  if p.is_file() and p.suffix in {'.log', '.json'}:
                      z.write(p, 'review/' + p.name)
              for name in ['history/units/NOD.txt', 'history/units/STP.txt', 'history/units/VAL.txt', 'localisation/english/ADISCORD_STP_l_english.yml', 'tools/tests/test_adiscord_english_localisation.py']:
                  z.write(name, 'source/' + name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: english-display-review
          path: /tmp/english-display-review.zip
          retention-days: 3
