name: Shabrat package checks
on:
  push:
    branches: [codex/shabrat-uprisings-nod-ultimatum]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            common
            events
            history
            localisation
            tools
            docs/development
            interface
            map
          lfs: false
      - name: Export tracked source for regression checks
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, zipfile
          root = pathlib.Path('.')
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          extensions = {'.txt', '.py', '.yml', '.yaml', '.json', '.csv', '.md', '.mod', '.gfx', '.gui', '.lua', '.asset', '.info', '.toml', '.ini', '.cfg'}
          folders = {'common', 'events', 'history', 'localisation', 'tools', 'docs', 'interface', 'map'}
          total = 0
          with zipfile.ZipFile('/tmp/adiscord-source.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in paths:
                  path = root / name
                  if not name or not path.is_file() or path.suffix not in extensions:
                      continue
                  if len(path.parts) > 1 and path.parts[0] not in folders:
                      continue
                  archive.write(path, name)
                  total += path.stat().st_size
          print('Text bytes:', total)
          print(subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: adiscord-source
          path: /tmp/adiscord-source.zip
          retention-days: 1
