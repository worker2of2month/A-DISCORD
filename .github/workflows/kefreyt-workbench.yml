name: Balchansk and Commonwealth integration
on:
  push:
    branches: [codex/kefreyt-settlements-administrations]
    paths: [.github/workflows/kefreyt-workbench.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow numpy pytest
      - name: Integrate only Balchansk and Commonwealth features
        run: |
          mkdir -p /tmp/balchansk-reports
          python -B .github/balchansk-integrate.py 2>&1 | tee /tmp/balchansk-reports/integration.txt
          test -d /tmp/balchansk-integration
      - name: Verify the integrated country package
        working-directory: /tmp/balchansk-integration
        run: |
          set -o pipefail
          git diff --check
          python -B -m unittest tools.tests.test_validate_adiscord_val_rework.ValBalchanskCommonwealthRegressionTests tools.tests.test_validate_adiscord_val_rework.ValFormationAndCommandTests tools.tests.test_validate_adiscord_val_rework.ValExpandedCampaignTests tools.tests.test_adiscord_nod_capitulation_reservation tools.tests.test_scripted_peace_on_actions -v 2>&1 | tee /tmp/balchansk-reports/focused-tests.txt
          python -B tools/validate_tc.py --limit 300 > /tmp/balchansk-reports/total-conversion.txt 2>&1
          python - <<'PY'
          import subprocess
          from pathlib import Path
          result = subprocess.run(['python', '-B', 'tools/validate_adiscord_val_rework.py'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          Path('/tmp/balchansk-reports/val-validator.txt').write_text(result.stdout)
          issues = {l for l in result.stdout.splitlines() if l.startswith('- ')}
          known = {'- VAL_Veterans_Of_The_Campaign gives only supplemental points or unconsumed markers'}
          assert issues <= known, result.stdout
          assert result.returncode == 0 or issues == known, result.stdout
          print(result.stdout)
          PY
      - name: Verify scope, encoding and publish a clean feature branch
        working-directory: /tmp/balchansk-integration
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re, subprocess, zipfile
          report = Path('/tmp/balchansk-reports')
          paths = subprocess.check_output(['git', 'diff', '--name-only', '-z']).decode().strip('\0').split('\0')
          assert len(paths) == 11, paths
          assert not any('scripted_peace_on_actions' in p or p.startswith('gfx/') or 'ADISCORD_STP_' in p for p in paths), paths
          for path in paths:
              data = Path(path).read_bytes()
              if path.endswith('.yml'):
                  assert data.startswith(b'\xef\xbb\xbf'), path
                  text = data.decode('utf-8-sig')
                  for line in text.splitlines():
                      if re.match(r'\s*[A-Za-z0-9_.]+:\d* ', line):
                          assert len(re.findall(r'(?<!\\)"', line)) == 2, (path, line)
              elif path.endswith('.txt'):
                  assert not data.startswith(b'\xef\xbb\xbf'), path
          (report / 'scope-and-hashes.json').write_text(json.dumps({p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}, indent=2))
          (report / 'changes.patch').write_bytes(subprocess.check_output(['git', 'diff', '--binary']))
          with zipfile.ZipFile(report / 'sources.zip', 'w', zipfile.ZIP_DEFLATED) as out:
              for p in paths:
                  out.write(p, p)
              for p in ('common/on_actions/09_ADISCORD_scripted_peace_on_actions.txt', 'common/scripted_effects/ADISCORD_STP_scripted_effects.txt', 'tools/tests/test_adiscord_nod_capitulation_reservation.py', 'gfx/flags/NKA.tga', 'gfx/flags/medium/NKA.tga', 'gfx/flags/small/NKA.tga'):
                  out.write(p, p)
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', '--', *paths], check=True)
          subprocess.run(['git', 'commit', '-m', 'feat: develop Balchansk administration and attainable Kefreyt Commonwealth'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:codex/balchansk-commonwealth'], check=True)
          (report / 'published-commit.txt').write_bytes(subprocess.check_output(['git', 'rev-parse', 'HEAD']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: balchansk-verification
          path: /tmp/balchansk-reports
          retention-days: 3
