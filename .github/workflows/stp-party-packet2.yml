name: STP party second package
on:
  push:
    branches: [codex/stp-party-packet2-work-20260922]
    paths: ['.github/workflows/stp-party-packet2.yml', '.github/packet2-final-review.py']
permissions:
  contents: write
concurrency:
  group: stp-party-packet2
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - name: Prepare tested gameplay revision
        run: |
          cp .github/packet2-final-review.py /tmp/packet2-final-review.py
          git fetch --depth=1 origin e07d79c38584798f5fe010fdf58353e7da0856aa
          git checkout --detach e07d79c38584798f5fe010fdf58353e7da0856aa
          python -m pip install --disable-pip-version-check Pillow numpy > /tmp/packet2-review-dependencies.txt
      - name: Reproduce and verify final review findings
        run: |
          python -B /tmp/packet2-final-review.py
          python -B tools/validate_tc.py --limit 300 > /tmp/packet2-review-validator.txt 2>&1
          echo TOTAL_CONVERSION_VALIDATOR_EXIT_0
          git diff --check
          git diff --stat
          python -B - <<'PY'
          import subprocess
          from pathlib import Path
          names=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          expected={'common/scripted_effects/ADISCORD_STP_scripted_effects.txt','tools/tests/test_adiscord_stp_party_route.py','localisation/russian/ADISCORD_STP_l_russian.yml','localisation/english/ADISCORD_STP_l_english.yml','docs/development/focus-effects.md'}
          assert set(names)==expected, names
          for lang in ('russian','english'):
              assert Path(f'localisation/{lang}/ADISCORD_STP_l_{lang}.yml').read_bytes().startswith(b'\xef\xbb\xbf')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add common/scripted_effects/ADISCORD_STP_scripted_effects.txt tools/tests/test_adiscord_stp_party_route.py localisation/russian/ADISCORD_STP_l_russian.yml localisation/english/ADISCORD_STP_l_english.yml docs/development/focus-effects.md
          git commit -m 'fix(stp): preserve capped shares under rounding and match negotiation tooltips'
          git push origin HEAD:refs/heads/codex/stp-party-packet2-final-20260922
          echo FINAL_REVIEW_COMMIT=$(git rev-parse HEAD)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stp-party-final-review-evidence
          path: /tmp/packet2-review-*.txt
          retention-days: 7
