name: Kefreyt focus formation verification
on:
  push:
    branches: [balance/val-focus-formations-20260922]
    paths: [.github/workflows/val-focus-balance-check.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: balance/val-focus-formations-20260922
      - run: python -m pip install Pillow
      - name: Apply tested reward changes and compare baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p /tmp/val-balance-evidence
          python - <<'PY'
          import base64, collections, gzip, hashlib, json, pathlib, re, subprocess, time
          out = pathlib.Path('/tmp/val-balance-evidence')
          summary = {'base': subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip(), 'commands': {}}
          def save():
              (out / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2))
          def run(label, command, timeout=90):
              started = time.monotonic()
              with (out / (label + '.txt')).open('w') as log:
                  try:
                      code = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT, timeout=timeout).returncode
                  except subprocess.TimeoutExpired:
                      code = 124
                      log.write('\nTIMEOUT=' + str(timeout) + '\n')
              text = (out / (label + '.txt')).read_text()
              summary['commands'][label] = {
                  'command': command, 'exit': code, 'seconds': round(time.monotonic()-started, 2),
                  'failures': re.findall(r'^(?:FAIL|ERROR): .+$', text, re.M),
                  'test_summary': re.findall(r'^Ran .+|^OK.*|^FAILED.*', text, re.M),
                  'tail': text[-1200:],
              }
              save()
              print(label, json.dumps(summary['commands'][label], ensure_ascii=False), flush=True)
              return code
          def compare(label):
              before, after = [summary['commands'][prefix + label] for prefix in ('baseline-', 'after-')]
              assert before['exit'] != 124 and after['exit'] != 124, label + ': comparison timed out'
              assert before['exit'] == after['exit'], label + ': changed exit status'
              assert collections.Counter(before['failures']) == collections.Counter(after['failures']), label + ': changed failures'
          blob = json.loads(subprocess.check_output(['gh', 'api', 'repos/worker2of2month/A-DISCORD/git/blobs/2f92bec853410b68e32fa99be839f34909c9ba74']))
          raw = base64.b64decode(blob['content'])
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest() == '2f92bec853410b68e32fa99be839f34909c9ba74'
          payload = json.loads(gzip.decompress(raw))
          for key in ('tests', 'production'):
              (out / (key + '.patch')).write_text(payload[key])
          unit = ['python', '-B', '-m', 'unittest']
          module = 'tools.tests.test_validate_adiscord_val_rework.'
          focused = unit + [module + name for name in ('ValTierTransitionContractTests', 'ValNativePreviewTests', 'ValIndustrialRecoveryTests', 'ValNumericPreviewChainTests', 'ValFormationAndCommandTests')] + ['tools.tests.test_val_contract_ui', '-v']
          validators = {
              'division-audit': ['python', '-B', '-m', 'tools.validators.validate_adiscord_division_templates', '--limit', '300'],
              'tc': ['python', '-B', 'tools/validate_tc.py', '--limit', '300'],
          }
          run('baseline-focused', focused)
          for label, command in validators.items():
              run('baseline-' + label, command, 120)
          subprocess.run(['git', 'apply', '--check', str(out / 'tests.patch')], check=True)
          subprocess.run(['git', 'apply', str(out / 'tests.patch')], check=True)
          target = unit + [module + 'ValFocusRewardBalanceTests', '-v']
          assert run('red', target) == 1
          assert not any(line.startswith('ERROR:') for line in summary['commands']['red']['failures'])
          assert len(summary['commands']['red']['failures']) >= 10
          subprocess.run(['git', 'apply', '--check', str(out / 'production.patch')], check=True)
          subprocess.run(['git', 'apply', str(out / 'production.patch')], check=True)
          assert run('green', target) == 0
          run('after-focused', focused)
          compare('focused')
          for label, command in validators.items():
              run('after-' + label, command, 120)
              compare(label)
              def normalize(text):
                  return re.sub(r':\d+(?=:|\b)', ':LINE', text)
              assert normalize((out / ('baseline-' + label + '.txt')).read_text()) == normalize((out / ('after-' + label + '.txt')).read_text()), label + ': new diagnostics'
          run('full-suite', unit + ['discover', '-s', 'tools/tests', '-p', 'test*.py', '-v'], 120)
          changed = subprocess.check_output(['git', 'diff', '--name-only']).decode().splitlines()
          assert set(changed) == set(payload['paths'])
          for name in changed:
              data = pathlib.Path(name).read_bytes()
              if name.startswith('localisation/'):
                  assert data.startswith(b'\xef\xbb\xbf'), name
              elif name.startswith('common/'):
                  assert not data.startswith(b'\xef\xbb\xbf'), name
          subprocess.run(['git', 'diff', '--check'], check=True)
          (out / 'complete.patch').write_bytes(subprocess.check_output(['git', 'diff', '--'] + changed))
          summary['blobs'] = {name: subprocess.check_output(['git', 'hash-object', name]).decode().strip() for name in changed}
          summary['runtime'] = 'Not run in Hearts of Iron IV. Authored source, accounting and branch-contract checks only.'
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', '--'] + changed, check=True)
          subprocess.run(['git', 'commit', '-m', 'balance(val): turn weak focuses into staffed formations and material reserves'], check=True)
          summary['commit'] = subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip()
          save()
          subprocess.run(['git', 'push', 'origin', 'HEAD:balance/val-focus-formations-20260922'], check=True)
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: val-focus-balance-verification
          path: /tmp/val-balance-evidence
          retention-days: 7
