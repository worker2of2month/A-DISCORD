name: Superevent cleanup migration

on:
  push:
    branches:
      - refactor/superevents-cleanup

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Migrate stale owner references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old = b"events/ADISCORD_news.txt"
          new = b"events/ADISCORD_superevents.txt"
          changed = []

          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if path.parts and path.parts[0] == "docs":
                  continue
              if path == Path("tools/validators/validate_adiscord_superevents.py"):
                  continue
              if path.suffix.lower() not in {".py", ".json", ".txt", ".yml", ".md"}:
                  continue
              data = path.read_bytes()
              if old not in data:
                  continue
              path.write_bytes(data.replace(old, new))
              changed.append(path.as_posix())

          registry = Path("tools/data/adiscord_event_ids.json")
          registry_source = registry.read_text(encoding="utf-8")
          missing_entries = []
          for number in (100, 101):
              event_id = f"ADISCORD_vorkerland_collapse.{number}"
              if f'"id": "{event_id}"' not in registry_source:
                  missing_entries.append(
                      "    {"
                      f'\"id\": \"{event_id}\", '
                      '\"namespace\": \"ADISCORD_vorkerland_collapse\", '
                      f'\"number\": {number}, '
                      '\"owner\": \"events/ADISCORD_vorkerland_events.txt\", '
                      '\"subsystem\": \"vorkerland_collapse\", '
                      '\"status\": \"active\"}'
                  )
          if missing_entries:
              anchor = "\n  ]\n}"
              if anchor not in registry_source:
                  raise SystemExit("event registry closing anchor not found")
              prefix, suffix = registry_source.rsplit(anchor, 1)
              if not prefix.rstrip().endswith(","):
                  prefix = prefix.rstrip() + ","
              registry_source = prefix + "\n" + ",\n".join(missing_entries) + anchor + suffix
              registry.write_text(registry_source, encoding="utf-8")

          event_id_test = Path("tools/tests/test_validate_adiscord_event_ids.py")
          test_source = event_id_test.read_text(encoding="utf-8")
          if "import re\n" not in test_source:
              test_source = test_source.replace("import json\n", "import json\nimport re\n", 1)
          old_expectation = '                expected_status = "active" if (ROOT / owner).is_file() else "reserved"\n'
          new_expectation = (
              '                owner_path = ROOT / owner\n'
              '                owner_source = (\n'
              '                    owner_path.read_text(encoding="utf-8-sig")\n'
              '                    if owner_path.is_file()\n'
              '                    else ""\n'
              '                )\n'
              '                expected_status = (\n'
              '                    "active"\n'
              '                    if re.search(\n'
              '                        rf"\\bid\\s*=\\s*{re.escape(event_id)}\\b",\n'
              '                        owner_source,\n'
              '                    )\n'
              '                    else "reserved"\n'
              '                )\n'
          )
          if old_expectation in test_source:
              test_source = test_source.replace(old_expectation, new_expectation, 1)
          elif "owner_source = (" not in test_source:
              raise SystemExit("event-ID planned recovery test anchor not found")
          event_id_test.write_text(test_source, encoding="utf-8")

          tc = Path("tools/validators/validate_tc.py")
          source = tc.read_text(encoding="utf-8")
          import_anchor = (
              "from tools.validators.validate_adiscord_event_ids import "
              "validate as validate_adiscord_event_ids\n"
          )
          import_line = (
              "from tools.validators.validate_adiscord_superevents import "
              "collect_issues as validate_adiscord_superevents\n"
          )
          if import_line not in source:
              if import_anchor not in source:
                  raise SystemExit("validate_tc.py import anchor not found")
              source = source.replace(import_anchor, import_anchor + import_line, 1)

          section_anchor = (
              '    event_id_issues = validate_adiscord_event_ids()\n'
              '    print_section(\n'
              '        "Event ID registry",\n'
              '        event_id_issues[: args.limit],\n'
              '        len(event_id_issues),\n'
              '    )\n'
          )
          section = section_anchor + (
              '\n'
              '    superevent_issues = validate_adiscord_superevents()\n'
              '    print_section(\n'
              '        "Superevent presentation contract",\n'
              '        superevent_issues[: args.limit],\n'
              '        len(superevent_issues),\n'
              '    )\n'
          )
          if "superevent_issues = validate_adiscord_superevents()" not in source:
              if section_anchor not in source:
                  raise SystemExit("validate_tc.py event registry section anchor not found")
              source = source.replace(section_anchor, section, 1)
          tc.write_text(source, encoding="utf-8")

          workflow = Path(".github/workflows/superevent-cleanup-migration.yml")
          workflow.unlink()

          print("Replaced legacy path in:")
          for item in changed:
              print(f"- {item}")
          print("Registered live Vorkerland mandate events .100/.101 where missing")
          print("Repaired planned-recovery registry test to inspect the concrete event definition")
          PY

      - name: Verify no live legacy path references remain
        shell: bash
        run: |
          if git grep -n "events/ADISCORD_news.txt" -- \
              ':!docs/superpowers/**' \
              ':!tools/validators/validate_adiscord_superevents.py'; then
            echo "Legacy live-code path references remain" >&2
            exit 1
          fi

      - name: Run superevent and event-ID validators
        shell: bash
        run: |
          python tools/validators/validate_adiscord_superevents.py
          python -m tools.validators.validate_adiscord_event_ids

      - name: Install focused test dependency
        shell: bash
        run: python -m pip install --disable-pip-version-check pillow

      - name: Run focused regression tests
        shell: bash
        run: |
          python -m unittest \
            tools.tests.test_validate_adiscord_superevents \
            tools.tests.test_adiscord_superevents_stp_empire \
            tools.tests.test_validate_adiscord_vorkerland_collapse \
            tools.tests.test_validate_adiscord_vorkerland_story \
            tools.tests.test_validate_adiscord_event_ids -v

      - name: Syntax-check total conversion validator
        shell: bash
        run: |
          python -m py_compile tools/validators/validate_tc.py

      - name: Commit verified migration
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: migrate superevent owner references"
          git push origin HEAD:refactor/superevents-cleanup
