name: STP onboarding QoL baseline

on:
  push:
    branches:
      - codex/stp-onboarding-qol-baseline

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run focused Stelander regression suite
        run: |
          python -B -m unittest \
            tools.tests.test_adiscord_stp_preparation \
            tools.tests.test_adiscord_stp_civil_war \
            tools.tests.test_adiscord_stp_party_route -v
