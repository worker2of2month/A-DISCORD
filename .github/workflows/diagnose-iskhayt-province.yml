name: Diagnose Iskhayt micro-adjacencies

on:
  push:
    branches:
      - fix/iskhayt-province-debug

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Audit local one-pixel borders
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import csv,re
          from collections import Counter,defaultdict
          from pathlib import Path
          from PIL import Image

          rgb_to_id={}
          definition={}
          with open("map/definition.csv",encoding="utf-8-sig",newline="") as fh:
              for row in csv.reader(fh,delimiter=";"):
                  if len(row)>=8 and row[0].isdigit():
                      pid=int(row[0]); rgb=tuple(map(int,row[1:4]))
                      rgb_to_id[rgb]=pid; definition[pid]=row

          states={}
          state_by={}
          for path in Path("history/states").glob("*.txt"):
              text=path.read_text(encoding="utf-8-sig",errors="replace")
              mi=re.search(r"\bid\s*=\s*(\d+)",text)
              mp=re.search(r"\bprovinces\s*=\s*\{([^}]*)\}",text,re.S)
              if not (mi and mp): continue
              sid=int(mi.group(1)); ps=set(map(int,re.findall(r"\d+",mp.group(1))))
              states[sid]=ps
              for p in ps: state_by[p]=sid

          focus_states=set(range(13,23))
          focus_provs=set().union(*(states.get(s,set()) for s in focus_states))

          im=Image.open("map/provinces.bmp").convert("RGB")
          w,h=im.size; px=im.load()
          grid=[-1]*(w*h)
          for y in range(h):
              for x in range(w):
                  grid[y*w+x]=rgb_to_id.get(px[x,y],-1)

          borders=Counter()
          contacts=defaultdict(list)
          for y in range(h):
              for x in range(w):
                  a=grid[y*w+x]
                  if x+1<w:
                      b=grid[y*w+x+1]
                      if a!=b and (a in focus_provs or b in focus_provs):
                          k=tuple(sorted((a,b))); borders[k]+=1; contacts[k].append((x,y,x+1,y))
                  if y+1<h:
                      b=grid[(y+1)*w+x]
                      if a!=b and (a in focus_provs or b in focus_provs):
                          k=tuple(sorted((a,b))); borders[k]+=1; contacts[k].append((x,y,x,y+1))

          print("SHORT CROSS-STATE LAND BORDERS <= 4 EDGES")
          short=[]
          for (a,b),n in sorted(borders.items(),key=lambda kv:(kv[1],kv[0])):
              sa,sb=state_by.get(a),state_by.get(b)
              if sa==sb or sa not in focus_states or sb not in focus_states: continue
              if definition.get(a,[None]*8)[4]!="land" or definition.get(b,[None]*8)[4]!="land": continue
              if n<=4:
                  short.append((a,b,n,sa,sb))
                  print(a,b,"edges",n,"states",sa,sb,"contacts",contacts[(a,b)])

          def local_ascii(pair):
              a,b=pair
              cs=contacts[pair]
              xs=[]; ys=[]
              for x1,y1,x2,y2 in cs:
                  xs += [x1,x2]; ys += [y1,y2]
              cx=sum(xs)//len(xs); cy=sum(ys)//len(ys)
              x0,x1=cx-5,cx+5; y0,y1=cy-5,cy+5
              nearby=sorted(set(grid[y*w+x] for y in range(max(0,y0),min(h,y1+1)) for x in range(max(0,x0),min(w,x1+1))))
              alphabet="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789"
              mapping={}
              for i,p in enumerate(nearby):
                  mapping[p]=alphabet[i] if i<len(alphabet) else "?"
              print("PAIR",a,b,"mapping",[(mapping[p],p,state_by.get(p)) for p in nearby])
              for y in range(y0,y1+1):
                  row=""
                  for x in range(x0,x1+1):
                      row+=mapping.get(grid[y*w+x],"?")
                  print(f"{y:04d}",row)

          for pair in [(6,127),(51,108),(6,85),(81,16646)]:
              k=tuple(sorted(pair))
              if k in borders:
                  print("DETAIL",pair,"edges",borders[k],"contacts",contacts[k])
                  local_ascii(k)

          # Detect if a short border comes from a removable one-pixel spur on either side.
          print("REMOVABLE SPUR TEST")
          coords=defaultdict(set)
          relevant=set()
          for a,b,n,sa,sb in short: relevant.update((a,b))
          for y in range(h):
              for x in range(w):
                  p=grid[y*w+x]
                  if p in relevant: coords[p].add((x,y))

          def connected(points):
              if not points: return False
              start=next(iter(points)); seen={start}; q=[start]
              while q:
                  x,y=q.pop()
                  for dx,dy in ((1,0),(-1,0),(0,1),(0,-1)):
                      z=(x+dx,y+dy)
                      if z in points and z not in seen:
                          seen.add(z); q.append(z)
              return len(seen)==len(points)

          for a,b,n,sa,sb in short:
              k=(a,b) if a<b else (b,a)
              contact_pixels=set()
              for x1,y1,x2,y2 in contacts[k]:
                  contact_pixels.update(((x1,y1),(x2,y2)))
              for p in (a,b):
                  candidates=[pt for pt in contact_pixels if pt in coords[p]]
                  removable=[]
                  for pt in candidates:
                      rest=coords[p]-{pt}
                      if connected(rest):
                          # if removing this pixel destroys the a-b adjacency
                          x,y=pt
                          touching=False
                          other=b if p==a else a
                          for dx,dy in ((1,0),(-1,0),(0,1),(0,-1)):
                              q=(x+dx,y+dy)
                              if q in coords[other]: touching=True
                          if touching: removable.append(pt)
                  if removable:
                      print("pair",a,b,"province",p,"removable_contact_pixels",removable)
          PY
