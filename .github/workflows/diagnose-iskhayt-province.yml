name: Fix Iskhayt micro-adjacency

on:
  push:
    branches:
      - fix/iskhayt-province-debug

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Remove two-pixel bypass around Iskhayt
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import csv, struct
          from collections import defaultdict, deque
          from pathlib import Path
          from PIL import Image

          MAP = Path("map/provinces.bmp")
          SOURCE = 6
          TARGET = 16372
          PATCH = [(3839, 990), (3839, 991)]

          rgb_by_id = {}
          id_by_rgb = {}
          with open("map/definition.csv", encoding="utf-8-sig", newline="") as fh:
              for row in csv.reader(fh, delimiter=";"):
                  if len(row) >= 4 and row[0].isdigit():
                      pid = int(row[0])
                      rgb = tuple(map(int, row[1:4]))
                      rgb_by_id[pid] = rgb
                      id_by_rgb[rgb] = pid

          with Image.open(MAP) as source:
              image = source.convert("RGB")
          w, h = image.size
          px = image.load()

          before = [id_by_rgb.get(px[x, y]) for x, y in PATCH]
          if before not in ([SOURCE, SOURCE], [TARGET, TARGET]):
              raise SystemExit(f"unexpected Iskhayt seam pixels: {list(zip(PATCH, before))}")

          if before == [SOURCE, SOURCE]:
              raw = bytearray(MAP.read_bytes())
              pixel_offset = struct.unpack_from("<I", raw, 10)[0]
              width = struct.unpack_from("<i", raw, 18)[0]
              height_raw = struct.unpack_from("<i", raw, 22)[0]
              bpp = struct.unpack_from("<H", raw, 28)[0]
              compression = struct.unpack_from("<I", raw, 30)[0]
              if width != w or abs(height_raw) != h or bpp != 24 or compression != 0:
                  raise SystemExit(
                      f"unexpected BMP format width={width} height={height_raw} bpp={bpp} compression={compression}"
                  )
              stride = ((w * 3 + 3) // 4) * 4
              tr, tg, tb = rgb_by_id[TARGET]
              for x, y in PATCH:
                  file_y = h - 1 - y if height_raw > 0 else y
                  offset = pixel_offset + file_y * stride + x * 3
                  raw[offset:offset + 3] = bytes((tb, tg, tr))
              MAP.write_bytes(raw)

          with Image.open(MAP) as source:
              image = source.convert("RGB")
          px = image.load()

          relevant = {6, 85, 16372}
          coords = defaultdict(set)
          grid = [-1] * (w * h)
          for y in range(h):
              for x in range(w):
                  pid = id_by_rgb.get(px[x, y], -1)
                  grid[y * w + x] = pid
                  if pid in relevant:
                      coords[pid].add((x, y))

          def connected(points):
              if not points:
                  return False
              start = next(iter(points))
              seen = {start}
              q = deque([start])
              while q:
                  x, y = q.popleft()
                  for dx, dy in ((1,0),(-1,0),(0,1),(0,-1)):
                      p = (x + dx, y + dy)
                      if p in points and p not in seen:
                          seen.add(p)
                          q.append(p)
              return len(seen) == len(points)

          for pid in relevant:
              if not connected(coords[pid]):
                  raise SystemExit(f"province {pid} became disconnected")

          def border_edges(a, b):
              n = 0
              for x, y in coords[a]:
                  for dx, dy in ((1,0),(-1,0),(0,1),(0,-1)):
                      nx, ny = x + dx, y + dy
                      if 0 <= nx < w and 0 <= ny < h and grid[ny * w + nx] == b:
                          n += 1
              return n

          if border_edges(6, 85) != 0:
              raise SystemExit(f"province 6 still touches 85 through {border_edges(6,85)} edges")
          if border_edges(16372, 6) == 0 or border_edges(16372, 85) == 0:
              raise SystemExit("Iskhayt no longer separates and connects both sides")

          after = [id_by_rgb.get(px[x, y]) for x, y in PATCH]
          print("Patched:", list(zip(PATCH, before, after)))
          print("Areas:", {pid: len(coords[pid]) for pid in sorted(relevant)})
          print("Borders:", {
              "16372-6": border_edges(16372, 6),
              "16372-85": border_edges(16372, 85),
              "6-85": border_edges(6, 85),
          })
          PY
      - name: Commit candidate map fix
        shell: bash
        run: |
          if git diff --quiet -- map/provinces.bmp; then
            echo "Candidate already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add map/provinces.bmp
          git commit -m "fix(map): remove Iskhayt two-pixel bypass adjacency"
          git push
