name: Diagnose Iskhayt capital province

on:
  push:
    branches:
      - fix/iskhayt-province-debug

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Diagnose province 16372
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import csv, math, re
          from collections import Counter, defaultdict, deque
          from pathlib import Path
          from PIL import Image

          TARGET=16372
          COMPARE={6,48,85,16372,16646}
          rgb_to_id={}
          id_to_rgb={}
          definition={}
          with open("map/definition.csv",encoding="utf-8-sig",newline="") as fh:
              for row in csv.reader(fh,delimiter=";"):
                  if len(row)>=8 and row[0].isdigit():
                      pid=int(row[0]); rgb=tuple(map(int,row[1:4]))
                      rgb_to_id[rgb]=pid; id_to_rgb[pid]=rgb; definition[pid]=row

          state_by={}
          for path in Path("history/states").glob("*.txt"):
              text=path.read_text(encoding="utf-8-sig",errors="replace")
              mi=re.search(r"\bid\s*=\s*(\d+)",text)
              mp=re.search(r"\bprovinces\s*=\s*\{([^}]*)\}",text,re.S)
              if not (mi and mp): continue
              sid=int(mi.group(1))
              for tok in re.findall(r"\d+",mp.group(1)):
                  state_by.setdefault(int(tok),[]).append(sid)

          prov=Image.open("map/provinces.bmp").convert("RGB")
          w,h=prov.size
          ppx=prov.load()
          coords=defaultdict(list)
          grid=[-1]*(w*h)
          for y in range(h):
              for x in range(w):
                  pid=rgb_to_id.get(ppx[x,y],-1)
                  grid[y*w+x]=pid
                  if pid in COMPARE: coords[pid].append((x,y))

          def adjacency_counts(pid):
              c=Counter()
              for x,y in coords[pid]:
                  for dx,dy in ((1,0),(-1,0),(0,1),(0,-1)):
                      nx,ny=x+dx,y+dy
                      if 0<=nx<w and 0<=ny<h:
                          q=grid[ny*w+nx]
                          if q!=pid: c[q]+=1
              return c

          def components(pid):
              rem=set(coords[pid]); out=[]
              while rem:
                  s=rem.pop(); q=[s]; n=1
                  while q:
                      x,y=q.pop()
                      for dx,dy in ((1,0),(-1,0),(0,1),(0,-1)):
                          p=(x+dx,y+dy)
                          if p in rem: rem.remove(p); q.append(p); n+=1
                  out.append(n)
              return sorted(out,reverse=True)

          print("TARGET DEF",definition[TARGET])
          print("TARGET STATE",state_by.get(TARGET))
          for pid in sorted(COMPARE):
              pts=coords[pid]
              xs=[x for x,y in pts]; ys=[y for x,y in pts]
              print("GEOM",pid,{
                  "area":len(pts),
                  "bbox":[min(xs),min(ys),max(xs),max(ys)],
                  "components":components(pid),
                  "adj":[(n,c,state_by.get(n),definition.get(n,[None]*8)[4] if n in definition else None) for n,c in adjacency_counts(pid).most_common()]
              })

          # Hole / one-pixel neck checks for target.
          target=set(coords[TARGET])
          articulation=[]
          for removed in target:
              rest=target-{removed}
              s=next(iter(rest)); seen={s}; q=[s]
              while q:
                  x,y=q.pop()
                  for dx,dy in ((1,0),(-1,0),(0,1),(0,-1)):
                      p=(x+dx,y+dy)
                      if p in rest and p not in seen:
                          seen.add(p); q.append(p)
              if len(seen)!=len(rest): articulation.append(removed)
          print("ARTICULATION",articulation)

          # Anchors from unitstacks.
          rows=[]
          for raw in Path("map/unitstacks.txt").read_text(encoding="utf-8-sig",errors="replace").splitlines():
              f=raw.split(";")
              if f and f[0].isdigit() and int(f[0])==TARGET:
                  rows.append(raw)
          print("UNITSTACK TARGET")
          for r in rows: print(r)
          type0=[r.split(";") for r in rows if r.split(";")[1]=="0"][0]
          x=float(type0[2]); z=float(type0[4]); mx=round(x); my=h-1-round(z)
          print("TYPE0 PIXEL",mx,my,"province",grid[my*w+mx])

          # Rail route validation.
          adj=defaultdict(set)
          for y in range(h):
              for x in range(w):
                  a=grid[y*w+x]
                  if x+1<w:
                      b=grid[y*w+x+1]
                      if a!=b: adj[a].add(b); adj[b].add(a)
                  if y+1<h:
                      b=grid[(y+1)*w+x]
                      if a!=b: adj[a].add(b); adj[b].add(a)
          print("RAILS")
          for raw in Path("map/railways.txt").read_text(encoding="utf-8-sig",errors="replace").splitlines():
              parts=raw.split()
              if str(TARGET) not in parts: continue
              route=list(map(int,parts[2:]))
              print(raw)
              print([(a,b,b in adj[a]) for a,b in zip(route,route[1:])])

          for p in ["map/supply_nodes.txt","map/buildings.txt","map/weatherpositions.txt"]:
              path=Path(p)
              print("REF",p)
              if path.exists():
                  hits=[raw for raw in path.read_text(encoding="utf-8-sig",errors="replace").splitlines() if re.search(rf"(?<!\d){TARGET}(?!\d)",raw)]
                  for hit in hits: print(hit)
                  print("count",len(hits))

          # Sample relevant visual/map layers over target and compare neighbours.
          layer_paths=["map/heightmap.bmp","map/terrain.bmp","map/rivers.bmp","map/cities.bmp","map/trees.bmp"]
          for lp in layer_paths:
              path=Path(lp)
              if not path.exists(): continue
              im=Image.open(path)
              print("LAYER",lp,"mode",im.mode,"size",im.size)
              if im.size != prov.size:
                  print("  size differs from provinces; skipped pixel comparison")
                  continue
              for pid in sorted(COMPARE):
                  vals=[im.getpixel((x,y)) for x,y in coords[pid]]
                  counts=Counter(vals)
                  print(" ",pid,"minmax", (min(vals),max(vals)) if vals and isinstance(vals[0],int) else "n/a","top",counts.most_common(12))

          # Detect 2x2 checkerboard / X-junctions touching TARGET, which are notorious
          # for ambiguous corner topology in Clausewitz maps.
          xs=[x for x,y in target]; ys=[y for x,y in target]
          x0,x1=min(xs)-2,max(xs)+2; y0,y1=min(ys)-2,max(ys)+2
          crosses=[]
          for y in range(y0,y1):
              for x in range(x0,x1):
                  a=grid[y*w+x]; b=grid[y*w+x+1]
                  c=grid[(y+1)*w+x]; d=grid[(y+1)*w+x+1]
                  if a==d and b==c and a!=b and TARGET in (a,b,c,d):
                      crosses.append((x,y,a,b,c,d))
          print("X_JUNCTIONS",crosses)
          PY
