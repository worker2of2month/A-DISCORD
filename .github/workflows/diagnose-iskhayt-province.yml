name: Apply Iskhayt topology fix

on:
  push:
    branches:
      - fix/iskhayt-province-debug

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Repair province 6 micro-adjacencies
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import csv, re, struct
          from collections import defaultdict, deque
          from pathlib import Path
          from PIL import Image

          MAP = Path("map/provinces.bmp")
          # Province 6 had two accidental tactical bypasses:
          # - 2 edge-pixels against province 85
          # - 1 edge-pixel against province 127
          # Extend the already-adjacent province 11496 wedge into those pixels.
          PATCH = {
              (3839, 990): (6, 11496),
              (3839, 991): (6, 11496),
              (3851, 998): (127, 11496),
          }

          rgb_by_id = {}
          id_by_rgb = {}
          with open("map/definition.csv", encoding="utf-8-sig", newline="") as fh:
              for row in csv.reader(fh, delimiter=";"):
                  if len(row) >= 4 and row[0].isdigit():
                      pid = int(row[0])
                      rgb = tuple(map(int, row[1:4]))
                      rgb_by_id[pid] = rgb
                      id_by_rgb[rgb] = pid

          state_by = {}
          for path in Path("history/states").glob("*.txt"):
              text = path.read_text(encoding="utf-8-sig", errors="replace")
              mi = re.search(r"\bid\s*=\s*(\d+)", text)
              mp = re.search(r"\bprovinces\s*=\s*\{([^}]*)\}", text, re.S)
              if mi and mp:
                  sid = int(mi.group(1))
                  for p in map(int, re.findall(r"\d+", mp.group(1))):
                      state_by[p] = sid

          with Image.open(MAP) as source:
              image = source.convert("RGB")
          w, h = image.size
          px = image.load()

          current = {}
          for pos, (expected, target) in PATCH.items():
              x, y = pos
              pid = id_by_rgb.get(px[x, y])
              current[pos] = pid
              if pid not in (expected, target):
                  raise SystemExit(f"unexpected province at {pos}: {pid}, expected {expected} or {target}")

          if any(current[pos] == expected for pos, (expected, _target) in PATCH.items()):
              raw = bytearray(MAP.read_bytes())
              pixel_offset = struct.unpack_from("<I", raw, 10)[0]
              width = struct.unpack_from("<i", raw, 18)[0]
              height_raw = struct.unpack_from("<i", raw, 22)[0]
              bpp = struct.unpack_from("<H", raw, 28)[0]
              compression = struct.unpack_from("<I", raw, 30)[0]
              if width != w or abs(height_raw) != h or bpp != 24 or compression != 0:
                  raise SystemExit(
                      f"unexpected BMP format width={width} height={height_raw} bpp={bpp} compression={compression}"
                  )
              stride = ((w * 3 + 3) // 4) * 4
              for (x, y), (expected, target) in PATCH.items():
                  if current[(x, y)] == target:
                      continue
                  tr, tg, tb = rgb_by_id[target]
                  file_y = h - 1 - y if height_raw > 0 else y
                  offset = pixel_offset + file_y * stride + x * 3
                  raw[offset:offset + 3] = bytes((tb, tg, tr))
              MAP.write_bytes(raw)

          with Image.open(MAP) as source:
              image = source.convert("RGB")
          px = image.load()
          grid = [-1] * (w * h)
          relevant = {6, 85, 127, 11496, 16372}
          coords = defaultdict(set)
          for y in range(h):
              for x in range(w):
                  pid = id_by_rgb.get(px[x, y], -1)
                  grid[y * w + x] = pid
                  if pid in relevant:
                      coords[pid].add((x, y))

          def connected(points):
              if not points:
                  return False
              start = next(iter(points))
              seen = {start}
              q = deque([start])
              while q:
                  x, y = q.popleft()
                  for dx, dy in ((1,0),(-1,0),(0,1),(0,-1)):
                      p = (x + dx, y + dy)
                      if p in points and p not in seen:
                          seen.add(p)
                          q.append(p)
              return len(seen) == len(points)

          for pid in relevant:
              if not connected(coords[pid]):
                  raise SystemExit(f"province {pid} is disconnected after repair")

          def border_edges(a, b):
              return sum(
                  1
                  for x, y in coords[a]
                  for dx, dy in ((1,0),(-1,0),(0,1),(0,-1))
                  if 0 <= x + dx < w and 0 <= y + dy < h
                  and grid[(y + dy) * w + (x + dx)] == b
              )

          if border_edges(6, 85) != 0:
              raise SystemExit("province 6 still has the two-pixel bypass into province 85")
          if border_edges(6, 127) != 0:
              raise SystemExit("province 6 still has the one-pixel bypass into province 127")
          if border_edges(6, 11496) <= 0:
              raise SystemExit("province 6 lost its proper border with province 11496")
          if border_edges(16372, 11496) != 0:
              raise SystemExit("repair accidentally created a direct Iskhayt-11496 border")

          # The specific rail corridor through 6 -> 11496 must remain valid.
          if border_edges(6, 11496) == 0:
              raise SystemExit("rail corridor 16372-6-11496 was broken")

          print("Applied pixels:")
          for pos, (old, new) in PATCH.items():
              x, y = pos
              print(pos, old, "->", id_by_rgb.get(px[x, y]))
          print("Areas:", {pid: len(coords[pid]) for pid in sorted(relevant)})
          print("Borders:", {
              "6-85": border_edges(6,85),
              "6-127": border_edges(6,127),
              "6-11496": border_edges(6,11496),
              "16372-11496": border_edges(16372,11496),
          })
          PY
      - name: Commit candidate
        shell: bash
        run: |
          if git diff --quiet -- map/provinces.bmp; then
            echo "Candidate already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add map/provinces.bmp
          git commit -m "fix(map): remove province 6 micro-adjacencies"
          git push
