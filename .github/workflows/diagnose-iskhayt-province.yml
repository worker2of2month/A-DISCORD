name: Diagnose Iskhayt seam path

on:
  push:
    branches:
      - fix/iskhayt-province-debug

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Find minimal connected Iskhayt patch
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from collections import defaultdict, deque
          from pathlib import Path
          from PIL import Image

          SRC=6
          OTHER=85
          TARGET=16372

          rgb_to_id={}
          with open("map/definition.csv",encoding="utf-8-sig",newline="") as fh:
              for row in csv.reader(fh,delimiter=";"):
                  if len(row)>=4 and row[0].isdigit():
                      rgb_to_id[tuple(map(int,row[1:4]))]=int(row[0])

          im=Image.open("map/provinces.bmp").convert("RGB")
          w,h=im.size; px=im.load()
          coords=defaultdict(set)
          grid=[-1]*(w*h)
          for y in range(h):
              for x in range(w):
                  p=rgb_to_id.get(px[x,y],-1)
                  grid[y*w+x]=p
                  if p in {SRC,OTHER,TARGET}: coords[p].add((x,y))

          contacts=[]
          for x,y in coords[SRC]:
              if any((x+dx,y+dy) in coords[OTHER] for dx,dy in ((1,0),(-1,0),(0,1),(0,-1))):
                  contacts.append((x,y))
          print("SOURCE CONTACT PIXELS",sorted(contacts))

          target_adjacent_src={
              (x,y) for x,y in coords[SRC]
              if any((x+dx,y+dy) in coords[TARGET] for dx,dy in ((1,0),(-1,0),(0,1),(0,-1)))
          }
          print("SRC PIXELS ADJACENT TO TARGET",sorted(target_adjacent_src))

          def shortest(start, goals):
              q=deque([start]); prev={start:None}
              while q:
                  p=q.popleft()
                  if p in goals:
                      path=[]
                      while p is not None:
                          path.append(p); p=prev[p]
                      return list(reversed(path))
                  x,y=p
                  for dx,dy in ((1,0),(-1,0),(0,1),(0,-1)):
                      n=(x+dx,y+dy)
                      if n in coords[SRC] and n not in prev:
                          prev[n]=p; q.append(n)
              return None

          patch=set()
          for c in sorted(contacts):
              path=shortest(c,target_adjacent_src)
              print("PATH",c,path)
              patch.update(path)
          print("UNION PATCH",sorted(patch),"count",len(patch))

          def connected(points):
              if not points: return False
              s=next(iter(points)); seen={s}; q=[s]
              while q:
                  x,y=q.pop()
                  for dx,dy in ((1,0),(-1,0),(0,1),(0,-1)):
                      n=(x+dx,y+dy)
                      if n in points and n not in seen:
                          seen.add(n);q.append(n)
              return len(seen)==len(points)

          src_after=coords[SRC]-patch
          target_after=coords[TARGET]|patch
          print("SOURCE CONNECTED AFTER",connected(src_after),"area",len(src_after))
          print("TARGET CONNECTED AFTER",connected(target_after),"area",len(target_after))
          remaining=sum(
              1 for x,y in src_after
              for dx,dy in ((1,0),(-1,0),(0,1),(0,-1))
              if (x+dx,y+dy) in coords[OTHER]
          )
          print("REMAINING SRC-OTHER EDGES",remaining)

          xs=[x for p in (coords[SRC]|coords[OTHER]|coords[TARGET]) for x,y in [p]]
          ys=[y for p in (coords[SRC]|coords[OTHER]|coords[TARGET]) for x,y in [p]]
          x0,x1=3834,3845; y0,y1=982,996
          chars={SRC:"A",OTHER:"C",TARGET:"E"}
          for y in range(y0,y1+1):
              row=""
              for x in range(x0,x1+1):
                  p=grid[y*w+x]
                  ch=chars.get(p,".")
                  if (x,y) in patch:
                      ch="P"
                  row+=ch
              print(f"{y:04d}",row)
          PY
