name: Isolated campaign audit

on:
  push:
    branches:
      - audit/grok-20260917-validation

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 32
          persist-credentials: false
      - name: Install validator dependencies
        run: python -m pip install Pillow numpy
      - name: Focused campaign regressions
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest -v tools.tests.test_adiscord_stp_postwar_continuation tools.tests.test_adiscord_stp_postwar_story tools.tests.test_adiscord_rus_last_empire tools.tests.test_validate_adiscord_val_rework tools.tests.test_adiscord_stp_civil_war tools.tests.test_adiscord_stp_preparation tools.tests.test_adiscord_stp_startup tools.tests.test_adiscord_stp_regions tools.tests.test_adiscord_economy_weekly_contracts tools.tests.test_validate_adiscord_vorkerland_collapse tools.tests.test_adiscord_vorkerland_northern_escalation 2>&1 | tee "$RUNNER_TEMP/focused-tests.txt"
      - name: Repository validator
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python -B tools/validate_tc.py --limit 300 2>&1 | tee "$RUNNER_TEMP/validate-tc.txt"
      - name: Audit diff whitespace
        if: always()
        run: git diff --check 4457e9e4e7cb5bbf3cadd4642f985bf563db043e HEAD
      - name: Package lightweight assets
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import os
          import subprocess
          import zipfile
          from pathlib import Path
          root = Path.cwd()
          output = Path(os.environ['RUNNER_TEMP']) / 'audit-small-assets.zip'
          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0'):
                  if not name:
                      continue
                  path = root / name
                  if path.is_file() and path.suffix.lower() in {'.png', '.tga', '.dds', '.bmp'} and path.stat().st_size <= 1500000:
                      archive.write(path, name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-audit-results
          path: |
            ${{ runner.temp }}/focused-tests.txt
            ${{ runner.temp }}/validate-tc.txt
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-audit-small-assets
          path: ${{ runner.temp }}/audit-small-assets.zip
          retention-days: 3
