name: Isolated campaign audit
on:
  push:
    branches: [audit/grok-20260917-validation]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ded9d4a4daeacc07729da982405f348c7d250f59
          fetch-depth: 1
          persist-credentials: false
      - name: Capture current narrative sources
        shell: bash
        run: |
          git archive --format=zip -o "$RUNNER_TEMP/current-narrative.zip" HEAD localisation/replace/ADISCORD_STP_story_l_russian.yml localisation/replace/ADISCORD_vorkerland_news_l_russian.yml localisation/russian/ADISCORD_nam_resource_war_l_russian.yml localisation/russian/events_l_russian.yml
      - uses: actions/upload-artifact@v4
        with:
          name: audit-current-narrative
          path: ${{ runner.temp }}/current-narrative.zip
          retention-days: 7
