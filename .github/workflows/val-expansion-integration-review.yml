name: Kefreyt expansion integration review
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/val-expansion-integration-review'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow numpy pyyaml
      - name: Verify the reachable paid objective and publish a clean branch
        run: |
          cp .github/val_cleanup_finalize.py /tmp/val_cleanup_finalize.py
          git fetch --no-tags --depth=1 origin e41f07d2417b09aec7461b586b33ecc1467f3800
          git switch --detach e41f07d2417b09aec7461b586b33ecc1467f3800
          python -B /tmp/val_cleanup_finalize.py
      - name: Preserve evidence
        if: always()
        run: |
          mkdir -p /tmp/val-cleanup-review
          git diff > /tmp/val-cleanup-review/remaining.diff
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path('/tmp/val-cleanup-review')
          with zipfile.ZipFile('/tmp/val-cleanup-review.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in root.rglob('*'):
                  if path.is_file():
                      archive.write(path, path.relative_to(root))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: val-cleanup-review
          path: /tmp/val-cleanup-review.zip
          retention-days: 7
