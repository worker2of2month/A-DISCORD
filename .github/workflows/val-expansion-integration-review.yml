name: Kefreyt expansion integration review
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  export:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/val-expansion-integration-review'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Export latest verified source inputs
        run: |
          git fetch --no-tags --depth=1 origin e41f07d2417b09aec7461b586b33ecc1467f3800 d21917074259b4f29c8fe36ec20773aeb7ce2e45
          python - <<'PY'
          import subprocess, zipfile, json
          main = 'e41f07d2417b09aec7461b586b33ecc1467f3800'
          base = 'd21917074259b4f29c8fe36ec20773aeb7ce2e45'
          def git(*args): return subprocess.check_output(['git',*args])
          paths = git('diff','--name-only',base,main).decode().splitlines()
          with zipfile.ZipFile('/tmp/val-latest-main.zip','w',zipfile.ZIP_DEFLATED) as z:
              z.writestr('metadata.json',json.dumps({'main':main,'base':base,'changed_files':paths},indent=2))
              for name in paths:
                  p=subprocess.run(['git','show',main+':'+name],capture_output=True)
                  if p.returncode == 0: z.writestr('main/'+name,p.stdout)
          print(json.dumps({'main':main,'changed_files':paths},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: val-latest-main
          path: /tmp/val-latest-main.zip
          retention-days: 3
