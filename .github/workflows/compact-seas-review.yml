name: Compact seas review
on:
  push:
    branches: [fix/compact-kefreite-nodrul-seas]
    paths:
      - .github/workflows/compact-seas-review.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow numpy pytest
      - name: Generate and audit coastal regions
        run: |
          mkdir -p /tmp/compact-seas-results
          python - <<'PY'
          import hashlib, json, os, re, subprocess, sys
          from pathlib import Path

          root = Path.cwd()
          logs = Path('/tmp/compact-seas-results')
          result = {}
          def run(label, args, *, check=True, cwd=None):
              completed = subprocess.run(args, cwd=cwd, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=900)
              (logs / f'{label}.log').write_text(completed.stdout, encoding='utf-8')
              result[label] = completed.returncode
              print(label, 'exit', completed.returncode, completed.stdout[-2500:], flush=True)
              (logs / 'result.json').write_text(json.dumps(result, indent=2), encoding='utf-8')
              if check and completed.returncode:
                  raise RuntimeError(f'{label} failed')
              return completed.returncode

          run('baseline-strategic', [sys.executable, '-B', 'tools/build_adiscord_strategic_regions.py', '--check'])
          run('baseline-general', [sys.executable, '-B', 'tools/validate_tc.py', '--limit', '300'], check=False)
          test = 'tools/tests/test_adiscord_coastal_sea_regions.py'
          red = run('coastal-red', [sys.executable, '-B', '-m', 'pytest', '-q', '--tb=short', test], check=False)
          if red != 1:
              raise RuntimeError('Expected failing coastal assertions before the map change')

          path = root / 'tools/builders/build_adiscord_strategic_regions.py'
          text = path.read_text(encoding='utf-8')
          start = text.index('# The enclosed Antolla basin')
          end = text.index('ALL_SEA_REGIONS = ', start)
          replacement = '''# Dedicated coastal theatres are cut from the macro partition so distant ocean
          # boundaries remain stable. Each cut and the remaining macro region must stay
          # connected. Antolla remains navigable through the existing Strugent canal.
          DEDICATED_SEA_REGIONS = (
              SeaRegion(228, "antolla-sea", "Западное Антолльское море", "temperate_ocean", 2, 2, "water_shallow_sea"),
              SeaRegion(229, "eastern-antolla-sea", "Восточное Антолльское море", "temperate_ocean", 2, 2, "water_shallow_sea"),
              SeaRegion(230, "kefreite-coast", "Кефрейтское побережье", "temperate_ocean", 2, 2),
              SeaRegion(231, "stelander-approaches", "Стеландские морские подступы", "temperate_ocean", 2, 2),
              SeaRegion(232, "strugent-approaches", "Подступы к Стругентскому каналу", "temperate_ocean", 2, 2),
          )
          DEDICATED_SEA_PROVINCES = {
              228: frozenset({16262, 16264, 16265}),
              229: frozenset({16258, 16266, 16268}),
              230: frozenset({13389, 14721, 15477}),
              231: frozenset({13256, 13493, 13596, 14089, 14414, 15500}),
              # The northern inlets have no exit outside these approaches. Keep them in
              # this theatre rather than leaving detached fragments in the macro ocean.
              232: frozenset({
                  13393, 13801, 13961, 14011, 14153, 14225, 14234, 14274, 14360,
                  14416, 14482, 14634, 14761, 14816, 14973, 15190, 15590, 15723, 16030,
              }),
          }
          '''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8', newline='\n')
          path = root / 'tools/data/adiscord_world_names_english.json'
          catalogue = json.loads(path.read_text(encoding='utf-8'))
          entries = catalogue['tools.builders.build_adiscord_strategic_regions'][0]['entries']
          for region_id, russian, english in (
              (228, 'Западное Антолльское море', 'Western Antolla Sea'),
              (229, 'Восточное Антолльское море', 'Eastern Antolla Sea'),
              (230, 'Кефрейтское побережье', 'Kefreite Coast'),
              (231, 'Стеландские морские подступы', 'Stelander Approaches'),
              (232, 'Подступы к Стругентскому каналу', 'Strugent Canal Approaches'),
          ):
              entries[f'STRATEGICREGION_{region_id}'] = {'russian': russian, 'english': english}
          path.write_text(json.dumps(catalogue, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          command = [sys.executable, '-B', 'tools/build_adiscord_strategic_regions.py']
          run('generate', command + ['--apply'])
          run('english', command + ['--english-localisation', '--apply'])
          run('strategic-check', command + ['--check'])
          run('coastal-green', [sys.executable, '-B', '-m', 'pytest', '-q', '--tb=short', test])
          def generated_hashes():
              paths = [*Path('map/strategicregions').glob('*.txt'), Path('map/weatherpositions.txt'), *Path('localisation/replace').glob('strategic_region_names_l_*.yml')]
              return {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(paths)}
          first = generated_hashes()
          run('generate-again', command + ['--apply'])
          run('english-again', command + ['--english-localisation', '--apply'])
          if first != generated_hashes():
              raise RuntimeError('Strategic region generation is not idempotent')
          result['idempotent_files'] = len(first)
          run('general-check', [sys.executable, '-B', 'tools/validate_tc.py', '--limit', '300'], check=False)
          suite = [sys.executable, '-B', '-m', 'pytest', '-q', '--tb=short']
          final_code = run('full-suite', suite, check=False)
          if final_code:
              baseline = Path('/tmp/compact-seas-baseline')
              subprocess.run(['git', 'worktree', 'add', '--detach', str(baseline), 'HEAD'], check=True)
              baseline_code = run('baseline-full-suite', suite + ['--ignore=' + test], check=False, cwd=baseline)
              def failures(label):
                  source = (logs / f'{label}.log').read_text(encoding='utf-8')
                  return set(re.findall(r'(?m)^(?:FAILED|ERROR) (.+?)(?: - |$)', source))
              new_failures = failures('full-suite') - failures('baseline-full-suite')
              result['new_test_failures'] = sorted(new_failures)
              result['existing_test_failures'] = sorted(failures('baseline-full-suite'))
              (logs / 'result.json').write_text(json.dumps(result, indent=2), encoding='utf-8')
              if not baseline_code or new_failures or not failures('full-suite'):
                  raise RuntimeError('Full-suite regression requires review')
          if result['general-check'] and not result['baseline-general']:
              raise RuntimeError('General validator regression requires review')
          run('diff-check', ['git', 'diff', '--check'])
          paths = [
              'tools/builders/build_adiscord_strategic_regions.py',
              'tools/data/adiscord_world_names_english.json',
              'map/strategicregions/228-antolla-sea.txt',
              'map/strategicregions/229-eastern-antolla-sea.txt',
              'map/strategicregions/230-kefreite-coast.txt',
              'map/strategicregions/231-stelander-approaches.txt',
              'map/strategicregions/232-strugent-approaches.txt',
              'map/strategicregions/33-eastern-ocean.txt',
              'map/weatherpositions.txt',
              'localisation/replace/strategic_region_names_l_russian.yml',
              'localisation/replace/strategic_region_names_l_english.yml',
          ]
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if changed - set(paths):
              raise RuntimeError(f'Unrelated tracked changes: {sorted(changed - set(paths))}')
          subprocess.run(['git', 'add', '--', *paths], check=True)
          (logs / 'coastal-regions.patch').write_bytes(subprocess.check_output(['git', 'diff', '--cached', '--binary']))
          result['changed_paths'] = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          (logs / 'result.json').write_text(json.dumps(result, indent=2), encoding='utf-8')
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'Split Kefreite and Nodrul waters into compact naval theatres'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:fix/compact-kefreite-nodrul-seas'], check=True)
          result['commit'] = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          (logs / 'result.json').write_text(json.dumps(result, indent=2), encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-seas-validation
          path: /tmp/compact-seas-results
          retention-days: 7
