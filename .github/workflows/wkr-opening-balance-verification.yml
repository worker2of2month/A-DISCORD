name: WKR opening balance verification
on:
  push:
    branches: [codex/wkr-opening-balance-20260922]
permissions:
  contents: read
concurrency:
  group: wkr-opening-balance-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check Pillow numpy
      - name: Prepare unchanged comparison baseline
        run: |
          git fetch --no-tags --depth=1 origin 0c52cb91cd23bf0a29ca3ee7c264eee35ec978a5
          git worktree add --detach /tmp/wkr-balance-baseline 0c52cb91cd23bf0a29ca3ee7c264eee35ec978a5
          git diff --check 0c52cb91cd23bf0a29ca3ee7c264eee35ec978a5 HEAD
          mkdir -p /tmp/wkr-balance-evidence
          git diff 0c52cb91cd23bf0a29ca3ee7c264eee35ec978a5 HEAD -- common history tools > /tmp/wkr-balance-evidence/gameplay.patch
      - name: Run final tests and compare existing failures
        run: |
          python -B - <<'PY'
          import concurrent.futures
          import collections
          import json
          import os
          import re
          import subprocess
          import sys
          import time
          from pathlib import Path

          head = Path.cwd()
          base = Path('/tmp/wkr-balance-baseline')
          out = Path('/tmp/wkr-balance-evidence')
          summary = {'baseline': '0c52cb91cd23bf0a29ca3ee7c264eee35ec978a5', 'head': os.environ['GITHUB_SHA']}
          modules = [
              'tools.tests.test_vorkerland_central_war_variance',
              'tools.tests.test_validate_adiscord_vorkerland_collapse',
              'tools.tests.test_validate_adiscord_force_designs',
              'tools.tests.test_adiscord_vorkerland_civil_war_focus',
              'tools.tests.test_adiscord_vorkerland_recovery',
              'tools.tests.test_adiscord_vorkerland_diplomacy',
              'tools.tests.test_vorkerland_claimant_spirit_progression',
              'tools.tests.test_vorkerland_emergency_templates',
          ]

          def run(label, root, args, timeout=180):
              started = time.monotonic()
              with (out / (label + '.txt')).open('w') as log:
                  try:
                      p = subprocess.run([sys.executable, '-B', *args], cwd=root, stdout=log, stderr=subprocess.STDOUT, timeout=timeout)
                      code = p.returncode
                  except subprocess.TimeoutExpired:
                      code = 124
                      log.write('\nVERIFICATION_TIMEOUT: full result unavailable\n')
              text = (out / (label + '.txt')).read_text(errors='replace')
              failures = collections.Counter(re.findall(r'(?m)^(?:FAIL|ERROR): (.*)$', text))
              result = {'exit_code': code, 'seconds': round(time.monotonic()-started, 2),
                        'summary': re.findall(r'(?m)^(?:Ran \d+ tests? in .*|FAILED \(.*\)|OK(?: \(.*\))?)$', text),
                        'failure_identities': dict(failures)}
              (out / (label + '.json')).write_text(json.dumps(result, ensure_ascii=False, indent=2))
              print(label, json.dumps({k:v for k,v in result.items() if k != 'failure_identities'}), flush=True)
              return result

          def compare(left, right):
              delta = collections.Counter(right['failure_identities']) - collections.Counter(left['failure_identities'])
              return {'new_or_increased_failures': dict(delta),
                      'resolved_failures': dict(collections.Counter(left['failure_identities']) - collections.Counter(right['failure_identities'])),
                      'completed_both': left['exit_code'] != 124 and right['exit_code'] != 124}

          focused = run('focused', head, ['-m','unittest','-v','tools.tests.test_vorkerland_claimant_opening_balance'])
          summary['focused'] = focused
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
              a = pool.submit(run, 'regional-before', base, ['-m','unittest','-v',*modules])
              b = pool.submit(run, 'regional-after', head, ['-m','unittest','-v',*modules])
              before, after = a.result(), b.result()
          summary['regional_before'] = before
          summary['regional_after'] = after
          summary['regional_comparison'] = compare(before, after)
          print('REGIONAL_COMPARISON', json.dumps(summary['regional_comparison']), flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
              a = pool.submit(run, 'full-before', base, ['-m','unittest','discover','-s','tools/tests','-t','.'], 240)
              b = pool.submit(run, 'full-after', head, ['-m','unittest','discover','-s','tools/tests','-t','.'], 240)
              full_before, full_after = a.result(), b.result()
          summary['full_before'] = full_before
          summary['full_after'] = full_after
          summary['full_comparison'] = compare(full_before, full_after)
          print('FULL_COMPARISON', json.dumps(summary['full_comparison']), flush=True)
          (out / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2))
          assert focused['exit_code'] == 0, 'Focused opening contract failed'
          assert summary['regional_comparison']['completed_both'], 'Regional comparison timed out'
          assert not summary['regional_comparison']['new_or_increased_failures'], 'New regional regression'
          if summary['full_comparison']['completed_both']:
              assert not summary['full_comparison']['new_or_increased_failures'], 'New full-suite regression'
          else:
              print('FULL_SUITE_INCOMPLETE: timeout is recorded, not treated as a green suite', flush=True)
          PY
      - name: Compare validator diagnostics rather than exit code alone
        if: always()
        run: |
          python -B - <<'PY'
          import collections
          import concurrent.futures
          import json
          import re
          import subprocess
          import sys
          from pathlib import Path
          out=Path('/tmp/wkr-balance-evidence')
          out.mkdir(exist_ok=True)
          def run(label, root):
              with (out/(label+'.txt')).open('w') as log:
                  try:
                      p=subprocess.run([sys.executable,'-B','tools/validate_tc.py','--limit','300'],cwd=root,stdout=log,stderr=subprocess.STDOUT,timeout=180)
                      code=p.returncode
                  except subprocess.TimeoutExpired:
                      code=124
              text=(out/(label+'.txt')).read_text(errors='replace')
              sections=re.findall(r'(?m)^== (.*?) ==$',text)
              issues=collections.Counter(re.sub(r':\d+:', ':LINE:', line) for line in text.splitlines() if line.startswith('- '))
              return {'exit_code':code,'sections':sections,'issues':dict(issues)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
              a=pool.submit(run,'validator-before',Path('/tmp/wkr-balance-baseline'))
              b=pool.submit(run,'validator-after',Path.cwd())
              before,after=a.result(),b.result()
          delta=collections.Counter(after['issues'])-collections.Counter(before['issues'])
          data={'before':before,'after':after,'new_or_increased_issues':dict(delta)}
          (out/'validator-comparison.json').write_text(json.dumps(data,ensure_ascii=False,indent=2))
          print('VALIDATOR_BEFORE',before['exit_code'],before['sections'])
          print('VALIDATOR_AFTER',after['exit_code'],after['sections'])
          print('NEW_VALIDATOR_ISSUES',dict(delta))
          assert before['exit_code']==after['exit_code']==0, 'Validator execution failed'
          assert not delta, 'New validation diagnostics'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wkr-final-validation-evidence
          path: /tmp/wkr-balance-evidence/
          retention-days: 14
