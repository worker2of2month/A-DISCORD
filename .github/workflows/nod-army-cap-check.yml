name: Verify Nodrul economic army capacity
on:
  push:
    branches: [codex/nod-economic-army-cap]
    paths: [.github/workflows/nod-army-cap-check.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependencies
        run: python -m pip install Pillow numpy PyYAML
      - name: Reproduce, verify and commit the scoped change
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, os, re, signal, subprocess, sys, zlib
          expected = {
              'common/ai_strategy/ADISCORD_economy_ai.txt': 'f6b2b1cc11084e75749ca77a4fe571faefc6889d',
              'common/scripted_effects/ADISCORD_economy_effects.txt': '05926f6f91671d30797faccc5396b79b771022c6',
              'common/scripted_localisation/ADISCORD_economy_scripted_loc.txt': '1a945dc32255bd1ba1824a6af27562a04733f496',
              'common/scripted_triggers/ADISCORD_economy_triggers.txt': '1d315fdaca64b7469f153633f5c8d102bf985972',
              'localisation/english/ADISCORD_economy_l_english.yml': '23b064691bb519d215a651ce7a4f62df325bb4e9',
              'localisation/russian/ADISCORD_economy_l_russian.yml': 'acaf670dfb69899a197a5b5face3ee515a6236c9',
              'tools/tests/test_adiscord_economy_rebalance.py': 'f4e17522abaa7caeda3fe4acae6529dfe0a50044',
              'tools/tests/test_adiscord_economy_weekly_contracts.py': '777d147ca5f9034e157dfa1e35c49fe8ab6c4ed6',
          }
          expected['localisation/russian/ADISCORD_economy_l_russian.yml'] = 'acaf670dfb69899a197a5b5face3ee515e6236c9'
          for path, sha in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              assert actual == sha, (path, actual, sha)
          logs = Path('/tmp/nod-cap-verification')
          logs.mkdir(exist_ok=True)
          def run(name, command, timeout=180):
              path = logs / (name + '.log')
              with path.open('w', encoding='utf-8') as output:
                  process = subprocess.Popen(command, stdout=output, stderr=subprocess.STDOUT, start_new_session=True)
                  try:
                      rc = process.wait(timeout=timeout)
                  except subprocess.TimeoutExpired:
                      os.killpg(process.pid, signal.SIGTERM)
                      try:
                          process.wait(timeout=5)
                      except subprocess.TimeoutExpired:
                          os.killpg(process.pid, signal.SIGKILL)
                          process.wait()
                      rc = 124
                      output.write('\nTIMEOUT: execution exceeded the verification time bound. No complete pass is claimed.\n')
              text = path.read_text(encoding='utf-8', errors='replace')
              print(name, 'EXIT', rc, flush=True)
              print(text[-3000:], flush=True)
              return rc, text
          def failures(text):
              return sorted(set(re.findall(r'^(?:FAIL|ERROR): (.+)$', text, re.M)))
          focused = [sys.executable, '-B', '-m', 'unittest', 'tools.tests.test_adiscord_economy_rebalance', '-v']
          base_rc, base_text = run('baseline', focused)
          base_failures = failures(base_text)
          assert base_rc == 1 and len(base_failures) == 1 and 'test_frontier_does_not_require_participation_in_the_stelander_crisis' in base_failures[0], base_failures
          patches = {
          'tests': '',
          'gameplay': ''
          }
          def apply(name):
              data = zlib.decompress(base64.b64decode(patches[name], validate=True))
              path = logs / (name + '.patch')
              path.write_bytes(data)
              subprocess.run(['git', 'apply', '--check', str(path)], check=True)
              subprocess.run(['git', 'apply', str(path)], check=True)
          apply('tests')
          new_tests = [sys.executable, '-B', '-m', 'unittest', 'tools.tests.test_adiscord_economy_rebalance.NodrulDivisionEconomyTests', '-v']
          red_rc, red_text = run('red', new_tests)
          assert red_rc == 1 and 'Ran 12 tests' in red_text and '\nERROR:' not in red_text and 'FAILED (failures=' in red_text
          apply('gameplay')
          green_rc, green_text = run('green', new_tests)
          assert green_rc == 0 and 'Ran 12 tests' in green_text
          after_rc, after_text = run('related', focused)
          assert after_rc == base_rc and failures(after_text) == base_failures, failures(after_text)
          preview_rc, preview_text = run('preview', [sys.executable, '-B', '-m', 'unittest', 'tools.tests.test_adiscord_economy_weekly_contracts.WeeklyEconomyContracts.test_policy_previews_are_side_effect_bounded_and_restore_live_state', '-v'])
          assert preview_rc == 0
          validator_rc, validator_text = run('validate-tc', [sys.executable, '-B', 'tools/validate_tc.py', '--limit', '300'])
          assert validator_rc == 0
          suite_rc, suite_text = run('full-suite', [sys.executable, '-B', '-m', 'unittest', 'discover', '-s', 'tools/tests', '-p', 'test_*.py', '-v'], timeout=60)
          subprocess.run(['git', 'diff', '--check'], check=True)
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert set(changed) == set(expected), changed
          for path in changed:
              if path.endswith('.yml'):
                  assert Path(path).read_bytes().startswith(b'\xef\xbb\xbf'), path
              elif path.endswith('.txt'):
                  assert not Path(path).read_bytes().startswith(b'\xef\xbb\xbf'), path
          (logs / 'final.patch').write_bytes(subprocess.check_output(['git', 'diff', '--binary']))
          summary = '\n'.join([
              'New Nodrul scenarios: 12 PASS after observed failing baseline.',
              'Related module baseline: ' + str(base_failures),
              'Related module after: ' + str(failures(after_text)),
              'Native policy-preview fixture: PASS.',
              'Total-conversion validator exit: ' + str(validator_rc) + ' (read findings separately).',
              'Full-suite exit: ' + str(suite_rc) + ' (124 denotes timeout, not a full pass).',
              'Full-suite observed failures: ' + str(failures(suite_text)),
              'Native HOI4 and user save were not run.',
          ])
          (logs / 'summary.txt').write_text(summary + '\n', encoding='utf-8')
          print(summary, flush=True)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', '--', *expected], check=True)
          subprocess.run(['git', 'commit', '-m', 'balance: tie Nodrul division capacity and upkeep to its economy'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/codex/nod-economic-army-cap'], check=True)
          print('VERIFIED_COMMIT=' + subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nod-economic-army-cap-verification
          path: /tmp/nod-cap-verification/
