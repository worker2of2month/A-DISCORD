name: Verify Nodrul economic army capacity
on:
  push:
    branches: [codex/nod-economic-army-cap]
    paths: [.github/workflows/nod-army-cap-check.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependencies
        run: python -m pip install Pillow numpy PyYAML
      - name: Verify source patches and execute the scoped checks
        run: |
          python - <<'PY'
          import ast, base64, hashlib, subprocess, yaml, zlib
          original = 'd839b68b9569e61b8478840e693d858120204b12'
          subprocess.run(['git', 'fetch', '--depth=1', 'origin', original], check=True)
          workflow = yaml.safe_load(subprocess.check_output(['git', 'show', original + ':.github/workflows/nod-army-cap-check.yml'], text=True))
          step = next(s for s in workflow['jobs']['verify']['steps'] if s.get('name') == 'Reproduce, verify and commit the scoped change')
          source = step['run'].split("python - <<'PY'\n", 1)[1].rsplit('\nPY', 1)[0]
          replacements = {
              'KFLBk+Szm': 'KFLBk+zm',
              'N7F3J3kx': 'N7F3Jkx',
              'SMgtJ4wz': 'SMgtJ4z',
              'Pek3S3Q7': 'Pek3Q7',
          }
          for before, after in replacements.items():
              assert source.count(before) == 1, before
              source = source.replace(before, after, 1)
          tree = ast.parse(source)
          assignment = next(n for n in tree.body if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == 'patches' for t in n.targets))
          patches = ast.literal_eval(assignment.value)
          hashes = {
              'tests': 'd9462703603faebd5e189dd61fd87f0257ed9f67491bd1b3b7e6763095d04ad2',
              'gameplay': 'bba8036e2880d700c392e04db39e9a9b0b7600b1c5c56c2615843abd5add5e29',
          }
          for name, encoded in patches.items():
              print('PATCH_LENGTH', name, len(encoded), flush=True)
              decoded = zlib.decompress(base64.b64decode(encoded, validate=True))
              digest = hashlib.sha256(decoded).hexdigest()
              assert digest == hashes[name], (name, digest)
              print('PATCH_SHA256', name, digest, flush=True)
          exec(compile(source, 'nod-economic-cap-verification', 'exec'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nod-economic-army-cap-verification
          path: /tmp/nod-cap-verification/
