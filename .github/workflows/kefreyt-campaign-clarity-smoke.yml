name: Kefreyt campaign clarity smoke

on:
  push:
    branches:
      - rework/val-campaign-clarity-final

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Focus layout and war tooltips
        run: python -B -m unittest tools.tests.test_adiscord_val_focus_layout
      - name: Refugee balance
        run: python -B -m unittest tools.tests.test_adiscord_val_refugee_balance
      - name: Refugee admissions
        run: python -B -m unittest tools.tests.test_adiscord_val_refugees.RefugeeAdmissionTests
      - name: Refugee training
        run: python -B -m unittest tools.tests.test_adiscord_val_refugees.RefugeeTrainingTests
      - name: Southern Tsaygen
        run: python -B -m unittest tools.tests.test_adiscord_val_southern_tsaygen
      - name: VAL expanded route contract
        run: python -B -m unittest tools.tests.test_validate_adiscord_val_rework.ValExpandedCampaignTests.test_resource_war_focus_visibility_follows_the_war_without_hiding_irem
      - name: Scripted peace
        run: python -B -m unittest tools.tests.test_scripted_peace_on_actions
