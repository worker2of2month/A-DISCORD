name: Playable roster build
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: playable-roster-build
  cancel-in-progress: true
jobs:
  verify:
    if: github.head_ref == 'feat/playable-rosters-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          sparse-checkout: |
            common
            history
            events
            interface
            localisation
            tools
            docs
            .github
          sparse-checkout-cone-mode: true
      - name: Verify roster contracts
        run: |
          mkdir -p /tmp/roster-evidence
          python - <<'PY'
          from pathlib import Path
          import subprocess, zipfile
          with zipfile.ZipFile('/tmp/roster-evidence/source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for folder in ('common','history','events','interface','localisation','tools','docs'):
                  for p in Path(folder).rglob('*'):
                      if p.is_file() and p.suffix in ('.txt','.py','.yml','.yaml','.json','.gfx','.gui','.md','.mod','.csv'):
                          z.write(p)
              for name in ('AGENTS.md','descriptor.mod','.gitignore'):
                  if Path(name).exists(): z.write(name)
              z.writestr('_git_tree.txt', subprocess.check_output(['git','ls-tree','-r','HEAD'],text=True))
          print('SOURCE_SNAPSHOT_READY',flush=True)
          PY
          if test -f .github/playable_roster_patch.py; then
            python .github/playable_roster_patch.py
          else
            python -m unittest tools.tests.test_adiscord_playable_rosters -v > /tmp/roster-evidence/red.log 2>&1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playable-roster-evidence
          path: /tmp/roster-evidence
          retention-days: 7
