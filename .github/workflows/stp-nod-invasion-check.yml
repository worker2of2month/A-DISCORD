name: Party Nodrul invasion regression
on:
  push:
    branches: [fix/stp-party-nod-invasion-20260922]
    paths: [.github/workflows/stp-nod-invasion-check.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow
      - name: Compare baseline and regression repair
        shell: bash
        run: |
          python - <<'PY'
          import base64, collections, hashlib, json, pathlib, re, subprocess, zlib
          out = pathlib.Path('/tmp/stp-nod-evidence')
          out.mkdir()
          summary = {}
          paths = {
              'common/on_actions/02_ADISCORD_STP_on_actions.txt': '12d60079a7cd96fdcfaaa19215cf0ba0094083ec',
              'common/scripted_effects/ADISCORD_STP_scripted_effects.txt': 'b26cd507d1706ca360955633db9d7e347f8d8a04',
              'events/ADISCORD_STP_events.txt': '663b61d8f8134fc45a61d5d8f83b3e9f569eaa35',
              'tools/tests/test_adiscord_stp_party_balance.py': '964ccfb4a369c66654b4be2e3bf44207007821ad',
          }
          for path, expected in paths.items():
              assert subprocess.check_output(['git', 'rev-parse', 'HEAD:' + path]).decode().strip() == expected, path
          def run(label, command, timeout=180):
              with (out / (label + '.txt')).open('w') as log:
                  try:
                      code = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT, timeout=timeout).returncode
                  except subprocess.TimeoutExpired:
                      code = 124
                      log.write('\nTIMEOUT=' + str(timeout) + '\n')
              text = (out / (label + '.txt')).read_text()
              summary[label] = {'exit': code, 'failures': re.findall(r'^(?:FAIL|ERROR): .+$', text, re.M), 'tail': text[-1800:]}
              (out / 'summary.json').write_text(json.dumps(summary, indent=2))
              print(label, code, summary[label]['tail'], flush=True)
              return code
          unit = ['python', '-B', '-m', 'unittest']
          related = ['tools.tests.test_adiscord_stp_party_balance', 'tools.tests.test_adiscord_stp_party_route', 'tools.tests.test_adiscord_stp_postwar_continuation', 'tools.tests.test_adiscord_stp_party_survival', '-v']
          target = ['tools.tests.test_adiscord_stp_party_balance.PartyNodInvasionLifecycleTests', '-v']
          validator = ['python', '-B', 'tools/validate_tc.py', '--limit', '300']
          run('baseline-related', unit + related)
          run('baseline-validator', validator)
          tests = ''
          fix = ''
          # Correct transmission-only substitutions before verifying the compressed checksums.
          tests = tests.replace('PuKyojAjW', 'PuKzoAjW').replace('J8JpiF5g', 'JtpiF5g')
          fix = fix.replace('BWJIOuVk', 'BWJZIOuVk')
          for label, data in [('tests', tests), ('fix', fix)]:
              (out / (label + '.patch')).write_bytes(zlib.decompress(base64.b64decode(data)))
          subprocess.run(['git', 'apply', str(out / 'tests.patch')], check=True)
          assert run('red', unit + target) == 1
          assert 'FAILED (failures=9)' in (out / 'red.txt').read_text()
          subprocess.run(['git', 'apply', str(out / 'fix.patch')], check=True)
          assert run('green', unit + target) == 0
          run('after-related', unit + related)
          run('after-validator', validator)
          assert summary['baseline-related']['exit'] != 124
          assert summary['after-related']['exit'] == summary['baseline-related']['exit']
          assert collections.Counter(summary['after-related']['failures']) == collections.Counter(summary['baseline-related']['failures'])
          assert summary['after-validator']['exit'] == summary['baseline-validator']['exit'] == 0
          before = (out / 'baseline-validator.txt').read_text()
          after = (out / 'after-validator.txt').read_text()
          assert before == after
          run('full-suite', unit + ['discover', '-s', 'tools/tests', '-p', 'test*.py', '-v'], timeout=120)
          subprocess.run(['git', 'diff', '--check'], check=True)
          (out / 'change.patch').write_bytes(subprocess.check_output(['git', 'diff', '--'] + list(paths)))
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', '--'] + list(paths), check=True)
          subprocess.run(['git', 'commit', '-m', 'fix(stp): sever party alliance before Nodrul invasion'], check=True)
          summary['commit'] = subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip()
          summary['blobs'] = {path: subprocess.check_output(['git', 'rev-parse', 'HEAD:' + path]).decode().strip() for path in paths}
          summary['runtime'] = 'No Hearts of Iron IV runtime test. Authored branches, callbacks and static validators only.'
          (out / 'summary.json').write_text(json.dumps(summary, indent=2))
          subprocess.run(['git', 'push', 'origin', 'HEAD:fix/stp-party-nod-invasion-20260922'], check=True)
          print(json.dumps({key: summary[key] for key in ['commit', 'blobs', 'runtime']}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stp-party-nod-invasion-evidence
          path: /tmp/stp-nod-evidence
          retention-days: 7
