name: Scripted peace refactor QA
on:
  push:
    branches: [qa/scripted-peace-refactor]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Preserve tools and fetch pinned trees
        run: |
          cp .qa/repair_imported_readers.py .qa/repair_source_collections.py .qa/run_suites.py .qa/verify_native_dispatch.py "$RUNNER_TEMP/"
          git fetch --depth=1 origin d6cc3c77078a25f7318fbf7e371fc6779eab3351 ff34b8d6e4a0cf2e13cc3d293e9086741c5c87f3
          git checkout --detach d6cc3c77078a25f7318fbf7e371fc6779eab3351
      - name: Test dependencies
        run: python -m pip install pillow numpy pyyaml
      - name: Characterize unmodified main
        run: python "$RUNNER_TEMP/run_suites.py" "$RUNNER_TEMP/before.json"
      - name: Repair remaining explicit tooling readers
        run: |
          git checkout --detach ff34b8d6e4a0cf2e13cc3d293e9086741c5c87f3
          python "$RUNNER_TEMP/repair_imported_readers.py"
          python "$RUNNER_TEMP/repair_source_collections.py"
      - name: Focused ownership and repaired source consumers
        run: |
          python -m unittest tools.tests.test_scripted_peace_on_actions tools.tests.test_validate_adiscord_rin_oath_crisis tools.tests.test_adiscord_vorkerland_diplomacy tools.tests.test_validate_adiscord_vorkerland_collapse.CharactersAndPoliticsTests.test_collapse_runtime_cannot_remove_unrelated_national_spirits
      - name: Compare actual native dispatch and all eight country source views
        run: python "$RUNNER_TEMP/verify_native_dispatch.py"
      - name: Differential test gate
        run: python "$RUNNER_TEMP/run_suites.py" "$RUNNER_TEMP/after.json" "$RUNNER_TEMP/before.json"
      - name: Publish verified clean candidate, never main
        run: |
          git config user.name 'worker2of2month'
          git config user.email '81386071+worker2of2month@users.noreply.github.com'
          git add -A -- AGENTS.md docs/development/focus-effects.md common/on_actions tools
          git diff --cached --check
          TREE=$(git write-tree)
          SHA=$(printf 'refactor: centralize scripted peace on_actions\n\nPreserve native ROOT/FROM scopes and callback command order.\nKeep generic capitulation last and retain bounded Livonn completion.\nUpdate explicit source consumers and verify no new suite failures.\nNative HOI4 runtime was not launched.\n' | git commit-tree "$TREE" -p d6cc3c77078a25f7318fbf7e371fc6779eab3351)
          git diff --check d6cc3c77078a25f7318fbf7e371fc6779eab3351 "$SHA"
          git diff --stat d6cc3c77078a25f7318fbf7e371fc6779eab3351 "$SHA"
          git push origin "$SHA:refs/heads/qa/scripted-peace-verified-${GITHUB_RUN_ID}"
          echo VERIFIED_SHA=$SHA
          echo VERIFIED_TREE=$TREE
