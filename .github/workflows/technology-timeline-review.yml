name: Technology timeline review
on:
  push:
    branches: [fix/technology-timeline-labels]
    paths: [.github/workflows/technology-timeline-review.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Reproduce, repair, regenerate and verify
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os, re, subprocess, sys
          evidence=Path('/tmp/timeline-review')
          evidence.mkdir()
          source=Path('.github/technology_timeline_review.py').read_text()
          source=source.replace("' '' '.rstrip()", "'\n'''.rstrip()")
          (evidence/'repair.py').write_text(source)
          repair={}
          exec(compile(source,'timeline_repair.py','exec'),repair)
          def run(args,name,timeout=180):
              with (evidence/(name+'.log')).open('w') as log:
                  try:
                      status=subprocess.run(args,stdout=log,stderr=subprocess.STDOUT,timeout=timeout).returncode
                  except subprocess.TimeoutExpired:
                      status=124
                      log.write('\nTIMEOUT\n')
              text=(evidence/(name+'.log')).read_text()
              print(name,status,text[-1800:])
              return status,text
          modules=[sys.executable,'-B','-m','unittest','tools.tests.test_build_adiscord_technology_system','tools.tests.test_adiscord_technology_ui','-v']
          before_status,before=run(modules,'baseline')
          run([sys.executable,'-B','-m','tools.builders.build_adiscord_technology_system','--check'],'generator-check-before')
          repair['add_tests']()
          cls='tools.tests.test_build_adiscord_technology_system.CompactTechnologyTreeContractTests.'
          new=['test_native_grid_cross_axis_is_centered_beneath_each_branch_title','test_horizontal_ruler_dates_match_every_technology_start_year','test_year_label_centres_align_with_native_technology_cells','test_ui_validator_rejects_swapped_dates_displaced_labels_and_wrong_titles']
          status,red=run([sys.executable,'-B','-m','unittest',*[cls+n for n in new],'-v'],'red')
          assert status!=0 and 'FAIL:' in red and 'ERROR:' not in red
          repair['apply_fix']()
          from tools.builders import build_adiscord_technology_system as g
          from tools.validators import validate_adiscord_tech_doctrine as v
          files=[Path('common/technologies')/f for f in sorted({b.file for b in g.BRANCHES})]
          old={p:p.read_bytes() for p in files}
          g.write_technology_files();g.write_gui()
          generated=files+[Path('interface/countrytechtreeview.gui')]
          first={p:p.read_bytes() for p in generated}
          g.write_technology_files();g.write_gui()
          assert all(p.read_bytes()==data for p,data in first.items()),'non-idempotent generator'
          strip=lambda s:re.sub(r'position = \{ x = -?\d+ y = -?\d+ \}','position = { VISUAL }',s.decode())
          assert all(strip(old[p])==strip(p.read_bytes()) for p in files),'nonvisual technology changes'
          assert v.check_technology_ui_years()==[],v.check_technology_ui_years()
          from tools.tests.test_build_adiscord_technology_system import CompactTechnologyTreeContractTests as T
          focused=[n for n in dir(T) if n.startswith('test_') and any(w in n for w in ('horizontal','vertical','native_grid','year_label','ui_validator','every_node_fits','consecutive_rungs','validator_accepts','gui_regeneration'))]
          ui='tools.tests.test_adiscord_technology_ui.TechnologyUiContractTests.'
          focus_status,_=run([sys.executable,'-B','-m','unittest',*[cls+n for n in focused],ui+'test_tree_skin_is_idempotent_for_generated_and_mixed_input',ui+'test_tree_skin_still_rejects_missing_or_duplicate_widgets','-v'],'focused')
          assert focus_status==0
          after_status,after=run(modules,'after')
          failures=lambda s:sorted(re.findall(r'^(?:FAIL|ERROR): (.+)$',s,re.M))
          assert failures(before)==failures(after),{'new_failures':sorted(set(failures(after))-set(failures(before)))}
          check_status,_=run([sys.executable,'-B','-m','tools.builders.build_adiscord_technology_system','--check'],'generator-check-after')
          tc_status,_=run([sys.executable,'-B','tools/validate_tc.py','--limit','300'],'validate-tc')
          suite_status,_=run([sys.executable,'-B','-m','unittest','discover','-s','tools/tests'],'full-suite',timeout=120)
          changed=subprocess.check_output(['git','diff','--name-only']).decode().splitlines()
          allowed=[str(p) for p in generated]+['tools/builders/build_adiscord_technology_system.py','tools/builders/build_adiscord_technology_ui_assets.py','tools/validators/validate_adiscord_tech_doctrine.py','tools/tests/test_build_adiscord_technology_system.py','tools/tests/test_adiscord_technology_ui.py']
          assert set(changed)==set(allowed),changed
          subprocess.run(['git','diff','--check'],check=True)
          (evidence/'final.patch').write_bytes(subprocess.check_output(['git','diff','--',*changed]))
          base=subprocess.check_output(['git','rev-parse','212442a3dc4d5543d7efae7cdb3ab7ac9fae2eca^']).decode().strip()
          env=dict(os.environ,GIT_INDEX_FILE='/tmp/timeline-delivery-index')
          subprocess.run(['git','read-tree',base],env=env,check=True)
          for path in changed:
              blob=subprocess.check_output(['git','hash-object','-w',path]).decode().strip()
              subprocess.run(['git','update-index','--add','--cacheinfo','100644',blob,path],env=env,check=True)
          tree=subprocess.check_output(['git','write-tree'],env=env).decode().strip()
          subprocess.run(['git','config','user.name','A-Discord technology maintenance'],check=True)
          subprocess.run(['git','config','user.email','81386071+worker2of2month@users.noreply.github.com'],check=True)
          commit=subprocess.check_output(['git','commit-tree',tree,'-p',base],input=b'fix(technology): align all branch titles and year rulers with native grids\n').decode().strip()
          branch='fix/technology-timeline-verified-'+os.environ['GITHUB_RUN_ID']
          subprocess.run(['git','push','origin',commit+':refs/heads/'+branch],check=True)
          report={'base':base,'head':commit,'branch':branch,'changed_files':changed,'folders':len(g.FOLDER_BACKGROUNDS),'branches':len(g.BRANCHES),'technologies':sum(len(b.techs) for b in g.BRANCHES),'focused_tests':len(focused)+2,'focused_exit':focus_status,'baseline_failures':failures(before),'after_failures':failures(after),'no_new_module_failures':True,'generator_check_exit':check_status,'validate_tc_exit':tc_status,'full_suite_exit':suite_status,'idempotent':True,'gameplay_unchanged':True,'runtime_verified':False}
          (evidence/'manifest.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: technology-timeline-review
          path: /tmp/timeline-review/
          retention-days: 3
