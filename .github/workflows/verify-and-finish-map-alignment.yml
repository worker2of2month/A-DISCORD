name: Verify and finish map alignment

on:
  push:
    branches:
      - agent/map-alignment-verifier-20260819
    paths:
      - .github/workflows/verify-and-finish-map-alignment.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: write
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install map tooling dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow

      - name: Verify target branch and recover the finalizer when necessary
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          LOG=/tmp/map-alignment-verifier.log
          exec > >(tee "$LOG") 2>&1

          finish_comment() {
            gh pr comment 2 --repo worker2of2month/A-DISCORD --body-file "$1" || true
          }
          failure_comment() {
            {
              echo "Map alignment finalization is still blocked. Verifier log tail:"
              echo
              echo '```text'
              tail -n 180 "$LOG"
              echo '```'
            } >/tmp/failure-comment.md
            finish_comment /tmp/failure-comment.md
          }
          trap failure_comment ERR

          TARGET=/tmp/adiscord-target
          rm -rf "$TARGET"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/worker2of2month/A-DISCORD.git" "$TARGET"
          cd "$TARGET"
          git fetch --all --tags --prune
          git checkout -B agent/map-layer-alignment origin/agent/map-layer-alignment

          verify_final() {
            local subject
            subject="$(git show -s --format=%s HEAD)"
            [[ "$subject" == "fix(map): align province terrain layers with definition" ]]
            [[ -f docs/map/province-layer-alignment-2026-08-19.md ]]
            [[ -f docs/map/province-layer-alignment-2026-08-19.csv ]]
            [[ -f tools/builders/run_adiscord_province_layer_alignment.py ]]
            python tools/builders/run_adiscord_province_layer_alignment.py --check
            python tools/validators/validate_adiscord_ivn_overhaul.py
            while IFS= read -r validator; do python "$validator"; done < <(find tools/validators -maxdepth 1 -type f -iname '*permanent*snow*.py' | sort)
          }

          if verify_final; then
            FINAL_SHA="$(git rev-parse HEAD)"
          else
            echo "Target branch is not final; recovering source payloads and rerunning the finalizer."
            mkdir -p /tmp/alignment-artifacts
            for RUN_ID in 32186432815 32187098646 32185863717; do
              gh run download "$RUN_ID" --repo worker2of2month/A-DISCORD --dir "/tmp/alignment-artifacts/$RUN_ID" || true
            done

            python - <<'PY'
          from __future__ import annotations
          import base64, json, re, zipfile
          from pathlib import Path

          target = Path('/tmp/adiscord-target')
          destination = target / 'tools/builders/build_adiscord_province_layer_alignment.py'
          if destination.exists():
              print('Alignment builder already present:', destination)
              raise SystemExit(0)

          roots = [target, Path('/tmp/alignment-artifacts')]
          for root in roots:
              if root.exists():
                  for archive in root.rglob('*.zip'):
                      out = archive.with_suffix('')
                      out.mkdir(parents=True, exist_ok=True)
                      try:
                          with zipfile.ZipFile(archive) as zf:
                              zf.extractall(out)
                      except Exception:
                          pass

          def plausible(data: bytes, path: Path) -> bool:
              lowered = data.lower()
              name = str(path).lower()
              if b'def main' not in lowered:
                  return False
              required = (b'terrain.bmp', b'trees.bmp', b'heightmap.bmp', b'definition.csv')
              if not all(item in lowered for item in required):
                  return False
              if b'final_commit' in lowered or b'gh run download' in lowered:
                  return False
              return 'province_layer_alignment' in name or b'province layer alignment' in lowered or b'alignment audit' in lowered

          candidates: list[tuple[int, Path, bytes]] = []
          all_files: list[Path] = []
          for root in roots:
              if root.exists():
                  all_files.extend(p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and p.stat().st_size < 80_000_000)

          for path in all_files:
              try:
                  data = path.read_bytes()
              except Exception:
                  continue
              score = 10 if 'province_layer_alignment' in path.name.lower() else 0
              if plausible(data, path):
                  candidates.append((score + 5, path, data))
              stripped = re.sub(rb'\s+', b'', data)
              if len(stripped) > 200 and re.fullmatch(rb'[A-Za-z0-9+/=]+', stripped):
                  try:
                      decoded = base64.b64decode(stripped, validate=True)
                  except Exception:
                      decoded = b''
                  if plausible(decoded, path):
                      candidates.append((score + 8, path, decoded))
              if path.suffix.lower() == '.json':
                  try:
                      obj = json.loads(data.decode('utf-8'))
                  except Exception:
                      continue
                  stack = [obj]
                  while stack:
                      item = stack.pop()
                      if isinstance(item, dict):
                          stack.extend(item.values())
                      elif isinstance(item, list):
                          stack.extend(item)
                      elif isinstance(item, str) and len(item) > 200:
                          raw = re.sub(r'\s+', '', item).encode()
                          try:
                              decoded = base64.b64decode(raw, validate=True)
                          except Exception:
                              continue
                          if plausible(decoded, path):
                              candidates.append((score + 12, path, decoded))

          if not candidates:
              raise SystemExit('Unable to recover build_adiscord_province_layer_alignment.py from branch or artifacts')
          candidates.sort(key=lambda item: (item[0], len(item[2])), reverse=True)
          _, source_path, content = candidates[0]
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_bytes(content)
          print('Recovered alignment builder from', source_path, '->', destination)
          PY

            FINALIZER=.github/scripts/finalize_map_alignment_v4.py
            if [[ ! -f "$FINALIZER" ]]; then
              FINALIZER_COMMIT="$(git log --all --format='%H' -- "$FINALIZER" | head -n1)"
              [[ -n "$FINALIZER_COMMIT" ]]
              git show "$FINALIZER_COMMIT:$FINALIZER" >/tmp/finalize_map_alignment_v4.py
              FINALIZER=/tmp/finalize_map_alignment_v4.py
            fi

            python "$FINALIZER"
            git fetch origin agent/map-layer-alignment
            git reset --hard origin/agent/map-layer-alignment
            verify_final
            FINAL_SHA="$(git rev-parse HEAD)"
          fi

          gh pr ready 2 --repo worker2of2month/A-DISCORD || true
          gh pr edit 2 --repo worker2of2month/A-DISCORD \
            --title "Align province terrain layers with definition" \
            --body "## Result\n\nClean commit: \`$FINAL_SHA\`\n\nUpdated \`terrain.bmp\`, \`trees.bmp\`, \`heightmap.bmp\`, and dependent \`world_normal.bmp\` from the uploaded province geometry and \`definition.csv\`. The complete per-province audit is committed as Markdown and CSV.\n\n## Verification\n\n- alignment pipeline \`--check\`\n- focused alignment unit tests\n- IVN geography builder and full IVN validator\n- permanent-snow validator\n- \`provinces.bmp\` and \`definition.csv\` unchanged from the generation base"
          {
            echo "Map alignment is finalized."
            echo
            echo "- Clean commit: \`$FINAL_SHA\`"
            echo "- Audit: \`docs/map/province-layer-alignment-2026-08-19.md\`"
            echo "- Machine-readable audit: \`docs/map/province-layer-alignment-2026-08-19.csv\`"
          } >/tmp/success-comment.md
          finish_comment /tmp/success-comment.md
