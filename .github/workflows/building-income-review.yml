name: Building income review
on:
  push:
    branches: [codex/building-income-20260919]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 64
          show-progress: false
      - run: python -m pip install Pillow numpy
      - name: Reconcile current main
        run: |
          git config user.name 'A-Discord automation'
          git config user.email '81386071+worker2of2month@users.noreply.github.com'
          git fetch --no-tags --depth=64 origin main:refs/remotes/origin/main
          git merge --no-edit origin/main
          git rev-parse origin/main > /tmp/building-main-parent
      - name: Add regressions and apply bounded balance changes
        run: |
          python -B .github/building_income_tests.py
          python -B .github/building_income_patch.py
          python -B - <<'PY'
          from pathlib import Path
          import ast
          from tools.tests.test_validate_adiscord_val_rework import named_block_spans
          p=Path('common/scripted_effects/ADISCORD_economy_effects.txt')
          text=p.read_text(encoding='utf-8')
          for name, values in (
              ('ADISCORD_economy_apply_tax_burden_to_income', {'business_income':150,'consumer_goods_income':100}),
              ('ADISCORD_economy_recalculate_tax_dependent_income', {'business_income':500,'consumer_goods_income':500}),
          ):
              matches=named_block_spans(text,name);assert len(matches)==1
              b=matches[0];body=b.text
              for variable,old in values.items():
                  original=f'var = ADISCORD_economy_{variable} min = 0 max = {old} }}'
                  assert body.count(original)==1,(name,variable)
                  body=body.replace(original,f'var = ADISCORD_economy_{variable} min = 0 max = 5000 }}')
              text=text[:b.start]+body+text[b.end:]
          old='# 20 national factories become a +5% country modifier: (10 * 2 * 5) / 20.'
          assert text.count(old)==1
          text=text.replace(old,'# 20 national factories become a +10% country modifier: (10 * 2 * 10) / 20.')
          old='var = ADISCORD_economy_treasury_cap min = 100 max = 2000 }'
          assert text.count(old)==1
          text=text.replace(old,'var = ADISCORD_economy_treasury_cap min = 100 max = 5000 }')
          p.write_text(text,encoding='utf-8')
          p=Path('tools/tests/test_adiscord_economy_weekly_contracts.py')
          text=p.read_text(encoding='utf-8');lines=text.splitlines(keepends=True)
          method=next(n for n in ast.walk(ast.parse(text)) if isinstance(n,ast.FunctionDef) and n.name=='test_building_tooltips_lead_with_role_and_budget_impact')
          body=''.join(lines[method.lineno-1:method.end_lineno])
          for old,new in (('+1,20','+30,15'),('-0,27','-0,62'),('+0,31','+9,86'),('Роль: местное военное производство','Роль: доход и местное военное производство')):
              assert body.count(old)==1,old
              body=body.replace(old,new)
          body+='            self.assertIn(chr(92) + "n", match.group(1))\n'
          body+='            self.assertNotIn(chr(92) * 2 + "n", match.group(1))\n'
          lines[method.lineno-1:method.end_lineno]=[body]
          p.write_text(''.join(lines),encoding='utf-8')
          p=Path('localisation/russian/ADISCORD_economy_l_russian.yml')
          text=p.read_text(encoding='utf-8-sig');lines=text.splitlines(keepends=True)
          for i,line in enumerate(lines):
              if any(line.lstrip().startswith(key+':') for key in ('ADISCORD_business_center_desc','ADISCORD_science_center_desc','ADISCORD_industrial_cluster_desc')):
                  print('DESCRIPTION_ESCAPE_COUNTS',line.split(':',1)[0],line.count(chr(92)*2+'n'))
                  lines[i]=line.replace(chr(92)*2+'n',chr(92)+'n')
          p.write_text(''.join(lines),encoding='utf-8-sig')
          PY
      - name: Targeted building and accounting regression tests
        run: |
          python -B -m unittest tools.tests.test_adiscord_economy_rebalance tools.tests.test_adiscord_economy_weekly_contracts.EconomyAccountingRegressionTests tools.tests.test_adiscord_economy_weekly_contracts.WeeklyEconomyContracts.test_industrial_cluster_output_is_location_weighted_without_a_new_scan tools.tests.test_adiscord_economy_weekly_contracts.WeeklyEconomyContracts.test_ai_building_targets_are_bounded_by_fiscal_state tools.tests.test_adiscord_economy_weekly_contracts.WeeklyEconomyContracts.test_economic_building_reference_documents_roles_and_formulas tools.tests.test_adiscord_economy_weekly_contracts.WeeklyEconomyContracts.test_building_tooltips_lead_with_role_and_budget_impact -v
      - name: Full economy regression suite
        run: python -B -m unittest tools.tests.test_adiscord_economy_weekly_contracts tools.tests.test_adiscord_economy_rebalance -q
      - name: Total conversion validation
        run: |
          python -B tools/validate_tc.py --limit 300 > /tmp/building-validation.log
          cat /tmp/building-validation.log
      - name: Inspect exact patch and verify encoding
        run: |
          git diff --check
          git diff --stat
          git diff -- common/scripted_effects/ADISCORD_economy_effects.txt common/scripted_effects/ADISCORD_economy_modifier_effects.txt common/ideas/ADISCORD_economy_ideas.txt common/ai_strategy/ADISCORD_economy_ai.txt tools/validators/validate_adiscord_economy_ai.py
          python -B - <<'PY'
          from pathlib import Path
          import json
          for name in json.loads(Path('/tmp/building-income-paths.json').read_text()):
              raw=Path(name).read_bytes()
              if name.startswith('common/'): assert not raw.startswith(b'\xef\xbb\xbf'),name
              if name.startswith('localisation/'):
                  assert raw.startswith(b'\xef\xbb\xbf'),name
                  text=raw.decode('utf-8-sig')
                  for key in ('ADISCORD_business_center_desc','ADISCORD_science_center_desc','ADISCORD_industrial_cluster_desc'):
                      lines=[line for line in text.splitlines() if line.lstrip().startswith(key+':')]
                      assert len(lines)==1 and lines[0].rstrip().endswith('"'),key
                      print('BUILDING_DESCRIPTION',lines[0])
          from tools.tests.test_adiscord_economy_rebalance import building_budget_fixture,P
          for counts in ((0,0,0),(4,2,1),(8,4,2),(12,4,2),(24,12,6)):
              f=building_budget_fixture(*counts)
              print('BUILDING_SCENARIO',counts,{key:f.scopes['A'][P+key] for key in ('monthly_income','monthly_expenses','weekly_balance','treasury_cap')})
          PY
      - name: Publish clean tested candidate
        run: |
          python -B - <<'PY'
          from pathlib import Path
          import json,subprocess
          paths=json.loads(Path('/tmp/building-income-paths.json').read_text())
          subprocess.run(['git','add','--',*paths],check=True)
          PY
          git rm -- .github/workflows/building-income-review.yml .github/building_income_tests.py .github/building_income_patch.py
          git diff --cached --check
          PARENT=$(cat /tmp/building-main-parent)
          TREE=$(git write-tree)
          if git diff --name-only "$PARENT" "$TREE" | grep '^.github/'; then exit 1; fi
          CANDIDATE=$(git commit-tree "$TREE" -p "$PARENT" -m 'Buff economic buildings and enable building-led weekly surpluses above 100')
          git push origin "$CANDIDATE":refs/heads/codex/building-income-ready-20260919
          printf '\nFINAL_PARENT=%s\nFINAL_TREE=%s\nFINAL_COMMIT=%s\n' "$PARENT" "$TREE" "$CANDIDATE"
