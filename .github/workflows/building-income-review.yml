name: Building income review
on:
  push:
    branches: [codex/building-income-20260919]
permissions:
  contents: read
jobs:
  inspect-and-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - run: python -m pip install Pillow numpy
      - name: Reproduce requested building income gap
        run: |
          python -B .github/building_income_tests.py
          python -B - <<'PY'
          import unittest
          from tools.tests.test_adiscord_economy_rebalance import BuildingIncomeTests,building_budget_fixture,P
          result=unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromTestCase(BuildingIncomeTests))
          f=building_budget_fixture()
          print('BASELINE_BUDGET',{key:f.scopes['A'][P+key] for key in ('monthly_income','monthly_expenses','weekly_balance')})
          assert result.failures and not result.errors, 'Expected numeric balance failures, not a broken fixture'
          PY
      - name: Inspect remaining bounded upgrade sites
        if: always()
        run: |
          python -B - <<'PY'
          from pathlib import Path
          import ast,re
          from tools.tests.test_adiscord_economy_weekly_contracts import block
          def read(path): return Path(path).read_text(encoding='utf-8-sig')
          print('BUILDINGS')
          for name in ('ADISCORD_business_center','ADISCORD_science_center','ADISCORD_industrial_cluster'):
              print(name,block(read('common/buildings/00_buildings.txt'),name))
          print('BUILDING SCALARS')
          for p in (Path('common/scripted_effects/ADISCORD_economy_effects.txt'),Path('common/ideas/ADISCORD_economy_ideas.txt')):
              lines=read(p).splitlines(); seen=set()
              terms=('science_network','cluster_network','cluster_factory_output_percent','treasury_building_temp','business_center_count','science_center_count','industrial_cluster_count')
              for i,line in enumerate(lines):
                  if any(term in line for term in terms):
                      for j in range(max(0,i-1),min(len(lines),i+4)):
                          if j not in seen: print(p,j+1,lines[j]);seen.add(j)
          print('LOCALISATION')
          for folder in ('localisation/russian','localisation/english'):
              for p in Path(folder).glob('*.yml'):
                  for line in read(p).splitlines():
                      if any(term in line for term in ('ADISCORD_business_center_desc:', 'ADISCORD_science_center_desc:', 'ADISCORD_industrial_cluster_desc:')): print(p,line)
          print('AI STRATEGY')
          print(read('common/ai_strategy/ADISCORD_economy_ai.txt'))
          print('RELATED TESTS')
          needles=('2.10','2.25','0.45','science_network','cluster_network','cluster_factory_output_percent','building_target','research_network')
          for p in [Path('tools/tests/test_adiscord_economy_weekly_contracts.py'),Path('tools/validators/validate_adiscord_economy_ai.py')]:
              text=read(p);module=ast.parse(text);lines=text.splitlines()
              for node in ast.walk(module):
                  if isinstance(node,ast.FunctionDef):
                      part=lines[node.lineno-1:node.end_lineno]
                      if any(any(term in line for term in needles) for line in part):
                          print('FUNCTION',p,node.name,node.lineno,node.end_lineno)
                          seen=set()
                          for i,line in enumerate(part):
                              if any(term in line for term in needles):
                                  for j in range(max(0,i-2),min(len(part),i+4)):
                                      if j not in seen:print(node.lineno+j,part[j]);seen.add(j)
          PY
