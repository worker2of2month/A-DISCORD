name: STP loop guarded patch

on:
  push:
    branches:
      - fix/stp-gameplay-loop-20260917

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stp-gameplay-loop-20260917
          fetch-depth: 0
      - name: Apply guarded replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')

          def block_span(text: str, name: str):
              m = re.search(rf'(?m)^\s*{re.escape(name)}\s*=\s*\{{', text)
              if not m:
                  raise SystemExit(f'missing block: {name}')
              opening = text.find('{', m.start())
              depth = 0
              for i in range(opening, len(text)):
                  if text[i] == '{': depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          return m.start(), i + 1
              raise SystemExit(f'unterminated block: {name}')

          def get_block(text: str, name: str) -> str:
              a, b = block_span(text, name)
              return text[a:b]

          def replace_block(text: str, name: str, replacement: str) -> str:
              a, b = block_span(text, name)
              return text[:a] + replacement.rstrip() + text[b:]

          # --- Inspection state machine -------------------------------------------------
          p = ROOT / 'common/scripted_effects/ADISCORD_STP_scripted_effects.txt'
          effects = p.read_text(encoding='utf-8')
          scheduler = '''STP_schedule_next_party_inspection = {
          \tif = {
          \t\tlimit = {
          \t\t\thas_country_flag = STP_battle_for_stelander_active
          \t\t\thas_country_flag = STP_cw_inspection_chain_open
          \t\t\tNOT = { STP_cw_two_inspections_active = yes }
          \t\t}
          \t\t# Maintain one commission below 50 suspicion and two at or above 50.
          \t\tif = {
          \t\t\tlimit = {
          \t\t\t\tNOT = {
          \t\t\t\t\tOR = {
          \t\t\t\t\t\t2 = { has_state_flag = STP_party_inspection_active }
          \t\t\t\t\t\t3 = { has_state_flag = STP_party_inspection_active }
          \t\t\t\t\t\t29 = { has_state_flag = STP_party_inspection_active }
          \t\t\t\t\t\t45 = { has_state_flag = STP_party_inspection_active }
          \t\t\t\t\t\t46 = { has_state_flag = STP_party_inspection_active }
          \t\t\t\t\t\t53 = { has_state_flag = STP_party_inspection_active }
          \t\t\t\t\t}
          \t\t\t\t}
          \t\t\t}
          \t\t\tSTP_cw_open_one_party_inspection = yes
          \t\t}
          \t\tif = {
          \t\t\tlimit = { STP_cw_second_inspection_unlocked = yes }
          \t\t\tSTP_cw_open_one_party_inspection = yes
          \t\t}
          \t}
          }'''
          effects = replace_block(effects, 'STP_schedule_next_party_inspection', scheduler)
          opener = get_block(effects, 'STP_cw_open_one_party_inspection')
          dead_end = '\n\t\t1 = { }'
          if opener.count(dead_end) != 1:
              raise SystemExit(f'expected one inspection random no-op, found {opener.count(dead_end)}')
          opener = opener.replace(dead_end, '', 1)
          effects = replace_block(effects, 'STP_cw_open_one_party_inspection', opener)
          p.write_text(effects, encoding='utf-8', newline='\n')

          # --- Decisions / mission lifecycle -------------------------------------------
          p = ROOT / 'common/decisions/ADISCORD_STP_decisions.txt'
          decisions = p.read_text(encoding='utf-8')

          delay = get_block(decisions, 'STP_cw_delay_inspection')
          old_extensions = '''\t\t\t\tif = { limit = { has_active_mission = STP_party_inspection_state_2 } add_days_mission_timeout = { mission = STP_party_inspection_state_2 days = 14 } }
          \t\t\t\tif = { limit = { has_active_mission = STP_party_inspection_state_3 } add_days_mission_timeout = { mission = STP_party_inspection_state_3 days = 14 } }
          \t\t\t\tif = { limit = { has_active_mission = STP_party_inspection_state_29 } add_days_mission_timeout = { mission = STP_party_inspection_state_29 days = 14 } }
          \t\t\t\tif = { limit = { has_active_mission = STP_party_inspection_state_45 } add_days_mission_timeout = { mission = STP_party_inspection_state_45 days = 14 } }
          \t\t\t\tif = { limit = { has_active_mission = STP_party_inspection_state_46 } add_days_mission_timeout = { mission = STP_party_inspection_state_46 days = 14 } }
          \t\t\t\tif = { limit = { has_active_mission = STP_party_inspection_state_53 } add_days_mission_timeout = { mission = STP_party_inspection_state_53 days = 14 } }'''
          new_extensions = '''\t\t\t\tif = { limit = { has_active_mission = STP_party_inspection_state_2 } add_days_mission_timeout = { mission = STP_party_inspection_state_2 days = 14 } }
          \t\t\t\telse_if = { limit = { has_active_mission = STP_party_inspection_state_3 } add_days_mission_timeout = { mission = STP_party_inspection_state_3 days = 14 } }
          \t\t\t\telse_if = { limit = { has_active_mission = STP_party_inspection_state_29 } add_days_mission_timeout = { mission = STP_party_inspection_state_29 days = 14 } }
          \t\t\t\telse_if = { limit = { has_active_mission = STP_party_inspection_state_45 } add_days_mission_timeout = { mission = STP_party_inspection_state_45 days = 14 } }
          \t\t\t\telse_if = { limit = { has_active_mission = STP_party_inspection_state_46 } add_days_mission_timeout = { mission = STP_party_inspection_state_46 days = 14 } }
          \t\t\t\telse_if = { limit = { has_active_mission = STP_party_inspection_state_53 } add_days_mission_timeout = { mission = STP_party_inspection_state_53 days = 14 } }'''
          if delay.count(old_extensions) != 1:
              raise SystemExit('inspection delay payload changed unexpectedly')
          delay = delay.replace(old_extensions, new_extensions)
          decisions = replace_block(decisions, 'STP_cw_delay_inspection', delay)

          primary = '''\tSTP_cw_launch_last_banquet = {
          \t\ticon = generic_prepare_civil_war
          \t\tallowed = { tag = STS }
          \t\tvisible = { has_completed_focus = STP_cw_last_banquet NOT = { has_country_flag = STP_cw_last_banquet_launched } }
          \t\tavailable = {
          \t\t\thas_war_with = STP
          \t\t\tcontrols_state = 3
          \t\t\tNOT = { has_country_flag = STP_cw_last_banquet_launched }
          \t\t\tNOT = {
          \t\t\t\thas_idea = STP_cw_deliberate_offensive
          \t\t\t\thas_idea = STP_cw_static_defence
          \t\t\t\thas_idea = STP_cw_front_reorganization
          \t\t\t\thas_idea = STP_cw_offensive_preparation
          \t\t\t\thas_idea = STP_cw_defensive_preparation
          \t\t\t}
          \t\t}
          \t\tcustom_cost_text = STP_cw_command_power_25_cost
          \t\tcustom_cost_trigger = { NOT = { command_power < 25 } }
          \t\tcost = 0
          \t\tdays_re_enable = 42
          \t\tfire_only_once = no
          \t\tcomplete_effect = {
          \t\t\tadd_command_power = -25
          \t\t\tset_country_flag = STP_cw_last_banquet_launched
          \t\t\tadd_timed_idea = { idea = STP_cw_deliberate_offensive days = 21 }
          \t\t\tactivate_mission = STP_cw_last_banquet_window
          \t\t}
          \t\tai_will_do = { base = 10 }
          \t}'''
          decisions = replace_block(decisions, 'STP_cw_launch_last_banquet', primary)
          a, b = block_span(decisions, 'STP_cw_launch_last_banquet')
          extra = '''

          \tSTP_cw_launch_last_banquet_fallback = {
          \t\ticon = generic_prepare_civil_war
          \t\tallowed = { tag = STS }
          \t\tvisible = { has_completed_focus = STP_cw_last_banquet NOT = { controls_state = 3 } NOT = { has_country_flag = STP_cw_last_banquet_launched } }
          \t\tavailable = {
          \t\t\thas_war_with = STP
          \t\t\tNOT = { controls_state = 3 }
          \t\t\tNOT = { has_country_flag = STP_cw_last_banquet_launched }
          \t\t\tNOT = {
          \t\t\t\thas_idea = STP_cw_deliberate_offensive
          \t\t\t\thas_idea = STP_cw_static_defence
          \t\t\t\thas_idea = STP_cw_front_reorganization
          \t\t\t\thas_idea = STP_cw_offensive_preparation
          \t\t\t\thas_idea = STP_cw_defensive_preparation
          \t\t\t}
          \t\t}
          \t\tcustom_cost_text = STP_cw_command_power_35_cost
          \t\tcustom_cost_trigger = { NOT = { command_power < 35 } }
          \t\tcost = 0
          \t\tdays_re_enable = 42
          \t\tfire_only_once = no
          \t\tcomplete_effect = {
          \t\t\tadd_command_power = -35
          \t\t\tset_country_flag = STP_cw_last_banquet_launched
          \t\t\tadd_timed_idea = { idea = STP_cw_deliberate_offensive days = 21 }
          \t\t\tactivate_mission = STP_cw_last_banquet_window
          \t\t}
          \t\tai_will_do = { base = 6 }
          \t}

          \tSTP_cw_last_banquet_window = {
          \t\ticon = generic_prepare_civil_war
          \t\tallowed = { tag = STS }
          \t\tactivation = { always = no }
          \t\tvisible = {
          \t\t\thas_country_flag = STP_cw_last_banquet_launched
          \t\t\tNOT = { has_country_flag = STP_cw_last_banquet_success }
          \t\t\tNOT = { has_country_flag = STP_cw_last_banquet_failed }
          \t\t}
          \t\tavailable = { controls_state = 28 }
          \t\tcancel_trigger = { hidden_trigger = { OR = { NOT = { has_war_with = STP } has_country_flag = STP_cw_postwar } } }
          \t\tdays_mission_timeout = 21
          \t\tis_good = yes
          \t\tselectable_mission = no
          \t\tfire_only_once = yes
          \t\tcomplete_effect = {
          \t\t\tset_country_flag = STP_cw_last_banquet_success
          \t\t\tcustom_effect_tooltip = STP_cw_last_banquet_success_tt
          \t\t\thidden_effect = {
          \t\t\t\tNOD = {
          \t\t\t\t\tif = {
          \t\t\t\t\t\tlimit = { NOT = { has_country_flag = NOD_cw_entered } }
          \t\t\t\t\t\tset_country_flag = NOD_cw_offer_shown
          \t\t\t\t\t\tif = {
          \t\t\t\t\t\t\tlimit = { OR = { has_country_flag = NOD_cw_intervention_approved has_active_mission = NOD_cw_intervention_preparation } }
          \t\t\t\t\t\t\tclr_country_flag = NOD_cw_intervention_ready
          \t\t\t\t\t\t\tclr_country_flag = NOD_cw_intervention_approved
          \t\t\t\t\t\t\tremove_mission = NOD_cw_intervention_preparation
          \t\t\t\t\t\t\tremove_mission = NOD_cw_northern_redeployment
          \t\t\t\t\t\t\tADISCORD_economy_update_postwar_demobilization = yes
          \t\t\t\t\t\t\tADISCORD_economy_mark_dirty = yes
          \t\t\t\t\t\t}
          \t\t\t\t\t}
          \t\t\t\t}
          \t\t\t\tremove_mission = STP_cw_nod_warning
          \t\t\t\tremove_mission = STP_cw_nod_redeployment
          \t\t\t\tclr_country_flag = STP_cw_nod_warning_active
          \t\t\t\tset_country_flag = STP_cw_nod_warning_cancelled
          \t\t\t}
          \t\t}
          \t\ttimeout_effect = {
          \t\t\tset_country_flag = STP_cw_last_banquet_failed
          \t\t\tadd_war_support = -0.10
          \t\t\tcustom_effect_tooltip = STP_cw_last_banquet_failure_tt
          \t\t}
          \t}'''
          decisions = decisions[:b] + extra + decisions[b:]

          incident = get_block(decisions, 'STP_cw_trigger_northern_incident')
          a, b = block_span(decisions, 'STP_cw_trigger_northern_incident')
          accelerate = '''
          \tSTP_cw_accelerate_nodrul_preparation = {
          \t\ticon = generic_political_pressure
          \t\tallowed = { OR = { tag = STP tag = STS } }
          \t\tvisible = {
          \t\t\thas_country_flag = STP_cw_northern_strategy_evidence
          \t\t\thas_active_mission = STP_cw_nod_warning
          \t\t}
          \t\tavailable = { NOD = { has_active_mission = NOD_cw_intervention_preparation } }
          \t\tcost = 35
          \t\tfire_only_once = yes
          \t\tcomplete_effect = {
          \t\t\tadd_days_mission_timeout = { mission = STP_cw_nod_warning days = -10 }
          \t\t\thidden_effect = {
          \t\t\t\tNOD = { add_days_mission_timeout = { mission = NOD_cw_intervention_preparation days = -10 } }
          \t\t\t\tclr_country_flag = STP_cw_northern_strategy_evidence
          \t\t\t}
          \t\t}
          \t\tai_will_do = { base = 0 }
          \t}'''
          decisions = decisions[:b] + '\n' + accelerate + decisions[b:]
          p.write_text(decisions, encoding='utf-8', newline='\n')

          # --- Russian localisation; preserve BOM and one physical line per value -------
          p = ROOT / 'localisation/russian/ADISCORD_STP_l_russian.yml'
          loc = p.read_text(encoding='utf-8-sig')

          def replace_loc(key: str, value: str):
              nonlocal_loc[0], n = re.subn(rf'(?m)^ {re.escape(key)}:.*$', f' {key}: "{value}"', nonlocal_loc[0])
              if n != 1:
                  raise SystemExit(f'expected one localisation key {key}, found {n}')

          nonlocal_loc = [loc]
          replace_loc('STP_cw_delay_election_tt', 'Текущее голосование и сверка полномочий продлятся на §Y80 дней§!. §RПодготовка Нодрула при этом не останавливается§!: её собственный таймер продолжает идти.')
          replace_loc('STP_cw_border_evidence_desc', 'Соберём показания и приказы, позволяющие вмешаться в нодрулский график. Когда Нодрул начнёт подготовку интервенции, эти материалы дадут один выбор: за £pol_power §Y35§! выиграть §G10 дней§! либо намеренно ускорить его готовность на §R10 дней§!, если нам выгодно заставить Нодрул раскрыться раньше. Любой приказ расходует свидетельства.')
          replace_loc('STP_cw_nod_warning_desc', 'Это зеркало реального нодрулского таймера подготовки интервенции. Когда отсчёт закончится, Нодрул сможет вступить на стороне партии, если остальные условия сохраняются. Продление стеландских выборов этот отсчёт не останавливает. Северная война блокирует само вступление, но не готовность; после неё потребуется отдельная переброска. «Пограничные свидетельства» позволяют один раз сдвинуть этот реальный таймер на §G+10§! или §R-10§! дней.')
          replace_loc('STP_cw_last_banquet_desc', 'Штаб готовит один решающий штурм Фады и Бронзового конгресса. После запуска операции у нас будет §Y21 день§!, чтобы взять столичный регион. Контроль Ниансаса позволяет начать по штатному плану за £command_power §Y25§!; без этого плацдарма остаётся аварийный маршрут за £command_power §Y35§!. Провал снизит поддержку войны Шабрата на §R10%§!. Успех закроет ещё не начавшийся маршрут нодрулской интервенции, но уже вступившие войска Нодрула не исчезнут.')

          loc = nonlocal_loc[0]
          anchor = ' STP_cw_command_power_25_cost:'
          m = re.search(r'(?m)^ STP_cw_command_power_25_cost:.*$', loc)
          if not m:
              raise SystemExit('missing command-power 25 localisation')
          loc = loc[:m.end()] + '\n STP_cw_command_power_35_cost: "£command_power §Y35§!"' + loc[m.end():]

          m = re.search(r'(?m)^ STP_cw_trigger_northern_incident_desc:.*$', loc)
          if not m:
              raise SystemExit('missing northern incident localisation')
          nod_loc = '\n STP_cw_accelerate_nodrul_preparation: "Подтолкнуть Нодрул к раннему решению"\n STP_cw_accelerate_nodrul_preparation_desc: "Используем те же пограничные материалы в обратную сторону: создадим впечатление, что окно для вмешательства быстро закрывается. Реальная подготовка Нодрула и наш зеркальный таймер сократятся на §R10 дней§!. Это рискованный выбор для тех случаев, когда раннее раскрытие нодрулских сил выгоднее долгой неопределённости."'
          loc = loc[:m.end()] + nod_loc + loc[m.end():]

          m = re.search(r'(?m)^ STP_cw_last_banquet_desc:.*$', loc)
          if not m:
              raise SystemExit('missing Last Banquet localisation after replacement')
          banquet_loc = '\n STP_cw_launch_last_banquet_fallback: "Последний банкет: без плацдарма"\n STP_cw_launch_last_banquet_fallback_desc: "Ниансас не удержан, поэтому штаб пойдёт к Фаде по аварийному плану. Цена выше, но цель и 21-дневный срок те же."\n STP_cw_last_banquet_window: "Последний банкет: взять Фаду"\n STP_cw_last_banquet_window_desc: "До конца операции захватите Фаду и Бронзовый конгресс. Успех сорвёт ещё не начавшуюся нодрулскую интервенцию; провал снизит поддержку войны на 10%."\n STP_cw_last_banquet_success_tt: "§GФада взята в срок.§! Ещё не начавшаяся нодрулская интервенция будет сорвана."\n STP_cw_last_banquet_failure_tt: "§RОкно операции закрыто.§! Поддержка войны Шабрата снижается на §Y10%§!."'
          loc = loc[:m.end()] + banquet_loc + loc[m.end():]
          p.write_text(loc, encoding='utf-8-sig', newline='\n')

          # --- Keep the development guide aligned with the live loop -------------------
          p = ROOT / 'docs/development/focus-effects.md'
          doc = p.read_text(encoding='utf-8')
          old = '`STP_cw_last_banquet` и `STP_cw_guard_the_pier` открывают приказы в [существующем военном совете](../../common/decisions/ADISCORD_STP_decisions.txt). Само завершение фокуса не включает таймер. За 25 командного ресурса игрок запускает 21-дневное наступление либо 35-дневную оборону; требуются нужная война и контроль соответствующего региона.'
          new = '`STP_cw_last_banquet` открывает одноразовую 21-дневную операцию против Фады: контроль Ниансаса оставляет цену в 25 командного ресурса, без него доступен аварийный запуск за 35. Захват Фады в срок закрывает ещё не начавшийся маршрут нодрулской интервенции; истечение миссии даёт STS -10% поддержки войны. `STP_cw_guard_the_pier` по-прежнему открывает 35-дневную оборону за 25 командного ресурса.'
          if old not in doc:
              raise SystemExit('focus-effects Last Banquet paragraph changed unexpectedly')
          doc = doc.replace(old, new, 1)
          p.write_text(doc, encoding='utf-8', newline='\n')
          PY
      - name: Commit guarded patch and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stp-loop-autofix.yml
          git add common/scripted_effects/ADISCORD_STP_scripted_effects.txt \
                  common/decisions/ADISCORD_STP_decisions.txt \
                  localisation/russian/ADISCORD_STP_l_russian.yml \
                  docs/development/focus-effects.md
          git diff --cached --check
          git commit -m "fix: align Stelander inspection and intervention loop"
          git push origin HEAD:fix/stp-gameplay-loop-20260917
