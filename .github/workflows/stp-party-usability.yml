name: STP party usability verification
on:
  push:
    branches: [codex/stp-party-usability-20260922]
permissions:
  contents: write
concurrency:
  group: stp-party-usability
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check Pillow numpy
      - name: Verify on the current gameplay base
        run: |
          cp .github/stp_party_usability.py /tmp/stp_party_usability.py
          cp .github/stp_party_apply.py /tmp/stp_party_apply.py
          cp .github/stp_party_adjust.py /tmp/stp_party_adjust.py
          python -B - <<'PY'
          from pathlib import Path
          p=Path('/tmp/stp_party_usability.py')
          text=p.read_text()
          old="unlocks = {e.value for e in one(focus, 'completion_reward') if e.key == 'unlock_decision_tooltip'}"
          new="unlocks = {one(e.value, 'decision') if isinstance(e.value, list) else e.value for e in one(focus, 'completion_reward') if e.key == 'unlock_decision_tooltip'}"
          assert text.count(old)==1
          p.write_text(text.replace(old,new))
          p=Path('/tmp/stp_party_apply.py')
          text=p.read_text()
          for name in ('STP_ps_val_intercept','STP_ps_val_pressure'):
              old='unlock_decision_tooltip = '+name
              new='unlock_decision_tooltip = { decision = '+name+' show_effect_tooltip = yes } custom_effect_tooltip = '+name+'_desc'
              assert text.count(old)==1, name
              text=text.replace(old,new)
          p.write_text(text)
          PY
          git fetch --depth=1 origin 457a8e2732363b61b3e0a5ac0a6de690e05887ee
          git checkout --detach 457a8e2732363b61b3e0a5ac0a6de690e05887ee
          python -B - <<'PY'
          from pathlib import Path
          import subprocess, re, json, sys
          modules=['tools.tests.test_adiscord_stp_party_survival','tools.tests.test_adiscord_stp_party_route','tools.tests.test_adiscord_stp_party_balance','tools.tests.test_adiscord_stp_preparation','tools.tests.test_adiscord_stp_civil_war','tools.tests.test_adiscord_stp_gameplay_loop_regressions']
          def run_suite(label):
              r=subprocess.run(['python','-B','-m','unittest',*modules],capture_output=True,text=True)
              output=r.stdout+r.stderr
              Path('/tmp/'+label+'.txt').write_text(output)
              failures=set(re.findall(r'(?m)^(?:FAIL|ERROR): (.*)$',output))
              print(label, json.dumps({'returncode':r.returncode,'failures':sorted(failures),'summary':output[-150:]},ensure_ascii=False),flush=True)
              return failures
          baseline=run_suite('stp-party-baseline')
          subprocess.run(['python','-B','/tmp/stp_party_usability.py'],check=True)
          red=subprocess.run(['python','-B','-m','unittest','tools.tests.test_adiscord_stp_party_survival.PartyUsabilityContracts'],capture_output=True,text=True)
          Path('/tmp/stp-party-red.txt').write_text(red.stdout+red.stderr)
          assert red.returncode != 0 and 'ERROR:' not in red.stderr, red.stderr[-3000:]
          print('EXPECTED_RED',re.findall(r'(?m)^FAIL: (.*)$',red.stderr),flush=True)
          subprocess.run(['python','-B','/tmp/stp_party_apply.py'],check=True)
          subprocess.run(['python','-B','/tmp/stp_party_adjust.py'],check=True)
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['python','-B','-m','unittest','tools.tests.test_adiscord_stp_party_survival.PartyUsabilityContracts','tools.tests.test_adiscord_stp_party_balance.StelanderPartyBalanceContracts.test_party_route_requires_staged_defensive_recovery','-v'],check=True)
          after=run_suite('stp-party-after')
          new=after-baseline
          print('NEW_REGRESSIONS',sorted(new),flush=True)
          print('BASELINE_FAILURES_FIXED',sorted(baseline-after),flush=True)
          if new:
              text=Path('/tmp/stp-party-after.txt').read_text()
              sections=re.split(r'\n={20,}\n',text)
              for section in sections:
                  if any(name in section[:800] for name in new): print(section[:6000])
              sys.exit('New regressions must be resolved.')
          print('PATCH_TESTS_VERIFIED',flush=True)
          PY
      - name: Validate total conversion
        run: |
          python -B tools/validate_tc.py --limit 300 > /tmp/stp-party-validator.txt 2>&1
          tail -n 50 /tmp/stp-party-validator.txt
      - name: Check patch and export gameplay-only branch
        run: |
          git diff --check
          git diff --stat
          python -B - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert paths and all(p.startswith(('common/','events/','localisation/','tools/tests/')) for p in paths), paths
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add common events localisation tools/tests/test_adiscord_stp_party_survival.py tools/tests/test_adiscord_stp_party_route.py
          git commit -m 'fix(stp): streamline party management and supply countermeasures'
          git push origin HEAD:refs/heads/codex/stp-party-usability-final-20260922
          echo DELIVERY_COMMIT=$(git rev-parse HEAD)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stp-party-usability-evidence
          path: /tmp/stp-party-*.txt
          retention-days: 7
