name: STP party usability verification
on:
  push:
    branches: [codex/stp-party-usability-20260922]
permissions:
  contents: read
concurrency:
  group: stp-party-usability
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check Pillow numpy
      - name: Capture existing party baseline
        run: |
          python -B - <<'PY'
          import subprocess, re, json
          from pathlib import Path
          modules = ['tools.tests.test_adiscord_stp_party_survival', 'tools.tests.test_adiscord_stp_party_route', 'tools.tests.test_adiscord_stp_party_balance']
          r = subprocess.run(['python','-B','-m','unittest',*modules],capture_output=True,text=True)
          Path('/tmp/stp-party-baseline.txt').write_text(r.stdout+r.stderr)
          print(json.dumps({'returncode': r.returncode, 'failures': re.findall(r'(?m)^(?:FAIL|ERROR): (.*)$',r.stderr), 'summary':r.stderr[-120:]},ensure_ascii=False))
          PY
      - name: Demonstrate missing behavior
        run: |
          python -B .github/stp_party_usability.py
          python -B - <<'PY'
          import unittest, sys
          suite=unittest.defaultTestLoader.loadTestsFromName('tools.tests.test_adiscord_stp_party_survival.PartyUsabilityContracts')
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          if result.errors:
              sys.exit('Regression tests have errors; fix the tests before implementation.')
          if not result.failures:
              sys.exit('Expected failing behavior was not reproduced.')
          print('EXPECTED_RED_CONFIRMED',len(result.failures))
          PY
