name: Superevent hygiene verification

on:
  push:
    branches:
      - cleanup/superevents-hygiene-20260918

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install focused dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Run hygiene contract
        run: |
          python -m unittest \
            tools.tests.test_validate_adiscord_superevents \
            tools.tests.test_validate_adiscord_vorkerland_collapse.VorkerlandCollapseValidatorTests.test_every_vorkerland_superevent_route_plays_audible_sound \
            -v
