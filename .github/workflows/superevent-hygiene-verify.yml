name: Superevent hygiene verification

on:
  push:
    branches:
      - cleanup/superevents-hygiene-20260918

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Install focused dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Run superevent validators
        run: |
          python tools/validators/validate_adiscord_superevents.py
          python -m tools.validators.validate_adiscord_event_ids
          python tools/validators/validate_adiscord_vorkerland_collapse.py --section superevents

      - name: Run focused regression suite
        run: |
          python -m unittest \
            tools.tests.test_validate_adiscord_superevents \
            tools.tests.test_adiscord_superevents_stp_empire \
            tools.tests.test_validate_adiscord_vorkerland_collapse \
            tools.tests.test_validate_adiscord_vorkerland_story \
            tools.tests.test_validate_adiscord_event_ids -v

      - name: Check Python syntax and stale wiring
        run: |
          python -m py_compile \
            tools/validators/validate_adiscord_superevents.py \
            tools/validators/validate_adiscord_vorkerland_collapse.py \
            tools/validators/validate_tc.py
          test ! -e sound/superevents_soundeffects.asset
          if git grep -n "ADISCORD_vorkerland_play_collapse_superevent_audio" -- ':!docs/**'; then
            echo "dead collapse superevent audio helper remains" >&2
            exit 1
          fi
          if git grep -n "original working route\|deterministic console/runtime" -- events common interface sound tools; then
            echo "implementation-history comment remains in live superevent code" >&2
            exit 1
          fi

      - name: Check diff whitespace
        run: |
          git fetch --depth=20 origin main
          git diff --check origin/main...HEAD

      - name: Remove temporary verifier
        run: |
          rm .github/workflows/superevent-hygiene-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove temporary superevent hygiene verifier"
          git push origin HEAD:cleanup/superevents-hygiene-20260918
