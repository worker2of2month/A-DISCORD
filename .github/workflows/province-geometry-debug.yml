name: Province geometry debug

on:
  push:
    branches:
      - fix/iskhayt-province-debug

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Print Iskhayt province crop
        run: |
          python - <<'PY'
          import csv
          from PIL import Image

          rgb_to_id = {}
          with open("map/definition.csv", encoding="utf-8-sig", newline="") as fh:
              for row in csv.reader(fh, delimiter=";"):
                  if len(row) >= 4 and row[0].isdigit():
                      rgb_to_id[(int(row[1]), int(row[2]), int(row[3]))] = int(row[0])

          aliases = {
              6:"A", 21:"B", 51:"C", 81:"D", 88:"E", 16372:"F", 16646:"G",
              4:"K", 48:"L", 83:"M", 108:"N",
              14:"a", 15:"b", 36:"c", 85:"d", 13029:"e",
              34:"x", 32:"y", 41:"z",
              67:"t", 84:"u", 16631:"v",
              11496:"h", 127:"i", 13493:"j", 144:"p", 103:"q"
          }
          print("LEGEND", " ".join(f"{v}={k}" for k,v in aliases.items()))
          image = Image.open("map/provinces.bmp").convert("RGB")
          px = image.load()
          x0,x1,y0,y1 = 3825,3878,968,1012
          print("X range", x0, x1, "Y range", y0, y1)
          for y in range(y0, y1 + 1):
              row = []
              for x in range(x0, x1 + 1):
                  pid = rgb_to_id.get(px[x,y], -1)
                  row.append(aliases.get(pid, "."))
              print(f"{y:04d} {''.join(row)}")
          PY
