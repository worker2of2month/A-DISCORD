name: Province geometry debug

on:
  push:
    branches:
      - fix/iskhayt-province-debug

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Analyze Iskhayt province geometry
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import csv
          import io
          import re
          import subprocess
          from collections import Counter, defaultdict, deque
          from pathlib import Path
          from PIL import Image

          BASE = "508825b6c4a863a61e5ff7bd114eff16cd271a29"
          target_ids = {4, 6, 14, 15, 21, 36, 48, 51, 81, 83, 85, 88, 108, 13029, 16372, 16646}

          rgb_to_id = {}
          with open("map/definition.csv", encoding="utf-8-sig", newline="") as fh:
              for row in csv.reader(fh, delimiter=";"):
                  if len(row) >= 4 and row[0].isdigit():
                      rgb_to_id[(int(row[1]), int(row[2]), int(row[3]))] = int(row[0])

          province_to_state = {}
          for path in Path("history/states").glob("*.txt"):
              text = path.read_text(encoding="utf-8-sig", errors="replace")
              mid = re.search(r"\bid\s*=\s*(\d+)", text)
              mp = re.search(r"\bprovinces\s*=\s*\{([^}]*)\}", text, re.S)
              if not (mid and mp):
                  continue
              sid = int(mid.group(1))
              for tok in re.findall(r"\d+", mp.group(1)):
                  province_to_state[int(tok)] = sid

          old_bytes = subprocess.check_output(["git", "show", f"{BASE}:map/provinces.bmp"])
          old = Image.open(io.BytesIO(old_bytes)).convert("RGB")
          new = Image.open("map/provinces.bmp").convert("RGB")
          assert old.size == new.size, (old.size, new.size)
          w, h = new.size
          old_px = old.load()
          new_px = new.load()

          transitions = Counter()
          boxes = {}
          changed = 0
          affected_ids = set()
          for y in range(h):
              for x in range(w):
                  a = old_px[x, y]
                  b = new_px[x, y]
                  if a == b:
                      continue
                  changed += 1
                  aid = rgb_to_id.get(a, -1)
                  bid = rgb_to_id.get(b, -1)
                  transitions[(aid, bid)] += 1
                  affected_ids.update((aid, bid))
                  for pid in (aid, bid):
                      if pid < 0:
                          continue
                      if pid not in boxes:
                          boxes[pid] = [x, y, x, y]
                      else:
                          bb = boxes[pid]
                          bb[0] = min(bb[0], x); bb[1] = min(bb[1], y)
                          bb[2] = max(bb[2], x); bb[3] = max(bb[3], y)

          print(f"MAP_SIZE {w}x{h}")
          print(f"CHANGED_PIXELS {changed}")
          print("TOP_TRANSITIONS")
          for (a,b), n in transitions.most_common(30):
              print(f"  {a}(state {province_to_state.get(a)}) -> {b}(state {province_to_state.get(b)}): {n}")

          print("AFFECTED_PROVINCES")
          for pid in sorted(p for p in affected_ids if p >= 0):
              print(f"  province {pid} state {province_to_state.get(pid)} change_bbox={boxes.get(pid)} target={pid in target_ids}")

          # Current geometry: areas, bounding boxes, connected components and adjacency for target provinces.
          id_grid = [-1] * (w*h)
          area = Counter()
          bbox = {}
          for y in range(h):
              for x in range(w):
                  pid = rgb_to_id.get(new_px[x,y], -1)
                  id_grid[y*w+x] = pid
                  if pid in target_ids:
                      area[pid] += 1
                      if pid not in bbox:
                          bbox[pid] = [x,y,x,y]
                      else:
                          bb=bbox[pid]
                          bb[0]=min(bb[0],x); bb[1]=min(bb[1],y); bb[2]=max(bb[2],x); bb[3]=max(bb[3],y)

          adj = defaultdict(Counter)
          for y in range(h):
              row=y*w
              for x in range(w):
                  a=id_grid[row+x]
                  if x+1 < w:
                      b=id_grid[row+x+1]
                      if a != b:
                          if a in target_ids: adj[a][b]+=1
                          if b in target_ids: adj[b][a]+=1
                  if y+1 < h:
                      b=id_grid[row+w+x]
                      if a != b:
                          if a in target_ids: adj[a][b]+=1
                          if b in target_ids: adj[b][a]+=1

          def components(pid):
              bb=bbox.get(pid)
              if not bb: return []
              x0,y0,x1,y1=bb
              seen=set()
              sizes=[]
              for y in range(y0,y1+1):
                  for x in range(x0,x1+1):
                      idx=y*w+x
                      if id_grid[idx] != pid or idx in seen:
                          continue
                      q=[idx]; seen.add(idx); n=0
                      while q:
                          cur=q.pop(); n+=1
                          cx=cur%w; cy=cur//w
                          for dx,dy in ((1,0),(-1,0),(0,1),(0,-1)):
                              nx,ny=cx+dx,cy+dy
                              if nx<x0 or nx>x1 or ny<y0 or ny>y1: continue
                              ni=ny*w+nx
                              if ni not in seen and id_grid[ni]==pid:
                                  seen.add(ni); q.append(ni)
                      sizes.append(n)
              return sorted(sizes, reverse=True)

          print("TARGET_GEOMETRY_CURRENT")
          for pid in sorted(target_ids):
              comps=components(pid)
              neighbours=[(n,c,province_to_state.get(n)) for n,c in adj[pid].most_common(12)]
              print(f"  province {pid} state={province_to_state.get(pid)} area={area.get(pid,0)} bbox={bbox.get(pid)} components={comps[:10]} neighbours={neighbours}")

          # Flag suspicious disconnected provinces globally if a secondary component is nontrivial.
          print("DISCONNECTED_TARGETS")
          for pid in sorted(target_ids):
              comps=components(pid)
              if len(comps)>1:
                  print(f"  {pid}: {comps}")
          PY
