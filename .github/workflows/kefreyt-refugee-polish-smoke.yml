name: Kefreyt refugee polish smoke

on:
  push:
    branches:
      - fix/val-refugee-polish-after-clarity

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Refugee balance
        run: python -B -m unittest tools.tests.test_adiscord_val_refugee_balance
      - name: Refugee admissions
        run: python -B -m unittest tools.tests.test_adiscord_val_refugees.RefugeeAdmissionTests
      - name: Refugee training
        run: python -B -m unittest tools.tests.test_adiscord_val_refugees.RefugeeTrainingTests
      - name: Exact training prices
        run: python -B -m unittest tools.tests.test_adiscord_val_refugees.WastelandCampaignTests.test_custom_training_price_uses_exact_boundaries
      - name: Focus clarity
        run: python -B -m unittest tools.tests.test_adiscord_val_focus_clarity
      - name: Focus layout
        run: python -B -m unittest tools.tests.test_adiscord_val_focus_layout
