name: STP loop verification 2

on:
  push:
    branches:
      - fix/stp-gameplay-loop-20260917

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stp-gameplay-loop-20260917
          fetch-depth: 0
      - name: Apply final guarded normalization
        run: |
          python tools/tmp_stp_loop_verify_patch.py
          git diff --check
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Run STP regression suite
        run: python -m unittest discover -s tools/tests -p 'test_adiscord_stp_*.py'
      - name: Run Shabrat AI validator
        run: python tools/validators/validate_adiscord_stp_shabrat_ai.py
      - name: Run total-conversion validator
        run: python tools/validate_tc.py
      - name: Commit verified tree and remove harness
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stp-loop-verify2.yml tools/tmp_stp_loop_verify_patch.py
          git add common/decisions/ADISCORD_STP_decisions.txt localisation/russian/ADISCORD_STP_l_russian.yml
          git diff --cached --check
          git commit -m "test: verify Stelander gameplay loop"
          git push origin HEAD:fix/stp-gameplay-loop-20260917
