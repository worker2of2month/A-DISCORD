name: STP party QoL verification
on:
  push:
    branches: [codex/stp-party-qol-20260922]
    paths: ['.github/workflows/stp-party-verify.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow numpy
      - name: Validate delta, compare baseline, and publish clean branch
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, re, subprocess, sys, time, zlib
          root=pathlib.Path.cwd()
          out=pathlib.Path('/tmp/stp-party-evidence');out.mkdir()
          base='bee29e55159abf21f0787e0512d81afd16393eb4'
          hashes=['04ce62975291ce48a4eb86beb3dc0e2c3e40dfa33ca077dbdb1322cc3c5c173d','ae0ebfbbd03a33ef7a789d88b9723d454daf0acf98b7ef124e6596246ecc5e06','7614d2d0b64e51d9921e822ebe85b013887bf3bf0eb0283677a5584c4d6c7e92','094685dcc94b1a8b063b29112870dbda29ec2f2060a45760af05e3a5322652e1','0e46ff9bde58379519135726118968f9af7412c4ce095c334987cc5dc1bc8bee','a4ffbc5d609b5243a51b5e4ff250a5aba94ccb04ed1b9229a217e4ec08cee32f','a74e5e6b4b6a1b309417172dcab16e3ae662873cfa0667bcd9fa943d858d607a','8dd179ab34dbb7c9f09eff2cf2615468b569f48b547c29107b55e347cb6fd4eb','ecb8101ef9452eee151cc186f9f5bb371426c39500c1a24fafe80de1e2167942']
          chunks=[]
          for i,expected in enumerate(hashes):
              c=(root/f'.github/stp-delta/{i:02d}.b64').read_text().strip()
              assert hashlib.sha256(c.encode()).hexdigest()==expected, f'delta segment {i} checksum mismatch'
              chunks.append(c)
          data=zlib.decompress(base64.b64decode(''.join(chunks),validate=True))
          assert hashlib.sha256(data).hexdigest()=='9fff48a608b8f064e29be7dc9465c42e6548aae8c3f4e00edca6acc68187fe10'
          delta=json.loads(data)
          paths=[d['path'] for d in delta]
          assert len(paths)==len(set(paths))==11
          subprocess.run(['git','fetch','--depth=1','origin',base],check=True)
          original={}
          for d in delta:
              p=root/d['path']; b=p.read_bytes()
              assert b==subprocess.check_output(['git','show',base+':'+d['path']]),d['path']
              assert hashlib.sha256(b).hexdigest()==d['before'],d['path']
              original[d['path']]=b
          def run(name,args,timeout=240):
              start=time.monotonic(); timed_out=False
              with (out/(name+'.log')).open('w') as log:
                  try: code=subprocess.run(args,stdout=log,stderr=subprocess.STDOUT,timeout=timeout).returncode
                  except subprocess.TimeoutExpired: code=124;timed_out=True
              text=(out/(name+'.log')).read_text(errors='replace')
              failures=re.findall(r'^(?:FAIL|ERROR): (.+)$',text,re.M)
              result={'exit_code':code,'timed_out':timed_out,'seconds':round(time.monotonic()-start,2),'failures':failures,'summary':re.findall(r'^(?:Ran .*|FAILED .*|OK)$',text,re.M)}
              print(name,json.dumps(result),flush=True)
              (out/(name+'.json')).write_text(json.dumps(result,indent=2))
              return result
          py=[sys.executable,'-B']
          broad=py+['-m','unittest','tools.tests.test_adiscord_stp_preparation','tools.tests.test_adiscord_stp_civil_war','tools.tests.test_adiscord_stp_party_route','tools.tests.test_adiscord_stp_party_survival','-v']
          baseline=run('baseline-stp',broad)
          assert not baseline['timed_out']
          for d in delta:
              lines=original[d['path']].decode('utf-8').splitlines(keepends=True)
              rebuilt=''.join(''.join(lines[c[0]:c[1]]) if isinstance(c,list) else c for c in d['chunks']).encode('utf-8')
              assert hashlib.sha256(rebuilt).hexdigest()==d['after'],d['path']
              (root/d['path']).write_bytes(rebuilt)
          actual=subprocess.check_output(['git','diff','--name-only']).decode().splitlines()
          assert set(actual)==set(paths),actual
          subprocess.run(['git','diff','--check'],check=True)
          focused=run('focused',py+['-m','unittest','tools.tests.test_adiscord_stp_party_survival','tools.tests.test_adiscord_stp_party_route.PartyFactionContracts','-v'])
          head=run('head-stp',broad)
          new_failures=sorted(set(head['failures'])-set(baseline['failures']))
          fixed=sorted(set(baseline['failures'])-set(head['failures']))
          validator=run('validate-tc',py+['tools/validate_tc.py','--limit','300'],300)
          full=run('full-suite',py+['-m','unittest','discover','-s','tools/tests','-p','test_*.py','-v'],180)
          summary={'base':base,'paths':paths,'focused':focused,'baseline_stp':baseline,'head_stp':head,'new_stp_failures':new_failures,'fixed_stp_failures':fixed,'validator':validator,'full_suite':full,'native_game_tested':False}
          (out/'summary.json').write_text(json.dumps(summary,indent=2))
          assert focused['exit_code']==0,'focused regressions failed'
          assert not head['timed_out'] and not new_failures, new_failures
          assert validator['exit_code']==0,'total-conversion validator failed'
          env=dict(os.environ,GIT_INDEX_FILE='/tmp/stp-party-clean-index')
          subprocess.run(['git','read-tree',base],env=env,check=True)
          for path in paths:
              blob=subprocess.check_output(['git','hash-object','-w',path]).decode().strip()
              subprocess.run(['git','update-index','--add','--cacheinfo','100644',blob,path],env=env,check=True)
          changed=subprocess.check_output(['git','diff','--cached','--name-only',base],env=env).decode().splitlines()
          assert set(changed)==set(paths)
          tree=subprocess.check_output(['git','write-tree'],env=env).decode().strip()
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          commit=subprocess.check_output(['git','commit-tree',tree,'-p',base],input=b'fix(stp): consolidate party decisions and repair foreign operations\n').decode().strip()
          branch='codex/stp-party-qol-delivery-'+os.environ['GITHUB_RUN_ID']
          subprocess.run(['git','push','origin',commit+':refs/heads/'+branch],check=True)
          summary.update(head=commit,branch=branch,tree=tree)
          (out/'summary.json').write_text(json.dumps(summary,indent=2))
          print('DELIVERY',json.dumps({'head':commit,'branch':branch,'fixed':fixed,'new_failures':new_failures}),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stp-party-evidence
          path: /tmp/stp-party-evidence
          retention-days: 3
