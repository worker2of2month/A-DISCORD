name: Party Nodrul final verification
on:
  push:
    branches: [fix/stp-party-nod-invasion-20260922]
    paths: [.github/workflows/stp-nod-finalize.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow
      - name: Verify registered callback and publish tested source
        shell: bash
        run: |
          python - <<'PY'
          import ast, base64, collections, hashlib, json, pathlib, re, subprocess, zlib
          out = pathlib.Path('/tmp/stp-nod-final')
          out.mkdir()
          summary = {}
          paths = ['common/on_actions/02_ADISCORD_STP_on_actions.txt', 'common/scripted_effects/ADISCORD_STP_scripted_effects.txt', 'events/ADISCORD_STP_events.txt', 'tools/tests/test_adiscord_stp_party_balance.py', 'tools/data/adiscord_event_ids.json']
          summary['baseline_commit'] = subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()
          def run(label, command, timeout=150):
              with (out / (label + '.txt')).open('w') as log:
                  try:
                      code = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT, timeout=timeout).returncode
                  except subprocess.TimeoutExpired:
                      code = 124
                      log.write('\nTIMEOUT=' + str(timeout) + '\n')
              text = (out / (label + '.txt')).read_text()
              summary[label] = {'exit': code, 'failures': re.findall(r'^(?:FAIL|ERROR): .+$', text, re.M), 'tail': text[-1800:]}
              (out / 'summary.json').write_text(json.dumps(summary, indent=2))
              print(label, code, summary[label]['tail'], flush=True)
              return code
          unit = ['python','-B','-m','unittest']
          related = ['tools.tests.test_adiscord_stp_party_balance', 'tools.tests.test_adiscord_stp_party_route', '-v']
          target = ['tools.tests.test_adiscord_stp_party_balance.PartyNodInvasionLifecycleTests', '-v']
          validator = ['python','-B','tools/validate_tc.py','--limit','300']
          assert run('baseline-party', unit + related) == 0
          assert run('baseline-validator', validator) == 0
          # Reuse the exact reviewed patches from the first isolated verification.
          workflow = pathlib.Path('.github/workflows/stp-nod-invasion-check.yml').read_text()
          patches = {}
          hashes = {'tests': 'f250a997a04c015de797b7fe9dd4d45eb152ac39730ba14b49ba239596231301', 'fix': '6c5e79b0129b232a05d48d70c94058af24d0a42d59ad38406bcbb9fdbf7e0d71'}
          for name in ('tests','fix'):
              value = ast.literal_eval(re.search(r'^\s*' + name + r' = (\'.*\')$', workflow, re.M).group(1))
              if name == 'tests':
                  value = value.replace('PuKyojAjW','PuKzoAjW').replace('J8JpiF5g','JtpiF5g')
              else:
                  value = value.replace('BWJIOuVk','BWJZIOuVk')
              patches[name] = zlib.decompress(base64.b64decode(value))
              assert hashlib.sha256(patches[name]).hexdigest() == hashes[name]
              (out / (name + '.patch')).write_bytes(patches[name])
          subprocess.run(['git','apply',str(out / 'tests.patch')], check=True)
          tests = pathlib.Path(paths[3])
          text = tests.read_text()
          footer = 'if __name__ == "__main__":\n    unittest.main()'
          assert text.count(footer) == 1
          text = text.replace(footer + '\n\n\n\n', '', 1)
          assert footer not in text
          text = text.rstrip() + '\n\n\n' + footer + '\n'
          addition = '''    def test_deferred_callback_is_registered_with_its_owner(self):
                  import json

                  registry = json.loads(read(ROOT / "tools/data/adiscord_event_ids.json"))
                  matches = [entry for entry in registry["events"] if entry["id"] == "ADISCORD_STP_pc.33"]
                  self.assertEqual(len(matches), 1)
                  self.assertEqual(matches[0]["owner"], "events/ADISCORD_STP_events.txt")
                  self.assertEqual(matches[0]["status"], "active")

          '''
          marker = '    def test_deferred_callback_is_hidden_and_never_requeues_a_failed_detachment(self):\n'
          assert text.count(marker) == 1
          tests.write_text(text.replace(marker, addition + marker))
          assert run('red', unit + target) == 1
          assert 'FAILED (failures=10)' in (out / 'red.txt').read_text()
          subprocess.run(['git','apply',str(out / 'fix.patch')], check=True)
          registry = pathlib.Path(paths[4])
          text = registry.read_text()
          assert '"ADISCORD_STP_pc.33"' not in text
          entry = '    {"id": "ADISCORD_STP_pc.33", "namespace": "ADISCORD_STP_pc", "number": 33, "owner": "events/ADISCORD_STP_events.txt", "subsystem": "stp_postwar", "status": "active"},\n'
          registry.write_text(text.replace('  "events": [\n','  "events": [\n' + entry, 1))
          assert run('green', unit + target) == 0
          assert run('direct-entrypoint', ['python','-B','-m','tools.tests.test_adiscord_stp_party_balance','PartyNodInvasionLifecycleTests','-v']) == 0
          assert run('after-party', unit + related) == 0
          assert run('after-validator', validator) == 0
          # Diagnostics retain their content and multiplicity. Source positions move
          # because the callback and reconciliation helper precede existing code.
          def diagnostics(name):
              text = (out / (name + '.txt')).read_text()
              return collections.Counter(re.sub(r'(\.(?:txt|yml|py|json)):\d+', r'\1:LINE', text).splitlines())
          before, after = diagnostics('baseline-validator'), diagnostics('after-validator')
          summary['new_diagnostics'] = list((after-before).elements())
          summary['removed_diagnostics'] = list((before-after).elements())
          assert before == after, summary['new_diagnostics']
          run('full-suite', unit + ['discover','-s','tools/tests','-p','test*.py','-v'], timeout=120)
          subprocess.run(['git','diff','--check'], check=True)
          for path in paths[:3]:
              assert not pathlib.Path(path).read_bytes().startswith(b'\xef\xbb\xbf'), path
          (out / 'change.patch').write_bytes(subprocess.check_output(['git','diff','--'] + paths))
          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add','--'] + paths, check=True)
          subprocess.run(['git','commit','-m','fix(stp): sever party alliance before Nodrul invasion'], check=True)
          summary['commit'] = subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()
          summary['blobs'] = {path: subprocess.check_output(['git','rev-parse','HEAD:' + path]).decode().strip() for path in paths}
          summary['runtime'] = 'No Hearts of Iron IV runtime test. Authored branches, callbacks and static validators only.'
          (out / 'summary.json').write_text(json.dumps(summary, indent=2))
          subprocess.run(['git','push','origin','HEAD:fix/stp-party-nod-invasion-20260922'], check=True)
          print(json.dumps({key: summary[key] for key in ['commit','blobs','runtime']}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stp-party-nod-final-evidence
          path: /tmp/stp-nod-final
          retention-days: 7
