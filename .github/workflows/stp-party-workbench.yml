name: STP party workbench
on:
  push:
    branches: [agent/stp-party-rework-20260919]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependencies
        run: python -m pip install pillow numpy
      - name: Select current main and decode reviewed patch
        shell: bash
        run: |
          mkdir -p /tmp/party-result
          cp .github/stp-party-verify.py /tmp/stp-party-verify.py
          cat .github/stp-party-patch.1 .github/stp-party-patch.2 > /tmp/party.patch.xz
          python - <<'PY'
          import lzma, hashlib
          from pathlib import Path
          patch=lzma.decompress(Path('/tmp/party.patch.xz').read_bytes())
          assert hashlib.sha256(patch).hexdigest() == 'd3c5f6f9e2763ae2bef5d3db01ca2daff1c45f331353a5ad64cf97b51e56aa34'
          Path('/tmp/party.patch').write_bytes(patch)
          PY
          git fetch origin main --depth=20
          git switch --detach FETCH_HEAD
          git rev-parse HEAD > /tmp/party-result/base-sha.txt
          git diff d6cc3c77078a25f7318fbf7e371fc6779eab3351 HEAD --binary > /tmp/party-result/concurrent-main.patch
      - name: Establish full-checkout baseline
        run: python -B /tmp/stp-party-verify.py baseline
      - name: Apply party changes without replacing concurrent work
        shell: bash
        run: |
          git apply --3way /tmp/party.patch
          git diff --check HEAD
          git diff --cached --check
      - name: Verify new party contracts
        shell: bash
        run: python -B -m unittest tools.tests.test_adiscord_stp_party_route -v > /tmp/party-result/party-contracts.txt 2>&1
      - name: Verify candidate against current main
        shell: bash
        run: |
          python -B /tmp/stp-party-verify.py candidate
          python -B /tmp/stp-party-verify.py gate
      - name: Publish candidate for final review
        shell: bash
        run: |
          git config user.name 'A-Discord automation'
          git config user.email '81386071+worker2of2month@users.noreply.github.com'
          git diff --name-only -z HEAD | xargs -0 git add --
          git diff --cached --check
          git commit -m 'Rework Stelander party campaign and side-aware tooltips'
          git rev-parse HEAD > /tmp/party-result/candidate-sha.txt
          git diff --stat HEAD^ HEAD > /tmp/party-result/change-stat.txt
          git show --format=fuller --binary HEAD > /tmp/party-result/commit.patch
          git push origin "HEAD:refs/heads/agent/stp-party-candidate-${GITHUB_RUN_ID}"
      - name: Collect review evidence
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/party-result
          git status --short > /tmp/party-result/status.txt
          git diff HEAD --binary > /tmp/party-result/working.patch
          python - <<'PY'
          import subprocess,zipfile
          from pathlib import Path
          files=subprocess.check_output(['git','diff','--name-only','d6cc3c77078a25f7318fbf7e371fc6779eab3351'],text=True).splitlines()
          with zipfile.ZipFile('/tmp/party-result/changed-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in files:
                  p=Path(name)
                  if p.is_file() and not name.startswith('.github/'):
                      z.write(p,name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stp-party-candidate-review
          path: /tmp/party-result/
          retention-days: 2
