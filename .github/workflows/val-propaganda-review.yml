name: Kefreyt integration review
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/val-propaganda-review-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Inspect the requested integration
        run: |
          git fetch --no-tags --filter=blob:none --depth=160 origin main fix/val-contract-flow-focus-value
          git switch --detach b1d71d5228698179f9a9f8310b400981f1cc0a5b
          git config user.name 'A-Discord integration'
          git config user.email '81386071+worker2of2month@users.noreply.github.com'
          mkdir -p /tmp/val-integration
          git rev-parse HEAD origin/main > /tmp/val-integration/refs.txt
          git merge-base HEAD origin/main > /tmp/val-integration/base.txt
          git diff $(git merge-base HEAD origin/main)..HEAD > /tmp/val-integration/pr40.diff
          git diff $(git merge-base HEAD origin/main)..origin/main > /tmp/val-integration/main.diff
          git merge --no-commit --no-ff origin/main > /tmp/val-integration/merge.log 2>&1 || test -n "$(git ls-files -u)"
          python - <<'PY'
          from pathlib import Path
          import subprocess, zipfile, json
          out = Path('/tmp/val-integration')
          def git(*args):
              return subprocess.check_output(['git', *args])
          conflicts = git('diff','--name-only','--diff-filter=U').decode().splitlines()
          (out/'conflicts.json').write_text(json.dumps(conflicts, indent=2))
          for name in conflicts:
              for stage, label in [('1','base'),('2','pr40'),('3','main')]:
                  p = out/'conflicts'/label/name
                  p.parent.mkdir(parents=True, exist_ok=True)
                  try: p.write_bytes(git('show', ':'+stage+':'+name))
                  except subprocess.CalledProcessError: pass
          with zipfile.ZipFile('/tmp/val-integration-review.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in out.rglob('*'):
                  if p.is_file(): z.write(p,p.relative_to(out))
              for directory in ['common','events','history','localisation','tools','docs','interface','country_metadata']:
                  for p in Path(directory).rglob('*'):
                      if p.is_file() and p.suffix.lower() in {'.txt','.yml','.yaml','.json','.py','.md','.gui','.gfx','.csv'}:
                          z.write(p,'checkout/'+str(p))
              for name in ['AGENTS.md','descriptor.mod']:
                  z.write(name,'checkout/'+name)
          print('Conflicts:', conflicts)
          print((out/'merge.log').read_text())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: val-integration-review
          path: /tmp/val-integration-review.zip
          retention-days: 3
