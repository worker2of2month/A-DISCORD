name: Kefreyt reclamation and expansion review
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/val-propaganda-review-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare isolated baseline and tests
        run: |
          mkdir -p /tmp/val-followup
          cp .github/val_followup_apply.py /tmp/val-followup/apply.py
          cp .github/val_followup_tests.txt /tmp/val-followup/tests.txt
          python -m pip install pillow numpy pyyaml
          git fetch --no-tags --depth=1 origin d21917074259b4f29c8fe36ec20773aeb7ce2e45
          git switch --detach d21917074259b4f29c8fe36ec20773aeb7ce2e45
          git config user.name 'A-Discord integration'
          git config user.email '81386071+worker2of2month@users.noreply.github.com'
          timeout 100 python -B -m unittest tools.tests.test_validate_adiscord_val_rework -v > /tmp/val-followup/baseline-expanded.log 2>&1 || echo "Baseline exit: $?"
          python - <<'PY'
          from pathlib import Path
          import ast,subprocess,sys
          p=Path('tools/tests/test_val_contract_ui.py')
          text=p.read_text()
          marker='\nif __name__ == "__main__":'
          assert marker in text and 'class TestValReclamationCompletion' not in text
          text=text.replace(marker,Path('/tmp/val-followup/tests.txt').read_text()+marker)
          ast.parse(text)
          p.write_text(text)
          with open('/tmp/val-followup/red.log','w') as log:
              r=subprocess.run([sys.executable,'-B','-m','unittest','tools.tests.test_val_contract_ui.TestValReclamationCompletion','tools.tests.test_val_contract_ui.TestValExpansionRoute','-v'],stdout=log,stderr=subprocess.STDOUT)
          assert r.returncode != 0
          assert 'FAILED (failures=6)' in Path('/tmp/val-followup/red.log').read_text()
          PY
      - name: Apply patch and require focused checks
        run: |
          python -B /tmp/val-followup/apply.py
          python -B -m unittest tools.tests.test_val_contract_ui -v > /tmp/val-followup/green.log 2>&1
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess,re
          from tools.validators.validate_adiscord_division_templates import parse_clausewitz
          expected={
            'common/national_focus/ADISCORD_national_focus_VAL.txt':'ad0e2a6192f013b4d0cf5f4d727f6442c53ef33c0e4779edcac14a37480730be',
            'common/on_actions/02_ADISCORD_VAL_rework_on_actions.txt':'0ec357ef66e5aec0e7b2e24461b97f6177f0cdd0c65de64f79305a1bde60d3e7',
            'common/scripted_effects/ADISCORD_VAL_effects.txt':'a641b590e13c0640a4dce3d0de662f68f88f8cac0fdf34bbd51e4b797ba47863',
            'common/scripted_triggers/ADISCORD_VAL_rework_triggers.txt':'7837d493325b5cec76fde61df340f6a419d46da1719c2d52490426551ab181f5',
            'localisation/english/ADISCORD_VAL_decisions_l_english.yml':'e815f39cf4f0d6e13dc6ba31c905327229a7438a96399b7ab744708f320f8258',
            'localisation/english/ADISCORD_ideas_l_english.yml':'225db45594b6c60fb57d27a3c8697dfeac3394043eb3d8153a34eb9ddc673b1b',
            'localisation/russian/ADISCORD_VAL_decisions_l_russian.yml':'c0a92022b3c6503720ad1ea6b6ff80036947aa23c48b613653aaf590fc571885',
            'localisation/russian/ADISCORD_ideas_l_russian.yml':'74985107664e0db6a11a95f5c9ef901c94b82e6d9d5dd67e751e6b98bb510f81',
            'tools/tests/test_val_contract_ui.py':'33a3e34699a2a7dcca03837e742568622c43c44d91fa345c00d1689e083c3f31'}
          actual=subprocess.check_output(['git','diff','--name-only']).decode().splitlines()
          assert set(actual)==set(expected),actual
          for name,digest in expected.items():
              raw=Path(name).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==digest,(name,hashlib.sha256(raw).hexdigest())
              assert not re.search(rb'(?m)^(?:<<<<<<<|=======|>>>>>>>)',raw),name
              if name.endswith('.txt'):
                  assert not raw.startswith(b'\xef\xbb\xbf'),name
                  parse_clausewitz(raw.decode('utf-8'))
              if name.endswith('.yml'):
                  assert raw.startswith(b'\xef\xbb\xbf'),name
                  keys=re.findall(r'(?m)^\s*([\w.-]+):(?:\d+)?\s*".*"\s*$',raw.decode('utf-8-sig'))
                  assert len(keys)==len(set(keys)),name
          Path('/tmp/val-followup/hashes.json').write_text(json.dumps(expected,indent=2))
          subprocess.run(['git','diff','--check'],check=True)
          print('24 scoped tests pass; exact nine-file hashes, script structure and encodings verified.')
          PY
      - name: Check broader regressions and project validator
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess,sys,json,re
          out=Path('/tmp/val-followup');reports={}
          for name,command,limit in [
              ('expanded',[sys.executable,'-B','-m','unittest','tools.tests.test_validate_adiscord_val_rework','-v'],100),
              ('full-suite',[sys.executable,'-B','-m','unittest','discover','-s','tools/tests','-p','test_*.py','-v'],60),
              ('validator',[sys.executable,'-B','tools/validate_tc.py','--limit','300'],180)]:
              with (out/(name+'.log')).open('w') as log:
                  try: code=subprocess.run(command,stdout=log,stderr=subprocess.STDOUT,timeout=limit).returncode
                  except subprocess.TimeoutExpired:
                      code=124;log.write('\nTIMEOUT after '+str(limit)+' seconds\n')
              text=(out/(name+'.log')).read_text()
              reports[name]={'returncode':code,'failures':re.findall(r'(?m)^(?:FAIL|ERROR): (.+)$',text),'tail':text.splitlines()[-5:]}
              print(name,json.dumps(reports[name]))
          baseline=set(re.findall(r'(?m)^(?:FAIL|ERROR): (.+)$',(out/'baseline-expanded.log').read_text()))
          reports['new_expanded_failures']=sorted(set(reports['expanded']['failures'])-baseline)
          (out/'reports.json').write_text(json.dumps(reports,indent=2))
          assert reports['expanded']['returncode']!=124
          assert not reports['new_expanded_failures'],reports['new_expanded_failures']
          assert reports['validator']['returncode']==0
          PY
      - name: Publish gameplay-only follow-up
        run: |
          git diff > /tmp/val-followup/delivery.diff
          python - <<'PY'
          from pathlib import Path
          import json,subprocess
          names=list(json.loads(Path('/tmp/val-followup/hashes.json').read_text()))
          subprocess.run(['git','add','--',*names],check=True)
          PY
          git commit -m 'fix(val): expose northern expansion and retire ash penalties after full reclamation'
          git rev-parse HEAD > /tmp/val-followup/head.txt
          branch=fix/val-expansion-reclamation-${GITHUB_RUN_ID}
          echo "$branch" > /tmp/val-followup/branch.txt
          git push origin HEAD:refs/heads/$branch
      - name: Export evidence
        if: always()
        run: |
          git diff > /tmp/val-followup/remaining.diff
          python - <<'PY'
          from pathlib import Path
          import zipfile,json
          out=Path('/tmp/val-followup')
          with zipfile.ZipFile('/tmp/val-followup.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in out.rglob('*'):
                  if p.is_file():z.write(p,p.relative_to(out))
              if (out/'hashes.json').exists():
                  for name in json.loads((out/'hashes.json').read_text()):z.write(name,'source/'+name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: val-followup
          path: /tmp/val-followup.zip
          retention-days: 7
