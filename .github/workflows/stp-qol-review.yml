name: Stelander QoL final verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: stp-qol-final-review
  cancel-in-progress: true
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/stp-qol-review-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and export gameplay-only changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, textwrap
          template = '763e34c2bc08c0dcb940d9a1342d72c17dcf9194'
          subprocess.run(['git', 'fetch', '--depth=1', 'origin', template], check=True)
          workflow = subprocess.check_output(['git', 'show', template + ':.github/workflows/stp-qol-review.yml']).decode()
          lines = workflow.splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          source = textwrap.dedent('\n'.join(lines[start:end]))
          def change(old, new):
              global source
              assert source.count(old) == 1, (old[:100], source.count(old))
              source = source.replace(old, new, 1)
          base = subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip()
          change("base = 'e0511cbc69ce2e02d1304f03e7860bc23180dabe'", 'base = ' + repr(base))
          change('paths = [F, E, EV, D, SL, MENU, RU, EN, T]', "UI = 'interface/ADISCORD_STP_regions.gui'\nGT = 'tools/tests/test_validate_adiscord_gui_contracts.py'\npaths = [F, E, EV, D, SL, MENU, RU, EN, T, UI, GT]")
          scopes = ['tools.tests.test_adiscord_stp_preparation', 'tools.tests.test_adiscord_stp_regions', 'tools.tests.test_adiscord_stp_gameplay_loop_regressions', 'tools.tests.test_validate_adiscord_gui_contracts']
          change("baseline = run('baseline', ['discover', '-s', 'tools/tests', '-p', 'test_*.py'])", 'baseline = run(\'baseline\', ' + repr(scopes) + ', timeout=240)')
          change('self.assertIn("has_country_flag = STP_cw_show_preparation_details", loc)', 'self.assertNotIn("has_country_flag = STP_cw_show_preparation_details", loc)')
          a = source.index('    decision = block(block(entries("common/decisions/ADISCORD_STP_decisions.txt"), "STP_battle_for_stelander"), "STP_cw_toggle_preparation_details")')
          b = source.index('    for language in ("russian", "english"):', a)
          source = source[:a] + '''    gui = (ROOT / "interface/ADISCORD_STP_regions.gui").read_text(encoding="utf-8-sig")
              self.assertIn('pdx_tooltip = "STP_cw_preparation_full_report"', gui)
              self.assertNotIn("STP_cw_toggle_preparation_details", (ROOT / "common/decisions/ADISCORD_STP_decisions.txt").read_text(encoding="utf-8-sig"))
          '''.replace('\n    ', '\n') + source[b:]
          change('"STP_cw_toggle_preparation_details", "STP_cw_toggle_preparation_details_desc"):', '"STP_cw_delay_inspection_desc", "STP_inspection_delay_result_tt"):')
          a = source.index("toggle = '''")
          b = source.index('write(MENU,', a)
          source = source[:a] + '''write(UI, replace_once(read(UI), 'pdx_tooltip = "STP_regions_panel_tt"', 'pdx_tooltip = "STP_cw_preparation_full_report"'))
          write(SL, read(SL) + '\\n\\ndefined_text = {\\n\\tname = STPGetPreparationBriefing\\n\\ttext = { localization_key = STP_cw_preparation_short_report }\\n}\\n')
          ''' + source[b:]
          a = source.index('# Keep original reports verbatim behind the toggle')
          bridge = r'''
          ru['STP_startup_quick_start'] = r'§YС ЧЕГО НАЧАТЬ§!\n\nПройдите вводные фокусы. На встрече после ухудшения здоровья Иванова выберите Шабрата или партию; справка сама курс не выбирает.\n\n§YШабрат: первый округ.§! Откройте карту подготовки в решениях. Укрепите сеть, привлеките администрацию и проверьте прогноз перехода округа. Обычно администрации нужен 21 день работы; особые условия показаны на карте. Одного перевеса влияния недостаточно.\n\n§YПартия.§! Следите за верностью аппарата и указанной целью подполья. Готовьте ответ и гарнизоны; пустая проверка может помочь противнику.\n\n§YПеред операцией§! проверьте цену, свободную ячейку, срок и ближайшую угрозу. Запланированным частям нужны люди и оружие. Полный план армии — при наведении на заголовок карты.\n\n§YЗатягивание комиссии§! действует с запуска фокуса. Если таймер ещё не начался, отсрочка сохранится до его появления.\n\nИстория страны остаётся в справке; направления кампании — на вкладке путей.'
          en['STP_startup_quick_start'] = r'§YGETTING STARTED§!\n\nComplete the introductory focuses. Choose Shabrat or the Party at the meeting after Ivanov falls ill. Reading the guide does not select a route.\n\n§YShabrat: your first district.§! Open the preparation map in Decisions. Build the network, recruit the administration and check the transfer forecast. An ordinary administration needs 21 days; special conditions appear on the map. An influence lead alone is not enough.\n\n§YThe Party.§! Watch apparatus loyalty and the announced underground target. Prepare a response and garrisons; an empty search can help your opponent.\n\n§YBefore an operation§!, check the price, free preparation slot, duration and nearest threat. Planned formations still need manpower and equipment. Hover over the map title for the full army plan.\n\n§YDelaying the commission§! works when the focus starts. If its timer is not running yet, the extension is saved until activation.\n\nCountry history remains in the guide; campaign directions are in the paths tab.'
          ru['STP_cw_preparation_short_report'] = r'[STPGetPreparationInstructions]\n\n§YГотовые оплаченные усиленные дивизии:§! [?STP_cw_prepared_assault_divisions|0].[STPGetKefreytArmyCommitment]\n§YОбщий резерв:§! £manpower_texticon [?manpower|0]; £infantry_equipment_texticon [?num_equipment@infantry_equipment|0].\n\nПлан ещё не означает готовую армию: состав ограничен ресурсами и зависит от выборов. Подробности — §Yпри наведении на заголовок карты§!.\n\n§YНодрул:§! [STPGetNodStatus]'
          en['STP_cw_preparation_short_report'] = r'[STPGetPreparationInstructions]\n\n§YReady, paid reinforced divisions:§! [?STP_cw_prepared_assault_divisions|0].[STPGetKefreytArmyCommitment]\n§YShared reserve:§! £manpower_texticon [?manpower|0]; £infantry_equipment_texticon [?num_equipment@infantry_equipment|0].\n\nPlans are not a deployed army: formations are limited by resources and the election result. §YHover over the map title§! for details.\n\n§YNodrul:§! [STPGetNodStatus]'
          ru['STP_cw_delay_inspection_desc'] = r'§YПри нажатии§! сразу продлевает текущую комиссию выбранного округа на §G14 дней§!. Цена: £political_power_texticon §Y35§!; одна ячейка подготовки занята §Y14 дней§!.\n\nЭто срок работы штаба, а не ожидание отсрочки. Повторная операция доступна через §Y60 дней§!. Завершение не продлевает комиссию ещё раз. Если комиссия исчезла до применения, политическая власть возвращается.'
          en['STP_cw_delay_inspection_desc'] = r'§YOn click§!, immediately extends the selected district\'s current inspection by §G14 days§!. Cost: £political_power_texticon §Y35§!; one preparation slot is occupied for §Y14 days§!.\n\nThat is the staff-work duration, not a wait for the extension. The operation can be repeated after §Y60 days§!. Completion grants no second extension. If the inspection has disappeared before application, political power is refunded.'
          ru['STP_inspection_delay_result_tt'] = 'Текущая комиссия выбранного округа: §G+14 дней сразу§!. Одна ячейка подготовки занята на §Y14 дней§!.'
          en['STP_inspection_delay_result_tt'] = 'Selected district inspection: §G+14 days immediately§!. One preparation slot is occupied for §Y14 days§!.'
          for mapping in (ru, en):
              mapping.pop('STP_cw_toggle_preparation_details')
              mapping.pop('STP_cw_toggle_preparation_details_desc')
              assert len(mapping['STP_startup_quick_start'].replace('\\n', '\n')) <= 1200
          # Clear only unconsumed timer extensions at the preparation boundary.
          write(E, replace_once(read(E), 'STP_end_battle_for_stelander = {', 'STP_end_battle_for_stelander = {\n\tclr_country_flag = STP_cw_election_delay_pending\n\tclr_country_flag = STP_cw_credentials_delay_pending'))
          # Keep startup routing checks aligned with every actual page, not just the first.
          g = read(GT)
          g = replace_once(g, "cases = [(0, 0, 0, f'{tag}_startup_country')]", "cases = [(0, 0, 0, 'STP_startup_quick_start' if tag == 'STP' else 'VAL_startup_country')]")
          old = "cases += [(1, i, 0, f'ADISCORD_startup_guide_{topic}')\n                      for i, topic in enumerate(('budget', 'army', 'diplomacy'))]"
          new = "guide_keys = (('STP_startup_guide_history', 'STP_startup_guide_nodrul', 'STP_startup_guide_party') if tag == 'STP' else ('ADISCORD_startup_guide_budget', 'ADISCORD_startup_guide_army', 'ADISCORD_startup_guide_diplomacy'))\n            cases += [(1, i, 0, key) for i, key in enumerate(guide_keys)]"
          g = replace_once(g, old, new)
          write(GT, g)
          '''
          source = source[:a] + textwrap.dedent(bridge) + '\n' + source[a:]
          change("'STP_cw_preparation_full_report': report", "'STP_cw_preparation_full_report': r'$STP_regions_panel_tt$\\n\\n' + report")
          change("final = run('full-suite', ['discover', '-s', 'tools/tests', '-p', 'test_*.py'])", 'final = run(\'targeted-suite\', ' + repr(scopes) + ', timeout=240)\nfull = run(\'full-suite\', [\'discover\', \'-s\', \'tools/tests\', \'-p\', \'test_*.py\'], timeout=90)')
          change("'files': paths, 'native_game_tested': False}", "'files': paths, 'native_game_tested': False, 'full_suite': full}")
          change("validator = subprocess.run([sys.executable, '-B', 'tools/validate_tc.py', '--limit', '300'], stdout=out, stderr=subprocess.STDOUT)", "try:\n        validator = subprocess.run([sys.executable, '-B', 'tools/validate_tc.py', '--limit', '300'], stdout=out, stderr=subprocess.STDOUT, timeout=90)\n    except subprocess.TimeoutExpired:\n        validator = subprocess.CompletedProcess([], 124)\n        out.write('\\nVALIDATOR TIMED OUT\\n')")
          change("branch = 'codex/stp-qol-delivery-'", "branch = 'codex/stp-qol-final-'")
          evidence = Path('/tmp/stp-qol')
          evidence.mkdir(exist_ok=True)
          (evidence / 'apply.py').write_text(source)
          compile(source, 'stp-qol-apply.py', 'exec')
          exec(compile(source, 'stp-qol-apply.py', 'exec'), {'__name__': '__main__'})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stp-qol-final-evidence
          path: /tmp/stp-qol/
          retention-days: 7
