name: Stelander QoL delivery verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: stp-qol-final-review
  cancel-in-progress: true
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/stp-qol-review-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image-validation dependencies
        run: python -m pip install pillow numpy
      - name: Verify and export gameplay-only changes
        run: |
          python - <<'PY'
          import base64, hashlib, re, subprocess, zlib
          from pathlib import Path
          transport = '15a3580946e764305cc00aed60fada4e49f68b9e'
          subprocess.run(['git', 'fetch', '--depth=1', 'origin', transport], check=True)
          source = subprocess.check_output(['git', 'show', transport + ':.github/workflows/stp-qol-review.yml']).decode()
          encoded = re.search(r"(?m)^\s*encoded = '([^']+)'", source).group(1)
          for old, new in (('IQPcN0Itg', 'IQPcNtg'), ('G4cxHgwkokg', 'G4cxHkokg'), ('SYUWc2/b9Ucp1', 'SYUWc2/b9UAp1')):
              assert encoded.count(old) == 1, old
              encoded = encoded.replace(old, new, 1)
          raw = zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(raw).hexdigest() == '358b5e26d941e71340a7b11191d922dea25a620e82141c1125650a244f9573c4'
          folder = Path('/tmp/stp-qol-final')
          folder.mkdir(exist_ok=True)
          (folder / 'apply.py').write_bytes(raw)
          compile(raw, 'stp-qol-apply.py', 'exec')
          exec(compile(raw, 'stp-qol-apply.py', 'exec'), {'__name__': '__main__'})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stp-qol-final-evidence
          path: /tmp/stp-qol-final/
          retention-days: 7
