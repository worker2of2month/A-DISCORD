name: Kefreyt clarity final smoke

on:
  push:
    branches:
      - rework/val-focus-tree-clarity

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Focus clarity regression
        run: python -B -m unittest tools.tests.test_adiscord_val_focus_clarity
      - name: Refugee balance regression
        run: python -B -m unittest tools.tests.test_adiscord_val_refugee_balance
      - name: Refugee admission regression
        run: python -B -m unittest tools.tests.test_adiscord_val_refugees.RefugeeAdmissionTests
      - name: Refugee training regression
        run: python -B -m unittest tools.tests.test_adiscord_val_refugees.RefugeeTrainingTests
      - name: Refugee training cost contract
        run: python -B -m unittest tools.tests.test_adiscord_val_refugees.WastelandCampaignTests.test_custom_training_price_uses_exact_boundaries
      - name: Focus layout contract
        run: python -B -m unittest tools.tests.test_validate_adiscord_val_rework.ValExpandedCampaignTests.test_resource_war_focus_visibility_follows_the_war_without_hiding_irem
      - name: Scripted peace bus
        run: python -B -m unittest tools.tests.test_scripted_peace_on_actions
