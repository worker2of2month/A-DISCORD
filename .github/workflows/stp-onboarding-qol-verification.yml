name: STP onboarding QoL verification

on:
  push:
    branches:
      - codex/stp-onboarding-qol-20260922

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run QoL regression contracts
        run: |
          python -B -m unittest -v \
            tools.tests.test_adiscord_stp_preparation.StelanderPreparationTests.test_shabrat_delay_applies_as_soon_as_the_focus_is_selected \
            tools.tests.test_adiscord_stp_preparation.StelanderPreparationTests.test_stelander_preparation_copy_prioritises_actions_over_army_ledger \
            tools.tests.test_adiscord_stp_civil_war.CivilWarContracts.test_category_army_forecast_tracks_preparation_and_asset_loss \
            tools.tests.test_adiscord_stp_party_route.PartyRouteContracts.test_map_instructions_switch_without_exposing_the_army_ledger
      - name: Run total-conversion validator
        if: always()
        run: python -B tools/validate_tc.py --limit 300
