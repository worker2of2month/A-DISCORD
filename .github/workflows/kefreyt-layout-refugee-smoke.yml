name: Kefreyt layout refugee smoke

on:
  push:
    branches:
      - rework/val-focus-layout-and-refugees

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Focus layout and war tooltips
        run: python -B -m unittest tools.tests.test_adiscord_val_focus_layout
      - name: Refugee admissions
        run: python -B -m unittest tools.tests.test_adiscord_val_refugees.RefugeeAdmissionTests
      - name: Refugee training and housing
        run: python -B -m unittest tools.tests.test_adiscord_val_refugees.RefugeeTrainingTests
      - name: Southern Tsaygen
        run: python -B -m unittest tools.tests.test_adiscord_val_southern_tsaygen
      - name: Bezhaysk peace
        run: python -B -m unittest tools.tests.test_adiscord_bezhaysk_peace
      - name: Scripted peace bus
        run: python -B -m unittest tools.tests.test_scripted_peace_on_actions
