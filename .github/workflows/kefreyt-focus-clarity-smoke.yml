name: Kefreyt focus clarity smoke

on:
  push:
    branches:
      - rework/val-focus-tree-clarity

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Focus clarity regression
        run: python -B -m unittest tools.tests.test_adiscord_val_focus_clarity
      - name: Refugee balance regression
        run: python -B -m unittest tools.tests.test_adiscord_val_refugee_balance
      - name: Refugee system regression
        run: python -B -m unittest tools.tests.test_adiscord_val_refugees
      - name: Focus layout contract
        run: python -B -m unittest tools.tests.test_val_contract_ui.TestValExpansionRoute.test_expansion_is_split_into_early_war_bands_and_late_continuation
      - name: Scripted peace bus
        run: python -B -m unittest tools.tests.test_scripted_peace_on_actions
