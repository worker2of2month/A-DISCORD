name: Kefreyt focus clarity smoke

on:
  push:
    branches:
      - rework/val-focus-tree-clarity

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Focus clarity
        run: python -B -m unittest tools.tests.test_adiscord_val_focus_clarity
      - name: Refugee balance
        run: python -B -m unittest tools.tests.test_adiscord_val_refugee_balance
      - name: Refugee system
        run: python -B -m unittest tools.tests.test_adiscord_val_refugees
      - name: Southern Tsaygen
        run: python -B -m unittest tools.tests.test_adiscord_val_southern_tsaygen
      - name: Scripted peace
        run: python -B -m unittest tools.tests.test_scripted_peace_on_actions
      - name: Northern route regression
        run: python -B -m unittest tools.tests.test_adiscord_economy_rebalance.NorthernCampaignRouteTests
