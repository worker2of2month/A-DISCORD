name: Repository code style audit
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: repository-code-style-final
  cancel-in-progress: false
jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/code-style-audit-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare current main without replacing concurrent changes
        run: |
          python -m pip install black==25.1.0 pillow numpy scipy
          git fetch --depth=4 origin main codex/repository-code-style-36559131384
          git fetch --depth=1 origin a233bbde756fc78bac28fe1e675658ed79523ff2 675cc0d50e4b750f3a9fc55f8e511be2dbf9130d
          git worktree add --detach /tmp/code-style-current origin/main
          git worktree add --detach /tmp/code-style-before origin/main
          cp -a .superpowers/code-style-audit /tmp/code-style-tools
          mkdir /tmp/code-style-final
          git diff a233bbde756fc78bac28fe1e675658ed79523ff2 675cc0d50e4b750f3a9fc55f8e511be2dbf9130d -- . ':(exclude)localisation' > /tmp/code-style-final/style.patch
      - name: Apply and verify style-only changes on latest main
        run: |
          python -B - <<'PY'
          from pathlib import Path
          import ast
          import collections
          import hashlib
          import json
          import subprocess
          import sys
          sys.path.insert(0, '/tmp/code-style-tools')
          from conservative_style import format_clausewitz
          from style_formatter import token_signature, format_lua_defines
          from replay_style import python_format, LUA_TOKENS
          root = Path('/tmp/code-style-current')
          output = Path('/tmp/code-style-final')
          def git(*args, text=True):
              return subprocess.check_output(['git', *args], cwd=root, text=text)
          base = git('rev-parse', 'HEAD').strip()
          assert not git('status', '--porcelain').strip()
          applied = subprocess.run(['git', 'apply', '--3way', str(output / 'style.patch')], cwd=root, capture_output=True, text=True)
          (output / 'apply.log').write_text(applied.stdout + applied.stderr)
          conflicts = git('diff', '--name-only', '--diff-filter=U').splitlines()
          if applied.returncode and not conflicts:
              raise RuntimeError(applied.stdout + applied.stderr)
          for name in conflicts:
              path = root / name
              original = git('show', 'HEAD:' + name, text=False)
              path.write_bytes(original)
              if path.suffix == '.py':
                  _, result, error = python_format(path)
                  assert error is None, (name, error)
              elif path.suffix == '.lua':
                  result = format_lua_defines(original.decode('utf-8-sig')).encode('utf-8')
              elif path.suffix in {'.txt', '.gfx', '.gui', '.asset', '.mod'}:
                  source = original.decode('utf-8-sig')
                  indent = int(name.startswith('focus_trees/') and '# @section ' in source)
                  result = format_clausewitz(source, base_indent=indent).encode('utf-8')
              else:
                  raise RuntimeError('Unsupported conflict: ' + name)
              if original.startswith(b'\xef\xbb\xbf') and not result.startswith(b'\xef\xbb\xbf'):
                  result = b'\xef\xbb\xbf' + result
              path.write_bytes(result)
              git('add', '--', name)
          with (output / 'focus-check.log').open('w') as log:
              check = subprocess.run([sys.executable, '-B', '-m', 'tools.builders.build_adiscord_focus_trees', '--check'], cwd=root, stdout=log, stderr=subprocess.STDOUT)
              if check.returncode:
                  subprocess.run([sys.executable, '-B', '-m', 'tools.builders.build_adiscord_focus_trees', '--apply'], cwd=root, stdout=log, stderr=subprocess.STDOUT, check=True)
                  subprocess.run([sys.executable, '-B', '-m', 'tools.builders.build_adiscord_focus_trees', '--check'], cwd=root, stdout=log, stderr=subprocess.STDOUT, check=True)
          names = git('diff', '--name-only', 'HEAD').splitlines()
          assert names and not any(name.startswith(('localisation/', '.github/', '.superpowers/')) for name in names)
          verified = []
          for name in names:
              before = git('show', 'HEAD:' + name, text=False)
              after = (root / name).read_bytes()
              assert before.startswith(b'\xef\xbb\xbf') == after.startswith(b'\xef\xbb\xbf'), name
              old, new = before.decode('utf-8-sig'), after.decode('utf-8-sig')
              if name.endswith('.py'):
                  assert ast.dump(ast.parse(old), include_attributes=False) == ast.dump(ast.parse(new), include_attributes=False), name
                  kind = 'python'
              elif name.endswith('.lua'):
                  assert LUA_TOKENS.findall(old) == LUA_TOKENS.findall(new), name
                  kind = 'lua'
              else:
                  assert token_signature(old) == token_signature(new), name
                  kind = 'clausewitz'
              verified.append({'path': name, 'kind': kind, 'before': hashlib.sha256(before).hexdigest(), 'after': hashlib.sha256(after).hexdigest()})
          git('diff', '--check', 'HEAD')
          report = {'base': base, 'verified': verified, 'counts': dict(collections.Counter(item['kind'] for item in verified)), 'conflicts_resolved_from_current_main': conflicts, 'localisation': 'unchanged', 'runtime_tested': False}
          (output / 'verification.json').write_text(json.dumps(report, indent=2))
          (output / 'style.patch').write_bytes(git('diff', '--binary', 'HEAD', text=False))
          print(json.dumps({'base': base, 'files': len(verified), 'counts': report['counts'], 'resolved_conflicts': conflicts}, indent=2))
          PY
      - name: Verify the exact previously failing checks
        run: |
          cd /tmp/code-style-current
          python -B -m unittest \
            tools.tests.test_adiscord_vorkerland_civil_war_focus.VorkerlandLifecycleFocusTests.test_vorkerland_idea_localisation_and_ivanland_expedition_exist \
            tools.tests.test_validate_adiscord_vorkerland_collapse.FrontAndSupplyTests.test_dead_stalemate_system_is_gone \
            tools.tests.test_validate_adiscord_vorkerland_collapse.InterventionAndVisualTests.test_ivanland_outcome_news_has_one_guarded_immediate_route \
            -v 2>&1 | tee /tmp/code-style-final/regression-tests.log
      - name: Ensure repository validator diagnostics do not increase
        run: |
          python -B - <<'PY'
          from pathlib import Path
          import json
          import re
          import subprocess
          import sys
          output = Path('/tmp/code-style-final')
          results = {}
          for stage in ['before', 'current']:
              root = Path('/tmp/code-style-' + stage)
              with (output / ('validator-' + stage + '.log')).open('w') as log:
                  result = subprocess.run([sys.executable, '-B', 'tools/validate_tc.py', '--limit', '300'], cwd=root, stdout=log, stderr=subprocess.STDOUT, timeout=180)
              assert result.returncode == 0, (stage, result.returncode)
              text = (output / ('validator-' + stage + '.log')).read_text()
              results[stage] = {name: int(count) for name, count in re.findall(r'^== (.+?): (\d+) ==$', text, re.M)}
          assert results['before'] and results['before'] == results['current'], results
          (output / 'validator-comparison.json').write_text(json.dumps(results, indent=2))
          print('Validator exit codes: 0 / 0. All diagnostic section counts are unchanged.')
          PY
      - name: Deliver authorized style cleanup to main without force-pushing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -B - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import json
          import os
          import subprocess
          output = Path('/tmp/code-style-final')
          root = Path('/tmp/code-style-current')
          report = json.loads((output / 'verification.json').read_text())
          def git(*args):
              return subprocess.check_output(['git', *args], cwd=root, text=True).strip()
          for item in report['verified']:
              assert hashlib.sha256((root / item['path']).read_bytes()).hexdigest() == item['after'], item['path']
          actual = set(git('diff', '--name-only', 'HEAD').splitlines())
          assert actual == {item['path'] for item in report['verified']}
          git('config', 'user.name', 'github-actions[bot]')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          for name in sorted(actual):
              git('add', '--', name)
          git('diff', '--cached', '--check')
          git('commit', '-m', 'style: normalize authored mod scripts and Python tooling', '-m', 'Preserve ordered Clausewitz tokens, exact Python ASTs, localisation bytes and concurrent main changes. Regenerate focus outputs through their owner. Exclude temporary audit tooling and pre-existing syntax errors.')
          head = git('rev-parse', 'HEAD')
          report['head'] = head
          report['run_id'] = os.environ['GITHUB_RUN_ID']
          (output / 'delivery.json').write_text(json.dumps(report, indent=2))
          token = os.environ['GH_TOKEN']
          header = 'AUTHORIZATION: basic ' + base64.b64encode(('x-access-token:' + token).encode()).decode()
          authenticated = dict(os.environ, GIT_CONFIG_COUNT='1', GIT_CONFIG_KEY_0='http.https://github.com/.extraheader', GIT_CONFIG_VALUE_0=header, GIT_TERMINAL_PROMPT='0')
          subprocess.run(['git', 'push', 'origin', head + ':refs/heads/main'], cwd=root, env=authenticated, check=True)
          remote = subprocess.check_output(['git', 'ls-remote', 'origin', 'refs/heads/main'], cwd=root, env=authenticated, text=True)
          report['main_after_push'] = remote.split()[0]
          report['pushed_to_main'] = True
          (output / 'delivery.json').write_text(json.dumps(report, indent=2))
          print(json.dumps({'head': head, 'main_after_push': report['main_after_push'], 'files': len(actual), 'counts': report['counts'], 'pushed_to_main': True}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-style-main-delivery
          path: /tmp/code-style-final
          retention-days: 7
