name: Repository code style audit
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: repository-code-style-audit
  cancel-in-progress: true
jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/code-style-audit-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare isolated verification workspace
        run: |
          python -m pip install black==25.1.0 pillow numpy scipy
          git fetch --depth=1 origin ca0125941411ef3798b7e4f051b58755f8210ea6
          git worktree add --detach /tmp/code-style-before ca0125941411ef3798b7e4f051b58755f8210ea6
          cp -a .superpowers/code-style-audit /tmp/code-style-tools
          mkdir /tmp/code-style-evidence
      - name: Verify formatter and apply semantics-preserving changes
        run: |
          (cd /tmp/code-style-tools && python -B -m unittest tests_audit -v) 2>&1 | tee /tmp/code-style-evidence/formatter-tests.log
          python -B /tmp/code-style-tools/replay_style.py "$PWD" /tmp/code-style-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: code-style-formatted-source
          path: |
            /tmp/code-style-evidence/style-manifest.json
            /tmp/code-style-evidence/style.patch
            /tmp/code-style-evidence/focus-generation.log
            /tmp/code-style-evidence/formatter-tests.log
          retention-days: 7
      - name: Compare baseline and formatted test modules
        run: |
          python -B /tmp/code-style-tools/bounded_suite.py /tmp/code-style-before /tmp/code-style-evidence/before
          python -B /tmp/code-style-tools/bounded_suite.py "$PWD" /tmp/code-style-evidence/after
      - name: Run the repository validator on both versions
        run: |
          python -B - <<'PY'
          from pathlib import Path
          import json
          import os
          import signal
          import subprocess
          import sys
          output = Path('/tmp/code-style-evidence')
          results = {}
          for name, root in [('before', Path('/tmp/code-style-before')), ('after', Path.cwd())]:
              with (output / ('validate-tc-' + name + '.log')).open('w') as log:
                  process = subprocess.Popen([sys.executable, '-B', 'tools/validate_tc.py', '--limit', '300'], cwd=root, stdout=log, stderr=subprocess.STDOUT, start_new_session=True)
                  try:
                      results[name] = process.wait(timeout=90)
                  except subprocess.TimeoutExpired:
                      os.killpg(process.pid, signal.SIGKILL)
                      process.wait()
                      results[name] = 'timeout after 90 seconds'
          (output / 'validator-results.json').write_text(json.dumps(results, indent=2))
          print(json.dumps(results, indent=2))
          PY
      - name: Publish clean style-only commits for review
        run: python -B /tmp/code-style-tools/deliver_style.py "$PWD" /tmp/code-style-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-style-review
          path: /tmp/code-style-evidence
          retention-days: 7
