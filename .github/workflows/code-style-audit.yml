name: Repository code style audit
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
  actions: read
concurrency:
  group: repository-code-style-final
  cancel-in-progress: true
jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/code-style-audit-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4fc04311686984769b57b2af2d01b91b4fea5068
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: code-style-main-delivery
          run-id: 36561959180
          github-token: ${{ github.token }}
          path: /tmp/code-style-validated
      - name: Restore the exact tree whose checks passed
        run: |
          python -B - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import subprocess
          root = Path.cwd()
          evidence = Path('/tmp/code-style-validated')
          report = json.loads((evidence / 'verification.json').read_text())
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse', 'HEAD') == report['base'] == '4fc04311686984769b57b2af2d01b91b4fea5068'
          assert not git('status', '--porcelain')
          tests = (evidence / 'regression-tests.log').read_text()
          assert '\nOK\n' in tests and 'FAILED (' not in tests and 'Ran 3 tests' in tests
          validators = json.loads((evidence / 'validator-comparison.json').read_text())
          assert validators['before'] and validators['before'] == validators['current']
          assert 'Focus tree outputs are current.' in (evidence / 'focus-check.log').read_text()
          names = {item['path'] for item in report['verified']}
          assert len(names) == 454
          assert not any(name.startswith(('localisation/', '.github/', '.superpowers/')) for name in names)
          for item in report['verified']:
              assert hashlib.sha256((root / item['path']).read_bytes()).hexdigest() == item['before'], item['path']
          git('apply', '--check', str(evidence / 'style.patch'))
          git('apply', str(evidence / 'style.patch'))
          assert set(git('diff', '--name-only').splitlines()) == names
          for item in report['verified']:
              assert hashlib.sha256((root / item['path']).read_bytes()).hexdigest() == item['after'], item['path']
          git('diff', '--check')
          print('Restored and hash-verified all 454 files against the exact base and fully validated result.')
          PY
      - name: Recheck the focused regression tests
        run: |
          set -euo pipefail
          python -m pip install pillow numpy scipy
          python -B -m unittest \
            tools.tests.test_adiscord_vorkerland_civil_war_focus.VorkerlandLifecycleFocusTests.test_vorkerland_idea_localisation_and_ivanland_expedition_exist \
            tools.tests.test_validate_adiscord_vorkerland_collapse.FrontAndSupplyTests.test_dead_stalemate_system_is_gone \
            tools.tests.test_validate_adiscord_vorkerland_collapse.InterventionAndVisualTests.test_ivanland_outcome_news_has_one_guarded_immediate_route \
            -v 2>&1 | tee /tmp/code-style-validated/delivery-tests.log
          python -B -m tools.builders.build_adiscord_focus_trees --check
      - name: Push the verified commit without overwriting concurrent main changes
        run: |
          python -B - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          import subprocess
          evidence = Path('/tmp/code-style-validated')
          report = json.loads((evidence / 'verification.json').read_text())
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          for item in report['verified']:
              assert hashlib.sha256(Path(item['path']).read_bytes()).hexdigest() == item['after'], item['path']
          assert set(git('diff', '--name-only').splitlines()) == {item['path'] for item in report['verified']}
          git('config', 'user.name', 'github-actions[bot]')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          for item in report['verified']:
              git('add', '--', item['path'])
          git('diff', '--cached', '--check')
          git('commit', '-m', 'style: normalize authored mod scripts and Python tooling', '-m', 'Preserve ordered Clausewitz tokens, exact Python ASTs, localisation bytes, source-section boundaries and concurrent main changes. Regenerate focus outputs through their owner. Exclude temporary audit tooling and pre-existing syntax errors.')
          head = git('rev-parse', 'HEAD')
          branch = 'codex/style-main-delivery-' + os.environ['GITHUB_RUN_ID']
          report.update({'head': head, 'branch': branch, 'validation_run': 36561959180, 'delivery_run': os.environ['GITHUB_RUN_ID']})
          (evidence / 'delivery.json').write_text(json.dumps(report, indent=2))
          git('push', 'origin', head + ':refs/heads/' + branch)
          git('push', 'origin', head + ':refs/heads/main')
          report['main_after_push'] = git('ls-remote', 'origin', 'refs/heads/main').split()[0]
          report['pushed_to_main'] = True
          (evidence / 'delivery.json').write_text(json.dumps(report, indent=2))
          print(json.dumps({key: report[key] for key in ['head', 'branch', 'base', 'counts', 'pushed_to_main', 'main_after_push']}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-style-main-delivery-final
          path: /tmp/code-style-validated
          retention-days: 7
