name: Repository code style audit
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: repository-code-style-audit
  cancel-in-progress: true
jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/code-style-audit-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare verification dependencies
        run: |
          python -m pip install pillow numpy scipy
          python -m pip download --only-binary=:all: black==25.1.0 -d /tmp/code-style-wheels
      - uses: actions/upload-artifact@v4
        with:
          name: code-style-formatting-tools
          path: /tmp/code-style-wheels
          retention-days: 3
      - name: Record original test and validator results
        run: |
          python -B - <<'PY'
          from pathlib import Path
          import contextlib
          import json
          import subprocess
          import sys
          import unittest
          output = Path('/tmp/code-style-baseline')
          output.mkdir()
          excluded = []
          def filter_suite(suite):
              selected = unittest.TestSuite()
              for test in suite:
                  if isinstance(test, unittest.TestSuite):
                      selected.addTests(filter_suite(test))
                  elif test.id().endswith('.test_default_checks_and_help_are_non_mutating'):
                      excluded.append({'test': test.id(), 'reason': 'Runs every asset/map generator; excluded from this style-only differential gate. Changed focus output is regenerated and checked separately.'})
                  else:
                      selected.addTest(test)
              return selected
          with (output / 'tests.log').open('w') as stream:
              with contextlib.redirect_stdout(stream), contextlib.redirect_stderr(stream):
                  suite = filter_suite(unittest.defaultTestLoader.discover('tools/tests', pattern='test_*.py'))
                  result = unittest.TextTestRunner(stream=stream, verbosity=2).run(suite)
          metadata = {
              'tests_run': result.testsRun,
              'failures': [{'test': test.id(), 'traceback': trace} for test, trace in result.failures],
              'errors': [{'test': test.id(), 'traceback': trace} for test, trace in result.errors],
              'skipped': [{'test': test.id(), 'reason': reason} for test, reason in result.skipped],
              'excluded': excluded,
          }
          with (output / 'validate-tc.log').open('w') as stream:
              try:
                  validation = subprocess.run([sys.executable, '-B', 'tools/validate_tc.py', '--limit', '300'], stdout=stream, stderr=subprocess.STDOUT, timeout=240)
                  metadata['validate_tc_exit'] = validation.returncode
              except subprocess.TimeoutExpired:
                  metadata['validate_tc_exit'] = 124
          (output / 'baseline.json').write_text(json.dumps(metadata, indent=2))
          print(json.dumps({key: len(value) if isinstance(value, list) else value for key, value in metadata.items()}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-style-baseline
          path: /tmp/code-style-baseline
          retention-days: 3
