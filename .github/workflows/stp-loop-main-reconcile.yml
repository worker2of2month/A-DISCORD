name: STP main loop reconcile

on:
  push:
    branches:
      - fix/stp-loop-main-reconcile-20260917

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy
      - name: Apply guarded production repair and contract updates
        run: |
          python tools/tmp_reconcile_stp_loop_main.py
          python tools/tmp_reconcile_stp_loop_tests.py
          python tools/tmp_reconcile_stp_loop_tests2.py
          git diff --check
      - name: Focused regression
        run: python -B -m unittest -v tools.tests.test_adiscord_stp_gameplay_loop_regressions
      - name: Full STP regression suite
        run: python -B -m unittest discover -s tools/tests -p 'test_adiscord_stp_*.py'
      - name: Total-conversion validator
        run: python -B tools/validate_tc.py --limit 300
      - name: Publish verified repair without harness files
        run: |
          git config user.name "A-Discord Audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stp-loop-main-reconcile.yml tools/tmp_reconcile_stp_loop_main.py tools/tmp_reconcile_stp_loop_tests.py tools/tmp_reconcile_stp_loop_tests2.py
          git add \
            common/scripted_triggers/ADISCORD_STP_scripted_triggers.txt \
            common/scripted_effects/ADISCORD_STP_scripted_effects.txt \
            common/decisions/ADISCORD_STP_decisions.txt \
            events/ADISCORD_STP_events.txt \
            localisation/russian/ADISCORD_STP_l_russian.yml \
            docs/development/focus-effects.md \
            tools/tests/test_adiscord_stp_gameplay_loop_regressions.py \
            tools/tests/test_adiscord_stp_civil_war.py \
            tools/tests/test_adiscord_stp_preparation.py \
            tools/tests/test_adiscord_stp_regions.py
          git diff --cached --check
          git commit -m "Fix Stelander inspection and Fada deadline lifecycle"
          git push origin HEAD:fix/stp-loop-main-reconcile-20260917
