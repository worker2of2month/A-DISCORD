name: Economy review snapshot
on:
  push:
    branches: [codex/economy-review-20260919]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          show-progress: false
      - run: python -m pip install Pillow numpy
      - name: Apply bounded patch
        id: patch
        run: |
          python -B - <<'PY'
          from pathlib import Path
          p=Path('.github/economy_review_patch.py')
          source=p.read_text(encoding='utf-8')
          old='("0.45", "0.70", "1.00", "1.35", "1.80")'
          assert source.count(old)==1
          source=source.replace(old,'("0.45", "0.75", "1.00", "1.35", "1.80")')
          exec(compile(source,str(p),'exec'))
          PY
      - name: New regression contracts
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        run: python -B -m unittest tools.tests.test_adiscord_economy_rebalance -v
      - name: Existing focused regressions
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        run: python -B -m unittest tools.tests.test_adiscord_economy_weekly_contracts tools.tests.test_validate_adiscord_val_rework tools.tests.test_adiscord_stp_postwar_economy tools.tests.test_adiscord_stp_postwar_unlock tools.tests.test_adiscord_val_stelander_defeat tools.tests.test_adiscord_val_livonn_settlement tools.tests.test_adiscord_stp_postwar_continuation tools.tests.test_adiscord_stp_postwar_interactivity tools.tests.test_val_export_market -q
      - name: Total conversion validator
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        run: python -B tools/validate_tc.py --limit 300
      - name: Review diff and source hashes
        if: always()
        run: |
          git diff --check
          git diff --stat
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('/tmp/economy-changed-paths.json')
          if p.exists():
              for name in json.loads(p.read_text()):
                  print(hashlib.sha256(Path(name).read_bytes()).hexdigest(),name)
          PY
      - name: Preserve candidate on isolated review branch
        if: always() && steps.patch.outcome == 'success'
        run: |
          python - <<'PY'
          import json,subprocess
          paths=json.load(open('/tmp/economy-changed-paths.json'))
          subprocess.run(['git','add','--',*paths],check=True)
          PY
          git config user.name 'A-Discord automation'
          git config user.email '81386071+worker2of2month@users.noreply.github.com'
          git commit -m 'Rebalance productive income, rebuild recovery focuses and unblock northern AI'
          git push origin HEAD:refs/heads/codex/economy-review-20260919
          git rev-parse HEAD
          git ls-tree HEAD common tools docs localisation
