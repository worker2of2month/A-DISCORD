name: Economy review snapshot
on:
  push:
    branches: [codex/economy-review-20260919]
permissions:
  contents: write
jobs:
  final-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 64
          show-progress: false
      - run: python -m pip install Pillow numpy PyYAML
      - name: Reconcile current main
        run: |
          git config user.name 'A-Discord automation'
          git config user.email '81386071+worker2of2month@users.noreply.github.com'
          git fetch --no-tags --depth=64 origin main:refs/remotes/origin/main
          git rev-parse origin/main > /tmp/economy-main-parent
          git merge --no-edit origin/main
      - name: Apply previously verified mixed-preview correction
        run: |
          python -B - <<'PY'
          import subprocess,yaml
          source=subprocess.check_output(['git','show','071efa66e465113b4d06eef8583a75ad064de109:.github/workflows/economy-review-snapshot.yml'],text=True)
          workflow=yaml.safe_load(source)
          steps=workflow['jobs']['final-verification']['steps']
          step=next(s for s in steps if s.get('name')=='Regression for mixed tier and aggregate previews')
          subprocess.run(['bash','-e','-c',step['run']],check=True)
          PY
      - name: Align explicit existing regression expectations
        run: python -B .github/economy_test_alignment.py
      - name: Verify affected native preview and recovery cases
        run: |
          python -B -m unittest tools.tests.test_adiscord_economy_rebalance tools.tests.test_validate_adiscord_val_rework.ValNativePreviewTests tools.tests.test_validate_adiscord_val_rework.ValRewardValidatorTests.test_production_preview_contracts_are_valid tools.tests.test_adiscord_economy_weekly_contracts.EconomySemanticFixtureTests.test_core_policy_and_debt_flow_negative_fixtures tools.tests.test_adiscord_economy_weekly_contracts.WeeklyEconomyContracts.test_economic_building_reference_documents_roles_and_formulas tools.tests.test_adiscord_stp_postwar_continuation.PostwarContinuationContracts.test_postwar_settlement_is_a_sibling_of_the_nod_defeat_router tools.tests.test_adiscord_stp_postwar_continuation.PostwarContinuationContracts.test_postwar_wars_use_native_relations_without_marker_flags tools.tests.test_adiscord_stp_postwar_continuation.PostwarContinuationContracts.test_kefreyt_defeat_returns_all_stelander_cores_before_white_peace tools.tests.test_adiscord_stp_postwar_continuation.PostwarRecoveryTransactions.test_illegal_targets_cannot_start_native_campaign_wars -v
      - name: Remove temporary review tools from final tree
        run: |
          git rm -- .github/workflows/economy-review-snapshot.yml .github/economy_review_patch.py .github/economy_test_alignment.py
          git diff --check
      - name: Complete focused test suite
        run: python -B -m unittest tools.tests.test_adiscord_economy_rebalance tools.tests.test_adiscord_economy_weekly_contracts tools.tests.test_validate_adiscord_val_rework tools.tests.test_adiscord_stp_postwar_economy tools.tests.test_adiscord_stp_postwar_unlock tools.tests.test_adiscord_val_stelander_defeat tools.tests.test_adiscord_val_livonn_settlement tools.tests.test_adiscord_stp_postwar_continuation tools.tests.test_adiscord_stp_postwar_interactivity tools.tests.test_val_export_market -q
      - name: Validate final total conversion
        run: python -B tools/validate_tc.py --limit 300
      - name: Publish clean candidate without advancing main
        run: |
          git add -- tools/tests/test_adiscord_economy_rebalance.py tools/validators/validate_adiscord_val_rework.py tools/tests/test_adiscord_economy_weekly_contracts.py tools/tests/test_validate_adiscord_val_rework.py tools/tests/test_adiscord_stp_postwar_continuation.py
          git diff --cached --check
          MAIN_PARENT=$(cat /tmp/economy-main-parent)
          TREE=$(git write-tree)
          git diff --name-only "$MAIN_PARENT" "$TREE" > /tmp/economy-final-paths
          if grep '^.github/' /tmp/economy-final-paths; then exit 1; fi
          CANDIDATE=$(git commit-tree "$TREE" -p "$MAIN_PARENT" -m 'Rebalance income and rework Kefreite and Shabrat economic focuses')
          git push origin "$CANDIDATE":refs/heads/codex/economy-ready-20260919
          printf '\nFINAL_PARENT=%s\nFINAL_TREE=%s\nFINAL_COMMIT=%s\n' "$MAIN_PARENT" "$TREE" "$CANDIDATE"
          git diff --stat "$MAIN_PARENT" "$CANDIDATE"
          python -B - <<'PY'
          from pathlib import Path
          import hashlib
          for name in Path('/tmp/economy-final-paths').read_text().splitlines():
              raw=Path(name).read_bytes()
              if name.startswith('localisation/'): assert raw.startswith(b'\xef\xbb\xbf'),name
              if name.startswith('common/'): assert not raw.startswith(b'\xef\xbb\xbf'),name
              print('SOURCE_SHA256',hashlib.sha256(raw).hexdigest(),name)
          from tools.tests.test_adiscord_economy_rebalance import income_fixture,P
          for civs in (5,25,60):
              f=income_fixture(civilian=civs);f.run(P+'calculate_income');f.run(P+'calculate_weekly_budget')
              print('REFERENCE',civs,{k:f.scopes['A'][P+k] for k in ('monthly_income','weekly_income','weekly_expenses','weekly_balance')})
          PY
