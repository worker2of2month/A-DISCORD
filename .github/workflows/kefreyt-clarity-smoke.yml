name: Kefreyt clarity smoke

on:
  push:
    branches:
      - rework/val-focus-layout-and-refugees

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Focus clarity
        run: python -B -m unittest tools.tests.test_adiscord_val_focus_clarity
      - name: Refugee mechanics
        run: python -B -m unittest tools.tests.test_adiscord_val_refugees
      - name: Southern Tsaygen route
        run: python -B -m unittest tools.tests.test_adiscord_val_southern_tsaygen
      - name: Scripted peace bus
        run: python -B -m unittest tools.tests.test_scripted_peace_on_actions
