name: Isolated economy source audit
on:
  push:
    branches:
      - codex/economy-100-audit-20260919
permissions:
  contents: write
concurrency:
  group: isolated-economy-audit
  cancel-in-progress: true
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
          sparse-checkout: .github
      - uses: actions/checkout@v4
        with:
          ref: 7d828a217b7098a5d1c73cb45049b279e41248a4
          path: source
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            common
            events
            history
            localisation
            tools
            docs
            interface
            country_metadata
      - name: Inspect accounting and progression
        working-directory: source
        run: python -B ../control/.github/economy_inspect.py > ../control/.github/economy-inspection.txt
      - name: Save inspection on audit branch
        working-directory: control
        run: |
          git config user.name 'Economy audit'
          git config user.email '81386071+worker2of2month@users.noreply.github.com'
          git add .github/economy-inspection.txt
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record targeted economy source inspection'
            git push origin HEAD:codex/economy-100-audit-20260919
          fi
