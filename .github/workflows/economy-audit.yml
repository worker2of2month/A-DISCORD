name: Isolated economy source audit
on:
  push:
    branches:
      - codex/economy-100-audit-20260919
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7d828a217b7098a5d1c73cb45049b279e41248a4
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            common
            events
            history
            localisation
            tools
            docs
            interface
            country_metadata
      - name: Inspect accounting and progression
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          print('ECONOMY TESTS')
          for p in Path('tools').rglob('*.py'):
              if 'economy' in p.name:
                  print(p)
          print('STP FOCUS FILES')
          for p in Path('common/national_focus').glob('*.txt'):
              if any(s in p.name.lower() for s in ['stp', 'sts', 'shabrat']):
                  print(p)
                  for no, line in enumerate(p.read_text(encoding='utf-8-sig').splitlines(), 1):
                      if re.search(r'\bid\s*=', line): print(no, line.strip())
          print('ECONOMY MODIFIER SCALING')
          p=Path('common/scripted_effects/ADISCORD_economy_modifier_effects.txt')
          t=p.read_text(encoding='utf-8-sig')
          for name in ['ADISCORD_economy_apply_overall_income_modifier_factor','ADISCORD_economy_apply_overall_expense_modifier_factor','ADISCORD_economy_reset_final_factor_variables']:
              m=re.search(r'^'+name+r'\s*=\s*\{.*?^\}',t,re.M|re.S)
              print(m.group() if m else name+' NOT FOUND')
          print('AI AND FRONTIER')
          for p in list(Path('common/ai_strategy_plans').glob('*VAL*'))+list(Path('common/decisions').glob('*VAL*')):
              t=p.read_text(encoding='utf-8-sig')
              lines=t.splitlines()
              print('FILE',p)
              if 'ai_strategy_plans' in str(p): print(t)
              else:
                  for no,line in enumerate(lines):
                      if re.match(r'\s*VAL_frontier_demand_(CIN|OSF|APH)\s*=',line):
                          print('\n'.join(f'{i+1}: {lines[i]}' for i in range(max(no-3,0),min(no+65,len(lines)))))
          print('ECONOMY SIMULATION HELPERS')
          for p in Path('tools').rglob('*.py'):
              if 'economy' in p.name and ('test' in p.name or 'balance' in p.name):
                  t=p.read_text(encoding='utf-8-sig')
                  print(p, '\n'.join(t.splitlines()[:55]))
          PY
      - name: Baseline economy tests
        run: python -B -m unittest discover -s tools/tests -p '*economy*' -q
