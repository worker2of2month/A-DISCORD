name: Fada and council regression review
on:
  push:
    branches: [codex/fada-council-revanche]
    paths:
      - .github/workflows/fada-council-review.yml
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 75f92e57a9474c896bd4ad86440e44c2e8e6d06d
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python -m pip install Pillow
      - name: Compare complete validation reports and rerun focused regressions
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re, subprocess, sys
          evidence = Path('/tmp/fada-evidence')
          evidence.mkdir(exist_ok=True)
          root = Path.cwd()
          base = 'bb0d60563451a2a1a83c93bfb83ca81d12384e7e'
          head = '75f92e57a9474c896bd4ad86440e44c2e8e6d06d'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip() == head
          subprocess.run(['git','fetch','--depth=1','origin',base],check=True)
          baseline = Path('/tmp/fada-baseline')
          subprocess.run(['git','worktree','add','--detach',str(baseline),base],check=True)
          for label, cwd in [('baseline',baseline),('final',root)]:
              with (evidence/(label+'-validation.log')).open('w') as f:
                  result = subprocess.run([sys.executable,'-B','tools/validate_tc.py','--limit','300'],cwd=cwd,stdout=f,stderr=subprocess.STDOUT)
              text = (evidence/(label+'-validation.log')).read_text()
              assert text.startswith('A-Discord total-conversion validation'), text
              assert '== Vanilla leftovers:' in text and 'Traceback' not in text, text
          def issues(label):
              text = (evidence/(label+'-validation.log')).read_text()
              return {re.sub(r':\d+(?=:|\n| |$)',':LINE',line) for line in text.splitlines() if line.startswith('- ')}
          new = sorted(issues('final')-issues('baseline'))
          (evidence/'new-validation-issues.json').write_text(json.dumps(new,indent=2))
          assert not new, new
          focused = [sys.executable,'-B','-m','unittest','tools.tests.test_adiscord_stp_party_survival','tools.tests.test_adiscord_val_stelander_defeat','tools.tests.test_adiscord_stp_gameplay_loop_regressions']
          with (evidence/'focused.log').open('w') as f:
              result = subprocess.run(focused,stdout=f,stderr=subprocess.STDOUT)
          print((evidence/'focused.log').read_text())
          assert result.returncode == 0
          subprocess.run(['git','diff','--check',base,head],check=True)
          changed = subprocess.check_output(['git','diff','--name-only',base,head],text=True).splitlines()
          assert len(changed) == 15
          hashes = {name:hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in changed}
          manifest = {'base':base,'head':head,'branch':'codex/fada-council-ready-35683618677','focused_tests':70,'complete_validator_reports':True,'new_validation_issues':new,'source_sha256':hashes,'runtime_tested':False}
          (evidence/'manifest.json').write_text(json.dumps(manifest,indent=2))
          print(json.dumps(manifest,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fada-council-complete-validation
          path: /tmp/fada-evidence
          retention-days: 3
