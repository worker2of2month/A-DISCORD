name: Fada and council regression review
on:
  push:
    branches: [codex/fada-council-revanche]
    paths:
      - tools/fada_council_patch.py
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify current main and prepare isolated gameplay commit
        run: |
          cp tools/fada_council_patch.py /tmp/fada_council_patch.py
          python -B /tmp/fada_council_patch.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fada-council-verification
          path: /tmp/fada-evidence
          retention-days: 3
