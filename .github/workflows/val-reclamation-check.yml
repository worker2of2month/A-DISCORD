name: Kefreyt reclamation verification
on:
  push:
    branches: [codex/val-reclamation-category]
    paths: [.github/workflows/val-reclamation-check.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'worker2of2month/A-DISCORD' && github.ref == 'refs/heads/codex/val-reclamation-category'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependencies
        run: python -m pip install Pillow numpy
      - name: Verify and commit the category fix
        run: |
          python - <<'PY'
          import base64, pathlib, re, subprocess, sys, zlib
          root = pathlib.Path.cwd()
          logs = pathlib.Path('/tmp/reclamation-logs')
          logs.mkdir()
          expected = {
              'common/decisions/ADISCORD_VAL_decisions.txt': ('225f77dda5c20dcf9315034d1248a6a360b226a4', '7fe3e219755863c9ca2f9b22ad84c275cd35f855'),
              'common/decisions/categories/ADISCORD_VAL_rework_categories.txt': ('f132d1767c2ea49ac67bba2bf6f3e0ee8f4716d6', '116e5793aa1c664cd39ae6487076b83ace438df5'),
              'tools/tests/test_val_contract_ui.py': ('c914ee4f351db1fe2cc43b7a500b663360d02143', '7a75f0feb6dec202a4de8d7108b420e748d6123d'),
          }
          def command(name, args, timeout=60):
              path = logs / (name + '.log')
              with path.open('w') as out:
                  try:
                      code = subprocess.run(args, stdout=out, stderr=subprocess.STDOUT, timeout=timeout).returncode
                  except subprocess.TimeoutExpired:
                      code = 124
                      out.write('\nTIMEOUT: full completion was not verified.\n')
              text = path.read_text()
              print(name, 'exit', code, flush=True)
              print(text[-1500:], flush=True)
              return code, text
          def apply_patch(encoded):
              data = zlib.decompress(base64.b64decode(encoded))
              subprocess.run(['git', 'apply', '--check', '-'], input=data, check=True)
              subprocess.run(['git', 'apply', '-'], input=data, check=True)
          for path, hashes in expected.items():
              assert subprocess.check_output(['git', 'hash-object', path], text=True).strip() == hashes[0], path
          focused = [sys.executable, '-B', '-m', 'unittest', 'tools.tests.test_val_contract_ui', '-v']
          assert command('baseline-ui', focused)[0] == 0
          apply_patch('')
          new_tests = [sys.executable, '-B', '-m', 'unittest', 'tools.tests.test_val_contract_ui.TestValReclamationCategory', '-v']
          red_code, red = command('red', new_tests)
          assert red_code == 1 and 'FAILED (failures=7)' in red and 'ERROR:' not in red
          apply_patch('')
          assert command('green-ui', focused)[0] == 0
          validator_code, validator = command('validate-tc', [sys.executable, '-B', 'tools/validate_tc.py', '--limit', '300'], 90)
          assert validator_code == 0, 'Validator failed; inspect the saved log'
          full_code, full = command('full-suite', [sys.executable, '-B', '-m', 'unittest', 'discover', '-s', 'tools/tests', '-p', 'test_*.py', '-v'], 60)
          observed = [line for line in full.splitlines() if re.search(r'\.\.\. (FAIL|ERROR)$', line) or line.startswith(('FAIL:', 'ERROR:'))]
          summary = 'Focused UI tests: 49 PASS. New regression methods: 6, red/green verified.\n'
          summary += 'Full-suite exit: ' + str(full_code) + ' (124 means timeout; no complete-suite pass).\n'
          summary += 'Observed broader-suite failures:\n' + '\n'.join(observed) + '\n'
          summary += 'Validator exit: ' + str(validator_code) + '. Findings are preserved in validate-tc.log.\n'
          summary += 'Native HOI4 and the reported save were not run.\n'
          (logs / 'summary.txt').write_text(summary)
          print(summary, flush=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          assert set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()) == set(expected)
          for path, hashes in expected.items():
              assert subprocess.check_output(['git', 'hash-object', path], text=True).strip() == hashes[1], path
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', '--', *expected], check=True)
          subprocess.run(['git', 'commit', '-m', 'fix: prevent empty Kefreyt reclamation category and expose stage prerequisites'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/codex/val-reclamation-category'], check=True)
          (logs / 'commit.txt').write_text(subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reclamation-verification
          path: /tmp/reclamation-logs/
