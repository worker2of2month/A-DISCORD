name: STP survival guards
on:
  push:
    branches: [verify/stp-survival-guards-20260919]
    paths: ['.github/workflows/stp-survival-guards.yml']
permissions:
  contents: read
env:
  BASE_SHA: 0b899382be7e9bc9caea8f817bbd3bfc42ef17ab
  PYTHONHASHSEED: '0'
  PATCH_SHA256: a38972b1eda098087a62ecb2dc789cd74447708bc29c1d9f430d27204be64eb4
  PATCH_GZIP_BASE64: 
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, candidate]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0b899382be7e9bc9caea8f817bbd3bfc42ef17ab
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow numpy
      - name: Apply exact reviewed candidate
        if: matrix.variant == 'candidate'
        run: |
          python - <<'PY'
          import base64,gzip,os,hashlib,subprocess
          from pathlib import Path
          encoded=os.environ['PATCH_GZIP_BASE64'].replace('Byz4XPo83Byz4XPo83','Byz4XPo83').replace('uicKZYyWf4','uicKkZYyWf4')
          data=gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(data).hexdigest()==os.environ['PATCH_SHA256']
          Path('/tmp/guards.patch').write_bytes(data)
          subprocess.run(['git','apply','--check','/tmp/guards.patch'],check=True)
          subprocess.run(['git','apply','/tmp/guards.patch'],check=True)
          subprocess.run(['git','diff','--check'],check=True)
          PY
      - name: Verify focused contracts
        if: matrix.variant == 'candidate'
        run: python -B -m unittest tools.tests.test_adiscord_stp_party_survival tools.tests.test_adiscord_stp_party_balance -v
      - name: Full suite and validator evidence
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          mkdir -p /tmp/guards-result
          cat > /tmp/guards-suite.py <<'PY'
          import sys,os,json,re,unittest,hashlib
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()))
          label=os.environ['VARIANT']
          out=Path('/tmp/guards-result')
          suite=unittest.defaultTestLoader.discover('tools/tests',pattern='test_*.py')
          with (out/(label+'-suite.txt')).open('w') as log:
              result=unittest.TextTestRunner(stream=log,verbosity=2).run(suite)
          records=[]
          for kind,items in [('failure',result.failures),('error',result.errors)]:
              for test,detail in items:
                  reason=detail.strip().splitlines()[-1]
                  reason=re.sub(r'0x[0-9a-fA-F]+','0xADDR',reason)
                  records.append({'kind':kind,'id':test.id(),'reason':reason,'detail':detail})
          (out/(label+'-suite.json')).write_text(json.dumps({'tests':result.testsRun,'failures':len(result.failures),'errors':len(result.errors),'skipped':len(result.skipped),'records':records},indent=2))
          PY
          python - <<'PY'
          import subprocess,os,json,time,concurrent.futures,hashlib
          from pathlib import Path
          label=os.environ['VARIANT']; out=Path('/tmp/guards-result')
          def run(item):
              name,cmd=item; start=time.monotonic()
              with (out/(label+'-'+name+'.log')).open('w') as log:
                  try: code=subprocess.run(cmd,stdout=log,stderr=subprocess.STDOUT,timeout=1800).returncode
                  except subprocess.TimeoutExpired: code=124
              return name,{'exit':code,'seconds':time.monotonic()-start,'command':cmd}
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
              result=dict(pool.map(run,[('runner',['python','-B','/tmp/guards-suite.py']),('validator',['python','-B','tools/validate_tc.py','--limit','300'])]))
          paths=subprocess.check_output(['git','diff','--name-only']).decode().splitlines()
          result.update(head=subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),hashes={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths})
          (out/(label+'-run.json')).write_text(json.dumps(result,indent=2))
          assert result['runner']['exit']==0 and result['validator']['exit']==0,result
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stp-guards-${{ matrix.variant }}
          path: /tmp/guards-result/
          retention-days: 3
  candidate:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0b899382be7e9bc9caea8f817bbd3bfc42ef17ab
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          pattern: stp-guards-*
          merge-multiple: true
          path: /tmp/guards-result/
      - name: Compare every failed test and diagnostic
        run: |
          python - <<'PY'
          import json,re,collections
          from pathlib import Path
          out=Path('/tmp/guards-result')
          base=json.loads((out/'baseline-suite.json').read_text())
          candidate=json.loads((out/'candidate-suite.json').read_text())
          def failures(data):
              return collections.Counter((r['kind'],r['id'],r['reason']) for r in data['records'])
          added=failures(candidate)-failures(base)
          def diagnostics(label):
              lines=(out/(label+'-validator.log')).read_text().splitlines()
              selected=[re.sub(r'(\.(?:txt|py|yml|gui|gfx)):\d+',r'\1:LINE',line) for line in lines if line.startswith(('== ','- '))]
              return collections.Counter(selected)
          new_diagnostics=diagnostics('candidate')-diagnostics('baseline')
          gate={'new_failed_tests':[list(key)+[count] for key,count in added.items()],'new_diagnostics':dict(new_diagnostics),'baseline_tests':base['tests'],'candidate_tests':candidate['tests'],'baseline_failures':base['failures'],'candidate_failures':candidate['failures'],'baseline_errors':base['errors'],'candidate_errors':candidate['errors']}
          (out/'gate.json').write_text(json.dumps(gate,indent=2))
          print(json.dumps(gate,indent=2))
          assert candidate['tests'] >= base['tests']+5
          assert not added and not new_diagnostics
          PY
      - name: Produce clean candidate without CI files
        run: |
          python - <<'PY'
          import base64,gzip,os,hashlib,subprocess,json
          from pathlib import Path
          encoded=os.environ['PATCH_GZIP_BASE64'].replace('Byz4XPo83Byz4XPo83','Byz4XPo83').replace('uicKZYyWf4','uicKkZYyWf4')
          data=gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(data).hexdigest()==os.environ['PATCH_SHA256']
          Path('/tmp/guards.patch').write_bytes(data)
          subprocess.run(['git','apply','--check','/tmp/guards.patch'],check=True)
          subprocess.run(['git','apply','/tmp/guards.patch'],check=True)
          paths=subprocess.check_output(['git','diff','--name-only']).decode().splitlines()
          report=json.loads(Path('/tmp/guards-result/candidate-run.json').read_text())
          assert len(paths)==6 and set(paths)==set(report['hashes'])
          assert report['head']==os.environ['BASE_SHA']
          for p in paths:
              assert not p.startswith('.github/')
              assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==report['hashes'][p],p
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','--',*paths],check=True)
          PY
          git config user.name 'A-Discord automation'
          git config user.email '81386071+worker2of2month@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'Harden party northern aid, exile and return lifecycle guards'
          git rev-parse HEAD > /tmp/guards-result/candidate-sha.txt
          git show --stat --oneline HEAD > /tmp/guards-result/change-stat.txt
          git show --format=fuller --binary HEAD > /tmp/guards-result/commit.patch
          git push origin "HEAD:refs/heads/agent/stp-survival-guards-candidate-${GITHUB_RUN_ID}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stp-guards-final-review
          path: /tmp/guards-result/
          retention-days: 3
