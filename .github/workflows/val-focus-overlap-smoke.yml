name: VAL focus overlap smoke

on:
  push:
    branches:
      - fix/val-focus-node-overlaps

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Focus clarity
        run: python -B -m unittest tools.tests.test_adiscord_val_focus_clarity
      - name: Northern route regression
        run: python -B -m unittest tools.tests.test_adiscord_economy_rebalance.NorthernCampaignRouteTests
      - name: Resource-war focus regression
        run: python -B -m unittest tools.tests.test_validate_adiscord_val_rework.ValExpandedCampaignTests.test_resource_war_focus_visibility_follows_the_war_without_hiding_irem
      - name: Diff check
        run: git diff --check HEAD^ HEAD
