name: AI audit review
on:
  push:
    branches: [codex/ai-audit-20260922]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bb0d60563451a2a1a83c93bfb83ca81d12384e7e
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow numpy
      - name: Verify baseline, regressions, and complete source
        env:
          TERM: xterm
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, subprocess, sys, zipfile, zlib
          from pathlib import Path
          report = Path('/tmp/ai-final')
          report.mkdir()
          base = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert base == 'bb0d60563451a2a1a83c93bfb83ca81d12384e7e'
          encoded = '''