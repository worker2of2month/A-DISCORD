name: AI audit review
on:
  push:
    branches: [codex/ai-audit-20260922]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record source and baseline checks
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, subprocess, sys, zipfile
          root = Path.cwd()
          report = Path('/tmp/ai-audit')
          report.mkdir()
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          (report / 'source-sha.txt').write_text(sha + '\n')
          cases = [('validate_tc', [sys.executable, '-B', 'tools/validate_tc.py', '--limit', '300'])]
          for path in sorted(Path('tools/tests').glob('*ai*.py')):
              cases.append((path.stem, [sys.executable, '-B', '-m', 'unittest', '.'.join(path.with_suffix('').parts), '-v']))
          results = []
          for name, command in cases:
              with (report / (name + '.log')).open('w') as out:
                  try:
                      result = subprocess.run(command, stdout=out, stderr=subprocess.STDOUT, timeout=150)
                      code = result.returncode
                  except subprocess.TimeoutExpired:
                      code = 124
              results.append({'name': name, 'returncode': code})
              print(name, code, flush=True)
          (report / 'results.json').write_text(json.dumps({'sha': sha, 'checks': results}, indent=2))
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          extensions = {'.py', '.txt', '.json', '.md', '.yml', '.yaml', '.lua', '.mod', '.gui', '.gfx', '.csv', '.toml', '.ps1', '.tsv'}
          with zipfile.ZipFile(report / 'source.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in tracked:
                  path = Path(name)
                  if name and path.is_file() and path.suffix.lower() in extensions and path.stat().st_size < 15000000:
                      archive.write(path, name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-audit-review
          path: /tmp/ai-audit/
          retention-days: 3
