name: VAL harvest gate smoke

on:
  push:
    branches:
      - fix/val-harvest-reclamation-gate

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Focus clarity
        run: python -B -m unittest tools.tests.test_adiscord_val_focus_clarity
      - name: Expansion route contract
        run: python -B -m unittest tools.tests.test_val_contract_ui.TestValExpansionRoute.test_expansion_is_split_into_early_war_bands_and_late_continuation
      - name: Diff check
        run: git diff --check HEAD^ HEAD
